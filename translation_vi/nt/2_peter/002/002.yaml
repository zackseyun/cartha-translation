id: 2PE.2.2
reference: 2 Peter 2:2
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ πολλοὶ ἐξακολουθήσουσιν αὐτῶν ταῖς ἀσελγείαις, δι’ οὓς ἡ ὁδὸς τῆς ἀληθείας βλασφημηθήσεται·
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/002.yaml
  text: And many will follow their sensuality[c][b][a], and because of them the way of the truth will be blasphemed.
translation:
  language: vi
  text: Nhiều người sẽ đi theo sự phóng đãng của họ[a], và vì những người ấy, con đường của chân lý[b] sẽ bị phỉ báng[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “sự trụy lạc”, “sự phóng túng” hoặc “sự dâm đãng”. Từ Hy Lạp chỉ cách hành xử vô liêm sỉ, không kiềm chế, thường có hàm ý tình dục.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “con đường chân lý”. Cụm từ này có lẽ chỉ đức tin và nếp sống Cơ Đốc như con đường phù hợp với chân lý.'
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể dịch: “bị xúc phạm”, “bị bôi nhọ” hoặc “bị nói xấu”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὶ
  choice: nhiều người
  rationale: Cách diễn đạt tự nhiên và trực tiếp, giữ nguyên sức nặng định lượng của tính từ Hy Lạp.
- source_word: ἐξακολουθήσουσιν
  choice: sẽ đi theo
  rationale: Giữ ý theo bước hoặc noi theo một đường lối, đồng thời thể hiện rõ thì tương lai.
- source_word: αὐτῶν
  choice: của họ
  rationale: Đại từ số nhiều quy chiếu về các giáo sư giả trong văn cảnh và gắn tự nhiên với lối sống của họ.
- source_word: ταῖς ἀσελγείαις
  choice: những lối sống buông thả
  rationale: Diễn đạt hành vi vô liêm sỉ, không kiềm chế, thường có sắc thái tình dục nhưng không giới hạn thuật ngữ chỉ vào tội lỗi tình dục; dạng số nhiều được phản ánh bằng “những lối sống”.
- source_word: δι’ οὓς
  choice: vì những người ấy
  rationale: διά với đối cách biểu thị nguyên nhân; cách dịch này cũng làm rõ rằng đại từ chỉ những người vừa được nói đến, tránh sự mơ hồ của “vì họ” trong tiếng Việt.
- source_word: ἡ ὁδὸς τῆς ἀληθείας
  choice: con đường của chân lý
  rationale: Giữ hình ảnh “con đường” và kết cấu sở hữu của nguyên văn, không thu hẹp cụm từ thành một nhãn hiệu giáo phái hoặc chỉ thành giáo lý.
- source_word: βλασφημηθήσεται
  choice: sẽ bị phỉ báng
  rationale: Truyền đạt thể tương lai bị động và ý nghĩa bị nói lời xúc phạm, bôi nhọ; phù hợp khi đối tượng là con đường của chân lý.
theological_decisions:
- issue: Ý nghĩa của “con đường của chân lý”
  choice: Giữ cách diễn đạt “con đường của chân lý” như một chỉ định rộng về đức tin và nếp sống phù hợp với chân lý.
  alternative: “đạo chân lý” hoặc “con đường chân thật”
  rationale: Cách chọn giữ nguyên ẩn dụ và mối liên hệ với “chân lý”, không biến cụm từ thành một thuật ngữ giáo phái hay giải nghĩa quá mức.
- issue: Phạm vi đạo đức của ἀσέλγεια
  choice: “những lối sống buông thả”
  alternative: “những hành vi trụy lạc” hoặc “thói dâm đãng”
  rationale: Từ Hy Lạp thường có hàm ý tình dục nhưng còn bao gồm thái độ vô liêm sỉ và không tự kiềm chế nói chung; bản dịch không nên thu hẹp phạm vi đó.
- issue: Sắc thái của βλασφημέω
  choice: “bị phỉ báng”
  alternative: “bị xúc phạm” hoặc “bị nói xấu”
  rationale: “Phỉ báng” giữ được tính nghiêm trọng của lời nói thù nghịch mà không buộc động từ chỉ mang nghĩa kỹ thuật là xúc phạm trực tiếp đến Đức Chúa Trời.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Đi theo” và “lối sống buông thả” là cách nói tự nhiên; “con đường của chân lý” cố ý giữ sắc thái hình ảnh và thần học của nguyên văn. Dấu chấm phẩy giúp thể hiện quan hệ giữa việc nhiều người noi theo các giáo sư giả và hậu quả là chân lý bị phỉ báng.
