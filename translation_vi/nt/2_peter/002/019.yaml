language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐλευθερίαν αὐτοῖς ἐπαγγελλόμενοι, αὐτοὶ δοῦλοι ὑπάρχοντες τῆς φθορᾶς· ᾧ γάρ τις ἥττηται, τούτῳ ⸀καὶ δεδούλωται.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/019.yaml
  text: promising them freedom while they themselves are servants of corruption[a]; for whatever a person is overcome by[b], by this he is also enslaved.
translation:
  language: vi
  text: Họ hứa hẹn tự do cho họ, trong khi chính họ lại là nô lệ của sự hư hoại; vì ai bị điều gì chế ngự thì cũng đã bị điều ấy nô dịch.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλευθερίαν
  choice: sự tự do
  rationale: Cách diễn đạt tự nhiên trong tiếng Việt hiện đại, đồng thời giữ rõ sự tương phản với tình trạng nô lệ ở vế sau.
- source_word: ἐπαγγελλόμενοι
  choice: hứa cho
  rationale: Giữ đúng ý nghĩa thực hiện một lời hứa và kết hợp tự nhiên với đối tượng tiếp nhận αὐτοῖς.
- source_word: δοῦλοι
  choice: nô lệ
  rationale: Diễn tả địa vị bị lệ thuộc mạnh hơn “đầy tớ”, cần thiết cho sự tương phản giữa tự do được hứa và ách nô lệ thực tế.
- source_word: ὑπάρχοντες
  choice: trong khi chính họ lại là
  rationale: Thể hiện tình trạng thực tế đồng thời với hành vi hứa hẹn và làm nổi bật nghịch lý trong câu.
- source_word: φθορᾶς
  choice: sự hư hoại
  rationale: Giữ được trường nghĩa gồm cả sự suy đồi về đạo đức lẫn hậu quả dẫn đến tiêu vong, không thu hẹp vào riêng một sắc thái.
- source_word: ᾧ γάρ τις ἥττηται
  choice: vì một người bị điều gì chế ngự
  rationale: Diễn đạt tự nhiên một nguyên tắc khái quát, đồng thời bảo toàn thể bị động và ý bị thắng thế hoặc khuất phục.
- source_word: τούτῳ καὶ δεδούλωται
  choice: thì cũng bị điều ấy bắt làm nô lệ
  rationale: Giữ liên hệ từ vựng với “nô lệ” và truyền đạt trạng thái lệ thuộc phát sinh từ hành động hoàn thành của động từ hoàn thành bị động.
- source_word: τις
  choice: một người
  rationale: Đại từ bất định có ý nghĩa khái quát; “một người” tự nhiên và không giới hạn giới tính trong tiếng Việt.
theological_decisions:
- issue: Cách dịch δοῦλοι/δεδούλωται trong sự tương phản giữa tự do giả tạo và tình trạng lệ thuộc thực tế
  choice: Dùng “nô lệ” và “bắt làm nô lệ”.
  alternative: “đầy tớ”, “bị lệ thuộc”, hoặc “ở trong vòng nô lệ”
  rationale: Hình ảnh nô lệ là trọng tâm lập luận của câu. Cách dịch mạnh này bảo toàn nghịch lý và không làm nhẹ mức độ bị sự hư hoại thống trị.
- issue: Phạm vi nghĩa của φθορά
  choice: Giữ cách dịch rộng là “sự hư hoại”.
  alternative: “sự suy đồi”, “sự tiêu vong”, hoặc “sự hủy diệt”
  rationale: Từ Hy Lạp có thể gợi cả sự băng hoại đạo đức và kết cục tàn hoại. “Sự hư hoại” duy trì độ căng và tính đa nghĩa mà không tự ý quyết định chỉ một phương diện.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Lặp lại hình ảnh “nô lệ” có chủ ý để giữ cấu trúc và sức nặng tu từ của nguyên văn; không cần chú thích vì các khả năng từ vựng quan trọng đã được bảo toàn ngay trong bản dịch.
