source:
  edition: SBLGNT
  text: ὀφθαλμοὺς ἔχοντες μεστοὺς μοιχαλίδος καὶ ⸀ἀκαταπαύστους ἁμαρτίας, δελεάζοντες ψυχὰς ἀστηρίκτους, καρδίαν γεγυμνασμένην πλεονεξίας ἔχοντες, κατάρας τέκνα,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/014.yaml
  text: having eyes full of an adulteress and insatiable for sin, enticing unstable souls, having a heart trained in greed, children of a curse,
translation:
  language: vi
  text: đôi mắt họ đầy hình ảnh người đàn bà ngoại tình[a] và không ngừng phạm tội[b], nhử những người không vững vàng; lòng họ đã được rèn luyện trong sự tham lam—họ là con cái của sự nguyền rủa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sát chữ: “đôi mắt đầy một người đàn bà ngoại tình”; cũng có thể hiểu là “đầy sự ngoại tình” hoặc “đầy dục vọng ngoại tình.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “không thể thôi phạm tội” hoặc, theo cách diễn giải, “không biết chán tội lỗi.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: μεστοὺς μοιχαλίδος
  choice: đầy hình bóng người đàn bà ngoại tình
  rationale: Giữ hình ảnh cụ thể ở dạng số ít của nguyên văn (“đầy một người đàn bà ngoại tình”), nhưng thêm “hình bóng” để câu tiếng Việt tự nhiên và diễn đạt rõ rằng ánh mắt họ luôn bị chiếm ngự bởi đối tượng ngoại tình; chú thích bảo lưu nghĩa sát chữ và các cách hiểu diễn giải.
- source_word: ἀκαταπαύστους ἁμαρτίας
  choice: không ngừng phạm tội
  rationale: Phản ánh trực tiếp ý không thôi, không dứt khỏi tội lỗi; tự nhiên hơn trong tiếng Việt so với cách mô phỏng cấu trúc sở hữu của tiếng Hy Lạp. Chú thích ghi nhận cách hiểu liên quan đến lòng ham muốn tội lỗi không biết thỏa.
- source_word: δελεάζοντες
  choice: nhử
  rationale: Từ này gợi việc dùng mồi để dụ bắt; “nhử” giữ được sắc thái săn mồi mạnh hơn “lôi cuốn” mà vẫn ngắn gọn, dễ hiểu.
- source_word: ψυχὰς ἀστηρίκτους
  choice: những người không vững vàng
  rationale: ψυχαί ở đây chỉ con người, còn ἀστήρικτοι nói đến tình trạng chưa vững chắc; cách dịch này tự nhiên và tránh khiến “linh hồn” bị hiểu như một bộ phận tách biệt của con người.
- source_word: καρδίαν γεγυμνασμένην πλεονεξίας
  choice: lòng họ đã được rèn luyện trong sự tham lam
  rationale: “Rèn luyện” giữ hình ảnh tập luyện có chủ ý và lâu dài của γεγυμνασμένην; “sự tham lam” là cách nói hiện đại, rõ nghĩa cho πλεονεξία.
- source_word: κατάρας τέκνα
  choice: con cái của sự nguyền rủa
  rationale: Bảo tồn thành ngữ “con cái của…” trong nguyên văn, thay vì làm phẳng thành “đáng nguyền rủa”; cụm từ có thể diễn tả những kẻ mang đặc tính và ở dưới hậu quả của sự nguyền rủa.
- source_word: ἔχοντες ... ἔχοντες
  choice: mắt đầy ...; lòng họ ...
  rationale: Không lặp máy móc “có… có…” vì thiếu tự nhiên trong tiếng Việt, nhưng vẫn giữ hai nét miêu tả song hành và nhịp lên án dồn dập.
theological_decisions:
- issue: Có nên làm nhẹ hình ảnh tình dục trong μοιχαλίδος hay không
  choice: Giữ hình ảnh cụ thể về người đàn bà ngoại tình trong chính văn
  alternative: Dịch khái quát là “đầy sự ngoại tình” hoặc “đầy dục vọng ngoại tình”
  rationale: Dạng danh từ giống cái số ít tạo một hình ảnh sắc bén, không nên bị xóa bỏ; “hình bóng” giúp chuyển thành tiếng Việt dễ hiểu mà chú thích vẫn nêu nghĩa sát chữ.
- issue: Sắc thái của ἀκαταπαύστους ἁμαρτίας
  choice: không ngừng phạm tội
  alternative: không biết chán tội lỗi
  rationale: Cách chọn chính bảo lưu ý trực tiếp là không thôi phạm tội mà không quyết định quá mức rằng từ này chủ yếu nói đến sự thèm khát; cách hiểu kia được nêu trong chú thích.
- issue: Ý nghĩa của κατάρας τέκνα
  choice: con cái của sự nguyền rủa
  alternative: những kẻ đáng nguyền rủa
  rationale: Giữ nguyên sức nặng và độ mở của thành ngữ, không thu hẹp nó chỉ còn lời đánh giá đạo đức hoặc chỉ còn số phận chịu nguyền rủa.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và mạnh mẽ. Dấu chấm phẩy cùng gạch ngang duy trì chuỗi tố cáo dồn dập của câu Hy Lạp nhưng giúp độc giả tiếng Việt theo dõi rõ các vế. Mọi dấu chú thích [a], [b] đều xuất hiện trong chính văn.
