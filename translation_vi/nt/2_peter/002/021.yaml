  to: Vì thà họ chưa từng biết con đường công chính[a] còn hơn là, sau khi đã biết, trở lui[b] khỏi điều răn thánh đã được truyền cho họ[c].
  rationale: Đổi “quay lưng với” thành “trở lui khỏi” để phản ánh đầy đủ hơn ὑποστρέψαι ἐκ mà vẫn giữ tiếng Việt tự nhiên và không suy diễn thần học. Tách chú thích về động từ quay lui và về việc truyền điều răn thành hai neo riêng, đồng thời chỉnh các phương án thay thế cho tự nhiên và đúng phạm vi từ vựng.
