    rationale: Lựa chọn cho ὑποστρέψαι và cho παραδοθείσης cần các neo riêng để người đọc biết chính xác từng chú thích áp dụng vào đâu. Cụm “quay trở lại khỏi” trong chú thích cũng không tự nhiên trong tiếng Việt.
