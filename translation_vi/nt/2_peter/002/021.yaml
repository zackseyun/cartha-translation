id: 2PE.2.21
reference: 2 Peter 2:21
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: κρεῖττον γὰρ ἦν αὐτοῖς μὴ ἐπεγνωκέναι τὴν ὁδὸν τῆς δικαιοσύνης ἢ ἐπιγνοῦσιν ⸀ὑποστρέψαι ἐκ τῆς παραδοθείσης αὐτοῖς ἁγίας ἐντολῆς·
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/021.yaml
  text: For it would have been better for them not to have known the way of righteousness than[a], after knowing it[c][b], to turn back from the holy commandment delivered to them.
translation:
  language: vi
  text: Vì thà họ chưa từng biết con đường công chính[a] còn hơn là, sau khi đã biết, trở lui[b] khỏi điều răn thánh đã được truyền cho họ[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “con đường của sự công chính”; từ Hy Lạp cũng có thể mang nghĩa “công lý”, nhưng trong văn cảnh này phù hợp hơn với ý về lối sống đúng trước mặt Đức Chúa Trời.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “quay lại khỏi” hoặc “lìa bỏ”.
    reason: lexical_alternative
  - marker: c
    text: Cũng có thể dịch là “được trao truyền cho họ” hoặc “được truyền lại cho họ”.
    reason: lexical_alternative
lexical_decisions:
- source_word: κρεῖττον γὰρ ἦν αὐτοῖς
  choice: Vì thà họ... còn hơn
  rationale: Cấu trúc so sánh này diễn đạt tự nhiên trong tiếng Việt tính hơn kém và điều đáng chọn hơn; “Vì” giữ quan hệ giải thích của γὰρ với câu trước.
- source_word: ἐπεγνωκέναι / ἐπιγνοῦσιν
  choice: chưa từng biết / sau khi đã biết
  rationale: Giữ sự lặp lại của cùng một động từ Hy Lạp và diễn tả nhận thức thực sự, nhưng không thêm sắc thái “biết đầy đủ” vốn có thể quá mạnh.
- source_word: ὁδὸν τῆς δικαιοσύνης
  choice: con đường công chính
  rationale: “Con đường” giữ hình ảnh ὁδός về một lối sống; “công chính” phù hợp với ý nghĩa đạo đức, tức lối sống đúng trước mặt Đức Chúa Trời, trong ngữ cảnh này.
- source_word: ὑποστρέψαι ἐκ
  choice: quay lưng với
  rationale: Cách nói tiếng Việt tự nhiên diễn tả sự từ bỏ sau khi đã biết. Nghĩa đen “quay trở lại khỏi” không tự nhiên; chú thích bảo lưu phương án sát hình ảnh chuyển động ngược hơn.
- source_word: παραδοθείσης αὐτοῖς
  choice: đã được truyền cho họ
  rationale: Diễn đạt thể bị động và hành động chuyển giao của παραδίδωμι mà không thêm sắc thái quản trị hay lịch sử truyền thống.
- source_word: ἁγίας ἐντολῆς
  choice: điều răn thánh
  rationale: Giữ danh từ số ít và sắc thái tôn giáo, đạo đức của ἁγίας; “điều răn” là cách nói rõ ràng, trang trọng và quen thuộc.
theological_decisions:
- issue: Câu này có nên được dịch theo cách giải quyết tranh luận về bội đạo hay chỉ xưng nhận đức tin bề ngoài hay không
  choice: Nói rõ họ đã biết rồi quay lưng, nhưng không thêm kết luận về tình trạng cứu rỗi của họ.
  alternative: Dùng lời lẽ mạnh hơn để hàm ý mất sự cứu rỗi, hoặc nhẹ hơn để hàm ý họ chỉ tiếp xúc hời hợt với đức tin.
  rationale: Bản Hy Lạp khẳng định sự nhận biết và hành động quay khỏi điều răn, nhưng không trực tiếp giải quyết toàn bộ tranh luận thần học về sự bền đỗ hay bội đạo.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Cấu trúc “thà... còn hơn...” làm rõ phép so sánh của nguyên văn. Các thuật ngữ “công chính”, “điều răn thánh” giữ sắc thái Kinh Thánh mà không quá cổ.
