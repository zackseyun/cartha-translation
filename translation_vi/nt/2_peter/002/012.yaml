  to: Nhưng những kẻ này giống như loài vật không có lý trí[a]—vốn theo bản tính được sinh ra để bị bắt và bị hủy diệt[b]. Họ phỉ báng những điều mình không biết[c]; trong sự hủy diệt của mình, họ cũng sẽ bị hủy diệt[d].
  rationale: Bản sửa không thay đổi ý nghĩa đoạn văn, nhưng dùng “phỉ báng” để không áp đặt một đối tượng cho βλασφημοῦντες, chỉnh cú pháp cụm mô tả thú vật cho rõ ràng, và thống nhất “hủy diệt” để thể hiện sự lặp từ của nguyên văn.
