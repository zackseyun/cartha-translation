review_pass:
  verdict: revise
  source_fidelity: 'Bản nháp truyền đạt đúng hình ảnh chính: những kẻ bị lên án được ví với thú vật thiếu lý trí, bị bắt và hủy diệt, phỉ báng điều họ không biết, rồi sẽ bị hủy diệt. Tuy nhiên, “nói lời phạm thượng” trong tiếng Việt thường ngầm chỉ lời xúc phạm Đức Chúa Trời hay điều thánh, trong khi đối tượng của βλασφημοῦντες không được nêu rõ trong câu. “Phỉ báng” giữ được sắc thái gay gắt mà không thu hẹp đối tượng. Cụm “sống theo bản năng tự nhiên, sinh ra” cũng cần sắp xếp lại để phản ánh rõ hơn γεγεννημένα φυσικὰ là mô tả các loài vật trong phép so sánh.'
  naturalness: “Sống theo bản năng tự nhiên, sinh ra” đứng trước “để bị bắt...” hơi gãy và tạo ấn tượng hai ý không liên kết rõ ràng. “Vốn theo bản tính được sinh ra...” tự nhiên hơn trong văn phong trang trọng. Việc dùng nhất quán “hủy diệt” ở các vị trí liên hệ cũng làm lối chơi chữ cuối câu dễ nhận thấy hơn.
  terminology: Giữ “loài vật không có lý trí” là phù hợp cho ἄλογα ζῷα. Dùng “theo bản tính” cho φυσικὰ tránh diễn giải quá mức theo hướng tâm lý học hiện đại, dù chú thích có thể nêu “bản năng tự nhiên.” “Phỉ báng” phù hợp hơn “phạm thượng” vì không xác định đối tượng của lời nói. “Hủy diệt/sự hủy diệt” bảo toàn trường từ vựng φθορά/φθαρήσονται.
  issues:
  - severity: medium
    issue: “Nói lời phạm thượng” có thể thu hẹp đối tượng của βλασφημοῦντες.
    rationale: Động từ này có thể chỉ sự phỉ báng, lăng mạ hoặc nói xúc phạm; câu không nêu đối tượng. “Phạm thượng” trong cách dùng Việt ngữ thường hướng cụ thể đến điều thần thánh hoặc bề trên.
  - severity: low
    issue: Trật tự “sống theo bản năng tự nhiên, sinh ra” chưa gắn kết rõ về cú pháp.
    rationale: γεγεννημένα φυσικὰ mô tả các loài vật được sinh ra theo bản tính/bản năng; đảo lại thành “vốn theo bản tính được sinh ra” giúp cấu trúc tiếng Việt rõ và sát hơn.
  - severity: low
    issue: Trường từ vựng φθορά/φθαρήσονται chưa hoàn toàn nhất quán với “bị tiêu diệt” ở vế đầu.
    rationale: Dùng “hủy diệt/sự hủy diệt/bị hủy diệt” xuyên suốt làm nổi bật hơn sự lặp từ có chủ ý của bản Hy Lạp.
