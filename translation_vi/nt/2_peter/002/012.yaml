reference: 2 Peter 2:12
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οὗτοι δέ, ὡς ἄλογα ζῷα ⸂γεγεννημένα φυσικὰ⸃ εἰς ἅλωσιν καὶ φθοράν, ἐν οἷς ἀγνοοῦσιν βλασφημοῦντες, ἐν τῇ φθορᾷ αὐτῶν ⸂καὶ φθαρήσονται⸃,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/012.yaml
  text: But these[a], like irrational animals—creatures of instinct, born for capture and destruction—blaspheming about things they do not understand, will also be destroyed in their destruction[d][c][b],
translation:
  language: vi
  text: Nhưng những kẻ này giống như loài vật không có lý trí[a]—vốn theo bản tính được sinh ra để bị bắt và bị hủy diệt[b]. Họ phỉ báng những điều mình không biết[c]; trong sự hủy diệt của mình, họ cũng sẽ bị hủy diệt[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “loài vật không biết suy xét.”'
    reason: lexical_alternative
  - marker: b
    text: Nguyên văn ghép ý “được sinh ra theo tự nhiên”; cụm từ mô tả những sinh vật bị chi phối bởi bản tính hoặc bản năng tự nhiên.
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể dịch: “nói lời phạm thượng về những điều họ không biết.”'
    reason: lexical_alternative
  - marker: d
    text: Tiếng Hy Lạp lặp các từ cùng gốc mang nghĩa “sự hủy diệt/bị hủy diệt”, tạo nên lối chơi chữ giữa sự hủy diệt và việc bị hủy diệt.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλογα ζῷα
  choice: loài vật không có lý trí
  rationale: Diễn đạt rõ loài vật không có khả năng suy lý, thay vì chỉ mang nghĩa không biết nói; cách nói hiện đại và giữ được sự đối lập về lý trí trong lời quở trách.
- source_word: γεγεννημένα φυσικὰ
  choice: sống theo bản năng tự nhiên, sinh ra
  rationale: Cụm Hy Lạp cô đọng và khó chuyển từng chữ. Cách dịch này giữ cả ý bị chi phối bởi bản tính/bản năng tự nhiên lẫn hình ảnh sinh ra, mà vẫn tự nhiên trong tiếng Việt.
- source_word: εἰς ἅλωσιν καὶ φθοράν
  choice: để bị bắt và bị tiêu diệt
  rationale: εἰς biểu thị mục đích hoặc kết quả; ἅλωσις là bị bắt, còn φθορά trong hình ảnh về loài vật chỉ sự hủy diệt.
- source_word: ἐν οἷς ἀγνοοῦσιν
  choice: về những điều mình không hiểu
  rationale: Đại từ quan hệ số nhiều giống trung chỉ các sự việc hoặc vấn đề. “Không hiểu” phù hợp với ngữ cảnh họ lên tiếng về điều vượt ngoài hiểu biết của mình.
- source_word: βλασφημοῦντες
  choice: nói lời phạm thượng
  rationale: Giữ sắc thái mạnh của βλασφημέω và tính chất bất kính của lời nói, nhưng không thêm một đối tượng cụ thể mà câu Hy Lạp không nêu.
- source_word: ἐν τῇ φθορᾷ αὐτῶν
  choice: trong sự diệt vong của mình
  rationale: “Diệt vong” phù hợp với hình ảnh bị tiêu diệt và cho phép lặp lại gốc nghĩa với động từ tiếp theo; “của mình” quy chiếu về chính những kẻ đang bị lên án.
- source_word: καὶ φθαρήσονται
  choice: chính họ cũng sẽ bị diệt vong
  rationale: Động từ tương lai bị động ở đây tự nhiên nhất là bị hủy diệt hoặc diệt vong. “Cũng” thể hiện καί, còn việc lặp “diệt vong” giữ lối chơi chữ của nguyên văn.
theological_decisions:
- issue: Sắc thái của βλασφημοῦντες
  choice: Giữ cách nói mạnh “nói lời phạm thượng”.
  alternative: buông lời phỉ báng; nói lời xúc phạm
  rationale: Từ Hy Lạp có thể bao gồm phỉ báng hoặc lăng mạ nhưng trong ngữ cảnh mang sắc thái bất kính mạnh. Bản dịch không xác định thêm đối tượng của lời phạm thượng, nhờ đó giữ độ mở của nguyên văn.
- issue: Nghĩa của φθορά / φθαρήσονται
  choice: Dùng trường nghĩa “tiêu diệt/diệt vong” và giữ sự lặp từ ở cuối câu.
  alternative: bại hoại; hư hoại; suy vong
  rationale: Hình ảnh loài vật bị bắt và tiêu diệt nghiêng về sự hủy diệt hơn là sự sa đọa đạo đức. Cách dịch vẫn không xác định chi tiết bản chất hay thời điểm của sự phán xét.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dấu gạch ngang làm rõ phần so sánh với loài vật; câu được tách tại điểm chuyển từ hình ảnh so sánh sang hành động và kết cục. Các từ “phạm thượng” và “diệt vong” giữ sức nặng của lời cảnh cáo mà không thêm diễn giải hệ phái.
