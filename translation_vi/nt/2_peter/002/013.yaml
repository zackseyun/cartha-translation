  source_fidelity: Cần sửa mệnh đề mở đầu. “Chịu thiệt hại” dễ hiểu là họ bị người khác gây tổn thất và dấu gạch ngang biến μισθὸν ἀδικίας thành lời giải thích tự do. Trong ngữ cảnh báo ứng của câu, ἀδικούμενοι μισθὸν ἀδικίας diễn tả việc họ chịu/nhận sự báo trả tương ứng với điều bất chính của mình. Các phần còn lại theo sát bản SBLGNT, gồm bản đọc ἀπάταις (“những sự lừa dối”).
  naturalness: Bản sửa dùng cú pháp Việt hiện đại, trang trọng và rõ nghĩa hơn. “Những sự lừa dối” tự nhiên và bớt sắc thái khẩu ngữ/trẻ con hơn “những trò lừa dối”; “vết nhơ và tì vết” giữ được cặp hình ảnh nguyên ngữ.
  terminology: “Sự báo trả” nêu rõ chức năng báo ứng của cụm khó mà không áp đặt một học thuyết hình phạt cụ thể. “Sự bất chính,” “hưởng lạc,” và “bữa tiệc yêu thương” phù hợp văn phong Kinh Thánh tiếng Việt hiện đại. Chú thích dị bản được neo đúng tại ἀπάταις.
