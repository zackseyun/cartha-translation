revisions:
- from: Họ chịu thiệt hại—đó là tiền công của sự bất chính[a]—và coi việc buông mình hưởng lạc giữa ban ngày là thú vui. Họ là những vết nhơ và tì ố, thỏa thích trong những trò lừa dối của mình[b] khi dự tiệc cùng anh chị em.
  to: Họ chịu lấy sự báo trả, là tiền công của sự bất chính[a], và coi việc buông mình hưởng lạc giữa ban ngày là thú vui. Họ là những vết nhơ và tì vết, thỏa thích trong những sự lừa dối của mình[b] khi dự tiệc cùng anh chị em.
  rationale: Sửa mệnh đề đầu để phản ánh rõ hơn ý báo ứng của cấu trúc δύσ dịch ἀδικούμενοι μισθὸν ἀδικίας trong văn cảnh, nhưng vẫn giữ chú thích về cách diễn đạt thay thế. Điều chỉnh hai cụm danh từ để tiếng Việt tự nhiên hơn và duy trì hình ảnh đôi của σπίλοι καὶ μῶμοι. Bản đọc chính ἀπάταις và dị bản ἀγάπαις được giữ nguyên theo SBLGNT và chú thích.
