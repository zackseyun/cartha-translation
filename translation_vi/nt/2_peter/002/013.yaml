id: 2PE.2.13
reference: 2 Peter 2:13
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸀ἀδικούμενοι μισθὸν ἀδικίας· ἡδονὴν ἡγούμενοι τὴν ἐν ἡμέρᾳ τρυφήν, σπίλοι καὶ μῶμοι ἐντρυφῶντες ἐν ταῖς ⸀ἀπάταις αὐτῶν συνευωχούμενοι ὑμῖν,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/013.yaml
  text: suffering the wages of unrighteousness[a], considering daytime indulgence a pleasure. They are stains and blemishes, reveling in their deceptions while feasting with you[b],
translation:
  language: vi
  text: Họ chịu lấy sự báo trả, là tiền công của sự bất chính[a], và coi việc buông mình hưởng lạc giữa ban ngày là thú vui. Họ là những vết nhơ và tì vết, thỏa thích trong những sự lừa dối của mình[b] khi dự tiệc cùng anh chị em.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cụm này cũng có thể dịch: “nhận lấy phần báo trả cho việc làm sai trái.”'
    reason: lexical_alternative
  - marker: b
    text: 'Một số thủ bản chép “những bữa tiệc yêu thương” thay cho “những sự lừa dối”: “thỏa thích trong những bữa tiệc yêu thương của mình khi dự tiệc cùng anh chị em.”'
    reason: textual_variant
lexical_decisions:
- source_word: ἀδικούμενοι
  choice: chịu thiệt hại
  rationale: 'Dạng phân từ bị động có nghĩa sát là “bị đối xử bất công/chịu thiệt hại”. Trong văn cảnh, cụm từ mang sắc thái báo ứng đầy nghịch lý: chính những kẻ làm điều bất chính phải chịu hậu quả. Cách dịch này giữ được hình thức bị động và không diễn giải quá mức thành một thuật ngữ hình phạt cụ thể.'
- source_word: μισθὸν ἀδικίας
  choice: tiền công của sự bất chính
  rationale: “Tiền công” giữ hình ảnh μισθός về khoản nhận lại tương ứng với việc làm; “sự bất chính” truyền đạt sức nặng luân lý của ἀδικία và bảo lưu cấu trúc sở hữu vốn có phần cô đọng của tiếng Hy Lạp.
- source_word: ἡδονὴν ἡγούμενοι
  choice: coi ... là thú vui
  rationale: 'Diễn đạt tự nhiên cấu trúc vị ngữ đối cách: họ xem một hành vi là điều đem lại khoái lạc.'
- source_word: τὴν ἐν ἡμέρᾳ τρυφήν
  choice: việc buông mình hưởng lạc giữa ban ngày
  rationale: τρυφή chỉ lối hưởng thụ xa hoa, phóng túng; “giữa ban ngày” giữ điểm nhấn về sự trơ trẽn công khai mà không thu hẹp ý thành một loại cuộc vui cụ thể.
- source_word: σπίλοι καὶ μῶμοι
  choice: những vết nhơ và tì ố
  rationale: Giữ cặp hình ảnh về sự ô uế và khuyết tật về mặt đạo đức, đồng thời dùng thành ngữ trang trọng, dễ hiểu trong tiếng Việt hiện đại.
- source_word: ἐντρυφῶντες
  choice: thỏa thích
  rationale: Diễn tả việc đắm mình và lấy làm khoái trá trong điều xấu; phù hợp với chủ đề hưởng lạc ở vế trước.
- source_word: ἀπάταις αὐτῶν
  choice: những trò lừa dối của mình
  rationale: Theo bản văn SBLGNT là ἀπάταις, nghĩa là những sự lừa dối hoặc thủ đoạn gian trá. “Trò lừa dối” tự nhiên trong tiếng Việt và phù hợp với ngữ cảnh các giáo sư giả.
- source_word: συνευωχούμενοι ὑμῖν
  choice: khi dự tiệc cùng anh chị em
  rationale: Động từ chỉ việc cùng ăn tiệc; “khi” giữ quan hệ đồng thời của phân từ. “Anh chị em” diễn đạt số nhiều ὑμῖν trong lời nói trực tiếp với cộng đồng tín hữu mà không xác định quá mức loại bữa ăn.
theological_decisions:
- issue: Ý nghĩa của ἀδικούμενοι trong quan hệ với μισθὸν ἀδικίας
  choice: Giữ ý “chịu thiệt hại” và dùng dấu gạch ngang để cho thấy “tiền công của sự bất chính” giải thích hậu quả họ nhận lấy.
  alternative: “Nhận lấy phần báo trả cho việc làm sai trái” hoặc “chịu hình phạt là tiền công của sự bất chính”.
  rationale: 'Ngữ pháp có nét khó và nghịch lý: từ thường có nghĩa “bị đối xử bất công/chịu thiệt hại” lại mô tả sự báo ứng dành cho kẻ bất chính. Bản dịch chính giữ sự căng thẳng ấy thay vì âm thầm chuyển thành một thuật ngữ trừng phạt rõ nghĩa hơn.'
- issue: Dị bản ἀπάταις / ἀγάπαις
  choice: Theo SBLGNT, dịch ἀπάταις là “những trò lừa dối của mình” trong chính văn.
  alternative: 'Dị bản ἀγάπαις: “những bữa tiệc yêu thương của mình”.'
  rationale: ἀπάταις là bản đọc được cung cấp và phù hợp với chủ đề lừa dối của các giáo sư giả. Vì ἀγάπαις tạo nên một ý nghĩa khác đáng kể về bữa ăn của cộng đồng, dị bản này được ghi ở chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và trực tiếp. “Buông mình hưởng lạc” và “thỏa thích” truyền đạt sắc thái phóng túng mà không dùng từ cổ hoặc quá chuyên biệt. Đại từ “anh chị em” phù hợp lời nói với cả cộng đồng và tránh cách xưng hô xa cách.
