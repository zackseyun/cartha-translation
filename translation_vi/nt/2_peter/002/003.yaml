revisions:
- from: Vì lòng tham, họ sẽ dùng những lời bịa đặt để trục lợi từ anh chị em.[a] Án phạt dành cho họ từ lâu vẫn không chậm trễ, và sự hủy diệt của họ không ngủ quên.
  to: Vì lòng tham, họ sẽ dùng những lời bịa đặt để bóc lột anh chị em.[a] Sự phán xét dành cho họ từ xưa không hề chậm trễ, và sự hủy diệt của họ không ngủ quên.
  rationale: Thay “trục lợi từ” bằng “bóc lột” để phản ánh rõ hơn ẩn dụ thương mại mang nghĩa khai thác trong ἐμπορεύσονται. Thay “án phạt” bằng “sự phán xét” để giữ độ rộng ngữ nghĩa của κρίμα. Các yếu tố còn lại, gồm tính chắc chắn của sự phán xét và phép nhân hóa ở vế cuối, được duy trì.
