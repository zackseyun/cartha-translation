id: 2PE.2.3
reference: 2 Peter 2:3
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἐν πλεονεξίᾳ πλαστοῖς λόγοις ὑμᾶς ἐμπορεύσονται· οἷς τὸ κρίμα ἔκπαλαι οὐκ ἀργεῖ, καὶ ἡ ἀπώλεια αὐτῶν οὐ ⸀νυστάζει.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/003.yaml
  text: And in greed they will exploit you with fabricated words. Their judgment from long ago is not idle[a], and their destruction is not asleep.
translation:
  language: vi
  text: Vì lòng tham, họ sẽ dùng những lời bịa đặt để bóc lột anh chị em.[a] Sự phán xét dành cho họ từ xưa không hề chậm trễ, và sự hủy diệt của họ không ngủ quên.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát hơn: “biến anh chị em thành món hàng.” Tiếng Hy Lạp dùng hình ảnh buôn bán để nói về việc kiếm lợi từ con người.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πλεονεξίᾳ
  choice: Vì lòng tham
  rationale: Dative diễn tả động cơ hoặc phạm vi hành động; “vì lòng tham” tự nhiên trong tiếng Việt và giữ rõ sức nặng đạo đức.
- source_word: πλαστοῖς λόγοις
  choice: dùng những lời bịa đặt
  rationale: πλαστός chỉ điều được nặn ra, ngụy tạo hay bịa ra; cách dịch này diễn đạt lời lẽ được cố ý tạo dựng chứ không chỉ sai lầm nói chung.
- source_word: ἐμπορεύσονται
  choice: để trục lợi từ anh chị em
  rationale: Động từ mang ẩn dụ thương mại, ở đây chỉ việc coi người khác như phương tiện kiếm lợi. “Trục lợi từ” rõ nghĩa, tự nhiên và vẫn hàm ý bóc lột.
- source_word: κρίμα
  choice: án phạt
  rationale: Trong ngữ cảnh, κρίμα là phán quyết tư pháp bất lợi dành cho các giáo sư giả; “án phạt” truyền đạt tính tư pháp mà không xác định thêm cơ chế hình phạt.
- source_word: ἔκπαλαι
  choice: từ lâu
  rationale: Giữ ý rằng án phạt đã được định sẵn hoặc hiện hữu từ thời xa trước.
- source_word: οὐκ ἀργεῖ
  choice: vẫn không chậm trễ
  rationale: ἀργέω có thể chỉ không nhàn rỗi, không bất động hoặc không trì hoãn. Trong tiếng Việt, “không chậm trễ” tự nhiên, đồng thời giữ ý án phạt chắc chắn đang tiến tới.
- source_word: ἀπώλεια
  choice: sự hủy diệt
  rationale: Giữ nghĩa rộng về sự diệt vong hoặc hủy hoại, không quyết định bản chất hay thời hạn của hình phạt.
- source_word: οὐ νυστάζει
  choice: không ngủ quên
  rationale: 'Giữ phép nhân hóa sống động: sự hủy diệt không buồn ngủ hay bất động, nhưng chắc chắn sẽ đến.'
theological_decisions:
- issue: Bản chất của hình phạt được loan báo
  choice: Dịch thẳng là “án phạt” và “sự hủy diệt”, không xác định thêm cơ chế hay thời hạn.
  alternative: Hiểu “sự hủy diệt” cụ thể là sự tiêu diệt hoàn toàn, hoặc chỉ là sự suy tàn không liên quan đến phán xét cuối cùng.
  rationale: Câu này khẳng định chắc chắn sự phán xét dành cho các giáo sư giả nhưng không tự giải thích đầy đủ bản chất hoặc thời hạn của hình phạt.
- issue: Sắc thái của οὐκ ἀργεῖ
  choice: “vẫn không chậm trễ”
  alternative: “không hề nhàn rỗi” hoặc “không bất động”
  rationale: Từ Hy Lạp cho phép sắc thái không trì hoãn lẫn không bất động. Cách dịch chính tự nhiên trong tiếng Việt; không nên suy diễn thành một lịch trình cánh chung cụ thể.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh chị em” cho đại từ số nhiều ὑμᾶς nhằm nói trực tiếp với cộng đồng tín hữu. Giữ phép nhân hóa ở vế cuối và đặt dấu chú thích [a] ngay sau mệnh đề liên quan.
