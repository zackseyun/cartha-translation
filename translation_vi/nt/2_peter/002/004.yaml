revisions:
- from: Vì nếu Đức Chúa Trời đã không dung tha các thiên sứ khi họ phạm tội, nhưng quăng họ xuống Tạt-ta-rô[a] và giao họ vào xiềng xích của chốn tối tăm âm u, để bị giam giữ chờ ngày phán xét[b],
  to: Vì nếu Đức Chúa Trời đã không dung tha các thiên sứ khi họ phạm tội, nhưng đày họ xuống Tạt-ta-rô[a] và giao họ vào xiềng xích của bóng tối u ám, để bị giam giữ chờ sự phán xét[b],
  rationale: Bản sửa bỏ yếu tố “ngày” không có trong nguyên văn, dùng cách diễn đạt trang trọng hơn cho hành động trừng phạt, và làm gọn cụm chỉ ζόφος. Cấu trúc “giao họ vào xiềng xích ... để bị giam giữ” vẫn phản ánh việc trao nộp vào tình trạng giam cầm và trạng thái bị giữ liên tục của τηρουμένους, mà không giải quyết quá mức các quan hệ cú pháp đang được tranh luận.
