  terminology: “Đức Chúa Trời”, “thiên sứ”, “phán xét”, và “Tạt-ta-rô” phù hợp. Giữ “Tạt-ta-rô” là cần thiết để phản ánh ειδ nghĩa của ταρταρόω, không đồng nhất với “địa ngục”. “Xiềng xích của bóng tối u ám” giữ hình ảnh và tính hàm súc của σειραῖς ζόφου mà không áp đặt cách hiểu locative hay metaphorical.
