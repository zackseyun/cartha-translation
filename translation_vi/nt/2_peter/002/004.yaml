id: 2PE.2.4
reference: 2 Peter 2:4
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Εἰ γὰρ ὁ θεὸς ἀγγέλων ἁμαρτησάντων οὐκ ἐφείσατο, ἀλλὰ ⸀σειραῖς ζόφου ταρταρώσας παρέδωκεν εἰς κρίσιν τηρουμένους,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/004.yaml
  text: For if God did not spare angels when they sinned[a], but cast them into Tartarus and committed them to chains of gloom, to be kept for judgment[b],
translation:
  language: vi
  text: Vì nếu Đức Chúa Trời đã không dung tha các thiên sứ khi họ phạm tội, nhưng đày họ xuống Tạt-ta-rô[a] và giao họ vào xiềng xích của bóng tối u ám, để bị giam giữ chờ sự phán xét[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đày họ xuống địa ngục.” Động từ Hy Lạp ở đây có nghĩa cụ thể là tống vào Tạt-ta-rô, nên chính văn giữ thuật ngữ chính xác hơn này.'
    reason: lexical_alternative
  - marker: b
    text: Một số thủ bản chép “những hố của bóng tối u ám” thay cho “xiềng xích của bóng tối u ám.”
    reason: textual_variant
lexical_decisions:
- source_word: ἐφείσατο
  choice: đã không dung tha
  rationale: Cách diễn đạt tự nhiên trong ngữ cảnh xét xử và trừng phạt, giữ được ý Đức Chúa Trời không miễn hình phạt.
- source_word: ἀγγέλων ἁμαρτησάντων
  choice: các thiên sứ khi họ phạm tội
  rationale: Diễn đạt cấu trúc phân từ thuộc cách bằng một mệnh đề thời gian tự nhiên, đồng thời giữ tính sự kiện của phân từ aorist.
- source_word: ταρταρώσας
  choice: quăng họ xuống Tạt-ta-rô
  rationale: Động từ hiếm này có nghĩa cụ thể là tống vào Tartarus; phiên âm tên riêng giúp bảo toàn hình ảnh đặc thù của nguyên bản thay vì khái quát hóa thành địa ngục.
- source_word: σειραῖς ζόφου
  choice: vào xiềng xích của chốn tối tăm âm u
  rationale: Giữ hình ảnh xiềng xích và sắc thái tối tăm nặng nề, u ám của ζόφος; cách thêm “chốn” làm cụm từ rõ và tự nhiên hơn trong tiếng Việt mà không quyết định xiềng xích là nghĩa đen hay nghĩa bóng.
- source_word: παρέδωκεν
  choice: giao họ vào
  rationale: Thể hiện việc trao nộp vào tình trạng giam giữ trong bối cảnh tư pháp.
- source_word: εἰς κρίσιν
  choice: chờ ngày phán xét
  rationale: Diễn đạt mục tiêu của việc giam giữ là cuộc phán xét sắp đến; “ngày” là bổ sung thành ngữ để tiếng Việt tự nhiên, không xác định bản án trước khi xét xử.
- source_word: τηρουμένους
  choice: để bị giam giữ
  rationale: Giữ nghĩa bị động và trạng thái bị canh giữ liên tục trong khi chờ phán xét.
theological_decisions:
- issue: Cách dịch ταρταρώσας mà không đưa thêm nội hàm giáo lý hậu kỳ
  choice: quăng họ xuống Tạt-ta-rô
  alternative: quăng họ xuống địa ngục
  rationale: Nguyên văn dùng động từ đặc thù bắt nguồn từ Tartarus. Giữ tên này bảo toàn hình ảnh của bản Hy Lạp và tránh đồng nhất nó với một khái niệm địa ngục rộng hơn.
- issue: Mối liên hệ giữa Tạt-ta-rô, “xiềng xích của chốn tối tăm âm u” và việc bị giam giữ
  choice: quăng họ xuống Tạt-ta-rô và giao họ vào xiềng xích của chốn tối tăm âm u, để bị giam giữ
  alternative: quăng họ xuống Tạt-ta-rô trong xiềng xích tối tăm để bị giam giữ
  rationale: Cách dịch giữ đủ các thành tố trong cú pháp cô đọng của tiếng Hy Lạp mà không quyết định quá mức xiềng xích mang tính công cụ, địa điểm hay ẩn dụ.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và dễ hiểu. Dùng “Đức Chúa Trời,” “thiên sứ” và “phán xét” theo cách dùng Kinh Thánh tiếng Việt quen thuộc; phiên âm “Tạt-ta-rô” và giải thích bằng chú thích để vừa bảo toàn tính đặc thù của nguyên bản vừa hỗ trợ độc giả phổ thông.
