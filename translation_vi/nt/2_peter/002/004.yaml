  source_fidelity: 'Bản dịch truyền đạt đúng mạch điều kiện và các nét chính của nguyên văn: Đức Chúa Trời không dung tha các thiên sứ đã phạm tội, đày họ vào Tạt-ta-rô, trao nộp họ cho xiềng xích gắn với bóng tối u ám, và họ đang bị giữ cho cuộc phán xét. Tuy nhiên, “chờ ngày phán xét” thêm từ “ngày”, vốn không có trong εἰς κρίσιν; nên dùng “chờ sự phán xét” để không thêm một xác định thời gian.'
