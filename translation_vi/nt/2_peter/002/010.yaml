  source_fidelity: Cụm “tự mãn” không chuyển tải đầy đủ αὐθάδεις, vốn nhấn mạnh sự tự ý, ngang ngược và ngạo mạn; “ngang ngược” sát ngữ cảnh tố cáo hơn. “Xúc phạm” cũng nhẹ và rộng hơn βλασφημοῦντες, là lời phỉ báng/lăng mạ nhắm vào các δόξας. Các phần còn lại giữ đúng quan hệ cú pháp và không xác định quá mức các đối tượng còn mơ hồ.
