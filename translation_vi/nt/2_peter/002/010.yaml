id: 2PE.2.10
reference: 2 Peter 2:10
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: μάλιστα δὲ τοὺς ὀπίσω σαρκὸς ἐν ἐπιθυμίᾳ μιασμοῦ πορευομένους καὶ κυριότητος καταφρονοῦντας. Τολμηταί, αὐθάδεις, δόξας οὐ τρέμουσιν, βλασφημοῦντες,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/010.yaml
  text: especially those who go after the flesh in the desire for defilement and despise authority[a]. Bold, self-willed, they do not tremble as they blaspheme glorious ones[d][c][b],
translation:
  language: vi
  text: nhất là những kẻ đi theo xác thịt trong dục vọng ô uế[a] và khinh thường quyền cai trị[b]. Cả gan, ngang ngược, họ không run sợ khi phỉ báng các đấng vinh hiển[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “trong lòng ham muốn làm ô uế.”'
    reason: lexical_alternative
  - marker: b
    text: Hay “quyền chủ tể” hoặc “quyền thống trị.”
    reason: lexical_alternative
  - marker: c
    text: “Các đấng vinh hiển” có lẽ chỉ các hữu thể vinh hiển trên trời, có thể là các thiên sứ.
    reason: alternative_reading
lexical_decisions:
- source_word: μάλιστα
  choice: nhất là
  rationale: Đánh dấu sự nhấn mạnh đặc biệt trong nhóm người chịu sự phán xét đã nói ở câu trước.
- source_word: ὀπίσω σαρκὸς
  choice: đi theo xác thịt
  rationale: Giữ hình ảnh và thuật ngữ của nguyên văn; trong ngữ cảnh, cụm này mang sắc thái đạo đức tiêu cực nhưng không bị diễn giải thành một khái niệm thần học hẹp hơn.
- source_word: ἐν ἐπιθυμίᾳ μιασμοῦ
  choice: trong dục vọng ô uế
  rationale: Diễn đạt tự nhiên trong tiếng Việt và giữ được sức nặng đạo đức của ham muốn dẫn đến sự ô nhiễm, bất khiết.
- source_word: κυριότητος
  choice: quyền cai trị
  rationale: Bao quát ý niệm quyền thống trị hoặc quyền làm chủ mà không xác định quá mức đối tượng là Chúa, thiên sứ hay một thẩm quyền cụ thể.
- source_word: καταφρονοῦντας
  choice: khinh thường
  rationale: Thể hiện thái độ coi rẻ và chống lại thẩm quyền.
- source_word: Τολμηταί
  choice: Cả gan
  rationale: Trong ngữ cảnh lên án, từ này chỉ sự táo tợn liều lĩnh chứ không phải lòng can đảm đáng khen.
- source_word: αὐθάδεις
  choice: tự mãn
  rationale: Diễn tả người chỉ chiều theo ý mình, ngoan cố và ngạo mạn; lựa chọn này tự nhiên đối với độc giả hiện đại.
- source_word: δόξας
  choice: các đấng vinh hiển
  rationale: Giữ dạng số nhiều và sắc thái chỉ các hữu thể có vinh quang, đồng thời không xác định thẳng là thiên sứ.
- source_word: οὐ τρέμουσιν, βλασφημοῦντες
  choice: họ không run sợ khi xúc phạm
  rationale: Giữ hình ảnh run sợ và diễn tả phân từ như hành động đồng thời; “xúc phạm” phù hợp khi đối tượng không phải chính Đức Chúa Trời và bao hàm lời lẽ lăng mạ.
theological_decisions:
- issue: Đối tượng của κυριότητος
  choice: quyền cai trị, với đối tượng để ngỏ
  alternative: quyền chủ tể của Chúa; quyền thống trị của các hữu thể thiên thượng
  rationale: Danh từ có thể chỉ quyền làm chủ hay quyền thống trị. Câu này không xác định rõ đối tượng, nên bản dịch không thu hẹp thành một cách hiểu giáo lý duy nhất.
- issue: Đối tượng của δόξας
  choice: các đấng vinh hiển, không xác định cụ thể trong chính văn
  alternative: các thiên sứ; các phẩm vị vinh hiển; những vinh quang
  rationale: Câu kế tiếp nhắc đến các thiên sứ, hỗ trợ cách hiểu là các hữu thể thiên thượng, nhưng chính từ δόξας vẫn mơ hồ hơn; bản dịch bảo toàn độ mở ấy.
- issue: Quan hệ của βλασφημοῦντες với οὐ τρέμουσιν
  choice: 'hành động đồng thời: không run sợ khi xúc phạm'
  alternative: không run sợ mà xúc phạm; không ngần ngại xúc phạm
  rationale: Phân từ hiện tại có thể mô tả hành động đồng thời hoặc cách thức. Cách dịch được chọn gần cấu trúc nguyên văn mà vẫn tự nhiên trong tiếng Việt.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ nhịp tố cáo ngắn, mạnh của nguyên văn; bảo toàn các điểm mơ hồ về “quyền cai trị” và “các đấng vinh hiển.”
