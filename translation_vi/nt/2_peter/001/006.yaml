  text: and in knowledge[a], self-control; and in self-control, steadfastness; and in steadfastness, godliness[b],
translation:
  language: vi
  text: và cùng với sự hiểu biết, tính tự chủ; và cùng với tính tự chủ, lòng kiên trì[a]; và cùng với lòng kiên trì, sự tin kính[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “lòng bền bỉ”, “sự chịu đựng” hoặc “sự nhẫn nại bền bỉ”.
    reason: lexical_alternative
  - marker: b
    text: 'Tiếng Hy Lạp dùng cấu trúc tỉnh lược, tiếp tục chuỗi phẩm chất từ câu trước: mỗi phẩm chất được kết hợp với phẩm chất kế tiếp.'
    reason: cross_reference
lexical_decisions:
- source_word: γνώσει
  choice: sự hiểu biết
  rationale: Diễn đạt trực tiếp γνῶσις bằng tiếng Việt hiện đại, tự nhiên hơn “tri thức” trong chuỗi các phẩm chất đạo đức.
- source_word: ἐγκράτειαν / ἐγκρατείᾳ
  choice: tính tự chủ
  rationale: Chỉ khả năng làm chủ ham muốn và xung lực của bản thân; rõ nghĩa và thông dụng trong tiếng Việt hiện đại.
- source_word: ὑπομονήν / ὑπομονῇ
  choice: lòng kiên trì
  rationale: Thể hiện việc bền lòng đứng vững khi gặp khó khăn, không thu hẹp nghĩa thành sự chờ đợi thụ động.
- source_word: εὐσέβειαν
  choice: sự tin kính
  rationale: Chỉ thái độ tôn kính và tận hiến đối với Đức Chúa Trời được biểu hiện trong đời sống; đây là cách diễn đạt quen thuộc, trang trọng và không giới hạn vào nghi lễ.
- source_word: ἐν δὲ τῇ ... τὴν ...
  choice: và cùng với ..., hãy có ...
  rationale: Cấu trúc Hy Lạp tỉnh lược, tiếp nối lời kêu gọi bổ sung các phẩm chất ở câu trước. “Cùng với” truyền đạt quan hệ kết hợp tự nhiên hơn “trong” trong tiếng Việt, còn “hãy có” chỉ được nêu một lần để làm rõ cú pháp mà vẫn giữ nhịp liệt kê cô đọng.
- source_word: δέ
  choice: và
  rationale: Ở đây δέ nối tiếp các mục trong chuỗi chứ không biểu thị sự tương phản.
theological_decisions:
- issue: Cú pháp tỉnh lược của chuỗi phẩm chất
  choice: Giữ cấu trúc liệt kê cô đọng, chỉ bổ sung “hãy có” ở mệnh đề đầu để câu tiếng Việt rõ nghĩa.
  alternative: Mở rộng từng vế thành “hãy thêm vào” hoặc “hãy thể hiện”.
  rationale: Bản Hy Lạp tiếp nối động từ ở câu trước nhưng không lặp lại động từ trong từng vế. Cách dịch này giúp người đọc hiểu quan hệ giữa các phẩm chất mà không biến lời văn thành một diễn giải thần học rộng hơn.
- issue: Phạm vi nghĩa của εὐσέβεια
  choice: sự tin kính
  alternative: lòng mộ đạo
  rationale: “Sự tin kính” giữ trọng tâm là đời sống tôn kính Đức Chúa Trời, trong khi “lòng mộ đạo” có thể bị hiểu hẹp theo hướng nghi thức hoặc sắc thái tôn giáo bề ngoài.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ nhịp ba vế của nguyên văn; dấu phẩy cuối cho thấy câu vẫn tiếp tục sang câu kế tiếp trong chuỗi phẩm chất. Các dấu chú thích đều được đặt đúng ngay sau từ ngữ liên quan.
