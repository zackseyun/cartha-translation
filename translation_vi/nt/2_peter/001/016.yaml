  - severity: medium
    issue: Cấu trúc “đã không dựa theo ... mà cho ... biết” chưa biểu đạt thật minh bạch thế đối lập của các phân từ với động từ chính.
    rationale: Câu Hy Lạp phủ nhận việc làm cho biết bằng cách theo các huyền thoại và đối lập điều đó với việc trở thành người chứng kiến. Cấu trúc “không phải ... mà ...; nhưng ...” làm rõ quan hệ này.
