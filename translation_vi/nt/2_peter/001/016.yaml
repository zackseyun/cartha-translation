id: 2PE.1.16
reference: 2 Peter 1:16
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Οὐ γὰρ σεσοφισμένοις μύθοις ἐξακολουθήσαντες ἐγνωρίσαμεν ὑμῖν τὴν τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ δύναμιν καὶ παρουσίαν, ἀλλ’ ἐπόπται γενηθέντες τῆς ἐκείνου μεγαλειότητος.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/016.yaml
  text: For we did not make known to you the power and coming of our Lord Jesus the Messiah by following cleverly devised myths[b][a], but by becoming eyewitnesses of his majesty.
translation:
  language: vi
  text: Vì không phải do theo những chuyện hoang đường được khéo léo dựng nên mà chúng tôi đã cho anh chị em biết quyền năng và sự đến[a] của Chúa chúng ta là Đức Giê-su, Đấng Mê-si-a[b]; nhưng chúng tôi đã trở thành những người tận mắt chứng kiến vẻ uy nghi của Ngài.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hy Lạp παρουσία cũng có thể chỉ “sự hiện diện” hoặc “sự đến/đến nơi.” Trong nhiều văn cảnh Tân Ước, từ này nói về sự đến của Đấng Mê-si-a.
    reason: alternative_reading
  - marker: b
    text: Tiếng Hy Lạp là Χριστός (Christos), nghĩa là “Đấng Mê-si-a” hay “Đấng được xức dầu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: σεσοφισμένοις μύθοις
  choice: những chuyện hoang đường được khéo léo dựng nên
  rationale: Diễn đạt cả tính hư cấu của μῦθος lẫn ý được tạo tác tinh vi trong phân từ hoàn thành bị động σεσοφισμένοις, bằng tiếng Việt tự nhiên.
- source_word: ἐξακολουθήσαντες
  choice: dựa theo
  rationale: Trong cấu trúc phủ định, cụm này nêu phương thức bị bác bỏ; “dựa theo” tự nhiên hơn lối dịch sát “đi theo” và giữ rõ sự tương phản với lời chứng trực tiếp.
- source_word: ἐγνωρίσαμεν ὑμῖν
  choice: cho anh chị em biết
  rationale: Giữ nghĩa căn bản là làm cho biết và thể hiện rõ đối tượng gián tiếp ὑμῖν.
- source_word: δύναμιν
  choice: quyền năng
  rationale: “Quyền năng” là cách diễn đạt trang trọng, quen thuộc và trực tiếp cho δύναμις trong văn cảnh nói về Chúa.
- source_word: παρουσίαν
  choice: sự quang lâm
  rationale: Trong văn cảnh Cơ Đốc học, παρουσία nhiều khả năng chỉ cuộc ngự đến của Chúa trong vinh quang. “Quang lâm” diễn đạt tự nhiên sắc thái cánh chung, còn nghĩa rộng “sự hiện diện” hoặc “sự đến” được giữ trong chú thích.
- source_word: κυρίου
  choice: Chúa
  rationale: Đây là cách xưng tụng tiêu chuẩn và tự nhiên cho κύριος khi nói về Đức Giê-su.
- source_word: Χριστοῦ
  choice: Đấng Mê-si-a
  rationale: Χριστός mang chức năng tước hiệu; “Đấng Mê-si-a” truyền đạt ý nghĩa ấy thay vì chỉ phiên âm thành một phần của tên riêng.
- source_word: ἐπόπται γενηθέντες
  choice: chính chúng tôi đã tận mắt chứng kiến
  rationale: Diễn đạt thành ngữ tiếng Việt cho việc trở thành người trực tiếp nhìn thấy, đồng thời làm nổi bật giá trị chứng cứ đối lập với chuyện hoang đường.
- source_word: μεγαλειότητος
  choice: vẻ uy nghi
  rationale: Truyền đạt sự cao cả, oai nghiêm của μεγαλειότης bằng cách nói trang trọng nhưng dễ hiểu.
- source_word: ἐκείνου
  choice: của Ngài
  rationale: Đại từ chỉ trở lại Đức Giê-su; “Ngài” là cách quy chiếu trang trọng, tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Ý nghĩa của παρουσία trong văn cảnh nói về Đức Giê-su
  choice: sự quang lâm
  alternative: sự hiện diện; sự đến
  rationale: Cách dùng Tân Ước và sự kết hợp với “quyền năng” ủng hộ nghĩa cuộc ngự đến mang tính cánh chung, nhưng từ Hy Lạp vẫn có thể mang nghĩa hiện diện hoặc đến, nên không xóa bỏ các khả năng ấy mà ghi trong chú thích.
- issue: Χριστός là tước hiệu hay dạng giống tên riêng
  choice: Đấng Mê-si-a
  alternative: Đấng Christ; Ki-tô
  rationale: Trong cụm này, từ vẫn có thể được hiểu rõ như tước hiệu của Đức Giê-su; “Đấng Mê-si-a” chuyển tải nội dung của tước hiệu mà không áp đặt một truyền thống hệ phái.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh chị em” cho số nhiều ὑμῖν; cấu trúc “không...; trái lại...” làm rõ thế đối lập của câu Hy Lạp. “Quang lâm” là thuật ngữ hơi trang trọng nhưng vẫn thông dụng trong văn liệu Cơ Đốc tiếng Việt, và được giải thích bằng chú thích.
