revisions:
- from: Vì chúng tôi đã không dựa theo những chuyện hoang đường được khéo léo dựng nên mà cho anh chị em biết quyền năng và sự quang lâm[a] của Chúa chúng ta là Đức Giê-su, Đấng Mê-si-a[b]; trái lại, chính chúng tôi đã tận mắt chứng kiến vẻ uy nghi của Ngài.
  to: Vì không phải do theo những chuyện hoang đường được khéo léo dựng nên mà chúng tôi đã cho anh chị em biết quyền năng và sự đến[a] của Chúa chúng ta là Đức Giê-su, Đấng Mê-si-a[b]; nhưng chúng tôi đã trở thành những người tận mắt chứng kiến vẻ uy nghi của Ngài.
  rationale: Sửa cấu trúc câu để giữ rõ phương thức bị phủ định và cơ sở chứng kiến được đối lập trong nguyên văn. Đổi “sự quang lâm” thành “sự đến” để không quyết định quá mức nghĩa của παρουσία, đồng thời duy trì chú thích nêu các nghĩa từ vựng khác. Bổ sung “đã trở thành những người” để phản ánh γενηθέντες mà vẫn tự nhiên trong tiếng Việt.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T00:29:25Z'
