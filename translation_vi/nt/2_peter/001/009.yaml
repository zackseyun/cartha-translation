id: 2PE.1.9
reference: 2 Peter 1:9
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ᾧ γὰρ μὴ πάρεστιν ταῦτα, τυφλός ἐστιν μυωπάζων, λήθην λαβὼν τοῦ καθαρισμοῦ τῶν πάλαι αὐτοῦ ⸀ἁμαρτημάτων.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/009.yaml
  text: For whoever lacks these things is blind[a], being shortsighted[b], having forgotten the cleansing of his former sins.
translation:
  language: vi
  text: Vì ai không có những điều ấy thì mù lòa, chỉ thấy những điều ở gần,[a] và đã quên việc mình được thanh tẩy khỏi những tội lỗi trước kia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “bị cận thị” hay “chỉ thấy điều ở gần.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾧ
  choice: ai
  rationale: Đại từ quan hệ số ít chỉ chung bất cứ người nào có đặc điểm được nói đến; “ai” tự nhiên trong tiếng Việt và không gán giới tính.
- source_word: μὴ πάρεστιν ταῦτα
  choice: không có những điều ấy
  rationale: Diễn đạt tự nhiên ý những điều vừa kể không hiện diện nơi người ấy, đồng thời giữ cách chỉ lại khá rộng của ταῦτα thay vì diễn giải thành “những phẩm chất”.
- source_word: τυφλός
  choice: mù lòa
  rationale: Giữ trực tiếp hình ảnh ẩn dụ của nguyên văn bằng cách diễn đạt trang trọng, quen thuộc.
- source_word: μυωπάζων
  choice: chỉ thấy được điều ở gần
  rationale: Động từ hiếm này có thể chỉ cận thị hoặc chỉ nhìn thấy cái gần; cách dịch mô tả giữ được hình ảnh và tránh thu hẹp quá mức vào thuật ngữ y khoa.
- source_word: λήθην λαβὼν
  choice: đã quên
  rationale: Thành ngữ theo nghĩa đen là “đã nhận sự quên lãng”; “đã quên” là cách chuyển đạt tự nhiên trong tiếng Việt.
- source_word: καθαρισμοῦ
  choice: được thanh tẩy
  rationale: Dạng danh từ sở hữu được chuyển thành cấu trúc động từ tự nhiên, vẫn giữ ý loại bỏ sự ô uế về đạo đức hoặc thuộc linh.
- source_word: τῶν πάλαι αὐτοῦ ἁμαρτημάτων
  choice: khỏi những tội lỗi trước kia
  rationale: Giữ quan hệ thanh tẩy khỏi tội và ý thời gian của πάλαι; tiếng Việt không cần đại từ mang giới tính, còn “mình” làm rõ người được thanh tẩy cũng là chủ thể đã quên.
theological_decisions:
- issue: Quan hệ của καθαρισμός với các tội lỗi
  choice: được thanh tẩy khỏi những tội lỗi
  alternative: sự thanh tẩy những tội lỗi
  rationale: Cách dịch “khỏi” làm rõ sắc thái tách khỏi ô uế vốn tự nhiên trong ngữ cảnh, nhưng không xác định thêm phương thức hay thời điểm thần học của sự thanh tẩy.
- issue: Quan hệ giữa “mù lòa” và μυωπάζων
  choice: mù lòa, chỉ thấy được điều ở gần
  alternative: mù lòa và cận thị
  rationale: Giữ sự căng thẳng tu từ của hai hình ảnh đặt cạnh nhau mà không cố hòa giải chúng thành một tình trạng thị giác duy nhất.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ liên từ “Vì” để nối câu với lập luận trước đó. Dùng “những điều ấy” nhằm chỉ lại các phẩm chất ở các câu trước mà không đưa phần diễn giải vào chính văn.
