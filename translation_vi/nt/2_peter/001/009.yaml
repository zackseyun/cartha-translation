  to: Vì ai không có những điều ấy thì mù lòa, chỉ thấy những điều ở gần,[a] và đã quên việc mình được thanh tẩy khỏi những tội lỗi trước kia.
  rationale: Điều chỉnh chú thích để chỉ nêu các khả năng phù hợp với μυωπάζων trong ngữ cảnh, và sửa cấu trúc tiếng Việt để «sự thanh tẩy» là điều rõ ràng được người ấy quên. Bản sửa vẫn giữ phép căng thẳng tu từ của «mù lòa» đi cùng hình ảnh chỉ thấy điều gần, cũng như quan hệ thanh tẩy khỏi các tội trước kia.
