id: 2PE.1.13
reference: 2 Peter 1:13
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: δίκαιον δὲ ἡγοῦμαι, ἐφ’ ὅσον εἰμὶ ἐν τούτῳ τῷ σκηνώματι, διεγείρειν ὑμᾶς ἐν ὑπομνήσει,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/013.yaml
  text: But I consider it right[a], as long as I am in this tent, to stir you up by way of reminder,
translation:
  language: vi
  text: Nhưng tôi cho là phải lẽ, bao lâu tôi còn ở trong căn lều này[a], dùng lời nhắc nhở mà khơi dậy anh chị em.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nghĩa đen là “lều”; đây là hình ảnh chỉ thân thể và đời sống hữu hạn hiện tại của Phê-rơ.
    reason: lexical_alternative
lexical_decisions:
- source_word: δίκαιον
  choice: điều phải lẽ
  rationale: Trong cấu trúc với ἡγοῦμαι, từ này chỉ điều được xét là đúng đắn, thích hợp hoặc nên làm. “Điều phải lẽ” giữ được sắc thái đạo đức và sự thích đáng mà vẫn tự nhiên trong văn phong trang trọng.
- source_word: δὲ
  choice: Nhưng
  rationale: δέ đánh dấu một bước chuyển có sắc thái tương phản nhẹ với câu trước; “Nhưng” thể hiện rõ mối liên kết ấy.
- source_word: ἡγοῦμαι
  choice: tôi cho rằng
  rationale: Động từ diễn tả một sự đánh giá có cân nhắc, không chỉ là một ý nghĩ thoáng qua.
- source_word: ἐφ’ ὅσον
  choice: bao lâu ... còn
  rationale: 'Kết hợp với εἰμί, cụm từ mang nghĩa thời gian: trong suốt khoảng thời gian người nói vẫn còn ở trong tình trạng được nêu.'
- source_word: σκηνώματι
  choice: căn lều
  rationale: σκηνώμα chỉ chỗ ở như lều và được dùng làm ẩn dụ về đời sống hiện tại trong thân thể. “Căn lều” bảo toàn hình ảnh tạm bợ của nguyên văn và nối tự nhiên với câu kế tiếp.
- source_word: διεγείρειν
  choice: khơi dậy
  rationale: Động từ có nghĩa đánh thức hoặc làm cho tỉnh thức, hăng hái trở lại. “Khơi dậy” phù hợp với hành động thúc giục tinh thần qua việc nhắc nhở mà không thêm một đối tượng không có trong nguyên văn.
- source_word: ἐν ὑπομνήσει
  choice: bằng lời nhắc nhở
  rationale: 'Cụm giới từ diễn tả phương tiện hoặc cách thức: ông khơi dậy người đọc bằng việc nhắc lại cho họ.'
- source_word: ὑμᾶς
  choice: anh chị em
  rationale: Đại từ ngôi thứ hai số nhiều được diễn đạt bằng cách xưng hô cộng đồng tự nhiên, tôn trọng và bao quát trong tiếng Việt hiện đại.
theological_decisions:
- issue: Ẩn dụ “căn lều này”
  choice: Giữ nguyên hình ảnh “căn lều này” trong chính văn.
  alternative: Diễn giải là “thân thể này” hoặc “đời sống trần thế này”.
  rationale: Nguyên văn cố ý dùng ẩn dụ về thân thể hữu hạn và tạm bợ. Giữ “căn lều” bảo toàn hình ảnh và mối liên hệ với việc tháo bỏ lều ở câu sau, trong khi chú thích giúp người đọc hiểu mà không áp đặt một cách diễn giải thần học vào chính văn.
- issue: Sắc thái nghĩa của δίκαιον
  choice: Dịch là “điều phải lẽ”, bao gồm ý đúng đắn và thích hợp.
  alternative: Dịch hẹp hơn là “công chính” hoặc nhẹ hơn là “thích hợp”.
  rationale: Trong ngữ cảnh này, δίκαιον nói về điều Phê-rơ xét là đúng và nên làm; “điều phải lẽ” giữ được cả sắc thái luân lý lẫn sự thích đáng mà không biến câu thành một tuyên bố chuyên biệt về giáo lý công chính.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Cấu trúc “việc ... là điều phải lẽ” giữ quan hệ cú pháp của nguyên văn; “anh chị em” diễn đạt tự nhiên đại từ số nhiều trong lời gửi cộng đồng. Dấu chú thích [a] được đặt ngay sau hình ảnh cần giải thích.
