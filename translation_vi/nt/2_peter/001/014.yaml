id: 2PE.1.14
reference: 2 Peter 1:14
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εἰδὼς ὅτι ταχινή ἐστιν ἡ ἀπόθεσις τοῦ σκηνώματός μου, καθὼς καὶ ὁ κύριος ἡμῶν Ἰησοῦς Χριστὸς ἐδήλωσέν μοι·
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/014.yaml
  text: knowing that the putting off of my tent is near[c][b][a], just as our Lord Jesus the Messiah made clear to me.
translation:
  language: vi
  text: biết rằng chẳng bao lâu nữa[a] tôi sẽ rời bỏ căn lều của mình[b], đúng như Chúa chúng ta là Đức Giê-su, Đấng Mê-si-a, đã tỏ rõ cho tôi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể hiểu: “việc ấy sẽ diễn ra nhanh chóng”.'
    reason: alternative_reading
  - marker: b
    text: “Rời bỏ căn lều” là hình ảnh về việc lìa khỏi thân thể khi qua đời; cũng có thể dịch là “việc đặt căn lều của tôi sang một bên” hoặc “việc dỡ bỏ căn lều của tôi”.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰδὼς
  choice: biết rằng
  rationale: Giữ dạng phân từ và mối liên hệ với câu trước, không xác định quá mức rằng quan hệ này nhất thiết là nguyên nhân.
- source_word: ταχινή
  choice: chẳng bao lâu nữa… sẽ
  rationale: Diễn đạt tự nhiên ý sự việc sắp xảy ra; chú thích giữ khả năng hiểu theo sắc thái diễn ra nhanh chóng.
- source_word: ἀπόθεσις
  choice: tháo bỏ
  rationale: Giữ hình ảnh gỡ hoặc đặt sang một bên, thay vì giải nghĩa trực tiếp là chết.
- source_word: σκηνώματός
  choice: căn lều của mình
  rationale: Giữ nguyên ẩn dụ về thân thể như một nơi ở tạm thời; “căn lều” dễ hiểu hơn từ ngữ cổ hoặc chuyên biệt.
- source_word: καθὼς καὶ
  choice: đúng như
  rationale: Diễn đạt rõ sự đối chiếu và xác nhận trong tiếng Việt hiện đại.
- source_word: κύριος
  choice: Chúa
  rationale: Danh hiệu tiêu chuẩn và phù hợp với ngữ cảnh chỉ về Đức Giê-su.
- source_word: Ἰησοῦς Χριστὸς
  choice: Đức Giê-su, Đấng Mê-si-a
  rationale: Dịch Χριστός theo nghĩa danh hiệu “Đấng Mê-si-a”, đồng thời dùng cấu trúc đồng vị tự nhiên trong tiếng Việt.
- source_word: ἐδήλωσέν
  choice: đã tỏ rõ
  rationale: Thể hiện nghĩa làm cho điều gì trở nên rõ ràng hoặc được biết, không thêm sắc thái mặc khải chuyên biệt.
- source_word: μοι
  choice: cho tôi
  rationale: Chuyển tải tự nhiên bổ ngữ gián tiếp ở ngôi thứ nhất.
theological_decisions:
- issue: Ẩn dụ về cái chết sắp đến của Phi-e-rơ
  choice: Giữ hình ảnh “tháo bỏ căn lều của mình”.
  alternative: Tôi sắp chết; sự ra đi của tôi sắp đến.
  rationale: Nguyên văn không nói thẳng “chết” mà dùng hình ảnh thân thể như căn lều tạm. Giữ ẩn dụ bảo toàn hình tượng và sức căng thần học của câu.
- issue: Cách dịch Χριστός trong Ἰησοῦς Χριστός
  choice: Đức Giê-su, Đấng Mê-si-a
  alternative: Đức Giê-su Cơ Đốc; Đức Chúa Giê-su Christ
  rationale: Trong cụm này, Χριστός vẫn có thể được nghe như danh hiệu. “Đấng Mê-si-a” chuyển tải ý nghĩa ấy minh bạch mà không coi từ này như một họ riêng.
- issue: Sắc thái thời gian của ταχινή
  choice: Sự việc sẽ xảy ra chẳng bao lâu nữa.
  alternative: Sự việc sẽ diễn ra nhanh chóng.
  rationale: Tính từ có thể gợi cả sự gần kề lẫn tính mau lẹ. Bản chính dùng cách hiểu phù hợp nhất với ngữ cảnh, còn chú thích bảo lưu khả năng kia.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cấu trúc mở đầu “biết rằng” chủ ý giữ sự nối tiếp với câu trước. Ẩn dụ căn lều được giữ nguyên nhưng danh hóa Hy Lạp được chuyển thành mệnh đề có động từ để câu tiếng Việt tự nhiên.
