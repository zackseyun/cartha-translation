  source_fidelity: Bản dịch truyền đạt đúng ý chính của câu, gồm phân từ mở đầu, sự gần kề của việc từ bỏ “căn lều,” và điều Chúa Giê-su, Đấng Mê-si-a, đã cho người viết biết. Tuy nhiên, “tháo bỏ căn lều” dễ gợi hành động tháo dỡ một cái lều vật chất hơn là rời khỏi nơi ở tạm thời; “rời bỏ căn lều” giữ hình ảnh và rõ nghĩa hơn. Chú thích về ταχινή hiện được neo sau “căn lều,” không đúng với từ mà nó giải thích.
  naturalness: “Biết rằng” và “đúng như” phù hợp văn phong trang trọng hiện đại. Cấu trúc “Chúa chúng ta là Đức Giê-su, Đấng Mê-si-a” tự nhiên hơn cách đặt các cụm đồng vị bằng hai dấu phẩy sau “Chúa chúng ta.”
  terminology: “Chúa,” “Đức Giê-su,” và “Đấng Mê-si-a” phù hợp với các danh hiệu trong nguyên văn và với quyết định dịch Χριστός như một tước hiệu. “Căn lều” bảo tồn ẩn dụ σκηνώματός.
