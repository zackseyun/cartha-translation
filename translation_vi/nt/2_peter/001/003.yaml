id: 2PE.1.3
reference: 2 Peter 1:3
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ὡς πάντα ἡμῖν τῆς θείας δυνάμεως αὐτοῦ τὰ πρὸς ζωὴν καὶ εὐσέβειαν δεδωρημένης διὰ τῆς ἐπιγνώσεως τοῦ καλέσαντος ἡμᾶς ⸂ἰδίᾳ δόξῃ καὶ ἀρετῇ⸃,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/003.yaml
  text: As his divine power has granted to us all things for life and godliness[a], through the knowledge of the one who called us by his own glory and excellence,
translation:
  language: vi
  text: Vì quyền năng thần linh của Ngài đã ban cho chúng ta mọi điều liên quan đến sự sống và sự tin kính, nhờ sự nhận biết Đấng đã kêu gọi chúng ta bởi vinh quang và sự cao quý riêng của Ngài[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “để đến vinh quang và sự cao quý riêng của Ngài.” Cụm cách dữ trong tiếng Hy Lạp có thể được hiểu theo những cách khác nhau.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ὡς
  choice: Vì
  rationale: Liên từ mở đầu nêu cơ sở cho lời khuyên tiếp theo. “Vì” diễn đạt tự nhiên quan hệ này trong tiếng Việt, trong khi câu vẫn được để mở bằng dấu phẩy để nối với mạch văn kế tiếp.
- source_word: πάντα ... τὰ πρὸς ζωὴν καὶ εὐσέβειαν
  choice: mọi điều cần cho sự sống và lòng tin kính
  rationale: Cụm τὰ πρὸς chỉ những điều liên quan hoặc cần thiết cho một mục đích. “Mọi điều cần cho” tự nhiên trong tiếng Việt và không thu hẹp phạm vi của πάντα.
- source_word: θείας δυνάμεως αὐτοῦ
  choice: quyền năng thần thượng của Ngài
  rationale: “Thần thượng” giữ nghĩa thuộc về thần tính của θεῖος, tránh làm yếu thành chỉ “thiêng liêng”; cấu trúc sở hữu được diễn đạt tự nhiên bằng “của Ngài”.
- source_word: δεδωρημένης
  choice: đã ban cho
  rationale: Động từ diễn tả sự ban tặng rộng rãi, với hành động đã hoàn tất và kết quả còn hiệu lực. “Đã ban cho” vừa trang trọng vừa tự nhiên.
- source_word: διὰ τῆς ἐπιγνώσεως
  choice: qua việc nhận biết
  rationale: Diễn đạt phương tiện bằng một cấu trúc động từ tự nhiên. “Nhận biết” giữ sắc thái hiểu biết mang tính quan hệ mà không cường điệu ἐπίγνωσις thành một thuật ngữ kỹ thuật.
- source_word: τοῦ καλέσαντος ἡμᾶς
  choice: Đấng đã kêu gọi chúng ta
  rationale: Phân từ được dùng như danh từ chỉ một ngôi vị. “Đấng” phù hợp với đối tượng thần linh và “đã kêu gọi” giữ nguyên lực của động từ.
- source_word: ἰδίᾳ
  choice: chính ... của Ngài
  rationale: Cách diễn đạt này bảo toàn sự nhấn mạnh về sở hữu riêng trong ἴδιος.
- source_word: δόξῃ
  choice: vinh quang
  rationale: “Vinh quang” là cách tương đương quen thuộc và phù hợp với ý về vẻ uy nghi được bày tỏ.
- source_word: ἀρετῇ
  choice: sự cao quý
  rationale: ἀρετή có thể chỉ đức hạnh hoặc sự xuất sắc. “Sự cao quý” phù hợp khi nói về Đấng kêu gọi, đồng thời không giới hạn từ này vào đạo đức của con người.
- source_word: ζωὴν
  choice: sự sống
  rationale: Giữ phạm vi rộng của từ Hy Lạp, cho phép cả chiều kích hiện tại lẫn cánh chung mà không thêm ý không có trong nguyên văn.
- source_word: εὐσέβειαν
  choice: lòng tin kính
  rationale: Diễn đạt thái độ và nếp sống hướng về Đức Chúa Trời bằng lối nói tự nhiên, dễ hiểu trong tiếng Việt hiện đại.
theological_decisions:
- issue: Chức năng của cách dữ cách trong cụm ἰδίᾳ δόξῃ καὶ ἀρετῇ
  choice: bởi chính vinh quang và sự cao quý của Ngài
  alternative: đến với chính vinh quang và sự cao quý của Ngài
  rationale: 'Với bản văn SBLGNT đã cho, cách dữ cách có thể được hiểu theo nghĩa phương tiện: Đấng ấy kêu gọi bằng hoặc bởi vinh quang và sự cao quý của mình. Tuy nhiên, cách hiểu theo hướng đích đến vẫn có thể có, nên được giữ trong chú thích thay vì bị loại bỏ.'
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Đại từ “Ngài” cùng danh xưng “Đấng” giữ sự tôn kính mà không xác định thêm danh tính của chủ thể ngoài điều câu Hy Lạp nêu. Dấu phẩy cuối câu bảo toàn cấu trúc phụ thuộc của Ὡς và mối nối sang câu tiếp theo.
