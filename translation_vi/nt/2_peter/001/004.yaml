id: 2PE.1.4
reference: 2 Peter 1:4
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: δι’ ὧν τὰ ⸂τίμια καὶ μέγιστα ἡμῖν⸃ ἐπαγγέλματα δεδώρηται, ἵνα διὰ τούτων γένησθε θείας κοινωνοὶ φύσεως, ἀποφυγόντες τῆς ἐν ⸀τῷ κόσμῳ ἐν ἐπιθυμίᾳ φθορᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/004.yaml
  text: through which he has granted to us his precious and very great promises[a], so that through these you may become sharers in the divine nature[b], having escaped the corruption that is in the world because of sinful desire.
translation:
  language: vi
  text: Nhờ những điều ấy, Ngài đã ban cho chúng ta những lời hứa quý báu và vô cùng lớn lao, để qua những lời hứa ấy, anh chị em trở nên những người dự phần vào bản tính thần linh[a], đã thoát khỏi sự hư hoại trong thế gian liên hệ với ham muốn xấu xa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “những người cùng chia sẻ bản tính thần linh.” Cụm từ nói đến việc dự phần vào điều thuộc về Thiên Chúa, chứ không nói con người trở thành thần linh về bản thể.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch phần cuối: “sự hư hoại trong thế gian bởi dục vọng” hoặc “sự hư hoại trong thế gian ở trong ham muốn.” Từ Hy Lạp có thể chỉ ham muốn nói chung, nhưng tại đây ngữ cảnh mang nghĩa tiêu cực.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δι’ ὧν
  choice: Nhờ những điều ấy
  rationale: διά với sở hữu cách diễn tả phương tiện. Cách dịch này giữ liên hệ hồi chỉ với các thực tại ở câu 3 mà không xác định quá mức tiền ngữ.
- source_word: τίμια καὶ μέγιστα
  choice: quý báu và vô cùng lớn lao
  rationale: τίμια chỉ điều quý giá; μέγιστα là dạng tối cao nhưng trong tiếng Việt tự nhiên có thể truyền đạt cường độ bằng “vô cùng lớn lao” khi bổ nghĩa cho “lời hứa”.
- source_word: ἡμῖν
  choice: cho chúng ta
  rationale: Tặng cách với δωρέομαι biểu thị người tiếp nhận; “cho chúng ta” tự nhiên và sát nghĩa.
- source_word: ἐπαγγέλματα
  choice: các lời hứa
  rationale: Đây là cách tương đương rõ ràng, thông dụng cho những điều Thiên Chúa cam kết ban.
- source_word: δεδώρηται
  choice: Ngài đã ban
  rationale: Thì hoàn thành diễn tả việc ban tặng đã xảy ra với kết quả còn hiệu lực. Chủ ngữ được bổ sung từ ngữ cảnh câu 3; “Ngài” giữ văn phong tôn kính.
- source_word: ἵνα
  choice: để
  rationale: Diễn đạt mục đích hoặc kết quả dự kiến một cách tự nhiên trong tiếng Việt.
- source_word: διὰ τούτων
  choice: qua những lời hứa ấy
  rationale: Đại từ chỉ định gần nhất quy chiếu tự nhiên đến các lời hứa; nói rõ danh từ giúp câu tiếng Việt sáng nghĩa mà không thêm nội dung.
- source_word: γένησθε
  choice: anh chị em có thể trở thành
  rationale: Giữ sắc thái chuyển biến của γίνομαι và tính khả hữu/mục đích của thức giả định; “anh chị em” phân biệt ngôi thứ hai số nhiều với “chúng ta” ở mệnh đề trước.
- source_word: θείας κοινωνοὶ φύσεως
  choice: những người dự phần vào bản tính thần thượng
  rationale: “Dự phần” truyền đạt κοινωνός là cùng chia sẻ/tham dự; “bản tính thần thượng” bảo toàn sức nặng và sự hàm hồ thần học của cụm từ mà không đồng nhất người tin với Thiên Chúa về bản thể.
- source_word: ἀποφυγόντες
  choice: sau khi đã thoát khỏi
  rationale: Phân từ bất định thường biểu thị hành động đi trước; cách dịch này làm rõ quan hệ thời gian mà vẫn giữ liên hệ với việc dự phần.
- source_word: φθορᾶς
  choice: sự hư hoại
  rationale: Bao quát cả ý băng hoại và suy đồi trong ngữ cảnh đạo đức, tự nhiên hơn “sự thối nát” trong văn phong hiện đại.
- source_word: ἐν τῷ κόσμῳ
  choice: trong thế gian
  rationale: Giữ phạm vi của sự hư hoại theo cấu trúc Hy Lạp.
- source_word: ἐν ἐπιθυμίᾳ
  choice: do ham muốn xấu xa gây nên
  rationale: ἐν có thể chỉ hoàn cảnh, phương tiện hoặc nguyên nhân; ngữ cảnh khiến ἐπιθυμία mang sắc thái đạo đức tiêu cực. Bản dịch chính diễn đạt quan hệ nguyên nhân nhưng chú thích bảo lưu độ mở.
theological_decisions:
- issue: θείας κοινωνοὶ φύσεως và ý niệm dự phần
  choice: những người dự phần vào bản tính thần thượng
  alternative: những người cùng chia sẻ bản tính thần thượng
  rationale: Giữ nguyên ngôn ngữ mạnh mẽ về sự dự phần, không thu hẹp thành một hệ thống thần học cụ thể và cũng không hàm ý con người trở thành thần linh về bản thể.
- issue: Sắc thái đạo đức của ἐπιθυμία
  choice: ham muốn xấu xa
  alternative: ham muốn; dục vọng
  rationale: Từ này tự nó có thể chỉ ham muốn nói chung, nhưng sự gắn kết với sự hư hoại của thế gian tạo sắc thái tiêu cực. “Ham muốn xấu xa” rõ nghĩa và không thu hẹp vào ham muốn tình dục.
- issue: Quan hệ cú pháp của ἐν ἐπιθυμίᾳ với φθορά
  choice: do ham muốn xấu xa gây nên
  alternative: trong ham muốn xấu xa; bởi dục vọng
  rationale: Cách hiểu nguyên nhân phù hợp ngữ cảnh, song giới từ ἐν cho phép hơn một sắc thái; vì vậy sự hàm hồ được nêu trong chú thích.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “Ngài” cho chủ thể thần linh được hiểu từ ngữ cảnh và “anh chị em” để thể hiện rõ ngôi thứ hai số nhiều, phân biệt với “chúng ta”. Hai dấu chú thích [a], [b] đều xuất hiện trong chính văn.
