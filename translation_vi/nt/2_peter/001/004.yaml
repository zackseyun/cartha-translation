  terminology: Giữ “lời hứa”, “dự phần”, “bản tính thần linh”, và “sự hư hoại”. Không diễn giải cụm θείας κοινωνοὶ φύσεως thành việc con người trở thành thần linh về bản thể. “Ham muốn xấu xa” truyền đạt sắc thái tiêu cực theo ngữ cảnh nhưng không giới hạn vào dục vọng tình dục.
