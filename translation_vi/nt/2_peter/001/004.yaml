  source_fidelity: 'Bản dịch phản ánh đúng cấu trúc chính: các lời hứa được ban để người nhận trở nên người dự phần vào bản tính thần linh và đã thoát khỏi sự hư hoại. Tuy nhiên, “sau khi đã” làm quan hệ thời gian của phân từ ἀποφυγόντες rõ hơn mức cần thiết, còn “do ... gây nên” chọn riêng cách hiểu nguyên nhân cho ἐν ἐπιθυμίᾳ, vốn có quan hệ cú pháp còn có thể được hiểu rộng hơn.'
