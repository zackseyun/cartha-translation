id: 2PE.1.5
reference: 2 Peter 1:5
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ αὐτὸ τοῦτο δὲ σπουδὴν πᾶσαν παρεισενέγκαντες ἐπιχορηγήσατε ἐν τῇ πίστει ὑμῶν τὴν ἀρετήν, ἐν δὲ τῇ ἀρετῇ τὴν γνῶσιν,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/005.yaml
  text: And for this very reason[a], making every effort, supply in your faith virtue, and in virtue knowledge[d][c][b],
translation:
  language: vi
  text: Chính vì vậy, anh chị em hãy dốc hết nỗ lực mà thêm[c] vào đức tin[a] của mình đức hạnh[b], và vào đức hạnh, tri thức[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Đức tin” (πίστις) cũng có thể được dịch là “lòng tin” hoặc “sự trung tín”.
    reason: lexical_alternative
  - marker: b
    text: Hay “phẩm chất đạo đức ưu tú” thay cho “đức hạnh” (ἀρετή).
    reason: lexical_alternative
  - marker: c
    text: Động từ được dịch là “thêm” cũng có thể dịch là “cung cấp”; động từ này có sắc thái cung ứng cách dồi dào.
    reason: lexical_alternative
  - marker: d
    text: 'Cũng có thể diễn đạt theo cấu trúc sát chữ hơn: “vun bồi đức hạnh trong đức tin của anh chị em, và tri thức trong đức hạnh”.'
    reason: syntactical_alternative
lexical_decisions:
- source_word: καὶ αὐτὸ τοῦτο δὲ
  choice: Cũng chính vì lý do đó
  rationale: Cách dịch này diễn đạt tự nhiên sức nhấn mạnh của αὐτὸ τοῦτο và nối mệnh lệnh với điều vừa nói ở câu trước.
- source_word: σπουδὴν πᾶσαν παρεισενέγκαντες
  choice: hãy dốc hết nỗ lực
  rationale: Cụm này chuyển phân từ Hy Lạp thành cách diễn đạt mệnh lệnh tự nhiên trong tiếng Việt, đồng thời giữ ý chuyên tâm và tận lực.
- source_word: ἐπιχορηγήσατε
  choice: vun bồi
  rationale: Động từ mang ý cung cấp, bổ sung dồi dào. Trong chuỗi các phẩm chất, “vun bồi” tự nhiên hơn “cung ứng” và vẫn thể hiện hành động chủ động làm cho phẩm chất phát triển.
- source_word: ἐν τῇ πίστει ὑμῶν
  choice: trong đức tin của mình
  rationale: Giữ giới từ “trong” và cấu trúc liên kết của nguyên văn; “của mình” quy chiếu tự nhiên về chủ thể số nhiều “anh chị em”.
- source_word: πίστει
  choice: đức tin
  rationale: “Đức tin” là từ tương ứng thông dụng và trực tiếp nhất với πίστις trong ngữ cảnh này; các nghĩa gần như lòng tin hay sự trung tín được ghi ở chú thích.
- source_word: ἀρετήν
  choice: đức hạnh
  rationale: ἀρετή ở đây chỉ phẩm chất đạo đức tốt đẹp. “Đức hạnh” ngắn gọn, trang trọng và dễ hiểu; “phẩm chất đạo đức ưu tú” là cách giải nghĩa dài hơn.
- source_word: γνῶσιν
  choice: tri thức
  rationale: “Tri thức” giữ nghĩa cốt lõi của γνῶσις và phù hợp với danh sách phẩm chất; các cách như “sự hiểu biết” cũng có thể dùng nhưng kém cô đọng hơn.
theological_decisions:
- issue: Nghĩa của πίστις trong danh sách phẩm chất
  choice: đức tin
  alternative: lòng tin; sự trung tín
  rationale: Ngữ cảnh không buộc phải thu hẹp πίστις thành hành vi trung tín hay chỉ cảm thức tin cậy. Bản chính giữ cách dịch rộng và quen thuộc, còn các khả năng từ vựng được nêu trong chú thích.
- issue: Quan hệ giữa các phẩm chất được biểu thị bằng ἐν
  choice: vun bồi … trong …
  alternative: thêm … vào …; lấy … mà vun bồi …
  rationale: Lối dịch chính giữ sự lặp lại và độ mở của ἐν, tránh quyết đoán rằng tác giả chỉ nói đến phép cộng tuần tự. Chú thích nêu cách diễn đạt tự nhiên khác có thể hàm ý bổ sung.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. “Anh chị em” làm rõ đối tượng số nhiều từ ὑμῶν và mệnh lệnh số nhiều. Cấu trúc lặp “vun bồi … trong …” cố ý phản ánh chuỗi ἐν của nguyên văn, dù chú thích cung cấp lối diễn đạt cộng thêm tự nhiên hơn trong tiếng Việt.
