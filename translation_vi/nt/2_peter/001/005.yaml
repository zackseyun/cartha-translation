  - severity: low
    issue: Neo chú thích cho động từ và phương án cú pháp chưa rõ.
    rationale: Chú thích về “vun bồi” đang đặt sau “đức hạnh” thứ hai, dù động từ xuất hiện trước đó; nên đặt ký hiệu ngay sau động từ. Chú thích cú pháp nên neo tại phần cuối của chuỗi.
