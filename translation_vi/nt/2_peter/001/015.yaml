id: 2PE.1.15
reference: 2 Peter 1:15
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: σπουδάσω δὲ καὶ ἑκάστοτε ἔχειν ὑμᾶς μετὰ τὴν ἐμὴν ἔξοδον τὴν τούτων μνήμην ποιεῖσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/015.yaml
  text: And I will make every effort so that[a], after my departure, you may be able at any time to recall these things.
translation:
  language: vi
  text: Và tôi cũng sẽ hết sức cố gắng để sau khi tôi ra đi[a], bất cứ lúc nào anh chị em cũng có thể nhớ lại những điều này.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay nói rõ hơn: “sau khi tôi chết.” Tiếng Hy Lạp viết là “sau khi tôi ra đi.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: σπουδάσω
  choice: tôi cũng sẽ hết sức cố gắng
  rationale: Động từ ở thì tương lai diễn tả sự chuyên tâm và nỗ lực nghiêm túc; “hết sức cố gắng” tự nhiên trong tiếng Việt và giữ được cường độ của nguyên ngữ.
- source_word: δὲ καὶ
  choice: Và ... cũng
  rationale: δὲ nối tiếp ý câu trước hơn là tạo tương phản mạnh, còn καὶ bổ sung một nỗ lực nữa; cách diễn đạt này giữ được cả tính liên kết lẫn sắc thái bổ sung.
- source_word: ἑκάστοτε
  choice: bất cứ lúc nào
  rationale: Từ này chỉ mỗi dịp hoặc bất cứ khi nào cần; “bất cứ lúc nào” diễn đạt tự nhiên khả năng thường xuyên nhớ lại.
- source_word: ἔχειν ὑμᾶς
  choice: anh chị em cũng có thể
  rationale: Trong cấu trúc này, ἔχειν diễn tả việc có khả năng hoặc phương tiện làm điều gì; “có thể” rõ nghĩa và tự nhiên hơn cách dịch sát chữ “có”.
- source_word: μετὰ τὴν ἐμὴν ἔξοδον
  choice: sau khi tôi ra đi
  rationale: ἔξοδος nghĩa đen là sự ra đi và trong ngữ cảnh là cách nói uyển chuyển về cái chết sắp đến của Phi-e-rơ. “Ra đi” giữ hình ảnh của nguyên ngữ mà vẫn tự nhiên trong tiếng Việt.
- source_word: τὴν τούτων μνήμην ποιεῖσθαι
  choice: nhớ lại những điều này
  rationale: Đây là thành ngữ có nghĩa gọi lại trong trí nhớ. “Nhớ lại” vừa tự nhiên vừa giữ sắc thái chủ động hồi tưởng.
- source_word: τούτων
  choice: những điều này
  rationale: Đại từ chỉ những điều Phi-e-rơ vừa nhấn mạnh trong văn mạch; cách dịch trực tiếp này không xác định quá mức nội dung quy chiếu.
theological_decisions:
- issue: Ý nghĩa của ἔξοδος khi nói về kết cuộc sắp đến của Phi-e-rơ
  choice: ra đi
  alternative: chết
  rationale: Bản văn dùng một hình ảnh uyển chuyển thay cho cái chết. Giữ “ra đi” trong chính văn bảo tồn hình ảnh và độ mở của nguyên ngữ; chú thích nêu nghĩa rõ hơn trong ngữ cảnh mà không thay thế hình ảnh ấy.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh chị em” để xưng hô cộng đồng độc giả một cách bao quát; trật tự câu được điều chỉnh nhẹ cho tự nhiên, đồng thời giữ mối liên hệ mục đích và hình ảnh “ra đi” của nguyên ngữ.
