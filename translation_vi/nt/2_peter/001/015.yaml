  verdict: approve
  source_fidelity: 'Bản dịch truyền đạt đúng các yếu tố chính của câu Hy Lạp: lời hứa ở thì tương lai về sự nỗ lực hết sức, mục đích để người nghe có thể nhớ lại các điều đã nói, tính thường xuyên của ἑκάστοτε, và cách nói uyển chuyển ἔξοδος là “ra đi.” Cụm “để ... anh chị em cũng có thể” diễn đạt tự nhiên quan hệ mục đích của cấu trúc nguyên ngữ mà không thêm nội dung.'
  naturalness: Câu tiếng Việt chuẩn hiện đại, mạch lạc và có giọng văn trang trọng, dễ hiểu. “Bất cứ lúc nào” diễn đạt phù hợp sắc thái “mỗi khi/cứ mỗi dịp” của ἑκάστοτε trong ngữ cảnh. Cách xưng hô “anh chị em” tự nhiên khi hướng đến một cộng đồng độc giả.
  terminology: “Ra đi” bảo tồn lối nói ẩn dụ của ἔξοδος thay vì diễn giải ngay là cái chết. Chú thích nêu lựa chọn “chết” như cách hiểu minh thị hơn theo ngữ cảnh, đồng thời cho biết cách diễn đạt của tiếng Hy Lạp. “Những điều này” giữ độ mở quy chiếu của τούτων.
