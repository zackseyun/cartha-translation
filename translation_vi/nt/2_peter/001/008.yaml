id: 2PE.1.8
reference: 2 Peter 1:8
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ταῦτα γὰρ ὑμῖν ὑπάρχοντα καὶ πλεονάζοντα οὐκ ἀργοὺς οὐδὲ ἀκάρπους καθίστησιν εἰς τὴν τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ ἐπίγνωσιν·
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/008.yaml
  text: For if these things are yours and are increasing[c][b][a], they keep you from being ineffective or unfruitful in the knowledge of our Lord Jesus the Messiah.
translation:
  language: vi
  text: Vì nếu những điều ấy hiện có nơi anh em và ngày càng gia tăng[a], chúng sẽ không để anh em trở nên vô dụng hoặc không sinh kết quả trong sự nhận biết[b] Đức Chúa Jêsus, Chúa chúng ta, Đấng Mê-si.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “trở nên dồi dào.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “sự nhận biết đầy đủ.”'
    reason: lexical_alternative
  - marker: c
    text: 'Hy Lạp: “Iēsou Christou”; ở đây dịch là “Đức Chúa Jêsus, Chúa chúng ta, Đấng Mê-si” để giữ ý nghĩa của danh hiệu. Cũng thường được dịch: “Đức Chúa Jêsus Christ.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ταῦτα
  choice: những điều ấy
  rationale: Đại từ chỉ định quy chiếu tự nhiên về các đức tính đã kể trong câu 5–7, không diễn giải thêm thành “những phẩm chất ấy”.
- source_word: ὑμῖν ὑπάρχοντα
  choice: hiện có nơi anh em
  rationale: Diễn đạt cả ý hiện diện lẫn sự sở hữu/liên hệ với người đọc, đồng thời tránh thu hẹp thành vị trí hoàn toàn nội tại.
- source_word: πλεονάζοντα
  choice: ngày càng gia tăng
  rationale: Giữ sắc thái tăng trưởng của phân từ hiện tại trong bối cảnh phát triển các đức tính; “dồi dào” cũng có thể.
- source_word: ἀργούς
  choice: vô dụng
  rationale: Trong thế đối xứng với “không kết quả”, từ này nói đến tình trạng thiếu tác dụng hay thành quả hơn là chỉ lười biếng.
- source_word: ἀκάρπους
  choice: không kết quả
  rationale: Giữ hình ảnh về việc không sinh ra kết quả, bằng cách diễn đạt tự nhiên trong tiếng Việt hiện đại.
- source_word: καθίστησιν
  choice: sẽ khiến anh em không trở nên
  rationale: Thể hiện nghĩa gây nên một tình trạng của động từ cùng cấu trúc phủ định οὐκ...οὐδὲ; dùng “sẽ” theo quan hệ điều kiện-kết quả tự nhiên trong tiếng Việt.
- source_word: εἰς τὴν ... ἐπίγνωσιν
  choice: trong sự nhận biết
  rationale: Diễn đạt phương diện hay phạm vi mà tính hữu dụng và kết quả được xét đến, không ép εἰς thành chuyển động theo nghĩa đen.
- source_word: ἐπίγνωσιν
  choice: sự nhận biết
  rationale: Tự nhiên hơn “tri thức” khi nói đến việc biết một thân vị; sắc thái hiểu biết đầy đủ hơn được giữ trong chú thích.
- source_word: κυρίου
  choice: Chúa
  rationale: Cách dịch danh hiệu κύριος trang trọng, quen thuộc và tự nhiên trong tiếng Việt.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Đức Chúa Jêsus, Đấng Mê-si
  rationale: Dịch Χριστός theo ý nghĩa danh hiệu “Đấng Mê-si” thay vì chỉ phiên âm; cấu trúc tiếng Việt làm rõ quan hệ đồng vị.
theological_decisions:
- issue: Cách dịch Χριστοῦ trong Ἰησοῦ Χριστοῦ
  choice: Đấng Mê-si
  alternative: Đấng Christ
  rationale: Χριστός mang nghĩa danh hiệu “Đấng được xức dầu/Đấng Mê-si”; bản dịch chính giữ ý nghĩa danh hiệu, còn dạng quen thuộc “Đấng Christ” được nêu trong chú thích.
- issue: Sắc thái của ἐπίγνωσις
  choice: sự nhận biết
  alternative: sự nhận biết đầy đủ
  rationale: Không áp đặt sắc thái tăng cường vốn có thể có nhưng không nhất thiết phải được biểu thị rõ ở đây; chú thích bảo tồn khả năng ấy.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. “Anh em” giữ cách xưng hô cộng đồng của thư tín; “Jêsus” theo lối phiên âm Kinh Thánh Việt ngữ quen thuộc. Các dấu chú thích [a], [b], [c] đều xuất hiện trong chính văn.
