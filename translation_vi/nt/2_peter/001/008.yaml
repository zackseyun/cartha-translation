  - severity: low
    issue: Cụm “không trở nên vô dụng hay không kết quả”
    rationale: Cụm này có hai phủ định nối bằng “hay”, gây vấp và có thể mơ hồ trong tiếng Việt. “không để anh em trở nên vô dụng hoặc không sinh kết quả” diễn đạt rõ cặp οὐκ ... οὐδὲ.
  - severity: low
    issue: 'Chú thích c ghi “Hy Lạp: ‘Jêsus Christos’”'
    rationale: Nguyên văn là dạng biến cách Ἰησοῦ Χριστοῦ. Có thể nêu phiên âm sát hơn là “Iēsou Christou”, đồng thời vẫn giải thích cách dịch danh hiệu.
