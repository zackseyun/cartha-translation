  text: τοῦτο πρῶτον γινώσκοντες ὅτι πᾶσα προφητεία γραφῆς ἰδίας ἐπιλύσεως οὐ γίνεται,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/020.yaml
  text: 'knowing this first: that every prophecy of Scripture does not come about from one''s own interpretation.'
translation:
  language: vi
  text: Trước hết, hãy biết rằng mọi lời tiên tri trong Kinh Thánh không phát sinh từ sự giải nghĩa riêng[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “không do sự giải thích riêng mà có.” Cụm từ Hy Lạp này được hiểu khác nhau; trong văn mạch kế tiếp, tác giả nói về nguồn gốc của lời tiên tri.'
    reason: Giữ sự mơ hồ của ἰδίας ἐπιλύσεως và hướng nguồn gốc của γίνεται, không áp đặt cách hiểu giáo phái rằng đây đơn thuần là lệnh cấm cá nhân giải thích Kinh Thánh.
lexical_decisions:
- source_word: τοῦτο πρῶτον γινώσκοντες
  choice: Trước hết, anh em phải biết điều này
  rationale: Diễn đạt tự nhiên sức nhấn của πρῶτον và sắc thái yêu cầu nhận biết trong phân từ γινώσκοντες, phù hợp lời tác giả đang nói trực tiếp với độc giả.
- source_word: πᾶσα προφητεία γραφῆς
  choice: mọi lời tiên tri trong Kinh Thánh
  rationale: Giữ πᾶσα là “mọi” thay vì chuyển thành “không lời nào”; γραφῆς được hiểu là chỉ Kinh Thánh, còn quan hệ sở thuộc được diễn đạt tự nhiên bằng “trong” mà không quyết định quá mức liệu đó là lời tiên tri thuộc Kinh Thánh hay lời tiên tri được ghi trong Kinh Thánh.
- source_word: ἰδίας ἐπιλύσεως
  choice: sự giải nghĩa riêng của một người
  rationale: ἐπίλυσις có nghĩa là sự giải thích hoặc giải nghĩa; ἰδίας nhấn mạnh tính riêng, và “của một người” giữ khả năng quy chiếu đến chính người nói tiên tri hoặc một cá nhân nói chung.
- source_word: οὐ γίνεται
  choice: đều không phát sinh từ
  rationale: γίνεται được dịch là “phát sinh” để giữ ý nguồn gốc hoặc sự xuất hiện của lời tiên tri; “từ” diễn đạt quan hệ nguồn gốc hàm chứa khi kết hợp với ἐπιλύσεως.
theological_decisions:
- issue: Câu này nói về nguồn gốc của lời tiên tri hay cách độc giả giải thích Kinh Thánh
  choice: Giữ cấu trúc cho thấy lời tiên tri không phát sinh từ sự giải nghĩa riêng của một người
  alternative: Không ai được tự ý giải nghĩa lời tiên tri trong Kinh Thánh
  rationale: Chủ ngữ ngữ pháp là “mọi lời tiên tri trong Kinh Thánh,” và οὐ γίνεται tự nhiên nói đến việc lời tiên tri phát sinh hay xuất hiện. Bản dịch không biến câu này thành một lệnh cấm trực tiếp đối với việc cá nhân đọc và giải thích Kinh Thánh, đồng thời vẫn giữ nét mơ hồ của ἐπίλυσις.
- issue: Phạm vi phủ định trong πᾶσα ... οὐ
  choice: mọi ... đều không
  alternative: không lời tiên tri nào
  rationale: Giữ gần hình thức của nguyên văn và lớp tham khảo tiếng Anh đã được duyệt. Trong tiếng Việt, “mọi ... đều không” truyền đạt cùng phạm vi tổng quát mà không đảo cấu trúc thành “không ... nào”.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh em” để thể hiện đối tượng số nhiều được hàm ý trong văn cảnh, dù đại từ này không được phát biểu trực tiếp trong mệnh đề Hy Lạp. Không thêm chú thích vì bản dịch chính đã có thể giữ sự căng thẳng giữa “giải nghĩa” và nguồn gốc của lời tiên tri.
