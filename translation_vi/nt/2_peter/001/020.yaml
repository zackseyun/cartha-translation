revisions:
- from: 'Trước hết, anh em phải biết điều này: mọi lời tiên tri trong Kinh Thánh đều không phát sinh từ sự giải nghĩa riêng của một người.'
  to: Trước hết, hãy biết rằng mọi lời tiên tri trong Kinh Thánh không phát sinh từ sự giải nghĩa riêng[a].
  rationale: Sửa câu để sát hơn với ngữ pháp và độ mơ hồ của tiếng Hy Lạp, đồng thời cải thiện văn phong tiếng Việt. Bản sửa vẫn giữ cách trình bày “mọi lời tiên tri ... không” của tuyến kiểm chứng tiếng Anh, thay vì chuyển hẳn sang một cấu trúc diễn giải hoặc một mệnh lệnh về việc giải thích Kinh Thánh.
  reviewer_model: gpt-5.6-terra
