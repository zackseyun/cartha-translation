  text: ἐν δὲ τῇ εὐσεβείᾳ τὴν φιλαδελφίαν, ἐν δὲ τῇ φιλαδελφίᾳ τὴν ἀγάπην·
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/007.yaml
  text: and in godliness[a], brotherly affection; and in brotherly affection, love.
translation:
  language: vi
  text: và thêm vào sự tin kính tình thân ái giữa anh chị em; thêm vào tình thân ái giữa anh chị em tình yêu thương.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐσεβείᾳ
  choice: lòng tin kính
  rationale: Diễn đạt sự sùng kính hướng về Đức Chúa Trời được thể hiện trong nếp sống, bằng một cụm từ tự nhiên và trang trọng trong tiếng Việt hiện đại.
- source_word: φιλαδελφίαν
  choice: tình thân ái giữa anh chị em
  rationale: Giữ sắc thái tình cảm gia đình dành cho anh chị em, đặc biệt là giữa những người cùng đức tin, đồng thời phân biệt với ἀγάπη ở cuối câu.
- source_word: ἀγάπην
  choice: tình yêu thương
  rationale: Cách dịch rộng và tự nhiên, bảo toàn vị trí cao điểm của từ này sau tình thân ái giữa anh chị em mà không thu hẹp phạm vi đối tượng.
- source_word: ἐν δὲ τῇ ... τὴν ...
  choice: và thêm vào ... ...
  rationale: Trong ngữ cảnh chuỗi đức tính bắt đầu ở câu 5, cách diễn đạt này làm rõ ý bổ sung đức tính kế tiếp, đồng thời giữ cấu trúc lặp song song của nguyên văn.
- source_word: δέ
  choice: và
  rationale: Ở đây δέ có chức năng nối tiếp trong một danh sách tích lũy, không mang ý tương phản mạnh.
theological_decisions:
- issue: Phân biệt φιλαδελφία với ἀγάπη trong chuỗi đức tính
  choice: Dịch φιλαδελφία là “tình thân ái giữa anh chị em” và ἀγάπη là “tình yêu thương”
  alternative: Dịch φιλαδελφία là “tình yêu thương anh chị em” và ἀγάπη là “tình yêu thương”
  rationale: Hai từ Hy Lạp có liên hệ nhưng khác nhau được đặt liền nhau có chủ ý. “Tình thân ái giữa anh chị em” giữ nét tình cảm gia đình và tránh làm mất sự phân biệt với “tình yêu thương” có phạm vi rộng hơn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh chị em” thay vì chỉ “anh em” để diễn đạt cộng đồng người tin một cách tự nhiên và bao quát; giữ phép lặp nhằm phản ánh nhịp điệu của nguyên văn.
