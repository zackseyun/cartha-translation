  to: Vì thế, tôi sẽ luôn sẵn lòng nhắc anh chị em về những điều này, dù anh chị em đã biết và đã được vững lập trong chân lý hiện có[a].
  rationale: Chỉnh cụm dịch τῇ παρούσῃ ἀληθείᾳ từ “chân lý đang hiện diện” thành “chân lý hiện có” để tiếng Việt tự nhiên hơn và phản ánh sát hơn ý chân lý hiện đang thuộc về hoặc ở với người nhận. Chú thích nêu một khả năng diễn đạt khác, không biến cụm từ thành một thuật ngữ thần học.
