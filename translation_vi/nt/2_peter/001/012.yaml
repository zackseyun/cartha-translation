id: 2PE.1.12
reference: 2 Peter 1:12
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Διὸ ⸀μελλήσω ἀεὶ ὑμᾶς ὑπομιμνῄσκειν περὶ τούτων, καίπερ εἰδότας καὶ ἐστηριγμένους ἐν τῇ παρούσῃ ἀληθείᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/012.yaml
  text: Therefore I will always be ready to remind you about these things[a], even though you know them and have been established in the present truth.
translation:
  language: vi
  text: Vì thế, tôi sẽ luôn sẵn lòng nhắc anh chị em về những điều này, dù anh chị em đã biết và đã được vững lập trong chân lý hiện có[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “trong chân lý đang ở với anh chị em.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὸ
  choice: Vì thế
  rationale: Liên từ suy luận nối câu này với lập luận ngay trước đó; “Vì thế” tự nhiên và giữ rõ quan hệ kết luận.
- source_word: μελλήσω
  choice: tôi sẽ luôn sẵn lòng
  rationale: Dạng tương lai của μέλλω đi với động từ nguyên mẫu ở đây có thể diễn tả ý định hoặc sự sẵn sàng, chứ không chỉ một việc sắp xảy ra tức thời.
- source_word: ἀεὶ
  choice: luôn
  rationale: Diễn tả hành động được thực hiện liên tục hoặc lặp đi lặp lại.
- source_word: ὑπομιμνῄσκειν
  choice: nhắc
  rationale: Động từ có nghĩa khiến người khác nhớ lại; “nhắc” là cách diễn đạt tự nhiên, còn sắc thái tiếp diễn đã được thể hiện bằng “luôn”.
- source_word: περὶ τούτων
  choice: về những điều này
  rationale: περί với sở hữu cách mang nghĩa “về, liên quan đến”; cách dịch này rõ ràng trong tiếng Việt hiện đại.
- source_word: καίπερ
  choice: dù
  rationale: Giữ đúng quan hệ nhượng bộ giữa việc độc giả đã biết và việc tác giả vẫn nhắc họ.
- source_word: εἰδότας
  choice: anh chị em đã biết
  rationale: Phân từ của οἶδα có ὑμᾶς làm chủ thể theo nghĩa; “đã biết” diễn đạt trạng thái hiểu biết sẵn có mà không cần lặp lại tân ngữ.
- source_word: ἐστηριγμένους
  choice: đã được vững lập
  rationale: Giữ thể bị động và trạng thái bền vững do một hành động trước đó đem lại; “vững lập” vừa sát nghĩa vừa trang trọng.
- source_word: ἐν τῇ παρούσῃ ἀληθείᾳ
  choice: trong chân lý đang hiện diện
  rationale: Giữ gần cấu trúc Hy Lạp và nghĩa căn bản của παρούσῃ là “đang hiện diện/có mặt”, đồng thời tránh biến cụm từ thành một thuật ngữ chỉ một thời kỳ thần học.
theological_decisions:
- issue: Ý nghĩa của “chân lý đang hiện diện”
  choice: Giữ cách diễn đạt “chân lý đang hiện diện” trong chính văn.
  alternative: chân lý anh chị em hiện có
  rationale: Bản Hy Lạp không xác định đây là một loại chân lý mang tính thời kỳ hay một thuật ngữ giáo lý riêng. Chính văn giữ sự mơ hồ của παρούσῃ, còn chú thích nêu cách hiểu tự nhiên là chân lý hiện đang thuộc về hoặc có giữa các độc giả.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Anh chị em” diễn đạt số nhiều ὑμᾶς theo lối bao hàm, tự nhiên trong cộng đồng đức tin; “vững lập” giữ sắc thái bền vững của phân từ hoàn thành bị động.
