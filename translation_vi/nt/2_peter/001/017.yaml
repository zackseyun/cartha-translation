reference: 2 Peter 1:17
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: λαβὼν γὰρ παρὰ θεοῦ πατρὸς τιμὴν καὶ δόξαν φωνῆς ἐνεχθείσης αὐτῷ τοιᾶσδε ὑπὸ τῆς μεγαλοπρεποῦς δόξης· ⸂Ὁ υἱός μου ὁ ἀγαπητός μου οὗτός ἐστιν⸃, εἰς ὃν ἐγὼ εὐδόκησα—
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/017.yaml
  text: 'For when he received honor and glory from God the Father[a], such a voice was borne to him from the Majestic Glory: “This is my Son, my Beloved[c][b], in whom I am well pleased”—'
translation:
  language: vi
  text: 'Vì khi Ngài nhận được sự tôn quý và vinh quang từ Đức Chúa Trời là Cha, một tiếng phán như sau đã được truyền đến Ngài từ Vinh Quang Uy Nghi[a]: “Đây là Con Ta, Đấng yêu dấu của Ta[b]; Ta đẹp lòng về Con[c]”—'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “bởi Vinh Quang Uy Nghi.” Giới từ Hy Lạp ὑπό có thể chỉ tác nhân; “từ” nhấn mạnh nguồn phát ra tiếng phán và tự nhiên hơn trong tiếng Việt.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “Đây là Con yêu dấu của Ta.” Sát nguyên văn hơn: “Đây là Con Ta, Đấng yêu dấu của Ta.”'
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể dịch: “Ta hài lòng về Con” hoặc “nơi Con, Ta đã vui lòng.” Động từ Hy Lạp ở hình thức quá khứ và giới từ được dùng sát chữ có nghĩa là “vào/nơi”, nhưng cả cụm là một thành ngữ cũng vang vọng lời phán trong các trình thuật về báp-têm và sự biến hình của Chúa Giê-su.'
    reason: alternative_reading
lexical_decisions:
- source_word: λαβὼν γὰρ
  choice: Vì khi Ngài nhận được
  rationale: Phân từ bất định quá khứ được diễn đạt bằng mệnh đề thời gian tự nhiên trong tiếng Việt; γάρ được giữ bằng “Vì” để nối quan hệ giải thích với văn cảnh trước.
- source_word: παρὰ θεοῦ πατρὸς
  choice: từ Đức Chúa Trời là Cha
  rationale: παρά với sở hữu cách chỉ nguồn. Cách diễn đạt này giữ cả θεός và πατήρ, đồng thời tránh cách hiểu rằng đây là hai chủ thể khác nhau.
- source_word: τιμὴν καὶ δόξαν
  choice: sự tôn quý và vinh quang
  rationale: Giữ riêng cả hai danh từ; “sự tôn quý” diễn đạt τιμή trong nghĩa danh dự được ban cho, còn “vinh quang” là cách dịch trực tiếp, quen thuộc của δόξα.
- source_word: φωνῆς ἐνεχθείσης αὐτῷ
  choice: một tiếng phán ... đã được truyền đến Ngài
  rationale: Giữ thể bị động của ἐνεχθείσης và hướng đến của αὐτῷ. “Tiếng phán” phù hợp với lời tuyên bố có nội dung từ Đức Chúa Trời mà không biến động từ thành “Ngài nghe”.
- source_word: τοιᾶσδε
  choice: như sau
  rationale: Từ này hướng tới nội dung được trích dẫn ngay sau đó; “như sau” là cách diễn đạt tự nhiên và chính xác trong tiếng Việt hiện đại.
- source_word: ὑπὸ τῆς μεγαλοπρεποῦς δόξης
  choice: từ Vinh Quang Uy Nghi
  rationale: “Từ” diễn đạt nguồn của tiếng phán một cách tự nhiên; “Vinh Quang Uy Nghi” giữ lối nói tôn kính, gần như một danh xưng chỉ sự hiện diện vinh hiển của Đức Chúa Trời.
- source_word: Ὁ υἱός μου ὁ ἀγαπητός μου οὗτός ἐστιν
  choice: Đây là Con Ta, Đấng yêu dấu của Ta
  rationale: Giữ cấu trúc đồng vị và hai lần đại từ sở hữu μου, thay vì gộp thành “Con yêu dấu của Ta”.
- source_word: εἰς ὃν ἐγὼ εὐδόκησα
  choice: Ta hài lòng về Con
  rationale: Diễn đạt thành ngữ Hy Lạp bằng tiếng Việt tự nhiên, giữ đại từ nhấn mạnh ἐγώ qua chủ ngữ “Ta”; chú thích ghi nhận hình thức quá khứ và những cách dịch sát chữ hơn.
theological_decisions:
- issue: Lối nói τῆς μεγαλοπρεποῦς δόξης chỉ Đức Chúa Trời
  choice: Vinh Quang Uy Nghi
  alternative: vinh quang uy nghiêm; Đấng Uy Nghi Vinh Hiển
  rationale: Viết hoa để cho thấy đây là lối nói tôn kính chỉ sự hiện diện thần thượng, nhưng không thay cụm từ bằng một danh xưng được giải nghĩa rộng hơn nguyên văn.
- issue: Cấu trúc lời Cha tuyên phán về Con
  choice: Đây là Con Ta, Đấng yêu dấu của Ta
  alternative: Đây là Con yêu dấu của Ta
  rationale: Giữ cấu trúc đồng vị và sự lặp lại của μου, qua đó bảo toàn trọng âm của nguyên văn mà không thêm một công thức tín lý về sau.
- issue: Thì và giới từ trong εἰς ὃν ἐγὼ εὐδόκησα
  choice: Ta hài lòng về Con
  alternative: nơi Con, Ta đã vui lòng; Ta đẹp lòng về Con
  rationale: Bản chính ưu tiên tiếng Việt rõ ràng trong lời tuyên phán, còn chú thích bảo tồn hình thức quá khứ và cách diễn đạt sát giới từ nhằm tránh che khuất độ căng giữa hình thức Hy Lạp và nghĩa thành ngữ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Đại từ “Ngài” chỉ Chúa Giê-su theo văn cảnh; “Ta/Con” giữ sắc thái của lời phán trực tiếp từ Cha. Dấu gạch ngang cuối câu được giữ vì cú pháp tiếp tục sang câu kế tiếp.
