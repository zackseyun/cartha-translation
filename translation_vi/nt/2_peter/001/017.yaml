- from: 'Vì khi Ngài nhận được sự tôn quý và vinh quang từ Đức Chúa Trời là Cha, một tiếng phán như sau đã được truyền đến Ngài từ Vinh Quang Uy Nghi[a]: “Đây là Con Ta, Đấng yêu dấu của Ta[b]; Ta hài lòng về Con[c]”—'
