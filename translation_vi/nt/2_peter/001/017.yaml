    rationale: Chú thích a bàn về giới từ ὑπό trong ὑπὸ τῆς μεγαλοπρεποῦς δόξης; cần neo tại cụm này để người đọc không hiểu nhầm là chú thích cho παρὰ θεοῦ πατρός.
  - severity: low
