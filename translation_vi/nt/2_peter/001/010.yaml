  terminology: «Sự kêu gọi», «sự tuyển chọn», «vững chắc», và «vấp ngã» đều phù hợp nguyên ngữ và không áp đặt một cách giải thích giáo phái. Giữ «anh em» trong chính văn, với chú thích về cách hiểu bao gồm cộng đồng, là thích hợp.
  issues:
