id: 2PE.1.10
reference: 2 Peter 1:10
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: διὸ μᾶλλον, ἀδελφοί, σπουδάσατε βεβαίαν ὑμῶν τὴν κλῆσιν καὶ ἐκλογὴν ποιεῖσθαι· ταῦτα γὰρ ποιοῦντες οὐ μὴ πταίσητέ ποτε·
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/010.yaml
  text: Therefore[a], brothers, be all the more diligent to make your calling and election sure, for if you do these things, you will certainly never stumble.
translation:
  language: vi
  text: Vì vậy, thưa anh em[a], hãy càng chuyên tâm hơn nữa để làm cho sự kêu gọi và sự tuyển chọn của anh em được vững chắc; vì nếu làm những điều ấy, anh em chắc chắn sẽ không bao giờ vấp ngã.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “thưa anh chị em”; từ Hy Lạp theo hình thức là “anh em” nhưng có thể dùng để gọi chung toàn thể cộng đồng tín hữu.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ
  choice: Vì vậy
  rationale: Giữ rõ quan hệ suy luận với lời khuyên ở phần trước, đồng thời tự nhiên trong tiếng Việt hiện đại.
- source_word: μᾶλλον
  choice: càng phải
  rationale: 'Diễn đạt lực tăng cường của từ so sánh đối với mệnh lệnh σπουδάσατε: cần chuyên tâm hơn nữa dựa trên điều vừa nói.'
- source_word: ἀδελφοί
  choice: thưa anh em
  rationale: Giữ hình thức giống đực số nhiều của tiếng Hy Lạp trong lời xưng hô; chú thích nêu rõ từ này có thể bao gồm toàn thể cộng đồng tín hữu.
- source_word: σπουδάσατε
  choice: phải chuyên tâm
  rationale: Truyền đạt lời thúc giục phải sốt sắng, tận lực và nghiêm túc; cách nói này trang trọng nhưng vẫn dễ hiểu.
- source_word: βεβαίαν
  choice: được vững chắc
  rationale: Nêu ý được xác nhận, củng cố hoặc thiết lập vững vàng mà không hàm ý người tin làm phát sinh sự kêu gọi hay tuyển chọn của Đức Chúa Trời.
- source_word: κλῆσιν
  choice: sự kêu gọi
  rationale: Là cách dịch quen thuộc và chính xác cho hành động Đức Chúa Trời kêu gọi, đồng thời giữ sự liên tục về thuật ngữ thần học.
- source_word: ἐκλογὴν
  choice: sự tuyển chọn
  rationale: Diễn đạt hành động chọn lựa của Đức Chúa Trời mà không áp đặt một hệ thống giáo phái cụ thể.
- source_word: ποιεῖσθαι
  choice: làm cho ... được
  rationale: Phản ánh trực tiếp cấu trúc gây khiến của cụm từ, trong đó sự kêu gọi và tuyển chọn được làm cho vững chắc hay được xác nhận.
- source_word: ταῦτα
  choice: những điều ấy
  rationale: Chỉ trở lại các phẩm chất và việc thực hành được liệt kê trong ngữ cảnh trước.
- source_word: ποιοῦντες
  choice: nếu làm
  rationale: Diễn đạt tự nhiên giá trị điều kiện của phân từ trong mệnh đề này.
- source_word: οὐ μὴ ... ποτε
  choice: chắc chắn sẽ không bao giờ
  rationale: Giữ cường độ phủ định mạnh của cấu trúc Hy Lạp, gồm cả ý 'không bao giờ'.
- source_word: πταίσητέ
  choice: vấp ngã
  rationale: Giữ hình ảnh ẩn dụ về sự vấp ngã hay thất bại, không tự ý thu hẹp thành phạm bất kỳ tội nào hoặc sa ngã chung cuộc.
theological_decisions:
- issue: Ý nghĩa của việc làm cho sự kêu gọi và tuyển chọn được vững chắc
  choice: Giữ lời khuyên rằng tín hữu phải chuyên tâm làm cho sự kêu gọi và tuyển chọn mình được xác nhận hoặc củng cố trong đời sống.
  alternative: Hiểu rằng nỗ lực của con người làm phát sinh hoặc quyết định sự kêu gọi và tuyển chọn của Đức Chúa Trời.
  rationale: Cấu trúc ποιεῖσθαι với βεβαίαν nói đến việc làm cho vững chắc hay xác nhận. Bản dịch giữ nguyên sức căng giữa hành động có trước của Đức Chúa Trời và trách nhiệm chuyên tâm của người tin, không áp đặt khuôn khổ Cải Chánh hay Arminius.
- issue: Phạm vi của lời hứa 'chắc chắn sẽ không bao giờ vấp ngã'
  choice: Giữ nguyên ẩn dụ rộng về việc không vấp ngã khi kiên trì thực hành những điều ấy.
  alternative: Diễn giải thành sự vô tội tuyệt đối hoặc riêng thành sự bảo đảm không bao giờ sa ngã chung cuộc.
  rationale: πταίω có nghĩa căn bản là vấp hay thất bại. Cách dịch này bảo tồn độ rộng của câu mà không biến nó thành tuyên bố giáo lý chi tiết hơn nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và mang sắc thái khuyên bảo. Đại từ “anh em” được lặp lại để câu tiếng Việt rõ chủ thể; dấu chấm phẩy giữ mối liên hệ chặt giữa lời khuyên và lý do.
