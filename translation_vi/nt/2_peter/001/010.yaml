  source_fidelity: Bản nháp truyền đạt đúng mạch suy luận, lời kêu gọi siêng năng, các thuật ngữ «sự kêu gọi» và «sự tuyển chọn», cùng phủ định nhấn mạnh «chắc chắn sẽ không bao giờ vấp ngã». Tuy nhiên, «càng phải chuyên tâm» chưa biểu đạt thật rõ sắc thái tăng cường μᾶλλον («càng ... hơn nữa»), và «mình» sau hai danh từ thần học hơi kém rõ ràng; dùng «của anh em» bám sát ὑμῶν hơn.
