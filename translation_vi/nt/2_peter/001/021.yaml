  terminology: Giữ “lời tiên tri”, “Đức Chúa Trời”, và “Đức Thánh Linh”, là các thuật ngữ rõ ràng và nhất quán. “Những người” không làm mất nghĩa đại diện của ἄνθρωποι và tránh sắc thái gượng của “những con người.”
  issues:
