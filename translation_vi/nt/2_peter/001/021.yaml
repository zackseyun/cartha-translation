  source_fidelity: 'Bản thảo giữ đúng bố cục và các quan hệ chính của câu Hy Lạp: lời tiên tri không do ý muốn con người, còn những người nói thì nói từ Đức Chúa Trời dưới tác động của Đức Thánh Linh. Tuy nhiên, “những con người” không tự nhiên trong tiếng Việt hiện đại; “do ý muốn con người” diễn đạt rõ hơn phương tiện/nguồn gốc phủ định. “Thúc đẩy” là cách diễn đạt tự nhiên cho φερόμενοι, đồng thời chú thích giữ hình ảnh cụ thể “được mang đi.”'
