  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οὐ γὰρ θελήματι ἀνθρώπου ἠνέχθη ⸂προφητεία ποτέ⸃, ἀλλὰ ὑπὸ πνεύματος ἁγίου φερόμενοι ἐλάλησαν ⸀ἀπὸ θεοῦ ἄνθρωποι.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/021.yaml
  text: For prophecy was never brought forth by the will of man[c][b][a], but men spoke from God as they were carried along by the Holy Spirit.
translation:
  language: vi
  text: Vì lời tiên tri không bao giờ được đưa ra do ý muốn con người,[a] nhưng những người đã nói từ Đức Chúa Trời khi được Đức Thánh Linh thúc đẩy.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “được làm phát sinh do ý muốn con người.” Động từ Hy Lạp ở thể bị động và có cùng gốc với từ được dịch là “thúc đẩy” ở phần sau của câu.'
    reason: lexical_alternative
  - marker: b
    text: 'Sát chữ: “được mang đi” hoặc “được đưa đi” bởi Đức Thánh Linh. Hình ảnh này nhấn mạnh sự tác động và hướng dẫn chủ động của Đức Thánh Linh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: θελήματι ἀνθρώπου
  choice: bởi ý muốn của con người
  rationale: Giữ sắc thái phương tiện của cách dữ cách và số ít mang nghĩa đại diện, đồng thời diễn đạt tự nhiên rằng lời tiên tri không bắt nguồn từ ý chí con người.
- source_word: ἠνέχθη
  choice: được đưa ra
  rationale: Giữ thể bị động của φέρω và ý niệm lời tiên tri được đem đến hay phát sinh; cách nói này tự nhiên hơn trong tiếng Việt mà không làm yếu nghĩa nguồn gốc.
- source_word: προφητεία
  choice: lời tiên tri
  rationale: Trong ngữ cảnh này, cụm từ chỉ lời sứ điệp hay phát ngôn tiên tri; “lời tiên tri” là cách diễn đạt thông dụng, rõ nghĩa trong tiếng Việt.
- source_word: ποτέ
  choice: không bao giờ
  rationale: Kết hợp với οὐ tạo lời phủ định mạnh về bất kỳ thời điểm nào.
- source_word: ὑπὸ πνεύματος ἁγίου
  choice: được Đức Thánh Linh dẫn dắt
  rationale: ὑπό với sở hữu cách đánh dấu tác nhân; danh xưng xác định được diễn đạt theo lối gọi trang trọng và quen thuộc trong tiếng Việt.
- source_word: φερόμενοι
  choice: khi được ... dẫn dắt
  rationale: Diễn đạt tác động chủ động và có tính định hướng của Đức Thánh Linh. Chú thích bảo lưu hình ảnh sát chữ “được mang đi” và mối liên hệ với ἠνέχθη.
- source_word: ἐλάλησαν
  choice: đã nói
  rationale: Cách tương đương trực tiếp, không nâng giọng văn quá mức.
- source_word: ἀπὸ θεοῦ
  choice: từ Đức Chúa Trời
  rationale: Giữ rõ nghĩa nguồn gốc của ἀπό, phân biệt với tác nhân được biểu thị bằng ὑπό ở cụm nói về Đức Thánh Linh.
- source_word: ἄνθρωποι
  choice: những con người
  rationale: Giữ sự đối lập giữa những người nói là con người với nguồn lời nói là Đức Chúa Trời, mà không thêm ý loại trừ phụ nữ vốn không bắt buộc bởi danh từ Hy Lạp trong cách dùng đại diện.
theological_decisions:
- issue: Mối quan hệ giữa tác động của Đức Chúa Trời và hành động của con người trong lời tiên tri
  choice: Con người thật sự nói, nhưng nguồn của lời họ nói là Đức Chúa Trời và họ nói trong khi được Đức Thánh Linh dẫn dắt.
  alternative: Hiểu đây là sự đọc chính tả máy móc của Thánh Linh, hoặc cho rằng lời tiên tri một phần bắt nguồn từ sáng kiến độc lập của con người.
  rationale: Bản Hy Lạp đồng thời khẳng định hành động thật của con người (ἐλάλησαν ἄνθρωποι), nguồn thần thượng (ἀπὸ θεοῦ) và tác động quyết định của Đức Thánh Linh (ὑπὸ πνεύματος ἁγίου φερόμενοι). Bản dịch không giải tiêu sự căng thẳng này theo một cực nào.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Chúa Trời” và “Đức Thánh Linh” theo cách gọi phổ biến trong tiếng Việt Cơ Đốc. Cụm “những con người” giữ nét đối chiếu thần học với Đức Chúa Trời nhưng không áp đặt nghĩa chỉ nam giới. Hai dấu chú thích [a], [b] đều có mặt trong chính văn.
