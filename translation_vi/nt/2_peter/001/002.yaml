  source_fidelity: 'Bản dịch giữ đúng cấu trúc lời chúc của nguyên văn: χάρις và εἰρήνη là chủ ngữ, πληθυνθείη được diễn đạt bằng lời cầu chúc bị động “Nguyện ... được gia tăng,” và ἐν ἐπιγνώσει được giữ là “trong sự nhận biết.” Cụm “Đức Chúa Trời và Đức Giê-su, Chúa chúng ta” phản ánh hai đối tượng của sự nhận biết, với “Chúa chúng ta” quy chiếu Đức Giê-su. Chú thích a bảo tồn cách hiểu phương tiện có thể có của ἐν; chú thích b bảo tồn sắc thái tăng cường khả dĩ của ἐπίγνωσις.'
  naturalness: Tiếng Việt chuẩn hiện đại, trang trọng và tự nhiên trong thể văn thư tín. “Nguyện ân điển và bình an được gia tăng cho anh chị em” là một lời chúc rõ nghĩa; “anh chị em” diễn đạt số nhiều bao quát mà không thêm một giới tính cụ thể. Cách đặt hai ký hiệu chú thích ngay sau câu là hợp lệ và rõ ràng.
  terminology: “Ân điển,” “bình an,” “Đức Chúa Trời,” “Đức Giê-su,” và “Chúa” nhất quán với văn phong Kinh Thánh tiếng Việt hiện đại và giữ được trọng lượng tôn giáo của các thuật ngữ Hy Lạp. “Sự nhận biết” không ép ἐπίγνωσις thành một thuật ngữ kỹ thuật, trong khi chú thích nêu lựa chọn sắc thái mạnh hơn.
