id: 2PE.1.2
reference: 2 Peter 1:2
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: χάρις ὑμῖν καὶ εἰρήνη πληθυνθείη ἐν ἐπιγνώσει τοῦ θεοῦ καὶ Ἰησοῦ τοῦ κυρίου ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/002.yaml
  text: Grace to you and peace be multiplied in the knowledge of God and of Jesus our Lord[a][b].
translation:
  language: vi
  text: Nguyện ân điển và bình an được gia tăng cho anh chị em trong sự nhận biết Đức Chúa Trời và Đức Giê-su, Chúa chúng ta.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “nhờ sự nhận biết Đức Chúa Trời và Đức Giê-su, Chúa chúng ta.” Giới từ Hy Lạp có thể chỉ phạm vi (“trong”) hoặc phương tiện (“nhờ”, “bởi”).'
    reason: alternative_reading
  - marker: b
    text: “Sự nhận biết” cũng có thể dịch là “sự nhận biết đầy đủ” hoặc “sự hiểu biết trọn vẹn”; từ Hy Lạp ἐπίγνωσις đôi khi mang sắc thái nhận biết đầy đủ hay sâu sắc hơn.
    reason: lexical_alternative
lexical_decisions:
- source_word: χάρις
  choice: ân điển
  rationale: Thuật ngữ quen thuộc trong lời chúc đầu thư, vừa giữ sắc thái lời chào vừa diễn đạt ân huệ từ Đức Chúa Trời.
- source_word: εἰρήνη
  choice: bình an
  rationale: Cách dịch tự nhiên, trang trọng, giữ được chiều sâu của lời chúc và âm hưởng Semit.
- source_word: πληθυνθείη
  choice: nguyện ... được gia tăng
  rationale: Thể mong ước bị động trong tiếng Hy Lạp được diễn đạt bằng cấu trúc lời chúc tiếng Việt; “được gia tăng” giữ nét bị động mà vẫn tự nhiên hơn “được nhân lên” trong ngữ cảnh này.
- source_word: ἐν
  choice: trong
  rationale: Giữ cách hiểu chỉ phạm vi và không loại trừ hoàn toàn sắc thái phương tiện; cách hiểu “nhờ” được nêu trong chú thích.
- source_word: ἐπιγνώσει
  choice: sự nhận biết
  rationale: Tự nhiên trong tiếng Việt và phù hợp với sự hiểu biết mang tính nhận thức, quan hệ; không ép thuật ngữ thành nghĩa kỹ thuật “sự nhận biết đầy đủ”.
- source_word: θεοῦ
  choice: Đức Chúa Trời
  rationale: Cách gọi trang trọng, thông dụng trong văn phong Kinh Thánh tiếng Việt.
- source_word: Ἰησοῦ
  choice: Đức Giê-su
  rationale: Phiên âm tên riêng theo lối hiện đại, với kính ngữ phù hợp văn phong Cơ Đốc tiếng Việt.
- source_word: κυρίου
  choice: Chúa
  rationale: Giữ tước hiệu có sức nặng Cơ Đốc học và cách dùng Tân Ước thông dụng.
- source_word: τοῦ θεοῦ καὶ Ἰησοῦ τοῦ κυρίου ἡμῶν
  choice: Đức Chúa Trời và Đức Giê-su, Chúa chúng ta
  rationale: Cho thấy cả Đức Chúa Trời lẫn Đức Giê-su đều là đối tượng của “sự nhận biết”; dấu phẩy làm rõ “Chúa chúng ta” đồng vị với Đức Giê-su.
theological_decisions:
- issue: Sắc thái của ἐπίγνωσις
  choice: sự nhận biết
  alternative: sự nhận biết đầy đủ; sự hiểu biết trọn vẹn
  rationale: Từ này có thể hàm ý sự nhận biết đầy đủ hơn, nhưng câu chính không nên áp đặt một sắc thái kỹ thuật vượt quá điều văn cảnh đòi hỏi; khả năng mạnh hơn được giữ trong chú thích.
- issue: Chức năng của ἐν trước ἐπιγνώσει
  choice: trong sự nhận biết
  alternative: nhờ sự nhận biết; bởi sự nhận biết
  rationale: Giới từ có thể chỉ phạm vi hoặc phương tiện. Bản chính dùng “trong” để bám sát cấu trúc và giữ độ mở; cách hiểu chỉ phương tiện được ghi chú.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh chị em” để diễn đạt đại từ số nhiều ὑμῖν theo cách bao quát; giữ cấu trúc lời chúc bằng “Nguyện”. Mọi dấu chú thích đều xuất hiện trong bản văn chính.
