id: 2PE.1.19
reference: 2 Peter 1:19
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἔχομεν βεβαιότερον τὸν προφητικὸν λόγον, ᾧ καλῶς ποιεῖτε προσέχοντες ὡς λύχνῳ φαίνοντι ἐν αὐχμηρῷ τόπῳ, ἕως οὗ ἡμέρα διαυγάσῃ καὶ φωσφόρος ἀνατείλῃ ἐν ταῖς καρδίαις ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/019.yaml
  text: And we have the prophetic word more certain[a], to which you do well to pay attention as to a lamp shining in a dark place[b], until the day dawns and the morning star rises in your hearts.
translation:
  language: vi
  text: Và chúng ta có lời tiên tri chắc chắn hơn[a], lời mà anh em làm tốt khi chú tâm, như chú tâm vào một ngọn đèn đang chiếu sáng nơi tối tăm, cho đến khi ngày rạng và sao mai[b] mọc lên trong lòng anh em.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “chúng ta có lời tiên tri chắc chắn hơn.” Tiếng Hy Lạp có thể được hiểu là lời tiên tri được lời chứng của các sứ đồ xác nhận, hoặc là lời tiên tri có tính chắc chắn vượt trội.'
    reason: alternative_reading
  - marker: b
    text: “Sao mai” có thể gợi đến hình ảnh về Đấng Mê-si; xem Khải Huyền 22:16.
    reason: cross_reference
lexical_decisions:
- source_word: βεβαιότερον
  choice: càng chắc chắn
  rationale: Giữ lực so sánh của tính từ và cách hiểu có tính vị ngữ trong mạch văn, nhưng không thêm ý 'được làm cho' vốn không được nói rõ trong tiếng Hy Lạp.
- source_word: προφητικὸν λόγον
  choice: lời tiên tri
  rationale: Tự nhiên trong tiếng Việt, giữ được cả yếu tố 'lời' và tính chất tiên tri mà không thu hẹp thành một lời tiên tri riêng lẻ.
- source_word: ᾧ καλῶς ποιεῖτε προσέχοντες
  choice: Anh em nên chú tâm vào lời ấy
  rationale: Diễn đạt tự nhiên thành lời khuyên; 'chú tâm' chuyển tải sự lưu ý cẩn thận của προσέχω.
- source_word: λύχνῳ φαίνοντι
  choice: ngọn đèn đang chiếu sáng
  rationale: Giữ hình ảnh so sánh và sắc thái tiếp diễn của phân từ hiện tại.
- source_word: αὐχμηρῷ τόπῳ
  choice: nơi tối tăm
  rationale: Phù hợp với sự tương phản ánh sáng–bóng tối và tự nhiên hơn các nghĩa như 'ẩm tối' hay 'u ám' trong ngữ cảnh này.
- source_word: ἡμέρα διαυγάσῃ
  choice: ngày mới rạng
  rationale: Thành ngữ tiếng Việt tự nhiên, giữ hình ảnh bình minh và sự sáng dần.
- source_word: φωσφόρος
  choice: sao mai
  rationale: Tương đương thông dụng cho ngôi sao báo sáng trong ngữ cảnh thiên thể, không đưa cách nhận diện thần học vào chính văn.
- source_word: ἀνατείλῃ
  choice: mọc lên
  rationale: Động từ tự nhiên đối với sao, bảo toàn hình ảnh thiên thể.
- source_word: ἐν ταῖς καρδίαις ὑμῶν
  choice: trong lòng anh em
  rationale: Cách nói Kinh Thánh quen thuộc nhưng vẫn hiện đại; 'lòng' chỉ con người bên trong chứ không chỉ cảm xúc.
theological_decisions:
- issue: Quan hệ của βεβαιότερον với lời chứng của các sứ đồ và lời tiên tri
  choice: Dịch 'chúng ta càng chắc chắn về lời tiên tri' để giữ ý so sánh mà không khẳng định rõ cơ chế xác chứng.
  alternative: '''chúng ta có lời tiên tri chắc chắn hơn'' hoặc ''lời tiên tri được xác nhận chắc chắn hơn'''
  rationale: Cú pháp Hy Lạp có thể được hiểu là lời tiên tri được lời chứng tận mắt xác nhận, hoặc nhấn mạnh rằng lời tiên tri là điều chắc chắn hơn. Bản dịch chính giữ độ mở và tránh nói rõ rằng lời tiên tri đã 'được làm cho' chắc chắn.
- issue: Đối tượng được biểu trưng bởi 'sao mai'
  choice: Giữ nguyên hình ảnh 'sao mai' trong chính văn.
  alternative: Nêu rõ đó là Đấng Mê-si hoặc sự soi sáng vào thời sau cùng.
  rationale: Câu này không trực tiếp xác định đối tượng; giữ hình ảnh cho phép âm hưởng Mê-si và cánh chung vẫn hiện diện mà không áp đặt cách giải thích.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng và dễ hiểu. Dùng 'anh em' cho số nhiều trong cộng đồng tín hữu; tránh lối văn quá cổ. Hai dấu chú thích đều xuất hiện trong chính văn.
