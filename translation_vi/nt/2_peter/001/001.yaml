id: 2PE.1.1
reference: 2 Peter 1:1
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸀Συμεὼν Πέτρος δοῦλος καὶ ἀπόστολος Ἰησοῦ Χριστοῦ τοῖς ἰσότιμον ἡμῖν λαχοῦσιν πίστιν ἐν δικαιοσύνῃ τοῦ θεοῦ ἡμῶν καὶ σωτῆρος Ἰησοῦ Χριστοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/001.yaml
  text: 'Simeon Peter[a], a servant and apostle of Jesus the Messiah[d][c][b], to those who have obtained a faith as precious as ours in the righteousness of our God and Savior Jesus the Messiah:'
translation:
  language: vi
  text: Si-mê-ôn Phi-e-rơ, nô lệ và sứ đồ của Jêsus, Đấng Mê-si, gửi đến những người đã nhận được đức tin quý báu ngang với đức tin của chúng tôi, trong sự công chính của Đức Chúa Trời và Đấng Cứu Rỗi chúng ta là Jêsus, Đấng Mê-si:[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đức tin có địa vị ngang với đức tin của chúng tôi.” Tính từ Hy Lạp có thể nhấn mạnh giá trị, danh dự hoặc đặc ân ngang nhau.'
    reason: lexical_alternative
  - marker: b
    text: “Trong sự công chính” cũng có thể dịch là “nhờ sự công chính” hoặc “bởi sự công chính”; giới từ Hy Lạp có thể chỉ phạm vi hoặc phương tiện.
    reason: lexical_alternative
  - marker: c
    text: 'Cách hiểu tự nhiên nhất của câu Hy Lạp là “Đức Chúa Trời và Đấng Cứu Rỗi chúng ta là Jêsus, Đấng Mê-si,” tức Jêsus được gọi là cả Đức Chúa Trời lẫn Đấng Cứu Rỗi. Một cách hiểu ít có khả năng hơn là câu nói đến hai ngôi: “Đức Chúa Trời chúng ta và Đấng Cứu Rỗi là Jêsus, Đấng Mê-si.”'
    reason: alternative_reading
lexical_decisions:
- source_word: Συμεὼν Πέτρος
  choice: Si-mê-ôn Phi-e-rơ
  rationale: Dùng Si-mê-ôn để phản ánh trực tiếp dạng Συμεών của SBLGNT thay vì dạng Si-môn; Phi-e-rơ là cách phiên âm quen thuộc của Πέτρος.
- source_word: δοῦλος
  choice: nô lệ
  rationale: Giữ nét nghĩa thuộc trọn quyền sở hữu và phục tùng hoàn toàn, mạnh hơn 'đầy tớ'; trong lời tự xưng này, từ ấy nêu bật việc Phi-e-rơ hoàn toàn thuộc về Đức Chúa Jêsus.
- source_word: ἀπόστολος
  choice: sứ đồ
  rationale: Thuật ngữ tiếng Việt đã được xác lập cho chức vụ của người được sai phái với thẩm quyền.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Đức Chúa Jêsus, Đấng Mê-si
  rationale: Dịch Χριστός như một tước hiệu còn nguyên ý nghĩa là Đấng Mê-si, đồng thời dùng hình thức tên gọi trang trọng và quen thuộc trong văn phong Kinh Thánh tiếng Việt.
- source_word: τοῖς ... λαχοῦσιν
  choice: gửi đến những người đã nhận được
  rationale: Diễn đạt việc họ được ban hay được phần, chứ không hàm ý tự mình đạt được; 'nhận được' tự nhiên trong tiếng Việt.
- source_word: ἰσότιμον ... πίστιν
  choice: đức tin quý báu ngang với đức tin của chúng tôi
  rationale: Truyền đạt cả giá trị quý báu lẫn địa vị bình đẳng của đức tin người nhận thư với đức tin của nhóm 'chúng tôi'.
- source_word: πίστιν
  choice: đức tin
  rationale: Trong ngữ cảnh này, từ chỉ đức tin chung mà các tín hữu đã nhận được, không phải sự thành tín.
- source_word: ἐν δικαιοσύνῃ
  choice: trong sự công chính
  rationale: Giữ cách nói gần với cấu trúc Hy Lạp và không quyết đoán liệu ἐν chủ yếu chỉ phạm vi hay phương tiện; các khả năng khác được ghi ở chú thích.
- source_word: δικαιοσύνῃ
  choice: sự công chính
  rationale: Đây là từ ngữ thần học tự nhiên và chính xác trong ngữ cảnh, phù hợp hơn 'công lý'.
- source_word: τοῦ θεοῦ ἡμῶν καὶ σωτῆρος Ἰησοῦ Χριστοῦ
  choice: của Đức Chúa Trời và Đấng Cứu Rỗi chúng ta là Đức Chúa Jêsus, Đấng Mê-si
  rationale: Cú pháp một mạo từ chi phối hai danh từ số ít chỉ ngôi vị được nối bằng καί nghiêng mạnh về một đối tượng quy chiếu; từ 'là' làm rõ rằng Jêsus được gọi là cả Đức Chúa Trời lẫn Đấng Cứu Rỗi.
theological_decisions:
- issue: Cụm 'Đức Chúa Trời và Đấng Cứu Rỗi chúng ta là Đức Chúa Jêsus, Đấng Mê-si' chỉ một ngôi hay hai ngôi
  choice: 'Một ngôi: Đức Chúa Jêsus được gọi là Đức Chúa Trời và Đấng Cứu Rỗi chúng ta.'
  alternative: 'Hai ngôi: ''Đức Chúa Trời chúng ta'' và ''Đấng Cứu Rỗi là Đức Chúa Jêsus, Đấng Mê-si.'''
  rationale: Trong tiếng Hy Lạp, một mạo từ đi với hai danh từ số ít chỉ ngôi vị nối bằng καί nghiêng mạnh về cùng một đối tượng quy chiếu. Vì cách hiểu khác có ý nghĩa thần học và từng được đề xuất, nó được giữ trong chú thích.
- issue: Sắc thái của ἐν trong ἐν δικαιοσύνῃ
  choice: Giữ 'trong sự công chính' ở chính văn để bảo tồn độ mở giữa phạm vi và phương tiện.
  alternative: '''nhờ sự công chính'' hoặc ''bởi sự công chính.'''
  rationale: Giới từ ἐν với cách dữ liệu có thể chỉ phạm vi hoặc phương tiện; ngữ cảnh không buộc phải loại bỏ một trong các sắc thái ấy.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Giữ các thuật ngữ Kinh Thánh quen thuộc như “sứ đồ”, “đức tin”, “sự công chính” và “Đấng Cứu Rỗi”; dùng “nô lệ” có chủ ý để bảo tồn sức nặng của δοῦλος. Dấu phẩy quanh “Đấng Mê-si” cho thấy đây là tước hiệu của Đức Chúa Jêsus.
