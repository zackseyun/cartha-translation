reference: 2 Peter 1:18
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ταύτην τὴν φωνὴν ἡμεῖς ἠκούσαμεν ἐξ οὐρανοῦ ἐνεχθεῖσαν σὺν αὐτῷ ὄντες ἐν τῷ ⸂ἁγίῳ ὄρει⸃.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/018.yaml
  text: And we ourselves heard this voice brought from heaven when we were with him on the holy mountain[a].
translation:
  language: vi
  text: Chính chúng tôi đã nghe tiếng ấy được truyền đến từ trời khi chúng tôi ở cùng Ngài trên núi thánh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “tiếng ấy được mang đến từ trời.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ταύτην τὴν φωνὴν
  choice: tiếng ấy
  rationale: φωνή ở đây chỉ tiếng phán từ trời đã được nhắc ở câu trước. “Tiếng ấy” tự nhiên trong tiếng Việt và liên kết rõ với lời phán vừa nêu.
- source_word: ἡμεῖς
  choice: chính chúng tôi
  rationale: Đại từ được nêu tường minh trong tiếng Hy Lạp để nhấn mạnh chủ thể và tư cách nhân chứng; “chính chúng tôi” giữ được sắc thái ấy.
- source_word: ἠκούσαμεν
  choice: đã nghe
  rationale: Động từ aorist chỉ một sự kiện nghe đã xảy ra, không nhấn mạnh quá trình lắng nghe.
- source_word: ἐξ οὐρανοῦ
  choice: từ trời
  rationale: Cách diễn đạt ngắn gọn, tự nhiên, giữ nguyên ý chỉ nguồn phát xuất từ thiên giới.
- source_word: ἐνεχθεῖσαν
  choice: vọng xuống
  rationale: Phân từ bị động của φέρω mô tả tiếng được truyền đến từ trời. “Vọng xuống” diễn đạt tự nhiên hình ảnh âm thanh từ trời đến tai người nghe, nhưng chú thích bảo lưu nghĩa sát hơn là “được truyền đến”.
- source_word: σὺν αὐτῷ ὄντες
  choice: khi ở với Ngài
  rationale: Chuyển kết cấu phân từ thành mệnh đề thời gian tự nhiên trong tiếng Việt. “Ngài” chỉ Chúa Giê-su theo văn cảnh mà không lặp tên không có trong câu Hy Lạp.
- source_word: ἐν τῷ ἁγίῳ ὄρει
  choice: trên núi thánh
  rationale: “Trên núi” phù hợp cách nói tiếng Việt; “núi thánh” giữ tính chất thiêng thánh mà bản văn gán cho ngọn núi nhưng không tự ý xác định tên núi.
theological_decisions:
- issue: Ngọn núi được gọi là “núi thánh”
  choice: Giữ cách gọi mô tả “núi thánh” mà không nêu tên cụ thể.
  alternative: Xác định đó là núi Ta-bô hoặc núi Hẹt-môn.
  rationale: Bản văn Hy Lạp không nêu tên ngọn núi; việc xác định cụ thể sẽ đưa truyền thống hoặc suy đoán vào bản dịch.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Chính chúng tôi” giữ trọng âm nhân chứng; “Ngài” duy trì sự tôn kính theo văn phong Kinh Thánh tiếng Việt. Dấu chú thích [a] được đặt ngay sau câu liên quan.
