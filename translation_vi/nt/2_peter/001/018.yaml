  terminology: “Tiếng ấy,” “Ngài,” và “núi thánh” phù hợp văn cảnh và cách dùng Kinh Thánh tiếng Việt. “Núi thánh” không áp đặt việc đồng nhất ngọn núi với Ta-bô hay Hẹt-môn.
