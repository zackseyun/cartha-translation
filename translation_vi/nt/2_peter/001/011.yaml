id: 2PE.1.11
reference: 2 Peter 1:11
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οὕτως γὰρ πλουσίως ἐπιχορηγηθήσεται ὑμῖν ἡ εἴσοδος εἰς τὴν αἰώνιον βασιλείαν τοῦ κυρίου ἡμῶν καὶ σωτῆρος Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/011.yaml
  text: For in this way entry into the eternal kingdom of our Lord and Savior Jesus the Messiah will be richly provided for you[a][b][c].
translation:
  language: vi
  text: Vì theo cách ấy, lối vào[a] vương quốc đời đời của Chúa và Đấng Cứu Rỗi chúng ta là Đức Giê-su, Đấng Mê-si[b], sẽ được ban cho anh em cách dồi dào.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “việc bước vào”. Từ Hy Lạp εἴσοδος có thể chỉ hành động bước vào hoặc lối vào.
    reason: lexical_alternative
  - marker: b
    text: 'Theo cách gọi truyền thống: “Đức Giê-su Christ”. Tước hiệu Hy Lạp Χριστός có nghĩa là “Đấng Mê-si”, tức Đấng được xức dầu.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὕτως
  choice: như thế
  rationale: Giữ lực chỉ cách thức của từ Hy Lạp và nối câu này với lối sống được nói đến ngay trước đó.
- source_word: γὰρ
  choice: Vì
  rationale: Thể hiện quan hệ giải thích với câu trước mà không làm mạnh thành một quan hệ nguyên nhân cứng nhắc hơn văn bản.
- source_word: πλουσίως
  choice: dồi dào
  rationale: Diễn đạt ý phong phú, dư dật của trạng từ và bổ nghĩa cho hành động ban cấp, chứ không biến 'lối vào' thành một không gian rộng.
- source_word: ἐπιχορηγηθήσεται
  choice: sẽ được ban
  rationale: Giữ thì tương lai và thể bị động của động từ, đồng thời dùng cách diễn đạt tự nhiên, trang trọng trong tiếng Việt.
- source_word: ὑμῖν
  choice: cho anh em
  rationale: Phản ánh tặng cách chỉ người nhận; 'anh em' phù hợp với lời ngỏ số nhiều trong văn thư.
- source_word: ἡ εἴσοδος
  choice: lối vào
  rationale: Có thể chỉ sự bước vào hoặc lối vào; 'lối vào' vừa dễ hiểu vừa giữ được hình ảnh danh từ của nguyên văn.
- source_word: εἰς τὴν αἰώνιον βασιλείαν
  choice: vương quốc đời đời
  rationale: Diễn đạt trực tiếp ý về vương quốc có tính đời đời; giới từ εἰς được hàm chứa tự nhiên trong kết hợp 'lối vào vương quốc' của tiếng Việt.
- source_word: τοῦ κυρίου ἡμῶν καὶ σωτῆρος
  choice: của Chúa chúng ta, cũng là Đấng Cứu Rỗi
  rationale: Cho thấy hai tước hiệu cùng quy về một nhân vật, đúng với cấu trúc một mạo từ chi phối hai danh từ nhân xưng số ít nối bằng καί.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Đức Giê-su, Đấng Mê-si
  rationale: Chuyển nghĩa Χριστός như một tước hiệu thay vì chỉ phiên âm theo truyền thống; dấu phẩy giúp tiếng Việt nhận ra đây là tước hiệu của Đức Giê-su.
theological_decisions:
- issue: Đối tượng của hai tước hiệu 'Chúa' và 'Đấng Cứu Rỗi'
  choice: Cả hai tước hiệu đều chỉ về một người là Đức Giê-su, Đấng Mê-si.
  alternative: Có thể dịch sát từng thành tố theo cách khiến người đọc tưởng đây là hai đối tượng khác nhau.
  rationale: Cú pháp Hy Lạp dùng một mạo từ cho hai danh từ nhân xưng số ít được nối bằng καί, rồi đặt tên Ἰησοῦ Χριστοῦ ở sau; cấu trúc này mạnh mẽ cho thấy chỉ một đối tượng.
- issue: Sắc thái của việc được vào vương quốc
  choice: 'Giữ thể bị động: lối vào ''sẽ được ban'' cho người đọc cách dồi dào.'
  alternative: Diễn đạt chủ động rằng người đọc sẽ bước vào hoặc sẽ nhận được lối vào.
  rationale: Nguyên văn không nêu tác nhân của động từ bị động. Bản dịch không tự ý xác định tác nhân hay giải quyết chi tiết quan hệ giữa sự ban cấp này và lời kêu gọi trong ngữ cảnh trước.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Câu giữ trật tự ý chính cùng thể bị động của nguyên văn, nhưng dùng dấu gạch ngang để làm rõ rằng 'Đức Giê-su, Đấng Mê-si' đồng vị với 'Chúa chúng ta, cũng là Đấng Cứu Rỗi'. Mọi chú thích đều có ký hiệu tương ứng trong chính văn.
