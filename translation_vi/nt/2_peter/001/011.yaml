    rationale: Trong tiếng Việt, «sẽ được ban cho anh em cách dồi dào» rõ phạm vi của trạng từ hơn và đọc trôi chảy hơn.
  - severity: low
    issue: Dấu gạch ngang trước tên riêng tạo sự ngắt quãng không cần thiết.
    rationale: Tên «Đức Giê-su, Đấng Mê-si» là phần xác định tự nhiên cho hai tước hiệu đứng trước; dấu phẩy là đủ.
