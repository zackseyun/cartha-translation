  text: 'so that what was spoken through Isaiah the prophet might be fulfilled, saying:'
translation:
  language: vi
  text: 'để điều đã được phán qua nhà tiên tri Ê-sai được ứng nghiệm:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἵνα
  choice: để
  rationale: Giới thiệu mục đích hoặc kết quả; “để” tự nhiên trong tiếng Việt và giữ được lực hướng đích của mệnh đề.
- source_word: πληρωθῇ
  choice: ứng nghiệm
  rationale: Động từ aorist thụ động giả định trong mệnh đề ἵνα. “Ứng nghiệm” là cách diễn đạt tự nhiên, trang trọng trong tiếng Việt đối với lời Kinh Thánh được làm cho thành hiện thực; dạng “được ứng nghiệm” có thể dùng nhưng nặng hơn trong câu này.
- source_word: τὸ ῥηθὲν
  choice: lời đã được phán
  rationale: Cụm mạo từ trung tính với phân từ thụ động được dùng như danh từ. “Lời đã được phán” giữ sắc thái lời tuyên phán, đồng thời biểu đạt rõ thể thụ động.
- source_word: διὰ
  choice: qua
  rationale: διά với sở hữu cách chỉ trung gian hoặc tác nhân trung gian; “qua Ê-sai” giữ rõ vai trò chuyển đạt của vị tiên tri.
- source_word: Ἠσαΐου
  choice: Ê-sai
  rationale: Dùng dạng tên riêng quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
- source_word: τοῦ προφήτου
  choice: nhà tiên tri
  rationale: Cụm đồng vị xác định vai trò của Ê-sai; được giữ rõ vì công thức ứng nghiệm nhấn mạnh thẩm quyền tiên tri.
- source_word: λέγοντος
  choice: 'rằng:'
  rationale: Phân từ hiện tại chủ động dẫn vào lời trích tiếp theo. Trong tiếng Việt, “rằng:” tự nhiên hơn cách dịch sát “nói rằng:” sau cụm “lời đã được phán”, tránh lặp mà vẫn giữ chức năng dẫn lời.
theological_decisions:
- issue: Công thức ứng nghiệm trong Ma-thi-ơ
  choice: Dùng “ứng nghiệm” và giữ nguyên mô-típ lời tiên tri được hoàn thành, không diễn giải thêm ý nghĩa thần học.
  alternative: Dịch thoáng là “để lời ấy trở thành sự thật”.
  rationale: “Ứng nghiệm” bảo tồn mối liên hệ liên văn bản và chủ đề thần học đặc trưng của Ma-thi-ơ tốt hơn cách nói chung chung “trở thành sự thật”, nhưng không áp đặt cách giải thích vượt quá bản văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu này phụ thuộc cú pháp vào câu trước và dấu hai chấm báo hiệu lời trích dẫn ở câu sau. Không cần chú thích.
