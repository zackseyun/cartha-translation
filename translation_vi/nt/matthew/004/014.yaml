review_pass:
  verdict: revise
  source_fidelity: 'Bản nháp diễn đạt đúng công thức ứng nghiệm, vai trò trung gian của Ê-sai, và chức năng dẫn nhập lời trích. Tuy nhiên, “để ứng nghiệm lời...” dễ được hiểu là một cấu trúc chủ động (“để [ai đó] làm ứng nghiệm lời”), trong khi πληρωθῇ là thể thụ động: điều/lời đã được phán là điều được ứng nghiệm. Nên biểu đạt rõ thể thụ động.'
  naturalness: “Để điều đã được phán qua nhà tiên tri Ê-sai được ứng nghiệm:” là cách diễn đạt tự nhiên, trang trọng và rõ ràng trong tiếng Việt hiện đại. Dấu hai chấm tự nhiên dẫn vào lời trích ở câu tiếp theo; không cần thêm “rằng” ngay trước dấu hai chấm.
  terminology: Giữ “ứng nghiệm” cho πληρωθῇ, “qua” cho διά, “nhà tiên tri” cho τοῦ προφήτου, và tên “Ê-sai” theo cách dùng Kinh Thánh tiếng Việt. “Điều đã được phán” phản ánh tốt cụm danh từ hóa τὸ ῥηθέν mà không giới hạn nó chỉ là một “lời” đơn lẻ.
  issues:
  - severity: medium
    issue: Thể thụ động của πληρωθῇ chưa được biểu đạt rõ trong “để ứng nghiệm lời...”.
    rationale: Nguyên ngữ nói “để điều đã được phán ... được ứng nghiệm.” Việc đặt “lời” làm tân ngữ trực tiếp sau “ứng nghiệm” có thể chuyển trọng tâm sang hành động chủ động làm ứng nghiệm, thay vì điều được phán được ứng nghiệm.
