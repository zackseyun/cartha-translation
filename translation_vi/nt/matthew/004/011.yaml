  - severity: low
    issue: Ngắt câu trước “Và kìa” làm mạch tường thuật hơi gãy.
    rationale: Cùng một câu tiếng Hy Lạp nối việc ma quỷ rời đi với sự xuất hiện của các thiên sứ. Dùng dấu phẩy trước “và kìa” giữ được nhịp kể liên tục.
