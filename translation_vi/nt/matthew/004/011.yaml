  source_fidelity: 'Bản dịch truyền đạt đúng các thành tố chính: τότε (“Bấy giờ”), ὁ διάβολος (“ma quỷ”), ἀφίησιν (“rời khỏi”), ἰδού (“kìa”), ἄγγελοι (“các thiên sứ”), προσῆλθον (“đến”), và διηκόνουν (“hầu việc”). Tuy nhiên, nên nối rõ hai động từ προσῆλθον καὶ διηκόνουν bằng “và” để phản ánh cấu trúc phối hợp của nguyên văn và tránh để “đến hầu việc” bị hiểu như một cụm mục đích duy nhất.'
