  text: τότε ἀφίησιν αὐτὸν ὁ διάβολος, καὶ ἰδοὺ ἄγγελοι προσῆλθον καὶ διηκόνουν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/011.yaml
  text: Then the devil left him[a], and behold, angels came and were ministering to him.
translation:
  language: vi
  text: Bấy giờ, ma quỷ rời khỏi Ngài, và kìa, các thiên sứ đến và hầu việc Ngài.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “các thiên sứ đến và phục vụ Ngài.” Động từ Hy Lạp có thể mang nghĩa “phục vụ” hoặc “hầu việc”; thì chưa hoàn thành gợi một hành động đang tiếp diễn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Bấy giờ
  rationale: Trạng từ chỉ thời gian nối tiếp diễn biến; “Bấy giờ” tự nhiên, trang trọng vừa phải và phù hợp văn kể chuyện.
- source_word: ἀφίησιν
  choice: rời khỏi
  rationale: Đây là hiện tại lịch sử trong tiếng Hy Lạp; tiếng Việt diễn đạt tự nhiên bằng hành động đã xảy ra trong mạch kể. Trong ngữ cảnh, động từ chỉ ma quỷ lìa khỏi Đức Giê-su.
- source_word: αὐτὸν / αὐτῷ
  choice: Ngài
  rationale: Cả hai đại từ đều quy chiếu về Đức Giê-su. “Ngài” là đại từ tôn kính quen thuộc, rõ nghĩa trong văn bản Kinh Thánh tiếng Việt.
- source_word: ὁ διάβολος
  choice: ma quỷ
  rationale: Trong trình thuật cám dỗ, διάβολος là danh xưng chỉ Sa-tan; “ma quỷ” là cách gọi hiện đại, quen thuộc và không làm mờ đối tượng quy chiếu.
- source_word: ἰδοὺ
  choice: kìa
  rationale: Giữ lại từ chỉ dẫn sự chú ý và sắc thái sống động, bất ngờ của câu Hy Lạp; “kìa” tự nhiên hơn trong tiếng Việt hiện đại.
- source_word: ἄγγελοι
  choice: các thiên sứ
  rationale: Ngữ cảnh nói đến các hữu thể trên trời, nên “thiên sứ” chính xác hơn nghĩa rộng “sứ giả”.
- source_word: προσῆλθον
  choice: đến
  rationale: Diễn đạt ngắn gọn, tự nhiên ý đến gần hoặc tiến đến trong ngữ cảnh.
- source_word: διηκόνουν
  choice: hầu việc
  rationale: Động từ có nghĩa phục vụ, chăm lo; thể chưa hoàn thành gợi hành động đang tiếp diễn. “Hầu việc” giữ sắc thái trang trọng và phù hợp với việc các thiên sứ phục vụ Đức Giê-su.
theological_decisions:
- issue: Cách dịch διάβολος như một danh xưng trong trình thuật cám dỗ
  choice: ma quỷ
  alternative: kẻ vu khống
  rationale: Nghĩa từ nguyên có thể là “kẻ vu khống”, nhưng tại đây từ này là danh xưng cá thể chỉ Sa-tan. “Ma quỷ” bảo toàn sự rõ ràng về đối tượng mà không thêm nội dung tín lý.
- issue: Bản chất việc các thiên sứ làm cho Đức Giê-su
  choice: hầu việc Ngài
  alternative: phục vụ Ngài
  rationale: Nguyên văn không nói cụ thể họ cung cấp thức ăn hay thực hiện việc gì; vì vậy bản dịch giữ cách diễn đạt rộng, không giải quyết quá mức điều văn bản để ngỏ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ “kìa” để tái hiện điểm nhấn của ἰδού, đồng thời tránh những cách diễn đạt quá cổ. Dấu chú thích [a] được đặt ngay sau mệnh đề mà chú thích giải thích.
