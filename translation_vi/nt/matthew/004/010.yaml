  terminology: “Đức Giê-su,” “Sa-tan,” “thờ phượng,” “phụng sự,” và “Chúa là Đức Chúa Trời” phù hợp với văn cảnh và giữ được hai động từ Hy Lạp riêng biệt. Giữ “ngươi” trong lời trích dẫn là thích hợp với đăng ký trang trọng của lời truyền dạy.
