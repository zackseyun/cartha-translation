id: MAT.4.10
reference: Matthew 4:10
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: τότε λέγει αὐτῷ ὁ Ἰησοῦς· ⸀Ὕπαγε, Σατανᾶ· γέγραπται γάρ· Κύριον τὸν θεόν σου προσκυνήσεις καὶ αὐτῷ μόνῳ λατρεύσεις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/010.yaml
  text: 'Then Jesus says to him, “Go away, Satan! For it is written: ‘You shall worship the Lord your God, and serve him only.’”'
translation:
  language: vi
  text: 'Bấy giờ, Đức Giê-su nói với hắn: “Hãy lui đi, Sa-tan! Vì có lời chép rằng: ‘Ngươi phải thờ phượng[a] Chúa là Đức Chúa Trời của ngươi, và chỉ phụng sự[b] Ngài mà thôi.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Ngươi phải sấp mình xuống trước Chúa là Đức Chúa Trời của ngươi.” Động từ Hy Lạp có thể chỉ hành động phủ phục hoặc cúi mình để bày tỏ lòng tôn kính.'
    reason: lexical_alternative
  - marker: b
    text: Động từ được dịch là “phụng sự” có thể đặc biệt chỉ sự phục vụ thánh thiêng hoặc việc phụng sự mang tính tôn giáo dành cho Đức Chúa Trời.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Bấy giờ
  rationale: Đánh dấu trình tự câu chuyện một cách tự nhiên, trang trọng vừa phải trong tiếng Việt.
- source_word: λέγει αὐτῷ
  choice: Đức Giê-su nói với nó
  rationale: Thì hiện tại lịch sử của Hy Lạp tạo sắc thái sống động; tiếng Việt không bắt buộc đánh dấu thì. Đại từ “nó” chỉ kẻ đang đối thoại là Sa-tan, không hàm ý giải thích thêm.
- source_word: Ὕπαγε
  choice: Hãy lui đi
  rationale: Diễn đạt mệnh lệnh xua đuổi mạnh mẽ nhưng vẫn tự nhiên và trang nghiêm; sát nghĩa hơn một cách dùng chỉ đơn thuần là “đi”.
- source_word: Σατανᾶ
  choice: Sa-tan
  rationale: Dùng dạng phiên âm quen thuộc của tên gọi trong tiếng Việt và giữ chức năng hô cách.
- source_word: γέγραπται
  choice: có lời chép rằng
  rationale: Công thức hoàn thành bị động dùng để dẫn Kinh Thánh; cách nói này tự nhiên trong văn phong Kinh Thánh tiếng Việt và giữ ý lời đã được chép vẫn có thẩm quyền.
- source_word: Κύριον τὸν θεόν σου
  choice: Chúa là Đức Chúa Trời của ngươi
  rationale: Thể hiện quan hệ đồng vị giữa “Chúa” và “Đức Chúa Trời của ngươi”, đồng thời dùng danh xưng trang nghiêm, dễ nhận biết trong tiếng Việt.
- source_word: προσκυνήσεις
  choice: thờ phượng
  rationale: Trong ngữ cảnh sự tôn kính dành cho Đức Chúa Trời, “thờ phượng” truyền đạt đúng nghĩa tôn giáo; nét nghĩa cụ thể là cúi mình được ghi ở chú thích.
- source_word: αὐτῷ μόνῳ
  choice: chỉ ... một mình Ngài
  rationale: 'Giữ sự nhấn mạnh độc quyền của μόνῳ: việc phụng sự chỉ hướng về một mình Đức Chúa Trời.'
- source_word: λατρεύσεις
  choice: phụng sự
  rationale: Giữ phân biệt với προσκυνήσεις và gợi được sắc thái phục vụ mang tính thánh thiêng hay tôn giáo của λατρεύω.
theological_decisions:
- issue: Phân biệt προσκυνέω và λατρεύω
  choice: Dịch lần lượt là “thờ phượng” và “phụng sự”
  alternative: Dùng cùng một từ thuộc trường nghĩa “thờ phượng” cho cả hai, hoặc dịch προσκυνέω là “sấp mình xuống trước”
  rationale: Hai động từ có liên hệ nhưng không đồng nhất. Giữ hai cách diễn đạt giúp bảo tồn ý rằng chỉ Đức Chúa Trời mới được nhận cả sự thờ phượng lẫn sự phục vụ thánh thiêng, mà không đồng nhất hai hành động.
- issue: Phạm vi nhấn mạnh của μόνῳ
  choice: “chỉ phụng sự một mình Ngài”
  alternative: “chỉ phụng sự Ngài” hoặc “phụng sự Ngài mà thôi”
  rationale: Cách chọn làm rõ rằng tính độc quyền gắn với đối tượng được phụng sự, tương ứng với αὐτῷ μόνῳ, nhưng không bổ sung một mệnh đề thần học ngoài văn bản.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và dễ hiểu. “Bấy giờ” và “có lời chép rằng” phù hợp với lời dẫn Kinh Thánh mà không quá cổ; “ngươi” được giữ trong lời trích dẫn trực tiếp để phản ánh ngôi số ít và sắc thái trang trọng của điều răn. Mọi dấu chú thích [a], [b] đều xuất hiện ngay trong bản văn.
