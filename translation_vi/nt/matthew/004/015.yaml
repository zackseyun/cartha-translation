- from: '“Đất Xê-bu-lôn và đất Nép-ta-li,

    con đường ra biển, bên kia sông Giô-đanh,

    Ga-li-lê của dân ngoại[a]—'
  to: '“Đất Xê-bu-lôn và đất Nép-ta-li,

    đường biển, bên kia sông Giô-đanh,

    Ga-li-lê của dân ngoại[a]—'
  rationale: Thay “con đường ra biển” bằng “đường biển” để tránh thêm ý một lộ trình đi ra biển, đồng thời giữ tính cô đọng và mơ hồ địa lý của ὁδὸν θαλάσσης. Những phần còn lại trung thành với tiếng Hy Lạp và phù hợp với tiếng Việt hiện đại.
