source:
  edition: SBLGNT
  text: Γῆ Ζαβουλὼν καὶ γῆ Νεφθαλίμ, ὁδὸν θαλάσσης, πέραν τοῦ Ἰορδάνου, Γαλιλαία τῶν ἐθνῶν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/015.yaml
  text: Land of Zebulun and land of Naphtali[a], the way of the sea, beyond the Jordan, Galilee of the Gentiles—
translation:
  language: vi
  text: '“Đất Xê-bu-lôn và đất Nép-ta-li,

    đường biển, bên kia sông Giô-đanh,

    Ga-li-lê của dân ngoại[a]—'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hoặc “Ga-li-lê của các dân tộc.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Γῆ / γῆ
  choice: Đất
  rationale: Giữ nghĩa địa lý và phép lặp song song của lời trích dẫn; không dịch là “trái đất” hay “mặt đất”.
- source_word: Ζαβουλὼν
  choice: Xê-bu-lôn
  rationale: Phiên âm tên chi phái và địa danh theo cách rõ ràng, quen thuộc trong tiếng Việt Kinh Thánh.
- source_word: Νεφθαλίμ
  choice: Nép-ta-li
  rationale: Phiên âm tên chi phái và địa danh theo cách dùng tiếng Việt thông dụng.
- source_word: ὁδὸν θαλάσσης
  choice: con đường ra biển
  rationale: Cách dịch trang trọng nhưng tự nhiên, giữ được hình ảnh “đường” và mối liên hệ với biển mà không xác định quá mức đây là một tuyến đường hay cả một vùng.
- source_word: πέραν τοῦ Ἰορδάνου
  choice: bên kia sông Giô-đanh
  rationale: Giữ thành ngữ địa lý và không ấn định thêm điểm nhìn ngoài điều bản Hy Lạp diễn đạt.
- source_word: Γαλιλαία
  choice: Ga-li-lê
  rationale: Phiên âm quen thuộc của tên vùng trong tiếng Việt.
- source_word: τῶν ἐθνῶν
  choice: của dân ngoại
  rationale: Trong bối cảnh Do Thái của Ma-thi-ơ và âm vang Ê-sai, cụm từ này chủ yếu chỉ những người không thuộc dân Do Thái; “dân ngoại” chuyển tải sự đối lập dân tộc–tôn giáo ấy, còn nghĩa sát hơn “các dân tộc” được giữ trong chú thích.
theological_decisions:
- issue: Cách dịch ἐθνῶν trong lời trích dẫn Ê-sai
  choice: dân ngoại
  alternative: các dân tộc
  rationale: “Dân ngoại” phù hợp với bối cảnh Do Thái và nêu được sự liên hệ của Ga-li-lê với những cộng đồng không phải Do Thái. Tuy nhiên, từ Hy Lạp cũng có thể mang nghĩa rộng là “các dân tộc”, nên không loại bỏ cách hiểu đó và ghi lại trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và có nhịp thơ của một lời trích dẫn tiên tri. Giữ cấu trúc liệt kê và dấu gạch ngang nối sang câu kế tiếp; dùng cách phiên âm tên riêng quen thuộc, dễ đọc.
