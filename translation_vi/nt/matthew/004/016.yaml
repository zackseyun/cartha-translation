id: MAT.4.16
reference: Matthew 4:16
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὁ λαὸς ὁ καθήμενος ἐν ⸀σκοτίᾳ ⸂φῶς εἶδεν⸃ μέγα, καὶ τοῖς καθημένοις ἐν χώρᾳ καὶ σκιᾷ θανάτου φῶς ἀνέτειλεν αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/016.yaml
  text: The people sitting in darkness saw a great light[a], and on those sitting in the region and shadow of death, a light dawned.
translation:
  language: vi
  text: Dân đang ngồi trong bóng tối[a] đã thấy một ánh sáng lớn; và ánh sáng đã rạng trên những người đang ngồi trong vùng đất và bóng của sự chết.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “bóng tối dày đặc.” Cụm “bóng của sự chết” được giữ lại vì bản Hy Lạp nói rõ đến “sự chết” và gợi lại một hình ảnh quen thuộc trong Kinh Thánh.
    reason: lexical_alternative
lexical_decisions:
- source_word: λαὸς
  choice: dân
  rationale: “Dân” diễn đạt tự nhiên một tập thể người trong văn phong Kinh Thánh, không nhất thiết mang nghĩa chính trị của một quốc gia.
- source_word: καθήμενος / καθημένοις
  choice: đang ngồi
  rationale: Giữ nghĩa trực tiếp và hình ảnh sống động của phân từ Hy Lạp, đồng thời bảo tồn cấu trúc song song và âm hưởng từ Ê-sai.
- source_word: σκοτίᾳ
  choice: bóng tối
  rationale: Đây là cách dịch thông dụng, giữ được cả nghĩa cụ thể lẫn nghĩa ẩn dụ mà không giới hạn bóng tối vào một cách giải thích đạo đức, thuộc linh hay hoàn cảnh.
- source_word: φῶς εἶδεν μέγα
  choice: đã thấy một ánh sáng lớn
  rationale: Thể aorist được diễn đạt bằng hành động quá khứ; “một ánh sáng lớn” tự nhiên trong tiếng Việt và giữ nguyên sức mạnh của hình ảnh.
- source_word: χώρᾳ
  choice: miền
  rationale: “Miền” phù hợp với nghĩa khu vực địa lý và tránh gợi đến một quốc gia hiện đại.
- source_word: σκιᾷ θανάτου
  choice: bóng sự chết
  rationale: Giữ rõ danh từ “sự chết” có trong tiếng Hy Lạp và bảo tồn hình ảnh Kinh Thánh quen thuộc, thay vì diễn giải thành “bóng tối dày đặc”.
- source_word: ἀνέτειλεν
  choice: đã bừng lên
  rationale: Cụm này diễn đạt tự nhiên hình ảnh ánh sáng xuất hiện như mặt trời mọc, mạnh hơn cách nói chung chung “đã chiếu”.
- source_word: αὐτοῖς
  choice: trên những người
  rationale: Kết hợp tự nhiên với hình ảnh ánh sáng bừng lên trên ai đó, đồng thời nêu rõ những người tiếp nhận ánh sáng.
theological_decisions:
- issue: Bản chất của hình ảnh bóng tối và ánh sáng
  choice: Giữ nguyên hình ảnh mà không xác định bóng tối hay ánh sáng chỉ có một nghĩa thần học cụ thể.
  alternative: Giải thích bóng tối là tội lỗi hoặc sự thiếu hiểu biết của dân ngoại, và giải thích ánh sáng trực tiếp là sự mặc khải cứu rỗi của Đấng Mê-si.
  rationale: Câu Hy Lạp, trong âm hưởng lời tiên tri Ê-sai, mang ý nghĩa thần học phong phú nhưng không tự giới hạn các hình ảnh này vào một cách giải thích duy nhất.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Bản dịch giữ phép song song, động tác “ngồi” và hình ảnh “bóng sự chết” của nguyên văn, dù cấu trúc “trong miền và bóng sự chết” có sắc thái thi ca hơn lời nói hằng ngày.
