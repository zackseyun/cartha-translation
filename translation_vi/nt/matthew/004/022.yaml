  text: οἱ δὲ εὐθέως ἀφέντες τὸ πλοῖον καὶ τὸν πατέρα αὐτῶν ἠκολούθησαν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/022.yaml
  text: And they immediately left the boat and their father and followed him[a].
translation:
  language: vi
  text: Họ lập tức[a] bỏ thuyền và cha mình lại rồi đi theo Ngài.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “ngay tức khắc.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ
  choice: Họ
  rationale: Mạo từ được dùng như danh từ, chỉ hai anh em vừa được nhắc đến; δέ là từ nối nhẹ để tiếp tục câu chuyện và không nhất thiết phải dịch riêng trong tiếng Việt.
- source_word: εὐθέως
  choice: lập tức
  rationale: Diễn đạt rõ sự mau chóng, dứt khoát trong phản ứng của họ, đồng thời tự nhiên trong tiếng Việt hiện đại.
- source_word: ἀφέντες
  choice: bỏ ... lại
  rationale: 'Phân từ bất định chỉ hành động xảy ra trước động từ chính: họ để thuyền và cha lại rồi đi theo. Cách dịch này giữ trình tự mà không khẳng định đây là sự từ bỏ vĩnh viễn.'
- source_word: τὸ πλοῖον
  choice: thuyền
  rationale: Trong bối cảnh đánh cá trên hồ, 'thuyền' chính xác và tự nhiên hơn 'tàu'.
- source_word: τὸν πατέρα αὐτῶν
  choice: cha mình
  rationale: Cách nói tự nhiên trong tiếng Việt, xác định người cha của hai anh em và giữ nguyên sức nặng gia đình của hành động.
- source_word: ἠκολούθησαν αὐτῷ
  choice: đi theo Ngài
  rationale: Giữ cả nghĩa chuyển động theo sau lẫn sắc thái trở thành môn đồ trong văn cảnh Phúc Âm; 'Ngài' là đại từ tôn kính, rõ ràng chỉ về Chúa Giê-su trong văn cảnh.
theological_decisions:
- issue: Sự đáp ứng của môn đồ và việc rời xa gia đình
  choice: Diễn đạt đây là hành động lập tức để thuyền và cha lại rồi đi theo Chúa Giê-su, nhưng không nói quá rằng họ vĩnh viễn ruồng bỏ cha mình.
  alternative: Dịch ἀφέντες bằng một từ mạnh hơn mang nghĩa đoạn tuyệt hay ruồng bỏ vĩnh viễn.
  rationale: Bản văn nhấn mạnh sự mau chóng và dứt khoát, nhưng động từ ἀφίημι ở đây không tự nó xác định việc chia lìa là vĩnh viễn.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Cấu trúc 'bỏ ... lại rồi đi theo' thể hiện tự nhiên thứ tự của phân từ ἀφέντες và động từ chính ἠκολούθησαν.
