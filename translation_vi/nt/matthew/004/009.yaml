  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ⸀εἶπεν αὐτῷ· Ταῦτά ⸂σοι πάντα⸃ δώσω, ἐὰν πεσὼν προσκυνήσῃς μοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/009.yaml
  text: And he said to him[a], “I will give you all these things, if you fall down and worship me.”
translation:
  language: vi
  text: 'Hắn nói với Ngài: “Ta sẽ cho ngươi tất cả những điều này, nếu ngươi sấp mình thờ lạy ta[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “phủ phục trước ta” hoặc “bày tỏ lòng tôn kính với ta.” Động từ Hy Lạp có thể chỉ hành động phủ phục hoặc tỏ lòng tôn kính, nhưng trong ngữ cảnh này, nghĩa “thờ lạy” phù hợp hơn.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Hắn nói
  rationale: Trong tiếng Việt, không nhất thiết phải dịch liên từ καὶ ở đầu câu; lược bỏ giúp lời kể tự nhiên mà không làm mất quan hệ tiếp nối với câu trước.
- source_word: εἶπεν αὐτῷ
  choice: Hắn nói với Ngài
  rationale: Giữ cấu trúc đại từ của tiếng Hy Lạp. “Hắn” chỉ kẻ cám dỗ và “Ngài” chỉ Đức Giê-su, vừa rõ vai giao tiếp vừa phù hợp với cách xưng hô tự nhiên trong tiếng Việt.
- source_word: Ταῦτά σοι πάντα δώσω
  choice: Ta sẽ cho ngươi tất cả những điều này
  rationale: Diễn đạt trực tiếp lời đề nghị, giữ lực bao quát của πάντα và số nhiều của Ταῦτά; “những điều này” quy chiếu về các vương quốc cùng vinh hoa vừa được cho thấy.
- source_word: ἐὰν
  choice: nếu
  rationale: Từ điều kiện thông dụng, trực tiếp và tương ứng tự nhiên với ἐὰν.
- source_word: πεσὼν
  choice: sấp mình
  rationale: Giữ hình ảnh về hành động hạ thân mình xuống trước khi hoặc trong khi thờ lạy, đồng thời tự nhiên hơn cách dịch sát chữ “ngã xuống” trong ngữ cảnh này.
- source_word: προσκυνήσῃς μοι
  choice: thờ lạy ta
  rationale: Ngữ cảnh cám dỗ và câu đáp kế tiếp về việc chỉ thờ phượng Đức Chúa Trời cho thấy hành động được đòi hỏi mang ý nghĩa tôn giáo, dù động từ cũng có thể chỉ sự phủ phục hay tỏ lòng tôn kính.
theological_decisions:
- issue: Cách dịch προσκυνέω trong yêu cầu của ma quỷ đối với Đức Giê-su
  choice: thờ lạy ta
  alternative: phủ phục trước ta; bày tỏ lòng tôn kính với ta
  rationale: “Thờ lạy” truyền đạt đúng sức nặng tôn giáo của thử thách, nhất là khi câu kế tiếp nhấn mạnh chỉ được thờ phượng Đức Chúa Trời. Chú thích vẫn bảo lưu phạm vi nghĩa rộng hơn của động từ Hy Lạp.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cặp xưng hô trong lời thoại “ta–ngươi” thể hiện giọng ra điều kiện của kẻ cám dỗ mà không gán cho Đức Giê-su cách xưng hô tôn kính không có trong lời nói của hắn; lời kể dùng “Ngài” để chỉ Đức Giê-su.
