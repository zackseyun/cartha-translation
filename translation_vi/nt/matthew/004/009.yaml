  source_fidelity: 'Bản dịch truyền đạt đầy đủ cấu trúc và ý nghĩa của câu Hy Lạp: lời nói hướng đến một người, lời hứa ban cho toàn bộ các điều đã được chỉ ra, điều kiện ἐὰν, hành động hạ mình của πεσών, và hành vi προσκυνέω hướng về người nói. “Sấp mình thờ lạy” phản ánh thích đáng sự kết hợp của πεσών và προσκυνήσῃς mà không bỏ mất yếu tố thân thể.'
  naturalness: Văn bản rõ ràng, tự nhiên trong văn phong Kinh Thánh Việt ngữ hiện đại có sắc thái trang trọng. Cặp “ta–ngươi” phù hợp với lời đòi hỏi trực tiếp trong ngữ cảnh này; “Hắn” và “Ngài” cũng làm rõ quy chiếu đại từ trong tiếng Việt.
  terminology: “Thờ lạy” là lựa chọn phù hợp cho προσκυνέω trong bối cảnh cám dỗ và tương hợp với đối lập ở câu tiếp theo. Chú thích bảo lưu đúng các khả năng nghĩa như phủ phục và tỏ lòng tôn kính, nên không xóa bỏ phạm vi ngữ nghĩa rộng hơn của động từ.
