source:
  edition: SBLGNT
  text: καὶ ἠκολούθησαν αὐτῷ ὄχλοι πολλοὶ ἀπὸ τῆς Γαλιλαίας καὶ Δεκαπόλεως καὶ Ἱεροσολύμων καὶ Ἰουδαίας καὶ πέραν τοῦ Ἰορδάνου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/025.yaml
  text: And large crowds followed him from Galilee and the Decapolis and Jerusalem and Judea and beyond the Jordan[a].
translation:
  language: vi
  text: Các đoàn dân đông đảo từ Ga-li-lê, miền Mười Thành, Giê-ru-sa-lem, Giu-đê và vùng bên kia sông Giô-đanh[a] đi theo Người.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “từ bên kia sông Giô-đanh.”'
    reason: Phương án này diễn đạt trực tiếp sắc thái không gian của πέραν τοῦ Ἰορδάνου mà không xác định một điểm nhìn không có trong bản văn.
lexical_decisions:
- source_word: ἠκολούθησαν
  choice: đi theo
  rationale: Diễn đạt tự nhiên hành động theo sau Chúa Giê-su trong mạch kể chuyện, đồng thời không khẳng định quá mức rằng tất cả đều đã trở thành môn đồ tận hiến.
- source_word: ὄχλοι πολλοὶ
  choice: những đoàn dân đông đảo
  rationale: Truyền đạt ý có nhiều đám đông từ nhiều khu vực; cách nói này tự nhiên hơn lối dịch sát chữ “nhiều đám đông”.
- source_word: ἀπὸ
  choice: từ
  rationale: Đánh dấu nguồn gốc địa lý của những đoàn dân và chi phối toàn bộ danh sách địa danh.
- source_word: Γαλιλαίας
  choice: Ga-li-lê
  rationale: Tên gọi quen dùng trong tiếng Việt cho vùng Galilee.
- source_word: Δεκαπόλεως
  choice: miền Mười Thành
  rationale: Δεκάπολις chỉ khu vực gắn với mười thành phố; “miền Mười Thành” vừa rõ nghĩa vừa thể hiện đây là một địa danh khu vực.
- source_word: Ἱεροσολύμων
  choice: Giê-ru-sa-lem
  rationale: Dạng tên riêng quen thuộc trong tiếng Việt hiện đại.
- source_word: Ἰουδαίας
  choice: Giu-đê
  rationale: Dạng tên vùng quen thuộc trong tiếng Việt.
- source_word: πέραν τοῦ Ἰορδάνου
  choice: vùng bên kia sông Giô-đanh
  rationale: Giữ nghĩa không gian là khu vực ở phía bên kia sông Giô-đanh; thêm “vùng” để danh sách địa lý rõ và tự nhiên trong tiếng Việt.
- source_word: καὶ ... καὶ ... καὶ
  choice: dấu phẩy ... và
  rationale: Tiếng Việt tự nhiên liệt kê các địa danh bằng dấu phẩy và dùng “và” trước mục cuối, trong khi vẫn giữ hiệu ứng tích lũy của danh sách.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đưa cụm chỉ xuất xứ lên đầu câu giúp câu tiếng Việt tự nhiên, còn “Ngài” duy trì lối quy chiếu tôn kính quen thuộc đối với Chúa Giê-su.
