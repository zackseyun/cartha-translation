revisions:
- from: Đi tiếp từ đó, Đức Chúa Jêsus thấy hai anh em khác là Gia-cơ, con của Xê-bê-đê, và Giăng, em ông. Họ đang ở trong thuyền với cha mình là Xê-bê-đê, vá lưới. Ngài gọi họ.
  to: 'Đi tiếp từ đó, Giê-su thấy hai anh em khác: Gia-cơ, con Xê-bê-đê, và Giăng, là anh em của ông. Họ đang ở trong thuyền với Xê-bê-đê, cha của họ, vá lưới. Người gọi họ.'
  rationale: Sửa “em ông” thành “là anh em của ông” để giữ sự không xác định về thứ bậc tuổi trong ἀδελφός. Điều chỉnh tên Giê-su và bỏ tước hiệu được thêm vào khi nêu chủ ngữ ngầm, nhưng vẫn bảo toàn nhân vật được mạch văn xác định. Các yếu tố còn lại—tiếp tục đi từ đó, hai anh em khác, ở trong thuyền với cha, vá lưới và lời gọi—đều được giữ sát nguyên văn.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T02:43:07Z'
review_pass:
  verdict: revise
  source_fidelity: Bản nháp truyền đạt đúng hành động tiếp tục đi, nhìn thấy, hai anh em, họ ở cùng cha trên thuyền và đang vá lưới, rồi gọi họ. Tuy nhiên, “em ông” xác định Giăng là em trai của Gia-cơ, trong khi ἀδελφός chỉ nêu quan hệ anh em mà không cho biết thứ bậc tuổi.
  naturalness: Câu văn nhìn chung rõ ràng và tự nhiên. “Giăng, là anh em của ông” loại bỏ sự áp đặt về tuổi mà vẫn mạch lạc. Dạng chính tả “Giê-su” phù hợp hơn với tiếng Việt hiện đại chuẩn.
  terminology: Không cần đưa tước hiệu “Đức Chúa” vào câu này để xác định chủ ngữ ngầm từ ngữ cảnh; nguyên văn chỉ có đại từ/ngôi chủ ngữ ngầm, không lặp lại danh hiệu. Dùng “Giê-su” và “Người” giữ lối kể trang trọng mà không thêm tước hiệu. Các tên Gia-cơ, Giăng và Xê-bê-đê được giữ nhất quán.
  issues:
  - severity: medium
    issue: “Giăng, em ông”
    rationale: Cụm này thêm thông tin Giăng ít tuổi hơn Gia-cơ. Hy văn τὸν ἀδελφὸν αὐτοῦ không xác định ai là anh hay em; cần dùng cách gọi trung tính “anh em của ông”.
  - severity: low
    issue: “Đức Chúa Jêsus” và chính tả “Jêsus”
    rationale: Câu Hy văn không nêu tước hiệu ở đây; việc lặp tên chủ ngữ chỉ nhằm tiếng Việt rõ nghĩa, nên không cần thêm tước hiệu. “Giê-su” là dạng hiện đại chuẩn, trung tính hơn về truyền thống phiên âm.
  revised_text: 'Đi tiếp từ đó, Giê-su thấy hai anh em khác: Gia-cơ, con Xê-bê-đê, và Giăng, là anh em của ông. Họ đang ở trong thuyền với Xê-bê-đê, cha của họ, vá lưới. Người gọi họ.'
