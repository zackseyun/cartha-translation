id: MAT.4.21
reference: Matthew 4:21
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Καὶ προβὰς ἐκεῖθεν εἶδεν ἄλλους δύο ἀδελφούς, Ἰάκωβον τὸν τοῦ Ζεβεδαίου καὶ Ἰωάννην τὸν ἀδελφὸν αὐτοῦ, ἐν τῷ πλοίῳ μετὰ Ζεβεδαίου τοῦ πατρὸς αὐτῶν καταρτίζοντας τὰ δίκτυα αὐτῶν, καὶ ἐκάλεσεν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/021.yaml
  text: And going on from there, he saw two other brothers, James the son of Zebedee and John his brother, in the boat with Zebedee their father, mending their nets, and he called them.
translation:
  language: vi
  text: 'Đi tiếp từ đó, Giê-su thấy hai anh em khác: Gia-cơ, con Xê-bê-đê, và Giăng, là anh em của ông. Họ đang ở trong thuyền với Xê-bê-đê, cha của họ, vá lưới. Người gọi họ.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προβὰς ἐκεῖθεν
  choice: Đi tiếp từ đó
  rationale: Diễn đạt tự nhiên hành động rời địa điểm trước và tiếp tục đi, giữ quan hệ với mạch kể.
- source_word: εἶδεν
  choice: thấy
  rationale: Giữ nghĩa kể chuyện thông thường của động từ ὁράω, không nâng thành “để ý” hay “nhận ra”.
- source_word: ἄλλους δύο ἀδελφούς
  choice: hai anh em khác
  rationale: ἄλλους cho biết đây là một cặp anh em khác ngoài cặp vừa được nhắc đến; cách nói này tự nhiên trong tiếng Việt.
- source_word: Ἰάκωβον τὸν τοῦ Ζεβεδαίου
  choice: Gia-cơ, con của Xê-bê-đê
  rationale: Dùng dạng tên riêng quen thuộc trong Kinh Thánh tiếng Việt và làm rõ thành ngữ sở hữu chỉ quan hệ cha con.
- source_word: Ἰωάννην τὸν ἀδελφὸν αὐτοῦ
  choice: Giăng, em ông
  rationale: αὐτοῦ quy chiếu về Gia-cơ; “em ông” diễn đạt tự nhiên quan hệ anh em, dù nguyên văn chỉ nói “người anh/em của ông” mà không xác định tuổi.
- source_word: ἐν τῷ πλοίῳ
  choice: ở trong thuyền
  rationale: πλοῖον trong bối cảnh đánh cá là thuyền, không phải tàu lớn.
- source_word: μετὰ Ζεβεδαίου τοῦ πατρὸς αὐτῶν
  choice: với cha mình là Xê-bê-đê
  rationale: Giữ ý đồng hành của μετά và xác định rõ Xê-bê-đê là cha của cả hai người.
- source_word: καταρτίζοντας τὰ δίκτυα αὐτῶν
  choice: vá lưới
  rationale: Trong ngữ cảnh nghề cá, καταρτίζω chỉ việc sửa sang, đưa lưới trở lại tình trạng dùng được; “vá lưới” ngắn gọn và chính xác.
- source_word: ἐκάλεσεν αὐτούς
  choice: Ngài gọi họ
  rationale: Giữ cách diễn đạt đơn giản của nguyên văn và để ngữ cảnh cho thấy đây là lời kêu gọi làm môn đồ.
theological_decisions:
- issue: Hàm ý làm môn đồ trong ἐκάλεσεν
  choice: Ngài gọi họ
  alternative: Ngài gọi họ đi theo Ngài
  rationale: Ngữ cảnh cho thấy đây là lời gọi đi theo Chúa, nhưng câu này chỉ nói Ngài gọi họ; không thêm nội dung mà nguyên văn không nêu.
- issue: Chủ ngữ hàm ẩn của εἶδεν và ἐκάλεσεν
  choice: Đức Chúa Jêsus ... Ngài
  alternative: Người ... Người
  rationale: Chủ ngữ được kế thừa từ ngữ cảnh trước là Đức Chúa Jêsus. Nêu tên giúp câu tiếng Việt đứng độc lập, nhưng không thay đổi căn tính hay hành động của chủ thể.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Chúa Jêsus/Gia-cơ/Giăng/Xê-bê-đê” theo dạng tên quen thuộc trong truyền thống Kinh Thánh Tin Lành tiếng Việt. Tách câu Hy Lạp dài thành các câu tiếng Việt ngắn để mạch kể sáng rõ.
