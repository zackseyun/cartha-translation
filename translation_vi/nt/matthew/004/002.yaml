  text: καὶ νηστεύσας ἡμέρας τεσσεράκοντα καὶ νύκτας τεσσεράκοντα ὕστερον ἐπείνασεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/002.yaml
  text: And after fasting forty days and forty nights[a], he was hungry.
translation:
  language: vi
  text: Sau khi kiêng ăn bốn mươi ngày và bốn mươi đêm, Ngài đói.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “Sau khi đã kiêng ăn bốn mươi ngày và bốn mươi đêm, Ngài trở nên đói.”'
    reason: Giữ một cách diễn đạt thay thế gần cấu trúc nguyên ngữ hơn, làm rõ hành động kiêng ăn đã hoàn tất và sắc thái chuyển sang tình trạng đói.
lexical_decisions:
- source_word: νηστεύσας
  choice: sau khi kiêng ăn
  rationale: Phân từ chủ động bất định diễn tả hành động xảy ra trước động từ chính; cách dịch này tự nhiên trong tiếng Việt và giữ rõ quan hệ thời gian.
- source_word: ἡμέρας τεσσεράκοντα καὶ νύκτας τεσσεράκοντα
  choice: bốn mươi ngày và bốn mươi đêm
  rationale: Đối cách chỉ khoảng thời gian được diễn đạt tự nhiên mà không cần thêm từ chỉ thời lượng; đồng thời giữ nhịp điệu quen thuộc của câu Kinh Thánh.
- source_word: ὕστερον
  choice: sau khi
  rationale: Trạng từ đánh dấu thời điểm tiếp sau thời gian kiêng ăn. Ý nghĩa này được kết hợp tự nhiên vào cấu trúc 'sau khi ...', tránh lặp vụng về.
- source_word: ἐπείνασεν
  choice: Ngài đói
  rationale: Diễn đạt trực tiếp và tự nhiên tình trạng đói thực sự sau cuộc kiêng ăn; tiếng Việt không cần buộc phải dùng 'trở nên đói' để chuyển tải thể bất định.
- source_word: καὶ
  choice: Sau khi
  rationale: Liên từ nối tiếp mạch thuật chuyện; trong câu tiếng Việt, quan hệ nối tiếp được thể hiện tự nhiên qua cấu trúc mở đầu 'Sau khi', thay vì dịch máy móc là 'Và'.
theological_decisions:
- issue: Sự nhấn mạnh của trình thuật về nhu cầu thể chất thật của Chúa Giê-su sau khi kiêng ăn
  choice: Ngài đói
  alternative: Ngài trở nên đói
  rationale: Cách dịch nêu rõ cơn đói thật mà không thêm lời giải thích tín lý hoặc nhấn quá mức sắc thái bắt đầu của trạng thái.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “kiêng ăn” thay cho “nhịn ăn” vì phù hợp hơn với hành vi tôn giáo có chủ ý; “Ngài” duy trì lối quy chiếu tôn kính quen thuộc trong văn bản Kinh Thánh tiếng Việt.
