revisions:
- from: Ngài rời Nazara[a], đến và định cư tại Ca-phác-na-um, thành nằm bên biển, trong miền Sa-bu-lôn và Nép-ta-li.
  to: Ngài rời Na-xa-ra, đến định cư tại Ca-phác-na-um ven biển, trong vùng Sa-bu-lôn và Nép-ta-li.
  rationale: Sửa nhằm bỏ chi tiết “thành” được thêm vào, diễn đạt τὴν παραθαλασσίαν như một mô tả trực tiếp của Ca-phác-na-um, và thống nhất cách chuyển tự tên riêng theo tiếng Việt. Nghĩa và tính mơ hồ của văn bản nguồn được giữ nguyên.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T02:42:59Z'
review_pass:
  verdict: revise
  source_fidelity: Bản nháp truyền đạt đúng chuỗi hành động rời Nazara, đến và định cư tại Ca-phác-na-um, cũng như vị trí trong vùng Sa-bu-lôn và Nép-ta-li. Tuy nhiên, “thành nằm bên biển” thêm danh từ “thành” không có trong câu Hy Lạp; τὴν παραθαλασσίαν chỉ là mô tả apposition cho Ca-phác-na-um, nghĩa là địa điểm ven biển.
  naturalness: Câu sửa dùng cách phiên âm Việt nhất quán cho địa danh và diễn đạt “Ca-phác-na-um ven biển” gọn, tự nhiên. “Đến định cư” diễn tả trôi chảy hai phân từ dẫn đến động từ chính trong tiếng Việt.
  terminology: Dùng “Na-xa-ra” để phản ánh dạng Ναζαρά trong SBLGNT, đồng thời giữ “Na-xa-rét” trong chú thích như dạng quen thuộc. Ca-phác-na-um, Sa-bu-lôn và Nép-ta-li được giữ theo lối phiên âm Việt đang dùng trong bản nháp.
  issues:
  - severity: low
    issue: Thêm “thành” trong cụm “thành nằm bên biển”
    rationale: Bản Hy Lạp gọi Ca-phác-na-um là “(nơi) ven biển” chứ không nêu danh từ “thành” trong câu này. Bỏ phần thêm này giúp bản dịch bám sát nguồn hơn mà không làm mất nghĩa.
  - severity: low
    issue: 'Không nhất quán hình thức tên riêng: “Nazara” Latin bên cạnh các tên phiên âm Việt'
    rationale: Trong một bản tiếng Việt, “Na-xa-ra” vừa phản ánh hình thức Ναζαρά vừa nhất quán với Ca-phác-na-um, Sa-bu-lôn và Nép-ta-li. Chú thích có thể cung cấp dạng Latin Nazara.
  revised_text: Ngài rời Na-xa-ra, đến định cư tại Ca-phác-na-um ven biển, trong vùng Sa-bu-lôn và Nép-ta-li.
