id: MAT.4.13
reference: Matthew 4:13
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ καταλιπὼν τὴν Ναζαρὰ ἐλθὼν κατῴκησεν εἰς Καφαρναοὺμ τὴν παραθαλασσίαν ἐν ὁρίοις Ζαβουλὼν καὶ Νεφθαλίμ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/013.yaml
  text: And leaving Nazara[a], he came and settled in Capernaum by the sea, in the region of Zebulun and Naphtali.
translation:
  language: vi
  text: Ngài rời Na-xa-ra, đến định cư tại Ca-phác-na-um ven biển, trong vùng Sa-bu-lôn và Nép-ta-li.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καταλιπὼν
  choice: rời
  rationale: Phân từ bất định chỉ hành động xảy ra trước động từ chính; “rời” diễn đạt tự nhiên và rõ trình tự trong tiếng Việt.
- source_word: Ναζαρὰ
  choice: Nazara
  rationale: Giữ đúng dạng địa danh Ναζαρά trong văn bản Hy Lạp thay vì tự đồng nhất ngay với dạng quen thuộc Na-xa-rét; dạng quen thuộc được ghi ở chú thích.
- source_word: ἐλθὼν
  choice: đến
  rationale: Chuyển phân từ thành động từ nối tiếp để câu tiếng Việt tự nhiên mà vẫn giữ trình tự hành động.
- source_word: κατῴκησεν
  choice: định cư
  rationale: Diễn tả việc đến ở và lập nơi cư trú, phù hợp hơn nghĩa tĩnh “sống” hay “ở”.
- source_word: Καφαρναοὺμ
  choice: Ca-phác-na-um
  rationale: Dùng dạng phiên âm tiếng Việt quen thuộc của địa danh.
- source_word: τὴν παραθαλασσίαν
  choice: thành nằm bên biển
  rationale: Tính từ có mạo từ bổ nghĩa cho Ca-phác-na-um; thêm “thành” để quan hệ mô tả rõ và tự nhiên trong tiếng Việt.
- source_word: ἐν ὁρίοις
  choice: trong miền
  rationale: ὅρια ở đây chỉ địa phận hay vùng lãnh thổ; “miền” ngắn gọn và thích hợp với ngữ cảnh địa lý.
- source_word: Ζαβουλὼν
  choice: Sa-bu-lôn
  rationale: Dạng phiên âm tiếng Việt rõ ràng của tên chi phái và địa vực.
- source_word: Νεφθαλίμ
  choice: Nép-ta-li
  rationale: Dạng phiên âm tiếng Việt rõ ràng của tên chi phái và địa vực.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” vì chủ thể là Đức Giê-su trong ngữ cảnh liền trước; giữ Nazara bằng chữ Latin nhằm làm nổi bật dạng khác biệt của bản Hy Lạp, có chú thích giải thích.
