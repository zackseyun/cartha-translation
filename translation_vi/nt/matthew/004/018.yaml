  source_fidelity: 'Bản dịch truyền đạt đầy đủ các thành tố của câu Hy Lạp: hành động đang diễn ra khi Chúa đi dọc bờ Biển Ga-li-lê, việc nhìn thấy hai anh em Si-môn/Phi-e-rơ và An-rê, hành động quăng lưới, và lời giải thích rằng họ làm nghề đánh cá. Cấu trúc “hai anh em là ... và ...” diễn đạt rõ quan hệ anh em trong câu mà không áp đặt An-rê là anh hay em của Si-môn, điều nguyên ngữ không xác định.'
  naturalness: Văn phong tự nhiên, rõ ràng, và phù hợp tiếng Việt hiện đại. “Khi đang đi dọc theo,” “quăng chài xuống biển,” và “những người đánh cá” đều dễ hiểu trong văn cảnh tự sự. Đại từ “Ngài” phù hợp văn cảnh trực tiếp trước đó, nơi chủ ngữ đã được xác định.
  terminology: Tên riêng Si-môn, Phi-e-rơ, An-rê và địa danh Ga-li-lê được phiên chuyển nhất quán theo lối Kinh Thánh Việt ngữ. “Chài” là cách dịch phù hợp và có sắc thái cụ thể cho ἀμφίβληστρον; chú thích giữ lựa chọn rộng hơn “lưới” và giải thích đúng nghĩa từ Hy Lạp. Không có vấn đề thần học hay giáo phái.
