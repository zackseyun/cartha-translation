id: MAT.4.18
reference: Matthew 4:18
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Περιπατῶν δὲ παρὰ τὴν θάλασσαν τῆς Γαλιλαίας εἶδεν δύο ἀδελφούς, Σίμωνα τὸν λεγόμενον Πέτρον καὶ Ἀνδρέαν τὸν ἀδελφὸν αὐτοῦ, βάλλοντας ἀμφίβληστρον εἰς τὴν θάλασσαν, ἦσαν γὰρ ἁλιεῖς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/018.yaml
  text: As he was walking beside the Sea of Galilee[a], he saw two brothers, Simon who is called Peter and Andrew his brother, casting a net into the sea, for they were fishermen.
translation:
  language: vi
  text: Khi đang đi dọc theo biển Ga-li-lê, Ngài thấy hai anh em là Si-môn, người được gọi là Phi-e-rơ, và An-rê. Họ đang quăng chài[a] xuống biển, vì họ là những người đánh cá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “quăng lưới”; từ Hy Lạp chỉ một loại lưới được quăng ra để đánh cá.
    reason: lexical_alternative
lexical_decisions:
- source_word: Περιπατῶν δὲ
  choice: Khi đang đi
  rationale: Phân từ hiện tại diễn tả hành động đang diễn ra đồng thời với động từ chính; “khi đang đi” tự nhiên trong tiếng Việt và giữ được quan hệ thời gian.
- source_word: παρὰ τὴν θάλασσαν τῆς Γαλιλαίας
  choice: dọc theo biển Ga-li-lê
  rationale: παρά với đối cách chỉ chuyển động men theo hoặc bên cạnh; “dọc theo” diễn đạt rõ chuyển động, còn “biển Ga-li-lê” giữ cách gọi địa danh truyền thống dù về địa lý đây là một hồ.
- source_word: εἶδεν
  choice: Ngài thấy
  rationale: Động từ aorist kể lại một sự việc đơn giản. Đại từ “Ngài” tiếp nối chủ thể là Đức Chúa Jêsus trong văn cảnh mà không thêm tên không có trong câu Hy Lạp.
- source_word: δύο ἀδελφούς
  choice: hai anh em
  rationale: Ở đây chỉ hai anh em ruột nam. Cách nói này tự nhiên và không buộc phải xác định ai lớn hay nhỏ.
- source_word: Σίμωνα τὸν λεγόμενον Πέτρον
  choice: Si-môn, người được gọi là Phi-e-rơ
  rationale: Giữ sắc thái bị động của λεγόμενον và phân biệt tên Si-môn với tên gọi Phi-e-rơ.
- source_word: Ἀνδρέαν τὸν ἀδελφὸν αὐτοῦ
  choice: và An-rê
  rationale: Quan hệ An-rê là anh em của Si-môn đã được diễn đạt rõ qua cấu trúc “hai anh em là ... và ...”; cách này tránh phải thêm “anh” hoặc “em”, điều nguyên văn không xác định.
- source_word: βάλλοντας ἀμφίβληστρον
  choice: đang quăng chài
  rationale: Phân từ hiện tại mô tả việc họ đang làm khi được nhìn thấy. ἀμφίβληστρον là loại lưới được quăng ra để đánh cá; “quăng chài” vừa chính xác vừa tự nhiên.
- source_word: εἰς τὴν θάλασσαν
  choice: xuống biển
  rationale: εἰς diễn tả hướng chuyển động; với hành động quăng chài từ bờ hoặc thuyền, “xuống biển” tự nhiên hơn “vào biển” trong tiếng Việt.
- source_word: ἦσαν γὰρ ἁλιεῖς
  choice: vì họ là những người đánh cá
  rationale: γάρ đưa ra lời giải thích, được thể hiện bằng “vì”; “những người đánh cá” là cách diễn đạt phổ thông và sát nghĩa ἁλιεῖς.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Ngài” theo văn cảnh để chỉ Đức Chúa Jêsus; không thêm thông tin ngoài nguyên văn. Dấu chân chú [a] được đặt ngay sau “chài”, đúng với từ ngữ mà chú thích giải thích.
