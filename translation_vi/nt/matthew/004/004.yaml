id: MAT.4.4
reference: Matthew 4:4
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν· Γέγραπται· Οὐκ ἐπ’ ἄρτῳ μόνῳ ζήσεται ⸀ὁ ἄνθρωπος, ἀλλ’ ⸀ἐπὶ παντὶ ῥήματι ἐκπορευομένῳ διὰ στόματος θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/004.yaml
  text: 'But he answered[a], “It is written: ‘Man will not live by bread alone[b], but by every word proceeding through the mouth of God.’”'
translation:
  language: vi
  text: 'Nhưng Ngài đáp: “Có lời chép rằng: ‘Người ta sống không chỉ nhờ bánh, nhưng còn nhờ mọi lời ra từ miệng Đức Chúa Trời.’”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: Ngài đáp
  rationale: Diễn đạt tự nhiên cấu trúc kể chuyện mang ảnh hưởng Semit; tránh lặp không cần thiết kiểu ‘đáp và nói’.
- source_word: Γέγραπται
  choice: Có lời chép rằng
  rationale: Công thức quen thuộc dùng để dẫn Kinh Thánh, đồng thời phản ánh một điều đã được chép và vẫn có hiệu lực.
- source_word: ἄρτῳ μόνῳ
  choice: chỉ nhờ bánh
  rationale: Giữ nghĩa trực tiếp của ‘bánh’ và ý loại trừ của μόνῳ; ‘nhờ’ diễn đạt tự nhiên phương tiện duy trì sự sống.
- source_word: ζήσεται ὁ ἄνθρωπος
  choice: Người ta sống
  rationale: ‘Người ta’ truyền đạt lực đại diện, chỉ loài người nói chung, mà không giới hạn vào một người nam cụ thể; hiện tại tiếng Việt diễn đạt tự nhiên chân lý khái quát của câu trích dẫn.
- source_word: παντὶ ῥήματι
  choice: mọi lời
  rationale: Chỉ mọi điều Đức Chúa Trời phán; ‘lời’ vừa tự nhiên vừa giữ được sắc thái phát ngôn.
- source_word: ἐκπορευομένῳ διὰ στόματος θεοῦ
  choice: ra từ miệng Đức Chúa Trời
  rationale: Giữ hình ảnh lời phát ra qua miệng Đức Chúa Trời, nhưng dùng cách diễn đạt tiếng Việt tự nhiên; ‘ra từ miệng’ chuyển tải kết hợp ý của động từ phân từ và διά.
theological_decisions:
- issue: Lực đại diện của ὁ ἄνθρωπος
  choice: Người ta
  alternative: con người; người nam
  rationale: Câu nói nêu chân lý chung về nhân loại. ‘Người ta’ giữ số ít mang nghĩa khái quát mà không khiến độc giả hiểu lầm là chỉ nói về nam giới.
- issue: Công thức trích dẫn Γέγραπται
  choice: Có lời chép rằng
  alternative: Đã có chép; Có chép rằng
  rationale: Giữ công thức dẫn Kinh Thánh quen thuộc và thẩm quyền tiếp diễn của điều đã được chép, không thêm diễn giải thần học.
- issue: διά với sở hữu cách trong hình ảnh lời phán
  choice: ra từ miệng Đức Chúa Trời
  alternative: đi qua miệng Đức Chúa Trời
  rationale: ‘Đi qua miệng’ tuy sát hình thức διά hơn nhưng gượng và dễ gợi nghĩa không phù hợp trong tiếng Việt. ‘Ra từ miệng’ bảo toàn hình ảnh phát ngôn và nghĩa toàn cụm.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng ‘Ngài’ theo ngữ cảnh chỉ Đức Chúa Giê-su; ‘Đức Chúa Trời’ là cách gọi phổ biến trong truyền thống Tin Lành Việt ngữ. Cấu trúc ‘không chỉ… nhưng còn…’ làm rõ quan hệ đối chiếu mà không biến câu thành sự phủ nhận vai trò của bánh.
