id: MAT.4.23
reference: Matthew 4:23
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Καὶ περιῆγεν ⸂ἐν ὅλῃ τῇ Γαλιλαίᾳ⸃, διδάσκων ἐν ταῖς συναγωγαῖς αὐτῶν καὶ κηρύσσων τὸ εὐαγγέλιον τῆς βασιλείας καὶ θεραπεύων πᾶσαν νόσον καὶ πᾶσαν μαλακίαν ἐν τῷ λαῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/023.yaml
  text: And he went throughout all Galilee[a], teaching in their synagogues and proclaiming the good news of the kingdom and healing every disease and every sickness among the people.
translation:
  language: vi
  text: Đức Giê-su đi khắp miền Ga-li-lê, giảng dạy trong các hội đường của họ, công bố Tin Mừng của vương quốc[a], và chữa lành mọi bệnh tật cùng mọi chứng đau yếu trong dân chúng.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “tin mừng về vương quốc.”'
    reason: Thuộc cách τῆς βασιλείας có thể được hiểu là nêu nội dung của Tin Mừng, tức Tin Mừng nói về vương quốc.
lexical_decisions:
- source_word: περιῆγεν
  choice: đi khắp
  rationale: Thì chưa hoàn thành diễn tả hoạt động đi lại liên tục qua nhiều nơi; “đi khắp” vừa tự nhiên trong tiếng Việt vừa giữ được ý phân bố trên toàn vùng.
- source_word: ἐν ὅλῃ τῇ Γαλιλαίᾳ
  choice: khắp miền Ga-li-lê
  rationale: Với động từ chỉ chuyển động, cụm này nói đến toàn phạm vi Ga-li-lê. “Khắp miền” truyền đạt đầy đủ ý của ὅλῃ mà tránh cách nói dư thừa “khắp toàn miền”.
- source_word: διδάσκων
  choice: giảng dạy
  rationale: Phân từ hiện tại chỉ hoạt động diễn ra đồng thời với việc đi khắp nơi; “giảng dạy” là cách diễn đạt tự nhiên và trang trọng.
- source_word: συναγωγαῖς αὐτῶν
  choice: các hội đường của họ
  rationale: “Hội đường” là thuật ngữ tiếng Việt thông dụng cho nơi nhóm họp và thờ phượng của người Do Thái; “của họ” giữ đại từ sở hữu αὐτῶν.
- source_word: κηρύσσων
  choice: công bố
  rationale: Động từ chỉ việc loan báo công khai với tư cách người truyền tin; “công bố” giữ sắc thái công khai và có thẩm quyền.
- source_word: τὸ εὐαγγέλιον
  choice: Tin Mừng
  rationale: “Tin Mừng” truyền đạt trực tiếp nghĩa tin tốt lành, dễ hiểu, trang trọng và đã quen thuộc rộng rãi trong tiếng Việt.
- source_word: τῆς βασιλείας
  choice: của vương quốc
  rationale: Giữ sát cấu trúc sở hữu của thuộc cách Hy Lạp và không tự ý thêm “Đức Chúa Trời,” vốn không xuất hiện trong câu; cách hiểu “về vương quốc” được ghi ở chú thích.
- source_word: θεραπεύων
  choice: chữa lành
  rationale: Trong ngữ cảnh này, động từ nói đến việc thực sự làm cho người bệnh được lành; “chữa lành” vừa rộng nghĩa vừa tự nhiên.
- source_word: πᾶσαν νόσον
  choice: mọi bệnh tật
  rationale: νόσος chỉ bệnh hay chứng bệnh; “mọi bệnh tật” giữ tính bao quát được nhấn mạnh bởi πᾶσαν.
- source_word: πᾶσαν μαλακίαν
  choice: mọi chứng đau yếu
  rationale: μαλακία có thể chỉ sự yếu đuối, đau yếu hoặc bệnh trạng. “Chứng đau yếu” phân biệt tương đối với “bệnh tật” mà vẫn giữ phạm vi rộng.
- source_word: ἐν τῷ λαῷ
  choice: trong dân chúng
  rationale: Cụm này nêu phạm vi những người được chữa lành; “trong dân chúng” tự nhiên và không áp đặt một nghĩa thần học chuyên biệt lên λαός.
theological_decisions:
- issue: Cách dịch εὐαγγέλιον
  choice: Tin Mừng
  alternative: Tin Lành
  rationale: “Tin Mừng” truyền đạt nghĩa từ vựng trực tiếp và dễ hiểu mà không làm thay đổi nội dung thần học; tránh để một truyền thống thuật ngữ riêng chi phối bản dịch.
- issue: Quan hệ của thuộc cách trong τὸ εὐαγγέλιον τῆς βασιλείας
  choice: Tin Mừng của vương quốc
  alternative: tin mừng về vương quốc
  rationale: Bản chính giữ gần cấu trúc Hy Lạp và để ngỏ quan hệ giữa Tin Mừng với vương quốc; chú thích nêu cách hiểu nội dung là Tin Mừng nói về vương quốc.
- issue: Phạm vi chữa lành trong πᾶσαν νόσον καὶ πᾶσαν μαλακίαν
  choice: mọi bệnh tật cùng mọi chứng đau yếu
  alternative: mọi bệnh hoạn và mọi sự yếu đau
  rationale: Giữ cả hai lần πᾶσαν để phản ánh sự nhấn mạnh toàn diện, đồng thời dùng hai cụm khác nhau để không nhập νόσος và μαλακίαν thành một khái niệm.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Giê-su” để xác định chủ thể rõ ràng khi câu được đọc độc lập; dùng “vương quốc” thay vì tự thêm “Đức Chúa Trời” hoặc “thiên đàng,” vì các từ ấy không có trong câu Hy Lạp. Địa danh được phiên âm “Ga-li-lê” theo lối quen thuộc trong tiếng Việt.
