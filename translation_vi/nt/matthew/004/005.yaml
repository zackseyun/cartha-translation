source:
  edition: SBLGNT
  text: Τότε παραλαμβάνει αὐτὸν ὁ διάβολος εἰς τὴν ἁγίαν πόλιν, καὶ ⸀ἔστησεν αὐτὸν ἐπὶ τὸ πτερύγιον τοῦ ἱεροῦ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/005.yaml
  text: Then the devil takes him into the holy city and sets him on the pinnacle of the temple[b][a],
translation:
  language: vi
  text: Bấy giờ, quỷ dữ đưa Ngài vào thành thánh[a] và đặt Ngài trên chóp của đền thờ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tức là Giê-ru-sa-lem.
    reason: cross_reference
  - marker: b
    text: Cũng có thể dịch là “cánh của đền thờ”; từ Hy Lạp có thể chỉ một mép nhô ra hoặc một điểm cao của khu đền thờ.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Bấy giờ
  rationale: Diễn tả sự tiếp nối theo trình tự trong câu chuyện bằng lối văn tự nhiên, trang trọng.
- source_word: παραλαμβάνει
  choice: đưa
  rationale: Động từ hiện tại lịch sử tạo sắc thái sống động; tiếng Việt dùng hiện tại không đánh dấu nên “đưa” tự nhiên hơn “tiếp nhận” và vẫn diễn tả việc dẫn Đức Giê-su đi cùng.
- source_word: ὁ διάβολος
  choice: ma quỷ
  rationale: Trong ngữ cảnh này, διάβολος là danh xưng chỉ một nhân vật cụ thể; “ma quỷ” là cách gọi quen thuộc và dễ hiểu trong tiếng Việt.
- source_word: εἰς τὴν ἁγίαν πόλιν
  choice: vào thành thánh
  rationale: “Vào” giữ ý chuyển động của εἰς; “thành thánh” bảo tồn danh xưng trong nguyên văn thay vì thay bằng tên riêng Giê-ru-sa-lem.
- source_word: ἔστησεν
  choice: đặt
  rationale: Dạng ngoại động, gây khiến của ἵστημι ở đây có nghĩa là làm cho Ngài đứng tại một vị trí; “đặt” diễn đạt gọn và không khiến hành động bị hiểu là do chính Đức Giê-su chủ động.
- source_word: ἐπὶ τὸ πτερύγιον
  choice: trên chóp
  rationale: πτερύγιον vốn có thể chỉ một phần nhô ra như cánh hoặc một điểm cao của công trình. “Chóp” là cách dịch ngắn gọn, dễ hình dung, còn độ bất định kiến trúc được giữ trong chú thích.
- source_word: τοῦ ἱεροῦ
  choice: của đền thờ
  rationale: ἱερόν chỉ toàn khu đền thờ chứ không riêng nơi thánh bên trong; “đền thờ” là cách nói tự nhiên trong chính văn, và phạm vi rộng hơn được nêu trong chú thích.
theological_decisions:
- issue: Cách xác định “thành thánh”
  choice: Giữ danh xưng “thành thánh” trong chính văn.
  alternative: Dịch thẳng là “Giê-ru-sa-lem”.
  rationale: Nguyên văn dùng danh xưng mang tính tôn kính chứ không dùng tên riêng. Chú thích xác định địa danh mà không thay thế cách diễn đạt của bản văn.
- issue: Nghĩa của πτερύγιον τοῦ ἱεροῦ
  choice: Dịch là “chóp của đền thờ” và ghi chú về độ bất định.
  alternative: “cánh của đền thờ” hoặc “điểm cao của khu đền thờ”.
  rationale: Không thể xác định chắc chắn bộ phận kiến trúc được nói đến. Cách dịch chính giữ hình ảnh quen thuộc nhưng không khẳng định đó nhất thiết là điểm cao nhất; chú thích bảo tồn các khả năng từ vựng.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” để quy chiếu Đức Giê-su trong mạch văn; giữ hiện tại trần thuật tự nhiên của tiếng Việt và tránh giải quyết quá mức độ bất định về kiến trúc.
