  text: ἔφη αὐτῷ ὁ Ἰησοῦς· Πάλιν γέγραπται· Οὐκ ἐκπειράσεις κύριον τὸν θεόν σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/007.yaml
  text: 'Jesus said to him[b][a], “Again it is written: ‘You shall not put the Lord your God to the test.’”'
translation:
  language: vi
  text: 'Đức Giê-su nói với nó: “Lại có lời chép rằng: ‘Ngươi chớ thử thách[a] Chúa[b], là Đức Chúa Trời của ngươi.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Ngươi chớ thử Chúa, là Đức Chúa Trời của ngươi.” Động từ Hy Lạp ἐκπειράζω có thể được dịch là “thử” hoặc “thử thách”.'
    reason: lexical_alternative
  - marker: b
    text: Đây là lời trích từ Phục Truyền Luật Lệ Ký 6:16. Từ “Chúa” trong tiếng Hy Lạp phản ánh cách Bản Bảy Mươi dịch danh thánh của Đức Chúa Trời.
    reason: cross_reference
lexical_decisions:
- source_word: ἔφη αὐτῷ ὁ Ἰησοῦς
  choice: Đức Giê-su nói với nó
  rationale: Cụm này là lời dẫn trực tiếp, tự nhiên. Đại từ αὐτῷ quy về ma quỷ trong ngữ cảnh trước, nên “nó” giúp tiếng Việt rõ nghĩa mà không thêm danh xưng vào nguyên văn câu này.
- source_word: Πάλιν
  choice: Lại
  rationale: Giữ nghĩa thông thường của trạng từ và cho thấy Đức Giê-su đáp lại bằng một lời Kinh Thánh khác.
- source_word: γέγραπται
  choice: có lời chép rằng
  rationale: Đây là công thức trích dẫn Kinh Thánh; cách dịch này tự nhiên, trang trọng và vẫn thể hiện lời đã được chép có giá trị hiện hành.
- source_word: Οὐκ ἐκπειράσεις
  choice: Ngươi không được thử thách
  rationale: Thì tương lai được dùng với lực cấm đoán. “Không được” truyền đạt mệnh lệnh rõ ràng; “thử thách” diễn tả việc cố tình đặt Đức Chúa Trời vào tình thế phải chứng tỏ mình.
- source_word: κύριον
  choice: Chúa
  rationale: Dịch sát κύριος trong bản Hy Lạp và phù hợp với cấu trúc đồng vị “Chúa là Đức Chúa Trời của ngươi”; hậu cảnh danh thánh trong Phục Truyền Luật Lệ Ký được ghi ở chú thích.
- source_word: τὸν θεόν σου
  choice: Đức Chúa Trời của ngươi
  rationale: Diễn đạt tự nhiên quan hệ sở hữu của θεόν với σου, đồng thời giữ cách xưng hô số ít trong lời luật được trích dẫn.
theological_decisions:
- issue: Cách dịch κύριος trong lời trích dẫn nói về Đức Chúa Trời của Israel
  choice: Chúa
  alternative: ĐỨC GIÊ-HÔ-VA
  rationale: Nguồn trực tiếp là bản Hy Lạp với κύριος, nên bản văn chính dịch “Chúa”, không phục hồi danh riêng tiếng Hê-bơ-rơ vào câu Hy Lạp. Chú thích nêu rõ hậu cảnh Bản Bảy Mươi và danh thánh.
- issue: Sắc thái của ἐκπειράζω
  choice: thử thách
  alternative: thử
  rationale: “Thử thách” truyền đạt sắc thái đặt Đức Chúa Trời vào phép thử, nhưng vì động từ cũng có thể dịch gọn là “thử”, phương án ấy được bảo lưu trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Giê-su” và “Đức Chúa Trời” theo lối gọi quen thuộc trong tiếng Việt; giữ “ngươi” trong lời luật trích dẫn để thể hiện đại từ số ít và sắc thái trang trọng. Các dấu chú thích được đặt ngay sau câu trích dẫn theo thứ tự [a][b].
