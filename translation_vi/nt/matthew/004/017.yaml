language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἀπὸ τότε ἤρξατο ὁ Ἰησοῦς κηρύσσειν καὶ λέγειν· Μετανοεῖτε, ἤγγικεν γὰρ ἡ βασιλεία τῶν οὐρανῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/017.yaml
  text: From that time Jesus began to proclaim[a], saying, “Repent[c][b], for the kingdom of heaven has drawn near.”
translation:
  language: vi
  text: 'Từ lúc ấy, Giê-su bắt đầu rao giảng rằng[a]: “Hãy ăn năn[b], vì Nước Trời[c] đã đến gần[d].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sát chữ: “rao giảng và nói.”'
    reason: previous_rendering
  - marker: b
    text: “Ăn năn” ở đây hàm ý thay đổi tâm trí và hướng đi của đời sống, chứ không chỉ cảm thấy hối tiếc.
    reason: lexical_clarification
  - marker: c
    text: Tiếng Hy Lạp có thể chỉ “vương quốc” hoặc “vương quyền”; sát chữ là “vương quốc của các tầng trời.” Ma-thi-ơ thường dùng cách nói này ở những chỗ các sách khác thường nói “vương quốc của Đức Chúa Trời.”
    reason: lexical_alternative
  - marker: d
    text: 'Cũng có thể dịch: “đã tới gần” hoặc “đang ở gần.” Dạng hoàn thành trong tiếng Hy Lạp diễn tả sự gần kề đã xảy đến và vẫn còn hiệu lực.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀπὸ τότε
  choice: Từ lúc ấy
  rationale: Diễn đạt tự nhiên một bước ngoặt trong mạch kể và vẫn giữ rõ điểm khởi đầu về thời gian.
- source_word: ἤρξατο
  choice: bắt đầu
  rationale: Tương đương trực tiếp, tự nhiên với động từ chỉ sự khởi đầu trong cấu trúc đi cùng động từ nguyên mẫu.
- source_word: κηρύσσειν καὶ λέγειν
  choice: rao giảng rằng
  rationale: “Rao giảng” giữ sắc thái công khai của κηρύσσω; “rằng” dẫn vào nội dung lời rao giảng một cách tự nhiên trong tiếng Việt. Chú thích lưu lại cấu trúc phối hợp sát chữ “rao giảng và nói”.
- source_word: Μετανοεῖτε
  choice: Hãy ăn năn
  rationale: Mệnh lệnh này kêu gọi sự thay đổi hướng suy nghĩ và đời sống; “ăn năn” là cách diễn đạt quen thuộc, trang trọng mà không thu hẹp ý nghĩa thành cảm giác hối tiếc đơn thuần.
- source_word: ἤγγικεν
  choice: đã đến gần
  rationale: Thì hoàn thành Hy Lạp nói đến sự gần kề đã xảy đến và vẫn còn hiệu lực; “đã đến gần” giữ được cả chuyển biến lẫn tình trạng hiện tại.
- source_word: βασιλεία
  choice: vương quốc
  rationale: Từ này có thể chỉ cả vương quyền/sự cai trị lẫn lãnh vực thuộc quyền vua. “Vương quốc” là danh từ dễ hiểu, giữ hình ảnh vương quyền mà không quyết định dứt khoát giữa các sắc thái.
- source_word: τῶν οὐρανῶν
  choice: thiên đàng
  rationale: Dạng số nhiều theo sát chữ là “các tầng trời”, nhưng trong thành ngữ đặc trưng của Ma-thi-ơ, tiếng Việt tự nhiên dùng “thiên đàng”; chú thích bảo tồn hình thức số nhiều của nguyên văn.
theological_decisions:
- issue: Ý nghĩa của βασιλεία τῶν οὐρανῶν
  choice: vương quốc thiên đàng
  alternative: vương quyền của thiên đàng; vương quốc của các tầng trời
  rationale: Cách chọn giữ lối nói đặc trưng của Ma-thi-ơ và không đồng nhất vương quốc chỉ với một địa điểm. Chú thích nêu rõ βασιλεία cũng có thể nhấn mạnh quyền cai trị.
- issue: Sức nặng của Μετανοεῖτε
  choice: Hãy ăn năn
  alternative: Hãy quay trở lại; Hãy thay đổi lòng trí
  rationale: “Ăn năn” chuyển tải lời kêu gọi đổi hướng về mặt đạo đức và tâm linh, không giản lược thành việc đổi ý về trí óc hay áp đặt một mô hình giáo phái cụ thể.
- issue: Sắc thái thời của ἤγγικεν
  choice: đã đến gần
  alternative: đang ở gần; đã gần đến
  rationale: Giữ sự căng thẳng giữa việc vương quốc đã tiến đến gần và sự gần kề ấy vẫn đang có hiệu lực, thay vì diễn giải rằng vương quốc đã đến trọn vẹn.
translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng hiện đại. Dùng “Giê-su” đúng theo tên riêng trong nguyên văn, không thêm tước hiệu không có trong câu. Cấu trúc “rao giảng rằng” tránh sự trùng lặp thiếu tự nhiên của bản dịch sát chữ, còn chú thích bảo tồn cấu trúc Hy Lạp.
