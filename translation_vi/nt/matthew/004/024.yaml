revisions:
- from: Danh tiếng về Ngài lan khắp xứ Sy-ri. Người ta đem đến cho Ngài tất cả những người đau ốm, bị đủ thứ bệnh tật và đau đớn hành hạ, những người bị quỷ ám[a], những người lên cơn co giật[b] và những người bại liệt; Ngài chữa lành họ.
  to: Tin tức về Ngài truyền đi khắp xứ Sy-ri. Người ta đem đến cho Ngài tất cả những người đau ốm, bị đủ thứ bệnh tật và đau đớn hành hạ, những người bị quỷ ám[a], những người lên cơn co giật[b] và những người bại liệt; Ngài chữa lành họ.
  rationale: Thay «Danh tiếng» bằng «Tin tức» để phản ánh ἀκοή chính xác hơn. Không thay đổi các lựa chọn còn lại, vì chúng phù hợp với nguyên văn, tiếng Việt hiện đại, và các chú thích đã bảo tồn những sắc thái có thể tranh luận của δαιμονιζομένους và σεληνιαζομένους.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T02:44:16Z'
