id: MAT.4.24
reference: Matthew 4:24
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἀπῆλθεν ἡ ἀκοὴ αὐτοῦ εἰς ὅλην τὴν Συρίαν· καὶ προσήνεγκαν αὐτῷ πάντας τοὺς κακῶς ἔχοντας ποικίλαις νόσοις καὶ βασάνοις ⸀συνεχομένους, δαιμονιζομένους καὶ σεληνιαζομένους καὶ παραλυτικούς, καὶ ἐθεράπευσεν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/024.yaml
  text: And the report about him went out into all Syria[a], and they brought to him all who were sick, afflicted with various diseases and torments, those oppressed by demons, those having seizures, and paralytics[c][b], and he healed them.
translation:
  language: vi
  text: Tin tức về Ngài truyền đi khắp xứ Sy-ri. Người ta đem đến cho Ngài tất cả những người đau ốm, bị đủ thứ bệnh tật và đau đớn hành hạ, những người bị quỷ ám[a], những người lên cơn co giật[b] và những người bại liệt; Ngài chữa lành họ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “bị quỷ nhập” hoặc “chịu sự tác động của quỷ.”'
    reason: lexical_alternative
  - marker: b
    text: Từ Hy Lạp theo nghĩa sát chữ là “bị ảnh hưởng bởi mặt trăng”; theo cách hiểu truyền thống, chỉ người mắc chứng động kinh.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκοὴ
  choice: danh tiếng
  rationale: Trong ngữ cảnh này, từ này chỉ điều người ta nghe biết về Đức Giê-su và danh tiếng của Ngài, không phải khả năng nghe.
- source_word: ἀπῆλθεν
  choice: lan khắp
  rationale: Diễn đạt tự nhiên trong tiếng Việt hình ảnh tin tức hay danh tiếng truyền đi, đồng thời kết hợp sát với εἰς ὅλην τὴν Συρίαν.
- source_word: Συρίαν
  choice: xứ Sy-ri
  rationale: Tên gọi địa lý quen thuộc trong văn phong Kinh Thánh tiếng Việt; 'xứ' cho thấy đây là một vùng lãnh thổ.
- source_word: κακῶς ἔχοντας
  choice: những người đau ốm
  rationale: Thành ngữ Hy Lạp chỉ những người đang trong tình trạng bệnh tật; cách dịch này rõ ràng và tự nhiên.
- source_word: ποικίλαις νόσοις καὶ βασάνοις συνεχομένους
  choice: bị đủ thứ bệnh tật và đau đớn hành hạ
  rationale: Giữ cả sự đa dạng của bệnh tật lẫn cường độ của βάσανοι, còn συνεχομένους được diễn đạt bằng 'bị... hành hạ'.
- source_word: δαιμονιζομένους
  choice: những người bị quỷ ám
  rationale: Cách nói thông dụng, dễ hiểu, giữ nguyên yếu tố quỷ tác động nhưng không xác định chi tiết mức độ kiểm soát hơn điều từ Hy Lạp cho phép.
- source_word: σεληνιαζομένους
  choice: những người lên cơn co giật
  rationale: Diễn đạt biểu hiện bệnh theo cách dễ hiểu hiện nay mà không khẳng định quan niệm cổ cho rằng mặt trăng gây bệnh; nghĩa sát chữ được ghi chú.
- source_word: παραλυτικούς
  choice: những người bại liệt
  rationale: Cách gọi tự nhiên trong tiếng Việt đối với người bị liệt.
- source_word: ἐθεράπευσεν
  choice: chữa lành
  rationale: Cách dịch chuẩn và thích hợp trong ngữ cảnh Đức Giê-su chữa bệnh.
theological_decisions:
- issue: Mức độ tác động của quỷ trong δαιμονιζομένους
  choice: bị quỷ ám
  alternative: bị quỷ nhập; chịu sự tác động của quỷ
  rationale: Bản dịch không loại bỏ thực tại siêu nhiên mà câu văn nêu ra, nhưng ghi chú rằng từ Hy Lạp không tự nó phân định mọi mức độ tác động theo các phạm trù kỹ thuật hiện đại.
- issue: Cách hiểu σεληνιαζομένους
  choice: lên cơn co giật
  alternative: bị ảnh hưởng bởi mặt trăng; mắc chứng động kinh
  rationale: Cách dịch chính truyền đạt biểu hiện có thể nhận biết mà không mặc nhiên xác nhận căn nguyên theo quan niệm cổ; chú thích bảo tồn liên hệ từ nguyên với mặt trăng.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng 'Ngài' để chỉ Đức Giê-su theo văn phong Kinh Thánh phổ thông. Câu được chia thành hai câu để tránh chuỗi liên từ dài, nhưng vẫn giữ trình tự và quan hệ ý nghĩa của nguyên văn.
