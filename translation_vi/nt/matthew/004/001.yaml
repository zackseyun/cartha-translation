  - severity: low
    issue: Cách nêu phương án trong chú thích thiếu dạng bị động của mệnh đề gốc.
    rationale: «Bị thử thách» phản ánh trực tiếp hơn dạng bị động πειρασθῆναι và đọc tự nhiên hơn «thử thách» đứng riêng trong chú thích.
