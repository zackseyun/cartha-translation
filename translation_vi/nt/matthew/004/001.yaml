  naturalness: Câu đã rõ ràng, trang trọng và tự nhiên. «Được Thánh Linh dẫn lên hoang mạc» vẫn là cách diễn đạt hiện đại, không gượng ép.
  terminology: «Đức Giê-su», «Thánh Linh», «hoang mạc» và «ma quỷ» phù hợp với ngữ cảnh và văn phong Kinh Thánh tiếng Việt. «Chịu ... cám dỗ» chuyển tải tốt πειρασθῆναι; chú thích nên nêu phương án ở dạng bị động đầy đủ, «bị thử thách».
