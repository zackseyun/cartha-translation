  text: Τότε ὁ Ἰησοῦς ἀνήχθη εἰς τὴν ἔρημον ὑπὸ τοῦ πνεύματος, πειρασθῆναι ὑπὸ τοῦ διαβόλου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/001.yaml
  text: Then Jesus was led up into the wilderness by the Spirit to be tempted by the devil[a].
translation:
  language: vi
  text: Bấy giờ, Đức Giê-su được Thánh Linh dẫn lên hoang mạc để chịu ma quỷ cám dỗ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “bị thử thách”; động từ Hy Lạp có thể mang nghĩa “cám dỗ” hoặc “thử thách”, nhưng ngữ cảnh ngay sau đó nghiêng về “cám dỗ”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Bấy giờ
  rationale: Diễn đạt tự nhiên một liên từ thời gian nối sự kiện này với biến cố ngay trước đó.
- source_word: ἀνήχθη
  choice: được dẫn vào
  rationale: Giữ thể bị động và ý được đưa đến một nơi; sắc thái chuyển động 'lên' không tự nhiên và không cần thiết phải thể hiện riêng trong tiếng Việt ở đây.
- source_word: εἰς τὴν ἔρημον
  choice: vào hoang mạc
  rationale: ‘Hoang mạc’ chỉ vùng hoang vắng, phù hợp bối cảnh mà không xác định quá hẹp địa hình là sa mạc cát.
- source_word: ὑπὸ τοῦ πνεύματος
  choice: được Thánh Linh dẫn
  rationale: Ngữ cảnh ngay sau phép báp-têm xác định đây là Linh của Đức Chúa Trời; ‘Thánh Linh’ là cách gọi rõ ràng, trang trọng và tự nhiên trong tiếng Việt.
- source_word: πειρασθῆναι
  choice: để chịu ... cám dỗ
  rationale: Tác nhân là ma quỷ và phần tường thuật tiếp theo thiên về sự dụ dỗ làm điều sai; thể bị động được giữ bằng ‘chịu’, còn nghĩa ‘thử thách’ được ghi ở chú thích.
- source_word: ὑπὸ τοῦ διαβόλου
  choice: ma quỷ
  rationale: Trong ngữ cảnh này, διάβολος là danh xưng của kẻ đối nghịch có ngôi vị; ‘ma quỷ’ là cách dịch thông dụng, dễ hiểu.
theological_decisions:
- issue: Căn tính của τοῦ πνεύματος
  choice: Thánh Linh
  alternative: linh; tâm linh của Đức Giê-su
  rationale: Mạch văn ngay trước đó nói đến Thánh Linh ngự xuống trên Đức Giê-su, nên cách hiểu này có cơ sở trực tiếp từ câu chuyện.
- issue: Ý nghĩa của πειρασθῆναι
  choice: chịu cám dỗ
  alternative: bị thử thách
  rationale: Ngữ cảnh ma quỷ tìm cách khiến Đức Giê-su phạm điều sai nghiêng về ‘cám dỗ’, nhưng động từ Hy Lạp cũng có thể mang nghĩa ‘thử thách’; chú thích duy trì độ căng nghĩa này.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng ‘Đức Giê-su’, ‘Thánh Linh’, ‘hoang mạc’ và ‘ma quỷ’; cấu trúc câu giữ quan hệ tác nhân và mục đích của nguyên văn Hy Lạp.
