source:
  edition: SBLGNT
  text: καὶ λέγει αὐτοῖς· Δεῦτε ὀπίσω μου, καὶ ποιήσω ὑμᾶς ἁλιεῖς ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/019.yaml
  text: And he says to them[a], “Come after me, and I will make you fishers of men.”
translation:
  language: vi
  text: 'Ngài bảo họ: “Hãy theo ta, ta sẽ làm cho các anh trở thành những tay đánh lưới người.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: bảo
  rationale: Động từ hiện tại lịch sử được diễn đạt bằng “bảo,” một động từ kể chuyện tự nhiên trong tiếng Việt và không buộc phải đánh dấu thì; nó cũng phù hợp với lời gọi trực tiếp theo sau.
- source_word: Δεῦτε ὀπίσω μου
  choice: Hãy theo ta
  rationale: Cụm này theo sát ý của lời triệu gọi “hãy đến theo sau ta,” nhưng dùng cách nói tiếng Việt tự nhiên. Dịch tách từng thành tố thành “hãy đến đằng sau ta” sẽ dễ bị hiểu thuần túy theo vị trí không gian.
- source_word: ποιήσω ὑμᾶς
  choice: ta sẽ làm cho các anh trở thành
  rationale: Giữ rõ hành động biến đổi được hứa trong động từ tương lai ποιήσω. “Các anh” phù hợp với những người nam đang được gọi trong ngữ cảnh mà không biến lời nói thành lối diễn đạt cổ.
- source_word: ἁλιεῖς ἀνθρώπων
  choice: những tay đánh lưới người
  rationale: Giữ nguyên hình ảnh đánh bắt trong tiếng Hy Lạp bằng một thành ngữ ngắn gọn, dễ hiểu. “Người” diễn đạt tự nhiên nghĩa chung của ἀνθρώπων là con người, không chỉ riêng đàn ông.
theological_decisions:
- issue: Phạm vi giới tính của ἀνθρώπων
  choice: người
  alternative: đàn ông
  rationale: Trong ngữ cảnh này, ἄνθρωπος chỉ loài người nói chung. Từ “người” vừa chính xác vừa tự nhiên trong tiếng Việt; “đàn ông” sẽ thu hẹp nghĩa không có trong câu.
- issue: Hình ảnh ἁλιεῖς ἀνθρώπων
  choice: giữ hình ảnh “đánh lưới người”
  alternative: diễn giải thành “thu phục người” hoặc “đưa người ta thành môn đồ”
  rationale: Bản dịch giữ phép ẩn dụ có chủ ý của câu gốc thay vì giải quyết sẵn ý nghĩa thần học của hình ảnh.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ đọc. Đại từ “Ngài/ta” thể hiện quan hệ giữa Chúa Giê-su và những người được gọi mà không thêm danh xưng không có trong câu Hy Lạp; “tay đánh lưới” giữ sắc thái nghề nghiệp và hình ảnh sống động.
