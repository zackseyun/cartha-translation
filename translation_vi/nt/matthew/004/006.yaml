id: MAT.4.6
reference: Matthew 4:6
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ λέγει αὐτῷ· Εἰ υἱὸς εἶ τοῦ θεοῦ, βάλε σεαυτὸν κάτω· γέγραπται γὰρ ὅτι Τοῖς ἀγγέλοις αὐτοῦ ἐντελεῖται περὶ σοῦ καὶ ἐπὶ χειρῶν ἀροῦσίν σε, μήποτε προσκόψῃς πρὸς λίθον τὸν πόδα σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/006.yaml
  text: 'And he said to him[a], “If you are the Son of God, throw yourself down, for it is written: ‘He will command his angels concerning you,’ and ‘On their hands they will lift you up[b], lest you strike your foot against a stone.’”'
translation:
  language: vi
  text: 'Ma quỷ nói với Ngài: “Nếu Ngài là Con Đức Chúa Trời, hãy lao mình xuống[a], vì có lời chép rằng:


    ‘Ngài sẽ truyền lệnh cho các thiên sứ của Ngài về Ngài,’


    và:


    ‘Họ sẽ nâng Ngài trên tay[b],

    kẻo chân Ngài va vào đá.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “hãy gieo mình xuống.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “Họ sẽ đỡ Ngài lên trên tay.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει αὐτῷ
  choice: nói với Ngài
  rationale: Thì hiện tại Hy Lạp là hiện tại lịch sử; tiếng Việt không đánh dấu thì bắt buộc. Cụm này giữ rõ người nghe là Chúa Giê-su, còn chủ ngữ được nối từ văn cảnh bằng “và”.
- source_word: Εἰ
  choice: Nếu
  rationale: Giữ nguyên tính chất điều kiện và thách thức của lời cám dỗ, không chuyển thành lời thừa nhận “vì” hay “bởi lẽ”.
- source_word: υἱὸς ... τοῦ θεοῦ
  choice: Con Đức Chúa Trời
  rationale: Trong văn cảnh Ma-thi-ơ, đây là một danh hiệu xác định. Cách diễn đạt này tự nhiên trong tiếng Việt và không thêm nội dung thần học ngoài nguyên văn.
- source_word: βάλε σεαυτὸν κάτω
  choice: hãy lao mình xuống
  rationale: Diễn đạt tự nhiên, rõ ràng mệnh lệnh tự ném mình từ trên cao xuống; tránh lối dịch quá cổ nhưng vẫn giữ sức mạnh của động từ.
- source_word: γέγραπται
  choice: có lời chép rằng
  rationale: Công thức dẫn Kinh Thánh quen thuộc và tự nhiên trong tiếng Việt, đồng thời phản ánh trạng thái bền vững của điều đã được chép.
- source_word: ἐντελεῖται
  choice: sẽ truyền lệnh
  rationale: Giữ sắc thái mệnh lệnh có thẩm quyền và thì tương lai của động từ.
- source_word: περὶ σοῦ
  choice: về Ngài
  rationale: Dịch trực tiếp περί với sở hữu cách là “về/liên quan đến”; “về Ngài” gọn và sát nghĩa hơn “cho Ngài”.
- source_word: ἐπὶ χειρῶν
  choice: trên tay
  rationale: Giữ hình ảnh các thiên sứ nâng đỡ người ấy trên tay; tiếng Việt có thể dùng danh từ số ít tập hợp mà không làm mất ý nghĩa số nhiều của nguyên văn.
- source_word: ἀροῦσίν σε
  choice: Họ sẽ nâng Ngài
  rationale: αἴρω ở đây chỉ hành động nhấc và đỡ lên. “Nâng” là cách diễn đạt hiện đại, rõ ràng; một phương án gần nghĩa khác được ghi ở chú thích.
- source_word: μήποτε προσκόψῃς
  choice: kẻo ... va
  rationale: “Kẻo” diễn đạt tự nhiên ý phòng ngừa của μήποτε; “va” phù hợp với hình ảnh bàn chân đập vào vật cứng.
- source_word: πρὸς λίθον
  choice: vào đá
  rationale: Cách nói tự nhiên trong tiếng Việt; danh từ không có mạo từ trong Hy Lạp không buộc tiếng Việt phải thêm “một hòn”.
- source_word: τὸν πόδα σου
  choice: chân Ngài
  rationale: Giữ danh từ số ít của nguyên văn; đại từ tôn xưng thống nhất với cách gọi Chúa Giê-su trong câu.
theological_decisions:
- issue: Sức nặng Cơ Đốc học của cụm “Con Đức Chúa Trời” trong lời thách thức
  choice: 'Dịch như một danh hiệu xác định: “Con Đức Chúa Trời”'
  alternative: “một người con của Đức Chúa Trời”
  rationale: Trong mạch văn Ma-thi-ơ, cụm này là danh hiệu chỉ Chúa Giê-su chứ không nói chung về một thành viên trong một nhóm. Bản dịch giữ sức nặng ấy mà không diễn giải thêm.
- issue: Ma quỷ trích dẫn Thi Thiên 91
  choice: Giữ nguyên lời trích dẫn như lời nhân vật nói, không thêm lời bình trong chính văn
  alternative: Chèn lời giải thích rằng câu Kinh Thánh đang bị dùng sai
  rationale: Nguyên văn để sự căng thẳng được bộc lộ qua diễn tiến câu chuyện. Bản dịch không nên giải quyết trước bằng cách đưa bình luận thần học vào lời thoại.
- issue: Cách xưng hô với Chúa Giê-su trong lời của kẻ cám dỗ
  choice: Dùng “Ngài” để tránh đại từ khinh miệt và duy trì lối văn trang trọng
  alternative: Dùng “ngươi” để thể hiện giọng thách thức
  rationale: Hệ thống đại từ tiếng Việt buộc người dịch phải lựa chọn sắc thái mà tiếng Hy Lạp không mã hóa rõ. “Ngài” không làm mất nội dung thách thức vốn đã thể hiện qua câu điều kiện và mệnh lệnh, đồng thời tránh tự ý thêm sự miệt thị.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Chúa Trời” và đại từ “Ngài” theo lối Việt ngữ Kinh Thánh phổ thông. Cấu trúc thơ xuống dòng giúp người đọc nhận ra phần trích dẫn Kinh Thánh; “và” trước lời trích thứ hai được giữ để phản ánh cấu trúc Hy Lạp.
