  source_fidelity: 'Bản dịch chuyển đạt chính xác các thành tố chính của câu: εὐθέως là “lập tức,” ἀφέντες τὰ δίκτυα là “bỏ lưới,” và ἠκολούθησαν αὐτῷ là “đi theo Ngài.” Việc không dịch riêng δέ là chấp nhận được trong tiếng Việt, vì đây chỉ là từ nối nhẹ trong mạch tự sự. Trật tự “bỏ lưới và đi theo” diễn đạt tự nhiên quan hệ hành động của phân từ bất định với động từ chính mà không thêm ý nghĩa.'
  naturalness: “Họ lập tức bỏ lưới và đi theo Ngài” là câu tiếng Việt hiện đại, rõ ràng, trang trọng vừa phải và phù hợp văn phong Kinh Thánh. “Lưới” không cần thêm “đánh cá” hay “của họ” vì ngữ cảnh trước đó đã xác định.
