  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οἱ δὲ εὐθέως ἀφέντες τὰ δίκτυα ἠκολούθησαν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/020.yaml
  text: And they immediately left the nets and followed him.
translation:
  language: vi
  text: Họ lập tức bỏ lưới và đi theo Ngài.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: lược dịch
  rationale: Ở đây δέ là từ nối nhẹ để tiếp tục mạch kể. Tiếng Việt không cần một liên từ riêng trong câu này; lược dịch giúp lời văn tự nhiên mà không tạo sắc thái tương phản không có trong nguyên文.
- source_word: εὐθέως
  choice: lập tức
  rationale: Diễn đạt rõ sự mau chóng, dứt khoát trong phản ứng của họ và phù hợp với văn kể trang trọng, tự nhiên.
- source_word: ἀφέντες
  choice: bỏ
  rationale: 'Phân từ bất định chỉ hành động xảy ra trước động từ chính: họ bỏ lưới rồi đi theo. “Bỏ” tự nhiên và giữ được sắc thái rời lại, nhưng không mạnh quá như “từ bỏ hoàn toàn”.'
- source_word: τὰ δίκτυα
  choice: lưới
  rationale: Trong ngữ cảnh, đây là lưới đánh cá. Tiếng Việt có thể dùng “lưới” không kèm từ chỉ định hay sở hữu, vì ngữ cảnh đã đủ rõ.
- source_word: ἠκολούθησαν αὐτῷ
  choice: đi theo Ngài
  rationale: “Đi theo” vừa diễn tả chuyển động thực tế vừa giữ được hàm ý trở thành môn đồ. “Ngài” là đại từ tôn kính tự nhiên trong văn phong Kinh Thánh tiếng Việt hiện đại.
theological_decisions:
- issue: Hàm ý môn đồ trong ἠκολούθησαν αὐτῷ
  choice: đi theo Ngài
  alternative: theo Ngài; đi sau Ngài
  rationale: Cách dịch này giữ đồng thời nghĩa họ thực sự đi theo Chúa Giê-su và ý nghĩa gắn bó với Ngài như môn đồ, không giải thích quá mức thành một công thức thần học.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Trật tự “lập tức bỏ lưới và đi theo” tái hiện tự nhiên quan hệ trước-sau của phân từ Hy Lạp với động từ chính. Không cần chú thích cho câu này.
