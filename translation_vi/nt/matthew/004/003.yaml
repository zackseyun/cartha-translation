id: MAT.4.3
reference: Matthew 4:3
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ προσελθὼν ⸂ὁ πειράζων εἶπεν αὐτῷ⸃· Εἰ υἱὸς εἶ τοῦ θεοῦ, εἰπὲ ἵνα οἱ λίθοι οὗτοι ἄρτοι γένωνται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/003.yaml
  text: And the tempter came and said to him[a], “If you are the Son of God[b], tell these stones to become bread.”
translation:
  language: vi
  text: 'Kẻ cám dỗ đến gần và nói với Ngài: “Nếu Ngài là Con Đức Chúa Trời[a], hãy bảo những hòn đá này biến thành bánh[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể hiểu: “Vì Ngài là Con Đức Chúa Trời.” Điều kiện trong tiếng Hy Lạp có thể là lời thách thức, chứ không nhất thiết bày tỏ sự nghi ngờ.'
    reason: alternative_reading
  - marker: b
    text: Trong tiếng Hy Lạp, “bánh” ở số nhiều, có thể dịch là “những ổ bánh.”
    reason: lexical_alternative
lexical_decisions:
- source_word: προσελθὼν
  choice: đến gần
  rationale: Phân từ aorist của προσέρχομαι diễn tả việc tiến đến gần trước hành động nói; cách dịch này tự nhiên và giữ rõ nét chuyển động hướng về Chúa Giê-su.
- source_word: ὁ πειράζων
  choice: kẻ cám dỗ
  rationale: Phân từ hiện tại dùng như danh từ. Trong ngữ cảnh này, nhân vật đang cám dỗ Chúa Giê-su, nên “kẻ cám dỗ” phù hợp hơn “kẻ thử thách” và không làm mờ tính chất của hành động.
- source_word: εἶπεν αὐτῷ
  choice: nói với Ngài
  rationale: Cách dịch trực tiếp, tự nhiên của λέγω với tân ngữ gián tiếp; “Ngài” duy trì văn phong tôn kính dành cho Chúa Giê-su.
- source_word: Εἰ
  choice: Nếu
  rationale: Giữ nguyên hình thức điều kiện và sức nặng tu từ của tiếng Hy Lạp mà không quyết định liệu lời này biểu thị nghi ngờ, thách thức hay giả định.
- source_word: υἱὸς ... τοῦ θεοῦ
  choice: Con Đức Chúa Trời
  rationale: Dù υἱός không có mạo từ, cấu trúc vị ngữ với εἰμί và ngữ cảnh Ma-thi-ơ cho thấy đây là tước hiệu xác định, chỉ mối quan hệ độc nhất của Chúa Giê-su với Đức Chúa Trời.
- source_word: εἰπὲ
  choice: hãy bảo
  rationale: Mệnh lệnh aorist của λέγω. “Hãy bảo ... biến thành” truyền đạt tự nhiên nội dung mang tính tác thành mà không tăng nghĩa thành “ra lệnh,” vốn không được từ λέγω nêu rõ.
- source_word: ἵνα
  choice: (hãy bảo...) biến thành
  rationale: Sau mệnh lệnh, ἵνα giới thiệu nội dung hoặc kết quả mong muốn; cấu trúc tiếng Việt với “bảo ... biến thành” diễn đạt ý này gọn và tự nhiên.
- source_word: οἱ λίθοι οὗτοι
  choice: những hòn đá này
  rationale: Giữ danh từ số nhiều và sắc thái chỉ định; loại từ “hòn” là cách nói tự nhiên trong tiếng Việt.
- source_word: ἄρτοι
  choice: bánh
  rationale: ἄρτοι là số nhiều và có thể chỉ những ổ bánh. Tiếng Việt thường dùng “bánh” không cần đánh dấu số trong ngữ cảnh này; chú thích ghi nhận hình thức số nhiều của nguyên văn.
- source_word: γένωνται
  choice: biến thành
  rationale: Động từ γίνομαι ở đây chỉ sự chuyển thành một trạng thái hay vật thể khác. “Biến thành” rõ nghĩa và tự nhiên hơn cách dịch sát hình thức “trở thành” đối với đá và bánh.
theological_decisions:
- issue: Sức nặng của mệnh đề điều kiện Εἰ υἱὸς εἶ τοῦ θεοῦ
  choice: Dịch “Nếu Ngài là Con Đức Chúa Trời” mà không hàm ý chắc chắn rằng kẻ cám dỗ đang nghi ngờ.
  alternative: “Vì Ngài là Con Đức Chúa Trời” hoặc “Nếu quả thật Ngài là Con Đức Chúa Trời.”
  rationale: Điều kiện tiếng Hy Lạp có thể mang tính thách thức tu từ chứ không nhất thiết biểu thị hoài nghi. Giữ “Nếu” bảo toàn sự căng thẳng và tính đa nghĩa của câu.
- issue: Tước hiệu Ki-tô học υἱὸς τοῦ θεοῦ
  choice: Con Đức Chúa Trời
  alternative: một người con của Đức Chúa Trời
  rationale: Cấu trúc vị ngữ không mạo từ không đòi hỏi nghĩa bất định. Trong mạch văn Ma-thi-ơ, cụm từ hoạt động như tước hiệu xác định của Chúa Giê-su; bản dịch không thêm diễn giải ngoài nguyên văn.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “Ngài” để chỉ Chúa Giê-su và “Đức Chúa Trời” cho θεός. Câu văn giữ thứ tự diễn tiến của nguyên văn, đồng thời dùng cấu trúc tiếng Việt tự nhiên “bảo ... biến thành.”
