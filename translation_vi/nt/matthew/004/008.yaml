id: MAT.4.8
reference: Matthew 4:8
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Πάλιν παραλαμβάνει αὐτὸν ὁ διάβολος εἰς ὄρος ὑψηλὸν λίαν, καὶ δείκνυσιν αὐτῷ πάσας τὰς βασιλείας τοῦ κόσμου καὶ τὴν δόξαν αὐτῶν
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/008.yaml
  text: Again[a], the devil takes him to a very high mountain and shows him all the kingdoms of the world and their glory.
translation:
  language: vi
  text: Một lần nữa, ma quỷ đem Ngài lên một ngọn núi rất cao và cho Ngài thấy tất cả các vương quốc trên thế gian cùng vinh quang[a] của chúng.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “vẻ huy hoàng.”
    reason: δóξα trong ngữ cảnh này có thể nhấn mạnh vẻ tráng lệ, huy hoàng hữu hình của các vương quốc.
lexical_decisions:
- source_word: Πάλιν
  choice: Một lần nữa
  rationale: Diễn tả sự lặp lại trong chuỗi cám dỗ một cách tự nhiên và rõ ràng trong tiếng Việt.
- source_word: παραλαμβάνει
  choice: đem Ngài lên
  rationale: Động từ chỉ việc đưa một người đi cùng; kết hợp với đích đến là ngọn núi, cách diễn đạt này tự nhiên trong tiếng Việt và không thêm chi tiết ngoài nguyên văn.
- source_word: ὁ διάβολος
  choice: ma quỷ
  rationale: Đây là danh xưng quen thuộc chỉ kẻ cám dỗ trong ngữ cảnh này, rõ nghĩa với độc giả hiện đại.
- source_word: εἰς ὄρος ὑψηλὸν λίαν
  choice: lên một ngọn núi rất cao
  rationale: “Lên” phù hợp với sự di chuyển đến một ngọn núi; “rất” giữ sắc thái nhấn mạnh của λίαν.
- source_word: δείκνυσιν
  choice: cho Ngài thấy
  rationale: Chuyển tải trực tiếp hành động cho xem mà không cường điệu ý nghĩa của động từ.
- source_word: πάσας τὰς βασιλείας
  choice: tất cả các vương quốc
  rationale: Giữ được ý nghĩa chính trị-vương quyền của βασιλεία và tính bao quát của πάσας.
- source_word: τοῦ κόσμου
  choice: trên thế gian
  rationale: Là cách nói tự nhiên trong tiếng Việt về các vương quốc thuộc thế giới này, không thu hẹp phạm vi thành riêng vùng đất có người ở.
- source_word: τὴν δόξαν αὐτῶν
  choice: vinh quang của chúng
  rationale: Giữ liên hệ từ vựng rộng của δόξα, đồng thời chú thích sắc thái “vẻ huy hoàng” phù hợp với sự tráng lệ hữu hình của các vương quốc.
theological_decisions:
- issue: Bản chất của cảnh trên núi trong trình thuật cám dỗ
  choice: 'Dịch thẳng theo trình thuật: ma quỷ đem Ngài lên núi và cho Ngài thấy mọi vương quốc.'
  alternative: Giải thích đây là một cảnh quan sát địa lý theo nghĩa đen, hoặc một sự mặc khải mang tính khải tượng hay siêu nhiên.
  rationale: Bản Hy Lạp không giải thích bằng cách nào tất cả các vương quốc được cho thấy; bản dịch giữ nguyên sự căng thẳng và không áp đặt một cơ chế giải thích.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “Ngài” để quy chiếu đến Đức Giê-su theo lối diễn đạt tôn kính quen thuộc; không bổ sung tên riêng vốn không xuất hiện trong câu Hy Lạp. Giữ nhịp kể trực tiếp và không giải thích bản chất siêu nhiên hay địa lý của cảnh tượng.
