  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἀκούσας ⸀δὲ ὅτι Ἰωάννης παρεδόθη ἀνεχώρησεν εἰς τὴν Γαλιλαίαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/012.yaml
  text: When he heard that John had been handed over[a], he withdrew into Galilee.
translation:
  language: vi
  text: Khi nghe tin Giăng đã bị giao nộp[a], Đức Giê-su lánh về miền Ga-li-lê.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc, cụ thể hơn theo ngữ cảnh: “đã bị bắt”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀκούσας
  choice: Khi nghe tin
  rationale: Phân từ bất định quá khứ mang quan hệ thời gian với động từ chính. “Khi nghe tin” tự nhiên trong tiếng Việt và làm rõ rằng nội dung theo sau là một tin được nghe.
- source_word: δὲ
  choice: không dịch thành một từ riêng
  rationale: δέ là liên từ nhẹ dùng để chuyển tiếp trình thuật; trong câu tiếng Việt này, sự chuyển tiếp đã tự nhiên nhờ cấu trúc “Khi...”, nên thêm “bấy giờ” hoặc “nhưng” sẽ dễ tạo sắc thái không có trong nguyên văn.
- source_word: Ἰωάννης
  choice: Giăng
  rationale: Dùng dạng tên gọi Kinh Thánh quen thuộc trong tiếng Việt hiện đại.
- source_word: παρεδόθη
  choice: đã bị giao nộp
  rationale: Thể bị động của παραδίδωμι. “Bị giao nộp” giữ được phạm vi nghĩa rộng hơn “bị bắt” và bảo tồn cách dùng có thể vang vọng ở những chỗ khác trong Ma-thi-ơ.
- source_word: ἀνεχώρησεν
  choice: lánh về
  rationale: ἀναχωρέω diễn tả việc rời đi hoặc lui khỏi nơi đang ở để đáp lại hoàn cảnh. “Lánh về” tự nhiên, giữ sắc thái rút khỏi mà không hàm ý quá mạnh như “tháo chạy”.
- source_word: εἰς τὴν Γαλιλαίαν
  choice: về miền Ga-li-lê
  rationale: εἰς chỉ hướng chuyển động vào hoặc tới một nơi. Trong tiếng Việt, “về miền Ga-li-lê” diễn đạt tự nhiên hướng đi đến vùng này.
theological_decisions:
- issue: Cách dịch παραδίδωμι liên quan đến Giăng
  choice: đã bị giao nộp
  alternative: đã bị bắt
  rationale: Động từ Hy Lạp có nghĩa rộng hơn thuật ngữ chuyên biệt chỉ việc bắt giữ và có thể mang âm hưởng “bị giao nộp” ở các phần khác của Ma-thi-ơ. Bản văn chính giữ độ rộng ấy; chú thích nêu nghĩa cụ thể hơn theo ngữ cảnh.
- issue: Chủ ngữ hàm ẩn của ἀνεχώρησεν
  choice: Đức Giê-su
  alternative: ngài
  rationale: Nguyên văn không lặp tên vì chủ ngữ được hiểu từ ngữ cảnh. Do câu được trình bày độc lập, nêu “Đức Giê-su” giúp người đọc nhận rõ chủ thể mà không làm thay đổi ý nghĩa.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Giê-su” và “Ga-li-lê” theo lối phiên âm Kinh Thánh quen thuộc; câu giữ sắc thái tường thuật gọn của nguyên văn.
