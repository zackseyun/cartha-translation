id: MAT.21.16
reference: Matthew 21:16
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ εἶπαν αὐτῷ· Ἀκούεις τί οὗτοι λέγουσιν; ὁ δὲ Ἰησοῦς λέγει αὐτοῖς· Ναί. οὐδέποτε ἀνέγνωτε ὅτι Ἐκ στόματος νηπίων καὶ θηλαζόντων κατηρτίσω αἶνον;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/016.yaml
  text: And they said to him[a], “Do you hear what these are saying?” But Jesus says to them, “Yes. Have you never read, ‘Out of the mouth of infants and nursing babies you have prepared praise’?”
translation:
  language: vi
  text: 'Họ nói với Ngài: “Ngài có nghe bọn trẻ này đang nói gì không?” Đức Giê-su nói với họ: “Có. Các ông chưa bao giờ đọc sao: ‘Từ miệng trẻ thơ và trẻ còn bú, Ngài đã chuẩn bị lời ngợi khen’?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Đức Giê-su trích Thi Thiên 8:2 theo truyền thống Kinh Thánh Hy Lạp. Bản Hê-bơ-rơ thường được dịch: “Từ miệng trẻ thơ và trẻ còn bú, Ngài đã thiết lập sức mạnh.”'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀκούεις
  choice: Ngài có nghe
  rationale: Giữ nghĩa trực tiếp của động từ hiện tại trong câu hỏi, đồng thời dùng đại từ xưng hô trang trọng, tự nhiên khi họ nói với Đức Giê-su.
- source_word: τί οὗτοι λέγουσιν
  choice: những gì những người này đang nói
  rationale: “Đang nói” thể hiện hành động hiện tại; “những người này” chuyển tải οὗτοι rõ ràng trong tiếng Việt và vẫn giữ được sắc thái xa cách nhẹ.
- source_word: λέγει
  choice: đáp
  rationale: Dù nguyên văn là hiện tại lịch sử “nói”, “đáp” tự nhiên trong hội thoại tiếng Việt và diễn đạt đúng chức năng của lời Đức Giê-su.
- source_word: Ναί
  choice: Có
  rationale: Lời khẳng định trực tiếp, đồng thời tương ứng tự nhiên với câu hỏi dùng “có ... không”.
- source_word: οὐδέποτε ἀνέγνωτε
  choice: Các ông chưa bao giờ đọc lời này sao
  rationale: Giữ câu hỏi tu từ mang sắc thái quở trách về sự thiếu hiểu biết Kinh Thánh; thêm “lời này” để câu tiếng Việt tự nhiên mà không xác định quá mức nguồn trích dẫn.
- source_word: Ἐκ στόματος
  choice: Từ miệng
  rationale: Phản ánh trực tiếp cấu trúc Hy Lạp và giữ hình ảnh thi ca của câu trích dẫn.
- source_word: νηπίων
  choice: trẻ thơ
  rationale: Chỉ trẻ rất nhỏ nhưng không đồng nhất hoàn toàn với nhóm “trẻ còn bú” đi kèm.
- source_word: θηλαζόντων
  choice: trẻ còn bú
  rationale: Cách nói hiện đại, rõ nghĩa và giữ nguyên hình ảnh những trẻ đang bú.
- source_word: κατηρτίσω
  choice: Ngài đã làm nên
  rationale: Diễn đạt ý thiết lập hoặc khiến lời ngợi khen hiện hữu; tự nhiên hơn “chuẩn bị” trong ngữ cảnh tiếng Việt nhưng không áp đặt sắc thái giáo lý của “truyền lập”.
- source_word: αἶνον
  choice: lời ngợi khen
  rationale: Chuyển tải danh từ chỉ sự ca ngợi; “lời” phù hợp với hình ảnh phát ra từ miệng.
theological_decisions:
- issue: Cách dịch lời trích Thi Thiên trong lập luận của Đức Giê-su
  choice: 'Dịch theo lời Hy Lạp trong Ma-thi-ơ: “Ngài đã làm nên lời ngợi khen”'
  alternative: 'Theo văn bản Hê-bơ-rơ của Thi Thiên 8:2: “Ngài đã thiết lập sức mạnh”'
  rationale: Bản văn Ma-thi-ơ dẫn theo truyền thống Kinh Thánh Hy Lạp; bản dịch chính cần phản ánh đúng lời trích mà tác giả ghi lại, không hòa đồng với cách đọc Hê-bơ-rơ. Dị bản quen thuộc được nêu trong chú thích.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “Ngài” cho Đức Giê-su và chủ thể được thưa trong câu Thi Thiên; dùng “các ông” để giữ sắc thái chất vấn trực tiếp. Dấu chú thích được đặt ngay sau câu trích dẫn mà chú thích giải thích.
