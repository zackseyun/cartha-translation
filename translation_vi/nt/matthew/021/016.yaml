    reason: alternative_reading
  revision_rationale: Bản sửa giữ nguyên ý nghĩa và tính mơ hồ cần thiết của câu trích, đồng thời bỏ phần bổ sung không có trong tiếng Hy Lạp, phục hồi hiện tại lịch sử, và dịch κατηρτίσω sát hơn là «đã chuẩn bị». «Bọn trẻ này» dựa vào đối tượng đang nói trong ngữ cảnh gần (21:15) và bảo toàn sắc thái chỉ trỏ, không thiện cảm của οὗτοι.
