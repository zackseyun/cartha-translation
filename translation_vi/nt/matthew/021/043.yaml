id: MAT.21.43
reference: Matthew 21:43
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: διὰ τοῦτο λέγω ὑμῖν ὅτι ἀρθήσεται ἀφ’ ὑμῶν ἡ βασιλεία τοῦ θεοῦ καὶ δοθήσεται ἔθνει ποιοῦντι τοὺς καρποὺς αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/043.yaml
  text: Therefore I tell you[a], the kingdom of God will be taken away from you and given to a nation producing its fruits.
translation:
  language: vi
  text: 'Vì thế, tôi nói với các ông: Vương quốc của Đức Chúa Trời sẽ bị lấy khỏi các ông và được trao cho một dân tộc[a] sinh hoa trái của vương quốc ấy.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “một dân.” Từ Hy Lạp ἔθνος có thể chỉ một dân tộc hoặc một cộng đồng dân chúng. Ở đây, từ này nói đến một tập thể được nhận biết qua việc sinh hoa trái, nhưng không xác định hẹp hơn tập thể ấy là ai.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Vì thế
  rationale: Diễn tả kết luận rút ra từ dụ ngôn và lời trích dẫn ngay trước đó, đồng thời tự nhiên trong tiếng Việt hiện đại.
- source_word: λέγω ὑμῖν
  choice: tôi nói với các ông
  rationale: Giữ công thức phát ngôn trực tiếp và đại từ số nhiều hướng đến những người đang nghe; “các ông” phù hợp với đối tượng trong ngữ cảnh mà không thêm sắc thái kính trọng quá mức.
- source_word: ἀρθήσεται ἀφ’ ὑμῶν
  choice: sẽ bị lấy khỏi các ông
  rationale: Giữ thể bị động tương lai và ý nghĩa tách khỏi những người hiện đang có nó.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: Vương quốc của Đức Chúa Trời
  rationale: “Vương quốc” bảo lưu cả chiều kích quyền trị vì lẫn lãnh vực thuộc quyền trị vì, thay vì thu hẹp thành một khái niệm trừu tượng.
- source_word: δοθήσεται
  choice: được trao cho
  rationale: Giữ thể bị động tương lai song song với “sẽ bị lấy”; “trao cho” tự nhiên hơn “ban cho” khi câu nhấn mạnh sự chuyển giao.
- source_word: ἔθνει
  choice: một dân tộc
  rationale: Là từ tương đương trực tiếp, chỉ một tập thể nhận lãnh; không tự ý xác định đó là Hội Thánh, dân ngoại hay một nhóm cụ thể khác.
- source_word: ποιοῦντι
  choice: sinh ra
  rationale: Diễn đạt hành động liên tục làm phát sinh kết quả, đồng thời kết hợp tự nhiên với hình ảnh “hoa trái”.
- source_word: τοὺς καρποὺς αὐτῆς
  choice: hoa trái của vương quốc ấy
  rationale: Giữ danh từ số nhiều và làm rõ đại từ giống cái αὐτῆς quy chiếu tự nhiên về “vương quốc”, tránh đại từ tiếng Việt có thể mơ hồ.
theological_decisions:
- issue: Đối tượng được gọi là ἔθνει
  choice: Dịch khái quát là “một dân tộc”, không đồng nhất rõ với Hội Thánh, dân ngoại hay phần còn sót lại của Israel.
  alternative: “một dân”; hoặc diễn giải thành Hội Thánh, dân ngoại hay một dân được đổi mới của Đức Chúa Trời.
  rationale: Nguyên văn xác định tập thể này bằng việc sinh hoa trái, nhưng không tự nó buộc phải chọn một cách nhận diện thần học về sau.
- issue: Ý nghĩa của “Vương quốc của Đức Chúa Trời” trong lời phán xét
  choice: Giữ nguyên cách gọi “Vương quốc của Đức Chúa Trời”.
  alternative: “quyền trị vì của Đức Chúa Trời” hoặc “đặc ân thuộc về dân Đức Chúa Trời”.
  rationale: Cách dịch nguyên dạng bảo tồn phạm vi ý nghĩa thần học của βασιλεία và không diễn giải quá hẹp điều bị lấy đi.
- issue: Đối tượng quy chiếu của αὐτῆς trong “hoa trái của vương quốc ấy”
  choice: Hiểu đại từ là quy chiếu về Vương quốc của Đức Chúa Trời.
  alternative: Hiểu theo nghĩa rộng là hoa trái mà dân tộc ấy phải sinh ra.
  rationale: Sự phù hợp ngữ pháp nghiêng về ἡ βασιλεία; cách diễn đạt vẫn giữ hình ảnh hoa trái và không xác định cụ thể các hoa trái ấy là gì.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “tôi” trong lời nói trực tiếp để tự nhiên với độc giả hiện nay; dùng “các ông” vì lời này hướng đến một nhóm nam giới trong ngữ cảnh. Dấu hai chấm giúp câu tiếng Việt sáng rõ mà không làm thay đổi quan hệ cú pháp.
