  to: 'Nhưng Đức Giê-su đáp lại họ: “Tôi cũng sẽ hỏi các ông một câu hỏi[a]. Nếu các ông trả lời tôi, tôi cũng sẽ nói cho các ông biết tôi làm những việc này bằng thẩm quyền nào.”'
