  text: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν αὐτοῖς· Ἐρωτήσω ὑμᾶς κἀγὼ λόγον ἕνα, ὃν ἐὰν εἴπητέ μοι κἀγὼ ὑμῖν ἐρῶ ἐν ποίᾳ ἐξουσίᾳ ταῦτα ποιῶ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/024.yaml
  text: But Jesus answered them[a], “I also will ask you one question, which if you tell me, I also will tell you by what authority I do these things.”
translation:
  language: vi
  text: 'Nhưng Đức Giê-su đáp lại họ: “Tôi cũng sẽ hỏi các ông một câu hỏi[a]. Nếu các ông trả lời tôi, tôi cũng sẽ nói cho các ông biết tôi làm những việc này bằng thẩm quyền nào.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “một việc” hoặc sát chữ hơn là “một lời”; cụm Hy Lạp λόγον ἕνα có thể chỉ một câu hỏi hoặc một vấn đề đang được bàn đến.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν αὐτοῖς
  choice: Nhưng Đức Giê-su đáp lại họ
  rationale: Gộp phân từ ἀποκριθείς với động từ εἶπεν thành một cách diễn đạt tự nhiên trong tiếng Việt, đồng thời giữ sắc thái đáp lời; δέ được dịch là “Nhưng” để thể hiện sự chuyển ý có phần tương phản trong cuộc đối đáp.
- source_word: Ἐρωτήσω ὑμᾶς κἀγὼ
  choice: Tôi cũng sẽ hỏi các ông
  rationale: '“Cũng” giữ nét tương ứng của κἀγώ: họ đã chất vấn Đức Giê-su, còn ngài sẽ hỏi lại họ. “Các ông” phù hợp với nhóm nam giới có chức trách đang trực tiếp đối thoại trong văn cảnh.'
- source_word: λόγον ἕνα
  choice: một câu
  rationale: Trong ngữ cảnh này, λόγον ἕνα chỉ một điều được nêu ra để họ trả lời. “Một câu” tự nhiên trong tiếng Việt và không buộc nghĩa hẹp hoàn toàn thành “câu hỏi”; chú thích giữ các khả năng sát chữ hơn.
- source_word: ὃν ἐὰν εἴπητέ μοι
  choice: Nếu các ông trả lời tôi
  rationale: Dù λέγω cơ bản là “nói”, mệnh đề điều kiện ở đây nói đến việc đáp lại điều Đức Giê-su sắp hỏi; “trả lời tôi” truyền đạt rõ chức năng trong ngữ cảnh.
- source_word: κἀγὼ ὑμῖν ἐρῶ
  choice: tôi cũng sẽ nói cho các ông biết
  rationale: Giữ sự đối ứng của κἀγώ lần thứ hai; cách nói “nói cho ... biết” là tiếng Việt tự nhiên cho ἐρῶ trong cấu trúc này.
- source_word: ἐν ποίᾳ ἐξουσίᾳ
  choice: bởi thẩm quyền nào
  rationale: ἐν với ἐξουσία ở đây diễn tả cơ sở hoặc quyền hạn cho hành động. “Bởi thẩm quyền nào” rõ nghĩa, trang trọng và không thêm cách giải thích thần học.
- source_word: ταῦτα ποιῶ
  choice: tôi làm những việc này
  rationale: Giữ số nhiều của ταῦτα và thì hiện tại của ποιῶ, chỉ các hành động đang bị chất vấn.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Giê-su” theo lối gọi kính trọng phổ biến; đại từ “tôi/các ông” giữ sự trực tiếp và căng thẳng của cuộc đối đáp mà không nâng mức kính ngữ quá mức nguồn Hy Lạp.
