language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οἱ δὲ γεωργοὶ ἰδόντες τὸν υἱὸν εἶπον ἐν ἑαυτοῖς· Οὗτός ἐστιν ὁ κληρονόμος· δεῦτε ἀποκτείνωμεν αὐτὸν καὶ ⸀σχῶμεν τὴν κληρονομίαν αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/038.yaml
  text: But when the tenant farmers saw the son[a], they said among themselves, ‘This is the heir. Come, let us kill him and seize his inheritance.’
translation:
  language: vi
  text: 'Nhưng khi những người thuê vườn nho thấy người con trai, họ nói với nhau: “Đây là người thừa kế. Nào, chúng ta hãy giết hắn và chiếm lấy phần thừa kế của hắn[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát hơn: “có được phần thừa kế của hắn”; trong ngữ cảnh này, ý nói chiếm quyền sở hữu bằng bạo lực.'
    reason: Nêu nghĩa sát chữ của σχῶμεν và lý do bản văn chính dùng cách diễn đạt theo ngữ cảnh.
lexical_decisions:
- source_word: γεωργοὶ
  choice: những người thuê vườn nho
  rationale: Trong bối cảnh dụ ngôn, họ là những người thuê và canh tác vườn nho cho chủ, chứ không chỉ là người làm nông nói chung. Cách dịch này nêu rõ vai trò xã hội và bối cảnh vườn nho.
- source_word: ἰδόντες
  choice: khi ... thấy
  rationale: Chuyển phân từ bất định quá khứ thành mệnh đề thời gian tự nhiên trong tiếng Việt, đồng thời giữ trình tự hành động.
- source_word: τὸν υἱόν
  choice: người con trai
  rationale: Bám sát danh từ có mạo từ nhưng không tự thêm đại từ sở hữu; “con trai” thể hiện rõ giống đực của υἱός và quan hệ với chủ đã rõ từ văn cảnh.
- source_word: ἐν ἑαυτοῖς
  choice: với nhau
  rationale: Diễn đạt tự nhiên việc họ bàn bạc trong chính nhóm mình.
- source_word: κληρονόμος
  choice: người thừa kế
  rationale: Thuật ngữ tự nhiên, chính xác, giữ nguyên ý nghĩa pháp lý về quyền thừa kế.
- source_word: δεῦτε
  choice: Nào
  rationale: Thể hiện lời thúc giục mở đầu đề nghị hành động chung một cách tự nhiên trong tiếng Việt.
- source_word: ἀποκτείνωμεν
  choice: chúng ta hãy giết
  rationale: Thể hiện đúng thể giả định mang nghĩa khuyến giục; “giết” không thêm sắc thái pháp lý hoặc lời phán xét vượt quá động từ Hy Lạp.
- source_word: σχῶμεν
  choice: chiếm lấy
  rationale: Động từ thuộc ἔχω có nghĩa cơ bản là “có, giữ”, nhưng trong ngữ cảnh giết người thừa kế để đoạt tài sản, “chiếm lấy” truyền đạt tự nhiên sức ép cưỡng đoạt; nghĩa sát chữ được ghi ở chú thích.
- source_word: κληρονομίαν αὐτοῦ
  choice: gia tài thừa kế của hắn
  rationale: “Gia tài thừa kế” giữ liên hệ từ vựng với “người thừa kế”, còn “của hắn” thể hiện rõ αὐτοῦ. Đại từ “hắn” phù hợp với lời của những kẻ đang âm mưu giết người.
theological_decisions:
- issue: Hình ảnh người con trong dụ ngôn
  choice: Chỉ dịch là “người con trai”, không diễn giải ngay trong câu rằng người ấy tượng trưng cho Chúa Giê-su.
  alternative: Dịch theo hướng giải thích để làm rõ người con tượng trưng cho Chúa Giê-su.
  rationale: Trong mạch truyện Ma-thi-ơ, dụ ngôn hướng đến Chúa Giê-su, nhưng ở cấp độ câu chuyện, câu này chỉ nói về người con. Bản dịch giữ nguyên cách nói của dụ ngôn và không giải quyết thay người đọc sự nhận diện thần học.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Những người thuê vườn nho” rõ nghĩa hơn thuật ngữ xã hội cổ như “tá điền”; “Nào” giữ giọng thúc giục trực tiếp của lời thoại. Dấu chú thích được đặt ngay sau cụm từ mà chú thích giải thích.
