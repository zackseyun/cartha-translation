revisions:
- from: 'Nhưng khi những người thuê vườn nho thấy người con trai, họ nói với nhau: “Đây là người thừa kế. Nào, chúng ta hãy giết hắn và chiếm lấy gia tài thừa kế của hắn[a].”'
  to: 'Nhưng khi những người thuê vườn nho thấy người con trai, họ nói với nhau: “Đây là người thừa kế. Nào, chúng ta hãy giết hắn và chiếm lấy phần thừa kế của hắn[a].”'
  rationale: Chỉ thay “gia tài thừa kế” bằng “phần thừa kế” để tránh trùng lặp, tăng tính tự nhiên, và giữ quan hệ từ vựng rõ ràng với “người thừa kế.” Các lựa chọn còn lại trung thành với tiếng Hy Lạp và không thêm diễn giải thần học.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T05:41:24Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch truyền đạt đúng các yếu tố chính của câu Hy Lạp: sự đối lập/mạch tiếp nối của δέ, mệnh đề thời gian của ἰδόντες, sự bàn bạc nội bộ của nhóm, danh xưng “người thừa kế,” lời thúc giục kép ở thể khuyến giục, và ý chiếm đoạt κληρονομία sau khi giết người con. “Chiếm lấy” là cách diễn đạt theo ngữ cảnh hợp lý cho σχῶμεν; chú thích đã bảo lưu nghĩa sát hơn là “có được.”'
  naturalness: Câu văn nhìn chung tự nhiên, hiện đại và phù hợp với lời thoại dụ ngôn. Tuy nhiên, “gia tài thừa kế” ghép hai từ gần đồng nghĩa và tạo cảm giác thừa; “phần thừa kế” gọn, tự nhiên hơn, đồng thời phản ánh trực tiếp κληρονομία.
  terminology: “Những người thuê vườn nho” phản ánh đúng vai trò γεωργοί trong ngữ cảnh dụ ngôn và phù hợp tiếng Việt hiện đại. “Người thừa kế” / “phần thừa kế” duy trì liên kết thuật ngữ giữa κληρονόμος và κληρονομία. Không nên diễn giải người con là Chúa Giê-su trong bản văn chính.
  issues:
  - severity: low
    issue: Cụm “gia tài thừa kế” có tính trùng lặp.
    rationale: κληρονομία tự nó là “phần thừa kế/gia tài được thừa hưởng.” Thêm cả “gia tài” lẫn “thừa kế” không sai nghĩa nhưng kém gọn và kém tự nhiên hơn “phần thừa kế.”
