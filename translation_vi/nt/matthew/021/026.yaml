id: MAT.21.26
reference: Matthew 21:26
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐὰν δὲ εἴπωμεν· Ἐξ ἀνθρώπων, φοβούμεθα τὸν ὄχλον, πάντες γὰρ ⸂ὡς προφήτην ἔχουσιν τὸν Ἰωάννην⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/026.yaml
  text: But if we say[a], ‘From men,’ we fear the crowd, for they all regard John as a prophet.
translation:
  language: vi
  text: 'Nhưng nếu chúng ta nói: ‘Do con người[a],’ thì chúng ta sợ đám đông, vì ai nấy đều coi Giăng là một nhà tiên tri.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “Từ loài người.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν δὲ εἴπωμεν
  choice: Nhưng nếu chúng ta nói
  rationale: Cách dịch này diễn đạt tự nhiên điều kiện có thể xảy ra do ἐὰν kết hợp với động từ ở thể giả định, đồng thời giữ liên từ tương phản δὲ.
- source_word: Ἐξ ἀνθρώπων
  choice: Do con người
  rationale: Cụm này chỉ nguồn gốc từ phía con người, đối lập với nguồn gốc từ trời trong câu trước; “con người” mang nghĩa khái quát, không chỉ riêng nam giới.
- source_word: φοβούμεθα τὸν ὄχλον
  choice: chúng ta sợ đám đông
  rationale: Giữ trực tiếp ý của φοβούμεθα và dịch ὄχλος bằng cách gọi tự nhiên nhóm người đang tụ họp.
- source_word: πάντες
  choice: ai nấy đều
  rationale: Diễn đạt tự nhiên tính bao quát của πάντες đối với đám đông.
- source_word: ὡς προφήτην ἔχουσιν τὸν Ἰωάννην
  choice: coi Giăng là một nhà tiên tri
  rationale: Cấu trúc ἔχω với ὡς mang nghĩa xem hoặc nhìn nhận một người trong tư cách nào đó; cách dịch này rõ ràng và tự nhiên trong tiếng Việt.
- source_word: Ἰωάννην
  choice: Giăng
  rationale: Dùng dạng tên riêng Kinh Thánh quen thuộc trong tiếng Việt.
theological_decisions:
- issue: Sự đối lập giữa nguồn gốc từ trời và nguồn gốc từ con người
  choice: Do con người
  alternative: Từ loài người
  rationale: “Do con người” giữ đúng sự đối lập về nguồn gốc mà không khiến ἀνθρώπων bị hiểu là chỉ nam giới.
- issue: Mức độ khẳng định về cách đám đông nhìn nhận Giăng
  choice: ai nấy đều coi Giăng là một nhà tiên tri
  alternative: mọi người đều công nhận Giăng là nhà tiên tri
  rationale: “Coi” thuật lại nhận định của đám đông mà không tăng mức độ thành một sự xác nhận thần học của người kể chuyện.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu; lời đối thoại giữ sự ngắn gọn, còn “ai nấy đều” diễn đạt tự nhiên phản ứng đồng loạt của đám đông.
