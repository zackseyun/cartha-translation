- from: '“Còn các ông nghĩ sao? Một người kia có hai người con.[a] Ông đến với người con thứ nhất và nói: ‘Con à, hôm nay con hãy đi làm trong vườn nho.’”'
  to: '“Còn các ông nghĩ sao? Một người có hai người con.[a] Đến gặp người con thứ nhất, ông nói: ‘Con à, hôm nay con hãy đi làm trong vườn nho.’”'
  rationale: Chỉ bỏ «kia», một sắc thái không được nguyên văn nêu, và điều chỉnh trật tự câu kể cho tự nhiên hơn. Các lựa chọn «hai người con»/«Con à» được giữ để không thu hẹp nghĩa của τέκνα/τέκνον thành chỉ con trai.
