  source_fidelity: Bản dịch phản ánh đúng câu hỏi mở đầu, hai người con, việc người ấy đến với người con thứ nhất, và mệnh lệnh đi làm hôm nay trong vườn nho. Tuy nhiên, «kia» trong «Một người kia» thêm một sắc thái chỉ định/‘một người nào đó’ không được απαι bởi ἄνθρωπος; nên bỏ để bám sát nguyên văn hơn.
  naturalness: Văn tiếng Việt hiện đại, rõ ràng và phù hợp văn cảnh. «Đến gặp người con thứ nhất, ông nói» gọn và tự nhiên hơn «Ông đến với người con thứ nhất và nói», đồng thời phản ánh tốt phân từ προσελθών.
  terminology: «Hai người con» và «Con à» bảo toàn tính không xác định giới của τέκνα/τέκνον. «Vườn nho» là tương đương chuẩn của ἀμπελών. Không có vấn đề thuật ngữ thần học.
