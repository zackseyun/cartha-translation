  text: Τί δὲ ὑμῖν δοκεῖ; ἄνθρωπος εἶχεν τέκνα δύο. ⸀προσελθὼν τῷ πρώτῳ εἶπεν· Τέκνον, ὕπαγε σήμερον ἐργάζου ἐν τῷ ⸀ἀμπελῶνι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/028.yaml
  text: But what do you think? A man had two children. Going to the first[a], he said, ‘Child, go work today in the vineyard.’
translation:
  language: vi
  text: '“Còn các ông nghĩ sao? Một người có hai người con.[a] Đến gặp người con thứ nhất, ông nói: ‘Con à, hôm nay con hãy đi làm trong vườn nho.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch theo cách hiểu truyền thống là “hai con trai”; tuy nhiên, từ Hy Lạp ở đây (τέκνα) có nghĩa rộng là “các con.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί δὲ ὑμῖν δοκεῖ;
  choice: Còn các ông nghĩ sao?
  rationale: Cách hỏi tự nhiên trong tiếng Việt, giữ được lực nối nhẹ của δέ qua “Còn” và lời kêu gọi những người nghe đưa ra nhận định.
- source_word: ἄνθρωπος
  choice: Một người kia
  rationale: Trong bối cảnh dụ ngôn, cụm này chỉ một người nam, nhưng tiếng Việt có thể dùng “một người kia” tự nhiên mà không cần thêm danh xưng “đàn ông”; “kia” tạo sắc thái mở đầu một câu chuyện mà không làm thay đổi nội dung.
- source_word: τέκνα δύο
  choice: hai người con
  rationale: τέκνα là từ chỉ con cái nói chung, không xác định giới tính; “hai người con” vừa chính xác vừa tự nhiên trong tiếng Việt.
- source_word: προσελθὼν τῷ πρώτῳ
  choice: Ông đến với người con thứ nhất
  rationale: Diễn đạt tự nhiên hành động đến gần người con được nhắc trước tiên, đồng thời giữ rõ quan hệ với động từ chính “nói”.
- source_word: Τέκνον
  choice: Con à
  rationale: τέκνον là cách gọi con không xác định giới tính. “Con à” thể hiện lời cha gọi con trực tiếp, thân thuộc, không thêm sắc thái sở hữu không có trong nguyên văn.
- source_word: ὕπαγε σήμερον ἐργάζου
  choice: hôm nay con hãy đi làm
  rationale: Giữ mệnh lệnh “hãy đi làm” và trạng từ thời gian “hôm nay”, với trật tự tự nhiên trong tiếng Việt.
- source_word: ἐν τῷ ἀμπελῶνι
  choice: trong vườn nho
  rationale: Giữ hình ảnh nông nghiệp cụ thể của ἀμπελών và ý nghĩa không gian của ἐν.
theological_decisions:
- issue: Có nên dịch τέκνα/τέκνον theo truyền thống là “các con trai/con trai” hay không
  choice: hai người con / Con à
  alternative: hai con trai / Con trai à
  rationale: Nguyên văn dùng τέκνα và τέκνον, là những từ rộng hơn υἱοί/υἱέ và không tự thân xác định giới tính. Bản dịch vì thế không thu hẹp nghĩa theo cách hiểu truyền thống.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Đại từ “các ông” phù hợp với nhóm người nam mà Đức Giê-su đang trực tiếp chất vấn trong ngữ cảnh. Lời người cha dùng cách xưng hô tự nhiên “Con à” và mệnh lệnh nhẹ nhưng rõ “con hãy đi làm.”
