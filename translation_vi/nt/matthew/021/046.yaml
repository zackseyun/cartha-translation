  rationale: Bản sửa giữ nguyên ý nghĩa và tính nhượng bộ của câu Hy Lạp, làm rõ chủ ngữ ở đầu câu, dùng “bắt giữ” cho hành động câu thúc, và lặp lại “đám đông” để phản ánh chính xác chủ ngữ của nhận định về Đức Giê-su.
