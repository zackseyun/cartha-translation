id: MAT.21.46
reference: Matthew 21:46
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ζητοῦντες αὐτὸν κρατῆσαι ἐφοβήθησαν τοὺς ὄχλους, ⸂ἐπεὶ εἰς⸃ προφήτην αὐτὸν εἶχον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/046.yaml
  text: And although they were seeking to arrest him[a], they feared the crowds, because they regarded him as a prophet.
translation:
  language: vi
  text: Dù họ đang tìm cách bắt giữ Đức Giê-su, họ lại sợ đám đông, vì đám đông coi ngài là một nhà tiên tri.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ζητοῦντες
  choice: dù đang tìm cách
  rationale: 'Phân từ hiện tại diễn tả ý định đang tiếp diễn; “dù” thể hiện quan hệ nhượng bộ theo văn cảnh: họ muốn bắt ngài nhưng bị nỗi sợ ngăn lại.'
- source_word: κρατῆσαι
  choice: bắt
  rationale: Trong văn cảnh thù địch, động từ chỉ việc bắt giữ một người, không chỉ đơn thuần là nắm lấy.
- source_word: ἐφοβήθησαν
  choice: họ vẫn sợ
  rationale: “Sợ” diễn đạt trực tiếp động từ; “vẫn” làm rõ sự tương phản với ý định bắt Đức Giê-su mà không thay đổi nội dung căn bản.
- source_word: τοὺς ὄχλους
  choice: đám đông
  rationale: Cách nói tự nhiên trong tiếng Việt hiện đại để chỉ quần chúng đang tụ họp; tiếng Việt không bắt buộc đánh dấu số nhiều như tiếng Hy Lạp.
- source_word: ἐπεὶ εἰς
  choice: vì
  rationale: Giới thiệu nguyên nhân khiến họ sợ đám đông một cách rõ ràng và tự nhiên.
- source_word: εἰς προφήτην αὐτὸν εἶχον
  choice: dân chúng coi ngài là một nhà tiên tri
  rationale: Cấu trúc thành ngữ có nghĩa là xem hoặc coi một người thuộc một tư cách nào đó. Chủ ngữ được diễn đạt là “dân chúng” để tránh đại từ “họ” mơ hồ giữa giới lãnh đạo và đám đông.
- source_word: προφήτην
  choice: một nhà tiên tri
  rationale: Danh từ không có mạo từ ở đây trình bày Đức Giê-su như thuộc hạng nhà tiên tri theo nhận định của dân chúng.
theological_decisions:
- issue: Cách trình bày nhận định của đám đông về Đức Giê-su là προφήτην mà không thêm hoặc phủ nhận các khẳng định Kitô học khác
  choice: dân chúng coi ngài là một nhà tiên tri
  alternative: dân chúng xem ngài là nhà tiên tri; dân chúng cho ngài là một nhà tiên tri
  rationale: Câu này thuật lại cách dân chúng nhìn nhận Đức Giê-su, chứ không đưa ra một định nghĩa đầy đủ về căn tính của ngài. “Coi ... là” giữ nguyên góc nhìn tường thuật và không hàm ý rằng ngài chỉ là một nhà tiên tri.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Đức Giê-su” để xác định rõ đối tượng của đại từ αὐτόν, còn “ngài” duy trì lối xưng hô tôn kính tự nhiên. Không thêm chú thích vì các phương án “coi/xem/cho là” không tạo khác biệt ý nghĩa đáng kể cần ghi chú.
