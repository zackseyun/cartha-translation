  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Καὶ ὅτε ἤγγισαν εἰς Ἱεροσόλυμα καὶ ἦλθον εἰς Βηθφαγὴ ⸀εἰς τὸ Ὄρος τῶν Ἐλαιῶν, τότε ⸀Ἰησοῦς ἀπέστειλεν δύο μαθητὰς
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/001.yaml
  text: And when they came near to Jerusalem and came to Bethphage[a], to the Mount of Olives, then Jesus sent two disciples
translation:
  language: vi
  text: Khi họ đến gần Giê-ru-sa-lem và đến Bết-pha-giê[a], tại núi Ô-liu, thì Giê-su sai hai môn đệ đi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “Khi họ đến gần Giê-ru-sa-lem và đến Bết-pha-giê, đến núi Ô-liu ...”'
    reason: Cụm εἰς τὸ Ὄρος τῶν Ἐλαιῶν có thể được hiểu như một đích đến tiếp theo, thay vì chỉ là cách xác định vị trí của Bết-pha-giê.
lexical_decisions:
- source_word: ἤγγισαν
  choice: đến gần
  rationale: Động từ ἐγγίζω ở đây chỉ sự tiến đến gần về mặt không gian; “đến gần” tự nhiên và sát nghĩa.
- source_word: Ἱεροσόλυμα
  choice: Giê-ru-sa-lem
  rationale: Dùng dạng phiên âm quen thuộc trong tiếng Việt cho địa danh Jerusalem.
- source_word: ἦλθον
  choice: đến
  rationale: Giữ nghĩa thông thường của ἔρχομαι và nhịp kể súc tích của nguyên văn.
- source_word: Βηθφαγὴ
  choice: Bết-pha-giê
  rationale: Phiên âm địa danh Hy Lạp theo lối đọc tự nhiên trong tiếng Việt.
- source_word: εἰς τὸ Ὄρος τῶν Ἐλαιῶν
  choice: về phía núi Ô-liu
  rationale: Cụm εἰς có hướng tính và liên hệ Bết-pha-giê với núi Ô-liu; “về phía” giữ được hướng chuyển động mà không buộc hiểu rằng họ đi vào chính ngọn núi.
- source_word: τότε
  choice: bấy giờ
  rationale: Đánh dấu bước chuyển tiếp trong trình thuật bằng văn phong trang trọng nhưng hiện đại.
- source_word: ἀπέστειλεν
  choice: sai ... đi
  rationale: Trong ngữ cảnh sai môn đồ làm một công việc, “sai ... đi” là cách diễn đạt tự nhiên và chính xác.
- source_word: δύο μαθητὰς
  choice: hai môn đồ
  rationale: μαθητής trong trình thuật Phúc Âm được chuyển là “môn đồ”, thuật ngữ quen thuộc và phù hợp ngữ cảnh.
theological_decisions:
- issue: Chủ ngữ ngầm của các động từ số nhiều trước khi Đức Giê-su được nêu tên
  choice: Dùng đại từ “họ”, rồi chỉ nêu “Đức Giê-su” tại vị trí tương ứng với nguyên văn.
  alternative: Bổ sung rõ “Đức Giê-su và các môn đồ”.
  rationale: Nguyên văn dùng các động từ số nhiều với chủ ngữ được hiểu từ ngữ cảnh nhưng không nhắc lại đầy đủ; cách dịch này không đưa thêm thành phần mà câu Hy Lạp không nói rõ.
- issue: Quan hệ địa lý của Bết-pha-giê với núi Ô-liu
  choice: Dịch “về phía núi Ô-liu”.
  alternative: “tại núi Ô-liu” hoặc “đến núi Ô-liu”.
  rationale: Giữ hướng tính của εἰς đồng thời tránh quyết định quá mức rằng cụm này chỉ vị trí tĩnh hay một đích đến tách biệt.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu; giữ cấu trúc trình thuật súc tích của tiếng Hy Lạp. Dùng “Đức Giê-su”, “môn đồ” và các địa danh phiên âm quen thuộc trong tiếng Việt.
