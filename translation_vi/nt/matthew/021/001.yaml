review_pass:
  verdict: revise
  source_fidelity: Bản nháp chuyển đạt đúng hai động từ chuyển động, chủ ngữ số nhiều không được nêu rõ, và hành động sai phái. Tuy nhiên, “về phía núi Ô-liu” làm cụm địa lý nghe như một hướng đi chưa đạt tới, trong khi εἰς lần thứ hai có thể được hiểu là đích đến hoặc cách xác định vị trí Bết-pha-giê. Cần giữ sự không chắc chắn này bằng chú thích thay vì chọn riêng sắc thái “về phía”. “Đức” không có trong tên Ἰησοῦς ở câu này.
  naturalness: “Khi ... và ... , bấy giờ ...” có thể hiểu được nhưng hơi nặng trong tiếng Việt hiện đại. “Khi ... thì ...” tự nhiên hơn. “Tại núi Ô-liu” đọc trôi chảy hơn “về phía núi Ô-liu” trong chuỗi địa danh.
  terminology: Dùng “Giê-su” bám sát tên riêng không kèm tước hiệu trong nguyên văn. “Môn đệ” là thuật ngữ hiện đại, trang trọng và trung tính hơn “môn đồ”, đồng thời diễn đạt μαθητάς chính xác.
  issues:
  - severity: medium
    issue: “về phía núi Ô-liu” thu hẹp quan hệ của εἰς τὸ Ὄρος τῶν Ἐλαιῶν thành hướng đi.
    rationale: Cụm Hy Lạp có thể được đọc như một đích đến thứ hai hoặc như sự xác định địa điểm của Bết-pha-giê; cách dịch hiện tại gợi ý rõ rằng đoàn người vẫn chỉ đang hướng về núi. Bản dịch chính dùng cách định vị tự nhiên, còn chú thích nêu phương án sát hình thức hơn.
  - severity: low
    issue: “Đức Giê-su” thêm yếu tố tôn kính không được biểu thị trong Ἰησοῦς.
    rationale: Tên Hy Lạp ở đây chỉ là Ἰησοῦς; bỏ “Đức” giữ mức độ xưng hô của nguồn mà không ảnh hưởng đến sự tôn trọng trong văn phong.
  - severity: low
    issue: “môn đồ” có sắc thái truyền thống theo hệ thuật ngữ giáo hội hơn là cách dùng trung tính hiện đại.
    rationale: “Môn đệ” là cách gọi tự nhiên, trang trọng và phù hợp để dịch μαθητής trong văn cảnh Phúc Âm.
