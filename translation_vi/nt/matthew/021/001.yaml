revisions:
- from: Khi họ đến gần Giê-ru-sa-lem và đến Bết-pha-giê, về phía núi Ô-liu, bấy giờ Đức Giê-su sai hai môn đồ đi.
  to: Khi họ đến gần Giê-ru-sa-lem và đến Bết-pha-giê[a], tại núi Ô-liu, thì Giê-su sai hai môn đệ đi.
  rationale: 'Bản sửa duy trì trình tự và tính súc tích của câu Hy Lạp: chủ ngữ “họ” vẫn không được giải thích thêm, hai động từ chuyển động vẫn được phân biệt, và τότε được diễn đạt tự nhiên bằng cấu trúc “Khi ... thì ...”. Quan hệ cú pháp/địa lý còn có thể tranh luận của cụm δεύτερο εἰς được bảo lưu bằng chú thích. Đồng thời bỏ tước hiệu không có trong nguyên văn và dùng thuật ngữ “môn đệ” trung tính, hiện đại.'
  reviewer_model: gpt-5.6-terra
