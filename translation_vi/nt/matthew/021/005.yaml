id: MAT.21.5
reference: Matthew 21:5
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Εἴπατε τῇ θυγατρὶ Σιών· Ἰδοὺ ὁ βασιλεύς σου ἔρχεταί σοι πραῢς καὶ ἐπιβεβηκὼς ἐπὶ ὄνον καὶ ⸀ἐπὶ πῶλον υἱὸν ὑποζυγίου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/005.yaml
  text: Tell the daughter of Zion[a], ‘Look, your king is coming to you, gentle and mounted on a donkey, and on a colt[b], the foal of a beast of burden.’
translation:
  language: vi
  text: 'Hãy nói với con gái Si-ôn rằng: “Kìa, vua của ngươi đang đến với ngươi, hiền hòa[a] và cưỡi trên một con lừa và trên một lừa con[b], là con của một con vật thồ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “khiêm nhường” hoặc “nhu mì.” Từ Hy Lạp πραΰς có thể mang các nghĩa này và gợi lại Xa-cha-ri 9:9.
    reason: lexical_alternative
  - marker: b
    text: 'Ma-thi-ơ giữ cách diễn đạt của lời tiên tri với hai cụm chỉ con vật được nối với nhau: “trên một con lừa và trên một lừa con, là con của một con vật thồ.”'
    reason: cross_reference
lexical_decisions:
- source_word: Εἴπατε
  choice: Hãy nói
  rationale: Mệnh lệnh số nhiều được chuyển bằng cấu trúc mệnh lệnh tự nhiên trong tiếng Việt, giữ nguyên lực truyền bảo của câu.
- source_word: τῇ θυγατρὶ Σιών
  choice: con gái Si-ôn
  rationale: Giữ nguyên cách nhân cách hóa mang tính tiên tri, thay vì diễn giải thành “dân Si-ôn” hay “dân Giê-ru-sa-lem”.
- source_word: Ἰδοὺ
  choice: Kìa
  rationale: Từ gọi người nghe chú ý, vừa trang trọng vừa quen thuộc trong tiếng Việt hiện đại.
- source_word: ὁ βασιλεύς σου
  choice: vua của ngươi
  rationale: Giữ rõ hình ảnh vị vua và quan hệ sở thuộc; “ngươi” phù hợp với lời trực tiếp nói cùng Si-ôn đã được nhân cách hóa.
- source_word: ἔρχεταί σοι
  choice: đang đến với ngươi
  rationale: Diễn đạt tính sống động và sự đến gần của thì hiện tại Hy Lạp.
- source_word: πραῢς
  choice: hiền hòa
  rationale: Diễn đạt phẩm chất ôn hòa, không cưỡng bức bằng từ ngữ phổ thông hiện nay; chú thích giữ lại nghĩa khả dĩ “khiêm nhường/nhu mì”.
- source_word: ἐπιβεβηκὼς
  choice: cưỡi trên
  rationale: Chuyển tự nhiên trạng thái đã lên và đang ngồi trên con vật trong văn cảnh.
- source_word: ἐπὶ ὄνον
  choice: trên một con lừa
  rationale: Cách gọi trực tiếp, rõ nghĩa và tự nhiên của ὄνος.
- source_word: πῶλον
  choice: một lừa con
  rationale: Chỉ con vật còn non; ngữ cảnh và vế đồng vị tiếp theo xác định đây là lừa con.
- source_word: υἱὸν ὑποζυγίου
  choice: là con của một con vật thồ
  rationale: Giữ hình ảnh kiểu Sê-mít về con non sinh bởi loài vật mang chở, nhưng tránh dịch cứng nhắc υἱός là “con trai”.
theological_decisions:
- issue: Lời trích dẫn mang ý nghĩa tiên tri về vua trong Xa-cha-ri 9:9 có nên được hòa đồng với cách diễn đạt của Cựu Ước hay không
  choice: 'Giữ cách diễn đạt riêng của bản Hy Lạp Ma-thi-ơ: “hiền hòa… trên một con lừa, trên một lừa con, là con của một con vật thồ.”'
  alternative: Dùng “khiêm nhường” để gần Xa-cha-ri 9:9 hơn, hoặc gộp hai cụm chỉ con vật thành một con duy nhất.
  rationale: Bản dịch phản ánh chính văn Hy Lạp của Ma-thi-ơ, không âm thầm hòa đồng với một bản Cựu Ước. Hai cụm con vật được giữ nguyên vì chúng hiện diện trong lời trích dẫn và có ý nghĩa đối với cách Ma-thi-ơ trình bày sự ứng nghiệm.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. “Con gái Si-ôn” giữ phép nhân cách hóa tiên tri; “ngươi” được dùng trong lời trực tiếp với nhân vật tập thể này. Dấu chú thích [a] đặt ngay sau từ có phương án từ vựng, còn [b] đặt sau “lừa con” để giải thích cấu trúc hai cụm con vật.
