  text: ⸀Πρωῒ δὲ ⸀ἐπανάγων εἰς τὴν πόλιν ἐπείνασεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/018.yaml
  text: Early in the morning, as he was returning to the city, he became hungry.
translation:
  language: vi
  text: Sáng sớm, khi trở lại thành, Đức Giê-su thấy đói.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πρωῒ
  choice: Sáng sớm
  rationale: Diễn đạt tự nhiên phần đầu ngày và giữ được sắc thái thời gian sớm của trạng từ Hy Lạp.
- source_word: δὲ
  choice: không dịch thành một từ riêng
  rationale: Ở đây δέ chỉ là liên từ nhẹ giúp tiếp nối trình thuật, không biểu thị sự tương phản rõ; trật tự câu tiếng Việt đã chuyển ý tự nhiên mà không cần thêm “bấy giờ” hay “nhưng”.
- source_word: ἐπανάγων
  choice: khi trở lại
  rationale: Phân từ hiện tại diễn tả hành động đang diễn ra đồng thời với động từ chính; “khi trở lại” rõ nghĩa và tự nhiên trong tiếng Việt.
- source_word: εἰς τὴν πόλιν
  choice: thành
  rationale: Giữ cách gọi ngắn gọn đối với thành đã được xác định trong ngữ cảnh, tức Giê-ru-sa-lem; giới từ chỉ hướng được thể hiện tự nhiên trong cụm “trở lại thành”.
- source_word: ἐπείνασεν
  choice: thấy đói
  rationale: Cách nói tự nhiên trong tiếng Việt, diễn tả việc cơn đói xuất hiện mà không dùng lối văn cổ hoặc nặng nề.
theological_decisions:
- issue: Hàm ý Kitô học về cơn đói của Đức Giê-su
  choice: Trình bày thẳng rằng Đức Giê-su thực sự thấy đói.
  alternative: Diễn giải hoặc giảm nhẹ cơn đói theo hướng biểu tượng.
  rationale: Câu Hy Lạp kể cơn đói như một trải nghiệm thực của Đức Giê-su. Bản dịch giữ nguyên lời chứng về nhân tính thật của ngài mà không thêm bình luận giáo lý.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Nêu rõ chủ ngữ “Đức Giê-su” để câu tiếng Việt đứng độc lập vẫn sáng nghĩa; không thêm dấu nối diễn ngôn không cần thiết.
