source:
  edition: SBLGNT
  text: οἱ δὲ ὄχλοι ἔλεγον· Οὗτός ἐστιν ⸂ὁ προφήτης Ἰησοῦς⸃ ὁ ἀπὸ Ναζαρὲθ τῆς Γαλιλαίας.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/011.yaml
  text: And the crowds were saying[a], “This is the prophet Jesus, from Nazareth in Galilee.”
translation:
  language: vi
  text: 'Còn đám đông nói[a]: “Đây là vị tiên tri Giê-su, người từ Na-xa-rét thuộc Ga-li-lê.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Động từ Hy Lạp có thể hàm ý đám đông đang nói hoặc nhiều người cứ nói như vậy. Cụm “vị tiên tri” có mạo từ xác định trong tiếng Hy Lạp; cũng có thể được hiểu là “một nhà tiên tri,” tùy cách hiểu ngữ cảnh.
    reason: Bảo tồn sắc thái thể chưa hoàn thành của ἔλεγον và sự không chắc chắn về ý nghĩa của danh ngữ xác định ὁ προφήτης mà không giải thích thần học vượt quá bản văn.
lexical_decisions:
- source_word: οἱ δὲ ὄχλοι
  choice: Còn đám đông
  rationale: δέ nối tiếp mạch thuật chuyện với sắc thái nhẹ; “còn” tự nhiên trong ngữ cảnh đối chiếu với câu hỏi trước đó. Danh từ số nhiều Hy Lạp chỉ các nhóm người tụ tập, nhưng tiếng Việt thường dùng danh từ tập hợp “đám đông” ở số ít.
- source_word: ἔλεγον
  choice: nói
  rationale: Thể chưa hoàn thành diễn tả lời đang được nói hoặc được nhiều người nhắc lại. Tiếng Việt không bắt buộc đánh dấu thể; “nói” giữ câu tự nhiên, còn chú thích nêu sắc thái tiếp diễn/lặp lại.
- source_word: Οὗτός ἐστιν
  choice: Đây là
  rationale: Cách nói nhận diện tự nhiên trong tiếng Việt, phản ánh đại từ chỉ định và động từ liên hệ của Hy Lạp.
- source_word: ὁ προφήτης
  choice: nhà tiên tri
  rationale: Giữ danh xưng tiên tri và không thêm yếu tố giải nghĩa. Tiếng Việt không có mạo từ xác định tương ứng trực tiếp, nên cụm này có thể được hiểu là “nhà tiên tri ấy/vị tiên tri” hoặc, tùy ngữ cảnh, “một nhà tiên tri”; chú thích bảo tồn độ căng này.
- source_word: Ἰησοῦς
  choice: Giê-su
  rationale: Phiên âm tên riêng theo cách viết Kinh Thánh tiếng Việt thông dụng.
- source_word: ὁ ἀπὸ Ναζαρὲθ τῆς Γαλιλαίας
  choice: đến từ Na-xa-rét thuộc Ga-li-lê
  rationale: Diễn đạt tự nhiên nguồn gốc địa lý; “thuộc Ga-li-lê” làm rõ Na-xa-rét nằm trong vùng Ga-li-lê mà không thêm nội dung ngoài văn bản.
theological_decisions:
- issue: Tính xác định của ὁ προφήτης
  choice: nhà tiên tri, kèm chú thích về mạo từ xác định
  alternative: một nhà tiên tri; vị Tiên Tri
  rationale: Hy Lạp có mạo từ ὁ, có thể gợi đến một nhân vật tiên tri đã được nhận biết hoặc mong đợi. Tuy nhiên, tiếng Việt không biểu thị mạo từ theo cùng cách; dịch “vị Tiên Tri” có thể xác định hóa và thần học hóa quá mức, còn “một nhà tiên tri” làm mất dấu hiệu xác định. Bản dịch chính giữ cách nói tự nhiên và chú thích nêu sự mơ hồ.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “đám đông” như danh từ tập hợp tự nhiên; “đến từ Na-xa-rét thuộc Ga-li-lê” rõ địa lý. Dấu chú thích [a] xuất hiện ngay sau động từ liên quan nhưng chú thích cũng giải thích cụm danh xưng trong cùng câu.
