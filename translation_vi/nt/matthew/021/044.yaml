id: MAT.21.44
reference: Matthew 21:44
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸂Καὶ ὁ πεσὼν ἐπὶ τὸν λίθον τοῦτον συνθλασθήσεται· ἐφ’ ὃν δ’ ἂν πέσῃ λικμήσει αὐτόν.⸃
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/044.yaml
  text: And the one who falls on this stone will be broken to pieces[a]; but on whomever it falls[b], it will crush him.
translation:
  language: vi
  text: Ai ngã trên hòn đá này sẽ bị tan nát; còn nếu hòn đá này rơi trúng ai, thì sẽ nghiền nát người ấy.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch mạnh và giàu hình ảnh hơn: “nghiền thành bột” hoặc “làm tan tác như trấu.”'
    reason: lexical_alternative
  - marker: b
    text: Câu này không có trong một số thủ bản của Ma-thi-ơ, nhưng có câu song song tại Lu-ca 20:18.
    reason: textual_variant
lexical_decisions:
- source_word: ὁ πεσὼν
  choice: Ai ngã
  rationale: Phân từ có mạo từ được dùng như danh từ và mang ý nghĩa khái quát. “Ai ngã” tự nhiên trong tiếng Việt, đồng thời giữ sắc thái châm ngôn.
- source_word: ἐπὶ τὸν λίθον τοῦτον
  choice: trên hòn đá này
  rationale: Giữ hình ảnh không gian cụ thể và từ “đá”, nối trực tiếp với hình tượng hòn đá trong văn cảnh.
- source_word: συνθλασθήσεται
  choice: sẽ bị vỡ tan
  rationale: Thể bị động tương lai diễn tả người ấy chịu sự tan vỡ nghiêm trọng; “vỡ tan” mạnh nhưng vẫn phân biệt với λικμήσει ở vế sau.
- source_word: ἐφ’ ὃν δ’ ἂν πέσῃ
  choice: còn hòn đá ấy rơi trúng ai
  rationale: 'Diễn đạt rõ sự đảo chiều tác động: hòn đá trở thành chủ thể rơi. “Ai” giữ tính bất định của cấu trúc với ἄν.'
- source_word: λικμήσει
  choice: sẽ nghiền nát
  rationale: Động từ gợi sự nghiền vụn hoặc sàng tung như trấu; “nghiền nát” vừa tự nhiên vừa bảo toàn cường độ mạnh hơn động từ ở vế đầu.
- source_word: αὐτόν
  choice: người đó
  rationale: Đại từ giống đực số ít quy chiếu về người được nói đến theo nghĩa khái quát. Tiếng Việt không đánh dấu giống ở đại từ này; “người đó” giữ số ít và tránh mơ hồ.
theological_decisions:
- issue: Hình tượng hòn đá và phép ẩn dụ về sự phán xét
  choice: Giữ nguyên hình ảnh cụ thể về hòn đá cùng hai chiều va chạm, không giải thích hòn đá là ai ngay trong câu.
  alternative: Nêu rõ hòn đá là Đấng Mê-si-a/Chúa Giê-su, hoặc gộp hai động từ thành một ý hủy diệt chung.
  rationale: Văn cảnh giúp nhận diện hình tượng, nhưng chính câu này trình bày lời phán theo lối châm ngôn. Bản dịch giữ sức nặng phán xét mà không thêm lời giải nghĩa thần học.
- issue: Khác biệt sắc thái giữa συνθλασθήσεται và λικμήσει
  choice: Dịch lần lượt là “bị vỡ tan” và “nghiền nát”.
  alternative: Dùng cùng một động từ như “bị nghiền nát” cho cả hai vế.
  rationale: Hai cách dịch giữ được sự căng thẳng và cấp độ hình ảnh trong nguyên văn, thay vì làm phẳng khác biệt từ vựng.
- issue: Tính xác thực văn bản của cả câu
  choice: Đưa câu vào chính văn và ghi chú rằng câu vắng mặt trong một số thủ bản.
  alternative: Loại câu khỏi chính văn hoặc đặt toàn bộ câu trong ngoặc.
  rationale: SBLGNT in câu này nhưng đánh dấu nó là một đơn vị có vấn đề văn bản; ghi chú giúp độc giả biết chứng cứ thủ bản không đồng nhất và có câu song song ở Lu-ca 20:18.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Hòn đá” duy trì hình tượng cụ thể; “vỡ tan” và “nghiền nát” tạo nhịp đối xứng nhưng vẫn phân biệt hai động từ Hy Lạp. Dấu chú thích [b] được đặt sau mệnh đề nhận diện biến thể văn bản, còn [a] đặt sau mệnh đề chứa λικμήσει là từ có các khả năng diễn đạt mạnh hơn.
