revisions:
- from: Ai ngã trên hòn đá này sẽ bị vỡ tan; còn hòn đá ấy rơi trúng ai[b], thì sẽ nghiền nát người đó.[a]
  to: Ai ngã trên hòn đá này sẽ bị tan nát; còn nếu hòn đá này rơi trúng ai, thì sẽ nghiền nát người ấy.[a][b]
  rationale: Bản sửa duy trì hình ảnh hòn đá và hai động từ có cường độ khác nhau, không giải thích thêm ý nghĩa của hòn đá. “Còn nếu” biểu đạt tự nhiên tính bất định trong ἐφ’ ὃν δ’ ἂν πέσῃ. Chú thích [a] được neo sau mệnh đề λικμήσει; chú thích [b] được neo sau toàn câu, đúng phạm vi của biến thể văn bản.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T05:41:32Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch giữ đúng cấu trúc đối lập: người ngã trên hòn đá chịu sự tan vỡ, còn hòn đá rơi xuống người nào thì hủy diệt người ấy. Tuy nhiên, nên lặp lại “hòn đá này” để duy trì chỉ xuất trực tiếp của τοῦτον, và đặt chú thích biến thể văn bản ở cuối cả câu vì biến thể liên quan đến toàn bộ câu, không chỉ mệnh đề “rơi trúng ai”.'
  naturalness: “Ai ngã trên hòn đá này” và “rơi trúng ai” tự nhiên, hiện đại. “Sẽ bị vỡ tan” hiểu được nhưng hơi gượng khi chủ ngữ là con người; “sẽ bị tan nát” tự nhiên hơn mà vẫn diễn đạt sự vỡ thành nhiều mảnh của συνθλασθήσεται.
  terminology: “Hòn đá” phù hợp với λίθος và văn cảnh. “Nghiền nát” phân biệt hữu hiệu với “tan nát” và diễn đạt sức mạnh của λικμήσει. Chú thích từ vựng cần diễn đạt phương án “sàng/rải tung như trấu” sao cho rõ người là đối tượng bị phân tán, không phải hành động sàng trấu theo nghĩa đen.
  issues:
  - severity: medium
    issue: Vị trí chú thích [b]
    rationale: Chú thích nói về sự hiện diện hay vắng mặt của toàn câu trong các thủ bản. Đặt [b] sau “ai” có thể khiến độc giả hiểu nhầm biến thể chỉ liên quan đến mệnh đề đó; nên đặt sau dấu chấm cuối câu.
  - severity: low
    issue: “sẽ bị vỡ tan” đối với con người
    rationale: Cách nói này không sai trong ẩn dụ, nhưng “sẽ bị tan nát” tự nhiên hơn trong tiếng Việt hiện đại và vẫn giữ sắc thái bị động, hủy hoại nghiêm trọng của συνθλασθήσεται.
  - severity: low
    issue: Chú thích [a] cần làm rõ hình ảnh phân tán
    rationale: λικμήσει có thể gợi việc nghiền vụn hoặc sàng/rải tung như trấu. “Sàng tung như trấu” đứng một mình hơi thiếu rõ chủ thể/đối tượng; cần diễn đạt rõ hơn mà không biến chú thích thành giải nghĩa thần học.
  revised_text: Ai ngã trên hòn đá này sẽ bị tan nát; còn nếu hòn đá này rơi trúng ai, thì sẽ nghiền nát người ấy.[a][b]
