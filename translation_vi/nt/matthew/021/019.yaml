revisions:
- from: 'Khi thấy một cây vả bên đường, Ngài đến gần cây ấy nhưng không thấy gì ngoài lá mà thôi. Ngài phán với cây: “Từ nay cho đến đời đời, không một trái nào được sinh ra từ mày nữa!”[a] Cây vả lập tức khô héo.'
  to: 'Thấy một cây vả bên đường, Ngài đến gần cây ấy và không thấy gì ngoài lá mà thôi. Ngài phán với cây: “Từ nay, sẽ chẳng bao giờ có trái từ mày nữa!”[a] Cây vả lập tức khô héo.'
  rationale: Bản sửa thay liên từ thêm nghĩa bằng “và,” duy trì sự nhấn mạnh “ngoài lá mà thôi,” và diễn đạt lời tuyên phán theo tiếng Việt hiện đại hơn. “Từ nay ... chẳng bao giờ ... nữa” chuyển tải hiệu lực kết hợp của μηκέτι và εἰς τὸν αἰῶνα; “có trái từ mày” giữ hình ảnh ἐκ σοῦ mà không áp đặt cách giải thích biểu tượng hay giáo phái. Chú thích đưa ra lối nói thành ngữ hơn nhưng vẫn là lời tuyên phán, không phải mệnh lệnh.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T05:45:21Z'
review_pass:
  verdict: revise
  source_fidelity: Bản nháp truyền đạt đúng cảnh cây vả bên đường, việc không tìm thấy gì ngoài lá, lời tuyên phán, và việc cây khô héo ngay. Tuy nhiên, “nhưng” thêm quan hệ tương phản không có trong καί; cách diễn đạt lời phán “không một trái nào được sinh ra từ mày nữa” hơi bị động và không tự nhiên, đồng thời phần “từ nay cho đến đời đời” đặt trước mệnh đề làm nặng câu. Cần diễn đạt rõ ý vĩnh viễn của μηκέτι ... εἰς τὸν αἰῶνα bằng một cấu trúc Việt tự nhiên hơn.
  naturalness: “Ngài phán” phù hợp văn phong trang trọng. “mày” khi nói với cây có thể giữ tính trực tiếp nhưng trong văn phong Kinh Thánh hiện đại dễ gây chói tai; vẫn có thể dùng trong lời nói với vật vô tri nếu nhất quán. Câu lời phán nên được làm gọn thành “sẽ chẳng bao giờ có trái từ mày nữa,” vừa tự nhiên vừa giữ hình ảnh “trái từ ngươi.”
  terminology: “Cây vả” và “khô héo” là những chọn lựa chuẩn xác. Không cần diễn giải biểu tượng. Chú thích nên là một phương án thành ngữ thật sự, không đổi lời tuyên phán thành mệnh lệnh trực tiếp “đừng ...,” vì điều đó làm hẹp sắc thái chúc dữ/tuyên phán của động từ giả định Hy Lạp.
  issues:
  - severity: medium
    issue: Liên từ “nhưng”
    rationale: Nguyên văn nối các hành động bằng καί (“và”); “nhưng” tạo một sắc thái đối lập không được nêu trong câu Hy Lạp.
  - severity: medium
    issue: Cách diễn đạt lời phán thiếu tự nhiên
    rationale: “Không một trái nào được sinh ra từ mày nữa” dùng bị động không cần thiết và làm mờ cấu trúc tuyên phán. “Sẽ chẳng bao giờ có trái từ mày nữa” truyền đạt tự nhiên hơn μηκέτι, ἐκ σοῦ, và εἰς τὸν αἰῶνα.
  - severity: low
    issue: Chú thích chuyển thành mệnh lệnh
    rationale: “Mày đừng bao giờ sinh trái nữa” có thể hiểu là mệnh lệnh trực tiếp; phương án thành ngữ nên vẫn phản ánh lời cầu chúc/tuyên phán về việc không còn trái.
