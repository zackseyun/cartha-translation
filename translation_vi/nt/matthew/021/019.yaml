id: MAT.21.19
reference: Matthew 21:19
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἰδὼν συκῆν μίαν ἐπὶ τῆς ὁδοῦ ἦλθεν ἐπ’ αὐτήν, καὶ οὐδὲν εὗρεν ἐν αὐτῇ εἰ μὴ φύλλα μόνον, καὶ λέγει αὐτῇ· ⸀Μηκέτι ἐκ σοῦ καρπὸς γένηται εἰς τὸν αἰῶνα· καὶ ἐξηράνθη παραχρῆμα ἡ συκῆ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/019.yaml
  text: And seeing a fig tree by the road[a], he came up to it and found nothing on it except leaves alone. And he said to it, “May there no longer ever be fruit from you.” And the fig tree withered at once.
translation:
  language: vi
  text: 'Thấy một cây vả bên đường, Ngài đến gần cây ấy và không thấy gì ngoài lá mà thôi. Ngài phán với cây: “Từ nay, sẽ chẳng bao giờ có trái từ mày nữa!”[a] Cây vả lập tức khô héo.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch tự nhiên hơn: “Từ nay, mày sẽ không bao giờ sinh trái nữa.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: συκῆν μίαν
  choice: một cây vả
  rationale: μίαν vừa giới thiệu một đối tượng đơn lẻ vừa có thể mang nghĩa ‘một’; tiếng Việt tự nhiên dùng ‘một cây vả’ mà không cần nhấn thành ‘một cây duy nhất’.
- source_word: ἐπὶ τῆς ὁδοῦ
  choice: bên đường
  rationale: Với một vật đứng yên, cụm này chỉ vị trí cạnh đường; ‘bên đường’ tự nhiên hơn ‘trên đường’ và phù hợp với cảnh tượng.
- source_word: ἦλθεν ἐπ’ αὐτήν
  choice: đến gần cây ấy
  rationale: Diễn đạt chuyển động tiến đến cây, đồng thời tránh đại từ vô tri thiếu rõ ràng trong tiếng Việt.
- source_word: οὐδὲν εὗρεν ἐν αὐτῇ εἰ μὴ φύλλα μόνον
  choice: không thấy gì ngoài lá mà thôi
  rationale: 'Giữ được sự nhấn mạnh của μόνον: trên cây không có gì ngoài lá, chỉ có lá.'
- source_word: λέγει αὐτῇ
  choice: Ngài phán với cây
  rationale: Dùng thì kể chuyện tự nhiên trong tiếng Việt thay cho hiện tại lịch sử Hy Lạp; ‘phán’ giữ sắc thái trang trọng của lời tuyên bố có thẩm quyền.
- source_word: Μηκέτι ἐκ σοῦ καρπὸς γένηται
  choice: không một trái nào được sinh ra từ mày nữa
  rationale: Giữ καρπός làm chủ thể ngữ pháp và bảo toàn hình ảnh ‘trái sinh ra từ mày’, thay vì chuyển hẳn sang lối diễn giải ‘mày sinh trái’.
- source_word: εἰς τὸν αἰῶνα
  choice: cho đến đời đời
  rationale: Thể hiện tính vĩnh viễn của thành ngữ Hy Lạp; kết hợp với ‘từ nay’ để truyền đạt đầy đủ μηκέτι và εἰς τὸν αἰῶνα.
- source_word: ἐξηράνθη παραχρῆμα
  choice: lập tức khô héo
  rationale: ‘Khô héo’ phù hợp với cây cối, còn ‘lập tức’ giữ rõ tính tức thời của παραχρῆμα.
theological_decisions:
- issue: Sắc thái lời Đức Giê-su nói với cây vả
  choice: 'Trình bày như một lời phán truyền mang tính cấm đoán: “không một trái nào được sinh ra từ mày nữa.”'
  alternative: 'Có thể trình bày thiên về lời báo trước: “Từ nay, mày sẽ không bao giờ sinh trái nữa.”'
  rationale: Cấu trúc Μηκέτι với động từ giả định γένηται có lực cấm đoán hoặc tuyên phán, chứ không đơn thuần là dự báo. Bản dịch giữ lực trang trọng ấy nhưng không thêm cách giải thích biểu tượng về cây vả.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. ‘Ngài phán’ phù hợp với lời nói có thẩm quyền; đại từ ‘mày’ phản ánh việc trực tiếp nói với một cái cây và giữ lực mạnh của lời tuyên phán, không nhằm biểu thị thái độ bất kính với con người.
