- from: Vậy, các môn đồ đi và làm đúng như Đức Chúa Jêsus đã dặn họ[a].
  to: Thế là các môn đệ đi và làm đúng như Giê-su đã chỉ dẫn cho họ[a].
  rationale: 'Bản sửa giữ nguyên ý và cấu trúc kể chuyện: các môn đệ đi, rồi thực hiện điều Giê-su đã chỉ dẫn. Bản sửa dùng cách gọi và chính tả hiện đại, loại bỏ tước hiệu không có trong nguyên văn, và điều chỉnh cách diễn đạt cho tự nhiên hơn mà vẫn giữ chú thích về phương án “ra lệnh.”'
