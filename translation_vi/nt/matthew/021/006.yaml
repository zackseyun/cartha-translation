  text: πορευθέντες δὲ οἱ μαθηταὶ καὶ ποιήσαντες καθὼς ⸀συνέταξεν αὐτοῖς ὁ Ἰησοῦς
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/006.yaml
  text: So the disciples went and did just as Jesus had instructed them[a].
translation:
  language: vi
  text: Thế là các môn đệ đi và làm đúng như Giê-su đã chỉ dẫn cho họ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “đã ra lệnh cho họ.” Động từ Hy Lạp có thể chỉ việc ra lệnh hoặc chỉ dẫn; trong văn cảnh này, “đã chỉ dẫn” phù hợp hơn.
    reason: lexical_alternative
lexical_decisions:
- source_word: πορευθέντες
  choice: đi
  rationale: Phân từ bất định quá khứ mang chức năng trạng ngữ, chỉ hành động xảy ra trước hoặc gắn liền với hành động tiếp theo; cách kể tự nhiên trong tiếng Việt là “đi”.
- source_word: δὲ
  choice: Vậy
  rationale: Đánh dấu sự tiếp nối của câu chuyện và kết quả đáp lại chỉ dẫn trước đó của Đức Chúa Jêsus.
- source_word: οἱ μαθηταὶ
  choice: các môn đồ
  rationale: Thuật ngữ quen thuộc trong văn cảnh các sách Phúc Âm, chỉ những người theo học Đức Chúa Jêsus.
- source_word: ποιήσαντες
  choice: làm
  rationale: Phân từ phối hợp với πορευθέντες; “làm” kết hợp tự nhiên với mệnh đề “đúng như...” và không thêm ý ngoài nguyên văn.
- source_word: καθὼς
  choice: đúng như
  rationale: Diễn đạt rõ sự tương ứng giữa việc các môn đồ làm và điều Đức Chúa Jêsus đã truyền dặn.
- source_word: συνέταξεν
  choice: đã dặn
  rationale: Trong ngữ cảnh này, động từ chỉ việc đưa ra chỉ thị hoặc mệnh lệnh. “Đã dặn” tự nhiên, phù hợp với những chỉ dẫn cụ thể ngay trước đó, đồng thời giữ khả năng hiểu mạnh hơn qua chú thích.
- source_word: αὐτοῖς
  choice: họ
  rationale: Tân ngữ gián tiếp, quy chiếu về các môn đồ.
- source_word: ὁ Ἰησοῦς
  choice: Đức Chúa Jêsus
  rationale: Cách gọi trang trọng, quen dùng trong văn phong Kinh Thánh tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu; giữ nhịp kể ngắn gọn của nguyên văn. Dùng “môn đồ” và “Đức Chúa Jêsus” theo lối diễn đạt Kinh Thánh tiếng Việt quen thuộc.
