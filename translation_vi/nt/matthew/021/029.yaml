base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/029.yaml
  text: But he answered[b][a], ‘I do not want to.’ But later he changed his mind and went.
translation:
  language: vi
  text: 'Còn người con ấy đáp: “Con không muốn.” Nhưng sau đó, anh đổi ý[a] và đi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “sau đó hối tiếc” hoặc “sau đó đổi ý.” Từ Hy Lạp có thể bao hàm sự hối tiếc dẫn đến thay đổi hướng hành động.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς
  choice: đáp
  rationale: Đây là công thức kể chuyện thông dụng. “Đáp” diễn đạt tự nhiên phân từ Hy Lạp trong tiếng Việt mà không làm mất ý.
- source_word: Οὐ θέλω
  choice: Con không muốn
  rationale: θέλω diễn tả ý muốn hoặc sự sẵn lòng. Trong lời người con nói với cha, “Con không muốn” vừa trực tiếp, tự nhiên, vừa giữ sắc thái ý chí mà không biến thành lời tuyên bố tuyệt đối “Con sẽ không đi”.
- source_word: ὕστερον
  choice: sau đó
  rationale: Trạng từ chỉ thời gian xảy ra tiếp sau; “sau đó” rõ ràng và tự nhiên trong văn kể chuyện.
- source_word: μεταμεληθεὶς
  choice: đổi ý
  rationale: μεταμέλομαι có thể bao hàm sự hối tiếc dẫn đến thay đổi hướng hành động. Trong ngữ cảnh này, “đổi ý” nêu bật sự đảo ngược quyết định mà không áp đặt sắc thái thần học mạnh hơn của “ăn năn”.
- source_word: ἀπῆλθεν
  choice: đi
  rationale: Trong ngữ cảnh, động từ chỉ việc người con đi làm điều cha yêu cầu, không chỉ đơn thuần rời khỏi nơi đó. “Đi” là cách diễn đạt gọn và đầy đủ.
theological_decisions:
- issue: Cách dịch μεταμεληθεὶς trong bối cảnh dụ ngôn
  choice: đổi ý
  alternative: hối tiếc; hồi tâm; ăn năn
  rationale: Câu này mô tả việc người con chuyển từ từ chối sang làm theo. “Ăn năn” có thể xác định quá mức sắc thái thần học và làm mờ sự khác biệt từ vựng với μετανοέω. “Đổi ý” giữ trọng tâm vào sự thay đổi dẫn đến hành động, còn chú thích bảo lưu khả năng có sắc thái hối tiếc.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Đại từ “con” được dùng trong lời nói trực tiếp vì người nói đang thưa với cha; phần kể dùng “người con ấy” rồi “anh” để tự nhiên và rõ nghĩa.
