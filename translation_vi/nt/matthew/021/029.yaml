- from: 'Nhưng người con ấy đáp: “Con không muốn.” Tuy nhiên, sau đó anh đổi ý[a] và đi.'
  to: 'Còn người con ấy đáp: “Con không muốn.” Nhưng sau đó, anh đổi ý[a] và đi.'
  rationale: 'Bản sửa giữ nguyên nghĩa của nguồn: lời từ chối trực tiếp, rồi sự đổi ý và hành động tiếp theo. “Còn” phản ánh chuyển ý nhẹ của ὁ δέ; “Nhưng sau đó” diễn đạt tự nhiên sự đảo chiều. Chú thích được chỉnh để nêu các khả năng ngữ nghĩa mà không thêm sắc thái diễn giải.'
