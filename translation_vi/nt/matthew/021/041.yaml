  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: λέγουσιν αὐτῷ· Κακοὺς κακῶς ἀπολέσει αὐτούς, καὶ τὸν ἀμπελῶνα ἐκδώσεται ἄλλοις γεωργοῖς, οἵτινες ἀποδώσουσιν αὐτῷ τοὺς καρποὺς ἐν τοῖς καιροῖς αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/041.yaml
  text: They said to him[a], “He will miserably destroy those wretches, and he will lease the vineyard to other farmers[c][b], who will give him the fruits in their seasons.”
translation:
  language: vi
  text: 'Họ nói với Người: “Ông ấy sẽ tiêu diệt thảm hại những kẻ ác đó[a], rồi sẽ cho những tá điền khác thuê vườn nho[b], là những người sẽ nộp hoa lợi cho ông vào đúng mùa[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hy Lạp dùng một tính từ và một trạng từ cùng gốc, có thể dịch sát: “sẽ tiêu diệt một cách tồi tệ những kẻ tồi tệ ấy.” Lối chơi chữ này nhấn mạnh sự phán xét.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “sẽ giao vườn nho cho những người canh tác khác” hoặc “sẽ cho những nông dân khác thuê vườn nho.”'
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể dịch: “sẽ giao cho ông các thứ trái vào những mùa của chúng” hoặc “sẽ nộp sản vật cho ông vào những thời điểm thích hợp.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγουσιν αὐτῷ
  choice: Họ thưa với Ngài
  rationale: Động từ hiện tại trong tiếng Hy Lạp có chức năng hiện tại lịch sử trong lời kể. Tiếng Việt không bắt buộc đánh dấu thì; “thưa với Ngài” diễn đạt tự nhiên lời đáp kính trọng trong ngữ cảnh.
- source_word: Κακοὺς κακῶς
  choice: không thương tiếc những kẻ gian ác đó
  rationale: Cặp tính từ–trạng từ cùng gốc nhấn mạnh cả sự gian ác của các tá điền lẫn mức độ nghiêm khắc của hình phạt. Tiếng Việt khó giữ nguyên lối chơi chữ mà vẫn tự nhiên, nên bản dịch truyền đạt sức nhấn bằng “không thương tiếc” và “gian ác”.
- source_word: ἀπολέσει
  choice: sẽ tiêu diệt
  rationale: Giữ mức độ nghiêm trọng và tính dứt khoát của sự phán xét nhưng không xác định thêm cách thức hủy diệt.
- source_word: τὸν ἀμπελῶνα
  choice: vườn nho
  rationale: Cách dịch trực tiếp, tự nhiên, đồng thời giữ nguyên hình ảnh vườn nho của dụ ngôn.
- source_word: ἐκδώσεται
  choice: cho ... thuê
  rationale: Trong bối cảnh canh tác, động từ chỉ việc chủ đất giao tài sản cho người khác thuê để khai thác.
- source_word: ἄλλοις γεωργοῖς
  choice: những người làm vườn khác
  rationale: Diễn đạt rõ những người canh tác; quan hệ thuê mướn đã được thể hiện qua “cho ... thuê”, nên không cần thêm thuật ngữ chuyên biệt.
- source_word: ἀποδώσουσιν αὐτῷ
  choice: sẽ nộp ... cho ông
  rationale: Động từ mang ý trao lại hoặc nộp phần phải trả. “Nộp” làm rõ đây là hoa lợi đến hạn trong quan hệ thuê vườn.
- source_word: τοὺς καρποὺς
  choice: hoa lợi
  rationale: Trong ngữ cảnh thuê đất nông nghiệp, “hoa lợi” vừa chỉ sản vật thu được vừa gợi phần thu hoạch phải giao cho chủ.
- source_word: ἐν τοῖς καιροῖς αὐτῶν
  choice: vào đúng mùa
  rationale: Diễn đạt cả thời điểm thích hợp/đã định và bối cảnh mùa vụ, mà không biến cụm từ thành một kỳ hạn pháp lý quá cụ thể.
theological_decisions:
- issue: Mức độ và bản chất của sự phán xét trong lời đáp của những người nghe
  choice: sẽ tiêu diệt không thương tiếc những kẻ gian ác đó
  alternative: sẽ khiến những kẻ gian ác đó phải chết thảm
  rationale: Bản dịch giữ sức nặng của lối nhấn mạnh κακοὺς κακῶς và sự phán xét dứt khoát, nhưng không thu hẹp ἀπολέσει thành một cách thức xử tử cụ thể hoặc đưa thêm kết luận giáo lý ngoài văn bản.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “Ngài” dành cho Chúa Giê-su trong lời kể; “ông ấy/ông” chỉ chủ vườn trong câu trả lời. Cấu trúc được chia thành hai câu trong lời dẫn để tiếng Việt sáng rõ, nhưng vẫn giữ nguyên quan hệ diễn tiến của câu Hy Lạp.
