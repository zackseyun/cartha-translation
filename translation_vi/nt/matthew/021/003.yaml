id: MAT.21.3
reference: Matthew 21:3
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἐάν τις ὑμῖν εἴπῃ τι, ἐρεῖτε ὅτι Ὁ κύριος αὐτῶν χρείαν ἔχει· ⸀εὐθὺς δὲ ⸀ἀποστελεῖ αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/003.yaml
  text: And if anyone says anything to you[a], you shall say[b], ‘The Lord has need of them,’ and he will send them at once.
translation:
  language: vi
  text: 'Nếu có ai nói gì với anh em, hãy nói: “Chúa[a] cần chúng.” Người đó[b] sẽ lập tức gửi chúng đi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hy Lạp cũng có thể dịch là “chủ.”
    reason: lexical_alternative
  - marker: b
    text: Nguyên văn chỉ có “người sẽ lập tức sai/gửi chúng đi,” không nêu rõ chủ ngữ; theo mạch văn, tự nhiên nhất là người vừa nói với các môn đồ.
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: ἐάν τις ὑμῖν εἴπῃ τι
  choice: Nếu có ai nói gì với anh em
  rationale: Giữ nguyên cấu trúc điều kiện bất định và phạm vi rộng của τις cùng τι. “Anh em” thể hiện đại từ số nhiều ὑμῖν một cách tự nhiên trong lời Chúa Giê-su nói với các môn đồ.
- source_word: ἐρεῖτε
  choice: hãy nói
  rationale: Thì tương lai ở đây mang lực chỉ dẫn; “hãy nói” diễn đạt mệnh lệnh tự nhiên trong tiếng Việt hiện đại.
- source_word: Ὁ κύριος
  choice: Chúa
  rationale: Giữ sức nặng của danh xưng κύριος và khả năng Chúa Giê-su tự nói về thẩm quyền của mình, đồng thời không loại bỏ hoàn toàn nghĩa “chủ” theo ngữ cảnh.
- source_word: αὐτῶν χρείαν ἔχει
  choice: cần chúng
  rationale: Diễn đạt tự nhiên thành ngữ “có nhu cầu về chúng”; đại từ số nhiều chỉ hai con vật trong câu trước.
- source_word: εὐθὺς
  choice: lập tức
  rationale: Diễn đạt rõ tính tức thời của hành động.
- source_word: ἀποστελεῖ αὐτούς
  choice: Người ấy sẽ ... cho chúng đi
  rationale: Động từ có nghĩa cơ bản là “sai/gửi đi.” Trong ngữ cảnh, chủ ngữ hợp lý nhất là người vừa lên tiếng, người sẽ để hai con vật đi cùng các môn đồ; cách dịch không thêm ý “trả lại,” vốn không được nói rõ trong tiếng Hy Lạp.
theological_decisions:
- issue: Ý nghĩa và đối tượng chỉ về của Ὁ κύριος
  choice: Chúa
  alternative: chủ
  rationale: “Chúa” bảo toàn cả nghĩa thực tế về thẩm quyền lẫn sức nặng Kitô học có thể có khi Chúa Giê-su nói về chính mình. “Chủ” có thể được hiểu là chủ của hai con vật và được ghi nhận trong chú thích để giữ sự đa nghĩa.
- issue: Chủ ngữ hàm ẩn của ἀποστελεῖ
  choice: người vừa nói sẽ cho hai con vật đi
  alternative: Chúa sẽ lập tức sai/gửi chúng đi
  rationale: Động từ ngôi thứ ba số ít không nêu lại chủ ngữ. Chủ ngữ tự nhiên nhất theo mạch câu là “ai đó” vừa chất vấn các môn đồ, nhưng ngữ pháp tự nó vẫn cho phép liên hệ với “Chúa”; chú thích bảo toàn độ mở này.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “anh em” để thể hiện đối tượng số nhiều mà không thêm danh xưng không có trong nguyên văn; dùng “cho chúng đi” để diễn đạt tự nhiên hành động để hai con vật đi theo các môn đồ.
