id: MAT.21.42
reference: Matthew 21:42
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Λέγει αὐτοῖς ὁ Ἰησοῦς· Οὐδέποτε ἀνέγνωτε ἐν ταῖς γραφαῖς· Λίθον ὃν ἀπεδοκίμασαν οἱ οἰκοδομοῦντες οὗτος ἐγενήθη εἰς κεφαλὴν γωνίας· παρὰ κυρίου ἐγένετο αὕτη, καὶ ἔστιν θαυμαστὴ ἐν ὀφθαλμοῖς ἡμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/042.yaml
  text: 'Jesus said to them[a], “Have you never read in the Scriptures: ‘The stone that the builders rejected—this one has become the cornerstone. This came from the Lord[b], and it is marvelous in our eyes’?”'
translation:
  language: vi
  text: 'Đức Giê-su nói với họ: “Các ông chưa bao giờ đọc trong Kinh Thánh sao: ‘Hòn đá mà những người thợ xây đã loại bỏ, chính hòn đá ấy đã trở thành đá góc[a]. Điều này đến từ Chúa[b], và là điều kỳ diệu trước mắt chúng ta’?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch là “đá đỉnh”; sát chữ: “đầu của góc.”'
    reason: lexical_alternative
  - marker: b
    text: 'Tiếng Hy Lạp: “từ Chúa”; bản Hê-bơ-rơ của câu trích dẫn dùng danh YHWH (ĐỨC CHÚA).'
    reason: alternative_reading
lexical_decisions:
- source_word: Λέγει
  choice: nói
  rationale: Thì hiện tại lịch sử trong tiếng Hy Lạp được diễn đạt tự nhiên bằng “nói” trong lối kể tiếng Việt, không làm thay đổi ý nghĩa.
- source_word: Οὐδέποτε ἀνέγνωτε
  choice: chưa bao giờ đọc
  rationale: Cụm này giữ sức nhấn mạnh của câu hỏi tu từ và tự nhiên trong tiếng Việt hiện đại.
- source_word: γραφαῖς
  choice: Kinh Thánh
  rationale: Trong ngữ cảnh, từ này chỉ các sách thánh của Ít-ra-ên; “Kinh Thánh” là cách gọi rõ ràng, quen thuộc.
- source_word: ἀπεδοκίμασαν
  choice: loại bỏ
  rationale: Động từ diễn tả việc đánh giá rồi bác bỏ vì cho là không thích hợp; “loại bỏ” phù hợp với hình ảnh thợ xây.
- source_word: οἱ οἰκοδομοῦντες
  choice: những người thợ xây
  rationale: Phân từ được dùng như danh từ; cách dịch này tự nhiên và giữ nguyên ẩn dụ xây dựng.
- source_word: οὗτος ἐγενήθη εἰς
  choice: đã trở thành
  rationale: Diễn đạt kết quả của sự thay đổi địa vị, đồng thời đại từ nhấn mạnh được thể hiện tự nhiên qua chính chủ thể “hòn đá” trong tiếng Việt.
- source_word: κεφαλὴν γωνίας
  choice: đá góc nhà
  rationale: Cách dịch ngắn gọn, quen thuộc, giữ hình ảnh kiến trúc mà không quyết định dứt khoát vị trí chính xác của viên đá.
- source_word: παρὰ κυρίου
  choice: đến từ Chúa
  rationale: παρά với sở hữu cách biểu thị nguồn gốc; “đến từ Chúa” chuyển tải trực tiếp ý này.
- source_word: θαυμαστὴ ἐν ὀφθαλμοῖς ἡμῶν
  choice: thật kỳ diệu trước mắt chúng ta
  rationale: Giữ sắc thái trang trọng của lời trích dẫn và hình ảnh nguyên ngữ, đồng thời vẫn dễ hiểu.
theological_decisions:
- issue: Cách dịch κύριος trong lời trích Thi Thiên
  choice: Chúa
  alternative: ĐỨC CHÚA
  rationale: Bản Hy Lạp có κυρίου nên bản chính dịch là “Chúa”; chú thích cho biết nguồn Hê-bơ-rơ dùng danh riêng giao ước YHWH.
- issue: Việc áp dụng hình ảnh hòn đá cho Đấng Mê-si-a
  choice: Giữ nguyên ẩn dụ, không thêm lời giải nghĩa
  alternative: Nêu rõ hòn đá là Đấng Mê-si-a hoặc chính Đức Giê-su
  rationale: Ngữ cảnh cho thấy Đức Giê-su áp dụng câu này, nhưng bản thân câu trích dẫn không giải nghĩa trực tiếp; không nên đưa phần diễn giải thần học vào chính văn.
- issue: Vị trí/chức năng của κεφαλὴ γωνίας
  choice: đá góc nhà
  alternative: đá đỉnh góc
  rationale: Ngữ đoạn có thể được hiểu theo hơn một hình ảnh kiến trúc. Chính văn dùng cách gọi quen thuộc, còn chú thích bảo lưu khả năng “đá đỉnh góc” và nghĩa sát chữ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Giê-su” và đại từ “các ông” phù hợp với lời Đức Giê-su nói với các lãnh đạo tôn giáo trong ngữ cảnh. Nhịp câu trích dẫn được giữ cô đọng; các điểm mơ hồ thực sự về loại đá và danh xưng thần linh được ghi ở chú thích.
