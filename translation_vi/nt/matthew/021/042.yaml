revisions:
- from: 'Đức Giê-su nói với họ: “Các ông chưa bao giờ đọc trong Kinh Thánh sao: ‘Hòn đá bị những người thợ xây loại bỏ đã trở thành đá góc nhà[a]. Việc ấy đến từ Chúa[b] và thật kỳ diệu trước mắt chúng ta’?”'
  to: 'Đức Giê-su nói với họ: “Các ông chưa bao giờ đọc trong Kinh Thánh sao: ‘Hòn đá mà những người thợ xây đã loại bỏ, chính hòn đá ấy đã trở thành đá góc[a]. Điều này đến từ Chúa[b], và là điều kỳ diệu trước mắt chúng ta’?”'
  rationale: Sửa tối thiểu để không thêm “nhà” vào hình ảnh kiến trúc, biểu đạt đại từ nhấn mạnh οὗτος, và làm chú thích về phương án kiến trúc tự nhiên hơn. Không giải thích hình ảnh hòn đá theo hướng giáo lý và vẫn bảo lưu tính mơ hồ của κεφαλὴ γωνίας.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T05:41:32Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản nháp truyền đạt đúng cấu trúc và ý chính của câu: câu hỏi tu từ, lời trích dẫn, sự việc xuất phát từ Chúa, và tính kỳ diệu trước mắt “chúng ta”. Tuy nhiên, “đá góc nhà” thêm yếu tố “nhà” không có trong tiếng Hy Lạp, còn đại từ nhấn mạnh οὗτος nên được thể hiện rõ hơn bằng “chính hòn đá ấy”.'
  naturalness: Câu sửa vẫn dùng văn phong Việt ngữ hiện đại, trang trọng và tự nhiên. “Đá góc” gọn hơn “đá góc nhà” và tránh xác định quá mức chức năng kiến trúc đang có tranh luận.
  terminology: Giữ “Đức Giê-su”, “Kinh Thánh”, và “Chúa” nhất quán với bản dịch và chính sách thuật ngữ. Chú thích về YHWH được giữ lại; chú thích về κεφαλὴ γωνίας được diễn đạt lại để bảo lưu khả năng “đá đỉnh” mà không trình bày đó là nghĩa chắc chắn.
  issues:
  - severity: low
    issue: “đá góc nhà” thêm từ “nhà”
    rationale: κεφαλὴν γωνίας nghĩa sát là “đầu/góc của góc”; nguyên ngữ không nêu “nhà”. “Đá góc” giữ hình ảnh xây dựng mà không thêm chi tiết.
  - severity: low
    issue: Sự nhấn mạnh của οὗτος chưa được biểu đạt rõ
    rationale: Trong câu trích, οὗτος (“chính hòn đá này/ấy”) nhấn mạnh sự đảo ngược. “Chính hòn đá ấy” phản ánh sắc thái này tự nhiên trong tiếng Việt.
  - severity: low
    issue: Chú thích “đá đỉnh góc” chưa thật tự nhiên
    rationale: “Đá đỉnh” là cách nêu phương án “capstone” dễ hiểu hơn; phần “sát chữ” tiếp tục minh bạch hóa cấu trúc Hy Lạp.
