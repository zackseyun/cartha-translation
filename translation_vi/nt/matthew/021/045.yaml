  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Καὶ ἀκούσαντες οἱ ἀρχιερεῖς καὶ οἱ Φαρισαῖοι τὰς παραβολὰς αὐτοῦ ἔγνωσαν ὅτι περὶ αὐτῶν λέγει·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/045.yaml
  text: And when the chief priests and the Pharisees heard his parables[a], they knew that he was speaking about them.
translation:
  language: vi
  text: Khi các thượng tế và người Pha-ri-si nghe những dụ ngôn của Ngài, họ nhận ra rằng Ngài đang nói về họ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “liên quan đến họ”. Họ nhận ra rằng các dụ ngôn ấy nhắm đến mình. Một số bản dịch diễn giải mạnh hơn là “chống lại họ”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσαντες
  choice: Khi ... nghe
  rationale: Phân từ bất định quá khứ diễn tả hoàn cảnh thời gian trước động từ chính; mệnh đề “Khi ... nghe” tự nhiên trong tiếng Việt và giữ đúng trình tự.
- source_word: ἀρχιερεῖς
  choice: các thượng tế
  rationale: Cách gọi quen thuộc dành cho giới lãnh đạo tư tế cấp cao; không hàm ý có nhiều người đồng thời giữ chức thầy tế lễ thượng phẩm duy nhất.
- source_word: Φαρισαῖοι
  choice: người Pha-ri-si
  rationale: Phiên âm tên nhóm Do Thái theo cách dùng quen thuộc trong tiếng Việt.
- source_word: παραβολὰς
  choice: những dụ ngôn
  rationale: Thuật ngữ quen thuộc và chính xác cho các câu chuyện hoặc lời nói mang tính hình tượng của Chúa Giê-su trong các sách Phúc Âm Nhất Lãm.
- source_word: ἔγνωσαν
  choice: họ nhận ra
  rationale: Động từ ở đây chỉ việc đi đến chỗ nhận biết; “nhận ra” diễn đạt sắc thái này tự nhiên hơn “biết” trong tiếng Việt.
- source_word: περὶ αὐτῶν
  choice: về họ
  rationale: περί với sở hữu cách có nghĩa thông thường là “về/liên quan đến”; không tăng cường thành “chống lại họ” dù văn cảnh có sắc thái phê phán.
- source_word: λέγει
  choice: đang nói
  rationale: Hiện tại trong mệnh đề gián tiếp được diễn đạt tự nhiên bằng thể tiếp diễn tiếng Việt, chỉ nội dung họ nhận ra từ các dụ ngôn.
theological_decisions:
- issue: Có nên nói rõ các dụ ngôn của Chúa Giê-su nhằm lên án các lãnh đạo hay không
  choice: Ngài đang nói về họ
  alternative: Ngài đang nói chống lại họ
  rationale: Bản Hy Lạp dùng περὶ αὐτῶν, nghĩa trực tiếp là “về họ”. Văn cảnh cho thấy lời nói mang tính phê phán, nhưng bản dịch không nên đưa sắc thái đối nghịch mạnh hơn vào chính văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” để quy chiếu Chúa Giê-su theo văn mạch; giữ thuật ngữ Kinh Thánh quen thuộc “thượng tế”, “Pha-ri-si” và “dụ ngôn”.
