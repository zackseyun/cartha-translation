- from: Khi mùa hái quả đã đến gần, ông sai các đầy tớ[a] của mình đến gặp những người thuê vườn nho[b] để thu hoa lợi thuộc về ông.
  to: Khi mùa thu hoạch gần đến, ông sai các đầy tớ[a] của mình đến với những người thuê vườn nho[b] để thu hoa lợi của ông.
  rationale: 'Sửa các chỗ diễn đạt để tiếng Việt tự nhiên và sát sắc thái nguồn hơn: “mùa thu hoạch gần đến” phản ánh καιρὸς τῶν καρπῶν và động từ “đến gần”; “đến với” không thêm ý cho πρὸς. Giữ “đầy tớ”, “người thuê vườn nho”, và “hoa lợi của ông” cùng các chú thích từ vựng, không áp đặt diễn giải biểu tượng cho dụ ngôn.'
