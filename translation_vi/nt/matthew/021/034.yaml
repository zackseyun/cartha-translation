source:
  edition: SBLGNT
  text: ὅτε δὲ ἤγγισεν ὁ καιρὸς τῶν καρπῶν, ἀπέστειλεν τοὺς δούλους αὐτοῦ πρὸς τοὺς γεωργοὺς λαβεῖν τοὺς καρποὺς αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/034.yaml
  text: But when the season for the fruits had drawn near[b][a], he sent his servants to the tenant farmers to collect his fruits.
translation:
  language: vi
  text: Khi mùa thu hoạch gần đến, ông sai các đầy tớ[a] của mình đến với những người thuê vườn nho[b] để thu hoa lợi của ông.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “các nô lệ”. Từ Hy Lạp δοῦλος có thể chỉ đầy tớ hoặc nô lệ; ở đây bản dịch dùng “đầy tớ” vì câu chuyện nhấn mạnh vai trò họ được chủ sai đi.
    reason: lexical_alternative
  - marker: b
    text: Nguyên văn là “những người canh tác”. Trong bối cảnh này, họ thuê và canh tác vườn nho thuộc về một chủ khác; vì vậy có thể dịch là “những người thuê vườn nho”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε δὲ
  choice: Khi
  rationale: ὅτε mở đầu mệnh đề thời gian; δέ là từ nối nhẹ, có thể để hàm ẩn trong tiếng Việt để câu kể tự nhiên.
- source_word: ἤγγισεν
  choice: đã đến gần
  rationale: Diễn đạt đúng ý ‘đến gần’ và dùng ‘đã’ để thể hiện quan hệ thời gian với hành động sai đầy tớ đi sau đó.
- source_word: ὁ καιρὸς τῶν καρπῶν
  choice: mùa hái quả
  rationale: Trong bối cảnh nông nghiệp, καιρός chỉ mùa thích hợp, còn τῶν καρπῶν xác định đó là mùa thu hái sản vật; cách nói này tự nhiên và không thu hẹp ‘quả’ thành ‘nho’ dù bối cảnh là vườn nho.
- source_word: ἀπέστειλεν
  choice: ông sai ... đến
  rationale: ‘Sai ... đến’ là cách diễn đạt tự nhiên cho hành động phái người đi làm một nhiệm vụ.
- source_word: τοὺς δούλους αὐτοῦ
  choice: các đầy tớ của mình
  rationale: δοῦλος có thể chỉ đầy tớ hoặc nô lệ. Trong dụ ngôn này, vai trò đại diện được nhấn mạnh hơn địa vị pháp lý, nên ‘đầy tớ’ phù hợp, đồng thời ghi chú giữ lại nghĩa thay thế.
- source_word: πρὸς τοὺς γεωργοὺς
  choice: đến gặp những người thuê vườn nho
  rationale: γεωργός là người canh tác; ngữ cảnh cho thấy họ canh tác vườn nho của chủ đất. ‘Người thuê vườn nho’ làm rõ quan hệ ấy mà vẫn tự nhiên trong tiếng Việt.
- source_word: λαβεῖν
  choice: để thu
  rationale: λαμβάνω có nghĩa rộng là nhận hoặc lấy; ở đây chủ vườn cho người đến nhận phần sản vật thuộc về mình, nên ‘thu’ diễn đạt đúng hành động.
- source_word: τοὺς καρποὺς αὐτοῦ
  choice: hoa lợi thuộc về ông
  rationale: καρποί ở đây là sản vật từ vườn nho mà chủ vườn có quyền nhận. ‘Hoa lợi’ chuyển tải nghĩa kinh tế-nông nghiệp tự nhiên hơn ‘các quả của ông’, còn ‘thuộc về ông’ giữ rõ đại từ sở hữu αὐτοῦ.
