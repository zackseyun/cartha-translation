  terminology: “Đức Giê-su,” “Đức Chúa Trời,” “vương quốc,” “người thu thuế,” và “phụ nữ hành nghề mại dâm” nhất quán, dễ hiểu và phù hợp với nghĩa từ vựng. Cách gọi sau tránh từ cổ và không làm giảm tính cụ thể của πόρναι.
