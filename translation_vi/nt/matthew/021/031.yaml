id: MAT.21.31
reference: Matthew 21:31
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: τίς ἐκ τῶν δύο ἐποίησεν τὸ θέλημα τοῦ πατρός; ⸀λέγουσιν· Ὁ ⸀πρῶτος. λέγει αὐτοῖς ὁ Ἰησοῦς· Ἀμὴν λέγω ὑμῖν ὅτι οἱ τελῶναι καὶ αἱ πόρναι προάγουσιν ὑμᾶς εἰς τὴν βασιλείαν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/031.yaml
  text: Which of the two did the will of the father? They said[a], “The first.” Jesus said to them, “Truly I say to you, the tax collectors and the prostitutes are going ahead of you into the kingdom of God.”
translation:
  language: vi
  text: 'Trong hai người con, ai đã làm theo ý muốn của cha mình? Họ đáp: “Người con thứ nhất.” Đức Giê-su nói với họ: “Thật, tôi nói với các ông: những người thu thuế và những phụ nữ hành nghề mại dâm đang đi trước các ông vào vương quốc Đức Chúa Trời.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đang vào vương quốc Đức Chúa Trời trước các ông.” Nguyên văn Hy Lạp là “đang đi trước các ông”, nhấn mạnh việc họ đi trước mà không nhất thiết tuyên bố rằng các ông cuối cùng sẽ bị loại.'
    reason: alternative_reading
lexical_decisions:
- source_word: τίς ἐκ τῶν δύο
  choice: Trong hai người con, ai
  rationale: Diễn đạt tự nhiên quan hệ phân xuất của ἐκ τῶν δύο; thêm “người con” từ ngữ cảnh trực tiếp của dụ ngôn để tiếng Việt rõ nghĩa.
- source_word: ἐποίησεν τὸ θέλημα τοῦ πατρός
  choice: đã làm theo ý muốn của cha mình
  rationale: “Làm theo ý muốn” là cách nói tự nhiên trong tiếng Việt và giữ nghĩa cụ thể của ποιέω; “cha mình” chỉ người cha trong dụ ngôn, không trực tiếp đồng nhất với Đức Chúa Trời.
- source_word: Ὁ πρῶτος
  choice: Người con thứ nhất
  rationale: Giữ câu trả lời ngắn gọn, đồng thời bổ sung danh từ được tỉnh lược để tránh cách nói thiếu tự nhiên trong tiếng Việt.
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: Thật, tôi nói với các ông
  rationale: Giữ sắc thái long trọng, xác quyết của công thức Ἀμήν mà vẫn dễ hiểu trong tiếng Việt hiện đại.
- source_word: τελῶναι
  choice: những người thu thuế
  rationale: Cách gọi chuẩn, rõ nghĩa đối với những người làm nghề thu thuế trong bối cảnh các sách Phúc Âm.
- source_word: πόρναι
  choice: những phụ nữ hành nghề mại dâm
  rationale: Chuyển đúng nghĩa cụ thể của danh từ giống cái số nhiều, bằng cách diễn đạt hiện đại và trang trọng, tránh từ cổ hoặc mang tính miệt thị quá mức.
- source_word: προάγουσιν ὑμᾶς
  choice: đang đi trước các ông
  rationale: Giữ hình ảnh “đi trước” và sắc thái hiện tại của động từ, không diễn giải quá mức thành sự loại trừ cuối cùng.
- source_word: εἰς τὴν βασιλείαν τοῦ θεοῦ
  choice: vào vương quốc Đức Chúa Trời
  rationale: Giữ hướng chuyển động của εἰς và thuật ngữ thần học βασιλεία theo nghĩa quyền trị vì/vương quốc trong một cách diễn đạt quen thuộc.
theological_decisions:
- issue: Ý nghĩa của προάγουσιν ὑμᾶς đối với việc vào vương quốc
  choice: đang đi trước các ông vào vương quốc Đức Chúa Trời
  alternative: đang vào vương quốc Đức Chúa Trời trước các ông
  rationale: Bản dịch chính giữ hình ảnh đi trước và nhấn mạnh thứ tự ưu tiên, nhưng không tự ý khẳng định rằng những người đang được Đức Giê-su nói với sẽ hoàn toàn bị loại khỏi vương quốc.
- issue: Đối tượng của τοῦ πατρός
  choice: cha mình
  alternative: người cha
  rationale: Trong câu hỏi, “cha” trước hết là người cha trong dụ ngôn. Cách dịch tránh trực tiếp viết hoa hoặc đồng nhất nhân vật này với Đức Chúa Trời, dù dụ ngôn có ý nghĩa thần học.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “Đức Giê-su”, “Đức Chúa Trời” và đại từ “các ông” phù hợp với lời quở trách trực tiếp trong bối cảnh. Dấu chú thích [a] được đặt ngay sau mệnh đề liên quan.
