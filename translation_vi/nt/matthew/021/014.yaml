id: MAT.21.14
reference: Matthew 21:14
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Καὶ προσῆλθον αὐτῷ ⸂τυφλοὶ καὶ χωλοὶ⸃ ἐν τῷ ἱερῷ, καὶ ἐθεράπευσεν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/014.yaml
  text: And the blind and the lame came to him in the temple[a], and he healed them.
translation:
  language: vi
  text: Những người mù và què đến với Ngài trong khuôn viên đền thờ[a], và Ngài chữa lành họ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hy Lạp ở đây chỉ toàn bộ khuôn viên đền thờ, chứ không riêng nơi thánh bên trong.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσῆλθον
  choice: đến với
  rationale: Động từ προσέρχομαι diễn tả việc đến gần một người; “đến với” tự nhiên trong tiếng Việt và giữ rõ hướng chuyển động về phía Chúa Giê-su.
- source_word: τυφλοὶ καὶ χωλοὶ
  choice: những người mù và què
  rationale: Hai tính từ được dùng như danh từ số nhiều. Cách dịch này rõ nghĩa, tự nhiên và tránh biến tình trạng thể chất thành nhãn gọi quá cứng.
- source_word: ἐν τῷ ἱερῷ
  choice: trong khuôn viên đền thờ
  rationale: ἱερόν chỉ toàn bộ khu vực hay khuôn viên đền thờ, không riêng nơi thánh bên trong; cách dịch này thể hiện trực tiếp sắc thái không gian của từ Hy Lạp.
- source_word: ἐθεράπευσεν
  choice: chữa lành
  rationale: Trong ngữ cảnh các phép lạ của sách Phúc Âm, θεραπεύω mang nghĩa chữa lành; “chữa lành” vừa chính xác vừa trang trọng, tự nhiên.
theological_decisions:
- issue: Địa điểm chữa lành được diễn tả bằng ἱερόν
  choice: Chúa Giê-su chữa lành họ trong khuôn viên đền thờ.
  alternative: Chúa Giê-su chữa lành họ trong đền thờ.
  rationale: Bản dịch chính dùng “khuôn viên đền thờ” để không gợi ý rằng họ đã vào nơi thánh bên trong, đồng thời giữ đúng phạm vi rộng của ἱερόν.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Đại từ “Ngài” duy trì lối quy chiếu tôn kính phổ biến dành cho Chúa Giê-su; cấu trúc câu bám sát mạch kể Hy Lạp mà vẫn tự nhiên trong tiếng Việt.
