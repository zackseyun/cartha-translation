id: MAT.21.37
reference: Matthew 21:37
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὕστερον δὲ ἀπέστειλεν πρὸς αὐτοὺς τὸν υἱὸν αὐτοῦ λέγων· Ἐντραπήσονται τὸν υἱόν μου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/037.yaml
  text: But later he sent his son to them[a], saying, ‘They will respect my son.’
translation:
  language: vi
  text: 'Nhưng sau đó, ông sai con trai mình đến với họ và nói: “Họ sẽ kính trọng con trai ta.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Họ sẽ nể trọng con trai ta.” Động từ Hy Lạp chỉ việc tỏ lòng tôn trọng hoặc nhường bước trước một người; trong những văn cảnh khác, từ này cũng có thể mang nghĩa “hổ thẹn.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὕστερον
  choice: sau đó
  rationale: Diễn đạt tự nhiên ý nghĩa thời gian “về sau/sau đó”, giữ đúng trình tự câu chuyện mà không thêm sắc thái tuyệt đối của “cuối cùng”.
- source_word: δὲ
  choice: Nhưng
  rationale: 'Đánh dấu bước chuyển có tính tương phản nhẹ: sau khi sai các đầy tớ, chủ vườn sai chính con trai mình.'
- source_word: ἀπέστειλεν
  choice: sai
  rationale: Trong văn cảnh một người chủ phái người đến nơi khác, “sai” là cách diễn đạt gọn, tự nhiên và không gợi nghĩa chuyên biệt về chức vụ sứ đồ.
- source_word: πρὸς αὐτοὺς
  choice: đến với họ
  rationale: πρός với đối cách sau động từ sai đi chỉ hướng đến những người nhận; “đến với họ” tự nhiên và rõ nghĩa trong tiếng Việt.
- source_word: τὸν υἱὸν αὐτοῦ
  choice: con trai mình
  rationale: Giữ nghĩa quan hệ thân thuộc và tránh thêm từ nhấn mạnh như “chính” hoặc “yêu dấu” vốn không có trong câu Hy Lạp.
- source_word: λέγων
  choice: và nói
  rationale: Chuyển phân từ sang động từ phối hợp để câu tiếng Việt tự nhiên, đồng thời vẫn giới thiệu nguyên vẹn nội dung lời nói.
- source_word: Ἐντραπήσονται
  choice: Họ sẽ kính trọng
  rationale: Với tân ngữ trực tiếp “con trai ta”, động từ mang nghĩa tỏ lòng tôn trọng hoặc nể trọng. “Kính trọng” trang trọng nhưng hiện đại, không hàm ý thờ phượng.
- source_word: τὸν υἱόν μου
  choice: con trai ta
  rationale: Giữ nguyên quan hệ cá nhân trong lời trực tiếp; “ta” phù hợp lời của người chủ trong văn kể trang trọng.
theological_decisions:
- issue: Cách gọi người con trong dụ ngôn mà không diễn giải quá mức hàm ý Kitô học
  choice: con trai mình / con trai ta
  alternative: Con; người con yêu dấu
  rationale: υἱός ở đây là danh từ quan hệ thông thường, không có ἀγαπητός và bản thân tiếng Hy Lạp không đòi hỏi cách trình bày như một tước hiệu. Bản dịch để hàm ý về Chúa Giê-su phát sinh từ văn cảnh thay vì được chèn vào câu.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “ông” cho chủ vườn theo mạch dụ ngôn, “ta” trong lời trực tiếp, và đặt dấu chú thích [a] ngay sau câu được chú giải.
