id: MAT.21.12
reference: Matthew 21:12
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Καὶ εἰσῆλθεν ⸀Ἰησοῦς εἰς τὸ ⸀ἱερόν, καὶ ἐξέβαλεν πάντας τοὺς πωλοῦντας καὶ ἀγοράζοντας ἐν τῷ ἱερῷ καὶ τὰς τραπέζας τῶν κολλυβιστῶν κατέστρεψεν καὶ τὰς καθέδρας τῶν πωλούντων τὰς περιστεράς,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/012.yaml
  text: And Jesus entered the temple courts and drove out all those selling and buying in the temple courts[a], and he overturned the tables of the money changers and the seats of those selling doves.
translation:
  language: vi
  text: Rồi Đức Giê-su vào khuôn viên đền thờ và đuổi tất cả những người bán và mua ở đó ra ngoài.[a] Ngài lật đổ bàn của những người đổi tiền và ghế của những người bán bồ câu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “đền thờ” hoặc “khu vực đền thờ”; từ Hy Lạp chỉ toàn bộ khu phức hợp đền thờ, chứ không riêng nơi thánh bên trong.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἱερόν
  choice: khuôn viên đền thờ
  rationale: Từ này chỉ toàn bộ khu đền thờ, không riêng nơi thánh bên trong (ναός). Cách dịch này vừa tự nhiên trong tiếng Việt vừa xác định đúng không gian diễn ra việc mua bán.
- source_word: ἐξέβαλεν
  choice: đuổi ... ra ngoài
  rationale: Diễn đạt hành động trục xuất dứt khoát, mạnh mẽ bằng tiếng Việt hiện đại mà không cường điệu thành bạo lực không được câu văn nói rõ.
- source_word: πάντας
  choice: tất cả
  rationale: Giữ rõ phạm vi bao quát của từ Hy Lạp đối với những người đang mua và bán.
- source_word: τοὺς πωλοῦντας καὶ ἀγοράζοντας
  choice: những người mua bán
  rationale: Cách nói tự nhiên trong tiếng Việt bao gồm cả hai nhóm đang bán và đang mua; đảo thứ tự thành cụm quen dùng “mua bán” không làm thay đổi ý nghĩa.
- source_word: τράπεζας
  choice: bàn
  rationale: Giữ nghĩa thông thường của danh từ; ngữ cảnh cho biết đây là bàn dùng cho việc đổi tiền.
- source_word: κολλυβιστῶν
  choice: những người đổi tiền
  rationale: Chỉ những người làm việc trao đổi tiền xu; cách dịch rõ nghĩa và phù hợp với bối cảnh đền thờ.
- source_word: κατέστρεψεν
  choice: lật đổ
  rationale: Trong ngữ cảnh đồ đạc, động từ nói đến việc lật nhào bàn và ghế, không nhất thiết hàm ý phá hủy chúng.
- source_word: καθέδρας
  choice: ghế
  rationale: Tương đương trực tiếp, tự nhiên với danh từ chỉ chỗ ngồi.
- source_word: περιστεράς
  choice: bồ câu
  rationale: Từ Hy Lạp có thể chỉ dove hoặc pigeon; “bồ câu” là tên gọi phổ thông trong tiếng Việt và phù hợp với bối cảnh lễ vật.
theological_decisions:
- issue: Phạm vi của ἱερόν trong hành động của Đức Giê-su
  choice: Đức Giê-su vào khuôn viên đền thờ, không nhất thiết vào nơi thánh bên trong.
  alternative: Dịch chung là “đền thờ” mà không xác định khu vực.
  rationale: Phân biệt ἱερόν với ναός giúp phản ánh chính xác không gian lịch sử của sự việc và tránh gợi ý rằng Ngài đã vào chính điện; cách dịch không thêm một kết luận giáo lý nào.
translation_notes:
  register: Văn phong kể chuyện trang trọng, rõ ràng và hiện đại. Dùng “Đức Giê-su” và đại từ “Ngài” để giữ sắc thái tôn kính phổ thông; câu được tách làm hai để dễ đọc. Dấu chú thích [a] đặt ngay sau mệnh đề liên quan đến địa điểm.
