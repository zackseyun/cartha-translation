  text: καὶ καταλιπὼν αὐτοὺς ἐξῆλθεν ἔξω τῆς πόλεως εἰς Βηθανίαν, καὶ ηὐλίσθη ἐκεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/017.yaml
  text: And leaving them[a], he went out of the city to Bethany and stayed there overnight.
translation:
  language: vi
  text: Rồi Ngài rời họ, ra khỏi thành đến Bê-tha-ni và nghỉ đêm tại đó.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “trú lại tại đó” hoặc “qua đêm tại đó.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καταλιπὼν αὐτοὺς
  choice: rời họ
  rationale: Phân từ bất định chỉ hành động xảy ra trước động từ chính; cách diễn đạt này tự nhiên trong tiếng Việt và giữ nguyên đại từ chỉ những người vừa được nhắc đến trong văn cảnh.
- source_word: ἐξῆλθεν ἔξω τῆς πόλεως
  choice: ra khỏi thành
  rationale: Diễn đạt rõ chuyển động từ bên trong ra bên ngoài thành, đồng thời tránh lặp ý vụng về trong tiếng Việt.
- source_word: εἰς Βηθανίαν
  choice: đến Bê-tha-ni
  rationale: Giới từ εἰς chỉ hướng đến một địa điểm; “đến” là cách nói tự nhiên trong tiếng Việt.
- source_word: ηὐλίσθη ἐκεῖ
  choice: nghỉ đêm tại đó
  rationale: Động từ αὐλίζομαι trong ngữ cảnh này có nghĩa là trú hoặc qua đêm; “nghỉ đêm tại đó” rõ nghĩa, tự nhiên và giữ sắc thái thời gian.
theological_decisions: []
