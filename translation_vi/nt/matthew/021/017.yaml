  register: Tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Ngài” để chỉ Đức Giê-su theo chủ thể đã rõ trong văn cảnh; không thêm cách giải thích thần học ngoài nguyên văn.
