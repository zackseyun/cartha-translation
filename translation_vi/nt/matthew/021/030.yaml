  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸂προσελθὼν δὲ⸃ τῷ ⸀δευτέρῳ εἶπεν ὡσαύτως· ὁ δὲ ἀποκριθεὶς εἶπεν· ⸂Ἐγώ, κύριε· καὶ οὐκ⸃ ἀπῆλθεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/030.yaml
  text: Then he came to the second and said the same[a]. And he answered, ‘I will[b], sir,’ but he did not go.
translation:
  language: vi
  text: 'Rồi ông đến chỗ người con thứ hai và cũng nói như vậy. Người ấy đáp: “Con sẽ đi,[a] thưa cha,”[b] nhưng lại không đi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn chỉ có đại từ nhấn mạnh “Con”, một lời đáp tỉnh lược mang nghĩa “Con sẽ đi”.
    reason: lexical_alternative
  - marker: b
    text: Từ Hy Lạp κύριε cũng có thể dịch là “thưa ngài” hoặc “thưa chủ”; ở đây người con dùng từ ấy để kính cẩn thưa với cha mình.
    reason: alternative_reading
lexical_decisions:
- source_word: προσελθὼν δὲ
  choice: Rồi ông đến chỗ
  rationale: Phân từ bất định của προσέρχομαι cùng δέ mở ra bước tiếp theo trong câu chuyện. “Rồi ông đến chỗ” tự nhiên trong tiếng Việt và diễn tả việc người cha đến gặp người con thứ hai.
- source_word: τῷ δευτέρῳ
  choice: người con thứ hai
  rationale: Nguyên văn chỉ nói “người thứ hai”, nhưng danh từ “con” được hiểu rõ từ ngữ cảnh trực tiếp; bổ sung từ này giúp câu tiếng Việt rõ và tự nhiên.
- source_word: ὡσαύτως
  choice: cũng nói như vậy
  rationale: Chỉ việc người cha đưa ra cùng một lời sai bảo như với người con trước.
- source_word: ἀποκριθεὶς εἶπεν
  choice: đáp
  rationale: Cụm Hy Lạp theo nghĩa đen là “trả lời, người ấy nói”; “đáp” chuyển tải tự nhiên mà không lặp ý trong tiếng Việt.
- source_word: Ἐγώ
  choice: Con sẽ đi
  rationale: Nguyên văn chỉ có đại từ nhấn mạnh “con/tôi”, là một lời đáp tỉnh lược bày tỏ sự đồng ý đi làm. Tiếng Việt cần làm rõ động từ được ngầm hiểu; chú thích bảo tồn hình thức nguyên văn.
- source_word: κύριε
  choice: thưa cha
  rationale: κύριε là lời xưng hô kính trọng. Trong ngữ cảnh, người nói đang thưa với cha mình; “thưa cha” tự nhiên, giữ sắc thái kính trọng và tránh tạo hàm ý thần học không có trong câu chuyện.
- source_word: καὶ οὐκ ἀπῆλθεν
  choice: nhưng lại không đi
  rationale: καί nối với mệnh đề phủ định để nêu kết quả trái ngược với lời hứa. “Nhưng lại” làm rõ sự tương phản vốn là điểm chính của câu.
theological_decisions:
- issue: Cách dịch κύριε khi người con thưa với cha
  choice: thưa cha
  alternative: thưa ngài; thưa chủ; lạy Chúa
  rationale: Ở đây κύριε không phải là tước hiệu dành cho Đức Chúa Trời hay Đấng Mê-si-a, mà là lời xưng hô kính trọng với người cha trong dụ ngôn. “Thưa cha” phù hợp quan hệ được ngữ cảnh xác định, đồng thời không áp đặt một cách hiểu mang tính thần học.
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Đại từ “ông” tiếp nối người cha trong ngữ cảnh; “người ấy” tránh lặp từ “con”. Dấu ngoặc kép cong và các ký hiệu chú thích được đặt ngay tại những cụm từ liên quan.
