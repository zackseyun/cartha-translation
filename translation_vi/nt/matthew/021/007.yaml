  source_fidelity: Bản nháp diễn đạt đúng việc họ đưa hai con vật đến và trải áo choàng lên chúng. Tuy nhiên, mệnh đề cuối đã lược bỏ hoàn toàn đại từ số nhiều αὐτῶν. Việc lược này làm mất sự mơ hồ cú pháp có chủ ý cần được giữ lại trong bản chính. Ngoài ra, “lừa mẹ” thêm quan hệ mẹ-con không được nêu trực tiếp trong câu này; “lừa cái” phản ánh giống cái mà không thêm quan hệ.
