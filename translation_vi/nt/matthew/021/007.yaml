  terminology: Nên dùng “con lừa cái” thay cho “lừa mẹ” để không diễn giải quá mức. “Lừa con” phù hợp cho πῶλον trong ngữ cảnh. “Áo choàng” là cách dịch tự nhiên của ἱμάτια.
