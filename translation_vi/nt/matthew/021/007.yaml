  text: ἤγαγον τὴν ὄνον καὶ τὸν πῶλον, καὶ ἐπέθηκαν ⸀ἐπ’ αὐτῶν τὰ ⸀ἱμάτια, καὶ ἐπεκάθισεν ἐπάνω αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/007.yaml
  text: They brought the donkey and the colt[a], and put their cloaks on them, and he sat on them.
translation:
  language: vi
  text: Họ dắt con lừa cái và lừa con đến, trải áo choàng của mình lên chúng, rồi Ngài ngồi lên trên chúng.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc, cụ thể hơn: “Ngài ngồi trên những áo choàng” đã được trải trên các con vật.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἤγαγον
  choice: dắt ... đến
  rationale: Động từ ἄγω có thể là “dẫn/dắt” hoặc “đem đến”; với động vật trong cảnh này, “dắt ... đến” vừa tự nhiên vừa diễn tả rõ hành động đưa chúng đến với Đức Giê-su.
- source_word: τὴν ὄνον
  choice: lừa mẹ
  rationale: Danh từ ὄνος chỉ con lừa; mạo từ giống cái và việc nó được đặt cạnh “lừa con” cho thấy đây là con mẹ. “Lừa mẹ” tự nhiên hơn “lừa cái” trong tiếng Việt và làm rõ quan hệ trong ngữ cảnh.
- source_word: τὸν πῶλον
  choice: lừa con
  rationale: πῶλος chỉ con vật non; trong ngữ cảnh đây là lừa non. “Lừa con” ngắn gọn, thông dụng và liên kết tự nhiên với “lừa mẹ”.
- source_word: ἐπέθηκαν ἐπ’ αὐτῶν τὰ ἱμάτια
  choice: trải áo choàng của mình lên cả hai
  rationale: ἱμάτια là những áo ngoài/áo choàng. Đại từ số nhiều αὐτῶν quy chiếu tự nhiên đến hai con vật; “cả hai” truyền đạt số nhiều rõ ràng. “Của mình” được bổ sung theo ngữ cảnh để chỉ áo của các môn đồ.
- source_word: ἐπεκάθισεν ἐπάνω αὐτῶν
  choice: Ngài ngồi lên trên
  rationale: Cụm tiếng Hy Lạp kết thúc bằng đại từ số nhiều có thể quy chiếu đến hai con vật hoặc những áo choàng. Tiếng Việt cho phép lược đại từ sau “trên”, nhờ đó câu tự nhiên và không tạo ấn tượng phi lý rằng Ngài ngồi đồng thời trên hai con vật; chú thích nêu rõ cách hiểu gần gũi về cú pháp và cảnh tượng.
theological_decisions:
- issue: Sở chỉ của đại từ số nhiều αὐτῶν trong ἐπεκάθισεν ἐπάνω αὐτῶν
  choice: Dịch “Ngài ngồi lên trên” và chú thích rằng có thể hiểu là ngồi trên những áo choàng đã trải trên các con vật.
  alternative: Dịch sát hình thức là “Ngài ngồi trên chúng”, hoặc xác định là Ngài ngồi trên một con vật.
  rationale: Đây là sự mơ hồ về cú pháp và trần thuật, không phải điểm giáo lý. Cách diễn đạt chính giữ tự nhiên trong tiếng Việt mà không xác quyết Ngài ngồi trên cả hai con vật; chú thích bảo tồn cách hiểu đại từ chỉ những áo choàng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” để chỉ Đức Giê-su theo ngữ cảnh tôn kính; “áo choàng” diễn đạt tự nhiên loại áo ngoài. Dấu chú thích [a] xuất hiện ngay sau mệnh đề có sự mơ hồ.
