id: MAT.21.27
reference: Matthew 21:27
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἀποκριθέντες τῷ Ἰησοῦ εἶπαν· Οὐκ οἴδαμεν. ἔφη αὐτοῖς καὶ αὐτός· Οὐδὲ ἐγὼ λέγω ὑμῖν ἐν ποίᾳ ἐξουσίᾳ ταῦτα ποιῶ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/027.yaml
  text: And answering Jesus, they said, “We do not know.” He also said to them, “Neither will I tell you by what authority I do these things.”
translation:
  language: vi
  text: 'Họ đáp lời Đức Giê-su rằng: “Chúng tôi không biết.” Người cũng nói với họ: “Tôi cũng không nói cho các ông biết tôi làm những việc này bằng thẩm quyền nào.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθέντες
  choice: đáp lời
  rationale: Phân từ dẫn vào câu trả lời của họ; “đáp lời” tự nhiên trong tiếng Việt và giữ rõ tính chất hồi đáp.
- source_word: Οὐκ οἴδαμεν
  choice: Chúng tôi không biết
  rationale: Chuyển tải trực tiếp lời phủ nhận sự hiểu biết; đại từ “chúng tôi” phù hợp lời của nhóm lãnh đạo nói với Đức Giê-su.
- source_word: ἔφη
  choice: nói
  rationale: Động từ phát ngôn thông dụng, trung tính, không thêm sắc thái diễn giải.
- source_word: καὶ αὐτός
  choice: Người cũng
  rationale: 'Giữ ý đáp lại tương ứng: sau câu trả lời của họ, chính Đức Giê-su cũng đưa ra lời đáp của mình.'
- source_word: Οὐδὲ ἐγὼ
  choice: Tôi cũng không
  rationale: Diễn đạt tự nhiên sự phủ định tương ứng trong tiếng Việt, không cần biến thì hiện tại của λέγω thành thì tương lai.
- source_word: λέγω ὑμῖν
  choice: nói cho các ông biết
  rationale: Trong ngữ cảnh từ chối tiết lộ thông tin, cách diễn đạt này tự nhiên hơn “nói với các ông” và vẫn bám sát nghĩa.
- source_word: ἐν ποίᾳ ἐξουσίᾳ
  choice: bởi thẩm quyền nào
  rationale: “Bởi” diễn tả căn cứ hoặc nguồn ủy quyền cho hành động; “thẩm quyền” giữ sắc thái về quyền chính đáng, không chỉ năng lực.
- source_word: ταῦτα
  choice: những việc này
  rationale: Giữ số nhiều của đại từ chỉ định và quy chiếu đến các hành động của Đức Giê-su đang bị chất vấn.
- source_word: ποιῶ
  choice: tôi làm
  rationale: Thì hiện tại được chuyển bằng hiện tại đơn tự nhiên, nói về các việc Đức Giê-su đang thực hiện trong bối cảnh.
theological_decisions:
- issue: Ý nghĩa của ἐξουσία trong lời đáp của Đức Giê-su
  choice: thẩm quyền
  alternative: quyền; quyền năng
  rationale: Trong cuộc tranh luận này, các lãnh đạo chất vấn căn cứ và tính chính đáng của hành động Đức Giê-su. “Thẩm quyền” giữ được sắc thái pháp lý và thần học mà không thu hẹp thành khả năng hay sức mạnh.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Đức Giê-su/Người” cho lời kể, “tôi” trong lời trực tiếp của Đức Giê-su, và “các ông” để phản ánh lời nói với nhóm nam lãnh đạo mà không tạo sắc thái kính trọng quá mức. Cấu trúc được điều chỉnh theo cú pháp tiếng Việt nhưng vẫn giữ quan hệ đáp lại và số nhiều của “những việc này”.
