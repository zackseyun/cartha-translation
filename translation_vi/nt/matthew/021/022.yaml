  text: καὶ πάντα ὅσα ⸀ἂν αἰτήσητε ἐν τῇ προσευχῇ πιστεύοντες λήμψεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/022.yaml
  text: And whatever you ask in prayer[a], believing[b], you will receive.
translation:
  language: vi
  text: Và bất cứ điều gì[a] anh em cầu xin khi cầu nguyện, với lòng tin[b], anh em sẽ nhận được.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “mọi điều anh em cầu xin” hoặc “tất cả những gì anh em cầu xin.”
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “trong khi tin tưởng”; phân từ Hy Lạp nói đến việc tin trong lúc cầu nguyện.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα ὅσα
  choice: bất cứ điều gì
  rationale: Cụm từ này là một cách diễn đạt bao quát, nghĩa là “bất cứ điều gì” hoặc “mọi điều mà.” Cách dịch đã chọn tự nhiên trong tiếng Việt và giữ nguyên phạm vi rộng của câu.
- source_word: ἂν αἰτήσητε
  choice: anh em cầu xin
  rationale: ἄν đi với động từ ở thể giả định tạo nên một mệnh đề quan hệ không xác định. Trong tiếng Việt, sắc thái ấy đã được thể hiện tự nhiên qua “bất cứ điều gì,” nên không cần thêm từ chỉ khả năng.
- source_word: ἐν τῇ προσευχῇ
  choice: khi cầu nguyện
  rationale: Cách diễn đạt này chuyển tải tự nhiên ý cầu xin trong lúc cầu nguyện; mạo từ Hy Lạp không đòi hỏi phải dịch thành một lời cầu nguyện xác định.
- source_word: πιστεύοντες
  choice: với lòng tin
  rationale: Phân từ hiện tại diễn tả việc tin diễn ra đồng thời với việc cầu xin. “Với lòng tin” giữ được mối liên hệ ấy mà không biến phân từ thành một mệnh đề điều kiện minh nhiên.
- source_word: λήμψεσθε
  choice: anh em sẽ nhận được
  rationale: Động từ tương lai được diễn đạt trực tiếp và trang trọng bằng “sẽ nhận được”; thể trung gian ở đây không cần biểu thị riêng trong tiếng Việt.
theological_decisions:
- issue: Mối liên hệ giữa lòng tin và lời cầu nguyện được đáp lại
  choice: Dịch phân từ πιστεύοντες là “với lòng tin,” gắn lòng tin với hành động cầu xin.
  alternative: “nếu anh em tin” hoặc “miễn là anh em tin”
  rationale: Nguyên văn dùng phân từ chứ không dùng một mệnh đề điều kiện minh nhiên. Cách dịch đã chọn giữ sự nhấn mạnh vào lòng tin nhưng không giải quyết thay cho bản văn những tranh luận thần học về cơ chế hoặc phạm vi của lời cầu nguyện được đáp lại.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Đại từ “anh em” phù hợp với lời Chúa Giê-su nói trực tiếp với các môn đồ. Cấu trúc giữ sự bao quát của lời hứa và không thêm một điều kiện minh nhiên ngoài hình thức phân từ của nguyên văn.
