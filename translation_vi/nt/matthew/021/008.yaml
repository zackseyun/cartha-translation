  text: ὁ δὲ πλεῖστος ὄχλος ἔστρωσαν ἑαυτῶν τὰ ἱμάτια ἐν τῇ ὁδῷ, ἄλλοι δὲ ἔκοπτον κλάδους ἀπὸ τῶν δένδρων καὶ ἐστρώννυον ἐν τῇ ὁδῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/008.yaml
  text: Most of the crowd spread their garments on the road[b][a], and others were cutting branches from the trees and spreading them on the road.
translation:
  language: vi
  text: Phần đông dân chúng trải áo mình trên đường[a], còn những người khác thì chặt cành cây và trải trên đường.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Phần lớn đám đông.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ πλεῖστος ὄχλος
  choice: Phần đông dân chúng
  rationale: πλεῖστος với danh từ tập hợp ὄχλος chỉ phần lớn hay đa số trong đám đông. “Phần đông dân chúng” tự nhiên, trang trọng vừa phải; δέ được thể hiện qua sự chuyển ý của câu, không cần thêm một từ nối đầu câu.
- source_word: ἔστρωσαν
  choice: trải
  rationale: Diễn tả việc trải hoặc đặt áo xuống mặt đường; “trải” ngắn gọn và phù hợp với cả hai lần dùng động từ cùng gốc trong câu.
- source_word: ἑαυτῶν τὰ ἱμάτια
  choice: áo mình
  rationale: ἱμάτια là áo quần, thường là áo khoác ngoài; đại từ phản thân ἑαυτῶν được biểu đạt tự nhiên bằng “mình”, cho thấy đó là áo của chính họ.
- source_word: ἐν τῇ ὁδῷ
  choice: trên đường
  rationale: Trong ngữ cảnh đặt vật lên bề mặt con đường, “trên đường” là cách nói tiếng Việt tự nhiên và chính xác.
- source_word: ἄλλοι δὲ
  choice: còn những người khác thì
  rationale: Thể hiện nhóm thứ hai trong đám đông và sắc thái chuyển tiếp nhẹ của δέ, không tạo đối lập quá mạnh.
- source_word: ἔκοπτον
  choice: chặt
  rationale: Động từ ở thể chưa hoàn thành mô tả hành động đang diễn ra; trong tiếng Việt, ngữ cảnh chuỗi hành động đã đủ chuyển tải diễn tiến mà không nhất thiết thêm “đang”.
- source_word: κλάδους ἀπὸ τῶν δένδρων
  choice: cành cây
  rationale: Cách nói gọn và tự nhiên trong tiếng Việt; động từ “chặt” đã hàm ý các cành được lấy từ cây.
- source_word: καὶ ἐστρώννυον
  choice: và trải
  rationale: Giữ sự lặp lại có chủ ý của động từ “trải” trong nguyên văn và nối hai hành động đang diễn ra của nhóm thứ hai.
theological_decisions: []
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang nghiêm nhưng dễ hiểu. Giữ hình ảnh cụ thể và sự lặp lại của “trải… trên đường”; không thêm ý nghĩa biểu tượng ngoài nguyên văn.
