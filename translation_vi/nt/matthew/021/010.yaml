source:
  edition: SBLGNT
  text: καὶ εἰσελθόντος αὐτοῦ εἰς Ἱεροσόλυμα ἐσείσθη πᾶσα ἡ πόλις λέγουσα· Τίς ἐστιν οὗτος;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/010.yaml
  text: And when he entered Jerusalem[a], the whole city was stirred up, saying, “Who is this?”
translation:
  language: vi
  text: 'Khi Ngài vào thành Giê-ru-sa-lem, cả thành đều xôn xao[a] và nói: “Người này là ai?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “rúng động.” Động từ Hy Lạp có thể chỉ sự rung chuyển về thể chất hoặc, như tại đây, sự náo động trong dân chúng.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσελθόντος αὐτοῦ
  choice: Khi Ngài vào
  rationale: Kết cấu sở hữu cách tuyệt đối diễn tả thời gian; cách dịch này tự nhiên trong tiếng Việt và không buộc phải hiểu là trước hay sau một khoảng thời gian đáng kể.
- source_word: Ἱεροσόλυμα
  choice: thành Giê-ru-sa-lem
  rationale: Dùng dạng phiên âm quen thuộc trong tiếng Việt; thêm “thành” để câu tự nhiên và làm rõ đây là địa danh đô thị.
- source_word: ἐσείσθη
  choice: xôn xao
  rationale: Động từ có nghĩa đen là “rung chuyển”, nhưng tại đây mô tả phản ứng náo động của dân chúng trong thành. “Xôn xao” truyền đạt nghĩa theo ngữ cảnh bằng tiếng Việt hiện đại, còn sắc thái hình ảnh được ghi ở chú thích.
- source_word: πᾶσα ἡ πόλις
  choice: cả thành
  rationale: Cách diễn đạt gọn, tự nhiên, giữ ý toàn thể của cụm từ Hy Lạp.
- source_word: λέγουσα
  choice: và nói
  rationale: Giữ sát động tính từ “nói”; nội dung trích dẫn tự cho thấy đây là một câu hỏi, nên không cần đổi thành “hỏi” trong chính văn.
- source_word: Τίς ἐστιν οὗτος;
  choice: Người này là ai?
  rationale: Cách hỏi tự nhiên trong tiếng Việt, không thêm danh từ xác định hơn mức nguyên bản.
theological_decisions:
- issue: Nghĩa đen hay nghĩa bóng trong phản ứng của cả thành
  choice: Dịch ἐσείσθη theo nghĩa bóng là “xôn xao”.
  alternative: “rúng động” hoặc “rung chuyển”
  rationale: Ngữ cảnh nói về phản ứng tập thể trước việc Ngài vào thành, chứ không trực tiếp kể một trận động đất. Chính văn ưu tiên nghĩa theo ngữ cảnh, còn chú thích bảo lưu hình ảnh mạnh của nguyên ngữ.
translation_notes:
  register: Văn phong trang trọng, sáng rõ và tự nhiên đối với độc giả tiếng Việt hiện đại. Đại từ “Ngài” tiếp nối chủ thể nam đã có trong văn cảnh mà không thêm danh xưng không hiện diện trong câu Hy Lạp.
