id: MAT.21.40
reference: Matthew 21:40
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὅταν οὖν ἔλθῃ ὁ κύριος τοῦ ἀμπελῶνος, τί ποιήσει τοῖς γεωργοῖς ἐκείνοις;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/040.yaml
  text: Therefore[a], when the owner of the vineyard comes[b], what will he do to those farmers?
translation:
  language: vi
  text: Vậy, khi chủ vườn nho[a] đến, ông sẽ làm gì với những người canh tác ấy[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hy Lạp kyrios thường được dịch là “Chúa” hoặc “chủ nhân”; tại đây, từ này chỉ người chủ của vườn nho trong dụ ngôn.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “những tá điền ấy”. Toàn cảnh dụ ngôn cho thấy họ thuê vườn nho để canh tác, nhưng bản thân từ Hy Lạp có nghĩa rộng hơn là “người canh tác”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν
  choice: khi
  rationale: Kết hợp với động từ giả định ἔλθῃ để chỉ thời điểm được dự liệu trong câu chuyện; “khi” tự nhiên hơn “mỗi khi” vì không nói đến hành động lặp lại.
- source_word: οὖν
  choice: vậy
  rationale: Diễn tả sự suy ra hoặc chuyển sang câu hỏi phát sinh từ diễn biến trước đó của dụ ngôn.
- source_word: ἔλθῃ
  choice: đến
  rationale: Động từ ἔρχομαι ở thể giả định sau ὅταν được diễn đạt tự nhiên bằng “đến” trong mệnh đề thời gian hướng về tương lai.
- source_word: κύριος
  choice: chủ
  rationale: Trong ngữ cảnh dụ ngôn, từ này chỉ người có quyền sở hữu vườn nho, không trực tiếp được dùng như tước hiệu thần học “Chúa”.
- source_word: ἀμπελῶνος
  choice: vườn nho
  rationale: Cách dịch thông dụng và chính xác của ἀμπελών trong bối cảnh nông nghiệp.
- source_word: τί ποιήσει
  choice: sẽ làm gì
  rationale: Giữ nguyên hình thức câu hỏi về hành động trong tương lai; cụm “với” diễn đạt tự nhiên đối tượng ở cách dữ liệu.
- source_word: γεωργοῖς
  choice: những người canh tác
  rationale: γεωργός có nghĩa rộng là người làm nghề trồng trọt hoặc canh tác. Cách dịch này không đưa ý thuê đất vốn chỉ được xác định rõ hơn nhờ toàn bộ ngữ cảnh.
- source_word: ἐκείνοις
  choice: ấy
  rationale: 'Giữ sắc thái xác định và hơi cách biệt của đại từ chỉ định: “những người canh tác ấy”.'
theological_decisions:
- issue: Cách dịch κύριος trong bối cảnh dụ ngôn
  choice: chủ
  alternative: Chúa; chủ nhân
  rationale: Ngữ cảnh trực tiếp nói về người sở hữu vườn nho trong câu chuyện. Dịch là “chủ” truyền đạt đúng vai trò này mà không biến từ ấy thành một tước hiệu thần học, đồng thời vẫn để ngỏ ý nghĩa biểu tượng của dụ ngôn.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “chủ vườn nho” và “người canh tác” để giữ sát vai trò trong câu chuyện mà không diễn giải quá mức; cấu trúc câu hỏi tự nhiên trong tiếng Việt.
