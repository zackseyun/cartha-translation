  revision_rationale: Chỉ điều chỉnh hai cụm từ để tiếng Việt hiện đại tự nhiên và chính xác hơn về quan hệ ngữ pháp, không thay đổi nghĩa, sắc thái đối chất, hay mức độ trang trọng của bản văn. Dấu chú thích vẫn được neo đúng sau “khuôn viên đền thờ.”
