id: MAT.21.23
reference: Matthew 21:23
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Καὶ ⸂ἐλθόντος αὐτοῦ⸃ εἰς τὸ ἱερὸν προσῆλθον αὐτῷ διδάσκοντι οἱ ἀρχιερεῖς καὶ οἱ πρεσβύτεροι τοῦ λαοῦ λέγοντες· Ἐν ποίᾳ ἐξουσίᾳ ταῦτα ποιεῖς; καὶ τίς σοι ἔδωκεν τὴν ἐξουσίαν ταύτην;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/023.yaml
  text: And when he came into the temple[a], the chief priests and the elders of the people came up to him while he was teaching and said, “By what authority are you doing these things? And who gave you this authority?”
translation:
  language: vi
  text: 'Khi Đức Giê-su vào khuôn viên đền thờ[a], các thượng tế và các trưởng lão của dân đến gặp Ngài lúc Ngài đang giảng dạy và hỏi: “Ông làm những việc này với thẩm quyền nào? Ai đã ban cho ông thẩm quyền ấy?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hy Lạp ἱερόν chỉ toàn bộ khuôn viên đền thờ, chứ không riêng nơi thánh bên trong.
    reason: cultural_note
lexical_decisions:
- source_word: ἐλθόντος αὐτοῦ
  choice: Khi Đức Giê-su vào
  rationale: Cấu trúc sở hữu cách tuyệt đối mang ý nghĩa thời gian; “khi... vào” tự nhiên trong tiếng Việt và không xác định quá mức khoảng cách thời gian.
- source_word: ἱερὸν
  choice: khuôn viên đền thờ
  rationale: ἱερόν chỉ toàn bộ khu đền thờ, không riêng nơi thánh bên trong; cách dịch này làm rõ ngay phạm vi không gian.
- source_word: προσῆλθον αὐτῷ
  choice: đến gặp Ngài
  rationale: Diễn đạt tự nhiên hành động tiến đến gần Đức Giê-su để chất vấn.
- source_word: διδάσκοντι
  choice: lúc Ngài đang giảng dạy
  rationale: Phân từ hiện tại diễn tả hành động diễn ra đồng thời với việc các lãnh đạo đến gặp.
- source_word: οἱ ἀρχιερεῖς
  choice: các thượng tế
  rationale: Trong bối cảnh Đền Thờ thứ hai, số nhiều chỉ giới lãnh đạo tư tế, không phải nhiều người đồng thời giữ chức thượng tế tối cao.
- source_word: οἱ πρεσβύτεροι τοῦ λαοῦ
  choice: các trưởng lão trong dân
  rationale: Chỉ các vị lãnh đạo được công nhận trong dân; “trong dân” tự nhiên hơn mà vẫn giữ quan hệ của nguyên văn.
- source_word: Ἐν ποίᾳ ἐξουσίᾳ
  choice: Ông lấy thẩm quyền nào
  rationale: Cách hỏi tự nhiên trong tiếng Việt, thể hiện sự chất vấn về căn cứ hoặc sự ủy quyền hợp pháp cho hành động.
- source_word: ταῦτα ποιεῖς
  choice: mà làm những việc này
  rationale: Giữ số nhiều không xác định của ταῦτα và liên kết tự nhiên với câu hỏi về thẩm quyền.
- source_word: τίς σοι ἔδωκεν τὴν ἐξουσίαν ταύτην
  choice: Ai đã ban cho ông thẩm quyền ấy?
  rationale: Thì quá khứ của “đã ban” thể hiện hành động trao quyền; “ấy” quy chiếu tự nhiên về thẩm quyền vừa bị chất vấn.
theological_decisions:
- issue: Ý nghĩa của ἐξουσία trong lời chất vấn
  choice: thẩm quyền
  alternative: quyền; quyền hạn; năng lực
  rationale: Ngữ cảnh nhấn mạnh căn cứ chính đáng và nguồn ủy quyền cho việc Đức Giê-su hành động và giảng dạy, không chỉ nói đến sức mạnh; “thẩm quyền” giữ được cả sắc thái thể chế lẫn thần học mà không giải thích vượt quá câu.
- issue: Sắc thái xưng hô của các lãnh đạo với Đức Giê-su
  choice: ông / Ngài theo lời thoại và lời kể
  alternative: Thầy; Ngài xuyên suốt
  rationale: Nguyên văn dùng đại từ ngôi hai không kèm tước hiệu kính trọng. “Ông” trong lời chất vấn giữ được thái độ đối chất mà không thêm sự tôn kính; “Ngài” trong lời kể phù hợp văn phong Kinh Thánh tiếng Việt hiện đại.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Giê-su” trong lời kể; lời chất vấn dùng “ông” để phản ánh thái độ của các lãnh đạo mà không thêm tước hiệu không có trong nguyên văn. Dấu chú thích [a] xuất hiện ngay sau cụm từ liên quan.
