revisions:
- from: 'Ngài phán với họ: “Có lời chép rằng: ‘Nhà Ta sẽ được gọi là nhà cầu nguyện,’[a] nhưng các ngươi lại biến nơi ấy thành hang ổ của bọn cướp.”[b]'
  to: 'Ngài phán với họ: “Có chép rằng: ‘Nhà Ta sẽ được gọi là nhà cầu nguyện,’ nhưng các ngươi lại biến nó thành hang ổ của bọn cướp.”[a][b]'
  rationale: Chỉ điều chỉnh công thức dẫn trích dẫn cho tự nhiên hơn, thay «nơi ấy» bằng đại từ trực tiếp «nó» gần với αὐτόν, và chuyển neo chú thích liên văn bản đến cuối toàn bộ lời trích dẫn. Ý nghĩa của câu không thay đổi.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T05:41:12Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch truyền đạt đúng các yếu tố chính của bản Hy Lạp: lời nói ở hiện tại lịch sử, công thức trích dẫn Kinh Thánh, «nhà Ta», tương lai bị động «sẽ được gọi», sự đối lập với «nhưng», và hình ảnh «hang ổ của bọn cướp». «Biến nơi ấy thành» hiểu đúng ποιεῖτε ... σπήλαιον, dù «nơi ấy» diễn giải nhẹ đại từ αὐτόν.'
  naturalness: Văn phong nhìn chung trang trọng, rõ ràng và tự nhiên. «Có chép rằng» là công thức tiếng Việt gọn và thông dụng hơn «Có lời chép rằng». «Các ngươi» phù hợp sắc thái đối chất trong lối văn Kinh Thánh, dù có tính trang trọng.
  terminology: «Nhà Ta», «nhà cầu nguyện» và «hang ổ của bọn cướp» bảo tồn tốt âm hưởng của Ê-sai 56:7 và Giê-rê-mi 7:11. Không nên thay «nhà» bằng «đền thờ», vì nguyên văn trích dẫn dùng οἶκος. Chú thích từ vựng cần nêu «kẻ cướp/bọn cướp có vũ trang» như một khả năng, không biến đó thành nghĩa duy nhất.
  issues:
  - severity: low
    issue: Vị trí chú thích liên văn bản [a] chỉ được đặt sau nửa đầu câu trích dẫn.
    rationale: Chú thích nói rằng câu này kết hợp cả Ê-sai 56:7 lẫn Giê-rê-mi 7:11; vì vậy nên đặt sau toàn bộ lời trích dẫn để neo chú thích cho cả hai vế.
  - severity: low
    issue: «Có lời chép rằng» hơi nặng so với công thức tiếng Việt thông dụng.
    rationale: «Có chép rằng» vẫn truyền đạt Γέγραπται, đồng thời tự nhiên và súc tích hơn.
