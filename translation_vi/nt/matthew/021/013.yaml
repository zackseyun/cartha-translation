source:
  edition: SBLGNT
  text: καὶ λέγει αὐτοῖς· Γέγραπται· Ὁ οἶκός μου οἶκος προσευχῆς κληθήσεται, ὑμεῖς δὲ αὐτὸν ⸀ποιεῖτε σπήλαιον λῃστῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/013.yaml
  text: And he says to them[a], “It is written[b], ‘My house will be called a house of prayer,’ but you are making it a den of robbers.”
translation:
  language: vi
  text: 'Ngài phán với họ: “Có chép rằng: ‘Nhà Ta sẽ được gọi là nhà cầu nguyện,’ nhưng các ngươi lại biến nó thành hang ổ của bọn cướp.”[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Chúa Giê-su kết hợp Ê-sai 56:7 với Giê-rê-mi 7:11.
    reason: cross_reference
  - marker: b
    text: Cũng có thể dịch là “bọn cướp có vũ trang.” Từ Hy Lạp có thể chỉ kẻ cướp hoặc những toán cướp hung bạo.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: Ngài phán
  rationale: Động từ hiện tại lịch sử của Hy Lạp được diễn đạt bằng cấu trúc không đánh dấu thì trong tiếng Việt, vừa tự nhiên vừa giữ sắc thái kể chuyện sống động.
- source_word: Γέγραπται
  choice: Có lời chép rằng
  rationale: Công thức quen thuộc khi dẫn Kinh Thánh, thể hiện lời đã được chép và vẫn có hiệu lực.
- source_word: οἶκός μου
  choice: Nhà Ta
  rationale: Giữ hình ảnh ‘nhà’ của nguyên văn và lời trích dẫn, thay vì diễn giải hẹp hơn thành ‘đền thờ’.
- source_word: οἶκος προσευχῆς
  choice: nhà cầu nguyện
  rationale: Cách nói ngắn gọn, tự nhiên, đồng thời giữ cấu trúc và âm hưởng của Ê-sai 56:7.
- source_word: κληθήσεται
  choice: sẽ được gọi là
  rationale: Thể hiện trực tiếp thì tương lai và thể bị động của động từ Hy Lạp.
- source_word: ποιεῖτε
  choice: lại biến nơi ấy thành
  rationale: Diễn đạt tự nhiên hành động đang xảy ra trong ngữ cảnh; ‘lại’ làm rõ sự tương phản do δέ đánh dấu mà không thêm một kết luận thần học.
- source_word: σπήλαιον
  choice: hang ổ
  rationale: ‘Hang ổ’ truyền đạt hình ảnh một hang dùng làm nơi ẩn náu của kẻ cướp, tự nhiên hơn ‘hang’ đứng riêng trong tiếng Việt.
- source_word: λῃστῶν
  choice: bọn cướp
  rationale: Cách tương đương thông dụng, giữ lời tố cáo mạnh; từ Hy Lạp cũng có thể chỉ những kẻ cướp có vũ trang.
theological_decisions:
- issue: Lời trích dẫn và ám chỉ Cựu Ước
  choice: Giữ các cụm ‘Nhà Ta sẽ được gọi là nhà cầu nguyện’ và ‘hang ổ của bọn cướp’ để mối liên hệ với Ê-sai 56:7 và Giê-rê-mi 7:11 vẫn nhận ra được.
  alternative: Diễn ý tự do bằng ngôn ngữ hiện đại nhưng làm mờ các liên hệ liên văn bản.
  rationale: Lời của Chúa Giê-su kết hợp lời Kinh Thánh và ám chỉ lời tiên tri; giữ hình ảnh và cấu trúc cốt lõi giúp người đọc thấy được nền tảng Kinh Thánh mà không áp đặt cách giải nghĩa riêng.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại. ‘Ngài phán’ phù hợp ngữ cảnh lời nói có thẩm quyền; ‘các ngươi’ duy trì lời đối chất trực tiếp và mạnh, còn ‘nơi ấy’ tránh lặp đại từ thiếu tự nhiên khi quy chiếu về ‘nhà’ trong tiếng Việt.
