id: MAT.21.36
reference: Matthew 21:36
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: πάλιν ἀπέστειλεν ἄλλους δούλους πλείονας τῶν πρώτων, καὶ ἐποίησαν αὐτοῖς ὡσαύτως.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/036.yaml
  text: Again he sent other servants[a], more than the first ones, and they did the same to them.
translation:
  language: vi
  text: Ông lại sai những đầy tớ khác[a] đi, đông hơn nhóm trước, và họ cũng đối xử với những người ấy như vậy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “những nô lệ khác”. Từ Hy Lạp doulos có thể có nghĩa là “đầy tớ” hoặc “nô lệ”, tùy ngữ cảnh.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν
  choice: lại
  rationale: Diễn tả hành động được lặp lại trong mạch kể; “lại” ngắn gọn và tự nhiên trong tiếng Việt.
- source_word: ἀπέστειλεν
  choice: sai ... đi
  rationale: Động từ ἀποστέλλω chỉ việc phái người đi làm nhiệm vụ; “sai ... đi” phù hợp với quan hệ giữa chủ và đầy tớ trong dụ ngôn.
- source_word: ἄλλους δούλους
  choice: những đầy tớ khác
  rationale: δοῦλος có thể chỉ đầy tớ hoặc nô lệ. Trong ngữ cảnh này, vai trò những người được chủ sai đi nổi bật hơn địa vị pháp lý của họ; “đầy tớ” tự nhiên, chính xác và giữ được sắc thái quan hệ phục vụ.
- source_word: πλείονας τῶν πρώτων
  choice: đông hơn nhóm trước
  rationale: Cấu trúc so sánh cho biết số người trong lần sai phái sau nhiều hơn lần đầu; “đông hơn nhóm trước” diễn đạt rõ sự so sánh về số lượng.
- source_word: ἐποίησαν αὐτοῖς ὡσαύτως
  choice: họ cũng đối xử với những người ấy như vậy
  rationale: Cụm từ quy chiếu về cách các tá điền đã hành xử với nhóm đầy tớ trước. “Đối xử ... như vậy” tự nhiên trong tiếng Việt và để nội dung cụ thể được hiểu từ câu trước.
theological_decisions:
- issue: Cách dịch δοῦλος trong dụ ngôn
  choice: đầy tớ
  alternative: nô lệ
  rationale: Nguyên ngữ có thể mang cả hai nghĩa. Ở đây trọng tâm là những người thuộc quyền chủ và được chủ sai đi, chứ không nhấn mạnh địa vị pháp lý; vì vậy chọn “đầy tớ”, đồng thời ghi nhận “nô lệ” trong chú thích.
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “ông” theo chủ thể của dụ ngôn được tiếp nối từ ngữ cảnh; “nhóm trước” làm rõ rằng phép so sánh πλείονας nói về số lượng người.
