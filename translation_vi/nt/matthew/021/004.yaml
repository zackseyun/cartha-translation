  yaml_path: translation/nt/matthew/021/004.yaml
  text: 'This happened so that what was spoken through the prophet might be fulfilled[a], saying:'
translation:
  language: vi
  text: 'Việc này đã xảy ra để lời đã được phán qua nhà tiên tri[a] được ứng nghiệm, rằng:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “bởi nhà tiên tri.” Nguyên văn Hy Lạp sát hơn là “qua nhà tiên tri,” nhấn mạnh vai trò trung gian của người ấy trong việc truyền đạt lời.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῦτο
  choice: Việc này
  rationale: Đại từ chỉ định trung tính số ít quy chiếu toàn bộ sự việc vừa được kể; “Việc này” tự nhiên và rõ nghĩa trong tiếng Việt.
- source_word: δὲ
  choice: không dịch thành một từ riêng
  rationale: Ở đây δέ chỉ có chức năng nối tiếp nhẹ trong mạch kể, không biểu thị sự đối lập rõ; tiếng Việt không cần thêm “nhưng” hay “bấy giờ”.
- source_word: γέγονεν
  choice: xảy ra
  rationale: Thì hoàn thành của γίνομαι trong công thức ứng nghiệm chỉ sự việc đã diễn ra và có ý nghĩa hiện tại; “xảy ra” là cách diễn đạt hiện đại, tự nhiên.
- source_word: ἵνα
  choice: để
  rationale: Giữ được sắc thái mục đích/kết quả của công thức ứng nghiệm mà vẫn gọn và tự nhiên.
- source_word: πληρωθῇ
  choice: được ứng nghiệm
  rationale: Thể bị động được giữ lại; “ứng nghiệm” là cách diễn đạt quen thuộc cho lời tiên tri trở thành hiện thực.
- source_word: τὸ ῥηθὲν
  choice: lời đã được phán
  rationale: Diễn đạt danh hóa phân từ bị động, đồng thời giữ sắc thái trang trọng của lời được công bố trước đó.
- source_word: διὰ τοῦ προφήτου
  choice: qua vị tiên tri
  rationale: διά với sở hữu cách diễn tả sự trung gian; “qua” giữ rõ ý lời được truyền đạt qua vị tiên tri, thay vì chỉ xem vị ấy là nguồn tự thân của lời nói.
- source_word: λέγοντος
  choice: rằng
  rationale: Phân từ này dẫn vào lời trích dẫn tiếp theo; “rằng” là lối dẫn lời súc tích và tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Công thức ứng nghiệm và vai trò trung gian của vị tiên tri
  choice: “lời đã được phán qua vị tiên tri ... được ứng nghiệm”
  alternative: “lời vị tiên tri đã nói ... được ứng nghiệm” hoặc “lời đã được phán bởi vị tiên tri ... được ứng nghiệm”
  rationale: Bản dịch giữ cấu trúc bị động và giới từ “qua”, qua đó bảo toàn sắc thái lời có nguồn vượt quá vị tiên tri và được truyền đạt qua người ấy, nhưng không thêm chủ thể vốn không được nêu trực tiếp trong câu Hy Lạp.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “vị tiên tri” để chỉ nhân vật xác định mà không quá cổ kính; giữ dấu hai chấm vì câu tiếp theo là lời trích dẫn.
