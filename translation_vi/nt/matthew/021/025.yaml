  source_fidelity: Bản dịch truyền đạt đúng câu hỏi về nguồn gốc/thẩm quyền của phép báp-têm của Giăng, đối lập “từ trời” với “từ loài người,” cũng như sự bàn tính của họ và câu hỏi kết luận. Tuy nhiên, ἐρεῖ ἡμῖν nghĩa là “sẽ nói với chúng ta,” không phải trực tiếp là “sẽ hỏi chúng ta.” Dù lời nói được trích dẫn có hình thức câu hỏi, động từ nguồn cần được giữ trong bản dịch tối ưu-tương-đương.
  naturalness: Văn phong tự nhiên, hiện đại và trang trọng vừa phải. “Bàn luận với nhau” phù hợp với ngữ cảnh họ cân nhắc chung. “Từ loài người” rõ nghĩa và tránh sắc thái giới tính không có trong ἀνθρώπων. Thay “sẽ hỏi chúng ta” bằng “sẽ nói với chúng ta” vẫn tự nhiên vì câu trích dẫn ngay sau đó cho thấy nội dung lời nói.
  terminology: “Phép báp-têm,” “Giăng,” “từ trời,” và “từ loài người” nhất quán với thuật ngữ Cơ Đốc giáo tiếng Việt và sát nguyên văn. Chú thích giải thích đúng lối nói kính cẩn “từ trời” mà không thay thế cách nói này trong chính văn.
