id: MAT.21.25
reference: Matthew 21:25
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: τὸ βάπτισμα ⸀τὸ Ἰωάννου πόθεν ἦν; ἐξ οὐρανοῦ ἢ ἐξ ἀνθρώπων; οἱ δὲ διελογίζοντο ⸀ἐν ἑαυτοῖς λέγοντες· Ἐὰν εἴπωμεν· Ἐξ οὐρανοῦ, ἐρεῖ ἡμῖν· Διὰ τί οὖν οὐκ ἐπιστεύσατε αὐτῷ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/025.yaml
  text: The baptism of John—from where was it? From heaven or from men? And they were reasoning among themselves[a], saying, “If we say, ‘From heaven,’ he will say to us[b], ‘Why then did you not believe him?’”
translation:
  language: vi
  text: 'Phép báp-têm của Giăng đến từ đâu? Từ trời hay từ loài người?[a] Họ bàn luận với nhau rằng: “Nếu chúng ta nói: ‘Từ trời,’ ông ấy sẽ nói với chúng ta: ‘Vậy tại sao các ông không tin Giăng?’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Từ trời” là lối nói kính cẩn chỉ nguồn gốc hoặc thẩm quyền đến từ Đức Chúa Trời; “từ loài người” chỉ nguồn gốc thuần túy con người.
    reason: lexical_alternative
lexical_decisions:
- source_word: βάπτισμα
  choice: phép báp-têm
  rationale: Chỉ nghi thức và công việc làm báp-têm gắn với Giăng; cách gọi này đã quen thuộc trong tiếng Việt Cơ Đốc và phân biệt với việc tắm rửa thông thường.
- source_word: τὸ Ἰωάννου
  choice: của Giăng
  rationale: Sở hữu cách xác định phép báp-têm gắn với Giăng; cấu trúc “của Giăng” tự nhiên và sát nguồn.
- source_word: πόθεν ἦν
  choice: đến từ đâu
  rationale: Diễn đạt tự nhiên câu hỏi về nguồn gốc hoặc thẩm quyền, thay vì hỏi địa điểm đơn thuần.
- source_word: ἐξ οὐρανοῦ
  choice: từ trời
  rationale: Giữ nguyên hình ảnh của tiếng Hy Lạp và lối nói kính cẩn chỉ nguồn gốc hay thẩm quyền từ Đức Chúa Trời.
- source_word: ἐξ ἀνθρώπων
  choice: từ loài người
  rationale: ἀνθρώπων chỉ con người nói chung, không riêng nam giới; “loài người” giữ rõ thế đối lập giữa nguồn gốc con người và nguồn gốc từ trời.
- source_word: διελογίζοντο ἐν ἑαυτοῖς
  choice: bàn luận với nhau
  rationale: Trong ngữ cảnh có lời đối đáp được thuật lại, cụm này mô tả sự cân nhắc, trao đổi giữa họ; cách dịch này tự nhiên hơn “lý luận trong chính họ”.
- source_word: Ἐὰν εἴπωμεν
  choice: Nếu chúng ta nói
  rationale: Thể hiện tự nhiên điều kiện giả định trong tiếng Việt.
- source_word: ἐρεῖ ἡμῖν
  choice: ông ấy sẽ hỏi chúng ta
  rationale: Động từ λέγω theo nghĩa đen là “nói”, nhưng câu trực tiếp theo sau là một câu hỏi; “sẽ hỏi” truyền đạt chức năng lời nói tự nhiên trong tiếng Việt.
- source_word: οὐκ ἐπιστεύσατε αὐτῷ
  choice: các ông không tin Giăng
  rationale: πιστεύω với đối tượng ở tặng cách có nghĩa là tin người ấy; lặp tên “Giăng” giúp tiếng Việt rõ đại từ chỉ ai mà không thay đổi đối tượng của câu.
theological_decisions:
- issue: Ý nghĩa của “từ trời”
  choice: Giữ “từ trời” trong chính văn
  alternative: từ Đức Chúa Trời
  rationale: Cụm từ Hy Lạp vừa giữ lối nói kính cẩn vừa nêu nguồn gốc hoặc thẩm quyền thần thượng; dịch thẳng tránh giải thích thay cho nguyên văn.
- issue: Sự đối lập giữa trời và con người
  choice: Dịch ἀνθρώπων là “loài người”
  alternative: người ta
  rationale: Ý đối lập là thẩm quyền từ Đức Chúa Trời hay chỉ từ con người, không phải sự phân biệt giới tính; “loài người” làm rõ phạm vi phổ quát.
- issue: Phạm vi của việc “tin Giăng”
  choice: Giữ động từ “tin” mà không giải thích thêm
  alternative: tin lời Giăng hoặc công nhận thẩm quyền của Giăng
  rationale: Nguyên văn có thể bao hàm cả việc tiếp nhận lời rao giảng lẫn thẩm quyền của Giăng; không nên thu hẹp sự căng thẳng này trong chính văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Giăng” theo hình thức tên gọi Kinh Thánh quen thuộc; dùng “các ông” trong lời chất vấn để thể hiện số nhiều và phù hợp bối cảnh tranh luận. Dấu chú thích [a] được đặt sau toàn bộ cặp đối lập mà chú thích giải nghĩa.
