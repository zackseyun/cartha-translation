id: MAT.21.9
reference: Matthew 21:9
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οἱ δὲ ὄχλοι οἱ προάγοντες ⸀αὐτὸν καὶ οἱ ἀκολουθοῦντες ἔκραζον λέγοντες· Ὡσαννὰ τῷ υἱῷ Δαυίδ· Εὐλογημένος ὁ ἐρχόμενος ἐν ὀνόματι κυρίου· Ὡσαννὰ ἐν τοῖς ὑψίστοις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/009.yaml
  text: And the crowds going ahead of him and those following were crying out[a], saying[c][b], “Hosanna to the Son of David! Blessed is the one who comes in the name of the Lord! Hosanna in the highest!”
translation:
  language: vi
  text: 'Đám đông đi trước Ngài và những người theo sau cứ lớn tiếng reo hô: “Hô-sa-na[a] cho Con Đa-vít[b]! Phước cho Đấng đến nhân danh Chúa[c]! Hô-sa-na ở nơi chí cao!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Hô-sa-na” là lời tung hô bắt nguồn từ tiếng Hê-bơ-rơ, có nghĩa gần như “xin cứu” hoặc “xin cứu ngay”; tại đây, lời ấy cũng được dùng như tiếng reo ca ngợi.
    reason: lexical_alternative
  - marker: b
    text: “Con Đa-vít” là tước hiệu hoàng gia chỉ Đấng Mê-si-a.
    reason: cultural_note
  - marker: c
    text: Câu này vọng lại Thi Thiên 118:26; tại đó, từ được dịch là “Chúa” đại diện cho danh YHWH trong bản Hê-bơ-rơ.
    reason: cross_reference
lexical_decisions:
- source_word: ὄχλοι
  choice: đám đông
  rationale: Diễn đạt tự nhiên một đoàn người đông đảo; số nhiều trong tiếng Hy Lạp được thể hiện qua hai nhóm đi trước và theo sau trong câu.
- source_word: προάγοντες αὐτόν
  choice: đi trước Ngài
  rationale: Mô tả những người di chuyển phía trước Chúa Giê-su trong đoàn rước mà không hàm ý họ chính thức dẫn đường.
- source_word: ἀκολουθοῦντες
  choice: những người theo sau
  rationale: Tạo thế đối xứng tự nhiên với “đi trước Ngài” và giữ rõ khung cảnh đoàn rước.
- source_word: ἔκραζον λέγοντες
  choice: cứ lớn tiếng reo hô
  rationale: “Cứ” thể hiện hành động kéo dài của thì chưa hoàn thành; “lớn tiếng reo hô” chuyển tải hành động kêu lớn mà không cần giữ từ “nói rằng” một cách nặng nề.
- source_word: Ὡσαννά
  choice: Hô-sa-na
  rationale: Giữ âm của lời tung hô mang nguồn gốc Hê-bơ-rơ vì trong ngữ cảnh này nó vừa có nền nghĩa cầu xin cứu giúp vừa hoạt động như tiếng reo ca ngợi.
- source_word: τῷ υἱῷ Δαυίδ
  choice: cho Con Đa-vít
  rationale: “Cho” phản ánh cách dùng tặng cách sau “Hô-sa-na”; “Con Đa-vít” giữ nguyên tước hiệu hoàng gia và Đấng Mê-si-a thay vì diễn giải ngay trong chính văn.
- source_word: Εὐλογημένος ὁ ἐρχόμενος
  choice: Phước cho Đấng đến
  rationale: Cách nói trang trọng, tự nhiên trong văn Kinh Thánh tiếng Việt và giữ tính xác định của phân từ danh từ hóa chỉ một nhân vật cụ thể.
- source_word: ἐν ὀνόματι κυρίου
  choice: nhân danh Chúa
  rationale: Thành ngữ tiếng Việt tự nhiên, bảo toàn ý đến với danh nghĩa hoặc thẩm quyền của Chúa và âm hưởng trích dẫn Thi Thiên.
- source_word: ἐν τοῖς ὑψίστοις
  choice: ở nơi chí cao
  rationale: Giữ cách diễn đạt cô đọng và tính mơ hồ của nguyên văn về cõi cao nhất, không tự ý thêm “các tầng trời”.
theological_decisions:
- issue: Tước hiệu Đấng Mê-si-a trong τῷ υἱῷ Δαυίδ
  choice: Giữ “Con Đa-vít” như một tước hiệu trong chính văn.
  alternative: Đấng Mê-si-a; hậu duệ vua Đa-vít
  rationale: Nguyên văn dùng chính tước hiệu gắn với Đa-vít; giữ nguyên giúp bảo toàn chiều kích lịch sử và thần học mà không thay bằng lời giải nghĩa.
- issue: Ý nghĩa của Ὡσαννά
  choice: Phiên âm “Hô-sa-na” trong chính văn và giải thích ở chú thích.
  alternative: Xin cứu chúng con; xin cứu ngay
  rationale: Trong biến cố này, từ ngữ vừa bắt nguồn từ lời cầu cứu vừa trở thành tiếng tung hô ca ngợi; phiên âm giữ được cả âm hưởng phụng vụ lẫn liên hệ Kinh Thánh.
- issue: κυρίου trong lời vọng lại Thi Thiên 118:26
  choice: Dịch κύριος là “Chúa”, đồng thời ghi chú nền văn bản Hê-bơ-rơ có danh YHWH.
  alternative: ĐỨC GIÊ-HÔ-VA; ĐỨC CHÚA
  rationale: Bản Hy Lạp hiện có dùng κύριος; chú thích cho biết nền Cựu Ước mà không thay thế từ ngữ của văn bản Tân Ước.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Dùng “Ngài” cho đại từ chỉ Chúa Giê-su; giữ “Hô-sa-na” và “Con Đa-vít” để bảo toàn âm hưởng nghi lễ cùng nội dung Đấng Mê-si-a. Cụm “ở nơi chí cao” cố ý không giải thích thành “trên các tầng trời cao nhất” nhằm tránh thu hẹp nét nghĩa của nguyên văn.
