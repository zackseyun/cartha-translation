- from: Vì Giăng đã đến với các ông theo con đường công chính[a], nhưng các ông không tin ông ấy[b]; còn những người thu thuế và các gái mại dâm thì tin ông ấy. Dù đã thấy điều đó, về sau các ông vẫn không đổi ý[c] để tin ông ấy.
  to: Vì Giăng đã đến với các ông trong đường công chính[a], nhưng các ông không tin ông ấy[b]; còn những người thu thuế và các gái mại dâm thì tin ông ấy. Nhưng các ông, dù đã thấy điều đó, vẫn không đổi ý[c] để tin ông ấy.
  rationale: Sửa “theo con đường công chính” thành “trong đường công chính” để giữ hình ảnh và ý nghĩa thành ngữ của ἐν ὁδῷ δικαιοσύνης, tránh cách hiểu về một tuyến đường vật lý. Thêm “Nhưng các ông” ở câu cuối để phản ánh tương phản nhấn mạnh trong tiếng Hy Lạp. Các chú thích vẫn neo đúng tại những cụm có phương án dịch đáng kể và bảo lưu sắc thái phân biệt giữa μεταμέλομαι với μετανοέω.
