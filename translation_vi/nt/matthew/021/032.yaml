  verdict: revise
  source_fidelity: 'Bản dịch giữ đúng các đối lập chính và dịch nhất quán πιστεύω + dative là “tin ông ấy.” Tuy nhiên, “đến với các ông theo con đường công chính” có thể dễ được hiểu là Giăng đi đến bằng một tuyến đường cụ thể. Cụm ἐν ὁδῷ δικαιοσύνης là thành ngữ/hình ảnh về đường lối, cách sống hoặc sứ điệp công chính; cần diễn đạt sao cho không nghiêng sang nghĩa lộ trình vật lý. Mệnh đề cuối nên biểu đạt rõ hơn lực đối lập và nhấn mạnh của ὑμεῖς δὲ ... οὐδὲ: họ đã thấy mà vẫn không đổi ý để tin ông ấy.'
  naturalness: “Các ông,” “người thu thuế,” “gái mại dâm,” và “đổi ý” phù hợp với tiếng Việt hiện đại, trang trọng và văn mạch đối thoại. “Nhưng các ông, dù đã thấy điều đó, vẫn không...” tự nhiên hơn khi phản ánh sự trách cứ đối nghịch ở câu cuối.
  terminology: '“Giăng,” “công chính,” “tin ông ấy,” “người thu thuế,” và “gái mại dâm” đều phù hợp. “Đường công chính” giữ được hình ảnh ὁδός và thuật ngữ δικαιοσύνη; chú thích cần tiếp tục bảo lưu hai khả năng: đường lối/chức vụ của Giăng và con đường ông công bố.'
  issues:
