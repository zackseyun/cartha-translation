id: MAT.21.32
reference: Matthew 21:32
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἦλθεν γὰρ ⸂Ἰωάννης πρὸς ὑμᾶς⸃ ἐν ὁδῷ δικαιοσύνης, καὶ οὐκ ἐπιστεύσατε αὐτῷ· οἱ δὲ τελῶναι καὶ αἱ πόρναι ἐπίστευσαν αὐτῷ· ὑμεῖς δὲ ἰδόντες ⸀οὐδὲ μετεμελήθητε ὕστερον τοῦ πιστεῦσαι αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/032.yaml
  text: For John came to you in the way of righteousness[a], and you did not believe him; but the tax collectors and the prostitutes believed him. But even after seeing this[c][b], you did not afterward change your minds so as to believe him.
translation:
  language: vi
  text: Vì Giăng đã đến với các ông trong đường công chính[a], nhưng các ông không tin ông ấy[b]; còn những người thu thuế và các gái mại dâm thì tin ông ấy. Nhưng các ông, dù đã thấy điều đó, vẫn không đổi ý[c] để tin ông ấy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “một cách công chính” hoặc “trên con đường công chính.” Cụm từ Hy Lạp có thể nói về đường lối sống và chức vụ của Giăng, hoặc về con đường công chính mà ông rao giảng.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “tin cậy ông ấy.” Động từ Hy Lạp có thể mang nghĩa tin điều một người nói hoặc đặt lòng tin nơi người ấy.'
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể dịch: “vẫn không hối hận” hoặc “vẫn không ăn năn.” Ở đây bản văn dùng μεταμέλομαι, từ nhấn mạnh việc đổi ý hoặc hối tiếc, chứ không dùng động từ μετανοέω thường được dịch là “ăn năn.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθεν γὰρ
  choice: Vì ... đã đến
  rationale: “Vì” thể hiện quan hệ giải thích của γάρ với lời quở trách ngay trước đó; “đã đến” diễn đạt tự nhiên động từ aorist ἦλθεν.
- source_word: Ἰωάννης πρὸς ὑμᾶς
  choice: Giăng đã đến với các ông
  rationale: “Giăng” là dạng tên quen thuộc trong truyền thống Kinh Thánh tiếng Việt; “đến với các ông” giữ hướng chuyển động và đối tượng được nói đến của πρός với đối cách.
- source_word: ἐν ὁδῷ δικαιοσύνης
  choice: theo con đường công chính
  rationale: Giữ hình ảnh “con đường” của ὁδός và ý nghĩa đạo đức, phù hợp với Đức Chúa Trời của δικαιοσύνη; “theo” tự nhiên trong tiếng Việt và không buộc cụm từ chỉ riêng nếp sống hay sứ điệp của Giăng.
- source_word: οὐκ ἐπιστεύσατε αὐτῷ / ἐπίστευσαν αὐτῷ
  choice: không tin ông ấy / tin ông ấy
  rationale: Giữ nhất quán hai lần πιστεύω với đại từ ở cách dữ; cách dịch này diễn tả việc tin người nói mà không thêm rõ “tin vào” hay “tin lời,” vốn không được nêu trực tiếp trong Hy Lạp.
- source_word: οἱ τελῶναι
  choice: những người thu thuế
  rationale: Cách gọi rõ ràng, hiện đại và trung tính về nghề nghiệp, đồng thời phù hợp với vị thế xã hội của nhóm này trong bối cảnh.
- source_word: αἱ πόρναι
  choice: các gái mại dâm
  rationale: Cách tương đương trực tiếp, dễ hiểu trong tiếng Việt hiện đại và giữ sức nặng xã hội—đạo đức của từ Hy Lạp.
- source_word: ἰδόντες
  choice: dù đã thấy điều đó
  rationale: Dịch phân từ aorist theo sắc thái nhượng bộ phù hợp với lời quở trách; “điều đó” chỉ sự kiện những người thu thuế và gái mại dâm đã tin Giăng.
- source_word: οὐδὲ μετεμελήθητε ὕστερον
  choice: về sau ... vẫn không đổi ý
  rationale: “Đổi ý” thể hiện sắc thái của μεταμέλομαι là thay đổi suy nghĩ hoặc hối tiếc, đồng thời “vẫn không” chuyển tải lực tăng tiến của οὐδέ trong ngữ cảnh.
- source_word: τοῦ πιστεῦσαι αὐτῷ
  choice: để tin ông ấy
  rationale: Diễn đạt kết quả hoặc mục đích gắn với sự đổi ý mà không xác quyết quá mức quan hệ cú pháp.
theological_decisions:
- issue: Ý nghĩa của δικαιοσύνη trong ἐν ὁδῷ δικαιοσύνης
  choice: công chính
  alternative: công lý; một cách ngay chính
  rationale: “Công chính” giữ trọng tâm đạo đức và sự phù hợp với ý muốn Đức Chúa Trời trong văn mạch Ma-thi-ơ; chú thích bảo lưu khả năng cụm từ mô tả nếp sống/chức vụ của Giăng hoặc con đường ông rao giảng.
- issue: Ý nghĩa của πιστεύω với αὐτῷ
  choice: tin ông ấy
  alternative: tin cậy ông ấy; tin lời ông ấy; tin vào ông ấy
  rationale: Bản văn nói đến phản ứng đối với Giăng và lời công bố của ông. “Tin ông ấy” giữ đối tượng là chính Giăng mà không nhập thêm công thức thần học “tin vào” hoặc biến đối tượng thành “lời” một cách minh nhiên.
- issue: Phân biệt μεταμέλομαι với μετανοέω
  choice: đổi ý
  alternative: ăn năn; hối hận
  rationale: “Đổi ý” bảo tồn nét nghĩa thay đổi suy nghĩ/hối tiếc của μεταμέλομαι và tránh đồng nhất hoàn toàn với thuật ngữ μετανοέω thường được dịch là “ăn năn.”
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. “Các ông” phù hợp với lời Đức Giê-su trực tiếp nói với các lãnh đạo tôn giáo trong ngữ cảnh. Cấu trúc đối lập được giữ rõ bằng “nhưng,” “còn ... thì,” và “dù ... vẫn.” Mọi chú thích đều có ký hiệu tương ứng trong chính văn.
