  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ λαβόντες οἱ γεωργοὶ τοὺς δούλους αὐτοῦ ὃν μὲν ἔδειραν, ὃν δὲ ἀπέκτειναν, ὃν δὲ ἐλιθοβόλησαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/035.yaml
  text: And the tenant farmers took his servants; one they beat[a], another they killed, and another they stoned.
translation:
  language: vi
  text: Các tá điền bắt những nô lệ[a] của ông; họ đánh người này, giết người kia và ném đá một người khác.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “đầy tớ”. Từ Hy Lạp doulos có thể chỉ “nô lệ” hoặc “đầy tớ”, tùy ngữ cảnh.
    reason: lexical_alternative
lexical_decisions:
- source_word: γεωργοὶ
  choice: các tá điền
  rationale: Trong bối cảnh dụ ngôn về vườn nho, từ này chỉ những người thuê đất để canh tác cho chủ; “tá điền” diễn đạt cả việc canh tác lẫn quan hệ thuê mướn.
- source_word: λαβόντες
  choice: bắt
  rationale: Ở đây hành động “bắt” dẫn trực tiếp đến việc hành hung và giết các sứ giả, nên tự nhiên và đúng sắc thái hơn cách dịch trung tính “tiếp nhận” hay “cầm lấy”.
- source_word: δούλους
  choice: nô lệ
  rationale: Từ Hy Lạp chỉ những người thuộc quyền chủ và được chủ sai đi. “Nô lệ” giữ rõ địa vị lệ thuộc, còn khả năng dịch là “đầy tớ” được ghi trong chú thích.
- source_word: ἔδειραν
  choice: đánh
  rationale: Diễn đạt tự nhiên nghĩa hành hung, nhưng không xác định quá mức phương thức như “đánh roi”.
- source_word: ἀπέκτειναν
  choice: giết
  rationale: Phản ánh trực tiếp động từ chỉ việc lấy mạng, không thêm sắc thái pháp lý như “xử tử”.
- source_word: ἐλιθοβόλησαν
  choice: ném đá
  rationale: Diễn đạt rõ hành động tấn công bằng đá; câu không nói rõ riêng người này có chết vì bị ném đá hay không.
- source_word: ὃν μὲν ... ὃν δὲ ... ὃν δὲ
  choice: người này ... người kia ... một người khác
  rationale: Cấu trúc phân phối này cho biết những nô lệ khác nhau bị đối xử theo những cách khác nhau; cách diễn đạt đã chọn tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Cách dịch δοῦλος trong câu chuyện dụ ngôn
  choice: nô lệ
  alternative: đầy tớ
  rationale: “Nô lệ” giữ địa vị lệ thuộc vốn có trong từ Hy Lạp và không làm nhẹ đi quan hệ sở hữu/quyền hành trong thế giới của dụ ngôn. Tuy vậy, “đầy tớ” vẫn là một khả năng theo ngữ cảnh và được nêu ở chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “tá điền” để diễn đạt chính xác quan hệ thuê đất; cấu trúc “người này… người kia…” giữ nhịp kể ngắn gọn của nguyên văn.
