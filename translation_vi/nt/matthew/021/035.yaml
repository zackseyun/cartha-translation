  terminology: “Nô lệ” là lựa chọn nhất quán với sắc thái địa vị lệ thuộc của δοῦλοι và với quyết định từ vựng trong hồ sơ tiếng Anh. Chú thích nêu “đầy tớ” như một khả năng theo ngữ cảnh là hữu ích, không làm thay đổi bản văn chính. Các thuật ngữ khác đều phù hợp.
