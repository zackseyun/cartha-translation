revisions:
- from: 'Nhưng khi các thượng tế và các kinh sư thấy những việc kỳ diệu Ngài đã làm, và thấy những trẻ em đang reo lớn trong khuôn viên đền thờ[a] rằng: “Hô-sa-na cho Con vua Đa-vít!”[b], thì họ phẫn nộ.'
  to: 'Nhưng khi các thượng tế và các kinh sư thấy những việc kỳ diệu Ngài đã làm, cùng những trẻ em lớn tiếng hô trong khuôn viên đền thờ[a]: “Hô-sa-na cho Con Đa-vít!”[b], thì họ phẫn nộ.'
  rationale: Bản sửa bỏ yếu tố “vua” được thêm vào tước hiệu “Con Đa-vít,” giữ sát tiếng Hy Lạp và cách dùng tước hiệu trong Ma-thi-ơ. Đồng thời, bản sửa dùng một động từ “thấy” cho hai đối tượng và chuyển hai hành động của trẻ em thành “lớn tiếng hô ...,” cho tiếng Việt tự nhiên hơn mà vẫn giữ đầy đủ nghĩa của κράζοντας và λέγοντας. Các neo chú thích vẫn đúng vị trí và nội dung chú thích vẫn phù hợp.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T05:41:10Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản nháp truyền đạt đúng thành phần chính của câu: các thượng tế và kinh sư thấy các việc kỳ diệu Đức Giê-su làm cùng các trẻ em tung hô trong khu đền thờ, rồi phẫn nộ. Tuy nhiên, “Con vua Đa-vít” thêm từ “vua” không có trong tiếng Hy Lạp (τῷ υἱῷ Δαυίδ, “Con Đa-vít”) và làm thay đổi hình thức tước hiệu được lặp lại nhất quán trong Ma-thi-ơ.'
  naturalness: Câu nhìn chung tự nhiên, nhưng việc lặp “thấy” không cần thiết vì một động từ ἰδόντες chi phối cả hai bổ ngữ. “đang reo lớn ... rằng” hơi gượng; “lớn tiếng hô” diễn đạt trôi chảy hơn hai phân từ κράζοντας và λέγοντας.
  terminology: “Các thượng tế,” “các kinh sư,” “khuôn viên đền thờ,” và “Hô-sa-na” là các lựa chọn phù hợp. “Con Đa-vít” cần được giữ nguyên, không thêm “vua,” để bảo toàn tước hiệu Mê-si theo nguyên văn.
  issues:
  - severity: medium
    issue: Thêm “vua” trong “Con vua Đa-vít.”
    rationale: Nguyên văn chỉ có “Con Đa-vít.” Dù Đa-vít là vua trong truyền thống, việc thêm “vua” là diễn giải không cần thiết và làm yếu tính cố định của tước hiệu trong Ma-thi-ơ.
  - severity: low
    issue: Lặp động từ “thấy” và cách nối “reo lớn ... rằng.”
    rationale: Tiếng Hy Lạp có một phân từ “thấy” với hai đối tượng, rồi hai phân từ mô tả trẻ em. Câu tiếng Việt có thể phản ánh cấu trúc này tự nhiên hơn mà không đổi nghĩa.
  revised_text: 'Nhưng khi các thượng tế và các kinh sư thấy những việc kỳ diệu Ngài đã làm, cùng những trẻ em lớn tiếng hô trong khuôn viên đền thờ[a]: “Hô-sa-na cho Con Đa-vít!”[b], thì họ phẫn nộ.'
