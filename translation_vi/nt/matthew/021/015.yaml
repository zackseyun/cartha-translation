id: MAT.21.15
reference: Matthew 21:15
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἰδόντες δὲ οἱ ἀρχιερεῖς καὶ οἱ γραμματεῖς τὰ θαυμάσια ἃ ἐποίησεν καὶ τοὺς παῖδας ⸀τοὺς κράζοντας ἐν τῷ ἱερῷ καὶ λέγοντας· Ὡσαννὰ τῷ υἱῷ Δαυίδ ἠγανάκτησαν
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/015.yaml
  text: But when the chief priests and the scribes saw the wonderful things that he did[a], and the children crying out in the temple and saying[b], “Hosanna to the Son of David,” they were indignant.
translation:
  language: vi
  text: 'Nhưng khi các thượng tế và các kinh sư thấy những việc kỳ diệu Ngài đã làm, cùng những trẻ em lớn tiếng hô trong khuôn viên đền thờ[a]: “Hô-sa-na cho Con Đa-vít!”[b], thì họ phẫn nộ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hy Lạp ở đây chỉ toàn bộ khuôn viên đền thờ, chứ không riêng nơi thánh bên trong.
    reason: cultural_note
  - marker: b
    text: “Hô-sa-na” là tiếng tung hô bắt nguồn từ một cụm từ Hê-bơ-rơ có nghĩa gần như “Xin cứu” hoặc “Xin cứu ngay”; vào thời điểm này, từ ấy cũng được dùng như một lời ca ngợi.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδόντες
  choice: khi ... thấy
  rationale: Phân từ bất định quá khứ nêu hoàn cảnh của động từ chính; cách diễn đạt này tự nhiên trong tiếng Việt và giữ sắc thái thời gian.
- source_word: δὲ
  choice: Nhưng
  rationale: Đánh dấu sự tương phản nhẹ với cảnh trước đó và phản ứng của giới lãnh đạo.
- source_word: ἀρχιερεῖς
  choice: các thượng tế
  rationale: Chỉ tập thể những người đứng đầu hàng tư tế, không phải chỉ một vị thượng tế.
- source_word: γραμματεῖς
  choice: các kinh sư
  rationale: Cách gọi ngắn gọn, quen thuộc dành cho những người chuyên thông thạo và giảng giải Kinh Luật.
- source_word: τὰ θαυμάσια
  choice: những việc kỳ diệu
  rationale: Giữ nghĩa rộng về các việc đáng kinh ngạc, không thu hẹp thành riêng các phép lạ.
- source_word: ἐποίησεν
  choice: Ngài đã làm
  rationale: Diễn đạt tự nhiên động từ aorist trong mệnh đề quan hệ; đại từ kính trọng phù hợp văn phong Kinh Thánh tiếng Việt hiện đại.
- source_word: παῖδας
  choice: những trẻ em
  rationale: Đây là nghĩa thích hợp nhất trong bối cảnh; không giới hạn giới tính như 'các bé trai'.
- source_word: κράζοντας
  choice: đang reo lớn
  rationale: Thể hiện lời tung hô công khai, lớn tiếng mà không gợi sắc thái thù địch.
- source_word: ἐν τῷ ἱερῷ
  choice: trong khuôn viên đền thờ
  rationale: ἱερόν chỉ toàn bộ khu đền thờ, không riêng nơi thánh bên trong; bản dịch trực tiếp làm rõ phạm vi không gian.
- source_word: λέγοντας
  choice: rằng
  rationale: Kết nối tự nhiên hành động reo lớn với nội dung lời tung hô trong tiếng Việt.
- source_word: Ὡσαννὰ
  choice: Hô-sa-na
  rationale: Giữ nguyên dạng lời tung hô có nguồn gốc Hê-bơ-rơ, qua đó bảo toàn cả ý cầu cứu lẫn chức năng ca ngợi; chú thích giải nghĩa.
- source_word: τῷ υἱῷ Δαυίδ
  choice: cho Con vua Đa-vít
  rationale: Dịch giới từ hàm ẩn của cách dữ cách theo hướng lời tung hô dành cho người mang tước hiệu; thêm 'vua' để tên gọi Đa-vít tự nhiên và rõ với độc giả Việt mà vẫn giữ tước hiệu 'Con ... Đa-vít'.
- source_word: ἠγανάκτησαν
  choice: họ phẫn nộ
  rationale: Diễn đạt cơn bất bình, tức giận mạnh của các thượng tế và kinh sư.
theological_decisions:
- issue: Ý nghĩa Đấng Mê-si của τῷ υἱῷ Δαυίδ
  choice: Con vua Đa-vít
  alternative: hậu duệ của Đa-vít
  rationale: Giữ hình thức tước hiệu mang ý nghĩa Đấng Mê-si trong mạch văn Ma-thi-ơ, thay vì giải nghĩa thành một cách diễn đạt thuần phả hệ.
- issue: Cách dịch Ὡσαννά
  choice: Hô-sa-na trong chính văn, kèm chú thích giải nghĩa
  alternative: Xin cứu ngay
  rationale: Trong bối cảnh này, từ vừa bắt nguồn từ lời cầu xin cứu giúp vừa hoạt động như tiếng tung hô ca ngợi. Phiên âm cùng chú thích bảo toàn sự căng nghĩa đó.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “thượng tế”, “kinh sư”, “khuôn viên đền thờ” để vừa tự nhiên vừa chính xác về lịch sử; phiên âm “Hô-sa-na” theo lối Việt hóa. Mọi dấu chú thích [a], [b] đều xuất hiện trong chính văn.
