id: MAT.21.33
reference: Matthew 21:33
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἄλλην παραβολὴν ἀκούσατε. ⸀Ἄνθρωπος ἦν οἰκοδεσπότης ὅστις ἐφύτευσεν ἀμπελῶνα καὶ φραγμὸν αὐτῷ περιέθηκεν καὶ ὤρυξεν ἐν αὐτῷ ληνὸν καὶ ᾠκοδόμησεν πύργον, καὶ ἐξέδετο αὐτὸν γεωργοῖς, καὶ ἀπεδήμησεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/033.yaml
  text: 'Listen to another parable: There was a landowner who planted a vineyard and put a fence around it and dug a winepress in it and built a tower[a], and leased it to tenant farmers[c][b], and went away.'
translation:
  language: vi
  text: 'Hãy nghe một dụ ngôn khác: Có một chủ đất trồng một vườn nho, dựng rào chung quanh,[b] đào một hầm ép rượu trong vườn, xây một ngọn tháp,[a] rồi cho các tá điền thuê vườn ấy,[c] và đi xa.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hình ảnh trồng vườn nho, dựng rào, đào hầm ép rượu và xây tháp gợi lại Ê-sai 5:1–2.
    reason: cross_reference
  - marker: b
    text: Cũng có thể dịch là “dựng một hàng giậu bao quanh.” Từ Hy Lạp có thể chỉ một vật ngăn bao quanh như hàng rào hoặc hàng giậu.
    reason: lexical_alternative
  - marker: c
    text: Hay “cho những người canh tác thuê.” Cụm từ này nói đến việc cho những người sẽ canh tác vườn nho thuê vườn ấy.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄλλην παραβολὴν ἀκούσατε
  choice: Hãy nghe một dụ ngôn khác
  rationale: Mệnh lệnh số nhiều ἀκούσατε được diễn đạt tự nhiên bằng “Hãy nghe”; “dụ ngôn” là cách gọi chuẩn xác trong ngữ cảnh lời dạy của Chúa Giê-su.
- source_word: Ἄνθρωπος ἦν οἰκοδεσπότης
  choice: Có một chủ đất
  rationale: Trong bối cảnh điền trang có vườn nho và người thuê canh tác, οἰκοδεσπότης chỉ người sở hữu và quản lý tài sản; “chủ đất” tự nhiên và đúng vai trò hơn cách dịch sát là “chủ nhà”.
- source_word: ἐφύτευσεν ἀμπελῶνα
  choice: trồng một vườn nho
  rationale: Giữ nguyên hình ảnh nông nghiệp cụ thể và âm hưởng Ê-sai 5.
- source_word: φραγμὸν αὐτῷ περιέθηκεν
  choice: dựng rào chung quanh
  rationale: φραγμός chỉ vật ngăn bao quanh, có thể là hàng rào hoặc hàng cây; “dựng rào” rõ nghĩa mà không xác định quá mức vật liệu.
- source_word: ὤρυξεν ἐν αὐτῷ ληνὸν
  choice: đào một hầm ép rượu trong vườn
  rationale: ὀρύσσω là “đào”, còn ληνός là nơi ép nho làm rượu; “hầm ép rượu” truyền đạt hình ảnh một chỗ ép được đào trong vườn.
- source_word: ᾠκοδόμησεν πύργον
  choice: xây một ngọn tháp
  rationale: πύργος đơn giản là “tháp”; không thêm chức năng canh gác vốn không được nêu rõ trong câu Hy Lạp.
- source_word: ἐξέδετο αὐτὸν γεωργοῖς
  choice: cho các tá điền thuê vườn ấy
  rationale: ἐκδίδωμι ở thể trung mang nghĩa cho thuê; γεωργοί ở đây là những người thuê đất để canh tác, nên “tá điền” diễn đạt gọn đúng quan hệ kinh tế.
- source_word: ἀπεδήμησεν
  choice: đi xa
  rationale: ἀποδημέω chỉ việc rời nơi cư trú để đi xa; cách dịch này không thêm một đích đến cụ thể.
theological_decisions:
- issue: Hình ảnh vườn nho liên văn bản với Ê-sai 5
  choice: Giữ các chi tiết nông nghiệp cụ thể trong chính văn và nêu liên hệ ở chú thích.
  alternative: Dùng lối diễn đạt cổ hoặc đưa Ê-sai 5 trực tiếp vào chính văn để làm nổi bật ám chỉ.
  rationale: Câu này gợi rõ Ê-sai 5:1–2, nhưng bản dịch không nên biến ám chỉ thành lời giải nghĩa; chú thích là nơi thích hợp để chỉ ra mối liên hệ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “tá điền” để phân biệt người thuê canh tác với lao động làm thuê; trật tự câu được điều chỉnh nhẹ cho tự nhiên trong tiếng Việt. Mọi dấu chú thích đều có mặt trong chính văn.
