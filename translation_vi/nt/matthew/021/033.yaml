- from: 'Hãy nghe một dụ ngôn khác: Có một chủ đất trồng một vườn nho, dựng rào chung quanh,[b] đào một hầm ép rượu trong vườn, xây một ngọn tháp,[a] rồi cho các tá điền thuê vườn ấy,[c] và đi xa.'
