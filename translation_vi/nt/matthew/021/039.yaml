  yaml_path: translation/nt/matthew/021/039.yaml
  text: And they took him[a], threw him out of the vineyard, and killed him.
translation:
  language: vi
  text: Họ bắt lấy người con, quăng người con ra khỏi vườn nho, rồi giết người con.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λαβόντες
  choice: bắt lấy
  rationale: Phân từ bất định quá khứ của λαμβάνω mở đầu chuỗi hành động. Trong ngữ cảnh những tá điền tấn công người con, “bắt lấy” tự nhiên và diễn đạt việc khống chế người ấy mà không cường điệu thành một động từ bạo lực hơn.
- source_word: ἐξέβαλον
  choice: quăng ra ngoài
  rationale: ἐκβάλλω cùng với ἔξω τοῦ ἀμπελῶνος diễn tả việc cưỡng bức đưa người con ra khỏi vườn nho. “Quăng ra ngoài” giữ sắc thái mạnh và cụ thể của hành động.
- source_word: ἔξω τοῦ ἀμπελῶνος
  choice: ra ngoài vườn nho
  rationale: Cụm từ chỉ hướng chuyển động từ bên trong ra bên ngoài vườn nho; cách diễn đạt này tự nhiên trong tiếng Việt khi đi với “quăng”.
- source_word: ἀμπελῶνος
  choice: vườn nho
  rationale: ἀμπελών chỉ một vườn trồng nho; “vườn nho” là cách dịch chính xác, quen thuộc và phù hợp với bối cảnh dụ ngôn.
- source_word: ἀπέκτειναν
  choice: giết đi
  rationale: ἀποκτείνω có nghĩa trực tiếp là giết. “Giết đi” tự nhiên trong chuỗi thuật sự và không thêm sắc thái pháp lý hay phán xét như “xử tử” hoặc “sát hại”.
theological_decisions:
- issue: Trình tự đuổi khỏi vườn nho và giết trong tương quan với các trình thuật song song
  choice: 'Giữ nguyên trình tự của Ma-thi-ơ: họ quăng người con ra ngoài vườn nho rồi giết đi.'
  alternative: Điều hòa với Mác hoặc Lu-ca bằng cách hàm ý rằng họ giết người con trước rồi mới quăng ra ngoài.
  rationale: 'Cú pháp Hy Lạp nêu rõ chuỗi hành động: λαβόντες ... ἐξέβαλον ... καὶ ἀπέκτειναν. Bản dịch giữ nguyên lời văn và trình tự riêng của Ma-thi-ơ, không điều hòa với các sách song song.'
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “người con” để đối tượng của đại từ αὐτόν được rõ trong câu đứng riêng; “rồi” làm sáng tỏ trình tự hành động vốn có trong nguyên văn.
