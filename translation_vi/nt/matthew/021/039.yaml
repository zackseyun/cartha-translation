revisions:
- from: Họ bắt lấy người con, quăng ra ngoài vườn nho rồi giết đi.
  to: Họ bắt lấy người con, quăng người con ra khỏi vườn nho, rồi giết người con.
  rationale: Chỉnh sửa chỉ nhằm làm câu tiếng Việt tự nhiên, rõ tham chiếu và trung tính hơn. Bản sửa vẫn bảo toàn trình tự đặc thù của Ma-thi-ơ—đuổi/quăng ra khỏi vườn nho trước, rồi giết—không điều hòa với các bản song song.
