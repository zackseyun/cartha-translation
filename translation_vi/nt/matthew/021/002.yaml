  text: λέγων αὐτοῖς· ⸀Πορεύεσθε εἰς τὴν κώμην τὴν ⸀κατέναντι ὑμῶν, καὶ ⸀εὐθέως εὑρήσετε ὄνον δεδεμένην καὶ πῶλον μετ’ αὐτῆς· λύσαντες ⸀ἀγάγετέ μοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/002.yaml
  text: saying to them[a], “Go into the village opposite you, and immediately you will find a donkey tied, and a colt with her[c][b]. Untie them and bring them to me.”
translation:
  language: vi
  text: 'Người bảo họ: “Hãy đi vào làng ở phía đối diện với các anh. Ngay lập tức, các anh sẽ thấy một con lừa cái bị cột, cùng với một con lừa non. Hãy tháo chúng ra và dẫn chúng đến với tôi.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγων αὐτοῖς
  choice: Ngài bảo họ
  rationale: Diễn đạt tự nhiên chức năng của phân từ hiện tại mở đầu lời nói, đồng thời giữ mối liên hệ với chủ thể trong văn cảnh.
- source_word: Πορεύεσθε
  choice: Hãy đi
  rationale: Mệnh lệnh đơn giản, tự nhiên trong tiếng Việt hiện đại.
- source_word: κώμην
  choice: ngôi làng
  rationale: κώμη chỉ một làng, phân biệt với thành phố.
- source_word: κατέναντι ὑμῶν
  choice: đối diện các con
  rationale: Giữ sát ý nghĩa không gian ‘ở phía đối diện’, nhưng chú thích khả năng diễn đạt tự nhiên hơn theo hướng di chuyển.
- source_word: εὐθέως
  choice: Ngay lập tức
  rationale: Bảo toàn sắc thái thời gian trực tiếp của εὐθέως.
- source_word: ὄνον δεδεμένην
  choice: một con lừa mẹ đang bị buộc
  rationale: Giống cái của tính từ phân từ và đại từ theo sau cho thấy đây là con lừa cái; ‘lừa mẹ’ làm rõ quan hệ với lừa con trong tiếng Việt.
- source_word: πῶλον μετ’ αὐτῆς
  choice: một lừa con ở bên nó
  rationale: Trong văn cảnh, πῶλος là con non của lừa; ‘ở bên’ truyền đạt tự nhiên μετ᾽ mà không khẳng định thêm điều nguồn không nói rõ.
- source_word: λύσαντες
  choice: Hãy cởi dây rồi
  rationale: Chuyển phân từ chỉ hành động đi trước thành chuỗi mệnh lệnh tự nhiên trong tiếng Việt, vẫn giữ thứ tự hành động.
- source_word: ἀγάγετέ μοι
  choice: dẫn cả hai đến cho Ta
  rationale: ἄγω thích hợp với việc dẫn súc vật; ‘cả hai’ làm rõ đối tượng số nhiều hàm chứa trong hình thái Hy Lạp.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “các con” và “Ta” theo ngữ cảnh Đức Giê-su nói với các môn đệ; cách xưng hô này dựa vào quan hệ trong văn cảnh chứ không được đánh dấu trực tiếp trong đại từ Hy Lạp. Dùng “Ngài” để nối tự nhiên với chủ thể của câu trước.
