  text: καὶ ἰδόντες οἱ μαθηταὶ ἐθαύμασαν λέγοντες· Πῶς παραχρῆμα ἐξηράνθη ἡ συκῆ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/020.yaml
  text: And when the disciples saw it[a], they marveled, saying, “How did the fig tree wither immediately?”
translation:
  language: vi
  text: 'Khi thấy vậy, các môn đồ kinh ngạc và nói: “Làm sao cây vả khô héo ngay lập tức như vậy?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδόντες
  choice: thấy vậy
  rationale: Phân từ bất định quá khứ được diễn đạt tự nhiên theo quan hệ thời gian; “vậy” quy chiếu về sự việc/cây vả đã khô héo trong ngữ cảnh mà không thêm một tân ngữ nặng nề.
- source_word: οἱ μαθηταὶ
  choice: các môn đồ
  rationale: Cách gọi quen thuộc, trang trọng và dễ hiểu dành cho nhóm môn đệ của Chúa Giê-su.
- source_word: ἐθαύμασαν
  choice: kinh ngạc
  rationale: Diễn đạt rõ cảm giác sửng sốt, thán phục hoặc ngạc nhiên mà θαυμάζω biểu thị trong ngữ cảnh.
- source_word: λέγοντες
  choice: nói
  rationale: Phân từ hiện tại giới thiệu lời phát biểu đi kèm; tiếng Việt tự nhiên chỉ cần dùng “nói”.
- source_word: Πῶς
  choice: Sao ... như thế?
  rationale: Giữ lực nghi vấn về cách thức hoặc nguyên do theo lối nói tự nhiên của tiếng Việt.
- source_word: παραχρῆμα
  choice: ngay lập tức
  rationale: Phản ánh trực tiếp ý nghĩa thời gian “tức thì, ngay lúc ấy” của trạng từ.
- source_word: ἐξηράνθη
  choice: lại khô héo
  rationale: Động từ ở thể thụ động về hình thái nhưng trong ngữ cảnh mô tả cây trở nên khô héo; tiếng Việt tự nhiên dùng nội động từ. “Lại” góp phần tạo câu hỏi kinh ngạc mà không xác định nguyên nhân.
- source_word: ἡ συκῆ
  choice: cây vả
  rationale: Tên gọi tiếng Việt thông dụng trong văn bản Kinh Thánh cho cây sung thuộc loại fig được nói đến ở đây.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ đọc. Câu hỏi giữ sự kinh ngạc của các môn đồ, đồng thời dịch παραχρῆμα sát nghĩa là “ngay lập tức”. Không sử dụng chú thích vì câu Hy Lạp không có điểm mơ hồ cần thiết phải đưa ra ngoài chính văn; chú thích tiếng Anh được cung cấp có vẻ lặp lại nguyên văn và không nêu một phương án thực sự khác.
