  to: 'Khi thấy vậy, các môn đồ kinh ngạc và nói: “Làm sao cây vả khô héo ngay lập tức như vậy?”'
  rationale: Sửa tối thiểu để biểu đạt rõ lực nghi vấn cách thức của Πῶς, loại bỏ sắc thái không cần thiết của “lại,” và nối hai phân từ Hy Lạp bằng cấu trúc tiếng Việt tự nhiên. “Ngay lập tức” giữ sát παραχρῆμα; “khô héo” giữ hình ảnh cây vả trở nên khô héo.
