review_pass:
  verdict: revise
  source_fidelity: 'Bản nháp truyền đạt đúng các ý chính: các môn đồ nhìn thấy, kinh ngạc, và hỏi về việc cây vả khô héo tức thì. Tuy nhiên, “Sao ... lại ... như thế?” trong tiếng Việt có thể nghiêng về câu hỏi nguyên nhân (“tại sao”) hơn là cách thức, trong khi Πῶς chủ yếu hỏi “làm sao/bằng cách nào.” Từ “lại” không có đối ứng cần thiết trong nguyên ngữ.'
  naturalness: Câu hiện tại dễ hiểu và có văn phong trang trọng vừa phải. Đổi sang “Làm sao ... khô héo ngay lập tức như vậy?” làm rõ đây là câu hỏi về cách thức mà vẫn tự nhiên trong tiếng Việt hiện đại.
  terminology: “Các môn đồ” và “cây vả” đều phù hợp với văn cảnh Kinh Thánh và không gây vấn đề thuật ngữ. “Khô héo” diễn tả tự nhiên ἐξηράνθη đối với một cái cây.
  issues:
  - severity: medium
    issue: “Sao cây vả lại ... như thế?” có thể được hiểu là hỏi nguyên nhân.
    rationale: Πῶς là nghi vấn từ về cách thức; cách dịch “làm sao ... như vậy?” bảo toàn hướng nghi vấn này rõ hơn. Đồng thời bỏ “lại,” một sắc thái thêm vào không được đánh dấu trong câu Hy Lạp.
  revised_text: 'Khi thấy vậy, các môn đồ kinh ngạc và nói: “Làm sao cây vả khô héo ngay lập tức như vậy?”'
