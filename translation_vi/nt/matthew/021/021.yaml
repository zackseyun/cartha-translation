id: MAT.21.21
reference: Matthew 21:21
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν αὐτοῖς· Ἀμὴν λέγω ὑμῖν, ἐὰν ἔχητε πίστιν καὶ μὴ διακριθῆτε, οὐ μόνον τὸ τῆς συκῆς ποιήσετε, ἀλλὰ κἂν τῷ ὄρει τούτῳ εἴπητε· Ἄρθητι καὶ βλήθητι εἰς τὴν θάλασσαν, γενήσεται·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/021.yaml
  text: But Jesus answered them[a], “Truly I say to you, if you have faith and do not doubt, you will not only do what was done to the fig tree, but even if you say to this mountain, ‘Be taken up and thrown into the sea,’ it will happen.”
translation:
  language: vi
  text: 'Nhưng Đức Giê-su đáp: “Thật, tôi nói với anh em, nếu anh em có đức tin và không nghi ngờ[a], thì anh em không những sẽ làm được điều đã làm cho cây vả, mà ngay cả khi anh em bảo ngọn núi này: ‘Hãy nhấc lên và quăng xuống biển,’ thì điều đó cũng sẽ xảy ra.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “không dao động” hoặc “không phân vân trong lòng.”'
    reason: διακριθῆτε có thể gợi ý không chỉ sự nghi ngờ mà còn tình trạng do dự hoặc bị chia rẽ trong tâm trí.
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν αὐτοῖς
  choice: Nhưng Đức Giê-su đáp lời họ
  rationale: Diễn đạt tự nhiên cấu trúc phân từ ἀποκριθείς cùng động từ εἶπεν; “nhưng” phản ánh sắc thái chuyển ý nhẹ của δέ mà không làm tương phản quá mạnh.
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: Thật, tôi nói với anh em
  rationale: Giữ sắc thái long trọng, xác quyết của ἀμήν và hình thức phát ngôn trực tiếp của Chúa Giê-su bằng tiếng Việt hiện đại, trang nghiêm.
- source_word: ἐὰν ἔχητε πίστιν
  choice: nếu anh em có đức tin
  rationale: Trong ngữ cảnh này, πίστις chỉ lòng tin cậy nơi Đức Chúa Trời hơn là phẩm chất trung tín; “đức tin” là cách gọi quen thuộc và chính xác.
- source_word: μὴ διακριθῆτε
  choice: không nghi ngờ
  rationale: Trong ngữ cảnh, διακρίνω chỉ sự do dự, phân vân trong lòng. Cách dịch chính rõ nghĩa; sắc thái “dao động” được giữ trong chú thích.
- source_word: οὐ μόνον τὸ τῆς συκῆς ποιήσετε
  choice: anh em không những sẽ làm được điều đã xảy ra với cây vả
  rationale: τὸ τῆς συκῆς là lối nói tỉnh lược, quy chiếu đến sự việc liên quan đến cây vả trong văn cảnh. Cách dịch làm rõ phần tỉnh lược mà không giải thích quá mức.
- source_word: κἂν τῷ ὄρει τούτῳ εἴπητε
  choice: ngay cả khi anh em bảo ngọn núi này
  rationale: κἄν mở rộng điều kiện theo hướng nhấn mạnh hơn; “ngay cả khi” thể hiện sự tăng tiến từ cây vả đến ngọn núi.
- source_word: Ἄρθητι καὶ βλήθητι εἰς τὴν θάλασσαν
  choice: Hãy nhấc lên và quăng xuống biển
  rationale: Giữ hai mệnh lệnh thụ động và hình ảnh chuyển dời cụ thể; tiếng Việt có thể lược chủ thể tác động mà vẫn truyền đạt sắc thái bị động theo ngữ cảnh.
- source_word: γενήσεται
  choice: thì điều đó cũng sẽ xảy ra
  rationale: γίνομαι ở thì tương lai nói rằng sự việc được truyền sẽ xảy ra; cách dịch hiện đại, trực tiếp và nối rõ với mệnh lệnh trước đó.
theological_decisions:
- issue: Ý nghĩa của πίστις trong lời nói về hành động kỳ diệu
  choice: đức tin
  alternative: lòng tin; sự trung tín
  rationale: Văn cảnh nhấn mạnh sự tin cậy không nghi ngờ, chứ không chủ yếu nói về đức tính trung tín. “Đức tin” giữ thuật ngữ thần học quen thuộc mà không thêm đối tượng vốn không được nêu trực tiếp trong câu.
- issue: Bản chất lời nói về việc chuyển núi
  choice: Giữ nguyên hình ảnh mạnh mẽ mà không giới hạn nó vào phép lạ theo nghĩa đen hay ẩn dụ thuần túy
  alternative: Lời hứa hoàn toàn theo nghĩa đen; hoặc chỉ là ẩn dụ về vượt qua khó khăn
  rationale: Nguyên văn dùng hình ảnh sống động và không tự giải thích phạm vi áp dụng. Bản dịch giữ nguyên sự căng thẳng diễn giải thay vì áp đặt một cách hiểu giáo lý.
translation_notes:
  register: Văn phong tiếng Việt tiêu chuẩn hiện đại, trang nghiêm nhưng dễ hiểu. Dùng “Đức Giê-su” và đại từ “tôi—anh em” để thể hiện lời trực tiếp tự nhiên, tôn trọng, không cổ hóa. Giữ hình ảnh cây vả, ngọn núi và biển, không diễn giải chúng theo một truyền thống hệ phái cụ thể.
