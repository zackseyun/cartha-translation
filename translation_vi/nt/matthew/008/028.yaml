id: MAT.8.28
reference: Matthew 8:28
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Καὶ ⸂ἐλθόντος αὐτοῦ⸃ εἰς τὸ πέραν εἰς τὴν χώραν τῶν ⸀Γαδαρηνῶν ὑπήντησαν αὐτῷ δύο δαιμονιζόμενοι ἐκ τῶν μνημείων ἐξερχόμενοι, χαλεποὶ λίαν ὥστε μὴ ἰσχύειν τινὰ παρελθεῖν διὰ τῆς ὁδοῦ ἐκείνης.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/028.yaml
  text: And when he came to the other side[a], into the region of the Gadarenes, two demon-possessed men met him, coming out of the tombs[c][b], so extremely fierce that no one was able to pass along that road.
translation:
  language: vi
  text: Khi Đức Giê-su sang bờ bên kia, đến vùng đất của người Ga-đa-ra[a], hai người bị quỷ ám từ các mộ đi ra gặp Ngài. Họ hết sức dữ tợn, đến nỗi không ai có thể đi qua con đường ấy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Một số thủ bản đọc “người Ghê-ghê-sa” hoặc “người Ghê-ra-sa” thay vì “người Ga-đa-ra”.
    reason: textual_variant
lexical_decisions:
- source_word: ἐλθόντος αὐτοῦ
  choice: Khi Đức Giê-su sang
  rationale: Cấu trúc sở hữu cách tuyệt đối diễn tả thời gian; tiếng Việt tự nhiên dùng mệnh đề “Khi...”. Chủ thể được nêu rõ là Đức Giê-su theo văn cảnh.
- source_word: τὸ πέραν
  choice: bờ bên kia
  rationale: Trong văn cảnh vượt hồ, cụm này chỉ phía bờ đối diện; “bờ bên kia” rõ nghĩa và tự nhiên hơn chỉ nói “phía bên kia”.
- source_word: χώραν τῶν Γαδαρηνῶν
  choice: miền dân Ga-đa-ra
  rationale: χώρα là miền hoặc vùng lãnh thổ; dạng sở thuộc chỉ miền gắn với dân Ga-đa-ra. Cách phiên âm phù hợp lối gọi địa danh/dân danh trong tiếng Việt.
- source_word: δύο δαιμονιζόμενοι
  choice: hai người bị quỷ ám
  rationale: Diễn đạt tình trạng chịu quyền lực của quỷ bằng cách nói quen thuộc, rõ ràng trong tiếng Việt, không thêm một lý thuyết kỹ thuật về mức độ chiếm hữu.
- source_word: ἐκ τῶν μνημείων ἐξερχόμενοι
  choice: từ các mộ phần đi ra
  rationale: μνημεῖον trong văn cảnh là nơi chôn cất; “mộ phần” trang trọng, dễ hiểu, và cụm phân từ được chuyển thành diễn tiến tự nhiên trong tiếng Việt.
- source_word: χαλεποὶ λίαν
  choice: dữ tợn
  rationale: χαλεπός ở đây diễn tả sự hung dữ, nguy hiểm; λίαν được thể hiện cùng cấu trúc kết quả “đến nỗi”, tránh cụm tăng cường nặng nề như “cực kỳ dữ tợn đến nỗi”.
- source_word: ὥστε μὴ ἰσχύειν τινὰ παρελθεῖν διὰ τῆς ὁδοῦ ἐκείνης
  choice: đến nỗi không ai có thể đi qua con đường ấy
  rationale: ὥστε nêu kết quả, ἰσχύω chỉ khả năng trong ngữ cảnh này, và διά với ὁδός chỉ tuyến đường người ta đi qua.
theological_decisions:
- issue: Cách diễn đạt tình trạng do quỷ tác động
  choice: bị quỷ ám
  alternative: bị quỷ chế ngự
  rationale: “Bị quỷ ám” là cách nói hiện đại, phổ biến và trực tiếp, xác nhận tác nhân ma quỷ như bản văn trình bày nhưng không cố định thêm một hệ thống phân loại thần học.
- issue: Dị bản về địa danh
  choice: Ga-đa-ra
  alternative: Ghê-ra-sa hoặc Ghê-rê-sa
  rationale: Bản văn chính SBLGNT đọc Γαδαρηνῶν, nên bản dịch chính theo Ga-đa-ra; các dạng địa danh được chứng thực trong những thủ bản khác được giữ ở chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ đọc. Dùng “Đức Giê-su” và “Ngài” theo lối kính trọng phổ biến; giữ nhịp kể súc tích của nguyên văn. Không thêm chú thích cho các cách diễn đạt không thật sự cần thiết.
