- from: Khi Đức Giê-su sang bờ bên kia, đến miền dân Ga-đa-ra[a], có hai người bị quỷ ám từ các mộ phần đi ra gặp Ngài. Họ dữ tợn đến nỗi không ai có thể đi qua con đường ấy.
  to: Khi Đức Giê-su sang bờ bên kia, đến vùng đất của người Ga-đa-ra[a], hai người bị quỷ ám từ các mộ đi ra gặp Ngài. Họ hết sức dữ tợn, đến nỗi không ai có thể đi qua con đường ấy.
