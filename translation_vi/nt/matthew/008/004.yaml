- from: 'Đức Giê-su bảo người ấy: “Hãy coi chừng, đừng nói với ai; nhưng hãy đi trình diện thầy tế lễ và dâng lễ vật mà Môi-se đã truyền[a], để làm chứng cho họ[b].”'
  to: 'Đức Giê-su bảo người ấy: “Hãy coi chừng, đừng nói cho ai biết; nhưng hãy đi trình diện trước thầy tế lễ và dâng lễ vật mà Môi-se đã truyền[a], để làm chứng cho họ[b].”'
  rationale: Bản sửa chỉ cải thiện cách diễn đạt tiếng Việt ở hai điểm mà vẫn giữ nguyên cấu trúc, các mệnh lệnh, thuật ngữ nghi lễ, và tính mơ hồ có chủ ý của cụm “để làm chứng cho họ”. Vị trí các chú thích vẫn gắn đúng với “Môi-se đã truyền” và “cho họ”.
  reviewer_model: gpt-5.6-terra
