id: MAT.8.4
reference: Matthew 8:4
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ λέγει αὐτῷ ὁ Ἰησοῦς· Ὅρα μηδενὶ εἴπῃς, ἀλλὰ ὕπαγε σεαυτὸν δεῖξον τῷ ἱερεῖ, καὶ προσένεγκον τὸ δῶρον ὃ προσέταξεν Μωϋσῆς εἰς μαρτύριον αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/004.yaml
  text: And Jesus said to him[a], “See that you tell no one, but go, show yourself to the priest, and offer the gift that Moses commanded[b], as a testimony to them.”
translation:
  language: vi
  text: 'Đức Giê-su bảo người ấy: “Hãy coi chừng, đừng nói cho ai biết; nhưng hãy đi trình diện trước thầy tế lễ và dâng lễ vật mà Môi-se đã truyền[a], để làm chứng cho họ[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mệnh lệnh này theo thủ tục Luật Môi-se dành cho người đã được sạch bệnh phong; xem Lê-vi 14.
    reason: cross_reference
  - marker: b
    text: 'Cũng có thể dịch: “để làm bằng chứng cho họ.” Cụm từ này có thể nói đến bằng chứng được trình cho các thầy tế lễ; một số người cũng hiểu đó là lời chứng ngầm chống lại những người không chịu tin.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ὅρα μηδενὶ εἴπῃς
  choice: Hãy coi chừng, đừng nói với ai
  rationale: Ὅρα được dùng như lời cảnh báo hoặc căn dặn; “hãy coi chừng” truyền đạt sức nặng của mệnh lệnh, còn “đừng nói với ai” phản ánh lệnh cấm theo sau một cách tự nhiên.
- source_word: ὕπαγε σεαυτὸν δεῖξον τῷ ἱερεῖ
  choice: hãy đi trình diện thầy tế lễ
  rationale: “Trình diện” diễn đạt tự nhiên hành động đưa chính mình ra để thầy tế lễ xem xét, đồng thời giữ được liên hệ với thủ tục kiểm tra theo Luật Môi-se.
- source_word: τῷ ἱερεῖ
  choice: thầy tế lễ
  rationale: Mạo từ xác định hướng đến vị thầy tế lễ có thẩm quyền trong thủ tục này; tiếng Việt không nhất thiết phải thêm “vị” hay “một”.
- source_word: προσένεγκον τὸ δῶρον
  choice: dâng lễ vật
  rationale: Trong ngữ cảnh thờ phượng, προσφέρω mang nghĩa dâng lên, còn δῶρον là vật được dâng; “dâng lễ vật” vừa tự nhiên vừa thể hiện sắc thái nghi lễ.
- source_word: ὃ προσέταξεν Μωϋσῆς
  choice: mà Môi-se đã truyền
  rationale: προστάσσω chỉ việc truyền lệnh hoặc quy định; “đã truyền” giữ nguyên thẩm quyền của mệnh lệnh mà không diễn giải thêm.
- source_word: εἰς μαρτύριον αὐτοῖς
  choice: để làm chứng cho họ
  rationale: Cách dịch này thể hiện mục đích của εἰς và giữ nguyên sự không xác định về đối tượng của αὐτοῖς cũng như sắc thái rộng của μαρτύριον.
- source_word: λέγει αὐτῷ ὁ Ἰησοῦς
  choice: Đức Giê-su bảo người ấy
  rationale: Thì hiện tại lịch sử được chuyển sang lối kể quá khứ tự nhiên trong tiếng Việt; “bảo” phù hợp với lời căn dặn trực tiếp có tính mệnh lệnh.
theological_decisions:
- issue: Đối tượng và sắc thái của cụm εἰς μαρτύριον αὐτοῖς
  choice: Giữ cách nói “để làm chứng cho họ”, không xác định “họ” là ai và không thêm ý “chống lại”.
  alternative: “để làm bằng chứng cho các thầy tế lễ” hoặc “để làm chứng chống lại họ”
  rationale: Bản Hy Lạp không nói rõ đại từ αὐτοῖς chỉ nhóm nào; μαρτύριον có thể là lời chứng hoặc bằng chứng mà không tự nó quyết định sắc thái thuận lợi hay kết án.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Giê-su”, “thầy tế lễ”, “Môi-se” theo lối gọi quen thuộc trong tiếng Việt Cơ Đốc. Hai dấu chú thích đều xuất hiện trong câu chính và đặt sát nội dung tương ứng.
