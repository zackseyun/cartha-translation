source:
  edition: SBLGNT
  text: ⸂καὶ ἀποκριθεὶς⸃ ὁ ἑκατόνταρχος ἔφη· Κύριε, οὐκ εἰμὶ ἱκανὸς ἵνα μου ὑπὸ τὴν στέγην εἰσέλθῃς· ἀλλὰ μόνον εἰπὲ λόγῳ, καὶ ἰαθήσεται ὁ παῖς μου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/008.yaml
  text: And the centurion answered[a], “Lord, I am not worthy that you should come under my roof. But only speak a word[b], and my servant will be healed.”
translation:
  language: vi
  text: 'Viên đội trưởng đáp: “Lạy Chúa, tôi không xứng đáng để Ngài vào nhà tôi. Nhưng chỉ cần Ngài phán một lời[a], thì đầy tớ[b] tôi sẽ được chữa lành.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc dịch: “chỉ cần nói lời ấy.” Tiếng Hy Lạp viết sát nghĩa: “chỉ nói bằng một lời.”'
    reason: lexical_alternative
  - marker: b
    text: Từ Hy Lạp được dịch là “đầy tớ” cũng có thể chỉ “cậu bé” hoặc “đứa trẻ”, tùy văn cảnh.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποκριθεὶς … ἔφη
  choice: đáp
  rationale: Hai yếu tố Hy Lạp cùng tạo thành công thức dẫn lời mang nghĩa hồi đáp. Dịch gọn là “đáp” tự nhiên trong tiếng Việt và tránh lặp thừa kiểu “đáp và nói”.
- source_word: ἑκατόνταρχος
  choice: viên đại đội trưởng
  rationale: Chỉ sĩ quan chỉ huy khoảng một trăm quân. Cách dịch này truyền đạt chức vụ cho độc giả Việt hiện đại rõ hơn việc phiên âm danh xưng La Mã.
- source_word: Κύριε
  choice: Lạy Chúa
  rationale: Giữ nghĩa chủ đạo của κύριος và sắc thái tôn kính trong lời thưa trực tiếp với Chúa Giê-su, đồng thời không thu hẹp từ này thành một lời xưng hô xã giao đơn thuần.
- source_word: ἱκανὸς
  choice: xứng đáng
  rationale: Trong cấu trúc này, từ nói đến sự xứng hợp hay tư cách của người nói, chứ không chủ yếu nói đến khả năng; “xứng đáng” diễn đạt đúng sự khiêm nhường của viên sĩ quan.
- source_word: ἵνα μου ὑπὸ τὴν στέγην εἰσέλθῃς
  choice: để Ngài vào nhà tôi
  rationale: Diễn đạt tự nhiên thành ngữ Hy Lạp theo nghĩa bước vào nơi ở của người nói. “Dưới mái nhà tôi” sát hình ảnh hơn nhưng gượng trong câu tiếng Việt này.
- source_word: μόνον εἰπὲ λόγῳ
  choice: xin Ngài chỉ phán một lời
  rationale: “Chỉ” giữ lực hạn định của μόνον; “phán một lời” vừa tự nhiên trong văn cảnh vừa thể hiện lời nói có thẩm quyền, không hàm ý nghi thức hay công thức đặc biệt.
- source_word: ἰαθήσεται
  choice: sẽ được chữa lành
  rationale: Giữ rõ thể bị động và ý nghĩa chữa lành của động từ Hy Lạp trong văn cảnh phép lạ.
- source_word: παῖς
  choice: đầy tớ
  rationale: Bối cảnh gia đình của viên sĩ quan và trình thuật song song ủng hộ nghĩa “đầy tớ”, nhưng từ Hy Lạp cũng có thể chỉ một cậu bé hay đứa trẻ, nên sự đa nghĩa được ghi ở chú thích.
theological_decisions:
- issue: Cách dịch κύριος khi trực tiếp thưa với Chúa Giê-su
  choice: Lạy Chúa
  alternative: Thưa ngài; thưa chủ
  rationale: “Lạy Chúa” bảo toàn khả năng từ này mang sức nặng thần học, nhưng bản thân câu vẫn có thể được nghe như lời xưng hô đầy tôn kính trong bối cảnh.
- issue: Nghĩa của παῖς
  choice: đầy tớ
  alternative: cậu bé; đứa trẻ
  rationale: “Đầy tớ” phù hợp nhất với bối cảnh viên sĩ quan và người thuộc quyền ông, nhưng không xóa bỏ phạm vi nghĩa rộng thật sự của từ Hy Lạp; các khả năng khác được giữ trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Lạy Chúa” phù hợp với lời thưa kính trọng; “Ngài” giữ phép xưng hô trang trọng. Câu được sắp xếp tự nhiên theo tiếng Việt, không sao chép máy móc trật tự Hy Lạp.
