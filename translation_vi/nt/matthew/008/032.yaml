    rationale: ἀπῆλθον εἰς có nghĩa cơ bản là “đi vào”; trong ngữ cảnh các quỷ, “nhập vào” là cách hiểu hợp lý nhưng thêm sắc thái chuyên biệt không được động từ Hy Lạp tự nó nêu rõ.
  - severity: low
    issue: “ra khỏi đó” thêm và làm mơ hồ chỉ vị trí.
    rationale: ἐξελθόντες chỉ nói “đi ra/ra khỏi”; đối tượng được hiểu từ văn cảnh. “Đó” không có đối ứng trực tiếp trong câu nguồn.
  - severity: low
    issue: Chú thích a dùng “vực” như một phương án cho κρημνός.
    rationale: κρημνός chỉ sườn dốc đứng, bờ/mép dốc hoặc vách/precipice; “vực” trong tiếng Việt thường gợi một hẻm hoặc lòng sâu, không phải chính địa thế được lao xuống.
