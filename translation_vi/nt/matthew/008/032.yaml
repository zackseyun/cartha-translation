- from: 'Ngài phán với chúng: “Đi đi!” Chúng liền ra khỏi đó và nhập vào đàn lợn. Kìa, cả đàn lao xuống sườn dốc đứng[a], vào biển, rồi chết trong nước[b].'
  to: 'Ngài phán với chúng: “Đi đi.” Chúng đi ra và đi vào đàn lợn. Kìa, cả đàn lao xuống sườn dốc đứng[a], vào biển, rồi chết trong nước[b].'
