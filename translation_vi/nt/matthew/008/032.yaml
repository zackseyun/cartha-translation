  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτοῖς· Ὑπάγετε. οἱ δὲ ἐξελθόντες ἀπῆλθον εἰς ⸂τοὺς χοίρους⸃· καὶ ἰδοὺ ὥρμησεν πᾶσα ἡ ⸀ἀγέλη κατὰ τοῦ κρημνοῦ εἰς τὴν θάλασσαν, καὶ ἀπέθανον ἐν τοῖς ὕδασιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/032.yaml
  text: And he said to them[a], “Go.” Then they came out and went into the pigs; and behold[c][b], the whole herd rushed down the steep bank into the sea and died in the waters.
translation:
  language: vi
  text: 'Ngài phán với chúng: “Đi đi.” Chúng đi ra và đi vào đàn lợn. Kìa, cả đàn lao xuống sườn dốc đứng[a], vào biển, rồi chết trong nước[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “xuống bờ dốc” hoặc “xuống vách đá.” Từ Hy Lạp có thể chỉ một sườn dốc đứng, bờ dốc, hoặc mép vực.'
    reason: lexical_alternative
  - marker: b
    text: 'Hay: “chết đuối.” Nguyên văn nói sát nghĩa là “chết trong nước.”'
    reason: alternative_reading
lexical_decisions:
- source_word: Ὑπάγετε
  choice: Đi đi!
  rationale: Mệnh lệnh số nhiều ngắn gọn và dứt khoát. “Đi đi!” tự nhiên trong tiếng Việt, giữ được sức mạnh của lời truyền mà không thêm sắc thái không có trong nguyên văn.
- source_word: ἐξελθόντες
  choice: ra khỏi đó
  rationale: Phân từ diễn tả việc các quỷ ra khỏi những người bị quỷ ám; “đó” giúp câu tiếng Việt tự nhiên nhưng không nêu lại đối tượng vốn được hiểu từ văn cảnh.
- source_word: ἀπῆλθον εἰς τοὺς χοίρους
  choice: nhập vào đàn lợn
  rationale: Trong ngữ cảnh nói về các quỷ đi vào những con lợn, “nhập vào” là cách diễn đạt rõ và tự nhiên hơn lối dịch máy móc “đi vào,” đồng thời không thêm ý chiếm hữu hay điều khiển.
- source_word: χοίρους
  choice: lợn
  rationale: “Lợn” là từ thông dụng, hiện đại trong tiếng Việt chuẩn; danh từ số ít có thể mang nghĩa loài hoặc tập hợp trong cụm “đàn lợn.”
- source_word: ἰδοὺ
  choice: Kìa
  rationale: Giữ chức năng thu hút sự chú ý và làm cảnh thuật trở nên sống động của tiểu từ Hy Lạp, thay vì lược bỏ hoặc diễn giải thành “bỗng nhiên.”
- source_word: πᾶσα ἡ ἀγέλη
  choice: cả đàn
  rationale: Cách nói gọn, tự nhiên, truyền đạt đầy đủ ý toàn thể của πᾶσα và danh từ tập hợp ἀγέλη.
- source_word: ὥρμησεν
  choice: lao xuống
  rationale: Diễn tả chuyển động đột ngột, mạnh và nhanh của cả đàn; không hàm ý quá mức rằng chúng bị một lực khác ném xuống.
- source_word: κατὰ τοῦ κρημνοῦ
  choice: xuống sườn dốc đứng
  rationale: κρημνός có thể chỉ sườn dốc, bờ dốc hoặc vực; “sườn dốc đứng” giữ được đặc điểm địa hình mà không khẳng định đó là một vách đá thẳng đứng.
- source_word: θάλασσαν
  choice: biển
  rationale: Dịch trực tiếp θάλασσα là “biển,” phù hợp cách gọi Biển Ga-li-lê và không thay bằng lời chú giải địa lý “hồ.”
- source_word: ἀπέθανον ἐν τοῖς ὕδασιν
  choice: chết trong nước
  rationale: Bám sát cách nói của nguyên văn là “chết trong nước”; “chết đuối” tuy hợp ngữ cảnh nhưng xác định cụ thể nguyên nhân hơn điều động từ Hy Lạp trực tiếp nói.
theological_decisions:
- issue: Mức độ diễn giải khi mô tả cái chết của đàn lợn
  choice: Giữ cách nói “chết trong nước.”
  alternative: “chết đuối” hoặc “bị chết đuối”
  rationale: Văn cảnh hàm ý rất mạnh rằng đàn lợn chết đuối, nhưng nguyên văn chỉ nói chúng “chết trong nước.” Bản dịch giữ nguyên mức độ xác định của văn bản thay vì biến suy luận hợp lý thành lời khẳng định trực tiếp.
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Ngài” cho Chúa Giê-su theo văn cảnh, “Kìa” để giữ nét sống động của lời thuật, và tránh các từ cổ như “đàn heo” theo sắc thái vùng miền hoặc “bầy súc vật.”
