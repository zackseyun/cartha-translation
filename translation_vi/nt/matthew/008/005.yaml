lexical_decisions:
- source_word: Εἰσελθόντος δὲ αὐτοῦ
  choice: Khi Đức Giê-su vào
  rationale: Kết cấu sở hữu cách tuyệt đối với phân từ aorist được chuyển thành mệnh đề thời gian tự nhiên trong tiếng Việt. “Khi” giữ được quan hệ thời gian mà không xác định quá mức là hoàn toàn đồng thời hay xảy ra sau đó; tên Đức Giê-su được nêu rõ theo văn cảnh.
- source_word: εἰς Καφαρναοὺμ
  choice: vào thành Ca-phác-na-um
  rationale: “Vào” diễn đạt trực tiếp hướng chuyển động; thêm “thành” giúp địa danh được nhận biết tự nhiên trong tiếng Việt mà không thay đổi ý nghĩa.
- source_word: προσῆλθεν αὐτῷ
  choice: đến gặp Ngài
  rationale: προσέρχομαι có thể mang nghĩa “đến với” hoặc “đến gần.” “Đến gặp” tự nhiên trong ngữ cảnh một người chủ động tìm đến Đức Giê-su để thỉnh cầu, còn khả năng “đến gần” được giữ trong chú thích.
- source_word: ἑκατόνταρχος
  choice: một viên đại đội trưởng
  rationale: Danh từ chỉ sĩ quan chỉ huy khoảng một trăm quân. “Đại đội trưởng” vừa dễ hiểu với độc giả Việt Nam vừa giữ được tính chất quân hàm cụ thể hơn cách gọi chung là “sĩ quan La Mã”; “viên” phù hợp với chức danh quân sự.
- source_word: παρακαλῶν αὐτὸν
  choice: khẩn cầu Ngài
  rationale: Trong ngữ cảnh này, παρακαλέω chỉ một lời thỉnh cầu tha thiết. “Khẩn cầu” giữ sắc thái trang trọng và cấp thiết nhưng không nhất thiết hàm ý tuyệt vọng như một số cách diễn đạt mạnh hơn.
