  source_fidelity: 'Bản dịch truyền đạt đúng các thành tố chính: Giê-su thấy nhiều đám đông quanh mình và ra chỉ thị để đi sang phía/bờ bên kia. Tuy nhiên, “truyền lệnh đi” không phải là kết hợp động từ tự nhiên trong tiếng Việt hiện đại; ἐκέλευσεν ἀπελθεῖν được diễn đạt rõ và sát hơn bằng “ra lệnh đi.”'
  naturalness: “Nhiều đám đông” giữ được số nhiều của ὄχλους nhưng hơi gượng; vẫn có thể chấp nhận trong bản dịch sát. Cần thay “truyền lệnh” bằng “ra lệnh” để câu tự nhiên, rõ cấu trúc hơn. “Quanh mình” tự nhiên và gọn hơn “vây quanh mình” trong ngữ cảnh này.
  terminology: “Giê-su” phù hợp với tên riêng và không thêm tước hiệu không có trong câu. “Bờ bên kia” diễn đạt thích đáng εἰς τὸ πέραν trong bối cảnh vượt hồ. Bản sửa vẫn không xác định người thực hiện việc đi, vì nguyên văn không nêu rõ.
  issues:
