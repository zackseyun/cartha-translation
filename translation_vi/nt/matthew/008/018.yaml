    rationale: ἐκέλευσεν ἀπελθεῖν có thể dịch tự nhiên là “ra lệnh đi”; cách này vẫn để ngỏ đối tượng/chủ thể ngầm của “đi,” như tiếng Hy Lạp.
  revised_text: Khi thấy nhiều đám đông quanh mình, Giê-su ra lệnh đi sang bờ bên kia.
