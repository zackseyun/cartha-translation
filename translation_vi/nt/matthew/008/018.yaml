  text: Ἰδὼν δὲ ὁ Ἰησοῦς ⸂πολλοὺς ὄχλους⸃ περὶ αὐτὸν ἐκέλευσεν ἀπελθεῖν εἰς τὸ πέραν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/018.yaml
  text: When Jesus saw many crowds around him, he gave orders to go to the other side.
translation:
  language: vi
  text: Khi thấy nhiều đám đông quanh mình, Giê-su ra lệnh đi sang bờ bên kia.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πολλοὺς ὄχλους
  choice: nhiều đám đông
  rationale: Giữ dạng số nhiều và ý nhấn mạnh về số lượng trong nguyên văn, dù cách nói này hơi khác lối diễn đạt quen thuộc.
- source_word: περὶ αὐτόν
  choice: vây quanh mình
  rationale: Diễn đạt tự nhiên vị trí các đám đông ở chung quanh Giê-su; “mình” quy chiếu rõ về chủ ngữ.
- source_word: ἐκέλευσεν
  choice: truyền lệnh
  rationale: Phản ánh sắc thái mệnh lệnh có thẩm quyền mạnh hơn động từ đơn thuần như “bảo”.
- source_word: ἀπελθεῖν
  choice: đi
  rationale: Động từ nguyên mẫu phụ thuộc vào “truyền lệnh”; không thêm người nhận lệnh vì nguyên văn không nêu rõ.
- source_word: εἰς τὸ πέραν
  choice: sang bờ bên kia
  rationale: Cách nói tự nhiên trong tiếng Việt cho việc sang phía đối diện của hồ, phù hợp với ngữ cảnh mà không thêm tên địa điểm.
theological_decisions:
- issue: Chủ thể ngầm của ἀπελθεῖν
  choice: Không nêu rõ người được lệnh đi
  alternative: “truyền cho các môn đồ đi” hoặc “truyền lệnh cho họ đi”
  rationale: Nguyên văn không có tân ngữ hay chủ thể hiển ngôn cho động từ nguyên mẫu; bản dịch giữ sự hàm ẩn thay vì xác định đó là các môn đồ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Không thêm danh hiệu “Chúa” hay “Đức” vì câu Hy Lạp chỉ dùng tên Giê-su với mạo từ. Liên từ δέ được thể hiện qua cấu trúc chuyển cảnh “Khi” thay vì thêm một từ thời gian như “bấy giờ”.
