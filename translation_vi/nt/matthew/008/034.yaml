  source_fidelity: 'Bản dịch nhìn chung bám sát câu Hy Lạp: giữ dấu hiệu diễn ngôn ἰδού, chủ ngữ tập thể πᾶσα ἡ πόλις, hành động đi ra gặp Đức Giê-su, và không suy diễn động cơ của lời thỉnh cầu. Tuy nhiên, “kéo ra” thêm sắc thái một đám đông ùn ùn/đổ ra mà ἐξῆλθεν không tự nó xác định; “đi ra” trung tính và sát hơn. “Vùng của họ” diễn đạt tự nhiên ý lãnh thổ/khu vực của ὅρια trong ngữ cảnh này hơn “địa phận”, vốn có thể gợi đơn vị hành chính hoặc giáo hội.'
