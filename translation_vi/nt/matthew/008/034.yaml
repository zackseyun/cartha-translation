source:
  edition: SBLGNT
  text: καὶ ἰδοὺ πᾶσα ἡ πόλις ἐξῆλθεν εἰς ⸀ὑπάντησιν τῷ Ἰησοῦ, καὶ ἰδόντες αὐτὸν παρεκάλεσαν ὅπως μεταβῇ ἀπὸ τῶν ὁρίων αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/034.yaml
  text: And behold[a], the whole city went out to meet Jesus, and when they saw him, they begged him to depart from their region.
translation:
  language: vi
  text: Kìa, cả thành đi ra để gặp Đức Giê-su; khi thấy Ngài, họ khẩn khoản xin Ngài rời khỏi vùng của họ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “lãnh thổ của họ”; sát nghĩa hơn là “các ranh giới của họ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: Kìa
  rationale: Giữ chức năng thu hút sự chú ý và nét sống động của lời kể, đồng thời tự nhiên trong tiếng Việt hiện đại.
- source_word: πᾶσα ἡ πόλις
  choice: cả thành
  rationale: Diễn đạt dân cư trong thành như một tập thể, phù hợp thành ngữ Hy Lạp mà không nhất thiết khẳng định từng cá nhân đều hiện diện.
- source_word: ἐξῆλθεν
  choice: kéo ra
  rationale: Giữ ý đi ra khỏi thành; “kéo ra” tự nhiên khi chủ ngữ là đông đảo dân chúng và chuyển tải sắc thái tập thể.
- source_word: εἰς ὑπάντησιν τῷ Ἰησοῦ
  choice: gặp Đức Giê-su
  rationale: Diễn đạt tự nhiên thành ngữ chỉ việc đi ra nhằm gặp một người; dùng dạng tên gọi quen thuộc, trang trọng trong tiếng Việt.
- source_word: ἰδόντες αὐτὸν
  choice: khi thấy Ngài
  rationale: Chuyển phân từ bất định quá khứ thành mệnh đề thời gian, giữ đúng trình tự sự việc và tạo câu tiếng Việt trôi chảy.
- source_word: παρεκάλεσαν
  choice: khẩn nài
  rationale: Thể hiện lời yêu cầu tha thiết, mạnh hơn “xin” nhưng không tự thêm động cơ hay thái độ không được câu văn nói rõ.
- source_word: ὅπως μεταβῇ
  choice: Ngài rời khỏi
  rationale: Diễn đạt nội dung lời khẩn nài bằng cấu trúc tự nhiên, đồng thời giữ rõ chủ thể là Đức Giê-su.
- source_word: ἀπὸ τῶν ὁρίων αὐτῶν
  choice: khỏi địa phận của họ
  rationale: ὅρια theo nghĩa đen là ranh giới, nhưng ở đây chỉ vùng lãnh thổ nằm trong các ranh giới ấy; “địa phận” vừa gọn vừa phù hợp ngữ cảnh địa lý.
theological_decisions:
- issue: Lý do dân trong thành xin Đức Giê-su rời đi
  choice: Không nêu động cơ; chỉ thuật lại rằng họ khẩn nài Ngài rời khỏi địa phận của họ.
  alternative: Có thể suy đoán họ sợ quyền năng của Ngài, tức giận vì mất đàn heo, hoặc kinh hãi trước biến cố.
  rationale: Bản Hy Lạp không nói rõ nguyên nhân. Không thêm lời giải thích giúp bảo toàn sự căng thẳng và tính mở của trình thuật.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Kìa” giữ dấu hiệu diễn ngôn ἰδού; “khẩn nài” bảo toàn sức nặng của lời yêu cầu. Đại từ “Ngài” được dùng nhất quán để câu tự nhiên và tôn kính, không thêm một khẳng định thần học ngoài văn bản.
