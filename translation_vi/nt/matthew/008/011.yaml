id: MAT.8.11
reference: Matthew 8:11
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: λέγω δὲ ὑμῖν ὅτι πολλοὶ ἀπὸ ἀνατολῶν καὶ δυσμῶν ἥξουσιν καὶ ἀνακλιθήσονται μετὰ Ἀβραὰμ καὶ Ἰσαὰκ καὶ Ἰακὼβ ἐν τῇ βασιλείᾳ τῶν οὐρανῶν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/011.yaml
  text: But I tell you that many will come from east and west and will recline at table with Abraham and Isaac and Jacob in the kingdom of heaven[a][b].
translation:
  language: vi
  text: 'Nhưng tôi nói với anh em: Nhiều người sẽ đến từ phương đông và phương tây[b], rồi ngồi vào bàn tiệc[a] cùng Áp-ra-ham, Y-sác và Gia-cốp trong Nước Trời.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dịch sát là “nằm nghiêng”; theo phong tục thời ấy, người ta nằm nghiêng bên bàn khi dự tiệc.
    reason: cultural_note
  - marker: b
    text: “Từ phương đông và phương tây” hàm ý những người đến từ các miền xa xôi, có thể bao gồm cả những người ngoài Israel.
    reason: cross_reference
lexical_decisions:
- source_word: λέγω δὲ ὑμῖν
  choice: Nhưng tôi nói với anh em
  rationale: δέ đánh dấu một bước chuyển có sắc thái tương phản nhẹ; “Nhưng” diễn đạt tự nhiên mối liên hệ với lời trước. “Tôi nói với anh em” chuyển tải trực tiếp λέγω ... ὑμῖν bằng tiếng Việt hiện đại.
- source_word: πολλοὶ
  choice: Nhiều người
  rationale: Tính từ được dùng như danh từ; tiếng Việt cần thêm “người” để câu rõ ràng và tự nhiên.
- source_word: ἀπὸ ἀνατολῶν καὶ δυσμῶν
  choice: từ phương đông và phương tây
  rationale: Hai danh từ số nhiều chỉ các hướng hoặc miền rộng lớn. Cách dịch này giữ hình ảnh địa lý mà không thêm rõ “dân ngoại,” điều nguyên văn chỉ hàm ý.
- source_word: ἥξουσιν
  choice: sẽ ... đến
  rationale: Diễn đạt đúng nghĩa đến hoặc đi tới của ἥκω và phù hợp với những người đến từ các miền xa.
- source_word: ἀνακλιθήσονται
  choice: ngồi vào bàn tiệc
  rationale: Động từ theo nghĩa đen nói đến tư thế nằm nghiêng khi dùng bữa thời cổ. Cách dịch này làm rõ bối cảnh yến tiệc cho độc giả hiện đại, còn chi tiết văn hóa được giữ trong chú thích.
- source_word: μετὰ Ἀβραὰμ καὶ Ἰσαὰκ καὶ Ἰακὼβ
  choice: cùng Áp-ra-ham, Y-sác và Gia-cốp
  rationale: μετά với sở hữu cách biểu thị sự đồng hành, ở đây là cùng dự bàn tiệc. Các tên được phiên âm theo lối quen thuộc trong tiếng Việt.
- source_word: ἐν τῇ βασιλείᾳ τῶν οὐρανῶν
  choice: trong vương quốc thiên đàng
  rationale: Giữ cách nói đặc trưng của Ma-thi-ơ và ý niệm về quyền trị vì cùng lãnh vực của trời; dạng số nhiều của οὐρανῶν không cần được sao chép máy móc trong tiếng Việt.
theological_decisions:
- issue: Hình ảnh yến tiệc và sự thông công trong thời sau hết
  choice: Giữ rõ bối cảnh dùng bữa qua cụm “ngồi vào bàn tiệc.”
  alternative: ngồi cùng Áp-ra-ham, Y-sác và Gia-cốp
  rationale: Câu này gợi đến việc cùng dự yến tiệc, không chỉ hiện diện chung một nơi. Bản dịch duy trì sức nặng của hình ảnh nhưng không thêm chi tiết giáo lý ngoài nguyên văn.
- issue: Phạm vi của “nhiều người” từ đông và tây
  choice: Dịch theo địa lý và không thêm “dân ngoại” vào chính văn.
  alternative: Nhiều người thuộc các dân ngoại sẽ đến từ phương đông và phương tây
  rationale: Văn cảnh có thể hàm ý những người ngoài Israel, nhưng câu Hy Lạp chỉ nói “nhiều người” từ đông và tây. Giữ nguyên sự hàm ý tránh giải quyết thay cho độc giả điều nguyên văn không nói thẳng.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “tôi—anh em” để lời nói trực tiếp tự nhiên trong tiếng Việt; “bàn tiệc” truyền đạt bối cảnh văn hóa mà không làm mất hình ảnh của nguyên văn. Các dấu chú thích [a], [b] đều xuất hiện trong chính văn.
