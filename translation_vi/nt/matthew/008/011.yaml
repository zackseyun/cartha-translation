revisions:
- from: 'Nhưng tôi nói với anh em: Nhiều người sẽ từ phương đông và phương tây đến[b], rồi ngồi vào bàn tiệc[a] cùng Áp-ra-ham, Y-sác và Gia-cốp trong vương quốc thiên đàng.'
  to: 'Nhưng tôi nói với anh em: Nhiều người sẽ đến từ phương đông và phương tây[b], rồi ngồi vào bàn tiệc[a] cùng Áp-ra-ham, Y-sác và Gia-cốp trong Nước Trời.'
  rationale: Bản sửa chỉ điều chỉnh trật tự từ cho tự nhiên và thay thuật ngữ «vương quốc thiên đàng» bằng «Nước Trời» để phản ánh chính xác hơn cách nói βασιλεία τῶν οὐρανῶν của Ma-thi-ơ. Hình ảnh bữa tiệc, phạm vi hàm ý của người đến từ đông và tây, cùng các điểm neo chú thích đều được giữ nguyên.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T02:44:09Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch truyền đạt đúng các thành tố chính của câu Hy Lạp: lời chuyển ý với δέ, số lượng bất định «nhiều người», xuất xứ đông–tây, sự đến trong tương lai, sự cùng dự bữa với ba tổ phụ, và bối cảnh «vương quốc của các tầng trời». Tuy nhiên, «vương quốc thiên đàng» dễ chuyển nghĩa βασιλεία τῶν οὐρανῶν thành một địa điểm thiên giới/paradise hơn là cách nói đặc trưng «Nước Trời».'
  naturalness: «Nhiều người sẽ từ phương đông và phương tây đến» có thể hiểu được nhưng trật tự «sẽ ... đến từ» tự nhiên hơn trong tiếng Việt hiện đại. «Ngồi vào bàn tiệc» truyền được ngữ cảnh bữa tiệc, dù chú thích cần tiếp tục nêu rõ hình ảnh nằm nghiêng nguyên thủy.
  terminology: Đề nghị dùng «Nước Trời», cách dịch tiếng Việt vừa tự nhiên vừa đã được xác lập cho βασιλεία τῶν οὐρανῶν trong Ma-thi-ơ. Giữ các tên Áp-ra-ham, Y-sác và Gia-cốp nhất quán với lối phiên âm hiện có.
  issues:
  - severity: medium
    issue: «vương quốc thiên đàng» không phải cách chuyển ngữ tối ưu cho ἐν τῇ βασιλείᾳ τῶν οὐρανῶν.
    rationale: «Thiên đàng» trong tiếng Việt thường chỉ cõi phúc lạc/paradise, trong khi cụm Ma-thi-ơ nói về «vương quốc/quyền trị vì của trời». «Nước Trời» giữ được thuật ngữ đặc trưng, tránh thu hẹp nghĩa.
  - severity: low
    issue: Trật tự từ trong «sẽ từ phương đông và phương tây đến» hơi gượng.
    rationale: «Sẽ đến từ phương đông và phương tây» là trật tự hiện đại tự nhiên hơn, vẫn giữ nguyên quan hệ nghĩa của ἥξουσιν và ἀπὸ ἀνατολῶν καὶ δυσμῶν.
