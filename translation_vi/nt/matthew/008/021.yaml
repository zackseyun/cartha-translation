source:
  edition: SBLGNT
  text: ἕτερος δὲ τῶν ⸀μαθητῶν εἶπεν αὐτῷ· Κύριε, ἐπίτρεψόν μοι πρῶτον ἀπελθεῖν καὶ θάψαι τὸν πατέρα μου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/021.yaml
  text: Then another of the disciples said to him[a], “Lord[b], permit me first to go away and bury my father.”
translation:
  language: vi
  text: 'Một môn đồ khác thưa với Ngài: “Lạy Chúa, xin cho phép[a] con đi chôn cha con[b] trước đã.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “xin để con” hoặc “xin cho con”.'
    reason: lexical_alternative
  - marker: b
    text: Lời xin này có thể nói đến việc mai táng ngay lúc ấy, hoặc hiểu rộng hơn là chu toàn bổn phận làm con cho đến khi cha qua đời; tiếng Hy Lạp không nói rõ.
    reason: cultural_note
lexical_decisions:
- source_word: ἕτερος
  choice: khác
  rationale: Kết hợp trong cụm “một môn đồ khác” để chỉ thêm một người, phân biệt với người vừa nói trước đó.
- source_word: δὲ
  choice: không dịch thành một từ riêng
  rationale: Đây là liên từ nhẹ, chuyển sang người nói tiếp theo; trong tiếng Việt, mạch kể đã được thể hiện tự nhiên bằng “Một môn đồ khác”, nên thêm “rồi” hoặc “nhưng” có thể tạo sắc thái thời gian hay tương phản quá mức.
- source_word: τῶν μαθητῶν
  choice: một môn đồ
  rationale: Cấu trúc nguyên ngữ xác định người nói thuộc nhóm các môn đồ. “Môn đồ” là cách gọi trang trọng, quen thuộc và phù hợp ngữ cảnh.
- source_word: Κύριε
  choice: Lạy Chúa
  rationale: Giữ lối xưng hô kính trọng trực tiếp với Đức Giê-su và không làm mất sắc thái thần học có thể có của κύριος.
- source_word: ἐπίτρεψόν μοι
  choice: xin cho con
  rationale: Diễn đạt tự nhiên một lời xin phép đầy kính trọng trong tiếng Việt; đại từ “con” phù hợp với cách xưng hô “Lạy Chúa”.
- source_word: πρῶτον
  choice: trước đã
  rationale: Giữ ý ưu tiên về trình tự, đồng thời tạo lời nói tự nhiên trong tiếng Việt hiện đại.
- source_word: ἀπελθεῖν
  choice: đi
  rationale: Trong ngữ cảnh xin rời chỗ hiện tại để thực hiện một việc, “đi” diễn đạt đủ ý và tự nhiên hơn “đi khỏi đây”; không thêm một địa điểm mà nguyên ngữ không nêu.
- source_word: θάψαι
  choice: chôn
  rationale: Tương ứng trực tiếp với động từ chỉ việc mai táng và là cách nói thông dụng trong tiếng Việt.
- source_word: τὸν πατέρα μου
  choice: cha con
  rationale: Dịch trực tiếp đối tượng của hành động, đồng thời dùng đại từ sở hữu phù hợp với lời thưa “Lạy Chúa”.
theological_decisions:
- issue: Thời điểm và phạm vi của lời xin đi chôn cha
  choice: Giữ nguyên lời xin đi chôn cha, không xác định người cha vừa qua đời hay người nói muốn ở lại chu toàn bổn phận làm con cho đến khi cha qua đời.
  alternative: Hiểu đây là việc mai táng cấp thời; hoặc hiểu rộng là xin trì hoãn việc theo Chúa cho đến khi hoàn tất bổn phận với cha.
  rationale: Bản văn Hy Lạp không nói rõ người cha đã chết hay chưa. Bản dịch vì thế giữ sự mơ hồ của nguyên ngữ, còn chú thích nêu hai cách hiểu có thể có.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Thưa với Ngài” cùng “Lạy Chúa, xin cho con” tái hiện lời thỉnh cầu kính trọng; “trước đã” giữ sắc thái ưu tiên của πρῶτον mà vẫn tự nhiên trong lời nói tiếng Việt.
