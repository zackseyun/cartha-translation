  naturalness: Văn câu tự nhiên, trang trọng và phù hợp tiếng Việt hiện đại. Tuy nhiên, “xin cho con” có thể hiểu được nhưng hơi rút gọn; “xin cho phép con” rõ ràng và khớp sát hơn với một lời xin phép.
  terminology: “Môn đồ”, “Lạy Chúa”, “cha con”, và “chôn” đều phù hợp ngữ cảnh và giữ được sắc thái kính trọng của lời nói. Không nên giải quyết trong bản văn chính câu hỏi người cha đã chết hay chưa.
  issues:
