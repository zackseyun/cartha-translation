    rationale: “Xin cho phép” và “hãy để cho” nếu đứng riêng không biểu đạt rõ đối tượng “con/tôi” như ἐπίτρεψόν μοι. Nên dùng “xin cho phép con” và “xin để con” để chú thích thực sự tương ứng với lời xin trong câu.
  - severity: low
