base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/001.yaml
  text: When he came down from the mountain[a], large crowds followed him.
translation:
  language: vi
  text: Khi Đức Giê-su từ trên núi xuống, đông đảo dân chúng đi theo ngài.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καταβάντος δὲ αὐτοῦ
  choice: Khi Đức Giê-su ... xuống
  rationale: Kết cấu sở hữu cách tuyệt đối với phân từ bất định quá khứ được chuyển thành mệnh đề thời gian tự nhiên trong tiếng Việt. Chủ thể được nêu rõ là Đức Giê-su theo văn cảnh; δέ chỉ có chức năng nối nhẹ nên không cần dịch riêng.
- source_word: ἀπὸ τοῦ ὄρους
  choice: từ trên núi
  rationale: ὄρος ở đây chỉ ngọn núi đã được nhắc đến trong văn cảnh trước; tiếng Việt tự nhiên dùng “từ trên núi xuống”.
- source_word: ἠκολούθησαν αὐτῷ
  choice: đi theo ngài
  rationale: ἀκολουθέω với bổ ngữ tặng cách diễn tả việc theo sau một người. “Đi theo” rõ nghĩa trong lời kể và không áp đặt thêm sắc thái thần học.
- source_word: ὄχλοι πολλοί
  choice: đông đảo dân chúng
  rationale: Cụm danh từ số nhiều với πολλοί nhấn mạnh số người rất đông. “Đông đảo dân chúng” tự nhiên trong tiếng Việt và truyền đạt ý tập thể đông người mà không gượng ép thành “nhiều đám đông”.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Đức Giê-su” để xác định rõ đại từ theo văn cảnh, và “ngài” làm đại từ tôn kính thông dụng, không mang dấu ấn hệ phái.
