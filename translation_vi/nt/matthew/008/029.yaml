id: MAT.8.29
reference: Matthew 8:29
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ ἔκραξαν λέγοντες· Τί ἡμῖν καὶ ⸀σοί, υἱὲ τοῦ θεοῦ; ἦλθες ὧδε πρὸ καιροῦ βασανίσαι ἡμᾶς;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/029.yaml
  text: And behold[a], they cried out, saying, “What have we to do with you[b], Son of God? Have you come here before the appointed time to torment us?”
translation:
  language: vi
  text: 'Kìa, chúng kêu lớn tiếng: “Ngài muốn gì ở chúng tôi[a], hỡi Con Đức Chúa Trời? Ngài đến đây để hành hạ chúng tôi trước thời điểm đã định[b] sao?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát hơn: “Chúng tôi với ngài có liên can gì?” Đây là một thành ngữ bày tỏ sự xa cách hoặc phản đối sự can thiệp.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “trước thời điểm.” Từ Hy Lạp có thể chỉ một thời điểm đã được ấn định.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ἰδοὺ
  choice: Kìa
  rationale: Giữ chức năng thu hút sự chú ý và tính đột ngột, sống động của lời thuật, thay vì lược bỏ dấu hiệu diễn ngôn này.
- source_word: ἔκραξαν λέγοντες
  choice: chúng la lên rằng
  rationale: “La lên” diễn đạt âm lượng và cường độ của κράζω; “rằng” chuyển tự nhiên ý của phân từ λέγοντες trong tiếng Việt.
- source_word: Τί ἡμῖν καὶ σοί
  choice: Ngài muốn gì ở chúng tôi
  rationale: Đây là một thành ngữ Semit được dùng để tỏ ý xa cách hoặc phản đối sự can thiệp. Cách dịch này truyền đạt tự nhiên sắc thái đối đầu trong tiếng Việt; cách hiểu sát chữ được giữ trong chú thích.
- source_word: υἱὲ τοῦ θεοῦ
  choice: hỡi Con Đức Chúa Trời
  rationale: Dịch trực tiếp danh hiệu mà các quỷ dùng để gọi Đức Giê-su; “hỡi” biểu thị rõ đây là lời xưng hô.
- source_word: ἦλθες ὧδε
  choice: Ngài đến đây
  rationale: Diễn đạt rõ động từ chỉ sự đến và trạng từ địa điểm ὧδε, trong một câu hỏi tập trung vào mục đích của việc Ngài hiện diện tại đó.
- source_word: πρὸ καιροῦ
  choice: trước thời điểm đã định
  rationale: καιρός có thể chỉ một thời điểm thích hợp hoặc đã được ấn định; cách dịch này giữ sắc thái về thời điểm phán xét mà câu hỏi ngụ ý nhưng không xác định ai đã định trong chính câu dịch.
- source_word: βασανίσαι
  choice: để hành hạ
  rationale: Trong ngữ cảnh này, βασανίζω nói đến sự đau đớn nghiêm trọng gắn với hình phạt; “hành hạ” tự nhiên và không giới hạn ý nghĩa vào tra tấn thể xác.
- source_word: ἡμᾶς
  choice: chúng tôi
  rationale: Đại từ số nhiều làm tân ngữ, chỉ các quỷ đang lên tiếng qua những người bị quỷ ám; “chúng tôi” phù hợp khi chúng trực tiếp thưa với Đức Giê-su.
theological_decisions:
- issue: Việc các quỷ nhận biết căn tính của Đức Giê-su
  choice: Con Đức Chúa Trời
  alternative: Con của Đức Chúa Trời
  rationale: Bản Hy Lạp trực tiếp dùng một danh hiệu cao trọng để gọi Đức Giê-su. Cách dịch giữ nguyên sức nặng của lời nhìn nhận này mà không giảm nhẹ hay diễn giải thêm.
- issue: Sắc thái cánh chung của καιρός
  choice: trước thời điểm đã định
  alternative: trước thời điểm
  rationale: Câu hỏi ngụ ý rằng có một thời điểm được ấn định cho sự hành hạ hoặc phán xét. Bản dịch bảo tồn hàm ý ấy mà không đưa vào một hệ thống giáo lý chi tiết hơn điều câu văn nói.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. “Kìa” giữ nét sống động của lời kể; “Ngài muốn gì ở chúng tôi” ưu tiên sự tự nhiên, còn hình thức sát chữ của thành ngữ được bảo tồn trong chú thích. Các dấu chú thích [a], [b] đều được đặt ngay tại cụm từ liên quan.
