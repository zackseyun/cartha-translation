  - severity: low
    issue: Cụm “bày tỏ sự thần phục” trong chú thích
    rationale: προσκυνέω có thể nói đến phủ phục, bái lạy/kính lễ hoặc thờ phượng tùy ngữ cảnh; “thần phục” không phải là cách diễn đạt trung tính, tự nhiên nhất cho toàn bộ dải nghĩa này.
