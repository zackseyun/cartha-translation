source:
  edition: SBLGNT
  text: καὶ ἰδοὺ λεπρὸς ⸀προσελθὼν προσεκύνει αὐτῷ λέγων· Κύριε, ἐὰν θέλῃς δύνασαί με καθαρίσαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/002.yaml
  text: And behold[a], a leper came and bowed down before him, saying, “Lord, if you are willing, you are able to cleanse me.”
translation:
  language: vi
  text: 'Và kìa, một người mắc bệnh phong hủi đến, phủ phục trước Ngài[a] và thưa: “Lạy Chúa, nếu Ngài muốn, Ngài có thể làm cho tôi được sạch.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “thờ lạy Ngài”; động từ Hy Lạp có thể chỉ việc phủ phục để tỏ lòng tôn kính, bái lạy hoặc thờ phượng, tùy ngữ cảnh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: kìa
  rationale: Giữ chức năng hướng sự chú ý và nét sống động của lời kể, đồng thời tự nhiên trong tiếng Việt hiện đại.
- source_word: λεπρὸς
  choice: một người mắc bệnh phong hủi
  rationale: Diễn đạt danh từ hóa chỉ người mắc bệnh ngoài da thường được gọi là phong hủi, nhưng không đồng nhất con người với căn bệnh.
- source_word: προσελθὼν
  choice: đến
  rationale: Diễn đạt gọn và tự nhiên hành động người ấy tiến đến gần Đức Giê-su.
- source_word: προσεκύνει
  choice: phủ phục trước
  rationale: Giữ hành động thể chất cùng sắc thái tôn kính, nhưng không quyết định quá mức rằng động từ ở đây nhất thiết có nghĩa là thờ phượng.
- source_word: Κύριε
  choice: Lạy Chúa
  rationale: Giữ sắc thái kính cẩn của lời trực tiếp và phạm vi ý nghĩa có thể bao gồm cả thẩm quyền lẫn hàm ý Cơ Đốc học.
- source_word: ἐὰν θέλῃς
  choice: nếu ngài muốn
  rationale: Thể hiện tự nhiên điều kiện liên quan đến ý muốn của Đức Giê-su.
- source_word: δύνασαί
  choice: ngài có thể
  rationale: Truyền đạt rõ khả năng và quyền năng mà người bệnh nhìn nhận nơi Đức Giê-su.
- source_word: καθαρίσαι
  choice: làm cho con được sạch
  rationale: Giữ cả chiều kích chữa lành thể chất lẫn sự thanh sạch nghi lễ, thay vì thu hẹp thành 'chữa lành'.
theological_decisions:
- issue: Ý nghĩa của προσκυνέω khi hướng về Đức Giê-su
  choice: phủ phục trước ngài
  alternative: thờ lạy ngài
  rationale: Động từ có thể chỉ phủ phục, bày tỏ lòng tôn kính hoặc thờ phượng. Bản dịch chính giữ nguyên độ mở thần học của ngữ cảnh; chú thích nêu cách hiểu mạnh hơn.
- issue: Sắc thái của κύριε
  choice: Lạy Chúa
  alternative: Thưa ngài
  rationale: “Lạy Chúa” bảo tồn cách xưng hô kính cẩn và khả năng mang ý nghĩa Cơ Đốc học, trong khi “Thưa ngài” có thể làm yếu phạm vi ấy.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “ngài” trong lời kể và “con” trong lời cầu xin để thể hiện sự kính cẩn; “phủ phục” giữ hình ảnh cụ thể mà không giải quyết thay độc giả sắc thái thờ phượng.
