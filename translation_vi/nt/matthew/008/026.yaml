revisions:
- from: 'Ngài phán với họ: “Sao các con nhát sợ thế, hỡi những người ít đức tin?” Rồi Ngài đứng dậy, quở gió và biển; lập tức biển lặng như tờ.'
  to: 'Ngài nói với họ: “Sao các con lại khiếp sợ như vậy, hỡi những người ít đức tin?” Rồi Ngài đứng dậy, quở gió và biển, và biển trở nên lặng yên hoàn toàn.'
  rationale: Sửa cách diễn đạt không tự nhiên “nhát sợ” thành “khiếp sợ,” bỏ “lập tức” vì không có trong nguyên văn, và diễn đạt kết quả γαλήνη μεγάλη cách trực tiếp, tự nhiên. Không có chú thích cần thiết vì câu không chứa biến thể văn bản hoặc thuật ngữ cần giải thích để bảo toàn nghĩa.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T02:44:10Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch phản ánh đúng trình tự chính: Chúa Giê-su nói, đứng dậy, quở gió và biển, rồi có sự yên lặng lớn. Tuy nhiên, “lập tức” không có trong nguyên văn, còn “nhát sợ” không phải cách diễn đạt tiếng Việt chuẩn cho δειλοί. Bản sửa dùng “khiếp sợ” để giữ sắc thái sợ hãi/nhút nhát mạnh hơn sợ thông thường, và diễn đạt γαλήνη μεγάλη là sự lặng yên hoàn toàn mà không thêm yếu tố thời gian.'
  naturalness: “Nhát sợ” không tự nhiên trong tiếng Việt hiện đại. “Sao các con lại khiếp sợ như vậy” tự nhiên, trang nghiêm và phù hợp ngữ cảnh. “Biển trở nên lặng yên hoàn toàn” rõ nghĩa, tránh thành ngữ hóa quá mức và không thêm “lập tức.”
  terminology: “Ít đức tin” giữ sát ὀλιγόπιστοι và phù hợp thuật ngữ Cơ Đốc giáo phổ thông. “Quở” diễn đạt thích hợp ἐπετίμησεν, tức lời quở trách/truyền lệnh đầy thẩm quyền đối với gió và biển. “Ngài” giữ register trang trọng nhất quán.
  issues:
  - severity: medium
    issue: “nhát sợ” là cách kết hợp từ không tự nhiên trong tiếng Việt hiện đại.
    rationale: δειλοί chỉ sự sợ hãi, nhút nhát hoặc khiếp đảm; “khiếp sợ” truyền đạt tự nhiên sắc thái này mà không chuyển thành lời kết án mạnh hơn như “hèn nhát.”
  - severity: medium
    issue: Từ “lập tức” thêm một chi tiết thời gian không được nêu trong câu Hy Lạp.
    rationale: Nguyên văn nói tiếp rằng đã có một sự yên lặng lớn; không có trạng từ tương đương “ngay lập tức.”
  - severity: low
    issue: “Biển lặng như tờ” là thành ngữ tự nhiên nhưng không nêu rõ trực tiếp mức độ “lớn/lao” của γαλήνη μεγάλη.
    rationale: “Trở nên lặng yên hoàn toàn” diễn đạt minh bạch kết quả và cường độ của sự yên lặng, đồng thời tránh bổ sung thời điểm.
