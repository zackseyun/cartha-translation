  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ λέγει αὐτοῖς· Τί δειλοί ἐστε, ὀλιγόπιστοι; τότε ἐγερθεὶς ἐπετίμησεν τοῖς ἀνέμοις καὶ τῇ θαλάσσῃ, καὶ ἐγένετο γαλήνη μεγάλη.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/026.yaml
  text: And he said to them, “Why are you fearful, you of little faith?” Then, having risen, he rebuked the winds and the sea, and there was a great calm.
translation:
  language: vi
  text: 'Ngài nói với họ: “Sao các con lại khiếp sợ như vậy, hỡi những người ít đức tin?” Rồi Ngài đứng dậy, quở gió và biển, và biển trở nên lặng yên hoàn toàn.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δειλοί
  choice: nhát sợ
  rationale: 'Diễn đạt sắc thái mạnh hơn nỗi sợ thông thường: sự khiếp nhược, thiếu can đảm trước hiểm nguy.'
- source_word: ὀλιγόπιστοι
  choice: những người ít đức tin
  rationale: Giữ trực tiếp ý nghĩa của từ Hy Lạp và lời quở trách về đức tin yếu kém, không diễn giải thành hoàn toàn không có đức tin.
- source_word: ἐπετίμησεν
  choice: quở
  rationale: Tái hiện hành động truyền lệnh, trách cứ đầy thẩm quyền hướng đến gió và biển.
- source_word: γαλήνη μεγάλη
  choice: biển lặng như tờ
  rationale: Thành ngữ Việt tự nhiên diễn tả trạng thái hoàn toàn yên lặng sau cơn bão và chuyển tải sức nhấn mạnh của tính từ μεγάλη.
theological_decisions:
- issue: Cách gọi các môn đồ trong ὀλιγόπιστοι
  choice: những người ít đức tin
  alternative: những kẻ kém tin
  rationale: 'Giữ đúng mức độ của nguyên văn: đức tin ít hoặc yếu, không hàm ý họ hoàn toàn vô tín.'
- issue: Chủ thể của γαλήνη μεγάλη
  choice: biển lặng như tờ
  alternative: trời biển hoàn toàn yên lặng
  rationale: Ngữ cảnh cho thấy sự lặng yên của biển sau khi gió và biển bị quở; cách dịch không thêm một kết luận thần học ngoài câu.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và dễ hiểu. Dùng “Ngài” cho Chúa Giê-su và “các con” trong lời Ngài nói với môn đồ; giữ nhịp kể ngắn, mạnh của nguyên văn.
