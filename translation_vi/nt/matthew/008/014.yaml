source:
  edition: SBLGNT
  text: Καὶ ἐλθὼν ὁ Ἰησοῦς εἰς τὴν οἰκίαν Πέτρου εἶδεν τὴν πενθερὰν αὐτοῦ βεβλημένην καὶ πυρέσσουσαν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/014.yaml
  text: And when Jesus came into Peter’s house[b][a], he saw his mother-in-law lying down and having a fever.
translation:
  language: vi
  text: Khi Đức Giê-su vào nhà ông Phi-e-rơ, ngài thấy mẹ vợ của ông đang nằm và bị sốt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλθὼν
  choice: Khi Đức Giê-su vào
  rationale: Phân từ bất định diễn tả thời điểm và diễn tiến trước hành động chính; “khi... vào” tự nhiên trong tiếng Việt và phù hợp với εἰς.
- source_word: οἰκίαν Πέτρου
  choice: nhà ông Phi-e-rơ
  rationale: Diễn đạt trực tiếp quan hệ sở hữu của danh cách Hy Lạp, bằng lối nói tự nhiên trong tiếng Việt.
- source_word: πενθερὰν αὐτοῦ
  choice: mẹ vợ của ông
  rationale: πενθερά có nghĩa cụ thể là mẹ vợ; “ông” chỉ Phi-e-rơ theo cú pháp và văn cảnh, tránh khiến đại từ bị hiểu là chỉ Đức Giê-su.
- source_word: βεβλημένην
  choice: đang nằm
  rationale: Phân từ hoàn thành bị động của βάλλω được dùng theo nghĩa trạng thái là nằm hoặc đã được đặt nằm; bản dịch giữ ý trạng thái mà không thêm “trên giường,” điều nguyên văn không nói rõ.
- source_word: πυρέσσουσαν
  choice: bị sốt
  rationale: Phân từ hiện tại mô tả tình trạng sốt đang tiếp diễn; “bị sốt” là cách diễn đạt ngắn gọn, tự nhiên và không cường điệu mức độ bệnh.
theological_decisions:
- issue: Sở chỉ của αὐτοῦ trong cụm “mẹ vợ của ông”
  choice: Đại từ chỉ Phi-e-rơ; người phụ nữ là mẹ vợ của Phi-e-rơ.
  alternative: Nếu diễn đạt mơ hồ, người đọc có thể lầm tưởng đại từ chỉ Đức Giê-su.
  rationale: Cú pháp và văn cảnh gắn ngôi nhà cùng người mẹ vợ với Phi-e-rơ. Bản dịch làm rõ sở chỉ nhưng không suy diễn thêm kết luận thần học ngoài câu văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Giê-su” và “ông Phi-e-rơ” theo lối gọi tên kính trọng, tự nhiên; dùng “ngài” cho chủ thể Đức Giê-su ở mệnh đề sau để tránh lặp tên. Không thêm “trên giường” vì chi tiết ấy chỉ được hàm ý bởi bối cảnh.
