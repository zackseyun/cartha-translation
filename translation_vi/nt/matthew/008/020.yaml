id: MAT.8.20
reference: Matthew 8:20
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ λέγει αὐτῷ ὁ Ἰησοῦς· Αἱ ἀλώπεκες φωλεοὺς ἔχουσιν καὶ τὰ πετεινὰ τοῦ οὐρανοῦ κατασκηνώσεις, ὁ δὲ υἱὸς τοῦ ἀνθρώπου οὐκ ἔχει ποῦ τὴν κεφαλὴν κλίνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/020.yaml
  text: And Jesus says to him[a], “Foxes have dens, and the birds of the sky have nests[d][c][b], but the Son of Man has nowhere to lay his head.”
translation:
  language: vi
  text: 'Đức Giê-su nói với người ấy: “Cáo có hang, chim trời có tổ, nhưng Con Người[a] không có chỗ gối đầu.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Con Người” là danh xưng Đức Giê-su dùng để tự nói về mình; cũng có thể hiểu theo nghĩa sát chữ là “con của loài người”.
    reason: alternative_reading
lexical_decisions:
- source_word: λέγει
  choice: nói
  rationale: Tiếng Việt không biểu thị thì theo cách của tiếng Hy Lạp; “nói” tự nhiên trong lời kể và không cần thêm dấu hiệu quá khứ.
- source_word: ἀλώπεκες
  choice: cáo
  rationale: Tương đương trực tiếp, tự nhiên; danh từ tiếng Việt không cần biến đổi hình thái số nhiều.
- source_word: φωλεοὺς
  choice: hang
  rationale: “Hang” là cách gọi tự nhiên về nơi trú của cáo và giữ được hình ảnh cụ thể của nguyên ngữ.
- source_word: πετεινὰ τοῦ οὐρανοῦ
  choice: chim trời
  rationale: Thành ngữ tiếng Việt gọn, tự nhiên, chỉ các loài chim trên trời mà không mang nghĩa thần học không cần thiết của “thiên đàng”.
- source_word: κατασκηνώσεις
  choice: tổ
  rationale: Trong ngữ cảnh loài chim, “tổ” diễn đạt tự nhiên nơi chúng trú ngụ, dù từ Hy Lạp có nghĩa rộng hơn là chỗ ở hay chỗ đậu.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Con Người
  rationale: Giữ nguyên danh xưng tự chỉ của Đức Giê-su cùng âm hưởng và tính đa nghĩa thần học, thay vì diễn giải thành một cách gọi thuần túy về con người.
- source_word: ποῦ ... οὐκ ἔχει
  choice: không có chỗ
  rationale: Cách diễn đạt tự nhiên trong tiếng Việt cho cấu trúc phủ định mang nghĩa “không nơi nào”.
- source_word: τὴν κεφαλὴν κλίνῃ
  choice: gối đầu
  rationale: Thành ngữ tiếng Việt cô đọng và cụ thể, diễn tả việc ngả hoặc đặt đầu xuống để nghỉ.
theological_decisions:
- issue: Cách dịch danh xưng ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Con Người
  alternative: con người / Đấng Làm Người
  rationale: “Con Người” bảo tồn danh xưng quen thuộc, khả năng liên hệ với Đa-ni-ên 7, và sự căng thẳng giữa nghĩa thành ngữ với ý nghĩa thần học; các phương án kia dễ thu hẹp hoặc diễn giải quá mức.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Giê-su” theo lối viết Công giáo phổ biến nhưng câu dịch không đưa vào nét giáo phái; cấu trúc đối xứng và hình ảnh súc tích của nguyên văn được giữ lại.
