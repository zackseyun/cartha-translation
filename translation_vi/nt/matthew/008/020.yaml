  source_fidelity: 'Bản dịch phản ánh chính xác cấu trúc và ý chính của Hy Lạp: λέγει được diễn đạt tự nhiên bằng “nói”; “cáo có hang” tương ứng ἀλώπεκες φωλεούς ἔχουσιν; “chim trời có tổ” diễn đạt tự nhiên πετεινὰ τοῦ οὐρανοῦ κατασκηνώσεις; và phủ định “không có chỗ gối đầu” chuyển đạt đúng οὐκ ἔχει ποῦ τὴν κεφαλὴν κλίνῃ. Tương phản giữa nơi trú của loài vật và sự thiếu chỗ nghỉ của Con Người được giữ nguyên.'
