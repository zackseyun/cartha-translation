  verdict: revise
  source_fidelity: Bản nháp truyền đạt đúng các hành động chính và giữ được trường nghĩa “làm sạch” của καθαρίζω. Tuy nhiên, ἐκτείνας được thể hiện đầy đủ và rõ hơn bằng “giơ tay ra,” còn mệnh đề kết quả nên giữ “bệnh phong của người ấy” làm chủ ngữ như nguyên văn.
  naturalness: “Hãy được sạch!” và nhất là “người ấy được sạch bệnh phong hủi” không tự nhiên trong tiếng Việt chuẩn hiện đại. “Hãy sạch đi!” là mệnh lệnh tự nhiên; “bệnh phong của người ấy liền được sạch” giữ được cách nói thanh sạch mà vẫn dễ hiểu trong văn phong Kinh Thánh.
  terminology: “Ta sẵn lòng” phù hợp ngữ cảnh và không áp đặt sắc thái tương lai cho Θέλω. Dùng “bệnh phong” trong chính văn là thuật ngữ Kinh Thánh quen thuộc; chú thích cần nêu rõ phạm vi λέπρα không đồng nhất tất yếu với bệnh Hansen hiện đại. “Đức Giê-su” và đại từ “người ấy” phù hợp văn phong tôn trọng, hiện đại.
  issues:
