    issue: Cách diễn đạt mệnh lệnh “hãy được sạch” không tự nhiên.
    rationale: Dù phản ánh thể bị động Hy Lạp, tiếng Việt không thường dùng “hãy được sạch” như một mệnh lệnh. “Hãy sạch đi!” diễn đạt tự nhiên mệnh lệnh làm sạch mà không đổi nghĩa.
  - severity: medium
    issue: Mệnh đề kết quả “người ấy được sạch bệnh phong hủi” vừa gượng vừa đổi chủ ngữ ngữ pháp.
    rationale: Nguyên văn nói trực tiếp rằng “bệnh phong của người ấy” được sạch. Cấu trúc đã sửa giữ chủ ngữ này và liên kết từ vựng với mệnh lệnh.
  - severity: low
    issue: “Đưa tay” chưa biểu đạt tường minh hướng vươn/giơ ra của ἐκτείνας.
    rationale: “Giơ tay ra” là cách nói tự nhiên hơn, biểu đạt rõ cử chỉ trước khi chạm.
