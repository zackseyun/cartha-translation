id: MAT.8.3
reference: Matthew 8:3
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἐκτείνας τὴν χεῖρα ἥψατο ⸀αὐτοῦ λέγων· Θέλω, καθαρίσθητι· καὶ εὐθέως ἐκαθαρίσθη αὐτοῦ ἡ λέπρα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/003.yaml
  text: And stretching out his hand[a], he touched him, saying, “I am willing[c][b]; be cleansed.” And immediately his leprosy was cleansed.
translation:
  language: vi
  text: 'Đức Giê-su giơ tay ra, chạm vào người ấy và nói: “Ta sẵn lòng[a]; hãy sạch đi!” Ngay lập tức, bệnh phong[b] của người ấy liền được sạch.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “Ta muốn.”'
    reason: lexical_alternative
  - marker: b
    text: Từ Hy Lạp được dịch là “bệnh phong” có thể chỉ nhiều chứng bệnh da nghiêm trọng, chứ không nhất thiết chỉ bệnh Hansen theo cách phân loại y học hiện đại.
    reason: cultural_note
lexical_decisions:
- source_word: ἐκτείνας τὴν χεῖρα
  choice: đưa tay
  rationale: Diễn đạt tự nhiên trong tiếng Việt hiện đại hành động đưa tay ra trước khi chạm, không thêm ý nghĩa ngoài nguyên văn.
- source_word: ἥψατο αὐτοῦ
  choice: chạm vào người ấy
  rationale: ἅπτομαι với bổ ngữ sở hữu cách ở đây mang nghĩa thông thường là chạm vào; cách dịch này rõ ràng và phù hợp bối cảnh chữa lành.
- source_word: Θέλω
  choice: Ta sẵn lòng
  rationale: Trong lời đáp lại câu hỏi về ý muốn của Đức Giê-su, cách diễn đạt này truyền đạt sự ưng thuận tự nguyện một cách tự nhiên; chú thích giữ lại khả năng dịch sát là “Ta muốn”.
- source_word: καθαρίσθητι
  choice: hãy được sạch
  rationale: Giữ hình thái mệnh lệnh thụ động cùng trường nghĩa thanh sạch, bao gồm cả phương diện thân thể lẫn tình trạng ô uế, thay vì chỉ diễn đạt là được chữa lành.
- source_word: εὐθέως
  choice: ngay lập tức
  rationale: Truyền đạt trực tiếp sự xảy ra tức thời được Μα-thi-ơ nhấn mạnh.
- source_word: ἐκαθαρίσθη
  choice: được sạch
  rationale: Lặp lại từ ngữ của καθαρίσθητι để bảo toàn mối liên hệ giữa mệnh lệnh và kết quả, đồng thời không thu hẹp ý nghĩa thành chữa bệnh đơn thuần.
- source_word: ἡ λέπρα
  choice: bệnh phong hủi
  rationale: Dùng thuật ngữ Kinh Thánh quen thuộc và dễ nhận biết; chú thích giải thích rằng λέπρα có phạm vi rộng hơn bệnh Hansen theo phân loại y học hiện đại.
theological_decisions:
- issue: Trường nghĩa thanh sạch/chữa lành của καθαρίζω
  choice: Dùng “sạch” trong cả mệnh lệnh lẫn kết quả
  alternative: Dùng “chữa lành” hoặc “khỏi bệnh”
  rationale: Nguyên văn nhấn mạnh việc làm cho sạch, có cả chiều kích thân thể và thanh sạch theo nghi lễ; chỉ dịch là chữa lành sẽ làm mất lớp nghĩa này.
- issue: Ý nghĩa của Θέλω trong lời đáp
  choice: Ta sẵn lòng
  alternative: Ta muốn
  rationale: Câu trước đặt vấn đề Đức Giê-su có muốn hay không; “Ta sẵn lòng” thể hiện sự ưng thuận trong ngữ cảnh mà không biến động từ thành một lời nói về tương lai. Chú thích bảo tồn cách dịch sát hơn.
- issue: Chủ ngữ của mệnh đề kết quả
  choice: Diễn đạt tự nhiên là “người ấy được sạch bệnh phong hủi”
  alternative: Dịch sát cấu trúc là “bệnh phong hủi của người ấy được sạch”
  rationale: Trong tiếng Hy Lạp, “bệnh phong hủi của người ấy” là chủ ngữ ngữ pháp. Tiếng Việt hiện đại diễn đạt tự nhiên hơn bằng cách lấy người bệnh làm chủ thể trải nghiệm, trong khi vẫn giữ động từ “được sạch” và toàn bộ nội dung.
translation_notes:
  register: Văn phong trang trọng, sáng rõ và phù hợp tiếng Việt tiêu chuẩn hiện đại. “Đức Giê-su” xác định rõ chủ thể theo văn cảnh; “người ấy” tránh cách gọi mang tính kỳ thị. Cấu trúc kết quả được điều chỉnh nhẹ cho tự nhiên trong tiếng Việt nhưng vẫn giữ trường nghĩa thanh sạch của nguyên văn.
