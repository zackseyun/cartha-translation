source:
  edition: SBLGNT
  text: καὶ εἶπεν ὁ Ἰησοῦς τῷ ἑκατοντάρχῃ· Ὕπαγε, ⸀ὡς ἐπίστευσας γενηθήτω σοι· καὶ ἰάθη ὁ ⸀παῖς ἐν τῇ ὥρᾳ ἐκείνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/013.yaml
  text: And Jesus said to the centurion[a], “Go; as you have believed, let it be done for you.” And the servant was healed in that hour.
translation:
  language: vi
  text: 'Đức Giê-su nói với viên đại đội trưởng: “Hãy đi; ông đã tin thế nào thì sẽ được cho ông như thế ấy.” Và người đầy tớ[a] được chữa lành ngay lúc đó.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “cậu bé” hoặc “người trẻ tuổi”; từ Hy Lạp παῖς có thể chỉ người đầy tớ hoặc người trẻ. Trong ngữ cảnh này, “người đầy tớ” phù hợp nhất vì người ấy ở dưới quyền viên đại đội trưởng.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἑκατοντάρχῃ
  choice: viên đại đội trưởng
  rationale: Chỉ sĩ quan La Mã chỉ huy một đơn vị khoảng một trăm lính; cách gọi này chính xác về chức vụ và dễ hiểu trong tiếng Việt hiện đại.
- source_word: Ὕπαγε
  choice: Hãy đi
  rationale: Mệnh lệnh yêu cầu rời đi; bản dịch ngắn gọn, tự nhiên và không thêm ý.
- source_word: ὡς ἐπίστευσας
  choice: ông đã tin thế nào
  rationale: Giữ dạng động từ và hành động tin của viên đại đội trưởng, đồng thời để ngỏ sắc thái của ὡς về mức độ hoặc sự tương ứng.
- source_word: γενηθήτω σοι
  choice: điều ấy sẽ được thực hiện cho ông thế ấy
  rationale: Diễn đạt tự nhiên mệnh lệnh thụ động mang sắc thái chuẩn thuận, đồng thời kết hợp với cấu trúc tương ứng ὡς… để bảo toàn ý 'như ông đã tin'.
- source_word: παῖς
  choice: người đầy tớ
  rationale: Trong ngữ cảnh người dưới quyền của viên đại đội trưởng và sự tương ứng với δοῦλος ở phần trước, nghĩa 'đầy tớ' phù hợp nhất; các nghĩa chỉ người trẻ được giữ trong chú thích.
- source_word: ἰάθη
  choice: được chữa lành
  rationale: Giữ thể bị động và nghĩa được phục hồi khỏi bệnh của ἰάομαι.
- source_word: ἐν τῇ ὥρᾳ ἐκείνῃ
  choice: ngay giờ đó
  rationale: Giữ hình ảnh 'giờ đó' của nguyên văn, còn 'ngay' truyền đạt sự trùng hợp tức thời được ngữ cảnh nhấn mạnh mà không đổi thành 'khoảnh khắc'.
theological_decisions:
- issue: Cách dịch ngôn ngữ πιστεύω/πίστις
  choice: đã tin
  alternative: đã tin cậy; có đức tin
  rationale: Dạng động từ 'tin' trực tiếp phản ánh ἐπίστευσας và không chuyển thành danh từ mang tính diễn giải; cũng không xác định thêm đối tượng hay nội dung của niềm tin ngoài điều văn mạch nói.
- issue: Mối liên hệ giữa niềm tin và sự chữa lành trong ὡς… γενηθήτω
  choice: ông đã tin thế nào thì điều ấy sẽ được thực hiện cho ông thế ấy
  alternative: hãy được nên cho ông theo đức tin của ông
  rationale: Giữ mối tương ứng do ὡς biểu thị mà không biến câu thành một nguyên tắc thần học tổng quát về đức tin hoặc giải thích cơ chế của sự chữa lành.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Giê-su” và đại từ “ông” phù hợp lối kể Kinh Thánh tiếng Việt; cấu trúc lời phán giữ tính cô đọng và trang nghiêm của nguyên văn.
