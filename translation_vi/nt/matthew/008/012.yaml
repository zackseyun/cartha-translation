id: MAT.8.12
reference: Matthew 8:12
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οἱ δὲ υἱοὶ τῆς βασιλείας ἐκβληθήσονται εἰς τὸ σκότος τὸ ἐξώτερον· ἐκεῖ ἔσται ὁ κλαυθμὸς καὶ ὁ βρυγμὸς τῶν ὀδόντων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/012.yaml
  text: But the sons of the kingdom will be cast out into the outer darkness[c][b][a]. There will be weeping and gnashing of teeth there.
translation:
  language: vi
  text: Nhưng những người con của vương quốc[a] sẽ bị quăng ra chốn tối tăm bên ngoài. Ở đó sẽ có tiếng khóc lóc và nghiến răng.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát: “những con trai của vương quốc”; đây là thành ngữ chỉ những người được xem là đương nhiên thuộc về hoặc có quyền thừa hưởng vương quốc.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ υἱοὶ τῆς βασιλείας
  choice: Nhưng những người con của vương quốc
  rationale: “Nhưng” thể hiện sự tương phản với câu trước. “Những người con của vương quốc” giữ hình ảnh quan hệ gia đình và sắc thái chỉ những người vốn được xem là thuộc về hoặc có quyền thừa hưởng vương quốc, nhưng tự nhiên hơn trong tiếng Việt hiện đại so với “các con trai của vương quốc”.
- source_word: ἐκβληθήσονται
  choice: sẽ bị quăng ra
  rationale: Dạng tương lai bị động và sắc thái mạnh của ἐκβάλλω được giữ lại bằng “bị quăng ra”, diễn tả sự loại trừ cưỡng bức.
- source_word: τὸ σκότος τὸ ἐξώτερον
  choice: chốn tối tăm bên ngoài
  rationale: Giữ nguyên hình ảnh phán xét của bản Hy Lạp mà không diễn giải thành một thuật ngữ thần học cụ thể; “chốn” tạo văn phong trang trọng nhưng vẫn dễ hiểu.
- source_word: κλαυθμὸς
  choice: tiếng khóc lóc
  rationale: Diễn đạt sự than khóc, đau đớn mà không gia tăng mức độ vượt quá từ Hy Lạp.
- source_word: βρυγμὸς τῶν ὀδόντων
  choice: nghiến răng
  rationale: Đây là cách nói tự nhiên và quen thuộc trong tiếng Việt, phản ánh chính xác hành động được mô tả.
- source_word: ἐκεῖ
  choice: Ở đó
  rationale: Đặt ở đầu câu để giữ sự nhấn mạnh vị trí như trật tự của bản Hy Lạp.
theological_decisions:
- issue: Hình ảnh về sự loại trừ và phán xét
  choice: Giữ nguyên hình ảnh bị quăng ra chốn tối tăm bên ngoài, nơi có khóc lóc và nghiến răng.
  alternative: Diễn giải trực tiếp là “địa ngục” hoặc “hình phạt đời đời”.
  rationale: Câu Hy Lạp mô tả sự loại trừ nghiêm trọng bằng hình ảnh phán xét nhưng không dùng các thuật ngữ diễn giải ấy; bản dịch không nên xây dựng một hệ thống thần học rộng hơn lời văn.
- issue: Cách dịch υἱοὶ trong thành ngữ υἱοὶ τῆς βασιλείας
  choice: những người con của vương quốc
  alternative: các con trai của vương quốc; những người thừa kế vương quốc
  rationale: “Người con” bảo toàn ẩn dụ thân thuộc và tư cách được mặc nhiên xem là thuộc về vương quốc. “Con trai” sát hình thức giống đực nhưng rất gượng trong tiếng Việt và dễ bị hiểu thuần túy theo giới tính; “người thừa kế” lại giải nghĩa quá mức.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “vương quốc” để giữ danh từ βασιλεία, “chốn tối tăm bên ngoài” để bảo toàn hình ảnh, và cấu trúc “Ở đó sẽ có…” để phản ánh điểm nhấn của ἐκεῖ.
