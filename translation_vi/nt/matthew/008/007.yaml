  text: ⸀καὶ λέγει ⸀αὐτῷ· Ἐγὼ ἐλθὼν θεραπεύσω αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/007.yaml
  text: And he says to him[a], “I will come and heal him.”
translation:
  language: vi
  text: 'Ngài nói với ông[a]: “Ta sẽ đến và chữa lành người ấy.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc có thể hiểu là: “Ta sẽ đến và chữa lành người ấy sao?” Một số người giải thích lời Đức Giê-su là câu hỏi dựa vào ngữ cảnh, nhưng cách diễn đạt Hy Lạp tự nhiên hơn khi được đọc là câu khẳng định.'
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ
  choice: Không dịch riêng
  rationale: Liên từ nối tiếp lời kể; trong tiếng Việt, chuyển thẳng sang động từ tạo câu tự nhiên mà không làm mất quan hệ nối kết với câu trước.
- source_word: λέγει
  choice: nói
  rationale: Thì hiện tại lịch sử tạo sắc thái sống động. Tiếng Việt không biến đổi động từ theo thì, nên “nói” vừa tự nhiên vừa giữ được tính trực tiếp của nguyên văn.
- source_word: αὐτῷ
  choice: với ông
  rationale: Đại từ ở cách dữ chỉ người được Đức Giê-su đáp lời; “với ông” là cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: Ἐγὼ
  choice: Ta
  rationale: Đại từ được nêu rõ trong tiếng Hy Lạp và có phần nhấn mạnh. “Ta” phù hợp với lời Đức Giê-su trong văn phong Kinh Thánh trang trọng, đồng thời không cường điệu thành “chính Ta”.
- source_word: ἐλθὼν
  choice: sẽ đến
  rationale: Phân từ bất định đi trước động từ tương lai diễn tả hành động đi kèm hoặc xảy ra trước; kết cấu “sẽ đến chữa lành” truyền đạt tự nhiên trình tự ấy.
- source_word: θεραπεύσω
  choice: chữa lành
  rationale: Trong bối cảnh chữa bệnh, cụm từ này diễn đạt rõ hành động phục hồi sức khỏe và phù hợp văn phong Kinh Thánh hiện đại.
- source_word: αὐτόν
  choice: người ấy
  rationale: Đại từ chỉ người đầy tớ đang đau bệnh. “Người ấy” giữ quy chiếu giống đực của nguyên văn theo cách tự nhiên hơn “ông ấy” trong ngữ cảnh người chủ nói về đầy tớ.
theological_decisions:
- issue: Nên hiểu lời Đức Giê-su là câu khẳng định hay câu hỏi
  choice: 'Câu khẳng định: “Ta sẽ đến chữa lành cho người ấy.”'
  alternative: 'Câu hỏi: “Ta sẽ đến chữa lành cho người ấy sao?” hoặc “Ta có nên đến chữa lành cho người ấy không?”'
  rationale: Bản Hy Lạp không có tiểu từ nghi vấn và theo cú pháp tự nhiên được đọc như một lời khẳng định. Tuy nhiên, vì ngữ cảnh khiến một số người hiểu đây là câu hỏi, phương án ấy được giữ trong chú thích thay vì bị loại bỏ.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” trong lời kể và “Ta” trong lời trực tiếp của Đức Giê-su; tránh lối diễn đạt cổ hoặc quá khẩu ngữ. Dấu chú thích [a] đặt ngay sau mệnh đề dẫn để báo hiệu phương án hiểu toàn bộ lời nói.
