id: MAT.8.6
reference: Matthew 8:6
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ λέγων· Κύριε, ὁ παῖς μου βέβληται ἐν τῇ οἰκίᾳ παραλυτικός, δεινῶς βασανιζόμενος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/006.yaml
  text: and saying[a], “Lord, my servant is lying paralyzed at home[b], suffering terribly.”
translation:
  language: vi
  text: 'và thưa: “Lạy Chúa, đầy tớ của tôi[a] đang nằm liệt ở nhà, đau đớn dữ dội[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “cậu bé của tôi” hoặc “con trẻ của tôi”; từ Hy Lạp này có thể chỉ một đầy tớ hoặc một đứa trẻ, nhưng “đầy tớ” phù hợp nhất với bối cảnh viên đại đội trưởng.'
    reason: lexical_alternative
  - marker: b
    text: 'Hay: “đang bị hành hạ khủng khiếp.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ λέγων
  choice: và thưa
  rationale: Giữ liên kết bằng phân từ với câu trước, đồng thời dùng cách dẫn lời tự nhiên trong tiếng Việt; “thưa” phù hợp với lời nói kính trọng hướng đến Chúa Giê-su.
- source_word: Κύριε
  choice: Lạy Chúa
  rationale: “Chúa” giữ được khả năng đây vừa là lời xưng hô kính trọng vừa có ý nghĩa cao hơn; “Lạy” tạo sắc thái trực tiếp, trang trọng mà không buộc phải giải nghĩa mức độ nhận biết của viên đại đội trưởng.
- source_word: ὁ παῖς μου
  choice: đầy tớ của tôi
  rationale: παῖς có thể chỉ đầy tớ, cậu bé hoặc con trẻ. Trong bối cảnh viên đại đội trưởng, “đầy tớ” phù hợp nhất, còn sự đa nghĩa được ghi ở chú thích.
- source_word: βέβληται ἐν τῇ οἰκίᾳ παραλυτικός
  choice: đang nằm liệt ở nhà
  rationale: Thể hoàn thành bị động của βάλλω diễn tả tình trạng đã bị đặt nằm và hiện vẫn nằm; cách nói “đang nằm liệt ở nhà” truyền đạt trạng thái ấy tự nhiên, đồng thời thể hiện παραλυτικός.
- source_word: δεινῶς βασανιζόμενος
  choice: đau đớn dữ dội
  rationale: Cụm từ diễn tả sự hành hạ, đau đớn nghiêm trọng. Bản dịch chính dùng cách nói rõ ràng, tự nhiên; sắc thái mạnh hơn của βασανίζω được giữ trong chú thích.
theological_decisions:
- issue: Sắc thái của Κύριε khi xưng hô với Chúa Giê-su
  choice: Lạy Chúa
  alternative: Thưa ngài
  rationale: Nguyên ngữ có thể là lời xưng hô kính trọng hoặc hàm ý sự nhìn nhận cao hơn. “Lạy Chúa” giữ chiều sâu thần học có thể có của danh xưng mà không giải thích thay cho trình thuật.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “đầy tớ” vì đúng bối cảnh xã hội và quen thuộc trong văn phong Kinh Thánh, nhưng chú thích bảo toàn độ mơ hồ của παῖς. Trật tự “nằm liệt ở nhà” tự nhiên trong tiếng Việt và vẫn phản ánh trạng thái kéo dài của động từ Hy Lạp.
