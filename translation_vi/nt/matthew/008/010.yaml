id: MAT.8.10
reference: Matthew 8:10
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀκούσας δὲ ὁ Ἰησοῦς ἐθαύμασεν καὶ εἶπεν τοῖς ἀκολουθοῦσιν· Ἀμὴν λέγω ὑμῖν, ⸂παρ’ οὐδενὶ τοσαύτην πίστιν ἐν τῷ Ἰσραὴλ⸃ εὗρον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/010.yaml
  text: When Jesus heard this[a], he marveled and said to those following him, “Truly I tell you[b], with no one in Israel have I found such faith.”
translation:
  language: vi
  text: 'Khi nghe điều đó, Đức Chúa Jêsus kinh ngạc và nói với những người đi theo Ngài: “Thật, Ta bảo các ngươi, Ta chưa từng thấy ai trong dân Y-sơ-ra-ên có đức tin lớn như thế.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀκούσας
  choice: Nghe vậy
  rationale: Phân từ bất định nêu hoàn cảnh của động từ chính; “vậy” được bổ sung tự nhiên để chỉ lời viên đại đội trưởng vừa nói.
- source_word: ἐθαύμασεν
  choice: ngạc nhiên
  rationale: Diễn đạt phản ứng kinh ngạc mạnh mẽ của Đức Chúa Jêsus bằng tiếng Việt hiện đại, không hàm ý Ngài thiếu hiểu biết hay lầm lẫn.
- source_word: τοῖς ἀκολουθοῦσιν
  choice: với những người đang đi theo Ngài
  rationale: Giữ sắc thái hiện tại của phân từ, chỉ những người đang cùng đi với Đức Chúa Jêsus lúc ấy, thay vì biến cụm từ thành một danh xưng cố định.
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: Thật, Ta bảo các ngươi
  rationale: Giữ tính trang trọng và nhấn mạnh của công thức ἀμήν, đồng thời dùng lối nói tiếng Việt rõ ràng, tự nhiên.
- source_word: παρ’ οὐδενὶ
  choice: chưa từng thấy ai ... có
  rationale: Trong cấu trúc với εὗρον, παρά cộng tặng cách nói đến điều được nhận thấy nơi một người; tiếng Việt diễn đạt tự nhiên bằng “thấy ai ... có”.
- source_word: τοσαύτην πίστιν
  choice: đức tin lớn như thế
  rationale: τοσαύτην nhấn mạnh mức độ; “lớn như thế” làm rõ sắc thái so sánh về độ lớn mà vẫn giữ πίστις là “đức tin”.
- source_word: ἐν τῷ Ἰσραήλ
  choice: trong dân Y-sơ-ra-ên
  rationale: Cụm từ có thể mang nghĩa tập thể, chỉ cộng đồng dân Y-sơ-ra-ên; thêm “dân” giúp câu tiếng Việt tránh bị hiểu thuần túy là địa danh.
- source_word: εὗρον
  choice: Ta chưa từng thấy
  rationale: Động từ bất định được chuyển theo kinh nghiệm cho đến thời điểm phát ngôn; “chưa từng” kết hợp tự nhiên với phủ định οὐδενί và truyền đạt hiệu lực của toàn mệnh đề.
theological_decisions:
- issue: Cách dịch πίστις
  choice: đức tin
  alternative: lòng tin; sự tin cậy
  rationale: Trong ngữ cảnh này, từ chỉ lòng tin của viên đại đội trưởng vào thẩm quyền của Đức Chúa Jêsus. “Đức tin” là thuật ngữ rộng, quen thuộc và không thu hẹp ý nghĩa thành phẩm chất trung tín.
- issue: Phạm vi của ἐν τῷ Ἰσραήλ
  choice: trong dân Y-sơ-ra-ên
  alternative: tại Y-sơ-ra-ên
  rationale: Cách dịch chính giữ khả năng Đức Chúa Jêsus đang nói về cộng đồng dân giao ước, thay vì chỉ một phạm vi địa lý.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Chúa Jêsus/Ngài” và đại từ trực tiếp “Ta/các ngươi” theo sắc thái Kinh Thánh trang nghiêm; không thêm chú thích vì các khác biệt khả dĩ đã được diễn đạt rõ trong bản chính và không cần thiết cho việc đọc câu này.
