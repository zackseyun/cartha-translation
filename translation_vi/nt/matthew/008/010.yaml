revisions:
- from: 'Nghe vậy, Đức Chúa Jêsus ngạc nhiên và nói với những người đang đi theo Ngài: “Thật, Ta bảo các ngươi, Ta chưa từng thấy ai trong dân Y-sơ-ra-ên có đức tin lớn như thế.”'
  to: 'Khi nghe điều đó, Đức Chúa Jêsus kinh ngạc và nói với những người đi theo Ngài: “Thật, Ta bảo các ngươi, Ta chưa từng thấy ai trong dân Y-sơ-ra-ên có đức tin lớn như thế.”'
  rationale: Sửa tối thiểu để diễn đạt ἀκούσας và đặc biệt ἐθαύμασεν chính xác, tự nhiên hơn. Các yếu tố ngữ nghĩa còn lại, gồm phủ định tuyệt đối “chưa từng thấy ai,” phạm vi tập thể “trong dân Y-sơ-ra-ên,” và mức độ của “đức tin lớn như thế,” được giữ nguyên. Không có biến thể văn bản hay mơ hồ quan trọng nào trong câu này cần chú thích.
