- from: 'Các quỷ cứ van xin Ngài[a]: “Nếu Ngài đuổi chúng tôi ra, xin sai chúng tôi nhập vào đàn heo.”'
  to: 'Các quỷ cứ van xin Ngài[a]: “Nếu Ngài đuổi chúng tôi ra, xin sai chúng tôi đến đàn heo.”'
  rationale: Thay “nhập vào đàn heo” bằng “đến đàn heo” để phản ánh trực tiếp yêu cầu được sai đến đích là đàn heo, tránh xác định rõ một hành động mà câu Hy Lạp không nêu bằng động từ. Các yếu tố khác đều trung thành nguồn và tự nhiên.
