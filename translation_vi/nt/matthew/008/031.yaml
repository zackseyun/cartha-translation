    rationale: Giới từ εἰς nêu đích/hướng “vào đàn heo”; câu này không dùng động từ “nhập vào.” Ngữ cảnh có thể cho thấy kết quả đó, nhưng bản dịch tối ưu-tương-đương nên không đưa chi tiết này vào ngay trong câu.
