  verdict: revise
  source_fidelity: 'Bản dịch giữ đúng các thành phần chính: δαίμονες là “các quỷ,” παρεκάλουν được diễn tả bằng “cứ van xin” để phản ánh thì vị hoàn, điều kiện “Nếu Ngài đuổi chúng tôi ra,” và mệnh lệnh “xin sai chúng tôi ... đàn heo.” Tuy nhiên, “nhập vào” thêm rõ ý mà câu Hy Lạp chỉ nói “sai chúng tôi vào/đến đàn heo”; dù ngữ cảnh kế tiếp có thể hàm ý nhập vào, bản câu này nên giữ cách diễn đạt ít diễn giải hơn.'
