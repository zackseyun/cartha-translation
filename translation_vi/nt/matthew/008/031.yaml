  terminology: “Các quỷ,” “đuổi ... ra,” “đàn heo,” và kính ngữ “Ngài” đều nhất quán với văn phong Kinh Thánh tiếng Việt hiện đại. “Heo” là từ phổ thông, phù hợp biến thể tiếng Việt chuẩn hiện đại.
  issues:
