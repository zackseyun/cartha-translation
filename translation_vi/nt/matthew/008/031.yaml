  text: οἱ δὲ δαίμονες παρεκάλουν αὐτὸν λέγοντες· Εἰ ἐκβάλλεις ἡμᾶς, ⸂ἀπόστειλον ἡμᾶς⸃ εἰς τὴν ἀγέλην τῶν χοίρων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/031.yaml
  text: And the demons kept begging him[a], saying, “If you cast us out[b], send us into the herd of pigs.”
translation:
  language: vi
  text: 'Các quỷ cứ van xin Ngài[a]: “Nếu Ngài đuổi chúng tôi ra, xin sai chúng tôi đến đàn heo.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “van xin Ngài”; động từ Hy Lạp ở thì vị hoàn có thể gợi hành động đang tiếp diễn hoặc lặp đi lặp lại.
    reason: lexical_alternative
lexical_decisions:
- source_word: δαίμονες
  choice: các quỷ
  rationale: Cách gọi tự nhiên, rõ nghĩa trong tiếng Việt hiện đại, giữ nguyên ý chỉ những hữu thể tà ác có nhân cách trong trình thuật.
- source_word: παρεκάλουν
  choice: cứ van xin
  rationale: Thì vị hoàn diễn tả hành động tiếp diễn hoặc lặp lại; “cứ van xin” truyền đạt sắc thái ấy một cách tự nhiên.
- source_word: λέγοντες
  choice: dấu hai chấm dẫn lời trực tiếp
  rationale: Tiếng Việt tự nhiên có thể chuyển phân từ “nói rằng” thành dấu hai chấm mà vẫn giữ trọn chức năng dẫn lời.
- source_word: Εἰ
  choice: Nếu
  rationale: Giữ nguyên hình thức điều kiện từ góc nhìn của các quỷ, không diễn giải thành “vì” hay “khi”.
- source_word: ἐκβάλλεις
  choice: đuổi ... ra
  rationale: Cách diễn đạt chuẩn và tự nhiên trong ngữ cảnh trừ quỷ, giữ rõ ý cưỡng bức loại khỏi nơi đang ở.
- source_word: ἀπόστειλον
  choice: xin sai
  rationale: Mệnh lệnh ở đây mang lực cầu xin; thêm “xin” phù hợp với παρεκάλουν, còn “sai” giữ sắc thái điều động của động từ Hy Lạp.
- source_word: ἀγέλην
  choice: đàn
  rationale: Danh từ tập hợp thông dụng trong tiếng Việt dành cho một nhóm heo.
- source_word: χοίρων
  choice: heo
  rationale: Từ hiện đại, phổ thông và tự nhiên; “lợn” là biến thể vùng miền cũng chính xác.
- source_word: οἱ δὲ
  choice: Các quỷ
  rationale: δέ nối tiếp và hơi chuyển trọng tâm; trong câu tiếng Việt độc lập không cần dịch bằng một liên từ cứng nhắc.
theological_decisions:
- issue: Cách gọi các tà linh
  choice: các quỷ
  alternative: các tà linh
  rationale: “Các quỷ” trực tiếp và gần với danh từ δαίμονες, giữ nguyên lời khẳng định của trình thuật về những hữu thể tà ác có nhân cách mà không thêm giải thích giáo lý.
- issue: Đích đến của các quỷ
  choice: sai chúng tôi nhập vào đàn heo
  alternative: sai chúng tôi đến đàn heo
  rationale: εἰς tự thân có thể chỉ hướng đi vào/đến; ngữ cảnh việc quỷ rời vật chủ và sang đàn heo hỗ trợ “nhập vào”, nhưng cách dịch vẫn không giải thích thêm cơ chế của sự nhập quỷ.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Ngài” để chỉ Chúa Giê-su theo lối xưng hô kính trọng quen thuộc; dùng “heo” là từ phổ thông, không cổ hóa. Cấu trúc lời thoại được làm tự nhiên trong tiếng Việt.
