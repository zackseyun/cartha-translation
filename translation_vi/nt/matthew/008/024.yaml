id: MAT.8.24
reference: Matthew 8:24
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ σεισμὸς μέγας ἐγένετο ἐν τῇ θαλάσσῃ, ὥστε τὸ πλοῖον καλύπτεσθαι ὑπὸ τῶν κυμάτων, αὐτὸς δὲ ἐκάθευδεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/024.yaml
  text: And behold[a], a great storm arose on the sea, so that the boat was being swamped by the waves[b]; but he was sleeping.
translation:
  language: vi
  text: Kìa, một cơn bão lớn[a] nổi lên trên biển, đến nỗi thuyền bị sóng phủ lấp[b]; còn Đức Giê-su thì vẫn đang ngủ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hy Lạp σεισμός thường có nghĩa là “sự rung chuyển” hoặc “động đất”; trong ngữ cảnh này, từ ấy chỉ một cơn bão dữ dội trên biển.
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “bị sóng che phủ.”'
    reason: previous_rendering
lexical_decisions:
- source_word: ἰδοὺ
  choice: Kìa
  rationale: Giữ sức gợi sống động và chức năng hướng sự chú ý của từ chỉ diễn ngôn, đồng thời tự nhiên trong văn kể chuyện tiếng Việt.
- source_word: σεισμὸς μέγας
  choice: một cơn bão lớn
  rationale: σεισμός thường chỉ sự rung chuyển hoặc động đất, nhưng trong ngữ cảnh biển, thuyền và sóng, cụm từ diễn tả một cơn bão dữ dội trên biển.
- source_word: ἐγένετο
  choice: nổi lên
  rationale: Cách diễn đạt tự nhiên về sự khởi phát của một cơn bão, tương ứng với ý 'xảy ra, phát sinh' của động từ.
- source_word: ἐν τῇ θαλάσσῃ
  choice: trên biển
  rationale: Giữ danh từ 'biển' của nguyên văn và diễn đạt địa điểm theo cách tự nhiên trong tiếng Việt.
- source_word: ὥστε
  choice: đến nỗi
  rationale: Biểu đạt rõ quan hệ kết quả do cơn bão gây ra.
- source_word: τὸ πλοῖον
  choice: thuyền
  rationale: Phù hợp với loại phương tiện trong bối cảnh Biển Ga-li-lê và tự nhiên hơn 'tàu' trong tiếng Việt.
- source_word: καλύπτεσθαι ὑπὸ τῶν κυμάτων
  choice: bị sóng phủ lấp
  rationale: Giữ nghĩa cơ bản 'bị che phủ' và thể bị động đang tiếp diễn, đồng thời truyền đạt hiểm nguy do sóng trùm lên thuyền mà không diễn giải quá mức thành thuyền đã đầy nước.
- source_word: αὐτὸς δὲ
  choice: còn Đức Giê-su thì
  rationale: Làm rõ chủ thể theo ngữ cảnh tiếng Việt và thể hiện sự tương phản nổi bật giữa cơn bão với việc ngài ngủ.
- source_word: ἐκάθευδεν
  choice: vẫn đang ngủ
  rationale: Thể hiện hành động đang tiếp diễn của thì chưa hoàn thành; 'vẫn' làm rõ sự tương phản hàm ý trong câu.
theological_decisions:
- issue: Bản chất hiện tượng được gọi là σεισμός
  choice: Dịch theo ngữ cảnh là 'cơn bão'
  alternative: sự rung chuyển lớn; trận động đất lớn
  rationale: Đây là quyết định từ vựng theo ngữ cảnh, không phải xác quyết giáo lý. Hình ảnh biển, thuyền và sóng cho thấy một biến động dữ dội trên mặt nước; 'động đất' dễ tạo hình ảnh sai lệch trong tiếng Việt.
- issue: Cách gọi chủ thể của αὐτός
  choice: Đức Giê-su
  alternative: ngài; người; ông ấy
  rationale: Đại từ Hy Lạp quy chiếu về Đức Giê-su trong mạch văn. Nêu tên giúp câu độc lập rõ nghĩa và giữ văn phong tôn kính thông dụng, nhưng không thêm một tước hiệu thần học vào nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. 'Kìa' giữ nét đột ngột của lời kể; 'phủ lấp' vừa tự nhiên trong ngữ cảnh vừa gần với nghĩa của καλύπτεσθαι. Dùng chính tả hiện đại 'Kìa'.
