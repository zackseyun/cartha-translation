- from: Kìa, một cơn bão lớn nổi lên trên biển, đến nỗi thuyền bị sóng phủ lấp[a]; còn Đức Giê-su thì vẫn đang ngủ.
  to: Kìa, một cơn bão lớn[a] nổi lên trên biển, đến nỗi thuyền bị sóng phủ lấp[b]; còn Đức Giê-su thì vẫn đang ngủ.
  rationale: Chỉ bổ sung chú thích cho σεισμός và điều chỉnh các ký hiệu chú thích để ghi nhận nghĩa đen thường gặp của từ này cùng lý do dịch theo ngữ cảnh là “cơn bão”. Nội dung câu dịch được giữ nguyên vì đã trung thành với nguyên văn và tự nhiên.
