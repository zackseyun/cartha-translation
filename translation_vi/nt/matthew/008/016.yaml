reference: Matthew 8:16
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ὀψίας δὲ γενομένης προσήνεγκαν αὐτῷ δαιμονιζομένους πολλούς· καὶ ἐξέβαλεν τὰ πνεύματα λόγῳ, καὶ πάντας τοὺς κακῶς ἔχοντας ἐθεράπευσεν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/016.yaml
  text: When evening came[a], they brought to him many who were demon-possessed; and he cast out the spirits with a word, and healed all who were sick.
translation:
  language: vi
  text: Khi chiều đến, người ta đem nhiều người bị quỷ ám[a] đến với Ngài; Ngài dùng một lời đuổi các linh ra và chữa lành tất cả những người đau yếu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “nhiều người chịu ảnh hưởng của quỷ.” Phân từ Hy Lạp chỉ những người ở dưới ảnh hưởng của ma quỷ; “bị quỷ ám” là cách dịch ngắn gọn, quen thuộc.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὀψίας δὲ γενομένης
  choice: Khi chiều đến
  rationale: Cụm sở hữu cách tuyệt đối chỉ thời gian; cách diễn đạt này tự nhiên trong tiếng Việt hiện đại và giữ nguyên ý thời điểm.
- source_word: προσήνεγκαν αὐτῷ
  choice: người ta đem đến cho Ngài
  rationale: Động từ προσφέρω ở đây nói đến việc đưa người đến với Chúa Giê-su. Chủ ngữ số nhiều không được nêu rõ nên dịch là “người ta”.
- source_word: δαιμονιζομένους πολλούς
  choice: nhiều người bị quỷ ám
  rationale: Phân từ này chỉ những người ở dưới ảnh hưởng hoặc sự khống chế của quỷ. “Bị quỷ ám” là cách diễn đạt ngắn gọn, quen thuộc, nhưng chú thích vẫn nêu phạm vi nghĩa rộng hơn.
- source_word: ἐξέβαλεν τὰ πνεύματα
  choice: đuổi các linh ra
  rationale: Giữ trực tiếp danh từ “các linh” của nguyên văn và sắc thái trục xuất của ἐκβάλλω, không tự ý thêm tính từ “tà” dù ngữ cảnh cho thấy đó là các linh thuộc về ma quỷ.
- source_word: λόγῳ
  choice: dùng một lời
  rationale: Dữ cách mang nghĩa phương tiện; cách dịch này nhấn mạnh rằng chỉ bằng một lời phán, Ngài đuổi các linh ra, mà không thêm đại từ sở hữu vốn không có trong nguyên văn.
- source_word: πάντας τοὺς κακῶς ἔχοντας
  choice: tất cả những người đau yếu
  rationale: Thành ngữ κακῶς ἔχειν có nghĩa là bị bệnh hoặc đau yếu; cách dịch này tự nhiên và phù hợp với bối cảnh chữa lành.
- source_word: ἐθεράπευσεν
  choice: chữa lành
  rationale: θεραπεύω trong các trình thuật Phúc Âm thường chỉ hành động chữa lành; lựa chọn này giữ được sắc thái quen thuộc của văn mạch.
theological_decisions:
- issue: Bản chất của δαιμονιζομένους và τὰ πνεύματα
  choice: Diễn đạt sự khốn khổ do quỷ gây ra là có thật bằng “bị quỷ ám” và giữ nguyên “các linh”.
  alternative: “những người chịu ảnh hưởng của quỷ”; hoặc diễn giải họ là người mắc bệnh tâm thần
  rationale: Câu này phân biệt việc đuổi các linh với việc chữa lành người đau yếu. Bản dịch giữ các phạm trù của chính bản văn, không tâm lý hóa hiện tượng, đồng thời chú thích phạm vi nghĩa của phân từ.
- issue: Ý nghĩa phương tiện của λόγῳ
  choice: dùng một lời
  alternative: “bằng lời Ngài”; hoặc “bằng cách phán”
  rationale: Cách dịch bảo toàn ý Chúa Giê-su thi hành thẩm quyền chỉ bằng một lời, nhưng không thêm “của Ngài” hay triển khai một công thức thần học vượt quá bản văn.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” để chỉ Chúa Giê-su theo văn mạch; giữ dấu chấm phẩy để thể hiện hai hành động liên kết trong cùng một trình thuật. Dấu chú thích được đặt ngay sau cụm từ mà chú thích giải thích.
