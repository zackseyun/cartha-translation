  terminology: “Ngài,” “bị quỷ ám,” “các linh,” và “chữa lành” phù hợp với văn phong Kinh Thánh tiếng Việt hiện đại. “Dùng một lời” giữ đúng tính công cụ của λόγῳ mà không thêm sở hữu từ hoặc một diễn giải tín lý.
