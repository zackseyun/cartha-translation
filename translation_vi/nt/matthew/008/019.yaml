- from: 'Một kinh sư đến gần và nói với Ngài: “Thưa Thầy, dù Thầy đi đâu[a], tôi cũng sẽ theo Thầy.”'
  to: 'Một kinh sư đến gần và nói với Ngài: “Thưa Thầy, dù Thầy đi đâu[a], tôi cũng sẽ theo Thầy.”'
  rationale: Giữ nguyên câu dịch vì câu này trung thành với nguyên văn và tự nhiên trong tiếng Việt. Chỉ sửa chú thích để phản ánh khả năng nghĩa của ἀπέρχομαι mà không tạo các cách diễn đạt tiếng Việt không tự nhiên.
