source:
  edition: SBLGNT
  text: καὶ προσελθὼν εἷς γραμματεὺς εἶπεν αὐτῷ· Διδάσκαλε, ἀκολουθήσω σοι ὅπου ἐὰν ἀπέρχῃ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/019.yaml
  text: And one scribe came up and said to him[a], “Teacher, I will follow you wherever you go.”
translation:
  language: vi
  text: 'Một kinh sư đến gần và nói với Ngài: “Thưa Thầy, dù Thầy đi đâu[a], tôi cũng sẽ theo Thầy.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Động từ Hy Lạp cũng có thể nhấn mạnh ý “ra đi” hoặc “đi khỏi”; tuy vậy, trong văn cảnh này, “đi” là cách diễn đạt tự nhiên.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσελθὼν
  choice: đến gần
  rationale: Phân từ bất định của προσέρχομαι diễn tả việc người ấy tiến lại gần Chúa Giê-su trước khi nói; “đến gần” tự nhiên và giữ rõ ý tiếp cận.
- source_word: εἷς γραμματεὺς
  choice: một kinh sư
  rationale: εἷς giới thiệu một cá nhân cụ thể, còn γραμματεύς chỉ người thông thạo và giảng dạy Luật; “một kinh sư” là cách gọi ngắn gọn, quen thuộc trong văn cảnh Tin Mừng.
- source_word: Διδάσκαλε
  choice: Thưa Thầy
  rationale: Cách xưng hô này chuyển tải trực tiếp nghĩa “người dạy” cùng sắc thái kính trọng của lời gọi, mà không nâng thành một tước hiệu thần học mạnh hơn nguyên văn.
- source_word: ἀκολουθήσω
  choice: tôi cũng sẽ theo Thầy
  rationale: Thì tương lai biểu thị lời tuyên bố về ý định; “theo Thầy” giữ được cả nghĩa đi theo trực tiếp lẫn hàm ý trở thành môn đồ.
- source_word: ὅπου ἐὰν
  choice: dù ... đâu ... cũng
  rationale: Kết cấu tiếng Việt này diễn đạt tự nhiên quan hệ bất định “bất cứ nơi nào,” đồng thời giữ phạm vi không giới hạn của lời cam kết.
- source_word: ἀπέρχῃ
  choice: Thầy đi
  rationale: Trong văn cảnh này, “đi” là cách diễn đạt tiếng Việt tự nhiên nhất; động từ Hy Lạp cũng có thể nhấn mạnh việc rời đi hoặc đi khỏi, nên phương án đó được ghi ở chú thích.
theological_decisions:
- issue: Cách chuyển dịch διδάσκαλος khi dùng để xưng hô với Chúa Giê-su
  choice: Thưa Thầy
  alternative: Thưa Chủ; Ra-bi
  rationale: “Thưa Thầy” phản ánh đúng nghĩa từ vựng và sắc thái kính trọng, nhưng không áp đặt một tước hiệu Cơ Đốc học mạnh hơn hoặc đổi sang một danh xưng Do Thái không có trong nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Kinh sư” giữ thuật ngữ quen thuộc của văn cảnh Tin Mừng; cấu trúc “dù… đâu… cũng” giúp lời cam kết nghe tự nhiên trong tiếng Việt mà vẫn giữ tính bao quát của nguyên văn.
