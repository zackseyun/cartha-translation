  yaml_path: translation/nt/matthew/008/030.yaml
  text: A large herd of pigs was feeding some distance away from them[a].
translation:
  language: vi
  text: Ở cách họ một quãng xa[a] có một đàn heo đông đang kiếm ăn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “Ở xa họ.”'
    reason: Giữ phương án diễn đạt trực tiếp hơn cho μακρὰν ἀπ’ αὐτῶν, vốn chỉ vị trí ở xa họ.
lexical_decisions:
- source_word: ἦν δὲ
  choice: có
  rationale: ἦν diễn tả sự hiện hữu; tiếng Việt tự nhiên dùng “có”. Không thêm “bấy giờ” vì δέ chỉ là liên từ nhẹ tiếp nối câu chuyện, không phải một trạng từ chỉ thời gian rõ ràng.
- source_word: μακρὰν ἀπ’ αὐτῶν
  choice: cách họ một quãng xa
  rationale: Diễn đạt khoảng cách không gần bằng tiếng Việt tự nhiên, đồng thời giữ khả năng hiểu mạnh hơn là “xa họ” trong chú thích.
- source_word: ἀγέλη
  choice: đàn
  rationale: “Đàn” là danh từ tập hợp tự nhiên trong tiếng Việt dành cho một nhóm heo.
- source_word: χοίρων
  choice: heo
  rationale: “Heo” là từ hiện đại, thông dụng và rõ nghĩa; tránh sắc thái cổ hoặc miệt thị không có trong nguyên văn.
- source_word: πολλῶν
  choice: đông
  rationale: Với danh từ tập hợp “đàn”, “đông” diễn đạt tự nhiên ý nghĩa có nhiều con của πολλῶν.
- source_word: βοσκομένη
  choice: đang kiếm ăn
  rationale: Phân từ hiện tại mô tả đàn heo đang ăn; “kiếm ăn” tự nhiên đối với heo và không thêm ý có người chăn vốn không được nói rõ trong nguyên văn.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Đưa cụm chỉ vị trí lên đầu giúp câu tiếng Việt tự nhiên, đồng thời không thêm một từ nối thời gian không có rõ trong nguyên văn.
