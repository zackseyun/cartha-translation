id: MAT.8.33
reference: Matthew 8:33
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οἱ δὲ βόσκοντες ἔφυγον, καὶ ἀπελθόντες εἰς τὴν πόλιν ἀπήγγειλαν πάντα καὶ τὰ τῶν δαιμονιζομένων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/033.yaml
  text: Then the herdsmen fled[a], and going away into the city, they reported everything, including what had happened to the demon-possessed men.
translation:
  language: vi
  text: Còn những người chăn heo thì bỏ chạy. Họ vào thành và thuật lại mọi chuyện, kể cả chuyện liên quan đến những người bị quỷ ám.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch sát hơn: “và những việc liên quan đến những người bị quỷ ám.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ βόσκοντες
  choice: Còn những người chăn heo
  rationale: Danh từ hóa phân từ βόσκοντες là “những người đang chăn/cho ăn”; theo ngữ cảnh, đối tượng được chăn là bầy heo. “Còn” diễn đạt δέ và chuyển sự chú ý sang nhóm người này.
- source_word: ἔφυγον
  choice: thì bỏ chạy
  rationale: Động từ φεύγω chỉ hành động chạy trốn; “bỏ chạy” tự nhiên, rõ ràng và giữ sắc thái khẩn cấp.
- source_word: ἀπελθόντες εἰς τὴν πόλιν
  choice: Họ vào thành
  rationale: Phân từ quá khứ diễn tả hành động xảy ra trước hoặc đi kèm với việc thuật lại. Tiếng Việt có thể chuyển thành một mệnh đề nối tiếp tự nhiên; “vào thành” giữ hướng chuyển động của εἰς.
- source_word: ἀπήγγειλαν πάντα
  choice: thuật lại mọi chuyện
  rationale: ἀπαγγέλλω mang nghĩa báo tin hoặc thuật lại; “thuật lại” phù hợp với việc kể cho dân thành những điều vừa xảy ra. “Mọi chuyện” giữ ý bao quát của πάντα.
- source_word: καὶ τὰ τῶν δαιμονιζομένων
  choice: kể cả chuyện liên quan đến những người bị quỷ ám
  rationale: Cụm từ rút gọn theo sát nghĩa là “và những việc liên quan đến những người bị quỷ ám.” “Kể cả” thể hiện rằng đây là phần được nêu riêng trong toàn bộ những điều họ thuật lại, nhưng không quy định cụ thể sự việc nào.
- source_word: δαιμονιζομένων
  choice: những người bị quỷ ám
  rationale: Cách nói này thông dụng trong tiếng Việt, diễn đạt tình trạng chịu quyền lực của quỷ trong trình thuật mà không thêm những phân biệt thần học ngoài văn bản.
theological_decisions:
- issue: Cách diễn đạt δαιμονιζομένων mà không áp đặt mức độ hay cơ chế tác động của quỷ
  choice: những người bị quỷ ám
  alternative: những người bị quỷ hành hạ
  rationale: “Bị quỷ ám” là cách tương đương quen thuộc và trực tiếp trong ngữ cảnh Phúc Âm. Phương án “bị quỷ hành hạ” có thể thu hẹp nghĩa sang sự hành hạ, trong khi từ Hy Lạp không tự nó xác định chi tiết cơ chế hay mức độ.
- issue: Ý nghĩa của τὰ τῶν δαιμονιζομένων
  choice: chuyện liên quan đến những người bị quỷ ám
  alternative: chuyện đã xảy ra cho những người bị quỷ ám
  rationale: Nguyên văn dùng một cụm danh từ rút gọn, nói chung về “những việc liên quan đến” họ. Bản dịch chính giữ độ mở này thay vì xác định đó chỉ là điều đã xảy ra cho họ.
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. “Thành” được dùng thay cho “thành phố” để phù hợp bối cảnh cổ đại; “heo” là từ phổ thông trong tiếng Việt hiện đại. Tách thành hai câu giúp câu văn tự nhiên mà vẫn giữ đúng trình tự hành động của nguyên văn.
