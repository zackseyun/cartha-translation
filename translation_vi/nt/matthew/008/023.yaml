source:
  edition: SBLGNT
  text: Καὶ ἐμβάντι αὐτῷ ⸀εἰς πλοῖον ἠκολούθησαν αὐτῷ οἱ μαθηταὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/023.yaml
  text: And when he got into the boat[b][a], his disciples followed him.
translation:
  language: vi
  text: Khi Đức Giê-su bước lên thuyền[a], các môn đồ đi theo Ngài.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể hiểu: “một chiếc thuyền”. Tiếng Hy Lạp chỉ nói “lên thuyền”, không đánh dấu rõ là xác định hay bất định.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμβάντι
  choice: Khi ... bước lên
  rationale: Phân từ bất định quá khứ diễn tả hành động có quan hệ thời gian với động từ chính. Mệnh đề “Khi ... bước lên” tự nhiên trong tiếng Việt và không nhấn quá mức rằng hành động đã hoàn tất từ lâu trước hành động chính.
- source_word: πλοῖον
  choice: thuyền
  rationale: Trong bối cảnh Biển Ga-li-lê, “thuyền” là cách gọi tự nhiên hơn “tàu”. Tiếng Hy Lạp không có mạo từ ở đây; tiếng Việt không buộc phải xác định hay bất định, nên “thuyền” giữ được sự không xác định ấy.
- source_word: ἠκολούθησαν
  choice: đi theo
  rationale: Cách dịch này diễn đạt rõ hành động di chuyển theo Đức Giê-su, đồng thời vẫn giữ được sắc thái môn đồ hóa vốn có thể hiện diện trong cách Ma-thi-ơ dùng ἀκολουθέω.
- source_word: μαθηταὶ
  choice: các môn đồ
  rationale: “Môn đồ” là thuật ngữ Phúc Âm quen thuộc, vừa chỉ người học vừa chỉ người gắn bó đi theo một vị thầy.
- source_word: αὐτῷ ... αὐτῷ ... αὐτοῦ
  choice: Đức Giê-su / Ngài / các môn đồ
  rationale: Các đại từ đều quy chiếu về Đức Giê-su theo văn cảnh. Nêu rõ “Đức Giê-su” ở mệnh đề đầu giúp câu đứng riêng vẫn dễ hiểu; “Ngài” duy trì sự quy chiếu tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Sắc thái môn đồ hóa tiềm tàng trong ἀκολουθέω
  choice: đi theo
  alternative: đi cùng Ngài; trở thành người theo Ngài
  rationale: Câu trước hết kể việc các môn đồ lên thuyền theo Đức Giê-su, nhưng động từ cũng có thể gợi quan hệ môn đồ. “Đi theo” giữ được cả hành động cụ thể lẫn âm hưởng rộng hơn mà không diễn giải quá mức.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Đức Giê-su”, “Ngài” và “môn đồ” theo lối diễn đạt Kinh Thánh tiếng Việt quen thuộc; tránh bổ sung quan hệ thời gian hay ý nghĩa thần học không được câu Hy Lạp nói rõ.
