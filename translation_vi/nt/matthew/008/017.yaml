id: MAT.8.17
reference: Matthew 8:17
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὅπως πληρωθῇ τὸ ῥηθὲν διὰ Ἠσαΐου τοῦ προφήτου λέγοντος· Αὐτὸς τὰς ἀσθενείας ἡμῶν ἔλαβεν καὶ τὰς νόσους ἐβάστασεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/017.yaml
  text: 'so that what was spoken through Isaiah the prophet might be fulfilled[b][a], saying: “He himself took our sicknesses and carried our diseases.”'
translation:
  language: vi
  text: 'để lời đã được phán qua nhà tiên tri Ê-sai được ứng nghiệm: “Chính Người đã mang lấy những đau ốm của chúng ta[a] và gánh những bệnh tật của chúng ta.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “những yếu đuối.” Từ Hy Lạp có thể chỉ sự yếu đuối, suy nhược hay bệnh tật.
    reason: lexical_alternative
  - marker: b
    text: “Gánh” cũng có thể dịch là “mang.” Cách diễn đạt này giữ mối liên hệ bằng lời với Ê-sai 53:4.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅπως
  choice: để
  rationale: Diễn đạt tự nhiên quan hệ mục đích/kết quả trong công thức ứng nghiệm của Ma-thi-ơ.
- source_word: πληρωθῇ
  choice: được ứng nghiệm
  rationale: Giữ thể bị động và mô-típ lời tiên tri được ứng nghiệm.
- source_word: τὸ ῥηθὲν
  choice: lời đã được phán
  rationale: Cách diễn đạt trang trọng nhưng dễ hiểu, phản ánh phân từ thụ động chỉ điều đã được nói.
- source_word: διὰ Ἠσαΐου τοῦ προφήτου
  choice: qua nhà tiên tri Ê-sai
  rationale: 'Giữ sắc thái trung gian của διά với sở hữu cách: lời được phán qua vị tiên tri.'
- source_word: λέγοντος
  choice: dấu hai chấm trước lời trích dẫn
  rationale: Trong tiếng Việt, dấu hai chấm giới thiệu trực tiếp lời trích dẫn tự nhiên hơn việc thêm từ 'rằng' hoặc 'nói rằng'.
- source_word: Αὐτὸς
  choice: Chính Người
  rationale: Bảo toàn tính nhấn mạnh của đại từ; 'Người' duy trì văn phong tôn kính mà không thêm diễn giải thần học.
- source_word: ἀσθενείας
  choice: những yếu đau
  rationale: Bao quát cả sự yếu đuối, suy nhược và đau ốm, đồng thời phù hợp bối cảnh chữa lành; chú thích nêu cách dịch thiên về bệnh lý.
- source_word: ἔλαβεν
  choice: mang lấy
  rationale: Phản ánh λαμβάνω là nhận/lấy/mang lấy, không tự ý thêm ý 'cất đi', đồng thời tự nhiên trong câu trích dẫn.
- source_word: νόσους
  choice: những bệnh tật
  rationale: Diễn đạt chính xác nghĩa bệnh tật thể chất của νόσος.
- source_word: ἐβάστασεν
  choice: gánh
  rationale: Giữ nghĩa mang/gánh của βαστάζω và âm hưởng của Ê-sai 53 mà không đồng nhất động từ này với ἔλαβεν.
theological_decisions:
- issue: Cách diễn đạt lời trích Ê-sai 53:4 trong bối cảnh Chúa Giê-su chữa bệnh
  choice: Dùng 'yếu đau' và 'bệnh tật', nhấn mạnh sự khốn yếu và bệnh lý thể chất nhưng vẫn giữ độ rộng của ἀσθενείας.
  alternative: Dùng 'đau ốm' và 'bệnh tật', hoặc những từ mang âm hưởng thay thế/chuộc tội rõ hơn.
  rationale: Ngữ cảnh trực tiếp nói về chức vụ chữa lành, nhưng câu trích dẫn vẫn có chiều rộng và sức nặng thần học của Ê-sai 53; bản dịch không thu hẹp câu này thành một công thức giáo lý riêng.
- issue: Quan hệ giữa ἔλαβεν và ἐβάστασεν
  choice: Phân biệt bằng 'mang lấy' và 'gánh'.
  alternative: Dịch cả hai theo hướng 'gánh chịu' hoặc diễn giải 'cất khỏi'.
  rationale: Giữ sự phân biệt từ vựng của hai động từ Hy Lạp và không quyết định thay người đọc liệu hành động được nhấn mạnh là tiếp nhận, mang chịu hay loại bỏ.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng cấu trúc gọn của công thức ứng nghiệm; giữ phép song song 'mang lấy... và gánh...' trong lời trích dẫn. Các dấu chú thích đều xuất hiện trong chính văn.
