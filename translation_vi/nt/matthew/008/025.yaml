id: MAT.8.25
reference: Matthew 8:25
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ⸀προσελθόντες ἤγειραν αὐτὸν λέγοντες· Κύριε, ⸀σῶσον, ἀπολλύμεθα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/025.yaml
  text: And they came and woke him[a], saying, “Lord, save us! We are perishing!”
translation:
  language: vi
  text: 'Họ đến đánh thức Ngài và nói: “Lạy Chúa, xin cứu chúng con[a]! Chúng con sắp chết mất!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “xin giải cứu chúng con.” Động từ Hy Lạp σῶσον có thể chỉ sự giải thoát tức thời khỏi nguy hiểm, đồng thời cũng mang nghĩa rộng hơn là “cứu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσελθόντες
  choice: đến
  rationale: Phân từ bất định quá khứ của προσέρχομαι diễn tả việc họ tiến đến gần Chúa Giê-su trước khi đánh thức Ngài; “đến” tự nhiên và không thêm chi tiết ngoài nguyên văn.
- source_word: ἤγειραν
  choice: đánh thức
  rationale: Trong bối cảnh Chúa Giê-su đang ngủ, ἐγείρω mang nghĩa cụ thể là làm cho tỉnh giấc, không phải nghĩa thần học “làm cho sống lại”.
- source_word: λέγοντες
  choice: và nói
  rationale: Phân từ hiện tại giới thiệu lời nói trực tiếp. “Và nói” giữ đúng trình tự và không thêm sắc thái như “kêu lên” vốn không được λέγοντες nói rõ.
- source_word: Κύριε
  choice: Lạy Chúa
  rationale: Κύριε là hô cách của κύριος. “Lạy Chúa” là cách xưng hô trực tiếp, trang trọng và tự nhiên trong tiếng Việt, đồng thời không thu hẹp từ này thành “Thầy”.
- source_word: σῶσον
  choice: xin cứu chúng con
  rationale: Mệnh lệnh cách bất định quá khứ của σῴζω là lời cầu cứu khẩn cấp. Tân ngữ số nhiều được hàm ý rõ bởi ngữ cảnh và bởi ἀπολλύμεθα ở ngay sau; tiếng Việt cần nêu ra để câu tự nhiên.
- source_word: ἀπολλύμεθα
  choice: chúng con sắp chết mất
  rationale: Dạng hiện tại trung động/bị động của ἀπόλλυμι diễn tả tình trạng đang tiến đến chỗ diệt vong hoặc tử vong. “Sắp chết mất” truyền đạt nguy cơ cận kề và sự khẩn cấp bằng tiếng Việt hiện đại.
theological_decisions:
- issue: Cách dịch κύριος khi các môn đồ thưa với Chúa Giê-su
  choice: Lạy Chúa
  alternative: Thưa Thầy
  rationale: Danh xưng này có thể vừa là lời xưng hô kính trọng vừa mang sức nặng Kitô học sâu hơn. “Lạy Chúa” bảo toàn khoảng nghĩa ấy thay vì giới hạn vào vai trò dạy dỗ.
- issue: Có nêu rõ đối tượng của σῶσον hay không
  choice: xin cứu chúng con
  alternative: xin cứu
  rationale: Động từ Hy Lạp không có tân ngữ riêng được viết ra, nhưng ngôi thứ nhất số nhiều trong câu kế tiếp và hoàn cảnh cho thấy đối tượng là những người đang nói. Việc thêm “chúng con” là sự hoàn chỉnh cần thiết theo lối nói tiếng Việt, không thêm một ý thần học mới.
- issue: Mức độ cận kề trong ἀπολλύμεθα
  choice: chúng con sắp chết mất
  alternative: chúng con đang bị diệt vong
  rationale: Ngữ cảnh cơn bão cho thấy nguy cơ chết ngay trước mắt. Cách dịch được chọn giữ tính khẩn cấp mà không biến câu thành một khẳng định thần học trừu tượng về sự hư mất.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Ngài” duy trì lối quy chiếu tôn kính đối với Chúa Giê-su; “chúng con” phù hợp khi môn đồ trực tiếp thưa với Chúa. Cụm “sắp chết mất” là khẩu ngữ có phẩm cách, diễn đạt tự nhiên nỗi nguy cấp mà không thêm động từ cảm xúc vào λέγοντες.
