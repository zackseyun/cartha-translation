  terminology: “Binh lính,” “dưới quyền,” và “đầy tớ” phù hợp văn cảnh quân sự–gia nhân. Chú thích “Hay ‘nô lệ’” bảo tồn lựa chọn nghĩa từ vựng quan trọng của δοῦλος mà không áp đặt một cách hiểu pháp lý duy nhất.
