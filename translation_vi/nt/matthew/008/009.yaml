id: MAT.8.9
reference: Matthew 8:9
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ γὰρ ἐγὼ ἄνθρωπός εἰμι ὑπὸ ⸀ἐξουσίαν, ἔχων ὑπ’ ἐμαυτὸν στρατιώτας, καὶ λέγω τούτῳ· Πορεύθητι, καὶ πορεύεται, καὶ ἄλλῳ· Ἔρχου, καὶ ἔρχεται, καὶ τῷ δούλῳ μου· Ποίησον τοῦτο, καὶ ποιεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/009.yaml
  text: For I also am a man under authority[a], having soldiers under me. And I say to this one, ‘Go,’ and he goes; and to another, ‘Come,’ and he comes; and to my servant, ‘Do this,’ and he does it.
translation:
  language: vi
  text: 'Vì chính tôi cũng là người ở dưới quyền, và có binh lính dưới quyền mình. Tôi bảo người này: “Đi,” thì người ấy đi; bảo người kia: “Đến,” thì người ấy đến; và bảo đầy tớ[a] của tôi: “Hãy làm việc này,” thì người ấy làm.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay “nô lệ” (Hy Lạp: doulos).'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ γὰρ
  choice: Vì ... cũng
  rationale: “Vì” giữ chức năng giải thích của γάρ, còn “cũng” thể hiện καί và sự tương ứng mà viên đại đội trưởng nêu ra.
- source_word: ἐγὼ ἄνθρωπός εἰμι
  choice: chính tôi ... là người
  rationale: “Chính tôi” thể hiện đại từ ἐγώ được nêu rõ để nhấn mạnh; “là người” tự nhiên trong tiếng Việt và không thêm ý ngoài nguyên văn.
- source_word: ὑπὸ ἐξουσίαν
  choice: ở dưới quyền
  rationale: Cụm này diễn tả vị trí phục tùng trong một hệ thống quyền chỉ huy, đặc biệt phù hợp với bối cảnh quân sự.
- source_word: ἔχων ὑπ’ ἐμαυτὸν στρατιώτας
  choice: có binh lính dưới quyền mình
  rationale: Giữ sự đối xứng giữa việc người nói ở dưới quyền người khác và có binh lính thuộc quyền mình.
- source_word: λέγω τούτῳ ... καὶ ἄλλῳ
  choice: Tôi bảo người này ... bảo người kia
  rationale: “Bảo” tự nhiên khi giới thiệu mệnh lệnh; “người này/người kia” giữ sắc thái phân biệt từng người của τούτῳ và ἄλλῳ.
- source_word: Πορεύθητι ... Ἔρχου
  choice: Đi đi ... Đến đây
  rationale: Hai mệnh lệnh ngắn gọn tái hiện trực tiếp quan hệ ra lệnh–vâng lời. “Đây” được dùng tự nhiên trong tiếng Việt với động từ “đến” theo hướng về phía người nói.
- source_word: δοῦλος
  choice: đầy tớ
  rationale: “Đầy tớ” giữ sắc thái phục vụ và lệ thuộc trong gia đình, đồng thời dễ hiểu hơn trong văn cảnh; nghĩa mạnh hơn là “nô lệ” được ghi ở chú thích.
theological_decisions:
- issue: Cách dịch δοῦλος trong ví dụ của viên đại đội trưởng
  choice: đầy tớ
  alternative: nô lệ
  rationale: Trọng tâm của câu là quyền ra lệnh và sự vâng phục, không phải việc xác định địa vị pháp lý của người ấy. “Đầy tớ” phù hợp với mạch câu, còn chú thích bảo tồn khả năng dịch “nô lệ” của từ Hy Lạp.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ đọc. Cấu trúc lặp “bảo ... thì ...” giữ nhịp điệu mệnh lệnh–thi hành của nguyên văn. Dấu chú thích [a] được đặt ngay sau từ “đầy tớ” mà chú thích giải thích.
