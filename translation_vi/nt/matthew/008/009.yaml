  to: 'Vì chính tôi cũng là người ở dưới quyền, và có binh lính dưới quyền mình. Tôi bảo người này: “Đi,” thì người ấy đi; bảo người kia: “Đến,” thì người ấy đến; và bảo đầy tớ[a] của tôi: “Hãy làm việc này,” thì người ấy làm.'
