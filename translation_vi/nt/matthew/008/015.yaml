  text: καὶ ἥψατο τῆς χειρὸς αὐτῆς, καὶ ἀφῆκεν αὐτὴν ὁ πυρετός, καὶ ἠγέρθη καὶ διηκόνει αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/015.yaml
  text: And he touched her hand, and the fever left her, and she got up and began serving him.
translation:
  language: vi
  text: Ngài chạm vào tay bà, cơn sốt rời khỏi bà; rồi bà đứng dậy và phục vụ Ngài.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἥψατο
  choice: chạm vào
  rationale: Động từ ἅπτομαι ở đây chỉ việc chạm hoặc tiếp xúc; “chạm vào” tự nhiên, rõ nghĩa và không làm động tác mạnh hơn nguyên văn.
- source_word: τῆς χειρὸς αὐτῆς
  choice: tay bà
  rationale: χείρ có nghĩa thông thường là “tay”; sở hữu cách đi sau ἅπτομαι được diễn đạt tự nhiên trong tiếng Việt bằng “vào tay bà”.
- source_word: ἀφῆκεν αὐτὴν ὁ πυρετός
  choice: cơn sốt rời khỏi bà
  rationale: ἀφίημι trong ngữ cảnh này có nghĩa là rời đi. Cách dịch này giữ hình ảnh cơn sốt như chủ thể rời khỏi người bệnh, đúng với cấu trúc Hy Lạp.
- source_word: πυρετός
  choice: cơn sốt
  rationale: Danh từ trực tiếp chỉ tình trạng sốt; “cơn sốt” là cách nói tự nhiên trong tiếng Việt, không thêm ý ngoài nguyên văn.
- source_word: ἠγέρθη
  choice: bà đứng dậy
  rationale: Dạng bị động của ἐγείρω có thể được dùng với nghĩa nội động trong câu chuyện này, chỉ việc bà đứng dậy sau khi được chữa lành; không cần đưa hàm ý phục sinh vào.
- source_word: διηκόνει αὐτῷ
  choice: bắt đầu phục vụ Ngài
  rationale: διακονέω có nghĩa là phục vụ hoặc hầu hạ. Thì chưa hoàn thành có thể được hiểu theo sắc thái khởi đầu/tiếp diễn; “bắt đầu phục vụ” diễn đạt sắc thái ấy, còn cách hiểu đơn thuần là hành động đang tiếp diễn được ghi ở chú thích.
theological_decisions:
- issue: Nguy cơ diễn giải ἠγέρθη theo nghĩa thần học là “được làm cho sống lại”
  choice: bà đứng dậy
  alternative: bà được nâng dậy
  rationale: Trong văn cảnh trực tiếp, động từ mô tả việc người phụ nữ đứng dậy sau khi hết sốt. Bản dịch giữ nghĩa kể chuyện thông thường, không nhập thêm liên hệ phục sinh mà câu này không đòi hỏi.
- issue: Sắc thái của thì chưa hoàn thành trong διηκόνει
  choice: bắt đầu phục vụ Ngài
  alternative: phục vụ Ngài
  rationale: Dạng chưa hoàn thành có thể gợi hành động bắt đầu rồi tiếp diễn, nhưng cũng có thể chỉ mô tả hành động đang diễn ra. Bản chính chọn cách diễn đạt có sắc thái khởi đầu và chú thích giữ phương án trung tính hơn.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Ngài” cho Chúa Giê-su và “bà” cho người phụ nữ nhằm giữ sự tôn trọng, đồng thời tránh lối diễn đạt cổ. Dấu chấm chú thích được đặt ngay sau mệnh đề mà chú thích giải thích.
