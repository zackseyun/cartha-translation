  text: οἱ δὲ ἄνθρωποι ἐθαύμασαν λέγοντες· Ποταπός ἐστιν οὗτος ὅτι καὶ οἱ ἄνεμοι καὶ ἡ θάλασσα ⸂αὐτῷ ὑπακούουσιν⸃;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/027.yaml
  text: And the men marveled[a], saying, “What sort of man is this, that even the winds and the sea obey him?”
translation:
  language: vi
  text: 'Những người ấy kinh ngạc, nói: “Người này là người như thế nào mà ngay cả gió và biển cũng vâng lời người ấy?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ δὲ ἄνθρωποι
  choice: Những người ấy
  rationale: Cụm từ chỉ những người nam trong bối cảnh chiếc thuyền, nhưng tiếng Việt không cần đánh dấu giống ngữ pháp. “Những người ấy” vừa giữ danh từ số nhiều vừa nối tự nhiên với diễn biến trước đó.
- source_word: ἐθαύμασαν
  choice: kinh ngạc
  rationale: Diễn đạt phản ứng sửng sốt pha lẫn thán phục bằng cách nói tự nhiên, trang trọng vừa phải trong tiếng Việt hiện đại.
- source_word: λέγοντες
  choice: nói
  rationale: Chuyển phân từ hiện tại sang động từ đi kèm sau dấu phẩy là cách kể tự nhiên trong tiếng Việt mà vẫn giữ quan hệ đồng thời với sự kinh ngạc.
- source_word: Ποταπός ἐστιν οὗτος
  choice: Người này là người thế nào
  rationale: Giữ câu hỏi về phẩm chất hay loại người của nhân vật, không thu hẹp thành câu hỏi đơn thuần về danh tính và cũng không thêm lời giải thích thần học.
- source_word: ὅτι
  choice: mà
  rationale: “Mà” nối câu hỏi với sự kiện làm nền cho nỗi kinh ngạc một cách tự nhiên, đồng thời giữ sắc thái giải thích của ὅτι.
- source_word: καὶ οἱ ἄνεμοι καὶ ἡ θάλασσα
  choice: ngay cả gió và biển cũng
  rationale: 'Cặp “ngay cả… cũng” thể hiện sức nhấn mạnh của καί: đến các sức mạnh thiên nhiên cũng đáp ứng thẩm quyền của người này.'
- source_word: αὐτῷ ὑπακούουσιν
  choice: vâng lời người
  rationale: “Vâng lời” diễn tả rõ việc tuân theo thẩm quyền mang tính ngôi vị. Đại từ “người” tránh tự ý viết hoa thần học trong khi vẫn chỉ rõ về Chúa Giê-xu theo văn cảnh.
theological_decisions:
- issue: Sức nặng Cơ Đốc luận trong câu hỏi của các môn đồ
  choice: Giữ nguyên câu hỏi kinh ngạc về Chúa Giê-xu và thẩm quyền của ngài trên thiên nhiên, không nói rõ kết luận mà câu chuyện mới chỉ gợi ra.
  alternative: Thêm cách diễn đạt như “Người này thật ra là ai” hoặc minh nhiên gọi ngài là Đức Chúa Trời.
  rationale: Nguyên văn tạo ra sự căng thẳng thần học bằng câu hỏi về loại người mà ngay cả gió và biển cũng vâng lời. Bản dịch cần bảo toàn hàm ý ấy nhưng không giải quyết thay cho mạch truyện.
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng và dễ hiểu. Cấu trúc “Người này là người thế nào” hơi nổi bật nhưng giữ chính xác trọng tâm của ποταπός là phẩm chất hay loại người, thay vì đổi thành câu hỏi về danh tính.
