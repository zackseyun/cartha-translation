revisions:
- from: 'Nhưng Đức Giê-su nói với ông: “Hãy theo tôi, và cứ để người chết chôn người chết của họ.”[a]'
  to: 'Nhưng Đức Giê-su nói với ông: “Hãy theo tôi, và hãy để người chết chôn người chết của họ.”[a]'
  rationale: Bản sửa thay “cứ để” bằng “hãy để” để phản ánh lực mệnh lệnh của ἄφες chính xác hơn. Chính văn vẫn giữ nguyên lối lặp “người chết ... người chết” và không thêm cách hiểu thuộc linh vào lời phán. Chú thích được chỉnh cho tự nhiên, rõ nghĩa, và vẫn trình bày đây là cách hiểu thường gặp chứ không phải sự giải nghĩa bắt buộc.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T02:44:08Z'
review_pass:
  verdict: revise
  source_fidelity: Bản dịch giữ đúng cấu trúc mệnh lệnh và sự lặp có chủ ý của νεκρούς ... νεκρούς. Tuy nhiên, “cứ để” làm giảm sắc thái mệnh lệnh dứt khoát của ἄφες; “hãy để” phản ánh trực tiếp hơn mà vẫn tự nhiên. Cụm “của họ” giữ được ý sở hữu phản thân của ἑαυτῶν, dù tiếng Việt không thể hiện hết sắc thái nhấn mạnh “của chính họ” mà không trở nên nặng nề.
  naturalness: “Người chết chôn người chết của họ” là cách nói nghịch lý cố ý và có thể chấp nhận được. Thay “cứ để” bằng “hãy để” tạo lời đáp trang trọng, trực tiếp và tự nhiên hơn trong văn cảnh.
  terminology: “Đức Giê-su” và “Hãy theo tôi” phù hợp với lối gọi kính trọng và ngôn ngữ môn đệ hiện đại. Chú thích nên nói rõ đây là một cách hiểu thường gặp, không giải quyết sự mơ hồ trong chính văn.
  issues:
  - severity: medium
    issue: “cứ để” làm yếu lực mệnh lệnh của ἄφες.
    rationale: ἄφες là mệnh lệnh aorist, mang lời chỉ dẫn/quyết định trực tiếp. “Hãy để” chuyển tải lực này rõ hơn; “cứ” có thể gợi ý sắc thái buông xuôi hoặc cho phép kéo dài không có trong nguyên văn.
  - severity: low
    issue: Chú thích dùng “không đáp ứng về mặt tâm linh” chưa thật tự nhiên và hơi mơ hồ.
    rationale: Cách diễn đạt “chết về mặt thuộc linh” là cách giải thích truyền thống, ngắn gọn hơn; cần vẫn dùng “thường được hiểu” để không khẳng định một cách diễn giải là nghĩa duy nhất.
  revised_text: 'Nhưng Đức Giê-su nói với ông: “Hãy theo tôi, và hãy để người chết chôn người chết của họ.”[a]'
