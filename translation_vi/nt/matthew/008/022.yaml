source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς ⸀λέγει αὐτῷ· Ἀκολούθει μοι, καὶ ἄφες τοὺς νεκροὺς θάψαι τοὺς ἑαυτῶν νεκρούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/022.yaml
  text: But Jesus says to him[a], “Follow me, and leave the dead to bury their own dead.”
translation:
  language: vi
  text: 'Nhưng Đức Giê-su nói với ông: “Hãy theo tôi, và hãy để người chết chôn người chết của họ.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Người chết” ở lần đầu thường được hiểu theo nghĩa bóng, chỉ những người chết về mặt thuộc linh; lần sau chỉ những người đã chết về thể xác.
    reason: alternative_reading
lexical_decisions:
- source_word: δὲ
  choice: Nhưng
  rationale: Diễn tả sự tương phản nhẹ với lời xin trước đó và phản hồi mang tính điều chỉnh của Đức Giê-su, nhưng không làm sự tương phản trở nên quá mạnh.
- source_word: λέγει
  choice: nói
  rationale: Thì hiện tại lịch sử của tiếng Hy Lạp được giữ bằng dạng “nói”, tạo sắc thái kể chuyện trực tiếp và sinh động.
- source_word: Ἀκολούθει μοι
  choice: Hãy theo tôi
  rationale: Mệnh lệnh trực tiếp về việc làm môn đệ; cách diễn đạt này tự nhiên, rõ ràng, đồng thời có thể bao hàm cả đi theo và gắn bó với Đức Giê-su.
- source_word: ἄφες
  choice: cứ để
  rationale: Diễn tả mệnh lệnh buông lại hoặc không nhận lấy trách nhiệm ấy. “Cứ để” tự nhiên trong tiếng Việt và giữ được sắc thái dứt khoát mà không diễn giải thêm.
- source_word: νεκρούς ... νεκρούς
  choice: người chết ... người chết
  rationale: Giữ nguyên sự lặp từ có chủ ý trong tiếng Hy Lạp, qua đó bảo toàn lối chơi chữ và căng thẳng thần học giữa nghĩa có thể là ẩn dụ ở lần đầu và nghĩa thể lý ở lần sau.
- source_word: θάψαι
  choice: chôn
  rationale: Động từ nguyên mẫu sau ἄφες được diễn đạt tự nhiên trong cấu trúc tiếng Việt “để ... chôn”.
- source_word: τοὺς ἑαυτῶν νεκρούς
  choice: người chết của họ
  rationale: Giữ ý sở hữu phản thân của ἑαυτῶν trong cách nói tiếng Việt tự nhiên; ngữ cảnh cho thấy đó là những người chết thuộc về chính nhóm được nhắc đến.
theological_decisions:
- issue: Cách hiểu “người chết” trong lời phán của Đức Giê-su
  choice: Giữ nguyên “người chết ... người chết của họ” trong chính văn, không thêm “về phần tâm linh”.
  alternative: Hiểu “người chết” thứ nhất theo nghĩa ẩn dụ là những người không đáp ứng về mặt tâm linh, còn “người chết” thứ hai là những người đã chết về thể xác.
  rationale: Câu Hy Lạp cố ý dùng cùng một từ ở cả hai vị trí, tạo lối nói nghịch lý. Việc thêm lời giải nghĩa vào chính văn sẽ giải quyết một sự mơ hồ mà nguyên văn vẫn để ngỏ; cách hiểu ẩn dụ có khả năng cao được nêu trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và trực tiếp. Dùng “Đức Giê-su” theo lối gọi kính trọng phổ biến; đại từ “tôi” phản ánh lời nói trực tiếp tự nhiên. Dấu chú thích [a] được đặt sau toàn bộ lời phán vì chú thích giải thích sự tương phản giữa hai lần dùng “người chết”.
