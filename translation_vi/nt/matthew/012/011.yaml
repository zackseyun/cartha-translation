  - severity: low
    issue: Chú thích b sẽ không còn là một phương án thay thế nếu thân bài dùng “nâng nó lên.”
    rationale: Đổi chú thích thành phương án tự nhiên “nhấc nó lên” để duy trì chức năng chú thích từ vựng.
