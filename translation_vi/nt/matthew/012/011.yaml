revisions:
- from: 'Nhưng Ngài phán với họ: “Người nào trong các ông, nếu có một con chiên và nó rơi xuống hố vào ngày Sa-bát[a], lại không nắm lấy nó và kéo nó lên sao?[b]”'
  to: 'Nhưng Ngài phán với họ: “Người nào trong các ông, nếu có một con chiên mà nó rơi xuống hố vào ngày Sa-bát[a], lại không nắm lấy nó và nâng nó lên sao?[b]”'
  rationale: Thay “kéo” bằng “nâng” để phản ánh trực tiếp hơn ἐγερεῖ và tránh thêm cách thức giải cứu không được nêu rõ. Chú thích b được điều chỉnh thành một lựa chọn từ vựng thực sự khác với thân bài. Các yếu tố còn lại được giữ nguyên vì trung thành với tiếng Hy Lạp và tự nhiên trong tiếng Việt hiện đại.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T02:47:25Z'
