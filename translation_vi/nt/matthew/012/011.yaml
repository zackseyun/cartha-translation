id: MAT.12.11
reference: Matthew 12:11
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτοῖς· Τίς ⸀ἔσται ἐξ ὑμῶν ἄνθρωπος ὃς ἕξει πρόβατον ἕν, καὶ ἐὰν ἐμπέσῃ τοῦτο τοῖς σάββασιν εἰς βόθυνον, οὐχὶ κρατήσει αὐτὸ καὶ ἐγερεῖ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/011.yaml
  text: But he said to them[a], “Which man among you, if he has one sheep and it falls into a pit on the Sabbath[b], will not take hold of it and lift it out?”
translation:
  language: vi
  text: 'Nhưng Ngài phán với họ: “Người nào trong các ông, nếu có một con chiên mà nó rơi xuống hố vào ngày Sa-bát[a], lại không nắm lấy nó và nâng nó lên sao?[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tiếng Hy Lạp dùng dạng số nhiều “các ngày Sa-bát” theo lối thành ngữ, với nghĩa “ngày Sa-bát.”
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “nhấc nó lên sao?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τίς ἔσται ἐξ ὑμῶν ἄνθρωπος
  choice: Người nào trong các ông
  rationale: Diễn đạt tự nhiên câu hỏi tu từ, đồng thời giữ hình thức đại diện giống đực số ít của ἄνθρωπος trong ngữ cảnh này.
- source_word: ἕξει πρόβατον ἕν
  choice: nếu có một con chiên
  rationale: Dùng thì hiện tại trong mệnh đề giả định theo cách nói tự nhiên của tiếng Việt, đồng thời giữ sự nhấn mạnh vào số lượng một.
- source_word: ἐὰν ἐμπέσῃ τοῦτο
  choice: và nó rơi xuống
  rationale: Đại từ τοῦτο chỉ con chiên; “rơi xuống” thể hiện rõ chuyển động vào hố mà không thêm chi tiết ngoài văn cảnh.
- source_word: τοῖς σάββασιν
  choice: vào ngày Sa-bát
  rationale: Dạng số nhiều trong tiếng Hy Lạp được dùng theo lối thành ngữ để chỉ ngày Sa-bát; số ít là cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: εἰς βόθυνον
  choice: xuống hố
  rationale: βόθυνος chỉ một cái hố hoặc chỗ trũng sâu; “hố” là từ rộng, rõ nghĩa và không xác định quá mức.
- source_word: οὐχὶ
  choice: lại không ... sao?
  rationale: Cấu trúc câu hỏi này thể hiện rõ rằng người nói chờ đợi câu trả lời khẳng định.
- source_word: κρατήσει αὐτὸ
  choice: nắm lấy nó
  rationale: Giữ nghĩa cốt lõi của κρατέω là nắm hoặc giữ chắc, với cách nói trang trọng và tự nhiên.
- source_word: ἐγερεῖ
  choice: kéo nó lên
  rationale: Trong văn cảnh con chiên ở dưới hố, động từ mang nghĩa nâng con vật lên; “kéo nó lên” diễn đạt tự nhiên hướng chuyển động được hàm ý.
theological_decisions:
- issue: Ngôn ngữ đại diện giống đực
  choice: Người nào trong các ông
  alternative: Ai trong các ông
  rationale: Bản dịch giữ đối tượng được Đức Chúa Giê-xu trực tiếp nói đến là những người nam, nhưng vẫn dùng cấu trúc tiếng Việt tự nhiên.
- issue: Cách hiểu dạng số nhiều σάββασιν
  choice: vào ngày Sa-bát
  alternative: vào các ngày Sa-bát
  rationale: Đây là dạng số nhiều mang tính thành ngữ, chỉ ngày Sa-bát trong tình huống giả định, chứ không nói rằng con chiên rơi xuống hố vào nhiều ngày.
- issue: Mức độ minh thị của ἐγερεῖ
  choice: kéo nó lên
  alternative: nâng nó lên
  rationale: “Kéo nó lên” phù hợp với hình ảnh giải cứu con chiên khỏi hố, nhưng không thêm một động từ riêng tương đương với “đưa ra khỏi” vốn không xuất hiện minh thị trong tiếng Hy Lạp.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Ngài phán” phù hợp với lời thuật về Đức Chúa Giê-xu; câu hỏi tu từ được giữ bằng cấu trúc “lại không ... sao?” để truyền đạt câu trả lời khẳng định được ngầm chờ đợi.
