  naturalness: Văn phong hiện đại, trang trọng và câu hỏi “lại không ... sao?” tự nhiên trong tiếng Việt. “Người nào trong các ông” phù hợp ngữ cảnh đối thoại trực tiếp với những người nam.
  terminology: “Ngài phán,” “con chiên,” “hố,” và “ngày Sa-bát” đều phù hợp. Cần điều chỉnh chú thích b vì cách dịch thay thế hiện tại trùng với cách diễn đạt nên dùng trong thân bài sau khi sửa động từ.
  issues:
