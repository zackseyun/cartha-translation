revisions:
- from: Người sẽ không tranh cãi, cũng không kêu lớn; chẳng ai nghe tiếng Người ngoài đường phố.[a]
  to: Người sẽ không tranh cãi, cũng không kêu lớn; chẳng ai sẽ nghe tiếng Người trên các đường phố.[a]
  rationale: Đổi “ngoài đường phố” thành “trên các đường phố” để phản ánh chính xác hơn ἐν ταῖς πλατείαις mà vẫn giữ tiếng Việt hiện đại. Chú thích được thu hẹp để các phương án thay thế bám sát các từ Hy Lạp tương ứng. Không thay đổi ý nghĩa hay thêm diễn giải thần học.
