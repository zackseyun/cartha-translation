  text: οὐκ ἐρίσει οὐδὲ κραυγάσει, οὐδὲ ἀκούσει τις ἐν ταῖς πλατείαις τὴν φωνὴν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/019.yaml
  text: He will not quarrel or cry out[a], and no one will hear his voice in the streets.
translation:
  language: vi
  text: Người sẽ không tranh cãi, cũng không kêu lớn; chẳng ai sẽ nghe tiếng Người trên các đường phố.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Người sẽ không tranh đấu hay la lớn; chẳng ai sẽ nghe tiếng Người tại các quảng trường công cộng.”'
    reason: Các từ ἐρίζω, κραυγάζω và πλατεῖα lần lượt có thể được dịch là “tranh đấu,” “la lớn” và “các quảng trường công cộng.”
lexical_decisions:
- source_word: ἐρίσει
  choice: sẽ không tranh cãi
  rationale: Động từ ἐρίζω chỉ việc gây tranh chấp hoặc cãi vã. “Tranh cãi” tự nhiên trong tiếng Việt hiện đại và diễn tả thái độ không hiếu chiến của Người Đầy Tớ.
- source_word: κραυγάσει
  choice: cũng không kêu lớn
  rationale: κραυγάζω diễn tả việc cất tiếng lớn. “Kêu lớn” giữ được sắc thái âm lượng công khai mà không nhất thiết hàm ý hung hăng như “la hét”.
- source_word: ἀκούσει τις
  choice: chẳng ai nghe
  rationale: Đại từ bất định τις nằm trong chuỗi phủ định nên mang nghĩa “chẳng ai”; cách dịch này tự nhiên và giữ nguyên lực phủ định của câu Hy Lạp.
- source_word: ἐν ταῖς πλατείαις
  choice: ngoài đường phố
  rationale: πλατεῖα chỉ đường rộng hoặc nơi công cộng trong đô thị. “Ngoài đường phố” diễn đạt tự nhiên bối cảnh công khai, đồng thời chú thích giữ lại khả năng hiểu là quảng trường.
- source_word: φωνὴν αὐτοῦ
  choice: tiếng Người
  rationale: φωνή ở đây là tiếng nói/giọng nói. “Tiếng Người” gọn, tự nhiên trong cấu trúc “nghe tiếng”, và đại từ viết hoa thể hiện sự tôn kính mà không thêm nội dung thần học.
- source_word: οὐκ…οὐδὲ…οὐδὲ
  choice: không…cũng không…chẳng ai…
  rationale: Cấu trúc này bảo toàn ba lớp phủ định tích lũy của nguyên văn bằng cú pháp tiếng Việt hiện đại.
theological_decisions:
- issue: Mối liên hệ với lời trích về Người Đầy Tớ trong Ê-sai và cách mô tả phong thái của Đấng Mê-si-a
  choice: Câu được dịch như lời mô tả Người không tranh cãi và không phô trương bằng tiếng kêu lớn nơi công cộng.
  alternative: Có thể dịch sát hình thức hơn là “không tranh đấu, không la lớn” để gần lối diễn đạt truyền thống.
  rationale: Nguyên văn mô tả phong thái ôn hòa, không gây náo động của Người Đầy Tớ; nó không khẳng định rằng Người tuyệt đối im lặng hay không bao giờ giảng dạy công khai.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Nhịp ba vế phủ định được giữ rõ; “Người” dùng nhất quán để chỉ nhân vật Mê-si-a trong lời trích.
