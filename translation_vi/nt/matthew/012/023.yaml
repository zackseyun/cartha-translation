base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/023.yaml
  text: And all the crowds were astonished and said[b][a], “Can this be the Son of David?”
translation:
  language: vi
  text: 'Tất cả đám đông đều kinh ngạc và nói: “Chẳng lẽ người này là Con vua Đa-vít sao?”[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Con vua Đa-vít” là một danh hiệu chỉ Đấng Mê-si-a, tức vị vua giải cứu đã được hứa sẽ đến từ dòng dõi Đa-vít.
    reason: cross_reference
  - marker: b
    text: 'Cũng có thể dịch sát sắc thái của câu hỏi hơn: “Người này hẳn không phải là Con vua Đa-vít, phải không?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξίσταντο
  choice: đều kinh ngạc
  rationale: Động từ ở thì chưa hoàn thành diễn tả phản ứng kinh ngạc đang diễn ra; “kinh ngạc” tự nhiên, trang trọng và giữ được cường độ của từ Hy Lạp.
- source_word: πάντες οἱ ὄχλοι
  choice: tất cả các đám đông
  rationale: Giữ cả ý toàn thể của πάντες và hình thức số nhiều của ὄχλοι, dù tiếng Việt thông thường cũng có thể nói “mọi người” hoặc “cả đám đông”.
- source_word: ἔλεγον
  choice: nói
  rationale: Thì chưa hoàn thành có thể hàm ý họ đang nói hoặc nói với nhau; trong lời dẫn hội thoại tiếng Việt, “nói” là cách diễn đạt tự nhiên mà không loại trừ sắc thái tiếp diễn.
- source_word: Μήτι
  choice: Chẳng lẽ ... sao?
  rationale: Μήτι thường mở đầu câu hỏi thiên về câu trả lời phủ định hoặc bộc lộ sự dè dặt. “Chẳng lẽ ... sao?” bảo toàn sự ngạc nhiên và hoài nghi mà không biến lời hỏi thành lời phủ nhận dứt khoát.
- source_word: ὁ υἱὸς Δαυίδ
  choice: Con vua Đa-vít
  rationale: Giữ nguyên danh hiệu gắn với dòng dõi Đa-vít; thêm “vua” để danh hiệu rõ và tự nhiên với độc giả Việt, đồng thời không diễn giải thẳng thành “Đấng Mê-si-a”.
theological_decisions:
- issue: Ý nghĩa Mê-si-a của ὁ υἱὸς Δαυίδ
  choice: Giữ danh hiệu “Con vua Đa-vít” trong chính văn.
  alternative: “Đấng Mê-si-a” hoặc “người thừa kế ngai Đa-vít đã được hứa”
  rationale: Nguyên văn dùng danh hiệu lịch sử-thần học này chứ không trực tiếp dùng từ “Đấng Mê-si-a”; giữ danh hiệu bảo toàn cách diễn đạt và sức căng thần học của câu.
- issue: Sắc thái dè dặt của Μήτι
  choice: Dịch thành câu hỏi “Chẳng lẽ ... sao?”
  alternative: “Người này không thể là Con vua Đa-vít, phải không?”
  rationale: Cách chọn giữ khuynh hướng mong đợi câu trả lời phủ định nhưng vẫn để ngỏ sự thắc mắc của đám đông, thay vì biến nó thành lời phủ nhận chắc chắn.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Cấu trúc “Chẳng lẽ ... sao?” tái hiện tự nhiên sự kinh ngạc pha hoài nghi; “Con vua Đa-vít” bảo toàn danh hiệu Mê-si-a mà không giải nghĩa quá mức trong chính văn.
