id: MAT.12.40
reference: Matthew 12:40
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὥσπερ γὰρ ἦν Ἰωνᾶς ἐν τῇ κοιλίᾳ τοῦ κήτους τρεῖς ἡμέρας καὶ τρεῖς νύκτας, οὕτως ἔσται ὁ υἱὸς τοῦ ἀνθρώπου ἐν τῇ καρδίᾳ τῆς γῆς τρεῖς ἡμέρας καὶ τρεῖς νύκτας.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/040.yaml
  text: For just as Jonah was in the belly of the sea creature three days and three nights[c][b][a], so the Son of Man will be in the heart of the earth three days and three nights.
translation:
  language: vi
  text: Vì như Giô-na đã ở trong bụng một sinh vật biển lớn[a] ba ngày ba đêm[c], thì Con Người cũng sẽ ở trong lòng đất[b] ba ngày ba đêm.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “cá lớn”. Từ Hy Lạp chỉ một sinh vật biển lớn, có phạm vi nghĩa rộng hơn một thuật ngữ động vật học cụ thể.
    reason: lexical_alternative
  - marker: b
    text: “Trong lòng đất” có thể nói đến việc được chôn cất, mồ mả, những nơi sâu thẳm hoặc cõi người chết; bản văn chính giữ nguyên cách nói ẩn dụ của tiếng Hy Lạp.
    reason: alternative_reading
  - marker: c
    text: “Ba ngày ba đêm” đôi khi được hiểu theo lối nói kể cả những phần của ba ngày, nhưng cũng có người hiểu theo nghĩa thời lượng nghiêm ngặt hơn.
    reason: alternative_reading
lexical_decisions:
- source_word: ὥσπερ γὰρ
  choice: Vì như
  rationale: “Vì” thể hiện chức năng giải thích hoặc liên kết của γάρ, còn “như” mở đầu phép so sánh của ὥσπερ; cách diễn đạt này tự nhiên trong tiếng Việt khi đi với “thì… cũng… như vậy” ở vế sau.
- source_word: Ἰωνᾶς
  choice: Giô-na
  rationale: Dùng dạng tên riêng Kinh Thánh quen thuộc trong tiếng Việt.
- source_word: ἐν τῇ κοιλίᾳ
  choice: ở trong bụng
  rationale: κοιλία ở đây chỉ bụng; “trong bụng” vừa sát nghĩa vừa tự nhiên, đồng thời giữ liên hệ với câu chuyện Giô-na.
- source_word: τοῦ κήτους
  choice: một sinh vật biển
  rationale: κῆτος chỉ một sinh vật biển lớn và không nhất thiết là một loài động vật cụ thể. “Sinh vật biển” tránh thu hẹp nghĩa thành “cá” hoặc tạo sắc thái thần thoại như “thủy quái”; từ “một” giúp cụm danh từ tự nhiên trong tiếng Việt.
- source_word: τρεῖς ἡμέρας καὶ τρεῖς νύκτας
  choice: ba ngày ba đêm
  rationale: Dịch trực tiếp biểu thức thời gian được lặp lại trong câu, không diễn giải trước cách tính thời gian.
- source_word: οὕτως
  choice: thì… cũng… như vậy
  rationale: Cấu trúc tương liên “như… thì… cũng… như vậy” chuyển tải rõ phép so sánh giữa Giô-na và Con Người bằng tiếng Việt tự nhiên.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Con Người
  rationale: Dạng dịch quen thuộc của tước hiệu này trong Kinh Thánh tiếng Việt, giữ được âm hưởng và tính đa nghĩa của cách tự xưng.
- source_word: ἔσται
  choice: sẽ ở
  rationale: Diễn đạt trực tiếp thì tương lai của εἰμί, không thêm nét nghĩa kéo dài như “sẽ ở lại”.
- source_word: ἐν τῇ καρδίᾳ τῆς γῆς
  choice: ở trong lòng đất
  rationale: “Lòng đất” giữ hình ảnh καρδία (“lòng/trái tim”) trong một cách nói tự nhiên của tiếng Việt, không tự ý xác định đó là mộ, sự chết hay cõi người chết.
theological_decisions:
- issue: Ý nghĩa của “lòng đất”
  choice: Giữ cách nói ẩn dụ “trong lòng đất” mà không xác định cụ thể nơi chôn cất, mồ mả hay cõi người chết.
  alternative: “trong mộ”, “trong nơi sâu thẳm của đất” hoặc “trong cõi người chết”
  rationale: Cụm Hy Lạp mang tính ẩn dụ và không buộc phải hiểu theo duy nhất một cách; bản dịch chính giữ nguyên độ mở thần học của câu.
- issue: Ý nghĩa thời gian của “ba ngày ba đêm”
  choice: Giữ nguyên biểu thức “ba ngày ba đêm” ở cả hai vế.
  alternative: Hiểu theo lối nói bao gồm những phần của ba ngày, hoặc hiểu nghiêm ngặt là đủ ba ngày và ba đêm.
  rationale: Câu văn nêu rõ biểu thức này nhưng không giải quyết trực tiếp cuộc tranh luận về cách tính thời gian; bản dịch không nên âm thầm chọn một cách hiểu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cấu trúc “như… thì… cũng… như vậy” làm rõ phép so sánh mà vẫn theo sát trật tự lập luận của nguyên văn. Các thuật ngữ gây tranh luận được giữ ở dạng rộng hoặc ẩn dụ trong câu chính, với những cách hiểu khác được nêu trong chú thích.
