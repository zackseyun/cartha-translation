    rationale: Trong cấu trúc «như… thì… cũng…», từ «cũng» đã đánh dấu vế tương ứng của οὕτως; lược bỏ «như vậy» làm tiếng Việt tự nhiên hơn, không làm mất quan hệ so sánh.
