  source_fidelity: 'Cần sửa nhẹ: κῆτος chỉ một sinh vật biển lớn; cụm chính «một sinh vật biển» quá rộng trong tiếng Việt và có thể bao gồm cả những sinh vật biển rất nhỏ. Các thành phần khác giữ đúng phép so sánh, thì tương lai, tước hiệu «Con Người», hình ảnh ẩn dụ «lòng đất», và sự lặp lại của thời lượng.'
