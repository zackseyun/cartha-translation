id: MAT.12.34
reference: Matthew 12:34
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: γεννήματα ἐχιδνῶν, πῶς δύνασθε ἀγαθὰ λαλεῖν πονηροὶ ὄντες; ἐκ γὰρ τοῦ περισσεύματος τῆς καρδίας τὸ στόμα λαλεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/034.yaml
  text: Offspring of vipers[b][a], how can you speak good things when you are evil? For out of the overflow of the heart the mouth speaks.
translation:
  language: vi
  text: Hỡi nòi rắn độc[a], các ngươi là kẻ ác thì làm sao có thể nói những điều tốt lành? Vì từ sự đầy tràn của lòng mà miệng nói ra.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Dòng dõi rắn lục.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “Vì miệng nói ra từ sự dư dật của lòng.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: γεννήματα ἐχιδνῶν
  choice: nòi rắn độc
  rationale: γεννήματα chỉ những gì được sinh ra, còn ἐχιδνῶν chỉ loài rắn có nọc độc. “Nòi rắn độc” giữ được hình ảnh về nguồn gốc và tính cách, đồng thời có sức quở trách mạnh và tự nhiên trong tiếng Việt.
- source_word: πῶς δύνασθε
  choice: làm sao có thể
  rationale: Cách diễn đạt này truyền đạt câu hỏi tu từ về sự bất khả hoặc bất lực về mặt đạo đức, đồng thời tự nhiên trong tiếng Việt hiện đại.
- source_word: ἀγαθὰ λαλεῖν
  choice: nói những điều tốt lành
  rationale: ἀγαθά là tính từ trung tính số nhiều được dùng như danh từ; bản dịch giữ nội dung số nhiều và sắc thái đạo đức tích cực mà không diễn giải thêm.
- source_word: πονηροὶ ὄντες
  choice: các ngươi vốn gian ác
  rationale: Phân từ ὄντες mô tả tình trạng hiện hữu của người nghe. “Vốn gian ác” diễn đạt tự nhiên mối tương phản với việc nói điều tốt lành và giữ nguyên sức nặng luân lý của πονηροί.
- source_word: ἐκ γὰρ τοῦ περισσεύματος
  choice: vì ... từ điều đầy tràn
  rationale: περίσσευμα có nghĩa là sự dư dật, đầy tràn hoặc phần tràn ra. Cách dịch này giữ hình ảnh lời nói phát xuất từ sự đầy tràn bên trong, nhưng tránh lối nói quá cứng trong tiếng Việt.
- source_word: τῆς καρδίας
  choice: trong lòng
  rationale: καρδία chỉ trung tâm nội tâm của con người, bao gồm tư tưởng, ý chí và tình cảm. “Lòng” là từ tương đương rộng, tự nhiên và quen thuộc trong tiếng Việt.
- source_word: τὸ στόμα λαλεῖ
  choice: miệng nói ra
  rationale: Giữ nguyên hình ảnh cụ thể của miệng như chủ thể phát ngôn và diễn đạt tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Ý nghĩa ẩn dụ của καρδία
  choice: Giữ từ “lòng” để chỉ trung tâm nội tâm của con người.
  alternative: nội tâm; tâm trí
  rationale: Bản văn quy lời nói bên ngoài về tình trạng đạo đức bên trong. “Lòng” giữ được phạm vi ý nghĩa rộng của καρδία, không thu hẹp nó thành cảm xúc hay trí năng בלבד.
- issue: Sức nặng đạo đức của πονηροί
  choice: Dịch là “gian ác”.
  alternative: xấu; độc ác
  rationale: Chúa Giê-su đang đưa ra phán đoán đạo đức chứ không chỉ nói về phẩm chất kém. “Gian ác” đủ mạnh nhưng không cường điệu hơn nguyên văn.
- issue: Quan hệ giữa tình trạng bên trong và lời nói
  choice: Giữ hình ảnh miệng nói ra từ điều đầy tràn trong lòng.
  alternative: Diễn giải rằng lời nói luôn bộc lộ hoàn toàn bản chất con người.
  rationale: Nguyên văn nêu nguồn phát sinh của lời nói bằng một hình ảnh, nhưng không trình bày một hệ thống giáo lý chi tiết; vì vậy bản dịch không mở rộng hàm ý quá mức.
translation_notes:
  register: Văn phong hiện đại, trang trọng và trực tiếp. “Các ngươi” được dùng vì đây là lời quở trách công khai, tạo khoảng cách và giữ sắc thái nghiêm khắc; “nòi rắn độc” bảo toàn ẩn dụ mạnh của nguyên văn. Cấu trúc vế cuối được làm cho dễ hiểu trong tiếng Việt nhưng vẫn giữ hình ảnh về sự đầy tràn của lòng và cái miệng nói ra.
