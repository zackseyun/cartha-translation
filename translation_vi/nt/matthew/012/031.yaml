  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: διὰ τοῦτο λέγω ὑμῖν, πᾶσα ἁμαρτία καὶ βλασφημία ἀφεθήσεται τοῖς ἀνθρώποις, ἡ δὲ τοῦ πνεύματος βλασφημία οὐκ ⸀ἀφεθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/031.yaml
  text: Therefore I tell you[a], every sin and blasphemy will be forgiven people[b], but blasphemy against the Spirit will not be forgiven.
translation:
  language: vi
  text: 'Vì vậy, tôi nói với các ông: Mọi tội lỗi và lời phạm thượng đều sẽ được tha cho người ta, nhưng lời phạm thượng chống lại Thánh Linh[a] sẽ không được tha.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn chỉ ghi “Linh”; văn cảnh cho thấy đây là Thánh Linh.
    reason: source_precision
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Vì vậy
  rationale: Diễn tả tự nhiên quan hệ suy luận từ văn cảnh trước.
- source_word: λέγω ὑμῖν
  choice: tôi nói với các ông
  rationale: Giữ công thức phát ngôn trực tiếp và số nhiều của ὑμῖν; trong văn cảnh, Chúa Giê-su đang nói với nhóm người đối thoại.
- source_word: πᾶσα ἁμαρτία καὶ βλασφημία
  choice: mọi tội lỗi và lời phạm thượng
  rationale: “Mọi” truyền đạt ý phân bố của πᾶσα; “lời phạm thượng” diễn tả tự nhiên hành vi ngôn từ xúc phạm điều thánh.
- source_word: ἀφεθήσεται τοῖς ἀνθρώποις
  choice: đều sẽ được tha cho người ta
  rationale: Giữ thể bị động và người nhận sự tha thứ trong τοῖς ἀνθρώποις; “người ta” mang nghĩa con người nói chung, không giới hạn giới tính.
- source_word: ἡ δὲ τοῦ πνεύματος βλασφημία
  choice: nhưng lời phạm thượng đến Thánh Linh
  rationale: Hiểu sở hữu cách là đối tượng của sự phạm thượng. “Thánh Linh” là cách gọi tự nhiên trong tiếng Việt và làm rõ đối tượng đã được xác định bởi văn cảnh, dù câu Hy Lạp chỉ ghi “Linh”.
- source_word: οὐκ ἀφεθήσεται
  choice: sẽ không được tha
  rationale: Phản ánh trực tiếp thì tương lai, thể bị động và duy trì thế đối lập với mệnh đề trước.
theological_decisions:
- issue: Có nên dịch πνεύματος là “Linh” hay “Thánh Linh”
  choice: Thánh Linh
  alternative: Linh
  rationale: Bản thân câu này chỉ có τοῦ πνεύματος, không có ἁγίου, nên “Linh” sát hình thức hơn. Tuy nhiên, văn cảnh ngay trước đó xác định rõ là Thánh Linh; tiếng Việt khó dùng “Linh” độc lập một cách tự nhiên và rõ nghĩa. Chú thích bảo tồn dữ kiện nguyên văn.
- issue: Quan hệ của τοῦ πνεύματος với βλασφημία
  choice: phạm thượng đến Thánh Linh
  alternative: sự phạm thượng của Thánh Linh
  rationale: Sở hữu cách ở đây chỉ đối tượng bị phạm thượng, không hàm ý Thánh Linh là chủ thể thực hiện sự phạm thượng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “các ông” cho đối tượng số nhiều trong văn cảnh thay vì “các ngươi”, vốn cổ và nặng sắc thái. Cấu trúc bị động được giữ để bảo toàn sự song song và trọng tâm thần học giữa hai mệnh đề.
