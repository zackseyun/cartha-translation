id: MAT.12.44
reference: Matthew 12:44
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: τότε λέγει· ⸂Εἰς τὸν οἶκόν μου ἐπιστρέψω⸃ ὅθεν ἐξῆλθον· καὶ ἐλθὸν ⸀εὑρίσκει ⸀σχολάζοντα σεσαρωμένον καὶ κεκοσμημένον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/044.yaml
  text: Then it says[a], ‘I will return to my house from which I came out,’ and when it comes, it finds it unoccupied, swept[b], and put in order.
translation:
  language: vi
  text: 'Bấy giờ, nó nói: “Ta sẽ trở về nhà ta, từ nơi ta đã đi ra.” Khi đến, nó thấy nhà ấy bỏ trống[a], đã được quét sạch và sắp xếp ngăn nắp[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “trống không”.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “được trang hoàng” hoặc “được trang trí”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε λέγει
  choice: Bấy giờ, nó nói
  rationale: Giữ trạng từ chỉ trình tự và thì hiện tại lịch sử sống động. Đại từ “nó” chỉ tà linh trong ngữ cảnh trước, tự nhiên trong tiếng Việt.
- source_word: Εἰς τὸν οἶκόν μου ἐπιστρέψω
  choice: Ta sẽ trở về nhà ta
  rationale: Giữ động từ chỉ sự quay lại và nguyên vẹn lời khẳng định sở hữu “nhà ta” của tà linh.
- source_word: ὅθεν ἐξῆλθον
  choice: nơi ta đã ra đi
  rationale: Diễn đạt tự nhiên ý “từ nơi mà ta đã đi ra”; “đã” thể hiện hành động xảy ra trước việc trở về.
- source_word: ἐλθὸν εὑρίσκει
  choice: Khi trở lại, nó thấy
  rationale: Chuyển phân từ aorist thành mệnh đề thời gian tự nhiên, đồng thời giữ thì hiện tại lịch sử của động từ chính.
- source_word: σχολάζοντα
  choice: đang bỏ trống
  rationale: Trong hình ảnh ngôi nhà, từ này có thể chỉ trạng thái không có người ở hoặc trống không; “bỏ trống” nhấn mạnh rằng nhà không được chiếm giữ mà không giải nghĩa ẩn dụ.
- source_word: σεσαρωμένον
  choice: đã được quét sạch
  rationale: Thể hiện trạng thái hoàn tất của phân từ hoàn thành bị động và sắc thái căn nhà đã được quét.
- source_word: κεκοσμημένον
  choice: sắp xếp ngăn nắp
  rationale: κοσμέω có thể chỉ việc sắp đặt cho có trật tự hoặc trang hoàng; cách dịch này phù hợp ngữ cảnh căn nhà và không nhấn quá mức yếu tố trang trí.
theological_decisions:
- issue: Ý nghĩa ẩn dụ của “nhà” trong lời nói về tà linh trở lại
  choice: Giữ nguyên hình ảnh “nhà” trong chính văn, không diễn giải thành “người” hay “cuộc đời”.
  alternative: Ta sẽ trở về với người mà ta đã rời khỏi.
  rationale: Bản văn dùng οἶκος (“nhà”). Giữ hình ảnh cụ thể bảo toàn cách nói tu từ và tránh đưa phần giải nghĩa vào bản dịch.
- issue: Trạng thái của ngôi nhà trong σχολάζοντα
  choice: Dịch “đang bỏ trống” và ghi chú khả năng “trống không”.
  alternative: trống không
  rationale: Hai cách đều nằm trong phạm vi nghĩa của từ Hy Lạp. “Bỏ trống” làm rõ trạng thái không được chiếm giữ nhưng chú thích bảo tồn phương án trực tiếp hơn.
- issue: Sắc thái của κεκοσμημένον
  choice: Dịch “sắp xếp ngăn nắp” và ghi chú khả năng “trang hoàng/trang trí”.
  alternative: được trang hoàng
  rationale: Từ Hy Lạp cho phép cả nghĩa sắp đặt có trật tự lẫn trang hoàng; chính văn chọn cách phù hợp ngữ cảnh hơn nhưng không loại bỏ nghĩa kia.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “ta” trong lời tự thuật của tà linh để giữ sắc thái trang nghiêm của lời trích dẫn; dùng “nó” ở lời kể. Ba trạng thái cuối câu được diễn đạt cân đối, với thể bị động hoàn thành thể hiện rõ ở “đã được quét sạch” và được hiểu tiếp sang “sắp xếp ngăn nắp”.
