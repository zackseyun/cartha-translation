revisions:
- from: Những người đàn ông ở Ni-ni-ve sẽ trỗi dậy trong cuộc phán xét cùng với thế hệ này và sẽ kết án thế hệ ấy, vì họ đã ăn năn trước lời rao giảng của Giô-na[a]; và này, tại đây có điều lớn hơn Giô-na.[b]
  to: Những người đàn ông ở Ni-ni-ve sẽ trỗi dậy trong cuộc phán xét cùng với thế hệ này và sẽ kết án thế hệ ấy, vì họ đã ăn năn đáp lại lời rao giảng của Giô-na[a]; và kìa, tại đây có điều lớn hơn Giô-na.[b]
  rationale: Sửa giới từ “trước” thành cụm “đáp lại” để phản ánh đúng quan hệ đáp ứng mà εἰς τὸ κήρυγμα biểu thị sau động từ “ăn năn.” Đổi “này” thành “kìa” để truyền đạt rõ hơn sắc thái thu hút chú ý của ἰδού. Không thay đổi ý nghĩa hay mức độ mở của cách nói trung tính πλεῖον.
