    issue: “trước lời rao giảng của Giô-na”
    rationale: “Trước” trong tiếng Việt chủ yếu chỉ thời điểm hoặc vị trí, nên có thể đảo nghĩa quan hệ của εἰς τὸ κήρυγμα. Ngữ cảnh và cách dùng sau μετανοέω cho thấy họ ăn năn để đáp lại lời công bố của Giô-na.
