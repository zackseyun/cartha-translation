id: MAT.12.41
reference: Matthew 12:41
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἄνδρες Νινευῖται ἀναστήσονται ἐν τῇ κρίσει μετὰ τῆς γενεᾶς ταύτης καὶ κατακρινοῦσιν αὐτήν· ὅτι μετενόησαν εἰς τὸ κήρυγμα Ἰωνᾶ, καὶ ἰδοὺ πλεῖον Ἰωνᾶ ὧδε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/041.yaml
  text: The men of Nineveh will rise up in the judgment with this generation and will condemn it[a], because they repented at the preaching of Jonah, and behold[b], something greater than Jonah is here.
translation:
  language: vi
  text: Những người đàn ông ở Ni-ni-ve sẽ trỗi dậy trong cuộc phán xét cùng với thế hệ này và sẽ kết án thế hệ ấy, vì họ đã ăn năn đáp lại lời rao giảng của Giô-na[a]; và kìa, tại đây có điều lớn hơn Giô-na.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “vì họ đã ăn năn khi nghe lời công bố của Giô-na.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “tại đây có Đấng lớn hơn Giô-na.” Tiếng Hy Lạp dùng một cách nói ở giống trung, sát nghĩa là “điều lớn hơn Giô-na”, có thể nhấn mạnh thực tại lớn hơn đang hiện diện nơi Chúa Giê-su chứ không chỉ so sánh hai nhân vật.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἄνδρες Νινευῖται
  choice: Những người đàn ông ở Ni-ni-ve
  rationale: Giữ nghĩa giống đực số nhiều của ἄνδρες, đồng thời diễn đạt Νινευῖται bằng cách tự nhiên, dễ hiểu trong tiếng Việt hiện đại.
- source_word: ἀναστήσονται
  choice: sẽ trỗi dậy
  rationale: Diễn đạt hành động đứng dậy/xuất hiện trong bối cảnh phán xét và vẫn để ngỏ sắc thái phục sinh của động từ.
- source_word: ἐν τῇ κρίσει
  choice: trong cuộc phán xét
  rationale: Giữ trực tiếp ý nghĩa tư pháp và cánh chung của κρίσις mà không tự ý thêm từ “ngày” vốn không có trong nguyên văn.
- source_word: μετὰ τῆς γενεᾶς ταύτης
  choice: cùng với thế hệ này
  rationale: Phản ánh nghĩa thông thường của μετά với sở hữu cách là “cùng với”; sắc thái đối nghịch được thể hiện qua mệnh đề “sẽ kết án” tiếp theo.
- source_word: κατακρινοῦσιν αὐτήν
  choice: sẽ kết án thế hệ ấy
  rationale: Dịch rõ κατακρίνω là “kết án” và nêu lại tiền ngữ của αὐτήν để tránh đại từ mơ hồ trong tiếng Việt.
- source_word: μετενόησαν
  choice: đã ăn năn
  rationale: “Ăn năn” là cách diễn đạt tự nhiên và chính xác cho sự đáp ứng của người Ni-ni-ve trước sứ điệp tiên tri.
- source_word: εἰς τὸ κήρυγμα Ἰωνᾶ
  choice: trước lời rao giảng của Giô-na
  rationale: Diễn đạt mối liên hệ giữa sự ăn năn và lời công bố của Giô-na, đồng thời giữ cấu trúc tương đối sát nguyên văn.
- source_word: ἰδοὺ
  choice: này
  rationale: Là từ thu hút sự chú ý có sắc thái trang trọng nhưng vẫn tự nhiên hơn “kìa” trong cấu trúc câu này.
- source_word: πλεῖον Ἰωνᾶ ὧδε
  choice: tại đây có điều lớn hơn Giô-na
  rationale: Giữ hình thức trung tính của πλεῖον bằng “điều”, không tự động chuyển thành một danh từ chỉ người, đồng thời bảo tồn sự nhấn mạnh vào thực tại lớn hơn đang hiện diện.
theological_decisions:
- issue: Cách diễn đạt πλεῖον Ἰωνᾶ khi câu này quy chiếu đến Chúa Giê-su
  choice: tại đây có điều lớn hơn Giô-na
  alternative: tại đây có Đấng lớn hơn Giô-na
  rationale: Nguyên văn dùng dạng so sánh trung tính πλεῖον chứ không dùng dạng giống đực chỉ một người. Bản dịch giữ sự căng thẳng và độ mở ấy thay vì giải thích rõ hơn nguyên văn.
- issue: Giới tính trong ἄνδρες
  choice: những người đàn ông
  alternative: những người dân
  rationale: ἄνδρες nêu rõ nam giới; không trung tính hóa thành toàn thể dân cư.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ni-ni-ve” và “Giô-na” theo lối phiên âm Kinh Thánh quen thuộc; tránh thêm “ngày” trước “phán xét” và tránh giải nghĩa quá mức cách nói trung tính πλεῖον.
