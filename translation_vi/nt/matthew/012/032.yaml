id: MAT.12.32
reference: Matthew 12:32
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ὃς ἐὰν εἴπῃ λόγον κατὰ τοῦ υἱοῦ τοῦ ἀνθρώπου, ἀφεθήσεται αὐτῷ· ὃς δ’ ἂν εἴπῃ κατὰ τοῦ πνεύματος τοῦ ἁγίου, οὐκ ἀφεθήσεται αὐτῷ οὔτε ἐν ⸂τούτῳ τῷ⸃ αἰῶνι οὔτε ἐν τῷ μέλλοντι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/032.yaml
  text: And whoever speaks a word against the Son of Man[a], it will be forgiven him; but whoever speaks against the Holy Spirit, it will not be forgiven him[c][b], neither in this age nor in the coming one.
translation:
  language: vi
  text: Ai nói một lời chống lại Con Người[a] thì sẽ được tha; nhưng ai nói chống lại Đức Thánh Linh thì sẽ không được tha, cả trong thời đại này lẫn thời đại sắp đến.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Nói một lời” cũng có thể dịch là “thốt ra một lời.”
    reason: lexical_alternative
  - marker: b
    text: Nguyên văn Hy Lạp ở vế sau nói sát nghĩa là “trong [thời đại] sắp đến,” với “thời đại” được hiểu từ vế trước.
    reason: alternative_reading
lexical_decisions:
- source_word: ὃς ἐὰν / ὃς δ’ ἂν
  choice: ai ... nhưng ai
  rationale: Cấu trúc đại từ quan hệ với ἐάν/ἄν diễn đạt điều kiện khái quát, không xác định. “Ai ... thì” là cách nói tự nhiên trong tiếng Việt và vẫn giữ phạm vi áp dụng rộng.
- source_word: εἴπῃ λόγον
  choice: nói một lời
  rationale: Giữ rõ danh từ λόγον mà vẫn tự nhiên, trang trọng trong tiếng Việt; “thốt ra một lời” có thể gợi sắc thái bộc phát không nhất thiết có trong nguyên văn.
- source_word: κατὰ
  choice: chống lại
  rationale: Với sở hữu cách trong ngữ cảnh này, κατά chỉ lời nói mang tính đối nghịch và nhắm vào một đối tượng; “chống lại” rõ nghĩa trong cả hai vế.
- source_word: τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: Con Người
  rationale: Cách dịch danh hiệu truyền thống, chính xác và dễ nhận biết trong tiếng Việt, giữ được âm hưởng Đấng Mê-si và khải huyền của cụm từ Hy Lạp.
- source_word: ἀφεθήσεται αὐτῷ / οὐκ ἀφεθήσεται αὐτῷ
  choice: sẽ được tha / sẽ không được tha
  rationale: Thể bị động được giữ lại và áp dụng tự nhiên cho người phạm lỗi trong tiếng Việt; không thêm chủ thể thực hiện sự tha thứ mà nguyên văn không nêu.
- source_word: τοῦ πνεύματος τοῦ ἁγίου
  choice: Đức Thánh Linh
  rationale: Danh xưng phổ biến, trang trọng trong tiếng Việt hiện đại; giữ căn tính ngôi vị trong văn mạch mà không diễn giải thêm.
- source_word: οὔτε ἐν τούτῳ τῷ αἰῶνι οὔτε ἐν τῷ μέλλοντι
  choice: cả trong thời đại này lẫn thời đại sắp đến
  rationale: αἰών ở đây chỉ thời đại hơn là thế giới theo nghĩa không gian. Tiếng Việt cần lặp “thời đại” ở vế sau để câu rõ và tự nhiên, dù nguyên văn dùng lối tỉnh lược.
theological_decisions:
- issue: Sự tương phản thời gian giữa αἰών hiện tại và thời đại sắp đến
  choice: cả trong thời đại này lẫn thời đại sắp đến
  alternative: cả đời này lẫn đời sau; cả thế gian này lẫn thế gian sắp đến
  rationale: “Thời đại” bảo toàn khung thời gian–cánh chung của nguyên văn, tránh biến αἰών thành một thế giới theo nghĩa không gian hoặc đồng nhất trực tiếp với đời sống cá nhân hiện tại và hậu thế.
- issue: Bản chất của hành vi không được tha
  choice: Giữ nguyên lời cảnh báo về việc nói chống lại Đức Thánh Linh, không định nghĩa thêm hành vi ấy
  alternative: Giải thích đó là một lời cáo buộc lịch sử đặc thù hoặc là tình trạng cuối cùng không ăn năn
  rationale: Chính câu này nêu hành vi và hậu quả nhưng không cung cấp một định nghĩa thần học đầy đủ. Bản dịch không áp đặt cách giải thích hệ phái hay giáo lý về sau.
- issue: Tính bị động của lời tha thứ
  choice: sẽ được tha / sẽ không được tha
  alternative: Đức Chúa Trời sẽ tha / Đức Chúa Trời sẽ không tha
  rationale: Nguyên văn dùng thể bị động và không nêu tác nhân. Giữ thể bị động tránh thêm trực tiếp một chủ thể tuy có thể được ngầm hiểu về thần học.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng cấu trúc “ai ... thì” để thể hiện điều kiện khái quát; giữ danh hiệu “Con Người” và “Đức Thánh Linh.” “Cả ... lẫn ...” diễn đạt tự nhiên cặp phủ định οὔτε ... οὔτε sau mệnh đề “sẽ không được tha.”
