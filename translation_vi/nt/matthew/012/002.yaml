id: MAT.12.2
reference: Matthew 12:2
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οἱ δὲ Φαρισαῖοι ἰδόντες εἶπαν αὐτῷ· Ἰδοὺ οἱ μαθηταί σου ποιοῦσιν ὃ οὐκ ἔξεστιν ποιεῖν ἐν σαββάτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/002.yaml
  text: But when the Pharisees saw it[a], they said to him, “Look, your disciples are doing what is not lawful to do on the Sabbath.”
translation:
  language: vi
  text: 'Nhưng khi những người Pha-ri-si thấy vậy, họ nói với Ngài: “Kìa, các môn đồ của Ngài đang làm điều không được phép[a] làm trong ngày Sa-bát.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “không hợp luật.”'
    reason: Nêu cách dịch thay thế cho ἔξεστιν, vốn có thể nhấn mạnh điều được phép hoặc tính hợp luật.
lexical_decisions:
- source_word: δὲ
  choice: Nhưng
  rationale: Diễn tả sắc thái tương phản với hành động của các môn đồ được thuật lại ngay trước đó.
- source_word: ἰδόντες
  choice: khi ... thấy vậy
  rationale: Chuyển phân từ bất định quá khứ thành mệnh đề thời gian tự nhiên trong tiếng Việt; “vậy” chỉ hành động của các môn đồ theo văn cảnh mà không thêm chi tiết giải thích.
- source_word: εἶπαν αὐτῷ
  choice: họ nói với Ngài
  rationale: Cách diễn đạt trực tiếp, trung tính và tự nhiên cho công thức dẫn lời.
- source_word: Ἰδοὺ
  choice: Kìa
  rationale: Giữ sức mạnh chỉ dẫn, thu hút sự chú ý trong lời buộc tội, đồng thời phù hợp với văn phong Kinh Thánh hiện đại.
- source_word: μαθηταί
  choice: các môn đồ
  rationale: Thuật ngữ quen thuộc, chính xác, giữ quan hệ thầy–trò trong bối cảnh các sách Phúc Âm.
- source_word: ποιοῦσιν ... ποιεῖν
  choice: đang làm ... làm
  rationale: Giữ sự lặp lại của động từ ποιέω trong nguyên văn mà câu tiếng Việt vẫn rõ ràng.
- source_word: ὃ οὐκ ἔξεστιν
  choice: điều không được phép
  rationale: ἔξεστιν nói về điều được cho phép; cách dịch này giữ tính pháp lý–tôn giáo nhưng không xác định lời phản đối dựa trên luật thành văn hay truyền thống giải thích.
- source_word: ἐν σαββάτῳ
  choice: trong ngày Sa-bát
  rationale: Cách diễn đạt tự nhiên trong tiếng Việt cho thời điểm thuộc ngày Sa-bát, đồng thời giữ thuật ngữ tôn giáo đã quen dùng.
theological_decisions:
- issue: Bản chất lời phản đối của người Pha-ri-si
  choice: “không được phép”
  alternative: “không hợp luật” hoặc “trái luật”
  rationale: Câu này chỉ thuật lại lời cáo buộc, không phán quyết lời ấy đúng hay xác định nguồn quy phạm là Luật Môi-se hay truyền thống của người Pha-ri-si; “không được phép” giữ nguyên sự căng thẳng đó.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” để xưng hô với Đức Giê-su và “môn đồ”, “ngày Sa-bát” là các thuật ngữ Kinh Thánh quen thuộc. Dấu chú thích được đặt ngay sau cụm từ mà chú thích giải thích.
