  verdict: approve
  source_fidelity: 'Bản dịch truyền đạt đầy đủ mạch câu Hy Lạp: sắc thái đối lập của δὲ, mệnh đề thời gian của ἰδόντες, lời hướng đến Chúa Giê-su, lời thu hút chú ý của Ἰδού, và lời buộc tội về điều không được phép làm trong ngày Sa-bát. “Thấy vậy” diễn đạt hợp lý đối tượng hành động được ngầm hiểu từ văn cảnh, không thêm chi tiết diễn giải.'
  naturalness: Câu tiếng Việt hiện đại, rõ ràng và có nhịp văn phù hợp với lời thuật chuyện Kinh Thánh. “Kìa,”, “các môn đồ của Ngài,” và “trong ngày Sa-bát” đều tự nhiên trong văn phong trang trọng. Sự lặp lại “làm ... làm” hơi sát nguyên ngữ nhưng vẫn trôi chảy và giữ được điểm nhấn của câu.
  terminology: “Pha-ri-si,” “môn đồ,” “Ngài,” và “Sa-bát” nhất quán với cách dùng Kinh Thánh tiếng Việt. “Không được phép” phản ánh đúng ἔξεστιν theo nghĩa pháp lý/được cho phép, mà không quy định trước nguồn luật hay phán xét tính đúng sai của lời cáo buộc. Chú thích “không hợp luật” là một lựa chọn thay thế chấp nhận được và được neo đúng tại cụm từ liên quan.
