  terminology: “Chống lại tôi,” “quy tụ,” và “làm tan tác” phù hợp, hiện đại, và không thêm tân ngữ hay diễn giải hình ảnh. Không cần chú thích; tiếng Việt không có một thay thế hình thức tương đương cần ghi chú.
