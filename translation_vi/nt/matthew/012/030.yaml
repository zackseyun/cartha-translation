  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὁ μὴ ὢν μετ’ ἐμοῦ κατ’ ἐμοῦ ἐστιν, καὶ ὁ μὴ συνάγων μετ’ ἐμοῦ σκορπίζει.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/030.yaml
  text: The one who is not with me is against me[a], and the one who does not gather with me scatters.
translation:
  language: vi
  text: Ai không cùng tôi là chống lại tôi; và ai không cùng tôi quy tụ thì làm tan tác.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ μὴ ὢν
  choice: ai không ở
  rationale: Cấu trúc mạo từ với phân từ được dùng như danh từ và chỉ một người nói chung. “Ai không ở” diễn đạt tự nhiên tính khái quát ấy trong tiếng Việt, không giới hạn giới tính.
- source_word: μετ’ ἐμοῦ
  choice: với tôi / cùng tôi
  rationale: μετά với sở hữu cách diễn tả sự đồng hành hoặc liên kết. “Ở với tôi” tự nhiên trong vế đầu; “cùng tôi quy tụ” làm rõ rằng hành động được thực hiện trong sự cộng tác với Chúa Giê-su mà không thêm ý “đứng về phe” vốn mang tính diễn giải hơn.
- source_word: κατ’ ἐμοῦ
  choice: chống lại tôi
  rationale: κατά với sở hữu cách tại đây chỉ sự đối nghịch. “Chống lại tôi” trực tiếp, rõ ràng và giữ nguyên thế đối lập tuyệt đối của câu.
- source_word: συνάγων
  choice: quy tụ
  rationale: “Quy tụ” diễn tả việc tập hợp lại thành một mối, đồng thời không xác định quá mức đối tượng hoặc hình ảnh ẩn dụ mà nguyên văn không nói rõ.
- source_word: σκορπίζει
  choice: làm tan tác
  rationale: Động từ chỉ hành động làm phân tán, đối lập với “quy tụ”. “Làm tan tác” giữ sắc thái chủ động của động từ chuyển tác và tạo cặp đối xứng tự nhiên.
- source_word: καὶ
  choice: và
  rationale: Liên từ mang tính bổ sung, nối hai mệnh đề song song; “và” giữ đúng quan hệ phối hợp của nguyên văn.
theological_decisions:
- issue: Tính tuyệt đối trong sự đối lập mà Chúa Giê-su nêu ra
  choice: 'Giữ nguyên lời khẳng định dứt khoát: không ở với Chúa Giê-su tức là chống lại Ngài; không cùng Ngài quy tụ tức là làm tan tác.'
  alternative: Diễn ý mềm hơn theo hướng trung lập hoặc chỉ nói đến việc không hỗ trợ.
  rationale: Hai vế Hy Lạp tạo nên những đối cực rõ rệt và không có ngôn từ giảm nhẹ. Bản dịch giữ nguyên sự căng thẳng thần học ấy nhưng không suy diễn thêm về phạm vi áp dụng.
- issue: Đối tượng của hành động quy tụ và làm tan tác
  choice: Không bổ sung tân ngữ.
  alternative: Thêm “người ta”, “đàn chiên” hoặc “mùa gặt”.
  rationale: Nguyên văn không nêu đối tượng; để động từ đứng tuyệt đối bảo tồn sự hàm súc và khả năng gợi nhiều hình ảnh của lời nói.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “ai” để diễn đạt chủ thể khái quát; tránh “kẻ” vì có thể tạo sắc thái miệt thị không có trong nguyên văn. Dấu chấm phẩy làm nổi bật hai mệnh đề song song.
