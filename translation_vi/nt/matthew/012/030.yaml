  source_fidelity: Bản nháp giữ đúng cấu trúc song hành, tính khái quát của hai phân từ có mạo từ, quan hệ “với tôi”/“chống lại tôi”, và cặp đối lập “quy tụ”/“làm tan tác”. Tuy nhiên, “Ai không ở với tôi” trong tiếng Việt thường gợi nghĩa hiện diện hoặc cư trú cùng địa điểm hơn là liên kết/đứng cùng phía, nên chưa chuyển tải tự nhiên và chính xác nhất sắc thái μετ’ ἐμοῦ trong lời tuyên bố này.
