  text: Ὅταν δὲ τὸ ἀκάθαρτον πνεῦμα ἐξέλθῃ ἀπὸ τοῦ ἀνθρώπου, διέρχεται δι’ ἀνύδρων τόπων ζητοῦν ἀνάπαυσιν, καὶ οὐχ εὑρίσκει.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/043.yaml
  text: When the unclean spirit goes out from the man[a], it passes through waterless places seeking rest, and does not find it.
translation:
  language: vi
  text: Khi thần ô uế ra khỏi một người, nó đi qua những nơi không có nước[a], tìm sự nghỉ ngơi nhưng không tìm được.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “những nơi khô hạn.” Tiếng Hy Lạp nói sát nghĩa là “những nơi không có nước.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅταν δὲ
  choice: Khi
  rationale: Ὅταν mở đầu một tình huống thời gian có tính khái quát. δέ chỉ chuyển nhẹ sang ý tiếp theo và không cần được thể hiện bằng một từ nối riêng trong tiếng Việt.
- source_word: τὸ ἀκάθαρτον πνεῦμα
  choice: thần ô uế
  rationale: Giữ nguyên danh từ πνεῦμα là “thần” thay vì diễn giải thành “quỷ”; “ô uế” bảo tồn sắc thái thanh sạch–ô uế của ἀκάθαρτος.
- source_word: ἐξέλθῃ ἀπὸ τοῦ ἀνθρώπου
  choice: ra khỏi một người
  rationale: Thể hiện chuyển động ra khỏi người bị thần chiếm. Trong lời minh họa mang tính khái quát này, “một người” tự nhiên hơn “người ấy” trong tiếng Việt và không giới hạn ἄνθρωπος theo giới tính.
- source_word: διέρχεται δι’ ἀνύδρων τόπων
  choice: nó đi qua những nơi không có nước
  rationale: “Đi qua” diễn đạt trực tiếp διέρχεται; “không có nước” giữ hình ảnh cụ thể và nghĩa sát của ἀνύδρων.
- source_word: ζητοῦν ἀνάπαυσιν
  choice: tìm chỗ nghỉ ngơi
  rationale: Cách nói tự nhiên trong tiếng Việt cho hành động tìm sự nghỉ ngơi; “chỗ” làm rõ hàm ý trong ngữ cảnh di chuyển mà không thay đổi ý chính.
- source_word: καὶ οὐχ εὑρίσκει
  choice: mà không tìm thấy
  rationale: “Mà” diễn đạt tự nhiên quan hệ tiếp nối có kết quả tương phản; tân ngữ được lược theo đúng cách dùng tiếng Việt và vẫn rõ là không tìm thấy chỗ nghỉ ngơi.
theological_decisions:
- issue: Cách dịch πνεῦμα trong bối cảnh trừ quỷ
  choice: thần
  alternative: quỷ
  rationale: Dù đối tượng là một hữu thể ác, bản Hy Lạp dùng πνεῦμα, không dùng δαιμόνιον; vì vậy “thần ô uế” giữ cách gọi và sự phân biệt từ vựng của nguyên bản.
- issue: Sắc thái của ἀκάθαρτος
  choice: ô uế
  alternative: xấu xa
  rationale: “Ô uế” bảo tồn nền tảng ý niệm về thanh sạch và ô uế, trong khi “xấu xa” chỉ nhấn mạnh đạo đức và làm mất sắc thái của nguyên bản.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “thần ô uế” theo cách gọi quen thuộc trong ngôn ngữ Kinh Thánh nhưng tránh diễn giải thành “quỷ.” Dấu chú thích được đặt ngay sau cụm từ mà chú thích giải thích.
