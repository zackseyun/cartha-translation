  terminology: “Thần ô uế” bám sát πνεῦμα và giữ sắc thái thanh sạch–ô uế của ἀκάθαρτον. Dù “quỷ ô uế” quen thuộc hơn trong một số truyền thống, không cần thay thế vì sẽ diễn giải πνεῦμα thành δαιμόνιον.
