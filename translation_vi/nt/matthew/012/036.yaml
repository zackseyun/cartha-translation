  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: λέγω δὲ ὑμῖν ὅτι πᾶν ῥῆμα ἀργὸν ὃ ⸀λαλήσουσιν οἱ ἄνθρωποι, ἀποδώσουσιν περὶ αὐτοῦ λόγον ἐν ἡμέρᾳ κρίσεως·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/036.yaml
  text: But I tell you that for every careless word that people speak[b][a], they will give an account on the day of judgment.
translation:
  language: vi
  text: 'Nhưng tôi nói với các ông: Vào ngày phán xét, mọi người sẽ phải khai trình về mọi lời thiếu suy xét[a] họ đã nói ra.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “lời vô bổ.” Từ Hy Lạp có thể mang nghĩa “nhàn rỗi,” “không sinh ích” hoặc “thiếu suy xét.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω δὲ ὑμῖν
  choice: Nhưng tôi nói với các ông
  rationale: δέ tạo nét chuyển ý mang tính đối lập nhẹ với lời cảnh báo trước đó; “nhưng” phù hợp ngữ cảnh. “Các ông” diễn đạt đại từ số nhiều chỉ những người đang được Đức Giê-su trực tiếp nói với, tự nhiên hơn lối “các ngươi” trong tiếng Việt hiện đại.
- source_word: πᾶν ῥῆμα
  choice: mọi lời
  rationale: πᾶν với danh từ số ít mang nghĩa phân phối, chỉ từng lời nói; “mọi lời” vừa tự nhiên vừa bao quát trong tiếng Việt.
- source_word: ἀργὸν
  choice: thiếu suy xét
  rationale: ἀργός có nghĩa gốc là nhàn rỗi, không hoạt động hoặc không sinh ích. Trong ngữ cảnh chịu trách nhiệm trước sự phán xét, “thiếu suy xét” truyền đạt tính cẩu thả và đáng quy trách của lời nói mà không giới hạn nghĩa vào lời độc ác hay giả dối.
- source_word: ὃ λαλήσουσιν οἱ ἄνθρωποι
  choice: mình đã nói ra
  rationale: Chủ thể chung οἱ ἄνθρωποι được diễn đạt bằng “người ta” ở mệnh đề chính; “mình” quy chiếu tự nhiên về cùng chủ thể. Dạng tương lai Hy Lạp nằm trong một phát biểu khái quát hướng đến ngày phán xét; tiếng Việt tự nhiên dùng “đã nói ra” khi nhìn lại những lời ấy từ thời điểm phán xét.
- source_word: ἀποδώσουσιν περὶ αὐτοῦ λόγον
  choice: sẽ phải khai trình về
  rationale: Cụm ἀποδίδωμι λόγον là thành ngữ chỉ việc đưa ra lời giải trình hoặc chịu trách nhiệm. “Sẽ phải khai trình về” giữ được sắc thái tư pháp và quan hệ περὶ αὐτοῦ với từng lời đã nói.
- source_word: ἐν ἡμέρᾳ κρίσεως
  choice: vào ngày phán xét
  rationale: “Vào ngày” là cách diễn đạt thời điểm tự nhiên trong tiếng Việt; κρίσις ở đây chỉ sự xét xử mang tính tư pháp, được chuyển là “phán xét” theo cách dùng rõ ràng và quen thuộc.
theological_decisions:
- issue: Sức nặng đạo đức của ἀργόν
  choice: thiếu suy xét
  alternative: vô bổ; nhàn rỗi; cẩu thả
  rationale: Ngữ cảnh nhấn mạnh việc con người phải chịu trách nhiệm trong ngày phán xét. “Thiếu suy xét” giữ sắc thái lời nói không được cân nhắc và có thể bị quy trách, nhưng không diễn giải quá mức thành một loại tội nói năng cụ thể.
- issue: Phạm vi chung của οἱ ἄνθρωποι
  choice: người ta
  alternative: loài người; mọi người; những người đàn ông
  rationale: Danh từ Hy Lạp chỉ con người nói chung chứ không riêng nam giới. “Người ta” thể hiện tính khái quát, tự nhiên và không thêm sắc thái phổ quát tuyệt đối vượt quá cấu trúc câu.
- issue: Tính cá nhân của việc khai trình
  choice: khai trình về mọi lời ... mình đã nói ra
  alternative: khai trình về lời ấy
  rationale: Cách diễn đạt giữ mối liên hệ giữa từng lời nói và trách nhiệm phải khai trình, đồng thời tránh giải quyết thêm câu hỏi thần học về hình thức hoặc mức độ của sự phán xét.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Trật tự câu được điều chỉnh để tiếng Việt tự nhiên, nhưng vẫn giữ lời tuyên bố trực tiếp, trách nhiệm đối với từng lời nói và bối cảnh ngày phán xét.
