  - severity: low
    issue: Cụm “rồi cũng sẽ như vậy” thêm sắc thái không cần thiết.
    rationale: οὕτως ἔσται καὶ chỉ sự tương ứng trong lời áp dụng; “cũng sẽ như vậy” truyền đạt trực tiếp hơn.
  - severity: low
