id: MAT.12.45
reference: Matthew 12:45
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: τότε πορεύεται καὶ παραλαμβάνει μεθ’ ἑαυτοῦ ἑπτὰ ἕτερα πνεύματα πονηρότερα ἑαυτοῦ, καὶ εἰσελθόντα κατοικεῖ ἐκεῖ· καὶ γίνεται τὰ ἔσχατα τοῦ ἀνθρώπου ἐκείνου χείρονα τῶν πρώτων. οὕτως ἔσται καὶ τῇ γενεᾷ ταύτῃ τῇ πονηρᾷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/045.yaml
  text: Then it goes and brings with itself seven other spirits more evil than itself[a], and they enter and live there; and the last state of that man becomes worse than the first[b]. So it will be also with this evil generation.
translation:
  language: vi
  text: Bấy giờ, nó đi và đem theo bảy tà linh khác dữ hơn nó[a]. Chúng vào và cư ngụ ở đó; tình trạng cuối cùng của người ấy trở nên tệ hơn lúc đầu[b]. Thế hệ gian ác này cũng sẽ như vậy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “bảy linh khác độc ác hơn nó.”'
    reason: lexical_alternative
  - marker: b
    text: 'Sát nghĩa: “những điều sau cùng của người ấy trở nên tệ hơn những điều ban đầu,” một lối nói chỉ tình trạng cuối cùng tệ hơn tình trạng trước kia.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Bấy giờ
  rationale: Đánh dấu bước tiếp theo trong trình tự câu chuyện, tự nhiên và trang trọng trong tiếng Việt.
- source_word: πορεύεται καὶ παραλαμβάνει μεθ’ ἑαυτοῦ
  choice: nó đi và đem theo
  rationale: Diễn đạt rõ hành động ra đi rồi đưa các tà linh khác cùng đi; tránh lặp đại từ phản thân vốn không tự nhiên trong tiếng Việt.
- source_word: ἑπτὰ ἕτερα πνεύματα
  choice: bảy tà linh khác
  rationale: ἕτερα chủ yếu chỉ những linh khác ngoài linh thứ nhất. Thêm 'tà' theo ngữ cảnh linh ô uế và tính từ πονηρότερα, giúp người đọc hiểu đúng loại 'linh' đang được nói đến mà không thay bằng thuật ngữ cụ thể hơn như 'quỷ'.
- source_word: πονηρότερα ἑαυτοῦ
  choice: dữ hơn nó
  rationale: Giữ dạng so sánh về mức độ ác độc; 'dữ' tự nhiên khi mô tả tà linh trong tiếng Việt hiện đại.
- source_word: εἰσελθόντα κατοικεῖ ἐκεῖ
  choice: Chúng vào và ở tại đó
  rationale: Chuyển phân từ sang mệnh đề hữu hạn để câu Việt tự nhiên và giữ trình tự hành động. 'Ở tại đó' truyền đạt việc cư ngụ mà không làm câu quá cổ kính.
- source_word: γίνεται τὰ ἔσχατα τοῦ ἀνθρώπου ἐκείνου χείρονα τῶν πρώτων
  choice: tình trạng cuối cùng của người ấy trở nên tệ hơn lúc đầu
  rationale: Diễn đạt thành ngữ Hy Lạp theo nghĩa trạng thái sau cùng đối lập với ban đầu, đồng thời ghi chú lối nói sát chữ.
- source_word: οὕτως ἔσται καὶ τῇ γενεᾷ ταύτῃ τῇ πονηρᾷ
  choice: Thế hệ gian ác này rồi cũng sẽ như vậy
  rationale: Giữ nguyên sự áp dụng trực tiếp phép so sánh vào thế hệ đương thời; 'gian ác' phù hợp với sắc thái đạo đức của πονηρᾷ.
theological_decisions:
- issue: Cách dịch πνεύματα trong ngữ cảnh tà linh
  choice: tà linh
  alternative: các linh; quỷ
  rationale: Nguồn Hy Lạp dùng 'các linh', còn ngữ cảnh xác định chúng là những linh ô uế và dữ. 'Tà linh' giữ danh từ 'linh' và làm rõ ý xấu, nhưng không chuyển hẳn thành 'quỷ', một từ cụ thể hơn.
- issue: Cách dịch ἀνθρώπου
  choice: người ấy
  alternative: người đàn ông ấy
  rationale: ἄνθρωπος ở đây chỉ một con người trong ví dụ, không nhấn mạnh giới tính sinh học. Tiếng Việt 'người ấy' là cách tương ứng tự nhiên và chính xác, không xóa bỏ một đối lập giới tính nào vì văn bản không đặt ra đối lập ấy.
- issue: Dạng số của κατοικεῖ sau chủ thể số nhiều theo nghĩa
  choice: Chúng ... ở tại đó
  alternative: nó ở tại đó
  rationale: Bản văn in κατοικεῖ ở số ít dù phân từ εἰσελθόντα quy chiếu các linh ở số nhiều; ngữ cảnh cho thấy cả nhóm vào cư ngụ. Bản dịch theo nghĩa dùng số nhiều, không xây dựng kết luận thần học từ sự bất tương hợp hình thái.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng 'Bấy giờ' để nối mạch kể chuyện, 'tà linh' để giữ ngôn ngữ thuộc linh trong đúng ngữ cảnh, và 'thế hệ gian ác này' để bảo toàn sức nặng của lời áp dụng cuối câu. Mọi ký hiệu chú thích [a], [b] đều xuất hiện trong chính văn.
