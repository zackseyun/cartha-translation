  source_fidelity: 'Bản dịch truyền đạt đúng các thành phần chính của câu: một người nói với Đức Giê-su, lời gọi chú ý, mẹ và các anh em ở bên ngoài, và việc họ muốn gặp để nói với Ngài. Tuy nhiên, “muốn nói chuyện với” làm yếu sắc thái ζητοῦντες (“đang tìm cách/tìm để”) và “nói chuyện với” dễ gợi cuộc đối thoại hai chiều hơn λαλῆσαι σοι (“nói với Ngài”).'
