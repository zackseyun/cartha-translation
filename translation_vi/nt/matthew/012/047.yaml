  text: ⸂εἶπεν δέ τις αὐτῷ· Ἰδοὺ ἡ μήτηρ σου καὶ οἱ ἀδελφοί σου ἔξω ἑστήκασιν, ζητοῦντές σοι λαλῆσαι.⸃
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/047.yaml
  text: Then someone said to him[a], “Look, your mother and your brothers are standing outside, seeking to speak to you.”
translation:
  language: vi
  text: 'Có người nói với Ngài[a]: “Kìa, mẹ và các anh em của Ngài đang đứng bên ngoài, đang tìm cách nói với Ngài.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Một số thủ bản không có câu này.
    reason: textual_variant
lexical_decisions:
- source_word: εἶπεν δέ τις αὐτῷ
  choice: Có người nói với Ngài
  rationale: δέ chỉ nối tiếp nhẹ trong mạch kể nên không cần dịch thành một từ riêng; τις là đại từ bất định, được diễn đạt tự nhiên là “có người”.
- source_word: Ἰδοὺ
  choice: Kìa
  rationale: “Kìa” là từ gọi sự chú ý tự nhiên trong tiếng Việt hiện đại và giữ được sắc thái chỉ dẫn của ἰδού.
- source_word: ἡ μήτηρ σου
  choice: mẹ ... của Ngài
  rationale: Diễn đạt trực tiếp quan hệ sở hữu; lối nói này tự nhiên trong câu dẫn trực tiếp bằng tiếng Việt.
- source_word: οἱ ἀδελφοί σου
  choice: các anh em của Ngài
  rationale: ἀδελφοί ở đây chỉ những người nam trong quan hệ gia đình. “Các anh em” giữ được độ rộng của từ Hy Lạp, không tự ý xác định họ là anh hay em.
- source_word: ἔξω ἑστήκασιν
  choice: đang đứng bên ngoài
  rationale: Thể hoàn thành của ἵστημι diễn tả trạng thái hiện tại sau khi đã đứng vào vị trí; “đang đứng” truyền đạt tự nhiên trạng thái ấy, còn “bên ngoài” thể hiện rõ ἔξω.
- source_word: ζητοῦντές σοι λαλῆσαι
  choice: muốn nói chuyện với Ngài
  rationale: Trong ngữ cảnh này, ζητέω đi với động từ nguyên mẫu diễn tả ý muốn hoặc sự tìm cách thực hiện hành động. “Muốn nói chuyện với” tự nhiên hơn “tìm cách nói” trong tiếng Việt, đồng thời không thêm nội dung về mục đích cuộc nói chuyện.
theological_decisions:
- issue: Tình trạng văn bản của Ma-thi-ơ 12:47
  choice: Giữ câu này trong chính văn theo nguồn SBLGNT được cung cấp và đánh dấu chú thích.
  alternative: Lược bỏ câu vì một số thủ bản không có.
  rationale: Câu được đặt trong dấu ngoặc văn bản ở nguồn phê bình và vắng mặt trong một số chứng cứ thủ bản. Việc giữ câu trong chính văn nhưng ghi rõ dị bản bảo toàn nguồn được giao và tránh che giấu vấn đề văn bản.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Ngài” để xưng hô với Chúa Giê-su trong lời dẫn trực tiếp; dùng “các anh em” nhằm không áp đặt thứ tự tuổi mà nguyên văn không nêu.
