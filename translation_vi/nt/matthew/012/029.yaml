id: MAT.12.29
reference: Matthew 12:29
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἢ πῶς δύναταί τις εἰσελθεῖν εἰς τὴν οἰκίαν τοῦ ἰσχυροῦ καὶ τὰ σκεύη αὐτοῦ ⸀ἁρπάσαι, ἐὰν μὴ πρῶτον δήσῃ τὸν ἰσχυρόν; καὶ τότε τὴν οἰκίαν αὐτοῦ ⸀διαρπάσει.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/029.yaml
  text: Or how can someone enter the strong man's house and seize his goods[b][a], unless he first binds the strong man? And then he will plunder his house.
translation:
  language: vi
  text: Hay làm sao một người có thể vào nhà của người mạnh và cướp lấy đồ đạc[a] của người ấy, nếu trước hết không trói[b] người mạnh lại? Rồi người ấy sẽ cướp phá nhà của người mạnh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “tài sản” hoặc “vật dụng”; từ Hy Lạp có thể chỉ các đồ dùng cụ thể hoặc nói rộng hơn về những thứ thuộc sở hữu của một người.
    reason: lexical_alternative
  - marker: b
    text: Hay “trói chặt”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἢ πῶς δύναταί τις
  choice: Hay làm sao một người có thể
  rationale: Giữ liên từ nêu phương án giải thích nối với lập luận trước, đồng thời bảo toàn hình thức câu hỏi tu từ và ý nghĩa chủ thể bất định.
- source_word: τοῦ ἰσχυροῦ / τὸν ἰσχυρόν
  choice: người mạnh sức
  rationale: Tính từ Hy Lạp được dùng như danh từ để chỉ một người nam có sức mạnh; cách diễn đạt này giữ nguyên hình ảnh cụ thể mà không diễn giải thành một nhân vật thần học.
- source_word: τὰ σκεύη αὐτοῦ
  choice: đồ đạc của người ấy
  rationale: Trong cảnh một ngôi nhà bị cướp, σκεύη chỉ các vật dụng hoặc rộng hơn là những thứ thuộc về chủ nhà; “đồ đạc” tự nhiên và phù hợp ngữ cảnh.
- source_word: ἁρπάσαι
  choice: cướp lấy
  rationale: Diễn đạt hành động chiếm đoạt bằng sức mạnh, đồng thời vẫn phân biệt với động từ mạnh hơn διαρπάσει ở cuối câu.
- source_word: ἐὰν μὴ πρῶτον δήσῃ
  choice: nếu trước hết không trói ... lại
  rationale: Giữ rõ điều kiện phủ định và thứ tự hành động; “trói ... lại” là cách nói tự nhiên cho δήσῃ.
- source_word: καὶ τότε
  choice: Bấy giờ ... mới
  rationale: Cấu trúc “bấy giờ ... mới” thể hiện rõ trình tự và hàm ý chỉ sau khi đã trói người mạnh sức thì việc cướp sạch mới xảy ra.
- source_word: διαρπάσει
  choice: cướp sạch
  rationale: Tiền tố trong động từ ghép gợi hành động cướp bóc toàn diện hơn ἁρπάσαι; “cướp sạch” chuyển tải sắc thái tăng cường ấy một cách tự nhiên.
- source_word: τὴν οἰκίαν αὐτοῦ
  choice: nhà người ấy
  rationale: Giữ hình ảnh cụ thể về ngôi nhà bị cướp, không chuyển sang nghĩa diễn giải như lãnh địa hay gia hộ.
theological_decisions:
- issue: Phạm vi ẩn dụ của người mạnh sức, nhà và đồ đạc
  choice: Giữ nguyên cảnh cụ thể về việc đột nhập và cướp nhà
  alternative: Diễn giải trực tiếp thành việc chế ngự quyền lực tà linh và chiếm lấy những gì thuộc quyền nó
  rationale: Ngữ cảnh rộng hơn liên quan đến quyền năng của Chúa Giê-su đối với ma quỷ, nhưng câu này trình bày điều đó bằng một ẩn dụ. Bản dịch không đưa lời giải nghĩa thần học vào chính câu văn.
- issue: Giống nam trong hình ảnh ὁ ἰσχυρός
  choice: người mạnh sức
  alternative: kẻ mạnh hoặc thế lực mạnh
  rationale: Giữ một nhân vật con người cụ thể trong phép so sánh mà không biến cách gọi này thành một thuật ngữ giáo lý hay làm rõ danh tính vốn chỉ được ngữ cảnh gợi ra.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “người mạnh sức” để giữ hình ảnh nhân vật nam cụ thể; dùng “cướp lấy” rồi “cướp sạch” để phản ánh sự khác biệt giữa ἁρπάζω và dạng tăng cường διαρπάζω.
