revisions:
- from: Hay làm sao một người có thể vào nhà của người mạnh sức và cướp lấy đồ đạc[a] của người ấy, nếu trước hết không trói[b] người ấy lại? Bấy giờ người đó mới cướp sạch nhà người ấy.
  to: Hay làm sao một người có thể vào nhà của người mạnh và cướp lấy đồ đạc[a] của người ấy, nếu trước hết không trói[b] người mạnh lại? Rồi người ấy sẽ cướp phá nhà của người mạnh.
  rationale: Sửa «người mạnh sức» thành «người mạnh» để có tiếng Việt hiện đại, tự nhiên và sát cách danh từ hóa của ἰσχυρός. Thống nhất quy chiếu bằng cách lặp lại «người mạnh», và đổi «cướp sạch nhà» thành «cướp phá nhà» để phản ánh διαρπάζω mà không làm mạnh quá mức ý hoàn tất. Các chú thích neo đúng tại «đồ đạc» và «trói».
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T02:47:01Z'
review_pass:
  verdict: revise
  source_fidelity: Bản nháp giữ đúng cấu trúc câu hỏi tu từ, điều kiện «nếu không trước hết», và trình tự trói rồi cướp. Tuy nhiên, «người mạnh sức» không tự nhiên và không diễn đạt rõ hình ảnh nam tính cụ thể của ὁ/τὸν ἰσχυρόν; «người mạnh» là tương đương trực tiếp và chuẩn hơn. «Cướp sạch nhà» có thể gợi lấy hết đồ trong nhà hơn là διαρπάσει với tân ngữ trực tiếp «nhà»; «cướp phá nhà» phản ánh tốt hơn hành động cướp bóc toàn bộ ngôi nhà/gia sản mà vẫn giữ ẩn dụ.
  naturalness: «Hay làm sao» phù hợp văn cảnh nối tiếp. «Người mạnh sức» là một kết hợp từ gượng trong tiếng Việt hiện đại; «người mạnh» tự nhiên, rõ nghĩa, và duy trì phép ẩn dụ. «Bấy giờ» hơi cổ và «người đó» dễ tạo một quy chiếu phụ không cần thiết; «rồi người ấy» mạch lạc hơn trong văn phong hiện đại.
  terminology: Dùng «người mạnh» cho ἰσχυρός, «đồ đạc» cho σκεύη, «trói» cho δήσῃ, «cướp lấy» cho ἁρπάσαι và «cướp phá» cho διαρπάσει. Không diễn giải người mạnh, nhà, hay đồ đạc theo một hệ thống thần học.
  issues:
  - severity: medium
    issue: «người mạnh sức» là cách gọi không tự nhiên và không cần thiết.
    rationale: ἰσχυρός được danh từ hóa, nghĩa là «người mạnh»/«người đàn ông mạnh». «Mạnh sức» không phải cách kết hợp thông dụng trong tiếng Việt hiện đại; «người mạnh» bảo toàn hình ảnh mà tự nhiên hơn.
  - severity: low
    issue: «cướp sạch nhà» có sắc thái hẹp và hơi thiếu tự nhiên với tân ngữ «nhà».
    rationale: διαρπάσει tăng cường ý cướp bóc, tước đoạt. «Cướp phá nhà» diễn đạt hành vi ấy tự nhiên hơn mà không khẳng định rằng mọi vật đều đã bị lấy hết.
  revised_text: Hay làm sao một người có thể vào nhà của người mạnh và cướp lấy đồ đạc[a] của người ấy, nếu trước hết không trói[b] người mạnh lại? Rồi người ấy sẽ cướp phá nhà của người mạnh.
