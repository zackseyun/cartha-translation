id: MAT.12.50
reference: Matthew 12:50
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὅστις γὰρ ἂν ποιήσῃ τὸ θέλημα τοῦ πατρός μου τοῦ ἐν οὐρανοῖς, αὐτός μου ἀδελφὸς καὶ ἀδελφὴ καὶ μήτηρ ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/050.yaml
  text: For whoever does the will of my Father in heaven[a], he is my brother and sister and mother.
translation:
  language: vi
  text: Vì bất cứ ai làm theo ý muốn của Cha tôi ở trên trời, thì chính người ấy[a] là anh em, chị em và mẹ của tôi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tiếng Hy Lạp dùng hình thức giống đực số ít theo ngữ pháp với nghĩa khái quát, chỉ bất cứ người nào thực hiện ý muốn của Cha.
    reason: Giải thích hình thức ngữ pháp của nguyên văn và phạm vi bao gồm mọi người.
lexical_decisions:
- source_word: ὅστις ... ἂν
  choice: bất cứ ai
  rationale: Cấu trúc đại từ quan hệ bất định với ἄν diễn tả một điều kiện khái quát, áp dụng cho bất cứ người nào.
- source_word: γὰρ
  choice: Vì
  rationale: Giữ mối liên hệ giải thích với lời tuyên bố ngay trước đó.
- source_word: ποιήσῃ τὸ θέλημα
  choice: làm theo ý muốn
  rationale: Đây là cách nói tự nhiên trong tiếng Việt, diễn đạt việc thực hiện điều người khác muốn mà không thu hẹp nghĩa thành chỉ ‘vâng lời’.
- source_word: τοῦ πατρός μου τοῦ ἐν οὐρανοῖς
  choice: của Cha tôi ở trên trời
  rationale: Giữ sát cấu trúc và ý nghĩa của cụm Hy Lạp, đồng thời dùng cách diễn đạt rõ ràng, tự nhiên trong tiếng Việt hiện đại.
- source_word: αὐτός
  choice: chính người ấy
  rationale: ‘Chính’ thể hiện sắc thái nhấn mạnh của αὐτός; ‘người ấy’ quy chiếu tự nhiên về ‘bất cứ ai’ mà không áp đặt giới tính trong tiếng Việt.
- source_word: ἀδελφὸς καὶ ἀδελφὴ καὶ μήτηρ
  choice: anh em, chị em và mẹ
  rationale: Giữ nguyên ba vai trò gia đình được liệt kê riêng trong bản Hy Lạp; cách gọi ‘anh em, chị em’ tránh phải xác định người ấy lớn hay nhỏ tuổi hơn Chúa Giê-su, điều nguyên văn không nêu.
- source_word: ἐστίν
  choice: là
  rationale: Giữ động từ liên kết ở thì hiện tại bằng cách diễn đạt trực tiếp trong tiếng Việt.
theological_decisions:
- issue: Hình thức giống đực số ít mang nghĩa khái quát
  choice: bất cứ ai ... chính người ấy
  alternative: bất cứ người nam nào ... chính người đó
  rationale: ὅστις và αὐτός có hình thức giống đực số ít theo ngữ pháp Hy Lạp nhưng được dùng khái quát. Tiếng Việt không đánh dấu giống ngữ pháp ở ‘ai’ và ‘người ấy’, nên cách dịch này bảo toàn phạm vi bao gồm mọi người mà không thêm ý chỉ nam giới; chính câu này cũng nêu cả ‘chị em’ và ‘mẹ’.
- issue: Bản chất của mối quan hệ gia đình
  choice: là anh em, chị em và mẹ của tôi
  alternative: giống như anh em, chị em và mẹ của tôi
  rationale: Nguyên văn dùng trực tiếp động từ ‘là’, không có từ so sánh. Bản dịch giữ nguyên sức mạnh của lời xác nhận thay vì làm nhẹ thành sự tương tự.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. ‘Làm theo ý muốn’ là thành ngữ tự nhiên; ‘chính người ấy’ giữ sắc thái nhấn mạnh. Dấu phẩy và ‘thì’ giúp câu điều kiện khái quát rõ ràng trong tiếng Việt.
