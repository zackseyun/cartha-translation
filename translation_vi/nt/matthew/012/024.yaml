id: MAT.12.24
reference: Matthew 12:24
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οἱ δὲ Φαρισαῖοι ἀκούσαντες εἶπον· Οὗτος οὐκ ἐκβάλλει τὰ δαιμόνια εἰ μὴ ἐν τῷ Βεελζεβοὺλ ἄρχοντι τῶν δαιμονίων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/024.yaml
  text: But when the Pharisees heard it[a], they said, “This man does not cast out demons except by Beelzebul, the ruler of the demons.”
translation:
  language: vi
  text: 'Nhưng khi những người Pha-ri-si nghe vậy, họ nói: “Người này không đuổi các quỷ nếu không nhờ Bê-ên-xê-bun[a], kẻ cai trị các quỷ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Bê-ên-xê-bun: theo cách gọi truyền thống là “Bê-ên-xê-búp.”'
    reason: Ghi nhận dạng tên quen thuộc theo truyền thống trong khi bản chính phiên âm Βεελζεβούλ của nguồn Hy Lạp.
lexical_decisions:
- source_word: δὲ
  choice: Nhưng
  rationale: Diễn đạt sự tương phản giữa phản ứng thù nghịch của người Pha-ri-si và phản ứng trước đó của đám đông.
- source_word: ἀκούσαντες
  choice: khi ... nghe vậy
  rationale: Dịch phân từ bất định quá khứ theo nghĩa thời gian; “vậy” chỉ điều họ vừa nghe biết từ sự việc trong ngữ cảnh.
- source_word: οἱ Φαρισαῖοι
  choice: những người Pha-ri-si
  rationale: Cách gọi tự nhiên, rõ nghĩa trong tiếng Việt hiện đại, đồng thời phiên âm tên nhóm người.
- source_word: Οὗτος
  choice: Người này
  rationale: Giữ sắc thái xa cách và có phần khinh miệt của đại từ chỉ định trong lời buộc tội.
- source_word: ἐκβάλλει τὰ δαιμόνια
  choice: đuổi các quỷ
  rationale: “Đuổi” là cách diễn đạt tự nhiên trong tiếng Việt cho hành động trục xuất quỷ, còn “các quỷ” phản ánh danh từ số nhiều.
- source_word: εἰ μὴ
  choice: chẳng qua là
  rationale: Trong cấu trúc phủ định này, cụm từ giới hạn phương tiện duy nhất mà người Pha-ri-si cáo buộc; cách dịch tự nhiên và giữ đúng lực nghĩa “không... ngoại trừ”.
- source_word: ἐν τῷ Βεελζεβοὺλ
  choice: nhờ Bê-ên-xê-bun
  rationale: ἐν ở đây biểu thị phương tiện hoặc quyền lực tác động; “nhờ” truyền đạt lời cáo buộc mà không thêm cụm “quyền năng của” vốn không được nói thẳng trong nguyên văn.
- source_word: Βεελζεβοὺλ
  choice: Bê-ên-xê-bun
  rationale: Phiên âm dạng tên Βεελζεβούλ của bản SBLGNT sang tiếng Việt, thay vì dùng dạng truyền thống Bê-ên-xê-búp.
- source_word: ἄρχοντι τῶν δαιμονίων
  choice: kẻ cai trị các quỷ
  rationale: Giữ nghĩa quyền hành của ἄρχων; “kẻ” phù hợp với đối tượng xấu trong ngữ cảnh mà không nâng thành một tước hiệu thần học.
theological_decisions:
- issue: Sắc thái của đại từ Οὗτος trong lời chống đối
  choice: Người này
  alternative: Ông ấy / Người ấy
  rationale: “Người này” bảo tồn sắc thái xa cách, khinh miệt có thể có trong ngữ cảnh, nhưng không thêm lời xúc phạm ngoài nguyên văn.
- issue: Dạng tên Βεελζεβούλ
  choice: Bê-ên-xê-bun
  alternative: Bê-ên-xê-búp
  rationale: Bản văn Hy Lạp SBLGNT có Βεελζεβούλ, nên bản chính theo dạng này; dạng quen thuộc theo truyền thống được ghi ở chú thích.
- issue: Quan hệ được diễn đạt bởi ἐν
  choice: nhờ Bê-ên-xê-bun
  alternative: bởi quyền năng của Bê-ên-xê-bun
  rationale: “Nhờ” thể hiện phương tiện hoặc tác nhân trong lời cáo buộc nhưng không giải thích quá mức rằng đó nhất thiết là “quyền năng”; nhờ vậy vẫn giữ độ hàm súc của nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu nói giữ giọng cáo buộc gay gắt của người Pha-ri-si. Dùng “đuổi các quỷ” thay vì thuật ngữ chuyên môn, và “kẻ cai trị” để diễn đạt quyền hành theo cách tự nhiên.
