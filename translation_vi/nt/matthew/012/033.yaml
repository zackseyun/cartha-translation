id: MAT.12.33
reference: Matthew 12:33
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἢ ποιήσατε τὸ δένδρον καλὸν καὶ τὸν καρπὸν αὐτοῦ καλόν, ἢ ποιήσατε τὸ δένδρον σαπρὸν καὶ τὸν καρπὸν αὐτοῦ σαπρόν· ἐκ γὰρ τοῦ καρποῦ τὸ δένδρον γινώσκεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/033.yaml
  text: Either make the tree good and its fruit good[a], or make the tree rotten and its fruit rotten[b]; for the tree is known by its fruit.
translation:
  language: vi
  text: Hoặc hãy làm cho cây tốt[a] và trái của nó tốt, hoặc hãy làm cho cây xấu và trái của nó xấu[b]; vì nhờ trái mà cây được nhận biết.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Hãy làm cho” cũng có thể mang sắc thái tu từ là “hãy xem” hoặc “hãy chứng tỏ là”; tuy nhiên, nguyên văn Hy Lạp dùng hình thức mệnh lệnh.
    reason: alternative_reading
  - marker: b
    text: Từ Hy Lạp ở đây có thể chỉ điều hư hỏng, mục nát hoặc vô giá trị; cũng có thể dịch là “tồi” hay “hư.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιήσατε
  choice: hãy làm cho
  rationale: Giữ nguyên hình thức mệnh lệnh số nhiều của động từ Hy Lạp và phép đối xứng trong câu. Trong ngữ cảnh, mệnh lệnh này có thể mang sắc thái tu từ là “hãy xem/kể là,” nhưng bản dịch chính không giải quyết thay sự căng thẳng ấy.
- source_word: δένδρον
  choice: cây
  rationale: Từ tương đương thông dụng, trực tiếp và tự nhiên cho hình ảnh ẩn dụ.
- source_word: καλός
  choice: tốt
  rationale: Giữ được cả ý về phẩm chất và âm hưởng đạo đức; “khỏe mạnh” sẽ thu hẹp nghĩa quá mức.
- source_word: καρπός
  choice: trái
  rationale: “Trái” là cách nói tự nhiên trong tiếng Việt và giữ nguyên hình ảnh cây–trái của nguyên văn.
- source_word: σαπρός
  choice: xấu
  rationale: Một từ duy nhất cần áp dụng tự nhiên cho cả cây lẫn trái trong cấu trúc song song. “Xấu” làm được điều đó, còn “mục” hợp với cây hơn và “thối” hợp với trái hơn; chú thích bảo lưu sắc thái hư hỏng, mục nát hoặc vô giá trị của từ Hy Lạp.
- source_word: ἐκ γὰρ τοῦ καρποῦ
  choice: vì nhờ trái
  rationale: “Vì” thể hiện quan hệ giải thích của γάρ; “nhờ trái” chuyển ἐκ sang cách diễn đạt tiếng Việt tự nhiên trong câu bị động mà vẫn giữ ý căn cứ để nhận biết.
- source_word: γινώσκεται
  choice: được nhận biết
  rationale: Giữ thể bị động và giá trị hiện tại khái quát của động từ, đồng thời diễn đạt rõ ràng trong tiếng Việt.
- source_word: αὐτοῦ
  choice: của nó
  rationale: Đại từ quy chiếu trực tiếp về “cây” và phù hợp với cách dùng tiếng Việt hiện đại.
theological_decisions:
- issue: Sức nặng của các mệnh lệnh trong ẩn dụ của Chúa Giê-su
  choice: 'Giữ dạng mệnh lệnh trực tiếp: “hãy làm cho cây…”'
  alternative: “hãy xem/kể cây là…” hoặc chuyển thành câu điều kiện
  rationale: Nguyên văn lặp lại hai động từ mệnh lệnh aorist. Dù có thể mang tác dụng tu từ, giữ hình thức mệnh lệnh tránh áp đặt một cách diễn giải và bảo toàn sự sắc bén, căng thẳng trong lập luận.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Cấu trúc “hoặc… hoặc…” cùng sự lặp lại “cây… trái… tốt/xấu” bảo toàn phép đối xứng tu từ của nguyên văn. Dùng “trái” thay vì “quả” theo lối diễn đạt phổ thông, tự nhiên; câu kết giữ thể bị động để bám sát cấu trúc Hy Lạp.
