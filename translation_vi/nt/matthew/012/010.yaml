  text: καὶ ἰδοὺ ⸀ἄνθρωπος χεῖρα ἔχων ξηράν. καὶ ἐπηρώτησαν αὐτὸν λέγοντες· Εἰ ἔξεστι τοῖς σάββασιν ⸀θεραπεύειν; ἵνα κατηγορήσωσιν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/010.yaml
  text: And behold[a], there was a man with a withered hand. And they asked him, saying, “Is it lawful to heal on the Sabbaths?” so that they might accuse him.
translation:
  language: vi
  text: 'Kìa, có một người có một bàn tay bị teo. Họ hỏi Ngài: “Có được phép chữa lành vào các ngày Sa-bát[a] không?” nhằm tố cáo Ngài.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch tự nhiên hơn: “vào ngày Sa-bát.” Tiếng Hy Lạp dùng số nhiều, “vào các ngày Sa-bát,” là một cách nói chỉ những ngày Sa-bát nói chung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: Kìa
  rationale: Giữ chức năng thu hút sự chú ý và làm cảnh thuật sống động, đồng thời vẫn tự nhiên, dễ hiểu trong tiếng Việt hiện đại.
- source_word: ἄνθρωπος
  choice: một người
  rationale: Chỉ một cá nhân nam trong ngữ cảnh; tiếng Việt không cần nhấn mạnh giới tính bằng từ “đàn ông” khi điều đó không có vai trò nổi bật trong câu.
- source_word: χεῖρα ἔχων ξηράν
  choice: bị teo một bàn tay
  rationale: Diễn đạt tự nhiên tình trạng bàn tay khô héo, suy kiệt hoặc mất chức năng mà không xác định quá mức nguyên nhân y khoa.
- source_word: ἐπηρώτησαν αὐτὸν λέγοντες
  choice: Họ hỏi Ngài
  rationale: Gộp động từ hỏi và phân từ “nói rằng” theo cú pháp tiếng Việt tự nhiên, không làm mất nội dung.
- source_word: ἔξεστι
  choice: có được phép
  rationale: Thể hiện câu hỏi về điều luật cho phép trong bối cảnh tranh luận liên quan đến ngày Sa-bát, tự nhiên hơn “có hợp pháp” trong tiếng Việt.
- source_word: τοῖς σάββασιν
  choice: vào các ngày Sa-bát
  rationale: Giữ hình thức số nhiều của nguyên văn Hy Lạp; cách nói này chỉ các ngày Sa-bát nói chung.
- source_word: θεραπεύειν
  choice: chữa bệnh
  rationale: Diễn đạt rõ hành động chữa lành thể chất trong ngữ cảnh, bằng cách nói phổ thông và tự nhiên.
- source_word: ἵνα κατηγορήσωσιν αὐτοῦ
  choice: nhằm tố cáo Ngài
  rationale: Giữ sắc thái mục đích của ἵνα và ý nghĩa buộc tội, tố cáo của κατηγορέω một cách cô đọng.
theological_decisions:
- issue: Cách diễn đạt ngày Sa-bát trong bối cảnh tranh luận về luật
  choice: vào các ngày Sa-bát
  alternative: vào ngày Sa-bát
  rationale: Nguyên văn dùng danh từ số nhiều τοῖς σάββασιν, nên bản văn chính giữ số nhiều để minh bạch với nguồn; chú thích nêu cách nói số ít tự nhiên và thường gặp trong tiếng Việt.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Kìa” để giữ sức gợi của lời thuật; dùng “Ngài” theo lối xưng hô tôn kính, quen thuộc khi nói về Chúa Giê-su. Dấu chú thích được đặt ngay sau cụm từ mà chú thích giải thích.
