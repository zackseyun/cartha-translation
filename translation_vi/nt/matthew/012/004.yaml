  to: ông đã vào nhà Đức Chúa Trời thế nào, rồi họ đã ăn[a] bánh đặt trước nhan Đức Chúa Trời[b], là thứ bánh mà theo luật, ông và những người đi cùng ông không được phép ăn, chỉ các thầy tế lễ mới được ăn?
