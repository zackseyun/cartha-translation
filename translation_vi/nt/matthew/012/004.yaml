    issue: Trật tự từ ở cụm mở đầu
    rationale: “thể nào ông đã vào” có sắc thái cổ và gượng. “ông đã vào ... thế nào” là lối hỏi tự nhiên hơn trong tiếng Việt chuẩn hiện đại.
  - severity: low
    issue: Diễn đạt ngoại lệ hơi dư
    rationale: “ngoại trừ ... mà thôi” lặp ý. “chỉ các thầy tế lễ mới được ăn” vẫn giữ trọn ý độc quyền của μόνοις và liên kết rõ với động từ “ăn”.
