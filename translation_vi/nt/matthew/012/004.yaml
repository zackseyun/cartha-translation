id: MAT.12.4
reference: Matthew 12:4
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: πῶς εἰσῆλθεν εἰς τὸν οἶκον τοῦ θεοῦ καὶ τοὺς ἄρτους τῆς προθέσεως ⸂ἔφαγον, ὃ⸃ οὐκ ἐξὸν ἦν αὐτῷ φαγεῖν οὐδὲ τοῖς μετ’ αὐτοῦ, εἰ μὴ τοῖς ἱερεῦσιν μόνοις;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/004.yaml
  text: how he entered into the house of God and ate the bread of the Presence[a], which it was not lawful for him to eat, nor for those with him[b], but only for the priests?
translation:
  language: vi
  text: ông đã vào nhà Đức Chúa Trời thế nào, rồi họ đã ăn[a] bánh đặt trước nhan Đức Chúa Trời[b], là thứ bánh mà theo luật, ông và những người đi cùng ông không được phép ăn, chỉ các thầy tế lễ mới được ăn?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Một số thủ bản hoặc cách đọc chép “ông đã ăn” thay cho “họ đã ăn.”
    reason: textual_variant
  - marker: b
    text: Cũng gọi là “bánh trần thiết,” tức bánh thánh được đặt trước nhan Đức Chúa Trời.
    reason: lexical_alternative
lexical_decisions:
- source_word: πῶς
  choice: thể nào
  rationale: Dẫn vào nội dung sự việc về Đa-vít được nhắc đến trong câu trước; cách diễn đạt này tự nhiên trong mạch câu hỏi tiếng Việt.
- source_word: εἰσῆλθεν εἰς τὸν οἶκον τοῦ θεοῦ
  choice: ông đã vào nhà Đức Chúa Trời
  rationale: Giữ nguyên cách gọi “nhà Đức Chúa Trời” của bản Hy Lạp, không diễn giải thành đền tạm hay nơi thánh.
- source_word: τοὺς ἄρτους τῆς προθέσεως
  choice: bánh đặt trước nhan Đức Chúa Trời
  rationale: Truyền đạt rõ ý về bánh thánh được đặt trước mặt Đức Chúa Trời, đồng thời dễ hiểu hơn thuật ngữ truyền thống “bánh trần thiết”.
- source_word: ἔφαγον
  choice: họ đã ăn
  rationale: Theo dạng số nhiều trong bản SBLGNT; đại từ “họ” chỉ Đa-vít cùng những người đi với ông. Dị bản số ít được ghi ở chú thích.
- source_word: ὃ οὐκ ἐξὸν ἦν αὐτῷ φαγεῖν
  choice: là thứ bánh mà theo luật, ông ... không được phép ăn
  rationale: Cụm “theo luật” bảo tồn sắc thái luật pháp và nghi lễ của ἐξὸν, còn “không được phép ăn” là cách nói tự nhiên trong tiếng Việt hiện đại.
- source_word: οὐδὲ τοῖς μετ’ αὐτοῦ
  choice: và những người đi cùng ông không được phép ăn
  rationale: Diễn đạt rõ rằng sự hạn chế cũng áp dụng cho những người đi với Đa-vít.
- source_word: εἰ μὴ τοῖς ἱερεῦσιν μόνοις
  choice: ngoại trừ các thầy tế lễ mà thôi
  rationale: Giữ cả ý ngoại lệ của εἰ μή và tính độc quyền của μόνοις.
theological_decisions:
- issue: Sắc thái luật pháp và nghi lễ của ἐξὸν
  choice: theo luật ... không được phép ăn
  alternative: không được ăn
  rationale: Cách dịch được chọn cho thấy đây là sự hạn chế theo luật thánh, chứ không chỉ là một quy ước xã hội, nhưng không thêm lời giải thích thần học ngoài văn bản.
- issue: Chủ ngữ của ἔφαγον
  choice: họ đã ăn
  alternative: ông đã ăn
  rationale: Bản SBLGNT được cung cấp có động từ số nhiều, phù hợp với việc ngay sau đó nhắc đến những người đi cùng Đa-vít. Dị bản số ít được bảo tồn trong chú thích.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại. Dùng “Đức Chúa Trời” và “thầy tế lễ” theo lối gọi Kinh Thánh quen thuộc; giải nghĩa thuật ngữ nghi lễ ngay trong câu bằng cách nói dễ hiểu, đồng thời giữ thuật ngữ truyền thống ở chú thích.
