source:
  edition: SBLGNT
  text: Ὁ δὲ Ἰησοῦς γνοὺς ἀνεχώρησεν ἐκεῖθεν. καὶ ἠκολούθησαν ⸀αὐτῷ πολλοί, καὶ ἐθεράπευσεν αὐτοὺς πάντας,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/015.yaml
  text: But Jesus[a], knowing this, withdrew from there. And many followed him, and he healed them all,
translation:
  language: vi
  text: Nhưng Giê-su, biết điều ấy[a], rút đi khỏi đó. Nhiều người đi theo Ngài, và Ngài chữa lành tất cả họ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Nhưng Giê-su, biết, rút đi khỏi đó.” Tiếng Hy Lạp không nêu rõ Ngài biết điều gì; văn cảnh câu trước cho thấy đó là mưu tính hại Ngài.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γνοὺς
  choice: khi biết việc ấy
  rationale: Phân từ bất định quá khứ của γινώσκω diễn tả việc nhận biết có trước và dẫn đến hành động rút đi. “Việc ấy” nối tự nhiên với âm mưu được kể ở câu trước, đồng thời chú thích cho biết tân ngữ không được nêu rõ trong tiếng Hy Lạp.
- source_word: ἀνεχώρησεν
  choice: rút khỏi
  rationale: Trong Ma-thi-ơ, ἀναχωρέω thường chỉ việc chủ động rời đi trước sự chống đối hoặc nguy hiểm; “rút khỏi” giữ được sắc thái này mà không hàm ý nhút nhát.
- source_word: ἐκεῖθεν
  choice: đó
  rationale: Kết hợp với “rút khỏi” thành cách nói tiếng Việt tự nhiên “rút khỏi đó”, diễn tả chuyển động rời một địa điểm.
- source_word: ἠκολούθησαν αὐτῷ πολλοί
  choice: có nhiều người đi theo Ngài
  rationale: πολλοί chỉ đơn giản là “nhiều người”, không nhất thiết là “đám đông”; cách diễn đạt này tự nhiên trong tiếng Việt và không thêm ý ngoài nguyên văn.
- source_word: ἐθεράπευσεν
  choice: chữa lành
  rationale: Trong các trình thuật chữa bệnh của sách Tin Mừng, θεραπεύω được diễn đạt rõ ràng và quen thuộc nhất bằng “chữa lành”.
- source_word: αὐτοὺς πάντας
  choice: tất cả họ
  rationale: Giữ đầy đủ phạm vi của πάντας và quy chiếu αὐτούς về những người vừa được nhắc đến.
theological_decisions:
- issue: Tân ngữ hàm ẩn của γνοὺς
  choice: “biết việc ấy”, hiểu theo văn cảnh là biết âm mưu của những người Pha-ri-si ở câu trước
  alternative: “biết” hoặc “hay tin ấy” mà không nêu rõ đối tượng
  rationale: Nguyên văn không có tân ngữ trực tiếp. Bổ sung “việc ấy” giúp câu tiếng Việt rõ và tự nhiên nhưng không xác định chi tiết vượt quá văn cảnh; chú thích duy trì tính hàm ẩn của tiếng Hy Lạp.
- issue: Sắc thái việc Giê-su rời đi
  choice: “rút khỏi”
  alternative: “rời khỏi” hoặc “đi khỏi”
  rationale: Lựa chọn này giữ mô-típ Giê-su chủ động tránh khỏi sự chống đối trong Ma-thi-ơ, nhưng không gán cho hành động ấy động cơ sợ hãi hay một cách giải thích thần học riêng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng tên “Giê-su” mà không thêm danh xưng không có trong câu Hy Lạp; dùng “Ngài” như đại từ tôn kính quen thuộc trong văn cảnh Kinh Thánh. Cấu trúc câu được sắp xếp tự nhiên theo tiếng Việt, đồng thời giữ quan hệ thời gian và nguyên nhân giữa việc biết và việc rút đi.
