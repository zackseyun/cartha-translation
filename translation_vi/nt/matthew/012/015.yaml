revisions:
- from: Nhưng khi biết việc ấy[a], Giê-su rút khỏi đó. Có nhiều người đi theo Ngài, và Ngài chữa lành cho tất cả họ.
  to: Nhưng Giê-su, biết điều ấy[a], rút đi khỏi đó. Nhiều người đi theo Ngài, và Ngài chữa lành tất cả họ.
  rationale: Bản sửa giữ nguyên tân ngữ hàm ẩn của γνοὺς qua “điều ấy” và chú thích, dùng cấu trúc tiếng Việt rõ ràng hơn cho phân từ đi kèm chủ ngữ Giê-su, và dịch trực tiếp hơn mệnh đề “nhiều người đi theo Ngài.” “Rút đi khỏi đó” bảo toàn sắc thái ἀνεχώρησεν mà không gán động cơ thần học hay tâm lý.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T02:46:15Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch truyền đạt đúng các yếu tố chính của câu: Giê-su nhận biết điều được văn cảnh trước cung cấp, rời khỏi nơi ấy, nhiều người theo Ngài, và Ngài chữa lành tất cả. Tuy nhiên, “có nhiều người đi theo” thêm sắc thái tồn tại/diễn tiến không cần thiết so với mệnh đề trần thuật trực tiếp ἠκολούθησαν αὐτῷ πολλοί.'
  naturalness: “Rút khỏi đó” hiểu được, nhưng “rút đi khỏi đó” tự nhiên và trọn vẹn hơn trong tiếng Việt hiện đại. Đưa chủ ngữ “Giê-su” lên trước phân từ bằng cấu trúc chen “biết điều ấy” làm câu rõ chủ thể và gần với cấu trúc nguyên ngữ.
  terminology: “Giê-su,” “Ngài,” và “chữa lành” phù hợp văn phong Kinh Thánh tiếng Việt hiện đại. “Điều ấy” giữ tân ngữ hàm ẩn của γνούς mà không xác định quá mức.
  issues:
  - severity: low
    issue: Cụm “Có nhiều người đi theo Ngài” không sát sắc thái trần thuật trực tiếp của nguyên ngữ.
    rationale: πολλοί là chủ ngữ của động từ aorist ἠκολούθησαν (“nhiều người đã đi theo”), không cần cấu trúc hiện hữu “có nhiều người.”
  - severity: low
    issue: “Rút khỏi đó” hơi thiếu tự nhiên khi dùng độc lập.
    rationale: Thêm “đi” tạo cụm “rút đi khỏi đó,” vẫn giữ sắc thái ἀνεχώρησεν là chủ động rút lui/rời đi trước sự chống đối.
