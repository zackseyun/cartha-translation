revisions:
- from: Nếu Sa-tan đuổi Sa-tan ra[a], thì nó đã tự chia rẽ chống lại chính mình[b]. Vậy làm sao vương quốc của nó có thể đứng vững được?
  to: Và nếu Sa-tan đuổi Sa-tan ra[a], thì nó đã bị chia rẽ chống lại chính mình[b]. Vậy vương quốc của nó sẽ đứng vững thế nào?
  rationale: Bản sửa giữ nguyên nghĩa và lập luận của câu, đồng thời phản ánh rõ hơn liên từ mở đầu, thể bị động aorist của ἐμερίσθη, và thì tương lai của σταθήσεται. Chú thích b chuyển «đã tự chia rẽ» thành phương án thay thế, vì đây là cách diễn đạt Việt ngữ tự nhiên hơn nhưng ít sát thể bị động hơn văn bản chính.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T02:46:29Z'
review_pass:
  verdict: revise
  source_fidelity: Bản dịch truyền đạt đúng lập luận phản chứng, hành động trục xuất, sự xung đột nội tại và hình ảnh vương quốc không thể tồn tại. Tuy nhiên, «đã tự chia rẽ» chuyển động từ thể bị động ἐμερίσθη sang một hành động phản thân chủ động; «đã bị chia rẽ chống lại chính mình» giữ sát hơn thể và quan hệ của nguyên văn. «Sẽ đứng vững thế nào?» cũng phản ánh trực tiếp hơn thì tương lai σταθήσεται. Thêm «Và» bảo lưu καὶ ở đầu câu mà vẫn tự nhiên trong mạch lập luận.
  naturalness: «Và nếu ...» phù hợp văn cảnh tranh luận. «đã bị chia rẽ chống lại chính mình» hơi trang trọng nhưng rõ nghĩa và chấp nhận được trong văn phong Kinh Thánh hiện đại. «sẽ đứng vững thế nào?» tự nhiên, cô đọng, và giữ được tính tu từ.
  terminology: «Sa-tan», «đuổi ... ra», «vương quốc» và «đứng vững» là các lựa chọn nhất quán, dễ hiểu, và phù hợp ngữ cảnh. Đại từ «nó» xác định Sa-tan mà không gán sắc thái tôn kính.
  issues:
  - severity: medium
    issue: «đã tự chia rẽ» không giữ được rõ thể bị động của ἐμερίσθη.
    rationale: Nguyên văn nói Sa-tan «đã bị chia rẽ/chia rẽ» chống lại chính mình. Cách dùng «tự» có thể khiến Sa-tan trở thành tác nhân trực tiếp của hành động chia rẽ, thay vì diễn đạt tình trạng phân rẽ mà câu Hy Lạp nêu.
  - severity: low
    issue: «có thể đứng vững được» làm mờ thì tương lai của σταθήσεται.
    rationale: Câu hỏi tu từ tiếng Việt có thể diễn đạt tự nhiên bằng «sẽ đứng vững thế nào?», vừa bảo lưu hình ảnh «đứng» vừa phản ánh tương lai.
  - severity: low
    issue: Liên từ καὶ ở đầu câu chưa được thể hiện.
    rationale: Trong câu tiếp nối một lập luận trước đó, «Và nếu» là cách tự nhiên để giữ mạch suy luận của καὶ εἰ.
