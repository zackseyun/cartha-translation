id: MAT.12.26
reference: Matthew 12:26
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ εἰ ὁ Σατανᾶς τὸν Σατανᾶν ἐκβάλλει, ἐφ’ ἑαυτὸν ἐμερίσθη· πῶς οὖν σταθήσεται ἡ βασιλεία αὐτοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/026.yaml
  text: And if Satan casts out Satan[a], he is divided against himself[c][b]. How then will his kingdom stand?
translation:
  language: vi
  text: Và nếu Sa-tan đuổi Sa-tan ra[a], thì nó đã bị chia rẽ chống lại chính mình[b]. Vậy vương quốc của nó sẽ đứng vững thế nào?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “xua đuổi Sa-tan.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “nó đã tự chia rẽ chống lại chính mình.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ εἰ
  choice: Nếu
  rationale: Trong tiếng Việt, mở đầu bằng “Nếu” nối tự nhiên với lập luận ngay trước đó; không cần dịch καί thành “và” một cách máy móc.
- source_word: ὁ Σατανᾶς / τὸν Σατανᾶν
  choice: Sa-tan
  rationale: Dùng dạng phiên âm tên gọi đã quen thuộc trong tiếng Việt, không diễn giải thành “Kẻ Đối Nghịch”.
- source_word: ἐκβάλλει
  choice: đuổi ... ra
  rationale: Diễn đạt tự nhiên và chính xác hành động trục xuất trong ngữ cảnh trừ quỷ; “xua đuổi” là phương án gần nghĩa.
- source_word: ἐφ’ ἑαυτὸν
  choice: chống lại chính mình
  rationale: Giữ rõ ý đối nghịch nội tại của cấu trúc ἐπί với đại từ phản thân.
- source_word: ἐμερίσθη
  choice: đã tự chia rẽ
  rationale: Thể bị động aorist được chuyển sang cách nói tiếng Việt tự nhiên, diễn tả tình trạng phân rẽ phát sinh trong giả định; “tự” phản ánh quan hệ phản thân trong mệnh đề mà không quy thêm tác nhân bên ngoài.
- source_word: πῶς οὖν
  choice: Vậy làm sao
  rationale: “Vậy” truyền đạt sắc thái suy luận của οὖν, còn “làm sao” giữ lực của câu hỏi tu từ.
- source_word: σταθήσεται
  choice: có thể đứng vững được
  rationale: Giữ hình ảnh “đứng” đồng thời làm rõ nghĩa tồn tại bền vững trong câu hỏi tu từ. Dù hình thái Hy Lạp là tương lai, tiếng Việt tự nhiên dùng “có thể ... được” để biểu đạt tính bất khả trong kết luận logic.
- source_word: ἡ βασιλεία αὐτοῦ
  choice: vương quốc của nó
  rationale: “Vương quốc” phù hợp hình ảnh một lãnh địa bị chia rẽ. Đại từ “nó” chỉ Sa-tan một cách rõ ràng và tránh hàm ý tôn kính không có trong nguyên văn.
theological_decisions:
- issue: Ý nghĩa việc Sa-tan tự chia rẽ
  choice: 'Giữ nguyên lập luận phản chứng: nếu Sa-tan đuổi Sa-tan thì nó chống lại chính mình, khiến vương quốc nó không thể đứng vững.'
  alternative: Có thể diễn giải rộng bằng hình ảnh “nhà tự chia rẽ” từ văn cảnh trước.
  rationale: Câu Hy Lạp trực tiếp nói đến sự chia rẽ của Sa-tan và sự bất ổn của vương quốc nó; không cần đưa thêm hình ảnh từ câu trước vào bản văn.
- issue: Thời và thể của ἐμερίσθη
  choice: “đã tự chia rẽ”
  alternative: “bị chia rẽ” hoặc “tự chia rẽ”
  rationale: Cách dịch giữ sắc thái hoàn tất của aorist trong tình huống giả định, nhưng không xác định một tác nhân gây chia rẽ mà nguyên văn không nêu.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Cấu trúc câu giữ chặt mạch lập luận của nguyên văn, dùng “đứng vững” để bảo tồn ẩn dụ và dùng “vương quốc” thay vì diễn giải thành “quyền cai trị”.
