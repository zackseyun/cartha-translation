id: MAT.12.27
reference: Matthew 12:27
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ εἰ ἐγὼ ἐν Βεελζεβοὺλ ἐκβάλλω τὰ δαιμόνια, οἱ υἱοὶ ὑμῶν ἐν τίνι ἐκβάλλουσιν; διὰ τοῦτο αὐτοὶ ⸂κριταὶ ἔσονται ὑμῶν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/027.yaml
  text: And if I cast out demons by Beelzebul[a], by whom do your sons cast them out? Therefore they will be your judges.
translation:
  language: vi
  text: Nếu tôi nhờ Bê-ên-xê-bun[a] mà đuổi các quỷ, thì con cái các ông nhờ ai mà đuổi chúng? Vì thế, chính họ sẽ là người xét xử các ông.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hy Lạp: “Bê-ên-xê-bun”; tên này cũng thường được gọi là “Bê-ên-xê-búp.”'
    reason: Ghi nhận dạng tên thay thế quen thuộc mà không thay thế dạng của bản Hy Lạp nguồn.
lexical_decisions:
- source_word: ἐν Βεελζεβοὺλ
  choice: nhờ Bê-ên-xê-bun
  rationale: Trong ngữ cảnh lời cáo buộc này, ἐν có nghĩa chỉ phương tiện hoặc tác nhân. “Nhờ” diễn đạt tự nhiên ý quyền năng được cho là dùng để đuổi quỷ. Tên riêng được phiên âm theo dạng Βεελζεβούλ của bản Hy Lạp.
- source_word: ἐκβάλλω τὰ δαιμόνια
  choice: đuổi các quỷ
  rationale: ἐκβάλλω trong ngữ cảnh trừ quỷ mang nghĩa xua hoặc đuổi ra; “đuổi các quỷ” rõ ràng, tự nhiên và giữ được sức mạnh của hành động trục xuất.
- source_word: οἱ υἱοὶ ὑμῶν
  choice: con cái các ông
  rationale: Giữ hình ảnh thân tộc của υἱοί nhưng dùng “con cái” theo lối nói tiếng Việt, có thể chỉ những người thuộc nhóm hoặc môn đệ của người nghe mà không giải thích quá mức.
- source_word: ἐν τίνι
  choice: nhờ ai
  rationale: Cụm này song song với ἐν Βεελζεβούλ và có nghĩa chỉ tác nhân hoặc phương tiện; “nhờ ai” tự nhiên trong câu hỏi tiếng Việt.
- source_word: διὰ τοῦτο
  choice: Vì thế
  rationale: Diễn đạt ngắn gọn quan hệ suy luận được διὰ τοῦτο giới thiệu.
- source_word: κριταὶ ἔσονται ὑμῶν
  choice: chính họ sẽ là người xét xử các ông
  rationale: Giữ cấu trúc danh từ vị ngữ và thì tương lai của bản Hy Lạp. “Chính họ” làm nổi bật lực tu từ của αὐτοί, còn “người xét xử” tự nhiên hơn “các thẩm phán” trong ngữ cảnh này.
theological_decisions:
- issue: Danh tính và cách ghi Βεελζεβούλ
  choice: Bê-ên-xê-bun
  alternative: Bê-ên-xê-búp
  rationale: Theo dạng tên Βεελζεβούλ trong nguồn SBLGNT và phiên âm tên riêng, thay vì đồng hóa với dạng truyền thống quen thuộc hơn. Chú thích bảo tồn dạng thay thế.
- issue: Phạm vi chỉ định của οἱ υἱοὶ ὑμῶν
  choice: con cái các ông
  alternative: người của các ông / môn đệ các ông
  rationale: 'Bản Hy Lạp dùng từ chỉ quan hệ con cái. Giữ cách diễn đạt này bảo tồn độ mở: có thể là hậu duệ, thành viên trong cộng đồng, hoặc môn đệ của những người đang bị chất vấn.'
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “các ông” để phản ánh số nhiều ὑμῶν; tránh các thuật ngữ giáo phái. Câu hỏi tu từ và kết luận mang tính đối chất được giữ nguyên.
