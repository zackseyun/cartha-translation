  terminology: “Bê-ên-xê-bun” theo đúng dạng Βεελζεβούλ của SBLGNT; chú thích nêu dạng quen thuộc Bê-ên-xê-búp mà không thay thế dạng nguồn. “Quỷ” và “người xét xử” dùng đúng trường nghĩa trong ngữ cảnh này, không áp đặt diễn giải giáo phái.
