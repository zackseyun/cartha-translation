revisions:
- from: Hay các ông chưa đọc trong Luật rằng vào những ngày Sa-bát, các thầy tế lễ trong đền thờ làm cho ngày Sa-bát thành ra phàm tục[a][b] mà vẫn không mắc tội sao?[c]
  to: Hay các ông chưa đọc trong Luật rằng vào những ngày Sa-bát, các thầy tế lễ trong đền thờ phạm ngày Sa-bát[a][b] mà vẫn vô tội sao?[c]
  rationale: Sửa duy nhất cách chuyển βεβηλοῦσιν để tiếng Việt tự nhiên và chính xác hơn về mặt ngữ nghĩa. “Phạm ngày Sa-bát” giữ lời lẽ mạnh của nguyên văn mà không áp đặt cách giải thích rằng các thầy tế lễ đã làm mất bản tính thánh của ngày Sa-bát. Cụm “mà vẫn vô tội” duy trì rõ sức căng có chủ ý giữa hai vế.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T02:45:55Z'
review_pass:
  verdict: revise
  source_fidelity: Bản dịch phản ánh đầy đủ cấu trúc câu hỏi tu từ, đối lập giữa việc các thầy tế lễ làm điều có thể được gọi là phạm/xâm phạm Sa-bát và tình trạng không có tội của họ. Tuy nhiên, cụm “làm cho ngày Sa-bát thành ra phàm tục” quá diễn giải theo kiểu gây khiến và không phải là cách tiếng Việt tự nhiên để chuyển βεβηλοῦσιν trong ngữ cảnh này.
  naturalness: “Hay các ông chưa đọc trong Luật rằng...” và “vào những ngày Sa-bát” đều tự nhiên, trang trọng. Thay “làm cho ngày Sa-bát thành ra phàm tục” bằng “phạm ngày Sa-bát” tạo một câu rõ, tự nhiên hơn, đồng thời vẫn giữ được nghịch lý tu từ nguyên văn khi đi với “vẫn vô tội”.
  terminology: “Luật,” “Sa-bát,” “thầy tế lễ,” và “đền thờ” phù hợp cách dùng Kinh Thánh tiếng Việt hiện đại. “Phạm ngày Sa-bát” là cách chuyển gọn, thông dụng của ý βεβηλοῦσιν; chú thích vẫn bảo lưu các khả năng “vi phạm” và “phá luật.”
  issues:
  - severity: medium
    issue: Cụm “làm cho ngày Sa-bát thành ra phàm tục” không tự nhiên và dễ chuyển trọng tâm của động từ sang việc biến đổi bản chất của ngày Sa-bát.
    rationale: βεβηλοῦσιν nói đến việc đối xử/xử sự khiến điều thánh bị coi là phàm, tức hành vi phạm hay xúc phạm Sa-bát; không nhất thiết nói rằng các thầy tế lễ làm cho ngày ấy tự nó trở thành phàm tục.
