id: MAT.12.5
reference: Matthew 12:5
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἢ οὐκ ἀνέγνωτε ἐν τῷ νόμῳ ὅτι τοῖς σάββασιν οἱ ἱερεῖς ἐν τῷ ἱερῷ τὸ σάββατον βεβηλοῦσιν καὶ ἀναίτιοί εἰσιν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/005.yaml
  text: Or have you not read in the Law that on the Sabbaths the priests in the temple profane the Sabbath and are guiltless?[a][b][c]
translation:
  language: vi
  text: Hay các ông chưa đọc trong Luật rằng vào những ngày Sa-bát, các thầy tế lễ trong đền thờ phạm ngày Sa-bát[a][b] mà vẫn vô tội sao?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “vi phạm ngày Sa-bát” hoặc “phá luật ngày Sa-bát”. Động từ Hy Lạp mang nghĩa đối xử với điều thánh như điều thông thường hay phàm tục.'
    reason: lexical_alternative
  - marker: b
    text: Nguyên văn là “vào các ngày Sa-bát”, có lẽ nói đến điều vẫn diễn ra lặp lại vào mỗi dịp Sa-bát, chứ không chỉ một lần riêng lẻ.
    reason: lexical_alternative
  - marker: c
    text: “Luật” ở đây chỉ Luật Môi-se trong Kinh Thánh, có lẽ bao gồm các quy định về việc phục vụ tế lễ trong ngày Sa-bát; xem Dân Số 28:9–10.
    reason: cross_reference
lexical_decisions:
- source_word: ἢ
  choice: Hay
  rationale: Mở đầu một lập luận Kinh Thánh khác trong lời bác bỏ; “Hay” giữ tự nhiên sắc thái lựa chọn trong câu hỏi tu từ.
- source_word: οὐκ ἀνέγνωτε
  choice: các ông chưa đọc ... sao?
  rationale: Diễn đạt tự nhiên công thức câu hỏi tu từ trong tiếng Việt, hàm ý người nghe đáng lẽ phải biết nội dung Kinh Thánh.
- source_word: ἐν τῷ νόμῳ
  choice: trong Luật
  rationale: “Luật” viết hoa chỉ Luật Môi-se, tức phần Kinh Thánh có các quy định liên quan.
- source_word: τοῖς σάββασιν
  choice: vào những ngày Sa-bát
  rationale: Giữ số nhiều của tiếng Hy Lạp và ý nghĩa hành động diễn ra lặp lại vào các dịp Sa-bát.
- source_word: οἱ ἱερεῖς
  choice: các thầy tế lễ
  rationale: Cách gọi rõ ràng, quen thuộc trong tiếng Việt đối với những người thi hành chức vụ tế lễ tại đền thờ.
- source_word: ἐν τῷ ἱερῷ
  choice: trong đền thờ
  rationale: ἱερόν chỉ khuôn viên đền thờ nói chung; “trong đền thờ” là cách diễn đạt tự nhiên mà không thu hẹp thành nơi thánh bên trong.
- source_word: τὸ σάββατον
  choice: ngày Sa-bát
  rationale: Giữ số ít, nói đến ngày hay thể chế Sa-bát bị tác động.
- source_word: βεβηλοῦσιν
  choice: làm cho ... thành ra phàm tục
  rationale: Thể hiện nghĩa căn bản là đối xử với điều thánh như điều thông thường/phàm tục, đồng thời giữ sức nặng và nghịch lý trong lập luận.
- source_word: ἀναίτιοί εἰσιν
  choice: vẫn không mắc tội
  rationale: Diễn đạt rõ sự không chịu trách nhiệm hay kết tội trong bối cảnh pháp lý-tôn giáo; “vẫn” làm nổi bật sự tương phản do καί nối kết.
theological_decisions:
- issue: Có nên làm nhẹ lời nói rằng các thầy tế lễ “làm cho ngày Sa-bát thành ra phàm tục” để tránh hàm ý họ thực sự vi phạm ngày Sa-bát hay không
  choice: Giữ cách nói mạnh “làm cho ngày Sa-bát thành ra phàm tục” cùng với “vẫn không mắc tội”
  alternative: “vi phạm ngày Sa-bát mà vẫn vô tội” hoặc “phá luật ngày Sa-bát mà không bị kết tội”
  rationale: 'Nguyên văn cố ý đặt hai ý trong thế căng thẳng: công việc tế lễ có thể được mô tả bằng động từ “làm thành phàm tục”, nhưng các thầy tế lễ không phải chịu tội. Bản dịch không giải tỏa nghịch lý ấy bằng cách làm nhẹ động từ.'
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “các ông” phù hợp với lời chất vấn trực tiếp trong ngữ cảnh; “thầy tế lễ” và “đền thờ” là thuật ngữ Kinh Thánh quen thuộc. Cấu trúc câu hỏi tu từ được đặt tự nhiên trong tiếng Việt, đồng thời các dấu chú thích [a], [b], [c] đều xuất hiện trong chính văn.
