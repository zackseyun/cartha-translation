id: MAT.12.22
reference: Matthew 12:22
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Τότε ⸂προσηνέχθη αὐτῷ δαιμονιζόμενος τυφλὸς καὶ κωφός⸃· καὶ ἐθεράπευσεν αὐτόν, ὥστε τὸν ⸀κωφὸν λαλεῖν καὶ βλέπειν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/022.yaml
  text: Then a demon-possessed man[a], blind and mute, was brought to him; and he healed him, so that the mute man spoke and saw.
translation:
  language: vi
  text: Bấy giờ, một người bị quỷ ám, vừa mù vừa câm[a], được đem đến với Đức Chúa Giê-su. Ngài chữa lành người ấy, khiến người câm nói được và thấy được.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “điếc.” Từ Hy Lạp có thể chỉ người điếc hoặc người không nói được; ở đây, ngữ cảnh nghiêng về nghĩa “câm” vì sau khi được chữa lành, người ấy nói được và thấy được.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Bấy giờ
  rationale: Dấu nối thời gian mở đầu sự việc tiếp theo; cách diễn đạt tự nhiên, trang trọng trong văn thuật chuyện.
- source_word: προσηνέχθη αὐτῷ
  choice: người ta đem đến cho Đức Chúa Giê-su
  rationale: Thể bị động Hy Lạp không nêu tác nhân. Tiếng Việt thường dùng chủ thể phiếm chỉ “người ta” tự nhiên hơn; tên Đức Chúa Giê-su làm rõ đại từ theo ngữ cảnh mà không đổi sở chỉ.
- source_word: δαιμονιζόμενος
  choice: bị quỷ ám
  rationale: Giữ nguyên quy chiếu rõ ràng đến tác động của quỷ và dùng cách nói quen thuộc, dễ hiểu trong tiếng Việt hiện đại.
- source_word: τυφλὸς καὶ κωφός
  choice: vừa mù vừa câm
  rationale: τυφλός là “mù”; κωφός có thể chỉ điếc hoặc câm, nhưng mệnh đề kết quả nói người ấy nói được và thấy được, nên “câm” phù hợp nhất trong ngữ cảnh.
- source_word: ἐθεράπευσεν αὐτόν
  choice: Ngài chữa lành người ấy
  rationale: “Chữa lành” truyền đạt trực tiếp hành động phục hồi trong trình thuật phép lạ; “Ngài” là đại từ tôn kính tự nhiên dành cho Đức Chúa Giê-su.
- source_word: ὥστε
  choice: khiến
  rationale: Diễn đạt gọn và rõ kết quả phát sinh từ việc chữa lành.
- source_word: τὸν κωφὸν λαλεῖν καὶ βλέπειν
  choice: người câm nói được và thấy được
  rationale: Giữ cấu trúc kết quả và hai khả năng được phục hồi; “được” tự nhiên trong tiếng Việt và biểu thị khả năng đã được phục hồi.
theological_decisions:
- issue: Bản chất của tình trạng do quỷ gây ra
  choice: Giữ cách nói rõ ràng “bị quỷ ám”
  alternative: bị bệnh; bị hành hạ
  rationale: δαιμονιζόμενος quy tình trạng của người này cho tác động của quỷ; không nên làm mờ hoặc chuyển thành một chẩn đoán lâm sàng hiện đại.
- issue: Nghĩa của κωφός trong ngữ cảnh
  choice: câm
  alternative: điếc
  rationale: Từ Hy Lạp có thể chỉ người điếc hoặc không nói được. Vì kết quả được nêu là người ấy nói được và thấy được, bản dịch chính dùng “câm” nhưng ghi nhận nghĩa khác trong chú thích.
translation_notes:
  register: Văn phong hiện đại, rõ ràng và trang trọng vừa phải. Dùng “Đức Chúa Giê-su” và “Ngài” theo lối diễn đạt phổ thông của Kinh Thánh tiếng Việt; dùng chủ thể phiếm chỉ “người ta” để chuyển thể bị động Hy Lạp sang câu tiếng Việt tự nhiên.
