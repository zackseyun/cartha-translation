  - severity: medium
    issue: 'Câu chú thích a có diễn đạt không chuẩn: “Tiếng Hy Lạp nói sát chữ đến sợi lanh...”'
    rationale: Cấu trúc này thiếu tự nhiên và có thể gây khó hiểu. Nên nói rõ rằng nghĩa đen của λίνον là “sợi lanh,” được dùng làm tim đèn.
