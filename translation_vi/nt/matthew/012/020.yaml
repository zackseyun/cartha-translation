id: MAT.12.20
reference: Matthew 12:20
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: κάλαμον συντετριμμένον οὐ κατεάξει καὶ λίνον τυφόμενον οὐ σβέσει, ἕως ἂν ἐκβάλῃ εἰς νῖκος τὴν κρίσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/020.yaml
  text: He will not break a bruised reed[a], and he will not extinguish a smoldering wick[b], until he brings justice to victory.
translation:
  language: vi
  text: Người sẽ không bẻ gãy cây sậy bị giập, cũng không dập tắt tim đèn còn âm ỉ[a], cho đến khi Người đưa công lý đến thắng lợi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “cũng không dập tắt sợi lanh đang bốc khói.” Nghĩa đen, tiếng Hy Lạp nói đến sợi lanh được dùng làm tim đèn.'
    reason: lexical_alternative
  - marker: b
    text: 'Hoặc: “cho đến khi Người đưa sự phán xét đến thắng lợi.”'
    reason: alternative_reading
lexical_decisions:
- source_word: κάλαμον
  choice: cây sậy
  rationale: Danh từ này thường chỉ cây hoặc thân sậy; “cây sậy” tự nhiên trong tiếng Việt và giữ nguyên hình ảnh từ Ê-sai.
- source_word: συντετριμμένον
  choice: đã giập
  rationale: Phân từ diễn tả cây sậy bị tổn hại, dập nát nhưng chưa nhất thiết đã gãy lìa; “đã giập” phù hợp với hành động tiếp theo là không bẻ gãy.
- source_word: κατεάξει
  choice: sẽ không bẻ gãy
  rationale: Động từ có nghĩa là bẻ hoặc làm gãy; cách dịch này rõ ràng và giữ được sắc thái dịu dàng của hình ảnh.
- source_word: λίνον
  choice: tim đèn
  rationale: Nghĩa đen là sợi lanh, nhưng trong ngữ cảnh này chỉ sợi lanh dùng làm tim đèn. “Tim đèn” truyền đạt đúng vật được nói đến cho độc giả hiện đại.
- source_word: τυφόμενον
  choice: còn âm ỉ
  rationale: Phân từ mô tả tim đèn đang tỏa khói và gần tắt; “còn âm ỉ” diễn tả tự nhiên ngọn lửa yếu ớt chưa tắt hẳn.
- source_word: σβέσει
  choice: sẽ không dập tắt
  rationale: Động từ nghĩa là làm tắt; “dập tắt” là cách nói tự nhiên trong tiếng Việt với tim đèn hoặc ngọn lửa.
- source_word: ἕως ἂν
  choice: cho đến khi
  rationale: Cấu trúc chỉ mốc tương lai mà hành động sẽ đạt tới; “cho đến khi” bảo toàn quan hệ thời gian và mục tiêu.
- source_word: ἐκβάλῃ
  choice: đưa
  rationale: Trong ngữ cảnh trích dẫn Ê-sai, động từ mang ý đưa ra hoặc làm cho đạt tới kết quả quyết định; “đưa” kết hợp tự nhiên với cụm “đến thắng lợi” mà không làm mạnh quá hình ảnh.
- source_word: εἰς νῖκος
  choice: đến thắng lợi
  rationale: Cụm từ chỉ kết quả thành công, tức đến chỗ chiến thắng; “đến thắng lợi” tự nhiên và giữ lực hướng đích.
- source_word: τὴν κρίσιν
  choice: công lý
  rationale: κρίσις có thể là sự phán xét hoặc công lý. Trong bối cảnh Người Tôi Tớ ở Ê-sai, “công lý” diễn tả rộng hơn việc thiết lập trật tự công chính, còn phương án “sự phán xét” được ghi ở chú thích.
theological_decisions:
- issue: Cách dịch κρίσις trong lời trích về Người Tôi Tớ
  choice: công lý
  alternative: sự phán xét
  rationale: Ngữ cảnh nói đến sứ mạng dịu dàng nhưng hữu hiệu của Người Tôi Tớ trong việc làm cho trật tự công chính của Đức Chúa Trời thắng thế, chứ không chỉ tuyên một bản án. Tuy vậy, từ Hy Lạp vẫn thực sự cho phép nghĩa “sự phán xét”, nên phương án ấy được bảo lưu.
- issue: Mức độ dịch sát trong hình ảnh ngọn đèn
  choice: tim đèn còn âm ỉ ... dập tắt
  alternative: sợi lanh đang bốc khói ... dập tắt
  rationale: λίνον theo nghĩa vật liệu là sợi lanh, nhưng trong thành ngữ này là tim đèn bằng sợi lanh. Bản chính dùng vật được chỉ đến để người đọc hiện đại hiểu ngay, còn chú thích bảo lưu hình thức sát từ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Người” cho chủ thể được nhắc đến trong lời tiên tri; giữ hai hình ảnh song song và nhịp câu cô đọng. Các dấu chú thích được đặt ngay sau cụm từ mà chúng giải thích.
