    issue: Cụm “vẫn còn đang” hơi thừa nét tiếp diễn.
    rationale: “Còn đang” đã diễn đạt đầy đủ ý “still speaking” trong tiếng Việt hiện đại.
  - severity: medium
    issue: “Tìm cách nói chuyện với Ngài” có thể gợi ý một trở ngại không có trong nguyên văn, và chú thích không gắn trực tiếp với từ được chú giải.
    rationale: ζητοῦντες chủ yếu nêu việc tìm/định nói, không xác nhận họ gặp khó khăn; dấu [a] cần theo ngay “các anh em trai của Ngài” để neo chú thích từ vựng vào ἀδελφοί.
