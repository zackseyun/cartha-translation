review_pass:
  verdict: revise
  source_fidelity: Bản dịch nhìn chung phản ánh đúng kết cấu thời gian đang tiếp diễn, lời dẫn chú ý ἰδού, vị trí “ở bên ngoài”, và ý định nói với Đức Giê-su. Tuy nhiên, “tìm cách” có thể hàm ý trở ngại/cố gắng vượt khó không được nêu rõ; “đang tìm cách nói với” gần hơn với ζητοῦντες ... λαλῆσαι. Dấu chú thích nên đặt sát cụm ἀδελφοί mà nó giải thích. “Đang đứng” diễn đạt rõ hơn trạng thái đang tiếp diễn của εἱστήκεισαν.
  naturalness: “Khi Ngài vẫn còn đang nói” hơi chồng lớp chỉ tiếp diễn trong tiếng Việt. “Khi Ngài còn đang nói” tự nhiên và vẫn truyền đạt ἔτι cùng kết cấu sở hữu cách tuyệt đối. “Kìa” phù hợp với sắc thái kể chuyện được đánh dấu của ἰδού.
  terminology: “Mẹ và các anh em trai của Ngài” phản ánh trực tiếp giống đực số nhiều của ἀδελφοί và không áp đặt một cách giải thích thần học về mối quan hệ gia đình. Chú thích giữ khả năng nghĩa rộng hơn mà không khẳng định đó là nghĩa của câu.
  issues:
