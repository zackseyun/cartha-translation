source:
  edition: SBLGNT
  text: Ἔτι ⸀δὲ αὐτοῦ λαλοῦντος τοῖς ὄχλοις ἰδοὺ ἡ μήτηρ καὶ οἱ ἀδελφοὶ αὐτοῦ εἱστήκεισαν ἔξω ζητοῦντες αὐτῷ λαλῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/046.yaml
  text: While he was still speaking to the crowds[a], behold, his mother and his brothers were standing outside, seeking to speak to him.
translation:
  language: vi
  text: Khi Ngài còn đang nói với đám đông, kìa, mẹ và các anh em trai của Ngài[a] đang đứng ở bên ngoài, tìm cách nói với Ngài.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hoặc “những người thân thuộc gần của Ngài,” nếu ἀδελφοί được hiểu theo nghĩa rộng hơn; từ Hy Lạp ở đây là giống đực số nhiều, nên chính văn dịch là “các anh em trai.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔτι δὲ αὐτοῦ λαλοῦντος
  choice: Khi Ngài vẫn còn đang nói
  rationale: Diễn đạt tự nhiên hành động đang tiếp diễn và đồng thời của kết cấu sở hữu cách tuyệt đối; δέ chỉ là chuyển tiếp nhẹ nên không cần dịch thành một liên từ tương phản rõ.
- source_word: τοῖς ὄχλοις
  choice: với đám đông
  rationale: Tiếng Việt thường dùng danh từ tập hợp số ít trong ngữ cảnh này; cách dịch vẫn thể hiện một nhóm đông người mà không gượng ép theo số nhiều Hy Lạp.
- source_word: ἰδοὺ
  choice: kìa
  rationale: Giữ chức năng thu hút sự chú ý và sắc thái sống động của lời kể bằng một từ hiện đại, dễ hiểu.
- source_word: ἡ μήτηρ
  choice: mẹ ... của Ngài
  rationale: Bổ sung quan hệ sở hữu theo ngữ cảnh, như tiếng Việt tự nhiên đòi hỏi.
- source_word: οἱ ἀδελφοὶ αὐτοῦ
  choice: các anh em trai của Ngài
  rationale: Phản ánh dạng giống đực số nhiều và nghĩa bề mặt của từ, đồng thời tránh quyết định quan hệ họ hàng chính xác vượt quá điều câu văn nói rõ.
- source_word: εἱστήκεισαν ἔξω
  choice: đứng ở bên ngoài
  rationale: Diễn đạt trạng thái kéo dài của hình thái quá khứ hoàn thành ἵστημι mà không thêm địa điểm như 'ngôi nhà', vốn không được nêu trong câu.
- source_word: ζητοῦντες αὐτῷ λαλῆσαι
  choice: tìm cách nói chuyện với Ngài
  rationale: Tự nhiên trong tiếng Việt và giữ ý định có mục đích của ζητέω cùng nội dung 'nói với Ngài'.
theological_decisions:
- issue: Quan hệ của οἱ ἀδελφοί với Chúa Giê-su
  choice: các anh em trai của Ngài
  alternative: các anh chị em của Ngài; những người bà con gần của Ngài
  rationale: Dạng Hy Lạp là giống đực số nhiều và trên bề mặt phù hợp nhất với 'anh em trai'. Bản dịch không dùng câu này để phân xử các quan điểm thần học về quan hệ chính xác của họ với Chúa Giê-su; chú thích giữ lại khả năng từ này được hiểu rộng hơn là thân thuộc gần.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” làm đại từ tôn kính chỉ Chúa Giê-su; “kìa” giữ nét kể chuyện nổi bật. Dấu chú thích được đặt ngay sau câu có cụm từ cần giải thích.
