source:
  edition: SBLGNT
  text: εἰ δὲ ἐν πνεύματι θεοῦ ἐγὼ ἐκβάλλω τὰ δαιμόνια, ἄρα ἔφθασεν ἐφ’ ὑμᾶς ἡ βασιλεία τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/028.yaml
  text: But if I cast out the demons by the Spirit of God[b][a], then the kingdom of God has come upon you.
translation:
  language: vi
  text: Nhưng nếu tôi nhờ Thần Khí của Đức Chúa Trời mà đuổi các quỷ[a], thì vương quốc Đức Chúa Trời đã đến với các ông[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “trong Thần Khí của Đức Chúa Trời.” Cụm từ Hy Lạp có thể được hiểu theo nghĩa “trong” hoặc theo nghĩa phương tiện hay tác nhân; ở đây bản dịch chính hiểu theo nghĩa phương tiện hay tác nhân.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “đã chạm tới các ông” hoặc “đã ập đến với các ông.” Động từ Hy Lạp nhấn mạnh rằng vương quốc Đức Chúa Trời đã tới nơi, thể hiện qua các việc Chúa Giê-su làm.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δὲ
  choice: Nhưng nếu
  rationale: Giữ sắc thái điều kiện cùng sự tương phản nhẹ của δέ, đồng thời tự nhiên trong mạch lập luận tiếng Việt.
- source_word: ἐν πνεύματι θεοῦ
  choice: nhờ Thần Khí của Đức Chúa Trời
  rationale: ἐν với cách ba ở đây có thể chỉ phương tiện hoặc tác nhân. “Nhờ” diễn đạt tự nhiên việc Đức Thánh Linh là tác nhân qua đó Chúa Giê-su đuổi quỷ, nhưng chú thích vẫn giữ khả năng dịch sát là “trong”.
- source_word: ἐγὼ
  choice: tôi
  rationale: Đại từ được nêu rõ để phản ánh sắc thái nhấn mạnh của ἐγώ trong lập luận.
- source_word: ἐκβάλλω
  choice: đuổi
  rationale: “Đuổi quỷ” là cách nói hiện đại, rõ nghĩa và quen thuộc trong tiếng Việt, truyền đạt hành động trục xuất.
- source_word: τὰ δαιμόνια
  choice: các quỷ
  rationale: Chỉ các hữu thể ma quỷ là đối tượng bị đuổi; “các quỷ” rõ ràng hơn cách diễn giải thành “tà linh”.
- source_word: ἄρα
  choice: thì
  rationale: Trong kết cấu “nếu… thì…”, từ này thể hiện tự nhiên kết luận suy ra từ điều kiện.
- source_word: ἔφθασεν
  choice: đã đến
  rationale: Diễn đạt việc vương quốc đã thực sự tới và có ý nghĩa hiện tại, không làm yếu thành chỉ “đến gần”.
- source_word: ἐφ’ ὑμᾶς
  choice: trên các ông
  rationale: Giữ hình ảnh và sức nặng của ἐπί với đối cách sau φθάνω; “các ông” phù hợp với nhóm người nghe trong văn cảnh.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: vương quốc Đức Chúa Trời
  rationale: Giữ cả ý niệm quyền trị vì lẫn vương quốc, tránh thu hẹp cụm từ chỉ còn nghĩa trừu tượng là sự cai trị.
theological_decisions:
- issue: Ý nghĩa của vương quốc Đức Chúa Trời trong quan hệ với việc Chúa Giê-su đuổi quỷ
  choice: Câu này trình bày việc Chúa Giê-su đuổi quỷ nhờ Thần Khí như bằng chứng rằng vương quốc Đức Chúa Trời đã thực sự đến với những người nghe.
  alternative: Vương quốc chỉ mới đến gần, hoặc câu này chỉ nói về sự hoàn tất trong tương lai.
  rationale: Động từ ἔφθασεν nhấn mạnh sự đến nơi, và lập luận dựa trên các việc đuổi quỷ đang diễn ra như biểu hiện hiện tại của quyền trị vì Đức Chúa Trời; bản dịch không phủ nhận chiều kích tương lai.
- issue: Sở chỉ của πνεύματι θεοῦ
  choice: Thần Khí của Đức Chúa Trời, được trình bày như tác nhân trong việc Chúa Giê-su đuổi quỷ.
  alternative: Chỉ là một sức mạnh thần linh phi ngôi vị.
  rationale: Cụm từ nguồn trực tiếp nói đến Thần Khí của Đức Chúa Trời; cách viết hoa và dùng “Thần Khí” giữ sở chỉ hữu ngôi mà không thêm nội dung ngoài câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Thần Khí” để phân biệt πνεῦμα trong sở chỉ thần linh, “Đức Chúa Trời” cho θεός, và “các ông” cho số nhiều ὑμᾶς trong lời trực tiếp với các đối thủ nam giới theo văn cảnh. Các dấu chú thích đều được đặt ngay sau cụm từ liên quan.
