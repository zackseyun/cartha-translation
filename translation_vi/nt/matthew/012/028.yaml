    rationale: Trong ngữ cảnh này, đối lập dịch thuật hữu ích là “trong Thần Khí” với cách hiểu phương tiện/tác nhân “nhờ/bởi Thần Khí”. “Phạm vi” không cần thiết và có thể làm chú thích kém chính xác, kém rõ ràng.
