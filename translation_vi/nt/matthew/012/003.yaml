  terminology: “Ngài,” “Các ông,” và “Đa-vít” phù hợp văn phong Kinh Thánh tiếng Việt hiện đại, trang trọng. “Những người đi cùng ông” là cách dịch rõ ràng cho οἱ μετ’ αὐτοῦ, không áp đặt rằng họ là một nhóm có chức danh cụ thể.
