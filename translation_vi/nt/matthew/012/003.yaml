  text: ὁ δὲ εἶπεν αὐτοῖς· Οὐκ ἀνέγνωτε τί ἐποίησεν Δαυὶδ ὅτε ⸀ἐπείνασεν καὶ οἱ μετ’ αὐτοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/003.yaml
  text: But he said to them[a], “Have you not read what David did when he was hungry, and those with him were hungry?”
translation:
  language: vi
  text: 'Nhưng Ngài nói với họ: “Các ông chưa đọc điều Đa-vít đã làm khi ông đói, cùng với những người đi cùng ông[a] sao?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể hiểu: “khi Đa-vít và những người đi cùng ông đều đói.” Trong tiếng Hy Lạp, động từ “đói” ở số ít và trực tiếp nói về Đa-vít, nhưng cụm “và những người đi cùng ông” có thể được hiểu là bao gồm họ trong tình trạng đói.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ
  choice: Nhưng Ngài
  rationale: δέ là từ nối nhẹ; “Nhưng” diễn tả tự nhiên lời đáp của Chúa Giê-su trước lời cáo buộc trong ngữ cảnh. Đại từ “Ngài” phù hợp với lối văn trang trọng khi nói về Chúa Giê-su.
- source_word: εἶπεν αὐτοῖς
  choice: nói với họ
  rationale: Chuyển tải trực tiếp động từ λέγω cùng đại từ ở cách dữ liệu, không thêm sắc thái giải thích.
- source_word: Οὐκ ἀνέγνωτε
  choice: Các ông chưa đọc ... sao?
  rationale: Câu hỏi tu từ này nhắc người nghe về điều họ đáng lẽ đã biết trong Kinh Thánh; cấu trúc “chưa ... sao?” tự nhiên trong tiếng Việt hiện đại.
- source_word: τί ἐποίησεν
  choice: điều ... đã làm
  rationale: ποιέω mang nghĩa lịch sử đơn giản là “làm”; “điều ... đã làm” vừa sát nghĩa vừa trôi chảy.
- source_word: Δαυὶδ
  choice: Đa-vít
  rationale: Dùng dạng tên riêng quen thuộc trong Kinh Thánh tiếng Việt.
- source_word: ὅτε ἐπείνασεν
  choice: khi ông ... bị đói
  rationale: πεινάω nghĩa là ở trong tình trạng đói. “Bị đói” là cách diễn đạt tự nhiên, không nhấn quá mức ý bắt đầu trở nên đói.
- source_word: καὶ οἱ μετ’ αὐτοῦ
  choice: và những người đi cùng
  rationale: Cụm danh từ có mạo từ mang nghĩa “những người ở cùng ông”; “những người đi cùng” rõ ràng và ít diễn giải hơn “các bạn đồng hành”.
theological_decisions:
- issue: Phạm vi của tình trạng đói trong ὅτε ἐπείνασεν καὶ οἱ μετ’ αὐτοῦ
  choice: Diễn đạt trong chính văn rằng cả Đa-vít lẫn những người đi cùng đều bị đói, đồng thời ghi chú dạng số ít của động từ Hy Lạp.
  alternative: “khi ông bị đói, cùng với những người đi theo ông” hoặc chỉ nói rõ Đa-vít bị đói.
  rationale: Động từ ἐπείνασεν ở số ít trực tiếp quy chiếu đến Đa-vít, nhưng cụm καὶ οἱ μετ’ αὐτοῦ có thể được hiểu là thêm những người đi cùng vào chủ thể của tình trạng đói. Chính văn tiếng Việt cần hoàn chỉnh và tự nhiên, còn chú thích bảo tồn nét mơ hồ cú pháp.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “các ông” cho những người Pha-ri-si trong cuộc đối thoại, “Ngài” cho Chúa Giê-su, và giữ câu hỏi tu từ tự nhiên trong tiếng Việt.
