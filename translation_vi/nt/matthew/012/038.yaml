  to: 'Bấy giờ, một số kinh sư và người Pha-ri-si đáp lại Người: “Thưa Thầy, chúng tôi muốn thấy một dấu hiệu[a] từ Thầy.”'
  rationale: Bản sửa chỉ phục hồi đối tượng được nêu rõ bởi αὐτῷ qua cụm “đáp lại Người” và chỉnh câu chữ của chú thích. “Dấu hiệu” được giữ trong chính văn để bảo toàn phạm vi nghĩa của σημεῖον; “dấu lạ” chỉ được nêu như một khả năng từ vựng trong chú thích.
