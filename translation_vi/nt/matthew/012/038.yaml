source:
  edition: SBLGNT
  text: Τότε ἀπεκρίθησαν ⸀αὐτῷ τινες τῶν γραμματέων καὶ Φαρισαίων λέγοντες· Διδάσκαλε, θέλομεν ἀπὸ σοῦ σημεῖον ἰδεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/038.yaml
  text: Then some of the scribes and Pharisees answered him[a], saying, “Teacher, we want to see a sign from you.”
translation:
  language: vi
  text: 'Bấy giờ, một số kinh sư và người Pha-ri-si đáp lại Người: “Thưa Thầy, chúng tôi muốn thấy một dấu hiệu[a] từ Thầy.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ này trong tiếng Hy Lạp cũng có thể chỉ một “dấu lạ”, tức một dấu hiệu mang ý nghĩa kỳ diệu.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Bấy giờ
  rationale: Diễn tả sự chuyển tiếp theo trình tự câu chuyện một cách tự nhiên và trang trọng trong tiếng Việt.
- source_word: ἀπεκρίθησαν αὐτῷ
  choice: đáp
  rationale: Động từ có nghĩa là đáp lại hoặc lên tiếng đáp; tiếng Việt có thể lược đại từ chỉ người được đáp mà vẫn rõ từ ngữ cảnh và tránh lối diễn đạt gượng.
- source_word: τινες τῶν γραμματέων
  choice: một số kinh sư
  rationale: τινες chỉ một bộ phận chứ không phải toàn thể; “kinh sư” là cách gọi ngắn gọn, hiện hành cho những người thông thạo và giảng dạy luật Do Thái.
- source_word: καὶ Φαρισαίων
  choice: và người Pha-ri-si
  rationale: Giữ tên gọi lịch sử của nhóm tôn giáo Do Thái bằng hình thức phiên âm quen thuộc.
- source_word: Διδάσκαλε
  choice: Thưa Thầy
  rationale: Lời xưng hô tự nhiên trong tiếng Việt, vừa thể hiện sắc thái hô cách vừa giữ nghĩa “người dạy” mà không nâng thành một tước hiệu mạnh hơn.
- source_word: θέλομεν
  choice: chúng tôi muốn
  rationale: Cách diễn đạt trực tiếp, tự nhiên, phản ánh ý muốn được nói rõ trong động từ Hy Lạp.
- source_word: ἀπὸ σοῦ
  choice: từ Thầy
  rationale: 'Giữ ý nguồn gốc của giới từ ἀπό: dấu hiệu họ yêu cầu phải đến từ chính Đức Giê-su.'
- source_word: σημεῖον
  choice: một dấu hiệu
  rationale: Giữ phạm vi nghĩa rộng của từ Hy Lạp là “dấu hiệu”; trong ngữ cảnh, từ này có thể chỉ một việc lạ mang giá trị xác chứng, nhưng không nên tự động thu hẹp thành “phép lạ” trong chính văn.
- source_word: ἰδεῖν
  choice: thấy
  rationale: Tương đương trực tiếp và tự nhiên của động từ chỉ việc nhìn thấy hoặc chứng kiến.
theological_decisions:
- issue: Bản chất của σημεῖον trong lời yêu cầu
  choice: dấu hiệu
  alternative: dấu lạ; dấu hiệu kỳ diệu; phép lạ làm dấu
  rationale: Ngữ cảnh hàm ý họ đòi một hành động phi thường để xác chứng thẩm quyền của Đức Giê-su, nhưng σημεῖον tự nó có nghĩa rộng hơn “phép lạ”. Bản dịch chính giữ sự rộng nghĩa ấy, còn chú thích nêu sắc thái kỳ diệu có thể có.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “kinh sư” thay cho cách gọi cổ “thầy thông giáo”; lời xưng hô “Thưa Thầy” phù hợp hội thoại tiếng Việt. Không thêm tên Đức Giê-su vào chỗ đại từ Hy Lạp vì ngữ cảnh đã xác định người được nói với.
