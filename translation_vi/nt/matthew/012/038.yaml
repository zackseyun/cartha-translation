  - severity: low
    issue: Cách mở đầu chú thích “Từ Hy Lạp” chưa chuẩn thành ngữ.
    rationale: Cần nói “Từ này trong tiếng Hy Lạp” để chỉ từ σημεῖον đang được chú thích, thay vì nói chung về một “từ Hy Lạp”.
