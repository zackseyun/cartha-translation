  terminology: “Pha-ri-si,” “Ngài,” và “tiêu diệt” phù hợp với văn phong Kinh Thánh trang trọng và giữ được độ rộng của ἀπολέσωσιν. Trong chú thích, “xử tử” có thể gợi một án tử hình chính thức, điều nguyên văn không xác định; nên chỉ nêu lựa chọn “giết Ngài.”
