  text: ⸂ἐξελθόντες δὲ οἱ Φαρισαῖοι συμβούλιον ἔλαβον κατ’ αὐτοῦ⸃ ὅπως αὐτὸν ἀπολέσωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/014.yaml
  text: But the Pharisees went out and conspired against him, how they might destroy him.
translation:
  language: vi
  text: Nhưng người Pha-ri-si đi ra và bàn mưu chống lại Ngài, để tìm cách tiêu diệt Ngài.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “giết Ngài.” Từ Hy Lạp ở đây có nghĩa là “tiêu diệt” và trong ngữ cảnh này có thể bao gồm ý định giết chết.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθόντες
  choice: đi ra
  rationale: Phân từ bất định quá khứ diễn tả hành động xảy ra trước hoặc cùng chuỗi với việc bàn mưu; “đi ra” tự nhiên và vẫn giữ rõ hành động rời khỏi nơi đó.
- source_word: δὲ
  choice: Nhưng
  rationale: Liên từ đánh dấu bước chuyển có tính tương phản giữa hành động của Đức Chúa Jêsus và phản ứng thù địch của những người Pha-ri-si.
- source_word: οἱ Φαρισαῖοι
  choice: những người Pha-ri-si
  rationale: Phiên âm tên nhóm Do Thái này theo cách quen thuộc, đồng thời dùng “những người” để câu văn tiếng Việt tự nhiên.
- source_word: συμβούλιον ἔλαβον
  choice: bàn mưu
  rationale: Thành ngữ có nghĩa đen là cùng nhau bàn bạc; trong ngữ cảnh thù địch và với mệnh đề mục đích theo sau, “bàn mưu” vừa tự nhiên vừa phản ánh ý định có chủ tâm mà không diễn giải quá mức.
- source_word: κατ’ αὐτοῦ
  choice: chống lại Ngài
  rationale: κατά với sở hữu cách mang nghĩa đối nghịch trong ngữ cảnh này; “chống lại” giữ rõ hướng thù địch của việc bàn mưu.
- source_word: ὅπως
  choice: tìm cách
  rationale: Liên từ giới thiệu nội dung hoặc mục đích của việc bàn mưu. Cấu trúc “bàn mưu… tìm cách…” diễn đạt tự nhiên sắc thái họ đang tính phương cách thực hiện.
- source_word: ἀπολέσωσιν
  choice: tiêu diệt Ngài
  rationale: ἀπόλλυμι có phạm vi nghĩa từ hủy diệt đến giết chết. “Tiêu diệt” giữ được cách nói rộng của nguyên văn, trong khi ngữ cảnh vẫn cho thấy ý định có thể dẫn đến cái chết.
theological_decisions:
- issue: Mức độ cụ thể khi dịch ἀπολέσωσιν
  choice: tiêu diệt Ngài
  alternative: giết Ngài; xử tử Ngài
  rationale: Ngữ cảnh hàm ý ý định gây chết người, nhưng động từ Hy Lạp rộng hơn một động từ chỉ riêng hành vi giết. Bản chính giữ cách diễn đạt rộng, còn chú thích nêu các cách hiểu cụ thể hơn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Bàn mưu” giữ gần thành ngữ Hy Lạp hơn “âm mưu” nhưng vẫn truyền đạt rõ sắc thái thù địch nhờ “chống lại” và mệnh đề theo sau. Đại từ “Ngài” phù hợp lối xưng hô trang trọng, phổ biến dành cho Đức Chúa Jêsus trong tiếng Việt.
