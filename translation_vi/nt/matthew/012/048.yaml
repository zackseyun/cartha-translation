revisions:
- from: 'Nhưng Ngài đáp lời người đang nói với Ngài[a]: “Ai là mẹ tôi, và ai là anh em tôi?”'
  to: 'Nhưng Ngài trả lời người đang nói với Ngài[a]: “Ai là mẹ tôi, và ai là anh em tôi?”'
  rationale: Chỉ thay “đáp lời” bằng “trả lời” để câu tiếng Việt tự nhiên hơn khi có bổ ngữ chỉ người nhận lời đáp. Bản dịch vẫn giữ người đang nói với Chúa Giê-su theo phân từ hiện tại, hai câu hỏi trực tiếp, và thuật ngữ “anh em”. Chú thích vẫn ghi nhận lối diễn đạt đầy đủ “đáp và nói” của tiếng Hy Lạp.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T02:47:08Z'
review_pass:
  verdict: revise
  source_fidelity: Bản dịch giữ đúng bước chuyển của δέ, câu hỏi tu từ, và phân biệt số ít/số nhiều trong “mẹ tôi” và “anh em tôi”. Tuy nhiên, “đáp lời người” không phải kết hợp tự nhiên khi người nhận lời đáp được nêu trực tiếp; “trả lời người” diễn đạt đúng quan hệ cách (dative) của τῷ λέγοντι αὐτῷ hơn.
  naturalness: Nên dùng “trả lời người đang nói với Ngài” thay cho “đáp lời người đang nói với Ngài”. Cách này tự nhiên, trang trọng vừa phải trong tiếng Việt hiện đại, và không thêm diễn giải rằng người ấy chỉ là người báo tin.
  terminology: “Ngài” trong lời kể và “tôi” trong lời nói trực tiếp nhất quán với văn phong bản thảo. “Anh em tôi” bảo toàn ἀδελφοί là số nhiều giống đực trong bối cảnh thân thuộc; không nên đổi thành “anh chị em” hoặc “người thân”.
  issues:
  - severity: low
    issue: Cụm “đáp lời người đang nói với Ngài” chưa tự nhiên.
    rationale: Trong tiếng Việt, “đáp lời” thường dùng tuyệt đối hoặc với nội dung lời nói; khi nêu người được đáp, “trả lời người...” hoặc “đáp lại người...” tự nhiên hơn. Sửa thành “trả lời” không thay đổi nghĩa của ἀποκριθεὶς εἶπεν.
  revised_text: 'Nhưng Ngài trả lời người đang nói với Ngài[a]: “Ai là mẹ tôi, và ai là anh em tôi?”'
