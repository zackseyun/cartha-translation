source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν τῷ ⸀λέγοντι αὐτῷ· Τίς ἐστιν ἡ μήτηρ μου, καὶ τίνες εἰσὶν οἱ ἀδελφοί μου;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/048.yaml
  text: But he answered the one speaking to him[a], “Who is my mother, and who are my brothers?”
translation:
  language: vi
  text: 'Nhưng Ngài trả lời người đang nói với Ngài[a]: “Ai là mẹ tôi, và ai là anh em tôi?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát hơn: “Nhưng Ngài đáp và nói với người đang nói với Ngài.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ ἀποκριθεὶς εἶπεν
  choice: Nhưng Ngài đáp lời
  rationale: Cụm phân từ ἀποκριθεὶς đi với εἶπεν là lối nói Hy Lạp chịu ảnh hưởng Sê-mít, theo nghĩa tự nhiên là “đáp và nói”. “Đáp lời” truyền đạt đầy đủ ý mà không tạo sự lặp lại nặng nề; “Nhưng” thể hiện bước chuyển do δέ đánh dấu.
- source_word: τῷ λέγοντι αὐτῷ
  choice: người đang nói với Ngài
  rationale: Phân từ hiện tại được dùng như danh từ, chỉ người đang nói với Chúa Giê-su. “Đang nói” giữ được sắc thái hành động đang diễn ra mà không diễn giải thành “người báo cho Ngài”.
- source_word: Τίς ἐστιν ἡ μήτηρ μου
  choice: Ai là mẹ tôi
  rationale: Τίς hỏi về căn tính; cách dịch trực tiếp này tự nhiên trong tiếng Việt và giữ nguyên hình thức câu hỏi tu từ.
- source_word: καὶ τίνες εἰσὶν οἱ ἀδελφοί μου
  choice: và ai là anh em tôi
  rationale: Τίνες là dạng số nhiều nhưng tiếng Việt không biến đổi đại từ nghi vấn theo số. “Anh em” là thuật ngữ thân tộc tự nhiên, phù hợp với danh từ giống đực số nhiều ἀδελφοί trong ngữ cảnh gia đình này.
theological_decisions:
- issue: Nguy cơ làm nhẹ hoặc giải thích trước câu hỏi tu từ của Chúa Giê-su về căn tính gia đình
  choice: Giữ nguyên hai câu hỏi trực tiếp, không thêm lời giải thích
  alternative: “Ai được kể là mẹ tôi, và ai được kể là anh em tôi?”
  rationale: Mạch văn tiếp theo sẽ trình bày ý nghĩa rộng hơn về quan hệ thân thuộc. Câu này không nên đưa trước lời giải thích ấy, nhờ đó vẫn giữ được sức căng của lời hỏi.
- issue: Cách dịch ἀδελφοί theo giới tính
  choice: anh em
  alternative: anh chị em; người thân
  rationale: Trong cảnh kể này, từ Hy Lạp là danh từ giống đực số nhiều chỉ những người anh em trong gia đình của Chúa Giê-su. “Anh em” giữ sát thuật ngữ thân tộc, không mở rộng thành một nhóm hỗn hợp hoặc khái niệm chung hơn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Ngài” được dùng để chỉ Chúa Giê-su trong lời kể; trong lời nói trực tiếp, “tôi” tạo câu hỏi tự nhiên mà không thêm sắc thái diễn giải. Dấu [a] được đặt ngay sau cụm từ mà chú thích giải thích.
