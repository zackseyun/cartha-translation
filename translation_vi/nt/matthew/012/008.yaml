  text: κύριος γάρ ἐστιν τοῦ σαββάτου ὁ υἱὸς τοῦ ἀνθρώπου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/008.yaml
  text: For the Son of Man is Lord of the Sabbath[a][b].
translation:
  language: vi
  text: Vì Con Người là Chúa của ngày Sa-bát[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Con Người là chủ tể của ngày Sa-bát.”'
    reason: lexical_alternative
  - marker: b
    text: “Con Người” là danh xưng đặc trưng Chúa Giê-su dùng về chính mình trong các sách Tin Mừng; cụm từ này cũng có thể được hiểu theo nghĩa khái quát hơn là “con người”, nhưng cách đó làm giảm âm hưởng tước hiệu có thể được hàm ý ở đây.
    reason: alternative_reading
lexical_decisions:
- source_word: γάρ
  choice: Vì
  rationale: Giữ chức năng giải thích và lập luận của liên từ, nối lời khẳng định này với phần ngay trước đó.
- source_word: κύριος
  choice: Chúa
  rationale: Diễn đạt thẩm quyền mạnh mẽ và giữ sức nặng của tước hiệu trong ngữ cảnh nói về Đấng Christ; không làm nhẹ thành một từ chỉ người quản lý thông thường.
- source_word: τοῦ σαββάτου
  choice: của ngày Sa-bát
  rationale: Phản ánh trực tiếp sở hữu cách đi sau κύριος, đồng thời dùng cách gọi quen thuộc trong tiếng Việt cho ngày thánh của người Do Thái.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Con Người
  rationale: Giữ nguyên danh xưng đặc trưng Chúa Giê-su dùng về chính mình trong các sách Tin Mừng, cùng âm hưởng liên văn bản có thể có, thay vì giản lược thành nghĩa chung là một con người.
- source_word: ἐστιν
  choice: là
  rationale: Chuyển tải trực tiếp hệ từ ở thì hiện tại, không cần diễn giải thêm.
theological_decisions:
- issue: Sức nặng Cơ Đốc luận của κύριος ... τοῦ σαββάτου
  choice: Con Người là Chúa của ngày Sa-bát
  alternative: Con Người là chủ trên ngày Sa-bát
  rationale: Bản dịch giữ lời tuyên bố mạnh mẽ về thẩm quyền của Con Người đối với ngày Sa-bát mà không mở rộng nội dung vượt quá câu Hy Lạp.
- issue: Cách hiểu ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Xem đây là danh xưng “Con Người”
  alternative: Đấng thuộc loài người
  rationale: Danh xưng truyền thống bảo toàn sự hàm hồ và sức gợi liên văn bản của cụm từ trong các sách Tin Mừng, thay vì thu hẹp nó thành một phát biểu đơn thuần về nhân loại nói chung.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ “Con Người” như một danh xưng, viết hoa theo thông lệ tiếng Việt; phiên âm “Sa-bát” để chỉ ngày thánh của người Do Thái.
