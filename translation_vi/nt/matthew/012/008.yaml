    rationale: “Con người” bảo toàn khả năng hiểu theo nghĩa chung mà không thêm sắc thái tôn xưng “Đấng,” vốn có thể làm sai lệch đối lập giữa cách đọc tước hiệu và cách đọc khái quát.
