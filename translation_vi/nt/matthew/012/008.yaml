  source_fidelity: Bản văn chính truyền đạt đúng lực giải thích của γάρ, danh xưng ὁ υἱὸς τοῦ ἀνθρώπου, và thẩm quyền hàm trong κύριος τοῦ σαββάτου. “Chúa của ngày Sa-bát” bám sát cấu trúc Hy Lạp và không thêm diễn giải.
  naturalness: Câu chính tự nhiên, trang trọng, và phù hợp tiếng Việt hiện đại. Tuy nhiên, chú thích a dùng “chủ trên ngày Sa-bát” không thật tự nhiên; chú thích b có cách diễn đạt “đấng thuộc loài người” gượng và không phải lựa chọn khái quát tương đương sát nhất với cụm Hy Lạp.
  terminology: “Con Người,” “Chúa,” và “ngày Sa-bát” nhất quán với cách dùng Kinh Thánh tiếng Việt và bảo toàn trọng lượng tước hiệu. Nên sửa lựa chọn thay thế trong chú thích b thành “con người” để phản ánh khả năng đọc khái quát mà không gán một sắc thái tước hiệu không có trong cách diễn đạt đó.
