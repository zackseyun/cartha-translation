  text: ἐκ γὰρ τῶν λόγων σου δικαιωθήσῃ, καὶ ἐκ τῶν λόγων σου καταδικασθήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/037.yaml
  text: For by your words you will be justified[a], and by your words you will be condemned.
translation:
  language: vi
  text: Vì anh em sẽ được tuyên là đúng[a] căn cứ vào lời nói của mình, và sẽ bị kết án căn cứ vào lời nói của mình.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “được minh oan” hoặc “được tuyên trắng án.” Động từ Hy Lạp có thể mang nghĩa pháp lý: được tuyên là đúng.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ
  choice: dựa vào
  rationale: Trong cả hai vế, ἐκ với sở hữu cách chỉ căn cứ hoặc bằng chứng của phán quyết. “Dựa vào” diễn đạt tự nhiên ý nghĩa pháp lý này, rõ hơn cách dịch sát chữ “từ”.
- source_word: γάρ
  choice: Vì
  rationale: γάρ nêu lý do giải thích cho lời cảnh báo ngay trước đó; “Vì” giữ đúng chức năng liên kết và quan hệ lập luận.
- source_word: λόγων
  choice: lời nói
  rationale: Dạng số nhiều của λόγος ở đây chỉ những điều một người nói ra. “Lời nói” tự nhiên trong tiếng Việt và giữ được phép lặp song song của nguyên văn.
- source_word: σου
  choice: của mình
  rationale: Đại từ sở hữu số ít ngôi thứ hai bổ nghĩa cho “lời nói”. Trong lời trực tiếp hướng đến người nghe nói chung, “của mình” tự nhiên hơn việc lặp “của anh em” và vẫn quy lời nói về chính mỗi người.
- source_word: δικαιωθήσῃ
  choice: anh em sẽ được tuyên là đúng
  rationale: Thể tương lai bị động của δικαιόω mang nghĩa pháp đình trong thế đối lập với καταδικασθήσῃ. “Được tuyên là đúng” bảo toàn hành động tuyên quyết, không hàm ý rằng lời nói tự nó biến đổi phẩm chất đạo đức của người ấy.
- source_word: καταδικασθήσῃ
  choice: anh em sẽ bị kết án
  rationale: Động từ tương lai bị động này có nghĩa pháp lý và đối lập trực tiếp với δικαιωθήσῃ. “Bị kết án” là cách diễn đạt rõ ràng, trang trọng và tự nhiên.
theological_decisions:
- issue: Nghĩa pháp đình của δικαιόω trong mối liên hệ giữa lời nói và sự phán xét
  choice: được tuyên là đúng
  alternative: được xưng công chính; được minh oan; được tuyên trắng án
  rationale: Sự đối xứng với “bị kết án” cho thấy ngữ cảnh pháp đình. Cách dịch đã chọn giữ ý được phán quyết là đúng mà không giải quyết vượt quá câu này mối quan hệ thần học giữa lời nói, bằng chứng và sự xưng công chính.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh em” để chỉ ngôi thứ hai số ít mang tính đại diện trong lời dạy hướng đến người nghe; phép lặp “dựa vào lời nói của mình” giữ nhịp đối xứng của nguyên văn.
