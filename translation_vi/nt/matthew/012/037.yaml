review_pass:
  verdict: revise
  source_fidelity: Bản nháp giữ được cấu trúc nhân quả của γάρ, tính song hành của hai mệnh đề, và sắc thái pháp đình của δικαιωθήσῃ / καταδικασθήσῃ. Tuy nhiên, cụm đầu câu “dựa vào lời nói...” có thể được hiểu là người nghe tự dựa vào lời nói mình, thay vì phán quyết được đưa ra căn cứ vào lời nói ấy. Chuyển cụm này về sau các động từ bị động làm rõ quan hệ căn cứ phán xét của ἐκ mà không thêm ý.
  naturalness: “Anh em” là cách xưng hô Kinh Thánh hiện đại tự nhiên đối với một cử tọa; “của mình” có giá trị phân phối cho từng người. Cách đặt “căn cứ vào lời nói của mình” sau “được tuyên là đúng/bị kết án” rõ và tự nhiên hơn. Cần chỉnh câu chân chú “được tuyên đứng về phía đúng,” vốn không tự nhiên trong tiếng Việt.
  terminology: “Được tuyên là đúng” và “bị kết án” bảo toàn đối lập pháp đình, đồng thời không ép δικαιόω thành một công thức giáo lý đầy đủ. “Được minh oan” và “được tuyên trắng án” nên chỉ để ở chú thích như những phương án gần nghĩa, vì mỗi cách có những hàm ý hẹp hơn.
  issues:
  - severity: medium
    issue: Cụm “dựa vào lời nói của mình” ở đầu mỗi mệnh đề có thể gán hành động “dựa vào” cho “anh em.”
    rationale: Trong nguyên ngữ, ἐκ τῶν λόγων σου nêu căn cứ/bằng chứng của phán quyết bị động, không nói người nghe nương cậy vào lời nói của họ. Đặt rõ là “căn cứ vào” sau động từ phán quyết loại bỏ cách hiểu lệch này.
  - severity: low
    issue: 'Câu cuối của chú thích hiện hành không tự nhiên: “được tuyên đứng về phía đúng.”'
    rationale: Nên dùng “được tuyên là đúng” để diễn tả gọn và chuẩn sắc thái pháp đình của δικαιόω.
