revisions:
- from: Vì dựa vào lời nói của mình, anh em sẽ được tuyên là đúng[a], và dựa vào lời nói của mình, anh em sẽ bị kết án.
  to: Vì anh em sẽ được tuyên là đúng[a] căn cứ vào lời nói của mình, và sẽ bị kết án căn cứ vào lời nói của mình.
  rationale: Bản sửa chỉ làm rõ rằng lời nói là căn cứ cho phán quyết, phù hợp chức năng của ἐκ trong cả hai vế. Đại từ “anh em” được giữ theo lối xưng hô hiện đại với cử tọa, còn “của mình” vẫn quy lời nói về từng người. Chú thích được chỉnh cho tự nhiên và không mở rộng nghĩa thần học.
