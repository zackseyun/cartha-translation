id: MAT.12.7
reference: Matthew 12:7
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εἰ δὲ ἐγνώκειτε τί ἐστιν· Ἔλεος θέλω καὶ οὐ θυσίαν, οὐκ ἂν κατεδικάσατε τοὺς ἀναιτίους.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/007.yaml
  text: But if you had known what this means[b][a], ‘I desire mercy and not sacrifice,’ you would not have condemned the guiltless.
translation:
  language: vi
  text: 'Nhưng nếu các ông đã hiểu lời này có nghĩa là gì: “Ta muốn lòng thương xót, chứ không phải tế lễ,”[b] thì các ông đã không kết án những người vô tội.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “những người không có lỗi.”
    reason: lexical_alternative
  - marker: b
    text: Chúa Giê-su trích Ô-sê 6:6.
    reason: cross_reference
lexical_decisions:
- source_word: ἐγνώκειτε
  choice: hiểu
  rationale: Trong điều kiện trái với thực tế, động từ nói đến việc đáng lẽ họ đã hiểu lời Kinh Thánh; tiếng Việt diễn đạt tự nhiên bằng “nếu ... hiểu” kết hợp với mệnh đề kết quả “đã không...”.
- source_word: τί ἐστιν
  choice: câu này có nghĩa gì
  rationale: Cách nói tự nhiên trong tiếng Việt khi giới thiệu và giải thích ý nghĩa của một câu Kinh Thánh được trích dẫn.
- source_word: Ἔλεος
  choice: lòng thương xót
  rationale: Diễn đạt ἔλεος rõ ràng, trang trọng và tự nhiên, giữ trọng tâm vào sự thương xót mà không mở rộng quá mức sang một khái niệm thần học riêng.
- source_word: θέλω
  choice: Ta muốn
  rationale: “Muốn” trực tiếp và tự nhiên trong tiếng Việt hiện đại; đại từ “Ta” phù hợp với lời Đức Chúa Trời trong trích dẫn tiên tri mà không làm thay đổi lực nghĩa của động từ.
- source_word: θυσίαν
  choice: tế lễ
  rationale: Thuật ngữ quen thuộc chỉ lễ vật hay hành vi hiến tế trong bối cảnh thờ phượng, đồng thời giữ dạng số ít và sự tương phản súc tích của nguyên văn.
- source_word: κατεδικάσατε
  choice: đã không kết án
  rationale: Kết hợp với điều kiện “nếu”, cách diễn đạt này chuyển tải kết quả trái với thực tế và giữ sắc thái tư pháp của καταδικάζω.
- source_word: ἀναιτίους
  choice: những người vô tội
  rationale: “Vô tội” giữ sắc thái pháp lý và tạo sự đối ứng tự nhiên với “kết án”; “những người” làm rõ dạng số nhiều chỉ người.
theological_decisions:
- issue: Cách dịch lời trích Ô-sê 6:6 để giữ sự ưu tiên mang tính tiên tri mà không khẳng định rằng mọi tế lễ tự thân đều không hợp lệ
  choice: Ta muốn lòng thương xót, chứ không phải tế lễ
  alternative: Ta muốn lòng thương xót hơn là tế lễ
  rationale: Nguyên văn Hy Lạp dùng καὶ οὐ, tạo sự tương phản sắc nét “và không/phải ... không phải”. Bản dịch giữ nguyên lực đối lập trong lập luận của Chúa Giê-su, không tự ý làm mềm thành phép so sánh “hơn là”, đồng thời cũng không thêm lời giải thích rằng tế lễ bị bãi bỏ hoàn toàn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “các ông” cho đối tượng số nhiều trong lời quở trách, “Ta” trong lời Đức Chúa Trời được trích dẫn. Các dấu chú thích được đặt ngay sau phần văn bản liên quan.
