  source_fidelity: Bản dịch truyền đạt đúng cấu trúc điều kiện phản thực và ý pháp lý của “kết án ... vô tội”. Tuy nhiên, ἐγνώκειτε là dạng quá khứ hoàn thành trong mệnh đề điều kiện; thêm “đã” giúp biểu đạt rõ việc lẽ ra phải được hiểu từ trước. Chuyển neo chú thích trích dẫn đến ngay sau lời trích cũng phản ánh đúng phạm vi của chú thích.
  naturalness: Văn phong tự nhiên, trang trọng và phù hợp tiếng Việt hiện đại. “Lời này có nghĩa là gì” tự nhiên hơn “câu này có nghĩa gì” trong ngữ cảnh một lời Kinh Thánh được giải nghĩa.
  terminology: “Lòng thương xót,” “tế lễ,” “kết án,” và “vô tội” đều phù hợp với sắc thái của ἔλεος, θυσία, καταδικάζω và ἀναίτιος. “Ta” trong lời trích có sắc thái tiên tri phù hợp.
