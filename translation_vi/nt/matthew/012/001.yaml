  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἐν ἐκείνῳ τῷ καιρῷ ἐπορεύθη ὁ Ἰησοῦς τοῖς σάββασιν διὰ τῶν σπορίμων· οἱ δὲ μαθηταὶ αὐτοῦ ἐπείνασαν καὶ ἤρξαντο τίλλειν στάχυας καὶ ἐσθίειν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/001.yaml
  text: At that time Jesus went through the grainfields on the Sabbath[a], and his disciples became hungry and began to pluck heads of grain and eat.
translation:
  language: vi
  text: Lúc ấy, vào ngày Sa-bát[a], Đức Giê-su đi qua những cánh đồng ngũ cốc. Các môn đồ của ngài đói rồi bắt đầu ngắt những bông ngũ cốc mà ăn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tiếng Hy Lạp dùng hình thức số nhiều “các ngày Sa-bát”, một lối nói có nghĩa là “ngày Sa-bát”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν ἐκείνῳ τῷ καιρῷ
  choice: Lúc ấy
  rationale: Diễn đạt tự nhiên dấu mốc thời gian trong lời kể, không khiến người đọc hiểu là giờ giấc chính xác.
- source_word: ἐπορεύθη
  choice: đi
  rationale: Động từ chỉ việc đi/di chuyển; cách dịch đơn giản phù hợp ngữ cảnh kể chuyện.
- source_word: τοῖς σάββασιν
  choice: vào ngày Sa-bát
  rationale: Dù tiếng Hy Lạp dùng hình thức số nhiều, đây là lối nói thông dụng chỉ ngày Sa-bát; số ít tự nhiên và đúng nghĩa trong tiếng Việt.
- source_word: διὰ τῶν σπορίμων
  choice: đi qua những cánh đồng lúa
  rationale: σπόριμος chỉ ruộng đã gieo trồng, đặc biệt là đồng ngũ cốc; “cánh đồng lúa” rõ ràng, tự nhiên với độc giả Việt Nam mà không xác định loại ngũ cốc.
- source_word: οἱ δὲ μαθηταὶ αὐτοῦ
  choice: Các môn đồ của ngài
  rationale: δέ ở đây chủ yếu nối tiếp lời kể, nên không cần dịch bằng một liên từ tương phản như “nhưng”.
- source_word: ἐπείνασαν
  choice: thấy đói
  rationale: Truyền đạt tự nhiên sự phát sinh cơn đói trong tiếng Việt, thay vì chỉ mô tả một trạng thái tĩnh.
- source_word: ἤρξαντο
  choice: bắt đầu
  rationale: Giữ rõ ý khởi đầu hành động của ἄρχομαι kết hợp với động từ nguyên mẫu.
- source_word: τίλλειν στάχυας
  choice: ngắt bông lúa
  rationale: τίλλω là ngắt hoặc bứt bằng tay, còn στάχυς là bông/gié ngũ cốc; “ngắt bông lúa” là cách nói gọn và dễ hiểu.
- source_word: καὶ ἐσθίειν
  choice: mà ăn
  rationale: 'Diễn đạt tự nhiên chuỗi hành động trong tiếng Việt: họ ngắt bông lúa để ăn ngay.'
theological_decisions:
- issue: Cách dịch σάββασιν
  choice: vào ngày Sa-bát
  alternative: vào các ngày Sa-bát
  rationale: Hình thức số nhiều trong tiếng Hy Lạp được dùng theo thành ngữ để chỉ ngày Sa-bát trong sự việc này; dịch số ít tránh làm người đọc tưởng câu nói đến nhiều ngày khác nhau.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Đức Giê-su”, “môn đồ”, “ngài” và “Sa-bát” theo lối dùng Kinh Thánh phổ biến; cấu trúc được điều chỉnh tự nhiên cho lời kể tiếng Việt.
