source:
  edition: SBLGNT
  text: πόσῳ οὖν διαφέρει ἄνθρωπος προβάτου. ὥστε ἔξεστιν τοῖς σάββασιν καλῶς ποιεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/012.yaml
  text: How much more valuable[a], then, is a man than a sheep! So it is lawful to do good on the Sabbaths.
translation:
  language: vi
  text: Vậy thì, một người có giá trị hơn một con cừu biết bao! Vì thế, được phép làm điều lành vào các ngày Sa-bát[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Có thể dịch tự nhiên hơn: “vào ngày Sa-bát.” Tiếng Hy Lạp dùng số nhiều “vào các ngày Sa-bát,” một thành ngữ thông dụng chỉ việc tuân giữ ngày Sa-bát.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πόσῳ
  choice: biết bao
  rationale: 'Kết hợp với ý so sánh của διαφέρει để diễn đạt tự nhiên lập luận từ điều nhỏ đến điều lớn: “quý hơn… biết bao”.'
- source_word: οὖν
  choice: vậy thì
  rationale: Giữ quan hệ suy luận với ví dụ cứu một con chiên ngay trước đó, đồng thời phù hợp với câu hỏi tu từ.
- source_word: διαφέρει
  choice: quý hơn
  rationale: Trong ngữ cảnh này, động từ nói đến giá trị vượt trội chứ không chỉ sự khác biệt.
- source_word: ἄνθρωπος
  choice: một con người
  rationale: Danh từ chỉ con người nói chung, ở số ít và mang tính đại diện; cách dịch này tự nhiên trong tiếng Việt và không thu hẹp nghĩa thành riêng nam giới.
- source_word: προβάτου
  choice: một con chiên
  rationale: Dạng sở hữu sau διαφέρει biểu thị đối tượng so sánh; “con chiên” là cách gọi rõ ràng, quen thuộc trong văn cảnh Kinh Thánh.
- source_word: ὥστε
  choice: vì thế
  rationale: Nêu kết luận rút ra từ sự so sánh ngay trước đó.
- source_word: ἔξεστιν
  choice: là hợp luật
  rationale: Giữ sắc thái pháp lý–đạo đức của cuộc tranh luận về điều được phép làm trong ngày sa-bát.
- source_word: τοῖς σάββασιν
  choice: vào các ngày sa-bát
  rationale: Giữ hình thức số nhiều của tiếng Hy Lạp trong chính văn, nhưng diễn đạt tự nhiên bằng tiếng Việt.
- source_word: καλῶς ποιεῖν
  choice: làm điều lành
  rationale: Diễn đạt thành ngữ chỉ hành động tốt lành, đem ích lợi cho người khác, sát nghĩa và trang trọng.
theological_decisions:
- issue: Phạm vi chỉ người của ἄνθρωπος
  choice: một con người
  alternative: một người đàn ông
  rationale: Trong sự đối chiếu với một con chiên, ἄνθρωπος chỉ một con người nói chung. “Một con người” bảo toàn tính đại diện mà không đưa vào sự phân biệt giới tính không được ngữ cảnh nhấn mạnh.
- issue: Thành ngữ số nhiều về ngày sa-bát
  choice: vào các ngày sa-bát
  alternative: vào ngày sa-bát
  rationale: Chính văn giữ số nhiều σάββασιν để minh bạch với nguồn; chú thích ghi nhận cách nói số ít tự nhiên hơn trong tiếng Việt.
- issue: Sắc thái của ἔξεστιν
  choice: là hợp luật
  alternative: được phép
  rationale: Ngữ cảnh là cuộc tranh luận về luật ngày sa-bát; “hợp luật” thể hiện rõ rằng kết luận liên quan đến tính chính đáng theo luật, không chỉ một sự cho phép thông thường.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu cảm thán giữ sức mạnh tu từ của lập luận. “Sa-bát” được viết thường như tên một ngày lễ/ngày nghỉ định kỳ; số nhiều trong chính văn phản ánh trực tiếp tiếng Hy Lạp.
