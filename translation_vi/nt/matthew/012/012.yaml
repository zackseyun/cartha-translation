  - severity: low
    issue: “Quý hơn” và “con chiên” ít trung tính hơn trong tiếng Việt hiện đại.
    rationale: “Có giá trị hơn” phản ánh trực tiếp ý so sánh giá trị của διαφέρει; “con cừu” là cách gọi thông dụng, trung tính cho πρόβατον.
