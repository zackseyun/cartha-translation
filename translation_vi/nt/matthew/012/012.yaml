  source_fidelity: Bản nháp truyền đạt đúng lập luận từ điều nhỏ đến điều lớn, giá trị so sánh của διαφέρει, và kết luận về điều được phép làm trong ngày Sa-bát. Tuy nhiên, “hợp luật” tuy sát sắc thái pháp lý nhưng kém tự nhiên trong cấu trúc tiếng Việt này; “được phép” truyền đạt trực tiếp ἔξεστιν trong ngữ cảnh tranh luận luật lệ.
  naturalness: 'Cần chỉnh nhẹ để tiếng Việt hiện đại tự nhiên hơn: “một người có giá trị hơn một con cừu biết bao” rõ nghĩa hơn “một con người quý hơn một con chiên biết bao”; “được phép làm” cũng tự nhiên hơn “làm ... là hợp luật”. Viết hoa “Sa-bát” phù hợp cách dùng tên ngày tôn giáo trong văn phong Kinh Thánh tiếng Việt.'
  terminology: ἄνθρωπος được dịch “một người” theo nghĩa khái quát, không giới hạn nam giới. πρόβατον là “con cừu”; cách này là từ thông dụng hiện đại và không thêm sắc thái “chiên” chuyên biệt. “Sa-bát” giữ thuật ngữ Kinh Thánh; số nhiều được bảo lưu trong chính văn, với chú thích nêu cách dịch thành ngữ số ít.
