- from: 'Nhưng Ngài đáp lời họ: “Một thế hệ gian ác và ngoại tình[a] tìm kiếm một dấu lạ, nhưng sẽ không có dấu lạ nào được ban cho thế hệ ấy, ngoại trừ dấu lạ của nhà tiên tri Giô-na.”'
  to: 'Nhưng Ngài đáp lời họ rằng: “Một thế hệ gian ác và ngoại tình[a] tìm kiếm một dấu lạ, và sẽ không có dấu lạ nào được ban cho thế hệ ấy, ngoại trừ dấu lạ của nhà tiên tri Giô-na.”'
  rationale: Thay “nhưng” bằng “và” trước “sẽ không có dấu lạ nào...” để phản ánh trực tiếp καὶ trong nguyên văn. Thêm “rằng” sau “đáp lời họ” giúp dẫn lời nói trực tiếp tự nhiên hơn trong tiếng Việt, đồng thời vẫn chuyển tải công thức ἀποκριθεὶς εἶπεν αὐτοῖς mà không dịch máy móc.
