id: MAT.12.39
reference: Matthew 12:39
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν αὐτοῖς· Γενεὰ πονηρὰ καὶ μοιχαλὶς σημεῖον ἐπιζητεῖ, καὶ σημεῖον οὐ δοθήσεται αὐτῇ εἰ μὴ τὸ σημεῖον Ἰωνᾶ τοῦ προφήτου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/039.yaml
  text: But he answered and said to them[a], “An evil and adulterous generation seeks a sign[b], and no sign will be given to it except the sign of Jonah the prophet.”
translation:
  language: vi
  text: 'Nhưng Ngài đáp lời họ rằng: “Một thế hệ gian ác và ngoại tình[a] tìm kiếm một dấu lạ, và sẽ không có dấu lạ nào được ban cho thế hệ ấy, ngoại trừ dấu lạ của nhà tiên tri Giô-na.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ngoại tình” có thể gợi đến cả hành vi ngoại tình theo nghĩa đen lẫn sự bất trung đối với Đức Chúa Trời, theo hình ảnh thường gặp trong các sách tiên tri.
    reason: Giữ lại phạm vi nghĩa và âm hưởng giao ước của μοιχαλὶς mà không giải nghĩa quá mức trong chính văn.
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν αὐτοῖς
  choice: đáp lời họ
  rationale: Cụm phân từ cộng động từ hữu hạn là một công thức kể chuyện chịu ảnh hưởng lối diễn đạt Sê-mít. “Đáp lời họ” truyền đạt tự nhiên cả ý trả lời lẫn nói trong tiếng Việt, tránh cách dịch nặng nề “trả lời và nói với họ”.
- source_word: Γενεὰ
  choice: thế hệ
  rationale: “Thế hệ” giữ được ý chỉ một tập thể đương thời bị mô tả về mặt đạo đức, đồng thời sát với danh từ số ít trong tiếng Hy Lạp.
- source_word: πονηρὰ
  choice: gian ác
  rationale: “Gian ác” là cách diễn đạt rõ ràng, trang trọng vừa phải và có sức nặng tương xứng với lời lên án về đạo đức.
- source_word: μοιχαλὶς
  choice: ngoại tình
  rationale: Từ này gắn trực tiếp với hành vi ngoại tình nhưng cũng có thể gợi hình ảnh tiên tri về sự bất trung trong giao ước. Giữ “ngoại tình” trong chính văn bảo toàn sức mạnh của ẩn dụ thay vì giải nghĩa thành “bất trung”.
- source_word: σημεῖον
  choice: dấu lạ
  rationale: Trong ngữ cảnh người ta đòi một sự xác chứng đặc biệt, “dấu lạ” là cách nói Kinh Thánh tự nhiên trong tiếng Việt. Từ này vẫn đủ rộng để không xác định trước chính xác bản chất của dấu lạ Giô-na.
- source_word: ἐπιζητεῖ
  choice: tìm kiếm
  rationale: “Tìm kiếm” chuyển tải trực tiếp hành động được diễn tả; không tăng cường thành “đòi hỏi” vì động từ Hy Lạp và ngữ cảnh không buộc phải giải nghĩa theo hướng ấy.
- source_word: δοθήσεται
  choice: sẽ ... được ban cho
  rationale: Cách diễn đạt này giữ rõ thì tương lai và thể bị động, đồng thời tự nhiên trong văn phong trang trọng hiện đại.
- source_word: αὐτῇ
  choice: cho thế hệ ấy
  rationale: Đại từ giống cái số ít quay lại Γενεὰ. Lặp lại “thế hệ ấy” tự nhiên và rõ nghĩa hơn đại từ “nó” trong tiếng Việt.
- source_word: εἰ μὴ
  choice: ngoại trừ
  rationale: Trong cấu trúc phủ định này, “ngoại trừ” diễn đạt chính xác quan hệ loại trừ.
- source_word: τὸ σημεῖον Ἰωνᾶ τοῦ προφήτου
  choice: dấu lạ của nhà tiên tri Giô-na
  rationale: Cách dịch giữ nguyên quan hệ sở thuộc rộng của nguyên văn và không giải thích trước dấu lạ ấy là gì; ngữ cảnh kế tiếp sẽ làm sáng tỏ thêm.
theological_decisions:
- issue: Ý nghĩa của từ μοιχαλὶς trong lời quở trách
  choice: Giữ từ “ngoại tình” trong chính văn và chú thích khả năng gợi đến sự bất trung đối với Đức Chúa Trời.
  alternative: Dịch trực tiếp là “bất trung”.
  rationale: Nguyên văn duy trì đồng thời nghĩa đen về ngoại tình và âm hưởng tiên tri về sự bất trung trong giao ước. Không nên thu hẹp sự căng thẳng này vào chỉ một cách giải thích.
- issue: Bản chất của “dấu lạ Giô-na”
  choice: Dịch đơn giản là “dấu lạ của nhà tiên tri Giô-na”, không giải thích trong chính văn.
  alternative: Diễn giải là “dấu lạ giống như điều đã xảy ra với Giô-na” hoặc “dấu lạ là chính Giô-na”.
  rationale: Câu này giới thiệu cụm từ nhưng chưa tự nó xác định đầy đủ bản chất của dấu lạ; câu kế tiếp mới cung cấp lời giải thích. Chính văn không nên đưa vào một cách hiểu quá sớm.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Ngài” phù hợp với cách quy chiếu tôn kính đến Đức Giê-su trong tiếng Việt; “đáp lời họ” tránh lối dịch máy móc của công thức Hy Lạp. “Dấu lạ” được dùng nhất quán để vừa tự nhiên trong ngữ cảnh Kinh Thánh vừa không giải thích quá mức.
