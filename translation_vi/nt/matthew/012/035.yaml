id: MAT.12.35
reference: Matthew 12:35
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὁ ἀγαθὸς ἄνθρωπος ἐκ τοῦ ἀγαθοῦ θησαυροῦ ἐκβάλλει ἀγαθά, καὶ ὁ πονηρὸς ἄνθρωπος ἐκ τοῦ πονηροῦ θησαυροῦ ἐκβάλλει πονηρά.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/035.yaml
  text: The good man brings out good things from his good treasure[b][a], and the evil man brings out evil things from his evil treasure.
translation:
  language: vi
  text: Người tốt đưa ra những điều tốt từ kho tàng tốt[a], còn người ác đưa ra những điều ác từ kho tàng ác.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Văn cảnh trực tiếp nói về lời nói, nên “những điều tốt” và “những điều ác” ở đây có thể đặc biệt chỉ những lời được nói ra.
    reason: cross_reference
lexical_decisions:
- source_word: ἀγαθός / ἀγαθά
  choice: tốt / những điều tốt
  rationale: Giữ nguyên sự lặp từ và thế đối xứng của nguyên văn giữa phẩm chất của con người với những gì người ấy đưa ra; dạng trung tính số nhiều ἀγαθά được diễn đạt tự nhiên là “những điều tốt”.
- source_word: ἄνθρωπος
  choice: người
  rationale: “Người” là cách dịch tự nhiên và bao quát của ἄνθρωπος trong câu châm ngôn mang tính đại diện; tiếng Việt không cần đánh dấu giống đực như hình thức ngữ pháp Hy Lạp.
- source_word: θησαυρός
  choice: kho tàng
  rationale: “Kho tàng” giữ được hình ảnh về một nguồn tích chứa bên trong, đồng thời trang trọng và tự nhiên hơn cách diễn đạt quá cụ thể như “nhà kho”.
- source_word: ἐκβάλλει
  choice: lấy ... ra
  rationale: Cách dịch này bảo toàn ý chuyển động từ bên trong ra ngoài của động từ mà vẫn tự nhiên trong tiếng Việt.
- source_word: πονηρός / πονηρά
  choice: ác / những điều ác
  rationale: “Ác” thể hiện rõ sắc thái đạo đức mạnh của πονηρός và duy trì thế tương phản cân xứng với “tốt”; dạng trung tính số nhiều πονηρά được dịch là “những điều ác”.
- source_word: ἐκ
  choice: từ
  rationale: “Từ” diễn đạt nguồn xuất phát; kết hợp với “lấy ... ra” để tái hiện cấu trúc hình ảnh của nguyên văn mà không gây nặng câu.
theological_decisions:
- issue: Phạm vi của “những điều tốt” và “những điều ác”
  choice: Giữ cách nói rộng, không thêm danh từ “lời nói” vào chính văn.
  alternative: Dịch cụ thể là “những lời tốt” và “những lời ác” theo văn cảnh trực tiếp về lời nói.
  rationale: Ngữ cảnh gần nói về lời từ miệng phát ra, nhưng nguyên văn dùng các tính từ trung tính số nhiều như danh từ mà không nêu rõ “lời nói”. Bản dịch vì thế giữ độ rộng và ghi nhận trọng tâm ngữ cảnh trong chú thích.
- issue: Sự tương phản đạo đức mang tính châm ngôn
  choice: Trình bày điều được biểu lộ ra ngoài như xuất phát từ kho tàng đạo đức bên trong con người.
  alternative: Giải thích câu theo một hệ thống giáo lý cụ thể về bản tính hoặc công việc của con người.
  rationale: Hình ảnh và sự căng thẳng thần học của câu được giữ nguyên, không đưa thêm kết luận giáo phái hay một hệ thống tín lý không được phát biểu trực tiếp trong nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Cấu trúc song song được giữ rõ; “người” tự nhiên trong tiếng Việt và phù hợp với ý nghĩa đại diện của ἄνθρωπος. Dấu chú thích [a] xuất hiện ngay trong chính văn.
