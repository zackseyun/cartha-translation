- from: 'Bấy giờ, Ngài nói với người đàn ông: “Hãy giơ tay anh ra.” Anh giơ tay ra, và tay ấy được phục hồi, lành lặn như tay kia.[a]'
  to: 'Bấy giờ, Ngài nói với người đàn ông: “Hãy đưa tay anh ra.” Người ấy đưa tay ra, và bàn tay ấy được phục hồi, lành lặn như tay kia.[a]'
