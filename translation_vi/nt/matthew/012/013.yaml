  text: τότε λέγει τῷ ἀνθρώπῳ· Ἔκτεινόν ⸂σου τὴν χεῖρα⸃· καὶ ἐξέτεινεν, καὶ ἀπεκατεστάθη ὑγιὴς ὡς ἡ ἄλλη.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/013.yaml
  text: Then he says to the man[a], “Stretch out your hand.” And he stretched it out, and it was restored[b], healthy like the other one.
translation:
  language: vi
  text: 'Bấy giờ, Ngài nói với người đàn ông: “Hãy đưa tay anh ra.” Người ấy đưa tay ra, và bàn tay ấy được phục hồi, lành lặn như tay kia.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cụm Hy Lạp có thể dịch sát: “khỏe mạnh như [bàn tay] kia”; danh từ “bàn tay” được hiểu ngầm.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Bấy giờ
  rationale: Đánh dấu trình tự của câu chuyện một cách tự nhiên và trang trọng trong tiếng Việt.
- source_word: λέγει
  choice: Ngài nói
  rationale: Hiện tại lịch sử của tiếng Hy Lạp tạo sắc thái sống động; tiếng Việt có thể dùng hiện tại mà vẫn tự nhiên trong mạch kể.
- source_word: τῷ ἀνθρώπῳ
  choice: với người đàn ông
  rationale: Chỉ người nam cụ thể đã được nhắc đến trong ngữ cảnh.
- source_word: Ἔκτεινόν σου τὴν χεῖρα
  choice: Hãy giơ tay anh ra
  rationale: Diễn đạt mệnh lệnh trực tiếp bằng tiếng Việt tự nhiên; χείρ ở đây là tay.
- source_word: ἐξέτεινεν
  choice: Anh giơ tay ra
  rationale: Giữ sự lặp lại có chủ ý giữa mệnh lệnh và hành động đáp lại.
- source_word: ἀπεκατεστάθη
  choice: được phục hồi
  rationale: Giữ sắc thái đưa trở lại tình trạng đúng đắn hoặc nguyên vẹn, thay vì chỉ nói chung là được chữa lành.
- source_word: ὑγιὴς
  choice: lành lặn
  rationale: Diễn tả tình trạng khỏe mạnh, nguyên vẹn của bàn tay bằng cách nói tự nhiên trong tiếng Việt.
- source_word: ὡς ἡ ἄλλη
  choice: như tay kia
  rationale: Dạng giống cái trong tiếng Hy Lạp quy chiếu ngầm đến bàn tay kia; nói rõ danh từ giúp câu tiếng Việt sáng nghĩa.
theological_decisions:
- issue: Bản chất của sự chữa lành được mô tả
  choice: Bàn tay được phục hồi và trở nên lành lặn như tay kia.
  alternative: Bàn tay được chữa lành hoặc được làm cho nguyên vẹn.
  rationale: Cách dịch phản ánh cả động từ chỉ sự phục hồi lẫn tính từ chỉ tình trạng khỏe mạnh, không thêm diễn giải giáo lý ngoài lời văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” để chỉ Đức Giê-su theo lối xưng hô kính trọng phổ biến; dùng “anh” trong mệnh lệnh vì người được nói đến là một người đàn ông trưởng thành. Dấu chú thích được đặt ngay sau cụm từ cần giải thích.
