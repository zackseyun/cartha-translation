id: MAT.12.18
reference: Matthew 12:18
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἰδοὺ ὁ παῖς μου ὃν ᾑρέτισα, ὁ ἀγαπητός μου ⸂εἰς ὃν⸃ εὐδόκησεν ἡ ψυχή μου· θήσω τὸ πνεῦμά μου ἐπ’ αὐτόν, καὶ κρίσιν τοῖς ἔθνεσιν ἀπαγγελεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/018.yaml
  text: Behold[a], my servant whom I have chosen, my beloved in whom my soul has delighted. I will put my Spirit upon him[c][b], and he will proclaim justice to the nations.
translation:
  language: vi
  text: “Kìa, đầy tớ Ta, người Ta đã chọn; người yêu dấu của Ta, người mà linh hồn Ta lấy làm vui thỏa. Ta sẽ đặt Thần Khí Ta trên người, và người sẽ công bố công lý[a] cho các dân[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “sự phán xét”.
    reason: lexical_alternative
  - marker: b
    text: Hay “cho dân ngoại”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰδοὺ
  choice: Kìa
  rationale: Giữ chức năng kêu gọi chú ý và sắc thái trang trọng của lời tiên tri, đồng thời vẫn tự nhiên trong tiếng Việt hiện đại.
- source_word: παῖς
  choice: đầy tớ
  rationale: Trong ngữ cảnh trích dẫn bài ca về Người Đầy Tớ trong Ê-sai, từ này chỉ người phục vụ của Đức Chúa Trời, không đơn thuần là trẻ nhỏ hay con.
- source_word: ᾑρέτισα
  choice: đã chọn
  rationale: Diễn đạt tự nhiên hành động lựa chọn đã hoàn tất của Đức Chúa Trời.
- source_word: ὁ ἀγαπητός μου
  choice: người yêu dấu của Ta
  rationale: Truyền đạt cả tình yêu thương lẫn phẩm giá, không thêm ý nghĩa ngoài từ Hy Lạp.
- source_word: εἰς ὃν εὐδόκησεν ἡ ψυχή μου
  choice: người mà linh hồn Ta vui thỏa
  rationale: Giữ hình ảnh rõ ràng 'linh hồn Ta' và sắc thái hài lòng, vui thích của εὐδοκέω; cách diễn đạt tránh làm phẳng thành chỉ 'Ta hài lòng'.
- source_word: θήσω τὸ πνεῦμά μου ἐπ’ αὐτόν
  choice: Ta sẽ đặt Thần Khí Ta trên người
  rationale: Theo sát ngôn ngữ trao ban và ủy nhiệm của lời tiên tri. Viết hoa 'Thần Khí' vì đây là Thần Khí của Đức Chúa Trời.
- source_word: κρίσιν
  choice: công lý
  rationale: Trong sứ mạng của Người Đầy Tớ đối với các dân, 'công lý' diễn đạt việc bày tỏ và thiết lập trật tự công chính của Đức Chúa Trời; nghĩa 'sự phán xét' được giữ ở chú thích.
- source_word: τοῖς ἔθνεσιν
  choice: cho các dân
  rationale: Giữ phạm vi phổ quát của lời tiên tri; từ Hy Lạp cũng có thể chỉ các dân ngoại, nên phương án đó được nêu trong chú thích.
- source_word: ἀπαγγελεῖ
  choice: sẽ công bố
  rationale: Thể hiện hành động loan báo công khai, có thẩm quyền, phù hợp văn cảnh tiên tri.
theological_decisions:
- issue: Căn tính Người Đầy Tớ trong παῖς
  choice: Dịch là 'đầy tớ' theo bối cảnh lời trích dẫn từ Ê-sai.
  alternative: '''con'' hoặc ''đứa trẻ'''
  rationale: Lựa chọn này bảo tồn mối liên hệ với hình tượng Người Đầy Tớ trong Ê-sai và không đưa ý niệm quan hệ con vào một từ mà tại đây nhấn mạnh vai trò phục vụ.
- issue: Ý nghĩa của κρίσις trong sứ mạng tiên tri
  choice: Dùng 'công lý' trong chính văn.
  alternative: '''sự phán xét'''
  rationale: Văn cảnh nói điều Người Đầy Tớ công bố cho các dân; 'công lý' phù hợp với ý về trật tự công chính của Đức Chúa Trời, nhưng tính đa nghĩa thật sự của từ Hy Lạp được bảo tồn trong chú thích.
- issue: Cụm 'linh hồn Ta' trong lời phán của Đức Chúa Trời
  choice: Giữ nguyên hình ảnh 'linh hồn Ta'.
  alternative: Rút gọn thành 'Ta hài lòng về người'
  rationale: Giữ cách diễn đạt nhân hình và sắc thái tình cảm của nguyên văn mà không suy diễn về cấu tạo bản thể của Đức Chúa Trời.
translation_notes:
  register: Văn phong trang trọng, sáng rõ và phù hợp một lời trích dẫn tiên tri. Đại từ 'Ta' và 'người' giúp phân biệt lời Đức Chúa Trời với Người Đầy Tớ; 'người' ở đây là đại từ chỉ nhân vật, không phải danh từ chỉ loài người. Mọi dấu chú thích đều xuất hiện trong chính văn và được đặt ngay sau từ ngữ liên quan.
