  yaml_path: translation/nt/matthew/012/017.yaml
  text: 'so that what was spoken through Isaiah the prophet might be fulfilled[a], saying:'
translation:
  language: vi
  text: 'để lời đã được phán qua nhà tiên tri Ê-sai được ứng nghiệm rằng:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἵνα
  choice: để
  rationale: Giữ lực liên kết mục đích/kết quả của ἵνα mà không buộc câu chỉ mang một sắc thái duy nhất; đây cũng là cách diễn đạt tự nhiên trong công thức ứng nghiệm.
- source_word: πληρωθῇ
  choice: ứng nghiệm
  rationale: Diễn đạt tự nhiên động từ thụ động πληρόω trong công thức trích dẫn của Ma-thi-ơ; hình thái sau ἵνα được thể hiện qua cấu trúc «để ứng nghiệm».
- source_word: τὸ ῥηθὲν
  choice: điều đã được phán
  rationale: Giữ chức năng danh từ và thể bị động của phân từ, đồng thời dùng «phán» phù hợp với lời mang thẩm quyền thần thượng.
- source_word: διὰ
  choice: qua
  rationale: Với sở hữu cách, διά chỉ tác nhân trung gian; «qua» bảo tồn ý nhà tiên tri là người truyền đạt mà không đồng nhất ông với nguồn tối hậu của lời.
- source_word: Ἠσαΐου
  choice: Ê-sai
  rationale: Dùng dạng tên quen thuộc trong truyền thống Kinh Thánh tiếng Việt và dễ nhận biết đối với độc giả hiện đại.
- source_word: τοῦ προφήτου
  choice: nhà tiên tri
  rationale: Giữ nguyên danh xưng đồng vị trong bản Hy Lạp.
- source_word: λέγοντος
  choice: rằng
  rationale: Trong tiếng Việt, «rằng» dẫn trực tiếp vào lời trích dẫn ở câu kế tiếp tự nhiên hơn «nói rằng», đồng thời vẫn giữ liên kết hướng tới phần trích dẫn.
theological_decisions:
- issue: Vai trò trung gian của nhà tiên tri trong công thức trích dẫn
  choice: qua nhà tiên tri Ê-sai
  alternative: bởi nhà tiên tri Ê-sai
  rationale: «Qua» phản ánh διά với sở hữu cách và giữ được mô hình Đức Chúa Trời phán qua người truyền đạt, thay vì dễ khiến Ê-sai được hiểu là nguồn tối hậu của lời.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ công thức ứng nghiệm đặc trưng của Ma-thi-ơ; không thêm chú thích vì «qua» trực tiếp và tự nhiên trong tiếng Việt.
