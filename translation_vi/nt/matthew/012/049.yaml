id: MAT.12.49
reference: Matthew 12:49
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἐκτείνας τὴν χεῖρα αὐτοῦ ἐπὶ τοὺς μαθητὰς αὐτοῦ εἶπεν· Ἰδοὺ ἡ μήτηρ μου καὶ οἱ ἀδελφοί μου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/049.yaml
  text: And stretching out his hand toward his disciples[a], he said, “Behold[b], my mother and my brothers.”
translation:
  language: vi
  text: 'Ngài đưa tay về phía các môn đồ và nói: “Kìa[a], mẹ Ta và các anh em Ta[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Đây” hoặc “Hãy nhìn xem.”'
    reason: lexical_alternative
  - marker: b
    text: Tiếng Hy Lạp dùng danh từ số nhiều giống đực, nghĩa đen là “các anh em”; vì vậy ở đây không diễn rộng thành “anh chị em.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκτείνας
  choice: giơ
  rationale: Diễn tả tự nhiên động tác đưa tay ra trước khi nói; kết hợp với “về phía” để giữ rõ hướng của cử chỉ.
- source_word: χεῖρα
  choice: tay
  rationale: Nghĩa thông thường và cụ thể của từ Hy Lạp trong cử chỉ này là “tay”.
- source_word: ἐπὶ
  choice: về phía
  rationale: Với đối cách trong ngữ cảnh cử chỉ, giới từ chỉ hướng đến các môn đồ.
- source_word: μαθητὰς
  choice: các môn đồ
  rationale: Thuật ngữ quen thuộc và chính xác cho mối quan hệ thầy–trò trong các sách Phúc Âm.
- source_word: Ἰδοὺ
  choice: Đây
  rationale: Trong câu nhận diện này, “Đây” vừa thu hút sự chú ý vừa chỉ vào những người trước mặt, tự nhiên hơn trong tiếng Việt hiện đại mà vẫn giữ sức nhấn.
- source_word: μήτηρ
  choice: mẹ
  rationale: Giữ nguyên từ chỉ quan hệ gia đình cụ thể trong nguyên văn.
- source_word: ἀδελφοί
  choice: các anh em
  rationale: Giữ hình thức số nhiều giống đực và hình ảnh quan hệ gia đình cụ thể, không diễn rộng thành “anh chị em” hay “gia đình”.
theological_decisions:
- issue: Ngôn ngữ thân tộc khi Đức Chúa Jêsus xác định lại quan hệ gia đình
  choice: Giữ các danh từ cụ thể “mẹ” và “các anh em”
  alternative: Diễn rộng thành “gia đình” hoặc “anh chị em”
  rationale: Câu nói cố ý dùng các quan hệ thân tộc cụ thể để đồng nhất các môn đồ với gia đình của Ngài; diễn rộng sẽ làm giảm sức tu từ và giải thích quá điều nguyên văn nói.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “phán” và đại từ “Ngài/Ta” theo lối tôn kính quen thuộc; câu văn giữ cử chỉ, hướng của cử chỉ và lời nhận diện súc tích trong nguyên văn.
