  text: and in his name the nations will hope[a].
translation:
  language: vi
  text: Và các dân tộc sẽ đặt hy vọng nơi danh Ngài[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “và dân ngoại sẽ đặt hy vọng nơi danh Ngài.”'
    reason: Bảo toàn khả năng ἔθνη mang nghĩa cụ thể là các dân ngoại.
lexical_decisions:
- source_word: καὶ
  choice: và
  rationale: Giữ liên từ nối câu này với phần trước của lời trích dẫn.
- source_word: τῷ ὀνόματι αὐτοῦ
  choice: nơi danh Ngài
  rationale: Cách diễn đạt trang trọng và tự nhiên trong văn phong Kinh Thánh; “danh” có thể bao hàm chính thân vị, uy quyền và danh tiếng được đại diện bởi danh ấy mà không giải thích quá mức.
- source_word: ἔθνη
  choice: các dân tộc
  rationale: Từ này có thể chỉ các dân tộc nói chung hoặc các dân ngoại. Trong bối cảnh trích dẫn Ê-sai, “các dân tộc” giữ được chân trời rộng của lời hứa.
- source_word: ἐλπιοῦσιν
  choice: sẽ đặt hy vọng
  rationale: Diễn đạt rõ động từ tương lai và ý nghĩa hướng niềm hy vọng vào một đối tượng; tự nhiên hơn “sẽ hy vọng” trong tiếng Việt ở cấu trúc này.
theological_decisions:
- issue: Cách dịch ἔθνη trong lời trích dẫn mang tính Mê-si-a
  choice: các dân tộc
  alternative: dân ngoại
  rationale: “Các dân tộc” bảo toàn phạm vi rộng của lời trích Ê-sai, trong khi “dân ngoại” vẫn là một cách hiểu hợp ngữ cảnh và được ghi ở chú thích.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” để chỉ nhân vật Mê-si-a trong ngữ cảnh, đồng thời giữ cấu trúc cô đọng của lời trích dẫn.
