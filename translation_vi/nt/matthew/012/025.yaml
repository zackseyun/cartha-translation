revisions:
- from: 'Nhưng Đức Giê-su biết những suy nghĩ[a] của họ nên phán với họ: “Bất cứ vương quốc nào chia rẽ chống lại chính mình đều bị hoang tàn[b], và bất cứ thành nào hay nhà[c] nào chia rẽ chống lại chính mình cũng sẽ không đứng vững.”'
  to: 'Nhưng Đức Giê-su biết những suy nghĩ[a] của họ và nói với họ: “Mọi vương quốc bị chia rẽ chống lại chính mình đều bị tàn phá[b], và mọi thành phố hoặc nhà[c] bị chia rẽ chống lại chính mình sẽ không đứng vững.”'
  rationale: Bản sửa đánh dấu rõ thể bị động của μερισθεῖσα, thay cụm từ không tự nhiên «bị hoang tàn» bằng «bị tàn phá», và dùng các từ ngữ hiện đại hơn mà vẫn giữ cấu trúc song hành, ý nghĩa khái quát của Πᾶσα, và sự mơ hồ của οἰκία. Liên từ «và» phản ánh δέ như một chuyển ý nhẹ mà không thêm quan hệ nguyên nhân từ phân từ «biết».
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T02:46:30Z'
review_pass:
  verdict: revise
  source_fidelity: Bản nháp truyền đạt đúng ý chính và không suy diễn cách Đức Giê-su biết các ý nghĩ của họ. Tuy nhiên, «chia rẽ» nên ở dạng bị động («bị chia rẽ») để phản ánh phân từ bị động μερισθεῖσα, và «bị hoang tàn» không tự nhiên trong tiếng Việt hiện đại.
  naturalness: «Bị hoang tàn» là kết hợp từ không chuẩn; «bị tàn phá» tự nhiên hơn. «Thành phố» và «nói» phù hợp hơn với văn phong hiện đại chuẩn so với «thành» và «phán» trong bản dịch này.
  terminology: Giữ «Đức Giê-su», «vương quốc», và «đứng vững». «Nhà» được giữ để không thu hẹp οἰκία vào nghĩa hộ gia đình; chú thích nêu nghĩa rộng hơn.
  issues:
  - severity: medium
    issue: «chia rẽ» thiếu dấu hiệu bị động
    rationale: 'μερισθεῖσα là phân từ aorist bị động: vương quốc/thành phố/nhà là đối tượng bị phân rẽ, không phải chủ thể thực hiện hành động chia rẽ.'
  - severity: medium
    issue: «bị hoang tàn» không tự nhiên
    rationale: «Hoang tàn» thường là tính từ mô tả tình trạng; «bị tàn phá» diễn đạt tự nhiên hơn ý ἐρημοῦται là bị làm cho tiêu điều/đổ nát.
  - severity: low
    issue: Một số lựa chọn có sắc thái cổ hoặc kém hiện đại
    rationale: «Thành» và «phán» không sai, nhưng «thành phố» và «nói» rõ ràng, tự nhiên hơn trong tiếng Việt hiện đại chuẩn.
