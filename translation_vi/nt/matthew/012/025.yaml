id: MAT.12.25
reference: Matthew 12:25
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εἰδὼς ⸀δὲ τὰς ἐνθυμήσεις αὐτῶν εἶπεν αὐτοῖς· Πᾶσα βασιλεία μερισθεῖσα καθ’ ἑαυτῆς ἐρημοῦται, καὶ πᾶσα πόλις ἢ οἰκία μερισθεῖσα καθ’ ἑαυτῆς οὐ σταθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/025.yaml
  text: But knowing their thoughts[a], he said to them, “Every kingdom divided against itself is laid waste[c][b], and every city or house divided against itself will not stand.”
translation:
  language: vi
  text: 'Nhưng Đức Giê-su biết những suy nghĩ[a] của họ và nói với họ: “Mọi vương quốc bị chia rẽ chống lại chính mình đều bị tàn phá[b], và mọi thành phố hoặc nhà[c] bị chia rẽ chống lại chính mình sẽ không đứng vững.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “những suy luận” hoặc “những ý định.”
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “trở nên hoang phế” hoặc “đi đến chỗ đổ nát.”
    reason: lexical_alternative
  - marker: c
    text: “Nhà” ở đây cũng có thể mang nghĩa “gia đình” hoặc “hộ gia đình.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰδὼς
  choice: biết
  rationale: Phân từ này diễn tả sự nhận biết về mặt tinh thần. “Biết” tự nhiên trong tiếng Việt và không giải thích thêm Đức Giê-su biết bằng cách nào.
- source_word: δὲ
  choice: Nhưng
  rationale: δέ đánh dấu một chuyển ý nhẹ có sắc thái tương phản với lời cáo buộc trong ngữ cảnh trước.
- source_word: ἐνθυμήσεις
  choice: những suy nghĩ
  rationale: Từ này có thể chỉ các ý nghĩ, suy luận hoặc ý định trong lòng. “Những suy nghĩ” rõ ràng, tự nhiên và giữ được phạm vi nghĩa rộng.
- source_word: Πᾶσα βασιλεία
  choice: Bất cứ vương quốc nào
  rationale: πᾶσα đi với danh từ số ít trong một mệnh đề mang tính nguyên tắc phổ quát; cấu trúc “bất cứ... nào” diễn đạt tự nhiên trong tiếng Việt.
- source_word: μερισθεῖσα καθ’ ἑαυτῆς
  choice: chia rẽ chống lại chính mình
  rationale: Cách dịch này giữ cả ý phân rẽ nội bộ lẫn sắc thái đối nghịch của κατά với đại từ phản thân.
- source_word: ἐρημοῦται
  choice: bị hoang tàn
  rationale: Động từ diễn tả tình trạng bị làm cho hoang phế hoặc đi đến chỗ tiêu điều, đổ nát. “Bị hoang tàn” giữ được mức độ nghiêm trọng và sắc thái bị động/kết quả.
- source_word: πόλις ἢ οἰκία
  choice: thành nào hay nhà nào
  rationale: πόλις là “thành”; οἰκία có thể là ngôi nhà hoặc gia đình/hộ gia đình. Dịch “nhà” giữ hình thức cụ thể của nguyên ngữ, còn chú thích nêu nghĩa khả dĩ rộng hơn.
- source_word: οὐ σταθήσεται
  choice: sẽ không đứng vững
  rationale: Trong thành ngữ này, ἵστημι chỉ việc tiếp tục tồn tại hoặc duy trì sự ổn định. “Đứng vững” vừa súc tích vừa tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Bản chất sự nhận biết của Đức Giê-su về những suy nghĩ của họ
  choice: Chỉ nói Đức Giê-su “biết những suy nghĩ của họ,” không xác định cơ chế của sự nhận biết ấy.
  alternative: Nói rõ đây là sự toàn tri siêu nhiên, sự soi biết mang tính tiên tri, hoặc khả năng suy đoán từ hoàn cảnh.
  rationale: Câu này khẳng định Đức Giê-su biết nhưng không giải thích Ngài biết bằng cách nào; bản dịch vì thế giữ nguyên sự mở ngỏ của văn bản.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Phán” phù hợp với lời Đức Giê-su trong văn bản Kinh Thánh mà không quá cổ; cấu trúc lặp “bất cứ... nào” bảo toàn nhịp song hành của câu Hy Lạp.
