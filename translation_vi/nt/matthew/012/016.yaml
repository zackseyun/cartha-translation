  yaml_path: translation/nt/matthew/012/016.yaml
  text: And he warned them not to make him known,[a]
translation:
  language: vi
  text: Và Ngài nghiêm khắc dặn họ đừng làm cho Ngài được biết đến.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “Ngài nghiêm khắc cảnh cáo họ” hoặc “Ngài ra lệnh cho họ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Và
  rationale: Liên từ nối tiếp mạch tường thuật; trong tiếng Việt có thể lược ở cấp câu, nhưng được phản ánh qua sự tiếp nối trực tiếp của lời kể.
- source_word: ἐπετίμησεν
  choice: nghiêm cấm
  rationale: Động từ có thể mang nghĩa quở trách, cảnh cáo nghiêm khắc hoặc truyền lệnh. Trong ngữ cảnh có mệnh đề nêu điều không được làm, “nghiêm cấm” diễn đạt tự nhiên sức mạnh của chỉ thị mà không mặc nhiên cho rằng những người ấy đáng bị khiển trách.
- source_word: αὐτοῖς
  choice: họ
  rationale: Đại từ số nhiều chỉ những người được Ngài chữa lành hoặc đang theo Ngài trong ngữ cảnh trước đó.
- source_word: ἵνα μὴ
  choice: không được
  rationale: Sau động từ chỉ mệnh lệnh/cảnh cáo, ἵνα μή với lối giả định diễn tả nội dung hoặc mục đích phủ định; “không được” truyền đạt rõ sức mạnh cấm đoán.
- source_word: φανερὸν αὐτὸν ποιήσωσιν
  choice: tiết lộ Ngài cho người khác
  rationale: Cụm φανερὸν ποιέω có nghĩa làm cho được biết, bộc lộ hoặc công khai. Cách dịch này tự nhiên trong tiếng Việt và giữ đối tượng là chính Ngài, đồng thời làm rõ ý công bố ra bên ngoài mà không thêm lý do thần học.
theological_decisions:
- issue: Tính chất lời chỉ thị của Chúa Giê-su về việc công khai Ngài
  choice: Một lệnh cấm nghiêm khắc, không cho tiết lộ Ngài
  alternative: Một lời quở trách những người được nói đến, hoặc một lời cảnh cáo nghiêm khắc
  rationale: Bản văn cho thấy một chỉ thị mạnh nhằm ngăn việc công khai, nhưng không nêu lý do thần học. Bản dịch giữ nguyên sự căng thẳng ấy và không bổ sung động cơ.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. “Ngài” được dùng nhất quán cho Chúa Giê-su. Dấu chú thích [a] xuất hiện trong chính văn.
