- from: 'Nhưng tôi nói với các ông: tại đây có điều lớn hơn đền thờ[a][b].'
  to: 'Nhưng tôi nói với các ông: ở đây có một điều lớn hơn đền thờ[a][b].'
  rationale: Sửa tối thiểu để câu Việt tự nhiên hơn và để chú thích thay thế không xác định hay thần học hóa đối tượng vốn không được nêu rõ trong nguyên văn. Trật tự “ở đây có” vẫn diễn đạt ὧδε và sự hiện diện của ἐστιν; “một điều lớn hơn” tiếp tục bảo toàn tính trung tính, không nêu danh của μεῖζόν.
