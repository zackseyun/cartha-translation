  text: λέγω δὲ ὑμῖν ὅτι τοῦ ἱεροῦ μεῖζόν ἐστιν ὧδε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/006.yaml
  text: But I tell you that something greater than the temple is here[a][b].
translation:
  language: vi
  text: 'Nhưng tôi nói với các ông: ở đây có một điều lớn hơn đền thờ[a][b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “ở đây có một người lớn hơn đền thờ” hoặc “ở đây có một đấng lớn hơn đền thờ.” Tiếng Hy Lạp dùng dạng trung tính của từ “lớn hơn”, nên về hình thức không nói rõ đối tượng là ai hay là điều gì.'
    reason: alternative_reading
  - marker: b
    text: 'Hay: “tại nơi này.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω δὲ ὑμῖν
  choice: Nhưng tôi nói với các ông
  rationale: Công thức nói trực tiếp được chuyển sang tiếng Việt tự nhiên; δέ mang sắc thái đối chiếu nhẹ với lập luận ngay trước đó, nên dùng “Nhưng”.
- source_word: ὅτι
  choice: ':'
  rationale: Dấu hai chấm tự nhiên trong tiếng Việt để giới thiệu nội dung lời tuyên bố, thay vì dịch máy móc bằng “rằng”.
- source_word: τοῦ ἱεροῦ
  choice: hơn đền thờ
  rationale: ἱερόν thường chỉ toàn bộ khu đền thờ, không riêng nơi thánh bên trong; “đền thờ” là cách gọi chuẩn, rõ và tự nhiên.
- source_word: μεῖζόν
  choice: điều lớn hơn
  rationale: Dạng so sánh trung tính số ít được dùng như danh từ nhưng không nêu rõ đối tượng. “Điều lớn hơn” giữ được tính phi nhân xưng về mặt hình thức, tránh tự ý xác định là một người.
- source_word: ἐστιν
  choice: có
  rationale: Trong cấu trúc tiếng Việt với yếu tố chỉ nơi chốn “tại đây”, “có” diễn đạt tự nhiên sự hiện diện mà động từ liên kết ἐστιν biểu thị.
- source_word: ὧδε
  choice: tại đây
  rationale: Diễn đạt nghĩa nơi chốn “ở đây/tại nơi này”; “tại đây” phù hợp với giọng trang trọng vừa phải của lời tuyên bố.
theological_decisions:
- issue: Đối tượng không được nêu rõ của dạng so sánh trung tính μεῖζόν
  choice: Dịch là “điều lớn hơn”, không trực tiếp ghi “người lớn hơn” hay nêu tên Chúa Giê-su trong chính văn.
  alternative: “một người lớn hơn đền thờ đang ở đây” hoặc “Đấng lớn hơn đền thờ đang ở đây”
  rationale: Tiếng Hy Lạp dùng dạng trung tính số ít μεῖζόν chứ không dùng dạng giống đực. Ngữ cảnh hướng mạnh đến Chúa Giê-su và thẩm quyền của ngài, nhưng chính văn nên giữ sự không xác định về mặt ngữ pháp và không thu hẹp sức căng thần học của câu.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Đại từ “tôi—các ông” phù hợp với lời Chúa Giê-su nói trực tiếp với nhóm người Pha-ri-si trong ngữ cảnh, không đưa thêm sắc thái giáo phái. Hai chú thích bảo tồn cả sự mơ hồ của μεῖζόν và phương án nghĩa nơi chốn của ὧδε.
