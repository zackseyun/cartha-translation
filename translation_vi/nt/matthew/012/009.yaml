source:
  edition: SBLGNT
  text: Καὶ μεταβὰς ἐκεῖθεν ἦλθεν εἰς τὴν συναγωγὴν αὐτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/009.yaml
  text: And departing from there, he went into their synagogue.
translation:
  language: vi
  text: Rời nơi đó, Đức Giê-su đi vào hội đường của họ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: Lược dịch như một liên kết tự nhiên
  rationale: Καί nối câu này với trình thuật trước. Trong tiếng Việt, mở đầu bằng “Và” ở đây kém tự nhiên; sự tiếp nối vẫn được thể hiện rõ qua cụm “Rời nơi đó”.
- source_word: μεταβὰς ἐκεῖθεν
  choice: Rời nơi đó
  rationale: Diễn đạt tự nhiên phân từ bất định quá khứ μεταβάς cùng trạng từ ἐκεῖθεν, giữ ý chuyển đi khỏi địa điểm vừa nhắc.
- source_word: ἦλθεν
  choice: đi
  rationale: Dù ἔρχομαι có thể là “đến”, điểm nhìn của trình thuật và chuyển động từ nơi trước sang nơi khác khiến “đi” tự nhiên trong tiếng Việt.
- source_word: εἰς τὴν συναγωγὴν
  choice: vào hội đường
  rationale: “Vào” giữ hướng chuyển động vào bên trong do εἰς với đối cách biểu thị; “hội đường” là cách gọi quen thuộc cho nơi hội họp và thờ phượng của người Do Thái.
- source_word: αὐτῶν
  choice: của họ
  rationale: Giữ nguyên đại từ sở hữu số nhiều mà không xác định thêm nhóm người ngoài điều văn mạch cho biết.
theological_decisions:
- issue: Đối tượng được chỉ bởi “hội đường của họ”
  choice: Giữ trung tính là “hội đường của họ”
  alternative: hội đường của những người ấy; nơi hội họp của họ
  rationale: Bản Hy Lạp chỉ có αὐτῶν và không trực tiếp gán cho nhóm này sắc thái thù nghịch hay bè phái; bản dịch không thêm ý luận chiến.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Giê-su” theo lối gọi kính trọng phổ biến; cấu trúc câu gọn, tự nhiên trong tiếng Việt, đồng thời giữ đầy đủ chuyển động từ địa điểm trước vào hội đường.
