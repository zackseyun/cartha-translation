revisions:
- from: Nữ hoàng phương Nam sẽ trỗi dậy trong ngày phán xét cùng với thế hệ này và sẽ kết án họ,[a] vì bà đã từ tận cùng trái đất đến để nghe sự khôn ngoan của Sa-lô-môn. Và kìa, tại đây có điều lớn hơn Sa-lô-môn.[b]
  to: Nữ hoàng phương Nam[a] sẽ trỗi dậy trong cuộc phán xét cùng với thế hệ này và sẽ kết án họ, vì bà đã từ tận cùng trái đất đến để nghe sự khôn ngoan của Sa-lô-môn. Kìa, có điều lớn hơn Sa-lô-môn ở đây.[b]
  rationale: Bản sửa chỉ điều chỉnh neo chú thích [a] cho đúng đối tượng được chú giải, và thay «trong ngày phán xét» bằng «trong cuộc phán xét» để tránh thêm yếu tố không được nêu trực tiếp trong tiếng Hy Lạp. Các lựa chọn khác giữ nguyên ý nghĩa, sắc thái và sự mơ hồ ngữ pháp của nguyên văn.
  reviewer_model: gpt-5.6-terra
