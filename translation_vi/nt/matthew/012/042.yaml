  - severity: low
    issue: «Trong ngày phán xét» thêm từ «ngày».
    rationale: κρίσις là «sự/cuộc phán xét»; nguyên văn không có danh từ «ngày». Bỏ phần thêm này giúp sát nguồn hơn mà vẫn tự nhiên.
