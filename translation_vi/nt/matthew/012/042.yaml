id: MAT.12.42
reference: Matthew 12:42
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: βασίλισσα νότου ἐγερθήσεται ἐν τῇ κρίσει μετὰ τῆς γενεᾶς ταύτης καὶ κατακρινεῖ αὐτήν· ὅτι ἦλθεν ἐκ τῶν περάτων τῆς γῆς ἀκοῦσαι τὴν σοφίαν Σολομῶνος, καὶ ἰδοὺ πλεῖον Σολομῶνος ὧδε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/042.yaml
  text: The queen of the South will rise up in the judgment with this generation and will condemn it[a], because she came from the ends of the earth to hear the wisdom of Solomon, and behold[b], something greater than Solomon is here.
translation:
  language: vi
  text: Nữ hoàng phương Nam[a] sẽ trỗi dậy trong cuộc phán xét cùng với thế hệ này và sẽ kết án họ, vì bà đã từ tận cùng trái đất đến để nghe sự khôn ngoan của Sa-lô-môn. Kìa, có điều lớn hơn Sa-lô-môn ở đây.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Nữ hoàng phương Nam” ám chỉ nữ hoàng Sê-ba (1 Các Vua 10:1–13; 2 Sử Ký 9:1–12), dù nguyên văn Hy Lạp không nêu tên Sê-ba.
    reason: cross_reference
  - marker: b
    text: 'Cũng có thể dịch: “Đấng lớn hơn Sa-lô-môn đang ở đây.” Nguyên văn Hy Lạp dùng dạng trung tính (“điều lớn hơn”), có thể nhấn mạnh sự cao trọng vượt trội hiện diện nơi Chúa Giê-su và sứ vụ của ngài.'
    reason: alternative_reading
lexical_decisions:
- source_word: βασίλισσα νότου
  choice: Nữ hoàng phương Nam
  rationale: Giữ nguyên cấu trúc 'nữ hoàng của phương Nam' theo nghĩa địa lý, không đưa tên Sê-ba từ bối cảnh Cựu Ước vào chính văn.
- source_word: ἐγερθήσεται
  choice: sẽ trỗi dậy
  rationale: Diễn đạt tự nhiên mà vẫn giữ được sắc thái sống lại và đứng lên trong bối cảnh phán xét, không xác định quá mức tác nhân.
- source_word: ἐν τῇ κρίσει
  choice: trong ngày phán xét
  rationale: Mạo từ xác định hướng đến cuộc phán xét chung cuộc; thêm 'ngày' là cách nói tự nhiên, quen thuộc trong tiếng Việt.
- source_word: μετὰ τῆς γενεᾶς ταύτης
  choice: cùng với thế hệ này
  rationale: Giữ nghĩa thông thường của μετά với sở hữu cách là 'cùng với'; ý đối nghịch được thể hiện qua động từ 'kết án' theo sau.
- source_word: κατακρινεῖ αὐτήν
  choice: sẽ kết án họ
  rationale: Động từ có nghĩa là kết án. Đại từ chỉ lại tập thể 'thế hệ này'; tiếng Việt tự nhiên dùng 'họ' để chỉ những người thuộc thế hệ ấy.
- source_word: ἐκ τῶν περάτων τῆς γῆς
  choice: từ tận cùng trái đất
  rationale: Giữ hình ảnh chỉ khoảng cách vô cùng xa trong nguyên văn bằng một thành ngữ trang trọng và dễ hiểu.
- source_word: ἀκοῦσαι τὴν σοφίαν Σολομῶνος
  choice: để nghe sự khôn ngoan của Sa-lô-môn
  rationale: Thể hiện trực tiếp mục đích của việc bà đến và giữ cấu trúc sở hữu của nguyên văn.
- source_word: ἰδοὺ
  choice: kìa
  rationale: Là từ chỉ thị trang trọng, thu hút sự chú ý và giữ sức nhấn mạnh của diễn ngôn.
- source_word: πλεῖον Σολομῶνος
  choice: điều lớn hơn Sa-lô-môn
  rationale: Dùng 'điều' để phản ánh dạng trung tính của πλεῖον, tránh tự động chuyển thành một danh từ chỉ người, đồng thời giữ tuyên bố rộng về thực tại hiện diện nơi Chúa Giê-su và sứ vụ của ngài.
- source_word: ὧδε
  choice: tại đây có
  rationale: Diễn đạt tự nhiên trong tiếng Việt khi kết hợp với 'điều lớn hơn', đồng thời giữ nghĩa địa điểm 'ở đây'.
theological_decisions:
- issue: Cách dịch dạng trung tính πλεῖον khi lời này quy chiếu đến Chúa Giê-su
  choice: điều lớn hơn Sa-lô-môn
  alternative: Đấng lớn hơn Sa-lô-môn
  rationale: Nguyên ngữ dùng dạng trung tính, nên 'điều lớn hơn' bảo tồn sự căng thẳng ngữ pháp và phạm vi rộng của lời tuyên bố. 'Đấng lớn hơn' nêu rõ hơn quy chiếu cá nhân đến Chúa Giê-su nhưng diễn giải vượt quá hình thức ngữ pháp.
- issue: Sắc thái của ἐγερθήσεται trong bối cảnh phán xét
  choice: sẽ trỗi dậy
  alternative: sẽ được làm cho sống lại
  rationale: '''Sẽ trỗi dậy'' giữ đồng thời sắc thái phục sinh và hành động đứng lên làm chứng trong cuộc phán xét, thay vì chỉ chọn một nghĩa.'
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng 'Sa-lô-môn' theo dạng tên Kinh Thánh quen thuộc; giữ 'kìa' để bảo tồn lực nhấn mạnh. Các dấu chú thích [a], [b] đều xuất hiện trong chính văn và được đặt ngay sau nội dung tương ứng.
