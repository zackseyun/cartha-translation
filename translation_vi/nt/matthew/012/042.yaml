  verdict: revise
  source_fidelity: 'Bản dịch chuyển tải đúng các yếu tố chính của câu Hy Lạp: «nữ hoàng phương Nam», sự trỗi dậy trong cuộc phán xét cùng thế hệ này, việc kết án, hành trình từ tận cùng trái đất để nghe sự khôn ngoan của Sa-lô-môn, và tuyên bố nhấn mạnh về «điều lớn hơn Sa-lô-môn» hiện diện tại đây. «Điều lớn hơn» bảo tồn cách dùng giống trung của πλεῖον mà không áp đặt cách hiểu chỉ một nhân vị.'
  naturalness: Văn phong nhìn chung tự nhiên và trang trọng. «Trong cuộc phán xét» sát với ἐν τῇ κρίσει và tự nhiên hơn «trong ngày phán xét», vốn thêm yếu tố «ngày» không có trực tiếp trong nguyên văn. «Kìa, có điều...» giữ lực nhấn mạnh của ἰδοὺ và đọc gọn trong tiếng Việt.
