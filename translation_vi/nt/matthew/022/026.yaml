translation:
  language: vi
  text: Người thứ hai và người thứ ba cũng vậy, cho đến cả bảy người.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁμοίως
  choice: cũng vậy
  rationale: Diễn tả cùng một sự việc đã xảy ra với người trước đó; cách nói tự nhiên trong tiếng Việt và giữ liên kết với câu trước.
- source_word: καὶ ὁ δεύτερος καὶ ὁ τρίτος
  choice: người thứ hai rồi người thứ ba
  rationale: Các số thứ tự có mạo từ được dùng như danh từ. “Người” được dùng để câu tiếng Việt tự nhiên mà không thêm riêng từ “anh/em”; “rồi” thể hiện trình tự của các trường hợp liên tiếp.
- source_word: ἕως τῶν ἑπτά
  choice: cho đến cả bảy người
  rationale: Cụm từ chỉ sự việc tiếp diễn hết toàn bộ nhóm bảy người. “Cả bảy người” truyền đạt tự nhiên ý nghĩa của τῶν ἑπτά trong ngữ cảnh.
