    issue: Phép nối “rồi” không phản ánh sát phép nối καὶ.
    rationale: καὶ nối “người thứ hai” với “người thứ ba”; “và” là lựa chọn trực tiếp và trung tính hơn. “Rồi” có thể gợi một diễn tiến thời gian mạnh hơn nguyên văn.
  - severity: low
    issue: Vị trí của “cũng vậy” có thể gây gắn kết mơ hồ.
    rationale: Trong “Người thứ hai rồi người thứ ba cũng vậy”, người đọc có thể nhất thời hiểu “cũng vậy” chỉ áp dụng cho người thứ ba. Đặt sau cụm “người thứ hai và người thứ ba” làm rõ cả hai đều cùng chịu sự việc đã nêu ở câu trước.
  revised_text: Người thứ hai và người thứ ba cũng vậy, cho đến cả bảy người.
