  verdict: revise
  source_fidelity: 'Bản nháp truyền đạt đúng ý chính: điều đã xảy ra với người trước cũng xảy ra cho những người tiếp theo, xuyên suốt nhóm bảy người. Tuy nhiên, “rồi” thay cho καὶ nhấn trình tự hơn là phép nối liệt kê, và cấu trúc hiện tại dễ khiến “cũng vậy” bề ngoài chỉ bổ nghĩa cho “người thứ ba”.'
  naturalness: Câu sửa dùng phép nối “và” và đặt “cũng vậy” sau cả cụm chủ ngữ, tự nhiên, rõ nghĩa trong tiếng Việt hiện đại mà vẫn giữ lối tỉnh lược của nguyên văn.
  terminology: “Người thứ hai”, “người thứ ba” phù hợp với tính tỉnh lược của các số thứ tự được danh từ hóa trong tiếng Hy Lạp; không cần thêm “anh/em” hay “người anh em”. “Cho đến cả bảy người” diễn đạt đầy đủ phạm vi bảy người trong ngữ cảnh.
  issues:
