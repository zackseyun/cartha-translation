  source_fidelity: 'Bản dịch truyền đạt đúng các thành tố của nguyên văn: δὲ là chuyển ý tương phản nhẹ (“Nhưng”); phân từ ἀκούσαντες có quan hệ thời gian (“khi ... nghe”); ἐφίμωσεν được diễn đạt đúng nghĩa bóng trong ngữ cảnh tranh luận (“đã khiến ... phải im tiếng”); và συνήχθησαν ἐπὶ τὸ αὐτό được chuyển tự nhiên là “họ tụ họp lại.” Không thêm chi tiết về địa điểm hay mục đích cuộc tụ họp.'
