translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Đại từ “Ngài” giữ chủ ngữ ngôi thứ ba hàm ẩn trong nguyên văn mà không lặp lại tên Đức Giê-su; tên các nhóm được phiên âm theo cách dùng Kinh Thánh tiếng Việt quen thuộc.
