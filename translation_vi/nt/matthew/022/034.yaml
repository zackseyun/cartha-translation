id: MAT.22.34
reference: Matthew 22:34
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Οἱ δὲ Φαρισαῖοι ἀκούσαντες ὅτι ἐφίμωσεν τοὺς Σαδδουκαίους συνήχθησαν ἐπὶ τὸ αὐτό.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/034.yaml
  text: But when the Pharisees heard that he had silenced the Sadducees[a], they gathered together.
translation:
  language: vi
  text: Nhưng khi những người Pha-ri-si nghe rằng Ngài đã khiến những người Sa-đu-sê phải im tiếng[a], họ tụ họp lại.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát hơn: “đã bịt mõm những người Sa-đu-sê.” Động từ Hy Lạp có thể chỉ việc bịt mõm một con vật; ở đây được dùng theo nghĩa bóng về việc khiến họ không còn lời đáp trong cuộc tranh luận.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Nhưng
  rationale: Đánh dấu sự chuyển tiếp có sắc thái tương phản nhẹ với cuộc đối đáp ngay trước đó.
- source_word: Φαρισαῖοι
  choice: những người Pha-ri-si
  rationale: Dùng cách phiên âm quen thuộc trong tiếng Việt cho tên nhóm Do Thái này.
- source_word: ἀκούσαντες
  choice: khi ... nghe rằng
  rationale: Phân từ bất định quá khứ mang ý nghĩa thời gian; cách diễn đạt này tự nhiên trong tiếng Việt và giữ rõ quan hệ thời gian.
- source_word: ἐφίμωσεν
  choice: đã khiến ... phải im tiếng
  rationale: Trong ngữ cảnh tranh luận, động từ chỉ việc khiến đối phương không còn lời đáp; cách dịch chính truyền đạt nghĩa bóng tự nhiên, còn hình ảnh 'bịt mõm' được giữ trong chú thích.
- source_word: Σαδδουκαίους
  choice: những người Sa-đu-sê
  rationale: Dùng cách phiên âm quen thuộc trong tiếng Việt cho tên nhóm Do Thái này.
- source_word: συνήχθησαν
  choice: họ tụ họp lại
  rationale: 'Dạng bị động nhưng có nghĩa nội động trong ngữ cảnh: những người Pha-ri-si cùng nhóm lại.'
- source_word: ἐπὶ τὸ αὐτό
  choice: lại (trong cụm 'tụ họp lại')
  rationale: Thành ngữ có nghĩa là cùng nhau hoặc tại cùng một nơi; tiếng Việt diễn đạt tự nhiên bằng 'tụ họp lại' mà không xác định quá mức địa điểm hay mục đích.
