  terminology: “Pha-ri-si” và “Sa-đu-sê” là các cách phiên âm quen thuộc. “Ngài” phù hợp văn cảnh chỉ Đức Giê-su và không làm thay đổi nội dung. Chú thích giữ được sắc thái hình tượng của ἐφίμωσεν mà bản văn chính vẫn dùng cách nói tự nhiên.
