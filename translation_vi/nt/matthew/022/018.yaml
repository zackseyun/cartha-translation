  terminology: “Đức Giê-su,” “ác ý,” “thử,” và “những kẻ đạo đức giả” đều phù hợp với ngữ cảnh và cách dùng Kinh Thánh tiếng Việt hiện đại. Chú thích cho “thử” phản ánh hợp lý phổ nghĩa của πειράζω mà không áp đặt một cách hiểu duy nhất.
  issues:
