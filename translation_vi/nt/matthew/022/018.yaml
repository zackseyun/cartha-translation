  source_fidelity: 'Bản nháp truyền đạt đúng các yếu tố chính của câu Hy Lạp: Đức Giê-su nhận biết πονηρία của họ, hỏi lý do họ πειράζετε ngài, và gọi họ là ὑποκριταί. Tuy nhiên, từ nối “nên” dễ làm câu tiếng Việt hàm ý việc biết ác ý là nguyên nhân khiến ngài nói, trong khi phân từ γνοὺς chủ yếu nêu hoàn cảnh/thời điểm (“biết/nhận biết ... rồi”) trước động từ chính εἶπεν.'
