source:
  edition: SBLGNT
  text: γνοὺς δὲ ὁ Ἰησοῦς τὴν πονηρίαν αὐτῶν εἶπεν· Τί με πειράζετε, ὑποκριταί;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/018.yaml
  text: But Jesus[a], knowing their evil intent, said, “Why are you testing me[b], hypocrites?”
translation:
  language: vi
  text: 'Nhưng Đức Giê-su biết ác ý của họ, nói: “Tại sao các người thử tôi[a], hỡi những kẻ đạo đức giả?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “thử thách tôi” hoặc “cám dỗ tôi.” Động từ Hy Lạp có thể mang nghĩa “thử,” “thử thách” hoặc “cám dỗ,” tùy ngữ cảnh.
    reason: lexical_alternative
lexical_decisions:
- source_word: γνοὺς
  choice: biết
  rationale: Phân từ bất định của γινώσκω diễn tả việc Đức Giê-su nhận biết động cơ của họ trước khi lên tiếng; “biết” ngắn gọn, tự nhiên và sát nghĩa.
- source_word: δὲ
  choice: Nhưng
  rationale: 'δέ đánh dấu sự tương phản nhẹ: lời đáp của Đức Giê-su đối lập với vẻ ngoài có vẻ chân thành trong lời họ hỏi.'
- source_word: πονηρίαν
  choice: ác ý
  rationale: Trong ngữ cảnh này, πονηρία chỉ sự xấu xa biểu hiện cụ thể nơi động cơ thù nghịch và mưu mô của họ; “ác ý” truyền đạt điều đó tự nhiên mà không mở rộng quá mức.
- source_word: εἶπεν
  choice: nói
  rationale: Cách dịch tường thuật thông thường, tự nhiên của động từ λέγω ở thì bất định.
- source_word: Τί
  choice: Tại sao
  rationale: Trong kết cấu này, τί mang nghĩa hỏi lý do; “Tại sao” là cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: πειράζετε
  choice: các người thử tôi
  rationale: πειράζω có thể là thử, thử thách hoặc cám dỗ. “Thử” giữ được độ rộng nghĩa, đồng thời phù hợp với âm mưu gài bẫy Đức Giê-su trong ngữ cảnh.
- source_word: ὑποκριταί
  choice: hỡi những kẻ đạo đức giả
  rationale: “Kẻ đạo đức giả” là cách gọi quen thuộc dành cho người giả vờ ngay thật nhưng che giấu động cơ xấu; từ “hỡi” thể hiện rõ lối xưng hô trực tiếp.
theological_decisions:
- issue: Việc Đức Giê-su nhận biết động cơ bên trong của những người đối nghịch
  choice: Đức Giê-su biết ác ý của họ
  alternative: Đức Giê-su nhận ra sự gian ác/lòng hiểm độc của họ
  rationale: Bản dịch khẳng định đúng như câu Hy Lạp rằng Đức Giê-su nhận biết bản chất xấu xa trong cách họ tiếp cận, nhưng không suy diễn thành một tuyên bố giáo lý rộng hơn điều câu này nói.
- issue: Sắc thái của πειράζω đối với hành động nhắm vào Đức Giê-su
  choice: thử tôi
  alternative: thử thách tôi; cám dỗ tôi
  rationale: Ngữ cảnh cho thấy họ muốn kiểm tra với ý đồ gài bẫy. “Thử” bảo tồn sự đa nghĩa của động từ, còn chú thích ghi nhận khả năng dịch khác.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “Đức Giê-su” theo lối gọi kính trọng phổ biến; “các người” thể hiện lời quở trách trực tiếp mà không thêm sắc thái khẩu ngữ quá mạnh.
