  to: 'Nhưng Đức Giê-su biết ác ý của họ, nói: “Tại sao các người thử tôi[a], hỡi những kẻ đạo đức giả?”'
  rationale: Chỉ sửa “nên nói” thành “nói” để không thêm sắc thái nhân-quả. Các lựa chọn từ vựng còn lại giữ nguyên vì trung thành với nguyên ngữ, tự nhiên và nhất quán với chú thích tiếng Anh.
