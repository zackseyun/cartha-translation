id: MAT.22.4
reference: Matthew 22:4
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: πάλιν ἀπέστειλεν ἄλλους δούλους λέγων· Εἴπατε τοῖς κεκλημένοις· Ἰδοὺ τὸ ἄριστόν μου ⸀ἡτοίμακα, οἱ ταῦροί μου καὶ τὰ σιτιστὰ τεθυμένα, καὶ πάντα ἕτοιμα· δεῦτε εἰς τοὺς γάμους.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/004.yaml
  text: Again he sent other servants[a], saying, ‘Tell those who have been invited, “Look, I have prepared my dinner; my oxen and my fattened cattle have been slaughtered, and everything is ready[c][b]. Come to the wedding feast.”’
translation:
  language: vi
  text: 'Ông lại sai những nô lệ khác đi và dặn: “Hãy nói với những người đã được mời rằng: ‘Này, ta đã chuẩn bị tiệc rồi; bò đực và súc vật vỗ béo của ta đã được làm thịt, mọi thứ đều đã sẵn sàng. Hãy đến dự tiệc cưới.’”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πάλιν ἀπέστειλεν
  choice: Ông lại sai ... đi
  rationale: Diễn đạt tự nhiên hành động được lặp lại; “sai ... đi” cũng giữ sắc thái người có thẩm quyền phái người dưới quyền.
- source_word: ἄλλους δούλους
  choice: những đầy tớ khác
  rationale: “Đầy tớ” phù hợp ngữ cảnh gia nhân dưới quyền một vị vua, đồng thời tránh khiến độc giả hiện đại hiểu từ này chỉ theo mô hình nô lệ cận đại. Từ Hy Lạp có thể chỉ đầy tớ hoặc nô lệ tùy ngữ cảnh.
- source_word: Εἴπατε τοῖς κεκλημένοις
  choice: Hãy nói với những người đã được mời
  rationale: 'Giữ ý của phân từ hoàn thành bị động: lời mời đã được đưa ra và những người ấy hiện vẫn là khách được mời.'
- source_word: Ἰδοὺ
  choice: Này
  rationale: Tiểu từ thu hút sự chú ý, được chuyển sang tiếng Việt hiện đại, trang trọng vừa phải.
- source_word: τὸ ἄριστόν μου ἡτοίμακα
  choice: ta đã chuẩn bị tiệc rồi
  rationale: ἄριστον chỉ bữa ăn đã dọn, thường là bữa sớm hơn trong ngày; trong bối cảnh này, “tiệc” tự nhiên hơn “bữa trưa”, còn “đã ... rồi” thể hiện sự chuẩn bị đã hoàn tất và kết quả hiện còn.
- source_word: οἱ ταῦροί μου
  choice: bò đực ... của ta
  rationale: ταῦροι chỉ bò đực; cách dịch này chính xác hơn “bò” chung chung và không mặc nhiên cho rằng đó là bò thiến kéo cày.
- source_word: τὰ σιτιστὰ
  choice: súc vật vỗ béo
  rationale: Tính từ danh hóa chỉ những con vật được nuôi béo để giết thịt, không xác định riêng là bê hay bò; bản dịch tránh bổ sung loài hoặc độ tuổi không có trong tiếng Hy Lạp.
- source_word: τεθυμένα
  choice: đã được làm thịt
  rationale: Trong ngữ cảnh chuẩn bị bữa tiệc, động từ nói đến việc giết súc vật làm thức ăn; “làm thịt” tự nhiên và không gợi sai sang nghi lễ hiến tế.
- source_word: πάντα ἕτοιμα
  choice: mọi thứ đều đã sẵn sàng
  rationale: Giữ phạm vi toàn diện của πάντα và trạng thái sẵn sàng hiện tại.
- source_word: δεῦτε εἰς τοὺς γάμους
  choice: Hãy đến dự tiệc cưới
  rationale: Số nhiều τὰ γάμα có thể chỉ lễ cưới hoặc các cuộc vui cưới nói chung; “dự tiệc cưới” tự nhiên trong ngữ cảnh bữa tiệc đã dọn.
theological_decisions:
- issue: Địa vị xã hội hàm chứa trong δοῦλος
  choice: đầy tớ
  alternative: nô lệ
  rationale: Ngữ cảnh cho thấy họ là người trong nhà hoàn toàn dưới quyền vua, nhưng câu không tập trung vào chế độ pháp lý của họ. “Đầy tớ” giữ quan hệ phục dịch và quyền sai phái trong tiếng Việt trang trọng; phương án “nô lệ” tuy có thể đúng về địa vị nhưng dễ thu hẹp nghĩa theo một hình thái lịch sử cụ thể.
- issue: Phạm vi nghĩa của τοὺς γάμους
  choice: tiệc cưới
  alternative: lễ cưới
  rationale: Bối cảnh trực tiếp nhấn mạnh bữa ăn cùng các súc vật đã làm thịt, nên “tiệc cưới” thích hợp; tuy vậy, danh từ số nhiều có thể bao quát cả lễ hội cưới.
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng và dễ hiểu. Đại từ “ông/ta” phù hợp lời kể về nhân vật chủ tiệc trong dụ ngôn; mệnh lệnh được diễn đạt rõ mà không dùng từ cổ.
