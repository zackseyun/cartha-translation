- from: 'Ông lại sai những đầy tớ khác đi và dặn: “Hãy nói với những người đã được mời rằng: ‘Này, ta đã chuẩn bị tiệc rồi; bò đực và súc vật vỗ béo của ta đã được làm thịt, mọi thứ đều đã sẵn sàng. Hãy đến dự tiệc cưới.’”'
  to: 'Ông lại sai những nô lệ khác đi và dặn: “Hãy nói với những người đã được mời rằng: ‘Này, ta đã chuẩn bị tiệc rồi; bò đực và súc vật vỗ béo của ta đã được làm thịt, mọi thứ đều đã sẵn sàng. Hãy đến dự tiệc cưới.’”'
  rationale: Chỉ sửa cách dịch δούλους từ “đầy tớ” thành “nô lệ” để giữ rõ quan hệ lệ thuộc hàm chứa trong nguyên ngữ. Các thành phần còn lại đã trung thành với tiếng Hy Lạp và tự nhiên trong tiếng Việt hiện đại.
