revisions:
- from: Các nô lệ ấy đi ra các ngả đường và tập hợp tất cả những người họ tìm thấy, cả người ác lẫn người tốt; phòng tiệc cưới[a] đầy những khách đang ngả mình bên bàn ăn[b].
  to: Các nô lệ ấy đi ra các con đường và tập hợp tất cả những người họ tìm thấy, cả người ác lẫn người tốt; phòng tiệc cưới[a] đã đầy những khách đang ngả mình dùng bữa[b].
  rationale: Chỉnh “các ngả đường” thành “các con đường” để phản ánh tự nhiên hơn ὁδούς. Chỉnh vế cuối thành “đã đầy những khách đang ngả mình dùng bữa” để làm rõ kết quả của ἐπλήσθη và diễn đạt tự nhiên, trung thành với ἀνακειμένων. Giữ nguyên các lựa chọn thuật ngữ và chú thích thiết yếu.
