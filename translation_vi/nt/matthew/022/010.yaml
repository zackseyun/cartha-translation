id: MAT.22.10
reference: Matthew 22:10
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἐξελθόντες οἱ δοῦλοι ἐκεῖνοι εἰς τὰς ὁδοὺς συνήγαγον πάντας ⸀οὓς εὗρον, πονηρούς τε καὶ ἀγαθούς· καὶ ἐπλήσθη ὁ ⸀γάμος ἀνακειμένων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/010.yaml
  text: And those servants went out into the roads and gathered everyone they found[a], both evil and good[c][b]; and the wedding hall was filled with guests reclining at the table.
translation:
  language: vi
  text: Các nô lệ ấy đi ra các con đường và tập hợp tất cả những người họ tìm thấy, cả người ác lẫn người tốt; phòng tiệc cưới[a] đã đầy những khách đang ngả mình dùng bữa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sát chữ là “đám cưới”; ở đây từ này có thể chỉ tiệc cưới hoặc phòng diễn ra tiệc cưới, vì nơi ấy được mô tả là đầy người dự tiệc.
    reason: lexical_alternative
  - marker: b
    text: Theo tập quán trong các bữa tiệc trang trọng thời ấy, khách thường ngả mình khi dùng bữa.
    reason: cultural_note
lexical_decisions:
- source_word: δοῦλοι
  choice: nô lệ
  rationale: Giữ rõ địa vị lệ thuộc của những người phục vụ nhà vua trong bối cảnh xã hội của dụ ngôn, thay vì làm nhẹ thành một từ chỉ người phục vụ nói chung.
- source_word: ὁδοὺς
  choice: các ngả đường
  rationale: Diễn đạt tự nhiên số nhiều của ὁδός và chỉ chung những tuyến đường công cộng nơi họ có thể gặp người.
- source_word: συνήγαγον πάντας οὓς εὗρον
  choice: tập hợp tất cả những người họ tìm thấy
  rationale: Giữ trọn ý bao quát của πάντας cùng mệnh đề quan hệ, đồng thời dùng lối diễn đạt rõ ràng trong tiếng Việt hiện đại.
- source_word: πονηρούς τε καὶ ἀγαθούς
  choice: cả người ác lẫn người tốt
  rationale: Bảo toàn sự đối lập luân lý mạnh trong tiếng Hy Lạp và phạm vi mời gọi không phân biệt, nhưng không suy diễn ý nghĩa thần học vượt quá câu văn.
- source_word: γάμος
  choice: phòng tiệc cưới
  rationale: Trong ngữ cảnh, γάμος được nói là đầy những người dự tiệc, nên cách gọi này diễn đạt nghĩa hoán dụ về không gian diễn ra tiệc cưới; chú thích vẫn nêu nghĩa sát chữ.
- source_word: ἐπλήσθη
  choice: đầy
  rationale: Diễn đạt gọn và tự nhiên trạng thái nơi dự tiệc đã được lấp đầy.
- source_word: ἀνακειμένων
  choice: những khách đang ngả mình bên bàn ăn
  rationale: Phản ánh tư thế ngả mình khi dùng bữa trang trọng trong thế giới Địa Trung Hải cổ đại và làm rõ rằng đây là những người dự tiệc.
theological_decisions:
- issue: Đặc điểm luân lý của những người được tập hợp
  choice: cả người ác lẫn người tốt
  alternative: cả người xấu lẫn người tốt
  rationale: “Người ác” giữ sức nặng luân lý của πονηρούς, đồng thời câu dịch chỉ trình bày phạm vi tập hợp rộng rãi chứ không giải quyết trước sự phân biệt xuất hiện về sau trong dụ ngôn.
translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng hiện đại, dùng từ phổ thông và giữ hình ảnh văn hóa cổ khi hình ảnh ấy có ý nghĩa trong cảnh tiệc cưới.
