reference: Matthew 22:25
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἦσαν δὲ παρ’ ἡμῖν ἑπτὰ ἀδελφοί· καὶ ὁ πρῶτος ⸀γήμας ἐτελεύτησεν, καὶ μὴ ἔχων σπέρμα ἀφῆκεν τὴν γυναῖκα αὐτοῦ τῷ ἀδελφῷ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/025.yaml
  text: There were seven brothers among us[a]. The first married and died, and having no offspring[b], he left his wife to his brother.
translation:
  language: vi
  text: Trong số chúng tôi có bảy anh em trai. Người thứ nhất lấy vợ rồi qua đời, không có con nối dõi[a], và để lại vợ mình cho người anh em của mình[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Theo nghĩa đen là “không có hạt giống”; ở đây “hạt giống” chỉ con cái hoặc dòng dõi.
    reason: lexical_alternative
  - marker: b
    text: 'Câu này phản ánh tục hôn nhân nối dõi: người anh em của người đã chết được trông đợi sẽ cưới góa phụ để sinh con nối dõi cho người đã chết; xem Phục Truyền Luật Lệ Ký 25:5.'
    reason: cultural_note
lexical_decisions:
- source_word: παρ’ ἡμῖν
  choice: trong số chúng tôi
  rationale: παρά với cách ba ở đây diễn tả sự hiện diện hoặc liên hệ trong nhóm; cách nói này tự nhiên trong tiếng Việt và không thêm một từ chỉ thời gian như “bấy giờ”.
- source_word: ἑπτὰ ἀδελφοί
  choice: bảy anh em trai
  rationale: Trong tình huống hôn nhân nối dõi, ἀδελφοί chỉ các anh em ruột nam; thêm “trai” làm rõ giới tính mà ngữ cảnh Hy Lạp đã xác định.
- source_word: ὁ πρῶτος
  choice: người thứ nhất
  rationale: πρῶτος đánh dấu thứ tự trong nhóm, không nhất thiết cho biết đây là người lớn tuổi nhất.
- source_word: γήμας
  choice: lấy vợ
  rationale: Phân từ bất định cho biết việc kết hôn xảy ra trước khi người ấy qua đời; “lấy vợ” tự nhiên và phù hợp với việc người vợ được nhắc ngay sau đó.
- source_word: ἐτελεύτησεν
  choice: qua đời
  rationale: Động từ có nghĩa là chết hoặc kết thúc cuộc đời; “qua đời” là cách diễn đạt hiện đại, trang trọng và rõ nghĩa.
- source_word: μὴ ἔχων σπέρμα
  choice: không có con nối dõi
  rationale: σπέρμα theo nghĩa đen là “hạt giống”, nhưng trong bối cảnh gia đình và luật hôn nhân này chỉ con cái hoặc dòng dõi. “Con nối dõi” giữ được sắc thái huyết thống và mục đích pháp lý.
- source_word: ἀφῆκεν τὴν γυναῖκα αὐτοῦ
  choice: ông để vợ mình lại
  rationale: ἀφίημι ở đây có nghĩa để lại sau khi chết, không phải ly dị hay ruồng bỏ; “để ... lại” thể hiện rõ sắc thái ấy.
- source_word: τῷ ἀδελφῷ αὐτοῦ
  choice: cho người anh em của mình
  rationale: Cách ba chỉ người anh em còn sống là người nhận trách nhiệm theo tục hôn nhân nối dõi. “Người anh em” tránh ép văn bản phải nói đó là anh hay em, điều tiếng Hy Lạp không xác định.
theological_decisions:
- issue: Có nên nói rõ trong chính văn rằng người anh em phải cưới góa phụ hay không
  choice: Giữ cách diễn đạt hàm ẩn, chỉ dịch điều câu Hy Lạp nói trực tiếp.
  alternative: Mở rộng thành “để người anh em của mình cưới”.
  rationale: Bối cảnh luật hôn nhân nối dõi trong Phục Truyền Luật Lệ Ký 25:5 rõ ràng được giả định, nhưng câu Hy Lạp không trực tiếp thêm động từ “cưới”. Chú thích giải thích phong tục mà không đưa phần diễn giải vào chính văn.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “người thứ nhất” để giữ thứ tự mà không suy thành tuổi tác; dùng “người anh em” để bảo tồn sự không xác định giữa anh và em trong nguyên ngữ. Hai dấu chú thích đều được đặt tại nội dung tương ứng trong chính văn.
