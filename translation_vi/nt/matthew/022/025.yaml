revisions:
- from: Trong số chúng tôi có bảy anh em trai. Người thứ nhất lấy vợ rồi qua đời; vì không có con nối dõi[a], ông để vợ mình lại cho người anh em của mình[b].
  to: Trong số chúng tôi có bảy anh em trai. Người thứ nhất lấy vợ rồi qua đời, không có con nối dõi[a], và để lại vợ mình cho người anh em của mình[b].
  rationale: Chỉnh sửa tối thiểu để tránh thêm sắc thái nguyên nhân không được đánh dấu rõ trong nguyên ngữ và để dùng trật tự từ tự nhiên hơn. Các dấu chú thích vẫn gắn đúng với “con nối dõi” và với chi tiết người anh em nhận người vợ.
