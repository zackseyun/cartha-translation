  text: ὕστερον δὲ πάντων ἀπέθανεν ⸀ἡ γυνή.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/027.yaml
  text: Last of all[a], the woman died.
translation:
  language: vi
  text: Sau hết, người phụ nữ ấy cũng chết.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὕστερον δὲ πάντων
  choice: Sau hết
  rationale: Cụm này đánh dấu sự việc cuối cùng trong chuỗi đã kể. “Sau hết” diễn đạt tự nhiên ý “cuối cùng/sau tất cả những người ấy” mà không làm câu nặng nề.
- source_word: δὲ
  choice: không dịch thành một liên từ riêng
  rationale: δέ là từ nối nhẹ; sắc thái tiếp nối được thể hiện tự nhiên trong cụm “Sau hết” và diễn tiến của câu.
- source_word: ἀπέθανεν
  choice: chết
  rationale: Động từ chỉ thẳng sự kiện qua đời; “chết” là cách tương đương trực tiếp, không dùng uyển ngữ.
- source_word: ἡ γυνή
  choice: người phụ nữ ấy
  rationale: γυνή có thể là “người phụ nữ” hoặc “vợ”. Trong tình huống một người lần lượt kết hôn với nhiều anh em, “người phụ nữ ấy” giữ cách quy chiếu trung tính của tiếng Hy Lạp.
- source_word: πάντων
  choice: hàm chứa trong “Sau hết”
  rationale: Dạng sở hữu số nhiều kết hợp với ὕστερον tạo thành thành ngữ chỉ vị trí cuối cùng trong toàn bộ chuỗi; tiếng Việt không cần dịch tách thành “trong tất cả”.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Thêm “cũng” để diễn đạt tự nhiên việc người phụ nữ chết sau tất cả những người đã được nhắc đến, phù hợp với quan hệ trình tự của câu Hy Lạp.
