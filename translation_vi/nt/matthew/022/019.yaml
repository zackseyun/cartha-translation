  text: Show me the coin for the tax[a]. And they brought him a denarius.
translation:
  language: vi
  text: “Hãy cho tôi xem đồng tiền nộp thuế[a].” Họ bèn đem đến cho Ngài một đồng đơ-ni-ê.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “thuế thân” hoặc “thuế theo việc kiểm kê dân số”; từ κῆνσος chỉ một sắc thuế của đế quốc Rô-ma.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιδείξατέ
  choice: Hãy cho tôi xem
  rationale: Mệnh lệnh aorist số nhiều của ἐπιδείκνυμι mang ý đưa vật ra để người nói xem xét; cách diễn đạt này tự nhiên và giữ được sắc thái thị giác hơn “hãy đem đến”.
- source_word: νόμισμα
  choice: đồng tiền
  rationale: νόμισμα chỉ đồng tiền đang lưu hành; “đồng tiền” rõ ràng, tự nhiên và phù hợp khi câu sau xác định đó là một đồng đê-na-ri-ôn.
- source_word: τοῦ κήνσου
  choice: dùng để nộp thuế
  rationale: κῆνσος là từ vay mượn Latin chỉ sắc thuế của đế quốc Rô-ma đang được bàn đến. Cách dịch này diễn đạt quan hệ của đồng tiền với việc nộp thuế mà không xác định quá mức loại thuế trong chính văn.
- source_word: προσήνεγκαν
  choice: đem đến
  rationale: Động từ aorist của προσφέρω ở đây thuật lại việc họ mang đồng tiền đến cho Đức Giê-su; “đem đến” là cách kể tự nhiên trong tiếng Việt.
- source_word: δηνάριον
  choice: một đồng đê-na-ri-ôn
  rationale: δηνάριον là tên một đơn vị tiền kim loại cụ thể của Rô-ma. Phiên âm giữ được tính lịch sử, còn “một đồng” làm câu tự nhiên và cho biết đây là đồng tiền.
