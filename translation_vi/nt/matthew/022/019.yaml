translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Ngài” để quy chiếu Đức Giê-su trong lời kể; giữ tên đồng tiền cổ bằng phiên âm tiếng Việt. Dấu [a] được đặt ngay sau “thuế” trong chính văn.
