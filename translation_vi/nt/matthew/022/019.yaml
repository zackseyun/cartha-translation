  rationale: Chỉnh cách gọi đồng tiền sang dạng Việt ngữ hiện hành và làm gọn cụm chỉ đồng tiền liên hệ với thuế. Chú thích được điều chỉnh về độ tự nhiên mà vẫn nêu những khả năng từ vựng của κῆνσος, không áp đặt một cách hiểu cụ thể trong chính văn.
