base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/040.yaml
  text: On these two commandments hang the whole Law and the Prophets[a][b].
translation:
  language: vi
  text: Toàn bộ Luật pháp và Các Sách Tiên Tri đều treo trên hai điều răn này.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Luật pháp và Các Sách Tiên Tri” là công thức chỉ các phần Kinh Thánh có thẩm quyền này; chúng đều tùy thuộc vào hai điều răn ấy.
    reason: cross_reference
lexical_decisions:
- source_word: ἐν ταύταις ταῖς δυσὶν ἐντολαῖς
  choice: trên hai điều răn này
  rationale: 'Giữ quan hệ của giới từ ἐν trong sự kết hợp với hình ảnh κρέμαται bằng cách dùng lối nói tự nhiên trong tiếng Việt: “treo trên”. Cách này diễn tả sự tùy thuộc mà không thay hình ảnh bằng một lời giải thích.'
- source_word: ὅλος ὁ νόμος
  choice: toàn bộ Luật pháp
  rationale: “Toàn bộ” bảo toàn sắc thái tổng thể của ὅλος; “Luật pháp” chỉ Torah trong công thức Kinh Thánh này, chứ không phải luật lệ nói chung.
- source_word: κρέμαται
  choice: đều treo
  rationale: Dịch trực tiếp hình ảnh của κρέμαται, đồng thời thêm “đều” cho câu tiếng Việt tự nhiên và để cho thấy cả hai thành phần—Luật pháp và các sách Tiên tri—cùng có quan hệ ấy với hai điều răn.
- source_word: καὶ οἱ προφῆται
  choice: và các sách Tiên tri
  rationale: Trong công thức “Luật pháp và các sách Tiên tri”, οἱ προφῆται chỉ bộ phận Kinh Thánh mang tên Các Sách Tiên Tri. Thêm “các sách” giúp độc giả Việt hiểu đây là văn liệu Kinh Thánh, không chỉ là những con người làm tiên tri.
theological_decisions:
- issue: Ý nghĩa của công thức “Luật pháp và các sách Tiên tri”
  choice: Giữ nguyên công thức chỉ toàn bộ chứng ngôn Kinh Thánh được quy tụ và tùy thuộc vào hai điều răn yêu thương
  alternative: Diễn giải hẹp là chỉ các giáo huấn đạo đức trong luật pháp và lời tiên tri
  rationale: Trong Ma-thi-ơ, đây là công thức quen thuộc chỉ Kinh Thánh có thẩm quyền. Bản dịch không thay bằng “toàn bộ Kinh Thánh” hay “mọi mệnh lệnh của Đức Chúa Trời”, nhờ đó vẫn giữ được âm hưởng quy điển và sự căng thẳng của hình ảnh “treo trên”.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Trật tự câu được đảo để câu tiếng Việt tự nhiên mà vẫn giữ trọng tâm tổng thể của ὅλος và hình ảnh “treo trên”. Dùng “các sách Tiên tri” để làm rõ ý nghĩa văn liệu của οἱ προφῆται.
