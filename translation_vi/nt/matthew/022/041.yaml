  yaml_path: translation/nt/matthew/022/041.yaml
  text: While the Pharisees were gathered together, Jesus asked them,
translation:
  language: vi
  text: 'Khi những người Pha-ri-si đang tụ họp, Đức Giê-su hỏi họ:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Συνηγμένων
  choice: đang tụ họp
  rationale: Phân từ aorist thụ động trong kết cấu sở hữu cách tuyệt đối tạo bối cảnh cho hành động chính. Cách dịch này tự nhiên trong tiếng Việt, giữ được ý cả nhóm đang ở cùng nhau mà không nhấn quá mức sắc thái bị động.
- source_word: δὲ
  choice: không dịch thành từ riêng
  rationale: δέ đánh dấu sự chuyển tiếp nhẹ. Trong câu tiếng Việt này, quan hệ diễn ngôn được thể hiện tự nhiên qua mệnh đề mở đầu “Khi...”; thêm “bấy giờ” hoặc “còn” dễ tạo sắc thái thời gian hay tương phản mạnh hơn nguyên văn.
- source_word: τῶν Φαρισαίων
  choice: những người Pha-ri-si
  rationale: Tên gọi thông dụng của nhóm Φαρισαῖοι; sở hữu cách thuộc kết cấu tuyệt đối với Συνηγμένων.
- source_word: ἐπηρώτησεν
  choice: hỏi
  rationale: Động từ aorist chỉ việc Đức Giê-su nêu câu hỏi; “hỏi” là cách diễn đạt hiện đại, tự nhiên và không tự ý tăng sắc thái đối chất.
- source_word: αὐτοὺς
  choice: họ
  rationale: Đại từ làm tân ngữ, quy chiếu về những người Pha-ri-si vừa được nhắc đến.
- source_word: ὁ Ἰησοῦς
  choice: Đức Giê-su
  rationale: Tên riêng làm chủ ngữ. “Đức Giê-su” là cách gọi trang trọng, quen thuộc trong văn phong Kinh Thánh tiếng Việt.
theological_decisions: []
translation_notes:
