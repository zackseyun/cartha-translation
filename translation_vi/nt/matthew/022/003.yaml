id: MAT.22.3
reference: Matthew 22:3
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἀπέστειλεν τοὺς δούλους αὐτοῦ καλέσαι τοὺς κεκλημένους εἰς τοὺς γάμους, καὶ οὐκ ἤθελον ἐλθεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/003.yaml
  text: And he sent his servants to call those who had been invited to the wedding feast[c][b][a], and they were unwilling to come.
translation:
  language: vi
  text: Vua sai các đầy tớ[a] đi gọi những người đã được mời[b] đến dự tiệc cưới[c], nhưng họ không muốn đến.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “nô lệ”. Từ Hy Lạp có thể chỉ đầy tớ hoặc nô lệ; ở đây câu chuyện nhấn mạnh vai trò của họ là những người được vua sai đi.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch sát hơn là “những người đã được gọi”. Tiếng Hy Lạp dùng cùng một họ động từ với từ “gọi” ở trước; trong bối cảnh này, từ ấy nói đến những người đã được mời từ trước.
    reason: lexical_alternative
  - marker: c
    text: Cũng có thể dịch là “lễ cưới” hoặc “yến tiệc cưới”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: sai ... đi
  rationale: Động từ aorist ἀποστέλλω mang nghĩa sai hoặc phái đi. Cách nói “sai ... đi” tự nhiên trong tiếng Việt và phù hợp với việc vua giao nhiệm vụ cho các đầy tớ.
- source_word: δούλους
  choice: các đầy tớ
  rationale: δοῦλος có thể chỉ đầy tớ hoặc nô lệ. Trong dụ ngôn này, trọng tâm là vai trò của họ như những người thi hành lệnh vua, nên “đầy tớ” vừa đúng ngữ cảnh vừa tự nhiên; chú thích giữ lại nghĩa “nô lệ” như một khả năng từ vựng.
- source_word: καλέσαι
  choice: đi gọi
  rationale: Động từ nguyên mẫu chỉ mục đích của việc sai đi. “Gọi” giữ được nghĩa cơ bản của καλέω và phần nào phản ánh sự lặp lại cùng họ từ với κεκλημένους.
- source_word: κεκλημένους
  choice: những người đã được mời
  rationale: Phân từ hoàn thành bị động chỉ những người đã nhận lời mời từ trước. Trong bối cảnh tiệc cưới, “đã được mời” rõ nghĩa và tự nhiên hơn “đã được gọi”.
- source_word: εἰς τοὺς γάμους
  choice: đến dự tiệc cưới
  rationale: Số nhiều γάμοι ở đây chỉ lễ hội hoặc yến tiệc cưới. “Đến dự tiệc cưới” diễn đạt rõ đích đến và tính chất của dịp này trong tiếng Việt.
- source_word: οὐκ ἤθελον ἐλθεῖν
  choice: họ không muốn đến
  rationale: ἤθελον với động từ nguyên mẫu nhấn mạnh ý muốn. “Không muốn đến” bám sát sắc thái ý chí mà không tăng mức độ thành “từ chối đến”.
theological_decisions:
- issue: Cách dịch δοῦλος trong dụ ngôn về nhà vua
  choice: đầy tớ
  alternative: nô lệ
  rationale: Mạch truyện nhấn mạnh những người được vua sai đi truyền lời hơn là địa vị lệ thuộc của họ. “Đầy tớ” phù hợp với chức năng trong câu, còn chú thích ghi nhận nghĩa “nô lệ” để không che khuất phạm vi nghĩa của từ Hy Lạp.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Vua” làm chủ ngữ theo nhân vật đã được nêu trong ngữ cảnh liền trước. Liên từ “nhưng” thể hiện quan hệ tương phản vốn được καί đảm nhiệm theo ngữ cảnh. Cấu trúc “không muốn đến” giữ nguyên trọng tâm về ý chí, không diễn giải mạnh thành sự khước từ công khai.
