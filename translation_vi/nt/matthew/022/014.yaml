id: MAT.22.14
reference: Matthew 22:14
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: πολλοὶ γάρ εἰσιν κλητοὶ ὀλίγοι δὲ ἐκλεκτοί.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/014.yaml
  text: For many are called[b][a], but few are chosen.
translation:
  language: vi
  text: Vì nhiều người được gọi[a], nhưng ít người được chọn[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “được mời”; trong bối cảnh này, từ Hy Lạp có thể chỉ việc được mời dự tiệc.
    reason: lexical_alternative
  - marker: b
    text: Hay “được tuyển chọn”.
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὶ
  choice: nhiều người
  rationale: Tính từ được dùng như danh từ số nhiều; “nhiều người” tự nhiên trong tiếng Việt và giữ rõ thế đối lập với “ít người”.
- source_word: γάρ
  choice: vì
  rationale: Diễn tả lời giải thích hoặc căn cứ cho điều vừa nói trong dụ ngôn; “vì” giữ được chức năng liên kết ấy.
- source_word: εἰσιν
  choice: được / là (thể hiện trong cấu trúc câu)
  rationale: Động từ “là” trong tiếng Hy Lạp được diễn đạt tự nhiên qua hai cấu trúc bị động “được gọi” và “được chọn”; không cần dịch thành một từ riêng trong tiếng Việt.
- source_word: κλητοὶ
  choice: được gọi
  rationale: Giữ nghĩa rộng của κλητοί và sự tương ứng cô đọng với “được chọn”; trong bối cảnh tiệc cưới, từ này cũng có thể mang nghĩa “được mời”, nên phương án ấy được ghi ở chú thích.
- source_word: ὀλίγοι
  choice: ít người
  rationale: Đối ứng trực tiếp với πολλοί và tạo câu cách ngôn ngắn gọn, tự nhiên.
- source_word: δὲ
  choice: nhưng
  rationale: Thể hiện rõ quan hệ tương phản giữa số đông được gọi và số ít được chọn.
- source_word: ἐκλεκτοί
  choice: được chọn
  rationale: Phản ánh nghĩa từ vựng trực tiếp, dễ hiểu trong tiếng Việt hiện đại và không áp đặt một hệ thống thần học về sự tuyển chọn.
theological_decisions:
- issue: Cách dịch ἐκλεκτοί trong câu thường được viện dẫn khi bàn về sự kêu gọi và tuyển chọn
  choice: được chọn
  alternative: được tuyển chọn
  rationale: “Được chọn” truyền đạt nghĩa trực tiếp của từ Hy Lạp mà không biến câu dịch thành lời khẳng định của một hệ phái; chú thích giữ lại cách nói “được tuyển chọn” vốn có sắc thái thần học rõ hơn.
- issue: Cách dịch κλητοί ở phần kết dụ ngôn tiệc cưới
  choice: được gọi
  alternative: được mời
  rationale: “Được mời” rất phù hợp với hình ảnh bữa tiệc ngay trong văn cảnh, còn “được gọi” giữ được phạm vi nghĩa rộng hơn và thế tương ứng với “được chọn”. Chú thích bảo tồn nghĩa gắn với lời mời dự tiệc.
translation_notes:
  register: Văn phong ngắn gọn, trang trọng vừa phải và dễ hiểu trong tiếng Việt hiện đại. Cấu trúc cân đối “nhiều người… nhưng ít người…” giữ tính cách ngôn của nguyên văn; các chú thích bảo tồn cả sắc thái tiệc cưới lẫn chiều kích thần học mà không phân xử theo hệ phái.
