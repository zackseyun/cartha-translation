  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οἱ δὲ ἀμελήσαντες ἀπῆλθον, ⸀ὃς μὲν εἰς τὸν ἴδιον ἀγρόν, ⸁ὃς δὲ ⸀ἐπὶ τὴν ἐμπορίαν αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/005.yaml
  text: But they paid no attention and went away[a], one to his own field, another to his business.
translation:
  language: vi
  text: Nhưng họ chẳng để tâm[a] và bỏ đi, người thì đến ruộng riêng của mình, người thì đi lo việc buôn bán.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “xem nhẹ việc ấy” hoặc “không quan tâm”; theo văn cảnh, điều họ không để tâm là lời mời của vua.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμελήσαντες
  choice: chẳng để tâm
  rationale: Phân từ này diễn tả thái độ thờ ơ, không quan tâm hoặc xem nhẹ. “Chẳng để tâm” tự nhiên trong tiếng Việt hiện đại, giữ được sắc thái coi thường, trong khi đối tượng được ngầm hiểu từ văn cảnh là lời mời của vua.
- source_word: ἀπῆλθον
  choice: bỏ đi
  rationale: Cụm từ diễn tả việc rời đi sau khi nhận lời triệu mời. “Bỏ đi” vừa tự nhiên vừa gợi được thái độ không hưởng ứng, nhưng không thêm một đích đến ngoài những gì vế sau nêu rõ.
- source_word: ὃς μὲν ... ὃς δὲ
  choice: người thì ... người thì
  rationale: Kết cấu phân phối và đối chiếu này được chuyển bằng cách nói tiếng Việt tự nhiên “người thì ... người thì”, phân biệt các thành viên trong nhóm và những hướng đi khác nhau.
- source_word: εἰς τὸν ἴδιον ἀγρόν
  choice: đến ruộng riêng của mình
  rationale: “Ruộng” là nghĩa trực tiếp, phù hợp của ἀγρός trong văn cảnh; “riêng của mình” bảo toàn ἴδιον và sự đối lập giữa mối bận tâm cá nhân với lời mời.
- source_word: ἐπὶ τὴν ἐμπορίαν αὐτοῦ
  choice: đi lo việc buôn bán
  rationale: ἐμπορία chỉ hoạt động thương mại hay kinh doanh. “Đi lo việc buôn bán” là cách diễn đạt rõ ràng, tự nhiên, đồng thời giữ sự tương phản với công việc đồng ruộng.
theological_decisions:
- issue: Đối tượng ngầm hiểu của ἀμελήσαντες
  choice: Giữ đối tượng ở dạng ngầm hiểu qua “chẳng để tâm”, với chú thích nêu rằng văn cảnh chỉ về lời mời của vua.
  alternative: “Xem thường lời mời ấy” hoặc “không quan tâm đến lời mời”
  rationale: Bản Hy Lạp không nêu trực tiếp tân ngữ, dù văn cảnh cho thấy đó là lời mời của vua. Bản dịch chính giữ cách diễn đạt cô đọng và sự hàm ẩn của nguyên tác; chú thích làm rõ khả năng hiểu mà không đưa thêm nội dung thần học.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “chẳng để tâm” để thể hiện thái độ thờ ơ; dùng cấu trúc nhịp nhàng “người thì ... người thì” để giữ phép đối chiếu của câu Hy Lạp.
