id: MAT.22.13
reference: Matthew 22:13
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: τότε ⸂ὁ βασιλεὺς εἶπεν⸃ τοῖς διακόνοις· Δήσαντες αὐτοῦ πόδας καὶ χεῖρας ⸂ἐκβάλετε αὐτὸν⸃ εἰς τὸ σκότος τὸ ἐξώτερον· ἐκεῖ ἔσται ὁ κλαυθμὸς καὶ ὁ βρυγμὸς τῶν ὀδόντων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/013.yaml
  text: Then the king said to the attendants[a], ‘Bind his feet and hands and throw him out into the outer darkness. In that place there will be weeping and gnashing of teeth.’
translation:
  language: vi
  text: 'Bấy giờ, vua phán với những người phục vụ[a]: “Hãy trói chân và tay người ấy lại, rồi quăng người ấy ra chỗ tối tăm bên ngoài. Ở đó sẽ có khóc lóc và nghiến răng.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “những đầy tớ”.
    reason: διάκονος trong bối cảnh này có thể chỉ người phục vụ hoặc đầy tớ; bản chính chọn cách gọi theo chức năng để tránh khẳng định địa vị xã hội cụ thể.
lexical_decisions:
- source_word: τότε
  choice: Bấy giờ
  rationale: Diễn đạt tự nhiên trạng từ thời gian mở đầu diễn biến kế tiếp trong câu chuyện.
- source_word: ὁ βασιλεὺς
  choice: vua
  rationale: Giữ nguyên hình ảnh hoàng gia rõ ràng của dụ ngôn.
- source_word: τοῖς διακόνοις
  choice: với những người phục vụ
  rationale: Phù hợp với những người thi hành lệnh tại tiệc cưới, đồng thời tránh sắc thái chức vụ giáo hội mà từ “chấp sự” có thể gợi ra.
- source_word: Δήσαντες
  choice: Hãy trói ... lại, rồi
  rationale: Chuyển phân từ aorist đi trước mệnh lệnh chính thành chuỗi mệnh lệnh tự nhiên trong tiếng Việt, vẫn thể hiện hành động trói xảy ra trước việc quăng ra ngoài.
- source_word: αὐτοῦ πόδας καὶ χεῖρας
  choice: chân và tay hắn
  rationale: Giữ thứ tự “chân và tay” của bản Hy Lạp và chỉ rõ đối tượng bằng đại từ “hắn”.
- source_word: ἐκβάλετε αὐτὸν
  choice: quăng hắn ra
  rationale: Truyền đạt sắc thái trục xuất mạnh và đột ngột của ἐκβάλλω bằng ngôn ngữ hiện đại.
- source_word: εἰς τὸ σκότος τὸ ἐξώτερον
  choice: ra nơi tối tăm bên ngoài
  rationale: Giữ hình ảnh không gian cụ thể và sức nặng của thành ngữ trong Ma-thi-ơ mà không diễn giải nó thành một địa điểm thần học cụ thể.
- source_word: ἐκεῖ ἔσται
  choice: Ở đó sẽ có
  rationale: Giữ trọng tâm chỉ nơi chốn của ἐκεῖ và thì tương lai của ἔσται bằng cách diễn đạt tự nhiên.
- source_word: ὁ κλαυθμὸς
  choice: khóc lóc
  rationale: Diễn đạt sự than khóc, phù hợp với công thức lặp lại trong Ma-thi-ơ.
- source_word: ὁ βρυγμὸς τῶν ὀδόντων
  choice: nghiến răng
  rationale: Là cách diễn đạt tiếng Việt tự nhiên và chính xác cho hình ảnh đau đớn hoặc phẫn uất, không thu hẹp ý nghĩa vào chỉ một trạng thái.
theological_decisions:
- issue: Bản chất của hình ảnh bị loại ra trong dụ ngôn
  choice: Giữ nguyên hình ảnh bị quăng ra “nơi tối tăm bên ngoài”.
  alternative: Diễn giải trực tiếp là hỏa ngục, sự phán xét cuối cùng, hoặc chỉ là bị đuổi khỏi tiệc cưới.
  rationale: Câu Hy Lạp dùng hình ảnh phán xét sống động nhưng không tự đồng nhất hình ảnh ấy với một cách giải thích giáo lý duy nhất; bản dịch vì thế không thu hẹp sự căng thẳng thần học của câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Phán” phù hợp lời của vua; “quăng” giữ lực của động từ Hy Lạp. Đại từ “hắn” thể hiện thái độ xa cách trong mệnh lệnh xét xử mà không dùng lối nói cổ.
