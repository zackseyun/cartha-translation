  yaml_path: translation/nt/matthew/022/043.yaml
  text: He said to them[a], “How then does David, in the Spirit, call him Lord[b], saying,”
translation:
  language: vi
  text: 'Ngài nói với họ: “Vậy làm sao Đa-vít, trong Thánh Linh[a], lại gọi người ấy là ‘Chúa’[b] mà nói rằng:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “bởi Thánh Linh.” Cụm từ Hy Lạp có thể diễn tả phạm vi hoặc tác nhân; “trong Thánh Linh” sát với cách diễn đạt của nguyên văn hơn.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “chủ.” Từ Hy Lạp κύριος thường được dịch là “Chúa.”
    reason: alternative_reading
lexical_decisions:
- source_word: λέγει αὐτοῖς
  choice: Ngài nói với họ
  rationale: Thì hiện tại Hy Lạp được dùng như hiện tại lịch sử; tiếng Việt kể chuyện có thể diễn đạt tự nhiên bằng “nói”, còn “Ngài” phù hợp với chủ thể là Chúa Giê-su trong ngữ cảnh.
- source_word: Πῶς οὖν
  choice: Vậy tại sao
  rationale: Trong câu hỏi này, πῶς hỏi về cách thức hay cơ sở của việc Đa-vít gọi Đấng Mê-si là Chúa; “vậy tại sao” truyền đạt tự nhiên cả sức hỏi của πῶς và sắc thái suy luận của οὖν.
- source_word: Δαυὶδ
  choice: Đa-vít
  rationale: Dùng dạng tên riêng quen thuộc trong tiếng Việt.
- source_word: ἐν πνεύματι
  choice: trong Thánh Linh
  rationale: Giữ gần cấu trúc ἐν và hiểu πνεῦμα nhiều khả năng chỉ Thánh Linh trong bối cảnh lời Kinh Thánh được linh cảm; chú thích bảo lưu khả năng diễn đạt tác nhân.
- source_word: καλεῖ αὐτὸν κύριον
  choice: gọi Đấng ấy là ‘Chúa’
  rationale: “Đấng ấy” làm rõ đại từ αὐτόν chỉ Đấng Mê-si đang được bàn đến mà không nêu thêm danh xưng ngoài nguyên văn; “Chúa” giữ ý nghĩa tước hiệu và mối liên hệ với Thi Thiên 110.
- source_word: λέγων
  choice: khi nói rằng
  rationale: Diễn đạt tự nhiên chức năng của phân từ, nối trực tiếp với lời trích dẫn ở câu kế tiếp.
theological_decisions:
- issue: Đối tượng được πνεύμα chỉ đến trong ἐν πνεύματι
  choice: Thánh Linh
  alternative: tâm linh hoặc trạng thái thuộc linh của chính Đa-vít
  rationale: Ngữ cảnh Đa-vít phát ngôn lời Kinh Thánh ủng hộ cách hiểu là Thánh Linh, nhưng chú thích không xóa bỏ sắc thái có thể là phạm vi hoặc tác nhân của giới từ ἐν.
- issue: Cách dịch κύριος
  choice: Chúa
  alternative: chủ
  rationale: Trong lập luận dựa trên Thi Thiên 110 về Đấng Mê-si, “Chúa” bảo tồn sức nặng của tước hiệu và liên văn bản, trong khi chú thích ghi nhận nghĩa từ vựng khác có thể có.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” cho Chúa Giê-su, “Đấng ấy” cho đại từ chỉ Đấng Mê-si, và đặt “Chúa” trong dấu nháy để làm rõ đây là tước hiệu được nhắc đến trong câu hỏi. Mọi dấu chú thích [a], [b] đều xuất hiện trong chính văn.
