  text: αὕτη ἐστὶν ⸂ἡ μεγάλη καὶ πρώτη⸃ ἐντολή.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/038.yaml
  text: This is the great and first commandment[a].
translation:
  language: vi
  text: Đây là điều răn lớn và thứ nhất.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Từ “thứ nhất” cũng có thể dịch là “đứng đầu”. Nguyên văn Hy Lạp dùng hai từ mô tả: “lớn” và “thứ nhất”.'
    reason: Nêu cách dịch khác của πρώτη và cho thấy cấu trúc hai tính từ trong nguyên văn.
lexical_decisions:
- source_word: αὕτη
  choice: Đây
  rationale: Đại từ chỉ định quy chiếu về điều răn vừa được trích ở câu 37; “Đây” tự nhiên trong tiếng Việt và giữ được chức năng hồi chỉ.
- source_word: ἐστὶν
  choice: là
  rationale: Động từ hệ từ ở thì hiện tại được chuyển trực tiếp bằng “là”.
- source_word: μεγάλη
  choice: lớn
  rationale: Trong ngữ cảnh này, từ chỉ tầm quan trọng hoặc địa vị. “Lớn” giữ nguyên cấp tính từ, không biến thành cấp tuyệt đối như “lớn nhất”.
- source_word: πρώτη
  choice: đứng đầu
  rationale: Từ có thể chỉ thứ tự hoặc địa vị. “Đứng đầu” diễn đạt tự nhiên ý vị trí thứ nhất trong tiếng Việt, đồng thời không gộp nghĩa này với μεγάλη.
- source_word: ἐντολή
  choice: điều răn
  rationale: “Điều răn” phù hợp ngữ cảnh Kinh Thánh và Luật pháp, đồng thời quen thuộc, trang trọng mà vẫn dễ hiểu.
theological_decisions:
- issue: Mối quan hệ giữa μεγάλη và πρώτη khi mô tả điều răn
  choice: 'Giữ riêng cả hai tính chất: “lớn và đứng đầu”.'
  alternative: “điều răn quan trọng nhất” hoặc “điều răn lớn nhất và đứng đầu”
  rationale: Bản Hy Lạp dùng hai tính từ cấp thường phối hợp với nhau. Bản dịch giữ cả ý về sự lớn lao và vị trí đứng đầu, không tự đổi μεγάλη thành cấp tuyệt đối hoặc gộp hai ý thành một.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Cụm “điều răn” duy trì sắc thái Kinh Thánh; “lớn và đứng đầu” cố ý giữ hai nét nghĩa song song của nguyên văn.
