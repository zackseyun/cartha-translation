    issue: “lễ phục dự cưới” chưa nêu rõ bối cảnh tiệc cưới.
    rationale: ἔνδυμα γάμου trong dụ ngôn này là y phục gắn với tiệc cưới. “Y phục dự tiệc cưới” tránh khả năng hiểu là trang phục cho nghi lễ hôn lễ nói chung.
  - severity: low
    issue: Cụm “ngả mình dùng tiệc” hơi không tự nhiên.
    rationale: Đổi thành “ngả mình tại bàn tiệc” diễn đạt trôi chảy hơn mà vẫn bảo toàn tư thế dùng bữa cổ đại do ἀνακειμένους biểu thị.
