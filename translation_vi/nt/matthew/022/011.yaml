  rationale: Bản sửa chỉ làm rõ rằng y phục được nói đến thuộc bối cảnh tiệc cưới và làm câu tiếng Việt tự nhiên hơn. Cấu trúc mục đích “vào để xem,” trình tự hành động, chi tiết khách ngả mình, và tính không xác định của loại y phục đều được giữ nguyên.
