id: MAT.22.11
reference: Matthew 22:11
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εἰσελθὼν δὲ ὁ βασιλεὺς θεάσασθαι τοὺς ἀνακειμένους εἶδεν ἐκεῖ ἄνθρωπον οὐκ ἐνδεδυμένον ἔνδυμα γάμου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/011.yaml
  text: But when the king came in to look at the guests reclining at the table[b][a], he saw there a man not dressed in wedding clothes.
translation:
  language: vi
  text: Nhưng khi vua vào để xem các khách đang ngả mình tại bàn tiệc,[a] ông thấy ở đó một người không mặc y phục dự tiệc cưới.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn Hy Lạp nói “những người đang ngả mình”, phản ánh tư thế thường thấy của khách trong các bữa tiệc trang trọng thời xưa.
    reason: cultural_note
  - marker: b
    text: 'Cũng có thể dịch: “một người không mặc lễ phục dự cưới.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσελθὼν
  choice: khi ... đi vào
  rationale: Phân từ bất định diễn tả hành động xảy ra trước động từ chính; cấu trúc “khi ... đi vào” tự nhiên trong lời kể tiếng Việt.
- source_word: δὲ
  choice: Nhưng
  rationale: δέ đánh dấu bước chuyển của câu chuyện với sắc thái tương phản nhẹ, khi việc vua xem khách làm nảy sinh tình huống căng thẳng.
- source_word: ὁ βασιλεὺς
  choice: vua
  rationale: Cách gọi tự nhiên, chuẩn xác trong bối cảnh dụ ngôn về hoàng gia; tiếng Việt không cần mạo từ xác định.
- source_word: θεάσασθαι
  choice: để xem
  rationale: Động từ nguyên mẫu chỉ mục đích; “để xem” giữ được ý quan sát mà không diễn giải quá mức thành một cuộc kiểm tra chính thức.
- source_word: τοὺς ἀνακειμένους
  choice: các khách đang ngả mình dùng tiệc
  rationale: ἀνάκειμαι chỉ tư thế ngả mình khi ăn tiệc theo phong tục cổ. “Các khách” làm rõ vai trò được hàm ý trong bối cảnh, còn “ngả mình dùng tiệc” bảo tồn chi tiết văn hóa.
- source_word: εἶδεν
  choice: ông thấy
  rationale: Cách chuyển ngữ trực tiếp của động từ bất định ὁράω; đại từ “ông” giúp câu tiếng Việt tự nhiên và chỉ về vua.
- source_word: ἐκεῖ
  choice: ở đó
  rationale: Chuyển ngữ tự nhiên trạng từ chỉ nơi chốn.
- source_word: ἄνθρωπον
  choice: một người
  rationale: Trong tiếng Việt, “một người” là cách nói tự nhiên cho một cá nhân trong câu chuyện và không phủ nhận việc nhân vật này được quy chiếu bằng giống đực trong cú pháp Hy Lạp.
- source_word: οὐκ ἐνδεδυμένον
  choice: không mặc
  rationale: Phân từ hoàn thành mô tả trạng thái hiện tại của người ấy; “không mặc” tự nhiên và đi trực tiếp với danh từ chỉ y phục.
- source_word: ἔνδυμα γάμου
  choice: lễ phục dự cưới
  rationale: Cụm danh từ chỉ y phục thích hợp cho tiệc cưới. “Lễ phục dự cưới” vừa trang trọng vừa dễ hiểu, đồng thời không buộc danh từ số ít phải chỉ đúng một món áo.
theological_decisions:
- issue: Hình ảnh tư thế tại bàn tiệc trong dụ ngôn
  choice: Giữ chi tiết khách ngả mình dùng tiệc và chú thích phong tục.
  alternative: Chỉ dịch là “các khách dự tiệc” hoặc dịch sát là “những người đang ngả mình”.
  rationale: Bản dịch giữ sắc thái lịch sử của bữa tiệc cổ đại nhưng vẫn làm rõ rằng đây là các khách đang dùng tiệc.
- issue: Phạm vi nghĩa của ἔνδυμα γάμου
  choice: Dịch là “lễ phục dự cưới”.
  alternative: “áo dự tiệc cưới” hoặc “y phục cưới”.
  rationale: Nguyên văn có danh từ số ít nhưng có thể chỉ y phục nói chung. Cách dịch không xác định đó là một loại áo đặc thù hay gán thêm ý nghĩa thần học cho lễ phục.
- issue: Cách diễn đạt ἄνθρωπον
  choice: Dịch tự nhiên là “một người”.
  alternative: “một người đàn ông”.
  rationale: ἄνθρωπος ở đây nói đến một cá nhân; tiếng Việt không bắt buộc đánh dấu giới tính ở danh từ này. “Một người” bảo toàn trọng tâm của câu mà không thêm nét nghĩa không cần thiết.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “vua” thay vì “nhà vua” để câu gọn tự nhiên; “ngả mình dùng tiệc” giữ bối cảnh văn hóa cổ mà không gây cảm giác khách đang nằm tùy tiện. Mọi dấu chú thích đều xuất hiện trong chính văn.
