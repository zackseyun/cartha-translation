  rationale: 'Bản sửa giữ nguyên ý nghĩa và sự mơ hồ hợp lý của nguyên văn: việc hội ý tự nó được diễn đạt tương đối trung tính, còn ý thù nghịch nằm trong mục đích “gài bẫy”. Cấu trúc “bàn bạc xem làm thế nào để” chuyển tải tự nhiên quan hệ do ὅπως biểu thị. Việc thay danh xưng thêm vào bằng tên riêng “Giê-su” bảo đảm rõ đối tượng mà không đưa tước hiệu không có trong câu vào bản dịch.'
