source:
  edition: SBLGNT
  text: Τότε πορευθέντες οἱ Φαρισαῖοι συμβούλιον ἔλαβον ὅπως αὐτὸν παγιδεύσωσιν ἐν λόγῳ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/015.yaml
  text: Then the Pharisees went and took counsel how they might trap him in his words[a].
translation:
  language: vi
  text: Bấy giờ, những người Pha-ri-si đi bàn bạc xem làm thế nào để gài bẫy Giê-su bằng điều Người nói.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “âm mưu tìm cách gài bẫy Người qua điều Người nói.”'
    reason: Nêu cách dịch khác mang sắc thái mạnh hơn cho συμβούλιον ἔλαβον (“âm mưu”) và cách diễn đạt khác của ἐν λόγῳ là phương tiện dựa vào lời phát biểu của Giê-su.
lexical_decisions:
- source_word: Τότε
  choice: Bấy giờ
  rationale: Đánh dấu diễn tiến tiếp theo của câu chuyện bằng một cách nói tự nhiên, trang trọng trong tiếng Việt.
- source_word: πορευθέντες
  choice: đi
  rationale: Phân từ bất định quá khứ diễn tả hành động xảy ra trước động từ chính; dịch gọn là “đi” phù hợp lối kể chuyện tiếng Việt.
- source_word: οἱ Φαρισαῖοι
  choice: những người Pha-ri-si
  rationale: Cách gọi nhóm người này rõ ràng và quen thuộc trong tiếng Việt.
- source_word: συμβούλιον ἔλαβον
  choice: bàn bạc với nhau
  rationale: Thể hiện thành ngữ chỉ việc cùng nhau hội ý, lập kế hoạch, nhưng không đưa sắc thái thù địch vào sớm hơn nguyên văn; mục đích xấu được nêu rõ ở mệnh đề sau.
- source_word: ὅπως
  choice: để tìm cách
  rationale: Diễn đạt tự nhiên cả nội dung bàn bạc lẫn mục đích của họ.
- source_word: αὐτὸν
  choice: Đức Chúa Jêsus
  rationale: Đại từ chỉ Đức Chúa Jêsus; nêu rõ danh xưng trong câu độc lập để tránh mơ hồ cho độc giả.
- source_word: παγιδεύσωσιν
  choice: gài bẫy
  rationale: Giữ hình ảnh đặt bẫy và diễn tả rõ ý định thù địch.
- source_word: ἐν λόγῳ
  choice: qua lời Ngài nói
  rationale: λόγος ở đây chỉ lời nói hay phát ngôn; cách dịch này giữ phương tiện mà họ định dùng để gài bẫy, đồng thời tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Mức độ thù địch trong συμβούλιον ἔλαβον
  choice: Dịch tương đối trung tính là “bàn bạc với nhau”, để mệnh đề “gài bẫy” biểu thị ác ý.
  alternative: Dịch diễn giải mạnh hơn là “âm mưu”.
  rationale: Nguyên văn đặt sắc thái thù địch rõ rệt trong mục đích gài bẫy; không cần chồng thêm sắc thái ấy vào chính thành ngữ chỉ sự hội ý.
- issue: Chủ thể được đại từ αὐτὸν chỉ đến
  choice: Dùng “Đức Chúa Jêsus” để câu trích riêng vẫn rõ nghĩa.
  alternative: Giữ đại từ “Ngài”.
  rationale: Danh tính của đối tượng được xác định từ văn cảnh; nêu rõ danh xưng không thay đổi ý nghĩa và giúp câu độc lập dễ hiểu.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. “Bấy giờ” phù hợp văn kể chuyện Kinh Thánh; “bàn bạc với nhau” và “gài bẫy” là những cách diễn đạt phổ thông, tự nhiên. Dùng dạng tên “Pha-ri-si” và danh xưng “Đức Chúa Jêsus” theo quy ước của bản thảo.
