    rationale: Dù văn mạch xác định đối tượng là Giê-su, câu Hy Lạp không có tước hiệu “Đức Chúa”. Bản dịch nên nêu tên để rõ đối tượng nếu cần, nhưng không nên thêm tước hiệu không được biểu thị trong câu.
  - severity: low
    issue: “Jêsus” không phải chính tả tên riêng trung tính, thông dụng nhất trong tiếng Việt tiêu chuẩn hiện đại.
    rationale: “Giê-su” là dạng hiện hành, liên truyền thống hơn; thay đổi này không ảnh hưởng ý nghĩa.
  - severity: low
    issue: Cụm “qua lời Ngài nói” hơi gián tiếp đối với ἐν λόγῳ.
    rationale: “Bằng điều Người nói” làm rõ hơn rằng họ muốn dựa vào một lời phát biểu của Người để gài bẫy.
