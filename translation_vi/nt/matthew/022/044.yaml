id: MAT.22.44
reference: Matthew 22:44
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸀Εἶπεν κύριος τῷ κυρίῳ μου· Κάθου ἐκ δεξιῶν μου ἕως ἂν θῶ τοὺς ἐχθρούς σου ⸀ὑποκάτω τῶν ποδῶν σου;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/044.yaml
  text: The Lord said to my Lord[a], ‘Sit at my right hand until I put your enemies under your feet’?”
translation:
  language: vi
  text: 'Chúa phán với Chúa của tôi: “Hãy ngồi bên phải Ta cho đến khi Ta đặt kẻ thù của ngươi dưới chân ngươi[a].” ?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc, theo cách diễn đạt Hê-bơ-rơ của Thi Thiên 110:1: “biến kẻ thù của ngươi thành bệ để chân cho ngươi.”'
    reason: 'Nêu phương án theo hình ảnh “bệ để chân” của nguyên bản Hê-bơ-rơ và truyền thống dịch phổ biến, trong khi chính văn giữ sát cách diễn đạt Hy Lạp: “đặt ... dưới chân.”'
lexical_decisions:
- source_word: Εἶπεν
  choice: phán
  rationale: Trong lời trích dẫn long trọng từ Thi Thiên, “phán” tự nhiên và trang trọng hơn “nói”, dù động từ Hy Lạp tự thân có nghĩa thông thường là “nói”.
- source_word: κύριος ... τῷ κυρίῳ μου
  choice: Chúa ... với Chúa của tôi
  rationale: Giữ cùng một danh xưng “Chúa” cho cả hai lần κύριος như bản Hy Lạp, đồng thời cụm “của tôi” bảo toàn quan hệ được nêu trong τῷ κυρίῳ μου.
- source_word: Κάθου
  choice: Hãy ngồi
  rationale: Chuyển tải trực tiếp mệnh lệnh hiện tại trong bối cảnh đăng quang; cách nói rõ ràng, tự nhiên trong tiếng Việt hiện đại.
- source_word: ἐκ δεξιῶν μου
  choice: bên phải ta
  rationale: Diễn đạt thành ngữ chỉ vị trí danh dự và quyền cai trị bằng tiếng Việt tự nhiên; tránh từ “bên hữu” có sắc thái cổ.
- source_word: ἕως ἂν θῶ
  choice: cho đến khi ta đặt
  rationale: Giữ ý hướng tới một thời điểm tương lai của cấu trúc ἕως ἂν với động từ giả định.
- source_word: τοὺς ἐχθρούς σου
  choice: các kẻ thù của con
  rationale: “Kẻ thù” là cách tương đương trực tiếp và thông dụng; “các” thể hiện số nhiều.
- source_word: ὑποκάτω τῶν ποδῶν σου
  choice: dưới chân con
  rationale: Theo sát câu chữ Hy Lạp “ở dưới chân ngươi”, thay vì đưa hình ảnh “bệ đặt chân” từ nguyên bản Hê-bơ-rơ vào chính văn.
theological_decisions:
- issue: Hai lần κύριος trong lời trích Thi Thiên 110:1
  choice: Chúa phán với Chúa của tôi
  alternative: Đức Chúa phán với Chúa của tôi; Chúa phán với chủ của tôi
  rationale: Bản Hy Lạp dùng cùng một từ κύριος cho cả hai đối tượng. Dùng “Chúa” ở cả hai vị trí giữ được sự tương ứng ấy và sức căng trong lập luận của Chúa Giê-su; “Đức Chúa” sẽ đưa sự phân biệt từ nguyên bản Hê-bơ-rơ vào câu Hy Lạp, còn “chủ” làm yếu sắc thái tôn cao của κύριος thứ hai.
- issue: Đại từ trong lời Chúa nói với Đấng được gọi là “Chúa của tôi”
  choice: ta ... con
  alternative: ta ... ngươi
  rationale: Cặp “ta ... con” là cách nói trang trọng nhưng dễ hiểu trong tiếng Việt hiện đại và phù hợp với lời của Đức Chúa Trời; tuy vậy, đây là sự cụ thể hóa quan hệ xưng hô mà đại từ Hy Lạp ngôi thứ hai số ít không tự mã hóa. “Ngươi” bám sát tính không xác định ấy hơn nhưng hiện nay thường nghe cổ hoặc miệt thị.
- issue: Hình ảnh đặt kẻ thù dưới chân
  choice: đặt các kẻ thù của con dưới chân con
  alternative: biến các kẻ thù của con thành bệ đặt chân cho con
  rationale: Chính văn theo trực tiếp ὑποκάτω τῶν ποδῶν σου của SBLGNT. Hình ảnh “bệ đặt chân” phản ánh cách diễn đạt Hê-bơ-rơ của Thi Thiên 110:1 và được giữ trong chú thích thay vì thay thế câu chữ Hy Lạp.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “bên phải” thay cho “bên hữu”; giữ sự lặp lại có chủ ý của “Chúa”. Dấu hỏi cuối câu được giữ vì đây là phần kết của câu hỏi mà Chúa Giê-su nêu trong ngữ cảnh.
