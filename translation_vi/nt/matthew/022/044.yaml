    reason: 'Nêu phương án theo hình ảnh “bệ để chân” của nguyên bản Hê-bơ-rơ và truyền thống dịch phổ biến, trong khi chính văn giữ sát cách diễn đạt Hy Lạp: “đặt ... dưới chân.”'
  revision_rationale: 'Bản sửa loại bỏ việc áp đặt quan hệ cha-con qua cặp “ta ... con,” đồng thời giữ giọng trang trọng thích hợp cho lời trích Thi Thiên. Bản sửa cũng chuẩn hóa việc đặt chú thích: neo [a] ở chính văn và nội dung chú thích chỉ xuất hiện trong bộ chú thích. Dấu hỏi được giữ ngoài dấu ngoặc kép vì câu trích này kết thúc câu hỏi của Chúa Giê-su trong ngữ cảnh.'
