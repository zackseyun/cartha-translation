revisions:
- from: 'Chúa phán với Chúa của tôi: “Hãy ngồi bên phải ta cho đến khi ta đặt các kẻ thù của con dưới chân con[a].”?


    [a] Hoặc, theo cách diễn đạt trong tiếng Hê-bơ-rơ ở Thi Thiên 110:1: “cho đến khi ta biến các kẻ thù của con thành bệ đặt chân cho con.”'
  to: 'Chúa phán với Chúa của tôi: “Hãy ngồi bên phải Ta cho đến khi Ta đặt kẻ thù của ngươi dưới chân ngươi[a].” ?'
  rationale: 'Bản sửa loại bỏ việc áp đặt quan hệ cha-con qua cặp “ta ... con,” đồng thời giữ giọng trang trọng thích hợp cho lời trích Thi Thiên. Bản sửa cũng chuẩn hóa việc đặt chú thích: neo [a] ở chính văn và nội dung chú thích chỉ xuất hiện trong bộ chú thích. Dấu hỏi được giữ ngoài dấu ngoặc kép vì câu trích này kết thúc câu hỏi của Chúa Giê-su trong ngữ cảnh.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T05:42:05Z'
review_pass:
  verdict: revise
  source_fidelity: 'Cần sửa đại từ xưng hô. Bản Hy Lạp chỉ có ngôi hai số ít (σου), không xác định quan hệ cha-con; “ta ... con” thêm một quan hệ không được mã hóa trong câu trích dẫn. “Ta ... ngươi” giữ ngôi trực tiếp và tính không xác định đó, dù mang sắc thái Kinh Thánh trang trọng. Các phần còn lại theo sát SBLGNT: lặp lại κύριος, mệnh lệnh “ngồi,” vị trí bên phải, và hình ảnh đặt kẻ thù dưới chân.'
  naturalness: “Bên phải Ta” tự nhiên trong văn phong Kinh Thánh Việt ngữ hiện đại-trang trọng. “Ngươi” ít dùng trong hội thoại đương đại, nhưng phù hợp hơn “con” trong lời trích dẫn trang trọng vì không áp đặt quan hệ. Không nên lặp nguyên chú thích trong thân văn bản; chỉ giữ ký hiệu neo trong chính văn và cung cấp chú thích trong trường footnotes.
  terminology: Giữ “Chúa” cho cả hai lần κύριος, theo đúng sự lặp lại của tiếng Hy Lạp và không đưa “Đức Chúa”/dạng viết hoa phân biệt từ tiếng Hê-bơ-rơ vào chính văn. Giữ “kẻ thù ... dưới chân” thay vì thay bằng “bệ để chân” trong chính văn; hình ảnh của Thi Thiên 110:1 được nêu như một phương án trong chú thích.
  issues:
  - severity: medium
    issue: Đại từ “ta ... con” cụ thể hóa quan hệ cha-con.
    rationale: Đại từ ngôi hai số ít trong tiếng Hy Lạp không cho biết quan hệ cha-con. Cách dịch này có thể hướng người đọc đến một diễn giải thần học vượt quá câu chữ. “Ta ... ngươi” bảo toàn tính trực tiếp và mơ hồ quan hệ của nguồn.
  - severity: low
    issue: Chú thích bị lặp trong chuỗi văn bản chính.
    rationale: Chính văn đã có neo [a], còn nội dung chú thích cần được cung cấp một lần trong bộ footnotes có cấu trúc, không nối lại sau đoạn Kinh Thánh.
  revised_text: 'Chúa phán với Chúa của tôi: “Hãy ngồi bên phải Ta cho đến khi Ta đặt kẻ thù của ngươi dưới chân ngươi[a].” ?'
