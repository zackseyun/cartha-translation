  text: καὶ ἀκούσαντες ἐθαύμασαν, καὶ ἀφέντες αὐτὸν ἀπῆλθαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/022.yaml
  text: And hearing this[a], they were amazed, and leaving him, they went away.
translation:
  language: vi
  text: Nghe vậy[a], họ kinh ngạc, rồi bỏ Ngài mà đi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Sau khi nghe, họ lấy làm lạ, rồi bỏ Ngài mà đi.”'
    reason: Nêu cách dịch sát hình thức phân từ ἀκούσαντες và sắc thái khác có thể có của ἐθαύμασαν.
lexical_decisions:
- source_word: ἀκούσαντες
  choice: Nghe vậy
  rationale: Phân từ bất định chủ động chỉ hành động xảy ra trước động từ chính; “Nghe vậy” tự nhiên trong tiếng Việt và bổ sung đối tượng hàm ẩn từ văn cảnh mà không thêm nội dung mới.
- source_word: ἐθαύμασαν
  choice: họ kinh ngạc
  rationale: θαυμάζω diễn tả sự ngạc nhiên, thán phục hoặc kinh ngạc; “kinh ngạc” rõ nghĩa, hiện đại và phù hợp với phản ứng trước câu trả lời của Đức Giê-su.
- source_word: ἀφέντες αὐτὸν
  choice: bỏ Ngài
  rationale: Trong văn cảnh này, ἀφίημι mang nghĩa rời bỏ một người. “Bỏ Ngài” trực tiếp, không thêm ý “một mình” vốn không được nói rõ trong nguyên văn.
- source_word: ἀπῆλθαν
  choice: mà đi
  rationale: ἀπέρχομαι có nghĩa đi khỏi hoặc rời đi. Kết cấu “bỏ Ngài mà đi” là cách diễn đạt tiếng Việt tự nhiên, đồng thời giữ được chuyển động của câu chuyện.
- source_word: καὶ ... καὶ
  choice: …, rồi …
  rationale: Hai liên từ καί nối tiếp chuỗi hành động. Tiếng Việt dùng dấu phẩy và “rồi” để thể hiện trình tự rõ ràng, tự nhiên hơn việc lặp “và” máy móc.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Ngài” để quy chiếu Đức Giê-su trong mạch văn, không thêm danh xưng vào nguyên văn. Nhịp câu ngắn gọn, giữ chuỗi phản ứng rồi rời đi.
