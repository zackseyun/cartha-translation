  text: λέγουσιν ⸀αὐτῷ· Καίσαρος. τότε λέγει αὐτοῖς· Ἀπόδοτε οὖν τὰ Καίσαρος Καίσαρι καὶ τὰ τοῦ θεοῦ τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/021.yaml
  text: They said to him[a], “Caesar’s.” Then he said to them, “Therefore render to Caesar the things that are Caesar’s, and to God the things that are God’s.”
translation:
  language: vi
  text: 'Họ nói với Người: “Của Sê-sa.” Rồi Người nói với họ: “Vậy, hãy trả cho Sê-sa những gì thuộc về Sê-sa, và cho Đức Chúa Trời những gì thuộc về Đức Chúa Trời.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Động từ Hy Lạp cũng có thể được dịch là “trao lại”, “nộp” hoặc “trả điều phải trả”.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγουσιν αὐτῷ
  choice: Họ thưa với Ngài
  rationale: Dùng thì quá khứ theo lối kể chuyện tự nhiên trong tiếng Việt cho hiện tại lịch sử Hy Lạp; “thưa” phù hợp với lời đáp trực tiếp dành cho Chúa Giê-su.
- source_word: Καίσαρος
  choice: Của Sê-sa
  rationale: Giữ câu đáp ngắn dạng sở hữu, tương ứng trực tiếp với sở hữu cách Hy Lạp và câu hỏi ngầm về hình cùng danh hiệu trên đồng tiền.
- source_word: τότε λέγει αὐτοῖς
  choice: Bấy giờ, Ngài bảo họ
  rationale: “Bấy giờ” đánh dấu diễn tiến của cuộc đối thoại; hiện tại lịch sử được chuyển sang quá khứ tự nhiên trong văn kể tiếng Việt.
- source_word: Ἀπόδοτε
  choice: hãy trả cho
  rationale: ἀποδίδωμι có thể chỉ việc trao trả, nộp hoặc thực hiện điều phải trao. “Trả cho” vừa tự nhiên vừa giữ được ý trao điều thuộc về hay phải dành cho người nhận.
- source_word: οὖν
  choice: Vậy
  rationale: Thể hiện kết luận được rút ra từ chính câu trả lời vừa nêu.
- source_word: τὰ Καίσαρος Καίσαρι
  choice: cho Sê-sa những gì thuộc về Sê-sa
  rationale: Diễn đạt tự nhiên cấu trúc trung tính số nhiều kèm sở hữu cách, đồng thời giữ sự song song với vế nói về Đức Chúa Trời.
- source_word: τὰ τοῦ θεοῦ τῷ θεῷ
  choice: cho Đức Chúa Trời những gì thuộc về Đức Chúa Trời
  rationale: Giữ nguyên cấu trúc cân xứng và không thu hẹp nội dung thành một nghĩa vụ cụ thể.
theological_decisions:
- issue: Phạm vi mệnh lệnh liên quan đến nghĩa vụ đối với chính quyền và đối với Đức Chúa Trời
  choice: 'Giữ hai vế song song: trả cho Sê-sa điều thuộc về Sê-sa và cho Đức Chúa Trời điều thuộc về Đức Chúa Trời.'
  alternative: Giải thích câu này chỉ về việc nộp thuế, hoặc như sự công nhận quyền lực tuyệt đối của nhà nước.
  rationale: Bản Hy Lạp nêu sự phân biệt mà không xác định toàn bộ ranh giới giữa hai phạm vi. Bản dịch vì thế bảo tồn sức căng và quyền đòi hỏi tối hậu của Đức Chúa Trời, không áp đặt một hệ thống chính trị hay giáo phái về sau.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Sê-sa” theo cách gọi Kinh Thánh quen thuộc trong tiếng Việt; “Đức Chúa Trời” diễn đạt θεός trong bối cảnh độc thần Do Thái. Dấu chú thích đặt sau toàn bộ lời phán vì giải thích động từ được lặp lại theo nghĩa ở cả hai vế.
