review_pass:
  verdict: revise
  source_fidelity: Bản nháp truyền đạt đúng câu hỏi về người vợ giữa bảy người và lý do “vì cả bảy đều đã có/lấy bà”. Tuy nhiên, “khi sống lại” có thể được hiểu là lúc chính người phụ nữ sống lại, thay vì bối cảnh xác định “trong sự sống lại” (ἐν τῇ ἀναστάσει).
  naturalness: “Bà ấy” và nhất là “đã có bà ấy làm vợ” hơi gượng trong văn phong Kinh Thánh tiếng Việt hiện đại. “Người phụ nữ ấy” và “đã lấy bà ấy làm vợ” rõ, tự nhiên, và vẫn diễn đạt đúng ý hôn nhân của ngữ cảnh.
  terminology: Nên dùng “sự sống lại” cho ἀνάστασις để giữ thuật ngữ chỉ sự sống lại của người chết trong cuộc tranh luận này. “Lấy ... làm vợ” là cách diễn đạt tiếng Việt tự nhiên cho ἔσχον αὐτήν trong ngữ cảnh; chú thích giữ cách nói sát chữ.
  issues:
  - severity: medium
    issue: “khi sống lại” không biểu đạt rõ danh từ có mạo từ trong cụm ἐν τῇ ἀναστάσει.
    rationale: Nguyên ngữ nói về bối cảnh/thời điểm “trong sự sống lại,” không trực tiếp nói hành động một người nào đó “sống lại.” Dùng “trong sự sống lại” tránh mơ hồ và phù hợp thuật ngữ văn mạch.
  - severity: low
    issue: “đều đã có bà ấy làm vợ” không tự nhiên trong tiếng Việt hiện đại.
    rationale: Cách nói này cố giữ chữ “có” của ἔχω nhưng tạo lối diễn đạt gượng. Ngữ cảnh xác định quan hệ hôn nhân, nên “đã lấy bà ấy làm vợ” truyền đạt ý rõ ràng; chú thích có thể nêu cách nói sát chữ.
