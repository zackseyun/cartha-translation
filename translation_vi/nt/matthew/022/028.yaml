source:
  edition: SBLGNT
  text: ἐν τῇ ⸂ἀναστάσει οὖν⸃ τίνος τῶν ἑπτὰ ἔσται γυνή; πάντες γὰρ ἔσχον αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/028.yaml
  text: In the resurrection[a], then, whose wife of the seven will she be? For they all had her.
translation:
  language: vi
  text: Vậy, trong sự sống lại, người phụ nữ ấy sẽ là vợ của ai trong bảy người? Vì cả bảy đều đã lấy bà ấy làm vợ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sát chữ, tiếng Hy Lạp là: “Vì tất cả họ đều đã có bà ấy.” Trong ngữ cảnh, đây là cách nói về việc lấy bà ấy làm vợ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστάσει
  choice: khi sống lại
  rationale: Cụm ἐν τῇ ἀναστάσει chỉ thời điểm hoặc hoàn cảnh của sự sống lại. Cách dịch này tự nhiên trong tiếng Việt và, theo văn cảnh, nói đến sự sống lại của người chết.
- source_word: οὖν
  choice: vậy
  rationale: Từ này nối câu hỏi với lập luận ngay trước đó và mang sắc thái suy luận; “vậy” tự nhiên trong câu hỏi tiếng Việt.
- source_word: τίνος τῶν ἑπτὰ
  choice: của ai trong bảy người
  rationale: Diễn đạt tự nhiên câu hỏi về người chồng nào thuộc nhóm bảy anh em, đồng thời giữ nguyên phạm vi của cụm sở hữu trong tiếng Hy Lạp.
- source_word: ἔσται γυνή
  choice: sẽ là vợ
  rationale: Trong văn cảnh hôn nhân, γυνή có nghĩa là “vợ”, còn ἔσται diễn tả tương lai.
- source_word: πάντες
  choice: cả bảy
  rationale: Từ này quy chiếu đến toàn bộ bảy anh em đã được nhắc đến; “cả bảy” rõ nghĩa và gọn trong tiếng Việt.
- source_word: γὰρ
  choice: vì
  rationale: γάρ đưa ra lý do cho câu hỏi phía trước.
- source_word: ἔσχον αὐτήν
  choice: đều đã có bà ấy làm vợ
  rationale: Động từ ἔχω có nghĩa sát chữ là “có”, nhưng trong văn cảnh này chỉ quan hệ vợ chồng. Thêm “làm vợ” giúp câu tiếng Việt rõ và tự nhiên mà vẫn giữ hình ảnh từ nguyên bản.
theological_decisions:
- issue: Ý nghĩa của ἀνάστασις trong lời chất vấn của người Sa-đu-sê
  choice: Sự sống lại của người chết trong tương lai
  alternative: Một đời sống sau khi chết được hiểu cách chung chung
  rationale: Văn cảnh trực tiếp bàn về việc người chết sống lại, và câu trả lời tiếp theo của Chúa Giê-su cũng giữ đúng trọng tâm ấy. “Khi sống lại” không làm mờ nội dung cụ thể này.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “bà ấy” để quy chiếu rõ đến người phụ nữ trong câu chuyện; giữ cấu trúc câu hỏi ngắn gọn và sắc thái lập luận của οὖν và γάρ.
