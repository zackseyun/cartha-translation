revisions:
- from: Vậy, khi sống lại, bà ấy sẽ là vợ của ai trong bảy người? Vì cả bảy đều đã có bà ấy làm vợ.[a]
  to: Vậy, trong sự sống lại, người phụ nữ ấy sẽ là vợ của ai trong bảy người? Vì cả bảy đều đã lấy bà ấy làm vợ.[a]
  rationale: Bản sửa thay “khi sống lại” bằng “trong sự sống lại” để phản ánh chính xác cụm ἐν τῇ ἀναστάσει và giữ thuật ngữ nhất quán. Đồng thời, bản sửa dùng cách diễn đạt hôn nhân tự nhiên trong tiếng Việt cho ἔσχον αὐτήν, với chú thích bảo lưu cách nói sát chữ của nguyên ngữ.
  reviewer_model: gpt-5.6-terra
