  text: τότε λέγει τοῖς δούλοις αὐτοῦ· Ὁ μὲν γάμος ἕτοιμός ἐστιν, οἱ δὲ κεκλημένοι οὐκ ἦσαν ἄξιοι·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/008.yaml
  text: Then he says to his servants[a], ‘The wedding feast is ready, but those who were invited were not worthy.’
translation:
  language: vi
  text: 'Bấy giờ, ông nói với các đầy tớ của mình: “Tiệc cưới đã sẵn sàng, nhưng những người được mời[a] lại không xứng đáng.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “những người được gọi.” Trong ngữ cảnh tiệc cưới, từ Hy Lạp này nói đến những người được mời dự tiệc.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Bấy giờ
  rationale: Diễn tả bước tiếp theo trong trình tự câu chuyện bằng lối kể tự nhiên, trang trọng trong tiếng Việt.
- source_word: λέγει
  choice: ông nói
  rationale: Giữ thì hiện tại lịch sử của tiếng Hy Lạp nhằm bảo toàn sắc thái kể chuyện sinh động; đại từ “ông” theo nhân vật chủ tiệc trong ngữ cảnh.
- source_word: δούλοις
  choice: các đầy tớ
  rationale: Trong bối cảnh dụ ngôn về một gia chủ hoặc vua, “đầy tớ” vừa tự nhiên vừa phản ánh quan hệ phục vụ; địa vị pháp lý của họ không phải trọng tâm của câu này.
- source_word: Ὁ μὲν γάμος
  choice: Tiệc cưới
  rationale: γάμος trong ngữ cảnh này chỉ lễ tiệc cưới đã được chuẩn bị, không chỉ sự kết hôn; μὲν được thể hiện qua cấu trúc tương phản với “nhưng” ở vế sau.
- source_word: ἕτοιμός ἐστιν
  choice: đã sẵn sàng
  rationale: Diễn đạt trực tiếp trạng thái mọi sự đã được chuẩn bị xong; “đã” phù hợp tự nhiên với ngữ cảnh kể chuyện tiếng Việt.
- source_word: οἱ δὲ κεκλημένοι
  choice: những người được mời
  rationale: Phân từ hoàn thành bị động của καλέω trong ngữ cảnh tiệc cưới chỉ những khách đã nhận lời mời; cách dịch này tránh áp đặt sắc thái thần học chuyên biệt của “được gọi”.
- source_word: οὐκ ἦσαν ἄξιοι
  choice: lại không xứng đáng
  rationale: Giữ nguyên lực đánh giá của ἄξιος mà không giải thích thêm căn cứ của sự không xứng đáng; “lại” làm rõ thế tương phản của δέ.
theological_decisions:
- issue: Sắc thái thần học tiềm tàng của κεκλημένοι (“những người được gọi”) trong ngữ cảnh dụ ngôn
  choice: những người được mời
  alternative: những người được gọi
  rationale: Ngữ cảnh trực tiếp nói về các khách đã được mời dự tiệc cưới, nên “được mời” là nghĩa xã hội nổi bật. Tuy vậy, nghĩa sát chữ “được gọi” được giữ trong chú thích để bảo tồn khả năng đối chiếu và tránh che khuất hình thức nguyên ngữ.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, tự nhiên và trang trọng vừa phải. Giữ hiện tại lịch sử ở “ông nói”; dùng “đầy tớ” theo bối cảnh dụ ngôn và “tiệc cưới” để làm rõ nghĩa ngữ cảnh của γάμος.
