  source_fidelity: Bản nháp truyền đạt đúng mệnh lệnh yêu kính Đức Chúa Trời và giữ được ba phương diện καρδία, ψυχή, διάνοια. Tuy nhiên, “yêu kính” thêm sắc thái tôn kính không có trong ἀγαπάω, và cách lặp “hết lòng, hết linh hồn và hết tâm trí” chưa tự nhiên, đồng thời làm mờ cấu trúc lặp của ἐν ὅλῃ.
