language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὁ ⸀δὲ ἔφη αὐτῷ· Ἀγαπήσεις κύριον τὸν θεόν σου ἐν ὅλῃ ⸀τῇ καρδίᾳ σου καὶ ἐν ὅλῃ ⸁τῇ ψυχῇ σου καὶ ἐν ὅλῃ τῇ διανοίᾳ σου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/037.yaml
  text: And he said to him[c][b][a], “You shall love the Lord your God with all your heart and with all your soul and with all your mind.”
translation:
  language: vi
  text: 'Ngài nói với ông: “Ông phải yêu Chúa, là Đức Chúa Trời của ông, bằng cả tấm lòng, cả linh hồn và cả tâm trí.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: '[không dịch riêng]'
  rationale: Ở đây δέ chỉ là từ nối nhẹ để tiếp tục cuộc đối thoại. Tiếng Việt tự nhiên không cần thêm “và” hoặc “nhưng” trước “Ngài nói”.
- source_word: ἔφη αὐτῷ
  choice: Ngài nói với ông
  rationale: Dịch trực tiếp hành động nói và đối tượng tiếp nhận; “Ngài” phù hợp với cách xưng hô tôn kính dành cho Chúa Giê-su trong văn cảnh.
- source_word: Ἀγαπήσεις
  choice: phải ... yêu kính
  rationale: Thì tương lai Hy Lạp mang lực mệnh lệnh trong câu trích dẫn. “Phải” diễn đạt rõ lực truyền dạy; “yêu kính” tự nhiên khi đối tượng là Đức Chúa Trời và vẫn giữ ý nghĩa yêu thương, tận hiến.
- source_word: κύριον τὸν θεόν σου
  choice: Chúa là Đức Chúa Trời của ngươi
  rationale: Giữ κύριος là “Chúa” và θεός là “Đức Chúa Trời”; từ “là” làm rõ quan hệ đồng vị tự nhiên trong tiếng Việt mà không tách thành hai đối tượng.
- source_word: ἐν ὅλῃ τῇ καρδίᾳ σου
  choice: hết lòng
  rationale: Đây là thành ngữ tiếng Việt tự nhiên diễn đạt việc yêu bằng toàn bộ καρδία, thay vì dịch máy móc là “trong cả trái tim”.
- source_word: ψυχῇ
  choice: linh hồn
  rationale: “Linh hồn” giữ sự phân biệt từ vựng với “lòng” và “tâm trí”, đồng thời phản ánh nghĩa truyền thống của ψυχή trong công thức trích dẫn này.
- source_word: διανοίᾳ
  choice: tâm trí
  rationale: “Tâm trí” diễn đạt năng lực suy nghĩ và hiểu biết của διάνοια một cách tự nhiên, trang trọng trong tiếng Việt hiện đại.
theological_decisions:
- issue: Cách thể hiện ba phương diện καρδία, ψυχή và διάνοια
  choice: 'Giữ ba yếu tố riêng biệt: “lòng ... linh hồn ... tâm trí”'
  alternative: Gộp thành một cách diễn ý như “bằng toàn thể con người ngươi”
  rationale: Bản Hy Lạp cố ý nêu ba thuật ngữ. Giữ cả ba bảo toàn hình thức và sức căng của câu trích dẫn, nhưng không khẳng định rằng con người nhất thiết gồm ba phần tách biệt về bản thể.
- issue: Quan hệ giữa κύριον và τὸν θεόν σου
  choice: “Chúa là Đức Chúa Trời của ngươi”
  alternative: “Chúa, Đức Chúa Trời của ngươi”
  rationale: Cách dùng “là” giúp người đọc phổ thông nhận ra đây là một đối tượng duy nhất, đồng thời vẫn giữ cả hai danh xưng của nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “ngươi” để giữ sắc thái số ít của σου và giọng văn mệnh lệnh trong lời trích Kinh Thánh; cấu trúc “hết lòng, hết linh hồn và hết tâm trí” vừa gọn vừa duy trì phép lặp về tính toàn thể.
