id: MAT.22.42
reference: Matthew 22:42
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: λέγων· Τί ὑμῖν δοκεῖ περὶ τοῦ χριστοῦ; τίνος υἱός ἐστιν; λέγουσιν αὐτῷ· Τοῦ Δαυίδ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/042.yaml
  text: saying[a], “What do you think about the Messiah? Whose son is he?” They said to him, “David’s.”
translation:
  language: vi
  text: 'Ngài hỏi: “Các ông nghĩ gì về Đấng Mê-si-a[a]? Ngài là con của ai?” Họ thưa với Ngài: “Con của Đa-vít.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “Đấng Christ.” Từ Hy Lạp Χριστός (Christos) ở đây được dùng theo nghĩa Đấng Mê-si-a, tức Đấng được xức dầu.
    reason: alternative_reading
lexical_decisions:
- source_word: λέγων
  choice: Ngài hỏi
  rationale: Phân từ hiện tại của λέγω dẫn vào lời chất vấn của Đức Chúa Giê-su. Trong tiếng Việt, “Ngài hỏi” tự nhiên hơn “Ngài nói rằng” và phù hợp với nội dung là hai câu hỏi, nhưng không thêm ý ngoài ngữ cảnh.
- source_word: Τί ὑμῖν δοκεῖ
  choice: Các ông nghĩ gì
  rationale: δοκέω đi với đại từ tặng cách diễn tả việc hỏi nhận định hay ý kiến; cách dịch này tự nhiên trong tiếng Việt hiện đại và giữ số nhiều của ὑμῖν.
- source_word: περὶ τοῦ χριστοῦ
  choice: về Đấng Mê-si-a
  rationale: Χριστός ở đây là tước hiệu trong cuộc tranh luận về Đấng được xức dầu, nên “Đấng Mê-si-a” truyền đạt đúng chức năng danh hiệu trong bối cảnh Do Thái.
- source_word: τίνος υἱός ἐστιν
  choice: Ngài là con của ai?
  rationale: Câu hỏi trực tiếp về dòng dõi. Đại từ “Ngài” quy chiếu về Đấng Mê-si-a và giữ sắc thái tôn kính tự nhiên trong văn phong Kinh Thánh tiếng Việt.
- source_word: λέγουσιν αὐτῷ
  choice: Họ thưa với Ngài
  rationale: Thì hiện tại lịch sử trong lời kể được chuyển sang cách kể quá khứ tự nhiên của tiếng Việt; “thưa” biểu thị lời đáp với Đức Chúa Giê-su mà không thay đổi nội dung.
- source_word: Τοῦ Δαυίδ
  choice: Con của Đa-vít
  rationale: Cụm sở hữu cách Hy Lạp là câu đáp tỉnh lược, dựa vào danh từ “con” trong câu hỏi. Tiếng Việt cần phục hồi “Con” để câu trả lời rõ ràng và tự nhiên.
theological_decisions:
- issue: Cách dịch Χριστός
  choice: Đấng Mê-si-a
  alternative: Đấng Christ
  rationale: Trong câu này, Χριστός được dùng rõ ràng như một tước hiệu thuộc niềm mong đợi về Đấng được xức dầu, không phải như tên riêng. Chú thích bảo lưu cách gọi truyền thống “Đấng Christ”.
- issue: Ý nghĩa của “con của Đa-vít”
  choice: Giữ nguyên ngôn ngữ quan hệ cha-con và dòng dõi
  alternative: Hậu duệ của Đa-vít
  rationale: “Hậu duệ” có thể làm rõ ý nghĩa triều đại, nhưng bản dịch chính giữ sát υἱός và bảo tồn nền tảng cho lập luận tiếp theo của Đức Chúa Giê-su.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “các ông” cho đại từ số nhiều ὑμῖν trong lời Đức Chúa Giê-su nói với nhóm người đối thoại; dùng “Ngài/thưa” để giữ sắc thái tôn kính. Dấu chú thích [a] được đặt ngay sau danh hiệu liên quan.
