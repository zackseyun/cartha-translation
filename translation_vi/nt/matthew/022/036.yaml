  text: Διδάσκαλε, ποία ἐντολὴ μεγάλη ἐν τῷ νόμῳ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/036.yaml
  text: Teacher[a], which commandment is greatest in the Law?
translation:
  language: vi
  text: “Thưa Thầy, điều răn nào là lớn nhất trong Luật pháp?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διδάσκαλε
  choice: Thưa Thầy
  rationale: Dạng hô cách dùng để trực tiếp thưa với Đức Giê-su. “Thưa Thầy” tự nhiên, trang trọng trong tiếng Việt và diễn đạt đúng vai trò người dạy, không mang sắc thái sở hữu hay quyền thống trị của “chủ”.
- source_word: ποία
  choice: nào
  rationale: Tính từ nghi vấn yêu cầu xác định một điều răn trong toàn bộ các điều răn; cấu trúc “điều răn nào” là cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: ἐντολὴ
  choice: điều răn
  rationale: Trong bối cảnh Kinh Thánh và luật Do Thái, “điều răn” vừa quen thuộc vừa giữ được liên hệ với các mệnh lệnh trong Luật pháp.
- source_word: μεγάλη
  choice: lớn nhất
  rationale: Dù hình thái Hy Lạp là tính từ cấp nguyên, trong câu hỏi chọn một điều giữa nhiều điều, μεγάλη mang lực so sánh theo ngữ cảnh. Tiếng Việt cần “lớn nhất” để diễn đạt câu hỏi tự nhiên và rõ nghĩa; “lớn” đơn thuần sẽ gượng và có thể bị hiểu là chỉ hỏi điều nào thuộc loại lớn.
- source_word: ἐν τῷ νόμῳ
  choice: trong Luật pháp
  rationale: νόμος ở đây chỉ Luật Môi-se/Torah. Viết hoa “Luật pháp” giúp nhận diện đây là danh xưng của bộ luật Kinh Thánh, đồng thời dễ hiểu với độc giả Việt hiện đại.
theological_decisions:
- issue: Có nên diễn đạt μεγάλη bằng cấp cao nhất hay giữ nguyên hình thức cấp nguyên
  choice: lớn nhất
  alternative: lớn
  rationale: Bản Hy Lạp dùng μεγάλη, về hình thức là “lớn”, nhưng ποία cùng ngữ cảnh lựa chọn giữa các điều răn tạo ý xếp hạng. “Điều răn nào là lớn nhất” bảo toàn ý nghĩa dụng học mà không áp đặt một cách giải thích thần học riêng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Thưa Thầy” làm lời xưng hô lịch sự; “Luật pháp” viết hoa để chỉ Torah/Luật Môi-se. Không cần chú thích vì phương án “lớn nhất” là cách chuyển nghĩa tự nhiên của cấu trúc trong tiếng Việt.
