id: MAT.22.7
reference: Matthew 22:7
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸂ὁ δὲ βασιλεὺς⸃ ὠργίσθη, καὶ πέμψας τὰ στρατεύματα αὐτοῦ ἀπώλεσεν τοὺς φονεῖς ἐκείνους καὶ τὴν πόλιν αὐτῶν ἐνέπρησεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/007.yaml
  text: But the king became angry, and he sent his troops, destroyed those murderers, and burned their city.
translation:
  language: vi
  text: Nhưng vua nổi giận, sai quân đội mình đi tiêu diệt những kẻ sát nhân ấy và thiêu rụi thành của họ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὠργίσθη
  choice: nổi giận
  rationale: Diễn đạt tự nhiên, trực tiếp trạng thái tức giận của nhà vua.
- source_word: τὰ στρατεύματα αὐτοῦ
  choice: quân đội mình
  rationale: Danh từ số nhiều Hy Lạp chỉ lực lượng quân sự thuộc quyền vua; tiếng Việt dùng danh từ tập hợp “quân đội” tự nhiên hơn.
- source_word: ἀπώλεσεν
  choice: tiêu diệt
  rationale: Trong ngữ cảnh quân sự và với đối tượng là những kẻ giết người, từ này mang nghĩa giết hoặc hủy diệt; “tiêu diệt” giữ được sắc thái mạnh.
- source_word: τοὺς φονεῖς ἐκείνους
  choice: những kẻ sát nhân ấy
  rationale: Giữ nghĩa cụ thể của φονεύς là người phạm tội giết người, đồng thời bảo toàn từ chỉ định ἐκείνους.
- source_word: ἐνέπρησεν
  choice: thiêu rụi
  rationale: Truyền đạt hành động đốt cháy mang tính tàn phá, phù hợp với thành phố làm tân ngữ.
theological_decisions:
- issue: Quan hệ cú pháp giữa việc sai quân đi và hai hành động trừng phạt
  choice: “sai quân đội mình đi tiêu diệt… và thiêu rụi…”
  alternative: “sai quân đội mình đi; vua tiêu diệt… và thiêu rụi…”
  rationale: Phân từ πέμψας về hình thức gắn với chủ ngữ là vua, nhưng về nghĩa quân đội là phương tiện thực hiện sự trừng phạt. Cách dịch tiếng Việt tự nhiên này không thay đổi trách nhiệm tối hậu của vua và tránh khiến người đọc hiểu vua đích thân hành động.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu giữ nhịp kể chuyện cô đọng; không thêm chú giải ẩn dụ hoặc xác định thành phố ngoài điều văn bản nói.
