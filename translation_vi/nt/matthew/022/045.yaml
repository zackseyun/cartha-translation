source:
  edition: SBLGNT
  text: εἰ οὖν Δαυὶδ καλεῖ αὐτὸν κύριον, πῶς υἱὸς αὐτοῦ ἐστιν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/045.yaml
  text: If[a], then, David calls him Lord, how is he his son?
translation:
  language: vi
  text: Vậy, nếu Đa-vít gọi người là “Chúa,”[a] thì làm sao người lại là con của Đa-vít?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc, diễn đạt rõ hơn theo ngữ cảnh: “Vậy, nếu Đa-vít gọi Đấng Mê-si là ‘Chúa,’ thì làm sao Đấng ấy lại là con của Đa-vít?”'
    reason: Cách diễn đạt thay thế làm rõ đối tượng của đại từ theo ngữ cảnh trước, nhưng không thêm cách giải thích vào chính văn.
lexical_decisions:
- source_word: εἰ οὖν
  choice: Vậy, nếu
  rationale: Giữ cả sắc thái điều kiện của εἰ và tính suy luận của οὖν, đồng thời dùng trật tự tự nhiên trong tiếng Việt hiện đại.
- source_word: Δαυὶδ
  choice: Đa-vít
  rationale: Dùng dạng phiên âm tên riêng quen thuộc trong tiếng Việt.
- source_word: καλεῖ
  choice: gọi
  rationale: Giữ nghĩa trực tiếp là gọi hay xưng một người bằng một danh xưng; chính xác hơn cách dịch chung chung như “nói”.
- source_word: αὐτὸν
  choice: người
  rationale: Đại từ chỉ nhân vật đang được bàn đến từ ngữ cảnh trước; “người” có sắc thái trang trọng phù hợp văn phong Kinh Thánh mà không thêm danh từ “Đấng Mê-si” vào chính văn.
- source_word: κύριον
  choice: “Chúa”
  rationale: Giữ danh xưng trang trọng và âm hưởng của Thi Thiên 110:1; “chủ” sẽ làm yếu ý nghĩa thần học trong ngữ cảnh.
- source_word: πῶς
  choice: làm sao
  rationale: Cách hỏi tự nhiên, trực tiếp trong tiếng Việt, giữ nguyên sức căng lô-gích của câu hỏi.
- source_word: υἱὸς αὐτοῦ
  choice: con của ông ấy
  rationale: Giữ nguyên ngôn ngữ quan hệ cha-con của bản Hy Lạp thay vì diễn giải thành “hậu duệ”; “ông ấy” chỉ Đa-vít rõ hơn và tránh nhầm với “Chúa”.
- source_word: ἐστιν
  choice: lại là
  rationale: “Là” chuyển tải động từ nối; từ “lại” làm rõ sự tương phản hàm chứa trong câu hỏi mà không giải quyết nó.
theological_decisions:
- issue: Ý nghĩa Mê-si và Cơ Đốc học khi Đa-vít gọi nhân vật ấy là “Chúa”
  choice: Giữ “Chúa” và “con của ông ấy” trong chính văn, không giải thích mối quan hệ giữa hai danh xưng.
  alternative: Nếu Đa-vít gọi Đấng Mê-si là “Chúa,” thì làm sao Đấng ấy lại là con của Đa-vít?
  rationale: Bản Hy Lạp dùng đại từ và dựa vào ngữ cảnh trước để xác định nhân vật. Cách dịch đã chọn giữ nguyên sức căng giữa địa vị là con của Đa-vít và địa vị là Chúa, không đưa lời giải thích giáo lý vào chính văn.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Trật tự “Vậy, nếu” tự nhiên hơn “Nếu vậy thì” trong câu lập luận này; dấu ngoặc kép đánh dấu “Chúa” là danh xưng mà Đa-vít dùng. Đại từ “người” giữ sắc thái tôn trọng, còn “ông ấy” giúp xác định Đa-vít là tiền đề của cụm “con của”.
