revisions:
- from: Vì trong sự sống lại[a], người ta không cưới vợ cũng không được gả chồng, nhưng giống như các thiên sứ của Đức Chúa Trời ở trên trời.
  to: Vì trong sự sống lại[a], họ không cưới vợ cũng không bị gả chồng, nhưng giống như các thiên sứ của Đức Chúa Trời ở trên trời.
  rationale: Chỉ chỉnh cụm bị động “được gả chồng” thành “bị gả chồng” để tiếng Việt tự nhiên hơn và phản ánh rõ γαμίζονται. Thay “người ta” bằng “họ” để chủ ngữ quy chiếu trực tiếp đến những người sống lại, không thay đổi ý nghĩa. Bản dịch vẫn giữ phép so sánh, không hàm ý con người trở thành thiên sứ.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T05:41:49Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch giữ được quan hệ giải thích của γάρ, cụm “trong sự sống lại,” phép so sánh của ὡς, và cụm “các thiên sứ của Đức Chúa Trời ở trên trời.” Tuy nhiên, “được gả chồng” không phải là cách diễn đạt tự nhiên/chính xác nhất để chuyển tải γαμίζονται (bị động: bị đem gả, được gả đi).'
  naturalness: “Người ta” có thể dùng trong nghĩa khái quát, nhưng “họ” liên kết rõ hơn với những người trong tình trạng sống lại mà câu đang nói đến. Cặp “cưới vợ / bị gả chồng” vừa tự nhiên hơn vừa bảo toàn tương phản chủ động–bị động của tiếng Hy Lạp.
  terminology: “Sự sống lại,” “thiên sứ,” “Đức Chúa Trời,” và “trên trời” phù hợp văn phong Kinh Thánh Việt ngữ hiện đại, trang trọng. Không cần thay đổi thuật ngữ thần học.
  issues:
  - severity: medium
    issue: Cụm “được gả chồng” chưa diễn đạt tự nhiên thể bị động γαμίζονται.
    rationale: Trong tiếng Việt, “gả chồng” thường mang nghĩa gả một người phụ nữ cho chồng; khi nói về người được gả, “bị gả chồng” hoặc “được gả đi” rõ và tự nhiên hơn. “Bị gả chồng” cũng thể hiện trực tiếp nét bị động của nguyên ngữ.
  revised_text: Vì trong sự sống lại[a], họ không cưới vợ cũng không bị gả chồng, nhưng giống như các thiên sứ của Đức Chúa Trời ở trên trời.
