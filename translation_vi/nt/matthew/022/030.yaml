id: MAT.22.30
reference: Matthew 22:30
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐν γὰρ τῇ ἀναστάσει οὔτε γαμοῦσιν οὔτε ⸀γαμίζονται, ἀλλ’ ὡς ἄγγελοι ⸀θεοῦ ἐν ⸀τῷ οὐρανῷ εἰσιν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/030.yaml
  text: For in the resurrection they neither marry nor are given in marriage[a], but are like the angels of God in heaven.
translation:
  language: vi
  text: Vì trong sự sống lại[a], họ không cưới vợ cũng không bị gả chồng, nhưng giống như các thiên sứ của Đức Chúa Trời ở trên trời.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “khi sống lại.”'
    reason: Cụm ἐν τῇ ἀναστάσει có thể được hiểu theo tình trạng “trong sự sống lại” hoặc theo thời điểm “khi sống lại”.
lexical_decisions:
- source_word: ἐν ... τῇ ἀναστάσει
  choice: trong sự sống lại
  rationale: Giữ hình ảnh và giới từ của tiếng Hy Lạp, đồng thời diễn tả tình trạng sống sau khi được sống lại; “khi sống lại” cũng có thể chỉ thời điểm.
- source_word: γαμοῦσιν
  choice: cưới vợ
  rationale: Trong cặp diễn đạt song song với thể bị động γαμίζονται, động từ này nói đến việc chủ động kết hôn; “cưới vợ” là cách nói tự nhiên và giúp giữ sự phân biệt của hai động từ Hy Lạp.
- source_word: γαμίζονται
  choice: được gả chồng
  rationale: Giữ thể bị động và nét nghĩa được người khác gả cho kết hôn, thay vì gộp cả hai động từ thành một cách nói chung.
- source_word: ὡς
  choice: giống như
  rationale: 'Diễn tả sự so sánh chứ không phải đồng nhất: người sống lại giống các thiên sứ trong phương diện đang được nói đến, chứ không được nói là trở thành thiên sứ.'
- source_word: ἄγγελοι θεοῦ
  choice: các thiên sứ của Đức Chúa Trời
  rationale: Thể hiện rõ danh từ sở hữu θεοῦ trong bản nguồn và dùng cách gọi trang trọng, quen thuộc trong tiếng Việt Kinh Thánh.
- source_word: ἐν τῷ οὐρανῷ
  choice: ở trên trời
  rationale: Trong ngữ cảnh về các thiên sứ, οὐρανός chỉ nơi trên trời chứ không đơn thuần là bầu trời vật lý.
- source_word: γὰρ
  choice: Vì
  rationale: Giữ quan hệ giải thích/nguyên nhân với lời phán ngay trước câu này.
theological_decisions:
- issue: Bản chất của sự so sánh với các thiên sứ
  choice: Người sống lại “giống như” các thiên sứ, trong ngữ cảnh trực tiếp là không kết hôn.
  alternative: Hiểu lời này là nói người sống lại trở thành thiên sứ hoặc hoàn toàn mang cùng một bản thể và cách tồn tại như thiên sứ.
  rationale: ὡς đánh dấu sự so sánh, không khẳng định đồng nhất. Bản dịch giữ nguyên phạm vi so sánh mà câu văn nêu ra, không mở rộng thành một tuyên bố về sự biến đổi bản thể.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cặp “cưới vợ / được gả chồng” giữ sự tương phản chủ động–bị động trong nguyên ngữ, dù mang dấu ấn cách diễn đạt hôn nhân của bối cảnh cổ đại.
