  terminology: «Môn đồ», «Thưa Thầy», «đường lối của Đức Chúa Trời», và «thiên vị» đều nhất quán với văn phong Kinh Thánh Việt ngữ hiện đại. Các chú thích neo đúng vào hai thành ngữ Hy Lạp và giải thích mà không áp đặt diễn giải giáo phái.
