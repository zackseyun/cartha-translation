id: MAT.22.16
reference: Matthew 22:16
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἀποστέλλουσιν αὐτῷ τοὺς μαθητὰς αὐτῶν μετὰ τῶν Ἡρῳδιανῶν ⸀λέγοντες· Διδάσκαλε, οἴδαμεν ὅτι ἀληθὴς εἶ καὶ τὴν ὁδὸν τοῦ θεοῦ ἐν ἀληθείᾳ διδάσκεις, καὶ οὐ μέλει σοι περὶ οὐδενός, οὐ γὰρ βλέπεις εἰς πρόσωπον ἀνθρώπων·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/016.yaml
  text: And they send to him their disciples along with the Herodians[a], saying, “Teacher, we know that you are true and teach the way of God in truth, and you do not care about anyone[b], for you do not look at the face of men.”
translation:
  language: vi
  text: 'Họ sai các môn đồ của mình cùng với những người thuộc phe Hê-rốt đến gặp Ngài và nói: “Thưa Thầy, chúng tôi biết Thầy là người chân thật và lấy sự thật mà dạy đường lối của Đức Chúa Trời. Thầy không để bất cứ ai chi phối mình[a], vì Thầy không thiên vị ai[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sát chữ: “Thầy không bận tâm đến bất cứ ai”; trong văn cảnh, ý nói Thầy không để địa vị hay ý kiến của người khác tác động.'
    reason: Giải thích thành ngữ để tránh cách hiểu rằng Chúa Giê-su thờ ơ với con người.
  - marker: b
    text: 'Sát chữ: “Thầy không nhìn vào mặt người ta”; cũng có thể dịch: “Thầy không xét người theo bề ngoài.”'
    reason: Bảo lưu hình ảnh của thành ngữ Hy Lạp và nêu cách diễn đạt thay thế.
lexical_decisions:
- source_word: ἀποστέλλουσιν
  choice: Họ sai ... đến gặp
  rationale: Thì hiện tại lịch sử của tiếng Hy Lạp được diễn đạt bằng động từ tiếng Việt không đánh dấu thì; ngữ cảnh tự nhiên cho thấy đây là hành động trong mạch kể quá khứ.
- source_word: τοὺς μαθητὰς αὐτῶν
  choice: các môn đồ của mình
  rationale: “Môn đồ” là cách gọi quen thuộc, trang trọng và đúng ngữ cảnh cho những người theo học; “của mình” quy chiếu tự nhiên về chủ ngữ số nhiều.
- source_word: μετὰ τῶν Ἡρῳδιανῶν
  choice: cùng với những người thuộc phe Hê-rốt
  rationale: Diễn đạt rõ đây là một nhóm gắn với Hê-rốt mà không xác định quá mức bản chất chính trị hay tôn giáo của họ.
- source_word: Διδάσκαλε
  choice: Thưa Thầy
  rationale: Giữ ý xưng hô với một người dạy dỗ, đồng thời tự nhiên và lịch sự trong tiếng Việt.
- source_word: ἀληθὴς
  choice: người chân thật
  rationale: “Chân thật” mô tả phẩm chất đáng tin và thành thật, phù hợp với vị ngữ Hy Lạp mà không thu hẹp thành chỉ nói đúng sự thật.
- source_word: τὴν ὁδὸν τοῦ θεοῦ
  choice: đường lối của Đức Chúa Trời
  rationale: “Đường lối” giữ được hình ảnh về con đường đồng thời truyền đạt tự nhiên ý cách sống hay ý muốn thuộc về Đức Chúa Trời.
- source_word: ἐν ἀληθείᾳ
  choice: lấy sự thật mà
  rationale: Giữ mối liên hệ trực tiếp với “sự thật” và diễn đạt cách thức dạy dỗ tự nhiên hơn cấu trúc sát chữ “trong sự thật”.
- source_word: οὐ μέλει σοι περὶ οὐδενός
  choice: Thầy không để bất cứ ai chi phối mình
  rationale: Trong văn cảnh, câu này nói Thầy không bị địa vị hay ý kiến của người khác tác động; cách dịch tránh hàm ý sai rằng Thầy không quan tâm đến con người.
- source_word: οὐ γὰρ βλέπεις εἰς πρόσωπον ἀνθρώπων
  choice: vì Thầy không thiên vị ai
  rationale: Chuyển thành ngữ “nhìn vào mặt người” sang nghĩa tự nhiên là không thiên vị, đồng thời ghi cách nói sát chữ trong chú thích.
theological_decisions:
- issue: Thành ngữ về việc không bị người khác tác động
  choice: không để bất cứ ai chi phối mình
  alternative: không bận tâm đến bất cứ ai
  rationale: Cách sát chữ có thể bị hiểu là sự thờ ơ với con người. Bản dịch chính truyền đạt ý không bị quyền thế, địa vị hay dư luận chi phối, còn chú thích bảo lưu cấu trúc sát chữ.
- issue: Thành ngữ về việc nhìn vào mặt người
  choice: không thiên vị ai
  alternative: không nhìn vào mặt người ta / không xét người theo bề ngoài
  rationale: Thành ngữ Hy Lạp nói đến việc không thiên vị theo địa vị hay diện mạo xã hội. Bản dịch chính ưu tiên nghĩa rõ ràng nhưng chú thích giữ hình ảnh nguyên ngữ và phương án gần nghĩa.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Ngài” trong lời kể và “Thầy” trong lời xưng hô trực tiếp. Cấu trúc được làm tự nhiên trong tiếng Việt nhưng các thành ngữ có khả năng gây hiểu lầm đều được giải thích bằng chú thích.
