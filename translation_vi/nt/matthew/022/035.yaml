  rationale: Chỉnh liên từ để không thêm sắc thái thời gian, thay cụm từ chưa tự nhiên bằng cách diễn đạt tiếng Việt chuẩn và rõ bối cảnh, đồng thời giữ nguyên ý một người hỏi Đức Giê-su nhằm thử/dò xét Ngài. Dấu neo chú thích được giữ nguyên và nội dung chú thích được điều chỉnh cho khớp câu chính.
