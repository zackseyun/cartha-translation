  text: καὶ ἐπηρώτησεν εἷς ἐξ αὐτῶν νομικὸς πειράζων ⸀αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/035.yaml
  text: And one of them, a lawyer, asked him a question, testing him.
translation:
  language: vi
  text: Và một người trong số họ, là một chuyên gia về Luật Mô-se[a], đã hỏi Đức Giê-su, nhằm thử Ngài.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hoặc “một chuyên gia về luật.” Từ Hy Lạp chỉ một người thông thạo luật Do Thái.
    reason: Nêu phương án dịch tổng quát hơn và làm rõ phạm vi ngữ cảnh của νομικός, tránh hiểu là luật sư theo nghĩa hiện đại.
lexical_decisions:
- source_word: καὶ
  choice: Rồi
  rationale: Liên từ nối câu này với diễn tiến ngay trước đó; “Rồi” tạo mạch kể tự nhiên trong tiếng Việt mà không làm thay đổi quan hệ cơ bản của câu.
- source_word: ἐπηρώτησεν
  choice: hỏi
  rationale: Động từ có nghĩa là hỏi hoặc chất vấn. “Hỏi” tự nhiên, chính xác và không tự thêm danh từ “một câu hỏi” vốn không có riêng trong tiếng Hy Lạp.
- source_word: εἷς ἐξ αὐτῶν
  choice: một người trong số họ
  rationale: Diễn đạt tự nhiên cấu trúc chỉ thành phần, cho biết người ấy thuộc nhóm vừa được nhắc đến.
- source_word: νομικὸς
  choice: một chuyên gia luật pháp
  rationale: Trong bối cảnh Do Thái, từ này chỉ người thông thạo Luật Mô-se, không phải luật sư hành nghề theo nghĩa pháp lý hiện đại. Cách dịch này tránh gây hiểu lầm.
- source_word: πειράζων
  choice: để thử
  rationale: Phân từ diễn tả mục đích hoặc hoàn cảnh của hành động hỏi. “Để thử” giữ được sắc thái dò xét, thách thức mà không giới hạn nghĩa vào sự dụ dỗ phạm tội.
- source_word: αὐτόν
  choice: Đức Giê-su ... Ngài
  rationale: Đại từ chỉ Đức Giê-su theo ngữ cảnh. Nêu rõ danh xưng trong tiếng Việt giúp câu độc lập dễ hiểu; “Ngài” duy trì lối xưng hô trang trọng.
theological_decisions:
- issue: Sắc thái của πειράζων đối với Đức Giê-su
  choice: để thử Ngài
  alternative: cám dỗ Ngài
  rationale: Từ Hy Lạp có thể mang nghĩa thử, thử thách hoặc cám dỗ. Trong ngữ cảnh một câu hỏi nhằm dò xét, “thử” bảo toàn ý đối đầu mà không áp đặt nghĩa hẹp là lôi kéo làm điều ác.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “luật pháp” trong câu chính để giữ sắc thái Kinh Thánh quen thuộc, đồng thời chú thích phạm vi cụ thể là Luật Mô-se.
