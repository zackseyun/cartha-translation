source:
  edition: SBLGNT
  text: καὶ οὐδεὶς ἐδύνατο ⸂ἀποκριθῆναι αὐτῷ⸃ λόγον, οὐδὲ ἐτόλμησέν τις ἀπ’ ἐκείνης τῆς ἡμέρας ἐπερωτῆσαι αὐτὸν οὐκέτι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/046.yaml
  text: And no one was able to answer him a word[a], nor did anyone dare from that day on to question him any longer.
translation:
  language: vi
  text: Không ai có thể đáp lại Người một lời[a], và từ ngày ấy, cũng không ai dám chất vấn Người nữa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đáp lại Người dù chỉ một lời.” Thành ngữ Hy Lạp dịch sát là “đáp lại Người một lời.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδεὶς
  choice: không ai
  rationale: Đại từ phủ định chỉ hoàn toàn không có người nào; “không ai” là cách diễn đạt tự nhiên, rõ ràng trong tiếng Việt hiện đại.
- source_word: ἐδύνατο
  choice: có thể
  rationale: Thể chưa hoàn thành của δύναμαι diễn tả việc họ không có khả năng đáp lại trong tình huống ấy; kết cấu “không ai có thể” chuyển tải trực tiếp ý này.
- source_word: ἀποκριθῆναι αὐτῷ λόγον
  choice: đáp lại Người một lời
  rationale: Giữ lại danh từ λόγον (“một lời”) và sắc thái nhấn mạnh của thành ngữ Hy Lạp, đồng thời vẫn tự nhiên trong tiếng Việt. Đại từ “Người” chỉ Đức Giê-su với văn phong trang trọng nhưng không thêm danh xưng không có trong câu.
- source_word: οὐδὲ
  choice: và ... cũng không
  rationale: Liên kết chặt chẽ mệnh đề phủ định thứ hai với mệnh đề đầu; cấu trúc này tự nhiên hơn “cũng chẳng” trong văn phong trang trọng hiện đại.
- source_word: ἐτόλμησέν τις
  choice: không ai dám
  rationale: Động từ τολμάω nói đến việc dám hoặc cả gan làm điều gì; trong cấu trúc phủ định, “không ai dám” là cách chuyển tải tự nhiên.
- source_word: ἀπ’ ἐκείνης τῆς ἡμέρας
  choice: từ ngày ấy
  rationale: Cụm giới từ xác định thời điểm bắt đầu của tình trạng tiếp diễn. Kết hợp với “nữa” ở cuối câu, tiếng Việt đã biểu đạt rõ ý “kể từ ngày ấy trở đi” mà không cần thêm “trở đi”.
- source_word: ἐπερωτῆσαι
  choice: chất vấn
  rationale: Trong bối cảnh tranh luận và thử Đức Giê-su bằng các câu hỏi, “chất vấn” giữ được sắc thái đối chất mạnh hơn “hỏi”, nhưng không quá nặng như “thẩm vấn”.
- source_word: οὐκέτι
  choice: nữa
  rationale: Diễn tả việc hành động chấm dứt từ thời điểm ấy; “không ... nữa” là cấu trúc tiếng Việt tự nhiên.
theological_decisions:
- issue: Sức nặng trần thuật của sự im lặng nơi những người đối đáp với Đức Giê-su
  choice: Trình bày đơn thuần rằng không ai có thể đáp lại và từ đó không ai dám tiếp tục chất vấn Người.
  alternative: Diễn giải mạnh hơn rằng câu này trực tiếp tuyên bố sự khôn ngoan hoặc thẩm quyền vượt trội của Đức Giê-su.
  rationale: Ngữ cảnh hàm ý Đức Giê-su thắng thế trong cuộc tranh luận, nhưng chính câu này chỉ thuật lại sự bất lực trong việc đáp lời và việc họ không còn dám chất vấn. Bản dịch không thêm kết luận thần học vào lời văn.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “Người” để quy chiếu Đức Giê-su một cách tôn kính; giữ “một lời” nhằm phản ánh thành ngữ Hy Lạp, kèm chú thích nêu cách hiểu nhấn mạnh. “Chất vấn” phù hợp bối cảnh các câu hỏi mang tính thử thách và tranh luận.
