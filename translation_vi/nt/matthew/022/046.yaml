  naturalness: Câu văn tự nhiên, rõ ràng và phù hợp tiếng Việt hiện đại trang trọng. Trật tự “và từ ngày ấy, cũng không ai...” mạch lạc; cấu trúc “không ... nữa” truyền đạt tốt ý không còn tiếp diễn. “Đáp lại Người một lời” hơi sát cấu trúc nguyên ngữ nhưng vẫn là cách dùng chấp nhận được trong văn phong Kinh Thánh.
  terminology: “Người” là cách quy chiếu tôn kính nhất quán và không thêm nội dung vào nguyên văn. “Chất vấn” phù hợp với bối cảnh các cuộc hỏi đáp có tính tranh luận, đồng thời không biến câu thành một khẳng định thần học vượt quá dữ kiện trần thuật.
