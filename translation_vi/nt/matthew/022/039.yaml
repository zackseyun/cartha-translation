  text: Δευτέρα ⸀δὲ ὁμοία ⸀αὐτῇ· Ἀγαπήσεις τὸν πλησίον σου ὡς σεαυτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/039.yaml
  text: 'And a second is like it: You shall love your neighbor as yourself[a].'
translation:
  language: vi
  text: 'Còn điều răn thứ hai cũng giống như điều ấy: “Ngươi phải yêu người lân cận của ngươi như chính mình.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Δευτέρα
  choice: điều răn thứ hai
  rationale: Tính từ thứ tự giống cái được dùng như danh từ; ngữ cảnh cho thấy từ được lược là “điều răn”. Tiếng Việt cần bổ sung danh từ này để câu rõ và tự nhiên.
- source_word: δὲ
  choice: Còn
  rationale: Tiểu từ nối nhẹ, chuyển từ điều răn thứ nhất sang điều răn thứ hai, không biểu thị sự tương phản mạnh.
- source_word: ὁμοία αὐτῇ
  choice: cũng giống như điều ấy
  rationale: Diễn đạt sự tương đồng với điều răn vừa nêu; “cũng” làm rõ quan hệ bổ sung tự nhiên trong tiếng Việt mà không đồng nhất hai điều răn.
- source_word: Ἀγαπήσεις
  choice: Ngươi phải yêu
  rationale: Thì tương lai mang lực mệnh lệnh trong lời trích Kinh Thánh. “Phải yêu” truyền đạt nghĩa bắt buộc, còn “ngươi” giữ sắc thái trang trọng của lời truyền phán.
- source_word: τὸν πλησίον σου
  choice: người lân cận
  rationale: Cụm từ chỉ người ở gần hay người đồng loại trong quan hệ đạo đức; “người lân cận” là cách diễn đạt chính xác, trang trọng và quen thuộc.
- source_word: ὡς σεαυτόν
  choice: như chính mình
  rationale: Giữ nguyên chuẩn so sánh và đại từ phản thân; “chính mình” tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Quan hệ giữa điều răn thứ hai và điều răn thứ nhất
  choice: điều răn thứ hai cũng giống như điều ấy
  alternative: một điều răn thứ hai giống như điều ấy
  rationale: Cách dịch xác định đây là điều răn đứng thứ hai trong mạch văn, đồng thời giữ nguyên lời khẳng định về sự tương đồng mà không giải thích thêm rằng chúng ngang hàng hay đồng nhất.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “ngươi” trong lời trích điều răn để giữ sắc thái Kinh Thánh và ngôi số ít của tiếng Hy Lạp; dùng “người lân cận” thay vì cách nói thuần không gian như “người ở gần”.
