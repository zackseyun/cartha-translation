  text: Ἐν ἐκείνῃ τῇ ἡμέρᾳ προσῆλθον αὐτῷ Σαδδουκαῖοι, ⸀λέγοντες μὴ εἶναι ἀνάστασιν, καὶ ἐπηρώτησαν αὐτὸν
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/023.yaml
  text: On that day Sadducees came to him[a], saying there is no resurrection, and they questioned him.
translation:
  language: vi
  text: Hôm ấy, những người Sa-đu-sê đến gặp Ngài[a], nói rằng không có sự sống lại, rồi hỏi Ngài.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể diễn đạt rõ hơn: “Những người Sa-đu-sê, là những người nói rằng không có sự sống lại, đến gặp Ngài.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: Hôm ấy
  rationale: Cách diễn đạt thời gian tự nhiên trong tiếng Việt hiện đại, giữ nguyên sự quy chiếu đến ngày đang được thuật lại.
- source_word: προσῆλθον αὐτῷ
  choice: đến gặp Ngài
  rationale: Diễn đạt tự nhiên hành động đến gần và hướng đến Chúa Giê-su; “gặp” phù hợp với bối cảnh họ đến để đặt câu hỏi.
- source_word: Σαδδουκαῖοι
  choice: những người Sa-đu-sê
  rationale: Dùng cách phiên âm quen thuộc trong tiếng Việt và thêm “những người” để chỉ rõ đây là một nhóm người.
- source_word: λέγοντες μὴ εἶναι ἀνάστασιν
  choice: nói rằng không có sự sống lại
  rationale: Giữ sát cấu trúc phân từ và nội dung lời phủ nhận, đồng thời diễn đạt rõ ràng, tự nhiên trong tiếng Việt.
- source_word: ἀνάστασιν
  choice: sự sống lại
  rationale: Thuật ngữ tiếng Việt thông dụng và dễ hiểu cho ἀνάστασις trong bối cảnh người chết sống lại.
- source_word: ἐπηρώτησαν αὐτὸν
  choice: chất vấn Ngài
  rationale: “Chất vấn” truyền đạt sắc thái hỏi có tính thăm dò hoặc thử thách, mạnh hơn “hỏi” nhưng không hàm ý một cuộc thẩm vấn chính thức.
theological_decisions:
- issue: Cách trình bày lời phủ nhận của người Sa-đu-sê
  choice: nói rằng không có sự sống lại
  alternative: là những người chủ trương không có sự sống lại
  rationale: Bản chính giữ hình thức phân từ gần với nguyên văn và không biến lời mô tả thành sự xác nhận của người kể chuyện. Chú thích bảo tồn khả năng hiểu phân từ như đặc điểm nhận diện quan điểm của nhóm này.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Ngài” được dùng làm đại từ tôn kính chỉ Chúa Giê-su; “Sa-đu-sê” theo lối phiên âm tên nhóm quen thuộc trong tiếng Việt.
