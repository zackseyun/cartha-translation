source:
  edition: SBLGNT
  text: Ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν αὐτοῖς· Πλανᾶσθε μὴ εἰδότες τὰς γραφὰς μηδὲ τὴν δύναμιν τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/029.yaml
  text: But Jesus answered them[a], “You are mistaken, because you know neither the Scriptures nor the power of God.”
translation:
  language: vi
  text: 'Nhưng Đức Giê-su trả lời họ: “Các ông lầm, vì không biết Kinh Thánh cũng không biết quyền năng của Đức Chúa Trời.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Các ông bị lừa dối”, “Các ông sai lầm” hoặc “Các ông lầm lạc”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν αὐτοῖς
  choice: Nhưng Đức Chúa Jêsus đáp lời họ
  rationale: Cụm phân từ kèm động từ nói là công thức đáp lời thông dụng; δέ tạo sắc thái chuyển ý nhẹ. Cách diễn đạt này tự nhiên trong tiếng Việt và tránh lặp cứng kiểu “đáp lại, nói với họ”.
- source_word: Πλανᾶσθε
  choice: Các ông lầm
  rationale: Động từ có thể chỉ tình trạng lầm lạc, sai lầm hoặc bị dẫn đi sai đường. “Lầm” ngắn gọn, tự nhiên, phù hợp lời quở trách trong ngữ cảnh mà không nhất thiết quy nguyên nhân cho sự lừa dối từ bên ngoài.
- source_word: μὴ εἰδότες ... μηδὲ
  choice: vì không biết ... cũng không biết
  rationale: Phân từ phủ định nêu nguyên nhân của sự sai lầm, còn μηδέ nối đối tượng thứ hai. Cấu trúc tiếng Việt này diễn đạt rõ quan hệ nhân quả và việc họ thiếu hiểu biết cả hai điều.
- source_word: τὰς γραφὰς
  choice: Kinh Thánh
  rationale: Số nhiều γραφαί trong bối cảnh Do Thái và Cơ Đốc giáo sơ khai chỉ các sách thánh; “Kinh Thánh” là cách gọi chuẩn, dễ hiểu trong tiếng Việt.
- source_word: τὴν δύναμιν τοῦ θεοῦ
  choice: quyền năng của Đức Chúa Trời
  rationale: δύναμις là quyền năng hay sức mạnh. “Quyền năng của Đức Chúa Trời” giữ được sắc thái trang trọng và quan hệ sở hữu của nguyên văn.
theological_decisions:
- issue: Nguyên nhân sự sai lầm của người Sa-đu-sê
  choice: Lời của Đức Chúa Jêsus xác định họ lầm vì không biết cả Kinh Thánh lẫn quyền năng của Đức Chúa Trời.
  alternative: Hiểu đây chỉ là hai mệnh đề đặt cạnh nhau, không nhấn mạnh quan hệ nhân quả.
  rationale: Cụm phân từ μὴ εἰδότες, với hai đối tượng được nối bằng μηδέ, tự nhiên giải thích nguyên nhân của Πλανᾶσθε. Bản dịch dùng “vì” để thể hiện quan hệ này mà không thêm cách giải thích thần học.
- issue: Sắc thái của Πλανᾶσθε
  choice: Dịch trong câu chính là “Các ông lầm”.
  alternative: “Các ông bị lừa dối”, “Các ông sai lầm” hoặc “Các ông lầm lạc”.
  rationale: Hình thái và ngữ nghĩa cho phép sắc thái trung hoặc bị động, nên chú thích bảo lưu các khả năng. Câu chính tránh khẳng định riêng rằng có một tác nhân bên ngoài lừa dối họ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và trực tiếp. Dùng “các ông” vì Đức Chúa Jêsus đang nói với một nhóm nam giới trong cuộc tranh luận; dùng “Đức Chúa Jêsus”, “Kinh Thánh” và “Đức Chúa Trời” theo lối gọi quen thuộc trong tiếng Việt Tin Lành. Dấu chú thích được đặt ngay sau câu có từ cần chú giải.
