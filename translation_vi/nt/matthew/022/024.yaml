  text: λέγοντες· Διδάσκαλε, Μωϋσῆς εἶπεν· Ἐάν τις ἀποθάνῃ μὴ ἔχων τέκνα, ἐπιγαμβρεύσει ὁ ἀδελφὸς αὐτοῦ τὴν γυναῖκα αὐτοῦ καὶ ἀναστήσει σπέρμα τῷ ἀδελφῷ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/024.yaml
  text: saying[a], “Teacher, Moses said, ‘If a man dies without having children, his brother shall marry his wife and raise up offspring for his brother.’”
translation:
  language: vi
  text: 'họ nói: “Thưa Thầy, Môi-se đã nói: ‘Nếu một người đàn ông chết mà không có con, thì anh hoặc em trai của người ấy phải lấy[a] vợ của người ấy và gây dựng dòng dõi cho người anh em đã chết.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nói sát hơn: “làm bổn phận anh hoặc em chồng đối với người góa phụ.” Động từ Hy Lạp chỉ riêng việc kết hôn nối dõi, khi anh hoặc em trai lấy góa phụ của người đã chết.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Διδάσκαλε
  choice: Thưa Thầy
  rationale: Cách xưng hô trực tiếp, tự nhiên và trang trọng đối với Chúa Giê-xu trong vai trò người dạy dỗ.
- source_word: Ἐάν τις ἀποθάνῃ μὴ ἔχων τέκνα
  choice: Nếu một người đàn ông chết mà không có con
  rationale: Giữ đúng trường hợp pháp lý nói về một người nam; τέκνα chỉ con cái nói chung, không riêng con trai.
- source_word: ὁ ἀδελφὸς αὐτοῦ
  choice: anh hoặc em trai của người ấy
  rationale: ἀδελφός không xác định lớn hay nhỏ; cách dịch này bảo toàn sự không xác định tự nhiên trong tiếng Việt.
- source_word: ἐπιγαμβρεύσει ... τὴν γυναῖκα αὐτοῦ
  choice: phải lấy người vợ góa
  rationale: Động từ chỉ việc người anh/em chồng kết hôn với góa phụ của người đã chết theo tục nối dõi; “lấy” tự nhiên trong ngữ cảnh hôn nhân, còn chú thích nêu rõ nét nghĩa chuyên biệt.
- source_word: ἀναστήσει σπέρμα τῷ ἀδελφῷ αὐτοῦ
  choice: sinh con nối dõi cho người anh em đã chết
  rationale: Diễn đạt thành ngữ pháp lý về việc gây dựng dòng dõi được kể cho người anh/em đã qua đời; “con nối dõi” truyền đạt ý nghĩa trong tiếng Việt hiện đại.
theological_decisions:
- issue: Giới tính trong trường hợp pháp lý
  choice: Giữ “một người đàn ông” và “anh hoặc em trai”
  alternative: Dùng cách nói trung tính như “một người” và “anh chị em”
  rationale: Luật hôn nhân nối dõi ở đây được trình bày bằng các vai trò gia đình cụ thể của nam giới; không nên trung tính hóa các hình thức và ý hướng của nguồn.
- issue: Quan hệ của người con với người đã chết
  choice: “sinh con nối dõi cho người anh em đã chết”
  alternative: “gây dựng dòng dõi cho anh em mình”
  rationale: Cách chọn làm rõ người con được sinh ra nhằm duy trì dòng dõi của người anh/em đã chết, nhưng không xác định thêm các chi tiết pháp lý ngoài câu.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “Môi-se” theo lối phiên âm Kinh Thánh quen thuộc; “anh hoặc em trai” giữ sự mơ hồ về thứ bậc tuổi trong ἀδελφός. Dấu chú thích [a] xuất hiện ngay sau cụm từ cần giải thích.
