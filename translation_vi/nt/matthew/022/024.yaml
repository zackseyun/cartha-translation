  to: 'họ nói: “Thưa Thầy, Môi-se đã nói: ‘Nếu một người đàn ông chết mà không có con, thì anh hoặc em trai của người ấy phải lấy[a] vợ của người ấy và gây dựng dòng dõi cho người anh em đã chết.’”'
  rationale: Sửa động từ dẫn lời cho sát εἶπεν; làm rõ người phụ nữ là vợ của người đã chết mà vẫn giữ cách diễn đạt trực tiếp của tiếng Hy Lạp; chuyển neo chú thích đến động từ chuyên biệt ἐπιγαμβρεύσει. Các vai trò nam giới và sự không xác định anh/em vẫn được bảo toàn.
