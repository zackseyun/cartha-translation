    issue: Động từ “hỏi” thay cho λέγει.
    rationale: λέγει có nghĩa cơ bản là “nói”; tính chất nghi vấn nằm trong lời trực tiếp. “Nói với họ” bảo toàn lựa chọn động từ của nguồn mà không gây gượng trong tiếng Việt.
  - severity: low
    issue: Cách diễn đạt của chú thích “dịch sát hơn”.
    rationale: “thuộc về ai” không sát hơn đáng kể so với “là của ai”, nhưng là một cách diễn đạt thay thế. Nên mô tả là “cũng có thể diễn đạt”.
