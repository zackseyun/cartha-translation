  text: And he said to them[a], “Whose image is this, and whose inscription?”
translation:
  language: vi
  text: 'Ngài nói với họ: “Hình này và dòng chữ này là của ai?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể diễn đạt: “Hình này và dòng chữ này thuộc về ai?” Trong tiếng Hy Lạp, đại từ nghi vấn ở cách sở hữu hỏi về sự sở hữu hoặc liên hệ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: hỏi
  rationale: Động từ nghĩa đen là “nói”, nhưng lời trực tiếp là một câu hỏi; “hỏi” tự nhiên và chính xác về chức năng trong tiếng Việt. Thì hiện tại lịch sử của tiếng Hy Lạp được diễn đạt theo lối kể chuyện tự nhiên của tiếng Việt.
- source_word: αὐτοῖς
  choice: họ
  rationale: Đại từ số nhiều ở cách tặng chỉ những người được ngỏ lời; cấu trúc “hỏi họ” là cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: Τίνος
  choice: của ai
  rationale: Đại từ nghi vấn ở sở hữu cách hỏi về sự sở hữu hoặc liên hệ; “của ai” giữ đúng ý mà không xác định quá mức.
- source_word: εἰκών
  choice: hình
  rationale: Trong ngữ cảnh đồng tiền, “hình” là từ tự nhiên, dễ hiểu cho hình tượng hoặc chân dung được in trên mặt đồng tiền, đồng thời không thêm lời giải thích rằng đó là hoàng đế.
- source_word: αὕτη
  choice: này
  rationale: Đại từ chỉ định bổ nghĩa cho “hình”; “hình này” là trật tự tự nhiên trong tiếng Việt.
- source_word: ἐπιγραφή
  choice: dòng chữ
  rationale: Chỉ phần chữ được khắc hoặc ghi trên đồng tiền. “Dòng chữ” dễ hiểu hơn “minh văn” và cụ thể hơn “chữ” trong tiếng Việt hiện đại.
- source_word: καὶ
  choice: và
  rationale: 'Liên từ nối hai đặc điểm được hỏi: hình và dòng chữ.'
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Ngài” để chỉ Chúa Giê-su theo ngữ cảnh tường thuật, không đưa tên vào khi nguyên văn chỉ có chủ ngữ hàm ẩn. Câu hỏi giữ nguyên khả năng chỉ sự sở hữu hoặc liên hệ của Τίνος.
