revisions:
- from: 'Ông nói với người ấy: “Bạn ơi, sao bạn vào đây mà không có y phục dự tiệc cưới?” Nhưng người ấy không nói được lời nào.[a]'
  to: 'Ông nói với người ấy: “Bạn ơi, làm sao bạn vào được đây mà không có y phục dự tiệc cưới?” Nhưng người ấy không nói được lời nào.[a]'
  rationale: Bản sửa làm rõ πῶς là câu hỏi về cách thức (“làm sao”) thay vì có thể hiểu là hỏi lý do, đồng thời chỉnh chú thích cho tự nhiên và chính xác hơn về sắc thái bị động của ἐφιμώθη. Các lựa chọn “Bạn ơi,” “y phục dự tiệc cưới,” và cách diễn đạt kết quả “không nói được lời nào” được giữ vì phù hợp ngữ cảnh và tiếng Việt hiện đại.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T05:41:48Z'
review_pass:
  verdict: revise
  source_fidelity: 'Cần chỉnh nhẹ cách dịch πῶς: “sao bạn vào đây” trong tiếng Việt hiện đại thường nghiêng về câu hỏi lý do (“tại sao”), trong khi πῶς hỏi về cách thức/đường lối vào. Câu kết chính văn diễn đạt đúng kết quả ngữ cảnh của ἐφιμώθη, và chú thích nên nêu rõ sắc thái bị động sát nghĩa mà không dùng cách nói gây sắc thái miệt thị không cần thiết.'
  naturalness: Bản văn nhìn chung tự nhiên, trang trọng vừa phải. “Làm sao bạn vào được đây” rõ nghĩa hỏi về cách thức hơn và vẫn tự nhiên trong lời chất vấn. Chú thích “bị làm cho câm lặng” không tự nhiên bằng “bị làm cho im lặng” hoặc “bị bịt miệng.”
  terminology: “Bạn ơi” giữ được lối xưng hô bề ngoài lịch sự nhưng có khoảng cách; “y phục dự tiệc cưới” phù hợp với ἔνδυμα γάμου và không quy định quá mức loại trang phục. Không cần áp đặt nghĩa biểu tượng cho y phục.
  issues:
  - severity: medium
    issue: “sao bạn vào đây” có thể bị hiểu chủ yếu là hỏi nguyên nhân.
    rationale: πῶς trong nguyên văn hỏi “bằng cách nào/làm sao,” không phải “tại sao.” Cần diễn đạt rõ hơn để bảo toàn hướng câu hỏi.
  - severity: low
    issue: Chú thích dùng “bị làm cho câm lặng” và “bị bịt mõm.”
    rationale: “Câm lặng” không phải cách nói tự nhiên ở đây; “bịt mõm” trong tiếng Việt dễ mang sắc thái hạ nhục/đối xử như thú vật mạnh hơn mức cần thiết. “Bị làm cho im lặng” và “bị bịt miệng” truyền đạt hợp lý nghĩa sát và nền nghĩa đen của φιμόω.
