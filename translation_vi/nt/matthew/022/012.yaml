source:
  edition: SBLGNT
  text: καὶ λέγει αὐτῷ· Ἑταῖρε, πῶς εἰσῆλθες ὧδε μὴ ἔχων ἔνδυμα γάμου; ὁ δὲ ἐφιμώθη.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/012.yaml
  text: And he says to him[a], ‘Friend, how did you come in here without a wedding garment?’ But he was speechless.
translation:
  language: vi
  text: 'Ông nói với người ấy: “Bạn ơi, làm sao bạn vào được đây mà không có y phục dự tiệc cưới?” Nhưng người ấy không nói được lời nào.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay sát nghĩa hơn: “bị làm cho im lặng.” Động từ Hy Lạp này cũng có thể mang nghĩa đen là “bị bịt miệng.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἑταῖρε
  choice: Bạn ơi
  rationale: Lời xưng hô trực tiếp này có vẻ lịch sự nhưng tạo khoảng cách và mang ý trách cứ trong ngữ cảnh. “Bạn ơi” tự nhiên trong tiếng Việt, đồng thời không làm giọng điệu trở nên thân mật hoặc thù địch quá mức.
- source_word: πῶς
  choice: sao
  rationale: Ở đây từ này hỏi người ấy làm thế nào có thể vào trong tình trạng như vậy; “sao” là cách hỏi tự nhiên trong tiếng Việt và vẫn giữ sắc thái chất vấn của “thế nào/làm sao”.
- source_word: εἰσῆλθες ὧδε
  choice: bạn vào đây
  rationale: Động từ aorist chỉ hành động đi vào đã xảy ra; cách diễn đạt này gọn, tự nhiên và giữ rõ ý bước vào nơi này.
- source_word: μὴ ἔχων
  choice: mà không có
  rationale: 'Diễn đạt tự nhiên cấu trúc phân từ chỉ hoàn cảnh đi kèm: người ấy vào nhưng thiếu y phục cần thiết.'
- source_word: ἔνδυμα γάμου
  choice: y phục dự tiệc cưới
  rationale: ἔνδυμα là y phục hoặc món đồ mặc, còn γάμου liên hệ đến lễ hay tiệc cưới. Cách dịch này không xác định quá mức đó là áo choàng hay một loại trang phục cụ thể.
- source_word: ἐφιμώθη
  choice: không nói được lời nào
  rationale: Dạng bị động của φιμόω theo nghĩa đen là “bị bịt mõm” và theo nghĩa chuyển là bị làm cho im tiếng. Trong ngữ cảnh, câu diễn tả người ấy không thể đáp lời; bản dịch chính truyền đạt kết quả tự nhiên, còn nghĩa sát chữ được ghi ở chú thích.
theological_decisions:
- issue: Sắc thái lời chủ tiệc gọi vị khách mặc không đúng y phục
  choice: Lời gọi “Bạn ơi” lịch sự nhưng hàm ý quở trách
  alternative: “Này bạn” hoặc “anh bạn” với sắc thái lạnh lùng hay gay gắt hơn
  rationale: Nguyên văn tạo khoảng cách trong khi vẫn dùng một cách gọi bề ngoài lịch sự. Bản dịch giữ căng thẳng của câu chuyện mà không áp đặt thái độ thân thiện hay khinh miệt quá mức.
- issue: Cách dịch ἐφιμώθη
  choice: Diễn đạt kết quả là “không nói được lời nào” trong chính văn
  alternative: Dịch sát hơn là “bị làm cho câm lặng” hoặc theo nghĩa đen “bị bịt mõm”
  rationale: Cách dịch chính rõ nghĩa và tự nhiên trong tiếng Việt, nhưng không xóa sắc thái bị động của động từ vì chú thích nêu rõ các cách hiểu sát chữ hơn.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “y phục” để giữ sắc thái nghiêm trang mà không xác định một loại áo cụ thể; câu kết dùng lối nói tự nhiên, với chú thích bảo tồn hình ảnh mạnh và dạng bị động của nguyên văn.
