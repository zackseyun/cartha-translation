  to: Vậy, hãy đi đến các ngã đường[a], gặp bao nhiêu người thì mời bấy nhiêu người vào dự tiệc cưới[b].
  rationale: Chỉnh “đi ra” thành “đi đến” để không thêm hướng di chuyển ngoài nguyên văn; chỉnh cấu trúc số lượng để phản ánh rõ ὅσους ἐὰν εὕρητε; và làm tự nhiên hóa một cụm trong chú thích. Các lựa chọn từ vựng chính và tính mơ hồ địa lý của cụm διεξόδους τῶν ὁδῶν vẫn được giữ.
