    rationale: πορεύεσθε là “hãy đi/đi đến”; hướng “ra” có thể suy ra từ ngữ cảnh dụ ngôn nhưng không được nêu trong câu Hy Lạp.
  - severity: low
    issue: Cách diễn đạt phạm vi người được gặp có thể sát hơn
    rationale: “Gặp bao nhiêu người thì mời bấy nhiêu người” biểu đạt trực tiếp hơn tương quan số lượng trong ὅσους ἐὰν εὕρητε, đồng thời vẫn tự nhiên.
  - severity: low
    issue: Chú thích a có cụm từ chưa tự nhiên
    rationale: “Các lối ra của đường” là cách nói tiếng Việt rõ hơn “các lối ra đường,” mà không thay đổi nội dung chú thích.
