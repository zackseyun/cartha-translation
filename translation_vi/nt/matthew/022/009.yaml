source:
  edition: SBLGNT
  text: πορεύεσθε οὖν ἐπὶ τὰς διεξόδους τῶν ὁδῶν, καὶ ὅσους ⸀ἐὰν εὕρητε καλέσατε εἰς τοὺς γάμους.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/009.yaml
  text: Therefore go to the street intersections[b][a], and invite to the wedding feast as many as you find.
translation:
  language: vi
  text: Vậy, hãy đi đến các ngã đường[a], gặp bao nhiêu người thì mời bấy nhiêu người vào dự tiệc cưới[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “các giao lộ” hoặc “các lối ra của đường”; từ Hy Lạp chỉ những nơi các con đường phân nhánh, giao nhau hoặc dẫn ra ngoài.
    reason: lexical_alternative
  - marker: b
    text: Nguyên văn Hy Lạp là “các lễ cưới”, một cách nói chỉ lễ mừng hoặc yến tiệc cưới.
    reason: lexical_alternative
lexical_decisions:
- source_word: πορεύεσθε
  choice: hãy đi ra
  rationale: Mệnh lệnh hiện tại có lực chỉ thị trực tiếp; “hãy đi ra” tự nhiên trong tiếng Việt và hợp với việc sai các đầy tớ ra nơi công cộng.
- source_word: οὖν
  choice: Vậy
  rationale: Diễn tả kết quả hoặc suy luận từ lời nói trước đó, tự nhiên hơn “do đó” trong lời kể trực tiếp.
- source_word: ἐπὶ τὰς διεξόδους τῶν ὁδῶν
  choice: ra các ngã đường
  rationale: διέξοδοι có thể chỉ những lối ra, chỗ đường phân nhánh hoặc giao nhau. “Các ngã đường” vừa tự nhiên, vừa giữ được độ rộng nghĩa mà không xác định quá mức địa hình.
- source_word: ὅσους ἐὰν εὕρητε
  choice: gặp bao nhiêu người thì ... tất cả
  rationale: Cấu trúc này diễn tả phạm vi không giới hạn và sắc thái số lượng; cách nói tiếng Việt này truyền đạt rõ ý mời hết mọi người họ gặp.
- source_word: καλέσατε
  choice: mời
  rationale: Trong bối cảnh tiệc cưới, καλέω mang nghĩa mời đến dự hơn là chỉ gọi hoặc triệu tập.
- source_word: εἰς τοὺς γάμους
  choice: vào dự tiệc cưới
  rationale: Dạng số nhiều γάμοι ở đây chỉ lễ mừng hoặc yến tiệc cưới, không phải nhiều đám cưới. “Dự tiệc cưới” diễn đạt tự nhiên bối cảnh của dụ ngôn.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “ngã đường” để giữ tính cụ thể nhưng không thu hẹp nghĩa của cụm Hy Lạp; cấu trúc “gặp bao nhiêu người thì mời tất cả” bảo toàn sắc thái bao quát của nguyên văn.
