  text: Καὶ ἀποκριθεὶς ὁ Ἰησοῦς πάλιν εἶπεν ⸂ἐν παραβολαῖς αὐτοῖς⸃ λέγων·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/001.yaml
  text: 'And Jesus answered and again spoke to them in parables[a], saying:'
translation:
  language: vi
  text: Đức Giê-su đáp lời và lại nói với họ bằng các dụ ngôn rằng:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Đức Giê-su trả lời và lại nói với họ bằng các dụ ngôn rằng.” Tiếng Hy Lạp dùng thành ngữ tường thuật thông dụng “trả lời/đáp lời” dù ngay trước đó không nêu một câu hỏi trực tiếp.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: lại
  rationale: Trong mạch kể chuyện, liên từ Καὶ kết hợp tự nhiên với πάλιν thành cách diễn đạt tiếng Việt gọn và rõ; không cần dịch riêng là “và”.
- source_word: ἀποκριθεὶς
  choice: đáp lời
  rationale: Giữ thành ngữ tường thuật Hy Lạp “trả lời/đáp lời” dù ngay trước đó không có câu hỏi trực tiếp; “đáp lời” trang trọng và tự nhiên hơn “trả lời” trong ngữ cảnh này.
- source_word: ὁ Ἰησοῦς
  choice: Đức Giê-su
  rationale: Cách gọi tên trang trọng, quen thuộc và dễ hiểu trong tiếng Việt hiện đại; mạo từ Hy Lạp không được dịch riêng trước tên riêng.
- source_word: πάλιν
  choice: lại
  rationale: Diễn đạt trực tiếp ý hành động được lặp lại trong chuỗi diễn từ.
- source_word: εἶπεν
  choice: —
  rationale: Ý nói năng của εἶπεν được gộp tự nhiên vào “đáp lời ... rằng”, tránh lặp vụng về với phân từ λέγων mà không làm mất nội dung.
- source_word: ἐν παραβολαῖς
  choice: bằng các dụ ngôn
  rationale: ἐν với tặng cách ở đây chỉ phương tiện hoặc cách thức; “bằng các dụ ngôn” tự nhiên và giữ dạng số nhiều của παραβολαῖς.
- source_word: αὐτοῖς
  choice: họ
  rationale: Đại từ chỉ những người được Đức Giê-su nói với; đặt sau “đáp lời” phù hợp cú pháp tiếng Việt.
- source_word: λέγων
  choice: rằng
  rationale: Giới thiệu nội dung lời nói tiếp theo một cách tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Sắc thái thành ngữ của ἀποκριθεὶς khi ngay trước đó không có câu hỏi trực tiếp
  choice: Giữ “đáp lời”
  alternative: “nói với họ” hoặc “lên tiếng”
  rationale: Đây là thành ngữ tường thuật thông dụng, không nhất thiết hàm ý có một câu hỏi trực tiếp. Giữ “đáp lời” bảo toàn từ ngữ và sự nối tiếp diễn ngôn của bản Hy Lạp mà không áp đặt cách giải thích.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Cấu trúc được làm gọn theo cú pháp tiếng Việt, đồng thời chú thích bảo tồn cách diễn đạt sát hình thức của tiếng Hy Lạp.
