  text: οἱ δὲ λοιποὶ κρατήσαντες τοὺς δούλους αὐτοῦ ὕβρισαν καὶ ἀπέκτειναν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/006.yaml
  text: But the rest[a], seizing his servants, mistreated them and killed them.
translation:
  language: vi
  text: Còn những người còn lại thì bắt giữ các đầy tớ của vua, ngược đãi rồi giết họ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ δὲ λοιποὶ
  choice: Còn những người khác thì
  rationale: λοιποί chỉ những người còn lại trong số khách được mời; kết cấu “còn... thì” diễn đạt tự nhiên sắc thái đối lập nhẹ của δέ với nhóm đã bỏ đi ở câu trước.
- source_word: κρατήσαντες
  choice: bắt
  rationale: κρατέω ở đây mang nghĩa bắt giữ hoặc khống chế. Phân từ bất định quá khứ diễn tả hành động xảy ra trước hoặc gắn liền với các động từ chính; chuỗi “bắt..., ngược đãi rồi giết” thể hiện trình tự tự nhiên trong tiếng Việt.
- source_word: τοὺς δούλους αὐτοῦ
  choice: các đầy tớ của vua
  rationale: δοῦλος có thể chỉ nô lệ hoặc đầy tớ. Trong ngữ cảnh dụ ngôn về một vị vua sai người đi truyền lời, “đầy tớ” là cách gọi tự nhiên, trang trọng trong tiếng Việt. “Của vua” làm rõ đại từ αὐτοῦ theo nhân vật đã được nhắc đến mà không thay đổi sở chỉ.
- source_word: ὕβρισαν
  choice: ngược đãi
  rationale: ὑβρίζω diễn tả sự đối xử xúc phạm, nhục nhã và có thể mang tính bạo lực; “ngược đãi” bao quát hơn “sỉ nhục” thuần túy bằng lời.
- source_word: ἀπέκτειναν
  choice: giết
  rationale: ἀποκτείνω có nghĩa trực tiếp là giết; không dùng “sát hại” hay “ám sát” để tránh thêm sắc thái không được mã hóa riêng trong động từ.
theological_decisions:
- issue: Cách dịch δοῦλος trong bối cảnh dụ ngôn
  choice: đầy tớ
  alternative: nô lệ
  rationale: Cả hai nghĩa đều có cơ sở từ vựng. Ở đây vai trò sứ giả phục vụ vua nổi bật trong diễn tiến câu chuyện, nên “đầy tớ” tự nhiên hơn với độc giả Việt và không đưa thêm một dụng ý thần học; “nô lệ” có thể nhấn mạnh địa vị sở hữu trong xã hội cổ đại nhưng dễ làm trọng tâm chuyển khỏi vai trò của họ trong dụ ngôn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “còn... thì” để nối với câu trước; “rồi” làm rõ trình tự của các hành động mà không diễn giải vượt quá cấu trúc Hy Lạp.
