  text: εἰπὸν οὖν ἡμῖν τί σοι δοκεῖ· ἔξεστιν δοῦναι κῆνσον Καίσαρι ἢ οὔ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/017.yaml
  text: Tell us, then, what do you think? Is it lawful to give the poll tax to Caesar, or not?
translation:
  language: vi
  text: 'Vậy, xin nói cho chúng tôi biết ông nghĩ thế nào: Có được phép nộp thuế thân cho Xê-da hay không?'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰπὸν οὖν ἡμῖν
  choice: Vậy, xin nói cho chúng tôi biết
  rationale: Diễn đạt tự nhiên lời yêu cầu trong tiếng Việt, đồng thời giữ liên từ suy luận οὖν là “vậy”.
- source_word: τί σοι δοκεῖ
  choice: ông nghĩ thế nào
  rationale: Giữ sát câu hỏi về ý kiến hoặc nhận định của người được hỏi; “ông” phù hợp ngữ cảnh đối thoại lịch sự nhưng mang tính gài bẫy.
- source_word: ἔξεστιν
  choice: có được phép
  rationale: Phản ánh câu hỏi về điều được luật pháp cho phép, không tự quyết định đó là luật La Mã hay luật tôn giáo.
- source_word: δοῦναι
  choice: nộp
  rationale: Động từ Hy Lạp theo nghĩa đen là “cho/trao”, nhưng với thuế, tiếng Việt tự nhiên dùng “nộp”; không làm thay đổi nội dung nghĩa vụ được hỏi.
- source_word: κῆνσον
  choice: thuế thân
  rationale: Chỉ khoản thuế định suất/thuế đầu người của La Mã, cụ thể hơn từ chung “thuế”.
- source_word: Καίσαρι
  choice: cho Xê-da
  rationale: Dùng dạng tên quen thuộc trong tiếng Việt cho tước hiệu Caesar; giới từ “cho” thể hiện người nhận khoản thuế.
- source_word: ἢ οὔ
  choice: hay không
  rationale: Giữ nguyên cấu trúc câu hỏi nhị phân ở cuối câu.
theological_decisions:
- issue: Cơ sở của tính hợp pháp trong ἔξεστιν
  choice: Dịch trung tính là “có được phép”
  alternative: “có đúng luật” hoặc “Luật pháp có cho phép”
  rationale: Nguyên văn không nói rõ luật La Mã, luật Môi-se hay nghĩa vụ tôn giáo nói chung; bản dịch không nên giải quyết sự mơ hồ ấy.
- issue: Nghĩa của δοῦναι trong câu hỏi về thuế
  choice: “nộp”
  alternative: “đưa/trao” hoặc “cho”
  rationale: “Nộp thuế” là kết hợp từ tự nhiên trong tiếng Việt; vẫn giữ trọng tâm của câu hỏi về việc trao khoản thuế cho Xê-da, không thêm quan điểm thần học về tính chính đáng của quyền lực.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Giữ câu hỏi trực tiếp cùng sự căng thẳng pháp lý–thần học của nguyên văn; không thêm lời giải thích về đế quốc La Mã trong chính văn.
