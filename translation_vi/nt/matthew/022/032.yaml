id: MAT.22.32
reference: Matthew 22:32
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἐγώ εἰμι ὁ θεὸς Ἀβραὰμ καὶ ὁ θεὸς Ἰσαὰκ καὶ ὁ θεὸς Ἰακώβ; οὐκ ἔστιν ⸂ὁ θεὸς⸃ νεκρῶν ἀλλὰ ζώντων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/032.yaml
  text: I am the God of Abraham and the God of Isaac and the God of Jacob. He is not the God of the dead[a], but of the living.
translation:
  language: vi
  text: “Ta là Đức Chúa Trời của Áp-ra-ham, Đức Chúa Trời của Y-sác và Đức Chúa Trời của Gia-cốp.” Ngài không phải là Đức Chúa Trời của người chết, nhưng của người sống.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐγώ εἰμι
  choice: Ta là
  rationale: Giữ nguyên lời tự xưng ở thì hiện tại và sắc thái trang trọng của câu trích dẫn; “Ta” phù hợp khi Đức Chúa Trời tự phán trong văn cảnh Kinh Thánh.
- source_word: ὁ θεὸς Ἀβραὰμ ... ὁ θεὸς Ἰσαὰκ ... ὁ θεὸς Ἰακώβ
  choice: Đức Chúa Trời của Áp-ra-ham, Đức Chúa Trời của Y-sác và Đức Chúa Trời của Gia-cốp
  rationale: Giữ sự lặp lại θεὸς của nguyên văn để bảo toàn nhịp điệu và sức nhấn mạnh, thay vì rút gọn thành một danh sách tên.
- source_word: οὐκ ἔστιν ὁ θεὸς
  choice: Ngài không phải là Đức Chúa Trời
  rationale: Dùng đại từ “Ngài” để câu tiếng Việt tự nhiên, trong khi “Đức Chúa Trời” ở vị ngữ vẫn phản ánh danh từ θεὸς được lặp lại trong tiếng Hy Lạp.
- source_word: νεκρῶν
  choice: người chết
  rationale: Tính từ số nhiều dùng như danh từ; “người chết” là cách diễn đạt tự nhiên, ngắn gọn và tương phản trực tiếp với “người sống”.
- source_word: ζώντων
  choice: người sống
  rationale: Phân từ hiện tại số nhiều dùng như danh từ; cách dịch này giữ sự đối xứng súc tích với “người chết”.
theological_decisions:
- issue: Hàm ý rằng các tổ phụ vẫn sống trước mặt Đức Chúa Trời trong lập luận của Chúa Giê-su về sự sống lại
  choice: Dịch trực tiếp “Ngài không phải là Đức Chúa Trời của người chết, nhưng của người sống.”
  alternative: Diễn giải thành “Ngài không phải là Đức Chúa Trời của những người đã chết, nhưng của những người vẫn đang sống trước mặt Ngài.”
  rationale: Bản dịch giữ nguyên sức nặng của lập luận nhưng không thêm lời giải thích về sự sống lại hay tình trạng trung gian mà câu Hy Lạp không phát biểu tường minh.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ cách phiên âm tên riêng quen thuộc trong Kinh Thánh tiếng Việt và giữ phép lặp có chủ ý của nguyên văn. Không cần chú thích vì tiếng Việt có thể dùng “Ngài” tự nhiên mà vẫn giữ “Đức Chúa Trời” ở vị ngữ.
