- from: Vương quốc thiên đàng được ví như một vị vua tổ chức tiệc cưới cho con trai mình.[a][b]
  to: Nước Trời được ví như một vị vua mở tiệc cưới cho con trai mình.[a][b]
  rationale: Bản sửa thay thuật ngữ dễ gây lệch nghĩa “Vương quốc thiên đàng” bằng “Nước Trời”, cách dịch tự nhiên và thông dụng cho ἡ βασιλεία τῶν οὐρανῶν trong Ma-thi-ơ, mà không diễn giải thần học. “Mở tiệc cưới” cải thiện tính tự nhiên và nhấn đúng hành động thiết đãi; các chú thích được chỉnh nhẹ để nhất quán với câu chính và vẫn bảo toàn các khả năng từ vựng của nguyên văn.
