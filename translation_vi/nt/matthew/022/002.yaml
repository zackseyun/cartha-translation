  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ὡμοιώθη ἡ βασιλεία τῶν οὐρανῶν ἀνθρώπῳ βασιλεῖ, ὅστις ἐποίησεν γάμους τῷ υἱῷ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/002.yaml
  text: The kingdom of heaven was compared to a king who gave a wedding feast for his son[a][b].
translation:
  language: vi
  text: Nước Trời được ví như một vị vua mở tiệc cưới cho con trai mình.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc dịch: “có thể ví như”. Động từ Hy Lạp ở đây theo nghĩa đen là “được ví như” hoặc “được làm cho giống như”.'
    reason: lexical_alternative
  - marker: b
    text: Nguyên văn Hy Lạp dùng “các lễ cưới” ở số nhiều, một cách nói có thể chỉ những ngày lễ mừng cưới hoặc yến tiệc cưới.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὡμοιώθη
  choice: được ví như
  rationale: Thể aorist bị động của ὁμοιόω được giữ bằng cấu trúc bị động tự nhiên trong tiếng Việt. Cách dịch này không thêm sắc thái khả năng như “có thể ví như”.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: Vương quốc thiên đàng
  rationale: Giữ nguyên cách diễn đạt đặc trưng của Ma-thi-ơ, không đồng nhất hóa thành “Vương quốc Đức Chúa Trời”; “vương quốc” vẫn để ngỏ sắc thái lãnh thổ và quyền trị vì.
- source_word: ἀνθρώπῳ βασιλεῖ
  choice: một vị vua
  rationale: Trong ngữ cảnh này, ἀνθρώπῳ βασιλεῖ là cách nói chỉ một người mang thân phận vua; “một vị vua” truyền đạt tự nhiên mà không cần lặp gượng “một người, một vị vua”.
- source_word: ὅστις
  choice: '[mệnh đề trực tiếp] tổ chức'
  rationale: Tiếng Việt tự nhiên có thể nối trực tiếp hành động sau danh từ “vị vua” mà không cần đại từ quan hệ tương ứng; quan hệ cú pháp vẫn rõ.
- source_word: ἐποίησεν
  choice: tổ chức
  rationale: Khi kết hợp với γάμους, ποιέω mang nghĩa thành ngữ là tổ chức hoặc mở một lễ tiệc; “tổ chức” rõ và tự nhiên trong tiếng Việt hiện đại.
- source_word: γάμους
  choice: tiệc cưới
  rationale: Dạng số nhiều Hy Lạp có thể chỉ các lễ hội hoặc yến tiệc cưới; “tiệc cưới” diễn đạt gọn và phù hợp với bối cảnh dụ ngôn.
- source_word: τῷ υἱῷ αὐτοῦ
  choice: cho con trai mình
  rationale: Giữ giá trị tặng cách chỉ người được hưởng hay người mà buổi tiệc được tổ chức cho; “mình” quy chiếu tự nhiên về vị vua.
theological_decisions:
- issue: Cách hiểu cụm “vương quốc thiên đàng”
  choice: Giữ “Vương quốc thiên đàng” theo cách dùng của Ma-thi-ơ.
  alternative: “Vương quốc Đức Chúa Trời” hoặc “quyền trị vì của thiên đàng”
  rationale: Không thay thế bằng một diễn giải thần học; cách dịch này bảo toàn nét văn chương và thần học riêng của Ma-thi-ơ, đồng thời không ép cụm từ chỉ mang nghĩa lãnh thổ hay chỉ mang nghĩa quyền trị vì.
- issue: Đối tượng được đem ra so sánh
  choice: Giữ nguyên cấu trúc rằng “Vương quốc thiên đàng” được ví như “một vị vua”.
  alternative: Diễn giải rằng toàn bộ hoàn cảnh hoặc câu chuyện sau đó mô tả vương quốc
  rationale: Bản dịch không âm thầm sửa độ căng trong hình thức dụ ngôn của nguyên văn, dù về mặt diễn giải phép so sánh có thể bao quát toàn bộ câu chuyện.
translation_notes:
  register: Văn phong tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. “Vị vua” thể hiện sự tôn xưng thông thường; “tổ chức tiệc cưới” là cách nói tự nhiên, không cổ hóa. Các ký hiệu chú thích [a], [b] đều xuất hiện trong câu chính.
