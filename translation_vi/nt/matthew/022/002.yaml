  naturalness: Câu hiện tại nhìn chung dễ hiểu, nhưng “Vương quốc thiên đàng” là một kết hợp ít tự nhiên trong tiếng Việt hiện đại và dễ tạo sắc thái khác với nguyên văn. “Nước Trời” là cách nói ngắn gọn, tự nhiên, đã được xác lập trong văn phong Kinh Thánh tiếng Việt, đồng thời vẫn giữ cách diễn đạt riêng của Ma-thi-ơ. “Mở tiệc cưới” tự nhiên hơn “tổ chức tiệc cưới” và làm rõ đây là một yến tiệc do vua khoản đãi.
  terminology: Đổi “Vương quốc thiên đàng” thành “Nước Trời”. Cách này không thay bằng “Nước Đức Chúa Trời” và không áp đặt cách giải thích “quyền trị vì”. Giữ “vị vua”, “con trai mình”, và “tiệc cưới” là phù hợp.
