  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἀκούσαντες οἱ ὄχλοι ἐξεπλήσσοντο ἐπὶ τῇ διδαχῇ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/033.yaml
  text: And when the crowds heard it[a], they were astonished at his teaching.
translation:
  language: vi
  text: Khi nghe vậy[a], dân chúng kinh ngạc về lời dạy của Ngài.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Sau khi nghe điều ấy,” hoặc sát hơn: “Nghe xong.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσαντες
  choice: Khi nghe vậy
  rationale: Phân từ bất định quá khứ chủ động, số nhiều, bổ nghĩa cho “dân chúng”; mệnh đề thời gian là cách diễn đạt tự nhiên trong tiếng Việt. “Vậy” chỉ điều họ vừa nghe, tức câu trả lời trước đó của Chúa Giê-su, mà không thêm một tân ngữ quá cụ thể.
- source_word: οἱ ὄχλοι
  choice: dân chúng
  rationale: Danh từ số nhiều có mạo từ chỉ những đám đông hiện diện. “Dân chúng” tự nhiên trong tiếng Việt hiện đại và có thể diễn đạt tập hợp nhiều người mà không dùng từ cổ “quần chúng” hay cách nặng nề “các đám đông”.
- source_word: ἐξεπλήσσοντο
  choice: kinh ngạc
  rationale: Thì chưa hoàn thành trung động/bị động miêu tả phản ứng đang diễn ra hoặc được khắc họa sinh động. “Kinh ngạc” truyền đạt mức độ mạnh của động từ mà vẫn tự nhiên, trang trọng.
- source_word: ἐπὶ τῇ διδαχῇ αὐτοῦ
  choice: về lời dạy của Ngài
  rationale: ἐπί với cách dữ ở đây nêu cơ sở hoặc nguyên cớ của sự kinh ngạc. “Về lời dạy” tự nhiên trong tiếng Việt và giữ διδαχή ở nghĩa sự giảng dạy, không kỹ thuật hóa thành “giáo lý”.
- source_word: καὶ
  choice: (không dịch riêng)
  rationale: Liên từ nối tiếp câu chuyện. Trong tiếng Việt, mở đầu bằng “Khi” đã thể hiện mạch nối tự nhiên; thêm “Và” sẽ kém trôi chảy mà không bổ sung nội dung.
theological_decisions: []
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “Ngài” cho đại từ chỉ Chúa Giê-su nhằm giữ sự tôn kính quen thuộc trong văn bản Kinh Thánh; câu văn gọn và giữ quan hệ thời gian của phân từ Hy Lạp.
