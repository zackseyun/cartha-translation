  text: περὶ δὲ τῆς ἀναστάσεως τῶν νεκρῶν οὐκ ἀνέγνωτε τὸ ῥηθὲν ὑμῖν ὑπὸ τοῦ θεοῦ λέγοντος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/031.yaml
  text: Concerning the resurrection of the dead[a], have you not read what was spoken to you by God, saying,
translation:
  language: vi
  text: 'Còn về sự sống lại của người chết, các ông chưa đọc điều Đức Chúa Trời đã phán với các ông sao:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: περὶ δὲ
  choice: Còn về
  rationale: περί với sở hữu cách nêu chủ đề đang được bàn đến, còn δέ đánh dấu sự chuyển ý. “Còn về” tự nhiên trong tiếng Việt và giữ được chức năng chuyển sang điểm kế tiếp mà không biến δέ thành một sự tương phản quá mạnh.
- source_word: τῆς ἀναστάσεως τῶν νεκρῶν
  choice: sự sống lại của người chết
  rationale: ἀνάστασις ở đây chỉ sự sống lại mà người Sa-đu-sê phủ nhận; τῶν νεκρῶν xác định người chết là những người sống lại. Cách diễn đạt này vừa sát cấu trúc Hy Lạp vừa rõ ràng trong tiếng Việt.
- source_word: οὐκ ἀνέγνωτε
  choice: các ông chưa đọc
  rationale: Đây là câu hỏi tu từ trách người nghe không nhận ra điều họ đáng lẽ phải biết từ Kinh Thánh. “Chưa đọc” là cách hỏi tự nhiên trong tiếng Việt, phù hợp với ý nghĩa của động từ aorist trong ngữ cảnh.
- source_word: τὸ ῥηθὲν ὑμῖν ὑπὸ τοῦ θεοῦ
  choice: lời Đức Chúa Trời phán với các ông
  rationale: Phân từ bị động có nghĩa đen là “điều đã được phán”, với Đức Chúa Trời là tác nhân và “các ông” là đối tượng được nói với. Chuyển sang cấu trúc chủ động giúp câu tiếng Việt tự nhiên hơn nhưng vẫn giữ đầy đủ tác nhân thần linh và tính trực tiếp của lời phán.
- source_word: λέγοντος
  choice: rằng
  rationale: Phân từ này dẫn vào lời trích trực tiếp ở câu tiếp theo. “Rằng” nối tự nhiên với động từ “phán” và dấu hai chấm báo hiệu lời trích sắp đến.
theological_decisions:
- issue: Đức Chúa Trời là Đấng phán qua lời Kinh Thánh và lời ấy hướng đến người nghe
  choice: “lời Đức Chúa Trời phán với các ông”
  alternative: “điều đã được Đức Chúa Trời phán với các ông”
  rationale: Bản Hy Lạp nêu rõ Đức Chúa Trời là tác nhân phán và lời ấy được nói với chính những người đang nghe. Cách dịch chủ động bảo toàn cả hai điểm này mà không thêm một học thuyết về sự linh cảm vượt quá điều câu văn khẳng định.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “các ông” vì Chúa Giê-su đang trực tiếp chất vấn một nhóm người nam trong cuộc tranh luận. “Đức Chúa Trời” được dùng làm cách gọi trang trọng, phổ thông trong văn bản Kinh Thánh tiếng Việt. Câu kết bằng dấu hai chấm vì lời trích dẫn tiếp tục ở câu 32.
