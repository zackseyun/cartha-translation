source:
  edition: SBLGNT
  text: οὐ δύναται δένδρον ἀγαθὸν καρποὺς πονηροὺς ⸀ποιεῖν, οὐδὲ δένδρον σαπρὸν καρποὺς καλοὺς ποιεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/018.yaml
  text: A good tree cannot produce bad fruit[c][b][a], nor can a rotten tree produce good fruit.
translation:
  language: vi
  text: Cây tốt không thể sinh trái xấu, cây mục cũng không thể sinh trái tốt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δένδρον ἀγαθόν
  choice: cây tốt
  rationale: ἀγαθός thường có nghĩa là “tốt”. “Cây tốt” vừa giữ nguyên hình ảnh vừa bảo toàn sắc thái đánh giá, không thu hẹp nghĩa thành tình trạng khỏe mạnh.
- source_word: οὐ δύναται ... ποιεῖν
  choice: không thể sinh
  rationale: δύναται diễn tả sự có khả năng; khi bị phủ định, cụm từ nêu sự bất khả. Trong ngữ cảnh cây và trái, ποιεῖν được diễn đạt tự nhiên bằng “sinh”.
- source_word: καρποὺς πονηρούς
  choice: trái xấu
  rationale: πονηρός có thể chỉ điều xấu, ác hoặc kém phẩm chất. “Trái xấu” tự nhiên trong tiếng Việt, giữ được cả hình ảnh cụ thể lẫn ý nghĩa đánh giá mà không diễn giải quá mức.
- source_word: οὐδέ
  choice: cũng không thể
  rationale: οὐδέ nối mệnh đề phủ định thứ hai song song với mệnh đề đầu. “Cũng không thể” tạo thế cân đối tự nhiên trong tiếng Việt.
- source_word: δένδρον σαπρόν
  choice: cây mục
  rationale: σαπρός chỉ tình trạng mục nát, hư hoại. “Cây mục” ngắn gọn, tự nhiên và giữ hình ảnh cụ thể mạnh hơn cách dịch chung chung là “cây xấu”.
- source_word: καρποὺς καλούς
  choice: trái tốt
  rationale: καλός ở đây mô tả trái có phẩm chất tốt. “Trái tốt” tạo sự đối lập rõ với “trái xấu” và duy trì cấu trúc song song.
theological_decisions:
- issue: Tính chất của sự bất khả trong ẩn dụ
  choice: 'Dịch theo nghĩa khẳng định dứt khoát về sự bất khả: “không thể”.'
  alternative: “thường không sinh” hoặc “không nên sinh”
  rationale: δύναται dưới dạng phủ định trực tiếp diễn tả sự không có khả năng, chứ không chỉ là điều ít xảy ra hay không nên làm. Bản dịch giữ nguyên sức nặng tu từ và đạo đức của lời nói mà không suy diễn thêm kết luận giáo lý.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “sinh trái” thay vì “tạo ra trái” vì tự nhiên hơn khi nói về cây; giữ hai vế cân đối sát cấu trúc Hy Lạp.
