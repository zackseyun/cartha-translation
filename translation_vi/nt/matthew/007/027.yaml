review_pass:
  verdict: revise
  source_fidelity: Bản nháp truyền đạt đúng chuỗi hình ảnh bão tố và sự đổ của ngôi nhà. Tuy nhiên, “trút” làm cường độ của mưa mạnh hơn βροχή, “liền” thêm sắc thái tức thời không có trong bản Hy Lạp, và “thật khủng khiếp” diễn giải μεγάλη mạnh hơn mức “lớn/lao” của nguyên văn.
  naturalness: Câu sửa vẫn dùng tiếng Việt hiện đại, tự nhiên và giữ nhịp liệt kê dồn dập của nguyên văn. Dấu chấm phẩy nối kết quả với chuỗi nguyên nhân mà không phải thêm từ suy diễn.
  terminology: “Nước lũ” là cách chuyển ngữ theo ngữ cảnh có thể chấp nhận được cho ποταμοί khi chú thích nêu nghĩa đen. “Đập vào” phản ánh phù hợp προσέκοψαν. Lặp lại “sụp đổ” phản ánh quan hệ giữa ἔπεσεν và πτῶσις; “thật lớn” giữ mức độ μεγάλη mà không cường điệu thành “khủng khiếp”.
  issues:
  - severity: medium
    issue: “Mưa trút xuống” tăng cường độ của mưa.
    rationale: βροχή chỉ là “mưa”; καταβαίνω nêu chuyển động đi xuống. “Trút” thường gợi mưa rất nặng hạt, một sắc thái không được nêu rõ.
  - severity: low
    issue: “Liền” thêm quan hệ tức thời.
    rationale: ἔπεσεν chỉ kể rằng ngôi nhà đã đổ; không có trạng từ tương đương “liền/ngay lập tức”.
  - severity: medium
    issue: “Sự sụp đổ của nó thật khủng khiếp” vượt quá μεγάλη.
    rationale: μεγάλη có nghĩa là “lớn, to lớn”; “khủng khiếp” diễn giải mức độ thành tính chất kinh hoàng hoặc thảm khốc.
  revised_text: Mưa đổ xuống, nước lũ[a] tràn tới, gió thổi và đập vào ngôi nhà ấy; ngôi nhà ấy sụp đổ, và sự sụp đổ của nó thật lớn.
