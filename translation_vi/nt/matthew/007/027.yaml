  text: καὶ κατέβη ἡ βροχὴ καὶ ἦλθον οἱ ποταμοὶ καὶ ἔπνευσαν οἱ ἄνεμοι καὶ προσέκοψαν τῇ οἰκίᾳ ἐκείνῃ, καὶ ἔπεσεν, καὶ ἦν ἡ πτῶσις αὐτῆς μεγάλη.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/027.yaml
  text: And the rain came down[a], and the rivers came, and the winds blew and beat against that house, and it fell—and its fall was great.
translation:
  language: vi
  text: Mưa đổ xuống, nước lũ[a] tràn tới, gió thổi và đập vào ngôi nhà ấy; ngôi nhà ấy sụp đổ, và sự sụp đổ của nó thật lớn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn là “các sông”; trong ngữ cảnh này, từ ấy có thể gợi những dòng nước lũ tràn tới.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατέβη ἡ βροχή
  choice: Mưa trút xuống
  rationale: Giữ hướng chuyển động xuống của καταβαίνω, đồng thời dùng cách nói tự nhiên trong tiếng Việt về một trận mưa mạnh.
- source_word: ἦλθον οἱ ποταμοί
  choice: nước lũ dâng lên
  rationale: ποταμοί theo nghĩa đen là các sông hoặc dòng nước, nhưng trong bối cảnh bão lũ chỉ những dòng nước tràn tới; cách dịch này truyền đạt hình ảnh tự nhiên mà vẫn ghi nhận nghĩa đen trong chú thích.
- source_word: ἔπνευσαν οἱ ἄνεμοι
  choice: gió thổi
  rationale: Cách dịch trực tiếp, tự nhiên của động từ πνέω đi với ἄνεμοι.
- source_word: προσέκοψαν τῇ οἰκίᾳ ἐκείνῃ
  choice: ập vào ngôi nhà ấy
  rationale: Trong bối cảnh trận bão, προσκόπτω diễn tả gió va đập vào nhà; “ập vào” gợi sức mạnh liên tục của gió và phù hợp tiếng Việt hiện đại.
- source_word: ἔπεσεν
  choice: Nhà liền đổ sập
  rationale: πίπτω cơ bản là “ngã, đổ”; với một ngôi nhà, “đổ sập” là cách diễn đạt tự nhiên và rõ nghĩa trong tiếng Việt.
- source_word: ἡ πτῶσις αὐτῆς μεγάλη
  choice: sự sụp đổ của nó thật khủng khiếp
  rationale: Giữ danh từ πτῶσις và mức độ lớn lao, nghiêm trọng do μεγάλη biểu thị; “khủng khiếp” truyền đạt hậu quả nặng nề tự nhiên hơn cách nói cứng “lớn”.
theological_decisions:
- issue: Mức độ hàm ý phán xét trong kết luận của ẩn dụ
  choice: Chỉ mô tả sự sụp đổ của ngôi nhà là “thật khủng khiếp”.
  alternative: Diễn giải thành sự phán xét đời đời hoặc một thảm họa cánh chung.
  rationale: Bản Hy Lạp nhấn mạnh mức độ nghiêm trọng của sự sụp đổ nhưng không trực tiếp gọi đó là sự phán xét cánh chung; bản dịch giữ sức cảnh báo mà không thêm kết luận thần học ngoài câu chữ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Nhịp câu mô phỏng chuỗi biến cố dồn dập của nguyên văn, nhưng tách câu trước kết quả để tiếng Việt rõ ràng và mạnh mẽ.
