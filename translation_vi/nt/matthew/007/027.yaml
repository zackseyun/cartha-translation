  to: Mưa đổ xuống, nước lũ[a] tràn tới, gió thổi và đập vào ngôi nhà ấy; ngôi nhà ấy sụp đổ, và sự sụp đổ của nó thật lớn.
  rationale: Bản sửa giảm các sắc thái được thêm vào (“trút,” “liền,” “khủng khiếp”), đồng thời giữ hình ảnh nước lũ theo ngữ cảnh với chú thích minh bạch về nghĩa đen của ποταμοί. Cấu trúc lặp “sụp đổ” giữ được hiệu ứng từ vựng giữa động từ ἔπεσεν và danh từ πτῶσις, mà không áp đặt diễn giải thần học.
