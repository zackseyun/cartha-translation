id: MAT.7.5
reference: Matthew 7:5
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὑποκριτά, ἔκβαλε πρῶτον ⸂ἐκ τοῦ ὀφθαλμοῦ σοῦ τὴν δοκόν⸃, καὶ τότε διαβλέψεις ἐκβαλεῖν τὸ κάρφος ἐκ τοῦ ὀφθαλμοῦ τοῦ ἀδελφοῦ σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/005.yaml
  text: Hypocrite[a], first remove the beam from your eye[b], and then you will see clearly to remove the speck from your brother’s eye.
translation:
  language: vi
  text: Kẻ giả hình! Trước hết, hãy lấy cây xà[a] ra khỏi mắt mình; rồi lúc ấy mới thấy rõ để lấy cái dằm[b] ra khỏi mắt người anh em của mình.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “khúc gỗ lớn” hoặc “tấm ván”.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “mẩu rơm” hoặc “mảnh vụn nhỏ”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑποκριτά
  choice: Kẻ giả hình!
  rationale: Danh từ số ít ở hô cách, dùng để quở trách trực tiếp. “Kẻ giả hình” giữ được sắc thái gay gắt của lời nói mà vẫn tự nhiên và trang trọng trong tiếng Việt hiện đại.
- source_word: ἔκβαλε / ἐκβαλεῖν
  choice: hãy lấy ... ra / để lấy ... ra
  rationale: Động từ ἐκβάλλω trong hình ảnh vật mắc trong mắt được diễn đạt tự nhiên bằng “lấy ra”; lần đầu là mệnh lệnh, lần sau là động từ nguyên mẫu chỉ mục đích.
- source_word: πρῶτον
  choice: trước hết
  rationale: Diễn tả thứ tự ưu tiên rõ ràng, tự nhiên hơn trong câu mệnh lệnh tiếng Việt.
- source_word: δοκόν
  choice: cây xà
  rationale: δοκός là một thanh gỗ lớn dùng trong kết cấu xây dựng. “Cây xà” bảo toàn hình ảnh cường điệu và sự tương phản mạnh với κάρφος.
- source_word: διαβλέψεις
  choice: mới thấy rõ
  rationale: διαβλέπω mang nghĩa nhìn rõ. Từ “mới” kết hợp với “rồi lúc ấy” thể hiện kết quả chỉ xảy ra sau hành động trước, còn “thấy rõ” giữ sắc thái tăng cường của động từ.
- source_word: κάρφος
  choice: mảnh dằm
  rationale: κάρφος chỉ một mẩu nhỏ, khô, như dằm hoặc cọng rơm. “Mảnh dằm” phù hợp với vật có thể mắc trong mắt và tương phản rõ với “cây xà”.
- source_word: ἀδελφοῦ
  choice: người anh em của mình
  rationale: Giữ nghĩa quan hệ cộng đồng của danh từ giống đực số ít ἀδελφός, đồng thời là cách nói tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Cách dịch danh từ quan hệ giống đực ἀδελφοῦ
  choice: người anh em của mình
  alternative: người khác; người lân cận
  rationale: Bản Hy Lạp dùng danh từ giống đực số ít với nghĩa đen là “anh/em trai” và trong ngữ cảnh có thể chỉ một thành viên khác trong cộng đồng. Bản dịch giữ hình ảnh quan hệ ấy thay vì trung tính hóa.
- issue: Quan hệ giữa tự sửa mình và sửa người anh em
  choice: rồi lúc ấy mới thấy rõ để lấy
  alternative: rồi mới có thể lấy
  rationale: 'Cách dịch giữ nguyên sức căng của câu Hy Lạp: sau khi lấy cây xà khỏi mắt mình, người nghe sẽ nhìn rõ nhằm lấy mảnh dằm cho người anh em. Không diễn giải thành lệnh cấm tuyệt đối việc giúp sửa lỗi người khác.'
translation_notes:
  register: Văn phong hiện đại, trang trọng và trực tiếp. Dấu chấm than làm rõ hô cách quở trách. Câu lược chủ ngữ ở vế sau để tránh áp đặt một đại từ xưng hô không có tương đương ổn định trong tiếng Việt, nhưng vẫn bảo toàn ngôi số ít nhờ mạch mệnh lệnh trực tiếp. Hai chú thích được đặt ngay sau đúng từ ngữ mà chúng giải thích.
