id: MAT.7.8
reference: Matthew 7:8
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: πᾶς γὰρ ὁ αἰτῶν λαμβάνει καὶ ὁ ζητῶν εὑρίσκει καὶ τῷ κρούοντι ⸀ἀνοιγήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/008.yaml
  text: For everyone who asks receives[a], and the one who seeks finds, and to the one who knocks it will be opened.
translation:
  language: vi
  text: Vì ai xin thì nhận được, ai tìm thì thấy, ai gõ thì sẽ được mở cho người ấy.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn không nói rõ vật gì sẽ được mở; hình ảnh ngụ ý là cửa.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς
  choice: ai
  rationale: Trong cấu trúc πᾶς ὁ αἰτῶν, từ này chỉ mọi người thuộc nhóm được mô tả. Tiếng Việt dùng “ai… thì…” vừa tự nhiên vừa giữ phạm vi phổ quát.
- source_word: γὰρ
  choice: Vì
  rationale: Giữ chức năng giải thích, nối lời bảo đảm này với lời kêu gọi ở câu trước.
- source_word: ὁ αἰτῶν
  choice: ai xin
  rationale: Phân từ hiện tại có mạo từ chỉ người đang hoặc thường làm hành động; cấu trúc “ai xin thì…” diễn đạt tự nhiên tính khái quát ấy.
- source_word: λαμβάνει
  choice: nhận được
  rationale: Diễn đạt nghĩa thông thường của λαμβάνω và phù hợp với sắc thái của một điều được ban cho hơn từ khẩu ngữ “có được”.
- source_word: ὁ ζητῶν
  choice: ai tìm
  rationale: Giữ cấu trúc song song, ngắn gọn và giàu nhịp điệu của câu Hy Lạp.
- source_word: εὑρίσκει
  choice: thấy
  rationale: “Tìm thì thấy” là cách nói tự nhiên, dễ nhớ và tương ứng trực tiếp với cặp ζητέω–εὑρίσκω trong ngữ cảnh.
- source_word: τῷ κρούοντι
  choice: ai gõ
  rationale: Dạng phân từ ở tặng cách chỉ người được hưởng hành động mở; cấu trúc tiếng Việt “ai gõ thì… mở cho” thể hiện quan hệ ấy mà không nặng nề.
- source_word: ἀνοιγήσεται
  choice: sẽ được mở cho
  rationale: Giữ thì tương lai và thể bị động, đồng thời không tự ý thêm danh từ “cửa,” vốn chỉ được ngụ ý trong hình ảnh.
theological_decisions:
- issue: Phạm vi và hiệu lực của lời hứa
  choice: Diễn đạt lời bảo đảm bằng ngôn ngữ phổ quát đúng như nguyên văn, không thêm điều kiện hay giới hạn thần học.
  alternative: Hiểu đây là lời bảo đảm tuyệt đối rằng mọi lời cầu xin cụ thể đều được đáp ứng đúng như yêu cầu, hoặc tự giới hạn lời hứa chỉ vào một số loại lời cầu xin.
  rationale: Nguyên văn nói khái quát và phổ quát. Bản dịch giữ nguyên sức mạnh của lời tuyên bố nhưng không diễn giải thêm để giải quyết sự căng thẳng thần học thay cho người đọc.
- issue: Chủ thể không được nêu của ἀνοιγήσεται
  choice: Không thêm “cửa” vào chính văn.
  alternative: Dịch “cửa sẽ được mở cho,” làm rõ hình ảnh được ngụ ý.
  rationale: Động từ Hy Lạp không nêu rõ vật được mở. Cách dịch giữ sự lược bỏ của nguyên văn, còn chú thích giúp người đọc hiểu hình ảnh.
translation_notes:
  register: Văn phong hiện đại, trang trọng nhưng dễ hiểu. Ba vế dùng cấu trúc “ai… thì…” để tái hiện nhịp song song và tính khái quát của nguyên văn; không thêm đối tượng “cửa” vào chính văn.
