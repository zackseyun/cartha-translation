revisions:
- from: Vì anh em dùng cách nào để xét đoán, thì cũng sẽ bị xét đoán theo cách ấy; và anh em dùng đấu nào để đong, thì sẽ được đong cho anh em bằng đấu ấy.[a]
  to: Vì anh em dùng tiêu chuẩn nào để xét đoán, thì sẽ bị xét đoán theo tiêu chuẩn ấy; và anh em đong bằng đấu nào, thì sẽ được đong cho anh em bằng đấu ấy.[a]
  rationale: Thay «cách» bằng «tiêu chuẩn» để phản ánh κρίματι như chuẩn mực/sự phán xét được dùng, đồng thời vẫn giữ lối lặp với «xét đoán». Chỉnh nhẹ chú thích để phương án thay thế chỉ thêm «trả lại», đúng với phần bổ sung của phương án tiếng Anh và không lặp lại hình ảnh «đấu» vốn đã có trong câu chính. Thể bị động và tác nhân không xác định được giữ nguyên.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T02:43:44Z'
review_pass:
  verdict: revise
  source_fidelity: Bản nháp giữ được quan hệ tương ứng, thể bị động không nêu tác nhân, và hình ảnh «đấu/đong». Tuy nhiên, «cách nào để xét đoán» chuyển κρίματι (“sự phán xét/phán đoán; tiêu chuẩn xét đoán”) thành «cách», quá khái quát và làm mờ danh từ cùng trường nghĩa với κρίνετε/κριθήσεσθε. «Tiêu chuẩn ... xét đoán» diễn đạt chính xác hơn giá trị công cụ/chuẩn mực của ἐν ᾧ κρίματι mà vẫn tự nhiên.
  naturalness: «Dùng tiêu chuẩn nào để xét đoán» và «bị xét đoán theo tiêu chuẩn ấy» là tiếng Việt hiện đại, rõ ràng, giữ cấu trúc song hành. «Đong bằng đấu nào ... được đong cho anh em bằng đấu ấy» giữ được tính tục ngữ và không buộc phải nêu một tác nhân cho các động từ bị động.
  terminology: Dùng «xét đoán» xuyên suốt cho họ từ κρίματι/κρίνετε/κριθήσεσθε, không thu hẹp thành «kết án». Giữ «đấu/đong» cho μέτρῳ/μετρεῖτε/μετρηθήσεται để bảo toàn hình ảnh và lối lặp từ. Không xác định Đức Chúa Trời hay người khác là tác nhân.
  issues:
  - severity: medium
    issue: «cách nào để xét đoán» chưa truyền đạt đầy đủ κρίματι.
    rationale: κρίματι không chỉ là phương cách chung chung, nhưng là sự phán xét hoặc tiêu chuẩn được dùng trong khi xét đoán. Cần nêu rõ yếu tố tiêu chuẩn/xét đoán để phản ánh nguyên văn.
