source:
  edition: SBLGNT
  text: ἐν ᾧ γὰρ κρίματι κρίνετε κριθήσεσθε, καὶ ἐν ᾧ μέτρῳ μετρεῖτε μετρηθήσεται ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/002.yaml
  text: For with the judgment by which you judge[a], you will be judged, and with the measure by which you measure, it will be measured to you.
translation:
  language: vi
  text: Vì anh em dùng tiêu chuẩn nào để xét đoán, thì sẽ bị xét đoán theo tiêu chuẩn ấy; và anh em đong bằng đấu nào, thì sẽ được đong cho anh em bằng đấu ấy.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể hiểu: “thì sẽ được đong trả lại cho anh em.” Tiếng Hy Lạp không nói rõ “trả lại”, dù ý tương ứng được hàm ý trong câu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κρίματι / κρίνετε / κριθήσεσθε
  choice: cách nào để xét đoán / bị xét đoán theo cách ấy
  rationale: Cách diễn đạt này giữ sự lặp lại của cùng một họ từ Hy Lạp, đồng thời truyền đạt tự nhiên ý về tiêu chuẩn hay cách thức xét đoán, mà không thu hẹp nghĩa thành ‘kết án’.
- source_word: μέτρῳ / μετρεῖτε / μετρηθήσεται
  choice: đấu nào để đong / được đong ... bằng đấu ấy
  rationale: ‘Đấu’ và ‘đong’ giữ hình ảnh đo lường cụ thể cùng lối chơi chữ của nguyên văn, đồng thời phù hợp với sắc thái tục ngữ của câu nói.
- source_word: μετρηθήσεται ὑμῖν
  choice: sẽ được đong cho anh em
  rationale: Giữ thể bị động và đối tượng tiếp nhận, không thêm tác nhân vốn không được nêu trong tiếng Hy Lạp.
- source_word: ἐν ᾧ ... ἐν ᾧ
  choice: dùng cách nào ... theo cách ấy / dùng đấu nào ... bằng đấu ấy
  rationale: Diễn đạt giá trị công cụ hoặc tiêu chuẩn của cấu trúc Hy Lạp bằng tiếng Việt tự nhiên, đồng thời bảo toàn thế song hành.
- source_word: γὰρ
  choice: Vì
  rationale: Nối câu này với lời cấm ở câu trước như lý do giải thích.
theological_decisions:
- issue: Tác nhân của sự xét đoán và đong lại
  choice: Giữ các động từ ở thể bị động, không nêu tác nhân.
  alternative: Nói rõ Đức Chúa Trời xét đoán, hoặc người khác xét đoán.
  rationale: Nguyên văn không nói rõ tác nhân; bản dịch vì thế giữ nguyên độ mở giữa sự xét đoán của Đức Chúa Trời và tính tương ứng trong cách con người đối xử với nhau.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ ‘anh em’ phù hợp với lời Chúa Giê-su nói với các môn đồ và đám đông. Hình ảnh ‘đấu’—một dụng cụ hay đơn vị đong—được giữ lại để bảo toàn phép ẩn dụ và cấu trúc song hành của nguyên văn.
