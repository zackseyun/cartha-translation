  text: ⸀ἢ καὶ ⸂ἰχθὺν αἰτήσει⸃— μὴ ὄφιν ἐπιδώσει αὐτῷ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/010.yaml
  text: Or if he asks for a fish—he will not give him a snake[b][a], will he?
translation:
  language: vi
  text: Hay nếu con mình xin cá, lẽ nào người ấy lại cho nó một con rắn?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἢ καὶ
  choice: Hay nếu
  rationale: Mở đầu ví dụ thứ hai trong cặp câu hỏi tu từ; cách diễn đạt này tự nhiên trong tiếng Việt và không dịch thừa καί.
- source_word: ἰχθὺν
  choice: cá
  rationale: Nghĩa thông thường của danh từ này phù hợp với ngữ cảnh thức ăn; tiếng Việt không cần mạo từ.
- source_word: αἰτήσει
  choice: xin
  rationale: Động từ chỉ việc xin hoặc yêu cầu; thì tương lai Hy Lạp được diễn đạt tự nhiên bằng hiện tại trong tình huống giả định khái quát.
- source_word: μὴ
  choice: lẽ nào ... ?
  rationale: μή báo hiệu câu hỏi chờ đợi câu trả lời phủ định; cấu trúc “lẽ nào” truyền đạt rõ sức mạnh tu từ ấy trong tiếng Việt.
- source_word: ὄφιν
  choice: một con rắn
  rationale: “Rắn” là từ hiện đại, thông dụng và bao quát nghĩa của ὄφις trong ngữ cảnh này.
- source_word: ἐπιδώσει
  choice: cho
  rationale: Trong ngữ cảnh trao vật cho người xin, “cho” là cách tương đương rõ ràng và tự nhiên nhất.
- source_word: αὐτῷ
  choice: cho nó
  rationale: Đại từ gián tiếp chỉ lại người con đang xin; “nó” giữ liên kết đại từ mà không thêm danh xưng không có trong câu Hy Lạp.
theological_decisions:
- issue: Sức mạnh của câu hỏi tu từ
  choice: Dùng “lẽ nào ... ?” để cho thấy câu trả lời hiển nhiên là không.
  alternative: 'Dịch thành lời khẳng định đơn thuần: “người ấy sẽ không cho nó một con rắn.”'
  rationale: Câu hỏi có μή trong tiếng Hy Lạp mong đợi câu trả lời phủ định. Giữ hình thức tu từ này bảo toàn cách lập luận của Chúa Giê-su trong văn cảnh.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Đại từ “nó” tiếp nối người con đã được nhắc đến trong câu trước; “người ấy” chỉ người đang được đặt vào tình huống giả định, tránh thêm trực tiếp từ “cha” vốn không xuất hiện trong câu này.
