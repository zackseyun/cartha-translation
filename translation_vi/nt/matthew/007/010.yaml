revisions:
- from: Hay nếu nó xin cá, lẽ nào người ấy lại cho nó một con rắn?
  to: Hay nếu con mình xin cá, lẽ nào người ấy lại cho nó một con rắn?
  rationale: Sửa duy nhất đại từ chủ ngữ thành “con mình” để khôi phục tiền ngữ trực tiếp từ câu trước và tạo câu tiếng Việt tự nhiên, rõ nghĩa hơn. Câu hỏi tu từ phủ định, các danh từ và quan hệ trao cho vẫn được giữ nguyên.
