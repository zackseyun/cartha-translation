review_pass:
  verdict: revise
  source_fidelity: Bản dịch giữ đúng cấu trúc ví dụ thứ hai, đối tượng “cá,” đối lập với “rắn,” và lực phủ định được chờ đợi của câu hỏi dùng μή. Tuy nhiên, đại từ “nó” ở vị trí chủ ngữ không tự nhiên khi câu được đọc độc lập và làm mờ tiền đề “con của người ấy” từ câu trước. Làm rõ chủ ngữ bằng cách phục hồi tiền đề ngữ cảnh là an toàn và không thêm ý nghĩa mới.
  naturalness: “Hay nếu nó xin cá” có thể bị hiểu là quy chiếu một vật/con vật, hoặc thiếu tiền ngữ rõ ràng khi trích riêng câu. “Hay nếu con mình xin cá” tự nhiên hơn trong tiếng Việt hiện đại; “nó” ở vị trí tân ngữ sau đó vẫn liên kết tự nhiên với người con.
  terminology: “Cá,” “con rắn,” “cho,” và cấu trúc “lẽ nào ... ?” đều phù hợp. “Rắn” là cách dịch hiện đại, trung tính của ὄφις; không cần chú thích biến thể “rắn/loài rắn.”
  issues:
  - severity: medium
    issue: Đại từ “nó” làm chủ ngữ thiếu tiền ngữ rõ ràng và có sắc thái không phù hợp khi chỉ người con.
    rationale: Ὁ υἱὸς αὐτοῦ (“con của người ấy”) đã được nêu trong tiền đề gần ở Ma-thi-ơ 7:9 và được hiểu lược trong ví dụ ở câu 10. Phục hồi “con mình” làm rõ quan hệ tham chiếu trong tiếng Việt mà vẫn giữ nguyên ý và tính khái quát của câu.
  revised_text: Hay nếu con mình xin cá, lẽ nào người ấy lại cho nó một con rắn?
