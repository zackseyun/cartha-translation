id: MAT.7.17
reference: Matthew 7:17
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οὕτως πᾶν δένδρον ἀγαθὸν καρποὺς καλοὺς ποιεῖ, τὸ δὲ σαπρὸν δένδρον καρποὺς πονηροὺς ποιεῖ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/017.yaml
  text: So[a], every good tree produces good fruit[c][b], but the rotten tree produces bad fruit.
translation:
  language: vi
  text: Vậy[a], mọi cây tốt đều sinh trái tốt, còn cây mục nát[b] thì sinh trái xấu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Như thế” hoặc “Cũng vậy.”'
    reason: lexical_alternative
  - marker: b
    text: Từ Hy Lạp ở đây cũng có thể mang nghĩa “hư thối”, “xấu”, “suy đồi” hoặc “không còn dùng được”.
    reason: lexical_alternative
  - marker: c
    text: “Trái xấu” cũng có thể dịch là “trái ác”; cách dịch “xấu” hợp tự nhiên với hình ảnh cây trái, đồng thời vẫn giữ hàm ý đạo đức trong văn cảnh.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως
  choice: Vậy
  rationale: Diễn đạt tự nhiên sức suy luận và liên hệ so sánh với hình ảnh ở câu trước; cũng có thể hiểu là “như thế”.
- source_word: πᾶν δένδρον
  choice: mọi cây
  rationale: πᾶν đi với danh từ số ít mang nghĩa phân phối; “mọi cây” giữ được tính khái quát của lời châm ngôn.
- source_word: ἀγαθὸν
  choice: tốt
  rationale: Giữ nghĩa phẩm chất tích cực rộng của cây, không thu hẹp thành chỉ “khỏe mạnh” hay giải thích trực tiếp theo nghĩa đạo đức.
- source_word: καρποὺς καλοὺς
  choice: trái tốt
  rationale: καλός có thể là tốt, đẹp hoặc tốt đẹp; trong hình ảnh cây trái, “trái tốt” là cách nói tự nhiên và phù hợp với việc đánh giá kết quả.
- source_word: ποιεῖ
  choice: sinh
  rationale: Dù ποιέω theo nghĩa cơ bản là “làm/tạo ra”, với cây và trái, tiếng Việt tự nhiên dùng “sinh trái”; cách dịch này giữ rõ quan hệ cây tạo ra trái.
- source_word: τὸ δὲ
  choice: còn ... thì
  rationale: Thể hiện rõ nét tương phản do δέ đánh dấu giữa hai loại cây mà vẫn tự nhiên trong tiếng Việt.
- source_word: σαπρὸν
  choice: hư
  rationale: σαπρός chỉ tình trạng hư hỏng, mục nát hoặc không còn tốt. “Cây hư” khá gọn, giữ sắc thái mạnh hơn “cây xấu” mà không khiến câu quá nặng nề.
- source_word: καρποὺς πονηροὺς
  choice: trái xấu
  rationale: πονηρός có thể mang nghĩa xấu, ác hoặc có hại. “Trái xấu” tự nhiên trong ẩn dụ nông nghiệp và vẫn để văn cảnh chuyển tải hàm ý đạo đức.
theological_decisions:
- issue: Sức nặng đạo đức so với nghĩa nông nghiệp của hình ảnh
  choice: Giữ nguyên hình ảnh cụ thể về cây và trái, không đưa lời giải thích đạo đức vào chính câu dịch.
  alternative: Dịch diễn giải như “cây ngay lành sinh việc lành” hoặc dùng “trái ác” để nói rõ ứng dụng đạo đức.
  rationale: Trong văn cảnh, lời này liên quan đến việc nhận biết các tiên tri giả qua kết quả của họ, nhưng bản Hy Lạp vẫn trình bày bằng hình ảnh cây và trái. Bản dịch vì thế giữ nguyên sự căng giữa nghĩa cụ thể và hàm ý đạo đức, để văn cảnh làm sáng tỏ ứng dụng.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Cấu trúc “mọi ... đều ... còn ... thì ...” làm rõ tính khái quát và thế đối lập của câu. Dùng “trái” theo cách nói phổ thông trong tiếng Việt hiện đại.
