id: MAT.7.9
reference: Matthew 7:9
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἢ τίς ⸀ἐστιν ἐξ ὑμῶν ἄνθρωπος, ὃν ⸀αἰτήσει ὁ υἱὸς αὐτοῦ ἄρτον— μὴ λίθον ἐπιδώσει αὐτῷ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/009.yaml
  text: Or what man is there among you whose son asks him for bread[a], and he will give him a stone?
translation:
  language: vi
  text: Hay ai trong anh em, khi con trai mình xin bánh, lại trao cho nó một hòn đá?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἢ
  choice: Hay
  rationale: Nối câu hỏi tu từ này với lời dạy ngay trước đó một cách tự nhiên, tương ứng với chức năng chuyển tiếp của ἢ.
- source_word: τίς ἐστιν ἐξ ὑμῶν ἄνθρωπος
  choice: ai trong anh em
  rationale: Diễn đạt tự nhiên trong tiếng Việt cho cấu trúc chỉ một người thuộc nhóm người nghe. ἄνθρωπος mang nghĩa đại diện và không cần dịch cứng thành “người đàn ông” trong thành ngữ tiếng Việt này.
- source_word: ὃν αἰτήσει ὁ υἱὸς αὐτοῦ ἄρτον
  choice: khi con trai mình xin bánh
  rationale: Tái cấu trúc mệnh đề quan hệ theo cú pháp tiếng Việt nhưng giữ rõ υἱός là “con trai” và ἄρτος là “bánh.” Dạng tương lai αἰτήσει nằm trong tình huống giả định khái quát nên tiếng Việt tự nhiên không cần đánh dấu thời tương lai.
- source_word: μὴ λίθον ἐπιδώσει αὐτῷ
  choice: lại trao cho nó một hòn đá?
  rationale: μή cho biết câu hỏi tu từ mong đợi câu trả lời phủ định; từ “lại” cùng hình thức nghi vấn truyền đạt sắc thái phi lý ấy tự nhiên trong tiếng Việt. “Trao” thể hiện hành động đưa vật cho người nhận.
theological_decisions:
- issue: Ngôn ngữ giống đực mang tính đại diện
  choice: ai trong anh em
  alternative: người đàn ông nào trong anh em
  rationale: Cụm Hy Lạp dùng ἄνθρωπος ở số ít theo nghĩa đại diện. Trong tiếng Việt, “ai trong anh em” vừa tự nhiên vừa giữ việc Chúa Giê-su trực tiếp hỏi những người nghe, còn “người đàn ông nào” tạo sắc thái nhấn mạnh giới tính không cần thiết. Tuy vậy, “con trai” được giữ vì υἱός chỉ rõ người con là nam.
- issue: Lực của câu hỏi tu từ với μή
  choice: lại trao cho nó một hòn đá?
  alternative: chẳng lẽ lại trao cho nó một hòn đá sao?
  rationale: Bản dịch giữ câu hỏi mong đợi câu trả lời phủ định mà không biến nó thành một lời khẳng định. Cách dùng “lại” đủ gợi sự tương phản phi lý giữa bánh và đá, đồng thời tránh thêm mức nhấn mạnh không có trong nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Đại từ “anh em” phù hợp với lời trực tiếp gửi đến một nhóm người nghe; “nó” là đại từ tự nhiên chỉ người con trong quan hệ gia đình, không mang ý khinh miệt trong ngữ cảnh này.
