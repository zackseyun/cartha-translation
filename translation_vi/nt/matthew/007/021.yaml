  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Οὐ πᾶς ὁ λέγων μοι· Κύριε κύριε εἰσελεύσεται εἰς τὴν βασιλείαν τῶν οὐρανῶν, ἀλλ’ ὁ ποιῶν τὸ θέλημα τοῦ πατρός μου τοῦ ἐν ⸀τοῖς οὐρανοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/021.yaml
  text: Not everyone who says to me[a], ‘Lord, Lord,’ will enter into the kingdom of heaven[b], but the one who does the will of my Father who is in heaven will enter.
translation:
  language: vi
  text: 'Không phải ai nói với tôi: “Lạy Chúa, lạy Chúa,” cũng sẽ vào Nước Trời[a], nhưng người làm theo ý muốn của Cha tôi, Đấng ở trên trời[b], sẽ vào.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “vương quốc của các trời.” Ma-thi-ơ thường dùng cách nói này ở những chỗ mà các văn cảnh khác dùng “vương quốc của Đức Chúa Trời.”'
    reason: lexical_alternative
  - marker: b
    text: Từ Hy Lạp ở đây có dạng số nhiều, nghĩa đen là “các trời”; tiếng Việt diễn đạt tự nhiên là “trên trời.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐ πᾶς ὁ λέγων μοι
  choice: Không phải ai nói với tôi ... cũng
  rationale: 'Diễn đạt phép phủ định bộ phận: không phải mọi người nói như vậy đều được vào, chứ không có nghĩa là không một ai được vào. Mệnh đề quan hệ tự nhiên trong tiếng Việt chuyển tải phân từ hiện tại λέγων.'
- source_word: Κύριε κύριε
  choice: Lạy Chúa, lạy Chúa
  rationale: Giữ danh xưng κύριος là “Chúa,” giữ nguyên sự lặp lại mang tính nhấn mạnh; “lạy” thể hiện cách xưng hô trực tiếp, trang trọng và tự nhiên trong tiếng Việt.
- source_word: εἰσελεύσεται
  choice: sẽ vào / mới được vào
  rationale: “Sẽ vào” chuyển tải trực tiếp thì tương lai. Ở vế đối lập, “mới được vào” là cách nói tiếng Việt tự nhiên, làm rõ động từ được hiểu ngầm từ vế trước mà không thay đổi điều kiện đối lập của câu.
- source_word: εἰς τὴν βασιλείαν τῶν οὐρανῶν
  choice: vào Nước Trời
  rationale: “Nước Trời” là cách diễn đạt tiếng Việt tự nhiên và quen thuộc cho βασιλεία τῶν οὐρανῶν, trong khi chú thích bảo lưu hình thức số nhiều “các tầng trời” của nguyên văn.
- source_word: ἀλλ’ ὁ ποιῶν
  choice: nhưng chỉ người làm theo
  rationale: Diễn đạt phân từ hiện tại có mạo từ như một danh ngữ chỉ người. “Chỉ ... mới” làm rõ sự tương phản độc quyền do ἀλλά tạo nên trong cấu trúc tiếng Việt.
- source_word: τὸ θέλημα
  choice: ý muốn
  rationale: “Ý muốn” bảo lưu nghĩa về điều Đức Chúa Cha muốn và chủ định, không thu hẹp thành cảm xúc hay chỉ thành một mệnh lệnh riêng lẻ.
- source_word: τοῦ πατρός μου
  choice: của Cha tôi
  rationale: Dịch trực tiếp sở hữu cách và giữ nguyên ngôn ngữ phụ tử riêng biệt của Đức Giê-su.
- source_word: τοῦ ἐν τοῖς οὐρανοῖς
  choice: Đấng ngự trên trời
  rationale: Cụm đồng vị trang trọng và tự nhiên xác định Cha là Đấng ở trên trời. “Ngự” phù hợp với văn phong Kinh Thánh trang nghiêm mà vẫn dễ hiểu.
theological_decisions:
- issue: Mối liên hệ giữa việc xưng nhận bằng lời và làm theo ý muốn của Cha trong việc vào Nước Trời
  choice: Giữ nguyên sự tương phản giữa việc chỉ gọi Đức Giê-su là Chúa và việc thực sự làm theo ý muốn của Cha.
  alternative: Diễn giải câu này như một tuyên bố đầy đủ về sự cứu rỗi bởi công đức, hoặc như phủ nhận mọi giá trị của lời xưng nhận.
  rationale: Nguyên văn trực tiếp đối chiếu “nói” với “làm” nhưng không trình bày toàn bộ một hệ thống giáo lý cứu rỗi trong riêng câu này; bản dịch vì thế giữ nguyên lời cảnh báo và sức căng thần học mà không giải quyết theo một lập trường hệ phái.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ cách xưng hô nhấn mạnh “Lạy Chúa, lạy Chúa,” dùng “Nước Trời” theo lối nói tự nhiên trong tiếng Việt, đồng thời chú thích dạng số nhiều của nguyên văn. Cấu trúc “không phải ai ... cũng ... nhưng chỉ ... mới ...” bảo toàn phép phủ định bộ phận và sự tương phản mạnh của câu.
