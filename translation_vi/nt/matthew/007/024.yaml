revisions:
- from: Vậy, bất cứ ai nghe những lời này của tôi và làm theo thì sẽ giống như một người khôn ngoan xây nhà mình trên đá.[a]
  to: Vậy, bất cứ ai nghe những lời này của tôi và làm theo thì sẽ giống như một người đàn ông khôn ngoan đã xây nhà mình trên tảng đá.[a]
  rationale: Bản sửa bổ sung “đã” để phản ánh động từ aorist ᾠκοδόμησεν, dịch trực tiếp ἀνήρ là “người đàn ông”, và giữ cách diễn đạt tự nhiên cho mối so sánh tương lai. Chú thích được rút gọn để chỉ nêu phương án dịch thay thế hữu ích cho ὁμοιωθήσεται, vì nét nghĩa nam đã được thể hiện trong thân văn.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T02:46:59Z'
review_pass:
  verdict: revise
  source_fidelity: Bản nháp truyền đạt đúng mạch suy luận, việc nghe và thực hành lời nói, cùng hình ảnh xây nhà trên đá. Tuy nhiên, ᾠκοδόμησεν là động từ aorist, thuật lại việc người khôn ngoan đã xây nhà; cụm “một người khôn ngoan xây nhà mình” dễ được hiểu là hành động đang diễn ra hoặc có tính khái quát. Ngoài ra, ἀνήρ chỉ rõ một người đàn ông trong phép so sánh, nên có thể chuyển trực tiếp mà vẫn tự nhiên.
  naturalness: Câu sửa vẫn dùng văn phong Việt hiện đại, rõ và trang trọng vừa phải. “Đã xây” làm sáng rõ trình tự của hình ảnh, còn “trên tảng đá” diễn đạt tự nhiên hình ảnh τὴν πέτραν như một khối/nền đá vững chắc.
  terminology: “Làm theo” là cách dịch tự nhiên và đúng ngữ cảnh cho ποιεῖ αὐτούς. “Người đàn ông khôn ngoan” phản ánh ἀνδρὶ φρονίμῳ mà không biến đây thành tuyên bố giới tính về người nghe nói chung. Chú thích chỉ giữ lựa chọn từ vựng thích hợp cho thể bị động của ὁμοιωθήσεται.
  issues:
  - severity: medium
    issue: “xây nhà mình” không biểu lộ rõ hành động quá khứ của ᾠκοδόμησεν.
    rationale: Aorist trong mệnh đề quan hệ mô tả người đàn ông là người đã xây nhà; thêm “đã” bảo toàn thời diện của hình ảnh.
  - severity: low
    issue: “một người khôn ngoan” làm mờ nét nghĩa nam của ἀνήρ trong khi tiếng Việt có thể dịch trực tiếp mà vẫn tự nhiên.
    rationale: “Một người đàn ông khôn ngoan” phản ánh chính xác danh từ chỉ nam giới trong phép so sánh; điều này không hạn chế phạm vi bao quát của “bất cứ ai” ở đầu câu.
