id: MAT.7.24
reference: Matthew 7:24
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Πᾶς οὖν ὅστις ἀκούει μου τοὺς λόγους τούτους καὶ ποιεῖ αὐτούς, ⸀ὁμοιωθήσεται ἀνδρὶ φρονίμῳ, ὅστις ᾠκοδόμησεν ⸂αὐτοῦ τὴν οἰκίαν⸃ ἐπὶ τὴν πέτραν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/024.yaml
  text: Therefore everyone who hears these words of mine and does them will be like a wise man who built his house on the rock[a][b].
translation:
  language: vi
  text: Vậy, bất cứ ai nghe những lời này của tôi và làm theo thì sẽ giống như một người đàn ông khôn ngoan đã xây nhà mình trên tảng đá.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “sẽ được ví như” hoặc “sẽ được so sánh với”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πᾶς οὖν ὅστις
  choice: Vậy, bất cứ ai
  rationale: 'Cụm Πᾶς...ὅστις mang ý phân phối, khái quát: bất cứ người nào thuộc nhóm được mô tả. οὖν nối câu này như kết luận rút ra từ lời dạy trước đó; “Vậy” tự nhiên trong tiếng Việt.'
- source_word: ἀκούει μου τοὺς λόγους τούτους
  choice: nghe những lời này của tôi
  rationale: Giữ nghĩa trực tiếp của ἀκούει, λόγους và sở hữu cách μου, đồng thời diễn đạt tự nhiên bằng tiếng Việt hiện đại.
- source_word: καὶ ποιεῖ αὐτούς
  choice: và làm theo
  rationale: Trong ngữ cảnh lời dạy, ποιεῖ αὐτούς chỉ việc thực hành những lời đã nghe. “Làm theo” tự nhiên và rõ hơn cách dịch máy móc “làm chúng”.
- source_word: ὁμοιωθήσεται
  choice: sẽ giống như
  rationale: Diễn đạt tự nhiên thể bị động tương lai của động từ chỉ sự so sánh, không áp đặt ai là tác nhân thực hiện việc ví sánh.
- source_word: ἀνδρὶ φρονίμῳ
  choice: một người khôn ngoan
  rationale: ἀνήρ ở đây là một người đàn ông trong hình ảnh minh họa; tiếng Việt “một người khôn ngoan” tự nhiên, không mâu thuẫn với ngữ cảnh nam tính được biểu thị tiếp theo bằng “nhà mình”, nhưng không cần nhấn giới tính vốn dễ gây nặng câu.
- source_word: ᾠκοδόμησεν αὐτοῦ τὴν οἰκίαν
  choice: xây nhà mình
  rationale: “Xây nhà mình” là cách diễn đạt gọn và tự nhiên, bảo toàn hành động xây dựng cùng quan hệ sở hữu.
- source_word: ἐπὶ τὴν πέτραν
  choice: trên đá
  rationale: πέτρα chỉ nền đá hoặc khối đá vững chắc. “Trên đá” giữ nguyên hình ảnh mà không diễn giải quá mức thành một thuật ngữ kỹ thuật như “đá nền”.
theological_decisions:
- issue: Ngôn ngữ chỉ giới trong nhân vật được dùng để so sánh
  choice: một người khôn ngoan
  alternative: một người đàn ông khôn ngoan
  rationale: Bản Hy Lạp dùng ἀνήρ, có dạng nam tính và có thể dịch rõ là “người đàn ông”. Tuy nhiên, tiếng Việt thường dùng “người” cho một nhân vật nam khi ngữ cảnh đã đủ rõ, và trọng tâm so sánh nằm ở sự khôn ngoan cùng hành động xây nhà. Chú thích ghi nhận sắc thái nam tính của nguyên văn để không làm mất dữ kiện nguồn.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Vậy” giữ liên kết suy luận; “làm theo” truyền đạt tự nhiên yêu cầu thực hành lời đã nghe. Dấu chú thích [a] xuất hiện ngay sau toàn bộ hình ảnh so sánh mà chú thích giải thích.
