id: MAT.7.12
reference: Matthew 7:12
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Πάντα οὖν ὅσα ⸀ἐὰν θέλητε ἵνα ποιῶσιν ὑμῖν οἱ ἄνθρωποι, οὕτως καὶ ὑμεῖς ποιεῖτε αὐτοῖς· οὗτος γάρ ἐστιν ὁ νόμος καὶ οἱ προφῆται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/012.yaml
  text: Therefore[a], in everything, whatever you want people to do for you, do the same for them; for this is the Law and the Prophets.
translation:
  language: vi
  text: Vậy, mọi điều anh em muốn người ta[a] làm cho anh em, anh em cũng hãy làm cho họ như vậy; vì đó là Luật pháp và các Tiên tri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hy Lạp: “những con người”; ở đây từ này chỉ con người nói chung, không riêng nam giới.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πάντα οὖν
  choice: Vậy, trong mọi việc
  rationale: “Vậy” thể hiện quan hệ suy luận của οὖν với lời dạy trước đó; “trong mọi việc” truyền đạt phạm vi bao quát của Πάντα khi kết hợp với ὅσα.
- source_word: ὅσα ἐὰν θέλητε
  choice: bất cứ điều gì anh em muốn
  rationale: Cụm “bất cứ điều gì” diễn đạt tự nhiên tính bất định và khái quát của kết cấu ὅσα ἐὰν; “anh em” giữ ngôi thứ hai số nhiều của θέλητε.
- source_word: ἵνα ποιῶσιν ὑμῖν οἱ ἄνθρωποι
  choice: người ta làm cho mình
  rationale: “Người ta” chỉ con người nói chung, không giới hạn ở nam giới. “Làm cho mình” là cách nói tự nhiên trong tiếng Việt và giữ quan hệ hướng đến người nhận hành động.
- source_word: οὕτως καὶ ὑμεῖς ποιεῖτε αὐτοῖς
  choice: anh em cũng hãy làm như vậy cho họ
  rationale: “Cũng… như vậy” giữ lực đối ứng của οὕτως καί; “hãy làm” thể hiện mệnh lệnh hiện tại, kêu gọi cách hành xử thường xuyên.
- source_word: οὗτος γάρ ἐστιν
  choice: vì đó là
  rationale: Giữ nguyên cấu trúc giải thích ngắn gọn và trực tiếp của γάρ cùng mệnh đề đồng nhất.
- source_word: ὁ νόμος καὶ οἱ προφῆται
  choice: Luật pháp và các Tiên tri
  rationale: Giữ công thức Do Thái quen thuộc chỉ hai phần tiêu biểu của Kinh Thánh, thay vì diễn giải thành một kết luận thần học hẹp hơn.
theological_decisions:
- issue: Nghĩa khái quát của οἱ ἄνθρωποι
  choice: người ta
  alternative: những người đàn ông; người khác
  rationale: Trong ngữ cảnh này, danh từ giống đực số nhiều chỉ loài người nói chung chứ không riêng nam giới. “Người ta” giữ được tính phổ quát và tự nhiên trong tiếng Việt.
- issue: Phạm vi của “Luật pháp và các Tiên tri”
  choice: Giữ nguyên như một công thức tóm lược Kinh Thánh
  alternative: toàn bộ giáo huấn đạo đức của Kinh Thánh; tinh túy của Luật pháp và lời các tiên tri
  rationale: Bản Hy Lạp dùng công thức quen thuộc trong Do Thái giáo và sách Ma-thi-ơ. Giữ nguyên cụm từ bảo toàn liên hệ liên văn bản và tránh diễn giải quá mức.
- issue: Đại từ ngôi thứ hai số nhiều ὑμεῖς
  choice: anh em
  alternative: các con; các bạn
  rationale: “Anh em” là cách xưng hô số nhiều trang trọng, quen thuộc trong văn phong Kinh Thánh tiếng Việt và không áp đặt quan hệ cha-con vốn không được biểu thị trực tiếp bằng đại từ Hy Lạp.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cấu trúc song hành “muốn… làm cho mình / cũng hãy làm… cho họ” giữ rõ tính đối ứng của câu Hy Lạp. Dấu chấm phẩy bảo toàn sự gắn kết giữa mệnh lệnh và lời giải thích theo sau.
