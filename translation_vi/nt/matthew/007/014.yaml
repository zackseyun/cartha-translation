revisions:
- from: Vì[a] cửa thì hẹp, con đường dẫn đến sự sống thì chật, và chỉ ít người tìm được con đường ấy.
  to: Vì[a] cửa thì hẹp, và con đường dẫn đến sự sống thì chật hẹp, và ít người tìm được con đường ấy.
  rationale: Chỉnh nhẹ để cách nói tiếng Việt tự nhiên hơn và chuẩn hóa ghi chú dị bản. Bản văn vẫn bảo toàn tính nhân quả của ὅτι, ẩn dụ không gian của στενή và τεθλιμμένη, và không thêm diễn giải thần học cho ζωή.
  reviewer_model: gpt-5.6-terra
