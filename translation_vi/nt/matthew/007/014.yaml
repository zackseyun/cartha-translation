id: MAT.7.14
reference: Matthew 7:14
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸀ὅτι στενὴ ἡ πύλη καὶ τεθλιμμένη ἡ ὁδὸς ἡ ἀπάγουσα εἰς τὴν ζωήν, καὶ ὀλίγοι εἰσὶν οἱ εὑρίσκοντες αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/014.yaml
  text: For the gate is narrow and the way that leads to life is hard, and few are those who find it.
translation:
  language: vi
  text: Vì[a] cửa thì hẹp, và con đường dẫn đến sự sống thì chật hẹp, và ít người tìm được con đường ấy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Một số bản chép cổ đọc: “Cửa hẹp biết bao…”'
    reason: Dấu biến thể văn bản trong SBLGNT trước ὅτι cho biết có dị bản τί; ghi chú phản ánh cách đọc cảm thán này mà không thay đổi bản văn chính.
lexical_decisions:
- source_word: στενή
  choice: hẹp
  rationale: Giữ hình ảnh không gian trực tiếp của chiếc cửa có bề ngang hẹp.
- source_word: τεθλιμμένη
  choice: chật
  rationale: Dạng phân từ bị động của θλίβω gợi một con đường bị ép hẹp, khó đi. “Chật” giữ hình ảnh cụ thể và để ngỏ hàm ý gian khó, thay vì chỉ diễn giải là “khó khăn”.
- source_word: ζωήν
  choice: sự sống
  rationale: Cách dịch tự nhiên, trang trọng, đồng thời không thu hẹp ý nghĩa thần học của ζωή vào riêng đời sống hiện tại hay đời sau.
- source_word: εὑρίσκοντες αὐτήν
  choice: tìm được con đường ấy
  rationale: Đại từ giống cái αὐτήν quy chiếu trực tiếp về ἡ ὁδός, nên lặp lại “con đường ấy” để tiếng Việt rõ nghĩa.
theological_decisions:
- issue: Ý nghĩa của “sự sống”
  choice: Giữ nguyên “sự sống” mà không thêm “đời đời”.
  alternative: “sự sống đời đời”
  rationale: Nguyên văn chỉ có ζωήν; thêm “đời đời” sẽ giải nghĩa thần học vượt quá câu chữ của câu này.
- issue: Sắc thái của τεθλιμμένη
  choice: Dịch bằng hình ảnh “chật”.
  alternative: “khó khăn” hoặc “gian nan”
  rationale: “Chật” bảo toàn ẩn dụ không gian của con đường bị ép hẹp, trong khi hàm ý gian khó vẫn hiện diện mà không bị diễn giải quá mức.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cấu trúc đối xứng “cửa thì hẹp, con đường… thì chật” giữ nhịp câu Hy Lạp; “chỉ ít người” thể hiện rõ ὀλίγοι mà không thêm sắc thái hệ phái.
