  text: πᾶν δένδρον μὴ ποιοῦν καρπὸν καλὸν ἐκκόπτεται καὶ εἰς πῦρ βάλλεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/019.yaml
  text: Every tree not producing good fruit is cut down and thrown into the fire[a][b].
translation:
  language: vi
  text: Cây nào không sinh trái tốt thì bị chặt xuống và ném vào lửa.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “không kết trái tốt.”'
    reason: lexical_alternative
  - marker: b
    text: “Lửa” là hình ảnh về sự phán xét; riêng câu này không nói rõ trọng tâm là sự phán xét trong lịch sử, vào thời cuối cùng, hay cả hai.
    reason: cross_reference
lexical_decisions:
- source_word: πᾶν δένδρον
  choice: Cây nào
  rationale: πᾶν với danh từ số ít mang nghĩa phân phối, chỉ từng cây. “Cây nào” tự nhiên trong tiếng Việt và giữ được sắc thái khái quát của câu châm ngôn.
- source_word: μὴ ποιοῦν
  choice: không sinh
  rationale: Phân từ hiện tại ποιοῦν mô tả đặc tính tiếp diễn của cây. Trong tiếng Việt, “sinh trái” là cách nói tự nhiên, đồng thời phản ánh ý tạo ra hay sản sinh của ποιέω.
- source_word: καρπὸν καλὸν
  choice: trái tốt
  rationale: καλός ở đây chỉ điều tốt, lành hoặc đạt phẩm chất thích hợp. “Trái tốt” ngắn gọn, tự nhiên và giữ sắc thái đánh giá đạo đức trong ngữ cảnh.
- source_word: ἐκκόπτεται
  choice: bị chặt xuống
  rationale: Động từ hiện tại thể bị động nói điều xảy đến với cây ấy. “Bị chặt xuống” diễn đạt rõ việc đốn hạ cả cây.
- source_word: εἰς πῦρ βάλλεται
  choice: ném vào lửa
  rationale: βάλλεται là thể bị động, còn εἰς biểu thị chuyển động vào trong. Tiếng Việt không cần lặp “bị” trước động từ thứ hai vì hai động từ cùng chia sẻ cấu trúc bị động.
theological_decisions:
- issue: Hình ảnh lửa phán xét
  choice: Giữ nguyên hình ảnh cây bị chặt xuống và ném vào lửa, không xác định chính xác lửa ám chỉ điều gì.
  alternative: Sự phán xét trong lịch sử; sự phán xét thời cuối cùng; hoặc địa ngục.
  rationale: Câu này rõ ràng dùng hình ảnh nông nghiệp để cảnh báo về sự phán xét, nhưng tự nó không xác định thời điểm hay phạm vi chính xác. Bản dịch giữ nguyên sức nặng của lời cảnh báo mà không thu hẹp ý nghĩa theo một kết luận giáo lý cụ thể.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “trái” theo tiếng Việt tiêu chuẩn phổ thông; cấu trúc “Cây nào... thì...” truyền đạt tự nhiên sắc thái phân phối của πᾶν với danh từ số ít.
