source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ὅτε ⸀ἐτέλεσεν ὁ Ἰησοῦς τοὺς λόγους τούτους, ἐξεπλήσσοντο οἱ ὄχλοι ἐπὶ τῇ διδαχῇ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/028.yaml
  text: And it happened that when Jesus had finished these words[b][a], the crowds were astonished at his teaching.
translation:
  language: vi
  text: Và rồi, khi Đức Giê-su nói xong những lời này[a], dân chúng sửng sốt trước sự giảng dạy của Ngài.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “những lời dạy này.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ ἐγένετο ὅτε
  choice: Và rồi, khi
  rationale: Đây là công thức tự sự đánh dấu sự chuyển tiếp và tiếp nối. Cách dịch này giữ sắc thái tiếp diễn của καί và ἐγένετο, đồng thời tự nhiên hơn trong tiếng Việt hiện đại so với lối dịch sát từng chữ “Và xảy ra rằng, khi”.
- source_word: ἐτέλεσεν
  choice: nói xong
  rationale: Trong ngữ cảnh một bài giảng vừa kết thúc, “nói xong” diễn đạt tự nhiên hành động đưa lời giảng đến chỗ hoàn tất; từ “xong” giữ rõ ý hoàn thành của động từ Hy Lạp.
- source_word: τοὺς λόγους τούτους
  choice: những lời này
  rationale: Cách dịch này giữ số nhiều và từ chỉ định của nguyên văn, đồng thời không thêm nhãn diễn giải như “bài giảng”.
- source_word: ἐξεπλήσσοντο
  choice: đều sửng sốt
  rationale: “Sửng sốt” giữ được cường độ mạnh của động từ; “đều” diễn đạt phản ứng chung của dân chúng mà không biến động từ thành một khoảnh khắc đơn lẻ.
- source_word: οἱ ὄχλοι
  choice: dân chúng
  rationale: “Dân chúng” là cách gọi tự nhiên, trang trọng vừa phải đối với các đoàn người nghe Đức Giê-su; tránh sắc thái có thể tiêu cực của “các đám đông” trong tiếng Việt.
- source_word: ἐπὶ τῇ διδαχῇ αὐτοῦ
  choice: trước sự giảng dạy của Ngài
  rationale: Giới từ ἐπί với động từ này nêu căn cứ hoặc đối tượng gây sửng sốt. “Trước” diễn đạt tự nhiên phản ứng ấy, còn “sự giảng dạy” giữ nghĩa rộng của διδαχή mà không thu hẹp vào nội dung hay phong cách riêng.
theological_decisions:
- issue: Phạm vi quy chiếu của “những lời này”
  choice: Chỉ lời giảng Đức Giê-su vừa hoàn tất, không thêm tên gọi cho diễn từ
  alternative: bài giảng này; những lời phán này
  rationale: Nguyên văn nhắc đến “những lời này” chứ không dùng một nhãn thần học hoặc văn chương như “Bài giảng trên núi”; bản dịch vì thế giữ cách quy chiếu trực tiếp và không giải nghĩa quá mức.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. “Đức Giê-su” và đại từ “Ngài” duy trì sắc thái tôn kính quen thuộc; câu vẫn giữ dấu vết của công thức chuyển tiếp Hy Lạp qua “Và rồi, khi” mà không dùng cấu trúc gượng ép.
