  source_fidelity: 'Bản dịch chuyển tải đúng các thành tố chính: Đức Giê-su hoàn tất lời nói, dân chúng phản ứng sửng sốt, và phản ứng ấy liên hệ với sự giảng dạy của Ngài. “Và rồi, khi” là cách Việt hóa chấp nhận được cho công thức tự sự Καὶ ἐγένετο ὅτε. Tuy nhiên, “đều” thêm một lượng từ phổ quát không được nêu rõ trong nguyên văn; số nhiều “dân chúng/các đám đông” không tự nó khẳng định từng người đều có phản ứng ấy.'
