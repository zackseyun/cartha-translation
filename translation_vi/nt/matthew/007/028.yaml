  terminology: “Đức Giê-su” và “Ngài” nhất quán với lối xưng hô tôn kính thông dụng. “Sự giảng dạy” phản ánh tốt διδαχή và không áp đặt nhãn diễn giải như “Bài giảng trên núi.” Chú thích nên dùng “những lời dạy này” như một phương án gần với “these sayings,” tránh “phán,” vốn nâng sắc thái xưng hô hơn mức cần thiết cho một lựa chọn từ vựng.
