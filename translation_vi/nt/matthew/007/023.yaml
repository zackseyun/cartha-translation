id: MAT.7.23
reference: Matthew 7:23
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ τότε ὁμολογήσω αὐτοῖς ὅτι Οὐδέποτε ἔγνων ὑμᾶς· ἀποχωρεῖτε ἀπ’ ἐμοῦ οἱ ἐργαζόμενοι τὴν ἀνομίαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/023.yaml
  text: And then I will declare to them[a], ‘I never knew you; depart from me[b], you who practice lawlessness.’
translation:
  language: vi
  text: 'Vào lúc ấy, Ta sẽ tuyên bố với họ[a]: ‘Ta chưa từng biết các ngươi[b]. Hãy rời khỏi Ta, hỡi những kẻ làm điều trái luật pháp[c]!’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “công khai nói với họ.”'
    reason: lexical_alternative
  - marker: b
    text: “Biết” ở đây có thể hàm ý sự nhìn nhận trong một mối quan hệ, chứ không chỉ là biết về mặt trí óc.
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể dịch: “những kẻ làm điều gian ác” hoặc “những kẻ làm sự bất chính.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ τότε
  choice: Rồi lúc ấy
  rationale: Giữ quan hệ tiếp nối và trình tự thời gian với phần trước, đồng thời diễn đạt tự nhiên trong tiếng Việt hiện đại.
- source_word: ὁμολογήσω
  choice: tôi sẽ tuyên bố
  rationale: Trong bối cảnh phán xét, động từ mang nghĩa công khai và dứt khoát tuyên bố, không phải thú nhận lỗi lầm.
- source_word: Οὐδέποτε
  choice: chưa từng
  rationale: Diễn đạt sự phủ định tuyệt đối trong quan hệ được nói đến, tự nhiên hơn lối dịch sát chữ ‘không bao giờ’ trong câu này.
- source_word: ἔγνων
  choice: biết
  rationale: Giữ nguyên cách nói giàu ý nghĩa quan hệ của γινώσκω, thay vì giải thích thành ‘công nhận’ hay ‘chấp nhận’ ngay trong chính văn.
- source_word: ἀποχωρεῖτε
  choice: Hãy lui khỏi ta
  rationale: Thể hiện mệnh lệnh xua đi với sắc thái trang nghiêm; ‘lui khỏi’ tự nhiên và mạnh hơn ‘rời khỏi’ trong lời phán trực tiếp.
- source_word: οἱ ἐργαζόμενοι
  choice: những kẻ làm
  rationale: Diễn đạt hành vi đặc trưng của nhóm người được gọi, không nhất thiết bổ sung ý ‘thường xuyên’ vốn không được nói rõ bằng một trạng từ.
- source_word: τὴν ἀνομίαν
  choice: điều vô luật pháp
  rationale: Giữ sắc thái chống nghịch luật lệ hay trật tự của ἀνομία, thay vì làm rộng nghĩa thành ‘điều ác’ hoặc dùng từ Hán-Việt khó hiểu như ‘bất pháp’.
theological_decisions:
- issue: Ý nghĩa của ‘Ta chưa từng biết các ngươi’
  choice: Giữ động từ ‘biết’ theo cách nói mang tính quan hệ.
  alternative: Ta chưa từng công nhận các ngươi / Ta chưa từng chấp nhận các ngươi.
  rationale: Nguyên văn không chỉ nói đến nhận thức trí tuệ, nhưng cũng không trực tiếp giải nghĩa mối quan hệ ấy là ‘công nhận’, ‘chấp nhận’ hay một kết luận giáo lý cụ thể. Bản dịch giữ nguyên sức căng này.
- issue: Sắc thái của ἀνομία
  choice: điều vô luật pháp
  alternative: điều gian ác / sự bất chính
  rationale: Lựa chọn này bảo tồn khía cạnh coi thường luật lệ hoặc trật tự đúng đắn mà không thu hẹp thành một hệ thống giáo lý riêng.
- issue: Sự chuyển đổi đại từ trong lời dẫn và lời trích
  choice: ‘tôi… họ’ trong lời kể; ‘Ta… các ngươi’ trong lời tuyên phán.
  alternative: Dùng thống nhất ‘tôi… các anh’ hoặc ‘Ta… các ngươi’ ở cả hai phần.
  rationale: Sự chuyển đổi giúp tiếng Việt phân biệt giọng kể của Chúa Giê-su với lời phán trực tiếp trang nghiêm, mà không thay đổi đối tượng hay nội dung thần học.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và dễ hiểu. Chính văn dùng ‘tôi’ trong lời kể nhưng ‘Ta/các ngươi’ trong lời phán trực tiếp để truyền đạt sắc thái xét xử long trọng. Các dấu chú thích [a], [b] đều xuất hiện trong chính văn; [a] đặt sau mệnh đề tuyên bố, [b] đặt cuối câu để chú giải cả ‘biết’ và ‘điều vô luật pháp’.
