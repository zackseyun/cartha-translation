revisions:
- from: 'Rồi lúc ấy, tôi sẽ tuyên bố với họ[a]: ‘Ta chưa từng biết các ngươi. Hãy lui khỏi ta, hỡi những kẻ làm điều vô luật pháp!’[b]'
  to: 'Vào lúc ấy, Ta sẽ tuyên bố với họ[a]: ‘Ta chưa từng biết các ngươi[b]. Hãy rời khỏi Ta, hỡi những kẻ làm điều trái luật pháp[c]!’'
  rationale: Bản sửa giữ nguyên các yếu tố ngữ nghĩa của SBLGNT và không áp đặt cách giải thích giáo lý cho «Ta chưa từng biết các ngươi». Các điều chỉnh nhằm cải thiện tính tự nhiên của tiếng Việt, tính nhất quán của đại từ trong một lời nói trực tiếp, và độ chính xác của các neo chú thích. «Trái luật pháp» vẫn giữ được lực nghĩa của ἀνομία tốt hơn cách dịch tổng quát «gian ác», vốn chỉ được nêu như phương án chú thích.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T02:44:05Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản thảo truyền đạt đúng cấu trúc và ý chính của câu: trình tự thời gian, lời tuyên bố công khai, sự phủ định tuyệt đối, động từ «biết» mang sắc thái quan hệ, mệnh lệnh đuổi đi, và ἀνομία. Tuy nhiên, «lui khỏi ta» không phải cách tương đương tự nhiên nhất cho ἀποχωρεῖτε trong tiếng Việt hiện đại; «rời khỏi Ta» sát nghĩa mệnh lệnh đuổi đi hơn. «Làm điều vô luật pháp» có thể hiểu được nhưng không tự nhiên; «làm điều trái luật pháp» diễn đạt rõ hơn sắc thái ἀνομία mà không diễn giải thêm luật pháp ấy là luật nào.'
  naturalness: Nên dùng nhất quán «Ta» trong toàn bộ lời nói trực tiếp. Việc mở đầu bằng «tôi sẽ tuyên bố» rồi chuyển sang «Ta» trong cùng một lời nói tạo chuyển đổi ngôi xưng không cần thiết. «Vào lúc ấy» tự nhiên và trang trọng hơn «Rồi lúc ấy» trong văn cảnh phán xét.
  terminology: Giữ «biết» trong chính văn để không thay thế sắc thái quan hệ/phán xét của ἔγνων bằng một diễn giải như «công nhận». Dùng «trái luật pháp» để bảo toàn bình diện đạo đức-pháp lý của ἀνομία, thay vì khái quát hóa thành «gian ác». Các chú thích được tách theo đúng các từ/cụm từ được chú giải và đặt tại vị trí thích hợp.
  issues:
