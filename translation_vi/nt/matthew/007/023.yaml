    issue: 'Đại từ trong lời nói trực tiếp không nhất quán: «tôi sẽ» rồi «Ta».'
    rationale: Cả mệnh đề dẫn và lời phán đều do cùng một người nói trong nguyên văn. Dùng «Ta» xuyên suốt giữ giọng trang nghiêm và tránh cảm giác đổi người nói.
  - severity: medium
    issue: «Hãy lui khỏi ta» chưa tự nhiên cho mệnh lệnh ἀποχωρεῖτε.
    rationale: «Lui» thường gợi hành động lùi lại hoặc rút lui; «rời khỏi Ta» chuyển đạt trực tiếp lệnh phải đi khỏi người nói.
  - severity: medium
    issue: Chú thích [b] được đặt cuối câu nhưng giải thích cả «biết» và «làm điều vô luật pháp».
    rationale: Neo chú thích nên đứng ngay sau đơn vị được giải thích. Tách chú thích cho «biết» và ἀνομία giúp người đọc xác định rõ phạm vi chú giải.
