- from: Vậy, nếu anh em vốn xấu xa mà còn biết cho con cái mình những món quà tốt lành, thì Cha của anh em, Đấng ở trên các tầng trời[a], lại càng ban những điều tốt lành[b] cho những người cầu xin Ngài biết bao!
  to: Vậy, nếu anh em vốn xấu xa mà còn biết cho con cái mình những món quà tốt lành, thì Cha của anh em, Đấng ở trong các tầng trời[a], lại càng ban những điều tốt lành[b] cho những người cầu xin Ngài biết bao!
  rationale: Chỉ sửa cụm chỉ nơi chốn của Cha để phản ánh đúng ἐν (“trong”) và tránh hàm ý Cha ở phía trên các tầng trời. Chú thích a được điều chỉnh tương ứng; các yếu tố còn lại của bản nháp được giữ nguyên.
  reviewer_model: gpt-5.6-terra
