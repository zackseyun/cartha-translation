id: MAT.7.11
reference: Matthew 7:11
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εἰ οὖν ὑμεῖς πονηροὶ ὄντες οἴδατε δόματα ἀγαθὰ διδόναι τοῖς τέκνοις ὑμῶν, πόσῳ μᾶλλον ὁ πατὴρ ὑμῶν ὁ ἐν τοῖς οὐρανοῖς δώσει ἀγαθὰ τοῖς αἰτοῦσιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/011.yaml
  text: If you[a], then, being evil, know how to give good gifts to your children[b], how much more will your Father in the heavens give good things to those who ask him.
translation:
  language: vi
  text: Vậy, nếu anh em vốn xấu xa mà còn biết cho con cái mình những món quà tốt lành, thì Cha của anh em, Đấng ở trong các tầng trời[a], lại càng ban những điều tốt lành[b] cho những người cầu xin Ngài biết bao!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch theo cách quen thuộc hơn là “Cha của anh em ở trên trời”. Tiếng Hy Lạp dùng số nhiều: “ở trong các trời”.'
    reason: lexical_alternative
  - marker: b
    text: Một số bản dịch viết “ban những món quà tốt lành”, nhưng ở vế này tiếng Hy Lạp chỉ nói “ban những điều tốt lành”.
    reason: lexical_alternative
lexical_decisions:
- source_word: πονηροὶ ὄντες
  choice: vốn xấu xa
  rationale: Diễn đạt trực tiếp tình trạng được câu Hy Lạp gán cho người nghe, không giảm nhẹ thành chỉ ‘không hoàn hảo’ và cũng không mở rộng thành một công thức giáo lý. Từ ‘vốn’ kết hợp với ‘mà còn’ chuyển tải tự nhiên sắc thái nhượng bộ trong ngữ cảnh.
- source_word: οἴδατε ... διδόναι
  choice: biết cho
  rationale: Trong tiếng Việt, ‘biết cho’ diễn đạt tự nhiên năng lực thực tế hàm chứa trong cấu trúc động từ Hy Lạp với động từ nguyên mẫu.
- source_word: δόματα ἀγαθὰ
  choice: những món quà tốt lành
  rationale: ‘Món quà’ phản ánh danh từ δόματα, còn ‘tốt lành’ thể hiện ἀγαθὰ và giữ văn phong trang trọng, dễ hiểu.
- source_word: τοῖς τέκνοις ὑμῶν
  choice: cho con cái mình
  rationale: ‘Con cái’ bao gồm cả nam lẫn nữ như τέκνα; đại từ phản thân ‘mình’ tự nhiên trong mệnh đề có chủ ngữ ‘anh em’.
- source_word: πόσῳ μᾶλλον
  choice: lại càng ... biết bao
  rationale: Cấu trúc này tái hiện lập luận từ điều nhỏ đến điều lớn và có nhịp điệu tự nhiên trong tiếng Việt.
- source_word: ὁ πατὴρ ὑμῶν ὁ ἐν τοῖς οὐρανοῖς
  choice: Cha của anh em, Đấng ở trên các tầng trời
  rationale: Giữ danh xưng ‘Cha’ cùng mệnh đề định vị riêng, đồng thời phản ánh dạng số nhiều τοῖς οὐρανοῖς bằng ‘các tầng trời’ thay vì đổi thành tính từ ‘thiên thượng’.
- source_word: δώσει ἀγαθὰ
  choice: ban những điều tốt lành
  rationale: Vì δόματα không được lặp lại trong vế sau, ‘những điều tốt lành’ phản ánh tính từ được dùng như danh từ mà không tự ý thêm ‘quà’. ‘Ban’ là cách nói tiếng Việt tự nhiên khi chủ thể là Đức Chúa Trời.
- source_word: τοῖς αἰτοῦσιν αὐτόν
  choice: cho những người cầu xin Ngài
  rationale: Phân từ hiện tại chỉ một nhóm người nói chung; ‘những người cầu xin Ngài’ vừa tự nhiên vừa giữ đối tượng của lời cầu xin.
theological_decisions:
- issue: Sức nặng nhân học của πονηροὶ ὄντες
  choice: Giữ lời mô tả trực tiếp ‘vốn xấu xa’.
  alternative: ‘dù là người có tội’ hoặc ‘dù không hoàn hảo’
  rationale: Bản dịch bảo toàn sự tương phản giữa tình trạng xấu xa của con người và lòng tốt vượt trội của Cha, nhưng không biến câu này thành một phát biểu giáo lý chi tiết hơn nguyên văn.
- issue: Cách dịch ὁ ἐν τοῖς οὐρανοῖς
  choice: ‘Đấng ở trên các tầng trời’
  alternative: ‘Cha trên trời’ hoặc ‘Cha thiên thượng’
  rationale: Cách chọn này giữ cấu trúc định vị và số nhiều của nguyên văn Hy Lạp, thay vì hòa theo cách nói truyền thống ở số ít.
- issue: Phân biệt δόματα ἀγαθὰ ở vế đầu với ἀγαθὰ ở vế sau
  choice: ‘những món quà tốt lành’ rồi ‘những điều tốt lành’
  alternative: Lặp lại ‘những món quà tốt lành’ ở cả hai vế
  rationale: Giữ sự khác biệt từ vựng của nguyên văn và không tự ý bổ sung danh từ ‘quà’ trong vế nói về điều Cha ban.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng ‘anh em’ để chỉ chung những người nghe, ‘Ngài’ để quy chiếu kính trọng đến Cha, và cấu trúc ‘mà còn ... lại càng ... biết bao’ để thể hiện rõ lập luận so sánh tăng tiến.
