  to: Đừng đem điều thánh cho chó[a], cũng đừng ném ngọc trai của anh em trước mặt heo, kẻo chúng giẫm đạp những viên ngọc ấy dưới chân, rồi quay lại xé nát anh em.[b]
  rationale: 'Chỉnh sửa nhẹ để tăng tính tự nhiên của tiếng Việt: thay “trao” bằng “đem ... cho” và dùng cụm “giẫm đạp ... dưới chân”. Ý nghĩa, ẩn dụ, mức độ bạo lực của hình ảnh, và tính mơ hồ có chủ ý của nguyên văn đều được giữ nguyên.'
