id: MAT.7.6
reference: Matthew 7:6
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Μὴ δῶτε τὸ ἅγιον τοῖς κυσίν, μηδὲ βάλητε τοὺς μαργαρίτας ὑμῶν ἔμπροσθεν τῶν χοίρων, μήποτε ⸀καταπατήσουσιν αὐτοὺς ἐν τοῖς ποσὶν αὐτῶν καὶ στραφέντες ῥήξωσιν ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/006.yaml
  text: Do not give what is holy to dogs[a], and do not throw your pearls before pigs[d][c][b], lest they trample them under their feet and turn and tear you to pieces.
translation:
  language: vi
  text: Đừng đem điều thánh cho chó[a], cũng đừng ném ngọc trai của anh em trước mặt heo, kẻo chúng giẫm đạp những viên ngọc ấy dưới chân, rồi quay lại xé nát anh em.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “vật thánh” hoặc “điều thiêng liêng”. Cụm từ Hy Lạp có nghĩa rộng, chỉ điều được biệt riêng hoặc được coi là thánh.'
    reason: lexical_alternative
  - marker: b
    text: 'Hay: “xé xác anh em”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ ἅγιον
  choice: điều thánh
  rationale: Tính từ trung tính số ít được dùng như danh từ với nghĩa rộng. “Điều thánh” tự nhiên hơn “vật thánh” mà không giới hạn đối tượng vào giáo huấn, lễ vật hay một thứ đã được biệt riêng cụ thể nào.
- source_word: τοῖς κυσίν
  choice: cho chó
  rationale: Giữ nguyên hình ảnh mạnh và sắc thái gây khó chịu trong bối cảnh văn hóa của câu, không làm nhẹ phép ẩn dụ.
- source_word: βάλητε
  choice: ném
  rationale: Diễn đạt trực tiếp hành động của βάλλω bằng từ thông dụng trong tiếng Việt hiện đại.
- source_word: τοὺς μαργαρίτας ὑμῶν
  choice: ngọc trai của anh em
  rationale: Giữ số nhiều theo nghĩa tập hợp tự nhiên của tiếng Việt và chuyển đại từ ngôi thứ hai số nhiều thành “anh em” để chỉ chung những người đang được nói với.
- source_word: ἔμπροσθεν τῶν χοίρων
  choice: trước mặt heo
  rationale: Cách nói tự nhiên, sát với vị trí được nêu trong nguyên văn và giữ nguyên hình ảnh loài vật.
- source_word: μήποτε
  choice: kẻo
  rationale: “Kẻo” diễn đạt gọn và tự nhiên lời cảnh báo về hậu quả cần tránh.
- source_word: καταπατήσουσιν αὐτοὺς ἐν τοῖς ποσὶν αὐτῶν
  choice: chúng giẫm những viên ngọc ấy dưới chân
  rationale: Làm rõ tân ngữ của đại từ αὐτούς là các viên ngọc, đồng thời giữ cụm “dưới chân” được nêu rõ trong tiếng Hy Lạp.
- source_word: στραφέντες ῥήξωσιν ὑμᾶς
  choice: rồi quay lại xé nát anh em
  rationale: “Rồi quay lại” thể hiện hành động tiếp theo của phân từ aorist; “xé nát” giữ mức độ bạo lực của ῥήγνυμι mà vẫn tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Ý nghĩa của các hình ảnh “điều thánh”, “chó”, “ngọc trai” và “heo”
  choice: Giữ nguyên các hình ảnh mà không giải nghĩa ngay trong câu.
  alternative: Diễn giải “điều thánh” hoặc “ngọc trai” là giáo huấn thánh hay sứ điệp về vương quốc, và đồng nhất “chó” cùng “heo” với một nhóm người cụ thể.
  rationale: Chính câu này không xác định chính xác từng hình ảnh tượng trưng cho điều gì hoặc cho ai. Giữ phép ẩn dụ bảo toàn độ rộng và sức căng thần học của nguyên văn.
- issue: Đối tượng của đại từ αὐτούς trong mệnh đề giẫm đạp
  choice: Diễn đạt là “những viên ngọc ấy”.
  alternative: Dùng đại từ “chúng” cho cả chủ thể lẫn tân ngữ, hoặc hiểu đại từ là chỉ người nghe.
  rationale: Giống đực số nhiều của αὐτούς phù hợp với μαργαρίτας và mạch hình ảnh cho thấy heo giẫm các viên ngọc. Tiếng Việt cần nêu lại danh từ để tránh hai đại từ “chúng” gây mơ hồ không có trong cấu trúc Hy Lạp.
translation_notes:
  register: Văn phong hiện đại, trang trọng nhưng dễ hiểu. Dùng “heo” thay cho từ cổ hoặc mang sắc thái vùng miền mạnh; dùng “anh em” để chuyển ngôi thứ hai số nhiều. Nhịp câu giữ hai mệnh lệnh phủ định song song và lời cảnh báo nối tiếp ở cuối câu.
