revisions:
- from: Hãy vào qua cửa hẹp, vì cửa thì rộng[a], đường thì thênh thang[b], dẫn đến sự hủy diệt[c], và nhiều người đi vào qua đó.
  to: Hãy vào qua cửa hẹp, vì cửa[a] rộng và đường thênh thang dẫn đến sự hủy diệt[b]; nhiều người đi vào qua cửa ấy.
  rationale: Sửa chú thích dị bản để phản ánh đúng phần văn bản được SBLGNT đánh dấu. Chỉnh cú pháp cho tự nhiên hơn và làm rõ quy chiếu ngữ nghĩa của đại từ cuối câu là “cửa”, là đối tượng thích hợp của động tác “đi vào qua”. Giữ “sự hủy diệt” để bảo toàn mức độ nghiêm trọng của ἀπώλεια mà không xác định hóa thần học.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T02:43:58Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch truyền đạt đúng mệnh lệnh, sự đối lập giữa cửa rộng và đường thênh thang, con đường dẫn đến sự hủy diệt, và số đông đi vào qua cửa ấy. Tuy nhiên, chú thích dị bản hiện nói sai phạm vi phần bị thiếu: dấu ngoặc của SBLGNT bao quanh ἡ πύλη (“cửa ấy/cái cửa”), không phải toàn cụm “cửa thì rộng”.'
  naturalness: “Nhiều người đi vào qua đó” mơ hồ và hơi gượng trong tiếng Việt, vì “đó” có thể hướng đến cả đường lẫn cửa. Cấu trúc “đường thì thênh thang, dẫn đến” cũng kém trôi chảy hơn khi đặt mệnh đề quan hệ trực tiếp sau “đường”.
  terminology: “Cửa hẹp”, “đường thênh thang”, và “sự hủy diệt” đều phù hợp với nguyên ngữ và văn phong Kinh Thánh tiếng Việt hiện đại. Thay “cảnh tan hoang” trong chú thích bằng “sự diệt vong” tránh chuyển ἀπώλεια thành một hình ảnh cụ thể không có trong từ gốc.
  issues:
  - severity: medium
    issue: Chú thích a mô tả không chính xác dị bản văn bản
    rationale: SBLGNT đặt ngoặc vuông quanh ἡ πύλη, tức “cửa/cái cửa”, cho thấy phần này có vấn đề bản văn. Chú thích nói một số thủ bản không có toàn cụm “cửa thì rộng” đã mở rộng dị bản vượt quá phần được đánh dấu.
  - severity: low
    issue: Đại từ “qua đó” mơ hồ trong tiếng Việt
    rationale: Dù αὐτῆς về mặt giống ngữ pháp có thể quy chiếu một danh từ giống cái trước đó, ngữ cảnh “đi vào qua” hướng tự nhiên đến “cửa”. “Qua cửa ấy” làm rõ quan hệ ngữ nghĩa mà không thay đổi ý câu.
  - severity: low
    issue: Lựa chọn thay thế “cảnh tan hoang” không tương ứng tốt với ἀπώλεια
    rationale: ἀπώλεια diễn tả hủy diệt, diệt vong hoặc hư mất; “cảnh tan hoang” thêm ý về một quang cảnh vật chất.
