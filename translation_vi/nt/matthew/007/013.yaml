id: MAT.7.13
reference: Matthew 7:13
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Εἰσέλθατε διὰ τῆς στενῆς πύλης· ὅτι πλατεῖα ⸂ἡ πύλη⸃ καὶ εὐρύχωρος ἡ ὁδὸς ἡ ἀπάγουσα εἰς τὴν ἀπώλειαν, καὶ πολλοί εἰσιν οἱ εἰσερχόμενοι δι’ αὐτῆς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/013.yaml
  text: Enter through the narrow gate[a]. For wide is the gate and broad is the road that leads to destruction[c][b], and many are those who enter through it.
translation:
  language: vi
  text: Hãy vào qua cửa hẹp, vì cửa[a] rộng và đường thênh thang dẫn đến sự hủy diệt[b]; nhiều người đi vào qua cửa ấy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Một số thủ bản không có từ “cửa”.
    reason: textual_variant
  - marker: b
    text: 'Hay: “sự diệt vong”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰσέλθατε
  choice: Hãy vào
  rationale: Động từ mệnh lệnh số nhiều được chuyển bằng “Hãy vào”, trực tiếp, tự nhiên và giữ nguyên sức nặng của lời truyền.
- source_word: διὰ τῆς στενῆς πύλης
  choice: qua cửa hẹp
  rationale: διά với sở hữu cách diễn tả sự chuyển động xuyên qua; “cửa hẹp” giữ hình ảnh không gian và sự tương phản trong câu.
- source_word: ὅτι
  choice: vì
  rationale: Liên từ nêu lý do giải thích cho mệnh lệnh đứng trước.
- source_word: πλατεῖα ἡ πύλη
  choice: cửa thì rộng
  rationale: “Rộng” là nghĩa không gian thông thường của πλατύς; kết cấu có “thì” làm nổi bật sự tương phản mà vẫn tự nhiên trong tiếng Việt.
- source_word: εὐρύχωρος ἡ ὁδός
  choice: đường thì thênh thang
  rationale: εὐρύχωρος chỉ sự rộng rãi, có nhiều khoảng trống. “Thênh thang” diễn đạt tự nhiên hình ảnh một con đường rộng và dễ đi, đồng thời phân biệt với “cửa thì rộng”.
- source_word: ἡ ἀπάγουσα
  choice: dẫn đến
  rationale: Phân từ hiện tại bổ nghĩa cho “đường”; “dẫn đến” diễn đạt tự nhiên hướng đi và kết cục.
- source_word: εἰς τὴν ἀπώλειαν
  choice: đến sự hủy diệt
  rationale: ἀπώλεια có thể chỉ sự hủy diệt, diệt vong hoặc mất mát tan hoang. “Sự hủy diệt” giữ mức độ nghiêm trọng mà không xác định quá mức bản chất thần học của kết cục.
- source_word: πολλοί εἰσιν οἱ εἰσερχόμενοι δι’ αὐτῆς
  choice: và nhiều người đi vào qua đó
  rationale: Giữ sự nhấn mạnh vào “nhiều người” và dịch đại từ αὐτῆς bằng “đó”, không tự ý thay nó bằng danh từ “cửa”. Cách nói này cũng giữ phần nào khả năng quy chiếu vốn có của đại từ Hy Lạp.
theological_decisions:
- issue: Ý nghĩa của ἀπώλεια trong lời cảnh báo của Chúa Giê-su
  choice: sự hủy diệt
  alternative: sự diệt vong; sự tàn ruin
  rationale: Câu này nói đến một kết cục tai hại nhưng không giải thích đầy đủ bản chất thần học của kết cục ấy. “Sự hủy diệt” giữ nguyên sức nặng và sự căng thẳng của lời cảnh báo, không thu hẹp nó vào một hệ giải thích riêng.
- issue: Đối tượng mà αὐτῆς ở cuối câu quy chiếu
  choice: qua đó
  alternative: qua cửa ấy; theo đường ấy
  rationale: Cả πύλη (“cửa”) và ὁδός (“đường”) đều là danh từ giống cái, nên hình thức ngữ pháp không tự nó giải quyết hoàn toàn đối tượng quy chiếu. “Cửa” phù hợp hơn với động tác “đi vào qua”, nhưng bản dịch dùng đại từ trung tính “đó” để không bổ sung danh từ không có trong mệnh đề cuối.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cấu trúc song song “cửa thì rộng, đường thì thênh thang” làm rõ sự tương phản với “cửa hẹp”. “Đi vào qua đó” hơi trang trọng nhưng giữ sát động từ và đại từ của nguyên văn, đồng thời tránh tự ý giải quyết hoàn toàn đối tượng quy chiếu.
