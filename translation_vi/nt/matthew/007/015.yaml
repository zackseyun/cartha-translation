revisions:
- from: Hãy coi chừng các tiên tri giả[a], là những kẻ đến với anh em trong lốt chiên[b], nhưng bên trong là loài sói tham mồi.
  to: Hãy coi chừng các tiên tri giả[a], là những kẻ đến với anh em trong lốt chiên[b], nhưng bên trong chúng là những con sói hung tợn.
  rationale: Chỉ thay “loài sói tham mồi” bằng “những con sói hung tợn” để tiếng Việt tự nhiên hơn, giữ số nhiều của nguyên văn và truyền đạt rõ đặc tính nguy hiểm, săn mồi của ἅρπαγες. Cấu trúc “bên trong chúng là” làm rõ sự đối lập giữa vẻ ngoài và thực chất mà không thêm diễn giải giáo phái.
