review_pass:
  verdict: revise
  source_fidelity: Bản dịch giữ đúng lời cảnh báo, đối tượng là “các tiên tri giả,” hình ảnh “trong lốt chiên,” và sự tương phản giữa vẻ ngoài với thực chất bên trong. Tuy nhiên, “loài sói tham mồi” không diễn đạt tự nhiên hoặc chính xác sắc thái ἅρπαγες, vốn chỉ tính săn mồi, hung bạo/chiếm đoạt của bầy sói.
  naturalness: “Hãy coi chừng” và “trong lốt chiên” là tiếng Việt hiện đại, tự nhiên, phù hợp văn cảnh. Cụm “loài sói tham mồi” không thông dụng; “những con sói hung tợn” tự nhiên hơn và vẫn giữ hình ảnh số nhiều của nguyên văn.
  terminology: “Tiên tri giả” là thuật ngữ chuẩn. “Anh em” phù hợp cách xưng hô với nhóm người nghe trong văn cảnh. “Lốt chiên” là thành ngữ Việt phù hợp với ἐν ἐνδύμασι προβάτων; chú thích sát nghĩa hữu ích.
  issues:
  - severity: medium
    issue: “loài sói tham mồi” không tự nhiên và làm mờ sắc thái của λύκοι ἅρπαγες.
    rationale: ἅρπαγες mô tả tính săn bắt, hung bạo, cướp đoạt; “tham mồi” dễ gợi ý ham mồi nhử hoặc lòng tham nói chung, hơn là bản chất nguy hiểm của loài sói. Cách nói này cũng không giữ rõ số nhiều như λύκοι.
  revised_text: Hãy coi chừng các tiên tri giả[a], là những kẻ đến với anh em trong lốt chiên[b], nhưng bên trong chúng là những con sói hung tợn.
