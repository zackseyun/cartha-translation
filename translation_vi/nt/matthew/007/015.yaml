  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸀Προσέχετε ἀπὸ τῶν ψευδοπροφητῶν, οἵτινες ἔρχονται πρὸς ὑμᾶς ἐν ἐνδύμασι προβάτων ἔσωθεν δέ εἰσιν λύκοι ἅρπαγες.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/015.yaml
  text: Beware of false prophets[a], who come to you in sheep’s clothing[c][b], but inwardly are ravenous wolves.
translation:
  language: vi
  text: Hãy coi chừng các tiên tri giả[a], là những kẻ đến với anh em trong lốt chiên[b], nhưng bên trong chúng là những con sói hung tợn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Hãy đề phòng các tiên tri giả.”'
    reason: lexical_alternative
  - marker: b
    text: 'Sát nghĩa: “trong y phục của chiên.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Προσέχετε ἀπὸ
  choice: Hãy coi chừng
  rationale: Mệnh lệnh hiện tại số nhiều kêu gọi sự cảnh giác liên tục; “hãy coi chừng” tự nhiên trong tiếng Việt và giữ nguyên sức cảnh báo.
- source_word: ψευδοπροφητῶν
  choice: các tiên tri giả
  rationale: Cách dịch chuẩn, chỉ những người giả mạo tư cách tiên tri hoặc nói lời sai trá với danh nghĩa tiên tri.
- source_word: οἵτινες ἔρχονται πρὸς ὑμᾶς
  choice: là những kẻ đến với anh em
  rationale: Diễn đạt tự nhiên mệnh đề quan hệ có sắc thái mô tả hạng người đang được cảnh báo; “anh em” phù hợp lời Chúa Giê-su nói với các môn đồ và không thu hẹp về giới tính sinh học.
- source_word: ἐν ἐνδύμασι προβάτων
  choice: trong lốt chiên
  rationale: Thành ngữ tiếng Việt ngắn gọn, rõ hình ảnh bề ngoài vô hại che giấu bản chất thật; nghĩa sát chữ được ghi ở chú thích.
- source_word: ἔσωθεν δέ εἰσιν
  choice: nhưng bên trong là
  rationale: Giữ sự tương phản mạnh giữa dáng vẻ bên ngoài và thực chất bên trong.
- source_word: λύκοι ἅρπαγες
  choice: loài sói tham mồi
  rationale: “Tham mồi” truyền đạt đặc tính săn bắt, chiếm đoạt và hủy diệt của ἅρπαγες mà không chỉ giới hạn vào cảm giác đói.
theological_decisions:
- issue: Bản chất lời cảnh báo về những người lãnh đạo tôn giáo lừa dối
  choice: Giữ nguyên hình ảnh như một lời cảnh báo đạo đức và thuộc linh về các tiên tri giả.
  alternative: Diễn đạt cụ thể thành những giáo sư dị giáo theo các phạm trù giáo hội về sau.
  rationale: Câu Hy Lạp nói về các tiên tri giả và sự đối lập giữa vẻ ngoài với bản chất; bản dịch không nên áp đặt những phân loại hệ phái hay cơ chế giáo hội không có trong nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Trong lốt chiên” là cách nói tự nhiên trong tiếng Việt; “loài sói tham mồi” giữ sức mạnh của ἅρπαγες và tránh sắc thái cổ hoặc khó hiểu.
