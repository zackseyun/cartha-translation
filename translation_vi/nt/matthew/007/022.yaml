  to: 'Nhiều người sẽ nói với tôi vào ngày ấy: “Lạy Chúa, lạy Chúa, chẳng phải chúng tôi đã nhân danh Chúa mà nói tiên tri, nhân danh Chúa mà đuổi quỷ, và nhân danh Chúa mà làm nhiều việc quyền năng[a] sao?”'
  rationale: Sửa đại từ «chúng con» thành «chúng tôi» để không thêm quan hệ con cái không có trong nguyên văn; thay «trong ngày ấy» bằng «vào ngày ấy» cho tự nhiên hơn. Những yếu tố còn lại, kể cả sự lặp lại ba lần của «nhân danh Chúa» và chú thích về «việc quyền năng», được giữ nguyên.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T02:44:01Z'
