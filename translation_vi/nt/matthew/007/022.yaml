  terminology: «Chúa», «nói tiên tri», «đuổi quỷ», và «việc quyền năng» đều phù hợp. Chú thích bảo lưu đúng tính linh hoạt ngữ nghĩa của δυνάμεις trong ngữ cảnh Phúc Âm.
