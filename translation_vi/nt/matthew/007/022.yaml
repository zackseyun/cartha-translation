id: MAT.7.22
reference: Matthew 7:22
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: πολλοὶ ἐροῦσίν μοι ἐν ἐκείνῃ τῇ ἡμέρᾳ· Κύριε κύριε, οὐ τῷ σῷ ὀνόματι ἐπροφητεύσαμεν, καὶ τῷ σῷ ὀνόματι δαιμόνια ἐξεβάλομεν, καὶ τῷ σῷ ὀνόματι δυνάμεις πολλὰς ἐποιήσαμεν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/022.yaml
  text: Many will say to me on that day[a], ‘Lord, Lord, did we not prophesy in your name, and cast out demons in your name, and do many mighty works in your name?’
translation:
  language: vi
  text: 'Nhiều người sẽ nói với tôi vào ngày ấy: “Lạy Chúa, lạy Chúa, chẳng phải chúng tôi đã nhân danh Chúa mà nói tiên tri, nhân danh Chúa mà đuổi quỷ, và nhân danh Chúa mà làm nhiều việc quyền năng[a] sao?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “làm nhiều phép lạ” hoặc “thực hiện nhiều công việc đầy quyền năng.” Cụm từ Hy Lạp nói sát nghĩa đến nhiều “quyền năng,” một lối diễn đạt trong các sách Phúc Âm thường chỉ những việc kỳ diệu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὶ
  choice: Nhiều người
  rationale: Tính từ số nhiều được dùng như danh từ; tiếng Việt cần thêm “người” để câu tự nhiên mà không thu hẹp đối tượng.
- source_word: ἐροῦσίν μοι
  choice: sẽ thưa với tôi
  rationale: Thì tương lai được giữ bằng “sẽ”; “thưa với” phù hợp với lời trực tiếp trang trọng hướng đến người được gọi là Chúa.
- source_word: ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: trong ngày ấy
  rationale: Giữ nguyên thành ngữ cánh chung “ngày ấy” mà không diễn giải thành “ngày phán xét.”
- source_word: Κύριε κύριε
  choice: Lạy Chúa, lạy Chúa
  rationale: “Lạy” biểu thị cách xưng hô trực tiếp, khẩn thiết; sự lặp lại được giữ nguyên để bảo toàn sức nhấn mạnh.
- source_word: οὐ ... ἐπροφητεύσαμεν
  choice: chẳng phải chúng con đã ... nói tiên tri ... sao
  rationale: Cấu trúc câu hỏi phủ định trong tiếng Hy Lạp mong đợi câu trả lời khẳng định; mẫu “chẳng phải ... sao” chuyển tải đúng sắc thái ấy.
- source_word: τῷ σῷ ὀνόματι
  choice: nhân danh Chúa
  rationale: “Nhân danh” là cách nói tự nhiên về hành động dựa vào danh nghĩa hoặc thẩm quyền của một người; cả ba lần lặp đều được giữ lại.
- source_word: δαιμόνια ἐξεβάλομεν
  choice: đuổi quỷ
  rationale: Cách diễn đạt ngắn gọn, quen thuộc và chính xác cho hành động trục xuất các quỷ.
- source_word: δυνάμεις πολλὰς ἐποιήσαμεν
  choice: làm nhiều việc quyền năng
  rationale: Giữ mối liên hệ từ vựng của δύναμις với quyền năng, đồng thời không giới hạn nghĩa chỉ vào “phép lạ.”
theological_decisions:
- issue: Cách dịch κύριος khi trực tiếp xưng hô với Chúa Giê-su
  choice: Chúa
  alternative: Chủ; Thầy
  rationale: “Chúa” vừa là cách dịch thông dụng của κύριος vừa giữ được trọng lượng Kitô học của danh xưng mà không diễn giải quá mức.
- issue: Ý nghĩa cánh chung của “ngày ấy”
  choice: trong ngày ấy
  alternative: trong ngày phán xét
  rationale: Ngữ cảnh chỉ về sự phán xét cuối cùng, nhưng nguyên văn chỉ nói “ngày ấy”; bản dịch giữ nguyên hàm ý thay vì nói rõ điều văn bản để ngầm hiểu.
- issue: Đại từ của những người nói với Chúa
  choice: chúng con
  alternative: chúng tôi
  rationale: Tiếng Việt tự nhiên cần một đại từ làm chủ ngữ; “chúng con” phù hợp với lời thưa kính trọng với Chúa nhưng không thay đổi nội dung lời tự biện hộ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ ba lần lặp “nhân danh Chúa” cùng hai lần gọi “lạy Chúa” để bảo toàn nhịp điệu và sức nhấn mạnh của nguyên văn.
