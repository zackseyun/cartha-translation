source:
  edition: SBLGNT
  text: τί δὲ βλέπεις τὸ κάρφος τὸ ἐν τῷ ὀφθαλμῷ τοῦ ἀδελφοῦ σου, τὴν δὲ ἐν τῷ σῷ ὀφθαλμῷ δοκὸν οὐ κατανοεῖς;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/003.yaml
  text: But why do you see the speck in your brother’s eye[c][b][a], yet do not notice the beam in your own eye?
translation:
  language: vi
  text: Nhưng tại sao bạn thấy cái dằm trong mắt người anh em của mình[a], mà không nhận ra cây xà trong chính mắt mình[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tiếng Hy Lạp dùng danh từ giống đực số ít “người anh em”; trong ngữ cảnh, từ này cũng có thể chỉ một người cùng cộng đồng.
    reason: lexical_alternative
  - marker: b
    text: “Cây xà” dịch δοκός, nghĩa là một thanh gỗ lớn dùng trong kiến trúc; cũng có thể diễn đạt là “khúc gỗ” hoặc “tấm ván lớn.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τί δὲ
  choice: Nhưng sao
  rationale: Trong cấu trúc nghi vấn này, τί mang nghĩa thành ngữ là “tại sao/sao,” còn δέ biểu thị sự chuyển ý có sắc thái tương phản nhẹ.
- source_word: βλέπεις
  choice: thấy
  rationale: Giữ hình ảnh cụ thể về thị giác và tạo sự phân biệt với κατανοεῖς ở vế sau.
- source_word: κάρφος
  choice: cái dằm
  rationale: κάρφος chỉ một mảnh nhỏ, khô, như dằm, rơm hay trấu. “Cái dằm” tự nhiên trong tiếng Việt, phù hợp với hình ảnh vật nhỏ mắc trong mắt và đối lập rõ với “cây xà.”
- source_word: ἀδελφοῦ σου
  choice: anh em mình
  rationale: “Anh em” là cách gọi tự nhiên, trang trọng vừa phải dành cho người cùng cộng đồng; “mình” diễn đạt quan hệ sở hữu theo lối Việt ngữ trong câu nói trực tiếp.
- source_word: τὴν ... δοκόν
  choice: cây xà
  rationale: δοκός là một thanh gỗ lớn dùng trong kiến trúc. “Cây xà” bảo toàn hình ảnh kiến trúc và tính cường điệu đối lập với cái dằm.
- source_word: ἐν τῷ σῷ ὀφθαλμῷ
  choice: trong chính mắt mình
  rationale: “Chính” thể hiện sắc thái nhấn mạnh của σῷ và làm nổi bật sự tương phản với mắt của người anh em.
- source_word: οὐ κατανοεῖς
  choice: không nhận ra
  rationale: κατανοέω ở đây có nghĩa nhận thấy, lưu tâm hoặc ý thức rõ. “Không nhận ra” tự nhiên và duy trì sự khác biệt tu từ với “thấy.”
theological_decisions:
- issue: Từ chỉ quan hệ ἀδελφοῦ ở giống đực số ít
  choice: anh em mình
  alternative: người anh em của con
  rationale: Tiếng Việt thường dùng “anh em” như một danh từ chỉ cá nhân trong quan hệ cộng đồng mà không nhất thiết đánh dấu tuổi tác; lựa chọn này tránh thêm chi tiết “anh” hay “em” không có trong nguyên văn. Chú thích nêu rõ hình thức giống đực số ít của tiếng Hy Lạp.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm nhưng gần với lời nói tự nhiên. Đại từ “con” phù hợp với mạch Chúa Giê-su trực tiếp dạy người nghe; “mình” tránh lặp đại từ và làm câu hỏi tu từ trôi chảy. Hình ảnh cường điệu của nguyên văn được giữ nguyên.
