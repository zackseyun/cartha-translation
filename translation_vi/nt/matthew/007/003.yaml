  to: Nhưng tại sao bạn thấy cái dằm trong mắt người anh em của mình[a], mà không nhận ra cây xà trong chính mắt mình[b]?
  rationale: Bản sửa dùng đại từ ngôi thứ hai trung tính, nhất quán và không thêm quan hệ xưng hô ngoài nguyên văn. Cụm “người anh em của mình” bảo toàn danh từ giống đực số ít cùng sở hữu từ, đồng thời vẫn tự nhiên trong tiếng Việt hiện đại. Các hình ảnh và sắc thái đối lập chính của tiếng Hy Lạp được giữ nguyên.
