  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ πᾶς ὁ ἀκούων μου τοὺς λόγους τούτους καὶ μὴ ποιῶν αὐτοὺς ὁμοιωθήσεται ἀνδρὶ μωρῷ, ὅστις ᾠκοδόμησεν ⸂αὐτοῦ τὴν οἰκίαν⸃ ἐπὶ τὴν ἄμμον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/026.yaml
  text: And everyone who hears these words of mine and does not do them will be like a foolish man[a], who built his house on the sand.
translation:
  language: vi
  text: Còn bất cứ ai nghe những lời này của tôi mà không làm theo thì sẽ giống như một người dại[a], người đã xây nhà mình trên cát.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn Hy Lạp là “một người đàn ông dại”; người nam trong hình ảnh so sánh đại diện cho bất cứ ai nghe mà không làm theo.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς ὁ ἀκούων
  choice: bất cứ ai nghe
  rationale: Cụm phân từ hiện tại có mạo từ mang nghĩa khái quát. “Bất cứ ai nghe” tự nhiên trong tiếng Việt và diễn đạt rõ phạm vi bao quát.
- source_word: μου τοὺς λόγους τούτους
  choice: những lời này của tôi
  rationale: Giữ được sự nhấn mạnh của đại từ chỉ định và quan hệ sở hữu; “lời” là cách diễn đạt tự nhiên, trang trọng vừa phải.
- source_word: μὴ ποιῶν αὐτούς
  choice: mà không làm theo
  rationale: Trong ngữ cảnh, ποιέω chỉ việc thực hành những điều đã nghe. Tiếng Việt cần “làm theo” thay vì dịch máy móc là “làm chúng”.
- source_word: ὁμοιωθήσεται
  choice: sẽ giống như
  rationale: Diễn đạt tự nhiên ý so sánh của thể tương lai bị động mà không tạo câu bị động gượng gạo.
- source_word: ἀνδρὶ μωρῷ
  choice: một người dại
  rationale: “Người dại” truyền đạt đúng đặc tính μωρός và phù hợp văn phong dụ ngôn. Tiếng Việt không cần đánh dấu giới tính trong danh từ “người”; chú thích ghi nhận ἀνήρ là danh từ giống đực, chỉ người nam trong hình ảnh so sánh.
- source_word: ᾠκοδόμησεν αὐτοῦ τὴν οἰκίαν
  choice: xây nhà mình
  rationale: Diễn đạt ngắn gọn, tự nhiên hành động xây căn nhà thuộc về chính người ấy; “nhà” giữ rõ hình ảnh công trình.
- source_word: ἐπὶ τὴν ἄμμον
  choice: trên cát
  rationale: Diễn đạt trực tiếp vị trí/nền móng trong hình ảnh dụ ngôn; tiếng Việt không cần mạo từ tương ứng.
theological_decisions:
- issue: Ngôn ngữ chỉ giới tính mang tính đại diện trong hình ảnh so sánh
  choice: một người dại
  alternative: một người đàn ông dại
  rationale: ἀνήρ chỉ một người nam trong hình ảnh cụ thể, nhưng “người” trong tiếng Việt là cách gọi tự nhiên và không mặc nhiên phủ nhận giới tính; nội dung so sánh áp dụng khái quát cho bất cứ ai nghe mà không làm theo. Chú thích bảo tồn dữ kiện giới tính của nguyên văn.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, rõ ràng và trang nghiêm vừa phải. Dùng “Còn” để thể hiện καί mang chức năng nối và đối chiếu với câu trước; tránh lối dịch cổ hoặc cấu trúc sao chép máy móc từ tiếng Hy Lạp.
