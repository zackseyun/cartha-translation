  verdict: revise
  source_fidelity: 'Bản nháp truyền đạt đúng các thành phần chính: tính khái quát của πᾶς ὁ ἀκούων, “những lời này của tôi,” việc không làm theo, sự so sánh tương lai, hình ảnh người dại, nhà của người ấy và cát. Tuy nhiên, cụm “một người dại xây nhà mình” dễ được đọc như một cụm danh ngữ mô tả thay vì mệnh đề quan hệ giải thích; ὅστις ᾠκοδόμησεν là mệnh đề quan hệ với hành động xây dựng đã hoàn tất.'
