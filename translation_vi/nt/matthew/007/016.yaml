id: MAT.7.16
reference: Matthew 7:16
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀπὸ τῶν καρπῶν αὐτῶν ἐπιγνώσεσθε αὐτούς. μήτι συλλέγουσιν ἀπὸ ἀκανθῶν ⸀σταφυλὰς ἢ ἀπὸ τριβόλων σῦκα;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/016.yaml
  text: You will recognize them by their fruits[a]. Do people gather grapes from thorns[b], or figs from thistles?
translation:
  language: vi
  text: Các con sẽ nhận biết họ qua quả của họ.[a] Người ta có hái nho từ bụi gai, hay hái vả từ cây tật lê không?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Các con sẽ biết họ qua quả của họ.”'
    reason: lexical_alternative
  - marker: b
    text: 'Câu hỏi này chờ câu trả lời phủ định: người ta không hái nho từ bụi gai hay hái vả từ cây tật lê.'
    reason: rhetorical_clarification
lexical_decisions:
- source_word: καρπῶν
  choice: quả
  rationale: Giữ nguyên hình ảnh nông nghiệp và nghĩa ẩn dụ của từ Hy Lạp; không diễn giải hẹp thành “hành động” hay “kết quả”. Tiếng Việt có thể dùng danh từ “quả” không biến đổi hình thái dù bản Hy Lạp ở số nhiều.
- source_word: ἐπιγνώσεσθε
  choice: sẽ nhận biết
  rationale: Diễn tả việc nhận ra con người qua bằng chứng có thể quan sát, phù hợp với ngữ cảnh phân biệt các tiên tri giả; tránh nhấn quá mức thành “biết rõ hoàn toàn”.
- source_word: αὐτῶν / αὐτούς
  choice: của họ / họ
  rationale: Các đại từ chỉ những người đang được nói đến; dùng “họ” để giữ sắc thái chỉ người tự nhiên và không mang tính miệt thị.
- source_word: μήτι
  choice: … có … không?
  rationale: Cấu trúc câu hỏi tiếng Việt này tự nhiên và vẫn thể hiện câu hỏi tu từ vốn chờ câu trả lời phủ định.
- source_word: συλλέγουσιν
  choice: hái
  rationale: Trong ngữ cảnh thu lấy nho và vả, “hái” tự nhiên và cụ thể hơn “thu gom”, đồng thời giữ hình ảnh nông nghiệp.
- source_word: ἀκανθῶν
  choice: bụi gai
  rationale: Chuyển tải nghĩa gai hoặc cây bụi có gai bằng cách diễn đạt rõ ràng, dễ hiểu trong tiếng Việt hiện đại.
- source_word: σταφυλάς
  choice: nho
  rationale: Tương đương trực tiếp và tự nhiên của danh từ Hy Lạp chỉ trái nho.
- source_word: τριβόλων
  choice: cây tật lê
  rationale: Chỉ một loại cây cỏ có gai, phân biệt với “bụi gai” ở vế trước và duy trì phép song song bằng hai loại thực vật có gai khác nhau.
- source_word: σῦκα
  choice: vả
  rationale: Từ quen dùng trong văn cảnh Kinh Thánh để chỉ trái fig, ngắn gọn và phù hợp với hình ảnh cây trái.
theological_decisions:
- issue: Ý nghĩa ẩn dụ của “quả” khi nhận biết con người
  choice: Giữ nguyên ẩn dụ “quả”
  alternative: Diễn giải thành “hành động” hoặc “kết quả họ tạo ra”
  rationale: Bản Hy Lạp dùng hình ảnh quả cây, rồi triển khai ngay bằng nho và vả. Giữ hình ảnh này bảo toàn sức gợi, tính liên kết của câu và khoảng mở về những biểu hiện cụ thể được gọi là “quả”.
- issue: Sắc thái của câu hỏi về nho và vả
  choice: Giữ dưới dạng câu hỏi tu từ chờ câu trả lời phủ định
  alternative: 'Chuyển thành lời khẳng định: “Người ta không hái…”'
  rationale: Câu hỏi giữ đúng hình thức và sức thuyết phục của μήτι, trong khi chú thích làm rõ câu trả lời được ngầm chờ đợi.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Các con” phù hợp với lời Chúa Giê-su trực tiếp dạy những người nghe; “họ” giữ cách quy chiếu đến con người mà không thêm sắc thái miệt thị. “Cây tật lê” hơi mang màu sắc thực vật học nhưng giúp phân biệt hai danh từ Hy Lạp chỉ các loại cây có gai.
