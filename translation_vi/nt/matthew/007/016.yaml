  source_fidelity: 'Bản dịch giữ đúng cấu trúc và ý nghĩa của câu Hy Lạp: lời khẳng định ở thì tương lai về việc nhận biết người ấy qua “quả” của họ, tiếp theo là câu hỏi tu từ μήτι đòi hỏi câu trả lời phủ định. “Quả,” “hái,” “bụi gai,” “nho,” “cây tật lê,” và “vả” bảo toàn hình ảnh nông nghiệp cùng phép song song của nguyên văn. Số nhiều của καρποί được diễn đạt tự nhiên bằng “quả” trong tiếng Việt, không làm thay đổi ý nghĩa.'
  naturalness: Câu văn hiện đại, rõ ràng và phù hợp văn phong Kinh Thánh tiếng Việt. Cấu trúc “có ... không?” truyền đạt tự nhiên lực tu từ phủ định. Việc lặp lại “hái” ở hai vế giúp câu sáng nghĩa và cân đối, dù tiếng Việt cũng có thể lược bỏ động từ ở vế sau.
  terminology: “Nhận biết,” “quả,” “bụi gai,” “cây tật lê,” và “vả” nhất quán với register Kinh Thánh Việt ngữ và không diễn giải ẩn dụ thành hành động hoặc kết quả cụ thể. “Các con” là cách xưng hô trang trọng, quen thuộc trong lời dạy trực tiếp của Chúa Giê-su; không làm sai quy chiếu số nhiều của động từ Hy Lạp.
