  naturalness: Câu được chỉnh nhẹ để tự nhiên, gọn, và vẫn giữ cụm chỉ căn cứ «qua trái của họ» ở vị trí nổi bật. «Anh em» là cách xưng hô số nhiều phù hợp với ngữ cảnh diễn từ và văn phong trang trọng vừa phải.
  terminology: Giữ «trái» thay vì diễn giải thành «hành động» hoặc «kết quả», bảo toàn ẩn dụ của nguyên văn. Giữ «nhận biết» cho ἐπιγινώσκω trong ngữ cảnh phân biệt/nhận diện.
