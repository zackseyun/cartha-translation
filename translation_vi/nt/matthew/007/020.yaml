id: MAT.7.20
reference: Matthew 7:20
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἄρα γε ἀπὸ τῶν καρπῶν αὐτῶν ἐπιγνώσεσθε αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/020.yaml
  text: So then[a], you will recognize them by their fruits.
translation:
  language: vi
  text: Vậy thì[a], qua trái của họ, anh em sẽ nhận biết họ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Vì thế, chính qua trái của họ, anh em sẽ nhận biết họ.”'
    reason: Cụm ἄρα γε có thể được chuyển ngữ với sắc thái suy luận và nhấn mạnh hơn; bản chính ưu tiên cách nói tự nhiên trong tiếng Việt hiện đại.
lexical_decisions:
- source_word: ἄρα γε
  choice: Vậy thì
  rationale: Cụm từ này đưa ra kết luận có sắc thái nhấn nhẹ; “Vậy thì” tự nhiên trong tiếng Việt và nối câu với lập luận ngay trước đó.
- source_word: ἀπὸ
  choice: qua
  rationale: Trong cấu trúc này, giới từ chỉ căn cứ để nhận biết. “Qua” diễn đạt tự nhiên ý nhận diện một người dựa trên điều họ sinh ra.
- source_word: καρπῶν
  choice: những trái
  rationale: Giữ nguyên hình ảnh ẩn dụ và số nhiều của tiếng Hy Lạp, thay vì diễn giải thành “hành động” hay “kết quả”.
- source_word: αὐτῶν
  choice: của họ
  rationale: Đại từ sở hữu bổ nghĩa cho “những trái” và quy chiếu đến những người đang được nói tới.
- source_word: ἐπιγνώσεσθε
  choice: anh em sẽ nhận biết
  rationale: Động từ ở thì tương lai, ngôi thứ hai số nhiều, nói đến việc nhận diện họ qua bằng chứng có thể quan sát; “nhận biết” giữ được nghĩa này mà không cường điệu thành “biết rõ hoàn toàn”.
- source_word: αὐτούς
  choice: họ
  rationale: Đại từ đối cách quy chiếu trực tiếp đến những người đang được bàn đến.
theological_decisions:
- issue: Ẩn dụ “trái” dùng làm căn cứ nhận biết con người
  choice: Giữ nguyên ẩn dụ “những trái của họ”.
  alternative: Diễn giải là “hành động của họ” hoặc “kết quả họ tạo ra”.
  rationale: Ngữ cảnh nói đến những biểu hiện có thể quan sát, nhưng nguyên văn vẫn dùng hình ảnh trái cây. Giữ ẩn dụ bảo toàn mối liên hệ với các câu liền trước và không thu hẹp ý nghĩa theo một cách giải thích thần học riêng.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Anh em” thể hiện ngôi thứ hai số nhiều trong lời Chúa Giê-su nói với người nghe. Cấu trúc “qua những trái của họ” giữ hình ảnh nguyên văn đồng thời diễn đạt rõ căn cứ của sự nhận biết.
