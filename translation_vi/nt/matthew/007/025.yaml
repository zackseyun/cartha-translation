review_pass:
  verdict: revise
  source_fidelity: Bản nháp truyền đạt đúng hình ảnh bão tố và kết quả ngôi nhà không đổ. Tuy nhiên, οἱ ποταμοί trước hết là “các dòng sông,” không phải trực tiếp là “nước lũ”; chú thích không hoàn toàn bù được khi bản văn chính đã chọn nghĩa diễn giải hơn. Liên từ “nhưng” không có trong tiếng Hy Lạp, vốn chỉ nối tiếp bằng καί; nên bỏ để giữ nhịp kể và tránh thêm sắc thái đối lập. Cụm τεθεμελίωτο cần thể hiện rõ việc ngôi nhà đã được đặt nền móng từ trước.
  naturalness: Bản sửa vẫn dùng tiếng Việt hiện đại, tự nhiên và giữ nhịp liệt kê của câu. “Các dòng sông tràn đến” có tính hình tượng nhưng sát nghĩa; “đặt nền móng trên đá” rõ và tự nhiên hơn “đặt nền.”
  terminology: “Đá” giữ đúng hình ảnh πέτρα, không diễn giải thành “đá nền” hay gán ý nghĩa thần học. “Ngôi nhà ấy” phù hợp với οἰκίᾳ ἐκείνῃ. Chú thích cho “các dòng sông” nêu phương án theo ngữ cảnh mà không thay thế nghĩa chính.
  issues:
  - severity: medium
    issue: “nước lũ” được dùng làm bản dịch chính cho οἱ ποταμοί.
    rationale: ποταμοί có nghĩa cơ bản là “các dòng sông/các sông.” Bối cảnh có thể gợi nước lũ, nhưng bản văn chính nên giữ nghĩa từ vựng cơ bản, còn “nước lũ” nên để như phương án chú thích.
  - severity: low
    issue: Thêm từ “nhưng” trước mệnh đề “nhà không đổ.”
    rationale: Nguyên văn dùng καί (“và”), không đánh dấu một liên từ đối nghịch. Sự tương phản đã rõ trong nội dung, không cần thêm sắc thái diễn giải.
  - severity: low
    issue: “đã được đặt nền” chưa diễn đạt đầy đủ, rõ ràng ý nền móng của τεθεμελίωτο.
    rationale: “Đặt nền móng” phản ánh trực tiếp hơn hình ảnh được đặt/xây nền từ trước và vẫn tự nhiên trong tiếng Việt.
  revised_text: Mưa trút xuống, các dòng sông[a] tràn đến, gió thổi và đập vào[b] ngôi nhà ấy; ngôi nhà không đổ, vì nó đã được đặt nền móng trên đá.
