source:
  edition: SBLGNT
  text: καὶ κατέβη ἡ βροχὴ καὶ ἦλθον οἱ ποταμοὶ καὶ ἔπνευσαν οἱ ἄνεμοι καὶ προσέπεσαν τῇ οἰκίᾳ ἐκείνῃ, καὶ οὐκ ἔπεσεν, τεθεμελίωτο γὰρ ἐπὶ τὴν πέτραν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/025.yaml
  text: And the rain came down[a], and the rivers came, and the winds blew and beat against that house, and it did not fall[b], for it had been founded on the rock.
translation:
  language: vi
  text: Mưa trút xuống, các dòng sông[a] tràn đến, gió thổi và đập vào[b] ngôi nhà ấy; ngôi nhà không đổ, vì nó đã được đặt nền móng trên đá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “nước lũ”; sát nghĩa là “các dòng sông.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “ập vào,” “xô vào,” hoặc sát nghĩa hơn là “đổ/giáng xuống trên.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατέβη ἡ βροχή
  choice: Mưa trút xuống
  rationale: Diễn đạt tự nhiên việc mưa từ trên đổ xuống, đồng thời giữ hướng chuyển động của καταβαίνω.
- source_word: οἱ ποταμοί
  choice: nước lũ
  rationale: ποταμοί theo nghĩa đen là các sông hoặc dòng sông; trong cảnh bão lũ, “nước lũ” truyền đạt tự nhiên sức nước tràn đến đe dọa ngôi nhà. Nghĩa sát chữ được ghi trong chú thích.
- source_word: ἔπνευσαν οἱ ἄνεμοι
  choice: gió thổi
  rationale: Cách diễn đạt tiêu chuẩn, tự nhiên trong tiếng Việt; danh từ số nhiều trong tiếng Hy Lạp không cần biểu thị số nhiều bằng “những cơn gió” ở đây.
- source_word: προσέπεσαν
  choice: đập vào
  rationale: Trong ngữ cảnh bão tố, “đập vào” diễn tả lực tác động lên ngôi nhà một cách tự nhiên. Nghĩa sát hơn là “ập vào” hoặc “xô vào” được bảo lưu trong chú thích.
- source_word: οἰκίᾳ ἐκείνῃ
  choice: ngôi nhà ấy
  rationale: Chỉ ngôi nhà vật chất trong dụ ngôn, không phải gia đình hay hộ gia đình.
- source_word: οὐκ ἔπεσεν
  choice: nhà không đổ
  rationale: Giữ nghĩa trực tiếp của πίπτω và tự nhiên hơn trong tiếng Việt so với lặp đại từ “nó”; không tăng cường thành “sụp đổ hoàn toàn”.
- source_word: τεθεμελίωτο
  choice: đã được đặt nền
  rationale: 'Giữ sắc thái quá khứ hoàn thành và bị động: nền móng đã được đặt từ trước, giải thích vì sao nhà đứng vững.'
- source_word: ἐπὶ τὴν πέτραν
  choice: trên đá
  rationale: Giữ hình ảnh πέτρα là đá, không cụ thể hóa thành “đá nền” hay đồng nhất hòn đá với một thực tại thần học không được nêu ngay trong câu.
theological_decisions:
- issue: Hình ảnh nền móng trong dụ ngôn
  choice: trên đá
  alternative: trên nền đá; trên đá nền
  rationale: Bản dịch giữ nguyên hình ảnh thông thường của dụ ngôn và không giải thích thêm đá tượng trưng cho ai hay điều gì, vì câu này không trực tiếp đưa ra sự đồng nhất ấy.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Nhịp liệt kê của câu Hy Lạp được giữ bằng các vế nối tiếp; dấu chấm phẩy giúp làm rõ sự tương phản giữa sức bão và việc ngôi nhà không đổ.
