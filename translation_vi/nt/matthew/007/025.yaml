  to: Mưa trút xuống, các dòng sông[a] tràn đến, gió thổi và đập vào[b] ngôi nhà ấy; ngôi nhà không đổ, vì nó đã được đặt nền móng trên đá.
  rationale: Sửa bản văn chính để ưu tiên nghĩa từ vựng của ποταμοί (“các dòng sông”), chuyển cách hiểu theo bối cảnh “nước lũ” xuống chú thích, bỏ liên từ đối nghịch không có trong nguyên văn, và làm rõ hình ảnh nền móng trong τεθεμελίωτο. Các mốc chú thích vẫn gắn đúng với từ/cụm từ được chú giải.
