  text: Μὴ κρίνετε, ἵνα μὴ κριθῆτε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/001.yaml
  text: Do not judge[a], so that you may not be judged.
translation:
  language: vi
  text: Đừng xét đoán[a], để không bị xét đoán.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Đừng kết án, để không bị kết án.” Động từ Hy Lạp trong một số văn cảnh có thể mang nghĩa “kết án”, nhưng “xét đoán” có nghĩa rộng hơn và giữ được phép lặp từ trong câu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ κρίνετε
  choice: Đừng xét đoán
  rationale: Μή với động từ mệnh lệnh hiện tại tạo thành lời cấm. “Đừng xét đoán” tự nhiên trong tiếng Việt hiện đại, giữ được nghĩa rộng của κρίνω và không thu hẹp câu này thành việc kết án.
- source_word: ἵνα μὴ
  choice: để ... không
  rationale: Cấu trúc này diễn đạt mục đích hoặc kết quả; “để ... không” vừa tự nhiên vừa duy trì mối liên hệ trực tiếp giữa hai vế.
- source_word: κριθῆτε
  choice: anh em không bị xét đoán
  rationale: Dạng bị động giả định được dịch bằng “bị xét đoán”; lặp lại cùng cụm từ với κρίνετε nhằm bảo toàn phép lặp và thế cân đối của nguyên văn. Đại từ “anh em” làm rõ chủ thể số nhiều vốn được biểu thị trong hình thái động từ Hy Lạp.
theological_decisions:
- issue: Phạm vi nghĩa của κρίνω trong lời cấm của Chúa Giê-su
  choice: Giữ cách dịch rộng là “xét đoán”.
  alternative: “Đừng kết án, để anh em không bị kết án.”
  rationale: Riêng câu này không xác định đầy đủ mọi ranh giới của việc đánh giá đạo đức; văn cảnh tiếp theo làm sáng tỏ loại xét đoán bị cảnh báo. Vì vậy, “xét đoán” bảo lưu độ rộng và sức căng thần học của nguyên văn, thay vì diễn giải hẹp thành sự kết án.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “anh em” để biểu thị ngôi thứ hai số nhiều hàm ẩn trong động từ Hy Lạp; tránh cách dịch quá khẩu ngữ hoặc thu hẹp ý nghĩa theo một lập trường giáo phái.
