id: MAT.7.29
reference: Matthew 7:29
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἦν γὰρ διδάσκων αὐτοὺς ὡς ἐξουσίαν ἔχων καὶ οὐχ ὡς οἱ γραμματεῖς ⸀αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/029.yaml
  text: for he was teaching them as one having authority[a], and not as their scribes.
translation:
  language: vi
  text: vì Ngài dạy họ như một người có thẩm quyền[a], chứ không như các kinh sư của họ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc nói tự nhiên hơn: “dạy một cách có thẩm quyền.”'
    reason: Nêu cách diễn đạt tiếng Việt thành ngữ hơn cho ὡς ἐξουσίαν ἔχων mà không thay đổi ý nghĩa căn bản.
lexical_decisions:
- source_word: ἦν γὰρ διδάσκων
  choice: vì Ngài dạy
  rationale: Kết cấu ἦν + phân từ hiện tại diễn tả hành động đang diễn ra trong quá khứ; tiếng Việt tự nhiên không cần tái hiện bằng một cấu trúc tiếp diễn cứng nhắc. “Vì” giữ chức năng giải thích của γάρ, nối với sự kinh ngạc của đám đông ở câu trước.
- source_word: αὐτούς
  choice: họ
  rationale: Đại từ làm tân ngữ, chỉ những người đang nghe, tức đám đông trong văn cảnh.
- source_word: ὡς ἐξουσίαν ἔχων
  choice: như một người có thẩm quyền
  rationale: Giữ rõ cấu trúc so sánh và phẩm chất cá nhân được nêu trong tiếng Hy Lạp. ἐξουσία ở đây là thẩm quyền, không chỉ là sự tự tin hay sức thuyết phục.
- source_word: καὶ οὐχ ὡς
  choice: chứ không như
  rationale: Diễn đạt tự nhiên sự tương phản rõ rệt trong tiếng Việt, đồng thời vẫn giữ phép so sánh của nguyên bản.
- source_word: οἱ γραμματεῖς αὐτῶν
  choice: các kinh sư của họ
  rationale: “Kinh sư” là cách gọi hiện đại, dễ hiểu đối với những chuyên gia và người giảng dạy Luật trong bối cảnh Tin Mừng; “của họ” giữ αὐτῶν và mối liên hệ với dân chúng.
theological_decisions:
- issue: Bản chất thẩm quyền của Chúa Giê-su khi giảng dạy
  choice: 'Diễn đạt mô tả: “như một người có thẩm quyền.”'
  alternative: Nói rõ đây là thẩm quyền thần linh, hoặc giảm nghĩa thành phong thái tự tin và hùng biện.
  rationale: Câu này khẳng định thẩm quyền thật của Chúa Giê-su qua sự tương phản với các kinh sư, nhưng không tự giải thích đầy đủ nguồn gốc thần học của thẩm quyền ấy. Bản dịch giữ nguyên sức nặng và độ mở của lời văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” phù hợp lối văn Kinh Thánh tiếng Việt trang nghiêm; “kinh sư” chính xác hơn cách gọi thuần chức năng như “thầy dạy luật”. Câu bắt đầu bằng chữ thường vì γάρ nối và giải thích câu trước.
