  source_fidelity: Bản dịch giữ được γάρ bằng “vì”, đối tượng αὐτούς là “họ”, sự so sánh ὡς ἐξουσίαν ἔχων là “như một người có thẩm quyền”, và sự đối lập với “các kinh sư của họ”. Thì quá khứ đơn “dạy” là cách chuyển tự nhiên, chấp nhận được cho lối diễn đạt tiếp diễn trong quá khứ ἦν ... διδάσκων trong tiếng Việt.
