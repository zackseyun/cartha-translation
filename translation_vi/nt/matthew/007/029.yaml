  terminology: “Thẩm quyền” phản ánh đúng ἐξουσία, tránh hạ nghĩa thành sự tự tin. “Kinh sư” là thuật ngữ phù hợp cho γραμματεῖς trong bối cảnh Tin Mừng. Không diễn giải thêm nguồn gốc thần học của thẩm quyền này.
