  - severity: medium
    issue: “cửa sẽ mở cho anh em” không giữ rõ thể bị động
    rationale: ἀνοιγήσεται là tương lai bị động. Cấu trúc “cửa sẽ mở” trong tiếng Việt dễ được hiểu là cửa tự mở hoặc dùng nội động từ; “cửa sẽ được mở” biểu đạt rõ hơn việc mở mà không nêu tác nhân.
