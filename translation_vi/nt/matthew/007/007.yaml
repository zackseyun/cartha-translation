  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Αἰτεῖτε, καὶ δοθήσεται ὑμῖν· ζητεῖτε, καὶ εὑρήσετε· κρούετε, καὶ ἀνοιγήσεται ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/007.yaml
  text: Ask[a], and it will be given to you; seek, and you will find; knock, and it will be opened to you.
translation:
  language: vi
  text: Hãy xin[a], thì sẽ được ban cho anh em; hãy tìm, thì sẽ tìm được; hãy gõ cửa, thì cửa sẽ được mở cho anh em.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Các động từ mệnh lệnh hiện tại trong tiếng Hy Lạp cũng có thể được hiểu theo nghĩa tiếp diễn: “Hãy cứ xin… hãy cứ tìm… hãy cứ gõ cửa.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Αἰτεῖτε
  choice: Hãy xin
  rationale: Động từ mệnh lệnh hiện tại, ngôi thứ hai số nhiều. “Hãy xin” tự nhiên, giữ nguyên lực mệnh lệnh; sắc thái tiếp diễn được ghi ở chú thích thay vì diễn giải ngay trong câu.
- source_word: δοθήσεται ὑμῖν
  choice: sẽ được ban cho anh em
  rationale: Giữ thể bị động tương lai và không nêu rõ tác nhân ban cho, phù hợp với nguyên văn. “Ban” có sắc thái trang trọng, tự nhiên khi nói về điều được Đức Chúa Trời ban.
- source_word: ζητεῖτε
  choice: hãy tìm
  rationale: Giữ lực mệnh lệnh và phạm vi nghĩa rộng của động từ, có thể dùng theo nghĩa đen hoặc nghĩa bóng.
- source_word: εὑρήσετε
  choice: sẽ gặp
  rationale: Trong cặp diễn đạt tiếng Việt “tìm—gặp”, “gặp” tự nhiên và súc tích, truyền đạt kết quả tìm thấy mà không thêm đối tượng.
- source_word: κρούετε
  choice: hãy gõ cửa
  rationale: Nguyên văn chỉ nói “gõ”, nhưng trong tiếng Việt, “gõ cửa” là cách diễn đạt tự nhiên và làm rõ hình ảnh vốn được vế sau hàm ý.
- source_word: ἀνοιγήσεται ὑμῖν
  choice: cửa sẽ mở cho anh em
  rationale: Truyền đạt thể bị động của nguyên văn bằng cấu trúc bị động tự nhiên trong tiếng Việt, với “cửa” được bổ sung từ hình ảnh gõ cửa; tác nhân mở vẫn không được nêu.
- source_word: καὶ
  choice: thì
  rationale: Trong kết cấu mệnh lệnh—kết quả của tiếng Việt, “thì” diễn đạt tự nhiên quan hệ giữa hai vế. Nó không nhằm thêm điều kiện mới mà thể hiện chức năng liên kết của καί trong ngữ cảnh.
theological_decisions:
- issue: Thể của ba động từ mệnh lệnh hiện tại
  choice: Dùng mệnh lệnh đơn giản “hãy xin… hãy tìm… hãy gõ cửa”, đồng thời ghi sắc thái tiếp diễn khả dĩ trong chú thích.
  alternative: Dịch rõ là “hãy cứ xin… hãy cứ tìm… hãy cứ gõ cửa”.
  rationale: Thì hiện tại trong mệnh lệnh Hy Lạp có thể gợi hành động đang tiếp diễn hoặc bền bỉ, nhưng riêng hình thái này không buộc phải diễn giải thành “cứ tiếp tục”. Cách dịch chính giữ câu tự nhiên và không giải quyết quá mức sắc thái thể.
- issue: Tác nhân trong hai động từ bị động
  choice: 'Giữ tác nhân không được nêu: “được ban” và “sẽ mở”.'
  alternative: Nêu rõ “Đức Chúa Trời sẽ ban” và “Đức Chúa Trời sẽ mở”.
  rationale: Ngữ cảnh có thể hàm ý Đức Chúa Trời là tác nhân, nhưng nguyên văn dùng thể bị động và không gọi đích danh tác nhân; bản dịch không nên bổ sung điều đó vào chính văn.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “anh em” để biểu thị đại từ ngôi thứ hai số nhiều ὑμῖν trong lời Chúa Giê-su nói với các môn đồ và đám đông; nhịp ba vế song song được duy trì.
