  to: Hãy xin[a], thì sẽ được ban cho anh em; hãy tìm, thì sẽ tìm được; hãy gõ cửa, thì cửa sẽ được mở cho anh em.
  rationale: Sửa “sẽ gặp” thành “sẽ tìm được” để phản ánh chính xác hơn εὑρήσετε mà vẫn giữ đối tượng hàm ẩn như nguyên văn. Sửa “cửa sẽ mở” thành “cửa sẽ được mở” để giữ thể bị động của ἀνοιγήσεται và tiếp tục không nêu tác nhân. Các yếu tố còn lại được giữ nguyên, gồm chú thích về sắc thái tiếp diễn khả dĩ của các mệnh lệnh hiện tại.
  reviewer_model: gpt-5.6-terra
