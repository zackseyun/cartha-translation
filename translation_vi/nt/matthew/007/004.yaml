id: MAT.7.4
reference: Matthew 7:4
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἢ πῶς ἐρεῖς τῷ ἀδελφῷ σου· Ἄφες ἐκβάλω τὸ κάρφος ⸀ἐκ τοῦ ὀφθαλμοῦ σου, καὶ ἰδοὺ ἡ δοκὸς ἐν τῷ ὀφθαλμῷ σοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/004.yaml
  text: Or how will you say to your brother[a], ‘Let me take the speck out of your eye,’ and behold[c][b], the beam is in your own eye?
translation:
  language: vi
  text: 'Hay bạn có thể nói với người anh em của mình[a]: “Để tôi lấy cái dằm[b] ra khỏi mắt anh,” mà kìa, cái xà[c] ở trong mắt bạn sao?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn Hy Lạp là “người anh em”; danh từ giống đực số ít này có thể được dùng theo nghĩa đại diện để chỉ một người cùng cộng đồng môn đồ.
    reason: cultural_note
  - marker: b
    text: Từ Hy Lạp κάρφος chỉ một mẩu vật liệu khô nhỏ; cũng có thể dịch là “mảnh rơm” hoặc “mảnh nhỏ”.
    reason: lexical_alternative
  - marker: c
    text: Từ Hy Lạp δοκός chỉ một thanh gỗ lớn, như xà nhà; cũng có thể dịch là “khúc gỗ lớn”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἢ πῶς ἐρεῖς
  choice: Hay sao bạn có thể nói
  rationale: “Hay” nối tiếp lựa chọn tu từ của câu trước; cách diễn đạt “sao bạn có thể nói” chuyển tải tự nhiên sức chất vấn của πῶς cùng dạng tương lai ἐρεῖς trong tiếng Việt.
- source_word: τῷ ἀδελφῷ σου
  choice: với người anh em của mình
  rationale: Giữ hình ảnh quan hệ thân thuộc của ἀδελφός và số ít của nguyên ngữ; “mình” quy chiếu tự nhiên về chủ ngữ “bạn”.
- source_word: Ἄφες ἐκβάλω
  choice: Để tôi lấy ... ra
  rationale: Ἄφες được dùng như lời xin phép, còn ἐκβάλω trong ngữ cảnh lấy vật khỏi mắt được diễn đạt tự nhiên là “lấy ra”.
- source_word: τὸ κάρφος
  choice: cái dằm
  rationale: “Dằm” là một mảnh nhỏ có thể mắc trong mắt và giữ rõ sự tương phản cường điệu với cây xà, dù κάρφος có nghĩa rộng hơn là một mẩu vật liệu khô nhỏ.
- source_word: καὶ ἰδοὺ
  choice: trong khi kìa
  rationale: “Kìa” giữ chức năng thu hút sự chú ý của ἰδού; “trong khi” làm rõ sự tương phản tình huống vốn hàm chứa trong mạch câu mà không xóa hình ảnh đột ngột.
- source_word: ἡ δοκὸς
  choice: cây xà
  rationale: δοκός chỉ một thanh gỗ lớn dùng làm xà; “cây xà” chính xác và tạo đối lập mạnh với “cái dằm”.
- source_word: ἐν τῷ ὀφθαλμῷ σοῦ
  choice: đang ở trong mắt chính bạn
  rationale: Giữ trực tiếp vị trí “trong mắt”; “chính bạn” thể hiện sự đối chiếu nhấn mạnh tự nhiên trong ngữ cảnh.
theological_decisions:
- issue: Phạm vi chỉ người của ἀδελφῷ
  choice: người anh em của mình
  alternative: anh chị em cùng đức tin; người đồng đạo
  rationale: Nguyên ngữ dùng danh từ giống đực số ít trong một tình huống giả định. Bản chính giữ hình thức ấy, còn chú thích cho biết nó có thể mang nghĩa đại diện về một người cùng cộng đồng môn đồ.
- issue: Sự tương phản cường điệu κάρφος / δοκός
  choice: cái dằm / cây xà
  alternative: mẩu rác / khúc gỗ
  rationale: Cặp từ được chọn giữ nguyên sự chênh lệch phi thực tế có chủ ý trong hình ảnh của Chúa Giê-su, không làm nhẹ đi lời phê phán.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Đại từ “bạn” giúp giữ ngôi thứ hai số ít; lời nói trực tiếp dùng “tôi/anh” tự nhiên. Hình ảnh “dằm/cây xà” vừa cụ thể vừa bảo toàn sức cường điệu của nguyên ngữ.
