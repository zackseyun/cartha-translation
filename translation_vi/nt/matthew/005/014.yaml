id: MAT.5.14
reference: Matthew 5:14
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ὑμεῖς ἐστε τὸ φῶς τοῦ κόσμου. οὐ δύναται πόλις κρυβῆναι ἐπάνω ὄρους κειμένη·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/014.yaml
  text: You are the light of the world[a]. A city set on a hill cannot be hidden.
translation:
  language: vi
  text: Chính anh em là ánh sáng của thế gian. Một thành nằm trên núi[a] không thể bị che khuất.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hy Lạp cũng có thể được hiểu là “trên đồi” hoặc “trên vùng đất cao.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὑμεῖς
  choice: Chính anh em
  rationale: Đại từ ngôi thứ hai số nhiều được nêu rõ và mang sắc thái nhấn mạnh trong tiếng Hy Lạp. “Chính anh em” truyền đạt sự nhấn mạnh ấy một cách tự nhiên trong tiếng Việt.
- source_word: τὸ φῶς
  choice: ánh sáng
  rationale: Giữ nguyên ẩn dụ trực tiếp. Trong cấu trúc tiếng Việt “là ánh sáng của thế gian,” không cần dịch riêng mạo từ xác định mà ý nghĩa xác định vẫn rõ.
- source_word: τοῦ κόσμου
  choice: của thế gian
  rationale: Giữ quan hệ sở hữu của sở cách và phạm vi rộng của κόσμος. “Thế gian” là cách nói trang trọng, quen thuộc và vẫn dễ hiểu trong ngữ cảnh này; không diễn giải thành “cho thế gian.”
- source_word: οὐ δύναται
  choice: không thể
  rationale: Cách diễn đạt tự nhiên trong tiếng Việt, bảo toàn ý bất khả.
- source_word: πόλις
  choice: một thành
  rationale: πόλις chỉ một thành phố hoặc đô thị. “Một thành” phù hợp với hình ảnh có tính cách ngôn và văn phong trang trọng hơn “một thành phố” trong câu này.
- source_word: κρυβῆναι
  choice: bị che khuất
  rationale: Dạng nguyên mẫu thụ động được giữ lại. “Bị che khuất” diễn đạt tự nhiên việc một thành không thể khuất khỏi tầm nhìn.
- source_word: ἐπάνω ὄρους
  choice: trên núi
  rationale: Dịch sát địa hình của ὄρος là “núi”; từ này cũng có thể chỉ đồi hoặc vùng đất cao tùy ngữ cảnh, nên ghi nhận phương án ấy trong chú thích.
- source_word: κειμένη
  choice: nằm
  rationale: Phân từ này có nghĩa là nằm hoặc tọa lạc. “Nằm trên núi” tự nhiên, ngắn gọn và không hàm ý thêm rằng thành được ai đó chủ ý đặt ở đó.
theological_decisions:
- issue: Sự đồng nhất mang tính ẩn dụ giữa những người nghe Chúa Giê-su và ánh sáng
  choice: 'Giữ nguyên lời khẳng định trực tiếp: “Chính anh em là ánh sáng của thế gian.”'
  alternative: “Anh em là ánh sáng cho thế gian.”
  rationale: Bản dịch giữ nguyên ẩn dụ và quan hệ sở cách của nguyên văn, không diễn giải vai trò thần học của người nghe hoặc biến “của” thành ý hướng lợi ích “cho”.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Chính anh em” bảo toàn sắc thái nhấn mạnh của đại từ Hy Lạp; “thế gian” duy trì cách diễn đạt Kinh Thánh quen thuộc mà không thêm nội dung giáo phái. Dấu chú thích [a] được đặt ngay sau từ ngữ mà chú thích giải thích.
