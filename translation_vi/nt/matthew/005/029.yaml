revisions:
- from: Nhưng nếu mắt phải của bạn khiến bạn vấp ngã[a], hãy móc nó ra và ném xa khỏi bạn. Vì thà để một bộ phận của bạn mất đi còn hơn để cả thân thể bạn bị ném vào Ghê-hen-na[b].
  to: Nhưng nếu mắt phải của bạn khiến bạn vấp ngã[a], hãy móc nó ra và ném nó đi. Vì thà một phần thân thể bạn mất đi còn hơn cả thân thể bạn bị ném vào Ghê-hen-na[b].
  rationale: 'Chỉ thực hiện các điều chỉnh phong cách an toàn: thay cụm động từ chưa tự nhiên bằng cách nói hiện hành hơn và làm rõ sự đối xứng giữa «một phần thân thể» với «cả thân thể». Các lựa chọn giữ ẩn dụ của σκανδαλίζω, tính mạnh của các mệnh lệnh, và thuật ngữ Ghê-hen-na đều được duy trì.'
