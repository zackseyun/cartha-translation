review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch giữ đầy đủ các yếu tố chính của câu Hy Lạp: mắt phải, hình ảnh «khiến vấp ngã», hai mệnh lệnh mạnh, sự tương phản giữa một phần thân thể mất đi và toàn thân bị ném vào γέεννα. «Móc nó ra» phù hợp với ἔξελε trong ngữ cảnh con mắt; «bị ném vào» phản ánh đúng thể bị động βληθῇ. Tuy nhiên, «ném xa khỏi bạn» là cách kết hợp từ chưa tự nhiên trong tiếng Việt hiện đại.'
  naturalness: «Nhưng», «mắt phải», «khiến bạn vấp ngã», và cấu trúc «thà ... còn hơn ...» đều rõ ràng, phù hợp văn phong trang trọng hiện đại. Đổi «ném xa khỏi bạn» thành «ném nó đi» tạo câu mệnh lệnh tự nhiên hơn, đồng thời vẫn truyền đạt ý loại bỏ/tách khỏi mình của βάλε ἀπὸ σοῦ. «Một phần thân thể» cũng tự nhiên và nhất quán hơn với sự đối chiếu «cả thân thể».
  terminology: Giữ «Ghê-hen-na» là lựa chọn cẩn trọng và trung thành với γέεννα, không đồng nhất hóa sẵn với «địa ngục». Chú thích về nghĩa ngữ cảnh của σκανδαλίζει và cách dịch truyền thống của Ghê-hen-na là thích hợp. Không có vấn đề về tên riêng hay thuật ngữ thần học.
  issues:
  - severity: low
    issue: Cụm «ném xa khỏi bạn» chưa tự nhiên.
    rationale: Trong tiếng Việt hiện đại, «ném nó đi» là lối nói tự nhiên cho hành động vứt bỏ. Trong ngữ cảnh này, hậu tố «đi» truyền đạt thỏa đáng sắc thái tách bỏ của ἀπὸ σοῦ mà không thêm nghĩa «xa» không được biểu thị riêng trong nguyên văn.
  - severity: low
    issue: «Một bộ phận của bạn» có thể gọn và song hành hơn khi diễn đạt là «một phần thân thể bạn».
    rationale: μέλος ở đây là một phần của cơ thể, và «một phần thân thể bạn» tạo thế đối chiếu rõ, tự nhiên với «cả thân thể bạn», không thay đổi nghĩa.
  revised_text: Nhưng nếu mắt phải của bạn khiến bạn vấp ngã[a], hãy móc nó ra và ném nó đi. Vì thà một phần thân thể bạn mất đi còn hơn cả thân thể bạn bị ném vào Ghê-hen-na[b].
