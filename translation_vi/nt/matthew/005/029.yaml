    reason: alternative_reading
  revision_rationale: 'Chỉ thực hiện các điều chỉnh phong cách an toàn: thay cụm động từ chưa tự nhiên bằng cách nói hiện hành hơn và làm rõ sự đối xứng giữa «một phần thân thể» với «cả thân thể». Các lựa chọn giữ ẩn dụ của σκανδαλίζω, tính mạnh của các mệnh lệnh, và thuật ngữ Ghê-hen-na đều được duy trì.'
