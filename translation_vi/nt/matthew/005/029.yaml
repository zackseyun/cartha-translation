id: MAT.5.29
reference: Matthew 5:29
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εἰ δὲ ὁ ὀφθαλμός σου ὁ δεξιὸς σκανδαλίζει σε, ἔξελε αὐτὸν καὶ βάλε ἀπὸ σοῦ, συμφέρει γάρ σοι ἵνα ἀπόληται ἓν τῶν μελῶν σου καὶ μὴ ὅλον τὸ σῶμά σου βληθῇ εἰς γέενναν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/029.yaml
  text: But if your right eye causes you to stumble[a], tear it out and throw it away from you[b]. For it is better for you that one of your members should perish than that your whole body should be thrown into Gehenna.
translation:
  language: vi
  text: Nhưng nếu mắt phải của bạn khiến bạn vấp ngã[a], hãy móc nó ra và ném nó đi. Vì thà một phần thân thể bạn mất đi còn hơn cả thân thể bạn bị ném vào Ghê-hen-na[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “khiến bạn phạm tội.”'
    reason: lexical_alternative
  - marker: b
    text: Ghê-hen-na là dạng Hy Lạp của tên gọi gắn với Thung lũng Hin-nôm; theo truyền thống thường được dịch là “địa ngục.”
    reason: alternative_reading
lexical_decisions:
- source_word: σκανδαλίζει
  choice: khiến bạn vấp ngã
  rationale: Giữ lại hình ảnh vấp ngã trong động từ Hy Lạp, đồng thời chú thích nghĩa theo ngữ cảnh là khiến người ta phạm tội.
- source_word: ἔξελε
  choice: hãy móc nó ra
  rationale: Diễn đạt mệnh lệnh mạnh và hình ảnh quyết liệt của động từ ἐξαιρέω trong ngữ cảnh nói về con mắt.
- source_word: βάλε ἀπὸ σοῦ
  choice: ném xa khỏi bạn
  rationale: Giữ cả sức mạnh của động từ βάλλω và ý tách lìa trong cụm ἀπὸ σοῦ bằng một cách nói tự nhiên trong tiếng Việt.
- source_word: συμφέρει
  choice: thà ... còn hơn
  rationale: Thể hiện tự nhiên ý lợi hơn, tốt hơn cho người nghe trong cấu trúc so sánh của cả câu.
- source_word: ἀπόληται
  choice: mất đi
  rationale: Phù hợp với việc mất một bộ phận cơ thể, vẫn giữ mức độ nghiêm trọng mà không hàm ý quá cụ thể về cách bộ phận ấy bị hủy diệt.
- source_word: ἓν τῶν μελῶν σου
  choice: một bộ phận của bạn
  rationale: Μέλος chỉ một bộ phận thân thể; “bộ phận” bao gồm cả mắt và tự nhiên hơn “chi thể” trong tiếng Việt hiện đại.
- source_word: βληθῇ
  choice: bị ném
  rationale: Phản ánh trực tiếp thể bị động và sức mạnh của βάλλω.
- source_word: γέενναν
  choice: Ghê-hen-na
  rationale: Phiên âm thuật ngữ địa danh-thần học riêng của nguyên văn thay vì lập tức đồng nhất nó với một thuật ngữ thần học khái quát hơn.
- source_word: ὁ δεξιὸς
  choice: mắt phải
  rationale: Giữ nguyên chi tiết “bên phải” được nêu rõ trong bản Hy Lạp.
- source_word: δὲ
  choice: Nhưng
  rationale: Thể hiện sắc thái chuyển tiếp có tính tương phản nhẹ với lời dạy ngay trước đó.
theological_decisions:
- issue: Cách dịch γέεννα
  choice: Ghê-hen-na
  alternative: địa ngục
  rationale: Giữ thuật ngữ riêng trong nguyên văn và các liên hệ lịch sử của nó, tránh tự động đưa toàn bộ nội hàm thần học về sau vào câu; cách dịch truyền thống được ghi trong chú thích.
- issue: Sức gợi hình của σκανδαλίζω
  choice: khiến bạn vấp ngã
  alternative: khiến bạn phạm tội
  rationale: Bản chính giữ ẩn dụ của tiếng Hy Lạp; chú thích nêu rõ nghĩa theo ngữ cảnh mà không thay thế hình ảnh nguyên văn.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “bạn” để giữ ngôi thứ hai số ít của nguyên văn mà không dùng đại từ cổ hoặc mang sắc thái hệ phái; giữ hình ảnh mạnh và cấp bách của câu.
