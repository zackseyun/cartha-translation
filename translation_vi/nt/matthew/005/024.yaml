id: MAT.5.24
reference: Matthew 5:24
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἄφες ἐκεῖ τὸ δῶρόν σου ἔμπροσθεν τοῦ θυσιαστηρίου καὶ ὕπαγε πρῶτον διαλλάγηθι τῷ ἀδελφῷ σου, καὶ τότε ἐλθὼν πρόσφερε τὸ δῶρόν σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/024.yaml
  text: leave your gift there before the altar[a], and go; first be reconciled to your brother[b], and then come and offer your gift.
translation:
  language: vi
  text: Hãy để lễ vật của bạn ở đó, trước bàn thờ; rồi đi, trước hết hãy làm hòa với người anh em của bạn[a], sau đó hãy đến dâng lễ vật của bạn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Người anh em” dịch một danh từ Hy Lạp giống đực số ít; trong ngữ cảnh, nguyên tắc làm hòa có thể áp dụng rộng hơn.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄφες ἐκεῖ
  choice: hãy để ... ở đó
  rationale: Diễn đạt mệnh lệnh để lễ vật lại đúng tại chỗ, giữ rõ ý nghĩa không gian của ἐκεῖ.
- source_word: τὸ δῶρόν σου
  choice: lễ vật của con
  rationale: Trong bối cảnh bàn thờ, δῶρον là vật được đem dâng lên Đức Chúa Trời; “lễ vật” tự nhiên và rõ nghĩa hơn “món quà” trong tiếng Việt.
- source_word: ἔμπροσθεν τοῦ θυσιαστηρίου
  choice: trước bàn thờ
  rationale: Giữ nguyên quan hệ không gian và dùng thuật ngữ quen thuộc cho θυσιαστήριον.
- source_word: ὕπαγε πρῶτον
  choice: rồi đi; trước hết
  rationale: Giữ cả mệnh lệnh đi và sự ưu tiên mà πρῶτον đặt cho việc hòa giải trước khi dâng lễ vật.
- source_word: διαλλάγηθι
  choice: hãy làm hòa
  rationale: Cách nói tự nhiên trong tiếng Việt về việc khôi phục quan hệ. Dù hình thức Hy Lạp là mệnh lệnh thụ động, động từ này trong ngữ cảnh hướng đến việc đi vào tình trạng hòa thuận, không nhất thiết phân định bên nào có lỗi.
- source_word: τῷ ἀδελφῷ σου
  choice: với người anh em của con
  rationale: “Với” diễn đạt tự nhiên quan hệ đi cùng διαλλάγηθι; “người anh em” giữ hình thức giống đực số ít của từ Hy Lạp và vẫn có thể mang nghĩa quan hệ rộng hơn anh em ruột.
- source_word: καὶ τότε ἐλθὼν πρόσφερε
  choice: sau đó hãy trở lại dâng
  rationale: Diễn đạt tự nhiên trình tự của τότε và phân từ ἐλθών. “Trở lại” được ngữ cảnh hàm ý vì lễ vật vẫn để trước bàn thờ, còn πρόσφερε được dịch bằng động từ nghi lễ “dâng”.
theological_decisions:
- issue: Phạm vi nghĩa của ἀδελφός trong lời dạy về quan hệ giữa người với người
  choice: người anh em
  alternative: anh chị em; người khác; người đồng đạo
  rationale: Bản dịch chính giữ giống đực số ít và sắc thái quan hệ của nguyên bản, không tự ý giới hạn thành anh em ruột hay mở rộng thành một nhóm giáo hội cụ thể. Chú thích cho biết nguyên tắc hòa giải có thể được hiểu rộng hơn.
- issue: Sắc thái của mệnh lệnh διαλλάγηθι
  choice: làm hòa với
  alternative: được hòa giải với; hòa giải với
  rationale: “Làm hòa với” là cách diễn đạt hiện đại, tự nhiên và có tính quan hệ, đồng thời tránh biến câu thành một thuật ngữ thần học hoặc hành chính. Cách dịch không quy kết bên nào là người duy nhất gây ra xung đột.
translation_notes:
  register: Văn phong hiện đại, trang trọng nhưng dễ hiểu. Dùng “con” theo lối xưng hô của lời dạy trực tiếp giữa thầy và người nghe; giữ nhịp mệnh lệnh và thứ tự hành động của câu Hy Lạp.
