revisions:
- from: Hãy để lễ vật của con ở đó, trước bàn thờ, rồi đi; trước hết hãy làm hòa với người anh em của con[a], sau đó hãy trở lại dâng lễ vật.
  to: Hãy để lễ vật của bạn ở đó, trước bàn thờ; rồi đi, trước hết hãy làm hòa với người anh em của bạn[a], sau đó hãy đến dâng lễ vật của bạn.
  rationale: Chỉnh đại từ xưng hô để không thêm quan hệ không có trong nguyên bản, và đổi “trở lại” thành “đến” để phản ánh trực tiếp hơn ἐλθών. Các yếu tố còn lại được giữ vì trung thành với tiếng Hy Lạp và tự nhiên trong tiếng Việt hiện đại.
  reviewer_model: gpt-5.6-terra
