  to: 'Cũng có lời dạy rằng: “Ai ly dị vợ mình thì phải cấp cho vợ ấy giấy ly hôn.”[a]'
  rationale: Bản sửa giữ nguyên tính chất lời trích dẫn của quy định, không hàm ý tán thành hay phản đối. Sửa chú thích để phản ánh đúng phổ nghĩa của ἀπολύω, dùng cách diễn đạt hiện đại hơn cho việc cấp văn kiện, và làm gọn dấu trích dẫn.
