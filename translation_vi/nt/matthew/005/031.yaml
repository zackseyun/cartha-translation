base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/031.yaml
  text: But it was said[a], ‘Whoever divorces his wife, let him give her a certificate of divorce.’
translation:
  language: vi
  text: 'Cũng có lời dạy rằng: “Ai ly dị vợ mình thì phải cấp cho vợ ấy giấy ly hôn.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Ai đuổi vợ mình đi ... hãy cấp cho vợ ấy một văn thư ly hôn.” Động từ Hy Lạp có thể mang nghĩa “đuổi đi” hoặc “cho phép đi”; nhưng trong ngữ cảnh pháp lý về hôn nhân ở đây, từ này chỉ việc ly hôn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐρρέθη δέ
  choice: Lại có lời dạy rằng
  rationale: Cách diễn đạt tự nhiên, trang trọng, tiếp nối chuỗi lời trích dẫn trong Ma-thi-ơ 5; δέ được thể hiện bằng “Lại” như một chuyển ý, không cường điệu mức độ đối lập.
- source_word: Ὃς ἂν
  choice: Ai
  rationale: 'Diễn đạt gọn và tự nhiên điều kiện khái quát bất định: bất cứ người nào.'
- source_word: ἀπολύσῃ
  choice: ly dị
  rationale: Trong ngữ cảnh pháp lý hôn nhân và đi cùng ἀποστάσιον, động từ chỉ việc chấm dứt hôn nhân; nghĩa đen rộng hơn là “đuổi/cho đi” được giữ trong chú thích.
- source_word: τὴν γυναῖκα αὐτοῦ
  choice: vợ mình
  rationale: γυνή ở ngữ cảnh này là “vợ”; “mình” quy chiếu tự nhiên về chủ thể “ai” trong tiếng Việt.
- source_word: δότω αὐτῇ
  choice: thì phải trao cho nàng
  rationale: Thể mệnh lệnh ngôi thứ ba được diễn đạt tự nhiên bằng “phải”; “trao” phù hợp với việc cấp một văn kiện, còn “nàng” giữ rõ đối tượng nữ mà không lặp từ “vợ”.
- source_word: ἀποστάσιον
  choice: giấy ly hôn
  rationale: Chỉ văn bản pháp lý xác nhận việc ly hôn; cách gọi này rõ ràng, hiện đại và dễ hiểu.
theological_decisions:
- issue: Quan hệ giữa lời của Chúa Giê-su và quy định ly hôn trong luật Môi-se
  choice: Trình bày câu này như lời trích dẫn một quy định pháp lý, chưa thêm sắc thái tán thành hay phản đối.
  alternative: Diễn giải câu này như một mệnh lệnh trực tiếp xác nhận ly hôn, hoặc chỉ như lời mô tả quan niệm phổ biến.
  rationale: Câu 31 dẫn lại lời mà Chúa Giê-su sẽ bàn đến ở câu kế tiếp; bản dịch không nên giải quyết trước sự căng thẳng thần học của đoạn văn.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “ly dị” trong mệnh đề động từ và “giấy ly hôn” cho văn kiện pháp lý; giữ cấu trúc lời trích dẫn mà không thêm diễn giải giáo lý.
