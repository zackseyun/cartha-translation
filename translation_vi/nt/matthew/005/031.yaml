review_pass:
  verdict: revise
  source_fidelity: Bản nháp truyền đạt đúng cấu trúc trích dẫn pháp lý, chủ thể nam hàm ẩn trong “ai ... vợ mình”, hành động ly dị, và yêu cầu trao văn kiện ly hôn. Tuy nhiên, chú thích gọi nghĩa thay thế của ἀπολύω là “cho đi” không chính xác trong ngữ cảnh này; nghĩa rộng thích hợp là “đuổi đi/bỏ đi” hoặc “cho đi” chỉ khi nói đến việc cho phép rời đi, không phải trao một vật.
  naturalness: “Lại có lời dạy rằng” có thể hiểu được, nhưng “Cũng có lời dạy rằng” tự nhiên hơn trong mạch chuyển tiếp. Dùng dấu ngoặc kép lồng nhau cho toàn câu và lời trích bên trong là không cần thiết; một lời trích sau dấu hai chấm rõ ràng hơn. “Cấp cho vợ ấy giấy ly hôn” tự nhiên và đúng sắc thái văn kiện pháp lý hơn “trao cho nàng”.
  terminology: Giữ “ly dị” cho ἀπολύσῃ và “giấy ly hôn” cho ἀποστάσιον là phù hợp tiếng Việt hiện đại. “Vợ ấy” làm rõ đại từ αὐτῇ mà không dùng “nàng”, vốn có sắc thái văn chương cũ trong văn bản pháp lý.
  issues:
  - severity: medium
    issue: Chú thích giải nghĩa ἀπολύω là “đuổi” hoặc “cho đi”.
    rationale: “Cho đi” trong tiếng Việt thường nghĩa là trao/tặng một vật, không phản ánh nghĩa thay thế “send away/release” của động từ Hy Lạp. Cần thay bằng “đuổi đi” hoặc “bỏ đi” và nêu rõ rằng trong ngữ cảnh pháp lý hôn nhân, động từ chỉ ly dị.
  - severity: low
    issue: Dấu ngoặc kép lồng nhau và cách diễn đạt “trao cho nàng”.
    rationale: Cấu trúc trích dẫn có thể giản lược để phù hợp chính tả tiếng Việt; “cấp cho vợ ấy” rõ hơn, hiện đại hơn, và hợp với một văn kiện pháp lý.
  revised_text: 'Cũng có lời dạy rằng: “Ai ly dị vợ mình thì phải cấp cho vợ ấy giấy ly hôn.”[a]'
