  verdict: revise
  source_fidelity: 'Bản dịch chuyển đạt đúng cấu trúc chính: lời đối lập của Đức Giê-su, chủ thể khái quát là người chồng, hành vi ly dị, mệnh đề ngoại lệ, hệ quả đối với người vợ, và lời khẳng định về người cưới một phụ nữ đã ly dị. Tuy nhiên, cụm “trừ trường hợp có hành vi tình dục vô luân” chưa diễn đạt thật rõ chức năng “lý do/căn cứ” của λόγου, đồng thời “vô luân” rộng hơn bình diện tình dục mà πορνεία chỉ định.'
  naturalness: Câu nhìn chung tự nhiên, trang trọng và phù hợp tiếng Việt hiện đại. “Hành vi tình dục bất chính” tự nhiên và chính xác hơn “hành vi tình dục vô luân”; thêm “vì” làm rõ đây là căn cứ cho việc ly dị. Chú thích b cũng cần đổi cách mở đầu cho tự nhiên hơn.
  terminology: Giữ “ly dị”, “vợ”, và “phạm tội ngoại tình” là phù hợp trong ngữ cảnh hôn nhân. “Hành vi tình dục bất chính” bảo toàn tính khái quát của porneia mà không đồng nhất nó với “ngoại tình” hoặc áp đặt một cách giải thích về phạm vi ngoại lệ.
  issues:
