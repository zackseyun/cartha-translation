reference: Matthew 5:32
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐγὼ δὲ λέγω ὑμῖν ὅτι ⸂πᾶς ὁ ἀπολύων⸃ τὴν γυναῖκα αὐτοῦ παρεκτὸς λόγου πορνείας ποιεῖ αὐτὴν ⸀μοιχευθῆναι, καὶ ὃς ἐὰν ἀπολελυμένην γαμήσῃ μοιχᾶται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/032.yaml
  text: But I say to you that everyone who divorces his wife[a], except on the ground of sexual immorality, makes her commit adultery[b]; and whoever marries a divorced woman commits adultery.
translation:
  language: vi
  text: 'Nhưng tôi nói với anh em: Bất cứ ai ly dị vợ mình, trừ vì hành vi tình dục bất chính[a], thì khiến vợ mình phạm tội ngoại tình[b]; và ai cưới một người phụ nữ đã ly dị thì phạm tội ngoại tình.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hy Lạp porneia là một thuật ngữ rộng, chỉ hành vi tình dục bất chính; cũng có thể dịch là “gian dâm” hoặc “không chung thủy về tình dục.”
    reason: lexical_alternative
  - marker: b
    text: 'Có thể dịch sát hơn: “khiến vợ mình trở thành người ngoại tình”; động từ nguyên mẫu Hy Lạp có hình thức bị động.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπολύων / ἀπολελυμένην
  choice: ly dị / đã ly dị
  rationale: Trong bối cảnh hôn nhân, ἀπολύω mang nghĩa pháp lý-xã hội là ly dị, chứ không chỉ là đuổi đi hay thả ra. Cách dịch này cũng giữ được sự liên hệ giữa hai lần từ này xuất hiện.
- source_word: γυναῖκα
  choice: vợ
  rationale: γυνή có thể là “người phụ nữ” hoặc “vợ”; đại từ sở hữu αὐτοῦ cùng bối cảnh ly dị đòi hỏi nghĩa “vợ” ở lần xuất hiện này.
- source_word: παρεκτὸς λόγου πορνείας
  choice: trừ trường hợp có hành vi tình dục vô luân
  rationale: παρεκτός nêu một ngoại lệ, λόγου chỉ trường hợp hay căn cứ, còn πορνεία là thuật ngữ rộng về hành vi tình dục trái chuẩn mực, không nên thu hẹp chỉ còn ngoại tình.
- source_word: ποιεῖ αὐτὴν μοιχευθῆναι
  choice: khiến vợ mình phạm tội ngoại tình
  rationale: Cấu trúc ποιέω cộng động từ nguyên mẫu diễn tả sự gây khiến. Cách dịch này tự nhiên trong tiếng Việt, trong khi sắc thái bị động hoặc kết quả của μοιχευθῆναι được ghi nhận ở chú thích.
- source_word: ὃς ἐὰν ... γαμήσῃ
  choice: ai cưới
  rationale: Mệnh đề quan hệ đi với ἐάν diễn tả điều kiện tổng quát, nên “ai cưới” vừa gọn vừa tự nhiên.
- source_word: μοιχᾶται
  choice: phạm tội ngoại tình
  rationale: Cụm này diễn đạt tự nhiên hành vi được động từ μοιχάομαι chỉ đến, mà không cố áp đặt sắc thái thể hay thái khó thể hiện trực tiếp trong tiếng Việt.
- source_word: πᾶς ὁ ἀπολύων
  choice: bất cứ ai ly dị
  rationale: Cấu trúc phân từ giống đực số ít có giá trị khái quát. “Bất cứ ai” truyền đạt tính phổ quát, còn “vợ mình” vẫn giữ bối cảnh người chồng được nói đến.
theological_decisions:
- issue: Ý nghĩa của mệnh đề ngoại lệ παρεκτὸς λόγου πορνείας
  choice: 'Dịch như một ngoại lệ thực sự: “trừ trường hợp có hành vi tình dục vô luân.”'
  alternative: “trừ vì sự gian dâm” hoặc hiểu πορνεία là một cuộc hôn nhân bất hợp pháp
  rationale: Cú pháp Hy Lạp nêu rõ một ngoại lệ, nhưng bản dịch không xác định quá mức phạm vi chính xác của πορνεία. Nhờ vậy, bản văn giữ nguyên sự căng thẳng giữa các cách giải thích thần học.
- issue: Sắc thái của μοιχευθῆναι sau ποιεῖ
  choice: Dùng câu tiếng Việt tự nhiên “khiến vợ mình phạm tội ngoại tình” và nêu sắc thái kết quả ở chú thích.
  alternative: “khiến vợ mình trở thành người ngoại tình”
  rationale: Động từ nguyên mẫu có hình thức bị động, nhưng trong ngữ cảnh có thể được hiểu theo nghĩa gây khiến một hành vi hoặc dẫn đến một tình trạng. Chú thích bảo tồn phương án sát hình thức hơn mà không làm câu chính nặng nề.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Anh em” giữ sắc thái lời dạy trực tiếp trước một nhóm người mà không quá khẩu ngữ; “hành vi tình dục vô luân” bảo tồn độ rộng của πορνεία; các chú thích được đặt ngay sau những cụm từ liên quan.
