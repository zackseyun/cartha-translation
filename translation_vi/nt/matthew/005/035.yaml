id: MAT.5.35
reference: Matthew 5:35
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: μήτε ἐν τῇ γῇ, ὅτι ὑποπόδιόν ἐστιν τῶν ποδῶν αὐτοῦ· μήτε εἰς Ἱεροσόλυμα, ὅτι πόλις ἐστὶν τοῦ μεγάλου βασιλέως·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/035.yaml
  text: nor by the earth[a], because it is the footstool of his feet; nor by Jerusalem, because it is the city of the great King[d][c][b];
translation:
  language: vi
  text: cũng đừng lấy trái đất mà thề, vì trái đất là bệ chân của Ngài[b]; cũng đừng lấy Giê-ru-sa-lem mà thề[a], vì đó là thành của Vua vĩ đại[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn dùng giới từ thường có nghĩa “hướng đến” hoặc “vào” trước tên Giê-ru-sa-lem; ở đây giới từ này có thể được dùng theo thành ngữ trong lời thề, với nghĩa “lấy Giê-ru-sa-lem mà thề.”
    reason: lexical_alternative
  - marker: b
    text: 'Lời này gợi đến Ê-sai 66:1: “trái đất là bệ chân Ta.”'
    reason: cross_reference
  - marker: c
    text: Lời này gợi đến Thi Thiên 48:2, nơi Giê-ru-sa-lem được gọi là “thành của Vua vĩ đại.”
    reason: cross_reference
lexical_decisions:
- source_word: μήτε
  choice: cũng đừng
  rationale: Tiếp nối chuỗi điều cấm từ câu trước một cách tự nhiên trong tiếng Việt; cấu trúc này diễn đạt đúng giá trị liên kết phủ định của μήτε.
- source_word: ἐν τῇ γῇ
  choice: lấy đất mà thề
  rationale: Trong ngữ cảnh lời thề, ἐν mang nghĩa phương tiện/đối tượng được viện đến khi thề. Cách nói này tự nhiên trong tiếng Việt và giữ rõ nội dung cấm thề.
- source_word: γῇ
  choice: đất
  rationale: Trong thế đối chiếu với trời và Giê-ru-sa-lem, từ này chỉ trái đất chứ không phải một vùng đất riêng biệt.
- source_word: ὅτι
  choice: vì
  rationale: Diễn đạt quan hệ nguyên nhân trực tiếp và tự nhiên trong tiếng Việt.
- source_word: ὑποπόδιόν ... τῶν ποδῶν αὐτοῦ
  choice: bệ chân của Ngài
  rationale: Diễn đạt gọn, tự nhiên hình ảnh chiếc bệ đặt chân, đồng thời giữ liên hệ với ngôn ngữ Kinh Thánh về quyền tể trị của Đức Chúa Trời.
- source_word: εἰς Ἱεροσόλυμα
  choice: lấy Giê-ru-sa-lem mà thề
  rationale: Trong công thức thề ở đây, εἰς được hiểu theo nghĩa thành ngữ là viện đến Giê-ru-sa-lem để thề. Bản dịch chính ưu tiên ý nghĩa rõ ràng, còn sắc thái hướng của giới từ được ghi ở chú thích.
- source_word: Ἱεροσόλυμα
  choice: Giê-ru-sa-lem
  rationale: Dùng dạng phiên âm quen thuộc trong tiếng Việt hiện đại.
- source_word: πόλις
  choice: thành
  rationale: Phù hợp với ngữ cảnh Giê-ru-sa-lem và giữ sắc thái trang trọng của lời ám chỉ đến Thi Thiên.
- source_word: τοῦ μεγάλου βασιλέως
  choice: của Vua vĩ đại
  rationale: Giữ cấu trúc sở hữu và sắc thái tôn nghiêm của danh hiệu trong nguyên văn, không thêm tên của vị Vua.
theological_decisions:
- issue: Đối tượng của đại từ αὐτοῦ trong cụm “bệ chân của Ngài”
  choice: Dùng “Ngài,” để ngữ cảnh và lời ám chỉ Kinh Thánh cho thấy đối tượng là Đức Chúa Trời mà không chèn danh xưng vào câu.
  alternative: Dịch rõ là “bệ chân của Đức Chúa Trời.”
  rationale: Nguyên văn chỉ dùng đại từ; vì vậy bản dịch giữ hình thức đại từ, trong khi tiếng Việt cần một đại từ tôn kính tự nhiên cho đối tượng được ngữ cảnh xác định là Đức Chúa Trời.
- issue: Đối tượng của danh hiệu “Vua vĩ đại”
  choice: Giữ nguyên danh hiệu “Vua vĩ đại” mà không giải thích ngay trong câu.
  alternative: Dịch diễn giải là “Đức Chúa Trời, Vua vĩ đại.”
  rationale: Cụm Hy Lạp không nêu đích danh Đức Chúa Trời. Việc giữ danh hiệu bảo toàn lời ám chỉ Thi Thiên và không giải quyết thay cho độc giả điều nguyên văn để hàm ẩn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cấu trúc “lấy ... mà thề” làm rõ thành ngữ về lời thề trong cả hai vế; “bệ chân” và “Vua vĩ đại” giữ sắc thái Kinh Thánh của các lời ám chỉ.
