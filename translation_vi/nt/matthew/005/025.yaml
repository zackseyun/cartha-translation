id: MAT.5.25
reference: Matthew 5:25
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἴσθι εὐνοῶν τῷ ἀντιδίκῳ σου ταχὺ ἕως ὅτου εἶ ⸂μετ’ αὐτοῦ ἐν τῇ ὁδῷ⸃, μήποτέ σε παραδῷ ὁ ἀντίδικος τῷ κριτῇ, καὶ ὁ ⸀κριτὴς τῷ ὑπηρέτῃ, καὶ εἰς φυλακὴν βληθήσῃ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/025.yaml
  text: Be well-disposed toward your accuser quickly[a], while you are with him on the way, lest your accuser hand you over to the judge, and the judge to the officer, and you be thrown into prison.
translation:
  language: vi
  text: Hãy mau tỏ thiện chí với người đối tụng của anh[a], khi anh còn cùng người ấy trên đường, kẻo người ấy giao anh cho thẩm phán, thẩm phán giao anh cho người thừa hành, rồi anh bị tống vào tù.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch theo nghĩa thành ngữ trong bối cảnh pháp lý: “Hãy mau dàn xếp với người đối tụng của anh.”'
    reason: Nêu cách hiểu thiên về việc dàn xếp theo ngữ cảnh pháp lý của ἴσθι εὐνοῶν, nhưng chính văn vẫn giữ nghĩa trực tiếp là có thái độ thuận hảo; “người đối tụng” không ấn định vai tố tụng mà ἀντίδικος không nêu rõ.
lexical_decisions:
- source_word: ἴσθι εὐνοῶν
  choice: Hãy ... có thiện chí
  rationale: Cách dịch này giữ nghĩa cốt lõi của εὐνοέω là có thái độ thuận hảo đối với người khác, đồng thời diễn đạt tự nhiên bằng tiếng Việt. Ý dàn xếp pháp lý hợp với ngữ cảnh nhưng được dành cho chú thích để tránh đưa thêm ý vào chính văn.
- source_word: ἀντιδίκῳ / ἀντίδικος
  choice: người kiện anh
  rationale: Trong chuỗi hình ảnh gồm quan tòa, viên chức và nhà tù, từ này chỉ phía đối nghịch trong một vụ kiện. “Người kiện anh” làm rõ sắc thái pháp lý và tự nhiên hơn “đối thủ pháp lý” trong tiếng Việt phổ thông.
- source_word: ταχὺ
  choice: mau
  rationale: “Mau” truyền đạt trực tiếp tính khẩn cấp của mệnh lệnh và kết hợp tự nhiên với “hãy”.
- source_word: ἕως ὅτου εἶ μετ’ αὐτοῦ ἐν τῇ ὁδῷ
  choice: khi anh còn đang cùng người ấy trên đường
  rationale: Giữ nguyên hình ảnh cụ thể về việc hai người đang đi cùng đường, không diễn giải thêm rằng họ đang trên đường đến tòa dù ngữ cảnh gợi điều đó.
- source_word: μήποτέ
  choice: kẻo
  rationale: “Kẻo” diễn đạt tự nhiên sức cảnh báo và hậu quả cần tránh của μήποτε.
- source_word: παραδῷ
  choice: nộp ... cho / giao ... cho
  rationale: 'Hai cách diễn đạt theo từng quan hệ trong chuỗi chuyển giao tư pháp giúp câu tiếng Việt tự nhiên: người kiện nộp bị đơn cho quan tòa, rồi quan tòa giao người ấy cho viên chức.'
- source_word: κριτῇ / κριτὴς
  choice: quan tòa
  rationale: “Quan tòa” là cách gọi rõ ràng, quen thuộc và phù hợp với bối cảnh tư pháp cổ đại.
- source_word: ὑπηρέτῃ
  choice: viên chức
  rationale: Từ này giữ nghĩa rộng về một thuộc viên thi hành lệnh của quan tòa, tránh quy định quá cụ thể chức vụ là thừa phát lại hay cai ngục.
- source_word: εἰς φυλακὴν βληθήσῃ
  choice: bị tống vào tù
  rationale: “Bị tống vào tù” vừa tự nhiên trong tiếng Việt hiện đại vừa giữ được sắc thái mạnh của động từ βάλλω hơn cách nói nhẹ là “bị đưa vào tù”.
theological_decisions:
- issue: Nên dịch mệnh lệnh mở đầu theo nghĩa từ vựng về thái độ thuận hảo hay diễn giải thành việc dàn xếp vụ kiện
  choice: 'Giữ nghĩa từ vựng trong chính văn: “Hãy mau có thiện chí với người kiện anh.”'
  alternative: “Hãy mau dàn xếp với người kiện anh.”
  rationale: Bối cảnh tư pháp khiến ý dàn xếp rất có thể được hàm ý, nhưng εὐνοέω trực tiếp nói đến thái độ thuận hảo. Chính văn giữ nghĩa này, còn chú thích nêu cách hiểu thành ngữ theo ngữ cảnh để bảo toàn độ mở của câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Đại từ số ít “anh” phản ánh lời nói trực tiếp với một cá nhân trong mạch diễn từ. Câu giữ hình ảnh “trên đường” và chuỗi chuyển giao tư pháp của nguyên văn; dấu chú thích [a] xuất hiện ngay sau cụm từ liên quan.
