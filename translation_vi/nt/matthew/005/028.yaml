  source_fidelity: 'Bản dịch truyền đạt đúng các thành tố chính của câu: lời đối lập nhấn mạnh, tính khái quát của πᾶς ὁ βλέπων, γυναῖκα với nghĩa không xác định tình trạng hôn nhân, ý hướng/mục đích của πρὸς τὸ ἐπιθυμῆσαι, tính đã hoàn tất của ἤδη, và bình diện nội tâm của ἐν τῇ καρδίᾳ αὐτοῦ. Tuy nhiên, “nhằm ham muốn nàng” hơi gượng trong tiếng Việt hiện đại; “với ý định ham muốn người ấy” diễn đạt rõ hơn ý chủ tâm mà không thêm nội dung.'
  naturalness: “Các anh em” và đặc biệt đại từ “nàng” tạo giọng văn hơi hẹp/không đều so với tính khái quát của câu. “Anh em”, “ai”, và “người ấy” tự nhiên hơn trong văn phong Kinh Thánh Việt hiện đại. Đặt các ký hiệu chú thích ngay sau từ/cụm từ liên quan cũng làm rõ neo chú thích.
  terminology: Giữ “phụ nữ” cho γυναῖκα và nêu khả năng “vợ” trong chú thích, vì nguyên văn không quyết định rõ. Giữ “ham muốn” trong ngữ cảnh ngoại tình; chú thích bảo lưu cách dịch truyền thống, cụ thể hơn là “thèm muốn”. “Phạm tội ngoại tình với” diễn đạt rõ động từ μοιχεύω và tân ngữ αὐτήν mà không áp đặt cách giải thích hôn nhân cụ thể.
