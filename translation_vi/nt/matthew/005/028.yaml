language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐγὼ δὲ λέγω ὑμῖν ὅτι πᾶς ὁ βλέπων γυναῖκα πρὸς τὸ ἐπιθυμῆσαι αὐτὴν ἤδη ἐμοίχευσεν αὐτὴν ἐν τῇ καρδίᾳ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/028.yaml
  text: But I say to you that everyone who looks at a woman in order to desire her has already committed adultery with her in his heart[a][b][c].
translation:
  language: vi
  text: 'Nhưng tôi nói với anh em rằng: ai nhìn một phụ nữ[a] với ý định ham muốn người ấy[b] thì trong lòng mình đã phạm tội ngoại tình với người ấy rồi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Phụ nữ” cũng có thể dịch là “vợ”; từ Hy Lạp γυνή có cả hai nghĩa, tùy ngữ cảnh.
    reason: lexical_alternative
  - marker: b
    text: 'Hoặc: “nhìn một phụ nữ để thèm muốn người ấy.” Cấu trúc Hy Lạp nhấn mạnh mục đích hoặc chủ ý của cái nhìn.'
    reason: lexical_and_syntactic_alternative
lexical_decisions:
- source_word: ἐγὼ δὲ λέγω ὑμῖν
  choice: Nhưng tôi nói với các anh em
  rationale: Giữ sắc thái tương phản của δέ và sự nhấn mạnh nơi ἐγώ; “các anh em” diễn đạt lời nói trực tiếp với nhóm môn đồ bằng tiếng Việt trang trọng, tự nhiên.
- source_word: πᾶς ὁ βλέπων
  choice: bất cứ ai nhìn
  rationale: Diễn đạt lực khái quát của πᾶς mà không thu hẹp thành một giới tính được nêu rõ hơn nguyên văn.
- source_word: γυναῖκα
  choice: một người phụ nữ
  rationale: γυνή có thể là “phụ nữ” hoặc “vợ”; câu nói khái quát không xác định rõ tình trạng hôn nhân, nên chọn nghĩa rộng hơn và ghi chú nghĩa kia.
- source_word: πρὸς τὸ ἐπιθυμῆσαι αὐτὴν
  choice: nhằm ham muốn nàng
  rationale: “Nhằm” giữ ý mục đích/chủ ý của πρὸς τό với động từ nguyên mẫu; “ham muốn” truyền đạt ἐπιθυμέω trong ngữ cảnh dục vọng sai trái mà không dùng cách nói quá thô.
- source_word: ἤδη ἐμοίχευσεν αὐτὴν
  choice: đã phạm tội ngoại tình với nàng rồi
  rationale: “Đã… rồi” thể hiện ἤδη tự nhiên trong tiếng Việt; “phạm tội ngoại tình với” là cách diễn đạt rõ nghĩa của μοιχεύω với tân ngữ.
- source_word: ἐν τῇ καρδίᾳ αὐτοῦ
  choice: trong lòng mình
  rationale: Giữ hình ảnh Kinh Thánh về καρδία như nội tâm, đồng thời dùng đại từ phản thân tự nhiên để quy chiếu về chủ thể.
theological_decisions:
- issue: γυνή nên được hiểu là “người phụ nữ” hay “vợ” trong ngữ cảnh ngoại tình
  choice: người phụ nữ
  alternative: vợ hoặc người phụ nữ đã có chồng
  rationale: Nguyên văn không đánh dấu rõ tình trạng hôn nhân. Bản chính giữ phạm vi từ vựng rộng, còn chú thích bảo tồn khả năng hiểu hẹp hơn do ngữ cảnh ngoại tình.
- issue: ἐπιθυμέω nên dịch bằng từ trung tính “mong muốn” hay từ mang sắc thái dục vọng “ham muốn”
  choice: ham muốn
  alternative: thèm muốn; nuôi dục vọng đối với
  rationale: Động từ tự nó có phạm vi rộng, nhưng trong câu này đối tượng và ngôn ngữ ngoại tình xác định ham muốn tình dục sai trái. “Ham muốn” vừa tự nhiên vừa không làm mất ý chủ tâm của cấu trúc mục đích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “tôi” phù hợp với lời dạy trực tiếp của Chúa Giê-su; “nàng” giúp tránh lặp “người phụ nữ” và giữ giọng văn trang nhã. Dấu hai chấm làm rõ phần mệnh đề được phát biểu.
