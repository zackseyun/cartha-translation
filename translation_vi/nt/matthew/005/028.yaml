  to: 'Nhưng tôi nói với anh em rằng: ai nhìn một phụ nữ[a] với ý định ham muốn người ấy[b] thì trong lòng mình đã phạm tội ngoại tình với người ấy rồi.'
  rationale: Chỉnh sửa chỉ nhằm làm cho cách diễn đạt tiếng Việt hiện đại hơn và đặt neo chú thích chính xác hơn. “Với ý định ham muốn” bảo toàn sắc thái mục đích/chủ ý của πρὸς τὸ ἐπιθυμῆσαι; “người ấy” tránh sắc thái cổ của “nàng” và vẫn quy chiếu rõ đến người phụ nữ. Không thu hẹp γυναῖκα thành “vợ” trong bản văn chính.
