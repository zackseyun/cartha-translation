    issue: Đại từ “mình” trong “những người yêu mình” mơ hồ.
    rationale: Trong tiếng Việt, “mình” có thể có cách hiểu phản thân hoặc thân mật tùy ngữ cảnh. Nguồn Hy Lạp nói rõ “những người yêu anh em” (τοὺς ἀγαπῶντας ὑμᾶς); lặp lại “anh em” bảo đảm rõ đối tượng mà không đổi nghĩa.
