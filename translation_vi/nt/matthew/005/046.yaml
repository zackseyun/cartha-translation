id: MAT.5.46
reference: Matthew 5:46
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐὰν γὰρ ἀγαπήσητε τοὺς ἀγαπῶντας ὑμᾶς, τίνα μισθὸν ἔχετε; οὐχὶ καὶ οἱ τελῶναι ⸂τὸ αὐτὸ⸃ ποιοῦσιν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/046.yaml
  text: For if you love those who love you[a], what reward do you have? Do not even the tax collectors do the same?
translation:
  language: vi
  text: Vì nếu anh em yêu những người yêu anh em, thì anh em có phần thưởng nào? Chẳng phải ngay cả những người thu thuế cũng làm như thế sao?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐὰν γὰρ
  choice: Vì nếu
  rationale: “Vì” giữ chức năng nối kết, giải thích của γάρ với lời dạy ngay trước đó; “nếu” diễn đạt điều kiện do ἐάν đưa vào.
- source_word: ἀγαπήσητε
  choice: anh em yêu
  rationale: Động từ giả định quá khứ sau ἐάν tạo một điều kiện khái quát; thì hiện tại trong tiếng Việt diễn đạt tự nhiên mà không nhấn quá mức thể của động từ Hy Lạp.
- source_word: τοὺς ἀγαπῶντας ὑμᾶς
  choice: những người yêu mình
  rationale: Phân từ được dùng như danh từ, chỉ nhóm người được xác định bởi việc họ yêu người nghe. “Mình” quy chiếu tự nhiên về “anh em” trong mệnh đề này.
- source_word: τίνα μισθὸν ἔχετε
  choice: anh em có phần thưởng gì
  rationale: μισθός có thể là tiền công hoặc phần thưởng. Trong mạch lời dạy đạo đức này, “phần thưởng” tự nhiên hơn và không tự động hàm ý một cơ chế lập công.
- source_word: οὐχὶ
  choice: Chẳng phải ... sao?
  rationale: οὐχί mở đầu câu hỏi tu từ chờ câu trả lời khẳng định; cấu trúc “Chẳng phải ... sao?” truyền đạt đúng lực tu từ trong tiếng Việt.
- source_word: καὶ
  choice: ngay cả ... cũng
  rationale: καί mang sắc thái nhấn mạnh ở đây, làm nổi bật sự so sánh với những người thu thuế.
- source_word: οἱ τελῶναι
  choice: những người thu thuế
  rationale: Cách gọi rõ ràng, quen thuộc trong tiếng Việt hiện đại cho những người thu thuế hoặc thu phí trong bối cảnh Tin Mừng.
- source_word: τὸ αὐτὸ ποιοῦσιν
  choice: làm như thế
  rationale: Diễn đạt tự nhiên trong tiếng Việt ý “làm cùng một điều”, tức cũng yêu những người yêu họ.
theological_decisions:
- issue: Ý nghĩa của μισθός trong lời dạy đạo đức của Chúa Giê-su
  choice: phần thưởng
  alternative: tiền công; sự báo đáp
  rationale: “Phần thưởng” giữ được ý về sự đền đáp trong ngữ cảnh mà không áp đặt một học thuyết máy móc về công trạng; chú thích vẫn bảo lưu khả năng từ vựng “tiền công”.
translation_notes:
  register: Văn phong hiện đại, trang trọng nhưng dễ hiểu. Đại từ “anh em” diễn đạt số nhiều ὑμεῖς và phù hợp với lời Chúa Giê-su nói trực tiếp với người nghe, tránh sắc thái cổ của “các ngươi”. Câu hỏi tu từ được giữ nguyên.
