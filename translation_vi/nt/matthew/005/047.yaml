id: MAT.5.47
reference: Matthew 5:47
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἐὰν ἀσπάσησθε τοὺς ⸀ἀδελφοὺς ὑμῶν μόνον, τί περισσὸν ποιεῖτε; οὐχὶ καὶ οἱ ⸀ἐθνικοὶ ⸂τὸ αὐτὸ⸃ ποιοῦσιν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/047.yaml
  text: And if you greet only your brothers[c][b][a], what are you doing that is extraordinary? Do not even the Gentiles do the same?
translation:
  language: vi
  text: Và nếu anh em chỉ chào hỏi anh em mình[a], thì anh em làm điều gì đặc biệt hơn[b]? Chẳng phải dân ngoại[c] cũng làm như vậy sao?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Anh em mình” cũng có thể chỉ rộng hơn đến anh chị em hoặc những người thuộc cùng nhóm với mình.
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “anh em làm điều gì khác thường?” hoặc “anh em làm điều gì hơn?”'
    reason: lexical_alternative
  - marker: c
    text: Tức là những người không thuộc dân Do Thái; cũng có thể dịch là “người ngoại đạo”.
    reason: lexical_clarification
lexical_decisions:
- source_word: ἀσπάσησθε
  choice: chào hỏi
  rationale: Động từ chỉ hành động cất lời chào hay thăm hỏi; “chào hỏi” tự nhiên trong tiếng Việt và không diễn giải quá mức thành tiếp đón hoặc bày tỏ lòng hiếu khách.
- source_word: ἀδελφοὺς ὑμῶν
  choice: những người anh em của mình
  rationale: Giữ hình thức nam số nhiều của tiếng Hy Lạp, đồng thời cụm “của mình” diễn đạt quan hệ với nhóm người được Chúa Giê-su nói trực tiếp.
- source_word: μόνον
  choice: chỉ
  rationale: Diễn đạt rõ sự giới hạn hành động chào hỏi vào một nhóm nhất định.
- source_word: τί περισσὸν ποιεῖτε
  choice: anh em có làm điều gì vượt hơn người khác?
  rationale: περισσόν nói đến điều vượt mức thông thường hoặc vượt hơn người khác. Cách diễn đạt này giữ sức nặng so sánh của câu hỏi tu từ mà vẫn tự nhiên trong tiếng Việt.
- source_word: ἐθνικοὶ
  choice: dân ngoại
  rationale: Trong bối cảnh Do Thái, từ này chủ yếu chỉ những người không thuộc dân Do Thái. “Dân ngoại” giữ nét tương phản dân tộc-giao ước mà không tăng sắc thái phê phán tôn giáo như “người ngoại đạo”.
- source_word: τὸ αὐτό
  choice: như vậy
  rationale: Trong cấu trúc “làm như vậy”, tiếng Việt diễn đạt tự nhiên ý “làm cùng một điều” của cụm Hy Lạp.
theological_decisions:
- issue: Phạm vi nghĩa của ἀδελφοὺς trong lời dạy đạo đức
  choice: Giữ “những người anh em” trong chính văn.
  alternative: “anh chị em” hoặc “người trong nhóm mình”
  rationale: Danh từ Hy Lạp ở giống đực số nhiều, nhưng trong ngữ cảnh có thể chỉ rộng hơn đến những người thuộc cùng cộng đồng. Chính văn giữ hình thức của nguyên bản, còn chú thích bảo lưu phạm vi nghĩa rộng hơn.
- issue: Ý nghĩa của ἐθνικοὶ
  choice: Dịch là “dân ngoại”.
  alternative: “người ngoại đạo” hoặc “các dân”
  rationale: Từ này trước hết chỉ người không phải Do Thái. “Dân ngoại” bảo toàn sự tương phản trong bối cảnh Do Thái mà không mặc nhiên gán một phán đoán tôn giáo mạnh hơn nguyên văn.
- issue: Sắc thái của περισσόν
  choice: Dịch là “vượt hơn người khác”.
  alternative: “khác thường” hoặc “hơn nữa”
  rationale: Cách dịch được chọn giữ cả ý vượt quá mức thông thường lẫn phép so sánh ngầm với cách cư xử của những người khác, nhưng không xác định quá chặt điều mà nguyên văn để hàm ẩn.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Đại từ “anh em” phù hợp với lời Chúa Giê-su nói với các môn đồ, nhưng việc lặp lại trong “những người anh em của mình” giúp phân biệt đối tượng được chào hỏi. Các câu hỏi tu từ được giữ nguyên sức chất vấn của nguyên bản.
