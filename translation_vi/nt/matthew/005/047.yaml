revisions:
- from: Và nếu anh em chỉ chào hỏi những người anh em của mình[a], thì anh em có làm điều gì vượt hơn người khác[b]? Chẳng phải dân ngoại[c] cũng làm như vậy sao?
  to: Và nếu anh em chỉ chào hỏi anh em mình[a], thì anh em làm điều gì đặc biệt hơn[b]? Chẳng phải dân ngoại[c] cũng làm như vậy sao?
  rationale: Sửa cách diễn đạt về περισσόν để tránh thêm rõ “người khác” vào chính văn, và đơn giản hóa “những người anh em của mình” thành “anh em mình” cho tự nhiên hơn. Giữ “dân ngoại” và các câu hỏi tu từ, bảo lưu các khả năng nghĩa trong chú thích.
  reviewer_model: gpt-5.6-terra
