  terminology: “Dân ngoại” là lựa chọn phù hợp cho ἐθνικοί trong ngữ cảnh Do Thái và tránh sắc thái phán xét mạnh hơn của “người ngoại đạo”. “Chào hỏi” phù hợp với ἀσπάσησθε.
