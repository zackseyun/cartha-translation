id: MAT.5.13
reference: Matthew 5:13
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ὑμεῖς ἐστε τὸ ἅλας τῆς γῆς· ἐὰν δὲ τὸ ἅλας μωρανθῇ, ἐν τίνι ἁλισθήσεται; εἰς οὐδὲν ἰσχύει ἔτι εἰ μὴ ⸂βληθὲν ἔξω⸃ καταπατεῖσθαι ὑπὸ τῶν ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/013.yaml
  text: You are the salt of the earth. But if the salt becomes tasteless[a], with what will it be made salty? It is no longer good for anything except to be thrown out and trampled underfoot by men.
translation:
  language: vi
  text: Chính anh em là muối của đất. Nhưng nếu muối mất vị mặn[a] thì lấy gì làm cho nó mặn lại? Nó không còn dùng được vào việc gì nữa, ngoài việc bị ném ra ngoài cho người ta giẫm đạp.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Động từ Hy Lạp cũng có thể mang nghĩa “trở nên ngu dại”; khi nói về muối ở đây, nó có nghĩa là mất vị mặn.
    reason: Giữ lại lối chơi nghĩa có thể được nghe thấy trong từ μωρανθῇ mà không làm câu chính trở nên khó hiểu.
lexical_decisions:
- source_word: Ὑμεῖς
  choice: Chính anh em
  rationale: Đại từ được nêu rõ trong tiếng Hy Lạp mang sắc thái nhấn mạnh. “Chính anh em” truyền đạt sự nhấn mạnh ấy và cho thấy lời này được nói với nhiều người.
- source_word: τὸ ἅλας τῆς γῆς
  choice: muối của đất
  rationale: γῆ có thể chỉ đất, xứ sở hoặc trái đất. “Đất” giữ nguyên hình ảnh rộng và cụ thể của câu Hy Lạp mà không diễn giải thành “thế gian”.
- source_word: μωρανθῇ
  choice: mất vị mặn
  rationale: Khi dùng cho muối, động từ này chỉ việc trở nên nhạt, mất đặc tính mặn. Cách dịch này tự nhiên trong tiếng Việt và giữ rõ hình ảnh của muối; nghĩa liên hệ “trở nên ngu dại” được ghi ở chú thích.
- source_word: ἐν τίνι ἁλισθήσεται;
  choice: thì lấy gì làm cho nó mặn lại?
  rationale: Câu hỏi Hy Lạp dùng thể bị động và hỏi bằng phương tiện nào muối có thể được làm mặn. Cách diễn đạt này tự nhiên mà vẫn giữ câu hỏi về phương tiện.
- source_word: εἰς οὐδὲν ἰσχύει ἔτι
  choice: Nó không còn dùng được vào việc gì nữa
  rationale: Trong ngữ cảnh, ἰσχύει nói đến công dụng hoặc hiệu lực thực tế, không phải sức mạnh thể chất.
- source_word: εἰ μὴ βληθὲν ἔξω
  choice: ngoài việc bị ném ra ngoài
  rationale: Giữ cả ý bị ném đi và sắc thái không gian của ἔξω.
- source_word: καταπατεῖσθαι ὑπὸ τῶν ἀνθρώπων
  choice: cho người ta giẫm đạp
  rationale: “Giẫm đạp” truyền đạt hình ảnh bị chà đạp dưới chân; “người ta” là cách nói tự nhiên, có nghĩa chung về con người, đúng với ἀνθρώπων trong ngữ cảnh.
theological_decisions:
- issue: Phạm vi của hình ảnh “muối của đất”
  choice: Giữ nguyên “đất” và không giải nghĩa ẩn dụ trong chính câu dịch
  alternative: muối của thế gian
  rationale: γῆ có phạm vi nghĩa rộng, và câu không tự giải thích đầy đủ chức năng tượng trưng của muối. Giữ hình ảnh nguyên dạng tránh thu hẹp hoặc áp đặt một cách hiểu thần học riêng.
- issue: Tính khái quát của ὑπὸ τῶν ἀνθρώπων
  choice: cho người ta giẫm đạp
  alternative: cho loài người giẫm đạp
  rationale: ἀνθρώπων ở đây chỉ con người nói chung chứ không riêng nam giới. Tiếng Việt không cần dùng một hình thức giống đực đại diện để bảo toàn nghĩa nguồn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh em” cho số nhiều được Chúa Giê-su trực tiếp nói đến; “chính” thể hiện sự nhấn mạnh của đại từ Hy Lạp. Cấu trúc câu cuối giữ hình ảnh cụ thể, tránh thêm ý đánh giá như “chỉ đáng bị”.
