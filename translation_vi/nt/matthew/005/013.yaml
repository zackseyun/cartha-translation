  terminology: “Muối của đất” là cách dùng quen thuộc, phù hợp văn phong Kinh Thánh tiếng Việt và không thu hẹp nghĩa của γῆ thành một cách giải thích riêng. “Mất vị mặn” và “giẫm đạp” chính xác, dễ hiểu. Chú thích a đặt đúng chỗ và nêu được liên hệ nghĩa của μωρανθῇ mà không áp đặt lối chơi chữ vào bản văn chính.
