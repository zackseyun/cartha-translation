id: MAT.5.20
reference: Matthew 5:20
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: λέγω γὰρ ὑμῖν ὅτι ἐὰν μὴ περισσεύσῃ ⸂ὑμῶν ἡ δικαιοσύνη⸃ πλεῖον τῶν γραμματέων καὶ Φαρισαίων, οὐ μὴ εἰσέλθητε εἰς τὴν βασιλείαν τῶν οὐρανῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/020.yaml
  text: For I tell you that unless your righteousness exceeds that of the scribes and Pharisees[a], you will certainly not enter the kingdom of heaven.
translation:
  language: vi
  text: Vì tôi nói với anh em rằng, nếu sự công chính[a] của anh em không vượt hơn sự công chính của các kinh sư và người Pha-ri-si, thì anh em nhất định sẽ không vào Nước Trời.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “sự công lý”. Từ Hy Lạp có thể chỉ cả sự công chính lẫn công lý; trong văn cảnh Ma-thi-ơ 5, “sự công chính” phù hợp hơn.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω γὰρ ὑμῖν
  choice: Vì tôi nói với anh em
  rationale: “Vì” giữ chức năng giải thích của γάρ; “tôi nói với anh em” chuyển tải trực tiếp ngôi thứ nhất và lời nói với số nhiều bằng tiếng Việt hiện đại, trang trọng vừa phải.
- source_word: ἐὰν μὴ
  choice: nếu ... không
  rationale: Cấu trúc này diễn đạt rõ điều kiện phủ định trong tiếng Việt; trong câu đầy đủ, “nếu ... không ... thì” tự nhiên hơn cách dùng “trừ khi” với mệnh đề dài.
- source_word: περισσεύσῃ ... πλεῖον
  choice: vượt hơn
  rationale: Cách nói ngắn gọn, tự nhiên, giữ ý sự công chính phải lớn hơn về mức độ hoặc phẩm chất.
- source_word: ὑμῶν ἡ δικαιοσύνη
  choice: sự công chính của anh em
  rationale: “Sự công chính” phù hợp nhất với văn cảnh Ma-thi-ơ 5 về đời sống đúng đắn trước mặt Đức Chúa Trời, đồng thời không thu hẹp từ này chỉ còn nghĩa pháp lý hay xã hội.
- source_word: τῶν γραμματέων καὶ Φαρισαίων
  choice: sự công chính của các kinh sư và người Pha-ri-si
  rationale: Tiếng Hy Lạp lược bỏ danh từ được so sánh; lặp lại “sự công chính” trong tiếng Việt giúp tránh hiểu rằng chính các môn đồ được đem so trực tiếp với những người này. “Kinh sư” chỉ các chuyên gia Kinh Luật, còn “Pha-ri-si” là tên nhóm được phiên âm.
- source_word: οὐ μὴ εἰσέλθητε
  choice: nhất định sẽ không được vào
  rationale: “Nhất định ... không” giữ sức nhấn mạnh của οὐ μή. “Được vào” là cách nói tiếng Việt tự nhiên về việc được tiếp nhận vào một vương quốc, mà không xác định thêm tác nhân.
- source_word: τὴν βασιλείαν τῶν οὐρανῶν
  choice: vương quốc thiên đàng
  rationale: Giữ hình ảnh về quyền trị vì và vương quốc trong βασιλεία, đồng thời phản ánh thành ngữ đặc trưng của Ma-thi-ơ mà không diễn giải thành một địa điểm thuần túy.
theological_decisions:
- issue: Cách dịch δικαιοσύνη trong văn cảnh Ma-thi-ơ
  choice: sự công chính
  alternative: sự công lý
  rationale: Trong câu này, từ ngữ bao quát phẩm chất và cách sống đúng đắn trước mặt Đức Chúa Trời, được đặt trong tương quan với kinh sư và người Pha-ri-si. “Sự công chính” giữ phạm vi đó tốt hơn; “sự công lý” là khả năng từ vựng có thật nhưng dễ bị hiểu chủ yếu theo nghĩa công bằng xã hội hoặc tư pháp.
- issue: Đối tượng được so sánh trong πλεῖον τῶν γραμματέων καὶ Φαρισαίων
  choice: sự công chính của anh em vượt hơn sự công chính của họ
  alternative: sự công chính của anh em vượt hơn các kinh sư và người Pha-ri-si
  rationale: Ngữ pháp Hy Lạp có tính tỉnh lược, nhưng văn cảnh cho thấy phẩm chất công chính được so sánh. Bổ sung danh từ trong tiếng Việt làm rõ cú pháp mà không xác định sự “vượt hơn” ấy theo một hệ thần học riêng.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, sáng rõ và trang nghiêm nhưng không cổ kính. Dùng “anh em” cho nhóm người được Chúa Giê-su trực tiếp dạy bảo; dùng “kinh sư” là thuật ngữ ngắn gọn, dễ hiểu hơn lối phiên âm “thầy thông giáo”. Câu giữ nguyên sức nhấn mạnh của lời cảnh báo.
