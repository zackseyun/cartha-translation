revisions:
- from: Còn nếu ai muốn kiện anh em[a] để lấy áo trong[b] của anh em, hãy để người ấy lấy luôn cả áo ngoài.
  to: Còn ai muốn kiện anh em[a] để lấy áo trong[b] của anh em thì hãy để người ấy lấy cả áo ngoài nữa.
  rationale: Bản sửa chỉ bỏ “nếu,” vốn không được biểu thị trong nguyên văn, và dùng cấu trúc khái quát tự nhiên “ai muốn ... thì ...”. Các lựa chọn còn lại được giữ nguyên vì phản ánh chính xác nghĩa pháp lý, mệnh lệnh nhường thêm, và sự đối lập giữa hai loại áo.
  reviewer_model: gpt-5.6-terra
