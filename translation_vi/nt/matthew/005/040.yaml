review_pass:
  verdict: revise
  source_fidelity: 'Bản nháp truyền đạt đúng bối cảnh kiện tụng, sự phân biệt giữa χιτών (áo trong) và ἱμάτιον (áo ngoài), cùng mệnh lệnh nhường thêm áo ngoài. Tuy nhiên, “Còn nếu ai” thêm một cấu trúc điều kiện rõ hơn nguyên văn: τῷ θέλοντι là “người muốn/ai muốn” dùng như một danh ngữ khái quát, không có εἰ (“nếu”).'
  naturalness: “Anh em,” “kiện,” “áo trong,” và “áo ngoài” đều tự nhiên, dễ hiểu trong tiếng Việt Kinh Thánh hiện đại. Đổi “Còn nếu ai muốn ...” thành “Còn ai muốn ... thì ...” vừa mạch lạc vừa tránh thêm sắc thái điều kiện không cần thiết.
  terminology: “Kiện anh em” phù hợp với ngữ cảnh pháp lý của σοι κριθῆναι; chú thích có thể nêu phương án “đưa anh em ra tòa.” “Áo trong/áo ngoài” giữ được đối lập thuật ngữ và được chú thích văn hóa đầy đủ.
  issues:
  - severity: low
    issue: “Còn nếu ai muốn” thêm từ “nếu” không hiện diện trong câu Hy Lạp.
    rationale: Cấu trúc τῷ θέλοντι là phân từ có mạo từ, chỉ chung “người muốn/ai muốn.” Dù câu điều kiện nghe tự nhiên, có thể dịch trực tiếp hơn mà vẫn tự nhiên bằng “Còn ai muốn ... thì ...”.
