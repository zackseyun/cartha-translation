  text: καὶ τῷ θέλοντί σοι κριθῆναι καὶ τὸν χιτῶνά σου λαβεῖν, ἄφες αὐτῷ καὶ τὸ ἱμάτιον·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/040.yaml
  text: And to the one who wants to sue you and take your tunic[b][a], let him have your cloak also.
translation:
  language: vi
  text: Còn ai muốn kiện anh em[a] để lấy áo trong[b] của anh em thì hãy để người ấy lấy cả áo ngoài nữa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đưa anh em ra tòa.” Từ Hy Lạp theo nghĩa đen nói đến việc bị xét xử trong một bối cảnh pháp lý.'
    reason: lexical_alternative
  - marker: b
    text: “Áo trong” là lớp áo mặc sát người hơn; “áo ngoài” là lớp áo khoác bên ngoài.
    reason: cultural_note
lexical_decisions:
- source_word: τῷ θέλοντί
  choice: nếu ai muốn
  rationale: Phân từ có mạo từ chỉ một người bất kỳ; cách diễn đạt này tự nhiên trong tiếng Việt và giữ nguyên ý muốn chủ động của θέλω.
- source_word: σοι κριθῆναι
  choice: kiện anh em
  rationale: Trong ngữ cảnh tranh chấp nhằm lấy áo, động từ chỉ việc đưa một người vào quá trình xét xử; “kiện” diễn đạt ngắn gọn và đúng sắc thái pháp lý, còn cách dịch sát hơn được ghi ở chú thích.
- source_word: χιτῶνά
  choice: áo trong
  rationale: χιτών là loại áo mặc phía trong, đối lập với ἱμάτιον là áo khoác ngoài; “áo trong” rõ nghĩa hơn từ vay mượn chỉ trang phục cổ.
- source_word: λαβεῖν
  choice: lấy
  rationale: Động từ ở đây nói đến việc giành hoặc nhận quyền sở hữu chiếc áo trong vụ kiện; “lấy” giữ được nghĩa rộng của từ Hy Lạp.
- source_word: ἄφες
  choice: hãy để người ấy lấy
  rationale: Mệnh lệnh của ἀφίημι ở đây mang nghĩa nhường lại hoặc cho phép người kia có vật ấy; cách dịch này tự nhiên mà vẫn giữ lực mệnh lệnh.
- source_word: ἱμάτιον
  choice: áo ngoài
  rationale: ἱμάτιον là lớp áo khoác bên ngoài, tạo thế đối lập cụ thể với χιτών; “áo ngoài” dễ hiểu và phù hợp bối cảnh cổ đại.
- source_word: καὶ ... καὶ
  choice: Còn ... luôn cả
  rationale: Từ καί đầu nối lời dạy này với phần trước, còn καί thứ hai nhấn mạnh việc nhường thêm áo ngoài; “luôn cả” thể hiện rõ sức nặng tăng tiến ấy.
theological_decisions:
- issue: Sức nặng đạo đức trong lời dạy của Đức Giê-su về tranh chấp pháp lý
  choice: Giữ nguyên mệnh lệnh trực tiếp về sự nhường nhịn triệt để, không trả đũa.
  alternative: Diễn đạt lỏng thành một nguyên tắc chung về việc từ bỏ quyền lợi.
  rationale: Mệnh lệnh ἄφες cùng hình ảnh cụ thể về hai lớp áo tạo nên một lời truyền dạy sắc bén trong hoàn cảnh pháp lý-xã hội. Bản dịch không làm nhẹ lời ấy thành ý niệm trừu tượng, cũng không áp đặt một hệ thống giáo phái.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “anh em” theo lối xưng hô cộng đồng quen thuộc trong lời dạy Kinh Thánh; dùng “áo trong/áo ngoài” để người đọc hiện đại nhận ra ngay sự tương phản giữa hai lớp trang phục.
