id: MAT.5.3
reference: Matthew 5:3
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Μακάριοι οἱ πτωχοὶ τῷ πνεύματι, ὅτι αὐτῶν ἐστιν ἡ βασιλεία τῶν οὐρανῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/003.yaml
  text: Blessed are the poor in spirit[c][b][a], because the kingdom of heaven is theirs.
translation:
  language: vi
  text: “Phước[a] cho những người nghèo khó trong tâm linh[b], vì vương quốc thiên đàng[c] thuộc về họ.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “hạnh phúc” hoặc “thật có phước”; từ Hy Lạp chỉ tình trạng đáng ước ao của người được Đức Chúa Trời ban ơn, không chỉ là cảm giác vui vẻ.
    reason: lexical_alternative
  - marker: b
    text: “Nghèo khó trong tâm linh” cũng có thể được hiểu là “nghèo khó về phương diện thuộc linh” hoặc “những người nhận biết nhu cầu tâm linh của mình.” Bản dịch giữ cách nói của tiếng Hy Lạp mà không thu hẹp ý nghĩa.
    reason: alternative_reading
  - marker: c
    text: Nguyên văn là “vương quốc của các tầng trời,” một cách nói đặc trưng của Ma-thi-ơ, thường được dịch là “vương quốc thiên đàng.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Μακάριοι
  choice: Phước cho
  rationale: Cách diễn đạt quen thuộc trong các lời chúc phước, chỉ tình trạng đáng ước ao của người được Đức Chúa Trời ban ơn, chứ không chỉ một cảm xúc vui vẻ chủ quan.
- source_word: οἱ πτωχοὶ
  choice: những người nghèo khó
  rationale: Giữ nghĩa thực về sự nghèo túng của πτωχός và chức năng danh từ của cụm có mạo từ, nhưng không thu hẹp thành riêng những người ăn xin.
- source_word: τῷ πνεύματι
  choice: trong tâm linh
  rationale: Diễn đạt cách ngữ chỉ phương diện, đồng thời giữ cấu trúc cô đọng và độ mở của nguyên văn; không tự động đồng nhất πνεῦμα với Đức Thánh Linh hay giải nghĩa thành lòng khiêm nhường.
- source_word: ὅτι
  choice: vì
  rationale: Giới thiệu lý do cho lời chúc phước bằng liên từ tự nhiên, rõ ràng trong tiếng Việt hiện đại.
- source_word: αὐτῶν ἐστιν
  choice: thuộc về họ
  rationale: Truyền đạt tự nhiên cấu trúc sở hữu ở thì hiện tại và giữ sự nhấn mạnh rằng vương quốc hiện thuộc về nhóm người này.
- source_word: ἡ βασιλεία
  choice: vương quốc
  rationale: Cách dịch rõ nghĩa và quen thuộc, có thể bao hàm cả lãnh địa lẫn quyền cai trị của vua mà không thu hẹp thành một ý duy nhất.
- source_word: τῶν οὐρανῶν
  choice: thiên đàng
  rationale: Cách nói tự nhiên và quen thuộc trong tiếng Việt cho thành ngữ đặc trưng của Ma-thi-ơ; nguyên văn dùng hình thức số nhiều, nhưng tiếng Việt không cần sao chép số ngữ pháp ấy.
theological_decisions:
- issue: Ý nghĩa của cụm “nghèo khó trong tâm linh”
  choice: Giữ cụm diễn đạt gần nguyên văn mà không thêm lời giải nghĩa vào chính câu.
  alternative: “nghèo khó về phương diện thuộc linh,” “khiêm nhường,” hoặc “nhận biết nhu cầu tâm linh của mình”
  rationale: Cụm Hy Lạp cô đọng và có độ mở thần học. Một cách diễn giải cụ thể trong chính văn sẽ giải quyết điều mà nguyên văn vẫn để ngỏ.
- issue: Thì hiện tại của việc sở hữu vương quốc
  choice: Dịch ἐστιν ở thì hiện tại bằng “thuộc về họ.”
  alternative: “sẽ thuộc về họ”
  rationale: Nguyên văn dùng thì hiện tại; không nên chuyển lời hứa thành phần thưởng chỉ có trong tương lai.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Phước cho” giữ âm hưởng của thể loại lời chúc phước; “trong tâm linh” hơi cô đọng nhưng có chủ ý nhằm bảo toàn độ mở của nguyên văn.
