revisions:
- from: 'Quả thật, tôi nói với anh em: cho đến khi trời đất qua đi, thì một chữ i-ô-ta[a] hay một nét chữ nhỏ[b] cũng tuyệt nhiên không qua khỏi luật pháp, cho đến khi mọi sự xảy ra[c].'
  to: 'Vì quả thật, tôi nói với anh em: cho đến khi trời đất qua đi, dù một chữ i-ô-ta[a] hay một nét nhỏ[b] cũng tuyệt nhiên không mất đi khỏi Luật pháp, cho đến khi mọi sự xảy ra[c].'
  rationale: Bản sửa bổ sung “Vì” cho γάρ, thay cách nói không tự nhiên “qua khỏi luật pháp” bằng “mất đi khỏi Luật pháp” để phản ánh chính xác ἀπὸ τοῦ νόμου, và chỉnh chú thích i-ô-ta cho chính xác. Các cách dịch vẫn giữ tính rộng nghĩa của πάντα γένηται và không áp đặt cách hiểu giáo phái.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T02:46:47Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản nháp truyền đạt đúng cấu trúc và các hình ảnh chính của nguyên văn, kể cả phủ định nhấn mạnh οὐ μὴ và hai mệnh đề χρονική với ἕως ἄν. Tuy nhiên, “qua khỏi luật pháp” không diễn đạt đúng và tự nhiên quan hệ ἀπὸ τοῦ νόμου trong ngữ cảnh: điều được nói là không một yếu tố nào sẽ mất đi/biến mất khỏi Luật pháp.'
  naturalness: “Quả thật” là tự nhiên, nhưng γάρ nên được biểu hiện bằng “Vì” để giữ liên kết giải thích. “Không qua khỏi luật pháp” không phải cách nói tiếng Việt tự nhiên. “Không mất đi khỏi Luật pháp” vừa tự nhiên vừa bảo toàn phép lặp có chủ ý với “trời đất qua đi.”
  terminology: Nên dùng “Luật pháp” cho νόμος trong ngữ cảnh Kinh Thánh. Viết hoa không quyết định riêng phạm vi Torah hay toàn bộ phần Kinh Thánh cũ; nó nhận diện quy chiếu kinh điển của danh từ xác định. Chú thích về i-ô-ta cần tránh nói đây là chữ cái “nhỏ nhất trong bảng chữ cái Hy Lạp,” vì i-ô-ta không nhỏ nhất theo thứ tự bảng chữ cái; điểm là nét/chữ nhỏ nhất trong hình ảnh thành ngữ của câu.
  issues:
  - severity: medium
    issue: “cũng tuyệt nhiên không qua khỏi luật pháp”
    rationale: Cụm này không tự nhiên trong tiếng Việt và làm lệch hình ảnh “không hề mất đi khỏi Luật pháp” của οὐ μὴ παρέλθῃ ἀπὸ τοῦ νόμου.
  - severity: low
    issue: Liên từ γάρ không được phản ánh riêng
    rationale: “Quả thật” biểu đạt ἀμήν, nhưng không thay thế rõ chức năng giải thích của γάρ. “Vì quả thật” giữ được cả hai yếu tố.
  - severity: low
    issue: Chú thích a gọi i-ô-ta là chữ cái nhỏ nhất trong bảng chữ cái Hy Lạp
    rationale: Cách nói này có thể bị hiểu là nhỏ nhất theo thứ tự bảng chữ cái. Chú thích nên nói rõ đây là tên một chữ cái Hy Lạp và trong ngữ cảnh tượng trưng cho thành tố chữ viết nhỏ nhất.
