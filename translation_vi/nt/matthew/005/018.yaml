reference: Matthew 5:18
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀμὴν γὰρ λέγω ὑμῖν, ἕως ἂν παρέλθῃ ὁ οὐρανὸς καὶ ἡ γῆ, ἰῶτα ἓν ἢ μία κεραία οὐ μὴ παρέλθῃ ἀπὸ τοῦ νόμου, ἕως ἂν πάντα γένηται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/018.yaml
  text: For truly I say to you[a], until heaven and earth pass away[c][b], not one iota or one stroke will ever pass away from the law until all things happen.
translation:
  language: vi
  text: 'Vì quả thật, tôi nói với anh em: cho đến khi trời đất qua đi, dù một chữ i-ô-ta[a] hay một nét nhỏ[b] cũng tuyệt nhiên không mất đi khỏi Luật pháp, cho đến khi mọi sự xảy ra[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: I-ô-ta là tên một chữ cái Hy Lạp; trong ngữ cảnh này, từ này chỉ thành tố chữ viết nhỏ nhất.
    reason: lexical_explanation
  - marker: b
    text: 'Tức là một dấu hoặc nét viết rất nhỏ dùng để phân biệt các chữ; cũng có thể dịch: “một dấu nhỏ”.'
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể dịch: “cho đến khi mọi sự được hoàn tất” hoặc “cho đến khi mọi điều trở thành hiện thực”.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀμὴν γὰρ
  choice: Quả thật
  rationale: ἀμήν mở đầu lời tuyên bố long trọng, còn γάρ nối câu này với lời giải thích ở trước. “Quả thật” truyền đạt tự nhiên cả sắc thái khẳng định trang trọng lẫn tác dụng giải thích trong tiếng Việt.
- source_word: λέγω ὑμῖν
  choice: tôi nói với anh em
  rationale: Cách dịch trực tiếp, tự nhiên, giữ giọng tuyên bố có thẩm quyền; “anh em” là lối xưng hô số nhiều phù hợp với nhóm người nghe.
- source_word: ἕως ἂν παρέλθῃ ὁ οὐρανὸς καὶ ἡ γῆ
  choice: cho đến khi trời đất qua đi
  rationale: Giữ hình ảnh vũ trụ và ý nghĩa tương lai của cấu trúc ἕως ἄν với động từ ở thể giả định.
- source_word: ἰῶτα ἓν
  choice: một chữ i-ô-ta
  rationale: Giữ tên chữ cái cụ thể của nguyên văn thay vì diễn giải hoàn toàn là “chữ nhỏ nhất”; chú thích giải thích cho độc giả hiện đại.
- source_word: μία κεραία
  choice: một nét chữ nhỏ
  rationale: κεραία chỉ một nét hoặc phần nhô rất nhỏ dùng để phân biệt chữ viết. Cách dịch này cụ thể và dễ hiểu hơn từ cổ hoặc thuật ngữ chuyên môn.
- source_word: οὐ μὴ παρέλθῃ
  choice: cũng tuyệt nhiên không qua khỏi
  rationale: “Tuyệt nhiên không” thể hiện phép phủ định nhấn mạnh οὐ μή; “qua khỏi” cũng duy trì sự lặp từ với việc trời đất “qua đi” mà vẫn tự nhiên trong quan hệ với luật pháp.
- source_word: ἀπὸ τοῦ νόμου
  choice: khỏi luật pháp
  rationale: Giữ nghĩa chỉ sự rời khỏi hoặc mất đi từ luật pháp. Viết thường để không quyết định trong chính văn rằng νόμος chỉ riêng Ngũ Kinh hay mang phạm vi rộng hơn.
- source_word: ἕως ἂν πάντα γένηται
  choice: cho đến khi mọi sự xảy ra
  rationale: Giữ nghĩa rộng của γίνομαι là xảy ra hoặc trở thành hiện thực, không thu hẹp câu vào riêng ý “được hoàn tất”; một cách hiểu quen thuộc khác được ghi ở chú thích.
theological_decisions:
- issue: Phạm vi của νόμος
  choice: luật pháp
  alternative: Luật pháp theo nghĩa riêng là Torah/Ngũ Kinh, hoặc rộng hơn là toàn bộ Kinh Thánh trước đó
  rationale: Ngữ cảnh Ma-thi-ơ 5:17–19 nói đến “Luật pháp và các Tiên tri”, nhưng chính câu này chỉ dùng νόμος. Bản dịch giữ từ ngữ rộng của nguyên văn, không áp đặt một phạm vi giáo điển cụ thể.
- issue: Ý nghĩa của πάντα γένηται
  choice: cho đến khi mọi sự xảy ra
  alternative: cho đến khi mọi sự được hoàn tất / mọi điều trở thành hiện thực
  rationale: Cụm từ có thể nói đến mọi điều xảy đến hoặc được hoàn thành theo ý định của Đức Chúa Trời. Chính văn giữ sự rộng nghĩa và chú thích bảo tồn cách hiểu nhấn mạnh sự hoàn tất.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Quả thật” giữ sắc thái long trọng của lời Chúa Giê-su mà không dùng từ vay mượn khó hiểu. Các thuật ngữ liên quan đến chữ viết được diễn đạt phổ thông, còn chi tiết nguyên ngữ được bảo tồn bằng chú thích.
