review_pass:
  verdict: revise
  source_fidelity: Bản nháp truyền đạt đúng hai mệnh lệnh và không tự giới hạn đối tượng xin hay vay. Tuy nhiên, “con” áp đặt quan hệ Chúa–con cái không được biểu thị trong câu Hy Lạp, còn “nơi con” không phải cách diễn đạt hiện đại tự nhiên cho nguồn của việc vay.
  naturalness: “Người xin con” và đặc biệt “vay mượn nơi con” nghe không tự nhiên trong tiếng Việt hiện đại. “Ngoảnh mặt với” cũng không diễn đạt rõ hướng tránh đi; “quay lưng với” là thành ngữ tự nhiên, giữ được hình ảnh không quay đi/không tránh mặt.
  terminology: Dùng “bạn” làm đại từ ngôi hai số ít mang tính khái quát, tương ứng với σε/σοῦ số ít trong lời dạy. “Vay” đủ rộng như δανίσασθαι; không thêm “tiền”.
  issues:
  - severity: medium
    issue: Đại từ “con” thêm quan hệ tôn giáo không có trong nguyên văn.
    rationale: Câu dùng ngôi hai số ít γενικός, không gọi người nghe là “con”. “Bạn” giữ tính trực tiếp và khái quát mà không áp đặt cách đọc quan hệ.
  - severity: medium
    issue: “Vay mượn nơi con” không tự nhiên trong tiếng Việt hiện đại.
    rationale: Trong cách dùng hiện đại, “vay bạn” đã tự nhiên mang nghĩa vay từ bạn và phản ánh ἀπὸ σοῦ.
  - severity: low
    issue: “Đừng ngoảnh mặt với” không rõ nghĩa là quay tránh khỏi ai.
    rationale: “Đừng quay lưng với” là cách nói tự nhiên hơn, đồng thời bảo tồn hình ảnh ἀποστραφῇς là không quay đi khỏi người ấy.
  revised_text: Hãy cho người xin bạn, và đừng quay lưng với người muốn vay bạn.[a]
