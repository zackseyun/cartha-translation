  text: τῷ αἰτοῦντί σε ⸀δός, καὶ τὸν θέλοντα ἀπὸ σοῦ δανίσασθαι μὴ ἀποστραφῇς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/042.yaml
  text: Give to the one who asks you[a], and do not turn away from the one who wants to borrow from you.
translation:
  language: vi
  text: Hãy cho người xin bạn, và đừng quay lưng với người muốn vay bạn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “đừng từ chối người muốn vay bạn.”'
    reason: Phương án diễn giải từ vựng cho μὴ ἀποστραφῇς; bản văn chính giữ hình ảnh “quay đi/quay lưng” của động từ Hy Lạp.
lexical_decisions:
- source_word: τῷ αἰτοῦντί σε
  choice: người xin con
  rationale: Phân từ hiện tại có mạo từ được dùng như danh từ, chỉ chung người đang xin hoặc cầu xin. “Người xin con” tự nhiên, không thêm một đối tượng mà nguyên văn không nêu.
- source_word: δός
  choice: Hãy cho
  rationale: Mệnh lệnh cách aorist của δίδωμι được chuyển thành mệnh lệnh trực tiếp “Hãy cho”, giữ nguyên sức mạnh của lời truyền dạy.
- source_word: τὸν θέλοντα
  choice: người muốn
  rationale: Phân từ hiện tại có mạo từ được dùng như danh từ. “Người muốn” diễn đạt tự nhiên ý của θέλω mà không thêm sắc thái khác.
- source_word: ἀπὸ σοῦ
  choice: nơi con
  rationale: Cụm giới từ chỉ nguồn. Trong kết cấu “vay mượn nơi con”, cách nói này trang trọng, rõ nghĩa và phù hợp văn cảnh.
- source_word: δανίσασθαι
  choice: vay mượn
  rationale: Động từ nguyên mẫu aorist trung gian mang nghĩa vay. “Vay mượn” không giới hạn đối tượng vào tiền bạc vì nguyên văn không nói rõ vật được vay.
- source_word: μὴ ἀποστραφῇς
  choice: đừng ngoảnh mặt
  rationale: Mệnh đề cấm đoán được diễn đạt trực tiếp. “Đừng ngoảnh mặt” giữ hình ảnh của ἀποστρέφω và vẫn tự nhiên trong tiếng Việt, thay vì diễn giải thành “đừng từ chối”.
theological_decisions:
- issue: Phạm vi và sức mạnh của mệnh lệnh đạo đức của Chúa Giê-su
  choice: Giữ hai mệnh lệnh trực tiếp, có tính khái quát, không làm nhẹ hoặc tự ý thu hẹp phạm vi.
  alternative: Diễn giải là chỉ áp dụng cho người xin đáng được giúp, hoặc chuyển thành lời khuyên mềm hơn.
  rationale: Câu Hy Lạp đưa ra những mệnh lệnh thẳng thắn trong Bài Giảng Trên Núi và không nêu các điều kiện hạn chế; bản dịch không nên tự thêm những điều kiện ấy.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng đại từ “con” vì đây là lời Chúa Giê-su trực tiếp dạy người nghe; “ngoảnh mặt” bảo tồn hình ảnh của nguyên văn. Không thêm “tiền” sau động từ vay vì đối tượng không được xác định trong tiếng Hy Lạp.
