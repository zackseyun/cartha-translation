  rationale: Bản sửa giữ nguyên hai mệnh lệnh trực tiếp, tính khái quát của các phân từ có mạo từ, và sự không xác định về vật được vay. Sửa đại từ và các kết hợp từ để phù hợp tiếng Việt hiện đại, không thêm quan hệ hay điều kiện ngoài nguyên văn. Chú thích duy trì phương án “từ chối” trong dấu vết kiểm tra tiếng Anh mà không thay thế hình ảnh của bản văn chính.
