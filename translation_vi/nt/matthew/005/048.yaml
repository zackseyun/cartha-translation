  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἔσεσθε οὖν ὑμεῖς τέλειοι ⸀ὡς ὁ πατὴρ ὑμῶν ὁ ⸀οὐράνιος τέλειός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/048.yaml
  text: You[a], therefore, shall be perfect, as your heavenly Father is perfect.
translation:
  language: vi
  text: Vậy, anh em hãy trở nên trọn vẹn[a], như Cha trên trời của anh em là trọn vẹn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “hoàn hảo”, “toàn vẹn” hoặc “trưởng thành”. Từ Hy Lạp τέλειος có thể chỉ sự hoàn chỉnh, toàn vẹn hoặc trưởng thành, cũng như sự hoàn hảo.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔσεσθε
  choice: phải nên
  rationale: Động từ tương lai ở đây mang lực mệnh lệnh hoặc khích lệ. “Phải nên” diễn đạt tự nhiên yêu cầu trang trọng trong tiếng Việt mà không biến câu thành một lời tiên đoán đơn thuần.
- source_word: οὖν
  choice: Vậy
  rationale: Giữ quan hệ suy luận với lời dạy ngay trước đó, đặc biệt là việc yêu kẻ thù.
- source_word: ὑμεῖς
  choice: anh em
  rationale: Đại từ được nêu rõ trong tiếng Hy Lạp để tạo nhấn mạnh. “Anh em” là cách xưng hô tự nhiên, trang trọng với nhóm môn đồ trong văn cảnh.
- source_word: τέλειοι / τέλειός
  choice: trọn vẹn
  rationale: Từ τέλειος có thể chỉ sự hoàn chỉnh, toàn vẹn hoặc trưởng thành. “Trọn vẹn” bảo toàn chiều kích về tình yêu không phân chia trong văn cảnh, đồng thời cùng một từ được lặp lại cho các môn đồ và cho Cha.
- source_word: ὡς
  choice: như
  rationale: Diễn đạt trực tiếp phép so sánh.
- source_word: ὁ πατὴρ ὑμῶν ὁ οὐράνιος
  choice: Cha trên trời của anh em
  rationale: Cách diễn đạt tự nhiên trong tiếng Việt, giữ quan hệ sở hữu và ý nghĩa của tính từ οὐράνιος.
theological_decisions:
- issue: Ý nghĩa của τέλειος trong lời khuyên dạy đạo đức
  choice: Dùng “trọn vẹn” trong chính văn và ghi chú các khả năng “hoàn thiện” hoặc “trưởng thành”.
  alternative: Dịch là “hoàn hảo”.
  rationale: Trong mạch văn Ma-thi-ơ 5:43–47, lời kêu gọi hướng đến tình yêu toàn vẹn, không chỉ yêu người yêu mình. “Trọn vẹn” bảo tồn ý niệm đầy đủ và toàn thể mà không mặc nhiên giải quyết câu theo nghĩa tuyệt đối không thể phạm tội; chú thích vẫn cho thấy độ rộng nghĩa của từ Hy Lạp.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cấu trúc lặp “trọn vẹn … trọn vẹn” giữ sức nặng tu từ của nguyên文; “anh em” phù hợp lời Đức Giê-su nói với các môn đồ.
