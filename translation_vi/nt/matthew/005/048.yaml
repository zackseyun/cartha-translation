review_pass:
  verdict: revise
  source_fidelity: Bản dịch giữ đúng liên kết suy luận của οὖν, sự nhấn mạnh hướng đến nhóm người nghe, phép so sánh ὡς, cách gọi Đức Chúa Trời là Cha của họ, và lặp lại nhất quán τέλειος. “Trọn vẹn” là một lựa chọn phù hợp trong ngữ cảnh tình yêu không phân biệt. Tuy nhiên, “phải nên” chưa phản ánh tự nhiên lực khích lệ/mệnh lệnh của thì tương lai ἔσεσθε trong tiếng Việt hiện đại.
  naturalness: Cụm “anh em phải nên trọn vẹn” hơi gượng và ít tự nhiên trong văn phong Kinh Thánh hiện đại. “Anh em hãy trở nên trọn vẹn” diễn đạt rõ lời kêu gọi, trang trọng mà thông suốt. “Cha trên trời của anh em” tự nhiên và truyền đạt tốt tính từ οὐράνιος trong ngữ cảnh này.
  terminology: Giữ “trọn vẹn” ở cả hai vị trí bảo toàn sự lặp lại tu từ của τέλειος. Chú thích nên nêu các tương đương nghĩa thực sự thay thế cho từ này, gồm “hoàn hảo”, “toàn vẹn” và “trưởng thành”; “hoàn thiện” trong tiếng Việt thường có sắc thái động từ/quá trình, kém chính xác hơn ở đây.
  issues:
  - severity: medium
    issue: “phải nên” không tự nhiên bằng cách diễn đạt mệnh lệnh/khích lệ trực tiếp.
    rationale: Ἔσεσθε là tương lai của εἰμί, nhưng trong văn cảnh này có lực khích lệ mang tính mệnh lệnh. “Hãy trở nên” truyền đạt lực này tự nhiên hơn mà không biến câu thành lời tiên đoán.
  - severity: low
    issue: Chú thích dùng “hoàn thiện” như lựa chọn chính, nhưng từ này thường gợi một tiến trình hơn là phẩm tính được nói đến.
    rationale: τέλειος là tính từ; trong câu này các lựa chọn tiếng Việt sát hơn là “hoàn hảo”, “toàn vẹn”, hoặc “trưởng thành”. Chú thích cần phản ánh đúng dải nghĩa mà không áp đặt một diễn giải thần học.
  revised_text: Vậy, anh em hãy trở nên trọn vẹn[a], như Cha trên trời của anh em là trọn vẹn.
