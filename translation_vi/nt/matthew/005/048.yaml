- from: Vậy, anh em phải nên trọn vẹn[a], như Cha trên trời của anh em là trọn vẹn.
  to: Vậy, anh em hãy trở nên trọn vẹn[a], như Cha trên trời của anh em là trọn vẹn.
  rationale: Sửa “phải nên” thành “hãy trở nên” để câu tiếng Việt tự nhiên và truyền đạt lực khích lệ/mệnh lệnh của Ἔσεσθε. Giữ “trọn vẹn” lặp lại cho τέλειοι và τέλειός, đồng thời điều chỉnh chú thích để các phương án từ vựng sát với tính từ Hy Lạp và tiếng Việt hiện đại hơn.
