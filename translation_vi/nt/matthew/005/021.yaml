reference: Matthew 5:21
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἠκούσατε ὅτι ἐρρέθη τοῖς ἀρχαίοις· Οὐ φονεύσεις· ὃς δ’ ἂν φονεύσῃ, ἔνοχος ἔσται τῇ κρίσει.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/021.yaml
  text: You have heard that it was said to the ancients[a], ‘You shall not murder[c][b]; and whoever murders will be liable to judgment.’
translation:
  language: vi
  text: 'Anh em đã nghe rằng người xưa đã được phán: “Ngươi không được giết người[b]; ai giết người sẽ phải chịu xét xử.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Động từ Hy Lạp ở đây nói cụ thể đến hành vi giết người, chứ không bao quát mọi trường hợp làm chết nói chung.
    reason: lexical_clarification
lexical_decisions:
- source_word: Ἠκούσατε
  choice: Anh em đã nghe
  rationale: Diễn đạt tự nhiên công thức chỉ điều những người nghe đã tiếp nhận từ trước; đại từ số nhiều “anh em” phù hợp với lời Chúa Giê-su trực tiếp nói với thính giả.
- source_word: ἐρρέθη
  choice: lời phán
  rationale: Giữ cấu trúc bị động và không xác định rõ người phán; cách nói này trang trọng, tự nhiên trong ngữ cảnh trích dẫn lời có thẩm quyền.
- source_word: τοῖς ἀρχαίοις
  choice: với người xưa
  rationale: Giữ nghĩa cách tặng-cách là những người thời trước tiếp nhận lời phán, thay vì chuyển thành lời do người xưa nói.
- source_word: Οὐ φονεύσεις
  choice: Ngươi không được giết người
  rationale: φονεύω chỉ việc sát hại một người, đặc biệt là giết người trái phép, chứ không bao quát mọi hành vi làm chết; “không được” truyền đạt sức mạnh cấm đoán của dạng tương lai dùng như mệnh lệnh.
- source_word: ὃς δ’ ἂν φονεύσῃ
  choice: ai giết người
  rationale: 'Diễn đạt tự nhiên mệnh đề quan hệ bất định với ἄν và động từ giả định: bất cứ người nào thực hiện hành vi ấy.'
- source_word: ἔνοχος ἔσται
  choice: sẽ phải chịu
  rationale: Thể hiện tình trạng phải chịu trách nhiệm hoặc hậu quả pháp lý, thay vì chỉ nói đến cảm giác hay phẩm chất có tội.
- source_word: τῇ κρίσει
  choice: xét xử
  rationale: Giữ nét nghĩa tư pháp của κρίσις nhưng không xác định quá mức đó là một tòa án cụ thể hay sự kết án cuối cùng.
theological_decisions:
- issue: Phạm vi của điều răn thứ sáu
  choice: giết người
  alternative: giết
  rationale: Động từ φονεύω hẹp hơn khái niệm giết nói chung và chỉ việc sát hại người; lựa chọn này tránh biến câu thành lời cấm tuyệt đối mọi trường hợp gây chết mà nguyên văn không nói rõ.
- issue: Người liên hệ với lời phán
  choice: lời phán với người xưa
  alternative: lời người xưa nói
  rationale: Dạng τοῖς ἀρχαίοις tự nhiên nhất chỉ những người thời xưa là đối tượng tiếp nhận lời phán; bản dịch không biến họ thành chủ thể phát ngôn.
- issue: Ý nghĩa của κρίσις
  choice: xét xử
  alternative: kết án
  rationale: “Xét xử” bảo toàn khoảng mở giữa tiến trình/phán quyết tư pháp và sự kết án, không mặc nhiên khẳng định kết quả cuối cùng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Anh em” dùng cho đại từ số nhiều hướng đến thính giả; “ngươi” trong lời điều răn giữ sắc thái trực tiếp, trang trọng của mệnh lệnh số ít. Toàn bộ điều răn và hậu quả pháp lý được đặt trong cùng một cặp ngoặc kép, theo cấu trúc của câu Hy Lạp.
