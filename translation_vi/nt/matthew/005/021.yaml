revisions:
- from: 'Anh em đã nghe lời phán với người xưa[a] rằng: “Ngươi không được giết người[b]; ai giết người thì sẽ phải chịu xét xử.”'
  to: 'Anh em đã nghe rằng người xưa đã được phán: “Ngươi không được giết người[b]; ai giết người sẽ phải chịu xét xử.”'
  rationale: 'Sửa cấu trúc mở đầu để tiếng Việt tự nhiên và để bảo toàn rõ nét bị động: lời ấy được phán với người xưa. Dấu chú thích a được bỏ vì bản văn sửa không còn dùng cách dịch chính «người xưa» như một cụm cần thay thế; giữ chú thích này sẽ tạo neo không hợp lệ. Chú thích b được giữ và rút gọn để giải thích phạm vi của φονεύω mà không áp đặt một phân loại pháp lý hoặc giáo phái cụ thể.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T02:47:07Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch giữ đúng các thành tố chính: công thức «đã nghe», lời được nói với những người thời xưa, điều răn về việc giết người, và hậu quả tư pháp. Tuy nhiên, cụm «đã nghe lời phán với người xưa rằng» thiếu liên từ/cấu trúc bị động tự nhiên trong tiếng Việt và có thể khiến quan hệ giữa «lời phán» với «người xưa» khó đọc.'
  naturalness: Nên đổi thành «Anh em đã nghe rằng người xưa đã được phán:»; cách này tự nhiên, trang trọng, và vẫn giữ rõ người xưa là người nhận lời phán, không phải người nói. Trong câu trích, «Ai giết người sẽ phải chịu xét xử» gọn và tự nhiên hơn việc chèn «thì».
  terminology: «Giết người» là lựa chọn phù hợp cho φονεύω trong câu này, tránh mở rộng thành mọi hành vi «giết». «Xét xử» bảo toàn sắc thái pháp lý chưa xác định của τῇ κρίσει. Không cần xác định đó là một tòa án cụ thể hay sự phán xét cánh chung.
  issues:
  - severity: medium
    issue: Cấu trúc «Anh em đã nghe lời phán với người xưa rằng» chưa tự nhiên và mơ hồ về cú pháp.
    rationale: Nguyên văn có bị động ἐρρέθη và cụm chỉ người nhận τοῖς ἀρχαίοις. «Người xưa đã được phán» diễn đạt rõ quan hệ này trong tiếng Việt mà không thêm chủ thể phát ngôn.
  - severity: low
    issue: «ai giết người thì sẽ phải chịu xét xử» hơi nặng trong một câu trích ngắn.
    rationale: Bỏ «thì» không thay đổi nghĩa của mệnh đề bất định ὃς δ᾽ ἂν φονεύσῃ và cho nhịp văn hiện đại tự nhiên hơn.
