id: MAT.5.4
reference: Matthew 5:4
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: μακάριοι οἱ πενθοῦντες, ὅτι αὐτοὶ παρακληθήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/004.yaml
  text: Blessed are those who mourn[a], because they will be comforted.
translation:
  language: vi
  text: Phước cho những người than khóc[a], vì họ sẽ được an ủi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “những người đau buồn.” Từ Hy Lạp có nghĩa rộng và không nói rõ nguyên nhân của sự than khóc.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μακάριοι
  choice: Phước cho
  rationale: Giữ công thức tuyên bố phước lành của các mối phước và sắc thái đánh giá khách quan, thay vì diễn đạt thành cảm xúc chủ quan như “hạnh phúc”.
- source_word: οἱ πενθοῦντες
  choice: những người than khóc
  rationale: Chuyển phân từ hiện tại có mạo từ thành cụm danh từ số nhiều tự nhiên trong tiếng Việt. “Than khóc” diễn tả nỗi đau buồn sâu sắc mà không giới hạn nguyên nhân.
- source_word: ὅτι
  choice: vì
  rationale: Diễn đạt quan hệ nguyên nhân hoặc cơ sở của lời tuyên phước một cách ngắn gọn, tự nhiên.
- source_word: αὐτοὶ
  choice: họ
  rationale: Đại từ Hy Lạp có phần nhấn mạnh, nhưng cấu trúc tiếng Việt không cần thêm “chính họ” ở đây; cách ấy dễ tạo mức nhấn quá mạnh.
- source_word: παρακληθήσονται
  choice: sẽ được an ủi
  rationale: Giữ thì tương lai và thể bị động, đồng thời diễn đạt nghĩa nhận được sự an ủi bằng tiếng Việt tự nhiên.
theological_decisions:
- issue: Phạm vi của sự than khóc trong lời tuyên phước
  choice: Dịch rộng là “những người than khóc”, không xác định họ than khóc vì mất mát, tội lỗi, áp bức hay niềm mong đợi thời sau cùng.
  alternative: “những người than khóc về tội lỗi” hoặc một cách diễn đạt chỉ nỗi đau buồn nói chung
  rationale: Bản văn Hy Lạp không nêu đối tượng hay nguyên nhân của việc than khóc. Giữ cách nói rộng bảo tồn tính mở về thần học và mục vụ của lời này.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. “Phước cho” giữ âm hưởng quen thuộc của công thức các mối phước; “than khóc” tự nhiên và không thu hẹp nguyên nhân của nỗi buồn.
