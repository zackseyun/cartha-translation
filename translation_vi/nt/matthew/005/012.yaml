id: MAT.5.12
reference: Matthew 5:12
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: χαίρετε καὶ ἀγαλλιᾶσθε, ὅτι ὁ μισθὸς ὑμῶν πολὺς ἐν τοῖς οὐρανοῖς· οὕτως γὰρ ἐδίωξαν τοὺς προφήτας τοὺς πρὸ ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/012.yaml
  text: Rejoice and be very glad[a], because your reward is great in the heavens; for in this way they persecuted the prophets who were before you.
translation:
  language: vi
  text: Hãy vui mừng và hân hoan, vì phần thưởng dành cho anh em ở trên trời[a] thật lớn; bởi người ta cũng đã bắt bớ các nhà tiên tri đi trước anh em như vậy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn dùng danh từ số nhiều: “ở trong các trời.” Ma-thi-ơ thường dùng dạng số nhiều ở những chỗ tiếng Việt tự nhiên nói “trên trời”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: χαίρετε
  choice: Hãy vui mừng
  rationale: Động từ mệnh lệnh hiện tại, ngôi thứ hai số nhiều, kêu gọi người nghe chủ động vui mừng; cách diễn đạt này tự nhiên và trang trọng trong tiếng Việt hiện đại.
- source_word: ἀγαλλιᾶσθε
  choice: hân hoan
  rationale: Diễn tả niềm vui mãnh liệt hơn χαίρετε; “hân hoan” giữ được sắc thái tăng cường mà vẫn dễ hiểu.
- source_word: μισθὸς
  choice: phần thưởng
  rationale: Trong ngữ cảnh sự đền đáp của Đức Chúa Trời dành cho người chịu bắt bớ, “phần thưởng” phù hợp hơn “tiền công” và không tạo sắc thái giao dịch thuần túy.
- source_word: πολὺς
  choice: thật lớn
  rationale: Tính từ vị ngữ nhấn mạnh độ lớn của phần thưởng; “thật lớn” diễn đạt tự nhiên cường độ ấy.
- source_word: ἐν τοῖς οὐρανοῖς
  choice: ở trên trời
  rationale: Danh từ Hy Lạp ở số nhiều, nhưng tiếng Việt thông thường dùng “trên trời” để chỉ cõi trời; chú thích giữ lại thông tin về hình thức số nhiều của nguyên văn.
- source_word: οὕτως
  choice: như vậy
  rationale: Trạng từ chỉ cách thức, liên kết sự bắt bớ các môn đồ với cách các nhà tiên tri từng bị bắt bớ.
- source_word: ἐδίωξαν
  choice: đã bắt bớ
  rationale: Trong mạch văn, διώκω mang nghĩa thù nghịch là bức hại hoặc bắt bớ; “bắt bớ” là cách nói rõ ràng, quen thuộc.
- source_word: τοὺς προφήτας τοὺς πρὸ ὑμῶν
  choice: các nhà tiên tri đi trước anh em
  rationale: Diễn đạt tự nhiên rằng các nhà tiên tri thuộc những thế hệ có trước người nghe, không thêm một cách hiểu giáo phái.
theological_decisions:
- issue: Ý nghĩa của ἐν τοῖς οὐρανοῖς
  choice: Dịch theo cách nói tự nhiên là “ở trên trời”, chỉ cõi trời nơi phần thưởng của người chịu bắt bớ thuộc về.
  alternative: “ở trong các tầng trời” hoặc “ở các tầng trời”, phản ánh trực tiếp hình thức số nhiều của Hy Lạp.
  rationale: Sự lựa chọn chủ yếu thuộc về ngôn ngữ chứ không nhằm giải quyết một tranh luận giáo lý. Bản dịch chính dùng lối nói tiếng Việt tự nhiên, còn chú thích bảo tồn đặc điểm số nhiều của nguyên văn.
- issue: Quan hệ so sánh do οὕτως biểu thị
  choice: Đặt “như vậy” ở cuối mệnh đề để nói rằng các nhà tiên tri cũng từng bị bắt bớ theo cách tương ứng.
  alternative: Hiểu đơn giản là “vì họ đã bắt bớ các nhà tiên tri trước anh em”.
  rationale: Giữ rõ lực chỉ cách thức của οὕτως và mối tương ứng giữa kinh nghiệm của người nghe với kinh nghiệm của các nhà tiên tri.
translation_notes:
  register: Văn phong hiện đại, trang trọng nhưng dễ hiểu. “Anh em” thể hiện ngôi thứ hai số nhiều trong lời dạy trực tiếp; “vui mừng và hân hoan” giữ nhịp song đôi và mức độ tăng cường của hai động từ Hy Lạp.
