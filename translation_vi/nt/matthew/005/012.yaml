  to: Hãy vui mừng và hân hoan, vì phần thưởng dành cho anh em ở trên trời[a] thật lớn; bởi người ta cũng đã bắt bớ các nhà tiên tri đi trước anh em như vậy.
  rationale: Chỉ điều chỉnh nhẹ cấu trúc để tiếng Việt rõ hơn và thay chú thích bằng cách diễn đạt trung tính, sát với hình thức số nhiều của nguyên ngữ. Ý nghĩa, sắc thái mệnh lệnh, và quan hệ so sánh của câu được giữ nguyên.
