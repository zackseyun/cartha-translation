  text: Ἠκούσατε ὅτι ἐρρέθη· Οὐ μοιχεύσεις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/027.yaml
  text: You have heard that it was said[a], ‘You shall not commit adultery.’
translation:
  language: vi
  text: 'Anh em đã nghe rằng đã có lời phán[a]: “Chớ ngoại tình.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát hơn: “Anh em nghe rằng đã có lời phán.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἠκούσατε
  choice: Các con đã nghe
  rationale: Thì aorist trong công thức dẫn nhập này chỉ điều người nghe đã được nghe và tiếp nhận trước đó. “Đã nghe” vừa tự nhiên trong tiếng Việt vừa giữ được chiều quá khứ của động từ; “các con” phù hợp với lời Đức Giê-su trực tiếp dạy các môn đồ và đám đông.
- source_word: ὅτι
  choice: rằng
  rationale: Dùng để dẫn nội dung của điều đã nghe, tương ứng tự nhiên với liên từ bổ ngữ trong tiếng Hy Lạp.
- source_word: ἐρρέθη
  choice: lời phán
  rationale: Thể bị động aorist có nghĩa đen là “đã được nói”. Trong ngữ cảnh trích điều răn, “lời phán” là cách diễn đạt trang trọng, tự nhiên và không buộc phải nêu chủ thể của lời nói.
- source_word: Οὐ μοιχεύσεις
  choice: Chớ ngoại tình
  rationale: Động từ tương lai với οὐ được dùng như một lệnh cấm, lặp lại hình thức của điều răn. “Chớ” giữ sắc thái mệnh lệnh trang trọng, còn “ngoại tình” là cách nói chuẩn, rõ nghĩa của μοιχεύω trong tiếng Việt hiện đại.
theological_decisions:
- issue: Mối liên hệ với điều răn trong Mười Điều Răn
  choice: 'Dịch theo thể mệnh lệnh truyền thống: “Chớ ngoại tình.”'
  alternative: “Đừng ngoại tình.”
  rationale: “Chớ” bảo tồn âm hưởng của lời điều răn được Đức Giê-su trích dẫn mà không thêm cách giải thích thần học; “đừng” tự nhiên hơn trong hội thoại nhưng làm giảm sắc thái trích dẫn pháp lệnh.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “các con” cho số nhiều ngôi thứ hai trong diễn từ; “lời phán” và “chớ” giữ âm hưởng Kinh Thánh cùng liên hệ với điều răn, nhưng tránh lối diễn đạt quá cổ.
