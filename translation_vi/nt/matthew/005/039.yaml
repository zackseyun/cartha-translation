  source_fidelity: 'Bản dịch phản ánh đúng cấu trúc và ý chính của nguyên văn: δέ được giữ bằng “Nhưng”; μὴ ἀντιστῆναι được dịch không thu hẹp là “đừng chống lại”; ῥαπίζει và σιαγών được diễn đạt chính xác, tự nhiên bằng “tát vào má”; và mệnh lệnh στρέψον được giữ là “hãy quay ... về phía”. “Kẻ ác” phù hợp với cách hiểu giống đực phổ quát được ngữ cảnh minh họa ủng hộ, đồng thời không loại trừ các khả năng ngữ pháp khác nhờ chú thích a.'
