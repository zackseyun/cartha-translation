id: MAT.5.39
reference: Matthew 5:39
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐγὼ δὲ λέγω ὑμῖν μὴ ἀντιστῆναι τῷ πονηρῷ· ἀλλ’ ὅστις σε ⸀ῥαπίζει ⸀εἰς τὴν δεξιὰν ⸀σιαγόνα, στρέψον αὐτῷ καὶ τὴν ἄλλην·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/039.yaml
  text: But I say to you[a], do not resist the evil person. Instead, if anyone slaps you on the right cheek[b], turn the other to him as well.
translation:
  language: vi
  text: 'Nhưng tôi nói với các bạn: đừng chống lại kẻ ác[a]. Trái lại, nếu ai tát vào má phải của bạn, hãy quay cả má kia về phía người ấy[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đừng chống lại điều ác”; hoặc: “đừng chống lại Kẻ Ác.”'
    reason: Giữ sự mơ hồ về giống và đối tượng quy chiếu của τῷ πονηρῷ.
  - marker: b
    text: 'Sát nghĩa hơn: “hãy quay cho người ấy cả má kia nữa.”'
    reason: Ghi nhận trật tự và cách diễn đạt gần nguyên văn hơn, dù bản văn chính tự nhiên hơn trong tiếng Việt.
lexical_decisions:
- source_word: ἐγὼ δὲ λέγω ὑμῖν
  choice: Nhưng tôi nói với các bạn
  rationale: Giữ sắc thái tương phản của δέ và công thức nói trực tiếp có thẩm quyền; “các bạn” thể hiện ngôi thứ hai số nhiều theo cách trung tính, hiện đại.
- source_word: μὴ ἀντιστῆναι
  choice: đừng chống lại
  rationale: Diễn đạt nghĩa trực tiếp của ἀνθίστημι là đứng lên chống lại hay kháng cự, nhưng không thu hẹp câu chỉ còn nghĩa trả đũa.
- source_word: τῷ πονηρῷ
  choice: kẻ ác
  rationale: Dạng tính từ có mạo từ ở cách tặng có thể chỉ điều ác, một người ác, hoặc Kẻ Ác. Ví dụ ngay sau đó nói về một người gây hại nên bản văn chính chọn nghĩa chỉ người, còn các khả năng khác được giữ trong chú thích.
- source_word: ὅστις
  choice: nếu ai
  rationale: Thể hiện tự nhiên sắc thái bất định trong cấu trúc gần với điều kiện.
- source_word: ῥαπίζει
  choice: tát
  rationale: ῥαπίζω thường chỉ hành động đánh bằng tay; “tát” phù hợp với đối tượng là má và giữ được sắc thái sỉ nhục.
- source_word: εἰς τὴν δεξιὰν σιαγόνα
  choice: vào má phải
  rationale: σιαγών có thể là hàm hoặc má; trong ngữ cảnh bị tát, “má” là cách nói tự nhiên, còn εἰς được diễn đạt bằng “vào”.
- source_word: στρέψον αὐτῷ καὶ τὴν ἄλλην
  choice: hãy quay cả má kia về phía người ấy
  rationale: Giữ động từ “quay” của στρέφω và ý “cả...kia” của καί, đồng thời bổ sung “má” theo ngữ cảnh để câu tiếng Việt rõ ràng.
theological_decisions:
- issue: Ý nghĩa của τῷ πονηρῷ
  choice: kẻ ác, hiểu theo nghĩa một người làm điều ác
  alternative: điều ác; hoặc Kẻ Ác
  rationale: Ngữ pháp Hy Lạp thực sự cho phép cả cách hiểu trung tính và giống đực. Minh họa về người tát người khác nghiêng về tác nhân con người, nhưng chú thích vẫn giữ các cách hiểu còn lại để không xóa bỏ sự mơ hồ thần học của nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng đại từ trung tính “tôi—các bạn” để tránh thêm quan hệ phẩm trật hoặc giới tính không được biểu thị rõ trong nguyên văn; giữ câu mệnh lệnh ngắn và trực tiếp.
