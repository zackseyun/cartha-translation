id: MAT.5.1
reference: Matthew 5:1
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἰδὼν δὲ τοὺς ὄχλους ἀνέβη εἰς τὸ ὄρος· καὶ καθίσαντος αὐτοῦ προσῆλθαν αὐτῷ οἱ μαθηταὶ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/001.yaml
  text: Seeing the crowds[a], he went up the mountain; and when he sat down[c][b], his disciples came to him.
translation:
  language: vi
  text: Khi thấy những đám đông[a], Ngài đi lên núi[b]. Khi Ngài ngồi xuống[c], các môn đồ đến với Ngài.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Sau khi thấy những đám đông.”'
    reason: Phân từ Ἰδὼν có thể được hiểu với sắc thái thời gian hơi rõ hơn, nhưng nguyên văn không buộc phải nhấn mạnh trình tự.
  - marker: b
    text: 'Cũng có thể dịch: “đi lên trên núi” hoặc “đi lên ngọn núi.”'
    reason: Giới từ εἰς cùng động từ ἀνέβη diễn tả hướng chuyển động lên núi; tiếng Việt có vài cách diễn đạt tự nhiên gần nghĩa nhau.
  - marker: c
    text: 'Cũng có thể dịch: “Sau khi Ngài ngồi xuống.” Nguyên văn dùng kết cấu sở hữu cách tuyệt đối.'
    reason: Kết cấu καθίσαντος αὐτοῦ có thể được diễn đạt bằng “khi” hoặc “sau khi”; chú thích bảo tồn khả năng về sắc thái thời gian.
lexical_decisions:
- source_word: Ἰδὼν
  choice: Khi thấy
  rationale: Phân từ bất định quá khứ của ὁράω nêu hoàn cảnh cho động từ chính. “Khi thấy” tự nhiên trong tiếng Việt và không ấn định quá chặt rằng hành động thấy đã hoàn tất từ trước.
- source_word: δὲ
  choice: không dịch riêng
  rationale: Ở đây δέ chỉ là từ nối/chuyển ý nhẹ. Không thêm “nhưng” hay “bấy giờ” giúp câu tiếng Việt tự nhiên và tránh tạo sắc thái đối lập hoặc thời gian không rõ trong nguyên văn.
- source_word: τοὺς ὄχλους
  choice: những đám đông
  rationale: ὄχλους ở số nhiều, chỉ những nhóm đông người. Cách dịch này giữ được ý số nhiều mà vẫn dễ hiểu trong tiếng Việt hiện đại.
- source_word: ἀνέβη εἰς τὸ ὄρος
  choice: Ngài đi lên núi
  rationale: Cụm này diễn tả chuyển động hướng lên núi. “Đi lên núi” rõ ràng, tự nhiên hơn “thăng lên núi” và không xác định thêm địa hình ngoài điều nguyên văn nói.
- source_word: τὸ ὄρος
  choice: núi
  rationale: ὄρος có thể chỉ núi hoặc vùng đồi cao. “Núi” là nghĩa trực tiếp và quen thuộc; tiếng Việt không dùng mạo từ xác định tương ứng với τὸ một cách máy móc.
- source_word: καὶ καθίσαντος αὐτοῦ
  choice: Khi Ngài ngồi xuống
  rationale: Kết cấu sở hữu cách tuyệt đối nêu quan hệ thời gian hoặc hoàn cảnh. “Khi Ngài ngồi xuống” giữ được độ rộng của quan hệ ấy, không buộc phải hiểu là trình tự “sau khi” thật nghiêm ngặt.
- source_word: προσῆλθαν αὐτῷ
  choice: đến với Ngài
  rationale: προσέρχομαι có nghĩa là đến gần hoặc tiến đến một người. “Đến với Ngài” tự nhiên, trang trọng vừa phải và phù hợp mạch kể.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: các môn đồ
  rationale: μαθηταί chỉ những người theo học một người thầy. “Môn đồ” là cách gọi quen thuộc, chính xác trong ngữ cảnh Phúc Âm.
theological_decisions:
- issue: Mạo từ xác định trong τὸ ὄρος
  choice: núi
  alternative: ngọn núi ấy; một ngọn núi; sườn đồi
  rationale: Nguyên văn dùng mạo từ xác định, nhưng tiếng Việt thường không biểu đạt tính xác định bằng một từ tương ứng. “Núi” không phủ nhận tính xác định trong văn cảnh, đồng thời không ngụ ý đây là một ngọn núi đã được nêu tên.
- issue: Quan hệ thời gian của καθίσαντος αὐτοῦ
  choice: Khi Ngài ngồi xuống
  alternative: Sau khi Ngài ngồi xuống
  rationale: Kết cấu Hy Lạp cho thấy việc ngồi xuống là hoàn cảnh thời gian gắn với việc các môn đồ đến, nhưng không cần nhấn mạnh một trình tự cứng nhắc hay gán thêm ý nghĩa nghi lễ cho tư thế ngồi.
- issue: Chủ ngữ đại từ chỉ Đức Chúa Jêsus
  choice: Ngài
  alternative: Đức Chúa Jêsus; ông
  rationale: Nguyên văn dùng đại từ αὐτός và dựa vào văn cảnh để nhận diện chủ thể. “Ngài” giữ lối quy chiếu bằng đại từ, phù hợp văn phong trang trọng mà không chèn tên riêng vốn không có trong câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ đọc. Câu được chia làm hai để tránh kết cấu dài nặng nề trong tiếng Việt, nhưng vẫn giữ nguyên diễn tiến và các quan hệ cú pháp chính của nguyên văn.
