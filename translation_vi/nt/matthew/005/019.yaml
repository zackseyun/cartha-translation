review_pass:
  verdict: revise
  source_fidelity: Bản dịch truyền đạt đúng cấu trúc đối lập và ý chính của câu. Tuy nhiên, dùng “bị gọi” ở vế thứ nhất nhưng “được gọi” ở vế thứ hai thêm một đối lập đánh giá không được biểu thị bởi cùng một động từ bị động κληθήσεται trong nguyên văn. Nên dùng nhất quán “được gọi” (hoặc “sẽ được gọi”) cho cả hai vế. “Nước Trời” là cách chuyển ngữ Việt ngữ tự nhiên và đã định hình cho ἡ βασιλεία τῶν οὐρανῶν; không đồng nhất “heaven” với “thiên đàng” theo nghĩa nơi chốn phúc lạc.
  naturalness: Câu đối xứng “ai…; còn ai…” tự nhiên, trang trọng. “Thực hành và dạy những điều ấy” có thể được làm rõ bằng cách đặt “các điều răn ấy” làm bổ ngữ chung, tránh để “dạy” thiếu đối tượng rõ rệt.
  terminology: Giữ “điều răn,” “nhỏ nhất,” và “lớn” để phản ánh ἐντολή, ἐλάχιστος, và μέγας mà không áp đặt cách hiểu về loại trừ hay cấp bậc phần thưởng. “Bãi bỏ” là một lựa chọn chấp nhận được cho λύσῃ trong ngữ cảnh này, với chú thích bảo lưu các sắc thái “làm suy yếu,” “gạt bỏ,” và “vi phạm.”
  issues:
  - severity: medium
    issue: Đối lập “bị gọi” / “được gọi”
    rationale: Cả hai lần κληθήσεται đều là cùng một hình thức bị động của καλέω. “Bị” và “được” trong tiếng Việt bổ sung sắc thái bất lợi/thuận lợi khác nhau; đánh giá nằm ở “nhỏ nhất/lớn,” không nằm trong động từ nguyên ngữ.
  - severity: low
    issue: “Vương quốc thiên đàng”
    rationale: Cụm này kém tự nhiên hơn thuật ngữ Việt ngữ đã ổn định “Nước Trời” cho cách nói đặc trưng của Ma-thi-ơ, và “thiên đàng” có thể gợi riêng nơi phúc lạc hơn là phạm vi quyền trị vì.
  - severity: low
    issue: Bổ ngữ của “thực hành và dạy”
    rationale: Nên nêu “các điều răn ấy” sau cặp động từ để diễn đạt rõ đối tượng ngầm định của ποιήσῃ καὶ διδάξῃ.
