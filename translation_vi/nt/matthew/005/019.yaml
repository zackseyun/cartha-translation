revisions:
- from: Vì vậy, ai bãi bỏ[a] một trong những điều răn nhỏ nhất này và dạy người khác làm như thế thì sẽ bị gọi là nhỏ nhất trong vương quốc thiên đàng; còn ai thực hành và dạy những điều ấy thì người đó sẽ được gọi là lớn trong vương quốc thiên đàng.
  to: Vậy, ai bãi bỏ[a] một trong những điều răn nhỏ nhất này và dạy người khác làm như vậy thì sẽ được gọi là nhỏ nhất trong Nước Trời; còn ai thực hành và dạy các điều răn ấy thì người ấy sẽ được gọi là lớn trong Nước Trời.
  rationale: Bản sửa dùng cùng một cách diễn đạt bị động “sẽ được gọi” cho κληθήσεται ở cả hai vế, thay “vương quốc thiên đàng” bằng “Nước Trời” theo thuật ngữ Việt ngữ tự nhiên và sát cách dùng Ma-thi-ơ, đồng thời làm rõ rằng việc thực hành và dạy liên quan đến các điều răn ấy. Chú thích tiếp tục bảo lưu độ rộng ngữ nghĩa của λύω.
