id: MAT.5.19
reference: Matthew 5:19
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὃς ἐὰν οὖν λύσῃ μίαν τῶν ἐντολῶν τούτων τῶν ἐλαχίστων καὶ διδάξῃ οὕτως τοὺς ἀνθρώπους, ἐλάχιστος κληθήσεται ἐν τῇ βασιλείᾳ τῶν οὐρανῶν· ὃς δ’ ἂν ποιήσῃ καὶ διδάξῃ, οὗτος μέγας κληθήσεται ἐν τῇ βασιλείᾳ τῶν οὐρανῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/019.yaml
  text: Therefore[a], whoever relaxes one of the least of these commandments and teaches others to do so will be called least in the kingdom of heaven; but whoever does them and teaches them[b], this one will be called great in the kingdom of heaven.
translation:
  language: vi
  text: Vậy, ai bãi bỏ[a] một trong những điều răn nhỏ nhất này và dạy người khác làm như vậy thì sẽ được gọi là nhỏ nhất trong Nước Trời; còn ai thực hành và dạy các điều răn ấy thì người ấy sẽ được gọi là lớn trong Nước Trời.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Động từ Hy Lạp có nghĩa đen là “tháo, cởi”; trong ngữ cảnh này, nó có thể chỉ việc làm suy yếu hiệu lực, gạt bỏ, hoặc vi phạm một điều răn.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Vì vậy
  rationale: Diễn đạt tự nhiên quan hệ suy luận với câu trước, đồng thời giữ sắc thái trang trọng.
- source_word: λύσῃ
  choice: bãi bỏ
  rationale: Trong ngữ cảnh các điều răn, λύω chỉ việc tháo bỏ hiệu lực hay coi một điều răn là không còn ràng buộc. “Bãi bỏ” giữ được ý pháp lý rõ hơn “vi phạm”, nhưng chú thích bảo lưu nghĩa đen và các khả năng gần nghĩa.
- source_word: μίαν τῶν ἐντολῶν τούτων τῶν ἐλαχίστων
  choice: một trong những điều răn nhỏ nhất này
  rationale: Giữ ý phân hạng của ἐλαχίστων và tạo câu tiếng Việt tự nhiên, dễ hiểu.
- source_word: διδάξῃ οὕτως τοὺς ἀνθρώπους
  choice: dạy người khác làm như thế
  rationale: “Người khác” truyền đạt tự nhiên đối tượng con người nói chung; “làm như thế” nêu rõ οὕτως quy chiếu về hành động bãi bỏ vừa nói.
- source_word: ἐλάχιστος κληθήσεται
  choice: sẽ bị gọi là nhỏ nhất
  rationale: Giữ thể bị động và nghĩa trực tiếp của καλέω; “bị” phù hợp với sắc thái bất lợi của vế này mà không giải thích thêm bản chất sự phán định.
- source_word: ἐν τῇ βασιλείᾳ τῶν οὐρανῶν
  choice: trong vương quốc thiên đàng
  rationale: “Vương quốc thiên đàng” là cách nói hiện đại, rõ nghĩa về quyền trị vì và phù hợp thành ngữ đặc trưng của Ma-thi-ơ.
- source_word: ποιήσῃ καὶ διδάξῃ
  choice: thực hành và dạy những điều ấy
  rationale: ποιέω trong ngữ cảnh điều răn mang nghĩa thi hành trong đời sống; “thực hành” tự nhiên hơn cách nói sát chữ “làm chúng”.
- source_word: οὗτος
  choice: người đó
  rationale: Giữ sức nhấn mạnh của đại từ chỉ định và làm nổi bật sự tương phản với người ở vế trước.
- source_word: μέγας
  choice: lớn
  rationale: Tương ứng trực tiếp với μέγας và duy trì đối lập cân xứng với “nhỏ nhất”, không biến thành cấp cao nhất.
theological_decisions:
- issue: Địa vị “nhỏ nhất/lớn” trong vương quốc
  choice: Giữ nguyên mô tả địa vị ở trong vương quốc, không diễn giải thành bị loại khỏi vương quốc hay thành một cấp thưởng kỹ thuật.
  alternative: Hiểu “nhỏ nhất” là bị loại khỏi vương quốc, hoặc “lớn” là một cấp bậc phần thưởng xác định.
  rationale: Bản Hy Lạp nói người ấy được gọi là nhỏ nhất “trong vương quốc thiên đàng”; bản dịch cần bảo tồn sự căng thẳng thần học này thay vì giải quyết nó.
- issue: Đối tượng của τοὺς ἀνθρώπους
  choice: Dịch là “người khác”, chỉ con người nói chung.
  alternative: Dịch theo hình thức giống đực là “những người nam”.
  rationale: Trong câu này ἀνθρώπους có lực quy chiếu phổ quát đến con người, không giới hạn ở nam giới; “người khác” vừa chính xác vừa tự nhiên trong tiếng Việt.
- issue: Chủ thể ngầm định của thể bị động κληθήσεται
  choice: Giữ thể bị động “sẽ bị/được gọi”, không nêu ai là người gọi.
  alternative: Diễn giải là “Đức Chúa Trời sẽ gọi” hoặc “sẽ được xem là”.
  rationale: Bản nguồn không nêu chủ thể; giữ thể bị động tránh quyết định thay cho văn bản liệu đây là thể bị động thần học hay sự nhìn nhận rộng hơn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng cấu trúc đối xứng “ai… còn ai…” để phản ánh hai vế Hy Lạp. Phân biệt “bị gọi” ở vế bất lợi và “được gọi” ở vế thuận lợi là cách diễn đạt tiếng Việt tự nhiên; cả hai đều giữ thể bị động của bản nguồn.
