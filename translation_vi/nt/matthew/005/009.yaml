revisions:
- from: Phước cho những người kiến tạo hòa bình, vì chính họ sẽ được gọi là những người con trai của Đức Chúa Trời.[a]
  to: Phước cho những người đem lại hòa bình, vì chính họ sẽ được gọi là con trai của Đức Chúa Trời.[a]
  rationale: Bản sửa thay một cách nói hơi hành chính bằng cách diễn đạt hiện đại, tự nhiên hơn cho hành động tạo lập hòa bình. Đồng thời lược “những người” trước “con trai” để câu Việt gọn và tự nhiên, nhưng vẫn giữ thuật ngữ giống đực của nguyên văn và chú thích nêu lựa chọn bao quát hơn. Không thêm diễn giải thần học.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T02:43:14Z'
review_pass:
  verdict: revise
  source_fidelity: Bản dịch giữ đúng cấu trúc lời chúc phước, quan hệ nguyên nhân của ὅτι, sắc thái nhấn mạnh của αὐτοὶ, thì tương lai bị động của κληθήσονται, và ngôn ngữ giống đực số nhiều của υἱοὶ θεοῦ. Tuy nhiên, “những người kiến tạo hòa bình” và đặc biệt “những người con trai” có phần nặng, kém tự nhiên; cụm sau còn thừa danh từ chỉ người so với “con trai.”
  naturalness: “Phước cho” phù hợp văn phong Kinh Thánh Việt ngữ hiện đại. “Những người đem lại hòa bình” diễn đạt tự nhiên hơn tác nhân chủ động của εἰρηνοποιοί mà không thu hẹp nghĩa thành chỉ người hòa giải. “Con trai của Đức Chúa Trời” tự nhiên và gọn hơn “những người con trai của Đức Chúa Trời.”
  terminology: Giữ “Đức Chúa Trời” nhất quán với bản thảo và “con trai” để phản ánh υἱοὶ (giống đực số nhiều). Chú thích cần nói rõ rằng cách nói này có thể bao hàm theo nghĩa đại diện, thay vì khiến độc giả hiểu bản văn chỉ nói đến nam giới.
  issues:
  - severity: medium
    issue: “những người kiến tạo hòa bình” không phải cách diễn đạt tự nhiên nhất trong tiếng Việt phổ thông hiện đại.
    rationale: “Kiến tạo” mang sắc thái hành chính/chính sách và hơi trừu tượng. “Đem lại hòa bình” giữ được nghĩa chủ động của εἰρηνοποιοί trong văn phong tự nhiên.
  - severity: low
    issue: “những người con trai của Đức Chúa Trời” thừa và gượng.
    rationale: “Con trai của Đức Chúa Trời” đã là một cụm số nhiều/generic theo ngữ cảnh; thêm “những người” không thêm nghĩa nguồn và làm câu nặng.
