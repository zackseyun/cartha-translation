  text: μακάριοι οἱ εἰρηνοποιοί, ὅτι αὐτοὶ υἱοὶ θεοῦ κληθήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/009.yaml
  text: Blessed are the peacemakers[a], because they will be called sons of God.
translation:
  language: vi
  text: Phước cho những người đem lại hòa bình, vì chính họ sẽ được gọi là con trai của Đức Chúa Trời.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “con cái của Đức Chúa Trời”. Tiếng Hy Lạp viết “các con trai của Đức Chúa Trời” (giống đực số nhiều); cách nói này có thể có ý nghĩa đại diện.
    reason: lexical_alternative
lexical_decisions:
- source_word: μακάριοι
  choice: Phước cho
  rationale: Cách diễn đạt quen thuộc trong các lời chúc phước, truyền đạt địa vị được Đức Chúa Trời ban ơn thay vì chỉ một cảm xúc chủ quan như “hạnh phúc”.
- source_word: εἰρηνοποιοί
  choice: những người kiến tạo hòa bình
  rationale: 'Diễn đạt tự nhiên vai trò chủ động của danh từ ghép Hy Lạp: những người làm nên hoặc đem lại hòa bình, chứ không chỉ là người có tính ôn hòa.'
- source_word: ὅτι
  choice: vì
  rationale: Giữ rõ quan hệ nguyên nhân hoặc cơ sở của lời chúc phước trong tiếng Việt hiện đại.
- source_word: αὐτοὶ
  choice: chính họ
  rationale: Thể hiện sắc thái nhấn mạnh của đại từ Hy Lạp mà vẫn tự nhiên trong cấu trúc câu tiếng Việt.
- source_word: υἱοὶ θεοῦ
  choice: những người con trai của Đức Chúa Trời
  rationale: Giữ ngôn ngữ thân phận con mang giống đực số nhiều của bản Hy Lạp và không âm thầm làm phẳng sắc thái ấy thành cách gọi trung tính.
- source_word: κληθήσονται
  choice: sẽ được gọi
  rationale: Phản ánh trực tiếp thể tương lai bị động của καλέω, không giới hạn ý nghĩa thành việc chỉ được xã hội nhìn nhận.
theological_decisions:
- issue: Ngôn ngữ chỉ thân phận làm con mang giống đực trong υἱοὶ θεοῦ
  choice: những người con trai của Đức Chúa Trời
  alternative: con cái của Đức Chúa Trời
  rationale: Bản văn Hy Lạp dùng danh từ giống đực số nhiều “các con trai”, có thể mang lực đại diện và gợi đến địa vị làm con. Bản dịch chính giữ hình thức này, còn chú thích nêu cách diễn đạt bao quát tự nhiên hơn trong tiếng Việt.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Kiến tạo hòa bình” nhấn mạnh hành động chủ động; “chính họ” giữ điểm nhấn của nguyên văn. Cụm “những người con trai của Đức Chúa Trời” được giữ có chủ ý dù kém thông dụng hơn “con cái của Đức Chúa Trời”, và được giải thích bằng chú thích.
