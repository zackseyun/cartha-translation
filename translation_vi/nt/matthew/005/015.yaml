- from: Người ta cũng không thắp đèn rồi đặt dưới một cái thúng[a], nhưng đặt trên giá đèn; và đèn soi sáng cho mọi người trong nhà.[b]
  to: Người ta cũng không thắp đèn rồi đặt nó dưới một cái thùng đong[a], nhưng đặt trên giá đèn; và nó soi sáng cho mọi người trong nhà.[b]
