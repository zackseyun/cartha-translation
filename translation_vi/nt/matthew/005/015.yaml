  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οὐδὲ καίουσιν λύχνον καὶ τιθέασιν αὐτὸν ὑπὸ τὸν μόδιον ἀλλ’ ἐπὶ τὴν λυχνίαν, καὶ λάμπει πᾶσιν τοῖς ἐν τῇ οἰκίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/015.yaml
  text: Nor do people light a lamp and put it under a basket[a], but on a lampstand[b], and it gives light to everyone in the house.
translation:
  language: vi
  text: Người ta cũng không thắp đèn rồi đặt nó dưới một cái thùng đong[a], nhưng đặt trên giá đèn; và nó soi sáng cho mọi người trong nhà.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “dưới một dụng cụ đong”. Từ Hy Lạp μόδιος chỉ một đơn vị đo đồ khô và, theo nghĩa mở rộng, vật chứa dùng để đong.
    reason: lexical_alternative
  - marker: b
    text: 'Hoặc: “và nó tỏa sáng cho mọi người trong nhà.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδὲ
  choice: cũng không
  rationale: Nối ví dụ phủ định này với lời ngay trước đó một cách tự nhiên trong tiếng Việt, đồng thời giữ lực liên kết của οὐδέ.
- source_word: καίουσιν λύχνον
  choice: thắp đèn
  rationale: Đây là cách diễn đạt tự nhiên cho hành động châm một ngọn đèn dầu; giữ hình ảnh cụ thể của λύχνος.
- source_word: τιθέασιν αὐτὸν
  choice: đặt
  rationale: Động từ đơn giản, hiện đại, phù hợp với hành động đặt chiếc đèn vào một vị trí.
- source_word: ὑπὸ τὸν μόδιον
  choice: dưới một cái thúng
  rationale: μόδιος là đơn vị đo đồ khô và cũng chỉ vật chứa dùng để đong. “Cái thúng” truyền đạt rõ hình ảnh vật chứa có thể úp lên đèn; chú thích bảo tồn nét nghĩa đo lường.
- source_word: ἐπὶ τὴν λυχνίαν
  choice: trên giá đèn
  rationale: λυχνία là vật kê hoặc giá dùng để đặt đèn; “giá đèn” rõ nghĩa và trang trọng vừa phải.
- source_word: λάμπει
  choice: đèn soi sáng
  rationale: Diễn đạt tự nhiên chức năng và tác dụng của chiếc đèn đối với những người trong nhà, đồng thời làm rõ chủ thể trong tiếng Việt.
- source_word: πᾶσιν τοῖς ἐν τῇ οἰκίᾳ
  choice: cho mọi người trong nhà
  rationale: Giữ phạm vi phổ quát của πᾶσιν và nét nghĩa không gian của οἰκίᾳ.
theological_decisions:
- issue: Chủ ngữ số nhiều mang nghĩa khái quát không được nêu rõ trong tiếng Hy Lạp
  choice: Người ta cũng không thắp đèn
  alternative: Cũng chẳng ai thắp đèn
  rationale: “Người ta” bảo tồn cách nói khái quát của động từ số nhiều Hy Lạp mà không tạo ra một chủ thể cụ thể hay thu hẹp thành số ít.
- issue: Quan hệ cú pháp của καὶ λάμπει πᾶσιν
  choice: và đèn soi sáng cho mọi người trong nhà
  alternative: và đèn chiếu sáng mọi người trong nhà
  rationale: Cách chọn này phản ánh tự nhiên ý chiếc đèn phát ánh sáng vì lợi ích của mọi người, nhưng không biến hình ảnh thành một diễn giải thần học.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, rõ ràng và trang trọng vừa phải. “Cái thúng” dễ hình dung hơn thuật ngữ đơn vị đo cổ; sắc thái đo lường được giữ trong chú thích. Các dấu chú thích [a], [b] đều xuất hiện trong câu chính.
