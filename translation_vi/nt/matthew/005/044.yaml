  text: ἐγὼ δὲ λέγω ὑμῖν, ἀγαπᾶτε τοὺς ἐχθροὺς ⸀ὑμῶν καὶ προσεύχεσθε ὑπὲρ ⸀τῶν διωκόντων ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/044.yaml
  text: But I say to you[a], love your enemies and pray for those who persecute you.
translation:
  language: vi
  text: 'Nhưng Ta bảo anh em: Hãy yêu kẻ thù của anh em và cầu nguyện cho những kẻ bắt bớ anh em.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Cầu nguyện cho” cũng có thể dịch là “cầu nguyện vì lợi ích của” hoặc “cầu nguyện thay mặt cho.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγὼ δὲ λέγω ὑμῖν
  choice: Nhưng Ta nói với các con
  rationale: Giữ sắc thái tương phản của δέ và sự nhấn mạnh của ἐγώ; cách xưng hô “Ta—các con” trang trọng, tự nhiên trong lời Đức Giê-su dạy các môn đồ.
- source_word: ἀγαπᾶτε
  choice: Hãy yêu
  rationale: Chuyển tải trực tiếp mệnh lệnh hiện tại mà không diễn giải thêm loại tình yêu hoặc mọi hệ quả thực hành của mệnh lệnh.
- source_word: τοὺς ἐχθροὺς ὑμῶν
  choice: kẻ thù của mình
  rationale: Diễn đạt rõ quan hệ sở hữu và giữ nguyên ý nghĩa về những người có thái độ thù nghịch; “của mình” tránh lặp đại từ mà vẫn quy chiếu tự nhiên đến người nghe.
- source_word: προσεύχεσθε
  choice: cầu nguyện
  rationale: Tương đương thông dụng, tự nhiên của προσεύχομαι và giữ nguyên lực mệnh lệnh nhờ cấu trúc “Hãy” dùng chung cho hai động từ.
- source_word: ὑπὲρ
  choice: cho
  rationale: Với sở hữu cách, ὑπέρ ở đây chỉ việc cầu nguyện vì lợi ích hoặc thay mặt người khác; “cho” là cách nói tự nhiên nhất trong tiếng Việt.
- source_word: τῶν διωκόντων ὑμᾶς
  choice: những người bắt bớ các con
  rationale: Giữ dạng diễn đạt bằng động từ của phân từ hiện tại và thể hiện hành động thù nghịch đang diễn ra hoặc có tính lặp lại.
theological_decisions:
- issue: Phạm vi của mệnh lệnh đối với kẻ thù
  choice: Dịch thẳng cả hai mệnh lệnh là yêu kẻ thù và cầu nguyện cho người bắt bớ, không thêm nội dung về cảm xúc, sự bất kháng, sự chúc phước hay sự ăn năn.
  alternative: Diễn giải “yêu” chủ yếu là hành động nhân từ, hoặc mở rộng lời cầu nguyện thành cầu xin họ được ban phước hay ăn năn.
  rationale: Bản văn nêu mệnh lệnh nhưng không tự xác định toàn bộ nội hàm thực hành hoặc nội dung cụ thể của lời cầu nguyện; bản dịch cần giữ sức căng đạo đức mà không áp đặt cách giải thích giáo phái.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “Ta—các con” phù hợp văn cảnh Đức Giê-su trực tiếp dạy các môn đồ; câu ngắn, rõ, giữ cấu trúc tương phản và hai mệnh lệnh của nguyên văn.
