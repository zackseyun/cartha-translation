revisions:
- from: 'Nhưng Ta nói với các con: Hãy yêu kẻ thù của mình và cầu nguyện cho những người bắt bớ các con.[a]'
  to: 'Nhưng Ta bảo anh em: Hãy yêu kẻ thù của anh em và cầu nguyện cho những kẻ bắt bớ anh em.[a]'
  rationale: Bản sửa giữ tương phản của δέ, sự nhấn mạnh của ἐγώ qua “Ta,” hai mệnh lệnh hiện tại, và ý nghĩa không diễn giải thêm của ὑπὲρ. “Anh em” thay cho “các con” tránh bổ sung quan hệ cha-con; chú thích được sửa để nêu đúng các khả năng tự nhiên của ὑπὲρ trong ngữ cảnh này.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T02:47:11Z'
review_pass:
  verdict: revise
  source_fidelity: Hai mệnh lệnh và ý nghĩa cơ bản của ὑπὲρ với sở hữu cách đều được chuyển đạt đúng. Tuy nhiên, cặp xưng hô “Ta—các con” thêm sắc thái cha-con không được biểu thị trong nguyên văn, và “thay cho” dễ chuyển nghĩa sang việc cầu nguyện thay vì ai đó cầu nguyện.
  naturalness: Câu văn rõ và tự nhiên. “Ta—anh em” là cách xưng hô trang trọng, quen thuộc trong văn phong Kinh Thánh tiếng Việt hiện đại và tránh thu hẹp người nghe thành quan hệ con cái.
  terminology: “Yêu,” “kẻ thù,” “cầu nguyện,” và “bắt bớ” phù hợp với các thuật ngữ then chốt. Cần sửa chú thích để diễn đạt nghĩa “vì lợi ích/thay mặt” của ὑπὲρ, không phải “thay cho” theo nghĩa làm thay.
  issues:
  - severity: medium
    issue: Cặp xưng hô “Ta—các con” thêm sắc thái quan hệ cha-con.
    rationale: ὑμῖν/ὑμῶν/ὑμᾶς chỉ ngôi hai số nhiều, không nêu quan hệ con cái. “Anh em” giữ số nhiều và phù hợp hơn với cách xưng hô phổ biến trong lời dạy của Đức Giê-su mà không thêm nghĩa.
  - severity: medium
    issue: Chú thích “cầu nguyện thay cho” không diễn đạt chính xác lựa chọn ngữ nghĩa của ὑπὲρ.
    rationale: Trong tiếng Việt, “cầu nguyện thay cho” thường có thể hiểu là cầu nguyện thay người khác, tức thực hiện hành động thay họ. Ở đây ὑπὲρ + sở hữu cách có nghĩa cầu nguyện vì lợi ích hoặc thay mặt những người bắt bớ.
