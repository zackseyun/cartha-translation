id: MAT.5.36
reference: Matthew 5:36
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: μήτε ἐν τῇ κεφαλῇ σου ὀμόσῃς, ὅτι οὐ δύνασαι μίαν τρίχα λευκὴν ⸂ποιῆσαι ἢ μέλαιναν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/036.yaml
  text: Nor shall you swear by your head[a], because you are not able to make one hair white or black.
translation:
  language: vi
  text: Cũng đừng lấy đầu mình mà thề, vì không thể làm cho dù chỉ một sợi tóc hóa trắng hay đen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “vì không thể biến một sợi tóc thành trắng hay đen.”'
    reason: Cách diễn đạt thay thế cho cấu trúc gây khiến ποιῆσαι với các tính từ vị ngữ.
lexical_decisions:
- source_word: μήτε
  choice: Cũng đừng
  rationale: Tiếp nối chuỗi điều cấm ở các câu trước; cách diễn đạt này tự nhiên trong tiếng Việt và giữ được quan hệ phối hợp phủ định.
- source_word: ἐν τῇ κεφαλῇ σου
  choice: lấy đầu mình mà
  rationale: Trong ngữ cảnh ὀμόσῃς, giới từ ἐν chỉ điều được viện ra để thề; “lấy… mà thề” là thành ngữ tiếng Việt rõ nghĩa.
- source_word: ὀμόσῃς
  choice: thề
  rationale: Diễn đạt trực tiếp động từ chỉ hành vi thề; kết hợp với “đừng” để thể hiện mệnh lệnh cấm.
- source_word: ὅτι
  choice: vì
  rationale: 'Giữ quan hệ nguyên nhân: sự bất lực của con người là lý do cho điều cấm.'
- source_word: οὐ δύνασαι
  choice: không thể
  rationale: Diễn đạt ngắn gọn, tự nhiên và chính xác ý bất lực hay không có khả năng.
- source_word: μίαν τρίχα
  choice: dù chỉ một sợi tóc
  rationale: “Một sợi tóc” phản ánh số ít; “dù chỉ” làm nổi bật ý ngay cả một đơn vị nhỏ nhất mà không thêm nội dung ngoài dụng ý nhấn mạnh của μίαν.
- source_word: λευκὴν ... ἢ μέλαιναν
  choice: trắng hay đen
  rationale: Giữ nguyên hai màu tương phản cơ bản của bản Hy Lạp, không diễn giải “trắng” thành “bạc”.
- source_word: ποιῆσαι
  choice: làm cho ... hóa
  rationale: Thể hiện nghĩa gây khiến của ποιέω khi đi với các tính từ chỉ màu sắc, đồng thời tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Phạm vi của điều cấm thề
  choice: Dịch trực tiếp điều cấm lấy đầu mình mà thề, không mở rộng thành tuyên bố giáo lý tuyệt đối về mọi lời thề.
  alternative: Hiểu là cấm mọi hình thức thề trong mọi hoàn cảnh, hoặc chỉ cấm các công thức thề nhằm lách luật.
  rationale: Câu này cụ thể nói đến việc lấy đầu mình mà thề và nêu lý do là giới hạn năng lực của con người. Bản dịch giữ nguyên phạm vi và sức căng của lời nói mà không giải quyết cuộc tranh luận rộng hơn.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Lược chủ ngữ ở vế sau để giữ tính khái quát của lời dạy, tránh dùng “ngươi” cổ kính hoặc chọn một đại từ xưng hô có sắc thái xã hội không có trong nguyên văn.
