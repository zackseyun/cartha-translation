review_pass:
  verdict: revise
  source_fidelity: Bản nháp truyền đạt đúng công thức xác quyết ἀμὴν λέγω σοι, phủ định nhấn mạnh οὐ μή, hướng chuyển động trong ἐκεῖθεν, và điều kiện hoàn tất trong ἕως ἂν ἀποδῷς. Tuy nhiên, “trả hết đồng quadrans cuối cùng” có thể bị hiểu là trả hết một đồng tiền, thay vì trả cho đến đồng tiền cuối cùng. Cần đặt “đồng quadrans cuối cùng” sau động từ để cấu trúc tiếng Việt rõ nghĩa hơn.
  naturalness: “Quả thật, tôi bảo anh” là lối mở đầu trang trọng, tự nhiên và quen thuộc trong văn phong Kinh Thánh hiện đại. “Anh chắc chắn sẽ không ra khỏi đó” diễn đạt rõ lực nhấn mạnh mà không quá gượng. “Cho đến khi anh trả đồng quadrans cuối cùng” tự nhiên hơn và tránh sự mơ hồ cú pháp của bản nháp.
  terminology: Giữ “quadrans” là phù hợp vì κοδράντης là tên một đồng tiền La Mã cụ thể. Chú thích văn hóa hiện có chính xác; có thể thêm rằng đây là một đồng tiền nhỏ để giải thích trực tiếp hơn mà không quy đổi sai sang tiền hiện đại.
  issues:
  - severity: medium
    issue: Cú pháp “trả hết đồng quadrans cuối cùng” mơ hồ.
    rationale: Trong tiếng Việt, cụm này có thể gợi ý rằng chỉ một đồng quadrans cuối cùng được “trả hết”, thay vì ý nguyên văn là người ấy phải trả cho đến đồng tiền cuối cùng. Chuyển thành “trả đồng quadrans cuối cùng” sau mệnh đề “cho đến khi” bảo toàn hình ảnh và rõ nghĩa hơn.
  - severity: low
    issue: “Thật” đứng riêng trước dấu phẩy hơi cụt trong khẩu ngữ hiện đại.
    rationale: “Quả thật” là một công thức trang trọng, trôi chảy hơn cho ἀμὴν trong tiếng Việt hiện đại, đồng thời không thêm ý nghĩa.
