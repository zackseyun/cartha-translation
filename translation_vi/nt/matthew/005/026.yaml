  text: ἀμὴν λέγω σοι, οὐ μὴ ἐξέλθῃς ἐκεῖθεν ἕως ἂν ἀποδῷς τὸν ἔσχατον κοδράντην.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/026.yaml
  text: Truly I tell you[b][a], you will certainly not get out of there until you have paid the last quadrans.
translation:
  language: vi
  text: 'Quả thật, tôi bảo anh: anh chắc chắn sẽ không ra khỏi đó cho đến khi anh trả đồng quadrans cuối cùng.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Quadrans là một đồng tiền La Mã nhỏ.
    reason: cultural_note
lexical_decisions:
- source_word: ἀμὴν
  choice: Thật
  rationale: Trong công thức ἀμὴν λέγω σοι của các sách Tin Mừng Nhất Lãm, từ này mở đầu một lời khẳng định long trọng. “Thật” truyền đạt tự nhiên sức nặng xác quyết mà không giữ nguyên từ vay mượn “A-men”.
- source_word: λέγω σοι
  choice: tôi bảo anh
  rationale: Cách nói này trực tiếp và tự nhiên trong tiếng Việt hiện đại. Đại từ số ít “anh” phản ánh σοι và phù hợp với lời nói trực tiếp trong văn cảnh, nhưng không xác định người nghe theo nghĩa giáo lý.
- source_word: οὐ μὴ ἐξέλθῃς
  choice: anh chắc chắn sẽ không ra
  rationale: οὐ μή đi với động từ giả định thức aorist là lối phủ định nhấn mạnh. “Chắc chắn sẽ không” giữ được cường độ ấy mà vẫn là tiếng Việt hiện đại.
- source_word: ἐκεῖθεν
  choice: khỏi đó
  rationale: Từ này chỉ chuyển động rời khỏi một nơi. “Ra khỏi đó” là cách diễn đạt tự nhiên, hợp với hình ảnh bị giam giữ trong văn cảnh.
- source_word: ἕως ἂν ἀποδῷς
  choice: cho đến khi trả hết
  rationale: Cấu trúc chỉ điểm kết thúc trong tương lai, còn aorist nhấn vào việc hoàn tất. “Trả hết” diễn đạt cả ý trả khoản nợ và hoàn tất việc trả.
- source_word: τὸν ἔσχατον
  choice: cuối cùng
  rationale: Giữ hình ảnh phải trả đến đồng tiền cuối cùng, tức toàn bộ khoản nợ, mà không thêm mức nhấn mạnh không có trong nguyên văn.
- source_word: κοδράντην
  choice: đồng quadrans
  rationale: Đây là tên một đồng tiền La Mã cụ thể, bắt nguồn từ tiếng La-tinh quadrans. Giữ tên đồng tiền giúp tránh thay bằng một đơn vị tiền Việt hoặc một đồng tiền lịch sử khác gây sai lệch; chú thích giải thích yếu tố văn hóa.
theological_decisions:
- issue: Có nên diễn giải lời này rõ ràng thành phán xét cuối cùng, sự thanh luyện, hay chỉ là cảnh pháp lý về nợ và tù
  choice: Giữ nguyên hình ảnh cụ thể về việc bị giam cho đến khi trả hết nợ
  alternative: Diễn giải thành sự phán xét của Đức Chúa Trời hoặc một giáo lý về sự thanh luyện sau khi chết
  rationale: Nguyên văn chỉ nói người ấy chắc chắn không ra khỏi đó cho đến khi trả đồng tiền cuối cùng. Bản dịch không áp đặt kết luận giáo lý mà câu Hy Lạp không nói rõ, nhờ đó giữ được sức căng giữa văn cảnh hòa giải và khả năng hàm ý phán xét.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Thật, tôi bảo anh” để bảo toàn công thức xác quyết trực tiếp; giữ “quadrans” kèm chú thích vì tiếng Việt không có đơn vị tương đương chính xác. Chỉ đặt một dấu chú thích [a] ngay sau tên đồng tiền.
