    rationale: Cách này vừa không thật tự nhiên trong cấu trúc câu tiếng Việt, vừa có thể gợi một chủ thể thần linh cụ thể cho ἐρρέθη, trong khi tiếng Hy Lạp chỉ dùng bị động vô nhân xưng.
  - severity: low
    issue: “Các con”
    rationale: Nguyên văn chỉ có ngôi thứ hai số nhiều. “Các con” thêm sắc thái quan hệ cha/con hoặc thầy/trò; “Anh em” giữ lối xưng hô cộng đồng rộng và trung tính hơn.
