  source_fidelity: Cụm “Mắt đền mắt, răng đền răng” truyền đạt tốt công thức pháp lý song hành với ἀντί. Tuy nhiên, “lời phán” có sắc thái một chủ thể thần linh đang phán và không diễn đạt tự nhiên thể bị động vô nhân xưng ἐρρέθη. “Các con” cũng thu hẹp cách xưng hô số nhiều của nguyên văn hơn mức cần thiết.
  naturalness: Bản sửa dùng “Anh em đã nghe lời truyền dạy rằng” là cách nói trang trọng, hiện đại và tự nhiên trong văn mạch giáo huấn, đồng thời tránh lối “lời phán rằng” hơi gượng trong tiếng Việt hiện nay.
  terminology: Giữ nguyên công thức quen thuộc “Mắt đền mắt, răng đền răng” vì ngắn gọn, cân đối, và không giải thích trước nguyên tắc báo trả tương xứng. Chú thích dùng “thay cho” để nêu rõ sắc thái sát chữ của ἀντί.
  issues:
