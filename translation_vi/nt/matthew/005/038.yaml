  text: Ἠκούσατε ὅτι ἐρρέθη· Ὀφθαλμὸν ἀντὶ ὀφθαλμοῦ καὶ ὀδόντα ἀντὶ ὀδόντος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/038.yaml
  text: You have heard that it was said[a], ‘An eye for an eye and a tooth for a tooth.’
translation:
  language: vi
  text: 'Anh em đã nghe lời truyền dạy rằng: “Mắt đền mắt, răng đền răng.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát hơn: “Mắt thay cho mắt, răng thay cho răng.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἠκούσατε
  choice: Các con đã nghe
  rationale: Thì quá khứ trong công thức dẫn nhập của Ma-thi-ơ nói đến lời truyền dạy mà người nghe đã tiếp nhận; “đã nghe” vừa tự nhiên trong tiếng Việt vừa giữ được hình thái quá khứ.
- source_word: ὅτι ἐρρέθη
  choice: lời phán rằng
  rationale: Diễn đạt tự nhiên cấu trúc bổ ngữ cùng thể bị động vô nhân xưng “đã được nói”; “phán” phù hợp với lời có thẩm quyền được trích dẫn, nhưng không nêu đích danh người phán.
- source_word: Ὀφθαλμὸν ἀντὶ ὀφθαλμοῦ
  choice: Mắt đền mắt
  rationale: Thành ngữ pháp lý Việt ngữ quen thuộc, diễn đạt ngắn gọn quan hệ tương xứng hoặc thay thế của ἀντί.
- source_word: καὶ ὀδόντα ἀντὶ ὀδόντος
  choice: răng đền răng
  rationale: Giữ phép song hành cân đối của câu châm ngôn pháp lý và lặp lại cùng sắc thái của ἀντί.
theological_decisions:
- issue: Cách dịch nguyên tắc báo trả tương xứng trong luật pháp
  choice: Mắt đền mắt, răng đền răng
  alternative: Một mắt thay cho một mắt, một răng thay cho một răng
  rationale: Cách nói quen thuộc này phản ánh chính xác công thức Hy Lạp và không tự quyết định câu ấy đòi báo thù cá nhân, hình phạt theo nghĩa đen hay chỉ sự bồi hoàn tương xứng.
- issue: Chủ thể của ἐρρέθη
  choice: Giữ cách nói không nêu chủ thể qua “lời phán rằng”
  alternative: Đức Chúa Trời đã phán rằng / người xưa đã được dạy rằng
  rationale: Bản Hy Lạp dùng thể bị động vô nhân xưng, nên không nên thêm một chủ thể không được nói rõ trong câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ nhớ. “Các con” thể hiện lời Đức Giê-su trực tiếp dạy các môn đồ và đám đông; “đền” giữ nhịp cân đối của công thức pháp lý quen thuộc. Dấu chú thích [a] đặt ngay sau lời trích dẫn.
