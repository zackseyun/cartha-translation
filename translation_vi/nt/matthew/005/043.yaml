base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/043.yaml
  text: You have heard that it was said[a], ‘You shall love your neighbor and hate your enemy.’
translation:
  language: vi
  text: 'Anh em đã nghe rằng[a]: ‘Hãy yêu người lân cận của mình và ghét kẻ thù của mình.’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mệnh đề đầu gợi lại Lê-vi Ký 19:18. Mệnh đề thứ hai (“và ghét kẻ thù của mình”) không phải là lời trích trực tiếp từ Cựu Ước, nhưng phản ánh lời dạy đã được lưu truyền mà Chúa Giê-su đang sửa lại.
    reason: cross_reference
lexical_decisions:
- source_word: Ἠκούσατε
  choice: Anh em đã nghe
  rationale: Thì aorist trong công thức mở đầu này chỉ điều người nghe đã tiếp nhận trước đó; “đã nghe” tự nhiên trong tiếng Việt và giữ được ý ấy. “Anh em” diễn đạt ngôi thứ hai số nhiều trong văn cảnh Chúa Giê-su nói với những người nghe.
- source_word: ἐρρέθη
  choice: lời dạy rằng
  rationale: Động từ bị động vô nhân xưng có nghĩa đen là “đã được nói”. Cách diễn đạt “lời dạy rằng” tự nhiên hơn trong tiếng Việt, vẫn không xác định người nói và cho thấy đây là điều được truyền dạy.
- source_word: Ἀγαπήσεις
  choice: Hãy yêu
  rationale: Thì tương lai ở đây mang lực mệnh lệnh trong lời trích dẫn; “hãy yêu” là cách truyền đạt rõ ràng và tự nhiên bằng tiếng Việt.
- source_word: τὸν πλησίον σου
  choice: người lân cận mình
  rationale: Trong ngữ cảnh đạo đức và sự liên hệ với Lê-vi Ký 19:18, πλησίον chỉ người lân cận. “Mình” quy chiếu tự nhiên về chủ thể của mệnh lệnh.
- source_word: μισήσεις
  choice: ghét
  rationale: Động từ nằm trong cùng lời dạy được thuật lại; lực mệnh lệnh của nó được hiểu song song với “hãy yêu”, trong khi cách lược “hãy” thứ hai giúp câu tiếng Việt tự nhiên.
- source_word: τὸν ἐχθρόν σου
  choice: kẻ thù mình
  rationale: ἐχθρός trong thế đối lập đạo đức này được dịch trực tiếp là “kẻ thù”; “mình” giữ quan hệ sở hữu với người nghe.
theological_decisions:
- issue: Địa vị của mệnh đề “và ghét kẻ thù mình”
  choice: Trình bày mệnh đề này như một phần của lời dạy mà người nghe đã nghe, nhưng không ngụ ý rằng toàn bộ lời ấy là trích dẫn trực tiếp từ Cựu Ước.
  alternative: Coi cả hai mệnh đề đều là lời trích nguyên văn từ Kinh Thánh, hoặc xác định ngay trong chính văn rằng mệnh đề thứ hai chỉ là truyền thống diễn giải.
  rationale: Bản Hy Lạp đặt cả hai mệnh đề trong một lời được thuật lại sau công thức “anh em đã nghe lời dạy rằng”. Tuy nhiên, chỉ mệnh đề đầu vọng lại Lê-vi Ký 19:18; chú thích làm rõ điều này mà không giải quyết thay sự căng thẳng của chính văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh em” cho ngôi thứ hai số nhiều trong diễn từ, “người lân cận” cho thuật ngữ Kinh Thánh quen thuộc nhưng vẫn tự nhiên, và tránh thêm chủ thể cho thể bị động vô nhân xưng.
