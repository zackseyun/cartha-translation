id: MAT.5.5
reference: Matthew 5:5
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: μακάριοι οἱ πραεῖς, ὅτι αὐτοὶ κληρονομήσουσι τὴν γῆν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/005.yaml
  text: Blessed are the meek[b][a], because they will inherit the earth.
translation:
  language: vi
  text: Phước cho những người nhu hòa[b], vì chính họ sẽ thừa hưởng đất[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “trái đất” hoặc “xứ”. Cụm từ này có lẽ gợi lại Thi Thiên 37:11; vì thế, lời hứa có thể được hiểu theo cách gắn với đất hứa trong giao ước, hoặc theo nghĩa rộng hơn.
    reason: alternative_reading
  - marker: b
    text: “Nhu hòa” chỉ sự khiêm nhường, dịu dàng và biết tự chủ, chứ không phải yếu đuối.
    reason: lexical_alternative
lexical_decisions:
- source_word: μακάριοι
  choice: Phước cho
  rationale: Công thức tự nhiên, trang trọng trong các lời chúc phước; diễn đạt tình trạng được Đức Chúa Trời ban ơn, không thu hẹp thành cảm xúc vui vẻ chủ quan.
- source_word: οἱ πραεῖς
  choice: những người nhu hòa
  rationale: Diễn đạt sự khiêm nhường, dịu dàng và biết tự chủ, chứ không hàm ý yếu đuối; dạng có mạo từ trong Hy Lạp được chuyển thành danh ngữ chỉ một nhóm người.
- source_word: ὅτι
  choice: vì
  rationale: Giới thiệu lý do hoặc cơ sở của lời chúc phước một cách ngắn gọn, tự nhiên trong tiếng Việt.
- source_word: αὐτοὶ
  choice: chính họ
  rationale: Giữ sắc thái nhấn mạnh của đại từ Hy Lạp mà vẫn tự nhiên trong câu.
- source_word: κληρονομήσουσι
  choice: sẽ thừa hưởng
  rationale: Giữ ý nhận phần gia nghiệp và âm hưởng của lời hứa giao ước, đồng thời là cách nói dễ hiểu trong tiếng Việt hiện đại.
- source_word: τὴν γῆν
  choice: đất
  rationale: Từ Việt ngữ này giữ được độ mở của γῆ, có thể chỉ đất/đất đai trong âm hưởng Thi Thiên 37:11 hoặc rộng hơn là toàn thể địa cầu.
theological_decisions:
- issue: Phạm vi nghĩa của τὴν γῆν
  choice: đất
  alternative: trái đất; xứ
  rationale: γῆ có thể mang nghĩa phổ quát là trái đất hoặc nghĩa gắn với lời hứa giao ước là đất/xứ. Chọn “đất” trong chính văn để không giải quyết thay độc giả sự căng thẳng có chủ ý này; chú thích nêu rõ hai khả năng.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Cấu trúc ngắn gọn giữ nhịp của lời chúc phước; “chính họ” bảo toàn sắc thái nhấn mạnh của αὐτοὶ.
