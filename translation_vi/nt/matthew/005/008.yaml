id: MAT.5.8
reference: Matthew 5:8
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: μακάριοι οἱ καθαροὶ τῇ καρδίᾳ, ὅτι αὐτοὶ τὸν θεὸν ὄψονται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/008.yaml
  text: Blessed are the pure in heart[b][a], because they will see God.
translation:
  language: vi
  text: Phước cho những người có lòng trong sạch[a], vì chính họ sẽ thấy Đức Chúa Trời[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “có tấm lòng thanh sạch.”'
    reason: lexical_alternative
  - marker: b
    text: Lời hứa “sẽ thấy Đức Chúa Trời” có thể nói đến việc được trực tiếp ở trong sự hiện diện của Ngài, kể cả sự hoàn tất của lời hứa ấy trong tương lai; bản dịch giữ nguyên cách diễn đạt mà không giới hạn ý nghĩa.
    reason: alternative_reading
lexical_decisions:
- source_word: μακάριοι
  choice: Phước cho
  rationale: Cách diễn đạt gọn, tự nhiên trong thể loại Các Mối Phước, nói đến tình trạng được Đức Chúa Trời ban ơn chứ không chỉ một cảm xúc vui vẻ chủ quan.
- source_word: καθαροὶ
  choice: trong sạch
  rationale: Diễn đạt sự tinh sạch về mặt nội tâm và đạo đức trong ngữ cảnh; đồng thời tránh khiến người đọc chỉ nghĩ đến sự sạch sẽ bên ngoài hay nghi lễ.
- source_word: τῇ καρδίᾳ
  choice: có lòng
  rationale: Cách nói tự nhiên trong tiếng Việt, chỉ con người bên trong—ý hướng, tư tưởng và ước muốn—chứ không chỉ cảm xúc.
- source_word: ὅτι
  choice: vì
  rationale: Giới thiệu lý do hoặc cơ sở của lời tuyên bố phước lành một cách rõ ràng và tự nhiên.
- source_word: αὐτοὶ
  choice: chính họ
  rationale: Giữ sắc thái nhấn mạnh của đại từ Hy Lạp, xác định rằng chính những người ấy sẽ nhận lời hứa.
- source_word: τὸν θεὸν
  choice: Đức Chúa Trời
  rationale: Cách gọi trang trọng, rõ nghĩa và thông dụng trong văn phong Kinh Thánh tiếng Việt.
- source_word: ὄψονται
  choice: sẽ thấy
  rationale: Chuyển tải trực tiếp lời hứa ở thì tương lai mà không giải thích hẹp hơn bản văn.
theological_decisions:
- issue: Ý nghĩa của lời hứa “sẽ thấy Đức Chúa Trời”
  choice: Giữ nguyên cách nói trực tiếp “sẽ thấy Đức Chúa Trời”.
  alternative: Sẽ kinh nghiệm sự hiện diện của Đức Chúa Trời; hoặc sẽ chiêm ngưỡng Đức Chúa Trời trong thời kỳ hoàn tất cuối cùng.
  rationale: Câu Hy Lạp ngắn gọn và có chiều sâu thần học, có thể bao hàm việc trực tiếp ở trong sự hiện diện của Đức Chúa Trời và sự hoàn tất trong tương lai. Bản dịch không thu hẹp lời hứa vào một cách giải thích duy nhất.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Cấu trúc “Phước cho…” giữ nhịp cô đọng của một mối phước; “chính họ” bảo toàn điểm nhấn của αὐτοὶ.
