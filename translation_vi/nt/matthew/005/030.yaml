    issue: Cụm “quăng nó khỏi mình” không tự nhiên.
    rationale: Dù bám sát ἀπὸ σοῦ, cách kết hợp này gượng trong tiếng Việt. “Quăng nó đi” là cách nói tự nhiên cho hành động vứt bỏ dứt khoát và không làm thay đổi nghĩa của câu.
