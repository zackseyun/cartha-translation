id: MAT.5.30
reference: Matthew 5:30
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ εἰ ἡ δεξιά σου χεὶρ σκανδαλίζει σε, ἔκκοψον αὐτὴν καὶ βάλε ἀπὸ σοῦ, συμφέρει γάρ σοι ἵνα ἀπόληται ἓν τῶν μελῶν σου καὶ μὴ ὅλον τὸ σῶμά σου ⸂εἰς γέενναν ἀπέλθῃ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/030.yaml
  text: And if your right hand causes you to stumble[a], cut it off and throw it away[c][b]. For it is better for you that one of your members should perish than that your whole body should go into Gehenna.
translation:
  language: vi
  text: Nếu tay phải của anh em khiến anh em vấp ngã[a], hãy chặt nó đi và quăng nó đi. Vì thà để một bộ phận thân thể của anh em bị mất còn hơn để cả thân thể đi vào Ghê-hen-na[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “khiến anh em phạm tội.” Động từ Hy Lạp theo nghĩa đen là “khiến vấp ngã.”
    reason: lexical_alternative
  - marker: b
    text: Hay “hỏa ngục.” Ghê-hen-na là tên bắt nguồn từ Thung lũng Hin-nôm và được dùng để nói về sự phán xét sau cùng.
    reason: alternative_reading
lexical_decisions:
- source_word: δεξιά σου χεὶρ
  choice: tay phải của anh em
  rationale: Cách diễn đạt tự nhiên trong tiếng Việt, giữ nguyên hình ảnh cụ thể và thế đối xứng với câu trước.
- source_word: σκανδαλίζει σε
  choice: khiến anh em vấp ngã
  rationale: Giữ hình ảnh ẩn dụ 'làm vấp ngã' của động từ Hy Lạp, đồng thời chú thích nghĩa theo ngữ cảnh là dẫn đến phạm tội.
- source_word: ἔκκοψον αὐτήν
  choice: hãy chặt nó đi
  rationale: Thể hiện mệnh lệnh dứt khoát và phù hợp tự nhiên với hình ảnh bàn tay.
- source_word: βάλε ἀπὸ σοῦ
  choice: quăng nó khỏi mình
  rationale: Giữ cả sắc thái mạnh của βάλε lẫn ý tách vật ấy ra xa bản thân trong ἀπὸ σοῦ.
- source_word: συμφέρει γάρ σοι
  choice: Vì thà ... còn hơn
  rationale: Chuyển cấu trúc chỉ lợi ích so sánh sang mẫu câu tiếng Việt tự nhiên, vẫn giữ nguyên sự tương phản nghiêm trọng của lời cảnh báo.
- source_word: ἵνα ἀπόληται
  choice: để ... bị mất
  rationale: Trong ngữ cảnh một bộ phận thân thể, 'bị mất' tự nhiên hơn 'bị hủy diệt' nhưng vẫn giữ ý tổn thất hoàn toàn.
- source_word: ἓν τῶν μελῶν σου
  choice: một bộ phận thân thể của anh em
  rationale: Diễn đạt rõ nghĩa μέλος là một phần của thân thể; tránh 'chi thể', vốn ít thông dụng, và 'chi', vốn quá hẹp.
- source_word: ὅλον τὸ σῶμά σου
  choice: cả thân thể
  rationale: Giữ rõ sự tương phản giữa một bộ phận và toàn thể.
- source_word: εἰς γέενναν ἀπέλθῃ
  choice: đi vào Ghê-hen-na
  rationale: Phản ánh trực tiếp động từ chỉ việc đi và giới từ chỉ hướng; giữ địa danh-thuật ngữ γέεννα thay vì đồng nhất không chú giải với các quan niệm về 'hỏa ngục'.
theological_decisions:
- issue: Cách dịch γέεννα
  choice: Ghê-hen-na
  alternative: hỏa ngục
  rationale: Dùng dạng phiên âm để bảo tồn thuật ngữ Hy Lạp bắt nguồn từ Thung lũng Hin-nôm và bối cảnh phán xét cánh chung; chú thích cung cấp nghĩa quen thuộc mà không áp đặt toàn bộ nội hàm thần học về sau.
- issue: Sắc thái của σκανδαλίζει
  choice: khiến ... vấp ngã
  alternative: khiến ... phạm tội
  rationale: Giữ ẩn dụ chân thực của nguyên văn; nghĩa đạo đức theo ngữ cảnh được nêu trong chú thích thay vì âm thầm thay thế hình ảnh.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và trực tiếp. Đại từ “anh em” phù hợp với lời dạy hướng đến các môn đồ và độc giả nói chung; cấu trúc “thà ... còn hơn” giúp câu so sánh tự nhiên trong tiếng Việt mà không làm nhẹ đi tính quyết liệt của nguyên văn.
