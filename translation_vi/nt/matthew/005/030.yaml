  to: Nếu tay phải của anh em khiến anh em vấp ngã[a], hãy chặt nó đi và quăng nó đi. Vì thà để một bộ phận thân thể của anh em bị mất còn hơn để cả thân thể đi vào Ghê-hen-na[b].
  rationale: Chỉ thay “quăng nó khỏi mình” bằng “quăng nó đi” để đạt cách diễn đạt hiện đại, tự nhiên hơn. Bản sửa vẫn giữ mệnh lệnh mạnh mẽ và ý loại bỏ dứt khoát của βάλε ἀπὸ σοῦ; không có thay đổi nào về nghĩa hay thuật ngữ thần học.
