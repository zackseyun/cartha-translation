review_pass:
  verdict: revise
  source_fidelity: Bản dịch giữ đúng cấu trúc lời phúc, diễn tả được khát vọng liên tục trong hai phân từ hiện tại, bảo toàn đối tượng “sự công chính,” quan hệ lý do của ὅτι, và tương lai bị động không nêu tác nhân của χορτασθήσονται. “No đủ” phản ánh trực tiếp hơn hình ảnh được ăn/uống đến đầy đủ của động từ Hy Lạp.
  naturalness: “Đói khát sự công chính” là cách nói tự nhiên, quen thuộc trong văn phong Kinh Thánh tiếng Việt hiện đại. “Được no thỏa” hơi trùng và kém tự nhiên hơn “được no đủ”; sửa này vẫn giữ hình ảnh đói khát và ý được làm cho đầy đủ.
  terminology: “Phước cho” phù hợp với công thức μακάριοι trong văn cảnh Các Mối Phước. “Sự công chính” duy trì thuật ngữ chính cho δικαιοσύνη; chú thích bảo tồn khả năng “sự công bằng” và phạm vi nghĩa rộng mà không áp đặt một diễn giải giáo phái.
  issues:
