revisions:
- from: Phước cho những người đói khát sự công chính,[a] vì họ sẽ được no thỏa.
  to: Phước cho những người đói khát sự công chính,[a] vì họ sẽ được no đủ.
  rationale: Thay “no thỏa” bằng “no đủ” để tiếng Việt tự nhiên hơn và vẫn phản ánh hình ảnh được làm cho no đầy trong nguyên ngữ. Tinh chỉnh chú thích để phân biệt rõ phương án dịch thay thế với lời giải thích về trường nghĩa rộng của δικαιοσύνη.
