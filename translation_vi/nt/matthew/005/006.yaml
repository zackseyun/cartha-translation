  text: μακάριοι οἱ πεινῶντες καὶ διψῶντες τὴν δικαιοσύνην, ὅτι αὐτοὶ χορτασθήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/006.yaml
  text: Blessed are those who hunger and thirst for righteousness[a], because they will be filled.
translation:
  language: vi
  text: Phước cho những người đói khát sự công chính,[a] vì họ sẽ được no đủ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “sự công bằng”. Từ Hy Lạp có thể chỉ sự công chính, sự công bằng, hoặc điều đúng đắn trước mặt Đức Chúa Trời.'
    reason: alternative_reading
lexical_decisions:
- source_word: μακάριοι
  choice: Phước cho
  rationale: Công thức trang trọng, tự nhiên trong các lời phúc; diễn tả lời tuyên bố về tình trạng được ban phước, không thu hẹp thành cảm xúc “hạnh phúc”.
- source_word: οἱ πεινῶντες καὶ διψῶντες
  choice: những người đói khát
  rationale: Giữ nguyên hình ảnh đói và khát cùng sắc thái khao mong liên tục của hai phân từ hiện tại, đồng thời diễn đạt gọn và tự nhiên trong tiếng Việt.
- source_word: τὴν δικαιοσύνην
  choice: sự công chính
  rationale: “Sự công chính” là cách dịch thần học quen thuộc nhưng vẫn để ngỏ phạm vi nghĩa gồm điều đúng đắn trước mặt Đức Chúa Trời và sự công bằng; nghĩa thay thế được nêu ở chú thích.
- source_word: ὅτι
  choice: vì
  rationale: Diễn đạt rõ quan hệ nêu lý do giữa lời phước và lời hứa.
- source_word: αὐτοὶ
  choice: họ
  rationale: Đại từ Hy Lạp có tính nhấn mạnh; tiếng Việt dùng “họ” là tự nhiên, còn thêm “chính họ” sẽ khá nặng trong câu này.
- source_word: χορτασθήσονται
  choice: sẽ được no thỏa
  rationale: Giữ thể bị động và hình ảnh được cho ăn đến no, đồng thời “no thỏa” bao hàm ý được đáp ứng trọn vẹn.
theological_decisions:
- issue: Cách dịch δικαιοσύνη
  choice: sự công chính
  alternative: sự công bằng; điều đúng đắn trước mặt Đức Chúa Trời
  rationale: Từ Hy Lạp có trường nghĩa rộng, có thể chỉ sự công chính, công bằng hoặc điều phù hợp với chuẩn mực của Đức Chúa Trời. Bản văn chính dùng thuật ngữ quen thuộc “sự công chính”, còn chú thích bảo tồn các sắc thái khả hữu thay vì quyết định theo một cách hiểu giáo phái.
- issue: Tác nhân của χορτασθήσονται
  choice: sẽ được no thỏa
  alternative: Đức Chúa Trời sẽ làm cho họ no thỏa
  rationale: Bản Hy Lạp dùng thể bị động mà không nêu tác nhân. Cách dịch bị động giữ nguyên sự hàm ẩn—thường được hiểu là Đức Chúa Trời—mà không bổ sung điều nguyên văn không nói rõ.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. “Phước cho” duy trì nhịp điệu quen thuộc của các lời phúc; “đói khát” và “no thỏa” bảo toàn phép ẩn dụ xuyên suốt câu.
