  - severity: low
    issue: Chú thích trình bày “điều đúng đắn trước mặt Đức Chúa Trời” như một phương án dịch trực tiếp ngang hàng.
    rationale: Đây đúng hơn là phần giải thích trường nghĩa của δικαιοσύνη. Nên chỉ nêu “sự công bằng” là phương án dịch ngắn, rồi giải thích phạm vi nghĩa rộng của từ.
