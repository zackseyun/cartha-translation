  text: μακάριοι οἱ δεδιωγμένοι ἕνεκεν δικαιοσύνης, ὅτι αὐτῶν ἐστιν ἡ βασιλεία τῶν οὐρανῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/010.yaml
  text: Blessed are those who have been persecuted because of righteousness[a], for theirs is the kingdom of heaven.
translation:
  language: vi
  text: Phước cho những người bị bắt bớ vì sự công chính[a], vì Nước Trời thuộc về họ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “vì công lý”. Từ Hy Lạp có thể mang các sắc thái về sự ngay chính đạo đức và giao ước, cũng như công lý.
    reason: lexical_alternative
lexical_decisions:
- source_word: μακάριοι
  choice: Phước cho
  rationale: Cách diễn đạt tự nhiên và trang trọng trong thể loại các mối phước; giữ sắc thái tuyên bố về ân phước hơn là cảm xúc chủ quan như “hạnh phúc”.
- source_word: οἱ δεδιωγμένοι
  choice: những người bị bắt bớ
  rationale: Mạo từ cùng phân từ hoàn thành bị động chỉ một nhóm người đang ở trong tình trạng do sự bắt bớ gây nên. Tiếng Việt không buộc phải đánh dấu thì; cách dịch này tự nhiên và không giới hạn ý nghĩa vào một thời điểm quá khứ.
- source_word: ἕνεκεν
  choice: vì
  rationale: Diễn đạt trực tiếp nguyên nhân của sự bắt bớ, ngắn gọn và tự nhiên trong tiếng Việt hiện đại.
- source_word: δικαιοσύνης
  choice: sự công chính
  rationale: Giữ phạm vi nghĩa rộng về điều phù hợp với ý muốn và chuẩn mực của Đức Chúa Trời, đồng thời không thu hẹp từ này chỉ vào công lý xã hội; sắc thái “công lý” được bảo lưu trong chú thích.
- source_word: ὅτι
  choice: vì
  rationale: Giới thiệu lý do cho lời tuyên bố phước lành và giữ mối liên hệ giải thích giữa hai vế.
- source_word: αὐτῶν ἐστιν
  choice: thuộc về họ
  rationale: Diễn đạt tự nhiên quan hệ sở hữu trong tiếng Việt mà không làm thay đổi trọng tâm đặt trên “họ” trong nguyên văn.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: vương quốc thiên đàng
  rationale: Phản ánh cách nói đặc trưng của Ma-thi-ơ về quyền trị vì thuộc trời của Đức Chúa Trời; dùng số ít tự nhiên trong tiếng Việt cho οὐρανῶν số nhiều.
theological_decisions:
- issue: Cách dịch δικαιοσύνη
  choice: sự công chính
  alternative: công lý
  rationale: Trong ngữ cảnh này, từ có thể bao hàm đời sống đúng theo ý muốn Đức Chúa Trời và cả chiều kích công lý. Bản chính giữ nghĩa rộng bằng “sự công chính”, còn khả năng dịch “công lý” được nêu trong chú thích để không xóa đi độ mở của nguyên ngữ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Phước cho” giữ nhịp điệu tuyên bố của các mối phước; “bị bắt bớ” là cách nói phổ thông, còn “vương quốc thiên đàng” giữ rõ ý niệm về quyền trị vì mà không đồng nhất đơn giản với một địa điểm.
