  text: μακάριοι οἱ ἐλεήμονες, ὅτι αὐτοὶ ἐλεηθήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/007.yaml
  text: Blessed are the merciful[a], for they will be shown mercy.
translation:
  language: vi
  text: Phước cho những người có lòng thương xót, vì chính họ sẽ được thương xót.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μακάριοι
  choice: Phước cho
  rationale: Cách diễn đạt quen thuộc của các lời phước, chỉ tình trạng được ân huệ và hưởng điều tốt lành, chứ không chỉ là cảm giác vui vẻ chủ quan.
- source_word: οἱ ἐλεήμονες
  choice: những người có lòng thương xót
  rationale: Mạo từ đi với tính từ được dùng như danh từ, chỉ những người có đặc tính thương xót. Cách dịch này tự nhiên trong tiếng Việt và giữ được mối liên hệ từ vựng với động từ ở vế sau.
- source_word: ὅτι
  choice: vì
  rationale: Diễn đạt quan hệ nguyên nhân hoặc cơ sở của lời phước một cách ngắn gọn, tự nhiên.
- source_word: αὐτοὶ
  choice: chính họ
  rationale: Giữ sắc thái nhấn mạnh của đại từ Hy Lạp và làm nổi bật sự tương ứng giữa người thương xót và người sẽ được thương xót.
- source_word: ἐλεηθήσονται
  choice: sẽ được thương xót
  rationale: Phản ánh trực tiếp động từ tương lai thể bị động, đồng thời lặp lại ý 'thương xót' ở vế đầu mà không nêu rõ tác nhân.
theological_decisions:
- issue: Tác nhân ban sự thương xót
  choice: 'Giữ thể bị động và không nêu tác nhân: “sẽ được thương xót”.'
  alternative: “sẽ được Đức Chúa Trời thương xót” hoặc “sẽ nhận được lòng thương xót từ người khác”.
  rationale: Ngữ cảnh hàm ý mạnh mẽ rằng Đức Chúa Trời là tác nhân, nhưng câu Hy Lạp không nói rõ. Bản dịch vì thế giữ nguyên độ mở và sức căng thần học của nguyên văn.
translation_notes:
  register: Văn phong trang trọng, sáng rõ và dễ hiểu trong tiếng Việt hiện đại. Cấu trúc ngắn gọn giữ nhịp của một lời phước; “chính họ” bảo toàn sắc thái nhấn mạnh của αὐτοὶ mà vẫn tự nhiên.
