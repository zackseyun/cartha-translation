review_pass:
  verdict: revise
  source_fidelity: Cần chỉnh một số chỗ để phản ánh nhất quán hơn cấu trúc pháp lý của ἔνοχος ἔσται và để không mở rộng trực tiếp danh từ giống đực số ít ἀδελφῷ thành “anh chị em”. Bản văn SBLGNT không có “vô cớ”; chú thích dị bản là phù hợp.
  naturalness: “Sẽ phải chịu Hội đồng xét xử” không tự nhiên trong tiếng Việt, vì một người không “chịu” một cơ quan. “Phải chịu lửa Ghê-hen-na” cũng đảo và làm mờ kết cấu “Ghê-hen-na của lửa”. Bản sửa giữ nhịp tăng tiến và cách diễn đạt hiện đại, trang trọng.
  terminology: Dùng “người anh em mình” cho ἀδελφός, “hội đồng” viết thường cho συνέδριον (không áp đặt đồng nhất với Đại Hội đồng), và “Ghê-hen-na lửa” để bảo lưu γέεννα τοῦ πυρός. “Đồ ngốc!” là lời mắng trực tiếp tự nhiên hơn “Đồ ngu!” trong văn phong bản dịch.
  issues:
  - severity: medium
    issue: “anh chị em mình” mở rộng trực tiếp ἀδελφῷ αὐτοῦ.
    rationale: Nguyên ngữ dùng danh từ giống đực số ít. Dù cách ngôn có phạm vi đại diện, bản văn chính không nên thêm “chị”; điều này có thể được giải thích trong chú thích.
  - severity: medium
    issue: “sẽ phải chịu Hội đồng xét xử” không phản ánh tự nhiên quan hệ pháp lý với τῷ συνεδρίῳ.
    rationale: ἔνοχος τῷ συνεδρίῳ diễn tả phải chịu trách nhiệm/trả lẽ trước hội đồng; tiếng Việt cần nêu quan hệ xét xử thay vì nói “chịu” chính hội đồng.
  - severity: medium
    issue: “sẽ phải chịu lửa Ghê-hen-na” làm mờ thuật ngữ γέεννα và trật tự “Gehenna of fire”.
    rationale: Cần giữ Ghê-hen-na là thuật ngữ/hình tượng trung tâm và lửa là thuộc ngữ của nó, đồng thời diễn đạt được hệ quả pháp lý.
