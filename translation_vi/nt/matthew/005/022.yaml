- from: 'Nhưng tôi nói với anh em: Bất cứ ai giận anh chị em mình[a] thì sẽ phải chịu sự phán xét; ai nói với anh chị em mình: “Ra-ca”[b] thì sẽ phải chịu Hội đồng[c] xét xử; còn ai nói: “Đồ ngu!” thì sẽ phải chịu lửa Ghê-hen-na[d].'
  to: 'Nhưng tôi nói với anh em: Bất cứ ai giận người anh em mình[a] thì sẽ phải chịu sự phán xét; ai nói với người anh em mình: “Ra-ca”[b] thì sẽ phải chịu sự xét xử của hội đồng[c]; còn ai nói: “Đồ ngốc!” thì sẽ phải chịu án phạt Ghê-hen-na lửa[d].'
  rationale: Bản sửa không thay đổi ý nghĩa passage, nhưng sửa việc mở rộng giới tính trong bản văn chính, thay cấu trúc không tự nhiên với “Hội đồng”, và bảo toàn tốt hơn cụm “Ghê-hen-na của lửa”. Chú thích a gộp dị bản và ghi nhận chức năng đại diện của danh từ giống đực, tránh áp đặt phạm vi theo giáo phái.
