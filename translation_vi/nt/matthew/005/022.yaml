id: MAT.5.22
reference: Matthew 5:22
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐγὼ δὲ λέγω ὑμῖν ὅτι πᾶς ὁ ὀργιζόμενος τῷ ἀδελφῷ ⸀αὐτοῦ ἔνοχος ἔσται τῇ κρίσει· ὃς δ’ ἂν εἴπῃ τῷ ἀδελφῷ αὐτοῦ· Ῥακά, ἔνοχος ἔσται τῷ συνεδρίῳ· ὃς δ’ ἂν εἴπῃ· Μωρέ, ἔνοχος ἔσται εἰς τὴν γέενναν τοῦ πυρός.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/022.yaml
  text: But I say to you that everyone who is angry with his brother will be liable to the judgment[a]; and whoever says to his brother, ‘Raca,’ will be liable to the council; and whoever says[e][d][c][b], ‘Fool,’ will be liable to the Gehenna of fire.
translation:
  language: vi
  text: 'Nhưng tôi nói với anh em: Bất cứ ai giận người anh em mình[a] thì sẽ phải chịu sự phán xét; ai nói với người anh em mình: “Ra-ca”[b] thì sẽ phải chịu sự xét xử của hội đồng[c]; còn ai nói: “Đồ ngốc!” thì sẽ phải chịu án phạt Ghê-hen-na lửa[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Một số thủ bản thêm “vô cớ” sau “giận người anh em mình”; các chứng cứ thủ bản sớm và vững hơn không có cụm này. Từ Hy Lạp được dịch là “người anh em” là giống đực số ít nhưng có thể dùng theo nghĩa đại diện; lời dạy này không chỉ giới hạn ở anh em ruột nam.
    reason: textual_variant
  - marker: b
    text: “Ra-ca” là một lời miệt thị trong tiếng A-ram, gần nghĩa “đầu rỗng” hoặc “đồ vô dụng”.
    reason: cultural_note
  - marker: c
    text: Cũng có thể dịch là “Đại Hội đồng”, tức cơ quan lãnh đạo và xét xử của người Do Thái.
    reason: alternative_reading
  - marker: d
    text: “Ghê-hen-na” bắt nguồn từ tên Thung lũng Hin-nôm và được dùng làm hình tượng về sự phán xét; cũng có thể dịch là “địa ngục lửa”.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐγὼ δὲ λέγω ὑμῖν
  choice: Nhưng tôi nói với anh em
  rationale: Giữ sự tương phản nhấn mạnh của ἐγὼ δέ và dùng cách nói trang trọng, tự nhiên trong tiếng Việt; “anh em” ở đây là đại từ số nhiều chỉ người nghe.
- source_word: πᾶς ὁ ὀργιζόμενος τῷ ἀδελφῷ αὐτοῦ
  choice: Bất cứ ai giận anh chị em mình
  rationale: Diễn đạt lực khái quát của phân từ hiện tại; “anh chị em mình” truyền đạt ἀδελφός theo nghĩa đại diện rộng mà không giới hạn vào anh/em trai ruột.
- source_word: ἔνοχος ἔσται
  choice: sẽ phải chịu
  rationale: Trong chuỗi hình ảnh pháp lý, cụm này diễn tả tình trạng phải chịu trách nhiệm và hình phạt; cách dịch được bổ nghĩa theo từng đối tượng để câu tiếng Việt tự nhiên.
- source_word: τῇ κρίσει
  choice: sự phán xét
  rationale: Giữ nghĩa tư pháp mà không xác định quá mức đây là một tòa án địa phương cụ thể.
- source_word: Ῥακά
  choice: Ra-ca
  rationale: Phiên âm lời miệt thị gốc A-ram đã được văn bản Hy Lạp bảo lưu, rồi giải thích bằng chú thích.
- source_word: τῷ συνεδρίῳ
  choice: Hội đồng
  rationale: Dịch nghĩa danh từ συνέδριον và giữ khả năng chỉ hội đồng xét xử nói chung hoặc Đại Hội đồng Do Thái.
- source_word: Μωρέ
  choice: Đồ ngu!
  rationale: Thể hiện trực tiếp sắc thái hô cách và tính chất lăng mạ của từ Hy Lạp, bằng một cách nói dễ hiểu trong tiếng Việt hiện đại.
- source_word: εἰς τὴν γέενναν τοῦ πυρός
  choice: phải chịu lửa Ghê-hen-na
  rationale: Bảo lưu địa danh-hình tượng Ghê-hen-na và mối liên hệ trực tiếp với lửa, đồng thời tạo câu tiếng Việt tự nhiên.
theological_decisions:
- issue: Cách dịch γέεννα
  choice: Ghê-hen-na
  alternative: hỏa ngục; địa ngục lửa
  rationale: Phiên âm thuật ngữ cụ thể mà Chúa Giê-su dùng, giữ bối cảnh Thung lũng Hin-nôm và hình tượng phán xét, thay vì đồng nhất không giải thích với mọi hàm ý thần học về sau của “địa ngục”.
- issue: Phạm vi của ἀδελφός
  choice: anh chị em mình
  alternative: anh em mình; người anh em của mình
  rationale: Danh từ Hy Lạp ở giống đực số ít nhưng có thể mang nghĩa đại diện. Tiếng Việt tự nhiên cho phép “anh chị em” biểu đạt phạm vi rộng mà không quyết định rằng đối tượng chỉ là anh em ruột hay chỉ là tín hữu.
- issue: Mức độ cụ thể của τῇ κρίσει
  choice: sự phán xét
  alternative: tòa án
  rationale: Giữ sự mơ hồ chân thực giữa hành vi xét xử, sự kết án và một cơ quan tư pháp cụ thể; không tự ý xác định đó là tòa địa phương.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu giữ nhịp tăng tiến pháp lý của nguyên bản. “Tôi” phù hợp lời trực tiếp của Chúa Giê-su trong lối kể tiếng Việt; “anh em” ở vế mở đầu chỉ tập thể người nghe, còn “anh chị em mình” truyền đạt phạm vi đại diện của ἀδελφός. Các thuật ngữ văn hóa đặc thù Ra-ca và Ghê-hen-na được phiên âm có dấu nối và giải thích ở chú thích.
