review_pass:
  verdict: revise
  source_fidelity: 'Bản nháp giữ đúng cấu trúc ba vế và ý chính: bị sỉ nhục, bắt bớ, và bị nói xấu cách gian dối vì Đức Chúa Jêsus. Tuy nhiên, “vu cho các con đủ điều xấu xa” không diễn đạt rõ hành vi “nói” (εἴπωσιν) và có kết hợp từ chưa tự nhiên. Đưa “vì Ta” lên trước chuỗi động từ làm rõ nguyên nhân này chi phối toàn bộ các hành vi thù địch.'
  naturalness: “Sỉ nhục” và “bắt bớ” tự nhiên trong văn phong Kinh Thánh hiện đại. Cách diễn đạt “gian dối nói đủ điều xấu xa chống lại các con” truyền đạt rõ lời cáo buộc sai trái; “vì Ta mà” hiện đại và trực tiếp hơn “vì cớ ta.”
  terminology: Giữ “Phước cho các con” theo lựa chọn xưng hô nhất quán của bản nháp. “Bắt bớ” phù hợp với διώκω trong ngữ cảnh đối xử thù địch vì gắn bó với Đức Chúa Jêsus. Viết hoa “Ta” là quy ước kính ngữ tiếng Việt, không bổ sung nội dung thần học.
  issues:
  - severity: medium
    issue: Cụm “vu cho các con đủ điều xấu xa” chưa phản ánh minh thị động từ “nói” và kết hợp từ không thật tự nhiên.
    rationale: εἴπωσιν πᾶν πονηρὸν καθ’ ὑμῶν ψευδόμενοι nói về việc gian dối nói mọi điều xấu chống lại người nghe. “Vu” có thể hàm ý gán điều không thật, nhưng cách dùng ở đây làm mờ hành vi phát ngôn và không giữ được phạm vi rộng của “mọi điều xấu xa.”
  - severity: low
    issue: “Vì cớ ta” hơi cổ đối với mục tiêu tiếng Việt chuẩn hiện đại.
    rationale: “Vì Ta mà” diễn đạt cùng quan hệ nguyên nhân/cớ vì ἕνεκεν ἐμοῦ, tự nhiên hơn và có thể đặt trước chuỗi động từ để tránh hiểu là chỉ bổ nghĩa cho lời vu cáo cuối câu.
