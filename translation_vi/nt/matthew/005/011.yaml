id: MAT.5.11
reference: Matthew 5:11
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: μακάριοί ἐστε ὅταν ὀνειδίσωσιν ὑμᾶς καὶ διώξωσιν καὶ εἴπωσιν πᾶν ⸀πονηρὸν καθ’ ὑμῶν ψευδόμενοι ἕνεκεν ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/011.yaml
  text: Blessed are you when they insult you and persecute you and falsely say every kind of evil against you because of me[a][b][c].
translation:
  language: vi
  text: Phước cho các con khi người ta vì Ta mà sỉ nhục, bắt bớ các con, và gian dối nói đủ điều xấu xa chống lại các con.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch “lăng mạ các con” thay cho “sỉ nhục”.
    reason: lexical_alternative
  - marker: b
    text: 'Hoặc: “nói mọi điều xấu xa chống lại các con.”'
    reason: lexical_alternative
  - marker: c
    text: 'Hoặc: “vì cớ Ta” hoặc “vì Ta”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μακάριοί ἐστε
  choice: Phước cho các con
  rationale: Giữ công thức chúc phước đặc trưng của các mối phước, đồng thời dùng cách diễn đạt tự nhiên và trang trọng trong tiếng Việt.
- source_word: ὅταν
  choice: khi
  rationale: Diễn tả tình huống có thể xảy ra nói chung trong tương lai, phù hợp với các động từ ở thể giả định.
- source_word: ὀνειδίσωσιν
  choice: sỉ nhục
  rationale: Diễn đạt rõ hành vi lăng mạ bằng lời, vừa hiện đại vừa giữ được mức độ mạnh của động từ Hy Lạp.
- source_word: διώξωσιν
  choice: bắt bớ
  rationale: Giữ nghĩa rộng về sự đối xử thù địch do gắn bó với Chúa Giê-su, không giới hạn vào bạo lực thể chất.
- source_word: εἴπωσιν πᾶν πονηρὸν καθ’ ὑμῶν
  choice: vu cho các con đủ điều xấu xa
  rationale: Diễn đạt tự nhiên hành vi nói những điều ác ý chống lại người khác; kết hợp với ψευδόμενοι để làm rõ đây là lời cáo buộc không thật.
- source_word: ψευδόμενοι
  choice: vu
  rationale: Động từ “vu” hàm ý gán ghép điều không đúng sự thật, truyền đạt gọn và tự nhiên chức năng trạng ngữ của phân từ Hy Lạp.
- source_word: ἕνεκεν ἐμοῦ
  choice: vì cớ ta
  rationale: Diễn tả nguyên nhân là mối liên hệ và lòng trung thành với người nói; sắc thái trang trọng phù hợp văn cảnh.
theological_decisions:
- issue: Phạm vi của sự chống đối
  choice: Câu này bao gồm sự lăng mạ, bắt bớ và cáo buộc gian dối vì Chúa Giê-su, không giới hạn vào một hình thức pháp lý, thể chất hay xã hội cụ thể.
  alternative: Chỉ hiểu sự bắt bớ là bạo lực thể chất, hoặc chỉ hiểu toàn bộ câu là sự vu khống.
  rationale: Ba động từ được nối song song mô tả nhiều dạng thù địch; bản dịch giữ nguyên phạm vi rộng ấy.
- issue: Cách xưng hô của Chúa Giê-su với các môn đồ
  choice: Dùng “ta—các con”.
  alternative: Dùng “tôi—anh em” hoặc “ta—các ngươi”.
  rationale: “Ta—các con” thể hiện lời dạy trực tiếp, gần gũi nhưng vẫn trang trọng; không tự nó áp đặt một kết luận thần học ngoài văn bản.
translation_notes:
  register: 'Tiếng Việt chuẩn hiện đại, trang trọng và dễ hiểu. Bản dịch ưu tiên tương đương tối ưu: giữ công thức mối phước, phạm vi rộng của sự bắt bớ và tính gian dối của lời cáo buộc, đồng thời tránh lối diễn đạt quá cổ như “rủa sả” hoặc “các ngươi”.'
