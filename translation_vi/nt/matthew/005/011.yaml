revisions:
- from: Phước cho các con khi người ta sỉ nhục, bắt bớ và vu cho các con đủ điều xấu xa vì cớ ta.[a][b][c]
  to: Phước cho các con khi người ta vì Ta mà sỉ nhục, bắt bớ các con, và gian dối nói đủ điều xấu xa chống lại các con.[a][b][c]
  rationale: Bản sửa thay “vu cho” bằng cách diễn đạt nêu rõ việc gian dối nói những điều xấu chống lại các môn đồ, phù hợp với cả εἴπωσιν và ψευδόμενοι. “Vì Ta mà” được đặt sao cho nguyên nhân áp dụng cho cả ba hình thức chống đối, đồng thời dùng lối Việt ngữ hiện đại. Các dấu chú thích vẫn được giữ đầy đủ và nội dung chú thích được điều chỉnh cho khớp với bản văn sửa.
