id: MAT.5.33
reference: Matthew 5:33
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Πάλιν ἠκούσατε ὅτι ἐρρέθη τοῖς ἀρχαίοις· Οὐκ ἐπιορκήσεις, ἀποδώσεις δὲ τῷ κυρίῳ τοὺς ὅρκους σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/033.yaml
  text: Again[a], you have heard that it was said to those of old, ‘You shall not swear falsely[b], but you shall fulfill your oaths to the Lord.’
translation:
  language: vi
  text: '“Lại nữa, anh em đã nghe rằng người xưa đã được truyền dạy: ‘Ngươi không được thề dối[a], nhưng phải làm trọn với Chúa[b] những lời thề của mình.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “vi phạm lời thề”; động từ này có thể chỉ việc thề dối hoặc không giữ lời thề.'
    reason: lexical_alternative
  - marker: b
    text: 'Hoặc: “ĐỨC CHÚA”, phản ánh danh giao ước của Đức Chúa Trời trong bối cảnh Cựu Ước.'
    reason: alternative_reading
lexical_decisions:
- source_word: Πάλιν
  choice: Lại nữa
  rationale: Đánh dấu một ví dụ tiếp theo trong chuỗi lời dạy đối chiếu; cách diễn đạt này tự nhiên và giữ được bước chuyển của mạch văn.
- source_word: ἠκούσατε
  choice: anh em đã nghe
  rationale: Thể aorist trong công thức này được diễn đạt tự nhiên bằng “đã nghe”, đồng thời “anh em” thể hiện đối tượng số nhiều mà không quá cổ kính.
- source_word: ἐρρέθη
  choice: lời phán
  rationale: Giữ sắc thái bị động, không xác định quá mức chủ thể nói; “lời phán” phù hợp với ngữ cảnh trích dẫn giáo huấn Kinh Thánh.
- source_word: τοῖς ἀρχαίοις
  choice: cho người xưa
  rationale: Chỉ các thế hệ trước, không mang nghĩa đơn thuần là người cao tuổi.
- source_word: Οὐκ ἐπιορκήσεις
  choice: Ngươi không được thề gian
  rationale: ἐπιορκέω có thể chỉ việc thề điều gian dối hoặc vi phạm lời thề. “Thề gian” ngắn gọn, có sắc thái pháp lý–Kinh Thánh nhưng vẫn dễ hiểu; nghĩa còn lại được giữ trong chú thích.
- source_word: ἀποδώσεις
  choice: phải làm trọn
  rationale: Trong ngữ cảnh lời thề, động từ nói đến việc thực hiện đầy đủ điều đã cam kết, hơn là nghĩa đen “trả lại”.
- source_word: τῷ κυρίῳ
  choice: với Chúa
  rationale: κύριος ở đây chỉ Đức Chúa Trời. “Chúa” bám sát văn bản Hy Lạp; nền Cựu Ước liên quan đến danh giao ước được ghi ở chú thích.
- source_word: τοὺς ὅρκους σου
  choice: những lời thề của mình
  rationale: Diễn đạt rõ đối tượng của “làm trọn”; đại từ phản thân “của mình” tự nhiên trong lời trích dẫn tiếng Việt.
theological_decisions:
- issue: Cách dịch κύριος trong lời nhắc đến Kinh Thánh của Israel
  choice: Chúa
  alternative: ĐỨC CHÚA
  rationale: Văn bản Hy Lạp có κυρίῳ chứ không trực tiếp ghi danh YHWH. Bản chính vì thế dùng “Chúa”, còn cách đọc phản ánh danh giao ước trong bối cảnh Cựu Ước được bảo tồn bằng chú thích.
- issue: Phạm vi nghĩa của ἐπιορκέω
  choice: thề gian
  alternative: vi phạm lời thề
  rationale: Động từ có thể bao gồm cả thề dối lẫn không giữ lời thề. Bản chính dùng cách dịch trực tiếp và rộng hơn thuật ngữ pháp lý “khai man”, đồng thời chú thích nêu nghĩa thay thế.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh em” cho đối tượng số nhiều và “ngươi” trong lời luật được trích dẫn để vừa phân biệt số vừa giữ sắc thái trang nghiêm. Các dấu chú thích được đặt ngay sau những từ ngữ mà chú thích giải thích.
