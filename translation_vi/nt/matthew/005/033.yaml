- from: '“Lại nữa, anh em đã nghe lời phán cho người xưa rằng: ‘Ngươi không được thề gian[a], nhưng phải làm trọn với Chúa[b] những lời thề của mình.’”'
  to: '“Lại nữa, anh em đã nghe rằng người xưa đã được truyền dạy: ‘Ngươi không được thề dối[a], nhưng phải làm trọn với Chúa[b] những lời thề của mình.’”'
  rationale: Chỉnh lời dẫn để phản ánh tự nhiên cấu trúc ‘đã được nói với người xưa’, thay “thề gian” bằng “thề dối” cho cách dùng hiện đại, và giữ nguyên nghĩa, sắc thái trang trọng, thuật ngữ “Chúa”, cùng các neo chú thích.
  reviewer_model: gpt-5.6-terra
