id: MAT.5.45
reference: Matthew 5:45
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὅπως γένησθε υἱοὶ τοῦ πατρὸς ὑμῶν τοῦ ⸀ἐν οὐρανοῖς, ὅτι τὸν ἥλιον αὐτοῦ ἀνατέλλει ἐπὶ πονηροὺς καὶ ἀγαθοὺς καὶ βρέχει ἐπὶ δικαίους καὶ ἀδίκους.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/045.yaml
  text: so that you may become sons of your Father in heaven[a], because he makes his sun rise on evil and good[c][b], and sends rain on righteous and unrighteous.
translation:
  language: vi
  text: để anh em trở nên con trai của Cha anh em ở trên trời[a], vì Ngài khiến mặt trời của Ngài soi trên người ác lẫn người thiện, và ban mưa trên người công chính lẫn người bất chính[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “để anh em trở nên con cái của Cha anh em.” Tiếng Hy Lạp dùng từ “con trai”; bản chính giữ cách gọi này để bảo toàn cách diễn đạt về quan hệ cha-con của nguyên văn.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch sát hơn: “và làm mưa trên người công chính lẫn người bất chính.” “Ban mưa trên” là cách nói tự nhiên trong tiếng Việt và vẫn giữ Đức Chúa Trời là tác nhân.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπως
  choice: để
  rationale: Giữ rõ sắc thái mục đích hoặc kết quả của liên từ, đồng thời tự nhiên trong tiếng Việt hiện đại.
- source_word: γένησθε
  choice: anh em trở nên
  rationale: Bảo toàn nghĩa động của γίνομαι là “trở nên”, không làm phẳng thành trạng thái tĩnh “là”.
- source_word: υἱοὶ
  choice: những người con trai
  rationale: Hy Lạp dùng danh từ giống đực số nhiều “các con trai”; cách dịch này giữ nguyên hình ảnh quan hệ cha-con trong nguồn, dù trong ngữ cảnh lời ấy áp dụng cho các môn đồ nói chung.
- source_word: τοῦ πατρὸς ὑμῶν τοῦ ἐν οὐρανοῖς
  choice: của Cha anh em ở trên trời
  rationale: Dịch trực tiếp cấu trúc sở hữu và cụm chỉ nơi chốn; “ở trên trời” là cách nói tiếng Việt tự nhiên cho số nhiều οὐρανοῖς trong thành ngữ Ma-thi-ơ.
- source_word: ὅτι
  choice: vì
  rationale: Nêu căn cứ giải thích cho mệnh đề trước một cách gọn và tự nhiên.
- source_word: τὸν ἥλιον αὐτοῦ ἀνατέλλει
  choice: khiến mặt trời của Ngài mọc lên
  rationale: Giữ đại từ sở hữu αὐτοῦ và ý tác động khiến mặt trời mọc, qua đó bảo toàn quyền năng và sự chăm nom của Đức Chúa Trời.
- source_word: ἐπὶ πονηροὺς καὶ ἀγαθοὺς
  choice: trên người ác lẫn người thiện
  rationale: Các tính từ được dùng như danh từ chỉ người; thêm “người” là cần thiết để tiếng Việt rõ nghĩa, còn “lẫn” làm nổi bật việc ân huệ được ban cho cả hai nhóm.
- source_word: βρέχει
  choice: ban mưa xuống
  rationale: Động từ có nghĩa đen là “làm mưa/mưa”; “ban mưa xuống” tự nhiên trong tiếng Việt và vẫn biểu thị Đức Chúa Trời là tác nhân.
- source_word: ἐπὶ δικαίους καὶ ἀδίκους
  choice: trên người công chính lẫn người bất chính
  rationale: Giữ cặp đối xứng về đạo đức δικαίους/ἀδίκους bằng thuật ngữ Kinh Thánh rõ ràng, quen thuộc.
theological_decisions:
- issue: Ngôn ngữ quan hệ cha-con có giống đực
  choice: những người con trai của Cha anh em
  alternative: con cái của Cha anh em
  rationale: Nguồn dùng υἱοί chứ không phải τέκνα. Bản chính giữ nét nghĩa “con trai” và hình ảnh quan hệ cha-con; chú thích nêu cách diễn đạt bao quát tự nhiên hơn mà không xóa đặc điểm từ vựng của nguồn.
- issue: Sắc thái của γένησθε đối với địa vị làm con
  choice: trở nên
  alternative: là; chứng tỏ mình là
  rationale: “Trở nên” giữ lực của động từ Hy Lạp nhưng không tự quyết định cơ chế thần học về việc được nhận làm con. Trong văn cảnh, lời dạy nhấn mạnh việc noi theo lòng rộng rãi của Cha; sự căng thẳng giữa sự trở nên và sự biểu lộ căn tính được để nguyên.
- issue: Sự chăm nom phổ quát của Đức Chúa Trời
  choice: Ngài khiến mặt trời của Ngài mọc lên... và ban mưa xuống trên cả hai nhóm
  alternative: mặt trời mọc và mưa rơi trên cả hai nhóm
  rationale: Các động từ trong câu lấy Đức Chúa Trời làm chủ thể, vì vậy bản dịch giữ rõ tác quyền của Ngài thay vì biến hiện tượng thành tiến trình tự nhiên không có tác nhân.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh em” cho đại từ số nhiều chỉ người nghe và viết hoa “Ngài”, “Cha” theo quy ước tiếng Việt Cơ Đốc phổ biến. Nhịp câu giữ hai cặp đối xứng “người ác/người thiện” và “người công chính/người bất chính”. Mọi dấu chú thích [a], [b] đều xuất hiện trong chính văn.
