  text: ἐγὼ δὲ λέγω ὑμῖν μὴ ὀμόσαι ὅλως· μήτε ἐν τῷ οὐρανῷ, ὅτι θρόνος ἐστὶν τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/034.yaml
  text: 'But I say to you, do not swear at all: neither by heaven, because it is the throne of God;'
translation:
  language: vi
  text: 'Nhưng tôi bảo anh em: Đừng thề gì cả; cũng đừng lấy trời mà thề, vì trời là ngai của Đức Chúa Trời;'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγὼ δὲ λέγω ὑμῖν
  choice: Nhưng tôi nói với anh em
  rationale: Giữ sự tương phản của δὲ và sắc thái nhấn mạnh của ἐγώ, đồng thời dùng cách xưng hô tự nhiên, trang trọng trong lời dạy trực tiếp.
- source_word: μὴ ὀμόσαι ὅλως
  choice: Đừng thề gì cả
  rationale: ὀμόσαι nói về việc thề/lập lời thề; ὅλως ở đây có nghĩa bao quát là hoàn toàn, tuyệt đối.
- source_word: μήτε ἐν τῷ οὐρανῷ
  choice: cũng đừng chỉ trời mà thề
  rationale: ἐν với đối tượng được viện dẫn trong lời thề được diễn đạt tự nhiên trong tiếng Việt là “chỉ ... mà thề”; μήτε tiếp nối điều cấm bằng “cũng đừng”.
- source_word: ὅτι θρόνος ἐστὶν τοῦ θεοῦ
  choice: vì trời là ngai của Đức Chúa Trời
  rationale: ὅτι nêu lý do; cấu trúc sở hữu τοῦ θεοῦ được chuyển trực tiếp, rõ nghĩa.
theological_decisions:
- issue: Phạm vi của lệnh cấm μὴ ὀμόσαι ὅλως
  choice: Đừng thề gì cả
  alternative: Đừng thề gian / đừng thề tùy tiện
  rationale: Bản dịch giữ nguyên phát biểu bao quát của câu Hy Lạp, không thu hẹp lệnh cấm theo một cách giải thích thần học cụ thể.
- issue: Quan hệ được biểu thị bởi ὅτι
  choice: vì
  alternative: bởi vì / bởi lẽ
  rationale: Giữ rõ quan hệ nguyên nhân mà không bổ sung diễn giải thần học.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “tôi ... anh em” để phản ánh lời nói trực tiếp và số nhiều ὑμῖν; dùng “Đức Chúa Trời” theo văn phong Kinh Thánh phổ thông. Dấu chấm phẩy được giữ vì câu tiếp tục sang câu sau.
