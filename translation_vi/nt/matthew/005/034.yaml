review_pass:
  verdict: revise
  source_fidelity: Bản nháp truyền đạt đúng mệnh lệnh phủ định bao quát của μὴ ὀμόσαι ὅλως, đối tượng của lời thề trong μήτε ἐν τῷ οὐρανῷ, và lý do ὅτι θρόνος ἐστὶν τοῦ θεοῦ. Tuy nhiên, “chỉ trời mà thề” có thể được hiểu là chỉ tay về phía trời; “lấy trời mà thề” diễn đạt rõ và tự nhiên hơn chức năng ‘by heaven’ trong lời thề.
  naturalness: “Nhưng tôi bảo anh em” là lối nói trực tiếp, hiện đại và trang trọng hơn “Nhưng tôi nói với anh em” trong ngữ cảnh lời dạy. Dấu hai chấm giữ đúng quan hệ giữa lệnh cấm tổng quát và ví dụ tiếp theo.
  terminology: Giữ “Đức Chúa Trời” và “ngai” phù hợp văn phong Kinh Thánh tiếng Việt. Không diễn giải hoặc thu hẹp mệnh lệnh về lời thề.
