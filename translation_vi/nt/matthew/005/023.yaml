  source_fidelity: 'Bản dịch giữ đúng cấu trúc điều kiện và quan hệ suy luận của ἐὰν οὖν, ý nghĩa tế lễ của προσφέρῃς τὸ δῶρόν σου, địa điểm “trên bàn thờ,” cùng tính không xác định của τι trong thành ngữ ἔχει τι κατὰ σοῦ. Tuy nhiên, đại từ “con” không có cơ sở trong nguyên ngữ: đây là lời ngỏ trực tiếp số ít với người nghe giả định, không phải lời thưa gửi với Đức Chúa Trời hay một nhân vật có quan hệ trên-dưới.'
