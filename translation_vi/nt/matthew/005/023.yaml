source:
  edition: SBLGNT
  text: ἐὰν οὖν προσφέρῃς τὸ δῶρόν σου ἐπὶ τὸ θυσιαστήριον κἀκεῖ μνησθῇς ὅτι ὁ ἀδελφός σου ἔχει τι κατὰ σοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/023.yaml
  text: Therefore, if you are offering your gift on the altar, and there remember that your brother has something against you,
translation:
  language: vi
  text: Vì vậy, nếu bạn đang dâng lễ vật của mình trên bàn thờ, và tại đó nhớ ra rằng người anh em của bạn[a] có điều gì bất bình với bạn,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể hiểu là “anh hoặc chị em của bạn”; tiếng Hy Lạp dùng từ “anh em trai” ở số ít, nhưng trong ngữ cảnh từ này có thể được dùng theo nghĩa đại diện.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν οὖν
  choice: Vì vậy, nếu
  rationale: “Vì vậy” giữ quan hệ suy luận với lời dạy ngay trước đó, còn “nếu” thể hiện rõ mệnh đề điều kiện.
- source_word: προσφέρῃς τὸ δῶρόν σου
  choice: con đang dâng lễ vật của mình
  rationale: “Đang dâng” diễn tả tình huống sống động của hành động đang diễn ra; trong bối cảnh tế lễ, δῶρον được diễn đạt tự nhiên là “lễ vật”.
- source_word: ἐπὶ τὸ θυσιαστήριον
  choice: trên bàn thờ
  rationale: Cách dịch này giữ hướng nghĩa của ἐπί với đối cách và phù hợp với việc đặt hoặc trình lễ vật trên bàn thờ.
- source_word: κἀκεῖ μνησθῇς
  choice: và tại đó nhớ ra
  rationale: “Tại đó” giữ điểm nhấn không gian; “nhớ ra” diễn đạt tự nhiên việc điều ấy hiện lại trong trí mà không xác định nguyên nhân khiến người dâng nhớ đến.
- source_word: ὁ ἀδελφός σου
  choice: người anh em của con
  rationale: Giữ danh từ giống đực số ít của bản Hy Lạp và sắc thái quan hệ gần gũi, đồng thời tránh thu hẹp chắc chắn thành anh em ruột.
- source_word: ἔχει τι κατὰ σοῦ
  choice: có điều gì bất bình với con
  rationale: Đây là cách diễn đạt tự nhiên cho thành ngữ chỉ việc có lời phàn nàn hoặc mối bất bình đối với ai; “điều gì” giữ tính không xác định của τι.
theological_decisions:
- issue: Phạm vi của danh từ giống đực số ít ἀδελφός
  choice: người anh em của con
  alternative: anh hoặc chị em của con; một tín hữu khác
  rationale: Bản văn dùng danh từ giống đực số ít, nên chính văn giữ hình thức ấy. Tuy nhiên, trong ngữ cảnh, từ này có thể được dùng theo nghĩa đại diện rộng hơn; điều đó được nêu trong chú thích thay vì được quyết định dứt khoát trong chính văn.
- issue: Bản chất của điều người anh em có đối với người dâng lễ
  choice: có điều gì bất bình với con
  alternative: có điều gì chống lại con; có lý do trách con
  rationale: Bản văn không nói mối bất bình có chính đáng hay không và cũng không xác định lỗi thuộc về ai. Bản dịch vì thế giữ sự mơ hồ ấy.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “con” phản ánh lời Đức Giê-su trực tiếp dạy người nghe số ít trong tình huống giả định; “người anh em” giữ sắc thái Kinh Thánh quen thuộc mà không dùng lối diễn đạt cổ.
