  terminology: “Lễ vật,” “bàn thờ,” và “người anh em” phù hợp bối cảnh và giữ được danh từ giống đực số ít ἀδελφός mà không ép nghĩa là anh em ruột hay riêng một tín hữu. Chú thích nên nói rõ “anh em trai” thay vì cách ghép “anh/em trai,” đồng thời không khẳng định quá mức về phạm vi bao gồm.
