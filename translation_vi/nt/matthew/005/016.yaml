id: MAT.5.16
reference: Matthew 5:16
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οὕτως λαμψάτω τὸ φῶς ὑμῶν ἔμπροσθεν τῶν ἀνθρώπων, ὅπως ἴδωσιν ὑμῶν τὰ καλὰ ἔργα καὶ δοξάσωσιν τὸν πατέρα ὑμῶν τὸν ἐν τοῖς οὐρανοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/016.yaml
  text: In the same way[a], let your light shine before men[b], so that they may see your good works and glorify your Father who is in the heavens.
translation:
  language: vi
  text: Cũng vậy, hãy để ánh sáng của anh em tỏa sáng trước mặt mọi người, để họ thấy những việc tốt đẹp anh em làm và tôn vinh Cha của anh em, Đấng ở trong các tầng trời.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Đấng ở trên trời.” Tiếng Hy Lạp dùng dạng số nhiều, sát nghĩa là “ở trong các tầng trời.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως
  choice: Cũng vậy
  rationale: Diễn đạt tự nhiên mối liên kết về cách thức với hình ảnh ngọn đèn và ánh sáng ngay trước đó.
- source_word: λαμψάτω τὸ φῶς ὑμῶν
  choice: hãy để ánh sáng của anh em chiếu sáng
  rationale: Giữ lực mệnh lệnh của động từ ngôi thứ ba số ít và giữ danh từ số ít mang nghĩa tập thể là “ánh sáng”.
- source_word: ἔμπροσθεν τῶν ἀνθρώπων
  choice: trước mặt mọi người
  rationale: Ở đây ἀνθρώπων chỉ con người nói chung, không riêng nam giới; “mọi người” truyền đạt chính xác và tự nhiên trong tiếng Việt hiện đại.
- source_word: ὅπως ἴδωσιν
  choice: để họ thấy
  rationale: Thể hiện tự nhiên ý mục đích của ὅπως đi với động từ giả định, không làm câu tiếng Việt nặng nề.
- source_word: τὰ καλὰ ἔργα
  choice: những việc tốt đẹp anh em làm
  rationale: καλά có sắc thái tốt, đáng quý hoặc cao đẹp; cách diễn đạt này rõ nghĩa hơn “công việc tốt” và đưa sở hữu cách vào cấu trúc tiếng Việt tự nhiên.
- source_word: δοξάσωσιν
  choice: tôn vinh
  rationale: Diễn đạt đầy đủ hành động quy vinh dự và vinh quang cho Đức Chúa Trời, đồng thời phù hợp văn phong trang trọng hiện đại.
- source_word: τὸν πατέρα ὑμῶν
  choice: Cha của anh em
  rationale: Giữ nguyên ngôn ngữ quan hệ gia đình và đại từ số nhiều của nguyên văn.
- source_word: τὸν ἐν τοῖς οὐρανοῖς
  choice: Đấng ở trên các tầng trời
  rationale: Giữ số nhiều οὐρανοῖς của nguyên văn; “các tầng trời” là cách diễn đạt tiếng Việt dễ hiểu và không đồng nhất cụm từ này với một quan niệm hệ thống cụ thể.
theological_decisions:
- issue: Phạm vi nghĩa của ἀνθρώπων
  choice: mọi người
  alternative: người ta; loài người
  rationale: Danh từ Hy Lạp trong ngữ cảnh này bao gồm con người nói chung. Tiếng Việt không cần dùng một từ mang hình thức giống đực để bảo tồn ý nghĩa đại diện.
- issue: Số nhiều của οὐρανοῖς
  choice: trên các tầng trời
  alternative: trên trời
  rationale: Bản dịch chính giữ số nhiều của tiếng Hy Lạp mà không suy diễn về cấu trúc hay số lượng các tầng trời; cách nói số ít quen thuộc được ghi nhận trong chú thích.
- issue: Mối quan hệ giữa việc lành và sự tôn vinh Cha
  choice: giữ nguyên mệnh đề mục đích “để họ thấy… và tôn vinh”
  alternative: diễn giải rằng việc lành tự nó khiến người khác tin hoặc được cứu
  rationale: Nguyên văn nói đến việc người chứng kiến tôn vinh Cha, nhưng không giải thích cơ chế hay đưa ra một học thuyết chi tiết; bản dịch không bổ sung điều đó.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Anh em” được dùng như đại từ số nhiều chỉ những người được Chúa Giê-su trực tiếp phán dạy; “mọi người” thể hiện rõ phạm vi bao quát của ἀνθρώπων. Câu giữ hình ảnh ánh sáng, lực mệnh lệnh và số nhiều “các tầng trời” của nguyên văn.
