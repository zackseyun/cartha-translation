source:
  edition: SBLGNT
  text: ἔστω δὲ ὁ λόγος ὑμῶν ναὶ ναί, οὒ οὔ· τὸ δὲ περισσὸν τούτων ἐκ τοῦ πονηροῦ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/037.yaml
  text: But let your word be[a], ‘Yes, yes,’ or ‘No, no.’ Anything beyond these is from the evil one.
translation:
  language: vi
  text: 'Nhưng lời nói của anh em phải là: ‘Có’ là ‘có’, ‘không’ là ‘không’. Điều gì vượt quá những điều ấy là từ Kẻ Ác.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “là từ điều ác.” Cụm từ Hy Lạp τοῦ πονηροῦ có thể được hiểu theo nghĩa nhân cách (“Kẻ Ác”) hoặc phi nhân cách (“điều ác”).'
    reason: alternative_reading
lexical_decisions:
- source_word: ἔστω
  choice: phải là
  rationale: Động từ mệnh lệnh ngôi thứ ba diễn tả lời truyền dạy. Trong tiếng Việt, “phải là” tự nhiên và rõ hơn cách dịch sát hình thức “hãy để… là”.
- source_word: ὁ λόγος ὑμῶν
  choice: lời nói của anh em
  rationale: Trong ngữ cảnh, λόγος chỉ điều người ta nói trong giao tiếp; “lời nói” tự nhiên hơn “lời” đứng riêng và vẫn giữ tính cô đọng.
- source_word: ναὶ ναί, οὒ οὔ
  choice: ‘Có’ thì ‘có’, ‘không’ thì ‘không’
  rationale: Giữ nguyên sự lặp lại và nhịp đối xứng của tiếng Hy Lạp, đồng thời dùng cấu trúc tiếng Việt dễ hiểu để nêu yêu cầu nói năng dứt khoát, chân thật.
- source_word: τὸ δὲ περισσὸν τούτων
  choice: Bất cứ điều gì thêm vào
  rationale: Diễn đạt tự nhiên ý về điều vượt quá những lời khẳng định hoặc phủ định đơn giản vừa nêu.
- source_word: ἐκ
  choice: đến từ
  rationale: Diễn tả nguồn gốc của điều được nói đến, phù hợp với chức năng của giới từ ἐκ.
- source_word: τοῦ πονηροῦ
  choice: Kẻ Ác
  rationale: Cụm có mạo từ có thể chỉ một hữu thể ác hoặc điều ác. Cách dùng trong Ma-thi-ơ nghiêng về nghĩa nhân cách hóa, nên bản văn chính chọn “Kẻ Ác”, còn nghĩa phi nhân cách được ghi trong chú thích.
theological_decisions:
- issue: τοῦ πονηροῦ mang nghĩa phi nhân cách (“điều ác”) hay nhân cách (“Kẻ Ác”)
  choice: Kẻ Ác
  alternative: điều ác
  rationale: Ngữ pháp cho phép cả hai cách hiểu, nhưng cách dùng của Ma-thi-ơ thường hỗ trợ nghĩa chỉ một nhân vật ác. Chú thích giữ lại cách hiểu phi nhân cách để không xóa bỏ sự mơ hồ thực sự của nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cấu trúc “Có thì có, không thì không” giữ nhịp lặp của nguyên văn mà vẫn tự nhiên trong tiếng Việt; “anh em” phù hợp với lời Đức Chúa Jêsus trực tiếp dạy các môn đồ và đám đông.
