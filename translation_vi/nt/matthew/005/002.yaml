translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “Ngài” phù hợp với cách quy chiếu tôn kính đến Chúa Giê-su trong ngữ cảnh, còn thành ngữ “mở miệng” được giữ để bảo tồn sắc thái long trọng của nguyên văn.
