  text: 'And he opened his mouth and taught them[a], saying:'
translation:
  language: vi
  text: 'Ngài mở miệng và dạy họ rằng:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: và
  rationale: Giữ liên từ đơn giản của bản Hy Lạp; không thêm sắc thái thời gian mạnh hơn như “rồi” hay “bấy giờ”.
- source_word: ἀνοίξας
  choice: mở
  rationale: Động tính từ bất định có nghĩa sát là “sau khi đã mở”. Cách diễn đạt “mở miệng” giữ được hình ảnh trang trọng của nguyên văn mà vẫn dễ hiểu trong tiếng Việt.
- source_word: τὸ στόμα αὐτοῦ
  choice: miệng
  rationale: Trong cấu trúc tiếng Việt, chủ thể “Ngài” đã cho biết người sở hữu nên không cần dịch máy móc thành “miệng mình” hay “miệng của Ngài”.
- source_word: ἐδίδασκεν
  choice: dạy
  rationale: Động từ ở thì vị hoàn biểu thị hành động đang diễn tiến trong quá khứ. Tiếng Việt thường không cần đánh dấu thể này bằng “đang” trong lời dẫn kể chuyện; “dạy” tự nhiên hơn và không giới hạn hành động vào một khoảnh khắc.
- source_word: αὐτοὺς
  choice: họ
  rationale: Giữ nguyên đại từ của bản Hy Lạp, không tự xác định nhóm người này là môn đồ hay dân chúng ngay trong câu.
- source_word: λέγων
  choice: rằng
  rationale: Động tính từ hiện tại dẫn vào nội dung lời dạy. “Rằng” là cách dẫn lời tự nhiên trong tiếng Việt và thể hiện rõ mối liên hệ với động từ “dạy”.
