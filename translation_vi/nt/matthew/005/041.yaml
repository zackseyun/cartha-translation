  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ὅστις σε ἀγγαρεύσει μίλιον ἕν, ὕπαγε μετ’ αὐτοῦ δύο.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/041.yaml
  text: And whoever forces you to go one mile[c][b][a], go with him two miles.
translation:
  language: vi
  text: Và nếu ai bắt bạn phải đi một dặm[a], hãy đi với người ấy hai dặm[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Dặm” ở đây là dặm La Mã, dài khoảng 1,48 ki-lô-mét. Động từ được dùng có thể chỉ việc nhà chức trách cưỡng ép một người phục dịch hoặc mang vác.
    reason: historical_context
  - marker: b
    text: Nguyên văn chỉ viết “một dặm… hai”; từ “dặm” ở vế sau được hiểu ngầm.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅστις
  choice: nếu ai
  rationale: Đại từ quan hệ bất định nêu một trường hợp khái quát. “Nếu ai” tự nhiên trong tiếng Việt hiện đại và giữ được tính không xác định của nguyên văn.
- source_word: ἀγγαρεύσει
  choice: bắt bạn phải đi
  rationale: Động từ chỉ việc cưỡng ép hoặc trưng dụng một người để phục vụ, thường theo yêu cầu của nhà chức trách. Cách dịch này diễn đạt rõ yếu tố ép buộc; ý di chuyển được xác định bởi khoảng cách theo sau.
- source_word: μίλιον ἕν
  choice: một dặm
  rationale: Chỉ một dặm La Mã. “Một dặm” giữ hình ảnh và đơn vị khoảng cách cụ thể của nguyên văn; chú thích giải thích bối cảnh lịch sử của đơn vị này.
- source_word: ὕπαγε
  choice: hãy đi
  rationale: Mệnh lệnh của động từ mang nghĩa đi hoặc tiếp tục đi; “hãy đi” vừa trực tiếp vừa tự nhiên.
- source_word: μετ’ αὐτοῦ
  choice: với người ấy
  rationale: Giới từ μετά với sở hữu cách biểu thị sự đồng hành. “Người ấy” tránh áp đặt giới tính trong tiếng Việt dù đại từ Hy Lạp có giống đực ngữ pháp trong trường hợp khái quát.
- source_word: δύο
  choice: hai dặm
  rationale: Nguyên văn chỉ ghi “hai”, lược bỏ danh từ đã xuất hiện trước đó. Tiếng Việt tự nhiên hơn khi nhắc lại “dặm”, mà không làm thay đổi ý nghĩa.
theological_decisions:
- issue: Bối cảnh xã hội-lịch sử của việc bị cưỡng ép phục dịch
  choice: Diễn đạt sự cưỡng ép trong câu chính nhưng không chỉ rõ người cưỡng ép là lính La Mã.
  alternative: Dịch tường minh là bị lính La Mã bắt phục dịch.
  rationale: Động từ ἀγγαρεύω và đơn vị dặm gợi mạnh đến việc nhà chức trách thời La Mã trưng dụng dân chúng, nhưng câu Hy Lạp không trực tiếp nhắc đến binh lính hay chính quyền. Bản dịch giữ sức nặng của sự cưỡng ép mà không thu hẹp đối tượng quá mức nguyên văn.
translation_notes:
  register: Văn phong hiện đại, rõ ràng và trang trọng vừa phải. Đại từ “bạn” truyền đạt trực tiếp ngôi thứ hai số ít theo nguyên văn mà không mang sắc thái giới tính; “người ấy” giữ tính khái quát của nhân vật cưỡng ép.
