  text: Μὴ νομίσητε ὅτι ἦλθον καταλῦσαι τὸν νόμον ἢ τοὺς προφήτας· οὐκ ἦλθον καταλῦσαι ἀλλὰ πληρῶσαι·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/017.yaml
  text: Do not think that I came to abolish the Law or the Prophets[b][a]; I did not come to abolish them but to fulfill them.
translation:
  language: vi
  text: Đừng tưởng rằng tôi đến để bãi bỏ Luật pháp hay các Tiên tri; tôi không đến để bãi bỏ, nhưng để làm trọn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Làm trọn” cũng có thể được hiểu là “đưa đến chỗ trọn vẹn” hoặc “thể hiện đầy đủ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ νομίσητε
  choice: Đừng tưởng rằng
  rationale: Mệnh đề cấm với μή và động từ ở thể giả định aorist được diễn đạt tự nhiên, trực tiếp trong tiếng Việt bằng “Đừng tưởng rằng”; cách này cũng giữ sắc thái sửa lại một nhận định sai.
- source_word: ἦλθον
  choice: tôi đến
  rationale: Tiếng Việt không bắt buộc đánh dấu thì như tiếng Hy Lạp; “tôi đến” tự nhiên trong lời nói trực tiếp và có thể bao quát sắc thái “đã đến/đến đây” theo ngữ cảnh.
- source_word: καταλῦσαι
  choice: để bãi bỏ
  rationale: Trong quan hệ với Luật pháp và sách Các Tiên tri, động từ chỉ việc hủy bỏ hiệu lực hay gạt bỏ, chứ không chủ yếu nói đến phá hủy vật chất. “Bãi bỏ” rõ ràng và phù hợp ngữ cảnh pháp lý–Kinh Thánh.
- source_word: τὸν νόμον
  choice: Luật pháp
  rationale: “Luật pháp” là cách gọi trang trọng, quen thuộc trong tiếng Việt đối với Torah/Luật Môi-se và, khi đi đôi với Các Tiên tri, chỉ một phần của Kinh Thánh Israel.
- source_word: τοὺς προφήτας
  choice: sách Các Tiên tri
  rationale: Thêm “sách” để người đọc hiểu đây là phần sách tiên tri trong Kinh Thánh, không chỉ là những cá nhân tiên tri; điều này phù hợp với công thức “Luật pháp hoặc Các Tiên tri”.
- source_word: ἀλλὰ πληρῶσαι
  choice: nhưng để làm trọn
  rationale: '“Làm trọn” giữ được chiều rộng của πληρόω: thực hiện, đưa đến mức viên mãn hay bày tỏ đầy đủ, mà không khóa câu vào một cách giải thích thần học duy nhất. Tân ngữ không được thêm sau động từ vì nguyên văn cũng để ngầm hiểu.'
theological_decisions:
- issue: Ý nghĩa của πληρῶσαι đối với mối quan hệ của Chúa Giê-su với Luật pháp và Các Tiên tri
  choice: làm trọn
  alternative: hoàn tất; đưa đến chỗ trọn vẹn; thể hiện đầy đủ
  rationale: “Làm trọn” bảo tồn sức nặng liên văn bản và sự rộng nghĩa của động từ Hy Lạp, không quyết định thay người đọc rằng câu chỉ nói về hoàn tất, tuân giữ, ứng nghiệm lời tiên tri hay xác lập ý nghĩa đầy đủ.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “tôi” theo lời nói trực tiếp của Chúa Giê-su, tránh nâng cấp đại từ theo truyền thống hệ phái. Dấu chân chú [a] đặt ngay sau cụm từ cần giải thích.
