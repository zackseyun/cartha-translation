id: MAT.24.27
reference: Matthew 24:27
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὥσπερ γὰρ ἡ ἀστραπὴ ἐξέρχεται ἀπὸ ἀνατολῶν καὶ φαίνεται ἕως δυσμῶν, οὕτως ⸀ἔσται ἡ παρουσία τοῦ υἱοῦ τοῦ ἀνθρώπου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/027.yaml
  text: For just as the lightning comes from the east and is seen as far as the west[a], so will the coming of the Son of Man be.
translation:
  language: vi
  text: Vì chớp lóe lên từ phương đông và được thấy tận phương tây thế nào, thì sự đến[a] của Con Người sẽ như vậy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “sự hiện diện”. Từ Hy Lạp παρουσία có thể chỉ sự hiện diện hoặc sự đến; trong ngữ cảnh này, từ ấy nói đến sự đến trong tương lai của Con Người.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥσπερ γὰρ
  choice: Vì như ... thế nào
  rationale: “Vì” giữ chức năng giải thích của γάρ, còn kết cấu “như ... thế nào ... cũng ... như vậy” diễn đạt tự nhiên phép so sánh do ὥσπερ và οὕτως tạo nên.
- source_word: ἡ ἀστραπή
  choice: chớp
  rationale: Chỉ hiện tượng tia chớp; cách nói ngắn gọn, tự nhiên trong tiếng Việt hiện đại.
- source_word: ἐξέρχεται
  choice: lóe
  rationale: Theo nghĩa đen là “đi ra/xuất hiện”; với chủ thể là chớp, “lóe” diễn đạt tự nhiên sự bừng hiện mà không biến động từ thành một thuật ngữ kỹ thuật.
- source_word: ἀπὸ ἀνατολῶν
  choice: từ phương đông
  rationale: Trong thế đối xứng với δυσμῶν, ἀνατολῶν chỉ hướng đông; “phương đông” giữ sắc thái trang trọng vừa phải.
- source_word: φαίνεται
  choice: được thấy
  rationale: 'Giữ hình thái và ý nghĩa bị động: tia chớp hiện rõ, có thể được nhìn thấy công khai.'
- source_word: ἕως δυσμῶν
  choice: tận phương tây
  rationale: “Tận” thể hiện phạm vi kéo dài đến điểm cuối do ἕως biểu thị, đồng thời giữ thế đối xứng đông–tây.
- source_word: οὕτως ἔσται
  choice: cũng sẽ như vậy
  rationale: Giữ lực tương lai của ἔσται và hoàn chỉnh cấu trúc so sánh tương ứng trong tiếng Việt.
- source_word: ἡ παρουσία
  choice: sự quang lâm
  rationale: Trong ngữ cảnh cánh chung, παρουσία nói đến việc Con Người đến và hiện diện công khai. “Sự quang lâm” là cách diễn đạt Kinh Thánh quen thuộc trong tiếng Việt; chú thích giữ lại các khả năng từ vựng “sự hiện diện” và “việc đến” để không xóa bỏ độ rộng nghĩa.
- source_word: τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: của Con Người
  rationale: Giữ danh hiệu truyền thống, dễ nhận biết và mối liên hệ liên văn bản, không diễn giải thêm căn tính của nhân vật.
theological_decisions:
- issue: Cách dịch παρουσία trong lời nói về thời sau cùng
  choice: sự quang lâm
  alternative: sự hiện diện; việc đến
  rationale: Phép ví với tia chớp công khai và không thể nhầm lẫn hướng đến biến cố Con Người đến. “Sự quang lâm” truyền đạt nghĩa cánh chung trong ngữ cảnh mà không quy định một hệ thống giáo lý chi tiết; chú thích bảo tồn nghĩa từ vựng rộng hơn là “sự hiện diện” hoặc “việc đến”.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cấu trúc “như ... thế nào, thì ... cũng ... như vậy” giữ rõ phép so sánh; “phương đông/phương tây” tạo sắc thái Kinh Thánh tự nhiên. Dấu chú thích [a] được đặt ngay sau thuật ngữ cần giải thích.
