id: MAT.24.9
reference: Matthew 24:9
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Τότε παραδώσουσιν ὑμᾶς εἰς θλῖψιν καὶ ἀποκτενοῦσιν ὑμᾶς, καὶ ἔσεσθε μισούμενοι ὑπὸ πάντων τῶν ἐθνῶν διὰ τὸ ὄνομά μου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/009.yaml
  text: Then they will hand you over to affliction and kill you[c][b][a], and you will be hated by all the nations because of my name.
translation:
  language: vi
  text: Bấy giờ, người ta sẽ nộp anh em để chịu hoạn nạn[a] và giết anh em; anh em sẽ bị mọi dân tộc[b] thù ghét vì danh Ta.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hy Lạp có thể chỉ hoạn nạn, khốn khó, áp bức hoặc bách hại.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “mọi nước”; trong một số văn cảnh, từ này có nghĩa là “dân ngoại”.
    reason: lexical_alternative
  - marker: c
    text: Nghĩa đen là “vì danh Ta”, tức vì thuộc về Đức Giê-su và vì những gì danh Ngài đại diện.
    reason: lexical_clarification
lexical_decisions:
- source_word: Τότε
  choice: Bấy giờ
  rationale: Trạng từ chỉ thời gian và trình tự trong lời giảng; “Bấy giờ” tự nhiên, trang trọng và nối tiếp diễn tiến của lời tiên báo.
- source_word: παραδώσουσιν ὑμᾶς
  choice: người ta sẽ nộp anh em
  rationale: παραδίδωμι diễn tả việc trao hoặc nộp ai vào quyền lực của kẻ khác. Chủ ngữ không được nêu trong tiếng Hy Lạp, nên “người ta” giữ tính phiếm chỉ; “anh em” biểu đạt ngôi thứ hai số nhiều.
- source_word: εἰς θλῖψιν
  choice: để chịu hoạn nạn
  rationale: θλῖψις có thể chỉ cảnh khốn khó, áp bức hoặc hoạn nạn. Cách diễn đạt này tự nhiên trong tiếng Việt, đồng thời giữ được sức nặng và âm hưởng cánh chung có thể có trong văn cảnh.
- source_word: ἀποκτενοῦσιν ὑμᾶς
  choice: giết anh em
  rationale: Diễn đạt trực tiếp động từ tương lai mang nghĩa giết, không thêm sắc thái pháp lý của “xử tử” hay phán đoán đạo đức riêng của “sát hại”.
- source_word: ἔσεσθε μισούμενοι
  choice: anh em sẽ bị ... thù ghét
  rationale: Thể tương lai bị động được chuyển sang cấu trúc bị động tự nhiên trong tiếng Việt; “thù ghét” thể hiện rõ sự chống đối hơn “ghét” đơn thuần.
- source_word: ὑπὸ πάντων τῶν ἐθνῶν
  choice: bị mọi dân tộc thù ghét
  rationale: ἔθνη ở đây phù hợp nhất với phạm vi phổ quát là “các dân tộc”, hơn là thu hẹp thành “dân ngoại”.
- source_word: διὰ τὸ ὄνομά μου
  choice: vì danh Ta
  rationale: Giữ nguyên hình ảnh thần học về “danh”, tức con người, thẩm quyền và điều Đức Giê-su đại diện, thay vì diễn giải ngay trong chính văn.
theological_decisions:
- issue: Sắc thái của θλῖψις trong bài giảng về thời kỳ sau cùng
  choice: hoạn nạn
  alternative: khốn khó; áp bức; bách hại
  rationale: “Hoạn nạn” vừa có nghĩa đau khổ thực tế vừa có thể giữ âm hưởng cánh chung, nhưng không biến từ này thành một thuật ngữ của hệ thống thời kỳ cuối cùng cụ thể.
- issue: Phạm vi nghĩa của ἔθνη
  choice: mọi dân tộc
  alternative: mọi dân ngoại
  rationale: Văn cảnh nhấn mạnh sự thù ghét rộng khắp; “mọi dân tộc” giữ phạm vi phổ quát và tránh áp đặt sự đối lập Do Thái–dân ngoại mà câu không nhất thiết đòi hỏi.
- issue: Ý nghĩa của “danh Ta”
  choice: giữ nguyên “vì danh Ta” trong chính văn
  alternative: vì thuộc về Ta; vì trung thành với Ta
  rationale: Cụm từ gốc có chiều sâu đại diện cho chính Đức Giê-su và lòng trung thành với Ngài. Giữ lối nói “danh Ta” bảo tồn hình ảnh Kinh Thánh, còn chú thích giúp người đọc hiểu mà không đóng khung ý nghĩa.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh em” để thể hiện ngôi thứ hai số nhiều trong lời Đức Giê-su nói với các môn đồ, và viết hoa “Ta” theo quy ước tôn kính phổ biến. Các chú thích được đặt ngay sau cụm từ liên quan, theo thứ tự [a], [b], [c].
