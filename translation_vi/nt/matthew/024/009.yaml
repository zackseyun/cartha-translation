  source_fidelity: 'Bản dịch chuyển đạt đầy đủ các thành phần chính của câu Hy Lạp: mốc thời gian Τότε (“Bấy giờ”), việc bị trao/nộp vào hoạn nạn, việc bị giết, tình trạng sẽ bị thù ghét bởi mọi dân tộc, và lý do “vì danh Ta.” “Người ta” là cách biểu đạt phiếm chỉ hợp lý cho chủ ngữ số nhiều không được nêu rõ. “Để chịu hoạn nạn” diễn đạt tự nhiên kết quả của việc bị nộp vào θλῖψις mà không thu hẹp từ này chỉ còn nghĩa bách hại.'
