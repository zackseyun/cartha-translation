reference: Matthew 24:38
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸀ὡς γὰρ ἦσαν ἐν ταῖς ⸀ἡμέραις ταῖς πρὸ τοῦ κατακλυσμοῦ τρώγοντες καὶ πίνοντες, γαμοῦντες καὶ ⸀γαμίζοντες, ἄχρι ἧς ἡμέρας εἰσῆλθεν Νῶε εἰς τὴν κιβωτόν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/038.yaml
  text: For as in the days before the flood they were eating and drinking[a], marrying and giving in marriage, until the day Noah entered the ark,
translation:
  language: vi
  text: Vì như trong những ngày trước trận lụt, người ta vẫn ăn uống, kết hôn và gả người khác[a], cho đến ngày Nô-ê vào chiếc tàu,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “kết hôn và được gả.” Tiếng Hy Lạp dùng hai động từ khác nhau; động từ thứ hai có thể chỉ việc gả người khác hoặc việc được gả.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς γὰρ
  choice: Vì trong
  rationale: “Vì” giữ chức năng giải thích của γάρ, còn cấu trúc toàn câu cùng cụm chỉ thời gian truyền đạt phép so sánh do ὡς mở đầu; cách diễn đạt này tự nhiên trong tiếng Việt khi câu tiếp nối câu trước.
- source_word: ἦσαν ... τρώγοντες καὶ πίνοντες
  choice: người ta vẫn ăn uống
  rationale: Thể vị ngữ gồm động từ ở thì chưa hoàn thành và các phân từ mô tả hoạt động đang tiếp diễn. “Vẫn” thể hiện sự tiếp diễn, còn “người ta” là chủ ngữ phiếm chỉ tự nhiên trong tiếng Việt.
- source_word: ἐν ταῖς ἡμέραις ταῖς πρὸ τοῦ κατακλυσμοῦ
  choice: trong những ngày trước trận lụt
  rationale: Diễn đạt rõ quan hệ thời gian; “trận lụt” là cách gọi hiện đại, dễ hiểu và giữ liên hệ với chuyện Nô-ê.
- source_word: τρώγοντες καὶ πίνοντες
  choice: ăn uống
  rationale: Giữ sắc thái trung tính của những sinh hoạt bình thường, không tự ý thêm ý say sưa hay phóng túng.
- source_word: γαμοῦντες καὶ γαμίζοντες
  choice: kết hôn và gả cưới
  rationale: “Kết hôn” diễn đạt γαμέω mà không giới hạn giới tính; “gả cưới” giữ sự phân biệt với γαμίζω, chỉ việc thu xếp hoặc trao người khác vào hôn nhân. Chú thích bảo lưu khả năng hiểu động từ thứ hai ở nghĩa bị động.
- source_word: ἄχρι ἧς ἡμέρας
  choice: cho đến ngày
  rationale: Diễn đạt tự nhiên điểm kết thúc của chuỗi hoạt động đang tiếp diễn.
- source_word: εἰσῆλθεν Νῶε εἰς τὴν κιβωτόν
  choice: Nô-ê vào con tàu
  rationale: “Vào” diễn đạt trực tiếp εἰσῆλθεν; “con tàu” là cách gọi rõ nghĩa, tự nhiên đối với κιβωτός trong trình thuật Nô-ê, không hàm ý một loại tàu cụ thể ngoài văn bản.
theological_decisions:
- issue: Các hoạt động được liệt kê là sự buông thả tội lỗi hay sinh hoạt đời thường trước sự phán xét bất ngờ
  choice: Dịch trung tính như những sinh hoạt bình thường đang tiếp diễn
  alternative: Dùng từ ngữ gợi sự ăn chơi, phóng túng hoặc bất cẩn về đạo đức
  rationale: Các phân từ Hy Lạp chỉ nói đến ăn, uống và hôn nhân, không kèm từ định phẩm lên án. Trong ngữ cảnh, trọng tâm là đời sống vẫn diễn ra bình thường cho đến biến cố bất ngờ; bản dịch không nên thêm lời kết án mà nguyên văn không nói rõ.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Người ta vẫn” diễn đạt chủ ngữ phiếm chỉ cùng hành động tiếp diễn. Câu giữ dấu phẩy cuối vì đây là một phần của câu so sánh kéo dài sang câu kế tiếp.
