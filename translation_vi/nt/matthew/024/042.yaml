  text: γρηγορεῖτε οὖν, ὅτι οὐκ οἴδατε ποίᾳ ⸀ἡμέρᾳ ὁ κύριος ὑμῶν ἔρχεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/042.yaml
  text: Therefore stay awake[c][b][a], because you do not know on what day your Lord is coming.
translation:
  language: vi
  text: Vậy, hãy tỉnh thức[a], vì anh em không biết ngày nào Chúa của anh em đến[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “hãy canh thức” hoặc “hãy cảnh giác.”'
    reason: lexical_alternative
  - marker: b
    text: 'Hoặc: “vào ngày nào Chúa của anh em đến.”'
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể dịch: “Chúa của anh em sẽ đến.” Tiếng Hy Lạp dùng hình thức thì hiện tại.'
    reason: alternative_reading
lexical_decisions:
- source_word: γρηγορεῖτε
  choice: hãy tỉnh thức
  rationale: Động từ mệnh lệnh hiện tại, số nhiều, kêu gọi sự cảnh giác liên tục. “Tỉnh thức” giữ được hình ảnh thức canh và có sắc thái trang trọng, quen thuộc nhưng vẫn dễ hiểu trong tiếng Việt hiện đại.
- source_word: οὖν
  choice: Vậy
  rationale: Từ này đánh dấu kết luận rút ra từ lời dạy trước đó. “Vậy” tự nhiên và rõ quan hệ suy luận trong tiếng Việt.
- source_word: ὅτι
  choice: vì
  rationale: Dẫn vào lý do của mệnh lệnh; “vì” là cách diễn đạt tự nhiên, trực tiếp.
- source_word: οὐκ οἴδατε
  choice: anh em không biết
  rationale: Truyền đạt trực tiếp động từ biết ở thể phủ định và giữ đối tượng nghe ở số nhiều.
- source_word: ποίᾳ ἡμέρᾳ
  choice: vào ngày nào
  rationale: Cụm cách ba chỉ thời điểm; “vào ngày nào” là lối nói tự nhiên và giữ nguyên tính không xác định của ngày ấy.
- source_word: ὁ κύριος ὑμῶν
  choice: Chúa của anh em
  rationale: Giữ danh xưng κύριος là “Chúa” và diễn đạt rõ đại từ sở hữu số nhiều ὑμῶν, không đồng nhất người kể hay độc giả với nhóm người nghe.
- source_word: ἔρχεται
  choice: đến
  rationale: Tiếng Việt không bắt buộc đánh dấu thì. Dùng “đến” không kèm “sẽ” vừa tự nhiên vừa giữ được hình thức hiện tại và độ mở về sắc thái thời gian của nguyên văn.
theological_decisions:
- issue: Sắc thái cánh chung của động từ hiện tại ἔρχεται
  choice: 'Dịch không đánh dấu thì: “đến”'
  alternative: “sẽ đến” hoặc “đang đến”
  rationale: Nguyên văn dùng thì hiện tại trong ngữ cảnh cánh chung. Cách diễn đạt không đánh dấu thì của tiếng Việt bảo toàn tính sống động và sự khẩn thiết mà không ấn định quá mức là tương lai đơn thuần hay một tiến trình đang xảy ra.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Anh em” phù hợp với lời Đức Giê-su nói với nhiều môn đồ; “tỉnh thức” duy trì hình ảnh thức canh của nguyên ngữ. Trật tự câu được giữ tự nhiên trong tiếng Việt, còn động từ “đến” không đánh dấu thì nhằm bảo toàn độ mở của hình thức hiện tại Hy Lạp.
