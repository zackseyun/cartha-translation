review_pass:
  verdict: revise
  source_fidelity: Bản nháp chuyển đạt đúng μακάριος, δοῦλος, κύριος và ý συνεχ diễn của οὕτως ποιοῦντα. Tuy nhiên, “khi trở về” không tương ứng chính xác với phân từ ἐλθών (“khi đến”); nguyên văn không nêu rõ hành động “trở về”. Cấu trúc hiện tại cũng có thể khiến người đọc thoạt hiểu người đầy tớ là chủ thể của “trở về”.
  naturalness: Cần đặt rõ “chủ nó” làm chủ thể của hành động đến và thấy. Cách viết có đại từ lặp lại (“thấy nó”) tự nhiên, minh bạch trong tiếng Việt hiện đại.
  terminology: “Phước cho”, “đầy tớ”, và “chủ” phù hợp ngữ cảnh dụ ngôn và giữ đúng quan hệ chủ–đầy tớ. Không cần chú thích.
