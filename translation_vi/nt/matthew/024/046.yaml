  - severity: low
    issue: Mơ hồ cú pháp trong “người mà khi trở về, chủ sẽ thấy...”
    rationale: Vị trí “khi trở về” trước “chủ” có thể tạm thời gây mơ hồ về người thực hiện hành động. Đưa “chủ nó” lên trước và thêm “nó” sau “thấy” làm rõ các vai tham thể của câu Hy Lạp.
  revised_text: Phước cho đầy tớ ấy mà chủ nó, khi đến, sẽ thấy nó đang làm như vậy.
