  text: μακάριος ὁ δοῦλος ἐκεῖνος ὃν ἐλθὼν ὁ κύριος αὐτοῦ εὑρήσει ⸂οὕτως ποιοῦντα⸃·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/046.yaml
  text: Blessed is that servant whom his lord, when he comes, will find doing so.
translation:
  language: vi
  text: Phước cho đầy tớ ấy mà chủ nó, khi đến, sẽ thấy nó đang làm như vậy.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μακάριος
  choice: Phước cho
  rationale: Diễn đạt lời tuyên bố về tình trạng được phước, tự nhiên và trang trọng trong tiếng Việt, thay vì chỉ mô tả cảm xúc là “hạnh phúc”.
- source_word: δοῦλος
  choice: đầy tớ
  rationale: Trong ngữ cảnh dụ ngôn về một gia chủ giao trách nhiệm cho người dưới quyền, “đầy tớ” truyền đạt đúng vai trò phục dịch mà không thêm chi tiết ngoài câu.
- source_word: κύριος
  choice: chủ
  rationale: Ở đây từ này chỉ người chủ của đầy tớ trong dụ ngôn; “chủ” là cách gọi tự nhiên trong tiếng Việt và vẫn giữ quan hệ quyền bính của nguyên văn.
- source_word: οὕτως ποιοῦντα
  choice: đang làm như vậy
  rationale: Giữ giá trị tiếp diễn của phân từ ποιοῦντα và sự hồi chỉ của οὕτως về nhiệm vụ vừa được mô tả.
theological_decisions:
- issue: Danh xưng κύριος trong dụ ngôn
  choice: chủ
  alternative: Chúa
  rationale: Câu trực tiếp nói về chủ của một đầy tớ; viết “Chúa” sẽ sớm xác định danh tính thần học mà hình ảnh dụ ngôn chỉ hàm ý qua ngữ cảnh.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cấu trúc “người mà khi trở về, chủ sẽ thấy...” giữ quan hệ mệnh đề của nguyên văn, đồng thời tránh nhầm người đầy tớ là chủ thể của động từ “thấy”.
