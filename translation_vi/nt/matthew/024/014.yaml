id: MAT.24.14
reference: Matthew 24:14
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ κηρυχθήσεται τοῦτο τὸ εὐαγγέλιον τῆς βασιλείας ἐν ὅλῃ τῇ οἰκουμένῃ εἰς μαρτύριον πᾶσιν τοῖς ἔθνεσιν, καὶ τότε ἥξει τὸ τέλος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/014.yaml
  text: And this good news of the kingdom will be proclaimed throughout the whole world as a testimony to all the nations[c][b][a], and then the end will come.
translation:
  language: vi
  text: Và Tin Mừng về vương quốc này sẽ được rao truyền khắp thế giới[a] để làm chứng cho mọi dân tộc[b], thì bấy giờ sự kết thúc sẽ đến.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “khắp cả thế giới có người ở.”
    reason: lexical_alternative
  - marker: b
    text: Hay “cho muôn dân.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κηρυχθήσεται
  choice: sẽ được rao truyền
  rationale: Dạng tương lai bị động nhấn mạnh việc thông điệp được công bố rộng rãi. “Rao truyền” tự nhiên trong tiếng Việt, giữ sắc thái công khai của động từ Hy Lạp mà không giới hạn vào hoạt động giảng trong nhà thờ.
- source_word: εὐαγγέλιον
  choice: Tin Mừng
  rationale: “Tin Mừng” là cách diễn đạt rõ nghĩa, trang trọng và quen thuộc trong tiếng Việt hiện đại cho ý niệm “tin tốt lành,” đồng thời thích hợp với trọng lượng thần học của từ trong ngữ cảnh.
- source_word: τῆς βασιλείας
  choice: về vương quốc
  rationale: Cụm sở hữu cách có thể diễn đạt tự nhiên là “về vương quốc,” nêu nội dung của Tin Mừng mà không thêm rõ “của Đức Chúa Trời,” điều vốn không được nói trực tiếp trong câu này. “Của vương quốc” sát hình thức hơn nhưng kém tự nhiên trong tiếng Việt.
- source_word: ἐν ὅλῃ τῇ οἰκουμένῃ
  choice: khắp thế giới
  rationale: οἰκουμένη chỉ thế giới có người ở hoặc thế giới loài người được biết đến. “Khắp thế giới” truyền đạt tự nhiên phạm vi rộng của câu; nét nghĩa sát chữ hơn được giữ trong chú thích.
- source_word: εἰς μαρτύριον
  choice: để làm chứng
  rationale: Cụm này có thể chỉ mục đích hoặc kết quả. “Để làm chứng” giữ sức nặng của hành vi chứng thực mà không quyết định lời chứng ấy có lợi hay chống lại người nghe.
- source_word: πᾶσιν τοῖς ἔθνεσιν
  choice: cho mọi dân tộc
  rationale: ἔθνη ở đây chỉ rộng rãi các dân hay các dân tộc, không nhất thiết chỉ dân ngoại đối lập với người Do Thái. “Mọi dân tộc” tự nhiên và tránh gợi ý các quốc gia chính trị hiện đại.
- source_word: ἥξει
  choice: sẽ đến
  rationale: Cách tương đương trực tiếp, tự nhiên cho động từ mang nghĩa “đến” trong ngữ cảnh cánh chung.
- source_word: τὸ τέλος
  choice: sự cuối cùng
  rationale: Cụm danh từ có mạo từ chỉ “điểm cuối/sự kết thúc.” “Sự cuối cùng” giữ cách nói cô đọng và không nhập thêm một lịch trình cánh chung cụ thể.
theological_decisions:
- issue: Phạm vi của οἰκουμένη và ἔθνη trong lời nói về thời cuối cùng
  choice: 'Dùng ngôn ngữ có phạm vi phổ quát: “khắp thế giới” và “mọi dân tộc.”'
  alternative: “Khắp cả thế giới có người ở” hoặc “cho muôn dân.”
  rationale: Bản dịch giữ chiều rộng phổ quát của lời tuyên bố nhưng không đồng nhất οἰκουμένη riêng với Đế quốc La Mã, cũng không biến câu này thành một thuật ngữ truyền giáo hoặc lịch trình cánh chung kỹ thuật.
- issue: Quan hệ của εἰς μαρτύριον với người nghe
  choice: Dịch trung tính là “để làm chứng.”
  alternative: “Để làm chứng cho họ” hoặc “làm chứng chống lại họ.”
  rationale: Nguyên văn không xác định rõ lời chứng có lợi hay mang tính cáo buộc, nên bản dịch không âm thầm giải quyết sự mơ hồ ấy.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “Tin Mừng” như thuật ngữ quen thuộc nhưng vẫn minh bạch; tránh từ ngữ quá kỹ thuật hoặc cách diễn đạt gắn riêng với một hệ phái. Các dấu chú thích [a], [b] đều xuất hiện ngay trong chính văn.
