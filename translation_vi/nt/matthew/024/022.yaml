id: MAT.24.22
reference: Matthew 24:22
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ εἰ μὴ ἐκολοβώθησαν αἱ ἡμέραι ἐκεῖναι, οὐκ ἂν ἐσώθη πᾶσα σάρξ· διὰ δὲ τοὺς ἐκλεκτοὺς κολοβωθήσονται αἱ ἡμέραι ἐκεῖναι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/022.yaml
  text: And if those days had not been cut short[a], no flesh would have been saved; but for the sake of the elect[b], those days will be cut short.
translation:
  language: vi
  text: Và nếu những ngày ấy không được rút ngắn[a], thì chẳng một người nào[b] được cứu; nhưng vì những người được chọn, những ngày ấy sẽ được rút ngắn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “không bị cắt ngắn … sẽ bị cắt ngắn.” Động từ Hy Lạp có thể diễn tả việc làm ngắn lại hoặc cắt bớt.'
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn: “chẳng xác thịt nào”; đây là một thành ngữ Kinh Thánh có nghĩa là không một con người nào.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκολοβώθησαν / κολοβωθήσονται
  choice: không được rút ngắn / sẽ được rút ngắn
  rationale: Động từ κολοβόω mang nghĩa làm ngắn lại hoặc cắt bớt. “Rút ngắn” là cách nói tự nhiên trong tiếng Việt khi nói về thời gian, đồng thời giữ được ý rằng thời lượng của những ngày ấy bị giới hạn.
- source_word: οὐκ ἂν ἐσώθη
  choice: chẳng ... được cứu
  rationale: Cấu trúc Hy Lạp diễn tả kết quả trái với thực tế. Trong bối cảnh hoạn nạn, σῴζω trước hết có thể chỉ việc bảo toàn mạng sống, nhưng “được cứu” giữ được phạm vi nghĩa rộng hơn của từ mà không thu hẹp thành “sống sót”.
- source_word: πᾶσα σάρξ
  choice: chẳng một người nào
  rationale: Nghĩa đen là “mọi xác thịt”, nhưng trong mệnh đề phủ định đây là thành ngữ Kinh Thánh chỉ không một con người nào. “Chẳng một người nào” truyền đạt rõ nghĩa trong tiếng Việt hiện đại; chú thích lưu lại hình ảnh nguyên ngữ.
- source_word: διὰ δὲ τοὺς ἐκλεκτούς
  choice: nhưng vì những người được chọn
  rationale: διά với đối cách ở đây nêu lý do hoặc lợi ích. “Vì” tự nhiên và không buộc phải phân định giữa sắc thái “vì cớ” và “vì lợi ích của”. ἐκλεκτοί được dịch theo nghĩa trực tiếp, không xác định thêm nhóm người này là ai.
- source_word: αἱ ἡμέραι ἐκεῖναι
  choice: những ngày ấy
  rationale: Cách dịch trực tiếp, tự nhiên, giữ nguyên lực chỉ định của ἐκεῖναι.
- source_word: καὶ εἰ μὴ
  choice: Và nếu ... không
  rationale: Giữ liên từ nối câu và cấu trúc điều kiện minh nhiên của nguyên văn.
theological_decisions:
- issue: Ý nghĩa của ἐκλεκτοί trong lời giảng về thời kỳ cuối cùng
  choice: những người được chọn
  alternative: dân được Đức Chúa Trời chọn; các tín hữu; số người trung tín còn sót lại
  rationale: Câu này gọi một nhóm là ἐκλεκτοί nhưng không tự xác định đầy đủ phạm vi thần học của nhóm ấy. Bản dịch không giải quyết thay nguyên văn những cách hiểu khác nhau.
- issue: Sắc thái của σῴζω trong bối cảnh tai họa
  choice: được cứu
  alternative: sống sót; được bảo toàn mạng sống
  rationale: Bối cảnh gợi mạnh đến việc thoát chết, nhưng “được cứu” bảo tồn độ rộng từ vựng và không biến ý nghĩa thành hoàn toàn thuộc thể hoặc hoàn toàn thuộc linh.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Rút ngắn” phù hợp tự nhiên với thời gian; “chẳng một người nào” tránh lối dịch từng chữ khó hiểu, còn chú thích bảo tồn hình ảnh “xác thịt”. Cụm “những người được chọn” có tính minh bạch và không mang thêm kết luận hệ phái.
