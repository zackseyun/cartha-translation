id: MAT.24.44
reference: Matthew 24:44
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: διὰ τοῦτο καὶ ὑμεῖς γίνεσθε ἕτοιμοι, ὅτι ᾗ ⸂οὐ δοκεῖτε ὥρᾳ⸃ ὁ υἱὸς τοῦ ἀνθρώπου ἔρχεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/044.yaml
  text: For this reason[a], you also must be ready, because the Son of Man is coming at an hour you do not expect.
translation:
  language: vi
  text: 'Vì thế, anh em cũng hãy sẵn sàng, vì Con Người sẽ đến vào giờ anh em không ngờ.[a]


    [a] Cũng có thể dịch: “vào giờ anh em không nghĩ tới.” Động từ Hy Lạp có thể mang nghĩa “nghĩ”, “cho rằng”, hoặc theo ngữ cảnh là “ngờ/đợi.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “vào giờ anh em không nghĩ tới.” Động từ Hy Lạp có thể mang nghĩa “nghĩ”, “cho rằng”, hoặc theo ngữ cảnh là “ngờ/đợi.”'
    reason: Giữ lại khả năng từ vựng của δοκέω; bản chính dùng “không ngờ” vì tự nhiên hơn trong ngữ cảnh cảnh báo.
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Vì thế
  rationale: Cụm giới từ với đại từ chỉ định liên kết câu này với lời cảnh báo ngay trước đó và mang ý suy luận-nguyên nhân. “Vì thế” tự nhiên, rõ nghĩa trong tiếng Việt.
- source_word: καὶ ὑμεῖς
  choice: anh em cũng
  rationale: καί cùng đại từ được nêu rõ tạo sắc thái bao gồm và nhấn mạnh. “Anh em cũng” giữ được sắc thái ấy mà không cường điệu.
- source_word: γίνεσθε ἕτοιμοι
  choice: hãy sẵn sàng
  rationale: Mệnh lệnh hiện tại số nhiều kêu gọi người nghe ở trong tư thế sẵn sàng. Tiếng Việt tự nhiên dùng “hãy sẵn sàng”; dịch sát là “hãy trở nên sẵn sàng” dễ gây cảm giác chỉ nói đến thời điểm bắt đầu.
- source_word: ὅτι
  choice: vì
  rationale: Ở đây ὅτι nêu lý do cho mệnh lệnh, nên “vì” diễn đạt đúng quan hệ nguyên nhân.
- source_word: ᾗ οὐ δοκεῖτε ὥρᾳ
  choice: vào giờ anh em không ngờ
  rationale: Cấu trúc cách dữ cách là thành ngữ thời gian, nghĩa là “vào giờ nào đó”. δοκεῖτε có thể là “nghĩ/cho rằng”, nhưng trong lời cảnh báo này “không ngờ” truyền đạt tự nhiên ý xảy ra ngoài dự liệu; phương án sát chữ hơn được giữ trong chú thích.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Con Người
  rationale: Đây là cách dịch danh hiệu theo truyền thống Kinh Thánh tiếng Việt, giữ nguyên hình thức danh xưng và âm hưởng Đa-ni-ên thay vì diễn giải.
- source_word: ἔρχεται
  choice: sẽ đến
  rationale: Hiện tại ἔρχεται được dùng với ý hướng tương lai. Tiếng Việt cần “sẽ” để câu tự nhiên và chỉ rõ sự kiện sắp xảy ra; nét cấp bách vẫn được giữ trong toàn bộ lời cảnh báo.
theological_decisions:
- issue: Cách dịch danh hiệu ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Con Người
  alternative: Đấng thuộc loài người
  rationale: “Con Người” giữ cấu trúc của danh hiệu Hy Lạp, nền tảng Sê-mít và âm hưởng có thể liên hệ đến Đa-ni-ên, đồng thời tránh giải quyết thay người đọc chiều sâu Kitô học của danh xưng.
- issue: Thì và sắc thái của ἔρχεται
  choice: sẽ đến
  alternative: đến / đang đến
  rationale: Dạng hiện tại Hy Lạp có thể mang chức năng tương lai sinh động. “Sẽ đến” là cách nói tự nhiên nhất trong tiếng Việt ở mệnh đề này, không xác định thời điểm và không thêm một lịch trình thần học ngoài văn bản.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh em” cho đại từ số nhiều trong lời Chúa Giê-su nói với các môn đồ. Dấu chú thích [a] được đặt ngay sau cụm từ mà chú thích giải thích.
