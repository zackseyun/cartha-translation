  rationale: Chỉ điều chỉnh cách chuyển đạt οὐρανῶν trong cụm cuối để có tiếng Việt hiện đại, tự nhiên và không áp đặt ý niệm “các tầng trời”. Các hình ảnh khải huyền và sự mơ hồ có chủ ý của nguyên văn vẫn được giữ nguyên; các ký hiệu chú thích tiếp tục neo đúng cụm từ liên quan.
