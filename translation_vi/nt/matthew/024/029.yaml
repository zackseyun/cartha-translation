id: MAT.24.29
reference: Matthew 24:29
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Εὐθέως δὲ μετὰ τὴν θλῖψιν τῶν ἡμερῶν ἐκείνων ὁ ἥλιος σκοτισθήσεται, καὶ ἡ σελήνη οὐ δώσει τὸ φέγγος αὐτῆς, καὶ οἱ ἀστέρες πεσοῦνται ἀπὸ τοῦ οὐρανοῦ, καὶ αἱ δυνάμεις τῶν οὐρανῶν σαλευθήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/029.yaml
  text: But immediately after the tribulation of those days[a], the sun will be darkened, and the moon will not give its light, and the stars will fall from heaven[b], and the powers of the heavens will be shaken.
translation:
  language: vi
  text: Nhưng ngay sau hoạn nạn của những ngày ấy, mặt trời sẽ tối đi, mặt trăng sẽ không tỏa ánh sáng, các ngôi sao sẽ từ trời sa xuống[a], và các quyền năng trên trời sẽ bị lay chuyển[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Trời” ở đây cũng có thể dịch là “bầu trời”.
    reason: lexical_alternative
  - marker: b
    text: “Các quyền năng trên trời” có thể chỉ các lực vũ trụ, các thiên thể hoặc các quyền lực trên trời; cụm từ Hy Lạp được giữ theo nghĩa rộng.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εὐθέως δὲ
  choice: Nhưng ngay
  rationale: “Ngay” truyền đạt rõ ý nghĩa thời gian tức thì của Εὐθέως; “nhưng” thể hiện sự chuyển tiếp có sắc thái tương phản nhẹ của δὲ.
- source_word: μετὰ τὴν θλῖψιν τῶν ἡμερῶν ἐκείνων
  choice: sau hoạn nạn của những ngày ấy
  rationale: “Hoạn nạn” là cách diễn đạt tự nhiên, trang trọng cho θλῖψις trong ngữ cảnh này; cấu trúc “của những ngày ấy” giữ quan hệ sở thuộc của nguyên văn Hy Lạp.
- source_word: ὁ ἥλιος σκοτισθήσεται
  choice: mặt trời sẽ tối đi
  rationale: Cách nói tự nhiên trong tiếng Việt, diễn đạt đúng việc mặt trời trở nên tối mà không suy đoán tác nhân của thể bị động Hy Lạp.
- source_word: ἡ σελήνη οὐ δώσει τὸ φέγγος αὐτῆς
  choice: mặt trăng sẽ không tỏa ánh sáng
  rationale: Giữ hình ảnh mặt trăng không phát ra ánh sáng, đồng thời tránh lối dịch máy móc “không cho ánh sáng của nó” vốn kém tự nhiên trong tiếng Việt.
- source_word: οἱ ἀστέρες πεσοῦνται ἀπὸ τοῦ οὐρανοῦ
  choice: các ngôi sao sẽ từ trời sa xuống
  rationale: “Sa xuống” phù hợp với văn phong tiên tri và diễn đạt πεσοῦνται tự nhiên; “trời” giữ được độ rộng nghĩa của οὐρανός, có thể chỉ bầu trời hoặc cõi trời.
- source_word: αἱ δυνάμεις τῶν οὐρανῶν
  choice: các quyền năng của các tầng trời
  rationale: “Quyền năng” giữ nghĩa rộng của δυνάμεις, còn “các tầng trời” phản ánh dạng số nhiều οὐρανῶν; cách dịch không giới hạn cụm từ vào thiên thể, lực vũ trụ hay các hữu thể trên trời.
- source_word: σαλευθήσονται
  choice: sẽ bị lay chuyển
  rationale: Giữ thể bị động và phạm vi nghĩa rộng của động từ, phù hợp với hình ảnh vũ trụ mà không giải thích quá mức.
theological_decisions:
- issue: Bản chất của các dấu hiệu vũ trụ trong văn chương khải huyền
  choice: Giữ nguyên các hình ảnh mặt trời tối đi, mặt trăng không tỏa sáng, sao sa xuống và các quyền năng bị lay chuyển mà không xác định chúng hoàn toàn theo nghĩa đen hay nghĩa biểu tượng.
  alternative: Giải thích các hình ảnh này chỉ là biến động thiên văn theo nghĩa đen, hoặc chỉ là biểu tượng về biến động chính trị và sự phán xét.
  rationale: Nguyên văn dùng hình ảnh tiên tri–khải huyền và không tự giải quyết mối căng thẳng giữa các cách hiểu; bản dịch vì thế không áp đặt một hệ thống cánh chung cụ thể.
- issue: Ý nghĩa của “các quyền năng của các tầng trời”
  choice: Dùng một cụm từ rộng và bổ sung chú thích về các khả năng ngữ nghĩa.
  alternative: Xác định cụm từ là thiên sứ, thiên thể hoặc các lực vũ trụ.
  rationale: Cụm từ Hy Lạp αἱ δυνάμεις τῶν οὐρανῶν có thể được hiểu theo nhiều hướng; việc định danh cụ thể sẽ vượt quá bằng chứng của câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Hoạn nạn”, “sa xuống” và “các tầng trời” duy trì sắc thái Kinh Thánh mà không dùng từ cổ khó hiểu. Hai chú thích được đặt ngay sau đúng cụm từ liên quan; cách đặt này sửa sự lệch vị trí ký hiệu trong lớp tham khảo tiếng Anh.
