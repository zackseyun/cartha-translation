  source_fidelity: Bản dịch truyền đạt đúng trình tự thời gian mạnh của εὐθέως, biến cố hoạn nạn, và chuỗi hình ảnh vũ trụ. “Từ trời sa xuống” phản ánh tự nhiên ἀπὸ τοῦ οὐρανοῦ và chú thích a được đặt đúng sau cụm này. Tuy nhiên, “các tầng trời” dễ gợi một quan niệm các tầng/cõi trời xác định, trong khi số nhiều οὐρανῶν ở đây không buộc phải được biểu hiện bằng một danh ngữ số nhiều như vậy trong tiếng Việt.
  naturalness: Câu nhìn chung trang trọng, hiện đại và trôi chảy. “Các quyền năng của các tầng trời” nặng và không tự nhiên trong tiếng Việt hiện đại. “Các quyền năng trên trời” tự nhiên hơn, vẫn giữ được tính không xác định của cụm từ khải huyền.
