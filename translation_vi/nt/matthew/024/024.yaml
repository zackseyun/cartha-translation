  source_fidelity: 'Bản dịch phản ánh đầy đủ các thành tố của SBLGNT: tương lai của ἐγερθήσονται (“sẽ xuất hiện”); ψευδόχριστοι được diễn giải đúng là những người giả nhận địa vị Mê-si; ψευδοπροφῆται, các “dấu lạ lớn” và “việc kỳ diệu,” mục đích/kết quả được để mở của ὥστε πλανῆσαι, điều kiện εἰ δυνατὸν, và lực tăng tiến của καὶ (“ngay cả”) trước “những người được chọn.” “Nhằm” là một cách chuyển ngữ chấp nhận được cho ὥστε + nguyên mẫu, không khẳng định kết quả thực tế.'
  naturalness: Câu tiếng Việt hiện đại, trang trọng và dễ hiểu. Cụm “những kẻ mạo xưng là Đấng Mê-si” diễn đạt tự nhiên ý “false messiahs” trong tiếng Việt, tránh cách hiểu rằng Đấng Mê-si tự thân là giả. Dấu gạch ngang quanh “nếu có thể” giúp giữ rõ điều kiện chen giữa mà không làm câu khó đọc.
  terminology: “Đấng Mê-si,” “tiên tri giả,” “dấu lạ,” và “những người được chọn” nhất quán với ngữ cảnh Kinh Thánh và không áp đặt một kết luận giáo phái về khả năng những người được chọn bị dẫn lạc. Các chú thích giữ được phương án “Đấng Ki-tô,” sắc thái của πλανάω, và tính không xác định thần học của εἰ δυνατὸν.
