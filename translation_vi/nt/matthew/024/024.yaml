id: MAT.24.24
reference: Matthew 24:24
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐγερθήσονται γὰρ ψευδόχριστοι καὶ ψευδοπροφῆται, καὶ δώσουσιν σημεῖα μεγάλα καὶ τέρατα ὥστε ⸀πλανῆσαι εἰ δυνατὸν καὶ τοὺς ἐκλεκτούς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/024.yaml
  text: For false messiahs and false prophets will arise[a], and they will perform great signs and wonders so as to lead astray, if possible[c][b], even the elect.
translation:
  language: vi
  text: Vì sẽ xuất hiện những kẻ mạo xưng là Đấng Mê-si[a] và những tiên tri giả; chúng sẽ làm những dấu lạ lớn và những việc kỳ diệu, nhằm dẫn lạc đường[b]—nếu có thể[c]—ngay cả những người được chọn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “những kẻ mạo xưng là Đấng Ki-tô.” Từ Hy Lạp dùng tước hiệu Christos; ở đây dịch là “Đấng Mê-si” vì từ này mang nghĩa tước hiệu hơn là tên riêng.'
    reason: alternative_reading
  - marker: b
    text: 'Hay: “lừa dối.” Động từ Hy Lạp có thể chỉ việc khiến ai đó đi chệch hướng hoặc lạc đường.'
    reason: lexical_alternative
  - marker: c
    text: 'Hay: “nếu điều đó là có thể.” Tiếng Hy Lạp chỉ nói ngắn gọn “nếu có thể”, không nói rõ hàm ý thần học của điều kiện này.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐγερθήσονται
  choice: sẽ xuất hiện
  rationale: Trong ngữ cảnh này, thể bị động tương lai của ἐγείρω chỉ việc những người ấy nổi lên hoặc xuất hiện, không hàm ý sự sống lại.
- source_word: ψευδόχριστοι
  choice: những kẻ mạo xưng là Đấng Mê-si
  rationale: Χριστός ở đây mang nghĩa tước hiệu; cách diễn đạt này tự nhiên trong tiếng Việt và cho thấy họ giả nhận vai trò Mê-si, thay vì gợi ý rằng bản thân Đấng Mê-si là giả.
- source_word: ψευδοπροφῆται
  choice: những tiên tri giả
  rationale: Cách dịch trực tiếp, quen thuộc và rõ nghĩa của danh từ ghép này.
- source_word: δώσουσιν
  choice: chúng sẽ làm
  rationale: Dù nghĩa cơ bản là 'cho', khi đi với 'dấu lạ và việc kỳ diệu', động từ này chỉ việc thực hiện hoặc tạo ra những hiện tượng ấy; 'làm' là tự nhiên và không thêm ý ngoài nguyên văn.
- source_word: σημεῖα μεγάλα
  choice: những dấu lạ lớn
  rationale: Giữ sắc thái 'dấu hiệu' của σημεῖα thay vì đồng nhất hoàn toàn với phép lạ; μεγάλα được dịch trực tiếp là 'lớn'.
- source_word: τέρατα
  choice: những việc kỳ diệu
  rationale: Diễn tả những hiện tượng gây kinh ngạc và tạo thành cặp ý tự nhiên với 'dấu lạ'.
- source_word: ὥστε πλανῆσαι
  choice: nhằm dẫn lạc đường
  rationale: ὥστε với động từ nguyên mẫu có thể diễn tả mục đích hoặc kết quả dự kiến; 'nhằm' giữ được hướng ý mà không khẳng định rằng sự lừa dối chắc chắn thành công.
- source_word: πλανῆσαι
  choice: dẫn lạc đường
  rationale: Giữ hình ảnh khiến người khác đi chệch hướng, rộng hơn việc chỉ nói điều gian dối.
- source_word: εἰ δυνατὸν
  choice: nếu có thể
  rationale: Dịch sát cấu trúc điều kiện ngắn gọn của tiếng Hy Lạp, không tự ý biến thành một điều kiện phản thực.
- source_word: καὶ τοὺς ἐκλεκτούς
  choice: ngay cả những người được chọn
  rationale: καί có nghĩa tăng tiến là 'ngay cả'; 'những người được chọn' là tiếng Việt hiện đại, rõ nghĩa cho ἐκλεκτούς.
theological_decisions:
- issue: Cách dịch ψευδόχριστοι khi Χριστός là một tước hiệu
  choice: những kẻ mạo xưng là Đấng Mê-si
  alternative: những Đấng Ki-tô giả; những mê-si giả
  rationale: Bản dịch giữ bối cảnh về những người giả nhận tư cách Mê-si, đồng thời tránh cách nói tiếng Việt dễ bị hiểu thành 'một Đấng Mê-si có tính giả dối'.
- issue: Ý nghĩa thần học của εἰ δυνατὸν đối với những người được chọn
  choice: nếu có thể
  alternative: nếu điều đó là có thể; nếu có thể được
  rationale: Nguyên văn chỉ nêu điều kiện, không xác định rõ điều ấy thực tế có thể xảy ra hay không; bản dịch không giải quyết thay sự căng thẳng thần học này.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “Đấng Mê-si” theo nghĩa tước hiệu, “những người được chọn” thay cho thuật ngữ thần học cô đọng hơn như “những người tuyển chọn”, và giữ nguyên tính điều kiện của câu Hy Lạp.
