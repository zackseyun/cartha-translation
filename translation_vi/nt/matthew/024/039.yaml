id: MAT.24.39
reference: Matthew 24:39
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ οὐκ ἔγνωσαν ἕως ἦλθεν ὁ κατακλυσμὸς καὶ ἦρεν ἅπαντας, οὕτως ἔσται ⸀καὶ ἡ παρουσία τοῦ υἱοῦ τοῦ ἀνθρώπου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/039.yaml
  text: And they did not know until the flood came and swept them all away; so also will be the coming of the Son of Man.
translation:
  language: vi
  text: Họ không hay biết gì cho đến khi nước lụt đến và cuốn tất cả họ đi; sự hiện đến của Con Người cũng sẽ như vậy.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐκ ἔγνωσαν
  choice: không hay biết gì
  rationale: Diễn đạt tự nhiên ý họ không nhận biết hoặc không ý thức điều sắp xảy ra, mà không thêm đối tượng vốn không được nêu trong nguyên văn.
- source_word: κατακλυσμός
  choice: cơn đại hồng thủy
  rationale: Chỉ trận lụt lớn trong câu chuyện Nô-ê; cách gọi này rõ ràng và quen thuộc trong tiếng Việt hiện đại.
- source_word: ἦρεν ἅπαντας
  choice: cuốn tất cả đi
  rationale: Trong ngữ cảnh nước lụt, cách dịch này thể hiện tự nhiên động từ αἴρω và hậu quả bất ngờ, đồng thời không diễn giải quá mức thành một tuyên bố riêng về số phận đời đời.
- source_word: παρουσία
  choice: sự hiện đến
  rationale: Giữ cả ý đến và hiện diện của παρουσία trong ngữ cảnh cánh chung; trang trọng nhưng vẫn dễ hiểu.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Con Người
  rationale: Danh xưng đã định hình trong truyền thống Kinh Thánh tiếng Việt, tương ứng với danh xưng Hy Lạp và không giản lược thành nghĩa chỉ một người bình thường.
theological_decisions:
- issue: Ý nghĩa của việc dân chúng không biết
  choice: không hay biết gì
  alternative: không hiểu
  rationale: ἔγνωσαν có thể liên quan đến biết, nhận ra hoặc ý thức; bản dịch giữ độ mở, không xác định rằng họ thiếu thông tin hay cố tình phớt lờ lời cảnh báo.
- issue: Sắc thái của παρουσία
  choice: sự hiện đến
  alternative: sự quang lâm
  rationale: “Sự hiện đến” truyền đạt nội dung từ ngữ cho độc giả phổ thông mà không phụ thuộc vào thuật ngữ thần học chuyên biệt, đồng thời vẫn giữ sắc thái cánh chung do văn cảnh cung cấp.
- issue: Phép so sánh với thời Nô-ê
  choice: sự hiện đến của Con Người cũng sẽ như vậy
  alternative: Con Người đến cũng sẽ như vậy
  rationale: Giữ cấu trúc so sánh của οὕτως ... καὶ và danh từ παρουσία, nhưng không quyết định ngoài văn bản chính xác phương diện nào của biến cố Nô-ê là trọng tâm.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Dùng “ập đến” để diễn tả tính bất ngờ của biến cố, còn “cuốn tất cả đi” phù hợp trực tiếp với hình ảnh nước lụt. Không cần chú thích vì không có biến thể văn bản hay điểm tối nghĩa nào buộc phải giải thích trong bản văn chính.
