  naturalness: Văn phong nhìn chung tự nhiên, trang trọng. “Nước lụt” là cách gọi gọn, hiện đại và rõ nghĩa trong câu này; thêm “họ” sau “tất cả” giúp câu tiếng Việt minh bạch hơn.
  terminology: Giữ “Con Người” cho ὁ υἱὸς τοῦ ἀνθρώπου. “Sự hiện đến” có thể dùng để dịch παρουσία và không cần thay đổi ở câu này.
