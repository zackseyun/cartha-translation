  - severity: low
    issue: Cụm “từ đầu trời này đến đầu trời kia” làm mờ số nhiều của οὐρανῶν.
    rationale: Nguyên văn nói về “các tầng trời”; cách diễn đạt sửa lại vẫn là một thành ngữ chỉ toàn bộ không gian nhưng biểu thị số nhiều rõ hơn.
