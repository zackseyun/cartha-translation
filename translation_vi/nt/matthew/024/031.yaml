  to: Ngài sẽ sai các thiên sứ của Ngài đi cùng với tiếng kèn vang dội[a], và họ sẽ tập hợp những người được Ngài chọn[b] từ bốn phương gió[c], từ đầu này đến đầu kia của các tầng trời[d].
