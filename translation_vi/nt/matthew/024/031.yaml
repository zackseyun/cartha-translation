  terminology: “Thiên sứ” phù hợp bối cảnh cánh chung; “những người được Ngài chọn” chuyển đạt ἐκλεκτούς mà không áp đặt cách hiểu hệ thống thần học. “Bốn phương gió” giữ hình ảnh thành ngữ của nguyên văn và được chú thích thích đáng.
  issues:
