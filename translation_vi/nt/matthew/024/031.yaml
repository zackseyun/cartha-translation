id: MAT.24.31
reference: Matthew 24:31
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἀποστελεῖ τοὺς ἀγγέλους αὐτοῦ μετὰ ⸀σάλπιγγος μεγάλης, καὶ ἐπισυνάξουσιν τοὺς ἐκλεκτοὺς αὐτοῦ ἐκ τῶν τεσσάρων ἀνέμων ἀπ’ ἄκρων οὐρανῶν ἕως ⸀τῶν ἄκρων αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/031.yaml
  text: And he will send out his angels with a loud trumpet[a], and they will gather his chosen ones from the four winds[d][c][b], from one end of the heavens to the other.
translation:
  language: vi
  text: Ngài sẽ sai các thiên sứ của Ngài đi cùng với tiếng kèn vang dội[a], và họ sẽ tập hợp những người được Ngài chọn[b] từ bốn phương gió[c], từ đầu này đến đầu kia của các tầng trời[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “cùng với chiếc kèn lớn” hoặc “cùng với tiếng kèn thổi vang.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “những người được tuyển chọn của Ngài.”'
    reason: lexical_alternative
  - marker: c
    text: “Bốn phương gió” là cách nói chỉ mọi hướng, đến tận những nơi xa nhất.
    reason: cultural_note
  - marker: d
    text: 'Nguyên văn Hy Lạp: “từ các đầu mút của các tầng trời cho đến các đầu mút của chúng,” nghĩa là từ cực này đến cực kia.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποστελεῖ
  choice: sẽ sai ... đi
  rationale: Thì tương lai của ἀποστέλλω mang nghĩa sai phái; “sai ... đi” tự nhiên trong tiếng Việt và giữ được sắc thái phái đi làm nhiệm vụ.
- source_word: ἀγγέλους
  choice: các thiên sứ
  rationale: Trong bối cảnh cánh chung này, từ này chỉ các hữu thể thiên giới chứ không phải sứ giả loài người.
- source_word: μετὰ σάλπιγγος μεγάλης
  choice: cùng với tiếng kèn vang lớn
  rationale: μετά với sở hữu cách diễn tả sự đi kèm. Cách dịch này thể hiện âm thanh của kèn một cách tự nhiên, đồng thời ghi chú các khả năng dịch sát danh từ và tính từ.
- source_word: ἐπισυνάξουσιν
  choice: họ sẽ tập hợp
  rationale: Chủ ngữ số nhiều là các thiên sứ; “tập hợp” truyền đạt hành động quy tụ về một nơi.
- source_word: ἐκλεκτούς
  choice: những người được Ngài chọn
  rationale: Diễn đạt rõ nghĩa của ἐκλεκτοί bằng tiếng Việt hiện đại mà không áp đặt một hệ thống thần học về sự tuyển chọn.
- source_word: ἐκ τῶν τεσσάρων ἀνέμων
  choice: từ bốn phương gió
  rationale: Giữ hình ảnh Kinh Thánh về bốn luồng gió, đồng thời ghi chú rằng đây là thành ngữ chỉ mọi hướng.
- source_word: ἀπ’ ἄκρων οὐρανῶν ἕως τῶν ἄκρων αὐτῶν
  choice: từ đầu trời này đến đầu trời kia
  rationale: Cách nói tự nhiên trong tiếng Việt, giữ hình ảnh về toàn bộ khoảng rộng của các tầng trời và ý nghĩa từ cực này đến cực kia.
theological_decisions:
- issue: Cách dịch ἐκλεκτούς trong bối cảnh cánh chung
  choice: những người được Ngài chọn
  alternative: những người được tuyển chọn; những người tuyển dân của Ngài
  rationale: Bản dịch nêu hành động lựa chọn được chính câu nói xác nhận nhưng không xác định cơ chế hay khuôn khổ tín lý mà câu không giải thích.
- issue: Phạm vi của hình ảnh quy tụ
  choice: từ bốn phương gió, từ đầu trời này đến đầu trời kia
  alternative: từ bốn phương; từ chân trời này đến chân trời kia
  rationale: Giữ phạm vi rộng lớn và hình ảnh vũ trụ của nguyên văn, thay vì thu hẹp thành một lời diễn giải địa lý.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “Ngài” phù hợp với quy chiếu về Con Người trong ngữ cảnh. Hình ảnh “bốn phương gió” và “đầu trời” được giữ lại, còn chú thích giải thích thành ngữ và các khả năng từ vựng.
