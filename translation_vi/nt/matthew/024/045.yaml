    rationale: Nguyên văn chú thích có thể được đọc là đối lập “nô lệ” với “đầy tớ hoàn toàn ở dưới quyền chủ.” Viết lại cần giữ rõ rằng δοῦλος có thể được dịch “nô lệ” hoặc “đầy tớ,” và trong bối cảnh này chỉ người dưới quyền chủ.
