id: MAT.24.45
reference: Matthew 24:45
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Τίς ἄρα ἐστὶν ὁ πιστὸς δοῦλος καὶ φρόνιμος ὃν κατέστησεν ὁ ⸀κύριος ἐπὶ τῆς ⸀οἰκετείας αὐτοῦ τοῦ ⸀δοῦναι αὐτοῖς τὴν τροφὴν ἐν καιρῷ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/045.yaml
  text: Who then is the faithful and wise servant[b][a], whom the master has appointed over his household to give them their food at the proper time?
translation:
  language: vi
  text: Vậy ai là người đầy tớ[a] trung tín và khôn ngoan mà chủ[b] đã đặt coi sóc gia nhân mình, để cấp thức ăn cho họ đúng lúc?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “nô lệ.” Từ Hy Lạp có thể có nghĩa là “nô lệ” hoặc “đầy tớ”; ở đây chỉ người ở dưới quyền chủ.'
    reason: lexical_alternative
  - marker: b
    text: 'Hay: “Chúa.” Trong hình ảnh gia đình ở đây, từ Hy Lạp được dịch là “chủ” để thể hiện quan hệ giữa chủ và đầy tớ.'
    reason: alternative_reading
lexical_decisions:
- source_word: Τίς ἄρα
  choice: Vậy ai
  rationale: Diễn đạt tự nhiên câu hỏi mang tính suy luận và tiếp nối từ lời dạy ngay trước đó.
- source_word: πιστὸς
  choice: trung tín
  rationale: Chỉ người đáng tin cậy, tận tâm thực hiện trách nhiệm được giao, đồng thời giữ được sắc thái đạo đức của từ Hy Lạp.
- source_word: δοῦλος
  choice: đầy tớ
  rationale: Trong hình ảnh quản trị gia đình, “đầy tớ” là cách nói tự nhiên, trang trọng trong tiếng Việt; sắc thái người hoàn toàn ở dưới quyền chủ được bảo lưu bằng chú thích với phương án “nô lệ”.
- source_word: φρόνιμος
  choice: khôn ngoan
  rationale: Thể hiện sự sáng suốt thực tiễn và biết hành động thích hợp, phù hợp với cách Ma-thi-ơ dùng từ này.
- source_word: κατέστησεν
  choice: đã đặt cai quản
  rationale: Truyền đạt cả hành động bổ nhiệm lẫn trách nhiệm quản lý được trao.
- source_word: κύριος
  choice: chủ
  rationale: Phù hợp với quan hệ chủ–đầy tớ trong hình ảnh gia đình, không biến từ này thành tước hiệu thần học ngay trên bề mặt dụ ngôn.
- source_word: οἰκετείας
  choice: gia nhân
  rationale: Từ này chỉ tập thể những người thuộc gia đình, đặc biệt là các tôi tớ trong nhà; “gia nhân” cũng giải thích tự nhiên đại từ số nhiều “họ” ở vế sau.
- source_word: τοῦ δοῦναι
  choice: để cấp
  rationale: 'Diễn đạt rõ ý mục đích của động từ nguyên mẫu có mạo từ: người ấy được đặt cai quản nhằm cung cấp thức ăn.'
- source_word: τροφὴν
  choice: thức ăn
  rationale: Là cách tương đương trực tiếp, tự nhiên, không diễn giải quá mức thành khẩu phần cố định.
- source_word: ἐν καιρῷ
  choice: đúng lúc
  rationale: Giữ ý về thời điểm thích hợp, chứ không chỉ một mốc thời gian đơn thuần.
theological_decisions:
- issue: Cách dịch κύριος trong bối cảnh hình ảnh chủ nhà
  choice: chủ
  alternative: Chúa
  rationale: Bối cảnh trực tiếp mô tả một chủ nhà giao trách nhiệm cho đầy tớ, nên “chủ” giữ đúng hình ảnh xã hội của dụ ngôn. Tuy nhiên, vì “Chúa” có thể thể hiện ý nghĩa rộng hơn trong toàn bài giảng, phương án ấy được ghi ở chú thích.
- issue: Mức độ lệ thuộc được hàm ý bởi δοῦλος
  choice: đầy tớ
  alternative: nô lệ
  rationale: “Đầy tớ” dễ hiểu và phù hợp văn phong dụ ngôn trong tiếng Việt hiện đại, còn “nô lệ” phản ánh mạnh hơn địa vị hoàn toàn dưới quyền chủ của danh từ Hy Lạp; chú thích bảo lưu sự căng thẳng từ vựng này.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Cấu trúc câu hỏi được giữ gọn; “gia nhân” làm rõ đối tượng số nhiều nhận thức ăn, còn các chú thích bảo lưu những phương án có ý nghĩa về địa vị xã hội và sắc thái thần học.
