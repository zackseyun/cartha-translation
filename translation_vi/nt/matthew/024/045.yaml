    rationale: Tiếng Việt thường nói “đặt ... coi sóc/quản lý” khi nói bổ nhiệm một người trên những người khác. Sửa nhẹ giúp câu trôi chảy mà không thêm hay bớt nghĩa.
  - severity: medium
