id: MAT.24.26
reference: Matthew 24:26
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐὰν οὖν εἴπωσιν ὑμῖν· Ἰδοὺ ἐν τῇ ἐρήμῳ ἐστίν, μὴ ἐξέλθητε· Ἰδοὺ ἐν τοῖς ταμείοις, μὴ πιστεύσητε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/026.yaml
  text: Therefore[a], if they say to you, ‘Look, he is in the wilderness,’ do not go out; ‘Look[c][b], he is in the inner rooms,’ do not believe it.
translation:
  language: vi
  text: 'Vậy, nếu người ta nói với anh em: “Kìa, Ngài ở nơi hoang vắng[a],” thì đừng đi ra; “Kìa, Ngài ở trong các phòng bên trong[b],” thì đừng tin.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “trong hoang mạc.”
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “trong các kho chứa” hoặc “trong các phòng kín.” Từ Hy Lạp có thể chỉ những căn phòng bên trong, phòng riêng hoặc kho chứa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν οὖν
  choice: Vậy, nếu
  rationale: “Vậy” giữ quan hệ suy luận với lời cảnh báo trước đó, còn “nếu” diễn đạt điều kiện.
- source_word: εἴπωσιν ὑμῖν
  choice: người ta nói với anh em
  rationale: Ngôi thứ ba số nhiều ở đây có nghĩa phiếm chỉ; “người ta” tự nhiên trong tiếng Việt và không xác định một nhóm cụ thể.
- source_word: Ἰδοὺ
  choice: Kìa
  rationale: Từ cảm thán này hướng sự chú ý đến một địa điểm được chỉ ra; “Kìa” ngắn gọn, trực tiếp và không cổ kính.
- source_word: ἐν τῇ ἐρήμῳ
  choice: ở nơi hoang vắng
  rationale: Cách dịch này bao quát vùng hoang vu hoặc hoang mạc mà không buộc người đọc hình dung riêng một sa mạc đầy cát.
- source_word: ἐστίν
  choice: Ngài ở
  rationale: Tiếng Hy Lạp lược chủ ngữ nhưng ngữ cảnh chỉ về Chúa Giê-su; tiếng Việt cần nêu đại từ để câu trích dẫn rõ và tự nhiên, nhưng không thêm danh hiệu không có trong mệnh đề.
- source_word: μὴ ἐξέλθητε
  choice: đừng đi ra
  rationale: Giữ nguyên sắc thái cấm đoán trực tiếp và ý chuyển động ra ngoài của động từ.
- source_word: ἐν τοῖς ταμείοις
  choice: ở trong các phòng phía trong
  rationale: Diễn đạt các gian phòng nằm sâu bên trong mà không mặc nhiên thêm ý bí mật; số nhiều của nguyên văn cũng được giữ lại.
- source_word: μὴ πιστεύσητε
  choice: đừng tin
  rationale: Trong tiếng Việt, tân ngữ là lời tuyên bố vừa được trích dẫn có thể được hiểu rõ mà không cần thêm “điều đó” hay “họ”.
theological_decisions:
- issue: Chủ thể được hiểu ngầm của ἐστίν
  choice: Dùng đại từ “Ngài” để chỉ nhân vật mà người ta tuyên bố đang hiện diện, không thêm tên hay danh hiệu.
  alternative: “Đấng ấy ở” hoặc thêm rõ “Đấng Christ ở”.
  rationale: Ngữ cảnh cho thấy lời đồn nói về Chúa Giê-su/Đấng Christ, nhưng mệnh đề Hy Lạp không lặp lại danh hiệu. Đại từ giữ câu tự nhiên mà không diễn giải quá mức.
- issue: Quan hệ giữa hai lời tuyên bố được trích dẫn
  choice: Giữ hai vế song song, ngăn bằng dấu chấm phẩy, không thêm liên từ “hoặc”.
  alternative: Thêm “hoặc” trước lời tuyên bố thứ hai.
  rationale: Nguyên văn lặp lại Ἰδοὺ nhưng không có liên từ phân cách; dấu chấm phẩy làm rõ cấu trúc song song mà không thêm quan hệ từ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh em” cho lời Chúa Giê-su nói với các môn đồ; dùng “Ngài” như đại từ tôn kính tối thiểu do chủ ngữ Hy Lạp được hiểu ngầm. Hai lời cảnh báo được giữ trong một câu để phản ánh cấu trúc song song của nguyên văn.
