  terminology: “Vậy,”, “người ta nói với anh em,” “Kìa,” “nơi hoang vắng,” và “đừng tin” đều phù hợp. Giữ “Ngài” nhất quán với lối xưng hô tôn kính phổ biến trong bản dịch Việt ngữ, đồng thời không thêm “Đấng Christ” hay “Chúa Giê-su” vào lời trích.
