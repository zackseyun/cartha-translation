revisions:
- from: 'Vậy, nếu người ta nói với anh em: “Kìa, Ngài ở nơi hoang vắng[a],” thì đừng đi ra; “Kìa, Ngài ở trong các phòng phía trong[b],” thì đừng tin.'
  to: 'Vậy, nếu người ta nói với anh em: “Kìa, Ngài ở nơi hoang vắng[a],” thì đừng đi ra; “Kìa, Ngài ở trong các phòng bên trong[b],” thì đừng tin.'
  rationale: Chỉ điều chỉnh “phòng phía trong” thành “phòng bên trong” để tăng độ tự nhiên của tiếng Việt hiện đại. Cấu trúc song song không có liên từ, chủ ngữ hàm ẩn được diễn đạt bằng “Ngài,” và các phương án từ vựng trong chú thích đều được giữ nguyên về nghĩa.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T05:43:24Z'
