  text: Καὶ ἐξελθὼν ὁ Ἰησοῦς ⸂ἀπὸ τοῦ ἱεροῦ ἐπορεύετο⸃, καὶ προσῆλθον οἱ μαθηταὶ αὐτοῦ ἐπιδεῖξαι αὐτῷ τὰς οἰκοδομὰς τοῦ ἱεροῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/001.yaml
  text: And Jesus went out from the temple and was going away[a], and his disciples came to show him the buildings of the temple.
translation:
  language: vi
  text: Đức Giê-su ra khỏi Đền Thờ và đang rời đi thì các môn đồ đến chỉ cho Ngài xem các công trình của Đền Thờ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Trong tiếng Hy Lạp, từ được dịch là “Đền Thờ” chỉ toàn bộ quần thể Đền Thờ, không riêng nơi thánh bên trong.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθὼν
  choice: ra khỏi
  rationale: 'Phân từ bất định diễn tả hành động xảy ra trước động từ chính: Đức Giê-su ra khỏi nơi ấy rồi tiếp tục đi. Cách dịch này giữ rõ hướng chuyển động.'
- source_word: ἱεροῦ
  choice: khuôn viên Đền Thờ
  rationale: ἱερόν chỉ toàn bộ khu vực hay quần thể Đền Thờ, không riêng nơi thánh bên trong; cách dịch này làm rõ phạm vi ngay trong câu.
- source_word: ἐπορεύετο
  choice: đang đi khỏi đó
  rationale: Thì chưa hoàn thành diễn tả chuyển động đang tiếp diễn; “đang đi khỏi đó” giữ được thể chưa hoàn thành và tránh gộp với hành động ra khỏi khuôn viên.
- source_word: προσῆλθον
  choice: đến
  rationale: Động từ chỉ việc các môn đồ tiến đến gần Đức Giê-su; “đến” tự nhiên trong tiếng Việt và kết hợp thuận với động từ mục đích theo sau.
- source_word: ἐπιδεῖξαι
  choice: chỉ cho Ngài xem
  rationale: Động từ nguyên mẫu diễn tả mục đích. “Chỉ cho… xem” tự nhiên và chính xác hơn lối dịch máy móc “cho thấy” trong ngữ cảnh các môn đồ hướng sự chú ý của Đức Giê-su đến các công trình.
- source_word: οἰκοδομὰς
  choice: các công trình
  rationale: Danh từ số nhiều chỉ những kiến trúc được xây dựng. “Các công trình” bao quát các tòa nhà và cấu trúc thuộc quần thể Đền Thờ.
- source_word: τοῦ ἱεροῦ
  choice: trong khuôn viên Đền Thờ
  rationale: Sở hữu cách xác định các công trình thuộc quần thể Đền Thờ. Trong tiếng Việt, “trong khuôn viên” diễn đạt tự nhiên mối liên hệ không gian này.
theological_decisions:
- issue: Phạm vi nghĩa của ἱερόν so với ναός
  choice: khuôn viên Đền Thờ
  alternative: Đền Thờ
  rationale: ἱερόν ở đây chỉ quần thể hay khu vực Đền Thờ rộng hơn, chứ không riêng nơi thánh bên trong vốn thường được gọi là ναός. Nêu rõ “khuôn viên” bảo toàn sự phân biệt từ vựng mà không thêm một lập trường thần học.
translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng hiện đại. Dùng “Đức Giê-su”, “Ngài” và “các môn đồ”; giữ diễn tiến của hai hành động “ra khỏi” rồi “đang đi khỏi đó”. Dấu chú thích [a] được đặt sau câu có thuật ngữ cần giải thích.
