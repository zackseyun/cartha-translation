- from: Đức Giê-su ra khỏi khuôn viên Đền Thờ và đang đi khỏi đó thì các môn đồ đến chỉ cho Ngài xem các công trình trong khuôn viên Đền Thờ.[a]
  to: Đức Giê-su ra khỏi Đền Thờ và đang rời đi thì các môn đồ đến chỉ cho Ngài xem các công trình của Đền Thờ.[a]
  rationale: Bản sửa giữ trọn trình tự hành động, thể chưa hoàn thành của ἐπορεύετο và mục đích của ἐπιδεῖξαι. Dùng “Đền Thờ” trong thân văn giúp câu tự nhiên và phù hợp thuật ngữ thông dụng, còn chú thích giữ sự phân biệt quan trọng rằng ἱερόν chỉ toàn bộ quần thể. “của Đền Thờ” phản ánh chính xác hơn sở hữu cách τοῦ ἱεροῦ.
