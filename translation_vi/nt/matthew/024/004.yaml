  text: And Jesus answered them[a], “See that no one leads you astray.”
translation:
  language: vi
  text: 'Đức Giê-su đáp lời họ: “Hãy coi chừng, đừng để bất cứ ai dẫn anh em đi lạc.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “lừa dối anh em.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς ... εἶπεν αὐτοῖς
  choice: Đức Giê-su đáp
  rationale: Gộp thành ngữ Hy Lạp chịu ảnh hưởng Semit thành một động từ tự nhiên trong tiếng Việt, vừa giữ ý hồi đáp vừa tránh lối dịch cứng ‘đáp lời và nói với họ’.
- source_word: Βλέπετε μή τις
  choice: Hãy coi chừng, đừng để bất cứ ai
  rationale: Βλέπετε ở đây là mệnh lệnh mang nghĩa cảnh giác; kết hợp với μή và động từ giả định để diễn đạt sự ngăn ngừa. Cách dịch này tự nhiên trong tiếng Việt hiện đại và giữ trực tiếp trách nhiệm cảnh giác của người nghe.
- source_word: ὑμᾶς
  choice: anh em
  rationale: Đại từ số nhiều chỉ các môn đồ được Đức Giê-su trực tiếp nói với; ‘anh em’ là cách xưng hô trang trọng, dễ hiểu và cho thấy rõ số nhiều.
- source_word: πλανήσῃ
  choice: dẫn anh em đi lạc
  rationale: Giữ cả hình ảnh bị đưa lệch khỏi đường đúng lẫn ý bị lừa dối hoặc làm cho sai lạc, không thu hẹp động từ vào sự đánh lừa về nhận thức.
theological_decisions:
- issue: Phạm vi lời cảnh báo trong πλανήσῃ
  choice: Cảnh báo rộng về việc bị dẫn đi lạc
  alternative: ‘lừa dối anh em’, nhấn mạnh sự đánh lừa
  rationale: Trong ngữ cảnh các lời tuyên bố sai lạc, động từ có thể bao hàm cả bị lừa và bị dẫn lệch hướng. ‘Dẫn ... đi lạc’ bảo toàn độ rộng và sức căng thần học ấy.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng phổ thông. Dùng ‘Đức Giê-su’ theo văn phong Kinh Thánh Công giáo quen thuộc; câu mệnh lệnh rõ và tự nhiên. Dấu chú thích [a] được đặt ngay sau cụm từ mà chú thích giải thích.
