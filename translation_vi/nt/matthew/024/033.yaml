  terminology: “Anh em” phù hợp với lời nói hướng đến các môn đồ. Chú thích giữ đúng sự mơ hồ của chủ ngữ hàm ẩn; “Ngài” chỉ được nêu như một khả năng dịch, không được áp đặt trong bản văn chính.
