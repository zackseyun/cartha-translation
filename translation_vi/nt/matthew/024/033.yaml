    rationale: Cụm Hy Lạp nghĩa là “ở gần/gần kề”, không khẳng định hành động “đến gần” đã hoàn tất. Đổi thành “đang ở gần” bảo toàn rõ hơn trạng thái hiện tại mà vẫn tự nhiên trong tiếng Việt.
