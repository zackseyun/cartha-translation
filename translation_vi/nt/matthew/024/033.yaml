  source_fidelity: 'Bản dịch giữ đúng cấu trúc so sánh, mệnh đề thời gian, số nhiều của “tất cả những điều ấy”, và sắc thái mệnh lệnh của γινώσκετε. Tuy nhiên, “đã đến gần” dễ gợi một chuyển động đã xảy ra hoặc một sự kiện đã tới gần, trong khi ἐγγύς ἐστιν diễn tả trạng thái hiện tại: “đang ở gần”.'
