source:
  edition: SBLGNT
  text: οὕτως καὶ ὑμεῖς, ὅταν ἴδητε ⸂πάντα ταῦτα⸃, γινώσκετε ὅτι ἐγγύς ἐστιν ἐπὶ θύραις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/033.yaml
  text: So also you[a], when you see all these things, know that it is near, at the doors.
translation:
  language: vi
  text: Cũng vậy, khi anh em thấy tất cả những điều ấy, hãy biết rằng điều ấy[a] đang ở gần, ngay trước cửa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Ngài đang ở gần.” Tiếng Hy Lạp không nêu rõ chủ ngữ.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὕτως καὶ ὑμεῖς
  choice: Cũng vậy
  rationale: Diễn đạt tự nhiên mối so sánh với hình ảnh cây vả ngay trước đó; đại từ số nhiều được thể hiện trong “anh em” ở mệnh đề kế tiếp.
- source_word: ὅταν ἴδητε
  choice: khi anh em thấy
  rationale: ὅταν với động từ giả định aorist hướng đến một tình huống tương lai, nên “khi” phù hợp hơn cách diễn đạt mang tính lặp lại như “bất cứ khi nào”.
- source_word: πάντα ταῦτα
  choice: tất cả những điều ấy
  rationale: Giữ rõ sắc thái số nhiều của cụm trung tính Hy Lạp mà không thêm cách giải thích như “những biến cố”.
- source_word: γινώσκετε
  choice: hãy biết
  rationale: Giữ lực mệnh lệnh của hình thái hiện tại mệnh lệnh số nhiều; “hãy nhận biết” cũng có thể dùng nhưng diễn giải hơn.
- source_word: ἐγγύς
  choice: đã đến gần
  rationale: Trong tiếng Việt, “đã đến gần” tự nhiên trong ngữ cảnh dấu hiệu cho biết một thực tại sắp xảy đến, đồng thời truyền đạt ý nghĩa “ở gần” của ἐγγύς.
- source_word: ἐπὶ θύραις
  choice: ngay trước cửa
  rationale: Diễn đạt thành ngữ chỉ sự cận kề bằng tiếng Việt tự nhiên. Dù θύραις ở số nhiều, tiếng Việt thường dùng “trước cửa” theo nghĩa thành ngữ và không bắt buộc đánh dấu số.
- source_word: ἐγγύς ἐστιν
  choice: điều đó đã đến gần
  rationale: Tiếng Hy Lạp không nêu chủ ngữ. “Điều đó” cho phép câu tiếng Việt hoàn chỉnh mà không quyết định chủ thể là một người; chú thích bảo tồn khả năng hiểu là “Ngài”.
theological_decisions:
- issue: Chủ ngữ hàm ẩn của ἐγγύς ἐστιν
  choice: Dịch là “điều đó đã đến gần” và đặt chú thích tại “điều đó”
  alternative: “Ngài đã đến gần”
  rationale: Bản Hy Lạp không nêu chủ ngữ, nên có thể quy chiếu đến sự việc/thời điểm sắp đến hoặc đến một nhân vật, thường được hiểu là Con Người. Bản dịch chính không âm thầm giải quyết sự mơ hồ thần học này.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Anh em” phù hợp lời Chúa Giê-su nói với các môn đồ; “ngay trước cửa” truyền đạt sinh động thành ngữ về sự cận kề.
