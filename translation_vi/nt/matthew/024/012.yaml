- from: Và vì sự vô luật pháp sẽ gia tăng[a], tình yêu thương của nhiều người sẽ nguội lạnh.[b]
  to: Và vì sự vô luật pháp sẽ gia tăng[a], tình yêu thương của nhiều người[b] sẽ nguội lạnh.
  rationale: Đã giữ nguyên câu dịch vì câu này trung thành với nguyên văn và tự nhiên trong văn phong Kinh Thánh hiện đại. Chú thích b được sửa để không biến “nhiều người” thành “đa số”, đồng thời ký hiệu b được chuyển đến đúng cụm từ được chú thích. Cách diễn đạt thay thế trong chú thích chỉ nhằm phản ánh mạo từ xác định của tiếng Hy Lạp mà không xác định nhóm người hay tỷ lệ của họ.
