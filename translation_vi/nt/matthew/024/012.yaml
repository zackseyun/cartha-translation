  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ διὰ τὸ πληθυνθῆναι τὴν ἀνομίαν ψυγήσεται ἡ ἀγάπη τῶν πολλῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/012.yaml
  text: And because lawlessness will be multiplied[b][a], the love of many will grow cold.
translation:
  language: vi
  text: Và vì sự vô luật pháp sẽ gia tăng[a], tình yêu thương của nhiều người[b] sẽ nguội lạnh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “vì sự vô luật pháp gia tăng” hoặc “vì tình trạng vô luật pháp ngày càng lan rộng”.'
    reason: lexical_alternative
  - marker: b
    text: 'Hoặc dịch sát mạo từ: “tình yêu thương của những người nhiều ấy sẽ nguội lạnh”; cụm từ này không xác định rõ nhóm người nào.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τὸ πληθυνθῆναι
  choice: vì ... sẽ gia tăng
  rationale: διά với động từ nguyên mẫu có mạo từ diễn tả nguyên nhân. Cách dịch này giữ được tính chất động từ và hướng tương lai theo ngữ cảnh; tiếng Việt tự nhiên hơn lối bị động sát chữ “sẽ được làm cho gia tăng”.
- source_word: ἀνομίαν
  choice: sự vô luật pháp
  rationale: ἀνομία chỉ tình trạng coi thường hoặc vi phạm luật, đặc biệt là luật của Đức Chúa Trời. “Sự vô luật pháp” trực tiếp và chính xác hơn “sự gian ác”, dù hơi mang sắc thái trang trọng.
- source_word: ψυγήσεται
  choice: sẽ nguội lạnh
  rationale: Dạng tương lai ở đây dùng hình ảnh cái lạnh để nói về tình yêu suy giảm. “Sẽ nguội lạnh” tự nhiên trong tiếng Việt và giữ nguyên ẩn dụ.
- source_word: ἀγάπη
  choice: tình yêu thương
  rationale: “Tình yêu thương” là cách diễn đạt rõ ràng, trang trọng và quen thuộc cho ἀγάπη trong ngữ cảnh quan hệ giữa người với người.
- source_word: τῶν πολλῶν
  choice: của nhiều người
  rationale: Cách dịch này giữ phạm vi rộng nhưng không xác định của cụm Hy Lạp, không biến nó thành khẳng định mang tính thống kê như “của đa số”.
theological_decisions:
- issue: Phạm vi của “tình yêu thương của nhiều người”
  choice: Không xác định đây là toàn thể nhân loại, những người xưng mình là môn đồ, hay một nhóm hỗn hợp.
  alternative: “Tình yêu thương giữa các tín hữu sẽ nguội lạnh” hoặc “tình người trong xã hội sẽ nguội lạnh”.
  rationale: τῶν πολλῶν không nêu rõ nhóm người nào. Giữ “của nhiều người” bảo toàn sự mơ hồ và căng thẳng thần học của nguyên văn.
- issue: Tác nhân hoặc cơ chế khiến sự vô luật pháp gia tăng
  choice: 'Dịch chủ động vô tác nhân: “sự vô luật pháp sẽ gia tăng”.'
  alternative: “Sự vô luật pháp sẽ được làm cho gia tăng”.
  rationale: Nguyên văn dùng nguyên mẫu thụ động nhưng không nêu tác nhân. Tiếng Việt thường dùng cấu trúc nội động tự nhiên trong trường hợp này; bản dịch không gán sự gia tăng cho Đức Chúa Trời, con người hay một tác nhân cụ thể.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ liên từ “Và” để phản ánh καί và mối nối với văn cảnh. “Sự vô luật pháp” được chọn vì độ chính xác, còn “nguội lạnh” giữ hình ảnh giàu sức gợi của nguyên văn. Mọi dấu chú thích [a], [b] đều xuất hiện trong câu chính.
