  source_fidelity: Câu chính truyền đạt đúng quan hệ nguyên nhân của διὰ τὸ πληθυνθῆναι, ý nghĩa của ἀνομία, hình ảnh ψυγήσεται, và để ngỏ phạm vi của τῶν πολλῶν. Tuy nhiên, chú thích b dùng “số đông”, dễ bị hiểu là đa số, trong khi τῶν πολλῶν không khẳng định tỷ lệ đa số. Vị trí ký hiệu b cũng nên đặt ngay sau cụm mà chú thích giải thích.
  naturalness: “Và vì sự vô luật pháp sẽ gia tăng” và “tình yêu thương của nhiều người sẽ nguội lạnh” là tiếng Việt hiện đại, trang trọng và dễ hiểu trong văn mạch Kinh Thánh. Có thể giữ cách dùng “sự vô luật pháp” để phản ánh chính xác sắc thái ‘lawlessness’.
  terminology: “Sự vô luật pháp” phản ánh ἀνομία chính xác hơn các từ rộng hơn như “gian ác”; “tình yêu thương” phù hợp với ἀγάπη; “nguội lạnh” giữ được ẩn dụ của ψυγήσεται. “Nhiều người” bảo toàn tính không xác định của τῶν πολλῶν.
  issues:
