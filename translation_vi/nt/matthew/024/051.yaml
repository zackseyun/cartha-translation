review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch giữ đúng cấu trúc phán xét và các thuật ngữ chính: διχοτομήσει được dịch cụ thể, μέρος được giữ là “phần”, ὑποκριταί là “những kẻ đạo đức giả”, và công thức “than khóc và nghiến răng” được bảo toàn. Tuy nhiên, “ở cùng” dễ nghiêng về vị trí không gian, trong khi μετὰ ở đây gắn với phần số được ấn định; nên diễn đạt “cùng với”. “Chém” có thể gợi riêng hành động bằng vũ khí, còn “chặt ... làm đôi” trung tính hơn và sát nghĩa “cắt/chia làm hai” của động từ Hy Lạp.'
  naturalness: “Định phần của người ấy ở cùng” hơi gượng trong tiếng Việt hiện đại. “Ấn định phần của người ấy cùng với những kẻ đạo đức giả” tự nhiên hơn, đồng thời vẫn giữ sắc thái trang trọng. Việc đặt các ký hiệu chú thích sát từ ngữ được chú thích giúp mỏ neo rõ ràng hơn.
  terminology: “Những kẻ đạo đức giả,” “phần,” “than khóc,” và “nghiến răng” đều phù hợp ngữ cảnh Ma-thi-ơ và văn phong Kinh Thánh hiện đại. Không nên đổi “phần” thành chỉ “chỗ” hay “nơi,” vì nguyên văn vẫn để mở ý phần số/lô phần được ấn định.
  issues:
  - severity: medium
    issue: Cụm “định phần của người ấy ở cùng những kẻ đạo đức giả” khiến quan hệ “ở cùng” mang sắc thái vị trí hơn là sự phân phần.
    rationale: τὸ μέρος αὐτοῦ μετὰ τῶν ὑποκριτῶν θήσει nói về việc ấn định phần/lot của người ấy cùng với những kẻ đạo đức giả. “Cùng với” giữ quan hệ này sát hơn mà không giải thích quá mức.
  - severity: low
    issue: “Chém người ấy làm đôi” có thể hàm ý một loại vũ khí hoặc cách hành quyết cụ thể.
    rationale: διχοτομέω có nghĩa cơ bản là cắt/chia làm hai; “chặt ... làm đôi” chuyển tải hình ảnh cụ thể mà không thêm phương tiện thực hiện.
  - severity: low
    issue: Các ký hiệu chú thích hiện cùng đứng cuối cả mệnh đề thay vì gắn rõ với từng từ/cụm từ được chú thích.
    rationale: Đặt [a] sau động từ và [b] sau “phần” làm rõ phạm vi của từng chú thích.
