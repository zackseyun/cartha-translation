id: MAT.24.51
reference: Matthew 24:51
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ διχοτομήσει αὐτὸν καὶ τὸ μέρος αὐτοῦ μετὰ τῶν ὑποκριτῶν θήσει· ἐκεῖ ἔσται ὁ κλαυθμὸς καὶ ὁ βρυγμὸς τῶν ὀδόντων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/051.yaml
  text: and will cut him in two and assign his place with the hypocrites[b][a]. There will be weeping and gnashing of teeth there.
translation:
  language: vi
  text: và sẽ chặt người ấy làm đôi[a], rồi ấn định phần của người ấy[b] cùng với những kẻ đạo đức giả. Tại đó sẽ có sự than khóc và nghiến răng.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Động từ Hy Lạp có nghĩa đen là “chặt/cắt làm đôi”; cũng có thể được hiểu theo nghĩa rộng là “trừng phạt nghiêm khắc”.
    reason: lexical_alternative
  - marker: b
    text: Nguyên văn là “phần của người ấy cùng với những kẻ đạo đức giả”; cách nói này chỉ phần số được ấn định cho người ấy cùng với họ.
    reason: lexical_alternative
lexical_decisions:
- source_word: διχοτομήσει
  choice: sẽ chém người ấy làm đôi
  rationale: Giữ nghĩa cụ thể và dữ dội của động từ Hy Lạp là chém/cắt làm đôi, thay vì làm nhẹ thành một cách diễn đạt khái quát về sự trừng phạt.
- source_word: τὸ μέρος αὐτοῦ ... θήσει
  choice: định phần của người ấy ở cùng
  rationale: “Phần” phản ánh μέρος và giữ được ý về phần số được ấn định, không thu hẹp nghĩa thành một địa điểm đơn thuần.
- source_word: ὑποκριτῶν
  choice: những kẻ đạo đức giả
  rationale: Cách dịch quen thuộc, tự nhiên trong tiếng Việt và duy trì sắc thái phê phán đặc trưng trong Ma-thi-ơ.
- source_word: ἐκεῖ
  choice: Tại đó
  rationale: Chỉ trở lại cảnh ngộ/phần số vừa nêu mà không giải thích quá mức.
- source_word: κλαυθμὸς
  choice: sự than khóc
  rationale: Diễn đạt tự nhiên công thức phán xét lặp lại trong Ma-thi-ơ và giữ sắc thái đau buồn rõ rệt.
- source_word: βρυγμὸς τῶν ὀδόντων
  choice: nghiến răng
  rationale: Thành ngữ tiếng Việt trực tiếp, sinh động, tương ứng với hình ảnh Hy Lạp và nhất quán với công thức quen thuộc.
theological_decisions:
- issue: Có nên làm nhẹ διχοτομήσει thành một công thức chỉ sự trừng phạt nghiêm khắc hay không
  choice: Giữ hình ảnh cụ thể “sẽ chém người ấy làm đôi” trong chính văn
  alternative: “sẽ trừng phạt người ấy nghiêm khắc”
  rationale: Nghĩa từ vựng trực tiếp là chém/cắt làm đôi; giữ hình ảnh này bảo toàn sức nặng của lời cảnh cáo mà không áp đặt cách giải thích riêng về bản chất hình phạt.
- issue: Cách diễn đạt τὸ μέρος αὐτοῦ μετὰ τῶν ὑποκριτῶν θήσει
  choice: “định phần của người ấy ở cùng những kẻ đạo đức giả”
  alternative: “xếp người ấy vào chỗ của những kẻ đạo đức giả”
  rationale: “Phần” giữ được tính mơ hồ có thật giữa phần số, phần được nhận và vị trí được ấn định; cách dịch không quy giản câu thành địa điểm בלבד.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Người ấy” phù hợp với đại từ chỉ người trong ngữ cảnh; “định phần” hơi trang trọng nhưng giữ được ý phân định phần số trong nguyên văn. Các dấu chú thích [a], [b] được đặt ngay sau mệnh đề tương ứng.
