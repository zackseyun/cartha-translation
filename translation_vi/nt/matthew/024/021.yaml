  source_fidelity: Bản dịch truyền đạt đầy đủ γὰρ τότε ("Vì lúc ấy"), cấu trúc hiện hữu tương lai của ἔσται ("sẽ có"), θλῖψις μεγάλη ("hoạn nạn lớn"), tính chất chưa từng có của οἵα οὐ γέγονεν, khung thời gian "từ thuở thế gian bắt đầu cho đến nay", và phủ định tương lai nhấn mạnh οὐ μὴ γένηται ("sẽ không bao giờ xảy ra nữa"). Từ "nữa" diễn đạt phù hợp ý không tái diễn trong phép so sánh của câu.
  naturalness: Câu văn tự nhiên, trang trọng vừa phải và phù hợp tiếng Việt hiện đại. "Hoạn nạn lớn" là cách kết hợp quen thuộc trong văn mạch Kinh Thánh mà không trở nên cổ hoặc khó hiểu. Cụm "từ thuở thế gian bắt đầu" hơi trang trọng nhưng vẫn rõ nghĩa và phù hợp đăng ký của bản dịch.
  terminology: '"Hoạn nạn" là lựa chọn bao quát và thích hợp cho θλῖψις, giữ được sức nặng của ngữ cảnh mà không áp đặt một cách giải thích cánh chung cụ thể. Chú thích nêu các khả năng thay thế hợp lý—"cơn khốn khổ lớn" và "cảnh áp bức lớn"—đồng thời giải thích phạm vi nghĩa của từ Hy Lạp. Dấu [a] được đặt đúng tại thuật ngữ cần chú thích.'
