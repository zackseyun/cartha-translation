id: MAT.24.21
reference: Matthew 24:21
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἔσται γὰρ τότε θλῖψις μεγάλη οἵα οὐ γέγονεν ἀπ’ ἀρχῆς κόσμου ἕως τοῦ νῦν οὐδ’ οὐ μὴ γένηται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/021.yaml
  text: For then there will be great tribulation[a], such as has not happened from the beginning of the world until now, and never will happen again.
translation:
  language: vi
  text: Vì lúc ấy sẽ có hoạn nạn lớn[a], chưa từng xảy ra từ thuở thế gian bắt đầu cho đến nay, và cũng sẽ không bao giờ xảy ra nữa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “cơn khốn khổ lớn” hoặc “cảnh áp bức lớn”. Từ Hy Lạp này có thể chỉ cảnh khốn khó nghiêm trọng, sức ép hoặc sự áp bức.
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ τότε
  choice: Vì lúc ấy
  rationale: “Vì” giữ chức năng giải thích của γάρ, còn “lúc ấy” diễn đạt tự nhiên ý thời gian của τότε.
- source_word: ἔσται
  choice: sẽ có
  rationale: Cách diễn đạt hiện hữu tự nhiên trong tiếng Việt, với “hoạn nạn lớn” làm điều sẽ xảy đến.
- source_word: θλῖψις μεγάλη
  choice: hoạn nạn lớn
  rationale: “Hoạn nạn” truyền đạt tình cảnh khốn khó, áp lực hoặc áp bức nghiêm trọng và vẫn giữ được sức nặng cánh chung của cụm từ; μεγάλη được dịch trực tiếp là “lớn”.
- source_word: οἵα οὐ γέγονεν
  choice: chưa từng xảy ra
  rationale: Diễn đạt tự nhiên ý so sánh về một biến cố có mức độ chưa từng có cho đến thời điểm được nói đến.
- source_word: ἀπ’ ἀρχῆς κόσμου
  choice: từ thuở thế gian bắt đầu
  rationale: Giữ κόσμος là “thế gian” và diễn đạt thành ngữ thời gian một cách trang trọng, dễ hiểu, không thêm rõ nghĩa thành “sáng tạo” vốn không được nói trực tiếp trong tiếng Hy Lạp.
- source_word: ἕως τοῦ νῦν
  choice: cho đến nay
  rationale: Cách diễn đạt thời gian ngắn gọn, tự nhiên và sát nghĩa.
- source_word: οὐδ’ οὐ μὴ γένηται
  choice: và cũng sẽ không bao giờ xảy ra nữa
  rationale: “Không bao giờ” thể hiện sự phủ định tương lai mạnh của οὐ μή; “xảy ra nữa” nối tự nhiên với γέγονεν ở mệnh đề trước và bảo toàn phép so sánh.
theological_decisions:
- issue: Cách dịch θλῖψις mang sắc thái cánh chung
  choice: hoạn nạn
  alternative: khốn khổ; cảnh áp bức
  rationale: “Hoạn nạn” vừa bao quát đau khổ, sức ép và sự áp bức, vừa giữ được sức nặng truyền thống của ngữ cảnh cánh chung mà không gắn câu này với một hệ thống giải thích giáo phái cụ thể.
- issue: Phạm vi của lời phủ định tương lai
  choice: cũng sẽ không bao giờ xảy ra nữa
  alternative: cũng sẽ chẳng bao giờ có
  rationale: Bản dịch giữ nguyên lời khẳng định tuyệt đối, mạnh mẽ của οὐ μή và không giải thích thêm thời điểm hay phạm vi thần học ngoài điều văn bản nói.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Cấu trúc câu giữ mối liên kết giải thích với câu trước và nhịp điệu mạnh của lời cảnh báo; dấu chú thích [a] được đặt ngay sau cụm từ liên quan.
