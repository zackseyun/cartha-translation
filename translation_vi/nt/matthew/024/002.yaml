revisions:
- from: 'Nhưng Ngài đáp lời họ: “Các con không thấy tất cả những điều này sao? Quả thật, Ta nói với các con: tại đây sẽ không còn một hòn đá nào nằm trên một hòn đá khác mà không bị phá đổ.[a]”'
  to: 'Nhưng Người đáp lời họ: “Anh em không thấy tất cả những điều này sao? Quả thật, tôi nói với anh em: ở đây sẽ không còn một hòn đá nào trên hòn đá khác mà không bị phá đổ.[a]”'
  rationale: Sửa đại từ xưng hô để không thêm quan hệ «con cái» vào nguyên văn và để văn phong hiện đại, nhất quán hơn. Giữ nguyên hình ảnh đá trên đá, phủ định nhấn mạnh, địa điểm «ở đây», và cách hiểu kiến trúc cụ thể của động từ καταλύω.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T05:42:49Z'
review_pass:
  verdict: revise
  source_fidelity: Bản nháp truyền đạt đúng câu hỏi tu từ, công thức long trọng «ἀμὴν λέγω ὑμῖν», địa điểm «ở đây», và lời báo trước về sự phá hủy hoàn toàn. Tuy nhiên, «các con» thêm một quan hệ xưng hô gia đình không có trong nguyên văn, vốn chỉ nói «họ/anh em» (αὐτοῖς/ὑμῖν).
  naturalness: Câu văn nhìn chung tự nhiên. Dùng nhất quán «Người/tôi/anh em» tránh sự chuyển đổi «Ngài/Ta/các con», đồng thời vẫn giữ sắc thái trang trọng, hiện đại.
  terminology: «Phá đổ» là lựa chọn phù hợp cho καταλυθήσεται trong ngữ cảnh công trình. Chú thích từ vựng diễn giải đúng các khả năng «phá hủy» và «tháo dỡ».
  issues:
  - severity: medium
    issue: «Các con» trong hai chỗ xưng hô
    rationale: Nguyên văn không gọi người nghe là «con»; cách gọi này diễn giải thêm quan hệ giữa người nói và người nghe. «Anh em» phản ánh số nhiều ngôi thứ hai mà không thêm sắc thái không được nêu trong câu.
  - severity: low
    issue: Hệ thống xưng hô «Ngài/Ta/các con» không nhất quán với lối hiện đại trung tính
    rationale: «Người/tôi/anh em» tự nhiên hơn trong tiếng Việt hiện đại và giữ khoảng cách tường thuật phù hợp mà không thay đổi nghĩa.
