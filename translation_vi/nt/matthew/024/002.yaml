source:
  edition: SBLGNT
  text: ὁ δὲ ⸀ἀποκριθεὶς εἶπεν αὐτοῖς· Οὐ βλέπετε ⸂ταῦτα πάντα⸃; ἀμὴν λέγω ὑμῖν, οὐ μὴ ἀφεθῇ ὧδε λίθος ἐπὶ λίθον ὃς οὐ καταλυθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/002.yaml
  text: But he answered and said to them[a], “Do you not see all these things? Truly I tell you, not one stone here will be left upon another that will not be thrown down.”
translation:
  language: vi
  text: 'Nhưng Người đáp lời họ: “Anh em không thấy tất cả những điều này sao? Quả thật, tôi nói với anh em: ở đây sẽ không còn một hòn đá nào trên hòn đá khác mà không bị phá đổ.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “bị phá hủy” hoặc “bị tháo dỡ.” Động từ Hy Lạp có thể chỉ việc tháo dỡ hay phá hủy một công trình; “phá đổ” giữ được hình ảnh các hòn đá bị đưa khỏi vị trí.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν αὐτοῖς
  choice: Ngài đáp lời họ
  rationale: Cụm phân từ cộng động từ hữu hạn là lối diễn đạt Hy Lạp chịu ảnh hưởng Semit. Tiếng Việt tự nhiên chỉ cần “đáp lời”; không nhất thiết lặp “đáp và nói”.
- source_word: Οὐ βλέπετε ταῦτα πάντα
  choice: Các con không thấy tất cả những điều này sao?
  rationale: Giữ câu hỏi tu từ mong đợi sự đồng tình; “thấy” phù hợp với cả việc nhìn thấy bằng mắt lẫn nhận biết điều đang ở trước mặt.
- source_word: ἀμὴν λέγω ὑμῖν
  choice: Quả thật, Ta nói với các con
  rationale: “Quả thật” truyền đạt sức nặng xác quyết của ἀμήν bằng tiếng Việt hiện đại, trang trọng; cách xưng hô phù hợp lời Đức Giê-su nói với các môn đồ.
- source_word: οὐ μὴ ἀφεθῇ ὧδε λίθος ἐπὶ λίθον
  choice: tại đây sẽ không còn một hòn đá nào nằm trên một hòn đá khác
  rationale: “Không... một... nào” thể hiện phủ định nhấn mạnh οὐ μή; “tại đây” giữ nghĩa chỉ nơi chốn của ὧδε, còn hình ảnh đá nằm trên đá được bảo toàn.
- source_word: καταλυθήσεται
  choice: bị phá đổ
  rationale: Trong ngữ cảnh công trình kiến trúc, động từ chỉ việc tháo dỡ hoặc phá hủy. “Phá đổ” vừa tự nhiên vừa giữ hình ảnh cụ thể các hòn đá bị đưa khỏi vị trí.
theological_decisions:
- issue: Phạm vi và sức nặng của lời tiên báo về đền thờ
  choice: Diễn đạt một lời tiên báo cụ thể về sự phá hủy toàn diện của công trình, không gắn thêm một hệ thống cánh chung riêng biệt.
  alternative: Hiểu chủ yếu theo nghĩa biểu tượng về sự phán xét, hoặc quy lời này vào một khuôn khổ cánh chung cụ thể.
  rationale: Ngôn ngữ về đá nằm trên đá và bị phá đổ mang tính kiến trúc cụ thể; bản dịch giữ nguyên sức nặng ấy nhưng không giải thích vượt quá câu văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngài/Ta/các con” để thể hiện rõ các vai giao tiếp; tránh lối dịch quá sát “đáp và nói”. Dấu chú thích [a] được đặt ngay sau từ ngữ cần giải thích.
