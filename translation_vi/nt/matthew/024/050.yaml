id: MAT.24.50
reference: Matthew 24:50
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἥξει ὁ κύριος τοῦ δούλου ἐκείνου ἐν ἡμέρᾳ ᾗ οὐ προσδοκᾷ καὶ ἐν ὥρᾳ ᾗ οὐ γινώσκει,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/050.yaml
  text: the master of that servant will come on a day he does not expect and at an hour he does not know[b][a],
translation:
  language: vi
  text: chủ[a] của người nô lệ[b] ấy sẽ đến vào một ngày người ấy không ngờ và vào một giờ người ấy không biết,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “chúa”; từ Hy Lạp kyrios có thể có nghĩa là “chúa” hoặc “chủ”. Ở đây từ này chỉ người chủ trong dụ ngôn.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “đầy tớ”. Từ Hy Lạp doulos chỉ một người ở trong quan hệ phục dịch bị ràng buộc; “người nô lệ” làm rõ địa vị ấy trong bối cảnh này.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἥξει
  choice: sẽ đến
  rationale: Động từ ἥκω ở thì tương lai nói đến việc đến hoặc xuất hiện. “Sẽ đến” tự nhiên, sát nghĩa và không thêm ý “trở về” vốn chỉ được suy ra từ bối cảnh.
- source_word: κύριος
  choice: chủ
  rationale: Trong thế giới của dụ ngôn, từ này chỉ người có quyền trên người nô lệ. “Chủ” diễn đạt đúng quan hệ xã hội ở đây mà không biến từ này thành một tước hiệu thần học trực tiếp.
- source_word: δούλου
  choice: người nô lệ
  rationale: δοῦλος chỉ người ở trong thân phận phục dịch lệ thuộc. Trong bối cảnh quan hệ chủ–nô lệ được nêu rõ, “người nô lệ” giữ được sức nặng xã hội của từ gốc hơn “đầy tớ”.
- source_word: ἐκείνου
  choice: ấy
  rationale: Từ chỉ định quy chiếu đến chính người nô lệ vừa được nói đến; “ấy” gọn và tự nhiên trong văn phong trang trọng.
- source_word: ἐν ἡμέρᾳ ᾗ οὐ προσδοκᾷ
  choice: vào một ngày người ấy không ngờ
  rationale: Giữ tính bất định của “một ngày” và diễn đạt προσδοκάω bằng “ngờ”, phù hợp với ý không trông đợi hoặc không dự liệu.
- source_word: ἐν ὥρᾳ ᾗ οὐ γινώσκει
  choice: vào một giờ người ấy không biết
  rationale: Giữ phép song hành ngày–giờ của bản Hy Lạp và ý đơn giản của γινώσκω là “biết”.
theological_decisions:
- issue: Nghĩa của κύριος trong bối cảnh dụ ngôn
  choice: chủ
  alternative: chúa
  rationale: κύριος có thể mang nghĩa “Chúa” hoặc “chủ”, nhưng trong mệnh đề này nó trực tiếp chỉ người chủ của một nô lệ trong câu chuyện. “Chủ” giữ nguyên hình ảnh dụ ngôn mà không phủ nhận ý nghĩa cánh chung rộng hơn.
- issue: Cách dịch δοῦλος
  choice: người nô lệ
  alternative: đầy tớ
  rationale: Bối cảnh nêu bật quan hệ lệ thuộc giữa κύριος và δοῦλος; vì vậy “người nô lệ” phản ánh rõ địa vị bị ràng buộc hơn. Chú thích ghi nhận cách dịch quen thuộc nhưng nhẹ hơn là “đầy tớ”.
translation_notes:
  register: Bản dịch dùng tiếng Việt hiện đại, trang trọng và dễ hiểu. Đại từ “người ấy” tránh sắc thái miệt thị không có trong nguyên văn. Cấu trúc lặp “vào một ngày… và vào một giờ…” được giữ để phản ánh phép song hành của câu Hy Lạp.
