  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: τότε ἐάν τις ὑμῖν εἴπῃ· Ἰδοὺ ὧδε ὁ χριστός, ἤ· Ὧδε, μὴ πιστεύσητε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/023.yaml
  text: Then if anyone says to you[a], ‘Look, here is the Messiah!’ or[b], ‘There he is!’ do not believe it.
translation:
  language: vi
  text: 'Bấy giờ, nếu có ai nói với anh em: “Kìa, Đấng Mê-si-a[a] ở đây!” hoặc: “Ở đây![b]” thì đừng tin.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Đấng Ki-tô” hoặc “Đấng Christ.”'
    reason: Bảo lưu cách dịch truyền thống của tước hiệu Χριστός.
  - marker: b
    text: 'Nguyên văn Hy Lạp là một lời chỉ địa điểm tỉnh lược: “Ở đây!”'
    reason: Cho biết câu trích dẫn thứ hai không có chủ ngữ hay động từ được nêu rõ trong nguyên văn.
lexical_decisions:
- source_word: τότε
  choice: Bấy giờ
  rationale: Giữ liên kết thời gian với mạch diễn từ trước đó và phù hợp với văn phong tường thuật trang trọng, tự nhiên.
- source_word: ἐάν τις ὑμῖν εἴπῃ
  choice: nếu có ai nói với anh em
  rationale: Diễn đạt điều kiện với chủ thể bất định; “anh em” phản ánh đại từ số nhiều ὑμῖν.
- source_word: Ἰδοὺ
  choice: Kìa
  rationale: Là lời thu hút sự chú ý có sắc thái chỉ trỏ; “Kìa” tự nhiên hơn lối cổ “Này, hãy xem” trong ngữ cảnh này.
- source_word: ὧδε
  choice: ở đây
  rationale: Giữ nghĩa địa điểm trực tiếp của trạng từ Hy Lạp trong cả hai lần xuất hiện.
- source_word: ὁ χριστός
  choice: Đấng Mê-si-a
  rationale: Mạo từ cùng ngữ cảnh nhận diện Đấng được xức dầu cho thấy Χριστός đang được dùng như một tước hiệu, không phải tên riêng.
- source_word: ἤ· Ὧδε
  choice: 'hoặc: “Ngài ở đây!”'
  rationale: Tiếng Hy Lạp lược bỏ chủ ngữ và động từ. Bản dịch bổ sung “Ngài ở” để câu tiếng Việt rõ và tự nhiên nhưng vẫn giữ địa điểm “đây” của nguyên văn.
- source_word: μὴ πιστεύσητε
  choice: thì đừng tin
  rationale: Diễn đạt tự nhiên mệnh lệnh phủ định; đối tượng của hành động tin được hiểu là lời khẳng định vừa nêu, đúng với sự hàm ẩn trong tiếng Hy Lạp.
theological_decisions:
- issue: Cách dịch Χριστός
  choice: Đấng Mê-si-a
  alternative: Đấng Ki-tô; Đấng Christ
  rationale: Ở đây từ này chỉ tước hiệu của Đấng được xức dầu mà người ta tuyên bố đã xuất hiện tại một địa điểm. “Đấng Mê-si-a” làm rõ chức năng tước hiệu mà không biến nó thành tên riêng.
- issue: Đối tượng của μὴ πιστεύσητε
  choice: Không nêu đối tượng sau “đừng tin”
  alternative: đừng tin lời ấy; đừng tin người đó
  rationale: 'Nguyên văn không có tân ngữ. Cách dịch này bảo toàn độ mở: lời cấm có thể hướng đến lời tuyên bố vừa được thuật lại, mà không buộc phải xác định là tin lời hay tin người nói.'
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh em” để thể hiện đối tượng số nhiều. Dấu ngoặc kép và dấu chấm than giữ sức nhấn của các lời chỉ trỏ trực tiếp; sự lặp lại “ở đây” được giữ theo nguyên văn thay vì đổi lần thứ hai thành “ở kia”.
