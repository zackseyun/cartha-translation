revisions:
- from: Vậy, khi anh em thấy “điều ghê tởm của cảnh hoang tàn” mà tiên tri Đa-ni-ên đã nói đến đang đứng trong một nơi thánh—người đọc hãy hiểu—[a][b]
  to: Vậy, khi anh em thấy “điều ghê tởm của sự hoang tàn”[b] đã được phán qua tiên tri Đa-ni-ên đang đứng trong một nơi thánh[a]—người đọc hãy hiểu—
  rationale: Bản sửa phục hồi sắc thái bị động và phương tiện của “đã được phán qua tiên tri Đa-ni-ên,” dùng cách nói Việt ngữ trôi chảy hơn cho thành ngữ Đa-ni-ên, và gắn mỗi chú thích vào đúng cụm từ liên quan. Bản văn vẫn không xác định “điều ghê tởm,” không đồng nhất “nơi thánh” với một địa điểm cụ thể, và không giải quyết trước ý nghĩa gây tranh luận của thành ngữ.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T05:43:05Z'
review_pass:
  verdict: revise
  source_fidelity: Cần sửa nhẹ cụm τὸ ῥηθὲν διὰ Δανιὴλ τοῦ προφήτου. “mà tiên tri Đa-ni-ên đã nói đến” chuyển Đa-ni-ên thành chủ thể trực tiếp và thêm sắc thái “nói đến”; nguyên văn nói rằng cụm này đã được nói/phán qua Đa-ni-ên. Bản sửa giữ cấu trúc đó. “một nơi thánh” bảo toàn tính không xác định của τόπῳ ἁγίῳ, còn “đang đứng” giữ hình ảnh không giải thích của ἑστὸς.
  naturalness: “Điều ghê tởm của sự hoang tàn” tự nhiên hơn “điều ghê tởm của cảnh hoang tàn” trong khi vẫn cố ý giữ quan hệ sở hữu mơ hồ của thành ngữ Đa-ni-ên. Các ký hiệu chú thích được đặt ngay sau thành phần mà chúng giải thích, giúp liên kết chú thích rõ hơn.
  terminology: Giữ “điều ghê tởm” cho βδέλυγμα, “sự hoang tàn” cho ἐρήμωσις, “tiên tri Đa-ni-ên” cho Δανιὴλ τοῦ προφήτου, và “nơi thánh” cho τόπῳ ἁγίῳ. Không diễn giải cụm Đa-ni-ên thành một đối tượng, nhân vật, hay biến cố cụ thể.
  issues:
  - severity: medium
    issue: “mà tiên tri Đa-ni-ên đã nói đến” chưa phản ánh chính xác τὸ ῥηθὲν διὰ Δανιὴλ τοῦ προφήτου.
    rationale: Phân từ bị động τὸ ῥηθὲν là điều “đã được nói/phán,” với διά + sở hữu cách chỉ phương tiện/tác nhân truyền đạt “qua Đa-ni-ên.” Cách dịch cũ chuyển thành “Daniel nói đến [điều ấy],” làm thay đổi nhẹ quan hệ cú pháp và ngữ nghĩa.
  - severity: low
    issue: “cảnh hoang tàn” kém tự nhiên trong cụm thành ngữ.
    rationale: “Sự hoang tàn” diễn đạt danh từ trừu tượng tự nhiên hơn và vẫn không quyết định genitive τῆς ἐρημώσεως là chủ quan hay khách quan.
  - severity: low
    issue: Các neo chú thích đặt chung ở cuối câu thay vì ngay sau từ ngữ liên quan.
    rationale: Đặt [b] sau cụm Đa-ni-ên và [a] sau “một nơi thánh” làm rõ phạm vi từng chú thích mà không thay đổi nghĩa.
