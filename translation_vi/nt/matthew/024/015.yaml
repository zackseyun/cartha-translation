id: MAT.24.15
reference: Matthew 24:15
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ὅταν οὖν ἴδητε τὸ βδέλυγμα τῆς ἐρημώσεως τὸ ῥηθὲν διὰ Δανιὴλ τοῦ προφήτου ⸀ἑστὸς ἐν τόπῳ ἁγίῳ, ὁ ἀναγινώσκων νοείτω,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/015.yaml
  text: So when you see the abomination of desolation spoken of through Daniel the prophet standing in a holy place—let the reader understand—[a][b]
translation:
  language: vi
  text: Vậy, khi anh em thấy “điều ghê tởm của sự hoang tàn”[b] đã được phán qua tiên tri Đa-ni-ên đang đứng trong một nơi thánh[a]—người đọc hãy hiểu—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch theo cách truyền thống hơn: “trong nơi thánh.”'
    reason: alternative_reading
  - marker: b
    text: 'Cũng có thể dịch: “điều ghê tởm gây hoang tàn” hoặc “điều ghê tởm đem lại cảnh hoang tàn”; cụm từ này vọng lại lời trong sách Đa-ni-ên.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅταν οὖν
  choice: Vậy, khi
  rationale: Diễn đạt tự nhiên mệnh đề thời gian chỉ một tình huống tương lai, đồng thời giữ liên kết suy luận/chuyển ý của οὖν với phần trước.
- source_word: ἴδητε
  choice: anh em thấy
  rationale: Dịch trực tiếp động từ ὁράω; “anh em” biểu thị ngôi thứ hai số nhiều một cách tự nhiên và trang trọng trong tiếng Việt.
- source_word: τὸ βδέλυγμα τῆς ἐρημώσεως
  choice: điều ghê tởm của cảnh hoang tàn
  rationale: Giữ cấu trúc sở hữu và tính mơ hồ của cụm từ Hy Lạp, đồng thời duy trì tiếng vọng với sách Đa-ni-ên; không mặc nhiên quyết định rằng vật ghê tởm gây nên sự hoang tàn.
- source_word: τὸ ῥηθὲν διὰ Δανιὴλ τοῦ προφήτου
  choice: mà tiên tri Đa-ni-ên đã nói đến
  rationale: Diễn đạt gọn và tự nhiên việc lời tiên tri được nói qua Đa-ni-ên. Tiếng Việt không cần chuyển cấu trúc bị động của phân từ Hy Lạp mới giữ được nội dung.
- source_word: ἑστὸς
  choice: đang đứng
  rationale: Phản ánh trực tiếp phân từ của ἵστημι, không diễn giải thành “được dựng lên,” vốn có thể hàm ý một hành động thiết lập cụ thể.
- source_word: ἐν τόπῳ ἁγίῳ
  choice: trong một nơi thánh
  rationale: “Một” phản ánh danh từ Hy Lạp không có mạo từ và tránh mặc nhiên đồng nhất địa điểm với một phần cụ thể của đền thờ.
- source_word: ὁ ἀναγινώσκων νοείτω
  choice: người đọc hãy hiểu
  rationale: Giữ nguyên lời nhắc xen giữa và lực mệnh lệnh của νοείτω bằng cách diễn đạt ngắn gọn, quen thuộc.
theological_decisions:
- issue: Tính xác định của τόπῳ ἁγίῳ và khả năng chỉ riêng đền thờ
  choice: trong một nơi thánh
  alternative: trong nơi thánh
  rationale: Ngữ cảnh có thể gợi đến đền thờ hoặc một địa điểm đã được biệt ra là thánh, nhưng cụm từ Hy Lạp không có mạo từ nên không buộc phải hiểu là một địa điểm xác định. Bản chính giữ độ rộng ấy; cách hiểu truyền thống hơn được nêu trong chú thích.
- issue: Ý nghĩa của cụm từ trong Đa-ni-ên βδέλυγμα τῆς ἐρημώσεως
  choice: điều ghê tởm của cảnh hoang tàn
  alternative: điều ghê tởm gây hoang tàn; điều ghê tởm đem lại cảnh hoang tàn
  rationale: Cấu trúc sở hữu trong nguyên văn có thể được hiểu theo nhiều quan hệ ý nghĩa. Bản chính không giải quyết sự căng thẳng đó bằng một lối diễn giải nhân quả; các cách hiểu giải nghĩa được giữ trong chú thích.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “điều ghê tởm” thay vì những từ cổ hoặc quá khẩu ngữ; giữ các dấu gạch ngang để thể hiện lời nhắc xen giữa. Hai ký hiệu chú thích [a], [b] đều xuất hiện trong bản văn chính.
