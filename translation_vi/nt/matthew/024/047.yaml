  terminology: “Ông chủ,” “quản lý,” và “mọi tài sản của mình” phù hợp với ngữ cảnh dụ ngôn và không thêm diễn giải thần học. “Các anh em” có thể giữ trong ngữ cảnh Chúa nói với các môn đồ; không cần thay đổi thuật ngữ khác.
