  text: ἀμὴν λέγω ὑμῖν ὅτι ἐπὶ πᾶσιν τοῖς ὑπάρχουσιν αὐτοῦ καταστήσει αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/047.yaml
  text: Truly I say to you that he will appoint him over all his possessions[a].
translation:
  language: vi
  text: 'Quả thật, tôi nói với các anh em: ông chủ sẽ giao cho người ấy quản lý mọi tài sản của mình.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “mọi thứ mình có.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν
  choice: Thật
  rationale: Mở đầu một lời tuyên bố long trọng và đầy thẩm quyền. “Thật” tự nhiên trong tiếng Việt và giữ được sắc thái của công thức này.
- source_word: λέγω ὑμῖν
  choice: tôi nói với các anh em
  rationale: Giữ sát công thức phát ngôn trực tiếp. Đại từ số nhiều ὑμῖν được thể hiện bằng “các anh em”, phù hợp với nhóm môn đồ trong ngữ cảnh.
- source_word: ὅτι
  choice: dấu hai chấm
  rationale: Tiếng Việt tự nhiên hơn khi dùng dấu hai chấm để dẫn nội dung lời khẳng định thay vì dịch máy móc bằng “rằng” sau công thức mở đầu.
- source_word: ἐπὶ πᾶσιν τοῖς ὑπάρχουσιν αὐτοῦ
  choice: quản lý mọi tài sản của mình
  rationale: ἐπί với cách dữ sau καθίστημι chỉ phạm vi trách nhiệm; τοῖς ὑπάρχουσιν αὐτοῦ là mọi thứ thuộc về ông chủ. “Mọi tài sản” ngắn gọn, tự nhiên; cách sát chữ hơn được giữ trong chú thích.
- source_word: καταστήσει
  choice: sẽ giao cho ... quản lý
  rationale: Trong ngữ cảnh, động từ chỉ việc bổ nhiệm hoặc đặt một người vào trách nhiệm trông coi, không đơn thuần là đặt ở một vị trí vật lý.
- source_word: αὐτόν
  choice: người ấy
  rationale: Chỉ người đầy tớ trung tín và khôn ngoan ở ngữ cảnh trước; “người ấy” giữ nguyên số ít và quy chiếu cá nhân mà không gây lặp đại từ.
theological_decisions:
- issue: Bản chất phần thưởng hoặc trách nhiệm được chủ giao
  choice: Diễn đạt đơn giản là người chủ giao cho đầy tớ quản lý toàn bộ tài sản của mình trong logic của dụ ngôn.
  alternative: Giải thích đây là thẩm quyền trong hội thánh hoặc phần thưởng trên trời vào thời cuối cùng.
  rationale: Câu này nói trực tiếp đến việc trao trách nhiệm quản lý rộng hơn. Bản dịch không nên đưa các hệ thống giải nghĩa hội thánh học hay cánh chung học vào chính câu chữ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Ông chủ” được nêu rõ để tránh sự mơ hồ của đại từ chủ ngữ trong tiếng Việt; “của mình” quy chiếu tự nhiên về ông chủ. Dấu chú thích [a] xuất hiện trong chính văn.
source_grounding:
  english_pob_role: consult_only
