  terminology: “Đau chuyển dạ” chuyển đạt chính xác ὠδίνων mà không làm phẳng thành “hoạn nạn”. Chú thích nêu lựa chọn thay thế thích hợp; nên dùng “những cơn đau sinh nở” như một cách diễn đạt thay thế đầy đủ, nhất quán.
