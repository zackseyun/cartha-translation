  text: πάντα δὲ ταῦτα ἀρχὴ ὠδίνων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/008.yaml
  text: But all these things are the beginning of birth pains[a].
translation:
  language: vi
  text: Nhưng tất cả những điều ấy là khởi đầu của những cơn đau chuyển dạ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “những cơn đau sinh nở” hoặc “những cơn đau đẻ”. Tiếng Hy Lạp gợi đến cơn đau của người phụ nữ khi sinh con, dùng làm hình ảnh cho giai đoạn đầu của hoạn nạn sắp đến.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα
  choice: tất cả
  rationale: Đi cùng ταῦτα để tạo thành cụm “tất cả những điều ấy”, vừa tự nhiên trong tiếng Việt vừa giữ được phạm vi bao quát của nguyên văn.
- source_word: δὲ
  choice: Nhưng
  rationale: Đánh dấu sự chuyển ý có sắc thái tương phản nhẹ từ danh sách các biến cố trước đó sang lời nhận định của Đức Giê-su.
- source_word: ταῦτα
  choice: những điều ấy
  rationale: Chỉ về các biến cố vừa được nhắc đến; “ấy” thể hiện sự hồi chỉ tự nhiên trong tiếng Việt.
- source_word: ἀρχὴ
  choice: khởi đầu
  rationale: Diễn tả giai đoạn mở đầu của một tiến trình, không hàm ý rằng các biến cố vừa kể chính là sự kết thúc.
- source_word: ὠδίνων
  choice: những cơn đau chuyển dạ
  rationale: Giữ nguyên hình ảnh đau đớn khi sinh con; cách nói này rõ nghĩa, tự nhiên và trang trọng trong tiếng Việt hiện đại.
theological_decisions:
- issue: Sức gợi của ẩn dụ ὠδίνων
  choice: Giữ hình ảnh sinh nở bằng cụm “những cơn đau chuyển dạ”.
  alternative: Nỗi khổ đau; hoạn nạn; những cơn đau sinh nở.
  rationale: Nguyên văn mô tả các biến động trước đó như giai đoạn đầu của một tiến trình, chứ chưa phải điểm kết thúc. Giữ ẩn dụ bảo toàn sức căng cánh chung mà không áp đặt một hệ thống giải thích chi tiết hơn câu Kinh Thánh.
- issue: Sắc thái của ἀρχὴ trong câu vị ngữ
  choice: Dịch “mới chỉ là khởi đầu”.
  alternative: Là khởi đầu; là sự bắt đầu.
  rationale: “Mới chỉ” làm rõ sự đối lập ngữ cảnh giữa các biến cố đáng sợ và việc chúng chưa phải là sự cuối cùng, phù hợp với câu trước, mà không xác định thêm trình tự giáo lý ngoài văn bản.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. “Đau chuyển dạ” là cách diễn đạt thông dụng và chính xác về hình ảnh sinh nở; “những điều ấy” liên kết rõ với các biến cố ở phần trước.
