base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/040.yaml
  text: Then two men will be in the field; one is taken and one is left.
translation:
  language: vi
  text: Bấy giờ, hai người đàn ông sẽ ở ngoài đồng; một người được đem đi[a], còn một người bị để lại.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “được đưa theo.” Bản thân động từ này không xác định người ấy được đem đi để giải cứu hay để chịu xét phạt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Bấy giờ
  rationale: Trạng từ chỉ thời gian nối lời này với bối cảnh cánh chung ngay trước đó; “Bấy giờ” tự nhiên, trang trọng và giữ được trình tự.
- source_word: δύο ἔσονται
  choice: hai người đàn ông sẽ ở
  rationale: Nguyên văn nói “hai người sẽ ở”; các đại từ số từ giống đực εἷς ... εἷς và câu song song về phụ nữ ở câu kế tiếp cho thấy đây là hai người nam, nên diễn đạt rõ giới tính của cảnh.
- source_word: ἐν τῷ ἀγρῷ
  choice: ở ngoài đồng
  rationale: Cách nói tự nhiên trong tiếng Việt cho địa điểm lao động nông nghiệp, tương ứng trực tiếp với cụm chỉ vị trí trong tiếng Hy Lạp.
- source_word: εἷς
  choice: một người
  rationale: Giữ phép đối xứng ngắn gọn của nguyên văn và tránh lặp lại “người đàn ông” một cách nặng nề.
- source_word: παραλαμβάνεται
  choice: được đem đi
  rationale: Thể bị động hiện tại trong khung cảnh hướng tới tương lai. “Được đem đi” giữ tương đối trung tính về mục đích của hành động, không tự quyết định đó là giải cứu hay xét phạt.
- source_word: ἀφίεται
  choice: bị để lại
  rationale: Diễn đạt trực tiếp ý nghĩa bị động trong ngữ cảnh. “Để lại phía sau” dễ gợi một hệ thống cánh chung cụ thể, còn “bị bỏ rơi” mạnh hơn nguyên văn.
theological_decisions:
- issue: Việc παραλαμβάνεται hàm ý được giải cứu hay bị đem đi chịu xét phạt
  choice: Giữ cách dịch trung tính “được đem đi” trong chính văn
  alternative: “được tiếp nhận/đưa đến nơi an toàn” hoặc “bị bắt đi chịu xét phạt”
  rationale: Động từ tự nó không xác định rõ mục đích tích cực hay tiêu cực; mạch văn về thời Nô-ê vẫn để ngỏ tranh luận. Bản dịch không nên áp đặt một hệ thống cánh chung.
- issue: Có nên nói rõ hai người trong cảnh này là nam giới hay không
  choice: Dịch “hai người đàn ông”
  alternative: “hai người”
  rationale: Dù δύο chỉ có nghĩa là “hai”, các dạng giống đực εἷς ... εἷς cùng cảnh song song về phụ nữ trong câu kế tiếp hỗ trợ việc thể hiện rõ cảnh gồm hai người nam.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dấu chấm phẩy giữ hai vế tương phản cân đối; “còn” làm rõ sự đối lập. Dấu chú thích [a] được đặt ngay sau cụm từ cần giải thích.
