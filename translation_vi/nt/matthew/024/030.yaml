id: MAT.24.30
reference: Matthew 24:30
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ τότε φανήσεται τὸ σημεῖον τοῦ υἱοῦ τοῦ ἀνθρώπου ἐν ⸀τῷ οὐρανῷ, καὶ τότε κόψονται πᾶσαι αἱ φυλαὶ τῆς γῆς καὶ ὄψονται τὸν υἱὸν τοῦ ἀνθρώπου ἐρχόμενον ἐπὶ τῶν νεφελῶν τοῦ οὐρανοῦ μετὰ δυνάμεως καὶ δόξης πολλῆς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/030.yaml
  text: And then the sign of the Son of Man will appear in heaven[a], and then all the tribes of the earth will mourn[c][b], and they will see the Son of Man coming on the clouds of heaven with power and great glory.
translation:
  language: vi
  text: Bấy giờ, dấu hiệu của Con Người sẽ xuất hiện trên trời[a], và bấy giờ mọi bộ tộc trên đất[b] sẽ than khóc; họ sẽ thấy Con Người đến trên mây trời[c] với quyền năng và vinh quang lớn lao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “trên bầu trời.” Từ Hy Lạp οὐρανός có thể chỉ “trời” hoặc “bầu trời”, tùy văn cảnh.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “mọi bộ tộc trong xứ.” Từ Hy Lạp γῆ có thể có nghĩa là “đất” hoặc “xứ”.'
    reason: alternative_reading
  - marker: c
    text: Cụm từ “đến trên mây trời” gợi lại Đa-ni-ên 7:13.
    reason: cross_reference
lexical_decisions:
- source_word: φανήσεται
  choice: sẽ xuất hiện
  rationale: 'Diễn đạt tự nhiên nghĩa nội động của động từ trong ngữ cảnh này: dấu hiệu trở nên hữu hình, được thấy.'
- source_word: τὸ σημεῖον τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: dấu hiệu của Con Người
  rationale: “Dấu hiệu” là nghĩa trực tiếp, rõ ràng của σημεῖον; cấu trúc “của Con Người” giữ nguyên tính hàm hồ của sở hữu cách, không quyết định đó là dấu hiệu liên quan đến Ngài hay chính Ngài là dấu hiệu.
- source_word: ἐν τῷ οὐρανῷ
  choice: trên trời
  rationale: Cách nói tự nhiên trong tiếng Việt, thích hợp với văn cảnh khải huyền; “trời” vẫn có thể chỉ cõi trời hoặc bầu trời.
- source_word: κόψονται
  choice: sẽ than khóc
  rationale: Trong lối dùng này, động từ chỉ sự than khóc, tang chế; bản dịch truyền đạt ý nghĩa mà không bắt buộc một cử chỉ cụ thể như đấm ngực.
- source_word: πᾶσαι αἱ φυλαὶ τῆς γῆς
  choice: mọi bộ tộc trên đất
  rationale: “Bộ tộc” phản ánh trực tiếp φυλαί, còn “đất” giữ được phạm vi rộng của γῆ mà vẫn cho phép sắc thái “xứ” được nêu trong chú thích.
- source_word: ὄψονται
  choice: họ sẽ thấy
  rationale: Lối dịch đơn giản, hiện đại và trực tiếp của động từ ὁράω ở thì tương lai.
- source_word: ἐρχόμενον ἐπὶ τῶν νεφελῶν τοῦ οὐρανοῦ
  choice: ngự đến trên mây trời
  rationale: “Ngự đến” giữ sắc thái trang trọng phù hợp với tước hiệu Con Người và cảnh tượng khải huyền; “trên mây trời” phản ánh ἐπί và bảo tồn tiếng vọng Đa-ni-ên 7:13.
- source_word: μετὰ δυνάμεως καὶ δόξης πολλῆς
  choice: với quyền năng và vinh quang lớn lao
  rationale: Giữ cấu trúc trong đó πολλῆς bổ nghĩa trực tiếp cho “vinh quang”, đồng thời tạo câu tiếng Việt tự nhiên.
theological_decisions:
- issue: Ý nghĩa của “dấu hiệu của Con Người”
  choice: Giữ nguyên cách nói “dấu hiệu của Con Người”.
  alternative: “dấu hiệu thuộc về Con Người” hoặc “dấu hiệu chính là Con Người”
  rationale: Sở hữu cách Hy Lạp không buộc phải chọn một cách hiểu duy nhất; bản dịch không giải quyết thay một chi tiết cánh chung còn được tranh luận.
- issue: Phạm vi của γῆ trong cụm “mọi bộ tộc trên đất”
  choice: Dịch γῆ là “đất” trong chính văn, với hàm ý toàn cõi đất trong văn cảnh vũ trụ.
  alternative: “xứ”
  rationale: Văn cảnh khải huyền rộng lớn ủng hộ phạm vi toàn thế giới, nhưng tiếng vọng Cựu Ước cũng cho phép cách hiểu tập trung vào một xứ; chú thích bảo tồn khả năng đó.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Tước hiệu “Con Người” được viết hoa; “ngự đến” tạo sắc thái tôn kính phù hợp mà không thêm một cách giải thích giáo phái. Các dấu chú thích [a], [b], [c] đều được đặt ngay tại cụm từ liên quan trong chính văn.
