revisions:
- from: Bấy giờ, dấu hiệu của Con Người sẽ xuất hiện trên trời[a]. Mọi bộ tộc trên đất[b] sẽ than khóc, và họ sẽ thấy Con Người ngự đến trên mây trời[c] với quyền năng và vinh quang lớn lao.
  to: Bấy giờ, dấu hiệu của Con Người sẽ xuất hiện trên trời[a], và bấy giờ mọi bộ tộc trên đất[b] sẽ than khóc; họ sẽ thấy Con Người đến trên mây trời[c] với quyền năng và vinh quang lớn lao.
  rationale: Bổ sung “và bấy giờ” để dịch đầy đủ καὶ τότε ở vế thứ hai. Đổi “ngự đến” thành “đến” để không thêm sắc thái tôn kính do lựa chọn động từ tiếng Việt, trong khi vẫn giữ nguyên hình ảnh khải huyền và tiếng vọng Đa-ni-ên 7:13. Chú thích [c] được điều chỉnh theo đúng cụm từ trong chính văn đã sửa.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T05:43:23Z'
review_pass:
  verdict: revise
  source_fidelity: Bản dịch phản ánh đúng các thành tố chính của câu Hy Lạp, gồm “dấu hiệu của Con Người,” sự than khóc của mọi bộ tộc, việc họ thấy Con Người đến trên mây trời, và “quyền năng cùng vinh quang lớn lao.” Tuy nhiên, bản văn Hy Lạp có τότε (“bấy giờ”) ở cả hai vế lớn; bản nháp chỉ thể hiện từ này ở vế đầu, nên cần bổ sung ở vế sau.
  naturalness: Văn phong hiện đại, trang trọng và tự nhiên. “Trên trời,” “than khóc,” và “vinh quang lớn lao” đều phù hợp. “Ngự đến” là lối nói Kinh Thánh trang trọng nhưng thêm sắc thái tôn kính không được động từ ἐρχόμενον tự nó biểu thị; “đến” giữ sát nguồn hơn và vẫn phù hợp văn cảnh.
  terminology: “Con Người” được dùng nhất quán và phù hợp. “Dấu hiệu của Con Người” bảo toàn tính hàm hồ của sở hữu cách. “Mọi bộ tộc trên đất” cùng chú thích “trong xứ” bảo tồn cách hiểu thay thế của γῆ. Các chú thích từ vựng và điển tích được neo đúng cụm từ liên quan.
  issues:
  - severity: medium
    issue: Thiếu lần xuất hiện thứ hai của “bấy giờ”
    rationale: Nguyên văn có καὶ τότε trước mệnh đề “mọi bộ tộc ... sẽ than khóc.” Việc bỏ từ này làm giảm sự song hành và trình tự thời điểm được nêu rõ trong câu.
  - severity: low
    issue: “Ngự đến” diễn giải sắc thái của ἐρχόμενον mạnh hơn cần thiết
    rationale: ἐρχόμενον có nghĩa cơ bản là “đến/đang đến.” Dùng “đến” bảo toàn cách diễn đạt nguồn mà vẫn giữ văn phong trang trọng nhờ ngữ cảnh và tước hiệu “Con Người.”
