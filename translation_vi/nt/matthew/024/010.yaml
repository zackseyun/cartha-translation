source:
  edition: SBLGNT
  text: καὶ τότε σκανδαλισθήσονται πολλοὶ καὶ ἀλλήλους παραδώσουσιν καὶ μισήσουσιν ἀλλήλους·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/010.yaml
  text: And then many will fall away[b][a], and they will betray one another and hate one another.
translation:
  language: vi
  text: Và bấy giờ, nhiều người sẽ sa ngã[a], sẽ phản bội nhau[b] và thù ghét nhau.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “sẽ bị làm cho vấp ngã” hoặc “sẽ lấy làm cớ vấp phạm.”'
    reason: lexical_alternative
  - marker: b
    text: Hay “sẽ nộp nhau” hoặc “sẽ giao nộp nhau.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: bấy giờ
  rationale: Diễn tả thời điểm tiếp nối trong lời giảng của Đức Chúa Jêsus; “bấy giờ” trang trọng, tự nhiên và gắn rõ với những biến cố vừa nêu.
- source_word: σκανδαλισθήσονται
  choice: sẽ sa ngã
  rationale: Trong bối cảnh bị bách hại, động từ này chỉ sự vấp ngã nghiêm trọng dẫn đến chối bỏ hoặc lìa bỏ, nhưng “sa ngã” không áp đặt một hệ thống thần học cụ thể. Chú thích giữ lại các sắc thái khác của thể bị động.
- source_word: πολλοὶ
  choice: nhiều người
  rationale: Tính từ được dùng như danh từ; thêm “người” là cách diễn đạt rõ ràng, tự nhiên trong tiếng Việt.
- source_word: ἀλλήλους
  choice: nhau
  rationale: Đại từ tương hỗ được diễn đạt tự nhiên nhất bằng “nhau” trong cả ba hành động tương hỗ của câu.
- source_word: παραδώσουσιν
  choice: sẽ phản bội nhau
  rationale: Trong bối cảnh thù nghịch và bách hại, “phản bội” truyền đạt tự nhiên hàm ý giao nộp người khác một cách bất trung; nghĩa sát chữ “nộp nhau” được giữ trong chú thích.
- source_word: μισήσουσιν
  choice: thù ghét nhau
  rationale: Diễn tả sự căm ghét và thái độ thù địch chủ động; “thù ghét” phù hợp với mức độ mạnh của μισέω trong văn cảnh.
- source_word: καὶ τότε ... καὶ ... καὶ ...
  choice: Và bấy giờ ... sẽ ... sẽ ... và ...
  rationale: Giữ từ nối đầu câu để nối với mạch văn trước, đồng thời duy trì nhịp tích lũy của chuỗi hành động mà không làm câu tiếng Việt nặng nề.
theological_decisions:
- issue: Ý nghĩa của σκανδαλισθήσονται trong bối cảnh bách hại vào thời cuối cùng
  choice: sẽ sa ngã
  alternative: sẽ bị làm cho vấp ngã; sẽ vấp phạm
  rationale: “Sa ngã” thể hiện mức độ nghiêm trọng của sự đổ vỡ và lìa bỏ trong tiến trình dẫn đến phản bội và thù ghét, nhưng không xác định quá mức bản chất hay tính vĩnh viễn của sự lìa bỏ ấy.
- issue: Sắc thái của παραδώσουσιν
  choice: sẽ phản bội nhau
  alternative: sẽ nộp nhau; sẽ giao nộp nhau
  rationale: “Phản bội” phù hợp với quan hệ giữa người với người trong câu và hàm ý giao người khác cho những kẻ bách hại, trong khi chú thích bảo lưu hình ảnh giao nộp của nguyên ngữ.
translation_notes:
  register: 'Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Câu giữ liên từ mở đầu và trình tự leo thang của nguyên văn: sa ngã, phản bội, rồi thù ghét. Hai chú thích bảo lưu độ rộng nghĩa của các động từ Hy Lạp mà bản chính phải diễn đạt tự nhiên hơn.'
