id: MAT.24.36
reference: Matthew 24:36
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Περὶ δὲ τῆς ἡμέρας ἐκείνης καὶ ὥρας οὐδεὶς οἶδεν, οὐδὲ οἱ ἄγγελοι τῶν οὐρανῶν ⸂οὐδὲ ὁ υἱός⸃, εἰ μὴ ὁ ⸀πατὴρ μόνος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/036.yaml
  text: But concerning that day and hour[a], no one knows—not even the angels of heaven, nor the Son—except the Father alone.
translation:
  language: vi
  text: Nhưng về ngày và giờ ấy, không ai biết, ngay cả các thiên sứ trên trời cũng không, Con cũng không; chỉ một mình Cha biết.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Một số thủ bản không có cụm “Con cũng không.” Chính văn ở đây theo cách đọc của SBLGNT.
    reason: textual_variant
lexical_decisions:
- source_word: Περὶ δὲ
  choice: Nhưng về
  rationale: περί với sở hữu cách nêu chủ đề, còn δέ đánh dấu sự chuyển ý có sắc thái tương phản nhẹ; “Nhưng về” giữ được cả hai chức năng một cách tự nhiên.
- source_word: τῆς ἡμέρας ἐκείνης καὶ ὥρας
  choice: ngày và giờ ấy
  rationale: Cụm sở hữu cách phụ thuộc vào περί; đại từ chỉ định ἐκείνης áp dụng tự nhiên cho toàn bộ cụm phối hợp. Cách dịch này ngắn gọn và giữ tính xác định của thời điểm được nói đến.
- source_word: οὐδεὶς οἶδεν
  choice: không ai biết
  rationale: οὐδείς diễn tả sự phủ định phổ quát, còn οἶδα mang nghĩa hiện tại là “biết”; đây là cách diễn đạt rõ ràng, tự nhiên trong tiếng Việt hiện đại.
- source_word: οὐδὲ οἱ ἄγγελοι τῶν οὐρανῶν
  choice: ngay cả các thiên sứ trên trời cũng không
  rationale: οὐδέ thêm một thành phần phủ định với sắc thái nhấn mạnh; cấu trúc “ngay cả… cũng không” truyền đạt rõ sắc thái ấy. “Trên trời” diễn đạt tự nhiên τῶν οὐρανῶν.
- source_word: οὐδὲ ὁ υἱός
  choice: Con cũng không
  rationale: Cụm này tiếp nối chuỗi phủ định. “Con” giữ danh hiệu xác định của ὁ υἱός và không làm nhẹ đi lời khẳng định rằng Con không biết.
- source_word: εἰ μὴ
  choice: chỉ
  rationale: Sau mệnh đề phủ định, εἰ μή có nghĩa loại trừ, tương đương “ngoại trừ”; trong cấu trúc tiếng Việt này, “chỉ một mình” diễn đạt tự nhiên và rõ tính ngoại lệ.
- source_word: ὁ πατὴρ μόνος
  choice: chỉ một mình Cha biết
  rationale: μόνος giới hạn sự biết riêng nơi Cha. Việc lặp lại “biết” là bổ sung ngữ pháp cần thiết trong tiếng Việt và làm rõ ý mà không thêm nội dung.
theological_decisions:
- issue: Hàm ý Kitô học của cụm “Con cũng không”
  choice: Giữ nguyên cụm “Con cũng không” trong chính văn, không làm nhẹ hoặc diễn giải thêm.
  alternative: Lược bỏ cụm này theo một số thủ bản, hoặc diễn ý nhằm giảm sự căng thẳng với thần tính của Con.
  rationale: Bản SBLGNT được cung cấp có οὐδὲ ὁ υἱός. Bản dịch giữ nguyên sự căng thẳng thần học trong câu thay vì giải quyết bằng cách lược bỏ hay diễn giải.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dấu chấm phẩy giúp phân tách chuỗi phủ định khỏi mệnh đề ngoại lệ. Dùng “Cha” và “Con” như các danh hiệu trong ngữ cảnh.
