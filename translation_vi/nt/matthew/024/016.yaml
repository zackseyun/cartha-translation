  text: τότε οἱ ἐν τῇ Ἰουδαίᾳ φευγέτωσαν ⸀ἐπὶ τὰ ὄρη,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/016.yaml
  text: then those in Judea must flee to the mountains,[a]
translation:
  language: vi
  text: thì những người ở Giu-đê phải chạy trốn lên núi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “hãy chạy trốn lên núi.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: thì
  rationale: Trạng từ thời gian nối tiếp lời chỉ dẫn ở câu trước; “thì” tự nhiên trong mạch câu điều kiện–thời điểm của tiếng Việt và giữ ý diễn tiến.
- source_word: οἱ ἐν τῇ Ἰουδαίᾳ
  choice: những người ở Giu-đê
  rationale: Mạo từ đi với cụm giới từ được dùng như danh từ, chỉ những người đang ở trong vùng Giu-đê; cách dịch này rõ ràng mà không thêm ý họ là cư dân thường trú.
- source_word: Ἰουδαίᾳ
  choice: Giu-đê
  rationale: Tên địa lý quen dùng trong tiếng Việt, chỉ vùng Judea.
- source_word: φευγέτωσαν
  choice: phải chạy trốn
  rationale: Động từ mệnh lệnh ngôi thứ ba số nhiều mang tính khẩn cấp. “Phải chạy trốn” truyền đạt trực tiếp mệnh lệnh bằng tiếng Việt hiện đại.
- source_word: ἐπὶ τὰ ὄρη
  choice: lên núi
  rationale: ἐπί với đối cách sau động từ chuyển động chỉ hướng đến đích. “Lên núi” là cách nói tự nhiên trong tiếng Việt, giữ hình ảnh địa hình và không làm yếu nghĩa thành “đồi”.
theological_decisions:
- issue: Sắc thái của thể mệnh lệnh trong lời cảnh báo về thời sau cùng
  choice: 'Dịch thành mệnh lệnh khẩn cấp trực tiếp: “phải chạy trốn”'
  alternative: “hãy chạy trốn”
  rationale: Câu này đưa ra chỉ dẫn thực tế và cấp bách. Cách dịch giữ nguyên lực mệnh lệnh mà không thêm một cách giải thích cụ thể nào về trình tự các biến cố thời sau cùng.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Giu-đê” theo dạng tên riêng quen thuộc trong Kinh Thánh tiếng Việt; không thêm “vùng” vì nguyên văn không cần sự minh giải ấy.
