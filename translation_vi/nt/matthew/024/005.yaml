id: MAT.24.5
reference: Matthew 24:5
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: πολλοὶ γὰρ ἐλεύσονται ἐπὶ τῷ ὀνόματί μου λέγοντες· Ἐγώ εἰμι ὁ χριστός, καὶ πολλοὺς πλανήσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/005.yaml
  text: For many will come in my name[a], saying, ‘I am the Messiah,’ and they will lead many astray.
translation:
  language: vi
  text: 'Vì sẽ có nhiều người nhân danh tôi mà đến, nói rằng: “Ta là Đấng Mê-si,”[a] và họ sẽ dẫn nhiều người đi lạc.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “Đấng Ki-tô.” Tước hiệu Hy Lạp là ὁ χριστός, nghĩa là “Đấng được xức dầu.”
    reason: Nêu cách dịch quen thuộc khác của tước hiệu Hy Lạp và làm rõ nghĩa của từ.
lexical_decisions:
- source_word: πολλοὶ
  choice: nhiều người
  rationale: Diễn đạt tự nhiên tính từ chỉ số lượng khi dùng độc lập để nói về người.
- source_word: γὰρ
  choice: Vì
  rationale: Giữ quan hệ giải thích với lời cảnh báo ở câu trước.
- source_word: ἐλεύσονται
  choice: sẽ ... đến
  rationale: Phản ánh trực tiếp thì tương lai của ἔρχομαι và tự nhiên trong tiếng Việt.
- source_word: ἐπὶ τῷ ὀνόματί μου
  choice: nhân danh tôi
  rationale: Thành ngữ tiếng Việt tự nhiên, giữ ý họ viện đến danh tính hoặc thẩm quyền của Chúa Giê-su.
- source_word: λέγοντες
  choice: nói rằng
  rationale: Giữ sắc thái trung tính của phân từ, không diễn giải mạnh thành “tuyên bố” hay “mạo nhận”.
- source_word: Ἐγώ εἰμι ὁ χριστός
  choice: Ta là Đấng Mê-si
  rationale: ὁ χριστός ở đây là tước hiệu chỉ Đấng được xức dầu; “Đấng Mê-si” làm rõ nội dung lời tự nhận của những kẻ giả mạo.
- source_word: πλανήσουσιν
  choice: sẽ dẫn ... đi lạc
  rationale: Giữ được hình ảnh khiến người khác lìa khỏi đường đúng, đồng thời bao hàm ý lừa dối.
- source_word: πολλοὺς
  choice: nhiều người
  rationale: Bổ sung danh từ “người” để câu tiếng Việt rõ ràng và tự nhiên.
theological_decisions:
- issue: Cách dịch Χριστός trong lời tự nhận về căn tính cứu thế
  choice: Đấng Mê-si
  alternative: Đấng Ki-tô
  rationale: Có mạo từ và được dùng như tước hiệu trong lời tự nhận; “Đấng Mê-si” truyền đạt rõ nghĩa Đấng được xức dầu mà không biến tước hiệu thành tên riêng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ta” trong lời tự nhận trực tiếp để giữ giọng trang trọng; cấu trúc “nhân danh tôi mà đến” tự nhiên trong tiếng Việt và không thu hẹp sự mơ hồ của cụm Hy Lạp.
