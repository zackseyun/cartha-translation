source:
  edition: SBLGNT
  text: Ἀπὸ δὲ τῆς συκῆς μάθετε τὴν παραβολήν· ὅταν ἤδη ὁ κλάδος αὐτῆς γένηται ἁπαλὸς καὶ τὰ φύλλα ἐκφύῃ, γινώσκετε ὅτι ἐγγὺς τὸ θέρος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/032.yaml
  text: 'Learn the parable from the fig tree: as soon as its branch becomes tender and puts out leaves[c][b][a], you know that summer is near.'
translation:
  language: vi
  text: 'Hãy học dụ ngôn[a] từ cây vả: khi cành của nó đã mềm và ra lá[b], anh em biết mùa hè[c] gần đến.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hoặc “bài học” hay “hình ảnh minh họa”.
    reason: lexical_alternative
  - marker: b
    text: Hay “mọc lá” hoặc “nảy lá”.
    reason: lexical_alternative
  - marker: c
    text: Từ Hy Lạp θέρος có thể chỉ “mùa hè” và, trong một số văn cảnh, mùa thu hoạch; ở đây nghĩa chỉ mùa hè phù hợp nhất với hình ảnh cây vả.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀπὸ δὲ τῆς συκῆς
  choice: từ cây vả
  rationale: Giữ nghĩa nguồn của ἀπό với sở hữu cách; δέ chỉ có lực chuyển ý nhẹ và không cần thêm một từ chỉ thời gian như “bây giờ”.
- source_word: μάθετε
  choice: hãy học
  rationale: Thể mệnh lệnh aorist được chuyển thành một lời truyền trực tiếp, tự nhiên trong tiếng Việt.
- source_word: τὴν παραβολήν
  choice: bài học
  rationale: Trong cấu trúc “học ... từ cây vả”, “bài học” diễn đạt tự nhiên chức năng của παραβολή là một hình ảnh so sánh để dạy dỗ; chú thích giữ lại từ tương đương sát hình thức là “dụ ngôn” và “hình ảnh minh họa”.
- source_word: ὅταν ἤδη
  choice: khi ... vừa
  rationale: Diễn đạt một điều kiện thời gian mang tính khái quát cùng sắc thái sự việc đã bắt đầu xảy ra.
- source_word: ὁ κλάδος αὐτῆς γένηται ἁπαλὸς
  choice: cành nó vừa mềm ra
  rationale: γένηται chỉ sự thay đổi trạng thái, còn ἁπαλός mô tả cành non trở nên mềm; cách nói này tự nhiên trong hình ảnh thực vật.
- source_word: καὶ τὰ φύλλα ἐκφύῃ
  choice: và đâm lá
  rationale: ἐκφύῃ nói đến việc cây mọc hoặc trổ lá; “đâm lá” là cách diễn đạt gọn và quen thuộc trong tiếng Việt.
- source_word: γινώσκετε
  choice: anh em biết
  rationale: Động từ hiện tại ngôi thứ hai số nhiều ở thức chỉ định được hiểu là nhận biết nói chung, không phải một mệnh lệnh.
- source_word: ἐγγὺς τὸ θέρος
  choice: mùa hè đã gần
  rationale: Trong hình ảnh dấu hiệu theo mùa của cây vả, θέρος phù hợp nhất với nghĩa “mùa hè”; “đã gần” diễn đạt tự nhiên ý ἐγγύς.
theological_decisions:
- issue: Ý nghĩa của hình ảnh cây vả
  choice: Trình bày cây vả như một hình ảnh theo mùa để nhận biết điều đang đến gần, không xác định cây vả tượng trưng cho Israel.
  alternative: Hiểu cây vả là biểu tượng của Israel, hoặc chỉ là một ví dụ chung từ thiên nhiên.
  rationale: Chính câu Hy Lạp nêu một sự so sánh dựa trên dấu hiệu có thể quan sát; bản dịch không nên quyết định một cách giải nghĩa cánh chung rộng hơn mà câu này không nói rõ.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Đại từ số nhiều “anh em” làm rõ ngôi thứ hai số nhiều. Câu giữ hình ảnh cây vả và quan hệ dấu hiệu–mùa, đồng thời tránh đưa cách giải nghĩa biểu tượng vào bản văn.
