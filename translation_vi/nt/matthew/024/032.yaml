revisions:
- from: 'Hãy học bài học[a] từ cây vả: khi cành nó vừa mềm ra và đâm lá[b], anh em biết mùa hè[c] đã gần.'
  to: 'Hãy học dụ ngôn[a] từ cây vả: khi cành của nó đã mềm và ra lá[b], anh em biết mùa hè[c] gần đến.'
  rationale: Bản sửa giữ nguyên quan hệ nguồn của “từ cây vả,” mệnh lệnh “Hãy học,” và hình ảnh theo mùa. “Dụ ngôn” được phục hồi làm tương đương chính của παραβολή, còn những cách diễn đạt giải thích được giữ ở chú thích. Câu về cành và lá được làm tự nhiên hơn mà không thay đổi nghĩa. Không xác định cây vả tượng trưng cho đối tượng nào.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T05:43:27Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản nháp truyền đạt đúng cấu trúc chính: mệnh lệnh “hãy học,” hình ảnh cây vả, dấu hiệu cành/lá, và kết luận rằng mùa hè gần đến. Tuy nhiên, việc dùng “bài học” làm bản văn chính làm yếu liên hệ thuật ngữ παραβολή trong sách Tin Mừng; “dụ ngôn” sát nguồn hơn và vẫn tự nhiên trong văn phong Kinh Thánh Việt ngữ. “Cành nó vừa mềm ra” cũng chưa thật tự nhiên và “vừa” có thể nhấn mạnh tính tức thời hơn mức cần thiết.'
  naturalness: “Cành của nó đã mềm và ra lá” là lối nói rõ ràng, tự nhiên hơn “cành nó vừa mềm ra và đâm lá.” “Mùa hè gần đến” là cách diễn đạt thông dụng và trực tiếp cho ἐγγύς.
  terminology: Dùng “dụ ngôn” cho παραβολή bảo tồn thuật ngữ quen thuộc và nhất quán hơn. Chú thích có thể nêu “bài học” và “hình ảnh minh họa” là các khả năng diễn đạt khác. “Mùa hè” phù hợp với θέρος trong ngữ cảnh cây vả, không áp đặt cách hiểu biểu tượng nào về cây vả.
  issues:
  - severity: medium
    issue: “Bài học” thay cho παραβολή trong bản văn chính.
    rationale: “Bài học” là một cách giải thích chức năng của từ, nhưng παραβολή là thuật ngữ có sắc thái “dụ ngôn/so sánh minh họa.” Dùng “dụ ngôn” trong bản văn chính giữ sát nguồn và thuật ngữ Phúc Âm hơn; các cách nói diễn giải nên chuyển xuống chú thích.
  - severity: low
    issue: Cụm “cành nó vừa mềm ra” chưa tự nhiên.
    rationale: Cách nói này hơi gượng trong tiếng Việt hiện đại; “cành của nó đã mềm và ra lá” diễn đạt rõ sự thay đổi theo mùa và việc mọc lá.
  - severity: low
    issue: Câu cuối chú thích c thiếu danh từ bổ nghĩa sau “nghĩa chỉ mùa”.
    rationale: Nên viết rõ “nghĩa chỉ mùa hè” để câu hoàn chỉnh và tránh mơ hồ.
