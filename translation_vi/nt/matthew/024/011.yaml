id: MAT.24.11
reference: Matthew 24:11
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ πολλοὶ ψευδοπροφῆται ἐγερθήσονται καὶ πλανήσουσιν πολλούς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/011.yaml
  text: And many false prophets will arise and will lead many astray[a][b].
translation:
  language: vi
  text: Và nhiều tiên tri giả sẽ nổi lên và dẫn nhiều người đi lạc[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hoặc “sẽ lừa dối nhiều người.”
    reason: lexical_alternative
  - marker: b
    text: Hoặc “sẽ được dấy lên.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὶ
  choice: nhiều
  rationale: Tính từ chỉ số lượng thông dụng; “nhiều” tương ứng trực tiếp và tự nhiên trong tiếng Việt.
- source_word: ψευδοπροφῆται
  choice: tiên tri giả
  rationale: Chỉ những người tự nhận hoặc được xem là tiên tri nhưng giả dối; cách dịch này chính xác, dễ hiểu và giữ âm hưởng Kinh Thánh quen thuộc.
- source_word: ἐγερθήσονται
  choice: sẽ nổi lên
  rationale: Dạng tương lai bị động có thể mang nghĩa “được dấy lên” hoặc theo lối diễn đạt là “nổi lên/xuất hiện.” Trong ngữ cảnh các nhân vật lừa dối xuất hiện, “sẽ nổi lên” tự nhiên và không gợi nhầm đến sự sống lại.
- source_word: πλανήσουσιν
  choice: sẽ dẫn ... đi lạc
  rationale: Giữ hình ảnh khiến người khác đi chệch đường trong động từ Hy Lạp, đồng thời bao quát ý đánh lừa hoặc làm lạc hướng mà không giới hạn vào một loại sai lạc cụ thể.
- source_word: πολλούς
  choice: nhiều người
  rationale: Bổ túc từ chỉ người của động từ; thêm “người” để câu tiếng Việt rõ và tự nhiên.
- source_word: καὶ ... καὶ
  choice: Và ... và
  rationale: Giữ phép phối hợp đơn giản và tính cộng dồn của hai hành động trong nguyên văn.
theological_decisions:
- issue: Bản chất của sự sai lạc do πλανήσουσιν diễn tả
  choice: Câu này cảnh báo rằng các tiên tri giả sẽ dẫn nhiều người đi lạc, nhưng không xác định phương thức hay phạm vi cụ thể của sự lừa dối ấy.
  alternative: Hiểu sự lừa dối chủ yếu là về giáo lý, đạo đức hoặc các sự kiện thời cuối cùng.
  rationale: Động từ πλανάω có phạm vi nghĩa rộng, có thể bao gồm việc làm sai lạc về giáo lý, đạo đức hoặc tâm linh; bản dịch không thu hẹp ý nghĩa vào một phạm trù thần học riêng.
- issue: Sắc thái bị động của ἐγερθήσονται
  choice: Dịch trong câu chính là “sẽ nổi lên,” đồng thời ghi chú khả năng “sẽ được dấy lên.”
  alternative: Chỉ dịch “sẽ được dấy lên,” có thể khiến người đọc suy diễn một tác nhân thần học không được nêu rõ trong câu.
  rationale: Nguyên văn dùng thể bị động nhưng không nêu tác nhân. Câu chính ưu tiên lối nói tự nhiên trong tiếng Việt, còn chú thích bảo tồn sắc thái hình thức và sự mơ hồ của nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Tiên tri giả” giữ thuật ngữ Kinh Thánh phổ biến; “dẫn ... đi lạc” vừa tự nhiên vừa bảo tồn hình ảnh trong nguyên ngữ. Các dấu chú thích [a], [b] được đặt ngay sau mệnh đề mà cả hai chú thích liên quan.
