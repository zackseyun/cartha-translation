- from: Vì thời Nô-ê thế nào, thì sự quang lâm[a] của Con Người cũng sẽ như vậy.
  to: Vì thời Nô-ê thế nào, thì sự đến[a] của Con Người cũng sẽ như vậy.
  rationale: Bản sửa duy trì trọn vẹn phép so sánh tỉnh lược của tiếng Hy Lạp và liên từ «Vì», nhưng thay thuật ngữ «quang lâm» bằng «sự đến» để phản ánh παρουσία trực tiếp, hiện đại, và ít diễn giải hơn. Chú thích vẫn giữ khả năng nghĩa «sự hiện diện» và giải thích ngắn gọn giá trị ngữ cảnh.
