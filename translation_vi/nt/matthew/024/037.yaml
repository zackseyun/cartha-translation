source:
  edition: SBLGNT
  text: ὥσπερ ⸀γὰρ αἱ ἡμέραι τοῦ Νῶε, οὕτως ⸀ἔσται ἡ παρουσία τοῦ υἱοῦ τοῦ ἀνθρώπου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/037.yaml
  text: For just as the days of Noah were[a], so the coming of the Son of Man will be.
translation:
  language: vi
  text: Vì thời Nô-ê thế nào, thì sự đến[a] của Con Người cũng sẽ như vậy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “sự hiện diện”. Từ Hy Lạp có thể chỉ sự hiện diện hoặc sự đến; trong ngữ cảnh này, từ này chỉ sự đến trong tương lai của Con Người.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥσπερ ... οὕτως
  choice: thế nào, thì ... cũng sẽ như vậy
  rationale: Giữ cấu trúc so sánh tương liên của tiếng Hy Lạp bằng một cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: γὰρ
  choice: Vì
  rationale: Giữ liên từ giải thích nối câu này với lời nói ngay trước đó.
- source_word: αἱ ἡμέραι τοῦ Νῶε
  choice: thời Nô-ê
  rationale: “Thời Nô-ê” là cách nói tiếng Việt tự nhiên cho thành ngữ chỉ những ngày thuộc thời đại của Nô-ê; vị ngữ được hiểu theo cấu trúc tỉnh lược của nguyên văn.
- source_word: Νῶε
  choice: Nô-ê
  rationale: Dùng dạng tên riêng đã quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
- source_word: ἔσται
  choice: sẽ
  rationale: Diễn đạt thì tương lai của động từ εἰμί trong cấu trúc so sánh tiếng Việt mà không thêm ý “xảy ra” vốn không có rõ trong nguyên văn.
- source_word: παρουσία
  choice: sự quang lâm
  rationale: Trong ngữ cảnh cánh chung, từ này nói đến việc Con Người đến và hiện diện. “Sự quang lâm” là thuật ngữ trang trọng, quen thuộc trong tiếng Việt, còn phạm vi nghĩa “sự hiện diện/đến” được ghi ở chú thích.
- source_word: τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: của Con Người
  rationale: Giữ danh hiệu truyền thống và âm hưởng liên văn bản của cách tự xưng này.
theological_decisions:
- issue: Cách dịch παρουσία trong lời nói cánh chung
  choice: sự quang lâm
  alternative: sự hiện diện; sự đến
  rationale: Ngữ cảnh hướng đến biến cố tương lai của Con Người, nhưng παρουσία có thể chỉ cả sự đến lẫn sự hiện diện. Bản chính dùng thuật ngữ cánh chung quen thuộc, đồng thời chú thích giữ lại độ rộng nghĩa của từ Hy Lạp.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cấu trúc “thế nào, thì ... cũng sẽ như vậy” tái hiện phép so sánh tương liên; “quang lâm” giữ sắc thái cánh chung mà không loại bỏ các khả năng từ vựng khác, vốn được nêu trong chú thích.
