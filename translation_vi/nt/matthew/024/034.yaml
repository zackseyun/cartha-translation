source:
  edition: SBLGNT
  text: ἀμὴν λέγω ὑμῖν ⸀ὅτι οὐ μὴ παρέλθῃ ἡ γενεὰ αὕτη ἕως ἂν πάντα ταῦτα γένηται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/034.yaml
  text: Truly I tell you that this generation will certainly not pass away until all these things happen[a].
translation:
  language: vi
  text: 'Quả thật, tôi nói với anh em: thế hệ này chắc chắn sẽ không qua đi cho đến khi tất cả những điều ấy xảy ra.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “dân này” hoặc “dòng giống này.” Từ Hy Lạp có thể được hiểu theo nghĩa rộng hơn, nhưng “thế hệ” là cách dịch trực tiếp nhất ở đây.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀμὴν
  choice: Quả thật
  rationale: Trong công thức nhấn mạnh ἀμὴν λέγω ὑμῖν, “Quả thật” truyền đạt lời xác quyết trang trọng và tự nhiên hơn cách phiên âm “A-men” trong văn xuôi tiếng Việt.
- source_word: λέγω ὑμῖν
  choice: tôi nói với anh em
  rationale: Giữ ngôi thứ nhất và lời nói trực tiếp với số nhiều. “Anh em” là cách xưng hô số nhiều tự nhiên, trang trọng vừa phải, không thêm quan hệ cha-con hay tước hiệu không có trong nguyên văn.
- source_word: οὐ μὴ παρέλθῃ
  choice: chắc chắn sẽ không qua đi
  rationale: Cụm phủ định οὐ μή với động từ ở thể giả định aorist có sức nhấn mạnh mạnh; “chắc chắn sẽ không” giữ được lực xác quyết, còn “qua đi” phản ánh trực tiếp παρέρχομαι.
- source_word: ἡ γενεὰ αὕτη
  choice: thế hệ này
  rationale: Đây là nghĩa trực tiếp và thông thường nhất của γενεά trong ngữ cảnh. Cách dịch này không tự ý giải quyết tranh luận về đối tượng mà cụm từ chỉ đến.
- source_word: ἕως ἂν
  choice: cho đến khi
  rationale: Diễn đạt rõ giới hạn thời gian hướng đến một biến cố tương lai mà liên từ cùng ἄν đánh dấu.
- source_word: πάντα ταῦτα
  choice: tất cả những điều ấy
  rationale: Giữ rõ dạng số nhiều trung tính và liên hệ hồi chỉ đến chuỗi sự việc vừa được nói đến.
- source_word: γένηται
  choice: xảy ra
  rationale: Trong ngữ cảnh các biến cố, “xảy ra” là cách diễn đạt hiện đại, tự nhiên cho γίνομαι.
theological_decisions:
- issue: Ý nghĩa của ἡ γενεὰ αὕτη trong diễn từ về thời kỳ cuối cùng
  choice: Dịch theo nghĩa từ vựng trực tiếp là “thế hệ này” và để nguyên sức căng giải thích.
  alternative: “dân này” hoặc “dòng giống này”
  rationale: Nguyên văn không tự xác định một hệ thống thời kỳ cuối cùng cụ thể. Đưa một cách giải thích rộng hơn vào chính văn sẽ giải quyết thay cho người đọc một vấn đề vẫn còn tranh luận; vì vậy các khả năng ấy chỉ được nêu trong chú thích.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “Quả thật” cho lời xác quyết long trọng; tránh lối cổ như “các ngươi” và tránh thêm danh xưng hoặc quan hệ không được biểu thị trong tiếng Hy Lạp.
