revisions:
- from: Nhưng hãy cầu nguyện để việc anh em phải chạy trốn không xảy ra vào mùa đông hoặc vào một ngày Sa-bát[a].
  to: Nhưng hãy cầu nguyện để việc chạy trốn của anh em không xảy ra vào mùa đông hoặc vào ngày Sa-bát[a].
  rationale: Bản sửa loại bỏ diễn giải không có trong nguyên văn ở từ “phải,” đồng thời thay cách dùng bất định gượng ép bằng “ngày Sa-bát” tự nhiên trong tiếng Việt. Chú thích giữ lại lựa chọn bất định được nêu trong hồ sơ tiếng Anh mà không biến nó thành sắc thái bắt buộc của bản chính.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T05:43:07Z'
review_pass:
  verdict: revise
  source_fidelity: Cần bỏ “phải” trong “việc anh em phải chạy trốn,” vì φυγή ὑμῶν chỉ nói đến cuộc chạy trốn của họ, không tự nó nêu tính bắt buộc. Cụm “việc chạy trốn của anh em” truyền đạt sát nghĩa hơn. Với σαββάτῳ không mạo từ, tiếng Việt không cần dùng “một” để phản ánh hình thức Hy Lạp; “vào ngày Sa-bát” tự nhiên và vẫn không áp đặt một giải thích thần học.
  naturalness: “Việc chạy trốn của anh em” và “vào ngày Sa-bát” là lối diễn đạt hiện đại, rõ ràng, trang trọng vừa phải. “Một ngày Sa-bát” trong câu chính hơi gượng và dễ khiến người đọc hiểu là bất cứ một ngày riêng lẻ nào, một sắc thái không cần thiết.
  terminology: Giữ “cầu nguyện,” “chạy trốn,” “mùa đông,” và “ngày Sa-bát” là nhất quán, quen thuộc và phù hợp văn cảnh. “Anh em” là đại từ số nhiều thích hợp cho ὑμῶν trong diễn ngôn này.
  issues:
  - severity: medium
    issue: “phải” thêm sắc thái bắt buộc vào ἡ φυγὴ ὑμῶν.
    rationale: Danh từ φυγή nghĩa là sự chạy trốn/cuộc chạy trốn; nguyên văn không có yếu tố tương đương “phải.”
  - severity: low
    issue: “một ngày Sa-bát” là cách phản ánh thiếu mạo từ quá cơ học trong tiếng Việt.
    rationale: Tiếng Việt không vận hành mạo từ như tiếng Hy Lạp; “ngày Sa-bát” là cách tự nhiên hơn và có thể giữ tính khái quát của câu. Chú thích có thể nêu phương án bất định nếu cần lưu vết lựa chọn.
  revised_text: Nhưng hãy cầu nguyện để việc chạy trốn của anh em không xảy ra vào mùa đông hoặc vào ngày Sa-bát[a].
  revised_footnotes:
