  text: προσεύχεσθε δὲ ἵνα μὴ γένηται ἡ φυγὴ ὑμῶν χειμῶνος μηδὲ σαββάτῳ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/020.yaml
  text: But pray that your flight may not happen in winter or on a Sabbath[a].
translation:
  language: vi
  text: Nhưng hãy cầu nguyện để việc chạy trốn của anh em không xảy ra vào mùa đông hoặc vào ngày Sa-bát[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “vào một ngày Sa-bát.”'
    reason: Cụm σαββάτῳ không có mạo từ trong tiếng Hy Lạp; phương án này lưu ý khả năng diễn đạt bất định, dù bản văn chính dùng cách nói tiếng Việt tự nhiên hơn.
lexical_decisions:
- source_word: προσεύχεσθε
  choice: hãy cầu nguyện
  rationale: Động từ mệnh lệnh hiện tại, ngôi thứ hai số nhiều; cách dịch này tự nhiên trong tiếng Việt và không diễn giải quá mức sắc thái tiếp diễn.
- source_word: δὲ
  choice: Nhưng
  rationale: Đánh dấu sự chuyển ý có sắc thái tương phản nhẹ với lời cảnh báo trước đó.
- source_word: ἵνα μὴ γένηται
  choice: để ... không xảy ra
  rationale: ἵνα với động từ giả định diễn tả nội dung hoặc mục đích của lời cầu nguyện; “không xảy ra” phù hợp với nghĩa chỉ sự kiện của γίνομαι.
- source_word: ἡ φυγὴ ὑμῶν
  choice: việc anh em phải chạy trốn
  rationale: φυγή chỉ hành động chạy trốn. Thêm “phải” tạo câu tiếng Việt tự nhiên trong bối cảnh một cuộc chạy trốn bắt buộc, nhưng không hàm ý chắc chắn trốn thoát như “thoát thân”.
- source_word: χειμῶνος
  choice: vào mùa đông
  rationale: Sở hữu cách chỉ thời gian hoặc mùa được diễn đạt tự nhiên trong tiếng Việt bằng “vào mùa đông”.
- source_word: μηδὲ σαββάτῳ
  choice: hoặc vào một ngày Sa-bát
  rationale: μηδέ nối hoàn cảnh phủ định thứ hai. Danh từ σαββάτῳ không có mạo từ; “một ngày Sa-bát” giữ được tính bất định về hình thức mà vẫn rõ nghĩa trong tiếng Việt.
theological_decisions:
- issue: Dịch σαββάτῳ theo cách bất định hay xác định
  choice: vào một ngày Sa-bát
  alternative: vào ngày Sa-bát
  rationale: Bản Hy Lạp không có mạo từ. Bản chính phản ánh hình thức này bằng “một ngày Sa-bát”, còn cách dịch quen thuộc và tự nhiên hơn “ngày Sa-bát” được giữ trong chú thích, không áp đặt tính xác định lên nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “anh em” cho đại từ số nhiều ὑμῶν, phù hợp lời Chúa Giê-su nói với các môn đồ; dùng cách viết “Sa-bát” quen thuộc trong tiếng Việt.
