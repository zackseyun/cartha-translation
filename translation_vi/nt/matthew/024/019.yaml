source:
  edition: SBLGNT
  text: οὐαὶ δὲ ταῖς ἐν γαστρὶ ἐχούσαις καὶ ταῖς θηλαζούσαις ἐν ἐκείναις ταῖς ἡμέραις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/019.yaml
  text: But woe to those who are pregnant and to those who are nursing infants in those days[a].
translation:
  language: vi
  text: Nhưng khốn cho những người đang mang thai và những người đang cho con bú trong những ngày ấy.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “những phụ nữ mang thai và những phụ nữ đang cho con bú.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐαί
  choice: khốn cho
  rationale: Giữ sắc thái cảm thán mang tính tiên tri, vừa than xót vừa báo trước cảnh khốn khó; mạnh hơn cách dịch đơn thuần là “than ôi”.
- source_word: δὲ
  choice: Nhưng
  rationale: Đánh dấu bước chuyển nhẹ từ lời cảnh báo trước đó; “nhưng” tự nhiên trong mạch văn mà không tạo độ tương phản quá mạnh.
- source_word: ταῖς ἐν γαστρὶ ἐχούσαις
  choice: những người đang mang thai
  rationale: Đây là một thành ngữ Hy Lạp có nghĩa là mang thai. Cách dịch này tự nhiên trong tiếng Việt và vẫn phản ánh hình thức giống cái của nguyên văn qua chính tình trạng được nói đến.
- source_word: ταῖς θηλαζούσαις
  choice: những người đang cho con bú
  rationale: θηλάζω chỉ việc cho trẻ bú. “Cho con bú” là cách nói tiếng Việt hiện đại, rõ ràng và tự nhiên, đồng thời làm sáng tỏ đối tượng vốn được ngầm hiểu trong tiếng Hy Lạp.
- source_word: ἐν ἐκείναις ταῖς ἡμέραις
  choice: trong những ngày ấy
  rationale: Chuyển tải trực tiếp cụm từ chỉ thời gian, với văn phong trang trọng và tự nhiên.
theological_decisions:
- issue: Đối tượng của các phân từ và mạo từ số nhiều giống cái
  choice: Dịch là “những người đang mang thai” và “những người đang cho con bú” thay vì thêm danh từ “phụ nữ”.
  alternative: “những phụ nữ mang thai và những phụ nữ đang cho con bú”
  rationale: Các dạng giống cái trong tiếng Hy Lạp rõ ràng chỉ phụ nữ, nhưng tiếng Việt có thể diễn đạt tự nhiên bằng “những người” mà không làm sai lệch giới tính của đối tượng, vì hai tình trạng được nêu đã xác định rõ điều đó. Cách dịch cũng giữ trọng tâm vào hoàn cảnh đặc biệt dễ tổn thương trong những ngày ấy.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. “Khốn cho” duy trì sức nặng cảnh báo và than xót của câu; “cho con bú” tự nhiên hơn cách diễn đạt mang tính kỹ thuật.
