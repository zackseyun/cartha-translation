  text: δύο ἀλήθουσαι ἐν τῷ ⸀μύλῳ, μία παραλαμβάνεται καὶ μία ἀφίεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/041.yaml
  text: Two women will be grinding at the mill[c][b][a]; one is taken and one is left.
translation:
  language: vi
  text: Hai người phụ nữ đang xay bằng cối[a]; một người được đem đi, còn một người bị để lại.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đang xay tại cối xay” hoặc “đang xay với đá xay.” Từ Hy Lạp có thể chỉ cối xay hay đá xay.'
    reason: lexical_alternative
  - marker: b
    text: Nguyên văn chỉ nói “một người được đem đi, còn một người bị để lại,” không xác định tại đây việc được đem đi là để được cứu hay để chịu phán xét.
    reason: alternative_reading
lexical_decisions:
- source_word: δύο ἀλήθουσαι
  choice: Hai người phụ nữ đang xay
  rationale: Phân từ hiện tại chủ động ἀλήθουσαι ở giống cái số nhiều cho biết rõ hai người là phụ nữ. Cách diễn đạt “đang xay” tự nhiên trong tiếng Việt và giữ sắc thái hành động đang diễn ra.
- source_word: ἐν τῷ μύλῳ
  choice: xay cối
  rationale: μύλος có thể chỉ cối xay hoặc bộ phận đá xay. “Xay cối” là cách nói gọn, tự nhiên, không xác định quá mức loại dụng cụ.
- source_word: μία παραλαμβάνεται
  choice: một người được đem đi
  rationale: Dạng bị động của παραλαμβάνω được dịch trực tiếp, không xác định việc được đem đi ở đây là để được cứu hay chịu phán xét.
- source_word: καὶ μία ἀφίεται
  choice: còn một người bị để lại
  rationale: καί nối hai kết quả tương phản trong ngữ cảnh; “còn” diễn đạt tự nhiên sự đối chiếu. Dạng bị động “bị để lại” phản ánh ἀφίεται mà không tăng nghĩa thành “bị bỏ rơi”.
theological_decisions:
- issue: Có nên nói rõ chủ thể là phụ nữ hay không
  choice: Nói rõ “hai người phụ nữ”
  alternative: Hai người đang xay cối
  rationale: Hình thái giống cái số nhiều của ἀλήθουσαι xác định các chủ thể là nữ; bản dịch cần thể hiện dữ kiện này.
- issue: Việc “được đem đi” và “bị để lại” chỉ sự cứu rỗi hay phán xét
  choice: Giữ cách nói trung tính, không giải nghĩa trong chính văn
  alternative: Một người được cứu, còn một người bị phán xét; hoặc một người bị đem đi chịu phán xét, còn một người được chừa lại
  rationale: Chính câu này chỉ mô tả sự phân cách, không nói rõ ý nghĩa thần học của mỗi hành động; vì vậy cần giữ nguyên sự mơ hồ thực sự của nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Hai người phụ nữ” thể hiện chính xác giống cái của phân từ Hy Lạp; “được đem đi / bị để lại” giữ cấu trúc bị động và không áp đặt cách giải thích cánh chung.
