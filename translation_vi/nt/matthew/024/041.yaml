- from: Hai người phụ nữ đang xay cối[a]; một người được đem đi, còn một người bị để lại.[b]
  to: Hai người phụ nữ đang xay bằng cối[a]; một người được đem đi, còn một người bị để lại.[b]
  rationale: Chỉ sửa cụm dụng cụ “xay cối” thành “xay bằng cối” để câu tự nhiên, rõ nghĩa hơn trong tiếng Việt hiện đại. Bản sửa vẫn phản ánh chủ thể là nữ, tính đang diễn tiến của phân từ, và sự mơ hồ có chủ ý về ý nghĩa của “được đem đi” và “bị để lại.” Các ký hiệu chú thích vẫn gắn đúng với cụm từ được chú giải.
