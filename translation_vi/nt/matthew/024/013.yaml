  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὁ δὲ ὑπομείνας εἰς τέλος οὗτος σωθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/013.yaml
  text: But the one who endures to the end will be saved[a][b].
translation:
  language: vi
  text: Nhưng ai bền chí đến cùng thì người ấy sẽ được cứu[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “cho đến cuối cùng.”
    reason: lexical_alternative
  - marker: b
    text: Hay “sẽ được giải cứu.” Từ Hy Lạp có thể chỉ sự giải cứu hoặc sự cứu rỗi; cách dịch rộng hơn được giữ trong câu chính vì văn cảnh không đòi hỏi phải thu hẹp ý nghĩa.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ ... ὑπομείνας
  choice: ai bền chí
  rationale: Mạo từ đi với phân từ aorist được dùng như danh từ, chỉ bất cứ người nào có đặc điểm là kiên trì chịu đựng. Cách diễn đạt “ai bền chí” tự nhiên trong tiếng Việt, không xác định giới tính và không biến aorist thành một hành động nhất thiết đã hoàn tất trong quá khứ.
- source_word: δὲ
  choice: Nhưng
  rationale: δέ tạo nét tương phản nhẹ với những lời cảnh báo ngay trước đó; “Nhưng” thể hiện rõ quan hệ này.
- source_word: ὑπομείνας (ὑπομένω)
  choice: bền chí
  rationale: Động từ diễn tả việc đứng vững, kiên trì hoặc chịu đựng giữa thử thách. “Bền chí” ngắn gọn, dễ hiểu, đồng thời diễn đạt sự kiên trì mà không dùng thuật ngữ thần học chuyên biệt.
- source_word: εἰς τέλος
  choice: đến cùng
  rationale: Cụm giới từ chỉ sự tiếp tục tới điểm cuối. “Đến cùng” là cách nói tự nhiên và cô đọng; “cho đến cuối cùng” cũng có thể dùng.
- source_word: οὗτος
  choice: thì người ấy
  rationale: Đại từ này có tính nhấn mạnh và nhắc lại chủ thể sau cụm phân từ. Cấu trúc tương liên “ai… thì người ấy…” vừa tự nhiên trong tiếng Việt vừa giữ được sắc thái nhấn mạnh của tiếng Hy Lạp.
- source_word: σωθήσεται
  choice: sẽ được cứu
  rationale: Thể tương lai bị động của σῴζω có thể chỉ sự cứu rỗi hoặc giải cứu. “Sẽ được cứu” giữ phạm vi ý nghĩa rộng hơn và không giới hạn câu vào sự thoát nạn tạm thời.
theological_decisions:
- issue: Ý nghĩa của σωθήσεται trong bối cảnh kiên trì thời kỳ cuối cùng
  choice: Giữ cách diễn đạt rộng “sẽ được cứu”, không xác định đó chỉ là sự cứu rỗi chung cuộc, sự giải cứu khỏi hoạn nạn, hay bao gồm cả hai.
  alternative: “sẽ được giải cứu” hoặc cách diễn giải rõ là “sẽ nhận được sự cứu rỗi chung cuộc”
  rationale: Bản thân câu này không xác định dứt khoát phạm vi của sự cứu. Cách dịch được chọn bảo toàn độ căng và tính mở về thần học, không áp đặt một kết luận hệ phái về sự kiên trì hoặc bản chất chính xác của sự cứu.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Cấu trúc “ai… thì người ấy…” giữ chủ thể đại diện, không phân biệt giới tính, đồng thời chuyển tải sự nhấn mạnh của οὗτος mà không gây cảm giác dịch sát cứng nhắc.
