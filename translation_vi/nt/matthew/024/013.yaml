  source_fidelity: 'Bản dịch chuyển tải đúng cấu trúc và ý nghĩa câu Hy Lạp: δέ là nét đối lập nhẹ (“Nhưng”); phân từ thực thể hóa ὁ ... ὑπομείνας được diễn đạt bao quát, không phân biệt giới tính (“ai bền chí”); εἰς τέλος là sự tiếp tục đến điểm cuối (“đến cùng”); οὗτος được giữ sắc thái nhấn mạnh qua cấu trúc “ai… thì người ấy…”; và σωθήσεται là tương lai bị động (“sẽ được cứu”).'
