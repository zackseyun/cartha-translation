- source_word: ἰδοὺ
  choice: Này
  rationale: Tiểu từ thu hút sự chú ý, tự nhiên và trang trọng trong lời cảnh báo; tránh sắc thái thị giác quá cụ thể của “hãy nhìn”.
- source_word: προείρηκα
  choice: đã báo trước
  rationale: Thể hoàn thành của προλέγω chỉ hành động nói trước với giá trị còn hiệu lực; trong ngữ cảnh cảnh báo, “báo trước” diễn đạt tự nhiên hơn “nói trước”.
- source_word: ὑμῖν
  choice: cho các anh em
  rationale: Đại từ số nhiều chỉ các môn đồ; “các anh em” truyền đạt số nhiều và phù hợp với cách Đức Giê-su trực tiếp nói với nhóm môn đồ.
