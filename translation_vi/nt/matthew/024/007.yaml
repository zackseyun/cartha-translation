id: MAT.24.7
reference: Matthew 24:7
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐγερθήσεται γὰρ ἔθνος ἐπὶ ἔθνος καὶ βασιλεία ἐπὶ βασιλείαν, καὶ ἔσονται ⸀λιμοὶ καὶ σεισμοὶ κατὰ τόπους·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/007.yaml
  text: For nation will rise against nation[a], and kingdom against kingdom[b], and there will be famines and earthquakes in various places.
translation:
  language: vi
  text: Vì dân tộc này sẽ nổi dậy chống lại dân tộc kia[a], vương quốc này chống lại vương quốc kia; và sẽ có những nạn đói cùng những trận động đất ở nơi này nơi khác.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “sẽ đứng lên chống lại dân tộc kia.” Thành ngữ Hy Lạp diễn tả sự bùng phát thù địch giữa các dân tộc.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “ở nhiều nơi” hoặc “từ nơi này đến nơi khác.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγερθήσεται
  choice: sẽ nổi dậy
  rationale: Trong kết cấu với ἐπί, động từ diễn tả việc đứng lên đối địch hoặc bùng phát xung đột. “Sẽ nổi dậy” tự nhiên trong tiếng Việt và không biến dạng bị động thành hàm ý rằng Đức Chúa Trời trực tiếp khiến việc ấy xảy ra.
- source_word: γὰρ
  choice: Vì
  rationale: Giữ chức năng giải thích và liên kết câu này với lời phán ngay trước đó.
- source_word: ἔθνος ἐπὶ ἔθνος
  choice: dân tộc này … chống lại dân tộc kia
  rationale: ἔθνος ở đây chỉ các cộng đồng dân tộc-chính trị, song song với “vương quốc”; ἐπί với đối cách mang nghĩa thù địch là “chống lại”. Cặp “này … kia” làm thành ngữ Hy Lạp tự nhiên trong tiếng Việt mà không giới hạn vào hai dân tộc cụ thể.
- source_word: βασιλεία ἐπὶ βασιλείαν
  choice: vương quốc này chống lại vương quốc kia
  rationale: Trong phép song song này, βασιλεία chỉ một lãnh thổ hoặc chính thể do vua cai trị; “vương quốc” giữ sắc thái chính trị và khải huyền của câu.
- source_word: λιμοὶ
  choice: những nạn đói
  rationale: Danh từ số nhiều nói đến các lần thiếu lương thực trầm trọng; “nạn đói” là cách diễn đạt rõ ràng và thông dụng.
- source_word: σεισμοὶ
  choice: những trận động đất
  rationale: Trong ngữ cảnh này σεισμός chỉ động đất; danh từ loại “trận” giúp thể hiện số nhiều một cách tự nhiên.
- source_word: κατὰ τόπους
  choice: ở nơi này nơi khác
  rationale: Cụm từ có nghĩa phân bố, cho biết các biến cố xảy ra tại nhiều địa điểm chứ không phải một nơi xác định.
theological_decisions:
- issue: Phạm vi nghĩa của ἔθνος trong lời nói về xung đột thời sau cùng
  choice: dân tộc
  alternative: quốc gia; dân
  rationale: “Dân tộc” vừa giữ được yếu tố cộng đồng người vừa phù hợp với phép song song cùng “vương quốc”, không thu hẹp nghĩa thành dân ngoại hay áp đặt khái niệm quốc gia-dân tộc hiện đại.
- issue: Sắc thái của dạng tương lai ἐγερθήσεται
  choice: sẽ nổi dậy chống lại
  alternative: sẽ bị dấy lên chống lại; sẽ đứng lên chống lại
  rationale: Ngữ cảnh diễn tả sự bùng phát thù địch. Bản dịch không biến hình thái thụ động/trung gian thành một khẳng định thần học về tác nhân gây ra xung đột.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cấu trúc “này … kia” chuyển phép lặp Hy Lạp sang cách nói tự nhiên trong tiếng Việt; dấu chấm phẩy phân tách hai vế tai họa nhưng vẫn giữ mạch liên kết của câu.
