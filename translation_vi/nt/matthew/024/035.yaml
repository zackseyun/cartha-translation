id: MAT.24.35
reference: Matthew 24:35
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὁ οὐρανὸς καὶ ἡ γῆ ⸀παρελεύσεται, οἱ δὲ λόγοι μου οὐ μὴ παρέλθωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/035.yaml
  text: Heaven and earth will pass away[a], but my words will certainly not pass away.
translation:
  language: vi
  text: Trời đất sẽ qua đi, nhưng những lời của tôi chắc chắn sẽ không qua đi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “sẽ không bao giờ qua đi.” Tiếng Hy Lạp dùng cách phủ định nhấn mạnh (οὐ μή).'
    reason: Nêu cách diễn đạt tương đương cho cấu trúc phủ định nhấn mạnh trong nguyên văn.
lexical_decisions:
- source_word: ὁ οὐρανὸς καὶ ἡ γῆ
  choice: trời đất
  rationale: Cụm cố định tự nhiên trong tiếng Việt diễn tả toàn bộ trật tự thụ tạo; ở đây οὐρανός và γῆ có phạm vi vũ trụ, không chỉ là bầu trời và một vùng đất cụ thể.
- source_word: παρελεύσεται
  choice: sẽ qua đi
  rationale: Diễn đạt tự nhiên ý trật tự hiện tại sẽ chấm dứt, đồng thời giữ sắc thái trang trọng và không giải thích thêm cách thức nó chấm dứt.
- source_word: δὲ
  choice: nhưng
  rationale: Thể hiện rõ sự tương phản giữa sự qua đi của trời đất và tính bền vững của những lời Chúa Giê-su.
- source_word: οἱ λόγοι μου
  choice: những lời của tôi
  rationale: Giữ dạng số nhiều và phạm vi rộng của λόγοι, chỉ những điều Chúa Giê-su đã phán, mà không thu hẹp thành một số câu nói hay giáo huấn cụ thể.
- source_word: οὐ μὴ παρέλθωσιν
  choice: chắc chắn sẽ không qua đi
  rationale: Cụm οὐ μή với động từ ở lối bàng thái là cách phủ định nhấn mạnh; “chắc chắn sẽ không” truyền đạt rõ sức nhấn mạnh ấy bằng tiếng Việt hiện đại.
theological_decisions:
- issue: Sức nặng trong lời khẳng định của Chúa Giê-su về tính trường tồn của lời Ngài
  choice: Dịch thành lời phủ định được nhấn mạnh, đối lập trực tiếp với việc trời đất sẽ qua đi.
  alternative: Diễn giải thêm rằng lời Chúa Giê-su có thẩm quyền thần linh hoặc tồn tại đời đời.
  rationale: Nguyên văn khẳng định mạnh mẽ rằng những lời của Chúa Giê-su sẽ không qua đi, nhưng không trình bày tường minh các kết luận tín lý rộng hơn; bản dịch giữ nguyên sức nặng thần học mà không thêm lời giải thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Trời đất” là cách nói tự nhiên trong tiếng Việt; “qua đi” được lặp lại để bảo toàn phép đối xứng và sự tương phản của nguyên văn.
