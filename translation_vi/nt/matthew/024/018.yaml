  text: καὶ ὁ ἐν τῷ ἀγρῷ μὴ ἐπιστρεψάτω ὀπίσω ἆραι ⸂τὸ ἱμάτιον⸃ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/018.yaml
  text: And let the one in the field not turn back to take his cloak[a].
translation:
  language: vi
  text: Còn người đang ở ngoài đồng thì đừng quay lại lấy áo choàng của mình[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “áo” hoặc “áo mặc ngoài.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἐν τῷ ἀγρῷ
  choice: người đang ở ngoài đồng
  rationale: Cụm có mạo từ được dùng như danh từ, chỉ một người ở ngoài đồng. Cách dịch này giữ nét số ít mang tính đại diện và không thu hẹp đối tượng thành nam giới.
- source_word: μὴ ἐπιστρεψάτω ὀπίσω
  choice: đừng quay lại
  rationale: Mệnh lệnh aorist với μή diễn tả lời cấm đoán khẩn cấp; ὀπίσω kết hợp với ἐπιστρεψάτω mang nghĩa quay trở lại, không đơn thuần là ở phía sau.
- source_word: ἆραι
  choice: lấy
  rationale: Động từ nguyên mẫu aorist chỉ mục đích của việc quay lại. “Lấy” là cách diễn đạt trực tiếp, tự nhiên trong tiếng Việt.
- source_word: τὸ ἱμάτιον αὐτοῦ
  choice: áo choàng của mình
  rationale: ἱμάτιον thường chỉ áo mặc ngoài hoặc áo choàng. “Của mình” quy chiếu tự nhiên về chủ thể của câu trong tiếng Việt.
theological_decisions:
- issue: Giới tính trong mạo từ giống đực được dùng như danh từ
  choice: người đang ở ngoài đồng
  alternative: người đàn ông đang ở ngoài đồng
  rationale: Dạng giống đực ở đây có chức năng đại diện chung trong lời cảnh báo. Dịch là “người” tránh giới hạn đối tượng vào nam giới mà vẫn giữ trọng tâm ở một cá nhân.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Còn… thì đừng” nối tự nhiên với lời cảnh báo song song ở câu trước, đồng thời giữ sắc thái mệnh lệnh khẩn cấp của nguyên văn.
