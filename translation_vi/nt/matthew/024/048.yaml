source:
  edition: SBLGNT
  text: ἐὰν δὲ εἴπῃ ὁ κακὸς δοῦλος ἐκεῖνος ἐν τῇ καρδίᾳ αὐτοῦ· Χρονίζει ⸂μου ὁ κύριος⸃,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/048.yaml
  text: But if that wicked servant says in his heart[b][a], ‘My master is delaying,’
translation:
  language: vi
  text: 'Nhưng nếu người đầy tớ gian ác ấy tự nhủ: “Chủ ta đang chậm trễ,”[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “người nô lệ gian ác ấy.” Từ Hy Lạp doulos có thể chỉ “đầy tớ” hoặc “nô lệ,” tùy ngữ cảnh.
    reason: lexical_alternative
  - marker: b
    text: Hoặc “chúa ta.” Từ Hy Lạp kyrios có thể có nghĩa là “chủ” hoặc “chúa”; trong bối cảnh gia đình của dụ ngôn, từ này chỉ người chủ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν δὲ εἴπῃ
  choice: Nhưng nếu ... tự nhủ
  rationale: ἐὰν với động từ ở thể giả định nêu một tình huống có điều kiện; δέ tạo nét tương phản nhẹ. Cụm ἐν τῇ καρδίᾳ αὐτοῦ cho thấy lời nói diễn ra trong nội tâm, nên “tự nhủ” diễn đạt tự nhiên trong tiếng Việt.
- source_word: ὁ κακὸς δοῦλος ἐκεῖνος
  choice: tên đầy tớ gian ác ấy
  rationale: κακός mang nghĩa xấu xa về đạo đức; “gian ác” hợp với ngữ cảnh cảnh báo. δοῦλος được dịch là “đầy tớ” vì trọng tâm ở vai trò được giao phó trong gia đình, còn ἐκεῖνος được giữ bằng “ấy”.
- source_word: Χρονίζει
  choice: còn lâu mới về
  rationale: Trong ngữ cảnh người chủ vắng mặt và được mong đợi trở về, χρονίζει diễn tả việc kéo dài thời gian/chậm trở lại. “Còn lâu mới về” là lời tự nhủ tự nhiên, đồng thời thể hiện nhận định chủ quan của đầy tớ; nghĩa sát hơn được ghi ở chú thích.
- source_word: μου ὁ κύριος
  choice: Chủ ta
  rationale: κύριος ở tầng nghĩa trực tiếp của dụ ngôn chỉ người chủ trong gia đình. “Chủ ta” giữ quan hệ sở thuộc của μου và tránh áp đặt danh xưng thần học vào lời thoại ở tầng câu chuyện.
theological_decisions:
- issue: Cách dịch κύριος trong bối cảnh dụ ngôn về gia đình
  choice: Chủ
  alternative: Chúa
  rationale: Ở tầng câu chuyện, κύριος là người chủ của δοῦλος. Dịch “Chủ” phản ánh quan hệ trực tiếp trong dụ ngôn, trong khi vẫn để người đọc tự nhận ra ý nghĩa quy chiếu rộng hơn trong diễn ngôn.
- issue: Cách dịch δοῦλος
  choice: đầy tớ
  alternative: nô lệ
  rationale: Cả hai nghĩa đều có cơ sở từ vựng. Ở đây, vai trò và trách nhiệm trong nhà nổi bật hơn địa vị pháp lý, nên “đầy tớ” phù hợp hơn; phương án “nô lệ” được bảo lưu trong chú thích.
- issue: Sắc thái của Χρονίζει
  choice: còn lâu mới về
  alternative: đang trì hoãn
  rationale: Ngữ cảnh hướng đến sự trở về của chủ, nhưng động từ nguyên văn chỉ sự chậm trễ/kéo dài thời gian. Bản dịch chính diễn đạt tự nhiên theo ngữ cảnh, còn chú thích giữ nghĩa hình thức để không che mất độ mở của nguyên văn.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. “Tự nhủ” chuyển tải thành ngữ chỉ suy nghĩ trong lòng; “còn lâu mới về” tạo giọng lời nói nội tâm tự nhiên. Các dấu chú thích [a], [b] đều xuất hiện trong câu chính.
