  - severity: low
    issue: Câu hỏi “đâu là dấu hiệu về” hơi thiếu tự nhiên.
    rationale: τί τὸ σημεῖον được tiếng Việt hiện đại diễn đạt trôi chảy hơn là “dấu hiệu nào về...”, vẫn giữ một dấu hiệu số ít liên hệ với cả παρουσία và sự kết thúc thời đại.
  - severity: low
