id: MAT.24.3
reference: Matthew 24:3
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Καθημένου δὲ αὐτοῦ ἐπὶ τοῦ Ὄρους τῶν Ἐλαιῶν προσῆλθον αὐτῷ οἱ μαθηταὶ κατ’ ἰδίαν λέγοντες· Εἰπὸν ἡμῖν πότε ταῦτα ἔσται, καὶ τί τὸ σημεῖον τῆς σῆς παρουσίας ⸀καὶ συντελείας τοῦ αἰῶνος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/003.yaml
  text: As he was sitting on the Mount of Olives[a], the disciples came to him privately, saying, “Tell us, when will these things be[b], and what will be the sign of your coming and of the end of the age?”
translation:
  language: vi
  text: 'Khi Ngài đang ngồi trên Núi Ô-liu, các môn đồ đến riêng với Ngài và thưa: “Xin cho chúng con biết, khi nào những điều ấy sẽ xảy ra, và dấu hiệu nào về sự Ngài đến[a] và sự kết thúc của thời đại[b]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “sự hiện diện” hoặc “sự xuất hiện”.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “sự hoàn tất của thời đại”; theo cách dịch truyền thống là “tận thế”.
    reason: alternative_reading
lexical_decisions:
- source_word: Καθημένου δὲ αὐτοῦ
  choice: Khi Ngài đang ngồi
  rationale: Kết cấu sở hữu cách độc lập diễn tả hoàn cảnh thời gian; “đang ngồi” giữ được sắc thái tiếp diễn của phân từ hiện tại mà vẫn tự nhiên trong tiếng Việt.
- source_word: ἐπὶ τοῦ Ὄρους τῶν Ἐλαιῶν
  choice: trên núi Ô-liu
  rationale: Dùng địa danh quen thuộc trong tiếng Việt, đồng thời phản ánh nghĩa của cụm Hy Lạp chỉ Núi Ô-liu.
- source_word: προσῆλθον αὐτῷ
  choice: đến gặp Ngài
  rationale: Diễn đạt tự nhiên hành động các môn đồ tiến đến chỗ Đức Chúa Jêsus; “gặp” ở đây không hàm ý cuộc gặp tình cờ.
- source_word: κατ’ ἰδίαν
  choice: riêng
  rationale: Phản ánh việc họ đến với Ngài tách khỏi những người khác; cách nói ngắn gọn và tự nhiên.
- source_word: λέγοντες· Εἰπὸν ἡμῖν
  choice: 'thưa: “Xin cho chúng con biết'
  rationale: “Thưa” phù hợp quan hệ giữa các môn đồ với Đức Chúa Jêsus; “xin cho chúng con biết” chuyển mệnh lệnh thành lời thỉnh cầu tự nhiên, không làm thay đổi nội dung.
- source_word: πότε ταῦτα ἔσται
  choice: khi nào những điều ấy sẽ xảy ra
  rationale: Trong ngữ cảnh nói về các biến cố tương lai, “sẽ xảy ra” tự nhiên hơn cách dịch sát chữ “sẽ có”, đồng thời giữ nguyên phạm vi không xác định của “những điều ấy”.
- source_word: σημεῖον
  choice: dấu hiệu
  rationale: Từ tương đương thông dụng, phù hợp với câu hỏi mang tính cánh chung mà không thêm cách giải thích về bản chất của dấu hiệu.
- source_word: παρουσίας
  choice: sự đến
  rationale: παρουσία có thể chỉ sự hiện diện, việc đến hoặc sự xuất hiện. “Sự đến” giữ hướng tương lai trong câu hỏi và tránh thuật ngữ thần học chuyên biệt; các nghĩa gần khác được ghi chú.
- source_word: συντελείας τοῦ αἰῶνος
  choice: sự kết thúc của thời đại
  rationale: συντέλεια nói đến sự hoàn tất hoặc kết thúc, còn αἰών là thời đại chứ không trực tiếp là thế giới vật chất. Cách dịch này giữ đúng phạm vi ngữ nghĩa của nguyên văn.
theological_decisions:
- issue: Cách dịch παρουσία trong lời hỏi về tương lai
  choice: sự đến
  alternative: sự hiện diện; sự xuất hiện
  rationale: Ngữ cảnh hướng đến một biến cố tương lai liên quan đến Đức Chúa Jêsus, nên “sự đến” rõ ràng và tự nhiên. Chú thích giữ lại độ rộng ngữ nghĩa của từ Hy Lạp mà không xác định thêm thời điểm hay cách thức.
- issue: Cách dịch συντελείας τοῦ αἰῶνος
  choice: sự kết thúc của thời đại
  alternative: sự hoàn tất của thời đại; tận thế
  rationale: Nguyên văn nói đến sự kết thúc hoặc hoàn tất của một thời đại, không nói thẳng đến sự hủy diệt thế giới vật chất. Vì vậy không dùng “tận thế” trong chính văn, nhưng ghi nhận cách hiểu truyền thống trong chú thích.
- issue: Mối liên hệ giữa dấu hiệu, sự đến và sự kết thúc
  choice: giữ một “dấu hiệu” liên hệ với cả hai cụm từ
  alternative: diễn đạt như hai dấu hiệu hoặc hai câu hỏi hoàn toàn tách biệt
  rationale: Cú pháp Hy Lạp dùng một danh từ số ít σημεῖον rồi nối παρουσία và συντέλεια bằng καί. Bản dịch giữ cấu trúc này và không quyết định liệu hai sự kiện đồng thời hay chỉ có liên hệ với nhau.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Ngài” và “chúng con” phù hợp với lời môn đồ thưa cùng Đức Chúa Jêsus trong ngữ cảnh. Tránh thuật ngữ chuyên biệt “quang lâm” để người đọc phổ thông hiểu trực tiếp, đồng thời dùng chú thích để bảo tồn các khả năng ngữ nghĩa. Các dấu chú thích [a], [b] đều xuất hiện đúng tại cụm từ liên quan trong chính văn.
