  source_fidelity: 'Bản dịch phản ánh đúng các thành phần chính của câu Hy Lạp: mệnh đề hoàn cảnh đang ngồi, địa danh Núi Ô-liu, việc các môn đồ đến cách riêng, hai câu hỏi, một “dấu hiệu” số ít, παρουσία, và συντέλεια τοῦ αἰῶνος. “Sự đến” và “sự kết thúc của thời đại” là những lựa chọn trung thành với nguyên văn. Bản sửa chỉ làm rõ hơn quan hệ cú pháp của “dấu hiệu” với cả hai cụm theo sau.'
  naturalness: “Đến gặp Ngài riêng” hơi gượng trong tiếng Việt hiện đại; “đến riêng với Ngài” tự nhiên hơn và diễn đạt rõ nghĩa κατ’ ἰδίαν. “Đâu là dấu hiệu về” cũng kém tự nhiên hơn cấu trúc hỏi “dấu hiệu nào về”.
  terminology: Viết hoa “Núi Ô-liu” phù hợp khi dùng như địa danh. Giữ “Ngài”, “môn đồ”, và “chúng con” tạo giọng trang trọng vừa phải, nhất quán với lời môn đồ thưa cùng Chúa Giê-su. Chú thích về παρουσία và συντέλεια τοῦ αἰῶνος giữ các phương án từ vựng mà không áp đặt cách hiểu giáo phái.
