  text: rồi bắt đầu đánh đập những người đồng nô lệ của mình[a], lại ăn uống với những kẻ say rượu[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “những người cùng làm đầy tớ với mình.” Tiếng Hy Lạp sát nghĩa là “những người đồng nô lệ của mình,” nhấn mạnh rằng họ cùng ở dưới quyền một chủ.'
    reason: alternative_reading
  - marker: b
    text: 'Hoặc: “với những người uống đến say.” Phân từ Hy Lạp có thể chỉ những người đang uống rượu đến say hoặc những người có thói quen say rượu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄρξηται τύπτειν
  choice: bắt đầu đánh đập
  rationale: Cấu trúc ἄρξηται với động từ nguyên mẫu diễn tả sự khởi đầu của hành động; “đánh đập” truyền đạt tự nhiên sắc thái bạo hành có thể lặp lại của τύπτειν.
- source_word: τοὺς συνδούλους αὐτοῦ
  choice: những người cùng làm nô lệ với mình
  rationale: σύνδουλος chỉ người cùng thân phận nô lệ dưới một chủ. Cách dịch này giữ được thực trạng xã hội ấy, đồng thời “với mình” quy chiếu tự nhiên về tên đầy tớ trong ngữ cảnh.
- source_word: ἐσθίῃ δὲ καὶ πίνῃ
  choice: lại ăn uống
  rationale: Hai động từ hiện tại mô tả hành vi tiếp diễn hoặc đặc trưng. “Ăn uống” là cặp từ tự nhiên trong tiếng Việt; “lại” thể hiện liên kết bổ sung nhẹ của δέ.
- source_word: μετὰ τῶν μεθυόντων
  choice: với những kẻ say sưa
  rationale: Phân từ hiện tại μεθυόντων có thể chỉ những người đang uống đến say hoặc có đặc tính say sưa. “Những kẻ say sưa” tự nhiên, trang trọng vừa phải và không thu hẹp nghĩa vào một trạng thái nhất thời.
theological_decisions:
- issue: Cách dịch từ thuộc nhóm δοῦλος trong συνδούλους
  choice: những người cùng làm nô lệ với mình
  alternative: những bạn đồng đầy tớ của mình
  rationale: Bối cảnh dụ ngôn nhấn mạnh việc họ cùng ở dưới quyền một ông chủ; giữ “nô lệ” phản ánh rõ hơn địa vị lệ thuộc trong nguyên văn, còn chú thích cung cấp cách diễn đạt truyền thống và nhẹ hơn.
- issue: Sắc thái của μεθυόντων
  choice: những kẻ say sưa
  alternative: những người uống đến say
  rationale: Phân từ Hy Lạp không buộc phải được hiểu chỉ là trạng thái đang say hay chỉ là nhãn chỉ thói quen. Bản dịch chính giữ độ mở đó, còn chú thích nêu cách dịch theo hành động.
translation_notes:
  register: Tiếng Việt hiện đại, trang nghiêm nhưng dễ hiểu. Câu được giữ như một vế tiếp nối câu trước; dùng “đánh đập” để thể hiện sức nặng đạo đức của hành vi và dùng chú thích để bảo tồn các sắc thái từ vựng thực sự.
