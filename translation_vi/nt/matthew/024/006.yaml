id: MAT.24.6
reference: Matthew 24:6
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: μελλήσετε δὲ ἀκούειν πολέμους καὶ ἀκοὰς πολέμων· ὁρᾶτε, μὴ θροεῖσθε· δεῖ ⸀γὰρ γενέσθαι, ἀλλ’ οὔπω ἐστὶν τὸ τέλος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/006.yaml
  text: And you are going to hear of wars and reports of wars. See that you are not alarmed[a], for it must happen, but the end is not yet.
translation:
  language: vi
  text: Anh em sẽ nghe nói về chiến tranh và tin tức về chiến tranh[a]. Hãy coi chừng, đừng hoảng hốt, vì những điều ấy phải xảy ra, nhưng chưa phải là tận cùng.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “những lời đồn về chiến tranh”. Từ Hy Lạp có thể chỉ tin tức, lời tường thuật hoặc lời đồn.
    reason: lexical_alternative
lexical_decisions:
- source_word: μελλήσετε δὲ ἀκούειν
  choice: Anh em sẽ nghe nói
  rationale: Thì tương lai của μέλλω kết hợp với động từ nguyên mẫu diễn tả điều được dự liệu sẽ xảy đến. “Sẽ nghe nói” tự nhiên trong tiếng Việt và cho thấy đây là tin được nghe biết, không nhất thiết là âm thanh chiến trận nghe trực tiếp.
- source_word: πολέμους
  choice: chiến tranh
  rationale: πόλεμος thường chỉ chiến tranh, không chỉ một trận đánh riêng lẻ. Tiếng Việt có thể dùng danh từ không biến đổi hình thức để chỉ số nhiều theo ngữ cảnh.
- source_word: ἀκοὰς πολέμων
  choice: tin tức về chiến tranh
  rationale: ἀκοή ở đây có thể chỉ điều được nghe, tin tức hoặc lời đồn. “Tin tức” không mặc nhiên hàm ý thông tin sai như “tin đồn”, nên giữ được phạm vi nghĩa rộng hơn.
- source_word: ὁρᾶτε
  choice: Hãy coi chừng
  rationale: Mệnh lệnh này mở đầu lời cảnh báo, mang nghĩa hãy lưu ý hoặc cẩn trọng; “hãy coi chừng” vừa gần sắc thái cảnh giới vừa tự nhiên.
- source_word: μὴ θροεῖσθε
  choice: đừng hoảng hốt
  rationale: θροέομαι chỉ trạng thái bị khuấy động, kinh hoảng hoặc mất bình tĩnh. “Đừng hoảng hốt” truyền đạt sắc thái ấy mà không cường điệu thành khiếp đảm cực độ.
- source_word: δεῖ γὰρ γενέσθαι
  choice: vì những điều ấy phải xảy ra
  rationale: δεῖ diễn tả sự cần thiết, còn γενέσθαι là xảy ra. Nguyên văn dùng kết cấu vô nhân xưng; “những điều ấy” được bổ sung từ ngữ cảnh để câu tiếng Việt rõ và tự nhiên, không quy định thêm nguyên nhân của sự cần thiết này.
- source_word: ἀλλ’ οὔπω ἐστὶν τὸ τέλος
  choice: nhưng chưa phải là tận cùng
  rationale: “Tận cùng” giữ cách nói rộng của τέλος và tránh thu hẹp câu vào một sơ đồ cánh chung cụ thể.
theological_decisions:
- issue: Phạm vi cánh chung của τὸ τέλος
  choice: tận cùng
  alternative: tận thế; sự hoàn tất cuối cùng
  rationale: “Tận cùng” giữ nguyên tính khái quát của nguyên văn, không xác định đây là một giai đoạn cụ thể trong bất kỳ hệ thống thiên niên kỷ hay đại nạn nào.
- issue: Tính cần thiết trong δεῖ
  choice: phải xảy ra
  alternative: nhất thiết phải xảy ra
  rationale: Bản dịch giữ ý nghĩa về sự cần thiết nhưng không giải thích nguồn gốc hoặc cơ chế thần học của sự cần thiết ấy, vì câu Hy Lạp không nói rõ.
translation_notes:
  register: Dùng tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. “Anh em” phù hợp với lời Chúa Giê-su nói với nhóm môn đồ; câu văn giữ nhịp cảnh báo ngắn gọn của nguyên bản. Dấu chú thích [a] được đặt ngay sau cụm từ mà chú thích giải nghĩa.
