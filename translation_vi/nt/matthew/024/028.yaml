  text: ⸀ὅπου ἐὰν ᾖ τὸ πτῶμα, ἐκεῖ συναχθήσονται οἱ ἀετοί.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/028.yaml
  text: Wherever the corpse is[a], there the vultures will gather.
translation:
  language: vi
  text: Xác chết ở đâu, kền kền[a] sẽ tụ tập ở đó.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “đại bàng”. Từ Hy Lạp này có thể chỉ đại bàng, nhưng “kền kền” phù hợp hơn với hình ảnh những con chim tụ tập quanh xác chết.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπου ἐὰν ᾖ
  choice: ở đâu ... ở đó
  rationale: Cấu trúc ὅπου với ἐάν và động từ giả định ᾖ mang nghĩa phiếm định. Trong câu tục ngữ này, cặp “ở đâu ... ở đó” là cách diễn đạt tự nhiên trong tiếng Việt và vẫn giữ ý rằng điều này đúng tại bất cứ nơi nào có xác chết.
- source_word: πτῶμα
  choice: xác chết
  rationale: πτῶμα chỉ một thân thể đã chết. “Xác chết” chính xác, dễ hiểu và không tự giới hạn đối tượng là người hay thú như một số cách diễn đạt khác có thể gợi ý.
- source_word: συναχθήσονται
  choice: sẽ tụ tập
  rationale: Dạng tương lai bị động có thể được hiểu theo nghĩa nội động trong ngữ cảnh này. “Sẽ tụ tập” tự nhiên với chủ thể là chim và truyền đạt đúng hình ảnh chúng cùng kéo đến một chỗ.
- source_word: ἀετοί
  choice: kền kền
  rationale: ἀετός thường có thể chỉ đại bàng, nhưng hình ảnh những con chim tụ tập quanh xác chết phù hợp nhất với kền kền. Vì từ Hy Lạp cũng có thể được hiểu là “đại bàng”, cách dịch ấy được giữ trong chú thích.
theological_decisions:
- issue: Ý nghĩa biểu tượng của câu nói
  choice: Dịch trực tiếp hình ảnh xác chết và chim ăn xác mà không xác định chúng tượng trưng cho điều gì.
  alternative: Có thể giải thích đây là hình ảnh về sự phán xét không thể tránh khỏi, tính hiển nhiên khi Con Người đến, sự hủy diệt Giê-ru-sa-lem, hoặc quân kỳ La Mã.
  rationale: Bản văn Hy Lạp không nói rõ xác chết hay các loài chim tượng trưng cho ai hoặc điều gì. Bản dịch vì thế giữ nguyên tính hàm súc và căng thẳng cánh chung của câu nói, không đưa một lối giải nghĩa riêng vào chính văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Cấu trúc “ở đâu ... ở đó” tạo nhịp gọn như một câu tục ngữ. Dấu chú thích [a] được đặt ngay sau toàn câu vì chú thích giải thích danh từ “kền kền” trong câu.
