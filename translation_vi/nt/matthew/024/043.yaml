id: MAT.24.43
reference: Matthew 24:43
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐκεῖνο δὲ γινώσκετε ὅτι εἰ ᾔδει ὁ οἰκοδεσπότης ποίᾳ φυλακῇ ὁ κλέπτης ἔρχεται, ἐγρηγόρησεν ἂν καὶ οὐκ ἂν εἴασεν διορυχθῆναι τὴν οἰκίαν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/043.yaml
  text: 'But know this: if the master of the house had known in what watch the thief was coming[b][a], he would have stayed awake and would not have let his house be broken into.'
translation:
  language: vi
  text: 'Nhưng hãy biết điều này: nếu chủ nhà đã biết kẻ trộm đến vào canh nào trong đêm[a], thì ông đã canh thức và không để nhà mình bị đột nhập[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Canh” là một khoảng thời gian mà ban đêm được chia ra.
    reason: cultural_note
  - marker: b
    text: Nguyên văn là “bị đào xuyên qua,” phản ánh việc kẻ trộm thời xưa có thể đột nhập qua tường hoặc mái nhà.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκεῖνο δὲ γινώσκετε
  choice: Nhưng hãy biết điều này
  rationale: Diễn đạt tự nhiên như một lời nhắc trực tiếp, đồng thời giữ sự chuyển ý của δέ và sắc thái mệnh lệnh của γινώσκετε trong ngữ cảnh.
- source_word: ὁ οἰκοδεσπότης
  choice: chủ nhà
  rationale: Diễn đạt ngắn gọn, tự nhiên vai trò người đứng đầu ngôi nhà/hộ gia đình, mà không nhất thiết hàm ý pháp lý hiện đại về quyền sở hữu.
- source_word: ποίᾳ φυλακῇ
  choice: vào canh nào trong đêm
  rationale: φυλακή chỉ một canh, tức một khoảng thời gian được chia trong ban đêm. Cách dịch này giữ hình ảnh văn hóa mà vẫn rõ nghĩa với độc giả hiện đại.
- source_word: ὁ κλέπτης ἔρχεται
  choice: kẻ trộm sẽ đến
  rationale: Dù ἔρχεται ở thì hiện tại, trong câu điều kiện này nó chỉ thời điểm kẻ trộm đến xét từ góc nhìn của chủ nhà; tiếng Việt tự nhiên dùng “sẽ đến”.
- source_word: ἐγρηγόρησεν ἂν
  choice: hẳn đã thức canh
  rationale: Giữ cả ý thức không ngủ và canh chừng trong γρηγορέω; “hẳn đã” thể hiện kết quả phản thực của câu điều kiện.
- source_word: οὐκ ἂν εἴασεν
  choice: không để
  rationale: Cách diễn đạt hiện đại, trực tiếp, tương ứng tự nhiên với ý không cho phép một việc xảy ra.
- source_word: διορυχθῆναι τὴν οἰκίαν αὐτοῦ
  choice: để nhà mình bị khoét thủng để đột nhập
  rationale: διορύσσω theo nghĩa đen là khoét hoặc đào xuyên qua. Bản dịch vừa giữ hình ảnh cụ thể của nguyên văn vừa làm rõ mục đích đột nhập trong ngữ cảnh.
theological_decisions:
- issue: Cách thể hiện hình ảnh người chủ nhà
  choice: chủ nhà
  alternative: gia chủ; người đứng đầu nhà
  rationale: Đây là hình ảnh minh họa, không phải một danh hiệu thần học. “Chủ nhà” tự nhiên trong tiếng Việt và không buộc câu vào một cách giải thích giáo phái.
- issue: Tính phản thực của câu điều kiện
  choice: nếu… thì… hẳn đã
  alternative: nếu… thì… sẽ
  rationale: 'Động từ quá khứ cùng ἄν cho thấy một tình huống đã không xảy ra: chủ nhà không biết trước. “Hẳn đã” giữ sắc thái phản thực mà không giải thích thêm ý nghĩa thần học của dụ ngôn.'
- issue: Hình ảnh đột nhập qua cách khoét nhà
  choice: bị khoét thủng để đột nhập
  alternative: bị đột nhập
  rationale: Giữ chi tiết cụ thể của διορύσσω trong bản văn chính, đồng thời thêm “để đột nhập” nhằm giúp độc giả hiện đại nhận ra hành động trộm cắp; không áp đặt cách hiểu biểu tượng lên hình ảnh.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Câu giữ nhịp cảnh báo trực tiếp của nguyên văn; các thuật ngữ văn hóa được làm rõ ngắn gọn mà không làm mất hình ảnh cổ.
