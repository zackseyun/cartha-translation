  to: 'Nhưng hãy biết điều này: nếu chủ nhà đã biết kẻ trộm đến vào canh nào trong đêm[a], thì ông đã canh thức và không để nhà mình bị đột nhập[b].'
  rationale: Bản sửa đánh dấu nhất quán điều kiện phản thực bằng “đã biết ... đã canh thức,” đồng thời thay cụm diễn đạt gượng bằng cách nói tự nhiên “bị đột nhập.” Chú thích b bảo lưu nghĩa đen và bối cảnh kiến trúc cổ của διορυχθῆναι, nên không mất chi tiết từ nguyên văn.
  reviewer_model: gpt-5.6-terra
