review_pass:
  verdict: revise
  source_fidelity: 'Cần làm rõ điều kiện phản thực: ᾔδει và mệnh đề kết với ἄν diễn tả “nếu đã biết ... thì đã...”. Bản thảo “nếu ... biết ... sẽ đến ... hẳn đã” làm sắc thái này kém rõ. Cụm διορυχθῆναι có nghĩa đen là bị đào/khoét xuyên qua, nhưng nghĩa ngữ cảnh là bị đột nhập; có thể để nghĩa tự nhiên trong bản văn chính và giữ chi tiết chữ nghĩa trong chú thích.'
  naturalness: “Để nhà mình bị khoét thủng để đột nhập” không tự nhiên vì lặp ý mục đích và khiến cấu trúc câu nặng. “Không để nhà mình bị đột nhập” là tiếng Việt hiện đại rõ ràng, còn nghĩa đen được chú thích.
  terminology: “Chủ nhà,” “canh ... trong đêm,” và “canh thức” phù hợp với văn phong Kinh Thánh tiếng Việt hiện đại. “Đã canh thức” tự nhiên hơn “hẳn đã thức canh” và biểu đạt đúng hệ quả phản thực.
  issues:
  - severity: medium
    issue: Sắc thái phản thực chưa được đánh dấu rõ trong mệnh đề điều kiện.
    rationale: Cấu trúc εἰ ᾔδει ... ἐγρηγόρησεν ἂν ... οὐκ ἂν εἴασεν nói về một điều kiện trái với thực tế trong quá khứ. “Nếu chủ nhà đã biết ... thì ông đã...” phản ánh điều này trực tiếp hơn.
  - severity: medium
    issue: Cụm “bị khoét thủng để đột nhập” thiếu tự nhiên và thừa ý.
    rationale: διορυχθῆναι mô tả việc nhà bị đào/khoét xuyên qua; “để đột nhập” thêm một mệnh đề mục đích không có trong nguyên văn và lặp lại ý của bối cảnh. Nên dùng nghĩa thành ngữ “bị đột nhập” trong bản văn chính, với chú thích nghĩa đen.
