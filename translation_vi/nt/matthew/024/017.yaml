  naturalness: Câu “Người đang ở trên sân thượng thì đừng xuống lấy những thứ trong nhà mình” rõ ràng, tự nhiên trong tiếng Việt hiện đại và giữ sắc thái khẩn thiết vừa phải. Cấu trúc “Người… thì đừng…” phù hợp văn phong Kinh Thánh hiện đại.
