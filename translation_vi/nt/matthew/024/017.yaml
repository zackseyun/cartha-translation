  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὁ ἐπὶ τοῦ δώματος μὴ ⸀καταβάτω ἆραι τὰ ἐκ τῆς οἰκίας αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/017.yaml
  text: Let the one on the housetop not go down to take the things out of his house,[a]
translation:
  language: vi
  text: Người đang ở trên sân thượng thì đừng xuống lấy những thứ trong nhà mình.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Sân thượng” ở đây là phần mái bằng, có thể đi lại và sử dụng, của một ngôi nhà.
    reason: cultural_note
lexical_decisions:
- source_word: ὁ ἐπὶ τοῦ δώματος
  choice: Người đang ở trên sân thượng
  rationale: Cụm có mạo từ được dùng như danh từ, chỉ người đang ở trên phần mái bằng có thể sử dụng của ngôi nhà. “Người” tự nhiên trong tiếng Việt và không khiến giống ngữ pháp của tiếng Hy Lạp bị hiểu thành giới tính sinh học bắt buộc.
- source_word: δώματος
  choice: sân thượng
  rationale: Trong bối cảnh nhà ở vùng Địa Trung Hải cổ đại, từ này chỉ phần mái bằng có thể đi lại và sử dụng. “Sân thượng” truyền đạt công năng ấy rõ hơn “mái nhà” đối với độc giả Việt hiện đại.
- source_word: μὴ καταβάτω
  choice: thì đừng xuống
  rationale: Diễn đạt mệnh lệnh phủ định khẩn cấp bằng tiếng Việt tự nhiên, đồng thời giữ ý chuyển động từ sân thượng xuống dưới.
- source_word: ἆραι
  choice: lấy
  rationale: 'Động từ nguyên mẫu chỉ mục đích của việc đi xuống: xuống để lấy hoặc mang đồ ra. “Lấy” ngắn gọn và phù hợp ngữ cảnh.'
- source_word: τὰ ἐκ τῆς οἰκίας αὐτοῦ
  choice: những thứ trong nhà mình
  rationale: Cụm trung tính số nhiều được dùng lược để chỉ các vật ở trong nhà. “Những thứ trong nhà mình” giữ cách nói khái quát của nguyên văn, không diễn giải cụ thể thành “tài sản” hay “đồ đạc”.
- source_word: οἰκίας
  choice: nhà
  rationale: Giữ nghĩa cụ thể về công trình mà người ấy có thể đi xuống để vào lấy đồ.
- source_word: αὐτοῦ
  choice: mình
  rationale: Đại từ phản thân “mình” quy chiếu tự nhiên về chủ thể số ít trong tiếng Việt, không cần biểu thị giống như đại từ Hy Lạp và không thay đổi phạm vi quy chiếu.
theological_decisions:
- issue: Đại từ giống đực số ít mang nghĩa đại diện
  choice: Dùng “người” và “nhà mình”
  alternative: Dùng “người đàn ông” và “nhà của anh ta”
  rationale: Giống đực trong cấu trúc Hy Lạp có chức năng đại diện, không đưa ra khẳng định thần học rằng lời cảnh báo chỉ áp dụng cho nam giới. Tiếng Việt không bắt buộc đánh dấu giống; “mình” vẫn giữ chủ thể số ít và quan hệ sở hữu.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Cấu trúc chủ đề “Người… thì…” tự nhiên trong tiếng Việt; “đừng” truyền đạt trực tiếp tính khẩn cấp của mệnh lệnh.
