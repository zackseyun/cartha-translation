id: MAT.19.21
reference: Matthew 19:21
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἔφη αὐτῷ ὁ Ἰησοῦς· Εἰ θέλεις τέλειος εἶναι, ὕπαγε πώλησόν σου τὰ ὑπάρχοντα καὶ ⸀δὸς πτωχοῖς, καὶ ἕξεις θησαυρὸν ἐν ⸀οὐρανοῖς, καὶ δεῦρο ἀκολούθει μοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/021.yaml
  text: Jesus said to him[a], “If you want to be perfect, go, sell your possessions and give to the poor, and you will have treasure in heaven; then come, follow me.”
translation:
  language: vi
  text: 'Đức Giê-su nói với anh: “Nếu anh muốn nên trọn vẹn[a], hãy đi bán tài sản của mình và cho người nghèo, thì anh sẽ có kho báu trên trời; rồi hãy đến theo tôi.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “nên hoàn hảo” hoặc “nên trưởng thành.”'
    reason: τέλειος có trường nghĩa gồm hoàn hảo, đầy đủ/trọn vẹn và trưởng thành; chú thích bảo tồn các khả năng thực sự của nguyên ngữ.
lexical_decisions:
- source_word: ἔφη αὐτῷ ὁ Ἰησοῦς
  choice: Đức Giê-su nói với anh
  rationale: Diễn đạt tự nhiên động từ tường thuật ἔφη và đại từ chỉ người đàn ông đang đối thoại; không thêm sắc thái mệnh lệnh vào động từ nói.
- source_word: τέλειος
  choice: trọn vẹn
  rationale: Từ này có thể chỉ sự hoàn thiện, đầy đủ hoặc trưởng thành. “Trọn vẹn” giữ được ý về sự toàn tâm và không thiếu hụt trong văn cảnh mà không mặc nhiên giới hạn nghĩa vào sự vô tội tuyệt đối.
- source_word: ὕπαγε
  choice: hãy đi
  rationale: Mệnh lệnh chỉ sự ra đi; đây là cách diễn đạt trực tiếp, tự nhiên trong tiếng Việt.
- source_word: πώλησόν σου τὰ ὑπάρχοντα
  choice: bán tài sản của mình
  rationale: τὰ ὑπάρχοντα chỉ những gì một người sở hữu; “tài sản” ngắn gọn và bao quát hơn “đồ đạc”.
- source_word: δὸς πτωχοῖς
  choice: cho người nghèo
  rationale: πτωχοῖς được dùng như danh từ tập hợp, chỉ những người nghèo; bản dịch giữ nguyên đối tượng và hành động ban cho.
- source_word: ἕξεις θησαυρὸν ἐν οὐρανοῖς
  choice: anh sẽ có kho báu trên trời
  rationale: Giữ lời hứa ở thì tương lai. Dù οὐρανοῖς ở số nhiều, “trên trời” là cách nói tiếng Việt tự nhiên trong thành ngữ này.
- source_word: δεῦρο ἀκολούθει μοι
  choice: rồi hãy đến theo tôi
  rationale: δεῦρο là lời gọi “hãy đến”, còn ἀκολούθει μοι là lời mời gọi làm môn đệ “theo tôi”; “rồi” thể hiện trình tự mà không làm suy yếu mệnh lệnh.
theological_decisions:
- issue: Ý nghĩa của τέλειος trong mối liên hệ với việc làm môn đệ
  choice: nên trọn vẹn
  alternative: nên hoàn hảo; nên trưởng thành
  rationale: “Trọn vẹn” bảo tồn ý niệm về sự đầy đủ, toàn tâm trong đòi hỏi của Đức Giê-su, đồng thời không tự ý giải quyết căng thẳng thần học bằng cách biến câu này thành một khẳng định chuyên biệt về tình trạng vô tội. “Hoàn hảo” vẫn là một khả năng dịch chính đáng và được ghi ở chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Giê-su” theo lối gọi kính trọng phổ biến; đại từ “anh” phù hợp với người đàn ông trong ngữ cảnh. Các mệnh lệnh được giữ rõ ràng, còn dấu chấm phẩy giúp thể hiện bước chuyển từ lời hứa sang lời gọi đi theo.
