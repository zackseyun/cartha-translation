  source_fidelity: 'Bản dịch truyền đạt đầy đủ cấu trúc và nội dung Hy Lạp: lời nói của Đức Giê-su, điều kiện «nếu anh muốn», ý τέλειος, các mệnh lệnh đi/bán/cho, lời hứa về kho báu trên trời, và lời gọi đến theo Ngài. «Trọn vẹn» là một lựa chọn khả dĩ cho τέλειος trong ngữ cảnh này; chú thích nêu đúng các khả năng «hoàn hảo» và «trưởng thành» mà không quyết định vấn đề thần học vượt quá văn bản.'
