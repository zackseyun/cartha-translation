  terminology: «Đức Giê-su» giữ lối xưng hô kính trọng nhất quán; «tài sản», «người nghèo», «kho báu trên trời», và «theo tôi» phản ánh chính xác các thuật ngữ và cách nói then chốt. Không có thuật ngữ nào bị diễn giải theo hệ phái.
