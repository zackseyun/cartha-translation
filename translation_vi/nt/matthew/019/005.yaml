id: MAT.19.5
reference: Matthew 19:5
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ εἶπεν· ⸀Ἕνεκα τούτου καταλείψει ἄνθρωπος τὸν πατέρα καὶ τὴν μητέρα καὶ ⸀κολληθήσεται τῇ γυναικὶ αὐτοῦ, καὶ ἔσονται οἱ δύο εἰς σάρκα μίαν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/005.yaml
  text: and said[a], ‘For this reason a man will leave his father and mother and be joined to his wife, and the two will become one flesh.’
translation:
  language: vi
  text: 'và phán: “Vì thế, người nam sẽ lìa cha mẹ và gắn bó[a] với vợ mình, cả hai sẽ trở nên một thịt”?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “kết hợp với” hoặc “gắn chặt với”. Động từ Hy Lạp diễn tả sự gắn kết mật thiết.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἕνεκα τούτου
  choice: Vì thế
  rationale: Diễn đạt tự nhiên quan hệ nguyên nhân–kết quả của cụm từ Hy Lạp, đồng thời dẫn vào lời trích Kinh Thánh.
- source_word: καταλείψει
  choice: sẽ lìa
  rationale: Giữ thì tương lai và ý rời khỏi cha mẹ; “lìa” ngắn gọn, trang trọng và dễ hiểu trong ngữ cảnh hôn nhân.
- source_word: ἄνθρωπος
  choice: người nam
  rationale: Trong lời trích về hôn nhân, danh từ số ít này chỉ người phối ngẫu nam, đối ứng với “vợ mình”; cách dịch không trung tính hóa giới tính cụ thể của nguyên văn.
- source_word: κολληθήσεται
  choice: sẽ gắn bó với
  rationale: Động từ bị động diễn tả sự kết nối hay gắn chặt; “gắn bó với” tự nhiên trong tiếng Việt và giữ được sắc thái liên kết mật thiết mà không giải thích quá mức.
- source_word: γυναικὶ αὐτοῦ
  choice: vợ mình
  rationale: γυνή có thể là “người phụ nữ” hoặc “vợ”, nhưng ngữ cảnh hôn nhân đòi hỏi nghĩa “vợ”; “mình” quy chiếu tự nhiên về chủ ngữ.
- source_word: οἱ δύο
  choice: cả hai
  rationale: Thể hiện rõ hai người được nguyên văn nêu đích danh, bằng cách nói tự nhiên trong tiếng Việt.
- source_word: εἰς σάρκα μίαν
  choice: trở nên một thịt
  rationale: Giữ hình ảnh thần học–quan hệ của lời trích Sáng Thế Ký và ý chuyển thành một sự hiệp nhất mới trong cấu trúc ἔσονται εἰς.
theological_decisions:
- issue: Ngôn ngữ chỉ giới trong lời trích về hôn nhân
  choice: người nam … vợ mình
  alternative: một người … người phối ngẫu của mình
  rationale: Nguyên văn trình bày cụ thể cặp nam–nữ trong hôn nhân, chứ không nói chung về loài người; vì vậy cần giữ sự phân biệt giới tính.
- issue: Cách diễn đạt hình ảnh hiệp nhất trong hôn nhân
  choice: cả hai sẽ trở nên một thịt
  alternative: cả hai sẽ là một thịt
  rationale: “Trở nên” thể hiện kết quả hay sự chuyển vào tình trạng hiệp nhất được cấu trúc ἔσονται εἰς gợi ra, đồng thời không diễn giải hình ảnh “một thịt” theo một hệ phái.
- issue: Dấu câu kết thúc câu
  choice: dấu hỏi sau lời trích
  alternative: dấu chấm sau lời trích
  rationale: Trong mạch cú pháp bắt đầu ở câu 4, câu 5 vẫn nằm trong câu hỏi của Chúa Giê-su (“Các ông chưa đọc sao…?”); dấu hỏi bảo toàn cấu trúc diễn ngôn của bản Hy Lạp.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “phán” vì chủ thể hàm ẩn từ câu trước là Đấng Tạo Hóa; giữ “một thịt” để bảo toàn hình ảnh nguyên văn và tiếng vọng của Sáng Thế Ký.
