  source_fidelity: 'Bản dịch chuyển tải đầy đủ các thành tố của bản Hy Lạp: quan hệ nguyên nhân “Vì thế,” người nam và vợ mình, việc rời cha mẹ, sự gắn kết, và kết quả “cả hai sẽ trở nên một thịt.” “Cha mẹ” là cách gộp tự nhiên nhưng vẫn bao hàm rõ “cha và mẹ.” Dấu hỏi phù hợp vì câu này tiếp tục câu hỏi tu từ đang mở từ câu trước.'
