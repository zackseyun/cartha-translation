  text: Τότε ⸀προσηνέχθησαν αὐτῷ παιδία ἵνα τὰς χεῖρας ἐπιθῇ αὐτοῖς καὶ προσεύξηται· οἱ δὲ μαθηταὶ ἐπετίμησαν αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/013.yaml
  text: Then children were brought to him so that he might lay his hands on them and pray[a]; but the disciples rebuked them.
translation:
  language: vi
  text: Bấy giờ, người ta đem trẻ em đến với Đức Giê-su để Ngài đặt tay trên chúng và cầu nguyện; nhưng các môn đệ quở trách họ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Đại từ “họ” ở cuối câu có thể chỉ các trẻ em hoặc những người đã đem chúng đến.
    reason: alternative_reading
lexical_decisions:
- source_word: Τότε
  choice: Bấy giờ
  rationale: Đánh dấu diễn tiến kế tiếp trong câu chuyện bằng cách diễn đạt tự nhiên, trang trọng vừa phải trong tiếng Việt.
- source_word: προσηνέχθησαν αὐτῷ παιδία
  choice: người ta đem các trẻ em đến với Đức Giê-su
  rationale: Động từ Hy Lạp ở thể bị động, nhưng chuyển thành cấu trúc chủ động vô nhân xưng giúp câu tiếng Việt tự nhiên hơn mà vẫn không xác định người đem trẻ đến. Tên Đức Giê-su được dùng thay cho đại từ để tránh chuỗi đại từ mơ hồ.
- source_word: ἵνα τὰς χεῖρας ἐπιθῇ αὐτοῖς
  choice: để ngài đặt tay trên chúng
  rationale: Giữ rõ ý chỉ mục đích của ἵνα và hình ảnh đặt tay; đại từ “chúng” quy chiếu tự nhiên đến các trẻ em.
- source_word: καὶ προσεύξηται
  choice: và cầu nguyện
  rationale: Không thêm “cho chúng” vì bổ ngữ ấy không được nêu minh nhiên trong nguyên văn.
- source_word: οἱ δὲ μαθηταὶ
  choice: nhưng các môn đồ
  rationale: “Nhưng” thể hiện sự tương phản nhẹ của δέ; “môn đồ” là cách gọi quen thuộc, trang trọng và dễ hiểu.
- source_word: ἐπετίμησαν αὐτοῖς
  choice: quở trách họ
  rationale: “Quở trách” thể hiện lực nghĩa của ἐπιτιμάω. “Họ” giữ khả năng quy chiếu đến những người đem trẻ đến hoặc đến các trẻ em, thay vì quyết định thay cho nguyên văn.
theological_decisions:
- issue: Đối tượng của đại từ αὐτοῖς cuối câu
  choice: họ
  alternative: các trẻ em; những người đem các trẻ em đến
  rationale: Đại từ số nhiều trong tiếng Hy Lạp có thể quy chiếu đến một trong hai nhóm. Bản dịch giữ sự mơ hồ thật sự này và giải thích bằng chú thích.
translation_notes:
  register: Tiếng Việt hiện đại, tự nhiên và trang trọng vừa phải. Dùng “Đức Giê-su” cho nhân vật đang được nói đến và “ngài” ở mệnh đề sau; không thêm đối tượng cho động từ “cầu nguyện”. Dấu chú thích được đặt ngay sau mệnh đề chứa đại từ mơ hồ.
