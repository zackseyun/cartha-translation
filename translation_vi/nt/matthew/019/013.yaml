  to: Bấy giờ, người ta đem trẻ em đến với Đức Giê-su để Ngài đặt tay trên chúng và cầu nguyện; nhưng các môn đệ quở trách họ.[a]
  rationale: Chỉnh nhẹ để câu tự nhiên và thuật ngữ chuẩn hóa hơn trong tiếng Việt hiện đại. Bản sửa vẫn giữ cấu trúc mục đích, không thêm đối tượng cho “cầu nguyện,” và quan trọng nhất là giữ nguyên sự mơ hồ của đại từ αὐτοῖς cuối câu cùng chú thích tương ứng.
  reviewer_model: gpt-5.6-terra
