  text: λέγει αὐτῷ ὁ νεανίσκος· ⸂Πάντα ταῦτα⸃ ⸀ἐφύλαξα· τί ἔτι ὑστερῶ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/020.yaml
  text: The young man says to him[a], “All these I have kept[b]. What do I still lack?”
translation:
  language: vi
  text: 'Người thanh niên nói với ngài: “Tất cả những điều ấy, tôi đã tuân giữ. Tôi còn thiếu điều gì?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: nói
  rationale: Giữ lối hiện tại lịch sử của tiếng Hy Lạp bằng thì không đánh dấu trong tiếng Việt; “nói” tự nhiên trong văn kể chuyện.
- source_word: αὐτῷ
  choice: với ngài
  rationale: Diễn đạt bổ ngữ gián tiếp tự nhiên; “ngài” phù hợp với cách người thanh niên thưa chuyện với Chúa Giê-su mà không thêm danh xưng không có trong câu.
- source_word: ὁ νεανίσκος
  choice: người thanh niên
  rationale: Dịch trực tiếp νεανίσκος là một người nam trẻ tuổi; không thêm ý “quan chức” từ truyền thống Nhất Lãm rộng hơn.
- source_word: Πάντα ταῦτα
  choice: tất cả những điều ấy
  rationale: Chỉ toàn bộ các điều răn vừa được nhắc đến, đồng thời tự nhiên và rõ nghĩa trong tiếng Việt.
- source_word: ἐφύλαξα
  choice: tôi đã tuân giữ
  rationale: Trong ngữ cảnh điều răn, φυλάσσω mang nghĩa giữ hay tuân theo; “đã tuân giữ” diễn đạt hành động quá khứ có liên hệ với lời tự nhận hiện tại.
- source_word: τί ἔτι ὑστερῶ
  choice: Tôi còn thiếu điều gì?
  rationale: Cấu trúc tiếng Việt tự nhiên, giữ ἔτι bằng “còn” và nghĩa thiếu hụt của ὑστερέω bằng “thiếu”, không xác định trước thiếu vật gì hay thiếu ở phương diện nào.
theological_decisions:
- issue: Lời tự đánh giá về sự vâng giữ các điều răn
  choice: Trình bày thẳng lời người thanh niên tự nhận rằng mình đã tuân giữ mọi điều ấy.
  alternative: Dùng cách diễn đạt hàm ý lời tuyên bố của anh là sai lầm, cường điệu hoặc mỉa mai.
  rationale: Bản Hy Lạp không trực tiếp phán xét tính đúng đắn của lời tự nhận ngay trong câu này; bản dịch giữ nguyên sức căng thần học để mạch truyện giải thích.
- issue: Phạm vi của điều còn thiếu
  choice: Dịch mở là “còn thiếu điều gì”.
  alternative: Diễn giải thành thiếu một việc làm, một phẩm chất, hoặc thiếu để được hoàn thiện/cứu rỗi.
  rationale: ὑστερῶ diễn tả sự thiếu hụt nhưng câu không nêu rõ loại thiếu hụt; không nên giải quyết sự mơ hồ bằng diễn giải giáo lý.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Tuân giữ” phù hợp với ngữ cảnh các điều răn; lời thoại vẫn tự nhiên. Không cần chú thích vì các sắc thái chính có thể được giữ trực tiếp trong câu tiếng Việt.
