  text: λέγουσιν αὐτῷ· Τί οὖν Μωϋσῆς ἐνετείλατο δοῦναι βιβλίον ἀποστασίου καὶ ἀπολῦσαι ⸀αὐτήν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/007.yaml
  text: They said to him[a], “Why then did Moses command to give a certificate of divorce and to send her away?”
translation:
  language: vi
  text: 'Họ hỏi Ngài: “Vậy tại sao Môi-se truyền phải trao giấy ly hôn và cho vợ ra đi[a]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “và ly hôn với vợ.” Động từ Hy Lạp có thể có nghĩa là “cho ra đi”; trong ngữ cảnh này, đó là một cách nói về việc ly hôn.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγουσιν αὐτῷ
  choice: Họ hỏi Ngài
  rationale: Động từ ở hiện tại lịch sử được chuyển sang lối kể tự nhiên trong tiếng Việt. Trong ngữ cảnh, lời họ nói mang hình thức câu hỏi, nên “hỏi” rõ và tự nhiên hơn “nói với”.
- source_word: Τί οὖν
  choice: Vậy tại sao
  rationale: Cụm này mở đầu lời phản bác dựa trên phát biểu trước đó của Chúa Giê-su; “Vậy tại sao” diễn đạt đúng sức nặng lập luận.
- source_word: Μωϋσῆς
  choice: Môi-se
  rationale: Dùng dạng tên quen thuộc trong tiếng Việt hiện đại.
- source_word: ἐνετείλατο
  choice: truyền phải
  rationale: Giữ nguyên ý ‘ra lệnh/truyền’, tức cách những người đối thoại mô tả lời Môi-se, không đổi trước thành ‘cho phép’ theo câu kế tiếp.
- source_word: δοῦναι βιβλίον ἀποστασίου
  choice: trao giấy ly hôn
  rationale: Diễn đạt tự nhiên hành động giao văn thư pháp lý xác nhận việc ly hôn; “giấy ly hôn” rõ ràng và dễ hiểu.
- source_word: καὶ ἀπολῦσαι αὐτήν
  choice: rồi cho vợ đi
  rationale: ἀπολύω có nghĩa đen là cho đi/đuổi đi và trong ngữ cảnh này là hành vi ly hôn. “Vợ” làm rõ sở chỉ của đại từ giống cái αὐτήν theo ngữ cảnh, còn chú thích bảo lưu nghĩa pháp lý.
theological_decisions:
- issue: Có nên dịch lời của những người hỏi sao cho phù hợp trước với lời đính chính của Chúa Giê-su ở câu sau hay không
  choice: Giữ sắc thái ‘truyền phải’ trong chính văn
  alternative: cho phép
  rationale: Bản Hy Lạp tại câu này dùng ἐνετείλατο, nghĩa là ‘truyền lệnh’. Cần bảo toàn cách lập luận của người hỏi thay vì đưa trước sự phân biệt giữa mệnh lệnh và sự nhượng bộ ở câu kế tiếp.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Cấu trúc “trao giấy ly hôn rồi cho vợ đi” gọn tự nhiên trong tiếng Việt, đồng thời giữ sự phân biệt giữa văn thư ly hôn và hành động cho người vợ đi.
