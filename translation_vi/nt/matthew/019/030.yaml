revisions:
- from: Nhưng nhiều người đứng đầu sẽ thành cuối cùng[a], còn những người cuối cùng sẽ thành đầu tiên.
  to: Nhưng nhiều người đứng đầu sẽ là người cuối, và những người cuối sẽ là người đầu[a].
  rationale: Sửa tối thiểu để phản ánh trực tiếp động từ ‘sẽ là’ và liên từ ‘và’ của tiếng Hy Lạp, đồng thời giữ nguyên tính khái quát, sự mơ hồ về phạm vi, và nhịp đối xứng của lời châm ngôn. Chú thích được chỉnh cho tự nhiên và nhất quán với bản văn.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T05:40:51Z'
review_pass:
  verdict: revise
  source_fidelity: Bản nháp truyền đạt đúng lời châm ngôn về sự đảo ngược thứ bậc. Tuy nhiên, ἔσονται là hình thức tương lai của ‘là’, nên ‘sẽ là’ sát và trung tính hơn ‘sẽ thành’, vốn nhấn mạnh quá trình biến đổi không được diễn đạt riêng trong nguyên văn. Liên từ καί nên được dịch trực tiếp là ‘và’; ‘còn’ có thể dùng trong tiếng Việt nhưng làm sắc thái đối chiếu mạnh hơn.
  naturalness: Câu sửa vẫn tự nhiên, trang trọng, ngắn gọn và giữ nhịp đối xứng của nguyên văn. ‘Người đứng đầu/người cuối’ rõ nghĩa thứ bậc hơn khi đặt song song.
  terminology: ‘Đứng đầu’ và ‘cuối’ giữ cặp đối lập πρῶτοι/ἔσχατοι mà không áp đặt nghĩa ‘được cứu’, ‘được thưởng’, hay ‘thấp kém’.
  issues:
  - severity: low
    issue: ‘sẽ thành’ diễn giải động từ εἰμί là một sự trở thành.
    rationale: Dù phù hợp với ý đảo ngược trong ngữ cảnh, nguyên văn chỉ dùng ‘sẽ là’; cách dịch này bảo toàn tính châm ngôn và tránh thêm sắc thái quá trình.
  - severity: low
    issue: ‘còn’ thay cho καί ở vế hai.
    rationale: ‘Còn’ có thể tự nhiên trong cấu trúc đối chiếu, nhưng ‘và’ phản ánh trực tiếp hơn liên từ καί và duy trì phép song hành cô đọng.
  - severity: low
    issue: Chú thích dùng cụm ‘nhiều người đầu’, chưa tự nhiên trong tiếng Việt hiện đại.
    rationale: Nên dùng ‘nhiều người đứng đầu’ và ‘những người cuối’ để bản sát chữ vẫn rõ nghĩa.
  revised_text: Nhưng nhiều người đứng đầu sẽ là người cuối, và những người cuối sẽ là người đầu[a].
