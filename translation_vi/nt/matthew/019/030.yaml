  text: πολλοὶ δὲ ἔσονται πρῶτοι ἔσχατοι καὶ ἔσχατοι πρῶτοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/030.yaml
  text: But many who are first will be last[a], and the last first.
translation:
  language: vi
  text: Nhưng nhiều người đứng đầu sẽ là người cuối, và những người cuối sẽ là người đầu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát hơn: “Nhưng nhiều người đứng đầu sẽ là người cuối, và những người cuối sẽ là người đầu.” Câu Hy Lạp đặc biệt cô đọng và có tính châm ngôn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὶ
  choice: nhiều người
  rationale: Tính từ được dùng như danh từ, chỉ một nhóm đông nhưng không xác định; tiếng Việt cần thêm “người” để câu tự nhiên và rõ nghĩa.
- source_word: δὲ
  choice: Nhưng
  rationale: δέ biểu thị sự tương phản nhẹ với lời bàn trước đó về địa vị và phần thưởng; “Nhưng” giữ được sắc thái này.
- source_word: ἔσονται
  choice: sẽ thành
  rationale: Dạng tương lai của εἰμί cho biết tình trạng về sau; “sẽ thành” diễn đạt tự nhiên sự đảo ngược vị trí trong câu này.
- source_word: πρῶτοι
  choice: đứng đầu / đầu tiên
  rationale: πρῶτοι nói đến thứ bậc hay vị trí. “Đứng đầu” tự nhiên khi mô tả người hiện ở vị trí thứ nhất; “đầu tiên” ở vế kết tạo thế đối xứng rõ với “cuối cùng”.
- source_word: ἔσχατοι
  choice: cuối cùng
  rationale: Giữ nguyên sự đối lập trực tiếp với πρῶτοι mà không tự ý thu hẹp thành “thấp kém nhất” hay một địa vị thần học cụ thể.
- source_word: πρῶτοι ἔσχατοι
  choice: người đứng đầu sẽ thành cuối cùng
  rationale: Bổ sung “người” theo ngữ pháp tiếng Việt và dùng “sẽ thành” để làm rõ quan hệ vị ngữ vốn được tiếng Hy Lạp diễn đạt rất cô đọng.
- source_word: καὶ ἔσχατοι πρῶτοι
  choice: còn những người cuối cùng sẽ thành đầu tiên
  rationale: “Còn” thể hiện sự đối chiếu cân xứng của καί trong câu tục ngữ; lặp lại “sẽ thành” giúp tiếng Việt sáng nghĩa dù nguyên văn lược động từ ở vế hai.
theological_decisions:
- issue: Phạm vi của lời nói về sự đảo ngược
  choice: Giữ đây là lời khái quát về sự đảo ngược thứ bậc hoặc vị trí, không xác định cụ thể đó là sự cứu rỗi, phần thưởng, địa vị xã hội hay thứ bậc thời cuối cùng.
  alternative: Diễn giải riêng là việc vào vương quốc, phần thưởng giữa các môn đồ, hoặc sự đảo ngược địa vị xã hội.
  rationale: Bản thân câu này không xác định chính xác phạm vi của sự đảo ngược; bản dịch vì thế giữ tính rộng và hàm súc, tránh đưa một cách giải thích giáo lý hẹp vào văn bản.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Bản chính làm sáng cấu trúc ngầm của câu Hy Lạp nhưng vẫn giữ nhịp đối xứng; chú thích bảo tồn cách diễn đạt sát chữ, cô đọng hơn.
