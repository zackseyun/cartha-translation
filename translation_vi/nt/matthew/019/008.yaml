id: MAT.19.8
reference: Matthew 19:8
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: λέγει αὐτοῖς ὅτι Μωϋσῆς πρὸς τὴν σκληροκαρδίαν ὑμῶν ἐπέτρεψεν ὑμῖν ἀπολῦσαι τὰς γυναῖκας ὑμῶν, ἀπ’ ἀρχῆς δὲ οὐ γέγονεν οὕτως.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/008.yaml
  text: He said to them[a], “Because of your hardness of heart Moses permitted you to divorce your wives[c][b], but from the beginning it has not been so.”
translation:
  language: vi
  text: 'Ngài nói với họ: “Vì lòng các ông chai cứng, Môi-se đã cho phép các ông ly dị vợ[a]; nhưng từ ban đầu, điều đó đã không như vậy.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát: “đuổi vợ mình đi”; trong ngữ cảnh này, cụm từ có nghĩa là ly dị.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει αὐτοῖς
  choice: Ngài nói với họ
  rationale: Thì hiện tại lịch sử của λέγει được chuyển sang lối kể tự nhiên trong tiếng Việt; đại từ “Ngài” giữ giọng văn trang trọng và quy chiếu rõ đến Đức Giê-su trong ngữ cảnh.
- source_word: πρὸς τὴν σκληροκαρδίαν ὑμῶν
  choice: Vì lòng các ông chai cứng
  rationale: “Vì” diễn đạt quan hệ nguyên nhân/căn cứ của πρός với đối cách; “lòng… chai cứng” giữ hình ảnh Kinh Thánh của σκληροκαρδία mà vẫn tự nhiên trong tiếng Việt.
- source_word: ἐπέτρεψεν
  choice: đã cho phép
  rationale: Động từ chỉ sự cho phép hay nhượng bộ, không phải mệnh lệnh hoặc sự tán thành.
- source_word: ἀπολῦσαι τὰς γυναῖκας ὑμῶν
  choice: ly dị vợ mình
  rationale: Trong ngữ cảnh hôn nhân, ἀπολύω mang nghĩa pháp lý là ly dị; γυναῖκες là vợ. “Mình” quy chiếu tự nhiên đến chủ thể số nhiều “các ông” mà không làm thay đổi ý nghĩa.
- source_word: ἀπ’ ἀρχῆς
  choice: từ ban đầu
  rationale: Cách diễn đạt quen thuộc, giữ nguyên sức gợi đến trật tự sáng tạo trong ngữ cảnh liền trước.
- source_word: οὐ γέγονεν οὕτως
  choice: sự việc không phải như vậy
  rationale: Diễn đạt trạng thái thực hữu được phủ định bởi thể hoàn thành γέγονεν, tránh cách dịch thuần quá khứ có thể làm yếu hiệu lực kéo dài, đồng thời không giải thích quá mức điều “như vậy” là gì.
theological_decisions:
- issue: Hành động của Môi-se là mệnh lệnh hay sự cho phép/nhượng bộ
  choice: Môi-se đã cho phép
  alternative: Môi-se đã truyền dạy
  rationale: ἐπέτρεψεν rõ ràng chỉ sự cho phép, nên không được chuyển thành một mệnh lệnh tích cực hay lý tưởng được tán thành.
- issue: Có nên giải thích rõ lời nhắc đến công trình sáng tạo trong câu chính hay không
  choice: nhưng từ ban đầu, sự việc không phải như vậy
  alternative: nhưng từ ban đầu, đó không phải là ý định của Đức Chúa Trời
  rationale: Bản dịch giữ mức độ hàm ẩn của nguyên văn; ngữ cảnh cho thấy sự quy chiếu đến trật tự sáng tạo, nhưng câu Hy Lạp không trực tiếp nói “ý định của Đức Chúa Trời”.
- issue: Giá trị của thể hoàn thành γέγονεν
  choice: sự việc không phải như vậy
  alternative: sự việc đã không như vậy
  rationale: Lựa chọn này giữ trạng thái được xác lập từ ban đầu mà không buộc câu vào một thời quá khứ đơn thuần.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “các ông” phù hợp với nhóm người Pha-ri-si đang đối thoại với Đức Giê-su; tránh thêm lời giải nghĩa giáo lý vào câu chính.
