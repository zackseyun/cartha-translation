  terminology: Dùng “hành vi tình dục trái luân lý” cho πορνεία nhằm giữ phạm vi rộng, còn “phạm tội ngoại tình” cho μοιχᾶται. “Ly dị” và “đã bị ly dị” duy trì quan hệ từ vựng với ἀπολύω.
