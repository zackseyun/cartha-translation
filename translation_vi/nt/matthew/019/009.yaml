  - severity: low
    issue: “Người phụ nữ đã ly dị” không biểu thị rõ sắc thái bị động của ἀπολελυμένην.
    rationale: Phân từ hoàn thành bị động nói về một phụ nữ đã bị ly dị. Thêm “bị” phản ánh nguyên ngữ mà không quy kết người nào khởi xướng việc ly dị.
