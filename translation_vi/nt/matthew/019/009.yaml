  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: λέγω δὲ ὑμῖν ⸀ὅτι ὃς ἂν ἀπολύσῃ τὴν γυναῖκα αὐτοῦ μὴ ἐπὶ πορνείᾳ καὶ γαμήσῃ ἄλλην μοιχᾶται ⸂καὶ ὁ ἀπολελυμένην γαμήσας μοιχᾶται⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/009.yaml
  text: But I tell you that whoever divorces his wife[a], except for sexual immorality, and marries another, commits adultery[b]; and whoever marries a divorced woman commits adultery.
translation:
  language: vi
  text: 'Nhưng tôi nói với các ông rằng: ai ly dị vợ mình, trừ trường hợp có hành vi tình dục trái luân lý[a], rồi cưới một người phụ nữ khác thì phạm tội ngoại tình; và ai cưới người phụ nữ đã bị ly dị thì phạm tội ngoại tình[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cụm Hy Lạp cũng có thể dịch là “trừ vì sự vô luân về tình dục”. Từ này có thể được hiểu hẹp hơn là “gian dâm” hoặc “quan hệ tình dục ngoài hôn nhân”; một số người hiểu là “không chung thủy về tình dục”.
    reason: lexical_alternative
  - marker: b
    text: 'Một số thủ bản không có câu: “và ai cưới người phụ nữ đã bị ly dị thì phạm tội ngoại tình.”'
    reason: textual_variant
lexical_decisions:
- source_word: λέγω δὲ ὑμῖν
  choice: Nhưng tôi nói với các ông
  rationale: δέ mang sắc thái chuyển tiếp hoặc tương phản nhẹ trong mạch tranh luận; λέγω với ὑμῖν được diễn đạt tự nhiên là “tôi nói với các ông”, phù hợp nhóm người nam đang được Chúa Giê-su trực tiếp đáp lời.
- source_word: ὃς ἂν
  choice: ai
  rationale: Đại từ quan hệ đi với ἄν diễn tả một trường hợp tổng quát, không xác định; “ai” tự nhiên và giữ nguyên lực khái quát.
- source_word: ἀπολύσῃ τὴν γυναῖκα αὐτοῦ
  choice: ly dị vợ mình
  rationale: Trong ngữ cảnh hôn nhân, ἀπολύω chỉ việc ly dị chứ không đơn thuần là đuổi đi; γυνή ở đây là “vợ”.
- source_word: μὴ ἐπὶ πορνείᾳ
  choice: trừ trường hợp gian dâm
  rationale: Cụm từ nêu một ngoại lệ hoặc căn cứ ngoại lệ. “Gian dâm” là cách diễn đạt hiện đại, trang trọng, đủ rộng để không đồng nhất πορνεία chỉ với μοιχεία là ngoại tình; chú thích ghi nhận các cách hiểu hẹp hoặc diễn đạt khác.
- source_word: καὶ γαμήσῃ ἄλλην
  choice: rồi cưới người khác
  rationale: καί nối hành động ly dị với việc kết hôn tiếp theo; ἄλλην ở giống cái, nhưng “người khác” tự nhiên trong tiếng Việt và ngữ cảnh đã làm rõ đó là một phụ nữ khác.
- source_word: μοιχᾶται
  choice: phạm tội ngoại tình
  rationale: Diễn đạt rõ hành vi μοιχάομαι trong tiếng Việt hiện đại và giữ sắc thái luân lý của mệnh đề.
- source_word: καὶ ὁ ἀπολελυμένην γαμήσας μοιχᾶται
  choice: và ai cưới người phụ nữ đã ly dị thì phạm tội ngoại tình
  rationale: Kết cấu phân từ có mạo từ mang nghĩa tổng quát; ἀπολελυμένην là phân từ hoàn thành bị động, chỉ một phụ nữ đã bị ly dị. Cách dịch không quy kết ai là người chủ động khởi xướng việc ly dị.
theological_decisions:
- issue: Phạm vi nghĩa của πορνεία trong mệnh đề ngoại lệ
  choice: Dịch là “gian dâm” và chú thích các cách diễn đạt hoặc cách hiểu khác.
  alternative: “vô luân về tình dục”, “không chung thủy về tình dục”, hoặc nghĩa hẹp “quan hệ tình dục ngoài hôn nhân”.
  rationale: πορνεία có phạm vi rộng hơn riêng μοιχεία (“ngoại tình”). Bản dịch chính dùng một thuật ngữ Việt ngắn gọn, quen thuộc nhưng không âm thầm xác quyết một cách giải thích giáo phái; chú thích bảo tồn độ mở từ vựng và sự tranh luận về mệnh đề ngoại lệ.
- issue: Việc giữ mệnh đề cuối καὶ ὁ ἀπολελυμένην γαμήσας μοιχᾶται
  choice: Giữ trong chính văn và đánh dấu chú thích dị bản.
  alternative: Lược bỏ vì mệnh đề không có trong một số thủ bản.
  rationale: SBLGNT được cung cấp có mệnh đề này nhưng đánh dấu là có biến thể văn bản. Vì vậy, dịch mệnh đề trong chính văn đồng thời minh bạch ghi nhận chứng cứ thủ bản khác.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “ly dị” là cách nói phổ thông trong tiếng Việt hiện đại; giữ cấu trúc phán quyết trực tiếp và sức nặng luân lý của nguyên văn. Các dấu chú thích [a], [b] đều xuất hiện trong chính văn.
