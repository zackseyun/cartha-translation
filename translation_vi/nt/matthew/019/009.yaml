  source_fidelity: 'Bản dịch phản ánh đúng cấu trúc chính: lời đối lập nhẹ của δέ, chủ ngữ khái quát ὃς ἄν, hành động ly dị–cưới người khác, và mệnh đề cuối có dị bản. Tuy nhiên, “gian dâm” trong cách dùng tiếng Việt hiện nay thường có thể bị hiểu hẹp hơn πορνεία; cách dịch rộng hơn tránh đồng nhất thuật ngữ này với “ngoại tình” (μοιχᾶται). “Đã bị ly dị” cũng biểu đạt chính xác hơn phân từ bị động ἀπολελυμένην.'
