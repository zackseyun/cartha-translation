  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: λέγει αὐτῷ· Ποίας; ὁ δὲ Ἰησοῦς ⸀εἶπεν· Τὸ Οὐ φονεύσεις, Οὐ μοιχεύσεις, Οὐ κλέψεις, Οὐ ψευδομαρτυρήσεις,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/018.yaml
  text: 'He says to him, “Which ones?” And Jesus said, “The: You shall not murder, you shall not commit adultery, you shall not steal, you shall not bear false witness,”'
translation:
  language: vi
  text: 'Người ấy hỏi Ngài: “Những điều nào?” Đức Giê-su đáp: “Đó là: Không được giết người; không được ngoại tình; không được trộm cắp; không được làm chứng dối,”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει αὐτῷ
  choice: Người ấy hỏi Ngài
  rationale: Động từ λέγει ở hiện tại lịch sử được chuyển tự nhiên sang lời dẫn quá khứ trong tiếng Việt; ngữ cảnh cho thấy đây là một câu hỏi. Đại từ chỉ người hỏi được diễn đạt rõ để tránh lối nói gượng ‘ông nói với Ngài’.
- source_word: Ποίας
  choice: Những điều nào?
  rationale: Dạng nghi vấn số nhiều giống cái quy chiếu đến các điều răn (ἐντολάς) ở câu trước; ‘những điều nào’ giữ được liên hệ ấy mà không thêm danh từ vắng mặt trong câu.
- source_word: Τὸ
  choice: 'Đó là:'
  rationale: Mạo từ trung tính số ít substantivized mở đầu phần trích dẫn, có thể hiểu theo nghĩa ‘điều này/phần này’; ‘Đó là:’ giữ nét dẫn nhập hơi bất thường của nguyên văn thay vì lược bỏ hoàn toàn.
- source_word: Οὐ φονεύσεις
  choice: Không được giết người
  rationale: φονεύω chỉ việc giết người, thường là sát nhân, không phải mọi hành vi giết nói chung; cách dịch này chính xác và quen thuộc trong tiếng Việt.
- source_word: Οὐ μοιχεύσεις
  choice: không được ngoại tình
  rationale: μοιχεύω nói cụ thể đến việc phạm tội ngoại tình.
- source_word: Οὐ κλέψεις
  choice: không được trộm cắp
  rationale: κλέπτω mang nghĩa lấy trộm tài sản; ‘trộm cắp’ là cách diễn đạt chuẩn, tự nhiên.
- source_word: Οὐ ψευδομαρτυρήσεις
  choice: không được làm chứng dối
  rationale: Giữ hình ảnh pháp lý và luân lý của ψευδομαρτυρέω, tức đưa lời chứng sai.
theological_decisions:
- issue: Giá trị của Τὸ trước chuỗi điều răn
  choice: Dịch rõ bằng ‘Đó là:’
  alternative: Lược bỏ trong tiếng Việt và mở đầu trực tiếp bằng ‘Không được giết người...’
  rationale: SBLGNT có Τὸ, và lớp tham khảo tiếng Anh cố ý bảo lưu ‘The:’. Bản dịch vì thế giữ một dấu hiệu dẫn nhập, nhưng dùng ‘Đó là:’ để câu có thể hiểu được trong tiếng Việt mà không áp đặt một cách giải thích thần học.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng ‘Đức Giê-su’ và đại từ kính trọng ‘Ngài’. Các mệnh lệnh được diễn đạt nhất quán bằng ‘không được’, phù hợp ngữ cảnh trích các điều răn; dấu chấm phẩy giúp phân biệt từng điều.
