id: MAT.19.2
reference: Matthew 19:2
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἠκολούθησαν αὐτῷ ὄχλοι πολλοί, καὶ ἐθεράπευσεν αὐτοὺς ἐκεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/002.yaml
  text: And large crowds followed him, and he healed them there.
translation:
  language: vi
  text: Đông đảo dân chúng đi theo Ngài, và Ngài chữa lành họ tại đó.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἠκολούθησαν
  choice: đi theo
  rationale: Động từ aorist chủ động chỉ hành động theo sau trong mạch kể chuyện; “đi theo” tự nhiên trong tiếng Việt và không tự động thêm sắc thái làm môn đồ.
- source_word: αὐτῷ
  choice: Ngài
  rationale: Đại từ số ít chỉ Chúa Giê-su, là đối tượng của hành động đi theo; “Ngài” giữ văn phong tôn kính, phổ thông trong bản văn Kinh Thánh tiếng Việt.
- source_word: ὄχλοι πολλοί
  choice: đông đảo dân chúng
  rationale: Cụm từ theo sát là “nhiều đám đông”; cách dịch này diễn đạt tự nhiên số người rất đông mà không gây cảm giác vụng về trong tiếng Việt.
- source_word: ἐθεράπευσεν
  choice: chữa lành
  rationale: Trong bối cảnh phép chữa bệnh của sách Phúc Âm, “chữa lành” chuyển tải rõ nghĩa của θεραπεύω và tự nhiên hơn cách diễn đạt thuần y khoa.
- source_word: αὐτοὺς
  choice: họ
  rationale: Đại từ số nhiều quy chiếu về dân chúng; “họ” là cách chuyển ngữ trực tiếp và tự nhiên.
- source_word: ἐκεῖ
  choice: tại đó
  rationale: Giữ nguyên ý nghĩa địa điểm đơn giản của trạng từ Hy Lạp, đồng thời phù hợp với văn phong kể chuyện trang trọng.
- source_word: καὶ ... καὶ
  choice: '[liên kết câu] ... và'
  rationale: καί đầu câu nối với câu trước, còn καί thứ hai liên kết hai hành động; tiếng Việt không cần giữ máy móc cả hai từ “và”, nên chỉ biểu đạt từ thứ hai để câu tự nhiên mà vẫn bảo toàn quan hệ liên kết.
theological_decisions: []
