  register: Tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Cấu trúc câu gọn, giữ nhịp kể song hành của nguyên văn; dùng “Ngài” để quy chiếu Chúa Giê-su theo lối tôn kính quen thuộc.
