source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτοῖς· Οὐ πάντες χωροῦσι τὸν λόγον ⸀τοῦτον ἀλλ’ οἷς δέδοται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/011.yaml
  text: But he said to them[a], “Not everyone can accept this word[b], but only those to whom it has been given.”
translation:
  language: vi
  text: 'Nhưng Ngài nói với họ: “Không phải ai cũng có thể tiếp nhận lời này[a], nhưng chỉ những người được ban cho khả năng ấy.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “lời nói này”, “điều này” hoặc “sự dạy dỗ này”.
    reason: lexical_alternative
  - marker: b
    text: Cụm từ “được ban cho” có lẽ ngụ ý Đức Chúa Trời là Đấng ban khả năng tiếp nhận lời này, nhưng nguyên văn Hy Lạp không nói rõ chủ thể.
    reason: alternative_reading
lexical_decisions:
- source_word: εἶπεν
  choice: nói
  rationale: Động từ dẫn lời ở thì aorist; “nói” là cách diễn đạt tự nhiên và trung tính trong văn kể chuyện.
- source_word: Οὐ πάντες
  choice: Không phải ai cũng
  rationale: Cách nói tự nhiên trong tiếng Việt, giữ đúng ý phủ định tính phổ quát chứ không phủ định mọi người.
- source_word: χωροῦσι
  choice: có thể tiếp nhận
  rationale: Trong kết hợp với λόγον, χωρέω mang ý có chỗ cho, đón nhận hoặc chấp nhận một lời dạy; “có thể tiếp nhận” vừa rõ nghĩa vừa giữ sắc thái về khả năng.
- source_word: τὸν λόγον τοῦτον
  choice: lời này
  rationale: Chỉ lời tuyên bố vừa nêu trước đó; “lời này” giữ liên hệ từ vựng với λόγος mà vẫn trang trọng, dễ hiểu.
- source_word: ἀλλ’ οἷς
  choice: mà chỉ những người
  rationale: Diễn đạt rõ lực giới hạn của mệnh đề tương phản trong tiếng Việt tự nhiên.
- source_word: δέδοται
  choice: được ban cho điều ấy
  rationale: Giữ thể bị động và sắc thái kết quả hiện tại của thì hoàn thành; không nêu chủ thể ban vì tiếng Hy Lạp cũng để chủ thể hàm ẩn.
theological_decisions:
- issue: Chủ thể hàm ẩn của thể bị động δέδοται
  choice: Giữ thể bị động “được ban cho” mà không nêu Đức Chúa Trời trong chính văn.
  alternative: “mà chỉ những người được Đức Chúa Trời ban cho khả năng ấy”
  rationale: Ngữ cảnh có thể gợi đến lối bị động chỉ hành động của Đức Chúa Trời, nhưng nguyên văn không nói rõ chủ thể. Giữ thể bị động bảo tồn sự hàm ẩn và tránh thêm một xác định thần học không được phát biểu trực tiếp.
- issue: Điều được ban trong δέδοται
  choice: Dùng đại từ “điều ấy” để quy chiếu về khả năng tiếp nhận lời này mà không giải nghĩa quá mức.
  alternative: “được ban cho khả năng tiếp nhận lời ấy”
  rationale: Nguyên văn lược bỏ bổ ngữ của “được ban”; cách dịch chính giữ sự cô đọng, còn chú thích làm rõ cách hiểu có khả năng nhất.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “Ngài” làm đại từ chỉ Chúa Giê-su theo văn phong Kinh Thánh phổ thông; cấu trúc phủ định “không phải ai cũng” tránh cách hiểu sai rằng không một ai có thể tiếp nhận.
