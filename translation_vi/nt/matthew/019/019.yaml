  text: Τίμα τὸν πατέρα καὶ τὴν μητέρα, καὶ Ἀγαπήσεις τὸν πλησίον σου ὡς σεαυτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/019.yaml
  text: Honor your father and mother[a], and love your neighbor as yourself.
translation:
  language: vi
  text: Hãy hiếu kính cha mẹ, và hãy yêu người lân cận như chính mình.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc, giữ hình thức tương lai hơn: “Hãy hiếu kính cha mẹ, và bạn sẽ yêu người lân cận như chính mình.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τίμα
  choice: Hãy hiếu kính
  rationale: Động từ τιμάω ở đây nhắc lại lời răn trong Mười Điều Răn, nói đến việc dành cho cha mẹ sự kính trọng và đối xử xứng đáng; “hiếu kính” tự nhiên trong văn cảnh Kinh Thánh và mạnh hơn ý chỉ tôn trọng trong lòng.
- source_word: τὸν πατέρα καὶ τὴν μητέρα
  choice: cha mẹ ngươi
  rationale: Dù tiếng Hy Lạp dùng mạo từ chứ không ghi đại từ sở hữu, công thức của điều răn và lời nói trực tiếp đòi hỏi nghĩa “cha mẹ ngươi”. Cách gộp “cha mẹ” là tự nhiên trong tiếng Việt hiện đại.
- source_word: Ἀγαπήσεις
  choice: hãy yêu
  rationale: Đây là thể tương lai dùng theo lối diễn đạt điều răn khi trích dẫn Luật pháp. Dịch bằng mệnh lệnh giúp giữ lực truyền khiến và song hành tự nhiên với “Hãy hiếu kính”; dạng sát hình thức hơn được ghi ở chú thích.
- source_word: τὸν πλησίον σου
  choice: người lân cận
  rationale: Trong văn cảnh đạo đức và lời trích Lê-vi 19:18, πλησίον chỉ người có quan hệ cận kề với một người, theo cách gọi Kinh Thánh quen thuộc, không chỉ người ở gần về địa lý.
- source_word: ὡς σεαυτόν
  choice: như chính mình
  rationale: Cách dịch ngắn gọn này giữ nguyên phép so sánh của nguyên văn, không thêm động từ hoặc lời giải thích không được nói rõ.
theological_decisions:
- issue: Cách dịch các hình thức truyền khiến trong lời trích các điều răn
  choice: 'Dùng hai cấu trúc mệnh lệnh: “Hãy hiếu kính ... và hãy yêu ...”'
  alternative: “Hãy hiếu kính cha mẹ ngươi, và ngươi sẽ yêu người lân cận như chính mình.”
  rationale: Nguyên văn kết hợp mệnh lệnh Τίμα với tương lai chỉ định Ἀγαπήσεις do lối trích dẫn Luật pháp. Trong tiếng Việt hiện đại, hai mệnh lệnh truyền đạt rõ nhất chức năng của cả hai vế, còn hình thức tương lai sát chữ được bảo tồn trong chú thích để không che khuất đặc điểm của nguyên văn.
translation_notes:
  register: Văn phong trang trọng, rõ ràng và dễ hiểu. “Hiếu kính” giữ âm hưởng điều răn; “ngươi” duy trì lời nói trực tiếp ở số ít và phù hợp văn phong Kinh Thánh trang nghiêm mà không quá cổ. Dấu chú thích [a] xuất hiện trong chính văn.
