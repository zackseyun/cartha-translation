  text: πάλιν δὲ λέγω ὑμῖν, εὐκοπώτερόν ἐστιν κάμηλον διὰ ⸀τρυπήματος ῥαφίδος ⸀εἰσελθεῖν ἢ πλούσιον ⸂εἰς τὴν βασιλείαν τοῦ θεοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/024.yaml
  text: Again I tell you[b][a], it is easier for a camel to go through the eye of a needle than for a rich man to enter into the kingdom of God.
translation:
  language: vi
  text: 'Ta lại bảo anh em: Lạc đà chui qua lỗ kim còn dễ hơn người giàu vào Nước Đức Chúa Trời.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Có người đề nghị hiểu là “dây thừng” thay vì “lạc đà”, nhưng bản văn Hy Lạp ở đây đọc “lạc đà”.
    reason: alternative_reading
lexical_decisions:
- source_word: πάλιν δὲ λέγω ὑμῖν
  choice: Ta lại nói với các con
  rationale: πάλιν diễn tả sự lặp lại; δέ là liên từ nhẹ nên không cần dịch riêng. Cách xưng hô này tự nhiên trong lời Đức Giê-su nói trực tiếp với các môn đồ và giữ sắc thái trang trọng.
- source_word: εὐκοπώτερόν ἐστιν
  choice: còn dễ hơn
  rationale: Dạng so sánh được diễn đạt tự nhiên trong tiếng Việt bằng cấu trúc “còn dễ hơn”.
- source_word: κάμηλον
  choice: con lạc đà
  rationale: Bản văn Hy Lạp đọc κάμηλον, nghĩa là “lạc đà”; không đổi thành “dây thừng” hoặc làm nhẹ hình ảnh cường điệu.
- source_word: διὰ τρυπήματος ῥαφίδος εἰσελθεῖν
  choice: chui qua lỗ kim
  rationale: Cụm từ chỉ việc đi xuyên qua lỗ của một cây kim khâu. “Chui qua lỗ kim” rõ nghĩa, sinh động và tự nhiên trong tiếng Việt.
- source_word: ἢ πλούσιον
  choice: hơn người giàu
  rationale: πλούσιον chỉ một người giàu; tiếng Việt không buộc phải biểu thị giống và “người giàu” giữ được ý nghĩa đại diện.
- source_word: εἰς τὴν βασιλείαν τοῦ θεοῦ
  choice: vào vương quốc của Đức Chúa Trời
  rationale: Giữ hình ảnh đi vào βασιλεία và dịch nhất quán cụm từ trung tâm “vương quốc của Đức Chúa Trời”.
theological_decisions:
- issue: Ý nghĩa hình ảnh lạc đà và lỗ kim
  choice: Giữ nguyên phép so sánh cường điệu về một điều cực kỳ bất khả thi đối với con người, không giải thích ngay trong câu.
  alternative: Hiểu “lỗ kim” là tên một cổng nhỏ tại Giê-ru-sa-lem, hoặc đổi “lạc đà” thành “dây thừng”.
  rationale: Bản văn Hy Lạp trình bày trực tiếp hình ảnh lạc đà và lỗ kim; không có cơ sở văn bản để làm nhẹ nghịch lý. Mạch văn kế tiếp mới nêu vai trò của Đức Chúa Trời.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “chui qua lỗ kim” để tái hiện hình ảnh cụ thể; không đưa giả thuyết “cổng Lỗ Kim” vào bản dịch. Đại từ “Ta—các con” phù hợp lời Đức Giê-su nói với các môn đồ trong văn phong Kinh Thánh phổ thông.
