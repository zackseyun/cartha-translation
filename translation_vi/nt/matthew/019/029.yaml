id: MAT.19.29
reference: Matthew 19:29
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ πᾶς ⸀ὅστις ἀφῆκεν ⸂οἰκίας ἢ⸃ ἀδελφοὺς ἢ ἀδελφὰς ἢ πατέρα ἢ μητέρα ἢ ⸂γυναῖκα ἢ⸃ τέκνα ἢ ⸀ἀγροὺς ἕνεκεν τοῦ ⸂ὀνόματός μου⸃, ⸀ἑκατονταπλασίονα λήμψεται καὶ ζωὴν αἰώνιον κληρονομήσει.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/029.yaml
  text: And everyone who has left houses or brothers or sisters or father or mother or wife or children or fields for the sake of my name will receive a hundredfold and will inherit eternal life[a].
translation:
  language: vi
  text: Và bất cứ ai đã bỏ lại nhà cửa, anh em trai, chị em gái, cha, mẹ, vợ[a], con cái hoặc ruộng đất vì danh ta, thì sẽ nhận được gấp trăm lần và sẽ thừa hưởng sự sống đời đời.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Một số bản chép tay không có “vợ”.
    reason: textual_variant
lexical_decisions:
- source_word: πᾶς ὅστις
  choice: bất cứ ai
  rationale: 'Diễn đạt tự nhiên tính khái quát và phân phối của cụm Hy Lạp: mỗi người hội đủ điều kiện được nói đến.'
- source_word: ἀφῆκεν
  choice: đã bỏ lại
  rationale: Giữ ý về một hành động rời khỏi người thân hoặc tài sản mà không thêm sắc thái lên án mạnh như “ruồng bỏ”.
- source_word: οἰκίας
  choice: nhà cửa
  rationale: Cách nói số nhiều mang tính tập hợp tự nhiên trong tiếng Việt, đồng thời giữ phương diện nhà ở và tài sản.
- source_word: ἀδελφοὺς ἢ ἀδελφὰς
  choice: anh em trai, chị em gái
  rationale: Phân biệt hai nhóm thân thuộc được nguyên văn nêu riêng, thay vì gộp thành một từ chung.
- source_word: πατέρα ἢ μητέρα ἢ γυναῖκα ἢ τέκνα
  choice: cha, mẹ, vợ, con cái
  rationale: Giữ nguyên các quan hệ gia đình trong danh sách; trong ngữ cảnh này γυνή chỉ người vợ.
- source_word: ἀγρούς
  choice: ruộng đất
  rationale: Diễn đạt tự nhiên đất đai canh tác và phương diện tài sản kinh tế, không thu hẹp thành một loại ruộng cụ thể.
- source_word: ἕνεκεν τοῦ ὀνόματός μου
  choice: vì danh ta
  rationale: Giữ thành ngữ “danh ta” cùng ý về động cơ và lòng trung thành đối với chính Chúa Giê-su, thay vì giản lược thành “vì ta”.
- source_word: ἑκατονταπλασίονα
  choice: gấp trăm lần
  rationale: Truyền đạt trực tiếp mức độ một trăm lần bằng tiếng Việt hiện đại và tự nhiên.
- source_word: ζωὴν αἰώνιον κληρονομήσει
  choice: sẽ thừa hưởng sự sống đời đời
  rationale: Giữ hình ảnh nhận phần gia nghiệp trong động từ κληρονομέω và cách gọi quen thuộc nhưng rõ nghĩa cho ζωὴ αἰώνιος.
theological_decisions:
- issue: Ý nghĩa của γυνή trong danh sách từ bỏ vì môn đồ hóa
  choice: vợ
  alternative: người phụ nữ
  rationale: Danh sách nói về các quan hệ gia đình và tài sản, nên “vợ” phù hợp với nghĩa quan hệ của từ trong ngữ cảnh mà không hàm ý từ bỏ phụ nữ nói chung.
- issue: Giữ thành ngữ ἕνεκεν τοῦ ὀνόματός μου
  choice: vì danh ta
  alternative: vì ta
  rationale: Bản dịch giữ nguyên sức nặng của “danh”, vốn chỉ con người, thẩm quyền và căn tính được tuyên xưng của Chúa Giê-su, mà không giải nghĩa quá mức.
- issue: Tính chất của lời hứa ἑκατονταπλασίονα
  choice: gấp trăm lần
  alternative: gấp trăm
  rationale: Cách dịch giữ nguyên sức mạnh định lượng của nguyên văn mà không tự quyết định lời hứa phải được hiểu theo nghĩa vật chất, biểu tượng hay cánh chung.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Dùng “ta” theo lời trực tiếp của Chúa Giê-su; cấu trúc “thì… và sẽ…” giúp câu dài sáng rõ mà vẫn bám sát chuỗi ý của nguyên văn.
