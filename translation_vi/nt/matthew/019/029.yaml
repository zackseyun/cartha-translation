  verdict: revise
  source_fidelity: Bản dịch truyền đạt đúng chuỗi đối tượng được từ bỏ, động cơ “vì danh ta,” lời hứa nhận lại gấp trăm, và việc thừa hưởng sự sống đời đời. Tuy nhiên, γυναῖκα (“vợ”) được SBLGNT đặt trong ngoặc do có biến thể bản văn; cần có chú thích để không che giấu điểm bất định này.
  naturalness: Câu văn hiện đại, trang trọng và tự nhiên. “Bất cứ ai đã bỏ lại … thì sẽ …” diễn đạt tốt mệnh đề quan hệ khái quát; “nhà cửa,” “ruộng đất,” và “gấp trăm lần” đều thông dụng.
  terminology: “Vợ” phù hợp với ngữ cảnh danh sách quan hệ gia đình; “vì danh ta” bảo lưu thành ngữ về “danh”; “thừa hưởng sự sống đời đời” giữ được sắc thái κληρονομήσει. Đại từ “ta” nhất quán với lời trực tiếp của Chúa Giê-su trong văn phong Kinh Thánh hiện đại.
