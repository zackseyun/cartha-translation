  source_fidelity: 'Bản dịch chuyển tải đầy đủ các thành tố của Hy văn: công thức long trọng Ἀμήν; nhóm người “đã theo tôi”; bối cảnh tương lai của ἐν τῇ παλιγγενεσίᾳ; việc Con Người ngự trên ngai vinh hiển; lời hứa các môn đồ cũng sẽ ngồi trên mười hai ngai; và hành động xét xử mười hai chi phái Israel. “Cuộc đổi mới” là lựa chọn thận trọng cho παλιγγενεσία, không thêm “muôn vật” vốn không có trực tiếp trong câu và không ép nghĩa tái sinh cá nhân.'
  naturalness: Câu tiếng Việt hiện đại, rõ ràng và giữ được sắc thái trang trọng thích hợp. Cách đặt “Trong cuộc đổi mới, khi...” làm sáng rõ đây là khung cảnh thời gian của lời hứa cánh chung. Cặp xưng hô “tôi—anh em” tự nhiên trong lời nói trực tiếp; “phán”, “ngự”, và “ngai” duy trì đăng ký Kinh Thánh vừa phải.
  terminology: “Đức Giê-su,” “Con Người,” “ngai vinh hiển,” “xét xử,” và “mười hai chi phái Israel” đều nhất quán, chính xác và phù hợp với cách dùng tiếng Việt Kinh Thánh hiện đại. Chú thích a nêu các khả năng từ vựng của παλιγγενεσία mà không biến một cách hiểu thành giáo lý; chú thích b bảo lưu sắc thái cai trị/quản trị có thể có của κρίνοντες. Các ký hiệu chú thích đều được neo đúng vào cụm từ được giải thích.
