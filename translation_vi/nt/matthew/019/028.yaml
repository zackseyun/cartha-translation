id: MAT.19.28
reference: Matthew 19:28
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς εἶπεν αὐτοῖς· Ἀμὴν λέγω ὑμῖν ὅτι ὑμεῖς οἱ ἀκολουθήσαντές μοι ἐν τῇ παλιγγενεσίᾳ, ὅταν καθίσῃ ὁ υἱὸς τοῦ ἀνθρώπου ἐπὶ θρόνου δόξης αὐτοῦ, ⸀καθήσεσθε καὶ ⸀ὑμεῖς ἐπὶ δώδεκα θρόνους κρίνοντες τὰς δώδεκα φυλὰς τοῦ Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/028.yaml
  text: And Jesus said to them[a], “Truly I say to you, you who have followed me will also sit on twelve thrones in the renewal, when the Son of Man sits on the throne of his glory[b], judging the twelve tribes of Israel.”
translation:
  language: vi
  text: 'Đức Giê-su phán với họ: “Thật, tôi bảo anh em: Trong cuộc đổi mới[a], khi Con Người ngự trên ngai vinh hiển của mình, anh em là những người đã theo tôi cũng sẽ ngồi trên mười hai ngai mà xét xử[b] mười hai chi phái Israel.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “trong sự tái tạo”, “trong thế giới mới” hoặc “trong sự tái sinh”. Ở đây, từ này rất có thể chỉ cuộc đổi mới trong tương lai gắn với sự trị vì của Con Người, chứ không phải sự tái sinh của từng cá nhân.
    reason: lexical_alternative
  - marker: b
    text: “Xét xử” cũng có thể hàm ý thực thi quyền cai trị hoặc quản trị.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀμὴν
  choice: Thật
  rationale: Giữ sức nặng của công thức mở đầu một lời tuyên bố long trọng và có thẩm quyền, đồng thời dùng cách nói tự nhiên trong tiếng Việt hiện đại.
- source_word: ἀκολουθήσαντές μοι
  choice: anh em là những người đã theo tôi
  rationale: Diễn đạt phân từ aorist như đặc điểm nhận diện những người được nói với, đồng thời giữ rõ đối tượng trực tiếp “tôi”.
- source_word: παλιγγενεσίᾳ
  choice: trong cuộc đổi mới
  rationale: Từ này có thể chỉ sự tái sinh hay đổi mới; trong văn cảnh đăng quang và xét xử ở tương lai, “cuộc đổi mới” truyền đạt ý nghĩa cánh chung mà không thêm cụm “muôn vật” vốn không hiện diện trực tiếp trong nguyên văn.
- source_word: ὅταν καθίσῃ
  choice: khi ... ngự
  rationale: Mệnh đề ὅταν với động từ aorist subjunctive chỉ một biến cố tương lai. “Khi ... ngự” tự nhiên trong tiếng Việt và phù hợp với bối cảnh ngai vua.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Con Người
  rationale: Giữ danh hiệu truyền thống cùng âm hưởng Đa-ni-ên và Đấng Mê-si-a, không diễn giải thêm.
- source_word: ἐπὶ θρόνου δόξης αὐτοῦ
  choice: trên ngai vinh hiển của mình
  rationale: Giữ tương đối sát kết cấu sở hữu của tiếng Hy Lạp và sắc thái trang trọng.
- source_word: καθήσεσθε καὶ ὑμεῖς
  choice: anh em ... cũng sẽ ngồi
  rationale: Giữ thì tương lai và sắc thái “cũng”, tạo sự tương ứng với việc Con Người ngự trên ngai.
- source_word: ἐπὶ δώδεκα θρόνους
  choice: trên mười hai ngai
  rationale: Cách dịch trực tiếp, rõ ràng và tự nhiên của cụm giới từ.
- source_word: κρίνοντες
  choice: xét xử
  rationale: Giữ nghĩa trực tiếp về thi hành phán xét; sắc thái cai trị có thể hàm chứa được ghi ở chú thích thay vì đưa thẳng vào chính văn.
- source_word: τὰς δώδεκα φυλὰς τοῦ Ἰσραήλ
  choice: mười hai chi phái Israel
  rationale: “Chi phái” là cách gọi rõ và quen thuộc đối với các bộ tộc lịch sử của Israel; giữ tên riêng Israel theo dạng quốc tế, trung lập giữa các truyền thống phiên âm tiếng Việt.
theological_decisions:
- issue: Ý nghĩa của παλιγγενεσία trong văn cảnh này
  choice: cuộc đổi mới trong tương lai gắn với sự trị vì của Con Người
  alternative: sự tái sinh của cá nhân; thời đại mới; thế giới mới
  rationale: Văn cảnh trực tiếp nói đến việc Con Người ngự ngai và các môn đồ xét xử trong tương lai, không nói đến sự cải hóa cá nhân. Bản dịch giữ nghĩa cánh chung nhưng không áp đặt một hệ thống thiên niên kỷ hay khuôn khổ giáo phái cụ thể.
- issue: Phạm vi ý nghĩa của κρίνοντες
  choice: xét xử
  alternative: cai trị; quản trị
  rationale: Động từ có thể bao gồm chức năng cai trị, nhưng nghĩa trực tiếp là xét xử. Chính văn giữ nghĩa này, còn chú thích cho biết sắc thái rộng hơn để không giải quyết thay sự căng thẳng của nguyên văn.
- issue: Quan hệ cú pháp của ἐν τῇ παλιγγενεσίᾳ
  choice: chỉ bối cảnh thời gian của lời hứa ngồi trên các ngai
  alternative: gắn trực tiếp với hành động đã theo Đức Giê-su
  rationale: Mạch văn và mệnh đề tiếp theo về lúc Con Người ngự ngai ủng hộ cách hiểu đây là bối cảnh cánh chung của lời hứa. Việc đặt cụm này đầu mệnh đề giúp tiếng Việt sáng rõ mà không thêm nội dung.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Giê-su”, “Con Người” và “ngai” để giữ sắc thái Kinh Thánh mà không quá cổ; cặp xưng hô “tôi—anh em” tự nhiên trong lời dạy trực tiếp. Các dấu chú thích được đặt ngay sau những từ ngữ mà chú thích giải thích.
