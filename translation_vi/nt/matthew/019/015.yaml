reference: Matthew 19:15
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἐπιθεὶς ⸂τὰς χεῖρας αὐτοῖς⸃ ἐπορεύθη ἐκεῖθεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/015.yaml
  text: And after laying his hands on them[a], he went on from there.
translation:
  language: vi
  text: Rồi sau khi đặt tay trên họ, Ngài rời khỏi nơi đó.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: Rồi
  rationale: Trong mạch kể chuyện, καί nối hành động này với sự việc trước; “Rồi” diễn đạt tự nhiên sự tiếp nối mà không thêm quan hệ nhân quả.
- source_word: ἐπιθεὶς
  choice: sau khi đặt
  rationale: Phân từ bất định quá khứ của ἐπιτίθημι diễn tả hành động xảy ra trước động từ chính; “sau khi đặt” giữ rõ trình tự ấy trong tiếng Việt.
- source_word: τὰς χεῖρας αὐτοῖς
  choice: tay trên họ
  rationale: Cụm ἐπιτίθημι τὰς χεῖρας với tặng cách chỉ hành động đặt tay trên người nào. Tiếng Việt tự nhiên không cần thêm đại từ sở hữu vì chủ thể là Chúa Giê-su đã rõ từ ngữ cảnh.
- source_word: ἐπορεύθη
  choice: Ngài rời khỏi
  rationale: Ở đây πορεύομαι nói đến việc đi khỏi địa điểm đang ở. “Rời khỏi” tự nhiên và phù hợp với trạng từ chỉ nơi xuất phát đi kèm.
- source_word: ἐκεῖθεν
  choice: nơi đó
  rationale: Kết hợp với “rời khỏi”, “nơi đó” diễn đạt rõ nghĩa ‘từ đó/từ nơi ấy’ mà không lặp giới từ một cách nặng nề.
theological_decisions:
- issue: Bản chất hành động đặt tay của Chúa Giê-su
  choice: Giữ hành động cụ thể “đặt tay trên họ” trong câu chính.
  alternative: Diễn giải thành “ban phước cho họ”.
  rationale: Nguyên văn nói rõ hành động đặt tay; ngữ cảnh cho thấy ý ban phước, nhưng thay thế bằng kết quả được suy ra sẽ diễn giải quá mức và có thể làm mất hình ảnh cụ thể của câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” để chỉ Chúa Giê-su theo ngữ cảnh; câu tiếng Việt giữ trình tự hành động của nguyên văn mà không gán ý nghĩa bí tích hay nghi thức cho việc đặt tay.
