  verdict: revise
  source_fidelity: 'Bản dịch truyền đạt đúng diễn tiến và quan hệ nhân quả của nguyên văn: nghe lời ấy, người thanh niên ra đi trong buồn rầu, vì có nhiều tài sản. Không thêm danh xưng “người cai trị,” phù hợp với νεανίσκος. Tuy nhiên, “bỏ đi” có thể gợi sắc thái bỏ mặc/từ bỏ mạnh hơn động từ ἀπῆλθεν, vốn chỉ việc ra đi.'
