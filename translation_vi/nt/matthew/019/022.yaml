  terminology: “Người thanh niên,” “lời ấy,” và “nhiều tài sản” phù hợp với từ vựng Hy Lạp và tiếng Việt hiện đại. Trong chú thích, cách viết “Đức Chúa Jêsus” không phải chính tả hiện hành phổ biến của tiếng Việt hiện đại; dùng “Chúa Giê-su” là nhất quán hơn với biến thể mục tiêu.
  issues:
