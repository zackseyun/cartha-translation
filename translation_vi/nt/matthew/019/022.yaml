    rationale: ἀπῆλθεν đơn giản là “ra đi/rời đi.” “Bỏ đi” đôi khi hàm ý bỏ mặc hoặc từ bỏ, không cần thiết trong câu này.
  - severity: low
    issue: Chú thích a dùng cách viết tên riêng không theo chính tả hiện đại phổ biến.
    rationale: Mục tiêu là tiếng Việt chuẩn hiện đại; “Giê-su” là dạng chính tả hiện hành, tự nhiên hơn “Jêsus.”
