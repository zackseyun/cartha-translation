- from: Nhưng khi nghe lời ấy[a], người thanh niên buồn rầu bỏ đi[b], vì anh ta có nhiều tài sản[c].
  to: Nhưng khi nghe lời ấy[a], người thanh niên ra đi trong buồn rầu[b], vì anh ta có nhiều tài sản[c].
  rationale: Đổi “buồn rầu bỏ đi” thành “ra đi trong buồn rầu” để dịch trực tiếp hơn động từ ra đi và phân từ chỉ trạng thái đi kèm, không thêm sắc thái “bỏ” mạnh hơn nguyên văn. Chuẩn hóa tên riêng trong chú thích theo tiếng Việt hiện đại. Các lựa chọn còn lại được giữ vì trung thành với SBLGNT và tự nhiên trong tiếng Việt.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T05:40:46Z'
