source:
  edition: SBLGNT
  text: ἀκούσας δὲ ὁ νεανίσκος τὸν ⸀λόγον ἀπῆλθεν λυπούμενος, ἦν γὰρ ἔχων κτήματα πολλά.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/022.yaml
  text: But when the young man heard this word[a], he went away grieving[c][b], for he had many possessions.
translation:
  language: vi
  text: Nhưng khi nghe lời ấy[a], người thanh niên ra đi trong buồn rầu[b], vì anh ta có nhiều tài sản[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “điều ấy.” Nguyên văn Hy Lạp là “lời ấy,” chỉ lời Chúa Giê-su vừa phán.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “buồn rầu.” Phân từ Hy Lạp mô tả trạng thái buồn đau của anh khi ra đi.'
    reason: lexical_alternative
  - marker: c
    text: 'Theo sát nguyên văn: “nhiều vật sở hữu.” Từ Hy Lạp nhấn mạnh số lượng tài sản.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσας
  choice: khi nghe
  rationale: Phân từ bất định quá khứ diễn tả thời điểm và trình tự; “khi nghe” tự nhiên trong tiếng Việt mà vẫn giữ quan hệ với hành động bỏ đi.
- source_word: δὲ
  choice: Nhưng
  rationale: δέ đánh dấu bước chuyển có sắc thái tương phản nhẹ giữa lời Đức Chúa Jêsus vừa phán và phản ứng tiêu cực của người thanh niên.
- source_word: νεανίσκος
  choice: người thanh niên
  rationale: Danh từ chỉ một người nam trẻ tuổi. Không thêm “quan chức” hay “người cai trị,” vì thông tin ấy không có trong câu Hy Lạp của Ma-thi-ơ.
- source_word: τὸν λόγον
  choice: lời ấy
  rationale: Trong ngữ cảnh, λόγος chỉ lời Đức Chúa Jêsus vừa phán. “Lời ấy” vừa sát nguyên văn vừa rõ ràng trong tiếng Việt.
- source_word: ἀπῆλθεν
  choice: bỏ đi
  rationale: Diễn đạt tự nhiên hành động rời khỏi nơi đó; trong ngữ cảnh, “bỏ đi” thể hiện việc anh ra đi sau khi nghe lời phán mà không bổ sung nguyên nhân ngoài câu.
- source_word: λυπούμενος
  choice: buồn rầu
  rationale: Phân từ hiện tại mô tả trạng thái buồn đau đi kèm lúc anh ra đi. “Buồn rầu” tự nhiên và không giới hạn nghĩa vào nỗi đau tang chế.
- source_word: ἦν γὰρ ἔχων
  choice: vì anh ta có
  rationale: Cấu trúc quanh động từ ở thì chưa hoàn thành mô tả tình trạng sở hữu kéo dài; tiếng Việt diễn đạt tự nhiên bằng “có.” γάρ được giữ bằng “vì.”
- source_word: κτήματα πολλά
  choice: nhiều tài sản
  rationale: κτήματα chỉ tài sản hoặc những vật sở hữu, còn πολλά nhấn mạnh số lượng. “Nhiều tài sản” bảo toàn điểm nhấn ấy, thay vì chuyển thành mức độ lớn lao.
theological_decisions:
- issue: Có nên thêm danh xưng “người cai trị” từ trình thuật song song hay không
  choice: Chỉ dịch νεανίσκος là “người thanh niên”
  alternative: người thanh niên làm quan; người cai trị trẻ tuổi
  rationale: Bản Hy Lạp của câu này chỉ gọi nhân vật là một người thanh niên. Thêm địa vị của anh từ Lu-ca sẽ hòa phối các sách thay vì dịch trực tiếp Ma-thi-ơ.
translation_notes:
  register: 'Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Cấu trúc câu giữ diễn tiến của nguyên bản: nghe lời phán, buồn rầu bỏ đi, rồi nêu lý do. Đại từ “anh ta” dùng để tránh lặp nặng nề mà không biểu thị thái độ khinh miệt.'
