id: MAT.19.26
reference: Matthew 19:26
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐμβλέψας δὲ ὁ Ἰησοῦς εἶπεν αὐτοῖς· Παρὰ ἀνθρώποις τοῦτο ἀδύνατόν ἐστιν, παρὰ δὲ θεῷ πάντα δυνατά.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/026.yaml
  text: But Jesus looked at them and said to them[a], “With men this is impossible, but with God all things are possible.”
translation:
  language: vi
  text: 'Nhưng Đức Giê-su nhìn các môn đồ và nói: “Đối với loài người, điều này là không thể; nhưng đối với Đức Chúa Trời, mọi sự đều có thể.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐμβλέψας
  choice: nhìn các môn đồ
  rationale: Động từ ἐμβλέπω diễn tả việc hướng ánh nhìn vào người nào đó. Tiếng Việt cần nêu đối tượng tự nhiên hơn lối dịch sát “nhìn họ”; trong văn cảnh, αὐτοῖς chỉ các môn đồ.
- source_word: δὲ
  choice: Nhưng
  rationale: δέ đánh dấu sự tương phản nhẹ giữa nỗi băn khoăn của các môn đồ ở câu trước và lời đáp của Đức Giê-su.
- source_word: εἶπεν αὐτοῖς
  choice: và nói
  rationale: Đối tượng αὐτοῖς đã được thể hiện trong cụm “nhìn các môn đồ”; lặp lại “nói với họ” sẽ nặng nề trong tiếng Việt, còn quan hệ hướng đến họ vẫn rõ.
- source_word: παρὰ ἀνθρώποις
  choice: Đối với loài người
  rationale: παρά với cách ba chỉ phạm vi hoặc phía mà sự việc được xét. ἄνθρωποις nói chung về nhân loại, nên “loài người” vừa bao quát vừa tạo thế đối xứng trang trọng với Đức Chúa Trời.
- source_word: τοῦτο
  choice: điều này
  rationale: Đại từ chỉ định quy chiếu đến vấn đề đang được bàn trong văn cảnh trước đó; “điều này” là tự nhiên và chính xác.
- source_word: ἀδύνατόν ἐστιν
  choice: là không thể
  rationale: Cách diễn đạt trực tiếp, tự nhiên, giữ nguyên tính tuyệt đối của vị ngữ ἀδύνατον.
- source_word: παρὰ δὲ θεῷ
  choice: nhưng đối với Đức Chúa Trời
  rationale: Lặp lại “đối với” để giữ cấu trúc song hành của hai cụm παρά + cách ba và làm nổi bật sự tương phản.
- source_word: πάντα δυνατά
  choice: mọi sự đều có thể
  rationale: Giữ phạm vi bao quát của πάντα và ý nghĩa của δυνατά bằng một thành ngữ Việt ngữ quen thuộc, trang trọng.
theological_decisions:
- issue: Ý nghĩa khái quát của ἀνθρώποις
  choice: loài người
  alternative: con người; người ta
  rationale: Danh từ số nhiều chỉ toàn thể con người nói chung, không riêng nam giới. “Loài người” bảo toàn sự đối lập giữa giới hạn của nhân loại và khả năng của Đức Chúa Trời mà không đưa thêm lập trường giáo phái.
- issue: Phạm vi của πάντα δυνατά
  choice: mọi sự đều có thể
  alternative: mọi việc đều khả thi
  rationale: Giữ nguyên phát biểu rộng của bản Hy Lạp và để văn cảnh xác định phạm vi, thay vì diễn giải hoặc giới hạn câu nói theo một hệ thần học cụ thể.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Giê-su” và “Đức Chúa Trời” theo lối gọi tôn kính phổ biến. Cấu trúc song hành “đối với… nhưng đối với…” phản ánh phép đối xứng của nguyên văn.
