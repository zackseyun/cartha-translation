id: MAT.19.1
reference: Matthew 19:1
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ὅτε ἐτέλεσεν ὁ Ἰησοῦς τοὺς λόγους τούτους, μετῆρεν ἀπὸ τῆς Γαλιλαίας καὶ ἦλθεν εἰς τὰ ὅρια τῆς Ἰουδαίας πέραν τοῦ Ἰορδάνου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/001.yaml
  text: And it happened that when Jesus had finished these words[a], he departed from Galilee and came into the region of Judea beyond the Jordan.
translation:
  language: vi
  text: 'Khi Đức Giê-su nói xong những lời ấy, Ngài rời Ga-li-lê và đến miền Giu-đê, ở bên kia sông Giô-đanh.[a]


    [a] Cũng có thể hiểu là “qua bên kia sông Giô-đanh.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể hiểu là “qua bên kia sông Giô-đanh.”
    reason: Giữ khả năng hiểu πέραν theo sắc thái chuyển động “qua bên kia”, bên cạnh cách hiểu vị trí “ở bên kia”. Dấu chú thích được đặt sau cụm từ liên quan thay vì sau “những lời ấy”.
lexical_decisions:
- source_word: Καὶ ἐγένετο
  choice: Khi
  rationale: Đây là công thức chuyển tiếp trong trình thuật. Tiếng Việt tự nhiên diễn đạt bằng mệnh đề thời gian “Khi...” thay vì dịch sát nhưng nặng nề là “Và xảy ra rằng”.
- source_word: ὅτε ἐτέλεσεν
  choice: nói xong
  rationale: Diễn tả việc Đức Giê-su hoàn tất bài giảng trước khi rời đi; “xong” thể hiện rõ hành động đã hoàn thành và hợp với cách nói tiếng Việt.
- source_word: τοὺς λόγους τούτους
  choice: những lời ấy
  rationale: Chỉ những lời Đức Giê-su vừa nói trong phần trước. “Những lời ấy” tự nhiên hơn “các lời này” trong mạch kể hồi chỉ.
- source_word: μετῆρεν
  choice: rời
  rationale: Động từ chỉ việc rời khỏi một nơi; “rời” ngắn gọn, trang trọng vừa phải và tự nhiên trong tiếng Việt hiện đại.
- source_word: ἀπὸ τῆς Γαλιλαίας
  choice: Ga-li-lê
  rationale: Trong cấu trúc “rời Ga-li-lê”, ý nghĩa xuất phát từ nơi này đã được động từ “rời” thể hiện đầy đủ.
- source_word: ἦλθεν εἰς
  choice: đến
  rationale: Diễn đạt chuyển động tới một địa điểm mới một cách tự nhiên; tiếng Việt không cần tái hiện riêng giới từ chỉ hướng của tiếng Hy Lạp.
- source_word: τὰ ὅρια τῆς Ἰουδαίας
  choice: miền Giu-đê
  rationale: ὅρια ở đây chỉ khu vực hoặc địa phận, không nhất thiết là một đường biên chính xác. “Miền” truyền đạt đúng nghĩa địa lý trong văn cảnh hành trình.
- source_word: πέραν τοῦ Ἰορδάνου
  choice: ở bên kia sông Giô-đanh
  rationale: Giữ ý nghĩa địa lý của πέραν là phía bên kia hoặc quá bên kia một con sông, đồng thời diễn đạt rõ ràng, tự nhiên trong tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện trang trọng vừa phải, dễ hiểu với độc giả tiếng Việt hiện đại. Dùng “Đức Giê-su” như cách gọi tên kính trọng thông dụng mà không thêm tước hiệu không có trong nguyên văn; đại từ “Ngài” duy trì sự tôn kính và giúp câu rõ chủ thể.
