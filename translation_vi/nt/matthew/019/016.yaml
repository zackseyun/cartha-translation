  text: Καὶ ἰδοὺ εἷς προσελθὼν ⸂αὐτῷ εἶπεν⸃· ⸀Διδάσκαλε, τί ἀγαθὸν ποιήσω ἵνα ⸀σχῶ ζωὴν αἰώνιον;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/016.yaml
  text: And behold[a], one who had come up to him said, “Teacher, what good thing must I do so that I may have eternal life?”
translation:
  language: vi
  text: 'Và kìa, có một người đến gần Đức Giê-su và nói: “Thưa Thầy, tôi phải làm điều tốt nào[a] để có sự sống đời đời?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “tôi phải làm việc lành nào…?” Cụm Hy Lạp τί ἀγαθὸν có thể chỉ một “điều tốt”, hoặc khi đi với động từ “làm”, hàm ý một “việc lành”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ ἰδοὺ
  choice: Và kìa
  rationale: Giữ cả liên từ καί và sắc thái thu hút sự chú ý, tạo tính sinh động cho lời kể.
- source_word: εἷς
  choice: có một người
  rationale: εἷς theo nghĩa đen là “một”; cách diễn đạt này tự nhiên trong tiếng Việt và không đưa thêm chi tiết rằng người ấy giàu hay trẻ từ ngữ cảnh về sau.
- source_word: προσελθὼν αὐτῷ εἶπεν
  choice: đến gần Đức Giê-su và nói
  rationale: Diễn đạt tự nhiên chuỗi hành động của phân từ bất định quá khứ rồi đến động từ chính; dùng “Đức Giê-su” để làm rõ đại từ αὐτῷ trong tiếng Việt.
- source_word: Διδάσκαλε
  choice: Thưa Thầy
  rationale: “Thầy” là cách xưng hô tự nhiên, trang trọng dành cho người dạy; “thưa” thể hiện chức năng hô cách.
- source_word: τί ἀγαθὸν
  choice: điều tốt nào
  rationale: Giữ cách nói mở của cụm trung tính số ít, có thể chỉ một điều tốt hoặc hàm ý một việc lành.
- source_word: ποιήσω
  choice: tôi phải làm
  rationale: Thể giả định trong câu hỏi cân nhắc được chuyển bằng “phải” để thể hiện lực thực tiễn của câu hỏi mà không áp đặt kết luận thần học.
- source_word: ἵνα σχῶ
  choice: để có
  rationale: “Để” giữ quan hệ mục đích của ἵνα; “có” là nghĩa trực tiếp của ἔχω, ít diễn giải hơn “đạt được”.
- source_word: ζωὴν αἰώνιον
  choice: sự sống đời đời
  rationale: Cách dịch quen thuộc, chính xác và trang trọng trong tiếng Việt.
theological_decisions:
- issue: Có nên xác định người nói là người đàn ông trẻ giàu có hay không
  choice: có một người
  alternative: một người đàn ông; một thanh niên giàu có
  rationale: Câu này chỉ dùng εἷς; không đưa sớm vào bản dịch những chi tiết chỉ xuất hiện trong phần sau hoặc các sách song song.
- issue: Sắc thái hành động trong câu hỏi về sự sống đời đời
  choice: tôi phải làm điều tốt nào để có sự sống đời đời?
  alternative: tôi nên làm việc lành nào để đạt được sự sống đời đời?
  rationale: Giữ nguyên định hướng hành động trong lời người hỏi nhưng không tự giải quyết căng thẳng thần học về công việc, công trạng hay sự cứu rỗi.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. “Và kìa” cố ý giữ nét sinh động của lời kể; “Thưa Thầy” là lối xưng hô tự nhiên. Dấu chú thích được đặt ngay sau câu hỏi mà chú thích giải thích.
