  source_fidelity: 'Bản dịch chuyển tải đúng các thành tố chính: Καὶ ἰδού (“Và kìa”), εἷς (“có một người”), hành động đến gần rồi nói, Διδάσκαλε (“Thưa Thầy”), câu hỏi τί ἀγαθὸν ποιήσω, quan hệ mục đích ἵνα, và ζωὴν αἰώνιον (“sự sống đời đời”). “Có một người” là cách Việt ngữ tự nhiên cho εἷς và không thêm các đặc điểm từ ngữ cảnh song song. Cách phối hợp “đến gần ... và nói” hơi làm phẳng quan hệ phân từ–động từ chính, nhưng vẫn truyền đạt đúng trình tự và không làm đổi nghĩa.'
