  terminology: “Đức Giê-su,” “Thầy,” và “sự sống đời đời” đều phù hợp với cách dùng Việt ngữ Cơ Đốc hiện đại và sát nghĩa. “Điều tốt” giữ tính mở của τί ἀγαθόν tốt hơn việc chỉ dịch là “việc lành”; chú thích nêu phương án này cách thận trọng.
