revisions:
- from: 'Bấy giờ, Đức Giê-su nói với các môn đồ của mình: “Thật, tôi nói với anh em: người giàu sẽ khó vào vương quốc thiên đàng.”'
  to: 'Rồi Giê-su nói với các môn đệ của mình: “Quả thật, tôi nói với anh em: người giàu sẽ khó vào Nước Trời.”'
  rationale: Chỉnh tối thiểu để tránh thêm tước hiệu vào tên riêng, phản ánh δέ như một chuyển tiếp tự sự thay vì mốc thời gian mạnh, và dùng thuật ngữ tiếng Việt tự nhiên, chuẩn mực cho «kingdom of heaven». Không cần chú thích vì câu nguồn không có dị bản hoặc mơ hồ văn bản đáng ghi chú.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T05:45:21Z'
review_pass:
  verdict: revise
  source_fidelity: Bản nháp truyền đạt đúng ý chính, gồm tính chất khó khăn (δυσκόλως), thì tương lai và công thức Ma-thi-ơ về vương quốc. Tuy nhiên, «Đức» không có trong Ἰησοῦς, và «Bấy giờ» dễ thêm một mốc thời gian rõ hơn lực liên kết δέ. «Vương quốc thiên đàng» cũng không phải cách diễn đạt chuẩn, tự nhiên nhất cho βασιλεία τῶν οὐρανῶν trong tiếng Việt Kinh Thánh.
  naturalness: «Vương quốc thiên đàng» nặng và kém tự nhiên trong tiếng Việt hiện đại. «Nước Trời» là cách gọi ngắn gọn, quen thuộc, và phù hợp với công thức đặc trưng của Ma-thi-ơ. «Quả thật, tôi nói với anh em» giữ được sắc thái long trọng mà vẫn rõ ràng.
  terminology: Dùng «Giê-su», không thêm tước hiệu không hiện diện trong nguồn; «môn đệ» và «Nước Trời» phù hợp thuật ngữ Tin Mừng hiện đại. «Người giàu» giữ tính khái quát của tính từ danh từ hóa số ít mà không thêm giới tính.
  issues:
  - severity: medium
    issue: Thêm «Đức» trước tên Giê-su
    rationale: Bản Hy Lạp chỉ có tên Ἰησοῦς. Dù là lối xưng hô tôn kính quen dùng, «Đức» là yếu tố bổ sung không được biểu thị trong câu nguồn.
  - severity: low
    issue: «Bấy giờ» diễn giải δέ theo thời điểm
    rationale: δέ chủ yếu nối/chuyển mạch; «Bấy giờ» có thể gợi một thời điểm cụ thể hơn. «Rồi» giữ sự tiếp diễn tự sự tự nhiên hơn.
  - severity: medium
    issue: «vương quốc thiên đàng» không tự nhiên và không nhất quán thuật ngữ
    rationale: Cụm này gượng trong tiếng Việt hiện đại. «Nước Trời» là tương đương thành ngữ Kinh Thánh tự nhiên của βασιλεία τῶν οὐρανῶν, vẫn bảo toàn khái niệm vương quyền.
  revised_text: 'Rồi Giê-su nói với các môn đệ của mình: “Quả thật, tôi nói với anh em: người giàu sẽ khó vào Nước Trời.”'
