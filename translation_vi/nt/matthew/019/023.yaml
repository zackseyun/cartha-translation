id: MAT.19.23
reference: Matthew 19:23
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ὁ δὲ Ἰησοῦς εἶπεν τοῖς μαθηταῖς αὐτοῦ· Ἀμὴν λέγω ὑμῖν ὅτι ⸂πλούσιος δυσκόλως⸃ εἰσελεύσεται εἰς τὴν βασιλείαν τῶν οὐρανῶν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/023.yaml
  text: Then Jesus said to his disciples[a], “Truly I say to you[b], a rich man will enter the kingdom of heaven with difficulty.”
translation:
  language: vi
  text: 'Rồi Giê-su nói với các môn đệ của mình: “Quả thật, tôi nói với anh em: người giàu sẽ khó vào Nước Trời.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: Bấy giờ
  rationale: Đánh dấu sự chuyển tiếp trong mạch kể; “Bấy giờ” tự nhiên và trang trọng trong tiếng Việt mà không làm liên từ trở nên quá nặng.
- source_word: Ἰησοῦς
  choice: Đức Giê-su
  rationale: Cách gọi tên tiêu chuẩn, trang trọng và quen thuộc trong văn phong Kinh Thánh tiếng Việt.
- source_word: εἶπεν
  choice: nói
  rationale: Tương ứng trực tiếp và tự nhiên với động từ dẫn lời trong văn kể.
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: với các môn đồ của mình
  rationale: Giữ rõ đại từ sở hữu αὐτοῦ; “môn đồ” diễn đạt đúng mối quan hệ thầy-trò trong bối cảnh Tin Mừng.
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: Thật, tôi nói với anh em
  rationale: Giữ cấu trúc long trọng và thẩm quyền của công thức mở đầu; “anh em” là cách xưng hô tự nhiên của Đức Giê-su với nhóm môn đồ.
- source_word: πλούσιος
  choice: người giàu
  rationale: Tính từ được danh từ hóa, chỉ một cá nhân tiêu biểu; tiếng Việt không buộc phải đánh dấu giống nên “người giàu” vừa chính xác vừa tự nhiên.
- source_word: δυσκόλως
  choice: khó
  rationale: Diễn đạt trực tiếp trạng thái/cách thức vào với sự khó khăn, không tự ý tăng nghĩa thành gần như không thể.
- source_word: εἰσελεύσεται
  choice: sẽ vào
  rationale: Giữ rõ thì tương lai và ý chuyển vào một phạm vi.
- source_word: βασιλείαν τῶν οὐρανῶν
  choice: vương quốc thiên đàng
  rationale: Giữ hình ảnh vương quyền và công thức đặc trưng của Ma-thi-ơ; “thiên đàng” là cách diễn đạt tự nhiên cho οὐρανῶν trong cụm này.
theological_decisions:
- issue: Mức độ khó được diễn đạt bởi δυσκόλως
  choice: sẽ khó vào
  alternative: hầu như không thể vào
  rationale: Bản dịch giữ đúng mức nghĩa của trạng từ trong câu này, không đưa trước sắc thái mạnh hơn được triển khai ở câu kế tiếp.
- issue: Tính từ danh từ hóa πλούσιος ở giống đực số ít
  choice: người giàu
  alternative: người đàn ông giàu có
  rationale: Giống ngữ pháp Hy Lạp không đòi hỏi phải thêm giới tính trong tiếng Việt; “người giàu” vẫn chỉ một cá nhân đại diện và tránh bổ sung nét nghĩa không cần thiết.
- issue: Công thức Ἀμὴν λέγω ὑμῖν
  choice: Thật, tôi nói với anh em
  alternative: A-men, tôi nói với anh em
  rationale: “Thật” truyền đạt chức năng xác quyết long trọng của Ἀμὴν bằng tiếng Việt hiện đại, đồng thời giữ nguyên cấu trúc “tôi nói với anh em” thay vì làm nhẹ thẩm quyền của lời tuyên bố.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu dịch bám sát trật tự lập luận Hy Lạp nhưng điều chỉnh vừa đủ cho cú pháp tiếng Việt. Không cần chú thích vì các phương án chính đã được thể hiện rõ mà không có dị bản hay sự mơ hồ thiết yếu cần ghi ngoài văn bản.
