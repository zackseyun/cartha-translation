id: MAT.19.6
reference: Matthew 19:6
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὥστε οὐκέτι εἰσὶν δύο ἀλλὰ σὰρξ μία. ὃ οὖν ὁ θεὸς συνέζευξεν ἄνθρωπος μὴ χωριζέτω.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/006.yaml
  text: So they are no longer two[a], but one flesh. Therefore, what God has joined together, man must not separate.
translation:
  language: vi
  text: Vì thế, họ không còn là hai, nhưng là một thịt. Vậy, điều Đức Chúa Trời đã kết hợp, loài người không được phân rẽ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὥστε
  choice: Vì thế
  rationale: Diễn đạt kết quả rút ra từ lời vừa dẫn về việc hai người trở nên một thịt, đồng thời tự nhiên trong tiếng Việt hiện đại.
- source_word: οὐκέτι εἰσὶν δύο
  choice: họ không còn là hai
  rationale: Giữ rõ ý về tình trạng đã thay đổi và sự tương phản trực tiếp giữa “hai” với “một thịt”; chủ ngữ “họ” được bổ sung theo ngữ cảnh để câu tiếng Việt tự nhiên.
- source_word: ἀλλὰ σὰρξ μία
  choice: nhưng là một thịt
  rationale: Giữ nguyên thành ngữ có ý nghĩa liên văn bản với Sáng Thế Ký, thay vì giải nghĩa thành “một thân thể” hay “một người”.
- source_word: ὃ οὖν
  choice: Vậy, điều
  rationale: “Vậy” giữ lực suy luận của οὖν; “điều” thể hiện đại từ quan hệ trung tính ὃ, chỉ thực tại hiệp nhất vừa được nói đến mà không diễn giải quá mức.
- source_word: ὁ θεὸς
  choice: Đức Chúa Trời
  rationale: Danh xưng trang trọng, quen thuộc và rõ nghĩa trong văn phong Kinh Thánh tiếng Việt.
- source_word: συνέζευξεν
  choice: đã kết hợp
  rationale: Truyền đạt hành động nối kết hai người thành một; “đã” phản ánh hành động đã hoàn tất, còn “kết hợp” tự nhiên hơn cách dịch sát hình ảnh “đặt chung ách”.
- source_word: ἄνθρωπος
  choice: loài người
  rationale: Trong câu này danh từ số ít mang nghĩa khái quát, đối lập con người với Đức Chúa Trời; “loài người” bảo toàn phạm vi bao quát mà không khiến độc giả hiểu lầm rằng chỉ đàn ông mới bị cấm phân rẽ.
- source_word: μὴ χωριζέτω
  choice: không được phân rẽ
  rationale: Diễn đạt rõ sức mạnh của mệnh lệnh cấm; “phân rẽ” phù hợp với việc phá vỡ sự hiệp nhất vừa được nói đến.
theological_decisions:
- issue: Nghĩa khái quát của ἄνθρωπος trong lệnh cấm liên quan đến hôn nhân
  choice: Dịch là “loài người”
  alternative: “một người”, “con người”, hoặc “người ta”
  rationale: ἄνθρωπος ở đây là chủ thể khái quát, nghĩa là không một con người nào được phân rẽ điều Đức Chúa Trời đã kết hợp. “Loài người” làm rõ sự đối lập Thần–nhân và tránh thu hẹp lệnh cấm vào nam giới.
- issue: Ngôn ngữ hiệp nhất hôn nhân σὰρξ μία, vang vọng Sáng Thế Ký
  choice: Giữ là “một thịt”
  alternative: “một thân thể”
  rationale: Cách dịch sát này bảo toàn hình ảnh và mối liên hệ liên văn bản, không âm thầm giải quyết toàn bộ ý nghĩa thần học của cụm từ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ thành ngữ Kinh Thánh “một thịt” vì giá trị liên văn bản; dùng “loài người” theo nghĩa tập thể, bao quát. Không cần chú thích vì bản dịch chính đã thể hiện rõ nghĩa khái quát của ἄνθρωπος.
