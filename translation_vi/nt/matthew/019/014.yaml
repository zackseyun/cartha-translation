source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς εἶπεν· Ἄφετε τὰ παιδία καὶ μὴ κωλύετε αὐτὰ ἐλθεῖν πρός με, τῶν γὰρ τοιούτων ἐστὶν ἡ βασιλεία τῶν οὐρανῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/014.yaml
  text: But Jesus said[a], “Let the children come, and do not hinder them from coming to me[b], for the kingdom of heaven belongs to such as these.”
translation:
  language: vi
  text: 'Nhưng Đức Giê-su nói: “Hãy để trẻ em đến với tôi, và đừng ngăn cản chúng đến với tôi, vì vương quốc thiên đàng thuộc về những người như thế.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát hơn: “vì vương quốc thiên đàng là của những người như thế.” Cụm “những người như thế” có thể chỉ cả những trẻ em đang hiện diện lẫn những người thuộc loại ấy.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄφετε
  choice: Hãy để
  rationale: Trong ngữ cảnh này, động từ mang nghĩa cho phép, không phải bỏ lại; “hãy để” tự nhiên và giữ được sắc thái mệnh lệnh.
- source_word: τὰ παιδία
  choice: trẻ em
  rationale: Chỉ trẻ nhỏ nhưng không nhất thiết phải nhấn mạnh sắc thái bé bỏng; “trẻ em” là cách dịch rộng và chính xác.
- source_word: μὴ κωλύετε
  choice: đừng ngăn cản
  rationale: Diễn đạt trực tiếp ý không được gây trở ngại hay ngăn không cho đến.
- source_word: αὐτὰ ἐλθεῖν πρός με
  choice: chúng ... đến với tôi
  rationale: Kết hợp tự nhiên với “ngăn cản” trong tiếng Việt và giữ đúng hướng quy chiếu về phía Đức Giê-su.
- source_word: τῶν ... τοιούτων
  choice: thuộc về những người như thế
  rationale: Giữ cả quy chiếu trực tiếp đến những trẻ em hiện diện lẫn khả năng chỉ rộng hơn đến những người cùng loại, mà không xác định phẩm chất cụ thể.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: vương quốc thiên đàng
  rationale: Cách diễn đạt rõ nghĩa, tự nhiên trong tiếng Việt và phản ánh thành ngữ đặc trưng của Ma-thi-ơ.
- source_word: ἐστὶν
  choice: thuộc về
  rationale: Kết hợp với sở hữu cách τῶν τοιούτων để chuyển tải ý nghĩa tự nhiên trong tiếng Việt, thay vì cấu trúc dịch sát nhưng gượng “là của”.
theological_decisions:
- issue: Đức Giê-su chỉ nói về trẻ em theo nghĩa đen hay còn nói đến những người có đặc điểm tương tự
  choice: “những người như thế”
  alternative: “những trẻ em này” hoặc “những người giống như trẻ em”
  rationale: τοιοῦτος có sức quy chiếu đại diện, vượt quá các cá nhân đang hiện diện, nhưng câu không nói rõ đặc điểm nào của trẻ em được nhắm đến. Cách dịch đã chọn bảo toàn sự mở này.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Đức Giê-su” trong lời dẫn và đại từ “tôi” trong lời trực tiếp để câu nói tự nhiên, gần gũi; tránh thêm phẩm chất “ngây thơ”, “khiêm nhường” hoặc “có đức tin” vì nguyên văn không xác định.
