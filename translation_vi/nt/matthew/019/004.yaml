  to: 'Ngài đáp: “Các ông chưa đọc rằng Đấng đã tạo dựng từ ban đầu đã làm nên họ là nam và nữ sao?”'
  rationale: Bản sửa đặt “từ ban đầu” sát “đã tạo dựng,” phản ánh liên kết cú pháp trong tiếng Hy Lạp mà không áp đặt diễn giải thần học ngoài câu văn. “Đã làm nên họ là nam và nữ” làm rõ cấu trúc của mệnh đề, vẫn giữ sự phân biệt giữa “tạo dựng” (κτίσας) và “làm nên” (ἐποίησεν).
