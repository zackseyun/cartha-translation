  text: ὁ δὲ ἀποκριθεὶς ⸀εἶπεν· Οὐκ ἀνέγνωτε ὅτι ὁ ⸀κτίσας ἀπ’ ἀρχῆς ἄρσεν καὶ θῆλυ ἐποίησεν αὐτοὺς
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/004.yaml
  text: He answered, “Have you not read that from the beginning the one who created them made them male and female?”
translation:
  language: vi
  text: 'Ngài đáp: “Các ông chưa đọc rằng Đấng đã tạo dựng từ ban đầu đã làm nên họ là nam và nữ sao?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: Ngài đáp
  rationale: Lối nói gồm phân từ và động từ hữu hạn được diễn đạt tự nhiên bằng một động từ trong tiếng Việt, không làm mất ý trả lời.
- source_word: Οὐκ ἀνέγνωτε
  choice: Các ông chưa đọc... sao?
  rationale: Câu hỏi phủ định mang ý nhắc người nghe về điều họ đáng lẽ đã biết từ Kinh Thánh; cách diễn đạt này tự nhiên trong tiếng Việt và giữ sắc thái chất vấn.
- source_word: ὁ κτίσας
  choice: Đấng tạo dựng
  rationale: Danh hóa phân từ chỉ Đấng thực hiện hành động sáng tạo. Cách dịch trang trọng, tự nhiên, nhưng không thêm danh xưng riêng ngoài ý của tiếng Hy Lạp.
- source_word: ἀπ’ ἀρχῆς
  choice: từ ban đầu
  rationale: Giữ sát giới từ ἀπό và âm hưởng của trình thuật sáng tạo trong Sáng Thế Ký; vị trí đặt trước chủ ngữ cũng bảo tồn khả năng liên hệ với hành động tạo dựng.
- source_word: ἄρσεν καὶ θῆλυ
  choice: có nam có nữ
  rationale: Phản ánh cặp phạm trù giới tính trong tiếng Hy Lạp và âm hưởng Sáng Thế Ký 1:27, đồng thời là cách nói tự nhiên, trang trọng trong tiếng Việt.
- source_word: ἐποίησεν αὐτούς
  choice: đã làm nên họ
  rationale: Dùng “làm nên” để phân biệt ποιέω với κτίζω đã được dịch là “tạo dựng”, tránh lặp từ mà vẫn giữ quan hệ giữa hai động từ.
theological_decisions:
- issue: Cách diễn đạt lời dẫn chiếu Sáng Thế Ký 1:27
  choice: Giữ nguyên cặp “có nam có nữ” trong chính văn
  alternative: làm nên họ là người nam và người nữ
  rationale: Bản dịch giữ khung sáng tạo và cặp ἄρσεν καὶ θῆλυ mà không mở rộng thành một kết luận thần học vượt quá câu này.
- issue: Phạm vi bổ nghĩa của ἀπ’ ἀρχῆς
  choice: Đặt “từ ban đầu” ngay sau “rằng”, trước chủ ngữ
  alternative: Đấng từ ban đầu đã tạo dựng họ
  rationale: Trật tự này bám sát tiếng Hy Lạp và bảo tồn độ linh hoạt của cụm từ, thay vì dứt khoát giới hạn nó chỉ bổ nghĩa cho “tạo dựng” hoặc biến nó thành một mệnh đề dẫn nhập riêng.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “Ngài” cho Chúa Giê-su và “các ông” cho nhóm người được đối thoại, phù hợp ngữ cảnh chất vấn công khai; tránh lối văn quá cổ hoặc thuật ngữ giáo phái.
