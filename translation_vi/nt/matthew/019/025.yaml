  text: ἀκούσαντες δὲ οἱ ⸀μαθηταὶ ἐξεπλήσσοντο σφόδρα λέγοντες· Τίς ἄρα δύναται σωθῆναι;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/025.yaml
  text: When the disciples heard this, they were greatly astonished and said, “Who then can be saved?”
translation:
  language: vi
  text: 'Khi nghe điều đó, các môn đệ rất đỗi kinh ngạc và nói: “Vậy thì ai có thể được cứu?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀκούσαντες
  choice: Khi nghe vậy
  rationale: Phân từ bất định diễn tả hoàn cảnh xảy ra trước động từ chính. Mệnh đề thời gian tự nhiên trong tiếng Việt; “vậy” quy chiếu về lời Đức Chúa Jêsus vừa nói.
- source_word: δὲ
  choice: '[không dịch thành từ riêng]'
  rationale: δέ đánh dấu sự tiếp nối hoặc tương phản nhẹ; cấu trúc “Khi nghe vậy” đã chuyển ý tự nhiên nên không cần thêm liên từ.
- source_word: οἱ μαθηταὶ
  choice: các môn đồ
  rationale: Cách gọi quen thuộc, trang trọng và chính xác trong văn mạch Phúc Âm đối với những người theo học Đức Chúa Jêsus.
- source_word: ἐξεπλήσσοντο σφόδρα
  choice: vô cùng kinh ngạc
  rationale: Động từ ở thì chưa hoàn thành diễn tả phản ứng kinh ngạc mạnh, còn σφόδρα nhấn mức độ; cụm tiếng Việt này truyền đạt đầy đủ sức mạnh của cách diễn đạt Hy Lạp.
- source_word: λέγοντες
  choice: và nói
  rationale: Phân từ chỉ lời nói đi kèm được chuyển thành động từ hữu hạn để câu kể tự nhiên trong tiếng Việt.
- source_word: Τίς ἄρα
  choice: Vậy thì ai
  rationale: Τίς hỏi về người; ἄρα biểu thị kết luận được rút ra từ lời trước đó và sắc thái sửng sốt. “Vậy thì” giữ rõ quan hệ suy luận.
- source_word: δύναται σωθῆναι
  choice: có thể được cứu
  rationale: δύναται nói về khả năng; σωθῆναι là động từ nguyên mẫu thụ động. Cách dịch giữ nguyên sắc thái thụ động và ý nghĩa cứu rỗi trong văn mạch.
theological_decisions:
- issue: Ý nghĩa của σωθῆναι trong văn mạch
  choice: được cứu
  alternative: được giải thoát; được cứu thoát
  rationale: Văn mạch nói về việc vào vương quốc và sự khó khăn đối với người giàu, nên câu hỏi liên quan đến sự cứu rỗi theo nghĩa đầy đủ. Bản dịch giữ sức nặng thần học và thể thụ động nhưng không giải thích thêm tác nhân hay cơ chế cứu rỗi.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. “Môn đồ” duy trì thuật ngữ Phúc Âm quen thuộc; trật tự “Vậy thì ai” tự nhiên trong lời nói và bảo toàn sắc thái suy luận của ἄρα.
