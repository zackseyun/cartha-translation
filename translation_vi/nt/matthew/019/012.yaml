id: MAT.19.12
reference: Matthew 19:12
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εἰσὶν γὰρ εὐνοῦχοι οἵτινες ἐκ κοιλίας μητρὸς ἐγεννήθησαν οὕτως, καὶ εἰσὶν εὐνοῦχοι οἵτινες εὐνουχίσθησαν ὑπὸ τῶν ἀνθρώπων, καὶ εἰσὶν εὐνοῦχοι οἵτινες εὐνούχισαν ἑαυτοὺς διὰ τὴν βασιλείαν τῶν οὐρανῶν. ὁ δυνάμενος χωρεῖν χωρείτω.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/012.yaml
  text: For there are eunuchs who were born that way from their mother’s womb[a], and there are eunuchs who were made eunuchs by men, and there are eunuchs who made themselves eunuchs for the sake of the kingdom of heaven[b]. The one able to accept this should accept it.
translation:
  language: vi
  text: Vì có những hoạn quan sinh ra đã như vậy ngay từ lòng mẹ; có những hoạn quan bị người ta làm thành hoạn quan; và có những hoạn quan tự làm mình thành hoạn quan vì Nước Trời.[a] Ai có thể chấp nhận điều này thì hãy chấp nhận.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “tự thiến mình”; nhiều người hiểu cách nói này theo nghĩa ẩn dụ là chọn sống độc thân vì Nước Trời.'
    reason: alternative_reading
  - marker: b
    text: 'Cũng có thể dịch: “Ai có thể tiếp nhận điều này thì hãy tiếp nhận.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐνοῦχοι
  choice: hoạn quan
  rationale: Giữ nguyên danh từ cụ thể và sự lặp lại trong tiếng Hy Lạp, thay vì diễn giải ngay thành “người sống độc thân”.
- source_word: ἐκ κοιλίας μητρὸς ἐγεννήθησαν οὕτως
  choice: từ lòng mẹ sinh ra đã như vậy
  rationale: Bảo tồn hình ảnh “từ lòng mẹ” của nguyên văn, đồng thời diễn đạt tự nhiên trong tiếng Việt hiện đại.
- source_word: εὐνουχίσθησαν ὑπὸ τῶν ἀνθρώπων
  choice: bị người ta làm thành hoạn quan
  rationale: Giữ mối liên hệ từ vựng với “hoạn quan” và thể bị động của nguyên văn; không thu hẹp ý nghĩa bằng cách đưa “bị thiến” thẳng vào chính văn.
- source_word: εὐνούχισαν ἑαυτοὺς
  choice: tự làm mình thành hoạn quan
  rationale: Chuyển ngữ trực tiếp cách diễn đạt gây chú ý của tiếng Hy Lạp, không tự ý quyết định đó là nghĩa đen, lối nói cường điệu hay ẩn dụ về việc sống độc thân.
- source_word: διὰ τὴν βασιλείαν τῶν οὐρανῶν
  choice: vì vương quốc thiên đàng
  rationale: “Vì” diễn đạt động cơ hoặc mục đích của διά với đối cách; “vương quốc thiên đàng” giữ nội dung thần học của cụm từ.
- source_word: ὁ δυνάμενος χωρεῖν χωρείτω
  choice: Ai có thể chấp nhận điều này thì hãy chấp nhận
  rationale: “Chấp nhận” truyền đạt nghĩa thành ngữ của χωρέω là dành chỗ cho hoặc đón nhận một lời dạy khó, còn “hãy” giữ lực mệnh lệnh.
theological_decisions:
- issue: Nên hiểu εὐνούχισαν ἑαυτοὺς theo nghĩa đen hay nghĩa ẩn dụ
  choice: Giữ cách nói “tự làm mình thành hoạn quan” trong chính văn.
  alternative: “Tự thiến mình” hoặc “chọn sống độc thân/không kết hôn”.
  rationale: Câu này không giải thích rõ cách nói thứ ba là nghĩa đen, cường điệu hay ẩn dụ. Bản dịch giữ nguyên sự căng thẳng đó, còn chú thích nêu cách hiểu phổ biến.
- issue: Cách chuyển ngữ lời khuyên cuối câu ὁ δυνάμενος χωρεῖν χωρείτω
  choice: Dùng “chấp nhận” trong chính văn.
  alternative: “Tiếp nhận” hoặc “dành chỗ cho”.
  rationale: “Chấp nhận” rõ ràng và tự nhiên đối với độc giả hiện đại, nhưng chú thích vẫn bảo lưu cách dịch sát hơn là “tiếp nhận”.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dấu chấm phẩy giúp người đọc nhận ra ba nhóm song song trong nguyên văn. Các dấu chú thích được đặt ngay sau những mệnh đề mà chúng giải thích.
