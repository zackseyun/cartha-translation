  naturalness: “Từ lòng mẹ sinh ra đã như vậy” có thể hiểu được nhưng trật tự từ hơi gượng. “Sinh ra đã như vậy ngay từ lòng mẹ” tự nhiên hơn mà vẫn giữ rõ thành ngữ nguồn gốc của nguyên văn. Các phần còn lại trang trọng, rõ ràng, và phù hợp văn phong Kinh Thánh hiện đại.
  terminology: “Hoạn quan” là lựa chọn thích hợp để giữ thuật ngữ cụ thể và sự lặp lại của εὐνοῦχοι, không diễn giải thành người độc thân. “Nước Trời” nên thay cho “vương quốc thiên đàng”. Chú thích về cách hiểu ẩn dụ cần dùng cùng thuật ngữ “Nước Trời”, không thay bằng “vương quốc của Đức Chúa Trời”, để tránh làm mờ cụm từ của câu nguồn.
