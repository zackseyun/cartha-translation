id: MAT.19.3
reference: Matthew 19:3
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Καὶ προσῆλθον ⸀αὐτῷ Φαρισαῖοι πειράζοντες αὐτὸν καὶ ⸀λέγοντες· Εἰ ἔξεστιν ⸀ἀνθρώπῳ ἀπολῦσαι τὴν γυναῖκα αὐτοῦ κατὰ πᾶσαν αἰτίαν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/003.yaml
  text: And Pharisees came up to him[a], testing him and saying, “Is it lawful for a man to divorce his wife for any cause?”
translation:
  language: vi
  text: 'Những người Pha-ri-si đến gần Đức Giê-su để thử Ngài và hỏi: “Một người đàn ông có được phép ly dị vợ mình vì bất cứ lý do nào không?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “dựa trên bất cứ căn cớ nào” hoặc “vì mọi căn cớ.” Cụm từ Hy Lạp phản ánh một câu hỏi pháp lý rộng về những căn cứ được phép dùng để ly dị.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσῆλθον
  choice: đến gần
  rationale: Diễn đạt tự nhiên động từ προσέρχομαι, giữ sắc thái tiến đến gần một người.
- source_word: πειράζοντες
  choice: để thử
  rationale: πειράζω có thể là thử, thử thách hoặc cám dỗ. Trong ngữ cảnh này, những người Pha-ri-si chất vấn với ý đối nghịch; “để thử” giữ nghĩa từ vựng mà không diễn giải quá mức thành “gài bẫy”.
- source_word: ἔξεστιν
  choice: có được phép
  rationale: Cụm này nêu câu hỏi về điều được luật cho phép. “Có được phép” tự nhiên trong tiếng Việt và vẫn giữ khung pháp lý của cuộc tranh luận.
- source_word: ἀνθρώπῳ
  choice: một người đàn ông
  rationale: Dù ἄνθρωπος đôi khi có nghĩa khái quát là người, câu này nói cụ thể đến người có “vợ”, nên “một người đàn ông” phù hợp với ngữ cảnh và hình thái giống đực.
- source_word: ἀπολῦσαι
  choice: ly dị
  rationale: ἀπολύω theo nghĩa đen là thả hoặc cho đi, nhưng trong ngữ cảnh hôn nhân đây là thuật ngữ chỉ việc ly dị.
- source_word: τὴν γυναῖκα αὐτοῦ
  choice: vợ mình
  rationale: γυνή trong ngữ cảnh ly dị có nghĩa là “vợ”; đại từ phản thân “mình” diễn đạt tự nhiên quan hệ sở hữu với chủ ngữ trong tiếng Việt.
- source_word: κατὰ πᾶσαν αἰτίαν
  choice: vì bất cứ lý do nào
  rationale: Giữ phạm vi rộng của πᾶσαν và thể hiện câu hỏi về bất cứ căn cứ nào được viện ra để ly dị.
theological_decisions:
- issue: Cách diễn đạt câu hỏi về ly dị mà không áp đặt lập trường giáo phái
  choice: Một người đàn ông có được phép ly dị vợ mình vì bất cứ lý do nào không?
  alternative: Một người chồng có được phép ly dị vợ vì mọi căn cớ không?
  rationale: Bản dịch giữ nguyên tính chất câu hỏi pháp lý và phạm vi rộng của các lý do được viện dẫn, không biến câu này thành lời kết luận về giáo lý ly dị.
- issue: Sắc thái động cơ của những người Pha-ri-si
  choice: để thử Ngài
  alternative: để gài bẫy Ngài
  rationale: “Để thử” phản ánh trực tiếp πειράζοντες và để ngữ cảnh cho thấy ý đối nghịch, thay vì xác định quá cụ thể phương thức hay mức độ ác ý.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Giê-su” và đại từ “Ngài” theo lối tôn kính thông dụng. Dấu chú thích [a] được đặt ngay sau toàn bộ câu hỏi vì chú thích giải thích cụm cuối câu.
