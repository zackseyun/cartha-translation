reference: Matthew 19:17
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτῷ· Τί με ⸂ἐρωτᾷς περὶ τοῦ ἀγαθοῦ; εἷς ἐστιν ὁ ἀγαθός⸃· εἰ δὲ θέλεις ⸂εἰς τὴν ζωὴν εἰσελθεῖν⸃, ⸀τήρησον τὰς ἐντολάς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/017.yaml
  text: And he said to him[a], “Why do you ask me about what is good? One is good. But if you want to enter into life[b], keep the commandments.”
translation:
  language: vi
  text: 'Ngài nói với anh: “Tại sao anh hỏi tôi về điều thiện? Chỉ có một Đấng là tốt lành.[a] Nhưng nếu anh muốn vào sự sống[b], hãy giữ các điều răn.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Một số thủ bản và các trình thuật song song chép: “Sao anh gọi tôi là thiện? Không ai thiện, ngoại trừ một mình Đức Chúa Trời.” Bản văn SBLGNT của Ma-thi-ơ ở đây chép: “Tại sao anh hỏi tôi về điều thiện? Chỉ có một Đấng là tốt lành.”'
    reason: textual_variant
  - marker: b
    text: “Vào sự sống” chỉ việc bước vào sự sống theo nghĩa trọn vẹn; câu này không dùng từ “đời đời.”
    reason: lexical_clarification
lexical_decisions:
- source_word: Τί με ἐρωτᾷς περὶ τοῦ ἀγαθοῦ
  choice: Tại sao anh hỏi tôi về điều thiện?
  rationale: Cụm trung tính số ít τοῦ ἀγαθοῦ chỉ điều gì là thiện hoặc điều thiện, chứ không nên bị hòa hợp với lời hỏi về việc gọi Đức Giê-su là ‘thiện’ trong các sách song song. ‘Điều thiện’ tự nhiên, trang trọng và giữ được sắc thái khái quát.
- source_word: εἷς ἐστιν ὁ ἀγαθός
  choice: Chỉ có một Đấng là thiện
  rationale: Cách diễn đạt này chuyển tải εἷς cùng tính từ được danh từ hóa ὁ ἀγαθός bằng tiếng Việt tự nhiên. ‘Đấng’ cho thấy đây là một hữu thể/ngôi vị mà không chèn thêm danh xưng ‘Đức Chúa Trời’ vốn không xuất hiện trong bản văn SBLGNT của câu này.
- source_word: εἰ δὲ θέλεις
  choice: Nhưng nếu anh muốn
  rationale: θέλω diễn tả ý muốn; δέ có sắc thái chuyển ý hơi tương phản nên dịch là ‘nhưng’.
- source_word: εἰς τὴν ζωὴν εἰσελθεῖν
  choice: vào sự sống
  rationale: Giữ hình ảnh ‘đi vào sự sống’ nhưng diễn đạt tự nhiên trong tiếng Việt; không thêm ‘đời đời’ vì cụm này không nêu rõ tính từ ấy.
- source_word: τήρησον τὰς ἐντολάς
  choice: hãy giữ các điều răn
  rationale: Trong quan hệ với điều răn, τηρέω được chuyển tải tự nhiên bằng ‘giữ’; ‘các điều răn’ phản ánh số nhiều xác định và trọng lượng tôn giáo của ἐντολάς.
theological_decisions:
- issue: Mối liên hệ giữa lời của Đức Giê-su với sự thiện của Đức Chúa Trời và Kitô học
  choice: 'Dịch đúng dạng văn bản của Ma-thi-ơ: câu hỏi nói về ‘điều thiện’ và lời đáp nói rằng chỉ có một Đấng là thiện, không coi đây là lời phủ nhận sự thiện hay thần tính của Đức Giê-su.'
  alternative: 'Hòa hợp với Mác/Lu-ca thành: ‘Sao anh gọi tôi là thiện? Không ai thiện, ngoại trừ một mình Đức Chúa Trời.’'
  rationale: SBLGNT của Ma-thi-ơ có cách đọc khác các trình thuật song song. Bản dịch cần bảo toàn khác biệt văn bản và sự căng thẳng thần học, không áp đặt một kết luận Kitô học vào chính câu dịch.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng ‘Ngài’ cho chủ thể là Đức Giê-su và ‘anh’ cho người đối thoại; giữ cách nói ‘điều thiện’, ‘sự sống’ và ‘các điều răn’ để bảo toàn các liên kết từ vựng và sắc thái của nguyên văn.
