source:
  edition: SBLGNT
  text: Τότε ἀποκριθεὶς ὁ Πέτρος εἶπεν αὐτῷ· Ἰδοὺ ἡμεῖς ἀφήκαμεν πάντα καὶ ἠκολουθήσαμέν σοι· τί ἄρα ἔσται ἡμῖν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/027.yaml
  text: Then Peter answered him, “Look, we have left everything and followed you. What then will there be for us?”
translation:
  language: vi
  text: 'Bấy giờ, Phi-e-rơ đáp lời Ngài: “Này, chúng con đã bỏ mọi sự và đã theo Ngài. Vậy sẽ có gì cho chúng con?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τότε
  choice: Bấy giờ
  rationale: Diễn đạt tự nhiên mốc chuyển tiếp trong trình thuật, đồng thời giữ quan hệ thời gian với lời dạy ngay trước đó.
- source_word: ἀποκριθεὶς ... εἶπεν
  choice: lên tiếng thưa
  rationale: Thành ngữ Hy Lạp có nghĩa là đáp lại/lên tiếng nói; trong ngữ cảnh môn đồ nói với Chúa Giê-su, “thưa” tự nhiên và thể hiện đúng quan hệ giao tiếp mà không thêm nội dung.
- source_word: Ἰδοὺ
  choice: Này
  rationale: Giữ chức năng thu hút sự chú ý của tiểu từ Hy Lạp bằng một từ trang trọng nhưng vẫn thông dụng trong tiếng Việt.
- source_word: ἀφήκαμεν πάντα
  choice: chúng con đã bỏ mọi sự
  rationale: “Bỏ” phản ánh nghĩa rời bỏ của ἀφίημι; “mọi sự” giữ phạm vi khái quát của πάντα và phù hợp văn phong Kinh Thánh hiện đại.
- source_word: ἠκολουθήσαμέν σοι
  choice: mà theo Ngài
  rationale: “Theo” chuyển tải trực tiếp ý làm môn đồ; “mà” nối tự nhiên với hành động đã bỏ mọi sự.
- source_word: τί ἄρα ἔσται ἡμῖν
  choice: Vậy chúng con sẽ được gì?
  rationale: Trong ngữ cảnh hỏi về phần dành cho các môn đồ, “sẽ được gì” là tiếng Việt tự nhiên và truyền đạt giá trị sở hữu/lợi ích của cấu trúc ἔσται ἡμῖν.
theological_decisions:
- issue: Sắc thái câu hỏi của Phi-e-rơ về phần dành cho các môn đồ
  choice: Vậy chúng con sẽ được gì?
  alternative: Vậy sẽ có gì cho chúng con?
  rationale: Bản dịch chọn cách nói tự nhiên trong tiếng Việt nhưng không xác định cụ thể phần thưởng là vật chất, địa vị hay sự cứu rỗi, nhờ đó giữ nguyên độ mở và sự căng thẳng của câu hỏi.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “chúng con” khi Phi-e-rơ thưa với Chúa Giê-su và “Ngài” để chỉ Chúa Giê-su; không thêm chú thích vì câu không có dị bản hay điểm tối nghĩa cần giải thích.
