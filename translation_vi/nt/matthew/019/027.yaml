revisions:
- from: 'Bấy giờ, Phi-e-rơ lên tiếng thưa với Ngài: “Này, chúng con đã bỏ mọi sự mà theo Ngài. Vậy chúng con sẽ được gì?”'
  to: 'Bấy giờ, Phi-e-rơ đáp lời Ngài: “Này, chúng con đã bỏ mọi sự và đã theo Ngài. Vậy sẽ có gì cho chúng con?”'
  rationale: Sửa tối thiểu để khôi phục ý “đáp lời” của ἀποκριθεὶς và thay cách hỏi có tính diễn giải “sẽ được gì” bằng “sẽ có gì cho chúng con,” tương ứng sát hơn với τί ἄρα ἔσται ἡμῖν và với audit trail tiếng Anh. Không cần chú thích vì không có vấn đề văn bản hay mơ hồ nào cần chú thích riêng.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T05:40:50Z'
review_pass:
  verdict: revise
  source_fidelity: Bản thảo truyền đạt đúng mạch chính, nhưng “lên tiếng thưa” làm mờ sắc thái đáp lại của ἀποκριθεὶς. Ngoài ra, “sẽ được gì” diễn giải τί ἄρα ἔσται ἡμῖν theo hướng nhận lãnh; nguyên văn chỉ hỏi điều gì sẽ có/dành cho họ, không xác định bản chất của điều ấy.
  naturalness: Câu văn nhìn chung tự nhiên, trang trọng vừa phải. “Đáp lời Ngài” là cách nói tự nhiên hơn để biểu đạt hành vi trả lời; “Vậy sẽ có gì cho chúng con?” vừa tự nhiên vừa giữ độ mở của câu hỏi.
  terminology: Giữ “Phi-e-rơ,” “Ngài,” và cặp xưng hô “chúng con/Ngài” nhất quán với văn cảnh môn đồ thưa với Chúa Giê-su. “Mọi sự” phù hợp với πάντα; “theo Ngài” phù hợp với nghĩa môn đồ của ἠκολουθήσαμεν.
  issues:
  - severity: medium
    issue: Sắc thái “đáp lại” chưa được thể hiện rõ
    rationale: Cụm ἀποκριθεὶς ... εἶπεν không chỉ là bắt đầu lên tiếng, mà là Phi-e-rơ trả lời Đức Giê-su. “Lên tiếng thưa” có thể là lời nói khởi đầu, không nhất thiết là lời đáp.
  - severity: medium
    issue: “Sẽ được gì?” thu hẹp độ mở của câu hỏi
    rationale: τί ἄρα ἔσται ἡμῖν có nghĩa sát là “vậy sẽ có gì cho chúng con/chúng ta?” Cách “được gì” hợp ngữ cảnh nhưng diễn giải điều sẽ có như một vật hay phần thưởng được nhận; bản dịch nên giữ cách diễn đạt không xác định hơn.
  revised_text: 'Bấy giờ, Phi-e-rơ đáp lời Ngài: “Này, chúng con đã bỏ mọi sự và đã theo Ngài. Vậy sẽ có gì cho chúng con?”'
