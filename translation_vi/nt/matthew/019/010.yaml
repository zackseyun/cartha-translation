  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Λέγουσιν αὐτῷ οἱ ⸀μαθηταί· Εἰ οὕτως ἐστὶν ἡ αἰτία τοῦ ἀνθρώπου μετὰ τῆς γυναικός, οὐ συμφέρει γαμῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/010.yaml
  text: His disciples said to him[a], “If that is the case of a man with his wife, it is not beneficial to marry.”
translation:
  language: vi
  text: 'Các môn đồ thưa với Ngài: “Nếu hoàn cảnh của một người đàn ông với vợ mình là như vậy, thì kết hôn không có lợi.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Λέγουσιν αὐτῷ
  choice: Các môn đồ thưa với Ngài
  rationale: Thì hiện tại Hy Lạp được dùng như hiện tại lịch sử; tiếng Việt kể chuyện tự nhiên không cần đánh dấu thì quá khứ. “Thưa” diễn đạt lời nói kính trọng với Chúa Giê-su mà không làm thay đổi nội dung.
- source_word: μαθηταί
  choice: các môn đồ
  rationale: Thuật ngữ quen thuộc trong các sách Tin Mừng, giữ được cả ý học trò lẫn người đi theo.
- source_word: Εἰ οὕτως ἐστὶν
  choice: Nếu ... là như vậy
  rationale: Cách nói tự nhiên trong tiếng Việt, giữ lực điều kiện và sự hồi đáp đối với lời dạy ngay trước đó.
- source_word: ἡ αἰτία
  choice: hoàn cảnh
  rationale: Trong ngữ cảnh này, αἰτία chỉ tình trạng hay trường hợp liên quan đến hôn nhân, chứ không chủ yếu mang nghĩa nguyên nhân.
- source_word: τοῦ ἀνθρώπου μετὰ τῆς γυναικός
  choice: của người đàn ông với vợ mình
  rationale: Giữ cách diễn đạt giống đực của nguyên văn và hiểu γυνή theo nghĩa “vợ” trong ngữ cảnh hôn nhân; “mình” làm rõ quan hệ sở hữu vốn được ngữ cảnh hàm ý.
- source_word: οὐ συμφέρει
  choice: không nên
  rationale: Cách nói tiếng Việt tự nhiên để diễn đạt rằng việc ấy không có lợi hoặc không đáng chọn trong hoàn cảnh được nêu.
- source_word: γαμῆσαι
  choice: kết hôn
  rationale: Cách diễn đạt trang trọng, hiện đại và trực tiếp của động từ “cưới/lấy vợ lấy chồng”.
theological_decisions:
- issue: Ngôn ngữ chỉ giới tính trong ἀνθρώπου ... γυναικός
  choice: người đàn ông với vợ mình
  alternative: một người với người phối ngẫu
  rationale: Ngữ cảnh trực tiếp nói về hôn nhân bằng những từ chỉ nam và nữ; bản dịch giữ khung diễn đạt ấy thay vì trung tính hóa.
- issue: Sắc thái của οὐ συμφέρει
  choice: không nên kết hôn
  alternative: kết hôn không có lợi
  rationale: “Không nên” truyền đạt tự nhiên kết luận thực dụng của các môn đồ, nhưng không biến lời họ thành một lệnh cấm thần học tuyệt đối.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Ngài” làm đại từ kính trọng trong lời thuật; câu nói giữ cấu trúc súc tích và sự căng thẳng trong phản ứng của các môn đồ.
source_grounding:
  english_pob_role: consult_only
