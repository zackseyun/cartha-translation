revisions:
- from: 'Các môn đồ thưa với Ngài: “Nếu hoàn cảnh của người đàn ông với vợ mình là như vậy, thì không nên kết hôn.”'
  to: 'Các môn đồ thưa với Ngài: “Nếu hoàn cảnh của một người đàn ông với vợ mình là như vậy, thì kết hôn không có lợi.”'
  rationale: Đổi “không nên kết hôn” thành “kết hôn không có lợi” để phản ánh trực tiếp giá trị ngữ nghĩa của οὐ συμφέρει mà không thêm sắc thái quy phạm. Thêm “một” để biểu thị tự nhiên số ít khái quát của τοῦ ἀνθρώπου. Không cần chú thích vì không có điểm nào cần neo chú thích để bảo toàn bản văn.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T05:40:43Z'
review_pass:
  verdict: revise
  source_fidelity: 'Cụm “không nên kết hôn” diễn giải οὐ συμφέρει theo hướng lời khuyên/chuẩn tắc (“ought not”), trong khi từ này trước hết nói điều không có lợi, không thuận lợi hay không đáng chọn. Các thành phần còn lại nhìn chung phản ánh đúng câu Hy Lạp: môn đồ nói với Chúa Giê-su; điều kiện “nếu ... như vậy”; và khung người đàn ông–vợ trong ngữ cảnh hôn nhân.'
  naturalness: Câu hiện có dễ hiểu và có văn phong trang trọng vừa phải. “Hoàn cảnh của người đàn ông với vợ mình” hơi sát cấu trúc nguồn nhưng vẫn chấp nhận được; việc thêm “một” làm rõ nghĩa khái quát của số ít sẽ tự nhiên hơn.
  terminology: “Các môn đồ,” “Ngài,” và “kết hôn” phù hợp với văn phong Kinh Thánh Việt ngữ hiện đại. “Vợ mình” là cách Việt hóa hợp lý của γυνή trong ngữ cảnh này, dù sở hữu không được nêu tường minh trong tiếng Hy Lạp.
  issues:
  - severity: medium
    issue: “không nên” thay cho οὐ συμφέρει
    rationale: “Không nên” dễ được hiểu là phán quyết đạo đức hoặc mệnh lệnh. οὐ συμφέρει diễn đạt sự bất lợi/không có ích theo đánh giá thực dụng của các môn đồ. “Không có lợi” giữ lực nghĩa này sát hơn.
  revised_text: 'Các môn đồ thưa với Ngài: “Nếu hoàn cảnh của một người đàn ông với vợ mình là như vậy, thì kết hôn không có lợi.”'
