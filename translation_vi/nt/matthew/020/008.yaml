id: MAT.20.8
reference: Matthew 20:8
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὀψίας δὲ γενομένης λέγει ὁ κύριος τοῦ ἀμπελῶνος τῷ ἐπιτρόπῳ αὐτοῦ· Κάλεσον τοὺς ἐργάτας καὶ ἀπόδος ⸀αὐτοῖς τὸν μισθὸν ἀρξάμενος ἀπὸ τῶν ἐσχάτων ἕως τῶν πρώτων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/008.yaml
  text: When evening came, the master of the vineyard says to his steward, ‘Call the workers and pay them their wages, beginning with the last and ending with the first.’
translation:
  language: vi
  text: 'Khi chiều đến, chủ vườn nho nói với người quản lý của mình: “Hãy gọi những người làm công đến và trả tiền công cho họ, bắt đầu từ những người vào làm sau cùng cho đến những người vào làm đầu tiên.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὀψίας
  choice: chiều
  rationale: Chỉ thời điểm buổi chiều hoặc chiều tối; trong ngữ cảnh kết thúc ngày lao động, “chiều” là cách diễn đạt tự nhiên và đủ chính xác.
- source_word: ὁ κύριος τοῦ ἀμπελῶνος
  choice: chủ vườn nho
  rationale: Diễn đạt trực tiếp quyền sở hữu và vai trò của nhân vật trong dụ ngôn, không thêm hàm ý thần học ngoài văn cảnh.
- source_word: τῷ ἐπιτρόπῳ αὐτοῦ
  choice: người quản lý của mình
  rationale: ἐπίτροπος ở đây là người được chủ giao trách nhiệm quản lý và chi trả; “người quản lý” rõ nghĩa trong tiếng Việt hiện đại.
- source_word: ἀπόδος αὐτοῖς τὸν μισθὸν
  choice: trả tiền công cho họ
  rationale: ἀποδίδωμι mang nghĩa trao trả điều phải trả, còn μισθός trong ngữ cảnh lao động là tiền công.
- source_word: ἀπὸ τῶν ἐσχάτων ἕως τῶν πρώτων
  choice: từ những người vào làm sau cùng cho đến những người vào làm đầu tiên
  rationale: Bổ sung “vào làm” từ ngữ cảnh để làm rõ “sau cùng/đầu tiên” nói về thứ tự được thuê vào làm, đồng thời giữ nguyên trật tự chi trả.
theological_decisions:
- issue: Thì hiện tại lịch sử của λέγει
  choice: nói
  alternative: đã nói / bảo
  rationale: Giữ sắc thái hiện tại lịch sử của bản Hy Lạp trong lời kể; tiếng Việt có thể dùng “nói” tự nhiên sau mệnh đề thời gian mà không cần đánh dấu quá khứ.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “người làm công” thay vì cách gọi cổ; lời thoại giữ dạng mệnh lệnh tự nhiên. Không cần chú thích vì các lựa chọn không che khuất dị bản hay sự mơ hồ quan trọng.
