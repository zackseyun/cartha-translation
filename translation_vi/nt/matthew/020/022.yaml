id: MAT.20.22
reference: Matthew 20:22
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν· Οὐκ οἴδατε τί αἰτεῖσθε· δύνασθε πιεῖν τὸ ποτήριον ὃ ἐγὼ μέλλω ⸀πίνειν; λέγουσιν αὐτῷ· Δυνάμεθα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/022.yaml
  text: But Jesus answered and said[a], “You do not know what you are asking. Are you able to drink the cup that I am about to drink?” They said to him, “We are able.”
translation:
  language: vi
  text: 'Nhưng Đức Giê-su đáp: “Anh em không biết mình đang xin điều gì. Anh em có thể uống chén[a] mà tôi sắp uống không?” Họ thưa với ngài: “Chúng tôi có thể.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nói rõ hơn có thể hiểu là: “chén đau khổ mà tôi sắp uống.” Tiếng Hy Lạp giữ hình ảnh “chén”, một hình ảnh quen thuộc trong Kinh Thánh về phần được định cho một người, đặc biệt là đau khổ.'
    reason: Giải thích ẩn dụ mà không thay thế hoặc thu hẹp hình ảnh trong chính văn.
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν
  choice: Nhưng Đức Giê-su đáp
  rationale: “Nhưng” thể hiện sắc thái chuyển ý nhẹ của δέ; “đáp” diễn đạt tự nhiên công thức Hy Lạp có cả phân từ và động từ nói mà không tạo lối văn Việt rườm rà kiểu “đáp và nói”.
- source_word: Οὐκ οἴδατε
  choice: Anh em không biết
  rationale: Giữ nghĩa trực tiếp của οἶδα là “biết”, không diễn giải thành “hiểu”. “Anh em” là cách xưng hô số nhiều tự nhiên dành cho các môn đồ, tránh sắc thái cổ hoặc miệt thị của “các ngươi”.
- source_word: τί αἰτεῖσθε
  choice: mình đang xin điều gì
  rationale: “Đang xin” truyền đạt hành động thỉnh cầu trong hiện tại; đại từ phản thân “mình” tự nhiên trong tiếng Việt và làm rõ chủ thể của lời xin.
- source_word: δύνασθε
  choice: Anh em có thể
  rationale: “Có thể” diễn đạt năng lực hoặc khả năng, đồng thời cho phép lặp lại nhất quán trong lời đáp.
- source_word: πιεῖν
  choice: uống
  rationale: Bản dịch trực tiếp của động từ nguyên mẫu, phù hợp với ẩn dụ về chén.
- source_word: τὸ ποτήριον
  choice: chén
  rationale: Giữ nguyên hình ảnh ẩn dụ của bản Hy Lạp. “Chén” là từ trang trọng, quen thuộc trong ngôn ngữ Kinh Thánh tiếng Việt mà vẫn dễ hiểu.
- source_word: ὃ ἐγὼ μέλλω πίνειν
  choice: mà tôi sắp uống
  rationale: “Sắp” thể hiện hướng tương lai và sắc thái cận kề của μέλλω; “mà” nối mệnh đề quan hệ tự nhiên trong tiếng Việt.
- source_word: λέγουσιν αὐτῷ
  choice: Họ thưa với ngài
  rationale: Chuyển hiện tại lịch sử Hy Lạp sang quá khứ tường thuật tự nhiên theo ngữ cảnh tiếng Việt. “Thưa” phù hợp với lời đáp kính trọng dành cho thầy; “với ngài” thể hiện αὐτῷ.
- source_word: Δυνάμεθα
  choice: Chúng tôi có thể
  rationale: Lặp lại “có thể” để duy trì liên kết từ vựng với câu hỏi và giữ trọng tâm vào khả năng.
theological_decisions:
- issue: Sức gợi ẩn dụ của “chén”
  choice: Giữ “chén” trong chính văn, không giải nghĩa trực tiếp là đau khổ hay cái chết.
  alternative: chén đau khổ mà tôi sắp uống; sự đau khổ mà tôi sắp chịu
  rationale: 'Hình ảnh này có ý nghĩa thần học và vẫn có độ mở trong mạch truyện: nó hướng đến phần số đau khổ sắp đến của Đức Giê-su nhưng không bị thu hẹp vào một lời chú giải duy nhất.'
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “Đức Giê-su” trong lời kể; “anh em” cho ngôi thứ hai số nhiều nhằm tránh lối xưng hô cổ và nặng sắc thái “các ngươi”. Dùng “tôi” trong lời Đức Giê-su để không đưa thêm tôn xưng thần học vào chính lời thoại; “ngài” viết thường là đại từ kính trọng trong lời kể.
