id: MAT.20.21
reference: Matthew 20:21
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτῇ· Τί θέλεις; λέγει αὐτῷ· Εἰπὲ ἵνα καθίσωσιν οὗτοι οἱ δύο υἱοί μου εἷς ἐκ δεξιῶν ⸀σου καὶ εἷς ἐξ εὐωνύμων σου ἐν τῇ βασιλείᾳ σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/021.yaml
  text: And he said to her[a], “What do you want?” She said to him, “Command that these two sons of mine may sit, one at your right and one at your left[c][b], in your kingdom.”
translation:
  language: vi
  text: 'Ngài hỏi bà: “Bà muốn gì?” Bà thưa: “Xin ngài phán cho hai con trai tôi đây được ngồi, một người bên phải và một người bên trái ngài, trong vương quốc của ngài.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τί θέλεις
  choice: Bà muốn gì?
  rationale: Diễn đạt trực tiếp câu hỏi về điều bà đang cầu xin; cách xưng hô “bà” tự nhiên và phù hợp ngữ cảnh.
- source_word: Εἰπὲ
  choice: Xin ngài phán cho
  rationale: Giữ nghĩa căn bản “hãy nói/phán” của λέγω, đồng thời cấu trúc “xin ... cho” diễn đạt tự nhiên một lời thỉnh cầu trong tiếng Việt mà không chuyển hẳn sang nghĩa diễn giải là “ban cho”.
- source_word: ἵνα καθίσωσιν
  choice: được ngồi
  rationale: Diễn đạt nội dung của lời cầu xin và hàm ý được cho phép hoặc được chỉ định vị trí, không biến động từ thành thể bị động quá mức.
- source_word: οὗτοι οἱ δύο υἱοί μου
  choice: hai con trai tôi đây
  rationale: “Đây” giữ sắc thái chỉ định của οὗτοι; trật tự từ tự nhiên trong tiếng Việt.
- source_word: εἷς ἐκ δεξιῶν σου καὶ εἷς ἐξ εὐωνύμων σου
  choice: một người bên phải và một người bên trái ngài
  rationale: Chuyển đúng thành ngữ chỉ vị trí hai bên, giữ cấu trúc song song và không thêm “tay” vốn không có minh nhiên trong tiếng Hy Lạp.
- source_word: ἐν τῇ βασιλείᾳ σου
  choice: trong vương quốc của ngài
  rationale: “Vương quốc” vừa tự nhiên vừa bảo toàn sắc thái vương quyền của βασιλεία; không quyết định liệu trọng tâm là lãnh thổ hay sự trị vì.
theological_decisions:
- issue: Bản chất của chỗ ngồi được xin trong mối liên hệ với vương quyền của Chúa Giê-su
  choice: Diễn đạt như những vị trí danh dự bên phải và bên trái trong vương quốc của ngài, nhưng không chú giải thêm trong chính văn.
  alternative: Xác định đó là vương quốc Mê-si trên đất hoặc vương quốc thiên thượng trong thời kỳ hoàn tất.
  rationale: Nguyên văn chỉ nói đến việc ngồi bên phải và bên trái trong βασιλεία của Chúa Giê-su; bản dịch cần giữ nguyên độ mở về phương diện cánh chung.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Ngài” trong lời trần thuật và “ngài” trong lời đối thoại theo chính tả thông thường; “thưa” thể hiện thái độ kính trọng. Không thêm chú thích vì các khả năng từ vựng đáng kể đã có thể được giữ bằng cách dịch không diễn giải quá mức.
