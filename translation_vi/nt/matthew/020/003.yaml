  text: καὶ ἐξελθὼν περὶ τρίτην ὥραν εἶδεν ἄλλους ἑστῶτας ἐν τῇ ἀγορᾷ ἀργούς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/003.yaml
  text: And going out about the third hour[b][a], he saw others standing idle in the marketplace.
translation:
  language: vi
  text: Khoảng giờ thứ ba[a], ông đi ra và thấy những người khác đang đứng nhàn rỗi[b] ở chợ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “khoảng chín giờ sáng.” “Giờ thứ ba” được tính theo cách của người Do Thái, bắt đầu từ lúc mặt trời mọc.
    reason: cultural_note
  - marker: b
    text: Hay “chưa có việc làm.” Từ Hy Lạp có nghĩa là “nhàn rỗi,” tức là lúc ấy họ không làm việc.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθὼν
  choice: lại đi ra
  rationale: Phân từ bất định quá khứ diễn tả hành động xảy ra trước hành động chính; cách dịch này tự nhiên trong mạch kể, còn “lại” phản ánh καί và tính lặp lại trong ngữ cảnh.
- source_word: περὶ τρίτην ὥραν
  choice: khoảng giờ thứ ba
  rationale: Giữ cách tính giờ theo nguyên văn và chuyển lời giải thích văn hóa sang chú thích.
- source_word: εἶδεν
  choice: thấy
  rationale: Tương đương trực tiếp, tự nhiên của động từ ὁράω trong văn kể chuyện.
- source_word: ἄλλους
  choice: những người khác
  rationale: Tính từ được dùng như danh từ; không thêm giới tính mà nguyên văn không nói rõ.
- source_word: ἑστῶτας
  choice: đang đứng
  rationale: Diễn đạt trạng thái kéo dài của phân từ hoàn thành ἵστημι bằng tiếng Việt tự nhiên.
- source_word: ἀγορᾷ
  choice: ngoài chợ
  rationale: ἀγορά chỉ khu chợ hay nơi công cộng người lao động tụ họp; “ngoài chợ” rõ ràng và tự nhiên với độc giả hiện đại.
- source_word: ἀργούς
  choice: nhàn rỗi
  rationale: Giữ nghĩa trực tiếp là không làm việc mà không biến nó thành thuật ngữ kinh tế hiện đại; chú thích nêu cách hiểu theo ngữ cảnh.
