    reason: cultural_note
  - marker: b
    text: Hay “chưa có việc làm.” Từ Hy Lạp có nghĩa là “nhàn rỗi,” tức là lúc ấy họ không làm việc.
    reason: lexical_alternative
  revision_rationale: Bỏ «lại» để không thêm sắc thái không được phát biểu trong câu Hy Lạp, và thay «ngoài chợ» bằng «ở chợ» để phản ánh trực tiếp giới từ ἐν cùng địa điểm ἀγορά. Giữ nguyên các chú thích vì chúng chính xác, tự nhiên và các mốc chú thích khớp với từ được chú thích.
