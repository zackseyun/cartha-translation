source:
  edition: SBLGNT
  text: καὶ στὰς ὁ Ἰησοῦς ἐφώνησεν αὐτοὺς καὶ εἶπεν· Τί θέλετε ποιήσω ὑμῖν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/032.yaml
  text: And Jesus stopped[a], called them, and said, “What do you want me to do for you?”
translation:
  language: vi
  text: 'Giê-su dừng lại, gọi họ và nói: “Các anh muốn tôi làm gì cho các anh?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch trang trọng hơn: “Các anh mong tôi làm điều gì cho các anh?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: στὰς
  choice: dừng lại
  rationale: Phân từ bất định của ἵστημι ở đây diễn tả việc Giê-su ngừng bước trước khi gọi hai người; “dừng lại” tự nhiên và đúng với diễn tiến câu chuyện.
- source_word: ἐφώνησεν
  choice: gọi
  rationale: φωνέω có thể chỉ việc gọi hoặc triệu đến. “Gọi” là cách diễn đạt ngắn gọn, tự nhiên và không thêm ý ngoài văn bản.
- source_word: αὐτοὺς
  choice: họ
  rationale: Đại từ đối cách số nhiều quy chiếu đến hai người mù trong ngữ cảnh ngay trước đó.
- source_word: Τί θέλετε
  choice: Các anh muốn… gì
  rationale: Giữ nguyên câu hỏi trực tiếp và nghĩa thông dụng của θέλω là “muốn”; “các anh” thể hiện rõ đối tượng số nhiều là hai người nam.
- source_word: ποιήσω
  choice: tôi làm
  rationale: Thể giả định sau θέλετε diễn tả điều họ muốn Giê-su thực hiện. Tiếng Việt tự nhiên dùng cấu trúc “muốn tôi làm gì”.
- source_word: ὑμῖν
  choice: cho các anh
  rationale: 'Đại từ tặng cách số nhiều mang ý nghĩa thụ hưởng: hành động được thực hiện vì lợi ích của họ.'
- source_word: ὁ Ἰησοῦς
  choice: Giê-su
  rationale: Phiên âm tên riêng theo tiếng Việt hiện đại; mạo từ Hy Lạp không cần được biểu đạt bằng một tước hiệu không có trong nguyên văn.
theological_decisions:
- issue: Sắc thái câu hỏi của Giê-su
  choice: “Các anh muốn tôi làm gì cho các anh?”
  alternative: “Các anh mong tôi làm điều gì cho các anh?”
  rationale: Cách chọn giữ sự trực tiếp và gần gũi của câu hỏi, không làm suy giảm sự trang trọng hay thêm một cách giải thích thần học.
translation_notes:
  register: Văn phong hiện đại, rõ ràng và trang nghiêm vừa phải. Dùng “Giê-su” thay vì thêm tước hiệu; dùng “các anh” để thể hiện số nhiều và giới tính được xác định từ ngữ cảnh.
