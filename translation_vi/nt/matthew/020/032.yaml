  source_fidelity: 'Bản dịch chuyển đạt đúng các thành tố của câu Hy Lạp: στὰς là “dừng lại” theo nghĩa ngừng bước trong mạch truyện; ἐφώνησεν αὐτούς là “gọi họ”; và câu hỏi Τί θέλετε ποιήσω ὑμῖν được diễn đạt đầy đủ, trực tiếp là “Các anh muốn tôi làm gì cho các anh?” Đại từ số nhiều và sắc thái thụ hưởng của ὑμῖν đều được giữ lại.'
  naturalness: Câu tiếng Việt hiện đại, trôi chảy, rõ nghĩa và phù hợp văn phong tường thuật Kinh Thánh. “Các anh” là cách xưng hô tự nhiên trong ngữ cảnh hai người nam được nhắc đến ở câu trước, đồng thời tránh lối văn quá cổ.
  terminology: “Giê-su” nhất quán với cách phiên âm tiếng Việt hiện đại. Không có thuật ngữ thần học tranh luận hay tên riêng nào cần điều chỉnh. Chú thích nêu một khả năng diễn đạt trang trọng hơn mà không thay đổi nghĩa chính.
