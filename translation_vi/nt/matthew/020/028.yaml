id: MAT.20.28
reference: Matthew 20:28
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὥσπερ ὁ υἱὸς τοῦ ἀνθρώπου οὐκ ἦλθεν διακονηθῆναι ἀλλὰ διακονῆσαι καὶ δοῦναι τὴν ψυχὴν αὐτοῦ λύτρον ἀντὶ πολλῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/028.yaml
  text: just as the Son of Man did not come to be served[a], but to serve, and to give his life as a ransom for many.
translation:
  language: vi
  text: Cũng như Con Người đến không phải để được phục vụ, nhưng để phục vụ và hiến mạng sống mình làm giá chuộc cho nhiều người.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch rõ hơn: “làm giá chuộc thay cho nhiều người.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥσπερ
  choice: Cũng như
  rationale: Giữ rõ chức năng so sánh với lời dạy ngay trước đó, đồng thời tự nhiên trong tiếng Việt hiện đại.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Con Người
  rationale: Cách dịch quen thuộc của danh xưng này, bảo tồn âm hưởng tước hiệu và liên hệ với Đa-ni-ên.
- source_word: οὐκ ἦλθεν
  choice: đến không phải
  rationale: Diễn đạt tự nhiên cấu trúc phủ định mục đích trong tiếng Việt mà không thêm địa điểm hay sắc thái thời gian không có trong tiếng Hy Lạp.
- source_word: διακονηθῆναι
  choice: để được phục vụ
  rationale: Giữ thể bị động và tạo thế đối lập trực tiếp với động từ chủ động theo sau.
- source_word: ἀλλὰ διακονῆσαι
  choice: nhưng để phục vụ
  rationale: Giữ nguyên sự tương phản bằng cùng một động từ tiếng Việt, tránh sắc thái giáo hội không cần thiết.
- source_word: καὶ δοῦναι
  choice: và hiến
  rationale: “Hiến” diễn đạt hành động tự nguyện trao mạng sống trong bối cảnh đi đến cái chết, tự nhiên và trang trọng mà không mở rộng ý quá mức.
- source_word: τὴν ψυχὴν αὐτοῦ
  choice: mạng sống mình
  rationale: Trong ngữ cảnh này ψυχή chỉ sự sống được trao đến mức chịu chết, không chỉ một “linh hồn” phi vật chất.
- source_word: λύτρον
  choice: giá chuộc
  rationale: Nêu rõ khoản giá được trao để giải thoát, là cách diễn đạt gọn và quen thuộc trong tiếng Việt.
- source_word: ἀντὶ πολλῶν
  choice: cho nhiều người
  rationale: Cách nói tự nhiên trong chính văn; sắc thái thay thế của ἀντί được bảo tồn rõ hơn trong chú thích.
theological_decisions:
- issue: Sắc thái của ἀντί trong lời nói về giá chuộc
  choice: Dịch trong chính văn là “cho nhiều người”, kèm chú thích nêu rõ “thay cho nhiều người”.
  alternative: thay cho nhiều người
  rationale: ἀντί có thể biểu thị sự trao đổi hoặc thay thế. Chính văn giữ lối nói tự nhiên, còn chú thích bảo tồn sắc thái thay thế có ý nghĩa thần học mà không ép câu vượt quá chứng cứ từ ngữ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ danh xưng truyền thống “Con Người”, sự đối xứng “được phục vụ/phục vụ”, và đặt dấu chú thích ngay sau cụm từ mà chú thích giải thích.
