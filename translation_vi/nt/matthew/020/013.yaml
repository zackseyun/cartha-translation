  text: ὁ δὲ ἀποκριθεὶς ⸂ἑνὶ αὐτῶν εἶπεν⸃· Ἑταῖρε, οὐκ ἀδικῶ σε· οὐχὶ δηναρίου συνεφώνησάς μοι;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/013.yaml
  text: But answering[a], he said to one of them, ‘Friend, I am not wronging you[b]. Did you not agree with me for a denarius?’
translation:
  language: vi
  text: 'Nhưng ông trả lời một người trong số họ rằng: “Bạn ơi, tôi không đối xử bất công với bạn. Chẳng phải bạn đã thỏa thuận với tôi về một đơ-na-ri-út[a] sao?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Đơ-na-ri-út là một đồng bạc La Mã, thường được xem là tiền công điển hình cho một ngày lao động.
    reason: cultural_note
lexical_decisions:
- source_word: ἀποκριθεὶς
  choice: đáp lại
  rationale: Diễn đạt tự nhiên phân từ mở đầu lời hồi đáp, không cần giữ cấu trúc nặng nề kiểu “trả lời, ông nói” trong tiếng Việt.
- source_word: ἑνὶ αὐτῶν
  choice: một người trong số họ
  rationale: Giữ rõ số ít của ἑνὶ và quan hệ bộ phận của αὐτῶν.
- source_word: Ἑταῖρε
  choice: Bạn ơi
  rationale: Là cách xưng hô dễ hiểu, có chừng mực; không mặc nhiên hàm ý tình bạn thân thiết và vẫn phù hợp sắc thái có phần xa cách trong ngữ cảnh.
- source_word: οὐκ ἀδικῶ σε
  choice: tôi không đối xử bất công với bạn
  rationale: Chuyển tải trực tiếp ý hành xử bất công đối với một người, đồng thời giữ thì hiện tại của động từ.
- source_word: οὐχὶ
  choice: Chẳng phải ... sao?
  rationale: Giữ câu hỏi tu từ mong đợi lời xác nhận.
- source_word: δηναρίου
  choice: một đơ-na-ri-út
  rationale: Giữ đơn vị tiền cổ thay vì đồng nhất hoàn toàn với một ngày công; chú thích cung cấp bối cảnh văn hóa.
- source_word: συνεφώνησάς μοι
  choice: bạn đã thỏa thuận với tôi
  rationale: Diễn đạt tự nhiên một thỏa thuận đã được hai bên xác lập trước đó.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “ông” cho chủ vườn theo mạch kể, còn lời trực tiếp dùng cặp “tôi—bạn”. Cấu trúc “đáp lại một người trong số họ” gọn tự nhiên trong tiếng Việt; dấu chú thích [a] được đặt ngay sau tên đồng tiền.
