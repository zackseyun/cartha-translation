revisions:
- from: 'Khi đang đi lên Giê-ru-sa-lem, Đức Chúa Jêsus đưa riêng mười hai môn đồ ra một chỗ và dọc đường nói với họ:'
  to: 'Khi đang lên Giê-ru-sa-lem, Đức Giê-su đưa riêng mười hai môn đồ ra, rồi dọc đường nói với họ:'
  rationale: Sửa cách diễn đạt việc tách riêng để không thêm địa điểm và để câu Việt tự nhiên hơn; đồng thời chuẩn hóa tên Giê-su và tránh thêm tước hiệu không có trong nguyên ngữ. Cấu trúc câu vẫn giữ tính chất câu dẫn, kết thúc bằng dấu hai chấm để nối với câu tiếp theo.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T05:40:56Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản nháp giữ được các thành tố chính: hành trình đi lên Giê-ru-sa-lem, Nhóm Mười Hai, việc tách họ ra riêng, và lời nói trên đường. Tuy nhiên, «ra một chỗ» thêm một địa điểm không được nêu trong tiếng Hy Lạp; κατ’ ἰδίαν chỉ việc tách riêng/tư riêng.'
  naturalness: «Đưa riêng ... ra một chỗ» không tự nhiên trong tiếng Việt hiện đại và gây cảm giác chuyển đến một địa điểm xác định. «Đưa riêng ... ra» diễn đạt gọn, tự nhiên hơn trong ngữ cảnh này.
  terminology: «Đức Chúa Jêsus» không phản ánh sát danh xưng đơn thuần ὁ Ἰησοῦς và lối chính tả «Jêsus» kém phù hợp với tiếng Việt chuẩn hiện đại. Dùng «Đức Giê-su» giữ giọng tôn trọng mà không thêm tước hiệu «Chúa». «Môn đồ» vẫn là thuật ngữ phù hợp cho μαθητάς.
  issues:
  - severity: medium
    issue: «ra một chỗ» thêm chi tiết địa điểm
    rationale: Nguyên ngữ chỉ nói rằng Đức Giê-su đưa Nhóm Mười Hai ra riêng (κατ’ ἰδίαν), không nói đến «một chỗ» nào.
  - severity: low
    issue: Tên riêng và danh xưng chưa phù hợp sát nguồn và chuẩn hiện đại
    rationale: ὁ Ἰησοῦς là «Đức Giê-su»/«Giê-su», không có tước hiệu «Chúa» trong câu này; «Giê-su» là chính tả thông dụng của tiếng Việt hiện đại.
  revised_text: 'Khi đang lên Giê-ru-sa-lem, Đức Giê-su đưa riêng mười hai môn đồ ra, rồi dọc đường nói với họ:'
