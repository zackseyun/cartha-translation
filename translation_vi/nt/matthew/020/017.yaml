  yaml_path: translation/nt/matthew/020/017.yaml
  text: And as Jesus was going up to Jerusalem, he took the twelve disciples aside by themselves, and on the way he said to them,
translation:
  language: vi
  text: 'Khi đang lên Giê-ru-sa-lem, Đức Giê-su đưa riêng mười hai môn đồ ra, rồi dọc đường nói với họ:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναβαίνων
  choice: đang đi lên
  rationale: Phân từ hiện tại diễn tả hành động đang diễn ra đồng thời với παρέλαβεν; cách dịch này giữ sắc thái đi lên về địa lý và lối nói quen thuộc khi đến Giê-ru-sa-lem.
- source_word: εἰς Ἱεροσόλυμα
  choice: lên Giê-ru-sa-lem
  rationale: Giới từ εἰς chỉ đích đến; trong tiếng Việt, kết hợp với động từ «đi lên», chỉ cần «Giê-ru-sa-lem» là tự nhiên và rõ nghĩa.
- source_word: παρέλαβεν
  choice: đưa ... ra một chỗ
  rationale: Động từ có nghĩa đem hoặc dẫn theo; cùng với κατ’ ἰδίαν, cụm dịch diễn tả việc Đức Chúa Jêsus tách họ khỏi những người khác để nói riêng.
- source_word: τοὺς δώδεκα μαθητὰς
  choice: mười hai môn đồ
  rationale: Giữ cả con số và danh từ μαθητάς; «môn đồ» là cách gọi quen thuộc, trang trọng và chính xác trong văn cảnh Phúc Âm.
- source_word: κατ’ ἰδίαν
  choice: riêng ... ra một chỗ
  rationale: Thành ngữ chỉ sự tách riêng khỏi những người khác; cách diễn đạt này giữ cả sắc thái không gian lẫn tính riêng tư.
- source_word: ἐν τῇ ὁδῷ
  choice: dọc đường
  rationale: Cách nói tự nhiên trong tiếng Việt, giữ nguyên bối cảnh cuộc hành trình.
- source_word: εἶπεν αὐτοῖς
  choice: nói với họ
  rationale: Dịch trực tiếp động từ nói thông thường λέγω và để nội dung phát ngôn được tiếp nối ở câu sau.
