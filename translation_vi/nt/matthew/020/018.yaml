id: MAT.20.18
reference: Matthew 20:18
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἰδοὺ ἀναβαίνομεν εἰς Ἱεροσόλυμα, καὶ ὁ υἱὸς τοῦ ἀνθρώπου παραδοθήσεται τοῖς ἀρχιερεῦσιν καὶ γραμματεῦσιν, καὶ κατακρινοῦσιν αὐτὸν θανάτῳ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/018.yaml
  text: Look[a], we are going up to Jerusalem, and the Son of Man will be handed over to the chief priests and scribes, and they will condemn him to death[c][b],
translation:
  language: vi
  text: “Này, chúng ta đang lên Giê-ru-sa-lem, và Con Người[c] sẽ bị giao nộp[b] cho các thượng tế và các kinh sư; họ sẽ kết án Người tử hình.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Cũng có thể dịch là “bị trao nộp”; trong văn cảnh hẹp hơn, động từ này cũng có thể mang nghĩa “bị phản bội”.
    reason: lexical_alternative
  - marker: c
    text: “Con Người” là danh xưng Đức Giê-su thường dùng để nói về chính mình và có thể gợi đến Đa-ni-ên 7:13–14.
    reason: cross_reference
lexical_decisions:
- source_word: Ἰδοὺ
  choice: Này
  rationale: Giữ chức năng thu hút sự chú ý của từ mở đầu bằng một cách nói ngắn gọn, trang trọng và tự nhiên trong tiếng Việt.
- source_word: ἀναβαίνομεν
  choice: chúng ta đang lên
  rationale: Thể hiện thì hiện tại của hành trình đang diễn ra, đồng thời giữ ý đi lên Giê-ru-sa-lem về mặt địa lý và theo cách nói quen thuộc.
- source_word: Ἱεροσόλυμα
  choice: Giê-ru-sa-lem
  rationale: Dùng dạng phiên âm quen thuộc trong tiếng Việt.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Con Người
  rationale: Giữ danh xưng đặc trưng của Đức Giê-su và khả năng gợi đến Đa-ni-ên 7:13–14, thay vì diễn giải thành một cách gọi chung về con người.
- source_word: παραδοθήσεται
  choice: sẽ bị giao nộp
  rationale: Diễn đạt thể tương lai bị động và ý bị trao vào quyền lực của người khác, nhưng không thu hẹp nghĩa thành hành vi phản bội của một tác nhân cụ thể.
- source_word: τοῖς ἀρχιερεῦσιν
  choice: cho các thượng tế
  rationale: Chỉ tập thể những người thuộc giới lãnh đạo tư tế, không phải chỉ riêng một vị thượng tế.
- source_word: γραμματεῦσιν
  choice: các kinh sư
  rationale: Cách gọi ngắn gọn, quen thuộc trong văn cảnh Tân Ước, chỉ những chuyên gia và người giảng dạy Luật.
- source_word: κατακρινοῦσιν
  choice: họ sẽ kết án
  rationale: Giữ sắc thái pháp lý của việc tuyên phán quyết bất lợi.
- source_word: θανάτῳ
  choice: phải chết
  rationale: Diễn đạt tự nhiên trong tiếng Việt hình phạt được nêu bởi cách dative trong cụm κατακρίνειν θανάτῳ.
theological_decisions:
- issue: Cách dịch danh xưng ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Con Người
  alternative: Đấng mang thân phận người
  rationale: Giữ danh xưng có nền tảng văn bản và sự cộng hưởng khả dĩ với Đa-ni-ên 7, không giản lược thành một mô tả nhân học.
- issue: Phạm vi nghĩa của παραδοθήσεται
  choice: sẽ bị giao nộp
  alternative: sẽ bị phản bội
  rationale: Không đưa vào câu một sự xác định hẹp hơn điều động từ Hy Lạp tự nó nói; trọng tâm ở đây là việc bị trao vào tay giới chức thù nghịch.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Không đặt chú thích cho “Này” vì phương án “Kìa” không phù hợp bằng trong lời báo trước hướng sự chú ý đến điều sắp nói. Các dấu chú thích [b], [c] đều xuất hiện trong chính văn; thứ tự được chuẩn hóa theo vị trí xuất hiện.
