    rationale: Cụm này có thể hàm ý thời hạn (“by the third day”), trong khi nguyên văn τῇ τρίτῃ ἡμέρᾳ xác định thời điểm (“on the third day”). “Vào ngày thứ ba” phản ánh chính xác hơn mà không đổi nghĩa.
  - severity: low
    issue: Cú pháp chú thích về thể bị động
    rationale: Cụm “Động từ Hy Lạp ở thể bị động..., là cách diễn đạt...” có dấu phẩy tách chủ-vị chưa trôi chảy. Thêm “và đây” làm chú thích rõ ràng, tự nhiên hơn.
  revised_text: rồi họ sẽ giao Người cho dân ngoại để họ nhạo báng, đánh đòn và đóng đinh Người vào thập tự giá; vào ngày thứ ba, Người sẽ được làm cho sống lại.[a]
