source:
  edition: SBLGNT
  text: καὶ παραδώσουσιν αὐτὸν τοῖς ἔθνεσιν εἰς τὸ ἐμπαῖξαι καὶ μαστιγῶσαι καὶ σταυρῶσαι, καὶ τῇ τρίτῃ ἡμέρᾳ ⸀ἐγερθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/019.yaml
  text: and they will hand him over to the Gentiles to mock and flog and crucify[a], and on the third day he will be raised.
translation:
  language: vi
  text: rồi họ sẽ giao Người cho dân ngoại để họ nhạo báng, đánh đòn và đóng đinh Người vào thập tự giá; vào ngày thứ ba, Người sẽ được làm cho sống lại.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Người sẽ sống lại.” Động từ Hy Lạp ở thể bị động (“sẽ được làm cho sống lại”), và đây là cách diễn đạt thường dùng về sự phục sinh, có thể hàm ý Đức Chúa Trời là Đấng hành động.'
    reason: alternative_reading
lexical_decisions:
- source_word: παραδώσουσιν
  choice: sẽ giao Người
  rationale: Diễn đạt việc trao Người vào quyền của những nhà cầm quyền thù nghịch, không thu hẹp nghĩa thành hành vi phản bội.
- source_word: τοῖς ἔθνεσιν
  choice: cho dân ngoại
  rationale: Trong lời báo trước cuộc thương khó với bối cảnh Do Thái, từ này chỉ những người không thuộc dân Do Thái, cụ thể là nhà cầm quyền Rô-ma.
- source_word: εἰς τὸ ἐμπαῖξαι
  choice: để họ nhạo báng
  rationale: Cấu trúc εἰς với động từ nguyên mẫu có mạo từ biểu thị mục đích hoặc kết quả; thêm chủ ngữ “họ” giúp câu tiếng Việt tự nhiên và rõ nghĩa.
- source_word: μαστιγῶσαι
  choice: đánh đòn
  rationale: Cách nói hiện đại, dễ hiểu về hình phạt quất roi theo thủ tục tư pháp, đồng thời tránh sắc thái quá cổ.
- source_word: σταυρῶσαι
  choice: đóng đinh Người vào thập tự giá
  rationale: Diễn đạt trực tiếp hình thức hành quyết bằng đóng đinh; lặp lại “Người” để câu tiếng Việt rõ và tự nhiên.
- source_word: τῇ τρίτῃ ἡμέρᾳ
  choice: đến ngày thứ ba
  rationale: Cách diễn đạt thời gian tự nhiên trong tiếng Việt và vẫn giữ nguyên mốc “ngày thứ ba” của nguyên văn.
- source_word: ἐγερθήσεται
  choice: Người sẽ được làm cho sống lại
  rationale: Giữ thể bị động tương lai của động từ Hy Lạp trong ngữ cảnh phục sinh và gợi hành động của Đức Chúa Trời mà không xác định quá mức chủ thể tác động.
theological_decisions:
- issue: Thể của động từ phục sinh
  choice: Người sẽ được làm cho sống lại
  alternative: Người sẽ sống lại
  rationale: Nguyên văn dùng thể bị động tương lai. Bản dịch giữ thể bị động và sắc thái hành động của Đức Chúa Trời, trong khi chú thích nêu cách dịch chủ động tự nhiên hơn mà không loại trừ các lời dạy khác về vai trò của chính Đấng Christ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “Người” tôn kính nhưng không quá cổ; “dân ngoại,” “đánh đòn,” và “thập tự giá” là các thuật ngữ quen thuộc trong tiếng Việt Cơ Đốc. Dùng dấu chấm phẩy để tách rõ việc hành hình khỏi biến cố ngày thứ ba.
