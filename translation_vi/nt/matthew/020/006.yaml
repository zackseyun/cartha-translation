source:
  edition: SBLGNT
  text: περὶ δὲ τὴν ⸀ἑνδεκάτην ἐξελθὼν εὗρεν ἄλλους ⸀ἑστῶτας, καὶ λέγει αὐτοῖς· Τί ὧδε ἑστήκατε ὅλην τὴν ἡμέραν ἀργοί;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/006.yaml
  text: And about the eleventh hour he went out and found others standing there[a], and he says to them[b], ‘Why have you been standing here idle all day?’
translation:
  language: vi
  text: 'Khoảng giờ thứ mười một[a], ông đi ra và thấy những người khác đang đứng. Ông nói với họ[b]: “Tại sao mọi người cứ đứng đây không làm gì suốt cả ngày?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Giờ thứ mười một” được tính từ lúc mặt trời mọc, tức khoảng năm giờ chiều.
    reason: historical_context
  - marker: b
    text: 'Nguyên văn Hy Lạp dùng thì hiện tại lịch sử: “ông nói với họ”; trong lối kể chuyện tiếng Việt cũng có thể dịch là “ông đã nói với họ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: περὶ δὲ τὴν ἑνδεκάτην
  choice: Khoảng giờ thứ mười một
  rationale: περί với đối cách diễn tả sự ước chừng. Giữ cách gọi “giờ thứ mười một” để bảo tồn khung thời gian của dụ ngôn; chú thích giải thích cách tính giờ cổ.
- source_word: ἐξελθὼν εὗρεν
  choice: ông đi ra và thấy
  rationale: Phân từ bất định ἐξελθών chỉ hành động xảy ra trước εὗρεν. Cách diễn đạt nối tiếp bằng “đi ra và thấy” tự nhiên trong tiếng Việt mà vẫn giữ rõ trình tự.
- source_word: ἄλλους ἑστῶτας
  choice: những người khác đang đứng đó
  rationale: ἄλλους được dùng như danh từ, không xác định rõ giới tính; ἑστῶτας diễn tả trạng thái đang đứng. “Những người khác” tránh bổ sung quá mức từ “đàn ông”.
- source_word: καὶ λέγει αὐτοῖς
  choice: Ông nói với họ
  rationale: λέγει là hiện tại lịch sử. Tiếng Việt không bắt buộc đánh dấu thì, nên “nói” vừa tự nhiên vừa không xóa sắc thái sống động của nguyên văn; chú thích nêu rõ hiện tượng này.
- source_word: Τί ὧδε ἑστήκατε
  choice: Tại sao các anh cứ đứng đây
  rationale: Τί trong câu hỏi này mang nghĩa “tại sao”. Động từ hoàn thành ἑστήκατε nhấn mạnh trạng thái kéo dài; “cứ đứng” truyền đạt sắc thái liên tục ấy.
- source_word: ὅλην τὴν ἡμέραν ἀργοί
  choice: không làm gì suốt cả ngày
  rationale: ἀργοί nghĩa là không hoạt động hoặc không làm việc. “Không làm gì” tự nhiên hơn “nhàn rỗi” trong văn cảnh và không áp đặt khái niệm kinh tế-xã hội hiện đại như “thất nghiệp”.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Đại từ “ông” tiếp nối chủ vườn nho trong ngữ cảnh; “các anh” phù hợp với lời ông nói trực tiếp với nhóm người lao động mà không mang sắc thái miệt thị.
