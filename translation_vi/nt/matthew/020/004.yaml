  text: καὶ ἐκείνοις εἶπεν· Ὑπάγετε καὶ ὑμεῖς εἰς τὸν ἀμπελῶνα, καὶ ὃ ἐὰν ᾖ δίκαιον δώσω ὑμῖν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/004.yaml
  text: And he said to them[a], ‘You also go into the vineyard, and whatever is right I will give you.’
translation:
  language: vi
  text: 'Ông nói với họ: “Các anh cũng hãy đi vào vườn nho; điều gì là chính đáng[a], tôi sẽ cho các anh.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “phải lẽ,” “công bằng.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκείνοις εἶπεν
  choice: Ông nói với họ
  rationale: Đại từ chỉ định số nhiều ở cách tặng chỉ những người làm công vừa được nhắc đến; “họ” tự nhiên và đủ rõ trong ngữ cảnh. “Nói” giữ cách dẫn lời trực tiếp của nguyên văn.
- source_word: Ὑπάγετε καὶ ὑμεῖς
  choice: Các anh cũng hãy vào
  rationale: Mệnh lệnh số nhiều được diễn đạt tự nhiên bằng “hãy”; “cũng” giữ ý nhấn mạnh rằng nhóm này được sai vào vườn nho như nhóm trước. Trong tiếng Việt, “vào” phù hợp với đích đến được nêu ngay sau đó.
- source_word: ἀμπελῶνα
  choice: vườn nho
  rationale: Tương đương thông dụng và chính xác của danh từ chỉ khu vườn trồng nho.
- source_word: ὃ ἐὰν ᾖ δίκαιον
  choice: điều gì là phải lẽ
  rationale: Giữ sắc thái đạo đức của δίκαιον là điều đúng đắn, công chính hoặc công bằng, mà không thu hẹp vào nghĩa pháp lý hay cảm nhận chủ quan về sự công bằng.
- source_word: δώσω ὑμῖν
  choice: tôi sẽ trả cho các anh
  rationale: Động từ có nghĩa cơ bản là “cho”, nhưng trong ngữ cảnh thỏa thuận với người làm công, tiếng Việt tự nhiên dùng “trả”; cách dịch này làm rõ đối tượng là tiền công mà không thêm mức tiền không có trong nguyên văn.
theological_decisions:
- issue: Cách dịch δίκαιον trong bối cảnh tiền công
  choice: phải lẽ
  alternative: công bằng; chính đáng; công chính
  rationale: “Phải lẽ” bảo toàn ý điều phù hợp với lẽ đúng và công lý, đồng thời không biến lời hứa của chủ vườn thành một công thức pháp lý hoặc giải quyết trước sự căng thẳng của dụ ngôn.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “các anh” cho nhóm người làm công trưởng thành; câu nói trực tiếp gọn và tự nhiên. Dấu chú thích [a] được đặt ngay sau cụm từ có phương án dịch khác.
