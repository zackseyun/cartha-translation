source:
  edition: SBLGNT
  text: σπλαγχνισθεὶς δὲ ὁ Ἰησοῦς ἥψατο τῶν ⸀ὀμμάτων αὐτῶν, καὶ εὐθέως ⸀ἀνέβλεψαν καὶ ἠκολούθησαν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/034.yaml
  text: And Jesus[a], moved with compassion, touched their eyes, and immediately they received their sight and followed him.
translation:
  language: vi
  text: Giê-su động lòng thương, chạm vào mắt họ; lập tức họ nhìn thấy[a] và đi theo Người.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Động từ Hy Lạp cũng có thể có nghĩa là “nhìn lên”; nhưng trong bối cảnh này, nó chỉ việc họ được nhìn thấy.
    reason: lexical_alternative
lexical_decisions:
- source_word: σπλαγχνισθεὶς
  choice: động lòng thương
  rationale: Diễn đạt tự nhiên sức nặng tình cảm của phân từ Hy Lạp, chỉ lòng thương xót sâu xa dẫn đến hành động.
- source_word: δὲ
  choice: liên kết bằng mạch câu, không dịch thành một từ riêng
  rationale: Ở đây δέ là từ nối nhẹ để tiếp diễn câu chuyện; trật tự câu tiếng Việt đã thể hiện sự tiếp nối tự nhiên mà không tạo nét tương phản không có trong nguyên văn.
- source_word: ἥψατο
  choice: chạm vào
  rationale: Trong bối cảnh chữa lành, động từ chỉ sự tiếp xúc thể lý; “chạm vào” rõ ràng và tự nhiên trong tiếng Việt.
- source_word: τῶν ὀμμάτων αὐτῶν
  choice: mắt họ
  rationale: Chuyển cấu trúc sở hữu Hy Lạp sang cách nói tiếng Việt gọn và tự nhiên.
- source_word: εὐθέως
  choice: lập tức
  rationale: Giữ rõ tính tức thời của kết quả chữa lành và phù hợp với văn phong kể chuyện trang trọng.
- source_word: ἀνέβλεψαν
  choice: họ nhìn thấy lại
  rationale: Trong bối cảnh hai người mù được chữa lành, động từ nói đến việc phục hồi thị lực. Cách dịch này rõ nghĩa nhưng chú thích vẫn ghi nhận nghĩa sát chữ có thể có là “ngước mắt lên”.
- source_word: ἠκολούθησαν αὐτῷ
  choice: đi theo ngài
  rationale: Giữ được cả nghĩa cụ thể là đi theo Chúa Giê-su và âm hưởng có thể liên quan đến việc theo làm môn đồ, nhưng không khẳng định quá điều câu này nói.
theological_decisions:
- issue: Bản chất của kết quả chữa lành trong ἀνέβλεψαν
  choice: Thị lực được phục hồi thật sự và ngay lập tức
  alternative: Họ chỉ ngước mắt lên hoặc bắt đầu nhìn thấy theo nghĩa ít xác định hơn
  rationale: Bối cảnh chữa lành hai người mù, cùng với εὐθέως, cho thấy sự phục hồi thị lực tức thời; tuy vậy, chú thích bảo lưu phạm vi nghĩa của động từ Hy Lạp.
- issue: Ý nghĩa của ἠκολούθησαν αὐτῷ
  choice: đi theo ngài
  alternative: trở thành môn đồ của ngài
  rationale: Nguyên văn nói họ đi theo Chúa Giê-su và có thể gợi ý việc theo làm môn đồ, nhưng không xác định rõ mức độ hay thời gian, nên bản dịch không diễn giải quá mức.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “Chúa Giê-su” và đại từ “ngài” theo cách tự nhiên, không thêm lời giải thích mang tính hệ phái. Dấu chấm phẩy giữ hai hành động chữa lành và kết quả tức thời trong cùng một mạch câu.
