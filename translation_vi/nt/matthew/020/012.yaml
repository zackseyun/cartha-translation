  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸀λέγοντες· Οὗτοι οἱ ἔσχατοι μίαν ὥραν ἐποίησαν, καὶ ἴσους ⸂αὐτοὺς ἡμῖν⸃ ἐποίησας τοῖς βαστάσασι τὸ βάρος τῆς ἡμέρας καὶ τὸν καύσωνα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/012.yaml
  text: saying[a], ‘These last worked one hour, and you made them equal to us who bore the burden of the day and the scorching heat.’
translation:
  language: vi
  text: 'họ nói: “Những người đến sau cùng này làm có một giờ, thế mà ông lại đặt họ ngang hàng với chúng tôi[a], là những người đã chịu gánh nặng suốt ngày và cái nóng thiêu đốt.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “ông lại coi họ ngang hàng với chúng tôi.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγοντες
  choice: họ nói
  rationale: Phân từ hiện tại số nhiều nối với hành động ở câu trước; tiếng Việt tự nhiên diễn đạt bằng động từ hữu hạn “họ nói”.
- source_word: Οὗτοι οἱ ἔσχατοι
  choice: Những người đến sau cùng này
  rationale: Chỉ những người được thuê sau cùng trong dụ ngôn, đồng thời giữ sắc thái đối chiếu của cụm Hy Lạp.
- source_word: μίαν ὥραν ἐποίησαν
  choice: làm có một giờ
  rationale: ποιέω đi với khoảng thời gian mang nghĩa làm việc trong khoảng ấy; “có một giờ” diễn đạt tự nhiên sắc thái phàn nàn về thời gian quá ngắn.
- source_word: ἴσους αὐτοὺς ἡμῖν ἐποίησας
  choice: ông lại đặt họ ngang hàng với chúng tôi
  rationale: Giữ ý gây nên sự ngang bằng trong cấu trúc Hy Lạp; “lại” chuyển tải tự nhiên sắc thái tương phản và bất bình trong lời than phiền.
- source_word: τοῖς βαστάσασι
  choice: là những người đã chịu
  rationale: βαστάζω ở đây vừa gợi việc mang gánh nặng vừa hàm ý chịu đựng; “đã chịu” phù hợp với lao động kéo dài.
- source_word: τὸ βάρος τῆς ἡμέρας
  choice: gánh nặng suốt ngày
  rationale: Bảo tồn hình ảnh “gánh nặng” của βάρος, đồng thời diễn đạt rõ đây là công việc nặng nhọc kéo dài cả ngày.
- source_word: τὸν καύσωνα
  choice: cái nóng thiêu đốt
  rationale: καύσων chỉ sức nóng gay gắt, bỏng rát; cách dịch này giữ được cường độ của từ.
theological_decisions:
- issue: Lời phàn nàn trong dụ ngôn về sự công bằng và bình đẳng
  choice: Trình bày thẳng lời phản đối của những người làm công, không thêm lời đánh giá về việc ông chủ có công bằng hay không.
  alternative: Diễn giải câu theo hướng nhấn mạnh rằng ông chủ đã đối xử bất công.
  rationale: Bản dịch cần giữ nguyên sức căng của dụ ngôn và quan điểm của người nói, không giải quyết trước ý nghĩa thần học rộng hơn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Làm có một giờ” mang khẩu khí phàn nàn tự nhiên; “đặt họ ngang hàng” giữ lực của cấu trúc gây khiến trong nguyên ngữ.
