source:
  edition: SBLGNT
  text: ⸂συμφωνήσας δὲ⸃ μετὰ τῶν ἐργατῶν ἐκ δηναρίου τὴν ἡμέραν ἀπέστειλεν αὐτοὺς εἰς τὸν ἀμπελῶνα αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/002.yaml
  text: After agreeing with the workers for one denarius for the day[a], he sent them into his vineyard.
translation:
  language: vi
  text: Sau khi thỏa thuận với những người làm công về tiền công một đơ-na-ri-ôn cho một ngày[a], ông gửi họ vào vườn nho của mình.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Đơ-na-ri-ôn là một đồng tiền cổ, thường tương đương tiền công một ngày của một lao động.
    reason: cultural_note
lexical_decisions:
- source_word: συμφωνήσας
  choice: Sau khi thỏa thuận
  rationale: Phân từ chủ động bất định diễn tả hành động xảy ra trước động từ chính; cách dịch này tự nhiên và giữ rõ trình tự hành động.
- source_word: δὲ
  choice: không dịch riêng
  rationale: Ở đây δέ là từ nối nhẹ trong mạch kể; cấu trúc “Sau khi…” đã tạo liên kết tự nhiên trong tiếng Việt.
- source_word: ἐργατῶν
  choice: những người làm công
  rationale: Phù hợp với bối cảnh thuê lao động và là cách nói hiện đại, dễ hiểu.
- source_word: ἐκ δηναρίου
  choice: mức một đơ-na-ri-ôn
  rationale: Diễn đạt số tiền công đã thỏa thuận, đồng thời giữ tên đơn vị tiền cổ thay vì thay bằng đơn vị hiện đại.
- source_word: τὴν ἡμέραν
  choice: cho một ngày
  rationale: Diễn đạt khoảng thời gian mà mức tiền công áp dụng, không thêm ý vượt quá nguyên văn.
- source_word: ἀπέστειλεν
  choice: ông sai
  rationale: Động từ kể chuyện chỉ việc chủ vườn phái những người làm công đi vào vườn; “sai” ngắn gọn và tự nhiên trong ngữ cảnh.
- source_word: ἀμπελῶνα
  choice: vườn nho
  rationale: Tương đương thông dụng và chính xác của danh từ Hy Lạp.
- source_word: αὐτοῦ
  choice: của mình
  rationale: Đại từ sở hữu quy chiếu về chủ ngữ là chủ vườn; “của mình” tự nhiên trong tiếng Việt và tránh cảm giác quy chiếu sang người khác.
theological_decisions: []
