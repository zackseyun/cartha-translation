- from: 'Ngài nói với họ: “Chén của tôi[a], các anh chắc chắn sẽ uống; nhưng việc ngồi bên phải và bên trái tôi thì không thuộc quyền tôi ban cho, mà những chỗ ấy dành cho ai thì Cha tôi đã chuẩn bị sẵn cho người đó.”'
  to: 'Ngài nói với họ: “Chén của tôi[a], các anh chắc chắn sẽ uống; nhưng việc ngồi bên phải và bên trái tôi thì không thuộc quyền tôi ban cho, mà dành cho những người mà Cha tôi đã chuẩn bị sẵn các chỗ ấy.”'
  rationale: 'Chỉ chỉnh vế cuối để phản ánh rõ cấu trúc tỉnh lược của tiếng Hy Lạp và tạo câu tiếng Việt tự nhiên: các chỗ bên phải và bên trái được dành cho những người mà Cha đã chuẩn bị các chỗ ấy cho họ. Bản sửa vẫn giữ thể hoàn thành («đã chuẩn bị sẵn»), tác nhân là Cha, và sức căng nguyên văn trong lời «không thuộc quyền tôi ban cho».'
