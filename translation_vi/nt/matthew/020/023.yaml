id: MAT.20.23
reference: Matthew 20:23
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸀λέγει αὐτοῖς· Τὸ μὲν ποτήριόν μου ⸀πίεσθε, τὸ δὲ καθίσαι ἐκ δεξιῶν μου καὶ ἐξ ⸀εὐωνύμων οὐκ ἔστιν ⸀ἐμὸν δοῦναι, ἀλλ’ οἷς ἡτοίμασται ὑπὸ τοῦ πατρός μου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/023.yaml
  text: He said to them[a], “You will indeed drink my cup, but to sit at my right and at my left is not mine to grant[b], but it is for those for whom it has been prepared by my Father.”
translation:
  language: vi
  text: 'Ngài nói với họ: “Chén của tôi[a], các anh chắc chắn sẽ uống; nhưng việc ngồi bên phải và bên trái tôi thì không thuộc quyền tôi ban cho, mà dành cho những người mà Cha tôi đã chuẩn bị sẵn các chỗ ấy.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Chén” là hình ảnh chỉ sự đau khổ hoặc phần số đã được định cho Chúa Giê-su, là điều các môn đồ của Ngài cũng sẽ dự phần.
    reason: Giải thích ẩn dụ trong nguyên văn mà không thay thế hình ảnh ấy trong chính văn.
lexical_decisions:
- source_word: λέγει αὐτοῖς
  choice: Ngài nói với họ
  rationale: Dịch thì hiện tại lịch sử của tiếng Hy Lạp bằng thì quá khứ theo lối kể chuyện tự nhiên trong tiếng Việt; đại từ “Ngài” giữ sắc thái tôn kính phù hợp khi nói về Chúa Giê-su.
- source_word: Τὸ μὲν ποτήριόν μου πίεσθε
  choice: Chén của tôi, các anh chắc chắn sẽ uống
  rationale: Giữ nguyên hình ảnh ẩn dụ “chén” thay vì diễn giải ngay trong chính văn. “Chắc chắn” thể hiện lời khẳng định trong cấu trúc tương phản μὲν...δέ, còn động từ tương lai πίεσθε được dịch là “sẽ uống”.
- source_word: καθίσαι ἐκ δεξιῶν μου καὶ ἐξ εὐωνύμων
  choice: việc ngồi bên phải và bên trái tôi
  rationale: Cách nói tự nhiên trong tiếng Việt, chỉ các vị trí danh dự ở hai bên Chúa Giê-su mà không thêm lời giải thích vào chính văn.
- source_word: οὐκ ἔστιν ἐμὸν δοῦναι
  choice: không thuộc quyền tôi ban cho
  rationale: Diễn đạt tự nhiên ý “không phải phần/thẩm quyền của tôi để ban”, đồng thời giữ nguyên sức căng của phát biểu, không thêm điều kiện hay lời giải thích thần học.
- source_word: ἀλλ’ οἷς ἡτοίμασται ὑπὸ τοῦ πατρός μου
  choice: mà những chỗ ấy dành cho ai thì Cha tôi đã chuẩn bị sẵn cho người đó
  rationale: Câu Hy Lạp tỉnh lược đối tượng được chuẩn bị. Tiếng Việt bổ sung “những chỗ ấy” theo ngữ cảnh để câu rõ nghĩa, đồng thời giữ thể hoàn thành bị động qua ý “đã chuẩn bị sẵn” và xác định Cha là tác nhân.
theological_decisions:
- issue: Hàm ý Kitô học trong lời “không thuộc quyền tôi ban cho”
  choice: Dịch thẳng lời tuyên bố, không thêm từ ngữ nhằm hạn chế hoặc giải thích lại.
  alternative: Thêm ý như “nếu không có Cha” hoặc “ngoài ý muốn của Cha”.
  rationale: Nguyên văn không có những điều kiện ấy. Bản dịch cần giữ nguyên sức căng thần học giữa thẩm quyền của Chúa Giê-su và sự chuẩn bị của Cha, thay vì tự ý dung hòa.
- issue: Ý nghĩa của “chén”
  choice: Giữ ẩn dụ “chén” trong chính văn và giải thích ngắn trong chú thích.
  alternative: Diễn giải trực tiếp trong chính văn là “sự đau khổ” hoặc “số phận”.
  rationale: Hình ảnh “chén” là một phần quan trọng trong lời Chúa Giê-su và có phạm vi ý nghĩa rộng hơn một cách diễn giải đơn nhất.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “các anh” vì Chúa Giê-su đang trực tiếp nói với hai môn đồ nam trong ngữ cảnh; tránh các từ Hán-Việt cổ như “bên hữu” và “bên tả”. Đại từ “tôi” trong lời Chúa Giê-su phản ánh lối xưng hô trực tiếp, tự nhiên của tiếng Việt hiện đại.
