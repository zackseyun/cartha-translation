base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/033.yaml
  text: They said to him[a], “Lord, let our eyes be opened.”
translation:
  language: vi
  text: 'Họ thưa với Ngài[a]: “Lạy Chúa, xin cho mắt chúng tôi được mở ra.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “Họ thưa với ông: ‘Thưa ngài, xin cho mắt chúng tôi được mở ra.’”'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγουσιν αὐτῷ
  choice: Họ thưa với Ngài
  rationale: Động từ hiện tại lịch sử được chuyển sang lối kể tự nhiên trong tiếng Việt; “thưa” phù hợp với lời đáp trực tiếp mang sắc thái kính trọng, còn αὐτῷ được biểu đạt bằng “với Ngài”.
- source_word: Κύριε
  choice: Lạy Chúa
  rationale: Dạng hô cách của κύριος. “Lạy Chúa” là cách xưng hô tự nhiên, trang trọng trong tiếng Việt, đồng thời giữ được cả sắc thái kính trọng lẫn khả năng nhìn nhận thẩm quyền của Đức Giê-su.
- source_word: ἵνα ἀνοιγῶσιν
  choice: xin cho ... được mở ra
  rationale: ἵνα với động từ giả định ở đây nêu nội dung lời cầu xin. Cấu trúc “xin cho ... được” tự nhiên trong tiếng Việt và “được mở ra” giữ sắc thái bị động của ἀνοιγῶσιν.
- source_word: οἱ ὀφθαλμοὶ ἡμῶν
  choice: mắt chúng tôi
  rationale: Cách diễn đạt sở hữu tự nhiên trong tiếng Việt, chỉ đôi mắt của những người đang lên tiếng.
theological_decisions:
- issue: Cách dịch κύριος khi dùng để thưa với Đức Giê-su
  choice: Lạy Chúa
  alternative: Thưa ngài
  rationale: “Lạy Chúa” phù hợp với cách dùng κύριος trong Ma-thi-ơ và bảo toàn sức nặng thần học có thể có của lời xưng hô, nhưng chú thích vẫn ghi nhận nghĩa kính ngữ nhẹ hơn mà ngữ cảnh không hoàn toàn loại trừ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Xin cho mắt chúng tôi được mở ra” vừa tự nhiên như một lời khẩn cầu vừa giữ hình thái bị động của nguyên văn. Đại từ “Ngài” tương ứng với cách xưng hô “Lạy Chúa”; chú thích bảo tồn khả năng hiểu κύριος và đại từ quy chiếu theo nghĩa kính ngữ thông thường.
