  source_fidelity: Câu dịch đúng trình tự của phân từ aorist λαβόντες và hướng đối nghịch của κατά. Tuy nhiên, “bắt đầu càu nhàu” giải thích thì chưa hoàn thành ἐγόγγυζον theo nghĩa khởi phát quá mạnh; thì này cũng, và tự nhiên hơn ở đây, có thể chỉ hành động đang/tiếp diễn trong quá khứ.
  naturalness: “Khi nhận tiền rồi” có sự lặp ý thời gian và kém tự nhiên hơn “Sau khi nhận tiền”. “Càu nhàu với” là cách nói hiện đại, tự nhiên và phù hợp sắc thái γογγύζω.
  terminology: “Chủ nhà” có thể dùng cho οἰκοδεσπότης, dù trong ngữ cảnh dụ ngôn người này là chủ đất. Không cần thay bằng “chủ đất” trong thân câu vì từ Hy Lạp trước hết chỉ chủ gia/chủ nhà; có thể nêu cách dịch theo ngữ cảnh ở chú thích.
