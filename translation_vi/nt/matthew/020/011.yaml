  yaml_path: translation/nt/matthew/020/011.yaml
  text: And after receiving it[a], they began grumbling against the master of the house,
translation:
  language: vi
  text: Sau khi nhận tiền, họ càu nhàu với chủ nhà,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “Sau khi nhận [tiền], họ cứ phàn nàn chống lại chủ đất.”'
    reason: Nêu khả năng diễn đạt sắc thái tiếp diễn của động từ chưa hoàn thành, hướng đối nghịch của κατά, và nghĩa của οἰκοδεσπότης theo bối cảnh dụ ngôn.
lexical_decisions:
- source_word: λαβόντες
  choice: Khi nhận tiền rồi
  rationale: Phân từ bất định quá khứ diễn tả hành động xảy ra trước động từ chính. Tiếng Hy Lạp không nêu tân ngữ; bản dịch thêm “tiền” theo ngữ cảnh khoản tiền công để câu tiếng Việt tự nhiên và rõ nghĩa.
- source_word: δὲ
  choice: không dịch riêng
  rationale: δέ là liên từ nhẹ để tiếp nối câu chuyện. Quan hệ tiếp diễn đã được thể hiện tự nhiên bằng cấu trúc câu tiếng Việt, nên không cần thêm “và” hoặc “nhưng”.
- source_word: ἐγόγγυζον
  choice: họ bắt đầu càu nhàu
  rationale: Thì chưa hoàn thành có thể diễn tả hành động đang tiếp diễn hoặc mới khởi phát. “Bắt đầu càu nhàu” phù hợp trình tự sau khi nhận tiền và giữ sắc thái bất mãn, lẩm bẩm của γογγύζω.
- source_word: κατὰ
  choice: với
  rationale: κατά với sở hữu cách chỉ sự phản đối hướng về một người. Trong tiếng Việt, “càu nhàu với” tự nhiên hơn “càu nhàu chống lại” mà vẫn cho thấy lời bất mãn nhắm vào chủ nhà.
- source_word: τοῦ οἰκοδεσπότου
  choice: chủ nhà
  rationale: οἰκοδεσπότης chỉ người đứng đầu một gia đình hoặc cơ nghiệp. “Chủ nhà” ngắn gọn, tự nhiên và giữ được nét nghĩa của từ ghép; trong bối cảnh dụ ngôn cũng có thể hiểu là chủ đất.
theological_decisions: []
