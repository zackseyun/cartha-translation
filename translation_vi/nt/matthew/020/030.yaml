  source_fidelity: 'Bản nháp truyền đạt đúng các thành phần chính của câu: hai người mù ngồi bên đường, nghe Đức Giê-su đi ngang qua, rồi lớn tiếng kêu xin thương xót. Tuy nhiên, «υἱὸς Δαυίδ» là danh hiệu nguyên văn «Con Đa-vít»; việc thêm «vua» trong «Con vua Đa-vít» không có trong tiếng Hy Lạp và làm thay đổi hình thức danh hiệu.'
