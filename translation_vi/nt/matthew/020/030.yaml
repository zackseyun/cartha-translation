source:
  edition: SBLGNT
  text: καὶ ἰδοὺ δύο τυφλοὶ καθήμενοι παρὰ τὴν ὁδόν, ἀκούσαντες ὅτι Ἰησοῦς παράγει, ἔκραξαν λέγοντες· ⸂Κύριε, ἐλέησον ἡμᾶς⸃, ⸀υἱὸς Δαυίδ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/030.yaml
  text: And behold, two blind men sitting by the road, when they heard that Jesus was passing by, cried out, saying, “Lord, have mercy on us, Son of David.”
translation:
  language: vi
  text: 'Kìa, hai người mù đang ngồi bên đường. Nghe nói Đức Giê-su đi ngang qua, họ kêu lên: “Lạy Chúa, xin thương xót chúng con, Con Đa-vít!”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: Kìa
  rationale: Giữ chức năng hướng sự chú ý và nét sống động của lời kể; “Kìa” tự nhiên và trang trọng vừa phải trong tiếng Việt hiện đại.
- source_word: δύο τυφλοὶ
  choice: hai người mù
  rationale: Diễn đạt rõ hai nhân vật nam theo ngữ cảnh, đồng thời dùng cách gọi tự nhiên, tôn trọng trong tiếng Việt.
- source_word: καθήμενοι παρὰ τὴν ὁδόν
  choice: ngồi bên đường
  rationale: Chuyển tải trực tiếp tư thế và địa điểm bằng cách nói thông dụng.
- source_word: ἀκούσαντες ὅτι Ἰησοῦς παράγει
  choice: Khi nghe rằng Đức Giê-su đang đi ngang qua
  rationale: Hiểu phân từ aorist theo quan hệ thời gian; “đang đi ngang qua” thể hiện tự nhiên hành động παράγει trong bối cảnh.
- source_word: ἔκραξαν λέγοντες
  choice: họ kêu lớn
  rationale: “Kêu lớn” giữ được cường độ của κράζω; không cần dịch máy móc λέγοντες thành “mà rằng” vì lời nói trực tiếp đã biểu đạt ý này.
- source_word: Κύριε
  choice: Lạy Chúa
  rationale: “Lạy” đánh dấu lời xưng hô khẩn cầu, còn “Chúa” bảo tồn sắc thái tôn kính và khả năng hàm ý Kitô học của κύριος trong ngữ cảnh.
- source_word: ἐλέησον ἡμᾶς
  choice: xin thương xót chúng con
  rationale: Cách cầu xin tự nhiên, trang nghiêm, phản ánh mệnh lệnh khẩn thiết và ý nghĩa cầu mong lòng thương xót.
- source_word: υἱὸς Δαυίδ
  choice: Con vua Đa-vít
  rationale: Giữ danh hiệu Mê-si-a “Con Đa-vít”; thêm “vua” để người đọc Việt nhận ra rõ hơn quy chiếu đến Đa-vít trong tư cách vua, mà không biến cụm từ thành mô tả thuần phả hệ.
theological_decisions:
- issue: Cách dịch κύριος khi trực tiếp xưng hô với Đức Giê-su
  choice: Lạy Chúa
  alternative: Thưa ngài
  rationale: Đi cùng danh hiệu “Con vua Đa-vít”, κύριος mang sức nặng tôn kính và Mê-si-a. “Lạy Chúa” giữ sức nặng ấy nhưng không giải thích quá mức bản thể học ngay trong câu.
- issue: Sức nặng Mê-si-a của υἱὸς Δαυίδ
  choice: Con vua Đa-vít
  alternative: hậu duệ vua Đa-vít
  rationale: Giữ hình thức danh hiệu thay vì làm phẳng thành một nhận định gia phả; cách dịch này bảo tồn âm hưởng vương quyền và Mê-si-a trong Ma-thi-ơ.
translation_notes:
  register: Văn phong hiện đại, rõ ràng và trang nghiêm. Dùng “Đức Giê-su” và “Đa-vít” theo lối phiên âm quen thuộc; lời kêu xin dùng “chúng con” để phù hợp cách xưng hô với “Chúa”. Không cần chú thích vì câu không có dị bản hay độ mơ hồ cần giải trình trong bản văn.
