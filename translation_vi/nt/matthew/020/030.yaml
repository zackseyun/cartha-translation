revisions:
- from: 'Kìa, có hai người mù ngồi bên đường. Khi nghe rằng Đức Giê-su đang đi ngang qua, họ kêu lớn: “Lạy Chúa, Con vua Đa-vít, xin thương xót chúng con!”'
  to: 'Kìa, hai người mù đang ngồi bên đường. Nghe nói Đức Giê-su đi ngang qua, họ kêu lên: “Lạy Chúa, xin thương xót chúng con, Con Đa-vít!”'
  rationale: 'Sửa danh hiệu «Con vua Đa-vít» thành «Con Đa-vít» để loại bỏ phần bổ sung không có trong nguyên văn, đồng thời chỉnh nhẹ cách diễn đạt cho tự nhiên. Trật tự lời kêu xin được giữ theo nguyên văn: xưng hô «Lạy Chúa», lời cầu xin, rồi danh hiệu «Con Đa-vít».'
