  terminology: Giữ «Lạy Chúa» cho Κύριε và «Con Đa-vít» cho υἱὸς Δαυίδ. «Con Đa-vít» vừa sát nguyên văn vừa bảo tồn danh hiệu trong Ma-thi-ơ mà không thêm diễn giải về vương quyền.
