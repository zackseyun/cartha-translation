  to: Giữa các con sẽ không như vậy.[a] Trái lại, ai muốn trở nên lớn giữa các con thì sẽ là người phục vụ các con.
  rationale: Sửa tối thiểu để bản văn chính phản ánh thì tương lai của ἔσται, theo sát nguồn Hy Lạp và hướng xử lý của bản kiểm tra tiếng Anh, nhưng không phủ nhận lực quy chuẩn do ngữ cảnh tạo nên. Các cụm còn lại được giữ vì truyền đạt đúng ý nghĩa và tự nhiên.
