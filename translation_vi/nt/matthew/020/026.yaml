source:
  edition: SBLGNT
  text: οὐχ οὕτως ⸀ἔσται ἐν ὑμῖν· ἀλλ’ ὃς ⸀ἂν θέλῃ ἐν ὑμῖν μέγας γενέσθαι ἔσται ὑμῶν διάκονος,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/026.yaml
  text: It shall not be so among you[a]. But whoever wants to become great among you shall be your servant,
translation:
  language: vi
  text: Giữa các con sẽ không như vậy.[a] Trái lại, ai muốn trở nên lớn giữa các con thì sẽ là người phục vụ các con.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hy Lạp dùng động từ ở thì tương lai: “sẽ không như vậy.” Trong ngữ cảnh lời dạy này, thì tương lai cũng có thể mang sắc thái quy chuẩn: điều ấy không nên xảy ra giữa những người theo Chúa Giê-su.'
    reason: Giữ hình thức tương lai của ἔσται trong bản văn chính, đồng thời ghi nhận lực quy chuẩn có thể có trong ngữ cảnh.
lexical_decisions:
- source_word: οὐχ οὕτως ἔσται ἐν ὑμῖν
  choice: Giữa các con thì không được như vậy
  rationale: Động từ tương lai ἔσται trong lời dạy này mang sắc thái quy chuẩn, nói điều không được phép trở thành lối ứng xử trong cộng đồng môn đồ. “Giữa các con” diễn đạt tự nhiên ἐν ὑμῖν.
- source_word: ἀλλ’ ὃς ἂν θέλῃ
  choice: Trái lại, ai muốn
  rationale: ὃς ἂν với lối giả định diễn tả một trường hợp khái quát; “ai” phù hợp với tiếng Việt hiện đại. θέλῃ mang ý chí, được chuyển là “muốn”.
- source_word: μέγας γενέσθαι
  choice: trở nên lớn
  rationale: “Trở nên” giữ sắc thái chuyển biến của γενέσθαι, thay vì giản lược thành trạng thái “là người lớn”.
- source_word: διάκονος
  choice: người phục vụ
  rationale: Trong ngữ cảnh, διάκονος chỉ người phục vụ, không nhất thiết là chức vụ giáo hội. Cách dịch này cũng phân biệt với δοῦλος, từ nhấn mạnh thân phận nô lệ hơn.
- source_word: ὑμῶν
  choice: các con
  rationale: Đại từ sở hữu số nhiều được diễn đạt theo quan hệ trong cụm “người phục vụ các con”, tự nhiên hơn cách dịch sát chữ “người phục vụ của các con”.
theological_decisions:
- issue: Bản chất của sự lớn lao trong cộng đồng những người theo Chúa Giê-su
  choice: 'Diễn đạt lời này như sự đảo ngược chuẩn mực quyền lực: người muốn trở nên lớn phải phục vụ người khác.'
  alternative: Hiểu διάκονος là chức vụ “chấp sự”, hoặc lược hóa lời dạy thành một lời kêu gọi khiêm nhường chung chung.
  rationale: Ngữ cảnh đối chiếu cách các nhà cai trị dân ngoại thi hành quyền lực với chuẩn mực dành cho môn đồ. Bản dịch giữ hình ảnh phục vụ cụ thể nhưng không đưa cơ cấu giáo hội về sau vào câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “các con” theo ngữ cảnh Chúa Giê-su nói với các môn đồ; “không được như vậy” chuyển tải tự nhiên lực quy chuẩn của động từ tương lai. Dấu chú thích [a] xuất hiện ngay sau mệnh đề liên quan.
