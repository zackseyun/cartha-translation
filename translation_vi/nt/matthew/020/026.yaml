review_pass:
  verdict: revise
  source_fidelity: Cần giữ rõ động từ tương lai ἔσται. “Không được như vậy” nêu một cách diễn giải quy chuẩn hợp ngữ cảnh, nhưng thay thế sắc thái tương lai của nguyên văn thay vì chỉ để sắc thái ấy được hiểu qua ngữ cảnh.
  naturalness: “Giữa các con sẽ không như vậy” tự nhiên trong văn phong Kinh Thánh Việt ngữ hiện đại. “Người phục vụ các con” diễn đạt rõ quan hệ sở hữu/phục vụ và phù hợp với ngữ cảnh.
  terminology: “Trở nên lớn” giữ sắc thái khởi đầu/chuyển biến của γενέσθαι; “người phục vụ” chuyển tải διάκονος mà không gợi chức vụ “chấp sự” về sau. Cách xưng hô “các con” có thể được giữ theo đăng ký lời Chúa Giê-su nói với môn đồ trong bản dịch.
  issues:
  - severity: medium
    issue: Mệnh đề đầu chuyển ἔσται thành “không được”.
    rationale: Động từ ἔσται là tương lai (“sẽ là/ sẽ xảy ra”), dù trong lời dạy có thể mang lực quy chuẩn. Bản dịch chính nên bảo lưu tương lai; lực quy chuẩn có thể được giải thích trong chú thích.
  - severity: low
    issue: Chú thích nêu phương án hiện tại nhưng chưa giải thích trực tiếp phương án dịch chính đã chọn.
    rationale: Sau khi bảo lưu tương lai trong bản văn chính, chú thích nên trình bày khả năng hiểu lực quy chuẩn của thì tương lai, thay vì coi câu hiện tại là phương án dịch tương đương chính.
