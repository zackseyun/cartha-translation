    rationale: καὶ αὐτοί nhấn mạnh “họ cũng/thậm chí họ cũng”, không tự nó có trạng từ giới hạn tương đương “chỉ”. Dù ngữ cảnh tạo sự thất vọng, nên không thêm sắc thái hạn định vào bản văn.
  - severity: low
    issue: Cách diễn đạt chú thích về đơ-ni-ê
    rationale: Nguồn tiếng Anh nêu giá trị tiền công thường ngày; diễn đạt “một đơ-ni-ê là tiền công thường trả cho một ngày lao động” phản ánh trực tiếp và chính xác hơn.
