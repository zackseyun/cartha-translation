  text: ⸂καὶ ἐλθόντες⸃ οἱ πρῶτοι ἐνόμισαν ὅτι ⸀πλεῖον λήμψονται· καὶ ἔλαβον ⸂τὸ ἀνὰ δηνάριον καὶ αὐτοί⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/010.yaml
  text: When the first ones came[a], they thought they would receive more[b], but they too received a denarius each.
translation:
  language: vi
  text: Khi những người được thuê trước đến, họ tưởng mình sẽ nhận được nhiều hơn; nhưng họ cũng nhận mỗi người một đơ-ni-ê[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Một đơ-ni-ê là tiền công thường trả cho một ngày lao động.
    reason: cultural_note
lexical_decisions:
- source_word: ἐλθόντες
  choice: đến
  rationale: Phân từ bất định của ἔρχομαι mang chức năng chỉ thời gian; cấu trúc “Khi ... đến” diễn đạt tự nhiên trình tự câu chuyện.
- source_word: οἱ πρῶτοι
  choice: những người được thuê trước
  rationale: Trong ngữ cảnh dụ ngôn, cụm này chỉ nhóm thợ được thuê đầu tiên. Bổ sung “được thuê” làm rõ sở chỉ đã có trong văn cảnh mà không biến nó thành thứ bậc trừu tượng.
- source_word: ἐνόμισαν
  choice: họ tưởng
  rationale: νομίζω ở đây diễn tả sự suy đoán hoặc kỳ vọng. “Tưởng” tự nhiên và phù hợp vì kỳ vọng ấy sau đó không thành.
- source_word: πλεῖον
  choice: nhiều hơn
  rationale: Dạng so sánh chỉ số tiền công lớn hơn; “nhiều hơn” ngắn gọn và tự nhiên.
- source_word: λήμψονται
  choice: sẽ nhận được
  rationale: Thì tương lai nằm trong nội dung suy nghĩ của họ; tiếng Việt không cần lùi thì và “sẽ nhận được” giữ rõ kỳ vọng hướng về việc trả công sắp xảy ra.
- source_word: τὸ ἀνὰ δηνάριον
  choice: mỗi người một đơ-ni-ê
  rationale: ἀνά với đối cách mang nghĩa phân phối, tức mỗi người nhận một đồng; mạo từ cũng gợi lại mức công đã thỏa thuận.
- source_word: καὶ αὐτοί
  choice: họ cũng chỉ
  rationale: “Cũng” giữ sắc thái nhấn mạnh rằng nhóm này nhận bằng các nhóm kia; “chỉ” làm nổi bật sự tương phản với kỳ vọng nhận nhiều hơn, phù hợp diễn tiến câu nhưng không thay đổi số tiền.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “đơ-ni-ê” là dạng phiên âm quen thuộc của đơn vị tiền cổ; chú thích cung cấp bối cảnh văn hóa. Dấu chấm phẩy giữ mối tương phản chặt giữa kỳ vọng và kết quả.
