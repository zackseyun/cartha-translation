  to: Khi những người được thuê trước đến, họ tưởng mình sẽ nhận được nhiều hơn; nhưng họ cũng nhận mỗi người một đơ-ni-ê[a].
  rationale: Bỏ “chỉ” để không bổ sung sắc thái giới hạn ngoài cách nhấn mạnh của καὶ αὐτοί, đồng thời chỉnh chú thích cho khớp chính xác với ghi chú văn hóa của bản đối chiếu. Các yếu tố còn lại của bản dịch được giữ nguyên vì phản ánh đúng tiếng Hy Lạp và dùng tiếng Việt tự nhiên.
  reviewer_model: gpt-5.6-terra
