id: MAT.20.9
reference: Matthew 20:9
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸂καὶ ἐλθόντες⸃ οἱ περὶ τὴν ἑνδεκάτην ὥραν ἔλαβον ἀνὰ δηνάριον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/009.yaml
  text: And those who came about the eleventh hour received a denarius each[a].
translation:
  language: vi
  text: Những người đến vào khoảng giờ thứ mười một nhận được mỗi người một đơ-ni-ê[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Đơ-ni-ê là một đồng bạc La Mã thông dụng, thường được xem là tiền công điển hình của một ngày lao động.
    reason: cultural_note
lexical_decisions:
- source_word: καὶ
  choice: '[không dịch riêng]'
  rationale: Liên từ nối tiếp câu chuyện; trong tiếng Việt, mở câu bằng “Và” ở đây không cần thiết, còn mạch kể vẫn rõ.
- source_word: ἐλθόντες
  choice: đến
  rationale: Diễn đạt tự nhiên phân từ bất định quá khứ bổ nghĩa cho nhóm người, không thêm ý “được thuê” vốn chỉ hàm ẩn trong ngữ cảnh.
- source_word: οἱ περὶ τὴν ἑνδεκάτην ὥραν
  choice: những người đến vào khoảng giờ thứ mười một
  rationale: Giữ sắc thái thời gian xấp xỉ của περὶ và cách tính giờ lịch sử, tránh tự ý chuyển thành giờ hiện đại trong chính văn.
- source_word: ἔλαβον
  choice: nhận được
  rationale: Phù hợp với ngữ cảnh nhận tiền công và tự nhiên trong tiếng Việt.
- source_word: ἀνὰ
  choice: mỗi người một
  rationale: 'Thể hiện rõ ý phân phối: mỗi người nhận một đồng.'
- source_word: δηνάριον
  choice: đơ-ni-ê
  rationale: Giữ tên đồng tiền lịch sử thay vì thay bằng cách diễn giải giá trị; thông tin văn hóa được đưa vào chú thích.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Cụm “giờ thứ mười một” giữ cách gọi giờ trong nguyên văn; câu không thêm “được thuê” vì động từ ấy không xuất hiện tại đây.
