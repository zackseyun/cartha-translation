  text: And when the ten heard it, they became indignant about the two brothers.
translation:
  language: vi
  text: Khi nghe vậy, mười người kia bất bình về hai anh em ấy.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀκούσαντες
  choice: Khi nghe vậy
  rationale: Phân từ thời điểm được diễn đạt tự nhiên trong tiếng Việt; “vậy” quy chiếu về lời thỉnh cầu vừa nêu trong ngữ cảnh mà không thêm một tân ngữ cụ thể.
- source_word: οἱ δέκα
  choice: mười môn đồ kia
  rationale: Nguyên văn chỉ nói “mười người”; thêm “môn đồ” làm rõ đối tượng đã hiển nhiên trong ngữ cảnh, còn “kia” tạo thế đối chiếu tự nhiên với hai anh em.
- source_word: ἠγανάκτησαν
  choice: bất bình
  rationale: Diễn đạt phản ứng giận dữ, khó chịu vì cho là không thỏa đáng; trang trọng, tự nhiên và không phóng đại thành cơn thịnh nộ.
- source_word: περὶ τῶν δύο ἀδελφῶν
  choice: về hai anh em
  rationale: Giữ sắc thái rộng của περί là “về/liên quan đến”, thay vì thu hẹp thành “với” hoặc xác định rõ họ giận trực tiếp hai người.
theological_decisions:
- issue: Đối tượng và sắc thái của sự bất bình
  choice: bất bình về hai anh em
  alternative: bất bình với hai anh em
  rationale: Cách dịch “về” bảo toàn cấu trúc περί và sự mơ hồ chân thực về việc sự bất bình hướng trực tiếp vào hai anh em hay liên quan đến hành động của họ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu ngắn, giữ quan hệ thời gian của phân từ Hy Lạp và không giải thích thêm động cơ của mười môn đồ.
