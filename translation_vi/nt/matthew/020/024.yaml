  source_fidelity: Cần bỏ “môn đồ”, vì οἱ δέκα chỉ nói “mười người” (dù ngữ cảnh cho biết họ là các môn đồ). Bản dịch giữ đúng quan hệ thời gian của ἀκούσαντες, sắc thái bất bình của ἠγανάκτησαν, và phạm vi rộng của περὶ (“về/liên quan đến”).
  naturalness: Câu sửa vẫn tự nhiên, ngắn gọn và phù hợp văn phong Kinh Thánh tiếng Việt hiện đại. “Mười người kia” và “hai anh em ấy” giúp nhận diện các nhóm đã được nhắc đến trong mạch văn mà không thêm chức phận vào bản văn.
  terminology: “Bất bình về” là cách chuyển ngữ trung tính và phù hợp cho ἠγανάκτησαν περὶ, không ép nghĩa thành trực tiếp bất bình “với” hai người. Không có thuật ngữ thần học hoặc tên riêng cần hiệu chỉnh.
