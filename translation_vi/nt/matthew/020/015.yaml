  text: ⸀οὐκ ἔξεστίν μοι ⸂ὃ θέλω ποιῆσαι⸃ ἐν τοῖς ἐμοῖς; ⸀ἢ ὁ ὀφθαλμός σου πονηρός ἐστιν ὅτι ἐγὼ ἀγαθός εἰμι;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/015.yaml
  text: Is it not lawful for me to do what I want with what is mine? Or is your eye evil because I am good?[a]
translation:
  language: vi
  text: Chẳng phải tôi được quyền làm điều tôi muốn với những gì thuộc về tôi sao? Hay mắt anh xấu vì tôi tốt?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Hay anh ganh tị vì tôi tốt?” Thành ngữ “mắt anh xấu” chỉ sự ganh tị hoặc lòng bực tức, đố kỵ vì người khác được đối xử rộng rãi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔξεστίν
  choice: được phép
  rationale: Diễn đạt điều hợp pháp hoặc được quyền làm trong một câu hỏi tu từ, tự nhiên trong tiếng Việt hiện đại.
- source_word: ὃ θέλω ποιῆσαι
  choice: làm điều mình muốn
  rationale: Truyền đạt trực tiếp ý muốn cá nhân của θέλω mà không dùng lối nói cổ.
- source_word: ἐν τοῖς ἐμοῖς
  choice: với tài sản của mình
  rationale: Trong bối cảnh dụ ngôn, cụm này chỉ những gì thuộc quyền sở hữu của chủ; “tài sản” làm rõ nghĩa kinh tế mà vẫn giữ ý sở hữu.
- source_word: ὁ ὀφθαλμός σου πονηρός
  choice: mắt anh là xấu
  rationale: Giữ nguyên hình ảnh thành ngữ Hy Lạp để bảo toàn sự đối lập với lòng tốt của người chủ; chú thích nêu nghĩa hàm ý là ganh tị hoặc bực tức.
- source_word: ἀγαθός
  choice: người tốt
  rationale: Giữ nghĩa cơ bản “tốt” thay vì thu hẹp thành “rộng lượng”, dù sự rộng lượng được hàm ý trong ngữ cảnh.
theological_decisions:
- issue: Có nên giải nghĩa thành ngữ ὁ ὀφθαλμός σου πονηρός ngay trong chính văn hay không
  choice: Giữ hình ảnh sát nguyên văn “mắt anh là xấu” trong chính văn
  alternative: Hay anh ganh tị vì tôi là người tốt?
  rationale: Cách dịch này duy trì hình ảnh và sự căng thẳng giữa “mắt xấu” của người làm công với sự tốt lành của chủ, không âm thầm giới hạn thành ngữ vào duy nhất một cách giải thích.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng vừa phải và dễ hiểu. Đại từ “tôi—anh” phù hợp lời người chủ nói trực tiếp với người làm công; cấu trúc câu hỏi tu từ được giữ lại.
