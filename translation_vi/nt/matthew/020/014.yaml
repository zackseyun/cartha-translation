  text: ἆρον τὸ σὸν καὶ ὕπαγε· θέλω δὲ τούτῳ τῷ ἐσχάτῳ δοῦναι ὡς καὶ σοί·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/014.yaml
  text: Take what is yours and go[a]. But I want to give to this last man the same as to you.
translation:
  language: vi
  text: “Hãy lấy phần của anh rồi đi.[a] Còn tôi muốn cho người cuối cùng này phần giống như phần cho anh.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Hãy nhận lấy phần thuộc về anh rồi đi.”'
    reason: ἆρον trong ngữ cảnh này có thể được hiểu theo sắc thái “lấy” hoặc “nhận lấy”; τὸ σὸν cũng có thể diễn đạt là “phần thuộc về anh.”
lexical_decisions:
- source_word: ἆρον
  choice: hãy lấy
  rationale: Mệnh lệnh aorist của αἴρω ở đây yêu cầu người làm công lấy phần thuộc về mình. “Hãy lấy” tự nhiên, trực tiếp và không thêm ý nghĩa “tiền công” vào chính động từ.
- source_word: τὸ σὸν
  choice: phần của anh
  rationale: Cụm tính từ sở hữu được danh từ hóa có nghĩa đen là “cái thuộc về anh.” “Phần của anh” là cách nói tự nhiên trong tiếng Việt, giữ được độ rộng của nguyên văn mà không diễn giải cụ thể thành “tiền công của anh.”
- source_word: ὕπαγε
  choice: đi đi
  rationale: Mệnh lệnh này mang ý cho người nghe rời đi. “Đi đi” giữ sắc thái trực tiếp của lời nói nhưng không nhất thiết cường điệu thành sự xua đuổi thù nghịch.
- source_word: θέλω δὲ
  choice: Còn tôi muốn
  rationale: θέλω diễn tả ý muốn của người nói; δέ tạo sự đối chiếu nhẹ với mệnh lệnh trước. “Còn tôi muốn” tự nhiên trong tiếng Việt và làm rõ sự tương phản ấy.
- source_word: τούτῳ τῷ ἐσχάτῳ
  choice: người cuối cùng này
  rationale: ἐσχάτῳ có nghĩa là “cuối cùng,” còn τούτῳ chỉ rõ người đang được nói đến. Cách dịch này bám sát nguyên văn, không thêm cụm “đến” hay “được thuê” vốn chỉ được hiểu từ ngữ cảnh.
- source_word: δοῦναι
  choice: cho
  rationale: Động từ δίδωμι mang nghĩa cơ bản là “cho.” Dù ngữ cảnh liên quan đến trả công, “cho” bảo toàn từ ngữ của câu và nhấn mạnh quyền định đoạt của chủ vườn.
- source_word: ὡς καὶ σοί
  choice: cũng như cho anh
  rationale: Cụm so sánh diễn tả việc cho người cuối cùng tương ứng với việc cho người nghe. Tiếng Việt tự nhiên có thể lược đối tượng được cho mà vẫn truyền đạt rõ sự ngang bằng trong ngữ cảnh.
theological_decisions:
- issue: Cách thể hiện danh từ chỉ người ở giống đực số ít
  choice: người cuối cùng này
  alternative: người đàn ông cuối cùng này
  rationale: Các hình thái Hy Lạp là giống đực số ít và trong dụ ngôn chỉ một người làm công cụ thể. Tuy nhiên, tiếng Việt không có giống ngữ pháp; “người cuối cùng này” vẫn chỉ đúng cá nhân ấy một cách tự nhiên. Thêm “đàn ông” sẽ nhấn mạnh giới tính hơn mức cần thiết trong câu này.
- issue: Sự ngang bằng hàm ý trong ὡς καὶ σοί
  choice: cũng như cho anh
  alternative: bằng với phần đã cho anh
  rationale: Nguyên văn để ngỏ vật được cho và diễn đạt bằng một phép so sánh ngắn. Bản dịch giữ cấu trúc ấy, không bổ sung “số tiền” hay “tiền công,” đồng thời ngữ cảnh vẫn cho thấy hai người nhận phần bằng nhau.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và phù hợp lời thoại trong dụ ngôn. Đại từ “anh” phản ánh cách một người chủ nói trực tiếp với một người làm công trưởng thành; câu không thêm sắc thái miệt thị. Cấu trúc “Còn tôi muốn” giữ sự đối chiếu nhẹ của δέ và nhấn mạnh quyền tự do của người chủ mà không diễn giải thần học vượt quá nguyên văn.
