  text: λέγουσιν αὐτῷ· Ὅτι οὐδεὶς ἡμᾶς ἐμισθώσατο. λέγει αὐτοῖς· Ὑπάγετε καὶ ὑμεῖς εἰς τὸν ⸀ἀμπελῶνα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/007.yaml
  text: They said to him[a], “Because no one has hired us.” He says to them, “You also go into the vineyard.”
translation:
  language: vi
  text: 'Họ thưa với ông: “Vì không ai thuê chúng tôi.” Ông bảo họ: “Các anh cũng hãy vào vườn nho đi.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγουσιν αὐτῷ
  choice: Họ thưa với ông
  rationale: Thì hiện tại lịch sử được chuyển sang lối kể tự nhiên trong tiếng Việt; “thưa” phù hợp với lời đáp trực tiếp dành cho người chủ mà không làm tăng quá mức sắc thái tôn kính.
- source_word: Ὅτι
  choice: Vì
  rationale: Trong ngữ cảnh này, ὅτι dẫn vào lý do họ vẫn đứng đó; “Vì” diễn đạt tự nhiên sức giải thích của câu trả lời.
- source_word: οὐδεὶς ἡμᾶς ἐμισθώσατο
  choice: không ai thuê chúng tôi
  rationale: Diễn đạt trực tiếp hành động thuê người làm; tiếng Việt không cần thể hiện riêng hình thái aorist bằng một dấu hiệu thì.
- source_word: λέγει αὐτοῖς
  choice: Ông bảo họ
  rationale: Dùng lối kể quá khứ hàm ẩn, tự nhiên trong tiếng Việt; “bảo” dẫn lời chỉ dẫn thích hợp hơn “nói” trong ngữ cảnh này.
- source_word: Ὑπάγετε
  choice: hãy vào ... đi
  rationale: Mệnh lệnh đi đến vườn nho được diễn đạt tự nhiên bằng kết cấu “hãy ... đi”; động từ “vào” phối hợp trực tiếp với nơi đến.
- source_word: καὶ ὑμεῖς
  choice: Các anh cũng
  rationale: Giữ rõ ý bao gồm nhóm này cùng với những người đã được sai đi trước đó.
- source_word: ἀμπελῶνα
  choice: vườn nho
  rationale: Tương đương thông dụng, chính xác của danh từ chỉ nơi trồng nho.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Đại từ “ông” theo ngữ cảnh chỉ người chủ vườn; “các anh” phù hợp khi ông nói với nhóm người làm thuê. Hai động từ hiện tại lịch sử của Hy Lạp được thể hiện bằng lối kể tự nhiên của tiếng Việt, không cần chú thích vì tiếng Việt không đánh dấu thì bắt buộc.
