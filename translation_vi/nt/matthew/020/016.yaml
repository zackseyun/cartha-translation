  text: οὕτως ἔσονται οἱ ἔσχατοι πρῶτοι καὶ οἱ πρῶτοι ⸀ἔσχατοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/016.yaml
  text: So the last will be first[a], and the first last.
translation:
  language: vi
  text: Vậy, những người cuối sẽ trở thành những người đầu, và những người đầu sẽ trở thành những người cuối.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὕτως
  choice: Cũng vậy
  rationale: Dẫn vào kết luận rút ra từ dụ ngôn, tự nhiên trong tiếng Việt hiện đại và giữ sắc thái suy kết của câu Hy Lạp.
- source_word: ἔσονται
  choice: sẽ thành
  rationale: Diễn đạt thì tương lai của εἰμί và sự đảo ngược vị trí được nêu trong câu; tự nhiên hơn cách dịch máy móc «sẽ là» trong cấu trúc này.
- source_word: οἱ ἔσχατοι
  choice: những người cuối
  rationale: Tính từ có mạo từ được dùng như danh từ chỉ người. «Cuối» giữ nghĩa về thứ tự hoặc vị trí mà không diễn giải thành «thấp kém».
- source_word: πρῶτοι
  choice: đầu
  rationale: Giữ sự cô đọng và thế đối xứng đầu–cuối của nguyên văn.
- source_word: καὶ
  choice: còn
  rationale: Nối hai vế cân xứng trong tiếng Việt một cách tự nhiên; không thêm sắc thái đối nghịch mạnh như «nhưng».
- source_word: οἱ πρῶτοι
  choice: những người đầu
  rationale: Giữ cấu trúc chỉ người song song với «những người cuối».
- source_word: ἔσχατοι
  choice: cuối
  rationale: Hoàn tất công thức đảo ngược và giữ đúng cặp từ đầu–cuối.
theological_decisions:
- issue: Bản chất của sự đảo ngược trong lời phán
  choice: Dịch như một lời kết luận ngắn gọn về sự đảo ngược, không xác định «cuối/đầu» là thứ tự thời gian, địa vị xã hội, phần thưởng hay sự cứu rỗi.
  alternative: Diễn giải cụ thể là sự đảo ngược địa vị xã hội, phần thưởng trong đời môn đồ, hoặc thứ tự được cứu.
  rationale: Nguyên văn không thu hẹp phạm vi của hai từ này; bản dịch vì thế giữ nguyên độ mở và sức căng thần học của lời phán.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Cấu trúc cân đối «những người cuối… những người đầu…» bảo toàn tính cách ngôn của nguyên văn.
