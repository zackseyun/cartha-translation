  to: Vậy, những người cuối sẽ trở thành những người đầu, và những người đầu sẽ trở thành những người cuối.
  rationale: Điều chỉnh liên từ mở đầu để phản ánh rõ chức năng kết luận của οὕτως; hoàn chỉnh hai vế vị ngữ để tiếng Việt tự nhiên và đối xứng hơn. Bản sửa vẫn giữ nguyên lời cách ngôn đảo ngược và không giải thích cụ thể phạm vi của «đầu/cuối».
