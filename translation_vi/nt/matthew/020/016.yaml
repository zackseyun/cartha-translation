review_pass:
  verdict: revise
  source_fidelity: Bản nháp bảo toàn đúng cấu trúc đảo ngược, thì tương lai và độ mở ngữ nghĩa của οἱ ἔσχατοι/οἱ πρῶτοι. Tuy nhiên, «Cũng vậy» thường mang nghĩa “likewise/cũng thế”, kém chính xác hơn đối với οὕτως ở đây, vốn nối kết như một kết luận từ dụ ngôn (“Vậy/Do đó”).
  naturalness: «Những người cuối sẽ thành đầu» hiểu được nhưng lược danh từ ở vị ngữ khiến câu hơi gãy và «thành đầu» có thể nghe như trở thành người lãnh đạo. Lặp lại «những người» trong cả hai vế tạo câu cân đối, rõ ràng và tự nhiên trong tiếng Việt hiện đại.
  terminology: Cặp «người cuối/người đầu» giữ được tính cô đọng, đối xứng và không áp đặt nghĩa “thấp kém,” “địa vị,” “phần thưởng,” hoặc “cứu rỗi.” Dùng «và» tương ứng sát với καὶ hơn «còn», dù «còn» không gây sai nghĩa nghiêm trọng.
  issues:
  - severity: low
    issue: Cách dịch οὕτως là «Cũng vậy»
    rationale: Trong ngữ cảnh kết luận dụ ngôn, «Vậy» diễn đạt trực tiếp và tự nhiên hơn quan hệ suy kết/kết luận của οὕτως.
  - severity: low
    issue: Lược «những người» ở các vị ngữ «thành đầu/thành cuối»
    rationale: Việc bổ sung danh từ chỉ người giúp tránh sắc thái không chủ ý rằng họ “thành đầu” theo nghĩa thành người đứng đầu, đồng thời duy trì song hành với các chủ ngữ.
  revised_text: Vậy, những người cuối sẽ trở thành những người đầu, và những người đầu sẽ trở thành những người cuối.
