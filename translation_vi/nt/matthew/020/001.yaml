revisions:
- from: Vì vương quốc thiên đàng giống như một người chủ nhà, sáng sớm đi ra thuê người làm cho vườn nho của mình.
  to: Vì Nước Trời giống như một chủ nhà ra đi từ sáng sớm để thuê thợ làm cho vườn nho của mình.
  rationale: Chỉnh thuật ngữ trung tâm thành «Nước Trời» để bảo đảm tính tự nhiên và nhất quán với văn phong Kinh Thánh tiếng Việt hiện đại; đồng thời đổi «người làm» thành «thợ» cho sát ngữ cảnh thuê lao động. Bản sửa vẫn giữ phép so sánh cô đọng, không giải thích thêm dụ ngôn, và bảo toàn toàn bộ thông tin của nguyên văn.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T05:40:53Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản nháp phản ánh đúng cấu trúc và các thành tố chính của câu Hy Lạp: liên từ γάρ, «vương quốc/nước trời», hình ảnh người chủ nhà, việc đi ra rất sớm, thuê người làm, và vườn nho của ông. Tuy nhiên, «vương quốc thiên đàng» không phải cách gọi tự nhiên, ổn định trong tiếng Việt Kinh Thánh hiện đại cho ἡ βασιλεία τῶν οὐρανῶν.'
  naturalness: Câu nhìn chung rõ ràng, nhưng «vương quốc thiên đàng» khá gượng và có sắc thái dịch sát. «Nước Trời» là lối nói hiện đại, trang trọng vừa phải, tự nhiên và đã được định hình trong văn phong Kinh Thánh tiếng Việt. «Thợ» cũng gọn và sát ἐργάτας hơn «người làm» trong bối cảnh thuê lao động.
  terminology: Dùng «Nước Trời» cho ἡ βασιλεία τῶν οὐρανῶν. Giữ «chủ nhà» cho οἰκοδεσπότῃ trong nghĩa người chủ hộ/chủ cơ nghiệp; trong văn cảnh dụ ngôn, cụm này không cần chú thích. Không có vấn đề về tên riêng hay thuật ngữ thần học khác.
  issues:
  - severity: medium
    issue: «vương quốc thiên đàng»
    rationale: Cụm này kém tự nhiên trong tiếng Việt hiện đại và không phải thuật ngữ Kinh Thánh thông dụng cho «kingdom of heaven». «Nước Trời» vừa rõ nghĩa vừa phù hợp văn phong và cách dùng chuẩn.
  - severity: low
    issue: «thuê người làm»
    rationale: Không sai nghĩa, nhưng «thuê thợ» là cách diễn đạt gọn, tự nhiên hơn cho ἐργάτας, tức những người lao động được thuê.
  revised_text: Vì Nước Trời giống như một chủ nhà ra đi từ sáng sớm để thuê thợ làm cho vườn nho của mình.
