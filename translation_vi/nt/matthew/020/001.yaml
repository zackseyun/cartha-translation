  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ὁμοία γάρ ἐστιν ἡ βασιλεία τῶν οὐρανῶν ἀνθρώπῳ οἰκοδεσπότῃ ὅστις ἐξῆλθεν ἅμα πρωῒ μισθώσασθαι ἐργάτας εἰς τὸν ἀμπελῶνα αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/001.yaml
  text: For the kingdom of heaven is like a man, a master of a house, who went out early in the morning to hire workers for his vineyard.
translation:
  language: vi
  text: Vì Nước Trời giống như một chủ nhà ra đi từ sáng sớm để thuê thợ làm cho vườn nho của mình.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: vương quốc thiên đàng
  rationale: Diễn đạt tự nhiên trong tiếng Việt hiện đại, đồng thời giữ nghĩa về quyền trị vì và cõi thuộc trời của cụm Hy Lạp.
- source_word: ἀνθρώπῳ οἰκοδεσπότῃ
  choice: một người chủ nhà
  rationale: Giữ cả ἀνθρώπῳ và danh từ bổ nghĩa οἰκοδεσπότῃ mà không tạo lối diễn đạt nặng nề; trong văn cảnh, người chủ quản lý gia sản và vườn nho.
- source_word: ἅμα πρωῒ
  choice: sáng sớm
  rationale: Phản ánh thời điểm rất sớm vào buổi sáng bằng cách nói tự nhiên.
- source_word: μισθώσασθαι ἐργάτας
  choice: thuê người làm
  rationale: Thể hiện rõ hành động thuê nhân công; “người làm” dễ hiểu và phù hợp ngữ cảnh lao động trong vườn nho.
- source_word: ἀμπελῶνα
  choice: vườn nho
  rationale: Tương đương trực tiếp và thông dụng của danh từ Hy Lạp.
theological_decisions:
- issue: Đối tượng được ví sánh trong câu mở đầu
  choice: vương quốc thiên đàng giống như một người chủ nhà
  alternative: vương quốc thiên đàng giống như tình huống một người chủ nhà đi ra thuê người làm
  rationale: Giữ cấu trúc ví sánh cô đọng của nguyên văn và không giải thích thêm phạm vi chính xác của phép ví; sự phát triển của cả dụ ngôn sẽ làm sáng tỏ phép so sánh.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Giữ liên từ “Vì” để nối câu này với lời giải thích phía trước trong văn mạch. Không thêm chú thích vì câu không có biến thể hoặc độ mơ hồ nào cần giải trình riêng.
