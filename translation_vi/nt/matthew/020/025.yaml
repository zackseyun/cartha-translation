revisions:
- from: 'Nhưng Đức Chúa Giê-su gọi các môn đồ lại và nói: “Các con biết rằng những người cai trị dân ngoại[a] thống trị họ, và những kẻ quyền thế dùng quyền mà áp chế họ[b].”'
  to: 'Nhưng Đức Chúa Giê-su gọi họ đến gần và nói: “Anh em biết rằng các nhà cầm quyền của dân ngoại[a] thống trị họ, và những người quyền thế[b] áp chế họ.”'
  rationale: Bản sửa sát nguyên văn hơn khi giữ các đại từ không xác định thêm vai trò hay quan hệ xưng hô, đồng thời vẫn truyền đạt sắc thái của việc gọi họ đến với mình. Hai vế song song về việc lạm dụng quyền lực được duy trì; các chú thích bảo lưu những khả năng từ vựng hợp lệ và được neo đúng vào từ liên quan.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T05:41:08Z'
review_pass:
  verdict: revise
  source_fidelity: 'Cần bỏ các bổ sung không được biểu thị trực tiếp trong câu Hy Lạp: «các môn đồ» thay cho αὐτούς và «các con» thay cho Οἴδατε. «Gọi họ đến gần» diễn đạt tự nhiên sắc thái προσκαλεσάμενος («gọi họ đến với mình»). «Thống trị» và «áp chế» giữ được tính song song cùng sắc thái mạnh của κατακυριεύουσιν và κατεξουσιάζουσιν.'
  naturalness: Bản sửa dùng «Anh em biết rằng» là cách xưng hô hiện đại, trang trọng và không thêm một quan hệ xưng hô cụ thể vào bản văn. «Các nhà cầm quyền của dân ngoại» và «những người quyền thế» tự nhiên hơn «những người cai trị dân ngoại» và tránh sắc thái khinh miệt do «kẻ» tạo ra. Đặt ký hiệu chú thích b ngay sau cụm được chú giải làm rõ neo chú thích.
  terminology: Giữ «Đức Chúa Giê-su» theo đăng ký tôn kính của bản dự thảo. «Dân ngoại» phù hợp với cách dùng ἐθνῶν trong bối cảnh này, đồng thời chú thích bảo lưu nghĩa «các dân tộc». «Những người quyền thế» diễn đạt οἱ μεγάλοι mà không giới hạn họ vào một chức vụ cụ thể hay áp đặt giới tính không cần thiết trong tiếng Việt.
  issues:
  - severity: medium
    issue: Bổ sung «các môn đồ» và cách xưng hô «các con»
    rationale: Nguyên văn chỉ có đại từ «họ» và động từ ngôi thứ hai số nhiều «anh em/các ông biết». Dù ngữ cảnh xác định người nghe là các môn đồ, việc gọi họ là «các con» thêm sắc thái quan hệ không được nêu trong câu; «các môn đồ» cũng là một diễn giải thay cho đại từ.
  - severity: low
    issue: «Những kẻ quyền thế» có sắc thái miệt thị vượt quá danh từ hóa οἱ μεγάλοι
    rationale: Sắc thái phê phán đã được tải bởi các động từ chỉ sự thống trị/áp chế. «Những người quyền thế» giữ nghĩa người có địa vị hoặc quyền lực mà không thêm lời đánh giá vào chính danh ngữ.
  - severity: low
    issue: Neo chú thích b đặt cuối mệnh đề
    rationale: Chú thích giải thích οἱ μεγάλοι («những người quyền thế»), nên cần đặt ngay sau cụm này thay vì sau «họ» để tránh mơ hồ.
