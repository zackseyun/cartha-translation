id: MAT.20.25
reference: Matthew 20:25
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς προσκαλεσάμενος αὐτοὺς εἶπεν· Οἴδατε ὅτι οἱ ἄρχοντες τῶν ἐθνῶν κατακυριεύουσιν αὐτῶν καὶ οἱ μεγάλοι κατεξουσιάζουσιν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/025.yaml
  text: But Jesus[a], calling them to himself, said, “You know that the rulers of the Gentiles lord it over them[b], and their great men exercise authority over them.”
translation:
  language: vi
  text: 'Nhưng Đức Chúa Giê-su gọi họ đến gần và nói: “Anh em biết rằng các nhà cầm quyền của dân ngoại[a] thống trị họ, và những người quyền thế[b] áp chế họ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “các dân tộc.”
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “những người có địa vị cao” hoặc “các quan chức cấp cao.”
    reason: lexical_alternative
lexical_decisions:
- source_word: προσκαλεσάμενος αὐτούς
  choice: gọi các môn đồ lại
  rationale: Động tính từ aorist trung của προσκαλέομαι diễn tả việc Đức Chúa Giê-su gọi họ đến với mình trước khi nói. “Gọi ... lại” tự nhiên trong tiếng Việt; “các môn đồ” làm rõ đối tượng theo văn cảnh gần mà không thay đổi ý nghĩa.
- source_word: Οἴδατε
  choice: Các con biết
  rationale: οἶδα có hình thức hoàn thành nhưng mang nghĩa hiện tại. “Biết” là cách diễn đạt trực tiếp; “các con” phù hợp với lời Đức Chúa Giê-su nói với các môn đồ và giữ giọng thân mật, có thẩm quyền.
- source_word: οἱ ἄρχοντες
  choice: những người cai trị
  rationale: ἄρχοντες chỉ những người nắm quyền cai trị. Cách dịch này rộng nghĩa, rõ ràng và phù hợp với ngữ cảnh chính trị.
- source_word: τῶν ἐθνῶν
  choice: dân ngoại
  rationale: Trong bối cảnh Do Thái, ἔθνη thường chỉ các dân không thuộc dân Do Thái. “Dân ngoại” giữ được sự đối chiếu theo ngữ cảnh; chú thích bảo lưu nghĩa từ vựng rộng hơn là “các dân tộc”.
- source_word: κατακυριεύουσιν
  choice: thống trị
  rationale: Động từ ghép mang nghĩa thực thi quyền làm chủ trên người khác, thường có sắc thái lấn át. “Thống trị” truyền đạt sắc thái tiêu cực rõ hơn “cai trị”.
- source_word: οἱ μεγάλοι
  choice: những kẻ quyền thế
  rationale: Tính từ được danh từ hóa chỉ những người lớn, nổi bật hoặc có địa vị trong xã hội và chính quyền. “Những kẻ quyền thế” tự nhiên trong tiếng Việt và giữ sắc thái phê phán của văn cảnh; chú thích nêu các khả năng ít hàm sắc thái hơn.
- source_word: κατεξουσιάζουσιν
  choice: dùng quyền mà áp chế
  rationale: Động từ chỉ việc thực thi quyền lực trên người khác và trong thế song song này có sắc thái thống trị. Cách dịch vừa thể hiện yếu tố “quyền” vừa truyền đạt sức nặng tiêu cực của lời nói.
- source_word: αὐτῶν
  choice: họ
  rationale: Đại từ sở hữu cách số nhiều quy chiếu về những người thuộc dân ngoại/các dân đang ở dưới quyền cai trị. “Họ” tránh lặp lại danh từ và tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Cách hiểu ἐθνῶν trong lời Đức Chúa Giê-su nói trong bối cảnh Do Thái
  choice: dân ngoại
  alternative: các dân tộc
  rationale: “Dân ngoại” thể hiện cách dùng quen thuộc để chỉ những dân không phải Do Thái, phù hợp với sự tương phản giữa lối cầm quyền của họ và cách sống Đức Chúa Giê-su sắp dạy các môn đồ. Chú thích giữ lại nghĩa rộng “các dân tộc” để không xóa bỏ tính đa nghĩa.
- issue: Sắc thái của hai động từ quyền lực κατακυριεύουσιν và κατεξουσιάζουσιν
  choice: thống trị; dùng quyền mà áp chế
  alternative: cai trị; thực thi quyền trên
  rationale: Hai động từ ghép trong cấu trúc song song có thể chỉ việc thi hành quyền cai trị, nhưng văn cảnh đối chiếu và thành tố tăng cường cho phép nhận ra sắc thái lấn át. Bản dịch giữ sắc thái ấy mà không thêm một mô hình thần học riêng.
- issue: Cách diễn đạt οἱ μεγάλοι
  choice: những kẻ quyền thế
  alternative: những người lớn; những quan chức cấp cao
  rationale: Cụm Hy Lạp để mở loại địa vị nổi bật được nói đến. “Những kẻ quyền thế” không giới hạn họ vào một chức danh hành chính cụ thể; chú thích bảo lưu các cách hiểu từ vựng khác.
translation_notes:
  register: Văn phong hiện đại, trang trọng nhưng dễ hiểu. “Đức Chúa Giê-su” giữ cách gọi tôn kính; “các con” thể hiện quan hệ của Ngài với các môn đồ. Hai vế song song được duy trì, đồng thời các động từ “thống trị” và “áp chế” làm rõ sắc thái lạm dụng quyền lực trong ngữ cảnh.
