  yaml_path: translation/nt/matthew/020/027.yaml
  text: And whoever wants to be first among you will be your servant[a].
translation:
  language: vi
  text: Và bất cứ ai muốn đứng đầu giữa anh em thì sẽ là nô lệ của anh em.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “đầy tớ”. Từ Hy Lạp doulos mạnh hơn từ chỉ “người phục vụ” ở câu trước và thường chỉ một nô lệ hoặc người tôi tớ lệ thuộc.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς ἂν θέλῃ
  choice: bất cứ ai muốn
  rationale: Đại từ quan hệ kết hợp với ἄν và thể giả định diễn tả điều kiện bất định, khái quát; cách dịch này tự nhiên và giữ rõ ý chí, mong muốn.
- source_word: ἐν ὑμῖν
  choice: giữa anh em
  rationale: Trong ngữ cảnh nói về thứ bậc trong cộng đồng môn đồ, ἐν với cách dữ chỉ vị trí giữa tập thể, không đơn thuần là địa điểm.
- source_word: εἶναι πρῶτος
  choice: đứng đầu
  rationale: Cụm từ chỉ địa vị cao nhất; “đứng đầu” tự nhiên trong tiếng Việt và truyền đạt rõ khát vọng về thứ bậc.
- source_word: ἔσται
  choice: sẽ làm
  rationale: Giữ hình thức tương lai của động từ; trong ngữ cảnh, tương lai này cũng mang sức nặng chuẩn mực mà không cần đổi thẳng thành “phải”.
- source_word: ὑμῶν
  choice: cho anh em
  rationale: Chuyển quan hệ sở hữu của nguyên ngữ thành cấu trúc tự nhiên trong tiếng Việt, diễn tả người ấy ở vị thế phục vụ toàn thể những người còn lại.
- source_word: δοῦλος
  choice: nô lệ
  rationale: δοῦλος mạnh hơn διάκονος ở câu trước và thường chỉ người thuộc quyền một chủ. “Nô lệ” giữ được sự gia tăng mạnh mẽ trong lời dạy, thay vì làm phẳng cả hai từ thành “đầy tớ/người phục vụ”.
theological_decisions:
- issue: Cách dịch δοῦλος trong lời dạy về tư cách môn đồ
  choice: nô lệ
  alternative: đầy tớ; tôi tớ; người phục vụ
  rationale: Lời nói đảo ngược tham vọng địa vị bằng hình ảnh tự hạ mình triệt để. Vì câu trước dùng διάκονος, dịch δοῦλος là “nô lệ” bảo toàn sự tăng cấp trong nguyên văn mà không áp đặt một cách giải thích hệ phái.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Anh em” phù hợp với lời Chúa Giê-su nói trực tiếp với nhóm môn đồ; “đứng đầu” diễn đạt tự nhiên ý về địa vị. Dùng “nô lệ” trong chính văn để giữ sức nặng và sự tăng cấp từ vựng của nguyên ngữ.
