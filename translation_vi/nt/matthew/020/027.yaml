review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch truyền đạt đúng ý chính: điều kiện khái quát, địa vị “đứng đầu”, và sự tăng cường từ vựng ở δοῦλος so với διάκονος ở câu trước. Tuy nhiên, “sẽ làm nô lệ cho anh em” dễ chuyển trọng tâm của ἔσται (“sẽ là”) sang hành động “làm” và khiến quan hệ sở hữu/phục thuộc của ὑμῶν kém trực tiếp. “Sẽ là nô lệ của anh em” phản ánh sát hơn cấu trúc Hy Lạp mà vẫn tự nhiên.'
  naturalness: “Đứng đầu giữa anh em” là cách nói hiện đại, rõ nghĩa trong ngữ cảnh cộng đồng môn đồ. “Sẽ là nô lệ của anh em” tự nhiên và gọn hơn “sẽ làm nô lệ cho anh em.”
  terminology: Giữ “nô lệ” cho δοῦλος là phù hợp, vì từ này nhấn mạnh hơn thuật ngữ διάκονος (“người phục vụ”) ở câu trước. Chú thích nên diễn đạt lựa chọn thay thế bằng tiếng Việt tự nhiên hơn và tránh cụm “người bị ràng buộc phục dịch,” vốn không thật thông dụng.
  issues:
  - severity: medium
    issue: Cấu trúc “sẽ làm nô lệ cho anh em” không phản ánh trực tiếp động từ ἔσται và sở hữu cách ὑμῶν.
    rationale: Nguyên văn nói người ấy “sẽ là nô lệ của anh em.” Cách sửa giữ thì tương lai và quan hệ phụ thuộc/phục vụ mà không thêm ý.
  - severity: low
    issue: 'Văn chú thích có cụm từ hơi gượng: “người bị ràng buộc phục dịch.”'
    rationale: “Người tôi tớ lệ thuộc” hoặc chỉ “nô lệ” là cách diễn đạt hiện đại và dễ hiểu hơn, đồng thời vẫn nêu được sắc thái của doulos.
