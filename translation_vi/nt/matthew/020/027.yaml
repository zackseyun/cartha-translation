  rationale: Bản sửa thay “sẽ làm nô lệ cho” bằng “sẽ là nô lệ của” để phản ánh trực tiếp ἔσται ὑμῶν δοῦλος, đồng thời giữ nguyên ý nghĩa, giọng văn và sự tương phản từ vựng với câu trước. Chú thích được làm gọn và tự nhiên hơn, không thay đổi thông tin từ vựng cốt yếu.
