  yaml_path: translation/nt/matthew/020/005.yaml
  text: So they went away. Going out again about the sixth and ninth hour[a], he did likewise.
translation:
  language: vi
  text: Họ đi. Ông lại đi ra vào khoảng giờ thứ sáu và giờ thứ chín[a], và cũng làm như vậy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tức là khoảng mười hai giờ trưa và ba giờ chiều theo cách tính giờ của người Do Thái.
    reason: cultural_note
lexical_decisions:
- source_word: οἱ δὲ ἀπῆλθον
  choice: Họ liền đi
  rationale: οἱ chỉ những người làm công vừa được nói đến; δέ là từ nối nhẹ, được diễn đạt tự nhiên bằng “liền” trong mạch kể; ἀπῆλθον là “đi, rời đi”.
- source_word: πάλιν
  choice: lại
  rationale: Diễn tả hành động được lặp lại, tự nhiên và trực tiếp trong tiếng Việt.
- source_word: ἐξελθὼν
  choice: đi ra
  rationale: Phân từ bất định mô tả hành động đi ra gắn với hành động chính; cách dịch này giữ trình tự kể chuyện mà không xác định quá mức sắc thái thời gian.
- source_word: περὶ ἕκτην καὶ ἐνάτην ὥραν
  choice: vào khoảng giờ thứ sáu và giờ thứ chín
  rationale: περὶ được dịch là “vào khoảng”; giữ cách tính giờ theo văn hóa nguồn trong chính văn, còn giờ tương ứng hiện đại được giải thích ở chú thích.
- source_word: ἐποίησεν
  choice: làm
  rationale: ποιέω ở đây có nghĩa khái quát, còn nội dung cụ thể được xác định bởi ὡσαύτως và ngữ cảnh trước đó.
- source_word: ὡσαύτως
  choice: cũng ... như vậy
  rationale: Diễn đạt tự nhiên ý “theo cùng một cách” và giữ lực so sánh với hành động trước đó.
