  terminology: “Giê-ri-cô,” “đám đông lớn,” và “Ngài” phù hợp với văn phong Kinh Thánh tiếng Việt trang trọng, hiện đại. “Ngài” giữ rõ đối tượng số ít của αὐτῷ, không làm phẳng sang số nhiều.
