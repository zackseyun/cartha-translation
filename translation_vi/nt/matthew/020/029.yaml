  text: Καὶ ἐκπορευομένων αὐτῶν ἀπὸ Ἰεριχὼ ἠκολούθησεν αὐτῷ ὄχλος πολύς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/029.yaml
  text: And as they were going out from Jericho[a], a large crowd followed him.
translation:
  language: vi
  text: Khi họ đang ra khỏi thành Giê-ri-cô[a], một đám đông lớn đi theo Ngài.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “Khi họ rời thành Giê-ri-cô.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκπορευομένων
  choice: Khi họ ra khỏi
  rationale: Phân từ hiện tại sở hữu cách số nhiều có chức năng chỉ thời gian. “Khi họ ra khỏi” diễn đạt tự nhiên hành động đang diễn ra đồng thời với hành động chính.
- source_word: ἀπὸ Ἰεριχὼ
  choice: Giê-ri-cô
  rationale: ἀπό chỉ sự chuyển động rời khỏi một địa điểm; kết hợp với “ra khỏi” thành cách nói tự nhiên trong tiếng Việt.
- source_word: ἠκολούθησεν
  choice: đi theo
  rationale: Động từ aorist chủ động của ἀκολουθέω, chỉ việc di chuyển theo sau một người; “đi theo” rõ nghĩa và tự nhiên trong ngữ cảnh.
- source_word: αὐτῷ
  choice: Ngài
  rationale: Đại từ tặng cách số ít tự nhiên nhất quy chiếu về Chúa Giê-su. Bản dịch giữ sự chuyển đổi từ chủ thể số nhiều “họ” sang đối tượng số ít “Ngài”.
- source_word: ὄχλος πολύς
  choice: một đám đông lớn
  rationale: Cụm danh từ–tính từ chỉ một đám đông có số lượng đông đảo; cách dịch này rõ ràng và hiện đại.
theological_decisions:
- issue: Đối tượng quy chiếu của đại từ số ít αὐτῷ sau mệnh đề có chủ thể số nhiều
  choice: Đám đông đi theo Chúa Giê-su (“Ngài”).
  alternative: Đám đông đi theo cả nhóm (“họ”).
  rationale: Nguyên văn chuyển từ số nhiều “khi họ ra khỏi” sang số ít “đi theo Ngài”; trong ngữ cảnh, số ít tự nhiên nhất quy chiếu về Chúa Giê-su. Bản dịch không làm phẳng sự chuyển đổi này.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “Ngài” để chỉ Chúa Giê-su, đồng thời giữ rõ đại từ số ít của nguyên văn.
