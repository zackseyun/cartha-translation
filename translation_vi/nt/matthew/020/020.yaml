id: MAT.20.20
reference: Matthew 20:20
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Τότε προσῆλθεν αὐτῷ ἡ μήτηρ τῶν υἱῶν Ζεβεδαίου μετὰ τῶν υἱῶν αὐτῆς προσκυνοῦσα καὶ αἰτοῦσά τι ⸀παρ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/020.yaml
  text: Then the mother of the sons of Zebedee came to him with her sons[a], bowing down and asking something from him.
translation:
  language: vi
  text: Bấy giờ, mẹ các con trai của Xê-bê-đê cùng các con mình đến với Ngài, cúi lạy[a] và xin Ngài một điều.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “thờ lạy”; động từ Hy Lạp có thể mang nghĩa cúi mình tôn kính, bày tỏ lòng tôn kính hoặc thờ lạy, tùy văn cảnh.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Bấy giờ
  rationale: Diễn đạt tự nhiên liên từ thời gian mở đầu một sự việc kế tiếp trong trình thuật.
- source_word: προσῆλθεν αὐτῷ
  choice: đến với Ngài
  rationale: προσέρχομαι chỉ việc tiến đến hoặc đến gần một người; cách diễn đạt này giữ được hướng chuyển động và tự nhiên trong tiếng Việt.
- source_word: ἡ μήτηρ τῶν υἱῶν Ζεβεδαίου
  choice: mẹ các con trai của Xê-bê-đê
  rationale: Giữ nguyên cấu trúc xác định người phụ nữ qua mối liên hệ với các con trai của Xê-bê-đê, không thêm tên hoặc số lượng mà câu Hy Lạp không nêu rõ.
- source_word: μετὰ τῶν υἱῶν αὐτῆς
  choice: cùng các con mình
  rationale: μετά với sở hữu cách diễn tả sự đi cùng; “các con mình” là cách quy chiếu tự nhiên đến chủ thể nữ trong tiếng Việt.
- source_word: προσκυνοῦσα
  choice: cúi lạy
  rationale: Động từ có thể chỉ hành động cúi mình đầy tôn kính, bày tỏ lòng tôn kính hoặc thờ lạy. “Cúi lạy” giữ được cả phương diện hành động lẫn sắc thái tôn kính mà không buộc câu phải mang nghĩa thần học mạnh nhất.
- source_word: καὶ αἰτοῦσά τι παρ’ αὐτοῦ
  choice: và xin Ngài một điều
  rationale: αἰτέω là xin hoặc thỉnh cầu, τι là một điều không xác định, còn παρά với sở hữu cách chỉ người mà điều ấy được xin từ đó; cách dịch này gọn và tự nhiên.
theological_decisions:
- issue: Ý nghĩa của προσκυνοῦσα khi hành động hướng về Đức Chúa Jêsus
  choice: cúi lạy
  alternative: thờ lạy
  rationale: Từ Hy Lạp có phạm vi nghĩa từ cúi mình tôn kính đến thờ phượng. Văn cảnh trực tiếp là một lời thỉnh cầu đầy kính trọng, nên bản văn chính dùng nghĩa rộng hơn, còn chú thích bảo lưu khả năng hiểu là “thờ lạy” để không âm thầm giải quyết căng thẳng thần học.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” để quy chiếu kính trọng đến Đức Chúa Jêsus theo văn cảnh; không thêm danh xưng vào câu khi nguyên văn chỉ dùng đại từ. Dấu chú thích được đặt ngay sau “cúi lạy”, đúng với từ cần giải thích.
