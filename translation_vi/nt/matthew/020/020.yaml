  source_fidelity: 'Bản dịch chuyển tải đầy đủ các thành tố của câu Hy Lạp: mốc thời gian (Τότε), người mẹ được xác định qua các con trai của Xê-bê-đê, việc bà đi cùng các con, hành động προσκυνοῦσα, và lời xin một điều từ Đức Chúa Jêsus. “Xin Ngài một điều” diễn đạt tự nhiên αἰτοῦσά τι παρ’ αὐτοῦ mà không thêm nội dung cho lời xin.'
