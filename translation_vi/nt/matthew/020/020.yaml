  terminology: “Ngài” giữ đúng sắc thái kính trọng và nhất quán với quy chiếu về Đức Chúa Jêsus. “Cúi lạy” bảo lưu được hành động tôn kính của προσκυνέω mà không nhất thiết quy định là thờ phượng; chú thích nêu rõ lựa chọn “thờ lạy” cùng phạm vi nghĩa liên quan. Tên “Xê-bê-đê” được chuyển tự nhất quán trong bản dịch.
