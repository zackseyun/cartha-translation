id: MAT.20.31
reference: Matthew 20:31
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὁ δὲ ὄχλος ἐπετίμησεν αὐτοῖς ἵνα σιωπήσωσιν· οἱ δὲ μεῖζον ⸀ἔκραξαν λέγοντες· ⸂Κύριε, ἐλέησον ἡμᾶς⸃, ⸀υἱὸς Δαυίδ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/031.yaml
  text: But the crowd rebuked them so that they would be silent[a]. Yet they cried out all the more, saying, “Lord, have mercy on us[b], Son of David.”
translation:
  language: vi
  text: 'Nhưng đám đông quở trách họ để họ im lặng. Thế mà họ càng kêu lên mãnh liệt hơn[a]: “Lạy Chúa, xin thương xót chúng con, Con Đa-vít[b]!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “càng kêu lớn tiếng hơn.” Dạng so sánh trong tiếng Hy Lạp có thể nhấn mạnh mức độ mãnh liệt nói chung hoặc riêng âm lượng.'
    reason: lexical_alternative
  - marker: b
    text: “Con Đa-vít” là một tước hiệu chỉ Đấng Mê-si-a, chứ không chỉ là lời nói về dòng dõi.
    reason: cultural_note
lexical_decisions:
- source_word: ὄχλος
  choice: đám đông
  rationale: Cách diễn đạt tự nhiên trong tiếng Việt hiện đại cho một nhóm đông người tại hiện trường.
- source_word: ἐπετίμησεν
  choice: quở trách
  rationale: Giữ được sắc thái khiển trách mạnh của động từ mà không diễn giải quá mức thành một mệnh lệnh chính thức.
- source_word: ἵνα σιωπήσωσιν
  choice: bắt họ phải im lặng
  rationale: 'Diễn đạt tự nhiên mục đích của đám đông khi quở trách hai người: khiến họ ngừng lên tiếng.'
- source_word: μεῖζον ἔκραξαν
  choice: càng kêu lên mãnh liệt hơn
  rationale: Thể hiện mức độ gia tăng của tiếng kêu nhưng không giới hạn hoàn toàn ý nghĩa vào âm lượng; khả năng hiểu là 'lớn tiếng hơn' được ghi ở chú thích.
- source_word: Κύριε
  choice: Lạy Chúa
  rationale: Cách xưng hô trực tiếp trang trọng, tự nhiên; bảo toàn cả sắc thái tôn kính lẫn khả năng mang ý nghĩa Kitô học.
- source_word: ἐλέησον ἡμᾶς
  choice: xin thương xót chúng con
  rationale: Cách cầu xin tự nhiên và trang trọng, truyền đạt đúng mệnh lệnh thức mang ý khẩn cầu.
- source_word: υἱὸς Δαυίδ
  choice: Con vua Đa-vít
  rationale: Cách gọi quen thuộc và dễ hiểu trong tiếng Việt, giữ nguyên hình thức tước hiệu thay vì giản lược thành 'hậu duệ Đa-vít'; từ 'vua' làm rõ nhân vật Đa-vít được nhắc đến mà không thay đổi chức năng của tước hiệu.
theological_decisions:
- issue: Tước hiệu Đấng Mê-si-a dành cho Đức Giê-su
  choice: Giữ tước hiệu “Con vua Đa-vít” trong chính văn.
  alternative: hậu duệ vua Đa-vít
  rationale: Cụm từ trong Ma-thi-ơ không chỉ nói về dòng dõi mà còn có sức nặng vương quyền và Mê-si-a; giữ hình thức “Con vua Đa-vít” bảo toàn chức năng ấy.
- issue: κύριος trong lời trực tiếp thưa với Đức Giê-su
  choice: Dịch là “Chúa”.
  alternative: Thầy; chủ
  rationale: “Chúa” giữ được cả ý tôn kính trong lời xưng hô lẫn hàm ý Kitô học có thể có, thay vì thu hẹp nghĩa.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Thế mà” để thể hiện sự tương phản mạnh của οἱ δέ; lặp “lạy” trước tước hiệu cuối câu để lời hô gọi tự nhiên trong tiếng Việt. Các dấu chú thích được đặt ngay sau cụm từ mà chúng giải thích.
