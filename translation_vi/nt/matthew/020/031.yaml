    issue: “Con vua Đa-vít” thêm yếu tố không có trong nguyên ngữ.
    rationale: υἱὸς Δαυίδ là “Con Đa-vít.” Đây là một tước hiệu Mê-si-a quen thuộc trong Ma-thi-ơ; thêm “vua” tuy nhằm giải thích nhưng không cần thiết trong chính văn và làm lệch cách gọi gốc.
  - severity: low
    issue: “bắt họ phải im lặng” diễn giải mạnh hơn mệnh đề mục đích.
    rationale: 'ἵνα σιωπήσωσιν diễn tả mục đích: đám đông quở trách họ để họ im lặng. “Bắt” có thể hàm ý cưỡng ép thành công hoặc mệnh lệnh trực tiếp mạnh hơn điều văn bản nêu.'
