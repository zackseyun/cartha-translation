  to: 'Nhưng đám đông quở trách họ để họ im lặng. Thế mà họ càng kêu lên mãnh liệt hơn[a]: “Lạy Chúa, xin thương xót chúng con, Con Đa-vít[b]!”'
  rationale: Sửa “Con vua Đa-vít” thành “Con Đa-vít” để giữ chính xác tước hiệu trong tiếng Hy Lạp và trong cách dùng của Ma-thi-ơ. Sửa mệnh đề mục đích thành “để họ im lặng” để tránh thêm sắc thái cưỡng bách. Các yếu tố còn lại được giữ vì phản ánh tốt nguyên ngữ và có văn phong tự nhiên.
