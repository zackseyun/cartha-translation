  to: Nhưng để chúng ta không làm họ phật lòng[a], con hãy ra biển, quăng lưỡi câu và kéo lên con cá đầu tiên mắc câu. Khi mở miệng nó ra, con sẽ thấy một đồng statêr[b]. Hãy lấy đồng ấy và đưa cho họ cho phần Thầy và phần con.
  rationale: Bản sửa nêu rõ “lưỡi câu,” làm sáng tỏ hành động đối với con cá đầu tiên, và điều chỉnh cách diễn đạt khoản nộp cho hai người. Không thêm kết luận nào về nghĩa vụ thuế hoặc ý nghĩa giáo lý; chú thích vẫn được gắn đúng vào σκανδαλίζω và στατῆρα.
