id: MAT.17.27
reference: Matthew 17:27
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἵνα δὲ μὴ σκανδαλίσωμεν αὐτούς, πορευθεὶς ⸀εἰς θάλασσαν βάλε ἄγκιστρον καὶ τὸν ⸀ἀναβάντα πρῶτον ἰχθὺν ἆρον, καὶ ἀνοίξας τὸ στόμα αὐτοῦ εὑρήσεις στατῆρα· ἐκεῖνον λαβὼν δὸς αὐτοῖς ἀντὶ ἐμοῦ καὶ σοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/027.yaml
  text: But so that we may not offend them[a], go to the sea, cast in a hook, and take the first fish that comes up. And when you open its mouth, you will find a stater[b]. Take that and give it to them for me and for yourself.
translation:
  language: vi
  text: Nhưng để chúng ta không làm họ phật lòng[a], con hãy ra biển, quăng lưỡi câu và kéo lên con cá đầu tiên mắc câu. Khi mở miệng nó ra, con sẽ thấy một đồng statêr[b]. Hãy lấy đồng ấy và đưa cho họ cho phần Thầy và phần con.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “không khiến họ vấp phạm” hoặc “không gây cớ cho họ.”'
    reason: lexical_alternative
  - marker: b
    text: Một statêr là đồng tiền trị giá khoảng bốn đracma, đủ để nộp thuế đền thờ cho hai người.
    reason: cultural_note
lexical_decisions:
- source_word: σκανδαλίσωμεν
  choice: làm họ phật lòng
  rationale: Trong ngữ cảnh này, động từ nói đến việc gây phản ứng tiêu cực hoặc tạo cớ vấp phạm không cần thiết cho những người thu thuế, chứ không nhất thiết khiến họ phạm tội. Cách diễn đạt này tự nhiên trong tiếng Việt; phương án sát chữ hơn được giữ trong chú thích.
- source_word: θάλασσαν
  choice: biển
  rationale: Giữ danh từ θάλασσα của bản Hy Lạp. Dù địa danh này là Biển Ga-li-lê, về địa lý là một hồ, câu không cần thay thuật ngữ nguồn bằng lời giải thích địa lý.
- source_word: ἄγκιστρον
  choice: thả câu
  rationale: Tiếng Hy Lạp nói đến việc quăng lưỡi câu; “thả câu” là cách nói gọn, tự nhiên và rõ nghĩa trong tiếng Việt hiện đại.
- source_word: ἀναβάντα πρῶτον ἰχθὺν
  choice: con cá đầu tiên kéo lên được
  rationale: Diễn đạt tự nhiên hành động đưa con cá đầu tiên lên khỏi nước, tránh lối dịch sát chữ nhưng khó hiểu như “con cá đầu tiên đi lên”.
- source_word: ἆρον
  choice: bắt lấy
  rationale: Trong chuỗi mệnh lệnh này, αἴρω chỉ việc lấy con cá đã mắc câu; “bắt lấy” phù hợp ngữ cảnh đánh cá.
- source_word: στατῆρα
  choice: một đồng statêr
  rationale: Giữ tên gọi cụ thể của đồng tiền trong nguyên bản thay vì thay ngay bằng giá trị quy đổi; chú thích giải thích giá trị và công dụng của đồng tiền.
- source_word: ἀντὶ ἐμοῦ καὶ σοῦ
  choice: thay phần của thầy và của con
  rationale: ἀντί ở đây chỉ khoản tiền được đưa thay cho hoặc để trả phần của hai người. Cách diễn đạt này giữ sắc thái thay mặt mà không khẳng định thêm về bản chất nghĩa vụ thuế.
- source_word: πορευθεὶς
  choice: hãy đi
  rationale: Phân từ mở đầu một hành động đi kèm trước các mệnh lệnh tiếp theo; chuyển thành mệnh lệnh là tự nhiên trong tiếng Việt.
- source_word: δὸς αὐτοῖς
  choice: đưa cho họ
  rationale: “Đưa cho họ” phản ánh trực tiếp động từ δίδωμι; ý nghĩa nộp thuế đã rõ nhờ ngữ cảnh.
theological_decisions:
- issue: Ý nghĩa của σκανδαλίζω liên quan đến việc Chúa Giê-su nộp thuế đền thờ
  choice: Câu dịch cho thấy việc nộp tiền nhằm tránh làm những người thu thuế phật lòng, trong khi không xóa bỏ lập luận trước đó rằng các con được miễn.
  alternative: Hiểu rằng Chúa Giê-su nộp vì hoàn toàn bị buộc phải nộp thuế, hoặc chỉ để bày tỏ phép lạ mà không mang ý nghĩa ứng xử.
  rationale: Mạch văn Ma-thi-ơ 17:24–26 nêu sự tự do của các con, còn câu 27 đưa ra một sự nhượng bộ thực tế để không gây cớ vấp phạm. Bản dịch giữ nguyên sức căng này và không áp đặt kết luận giáo lý rộng hơn.
- issue: Đại từ xưng hô giữa Chúa Giê-su và Phi-e-rơ
  choice: thầy—con
  alternative: tôi—anh hoặc ta—ngươi
  rationale: Ngữ cảnh xác định Chúa Giê-su đang nói với môn đồ Phi-e-rơ. “Thầy—con” là lối xưng hô tự nhiên, trang trọng và dễ hiểu trong tiếng Việt hiện đại, không làm thay đổi nội dung mệnh đề.
translation_notes:
  register: 'Văn phong hiện đại, trang trọng và dễ hiểu. Dùng chuỗi mệnh lệnh ngắn để giữ nhịp câu Hy Lạp. Hai chú thích được gắn đúng với nội dung: [a] giải thích σκανδαλίζω, [b] giải thích đồng statêr.'
