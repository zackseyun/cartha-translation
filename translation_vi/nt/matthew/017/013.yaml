    issue: “Các môn đồ” mang sắc thái truyền thống hơn là tiếng Việt hiện đại chuẩn.
    rationale: “Môn đệ” là lựa chọn hiện đại, tự nhiên và vẫn tương ứng chính xác với μαθηταί.
  - severity: low
    issue: Danh xưng “Giăng, người làm phép báp-têm” trong văn bản chính kém gọn và kém tự nhiên.
    rationale: “Giăng Báp-tít” là danh xưng thông dụng tương ứng với Ἰωάννης ὁ βαπτιστής; bản dịch chức năng có thể được cung cấp như phương án chú thích.
  - severity: low
    issue: Chú thích hiện tại đảo chiều giữa bản chính và phương án thông dụng.
    rationale: 'Nếu bản chính dùng danh xưng thông dụng, chú thích “Hoặc: ‘Giăng, người làm phép báp-têm’” sẽ trình bày rõ phương án dịch sát chức năng của tước hiệu.'
