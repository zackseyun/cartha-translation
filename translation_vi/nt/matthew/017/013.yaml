  yaml_path: translation/nt/matthew/017/013.yaml
  text: Then the disciples understood that he had spoken to them about John the Baptist[a].
translation:
  language: vi
  text: Lúc ấy, các môn đệ hiểu rằng ngài đã nói với họ về Giăng Báp-tít.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “Giăng, người làm phép báp-têm.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Bấy giờ
  rationale: Diễn tả thời điểm các môn đồ đi đến chỗ hiểu ra, đồng thời làm từ nối kể chuyện tự nhiên và trang trọng.
- source_word: συνῆκαν
  choice: hiểu
  rationale: Động từ aorist của συνίημι chỉ việc nắm được ý nghĩa; “hiểu” rõ ràng, tự nhiên và không thêm sắc thái quá mức.
- source_word: οἱ μαθηταὶ
  choice: các môn đồ
  rationale: Cách gọi quen thuộc trong văn cảnh Phúc Âm dành cho những người theo học Chúa Giê-su.
- source_word: ὅτι
  choice: rằng
  rationale: Dẫn vào nội dung mà các môn đồ hiểu, chứ không biểu thị nguyên nhân.
- source_word: περὶ
  choice: về
  rationale: Với sở hữu cách, περί chỉ đối tượng hay chủ đề được nói đến; “về” là cách diễn đạt tiếng Việt tự nhiên.
- source_word: Ἰωάννου τοῦ βαπτιστοῦ
  choice: Giăng, người làm phép báp-têm
  rationale: Diễn đạt chức danh βαπτιστής theo chức năng của Giăng bằng tiếng Việt dễ hiểu, đồng thời tránh để danh xưng tôn giáo truyền thống che khuất nghĩa từ vựng.
- source_word: εἶπεν αὐτοῖς
  choice: ngài đã nói với họ
  rationale: “Đã nói” thể hiện lời nói xảy ra trước lúc các môn đồ hiểu ra; “với họ” giữ đúng đối tượng gián tiếp αὐτοῖς.
theological_decisions:
- issue: Việc nhận diện nhân vật Ê-li trong văn cảnh trực tiếp
  choice: Câu này nói rõ các môn đồ hiểu rằng Chúa Giê-su đang nói về Giăng, người làm phép báp-têm.
  alternative: Diễn giải thêm rằng Giăng chính là Ê-li theo nghĩa tuyệt đối hoặc theo một hệ thống thần học cụ thể.
  rationale: Bản văn trực tiếp xác định Giăng là đối tượng Chúa Giê-su vừa nói đến, nhưng không giải thích thêm bản chất hay phạm vi của sự tương ứng ấy; bản dịch vì vậy giữ nguyên giới hạn của câu.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “ngài” làm đại từ quy chiếu đến Chúa Giê-su trong câu này; viết “báp-têm” theo cách gọi quen thuộc, còn chú thích giữ danh xưng truyền thống “Giăng Báp-tít.”
