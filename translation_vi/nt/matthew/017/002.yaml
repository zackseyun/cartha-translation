source:
  edition: SBLGNT
  text: καὶ μετεμορφώθη ἔμπροσθεν αὐτῶν, καὶ ἔλαμψεν τὸ πρόσωπον αὐτοῦ ὡς ὁ ἥλιος, τὰ δὲ ἱμάτια αὐτοῦ ⸀ἐγένετο λευκὰ ὡς τὸ φῶς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/002.yaml
  text: And he was transfigured before them[a], and his face shone like the sun, and his clothes became white as the light.
translation:
  language: vi
  text: Ngài đã biến hình trước mặt họ[a]; gương mặt Ngài sáng chói như mặt trời, và y phục Ngài trở nên trắng như ánh sáng.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “Ngài được biến đổi trước mặt họ.”'
    reason: Nêu phương án dịch rộng hơn cho μετεμορφώθη, đồng thời phản ánh hình thức bị động của động từ Hy Lạp mà không diễn giải thêm bản chất của sự biến đổi.
lexical_decisions:
- source_word: μετεμορφώθη
  choice: biến đổi hình dạng
  rationale: Động từ aorist bị động của μεταμορφόω chỉ một sự thay đổi hình dạng có thể thấy được. Cách dịch này tự nhiên trong tiếng Việt, sát nghĩa hơn lối phiên âm thần học, đồng thời không xác định quá mức bản chất của sự biến đổi.
- source_word: ἔμπροσθεν αὐτῶν
  choice: trước mặt họ
  rationale: Diễn đạt tự nhiên ý sự việc xảy ra ngay trong sự hiện diện và tầm nhìn của các môn đồ.
- source_word: ἔλαμψεν
  choice: sáng rực
  rationale: λάμπω có nghĩa là chiếu sáng, tỏa sáng. Trong phép so sánh với mặt trời, “sáng rực” truyền đạt rõ cường độ hiển hiện mà không thêm một hình ảnh mới.
- source_word: τὸ πρόσωπον αὐτοῦ
  choice: mặt Ngài
  rationale: πρόσωπον ở đây chỉ khuôn mặt theo nghĩa thể lý; “mặt” là cách nói hiện đại, trực tiếp và dễ hiểu.
- source_word: ὡς ὁ ἥλιος
  choice: như mặt trời
  rationale: Giữ nguyên phép so sánh do ὡς dẫn vào.
- source_word: τὰ ἱμάτια αὐτοῦ
  choice: y phục Ngài
  rationale: ἱμάτια chỉ quần áo nói chung. “Y phục” có sắc thái trang trọng vừa phải và tự nhiên hơn “áo xống” trong văn cảnh này.
- source_word: ἐγένετο λευκὰ
  choice: trở nên trắng
  rationale: Diễn đạt trực tiếp sự chuyển sang một trạng thái mới; không tự ý thêm mức độ như “trắng chói”.
- source_word: ὡς τὸ φῶς
  choice: như ánh sáng
  rationale: Giữ phép so sánh và chuyển φῶς thành “ánh sáng”, cách diễn đạt tự nhiên trong tiếng Việt; mạo từ Hy Lạp không nhất thiết đòi hỏi đại từ chỉ định trong bản dịch.
theological_decisions:
- issue: Cách diễn đạt sự biến hình của Chúa Giê-su
  choice: biến đổi hình dạng
  alternative: biến hình
  rationale: “Biến đổi hình dạng” phản ánh trực tiếp nghĩa của μετεμορφώθη và bảo toàn việc đây là một sự thay đổi hữu hình. “Biến hình” là thuật ngữ truyền thống ngắn gọn nhưng có thể được hiểu như tên gọi sự kiện hơn là nội dung động từ.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “Ngài” nhất quán cho Chúa Giê-su trong câu; giữ cấu trúc song hành của hai mệnh đề mô tả khuôn mặt và y phục, đồng thời dùng dấu chấm phẩy để câu rõ và tự nhiên.
