id: MAT.17.12
reference: Matthew 17:12
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: λέγω δὲ ὑμῖν ὅτι Ἠλίας ἤδη ἦλθεν, καὶ οὐκ ἐπέγνωσαν αὐτὸν ἀλλὰ ἐποίησαν ἐν αὐτῷ ὅσα ἠθέλησαν· οὕτως καὶ ὁ υἱὸς τοῦ ἀνθρώπου μέλλει πάσχειν ὑπ’ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/012.yaml
  text: But I tell you that Elijah has already come[a], and they did not recognize him, but did to him whatever they wanted[c][b]. So also the Son of Man is about to suffer at their hands.
translation:
  language: vi
  text: 'Nhưng tôi nói với anh em: Ê-li đã đến rồi, nhưng họ không nhận ra ông[a], mà đã đối xử với ông theo ý muốn của họ[b]. Cũng vậy, Con Người sắp chịu khổ dưới tay họ[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “không biết ông” hoặc “không thừa nhận ông.” Từ Hy Lạp có thể chỉ việc không nhận biết đúng thân phận hay vai trò của ông.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “đã làm với ông mọi điều họ muốn” hoặc “đối xử với ông tùy ý họ.” Cụm từ Hy Lạp diễn tả việc họ tùy ý hành động đối với ông.'
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể dịch: “Con Người cũng sẽ chịu khổ dưới tay họ.” Từ Hy Lạp nhấn mạnh sự chịu khổ sắp xảy đến.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω δὲ ὑμῖν
  choice: Nhưng tôi nói với anh em
  rationale: Giữ sắc thái tương phản của δέ và lời nói trực tiếp với các môn đồ; cách diễn đạt tự nhiên, trang trọng trong tiếng Việt hiện đại.
- source_word: Ἠλίας ἤδη ἦλθεν
  choice: Ê-li đã đến rồi
  rationale: Tên riêng theo dạng quen dùng trong tiếng Việt; “đã... rồi” diễn đạt hành động đã xảy ra và nhấn mạnh ἤδη.
- source_word: οὐκ ἐπέγνωσαν αὐτόν
  choice: người ta không nhận ra ông
  rationale: Trong ngữ cảnh, ἐπιγινώσκω chỉ việc không nhận biết đúng thân phận hoặc vai trò của ông; “người ta” giữ chủ thể số nhiều không xác định của động từ.
- source_word: ἐποίησαν ἐν αὐτῷ ὅσα ἠθέλησαν
  choice: đối xử với ông tùy ý họ
  rationale: Chuyển thành ngữ Hy Lạp sang lối nói Việt tự nhiên, đồng thời giữ ý họ hành động với ông không bị hạn chế, theo ý muốn của mình.
- source_word: οὕτως καὶ
  choice: cũng ... như vậy
  rationale: Thể hiện rõ phép tương ứng giữa điều đã xảy đến với Ê-li và điều sắp xảy đến với Con Người.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Con Người
  rationale: Cách dịch danh hiệu đã quen thuộc, giữ âm hưởng liên văn bản và không diễn giải thêm căn tính của danh hiệu.
- source_word: μέλλει πάσχειν
  choice: sắp phải chịu khổ
  rationale: “Sắp” giữ sắc thái sắp xảy ra của μέλλει; “phải chịu khổ” là tiếng Việt tự nhiên trong câu bị động, nhưng không nhằm thêm ý tiền định mạnh hơn nguyên văn.
- source_word: ὑπ’ αὐτῶν
  choice: bởi tay họ
  rationale: Diễn đạt rõ tác nhân gây đau khổ và sắc thái thù nghịch của ὑπό với sở hữu cách.
theological_decisions:
- issue: Ê-li đã đến chỉ về ai
  choice: Giữ nguyên tên Ê-li, không đưa Giăng Báp-tít vào câu dịch.
  alternative: Diễn giải Ê-li ở đây là Giăng Báp-tít.
  rationale: Câu này chỉ nêu tên Ê-li; ngữ cảnh kế tiếp giải thích mối liên hệ. Bản dịch không nên giải quyết ngay điều nguyên văn để cho ngữ cảnh làm sáng tỏ.
- issue: Sắc thái của μέλλει đối với sự chịu khổ của Con Người
  choice: sắp phải chịu khổ
  alternative: sẽ chịu khổ; đã được định phải chịu khổ
  rationale: Bản dịch giữ tính sắp xảy đến của biến cố, đồng thời tránh đưa vào mệnh đề này một khẳng định mạnh hơn về sự tiền định.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh em” cho lời Chúa Giê-su nói với các môn đồ, “ông” cho Ê-li, và cấu trúc “cũng ... như vậy” để làm rõ phép so sánh mà không thêm lời giải nghĩa vào chính văn.
