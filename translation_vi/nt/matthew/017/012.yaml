  source_fidelity: 'Bản nháp truyền đạt đúng các mệnh đề chính: Ê-li đã đến, không được nhận ra, bị đối xử tùy ý, và phép tương ứng với sự chịu khổ sắp tới của Con Người. Tuy nhiên, “phải chịu khổ” có thể gợi ý tính tất yếu/định sẵn không được nêu rõ bởi μέλλει πάσχειν; nên bỏ “phải”. “Bởi tay họ” cũng không tự nhiên bằng “dưới tay họ” trong tiếng Việt hiện đại.'
  naturalness: Câu sửa dùng “họ” để giữ chủ thể số nhiều của nguyên văn và liên kết rõ với “dưới tay họ”. “Cũng vậy” đặt đầu mệnh đề cuối là cách tự nhiên, rõ phép so sánh. “Theo ý muốn của họ” diễn đạt thành ngữ Hy Lạp tự nhiên mà không giảm ý hành động không bị hạn chế.
