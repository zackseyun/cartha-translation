  to: 'Nhưng tôi nói với anh em: Ê-li đã đến rồi, nhưng họ không nhận ra ông[a], mà đã đối xử với ông theo ý muốn của họ[b]. Cũng vậy, Con Người sắp chịu khổ dưới tay họ[c].'
