source:
  edition: SBLGNT
  text: καὶ ἐπηρώτησαν αὐτὸν οἱ ⸀μαθηταὶ λέγοντες· Τί οὖν οἱ γραμματεῖς λέγουσιν ὅτι Ἠλίαν δεῖ ἐλθεῖν πρῶτον;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/010.yaml
  text: And the disciples asked him, saying, “Why then do the scribes say that Elijah must come first?”
translation:
  language: vi
  text: 'Các môn đồ hỏi Ngài: “Vậy tại sao các kinh sư nói rằng Ê-li phải đến trước?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπηρώτησαν
  choice: hỏi
  rationale: Động từ aorist ở đây dẫn vào một câu hỏi trực tiếp; “hỏi” là cách diễn đạt tự nhiên và chính xác trong tiếng Việt hiện đại.
- source_word: οἱ μαθηταὶ
  choice: các môn đồ
  rationale: Mạo từ xác định chỉ nhóm môn đồ đã được biết trong văn cảnh. Không thêm “của Ngài” vì nguyên văn không có αὐτοῦ.
- source_word: λέγοντες
  choice: 'hỏi Ngài:'
  rationale: Phân từ này giới thiệu nội dung lời nói. Tiếng Việt tự nhiên không cần dịch lặp thành “hỏi Ngài rằng”; dấu hai chấm chuyển trực tiếp sang câu hỏi mà vẫn thể hiện đúng chức năng của phân từ.
- source_word: Τί οὖν
  choice: Vậy tại sao
  rationale: Trong cấu trúc τί ... λέγουσιν ὅτι, τί mang ý hỏi lý do; “Vậy tại sao” vừa tự nhiên vừa giữ sắc thái suy luận của οὖν.
- source_word: οἱ γραμματεῖς
  choice: các kinh sư
  rationale: “Kinh sư” là thuật ngữ tiếng Việt thông dụng trong văn cảnh Tin Mừng để chỉ những người chuyên chép, nghiên cứu và giảng giải Kinh Luật; cách dịch này trực tiếp hơn một lối diễn giải dài.
- source_word: λέγουσιν ὅτι
  choice: lại nói rằng
  rationale: “Nói rằng” thể hiện mệnh đề nội dung; “lại” trong câu hỏi tiếng Việt chuyển tải tự nhiên sắc thái liên kết và thắc mắc của οὖν, không hàm ý hành động lặp lại.
- source_word: Ἠλίαν
  choice: Ê-li
  rationale: Dùng dạng tên riêng đã quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
- source_word: δεῖ ἐλθεῖν
  choice: phải đến
  rationale: “Phải” giữ rõ ý nghĩa tất yếu của δεῖ, còn “đến” diễn đạt động từ nguyên mẫu ἐλθεῖν.
- source_word: πρῶτον
  choice: trước
  rationale: Trong trình tự được hỏi đến, “đến trước” là cách nói tiếng Việt tự nhiên và giữ nghĩa thời gian/thứ tự của πρῶτον.
theological_decisions:
- issue: Hàm ý của câu hỏi về việc Ê-li đến
  choice: Dịch câu hỏi mà không xác định trước các môn đồ đang nghi ngờ, bác bỏ hay xác nhận lời dạy của các kinh sư.
  alternative: Có thể diễn giải câu hỏi theo hướng hoài nghi lời các kinh sư, hoặc bổ sung trực tiếp bối cảnh lời tiên tri Ma-la-chi.
  rationale: Nguyên văn chỉ nêu câu hỏi; lời đáp và sự điều chỉnh thần học nằm ở các câu tiếp theo. Bản dịch vì thế giữ nguyên sự căng thẳng và không đưa phần giải thích ấy vào câu 10.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu dẫn được rút gọn tự nhiên thành “hỏi Ngài:” thay vì dịch cứng phân từ λέγοντες. Đại từ “Ngài” giữ sắc thái tôn kính quen thuộc khi nói về Chúa Giê-su.
