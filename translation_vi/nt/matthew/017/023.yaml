review_pass:
  verdict: revise
  source_fidelity: Bản nháp truyền đạt đúng ba mệnh đề chính. Tuy nhiên, τῇ τρίτῃ ἡμέρᾳ là thời điểm "vào ngày thứ ba", không phải cách nói có sắc thái kéo dài/đến hạn là "đến ngày thứ ba". Thể bị động của ἐγερθήσεται được giữ tốt nhất bằng "sẽ được cho sống lại"; tác nhân vẫn không được nêu. Chú thích về động từ phục sinh phải được neo tại mệnh đề phục sinh, không phải sau "giết Người".
  naturalness: '"Vào ngày thứ ba" tự nhiên và chính xác hơn "đến ngày thứ ba". "Sẽ được cho sống lại" là cách diễn đạt tiếng Việt hiện đại, giữ được ý bị động mà đỡ nặng hơn "sẽ được làm cho sống lại". "Các môn đồ vô cùng đau buồn" tự nhiên, rõ chủ ngữ theo ngữ cảnh, và phù hợp với cường độ của σφόδρα.'
  terminology: Viết hoa "Người" theo quy ước kính ngữ của bản dịch là nhất quán. "Giết" tương ứng trực tiếp với ἀποκτενοῦσιν. "Được cho sống lại" bảo toàn thể bị động của ἐγερθήσεται mà không xác định tác nhân; phương án chủ động được giữ trong chú thích như một khả năng dịch.
  issues:
