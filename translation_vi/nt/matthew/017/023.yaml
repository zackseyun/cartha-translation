base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/023.yaml
  text: and they will kill him[a], and on the third day he will be raised. And they were deeply grieved.
translation:
  language: vi
  text: Và họ sẽ giết Người, và vào ngày thứ ba Người sẽ được cho sống lại[a]. Các môn đồ vô cùng đau buồn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Người sẽ sống lại.” Động từ Hy Lạp ở thể bị động: “Người sẽ được cho sống lại.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκτενοῦσιν αὐτόν
  choice: họ sẽ giết Người
  rationale: Diễn đạt trực tiếp động từ chủ động ở thì tương lai và đại từ chỉ Con Người trong câu trước; “giết” tự nhiên và không thêm sắc thái pháp lý hay đạo đức ngoài nguyên văn.
- source_word: τῇ τρίτῃ ἡμέρᾳ
  choice: đến ngày thứ ba
  rationale: Phản ánh cách dùng tặng cách chỉ thời điểm. “Đến ngày thứ ba” tự nhiên trong tiếng Việt và vẫn giữ nguyên cách tính thời gian của nguyên văn.
- source_word: ἐγερθήσεται
  choice: Người sẽ được làm cho sống lại
  rationale: Giữ thể bị động của động từ tương lai, đồng thời diễn đạt rõ trong tiếng Việt rằng đây là sự sống lại từ cõi chết; không nêu tác nhân vì nguyên văn cũng không nêu.
- source_word: ἐλυπήθησαν σφόδρα
  choice: Các môn đồ vô cùng đau buồn
  rationale: “Vô cùng đau buồn” chuyển tải đầy đủ mức độ mạnh của σφόδρα và nỗi buồn của λυπέω. Chủ ngữ được làm rõ từ ngữ cảnh trước để câu tiếng Việt tự nhiên.
- source_word: καὶ ... καὶ ... καὶ
  choice: và ... rồi ...
  rationale: Dùng “và” để nối với câu trước, “rồi” để thể hiện trình tự tự nhiên trong tiếng Việt; không áp đặt quan hệ nhân quả.
theological_decisions:
- issue: Thể bị động trong lời báo trước về sự sống lại
  choice: Người sẽ được làm cho sống lại
  alternative: Người sẽ sống lại
  rationale: Nguyên văn dùng thể bị động. Bản dịch chính giữ hình thức này để bảo toàn hàm ý về hành động khiến Người sống lại mà không tự ý nêu tác nhân; cách chủ động tự nhiên hơn được ghi ở chú thích.
- issue: Chủ thể của động từ “đau buồn”
  choice: Các môn đồ vô cùng đau buồn
  alternative: Họ vô cùng đau buồn
  rationale: Đuôi động từ số nhiều trong tiếng Hy Lạp không nêu danh từ, nhưng ngữ cảnh xác định đó là các môn đồ. Làm rõ chủ thể giúp tránh nhầm “họ” với những người sẽ giết Đức Giê-su trong cùng câu.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Viết hoa “Người” khi chỉ Đức Giê-su theo quy ước kính ngữ phổ biến; tránh lối diễn đạt cổ. Dấu chú thích [a] đặt sau mệnh đề “họ sẽ giết Người” theo dữ liệu tham chiếu, nhưng nội dung chú thích giải thích động từ phục sinh ở mệnh đề kế tiếp.
