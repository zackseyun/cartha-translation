    issue: Cụm "đến ngày thứ ba" không phản ánh chính xác trạng ngữ thời gian τῇ τρίτῃ ἡμέρᾳ.
    rationale: 'Nguyên văn chỉ định thời điểm xảy ra sự việc: "vào/ngày thứ ba", chứ không nói diễn tiến kéo đến ngày ấy.'
  - severity: medium
    issue: Dấu chú thích [a] đang đặt sau "Người" trong mệnh đề bị giết, dù chú thích giải thích ἐγερθήσεται ở mệnh đề phục sinh.
    rationale: Neo chú thích cần đặt ngay sau cách dịch của từ/cụm từ được chú giải, để không gây hiểu lầm rằng chú thích liên quan đến động từ "giết".
  - severity: low
    issue: '"Được làm cho sống lại" hơi nặng và kém tự nhiên trong tiếng Việt hiện đại.'
    rationale: '"Được cho sống lại" vẫn diễn đạt bị động không nêu tác nhân, đồng thời trôi chảy hơn.'
