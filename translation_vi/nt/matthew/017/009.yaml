  to: 'Khi họ đang xuống núi, Đức Giê-su truyền cho họ: “Đừng kể cho ai nghe về khải tượng[a] này cho đến khi Con Người được sống lại từ cõi chết.”'
  rationale: Chỉnh sửa chỉ nhằm làm tiếng Việt tự nhiên hơn. “Khải tượng” vẫn dịch trực tiếp τὸ ὅραμα; chú thích được neo đúng vào từ này. “Được sống lại từ cõi chết” được giữ để phản ánh ἐγερθῇ ở thể bị động và thành ngữ ἐκ νεκρῶν, không áp đặt cách giải thích về tác nhân.
  reviewer_model: gpt-5.6-terra
