base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/009.yaml
  text: And as they were coming down from the mountain[a], Jesus commanded them, saying[b], “Tell the vision to no one until the Son of Man is raised from the dead.”
translation:
  language: vi
  text: 'Khi họ đang xuống núi, Đức Giê-su truyền cho họ: “Đừng kể cho ai nghe về khải tượng[a] này cho đến khi Con Người được sống lại từ cõi chết.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “điều các con đã thấy.” Tiếng Hy Lạp dùng từ “khải tượng.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καταβαινόντων αὐτῶν ἐκ τοῦ ὄρους
  choice: Khi họ đang từ trên núi đi xuống
  rationale: Cấu trúc sở hữu cách tuyệt đối với phân từ hiện tại diễn tả hành động đang diễn ra đồng thời; cách dịch này tự nhiên trong tiếng Việt và giữ sắc thái tiếp diễn.
- source_word: ἐνετείλατο αὐτοῖς ὁ Ἰησοῦς
  choice: Đức Giê-su truyền cho họ
  rationale: “Truyền” thể hiện một mệnh lệnh có thẩm quyền mà vẫn tự nhiên, trang trọng trong văn cảnh.
- source_word: Μηδενὶ εἴπητε τὸ ὅραμα
  choice: Đừng kể khải tượng này cho ai
  rationale: Giữ lệnh cấm rõ ràng cùng tân ngữ τὸ ὅραμα; “khải tượng” bảo tồn sắc thái mặc khải của từ Hy Lạp, còn cách hiểu tự nhiên hơn được ghi ở chú thích.
- source_word: ἕως οὗ
  choice: cho đến khi
  rationale: Diễn đạt chính xác giới hạn thời gian của lệnh cấm.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Con Người
  rationale: Giữ nguyên danh xưng của Đức Giê-su và âm hưởng thần học của cụm từ, không diễn giải thêm.
- source_word: ἐκ νεκρῶν ἐγερθῇ
  choice: được sống lại từ cõi chết
  rationale: “Được sống lại” giữ dạng bị động của động từ mà không nêu rõ tác nhân; “từ cõi chết” là cách diễn đạt tiếng Việt tự nhiên cho thành ngữ phục sinh này.
theological_decisions:
- issue: Cách diễn đạt và thể của sự phục sinh
  choice: được sống lại từ cõi chết
  alternative: sống lại từ cõi chết
  rationale: Bản Hy Lạp dùng thể bị động. Cách dịch đã chọn giữ thể ấy và để ngỏ tác nhân, thay vì âm thầm chuyển thành chủ động hoặc nói rõ ai khiến Con Người sống lại.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “Đức Giê-su” và danh xưng truyền thống “Con Người.” Tránh lối dịch quá sát như “từ giữa những người chết,” vốn không tự nhiên trong tiếng Việt; không thêm tác nhân cho động từ phục sinh.
