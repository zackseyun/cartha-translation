review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch truyền đạt đúng các thành tố chính của câu: hành động đang diễn ra khi xuống núi, mệnh lệnh của Đức Giê-su, lệnh không tiết lộ khải tượng, giới hạn thời gian, danh xưng “Con Người”, và thể bị động của động từ phục sinh. “Được sống lại từ cõi chết” là một cách chấp nhận được để phản ánh ἐγερθῇ và không thêm tác nhân. Tuy nhiên, trật tự trong “kể khải tượng này cho ai” chưa tự nhiên bằng cách đặt người nghe ngay sau động từ.'
  naturalness: Nên đổi “Khi họ đang từ trên núi đi xuống” thành “Khi họ đang xuống núi” và “Đừng kể khải tượng này cho ai” thành “Đừng kể cho ai nghe về khải tượng này.” Bản sửa vẫn giữ nghĩa, sắc thái tiếp diễn và văn phong trang trọng, hiện đại.
  terminology: “Đức Giê-su,” “khải tượng,” “Con Người,” và “cõi chết” đều phù hợp với văn cảnh và thuật ngữ Kinh Thánh tiếng Việt. Không cần thay đổi cách diễn đạt phục sinh, vì “được sống lại” bảo toàn tính bị động mà không giải thích thêm tác nhân.
  issues:
  - severity: low
    issue: Trật tự từ trong mệnh lệnh chưa tự nhiên
    rationale: Cụm “kể khải tượng này cho ai” hiểu được nhưng không phải trật tự thông dụng nhất trong tiếng Việt hiện đại. “Kể cho ai nghe về khải tượng này” rõ và tự nhiên hơn, không thay đổi nội dung.
  - severity: low
    issue: Cụm mở đầu hơi nặng
    rationale: “Khi họ đang từ trên núi đi xuống” bám sát nguyên ngữ nhưng có thể rút thành “Khi họ đang xuống núi”; động từ “xuống núi” đã hàm ý rời khỏi ngọn núi và vẫn diễn tả hành động đồng thời đang diễn ra.
