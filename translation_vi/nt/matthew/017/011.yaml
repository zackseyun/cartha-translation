  source_fidelity: Bản dịch chuyển tải chính xác cấu trúc và ý nghĩa chính của ὁ δὲ ἀποκριθεὶς εἶπεν, Ἠλίας μὲν ἔρχεται, καὶ ἀποκαταστήσει πάντα. “Ngài đáp” diễn đạt tự nhiên lực hồi đáp của cụm thành ngữ Hy Lạp; “quả thật” phản ánh lực nhấn và tính dự báo tương phản của μέν; “sẽ đến” phản ánh đúng ý hướng tương lai của ἔρχεται trong ngữ cảnh; và “sẽ khôi phục mọi sự” giữ nguyên phạm vi rộng, không diễn giải quá mức, của ἀποκαταστήσει πάντα.
  naturalness: 'Câu văn hiện đại, trang trọng và tự nhiên trong tiếng Việt Kinh Thánh: “Ngài đáp: ‘Ê-li quả thật sẽ đến[a] và sẽ khôi phục mọi sự.’” Cách dùng “Ngài,” “Ê-li,” và “mọi sự” phù hợp với văn phong phổ biến và dễ hiểu.'
  terminology: “Ê-li” là dạng tên riêng quen thuộc trong tiếng Việt Kinh Thánh. “Khôi phục mọi sự” là lựa chọn thích hợp cho ἀποκαταστήσει πάντα, bảo toàn tính bao quát mà không thu hẹp thành phục hưng thuộc linh, cải cách xã hội, hay sự hoàn tất cánh chung. Chú thích giải thích hợp lý hình thái hiện tại nhưng nghĩa hướng tương lai của ἔρχεται.
