  text: ὁ ⸀δὲ ἀποκριθεὶς ⸀εἶπεν· Ἠλίας μὲν ⸀ἔρχεται καὶ ἀποκαταστήσει πάντα·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/011.yaml
  text: He answered[a], “Elijah indeed is coming and will restore all things.”
translation:
  language: vi
  text: 'Ngài đáp: “Ê-li quả thật sẽ đến[a] và sẽ khôi phục mọi sự.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đang đến” hoặc “đến.” Động từ Hy Lạp ở thì hiện tại nhưng tại đây mang ý hướng về tương lai.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: Ngài đáp
  rationale: Cụm phân từ kết hợp với động từ hữu hạn là lối diễn đạt Hy Lạp chịu ảnh hưởng Sê-mít. “Ngài đáp” chuyển tải tự nhiên ý hồi đáp mà không lặp thừa “đáp và nói”.
- source_word: Ἠλίας
  choice: Ê-li
  rationale: Dùng dạng tên riêng đã quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
- source_word: μέν
  choice: quả thật
  rationale: μέν vừa nhấn mạnh lời khẳng định vừa chuẩn bị cho ý tương phản ở câu kế tiếp; “quả thật” giữ được lực nhấn ấy mà vẫn tự nhiên.
- source_word: ἔρχεται
  choice: sẽ đến
  rationale: Tuy mang hình thái hiện tại, động từ có ý hướng tương lai trong ngữ cảnh. “Sẽ đến” diễn đạt rõ sự mong đợi được nói đến; chú thích bảo lưu khả năng dịch sát hình thái là “đang đến/đến”.
- source_word: ἀποκαταστήσει
  choice: sẽ khôi phục
  rationale: Thì tương lai chủ động chỉ hành động sẽ xảy ra. “Khôi phục” giữ nghĩa phục hồi mà không xác định quá mức bản chất của công việc ấy.
- source_word: πάντα
  choice: mọi sự
  rationale: Dạng trung tính số nhiều có phạm vi rộng và bao quát. “Mọi sự” giữ nguyên phạm vi mà không thêm đối tượng cụ thể ngoài văn bản.
theological_decisions:
- issue: Bản chất và phạm vi công việc khôi phục của Ê-li
  choice: “sẽ khôi phục mọi sự”
  alternative: “sẽ sửa lại mọi việc cho đúng” hoặc diễn giải thành một sự phục hưng thuộc linh hay sự hoàn tất thời tận thế
  rationale: Bản Hy Lạp nói đến sự khôi phục với phạm vi bao quát nhưng không định nghĩa chính xác trong câu này. Cách dịch rộng giữ nguyên sự căng thẳng thần học và không áp đặt một hệ giải thích riêng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Ngài” xác định chủ thể được ngữ cảnh hiểu là Chúa Giê-su; “Ê-li” theo cách gọi quen thuộc trong tiếng Việt. Dấu chú thích [a] được đặt ngay sau cụm từ liên quan.
