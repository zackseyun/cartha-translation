  text: ἐπάραντες δὲ τοὺς ὀφθαλμοὺς αὐτῶν οὐδένα εἶδον εἰ μὴ ⸀αὐτὸν Ἰησοῦν μόνον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/008.yaml
  text: And lifting up their eyes[a], they saw no one except Jesus alone.
translation:
  language: vi
  text: Khi ngước mắt lên, họ không thấy ai khác, chỉ thấy một mình Đức Giê-su.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn nhấn mạnh rằng họ chỉ thấy Đức Giê-su, không còn thấy ai khác, qua các từ εἰ μὴ, αὐτόν và μόνον.
    reason: Giải thích sắc thái nhấn mạnh do εἰ μὴ + αὐτόν + μόνον tạo nên.
lexical_decisions:
- source_word: ἐπάραντες
  choice: Khi ngước ... lên
  rationale: Phân từ bất định diễn tả hành động xảy ra trước động từ chính; cấu trúc “Khi... lên” tự nhiên trong tiếng Việt và giữ được trình tự hành động.
- source_word: δὲ
  choice: không dịch riêng
  rationale: Đây là liên từ chuyển tiếp nhẹ trong mạch kể; tiếng Việt không cần thêm “và” hoặc “nhưng” ở đây.
- source_word: τοὺς ὀφθαλμοὺς αὐτῶν
  choice: mắt
  rationale: Giữ hình ảnh cụ thể của nguyên ngữ; chủ thể “họ” đã biểu đạt ý sở hữu nên không cần thêm “của mình”.
- source_word: οὐδένα εἶδον
  choice: họ không thấy ai
  rationale: Cách diễn đạt trực tiếp, tự nhiên, tương ứng với tân ngữ phủ định và động từ aorist đơn giản.
- source_word: εἰ μὴ
  choice: ngoài
  rationale: Sau mệnh đề phủ định, cụm này mang nghĩa loại trừ “ngoại trừ”; “ngoài” phù hợp với cú pháp tiếng Việt.
- source_word: αὐτὸν Ἰησοῦν μόνον
  choice: một mình Đức Giê-su
  rationale: “Một mình” truyền đạt sự nhấn mạnh loại trừ của đại từ αὐτόν kết hợp với μόνον mà vẫn tự nhiên; tên Giê-su được dùng theo cách gọi Kinh Thánh quen thuộc trong tiếng Việt.
theological_decisions:
- issue: Sự nhấn mạnh rằng Đức Giê-su là nhân vật duy nhất còn được nhìn thấy
  choice: ngoài một mình Đức Giê-su
  alternative: ngoài Đức Giê-su mà thôi
  rationale: Nguyên ngữ kết hợp εἰ μὴ, αὐτόν và μόνον để nhấn mạnh tính duy nhất. Bản dịch giữ sự nhấn mạnh ấy nhưng không suy diễn thêm ý nghĩa thần học ngoài cảnh thuật lại.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Ngước mắt lên” giữ lối diễn đạt cụ thể của nguyên ngữ; “một mình Đức Giê-su” vừa tự nhiên vừa bảo toàn sự nhấn mạnh loại trừ.
