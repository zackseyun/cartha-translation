id: MAT.17.20
reference: Matthew 17:20
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὁ δὲ ⸀λέγει αὐτοῖς· Διὰ τὴν ⸀ὀλιγοπιστίαν ὑμῶν· ἀμὴν γὰρ λέγω ὑμῖν, ἐὰν ἔχητε πίστιν ὡς κόκκον σινάπεως, ἐρεῖτε τῷ ὄρει τούτῳ· ⸂Μετάβα ἔνθεν⸃ ἐκεῖ, καὶ μεταβήσεται, καὶ οὐδὲν ἀδυνατήσει ⸀ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/020.yaml
  text: But he says to them[a], “Because of your little faith. For truly I say to you, if you have faith like a mustard seed, you will say to this mountain, ‘Move from here to there,’ and it will move[c][b], and nothing will be impossible for you.”
translation:
  language: vi
  text: 'Nhưng Ngài nói với họ: “Vì đức tin của anh em còn ít[a]. Quả thật, tôi nói với anh em: nếu anh em có đức tin như một hạt cải[b], anh em sẽ bảo núi này: ‘Hãy dời từ đây sang kia,’ thì nó sẽ dời đi, và sẽ chẳng có gì là không thể đối với anh em.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Vì anh em thiếu đức tin.” Từ Hy Lạp nhấn mạnh đức tin nhỏ bé hoặc không đầy đủ hơn là hoàn toàn không tin.'
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn: “có đức tin như một hạt cải.” Hình ảnh so sánh hướng đến một vật rất nhỏ.'
    reason: lexical_clarification
lexical_decisions:
- source_word: λέγει
  choice: nói
  rationale: Thì hiện tại lịch sử của tiếng Hy Lạp được chuyển tự nhiên bằng “nói”; trong tiếng Việt, hình thức này cũng có thể duy trì sắc thái kể chuyện sống động mà không buộc phải thêm dấu hiệu thời gian.
- source_word: Διὰ τὴν ὀλιγοπιστίαν ὑμῶν
  choice: Vì đức tin của anh em còn ít
  rationale: ὀλιγοπιστία chỉ đức tin nhỏ bé hoặc thiếu hụt, không nhất thiết là hoàn toàn không tin. Cách dịch này giữ được sắc thái định lượng và sự khiển trách trong ngữ cảnh.
- source_word: ἀμὴν
  choice: Quả thật
  rationale: Ở đầu lời tuyên bố, ἀμήν nhấn mạnh tính chắc chắn và trang trọng; “Quả thật” tự nhiên trong tiếng Việt hiện đại.
- source_word: πίστιν
  choice: đức tin
  rationale: Trong ngữ cảnh này, πίστις nói đến lòng tin cậy nơi quyền năng của Đức Chúa Trời. “Đức tin” giữ thuật ngữ quen thuộc mà không thu hẹp thành một học thuyết cứu rỗi cụ thể.
- source_word: ὡς κόκκον σινάπεως
  choice: như một hạt cải
  rationale: Giữ nguyên phép so sánh của bản Hy Lạp và hình ảnh về một vật rất nhỏ. “Hạt cải” là cách diễn đạt ngắn gọn, quen thuộc trong tiếng Việt.
- source_word: Μετάβα ἔνθεν ἐκεῖ
  choice: Hãy dời từ đây sang kia
  rationale: Mệnh lệnh μεταβαίνω yêu cầu chuyển vị trí; “dời” phù hợp tự nhiên khi nói với một ngọn núi.
- source_word: μεταβήσεται
  choice: nó sẽ dời đi
  rationale: 'Động từ tương lai mang nghĩa nội động ở đây: chính ngọn núi chuyển chỗ, không cần diễn đạt ở thể bị động.'
- source_word: οὐδὲν ἀδυνατήσει ὑμῖν
  choice: sẽ chẳng có gì là không thể đối với anh em
  rationale: Diễn đạt tự nhiên thành ngữ Hy Lạp, giữ nguyên lời khẳng định mạnh mà không giải thích thêm phạm vi thần học của lời ấy.
theological_decisions:
- issue: Ý nghĩa của πίστις trong bối cảnh phép lạ
  choice: đức tin
  alternative: lòng tin cậy
  rationale: Bối cảnh nói đến sự tin cậy còn thiếu của các môn đồ trước quyền năng của Đức Chúa Trời. “Đức tin” giữ được thuật ngữ rộng của nguyên văn và không biến câu này thành một tuyên bố riêng về đức tin cứu rỗi hay sự trung tín.
- issue: Phạm vi của câu “chẳng có gì là không thể”
  choice: Giữ lời khẳng định tuyệt đối như nguyên văn
  alternative: Diễn giải là chỉ những việc phù hợp với ý muốn Đức Chúa Trời
  rationale: Nguyên văn không nêu điều kiện giải thích trong chính câu này. Bản dịch giữ sức căng của lời tuyên bố và không đưa một giới hạn thần học ngầm vào phần chính văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Ngài” để chỉ Chúa Giê-su trong lời kể, “tôi” trong lời trực tiếp và “anh em” để nói với các môn đồ, tránh thêm sắc thái cha-con không có trong đại từ Hy Lạp. Giữ “Nhưng” để thể hiện δέ, dù đây là liên từ chuyển ý nhẹ chứ không nhất thiết là đối lập mạnh.
