  naturalness: Văn bản trôi chảy, hiện đại và vẫn giữ được sắc thái trang trọng vừa phải của lời tường thuật Kinh Thánh. Cách xưng hô “Ngài / tôi / anh em” nhất quán trong khung kể chuyện và lời trực tiếp, không áp đặt diễn giải giáo phái. “Hãy dời từ đây sang kia” tự nhiên khi mệnh lệnh một ngọn núi chuyển chỗ.
  terminology: “Đức tin,” “hạt cải,” “Quả thật,” và “không thể” là các lựa chọn thuật ngữ chuẩn, rõ và phù hợp ngữ cảnh. Hai chú thích đều được gắn đúng vào các cụm cần làm rõ; chú thích a đặc biệt phản ánh chính xác sắc thái của ὀλιγοπιστία.
