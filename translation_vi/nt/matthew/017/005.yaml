  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἔτι αὐτοῦ λαλοῦντος ἰδοὺ νεφέλη φωτεινὴ ἐπεσκίασεν αὐτούς, καὶ ἰδοὺ φωνὴ ἐκ τῆς νεφέλης λέγουσα· Οὗτός ἐστιν ὁ υἱός μου ὁ ἀγαπητός, ἐν ᾧ εὐδόκησα· ⸂ἀκούετε αὐτοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/005.yaml
  text: While he was still speaking[a], behold, a bright cloud overshadowed them, and behold, a voice from the cloud said, “This is my beloved Son, with whom I am well pleased[c][b]; listen to him.”
translation:
  language: vi
  text: 'Khi ông còn đang nói, kìa, một đám mây sáng bao phủ họ[a]. Và kìa[b], một tiếng nói từ trong đám mây phán: “Đây là Con yêu dấu của Ta, Ta hài lòng về Người. Hãy lắng nghe Người!”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Bao phủ” có thể gợi lại ngôn ngữ thần hiện trong Kinh Thánh, gắn với sự hiện diện được bày tỏ của Đức Chúa Trời.
    reason: cross_reference
  - marker: b
    text: Nguyên văn lặp lại từ “kìa”, một dấu hiệu hướng sự chú ý nhằm làm cảnh tượng thêm đột ngột và sống động.
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể dịch: “Hãy nghe Người.” Động từ Hy Lạp có thể chỉ việc nghe theo nghĩa chú tâm và làm theo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔτι αὐτοῦ λαλοῦντος
  choice: Khi ông còn đang nói
  rationale: Cấu trúc sở hữu cách tuyệt đối diễn tả hành động đồng thời; “còn đang” giữ được sắc thái tiếp diễn và sự ngắt lời do ἔτι gợi ra.
- source_word: ἰδοὺ
  choice: kìa
  rationale: Giữ lại cả hai lần từ chỉ sự chú ý để bảo toàn tính sống động và kịch tính của trình thuật.
- source_word: νεφέλη φωτεινὴ
  choice: một đám mây sáng chói
  rationale: Diễn đạt trực tiếp ý sáng/rực của φωτεινή mà không giải thích thêm ý nghĩa thần học trong chính văn.
- source_word: ἐπεσκίασεν
  choice: phủ bóng trên
  rationale: Giữ hình ảnh của ἐπισκιάζω và khả năng gợi ngôn ngữ thần hiện, thay vì giản lược thành “che phủ”.
- source_word: φωνὴ ἐκ τῆς νεφέλης λέγουσα
  choice: có tiếng từ trong đám mây phán
  rationale: Chuyển phân từ sang động từ hữu hạn cho tự nhiên trong tiếng Việt; “phán” phù hợp với lời trực tiếp của Đức Chúa Trời mà không cần thêm chủ thể ngoài nguyên văn.
- source_word: ὁ υἱός μου ὁ ἀγαπητός
  choice: Con yêu dấu của Ta
  rationale: Bảo toàn cả mối quan hệ Con và sắc thái yêu thương/tuyển chọn của ἀγαπητός bằng lối nói trang trọng, dễ hiểu.
- source_word: ἐν ᾧ εὐδόκησα
  choice: Ta hài lòng về Người
  rationale: Diễn đạt tự nhiên công thức tuyên bố thần thượng; không ép thì aorist thành một hành động chỉ thuộc quá khứ.
- source_word: ἀκούετε αὐτοῦ
  choice: Hãy lắng nghe Người
  rationale: Mệnh lệnh hiện tại kêu gọi việc nghe với thái độ tiếp nhận và làm theo; “lắng nghe” truyền đạt sắc thái ấy mà chưa diễn giải mạnh thành “vâng lời”.
theological_decisions:
- issue: Lời tuyên bố của Cha về căn tính của Chúa Giê-su
  choice: Đây là Con yêu dấu của Ta, Ta hài lòng về Người
  alternative: Đây là Con Ta, Đấng Yêu Dấu; trong Người Ta đã vui lòng
  rationale: Bản dịch giữ lời xác nhận trực tiếp về địa vị làm Con, tình yêu và sự hài lòng, nhưng không đưa thuật ngữ tín lý hậu kỳ vào câu.
- issue: Sức nặng của mệnh lệnh ἀκούετε αὐτοῦ
  choice: Hãy lắng nghe Người
  alternative: Hãy nghe Người
  rationale: “Lắng nghe” bao hàm chú tâm và tiếp nhận, phù hợp với khả năng mệnh lệnh kêu gọi làm theo, nhưng vẫn giữ khoảng căng giữa “nghe” và “vâng lời” thay vì đồng nhất hai ý.
- issue: Hình ảnh đám mây phủ bóng
  choice: phủ bóng trên họ
  alternative: bao phủ họ
  rationale: Lựa chọn chính giữ hình ảnh cụ thể và khả năng liên hệ đến ngôn ngữ thần hiện trong Kinh Thánh mà không biến liên hệ ấy thành một khẳng định giải nghĩa.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “phán” cho tiếng từ đám mây và viết hoa “Con”, “Ta”, “Người” trong lời trực tiếp để giữ sắc thái tôn kính; tránh lối cổ như “nầy” hoặc “đẹp lòng Ta mọi đàng”.
