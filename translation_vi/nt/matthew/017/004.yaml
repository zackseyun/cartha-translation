  verdict: revise
  source_fidelity: Bản dịch truyền đạt đầy đủ diễn tiến của δέ, công thức ἀποκριθεὶς ... εἶπεν, lời xưng hô Κύριε, hai lần ὧδε, lời đề nghị ở ngôi thứ nhất số ít, và sự phân phối “một ... một ... một”. “Lạy Chúa—con” là cách chuyển xưng hô kính trọng tự nhiên trong tiếng Việt và không làm thu hẹp nghĩa của κύριος. Tuy nhiên, chú thích dùng “trại” làm lựa chọn từ vựng cho σκηνάς chưa chính xác bằng các từ chỉ một cấu trúc trú tạm riêng lẻ.
