  terminology: “Chúa”, “lều”, Môi-se và Ê-li đều phù hợp cách dùng Việt ngữ Cơ Đốc phổ thông. Nên thay “trại” trong chú thích bằng “chòi” để phản ánh tốt hơn lựa chọn “booths”, đồng thời vẫn giữ “lều tạm” và “nhà tạm” như các khả năng khác.
  issues:
