id: MAT.17.4
reference: Matthew 17:4
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ὁ Πέτρος εἶπεν τῷ Ἰησοῦ· Κύριε, καλόν ἐστιν ἡμᾶς ὧδε εἶναι· εἰ θέλεις, ⸀ποιήσω ὧδε τρεῖς σκηνάς, σοὶ μίαν καὶ Μωϋσεῖ μίαν καὶ ⸂Ἠλίᾳ μίαν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/004.yaml
  text: 'Then Peter answered and said to Jesus[a], “Lord, it is good for us to be here. If you wish, I will make three shelters here: one for you, one for Moses, and one for Elijah.”'
translation:
  language: vi
  text: 'Bấy giờ, Phi-e-rơ lên tiếng thưa với Đức Giê-su: “Lạy Chúa, chúng ta ở đây thật là tốt. Nếu Chúa muốn, con sẽ dựng tại đây ba cái lều[a]: một cho Chúa, một cho Môi-se và một cho Ê-li.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hy Lạp cũng có thể được dịch là “lều tạm”, “chòi” hoặc “nhà tạm”.
    reason: Bảo lưu phạm vi nghĩa của σκηνάς, gồm các cách dịch tương ứng với “tabernacles”, “booths” và “tents”, mà không áp đặt liên hệ lễ nghi trong bản chính.
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ... εἶπεν
  choice: Bấy giờ ... lên tiếng thưa
  rationale: Cụm phân từ ἀποκριθεὶς đi với εἶπεν là công thức dẫn lời. “Lên tiếng thưa” tự nhiên trong tiếng Việt, phù hợp lời nói kính trọng với Đức Giê-su, và không hàm ý rằng Phi-e-rơ đang trả lời một câu hỏi trực tiếp; δέ được thể hiện bằng “Bấy giờ” để nối diễn tiến câu chuyện.
- source_word: Κύριε
  choice: Lạy Chúa
  rationale: Trong lời trực tiếp kính cẩn với Đức Giê-su, “Lạy Chúa” vừa tự nhiên vừa giữ được sức nặng có thể có của danh xưng κύριος.
- source_word: καλόν ἐστιν ἡμᾶς ὧδε εἶναι
  choice: chúng ta ở đây thật là tốt
  rationale: Cách diễn đạt này chuyển tải tự nhiên cấu trúc nguyên ngữ ‘việc chúng ta ở đây là tốt’, không thêm nguyên nhân hay giải thích.
- source_word: εἰ θέλεις
  choice: Nếu Chúa muốn
  rationale: θέλω có thể chỉ ý muốn hoặc sự sẵn lòng. Trong tiếng Việt, lặp lại danh xưng “Chúa” rõ chủ thể số ít và giữ giọng kính trọng.
- source_word: ποιήσω
  choice: con sẽ dựng
  rationale: “Dựng” phù hợp hơn “làm” đối với các cấu trúc tạm thời; đại từ “con” thể hiện quan hệ xưng hô kính trọng vốn được tiếng Việt đòi hỏi trong ngữ cảnh này.
- source_word: σκηνάς
  choice: lều
  rationale: σκηνή chỉ lều hoặc chỗ trú tạm. “Lều” là từ hiện đại, rõ nghĩa và trung tính, không mặc nhiên xác định mối liên hệ với Lễ Lều Tạm.
- source_word: σοὶ μίαν καὶ Μωϋσεῖ μίαν καὶ Ἠλίᾳ μίαν
  choice: một cho Chúa, một cho Môi-se và một cho Ê-li
  rationale: Lặp lại “một” cho từng nhân vật để giữ sắc thái phân phối và sự cân xứng của nguyên văn.
- source_word: ὧδε ... ὧδε
  choice: ở đây ... tại đây
  rationale: Giữ cả hai lần xuất hiện của ὧδε, đồng thời dùng biến thể tự nhiên trong tiếng Việt để tránh câu văn nặng nề.
theological_decisions:
- issue: Cách dịch κύριος khi Phi-e-rơ xưng hô với Đức Giê-su
  choice: Lạy Chúa
  alternative: Thưa Thầy / Lạy Chủ
  rationale: “Lạy Chúa” giữ cả sắc thái kính trọng lẫn khả năng mang ý nghĩa thần học của κύριος, thay vì thu hẹp danh xưng thành cách gọi một người thầy.
- issue: Ý nghĩa của σκηνάς trong bối cảnh hóa hình
  choice: lều
  alternative: lều tạm / nhà tạm
  rationale: Câu này không nói rõ Phi-e-rơ liên hệ ba cấu trúc với Lễ Lều Tạm hay đền tạm. Bản chính vì thế dùng từ trung tính, còn các khả năng gợi liên tưởng nghi lễ được bảo lưu trong chú thích.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Cách xưng hô “Lạy Chúa—con” phù hợp lời nói kính trọng; tên riêng được phiên âm theo lối quen dùng. Dấu chú thích [a] được đặt ngay sau từ “lều” mà nó giải thích.
