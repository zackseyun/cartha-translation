  text: Καὶ ⸀ἐλθόντων πρὸς τὸν ὄχλον προσῆλθεν αὐτῷ ἄνθρωπος γονυπετῶν αὐτὸν
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/014.yaml
  text: And when they came to the crowd[a], a man came up to him, kneeling before him[b],
translation:
  language: vi
  text: Và khi họ đến gần đám đông, một người đàn ông đến gặp Ngài[a], quỳ gối trước Ngài[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “tiến đến với Ngài”.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “sụp gối trước mặt Ngài”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: Khi
  rationale: Liên từ nối tiếp câu chuyện được hòa vào mệnh đề thời gian để câu tiếng Việt tự nhiên; mối liên hệ với phần trước vẫn được giữ qua cấu trúc “Khi họ đến…”.
- source_word: ἐλθόντων
  choice: họ đến
  rationale: Phân từ bất định thì, sở hữu cách số nhiều, tạo thành cấu trúc sở hữu cách tuyệt đối với chủ thể số nhiều được hiểu từ ngữ cảnh. “Khi họ đến” truyền đạt rõ quan hệ thời gian.
- source_word: πρὸς τὸν ὄχλον
  choice: chỗ đám đông
  rationale: ὄχλος chỉ một đám đông; “đến chỗ đám đông” là cách nói tự nhiên trong tiếng Việt và vẫn giữ hướng chuyển động của πρὸς.
- source_word: προσῆλθεν αὐτῷ
  choice: tiến lại gần Ngài
  rationale: προσέρχομαι diễn tả việc đến hoặc tiến đến gần một người. “Tiến lại gần” giữ sắc thái hướng về Chúa Jêsus; “Ngài” là đại từ tôn kính tự nhiên trong văn phong Kinh Thánh tiếng Việt.
- source_word: ἄνθρωπος
  choice: một người đàn ông
  rationale: Trong ngữ cảnh này, danh từ số ít giống đực chỉ một cá nhân nam cụ thể; cách dịch này chính xác hơn “một người” mà không đưa thêm hàm ý thần học.
- source_word: γονυπετῶν αὐτὸν
  choice: quỳ gối trước mặt Ngài
  rationale: Phân từ hiện tại mô tả tư thế hoặc hành động quỳ trước Chúa Jêsus. “Quỳ gối trước mặt Ngài” rõ ràng, trang trọng và không buộc động từ phải mang nghĩa thờ phượng.
theological_decisions:
- issue: Sắc thái của hành động γονυπετῶν
  choice: quỳ gối trước mặt Ngài
  alternative: sụp gối trước mặt Ngài
  rationale: Bản dịch chính giữ hành động thân thể và thái độ khẩn cầu, nhưng không tự ý xác định đây là một hành vi thờ phượng. Phương án “sụp gối” bảo lưu sắc thái chuyển động mạnh hơn có thể có.
- issue: Cách dịch ἄνθρωπος khi chỉ một cá nhân trong câu chuyện
  choice: một người đàn ông
  alternative: một người
  rationale: Ngữ pháp và ngữ cảnh cho thấy đây là một người nam cụ thể; lựa chọn này phản ánh đúng đối tượng mà không suy rộng thành một phát biểu về nhân loại.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Câu giữ nhịp kể chuyện tự nhiên; đại từ “Ngài” dùng để chỉ Chúa Jêsus theo lối tôn kính quen thuộc, còn các động từ không được diễn giải quá mức theo một lập trường giáo phái.
