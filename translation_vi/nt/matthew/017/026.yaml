id: MAT.17.26
reference: Matthew 17:26
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸂εἰπόντος δέ⸃· Ἀπὸ τῶν ἀλλοτρίων, ἔφη αὐτῷ ὁ Ἰησοῦς· Ἄρα γε ἐλεύθεροί εἰσιν οἱ υἱοί.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/026.yaml
  text: When he said[a], “From strangers,” Jesus said to him[c][b], “Then the sons are free.”
translation:
  language: vi
  text: 'Khi Phi-e-rơ đáp: “Từ những người ngoài,” Đức Giê-su nói với ông: “Vậy thì các con trai được tự do[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “được miễn”. Nguyên văn là “được tự do”; trong ngữ cảnh, điều này có nghĩa là không phải nộp khoản thuế ấy.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰπόντος δέ
  choice: Khi Phi-e-rơ đáp
  rationale: Cụm sở hữu cách tuyệt đối nêu hoàn cảnh thời gian và tiếp nối lời hỏi ở câu trước. Chủ thể được làm rõ từ ngữ cảnh là Phi-e-rơ; “đáp” tự nhiên hơn “nói” trong một cuộc đối thoại hỏi–đáp.
- source_word: ἀπὸ τῶν ἀλλοτρίων
  choice: Từ những người ngoài
  rationale: ἀλλότριοι chỉ những người không thuộc gia đình nhà vua, đối lập với chính các con trai của vua. “Người ngoài” giữ được nét tương phản về quan hệ mà không hàm ý quá mạnh về quốc tịch hay sắc tộc.
- source_word: ἔφη αὐτῷ ὁ Ἰησοῦς
  choice: Đức Giê-su nói với ông
  rationale: Cách diễn đạt kể chuyện tự nhiên, sát nghĩa φημί và giữ rõ đối tượng được nói với là Phi-e-rơ.
- source_word: Ἄρα γε
  choice: Vậy thì
  rationale: Diễn đạt kết luận được rút ra từ câu trả lời của Phi-e-rơ, tự nhiên trong tiếng Việt và giữ lực suy luận của tổ hợp tiểu từ.
- source_word: ἐλεύθεροί
  choice: được tự do
  rationale: Giữ nghĩa trực tiếp “tự do, không bị ràng buộc”; trong ngữ cảnh, điều này hàm ý không phải nộp thuế mà không thu hẹp câu nói chỉ còn ý miễn thuế.
- source_word: οἱ υἱοί
  choice: các con trai
  rationale: Giữ hình thức giống đực và phép so sánh cụ thể giữa các con trai của vua với người ngoài; đồng thời bảo toàn sắc thái gia đình và pháp lý của υἱοί.
theological_decisions:
- issue: Cách dịch οἱ υἱοί trong phép so sánh về những người thuộc nhà vua
  choice: các con trai
  alternative: các con
  rationale: Nguyên văn dùng danh từ giống đực số nhiều và ngữ cảnh trực tiếp nói về các con trai của vua trong quan hệ với nghĩa vụ thuế. Giữ “các con trai” tránh trung tính hóa và bảo toàn âm hưởng về địa vị làm con.
- issue: Ý nghĩa của ἐλεύθεροί trong ngữ cảnh thuế
  choice: được tự do
  alternative: được miễn thuế
  rationale: “Được miễn thuế” nêu đúng hệ quả trong ngữ cảnh nhưng thu hẹp trường nghĩa. “Được tự do” giữ nguyên phát biểu rộng hơn của Đức Giê-su, còn chú thích giải thích hàm ý về thuế.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Giê-su” theo lối gọi tôn kính; làm rõ Phi-e-rơ là chủ thể từ ngữ cảnh trước đó. “Những người ngoài” tránh nghĩa dân tộc của “người ngoại quốc” và giữ sự đối lập với các con trai trong hoàng gia.
