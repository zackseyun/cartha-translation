  terminology: «Đức Giê-su», «Phi-e-rơ», «các con trai», và «được tự do» nhất quán với văn phong trang trọng hiện đại. Chú thích giải thích đúng hàm ý miễn nghĩa vụ thuế của ἐλεύθεροι mà không thay thế nghĩa trực tiếp của từ bằng một diễn giải hẹp hơn.
