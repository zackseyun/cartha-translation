id: MAT.17.3
reference: Matthew 17:3
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ ⸀ὤφθη αὐτοῖς Μωϋσῆς καὶ Ἠλίας ⸂συλλαλοῦντες μετ’ αὐτοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/003.yaml
  text: And behold[a], Moses and Elijah appeared to them, talking with him.
translation:
  language: vi
  text: Và kìa, Môi-se và Ê-li hiện ra trước mắt họ[a], đang trò chuyện với Ngài.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “được họ nhìn thấy.” Động từ Hy Lạp có hình thức bị động.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: kìa
  rationale: Giữ chức năng hướng sự chú ý và sắc thái bất ngờ, sống động của tiểu từ Hy Lạp bằng một từ tự nhiên trong tiếng Việt hiện đại.
- source_word: ὤφθη αὐτοῖς
  choice: hiện ra trước mắt họ
  rationale: Diễn đạt tự nhiên biến cố trở nên hữu hình đối với các môn đồ, đồng thời giữ liên hệ với hình thức bị động “được họ nhìn thấy” qua chú thích.
- source_word: Μωϋσῆς
  choice: Môi-se
  rationale: Dùng dạng tên riêng quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
- source_word: Ἠλίας
  choice: Ê-li
  rationale: Dùng dạng tên riêng quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
- source_word: συλλαλοῦντες
  choice: đang trò chuyện
  rationale: Động từ hàm ý nói chuyện qua lại; “trò chuyện” tự nhiên và thể hiện rõ tính tương tác.
- source_word: μετ’ αὐτοῦ
  choice: với Ngài
  rationale: Giới từ μετά với sở hữu cách chỉ sự cùng tham dự. Đại từ chỉ Chúa Giê-su theo văn cảnh; viết hoa theo quy ước kính ngữ tiếng Việt mà không thay đại từ bằng tên riêng.
theological_decisions:
- issue: Đối tượng được αὐτοῦ chỉ đến
  choice: “Ngài” chỉ Chúa Giê-su
  alternative: Thay đại từ bằng “Chúa Giê-su”
  rationale: Văn cảnh cuộc hóa hình xác định rõ đối tượng, nhưng bản dịch vẫn giữ đại từ như nguyên văn thay vì diễn giải bằng tên riêng.
- issue: Cách diễn đạt biến cố xuất hiện
  choice: Môi-se và Ê-li hiện ra hữu hình trước mắt họ
  alternative: Môi-se và Ê-li được họ nhìn thấy
  rationale: Bản văn thuật lại một sự hiện ra có thể nhìn thấy nhưng không giải thích phương thức hiện diện; cách dịch tránh đưa thêm kết luận thần học.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Kìa” duy trì lực hướng sự chú ý của ἰδού; “hiện ra trước mắt họ” tự nhiên trong tiếng Việt nhưng chú thích vẫn bảo tồn khả năng dịch sát hình thức bị động.
