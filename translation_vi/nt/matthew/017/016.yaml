    rationale: 'Nguyên văn có καὶ ... καὶ, phối hợp đơn thuần: “và ... và”. Dù kết quả có vẻ tương phản theo ngữ cảnh, “nhưng” thêm lực đối nghịch không được biểu thị trực tiếp.'
  - severity: low
    issue: “cháu” làm đại từ quy chiếu cho người con
    rationale: “Cháu” phụ thuộc vào quan hệ xưng hô và có thể gây sắc thái không rõ trong lời người cha nói với Đức Giê-su. Ngữ cảnh liền trước xác định người này là con trai của người nói; “con trai tôi” rõ ràng và tự nhiên hơn.
