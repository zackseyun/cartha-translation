  text: καὶ προσήνεγκα αὐτὸν τοῖς μαθηταῖς σου, καὶ οὐκ ἠδυνήθησαν αὐτὸν θεραπεῦσαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/016.yaml
  text: And I brought him to your disciples[a], and they were not able to heal him.
translation:
  language: vi
  text: Tôi đã đem con trai tôi đến với các môn đồ của Thầy, và họ không thể chữa lành cho con trai tôi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “họ không chữa lành cho con trai tôi được.”'
    reason: Biến thể diễn đạt tự nhiên trong tiếng Việt của ἠδυνήθησαν ... θεραπεῦσαι, vẫn giữ nguyên ý về sự bất lực.
lexical_decisions:
- source_word: προσήνεγκα
  choice: đã đem ... đến với
  rationale: Động từ προσφέρω ở đây diễn tả việc đưa một người đến với người khác; cách dịch này tự nhiên và giữ đúng cấu trúc có tân ngữ cùng bổ ngữ chỉ người tiếp nhận.
- source_word: μαθηταῖς σου
  choice: các môn đồ của Thầy
  rationale: μαθητής trong các sách Phúc Âm chỉ những người theo học và gắn bó với một người thầy. “Môn đồ” là cách gọi quen thuộc, còn “của Thầy” giữ được ngôi thứ hai mà không thêm một tước hiệu thần học không có trong cụm từ này.
- source_word: ἠδυνήθησαν
  choice: không thể
  rationale: δύναμαι diễn tả khả năng hoặc năng lực; “không thể” chuyển tải trực tiếp ý họ không có khả năng thực hiện việc chữa lành.
- source_word: θεραπεῦσαι
  choice: chữa lành
  rationale: θεραπεύω trong ngữ cảnh này nói đến việc chữa khỏi tình trạng đau khổ của đứa con; “chữa lành” tự nhiên trong thuật chuyện phép lạ và không thu hẹp câu thành một phương pháp trừ quỷ cụ thể.
- source_word: αὐτόν
  choice: cháu
  rationale: Đại từ chỉ người con trai đang được người cha nói đến. Trong lời thưa trực tiếp bằng tiếng Việt, “cháu” là cách quy chiếu tự nhiên, rõ ràng và phù hợp với quan hệ giữa người nói, người nghe và đứa trẻ.
- source_word: καὶ ... καὶ
  choice: đã ... nhưng
  rationale: Liên từ καί thứ nhất nối tiếp lời kể nên không cần dịch riêng sau dấu mở câu trong tiếng Việt; καί thứ hai được diễn đạt bằng “nhưng” để thể hiện tự nhiên sự tương phản hiển nhiên giữa việc đưa cháu đến và kết quả thất bại, mà không thêm nguyên nhân cho sự thất bại ấy.
theological_decisions:
- issue: Bản chất sự thất bại của các môn đồ
  choice: Chỉ nói rằng họ không thể chữa lành cho cháu.
  alternative: Nói rõ họ không thể đuổi quỷ, hoặc quy nguyên nhân trực tiếp cho sự thiếu đức tin.
  rationale: Câu này chỉ khẳng định sự bất lực trong việc chữa lành. Những giải thích từ ngữ cảnh chung quanh không được đưa thêm vào chính câu dịch.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Tôi” tránh tự ý áp đặt sắc thái tôn giáo lên đại từ của người cha; “Thầy” phù hợp với việc ông gọi những người đi theo Chúa Giê-su là các môn đồ. Dấu chú thích [a] được đặt ngay sau mệnh đề mà chú thích giải thích.
