id: MAT.17.24
reference: Matthew 17:24
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἐλθόντων δὲ αὐτῶν εἰς Καφαρναοὺμ προσῆλθον οἱ τὰ δίδραχμα λαμβάνοντες τῷ Πέτρῳ καὶ εἶπαν· Ὁ διδάσκαλος ὑμῶν οὐ τελεῖ τὰ δίδραχμα;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/024.yaml
  text: When they came to Capernaum[a], those who collected the two-drachma tax came to Peter and said[b], “Does your teacher not pay the two-drachma tax?”
translation:
  language: vi
  text: 'Khi họ đến Ca-phác-na-um, những người thu thuế hai đơ-rắc-ma[a] đến gặp Phi-e-rơ và hỏi: “Thầy của các ông không nộp thuế hai đơ-rắc-ma sao?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “hai đơ-rắc-ma”; tức khoản thuế đền thờ trị giá hai đơ-rắc-ma.'
    reason: cultural_note
lexical_decisions:
- source_word: Ἐλθόντων δὲ αὐτῶν
  choice: Khi họ đến
  rationale: Cấu trúc sở hữu cách tuyệt đối diễn tả hoàn cảnh thời gian. “Khi họ đến” tự nhiên trong tiếng Việt; δέ chỉ đóng vai trò chuyển ý nhẹ nên không cần dịch riêng.
- source_word: Καφαρναοὺμ
  choice: Ca-phác-na-um
  rationale: Dùng dạng phiên âm Kinh Thánh quen thuộc trong tiếng Việt cho địa danh Capernaum.
- source_word: προσῆλθον
  choice: đến gặp
  rationale: Động từ chỉ việc tiến đến gần một người. “Đến gặp” vừa tự nhiên vừa giữ rõ hướng chuyển động về phía Phi-e-rơ.
- source_word: οἱ τὰ δίδραχμα λαμβάνοντες
  choice: những người thu thuế hai đơ-rắc-ma
  rationale: Cụm phân từ nhận diện nhóm người theo chức năng thu khoản tiền này. Thêm “thuế” làm rõ nghĩa theo ngữ cảnh mà không biến họ thành một chức danh kỹ thuật.
- source_word: δίδραχμα
  choice: hai đơ-rắc-ma
  rationale: δίδραχμον là khoản tiền bằng hai drachma. Giữ đơn vị tiền cổ bằng phiên âm và giải thích mục đích của khoản thu trong chú thích.
- source_word: τῷ Πέτρῳ
  choice: Phi-e-rơ
  rationale: Danh từ ở tặng cách chỉ người mà họ đến gặp; dùng dạng tên riêng quen thuộc trong tiếng Việt.
- source_word: Ὁ διδάσκαλος ὑμῶν
  choice: Thầy của các ông
  rationale: διδάσκαλος là “thầy/người dạy”. “Thầy” tự nhiên trong lời thoại; “các ông” thể hiện ὑμῶν ở số nhiều và cho thấy người hỏi liên hệ Phi-e-rơ với cả nhóm môn đồ.
- source_word: οὐ τελεῖ
  choice: không nộp ... sao?
  rationale: Trong ngữ cảnh nghĩa là nộp một khoản phải đóng. Câu hỏi phủ định được giữ nguyên, không diễn giải ngầm rằng người hỏi mong đợi câu trả lời khẳng định.
theological_decisions:
- issue: Bản chất của khoản δίδραχμα
  choice: Gọi là “thuế hai đơ-rắc-ma” trong chính văn và xác định là thuế đền thờ trong chú thích
  alternative: Chỉ dịch là “hai đồng đơ-rắc-ma” hoặc “tiền hai đơ-rắc-ma”
  rationale: Ngữ cảnh nói về việc nộp một khoản bắt buộc, nên “thuế” truyền đạt đúng chức năng. Tuy nhiên, nguyên văn chỉ nói “những đồng/khoản hai đơ-rắc-ma”; chú thích phân biệt phần diễn giải văn hóa với từ ngữ bề mặt.
- issue: Sắc thái của câu hỏi phủ định οὐ τελεῖ
  choice: Giữ dạng “không ... sao?”
  alternative: Diễn giải thành “Thầy của các ông có nộp ... không?” hoặc “Thầy của các ông vẫn nộp ... chứ?”
  rationale: Dạng phủ định có thể hàm ý người hỏi mong câu trả lời khẳng định, nhưng không nên ép sắc thái ngữ dụng thành một kết luận rõ hơn nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “nộp thuế” thay vì “trả thuế” cho tự nhiên trong tiếng Việt; giữ đơn vị tiền cổ để bảo toàn bối cảnh lịch sử. Đại từ “các ông” phản ánh ὑμῶν số nhiều.
