  source_fidelity: Bản dịch truyền đạt đúng cấu trúc thời gian «Khi họ đến», địa điểm Ca-phác-na-um, việc những người thu khoản δίδραχμα đến gặp Phi-e-rơ, và câu hỏi phủ định về việc Thầy của họ có nộp khoản ấy không. «Thuế hai đơ-rắc-ma» là cách diễn đạt theo ngữ cảnh phù hợp cho τὰ δίδραχμα / τελεῖ, mà không làm mất hình thức câu hỏi phủ định của nguyên văn.
  naturalness: Tiếng Việt hiện đại, rõ ràng và có nhịp văn tự nhiên. «Đến gặp Phi-e-rơ» và «không nộp ... sao?» phù hợp với văn cảnh tường thuật và lời thoại. «Thầy của các ông» giữ được số nhiều của ὑμῶν, đồng thời vẫn tự nhiên.
  terminology: Ca-phác-na-um và Phi-e-rơ là các dạng phiên âm Kinh Thánh Việt ngữ quen dùng. «Đơ-rắc-ma» bảo lưu đơn vị tiền tệ cổ; chú thích giải thích đây là thuế đền thờ hai đơ-rắc-ma. Thuật ngữ «thuế» được ngữ cảnh hỗ trợ và không áp đặt diễn giải thần học.
