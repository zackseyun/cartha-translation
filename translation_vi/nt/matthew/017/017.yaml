id: MAT.17.17
reference: Matthew 17:17
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν· Ὦ γενεὰ ἄπιστος καὶ διεστραμμένη, ἕως πότε ⸂μεθ’ ὑμῶν ἔσομαι⸃; ἕως πότε ἀνέξομαι ὑμῶν; φέρετέ μοι αὐτὸν ὧδε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/017.yaml
  text: But Jesus answered[a], “O unbelieving and perverse generation[c][b], how long will I be with you? How long will I bear with you? Bring him here to me.”
translation:
  language: vi
  text: 'Nhưng Đức Giê-su đáp: “Hỡi thế hệ không tin[a] và lệch lạc[b]! Ta sẽ còn ở với các người đến bao giờ? Ta sẽ còn chịu đựng các người đến bao giờ? Hãy đem cậu bé đến đây cho Ta.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “không trung tín” hoặc “thiếu đức tin.” Từ Hy Lạp có thể nói đến sự không tin hoặc không trung tín.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “cong vẹo” hoặc “sa đọa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν
  choice: Nhưng Đức Giê-su đáp
  rationale: Lược bỏ thành ngữ lặp nghĩa ‘đáp và nói’ để câu tiếng Việt tự nhiên; δέ được dịch là ‘nhưng’ nhằm giữ bước chuyển mang sắc thái đối lập trong lời quở trách.
- source_word: Ὦ γενεὰ
  choice: Hỡi thế hệ
  rationale: ‘Hỡi’ giữ sắc thái xưng gọi trang trọng và cảm thán của Ὦ; ‘thế hệ’ diễn đạt γενεά mà không thu hẹp đối tượng thành một nhóm cụ thể.
- source_word: ἄπιστος
  choice: không tin
  rationale: Trong ngữ cảnh thất bại vì thiếu đức tin, ‘không tin’ truyền đạt nghĩa trực tiếp nhất, đồng thời chú thích giữ lại khả năng hiểu là ‘không trung tín’.
- source_word: διεστραμμένη
  choice: lệch lạc
  rationale: Diễn tả tình trạng đã bị bóp méo về phương diện đạo đức mà vẫn tự nhiên, trang trọng trong tiếng Việt hiện đại.
- source_word: ἕως πότε μεθ’ ὑμῶν ἔσομαι
  choice: Ta sẽ còn ở với các người đến bao giờ?
  rationale: Giữ nguyên câu hỏi tu từ, thì tương lai và ý nghĩa ‘ở cùng’ của μετά; ‘các người’ phù hợp với lời quở trách hướng đến số nhiều.
- source_word: ἕως πότε ἀνέξομαι ὑμῶν
  choice: Ta sẽ còn chịu đựng các người đến bao giờ?
  rationale: ‘Chịu đựng’ giữ lực nghĩa của ἀνέχομαι và sắc thái bức xúc, nhưng không trở nên quá khẩu ngữ.
- source_word: φέρετέ μοι αὐτὸν ὧδε
  choice: Hãy đem cậu bé đến đây cho Ta
  rationale: Mệnh lệnh được giữ rõ ràng; đại từ giống đực được diễn đạt theo đối tượng đã biết trong ngữ cảnh là cậu bé để tiếng Việt tự nhiên và tránh đại từ thiếu trang trọng.
theological_decisions:
- issue: Sắc thái của ἄπιστος trong lời quở trách
  choice: không tin
  alternative: không trung tín; thiếu đức tin
  rationale: Ngữ cảnh gần nhấn mạnh sự thiếu đức tin, nhưng từ Hy Lạp cũng có thể mang nghĩa không trung tín; bản dịch chính không áp đặt ý niệm bất trung giao ước, còn chú thích bảo tồn khoảng nghĩa.
- issue: Phạm vi của γενεὰ
  choice: thế hệ
  alternative: những người này; dòng dõi
  rationale: Giữ cách gọi rộng và sức vang ngôn sứ của nguyên văn, không tự ý quyết định lời quở trách chỉ nhắm vào các môn đồ, đám đông hay toàn thể người đương thời.
- issue: Sắc thái của ἀνέξομαι
  choice: chịu đựng
  alternative: dung chịu; nhẫn nại với
  rationale: ‘Chịu đựng’ giữ sự căng thẳng và mệt mỏi trong câu hỏi tu từ, thay vì làm nhẹ lời quở trách thành sự nhẫn nại ôn hòa.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. ‘Ta’ giữ giọng uy quyền của Đức Giê-su trong lời quở trách; ‘các người’ thể hiện đối tượng số nhiều và sắc thái nghiêm khắc mà không dùng lối xưng hô quá cổ. Các dấu chú thích [a], [b] đều được đặt ngay sau từ ngữ liên quan trong chính văn.
