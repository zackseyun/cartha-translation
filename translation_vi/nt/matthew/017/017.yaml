  source_fidelity: 'Bản dịch truyền đạt đầy đủ các thành tố của SBLGNT: lời đáp của Đức Giê-su, tiếng gọi cảm thán, “thế hệ” số ít tập thể, hai tính từ mô tả, hai câu hỏi tu từ với sắc thái tương lai, và mệnh lệnh đem cậu bé đến với Người. “Không tin” giữ nghĩa trực tiếp của ἄπιστος; “chịu đựng” phản ánh thích đáng ἀνέξομαι; “cậu bé” được xác định đúng theo ngữ cảnh gần của αὐτόν.'
