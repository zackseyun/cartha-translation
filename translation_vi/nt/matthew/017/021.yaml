  text: Τοῦτο δὲ τὸ γένος οὐκ ἐκπορεύεται εἰ μὴ ἐν προσευχῇ καὶ νηστείᾳ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/021.yaml
  text: But[a] this kind does not come out except by prayer and fasting.
translation:
  language: vi
  text: Nhưng[a] loại này chỉ ra được nhờ cầu nguyện và kiêng ăn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Câu này không có trong các thủ bản Hy Lạp sớm nhất (gồm Sinaiticus và Vaticanus thuộc thế kỷ IV), cũng không có trong các bản dịch Syriac và Coptic thời kỳ đầu; tuy nhiên, câu này có trong phần lớn thủ bản thuộc truyền thống Byzantine, truyền thống La-tinh và đa số chứng liệu Syriac. Có khả năng những người chép sách đời sau đã thêm câu này để làm cho đoạn văn phù hợp với Mác 9:29.
    reason: textual_critical
lexical_decisions:
- source_word: γένος
  choice: loại
  rationale: Trong ngữ cảnh này, từ này chỉ một loại hay hạng quỷ; “loại” là cách diễn đạt tự nhiên và không xác định quá mức.
- source_word: ἐκπορεύεται
  choice: ra khỏi đó
  rationale: Động từ diễn tả việc quỷ ra khỏi người bị ám; thêm “khỏi đó” giúp câu tiếng Việt tự nhiên mà vẫn giữ hướng chuyển động của nguyên văn.
- source_word: εἰ μὴ
  choice: nếu không nhờ
  rationale: Cụm từ có nghĩa loại trừ, nêu phương cách duy nhất; cách dịch này nối tự nhiên với “cầu nguyện và kiêng ăn”.
- source_word: προσευχῇ καὶ νηστείᾳ
  choice: cầu nguyện và kiêng ăn
  rationale: Giữ nguyên cả hai phương thức trong bản Hy Lạp Byzantine; “kiêng ăn” là cách nói hiện đại, dễ hiểu của νηστεία.
theological_decisions:
- issue: “Loại này” ám chỉ điều gì
  choice: Giữ nguyên cách nói “loại này” mà không bổ sung “quỷ”.
  alternative: “Loại quỷ này”
  rationale: Ngữ cảnh cho thấy đối tượng là quỷ, nhưng danh từ “quỷ” không xuất hiện trong câu Hy Lạp; giữ lối nói hàm ẩn bảo toàn cách diễn đạt của nguyên văn.
- issue: Vai trò của cầu nguyện và kiêng ăn
  choice: Dịch như phương cách được nêu trong câu, không giải thích cơ chế hay hiệu lực thần học.
  alternative: Diễn giải rằng đây là điều kiện tuyệt đối để trừ quỷ.
  rationale: Nguyên văn nêu sự loại trừ bằng εἰ μὴ nhưng không trình bày một học thuyết rộng hơn; bản dịch không nên bổ sung kết luận giáo phái.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “kiêng ăn” thay cho thuật ngữ cổ hơn; giữ cấu trúc ngắn gọn và dấu chú thích [a] ngay sau từ mở đầu như lớp tham khảo tiếng Anh.
