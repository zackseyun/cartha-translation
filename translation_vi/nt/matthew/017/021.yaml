  source_fidelity: 'Bản dịch giữ được nghĩa chính của câu Byzantine: “loại này,” sự loại trừ của εἰ μὴ, và hai yếu tố “cầu nguyện và kiêng ăn.” Tuy nhiên, “ra khỏi đó” thêm yếu tố chỉ nơi chốn (“đó”) không có trong tiếng Hy Lạp và không rõ đối tượng quy chiếu. Cấu trúc “chỉ ra được nhờ” diễn đạt tự nhiên hơn trong tiếng Việt, đồng thời vẫn truyền đạt đúng ý “không ra ngoài trừ khi nhờ.”'
