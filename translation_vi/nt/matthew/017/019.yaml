revisions:
- from: 'Bấy giờ, các môn đồ đến riêng với Đức Chúa Jêsus và nói: “Tại sao chúng con không thể đuổi nó[a] ra được?”'
  to: 'Bấy giờ, các môn đệ đến gặp Chúa Giê-su riêng và nói: “Tại sao chúng tôi không thể đuổi nó[a] ra được?”'
  rationale: Bản sửa làm câu tiếng Việt tự nhiên hơn, dùng chính tả và thuật ngữ hiện đại, không thêm tước hiệu không có trong nguyên văn, và thay đại từ xưng hô mang tính diễn giải bằng cách xưng hô trung tính. “Nó” cùng chú thích tiếp tục phản ánh cách hiểu có khả năng hơn là chỉ quỷ, nhưng vẫn bảo tồn khả năng αὐτό chỉ đứa trẻ.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T05:40:28Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản thảo truyền đạt đúng trình tự và nội dung câu Hy Lạp: các môn đệ đến gặp Chúa Giê-su riêng và hỏi lý do họ không thể đuổi đối tượng ấy ra. Tuy nhiên, “chúng con” thêm sắc thái tự hạ mình/quan hệ thầy-trò mà đại từ ἡμεῖς không nêu rõ; “chúng tôi” giữ ngôi thứ nhất số nhiều và sự nhấn mạnh một cách trung tính hơn. Bản dịch vẫn cần chú thích để bảo tồn quy chiếu chưa tuyệt đối chắc chắn của αὐτό.'
  naturalness: “Đến riêng với” không tự nhiên trong tiếng Việt hiện đại. “Đến gặp ... riêng” diễn đạt rõ và tự nhiên hơn. “Giê-su” là dạng chính tả hiện hành, phổ thông hơn “Jêsus”; “môn đệ” cũng là từ hiện đại, trung tính và phù hợp với μαθηταί.
  terminology: Không nên thêm tước hiệu “Đức Chúa” vào tên Ἰησοῦ, vì nguyên văn chỉ có tên riêng. Dùng “Chúa Giê-su” trong lời trần thuật là cách gọi kính trọng tự nhiên trong văn phong Kinh Thánh tiếng Việt, đồng thời tránh dạng “Đức Chúa Jêsus” mang tính truyền thống giáo phái/không thống nhất với chính tả hiện hành. “Đuổi ... ra” giữ đúng trường nghĩa ἐκβαλεῖν trong ngữ cảnh trừ quỷ. Chú thích cần nói rõ đây là khả năng quy chiếu của đại từ, không khẳng định quá mức.
  issues:
  - severity: medium
    issue: “Đến riêng với Đức Chúa Jêsus” là cấu trúc không tự nhiên; đồng thời “Đức Chúa” không có trong nguyên văn.
    rationale: κατ’ ἰδίαν bổ nghĩa cho việc các môn đệ đến gặp Đức Giê-su một cách riêng tư. Cụm “đến gặp Chúa Giê-su riêng” phản ánh chức năng này rõ hơn. Nguyên văn τῷ Ἰησοῦ chỉ nêu tên Giê-su, nên không nên thêm “Đức Chúa” như một phần của tên.
  - severity: medium
    issue: “Chúng con” diễn giải quan hệ xã hội-tôn giáo vượt quá đại từ ἡμεῖς.
    rationale: Dù cách xưng hô này có thể phù hợp trong một số truyền thống, tiếng Hy Lạp chỉ nói “chúng tôi/chúng ta” với sự nhấn mạnh. “Chúng tôi” là lựa chọn hiện đại và trung tính hơn.
  - severity: low
    issue: Chính tả “Jêsus” và thuật ngữ “môn đồ” ít phù hợp hơn với tiếng Việt tiêu chuẩn hiện đại.
    rationale: “Giê-su” và “môn đệ” thông dụng, dễ hiểu, và ít bị gắn với một truyền thống dịch thuật riêng.
  revised_text: 'Bấy giờ, các môn đệ đến gặp Chúa Giê-su riêng và nói: “Tại sao chúng tôi không thể đuổi nó[a] ra được?”'
