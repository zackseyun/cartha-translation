id: MAT.17.19
reference: Matthew 17:19
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Τότε προσελθόντες οἱ μαθηταὶ τῷ Ἰησοῦ κατ’ ἰδίαν εἶπον· Διὰ τί ἡμεῖς οὐκ ἠδυνήθημεν ἐκβαλεῖν αὐτό;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/019.yaml
  text: Then the disciples came to Jesus privately and said[a], “Why were we not able to cast it out?”
translation:
  language: vi
  text: 'Bấy giờ, các môn đệ đến gặp Chúa Giê-su riêng và nói: “Tại sao chúng tôi không thể đuổi nó[a] ra được?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Đại từ này cũng có thể chỉ đứa trẻ, thay vì quỷ.
    reason: alternative_reading
lexical_decisions:
- source_word: Τότε
  choice: Bấy giờ
  rationale: Dấu nối thời gian đưa câu chuyện sang sự việc kế tiếp; cách nói tự nhiên, trang trọng vừa phải trong văn thuật chuyện.
- source_word: προσελθόντες
  choice: đến
  rationale: Phân từ bất định quá khứ được diễn đạt tự nhiên như một động từ hữu hạn đi cùng chủ ngữ; “đến” rõ nghĩa và không quá cứng.
- source_word: οἱ μαθηταὶ
  choice: các môn đồ
  rationale: Thuật ngữ quen thuộc trong ngữ cảnh Phúc Âm, chỉ những người theo học Đức Chúa Jêsus.
- source_word: τῷ Ἰησοῦ
  choice: với Đức Chúa Jêsus
  rationale: Tân ngữ gián tiếp của προσελθόντες; tên riêng được viết theo quy ước quen thuộc của bản dịch.
- source_word: κατ’ ἰδίαν
  choice: riêng
  rationale: Diễn đạt ngắn gọn ý ‘một cách riêng tư, không trước đám đông’; kết hợp tự nhiên trong cụm “đến riêng với”.
- source_word: εἶπον
  choice: nói
  rationale: Giữ nghĩa trực tiếp của λέγω dù lời tiếp theo mang hình thức câu hỏi.
- source_word: Διὰ τί
  choice: Tại sao
  rationale: Cách hỏi nguyên nhân tự nhiên và rõ ràng trong tiếng Việt hiện đại.
- source_word: ἡμεῖς
  choice: chúng con
  rationale: Đại từ ngôi thứ nhất số nhiều có sắc thái quan hệ phù hợp khi các môn đồ thưa với thầy mình; đại từ được nêu rõ cũng phần nào giữ sự nhấn mạnh của tiếng Hy Lạp.
- source_word: οὐκ ἠδυνήθημεν
  choice: không thể ... được
  rationale: Diễn đạt trực tiếp sự bất lực trong lần hành động đã được nhắc đến, đồng thời tự nhiên trong câu hỏi tiếng Việt.
- source_word: ἐκβαλεῖν
  choice: đuổi ... ra
  rationale: Giữ nghĩa trục xuất trong bối cảnh trừ quỷ và là cách nói tự nhiên hơn “ném ra” trong tiếng Việt.
- source_word: αὐτό
  choice: nó
  rationale: Đại từ trung tính số ít nhiều khả năng chỉ quỷ trong ngữ cảnh; tiếng Việt dùng “nó” tự nhiên nhưng vẫn có thể quy chiếu đến đứa trẻ, nên sự mơ hồ được ghi nhận trong chú thích.
theological_decisions:
- issue: Đối tượng quy chiếu của αὐτό trong bối cảnh trừ quỷ
  choice: Dịch là “nó”, với cách hiểu có khả năng hơn là chỉ quỷ.
  alternative: Đại từ có thể chỉ đứa trẻ bị quỷ ám.
  rationale: Ngữ cảnh trực tiếp nói đến việc đuổi quỷ, và ἐκβάλλω thường nhận quỷ làm đối tượng trong các trình thuật trừ quỷ. Tuy nhiên, vì αὐτό cũng phù hợp về giống ngữ pháp với παιδίον, chú thích bảo tồn khả năng đại từ chỉ đứa trẻ.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng và dễ hiểu. Dùng “môn đồ” và “Đức Chúa Jêsus” theo lối văn Kinh Thánh quen thuộc; cấu trúc câu giữ sát trình tự của nguyên văn nhưng vẫn tự nhiên.
