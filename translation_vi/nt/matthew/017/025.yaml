id: MAT.17.25
reference: Matthew 17:25
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: λέγει· Ναί. καὶ ⸀ἐλθόντα εἰς τὴν οἰκίαν προέφθασεν αὐτὸν ὁ Ἰησοῦς λέγων· Τί σοι δοκεῖ, Σίμων; οἱ βασιλεῖς τῆς γῆς ἀπὸ τίνων λαμβάνουσιν τέλη ἢ κῆνσον; ἀπὸ τῶν υἱῶν αὐτῶν ἢ ἀπὸ τῶν ἀλλοτρίων;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/025.yaml
  text: He said[a], “Yes.” And when he came into the house, Jesus spoke to him first, saying, “What do you think[b], Simon? From whom do the kings of the earth collect duties or poll tax—from their own sons or from others?”
translation:
  language: vi
  text: 'Ông đáp: “Vâng.” Khi Phi-e-rơ vào nhà, Đức Chúa Giê-su lên tiếng trước: “Si-môn, con nghĩ sao? Các vua thế gian thu thuế quan hay thuế thân[a] từ ai—từ các con trai của họ hay từ người ngoài[b]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “thuế hải quan hay thuế cống nạp.” Tiếng Hy Lạp phân biệt τέλη (các khoản thuế quan, thuế gián thu hoặc lệ phí) với κῆνσος (thuế thân hoặc thuế cống nạp).'
    reason: lexical_alternative
  - marker: b
    text: Hay “những người không thuộc về họ.” Từ Hy Lạp ἀλλότριοι ở đây chỉ những người không thuộc gia đình nhà vua, tức người ngoài.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ναί
  choice: Vâng
  rationale: Lời đáp khẳng định đơn giản; “Vâng” tự nhiên và phù hợp với lời thoại kính trọng trong tiếng Việt hiện đại.
- source_word: ἐλθόντα εἰς τὴν οἰκίαν
  choice: Khi Phi-e-rơ vào nhà
  rationale: Phân từ đối cách chỉ Phi-e-rơ, là đối tượng được ngầm hiểu của προέφθασεν; chuyển thành mệnh đề thời gian giúp câu tiếng Việt rõ và tự nhiên.
- source_word: προέφθασεν αὐτὸν ὁ Ἰησοῦς λέγων
  choice: Đức Chúa Giê-su lên tiếng trước
  rationale: Diễn đạt việc Đức Chúa Giê-su chủ động nói trước khi Phi-e-rơ kịp trình bày, đồng thời tránh lối dịch từng chữ khó hiểu.
- source_word: Τί σοι δοκεῖ
  choice: con nghĩ sao?
  rationale: Cách hỏi tự nhiên bằng tiếng Việt để xin nhận định của Si-môn; đại từ “con” phù hợp quan hệ thầy-trò trong văn cảnh.
- source_word: οἱ βασιλεῖς τῆς γῆς
  choice: các vua thế gian
  rationale: Giữ nghĩa rộng của γῆ và tạo sự đối chiếu tự nhiên với quyền cai trị trên đất, không thu hẹp thành một xứ cụ thể.
- source_word: τέλη
  choice: thuế quan
  rationale: Chỉ các khoản thuế gián thu, thuế hải quan hoặc lệ phí; “thuế quan” phân biệt tương đối rõ với κῆνσον.
- source_word: κῆνσον
  choice: thuế thân
  rationale: Chỉ loại thuế đánh trên mỗi cá nhân, đồng thời giữ sự phân biệt với τέλη.
- source_word: υἱῶν αὐτῶν
  choice: các con trai của họ
  rationale: Giữ nghĩa cụ thể “con trai” và hình ảnh gia đình vốn chuẩn bị cho hàm ý thần học ở câu kế tiếp.
- source_word: ἀλλοτρίων
  choice: người ngoài
  rationale: Chỉ những người không thuộc gia đình nhà vua; tự nhiên hơn “người xa lạ” và không nhất thiết giới hạn vào người ngoại quốc.
theological_decisions:
- issue: Hàm ý thần học của “các con trai” trong phép so sánh
  choice: Giữ nguyên ngôn ngữ gia đình “các con trai của họ”, không giải thích thêm trong chính văn.
  alternative: các con của họ; thần dân của họ
  rationale: Lời ví von trực tiếp nói đến việc con trai của vua được miễn thuế và chuẩn bị cho kết luận thần học ở câu sau. Giữ “con trai” bảo toàn mạch kể cùng sức căng hàm ý mà không áp đặt cách giải nghĩa.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Phi-e-rơ” để làm rõ chủ thể ngầm của phân từ Hy Lạp. Hai dấu chú thích [a], [b] đều được đặt ngay sau các từ ngữ liên quan trong chính văn.
