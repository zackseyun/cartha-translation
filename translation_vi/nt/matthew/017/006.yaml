  yaml_path: translation/nt/matthew/017/006.yaml
  text: And when the disciples heard it[c][b][a], they fell on their faces and were greatly afraid.
translation:
  language: vi
  text: Khi các môn đồ nghe tiếng ấy[a], họ ngã sấp mặt xuống[b] và hết sức sợ hãi[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Sau khi nghe” hoặc “Đã nghe”. Phân từ Hy Lạp có thể được diễn đạt bằng một mệnh đề chỉ thời gian. “Tiếng ấy” chỉ tiếng phán trong câu trước.'
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn theo thành ngữ: “ngã trên mặt họ”; nghĩa là ngã phủ phục, mặt hướng xuống.'
    reason: lexical_alternative
  - marker: c
    text: Trạng từ Hy Lạp nhấn mạnh rằng họ sợ hãi ở mức độ rất lớn.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσαντες
  choice: Khi nghe tiếng ấy
  rationale: Phân từ bất định quá khứ diễn tả hoàn cảnh thời gian, được chuyển thành mệnh đề “khi nghe” cho tự nhiên trong tiếng Việt. Tân ngữ được hiểu theo ngữ cảnh là tiếng phán từ đám mây ở câu trước; “tiếng ấy” làm rõ liên kết mà không giải thích quá mức.
- source_word: οἱ μαθηταὶ
  choice: các môn đồ
  rationale: Cách gọi quen thuộc, trang trọng nhưng vẫn dễ hiểu đối với những người theo học Chúa Giê-su trong các sách Tin Mừng.
- source_word: ἔπεσαν ἐπὶ πρόσωπον αὐτῶν
  choice: sấp mặt xuống
  rationale: Diễn đạt tự nhiên tư thế ngã phủ phục với mặt hướng xuống. Không thêm ý rằng họ chủ động quỳ lạy hay thờ phượng, vì động từ chỉ nói họ ngã xuống.
- source_word: ἐφοβήθησαν
  choice: sợ hãi
  rationale: Truyền đạt trực tiếp phản ứng sợ hãi, không quyết định đó chỉ là kinh hãi hay lòng kính sợ.
- source_word: σφόδρα
  choice: vô cùng
  rationale: Giữ mức độ nhấn mạnh mạnh của trạng từ σφόδρα bằng một cách nói tự nhiên, trang trọng trong tiếng Việt hiện đại.
theological_decisions:
- issue: Bản chất phản ứng của các môn đồ trước tiếng phán thần thượng
  choice: Giữ cả tư thế phủ phục và nỗi sợ hãi mãnh liệt mà không gọi rõ đó là thờ phượng, kinh hoàng hay kính sợ.
  alternative: Có thể hiểu phản ứng chủ yếu là sự thờ phượng đầy kính reverence, hoặc chủ yếu là nỗi kinh hoàng trước sự hiển hiện thần thượng.
  rationale: Bản Hy Lạp thuật lại tư thế thân thể và nỗi sợ nhưng không gắn cho phản ứng ấy một nhãn thần học cụ thể; bản dịch bảo toàn sự căng thẳng này.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng và dễ hiểu. Dùng “môn đồ” để giữ sắc thái Kinh Thánh quen thuộc; câu văn ngắn, có nhịp kể tự nhiên. Các chú thích giải thích cấu trúc và sắc thái từ vựng nhưng không áp đặt cách hiểu giáo phái.
