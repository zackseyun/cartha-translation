id: MAT.17.1
reference: Matthew 17:1
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Καὶ μεθ’ ἡμέρας ἓξ παραλαμβάνει ὁ Ἰησοῦς τὸν Πέτρον καὶ Ἰάκωβον καὶ Ἰωάννην τὸν ἀδελφὸν αὐτοῦ, καὶ ἀναφέρει αὐτοὺς εἰς ὄρος ὑψηλὸν κατ’ ἰδίαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/001.yaml
  text: And after six days Jesus takes Peter[a], James, and John his brother[c][b], and leads them up onto a high mountain by themselves.
translation:
  language: vi
  text: Sáu ngày sau, Đức Giê-su đưa Phi-e-rơ, Gia-cơ và Giăng, người anh em của Gia-cơ, đi cùng, rồi dẫn riêng họ lên một ngọn núi cao.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μεθ’ ἡμέρας ἓξ
  choice: Sáu ngày sau
  rationale: Diễn đạt tự nhiên thành ngữ chỉ thời gian với μετά và đối cách, đồng thời giữ rõ khoảng thời gian sáu ngày và mối nối với trình thuật trước.
- source_word: παραλαμβάνει
  choice: đưa ... đi cùng
  rationale: παραλαμβάνω ở đây có nghĩa đem hoặc đưa người khác theo cùng mình. Cách dịch này rõ nghĩa trong tiếng Việt và tránh hiểu đơn thuần là cầm lấy.
- source_word: Πέτρον καὶ Ἰάκωβον καὶ Ἰωάννην
  choice: Phi-e-rơ, Gia-cơ và Giăng
  rationale: Dùng các dạng tên riêng quen thuộc trong truyền thống Kinh Thánh tiếng Việt, theo lối phiên âm.
- source_word: τὸν ἀδελφὸν αὐτοῦ
  choice: Giăng là em trai của ông
  rationale: Cụm đồng vị bổ nghĩa cho Giăng; đại từ αὐτοῦ tự nhiên nhất quy chiếu về Gia-cơ. Tiếng Hy Lạp chỉ nói 'anh/em trai', nhưng ngữ cảnh gia đình được diễn đạt tự nhiên bằng 'em trai' theo cách gọi quen thuộc; chú thích bảo lưu nghĩa không xác định tuổi.
- source_word: ἀναφέρει
  choice: dẫn ... lên
  rationale: Thể hiện cả việc hướng dẫn và chuyển động đi lên, phù hợp với đích đến là núi, đồng thời tránh lặp lại động từ 'đưa'.
- source_word: εἰς ὄρος ὑψηλὸν
  choice: lên một ngọn núi cao
  rationale: εἰς diễn tả hướng và đích đến; tiếng Việt tự nhiên dùng 'lên' khi đi tới núi.
- source_word: κατ’ ἰδίαν
  choice: dẫn riêng họ
  rationale: Diễn đạt việc tách Đức Giê-su và ba môn đồ khỏi những người khác. Vị trí trước cụm đích đến giúp câu tiếng Việt tự nhiên mà vẫn giữ nghĩa 'riêng ra'.
theological_decisions:
- issue: Thì hiện tại lịch sử trong trình thuật
  choice: Dùng thì quá khứ hàm ẩn theo lối kể chuyện tự nhiên của tiếng Việt, không thêm dấu hiệu thời quá khứ vào động từ
  alternative: Dùng cấu trúc hiện tại sống động kiểu 'Đức Giê-su đưa... rồi dẫn...' được hiểu như hiện tại lịch sử
  rationale: Tiếng Việt không biến đổi động từ theo thì; cụm thời gian 'Sáu ngày sau' định vị diễn biến trong mạch kể. Vì vậy bản dịch giữ được tính trực tiếp của nguyên văn mà không cần thêm 'đã', vốn có thể làm câu nặng và nhấn mạnh thể hoàn thành không có trong tiếng Hy Lạp.
- issue: Quan hệ của τὸν ἀδελφὸν αὐτοῦ
  choice: Hiểu Giăng là anh/em trai của Gia-cơ
  alternative: 'Giữ đại từ hoàn toàn mơ hồ: ''Giăng, anh/em trai của ông ấy'''
  rationale: Cấu trúc đồng vị và ngữ cảnh nhận diện Giăng tự nhiên quy chiếu αὐτοῦ về Gia-cơ. Tuy nhiên, nguyên văn không xác định người anh hay em, nên có chú thích để tránh đặt thông tin tuổi tác vào câu.
translation_notes:
  register: 'Văn phong hiện đại, trang trọng và dễ hiểu. Dùng ''Đức Giê-su'' cùng các tên Phi-e-rơ, Gia-cơ, Giăng theo dạng quen thuộc trong tiếng Việt. Câu được sắp xếp lại nhẹ cho tự nhiên, nhưng giữ đủ trình tự: sáu ngày sau, Đức Giê-su đưa ba môn đồ theo, tách riêng họ và dẫn lên núi cao.'
