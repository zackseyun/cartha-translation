source:
  edition: SBLGNT
  text: καὶ ἐπετίμησεν αὐτῷ ὁ Ἰησοῦς, καὶ ἐξῆλθεν ἀπ’ αὐτοῦ τὸ δαιμόνιον· καὶ ἐθεραπεύθη ὁ παῖς ἀπὸ τῆς ὥρας ἐκείνης.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/018.yaml
  text: And Jesus rebuked it[a], and the demon came out of him; and the boy was healed from that hour.
translation:
  language: vi
  text: Đức Giê-su quở trách nó, quỷ ra khỏi cậu bé; và từ giờ đó, cậu bé được chữa lành.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπετίμησεν
  choice: quở trách
  rationale: Diễn đạt sắc thái khiển trách mạnh và lời phán đầy thẩm quyền trong ngữ cảnh trừ quỷ, không thu hẹp nghĩa thành chỉ 'ra lệnh'.
- source_word: αὐτῷ
  choice: nó
  rationale: Đại từ chỉ đối tượng bị quở trách; mạch văn kế tiếp cho thấy đối tượng hợp lý nhất là quỷ. 'Nó' tự nhiên trong tiếng Việt và tránh khiến người đọc hiểu rằng Đức Giê-su quở trách cậu bé.
- source_word: τὸ δαιμόνιον
  choice: quỷ
  rationale: Cách dịch trực tiếp, thông dụng của δαιμόνιον; không đưa thêm ý 'ô uế' vốn không có trong câu.
- source_word: ἐξῆλθεν ἀπ’ αὐτοῦ
  choice: ra khỏi cậu bé
  rationale: Giữ hình ảnh trừ quỷ của nguyên văn; nói rõ sở chỉ của đại từ để câu tiếng Việt tự nhiên và không gây nhập nhằng với 'nó' ở vế trước.
- source_word: ἐθεραπεύθη
  choice: được chữa lành
  rationale: Phản ánh thể bị động và kết quả chữa lành, không giới hạn vào một cách hiểu thuần túy y khoa.
- source_word: ὁ παῖς
  choice: cậu bé
  rationale: Trong bối cảnh người cha đưa con trai mình đến, nghĩa 'cậu bé' phù hợp hơn 'đứa trẻ' và loại trừ nghĩa 'đầy tớ' không thích hợp ở đây.
- source_word: ἀπὸ τῆς ὥρας ἐκείνης
  choice: ngay từ giờ ấy
  rationale: Bảo lưu thành ngữ thời gian sát với nguyên văn, đồng thời 'ngay' làm rõ hiệu lực bắt đầu tức thì mà giới từ ἀπό cùng ngữ cảnh biểu thị.
theological_decisions:
- issue: Sở chỉ của αὐτῷ trong hành động quở trách
  choice: Đức Giê-su quở trách quỷ, diễn đạt bằng 'nó'
  alternative: Đức Giê-su quở trách cậu bé
  rationale: Vế ngay sau nói quỷ ra khỏi cậu bé, nên mạch văn nghiêng rõ về việc lời quở trách hướng đến quỷ. Bản dịch không gán lời quở trách cho cậu bé.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng 'Đức Giê-su' theo lối gọi tôn kính phổ biến; giữ nhịp kể súc tích của tiếng Hy Lạp. Không thêm chú thích vì các lựa chọn ngữ nghĩa có thể được thể hiện rõ, tự nhiên ngay trong chính văn.
