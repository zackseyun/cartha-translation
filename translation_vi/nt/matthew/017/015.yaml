id: MAT.17.15
reference: Matthew 17:15
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ λέγων· Κύριε, ἐλέησόν μου τὸν υἱόν, ὅτι σεληνιάζεται καὶ κακῶς ⸀πάσχει, πολλάκις γὰρ πίπτει εἰς τὸ πῦρ καὶ πολλάκις εἰς τὸ ὕδωρ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/015.yaml
  text: and saying[a], “Lord, have mercy on my son, because he is epileptic and suffers terribly; for he often falls into the fire and often into the water.”
translation:
  language: vi
  text: 'và thưa: “Lạy Chúa, xin thương xót con trai tôi, vì nó lên cơn co giật[a] và khổ sở lắm; bởi nó thường ngã vào lửa, cũng thường ngã xuống nước.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Theo nghĩa đen, từ Hy Lạp có nghĩa là “bị mặt trăng tác động.” Đây là một thành ngữ cổ chỉ tình trạng giống như co giật; cũng có thể dịch là “bị động kinh.”
    reason: Nêu nghĩa đen và phương án dịch truyền thống, đồng thời tránh biến thành ngữ cổ thành một chẩn đoán y khoa chắc chắn.
lexical_decisions:
- source_word: Κύριε
  choice: Lạy Chúa
  rationale: Dạng hô cách dùng để kính cẩn thưa với Đức Giê-su; “Lạy Chúa” vừa tự nhiên trong tiếng Việt vừa giữ sắc thái trang trọng của κύριος.
- source_word: ἐλέησόν μου τὸν υἱόν
  choice: xin thương xót con trai tôi
  rationale: Giữ lời khẩn cầu xin lòng thương xót và dịch υἱός cụ thể là “con trai”, không làm rộng nghĩa thành “con trẻ”.
- source_word: σεληνιάζεται
  choice: lên cơn co giật[a]
  rationale: Diễn đạt hiện tượng được quan sát mà không áp đặt chẩn đoán y khoa hiện đại hay khẳng định quan niệm nguyên nhân do mặt trăng; nghĩa đen và bối cảnh thành ngữ cổ được ghi ở chú thích.
- source_word: κακῶς πάσχει
  choice: khổ sở lắm
  rationale: Cách nói tự nhiên, dễ hiểu, truyền đạt mức độ đau khổ nghiêm trọng do κακῶς bổ nghĩa cho πάσχει.
- source_word: πολλάκις
  choice: thường
  rationale: Diễn đạt ngắn gọn ý xảy ra nhiều lần và phù hợp với cả hai vế song song.
- source_word: πίπτει εἰς τὸ πῦρ ... εἰς τὸ ὕδωρ
  choice: ngã vào lửa ... ngã xuống nước
  rationale: Giữ hai hình ảnh cụ thể và cấu trúc song song; “xuống nước” là cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: καὶ λέγων
  choice: và thưa
  rationale: Nối với diễn tiến của câu trước, đồng thời dùng “thưa” để thể hiện lời nói kính cẩn mà không tạo cấu trúc phân từ gượng gạo trong tiếng Việt.
theological_decisions:
- issue: Cách dịch σεληνιάζεται trong bối cảnh chữa lành và trừ quỷ
  choice: Dịch theo biểu hiện là “lên cơn co giật”
  alternative: “bị động kinh” hoặc dịch sát nghĩa là “bị mặt trăng tác động”
  rationale: Câu này thuật lại lời người cha mô tả tình trạng của con, chứ không đưa ra chẩn đoán y khoa hiện đại. Cách dịch đã chọn bảo toàn hiện tượng quan sát được và không tự quyết định nguyên nhân y khoa hay thuộc linh mà chính câu này chưa nêu.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Lời khẩn cầu dùng “Lạy Chúa, xin…”; đại từ “nó” giữ cách người cha nói về con mình mà không thêm quan hệ tuổi tác không có trong nguyên văn. Dấu chú thích [a] được đặt ngay sau cụm từ mà chú thích giải thích.
