  text: καὶ ⸂προσῆλθεν ὁ Ἰησοῦς καὶ ἁψάμενος αὐτῶν⸃ εἶπεν· Ἐγέρθητε καὶ μὴ φοβεῖσθε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/007.yaml
  text: And Jesus came near and touched them and said[a], “Get up[c][b], and do not be afraid.”
translation:
  language: vi
  text: 'Đức Giê-su đến gần, chạm vào họ và nói: “Hãy đứng dậy, đừng sợ.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσῆλθεν
  choice: đến gần
  rationale: Động từ προσέρχομαι chỉ việc tiến đến hoặc lại gần một người; “đến gần” tự nhiên trong tiếng Việt và giữ rõ chuyển động của Đức Giê-su về phía các môn đồ.
- source_word: ἁψάμενος αὐτῶν
  choice: chạm vào họ
  rationale: Phân từ ἅπτω đi với sở hữu cách mang nghĩa “chạm vào.” Chuyển thành động từ nối tiếp giúp câu tiếng Việt tự nhiên mà không thêm chi tiết như đặt tay lên họ.
- source_word: εἶπεν
  choice: nói
  rationale: Đây là cách dịch trực tiếp, trung tính của λέγω, phù hợp với lời dẫn trực tiếp theo sau.
- source_word: Ἐγέρθητε
  choice: Hãy đứng dậy
  rationale: Trong ngữ cảnh các môn đồ đã ngã sấp mặt, mệnh lệnh này bảo họ đứng dậy. “Hãy đứng dậy” rõ nghĩa và trang trọng vừa phải; không hàm ý thần học về sự sống lại.
- source_word: μὴ φοβεῖσθε
  choice: đừng sợ
  rationale: Cụm này mang nghĩa “đừng sợ/đừng kinh hãi.” “Đừng sợ” là cách diễn đạt ngắn gọn, tự nhiên và mang đúng sắc thái trấn an, không ép thì hiện tại thành “hãy thôi sợ.”
- source_word: καὶ
  choice: và / lược nối tự nhiên
  rationale: Các liên từ καί nối chuỗi hành động. Tiếng Việt giữ “và” trước “nói,” còn quan hệ nối giữa các mệnh lệnh được thể hiện tự nhiên bằng dấu phẩy, không thêm sắc thái thời gian.
theological_decisions:
- issue: Diễn đạt mệnh lệnh trấn an của Đức Giê-su mà không thêm sắc thái mục vụ hoặc giáo lý
  choice: Hãy đứng dậy, đừng sợ
  alternative: Hãy trỗi dậy và đừng kinh hãi
  rationale: 'Bản dịch giữ nguyên hai mệnh lệnh trực tiếp: đứng lên khỏi tư thế ngã sấp và không sợ hãi. “Đứng dậy” tránh khả năng người đọc hiểu “trỗi dậy” theo nghĩa phục sinh trong ngữ cảnh này.'
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Giê-su” theo lối gọi kính trọng phổ biến; câu kể gọn, giữ thứ tự Đức Giê-su đến gần, chạm vào họ rồi phán lời trấn an.
