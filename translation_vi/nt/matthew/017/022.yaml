  terminology: '"Con Người" bảo toàn danh xưng cố định ὁ υἱὸς τοῦ ἀνθρώπου. "Bị nộp" giữ được tính bị động và độ mở của παραδίδοσθαι; chú thích "bị trao nộp" cung cấp phương án gần nghĩa mà không diễn giải thành "bị phản bội". Tên "Ga-li-lê" nhất quán với chính tả Kinh Thánh Việt ngữ.'
