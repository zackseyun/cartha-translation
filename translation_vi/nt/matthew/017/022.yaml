id: MAT.17.22
reference: Matthew 17:22
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸀Συστρεφομένων δὲ αὐτῶν ἐν τῇ Γαλιλαίᾳ εἶπεν αὐτοῖς ὁ Ἰησοῦς· Μέλλει ὁ υἱὸς τοῦ ἀνθρώπου παραδίδοσθαι εἰς χεῖρας ἀνθρώπων,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/022.yaml
  text: While they were gathering together in Galilee[a], Jesus said to them[c][b], “The Son of Man is about to be delivered into the hands of men,”
translation:
  language: vi
  text: 'Khi họ đang tụ họp[a] tại Ga-li-lê, Đức Giê-su nói với họ: “Con Người sắp bị nộp[b] vào tay người ta.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đang nhóm lại.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “bị trao nộp.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Συστρεφομένων δὲ αὐτῶν
  choice: Khi họ đang tụ họp
  rationale: Cụm phân từ sở hữu tuyệt đối nêu hoàn cảnh đồng thời. “Khi họ đang tụ họp” giữ được ý nghĩa tập thể của συστρέφω và diễn đạt tự nhiên trong tiếng Việt, không xác định quá mức việc họ di chuyển hay lưu lại.
- source_word: ἐν τῇ Γαλιλαίᾳ
  choice: tại Ga-li-lê
  rationale: Cụm giới từ chỉ địa điểm; “tại Ga-li-lê” rõ ràng và tự nhiên.
- source_word: εἶπεν αὐτοῖς
  choice: nói với họ
  rationale: Chuyển dịch trực tiếp cấu trúc λέγω với tân ngữ gián tiếp.
- source_word: Μέλλει
  choice: sắp
  rationale: Diễn đạt hành động sắp xảy đến, giữ sắc thái cận kề mà không thêm ý tiền định.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Con Người
  rationale: Cách dịch đã được xác lập trong tiếng Việt cho danh xưng của Đức Giê-su, bảo toàn âm hưởng liên văn bản và thần học của cụm Hy Lạp.
- source_word: παραδίδοσθαι
  choice: bị nộp
  rationale: Giữ thể bị động và nghĩa rộng của việc bị trao vào quyền người khác, không thu hẹp thành riêng hành vi phản bội hay thủ tục tư pháp.
- source_word: εἰς χεῖρας ἀνθρώπων
  choice: vào tay người ta
  rationale: Giữ hình ảnh “vào tay” của nguyên văn; “người ta” chỉ các tác nhân con người một cách tự nhiên và vẫn duy trì sự đối chiếu giàu ý nghĩa với “Con Người”.
theological_decisions:
- issue: Cách dịch ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Con Người
  alternative: Đấng mang thân phận người
  rationale: “Con Người” gần với cấu trúc Hy Lạp, quen thuộc trong truyền thống Kinh Thánh tiếng Việt và giữ được liên hệ thần học; phương án thay thế mang tính diễn giải quá mức.
- issue: Sắc thái của παραδίδοσθαι trong lời báo trước cuộc thương khó
  choice: bị nộp
  alternative: bị trao nộp; bị phản bội
  rationale: “Bị nộp” giữ nguyên thể bị động và không quyết định thay cho độc giả tác nhân hay tầng ý nghĩa thần học. “Bị phản bội” thu hẹp nghĩa vào một hành vi cụ thể.
- issue: Cách hiểu ἀνθρώπων trong thế đối chiếu với Con Người
  choice: người ta
  alternative: những người đàn ông; loài người
  rationale: Danh từ Hy Lạp số nhiều có thể nói chung về con người. “Người ta” tự nhiên trong thành ngữ tiếng Việt “vào tay người ta” và không thêm sự xác định về giới tính mà ngữ cảnh không đòi hỏi.
translation_notes:
  register: Văn phong hiện đại, trang trọng nhưng dễ hiểu. Dùng “Đức Giê-su” theo lối gọi tôn kính thông dụng; giữ danh xưng “Con Người” và hình ảnh “vào tay” để bảo toàn sắc thái Kinh Thánh của nguyên văn.
