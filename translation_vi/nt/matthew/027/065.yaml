revisions:
- from: 'Phi-lát nói với họ[a]: “Các ông có một đội lính canh. Hãy đi, canh giữ nơi ấy cho chắc chắn theo cách các ông biết[b].”'
  to: 'Phi-lát nói với họ: “Các ông có một đội lính canh[a]. Hãy đi, làm cho chắc chắn theo cách các ông biết làm[b].”'
  rationale: Bản sửa dùng “làm cho chắc chắn” để phản ánh đầy đủ hơn ἀσφαλίσασθε, đồng thời để tân ngữ hàm ẩn như nguyên văn thay vì xác định là “nơi ấy.” Cụm “theo cách các ông biết làm” tự nhiên hơn và vẫn bảo toàn mức độ không xác định của ὡς οἴδατε. Chú thích về cách hiểu khác của Ἔχετε κουστωδίαν được giữ nguyên nội dung và được đặt tại đúng điểm neo.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T07:38:40Z'
review_pass:
  verdict: revise
  source_fidelity: 'Cần sửa động từ “canh giữ”: ἀσφαλίσασθε nói rộng hơn về việc làm cho sự việc/địa điểm được an toàn, chắc chắn, không chỉ riêng hành vi đứng canh. Tân ngữ không được nêu trong tiếng Hy Lạp; vì vậy không nên thêm “nơi ấy” vào chính văn. Cách hiểu mơ hồ của Ἔχετε κουστωδίαν được giữ lại.'
  naturalness: “Hãy đi, làm cho chắc chắn theo cách các ông biết làm” là tiếng Việt hiện đại, rõ ràng trong ngữ cảnh, và giữ được tân ngữ hàm ẩn của nguyên văn. Chuyển dấu chú thích a đến ngay sau “đội lính canh” giúp neo chú thích đúng cụm từ đang được bàn đến.
  terminology: “Phi-lát,” “các ông,” và “đội lính canh” phù hợp văn phong trang trọng vừa phải. Không có lý do để xác định đây là lính La Mã hay lực lượng riêng của các lãnh đạo Do Thái.
  issues:
  - severity: medium
    issue: “canh giữ nơi ấy” thu hẹp và bổ sung nghĩa
    rationale: ἀσφαλίζω có nghĩa làm cho an toàn/chắc chắn; hành động có thể bao gồm niêm phong và bố trí canh gác. “Canh giữ” chỉ một phương diện, còn “nơi ấy” là tân ngữ được thêm vào mà câu Hy Lạp không nêu.
  - severity: low
    issue: Neo chú thích a không đúng vị trí
    rationale: Chú thích a giải thích Ἔχετε κουστωδίαν, nhưng hiện đang gắn với “họ”; nên đặt sau “đội lính canh”.
  - severity: low
    issue: “theo cách các ông biết” chưa trọn thành ngữ tiếng Việt
    rationale: Thêm “làm” diễn đạt tự nhiên hơn sắc thái “as you know how” của ὡς οἴδατε mà không biến thành “hết sức” hay “tốt nhất có thể.”
