  text: ⸀ἔφη αὐτοῖς ὁ Πιλᾶτος· Ἔχετε κουστωδίαν· ὑπάγετε ἀσφαλίσασθε ὡς οἴδατε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/065.yaml
  text: Pilate said to them[a], “You have a guard. Go[b], make it secure as you know how.”
translation:
  language: vi
  text: 'Phi-lát nói với họ: “Các ông có một đội lính canh[a]. Hãy đi, làm cho chắc chắn theo cách các ông biết làm[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Hãy nhận lấy một đội lính canh,” hoặc: “Các ông đã có đội lính canh riêng.” Tiếng Hy Lạp có thể được hiểu là Phi-lát cấp lính cho họ hoặc nhắc đến lực lượng canh gác họ đã có sẵn.'
    reason: alternative_reading
  - marker: b
    text: 'Hoặc: “hãy làm cho việc ấy được chắc chắn theo cách các ông biết làm.”'
    reason: previous_rendering
lexical_decisions:
- source_word: ἔφη
  choice: nói
  rationale: Động từ tường thuật lời nói thông dụng; “nói” tự nhiên và sát nghĩa trong văn kể chuyện.
- source_word: αὐτοῖς
  choice: với họ
  rationale: Đại từ số nhiều ở cách tặng chỉ những người được Phi-lát nói với.
- source_word: Ἔχετε
  choice: Các ông có
  rationale: Giữ nghĩa trực tiếp của dạng hiện tại ἔχω, đồng thời không quyết đoán liệu Phi-lát đang cấp lính hay nhắc đến lực lượng họ đã có.
- source_word: κουστωδίαν
  choice: một đội lính canh
  rationale: Từ vay mượn tiếng La-tinh custodia chỉ một toán hoặc đơn vị làm nhiệm vụ canh gác; “đội lính canh” rõ nghĩa trong tiếng Việt hiện đại.
- source_word: ὑπάγετε
  choice: Hãy đi
  rationale: Mệnh lệnh yêu cầu rời đi; cách dịch ngắn gọn, tự nhiên.
- source_word: ἀσφαλίσασθε
  choice: canh giữ nơi ấy cho chắc chắn
  rationale: Diễn đạt hành động làm cho nơi đó được bảo vệ chắc chắn; “nơi ấy” làm rõ tân ngữ ngầm từ văn cảnh mà không lặp lại “ngôi mộ” vốn không có trong câu Hy Lạp.
- source_word: ὡς οἴδατε
  choice: theo cách các ông biết
  rationale: Giữ sát thành ngữ Hy Lạp và không diễn giải quá mức thành “hết khả năng” hay “tốt nhất có thể”.
theological_decisions:
- issue: Ἔχετε κουστωδίαν có nghĩa Phi-lát cấp một đội lính La Mã hay nhắc đến lực lượng canh gác mà các lãnh đạo Do Thái đã có
  choice: Dịch trung tính trong chính văn là “Các ông có một đội lính canh”
  alternative: “Hãy nhận lấy một đội lính canh” hoặc “Các ông đã có đội lính canh riêng”
  rationale: Câu Hy Lạp có thể được hiểu như lời cho phép nhận lính hoặc như lời xác nhận rằng họ đã có lính. Chính văn giữ cách nói sát mặt chữ, còn chú thích bảo tồn các khả năng lịch sử khác nhau.
translation_notes:
  register: Văn phong trang trọng vừa phải, hiện đại và dễ hiểu. Dùng “các ông” phù hợp với lời Phi-lát nói với một nhóm nam giới có địa vị; giữ sự mơ hồ của câu nói về đội lính canh.
