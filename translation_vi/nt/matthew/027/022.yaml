source:
  edition: SBLGNT
  text: λέγει αὐτοῖς ὁ Πιλᾶτος· Τί οὖν ποιήσω Ἰησοῦν τὸν λεγόμενον χριστόν; ⸀λέγουσιν πάντες· Σταυρωθήτω.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/022.yaml
  text: Pilate said to them[a], “What then should I do with Jesus who is called Messiah?” They all said, “Let him be crucified.”
translation:
  language: vi
  text: 'Phi-lát nói với họ: “Vậy tôi phải làm gì với Giê-su, người được gọi là Đấng Mê-si-a[a]?” Tất cả đều đáp: “Hãy đóng đinh người ấy!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “Đấng Ki-tô.”
    reason: Nêu cách dịch truyền thống khác của tước hiệu χριστός.
lexical_decisions:
- source_word: Τί οὖν ποιήσω
  choice: Vậy ta phải làm gì
  rationale: Câu hỏi cân nhắc với động từ ở thể giả định aorist được diễn đạt tự nhiên bằng “ta phải làm gì”; “vậy” thể hiện chức năng suy luận của οὖν.
- source_word: Ἰησοῦν
  choice: Giê-su
  rationale: Dùng dạng phiên âm tên riêng đã quen thuộc trong tiếng Việt.
- source_word: τὸν λεγόμενον χριστόν
  choice: người được gọi là Đấng Mê-si
  rationale: Giữ cấu trúc bị động của λεγόμενον và dịch χριστός như một tước hiệu, qua đó bảo toàn bối cảnh kỳ vọng về Đấng được xức dầu.
- source_word: λέγουσιν πάντες
  choice: Tất cả đều đáp
  rationale: Chuyển hiện tại lịch sử sang cách kể quá khứ tự nhiên trong tiếng Việt; “tất cả đều” giữ sức nhấn mạnh tập thể của πάντες, còn “đáp” phù hợp với ngữ cảnh đối thoại.
- source_word: Σταυρωθήτω
  choice: Hãy đóng đinh hắn vào thập tự giá
  rationale: “Hãy” giữ lực mệnh lệnh; cách diễn đạt này tự nhiên trong tiếng Việt và truyền đạt rõ hình phạt đóng đinh, dù tiếng Việt khó giữ nguyên thể bị động ngôi thứ ba mà không trở nên gượng ép.
theological_decisions:
- issue: Cách dịch Χριστός
  choice: Đấng Mê-si
  alternative: Đấng Ki-tô
  rationale: Trong cụm này, χριστός hoạt động như một tước hiệu chứ không phải phần của tên riêng. “Đấng Mê-si” giữ rõ sắc thái kỳ vọng Do Thái; phương án truyền thống “Đấng Ki-tô” được ghi ở chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Phi-lát tự xưng “ta” phù hợp địa vị quan tổng trấn; đám đông gọi Chúa Giê-su là “hắn” để phản ánh thái độ thù nghịch trong lời hô kết án, không phải lời nhận định của người kể.
