  text: διὸ ἐκλήθη ὁ ἀγρὸς ἐκεῖνος Ἀγρὸς Αἵματος ἕως τῆς σήμερον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/008.yaml
  text: Therefore that field has been called Field of Blood to this day.
translation:
  language: vi
  text: Vì thế, cánh đồng ấy được gọi là Cánh Đồng Máu cho đến ngày nay.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὸ
  choice: Vì thế
  rationale: Diễn tả quan hệ suy luận-kết quả với lời giải thích ngay trước đó về việc mua và đặt tên cho cánh đồng; tự nhiên và rõ ràng trong tiếng Việt.
- source_word: ἐκλήθη
  choice: được gọi là
  rationale: Động từ aorist bị động của καλέω chỉ việc được gọi hoặc được đặt tên. Kết hợp với “cho đến ngày nay”, cách dịch này tự nhiên và cho thấy tên gọi vẫn được dùng.
- source_word: ὁ ἀγρὸς ἐκεῖνος
  choice: cánh đồng ấy
  rationale: ἀγρός ở đây là “cánh đồng”; đại từ chỉ định ἐκεῖνος được chuyển thành “ấy”. Cách dịch cũng giữ sự lặp lại với tên địa danh theo sau.
- source_word: Ἀγρὸς Αἵματος
  choice: Cánh Đồng Máu
  rationale: Giữ cấu trúc danh từ ἀγρός cùng sở hữu cách αἵματος trong một tên địa danh tự nhiên bằng tiếng Việt; viết hoa để thể hiện tên riêng.
- source_word: αἵματος
  choice: Máu
  rationale: Sở hữu cách số ít của αἷμα, nằm trong tên địa danh và chỉ “máu”.
- source_word: ἕως τῆς σήμερον
  choice: cho đến ngày nay
  rationale: Thành ngữ thời gian cho biết tên gọi vẫn tồn tại tới thời điểm tác giả viết; đây là cách diễn đạt trang trọng, rõ nghĩa và tự nhiên.
