  rationale: Chỉnh nhẹ để câu tiếng Việt tự nhiên hơn, đồng thời phản ánh sát hơn quan hệ “đến gặp” trong πρὸς Πιλᾶτον. Bản sửa vẫn giữ sự dè dặt của nguyên văn về ý nghĩa lịch pháp chính xác của παρασκευή.
