  text: Τῇ δὲ ἐπαύριον, ἥτις ἐστὶν μετὰ τὴν παρασκευήν, συνήχθησαν οἱ ἀρχιερεῖς καὶ οἱ Φαρισαῖοι πρὸς Πιλᾶτον
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/062.yaml
  text: On the next day[a], which is after the day of Preparation, the chief priests and the Pharisees gathered before Pilate
translation:
  language: vi
  text: Ngày hôm sau[a], tức là sau ngày Chuẩn bị, các thượng tế và người Pha-ri-si tụ họp đến gặp Phi-lát.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Ngày hôm sau, tức là sau ngày Chuẩn bị.” Từ Hy Lạp có thể chỉ ngày chuẩn bị trước ngày Sa-bát; dịch là “thứ Sáu” sẽ mang tính diễn giải hơn mức cần thiết của nguyên văn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τῇ δὲ ἐπαύριον
  choice: Hôm sau
  rationale: Diễn đạt tự nhiên thành ngữ chỉ ngày kế tiếp; δέ chỉ nối nhẹ mạch kể nên không cần thêm một từ riêng.
- source_word: ἥτις ἐστὶν μετὰ τὴν παρασκευήν
  choice: tức là ngày sau ngày Chuẩn Bị
  rationale: ἥτις mở mệnh đề giải thích. Cách dịch này làm rõ quan hệ thời gian mà vẫn giữ cách gọi theo lịch Do Thái.
- source_word: παρασκευήν
  choice: ngày Chuẩn Bị
  rationale: Trong bối cảnh Do Thái, từ này thường chỉ ngày chuẩn bị trước ngày Sa-bát. Không dịch thẳng là “thứ Sáu” để tránh cụ thể hóa quá mức nguồn Hy Lạp.
- source_word: συνήχθησαν
  choice: tụ họp
  rationale: Thể bị động có nghĩa nội động trong câu này; “tụ họp” ngắn gọn và tự nhiên.
- source_word: οἱ ἀρχιερεῖς
  choice: các thượng tế
  rationale: Cách gọi quen thuộc dành cho giới lãnh đạo tư tế, không hàm ý có nhiều người đồng thời giữ chức thầy tế lễ thượng phẩm.
- source_word: οἱ Φαρισαῖοι
  choice: những người Pha-ri-si
  rationale: Phiên âm tên nhóm Do Thái, đồng thời dùng danh từ chỉ người để câu tiếng Việt rõ và tự nhiên.
- source_word: πρὸς Πιλᾶτον
  choice: trước mặt Phi-lát
  rationale: πρός với một người sau động từ tụ họp có thể chỉ việc đến gặp hoặc hiện diện trước người ấy; cách dịch này phù hợp bối cảnh chính trị-pháp lý mà không khẳng định thêm một sắc thái pháp đình.
- source_word: Πιλᾶτον
  choice: Phi-lát
  rationale: Phiên âm tiếng Việt thông dụng của tên Πιλᾶτος.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Viết hoa “Chuẩn Bị” để cho thấy đây là cách gọi một ngày theo lịch, đồng thời giữ nguyên độ mở của thuật ngữ Hy Lạp. Dấu chú thích [a] xuất hiện ngay sau cụm thời gian liên quan.
