id: MAT.27.6
reference: Matthew 27:6
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οἱ δὲ ἀρχιερεῖς λαβόντες τὰ ἀργύρια εἶπαν· Οὐκ ἔξεστιν βαλεῖν αὐτὰ εἰς τὸν κορβανᾶν, ἐπεὶ τιμὴ αἵματός ἐστιν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/006.yaml
  text: But the chief priests[a], taking the silver pieces, said, “It is not lawful to put them into the temple treasury[b], since they are the price of blood.”
translation:
  language: vi
  text: 'Nhưng các thượng tế lấy những đồng bạc ấy và nói: “Không được phép bỏ số bạc này vào kho bạc đền thờ[a], vì đó là giá của máu[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tiếng Hy Lạp là κορβανᾶν (korban), chỉ kho bạc hoặc ngân quỹ thánh của đền thờ.
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “tiền máu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀρχιερεῖς
  choice: các thượng tế
  rationale: Cách gọi tự nhiên và quen thuộc trong tiếng Việt dành cho các chức sắc tư tế đứng đầu; số nhiều của nguyên văn được giữ lại.
- source_word: λαβόντες
  choice: nhặt ... lên
  rationale: Trong ngữ cảnh gần, Giu-đa đã ném bạc vào đền thờ; vì vậy động tác ở đây tự nhiên là nhặt số bạc ấy lên, đồng thời vẫn phản ánh phân từ aorist chỉ hành động đi kèm trước lời nói.
- source_word: τὰ ἀργύρια
  choice: những đồng bạc ấy / số bạc này
  rationale: Giữ ý nghĩa tiền bằng bạc đã được nhắc đến, không xác định quá mức loại tiền; từ chỉ định giúp nối rõ với văn cảnh.
- source_word: Οὐκ ἔξεστιν
  choice: Không được phép
  rationale: Diễn đạt rõ sự không được cho phép theo luật lệ hoặc quy định tôn giáo, bằng tiếng Việt hiện đại tự nhiên.
- source_word: βαλεῖν
  choice: bỏ ... vào
  rationale: Trong ngữ cảnh đưa tiền vào kho, “bỏ vào” tự nhiên hơn nghĩa đen “ném vào” và không tạo sắc thái mạnh không cần thiết.
- source_word: κορβανᾶν
  choice: kho bạc đền thờ
  rationale: Truyền đạt trực tiếp nơi hoặc quỹ thiêng của đền thờ mà thuật ngữ vay mượn κορβανᾶν chỉ đến; chú thích bảo lưu thuật ngữ gốc.
- source_word: ἐπεὶ
  choice: vì
  rationale: Giới thiệu nguyên nhân của điều cấm một cách ngắn gọn và tự nhiên.
- source_word: τιμὴ αἵματός
  choice: giá của máu
  rationale: Giữ sát cấu trúc Hy Lạp và sự căng thẳng của cách nói, không tự động giải nghĩa thành tiền trả cho hành vi đổ máu.
theological_decisions:
- issue: Cách diễn đạt κορβανᾶν mà không che khuất bối cảnh thờ phượng
  choice: kho bạc đền thờ
  alternative: Cô-ban; ngân quỹ thánh
  rationale: Bản dịch nghĩa giúp độc giả hiện đại hiểu ngay đây là kho hoặc quỹ của đền thờ, còn chú thích giữ lại dạng thuật ngữ và sắc thái tiền dâng hiến.
- issue: Mức độ giải nghĩa cụm τιμὴ αἵματός
  choice: giá của máu
  alternative: tiền máu; giá trả cho việc đổ máu
  rationale: Cách dịch sát giữ được hình ảnh và tính hàm súc của nguyên văn; “tiền máu” được nêu ở chú thích như một cách hiểu thành ngữ, thay vì áp đặt trong chính văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “các thượng tế” theo lối gọi quen thuộc trong bản văn Kinh Thánh tiếng Việt; giữ “giá của máu” trong chính văn để bảo toàn hình ảnh nguyên ngữ và đưa cách nói thành ngữ vào chú thích.
