revisions:
- from: Khi bị các thầy tế lễ cả và các trưởng lão tố cáo, Đức Giê-su không đáp lại điều gì.[a]
  to: Trong khi bị các thượng tế và các trưởng lão tố cáo, Đức Giê-su không trả lời gì.[a]
  rationale: Bản sửa giữ nguyên nghĩa tường thuật và không thêm hàm ý thần học. “Trong khi” bảo toàn quan hệ thời gian đồng thời; “các thượng tế” và “không trả lời gì” cải thiện tính hiện đại, tự nhiên và nhất quán thuật ngữ.
  reviewer_model: gpt-5.6-terra
