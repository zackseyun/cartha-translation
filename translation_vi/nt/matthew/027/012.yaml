source:
  edition: SBLGNT
  text: καὶ ἐν τῷ κατηγορεῖσθαι αὐτὸν ὑπὸ τῶν ἀρχιερέων ⸀καὶ πρεσβυτέρων οὐδὲν ἀπεκρίνατο.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/012.yaml
  text: And while he was being accused by the chief priests and elders[a], he answered nothing.
translation:
  language: vi
  text: Trong khi bị các thượng tế và các trưởng lão tố cáo, Đức Giê-su không trả lời gì.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “Ngài không đáp gì cả.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τῷ κατηγορεῖσθαι
  choice: Khi bị ... tố cáo
  rationale: Cấu trúc ἐν với động từ nguyên mẫu có mạo từ diễn tả hoàn cảnh xảy ra đồng thời; “khi bị” tự nhiên trong tiếng Việt và vẫn giữ nghĩa bị động.
- source_word: κατηγορεῖσθαι
  choice: bị ... tố cáo
  rationale: Động từ bị động nói đến việc những lời cáo buộc được đưa ra chống lại Đức Giê-su; “tố cáo” phù hợp với bối cảnh xét xử.
- source_word: ὑπὸ τῶν ἀρχιερέων καὶ πρεσβυτέρων
  choice: các thầy tế lễ cả và các trưởng lão
  rationale: Trong các sách Phúc Âm, ἀρχιερεῖς chỉ giới lãnh đạo tư tế; cách gọi “các thầy tế lễ cả” vừa quen thuộc vừa phân biệt với vị thượng tế. “Các trưởng lão” là cách tương đương tự nhiên của πρεσβύτεροι.
- source_word: οὐδὲν
  choice: không ... điều gì
  rationale: Giữ trực tiếp ý nghĩa “không gì” của οὐδέν thay vì diễn giải thành một danh từ như “không đưa ra lời đáp”.
- source_word: ἀπεκρίνατο
  choice: đáp lại
  rationale: Động từ chỉ hành động trả lời; “đáp lại” tự nhiên khi nói đến phản ứng trước những lời tố cáo.
- source_word: καὶ
  choice: lược dịch ở đầu câu
  rationale: καί nối tiếp mạch kể chuyện. Trong tiếng Việt, bắt đầu câu bằng “Khi” truyền đạt quan hệ mạch lạc tự nhiên mà không cần thêm “và”.
theological_decisions:
- issue: Sự im lặng của Đức Giê-su trước những người tố cáo
  choice: 'Trình bày thẳng như một sự kiện trong câu chuyện: Đức Giê-su không đáp lại điều gì.'
  alternative: Diễn đạt theo hướng gợi rõ Ê-sai 53, chẳng hạn “Ngài không mở miệng đáp lời”.
  rationale: Câu này không trực tiếp nói đến sự ứng nghiệm lời tiên tri; bản dịch không thêm liên hệ thần học dù sự im lặng có thể gợi đến chủ đề ấy.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “Đức Giê-su” để chỉ nhân vật đã rõ từ văn cảnh; giữ các thuật ngữ quen thuộc “thầy tế lễ cả” và “trưởng lão”.
