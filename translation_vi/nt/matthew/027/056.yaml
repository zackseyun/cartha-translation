    rationale: Nguyên văn phân biệt Ma-ri Ma-đơ-len với một Ma-ri khác. Cấu trúc đồng vị “Ma-ri, mẹ của...” biểu đạt rõ hơn sự nhận diện Ma-ri thứ hai mà không thêm nghĩa.
  - severity: low
    issue: “Cùng mẹ của...” và cách diễn đạt chú thích chưa tối ưu về độ tự nhiên.
    rationale: “Và mẹ của...” phản ánh phép nối καί trực tiếp; “Một số bản chép tay đọc...” là cách ghi chú dị bản gọn và tự nhiên.
  revised_text: Trong số họ có Ma-ri Ma-đơ-len, Ma-ri, mẹ của Gia-cơ và Giô-sép[a], và mẹ của các con trai Xê-bê-đê.
