  text: ἐν αἷς ἦν Μαρία ἡ Μαγδαληνὴ καὶ Μαρία ἡ τοῦ Ἰακώβου καὶ ⸀Ἰωσὴφ μήτηρ καὶ ἡ μήτηρ τῶν υἱῶν Ζεβεδαίου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/056.yaml
  text: among whom were Mary Magdalene[a], and Mary the mother of James and Joseph, and the mother of the sons of Zebedee.
translation:
  language: vi
  text: Trong số họ có Ma-ri Ma-đơ-len, Ma-ri, mẹ của Gia-cơ và Giô-sép[a], và mẹ của các con trai Xê-bê-đê.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Một số bản chép tay đọc “Giô-sê” thay cho “Giô-sép”.
    reason: textual_variant
lexical_decisions:
- source_word: ἐν αἷς
  choice: Trong số họ
  rationale: Cụm này liên kết với nhóm phụ nữ ở câu trước và diễn đạt tự nhiên ý một số người thuộc nhóm ấy.
- source_word: Μαρία ἡ Μαγδαληνὴ
  choice: Ma-ri Ma-đơ-len
  rationale: Dùng dạng tên riêng quen thuộc trong tiếng Việt, giữ tên Ma-ri cùng địa danh dùng để phân biệt bà.
- source_word: Μαρία ἡ τοῦ Ἰακώβου καὶ Ἰωσὴφ μήτηρ
  choice: Ma-ri là mẹ của Gia-cơ và Giô-sép
  rationale: Diễn đạt rõ quan hệ sở thuộc của hai danh từ ở thuộc cách với μήτηρ, đồng thời giữ cấu trúc nhận diện người phụ nữ này qua các con bà.
- source_word: Ἰακώβου
  choice: Gia-cơ
  rationale: Dạng tên Tân Ước quen thuộc trong tiếng Việt cho Ἰάκωβος.
- source_word: Ἰωσὴφ
  choice: Giô-sép
  rationale: Phản ánh trực tiếp cách đọc Ἰωσήφ của SBLGNT; dị bản được ghi ở chú thích.
- source_word: ἡ μήτηρ τῶν υἱῶν Ζεβεδαίου
  choice: mẹ của các con trai Xê-bê-đê
  rationale: Cách dịch rõ ràng, tự nhiên và sát quan hệ thuộc cách trong nguyên văn.
- source_word: Ζεβεδαίου
  choice: Xê-bê-đê
  rationale: Dạng phiên âm tiếng Việt quen thuộc của tên Ζεβεδαῖος.
theological_decisions: []
