  verdict: revise
  source_fidelity: 'Bản dịch truyền đạt đúng cấu trúc và nội dung của câu Hy Lạp: ba phụ nữ được nêu là thuộc nhóm ở câu trước; Ma-ri thứ hai được xác định là mẹ của Gia-cơ và Giô-sép; người thứ ba là mẹ các con trai Xê-bê-đê. Chú thích dị bản đặt đúng tại tên Giô-sép.'
  naturalness: Cụm “Ma-ri là mẹ của...” sau dấu phẩy có thể thoáng gây cảm giác đồng nhất Ma-ri này với Ma-ri Ma-đơ-len. Đổi thành cấu trúc đồng vị “Ma-ri, mẹ của...” giúp danh sách rõ và tự nhiên hơn. Liên từ “và” phù hợp với phép liệt kê hơn “cùng”.
  terminology: Các dạng tên Ma-ri Ma-đơ-len, Gia-cơ, Giô-sép và Xê-bê-đê nhất quán với lối phiên âm Kinh Thánh tiếng Việt. Chú thích nên dùng “bản chép tay đọc” thay cho “thủ bản hoặc cách đọc” để tự nhiên và chính xác hơn trong văn phong phổ thông.
  issues:
