  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ δήσαντες αὐτὸν ἀπήγαγον καὶ ⸀παρέδωκαν Πιλάτῳ τῷ ἡγεμόνι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/002.yaml
  text: And after binding him[b][a], they led him away and handed him over to Pilate the governor.
translation:
  language: vi
  text: Sau khi trói Người[a], họ dẫn Người đi và giao nộp Người[b] cho tổng đốc Phi-lát.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “Trói Người rồi.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “trao Người.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: δήσαντες
  choice: trói ... lại
  rationale: Phân từ bất định quá khứ chủ động của δέω diễn tả hành động xảy ra trước các động từ chính. Cấu trúc tiếng Việt “trói ... lại” tự nhiên, giữ nghĩa cụ thể là trói buộc.
- source_word: ἀπήγαγον
  choice: dẫn Ngài đi
  rationale: ἀπάγω có nghĩa dẫn hoặc đưa đi; “dẫn ... đi” giữ sắc thái áp giải trong bối cảnh giam giữ và xét xử.
- source_word: παρέδωκαν
  choice: giao nộp
  rationale: παραδίδωμι ở đây chỉ việc trao Đức Chúa Giê-su sang quyền quản thúc và thẩm quyền của Phi-lát. “Giao nộp” vừa tự nhiên vừa giữ được sắc thái pháp lý và âm vang thần học mà không giải nghĩa quá mức.
- source_word: Πιλάτῳ
  choice: Phi-lát
  rationale: Tên riêng được phiên âm theo cách dùng quen thuộc trong tiếng Việt.
- source_word: ἡγεμόνι
  choice: tổng đốc
  rationale: ἡγεμών chỉ một viên chức cai trị. “Tổng đốc” là cách gọi quen thuộc, dễ hiểu trong văn cảnh này, đồng thời không thu hẹp từ Hy Lạp thành chức danh lịch sử chuyên biệt hơn như “thái thú”.
- source_word: καὶ δήσαντες αὐτὸν
  choice: Rồi họ trói Đức Chúa Giê-su lại
  rationale: καί đầu câu nối tiếp mạch kể nên được diễn đạt bằng “Rồi”. Đại từ αὐτόν được làm rõ bằng “Đức Chúa Giê-su” để câu độc lập dễ hiểu trong tiếng Việt.
- source_word: καὶ παρέδωκαν
  choice: và giao nộp
  rationale: Giữ quan hệ phối hợp và trình tự hành động bằng “và”; tiếng Việt không cần lặp lại chủ ngữ.
theological_decisions:
- issue: Cách dịch παραδίδωμι trong trình thuật thương khó
  choice: giao nộp
  alternative: trao
  rationale: “Giao nộp” làm nổi bật việc chuyển giao sang thẩm quyền tư pháp của Phi-lát, đồng thời không loại bỏ âm vang thần học của động từ trong trình thuật thương khó. “Trao” cũng có thể được dùng nhưng nhẹ hơn về sắc thái pháp lý.
- issue: Cách xưng gọi Đức Chúa Giê-su trong đại từ αὐτόν
  choice: Đức Chúa Giê-su ... Ngài
  alternative: ông ấy / người
  rationale: Việc nêu tên ở đầu câu giúp câu trích đứng riêng được rõ nghĩa; “Ngài” là đại từ kính trọng tự nhiên trong văn phong Kinh Thánh tiếng Việt, không thêm một kết luận thần học vốn không có trong câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu giữ nhịp kể liên tiếp của nguyên văn, nhưng chuyển phân từ Hy Lạp thành động từ hữu hạn tự nhiên trong tiếng Việt. Các dấu chú thích [a], [b] đều xuất hiện trong chính văn.
