revisions:
- from: Rồi họ trói Đức Chúa Giê-su lại[a], dẫn Ngài đi và giao nộp cho tổng đốc Phi-lát[b].
  to: Sau khi trói Người[a], họ dẫn Người đi và giao nộp Người[b] cho tổng đốc Phi-lát.
  rationale: Bản sửa chuyển δήσαντες thành «Sau khi trói» để thể hiện hành động xảy ra trước hai động từ chính, giữ trình tự kể chuyện và sắc thái áp giải. «Giao nộp» được giữ cho παρέδωκαν, nhưng chú thích được đặt đúng tại từ ngữ được giải thích. Đại từ «Người» thay cho danh xưng mở rộng nhằm không thêm tước hiệu ngoài nguyên văn.
