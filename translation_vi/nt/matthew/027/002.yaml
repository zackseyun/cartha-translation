review_pass:
  verdict: revise
  source_fidelity: Cần biểu đạt rõ hơn quan hệ trước–sau của phân từ aorist δήσαντες (“sau khi trói”). “Dẫn ... đi,” “giao nộp,” và “tổng đốc” phản ánh tốt ἀπήγαγον, παρέδωκαν, và ἡγεμών. Không nên thêm tước hiệu «Đức Chúa» vào tên riêng khi nguyên văn câu này chỉ dùng đại từ; dùng «Người» giữ phép quy chiếu theo ngữ cảnh mà không thêm danh xưng.
  naturalness: Câu sửa vẫn tự nhiên, trang trọng và mạch lạc trong tiếng Việt hiện đại. Lặp «Người» là chấp nhận được trong văn phong Kinh Thánh và làm rõ các đối tượng.
  terminology: «Giao nộp» phù hợp sắc thái chuyển giao dưới thẩm quyền pháp lý của παραδίδωμι. «Tổng đốc» là cách dịch rộng, thông dụng cho ἡγεμών, không áp đặt một chức danh La Mã chuyên biệt.
  issues:
  - severity: medium
    issue: Chính văn «Rồi họ trói ...» không biểu đạt minh thị giá trị hoàn thành-trước của δήσαντες.
    rationale: Phân từ aorist δήσαντες bổ nghĩa cho các động từ chính ἀπήγαγον và παρέδωκαν; «Sau khi trói Người» tái hiện trực tiếp quan hệ thời gian này.
  - severity: medium
    issue: Ký hiệu chú thích [b] đang đặt sau «Phi-lát» thay vì ngay sau cụm được chú giải «giao nộp».
    rationale: Chú thích về παρέδωκαν phải được neo vào «giao nộp» để tránh hiểu nhầm là chú thích về tên Phi-lát hoặc chức danh của ông.
  - severity: low
    issue: «Đức Chúa Giê-su» thêm tước hiệu không có trong câu Hy Lạp, vốn chỉ có αὐτόν.
    rationale: Dùng «Người» bảo toàn phép quy chiếu theo ngữ cảnh mà không thêm một danh xưng vào chính văn.
