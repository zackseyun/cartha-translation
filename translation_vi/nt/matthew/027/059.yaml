translation:
  language: vi
  text: Giô-sép lấy thi thể ấy và quấn thi thể ấy trong một tấm vải lanh sạch[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “trong một tấm vải liệm bằng lanh sạch.” Từ Hy Lạp này có thể chỉ tấm vải lanh dùng để liệm người chết.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λαβὼν
  choice: lấy
  rationale: Phân từ bất định quá khứ diễn tả hành động xảy ra trước động từ chính; dùng “lấy … và quấn” giúp câu kể tự nhiên trong tiếng Việt mà vẫn giữ trình tự hành động.
- source_word: σῶμα
  choice: thi thể ấy
  rationale: Trong bối cảnh mai táng, “thi thể” diễn đạt tự nhiên nghĩa của σῶμα và chỉ rõ thân thể của Chúa Giê-su đã được nhắc đến trong ngữ cảnh; “ấy” không thêm ý sở hữu.
- source_word: ἐνετύλιξεν
  choice: quấn
  rationale: Động từ có nghĩa là quấn hoặc bọc lại; “quấn” là cách nói gọn, tự nhiên và phù hợp với việc khâm liệm.
- source_word: αὐτὸ
  choice: được thể hiện qua “thi thể ấy”
  rationale: Đại từ giống trung trong tiếng Hy Lạp quy chiếu về σῶμα. Tiếng Việt không cần lặp một đại từ làm tân ngữ sau khi đã nêu “thi thể ấy”, nên quy chiếu vẫn rõ mà câu không gượng.
- source_word: σινδόνι
  choice: trong một tấm vải lanh
  rationale: σινδών chỉ một tấm vải bằng lanh, trong ngữ cảnh này dùng cho việc mai táng. Bản chính giữ nghĩa rộng, còn nghĩa chuyên biệt “vải liệm” được nêu ở chú thích.
- source_word: καθαρᾷ
  choice: sạch
  rationale: “Sạch” là nghĩa phù hợp và tự nhiên nhất ở đây; “tinh sạch” có thể gợi sắc thái nghi lễ không nhất thiết được câu này khẳng định.
- source_word: καὶ ... ὁ Ἰωσὴφ
  choice: Giô-sép ... và
  rationale: Liên từ καί được thể hiện tự nhiên bằng “và” để nối hai hành động của Giô-sép; không cần mở câu bằng “và” trong tiếng Việt vì câu vẫn giữ mạch kể.
