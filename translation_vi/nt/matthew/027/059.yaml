  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu giữ cách gọi trực tiếp “thi thể” thay vì thêm sở hữu “thi thể Ngài”; cấu trúc tiếng Việt tự nhiên không cần tái hiện riêng đại từ giống trung αὐτό.
