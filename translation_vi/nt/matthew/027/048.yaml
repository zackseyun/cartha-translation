language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ εὐθέως δραμὼν εἷς ἐξ αὐτῶν καὶ λαβὼν σπόγγον πλήσας τε ὄξους καὶ περιθεὶς καλάμῳ ἐπότιζεν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/048.yaml
  text: And immediately one of them ran[a], took a sponge, filled it with sour wine, put it on a reed[b], and gave him a drink.
translation:
  language: vi
  text: Ngay lập tức, một người trong số họ chạy, lấy một miếng bọt biển, làm ướt đẫm miếng bọt biển bằng rượu chua[a], gắn vào một cây sậy rồi đưa cho Ngài uống[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “giấm” hoặc “giấm rượu”. Từ Hy Lạp ὄξος có thể chỉ rượu chua hay giấm làm từ rượu.'
    reason: lexical_alternative
  - marker: b
    text: Động từ Hy Lạp ở dạng chưa hoàn thành, có thể hàm ý người ấy đang hoặc cứ đưa cho Ngài uống.
    reason: aspectual_ambiguity
lexical_decisions:
- source_word: εὐθέως
  choice: ngay lập tức
  rationale: Diễn đạt rõ tính tức thời và khẩn trương của hành động bằng tiếng Việt hiện đại.
- source_word: δραμὼν
  choice: chạy đi
  rationale: Chuyển phân từ bất định sang động từ hữu hạn để câu kể tự nhiên, đồng thời giữ sắc thái hành động nhanh chóng.
- source_word: εἷς ἐξ αὐτῶν
  choice: một người trong số họ
  rationale: Tương đương tự nhiên với cấu trúc chỉ một cá nhân thuộc nhóm vừa được nhắc đến.
- source_word: λαβὼν σπόγγον
  choice: lấy một miếng bọt biển
  rationale: ‘Miếng bọt biển’ là cách gọi tự nhiên trong ngữ cảnh một vật được thấm chất lỏng.
- source_word: πλήσας τε ὄξους
  choice: thấm đầy rượu chua
  rationale: Trong ngữ cảnh miếng bọt biển, ‘thấm đầy’ tự nhiên hơn ‘đổ đầy’; ‘rượu chua’ phản ánh ὄξος như loại rượu đã chua hoặc giấm rượu có thể dùng làm thức uống.
- source_word: περιθεὶς καλάμῳ
  choice: gắn vào một cây sậy
  rationale: Diễn đạt việc đặt hoặc gắn miếng bọt biển lên cây sậy; giữ từ chỉ vật thể cụ thể của nguyên văn.
- source_word: ἐπότιζεν αὐτόν
  choice: đưa cho Ngài uống
  rationale: Diễn đạt ποτίζω là làm hoặc giúp một người uống. Dạng chưa hoàn thành có thể gợi hành động đang diễn ra hoặc được cố thực hiện, nhưng tiếng Việt tự nhiên không nhất thiết phải đánh dấu rõ ở chính văn.
theological_decisions:
- issue: Bản chất thức uống được đưa cho Chúa Giê-su
  choice: rượu chua
  alternative: giấm; giấm rượu
  rationale: ὄξος có thể chỉ rượu chua hoặc giấm rượu. ‘Rượu chua’ phù hợp với chất lỏng có thể uống và tránh khiến độc giả hiện đại chỉ nghĩ đến loại giấm dùng làm gia vị.
- issue: Sắc thái thể của ἐπότιζεν
  choice: đưa cho Ngài uống
  alternative: cứ đưa cho Ngài uống; đang cho Ngài uống
  rationale: Dạng chưa hoàn thành bảo tồn khả năng hành động đang tiếp diễn hoặc được cố thực hiện; bản dịch chính chọn cách nói tự nhiên và ghi nhận sắc thái này trong chú thích thay vì quyết định quá mức.
translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng hiện đại, dễ hiểu. Dùng “Ngài” để quy chiếu Chúa Giê-su theo lối tôn kính phổ biến, không thêm danh xưng không có trong câu Hy Lạp. Chuỗi phân từ được chuyển thành các động từ nối tiếp để tiếng Việt trôi chảy.
