  text: καὶ ὅτε ἐνέπαιξαν αὐτῷ, ἐξέδυσαν αὐτὸν τὴν χλαμύδα καὶ ἐνέδυσαν αὐτὸν τὰ ἱμάτια αὐτοῦ καὶ ἀπήγαγον αὐτὸν εἰς τὸ σταυρῶσαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/031.yaml
  text: And when they had mocked him[a], they stripped the cloak off him and put his own clothes on him, and led him away to crucify him.
translation:
  language: vi
  text: Sau khi đã chế nhạo Ngài, họ lột áo choàng[a] khỏi người Ngài, mặc lại y phục của Ngài cho Ngài, rồi dẫn Ngài đi để đóng đinh Ngài trên thập tự giá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “áo bào”. Từ Hy Lạp χλαμύς chỉ một loại áo choàng, thường gắn với quân đội; trong ngữ cảnh này, đó là chiếc áo được khoác lên Đức Giê-su để chế nhạo Ngài như một vị vua.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνέπαιξαν
  choice: chế nhạo
  rationale: Động từ chỉ sự giễu cợt mang tính khinh miệt và tàn nhẫn; “chế nhạo” giữ được sắc thái mạnh hơn cách nói nhẹ như “trêu chọc”.
- source_word: χλαμύδα
  choice: chiếc áo choàng
  rationale: χλαμύς chỉ một loại áo khoác ngoài, thường gắn với quân nhân hoặc người có chức vị. “Áo choàng” sát nghĩa mà không tự biến nó thành lễ phục hoàng gia; ngữ cảnh trước cho thấy đây là áo dùng để giả làm vua nhằm nhạo báng Chúa Giê-su.
- source_word: ἐξέδυσαν αὐτὸν τὴν χλαμύδα
  choice: họ lột chiếc áo choàng khỏi Ngài
  rationale: ἐκδύω diễn tả việc cởi hoặc lột y phục khỏi một người. “Lột… khỏi” giữ được lực của động từ và sự thô bạo trong hành động.
- source_word: ἐνέδυσαν αὐτὸν τὰ ἱμάτια αὐτοῦ
  choice: mặc lại quần áo của Ngài cho Ngài
  rationale: ἐνδύω ở đây là mặc y phục cho người khác; αὐτοῦ cho biết đó là quần áo của chính Chúa Giê-su. Từ “lại” diễn đạt tự nhiên sự phục hồi quần áo sau khi áo choàng nhạo báng bị lột ra, phù hợp với trình tự của ngữ cảnh.
- source_word: ἱμάτια
  choice: quần áo
  rationale: Đây là từ rộng chỉ y phục; “quần áo” là cách nói hiện đại, rõ ràng và tự nhiên trong tiếng Việt.
- source_word: ἀπήγαγον
  choice: dẫn Ngài đi
  rationale: ἀπάγω có nghĩa là dẫn hoặc áp giải một người đi nơi khác. “Dẫn… đi” giữ được hành động đưa một tù nhân đi mà không thêm chi tiết không có trong nguyên văn.
- source_word: εἰς τὸ σταυρῶσαι
  choice: đi đóng đinh vào thập tự giá
  rationale: Cấu trúc εἰς với động từ nguyên mẫu có mạo từ diễn tả mục đích. Cách dịch này nêu trực tiếp mục đích họ dẫn Ngài đi và chuyển tải tự nhiên động từ σταυρόω.
