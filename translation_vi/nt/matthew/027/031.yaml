  terminology: “Chế nhạo,” “áo choàng,” “y phục,” và “thập tự giá” đều thích hợp trong văn cảnh. Chú thích nên tránh mở rộng χλαμύς thành áo của “người có chức vị”; nghĩa từ vựng an toàn là áo choàng, thường gắn với quân đội. “Áo bào” là phương án thay thế có thể có trong ngữ cảnh chế giễu vương quyền, nhưng không nên được trình bày là nghĩa bắt buộc của từ.
