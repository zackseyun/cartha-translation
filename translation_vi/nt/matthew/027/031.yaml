translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” để quy chiếu Chúa Giê-su theo lối xưng hô kính trọng quen thuộc trong tiếng Việt; câu vẫn giữ nhịp liên tiếp của các hành động trong nguyên văn. Dấu chú thích [a] được đặt ngay sau “áo choàng”, là từ mà chú thích giải nghĩa.
