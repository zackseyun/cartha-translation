revisions:
- from: Có nhiều phụ nữ ở đó, quan sát từ xa[a]. Họ là những người đã theo Chúa Giê-su từ Ga-li-lê và phục vụ Ngài[b].
  to: Có nhiều phụ nữ ở đó, đang quan sát từ xa[a], là những người đã theo Giê-su từ Ga-li-lê và phục vụ ngài[b].
  rationale: Bỏ tước hiệu “Chúa” được thêm vào trước tên Giê-su để sát nguyên văn. Điều chỉnh cấu trúc thành một câu để liên kết rõ các phụ nữ đang quan sát với những người đã theo Giê-su và phục vụ ngài. Giữ “đã theo” để biểu thị hành động đi trước bối cảnh đang quan sát, và giữ chú thích của “phục vụ” tại đúng cụm từ liên quan.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T07:38:33Z'
review_pass:
  verdict: revise
  source_fidelity: Cần sửa vì bản nháp thêm tước hiệu “Chúa” trước tên Giê-su, trong khi nguyên văn chỉ có τῷ Ἰησοῦ, “Giê-su”. Ngoài điểm này, bản dịch chuyển đạt đúng sự hiện diện của nhiều phụ nữ, việc họ quan sát từ xa, đã theo Giê-su từ Ga-li-lê, và đang phục vụ ngài. Cấu trúc một câu trong bản sửa giữ rõ hai phân từ hiện tại “quan sát” và “phục vụ” là các hành động gắn với những phụ nữ ấy.
  naturalness: Bản sửa dùng một câu tiếng Việt phổ thông, trang trọng và tự nhiên hơn cách tách “Họ là những người...”, đồng thời tránh làm mạch quan hệ trong nguyên văn bị rời. “Đang quan sát từ xa” diễn đạt tự nhiên tính đang tiếp diễn của θεωροῦσαι.
  terminology: Giữ tên riêng “Giê-su”, “Ga-li-lê”. Không thêm danh hiệu “Chúa” không có trong câu nguồn. “Phục vụ ngài” giữ nghĩa rộng của διακονέω, không thu hẹp thành chăm sóc vật chất hay áp vào chức vụ hội thánh.
  issues:
  - severity: medium
    issue: Thêm “Chúa” trong “Chúa Giê-su”
    rationale: Nguyên văn chỉ nêu tên Ἰησοῦ, không kèm κύριος hay một tước hiệu tương đương. Thêm “Chúa” làm tăng nội dung danh hiệu vượt quá câu nguồn; nên dịch là “Giê-su”.
  - severity: low
    issue: Tách câu và dùng “Họ là những người”
    rationale: Không sai nghĩa trực tiếp, nhưng làm câu tiếng Việt hơi nặng và làm liên hệ giữa việc quan sát với mệnh đề quan hệ kém gọn. Có thể giữ quan hệ này trong một câu tự nhiên.
  revised_text: Có nhiều phụ nữ ở đó, đang quan sát từ xa[a], là những người đã theo Giê-su từ Ga-li-lê và phục vụ ngài[b].
