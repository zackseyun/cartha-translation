source:
  edition: SBLGNT
  text: Ἦσαν δὲ ἐκεῖ γυναῖκες πολλαὶ ἀπὸ μακρόθεν θεωροῦσαι, αἵτινες ἠκολούθησαν τῷ Ἰησοῦ ἀπὸ τῆς Γαλιλαίας διακονοῦσαι αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/055.yaml
  text: There were many women there[a], watching from a distance, who had followed Jesus from Galilee[b], serving him.
translation:
  language: vi
  text: Có nhiều phụ nữ ở đó, đang quan sát từ xa[a], là những người đã theo Giê-su từ Ga-li-lê và phục vụ ngài[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “nhìn từ xa.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “chăm lo cho ngài.” Động từ Hy Lạp có thể chỉ sự phục vụ hoặc hỗ trợ thực tế.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἦσαν δὲ ἐκεῖ
  choice: Có ... ở đó
  rationale: Diễn đạt tự nhiên cấu trúc hiện hữu ἦσαν và trạng từ chỉ nơi chốn ἐκεῖ; δέ là liên từ chuyển ý nhẹ, không nhất thiết phải thể hiện bằng một từ riêng trong tiếng Việt.
- source_word: γυναῖκες πολλαὶ
  choice: nhiều phụ nữ
  rationale: Chuyển đạt trực tiếp số lượng và giới tính của cụm từ Hy Lạp bằng cách nói hiện đại, trang trọng.
- source_word: ἀπὸ μακρόθεν θεωροῦσαι
  choice: quan sát từ xa
  rationale: θεωροῦσαι chỉ sự chăm chú nhìn đang tiếp diễn, còn ἀπὸ μακρόθεν chỉ khoảng cách; cách dịch này giữ cả hai sắc thái.
- source_word: αἵτινες
  choice: Họ là những người
  rationale: Thể hiện sắc thái nhận diện/miêu tả của đại từ quan hệ, đồng thời tránh một câu tiếng Việt quá dài và nặng nề.
- source_word: ἠκολούθησαν τῷ Ἰησοῦ
  choice: đã theo Chúa Giê-su
  rationale: “Đã theo” cho thấy hành động có trước cảnh họ đang quan sát; “theo” nhận tân ngữ trực tiếp tự nhiên trong tiếng Việt.
- source_word: ἀπὸ τῆς Γαλιλαίας
  choice: từ Ga-li-lê
  rationale: Giữ nguyên ý nghĩa địa lý của điểm khởi đầu nơi họ đã đi theo Chúa Giê-su.
- source_word: διακονοῦσαι αὐτῷ
  choice: phục vụ Ngài
  rationale: “Phục vụ” đủ rộng để chỉ sự chăm sóc, trợ giúp và hỗ trợ thực tế, không áp đặt ý niệm về một chức vụ chính thức trong giáo hội.
theological_decisions:
- issue: Vai trò của các phụ nữ được diễn tả bằng διακονοῦσαι
  choice: phục vụ Ngài
  alternative: chăm lo cho Ngài; hầu việc Ngài
  rationale: Bản dịch giữ phạm vi nghĩa rộng của động từ Hy Lạp, không thu hẹp vai trò của họ thành việc nhà cũng không biến nó thành một chức vụ giáo hội về sau.
- issue: Quan hệ thời gian của việc họ theo Chúa Giê-su
  choice: đã theo Chúa Giê-su từ Ga-li-lê
  alternative: theo Chúa Giê-su từ Ga-li-lê
  rationale: Từ “đã” giúp độc giả nhận ra việc đi theo từ Ga-li-lê có trước cảnh đóng đinh hiện tại, phù hợp với quan hệ thời gian trong câu.
translation_notes:
  register: Tiếng Việt phổ thông hiện đại, trang trọng nhưng dễ hiểu. Dùng “Chúa Giê-su” và đại từ “Ngài” theo văn phong Kinh Thánh quen thuộc; tách thành hai câu để diễn đạt rõ đại từ quan hệ αἵτινες mà không làm thay đổi quan hệ ý nghĩa.
