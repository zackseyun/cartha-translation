id: MAT.27.18
reference: Matthew 27:18
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ᾔδει γὰρ ὅτι διὰ φθόνον παρέδωκαν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/018.yaml
  text: For he knew that they had handed him over because of envy[a].
translation:
  language: vi
  text: Vì ông biết rằng họ đã nộp Đức Giê-su vì lòng đố kỵ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “do đố kỵ” hoặc “vì lòng ghen tị.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾔδει
  choice: ông biết
  rationale: Động từ diễn tả sự biết hoặc nhận thức; “ông biết” tự nhiên và trực tiếp trong tiếng Việt. Đại từ “ông” theo ngữ cảnh chỉ Phi-lát.
- source_word: γὰρ
  choice: Vì
  rationale: Liên từ đưa ra lời giải thích cho câu trước; “Vì” giữ rõ quan hệ lập luận.
- source_word: ὅτι
  choice: rằng
  rationale: Ở đây từ này mở đầu nội dung điều Phi-lát biết, không phải một mệnh đề nguyên nhân thứ hai.
- source_word: διὰ φθόνον
  choice: vì lòng đố kỵ
  rationale: διά với đối cách chỉ nguyên nhân; φθόνος nói đến sự đố kỵ trước địa vị hoặc ảnh hưởng của người khác. Cách dịch này vừa sát nghĩa vừa tự nhiên.
- source_word: παρέδωκαν
  choice: đã nộp
  rationale: Trong bối cảnh thương khó, động từ có nghĩa giao hoặc nộp một người cho nhà cầm quyền. “Đã nộp” diễn đạt gọn hành động xảy ra trước nhận thức được nói đến, mà không thu hẹp nghĩa thành “phản bội”.
- source_word: αὐτόν
  choice: Đức Giê-su
  rationale: Đại từ chỉ Đức Giê-su. Dùng danh xưng để câu tiếng Việt rõ chủ thể được nộp, thay vì đại từ có thể kém rõ khi đứng riêng.
theological_decisions:
- issue: Động cơ của những người tố cáo Đức Giê-su
  choice: Phi-lát nhận biết lòng đố kỵ là nguyên nhân khiến họ nộp Đức Giê-su.
  alternative: Có thể diễn đạt φθόνος là “ghen tị”.
  rationale: Bản dịch giữ nguyên nhận định về động cơ được câu Kinh Thánh nêu ra, không mở rộng thành lời giải thích thần học vượt quá văn bản.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Đức Giê-su” làm rõ đối tượng của đại từ Hy Lạp; “lòng đố kỵ” giữ sắc thái đạo đức và tâm lý của φθόνος.
