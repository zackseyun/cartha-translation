  text: Κατὰ δὲ ἑορτὴν εἰώθει ὁ ἡγεμὼν ἀπολύειν ἕνα τῷ ὄχλῳ δέσμιον ὃν ἤθελον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/015.yaml
  text: At the feast the governor was accustomed to release to the crowd one prisoner[a], whom they wanted.
translation:
  language: vi
  text: Vào dịp lễ, tổng đốc có lệ phóng thích cho đám đông một tù nhân mà họ muốn.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Κατὰ δὲ ἑορτὴν
  choice: Vào dịp lễ
  rationale: κατά với đối cách mang nghĩa thời gian, chỉ thời điểm hoặc dịp diễn ra lễ; δέ là từ nối nhẹ và không cần dịch riêng trong tiếng Việt.
- source_word: ἑορτὴν
  choice: lễ
  rationale: ἑορτή chỉ một lễ hội hoặc kỳ lễ; ngữ cảnh trước đó xác định đây là lễ Vượt Qua, còn cách dịch ngắn gọn “lễ” giữ được sự tự nhiên và gần nguyên văn.
- source_word: εἰώθει
  choice: có lệ
  rationale: Dạng vị hoàn thành mang chức năng vị quá khứ diễn tả một tập quán; “có lệ” truyền đạt rõ hành động thường lệ trong văn kể chuyện.
- source_word: ὁ ἡγεμὼν
  choice: tổng đốc
  rationale: Trong ngữ cảnh này, ἡγεμών là viên quan La Mã cai quản tỉnh; “tổng đốc” là thuật ngữ tiếng Việt quen thuộc và phù hợp với chức vụ của Phi-lát.
- source_word: ἀπολύειν
  choice: phóng thích
  rationale: ἀπολύω ở đây nghĩa là thả một người khỏi sự giam giữ; “phóng thích” chính xác trong bối cảnh pháp lý.
- source_word: ἕνα
  choice: một
  rationale: Giữ nguyên số lượng được nêu rõ trong bản Hy Lạp.
- source_word: τῷ ὄχλῳ
  choice: cho đám đông
  rationale: Dữ cách có thể biểu thị đối tượng được đáp ứng hoặc hưởng việc phóng thích; “cho đám đông” tự nhiên hơn “đến đám đông” trong tiếng Việt.
- source_word: δέσμιον
  choice: tù nhân
  rationale: δέσμιος chỉ người đang bị trói hoặc giam giữ; “tù nhân” là từ hiện đại, rõ nghĩa.
- source_word: ὃν ἤθελον
  choice: do họ chọn
  rationale: Nghĩa đen là “người mà họ muốn”; trong ngữ cảnh lựa chọn tù nhân để được thả, “do họ chọn” diễn đạt tự nhiên mà không thêm chủ thể hay điều kiện.
