  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Câu giữ trọng tâm ở tập quán của tổng đốc, đồng thời diễn đạt mệnh đề quan hệ cuối câu theo lối tiếng Việt tự nhiên.
