id: MAT.27.41
reference: Matthew 27:41
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὁμοίως ⸀καὶ οἱ ἀρχιερεῖς ἐμπαίζοντες μετὰ τῶν γραμματέων καὶ ⸀πρεσβυτέρων ἔλεγον·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/041.yaml
  text: Likewise[a], the chief priests also, mocking him with the scribes and elders, were saying,
translation:
  language: vi
  text: 'Cũng vậy,[a] các thượng tế cùng với các kinh sư và các trưởng lão cũng chế nhạo Đức Giê-su và nói:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “Tương tự như thế, các thượng tế cùng với các kinh sư và các trưởng lão cũng chế nhạo Đức Giê-su rằng:”'
    reason: Giữ một cách diễn đạt khác của ὁμοίως và khả năng gắn phân từ ἐμπαίζοντες trực tiếp hơn với động từ nói.
lexical_decisions:
- source_word: ὁμοίως
  choice: Cũng vậy
  rationale: Diễn tả sự tương ứng với hành động chế nhạo ngay trước đó, bằng lối nói tự nhiên và trang trọng trong tiếng Việt.
- source_word: καὶ
  choice: cũng
  rationale: 'Mang nghĩa bổ sung: các thượng tế và những người đi cùng họ tham gia vào sự chế nhạo đã được kể trước đó.'
- source_word: ἀρχιερεῖς
  choice: các thượng tế
  rationale: Cách dịch quen thuộc chỉ giới lãnh đạo tư tế, không hàm ý có nhiều người đồng thời giữ một chức thượng tế duy nhất.
- source_word: ἐμπαίζοντες
  choice: chế nhạo Đức Giê-su
  rationale: Phân từ diễn tả hành động nhạo báng; bổ sung đối tượng là Đức Giê-su từ ngữ cảnh trực tiếp để câu tiếng Việt rõ và tự nhiên.
- source_word: μετὰ
  choice: cùng với
  rationale: Giới từ với sở hữu cách biểu thị sự cùng tham gia của các kinh sư và trưởng lão, không chỉ sự hiện diện bên cạnh.
- source_word: γραμματέων
  choice: các kinh sư
  rationale: Thuật ngữ tiếng Việt thông dụng cho những người chuyên về Kinh Luật trong bối cảnh các sách Phúc Âm.
- source_word: πρεσβυτέρων
  choice: các trưởng lão
  rationale: Giữ nghĩa thể chế, chỉ những người lãnh đạo được công nhận, chứ không đơn thuần là người cao tuổi.
- source_word: ἔλεγον
  choice: nói
  rationale: Trong mạch kể tiếng Việt, cấu trúc 'chế nhạo... và nói' diễn đạt tự nhiên hành động đang diễn ra; ngữ cảnh của lời nói tiếp theo vẫn cho thấy tính tiếp diễn.
theological_decisions:
- issue: Những người tham gia chế nhạo
  choice: Các thượng tế, kinh sư và trưởng lão cùng tham gia chế nhạo Đức Giê-su.
  alternative: Các thượng tế chế nhạo Đức Giê-su trong khi các kinh sư và trưởng lão chỉ hiện diện.
  rationale: Cấu trúc μετὰ với sở hữu cách tự nhiên nhất biểu thị sự liên kết và cùng tham gia, dù về mặt ngữ pháp các thượng tế là chủ ngữ chính.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “Đức Giê-su” theo văn phong Kinh Thánh phổ biến; giữ “thượng tế”, “kinh sư”, “trưởng lão” là các danh xưng lịch sử. Dấu hai chấm thích hợp vì câu sau sẽ dẫn nội dung lời chế nhạo.
