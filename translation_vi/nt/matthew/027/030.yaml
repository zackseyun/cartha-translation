reference: Matthew 27:30
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἐμπτύσαντες εἰς αὐτὸν ἔλαβον τὸν κάλαμον καὶ ἔτυπτον εἰς τὴν κεφαλὴν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/030.yaml
  text: And after spitting on him[b][a], they took the reed and kept striking his head.
translation:
  language: vi
  text: Rồi họ nhổ vào Ngài, lấy cây sậy và cứ đánh vào đầu Ngài.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “liên tục đánh Ngài trên đầu.” Động từ Hy Lạp ở thì chưa hoàn thành có thể nhấn mạnh hành động lặp lại hoặc đang tiếp diễn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμπτύσαντες εἰς αὐτόν
  choice: họ nhổ vào Ngài
  rationale: Động từ phân từ bất định quá khứ diễn tả hành động xảy ra trước các động từ chính; “rồi” truyền đạt trình tự tự nhiên trong tiếng Việt. Với ἐμπτύω, εἰς + đối cách có nghĩa là nhổ vào người nào.
- source_word: ἔλαβον
  choice: lấy
  rationale: Cách dịch trực tiếp, tự nhiên của λαμβάνω trong ngữ cảnh họ dùng lại cây sậy đã đặt vào tay Đức Giê-su.
- source_word: τὸν κάλαμον
  choice: cây sậy
  rationale: κάλαμος trước hết chỉ cây sậy, cũng có thể chỉ vật giống gậy làm bằng sậy. “Cây sậy” giữ liên kết với câu trước và nét mỉa mai trong cảnh giả làm lễ tôn vương.
- source_word: ἔτυπτον
  choice: cứ đánh
  rationale: Thì chưa hoàn thành biểu thị hành động tiếp diễn hoặc lặp lại; “cứ đánh” diễn đạt rõ sắc thái ấy bằng tiếng Việt hiện đại.
- source_word: εἰς τὴν κεφαλὴν αὐτοῦ
  choice: vào đầu Ngài
  rationale: Giới từ εἰς ở đây đánh dấu mục tiêu của những cú đánh; “đánh vào đầu” là cách diễn đạt tự nhiên và cụ thể trong tiếng Việt.
theological_decisions:
- issue: Cách trình bày sự sỉ nhục và bạo hành đối với Đức Giê-su
  choice: Diễn đạt các hành động thẳng thắn, cụ thể, đồng thời giữ sắc thái đánh liên tục hoặc nhiều lần.
  alternative: “Sau khi nhổ vào Ngài, họ lấy cây sậy và đánh Ngài trên đầu.”
  rationale: Câu thuật chuyện không cần làm nhẹ đi hay tô đậm thêm sự bạo hành. “Cứ đánh” phản ánh thể chưa hoàn thành của ἔτυπτον mà không đưa thêm cách giải thích thần học.
- issue: Đại từ chỉ Đức Giê-su
  choice: Ngài
  alternative: ông ấy / người
  rationale: “Ngài” là lối gọi kính trọng, tự nhiên trong văn phong Kinh Thánh tiếng Việt; không làm thay đổi nội dung mệnh đề nguồn.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và dễ hiểu. Dùng “rồi” để thể hiện trình tự của phân từ mà không tạo cấu trúc nặng nề; dùng “cứ đánh” để giữ sắc thái thể của động từ Hy Lạp. Không đặt chú thích cho κάλαμος vì “cây sậy” là nghĩa trực tiếp và phù hợp với mạch văn.
