id: MAT.27.24
reference: Matthew 27:24
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἰδὼν δὲ ὁ Πιλᾶτος ὅτι οὐδὲν ὠφελεῖ ἀλλὰ μᾶλλον θόρυβος γίνεται λαβὼν ὕδωρ ἀπενίψατο τὰς χεῖρας ⸀ἀπέναντι τοῦ ὄχλου λέγων· Ἀθῷός εἰμι ἀπὸ τοῦ ⸀αἵματος τούτου· ὑμεῖς ὄψεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/024.yaml
  text: So when Pilate saw that he was gaining nothing[a], but rather that a riot was developing, he took water and washed his hands before the crowd, saying, “I am innocent of this blood[c][b]; you yourselves will see to it.”
translation:
  language: vi
  text: 'Khi Phi-lát thấy mình chẳng đạt được gì, mà trái lại, một cuộc náo loạn đang nổi lên, ông lấy nước rửa tay trước mặt đám đông và nói: “Ta không chịu trách nhiệm về máu này[a]. Chính các ngươi tự liệu lấy.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sát chữ: “Ta vô tội khỏi máu này.” Đây là cách nói phủ nhận trách nhiệm đối với cái chết của một người.'
    reason: lexical_alternative
  - marker: b
    text: 'Hay: “Chính các ngươi hãy chịu trách nhiệm”; sát chữ: “Chính các ngươi sẽ thấy.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν δὲ ὁ Πιλᾶτος
  choice: Khi Phi-lát thấy
  rationale: Phân từ bất định cùng δέ tiếp nối diễn tiến câu chuyện; tiếng Việt tự nhiên không cần biểu đạt δέ bằng một liên từ đối lập rõ nét.
- source_word: ὅτι οὐδὲν ὠφελεῖ
  choice: mình chẳng đạt được gì
  rationale: Diễn đạt tự nhiên ý rằng những nỗ lực của Phi-lát không đem lại kết quả, dù tiếng Hy Lạp sát chữ là ‘chẳng ích lợi gì’.
- source_word: ἀλλὰ μᾶλλον θόρυβος γίνεται
  choice: mà trái lại, một cuộc náo loạn đang nổi lên
  rationale: θόρυβος chỉ tình trạng ồn ào, hỗn loạn hay bạo động; ‘náo loạn’ giữ được phạm vi nghĩa mà không khẳng định chắc chắn đã thành một cuộc bạo loạn. Dạng hiện tại γίνεται cho thấy tình trạng đang hình thành.
- source_word: λαβὼν ὕδωρ ἀπενίψατο τὰς χεῖρας
  choice: ông lấy nước rửa tay
  rationale: Chuyển phân từ chỉ hành động đi trước thành chuỗi động từ tự nhiên trong tiếng Việt, đồng thời giữ nguyên hành động mang tính biểu tượng.
- source_word: ἀπέναντι τοῦ ὄχλου
  choice: trước mặt đám đông
  rationale: Thể hiện rõ hành động được làm công khai, ngay trước sự chứng kiến của đám đông.
- source_word: Ἀθῷός εἰμι ἀπὸ τοῦ αἵματος τούτου
  choice: Ta vô can về máu này
  rationale: ‘Vô can’ diễn đạt sự phủ nhận trách nhiệm pháp lý và đạo đức; ‘máu này’ giữ hình ảnh và độ bất thường có chủ ý của nguyên văn thay vì thêm ‘người này’.
- source_word: ὑμεῖς ὄψεσθε
  choice: Chính các ngươi hãy chịu trách nhiệm
  rationale: Cụm tương lai trung động mang nghĩa thành ngữ ‘các ngươi tự liệu/tự lo’; đại từ ὑμεῖς có tính nhấn mạnh. Bản dịch nêu rõ hàm ý nhận trách nhiệm trong ngữ cảnh.
theological_decisions:
- issue: Lời Phi-lát tuyên bố mình vô can
  choice: Giữ lời này như tuyên bố của chính Phi-lát, không xác nhận rằng ông thực sự vô tội.
  alternative: 'Có thể dịch sát hơn: ‘Ta vô tội khỏi máu này.’'
  rationale: Lời thoại phủ nhận trách nhiệm nhưng trình thuật không nhất thiết tán thành lời ấy; cách dịch duy trì sự căng thẳng đạo đức và thần học.
- issue: Trách nhiệm trong ὑμεῖς ὄψεσθε
  choice: Dịch theo nghĩa thành ngữ là ‘Chính các ngươi hãy chịu trách nhiệm.’
  alternative: 'Dịch sát chữ: ‘Chính các ngươi sẽ thấy.’'
  rationale: Trong ngữ cảnh, Phi-lát chuyển trách nhiệm sang đám đông. Chú thích bảo tồn hình thức sát chữ và sự hàm hồ của động từ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng ‘Phi-lát’, ‘đám đông’, ‘náo loạn’; trong lời của một tổng trấn nói với đám đông, cặp xưng hô ‘ta/các ngươi’ thể hiện khoảng cách quyền lực mà không quá cổ kính.
