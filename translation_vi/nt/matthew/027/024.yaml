revisions:
- from: 'Khi Phi-lát thấy mình chẳng đạt được gì, mà trái lại, một cuộc náo loạn đang nổi lên, ông lấy nước rửa tay trước mặt đám đông và nói: “Ta vô can về máu này[a]. Chính các ngươi hãy chịu trách nhiệm.”[b]'
  to: 'Khi Phi-lát thấy mình chẳng đạt được gì, mà trái lại, một cuộc náo loạn đang nổi lên, ông lấy nước rửa tay trước mặt đám đông và nói: “Ta không chịu trách nhiệm về máu này[a]. Chính các ngươi tự liệu lấy.”[b]'
  rationale: 'Chỉnh hai cụm lời thoại để tiếng Việt tự nhiên hơn và sát hình thức-nghĩa hơn: “không chịu trách nhiệm” làm rõ thành ngữ “vô tội khỏi máu này” mà vẫn giữ “máu này”; “tự liệu lấy” bảo tồn sắc thái thành ngữ và hình thức tương lai của ὄψεσθε tốt hơn một mệnh lệnh trực tiếp. Các phần còn lại không cần thay đổi.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T07:38:23Z'
