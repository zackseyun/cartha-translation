  verdict: revise
  source_fidelity: Bản dịch phản ánh đúng mạch câu, hành động rửa tay công khai, và sự đối lập giữa nỗ lực không hiệu quả với tình trạng náo loạn đang phát sinh. Tuy nhiên, “hãy chịu trách nhiệm” biến hình thức tương lai của ὄψεσθε thành mệnh lệnh và diễn giải trách nhiệm quá trực tiếp; “tự liệu lấy” giữ tốt hơn sắc thái thành ngữ và sự hàm hồ của nguyên văn. “Vô can về máu này” cũng không tự nhiên trong tiếng Việt hiện đại.
  naturalness: Câu kể nhìn chung tự nhiên, nhịp văn rõ ràng và phù hợp văn phong Kinh Thánh hiện đại. Cụm “không chịu trách nhiệm về máu này” tự nhiên hơn “vô can về máu này”, đồng thời vẫn giữ hình ảnh “máu này” của bản Hy Lạp.
  terminology: “Phi-lát,” “đám đông,” và “náo loạn” phù hợp. Lối xưng hô “ta/các ngươi” phù hợp với lời nói trang trọng, có khoảng cách quyền lực. Không nên thêm “người này” vào αἵματος τούτου, vì bản nguồn chỉ nói “máu này.”
