  source_fidelity: 'Bản dịch truyền đạt đầy đủ các yếu tố chính của nguyên văn: mốc thời gian buổi sáng (Πρωΐας δὲ γενομένης), tính bao quát của nhóm lãnh đạo (πάντες), hai nhóm được nêu là các thượng tế và trưởng lão của dân, hành động hội ý mang tính đối nghịch với Đức Giê-su (συμβούλιον ἔλαβον ... κατὰ τοῦ Ἰησοῦ), và mục tiêu làm Ngài chết (ὥστε θανατῶσαι αὐτόν). “Nhằm giết Ngài” diễn đạt đúng mục đích mà không áp đặt thủ tục pháp lý cụ thể.'
  naturalness: Câu tiếng Việt hiện đại, rõ ràng và có nhịp văn trang trọng phù hợp văn bản Kinh Thánh. “Khi trời vừa sáng” và “cùng bàn bạc chống lại” là những cách nói tự nhiên trong ngữ cảnh này.
  terminology: “Các thượng tế,” “các trưởng lão của dân chúng,” và “Đức Giê-su” phù hợp cách dùng Kinh Thánh tiếng Việt hiện đại. Đại từ “Ngài” giữ giọng văn kính trọng nhất quán mà không làm thay đổi nội dung mệnh đề.
