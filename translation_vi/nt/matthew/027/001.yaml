id: MAT.27.1
reference: Matthew 27:1
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Πρωΐας δὲ γενομένης συμβούλιον ἔλαβον πάντες οἱ ἀρχιερεῖς καὶ οἱ πρεσβύτεροι τοῦ λαοῦ κατὰ τοῦ Ἰησοῦ ὥστε θανατῶσαι αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/001.yaml
  text: When morning came[b][a], all the chief priests and the elders of the people took counsel against Jesus so as to put him to death.
translation:
  language: vi
  text: Khi trời vừa sáng[a], tất cả các thượng tế và các trưởng lão của dân chúng cùng bàn bạc[b] chống lại Đức Giê-su, nhằm giết Ngài.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “Đến lúc rạng đông.”
    reason: lexical_alternative
  - marker: b
    text: Hay “họp nhau bàn bạc.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Πρωΐας δὲ γενομένης
  choice: Khi trời vừa sáng
  rationale: Cụm sở hữu cách tuyệt đối đánh dấu sự chuyển tiếp về thời gian. Cách dịch này tự nhiên trong tiếng Việt và giữ được nghĩa lúc buổi sáng bắt đầu; δέ được thể hiện nhẹ qua sự chuyển câu.
- source_word: συμβούλιον ἔλαβον
  choice: cùng bàn bạc
  rationale: Thành ngữ chỉ việc hội ý hoặc nghị bàn. “Cùng bàn bạc” tự nhiên, giữ sắc thái deliberative mà không thêm sắc thái bí mật như “âm mưu”.
- source_word: πάντες
  choice: tất cả
  rationale: Giữ rõ ý toàn thể của nhóm lãnh đạo được nêu.
- source_word: οἱ ἀρχιερεῖς
  choice: các thượng tế
  rationale: Danh xưng quen thuộc trong tiếng Việt dành cho giới lãnh đạo tư tế tại Giê-ru-sa-lem, tránh khiến người đọc hiểu là có nhiều người cùng giữ chức thầy tế lễ thượng phẩm.
- source_word: οἱ πρεσβύτεροι τοῦ λαοῦ
  choice: các trưởng lão của dân chúng
  rationale: Giữ danh xưng lãnh đạo chính thức và quan hệ sở hữu của nguyên văn bằng cách diễn đạt tự nhiên.
- source_word: κατὰ τοῦ Ἰησοῦ
  choice: chống lại Đức Giê-su
  rationale: Trong ngữ cảnh thù nghịch này, κατά với sở hữu cách mang nghĩa đối nghịch, không chỉ đơn thuần là “về” Đức Giê-su.
- source_word: ὥστε
  choice: nhằm
  rationale: Với động từ nguyên mẫu theo sau, từ này ở đây diễn tả kết quả được nhắm tới hoặc mục đích. “Nhằm” giữ được sắc thái ấy một cách gọn và tự nhiên.
- source_word: θανατῶσαι αὐτόν
  choice: giết Ngài
  rationale: Diễn đạt trực tiếp hành động làm cho chết mà không xác định quá mức thủ tục pháp lý như “hành quyết”. Đại từ “Ngài” phù hợp văn phong Kinh Thánh tiếng Việt hiện đại.
theological_decisions:
- issue: Bản chất hành động của các lãnh đạo đối với Đức Giê-su
  choice: 'Dịch như một cuộc bàn bạc mang tính thù nghịch, với mục tiêu đưa Đức Giê-su đến cái chết: “cùng bàn bạc chống lại Đức Giê-su, nhằm giết Ngài.”'
  alternative: Có thể dịch nhẹ hơn là “bàn bạc về Đức Giê-su”, hoặc mạnh hơn là “âm mưu chống lại Đức Giê-su”.
  rationale: κατά chỉ rõ sự đối nghịch và ὥστε θανατῶσαι αὐτόν chỉ rõ mục tiêu gây ra cái chết; tuy nhiên, “bàn bạc” không đưa thêm sắc thái âm mưu bí mật mà nguyên văn không bắt buộc.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Câu giữ trật tự diễn tiến của nguyên văn nhưng dùng cấu trúc tiếng Việt tự nhiên; tránh các từ quá cổ hoặc thêm sắc thái giáo phái.
