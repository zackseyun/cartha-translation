  to: 'nói: “Tôi đã phạm tội vì đã giao nộp một người vô tội.” Nhưng họ đáp: “Việc đó can gì đến chúng ta? Anh tự lo lấy.”'
  rationale: Sửa cách diễn đạt thành ngữ “máu vô tội” theo nghĩa ngữ cảnh để tiếng Việt hiện đại tự nhiên và không mơ hồ sai hướng. Giữ thì hoàn thành tự nhiên của lời thú tội, tính ngầm của đối tượng, và lực phủi trách nhiệm gần mệnh lệnh của σὺ ὄψῃ.
