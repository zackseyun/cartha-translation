  text: λέγων· Ἥμαρτον παραδοὺς αἷμα ⸀ἀθῷον. οἱ δὲ εἶπαν· Τί πρὸς ἡμᾶς; σὺ ⸀ὄψῃ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/004.yaml
  text: saying, “I have sinned by betraying innocent blood.” But they said, “What is that to us? You will see to it.”
translation:
  language: vi
  text: 'nói: “Tôi đã phạm tội vì đã giao nộp một người vô tội.” Nhưng họ đáp: “Việc đó can gì đến chúng ta? Anh tự lo lấy.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἥμαρτον
  choice: Tôi đã phạm tội
  rationale: Thì bất định chỉ hành động đã xảy ra; trong lời thú nhận trực tiếp, “đã phạm tội” tự nhiên và vẫn nhấn mạnh trách nhiệm hiện tại.
- source_word: παραδοὺς
  choice: vì nộp
  rationale: Phân từ bất định giải thích căn nguyên của tội được thú nhận. “Nộp” phù hợp mạch truyện Giu-đa giao nộp Chúa Giê-su, đồng thời giữ sắc thái cơ bản của παραδίδωμι mà không diễn giải quá mức thành “phản bội”.
- source_word: αἷμα ἀθῷον
  choice: huyết vô tội
  rationale: Giữ nguyên thành ngữ Kinh Thánh cô đọng về máu của người không có tội và trách nhiệm đối với cái chết bất công; không thêm rõ đối tượng mà tiếng Hy Lạp để ngầm.
- source_word: Τί πρὸς ἡμᾶς;
  choice: Can gì đến chúng ta?
  rationale: Cách nói tiếng Việt tự nhiên, ngắn gọn, truyền đạt đúng thái độ phủi bỏ sự liên can hay trách nhiệm.
- source_word: σὺ ὄψῃ
  choice: Anh tự lo lấy
  rationale: 'Thì tương lai trung động của ὁράω được dùng như một lời gạt bỏ có lực gần mệnh lệnh: người nghe phải tự giải quyết và chịu trách nhiệm. “Tự lo lấy” diễn đạt tự nhiên sắc thái ấy trong tiếng Việt.'
theological_decisions:
- issue: Có nên nói rõ “huyết vô tội” là huyết của Chúa Giê-su hay của một người vô tội không
  choice: Giữ đối tượng ngầm trong cụm “huyết vô tội”.
  alternative: “vì nộp một người vô tội cho người ta giết” hoặc “vì nộp huyết của người vô tội”
  rationale: Nguyên văn dùng thành ngữ αἷμα ἀθῷον và không nêu rõ danh tính hay bổ sung động từ “giết”; giữ cấu trúc này bảo toàn sức nặng pháp lý–đạo đức và không diễn giải vượt văn bản.
- issue: Sắc thái của σὺ ὄψῃ
  choice: 'Dịch theo chức năng bác bỏ trách nhiệm: “Anh tự lo lấy.”'
  alternative: “Anh sẽ liệu việc ấy” hoặc “Anh hãy xem xét”
  rationale: Hình thức là tương lai, nhưng trong ngữ cảnh đây là lối nói thành ngữ mang lực gần mệnh lệnh, đẩy trách nhiệm trở lại cho Giu-đa. Bản dịch giữ sự gay gắt mà không biến nó thành một tuyên bố tiên tri.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và dễ hiểu. “Huyết vô tội” được giữ vì là thành ngữ Kinh Thánh quen thuộc và cô đọng; “Can gì đến chúng ta?” cùng “Anh tự lo lấy” thể hiện giọng phủi trách nhiệm gay gắt của các thượng tế và trưởng lão.
