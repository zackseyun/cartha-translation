id: MAT.27.44
reference: Matthew 27:44
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: τὸ δ’ αὐτὸ καὶ οἱ λῃσταὶ οἱ συσταυρωθέντες ⸀σὺν αὐτῷ ὠνείδιζον αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/044.yaml
  text: In the same way[b][a], even the robbers who had been crucified with him were insulting him.
translation:
  language: vi
  text: Cũng vậy, ngay cả những tên cướp bị đóng đinh cùng Đức Giê-su cũng sỉ nhục Ngài.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “mắng nhiếc Ngài.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ δ’ αὐτὸ
  choice: Cũng vậy
  rationale: Cụm τὸ αὐτό ở đây có chức năng trạng từ, chỉ rằng những tên cướp cũng đối xử với Đức Giê-su theo cách vừa được kể. “Cũng vậy” tự nhiên và gọn trong tiếng Việt.
- source_word: καὶ
  choice: ngay cả ... cũng
  rationale: 'Trong ngữ cảnh, καί mang sắc thái nhấn mạnh: không chỉ những người qua đường và các lãnh đạo, mà ngay cả những người cùng chịu đóng đinh cũng tham gia sỉ nhục.'
- source_word: οἱ λῃσταὶ
  choice: những tên cướp
  rationale: ληστής thường chỉ kẻ cướp hoặc tên cướp; cách dịch này rõ nghĩa và không tự ý xác định họ là quân nổi dậy chính trị.
- source_word: οἱ συσταυρωθέντες σὺν αὐτῷ
  choice: bị đóng đinh cùng Đức Giê-su
  rationale: Phân từ thụ động bổ nghĩa cho những tên cướp, xác định họ là những người bị đóng đinh bên cạnh Đức Giê-su. Tiếng Việt không cần biểu thị thì quá khứ hoàn thành như tiếng Anh.
- source_word: ὠνείδιζον
  choice: sỉ nhục
  rationale: Động từ chỉ hành vi mắng nhiếc, nhục mạ. “Sỉ nhục” trang trọng vừa phải và dễ hiểu; ngữ cảnh kể chuyện cùng từ “cũng” truyền đạt việc họ tham gia hành động đang diễn ra.
- source_word: αὐτόν
  choice: Ngài
  rationale: Đại từ làm tân ngữ, chỉ Đức Giê-su; “Ngài” phù hợp với văn phong Kinh Thánh tiếng Việt hiện đại, trang nghiêm.
theological_decisions:
- issue: Có nên dung hòa với lời thuật của Lu-ca rằng một tội phạm đã nói khác hay không
  choice: 'Giữ nguyên chủ thể số nhiều của Ma-thi-ơ: những tên cướp bị đóng đinh cùng Đức Giê-su sỉ nhục Ngài.'
  alternative: Làm nhẹ hoặc đổi số nhiều để tránh căng thẳng bề ngoài giữa các sách Phúc Âm.
  rationale: Bản Hy Lạp dùng danh từ số nhiều οἱ λῃσταὶ và động từ số nhiều ὠνείδιζον. Bản dịch phải giữ lời thuật riêng của Ma-thi-ơ, không âm thầm dung hòa với Lu-ca.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, tự nhiên và trang nghiêm. Dùng “Đức Giê-su” để nêu rõ sở chỉ thay cho đại từ ở cụm giới từ, rồi dùng “Ngài” ở cuối câu. Dấu chú thích [a] được đặt ngay sau mệnh đề liên quan.
