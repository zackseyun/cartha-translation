id: MAT.27.51
reference: Matthew 27:51
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ τὸ καταπέτασμα τοῦ ναοῦ ἐσχίσθη ⸂ἀπ’ ἄνωθεν ἕως κάτω εἰς δύο⸃, καὶ ἡ γῆ ἐσείσθη, καὶ αἱ πέτραι ἐσχίσθησαν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/051.yaml
  text: And behold[a], the curtain of the temple was torn in two from top to bottom, and the earth shook, and the rocks were split.
translation:
  language: vi
  text: Kìa, bức màn trong đền thờ[a] bị xé làm đôi từ trên xuống dưới; đất rung chuyển và đá nứt ra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “bức màn của nơi thánh.” Từ Hy Lạp có thể chỉ bức màn bên trong đền thờ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: Kìa
  rationale: Giữ chức năng thu hút sự chú ý đột ngột và sắc thái kịch tính của lời thuật, đồng thời tự nhiên trong tiếng Việt hiện đại.
- source_word: καταπέτασμα τοῦ ναοῦ
  choice: bức màn trong đền thờ
  rationale: καταπέτασμα là bức màn che trong nơi thánh, còn ναός ở đây chỉ phần đền thánh; cách diễn đạt này rõ ràng, tự nhiên và không khiến người đọc hiểu là một tấm màn bất kỳ thuộc toàn bộ khuôn viên.
- source_word: ἐσχίσθη ... εἰς δύο
  choice: bị xé làm đôi
  rationale: Giữ thể bị động và kết quả chia thành hai phần mà không nêu tác nhân.
- source_word: ἀπ’ ἄνωθεν ἕως κάτω
  choice: từ trên xuống dưới
  rationale: Tương đương tự nhiên trong tiếng Việt, bảo toàn hướng của đường xé được câu nhấn mạnh.
- source_word: ἡ γῆ ἐσείσθη
  choice: đất rung chuyển
  rationale: γῆ có thể là đất, mặt đất hoặc trái đất; trong tiếng Việt, 'đất rung chuyển' vừa tự nhiên trong bối cảnh động đất vừa không xác định quá mức phạm vi địa lý.
- source_word: αἱ πέτραι ἐσχίσθησαν
  choice: đá nứt ra
  rationale: Dùng 'nứt ra' tự nhiên với đá và vẫn phản ánh σχίζω, cùng động từ nguồn đã được dịch là 'xé' khi nói về bức màn.
theological_decisions:
- issue: Ý nghĩa của dấu lạ tại đền thờ
  choice: Thuật lại trực tiếp việc bức màn bị xé mà không giải thích biểu tượng trong chính câu.
  alternative: Diễn giải đó là việc mở lối đến với Đức Chúa Trời hoặc là sự phán xét hệ thống đền thờ.
  rationale: Bản văn chỉ kể sự kiện cùng các dấu lạ đi kèm, không tự giải thích ý nghĩa thần học; bản dịch vì thế giữ nguyên sự căng thẳng và không thêm giáo giải.
- issue: Tác nhân làm bức màn bị xé
  choice: 'Giữ thể bị động: ''bị xé''.'
  alternative: Nêu rõ Đức Chúa Trời xé bức màn.
  rationale: Dạng bị động Hy Lạp không nêu tác nhân. Dù hướng xé có thể gợi hàm ý thần học, bản dịch không nên biến hàm ý ấy thành lời khẳng định minh nhiên.
- issue: Phạm vi của γῆ
  choice: Dịch là 'đất' thay vì xác định là toàn thể trái đất hay chỉ một vùng đất.
  alternative: Trái đất; xứ ấy; mặt đất.
  rationale: γῆ có độ rộng nghĩa theo ngữ cảnh. 'Đất rung chuyển' là cách nói tự nhiên và bảo tồn phần nào sự không xác định về phạm vi.
translation_notes:
  register: Văn phong trang trọng, sáng rõ và giàu nhịp điệu thuật sự. Dùng 'Kìa' để giữ lực nhấn của ἰδοὺ; dùng dấu chấm phẩy để phân định dấu lạ nơi đền thờ với các biến động tiếp theo mà vẫn giữ chúng trong một câu.
