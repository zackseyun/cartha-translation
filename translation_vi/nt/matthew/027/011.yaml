revisions:
- from: 'Đức Chúa Jêsus đứng trước mặt tổng đốc. Tổng đốc hỏi Ngài: “Ngươi có phải là Vua dân Do Thái không?” Đức Chúa Jêsus đáp: “Chính ông nói thế.”[a]'
  to: 'Giê-su đứng trước tổng đốc, và tổng đốc hỏi Người: “Ông có phải là Vua của người Do Thái[a] không?” Giê-su nói: “Ông nói vậy.”[b]'
  rationale: Bản sửa loại bỏ tước hiệu không có trong nguyên văn, hiện đại hóa tên riêng và đại từ xưng hô, đồng thời giữ câu trả lời của Giê-su gián tiếp, không giải quyết quá mức sắc thái của Σὺ λέγεις. Chú thích được bổ sung và đặt đúng tại các cụm từ liên quan.
  reviewer_model: gpt-5.6-terra
