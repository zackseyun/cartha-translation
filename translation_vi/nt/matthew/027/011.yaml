  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ὁ δὲ Ἰησοῦς ⸀ἐστάθη ἔμπροσθεν τοῦ ἡγεμόνος· καὶ ἐπηρώτησεν αὐτὸν ὁ ἡγεμὼν λέγων· Σὺ εἶ ὁ βασιλεὺς τῶν Ἰουδαίων; ὁ δὲ Ἰησοῦς ⸀ἔφη· Σὺ λέγεις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/011.yaml
  text: Jesus stood before the governor[a], and the governor questioned him, saying, “Are you the King of the Jews?” And Jesus said[b], “You say so.”
translation:
  language: vi
  text: 'Giê-su đứng trước tổng đốc, và tổng đốc hỏi Người: “Ông có phải là Vua của người Do Thái[a] không?” Giê-su nói: “Ông nói vậy.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hoặc “Vua của người Giu-đê.” Từ Hy Lạp này có thể chỉ người Do Thái nói chung hoặc, trong một số ngữ cảnh, người Giu-đê.
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “Ông nói thế,” hoặc “Đúng như ông nói.” Câu đáp trong tiếng Hy Lạp ngắn gọn và có phần hàm ý.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐστάθη
  choice: đứng
  rationale: Dạng aorist của ἵστημι ở đây tự nhiên nhất là “đứng”; không thêm ý bị ép phải đứng hay nhấn mạnh trạng thái kéo dài.
- source_word: ἔμπροσθεν
  choice: trước mặt
  rationale: Diễn đạt tự nhiên vị trí của Đức Chúa Jêsus trong khung cảnh xét xử, đồng thời giữ sắc thái trang trọng.
- source_word: ἡγεμών / ἡγεμόνος
  choice: tổng đốc
  rationale: Trong bối cảnh Phi-lát là viên chức cai trị La Mã, “tổng đốc” là cách gọi rõ ràng, quen thuộc và phù hợp hơn từ chung chung “nhà cai trị”.
- source_word: ἐπηρώτησεν
  choice: hỏi
  rationale: “Hỏi” là tiếng Việt tự nhiên và đủ thể hiện hành vi chất vấn trong bối cảnh tư pháp; “thẩm vấn” dễ làm sắc thái mạnh hơn nguyên văn.
- source_word: βασιλεὺς τῶν Ἰουδαίων
  choice: Vua dân Do Thái
  rationale: Cách diễn đạt quen thuộc và dễ hiểu, phản ánh tước hiệu mang ý nghĩa chính trị-dân tộc trong lời buộc tội; viết hoa “Vua” vì được dùng như một tước hiệu cụ thể.
- source_word: ἔφη
  choice: đáp
  rationale: Ngữ cảnh cho thấy đây là lời trả lời trực tiếp; “đáp” tự nhiên hơn việc lặp lại “nói” trong tiếng Việt mà không thêm nội dung.
- source_word: Σὺ λέγεις
  choice: Chính ông nói thế
  rationale: Giữ cấu trúc súc tích, gián tiếp và phần nào dè dặt của tiếng Hy Lạp, không biến câu trả lời thành một lời khẳng định hoàn toàn minh nhiên.
theological_decisions:
- issue: Sắc thái câu đáp Σὺ λέγεις của Đức Chúa Jêsus
  choice: “Chính ông nói thế” như một lời xác nhận gián tiếp, có chừng mực
  alternative: “Đúng như ông nói” như một lời xác nhận trực tiếp hơn
  rationale: Nguyên văn không phủ nhận danh xưng nhưng cũng không diễn đạt nó theo cách khẳng định thẳng trong khuôn khổ chính trị của tổng đốc. Bản dịch giữ nguyên sức căng và tính hàm súc ấy.
- issue: Phạm vi nghĩa của τῶν Ἰουδαίων
  choice: “dân Do Thái”
  alternative: “dân Giu-đê”
  rationale: Trong trình thuật thương khó, cụm từ này tự nhiên được hiểu là dân Do Thái trong công thức cáo buộc chính trị của La Mã; tuy vậy, khả năng chỉ người Giu-đê được ghi nhận trong chú thích.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “Đức Chúa Jêsus” và đại từ tôn kính “Ngài” theo văn phong Kinh Thánh Việt ngữ; trong lời của tổng đốc dùng “ngươi” để phản ánh quan hệ quyền lực của bối cảnh xét xử. Không thêm từ nối thời gian vì nguyên văn không có từ tương đương “bấy giờ/giờ đây”.
