  text: καὶ τὰ μνημεῖα ἀνεῴχθησαν καὶ πολλὰ σώματα τῶν κεκοιμημένων ἁγίων ⸀ἠγέρθησαν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/052.yaml
  text: And the tombs were opened[a], and many bodies of the saints who had fallen asleep were raised,
translation:
  language: vi
  text: Các ngôi mộ đã được mở ra, và nhiều thân thể của các thánh đã yên giấc[a] được sống dậy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Đã yên giấc” là cách nói uyển ngữ quen thuộc chỉ “đã chết.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: và
  rationale: Liên từ thông dụng, giữ phép nối các mệnh đề trong trình thuật mà không thêm sắc thái thời gian.
- source_word: τὰ μνημεῖα
  choice: các ngôi mộ
  rationale: μνημεῖον chỉ nơi chôn cất; “các ngôi mộ” tự nhiên, rõ nghĩa trong tiếng Việt hiện đại.
- source_word: ἀνεῴχθησαν
  choice: mở ra
  rationale: Dạng thụ động aorist cho biết các ngôi mộ chịu tác động; tiếng Việt có thể lược dấu hiệu bị động mà vẫn giữ đúng nghĩa, đồng thời không thêm cơ chế khiến mộ mở.
- source_word: πολλὰ σώματα
  choice: nhiều thân thể
  rationale: Giữ nghĩa trung tính của σῶμα và tránh từ “xác chết,” vốn mạnh hơn và có thể làm lu mờ sự kiện được sống dậy.
- source_word: τῶν κεκοιμημένων
  choice: đã an giấc
  rationale: Giữ hình ảnh uyển ngữ quen thuộc chỉ sự chết, đồng thời diễn đạt tự nhiên và trang trọng trong tiếng Việt.
- source_word: ἁγίων
  choice: những người thánh
  rationale: Dịch danh từ hóa ἅγιοι theo nghĩa những người thuộc về Đức Chúa Trời và được biệt riêng; tránh để “các thánh” bị hiểu hẹp theo một truyền thống giáo phái.
- source_word: ἠγέρθησαν
  choice: được sống dậy
  rationale: Trong ngữ cảnh người chết, cụm này truyền đạt rõ nghĩa bị làm cho trỗi dậy khỏi sự chết, nhưng không xác quyết thêm bản chất hay tính vĩnh viễn của sự sống lại.
theological_decisions:
- issue: Bản chất sự kiện được diễn tả bằng ἠγέρθησαν
  choice: được sống dậy
  alternative: được phục sinh; được làm cho trỗi dậy
  rationale: Động từ có thể chỉ việc sống lại từ cõi chết. “Được sống dậy” vừa tự nhiên trong tiếng Việt vừa không áp đặt kết luận hệ thống rằng đây là phục sinh vinh hiển hay chỉ là trở lại sự sống.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cấu trúc phối hợp của tiếng Hy Lạp được giữ lại; hình ảnh “an giấc” và sự dè dặt thần học của động từ ἠγέρθησαν cũng được bảo tồn.
