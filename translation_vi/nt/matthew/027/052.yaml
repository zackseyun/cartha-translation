- from: Các ngôi mộ mở ra, và nhiều thân thể của những người thánh đã an giấc[a] được sống dậy.
  to: Các ngôi mộ đã được mở ra, và nhiều thân thể của các thánh đã yên giấc[a] được sống dậy.
  rationale: Bản sửa làm rõ thể bị động của động từ “được mở ra,” thay cách gọi không tự nhiên bằng “các thánh,” và dùng uyển ngữ Việt ngữ tự nhiên hơn cho người đã chết. “Được sống dậy” được giữ để phản ánh trung tính động từ ἠγέρθησαν và không giải quyết trước bản chất của sự kiện.
