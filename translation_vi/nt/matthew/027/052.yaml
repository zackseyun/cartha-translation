  - severity: medium
    issue: Cụm “những người thánh” không tự nhiên
    rationale: Trong tiếng Việt Kinh Thánh hiện đại, “các thánh” là cách diễn đạt thông dụng và phù hợp hơn cho danh từ hóa ἁγίων, đồng thời không xác định danh tính của họ vượt quá bản văn.
  - severity: low
    issue: “Đã an giấc” kém tự nhiên như uyển ngữ về sự chết
    rationale: “Đã yên giấc” là thành ngữ Việt ngữ quen thuộc hơn trong nghĩa đã chết và vẫn giữ hình ảnh của κεκοιμημένων.
