  verdict: revise
  source_fidelity: 'Bản dịch theo sát các thành tố chính: μνημεῖα là mộ, σώματα là thân thể, và ἠγέρθησαν được diễn đạt trung tính là “được sống dậy.” Tuy nhiên, “mở ra” không biểu đạt rõ thể bị động của ἀνεῴχθησαν; thêm “được” giữ được việc các mộ nhận hành động mà không suy đoán tác nhân.'
  naturalness: “Những người thánh” không tự nhiên trong tiếng Việt hiện đại. “Các thánh” là cách gọi quen thuộc trong văn cảnh Kinh Thánh và không tự nó áp đặt một cách hiểu giáo phái. “Đã yên giấc” là uyển ngữ chỉ cái chết tự nhiên hơn “đã an giấc” trong câu này.
  terminology: Giữ “các thánh,” “thân thể,” và “được sống dậy.” Các lựa chọn này lần lượt phản ánh ἁγίων, σωμάτων, và ἠγέρθησαν mà không làm mạnh thành “xác chết” hay “phục sinh.”
