revisions:
- from: Bấy giờ, quân lính của tổng đốc đưa Đức Giê-su vào dinh tổng đốc[a] và tập hợp cả đội quân quanh ngài[b].
  to: Bấy giờ, lính của tổng đốc đưa Đức Giê-su vào dinh tổng đốc[a], rồi tập hợp toàn bộ đội binh quanh Ngài[b].
  rationale: Chỉnh nhẹ thuật ngữ chỉ đơn vị quân sự để tránh mở rộng nghĩa của σπεῖρα thành toàn quân, và điều chỉnh chú thích về πραιτώριον cho tự nhiên, bao quát hơn. Không thay đổi ý nghĩa hay mức độ tôn kính của bản văn.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T07:38:21Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch phản ánh đúng trình tự và các thành phần chính của câu Hy Lạp: quân lính thuộc tổng đốc đưa Đức Giê-su vào πραιτώριον rồi quy tụ toàn bộ σπεῖρα quanh Ngài. Tuy nhiên, “cả đội quân” trong tiếng Việt có thể gợi cả một đạo quân, rộng hơn đơn vị quân sự συγκεκριμένη σπεῖρα; nên dùng “toàn bộ đội binh” để vừa giữ sắc thái đơn vị vừa tránh quá rộng.'
  naturalness: Câu nhìn chung tự nhiên và trang trọng. Thêm “rồi” làm rõ hai hành động nối tiếp; “toàn bộ đội binh” tự nhiên hơn “cả đội quân” trong ngữ cảnh một đơn vị La Mã.
  terminology: “Tổng đốc” phù hợp với ἡγεμών trong ngữ cảnh này, và “dinh tổng đốc” truyền đạt được πραιτώριον. Chú thích nên dùng “trụ sở” thay cho “tổng hành dinh” như lựa chọn thay thế trực tiếp, đồng thời vẫn nêu cả nơi ở chính thức lẫn bản doanh quân sự. “Đội binh” là cách gọi thích hợp hơn “đội quân” cho σπεῖρα.
  issues:
  - severity: low
    issue: “Cả đội quân” có thể bị hiểu là toàn quân thay vì một đơn vị quân sự La Mã.
    rationale: σπεῖρα chỉ một đơn vị quân sự (thường được gọi là cohort), không phải toàn bộ lực lượng quân đội. “Toàn bộ đội binh” giữ được ý ὅλην và quy mô đơn vị tốt hơn.
  - severity: low
    issue: Chú thích a dùng “tổng hành dinh” như lựa chọn thay thế duy nhất.
    rationale: πραιτώριον có thể là nơi ở chính thức hoặc trụ sở/bản doanh của tổng đốc; “trụ sở của tổng đốc” là cách thay thế bao quát và tự nhiên hơn, trong khi phần giải thích vẫn có thể nêu rõ hai khả năng.
  revised_text: Bấy giờ, lính của tổng đốc đưa Đức Giê-su vào dinh tổng đốc[a], rồi tập hợp toàn bộ đội binh quanh Ngài[b].
