  text: Τότε οἱ στρατιῶται τοῦ ἡγεμόνος παραλαβόντες τὸν Ἰησοῦν εἰς τὸ πραιτώριον συνήγαγον ἐπ’ αὐτὸν ὅλην τὴν σπεῖραν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/027.yaml
  text: Then the governor’s soldiers took Jesus into the praetorium and gathered the whole cohort around him[a][b].
translation:
  language: vi
  text: Bấy giờ, lính của tổng đốc đưa Đức Giê-su vào dinh tổng đốc[a], rồi tập hợp toàn bộ đội binh quanh Ngài[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “trụ sở của tổng đốc.” Từ Hy Lạp chỉ nơi ở chính thức hoặc tổng hành dinh quân sự của tổng đốc La Mã.
    reason: lexical_alternative
  - marker: b
    text: “Đội binh” dịch một thuật ngữ quân sự La Mã chỉ một đơn vị, thường gọi là “cohort”; câu này không nhất thiết có nghĩa là mọi binh sĩ thuộc đủ biên chế của đơn vị đều hiện diện.
    reason: cultural_note
lexical_decisions:
- source_word: Τότε
  choice: Bấy giờ
  rationale: Diễn đạt tự nhiên từ nối thời gian, đánh dấu sự kiện kế tiếp trong trình thuật.
- source_word: οἱ στρατιῶται τοῦ ἡγεμόνος
  choice: quân lính của tổng đốc
  rationale: Giữ rõ quan hệ giữa binh lính và viên tổng đốc La Mã, đồng thời phù hợp với tiếng Việt hiện đại.
- source_word: παραλαβόντες τὸν Ἰησοῦν
  choice: đưa Đức Giê-su
  rationale: Phân từ παραλαβόντες chỉ việc tiếp nhận rồi dẫn Đức Giê-su theo; “đưa” tự nhiên trong ngữ cảnh áp giải mà không thêm ý quá mức.
- source_word: εἰς τὸ πραιτώριον
  choice: vào dinh tổng đốc
  rationale: πραιτώριον chỉ nơi ở hoặc tổng hành dinh chính thức của tổng đốc; cách dịch này dễ hiểu hơn một từ phiên âm xa lạ, còn phạm vi nghĩa được nêu ở chú thích.
- source_word: συνήγαγον ἐπ’ αὐτὸν
  choice: tập hợp ... quanh ngài
  rationale: Diễn tả việc quân lính tụ lại hướng về và bao quanh Đức Giê-su trong cảnh này.
- source_word: ὅλην τὴν σπεῖραν
  choice: cả đội quân
  rationale: σπεῖρα là thuật ngữ chỉ một đơn vị quân đội La Mã; “đội quân” dễ hiểu, còn sắc thái kỹ thuật và giới hạn của từ được bảo tồn trong chú thích.
