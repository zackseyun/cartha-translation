id: MAT.27.3
reference: Matthew 27:3
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Τότε ἰδὼν Ἰούδας ὁ ⸀παραδιδοὺς αὐτὸν ὅτι κατεκρίθη μεταμεληθεὶς ⸀ἔστρεψεν τὰ τριάκοντα ἀργύρια τοῖς ἀρχιερεῦσιν ⸀καὶ πρεσβυτέροις
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/003.yaml
  text: Then Judas[a], who had betrayed him, seeing that he had been condemned[b], regretted it and returned the thirty pieces of silver to the chief priests and elders.
translation:
  language: vi
  text: Bấy giờ, khi Giu-đa, người đã phản bội Đức Giê-su, thấy Ngài đã bị kết án, ông hối hận và đem trả ba mươi đồng bạc[a] cho các thượng tế và trưởng lão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “ba mươi miếng bạc.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Bấy giờ
  rationale: Dấu nối thời gian mở đầu diễn biến kế tiếp; “Bấy giờ” tự nhiên và trang trọng trong văn thuật chuyện.
- source_word: ἰδὼν
  choice: khi ... thấy
  rationale: Phân từ bất định quá khứ của ὁράω mang sắc thái thời gian; chuyển thành mệnh đề “khi ... thấy” giúp câu tiếng Việt rõ và tự nhiên.
- source_word: Ἰούδας
  choice: Giu-đa
  rationale: Dạng phiên âm quen thuộc của tên riêng Judas trong tiếng Việt.
- source_word: ὁ παραδιδοὺς αὐτόν
  choice: kẻ đã phản bội Đức Giê-su
  rationale: Phân từ hiện tại có mạo từ dùng để nhận diện Giu-đa qua hành động của ông; “đã phản bội” phù hợp ngữ cảnh, còn nêu “Đức Giê-su” giúp tránh đại từ mơ hồ trong tiếng Việt.
- source_word: ὅτι κατεκρίθη
  choice: Ngài bị kết án
  rationale: ὅτι nêu nội dung điều Giu-đa thấy; κατεκρίθη là bất định quá khứ bị động, chỉ việc Đức Giê-su bị tuyên án.
- source_word: μεταμεληθεὶς
  choice: hắn hối hận
  rationale: μεταμέλομαι diễn tả sự ân hận/nuối tiếc, không nhất thiết mang trọn ý nghĩa thần học của sự ăn năn; “hối hận” giữ đúng mức độ nghĩa.
- source_word: ἔστρεψεν
  choice: đem trả
  rationale: Trong ngữ cảnh tiền bạc được hoàn lại cho những người đã đưa tiền, “đem trả” là cách diễn đạt tự nhiên và chính xác.
- source_word: τὰ τριάκοντα ἀργύρια
  choice: ba mươi đồng bạc
  rationale: ἀργύρια chỉ những đơn vị tiền bằng bạc; “đồng bạc” rõ nghĩa trong tiếng Việt hiện đại mà không xác định loại tiền ngoài điều văn bản nói.
- source_word: τοῖς ἀρχιερεῦσιν καὶ πρεσβυτέροις
  choice: cho các thượng tế và trưởng lão
  rationale: Các cách gọi quen thuộc và chính xác dành cho hai nhóm lãnh đạo Do Thái trong Ma-thi-ơ.
theological_decisions:
- issue: Ý nghĩa của μεταμεληθεὶς đối với phản ứng của Giu-đa
  choice: hối hận
  alternative: ăn năn; đổi ý
  rationale: Động từ là μεταμέλομαι chứ không phải μετανοέω. “Hối hận” diễn tả cảm xúc và nhận thức đạo đức của Giu-đa nhưng không tự ý kết luận về tình trạng thuộc linh hay sự ăn năn trọn vẹn của ông.
- issue: Sắc thái của παραδίδωμι trong vai trò của Giu-đa
  choice: phản bội
  alternative: nộp; giao nộp
  rationale: “Phản bội” truyền đạt đúng ý nghĩa theo ngữ cảnh về hành động giao Đức Giê-su cho đối phương, trong khi nghĩa đen “giao nộp” vẫn có thể có nhưng kém thể hiện vai trò nhận diện của Giu-đa ở đây.
translation_notes:
  register: Văn phong thuật chuyện hiện đại, trang trọng và dễ hiểu. Dùng “Đức Giê-su/Ngài” để làm rõ đối tượng của các động từ, và “hắn” cho Giu-đa nhằm tránh chuỗi đại từ nhập nhằng; không dùng “ăn năn” để khỏi diễn giải quá mức μεταμέλομαι.
