source:
  edition: SBLGNT
  text: Ἐξερχόμενοι δὲ εὗρον ἄνθρωπον Κυρηναῖον ὀνόματι Σίμωνα· τοῦτον ἠγγάρευσαν ἵνα ἄρῃ τὸν σταυρὸν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/032.yaml
  text: And as they were going out[a], they found a man of Cyrene named Simon[b]. They compelled him to carry his cross.
translation:
  language: vi
  text: Khi họ đang đi ra, họ gặp một người quê ở Ky-rê-nê tên là Si-môn. Họ bắt ông ấy[a] vác thập tự giá của Ngài.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Động từ Hy Lạp chỉ việc cưỡng bách hoặc trưng dụng một người để phục dịch theo thẩm quyền.
    reason: lexical_alternative
  - marker: b
    text: Tức là thập tự giá của Chúa Giê-su. Nguyên văn dùng một đại từ sở hữu ngôi ba số ít.
    reason: referent_clarification
lexical_decisions:
- source_word: Ἐξερχόμενοι
  choice: Khi họ đang đi ra
  rationale: Phân từ hiện tại mang ý nghĩa thời gian, diễn tả hành động đang diễn ra đồng thời với việc họ gặp Si-môn.
- source_word: δὲ
  choice: không dịch thành một từ nối riêng
  rationale: δέ chỉ nhẹ nhàng tiếp nối mạch kể; trong tiếng Việt, quan hệ nối tiếp đã rõ qua cấu trúc câu nên thêm “và” sẽ kém tự nhiên.
- source_word: εὗρον
  choice: họ gặp
  rationale: Trong ngữ cảnh gặp một người trên đường, “gặp” tự nhiên hơn “tìm thấy” mà vẫn truyền đạt đúng εὗρον.
- source_word: ἄνθρωπον Κυρηναῖον
  choice: một người quê ở Ky-rê-nê
  rationale: Κυρηναῖον xác định xuất xứ địa lý. “Quê ở Ky-rê-nê” rõ nghĩa và tự nhiên trong tiếng Việt hiện đại.
- source_word: ὀνόματι Σίμωνα
  choice: tên là Si-môn
  rationale: Đây là cách diễn đạt tự nhiên của thành ngữ Hy Lạp dùng ὀνόματι kèm tên riêng.
- source_word: τοῦτον
  choice: ông ấy
  rationale: Đại từ chỉ định nhắc lại chính người vừa được giới thiệu. “Ông ấy” tự nhiên hơn “người này” trong lời kể tiếng Việt.
- source_word: ἠγγάρευσαν
  choice: bắt
  rationale: Động từ chỉ việc nhà chức trách cưỡng bách một người phục dịch. “Bắt” truyền đạt rõ tính cưỡng chế; chú thích ghi nhận sắc thái trưng dụng theo thẩm quyền.
- source_word: ἵνα ἄρῃ
  choice: vác
  rationale: ἵνα với thể giả định nêu mục đích; tiếng Việt diễn đạt tự nhiên bằng kết cấu “bắt… vác”. Trong ngữ cảnh này, αἴρω có nghĩa mang/vác.
- source_word: τὸν σταυρὸν
  choice: thập tự giá
  rationale: Đây là cách gọi quen thuộc, trang trọng và chính xác của σταυρός; nguyên văn không đòi hỏi cách hiểu hẹp hơn là riêng thanh ngang.
- source_word: αὐτοῦ
  choice: của Ngài
  rationale: Đại từ thuộc hữu chỉ về Chúa Giê-su theo ngữ cảnh. “Ngài” giữ hình thức đại từ của nguyên văn và tránh khiến độc giả hiểu lầm thập tự giá thuộc về Si-môn.
theological_decisions:
- issue: Đối tượng mà αὐτοῦ (“của người ấy/của Ngài”) chỉ về
  choice: Hiểu là Chúa Giê-su và dịch “thập tự giá của Ngài”
  alternative: “thập tự giá của Chúa Giê-su” hoặc dịch sát hình thức hơn là “thập tự giá của ông ấy”
  rationale: Mạch tường thuật cho thấy đó là thập tự giá của Chúa Giê-su; không có sự mơ hồ thực sự về sự việc. Tuy vậy, bản dịch giữ đại từ thay vì thay bằng danh xưng, còn chú thích làm rõ đối tượng để tránh đại từ tiếng Việt bị hiểu là chỉ về Si-môn.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Tên riêng được phiên âm theo lối quen dùng trong Kinh Thánh tiếng Việt. Kết cấu “bắt ông ấy vác” gọn, tự nhiên và vẫn giữ sắc thái cưỡng bách của nguyên văn.
