    issue: “Nhưng” dịch καὶ ở đầu câu.
    rationale: Bản Hy Lạp dùng καὶ, một liên từ phối hợp (“và”), không dùng ἀλλά hay liên từ đối lập. Dù văn mạch có thể gợi sự tương phản, “nhưng” thêm sắc thái đối lập không được biểu thị trực tiếp trong câu nguồn.
  revised_text: Và Đức Giê-su không đáp lại ông dù chỉ một lời nào, khiến tổng đốc vô cùng kinh ngạc.
