  text: And he did not answer him with even one word[b][a], so that the governor was greatly amazed.
translation:
  language: vi
  text: Và Đức Giê-su không đáp lại ông dù chỉ một lời nào, khiến tổng đốc vô cùng kinh ngạc.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη αὐτῷ
  choice: đáp lại ông
  rationale: Động từ ἀποκρίνομαι có nghĩa thông dụng là “trả lời, đáp lại”; đại từ αὐτῷ chỉ người được đáp, trong ngữ cảnh là Phi-lát. Cách diễn đạt này tự nhiên và giữ rõ quan hệ giữa hai người.
- source_word: πρὸς οὐδὲ ἓν ῥῆμα
  choice: dù chỉ một lời
  rationale: Cụm phủ định nhấn mạnh rằng Đức Giê-su hoàn toàn không trả lời. “Dù chỉ một lời” chuyển tải tự nhiên οὐδὲ ἓν và hiểu ῥῆμα theo nghĩa thông dụng là “lời”.
- source_word: ὥστε
  choice: khiến
  rationale: ὥστε mở đầu mệnh đề chỉ kết quả; “khiến” diễn đạt gọn và tự nhiên quan hệ hệ quả trong tiếng Việt.
- source_word: τὸν ἡγεμόνα
  choice: tổng đốc
  rationale: Trong bối cảnh hành chính La Mã, ἡγεμών chỉ Phi-lát với tư cách người đứng đầu tỉnh; “tổng đốc” là cách gọi chính xác và quen thuộc trong văn cảnh Kinh Thánh tiếng Việt.
- source_word: θαυμάζειν ... λίαν
  choice: vô cùng kinh ngạc
  rationale: θαυμάζω diễn tả sự kinh ngạc, còn λίαν nhấn mạnh mức độ cao. “Vô cùng kinh ngạc” trang trọng, rõ nghĩa và tự nhiên.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Giê-su” để xác định chủ thể vốn được hàm ẩn trong hình thái động từ Hy Lạp, tránh đại từ mơ hồ trong câu đứng riêng; không thêm diễn giải thần học.
