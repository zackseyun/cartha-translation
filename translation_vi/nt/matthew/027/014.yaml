- from: Nhưng Đức Giê-su không đáp lại ông dù chỉ một lời, khiến tổng đốc vô cùng kinh ngạc.
  to: Và Đức Giê-su không đáp lại ông dù chỉ một lời nào, khiến tổng đốc vô cùng kinh ngạc.
  rationale: Thay “Nhưng” bằng “Và” để phản ánh καὶ mà không thêm quan hệ đối lập. Thêm “nào” sau “một lời” giúp diễn đạt phủ định nhấn mạnh οὐδὲ ἓν cách tự nhiên trong tiếng Việt, không thay đổi nghĩa. Các lựa chọn còn lại được giữ nguyên vì trung thành với văn bản Hy Lạp và phù hợp văn phong hiện đại.
