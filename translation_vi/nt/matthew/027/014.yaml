  source_fidelity: 'Cần sửa liên từ đầu câu: καὶ có nghĩa cơ bản là “và”, không phải “nhưng”. Các thành phần còn lại chuyển tải đúng: sự không đáp, nhấn mạnh “dù chỉ một lời”, kết quả khiến vị tổng đốc hết sức kinh ngạc.'
  naturalness: Câu dịch nhìn chung tự nhiên, trang trọng và phù hợp tiếng Việt hiện đại. “Và” ở đầu câu giữ liên kết với câu trước mà vẫn tự nhiên trong văn mạch tường thuật.
  terminology: “Đức Giê-su” phù hợp quy ước bản dịch; “tổng đốc” là cách gọi quen thuộc và chấp nhận được cho ἡγεμών trong ngữ cảnh Phi-lát. Không có thuật ngữ thần học cần điều chỉnh.
  issues:
