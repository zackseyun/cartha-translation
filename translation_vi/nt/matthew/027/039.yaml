  text: οἱ δὲ παραπορευόμενοι ἐβλασφήμουν αὐτὸν κινοῦντες τὰς κεφαλὰς αὐτῶν
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/039.yaml
  text: And those passing by were blaspheming him[a], shaking their heads[b],
translation:
  language: vi
  text: Còn những người đi ngang qua cứ báng bổ Ngài[a] và lắc đầu[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “lăng mạ Ngài” hoặc “phỉ báng Ngài”. Động từ Hy Lạp có thể chỉ lời xúc phạm hay vu khống, chứ không chỉ sự báng bổ theo nghĩa hẹp là lời nói chống lại Đức Chúa Trời.
    reason: lexical_alternative
  - marker: b
    text: Đây là cử chỉ khinh miệt hoặc chế giễu; so sánh Thi Thiên 22:7.
    reason: cross_reference
lexical_decisions:
- source_word: οἱ δὲ
  choice: Còn những người
  rationale: δέ là từ nối nhẹ trong mạch kể chuyện; “Còn” chuyển sang nhóm người đi ngang qua mà không nhấn mạnh sự đối lập quá mức. Mạo từ đi với phân từ tạo thành danh từ chỉ người.
- source_word: παραπορευόμενοι
  choice: đi ngang qua
  rationale: Phân từ hiện tại chỉ những người đang đi qua nơi đóng đinh; cách diễn đạt này tự nhiên và giữ được sắc thái hành động đang diễn ra.
- source_word: ἐβλασφήμουν
  choice: cứ báng bổ
  rationale: Thì chưa hoàn thành diễn tả hành động tiếp diễn hoặc lặp lại; “cứ” thể hiện sắc thái ấy. “Báng bổ” giữ sức nặng của βλασφημέω, đồng thời chú thích nêu nghĩa rộng hơn là lăng mạ hoặc phỉ báng.
- source_word: αὐτὸν
  choice: Ngài
  rationale: Đại từ làm tân ngữ, chỉ về Chúa Giê-su; “Ngài” phù hợp với văn phong Kinh Thánh tiếng Việt hiện đại và trang trọng.
- source_word: κινοῦντες
  choice: lắc
  rationale: Phân từ chỉ cử chỉ xảy ra đồng thời với lời báng bổ; “lắc” là cách diễn đạt rõ ràng, tự nhiên trong tiếng Việt.
- source_word: τὰς κεφαλὰς αὐτῶν
  choice: đầu
  rationale: Tiếng Việt tự nhiên dùng “lắc đầu” ở dạng số ít chung, dù nguyên văn Hy Lạp dùng số nhiều để nói đầu của từng người.
theological_decisions:
- issue: Sắc thái của βλασφημέω khi lời nói nhắm vào Chúa Giê-su trong trình thuật thương khó
  choice: Dùng “báng bổ” trong chính văn
  alternative: lăng mạ; phỉ báng
  rationale: “Báng bổ” giữ được sức nặng và khả năng gợi ý thần học của động từ Hy Lạp mà không trực tiếp khẳng định thêm một kết luận tín lý. Chú thích bảo tồn nghĩa rộng của từ khi dùng cho lời xúc phạm một người.
translation_notes:
  register: Bản dịch dùng tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. “Cứ” truyền đạt hành động kéo dài của thì chưa hoàn thành; “lắc đầu” là thành ngữ tự nhiên trong tiếng Việt. Dấu phẩy cuối câu được giữ vì câu tiếp tục sang câu kế tiếp.
