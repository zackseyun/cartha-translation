id: MAT.27.9
reference: Matthew 27:9
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: τότε ἐπληρώθη τὸ ῥηθὲν διὰ Ἰερεμίου τοῦ προφήτου λέγοντος· Καὶ ἔλαβον τὰ τριάκοντα ἀργύρια, τὴν τιμὴν τοῦ τετιμημένου ὃν ἐτιμήσαντο ἀπὸ υἱῶν Ἰσραήλ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/009.yaml
  text: Then what was spoken through Jeremiah the prophet was fulfilled[a], saying, ‘And they took the thirty pieces of silver, the price of the one who had been valued[b], whom they valued from among the sons of Israel,’
translation:
  language: vi
  text: 'Bấy giờ, lời được phán qua nhà tiên tri Giê-rê-mi đã được ứng nghiệm[a], như sau: “Họ đã lấy ba mươi miếng bạc, là giá của người đã bị định giá, người mà họ đã định giá từ trong số con cái Ít-ra-ên[b],”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma-thi-ơ quy lời tiên tri này cho Giê-rê-mi. Câu chữ gần với Xa-cha-ri 11:12–13 nhất. Có nhiều cách giải thích: đây là một lời trích dẫn tổng hợp, là lời dẫn từ một tuyển tập hoặc nhóm sách tiên tri gắn với Giê-rê-mi, hoặc là một vấn đề phát sinh trong quá trình truyền chép văn bản.'
    reason: textual_variant
  - marker: b
    text: Cụm từ Hy Lạp ở đây khó hiểu. Cũng có thể dịch là “bởi con cái Ít-ra-ên”; nếu hiểu theo nghĩa bộ phận, câu có thể nói đến “một số người trong con cái Ít-ra-ên.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Bấy giờ
  rationale: Đánh dấu trình tự của câu chuyện một cách ngắn gọn, tự nhiên và trang trọng.
- source_word: ἐπληρώθη τὸ ῥηθὲν
  choice: lời đã được phán ... được ứng nghiệm
  rationale: Giữ thể bị động và công thức ứng nghiệm đặc trưng của Ma-thi-ơ, đồng thời diễn đạt tự nhiên trong tiếng Việt.
- source_word: διὰ Ἰερεμίου τοῦ προφήτου
  choice: qua nhà tiên tri Giê-rê-mi
  rationale: “Qua” phản ánh διά với sở hữu cách, trình bày nhà tiên tri như trung gian truyền lời.
- source_word: ἔλαβον
  choice: họ đã lấy
  rationale: Phù hợp với ngữ cảnh khoản tiền bạc và giữ chủ thể số nhiều của lời trích dẫn.
- source_word: τὰ τριάκοντα ἀργύρια
  choice: ba mươi miếng bạc
  rationale: Diễn đạt rõ đây là những đơn vị tiền bằng bạc mà không xác định loại tiền cụ thể ngoài nguồn văn bản.
- source_word: τὴν τιμὴν τοῦ τετιμημένου
  choice: giá của người đã bị định giá
  rationale: Giữ sắc thái thương mại và thể bị động của phân từ hoàn thành, đồng thời bảo toàn lối lặp từ của nguyên bản.
- source_word: ὃν ἐτιμήσαντο
  choice: người mà họ đã định giá
  rationale: Lặp lại “định giá” để phản ánh việc cùng một động từ τιμάω xuất hiện liên tiếp trong tiếng Hy Lạp.
- source_word: ἀπὸ υἱῶν Ἰσραήλ
  choice: từ trong số con cái Ít-ra-ên
  rationale: Giữ giới từ ἀπό và khả năng mang nghĩa bộ phận, nhưng chú thích vì cấu trúc Hy Lạp khó hiểu và có thể được phân tích theo cách khác.
theological_decisions:
- issue: Ma-thi-ơ quy lời tiên tri này cho Giê-rê-mi, trong khi câu chữ gần Xa-cha-ri 11:12–13 nhất
  choice: Giữ nguyên “nhà tiên tri Giê-rê-mi” trong chính văn
  alternative: Đổi thành Xa-cha-ri hoặc hòa giải ngầm bằng cách bỏ tên nhà tiên tri
  rationale: SBLGNT ghi rõ Giê-rê-mi. Bản dịch không sửa tên hay tự giải quyết vấn đề quy nguồn; chú thích trình bày các cách giải thích chính mà không áp đặt một cách.
- issue: Cách hiểu cụm ἀπὸ υἱῶν Ἰσραήλ
  choice: “từ trong số con cái Ít-ra-ên”
  alternative: “bởi con cái Ít-ra-ên” hoặc hiểu theo nghĩa bộ phận là “một số người trong con cái Ít-ra-ên”
  rationale: Cụm Hy Lạp khó xác định quan hệ cú pháp. Chính văn giữ gần cấu trúc nguồn, còn chú thích bảo tồn những khả năng thực sự.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. “Định giá” được lặp có chủ ý để phản ánh phép lặp τιμάω trong nguyên bản và giữ nét mỉa mai thương mại. “Con cái Ít-ra-ên” bảo toàn cách gọi tập thể của υἱῶν Ἰσραήλ.
