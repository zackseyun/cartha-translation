  source_fidelity: Bản dịch giữ đúng tên Giê-rê-mi, công thức ứng nghiệm, số tiền, và sự lặp lại của τιμάω. Tuy nhiên, λέγοντος nên được thể hiện rõ bằng một công thức dẫn lời như “như sau”, và trật tự “lời đã được phán ... được ứng nghiệm” cần chỉnh nhẹ để câu tiếng Việt sáng hơn mà vẫn giữ bị động.
  naturalness: “Bấy giờ” và “qua nhà tiên tri Giê-rê-mi” phù hợp văn phong Kinh Thánh tiếng Việt hiện đại. Câu dẫn được chỉnh thành “lời được phán ... đã được ứng nghiệm, như sau” tự nhiên hơn. Cấu trúc cuối câu vẫn cố ý giữ phần nào sự khó hiểu của nguyên ngữ; chú thích giải thích các khả năng.
  terminology: Giữ nhất quán Giê-rê-mi, Xa-cha-ri, Ít-ra-ên, “miếng bạc”, và “định giá”. “Con cái Ít-ra-ên” là cách gọi tập thể quen thuộc trong tiếng Việt Kinh Thánh. Chú thích a được chỉnh để nói chính xác hơn về giả thuyết một tuyển tập tiên tri được đặt dưới tên/đứng đầu bởi Giê-rê-mi, không khẳng định đó là sự kiện.
