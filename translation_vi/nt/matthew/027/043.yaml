id: MAT.27.43
reference: Matthew 27:43
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: πέποιθεν ἐπὶ τὸν θεόν, ῥυσάσθω ⸀νῦν εἰ θέλει αὐτόν· εἶπεν γὰρ ὅτι Θεοῦ εἰμι υἱός.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/043.yaml
  text: He has trusted in God[a]; let God rescue him now, if he wants him, for he said[b], ‘I am the Son of God.’
translation:
  language: vi
  text: 'Ông ta đã tin cậy nơi Đức Chúa Trời; bây giờ, nếu Ngài muốn ông ta[a], thì Ngài hãy giải cứu ông ta đi, vì ông ta đã nói[b]: “Ta là Con Đức Chúa Trời.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể hiểu: “nếu Ngài hài lòng về ông ta.” Cách nói này gợi lại Thi Thiên 22:8, nơi ý về sự ưu ái của Đức Chúa Trời nổi bật hơn.'
    reason: alternative_reading
  - marker: b
    text: Lời chế nhạo này gợi lại sát Thi Thiên 22:8, qua đó nối sự nhạo báng Chúa Giê-xu với người công chính chịu khổ trong thi thiên ấy.
    reason: cross_reference
lexical_decisions:
- source_word: πέποιθεν ἐπὶ τὸν θεόν
  choice: đã tin cậy Đức Chúa Trời
  rationale: Thể hoàn thành diễn tả một sự tin cậy đã được đặt nơi Đức Chúa Trời và vẫn còn hiệu lực; “đã tin cậy” giữ được sắc thái ấy mà vẫn tự nhiên trong tiếng Việt.
- source_word: ῥυσάσθω νῦν
  choice: bây giờ ... hãy giải cứu ... đi
  rationale: ῥύομαι chỉ việc giải thoát khỏi hiểm nguy; “giải cứu” rõ nghĩa và “bây giờ ... đi” truyền đạt tính tức thời cùng giọng thách thức của mệnh lệnh.
- source_word: εἰ θέλει αὐτόν
  choice: nếu Ngài muốn ông ta
  rationale: θέλω trước hết có nghĩa là muốn hoặc mong muốn. Cách dịch này bám sát câu Hy Lạp và không tự động chuyển sang nghĩa diễn giải “đoái thương” hay “hài lòng về”.
- source_word: εἶπεν γὰρ ὅτι
  choice: 'vì ông ta đã nói:'
  rationale: Động từ aorist được diễn đạt bằng quá khứ đơn; chuyển nội dung sang lời dẫn trực tiếp giúp câu tiếng Việt sáng rõ mà không đổi ý.
- source_word: Θεοῦ εἰμι υἱός
  choice: Ta là Con Đức Chúa Trời
  rationale: Trong mạch văn Ma-thi-ơ, đây là danh xưng Cơ Đốc học xác định, không phải lời nói chung rằng mình là một người con của Đức Chúa Trời.
theological_decisions:
- issue: Sắc thái của θέλει αὐτόν trong lời chế nhạo
  choice: nếu Ngài muốn ông ta
  alternative: nếu Ngài hài lòng về ông ta / nếu Ngài đoái thương ông ta
  rationale: Nghĩa thông thường của θέλω là “muốn”; tuy câu này gợi lại Thi Thiên 22:8 và có thể hàm ý sự ưu ái hay hài lòng, bản dịch chính giữ cách nói trực tiếp và ghi nhận sắc thái kia trong chú thích.
- issue: Cách hiểu Θεοῦ ... υἱός
  choice: Con Đức Chúa Trời
  alternative: một người con của Đức Chúa Trời
  rationale: Dù υἱός không có mạo từ trong cấu trúc vị ngữ, ngữ cảnh sách Ma-thi-ơ cho thấy đây là một danh xưng được nhận biết; cách dịch bất định sẽ làm yếu đi lực của lời tuyên bố đang bị đem ra chế nhạo.
- issue: Chủ thể ngầm của ῥυσάσθω và θέλει
  choice: dùng “Ngài” để chỉ Đức Chúa Trời
  alternative: để chủ thể ngầm như nguyên văn
  rationale: Tiếng Hy Lạp dựa vào “Đức Chúa Trời” ở vế trước làm chủ thể được hiểu ngầm. Lặp đại từ “Ngài” trong tiếng Việt làm rõ quan hệ cú pháp mà không thêm một tác nhân mới.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Ông ta” giữ khoảng cách của những người đang chế nhạo mà không dùng đại từ miệt thị quá mạnh; “Ngài” phân biệt rõ Đức Chúa Trời. Trật tự câu được điều chỉnh nhẹ để tiếng Việt tự nhiên, đồng thời giữ nguyên sức nặng của lời thách thức.
