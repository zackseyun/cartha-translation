base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/042.yaml
  text: He saved others; he cannot save himself. He is the King of Israel; let him come down now from the cross[a], and we will believe in him.
translation:
  language: vi
  text: Ông ta đã cứu người khác, nhưng chính mình thì không thể cứu. Ông ta là Vua của Ít-ra-ên; bây giờ cứ xuống khỏi thập tự giá đi[a], rồi chúng ta sẽ tin vào ông ta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể hiểu: “Nếu ông ta là Vua của Ít-ra-ên thì bây giờ cứ xuống khỏi thập tự giá đi, rồi chúng ta sẽ tin vào ông ta.” Một số bản dịch làm rõ ý chế nhạo bằng cách thêm sắc thái điều kiện, nhưng câu Hy Lạp ở đây trực tiếp nêu tước hiệu này.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἄλλους ἔσωσεν
  choice: Người khác thì hắn đã cứu
  rationale: Giữ động từ ở thì quá khứ và làm nổi bật thế đối lập mang tính chế nhạo với “chính mình”; “cứu” bảo toàn phạm vi nghĩa rộng của σῴζω.
- source_word: ἑαυτὸν οὐ δύναται σῶσαι
  choice: còn chính mình thì không thể cứu
  rationale: Diễn đạt tự nhiên cấu trúc phản thân và δύναται + động từ nguyên mẫu, đồng thời giữ nguyên sức nặng của lời nhạo báng.
- source_word: βασιλεὺς Ἰσραήλ ἐστιν
  choice: Hắn là Vua của Ít-ra-ên
  rationale: Dịch như một mệnh đề khẳng định đúng theo câu Hy Lạp, không tự ý thêm điều kiện “nếu”; “hắn” phù hợp giọng khinh miệt trực tiếp trong ngữ cảnh.
- source_word: καταβάτω νῦν ἀπὸ τοῦ σταυροῦ
  choice: bây giờ cứ xuống khỏi thập tự giá đi
  rationale: “Cứ… đi” chuyển tải tự nhiên mệnh lệnh ngôi thứ ba mang sắc thái thách thức; “bây giờ” giữ tính cấp thời của νῦν.
- source_word: πιστεύσομεν ἐπ’ αὐτόν
  choice: rồi chúng ta sẽ tin hắn
  rationale: “Tin” với đối tượng là một người diễn đạt hướng quy chiếu của ἐπί + đối cách; “rồi” thể hiện quan hệ tiếp nối/hệ quả của καί trong lời thách thức.
theological_decisions:
- issue: Cách diễn đạt lời chế nhạo về tước hiệu vua của Chúa Giê-su
  choice: Hắn là Vua của Ít-ra-ên
  alternative: Nếu hắn là Vua của Ít-ra-ên
  rationale: Bản Hy Lạp là một mệnh đề danh từ mang hình thức khẳng định, không có từ chỉ điều kiện. Giữ hình thức ấy bảo toàn sự mỉa mai và không thêm sắc thái không được phát biểu rõ.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm nhưng thể hiện rõ giọng chế nhạo của những người đang nói. Dùng “hắn” để truyền đạt thái độ khinh miệt trong ngữ cảnh, không phải giọng kể của người dịch. Viết hoa “Vua” như một tước hiệu; phiên âm “Ít-ra-ên” theo lối quen thuộc trong tiếng Việt.
