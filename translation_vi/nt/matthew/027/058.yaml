source:
  edition: SBLGNT
  text: οὗτος προσελθὼν τῷ Πιλάτῳ ᾐτήσατο τὸ σῶμα τοῦ Ἰησοῦ. τότε ὁ Πιλᾶτος ἐκέλευσεν ⸀ἀποδοθῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/058.yaml
  text: He went to Pilate and asked for the body of Jesus[a]. Then Pilate ordered it to be given to him.
translation:
  language: vi
  text: Ông đến gặp Phi-lát và xin thi thể Đức Giê-su. Sau đó, Phi-lát ra lệnh giao thi thể ấy cho ông.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “ra lệnh trao thi thể ấy” hoặc “ra lệnh bàn giao thi thể ấy.” Động từ nguyên mẫu bị động Hy Lạp có thể được diễn đạt theo vài cách gần nghĩa; người nhận không được nêu rõ trong mệnh đề nhưng theo ngữ cảnh là Giô-sép.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτος
  choice: Ông
  rationale: Đại từ chỉ định này quy chiếu về Giô-sép người A-ri-ma-thê ở câu trước; dùng “ông” giúp lời kể tiếng Việt tự nhiên mà vẫn giữ rõ chủ thể.
- source_word: προσελθὼν τῷ Πιλάτῳ
  choice: đến gặp Phi-lát
  rationale: Phân từ aorist diễn tả hành động đến gần hoặc đến chỗ Phi-lát trước khi ngỏ lời; “đến gặp” tự nhiên trong văn kể hiện đại.
- source_word: ᾐτήσατο
  choice: xin
  rationale: Động từ ở đây có nghĩa yêu cầu để nhận một vật; “xin thi thể” diễn đạt ngắn gọn, tự nhiên và phù hợp với việc Giô-sép thỉnh cầu nhà cầm quyền.
- source_word: τὸ σῶμα τοῦ Ἰησοῦ
  choice: thi thể Đức Giê-su
  rationale: σῶμα nghĩa là “thân thể”; trong ngữ cảnh sau khi Chúa Giê-su qua đời, “thi thể” làm rõ nghĩa bằng tiếng Việt mà không mang sắc thái lạnh lùng như “xác chết”.
- source_word: τότε
  choice: Sau đó
  rationale: Từ này đánh dấu sự việc kế tiếp trong trình tự kể chuyện; “Sau đó” tự nhiên và rõ nghĩa trong tiếng Việt.
- source_word: ἐκέλευσεν
  choice: ra lệnh
  rationale: κελεύω chỉ việc ban lệnh; “ra lệnh” phù hợp với thẩm quyền hành chính của Phi-lát.
- source_word: ἀποδοθῆναι
  choice: giao thi thể ấy cho ông
  rationale: Động từ nguyên mẫu bị động có thể mang nghĩa được trao, giao lại hoặc giao cho. Tiếng Việt cần nêu lại đối tượng để tránh mơ hồ; người nhận là Giô-sép được suy ra trực tiếp từ ngữ cảnh.
theological_decisions:
- issue: Cách gọi thi thể của Chúa Giê-su
  choice: thi thể Đức Giê-su
  alternative: thân thể Đức Giê-su
  rationale: “Thi thể” phản ánh rõ tình trạng đã chết trong ngữ cảnh mai táng, nhưng không thêm một kết luận thần học ngoài điều trình thuật đã xác lập.
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Tên riêng được phiên âm theo lối quen dùng trong Kinh Thánh tiếng Việt. Đại từ “ông” tránh lặp tên Giô-sép nhưng vẫn giữ mạch quy chiếu từ câu trước.
