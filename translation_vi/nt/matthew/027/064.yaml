- from: 'Vậy, xin truyền lệnh bảo vệ ngôi mộ nghiêm ngặt cho đến ngày thứ ba, kẻo các môn đồ của ông ấy đến[a], lấy trộm ông ấy rồi nói với dân chúng: “Ông ấy đã được làm sống lại từ cõi chết[b].” Khi đó, sự lừa dối sau cùng sẽ tệ hơn sự lừa dối trước.'
  to: 'Vậy, xin hãy ra lệnh cho ngôi mộ được bảo vệ cẩn mật cho đến ngày thứ ba, kẻo các môn đệ của người ấy đến[a] lấy trộm người ấy rồi nói với dân chúng: “Người ấy đã được làm cho sống lại từ cõi chết[b],” và sự lừa dối sau cùng sẽ tệ hơn sự lừa dối trước.'
  rationale: Bản sửa làm rõ lời thỉnh cầu với người có thẩm quyền bằng “xin hãy ra lệnh,” diễn đạt ἀσφαλισθῆναι bằng một cấu trúc bị động tự nhiên hơn, và cập nhật “môn đồ” thành “môn đệ.” Cụm phục sinh được giữ ở thể bị động bằng “đã được làm cho sống lại,” không nêu tác nhân. Các chú thích vẫn đặt đúng tại “đến” cho biến thể “ban đêm” và tại lời tuyên bố phục sinh cho lựa chọn thể chủ động/intransitive.
