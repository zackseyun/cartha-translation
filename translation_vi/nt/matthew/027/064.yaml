review_pass:
  verdict: revise
  source_fidelity: 'Bản nháp truyền đạt đúng cấu trúc và ý chính của nguyên văn: lời thỉnh cầu ra lệnh, thời hạn đến ngày thứ ba, nỗi lo môn đệ lấy trộm và lời loan báo ở thể bị động, cùng hệ quả về “sự lừa dối” sau cùng. Tuy nhiên, “bảo vệ ngôi mộ nghiêm ngặt” chưa tự nhiên và có thể thu hẹp ἀσφαλισθῆναι vào việc canh giữ; “môn đồ” không phải lựa chọn hiện đại chuẩn bằng “môn đệ”; và “Khi đó” thêm một liên kết thời gian không được diễn đạt rõ trong tiếng Hy Lạp.'
  naturalness: Sửa thành “xin hãy ra lệnh cho ngôi mộ được bảo vệ cẩn mật” giúp câu Việt tự nhiên hơn, đồng thời vẫn diễn đạt kết quả bị động là làm cho ngôi mộ an toàn. “Các môn đệ của người ấy” tự nhiên trong văn phong Kinh Thánh hiện đại và tránh sắc thái khẩu ngữ của việc lặp “ông ấy”.
  terminology: Giữ “ngôi mộ,” “ngày thứ ba,” “dân chúng,” và “sự lừa dối ... sự lừa dối” để phản ánh τάφος, τρίτη ἡμέρα, λαός, và việc lặp πλάνη. “Đã được làm cho sống lại” là cách diễn đạt hơi dài nhưng giữ được thể bị động của Ἠγέρθη mà không nêu tác nhân. Chú thích thay thế bằng thể chủ động/intransitive là phù hợp.
  issues:
  - severity: medium
    issue: Cụm “bảo vệ ngôi mộ nghiêm ngặt” không diễn đạt tự nhiên và có nguy cơ đồng nhất việc làm ngôi mộ an toàn với một biện pháp canh gác cụ thể.
    rationale: ἀσφαλισθῆναι là bất định từ bị động, nghĩa là làm cho/bảo đảm ngôi mộ được an toàn, không xác định phương thức. “Cho ngôi mộ được bảo vệ cẩn mật” giữ kết quả bị động và không nêu thêm niêm phong hay lính canh.
  - severity: low
    issue: “Môn đồ” và cách lặp “ông ấy” kém tự nhiên trong tiếng Việt hiện đại chuẩn.
    rationale: “Môn đệ” là thuật ngữ Kinh Thánh hiện hành, trung tính và rõ nghĩa. “Người ấy” phù hợp khi thuật lại cách các đối thủ quy chiếu đến Chúa Giê-su, không thêm tước hiệu.
  - severity: low
    issue: “Khi đó” thêm sắc thái thời gian không cần thiết.
    rationale: καὶ ἔσται liên kết hệ quả tương lai; “và ... sẽ” phản ánh sát hơn mà vẫn tự nhiên.
