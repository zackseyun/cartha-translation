  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: κέλευσον οὖν ἀσφαλισθῆναι τὸν τάφον ἕως τῆς τρίτης ἡμέρας, μήποτε ἐλθόντες οἱ μαθηταὶ ⸀αὐτοῦ κλέψωσιν αὐτὸν καὶ εἴπωσιν τῷ λαῷ· Ἠγέρθη ἀπὸ τῶν νεκρῶν, καὶ ἔσται ἡ ἐσχάτη πλάνη χείρων τῆς πρώτης.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/064.yaml
  text: Therefore[a], order the tomb to be secured until the third day, lest his disciples come and steal him and say to the people[b], ‘He has been raised from the dead,’ and the last deception will be worse than the first.
translation:
  language: vi
  text: 'Vậy, xin hãy ra lệnh cho ngôi mộ được bảo vệ cẩn mật cho đến ngày thứ ba, kẻo các môn đệ của người ấy đến[a] lấy trộm người ấy rồi nói với dân chúng: “Người ấy đã được làm cho sống lại từ cõi chết[b],” và sự lừa dối sau cùng sẽ tệ hơn sự lừa dối trước.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Một số thủ bản thêm “ban đêm” sau “đến”: “kẻo các môn đệ của người ấy đến ban đêm và lấy trộm người ấy.” Bản dịch này theo cách đọc ngắn hơn.'
    reason: textual_variant
  - marker: b
    text: 'Cũng có thể dịch: “Người ấy đã sống lại từ cõi chết.” Động từ Hy Lạp ở thể bị động.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κέλευσον
  choice: xin truyền lệnh
  rationale: Động từ mệnh lệnh aorist kêu gọi Philatô thực hiện hành động chính thức và dứt khoát. Trong lời thỉnh cầu với nhà cầm quyền, “xin truyền lệnh” vừa tự nhiên vừa giữ sắc thái quyền hành.
- source_word: οὖν
  choice: Vậy
  rationale: Diễn tả kết luận suy ra từ lời nhắc ở câu trước; “Vậy” rõ ràng, tự nhiên trong tiếng Việt hiện đại.
- source_word: ἀσφαλισθῆναι τὸν τάφον
  choice: bảo vệ ngôi mộ nghiêm ngặt
  rationale: Diễn đạt việc làm cho ngôi mộ được an toàn, chắc chắn mà không giới hạn biện pháp chỉ vào niêm phong hay bố trí lính canh.
- source_word: ἕως τῆς τρίτης ἡμέρας
  choice: cho đến ngày thứ ba
  rationale: Giữ nguyên cách nói thời gian gắn với lời báo trước về sự sống lại.
- source_word: μήποτε
  choice: kẻo
  rationale: “Kẻo” diễn đạt tự nhiên khả năng đáng lo mà hành động được đề nghị nhằm ngăn chặn.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: các môn đồ của ông ấy
  rationale: Giữ quan hệ sở hữu rõ ràng; “ông ấy” phù hợp với việc các đối thủ đang nói về Chúa Giê-su mà không đưa thêm tước hiệu vào câu.
- source_word: κλέψωσιν αὐτὸν
  choice: lấy trộm ông ấy
  rationale: Giữ đại từ chỉ chính Chúa Giê-su như bản Hy Lạp, thay vì diễn giải thành “thi thể”; không thêm ý “đem đi” vốn không được phát biểu trực tiếp.
- source_word: τῷ λαῷ
  choice: dân chúng
  rationale: λαός ở đây chỉ dân chúng nói chung, không nhất thiết là một đám đông đang tụ họp.
- source_word: Ἠγέρθη
  choice: đã được làm sống lại
  rationale: Giữ thể bị động của động từ Hy Lạp và không nêu rõ tác nhân mà nguyên văn để ngầm hiểu.
- source_word: ἀπὸ τῶν νεκρῶν
  choice: từ cõi chết
  rationale: Cách diễn đạt tự nhiên, quen thuộc trong tiếng Việt cho công thức phục sinh này.
- source_word: ἡ ἐσχάτη πλάνη
  choice: sự lừa dối sau cùng
  rationale: Trong lời của các đối thủ, πλάνη chỉ điều họ xem là sự lừa dối; bản dịch không xác nhận đánh giá ấy là đúng.
theological_decisions:
- issue: Cách dịch lời tuyên bố về sự sống lại trong lời thuật của các đối thủ
  choice: Ông ấy đã được làm sống lại từ cõi chết
  alternative: Ông ấy đã sống lại từ cõi chết
  rationale: Nguyên văn dùng thể bị động Ἠγέρθη. Giữ thể bị động bảo toàn cách diễn đạt trong đó tác nhân làm cho sống lại không được nêu rõ, thay vì chuyển sang một động từ nội động chủ động.
- issue: Sắc thái của πλάνη trong lời các lãnh đạo
  choice: sự lừa dối
  alternative: sự sai lầm
  rationale: Ngữ cảnh cho thấy họ lo các môn đồ sẽ cố ý trộm và loan báo một điều gian dối. “Sự lừa dối” phản ánh lời cáo buộc của người nói nhưng vẫn để rõ đây là quan điểm của họ.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “xin truyền lệnh” để phản ánh lời thỉnh cầu với Philatô; dùng “ông ấy” trong lời của các đối thủ để tránh thêm sự tôn xưng không có trong nguyên văn. Các dấu chú thích được đặt ngay tại cụm từ liên quan.
