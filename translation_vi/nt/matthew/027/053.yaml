  text: καὶ ἐξελθόντες ἐκ τῶν μνημείων μετὰ τὴν ἔγερσιν αὐτοῦ εἰσῆλθον εἰς τὴν ἁγίαν πόλιν καὶ ἐνεφανίσθησαν πολλοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/053.yaml
  text: And coming out of the tombs after his resurrection[c][b][a], they entered the holy city and appeared to many.
translation:
  language: vi
  text: Và ra khỏi các ngôi mộ sau khi Ngài sống lại,[a] họ vào thành thánh[b] và hiện ra với nhiều người.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể diễn đạt trôi chảy hơn: “Sau khi Ngài sống lại, họ ra khỏi các ngôi mộ, vào thành thánh và hiện ra với nhiều người.” Bản Hy Lạp đặt cụm “sau khi Ngài sống lại” sau “ra khỏi các ngôi mộ” và trước “họ vào”.'
    reason: alternative_reading
  - marker: b
    text: “Thành thánh” chỉ Giê-ru-sa-lem.
    reason: cross_reference
lexical_decisions:
- source_word: ἐξελθόντες
  choice: sau khi ra khỏi
  rationale: Phân từ bất định quá khứ diễn tả hành động xảy ra trước động từ chính; cách dịch này tự nhiên trong tiếng Việt và giữ quan hệ thời gian.
- source_word: μνημείων
  choice: các mộ phần
  rationale: Từ này chỉ nơi chôn cất; “mộ phần” phù hợp với các mộ đã mở trong câu trước và có sắc thái trang trọng, dễ hiểu.
- source_word: μετὰ τὴν ἔγερσιν αὐτοῦ
  choice: sau khi Ngài sống lại
  rationale: μετά với đối cách mang nghĩa thời gian “sau”; ἔγερσις ở đây nói đến việc Chúa Giê-su sống lại. Dùng “Ngài” để biểu thị kính trọng theo văn phong Kinh Thánh tiếng Việt, còn đối tượng quy chiếu được xác định từ ngữ cảnh.
- source_word: εἰσῆλθον
  choice: họ vào
  rationale: Động từ kể chuyện ở thì bất định quá khứ; “vào” ngắn gọn và tự nhiên hơn “đi vào” trong mạch câu.
- source_word: τὴν ἁγίαν πόλιν
  choice: thành thánh
  rationale: Giữ nguyên thành ngữ Kinh Thánh chỉ Giê-ru-sa-lem mà không giải thích quá mức trong chính văn.
- source_word: ἐνεφανίσθησαν
  choice: hiện ra
  rationale: Dạng thụ động mang ý trở nên hữu hình hoặc xuất hiện trước người khác; “hiện ra” là cách diễn đạt tự nhiên trong văn cảnh.
- source_word: πολλοῖς
  choice: cho nhiều người
  rationale: Bổ sung “người” để tiếng Việt rõ nghĩa; không xác định cụ thể hơn điều nguyên văn nói.
theological_decisions:
- issue: Quan hệ giữa phân từ “ra khỏi các mộ phần” và cụm thời gian “sau khi Ngài sống lại”
  choice: Đặt “sau khi Ngài sống lại” ngay sau mệnh đề phân từ, cho thấy việc họ ra khỏi mộ rồi vào thành xảy ra sau sự sống lại của Chúa Giê-su.
  alternative: 'Có thể viết trôi chảy hơn: “Sau khi Ngài sống lại, họ ra khỏi các mộ phần, vào thành thánh và hiện ra cho nhiều người.”'
  rationale: Trật tự bản Hy Lạp đặt cụm μετὰ τὴν ἔγερσιν αὐτοῦ sau ἐκ τῶν μνημείων và trước động từ chính. Bản dịch giữ trật tự và sự căng thẳng cú pháp này, không tự ý điều hòa với câu trước.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Cấu trúc chính văn hơi lặp “sau khi” nhằm bảo tồn vị trí và quan hệ cú pháp của cụm thời gian trong nguyên văn; chú thích cung cấp cách diễn đạt tự nhiên hơn.
