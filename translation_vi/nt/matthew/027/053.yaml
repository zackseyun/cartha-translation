review_pass:
  verdict: revise
  source_fidelity: 'Bản thảo truyền đạt đúng các yếu tố chính của câu: họ ra khỏi các nơi chôn cất, sau sự sống lại của Đức Giê-su, vào thành thánh và hiện ra với nhiều người. Tuy nhiên, cách lặp “sau khi ... , sau khi ...” gây nặng và không tự nhiên trong tiếng Việt. Cụm thời gian Hy Lạp đứng sau “ra khỏi các mộ” được giữ rõ hơn bằng cấu trúc “ra khỏi ... sau khi Ngài sống lại”.'
  naturalness: Cần chỉnh sửa. “Và sau khi ra khỏi các mộ phần, sau khi Ngài sống lại” là một chuỗi trạng ngữ lặp, khó đọc trong tiếng Việt hiện đại. “Ra khỏi các ngôi mộ sau khi Ngài sống lại, họ...” tự nhiên hơn, đồng thời vẫn phản ánh vị trí của cụm thời gian trong câu Hy Lạp.
  terminology: “Các ngôi mộ” là cách gọi hiện đại, rõ ràng cho μνημείων trong ngữ cảnh này. “Thành thánh,” “Ngài sống lại,” và “hiện ra với nhiều người” phù hợp văn phong Kinh Thánh trang trọng mà hiện đại. “Với nhiều người” diễn đạt tự nhiên hơn cho dative πολλοῖς trong ngữ cảnh ‘hiện ra’.
  issues:
  - severity: medium
    issue: Lặp cấu trúc “sau khi” trong chính văn
    rationale: Cụm “sau khi ra khỏi các mộ phần, sau khi Ngài sống lại” tuy có thể hiểu được nhưng không tự nhiên và làm mờ mạch kể. Nguyên văn chỉ có một cụm μετὰ τὴν ἔγερσιν αὐτοῦ; không cần tái tạo hai lần “sau khi” trong tiếng Việt.
  - severity: low
    issue: “mộ phần” kém thông dụng hơn trong văn xuôi tiếng Việt hiện đại
    rationale: “Mộ phần” có thể chỉ phần mộ hoặc khu mộ và không sai, nhưng “các ngôi mộ” trực tiếp, phổ thông và sát nghĩa μνημεῖα hơn trong ngữ cảnh các mộ được mở ở câu trước.
  revised_text: Và ra khỏi các ngôi mộ sau khi Ngài sống lại,[a] họ vào thành thánh[b] và hiện ra với nhiều người.
