revisions:
- from: Và sau khi ra khỏi các mộ phần, sau khi Ngài sống lại,[a] họ vào thành thánh[b] và hiện ra cho nhiều người.
  to: Và ra khỏi các ngôi mộ sau khi Ngài sống lại,[a] họ vào thành thánh[b] và hiện ra với nhiều người.
  rationale: 'Bản sửa thay chuỗi “sau khi” lặp và không tự nhiên bằng một mệnh đề phân từ/rút gọn tự nhiên trong tiếng Việt: “Ra khỏi các ngôi mộ sau khi Ngài sống lại, họ...”. Cách này vẫn để cụm thời gian gắn ngay với việc ra khỏi mộ, như vị trí của μετὰ τὴν ἔγερσιν αὐτοῦ trong nguyên văn, mà không giải quyết thay sự căng thẳng tường thuật với câu trước. Chú thích giữ một cách tái cấu trúc trôi chảy hơn và ghi nhận trật tự Hy Lạp.'
