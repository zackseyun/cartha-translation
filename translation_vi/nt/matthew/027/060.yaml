  terminology: '“Thi thể ấy,” “ngôi mộ,” “tảng đá lớn,” và “ra đi” phù hợp ngữ cảnh tường thuật trang trọng. Không cần chú thích: “cửa mộ” là cách diễn đạt tiếng Việt tự nhiên cho θύρα τοῦ μνημείου trong ngữ cảnh này.'
