base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/060.yaml
  text: and placed it in his own new tomb[a], which he had cut into the rock. And after rolling a large stone to the entrance of the tomb, he went away.
translation:
  language: vi
  text: rồi đặt thi thể ấy trong ngôi mộ mới của mình, ngôi mộ ông đã đục trong đá. Sau khi lăn một tảng đá lớn đến trước cửa mộ, ông ra đi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔθηκεν αὐτό
  choice: đặt thi thể ấy
  rationale: Động từ τίθημι diễn tả việc đặt xuống. Đại từ αὐτό ở giống trung vì quy chiếu đến σῶμα (thi thể) trong câu trước; dịch rõ là “thi thể ấy” giúp tiếng Việt tự nhiên và tránh đại từ mơ hồ.
- source_word: ἐν τῷ καινῷ αὐτοῦ μνημείῳ
  choice: trong ngôi mộ mới của mình
  rationale: μνημεῖον trong bối cảnh mai táng là ngôi mộ; καινός được giữ đúng nghĩa trực tiếp là “mới”, không diễn giải thêm thành “chưa sử dụng”. αὐτοῦ biểu thị ngôi mộ thuộc về Giô-sép.
- source_word: ὃ ἐλατόμησεν ἐν τῇ πέτρᾳ
  choice: là ngôi mộ ông đã đục vào đá
  rationale: λατομέω chỉ việc đục hoặc khoét đá. “Đục vào đá” truyền đạt rõ hình ảnh ngôi mộ được tạo trong khối đá; “đã” cho thấy việc chuẩn bị mộ có trước hành động đặt thi thể.
- source_word: προσκυλίσας
  choice: sau khi lăn
  rationale: Phân từ bất định quá khứ chỉ hành động xảy ra trước động từ chính ἀπῆλθεν; “sau khi lăn” thể hiện rõ trình tự.
- source_word: λίθον μέγαν
  choice: một tảng đá lớn
  rationale: μέγας có nghĩa là lớn; “tảng đá lớn” tự nhiên và phù hợp với vật dùng để chắn lối vào mộ.
- source_word: τῇ θύρᾳ τοῦ μνημείου
  choice: đến cửa mộ
  rationale: θύρα có thể chỉ cửa hoặc lối vào. “Cửa mộ” là cách nói tự nhiên trong tiếng Việt và không nhất thiết hàm ý một cánh cửa có bản lề.
- source_word: ἀπῆλθεν
  choice: ông ra đi
  rationale: ἀπέρχομαι đơn giản diễn tả việc rời khỏi nơi đó; “ra đi” giữ được sắc thái kể chuyện trang trọng, dễ hiểu.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng và dễ hiểu. Dùng “thi thể ấy” để làm rõ đối tượng của đại từ Hy Lạp dựa trên ngữ cảnh ngay trước đó, nhưng không thêm diễn giải thần học. Không đặt chú thích vì “cửa mộ” trong tiếng Việt bao quát tự nhiên cả cửa và lối vào.
