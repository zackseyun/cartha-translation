  verdict: revise
  source_fidelity: 'Bản dịch chuyển tải đúng các yếu tố chính của câu: đặt thi thể vào ngôi mộ mới thuộc về Giô-sép, ngôi mộ được đục trong đá, lăn một tảng đá lớn tới/cạnh cửa mộ, rồi rời đi. Tuy nhiên, “đục vào đá” chưa phản ánh tự nhiên quan hệ không gian của ἐν τῇ πέτρᾳ; ngôi mộ được đục trong/đẽo từ khối đá, không phải chỉ hành động đục ‘vào’ đá.'
