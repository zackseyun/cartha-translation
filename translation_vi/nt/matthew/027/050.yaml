  source_fidelity: 'Bản dịch chính truyền đạt đúng diễn tiến của câu: Đức Giê-su kêu lớn một lần nữa và chết. “Trút linh hồn” là cách nói trang trọng, thông dụng để diễn tả thành ngữ ἀφῆκεν τὸ πνεῦμα, đồng thời bảo lưu yếu tố “linh hồn/thần khí” tốt hơn “tắt thở”. Tuy nhiên, chú thích gọi “buông linh hồn” là nguyên văn là chưa chính xác về mặt từ vựng và không tự nhiên trong tiếng Việt.'
