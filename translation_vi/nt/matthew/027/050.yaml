  text: But Jesus cried out again with a loud voice and gave up his spirit[a].
translation:
  language: vi
  text: Nhưng Đức Giê-su lại kêu lớn một tiếng rồi trút linh hồn[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “tắt thở.” Cụm từ Hy Lạp nghĩa đen là “thả/trao linh hồn”, một cách nói chỉ sự chết.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Nhưng
  rationale: Liên từ δέ nối tiếp câu chuyện với sắc thái tương phản nhẹ; “Nhưng” phù hợp với bước ngoặt của trình thuật.
- source_word: πάλιν
  choice: lại
  rationale: πάλιν chỉ sự lặp lại; “lại” ngắn gọn và tự nhiên trong tiếng Việt.
- source_word: κράξας φωνῇ μεγάλῃ
  choice: kêu lớn một tiếng
  rationale: Cụm này diễn tả một tiếng kêu mạnh và lớn. Cách dịch này tự nhiên trong tiếng Việt, đồng thời giữ quan hệ giữa phân từ và động từ chính.
- source_word: ἀφῆκεν τὸ πνεῦμα
  choice: trút linh hồn
  rationale: Đây là thành ngữ chỉ sự chết. “Trút linh hồn” giữ được yếu tố πνεῦμα và sắc thái trang trọng, đồng thời vẫn dễ hiểu trong tiếng Việt hiện đại.
theological_decisions:
- issue: Cách dịch thành ngữ về cái chết ἀφῆκεν τὸ πνεῦμα
  choice: trút linh hồn
  alternative: tắt thở
  rationale: “Tắt thở” truyền đạt rõ ý qua đời nhưng nghiêng πνεῦμα về nghĩa “hơi thở”. “Trút linh hồn” bảo tồn liên hệ từ vựng với “linh hồn/thần khí” mà không giải quyết quá mức hàm ý thần học của câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Giê-su” theo lối gọi kính trọng phổ biến; cấu trúc câu gọn, giữ nhịp kể trang nghiêm của nguyên văn.
