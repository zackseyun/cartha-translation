    rationale: ἀφῆκεν có nghĩa cơ bản là “thả ra/để đi/trao, phó”, không phải một từ tương đương chính xác với “buông” trong cách diễn đạt tiếng Việt. Cần diễn giải đây là một cách nói Hy Lạp về cái chết thay vì gán một bản dịch “nguyên văn” thiếu tự nhiên và dễ gây hiểu sai.
