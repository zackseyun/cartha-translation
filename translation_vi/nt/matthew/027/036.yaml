  text: καὶ καθήμενοι ἐτήρουν αὐτὸν ἐκεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/036.yaml
  text: And sitting there[a], they kept watch over him.
translation:
  language: vi
  text: Và họ ngồi đó[a] canh giữ Ngài.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Sau khi ngồi xuống tại đó, họ tiếp tục canh giữ Ngài.”'
    reason: Phân từ καθήμενοι có thể được hiểu là tư thế đi kèm (“ngồi”) hoặc là hành động xảy ra trước động từ chính (“sau khi ngồi xuống”); thì chưa hoàn thành của ἐτήρουν nhấn mạnh việc canh giữ kéo dài.
lexical_decisions:
- source_word: καὶ
  choice: Rồi
  rationale: Trong mạch kể chuyện, liên từ này nối tiếp hành động trước đó; “Rồi” diễn đạt tự nhiên sự tiếp diễn mà không nhấn mạnh quan hệ nhân quả.
- source_word: καθήμενοι
  choice: họ ngồi
  rationale: Phân từ của κάθημαι diễn tả tư thế ngồi như hoàn cảnh đi kèm với hành động chính; cách dịch này tự nhiên và không buộc phải hiểu là hành động đã hoàn tất trước.
- source_word: ἐτήρουν
  choice: canh giữ
  rationale: Động từ ở thì chưa hoàn thành diễn tả hành động đang tiếp diễn. “Canh giữ” phù hợp với bối cảnh những người lính ở lại giám sát Chúa Giê-xu.
- source_word: αὐτὸν
  choice: Ngài
  rationale: Đại từ đối cách chỉ Chúa Giê-xu; “Ngài” là cách quy chiếu trang trọng, quen thuộc trong văn phong Kinh Thánh tiếng Việt.
- source_word: ἐκεῖ
  choice: đó
  rationale: Trạng từ chỉ địa điểm được đặt cạnh “ngồi” để câu tiếng Việt tự nhiên, đồng thời giữ chức năng xác định nơi diễn ra sự việc.
theological_decisions: []
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Câu ngắn gọn, giữ nhịp kể chuyện và tính tiếp diễn của hành động.
