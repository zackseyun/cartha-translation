  to: 'Toàn thể dân chúng đáp[a]: “Máu của người ấy cứ ở trên chúng tôi và trên con cái chúng tôi.”'
  rationale: Bản sửa loại bỏ động từ “đổ,” vốn thêm một hành động không hiện diện trong mệnh đề Hy Lạp, đồng thời vẫn diễn đạt được sắc thái lời tự nhận/lời cầu của phát ngôn. Câu dẫn được rút gọn để tự nhiên hơn. Chú thích được giữ nguyên vì nêu đúng giới hạn tường thuật của cụm từ tập thể mà không làm thay đổi chính văn.
