source:
  edition: SBLGNT
  text: καὶ ἀποκριθεὶς πᾶς ὁ λαὸς εἶπεν· Τὸ αἷμα αὐτοῦ ἐφ’ ἡμᾶς καὶ ἐπὶ τὰ τέκνα ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/025.yaml
  text: And all the people answered[a], “His blood be on us and on our children.”
translation:
  language: vi
  text: 'Toàn thể dân chúng đáp[a]: “Máu của người ấy cứ ở trên chúng tôi và trên con cái chúng tôi.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tức là toàn thể dân chúng tụ họp và lên tiếng trong cảnh này; câu này không nên được hiểu là quy tội vĩnh viễn cho tất cả người Do Thái thuộc mọi thế hệ.
    reason: cultural_note
lexical_decisions:
- source_word: ἀποκριθεὶς ... εἶπεν
  choice: đều đáp
  rationale: Phân từ bất định ἀποκριθείς đi với εἶπεν tạo thành cách nói quen thuộc để dẫn lời đáp; tiếng Việt tự nhiên chỉ cần dịch gọn là “đáp”.
- source_word: πᾶς ὁ λαὸς
  choice: toàn thể dân chúng
  rationale: Cụm từ mang nghĩa tập thể, chỉ toàn bộ những người đang hiện diện trong cảnh này. “Dân chúng” giữ được nghĩa cơ bản của λαός và phù hợp văn cảnh hơn một khẳng định về toàn thể một dân tộc qua mọi thời đại.
- source_word: Τὸ αἷμα αὐτοῦ
  choice: máu của ông ấy
  rationale: Giữ hình ảnh “máu” của nguyên văn. Trong văn cảnh xét xử, cụm này hàm ý trách nhiệm về cái chết của Chúa Giê-su, nhưng không nên diễn giải trực tiếp thành “tội làm đổ máu” trong chính văn.
- source_word: ἐφ’ ἡμᾶς
  choice: cứ đổ trên chúng tôi
  rationale: Nguyên văn không có động từ; tiếng Việt cần bổ sung để câu tự nhiên. “Cứ đổ trên” diễn đạt sắc thái tự nhận hậu quả của lời nói, đồng thời giữ hình ảnh máu thay vì giải nghĩa thành “chúng tôi chịu trách nhiệm”.
- source_word: ἐπὶ τὰ τέκνα ἡμῶν
  choice: và trên con cái chúng tôi
  rationale: τέκνα có nghĩa trực tiếp là “con cái”; giữ lại giới từ lặp lại để bảo toàn tính song song và nhấn mạnh của câu.
theological_decisions:
- issue: Nguy cơ diễn giải πᾶς ὁ λαὸς theo hướng bài Do Thái
  choice: Hiểu đây là lời tập thể của dân chúng tụ họp trong cảnh xét xử và dịch “toàn thể dân chúng”.
  alternative: “toàn dân” hoặc “toàn thể đám đông”
  rationale: Câu Hy Lạp thuật lại lời của những người hiện diện trong cảnh này, không tự nó quy trách nhiệm vĩnh viễn cho mọi người Do Thái thuộc mọi thế hệ. Chú thích ngăn sự mở rộng sai lệch ấy mà không làm nhẹ đi cách diễn đạt tập thể của nguyên văn.
- issue: Sắc thái của lời “máu ... trên chúng tôi”
  choice: Giữ hình ảnh huyết và sắc thái tự nhận hậu quả bằng “máu ... cứ đổ trên chúng tôi”.
  alternative: “chúng tôi xin chịu trách nhiệm về cái chết của ông ấy”
  rationale: Cách diễn giải thay thế làm rõ ý pháp lý nhưng xóa đi ẩn dụ huyết và thu hẹp sự căng thẳng của lời nói. Bản dịch nên giữ hình ảnh nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Ông ấy” phù hợp với lời của đám đông trong văn cảnh, không đưa thêm một tước hiệu Cơ Đốc học vốn không có trong câu Hy Lạp. Dấu [a] được đặt ngay sau mệnh đề dẫn lời mà chú thích giải thích.
