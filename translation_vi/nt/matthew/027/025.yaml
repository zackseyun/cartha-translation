review_pass:
  verdict: revise
  source_fidelity: Bản nháp truyền đạt đúng cấu trúc tập thể của πᾶς ὁ λαὸς, động từ dẫn lời “đáp,” và đối tượng song song “chúng tôi ... con cái chúng tôi.” Tuy nhiên, “cứ đổ trên” thêm hành động “đổ” không có trong câu Hy Lạp vốn là mệnh đề không động từ; cách này chuyển hình ảnh từ ‘máu ở/trên ai’ sang biến cố máu đổ xuống ai.
  naturalness: “Toàn thể dân chúng đều đáp” hơi trùng sắc thái tập thể do “toàn thể” và “đều” cùng làm nhiệm vụ nhấn tổng thể. “Toàn thể dân chúng đáp” gọn và tự nhiên hơn. “Máu của người ấy cứ ở trên chúng tôi” giữ được lối nói có chủ ý, trang trọng vừa phải và không thêm hình ảnh ngoài nguyên văn.
  terminology: Dùng “dân chúng” cho λαός và “con cái” cho τέκνα là phù hợp. “Người ấy” giữ quy chiếu trung tính của αὐτοῦ trong lời nói của đám đông, không đưa thêm tước hiệu. Chú thích nên tiếp tục xác định phạm vi là những người tụ họp trong cảnh thuật chuyện, không mở rộng thành quy tội mọi người Do Thái qua các thế hệ.
  issues:
  - severity: medium
    issue: “cứ đổ trên chúng tôi” bổ sung động từ “đổ”
    rationale: Nguyên văn Τὸ αἷμα αὐτοῦ ἐφ’ ἡμᾶς là một mệnh đề không động từ, với lời cầu/nhận hậu quả được hàm ý. “Đổ” có thể gợi hành động máu đang đổ xuống, một nét không được phát biểu trong bản gốc. “Cứ ở trên” chỉ cung cấp động từ cần thiết trong tiếng Việt mà bảo toàn hình ảnh và tính mơ hồ của nguyên văn.
  - severity: low
    issue: “toàn thể ... đều” trùng nhấn mạnh
    rationale: πᾶς ὁ λαὸς đã được diễn đạt đầy đủ bằng “toàn thể dân chúng”; bỏ “đều” giúp câu hiện đại, gọn hơn mà không giảm nghĩa tập thể.
