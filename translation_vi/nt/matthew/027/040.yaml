revisions:
- from: 'và nói: “Kẻ đòi phá đền thờ rồi xây lại[a] trong ba ngày kia, hãy tự cứu mình đi! Nếu ngươi là Con Đức Chúa Trời, hãy xuống khỏi thập tự giá đi!”'
  to: 'và nói: “Kẻ phá Đền Thờ rồi xây trong ba ngày kia, hãy tự cứu mình đi! Nếu ngươi là Con Đức Chúa Trời, hãy xuống khỏi thập tự giá đi!”'
  rationale: Chuyển “xây lại” khỏi bản văn chính để không diễn giải quá mức động từ οἰκοδομῶν, đồng thời bảo lưu khả năng ngữ cảnh qua chú thích. Bỏ “đòi” để lời nhạo báng phản ánh trực tiếp hơn cấu trúc phân từ dùng làm lời gọi. Không thay đổi nội dung, tước hiệu Kitô học, hay sắc thái điều kiện của nguyên văn.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T07:38:24Z'
review_pass:
  verdict: revise
  source_fidelity: Cần chỉnh nhẹ để bám sát hơn động từ οἰκοδομῶν, vốn đơn giản là “xây”, không tự thân có tiền tố “lại”. Bản dịch cũng không cần thêm “đòi” cho phân từ ὁ καταλύων; sắc thái nhắc lại một lời tuyên bố/chế nhạo đã được ngữ cảnh và lối xưng hô thể hiện.
  naturalness: Câu chỉnh sửa vẫn tự nhiên trong tiếng Việt hiện đại. “Kẻ phá Đền Thờ rồi xây trong ba ngày kia” cho phép lược tân ngữ đã rõ từ “Đền Thờ”; “ngươi” và “đi” phù hợp với lời nhạo báng trực tiếp.
  terminology: Giữ “Đền Thờ”, “Con Đức Chúa Trời”, và “thập tự giá” là những thuật ngữ quen thuộc, trang trọng và phù hợp. Viết hoa “Đền Thờ” khi chỉ Đền Thờ tại Giê-ru-sa-lem giúp quy chiếu rõ hơn.
  issues:
  - severity: medium
    issue: “xây lại” ở bản văn chính thêm sắc thái tái xây dựng không có trong động từ οἰκοδομῶν.
    rationale: Ngữ cảnh có thể gợi ý “xây lại”, nhưng tiếng Hy Lạp chỉ nói “xây”. Nên để “xây” trong bản văn và dành khả năng “xây lại” cho chú thích.
  - severity: low
    issue: “đòi phá” thêm ý ‘đòi/yêu cầu’ không được diễn đạt bởi ὁ καταλύων.
    rationale: Phân từ này gọi người bị nhạo báng là người ‘phá’/người được cho là sẽ phá; “đòi” chuyển nghĩa sang đòi hỏi hoặc chủ trương, kém trực tiếp hơn.
  revised_text: 'và nói: “Kẻ phá Đền Thờ rồi xây trong ba ngày kia, hãy tự cứu mình đi! Nếu ngươi là Con Đức Chúa Trời, hãy xuống khỏi thập tự giá đi!”'
