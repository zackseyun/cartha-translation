source:
  edition: SBLGNT
  text: καὶ λέγοντες· Ὁ καταλύων τὸν ναὸν καὶ ἐν τρισὶν ἡμέραις οἰκοδομῶν, σῶσον σεαυτόν· εἰ υἱὸς εἶ τοῦ θεοῦ, ⸀κατάβηθι ἀπὸ τοῦ σταυροῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/040.yaml
  text: and saying[a], “You who would destroy the temple and build it in three days, save yourself! If you are the Son of God, come down from the cross.”
translation:
  language: vi
  text: 'và nói: “Kẻ phá Đền Thờ rồi xây trong ba ngày kia, hãy tự cứu mình đi! Nếu ngươi là Con Đức Chúa Trời, hãy xuống khỏi thập tự giá đi!”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγοντες
  choice: và nói
  rationale: Phân từ hiện tại nối tiếp hành động trong văn cảnh trước; cách dịch gọn, tự nhiên, không tự ý nêu lại chủ ngữ.
- source_word: Ὁ καταλύων
  choice: Kẻ đòi phá
  rationale: Mạo từ đi với phân từ được dùng như lời gọi trực tiếp mang tính chế nhạo. “Đòi phá” gợi lại lời cáo buộc mà không biến nó thành một sự kiện được người kể xác nhận.
- source_word: καταλύω
  choice: phá
  rationale: Trong ngữ cảnh đền thờ, “phá” là từ thông dụng, rõ nghĩa và phù hợp với lời nhạo báng.
- source_word: ναός
  choice: đền thờ
  rationale: Dù từ Hy Lạp có thể chỉ cụ thể phần thánh điện, “đền thờ” là cách gọi tự nhiên và dễ hiểu trong lời nhắc lại cáo buộc này.
- source_word: ἐν τρισὶν ἡμέραις
  choice: trong ba ngày
  rationale: Giữ nguyên cách diễn đạt thời gian của nguyên văn và phù hợp với tiếng Việt hiện đại.
- source_word: οἰκοδομῶν
  choice: xây lại
  rationale: Động từ tự thân có nghĩa là “xây”; trong quan hệ với hành động phá đền thờ vừa nêu, tiếng Việt tự nhiên cần “xây lại”. Chú thích bảo lưu nghĩa từ vựng sát hơn.
- source_word: σῶσον σεαυτόν
  choice: hãy tự cứu mình đi
  rationale: Mệnh lệnh kèm đại từ phản thân; tiểu từ “đi” truyền đạt sắc thái thách thức, chế nhạo trong lời nói.
- source_word: εἰ υἱὸς εἶ τοῦ θεοῦ
  choice: Nếu ngươi là Con Đức Chúa Trời
  rationale: Giữ nguyên điều kiện thách thức và tước hiệu Kitô học, không làm yếu đi hoặc diễn giải thêm ý nghĩa thần học.
- source_word: κατάβηθι
  choice: hãy xuống
  rationale: Mệnh lệnh chỉ chuyển động từ vị trí cao xuống; “xuống khỏi” là cách nói tự nhiên khi người nói đứng trước người đang ở trên thập tự giá.
- source_word: σταυρός
  choice: thập tự giá
  rationale: Thuật ngữ tiếng Việt chuẩn và quen thuộc trong trình thuật thương khó.
theological_decisions:
- issue: Cách dịch tước hiệu υἱὸς τοῦ θεοῦ trong lời chế nhạo
  choice: Con Đức Chúa Trời
  alternative: Con của Đức Chúa Trời
  rationale: Cách dịch giữ nguyên tước hiệu truyền thống, minh bạch và lực thần học của nguyên văn, đồng thời để ngữ cảnh cho thấy đây là lời thách thức của những kẻ nhạo báng.
- issue: Sắc thái của câu điều kiện εἰ υἱὸς εἶ τοῦ θεοῦ
  choice: Nếu ngươi là Con Đức Chúa Trời
  alternative: Vì ngươi là Con Đức Chúa Trời
  rationale: Giữ nghĩa điều kiện bề mặt và sự căng thẳng trong lời thách thức, không tự ý giải quyết εἰ theo nghĩa khẳng định.
translation_notes:
  register: Văn phong hiện đại, trang trọng nhưng dễ hiểu. “Ngươi” thích hợp với lời trực tiếp mang tính khinh miệt; “kia” và “đi” làm rõ sắc thái chế nhạo mà không thêm nội dung thần học. Dấu [a] được đặt ngay sau cụm từ liên quan.
