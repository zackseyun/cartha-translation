  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: σταυρώσαντες δὲ αὐτὸν διεμερίσαντο τὰ ἱμάτια αὐτοῦ βάλλοντες κλῆρον,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/035.yaml
  text: And after they crucified him[a], they divided his garments by casting lots.
translation:
  language: vi
  text: Sau khi đóng đinh Đức Giê-su vào thập tự giá, họ chia y phục của Ngài bằng cách bắt thăm.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc dịch sát hình thức hơn: “Sau khi đóng đinh Ngài vào thập tự giá, họ chia y phục của Ngài, bắt thăm.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: σταυρώσαντες
  choice: Sau khi đóng đinh ... vào thập tự giá
  rationale: Phân từ bất định quá khứ diễn tả hành động xảy ra trước động từ chính; cách dịch này tự nhiên trong tiếng Việt và giữ rõ trình tự thời gian.
- source_word: δὲ
  choice: không dịch riêng
  rationale: δέ là liên từ nhẹ nối tiếp mạch kể; quan hệ tiếp diễn đã được thể hiện tự nhiên qua cấu trúc mở đầu “Sau khi”, nên thêm “và” sẽ nặng câu.
- source_word: διεμερίσαντο
  choice: họ chia
  rationale: Động từ có nghĩa chia ra hoặc phân chia; “chia” diễn đạt trực tiếp hành động đối với y phục.
- source_word: τὰ ἱμάτια αὐτοῦ
  choice: y phục của ngài
  rationale: ἱμάτια chỉ quần áo/y phục nói chung. “Y phục” trang trọng vừa phải, tự nhiên trong trình thuật thương khó và không thu hẹp nghĩa thành riêng áo ngoài.
- source_word: βάλλοντες κλῆρον
  choice: bằng cách bắt thăm
  rationale: Phân từ diễn tả phương thức phân chia. “Bắt thăm” là thành ngữ tiếng Việt rõ nghĩa cho việc dùng thăm để quyết định phần thuộc về mỗi người.
theological_decisions:
- issue: Quan hệ giữa βάλλοντες κλῆρον và διεμερίσαντο
  choice: 'Diễn tả việc bắt thăm là phương thức họ dùng để chia y phục: “họ chia y phục của ngài bằng cách bắt thăm.”'
  alternative: “họ chia y phục của ngài, rồi bắt thăm” hoặc “họ chia y phục của ngài, bắt thăm”
  rationale: Phân từ Hy Lạp tự nhiên bổ nghĩa cho động từ chính và cho biết cách thức việc phân chia diễn ra. “Bằng cách” làm rõ quan hệ này mà không thêm nội dung thần học.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “Đức Giê-su” để xác định đối tượng ngay trong câu trích độc lập; “ngài” duy trì cách quy chiếu tôn kính, tự nhiên. Dấu chú thích [a] được đặt sau toàn câu vì chú thích nêu phương án dịch cho cấu trúc tổng thể.
