    rationale: Liên từ “và” có thể khiến người đọc hiểu việc bắt thăm là một hành động tiếp theo hoặc độc lập, trong khi phân từ Hy Lạp bổ nghĩa cho “chia” và nêu cách thức thực hiện. Cần giữ quan hệ phương thức hoặc để cấu trúc phân từ không bị chuyển thành trình tự hành động.
  revised_text: Sau khi đóng đinh Đức Giê-su vào thập tự giá, họ chia y phục của Ngài bằng cách bắt thăm.[a]
