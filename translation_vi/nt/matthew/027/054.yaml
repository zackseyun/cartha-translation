id: MAT.27.54
reference: Matthew 27:54
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ὁ δὲ ἑκατόνταρχος καὶ οἱ μετ’ αὐτοῦ τηροῦντες τὸν Ἰησοῦν ἰδόντες τὸν σεισμὸν καὶ τὰ ⸀γενόμενα ἐφοβήθησαν σφόδρα λέγοντες· Ἀληθῶς ⸂θεοῦ υἱὸς⸃ ἦν οὗτος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/054.yaml
  text: When the centurion and those with him who were guarding Jesus saw the earthquake and the things that had happened[a], they were greatly afraid and said[c][b], “Truly this was the Son of God.”
translation:
  language: vi
  text: 'Khi viên đội trưởng và những người cùng ông đang canh giữ Giê-su thấy trận động đất và những việc đã xảy ra, họ vô cùng sợ hãi và nói: “Quả thật, người này là Con Đức Chúa Trời.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “một con của Đức Chúa Trời.” Cụm từ Hy Lạp θεοῦ υἱός không có mạo từ; theo văn mạch và cách Ma-thi-ơ trình bày Chúa Giê-su, bản dịch chính hiểu đây là danh hiệu “Con Đức Chúa Trời.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ἑκατόνταρχος
  choice: viên đội trưởng
  rationale: Cách gọi tự nhiên, quen thuộc trong tiếng Việt đối với sĩ quan La Mã chỉ huy một đơn vị khoảng một trăm quân; tránh lối dịch dài dòng “người chỉ huy một trăm lính”.
- source_word: τηροῦντες
  choice: đang canh giữ
  rationale: Trong bối cảnh quân lính tại nơi hành hình, động từ chỉ việc canh giữ, không chỉ đơn thuần quan sát.
- source_word: ἰδόντες
  choice: khi ... thấy
  rationale: Chuyển phân từ bất định quá khứ sang mệnh đề thời gian tự nhiên trong tiếng Việt, phù hợp quan hệ với động từ chính.
- source_word: σεισμόν
  choice: trận động đất
  rationale: Đây là nghĩa thông thường và phù hợp ngữ cảnh của σεισμός.
- source_word: τὰ γενόμενα
  choice: những việc đã xảy ra
  rationale: Giữ được tính khái quát và số nhiều của cụm Hy Lạp, bao gồm các biến cố chung quanh chứ không chỉ trận động đất.
- source_word: ἐφοβήθησαν σφόδρα
  choice: vô cùng sợ hãi
  rationale: Diễn đạt tự nhiên cường độ mạnh của σφόδρα trong tiếng Việt hiện đại.
- source_word: Ἀληθῶς
  choice: Quả thật
  rationale: Giữ sắc thái xác quyết trang trọng mà không quy định quá mức mức độ hiểu biết thần học của người nói.
- source_word: θεοῦ υἱὸς
  choice: Con Đức Chúa Trời
  rationale: Dù cụm Hy Lạp không có mạo từ, cấu trúc vị ngữ và cách Ma-thi-ơ trình bày Chúa Giê-su ủng hộ việc hiểu đây là danh hiệu xác định; cách hiểu bất định được giữ trong chú thích.
- source_word: οὗτος
  choice: người này
  rationale: Phản ánh trực tiếp đại từ chỉ định và tự nhiên hơn “này” đứng riêng trong tiếng Việt.
theological_decisions:
- issue: Cách dịch θεοῦ υἱὸς trong lời xác nhận của viên đội trưởng
  choice: Con Đức Chúa Trời
  alternative: một người con của thần / một con của Đức Chúa Trời
  rationale: Cụm danh từ không có mạo từ nên về hình thức có thể được bàn luận theo nghĩa phẩm tính hoặc bất định. Tuy nhiên, văn mạch và cách dùng danh hiệu này trong sách Ma-thi-ơ nghiêng về nghĩa xác định. Bản dịch chính giữ danh hiệu “Con Đức Chúa Trời”, đồng thời chú thích khả năng bất định để không che khuất điểm mơ hồ của hình thức Hy Lạp.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “viên đội trưởng” thay cho cách giải thích dài; dùng “Giê-su” theo chính tả tiếng Việt hiện hành. Không thêm từ nối tương đương “bấy giờ” vì nguyên văn không có trạng từ thời gian ấy. Cụm “và nói” giữ nguyên khả năng cả nhóm cùng lên tiếng như dạng số nhiều λέγοντες; không thu hẹp lời nói chỉ cho viên đội trưởng.
