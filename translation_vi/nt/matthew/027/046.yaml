revisions:
- from: 'Khoảng giờ thứ chín, Chúa Giê-su kêu lớn tiếng[a]: “Ê-li, Ê-li, lê-ma sa-bách-tha-ni?” nghĩa là: “Lạy Đức Chúa Trời của con, lạy Đức Chúa Trời của con, sao Ngài lìa bỏ con?”[b]'
  to: 'Khoảng giờ thứ chín, Giê-su kêu lên lớn tiếng[a]: “Ê-li, Ê-li, lê-ma sa-bách-tha-ni?” nghĩa là: “Lạy Đức Chúa Trời của con, lạy Đức Chúa Trời của con, sao Ngài lìa bỏ con?”[b]'
  rationale: Bản sửa loại bỏ tước hiệu không được nêu trong nguyên văn và chỉnh một cụm diễn đạt cho tự nhiên hơn. Các lựa chọn còn lại được giữ vì phản ánh sát cấu trúc và sắc thái của câu Hy Lạp, bảo toàn lời kêu Sê-mít cùng tiếng vọng Thi Thiên 22:1, và không giải quyết thay độc giả chiều sâu thần học của lời kêu.
  reviewer_model: gpt-5.6-terra
