id: MAT.27.46
reference: Matthew 27:46
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: περὶ δὲ τὴν ἐνάτην ὥραν ⸀ἀνεβόησεν ὁ Ἰησοῦς φωνῇ μεγάλῃ λέγων· ⸂Ἠλὶ ἠλὶ⸃ λεμὰ σαβαχθάνι; τοῦτ’ ἔστιν· Θεέ μου θεέ μου, ἱνατί με ἐγκατέλιπες;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/046.yaml
  text: About the ninth hour Jesus cried out with a loud voice[a], saying, “Eli, Eli, lema sabachthani?” that is, “My God, my God[b], why have you forsaken me?”
translation:
  language: vi
  text: 'Khoảng giờ thứ chín, Giê-su kêu lên lớn tiếng[a]: “Ê-li, Ê-li, lê-ma sa-bách-tha-ni?” nghĩa là: “Lạy Đức Chúa Trời của con, lạy Đức Chúa Trời của con, sao Ngài lìa bỏ con?”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cách diễn đạt này gợi lại Thi Thiên 22:1.
    reason: cross_reference
  - marker: b
    text: 'Cũng có thể dịch: “sao Ngài đã lìa bỏ con?” Động từ Hy Lạp ở thì aorist; tiếng Việt không nhất thiết phải biểu thị rõ sự khác biệt về thì trong câu này.'
    reason: lexical_alternative
lexical_decisions:
- source_word: περὶ δὲ τὴν ἐνάτην ὥραν
  choice: Khoảng giờ thứ chín
  rationale: περί với đối cách chỉ thời gian mang nghĩa “khoảng”; δέ chỉ nối ý nhẹ nên không cần dịch thành một từ riêng. “Giờ thứ chín” giữ cách tính giờ của nguyên văn.
- source_word: ἀνεβόησεν ... φωνῇ μεγάλῃ
  choice: kêu lớn tiếng
  rationale: Động từ và cụm chỉ cách thức cùng nhấn mạnh tiếng kêu lớn. Cách diễn đạt này tự nhiên, trang nghiêm và tránh lặp ý vụng về trong tiếng Việt.
- source_word: λέγων
  choice: dấu hai chấm trước lời nói trực tiếp
  rationale: Phân từ giới thiệu nội dung tiếng kêu; trong tiếng Việt, dấu hai chấm truyền đạt chức năng này tự nhiên hơn việc thêm “rằng” hoặc “mà nói”.
- source_word: Ἠλὶ ἠλὶ λεμὰ σαβαχθάνι
  choice: Ê-li, Ê-li, lê-ma sa-bách-tha-ni?
  rationale: Giữ lại lời kêu bằng ngôn ngữ Sê-mít như chính Ma-thi-ơ đã làm, rồi mới đưa ra nghĩa của câu. Phiên âm có dấu giúp độc giả Việt đọc được mà không biến câu này thành bản dịch ngay từ đầu.
- source_word: τοῦτ’ ἔστιν
  choice: nghĩa là
  rationale: Công thức này giới thiệu phần dịch hoặc giải thích; “nghĩa là” ngắn gọn và tự nhiên.
- source_word: Θεέ μου θεέ μου
  choice: Lạy Đức Chúa Trời của con, lạy Đức Chúa Trời của con
  rationale: Thêm “lạy” để thể hiện hô cách một cách tự nhiên trong tiếng Việt, đồng thời giữ nguyên sự lặp lại và đại từ sở hữu của nguyên văn.
- source_word: ἱνατί
  choice: sao
  rationale: “Sao” là cách hỏi “tại sao” tự nhiên trong một tiếng kêu trực tiếp, vẫn giữ đầy đủ lực chất vấn của nguyên văn.
- source_word: ἐγκατέλιπες
  choice: Ngài lìa bỏ con
  rationale: “Lìa bỏ” phù hợp sắc thái trang nghiêm và tiếng vọng Thi Thiên 22:1. Động từ aorist có thể được hiểu theo lực quá khứ đơn, nhưng tiếng Việt không bắt buộc đánh dấu sự phân biệt giữa quá khứ đơn và hiện tại hoàn thành, nhờ đó không cần ép nghĩa vào một thì cụ thể.
theological_decisions:
- issue: Mối liên hệ giữa tiếng kêu của Chúa Giê-su và Thi Thiên 22:1
  choice: Dịch thẳng như một tiếng kêu thực sự về việc bị lìa bỏ, đồng thời giữ nguyên tiếng vọng của Thi Thiên và không giải thích thêm trong chính câu Kinh Thánh.
  alternative: Diễn đạt chủ yếu như một dấu hiệu trích dẫn Thi Thiên 22, hoặc làm nhẹ ý bị lìa bỏ bằng cách diễn giải.
  rationale: Nguyên văn ghi lại tiếng kêu và phần dịch của nó mà không kèm lời giải thích thần học. Bản dịch vì thế giữ nguyên sức nặng cùng sự căng thẳng thần học của lời nói, không quyết định thay cho độc giả tiếng kêu ấy phải được giải thích thế nào.
- issue: Giữ lời kêu bằng ngôn ngữ Sê-mít trong chính văn
  choice: Giữ câu phiên âm, rồi theo sau bằng phần giải nghĩa.
  alternative: Chỉ dịch ý nghĩa sang tiếng Việt.
  rationale: Ma-thi-ơ chủ ý ghi cả lời kêu nguyên dạng lẫn phần giải nghĩa. Giữ cả hai cũng bảo toàn chi tiết trần thuật liên quan đến việc những người đứng gần hiểu lầm “Ê-li” là lời gọi Ê-li trong mạch văn kế tiếp.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và dễ hiểu. Dùng “Chúa Giê-su” và “Đức Chúa Trời” nhất quán; “lạy” thể hiện hô cách tự nhiên. Câu phiên âm được Việt hóa bằng dấu và dấu gạch nối để dễ đọc. Dấu chú thích [b] đặt sau toàn bộ lời dịch vì chú thích liên quan đến động từ ở cuối câu.
