  terminology: “Ngài” nhất quán với văn phong Kinh Thánh tiếng Việt trang trọng. “Áo choàng” là lựa chọn rộng, tự nhiên cho χλαμύς; “đỏ thắm” truyền đạt tốt sắc đỏ tươi/scarlet của κοκκίνην. Chú thích nêu khả năng “áo choàng ngắn” cách thích đáng mà không biến đó thành khẳng định chắc chắn.
