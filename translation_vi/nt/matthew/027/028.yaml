  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἐκδύσαντες αὐτὸν ⸂χλαμύδα κοκκίνην περιέθηκαν αὐτῷ⸃,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/028.yaml
  text: And after stripping him[a], they put a scarlet cloak on him,
translation:
  language: vi
  text: Sau khi lột áo Ngài, họ khoác cho Ngài một chiếc áo choàng đỏ thắm[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “áo choàng ngắn màu đỏ thắm.” Từ Hy Lạp chỉ một loại áo khoác ngoài hoặc áo choàng, thường gắn với binh lính hay quan chức.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Sau khi
  rationale: Liên từ καί kết hợp với phân từ aorist được diễn đạt tự nhiên trong tiếng Việt qua cấu trúc nối tiếp “Sau khi...”, làm rõ hành động lột áo xảy ra trước hành động khoác áo mà không thêm ý nghĩa ngoài văn cảnh.
- source_word: ἐκδύσαντες αὐτόν
  choice: lột áo Ngài
  rationale: ἐκδύω có nghĩa cởi hoặc lột quần áo khỏi một người. “Lột áo Ngài” tự nhiên, rõ nghĩa và giữ sắc thái bị động, nhục nhã của hành động; không khẳng định quá mức rằng Ngài hoàn toàn trần truồng.
- source_word: χλαμύδα
  choice: một chiếc áo choàng
  rationale: χλαμύς chỉ một loại áo khoác ngoài, thường là áo choàng ngắn gắn với binh lính hoặc quan chức. “Áo choàng” là cách gọi tự nhiên, đủ rộng và không tự ý gia tăng hàm ý vương giả.
- source_word: κοκκίνην
  choice: đỏ thắm
  rationale: κόκκινος chỉ màu đỏ tươi hoặc đỏ thắm. “Đỏ thắm” giữ được sắc màu nổi bật của từ Hy Lạp và phù hợp với văn phong trang nghiêm, hiện đại.
- source_word: περιέθηκαν αὐτῷ
  choice: họ khoác cho Ngài
  rationale: περιτίθημι với tặng cách ở đây diễn tả việc đặt hoặc choàng y phục lên một người. “Khoác cho Ngài” là cách diễn đạt tự nhiên và chính xác trong tiếng Việt.
theological_decisions:
- issue: Tính chất của y phục trong cảnh chế giễu
  choice: áo choàng đỏ thắm
  alternative: áo bào đỏ thắm; áo choàng ngắn màu đỏ thắm
  rationale: Bản dịch giữ nghĩa từ vựng của χλαμύς là áo choàng ngoài, có thể thuộc kiểu quân phục, nhưng không gọi thẳng là “áo bào” để tránh đưa thêm hàm ý vương quyền vượt quá chính từ ngữ Hy Lạp. Màu đỏ thắm vẫn bảo toàn yếu tố của màn phong vương giả.
translation_notes:
  register: Tiếng Việt hiện đại, trang nghiêm và dễ hiểu. Dùng “Ngài” để chỉ Chúa Giê-su; cấu trúc “Sau khi...” thể hiện tự nhiên quan hệ thời gian của phân từ Hy Lạp. Dấu chú thích [a] được đặt ngay sau cụm từ mà chú thích giải thích.
