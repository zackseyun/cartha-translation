source:
  edition: SBLGNT
  text: συμβούλιον δὲ λαβόντες ἠγόρασαν ἐξ αὐτῶν τὸν Ἀγρὸν τοῦ Κεραμέως εἰς ταφὴν τοῖς ξένοις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/007.yaml
  text: So after taking counsel[b][a], they bought the Potter’s Field with them as a burial place for foreigners.
translation:
  language: vi
  text: Vậy, sau khi bàn bạc, họ lấy số bạc ấy[a] mua Ruộng Thợ Gốm để làm nơi chôn cất người ngoại xứ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “từ chúng,” tức là từ những đồng bạc đã được nhắc đến trong văn cảnh trước.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “người xa lạ” hoặc “người ngoại quốc.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: συμβούλιον ... λαβόντες
  choice: sau khi bàn bạc
  rationale: Diễn đạt tự nhiên thành ngữ Hy Lạp có nghĩa đen là “sau khi đã bàn tính,” đồng thời giữ rõ hành động cân nhắc chung.
- source_word: δὲ
  choice: Vậy
  rationale: Ở đây δέ tiếp nối diễn tiến câu chuyện và dẫn đến quyết định của họ, không biểu thị sự tương phản mạnh.
- source_word: ἠγόρασαν
  choice: mua
  rationale: Diễn đạt trực tiếp động từ ἀγοράζω ở thì aorist.
- source_word: ἐξ αὐτῶν
  choice: lấy số bạc ấy
  rationale: Đại từ số nhiều trung tính quay lại các đồng bạc trong văn cảnh trước. Cách diễn đạt này tự nhiên trong tiếng Việt và không cần lặp dài dòng.
- source_word: τὸν Ἀγρὸν τοῦ Κεραμέως
  choice: Ruộng Thợ Gốm
  rationale: Giữ cấu trúc định danh của địa điểm, với sở hữu cách τοῦ Κεραμέως chỉ người thợ gốm.
- source_word: εἰς ταφὴν
  choice: để làm nơi chôn cất
  rationale: Thể hiện rõ ý chỉ mục đích của εἰς với ταφή bằng tiếng Việt tự nhiên.
- source_word: τοῖς ξένοις
  choice: người ngoại xứ
  rationale: ξένοις có thể chỉ người từ nơi khác đến hoặc người xa lạ. “Người ngoại xứ” giữ được nét nghĩa người ngoài địa phương mà không thu hẹp nhất thiết vào quốc tịch khác.
theological_decisions:
- issue: Đối tượng quy chiếu của αὐτῶν
  choice: Hiểu đại từ này là chỉ các đồng bạc Giu-đa đã trả lại, dịch là “số bạc ấy.”
  alternative: Có thể dịch sát hình thức hơn là “từ chúng,” nhưng cách này không tự nhiên và khó hiểu trong tiếng Việt.
  rationale: Văn cảnh ngay trước xác định rõ các đồng bạc là đối tượng quy chiếu; bản dịch làm sáng tỏ quan hệ ấy mà không thêm một cách giải thích thần học.
- issue: Phạm vi nghĩa của ξένοις
  choice: Dịch là “người ngoại xứ.”
  alternative: “Người xa lạ” hoặc “người ngoại quốc.”
  rationale: Từ Hy Lạp không tự nó quyết định đây là người khác quốc tịch hay rộng hơn là người từ nơi khác đến; “người ngoại xứ” bảo toàn độ rộng ấy.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Bàn bạc” tự nhiên hơn lối dịch sát “lấy ý kiến”; “Ruộng Thợ Gốm” được viết hoa như tên gọi địa điểm trong câu chuyện.
