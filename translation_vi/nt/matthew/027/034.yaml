id: MAT.27.34
reference: Matthew 27:34
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἔδωκαν αὐτῷ πιεῖν ⸀οἶνον μετὰ χολῆς μεμιγμένον· καὶ γευσάμενος οὐκ ⸀ἠθέλησεν πιεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/034.yaml
  text: They gave him wine mixed with gall to drink[a], but after tasting it, he was unwilling to drink.
translation:
  language: vi
  text: Họ đưa cho Đức Giê-su rượu pha với mật đắng để uống[a]; nhưng sau khi nếm, Ngài không muốn uống.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hy Lạp χολή có thể có nghĩa là “mật” hoặc, theo nghĩa rộng hơn, một chất đắng. Bản dịch giữ cách nói “mật đắng” để phản ánh lời văn của Ma-thi-ơ; so sánh trình thuật thương khó có liên quan trong Mác 15:23, nơi nhắc đến mộc dược.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔδωκαν αὐτῷ πιεῖν
  choice: Họ đưa cho Đức Giê-su ... để uống
  rationale: Động từ δίδωμι được dịch trực tiếp là “đưa cho”; cấu trúc với động từ nguyên mẫu πιεῖν diễn tả thứ được đưa cho Ngài uống. Tên “Đức Giê-su” được dùng thay đại từ để câu đứng riêng vẫn rõ chủ thể.
- source_word: οἶνον
  choice: rượu
  rationale: οἶνος là từ thông thường chỉ rượu; “rượu” tự nhiên và chính xác trong tiếng Việt.
- source_word: μετὰ χολῆς μεμιγμένον
  choice: pha với mật đắng
  rationale: μεμιγμένον có nghĩa là “đã được pha/trộn”, còn χολή có thể chỉ mật hoặc rộng hơn là chất đắng. “Mật đắng” giữ được hình ảnh cụ thể lẫn sắc thái đắng của từ Hy Lạp mà không đồng nhất nó với một chất được nêu trong sách Mác.
- source_word: καὶ γευσάμενος
  choice: nhưng sau khi nếm
  rationale: 'Phân từ γευσάμενος diễn tả hành động xảy ra trước: “sau khi nếm”. καί được chuyển thành “nhưng” để thể hiện tự nhiên sự tương phản tiếp theo trong mạch kể.'
- source_word: οὐκ ἠθέλησεν πιεῖν
  choice: Ngài không muốn uống
  rationale: θέλω nói đến ý muốn hoặc sự sẵn lòng. “Không muốn uống” bảo toàn sắc thái ý chí mà không tăng mức độ thành “từ chối”.
theological_decisions:
- issue: Cách dịch χολή trong trình thuật thương khó và âm hưởng Kinh Thánh
  choice: mật đắng
  alternative: chất đắng
  rationale: χոլή có thể chỉ mật/dịch mật hoặc một chất có vị đắng. “Mật đắng” giữ hình ảnh và tính cụ thể trong lời văn của Ma-thi-ơ, đồng thời chú thích vẫn nêu rõ phạm vi nghĩa rộng hơn; không hòa đồng cách diễn đạt này với “mộc dược” trong Mác 15:23.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Giê-su” và “Ngài” phù hợp lối văn Kinh Thánh tiếng Việt phổ thông; câu giữ sát trật tự ý của bản Hy Lạp nhưng điều chỉnh liên từ để tự nhiên trong tiếng Việt.
