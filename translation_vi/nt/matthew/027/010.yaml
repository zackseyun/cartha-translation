source:
  edition: SBLGNT
  text: καὶ ἔδωκαν αὐτὰ εἰς τὸν ἀγρὸν τοῦ κεραμέως, καθὰ συνέταξέν μοι κύριος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/010.yaml
  text: and they gave them for the potter's field[b][a], just as the Lord directed me.
translation:
  language: vi
  text: và họ đã dùng số bạc ấy để mua ruộng của người thợ gốm, đúng như Chúa đã truyền cho tôi.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch “đã ra lệnh cho tôi” hoặc “đã chỉ thị cho tôi.”
    reason: lexical_alternative
  - marker: b
    text: Trong lời trích dẫn/ám chỉ tiên tri này, Ma-thi-ơ giữ cách nói ở ngôi thứ nhất “tôi”, thay vì điều chỉnh cho phù hợp với mạch kể chuyện.
    reason: cross_reference
lexical_decisions:
- source_word: ἔδωκαν αὐτὰ εἰς τὸν ἀγρὸν
  choice: họ đã dùng số bạc ấy để mua ruộng
  rationale: Cụm này theo nghĩa đen là “họ đã trao chúng cho/vào ruộng,” nhưng trong ngữ cảnh xử lý số bạc để mua ruộng, cách diễn đạt tự nhiên và chính xác trong tiếng Việt là “dùng số bạc ấy để mua ruộng.” “Số bạc ấy” giữ được quy chiếu về các đồng bạc dù tiếng Việt không cần mô phỏng hình thức số nhiều của αὐτά.
- source_word: τοῦ κεραμέως
  choice: của người thợ gốm
  rationale: Dịch sở hữu cách một cách trực tiếp, tự nhiên; không xác định thêm người thợ gốm là chủ cũ hay người gắn với tên gọi của ruộng.
- source_word: καθὰ
  choice: đúng như
  rationale: Giữ sắc thái tương ứng rõ của καθά, đồng thời phù hợp văn phong tiếng Việt hiện đại.
- source_word: συνέταξέν
  choice: đã truyền
  rationale: συντάσσω diễn tả sự chỉ thị có thẩm quyền. “Truyền” tự nhiên trong ngữ cảnh Chúa phán dạy, nhưng không nhất thiết mang sắc thái gay gắt của “ra lệnh.”
- source_word: μοι
  choice: cho tôi
  rationale: Giữ nguyên đại từ ngôi thứ nhất và quan hệ gián tiếp của dạng tặng cách, không điều chỉnh theo bối cảnh trần thuật.
- source_word: κύριος
  choice: Chúa
  rationale: Cách gọi trang trọng và thông dụng trong tiếng Việt dành cho κύριος ở ngữ cảnh này.
theological_decisions:
- issue: Ngôi của người nói trong lời trích dẫn/ám chỉ tiên tri
  choice: Giữ nguyên “cho tôi” theo μοι trong bản Hy Lạp.
  alternative: Điều chỉnh đại từ hoặc diễn giải để phù hợp rõ hơn với bối cảnh trần thuật hay câu Cựu Ước được ám chỉ.
  rationale: Bản SBLGNT ghi μοι (“cho tôi”). Giữ nguyên ngôi thứ nhất giúp minh bạch với nguồn và bảo toàn độ căng trong cách Ma-thi-ơ sử dụng lời tiên tri, thay vì âm thầm hài hòa hóa.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Câu dùng lối diễn đạt tự nhiên “dùng số bạc ấy để mua” để chuyển tải thành ngữ giao dịch của εἰς sau δίδωμι; vẫn giữ rõ “cho tôi” nhằm bảo toàn hình thức nguồn.
