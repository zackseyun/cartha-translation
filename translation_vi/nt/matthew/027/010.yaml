  source_fidelity: 'Bản dịch phản ánh đúng ý của καὶ ἔδωκαν αὐτὰ εἰς τὸν ἀγρὸν τοῦ κεραμέως trong ngữ cảnh giao dịch: “họ đã dùng số bạc ấy để mua ruộng của người thợ gốm.” Cách chuyển này diễn đạt tự nhiên giá trị ngữ cảnh của ἔδωκαν ... εἰς, đồng thời “số bạc ấy” quy chiếu thích đáng đến αὐτά. “Đúng như Chúa đã truyền cho tôi” giữ được tương quan của καθὰ, sắc thái mệnh lệnh/chỉ thị của συνέταξεν, và đặc biệt giữ nguyên μοι ở ngôi thứ nhất.'
  naturalness: Câu văn là tiếng Việt tiêu chuẩn hiện đại, rõ ràng và có giọng trang trọng phù hợp văn mạch Kinh Thánh. Cụm “dùng số bạc ấy để mua” tự nhiên hơn một bản dịch hình thức kiểu “trao chúng vào ruộng,” vốn không thành ngữ trong tiếng Việt.
  terminology: “Ruộng của người thợ gốm” chuyển tải chính xác sở hữu cách τοῦ κεραμέως. “Chúa” là cách dịch trang trọng, thông dụng và phù hợp cho κύριος trong ngữ cảnh trích dẫn này. “Đã truyền cho tôi” thích hợp cho συνέταξέν μοι mà không làm yếu hoặc cường điệu sắc thái chỉ thị có thẩm quyền.
