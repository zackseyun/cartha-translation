  text: But some of those standing there[a], when they heard it, were saying[b], “This man is calling Elijah.”
translation:
  language: vi
  text: 'Nhưng có vài người đứng đó, khi nghe tiếng ấy, nói: “Người này đang gọi Ê-li.”[a]


    [a] Có lẽ những người đứng đó đã hiểu lầm tiếng kêu của Chúa Giê-su ở câu trước là lời Ngài gọi Ê-li.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Có lẽ những người đứng đó đã hiểu lầm tiếng kêu của Chúa Giê-su ở câu trước là lời Ngài gọi Ê-li.
    reason: cross_reference
lexical_decisions:
- source_word: τινὲς
  choice: một vài người
  rationale: Diễn đạt tự nhiên một nhóm không xác định trong số những người có mặt.
- source_word: δὲ
  choice: Nhưng
  rationale: 'Thể hiện bước chuyển có sắc thái tương phản nhẹ: sau tiếng kêu của Đức Chúa Jêsus là phản ứng của một số người đứng gần đó.'
- source_word: τῶν ἐκεῖ ἑστηκότων
  choice: trong số những người đứng đó
  rationale: Giữ hình ảnh cụ thể của phân từ hoàn thành ἑστηκότων, chỉ những người đang có mặt và đứng tại nơi ấy.
- source_word: ἀκούσαντες
  choice: khi nghe thấy
  rationale: Diễn đạt hành động xảy ra trước động từ chính; đối tượng được nghe để ngầm theo văn cảnh, đúng như bản Hy Lạp.
- source_word: ἔλεγον
  choice: thì nói
  rationale: Tiếng Việt tự nhiên thường dùng động từ quá khứ không đánh dấu thể; cách này không cường điệu sắc thái tiếp diễn hoặc lặp lại của thì chưa hoàn thành Hy Lạp.
- source_word: Ἠλίαν
  choice: Ê-li
  rationale: Dùng dạng tên riêng quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
- source_word: φωνεῖ
  choice: đang gọi
  rationale: Giữ thì hiện tại trong lời nhận định của những người đứng đó và không thêm ý ‘gọi đến’ hay ‘kêu cầu’, vốn sẽ giải thích quá mức động từ Hy Lạp.
- source_word: οὗτος
  choice: Người này
  rationale: Giữ lực chỉ định của đại từ οὗτος mà không mặc nhiên gán giọng khinh miệt cho người nói.
theological_decisions:
- issue: Lời nói của những người đứng đó có xác nhận Đức Chúa Jêsus thực sự gọi Ê-li hay chỉ thuật lại cách họ hiểu tiếng kêu của Ngài?
  choice: 'Trình bày nguyên vẹn lời nhận định của họ: “Người này đang gọi Ê-li.”'
  alternative: “Người này đang kêu cầu Ê-li” hoặc “Người này đang gọi Ê-li đến.”
  rationale: Bản Hy Lạp thuật lại điều những người ấy nói, không xác nhận cách hiểu của họ là đúng. Bản dịch giữ nguyên tính mỉa mai và căng thẳng của trình thuật; chú thích chỉ nêu đây có lẽ là sự hiểu lầm, thay vì đưa kết luận ấy vào chính văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng nhưng dễ hiểu. Cấu trúc “khi nghe thấy, thì nói” bám sát quan hệ thời gian của câu Hy Lạp; “Người này” bảo toàn sắc thái chỉ định mà không thêm thái độ không chắc chắn từ văn bản.
