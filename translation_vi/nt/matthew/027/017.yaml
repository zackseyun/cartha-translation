reference: Matthew 27:17
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: συνηγμένων οὖν αὐτῶν εἶπεν αὐτοῖς ὁ Πιλᾶτος· Τίνα θέλετε ἀπολύσω ὑμῖν, ⸂Ἰησοῦν τὸν⸃ Βαραββᾶν ἢ Ἰησοῦν τὸν λεγόμενον χριστόν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/017.yaml
  text: 'So when they had gathered together[a], Pilate said to them, “Which one do you want me to release to you: Jesus Barabbas[b], or Jesus who is called Messiah?”'
translation:
  language: vi
  text: 'Vậy, khi họ đã tụ họp, Phi-lát nói với họ: “Các người muốn ta thả ai cho các người: Giê-su Ba-ra-ba[a], hay Giê-su được gọi là Đấng Mê-si-a[b]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Một số thủ bản chỉ ghi “Ba-ra-ba” thay vì “Giê-su Ba-ra-ba”.
    reason: textual_variant
  - marker: b
    text: Hoặc “Đấng Christ”. Từ Hy Lạp christos, một tước hiệu, ở đây được dịch là “Đấng Mê-si-a”.
    reason: alternative_reading
lexical_decisions:
- source_word: συνηγμένων
  choice: khi họ đã tụ họp lại
  rationale: Phân từ hoàn thành trong kết cấu sở hữu cách tuyệt đối mang ý nghĩa thời gian; cách dịch này diễn đạt việc tụ họp đã diễn ra trước khi Phi-lát đặt câu hỏi.
- source_word: οὖν
  choice: Vậy
  rationale: Giữ chức năng liên kết và tiếp nối mạch tường thuật mà vẫn tự nhiên trong tiếng Việt hiện đại.
- source_word: Τίνα θέλετε ἀπολύσω ὑμῖν
  choice: Các người muốn ta thả ai cho các người
  rationale: Diễn đạt trực tiếp sự lựa chọn giữa hai người; “thả” phù hợp với bối cảnh một tù nhân được phóng thích, không hàm ý tha tội hay tuyên bố vô tội.
- source_word: Ἰησοῦν τὸν Βαραββᾶν
  choice: Giê-su Ba-ra-ba
  rationale: Theo bản văn SBLGNT có tên Ἰησοῦν, qua đó giữ nguyên sự đối chiếu nổi bật giữa hai người cùng mang tên Giê-su.
- source_word: Ἰησοῦν τὸν λεγόμενον χριστόν
  choice: Giê-su được gọi là Đấng Mê-si
  rationale: “Được gọi là” phản ánh λεγόμενον mà không thêm sắc thái coi thường; χριστός ở đây là tước hiệu nên được dịch theo nghĩa là “Đấng Mê-si”.
theological_decisions:
- issue: Cách dịch χριστός
  choice: Đấng Mê-si
  alternative: Đấng Christ
  rationale: Trong cụm “được gọi là…”, χριστός hoạt động rõ ràng như một tước hiệu. “Đấng Mê-si” chuyển tải chức năng ấy và không biến tước hiệu thành họ tên.
- issue: Có giữ tên Giê-su trước Ba-ra-ba hay không
  choice: 'Giữ trong chính văn: “Giê-su Ba-ra-ba”'
  alternative: Chỉ ghi “Ba-ra-ba”
  rationale: Bản văn nguồn SBLGNT có Ἰησοῦν; dị bản ngắn hơn được bảo tồn trong chú thích thay vì âm thầm thay đổi chính văn.
translation_notes:
  register: 'Văn phong trang trọng nhưng hiện đại, dùng các dạng tên quen thuộc trong tiếng Việt: Phi-lát, Giê-su và Ba-ra-ba. Đại từ “các người/ta” thể hiện lời một viên tổng trấn nói với đám đông mà không tạo sắc thái kính trọng không có trong nguyên văn.'
