  to: 'Vậy, khi họ đã tụ họp, Phi-lát nói với họ: “Các người muốn ta thả ai cho các người: Giê-su Ba-ra-ba[a], hay Giê-su được gọi là Đấng Mê-si-a[b]?”'
  rationale: Bản sửa thay động từ dẫn thoại để sát εἶπεν, chuẩn hóa cách phiên âm tước hiệu thành “Mê-si-a”, và điều chỉnh chú thích cho tự nhiên, rõ nghĩa. Các yếu tố văn bản quan trọng khác—đặc biệt tên “Giê-su Ba-ra-ba” và dị bản liên quan—được giữ nguyên.
