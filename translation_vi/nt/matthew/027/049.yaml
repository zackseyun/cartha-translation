  text: οἱ δὲ λοιποὶ ⸀ἔλεγον· Ἄφες ἴδωμεν εἰ ἔρχεται Ἠλίας σώσων ⸀αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/049.yaml
  text: But the rest said[a], “Leave him alone[b]. Let us see whether Elijah is coming to save him.”
translation:
  language: vi
  text: 'Còn những người khác thì nói[a]: “Cứ để ông ấy yên. Chúng ta hãy xem Ê-li có đến cứu ông ấy không[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “những người còn lại nói.” Động từ Hy Lạp ở thì chưa hoàn thành; tùy ngữ cảnh có thể gợi ý họ đang hoặc tiếp tục nói.'
    reason: lexical_alternative
  - marker: b
    text: Động từ Hy Lạp có nghĩa đen là “có đang đến để cứu ông ấy không.” Trong tiếng Việt, “có đến cứu ông ấy không” tự nhiên hơn; ngữ cảnh vẫn là chờ xem điều đó có xảy ra ngay lúc ấy hay không.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ λοιποὶ
  choice: Nhưng những người còn lại
  rationale: Cụm này chỉ những người còn lại, đối lập với người vừa hành động ở câu trước; “những người còn lại” vừa tự nhiên vừa giữ được sắc thái tương phản của δέ.
- source_word: ἔλεγον
  choice: nói
  rationale: Thì chưa hoàn thành có thể gợi hành động đang diễn ra hoặc lặp lại, nhưng trong lời kể tiếng Việt, “nói” là cách diễn đạt tự nhiên và không cường điệu hóa thể của động từ.
- source_word: Ἄφες
  choice: Cứ để vậy
  rationale: Đây là mệnh lệnh số ít, nghĩa đen là “hãy để/cho phép”. Nguyên văn không nêu rõ tân ngữ; “Cứ để vậy” giữ được phần nào sự hàm ẩn ấy và trong ngữ cảnh có nghĩa là đừng tiếp tục can thiệp.
- source_word: ἴδωμεν
  choice: Hãy xem
  rationale: Động từ ở lối giả định ngôi thứ nhất số nhiều, dùng để thúc giục cả nhóm cùng quan sát; “Hãy xem” là cách diễn đạt gọn và tự nhiên trong tiếng Việt.
- source_word: εἰ ἔρχεται
  choice: có đến ... không
  rationale: εἰ mở đầu một câu hỏi gián tiếp. Cấu trúc “có ... không” là tương đương tự nhiên trong tiếng Việt; “đến” không buộc phải xác định quá mức là hiện tại tiếp diễn hay tương lai.
- source_word: Ἠλίας
  choice: Ê-li
  rationale: Dùng dạng tên riêng Kinh Thánh quen thuộc trong tiếng Việt.
- source_word: σώσων αὐτόν
  choice: cứu ông ấy
  rationale: Phân từ tương lai σώσων diễn tả mục đích gắn với động từ “đến”. “Cứu” giữ liên hệ từ vựng với σῴζω và phù hợp với ý giải thoát khỏi cái chết trong cảnh này; “ông ấy” là đại từ tự nhiên, không đưa thêm sắc thái khinh miệt vốn không nằm trong từ Hy Lạp.
theological_decisions:
- issue: Hàm ý thần học của σῴζω trong trình thuật đóng đinh
  choice: Dịch là “cứu ông ấy”, trước hết theo nghĩa giải thoát hữu hình khỏi thập tự giá.
  alternative: “giải cứu ông ấy”
  rationale: Những người đang nói chờ xem Ê-li có giải thoát Đức Giê-su khỏi cái chết hay không, chứ không trực tiếp phát biểu một giáo lý về sự cứu rỗi đời đời. “Cứu” vẫn giữ được sự cộng hưởng và tính mỉa mai trong trình thuật thương khó mà không áp đặt cách giải nghĩa thần học.
translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng gần gũi. “Cứ để vậy” giữ sự ngắn gọn của mệnh lệnh và không bổ sung một tân ngữ mà nguyên văn không nói rõ. Câu hỏi dùng cấu trúc tiếng Việt tự nhiên, đồng thời chú thích bảo tồn sắc thái hiện tại của ἔρχεται.
