  source_fidelity: 'Bản dịch truyền đạt đúng ý chính: những người khác/người còn lại yêu cầu dừng lại để chờ xem Ê-li có đến cứu Đức Giê-su không. Tuy nhiên, “Cứ để vậy” không nêu rõ đối tượng được hàm ý trong ngữ cảnh của mệnh lệnh Ἄφες và trong tiếng Việt dễ được hiểu là “cứ để sự việc như vậy”; nên làm rõ là bảo người đang can thiệp hãy để Đức Giê-su yên. “Hãy xem” cũng không biểu đạt rõ sắc thái hô cách ngôi thứ nhất số nhiều của ἴδωμεν.'
