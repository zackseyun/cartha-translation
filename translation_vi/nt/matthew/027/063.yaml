  text: λέγοντες· Κύριε, ἐμνήσθημεν ὅτι ἐκεῖνος ὁ πλάνος εἶπεν ἔτι ζῶν· Μετὰ τρεῖς ἡμέρας ἐγείρομαι·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/063.yaml
  text: saying[a], “Lord, we remember that that deceiver said while he was still alive[b], ‘After three days I rise.’”
translation:
  language: vi
  text: 'nói rằng: “Thưa ngài, chúng tôi nhớ rằng kẻ lừa dối ấy, khi còn sống, đã nói: ‘Sau ba ngày, tôi sẽ sống lại.’[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Sau ba ngày, tôi sẽ được làm cho sống lại.” Động từ Hy Lạp có hình thức hiện tại, theo sát chữ có thể là “tôi sống lại” hoặc “tôi được làm cho sống lại.”'
    reason: alternative_reading
lexical_decisions:
- source_word: λέγοντες
  choice: nói rằng
  rationale: Phân từ hiện tại nối lời trình bày này với hành động ở câu trước; “nói rằng” tự nhiên trong tiếng Việt và giữ được quan hệ cú pháp ấy.
- source_word: Κύριε
  choice: Thưa ngài
  rationale: Đây là lời xưng hô kính trọng với Phi-lát; “Thưa ngài” phù hợp ngữ cảnh hơn “Lạy Chúa” và không hàm ý người nói nhìn nhận thần tính của ông.
- source_word: ἐμνήσθημεν
  choice: chúng tôi nhớ
  rationale: Dù hình thái Hy Lạp là aorist, trong lời nói trực tiếp, “chúng tôi nhớ” diễn đạt tự nhiên việc hồi tưởng đang có ý nghĩa ở hiện tại.
- source_word: ἐκεῖνος ὁ πλάνος
  choice: kẻ lừa dối ấy
  rationale: “Kẻ lừa dối” diễn đạt πλάνος trong lời nói thù nghịch; “ấy” giữ sắc thái chỉ trỏ và xa cách của ἐκεῖνος.
- source_word: ἔτι ζῶν
  choice: khi còn sống
  rationale: 'Diễn đạt gọn và tự nhiên hoàn cảnh thời gian: lời ấy được nói trước khi người đó chết.'
- source_word: Μετὰ τρεῖς ἡμέρας
  choice: Sau ba ngày
  rationale: Giữ đúng nghĩa thông thường của μετά với đối cách và không đồng nhất hóa với cách nói “vào ngày thứ ba” ở những chỗ khác.
- source_word: ἐγείρομαι
  choice: tôi sẽ sống lại
  rationale: Trong tiếng Việt, cách diễn đạt này tự nhiên và rõ nghĩa khi trích dẫn một lời tiên báo. Hình thái hiện tại trung động/bị động của tiếng Hy Lạp không thể được giữ nguyên một cách tự nhiên mà không gây tối nghĩa, nên các khả năng khác được ghi ở chú thích.
theological_decisions:
- issue: Cách dịch lời tiên báo về sự sống lại của Chúa Giê-su
  choice: Sau ba ngày, tôi sẽ sống lại
  alternative: Sau ba ngày, tôi sẽ được khiến sống lại / Sau ba ngày, tôi sống lại
  rationale: ἐγείρομαι là hình thái hiện tại có thể được hiểu theo sắc thái trung động hoặc bị động, nhưng trong ngữ cảnh lời tiên báo, tiếng Việt cần dấu hiệu tương lai để câu tự nhiên. Bản dịch chính dùng “sẽ sống lại” mà không quyết định rõ tác nhân; chú thích bảo lưu hình thái và khả năng bị động của nguyên văn.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. “Thưa ngài” là lối xưng hô kính trọng thích hợp khi nói với Phi-lát; dấu ngoặc kép lồng nhau làm rõ lời được thuật lại.
