  terminology: “Giờ thứ sáu,” “giờ thứ chín,” và “bóng tối” nhất quán với thuật ngữ Kinh Thánh thông dụng mà vẫn sáng rõ cho tiếng Việt hiện đại. Chú thích thời gian và chú thích về γῆ đều phù hợp; “đất” trong chú thích giữ được lựa chọn từ vựng thay thế mà không quyết định phạm vi biến cố theo một cách giải thích giáo phái.
