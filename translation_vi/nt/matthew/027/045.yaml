  source_fidelity: 'Bản dịch chuyển tải đúng các thành tố chính của nguyên văn: mốc bắt đầu và kết thúc theo cách tính giờ cổ, sự xuất hiện của bóng tối, và phạm vi “khắp xứ.” Cách dùng “bóng tối bao phủ” là lối diễn đạt tiếng Việt tự nhiên cho σκότος ἐγένετο ἐπὶ..., không làm thay đổi nội dung. “Xứ” là lựa chọn thận trọng, phù hợp với khả năng nghĩa địa phương của γῆ; chú thích bảo lưu cách hiểu rộng hơn.'
