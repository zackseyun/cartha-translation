  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἀπὸ δὲ ἕκτης ὥρας σκότος ἐγένετο ἐπὶ πᾶσαν τὴν γῆν ἕως ὥρας ἐνάτης.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/045.yaml
  text: From the sixth hour darkness came over all the land until the ninth hour[a][b].
translation:
  language: vi
  text: Từ giờ thứ sáu, bóng tối bao phủ khắp xứ cho đến giờ thứ chín.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Giờ thứ sáu vào khoảng mười hai giờ trưa, còn giờ thứ chín vào khoảng ba giờ chiều.
    reason: cultural_note
  - marker: b
    text: Cũng có thể dịch là “khắp đất”. Từ Hy Lạp này có thể chỉ “xứ” hoặc “đất”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀπὸ δὲ
  choice: Từ
  rationale: ἀπό nêu thời điểm bắt đầu; δέ là từ nối nhẹ, không nhất thiết phải thể hiện riêng trong tiếng Việt vì câu vẫn tự nhiên và không làm quá mạnh sắc thái tương phản.
- source_word: ἕκτης ὥρας
  choice: giờ thứ sáu
  rationale: Giữ cách tính giờ của nguyên văn; chú thích giải thích tương đương khoảng giữa trưa cho độc giả hiện đại.
- source_word: σκότος
  choice: bóng tối
  rationale: Diễn đạt trực tiếp nghĩa thông thường của σκότος và giữ sắc thái mạnh, cụ thể của biến cố.
- source_word: ἐγένετο
  choice: bao phủ
  rationale: Trong cấu trúc với ἐπί, cách nói 'bóng tối bao phủ' là tiếng Việt tự nhiên, truyền đạt sự xuất hiện và lan trên một khu vực mà không dùng lối dịch gượng 'trở nên'.
- source_word: ἐπὶ πᾶσαν τὴν γῆν
  choice: khắp xứ
  rationale: γῆ có thể chỉ vùng đất/xứ hoặc toàn thể đất; 'khắp xứ' là cách hiểu thận trọng theo bối cảnh, còn khả năng 'khắp đất' được giữ trong chú thích.
- source_word: ἕως ὥρας ἐνάτης
  choice: cho đến giờ thứ chín
  rationale: Giữ nguyên cách chỉ giờ của bản Hy Lạp; chú thích cung cấp giờ tương đương hiện đại.
theological_decisions:
- issue: Phạm vi của γῆ trong lời thuật về bóng tối
  choice: xứ
  alternative: đất
  rationale: Danh từ γῆ có phạm vi nghĩa rộng và bản thân câu không giải quyết dứt khoát bóng tối chỉ phủ một vùng hay mang quy mô toàn địa cầu. Bản chính dùng 'xứ' theo bối cảnh gần, đồng thời chú thích bảo lưu cách hiểu 'đất' để không xóa bỏ sự mơ hồ và sức căng thần học của nguyên văn.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Giữ lối tính giờ cổ trong câu chính và giải thích bằng chú thích; dùng 'khắp xứ' gọn, tự nhiên, đồng thời bảo lưu nghĩa rộng hơn của γῆ.
