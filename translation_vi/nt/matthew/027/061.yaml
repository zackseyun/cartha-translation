  text: ἦν δὲ ἐκεῖ ⸀Μαριὰμ ἡ Μαγδαληνὴ καὶ ἡ ἄλλη Μαρία καθήμεναι ἀπέναντι τοῦ τάφου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/061.yaml
  text: Mary Magdalene and the other Mary were there, sitting opposite the tomb.
translation:
  language: vi
  text: Ma-ri Ma-đơ-len và Ma-ri kia ở đó, ngồi đối diện với ngôi mộ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἦν ... ἐκεῖ
  choice: ở đó
  rationale: Động từ số ít ἦν đứng trước hai chủ thể phối hợp, nhưng tiếng Việt không biến đổi động từ theo số; “ở đó” chuyển tải tự nhiên sự hiện diện của cả hai người.
- source_word: δὲ
  choice: không dịch thành từ riêng
  rationale: δέ là liên từ nhẹ để tiếp nối hoặc chuyển cảnh; trong tiếng Việt, mạch kể đã rõ nên không cần thêm “bấy giờ” hay “còn”, tránh tạo sắc thái thời gian hoặc tương phản quá mức.
- source_word: Μαριὰμ ἡ Μαγδαληνὴ
  choice: Ma-ri Ma-đơ-len
  rationale: Dùng dạng tên quen thuộc trong tiếng Việt hiện đại để chỉ Ma-ri quê Ma-đơ-la.
- source_word: ἡ ἄλλη Μαρία
  choice: Ma-ri kia
  rationale: ἄλλη phân biệt người này với Ma-ri Ma-đơ-len vừa được nhắc đến; “Ma-ri kia” tự nhiên và không hàm ý bà kém quan trọng.
- source_word: καθήμεναι
  choice: ngồi
  rationale: Phân từ hiện tại mô tả tư thế đang tiếp diễn của hai người tại nơi chôn cất.
- source_word: ἀπέναντι
  choice: đối diện với
  rationale: Giữ nghĩa vị trí ở phía đối diện hoặc hướng mặt về phía ngôi mộ, bằng cách nói rõ ràng và tự nhiên trong tiếng Việt.
- source_word: τοῦ τάφου
  choice: ngôi mộ
  rationale: Trong bối cảnh chôn cất Chúa Giê-su, “ngôi mộ” chính xác và trang trọng hơn “mồ”, đồng thời không cổ kính như một số cách gọi khác.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện ngắn gọn, trang trọng vừa phải và dễ hiểu trong tiếng Việt hiện đại. Không thêm từ nối đầu câu vì δέ chỉ đánh dấu sự tiếp nối nhẹ và không cần biểu hiện riêng trong câu này.
