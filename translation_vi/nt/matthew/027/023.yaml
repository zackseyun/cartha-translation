id: MAT.27.23
reference: Matthew 27:23
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὁ ⸀δὲ ἔφη· Τί γὰρ κακὸν ἐποίησεν; οἱ δὲ περισσῶς ἔκραζον λέγοντες· Σταυρωθήτω.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/023.yaml
  text: But he said[a], “What evil has he done?” But they cried out all the more, saying[b], “Let him be crucified.”
translation:
  language: vi
  text: 'Nhưng ông nói[a]: “Người này đã làm điều ác gì?” Còn họ càng gào lên: “Đóng đinh hắn vào thập tự giá!”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch tự nhiên hơn: “Tại sao? Người này đã làm điều gì sai?”'
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn dùng thể bị động, sát nghĩa là: “Hãy để hắn bị đóng đinh vào thập tự giá!”'
    reason: alternative_reading
lexical_decisions:
- source_word: ἔφη
  choice: ông nói
  rationale: Thì aorist ở đây giới thiệu lời nói trong mạch kể chuyện; “ông nói” là cách diễn đạt tự nhiên, không thêm sắc thái không có trong nguyên文.
- source_word: Τί γὰρ κακὸν ἐποίησεν;
  choice: Người này đã làm điều ác gì?
  rationale: Câu hỏi mang tính chất chất vấn; “điều ác gì” giữ được sức nặng đạo đức của κακόν, còn γάρ được chuyển tải tự nhiên qua ngữ cảnh thay vì dịch máy móc.
- source_word: περισσῶς ἔκραζον
  choice: càng gào lên
  rationale: “Càng” thể hiện mức độ gia tăng của περισσῶς; “gào lên” diễn đạt tiếng kêu lớn, dữ dội của κράζω. Dạng chưa hoàn thành cho thấy hành động tiếp diễn, nhưng tiếng Việt không cần đánh dấu riêng khi ý leo thang đã rõ.
- source_word: λέγοντες
  choice: (không dịch thành từ riêng)
  rationale: Trong tiếng Việt, nội dung trích dẫn ngay sau động từ “gào lên” đã tự nhiên biểu thị điều họ nói; thêm “mà rằng” sẽ nặng văn phong cổ.
- source_word: Σταυρωθήτω
  choice: Đóng đinh hắn vào thập tự giá!
  rationale: Mệnh lệnh ngôi ba bị động trong tiếng Hy Lạp được chuyển thành khẩu lệnh chủ động tự nhiên trong tiếng Việt; chú thích ghi nhận hình thức sát chữ.
- source_word: ὁ δὲ ... οἱ δὲ
  choice: Nhưng ông ... Còn họ ...
  rationale: “Nhưng” và “còn” giữ sự tương phản giữa lời của Philatô và phản ứng của đám đông mà không lặp liên từ một cách gượng gạo.
theological_decisions:
- issue: Hình thức lời đòi đóng đinh
  choice: Đóng đinh hắn vào thập tự giá!
  alternative: Hãy để hắn bị đóng đinh vào thập tự giá!
  rationale: Bản chính dùng khẩu lệnh tự nhiên, mạnh mẽ trong tiếng Việt; chú thích bảo tồn thông tin rằng nguyên văn dùng mệnh lệnh bị động, tránh suy diễn thần học từ sự chuyển đổi cú pháp.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “ông” cho Philatô và “người này” trong câu hỏi; dùng “hắn” trong tiếng gào của đám đông để phản ánh thái độ thù nghịch. Cả hai dấu chú thích [a], [b] đều xuất hiện trong chính văn.
