  text: εἶχον δὲ τότε δέσμιον ἐπίσημον λεγόμενον ⸀Ἰησοῦν Βαραββᾶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/016.yaml
  text: At that time they had a notorious prisoner called Jesus Barabbas[a].
translation:
  language: vi
  text: Lúc ấy, họ có một tù nhân khét tiếng tên là Giê-su Ba-ra-ba[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Một số thủ bản chỉ chép “Ba-ra-ba”, không có “Giê-su”.
    reason: textual_variant
lexical_decisions:
- source_word: εἶχον
  choice: họ có
  rationale: Giữ ý của động từ ἔχω ở thì chưa hoàn thành với chủ ngữ số nhiều không được nêu rõ, nhiều khả năng chỉ những người đang quản thúc tù nhân.
- source_word: δὲ
  choice: không dịch riêng
  rationale: Đây là liên từ chuyển ý nhẹ; trong tiếng Việt, mạch kể đã tự nhiên với cụm thời gian mở đầu, nên thêm “còn” hoặc “bấy giờ thì” sẽ nặng và dễ nhấn quá mức.
- source_word: τότε
  choice: lúc ấy
  rationale: Diễn đạt rõ ý thời gian bằng cách nói tự nhiên, gọn và trang trọng trong tiếng Việt hiện đại.
- source_word: δέσμιον
  choice: một tù nhân
  rationale: Chỉ người đang bị giam giữ; “tù nhân” là từ thông dụng và phù hợp bối cảnh xét xử.
- source_word: ἐπίσημον
  choice: khét tiếng
  rationale: Trong ngữ cảnh nói về một tù nhân, từ này nhiều khả năng mang sắc thái nổi tiếng vì điều xấu; “khét tiếng” thể hiện sắc thái ấy mà không thêm chi tiết ngoài bản văn.
- source_word: λεγόμενον
  choice: tên là
  rationale: Phân từ này giới thiệu tên gọi; “tên là” tự nhiên hơn lối dịch sát “được gọi là” trong câu tiếng Việt.
- source_word: Ἰησοῦν Βαραββᾶν
  choice: Giê-su Ba-ra-ba
  rationale: SBLGNT có cả tên Ἰησοῦν trước Βαραββᾶν, vì vậy bản chính giữ đầy đủ tên; dị bản lược bỏ “Giê-su” được ghi ở chú thích.
theological_decisions:
- issue: Dạng văn bản của tên Ba-ra-ba
  choice: 'Giữ “Giê-su” trong câu chính: “Giê-su Ba-ra-ba”.'
  alternative: Chỉ đọc “Ba-ra-ba”, không có “Giê-su”.
  rationale: Bản nguồn SBLGNT được cung cấp đọc Ἰησοῦν Βαραββᾶν. Bản dịch ưu tiên chứng cứ nguyên ngữ đã chỉ định, đồng thời giữ dị bản đáng chú ý trong chú thích mà không tự ý giải quyết căng thẳng văn bản.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, rõ ràng và trang trọng vừa phải. Câu giữ cấu trúc kể chuyện trực tiếp; tên riêng được phiên âm theo lối quen dùng trong tiếng Việt. Dấu chú thích [a] được đặt ngay sau tên liên quan.
