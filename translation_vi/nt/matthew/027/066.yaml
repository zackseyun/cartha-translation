  text: οἱ δὲ πορευθέντες ἠσφαλίσαντο τὸν τάφον σφραγίσαντες τὸν λίθον μετὰ τῆς κουστωδίας.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/066.yaml
  text: So they went and secured the tomb by sealing the stone with the guard.
translation:
  language: vi
  text: Vậy họ đi bảo đảm ngôi mộ được an toàn, bằng cách niêm phong tảng đá cùng với đội lính canh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể hiểu: “bằng cách niêm phong tảng đá và bố trí lính canh.” Cụm từ Hy Lạp rất cô đọng; “cùng với đội lính canh” có thể chỉ sự hiện diện hoặc liên hệ của đội lính trong việc niêm phong, chứ không nhất thiết nói đến một hành động riêng là bố trí lính canh.'
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ δὲ πορευθέντες
  choice: Vậy họ đi
  rationale: Phân từ πορευθέντες đi kèm động từ chính và được chuyển thành động từ hữu hạn cho tự nhiên trong tiếng Việt; δέ nối tiếp diễn biến câu chuyện, nên “Vậy” thể hiện mạch kể mà không nhấn mạnh sự tương phản.
- source_word: ἠσφαλίσαντο
  choice: làm cho ... được bảo vệ chắc chắn
  rationale: Động từ ἀσφαλίζω có nghĩa làm cho chắc chắn, an toàn hoặc khó bị xâm phạm. Cách diễn đạt này phù hợp với việc họ áp dụng các biện pháp nhằm ngăn ngôi mộ bị can thiệp.
- source_word: τὸν τάφον
  choice: ngôi mộ
  rationale: τάφος ở đây chỉ nơi chôn cất Chúa Giê-xu; “ngôi mộ” là cách gọi rõ ràng, tự nhiên trong tiếng Việt hiện đại.
- source_word: σφραγίσαντες
  choice: bằng cách niêm phong
  rationale: Phân từ bất định quá khứ có thể biểu thị phương cách hoặc hành động đi kèm. “Bằng cách niêm phong” nêu rõ phương tiện dùng để làm cho ngôi mộ được bảo vệ chắc chắn.
- source_word: τὸν λίθον
  choice: tảng đá
  rationale: λίθος chỉ tảng đá đặt ở cửa mộ. Bản dịch không thêm “cửa mộ” vì chi tiết ấy không được nói rõ ngay trong cụm từ này.
- source_word: μετὰ τῆς κουστωδίας
  choice: với đội lính canh cùng tham gia
  rationale: κουστωδία là từ vay mượn tiếng La-tinh, chỉ một toán lính canh; μετά với sở hữu cách thường diễn tả sự cùng đi hoặc cùng tham gia. Cách dịch này giữ sự liên hệ của đội lính với việc niêm phong mà không xác định quá mức họ chỉ chứng kiến hay được bố trí như một hành động riêng.
theological_decisions:
- issue: Quan hệ của μετὰ τῆς κουστωδίας với việc làm cho ngôi mộ được bảo vệ chắc chắn
  choice: Đội lính canh cùng tham gia hoặc hiện diện khi tảng đá được niêm phong.
  alternative: Họ niêm phong tảng đá rồi bố trí lính canh như một hành động riêng.
  rationale: Câu Hy Lạp cô đọng và cụm μετά với sở hữu cách tự nhiên biểu thị sự đồng hành, nhưng không giải thích chính xác vai trò của đội lính. Bản dịch chính giữ nguyên độ mở ấy thay vì áp đặt một trình tự thủ tục cụ thể.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. “Đội lính canh” không xác định họ là lính La Mã hay lính thuộc đền thờ, vì nguyên văn không nói rõ tại đây.
