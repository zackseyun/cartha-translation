  text: τότε ἀπέλυσεν αὐτοῖς τὸν Βαραββᾶν, τὸν δὲ Ἰησοῦν φραγελλώσας παρέδωκεν ἵνα σταυρωθῇ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/026.yaml
  text: Then he released Barabbas to them[a], but after flogging Jesus, he handed him over to be crucified.
translation:
  language: vi
  text: Bấy giờ, ông thả Ba-ra-ba cho họ, còn Đức Giê-su thì ông cho đánh đòn[a] rồi giao nộp để bị đóng đinh trên thập tự giá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Động từ Hy Lạp chỉ hình phạt đánh bằng roi của người La Mã; cũng có thể dịch là “cho đánh bằng roi”.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Bấy giờ
  rationale: Trạng từ chỉ trình tự trong mạch kể; “Bấy giờ” tự nhiên, trang trọng và nối tiếp diễn biến rõ ràng.
- source_word: ἀπέλυσεν
  choice: thả
  rationale: Trong bối cảnh xét xử, động từ chỉ việc phóng thích một tù nhân; “thả” rõ nghĩa và tự nhiên trong tiếng Việt.
- source_word: αὐτοῖς
  choice: cho họ
  rationale: Dữ cách chỉ những người nhận hoặc được hưởng việc phóng thích; “cho họ” giữ được quan hệ này.
- source_word: Βαραββᾶν
  choice: Ba-ra-ba
  rationale: Phiên âm tên riêng theo lối quen dùng trong tiếng Việt.
- source_word: δὲ
  choice: còn ... thì
  rationale: Cấu trúc tương phản làm nổi bật sự đối lập giữa việc Ba-ra-ba được thả và cách Đức Giê-su bị đối xử.
- source_word: Ἰησοῦν
  choice: Đức Giê-su
  rationale: Dùng dạng tên gọi quen thuộc, trang trọng trong tiếng Việt, không thêm diễn giải thần học.
- source_word: φραγελλώσας
  choice: cho đánh đòn rồi
  rationale: 'Phân từ bất định quá khứ diễn tả hành động xảy ra trước động từ chính. Cách nói này tự nhiên và giữ đúng trình tự: đánh đòn trước, giao nộp sau.'
- source_word: παρέδωκεν
  choice: giao nộp
  rationale: Diễn đạt việc trao Đức Giê-su cho phía thi hành án; “giao nộp” giữ sắc thái pháp lý và sức nặng của động từ.
- source_word: ἵνα σταυρωθῇ
  choice: để chịu đóng đinh vào thập tự giá
  rationale: Giữ sắc thái mục đích/kết quả của ἵνα với động từ bị động, đồng thời diễn đạt rõ hình thức hành quyết.
theological_decisions:
- issue: Trình tự và tác nhân trong việc kết án Đức Giê-su
  choice: Phi-lát thả Ba-ra-ba, cho đánh đòn Đức Giê-su, rồi giao nộp ngài để chịu đóng đinh.
  alternative: Hiểu rằng Đức Giê-su được giao nộp trước rồi mới bị đánh đòn.
  rationale: Phân từ aorist φραγελλώσας tự nhiên nhất chỉ hành động có trước động từ chính παρέδωκεν. Bản dịch giữ trình tự của câu Hy Lạp mà không bổ sung chi tiết ngoài văn bản.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “còn ... thì” để giữ tương phản; “cho đánh đòn rồi” làm rõ trình tự mà không giải thích quá mức. Dấu chú thích [a] được đặt ngay sau câu.
