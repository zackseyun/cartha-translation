  to: Bấy giờ, ông thả Ba-ra-ba cho họ, còn Đức Giê-su thì ông cho đánh đòn[a] rồi giao nộp để bị đóng đinh trên thập tự giá.
  rationale: Chỉnh sửa giới hạn ở cách diễn đạt cuộc hành hình để phản ánh rõ thể bị động của nguyên ngữ và dùng kết hợp từ tự nhiên hơn trong tiếng Việt. Di chuyển neo chú thích đến đúng cụm «cho đánh đòn» để phạm vi chú thích minh bạch. Không thay đổi trình tự, tác nhân hàm ẩn, hay ý nghĩa của câu.
