id: MAT.27.19
reference: Matthew 27:19
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Καθημένου δὲ αὐτοῦ ἐπὶ τοῦ βήματος ἀπέστειλεν πρὸς αὐτὸν ἡ γυνὴ αὐτοῦ λέγουσα· Μηδὲν σοὶ καὶ τῷ δικαίῳ ἐκείνῳ, πολλὰ γὰρ ἔπαθον σήμερον κατ’ ὄναρ δι’ αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/019.yaml
  text: While he was sitting on the judgment seat[a], his wife sent word to him, saying, “Have nothing to do with that righteous man[b], for I have suffered greatly today in a dream because of him.”
translation:
  language: vi
  text: 'Trong khi ông đang ngồi trên ghế xét xử, vợ ông sai người đến nhắn: “Đừng can dự gì vào việc của người công chính ấy[a], vì hôm nay tôi đã chịu khổ rất nhiều trong một giấc mơ vì người ấy.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “người vô tội ấy.” Tính từ Hy Lạp có thể mang nghĩa “công chính,” “ngay chính,” hoặc trong bối cảnh pháp lý là “vô tội.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Καθημένου δὲ αὐτοῦ
  choice: Trong khi ông đang ngồi
  rationale: Kết cấu sở hữu cách tuyệt đối với phân từ hiện tại diễn tả hoàn cảnh đồng thời và hành động đang tiếp diễn.
- source_word: ἐπὶ τοῦ βήματος
  choice: trên ghế xét xử
  rationale: Trong bối cảnh pháp đình, βῆμα chỉ chỗ ngồi chính thức nơi quan chức tuyên xử; cách dịch này rõ nghĩa và tự nhiên trong tiếng Việt.
- source_word: ἀπέστειλεν πρὸς αὐτὸν ἡ γυνὴ αὐτοῦ λέγουσα
  choice: vợ ông sai người đến nhắn
  rationale: Diễn đạt tự nhiên việc người vợ gửi lời qua một người trung gian mà không xác định quá mức danh tính hay phương tiện truyền tin.
- source_word: Μηδὲν σοὶ καὶ τῷ δικαίῳ ἐκείνῳ
  choice: Đừng can dự gì vào việc của người công chính ấy
  rationale: Thành ngữ tỉnh lược cảnh báo người nghe không dính líu đến vụ việc liên quan người ấy; “can dự” phù hợp với hành động xét xử đang diễn ra.
- source_word: τῷ δικαίῳ ἐκείνῳ
  choice: người công chính ấy
  rationale: Giữ nghĩa luân lý rộng của δίκαιος, đồng thời ghi nhận nghĩa pháp lý khả dĩ là “người vô tội” trong chú thích.
- source_word: πολλὰ γὰρ ἔπαθον σήμερον
  choice: vì hôm nay tôi đã chịu khổ rất nhiều
  rationale: πολλὰ πάσχω là cách nói chỉ sự chịu khổ nặng nề; “đã chịu khổ rất nhiều” vừa tự nhiên vừa giữ cường độ và tính cấp bách của lời nhắn.
- source_word: κατ’ ὄναρ
  choice: trong một giấc mơ
  rationale: Cách diễn đạt tiếng Việt thông dụng cho một trải nghiệm xảy ra trong mơ.
- source_word: δι’ αὐτόν
  choice: vì người ấy
  rationale: διά với đối cách biểu thị nguyên nhân; giữ nguyên sự quy chiếu đến người vừa được gọi là công chính.
theological_decisions:
- issue: Cách dịch δίκαιος khi nói về Chúa Giê-su
  choice: người công chính
  alternative: người vô tội; người ngay chính
  rationale: “Công chính” giữ được sắc thái luân lý của δίκαιος trong Ma-thi-ơ mà không thu hẹp lời nhận định thành một phán quyết pháp lý đơn thuần. Tuy nhiên, bối cảnh xét xử khiến “vô tội” là một khả năng thực sự, nên được giữ trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Ông” theo mạch văn chỉ Phi-lát; không thêm tên riêng vì câu Hy Lạp dùng đại từ. Cụm “sai người đến nhắn” làm rõ hành động gửi lời vốn hàm chứa trong nguyên văn nhưng không xác định người đưa tin.
