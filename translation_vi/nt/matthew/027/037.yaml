  text: καὶ ἐπέθηκαν ἐπάνω τῆς κεφαλῆς αὐτοῦ τὴν αἰτίαν αὐτοῦ γεγραμμένην· Οὗτός ἐστιν Ἰησοῦς ὁ βασιλεὺς τῶν Ἰουδαίων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/037.yaml
  text: 'And they placed above his head the charge against him[a], written: “This is Jesus[b], the King of the Jews.”'
translation:
  language: vi
  text: 'Họ đặt phía trên đầu Ngài lời buộc tội chống lại Ngài[a], được viết là: “Đây là Giê-su, Vua của dân Do Thái[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “cáo buộc chống lại Ngài.” Từ Hy Lạp αἰτία ở đây mang nghĩa tư pháp.'
    reason: lexical_alternative
  - marker: b
    text: 'Hoặc: “Vua của người Giu-đê.” Từ Hy Lạp Ἰουδαίων có thể chỉ “dân Do Thái” hoặc “người Giu-đê,” tùy ngữ cảnh.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπέθηκαν
  choice: đặt
  rationale: Động từ chỉ hành động cụ thể đặt tấm bảng ở vị trí phía trên đầu Đức Giê-su; “đặt” tự nhiên và sát nghĩa.
- source_word: ἐπάνω τῆς κεφαλῆς αὐτοῦ
  choice: phía trên đầu Ngài
  rationale: ἐπάνω với sở hữu cách diễn tả vị trí ở phía trên; cách dịch này tránh gây hiểu lầm rằng vật ấy được đặt trực tiếp lên đầu.
- source_word: τὴν αἰτίαν αὐτοῦ
  choice: bản cáo trạng
  rationale: Trong ngữ cảnh tư pháp, αἰτία chỉ lời buộc tội hay tội danh làm căn cứ kết án. “Bản cáo trạng” vừa thể hiện tính pháp lý vừa phù hợp với một nội dung được viết và treo lên.
- source_word: γεγραμμένην
  choice: viết rằng
  rationale: Phân từ hoàn thành bị động cho biết nội dung cáo buộc đã được viết; tiếng Việt tự nhiên nối với phần trích dẫn bằng “viết rằng”.
- source_word: Οὗτός ἐστιν
  choice: Đây là
  rationale: Giữ trực tiếp cấu trúc đại từ chỉ định và động từ liên kết của nguyên văn.
- source_word: Ἰησοῦς
  choice: Giê-su
  rationale: Dùng dạng phiên âm tên riêng quen thuộc trong tiếng Việt.
- source_word: ὁ βασιλεὺς τῶν Ἰουδαίων
  choice: Vua dân Do Thái
  rationale: Diễn đạt tự nhiên như một tước hiệu hoàng gia trong tiếng Việt và giữ đối tượng tập thể của cụm từ Hy Lạp.
- source_word: Ἰουδαίων
  choice: dân Do Thái
  rationale: Trong công thức cáo buộc mang tính chính trị này, cách hiểu thông dụng là dân Do Thái; nghĩa địa-vùng “người Giu-đê” vẫn được ghi nhận ở chú thích.
theological_decisions:
- issue: Sắc thái pháp lý của αἰτία
  choice: bản cáo trạng
  alternative: lời buộc tội chống lại Ngài
  rationale: Nguyên văn trình bày dòng chữ như căn cứ chính thức cho án tử; lựa chọn này giữ sắc thái tư pháp mà không thêm một cách giải thích thần học.
- issue: Phạm vi nghĩa của Ἰουδαίων
  choice: dân Do Thái
  alternative: người Giu-đê
  rationale: Trong tước hiệu trên bảng hành hình, “dân Do Thái” là cách hiểu phù hợp và quen thuộc, nhưng từ Hy Lạp cũng có thể mang nghĩa địa-vùng nên cần bảo lưu phương án ấy trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Ngài” duy trì lối xưng hô kính trọng dành cho Đức Giê-su; câu khắc được trình bày ngắn gọn như nguyên văn.
