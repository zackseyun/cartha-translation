  - severity: low
    issue: Cú pháp “bản cáo trạng viết rằng” chưa tự nhiên
    rationale: Một cáo trạng có thể chứa nội dung, nhưng cách nối này kém tự nhiên hơn việc nói cáo buộc “được viết là”.
  - severity: low
