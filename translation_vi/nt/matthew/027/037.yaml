  to: 'Họ đặt phía trên đầu Ngài lời buộc tội chống lại Ngài[a], được viết là: “Đây là Giê-su, Vua của dân Do Thái[b].”'
  rationale: Sửa “bản cáo trạng” thành “lời buộc tội chống lại Ngài” để phản ánh αἰτία với sắc thái pháp lý mà không áp đặt khái niệm văn kiện tố tụng hiện đại. Điều chỉnh cú pháp cho tự nhiên, làm rõ quan hệ “Vua của…,” và sửa phương án thay thế trong chú thích để giữ đúng hướng sở thuộc của nguyên ngữ.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T07:38:23Z'
review_pass:
  verdict: revise
  source_fidelity: Bản dịch giữ đúng hành động đặt nội dung buộc tội ở phía trên đầu Đức Giê-su và trích đúng nguyên văn tước hiệu. Tuy nhiên, “bản cáo trạng” thường chỉ một văn kiện truy tố chính thức, cụ thể hơn αἰτία, vốn ở đây là lời buộc tội/cáo buộc. Cần dùng cách diễn đạt không gán thêm hình thức pháp lý hiện đại.
  naturalness: “Bản cáo trạng viết rằng” hơi gượng trong tiếng Việt hiện đại. “Lời buộc tội chống lại Ngài được viết là” diễn đạt rõ quan hệ giữa cáo buộc và dòng chữ. “Vua của dân Do Thái” tự nhiên và minh bạch hơn “Vua dân Do Thái.”
  terminology: Giữ “Giê-su,” “Ngài,” và “dân Do Thái” phù hợp với văn phong trang trọng hiện đại. Chú thích thay thế cần là “Vua của người Giu-đê,” không phải “Vua người Giu-đê,” vì nguyên ngữ nói về những người mà Giê-su được gọi là vua, không nói Giê-su là một vị vua thuộc vùng Giu-đê.
