  text: καὶ ῥίψας τὰ ἀργύρια ⸂εἰς τὸν ναὸν⸃ ἀνεχώρησεν, καὶ ἀπελθὼν ἀπήγξατο.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/005.yaml
  text: And throwing the silver into the temple[a], he departed[b], and went and hanged himself.
translation:
  language: vi
  text: Ông ném số bạc vào thánh điện[a], rồi ra đi và treo cổ tự vẫn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hoặc “vào đền thờ”. Từ Hy Lạp naos thường chỉ thánh điện, thay vì toàn bộ khuôn viên đền thờ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ῥίψας
  choice: ném
  rationale: Phân từ bất định diễn tả hành động xảy ra trước động từ chính; trật tự câu tiếng Việt đã thể hiện tự nhiên chuỗi hành động mà không cần thêm “sau khi”.
- source_word: τὰ ἀργύρια
  choice: số bạc
  rationale: Giữ nghĩa sát là “bạc”, đồng thời “số bạc” tự nhiên trong tiếng Việt và nhắc lại khoản tiền đã được nói đến trong ngữ cảnh mà không tự ý thêm “đồng tiền”.
- source_word: εἰς τὸν ναὸν
  choice: vào nơi thánh
  rationale: ναός ở đây thường chỉ phần thánh điện của đền thờ, không phải toàn bộ khuôn viên; “nơi thánh” truyền đạt nét nghĩa kiến trúc cụ thể ấy.
- source_word: ἀνεχώρησεν
  choice: rời khỏi đó
  rationale: Diễn đạt tự nhiên nghĩa rời đi/rút lui và làm rõ điểm xuất phát đã nêu, không thêm nội dung đáng kể.
- source_word: ἀπελθὼν
  choice: Sau đó, ông đi
  rationale: Giữ được động tác di chuyển thứ hai, phân biệt với ἀνεχώρησεν, đồng thời tránh lối lặp gượng “rời đi rồi đi khỏi” trong tiếng Việt.
- source_word: ἀπήγξατο
  choice: treo cổ tự vẫn
  rationale: Động từ trung cách chỉ hành động hướng vào chính chủ thể; trong ngữ cảnh này, nghĩa thông thường và rõ nhất là tự sát bằng cách treo cổ.
theological_decisions:
- issue: Phạm vi nghĩa của ναός so với thuật ngữ chỉ toàn bộ khu đền thờ
  choice: Dùng “nơi thánh” trong chính văn và chú thích khả năng dịch “đền thờ” hoặc “thánh điện”.
  alternative: Dịch “đền thờ” trong chính văn.
  rationale: ναός thường chỉ riêng phần thánh điện. Cách dịch chính văn ưu tiên độ chính xác từ vựng, còn chú thích cung cấp cách gọi quen thuộc hơn mà không áp đặt một cách hiểu giáo phái.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và dễ hiểu. Câu được tách nhẹ để tránh chuỗi động từ rời đi bị lặp gượng trong tiếng Việt, nhưng vẫn giữ đầy đủ trình tự hành động của nguyên văn.
