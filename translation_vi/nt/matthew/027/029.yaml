id: MAT.27.29
reference: Matthew 27:29
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ πλέξαντες στέφανον ἐξ ἀκανθῶν ἐπέθηκαν ἐπὶ ⸂τῆς κεφαλῆς⸃ αὐτοῦ καὶ κάλαμον ⸂ἐν τῇ δεξιᾷ⸃ αὐτοῦ, καὶ γονυπετήσαντες ἔμπροσθεν αὐτοῦ ⸀ἐνέπαιξαν αὐτῷ λέγοντες· Χαῖρε, ⸀βασιλεῦ τῶν Ἰουδαίων,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/029.yaml
  text: And after weaving a crown of thorns[a], they put it on his head, and a reed in his right hand; and kneeling before him, they mocked him, saying, “Hail, King of the Jews!”
translation:
  language: vi
  text: 'Họ kết một vương miện bằng gai, đặt lên đầu Ngài, rồi đặt một cây sậy vào tay phải Ngài. Họ quỳ xuống trước mặt Ngài và chế nhạo: “Kính chào Vua dân Do Thái[a]!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “Vua dân Giu-đê.” Từ Hy Lạp Ἰουδαίων có thể chỉ người Giu-đê hoặc người Do Thái; tại đây, từ này nằm trong tước hiệu vương quyền mà quân lính dùng để chế nhạo Đức Chúa Giê-su.
    reason: lexical_alternative
lexical_decisions:
- source_word: πλέξαντες
  choice: kết
  rationale: Diễn tả việc đan hoặc bện các nhánh gai lại với nhau, tự nhiên và rõ nghĩa trong tiếng Việt.
- source_word: στέφανον ἐξ ἀκανθῶν
  choice: một vương miện bằng gai
  rationale: “Vương miện” làm rõ sự nhại lại vương quyền trong ngữ cảnh; “bằng gai” giữ nguyên chất liệu được nói đến trong nguyên văn.
- source_word: ἐπέθηκαν ἐπὶ τῆς κεφαλῆς αὐτοῦ
  choice: đặt lên đầu Ngài
  rationale: Chuyển đạt trực tiếp hành động đặt vương miện lên đầu Đức Chúa Giê-su.
- source_word: κάλαμον
  choice: một cây sậy
  rationale: Giữ hình ảnh cụ thể của nguyên văn, không diễn giải thẳng thành “vương trượng,” dù cây sậy được dùng để nhại lại vương trượng.
- source_word: ἐν τῇ δεξιᾷ αὐτοῦ
  choice: vào tay phải Ngài
  rationale: Tiếng Việt tự nhiên dùng “vào tay” để diễn tả việc trao hoặc đặt vật vào bàn tay.
- source_word: γονυπετήσαντες ἔμπροσθεν αὐτοῦ
  choice: quỳ xuống trước mặt Ngài
  rationale: Giữ cả tư thế quỳ và vị trí trước mặt, qua đó thể hiện hành vi giả vờ tôn kính.
- source_word: ἐνέπαιξαν αὐτῷ
  choice: chế nhạo
  rationale: Diễn đạt chính xác thái độ khinh miệt và giễu cợt trong cảnh này, với văn phong trang trọng vừa phải.
- source_word: Χαῖρε
  choice: Kính chào
  rationale: Giữ dạng lời chào trang trọng được dùng một cách mỉa mai; tự nhiên hơn trong tiếng Việt hiện đại mà không diễn giải quá mức thành lời tung hô.
- source_word: βασιλεῦ τῶν Ἰουδαίων
  choice: Vua dân Do Thái
  rationale: Chuyển đạt tước hiệu hô cách và cách hiểu phổ biến của Ἰουδαίων trong lời cáo buộc, chế nhạo về vương quyền của Đức Chúa Giê-su.
theological_decisions:
- issue: Giữ sắc thái mỉa mai trong lời tung hô giả tạo
  choice: “Kính chào Vua dân Do Thái!”
  alternative: “Vạn tuế, Vua dân Do Thái!”
  rationale: “Kính chào” bám sát nghĩa lời chào của Χαῖρε và để ngữ cảnh tự biểu lộ sự mỉa mai; “Vạn tuế” làm nổi bật nghi thức hoàng gia hơn nhưng bổ sung ý chúc sống lâu không được nói rõ trong từ Hy Lạp.
- issue: Phạm vi nghĩa của Ἰουδαίων
  choice: dân Do Thái
  alternative: dân Giu-đê
  rationale: Trong tước hiệu thuộc trình thuật thương khó này, từ ngữ chỉ cộng đồng dân tộc-tôn giáo rộng hơn, gắn với cáo buộc về vương quyền; tuy vậy, nghĩa địa vực “người Giu-đê” vẫn có thể có về mặt từ vựng và được ghi nhận trong chú thích.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Đại từ “Ngài” duy trì giọng kể tôn kính nhưng không thêm tước hiệu vào nguyên văn. Cấu trúc câu được chia làm hai để rõ ràng, đồng thời giữ tuần tự hành động và sự nhại lại nghi thức tôn vương.
