  terminology: Giữ “Gô-gô-tha” theo phiên âm. Dịch κρανίου τόπος là “Nơi Sọ”; không dùng “Đồi Sọ” vì nguyên văn chỉ nói “nơi/chỗ,” không xác định đó là một ngọn đồi.
