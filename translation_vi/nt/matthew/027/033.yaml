  text: Καὶ ἐλθόντες εἰς τόπον λεγόμενον Γολγοθᾶ, ὅ ἐστιν ⸂Κρανίου Τόπος λεγόμενος⸃,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/033.yaml
  text: And when they came to a place called Golgotha (which means Place of a Skull),[a]
translation:
  language: vi
  text: Khi họ đến một nơi gọi là Gô-gô-tha (nghĩa là Nơi Sọ),[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch sát chữ hơn: “tức là nơi được gọi là Nơi Sọ.” Cụm từ Hy Lạp là lời giải thích tên Gô-gô-tha.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθόντες
  choice: Khi đến
  rationale: Phân từ bất định quá khứ được diễn đạt tự nhiên như một mệnh đề thời gian, giữ nhịp kể chuyện mà không làm rõ chủ ngữ hơn nguyên văn.
- source_word: τόπον
  choice: một nơi
  rationale: Danh từ không có mạo từ mang nghĩa thông thường là “nơi”; “một nơi” tự nhiên trong tiếng Việt.
- source_word: λεγόμενον
  choice: gọi là
  rationale: Trong cách dùng đặt tên này, từ có nghĩa là “được gọi/được đặt tên”; cấu trúc “một nơi gọi là” gọn và tự nhiên.
- source_word: Γολγοθᾶ
  choice: Gô-gô-tha
  rationale: Tên địa danh được phiên âm sang tiếng Việt thay vì dịch nghĩa, còn ý nghĩa của tên được giải thích ngay sau đó.
- source_word: ὅ ἐστιν
  choice: nghĩa là
  rationale: Công thức này giới thiệu lời giải nghĩa tên địa danh cho độc giả; “nghĩa là” truyền đạt rõ chức năng giải thích.
- source_word: Κρανίου Τόπος
  choice: Nơi Sọ Người
  rationale: Κρανίου là sở hữu cách số ít của “sọ”, còn Τόπος là “nơi”. “Nơi Sọ Người” giữ sắc thái không xác định của cụm Hy Lạp, đồng thời dễ hiểu và tránh cách nói thiếu tự nhiên “Nơi của một cái sọ”.
- source_word: λεγόμενος
  choice: được thể hiện trong cấu trúc “nghĩa là”
  rationale: Sự lặp lại của “gọi là” trong nguyên văn thuộc lời chú giải tên gọi; tiếng Việt tự nhiên có thể gói chức năng ấy vào “nghĩa là”, còn chú thích ghi nhận cách dịch sát hơn.
theological_decisions: []
