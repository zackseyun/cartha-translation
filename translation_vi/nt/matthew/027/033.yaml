  register: Văn phong kể chuyện hiện đại, trang trọng và dễ hiểu. Giữ tên riêng bằng phiên âm quen thuộc; dùng “Nơi Sọ Người” để truyền đạt hình ảnh κρανίον rõ ràng mà không áp đặt cách giải thích địa hình hay thần học.
