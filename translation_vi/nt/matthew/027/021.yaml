  text: ἀποκριθεὶς δὲ ὁ ἡγεμὼν εἶπεν αὐτοῖς· Τίνα θέλετε ἀπὸ τῶν δύο ἀπολύσω ὑμῖν; οἱ δὲ εἶπαν· ⸀Τὸν Βαραββᾶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/021.yaml
  text: But the governor answered them, “Which of the two do you want me to release for you?” And they said, “Barabbas.”
translation:
  language: vi
  text: 'Nhưng viên tổng đốc trả lời họ: “Trong hai người này, mọi người muốn tôi thả ai cho mọi người?” Họ nói: “Ba-ra-ba.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ ἡγεμὼν εἶπεν αὐτοῖς
  choice: Nhưng viên tổng đốc đáp lời họ
  rationale: Kết hợp phân từ ἀποκριθείς với động từ εἶπεν thành cách diễn đạt tự nhiên trong tiếng Việt, vẫn giữ sắc thái hồi đáp; δέ được thể hiện bằng “Nhưng” để đánh dấu bước chuyển nhẹ trong cuộc đối thoại, còn ἡγεμών được dịch theo chức vụ của Phi-lát là “tổng đốc”.
- source_word: Τίνα ... ἀπὸ τῶν δύο
  choice: Trong hai người này ... ai
  rationale: Cụm từ hỏi về việc lựa chọn một trong hai người đã được nêu; cấu trúc “Trong hai người này ... ai” tự nhiên và rõ nghĩa trong tiếng Việt.
- source_word: θέλετε
  choice: các ngươi muốn
  rationale: θέλω ở đây chỉ ý muốn hoặc sự lựa chọn. “Muốn” là từ hiện đại, trực tiếp; đại từ “các ngươi” phù hợp với lời một quan chức La Mã nói với đám đông mà không thêm sắc thái kính trọng không có trong nguyên văn.
- source_word: ἀπολύσω ὑμῖν
  choice: ta tha ... cho các ngươi
  rationale: Trong bối cảnh pháp lý, ἀπολύω mang nghĩa phóng thích hoặc tha. “Tha” tự nhiên trong câu hỏi về việc thả tù nhân; “cho các ngươi” giữ lại sắc thái lợi ích/yêu cầu của đại từ ở cách dữ ὑμῖν.
- source_word: οἱ δὲ εἶπαν
  choice: Họ nói
  rationale: Diễn đạt sự đáp lại của đám đông bằng câu kể gọn, tự nhiên; không cần ép δέ thành một liên từ tương phản mạnh trong tiếng Việt.
- source_word: Τὸν Βαραββᾶν
  choice: Ba-ra-ba
  rationale: Phiên âm tên riêng Βαραββᾶς theo cách đọc quen thuộc trong Kinh Thánh tiếng Việt; mạo từ đối cách không cần biểu hiện riêng.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Lời thoại dùng “ta/các ngươi” để phản ánh vị thế của tổng đốc trước đám đông mà không quá cổ kính. Không cần chú thích vì câu không có dị bản hay điểm mơ hồ đáng kể cần giải thích trong bản văn.
