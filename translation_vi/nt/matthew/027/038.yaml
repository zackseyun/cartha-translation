revisions:
- from: Bấy giờ, người ta đóng đinh hai tên cướp[a] cùng với Ngài, một tên ở bên phải và một tên ở bên trái.
  to: Lúc ấy, hai tên cướp[a] bị đóng đinh trên thập tự giá cùng với Người, một tên bên phải và một tên bên trái.
  rationale: Bản sửa giữ nguyên mọi thành phần ngữ nghĩa của câu Hy Lạp, đồng thời dùng bị động tiếng Việt tương ứng với σταυροῦνται và làm rõ nghĩa đóng đinh trên thập tự giá. “Người” là đại từ quy chiếu trang trọng, thông dụng trong văn cảnh Kinh Thánh, không thêm một khẳng định thần học. Chú thích giữ sự dè dặt cần thiết về λῃσταί.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T07:38:23Z'
review_pass:
  verdict: revise
  source_fidelity: Bản nháp truyền đạt đúng trình tự, số lượng, sự đồng chịu đóng đinh và vị trí phải/trái. Tuy nhiên, “người ta đóng đinh” chuyển bị động vô tác nhân của σταυροῦνται thành một chủ ngữ khái quát, còn “đóng đinh” đứng một mình có thể kém rõ nghĩa ‘crucify’ trong tiếng Việt. Dùng cấu trúc bị động trực tiếp và nêu thập tự giá diễn đạt đầy đủ, tự nhiên hơn ý của động từ Hy Lạp.
  naturalness: “Lúc ấy” và “một tên bên phải ... một tên bên trái” là văn phong kể chuyện hiện đại, gọn và tự nhiên. “Bị đóng đinh trên thập tự giá” là cách dùng quen thuộc, rõ nghĩa trong tiếng Việt hiện đại.
  terminology: Giữ “tên cướp” làm nghĩa mặc định của λῃσταί, không áp đặt cách hiểu chính trị. Chú thích được chỉnh để nêu khả năng bạo lực/liên hệ nổi dậy mà không dùng “thảo khấu”, một từ có sắc thái cổ và không thật sự thuộc văn phong chuẩn hiện đại.
  issues:
  - severity: medium
    issue: “người ta đóng đinh” thêm chủ ngữ vô nhân xưng.
    rationale: σταυροῦνται là bị động không nêu tác nhân. Tiếng Việt có thể giữ trực tiếp điều này bằng “bị đóng đinh”, tránh thêm một tác nhân khái quát không có trong câu.
  - severity: low
    issue: “đóng đinh” không kèm “thập tự giá” có thể thiếu rõ nghĩa.
    rationale: Trong cách dùng thông thường, “đóng đinh” có thể chỉ hành động dùng đinh nói chung; “bị đóng đinh trên thập tự giá” phản ánh rõ nghĩa của σταυρόω trong ngữ cảnh này.
  - severity: low
    issue: Chú thích dùng “thảo khấu”.
    rationale: Đây là từ có sắc thái cổ và dễ gợi một khung cảnh lịch sử cụ thể. Chú thích nên giải thích phạm vi nghĩa của λῃστής bằng tiếng Việt hiện đại, không tạo một lựa chọn dịch thiếu tự nhiên.
