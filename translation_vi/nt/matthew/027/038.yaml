  text: Τότε σταυροῦνται σὺν αὐτῷ δύο λῃσταί, εἷς ἐκ δεξιῶν καὶ εἷς ἐξ εὐωνύμων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/038.yaml
  text: Then two robbers are crucified with him[a], one on the right and one on the left.
translation:
  language: vi
  text: Lúc ấy, hai tên cướp[a] bị đóng đinh trên thập tự giá cùng với Người, một tên bên phải và một tên bên trái.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hy Lạp này cũng có thể chỉ những kẻ cướp dùng bạo lực; trong một số bối cảnh, nó có thể liên hệ với hoạt động nổi dậy.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Bấy giờ
  rationale: Trạng từ thời gian đánh dấu sự kiện kế tiếp trong trình thuật; “Bấy giờ” tự nhiên, trang trọng và giữ được mạch kể.
- source_word: σταυροῦνται
  choice: người ta đóng đinh
  rationale: Động từ hiện tại bị động trong lối kể sinh động. Tiếng Việt thường diễn đạt bị động vô nhân xưng bằng “người ta”; “đóng đinh” trong ngữ cảnh này chỉ việc đóng đinh trên thập tự giá mà không cần thêm từ không có trong câu Hy Lạp.
- source_word: σὺν αὐτῷ
  choice: cùng với Ngài
  rationale: σύν với cách ba biểu thị sự cùng đi kèm; “cùng với” thể hiện rõ nghĩa này. Đại từ viết hoa theo quy ước văn phong tôn kính, không làm thay đổi nội dung.
- source_word: δύο λῃσταί
  choice: hai tên cướp
  rationale: λῃστής thường chỉ kẻ cướp, có thể hàm ý dùng bạo lực. “Tên cướp” là cách nói tự nhiên; chú thích giữ lại khả năng hiểu là kẻ cướp có vũ trang hoặc thảo khấu.
- source_word: εἷς ἐκ δεξιῶν
  choice: một tên ở bên phải
  rationale: Thành ngữ chỉ vị trí, được chuyển sang cách nói tự nhiên trong tiếng Việt.
- source_word: καὶ εἷς ἐξ εὐωνύμων
  choice: và một tên ở bên trái
  rationale: Cụm từ chỉ vị trí đối lập với bên phải; “ở bên trái” là tương đương tự nhiên.
theological_decisions:
- issue: Thân phận của λῃσταί
  choice: Dịch là “tên cướp”, không xác định họ là quân nổi dậy.
  alternative: “kẻ cướp có vũ trang”, “thảo khấu”, hoặc “quân nổi dậy”
  rationale: Từ Hy Lạp có thể chỉ kẻ cướp bạo lực và trong một số bối cảnh có thể liên quan đến hoạt động nổi dậy, nhưng riêng câu này không buộc phải hiểu theo nghĩa chính trị hẹp hơn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” theo lối tôn kính phổ biến; cấu trúc “người ta đóng đinh” giúp tiếng Việt tự nhiên đồng thời giữ sắc thái bị động của nguyên văn.
