  text: Ὀψίας δὲ γενομένης ἦλθεν ἄνθρωπος πλούσιος ἀπὸ Ἁριμαθαίας, τοὔνομα Ἰωσήφ, ὃς καὶ αὐτὸς ⸀ἐμαθητεύθη τῷ Ἰησοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/057.yaml
  text: When evening had come[a], a rich man from Arimathea came, named Joseph[b], who himself also had become a disciple of Jesus.
translation:
  language: vi
  text: Khi chiều tối đã đến, một người đàn ông giàu có từ A-ri-ma-thê đến; tên ông là Giô-sép, và chính ông cũng đã trở thành môn đồ của Đức Giê-su.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đã được Đức Giê-su làm cho trở thành môn đồ” hoặc “cũng là môn đồ của Đức Giê-su.”'
    reason: alternative_reading
lexical_decisions:
- source_word: Ὀψίας δὲ γενομένης
  choice: Khi chiều tối đến
  rationale: Cụm sở hữu cách tuyệt đối chỉ thời gian và chuyển cảnh. Cách dịch này tự nhiên trong tiếng Việt, giữ ý thời điểm chiều tối bắt đầu mà không thêm một từ tương đương với “bấy giờ” vốn không có minh nhiên trong nguyên văn.
- source_word: ἦλθεν
  choice: đến
  rationale: Động từ aorist của ἔρχομαι diễn tả hành động đến trong mạch kể chuyện; “đến” là cách tương đương trực tiếp và tự nhiên.
- source_word: ἄνθρωπος πλούσιος
  choice: một người giàu
  rationale: Giữ nghĩa trực tiếp của danh từ và tính từ, đồng thời dùng cách nói hiện đại, dễ hiểu.
- source_word: ἀπὸ Ἁριμαθαίας
  choice: từ A-ri-ma-thê
  rationale: ἀπό biểu thị nơi xuất thân; “từ” truyền đạt rõ quan hệ này.
- source_word: τοὔνομα Ἰωσήφ
  choice: tên là Giô-sép
  rationale: Cách diễn đạt tự nhiên trong tiếng Việt để giới thiệu tên người.
- source_word: ὃς καὶ αὐτὸς
  choice: chính ông cũng
  rationale: “Chính ông” giữ sắc thái nhấn mạnh của αὐτός, còn “cũng” thể hiện καί, cho thấy Giô-sép cũng thuộc số các môn đồ.
- source_word: ἐμαθητεύθη τῷ Ἰησοῦ
  choice: đã trở thành môn đồ của Đức Giê-su
  rationale: Thể bị động của μαθητεύω có thể nói đến việc trở thành hoặc được làm thành môn đồ. Cách dịch chính diễn đạt kết quả và mối liên hệ với Đức Giê-su mà không xác quyết quá mức về cơ chế của việc làm môn đồ.
theological_decisions:
- issue: Ý nghĩa của ἐμαθητεύθη trong quan hệ với Đức Giê-su
  choice: đã trở thành môn đồ của Đức Giê-su
  alternative: đã được Đức Giê-su đào tạo làm môn đồ; cũng là môn đồ của Đức Giê-su
  rationale: Động từ bị động có thể nhấn mạnh việc bước vào địa vị môn đồ hoặc được làm thành môn đồ. Bản dịch chính giữ ý Giô-sép đã trở thành người theo Đức Giê-su, còn chú thích bảo tồn khả năng hiểu theo thể bị động rõ hơn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Giê-su” theo lối gọi kính trọng phổ biến; phiên âm địa danh và tên riêng là A-ri-ma-thê, Giô-sép. Dấu chấm phẩy giúp câu dài rõ cấu trúc hơn.
