  text: Then Pilate says to him[a], “Do you not hear how many things they are testifying against you?”
translation:
  language: vi
  text: 'Bấy giờ Phi-lát nói với Người: “Ông không nghe họ làm chứng chống lại ông biết bao nhiêu điều sao?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “họ làm chứng chống lại ông” hoặc “họ đưa lời chứng chống lại ông.” Động từ Hy Lạp mang sắc thái pháp lý, chỉ việc làm chứng bất lợi cho một người.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Bấy giờ
  rationale: Dùng làm từ nối thời gian, đưa câu chuyện sang sự việc kế tiếp một cách tự nhiên và trang trọng.
- source_word: λέγει
  choice: nói
  rationale: Tiếng Hy Lạp dùng hiện tại lịch sử để làm lời kể sống động; tiếng Việt không biểu thị thì bằng biến tố, nên “nói” vừa tự nhiên vừa không làm mất sắc thái ấy.
- source_word: αὐτῷ
  choice: với Người
  rationale: Giữ đại từ như nguyên văn; viết hoa “Người” theo quy ước văn phong Kinh Thánh tiếng Việt để chỉ Chúa Giê-su mà không thêm tên riêng.
- source_word: ὁ Πιλᾶτος
  choice: Phi-lát
  rationale: Dùng dạng tên riêng quen thuộc trong tiếng Việt; mạo từ Hy Lạp không cần dịch trước tên người.
- source_word: Οὐκ ἀκούεις
  choice: Ông không nghe ... sao?
  rationale: Giữ nguyên lực của câu hỏi phủ định và nghĩa căn bản “nghe”, đồng thời dùng cấu trúc nghi vấn tự nhiên trong tiếng Việt.
- source_word: πόσα
  choice: biết bao điều
  rationale: Diễn đạt số lượng lớn của các điều được nêu ra mà không tự ý chuyển thành danh từ cụ thể hơn như “lời buộc tội”.
- source_word: σου
  choice: chống lại ông
  rationale: Trong kết hợp với καταμαρτυρέω, đại từ sở hữu cách mang nghĩa bất lợi; tiếng Việt cần diễn đạt rõ quan hệ “chống lại”.
- source_word: καταμαρτυροῦσιν
  choice: họ đang làm chứng chống lại
  rationale: Giữ sắc thái pháp lý của động từ là đưa lời chứng chống lại một người; “đang” phù hợp với hành động diễn ra trong cảnh xét xử.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cách xưng hô “ông” phản ánh lời của Phi-lát nói trực tiếp với Chúa Giê-su; “Người” trong lời kể giúp nhận diện nhân vật mà vẫn giữ đại từ của nguyên văn. Dấu chú thích [a] được đặt ngay sau câu dịch.
