id: MAT.27.20
reference: Matthew 27:20
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Οἱ δὲ ἀρχιερεῖς καὶ οἱ πρεσβύτεροι ἔπεισαν τοὺς ὄχλους ἵνα αἰτήσωνται τὸν Βαραββᾶν τὸν δὲ Ἰησοῦν ἀπολέσωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/020.yaml
  text: But the chief priests and the elders persuaded the crowds to ask for Barabbas[a], but to destroy Jesus.
translation:
  language: vi
  text: Nhưng các thượng tế và các trưởng lão đã thuyết phục đám đông xin tha Ba-ra-ba, còn giết Đức Giê-su.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “tiêu diệt Đức Giê-su.”'
    reason: Bảo lưu cách dịch sát hơn với phạm vi nghĩa rộng của ἀπολέσωσιν; chính văn dùng «giết» để diễn đạt rõ nghĩa trong bối cảnh xét xử và hành quyết.
lexical_decisions:
- source_word: δὲ
  choice: Nhưng
  rationale: Liên từ này đánh dấu sự tương phản với diễn biến trước đó; “Nhưng” diễn đạt tự nhiên sắc thái đối lập trong tiếng Việt.
- source_word: ἀρχιερεῖς
  choice: các thượng tế
  rationale: Chỉ tập thể lãnh đạo tư tế tại Giê-ru-sa-lem, không phải chỉ một thầy tế lễ thượng phẩm.
- source_word: πρεσβύτεροι
  choice: các trưởng lão
  rationale: Giữ nghĩa lịch sử và thể chế của những người lãnh đạo được công nhận trong cộng đồng Do Thái.
- source_word: ἔπεισαν
  choice: đã thuyết phục
  rationale: Diễn đạt trực tiếp hành động tác động thành công đến đám đông, đồng thời không tăng sắc thái thành “xúi giục” nếu bản Hy Lạp không buộc phải hiểu như vậy.
- source_word: τοὺς ὄχλους
  choice: đám đông
  rationale: Tiếng Việt thường dùng danh từ tập hợp số ít “đám đông” một cách tự nhiên, dù tiếng Hy Lạp dùng dạng số nhiều để chỉ quần chúng tụ họp.
- source_word: ἵνα αἰτήσωνται τὸν Βαραββᾶν
  choice: xin tha Ba-ra-ba
  rationale: Sau động từ “thuyết phục,” ἵνα với lối giả định nêu nội dung được thuyết phục. Trong bối cảnh Phi-lát cho chọn một tù nhân để phóng thích, “xin tha Ba-ra-ba” diễn đạt tự nhiên điều họ yêu cầu; “xin Ba-ra-ba” quá tối nghĩa trong tiếng Việt.
- source_word: Βαραββᾶν
  choice: Ba-ra-ba
  rationale: Phiên âm tên riêng theo cách đọc quen thuộc trong tiếng Việt.
- source_word: τὸν δὲ Ἰησοῦν
  choice: còn Đức Giê-su thì
  rationale: Cấu trúc với δέ thứ hai đặt số phận của Ba-ra-ba và Đức Giê-su trong thế tương phản rõ rệt.
- source_word: ἀπολέσωσιν
  choice: phải bị giết
  rationale: Trong bối cảnh xét xử và hành quyết, cụm này truyền đạt rõ việc khiến Đức Giê-su phải chết. Dạng bị động trong tiếng Việt làm câu tự nhiên và thể hiện điều đám đông được thuyết phục yêu cầu, nhưng không biến động từ Hy Lạp thành một thuật ngữ pháp lý chuyên biệt.
theological_decisions:
- issue: Cách dịch ἀπολέσωσιν trong bối cảnh hành quyết
  choice: phải bị giết
  alternative: bị tiêu diệt
  rationale: ἀπόλλυμι có nghĩa rộng là làm cho ai đó bị diệt hoặc chết. Ở đây, “phải bị giết” truyền đạt rõ ý nghĩa cụ thể trong bối cảnh xét xử mà không thêm một phương thức hành quyết; phương án sát hình thức hơn “bị tiêu diệt” được giữ trong chú thích để bảo tồn phạm vi từ vựng của nguyên bản.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Giê-su,” “các thượng tế,” “các trưởng lão” theo lối gọi quen thuộc trong tiếng Việt. Cấu trúc “còn... thì...” bảo tồn sự tương phản giữa Ba-ra-ba và Đức Giê-su. Dấu chú thích [a] được đặt ngay sau mệnh đề liên quan đến ἀπολέσωσιν.
