revisions:
- from: 'Nhưng các thượng tế và các trưởng lão đã thuyết phục đám đông xin tha Ba-ra-ba, còn Đức Giê-su thì phải bị giết.[a]


    [a] Cũng có thể dịch: “bị tiêu diệt.”'
  to: Nhưng các thượng tế và các trưởng lão đã thuyết phục đám đông xin tha Ba-ra-ba, còn giết Đức Giê-su.[a]
  rationale: Giữ nguyên các lựa chọn từ ngữ phù hợp của bản nháp, nhưng sửa mệnh đề cuối thành chủ động và bỏ «phải» để phản ánh chính xác cú pháp và sắc thái của ἵνα ... ἀπολέσωσιν. «Xin tha Ba-ra-ba» vẫn chấp nhận được vì việc xin phóng thích tù nhân được xác định bởi ngữ cảnh trực tiếp, dù động từ «tha» không được lặp lại trong câu Hy Lạp này.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T07:38:21Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản nháp truyền đạt đúng các tác nhân, hành động thuyết phục và thế đối lập giữa Ba-ra-ba với Đức Giê-su. Tuy nhiên, «còn Đức Giê-su thì phải bị giết» chuyển động từ chủ động ἀπολέσωσιν thành bị động và thêm sắc thái tình thái «phải» không có trong nguyên văn. Cần giữ mệnh đề theo hướng chủ động: đám đông được thuyết phục để giết Đức Giê-su.'
  naturalness: «Các thượng tế», «các trưởng lão», «đám đông», và «xin tha Ba-ra-ba» đều tự nhiên trong tiếng Việt hiện đại và phù hợp ngữ cảnh trước đó. Câu sửa với «còn giết Đức Giê-su» gọn, rõ, và giữ được phép đối chiếu của δέ.
  terminology: «Thượng tế», «trưởng lão», «Ba-ra-ba», và «Đức Giê-su» nhất quán với văn phong Kinh Thánh tiếng Việt. Dùng «giết» trong chính văn làm rõ nghĩa của ἀπολέσωσιν trong ngữ cảnh xử tử, còn chú thích bảo lưu phương án rộng hơn «tiêu diệt».
  issues:
  - severity: medium
    issue: Mệnh đề «Đức Giê-su thì phải bị giết» đổi chủ động thành bị động và thêm «phải».
    rationale: ἀπολέσωσιν là lối giả định chủ động, diễn tả điều các đám đông bị thuyết phục làm đối với Đức Giê-su. Nguyên văn không có từ tương đương «phải»; cách sửa tránh thêm tình thái và phục hồi tác thể hàm ẩn là các đám đông.
  revised_text: Nhưng các thượng tế và các trưởng lão đã thuyết phục đám đông xin tha Ba-ra-ba, còn giết Đức Giê-su.[a]
