id: MAT.16.4
reference: Matthew 16:4
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Γενεὰ πονηρὰ καὶ μοιχαλὶς σημεῖον ἐπιζητεῖ, καὶ σημεῖον οὐ δοθήσεται αὐτῇ εἰ μὴ τὸ σημεῖον ⸀Ἰωνᾶ. καὶ καταλιπὼν αὐτοὺς ἀπῆλθεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/004.yaml
  text: An evil and adulterous generation seeks a sign[a], and no sign will be given to it except the sign of Jonah. And leaving them[b], he went away.
translation:
  language: vi
  text: Một thế hệ gian ác và ngoại tình[a] tìm kiếm một dấu hiệu, nhưng sẽ không được ban cho thế hệ ấy dấu hiệu nào, ngoại trừ dấu hiệu của Giô-na[b]. Rồi Người bỏ họ mà đi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể hiểu là “thế hệ bất trung”. Tiếng Hy Lạp nói “ngoại tình”, có lẽ vọng lại ngôn ngữ của các tiên tri về sự bất trung với giao ước.
    reason: lexical_alternative
  - marker: b
    text: Ma-thi-ơ 12:39–40 giải thích “dấu hiệu của Giô-na” qua ba ngày ba đêm của Giô-na và áp dụng mô hình ấy cho Con Người.
    reason: cross_reference
lexical_decisions:
- source_word: Γενεὰ
  choice: thế hệ
  rationale: Giữ nghĩa thông thường của γενεά trong Ma-thi-ơ, chỉ lớp người đương thời, thay vì diễn giải rộng thành “dân chúng” hay “thời đại”.
- source_word: πονηρὰ
  choice: gian ác
  rationale: Diễn đạt trực tiếp sự bại hoại về đạo đức, tự nhiên và trang trọng trong tiếng Việt hiện đại.
- source_word: μοιχαλὶς
  choice: ngoại tình
  rationale: Giữ nguyên ẩn dụ sắc bén liên quan đến ngoại tình; không thu hẹp nghĩa thành lời giải thích “bất trung”, dù ngôn ngữ tiên tri có thể gợi đến sự bất trung với giao ước.
- source_word: σημεῖον
  choice: dấu hiệu
  rationale: Phản ánh nghĩa cơ bản của σημεῖον mà không tự động thêm ý “phép lạ”; ngữ cảnh cho thấy đây là dấu hiệu được đòi hỏi để xác nhận thẩm quyền.
- source_word: ἐπιζητεῖ
  choice: tìm kiếm
  rationale: Theo sát nghĩa của động từ; không tăng sắc thái thành “đòi hỏi”, dù ngữ cảnh đối đầu có thể hàm ý điều đó.
- source_word: δοθήσεται
  choice: sẽ được ban
  rationale: Giữ thể bị động tương lai và sắc thái một dấu hiệu được trao ban.
- source_word: αὐτῇ
  choice: cho thế hệ ấy
  rationale: Lặp lại danh từ chỉ đối tượng để tiếng Việt rõ và tự nhiên hơn việc dùng một đại từ giống cái vốn không có tương đương trực tiếp.
- source_word: εἰ μὴ
  choice: ngoại trừ
  rationale: Nêu rõ ngoại lệ duy nhất trong cấu trúc phủ định.
- source_word: τὸ σημεῖον Ἰωνᾶ
  choice: dấu hiệu của Giô-na
  rationale: Giữ nguyên cấu trúc sở hữu và sự cô đọng của cụm từ, không đưa phần giải thích về cái chết và sự sống lại vào chính văn.
- source_word: καταλιπὼν αὐτοὺς ἀπῆλθεν
  choice: Rồi Người bỏ họ mà đi
  rationale: Truyền đạt tự nhiên quan hệ giữa phân từ “bỏ lại” và động từ chính “đi khỏi”; “Người” chỉ Đức Giê-su theo lối kể trang trọng mà không thêm danh xưng không có trong câu Hy Lạp.
theological_decisions:
- issue: Ý nghĩa của “thế hệ ngoại tình”
  choice: Giữ hình ảnh “ngoại tình” trong chính văn.
  alternative: Dịch diễn giải là “thế hệ bất trung”.
  rationale: Từ Hy Lạp dùng trực tiếp ẩn dụ ngoại tình và có thể vọng lại ngôn ngữ tiên tri về sự bất trung với giao ước. Giữ ẩn dụ bảo toàn cả sức nặng đạo đức lẫn hàm ý giao ước mà không quyết định thay cho người đọc.
- issue: Ý nghĩa của “dấu hiệu của Giô-na”
  choice: Giữ nguyên cụm từ ngắn gọn trong chính văn và giải thích bằng chú thích đối chiếu.
  alternative: Nói rõ trong chính văn rằng đó là dấu hiệu về cái chết và sự sống lại của Đức Giê-su.
  rationale: Ma-thi-ơ 12:39–40 giải thích mô-típ Giô-na, nhưng câu này tự nó không trình bày chi tiết ấy; bản dịch không nên đưa phần giải nghĩa đầy đủ hơn vào chính văn.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Bản dịch giữ ẩn dụ “ngoại tình” và cụm từ hàm súc “dấu hiệu của Giô-na”; dùng “dấu hiệu” thay vì tự động diễn giải thành “phép lạ” hay “dấu lạ” để tránh nói quá điều σημεῖον tự thân biểu đạt.
