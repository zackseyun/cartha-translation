    issue: Chú thích đề nghị “Đấng Làm Người” là cách dịch khác của “Con Người”.
    rationale: Cách này không tương ứng sát với ὁ υἱὸς τοῦ ἀνθρώπου và thêm ý nghĩa diễn giải về sự làm người/nhập thể mà bản văn không phát biểu tại đây.
  - severity: low
    issue: Chú thích đặt sau toàn bộ câu và gộp lời dịch sát với giải thích danh xưng.
    rationale: Phần “Dịch sát hơn” liên quan đến cấu trúc câu hỏi, còn phần về “Con Người” liên quan đến một cụm từ riêng. Một neo duy nhất ở cuối câu không minh bạch; vì không cần thiết cho bản dịch, bỏ chú thích tránh tạo thông tin không chính xác.
