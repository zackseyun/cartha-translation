source:
  edition: SBLGNT
  text: Ἐλθὼν δὲ ὁ Ἰησοῦς εἰς τὰ μέρη Καισαρείας τῆς Φιλίππου ἠρώτα τοὺς μαθητὰς αὐτοῦ λέγων· ⸀Τίνα λέγουσιν οἱ ἄνθρωποι εἶναι τὸν υἱὸν τοῦ ἀνθρώπου;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/013.yaml
  text: When Jesus came into the region of Caesarea Philippi[a], he was asking his disciples, saying[b], “Who do people say the Son of Man is?”
translation:
  language: vi
  text: 'Khi Đức Giê-su đến vùng Xê-da-rê Phi-líp, Ngài hỏi các môn đồ: “Người ta nói Con Người là ai?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐλθὼν δὲ ὁ Ἰησοῦς
  choice: Khi Đức Giê-su đến
  rationale: Phân từ bất định Ἐλθὼν cùng δέ mở sang một cảnh mới. Cấu trúc “Khi ... đến” truyền đạt tự nhiên quan hệ thời gian; không thêm một từ chỉ thời gian như “bấy giờ” vốn không có trực tiếp trong nguyên văn.
- source_word: εἰς τὰ μέρη Καισαρείας τῆς Φιλίππου
  choice: đến miền Xê-da-rê Phi-líp
  rationale: μέρη chỉ vùng hay địa hạt quanh thành; “miền” là cách diễn đạt tự nhiên. “Xê-da-rê Phi-líp” giữ tên địa danh quen dùng và phân biệt nơi này với Xê-da-rê ven biển.
- source_word: ἠρώτα
  choice: Ngài hỏi
  rationale: Thì vị hoàn có thể gợi hành động đang diễn ra, nhưng trong văn kể tiếng Việt, “hỏi” tự nhiên hơn “đang hỏi” và không làm thay đổi nội dung câu hỏi.
- source_word: τοὺς μαθητὰς αὐτοῦ
  choice: các môn đồ
  rationale: “Môn đồ” là cách gọi đã định hình trong ngữ cảnh sách Tin Mừng, chỉ những người theo học Chúa Giê-su.
- source_word: λέγων
  choice: '[không dịch riêng]'
  rationale: Phân từ λέγων giới thiệu lời nói trực tiếp. Trong tiếng Việt, dấu hai chấm sau “hỏi” đã diễn đạt đầy đủ chức năng ấy; thêm “rằng” hoặc “nói rằng” sẽ nặng câu.
- source_word: Τίνα λέγουσιν οἱ ἄνθρωποι εἶναι
  choice: Người ta nói ... là ai?
  rationale: ἄνθρωποι mang nghĩa khái quát, nên “người ta” tự nhiên và không giới hạn ở nam giới. Cấu trúc câu hỏi gián tiếp của Hy Lạp được chuyển thành trật tự tiếng Việt thông dụng.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: Con Người
  rationale: Giữ danh xưng đặc trưng Chúa Giê-su dùng về chính mình, cùng âm hưởng liên văn bản và độ căng thần học, thay vì diễn giải thành một cách gọi thuần nhân học.
theological_decisions:
- issue: Cách dịch ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Con Người
  alternative: Đấng Làm Người
  rationale: “Con Người” vừa giữ hình thức truyền thống của danh xưng, vừa bảo tồn khả năng liên hệ với Đa-ni-ên 7 và tính tự quy chiếu trong các sách Tin Mừng mà không quyết định thay độc giả toàn bộ ý nghĩa.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Giê-su” trong lời kể và “Ngài” làm đại từ kính trọng; giữ thuật ngữ “môn đồ” và danh xưng “Con Người” vì giá trị liên văn bản. Gộp chức năng của λέγων vào dấu hai chấm để câu tiếng Việt tự nhiên.
