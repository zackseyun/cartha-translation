id: MAT.16.17
reference: Matthew 16:17
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸂ἀποκριθεὶς δὲ⸃ ὁ Ἰησοῦς εἶπεν αὐτῷ· Μακάριος εἶ, Σίμων Βαριωνᾶ, ὅτι σὰρξ καὶ αἷμα οὐκ ἀπεκάλυψέν σοι ἀλλ’ ὁ πατήρ μου ὁ ἐν τοῖς οὐρανοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/017.yaml
  text: And Jesus answered him[a], “Blessed are you, Simon Bar-Jonah, because flesh and blood did not reveal this to you[c][b], but my Father who is in heaven did.”
translation:
  language: vi
  text: 'Đức Giê-su đáp lời ông: “Phước cho anh, Si-môn Ba Giô-na[a], vì không phải thịt và máu[b] đã bày tỏ điều này cho anh, nhưng là Cha tôi, Đấng ở trên trời[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “Si-môn, con Giô-na.” “Ba Giô-na” giữ lại dạng phụ danh A-ram trong nguyên văn Hy Lạp.
    reason: lexical_alternative
  - marker: b
    text: “Thịt và máu” là thành ngữ chỉ con người hoặc một nguồn gốc thuần túy con người.
    reason: cultural_note
  - marker: c
    text: 'Nguyên văn Hy Lạp: “ở trong các tầng trời”; tiếng Việt dùng “ở trên trời” cho tự nhiên.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ... εἶπεν αὐτῷ
  choice: Đức Giê-su đáp lời ông
  rationale: Diễn đạt tự nhiên cấu trúc phân từ kết hợp với động từ hữu hạn mang nghĩa ‘đáp và nói’; δέ tiếp nối mạch kể và không cần dịch riêng một cách nặng nề.
- source_word: Μακάριος
  choice: Phước cho anh
  rationale: ‘Phước’ giữ được sắc thái tuyên bố về ân phúc hơn là chỉ cảm xúc vui vẻ; cấu trúc ‘Phước cho…’ trang trọng nhưng vẫn dễ hiểu trong tiếng Việt.
- source_word: Σίμων Βαριωνᾶ
  choice: Si-môn Ba Giô-na
  rationale: Phiên âm tên riêng và giữ dạng phụ danh A-ram Βαριωνᾶ thay vì âm thầm chuyển thành ‘con Giô-na’; chú thích nêu rõ ý nghĩa.
- source_word: ὅτι
  choice: vì
  rationale: Ở đây ὅτι nêu lý do Si-môn được tuyên là có phước.
- source_word: σὰρξ καὶ αἷμα
  choice: thịt và máu
  rationale: Giữ nguyên hình ảnh thành ngữ chỉ nguồn gốc hay tác nhân thuần túy con người, đồng thời giải thích trong chú thích để tránh hiểu theo nghĩa vật chất đơn thuần.
- source_word: ἀπεκάλυψέν σοι
  choice: đã bày tỏ điều này cho anh
  rationale: ‘Bày tỏ’ truyền đạt hành động làm cho điều vốn không được biết trở nên biết; ‘điều này’ được bổ sung theo ngữ cảnh vì tân ngữ bị lược trong tiếng Hy Lạp.
- source_word: ἀλλ’ ὁ πατήρ μου
  choice: nhưng là Cha tôi
  rationale: ‘Nhưng là’ làm rõ sự tương phản mạnh giữa nguồn gốc con người và chính Cha của Đức Giê-su mà không thêm nội dung thần học.
- source_word: ὁ ἐν τοῖς οὐρανοῖς
  choice: Đấng ở trên trời
  rationale: Phản ánh cụm định ngữ chỉ Cha và dùng cách nói tiếng Việt tự nhiên; chú thích ghi nhận nguyên văn Hy Lạp dùng dạng số nhiều ‘các tầng trời’.
theological_decisions:
- issue: Nguồn gốc lời tuyên xưng của Si-môn
  choice: Giữ nguyên sự tương phản giữa ‘thịt và máu’ và sự bày tỏ của Cha.
  alternative: Hiểu ‘thịt và máu’ riêng là suy luận tự nhiên của Si-môn hoặc là lời dạy của một người khác.
  rationale: Thành ngữ loại trừ nguồn gốc thuần túy con người nói chung nhưng không xác định cụ thể là lý trí riêng của Si-môn hay một thẩm quyền con người nào; bản dịch không thu hẹp điều văn bản để ngỏ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng ‘Đức Giê-su’, ‘ông’ trong lời dẫn và ‘anh’ trong lời nói trực tiếp để thể hiện cách xưng hô tự nhiên. Giữ thành ngữ ‘thịt và máu’ cùng dạng tên A-ram, có chú thích giải nghĩa.
