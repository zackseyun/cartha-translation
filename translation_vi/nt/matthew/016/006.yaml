source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς εἶπεν αὐτοῖς· Ὁρᾶτε καὶ προσέχετε ἀπὸ τῆς ζύμης τῶν Φαρισαίων καὶ Σαδδουκαίων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/006.yaml
  text: But Jesus said to them[a], “Watch out and beware of the leaven of the Pharisees and Sadducees.”
translation:
  language: vi
  text: 'Nhưng Đức Giê-su nói với họ: “Hãy coi chừng và đề phòng men của người Pha-ri-si và người Sa-đu-sê.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: Nhưng
  rationale: Đánh dấu sự chuyển ý có sắc thái tương phản nhẹ với lời trao đổi ngay trước đó.
- source_word: εἶπεν αὐτοῖς
  choice: phán với các môn đệ
  rationale: Trong ngữ cảnh, đại từ số nhiều chỉ các môn đệ; “phán” giữ giọng văn trang trọng, tự nhiên khi thuật lại lời Đức Giê-su.
- source_word: Ὁρᾶτε καὶ προσέχετε
  choice: Hãy coi chừng và đề phòng
  rationale: Hai mệnh lệnh gần nghĩa được giữ lại để phản ánh sự nhấn mạnh kép của nguyên văn; cách diễn đạt này rõ ràng trong tiếng Việt hiện đại.
- source_word: ἀπὸ
  choice: '[hàm ý trong] đề phòng'
  rationale: Sau động từ cảnh báo, giới từ ἀπό được thể hiện tự nhiên qua kết cấu tiếng Việt “đề phòng” thay vì dịch riêng thành “khỏi” hoặc “từ”.
- source_word: ζύμης
  choice: men
  rationale: “Men” là từ tiếng Việt tự nhiên cho chất làm bột dậy và vẫn giữ nguyên hình ảnh ẩn dụ, không giải thích sớm thành “giáo huấn” hay “ảnh hưởng”.
- source_word: Φαρισαίων
  choice: người Pha-ri-si
  rationale: Dạng phiên âm quen thuộc, có yếu tố “người” để chỉ rõ đây là một nhóm người.
- source_word: Σαδδουκαίων
  choice: người Sa-đu-sê
  rationale: Dạng phiên âm quen thuộc, dễ đọc trong tiếng Việt hiện đại.
theological_decisions:
- issue: Ý nghĩa ẩn dụ của ζύμη
  choice: Giữ hình ảnh “men” trong chính văn
  alternative: Dịch giải thành “giáo huấn” hoặc “ảnh hưởng”
  rationale: Câu này chưa trực tiếp giải nghĩa hình ảnh; giữ nguyên ẩn dụ bảo toàn diễn tiến của trình thuật và tránh đưa lời giải thích ở câu sau vào quá sớm.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Giữ sự nhấn mạnh của hai mệnh lệnh Hy Lạp và không giải nghĩa ẩn dụ ngay trong chính văn.
