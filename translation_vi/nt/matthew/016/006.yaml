revisions:
- from: 'Nhưng Đức Giê-su phán với các môn đệ: “Hãy coi chừng và đề phòng men[a] của người Pha-ri-si và người Sa-đu-sê.”'
  to: 'Nhưng Đức Giê-su nói với họ: “Hãy coi chừng và đề phòng men của người Pha-ri-si và người Sa-đu-sê.”'
  rationale: Chỉnh “phán với các môn đệ” thành “nói với họ” để bám sát εἶπεν αὐτοῖς và dùng văn phong tiếng Việt tiêu chuẩn hiện đại. Giữ nguyên hình ảnh “men” và hai mệnh lệnh cảnh báo. Bỏ chú thích vì tiếng Việt không cần một phương án phân biệt tương đương với đối lập tiếng Anh “leaven/yeast”, và vì chú thích hiện có thêm diễn giải không cần thiết vào câu.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T05:40:15Z'
review_pass:
  verdict: revise
  source_fidelity: Bản thảo giữ đúng mệnh lệnh kép Ὁρᾶτε καὶ προσέχετε, hình ảnh ζύμη, và hai tên nhóm người. Tuy nhiên, αὐτοῖς chỉ là “họ”; việc thay bằng “các môn đệ” là giải thích theo ngữ cảnh, không cần thiết trong một bản dịch tối ưu tương đương.
  naturalness: “Hãy coi chừng và đề phòng” là tự nhiên, rõ nghĩa và giữ được sự nhấn mạnh kép. “Đức Giê-su nói với họ” là cách kể hiện đại, trung tính và sát nguyên văn hơn “phán với các môn đệ.”
  terminology: “Men,” “Pha-ri-si,” và “Sa-đu-sê” phù hợp. Chú thích “men bột” không phải là một lựa chọn từ vựng thực sự rõ ràng hơn “men” trong tiếng Việt; hơn nữa, chú thích diễn giải hình ảnh vượt quá điều câu này trực tiếp nói, dù phù hợp với lời giải thích sau đó trong ngữ cảnh.
  issues:
  - severity: low
    issue: Chính văn thêm “các môn đệ” thay cho đại từ αὐτοῖς.
    rationale: Ngữ cảnh xác định “họ” là các môn đệ, nhưng nguyên văn chỉ dùng đại từ. Giữ “họ” bảo toàn mức độ minh thị của nguồn.
  - severity: low
    issue: Chú thích “Hay ‘men bột’” không hữu ích như một phương án từ vựng.
    rationale: Trong tiếng Việt hiện đại, “men” đã diễn đạt trực tiếp ζύμη; “men bột” dễ gây cảm giác là một loại men cụ thể và phần diễn giải về sau không cần thiết trong chú thích từ vựng của câu này.
  revised_text: 'Nhưng Đức Giê-su nói với họ: “Hãy coi chừng và đề phòng men của người Pha-ri-si và người Sa-đu-sê.”'
