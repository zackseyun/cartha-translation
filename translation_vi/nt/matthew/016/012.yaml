id: MAT.16.12
reference: Matthew 16:12
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: τότε συνῆκαν ὅτι οὐκ εἶπεν προσέχειν ἀπὸ τῆς ζύμης ⸂τῶν ἄρτων⸃ ἀλλὰ ἀπὸ τῆς διδαχῆς τῶν Φαρισαίων καὶ Σαδδουκαίων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/012.yaml
  text: Then they understood that he had not said to beware of the leaven of bread[a], but of the teaching of the Pharisees and Sadducees.
translation:
  language: vi
  text: Bấy giờ, họ hiểu rằng Ngài không bảo họ phải coi chừng men bánh[a], nhưng phải coi chừng lời dạy của người Pha-ri-si và người Sa-đu-sê.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “men của những ổ bánh.” Danh từ Hy Lạp ở đây ở số nhiều.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Bấy giờ
  rationale: Đánh dấu thời điểm các môn đồ cuối cùng hiểu ý; cách diễn đạt tự nhiên, trang trọng trong văn kể chuyện.
- source_word: συνῆκαν
  choice: họ hiểu
  rationale: Diễn đạt trực tiếp việc đi đến chỗ hiểu ra mà không thêm sắc thái giải thích quá mức.
- source_word: οὐκ εἶπεν προσέχειν
  choice: ngài không bảo họ phải coi chừng
  rationale: Trong ngữ cảnh lời cảnh báo, προσέχειν mang nghĩa đề phòng; thêm đại từ 'họ' theo cú pháp tiếng Việt để câu rõ và tự nhiên.
- source_word: ἀπὸ τῆς ζύμης
  choice: men
  rationale: ‘Men’ là từ tiếng Việt tự nhiên cho ζύμη, đồng thời giữ nguyên hình ảnh ẩn dụ của câu.
- source_word: τῶν ἄρτων
  choice: của bánh
  rationale: Giữ quan hệ sở hữu trong tiếng Hy Lạp; ‘bánh’ tự nhiên hơn dạng số nhiều trong chính văn, còn đặc điểm số nhiều được ghi ở chú thích.
- source_word: ἀλλὰ ἀπὸ τῆς διδαχῆς
  choice: nhưng coi chừng lời dạy
  rationale: Bổ lại động từ theo lối tỉnh lược của nguyên văn để tiếng Việt rõ nghĩa; ‘lời dạy’ hiện đại và dễ hiểu hơn thuật ngữ giáo hội.
- source_word: τῶν Φαρισαίων καὶ Σαδδουκαίων
  choice: của người Pha-ri-si và người Sa-đu-sê
  rationale: Dùng các dạng phiên âm quen thuộc trong tiếng Việt và làm rõ đây là tên hai nhóm người.
theological_decisions:
- issue: Ý nghĩa ẩn dụ của ‘men’
  choice: Giữ ‘men’ trong vế đầu và chỉ giải thích theo chính câu là ‘lời dạy’.
  alternative: Diễn giải thành ‘sự giả hình’ hoặc ‘lời dạy sai lạc’.
  rationale: Câu này xác định đối tượng ẩn dụ là lời dạy của người Pha-ri-si và Sa-đu-sê, nhưng không trực tiếp gán thêm phẩm chất đạo đức cụ thể; bản dịch không nhập kết luận từ các đoạn song song.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng ‘ngài’ để chỉ Chúa Giê-su theo mạch ngữ cảnh; lặp ‘coi chừng’ ở vế đối lập nhằm tránh câu tiếng Việt mơ hồ.
