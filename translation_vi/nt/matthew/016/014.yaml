id: MAT.16.14
reference: Matthew 16:14
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οἱ δὲ εἶπαν· Οἱ μὲν Ἰωάννην τὸν βαπτιστήν, ἄλλοι δὲ Ἠλίαν, ἕτεροι δὲ Ἰερεμίαν ἢ ἕνα τῶν προφητῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/014.yaml
  text: And they said[a], “Some say John the Baptist, others Elijah, and others Jeremiah or one of the prophets.”
translation:
  language: vi
  text: 'Họ đáp[a]: “Có người nói là Giăng Báp-tít, người khác nói là Ê-li, còn những người khác nói là Giê-rê-mi hoặc một trong các nhà tiên tri.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể diễn đạt đầy đủ hơn: “Họ đáp: ‘Có người nói Thầy là Giăng Báp-tít, người khác nói Thầy là Ê-li, còn những người khác nói Thầy là Giê-rê-mi hoặc một trong các nhà tiên tri.’”'
    reason: Nêu rõ đối tượng được hiểu ngầm từ câu hỏi trước, trong khi nguyên văn câu này dùng lối tỉnh lược.
lexical_decisions:
- source_word: οἱ δὲ εἶπαν
  choice: Họ đáp
  rationale: δέ nối tiếp mạch đối thoại mà không cần nhấn mạnh sự tương phản; εἶπαν trong ngữ cảnh trả lời câu hỏi trước đó được diễn đạt tự nhiên là “đáp”.
- source_word: Οἱ μὲν
  choice: Có người nói là
  rationale: μέν mở đầu chuỗi phân nhóm, được tiếp nối bởi ἄλλοι và ἕτεροι. Cách nói này tự nhiên trong tiếng Việt và vẫn để đối tượng được đồng nhất hóa ở dạng tỉnh lược theo nguyên văn.
- source_word: Ἰωάννην τὸν βαπτιστήν
  choice: Giăng Báp-tít
  rationale: Dùng tên gọi quen thuộc, dễ nhận biết trong tiếng Việt hiện đại cho nhân vật được gọi là βαπτιστής.
- source_word: ἄλλοι δὲ
  choice: người khác nói là
  rationale: Tiếp tục phép phân nhóm; lặp lại “nói là” giúp câu tiếng Việt rõ và tự nhiên mà không thêm nội dung mới.
- source_word: Ἠλίαν
  choice: Ê-li
  rationale: Dùng dạng tên riêng Kinh Thánh quen thuộc trong tiếng Việt.
- source_word: ἕτεροι δὲ
  choice: còn những người khác nói là
  rationale: ἕτεροι chỉ thêm một nhóm nữa; “còn những người khác” thể hiện rõ sự tiếp nối trong danh sách mà không cường điệu khác biệt.
- source_word: Ἰερεμίαν
  choice: Giê-rê-mi
  rationale: Dùng dạng tên riêng Kinh Thánh quen thuộc trong tiếng Việt.
- source_word: ἢ ἕνα τῶν προφητῶν
  choice: hoặc một trong các nhà tiên tri
  rationale: Giữ đúng quan hệ lựa chọn của ἤ và không thêm ý “khác,” vốn không xuất hiện rõ trong tiếng Hy Lạp.
theological_decisions:
- issue: Đối tượng ngầm trong các lời đồng nhất hóa
  choice: 'Giữ cách diễn đạt tỉnh lược: “Có người nói là Giăng Báp-tít...”'
  alternative: “Có người nói Thầy là Giăng Báp-tít...”
  rationale: Tiếng Hy Lạp chỉ liệt kê các sự đồng nhất hóa và dựa vào câu hỏi ngay trước đó để người đọc hiểu đối tượng là Chúa Giê-su. Bản dịch chính giữ sự tỉnh lược ấy; chú thích cung cấp cách diễn đạt đầy đủ hơn trong tiếng Việt.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Họ đáp” phù hợp mạch đối thoại; các tên riêng theo dạng quen thuộc trong tiếng Việt. Cấu trúc phân nhóm được diễn đạt rõ ràng mà vẫn bảo toàn sự tỉnh lược của nguyên văn.
