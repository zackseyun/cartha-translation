  rationale: Bản sửa cập nhật “môn đồ” thành “môn đệ” theo tiếng Việt hiện đại và dùng “đã quên” để tránh hàm ý không cần thiết rằng việc quên diễn ra sau khi họ đến nơi. Giữ “bờ bên kia,” “mang theo bánh,” và chú thích về số nhiều của ἄρτους.
