  text: And when the disciples came to the other side[a], they had forgotten to take bread.
translation:
  language: vi
  text: Khi các môn đệ đến bờ bên kia, họ đã quên mang theo bánh.[a]
  philosophy: optimal-equivalence
  footnotes:
