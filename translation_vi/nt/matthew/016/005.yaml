lexical_decisions:
- source_word: ἐλθόντες
  choice: khi ... sang đến
  rationale: Phân từ bất định được diễn đạt như một mệnh đề chỉ thời gian tự nhiên trong tiếng Việt; “sang đến” phù hợp với việc qua hồ đến bờ đối diện.
- source_word: οἱ μαθηταὶ
  choice: các môn đồ
  rationale: Cách gọi quen thuộc, trang trọng và dễ hiểu dành cho những người theo học Chúa Giê-su trong các sách Phúc Âm.
- source_word: εἰς τὸ πέραν
  choice: bờ bên kia
  rationale: Diễn đạt tự nhiên thành ngữ chỉ phía đối diện của hồ; danh từ “bờ” được làm rõ từ ngữ cảnh.
- source_word: ἐπελάθοντο
  choice: họ quên
  rationale: Động từ có nghĩa là “quên”; tiếng Việt không cần đánh dấu thời quá khứ hoàn thành, vì trình tự sự việc đã rõ nhờ mệnh đề thời gian.
- source_word: ἄρτους
  choice: bánh
  rationale: Danh từ Hy Lạp ở số nhiều, nghĩa đen là các ổ bánh; trong tiếng Việt, “bánh” có thể dùng tự nhiên như danh từ không đánh dấu số trong ngữ cảnh lương thực.
- source_word: λαβεῖν
  choice: mang theo
  rationale: Sau động từ “quên”, “mang theo” truyền đạt tự nhiên việc đem bánh cùng mình trong chuyến đi, đồng thời giữ đúng ý của λαμβάνω trong ngữ cảnh.
