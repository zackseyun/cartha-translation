id: MAT.16.18
reference: Matthew 16:18
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: κἀγὼ δέ σοι λέγω ὅτι σὺ εἶ Πέτρος, καὶ ἐπὶ ταύτῃ τῇ πέτρᾳ οἰκοδομήσω μου τὴν ἐκκλησίαν, καὶ πύλαι ᾅδου οὐ κατισχύσουσιν αὐτῆς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/018.yaml
  text: And I also say to you that you are Peter[a], and on this rock I will build my church[b], and the gates of Hades will not prevail against it.
translation:
  language: vi
  text: 'Còn Ta cũng nói với con rằng: Con là Phi-e-rơ, và trên tảng đá này[a], Ta sẽ xây dựng Hội Thánh của Ta; các cửa Âm phủ[b] sẽ không thắng nổi Hội Thánh ấy.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Trong tiếng Hy Lạp, tên Phi-e-rơ (Petros) có liên hệ với từ “tảng đá” (petra). “Tảng đá này” có thể được hiểu là chính Phi-e-rơ, lời tuyên xưng của ông, hoặc Phi-e-rơ trong tư cách người tuyên xưng và đại diện các sứ đồ.
    reason: alternative_reading
  - marker: b
    text: 'Hy Lạp: Hades, tức cõi người chết; theo truyền thống đôi khi dịch là “địa ngục.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀγὼ δέ σοι λέγω
  choice: Còn Ta, Ta nói với con rằng
  rationale: “Còn Ta” thể hiện sắc thái đáp lại hoặc chuyển ý nhẹ của κἀγὼ δέ, còn “Ta nói với con” giữ cấu trúc lời phán trực tiếp mà không nhấn mạnh sự tương phản quá mức.
- source_word: Πέτρος
  choice: Phi-e-rơ
  rationale: Dùng dạng tên riêng quen thuộc trong tiếng Việt. Mối liên hệ từ nguyên giữa Πέτρος và πέτρα không thể tái hiện trọn vẹn trong tiếng Việt nên được giải thích ở chú thích.
- source_word: ἐπὶ ταύτῃ τῇ πέτρᾳ
  choice: trên vầng đá này
  rationale: Giữ hình ảnh nền móng và lực chỉ định của ταύτῃ. “Vầng đá” diễn đạt một khối đá làm nền, đồng thời không tự quyết định đối tượng mà hình ảnh này ám chỉ.
- source_word: οἰκοδομήσω
  choice: Ta sẽ xây dựng
  rationale: Giữ nguyên ẩn dụ xây cất của οἰκοδομέω thay vì chuyển thành ý trừu tượng như “thiết lập”.
- source_word: μου τὴν ἐκκλησίαν
  choice: Hội Thánh của Ta
  rationale: ἐκκλησία chỉ cộng đồng thuộc về Chúa Giê-su trong ngữ cảnh này. “Hội Thánh” là cách gọi rõ ràng, trang trọng và quen thuộc trong tiếng Việt; “của Ta” giữ đại từ sở hữu μου.
- source_word: πύλαι ᾅδου
  choice: các cửa Âm phủ
  rationale: Giữ hình ảnh “các cửa” ở số nhiều. “Âm phủ” tại đây chỉ cõi người chết, gần nghĩa của ᾅδης hơn “địa ngục,” vốn dễ gợi đến nơi hình phạt cuối cùng.
- source_word: οὐ κατισχύσουσιν αὐτῆς
  choice: sẽ không thắng nổi Hội Thánh ấy
  rationale: “Không thắng nổi” truyền đạt nghĩa áp đảo hoặc chiếm ưu thế của κατισχύω. Lặp lại “Hội Thánh ấy” thay cho đại từ giúp câu tiếng Việt rõ nghĩa và tránh nhập nhằng về tiền ngữ.
theological_decisions:
- issue: Đối tượng được gọi là “vầng đá này” (πέτρᾳ)
  choice: Giữ nguyên cách nói “vầng đá này,” không xác định đối tượng ngay trong bản văn
  alternative: Có thể hiểu là chính Phi-e-rơ, lời tuyên xưng của ông, hoặc Phi-e-rơ trong tư cách người tuyên xưng và đại diện các sứ đồ
  rationale: Tiếng Hy Lạp tạo lối chơi chữ giữa Πέτρος và πέτρα nhưng không giải quyết dứt khoát mọi câu hỏi diễn giải. Bản dịch vì thế giữ sự hàm hồ và căng thẳng thần học chân thực của câu.
- issue: Cách dịch ᾅδης
  choice: Âm phủ
  alternative: 'Cõi người chết; theo truyền thống: địa ngục'
  rationale: “Âm phủ” biểu thị cõi người chết và tránh đồng nhất ᾅδης với nơi hình phạt cuối cùng, trong khi chú thích cung cấp nguyên ngữ và các cách gọi khác.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cặp đại từ “Ta—con” phù hợp với lời Chúa Giê-su nói trực tiếp với một môn đồ. Viết hoa “Hội Thánh” để chỉ cộng đồng thuộc về Chúa Giê-su, không nhằm xác nhận một cơ cấu giáo phái cụ thể.
