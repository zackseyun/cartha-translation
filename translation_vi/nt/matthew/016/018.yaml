  to: 'Còn Ta cũng nói với con rằng: Con là Phi-e-rơ, và trên tảng đá này[a], Ta sẽ xây dựng Hội Thánh của Ta; các cửa Âm phủ[b] sẽ không thắng nổi Hội Thánh ấy.'
