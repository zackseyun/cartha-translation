id: MAT.16.23
reference: Matthew 16:23
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὁ δὲ στραφεὶς εἶπεν τῷ Πέτρῳ· Ὕπαγε ὀπίσω μου, Σατανᾶ· σκάνδαλον ⸂εἶ ἐμοῦ⸃, ὅτι οὐ φρονεῖς τὰ τοῦ θεοῦ ἀλλὰ τὰ τῶν ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/023.yaml
  text: But he turned and said to Peter[a], “Go behind me, Satan! You are a stumbling block to me, because you are not setting your mind on the things of God[b], but on the things of men.”
translation:
  language: vi
  text: 'Nhưng Đức Giê-su quay lại và nói với Phi-e-rơ: “Hãy đi ra sau ta, Sa-tan! Con là chướng ngại khiến ta vấp ngã, vì con không hướng tâm trí vào những điều thuộc về Đức Chúa Trời, mà vào những điều thuộc về loài người.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: στραφεὶς
  choice: quay lại
  rationale: Diễn đạt tự nhiên hành động Đức Giê-su xoay về phía Phi-e-rơ trước khi nói, phù hợp với phân từ bất định quá khứ được dùng theo nghĩa nội động.
- source_word: Ὕπαγε ὀπίσω μου
  choice: Hãy lui ra phía sau ta
  rationale: Giữ cả mệnh lệnh ὕπαγε và ý nghĩa không gian của ὀπίσω μου; “lui ra” cũng phù hợp với lời quở trách mạnh mà không tự ý diễn giải thành việc đuổi đi hoàn toàn.
- source_word: Σατανᾶ
  choice: Sa-tan
  rationale: Giữ danh xưng ở hô cách và sức nặng của lời quở trách, đồng thời không quyết định rằng Phi-e-rơ chính là Sa-tan hay chỉ đang đóng vai trò đối nghịch.
- source_word: σκάνδαλον
  choice: chướng ngại khiến ta vấp ngã
  rationale: Tái hiện hình ảnh một vật cản gây vấp, rõ nghĩa hơn “cớ vấp phạm” đối với độc giả phổ thông hiện đại.
- source_word: ἐμοῦ
  choice: khiến ta
  rationale: Trong kết cấu với σκάνδαλον, sở hữu cách chỉ người bị vật cản tác động; cách diễn đạt này tự nhiên trong tiếng Việt và gắn trực tiếp hình ảnh vấp ngã với Đức Giê-su.
- source_word: φρονεῖς
  choice: hướng tâm trí vào
  rationale: Thể hiện định hướng tư tưởng và mối quan tâm ổn định, không thu hẹp thành một ý nghĩ thoáng qua.
- source_word: τὰ τοῦ θεοῦ
  choice: những điều thuộc về Đức Chúa Trời
  rationale: Giữ cấu trúc khái quát và sự đối lập của nguyên văn, tránh diễn giải quá cụ thể thành kế hoạch hay quyền lợi của Đức Chúa Trời.
- source_word: τὰ τῶν ἀνθρώπων
  choice: những điều thuộc về loài người
  rationale: ἀνθρώπων ở đây chỉ nhân loại nói chung trong thế đối lập với Đức Chúa Trời; “loài người” vừa chính xác về phạm vi vừa tự nhiên, không tạo hàm ý chỉ nam giới.
theological_decisions:
- issue: Sức nặng của danh xưng “Sa-tan” dành cho Phi-e-rơ
  choice: Giữ nguyên danh xưng “Sa-tan” trong lời nói trực tiếp.
  alternative: Dịch là “kẻ đối nghịch” hoặc giải thích rằng Sa-tan đang hành động qua Phi-e-rơ.
  rationale: Nguyên văn không giải thích quan hệ chính xác giữa Phi-e-rơ và Sa-tan trong lời quở trách. Bản dịch giữ sự gay gắt và tính nhập nhằng thần học thay vì phân xử cách hiểu.
- issue: Ý nghĩa của τὰ τῶν ἀνθρώπων
  choice: Dịch là “những điều thuộc về loài người”.
  alternative: “những điều thuộc về đàn ông” hoặc “mối quan tâm của con người”.
  rationale: Trong văn cảnh, số nhiều ἀνθρώπων có nghĩa đại diện cho nhân loại, tương phản với Đức Chúa Trời, chứ không thiết lập một đối lập về giới tính.
- issue: Quan hệ giữa σκάνδαλον và sứ mạng của Đức Giê-su
  choice: Giữ hình ảnh Phi-e-rơ là chướng ngại khiến Đức Giê-su vấp ngã.
  alternative: Diễn giải thành Phi-e-rơ cản trở thập tự giá hoặc cám dỗ Đức Giê-su từ bỏ sứ mạng.
  rationale: Các cách diễn giải ấy có cơ sở trong văn cảnh rộng hơn nhưng cụ thể hơn lời Hy Lạp của câu này; bản dịch không đưa phần giải nghĩa vào chính văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Giê-su”, “Phi-e-rơ”, “Đức Chúa Trời” và đại từ “ta/con” để thể hiện lời quở trách trực tiếp trong quan hệ thầy-trò. Không đặt chú thích vì các sắc thái chính có thể được truyền đạt rõ trong chính văn; do đó không có ký hiệu chú thích cần chèn.
