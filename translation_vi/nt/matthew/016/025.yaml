id: MAT.16.25
reference: Matthew 16:25
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὃς γὰρ ⸀ἐὰν θέλῃ τὴν ψυχὴν αὐτοῦ σῶσαι ἀπολέσει αὐτήν· ὃς δ’ ἂν ἀπολέσῃ τὴν ψυχὴν αὐτοῦ ἕνεκεν ἐμοῦ εὑρήσει αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/025.yaml
  text: For whoever wants to save his life will lose it[a], but whoever loses his life for my sake will find it.
translation:
  language: vi
  text: Vì ai muốn cứu mạng sống mình[a] thì sẽ mất mạng sống ấy; còn ai vì tôi mà mất mạng sống mình thì sẽ tìm thấy mạng sống ấy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hy Lạp psychē, xuyên suốt câu này, cũng có thể được dịch là “sự sống”, “bản thân” hoặc “linh hồn”, tùy ngữ cảnh.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς γὰρ ἐὰν / ὃς δ’ ἂν
  choice: Vì ai ...; còn ai
  rationale: Cấu trúc quan hệ bất định diễn tả điều kiện tổng quát. “Ai” tự nhiên trong tiếng Việt; “Vì” giữ liên kết giải thích của γάρ với câu trước, còn “còn” làm rõ sự tương phản do δέ.
- source_word: θέλῃ
  choice: muốn
  rationale: Diễn đạt trực tiếp ý muốn hay chủ ý của θέλω bằng tiếng Việt hiện đại.
- source_word: ψυχὴν
  choice: mạng sống
  rationale: Trong nghịch lý này, ψυχή chỉ sự sống của một người, điều có thể được cứu, mất và tìm lại. “Mạng sống” phù hợp ngữ cảnh đối diện cái chết, đồng thời chú thích bảo lưu các nghĩa rộng hơn.
- source_word: σῶσαι
  choice: cứu
  rationale: Giữ nghĩa thông dụng của σῴζω và sự đối lập trực tiếp với “mất”.
- source_word: ἀπολέσει / ἀπολέσῃ
  choice: sẽ mất / mất
  rationale: ἀπόλλυμι ở đây mang nghĩa mất mạng sống. Thì tương lai được giữ ở vế đầu; thức giả định trong mệnh đề điều kiện tổng quát ở vế sau được diễn đạt tự nhiên bằng “ai ... mất”.
- source_word: ἕνεκεν ἐμοῦ
  choice: vì tôi
  rationale: Diễn đạt nguyên nhân hoặc động cơ gắn với chính Đức Giê-su, ngắn gọn và tự nhiên.
- source_word: εὑρήσει
  choice: sẽ tìm lại được
  rationale: “Tìm lại được” thể hiện εὑρίσκω và làm rõ rằng đối tượng từng bị mất nay được tìm thấy, phù hợp cách diễn đạt tiếng Việt mà không đổi nghịch lý của câu.
- source_word: αὐτοῦ / αὐτήν
  choice: mình / nó
  rationale: Đại từ phản thân “mình” phù hợp chủ ngữ phiếm chỉ “ai”; “nó” quy chiếu rõ về “mạng sống” và không áp đặt giới tính.
theological_decisions:
- issue: Cách dịch ψυχή trong nghịch lý về việc theo Đức Giê-su
  choice: mạng sống
  alternative: sự sống; linh hồn; bản thân
  rationale: Ngữ cảnh nói đến việc theo Đức Giê-su dù phải đối diện cái chết, nên “mạng sống” giữ được nghịch lý cứu–mất–tìm. Tuy nhiên, ψυχή có trường nghĩa rộng hơn, vì vậy các khả năng “sự sống”, “bản thân” và cách dịch truyền thống “linh hồn” được ghi trong chú thích thay vì bị loại bỏ.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “tôi” theo lời trực tiếp của Đức Giê-su; cấu trúc hai vế cân đối giữ sắc thái nghịch lý của nguyên văn.
