- from: Vì ai muốn cứu mạng sống mình thì sẽ mất nó[a]; còn ai vì tôi mà mất mạng sống mình thì sẽ tìm lại được.
  to: Vì ai muốn cứu mạng sống mình[a] thì sẽ mất mạng sống ấy; còn ai vì tôi mà mất mạng sống mình thì sẽ tìm thấy mạng sống ấy.
  rationale: Bản sửa loại bỏ ý bổ sung “lại” để phản ánh sát εὑρήσει, và thay đại từ “nó” bằng “mạng sống ấy” cho tự nhiên, rõ nghĩa hơn. Vẫn bảo toàn cách dịch ψυχή là “mạng sống” và chú thích về các nghĩa từ vựng khác.
