  naturalness: “Mất nó” có thể hiểu được nhưng hơi gượng khi quy chiếu đến “mạng sống”. Lặp lại “mạng sống ấy” tạo sự rõ ràng và trang trọng vừa phải, phù hợp văn phong Kinh Thánh hiện đại.
  terminology: “Mạng sống” là lựa chọn phù hợp cho ψυχή trong ngữ cảnh này. Chú thích cần giữ các khả năng “sự sống”, “bản thân”, và “linh hồn”, đồng thời nói rõ chúng áp dụng xuyên suốt câu.
