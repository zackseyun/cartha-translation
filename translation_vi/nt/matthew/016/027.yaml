id: MAT.16.27
reference: Matthew 16:27
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: μέλλει γὰρ ὁ υἱὸς τοῦ ἀνθρώπου ἔρχεσθαι ἐν τῇ δόξῃ τοῦ πατρὸς αὐτοῦ μετὰ τῶν ἀγγέλων αὐτοῦ, καὶ τότε ἀποδώσει ἑκάστῳ κατὰ τὴν πρᾶξιν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/027.yaml
  text: For the Son of Man is about to come in the glory of his Father with his angels[b][a], and then he will repay each one according to his deed.
translation:
  language: vi
  text: Vì Con Người sắp đến[a] trong vinh quang của Cha mình, cùng với các thiên sứ của Người; bấy giờ, Người sẽ báo trả mỗi người tùy theo việc làm của người ấy.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “sẽ đến” hoặc “định đến”. Tiếng Hy Lạp nói “sắp đến”, giữ sắc thái cận kề.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “tùy theo điều người ấy đã làm”. Tiếng Hy Lạp dùng danh từ số ít “việc làm/hành động” theo nghĩa phân phối, chỉ cách hành xử của từng người.
    reason: lexical_alternative
lexical_decisions:
- source_word: μέλλει
  choice: sắp
  rationale: Kết hợp với động từ nguyên mẫu, μέλλει diễn tả hành động sắp xảy ra hoặc đang đến gần; “sắp” giữ được sắc thái cận kề thay vì làm phẳng thành thì tương lai đơn thuần.
- source_word: γὰρ
  choice: Vì
  rationale: γάρ nêu lý do cho lời khẳng định ngay trước đó; “Vì” là từ nối ngắn gọn và tự nhiên trong tiếng Việt.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Con Người
  rationale: Cách dịch truyền thống và sát cấu trúc của tước hiệu này, đồng thời giữ liên hệ liên văn bản với hình ảnh trong sách Đa-ni-ên.
- source_word: ἔρχεσθαι
  choice: đến
  rationale: Động từ nguyên mẫu bổ nghĩa cho μέλλει; “đến” là cách diễn đạt trực tiếp, tự nhiên và giữ nguyên ý nghĩa cánh chung.
- source_word: ἐν τῇ δόξῃ τοῦ πατρὸς αὐτοῦ
  choice: trong vinh quang của Cha mình
  rationale: “Trong” phản ánh ἐν và diễn tả phạm vi hoặc sự biểu lộ vinh quang khi Con Người đến; “Cha mình” giữ quan hệ sở hữu hướng về chủ thể là Con Người.
- source_word: μετὰ τῶν ἀγγέλων αὐτοῦ
  choice: cùng với các thiên sứ của Người
  rationale: μετά với sở hữu cách chỉ sự đồng hành; bản dịch giữ rõ rằng các thiên sứ đi cùng và thuộc về Con Người.
- source_word: καὶ τότε
  choice: bấy giờ
  rationale: '“Bấy giờ” diễn tả rõ trình tự thời gian: sau khi Con Người đến thì việc báo trả diễn ra; dấu chấm phẩy bảo toàn sự liên kết giữa hai vế.'
- source_word: ἀποδώσει
  choice: sẽ báo trả
  rationale: Trong bối cảnh phán xét, ἀποδίδωμι mang nghĩa trả cho người ta điều tương xứng hoặc phải nhận. “Báo trả” giữ sắc thái xét xử mà không giới hạn kết quả vào thưởng hay phạt.
- source_word: ἑκάστῳ
  choice: mỗi người
  rationale: Dạng số ít mang tính phân phối, nhấn mạnh việc từng cá nhân đều nhận sự báo trả.
- source_word: κατὰ τὴν πρᾶξιν αὐτοῦ
  choice: tùy theo việc làm của người ấy
  rationale: “Việc làm” phản ánh danh từ số ít πρᾶξις, còn “của người ấy” làm rõ rằng hành vi được xét là của từng người tương ứng.
theological_decisions:
- issue: Sắc thái cận kề của μέλλει đối với việc Con Người đến
  choice: Giữ sắc thái cận kề bằng “sắp đến”.
  alternative: “sẽ đến” hoặc “định đến”
  rationale: Cấu trúc μέλλω với động từ nguyên mẫu thường thêm ý hành động đang đến gần. Bản dịch giữ nguyên sức căng về thời điểm thay vì giải quyết tranh luận cánh chung bằng một cách diễn đạt yếu hơn.
- issue: Sự phán xét tùy theo việc làm
  choice: Dịch là “sẽ báo trả mỗi người tùy theo việc làm của người ấy”.
  alternative: “sẽ thưởng phạt mỗi người tùy theo những gì họ đã làm”
  rationale: Nguyên văn khẳng định sự báo trả cá nhân nhưng không dùng hai động từ riêng cho thưởng và phạt. “Báo trả” bảo toàn tính bao quát và sắc thái xét xử, không đưa thêm một hệ thống thần học vào câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Con Người” và “thiên sứ” giữ thuật ngữ Kinh Thánh quen thuộc; đại từ “Người” được viết hoa để quy chiếu rõ về Con Người mà không dùng lối văn quá cổ. Dấu chấm phẩy giúp câu dài vẫn sáng nghĩa.
