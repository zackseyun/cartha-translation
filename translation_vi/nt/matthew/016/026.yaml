review_pass:
  verdict: revise
  source_fidelity: Bản dịch truyền đạt đúng cấu trúc câu hỏi tu từ, điều kiện ἐὰν, sự đối lập giữa được cả thế gian và mất ψυχή, cùng hình ảnh trao đổi của ἀντάλλαγμα. “Mạng sống” là lựa chọn chính văn khả dĩ cho ψυχή và được dùng nhất quán.
  naturalness: Câu đầu tự nhiên trong tiếng Việt hiện đại. Tuy nhiên, “lấy gì đổi lại mạng sống mình” có thể gợi ý việc lấy lại điều đã mất hơn là đưa một vật làm giá trao đổi. “Lấy gì để đổi lấy” diễn đạt rõ hơn quan hệ ἀντάλλαγμα mà vẫn tự nhiên.
  terminology: Giữ “thế gian” cho κόσμος và “mạng sống” cho ψυχή là phù hợp ngữ cảnh. Chú thích cần bảo lưu “linh hồn” như một phương án từ vựng, không biến nó thành cách giải thích bắt buộc.
  issues:
  - severity: low
    issue: Cụm “đổi lại mạng sống mình” hơi mơ hồ.
    rationale: “Đổi lại” trong tiếng Việt có thể được hiểu là nhận lại hoặc đền bù, trong khi ἀντάλλαγμα nhấn mạnh điều được đưa ra để đổi lấy. Thêm “để đổi lấy” làm rõ phép trao đổi mà không thu hẹp nghĩa.
  - severity: low
    issue: Cách dẫn chú thích “ở cả hai chỗ có cụm...” chưa thật gọn tự nhiên.
    rationale: Nên nói “ở cả hai lần xuất hiện” để xác định rõ hai lần ψυχή xuất hiện trong câu.
