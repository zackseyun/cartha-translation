source:
  edition: SBLGNT
  text: τί γὰρ ⸀ὠφεληθήσεται ἄνθρωπος ἐὰν τὸν κόσμον ὅλον κερδήσῃ τὴν δὲ ψυχὴν αὐτοῦ ζημιωθῇ; ἢ τί δώσει ἄνθρωπος ἀντάλλαγμα τῆς ψυχῆς αὐτοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/026.yaml
  text: For what will it profit a man if he gains the whole world but forfeits his life? Or what will a man give in exchange for his life?[a]
translation:
  language: vi
  text: Vì nếu một người có được cả thế gian mà mất mạng sống của mình, thì có ích gì? Hay người ấy sẽ lấy gì để đổi lấy mạng sống của mình?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch “linh hồn của mình” ở cả hai lần xuất hiện của “mạng sống của mình”. Từ Hy Lạp ψυχή có thể có nghĩa là “mạng sống”, “bản thân” hoặc “linh hồn”, tùy ngữ cảnh.
    reason: lexical_alternative
lexical_decisions:
- source_word: τί γὰρ ὠφεληθήσεται ἄνθρωπος
  choice: Vì ... thì có ích gì?
  rationale: Giữ lực giải thích của γάρ và câu hỏi tu từ của τί; cách diễn đạt này tự nhiên trong tiếng Việt, còn ý thụ hưởng lợi ích của thể bị động ὠφεληθήσεται được truyền đạt bằng “có ích gì”.
- source_word: ἄνθρωπος
  choice: một người / người ấy
  rationale: ἄνθρωπος ở đây chỉ con người nói chung; “một người” diễn đạt tự nhiên và bao quát trong tiếng Việt hiện đại.
- source_word: τὸν κόσμον ὅλον κερδήσῃ
  choice: được cả thế gian
  rationale: “Được” truyền đạt κερδαίνω trong thế đối lập được–mất, còn “cả thế gian” giữ trọn ý toàn thể của ὅλον.
- source_word: τὴν ... ψυχὴν αὐτοῦ ζημιωθῇ
  choice: mất mạng sống mình
  rationale: ζημιόω chỉ việc chịu mất hay bị thiệt mất; “mất” rõ và tự nhiên. Trong ngữ cảnh này ψυχή có thể chỉ mạng sống, bản thân hoặc linh hồn; “mạng sống” được chọn cho chính văn, đồng thời bảo lưu phương án “linh hồn” trong chú thích.
- source_word: ἀντάλλαγμα τῆς ψυχῆς αὐτοῦ
  choice: lấy gì đổi lại mạng sống mình
  rationale: “Đổi lại” giữ hình ảnh trao đổi của ἀντάλλαγμα và tạo câu hỏi tu từ tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Cách dịch ψυχή trong lời dạy về sự mất mát tối hậu
  choice: mạng sống
  alternative: linh hồn; bản thân
  rationale: Ngữ cảnh không buộc phải giới hạn ψυχή vào một thành phần phi vật chất tách biệt của con người. “Mạng sống” giữ nghĩa rộng về sự sống và chính con người, trong khi chú thích bảo lưu “linh hồn” là cách hiểu truyền thống và khả dĩ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cấu trúc câu hỏi tu từ được sắp xếp theo cú pháp tiếng Việt tự nhiên; hai lần xuất hiện của ψυχή được dịch nhất quán.
