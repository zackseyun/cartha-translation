revisions:
- from: Vì nếu một người được cả thế gian mà mất mạng sống mình, thì có ích gì? Hay người ấy sẽ lấy gì đổi lại mạng sống mình?[a]
  to: Vì nếu một người có được cả thế gian mà mất mạng sống của mình, thì có ích gì? Hay người ấy sẽ lấy gì để đổi lấy mạng sống của mình?[a]
  rationale: Chỉnh nhẹ cụm từ về sự trao đổi để phản ánh minh bạch hơn ἀντάλλαγμα (“điều được đưa ra để đổi lấy”), đồng thời làm mượt cách diễn đạt của chú thích. Không thay đổi nghĩa, sắc thái tu từ, hoặc tính mơ hồ có chủ ý của ψυχή.
  reviewer_model: gpt-5.6-terra
