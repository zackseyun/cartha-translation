  text: οὔπω νοεῖτε, οὐδὲ μνημονεύετε τοὺς πέντε ἄρτους τῶν πεντακισχιλίων καὶ πόσους κοφίνους ἐλάβετε;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/009.yaml
  text: Do you still not understand[a], nor do you remember the five loaves for the five thousand[b], and how many baskets you gathered?
translation:
  language: vi
  text: Anh em vẫn chưa hiểu và cũng không nhớ năm chiếc bánh cho năm nghìn người, cùng với bao nhiêu giỏ anh em đã thu được, sao?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὔπω
  choice: vẫn chưa
  rationale: 'Diễn đạt tự nhiên sắc thái thời gian của lời quở trách: đến lúc này mà vẫn chưa hiểu.'
- source_word: νοεῖτε
  choice: hiểu
  rationale: Chỉ sự lĩnh hội ý nghĩa của những sự việc trước đó, không chỉ là nhận biết bằng giác quan.
- source_word: οὐδὲ
  choice: không ... sao
  rationale: Nối câu hỏi phủ định thứ hai với câu thứ nhất theo cách tự nhiên trong tiếng Việt, đồng thời giữ lực tu từ.
- source_word: μνημονεύετε
  choice: nhớ
  rationale: Diễn đạt trực tiếp việc nhớ lại phép lạ trước đó.
- source_word: τοὺς πέντε ἄρτους
  choice: năm chiếc bánh
  rationale: Trong bối cảnh này, ἄρτοι là các ổ hoặc chiếc bánh dùng làm thức ăn; “chiếc bánh” tự nhiên và dễ hiểu trong tiếng Việt.
- source_word: τῶν πεντακισχιλίων
  choice: cho năm ngàn người
  rationale: 'Làm rõ quan hệ theo ngữ cảnh: năm chiếc bánh được dùng trong việc cho năm ngàn người ăn.'
- source_word: πόσους κοφίνους
  choice: bao nhiêu giỏ
  rationale: Giữ hình ảnh cụ thể và câu hỏi về số giỏ đồ thừa.
- source_word: ἐλάβετε
  choice: đã thu được
  rationale: Trong trình thuật cho ăn, động từ nói đến việc thu lấy đồ thừa vào các giỏ; cách dịch này tự nhiên mà không thêm chi tiết không có trong câu.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “anh em” để thể hiện lời Đức Giê-su nói với nhóm môn đồ; cấu trúc hai câu hỏi liên tiếp giữ sắc thái quở trách của nguyên văn.
