id: MAT.16.10
reference: Matthew 16:10
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οὐδὲ τοὺς ἑπτὰ ἄρτους τῶν τετρακισχιλίων καὶ πόσας σπυρίδας ἐλάβετε;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/010.yaml
  text: Or the seven loaves for the four thousand[a], and how many large baskets you picked up?
translation:
  language: vi
  text: Hay bảy ổ bánh cho bốn ngàn người, và các con đã thu lại được bao nhiêu giỏ lớn?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐδὲ
  choice: Hay
  rationale: Trong chuỗi câu hỏi tu từ tiếp nối từ câu trước, “Hay” diễn đạt tự nhiên chức năng liên kết của οὐδὲ trong tiếng Việt; nếu tách riêng theo sát hình thức, cũng có thể hiểu là “Cũng không nhớ… sao?”
- source_word: τοὺς ἑπτὰ ἄρτους
  choice: bảy ổ bánh
  rationale: ἄρτος trong trình thuật hóa bánh chỉ các ổ bánh; “ổ bánh” là cách nói cụ thể, tự nhiên trong tiếng Việt.
- source_word: τῶν τετρακισχιλίων
  choice: cho bốn ngàn người
  rationale: Dạng sở hữu cách liên hệ số bánh với sự kiện cho bốn ngàn người ăn; thêm “người” làm rõ danh từ được tỉnh lược mà không thay đổi ý nghĩa.
- source_word: πόσας σπυρίδας
  choice: bao nhiêu giỏ lớn
  rationale: πόσας là từ nghi vấn “bao nhiêu”; σπυρίς chỉ loại giỏ lớn, nên “giỏ lớn” vừa tự nhiên vừa giữ sự phân biệt với κόφινος ở trình thuật khác.
- source_word: ἐλάβετε
  choice: các con đã thu lại được
  rationale: Trong ngữ cảnh gom phần bánh thừa, “thu lại được” diễn đạt đúng hành động và kết quả; đại từ “các con” thể hiện lời Đức Giê-su nói trực tiếp với các môn đồ.
theological_decisions: []
translation_notes:
  register: Bản dịch dùng tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Câu được giữ như một phần tiếp nối của chuỗi câu hỏi ở văn cảnh trước; không thêm “còn thừa” vì cụm ấy không hiện diện trực tiếp trong câu Hy Lạp này.
