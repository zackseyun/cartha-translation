id: MAT.16.24
reference: Matthew 16:24
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Τότε ὁ Ἰησοῦς εἶπεν τοῖς μαθηταῖς αὐτοῦ· Εἴ τις θέλει ὀπίσω μου ἐλθεῖν, ἀπαρνησάσθω ἑαυτὸν καὶ ἀράτω τὸν σταυρὸν αὐτοῦ καὶ ἀκολουθείτω μοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/024.yaml
  text: Then Jesus said to his disciples[a], “If anyone wants to come after me, let him deny himself and take up his cross and follow me.”
translation:
  language: vi
  text: 'Bấy giờ, Đức Giê-su nói với các môn đồ của mình: “Nếu ai muốn đi theo sau tôi, người ấy hãy từ bỏ chính mình, vác thập tự giá của mình và theo tôi.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τότε
  choice: Bấy giờ
  rationale: Dấu nối diễn tiến thời gian trong lời thuật; “Bấy giờ” tự nhiên, trang trọng và không diễn giải quá mức.
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: với các môn đồ của mình
  rationale: “Môn đồ” giữ được quan hệ thầy-trò và người đi theo trong bối cảnh Phúc Âm; “của mình” quy chiếu tự nhiên về Đức Giê-su.
- source_word: Εἴ τις θέλει
  choice: Nếu ai muốn
  rationale: Giữ nguyên điều kiện và ý muốn của một người bất kỳ; tiếng Việt diễn đạt tự nhiên phạm vi phổ quát mà không cần đánh dấu giống.
- source_word: ὀπίσω μου ἐλθεῖν
  choice: đi theo sau tôi
  rationale: Giữ hình ảnh bước đi phía sau Đức Giê-su, đồng thời không đồng nhất hoàn toàn cụm này với động từ ἀκολουθέω ở cuối câu.
- source_word: ἀπαρνησάσθω ἑαυτὸν
  choice: người ấy hãy từ bỏ chính mình
  rationale: “Từ bỏ chính mình” truyền đạt hành động dứt khoát không lấy bản thân làm trung tâm; “hãy” thể hiện mệnh lệnh ngôi thứ ba một cách tự nhiên trong tiếng Việt.
- source_word: ἀράτω τὸν σταυρὸν αὐτοῦ
  choice: vác thập tự giá của mình
  rationale: “Vác” kết hợp tự nhiên với “thập tự giá” và bao hàm việc nhấc lên để mang; sở hữu từ được giữ lại nhằm thể hiện cái giá mang tính cá nhân.
- source_word: ἀκολουθείτω μοι
  choice: theo tôi
  rationale: Mệnh lệnh hiện tại có sắc thái tiếp diễn, nhưng “theo tôi” trong ngữ cảnh môn đồ đã tự nhiên hàm ý một lối sống liên tục.
theological_decisions:
- issue: Các hình thức số ít giống đực mang nghĩa đại diện trong tiếng Hy Lạp
  choice: Dùng “nếu ai… người ấy… chính mình… của mình”
  alternative: Dùng đại từ mang giới tính như “người đó… chính anh ta”
  rationale: Tiếng Việt không bắt buộc đánh dấu giống ở các đại từ này. Cách chọn giữ số ít và phạm vi áp dụng cho bất cứ ai, đồng thời không đưa vào văn bản một sự giới hạn về giới tính vốn không thuộc ý nghĩa của câu.
- issue: Ý nghĩa của việc mang thập tự giá
  choice: Giữ nguyên hình ảnh “vác thập tự giá của mình”
  alternative: Diễn giải thành “chịu đau khổ” hoặc “chấp nhận hy sinh”
  rationale: Hình ảnh thập tự giá có sức căng lịch sử và thần học riêng; không nên thu hẹp nó thành một lời giải thích duy nhất.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “Đức Giê-su” theo lối gọi kính trọng phổ biến; động từ dẫn lời là “nói” để giữ tính trung hòa của εἶπεν. Không cần chú thích về giống ngữ pháp vì tiếng Việt diễn đạt tự nhiên bằng đại từ không đánh dấu giới.
