  text: καὶ προσλαβόμενος αὐτὸν ὁ Πέτρος ἤρξατο ἐπιτιμᾶν αὐτῷ λέγων· Ἵλεώς σοι, κύριε· οὐ μὴ ἔσται σοι τοῦτο.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/022.yaml
  text: And Peter took him aside and began to rebuke him[a], saying, “Far be it from you, Lord; this will certainly not happen to you.”
translation:
  language: vi
  text: 'Phi-e-rơ đưa Ngài ra riêng rồi bắt đầu quở trách Ngài, nói: “Lạy Chúa, xin cho điều này tránh xa Ngài![a] Điều này chắc chắn sẽ không xảy đến với Ngài đâu.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cụm từ Hy Lạp này là một thành ngữ tỉnh lược; cũng có thể dịch: “Xin Đức Chúa Trời thương xót Ngài, lạy Chúa!” hoặc “Lạy Chúa, không thể nào như vậy được!”'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσλαβόμενος
  choice: kéo Ngài sang một bên
  rationale: Động tính từ trung cách trong ngữ cảnh này cho thấy Phi-e-rơ kéo Đức Giê-su riêng ra để nói, chứ không chỉ đơn thuần là đón nhận hay nắm lấy Ngài.
- source_word: ἤρξατο ἐπιτιμᾶν
  choice: bắt đầu quở trách
  rationale: Kết cấu ἄρχομαι với động từ nguyên mẫu diễn tả sự khởi đầu; ἐπιτιμάω mang nghĩa quở trách hoặc khiển trách nghiêm khắc.
- source_word: Ἵλεώς σοι
  choice: mong điều ấy tránh xa Ngài
  rationale: Đây là một thành ngữ tỉnh lược, theo nghĩa đen liên quan đến sự thương xót hoặc ưu ái dành cho người được nói đến. Cách dịch này diễn đạt lời phản đối mạnh của Phi-e-rơ mà không đưa Đức Chúa Trời thành chủ ngữ minh nhiên khi bản Hy Lạp không nêu chủ ngữ.
- source_word: κύριε
  choice: Lạy Chúa
  rationale: Giữ nghĩa thông thường của κύριος, đồng thời diễn đạt tự nhiên lời xưng hô trực tiếp đầy kính trọng trong tiếng Việt.
- source_word: οὐ μὴ ἔσται σοι τοῦτο
  choice: Điều này chắc chắn sẽ không xảy đến với Ngài đâu
  rationale: οὐ μή đi với thì tương lai là lối phủ định nhấn mạnh; “chắc chắn sẽ không” truyền đạt rõ sức mạnh ấy trong tiếng Việt hiện đại.
theological_decisions:
- issue: Diễn đạt lời phản đối của Phi-e-rơ mà không thêm nội dung thần học ngoài bản văn
  choice: Lạy Chúa, mong điều ấy tránh xa Ngài!
  alternative: Xin Đức Chúa Trời thương xót Ngài, lạy Chúa!; Lạy Chúa, không thể nào như vậy được!
  rationale: Ἵλεώς σοι là một thành ngữ khó và tỉnh lược. Bản dịch chính giữ sắc thái cầu mong tai họa tránh xa Đức Giê-su nhưng không thêm “Đức Chúa Trời,” vốn chỉ là chủ ngữ được suy ra. Chú thích bảo lưu những cách hiểu chính khác.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Ngài” duy trì cách xưng hô kính trọng dành cho Đức Giê-su; “đâu” làm câu phủ định nhấn mạnh tự nhiên trong tiếng Việt mà không giảm tính trang nghiêm.
