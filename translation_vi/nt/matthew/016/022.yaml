revisions:
- from: 'Phi-e-rơ kéo Ngài sang một bên rồi bắt đầu quở trách Ngài: “Lạy Chúa, mong điều ấy tránh xa Ngài![a] Điều này chắc chắn sẽ không xảy đến với Ngài đâu.”'
  to: 'Phi-e-rơ đưa Ngài ra riêng rồi bắt đầu quở trách Ngài, nói: “Lạy Chúa, xin cho điều này tránh xa Ngài![a] Điều này chắc chắn sẽ không xảy đến với Ngài đâu.”'
  rationale: Sửa «kéo ... sang một bên» thành «đưa ... ra riêng» để tránh thêm sắc thái cưỡng bách, và sửa lời thành ngữ thành «xin cho điều này tránh xa Ngài» cho tự nhiên hơn. Bản chính không thêm «Đức Chúa Trời», còn chú thích bảo lưu cách giải nghĩa này và phương án diễn đạt lời phản đối.
