revisions:
- from: Bấy giờ, Đức Chúa Jêsus nghiêm cấm các môn đồ không được nói với bất cứ ai rằng Ngài là Đấng Mê-si-a.[a]
  to: Bấy giờ, Người nghiêm cấm các môn đồ nói với bất cứ ai rằng Người là Đấng Mê-si-a.[a]
  rationale: Sửa cấu trúc mệnh lệnh để tiếng Việt chỉ rõ rằng các môn đồ bị cấm nói, tương ứng trực tiếp với mệnh đề ἵνα μηδενὶ εἴπωσιν. Thay danh hiệu được thêm bằng đại từ hồi chỉ trang trọng để sát câu nguồn hơn. Giữ nguyên tước hiệu Mê-si-a và chú thích phương án “Đấng Christ”.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T05:40:19Z'
review_pass:
  verdict: revise
  source_fidelity: Bản nháp truyền đạt đúng trình tự của τότε, sắc thái mạnh của διεστείλατο, đối tượng là các môn đồ, và nội dung mệnh lệnh không được nói với bất cứ ai rằng Người là Đấng Mê-si-a. Tuy nhiên, cấu trúc “nghiêm cấm các môn đồ không được nói” tạo ra khả năng đọc như một phủ định chồng phủ định trong tiếng Việt; cần sửa để mệnh lệnh cấm được rõ ràng.
  naturalness: “Bấy giờ” và “Đấng Mê-si-a” phù hợp văn phong Kinh Thánh hiện đại. Dùng “Người” cho chủ ngữ và đại từ hồi chỉ giữ lối xưng hô trang trọng mà không thêm danh hiệu không có trong câu Hy Lạp. “Nghiêm cấm ... nói” là cấu trúc tự nhiên, rõ nghĩa hơn.
  terminology: “Các môn đồ” và “Đấng Mê-si-a” phù hợp. Chú thích bảo lưu cách gọi truyền thống “Đấng Christ” và giải thích Χριστός là tước hiệu; điều này tương hợp với vết kiểm tra tiếng Anh.
  issues:
  - severity: medium
    issue: Cấu trúc phủ định sau “nghiêm cấm”
    rationale: “Nghiêm cấm các môn đồ không được nói” có thể bị hiểu theo cấu trúc “cấm ... không được ...”, gây mơ hồ về hướng của lệnh. Hy Lạp ἵνα μηδενὶ εἴπωσιν rõ ràng cấm hành vi nói với bất cứ ai. Bỏ “không được” sau “nghiêm cấm” giải quyết lỗi này mà không đổi nghĩa.
  - severity: low
    issue: Danh hiệu “Đức Chúa” được thêm vào chủ ngữ
    rationale: Câu Hy Lạp chỉ hàm ẩn chủ ngữ từ ngữ cảnh, không dùng danh hiệu nào ở đây. Dùng “Người” giữ được hồi chỉ tự nhiên và tránh thêm một danh hiệu ngoài văn bản nguồn.
