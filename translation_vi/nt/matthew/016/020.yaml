  text: τότε ⸀διεστείλατο τοῖς ⸀μαθηταῖς ἵνα μηδενὶ εἴπωσιν ὅτι αὐτός ⸀ἐστιν ὁ χριστός.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/020.yaml
  text: Then he strictly instructed the disciples to tell no one that he is the Messiah[a].
translation:
  language: vi
  text: Bấy giờ, Người nghiêm cấm các môn đồ nói với bất cứ ai rằng Người là Đấng Mê-si-a.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “Đấng Christ.” Từ Hy Lạp Χριστός là một tước hiệu, nghĩa là “Đấng được xức dầu.”
    reason: Nêu cách dịch truyền thống và làm rõ ý nghĩa của tước hiệu Hy Lạp.
lexical_decisions:
- source_word: τότε
  choice: Bấy giờ
  rationale: Đánh dấu bước tiếp theo trong mạch kể; cách diễn đạt ngắn gọn, tự nhiên và trang trọng trong tiếng Việt.
- source_word: διεστείλατο
  choice: nghiêm cấm
  rationale: Động từ trung cách diễn tả một chỉ thị mạnh. Trong ngữ cảnh mệnh đề phủ định theo sau, “nghiêm cấm” truyền đạt rõ lực của lệnh mà không hàm ý nguy hiểm như “cảnh cáo”.
- source_word: τοῖς μαθηταῖς
  choice: các môn đồ
  rationale: Danh từ số nhiều có mạo từ chỉ nhóm môn đồ đã được xác định trong ngữ cảnh; không cần thêm “của Ngài”.
- source_word: ἵνα μηδενὶ εἴπωσιν
  choice: không được nói với bất cứ ai
  rationale: ἵνα với động từ giả định nêu nội dung của lệnh; cách dịch này thể hiện trực tiếp lệnh cấm và giữ phạm vi tuyệt đối của μηδενί.
- source_word: ὅτι
  choice: rằng
  rationale: Dẫn vào nội dung điều các môn đồ không được nói.
- source_word: αὐτός ἐστιν
  choice: Ngài là
  rationale: Diễn đạt phép khẳng định đơn giản; đại từ αὐτός không nhất thiết mang nghĩa nhấn mạnh “chính Ngài” tại đây.
- source_word: ὁ χριστός
  choice: Đấng Mê-si-a
  rationale: Χριστός ở đây là tước hiệu chỉ vị vua được xức dầu mà dân trông đợi. “Đấng Mê-si-a” bảo tồn ý nghĩa tước hiệu thay vì biến nó thành tên riêng.
theological_decisions:
- issue: Cách dịch tước hiệu Χριστός
  choice: Đấng Mê-si-a
  alternative: Đấng Christ
  rationale: Trong ngữ cảnh này, Χριστός là tước hiệu tương ứng với “Mê-si-a”, không phải một tên riêng. Bản dịch chính làm rõ nội dung cứu thế của tước hiệu; chú thích giữ cách gọi quen thuộc “Đấng Christ” như phương án tương đương.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Chúa Jêsus” để xác định chủ thể được lược trong tiếng Hy Lạp nhưng rõ từ ngữ cảnh; dùng “Ngài” theo lối xưng hô kính trọng quen thuộc trong văn bản Kinh Thánh tiếng Việt. Dấu chú thích [a] xuất hiện ngay sau tước hiệu liên quan.
