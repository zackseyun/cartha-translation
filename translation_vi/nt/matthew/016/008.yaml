id: MAT.16.8
reference: Matthew 16:8
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: γνοὺς δὲ ὁ Ἰησοῦς ⸀εἶπεν· Τί διαλογίζεσθε ἐν ἑαυτοῖς, ὀλιγόπιστοι, ὅτι ἄρτους οὐκ ⸀ἐλάβετε;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/008.yaml
  text: But Jesus[a], knowing this, said, “Why are you discussing among yourselves, you of little faith, that you have no bread?”
translation:
  language: vi
  text: 'Nhưng Đức Giê-su biết điều đó và nói: “Hỡi những người ít đức tin, sao anh em lại bàn luận với nhau về việc anh em không mang bánh theo[a]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát hơn: “anh em đã không lấy các ổ bánh.” Trong ngữ cảnh, cụm này chỉ việc không mang bánh theo.'
    reason: Nêu cách diễn đạt sát của ἄρτους οὐκ ἐλάβετε, đồng thời giải thích cách dịch theo ngữ cảnh hành trình.
lexical_decisions:
- source_word: γνοὺς
  choice: biết được điều ấy
  rationale: Phân từ bất định quá khứ của γινώσκω diễn tả việc Đức Giê-su nhận biết cuộc bàn luận trước khi lên tiếng; “điều ấy” được bổ sung tự nhiên từ ngữ cảnh vì tiếng Hy Lạp không nêu rõ tân ngữ.
- source_word: δὲ
  choice: Nhưng
  rationale: 'Diễn tả bước chuyển có sắc thái tương phản nhẹ: các môn đồ đang bàn luận, nhưng Đức Giê-su biết và đáp lại.'
- source_word: Τί διαλογίζεσθε ἐν ἑαυτοῖς
  choice: sao anh em lại bàn luận với nhau
  rationale: Τί được hiểu theo nghĩa trạng từ “tại sao/sao”; διαλογίζεσθε cùng ἐν ἑαυτοῖς chỉ sự trao đổi, suy tính giữa các môn đồ. Cách diễn đạt này tự nhiên trong tiếng Việt hiện đại.
- source_word: ὀλιγόπιστοι
  choice: hỡi những người ít đức tin
  rationale: Giữ nguyên lời quở trách trực tiếp về sự thiếu lòng tin, đồng thời không diễn giải rộng thành một kết luận giáo lý.
- source_word: ὅτι
  choice: về chuyện
  rationale: Ở đây ὅτι có thể giới thiệu nội dung họ đang bàn luận. “Về chuyện” thể hiện chức năng ấy tự nhiên hơn trong câu tiếng Việt.
- source_word: ἄρτους οὐκ ἐλάβετε
  choice: mình không mang bánh theo
  rationale: ἄρτους là số nhiều nhưng tiếng Việt dùng danh từ khối “bánh” tự nhiên; λαμβάνω theo ngữ cảnh hành trình mang nghĩa lấy hoặc mang theo. “Mình” hồi chỉ chính nhóm người đang trò chuyện.
theological_decisions:
- issue: Sức nặng của lời gọi ὀλιγόπιστοι
  choice: hỡi những người ít đức tin
  alternative: anh em thật kém tin
  rationale: Lựa chọn này giữ rõ lời quở trách về lòng tin chưa đủ của các môn đồ nhưng không biến nó thành nhận định rằng họ hoàn toàn không có đức tin.
- issue: Quan hệ của mệnh đề do ὅτι dẫn nhập
  choice: 'nội dung cuộc bàn luận: “về chuyện mình không mang bánh theo”'
  alternative: 'nguyên nhân: “vì mình không mang bánh theo”'
  rationale: Cả sắc thái nội dung và nguyên nhân đều có thể được gợi lên, nhưng cấu trúc với διαλογίζεσθε phù hợp nhất với việc ὅτι giới thiệu điều họ đang bàn đến; bản dịch tránh làm câu tiếng Việt tối nghĩa.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Đức Giê-su” theo lối gọi kính trọng phổ biến; “anh em” phù hợp lời thầy nói với nhóm môn đồ. Cụm “hỡi những người ít đức tin” hơi trang trọng có chủ ý để giữ hình thức hô cách và sức nặng của lời quở trách.
