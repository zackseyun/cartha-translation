    rationale: “Được làm cho sống lại” hiểu được nhưng không thật tự nhiên trong tiếng Việt hiện đại. “Được cho sống lại” bảo toàn sắc thái bị động/có tác nhân hàm ẩn mà không chỉ rõ tác nhân.
  - severity: low
    issue: Cụm “cho các môn đồ của mình biết” kém tự nhiên
    rationale: Sở hữu từ “của mình” sau “các môn đồ” hơi nặng. “Bày tỏ cho các môn đồ của Ngài biết” giữ rõ αὐτοῦ và có văn phong tự nhiên hơn.
  - severity: low
