revisions:
- from: Từ lúc ấy, Giê-su bắt đầu cho các môn đồ của mình biết rằng Ngài phải đi đến Giê-ru-sa-lem, chịu nhiều điều đau khổ[a] từ phía các trưởng lão, các thầy tế lễ cả và các thầy thông giáo[b], rồi bị giết, và đến ngày thứ ba được làm cho sống lại[c].
  to: Từ lúc ấy, Giê-su bắt đầu bày tỏ cho các môn đồ của Ngài biết rằng Ngài phải đi đến Giê-ru-sa-lem, chịu nhiều điều đau khổ[a] từ phía các trưởng lão, các thầy tế lễ cả và các thầy thông giáo[b], rồi bị giết, và đến ngày thứ ba được cho sống lại[c].
  rationale: Chỉnh sửa giới hạn ở những chỗ cần thiết để câu văn tự nhiên hơn trong tiếng Việt hiện đại và để giữ thể bị động của ἐγερθῆναι một cách ít gượng hơn. Bản sửa không xác định nguồn của tính tất yếu trong “phải,” không thêm tác nhân cho việc được sống lại, và không mở rộng phạm vi cú pháp của “từ phía” vượt quá điều bản Hy Lạp trực tiếp gắn với việc chịu khổ.
