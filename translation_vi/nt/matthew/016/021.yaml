id: MAT.16.21
reference: Matthew 16:21
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἀπὸ τότε ἤρξατο ⸂ὁ Ἰησοῦς⸃ δεικνύειν τοῖς μαθηταῖς αὐτοῦ ὅτι δεῖ αὐτὸν ⸂εἰς Ἱεροσόλυμα ἀπελθεῖν⸃ καὶ πολλὰ παθεῖν ἀπὸ τῶν πρεσβυτέρων καὶ ἀρχιερέων καὶ γραμματέων καὶ ἀποκτανθῆναι καὶ τῇ τρίτῃ ἡμέρᾳ ἐγερθῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/021.yaml
  text: From that time Jesus began to show his disciples that he must go to Jerusalem and suffer many things from the elders and chief priests and scribes[a], and be killed[c][b], and on the third day be raised.
translation:
  language: vi
  text: Từ lúc ấy, Giê-su bắt đầu bày tỏ cho các môn đồ của Ngài biết rằng Ngài phải đi đến Giê-ru-sa-lem, chịu nhiều điều đau khổ[a] từ phía các trưởng lão, các thầy tế lễ cả và các thầy thông giáo[b], rồi bị giết, và đến ngày thứ ba được cho sống lại[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “chịu khổ rất nhiều.” Nguyên văn nói sát nghĩa là “chịu nhiều điều,” nhấn mạnh nhiều phương diện của sự chịu khổ.'
    reason: lexical_alternative
  - marker: b
    text: “Các thầy thông giáo” là những người chuyên về Luật pháp; cũng có thể dịch là “các chuyên gia Luật pháp.” Cụm “từ phía” cũng có thể diễn đạt là “dưới tay.”
    reason: lexical_and_relational_clarification
  - marker: c
    text: 'Cũng có thể dịch: “sống lại.” Động từ Hy Lạp ở thể bị động; “được cho sống lại” giữ thể ấy mà không nêu tác nhân.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀπὸ τότε
  choice: Từ lúc ấy
  rationale: Đánh dấu một bước ngoặt trong trình thuật, đồng thời giữ rõ ý nghĩa thời gian của cụm Hy Lạp.
- source_word: ἤρξατο
  choice: bắt đầu
  rationale: Diễn đạt trực tiếp sự khởi đầu của một giai đoạn mới trong việc Giê-su dạy các môn đồ.
- source_word: δεικνύειν
  choice: cho ... biết
  rationale: Tự nhiên trong tiếng Việt và vẫn giữ nghĩa cho thấy, làm cho nhận biết; không diễn giải mạnh thành “giải thích”.
- source_word: δεῖ
  choice: phải
  rationale: Giữ nguyên sức nặng của tính tất yếu nhưng không xác định thêm nguồn gốc của sự tất yếu ấy.
- source_word: εἰς Ἱεροσόλυμα ἀπελθεῖν
  choice: đi đến Giê-ru-sa-lem
  rationale: Cách diễn đạt tự nhiên, thể hiện rõ chuyển động hướng tới địa điểm.
- source_word: πολλὰ παθεῖν
  choice: chịu nhiều điều đau khổ
  rationale: Phản ánh dạng số nhiều “nhiều điều” trong nguyên văn, gợi đến nhiều phương diện của sự chịu khổ.
- source_word: ἀπὸ τῶν πρεσβυτέρων καὶ ἀρχιερέων καὶ γραμματέων
  choice: từ phía các trưởng lão, các thầy tế lễ cả và các thầy thông giáo
  rationale: Giữ quan hệ nguồn/ tác nhân của ἀπό mà không diễn giải quá mức thành một công thức chỉ rõ tác nhân trực tiếp.
- source_word: πρεσβυτέρων
  choice: các trưởng lão
  rationale: Thuật ngữ quen thuộc và sát nghĩa dành cho nhóm lãnh đạo Do Thái trong bối cảnh này.
- source_word: ἀρχιερέων
  choice: các thầy tế lễ cả
  rationale: Chỉ giới lãnh đạo tư tế; tránh hiểu sai dạng số nhiều là có nhiều người đồng thời giữ duy nhất chức vụ thượng tế.
- source_word: γραμματέων
  choice: các thầy thông giáo
  rationale: Thuật ngữ Kinh Thánh tiếng Việt quen thuộc cho những người am hiểu và giảng dạy luật pháp; chú thích cung cấp cách nói hiện đại hơn.
- source_word: ἀποκτανθῆναι
  choice: bị giết
  rationale: Rõ ràng, trực tiếp và giữ thể bị động của động từ Hy Lạp.
- source_word: τῇ τρίτῃ ἡμέρᾳ ἐγερθῆναι
  choice: đến ngày thứ ba được làm cho sống lại
  rationale: Giữ thể bị động của nguyên văn và không nêu đích danh tác nhân vốn không được nói rõ trong câu.
theological_decisions:
- issue: Tính tất yếu trong δεῖ
  choice: Ngài phải
  alternative: Ngài cần phải; điều cần thiết là Ngài
  rationale: Nguyên văn khẳng định tính tất yếu nhưng tại đây không nói rõ đó là sắc lệnh của Đức Chúa Trời, sự ứng nghiệm Kinh Thánh hay một dạng tất yếu khác; bản dịch không tự ý giải quyết sự căng thẳng này.
- issue: Thể của ἐγερθῆναι
  choice: được làm cho sống lại
  alternative: sống lại
  rationale: Động từ Hy Lạp ở thể bị động. Cách dịch được chọn giữ nguyên thể ấy và không thêm tác nhân vào câu.
- issue: Phạm vi tác động của nhóm lãnh đạo Do Thái
  choice: Đặt “từ phía...” ngay sau việc chịu khổ
  alternative: Diễn đạt rằng cả sự chịu khổ và việc bị giết đều “dưới tay” họ
  rationale: Cấu trúc câu Hy Lạp trực tiếp gắn cụm ἀπό với việc chịu nhiều đau khổ; ngữ cảnh có thể cho thấy vai trò rộng hơn, nhưng bản chính không mở rộng cú pháp một cách quả quyết.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “Ngài” để quy chiếu kính trọng và rõ ràng đến Giê-su; giữ các thuật ngữ quen thuộc “trưởng lão,” “thầy tế lễ cả,” “thầy thông giáo,” đồng thời giải thích thuật ngữ kém trong suốt trong chú thích. Câu văn bám sát chuỗi động từ của nguyên văn nhưng thêm “rồi” để nhịp câu tiếng Việt tự nhiên hơn.
