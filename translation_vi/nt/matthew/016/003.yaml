  - severity: low
    issue: Chữ đầu câu “và” chưa viết hoa.
    rationale: Câu độc lập trong bản văn tiếng Việt hiện đại cần mở đầu bằng “Và”.
  - severity: low
    issue: Chú thích diễn giải “thuộc linh” và “với tư cách Đấng Mê-si” hơi khẳng định so với độ mở của câu.
    rationale: Câu Hy Lạp không nói trực tiếp “thuộc linh” hay gọi rõ các công việc là công việc “với tư cách Đấng Mê-si”; đây là cách đọc khả dĩ, nên cần trình bày dè dặt hơn.
