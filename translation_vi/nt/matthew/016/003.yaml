id: MAT.16.3
reference: Matthew 16:3
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ πρωΐ· Σήμερον χειμών, πυρράζει γὰρ στυγνάζων ὁ οὐρανός. ⸀τὸ μὲν πρόσωπον τοῦ οὐρανοῦ γινώσκετε διακρίνειν, τὰ δὲ σημεῖα τῶν καιρῶν οὐ δύνασθε.⸃
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/003.yaml
  text: And in the morning[a], ‘Today, stormy weather, for the sky is red and overcast.’ You know how to discern the appearance of the sky[b], but you are not able to discern the signs of the times.
translation:
  language: vi
  text: 'Và vào buổi sáng: “Hôm nay thời tiết sẽ xấu, vì bầu trời đỏ và u ám.” Các ông biết phân biệt sắc trời, nhưng lại không thể phân biệt các dấu hiệu của thời đại.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Các dấu hiệu của thời đại” có thể chỉ ý nghĩa đặc biệt của thời điểm hiện tại, kể cả các việc làm của Chúa Giê-su và ý nghĩa Mê-si của chúng.
    reason: alternative_reading
lexical_decisions:
- source_word: πρωΐ
  choice: vào buổi sáng
  rationale: Cụm trạng ngữ thời gian tự nhiên trong tiếng Việt, giữ được sự đối ứng với lời dự báo thời tiết trước đó.
- source_word: χειμών
  choice: trời sẽ có giông
  rationale: Trong ngữ cảnh dự báo thời tiết, từ này chỉ thời tiết xấu hoặc giông bão chứ không phải mùa đông; thêm “sẽ” phù hợp với tính chất dự báo của câu.
- source_word: πυρράζει
  choice: đỏ
  rationale: Diễn đạt trực tiếp màu đỏ của bầu trời mà không cường điệu sắc thái thành “đỏ rực”.
- source_word: στυγνάζων
  choice: u ám
  rationale: Giữ sắc thái tối sầm, ảm đạm hoặc đầy đe dọa của bầu trời, đồng thời tự nhiên trong tiếng Việt.
- source_word: πρόσωπον τοῦ οὐρανοῦ
  choice: sắc trời
  rationale: Thành ngữ tiếng Việt gọn và tự nhiên để chỉ diện mạo có thể quan sát của bầu trời; tránh dịch cứng là “khuôn mặt của bầu trời”.
- source_word: γινώσκετε διακρίνειν
  choice: biết phân biệt
  rationale: Giữ cả ý có kiến thức lẫn khả năng nhận định dựa trên những dấu hiệu quan sát được.
- source_word: σημεῖα
  choice: các dấu hiệu
  rationale: Cách dịch chuẩn, giữ được cả nghĩa bằng chứng có thể nhận biết lẫn ý nghĩa mặc khải trong văn mạch Ma-thi-ơ.
- source_word: καιρῶν
  choice: của thời đại
  rationale: Ở đây từ này nói đến những thời điểm hoặc hoàn cảnh có ý nghĩa đặc biệt, không phải các mùa thời tiết; “thời đại” truyền đạt chiều kích lịch sử-cứu chuộc mà không giới hạn vào một cách giải thích duy nhất.
- source_word: οὐ δύνασθε
  choice: lại không thể phân biệt
  rationale: Diễn đạt rõ sự bất lực được nêu trong nguyên văn và lặp lại động từ “phân biệt” để làm nổi bật sự tương phản.
theological_decisions:
- issue: Ý nghĩa của “các dấu hiệu của thời đại”
  choice: Giữ cụm từ rộng, không thu hẹp chỉ còn các dấu hiệu cánh chung.
  alternative: “các dấu hiệu của thời điểm hiện tại” hoặc “các dấu hiệu về thời đại Đấng Mê-si”
  rationale: Lời quở trách liên quan đến việc không nhận ra ý nghĩa thuộc linh của thời điểm hiện tại và các công việc của Chúa Giê-su. Cụm Hy Lạp có thể bao gồm ý nghĩa Mê-si và cánh chung, nên bản dịch duy trì độ mở và sức căng thần học ấy.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Sắc trời” là cách nói tiếng Việt tự nhiên cho diện mạo bầu trời; “các ông” phù hợp với lời trực tiếp mang tính quở trách trong văn cảnh. Dấu ngoặc kép được dùng cho câu dự báo thời tiết.
