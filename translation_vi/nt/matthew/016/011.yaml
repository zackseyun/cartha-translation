id: MAT.16.11
reference: Matthew 16:11
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: πῶς οὐ νοεῖτε ὅτι οὐ περὶ ⸀ἄρτων εἶπον ὑμῖν; ⸂προσέχετε δὲ⸃ ἀπὸ τῆς ζύμης τῶν Φαρισαίων καὶ Σαδδουκαίων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/011.yaml
  text: How do you not understand that I did not speak to you about bread? But beware of the leaven of the Pharisees and Sadducees[a][b].
translation:
  language: vi
  text: Sao các con không hiểu rằng Thầy không nói với các con về bánh? Nhưng hãy coi chừng men của người Pha-ri-si và người Sa-đu-sê.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “hãy đề phòng men của người Pha-ri-si và người Sa-đu-sê.”'
    reason: lexical_alternative
  - marker: b
    text: “Men” ở đây là một hình ảnh ẩn dụ; trong câu kế tiếp, điều này được giải thích là lời dạy của người Pha-ri-si và người Sa-đu-sê.
    reason: cross_reference
lexical_decisions:
- source_word: πῶς οὐ νοεῖτε
  choice: Sao các con không hiểu
  rationale: Câu hỏi mang sắc thái quở trách về việc các môn đồ không nắm được ý. “Sao… không hiểu” tự nhiên trong tiếng Việt hiện đại và giữ lực tu từ của nguyên văn.
- source_word: ὅτι οὐ περὶ ἄρτων εἶπον ὑμῖν
  choice: rằng Thầy không nói với các con về bánh
  rationale: περὶ ἄρτων chỉ điều được nói đến; dù ἄρτων ở số nhiều, tiếng Việt tự nhiên dùng danh từ chung “bánh”. Đại từ xưng hô “Thầy–các con” phù hợp quan hệ giữa Chúa Giê-su và các môn đồ trong ngữ cảnh.
- source_word: προσέχετε δὲ
  choice: Nhưng hãy coi chừng
  rationale: προσέχετε là mệnh lệnh cảnh báo; “hãy coi chừng” truyền đạt rõ ý đề phòng. δέ được dịch là “Nhưng” để thể hiện bước chuyển mang tính sửa lại sự hiểu lầm.
- source_word: ἀπὸ τῆς ζύμης
  choice: men
  rationale: Với προσέχετε, ἀπό diễn tả điều phải đề phòng. “Men” vừa tự nhiên trong tiếng Việt vừa giữ nguyên hình ảnh ẩn dụ, thay vì giải thích trước là “lời dạy”.
- source_word: τῶν Φαρισαίων καὶ Σαδδουκαίων
  choice: của người Pha-ri-si và người Sa-đu-sê
  rationale: Dùng các dạng phiên âm quen thuộc trong tiếng Việt; sở hữu cách biểu thị thứ men gắn với hoặc đặc trưng cho hai nhóm này.
theological_decisions:
- issue: Ý nghĩa ẩn dụ của ζύμη
  choice: Giữ từ “men” trong chính văn mà chưa diễn giải là “lời dạy”.
  alternative: Nhưng hãy coi chừng lời dạy của người Pha-ri-si và người Sa-đu-sê.
  rationale: Câu kế tiếp giải thích hình ảnh này là lời dạy của họ, nhưng chính câu 11 vẫn dùng ζύμη theo nghĩa ẩn dụ. Giữ hình ảnh bảo toàn diễn tiến của bản văn và không đưa lời giải thích của câu sau vào quá sớm.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. “Coi chừng” diễn đạt lời cảnh báo tự nhiên; “Thầy–các con” phản ánh lời Chúa Giê-su nói với các môn đồ. Dấu chú thích [a][b] được đặt ngay sau cụm từ liên quan.
