language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀμὴν λέγω ὑμῖν ⸀ὅτι εἰσίν τινες ⸂τῶν ὧδε ἑστώτων⸃ οἵτινες οὐ μὴ γεύσωνται θανάτου ἕως ἂν ἴδωσιν τὸν υἱὸν τοῦ ἀνθρώπου ἐρχόμενον ἐν τῇ βασιλείᾳ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/028.yaml
  text: Truly I tell you[c][b][a], there are some standing here who will certainly not taste death until they see the Son of Man coming in his kingdom.
translation:
  language: vi
  text: 'Quả thật, tôi nói với anh em: Có một số người đang đứng đây nhất định sẽ không nếm sự chết[a] cho đến khi thấy Con Người đến trong vương quốc của Người.[b][c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “sẽ tuyệt đối không nếm sự chết”; tiếng Hy Lạp dùng một lối phủ định nhấn mạnh.'
    reason: lexical_alternative
  - marker: b
    text: Cụm từ “Con Người đến trong vương quốc của Người” có thể chỉ sự biến hình, sự phục sinh và tôn cao, sự phán xét trên Giê-ru-sa-lem, hoặc lần đến cuối cùng; chính bản văn không nói rõ đó là biến cố nào.
    reason: alternative_reading
  - marker: c
    text: “Vương quốc” cũng có thể được hiểu là “vương quyền”, “sự trị vì” hoặc “quyền cai trị”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν
  choice: Quả thật
  rationale: Diễn đạt lời khẳng định trang trọng mở đầu một tuyên bố có thẩm quyền, tự nhiên hơn việc phiên âm “A-men” trong tiếng Việt hiện đại.
- source_word: λέγω ὑμῖν
  choice: tôi nói với anh em
  rationale: Giữ cách xưng hô trực tiếp và sắc thái trang trọng của công thức nguyên ngữ.
- source_word: εἰσίν τινες τῶν ὧδε ἑστώτων
  choice: Trong số những người đang đứng đây, có vài người
  rationale: 'Thể hiện rõ ý phân bộ của cấu trúc sở hữu cách: chỉ một số người trong nhóm đang hiện diện.'
- source_word: οὐ μὴ γεύσωνται
  choice: chắc chắn sẽ không nếm
  rationale: “Chắc chắn sẽ không” chuyển tải sức nhấn mạnh của phủ định οὐ μή, còn “nếm” giữ hình ảnh sống động của động từ Hy Lạp.
- source_word: γεύσωνται θανάτου
  choice: nếm sự chết
  rationale: Giữ nguyên ẩn dụ của nguyên ngữ và âm hưởng Kinh Thánh, đồng thời vẫn dễ hiểu trong tiếng Việt.
- source_word: ἕως ἂν ἴδωσιν
  choice: cho đến khi họ thấy
  rationale: Diễn đạt tự nhiên cấu trúc thời gian hướng đến một biến cố trong tương lai mà không thêm hàm ý ngoài nguyên văn.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: Con Người
  rationale: Giữ danh xưng cố định với âm hưởng khải huyền, không diễn giải thành một danh hiệu thần học cụ thể hơn.
- source_word: ἐρχόμενον
  choice: đến
  rationale: Chuyển trực tiếp phân từ chỉ sự đến; không thêm “trong quyền năng” vì ý đó không có trong câu này.
- source_word: ἐν τῇ βασιλείᾳ αὐτοῦ
  choice: trong vương quốc của mình
  rationale: “Vương quốc” giữ cả hình ảnh cụ thể lẫn khả năng chỉ vương quyền; “của mình” quy chiếu tự nhiên về Con Người mà không thêm danh xưng tôn kính không có trong nguyên ngữ.
theological_decisions:
- issue: Biến cố được chỉ đến trong cụm “Con Người đến trong vương quốc của mình”
  choice: Giữ nguyên cách nói, không xác định đó là biến cố nào
  alternative: Diễn giải thành sự biến hình, sự phục sinh và tôn cao, Lễ Ngũ Tuần, sự phán xét trên Giê-ru-sa-lem, hoặc lần đến cuối cùng
  rationale: Bản văn Hy Lạp không xác định rõ biến cố; bản dịch cần bảo toàn sự mở ngỏ và căng thẳng giải nghĩa thay vì quyết định thay cho người đọc.
- issue: Sắc thái của βασιλεία
  choice: vương quốc
  alternative: vương quyền; sự trị vì; quyền cai trị
  rationale: “Vương quốc” bảo toàn hình ảnh và thuật ngữ chính, trong khi chú thích ghi nhận βασιλεία cũng có thể nhấn mạnh hoạt động trị vì.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Giữ các cách nói giàu hình ảnh “nếm sự chết” và danh xưng “Con Người”; tránh giải nghĩa quá mức một câu có nhiều cách hiểu thần học.
