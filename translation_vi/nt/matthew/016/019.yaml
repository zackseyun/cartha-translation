id: MAT.16.19
reference: Matthew 16:19
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸀δώσω σοι τὰς ⸀κλεῖδας τῆς βασιλείας τῶν οὐρανῶν, καὶ ὃ ⸀ἐὰν δήσῃς ἐπὶ τῆς γῆς ἔσται δεδεμένον ἐν τοῖς οὐρανοῖς, καὶ ὃ ⸁ἐὰν λύσῃς ἐπὶ τῆς γῆς ἔσται λελυμένον ἐν τοῖς οὐρανοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/019.yaml
  text: I will give you the keys of the kingdom of heaven[a], and whatever you bind on earth will have been bound in heaven[c][b], and whatever you loose on earth will have been loosed in heaven.
translation:
  language: vi
  text: Ta sẽ trao cho con các chìa khóa của vương quốc thiên đàng[a]. Bất cứ điều gì con buộc[b] trên đất thì điều ấy sẽ là điều đã được buộc trên trời[c], và bất cứ điều gì con tháo trên đất thì điều ấy sẽ là điều đã được tháo trên trời.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát hơn: “vương quốc của các tầng trời.” Ma-thi-ơ thường dùng cách diễn đạt này.'
    reason: lexical_alternative
  - marker: b
    text: “Buộc” và “tháo” có thể mang nghĩa cấm và cho phép, hoặc đặt ra và gỡ bỏ nghĩa vụ; bản dịch giữ nguyên hình ảnh của tiếng Hy Lạp.
    reason: cultural_note
  - marker: c
    text: Cách dịch truyền thống thường là “sẽ bị buộc ... sẽ được tháo.” Cấu trúc Hy Lạp có thể được hiểu chính xác hơn là “sẽ là điều đã được buộc ... sẽ là điều đã được tháo.”
    reason: alternative_reading
lexical_decisions:
- source_word: δώσω σοι
  choice: Ta sẽ trao cho con
  rationale: Động từ ở thì tương lai diễn tả một lời hứa. “Trao cho” tự nhiên trong tiếng Việt và giữ rõ người nhận; “Ta... con” phù hợp lời Đức Giê-su trực tiếp nói với Phi-e-rơ trong văn cảnh.
- source_word: τὰς κλεῖδας
  choice: các chìa khóa
  rationale: Giữ nguyên hình ảnh ẩn dụ số nhiều của nguyên văn, không diễn giải thành một hệ thống quyền hành cụ thể.
- source_word: τῆς βασιλείας τῶν οὐρανῶν
  choice: của vương quốc thiên đàng
  rationale: “Vương quốc thiên đàng” là cách nói tự nhiên, dễ hiểu cho thành ngữ đặc trưng của Ma-thi-ơ; dạng số nhiều theo sát chữ được ghi ở chú thích.
- source_word: ὃ ἐὰν
  choice: bất cứ điều gì
  rationale: Chuyển tự nhiên cấu trúc đại từ quan hệ bất định và giữ phạm vi mở của lời tuyên bố trong cả hai vế.
- source_word: δήσῃς
  choice: con buộc
  rationale: Giữ ẩn dụ “buộc” cùng sắc thái thẩm quyền mà không thu hẹp nghĩa vào một cách giải thích giáo hội học.
- source_word: ἐπὶ τῆς γῆς
  choice: dưới đất
  rationale: Cách diễn đạt tiếng Việt quen thuộc trong thế đối lập với “trên trời”.
- source_word: ἔσται δεδεμένον
  choice: sẽ là điều đã được buộc
  rationale: 'Phản ánh cấu trúc tương lai của εἰμί kết hợp với phân từ hoàn thành thụ động: một trạng thái tương lai phát sinh từ hành động đã hoàn tất, thay vì san phẳng thành “sẽ bị buộc”.'
- source_word: ἐν τοῖς οὐρανοῖς
  choice: trên trời
  rationale: Cách nói tiếng Việt tự nhiên cho dạng số nhiều Hy Lạp trong thế đối lập với đất; không buộc người đọc hiểu là nhiều tầng trời.
- source_word: λύσῃς
  choice: con tháo
  rationale: “Tháo” tạo cặp hình ảnh trực tiếp với “buộc” và tránh diễn giải quá sớm thành “cho phép” hay “miễn trừ”.
- source_word: ἔσται λελυμένον
  choice: sẽ là điều đã được tháo
  rationale: Giữ song song với vế “đã được buộc” và thể hiện cấu trúc tương lai kết hợp với phân từ hoàn thành thụ động.
theological_decisions:
- issue: Thể của công thức buộc và tháo cùng quan hệ giữa hành động dưới đất và hành động trên trời
  choice: “sẽ là điều đã được buộc... sẽ là điều đã được tháo”
  alternative: “sẽ bị buộc... sẽ được tháo”
  rationale: Cấu trúc ἔσται cộng phân từ hoàn thành thụ động có thể chỉ trạng thái khi ấy đã được thiết lập. Bản dịch giữ lực ngữ pháp này nhưng không khẳng định một học thuyết hệ phái về việc quyết định trên trời hay dưới đất đi trước theo nghĩa thần học.
- issue: Ý nghĩa của các chìa khóa vương quốc thiên đàng
  choice: Giữ nguyên hình ảnh “các chìa khóa”
  alternative: Diễn giải là quyền cho vào hoặc loại ra, hay quyền quản trị
  rationale: Hình ảnh có hàm ý thẩm quyền, nhưng câu Kinh Thánh không tự triển khai thành một cơ cấu giáo hội cụ thể; giữ ẩn dụ bảo toàn độ mở của nguyên văn.
- issue: Phạm vi nghĩa của “buộc” và “tháo”
  choice: Giữ cặp động từ theo nghĩa hình ảnh
  alternative: Dịch thẳng thành “cấm” và “cho phép”, hoặc “đặt” và “gỡ bỏ” nghĩa vụ
  rationale: Các nghĩa pháp lý hoặc quy phạm đều có thể hiện diện trong bối cảnh Do Thái, nhưng việc chọn riêng một nghĩa sẽ giải quyết sự đa nghĩa mà nguyên văn vẫn để mở.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “Ta—con” giữ sắc thái lời của Đức Giê-su nói trực tiếp với Phi-e-rơ. Câu dịch ưu tiên tính tự nhiên nhưng vẫn bảo toàn ẩn dụ, cấu trúc song song và sắc thái hoàn thành của nguyên văn.
