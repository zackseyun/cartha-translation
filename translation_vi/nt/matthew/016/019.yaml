revisions:
- from: Ta sẽ trao cho con các chìa khóa của vương quốc thiên đàng[a]. Bất cứ điều gì con buộc dưới đất[b] thì sẽ là điều đã được buộc trên trời[c], và bất cứ điều gì con tháo dưới đất thì sẽ là điều đã được tháo trên trời.
  to: Ta sẽ trao cho con các chìa khóa của vương quốc thiên đàng[a]. Bất cứ điều gì con buộc[b] trên đất thì điều ấy sẽ là điều đã được buộc trên trời[c], và bất cứ điều gì con tháo trên đất thì điều ấy sẽ là điều đã được tháo trên trời.
  rationale: 'Sửa giới từ địa điểm theo nguyên văn Hy Lạp: ἐπὶ τῆς γῆς là “trên đất.” Cấu trúc ἔσται + phân từ hoàn thành thụ động được bảo tồn bằng “sẽ là điều đã được buộc/tháo,” một cách diễn đạt hơi trang trọng nhưng rõ nghĩa và có tính song song. Việc thêm “điều ấy” chỉ làm rõ quan hệ tham chiếu trong tiếng Việt, không thêm nghĩa. Các chú thích được giữ nguyên nội dung học thuật, với neo chú thích về cặp ẩn dụ được đặt sát thuật ngữ hơn.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T05:40:21Z'
review_pass:
  verdict: revise
  source_fidelity: 'Cần sửa “dưới đất” thành “trên đất”: ἐπὶ τῆς γῆς nghĩa là “trên đất/on earth,” đối ứng với ἐν τοῖς οὐρανοῖς (“trên trời”). Bản dịch vẫn cần giữ cách diễn đạt hoàn thành thụ động trong hai vế cuối, và bản sửa duy trì điều đó mà không áp đặt cách hiểu thần học về quyền quyết định.'
  naturalness: “Trên đất” là cách nói hiện đại, tự nhiên và chính xác hơn trong thế đối lập với “trên trời.” Thêm “điều ấy” ở hai vế sau làm câu tiếng Việt mạch lạc hơn, đồng thời giữ cấu trúc tương ứng của nguyên văn.
  terminology: “Ta—con,” “các chìa khóa,” “vương quốc thiên đàng,” “buộc/tháo,” và “trên trời” đều phù hợp văn phong Kinh Thánh tiếng Việt hiện đại. Giữ “buộc/tháo” thay vì diễn giải thành “cấm/cho phép.”
  issues:
  - severity: medium
    issue: “dưới đất” dịch ἐπὶ τῆς γῆς
    rationale: Giới từ ἐπί với sở hữu cách ở đây là “trên/on,” không phải “dưới/under.” “Dưới đất” trong tiếng Việt thường gợi nghĩa ở bên dưới mặt đất, nên vừa kém chính xác vừa làm yếu thế đối lập “trên đất/trên trời.”
  - severity: low
    issue: Neo chú thích về “Buộc” và “tháo” chỉ đặt sau “dưới đất” trong vế đầu
    rationale: Chú thích giải thích cặp động từ; đặt neo ngay sau “buộc” giúp người đọc nhận ra rõ thuật ngữ mà chú thích đang giải thích, dù nội dung chú thích vẫn áp dụng cho cả “tháo.”
