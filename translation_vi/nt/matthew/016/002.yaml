    reason: textual_variant
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: đáp lời
  rationale: Cụm phân từ đi với động từ nói là một công thức dẫn lời quen thuộc. “Đáp lời” giữ chức năng hồi đáp mà tránh lối dịch nặng nề “đáp và nói” trong tiếng Việt hiện đại.
- source_word: Ὀψίας γενομένης
  choice: Khi chiều đến
  rationale: Kết cấu sở hữu cách tuyệt đối chỉ thời gian; cách dịch này tự nhiên và giữ nguyên ý thời điểm.
- source_word: λέγετε
  choice: các ông nói
  rationale: Thì hiện tại diễn tả điều người nghe thường nói khi quan sát thời tiết.
- source_word: Εὐδία
  choice: Trời sẽ đẹp
  rationale: Danh từ này chỉ thời tiết thuận lợi, quang đãng. Trong lời dự báo dân gian, “trời sẽ đẹp” tự nhiên hơn một cụm danh từ rời như “thời tiết đẹp”.
- source_word: πυρράζει
  choice: đỏ
  rationale: Diễn tả bầu trời mang sắc đỏ; “đỏ” ngắn gọn, rõ nghĩa và không thêm mức độ như “đỏ rực”.
- source_word: οὐρανός
  choice: bầu trời
  rationale: Ngữ cảnh khí tượng xác định nghĩa là bầu trời hữu hình, không phải nơi ở trên trời theo nghĩa thần học.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Ngài” cho Đức Giê-su và “các ông” cho nhóm người đang đối thoại. Giữ hình ảnh tục ngữ dự báo thời tiết, đồng thời diễn đạt Εὐδία theo cách nói tự nhiên trong tiếng Việt.
