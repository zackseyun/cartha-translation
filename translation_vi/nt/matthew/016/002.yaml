  text: But he answered and said to them[a], “When evening comes, you say, ‘Fair weather, for the sky is red.’
translation:
  language: vi
  text: 'Nhưng Ngài đáp lời họ: “Khi chiều đến, các ông nói: ‘Trời sẽ đẹp, vì bầu trời đỏ.’”[a]'
  philosophy: optimal-equivalence
