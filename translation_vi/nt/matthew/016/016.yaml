id: MAT.16.16
reference: Matthew 16:16
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ Σίμων Πέτρος εἶπεν· Σὺ εἶ ὁ χριστὸς ὁ υἱὸς τοῦ θεοῦ τοῦ ζῶντος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/016.yaml
  text: Simon Peter answered[a], “You are the Messiah, the Son of the living God.”
translation:
  language: vi
  text: 'Si-môn Phi-e-rơ đáp: “Thầy là Đấng Mê-si-a,[a] Con Đức Chúa Trời hằng sống.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “Đấng Christ.” Tước hiệu Hy Lạp Χριστός có nghĩa là “Đấng được xức dầu”, tương ứng với “Mê-si-a”.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποκριθεὶς ... εἶπεν
  choice: đáp
  rationale: Cụm phân từ ἀποκριθείς đi với εἶπεν là công thức dẫn lời, có nghĩa tự nhiên là “đáp”; gộp lại tránh cách dịch cứng “đáp và nói”.
- source_word: δὲ
  choice: —
  rationale: δέ chỉ sự tiếp nối hoặc chuyển ý nhẹ; mạch kể tiếng Việt đã rõ với “Si-môn Phi-e-rơ đáp”, nên không cần dịch riêng.
- source_word: Σίμων Πέτρος
  choice: Si-môn Phi-e-rơ
  rationale: Chuyển tự tên riêng theo dạng quen thuộc trong tiếng Việt.
- source_word: Σὺ
  choice: Thầy
  rationale: Đại từ Hy Lạp được nêu rõ để nhấn mạnh đối tượng; trong lời môn đồ thưa với Chúa Giê-su, “Thầy” vừa tự nhiên vừa giữ được vị trí nổi bật ở đầu lời tuyên xưng.
- source_word: ὁ χριστὸς
  choice: Đấng Mê-si-a
  rationale: Χριστός ở đây là tước hiệu chỉ Đấng được xức dầu, không phải một phần của tên riêng; “Đấng Mê-si-a” giữ rõ bối cảnh và ý nghĩa cứu thế Do Thái.
- source_word: ὁ υἱὸς
  choice: Con
  rationale: Mạo từ cùng danh từ chỉ một tước hiệu xác định. Tiếng Việt không cần thêm từ tương đương với mạo từ; viết hoa “Con” thể hiện chức danh trong lời tuyên xưng mà không diễn giải thêm.
- source_word: τοῦ θεοῦ τοῦ ζῶντος
  choice: Đức Chúa Trời hằng sống
  rationale: Cụm phân từ thuộc tính τοῦ ζῶντος mô tả Đức Chúa Trời là Đấng sống; “hằng sống” là cách diễn đạt tự nhiên, trang trọng và giữ sắc thái tương phản với các thần không có sự sống.
theological_decisions:
- issue: Dịch Χριστός như tước hiệu hay dạng gần với tên riêng
  choice: Đấng Mê-si-a
  alternative: Đấng Christ
  rationale: Trong lời tuyên xưng của Phi-e-rơ, Χριστός rõ ràng mang chức năng tước hiệu. Bản chính dùng “Đấng Mê-si-a” để làm sáng nghĩa trong bối cảnh Do Thái, đồng thời ghi “Đấng Christ” ở chú thích như cách dịch truyền thống.
- issue: Ý nghĩa của cụm “Con Đức Chúa Trời”
  choice: Con Đức Chúa Trời hằng sống
  alternative: —
  rationale: Giữ nguyên cấu trúc tuyên xưng và tính chất tước hiệu của nguyên văn, không mở rộng thành một công thức thần học về sau hoặc thu hẹp ý nghĩa của mối quan hệ được nói đến.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Thầy” trong lời trực tiếp để phù hợp quan hệ môn đồ–thầy trong tiếng Việt; giữ câu ngắn, dứt khoát như lời tuyên xưng Hy Lạp.
