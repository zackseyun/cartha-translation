id: MAT.16.1
reference: Matthew 16:1
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Καὶ προσελθόντες οἱ Φαρισαῖοι καὶ Σαδδουκαῖοι πειράζοντες ἐπηρώτησαν αὐτὸν σημεῖον ἐκ τοῦ οὐρανοῦ ἐπιδεῖξαι αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/001.yaml
  text: And the Pharisees and Sadducees came and[a], testing him, asked him to show them a sign from heaven.
translation:
  language: vi
  text: Các người Pha-ri-si và Sa-đu-sê đến gặp Đức Giê-su; để thử Ngài[a], họ yêu cầu Ngài cho họ thấy một dấu lạ từ trời.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “cám dỗ Ngài” hoặc “tìm cách gài bẫy Ngài.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσελθόντες
  choice: đến
  rationale: Phân từ bất định quá khứ của προσέρχομαι diễn tả việc họ tiến đến trước hành động chính; “đến” tự nhiên, gọn và vẫn thể hiện sự hướng về phía Đức Giê-su.
- source_word: Φαρισαῖοι
  choice: những người Pha-ri-si
  rationale: Dùng dạng phiên âm quen thuộc trong tiếng Việt cho tên nhóm này, kèm từ chỉ người để câu rõ và tự nhiên.
- source_word: Σαδδουκαῖοι
  choice: những người Sa-đu-sê
  rationale: Dùng dạng phiên âm quen thuộc trong tiếng Việt cho tên nhóm này.
- source_word: πειράζοντες
  choice: để thử Đức Giê-su
  rationale: πειράζω có thể mang nghĩa thử, thử thách hoặc cám dỗ. Trong ngữ cảnh, phân từ hàm ý ý định đối nghịch; “để thử” giữ được sắc thái ấy mà không diễn giải quá mức thành “gài bẫy”.
- source_word: ἐπηρώτησαν
  choice: họ xin
  rationale: Trong cấu trúc với động từ nguyên mẫu ἐπιδεῖξαι, từ này diễn tả một lời yêu cầu. “Xin” tự nhiên hơn “hỏi” trong tiếng Việt khi theo sau là đề nghị ai làm điều gì, nhưng không hàm ý thái độ cung kính.
- source_word: σημεῖον
  choice: một dấu lạ
  rationale: “Dấu lạ” là cách diễn đạt tự nhiên và quen thuộc trong văn cảnh Kinh Thánh, chỉ một dấu hiệu có ý nghĩa xác chứng; không thêm từ “phép lạ” vì nguyên văn chỉ nói σημεῖον.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: từ trời
  rationale: Diễn đạt trực tiếp nguồn gốc của dấu lạ. “Trời” tự nhiên trong tiếng Việt và giữ được khả năng chỉ thiên giới mà không diễn giải thêm.
- source_word: ἐπιδεῖξαι
  choice: cho họ thấy
  rationale: Động từ nguyên mẫu này có nghĩa trình ra hoặc cho thấy. “Cho họ thấy” chuyển tải rõ cả hành động lẫn đối tượng gián tiếp αὐτοῖς.
theological_decisions:
- issue: Sắc thái đối nghịch trong yêu cầu của người Pha-ri-si và Sa-đu-sê
  choice: Dịch πειράζοντες là “để thử Đức Giê-su”.
  alternative: “để cám dỗ Ngài” hoặc “để gài bẫy Ngài”
  rationale: “Để thử” bảo toàn phạm vi nghĩa của từ Hy Lạp và cho thấy động cơ không trung lập, nhưng không xác định quá mức bản chất của âm mưu. Chú thích nêu các khả năng mạnh hơn.
- issue: Ý nghĩa của “dấu lạ từ trời”
  choice: Giữ nguyên cụm “một dấu lạ từ trời”.
  alternative: “một phép lạ chứng minh quyền năng từ Đức Chúa Trời”
  rationale: Nguyên văn không nói rõ loại dấu hiệu hoặc phát biểu trực tiếp mục đích thần học của nó; bản dịch giữ sự hàm súc và căng thẳng của lời yêu cầu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cấu trúc được điều chỉnh theo tiếng Việt để phân từ chỉ mục đích rõ ràng. Dùng “Đức Giê-su” và đại từ “Ngài” nhằm nhận diện đối tượng vốn được biểu thị bằng đại từ trong nguyên văn, đồng thời tránh câu tối nghĩa.
