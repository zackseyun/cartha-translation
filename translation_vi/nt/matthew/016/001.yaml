  to: Các người Pha-ri-si và Sa-đu-sê đến gặp Đức Giê-su; để thử Ngài[a], họ yêu cầu Ngài cho họ thấy một dấu lạ từ trời.
  rationale: 'Bản sửa thay “xin” bằng “yêu cầu” để phản ánh ἐπηρώτησαν mà không thêm sắc thái kính cẩn hay mức độ cưỡng bách. Cấu trúc câu được điều chỉnh cho tiếng Việt hiện đại, đồng thời vẫn giữ thứ tự và quan hệ ý chính: họ đến gặp Đức Giê-su, thử Ngài, rồi yêu cầu một dấu lạ từ trời. Chú thích bảo toàn các cách hiểu từ vựng thay thế của πειράζοντες.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T05:40:11Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản nháp truyền đạt đúng các thành tố chính của câu Hy Lạp: hai nhóm đến, với ý thử Đức Giê-su, và yêu cầu Ngài cho họ thấy một dấu lạ từ trời. Tuy nhiên, “xin Ngài” thường gợi một lời thỉnh cầu lịch sự trong tiếng Việt, yếu hơn và kém phù hợp với ἐπηρώτησαν trong bối cảnh đối nghịch. Cấu trúc “đến, và để thử...” cũng chưa tự nhiên.'
  naturalness: Nên dùng “yêu cầu” thay cho “xin” để giữ giọng thuật sự trung tính mà không gán thêm ý “đòi hỏi”. Đưa “Đức Giê-su” vào ngay sau “đến gặp” và dùng “họ” ở mệnh đề chính giúp câu Việt rõ chủ thể, đối tượng và mạch hành động.
  terminology: “Pha-ri-si,” “Sa-đu-sê,” “Đức Giê-su,” và “dấu lạ từ trời” đều phù hợp với cách dùng Kinh Thánh tiếng Việt hiện đại. “Thử Ngài” giữ đúng độ mở của πειράζοντες; chú thích có thể nêu “cám dỗ” và “tìm cách gài bẫy” như các khả năng diễn đạt khác.
  issues:
  - severity: medium
    issue: “Xin Ngài” có sắc thái lịch sự không cần thiết.
    rationale: ἐπηρώτησαν có nghĩa là hỏi/yêu cầu; trong văn cảnh πειράζοντες, “xin” dễ khiến lời yêu cầu nghe cung kính hơn nguyên văn cho phép. “Yêu cầu” tự nhiên và trung tính hơn.
  - severity: low
    issue: Cú pháp “đến, và để thử Đức Giê-su..., họ xin...” hơi gượng.
    rationale: Phân từ πειράζοντες có thể được diễn đạt tự nhiên bằng cụm chen “để thử Ngài” sau khi xác định rõ đối tượng; không cần nối “và” theo sát cấu trúc Hy Lạp.
