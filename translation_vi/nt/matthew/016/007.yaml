  text: οἱ δὲ διελογίζοντο ἐν ἑαυτοῖς λέγοντες ὅτι Ἄρτους οὐκ ἐλάβομεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/007.yaml
  text: And they were discussing among themselves[a], saying, “We did not bring bread.”
translation:
  language: vi
  text: 'Họ bàn luận với nhau rằng: “Chúng ta đã không mang theo bánh.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ δὲ
  choice: Họ
  rationale: δέ là từ nối nhẹ trong mạch kể; tiếng Việt không cần dịch riêng bằng “và” hay “nhưng” tại đây.
- source_word: διελογίζοντο
  choice: bàn luận
  rationale: Thì chưa hoàn thành diễn tả cuộc trao đổi đang diễn ra; “bàn luận” tự nhiên và giữ được sắc thái suy xét với nhau.
- source_word: ἐν ἑαυτοῖς
  choice: với nhau
  rationale: Cụm từ chỉ việc các môn đồ trao đổi trong nội bộ nhóm; “với nhau” là cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: λέγοντες ὅτι
  choice: rằng
  rationale: Phân từ λέγοντες cùng ὅτι dẫn vào nội dung lời bàn luận; gộp thành “rằng” giúp câu tiếng Việt gọn, tự nhiên mà không thêm quan hệ nguyên nhân vốn không được nói rõ trong nguyên văn.
- source_word: Ἄρτους
  choice: bánh
  rationale: Danh từ số nhiều chỉ bánh làm lương thực; “bánh” phù hợp với cách dùng danh từ khái quát trong tiếng Việt.
- source_word: οὐκ ἐλάβομεν
  choice: đã không mang theo
  rationale: Trong ngữ cảnh hành trình, λαμβάνω mang nghĩa lấy hoặc đem theo; “mang theo” truyền đạt rõ ý mà không buộc phải nêu điểm đến.
theological_decisions:
- issue: Quan hệ hàm ý giữa lời cảnh báo trước đó của Đức Chúa Jêsus và việc thiếu bánh
  choice: Không thêm “Ấy là vì” hoặc “Ngài nói vậy vì”
  alternative: “Ấy là vì chúng ta đã không mang theo bánh”
  rationale: 'Nguyên văn chỉ ghi trực tiếp nội dung họ nói: “Chúng ta đã không mang theo bánh.” Việc diễn đạt thành nguyên nhân là hợp ngữ cảnh nhưng vẫn là phần hàm ý; bản dịch giữ sự cô đọng và mơ hồ của tiếng Hy Lạp.'
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Chúng ta” trong lời nói nội bộ của nhóm; không cần chú thích vì phương án “mang theo” đã thể hiện tự nhiên nghĩa theo ngữ cảnh.
