translation:
  language: vi
  text: 'Ngài nói với họ: “Còn anh em nói tôi là ai?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: Ngài hỏi
  rationale: Động từ ở thì hiện tại lịch sử tạo sắc thái sống động. Trong ngữ cảnh đây là lời đặt câu hỏi, nên “hỏi” tự nhiên hơn “nói với”, đồng thời vẫn truyền đạt đúng hành động phát ngôn.
- source_word: αὐτοῖς
  choice: họ
  rationale: Đại từ số nhiều ở cách dữ, chỉ những người được Ngài hỏi; tiếng Việt diễn đạt tự nhiên là “hỏi họ”.
- source_word: Ὑμεῖς
  choice: các con
  rationale: Đại từ được nêu tường minh trong tiếng Hy Lạp để nhấn mạnh và đối lập với ý kiến của người khác. “Còn các con, các con...” giữ được nét nhấn mạnh ấy trong tiếng Việt. “Các con” phù hợp với lời Chúa Giê-su nói cùng các môn đồ trong ngữ cảnh.
- source_word: δὲ
  choice: Còn
  rationale: Tiểu từ đánh dấu sự tương phản giữa nhận định của dân chúng ở câu trước và nhận định của các môn đồ. “Còn” diễn đạt tự nhiên sự chuyển hướng tương phản này.
- source_word: τίνα
  choice: ai
  rationale: Đại từ nghi vấn chỉ căn tính; “ai” là cách diễn đạt trực tiếp và tự nhiên trong tiếng Việt.
- source_word: με
  choice: Ta
  rationale: Đại từ ngôi thứ nhất là chủ thể của động từ nguyên mẫu trong cấu trúc lời nói gián tiếp tiếng Hy Lạp; tiếng Việt chuyển tự nhiên thành mệnh đề “Ta là ai”. “Ta” giữ văn phong trang trọng và tương quan của Chúa Giê-su với các môn đồ.
- source_word: λέγετε
  choice: các con nói
  rationale: Động từ hiện tại, ngôi thứ hai số nhiều. “Nói” giữ sát từ vựng nguồn; việc lặp lại “các con” làm rõ nét nhấn mạnh của đại từ Ὑμεῖς.
- source_word: εἶναι
  choice: là
  rationale: Động từ nguyên mẫu “là” nằm trong cấu trúc đối cách-nguyên mẫu. Tiếng Việt diễn đạt tự nhiên bằng câu “các con nói Ta là ai” mà không cần thêm liên từ.
theological_decisions:
- issue: Sự nhấn mạnh vào nhận định riêng của các môn đồ
  choice: “Còn các con, các con nói Ta là ai?”
  alternative: “Nhưng các con nói Ta là ai?”
  rationale: Cách dịch được chọn bảo toàn cả nét tương phản của δέ và sự nhấn mạnh do đại từ Ὑμεῖς được nêu tường minh, nhưng không đưa trước nội dung lời tuyên xưng ở câu kế tiếp.
- issue: Căn tính của Chúa Giê-su trong câu hỏi
  choice: 'Giữ câu hỏi mở: “Ta là ai?”'
  alternative: Diễn giải bằng một tước hiệu thần học
  rationale: Bản văn chỉ đặt câu hỏi về căn tính; không nên chèn vào câu này lời giải đáp hoặc tước hiệu xuất hiện trong ngữ cảnh tiếp theo.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” trong lời dẫn và “Ta/các con” trong lời thoại để thể hiện quan hệ giữa Chúa Giê-su và các môn đồ. Không cần chú thích vì cấu trúc đối cách-nguyên mẫu của tiếng Hy Lạp được chuyển sang tiếng Việt một cách tự nhiên mà không làm mất ý nghĩa.
