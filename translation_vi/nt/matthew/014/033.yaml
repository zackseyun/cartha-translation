  source_fidelity: 'Bản dịch truyền đạt đúng các thành phần chính của câu: chủ ngữ là những người ở trong thuyền, hành động προσκυνέω đối với Chúa Giê-su, lời tuyên xưng nhấn mạnh Ἀληθῶς, và tước hiệu θεοῦ υἱός. Tuy nhiên, “Bấy giờ” diễn đạt một mốc thời gian rõ hơn điều δέ (liên từ nối/chuyển nhẹ) tự nó khẳng định. Bỏ yếu tố này tránh thêm sắc thái thời điểm không cần thiết.'
