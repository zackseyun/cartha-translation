  terminology: “Thờ lạy” là lựa chọn có cơ sở trong ngữ cảnh, đồng thời chú thích giữ các khả năng chỉ cử chỉ tôn kính. “Con Đức Chúa Trời” phản ánh cách dùng tước hiệu trong ngữ cảnh này. Chú thích b nên diễn đạt chính xác hơn rằng việc thiếu mạo từ ở θεοῦ không tự động khiến cụm từ trở thành bất định, và tránh cách nói dễ gây hiểu lầm “một người con”.
