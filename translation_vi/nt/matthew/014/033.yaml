    rationale: Cách diễn đạt này không tự nhiên và có thể gợi một ý niệm khác với danh ngữ vị ngữ Hy Lạp. Nên nói trực tiếp về khả năng dịch “Con của Đức Chúa Trời” và việc cấu trúc không đòi nghĩa “một con của Đức Chúa Trời.”
