source:
  edition: SBLGNT
  text: οἱ δὲ ἐν τῷ ⸀πλοίῳ προσεκύνησαν αὐτῷ λέγοντες· Ἀληθῶς θεοῦ υἱὸς εἶ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/033.yaml
  text: Then those in the boat worshiped him[a], saying[b], “Truly you are the Son of God.”
translation:
  language: vi
  text: 'Những người ở trong thuyền thờ lạy Ngài[a] và nói: “Quả thật, Ngài là Con Đức Chúa Trời[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “phủ phục trước Ngài” hoặc “bái lạy Ngài.” Động từ Hy Lạp có thể chỉ sự tôn kính được biểu lộ bằng việc quỳ xuống hay phủ phục; trong ngữ cảnh này, “thờ lạy” phù hợp hơn.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “Con của Đức Chúa Trời.” Trong tiếng Hy Lạp, từ “Đức Chúa Trời” không có mạo từ, nhưng điều đó không buộc cụm từ phải mang nghĩa “một con của Đức Chúa Trời”; trong ngữ cảnh này, cụm từ được dùng như một tước hiệu.
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ δὲ
  choice: Bấy giờ, những người
  rationale: δέ là liên từ nhẹ nối tiếp diễn tiến câu chuyện; “Bấy giờ” diễn đạt tự nhiên sự chuyển tiếp sau biến cố vừa xảy ra, còn οἱ được hiểu như danh từ chỉ những người ở trong thuyền.
- source_word: ἐν τῷ πλοίῳ
  choice: ở trong thuyền
  rationale: πλοῖον là từ thông dụng chỉ thuyền; cách diễn đạt này vừa sát nghĩa vừa tự nhiên trong văn kể chuyện tiếng Việt.
- source_word: προσεκύνησαν αὐτῷ
  choice: thờ lạy Ngài
  rationale: προσκυνέω có thể chỉ hành động phủ phục, bày tỏ lòng tôn kính hoặc thờ phượng. Trong bối cảnh Chúa Giê-su bày tỏ quyền năng trên biển và được tuyên xưng ngay sau đó, “thờ lạy” truyền đạt phù hợp cả cử chỉ lẫn ý nghĩa tôn giáo, nhưng vẫn ghi chú khả năng dịch khác.
- source_word: λέγοντες
  choice: và nói
  rationale: Phân từ λέγοντες được chuyển thành động từ đồng diễn “và nói” để câu tiếng Việt tự nhiên mà không làm thay đổi quan hệ giữa hành động và lời tuyên xưng.
- source_word: Ἀληθῶς
  choice: Quả thật
  rationale: Ἀληθῶς diễn tả sự xác nhận mạnh và trang trọng; “Quả thật” phù hợp với sắc thái của lời tuyên xưng.
- source_word: θεοῦ υἱὸς
  choice: Con Đức Chúa Trời
  rationale: Dù θεοῦ không có mạo từ, cấu trúc vị ngữ trong ngữ cảnh này không đòi hỏi nghĩa bất định. “Con Đức Chúa Trời” thể hiện cụm từ như một tước hiệu, đồng thời tự nhiên trong tiếng Việt.
- source_word: εἶ
  choice: Ngài là
  rationale: Động từ εἶ được diễn đạt bằng hệ từ “là”; đại từ tôn kính “Ngài” phù hợp với lời trực tiếp hướng đến Chúa Giê-su và văn phong Kinh Thánh trang nghiêm, dễ hiểu.
theological_decisions:
- issue: Sắc thái của προσκυνέω đối với Chúa Giê-su
  choice: Dịch là “thờ lạy Ngài”
  alternative: “phủ phục trước Ngài” hoặc “bái lạy Ngài”
  rationale: Ngữ cảnh trực tiếp—quyền năng của Chúa Giê-su trên biển và lời tuyên xưng về căn tính của Ngài—ủng hộ sắc thái thờ phượng. Chú thích vẫn bảo tồn phạm vi nghĩa của động từ Hy Lạp, vốn cũng có thể nhấn mạnh cử chỉ phủ phục hay tôn kính.
- issue: Tính xác định của θεοῦ υἱὸς
  choice: Dịch là “Con Đức Chúa Trời”
  alternative: “Con của Đức Chúa Trời”; không chọn “một người con của Đức Chúa Trời”
  rationale: Cụm danh từ không có mạo từ trong tiếng Hy Lạp vẫn có thể mang nghĩa xác định hoặc phẩm tính. Trong lời tuyên xưng này, nó hoạt động như một tước hiệu; cách dịch bất định sẽ làm suy yếu ý nghĩa trong ngữ cảnh.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và dễ hiểu. Dùng “Ngài” khi nói trực tiếp với Chúa Giê-su và “Đức Chúa Trời” cho θεός. Hai dấu chú thích [a], [b] đều xuất hiện trong chính văn và bảo tồn các sắc thái từ vựng, ngữ pháp của nguyên bản.
