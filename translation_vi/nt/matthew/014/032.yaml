  text: And when they got into the boat[a], the wind ceased.
translation:
  language: vi
  text: Khi họ lên thuyền[a], gió lặng đi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch sát cấu trúc hơn: “Sau khi họ lên thuyền.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναβάντων αὐτῶν
  choice: khi họ lên
  rationale: Cụm sở hữu cách độc lập diễn tả thời gian được chuyển thành mệnh đề thời gian tự nhiên trong tiếng Việt. “Lên thuyền” vừa sát nghĩa cơ bản của ἀναβαίνω vừa là cách nói thông dụng.
- source_word: εἰς τὸ πλοῖον
  choice: thuyền
  rationale: Trong bối cảnh Biển Ga-li-lê, πλοῖον chỉ chiếc thuyền của các môn đồ; “thuyền” tự nhiên và phù hợp hơn “tàu”.
- source_word: ἐκόπασεν
  choice: lặng
  rationale: κοπάζω nói về gió ngừng hoặc dịu xuống. “Gió lặng” là cách diễn đạt ngắn gọn, tự nhiên, không thêm ý về một tiến trình kéo dài.
- source_word: ὁ ἄνεμος
  choice: gió
  rationale: Chuyển ngữ trực tiếp chủ ngữ của động từ; tiếng Việt không cần biểu đạt mạo từ.
- source_word: καὶ
  choice: Khi …,
  rationale: Quan hệ nối tiếp của καί được thể hiện tự nhiên qua cấu trúc câu thời gian; không cần thêm “và” ở đầu câu.
theological_decisions:
- issue: Hàm ý về thẩm quyền của Chúa Giê-su trên thiên nhiên
  choice: Chỉ thuật lại rằng gió lặng khi họ lên thuyền, không thêm lời giải thích thần học.
  alternative: Diễn giải rõ đây là biểu hiện quyền năng kỳ diệu của Chúa Giê-su.
  rationale: Bản Hy Lạp kể sự việc một cách trực tiếp. Ý nghĩa thần học hiện rõ trong văn cảnh nhưng không nên được bổ sung vào chính câu dịch.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Lên thuyền” là cách nói tự nhiên trong tiếng Việt đồng thời giữ được nét nghĩa của động từ Hy Lạp.
