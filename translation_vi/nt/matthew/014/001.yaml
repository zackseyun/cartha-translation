base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/001.yaml
  text: At that time Herod the tetrarch heard the report about Jesus,[a]
translation:
  language: vi
  text: Lúc ấy, tiểu vương Hê-rốt nghe tin về Đức Giê-su.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “tin tức về Đức Giê-su.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν ἐκείνῳ τῷ καιρῷ
  choice: Lúc ấy
  rationale: Cụm từ chỉ thời gian này được chuyển sang cách nói tự nhiên, gọn và trang trọng trong tiếng Việt hiện đại.
- source_word: ἤκουσεν
  choice: nghe
  rationale: Giữ nghĩa trực tiếp của động từ ἀκούω, không diễn giải rộng thành “được biết”.
- source_word: Ἡρῴδης
  choice: Hê-rốt
  rationale: Dùng dạng phiên âm tên riêng đã quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
- source_word: ὁ τετραάρχης
  choice: tiểu vương
  rationale: Chỉ nhà cai trị một khu vực lệ thuộc dưới quyền đế quốc; cách gọi này tự nhiên hơn “tứ đầu chế” mà vẫn phân biệt với tước hiệu vua.
- source_word: τὴν ἀκοὴν
  choice: tin
  rationale: Trong ngữ cảnh, ἀκοή là điều người ta nghe được, tức tin tức hoặc lời đồn, chứ không phải khả năng nghe.
- source_word: Ἰησοῦ
  choice: về Đức Giê-su
  rationale: Sở hữu cách được diễn đạt tự nhiên bằng “về”, cho biết nội dung của tin ấy liên quan đến Đức Giê-su.
theological_decisions: []
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “Đức Giê-su” theo lối xưng gọi kính trọng phổ biến; “tiểu vương” truyền đạt chức vụ chính trị của τετραάρχης mà không đồng nhất Hê-rốt với một vị vua độc lập.
