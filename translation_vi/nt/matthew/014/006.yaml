  text: ⸂γενεσίοις δὲ γενομένοις⸃ τοῦ Ἡρῴδου ὠρχήσατο ἡ θυγάτηρ τῆς Ἡρῳδιάδος ἐν τῷ μέσῳ καὶ ἤρεσεν τῷ Ἡρῴδῃ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/006.yaml
  text: But when Herod’s birthday came[a], the daughter of Herodias danced in the midst and pleased Herod[b],
translation:
  language: vi
  text: Nhưng khi dịp mừng sinh nhật Hê-rốt[a] diễn ra, con gái của Hê-rô-đia nhảy múa giữa mọi người[b] và làm Hê-rốt hài lòng.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “khi đến sinh nhật Hê-rốt” hoặc “vào dịp mừng sinh nhật Hê-rốt.” Tiếng Hy Lạp nói đến dịp sinh nhật được cử hành.'
    reason: lexical_alternative
  - marker: b
    text: 'Nghĩa đen: “ở giữa.” Trong ngữ cảnh, có lẽ cô nhảy múa giữa những người đang tụ họp.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γενεσίοις ... γενομένοις
  choice: khi đến dịp sinh nhật
  rationale: Cụm này chỉ thời điểm diễn ra hoặc được tổ chức dịp sinh nhật. Cách dịch này tự nhiên trong tiếng Việt, đồng thời không khẳng định quá mức rằng từ Hy Lạp tự nó có nghĩa là một bữa tiệc.
- source_word: δὲ
  choice: Nhưng
  rationale: Ở đây δέ vừa chuyển tiếp câu chuyện vừa có sắc thái tương phản nhẹ với phần trước; “Nhưng” giữ được sắc thái ấy.
- source_word: ὠρχήσατο
  choice: đã nhảy múa
  rationale: Động từ ὀρχέομαι có nghĩa trực tiếp là nhảy múa; cách dịch đơn giản này không thêm chi tiết về loại hình hay tính chất của điệu múa.
- source_word: ἡ θυγάτηρ τῆς Ἡρῳδιάδος
  choice: con gái của Hê-rô-đia
  rationale: Giữ nguyên quan hệ sở thuộc trong bản Hy Lạp và không đưa tên Sa-lô-mê vào, vì câu này không nêu tên người con gái.
- source_word: ἐν τῷ μέσῳ
  choice: giữa mọi người
  rationale: Cụm từ theo nghĩa đen là “ở giữa.” Trong bối cảnh, “giữa mọi người” diễn đạt tự nhiên vị trí giữa những người đang tụ họp, còn nghĩa đen được bảo lưu trong chú thích.
- source_word: ἤρεσεν τῷ Ἡρῴδῃ
  choice: làm Hê-rốt hài lòng
  rationale: ἀρέσκω với cách gián tiếp có nghĩa là làm ai hài lòng; cách diễn đạt này tự nhiên và không thêm động cơ hay hàm ý tình dục.
- source_word: Ἡρῴδου / Ἡρῴδῃ
  choice: Hê-rốt
  rationale: Dùng dạng phiên âm quen thuộc trong tiếng Việt cho tên riêng Ἡρῴδης.
- source_word: Ἡρῳδιάδος
  choice: Hê-rô-đia
  rationale: Dùng dạng phiên âm tiếng Việt rõ ràng và quen thuộc cho tên riêng Ἡρῳδιάς.
theological_decisions: []
