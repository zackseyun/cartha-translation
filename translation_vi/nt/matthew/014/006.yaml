  to: Nhưng khi dịp mừng sinh nhật Hê-rốt[a] diễn ra, con gái của Hê-rô-đia nhảy múa giữa mọi người[b] và làm Hê-rốt hài lòng.
  rationale: Chỉnh cấu trúc thời gian để tiếng Việt tự nhiên hơn và phản ánh rõ rằng γενεσίοις ... γενομένοις nói về dịp sinh nhật diễn ra/được cử hành, không chỉ một ngày trên lịch. Các yếu tố còn lại được giữ nguyên về nghĩa, bao gồm sự không nêu tên người con gái và tính trung tính của động từ “làm hài lòng.”
