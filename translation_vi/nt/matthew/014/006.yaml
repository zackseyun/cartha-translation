    rationale: Trong tiếng Việt, “đến” ở đây cần chủ ngữ đặt trước hoặc nên được thay bằng “diễn ra”; bản Hy Lạp nói đến lúc dịp sinh nhật được cử hành/xảy ra.
  - severity: low
    issue: Chú thích a lặp lại phương án “khi sinh nhật Hê-rốt đến” không tự nhiên bằng một cách diễn đạt Việt ngữ chuẩn hơn.
    rationale: Có thể giữ các lựa chọn dịch hợp lệ nhưng diễn đạt chúng tự nhiên, đồng thời phân biệt ngày sinh nhật với dịp mừng sinh nhật.
