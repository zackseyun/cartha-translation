- from: 'Khi chiều xuống, các môn đồ đến bên ngài và thưa: “Nơi này hoang vắng, mà giờ đã muộn rồi.[a] Xin cho đám đông ra về, để họ vào các làng mua thức ăn cho mình.”'
  to: 'Khi chiều xuống, các môn đệ đến gặp Người và thưa: “Nơi này hoang vắng, và giờ đã muộn rồi.[a] Xin cho đám đông ra về, để họ vào các làng mua thức ăn cho mình.”'
  rationale: 'Chỉnh sửa giới hạn ở cách dùng hiện đại và sắc thái liên kết: thay “môn đồ” bằng “môn đệ,” “đến bên ngài” bằng “đến gặp Người,” và “mà” bằng “và.” Ý nghĩa, mức độ trang trọng, tính mơ hồ của nguyên văn, và chú thích từ vựng đều được giữ nguyên.'
