id: MAT.14.15
reference: Matthew 14:15
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὀψίας δὲ γενομένης προσῆλθον αὐτῷ οἱ ⸀μαθηταὶ λέγοντες· Ἔρημός ἐστιν ὁ τόπος καὶ ἡ ὥρα ἤδη παρῆλθεν· ἀπόλυσον τοὺς ὄχλους, ἵνα ἀπελθόντες εἰς τὰς κώμας ἀγοράσωσιν ἑαυτοῖς βρώματα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/015.yaml
  text: When evening came[a], the disciples came to him and said, “The place is deserted, and the hour is already late. Send the crowds away[b], so that they may go into the villages and buy food for themselves.”
translation:
  language: vi
  text: 'Khi chiều xuống, các môn đệ đến gặp Người và thưa: “Nơi này hoang vắng, và giờ đã muộn rồi.[a] Xin cho đám đông ra về, để họ vào các làng mua thức ăn cho mình.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát: “giờ đã qua rồi.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀψίας δὲ γενομένης
  choice: Khi chiều xuống
  rationale: Kết cấu sở hữu cách tuyệt đối chỉ sự chuyển tiếp về thời gian. “Khi chiều xuống” tự nhiên trong văn kể chuyện tiếng Việt; không thêm một từ tương đương với “bấy giờ” vì bản Hy Lạp không có trạng từ chỉ thời điểm ấy.
- source_word: προσῆλθον αὐτῷ
  choice: đến bên ngài
  rationale: προσέρχομαι có nghĩa là đến gần hoặc đến với một người. Cách dịch này tự nhiên, đồng thời giữ đại từ của nguyên văn.
- source_word: οἱ μαθηταὶ
  choice: các môn đồ
  rationale: Danh từ có mạo từ chỉ nhóm môn đồ đã được biết trong ngữ cảnh; không thêm từ sở hữu vốn không có trong nguyên văn.
- source_word: Ἔρημός ἐστιν ὁ τόπος
  choice: Nơi này hoang vắng
  rationale: ἔρημος mô tả một nơi ít hoặc không có dân cư. “Hoang vắng” truyền đạt đúng hoàn cảnh mà không nhất thiết gợi đến sa mạc.
- source_word: ἡ ὥρα ἤδη παρῆλθεν
  choice: giờ đã muộn rồi
  rationale: Nghĩa sát là “giờ đã qua rồi”, nhưng trong ngữ cảnh đây là cách nói cho biết thời gian trong ngày đã muộn. Bản dịch chính diễn đạt tự nhiên và chú thích giữ hình thức sát chữ.
- source_word: ἀπόλυσον τοὺς ὄχλους
  choice: Xin cho đám đông ra về
  rationale: ἀπολύω ở đây có nghĩa là cho giải tán hoặc cho ra về. “Xin cho… ra về” phù hợp với lời thỉnh cầu và tự nhiên hơn “giải phóng” trong ngữ cảnh này.
- source_word: ἵνα ἀπελθόντες
  choice: để họ vào
  rationale: Mệnh đề ἵνα cùng phân từ diễn tả mục đích và chuỗi hành động. Tiếng Việt có thể diễn đạt gọn bằng “để họ vào” mà không làm mất ý họ rời chỗ ấy để đi đến các làng.
- source_word: εἰς τὰς κώμας
  choice: vào các làng
  rationale: κώμη là làng; giới từ εἰς được thể hiện trực tiếp bằng “vào”. Không thêm “gần đó” vì ý này chỉ được suy ra từ ngữ cảnh.
- source_word: ἀγοράσωσιν ἑαυτοῖς βρώματα
  choice: mua thức ăn cho mình
  rationale: βρώματα là thức ăn, còn ἑαυτοῖς là đại từ phản thân. Cách dịch này rõ ràng và giữ cả hai yếu tố.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “môn đồ” như thuật ngữ quen thuộc; “ngài” giữ cách xưng hô tôn kính mà không thêm danh xưng không có trong câu Hy Lạp. Dấu nối δέ được thể hiện nhẹ bằng “mà” trong lời nói, không thêm từ mở đầu như “bấy giờ”.
