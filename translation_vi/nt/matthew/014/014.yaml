source:
  edition: SBLGNT
  text: καὶ ⸀ἐξελθὼν εἶδεν πολὺν ὄχλον, καὶ ἐσπλαγχνίσθη ἐπ’ αὐτοῖς καὶ ἐθεράπευσεν τοὺς ἀρρώστους αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/014.yaml
  text: And when he went ashore[a], he saw a large crowd[b], and he had compassion on them and healed their sick.
translation:
  language: vi
  text: Khi lên bờ[a], Ngài thấy một đám đông lớn, động lòng thương xót họ[b] và chữa lành những người bệnh trong đám đông ấy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát hơn: “đi ra” hoặc “bước ra”. Theo mạch văn, có lẽ Ngài từ thuyền lên bờ.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “cảm thương họ” hoặc “xúc động vì thương xót họ”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθὼν
  choice: khi lên bờ
  rationale: Phân từ này có nghĩa đen là “đi ra/bước ra”. Trong mạch văn Chúa Giê-su vừa đi thuyền đến nơi này, “lên bờ” diễn đạt tự nhiên hành động được ngụ ý mà vẫn ghi chú nghĩa sát chữ.
- source_word: εἶδεν
  choice: Ngài thấy
  rationale: Động từ ὁράω ở đây mang nghĩa thông thường là nhìn thấy. “Ngài” là đại từ trang trọng, tự nhiên trong văn phong Kinh Thánh tiếng Việt và chỉ chủ thể Chúa Giê-su đã nêu trong ngữ cảnh.
- source_word: πολὺν ὄχλον
  choice: một đoàn dân đông
  rationale: Cụm từ chỉ một đám đông có số lượng lớn. “Một đoàn dân đông” rõ nghĩa, trang trọng vừa phải và tự nhiên trong tiếng Việt hiện đại.
- source_word: ἐσπλαγχνίσθη ἐπ’ αὐτοῖς
  choice: động lòng thương xót họ
  rationale: Động từ diễn tả lòng trắc ẩn sâu xa. Cách dịch này giữ được sắc thái cảm xúc mạnh mà không thêm động cơ hay nội dung thần học ngoài câu.
- source_word: ἐθεράπευσεν
  choice: chữa lành
  rationale: Trong ngữ cảnh này, θεραπεύω nói đến việc làm cho người bệnh được lành; “chữa lành” là cách diễn đạt quen thuộc và chính xác.
- source_word: τοὺς ἀρρώστους αὐτῶν
  choice: những người bệnh trong số họ
  rationale: Tính từ được dùng như danh từ chỉ những người đau yếu thuộc về hoặc ở trong đoàn dân. Cách diễn đạt này tránh khả năng “người bệnh của họ” bị hiểu như quan hệ sở hữu cứng nhắc trong tiếng Việt.
theological_decisions:
- issue: Cách diễn đạt phản ứng cảm xúc của Chúa Giê-su
  choice: động lòng thương xót họ
  alternative: cảm thương họ
  rationale: Bản dịch giữ lòng thương xót sâu xa của Chúa Giê-su như phản ứng dẫn đến việc chữa lành, nhưng không cường điệu hoặc giải thích thêm bản chất cảm xúc ấy.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Câu giữ nhịp kể chuyện gọn; dùng “rồi” để thể hiện diễn tiến tự nhiên giữa lòng thương xót và hành động chữa lành mà không khẳng định một quan hệ nhân quả mạnh hơn nguyên văn.
