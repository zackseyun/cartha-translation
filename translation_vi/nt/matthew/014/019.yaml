id: MAT.14.19
reference: Matthew 14:19
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ κελεύσας τοὺς ὄχλους ἀνακλιθῆναι ἐπὶ ⸂τοῦ χόρτου⸃, λαβὼν τοὺς πέντε ἄρτους καὶ τοὺς δύο ἰχθύας, ἀναβλέψας εἰς τὸν οὐρανὸν εὐλόγησεν καὶ κλάσας ἔδωκεν τοῖς μαθηταῖς τοὺς ἄρτους οἱ δὲ μαθηταὶ τοῖς ὄχλοις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/019.yaml
  text: And after ordering the crowds to recline on the grass[a], he took the five loaves and the two fish, looked up to heaven, blessed, and after breaking the loaves he gave them to the disciples, and the disciples to the crowds.
translation:
  language: vi
  text: Ngài truyền cho đoàn dân ngồi xuống trên cỏ. Rồi Ngài cầm lấy năm cái bánh và hai con cá, ngước mắt lên trời, chúc phước[a], bẻ bánh ra và trao cho các môn đồ; các môn đồ phân phát cho đoàn dân.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể hiểu là “chúc tụng Đức Chúa Trời” hoặc “dâng lời chúc phước.” Tiếng Hy Lạp chỉ nói “chúc phước,” không nêu rõ đối tượng.
    reason: Bảo tồn sự mơ hồ thực sự của εὐλόγησεν không có tân ngữ được nêu rõ.
lexical_decisions:
- source_word: κελεύσας
  choice: truyền
  rationale: Diễn đạt tự nhiên nhưng vẫn giữ lực của một lời chỉ thị có thẩm quyền; quan hệ thời gian của phân từ aorist được thể hiện qua trình tự câu và từ “Rồi”.
- source_word: τοὺς ὄχλους
  choice: đoàn dân
  rationale: Phù hợp văn phong tường thuật Kinh Thánh hiện đại, chỉ đám đông tụ họp mà không dùng từ cổ.
- source_word: ἀνακλιθῆναι
  choice: ngồi xuống
  rationale: Trong bối cảnh dùng bữa, động từ có nghĩa ngả mình hoặc nằm dựa; “ngồi xuống” là cách nói tự nhiên, dễ hiểu trong tiếng Việt hiện đại mà vẫn truyền đạt việc ổn định chỗ để ăn.
- source_word: ἐπὶ τοῦ χόρτου
  choice: trên cỏ
  rationale: Dịch trực tiếp địa điểm, không thêm chi tiết “xanh” vốn không có trong bản văn Ma-thi-ơ.
- source_word: λαβὼν
  choice: cầm lấy
  rationale: Thể hiện hành động nhận và cầm bánh cá trước khi chúc phước.
- source_word: τοὺς πέντε ἄρτους
  choice: năm cái bánh
  rationale: ἄρτος ở đây chỉ những ổ hoặc bánh dùng làm lương thực; “cái bánh” tự nhiên hơn “ổ bánh” trong tiếng Việt và không áp đặt hình dạng.
- source_word: τοὺς δύο ἰχθύας
  choice: hai con cá
  rationale: Cách gọi số lượng cá thông dụng và chính xác trong tiếng Việt.
- source_word: ἀναβλέψας εἰς τὸν οὐρανὸν
  choice: ngước mắt lên trời
  rationale: Thành ngữ tiếng Việt tự nhiên, giữ cả hướng nhìn lên và đối tượng là trời.
- source_word: εὐλόγησεν
  choice: chúc phước
  rationale: Giữ nghĩa trực tiếp của động từ mà không tự ý thêm tân ngữ; chú thích bảo tồn khả năng đây là lời chúc tụng Đức Chúa Trời hoặc lời cầu phước.
- source_word: κλάσας
  choice: bẻ bánh ra
  rationale: Bổ sung tân ngữ được hiểu rõ từ τοὺς ἄρτους trong mệnh đề kế tiếp, tạo câu tiếng Việt tự nhiên.
- source_word: ἔδωκεν τοῖς μαθηταῖς τοὺς ἄρτους
  choice: trao cho các môn đồ
  rationale: “Trao” diễn đạt rõ việc Chúa Giê-su đưa bánh cho môn đồ; bánh là tân ngữ đã nêu ngay trước nên không cần lặp lại.
- source_word: οἱ δὲ μαθηταὶ τοῖς ὄχλοις
  choice: các môn đồ phân phát cho đoàn dân
  rationale: Khôi phục động từ bị tỉnh lược trong tiếng Hy Lạp. “Phân phát” làm rõ môn đồ chuyển bánh đến đám đông mà không đổi nội dung.
theological_decisions:
- issue: Tân ngữ không được nêu của εὐλόγησεν
  choice: 'Không thêm tân ngữ trong chính văn: “chúc phước”'
  alternative: “chúc tụng Đức Chúa Trời,” “dâng lời chúc phước,” hoặc “chúc phước cho bánh và cá”
  rationale: Bản Hy Lạp chỉ nói “Ngài chúc phước” mà không xác định tân ngữ. Giữ cách nói không có tân ngữ và đưa các cách hiểu khả hữu vào chú thích tránh quyết định thay cho bản văn.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Ngài” cho Chúa Giê-su và “môn đồ” theo cách dùng Kinh Thánh quen thuộc; tránh từ quá cổ. Chia câu theo nhịp kể tự nhiên nhưng giữ đầy đủ chuỗi hành động của nguyên văn.
