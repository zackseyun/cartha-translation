  source_fidelity: 'Bản dịch giữ đúng chuỗi hành động của nguyên văn: truyền bảo đám đông ngồi xuống trên cỏ, cầm năm bánh và hai cá, ngước lên trời, chúc phước, bẻ bánh, trao cho các môn đồ, rồi các môn đồ phân phát cho đám đông. Việc dịch ἀνακλιθῆναι là “ngồi xuống” là cách diễn đạt Việt ngữ tự nhiên trong ngữ cảnh dùng bữa, dù sắc thái nguyên thủy có thể bao hàm ngả mình dự tiệc. “Chúc phước” không thêm tân ngữ, phù hợp với εὐλόγησεν không nêu rõ đối tượng.'
