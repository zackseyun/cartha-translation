  text: οἱ δὲ ἐσθίοντες ἦσαν ἄνδρες ὡσεὶ πεντακισχίλιοι χωρὶς γυναικῶν καὶ παιδίων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/021.yaml
  text: Those who ate were about five thousand men[a], besides women and children.
translation:
  language: vi
  text: Số người đã ăn là khoảng năm ngàn đàn ông,[a] không kể phụ nữ và trẻ em.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “Có khoảng năm ngàn đàn ông đã ăn, chưa tính phụ nữ và trẻ em.”'
    reason: Cách diễn đạt khác làm rõ rằng phụ nữ và trẻ em không được tính trong con số năm ngàn.
lexical_decisions:
- source_word: οἱ δὲ ἐσθίοντες
  choice: Số người ăn
  rationale: Phân từ hiện tại có mạo từ được dùng như danh từ, chỉ những người đã tham dự bữa ăn. Cách diễn đạt này tự nhiên trong tiếng Việt và không nhấn quá mức sắc thái thể; δέ chỉ chuyển nhẹ mạch kể nên không cần dịch riêng.
- source_word: ἦσαν
  choice: có
  rationale: Động từ εἰμί ở đây nối nhóm người với con số. Cấu trúc tiếng Việt “Số người ăn có khoảng...” truyền đạt tự nhiên ý nghĩa của mệnh đề.
- source_word: ἄνδρες
  choice: đàn ông
  rationale: ἀνήρ ở đây chỉ người nam, phân biệt với phụ nữ và trẻ em được nhắc riêng; “đàn ông” giữ đúng nét nghĩa giới tính của nguyên văn.
- source_word: ὡσεὶ
  choice: khoảng
  rationale: ὡσεί biểu thị con số ước lượng; “khoảng” là cách nói hiện đại và tự nhiên.
- source_word: πεντακισχίλιοι
  choice: năm ngàn
  rationale: Chuyển trực tiếp số đếm bổ nghĩa cho ἄνδρες.
- source_word: χωρὶς
  choice: không kể
  rationale: χωρίς với sở hữu cách cho biết phụ nữ và trẻ em không nằm trong con số đã nêu. “Không kể” rõ ràng và tự nhiên hơn “ngoài ra” trong văn cảnh thống kê.
- source_word: γυναικῶν
  choice: phụ nữ
  rationale: γυνή có thể là “phụ nữ” hoặc “vợ”, nhưng tại đây không nói đến quan hệ hôn nhân; “phụ nữ” phù hợp với công thức đếm.
- source_word: παιδίων
  choice: trẻ em
  rationale: παιδίον chỉ trẻ nhỏ hoặc trẻ em; “trẻ em” là từ số nhiều tự nhiên và không thu hẹp độ tuổi quá mức.
theological_decisions:
- issue: Cách gọi theo giới tính trong việc đếm một đám đông gồm nhiều nhóm
  choice: Dịch ἄνδρες là “đàn ông” và giữ rõ rằng phụ nữ cùng trẻ em không được tính vào con số năm ngàn.
  alternative: Dịch ἄνδρες là “người” hoặc “mọi người”.
  rationale: Nguyên văn Hy Lạp đếm riêng người nam rồi nhắc phụ nữ và trẻ em như các nhóm không nằm trong con số ấy. Dùng “người” sẽ xóa mất sự phân biệt có chủ ý của câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “năm ngàn” theo cách nói phổ biến; dấu phẩy trước ký hiệu chú thích giúp câu tiếng Việt dễ đọc. Chú thích nêu cách diễn đạt khác của toàn câu để tránh lặp một phương án gần như y hệt chính văn.
