translation:
  language: vi
  text: Vì thế, ông đã thề hứa sẽ cho cô bất cứ điều gì cô xin[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “bất cứ điều gì cô sẽ xin.” Tiếng Hy Lạp dùng một mệnh đề quan hệ bất định (ὃ ἐὰν αἰτήσηται), diễn tả một lời thỉnh cầu tương lai chưa được xác định.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅθεν
  choice: Vì thế
  rationale: Liên từ chỉ kết quả, nối trực tiếp với việc nhà vua hài lòng vì điệu múa trong câu trước; “Vì thế” tự nhiên và giữ được quan hệ suy luận.
- source_word: μετὰ ὅρκου
  choice: thề hứa
  rationale: Cụm từ diễn tả lời hứa được xác nhận bằng lời thề. “Thề hứa” là cách nói gọn, tự nhiên trong tiếng Việt và vẫn giữ cả ý hứa lẫn ý thề.
- source_word: ὡμολόγησεν
  choice: hứa
  rationale: Trong ngữ cảnh này, động từ mang nghĩa cam kết sẽ làm một việc, không phải “xưng nhận”; “hứa” phù hợp với bổ ngữ nguyên mẫu δοῦναι.
- source_word: αὐτῇ
  choice: cho cô
  rationale: Đại từ tặng cách chỉ cô gái vừa múa. Tiếng Việt diễn đạt tự nhiên bằng “cho cô” trong kết cấu “ban cho cô”.
- source_word: δοῦναι
  choice: sẽ ban
  rationale: Động từ nguyên mẫu nêu nội dung lời hứa. “Ban” phù hợp với người nói là vua và đối tượng là điều cô gái xin; “sẽ” thể hiện hành động tương lai nằm trong lời hứa.
- source_word: ὃ ἐὰν αἰτήσηται
  choice: bất cứ điều gì cô xin
  rationale: Đại từ quan hệ kết hợp với ἐάν và thức giả định tạo mệnh đề quan hệ bất định, nói đến một yêu cầu tương lai chưa xác định. “Bất cứ điều gì cô xin” giữ tính rộng mở ấy và tự nhiên trong tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Chủ ngữ “vua” được nêu rõ theo ngữ cảnh tiếng Việt; nguyên văn Hy Lạp chỉ hàm ý “ông”. Dùng “cô” để chỉ cô gái, tránh sắc thái quá cổ của “nàng”.
