source:
  edition: SBLGNT
  text: Καὶ εὐθέως ⸀ἠνάγκασεν τοὺς μαθητὰς ἐμβῆναι ⸀εἰς πλοῖον καὶ προάγειν αὐτὸν εἰς τὸ πέραν, ἕως οὗ ἀπολύσῃ τοὺς ὄχλους.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/022.yaml
  text: And immediately he compelled the disciples to get into the boat and go on ahead of him to the other side[a], until he should dismiss the crowds.
translation:
  language: vi
  text: Lập tức, ngài buộc các môn đồ phải lên thuyền và đi trước ngài sang bờ bên kia, cho đến khi ngài giải tán đám đông.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “cho đám đông ra về.”'
    reason: Nêu cách diễn đạt tự nhiên khác cho ἀπολύσῃ mà không thay đổi ý nghĩa trong ngữ cảnh.
lexical_decisions:
- source_word: εὐθέως
  choice: ngay sau đó
  rationale: Diễn đạt sự chuyển tiếp tức thời và nhịp kể nhanh; tự nhiên hơn “lập tức” trong mạch tường thuật này.
- source_word: ἠνάγκασεν
  choice: buộc
  rationale: Giữ được sắc thái thúc ép hoặc yêu cầu mạnh của ἀναγκάζω mà không hàm ý bạo lực thể chất.
- source_word: τοὺς μαθητάς
  choice: các môn đồ
  rationale: Chỉ nhóm môn đồ đã được xác định trong ngữ cảnh; tiếng Việt không cần thêm từ sở hữu vốn không có trực tiếp trong tiếng Hy Lạp.
- source_word: ἐμβῆναι εἰς πλοῖον
  choice: lên thuyền
  rationale: Cách nói tự nhiên trong tiếng Việt cho hành động bước vào và đi bằng thuyền.
- source_word: προάγειν αὐτόν
  choice: đi trước ngài
  rationale: Phản ánh đúng ý các môn đồ khởi hành trước Chúa Giê-su, đồng thời giữ đại từ làm bổ ngữ của động từ.
- source_word: εἰς τὸ πέραν
  choice: sang bờ bên kia
  rationale: Diễn đạt rõ thành ngữ chỉ phía đối diện của hồ.
- source_word: ἕως οὗ ἀπολύσῃ
  choice: cho đến khi ngài giải tán
  rationale: Giữ quan hệ thời gian hướng tới một điểm tương lai so với mệnh lệnh chính, không đổi thành quan hệ đồng thời như “trong khi”.
- source_word: τοὺς ὄχλους
  choice: đám đông
  rationale: “Đám đông” là cách gọi tập thể tự nhiên trong tiếng Việt hiện đại; dạng số nhiều của tiếng Hy Lạp không nên được tái tạo bằng cách nói gượng gạo như “các đám đông”.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ lực của động từ “buộc” và cấu trúc thời gian “cho đến khi”; dùng “lên thuyền” và “sang bờ bên kia” theo lối nói tiếng Việt tự nhiên. Đại từ “ngài” tiếp nối chủ thể đã rõ trong văn cảnh mà không thêm tên riêng vào bản Hy Lạp.
