review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch phản ánh đúng các thành tố chính: ἠνάγκασεν là sự ép buộc mạnh, các môn đồ lên thuyền, đi trước ngài sang phía bên kia, và ngài giải tán đám đông. Tuy nhiên, “Ngay sau đó” có thể chỉ một hành động kế tiếp, yếu hơn sắc thái tức thì của εὐθέως; “Lập tức” sát hơn. Thêm “phải” giúp cấu trúc tiếng Việt biểu lộ rõ rằng động từ “buộc” chi phối cả hai hành động nguyên mẫu.'
