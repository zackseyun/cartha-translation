  terminology: “Môn đồ,” “thuyền,” “bờ bên kia,” và “giải tán đám đông” đều phù hợp ngữ cảnh. Đại từ “ngài” có chủ thể rõ từ văn mạch; không cần thêm tên riêng vốn không có trong câu Hy Lạp.
  issues:
