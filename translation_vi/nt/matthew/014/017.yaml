  text: οἱ δὲ λέγουσιν αὐτῷ· Οὐκ ἔχομεν ὧδε εἰ μὴ πέντε ἄρτους καὶ δύο ἰχθύας.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/017.yaml
  text: But they said to him[a], “We have nothing here except five loaves and two fish.”
translation:
  language: vi
  text: 'Nhưng họ thưa với Ngài: “Ở đây chúng con chỉ có năm ổ bánh và hai con cá.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát hơn: “Chúng con không có gì ở đây, ngoại trừ năm ổ bánh và hai con cá.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ
  choice: Nhưng họ
  rationale: Mạo từ οἱ chỉ lại các môn đồ làm chủ ngữ; δέ biểu thị sự tương phản nhẹ với lời Chúa Giê-su vừa phán, nên dịch tự nhiên là “Nhưng”.
- source_word: λέγουσιν αὐτῷ
  choice: họ thưa với Ngài
  rationale: Động từ hiện tại lịch sử λέγουσιν được chuyển sang lối kể tự nhiên trong tiếng Việt. “Thưa” phù hợp với lời các môn đồ nói trực tiếp với Chúa Giê-su, còn “Ngài” duy trì sắc thái trang trọng mà không thêm nội dung vào lời nói.
- source_word: Οὐκ ἔχομεν ὧδε εἰ μὴ
  choice: Ở đây chúng con chỉ có
  rationale: Cấu trúc phủ định kèm εἰ μή mang nghĩa loại trừ, được diễn đạt tự nhiên bằng “chỉ có”. Cách dịch sát cấu trúc phủ định được giữ trong chú thích.
- source_word: πέντε ἄρτους
  choice: năm ổ bánh
  rationale: ἄρτος ở số nhiều chỉ các ổ bánh; “ổ bánh” là cách nói rõ ràng, tự nhiên trong tiếng Việt hiện đại.
- source_word: δύο ἰχθύας
  choice: hai con cá
  rationale: ἰχθύας là dạng số nhiều của “cá”; danh từ chỉ loại “con” là cách đếm tự nhiên trong tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “chúng con” trong lời các môn đồ thưa với Chúa Giê-su; giữ sự tương phản nhẹ bằng “Nhưng”. Dấu chú thích [a] đặt sau toàn bộ câu nói vì chú thích giải thích cấu trúc của cả mệnh đề.
