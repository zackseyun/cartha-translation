  text: ὁ δὲ Ἰησοῦς εἶπεν αὐτοῖς· Οὐ χρείαν ἔχουσιν ἀπελθεῖν· δότε αὐτοῖς ὑμεῖς φαγεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/016.yaml
  text: But Jesus said to them[a], “They have no need to go away; you yourselves give them something to eat.”
translation:
  language: vi
  text: 'Nhưng Đức Giê-su bảo các môn đồ: “Họ không cần phải ra về; chính anh em hãy cho họ ăn.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: Nhưng
  rationale: Đánh dấu sự tương phản nhẹ với đề nghị trước đó của các môn đồ là cho đám đông ra về.
- source_word: εἶπεν αὐτοῖς
  choice: bảo các môn đồ
  rationale: Diễn đạt tự nhiên hành động nói trực tiếp; đối tượng của lời nói được làm rõ theo ngữ cảnh là các môn đồ.
- source_word: Οὐ χρείαν ἔχουσιν ἀπελθεῖν
  choice: Họ không cần phải đi đâu cả
  rationale: Chuyển ngữ tự nhiên thành ngữ ἔχω χρείαν và ἀπέρχομαι trong ngữ cảnh đám đông được đề nghị rời nơi ấy; “đi đâu cả” nhấn mạnh sự phủ định mà không đổi nghĩa.
- source_word: δότε αὐτοῖς ... φαγεῖν
  choice: hãy cho họ ăn
  rationale: Trong tiếng Việt, “cho họ ăn” diễn đạt tự nhiên cấu trúc ‘trao/cho họ để ăn’, không cần thêm một tân ngữ như “thứ gì đó”.
- source_word: ὑμεῖς
  choice: chính anh em
  rationale: Đại từ được nêu tường minh trong tiếng Hy Lạp mang sắc thái nhấn mạnh; “chính anh em” bảo toàn trọng tâm đặt trên các môn đồ.
theological_decisions:
- issue: Sự nhấn mạnh vào vai trò của các môn đồ trong mệnh lệnh của Đức Giê-su
  choice: “chính anh em hãy cho họ ăn”
  alternative: “anh em hãy cho họ ăn”
  rationale: Bảo toàn sắc thái nhấn mạnh của đại từ ὑμεῖς mà không thêm cách giải thích thần học.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Giê-su” và cách xưng hô “anh em” phù hợp lời Đức Giê-su nói với các môn đồ. Không cần chú thích vì các phương án dịch khác không tạo ra khác biệt đáng kể về nghĩa.
