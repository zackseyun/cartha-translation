    rationale: Cụm này gợi ý phủ định điểm đến (“không cần đi bất cứ đâu”), còn động từ Hy Lạp chỉ việc rời đi/ra về. “Ra về” giữ được ý không cần giải tán đám đông mà không thêm nghĩa.
