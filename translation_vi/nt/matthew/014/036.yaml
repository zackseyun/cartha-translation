id: MAT.14.36
reference: Matthew 14:36
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ παρεκάλουν αὐτὸν ἵνα μόνον ἅψωνται τοῦ κρασπέδου τοῦ ἱματίου αὐτοῦ· καὶ ὅσοι ἥψαντο διεσώθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/036.yaml
  text: And they begged him that they might only touch the fringe of his garment[b][a], and as many as touched it were healed.
translation:
  language: vi
  text: Họ cứ nài xin ngài cho họ chỉ được chạm vào tua áo của ngài[a]; và tất cả những ai chạm vào đều được chữa lành[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “gấu áo” hoặc “mép áo”; từ Hy Lạp có thể chỉ đường viền hay tua của áo, có lẽ bao gồm cả tua gắn ở đó.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “được bình phục”; động từ Hy Lạp có thể mang nghĩa “được chữa lành”, “được cứu” hoặc “được giải cứu”, nhưng trong ngữ cảnh này nói đến sự chữa lành thân thể.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρεκάλουν
  choice: cứ nài xin
  rationale: Thì vị hoàn diễn tả lời khẩn cầu tiếp diễn hoặc lặp lại; “cứ nài xin” truyền đạt cả tính liên tục lẫn sự tha thiết bằng tiếng Việt tự nhiên.
- source_word: ἵνα μόνον ἅψωνται
  choice: cho họ chỉ được chạm vào
  rationale: ἵνα với thức giả định nêu nội dung điều họ cầu xin, còn μόνον nhấn mạnh rằng họ chỉ xin được chạm vào mà thôi.
- source_word: τοῦ κρασπέδου τοῦ ἱματίου αὐτοῦ
  choice: tua áo của ngài
  rationale: κράσπεδον có thể chỉ mép, gấu hoặc tua của áo; “tua áo” giữ được khả năng liên hệ đến tua nơi viền áo mà không giải thích dài dòng trong chính câu. ἱμάτιον được diễn đạt gọn là “áo”, không xác định quá mức là áo choàng hay lễ phục.
- source_word: ὅσοι
  choice: tất cả những ai
  rationale: Cách nói này thể hiện đầy đủ ý định lượng và phân phối của ὅσοι, đồng thời tự nhiên hơn lối dịch sát chữ trong tiếng Việt.
- source_word: ἥψαντο
  choice: chạm vào
  rationale: Dạng trung của ἅπτω tại đây mang nghĩa thông thường là “chạm vào”; đối tượng được hiểu rõ từ cụm “tua áo” ngay trước đó.
- source_word: διεσώθησαν
  choice: được chữa lành
  rationale: Trong bối cảnh những người bệnh tìm cách chạm vào áo Chúa Giê-su, động từ διασῴζω chỉ việc được chữa khỏi hoặc làm cho bình phục; “được chữa lành” rõ nghĩa và phù hợp mạch văn.
theological_decisions:
- issue: Nghĩa của διεσώθησαν trong bối cảnh phép lạ chữa bệnh
  choice: được chữa lành về thể chất
  alternative: được cứu; được bình phục
  rationale: διασῴζω có thể mang nghĩa rộng hơn là cứu thoát, nhưng ngữ cảnh trực tiếp nói về người bệnh và sự chữa lành. Bản dịch chính nêu nghĩa theo ngữ cảnh, còn chú thích giữ lại phạm vi nghĩa rộng của động từ mà không áp đặt một kết luận cứu rỗi học.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Đại từ “ngài” được viết thường theo quy tắc văn bản chung, tránh đưa thêm quy ước tôn phái. Dấu chấm phẩy giữ mối liên kết chặt giữa lời cầu xin và kết quả chữa lành.
