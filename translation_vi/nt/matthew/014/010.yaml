  text: And he sent and beheaded John in the prison[a].
translation:
  language: vi
  text: Vua sai người chém đầu Giăng trong tù.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc, sát cấu trúc Hy Lạp hơn: “Sau khi phái đi, vua chém đầu Giăng trong tù.” Bản văn dùng một phân từ aorist (“phái đi”) trước động từ chính (“chém đầu”); trong ngữ cảnh, hành động được thực hiện qua những người được sai đi.'
    reason: Giải thích cấu trúc ngữ pháp và cách bản dịch diễn đạt hành động do vua sai người thực hiện, không khẳng định vua đích thân hành quyết.
lexical_decisions:
- source_word: καὶ
  choice: Vua
  rationale: Liên từ καί tiếp nối câu chuyện; trong tiếng Việt, không nhất thiết phải dịch riêng là “và”. Chủ ngữ được nêu lại là “Vua” theo ngữ cảnh để câu đứng riêng vẫn rõ ràng.
- source_word: πέμψας
  choice: sai người
  rationale: Phân từ bất định quá khứ của πέμπω cho biết vua phái người đi trước khi việc chém đầu xảy ra. “Sai người” tự nhiên trong tiếng Việt và làm rõ rằng vua không đích thân thi hành.
- source_word: ἀπεκεφάλισεν
  choice: chém đầu
  rationale: Động từ ἀποκεφαλίζω có nghĩa cụ thể là chém đầu. Cách diễn đạt này giữ nguyên tính trực tiếp của hành động được quy cho chủ thể, đồng thời kết hợp tự nhiên với “sai người”.
- source_word: τὸν Ἰωάννην
  choice: Giăng
  rationale: Dùng dạng tên quen thuộc trong truyền thống Kinh Thánh tiếng Việt; câu này chỉ ghi tên riêng, không thêm danh hiệu “Báp-tít”.
- source_word: ἐν τῇ φυλακῇ
  choice: trong tù
  rationale: φυλακή ở đây chỉ nơi giam giữ. “Trong tù” là cách nói tự nhiên, hiện đại và vẫn giữ rõ ý nghĩa địa điểm.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện ngắn gọn, trang trọng vừa phải và dễ hiểu đối với độc giả Việt Nam hiện đại. Cách dịch tránh hàm ý rằng vua tự tay hành quyết Giăng nhưng vẫn giữ việc bản văn quy trách nhiệm trực tiếp cho vua.
