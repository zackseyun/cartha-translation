  to: Sau khi giải tán đám đông, Đức Giê-su lên núi một mình để cầu nguyện.[a] Đến tối, Người ở đó một mình.
  rationale: Bỏ “vẫn” để không thêm sắc thái tiếp diễn vượt quá điều nguyên văn khẳng định, đồng thời thay chú thích bằng lựa chọn từ vựng tự nhiên, phản ánh nghĩa thay thế “riêng tư” của κατ’ ἰδίαν. Các thành phần khác của bản dịch đã sát nguyên văn và phù hợp tiếng Việt hiện đại.
