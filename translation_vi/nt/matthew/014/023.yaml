source:
  edition: SBLGNT
  text: καὶ ἀπολύσας τοὺς ὄχλους ἀνέβη εἰς τὸ ὄρος κατ’ ἰδίαν προσεύξασθαι. ὀψίας δὲ γενομένης μόνος ἦν ἐκεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/023.yaml
  text: And after dismissing the crowds[a], he went up on the mountain by himself to pray. When evening came, he was there alone.
translation:
  language: vi
  text: Sau khi giải tán đám đông, Đức Giê-su lên núi một mình để cầu nguyện.[a] Đến tối, Người ở đó một mình.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “riêng tư” (κατ’ ἰδίαν).'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπολύσας
  choice: Sau khi giải tán
  rationale: Phân từ bất định diễn tả hành động xảy ra trước động từ chính; cách dịch này tự nhiên và không thêm sắc thái ngoài nguyên văn.
- source_word: τοὺς ὄχλους
  choice: đám đông
  rationale: Chỉ đoàn người tụ tập; tiếng Việt tự nhiên thường dùng danh từ tập hợp số ít dù nguyên ngữ ở số nhiều.
- source_word: ἀνέβη εἰς τὸ ὄρος
  choice: lên núi
  rationale: Diễn đạt tự nhiên chuyển động đi lên vùng núi mà không dùng lối văn cổ.
- source_word: κατ’ ἰδίαν
  choice: một mình
  rationale: Trong ngữ cảnh rời đám đông để cầu nguyện, cụm từ mang nghĩa tách riêng, không có người khác cùng đi.
- source_word: προσεύξασθαι
  choice: để cầu nguyện
  rationale: Động từ nguyên mẫu chỉ mục đích của việc lên núi.
- source_word: ὀψίας δὲ γενομένης
  choice: Đến tối
  rationale: Kết cấu sở hữu cách tuyệt đối nêu hoàn cảnh thời gian; cách diễn đạt này ngắn gọn và tự nhiên.
- source_word: μόνος ἦν ἐκεῖ
  choice: Người vẫn ở đó một mình
  rationale: Giữ cả địa điểm và sự cô độc; từ “vẫn” làm rõ tình trạng tiếp diễn đến lúc tối, phù hợp mạch văn.
theological_decisions: []
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “Đức Giê-su” và đại từ “Người” theo lối tôn kính phổ thông; tránh từ Hán-Việt cổ như “giải tán quần chúng” hoặc “đăng sơn”.
