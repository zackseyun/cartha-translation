source:
  edition: SBLGNT
  text: ⸀εὐθὺς δὲ ἐλάλησεν ⸂αὐτοῖς ὁ Ἰησοῦς⸃ λέγων· Θαρσεῖτε, ἐγώ εἰμι· μὴ φοβεῖσθε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/027.yaml
  text: But immediately Jesus spoke to them[a], saying, “Take courage; it is I. Do not be afraid.”
translation:
  language: vi
  text: 'Nhưng Đức Giê-su liền nói với họ: “Hãy vững lòng! Ta đây.[a] Đừng sợ!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay dịch sát hơn: “Ta là.” Cụm từ Hy Lạp ở đây có thể chỉ là lời tự nhận diện, nhưng một số người cũng nhận thấy âm vang có thể có của lời Đức Chúa Trời tự xưng.'
    reason: alternative_reading
lexical_decisions:
- source_word: εὐθύς
  choice: ngay lập tức
  rationale: Diễn đạt rõ sức mạnh thời gian của trạng từ và nối trực tiếp với nỗi sợ của các môn đồ ở câu trước.
- source_word: δὲ
  choice: Nhưng
  rationale: 'Thể hiện bước chuyển nhẹ có tính tương phản: các môn đồ đang kinh hãi, nhưng Đức Giê-su lập tức trấn an họ.'
- source_word: ἐλάλησεν αὐτοῖς ὁ Ἰησοῦς λέγων
  choice: Đức Giê-su nói với họ
  rationale: Tiếng Việt tự nhiên không cần dịch riêng phân từ λέγων sau động từ nói; dấu hai chấm truyền đạt đầy đủ chức năng dẫn lời.
- source_word: Θαρσεῖτε
  choice: Hãy vững lòng
  rationale: Lời truyền bảo số nhiều kêu gọi họ lấy lại sự can đảm và bình tâm; cách nói này tự nhiên, trang trọng và phù hợp một lời trấn an.
- source_word: ἐγώ εἰμι
  choice: Chính là Ta
  rationale: Truyền đạt ý tự nhận diện trong ngữ cảnh, đồng thời đại từ “Ta” phù hợp lời Đức Giê-su nói với các môn đồ. Chú thích giữ lại cách dịch sát hơn để bảo toàn khả năng cộng hưởng thần học.
- source_word: μὴ φοβεῖσθε
  choice: Đừng sợ
  rationale: Cách diễn đạt ngắn gọn, tự nhiên và đúng chức năng của mệnh lệnh phủ định trong lời trấn an.
theological_decisions:
- issue: ἐγώ εἰμι là lời tự nhận diện thông thường hay có thể gợi lại công thức thần linh “Ta là”
  choice: 'Trong chính văn dịch theo nghĩa tự nhận diện trong ngữ cảnh: “Chính là Ta.”'
  alternative: “Ta là.”
  rationale: Ngữ cảnh trực tiếp cho thấy Đức Giê-su đang giúp các môn đồ nhận ra Ngài giữa lúc họ kinh hãi. Tuy nhiên, tiếng Hy Lạp cũng có thể được dịch sát là “Ta là,” nên chú thích bảo tồn khả năng một số độc giả nhận thấy âm vang của lời tự xưng thần linh mà không áp đặt cách hiểu ấy.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Giê-su” theo lối gọi tôn kính phổ biến; lời thoại ngắn, mạnh, phù hợp tính khẩn cấp của cảnh. Dấu chú thích [a] được đặt ngay sau câu chứa cụm từ có cách dịch thay thế.
