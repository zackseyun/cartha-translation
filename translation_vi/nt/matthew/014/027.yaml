review_pass:
  verdict: revise
  source_fidelity: 'Bản nháp truyền đạt đúng mạch chính: tính tức thời, lời trấn an số nhiều, sự tự nhận diện của Đức Giê-su và mệnh lệnh đừng sợ. Tuy nhiên, chính văn lược bỏ chủ ngữ rõ ràng «Đức Giê-su» (ὁ Ἰησοῦς), và «Chính là Ta» tuy hiểu được nhưng không phải cách tự nhận diện tự nhiên nhất trong lời thoại tiếng Việt.'
  naturalness: «Đức Giê-su liền nói với họ» tự nhiên, gọn, và vẫn chuyển tải εὐθύς. «Ta đây!» là lời tự nhận diện thành ngữ, rõ ràng và tự nhiên hơn «Chính là Ta», đồng thời không biến ἐγώ εἰμι thành một khẳng định thần học dứt khoát. «Hãy vững lòng» và «Đừng sợ» phù hợp văn phong hiện đại, trang trọng.
  terminology: Giữ «Đức Giê-su» và đại từ «Ta» theo đăng ký tôn kính của bản nháp. Chú thích tiếp tục bảo lưu cách dịch sát «Ta là» và khả năng âm vang của lời tự xưng thần linh, không áp đặt cách đọc này.
  issues:
  - severity: medium
    issue: Chủ ngữ «Đức Giê-su» bị lược trong chính văn.
    rationale: Bản Hy Lạp nêu rõ ὁ Ἰησοῦς. Dù tiếng Việt có thể lược chủ ngữ theo ngữ cảnh, việc giữ tên ở một câu độc lập bảo đảm sự minh bạch và bám sát nguồn hơn.
  - severity: low
    issue: «Chính là Ta» kém tự nhiên trong lời tự nhận diện tiếng Việt.
    rationale: «Ta đây!» diễn đạt tự nhiên chức năng ngữ cảnh của ἐγώ εἰμι (“it is I / I am [here]”), còn chú thích giữ cách dịch sát hơn «Ta là» và sự mơ hồ thần học.
  revised_text: 'Nhưng Đức Giê-su liền nói với họ: “Hãy vững lòng! Ta đây.[a] Đừng sợ!”'
