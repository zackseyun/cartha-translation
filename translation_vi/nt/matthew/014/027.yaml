  rationale: Bản sửa giữ đầy đủ chủ ngữ được nêu trong nguồn, dùng «liền» để diễn đạt tự nhiên εὐθύς, và thay lời tự nhận diện bằng «Ta đây!» cho tiếng Việt hiện đại. Chú thích vẫn bảo tồn bản dịch sát cùng khả năng cộng hưởng thần học đang được tranh luận.
  reviewer_model: gpt-5.6-terra
