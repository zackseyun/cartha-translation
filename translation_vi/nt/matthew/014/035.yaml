  text: And when the men of that place recognized him[a], they sent into that whole surrounding region and brought to him all who were sick[b],
translation:
  language: vi
  text: Khi những người đàn ông ở nơi ấy nhận ra Ngài, họ sai người[a] đi khắp cả vùng lân cận ấy và đem đến với Ngài tất cả những người đau ốm.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: «họ sai đi khắp cả vùng lân cận ấy». Trong tiếng Hy Lạp, đối tượng được sai (chẳng hạn người hay lời nhắn) không được nêu rõ.'
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn: «tất cả những người đang ở trong tình trạng xấu»; đây là thành ngữ chỉ những người đau yếu hoặc bệnh tật.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιγνόντες
  choice: nhận ra
  rationale: Phân từ bất định quá khứ của ἐπιγινώσκω trong ngữ cảnh này chỉ việc nhận ra Chúa Giê-su, không phải bắt đầu biết Ngài theo nghĩa rộng hơn.
- source_word: οἱ ἄνδρες τοῦ τόπου ἐκείνου
  choice: những người đàn ông ở nơi ấy
  rationale: ἀνήρ chỉ cụ thể nam giới; τόπος là địa điểm nơi Chúa Giê-su vừa đến.
- source_word: ἀπέστειλαν εἰς ὅλην τὴν περίχωρον ἐκείνην
  choice: họ sai người đi khắp vùng lân cận
  rationale: ἀποστέλλω có nghĩa là sai đi; dù đối tượng được sai không nêu rõ trong tiếng Hy Lạp, tiếng Việt cần bổ sung 'người' để câu tự nhiên. 'Khắp vùng lân cận' diễn đạt toàn bộ khu vực xung quanh.
- source_word: προσήνεγκαν αὐτῷ
  choice: đưa đến cho Ngài
  rationale: Trong ngữ cảnh này, προσφέρω nói đến việc đưa người bệnh đến với Chúa Giê-su, không mang nghĩa dâng lễ.
- source_word: πάντας τοὺς κακῶς ἔχοντας
  choice: tất cả những người đau ốm
  rationale: κακῶς ἔχειν là một thành ngữ chỉ tình trạng đau yếu hoặc bệnh tật; 'đau ốm' tự nhiên và dễ hiểu trong tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng 'Ngài' để chỉ Chúa Giê-su theo mạch văn, đồng thời giữ rõ chủ thể nam giới của οἱ ἄνδρες. Không đặt chú thích vì các yếu tố hàm ẩn đã được chuyển đạt tự nhiên mà không tạo ra khác biệt diễn giải đáng kể.
