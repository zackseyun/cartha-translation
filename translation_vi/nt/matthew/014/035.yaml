revisions:
- from: Khi những người đàn ông ở nơi ấy nhận ra Ngài, họ sai người đi khắp vùng lân cận và đưa đến cho Ngài tất cả những người đau ốm.
  to: Khi những người đàn ông ở nơi ấy nhận ra Ngài, họ sai người[a] đi khắp cả vùng lân cận ấy và đem đến với Ngài tất cả những người đau ốm.[b]
  rationale: Bản sửa giữ sát nguyên văn và văn phong Việt hiện đại, đồng thời dùng chú thích để minh bạch rằng «người» là phần được bổ sung nhằm diễn đạt tự nhiên, chứ không phải tân ngữ được nêu rõ trong tiếng Hy Lạp. Cũng chỉnh «đưa đến cho Ngài» thành «đem đến với Ngài» cho tự nhiên hơn.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T02:47:48Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản nháp truyền đạt đúng mạch chính: những người đàn ông nhận ra Đức Giê-su, hành động truyền tin/sai phái trong vùng chung quanh, rồi đem người bệnh đến với Ngài. Tuy nhiên, «sai người» bổ sung một đối tượng không được nêu trong tiếng Hy Lạp. Đây là cách hiểu hợp lý và tự nhiên trong tiếng Việt, nhưng cần chú thích để cho thấy nguyên ngữ bỏ ngỏ đối tượng được sai.'
  naturalness: «Khi những người đàn ông ở nơi ấy nhận ra Ngài» tự nhiên. «đưa đến cho Ngài» hơi gượng khi tân ngữ là con người; «đem đến với Ngài» trôi chảy hơn trong văn phong hiện đại. «cả vùng lân cận ấy» diễn đạt rõ sắc thái toàn thể của ὅλην và quy chiếu của ἐκείνην.
  terminology: «những người đàn ông» bảo toàn giới tính của ἄνδρες; «nhận ra» phù hợp với ἐπιγνόντες; «đau ốm» chuyển đạt thành ngữ κακῶς ἔχοντας cách tự nhiên. Giữ «Ngài» nhất quán với đăng ký trang trọng của bản dịch.
  issues:
  - severity: medium
    issue: «sai người» làm rõ một đối tượng hàm ẩn trong ἀπέστειλαν.
    rationale: Tiếng Hy Lạp chỉ nói «họ sai/phái đi vào khắp vùng chung quanh ấy», không nêu rõ là người, sứ giả, hay lời nhắn. Có thể dùng «sai người» để câu Việt tự nhiên, nhưng phải đánh dấu bằng chú thích để không trình bày phần bổ sung này như điều minh nhiên của nguyên văn.
  - severity: low
    issue: Cụm «đưa đến cho Ngài» chưa tự nhiên bằng «đem đến với Ngài».
    rationale: Trong tiếng Việt hiện đại, «đem [người] đến với [ai]» là cách diễn đạt thông dụng hơn và vẫn phản ánh προσήνεγκαν αὐτῷ.
