id: MAT.14.30
reference: Matthew 14:30
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: βλέπων δὲ τὸν ἄνεμον ⸀ἰσχυρὸν ἐφοβήθη, καὶ ἀρξάμενος καταποντίζεσθαι ἔκραξεν λέγων· Κύριε, σῶσόν με.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/030.yaml
  text: But seeing the strong wind[a], he became afraid, and beginning to sink, he cried out, saying, “Lord[b], save me.”
translation:
  language: vi
  text: 'Nhưng khi thấy gió mạnh[a], ông sợ hãi; và lúc bắt đầu chìm xuống, ông kêu lên: “Lạy Chúa, xin cứu con![b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “gió dữ dội”.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “xin giải cứu con”. Động từ Hy Lạp có thể chỉ việc thoát khỏi mối nguy trước mắt, cũng như sự cứu rỗi theo nghĩa rộng hơn.
    reason: lexical_alternative
lexical_decisions:
- source_word: βλέπων
  choice: khi thấy
  rationale: Phân từ hiện tại diễn tả việc nhận thấy xảy ra đồng thời với phản ứng sợ hãi; “khi thấy” tự nhiên trong tiếng Việt và giữ rõ quan hệ thời gian.
- source_word: δὲ
  choice: nhưng
  rationale: Đánh dấu bước ngoặt tương phản với việc Phi-e-rơ đang đi được trên mặt nước trước đó.
- source_word: ἄνεμον ἰσχυρόν
  choice: gió mạnh
  rationale: Dịch trực tiếp tính từ ἰσχυρός bổ nghĩa cho “gió”; cách nói tự nhiên, rõ ràng và không cường điệu.
- source_word: ἐφοβήθη
  choice: ông sợ hãi
  rationale: Truyền đạt sự xuất hiện của nỗi sợ trong diễn tiến câu chuyện; ngữ cảnh và “khi thấy” đã làm rõ tính khởi phát.
- source_word: ἀρξάμενος καταποντίζεσθαι
  choice: lúc bắt đầu chìm xuống
  rationale: Giữ ý hành động mới khởi sự; “chìm xuống” phù hợp với hiểm nguy tức thời mà không nói quá thành đã chết đuối.
- source_word: ἔκραξεν λέγων
  choice: ông kêu lên
  rationale: “Kêu lên” diễn tả lời cầu cứu lớn tiếng và khẩn cấp; không cần dịch máy móc thêm “mà rằng” trong tiếng Việt hiện đại.
- source_word: Κύριε
  choice: Lạy Chúa
  rationale: “Chúa” giữ trọng lượng của κύριος khi Phi-e-rơ trực tiếp thưa với Đức Giê-su; “lạy” là hô cách trang trọng, tự nhiên trong lời khẩn cầu.
- source_word: σῶσόν με
  choice: xin cứu con
  rationale: Mệnh lệnh khẩn thiết được diễn đạt tự nhiên bằng “xin cứu”; “con” phù hợp với lời Phi-e-rơ thưa trực tiếp với Chúa mà không thu hẹp động từ chỉ còn nghĩa thoát nạn thể chất.
theological_decisions:
- issue: Cách dịch κύριος khi trực tiếp thưa với Đức Giê-su
  choice: Lạy Chúa
  alternative: Thưa Thầy
  rationale: “Lạy Chúa” bảo tồn nghĩa thông thường và sức nặng Kitô học có thể có của κύριος, nhưng không giải thích thêm vượt quá lời văn.
- issue: Cách dịch σῴζω trong tình thế nguy hiểm tức thời
  choice: cứu con
  alternative: giải cứu con
  rationale: “Cứu” vừa hoàn toàn phù hợp với nguy cơ chìm ngay trước mắt, vừa giữ được phạm vi nghĩa rộng hơn của σῴζω thay vì bắt buộc một cách hiểu thuần thể chất.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “ông” để tiếp nối nhân vật Phi-e-rơ trong lời kể, và “con” trong lời thưa trực tiếp nhằm thể hiện sự kính trọng, khẩn cầu. Dấu chấm phẩy giúp giữ hai vế tương phản và chuỗi hành động rõ ràng.
