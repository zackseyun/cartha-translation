- from: Nhà vua buồn lòng, nhưng vì những lời thề của mình và vì những người cùng dự tiệc với ông[a], vua truyền ban điều ấy[b].
  to: Nhà vua buồn lòng, nhưng vì những lời thề của mình và những người cùng dự tiệc với ông[a], ông ra lệnh phải ban điều ấy[b].
  rationale: Sửa tối thiểu cụm động từ cuối câu để biểu đạt rõ rằng nhà vua ra lệnh cho điều được ban, đồng thời giữ nguyên sắc thái nhượng bộ, các nguyên nhân được nêu và sự hàm ẩn của đối tượng trong nguyên văn.
