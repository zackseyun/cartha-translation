source:
  edition: SBLGNT
  text: καὶ ⸂λυπηθεὶς ὁ βασιλεὺς διὰ⸃ τοὺς ὅρκους καὶ τοὺς συνανακειμένους ἐκέλευσεν δοθῆναι,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/009.yaml
  text: And the king[a], though grieved, because of his oaths and those dining with him[b], commanded it to be given.
translation:
  language: vi
  text: Nhà vua buồn lòng, nhưng vì những lời thề của mình và những người cùng dự tiệc với ông[a], ông ra lệnh phải ban điều ấy[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “những người cùng ngả mình bên bàn ăn với ông.” Nguyên văn phản ánh tư thế dùng bữa thông thường thời ấy.
    reason: cultural_note
  - marker: b
    text: Nguyên văn không nói rõ vật được ban; điều này quy chiếu về lời xin được nhắc đến trong ngữ cảnh ngay trước đó.
    reason: lexical_alternative
lexical_decisions:
- source_word: λυπηθεὶς
  choice: buồn lòng, nhưng
  rationale: Phân từ thụ động aorist diễn tả nhà vua buồn phiền; thêm “nhưng” thể hiện tự nhiên sắc thái nhượng bộ trong ngữ cảnh mà không xóa bỏ sự căng thẳng giữa nỗi buồn và mệnh lệnh sau đó.
- source_word: ὁ βασιλεὺς
  choice: nhà vua
  rationale: Dịch trực tiếp βασιλεύς bằng cách gọi trang trọng, tự nhiên trong văn kể chuyện tiếng Việt.
- source_word: διὰ τοὺς ὅρκους
  choice: vì những lời thề của mình
  rationale: διά với đối cách nêu nguyên nhân; “của mình” làm rõ một cách tự nhiên rằng đây là những lời thề của nhà vua, như ngữ cảnh cho thấy.
- source_word: τοὺς συνανακειμένους
  choice: những người cùng dự tiệc với ông
  rationale: Cụm từ chỉ những người cùng ngả mình dùng bữa. “Cùng dự tiệc” truyền đạt hoàn cảnh xã hội bằng tiếng Việt hiện đại, còn tư thế ăn uống cổ được ghi ở chú thích.
- source_word: ἐκέλευσεν
  choice: truyền
  rationale: κελεύω mang nghĩa ra lệnh; “truyền” ngắn gọn, trang trọng và phù hợp với chủ thể là nhà vua.
- source_word: δοθῆναι
  choice: ban điều ấy
  rationale: Động từ nguyên thể bị động có nghĩa là “được trao/ban”. “Điều ấy” giữ đối tượng ở mức hàm ẩn, quy chiếu về lời xin trong ngữ cảnh trước, thay vì giải thích cụ thể ngay trong câu.
