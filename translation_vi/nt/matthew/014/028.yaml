  text: Ἀποκριθεὶς δὲ ⸂αὐτῷ ὁ Πέτρος εἶπεν⸃· Κύριε, εἰ σὺ εἶ, κέλευσόν με ⸂ἐλθεῖν πρὸς σὲ⸃ ἐπὶ τὰ ὕδατα·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/028.yaml
  text: And Peter answered him[a], “Lord, if it is you, command me to come to you on the waters.”
translation:
  language: vi
  text: 'Phi-e-rơ đáp lời Ngài: “Lạy Chúa, nếu đúng là Ngài, xin truyền cho con đi trên mặt nước mà đến với Ngài.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀποκριθεὶς δὲ αὐτῷ ὁ Πέτρος εἶπεν
  choice: Phi-e-rơ đáp lời Ngài
  rationale: Đây là công thức trần thuật thông dụng. “Đáp lời Ngài” diễn đạt tự nhiên cả động từ ἀποκρίνομαι lẫn đại từ ở cách dữ cách, còn δέ được thể hiện bằng mạch nối ngữ cảnh thay vì dịch máy móc.
- source_word: Κύριε
  choice: Lạy Chúa
  rationale: “Lạy Chúa” là cách xưng hô trực tiếp trang trọng, tự nhiên trong tiếng Việt và giữ được cả sắc thái tôn kính lẫn sức nặng Kitô học có thể có của κύριος.
- source_word: εἰ σὺ εἶ
  choice: nếu đúng là Ngài
  rationale: Cụm này hỏi về căn tính của người đang xuất hiện. “Nếu đúng là Ngài” tự nhiên hơn lối dịch sát chữ và không biến điều kiện thành lời phủ nhận hay xác quyết.
- source_word: κέλευσόν με
  choice: xin truyền cho con
  rationale: κελεύω chỉ mệnh lệnh có thẩm quyền. “Truyền” giữ được lực ấy; “xin” phù hợp với hình thức thỉnh cầu trong lời nói trực tiếp, còn “con” thể hiện tương quan tôn kính trong ngữ cảnh.
- source_word: ἐλθεῖν πρὸς σὲ
  choice: mà đến với Ngài
  rationale: ἔρχομαι cùng πρὸς σέ chỉ chuyển động về phía Chúa Giê-su. “Đến với Ngài” vừa tự nhiên vừa giữ rõ đích đến là một người.
- source_word: ἐπὶ τὰ ὕδατα
  choice: đi trên mặt nước
  rationale: Trong tiếng Việt hiện đại, “trên mặt nước” là cách diễn đạt tự nhiên cho việc di chuyển trên bề mặt nước. Số nhiều hình thái của ὕδατα không nhất thiết phải tái hiện bằng “các vùng nước”, vốn dễ gây sai nghĩa hoặc nặng nề.
theological_decisions:
- issue: Sắc thái của κύριε khi Phi-e-rơ thưa với Chúa Giê-su
  choice: Lạy Chúa
  alternative: Thưa Thầy; thưa ngài
  rationale: “Lạy Chúa” giữ nguyên khả năng câu xưng hô mang ý nghĩa vượt quá phép lịch sự thông thường, nhưng bản thân câu dịch không giải quyết dứt khoát mức độ nhận thức Kitô học của Phi-e-rơ.
- issue: Tính điều kiện của εἰ σὺ εἶ
  choice: nếu đúng là Ngài
  alternative: vì đúng là Ngài; nếu Ngài là Đấng ấy
  rationale: 'Giữ nguyên hình thức điều kiện và sự căng thẳng của tình huống: Phi-e-rơ xin một dấu hiệu hoặc sự xác nhận, thay vì câu dịch mặc nhiên biến lời ông thành một tuyên bố chắc chắn.'
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngài/con” trong lời thưa trực tiếp để biểu đạt sự kính trọng; tránh lối dịch quá cổ như “phán bảo con bước trên các dòng nước”. Không đặt chú thích vì bản tiếng Việt “mặt nước” là thành ngữ tự nhiên và việc chú giải số nhiều hình thái ở đây không cần thiết cho nghĩa câu.
