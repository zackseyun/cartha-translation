  source_fidelity: 'Bản nháp truyền đạt đúng các yếu tố chính của tiếng Hy Lạp: thời điểm ở canh tư, việc Ngài đến với họ, và hành động đi trên mặt biển. Bản sửa chỉ điều chỉnh trật tự câu để phản ánh rõ hơn động từ chính ἦλθεν (“đến”) cùng phân từ περιπατῶν (“đi”), không thay đổi nghĩa.'
  naturalness: “Ngài đến với họ, đi trên mặt biển” tự nhiên và mạch lạc hơn “Ngài đi trên mặt biển mà đến với họ” trong văn xuôi tiếng Việt hiện đại. “Canh tư của đêm” là cách kết hợp gọn và thông dụng hơn “canh tư trong đêm”.
