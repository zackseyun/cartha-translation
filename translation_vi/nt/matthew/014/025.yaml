source:
  edition: SBLGNT
  text: τετάρτῃ δὲ φυλακῇ τῆς νυκτὸς ⸀ἦλθεν πρὸς ⸀αὐτοὺς περιπατῶν ἐπὶ ⸂τὴν θάλασσαν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/025.yaml
  text: And in the fourth watch of the night he came to them[b][a], walking on the sea.
translation:
  language: vi
  text: Vào canh tư của đêm[b], Ngài đến với họ, đi trên mặt biển[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “đi trên biển”. Một số người hiểu cụm này là “đi dọc bờ biển”, nhưng mạch văn ủng hộ mạnh nghĩa Ngài đi trên chính mặt nước.
    reason: alternative_reading
  - marker: b
    text: “Canh tư” là canh cuối của đêm, theo cách chia đêm của người La Mã, vào khoảng 3 giờ đến 6 giờ sáng.
    reason: cultural_note
lexical_decisions:
- source_word: τετάρτῃ ... φυλακῇ τῆς νυκτός
  choice: vào canh tư trong đêm
  rationale: Cụm ở cách dữ liệu chỉ thời điểm hành động. “Canh tư” giữ lại cách chia đêm theo bối cảnh lịch sử, còn chú thích giải thích tương đương thời gian hiện đại.
- source_word: δὲ
  choice: không dịch thành một từ riêng
  rationale: δέ là từ nối nhẹ để tiếp diễn câu chuyện; trong tiếng Việt, sự chuyển tiếp đã tự nhiên nhờ cụm mở đầu “Vào canh tư trong đêm”, nên thêm “và” hoặc “bấy giờ” sẽ nặng câu.
- source_word: ἦλθεν πρὸς αὐτούς
  choice: đến với họ
  rationale: ἔρχομαι kết hợp với πρός và đối cách diễn tả chuyển động hướng đến những người ấy. “Đến với họ” vừa sát nghĩa vừa tự nhiên.
- source_word: περιπατῶν
  choice: đi
  rationale: Phân từ hiện tại diễn tả hành động đồng thời với động từ chính. Trong cấu trúc tiếng Việt “đi trên mặt biển mà đến với họ”, “đi” truyền đạt tự nhiên hành động bước đi mà không cần lặp thành “đi bộ”.
- source_word: ἐπὶ τὴν θάλασσαν
  choice: trên mặt biển
  rationale: Trong ngữ cảnh này, ἐπί với đối cách cùng περιπατῶν chỉ sự di chuyển trên bề mặt nước. “Mặt biển” làm rõ bề mặt được nói đến, đồng thời giữ từ θάλασσα là “biển” thay vì đổi thành tên địa lý “hồ”.
theological_decisions:
- issue: Mô tả phép lạ về việc Đức Giê-su di chuyển trên nước
  choice: đi trên mặt biển
  alternative: đi dọc bờ biển
  rationale: Cú pháp περιπατῶν ἐπὶ τὴν θάλασσαν và mạch văn đều ủng hộ mạnh nghĩa di chuyển trên mặt nước. Bản dịch giữ nguyên ý nghĩa trực tiếp và tính chất kỳ diệu của lời kể, nhưng chú thích vẫn ghi nhận cách hiểu khác từng được đề xuất.
- issue: Chủ ngữ ẩn trong động từ ἦλθεν
  choice: Ngài
  alternative: Người
  rationale: Tiếng Hy Lạp chỉ biểu thị ngôi thứ ba số ít qua động từ. “Ngài” là đại từ tôn kính, tự nhiên trong tiếng Việt khi chỉ Đức Giê-su, nhưng không thêm một danh hiệu hay lời khẳng định thần học không có trong câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Trật tự câu được điều chỉnh theo tiếng Việt để vừa giữ thời điểm ở đầu câu, vừa diễn đạt hành động đi trên mặt biển như cách Ngài đến với họ. Cả hai dấu chú thích [a] và [b] đều đặt ngay sau cụm từ liên quan.
