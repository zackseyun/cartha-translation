id: MAT.14.2
reference: Matthew 14:2
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ εἶπεν τοῖς παισὶν αὐτοῦ· Οὗτός ἐστιν Ἰωάννης ὁ βαπτιστής· αὐτὸς ἠγέρθη ἀπὸ τῶν νεκρῶν, καὶ διὰ τοῦτο αἱ δυνάμεις ἐνεργοῦσιν ἐν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/002.yaml
  text: And he said to his servants[a], “This is John the Baptist. He has been raised from the dead, and for this reason these powers are at work in him.”
translation:
  language: vi
  text: 'Ông nói với các đầy tớ của mình: “Người này là Giăng Báp-tít. Ông ấy đã được làm cho sống lại từ cõi chết; vì thế, những quyền năng ấy[a] đang hoạt động trong ông ấy.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “những quyền năng làm phép lạ” hoặc, theo lối diễn ý hơn, “các phép lạ”. Tiếng Hy Lạp nói “các quyền năng” (αἱ δυνάμεις), chỉ quyền năng siêu nhiên được biểu lộ qua những việc phi thường.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παισὶν
  choice: các đầy tớ
  rationale: Trong bối cảnh Hê-rốt nói với những người thuộc gia đình hoặc triều đình mình, từ này chỉ người phục vụ hay tùy tùng. “Các đầy tớ” diễn đạt quan hệ xã hội mà không xác định quá mức chức vị.
- source_word: ὁ βαπτιστής
  choice: người làm báp-têm
  rationale: Cách dịch này làm rõ nghĩa tác nhân của danh từ Hy Lạp—người thực hiện việc báp-têm—thay vì chỉ phiên âm tước hiệu.
- source_word: ἠγέρθη
  choice: đã được làm cho sống lại
  rationale: Giữ thể bị động của động từ Hy Lạp, không diễn đạt như thể Giăng tự mình sống lại.
- source_word: ἀπὸ τῶν νεκρῶν
  choice: từ cõi chết
  rationale: Đây là cách nói tự nhiên trong tiếng Việt, diễn đạt việc trở về từ tình trạng và phạm vi của người chết.
- source_word: διὰ τοῦτο
  choice: vì thế
  rationale: Diễn đạt gọn và tự nhiên mối quan hệ nguyên nhân–kết quả trong suy luận của Hê-rốt.
- source_word: αἱ δυνάμεις
  choice: những quyền năng ấy
  rationale: Giữ danh từ số nhiều “các quyền năng” và sắc thái quy chiếu của mạo từ, không vội đồng nhất hoàn toàn quyền năng với các kết quả hữu hình là phép lạ.
- source_word: ἐνεργοῦσιν
  choice: đang hoạt động
  rationale: Diễn đạt tự nhiên ý các quyền năng đang có hiệu lực hoặc đang vận hành.
- source_word: ἐν αὐτῷ
  choice: trong ông ấy
  rationale: Giữ nghĩa trực tiếp của giới từ ἐν và sự mơ hồ về cách quyền năng hoạt động, thay vì diễn giải thành “qua ông ấy”.
theological_decisions:
- issue: Bản chất việc Giăng trở lại
  choice: đã được làm cho sống lại từ cõi chết
  alternative: đã sống lại từ cõi chết
  rationale: Nguyên văn dùng thể bị động; bản dịch giữ cấu trúc ấy mà không đưa ra khẳng định thần học vượt quá lời suy đoán của Hê-rốt.
- issue: Ý nghĩa của δυνάμεις trong ngữ cảnh
  choice: những quyền năng ấy đang hoạt động trong ông ấy
  alternative: những quyền năng làm phép lạ ấy đang hoạt động trong ông ấy; các phép lạ đang được thực hiện qua ông ấy
  rationale: Từ này trong ngữ cảnh gợi đến quyền năng siêu nhiên biểu hiện qua những việc phi thường, nhưng bản chính giữ “quyền năng” để không thu hẹp từ ngữ thành riêng các phép lạ hay đổi “trong” thành “qua”.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “ông ấy” để phân biệt Giăng với người đang nói. Dấu chú thích [a] được đặt ngay sau “những quyền năng ấy”, là cụm từ mà chú thích giải thích.
