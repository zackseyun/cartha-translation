revisions:
- from: 'Ông nói với các đầy tớ của mình: “Người này chính là Giăng, người làm báp-têm. Ông ấy đã được làm cho sống lại từ cõi chết; vì thế, những quyền năng ấy[a] đang hoạt động trong ông ấy.”'
  to: 'Ông nói với các đầy tớ của mình: “Người này là Giăng Báp-tít. Ông ấy đã được làm cho sống lại từ cõi chết; vì thế, những quyền năng ấy[a] đang hoạt động trong ông ấy.”'
  rationale: Thay “người làm báp-têm” bằng “Giăng Báp-tít” để dùng tước hiệu quen thuộc và tự nhiên trong tiếng Việt hiện đại. Các phần khác được giữ vì phản ánh thể bị động của ἠγέρθη, quan hệ suy luận của διὰ τοῦτο, và cách diễn đạt không diễn giải quá mức của αἱ δυνάμεις ἐνεργοῦσιν ἐν αὐτῷ. Chú thích vẫn được neo đúng vào “những quyền năng ấy.”
