  text: But he said[a], “Bring them here to me.”
translation:
  language: vi
  text: 'Nhưng Ngài nói[a]: “Hãy đem chúng lại đây cho tôi.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tức là những chiếc bánh và những con cá được nhắc đến trong câu trước.
    reason: cross_reference
lexical_decisions:
- source_word: δὲ
  choice: Nhưng
  rationale: δέ là liên từ chuyển ý nhẹ; “Nhưng” diễn đạt tự nhiên sự tương phản giữa lời các môn đồ vừa nói và lời đáp của Chúa Giê-su.
- source_word: εἶπεν
  choice: Ngài nói
  rationale: Động từ λέγω ở thì bất định được dịch trực tiếp là “nói”; “Ngài” là đại từ kính trọng tự nhiên trong văn phong Kinh Thánh tiếng Việt khi chỉ Chúa Giê-su.
- source_word: Φέρετέ
  choice: Hãy đem
  rationale: Mệnh lệnh hiện tại chủ động, ngôi thứ hai số nhiều của φέρω yêu cầu những người nghe đem các vật đến; “Hãy đem” vừa rõ sắc thái mệnh lệnh vừa tự nhiên.
- source_word: μοι
  choice: cho tôi
  rationale: Đại từ ở cách dữ cách chỉ người tiếp nhận. “Cho tôi” giữ được hướng của hành động mà không làm câu tiếng Việt nặng nề.
- source_word: ὧδε
  choice: lại đây
  rationale: ὧδε có nghĩa là “ở đây/đến đây”. Trong cấu trúc mệnh lệnh chỉ sự di chuyển, “lại đây” là cách nói tự nhiên và giữ rõ ý không gian.
- source_word: αὐτούς
  choice: chúng
  rationale: Đại từ giống đực số nhiều quy chiếu theo ngữ cảnh đến bánh và cá ở câu trước. “Chúng” duy trì đại từ của nguyên văn và để chú thích làm rõ vật được nói đến.
theological_decisions: []
