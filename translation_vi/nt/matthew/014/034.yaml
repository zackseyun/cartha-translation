  text: And after crossing over[a], they came to the land of Gennesaret.
translation:
  language: vi
  text: Sau khi vượt qua, họ đến vùng đất Ghê-nê-xa-rết.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διαπεράσαντες
  choice: sau khi vượt qua hồ
  rationale: Phân từ bất định quá khứ diễn tả hành động xảy ra trước động từ chính. Bản Hy Lạp chỉ nói “vượt qua”; “hồ” được bổ sung theo bối cảnh đi thuyền để câu tiếng Việt tự nhiên, nhưng được ghi chú nhằm tránh che khuất tính hàm súc của nguyên văn.
- source_word: ἦλθον
  choice: họ đến
  rationale: Cách dịch trực tiếp, tự nhiên của động từ ἔρχομαι ở thì bất định quá khứ và phù hợp với cụm chỉ nơi đến.
- source_word: ἐπὶ τὴν γῆν εἰς Γεννησαρέτ
  choice: đến vùng đất Ghê-nê-xa-rết
  rationale: Cụm Hy Lạp kết hợp ý “lên/đến đất liền” với hướng đi “vào Ghê-nê-xa-rết.” Cách dịch này giữ được ý cập vào đất liền thuộc khu vực Ghê-nê-xa-rết mà không buộc địa danh phải chỉ một thành phố.
- source_word: Γεννησαρέτ
  choice: Ghê-nê-xa-rết
  rationale: Phiên âm địa danh theo lối dễ đọc trong tiếng Việt, thay vì dịch nghĩa.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Vùng đất” diễn đạt tự nhiên khu vực Ghê-nê-xa-rết, đồng thời phản ánh γῆ và tránh xác định quá mức đây là bờ hồ hay một đô thị.
