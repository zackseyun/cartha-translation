review_pass:
  verdict: revise
  source_fidelity: Bản nháp truyền đạt đúng lời cấm mang tính pháp lý-đạo đức và diễn đạt tự nhiên nghĩa hôn nhân theo ngữ cảnh của ἔχειν αὐτήν. Tuy nhiên, “vua” thay cho αὐτῷ vừa bổ sung danh xưng không có trong câu Hy Lạp, vừa không chính xác về mặt lịch sử đối với Hê-rốt An-ti-ba, người là chư hầu vương (tetrarch), không phải vua.
  naturalness: Câu văn nhìn chung hiện đại, trang trọng và tự nhiên. “Vẫn nói” là cách phù hợp để biểu đạt thì chưa hoàn thành của ἔλεγεν, gợi lời nói kéo dài hoặc lặp lại trong quá khứ. Đổi “Ngài” thành “ông” phù hợp hơn với lời quở trách trực tiếp mà vẫn lịch sự trong tiếng Việt hiện đại.
  terminology: “Giăng” phù hợp với cách dùng Kinh Thánh tiếng Việt. “Không được phép” bảo toàn lực của οὐκ ἔξεστίν mà không áp đặt cụ thể loại luật. “Lấy bà ấy” là một diễn đạt ngữ cảnh hợp lý cho “có bà ấy” theo nghĩa nhận làm vợ.
  issues:
  - severity: medium
    issue: “vua” được thêm vào để dịch αὐτῷ.
    rationale: Nguyên văn chỉ có đại từ “với ông ấy/to him.” Hơn nữa, Hê-rốt An-ti-ba mang tước tetrarch, nên gọi là “vua” có thể gây sai lệch lịch sử. Nên giữ đại từ như nguồn văn bản.
  - severity: low
    issue: “Ngài” tạo sắc thái tôn kính quá mạnh trong lời quở trách.
    rationale: Dù không sai ngữ pháp, “ông” tự nhiên hơn trong tiếng Việt hiện đại cho lời nói trực tiếp với một nhân vật quyền thế và không thêm sắc thái tôn kính ngoài nguyên văn.
  revised_text: 'Vì Giăng vẫn nói với ông ấy: “Ông không được phép lấy bà ấy.”'
  revised_footnotes: []
