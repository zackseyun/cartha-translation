  text: ἔλεγεν γὰρ ⸂αὐτῷ ὁ Ἰωάννης⸃· Οὐκ ἔξεστίν σοι ἔχειν αὐτήν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/004.yaml
  text: For John had been saying to him[a], “It is not lawful for you to have her.”
translation:
  language: vi
  text: 'Vì Giăng vẫn nói với ông ấy: “Ông không được phép lấy bà ấy.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλεγεν
  choice: vẫn nói
  rationale: Thì chưa hoàn thành diễn tả lời quở trách kéo dài hoặc được lặp lại trong quá khứ; “vẫn nói” truyền đạt sắc thái ấy tự nhiên trong tiếng Việt.
- source_word: γὰρ
  choice: Vì
  rationale: Liên từ đưa ra lời giải thích cho sự việc ở câu trước.
- source_word: αὐτῷ
  choice: với vua
  rationale: Đại từ chỉ Hê-rốt; dùng “vua” giúp câu tiếng Việt rõ chủ thể được nói với mà không thêm tên riêng, đồng thời phù hợp ngữ cảnh trực tiếp.
- source_word: ὁ Ἰωάννης
  choice: Giăng
  rationale: Nguyên văn chỉ gọi tên Giăng, không thêm danh hiệu “Báp-tít”; dạng tên này quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
- source_word: Οὐκ ἔξεστίν
  choice: không được phép
  rationale: Diễn đạt sự không được cho phép, bao hàm lực pháp lý và đạo đức của ἔξεστιν, đồng thời tự nhiên hơn “không hợp pháp” trong lời quở trách trực tiếp.
- source_word: σοι
  choice: Ngài
  rationale: Đại từ ngôi thứ hai chỉ Hê-rốt; “Ngài” là cách xưng hô trang trọng với người cai trị nhưng không hàm ý tán đồng hành vi của ông.
- source_word: ἔχειν
  choice: lấy
  rationale: Trong ngữ cảnh quan hệ hôn nhân, “lấy bà ấy” là cách nói tiếng Việt tự nhiên cho việc nhận một phụ nữ làm vợ; tuy diễn giải hơn nghĩa đen “có”, nó truyền đạt đúng nghĩa ngữ cảnh.
- source_word: αὐτήν
  choice: bà ấy
  rationale: Đại từ chỉ Hê-rô-đia; “bà ấy” là cách quy chiếu tự nhiên và tôn trọng trong tiếng Việt hiện đại.
theological_decisions:
- issue: Tính chất lời quở trách của Giăng
  choice: “không được phép”
  alternative: “không đúng luật” hoặc “không hợp lẽ”
  rationale: Cách dịch giữ trọng tâm của ἔξεστιν là điều không được phép theo chuẩn mực có thẩm quyền, nhưng không xác định thêm trong câu chính đó là luật dân sự hay luật tôn giáo.
- issue: Nghĩa hôn nhân của ἔχειν αὐτήν
  choice: “lấy bà ấy”
  alternative: “có bà ấy”
  rationale: Ngữ cảnh nói về Hê-rô-đia, vợ của anh/em Hê-rốt, nên động từ mang nghĩa có người ấy làm vợ. “Lấy” chuyển tải nghĩa đó rõ ràng mà không thêm phán đoán giáo phái.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ liên từ giải thích “Vì” và sắc thái tiếp diễn/lặp lại của động từ quá khứ. Không thêm danh hiệu cho Giăng hoặc giải thích luật nào đang được viện dẫn.
