revisions:
- from: 'Vì Giăng vẫn nói với vua: “Ngài không được phép lấy bà ấy.”'
  to: 'Vì Giăng vẫn nói với ông ấy: “Ông không được phép lấy bà ấy.”'
  rationale: Bản sửa loại bỏ danh xưng được thêm vào và có nguy cơ không chính xác về lịch sử, đồng thời giữ sắc thái tiếp diễn/lặp lại của ἔλεγεν, liên từ giải thích γάρ, và tính chất cấm đoán của οὐκ ἔξεστίν. “Lấy bà ấy” được giữ vì câu đang nói về quan hệ hôn nhân và đây là cách diễn đạt tiếng Việt tự nhiên, không cần giải thích thêm về cơ sở luật lệ.
