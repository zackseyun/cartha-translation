  source_fidelity: 'Bản dịch phản ánh đầy đủ các thành tố chính của câu Hy Lạp: sự chuyển ý nhẹ ("Nhưng"), thời điểm đã xảy ra ("đã"), khoảng cách nhiều sta-đi-ôn tính từ đất liền, tình trạng thuyền bị sóng tác động mạnh, và nguyên nhân là gió ngược. “Gió thổi ngược” diễn đạt tự nhiên ý ἐναντίος trong bối cảnh hành trình bằng thuyền mà không thêm chi tiết giáo lý hay lịch sử không có trong nguồn.'
