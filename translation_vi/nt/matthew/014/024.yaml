  terminology: “Thuyền” phù hợp với πλοῖον trong bối cảnh Biển Ga-li-lê. “Sta-đi-ôn” giữ được đơn vị cổ của nguyên văn, và chú thích khoảng 185 mét là thích hợp. “Đất liền” phản ánh γῆ trong thế đối lập với mặt nước; chú thích “cách bờ” bảo tồn lựa chọn theo ngữ cảnh. Không có thuật ngữ thần học cần điều chỉnh.
