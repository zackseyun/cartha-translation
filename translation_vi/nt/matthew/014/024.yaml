id: MAT.14.24
reference: Matthew 14:24
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: τὸ δὲ πλοῖον ἤδη ⸂σταδίους πολλοὺς ἀπὸ τῆς γῆς ἀπεῖχεν⸃, βασανιζόμενον ὑπὸ τῶν κυμάτων, ἦν γὰρ ἐναντίος ὁ ἄνεμος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/024.yaml
  text: But the boat was already many stadia from the land[a], being battered by the waves[c][b], for the wind was against it.
translation:
  language: vi
  text: Nhưng thuyền đã cách đất liền[a] nhiều sta-đi-ôn[b], bị sóng đánh dữ dội[c], vì gió thổi ngược.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “cách bờ.” Tiếng Hy Lạp dùng từ có nghĩa là “đất” hoặc “đất liền.”
    reason: lexical_alternative
  - marker: b
    text: Sta-đi-ôn là đơn vị đo khoảng cách thời cổ, dài khoảng 185 mét.
    reason: cultural_note
  - marker: c
    text: Cũng có thể dịch là “bị sóng vùi dập.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πλοῖον
  choice: thuyền
  rationale: Trong bối cảnh vượt Biển Ga-li-lê, “thuyền” là cách gọi tự nhiên và phù hợp hơn “tàu,” không phóng đại kích thước phương tiện.
- source_word: ἤδη
  choice: đã
  rationale: Diễn đạt tự nhiên việc tình trạng này đã xảy ra vào thời điểm ấy trong mạch kể.
- source_word: σταδίους πολλοὺς
  choice: nhiều sta-đi-ôn
  rationale: Giữ đơn vị đo khoảng cách cổ của nguyên văn thay vì chuyển đổi hoặc khái quát hóa; chú thích giải thích giá trị gần đúng.
- source_word: ἀπὸ τῆς γῆς
  choice: cách đất liền
  rationale: γῆ ở đây chỉ phần đất đối lập với mặt nước. “Đất liền” sát nghĩa, còn “bờ” là cách hiểu tự nhiên theo ngữ cảnh và được ghi ở chú thích.
- source_word: ἀπεῖχεν
  choice: cách
  rationale: Diễn đạt quan hệ khoảng cách một cách gọn và tự nhiên trong tiếng Việt.
- source_word: βασανιζόμενον
  choice: bị ... đánh dữ dội
  rationale: Trong bối cảnh hàng hải, động từ mô tả chiếc thuyền chịu tác động mạnh và liên tục của sóng; cách dịch này truyền đạt sức mạnh vật lý mà không gán sắc thái tâm lý.
- source_word: ὑπὸ τῶν κυμάτων
  choice: bị sóng
  rationale: Thể hiện sóng là tác nhân gây ra tình trạng dữ dội của chiếc thuyền.
- source_word: ἐναντίος
  choice: thổi ngược
  rationale: Với chủ thể là gió, “thổi ngược” là cách diễn đạt tự nhiên rằng gió chống lại hướng đi của thuyền, đồng thời không cần thêm một tân ngữ vốn chỉ được hiểu ngầm trong tiếng Hy Lạp.
- source_word: δὲ
  choice: Nhưng
  rationale: Đánh dấu sự chuyển cảnh có sắc thái tương phản nhẹ từ Chúa Giê-su ở trên đất sang hoàn cảnh khó khăn của chiếc thuyền.
- source_word: γάρ
  choice: vì
  rationale: 'Giữ rõ quan hệ giải thích: gió ngược là nguyên nhân khiến thuyền bị sóng đánh dữ dội.'
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng nhưng dễ hiểu. Giữ đơn vị cổ “sta-đi-ôn” để minh bạch với nguyên văn và giải thích bằng chú thích; dùng “gió thổi ngược” thay cho lối dịch cứng “gió chống lại thuyền.”
