  text: ὁ δὲ εἶπεν· Ἐλθέ. καὶ καταβὰς ἀπὸ τοῦ ⸀πλοίου Πέτρος περιεπάτησεν ἐπὶ τὰ ὕδατα ⸂καὶ ἦλθεν⸃ πρὸς τὸν Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/029.yaml
  text: And he said[a], “Come.” So Peter got down from the boat, walked on the water, and came toward Jesus.
translation:
  language: vi
  text: 'Ngài nói: “Hãy đến!” Phê-rơ bước xuống khỏi thuyền, đi trên mặt nước và đi về phía Giê-su.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đến với Giê-su.” Tiếng Hy Lạp nhấn mạnh chuyển động về phía Giê-su.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐλθέ
  choice: Hãy đến!
  rationale: Động từ mệnh lệnh aorist của ἔρχομαι là lời gọi trực tiếp. “Hãy đến!” ngắn gọn, tự nhiên và không thêm ý “đến đây” vốn không được nói rõ trong tiếng Hy Lạp.
- source_word: καταβὰς ἀπὸ τοῦ πλοίου
  choice: bước xuống khỏi thuyền
  rationale: Phân từ καταβάς diễn tả việc đi xuống; cách diễn đạt này vừa giữ trình tự hành động vừa tự nhiên trong tiếng Việt. πλοῖον trong bối cảnh hồ Ga-li-lê thích hợp nhất với “thuyền”.
- source_word: περιεπάτησεν
  choice: đi
  rationale: Trong ngữ cảnh này, περιπατέω chỉ hành động đi bằng chân. “Đi” tự nhiên hơn “đi bộ” khi theo sau là cụm “trên mặt nước” và không thêm ý bắt đầu đi.
- source_word: ἐπὶ τὰ ὕδατα
  choice: trên mặt nước
  rationale: ἐπί với đối cách ở đây diễn tả chuyển động trên bề mặt nước. “Trên mặt nước” là cách nói tự nhiên, rõ nghĩa trong tiếng Việt hiện đại.
- source_word: καὶ ἦλθεν πρὸς τὸν Ἰησοῦν
  choice: và đi về phía Đức Chúa Jêsus
  rationale: πρός nhấn mạnh hướng chuyển động về phía Đức Chúa Jêsus, không nhất thiết khẳng định Phê-rơ đã tới nơi. “Đi về phía” bảo toàn sắc thái định hướng ấy.
- source_word: δὲ
  choice: liền
  rationale: δέ là liên từ kể chuyện nhẹ. Trong cấu trúc tiếng Việt, chuyển ý được thể hiện tự nhiên qua câu mới, còn “liền” nối lời truyền gọi với phản ứng tiếp theo mà không tạo nét tương phản quá mạnh.
theological_decisions:
- issue: Phê-rơ di chuyển về phía Đức Chúa Jêsus hay đã đến hẳn chỗ Ngài
  choice: đi về phía Đức Chúa Jêsus
  alternative: đến với Đức Chúa Jêsus
  rationale: Giới từ πρός biểu thị hướng đến và không tự nó buộc phải hiểu là đã hoàn tất việc đến nơi. Bản dịch giữ nguyên tiến trình kể chuyện, không giải quyết thay cho văn bản sự căng thẳng về kết quả hành động.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngài phán” theo lối xưng hô kính trọng dành cho Đức Chúa Jêsus; giữ tên riêng “Phê-rơ” và “Đức Chúa Jêsus” theo quy ước Kinh Thánh tiếng Việt quen thuộc. Dấu chú thích [a] được đặt ngay sau cụm từ mà chú thích giải thích.
