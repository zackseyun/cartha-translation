id: MAT.14.13
reference: Matthew 14:13
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸂Ἀκούσας δὲ⸃ ὁ Ἰησοῦς ἀνεχώρησεν ἐκεῖθεν ἐν πλοίῳ εἰς ἔρημον τόπον κατ’ ἰδίαν· καὶ ἀκούσαντες οἱ ὄχλοι ἠκολούθησαν αὐτῷ πεζῇ ἀπὸ τῶν πόλεων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/013.yaml
  text: When Jesus heard this[a], he withdrew from there by boat to a desolate place by himself. But when the crowds heard[b], they followed him on foot from the towns.
translation:
  language: vi
  text: Khi nghe tin ấy, Đức Giê-su rút khỏi nơi đó bằng thuyền, đến một nơi vắng vẻ[a] để ở riêng. Nhưng khi dân chúng nghe tin, họ từ các thị trấn[b] đi bộ theo Ngài.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “một nơi hoang vắng” hoặc “một nơi hẻo lánh”. Từ Hy Lạp chỉ một khu vực cách biệt hoặc không có người ở, không nhất thiết là sa mạc đầy cát.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “các thành”. Tùy bối cảnh, từ Hy Lạp này có thể chỉ thị trấn hoặc thành phố.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀκούσας δὲ
  choice: Khi nghe tin ấy
  rationale: Phân từ bất định quá khứ được diễn đạt như một mệnh đề thời gian tự nhiên trong tiếng Việt. Từ “ấy” làm rõ đối tượng được nghe vốn được ngữ cảnh trước đó cung cấp; δέ chỉ chuyển tiếp câu chuyện nên không cần dịch thành một từ nối tương phản mạnh.
- source_word: ἀνεχώρησεν
  choice: rút khỏi
  rationale: Giữ sắc thái chủ động rời đi hoặc lui khỏi một nơi để đáp lại hoàn cảnh, nhưng không xác định động cơ của Đức Giê-su.
- source_word: ἐν πλοίῳ
  choice: bằng thuyền
  rationale: Cách nói tự nhiên trong tiếng Việt để chỉ phương tiện di chuyển.
- source_word: εἰς ἔρημον τόπον
  choice: đến một nơi vắng vẻ
  rationale: ἔρημος ở đây chỉ nơi hẻo lánh hoặc ít người, không nhất thiết là sa mạc.
- source_word: κατ’ ἰδίαν
  choice: để ở riêng
  rationale: Diễn đạt ý tách riêng, không mặc nhiên khẳng định tuyệt đối rằng không có bất cứ ai đi cùng.
- source_word: οἱ ὄχλοι
  choice: dân chúng
  rationale: Đây là cách gọi tập thể tự nhiên trong tiếng Việt cho những đám đông được nhắc đến; tránh lối nói gượng “các đám đông”.
- source_word: ἠκολούθησαν αὐτῷ
  choice: họ ... theo Ngài
  rationale: Diễn đạt hành động đi theo theo nghĩa kể chuyện, không thêm hàm ý môn đồ học.
- source_word: πεζῇ
  choice: đi bộ
  rationale: Tương đương rõ ràng và thông dụng cho việc di chuyển bằng chân.
- source_word: ἀπὸ τῶν πόλεων
  choice: từ các thị trấn
  rationale: πόλις có thể chỉ thành hoặc thị trấn; “thị trấn” phù hợp với bối cảnh các khu dân cư Ga-li-lê mà không làm thay đổi bản chất địa điểm.
theological_decisions:
- issue: Hàm ý về lý do Đức Giê-su rút đi
  choice: Dịch trung tính là “rút khỏi” và không nêu lý do.
  alternative: Lánh đi vì an toàn; rút đi để than khóc hoặc cầu nguyện; đơn thuần rời đi để di chuyển.
  rationale: Câu văn nối hành động rút đi với điều Đức Giê-su vừa nghe, nhưng không nói rõ động cơ; bản dịch không giải quyết thay điều văn bản để ngỏ.
- issue: Ý nghĩa của κατ’ ἰδίαν
  choice: “để ở riêng”
  alternative: “một mình” theo nghĩa tuyệt đối không có ai khác hiện diện.
  rationale: Cụm từ có thể nhấn mạnh việc tách khỏi công chúng hoặc ở chỗ riêng; cách dịch này bảo toàn khả năng ấy mà không tạo mâu thuẫn không cần thiết với bối cảnh kể chuyện.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Đức Giê-su” và đại từ “Ngài” theo lối kính trọng phổ thông. Các dấu chú thích được đặt ngay sau những từ ngữ mà chú thích giải thích.
