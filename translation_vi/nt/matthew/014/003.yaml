id: MAT.14.3
reference: Matthew 14:3
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ὁ γὰρ Ἡρῴδης κρατήσας τὸν Ἰωάννην ἔδησεν ⸀αὐτὸν καὶ ⸂ἐν φυλακῇ ἀπέθετο⸃ διὰ Ἡρῳδιάδα τὴν γυναῖκα Φιλίππου τοῦ ἀδελφοῦ αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/003.yaml
  text: For Herod had arrested John[a], bound him, and put him in prison because of Herodias, the wife of Philip his brother,
translation:
  language: vi
  text: Vì Hê-rốt đã bắt Giăng, trói ông rồi giam ông vào ngục vì Hê-rô-đia, vợ của Phi-líp, người anh em của Hê-rốt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γὰρ
  choice: Vì
  rationale: Giữ chức năng giải thích, nêu căn nguyên cho lời kể ở câu trước.
- source_word: κρατήσας τὸν Ἰωάννην
  choice: trước đó Hê-rốt đã bắt Giăng
  rationale: Phân từ bất định chỉ hành động xảy ra trước các động từ chính; “bắt” tự nhiên trong ngữ cảnh bắt giữ.
- source_word: ἔδησεν αὐτὸν
  choice: trói ông
  rationale: Diễn đạt trực tiếp δέω mà không xác định thêm là dùng dây hay xiềng.
- source_word: ἐν φυλακῇ ἀπέθετο
  choice: giam vào ngục
  rationale: Cách nói tiếng Việt tự nhiên, truyền đạt rõ việc tống giam và tình trạng bị cầm giữ.
- source_word: διὰ Ἡρῳδιάδα
  choice: vì Hê-rô-đia
  rationale: διά với đối cách ở đây biểu thị nguyên nhân.
- source_word: τὴν γυναῖκα
  choice: vợ
  rationale: Trong quan hệ sở thuộc với Φιλίππου, γυνή mang nghĩa “vợ”.
- source_word: Φιλίππου τοῦ ἀδελφοῦ αὐτοῦ
  choice: của Phi-líp, em trai mình
  rationale: Giữ quan hệ đồng vị trong tiếng Hy Lạp và làm rõ Phi-líp là em trai của Hê-rốt; đại từ phản thân “mình” tránh hiểu nhầm là em của Hê-rô-đia.
theological_decisions:
- issue: Cách mô tả quan hệ của Hê-rô-đia với Phi-líp
  choice: Hê-rô-đia, vợ của Phi-líp, em trai mình
  alternative: Hê-rô-đia, vợ của em trai mình là Phi-líp
  rationale: Dịch trung tính đúng theo câu này, chưa đưa trước phán định rằng mối quan hệ là trái luật, vì điều đó được nêu ở câu kế tiếp.
translation_notes:
  register: 'Văn phong kể chuyện trang trọng, hiện đại và dễ hiểu. Dùng các dạng tên quen thuộc trong truyền thống Kinh Thánh tiếng Việt: Hê-rốt, Giăng, Hê-rô-đia, Phi-líp. Không đặt chú thích vì “bắt” đã truyền đạt đúng nghĩa κρατέω trong ngữ cảnh và không làm mất một nét nghĩa thiết yếu cần đưa ra ngoài chính văn.'
