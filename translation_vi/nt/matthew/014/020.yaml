reference: Matthew 14:20
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἔφαγον πάντες καὶ ἐχορτάσθησαν, καὶ ἦραν τὸ περισσεῦον τῶν κλασμάτων δώδεκα κοφίνους πλήρεις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/020.yaml
  text: And they all ate and were satisfied[a], and they picked up twelve full baskets of the leftover pieces.
translation:
  language: vi
  text: Mọi người đều ăn no, rồi họ thu lại mười hai giỏ đầy những mảnh còn thừa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hoặc “những mảnh đã bẻ ra.” Từ Hy Lạp có thể chỉ các phần đã bẻ còn lại sau bữa ăn.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφαγον
  choice: ăn
  rationale: Động từ aorist trong mạch kể chuyện, được chuyển tự nhiên bằng động từ đơn “ăn”.
- source_word: πάντες
  choice: tất cả đều
  rationale: Giữ trọn phạm vi phổ quát của từ Hy Lạp và diễn đạt tự nhiên trong tiếng Việt.
- source_word: ἐχορτάσθησαν
  choice: ăn no
  rationale: χορτάζω ở thể bị động chỉ việc được cho ăn đến no; “ăn no” là cách nói tự nhiên, rõ nghĩa trong tiếng Việt hiện đại.
- source_word: ἦραν
  choice: người ta thu lại
  rationale: Trong ngữ cảnh gom phần còn thừa, “thu lại” diễn đạt tự nhiên hành động nhấc và gom; chủ thể số nhiều không được nêu rõ nên dùng “người ta” để tránh xác định quá mức.
- source_word: τὸ περισσεῦον
  choice: còn thừa
  rationale: Phân từ được danh từ hóa chỉ phần còn lại vượt quá nhu cầu; kết hợp với κλασμάτων thành “những miếng vụn còn thừa”.
- source_word: τῶν κλασμάτων
  choice: những miếng vụn
  rationale: κλάσμα là những phần đã được bẻ ra, thường là bánh; “miếng vụn” vừa dễ hiểu vừa giữ ý các mảnh đã bẻ.
- source_word: δώδεκα
  choice: mười hai
  rationale: Chuyển trực tiếp số đếm.
- source_word: κοφίνους
  choice: giỏ
  rationale: κόφινος chỉ một loại giỏ; “giỏ” là từ phổ thông và không áp đặt độ lớn hay chất liệu không được nêu.
- source_word: πλήρεις
  choice: đầy
  rationale: Tính từ bổ nghĩa cho “giỏ”; “đầy” là cách kết hợp tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Kết quả của phép lạ được mô tả bằng ngôn ngữ no đủ thông thường
  choice: ăn no
  alternative: được ăn no; được no đủ
  rationale: “Ăn no” giữ nghĩa mọi người đã được cung cấp thức ăn đầy đủ mà không thêm cách diễn giải thần học ngoài nguyên văn.
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “người ta” vì nguyên văn Hy Lạp chỉ biểu thị chủ thể số nhiều trong động từ ἦραν, không xác định đó là môn đồ hay đám đông. Dấu chú thích [a] đặt ngay sau mệnh đề có từ ngữ được giải thích.
