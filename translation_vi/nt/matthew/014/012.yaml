id: MAT.14.12
reference: Matthew 14:12
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ προσελθόντες οἱ μαθηταὶ αὐτοῦ ἦραν τὸ ⸀πτῶμα καὶ ἔθαψαν ⸀αὐτόν, καὶ ἐλθόντες ἀπήγγειλαν τῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/012.yaml
  text: And his disciples came[a], took the body, and buried him; then they went and reported it to Jesus.
translation:
  language: vi
  text: Các môn đồ của ông đến lấy thi thể[a] và chôn cất ông; rồi họ đi báo tin cho Giê-su.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “xác chết.” Từ Hy Lạp chỉ thân thể của người đã chết.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσελθόντες
  choice: đến
  rationale: Phân từ bất định quá khứ của προσέρχομαι mở đầu chuỗi hành động. “Đến” tự nhiên trong văn kể chuyện và truyền đạt đủ ý trong ngữ cảnh.
- source_word: μαθηταὶ αὐτοῦ
  choice: các môn đồ của ông
  rationale: Giữ thuật ngữ quen thuộc cho μαθηταί và giữ nguyên đại từ của bản Hy Lạp. Trong ngữ cảnh gần, “ông” chỉ Giăng Báp-tít.
- source_word: ἦραν
  choice: lấy
  rationale: αἴρω có nghĩa nhấc lên hoặc mang/lấy đi. Trong bối cảnh mai táng, “lấy” ngắn gọn, tự nhiên và không thêm chi tiết ngoài nguyên văn.
- source_word: πτῶμα
  choice: thi thể
  rationale: Từ này chỉ thân thể của người đã chết. “Thi thể” vừa rõ nghĩa vừa trang trọng, phù hợp với văn kể về việc mai táng.
- source_word: ἔθαψαν αὐτόν
  choice: chôn cất ông
  rationale: θάπτω có nghĩa là chôn hoặc mai táng. “Chôn cất ông” trực tiếp, tự nhiên và không thêm chi tiết về mộ.
- source_word: ἐλθόντες
  choice: rồi họ đi
  rationale: Phân từ này đánh dấu hành động chuyển tiếp tiếp theo. Cách diễn đạt bằng động từ hữu hạn giúp câu tiếng Việt trôi chảy, đồng thời thể hiện cả sự di chuyển lẫn trình tự.
- source_word: ἀπήγγειλαν
  choice: báo tin
  rationale: ἀπαγγέλλω có nghĩa là báo hoặc thuật lại. “Báo tin” phù hợp khi nội dung được báo đã rõ từ ngữ cảnh là cái chết và việc mai táng Giăng.
- source_word: τῷ Ἰησοῦ
  choice: cho Giê-su
  rationale: Dùng dạng phiên âm tên riêng Hy Lạp Ἰησοῦς phổ biến trong tiếng Việt, không thêm tước hiệu vốn không có trong nguyên văn.
theological_decisions:
- issue: “Các môn đồ của ông” là môn đồ của ai
  choice: Ngữ cảnh cho thấy đó là các môn đồ của Giăng Báp-tít, nhưng bản dịch vẫn giữ cách nói “của ông”.
  alternative: Hiểu là các môn đồ của Giê-su, hoặc nêu thẳng “các môn đồ của Giăng”.
  rationale: Đoạn văn ngay trước thuật lại cái chết của Giăng Báp-tít, nên đại từ αὐτοῦ tự nhiên quy chiếu về Giăng. Giữ đại từ như nguyên văn bảo toàn cách diễn đạt và chút hàm ẩn của bản Hy Lạp mà ngữ cảnh vẫn đủ rõ.
translation_notes:
  register: Văn phong kể chuyện hiện đại, rõ ràng và trang trọng vừa phải. “Thi thể” tránh sắc thái thô của “xác chết”, còn dấu chấm phẩy làm rõ hai chặng hành động liên tiếp.
