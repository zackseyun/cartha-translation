  source_fidelity: 'Bản dịch phản ánh đúng chuỗi hành động của nguyên văn: các môn đồ của Giăng đến, lấy thi thể, chôn ông, rồi đi báo cho Giê-su. “Thi thể” diễn đạt chính xác πτῶμα mà không thêm chi tiết về nơi chôn; “báo tin” chuyển đạt thích hợp ἀπήγγειλαν trong ngữ cảnh có nội dung được báo hàm ẩn.'
