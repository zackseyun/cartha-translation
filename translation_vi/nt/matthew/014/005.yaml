- from: Dù muốn giết ông, vua vẫn sợ đám đông, vì họ coi ông là một nhà tiên tri.
  to: Dù muốn giết người ấy, ông vẫn sợ đám đông, vì họ coi người ấy là một nhà tiên tri.
  rationale: Chỉ thay “vua” bằng đại từ và thay các đối tượng “ông” bằng “người ấy” để giữ hình thức tham chiếu không nêu tên của nguyên văn mà vẫn tránh mơ hồ chủ thể–đối tượng trong tiếng Việt. Các lựa chọn từ vựng và sắc thái nhượng bộ của bản thảo được giữ nguyên.
