source:
  edition: SBLGNT
  text: καὶ θέλων αὐτὸν ἀποκτεῖναι ἐφοβήθη τὸν ὄχλον, ὅτι ὡς προφήτην αὐτὸν εἶχον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/005.yaml
  text: And wanting to kill him[a], he feared the crowd[b], because they regarded him as a prophet.
translation:
  language: vi
  text: Dù muốn giết người ấy, ông vẫn sợ đám đông, vì họ coi người ấy là một nhà tiên tri.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θέλων
  choice: dù muốn
  rationale: Phân từ θέλων tự nó có nghĩa là “muốn”; trong quan hệ với động từ chính ἐφοβήθη, ngữ cảnh cho thấy sắc thái nhượng bộ. “Dù muốn” diễn đạt tự nhiên mối quan hệ ấy trong tiếng Việt.
- source_word: ἀποκτεῖναι
  choice: giết
  rationale: Diễn đạt trực tiếp nghĩa “giết, làm cho chết”, không thêm sắc thái pháp lý của “xử tử” hay phán xét đạo đức của “sát hại”.
- source_word: ἐφοβήθη
  choice: vẫn sợ
  rationale: Động từ có nghĩa là “sợ”. Từ “vẫn” kết hợp tự nhiên với mệnh đề nhượng bộ “dù muốn”, nhưng không thêm một nguyên nhân ngoài văn cảnh.
- source_word: τὸν ὄχλον
  choice: đám đông
  rationale: Cách gọi hiện đại, tự nhiên cho ὄχλος trong bối cảnh một tập thể dân chúng.
- source_word: ὅτι
  choice: vì
  rationale: Giới thiệu lý do vua sợ đám đông.
- source_word: ὡς προφήτην
  choice: là một nhà tiên tri
  rationale: 'Trong kết cấu với εἶχον, cụm này chỉ cách đám đông đánh giá nhân vật: họ coi ông là nhà tiên tri, không chỉ giống như nhà tiên tri.'
- source_word: αὐτὸν εἶχον
  choice: họ coi ông
  rationale: ἔχω với bổ ngữ vị ngữ ở đây mang nghĩa thành ngữ “coi, xem là”. “Coi ông là” tự nhiên và chính xác trong tiếng Việt.
theological_decisions:
- issue: Chủ thể và đối tượng chỉ được biểu thị bằng đại từ trong câu Hy Lạp
  choice: Giữ đối tượng là “ông”, nhưng dùng “vua” cho chủ thể để tránh chuỗi đại từ mơ hồ trong tiếng Việt
  alternative: Dù ông muốn giết người ấy, ông vẫn sợ đám đông...
  rationale: Nguyên văn dựa vào ngữ cảnh trước để nhận diện Hê-rốt và Giăng. Trong tiếng Việt, dùng liên tiếp “ông... ông” dễ khiến quan hệ chủ thể–đối tượng khó hiểu; “vua” là cách gọi theo ngữ cảnh gần, không đưa tên riêng hay một kết luận thần học vào câu.
- issue: Quan hệ cú pháp của phân từ θέλων với ἐφοβήθη
  choice: 'Diễn đạt theo nghĩa nhượng bộ: “Dù muốn... vẫn sợ”'
  alternative: “Muốn giết ông, vua sợ đám đông”
  rationale: Hình thức phân từ không tự đánh dấu nhượng bộ, nhưng mạch kể cho thấy ý định giết bị kiềm chế bởi nỗi sợ. Bản dịch chính làm rõ quan hệ ngữ cảnh mà không đổi nội dung.
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “nhà tiên tri” theo cách nói phổ thông. Không thêm chú thích vì bản dịch chính đủ rõ; mọi quan hệ tham chiếu phải được đọc trong mạch văn của các câu chung quanh.
