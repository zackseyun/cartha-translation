base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/008.yaml
  text: And she, having been prompted by her mother, says, “Give me here on a platter the head of John the Baptizer.”
translation:
  language: vi
  text: 'Cô ấy, được mẹ thúc giục, nói: “Xin cho tôi ngay đây, trên một chiếc mâm, cái đầu của Giăng, người làm phép báp-têm.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προβιβασθεῖσα
  choice: vì đã được mẹ xúi giục
  rationale: Phân từ thụ động cho biết người mẹ đã tác động từ trước; “xúi giục” tự nhiên trong ngữ cảnh một yêu cầu độc ác, đồng thời giữ rõ tác nhân và sắc thái thụ động.
- source_word: ὑπὸ τῆς μητρὸς αὐτῆς
  choice: được mẹ
  rationale: ὑπό với sở hữu cách chỉ tác nhân trong cấu trúc thụ động; tiếng Việt tự nhiên diễn đạt là “được mẹ”.
- source_word: Δός μοι
  choice: Xin vua cho tôi
  rationale: Mệnh lệnh trực tiếp được chuyển thành lời thỉnh cầu phù hợp với quan hệ giữa cô gái và nhà vua trong tiếng Việt; “vua” được bổ sung từ ngữ cảnh để đại từ xưng hô tự nhiên, không làm đổi đối tượng của mệnh lệnh.
- source_word: φησίν
  choice: liền nói
  rationale: Hiện tại lịch sử làm lời kể sống động; “liền nói” vừa tự nhiên trong văn thuật chuyện tiếng Việt vừa thể hiện phản ứng nối tiếp.
- source_word: ὧδε
  choice: ngay tại đây
  rationale: Giữ nghĩa chỉ nơi chốn “ở đây” và làm nổi bật tính tức thời hàm trong yêu cầu ở bối cảnh này mà không dịch thành một trạng từ thời gian riêng biệt.
- source_word: ἐπὶ πίνακι
  choice: đặt trên một chiếc mâm
  rationale: πίναξ ở đây là mâm hoặc đĩa lớn dùng để bày thức ăn. Thêm “đặt” làm rõ quan hệ vị trí của ἐπί bằng tiếng Việt tự nhiên.
- source_word: τὴν κεφαλὴν
  choice: cái đầu
  rationale: Dịch trực tiếp chi tiết ghê rợn vốn được nêu rõ trong nguyên văn.
- source_word: Ἰωάννου τοῦ βαπτιστοῦ
  choice: Giăng, người làm phép báp-têm
  rationale: βαπτιστής là danh từ chỉ người theo hoạt động; cách dịch này giữ lực mô tả của tước hiệu và tránh biến nó thành tên hệ phái. “Giăng” là dạng tên Kinh Thánh quen thuộc trong tiếng Việt.
theological_decisions:
- issue: Cách dịch tước hiệu βαπτιστής của Giăng
  choice: Giăng, người làm phép báp-têm
  alternative: Giăng Báp-tít
  rationale: Nguyên ngữ mô tả Giăng theo hoạt động làm phép báp-têm, không gọi tên một hệ phái. Bản chính giữ nghĩa mô tả; cách gọi truyền thống được ghi nhận như phương án quen thuộc.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “cô gái” để xác định chủ thể tự nhiên theo ngữ cảnh gần; dùng “xin vua” thay cho mệnh lệnh trần trụi nhằm phù hợp hệ thống xưng hô tiếng Việt, nhưng vẫn giữ sự trực tiếp và ghê rợn của yêu cầu.
