revisions:
- from: 'Cô gái, vì đã được mẹ xúi giục, liền nói: “Xin vua cho tôi ngay tại đây cái đầu của Giăng, người làm phép báp-têm, đặt trên một chiếc mâm.”'
  to: 'Cô ấy, được mẹ thúc giục, nói: “Xin cho tôi ngay đây, trên một chiếc mâm, cái đầu của Giăng, người làm phép báp-têm.”'
  rationale: Loại bỏ quan hệ nguyên nhân và lời xưng hô được thêm vào, thay sắc thái “xúi giục” bằng cách diễn đạt trung tính hơn cho tác động của người mẹ, đồng thời thêm chú thích về cách gọi truyền thống của tước hiệu.
  reviewer_model: gpt-5.6-terra
