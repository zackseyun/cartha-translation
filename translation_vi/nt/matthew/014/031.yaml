revisions:
- from: 'Nhưng Đức Giê-su lập tức đưa tay ra, nắm lấy ông và nói với ông: “Hỡi người ít đức tin, sao lại nghi ngờ[a]?”'
  to: 'Nhưng Đức Giê-su lập tức đưa tay ra, nắm lấy ông và nói với ông: “Người ít đức tin, sao nghi ngờ[a]?”'
  rationale: Chỉnh nhẹ để lời trực tiếp tự nhiên trong tiếng Việt hiện đại và tránh thêm sắc thái không được nêu rõ trong nguyên ngữ. Các lựa chọn từ ngữ chính, trình tự hành động, và tính mơ hồ của động từ ἐδίστασας được giữ nguyên.
