review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch chuyển tải đúng các hành động nối tiếp: Đức Giê-su lập tức đưa tay ra, nắm lấy Phi-e-rơ và trách ông về đức tin ít cùng sự nghi ngờ/dao động. “Nhưng” có thể chuyển tải δέ trong mạch văn này; “lập tức,” “đưa tay ra,” và “nắm lấy” đều phù hợp với nguyên ngữ. Tuy nhiên, “lại” trong câu hỏi thêm một sắc thái hồi chỉ/‘then again’ không được biểu thị riêng bởi εἰς τί ἐδίστασας.'
  naturalness: Câu văn nhìn chung tự nhiên. Bỏ “Hỡi” làm lời đối thoại hiện đại hơn mà vẫn giữ rõ cách xưng hô; “Người ít đức tin” là lời gọi trực tiếp tự nhiên trong văn phong Kinh Thánh hiện đại.
  terminology: “Đức Giê-su” và “đức tin” nhất quán với văn phong trang trọng. “Người ít đức tin” bảo toàn mức độ của ὀλιγόπιστε, không biến thành “vô tín.” Chú thích giữ đúng tính đa nghĩa của ἐδίστασας.
  issues:
  - severity: low
    issue: “Hỡi” mang sắc thái cổ/trang trọng hơn mức cần thiết.
    rationale: Nguyên ngữ là hô cách, nhưng tiếng Việt hiện đại không cần một hư từ tương đương để biểu thị lời gọi trực tiếp. Lược bỏ giúp câu tự nhiên hơn mà không mất nghĩa.
  - severity: low
    issue: “lại” trong “sao lại nghi ngờ?” thêm sắc thái diễn giải.
    rationale: Câu hỏi εἰς τί ἐδίστασας hỏi lý do của việc do dự/nghi ngờ; không có thành tố riêng tương ứng với “lại.” Bỏ từ này giữ bản dịch trung tính hơn.
