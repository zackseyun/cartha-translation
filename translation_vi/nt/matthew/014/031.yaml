source:
  edition: SBLGNT
  text: εὐθέως δὲ ὁ Ἰησοῦς ἐκτείνας τὴν χεῖρα ἐπελάβετο αὐτοῦ καὶ λέγει αὐτῷ· Ὀλιγόπιστε, εἰς τί ἐδίστασας;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/031.yaml
  text: Immediately Jesus stretched out his hand[a], took hold of him, and said to him, “You of little faith, why did you doubt?”
translation:
  language: vi
  text: 'Nhưng Đức Giê-su lập tức đưa tay ra, nắm lấy ông và nói với ông: “Người ít đức tin, sao nghi ngờ[a]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “do dự” hoặc “dao động.” Động từ Hy Lạp có thể chỉ sự do dự hoặc dao động, cũng như nghi ngờ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθέως
  choice: lập tức
  rationale: Diễn đạt rõ hành động xảy ra tức thời và giữ được nhịp khẩn trương của câu chuyện.
- source_word: δὲ
  choice: nhưng
  rationale: Liên từ tạo nét chuyển tiếp hơi tương phản giữa việc Phi-e-rơ chìm xuống và hành động cứu giúp tức thời của Đức Giê-su.
- source_word: ἐκτείνας τὴν χεῖρα
  choice: đưa tay ra
  rationale: Cách nói tự nhiên trong tiếng Việt, vẫn giữ hình ảnh cụ thể và trình tự hành động của nguyên văn.
- source_word: ἐπελάβετο αὐτοῦ
  choice: nắm lấy ông
  rationale: Phản ánh ý nghĩa nắm hoặc giữ lấy một người mà không diễn giải quá mức cách thức hành động.
- source_word: λέγει αὐτῷ
  choice: nói với ông
  rationale: Tiếng Việt không bắt buộc đánh dấu thì quá khứ; cách dịch này tự nhiên trong văn kể chuyện và chuyển tải động từ hiện tại lịch sử của tiếng Hy Lạp mà không gây gượng ép.
- source_word: Ὀλιγόπιστε
  choice: Hỡi người ít đức tin
  rationale: Giữ hình thức hô cách và nhấn mạnh đức tin còn thiếu hụt, chứ không biến lời quở trách thành khẳng định rằng Phi-e-rơ hoàn toàn không có đức tin.
- source_word: εἰς τί
  choice: sao
  rationale: Tương đương nghi vấn tự nhiên, ngắn gọn trong tiếng Việt hiện đại.
- source_word: ἐδίστασας
  choice: lại nghi ngờ
  rationale: “Nghi ngờ” là cách hiểu rõ và quen thuộc; từ Hy Lạp cũng có thể chỉ sự do dự hoặc dao động, nên sắc thái ấy được giữ trong chú thích.
theological_decisions:
- issue: Cách dịch Ὀλιγόπιστε liên quan đến πίστις
  choice: Hỡi người ít đức tin
  alternative: Hỡi người có đức tin nhỏ bé
  rationale: Bản dịch giữ trọng tâm ở đức tin thiếu hụt nhưng không đồng nhất điều đó với hoàn toàn vô tín, qua đó bảo toàn mức độ của lời quở trách trong nguyên văn.
- issue: Sắc thái của ἐδίστασας
  choice: nghi ngờ
  alternative: do dự; dao động
  rationale: Nguyên ngữ có thể diễn tả sự nghi ngờ, phân vân hoặc dao động. Chọn cách nói quen thuộc trong chính văn nhưng ghi nhận nghĩa khác để không giải quyết dứt khoát sự mơ hồ vốn có.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Giê-su” theo lối gọi kính trọng phổ biến; đại từ “ông” phù hợp với nhân vật Phi-e-rơ trong lời kể. Trong lời trực tiếp, lược chủ ngữ ở câu hỏi để tránh đưa thêm một quan hệ xưng hô không được nguyên văn xác định.
