review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch truyền đạt đúng trình tự và nội dung chính của câu Hy Lạp: các môn đồ thấy Người đi trên biển, hoảng sợ, nhận là φάντασμα, rồi kêu lên do sợ hãi. Tuy nhiên, chú thích hiện tại dùng các lựa chọn không tự nhiên và chưa thật sát cho φάντασμα.'
  naturalness: Câu văn nhìn chung tự nhiên. “Kêu lên” trang trọng và trung tính hơn “la lên”; đặt “Vì sợ hãi” ở đầu vế cuối giữ rõ quan hệ nguyên nhân của ἀπὸ τοῦ φόβου. “Đó là ma!” là lời thốt lên tự nhiên trong tiếng Việt hiện đại.
  terminology: “Môn đồ” và “mặt biển” phù hợp văn phong Kinh Thánh hiện đại. Đổi “Ngài” thành “Người” tránh tăng sắc thái tôn kính không được biểu thị riêng bởi đại từ αὐτόν, đồng thời vẫn là lối quy chiếu tự nhiên đến Chúa Giê-su trong ngữ cảnh. Với φάντασμα, “ma” là cách hiểu rõ ràng trong lời nhận định đầy sợ hãi của các môn đồ; chú thích nêu các phương án gần nghĩa hơn.
  issues:
  - severity: medium
    issue: Các phương án chú thích cho φάντασμα chưa tự nhiên và chưa chính xác đủ.
    rationale: “Vật hiện hình” không phải cách nói Việt ngữ tự nhiên trong ngữ cảnh này, còn “bóng hiện ra” mơ hồ. φάντασμα chỉ một sự hiện ra/ma ảnh/phantom theo nhận thức sợ hãi của người nói.
  - severity: low
    issue: “Ngài” thêm mức độ tôn kính không được mã hóa riêng trong αὐτόν.
    rationale: Dù có thể chấp nhận trong truyền thống Kinh Thánh Việt ngữ, “Người” giữ lối kể chuyện trang trọng mà ít diễn giải hơn.
  - severity: low
    issue: “La lên” hơi khẩu ngữ và có thể gợi tiếng mắng mỏ hoặc ồn ào hơn là tiếng kêu lớn.
    rationale: “Kêu lên” diễn đạt κράζω cách trung tính, tự nhiên và không định rõ sắc thái tiếng kêu quá mức.
