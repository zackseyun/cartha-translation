id: MAT.14.26
reference: Matthew 14:26
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸂οἱ δὲ μαθηταὶ ἰδόντες αὐτὸν⸃ ἐπὶ ⸂τῆς θαλάσσης⸃ περιπατοῦντα ἐταράχθησαν λέγοντες ὅτι Φάντασμά ἐστιν, καὶ ἀπὸ τοῦ φόβου ἔκραξαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/026.yaml
  text: But when the disciples saw him walking on the sea[a], they were terrified, saying, “It is a ghost!” And they cried out from fear.
translation:
  language: vi
  text: 'Nhưng khi các môn đồ thấy Người đi trên mặt biển, họ hoảng sợ và nói: “Đó là ma[a]!” Vì sợ hãi, họ kêu lên.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “một sự hiện ra” hoặc “một bóng ma.”
    reason: Nêu các cách dịch gần nghĩa của φάντασμα (“apparition,” “phantom”) mà không biến nhận định sợ hãi của các môn đồ thành một khẳng định về bản chất của điều họ thấy.
lexical_decisions:
- source_word: δὲ
  choice: Nhưng
  rationale: 'Diễn tả bước chuyển nhẹ có sắc thái tương phản: các môn đồ nhìn thấy Chúa Giê-su nhưng lại phản ứng bằng nỗi kinh hoàng.'
- source_word: μαθηταὶ
  choice: các môn đồ
  rationale: Danh từ có mạo từ chỉ nhóm môn đồ đã được xác định trong ngữ cảnh; cách dịch này tự nhiên và rõ nghĩa trong tiếng Việt.
- source_word: ἰδόντες αὐτὸν
  choice: khi các môn đồ thấy Ngài
  rationale: Chuyển phân từ bất định quá khứ thành mệnh đề thời gian, thể hiện tự nhiên trình tự sự việc trong tiếng Việt.
- source_word: ἐπὶ τῆς θαλάσσης περιπατοῦντα
  choice: đi trên mặt biển
  rationale: ἐπί với sở hữu cách ở đây chỉ việc di chuyển trên bề mặt biển; “trên mặt biển” vừa sát nghĩa vừa rõ ràng trong tiếng Việt.
- source_word: ἐταράχθησαν
  choice: họ hoảng sợ
  rationale: Trong ngữ cảnh họ tưởng thấy bóng ma rồi la lên, động từ diễn tả sự chấn động mạnh do sợ hãi; “hoảng sợ” truyền đạt đúng cường độ mà không cường điệu.
- source_word: λέγοντες
  choice: và nói
  rationale: Diễn đạt hành động đồng thời dẫn vào lời thốt lên, phù hợp cú pháp kể chuyện tự nhiên của tiếng Việt.
- source_word: Φάντασμά ἐστιν
  choice: Đó là một bóng ma!
  rationale: φάντασμα chỉ một hình dạng ma quái hay vật hiện ra. “Bóng ma” là cách nói hiện đại, dễ hiểu và trình bày nhận định đầy sợ hãi của các môn đồ chứ không khẳng định bản thể của điều họ thấy.
- source_word: ἀπὸ τοῦ φόβου
  choice: vì sợ hãi
  rationale: ἀπό ở đây diễn tả nguyên nhân; “vì sợ hãi” là cách diễn đạt nguyên nhân tự nhiên trong tiếng Việt.
- source_word: ἔκραξαν
  choice: họ la lên
  rationale: κράζω diễn tả tiếng kêu lớn; “la lên” giữ được sức mạnh của hành động mà không xác định quá mức đó là tiếng hét hay lời kêu cụ thể.
theological_decisions:
- issue: Bản chất của φάντασμα trong lời các môn đồ
  choice: Dịch là “bóng ma” trong chính văn
  alternative: “vật hiện hình” hoặc “bóng hiện ra”
  rationale: Câu này thuật lại nhận định sai lầm trong lúc hoảng sợ của các môn đồ, chứ không đưa ra lời khẳng định giáo lý về sự tồn tại hay bản chất của các linh thể. “Bóng ma” truyền đạt rõ nhận định ấy mà không bổ sung kết luận thần học.
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Ngài” để quy chiếu Chúa Giê-su theo lối diễn đạt Kinh Thánh tiếng Việt phổ thông; câu văn giữ nhịp gấp của phản ứng hoảng sợ. Dấu chú thích [a] được đặt ngay sau từ ngữ mà chú thích giải nghĩa.
