source:
  edition: SBLGNT
  text: καὶ ἠνέχθη ἡ κεφαλὴ αὐτοῦ ἐπὶ πίνακι καὶ ἐδόθη τῷ κορασίῳ, καὶ ἤνεγκεν τῇ μητρὶ αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/011.yaml
  text: And his head was brought on a platter and given to the girl[a], and she brought it to her mother.
translation:
  language: vi
  text: Đầu của ông được mang đến trên một chiếc mâm[a] và được trao cho cô gái; cô đem nó đến cho mẹ mình.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “khay” hoặc “đĩa lớn.” Từ Hy Lạp πίναξ chỉ một chiếc mâm, khay hoặc đĩa dùng để bày thức ăn.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠνέχθη
  choice: được đem đến
  rationale: Động từ aorist bị động của φέρω; cách dịch này giữ thể bị động và diễn đạt tự nhiên diễn tiến câu chuyện.
- source_word: ἡ κεφαλὴ αὐτοῦ
  choice: đầu ông
  rationale: Dịch trực tiếp cụm danh từ, không dùng lối nói giảm; đại từ “ông” phù hợp khi nhắc đến Giăng trong văn kể trang trọng, hiện đại.
- source_word: ἐπὶ πίνακι
  choice: trên một chiếc mâm
  rationale: πίναξ chỉ vật dụng phẳng dùng để bày hoặc dọn thức ăn, như mâm, khay hay đĩa lớn; “chiếc mâm” rõ nghĩa và tự nhiên trong tiếng Việt.
- source_word: ἐδόθη
  choice: trao cho
  rationale: Aorist bị động của δίδωμι; trong cấu trúc phối hợp với “được đem đến,” tiếng Việt có thể lược dấu hiệu bị động thứ hai mà vẫn giữ rõ ý đầu được giao cho cô gái.
- source_word: τῷ κορασίῳ
  choice: cho cô gái
  rationale: κοράσιον chỉ một cô gái trẻ; “cô gái” là cách gọi hiện đại, tự nhiên, không cổ kính hóa câu văn.
- source_word: ἤνεγκεν
  choice: cô đem đến
  rationale: Aorist chủ động của φέρω; chủ ngữ giống cái được thể hiện bằng “cô,” còn tân ngữ đã rõ từ mệnh đề trước nên có thể lược tự nhiên trong tiếng Việt.
- source_word: τῇ μητρὶ αὐτῆς
  choice: cho mẹ mình
  rationale: Đại từ αὐτῆς quy chiếu về cô gái; “mẹ mình” thể hiện rõ quan hệ ấy và tránh cách diễn đạt nặng nề.
