id: MAT.1.8
reference: Matthew 1:8
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἀσὰφ⸃ δὲ ἐγέννησεν τὸν Ἰωσαφάτ, Ἰωσαφὰτ δὲ ἐγέννησεν τὸν Ἰωράμ, Ἰωρὰμ δὲ ἐγέννησεν τὸν Ὀζίαν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/008.yaml
  text: Asaph fathered Jehoshaphat[a], Jehoshaphat fathered Joram, and Joram fathered Uzziah.
translation:
  language: vi
  text: A-sáp sinh Giô-sa-phát[a], Giô-sa-phát sinh Giô-ram, và Giô-ram sinh Ô-xia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Một số thủ bản chép “A-sa” thay cho “A-sáp”; “A-sa” cũng phù hợp với tên vị vua Giu-đa trong gia phả Cựu Ước.
    reason: textual_variant
lexical_decisions:
- source_word: Ἀσὰφ
  choice: A-sáp
  rationale: Chuyển âm đúng tên riêng trong bản SBLGNT; không âm thầm sửa thành A-sa theo gia phả Cựu Ước. Dị bản và vấn đề đối chiếu gia phả được nêu trong chú thích.
- source_word: δὲ
  choice: (dấu phẩy); và
  rationale: Trong chuỗi gia phả, δέ là từ nối nhẹ chứ không mang ý tương phản. Tiếng Việt tự nhiên có thể nối hai vế đầu bằng dấu phẩy và dùng “và” trước vế cuối.
- source_word: ἐγέννησεν
  choice: sinh
  rationale: Trong văn cảnh gia phả, “sinh” là cách diễn đạt ngắn gọn, trang trọng và quen thuộc trong tiếng Việt, giữ được quan hệ phụ hệ mà không dùng lối nói cổ hoặc rườm rà.
- source_word: Ἰωσαφάτ
  choice: Giô-sa-phát
  rationale: Dạng tên quen thuộc trong truyền thống Kinh Thánh tiếng Việt và tương ứng rõ với tên vị vua Giu-đa.
- source_word: Ἰωράμ
  choice: Giô-ram
  rationale: Chuyển âm dạng Hy Lạp Ἰωράμ, đồng thời dùng dạng tên dễ nhận biết trong tiếng Việt.
- source_word: Ὀζίαν
  choice: Ô-xia
  rationale: Chuyển âm gần với dạng Hy Lạp Ὀζίας và phù hợp quy ước tên riêng tiếng Việt; đây là vị vua thường được nhận diện là Uzziah.
theological_decisions:
- issue: Cách thể hiện chuỗi gia phả với δὲ và ἐγέννησεν được lặp lại
  choice: Dùng ba mệnh đề “X sinh Y”, nối tự nhiên bằng dấu phẩy và “và”, nhưng giữ nguyên từng mắt xích gia phả.
  alternative: Lặp “rồi” hoặc “còn” ở từng mệnh đề; hoặc dùng cách dài hơn như “trở thành cha của”.
  rationale: Đây là lựa chọn văn phong, không phải quyết định giáo lý. Cách dịch này vừa tự nhiên trong tiếng Việt hiện đại vừa bảo toàn đầy đủ trình tự của bản Hy Lạp.
- issue: Có nên hài hòa Ἀσὰφ với tên vua A-sa được chờ đợi trong gia phả hay không
  choice: Giữ “A-sáp” trong chính văn và ghi “A-sa” trong chú thích.
  alternative: Dùng “A-sa” trong chính văn theo gia phả Cựu Ước hoặc theo một số thủ bản.
  rationale: Ưu tiên chứng cứ nguyên ngữ đòi hỏi dịch dạng Ἀσὰφ đang có trong SBLGNT, thay vì âm thầm sửa cho phù hợp với gia phả Cựu Ước. Chú thích giúp người đọc thấy rõ dị bản và căn nguyên lịch sử của vấn đề.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Các tên riêng được viết có gạch nối theo quy ước chuyển âm phổ biến; cấu trúc được làm cho trôi chảy nhưng không lược bỏ bất kỳ mắt xích gia phả nào.
