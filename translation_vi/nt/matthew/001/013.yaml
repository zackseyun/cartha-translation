id: MAT.1.13
reference: Matthew 1:13
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ζοροβαβὲλ δὲ ἐγέννησεν τὸν Ἀβιούδ, Ἀβιοὺδ δὲ ἐγέννησεν τὸν Ἐλιακίμ, Ἐλιακὶμ δὲ ἐγέννησεν τὸν Ἀζώρ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/013.yaml
  text: Zerubbabel fathered Abiud[a], Abiud fathered Eliakim, and Eliakim fathered Azor.
translation:
  language: vi
  text: Xô-rô-ba-bên sinh A-bi-út[a]; A-bi-út sinh Ê-li-a-kim; và Ê-li-a-kim sinh A-xơ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “trở thành cha của”; trong các gia phả Kinh Thánh, động từ được lặp lại này có thể trình bày dòng dõi theo dạng rút gọn.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ζοροβαβέλ
  choice: Xô-rô-ba-bên
  rationale: Phiên âm tên riêng Hy Lạp theo cách đọc tự nhiên trong tiếng Việt, phù hợp với tên nhân vật thường được gọi là Xô-rô-ba-bên trong Kinh Thánh tiếng Việt.
- source_word: δέ
  choice: — / và
  rationale: Trong chuỗi gia phả, δέ là từ nối nhẹ để tiếp tục danh sách, không biểu thị sự tương phản mạnh. Hai mệnh đề đầu được nối bằng dấu chấm phẩy, còn mệnh đề cuối dùng “và” để giữ nhịp liệt kê tự nhiên.
- source_word: ἐγέννησεν
  choice: sinh
  rationale: Trong gia phả theo dòng nam, “sinh” là cách diễn đạt ngắn gọn, trang trọng và quen thuộc trong tiếng Việt; từ này giữ công thức lặp lại của bản Hy Lạp mà không dùng lối nói cổ.
- source_word: Ἀβιούδ
  choice: A-bi-út
  rationale: Phiên âm tên riêng Hy Lạp sang tiếng Việt, dùng dấu gạch nối để người đọc phổ thông dễ nhận biết các âm tiết.
- source_word: Ἐλιακίμ
  choice: Ê-li-a-kim
  rationale: Phiên âm sát dạng Hy Lạp và phù hợp với lối ghi tên riêng Kinh Thánh quen thuộc trong tiếng Việt.
- source_word: Ἀζώρ
  choice: A-xô
  rationale: Phiên âm dạng Hy Lạp theo âm tiếng Việt; âm ζ được thể hiện bằng “x”, và âm ρ cuối không được phát âm như một phụ âm cuối tiếng Việt.
theological_decisions:
- issue: Cách dịch γεννάω trong một gia phả có thể lược qua một số thế hệ
  choice: sinh
  alternative: là tổ tiên của / trở thành cha của
  rationale: “Sinh” giữ nguyên công thức gia phả trực tiếp của tiếng Hy Lạp nhưng không tự ý kết luận rằng mọi mắt xích đều nhất thiết là quan hệ cha-con liền kề. Chú thích nêu rõ khả năng gia phả được trình bày theo dạng rút gọn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ cấu trúc ba vế lặp của nguyên bản; tên riêng được phiên âm nhất quán theo lối tiếng Việt.
