  text: Ἰωσίας δὲ ἐγέννησεν τὸν Ἰεχονίαν καὶ τοὺς ἀδελφοὺς αὐτοῦ ἐπὶ τῆς μετοικεσίας Βαβυλῶνος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/011.yaml
  text: Josiah fathered Jeconiah and his brothers at the time of the deportation to Babylon[a].
translation:
  language: vi
  text: Giô-si-a sinh Giê-cô-nia và các anh em của ông vào thời kỳ bị đày sang Ba-by-lôn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “vào thời cuộc lưu đày sang Ba-by-lôn.” Từ Hy Lạp có thể chỉ việc cưỡng bức di dời hoặc tình trạng lưu đày.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγέννησεν
  choice: sinh
  rationale: Trong gia phả, γεννάω diễn tả quan hệ sinh thành theo dòng nam. “Sinh” là cách nói gọn, tự nhiên và trang trọng trong tiếng Việt, đồng thời không buộc câu phải giải thích mức độ trực tiếp của quan hệ huyết thống.
- source_word: Ἰεχονίαν
  choice: Giê-cô-nia
  rationale: Phiên âm tên riêng Hy Lạp theo cách viết quen thuộc và dễ đọc trong tiếng Việt.
- source_word: ἀδελφοὺς αὐτοῦ
  choice: các anh em của ông
  rationale: ἀδελφούς là danh từ giống đực số nhiều; “các anh em” giữ đúng nét nghĩa nam giới và phù hợp văn cảnh gia phả.
- source_word: ἐπὶ τῆς μετοικεσίας Βαβυλῶνος
  choice: vào thời dân chúng bị lưu đày sang Ba-by-lôn
  rationale: Cụm từ chỉ thời điểm của cuộc cưỡng bức di dời sang Ba-by-lôn. Thêm “dân chúng” làm rõ đối tượng bị lưu đày vốn được ngữ cảnh lịch sử ngầm hiểu, tránh cách nói thiếu tự nhiên như “vào thời sự lưu đày”.
- source_word: δὲ
  choice: không dịch riêng
  rationale: δέ là từ nối nhẹ trong chuỗi gia phả; tiếng Việt không cần biểu đạt riêng ở đây.
theological_decisions:
- issue: Sự rút gọn các thế hệ trong gia phả Ma-thi-ơ
  choice: Dịch công thức gia phả đúng theo lời văn Hy Lạp, không giải quyết vấn đề lịch sử ngay trong câu.
  alternative: Hiểu γεννάω theo nghĩa rộng là tổ tiên sinh ra một hậu duệ, không nhất thiết là cha trực tiếp.
  rationale: “Sinh” bảo toàn công thức gia phả và để ngỏ khả năng gia phả rút gọn các thế hệ, thay vì đưa lời giải thích dung hòa vào chính văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng các dạng tên quen thuộc trong tiếng Việt; câu giữ nhịp ngắn gọn của một gia phả.
