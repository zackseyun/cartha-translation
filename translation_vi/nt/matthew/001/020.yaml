id: MAT.1.20
reference: Matthew 1:20
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ταῦτα δὲ αὐτοῦ ἐνθυμηθέντος ἰδοὺ ἄγγελος κυρίου κατ’ ὄναρ ἐφάνη αὐτῷ λέγων· Ἰωσὴφ υἱὸς Δαυίδ, μὴ φοβηθῇς παραλαβεῖν ⸀Μαρίαν τὴν γυναῖκά σου, τὸ γὰρ ἐν αὐτῇ γεννηθὲν ἐκ πνεύματός ἐστιν ἁγίου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/020.yaml
  text: But as he was considering these things, behold, an angel of the Lord appeared to him in a dream, saying, “Joseph, son of David, do not be afraid to take Mary as your wife, for what has been conceived in her is from the Holy Spirit.”
translation:
  language: vi
  text: 'Nhưng khi ông đang suy nghĩ về những việc ấy, thì kìa, một thiên sứ của Chúa hiện ra với ông trong giấc mơ và nói: “Giô-sép, con Đa-vít, đừng sợ đón Ma-ri, vợ con, về nhà[a], vì thai trong người nàng là bởi Đức Thánh Linh.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đón Ma-ri làm vợ.” Cụm từ Hy Lạp nói đến việc đón nàng về nhà để chung sống trong hôn nhân.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνθυμηθέντος
  choice: đang suy nghĩ
  rationale: Diễn tả sự cân nhắc nội tâm đang diễn ra của Giô-sép, không biến nó thành một quyết định đã hoàn tất.
- source_word: ἰδοὺ
  choice: thì kìa
  rationale: Giữ lại dấu hiệu diễn ngôn tạo sự sống động và báo hiệu một sự xuất hiện bất ngờ trong câu chuyện.
- source_word: ἄγγελος κυρίου
  choice: một thiên sứ của Chúa
  rationale: Danh từ ἄγγελος không có mạo từ; “một thiên sứ” tránh mặc nhiên đồng nhất vị này với một nhân vật thần hiện riêng biệt.
- source_word: κατ’ ὄναρ
  choice: trong giấc mơ
  rationale: Cách diễn đạt tự nhiên trong tiếng Việt cho thành ngữ Hy Lạp chỉ sự mặc khải qua giấc mơ.
- source_word: υἱὸς Δαυίδ
  choice: con Đa-vít
  rationale: Giữ cách gọi trực tiếp và âm hưởng dòng dõi Đa-vít; trong văn cảnh gia phả, “con” có thể chỉ hậu duệ chứ không nhất thiết là con trực tiếp.
- source_word: μὴ φοβηθῇς
  choice: đừng sợ
  rationale: Cách nói ngắn gọn, tự nhiên, giữ nguyên sắc thái cấm đoán và cảm xúc của động từ.
- source_word: παραλαβεῖν Μαρίαν τὴν γυναῖκά σου
  choice: đón Ma-ri, vợ con, về nhà
  rationale: παραλαμβάνω trong văn cảnh này nói đến việc tiếp nhận Ma-ri vào nhà để hoàn tất đời sống hôn nhân; cụm đồng vị “vợ con” giữ quan hệ đã được bản văn xác nhận mà không hàm ý một cuộc kết hôn thứ hai.
- source_word: τὸ ἐν αὐτῇ γεννηθὲν
  choice: thai trong nàng
  rationale: Diễn đạt tự nhiên tình trạng trước khi sinh và không thêm từ “con trẻ” vượt quá cấu trúc trung tính của cụm phân từ Hy Lạp.
- source_word: ἐκ πνεύματός ἐστιν ἁγίου
  choice: là bởi Đức Thánh Linh
  rationale: “Bởi” thể hiện nguồn gốc theo ἐκ; “Đức Thánh Linh” là danh xưng nhân vị quen thuộc, trang trọng trong tiếng Việt.
theological_decisions:
- issue: Ý nghĩa của κυρίου trong ἄγγελος κυρίου
  choice: của Chúa
  alternative: của Đức Chúa Trời; thiên sứ của CHÚA
  rationale: “Chúa” chuyển tải κύριος mà không ép cụm từ thành công thức thần hiện trong Cựu Ước hay xác định danh Đức Chúa Trời vượt quá hình thức Hy Lạp.
- issue: Sở chỉ của πνεύματός ... ἁγίου
  choice: Đức Thánh Linh
  alternative: một linh thánh; quyền năng của Đức Thánh Linh
  rationale: Trong trình thuật thời thơ ấu của Ma-thi-ơ, cụm từ chỉ nguồn gốc thần linh của thai; bản dịch giữ danh xưng nhân vị và không diễn giải thành một quyền năng phi nhân vị.
- issue: Tình trạng hôn nhân trong τὴν γυναῖκά σου
  choice: Ma-ri, vợ con
  alternative: Ma-ri làm vợ con
  rationale: Cấu trúc Hy Lạp gọi Ma-ri là “vợ con”; cách dịch chính tránh ngụ ý rằng hành động đón nàng về mới tạo nên tình trạng vợ chồng, đồng thời chú thích làm rõ hành động hôn nhân được nói đến.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “ông” cho lời kể về Giô-sép, nhưng dùng “con” trong lời thiên sứ để thể hiện lối xưng hô trực tiếp theo quan hệ dòng dõi. Giữ “thì kìa” nhằm bảo toàn nhịp chuyển đột ngột của ἰδοὺ; dùng “nàng” cho Ma-ri trong mệnh đề cuối để tránh lặp tên và duy trì sắc thái trang trọng.
