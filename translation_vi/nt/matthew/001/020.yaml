- from: 'Nhưng khi ông đang suy nghĩ về những việc ấy, thì kìa, một thiên sứ của Chúa hiện ra với ông trong giấc mơ và nói: “Giô-sép, con Đa-vít, đừng sợ đón Ma-ri, vợ con, về nhà[a], vì thai trong nàng là bởi Đức Thánh Linh.”'
  to: 'Nhưng khi ông đang suy nghĩ về những việc ấy, thì kìa, một thiên sứ của Chúa hiện ra với ông trong giấc mơ và nói: “Giô-sép, con Đa-vít, đừng sợ đón Ma-ri, vợ con, về nhà[a], vì thai trong người nàng là bởi Đức Thánh Linh.”'
  rationale: Chỉ thay đổi tối thiểu “thai trong nàng” thành “thai trong người nàng” để dùng thành ngữ tiếng Việt tự nhiên hơn. Các lựa chọn còn lại bảo toàn sắc thái và cấu trúc ý nghĩa của bản Hy Lạp, cũng như chú thích về παραλαβεῖν ... τὴν γυναῖκά σου.
