id: MAT.1.23
reference: Matthew 1:23
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἰδοὺ ἡ παρθένος ἐν γαστρὶ ἕξει καὶ τέξεται υἱόν, καὶ καλέσουσιν τὸ ὄνομα αὐτοῦ Ἐμμανουήλ· ὅ ἐστιν μεθερμηνευόμενον Μεθ’ ἡμῶν ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/023.yaml
  text: Behold[a], the virgin will conceive and bear a son, and they will call his name Immanuel—which is translated[d][c][b], 'God with us.'
translation:
  language: vi
  text: '“Kìa, trinh nữ[a] sẽ thụ thai và sinh một con trai; họ[b] sẽ gọi tên người ấy là Em-ma-nu-ên[c]”—dịch ra là: “Đức Chúa Trời ở cùng chúng ta.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “thiếu nữ”. Tuy nhiên, trong ngữ cảnh của Ma-thi-ơ, từ Hy Lạp παρθένος và trình thuật chung quanh sự ra đời của Chúa Giê-su nâng đỡ cách dịch “trinh nữ”.
    reason: lexical_alternative
  - marker: b
    text: Nguyên văn Hy Lạp là “họ sẽ gọi”, một cách dùng số nhiều với chủ thể không xác định.
    reason: lexical_alternative
  - marker: c
    text: Tên này cũng có thể được phiên âm là “Ê-ma-nu-ên”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰδοὺ
  choice: Kìa
  rationale: Giữ chức năng kêu gọi sự chú ý và sắc thái trang trọng của lời tiên tri, đồng thời vẫn tự nhiên, dễ hiểu trong tiếng Việt hiện đại.
- source_word: ἡ παρθένος
  choice: trinh nữ
  rationale: Trong ngữ cảnh Ma-thi-ơ 1 và trình thuật về sự thụ thai khác thường, từ Hy Lạp này phù hợp nhất với nghĩa “trinh nữ”; phương án “thiếu nữ” được ghi ở chú thích để không che khuất phạm vi nghĩa và vấn đề liên văn bản với Ê-sai 7:14.
- source_word: ἐν γαστρὶ ἕξει
  choice: sẽ thụ thai
  rationale: Chuyển thành ngữ Hy Lạp nghĩa đen là “sẽ có trong lòng” sang cách diễn đạt tiếng Việt tự nhiên, chính xác và giữ thì tương lai.
- source_word: τέξεται υἱόν
  choice: sinh một con trai
  rationale: Diễn đạt trực tiếp, tự nhiên hành động sinh nở và đối tượng là con trai.
- source_word: καλέσουσιν
  choice: họ sẽ gọi
  rationale: Giữ nguyên ngôi thứ ba số nhiều không xác định của bản Hy Lạp, thay vì đổi sang câu bị động hoặc xác định chủ thể.
- source_word: τὸ ὄνομα αὐτοῦ
  choice: tên con trẻ
  rationale: Trong tiếng Việt, “tên con trẻ” tự nhiên hơn lối dịch máy móc “tên của người”; cách gọi này cũng tránh sự mơ hồ của đại từ trong câu.
- source_word: Ἐμμανουήλ
  choice: Em-ma-nu-ên
  rationale: Dùng dạng phiên âm quen thuộc và dễ đọc trong truyền thống Kinh Thánh tiếng Việt.
- source_word: ὅ ἐστιν μεθερμηνευόμενον
  choice: dịch ra là
  rationale: Cách diễn đạt gọn, tự nhiên, phản ánh đúng lời giải nghĩa tên dành cho người đọc.
- source_word: Μεθ’ ἡμῶν ὁ θεός
  choice: Đức Chúa Trời ở cùng chúng ta
  rationale: Truyền đạt trực tiếp ý nghĩa của tên, không thêm phần giải thích thần học vượt quá câu văn.
theological_decisions:
- issue: Cách dịch παρθένος trong câu nói về sự thụ thai của Chúa Giê-su
  choice: trinh nữ
  alternative: thiếu nữ
  rationale: Ngữ cảnh trực tiếp của Ma-thi-ơ 1 và cách dùng παρθένος trong tiếng Hy Lạp nâng đỡ rõ ràng cách dịch “trinh nữ”. Chú thích vẫn bảo lưu phương án từ vựng rộng hơn để không xóa bỏ cuộc thảo luận liên quan đến Ê-sai 7:14.
- issue: Ý nghĩa thần học của tên Em-ma-nu-ên
  choice: Dịch đúng lời giải nghĩa là “Đức Chúa Trời ở cùng chúng ta”
  alternative: Mở rộng thành một lời giải thích về sự nhập thể
  rationale: Bản văn tự giải nghĩa tên gọi nhưng không triển khai giáo lý tại đây; vì vậy bản dịch giữ nguyên sức nặng thần học mà không thêm diễn giải.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại, phù hợp với một lời trích dẫn tiên tri. “Kìa” giữ lực nhấn của Ἰδοὺ; các vế còn lại dùng cú pháp tiếng Việt rõ ràng, phổ thông. Dấu gạch ngang tách lời giải nghĩa tên mà không làm đứt mạch câu.
