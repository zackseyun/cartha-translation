revisions:
- from: '“Kìa, trinh nữ[a] sẽ thụ thai và sinh một con trai; họ[b] sẽ gọi tên con trẻ là Em-ma-nu-ên[c]”—dịch ra là: “Đức Chúa Trời ở cùng chúng ta.”'
  to: '“Kìa, trinh nữ[a] sẽ thụ thai và sinh một con trai; họ[b] sẽ gọi tên người ấy là Em-ma-nu-ên[c]”—dịch ra là: “Đức Chúa Trời ở cùng chúng ta.”'
  rationale: Chỉ thay “tên con trẻ” bằng “tên người ấy” để phản ánh trực tiếp hơn đại từ αὐτοῦ (“của người ấy”) và không thêm một cách gọi theo độ tuổi. Các phần khác trung thành với SBLGNT, tự nhiên trong tiếng Việt hiện đại, và các chú thích hiện có được giữ nguyên.
