id: MAT.1.3
reference: Matthew 1:3
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἰούδας δὲ ἐγέννησεν τὸν Φαρὲς καὶ τὸν Ζάρα ἐκ τῆς Θαμάρ, Φαρὲς δὲ ἐγέννησεν τὸν Ἑσρώμ, Ἑσρὼμ δὲ ἐγέννησεν τὸν Ἀράμ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/003.yaml
  text: Judah fathered Perez and Zerah by Tamar[a], Perez fathered Hezron, and Hezron fathered Aram.
translation:
  language: vi
  text: Giu-đa sinh Pê-rết và Xê-rách với Ta-ma; Pê-rết sinh Hết-rôn, và Hết-rôn sinh A-ram.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Một số bản dịch tiếng Anh ghi tên này là “Ram”, theo một lối phiên âm hoặc truyền thống khác; bản Hy Lạp tại đây ghi “A-ram”.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἰούδας
  choice: Giu-đa
  rationale: Dùng dạng tên quen thuộc trong Kinh Thánh tiếng Việt cho tổ phụ Giu-đa, tránh liên tưởng đến các nhân vật Tân Ước thường được gọi là Giu-đa Ích-ca-ri-ốt hoặc Giu-đa khác.
- source_word: δὲ
  choice: dấu chấm phẩy / và
  rationale: Ở đây δέ là từ nối nhẹ trong chuỗi gia phả, không biểu thị sự tương phản mạnh. Dấu câu và liên từ “và” tạo nhịp văn tự nhiên trong tiếng Việt.
- source_word: ἐγέννησεν
  choice: sinh
  rationale: Trong văn cảnh gia phả, động từ này chỉ việc làm cha hoặc thuộc dòng sinh ra. “Sinh” là cách diễn đạt ngắn gọn, trang trọng và quen thuộc trong gia phả Kinh Thánh tiếng Việt.
- source_word: Φαρὲς
  choice: Pê-rết
  rationale: Dạng phiên âm tiếng Việt tương ứng với tên Hê-bơ-rơ פֶּרֶץ, giúp duy trì tính nhất quán với nhân vật Cựu Ước.
- source_word: Ζάρα
  choice: Xê-rách
  rationale: Dạng phiên âm tiếng Việt tương ứng với tên Hê-bơ-rơ זֶרַח và giữ sự liên tục với nhân vật Cựu Ước.
- source_word: ἐκ τῆς Θαμάρ
  choice: với Ta-ma
  rationale: ἐκ cùng tên người mẹ biểu thị nguồn gốc theo mẹ. “Với Ta-ma” diễn đạt tự nhiên rằng Giu-đa có Pê-rết và Xê-rách với bà, mà không thêm lời giải thích ngoài nguyên văn.
- source_word: Θαμάρ
  choice: Ta-ma
  rationale: Dạng phiên âm tiếng Việt quen thuộc của tên riêng này.
- source_word: Ἑσρώμ
  choice: Hết-rôn
  rationale: Dạng tên tương ứng với חֶצְרוֹן trong Cựu Ước, duy trì sự nhất quán giữa các phần Kinh Thánh.
- source_word: Ἀράμ
  choice: A-ram
  rationale: Bản SBLGNT được cung cấp đọc là Ἀράμ, vì vậy bản dịch chuyển âm trực tiếp là “A-ram” thay vì hòa hợp với truyền thống dùng “Ram” ở một số bản dịch.
theological_decisions:
- issue: Có nên hòa hợp tên cuối câu với dạng thường gặp trong gia phả Cựu Ước hay không
  choice: A-ram
  alternative: Ram
  rationale: 'Ưu tiên chứng cứ nguyên ngữ được cung cấp: bản Hy Lạp đọc Ἀράμ. Dạng “Ram” được ghi ở chú thích để người đọc nhận biết truyền thống khác mà không thay thế cách đọc của bản nguồn.'
translation_notes:
  register: Văn phong gia phả ngắn gọn, trang trọng và dễ hiểu trong tiếng Việt hiện đại. Dùng các dạng tên có gạch nối theo quy ước phiên âm Kinh Thánh tiếng Việt; giữ cấu trúc lặp “sinh” để phản ánh nhịp của nguyên văn.
