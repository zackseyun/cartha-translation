reference: Matthew 1:16
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἰακὼβ δὲ ἐγέννησεν τὸν Ἰωσὴφ τὸν ἄνδρα Μαρίας, ἐξ ἧς ἐγεννήθη Ἰησοῦς ὁ λεγόμενος χριστός.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/016.yaml
  text: And Jacob fathered Joseph[a], the husband of Mary, from whom Jesus was born[b], who is called the Messiah.
translation:
  language: vi
  text: Gia-cốp sinh Giô-sép, chồng của Ma-ri; Đức Giê-su, Đấng được gọi là Đấng Mê-si-a[a], đã được sinh ra từ bà.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “Đấng Ki-tô.” Từ Hy Lạp Christos ở đây được dùng như một danh hiệu.
    reason: alternative_rendering
lexical_decisions:
- source_word: δὲ
  choice: không dịch thành một từ riêng
  rationale: Ở đây δέ chỉ nhẹ nhàng tiếp nối gia phả. Cấu trúc nối tiếp tự nhiên của tiếng Việt đã thể hiện chức năng này; thêm “và” hoặc “còn” sẽ dễ làm câu nặng hoặc gợi sự tương phản quá mức.
- source_word: ἐγέννησεν
  choice: sinh
  rationale: Trong văn cảnh gia phả, “sinh” là cách nói ngắn gọn, quen thuộc để chỉ quan hệ cha–con, đồng thời tránh từ cổ.
- source_word: τὸν ἄνδρα Μαρίας
  choice: chồng của Ma-ri
  rationale: Với sở hữu cách “của Ma-ri”, ἀνήρ mang nghĩa quan hệ hôn nhân, nên “chồng” rõ ràng và tự nhiên hơn “người đàn ông”.
- source_word: ἐξ ἧς
  choice: bởi bà
  rationale: Đại từ quan hệ giống cái số ít chỉ riêng Ma-ri. “Bởi bà” giữ được sự quy chiếu ấy và sắc thái nguồn gốc của ἐκ mà không chuyển Giô-sép thành cha của Đức Giê-su.
- source_word: ἐγεννήθη
  choice: được sinh ra
  rationale: Thể bị động đánh dấu sự thay đổi so với công thức chủ động trước đó trong gia phả. “Được sinh ra” bảo toàn sự thay đổi có chủ ý này.
- source_word: ὁ λεγόμενος
  choice: Đấng được gọi là
  rationale: Cụm này trực tiếp nhận diện Đức Giê-su bằng danh hiệu được dùng cho Ngài. “Đấng” phù hợp với văn phong tôn kính nhưng vẫn hiện đại.
- source_word: χριστός
  choice: Đấng Mê-si-a
  rationale: Trong công thức “được gọi là”, χριστός hoạt động rõ ràng như một danh hiệu. Dịch là “Đấng Mê-si-a” truyền đạt ý nghĩa danh hiệu thay vì khiến từ này bị hiểu như một phần của tên riêng.
theological_decisions:
- issue: Cách dịch Χριστός trong công thức nhận diện Đức Giê-su
  choice: Đấng Mê-si-a
  alternative: Đấng Ki-tô
  rationale: Ở đây χριστός là danh hiệu chứ chưa mang tính tên riêng. Bản dịch giữ chức năng danh hiệu và ghi cách gọi quen thuộc khác trong chú thích.
- issue: Sự thay đổi công thức từ Giô-sép đến Đức Giê-su
  choice: Dùng chủ động “Gia-cốp sinh Giô-sép” nhưng bị động “Đức Giê-su… được sinh ra” và quy chiếu về Ma-ri
  alternative: Diễn đạt Giô-sép sinh Đức Giê-su hoặc làm cha của Đức Giê-su
  rationale: Nguyên văn chuyển từ ἐγέννησεν chủ động sang ἐγεννήθη bị động, kèm ἐξ ἧς giống cái số ít. Bản dịch giữ nguyên sự chuyển đổi này mà không thêm lời giải thích giáo lý.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dấu chấm phẩy làm rõ bước chuyển từ quan hệ Gia-cốp–Giô-sép sang việc Đức Giê-su được sinh ra bởi Ma-ri, đồng thời vẫn giữ toàn câu như nguyên văn.
