  source_fidelity: 'Bản nháp giữ đúng các quan hệ chủ yếu: Gia-cốp là cha của Giô-sép; Giô-sép là chồng của Ma-ri; và Đức Giê-su được sinh ra từ Ma-ri, không nói Giô-sép sinh Đức Giê-su. Tuy nhiên, “bởi bà mà ... được sinh ra” không diễn đạt tự nhiên quan hệ nguồn gốc của ἐξ ἧς trong tiếng Việt.'
  naturalness: Cụm “bởi bà mà Đức Giê-su ... được sinh ra” nặng và dễ gợi nghĩa tác nhân của bị động. Đưa cụm “từ bà” về cuối mệnh đề tạo tiếng Việt hiện đại, rõ ràng hơn, đồng thời để “Đấng được gọi là Đấng Mê-si-a” bổ nghĩa trực tiếp cho Đức Giê-su.
  terminology: “chồng của Ma-ri,” “Đức Giê-su,” và “Đấng Mê-si-a” phù hợp với văn phong trang trọng hiện đại. Chú thích nêu phương án “Đấng Ki-tô” là phù hợp và không áp đặt diễn giải thêm.
  issues:
