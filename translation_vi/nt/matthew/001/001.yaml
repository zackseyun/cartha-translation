  text: The book of the genealogy of Jesus the Messiah[a], the son of David[b], the son of Abraham.
translation:
  language: vi
  text: Sách gia phả[b] của Giê-su, Đấng Mê-si-a[a], con cháu Đa-vít, con cháu Áp-ra-ham.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “Đấng Ki-tô”. Từ Hy Lạp Χριστός là một tước hiệu, nghĩa là “Đấng được xức dầu”.
    reason: alternative_reading
  - marker: b
    text: 'Cũng có thể dịch phần mở đầu sát hơn là: “Sách về dòng dõi của Giê-su…” Từ Hy Lạp được dịch là “gia phả” cũng có thể mang nghĩa rộng hơn là “nguồn gốc” hoặc “sự ra đời”. Nguyên văn gọi Giê-su là “con Đa-vít, con Áp-ra-ham”; trong ngữ cảnh này, “con” chỉ hậu duệ.'
    reason: alternative_reading
lexical_decisions:
- source_word: Βίβλος γενέσεως
  choice: Gia phả
  rationale: Cụm này mở đầu như một nhan đề cho danh sách dòng dõi ngay sau đó. “Gia phả” là cách diễn đạt tự nhiên, rõ nghĩa trong tiếng Việt; sắc thái rộng hơn của γένεσις được ghi ở chú thích.
- source_word: Ἰησοῦ
  choice: Đức Giê-su
  rationale: Dùng dạng tên riêng quen thuộc trong tiếng Việt; “Đức” giữ giọng văn trang trọng mà không thêm một tước hiệu giáo phái.
- source_word: χριστοῦ
  choice: Đấng Mê-si-a
  rationale: Χριστός ở đây mang tính tước hiệu, chỉ Đấng được xức dầu, chứ không đơn thuần là họ riêng. “Đấng Mê-si-a” làm rõ chức năng tước hiệu trong tiếng Việt.
- source_word: υἱοῦ Δαυὶδ
  choice: con cháu vua Đa-vít
  rationale: υἱός có nghĩa đen là “con” nhưng tại đây chỉ hậu duệ. Thêm “vua” giúp người đọc hiện đại nhận ra liên hệ hoàng gia và ý nghĩa của tước hiệu “con vua Đa-vít”.
- source_word: υἱοῦ Ἀβραάμ
  choice: con cháu ông Áp-ra-ham
  rationale: Trong ngữ cảnh gia phả, cụm này chỉ người thuộc dòng dõi Áp-ra-ham. “Con cháu” truyền đạt đúng quan hệ hậu duệ trong tiếng Việt hiện đại.
theological_decisions:
- issue: Cách dịch Χριστός
  choice: Đấng Mê-si-a
  alternative: Đấng Ki-tô
  rationale: Nguyên ngữ dùng tước hiệu “Đấng được xức dầu”. “Đấng Mê-si-a” giữ rõ bối cảnh kỳ vọng về vị vua được Đức Chúa Trời xức dầu; cách gọi truyền thống “Đấng Ki-tô” được bảo lưu trong chú thích.
- issue: Nghĩa của γενέσεως trong tiêu đề
  choice: gia phả
  alternative: nguồn gốc; sự ra đời
  rationale: Danh sách dòng dõi tiếp theo khiến “gia phả” là nghĩa phù hợp nhất trong câu chính, nhưng từ Hy Lạp cũng có thể gợi đến nguồn gốc hoặc sự ra đời; chú thích bảo tồn độ rộng nghĩa đó.
- issue: Cách diễn đạt υἱοῦ trong hai mối liên hệ tổ tiên
  choice: con cháu
  alternative: con
  rationale: “Con cháu” diễn đạt minh bạch quan hệ hậu duệ theo ngữ cảnh, trong khi chú thích cho biết nguyên văn là “con” để không làm mất sắc thái tước hiệu và giao ước.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Câu chính ưu tiên cách nói tự nhiên “gia phả” và “con cháu”, đồng thời chú thích bảo lưu cấu trúc sát nguyên văn cùng độ rộng nghĩa của γενέσεως. Tên riêng dùng lối phiên âm tiếng Việt phổ biến.
