id: MAT.1.17
reference: Matthew 1:17
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Πᾶσαι οὖν αἱ γενεαὶ ἀπὸ Ἀβραὰμ ἕως Δαυὶδ γενεαὶ δεκατέσσαρες, καὶ ἀπὸ Δαυὶδ ἕως τῆς μετοικεσίας Βαβυλῶνος γενεαὶ δεκατέσσαρες, καὶ ἀπὸ τῆς μετοικεσίας Βαβυλῶνος ἕως τοῦ χριστοῦ γενεαὶ δεκατέσσαρες.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/017.yaml
  text: So all the generations from Abraham to David were fourteen generations[a], and from David to the exile to Babylon fourteen generations[b], and from the exile to Babylon to the Messiah fourteen generations.
translation:
  language: vi
  text: Như vậy, từ Áp-ra-ham đến Đa-vít có tất cả mười bốn thế hệ; từ Đa-vít đến cuộc lưu đày sang Ba-by-lôn có mười bốn thế hệ; và từ cuộc lưu đày sang Ba-by-lôn đến Đấng Mê-si[a] có mười bốn thế hệ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “Đấng Christ.” Tước hiệu Hy Lạp χριστός có nghĩa là “Đấng được xức dầu.”
    reason: alternative_reading
lexical_decisions:
- source_word: Πᾶσαι οὖν αἱ γενεαὶ
  choice: Vậy, tất cả các thế hệ
  rationale: “Vậy” giữ chức năng tổng kết/suy luận của οὖν; “tất cả các thế hệ” thể hiện đầy đủ Πᾶσαι αἱ γενεαί và phù hợp với văn mạch gia phả.
- source_word: ἀπὸ ... ἕως
  choice: từ ... đến
  rationale: Diễn đạt tự nhiên và chính xác khoảng nối giữa các mốc trong gia phả.
- source_word: γενεαὶ δεκατέσσαρες
  choice: là mười bốn thế hệ
  rationale: Giữ rõ số lượng và nhịp điệp ba phần của câu Hy Lạp.
- source_word: μετοικεσίας Βαβυλῶνος
  choice: cuộc lưu đày sang Ba-by-lôn
  rationale: μετοικεσία chỉ việc bị di dời khỏi quê hương đến nơi lưu đày; “lưu đày sang” vừa nêu biến cố vừa giữ hướng đến Ba-by-lôn.
- source_word: τοῦ χριστοῦ
  choice: Đấng Mê-si
  rationale: Trong cao trào của gia phả, χριστός có mạo từ và mang nghĩa tước hiệu; “Đấng Mê-si” truyền đạt ý nghĩa ấy thay vì coi đây chỉ là tên riêng.
- source_word: Ἀβραὰμ / Δαυὶδ / Βαβυλῶνος
  choice: Áp-ra-ham / Đa-vít / Ba-by-lôn
  rationale: Dùng các dạng phiên âm Kinh Thánh quen thuộc, dễ nhận biết trong tiếng Việt.
theological_decisions:
- issue: Cách dịch Χριστός
  choice: Đấng Mê-si
  alternative: Đấng Christ / Chúa Cứu Thế
  rationale: Tại đây từ này là tước hiệu chỉ nhân vật mà gia phả hướng đến. “Đấng Mê-si” giữ liên hệ với ý niệm Đấng được xức dầu và tránh biến tước hiệu thành tên riêng; chú thích ghi nhận cách gọi truyền thống khác.
- issue: Con số mười bốn trong ba chặng gia phả
  choice: Giữ nguyên lời tổng kết của tác giả mà không giải thích cách đếm trong chính văn
  alternative: Thêm lời giải thích hoặc điều chỉnh để dung hòa các cách đếm
  rationale: Bản nguồn nhấn mạnh cấu trúc ba nhóm mười bốn; bản dịch phải bảo toàn lời khẳng định và sự căng thẳng nội tại thay vì âm thầm giải quyết vấn đề thống kê.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dấu chấm phẩy làm nổi bật ba chặng song song của gia phả; sự lặp lại “là mười bốn thế hệ” có chủ ý để giữ nhịp tu từ của nguyên văn.
