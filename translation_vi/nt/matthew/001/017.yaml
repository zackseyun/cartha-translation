  - severity: low
    issue: Chú thích dùng dạng La-tinh “christos” và gộp một giải thích từ nguyên vào chú thích có nhãn phương án dịch.
    rationale: Dùng “χριστός” chính xác hơn; chú thích phương án dịch nên tập trung vào “Đấng Christ”, còn nghĩa “đấng được xức dầu” có thể được nêu ngắn gọn như giải thích tước hiệu.
