  text: τοῦτο δὲ ὅλον γέγονεν ἵνα πληρωθῇ τὸ ῥηθὲν ⸀ὑπὸ κυρίου διὰ τοῦ προφήτου λέγοντος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/022.yaml
  text: All this happened so that what was spoken by the Lord through the prophet might be fulfilled[a], saying,
translation:
  language: vi
  text: 'Tất cả những việc này đã xảy ra để điều Chúa đã phán qua nhà tiên tri được ứng nghiệm rằng:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῦτο δὲ ὅλον
  choice: Mọi việc này
  rationale: Diễn đạt tự nhiên ý chỉ toàn bộ những sự việc vừa được kể; ὅλον nhấn mạnh tính toàn thể, còn δέ có chức năng nối tiếp lời kể nên không cần thêm một từ chỉ thời gian như “bấy giờ”.
- source_word: γέγονεν
  choice: đã xảy ra
  rationale: Chuyển tải động từ hoàn thành của γίνομαι bằng lối kể chuyện tiếng Việt hiện đại, rõ ràng và tự nhiên.
- source_word: ἵνα πληρωθῇ
  choice: để ứng nghiệm
  rationale: Giữ sắc thái mục đích/kết quả của ἵνα cùng chủ đề ứng nghiệm lời Kinh Thánh; cách diễn đạt chủ động về mặt cú pháp là tự nhiên trong tiếng Việt mà không thay đổi ý nghĩa.
- source_word: τὸ ῥηθὲν ὑπὸ κυρίου
  choice: lời Chúa đã phán
  rationale: Diễn đạt thành ngữ danh hóa “điều đã được phán bởi Chúa” bằng cấu trúc tiếng Việt tự nhiên, đồng thời vẫn xác định Chúa là nguồn phát ngôn.
- source_word: διὰ τοῦ προφήτου
  choice: qua nhà tiên tri
  rationale: Giữ rõ vai trò trung gian của nhà tiên tri, phân biệt với Chúa là Đấng phán.
- source_word: λέγοντος
  choice: 'rằng:'
  rationale: Dấu hai chấm cùng từ “rằng” giới thiệu trực tiếp nội dung lời tiên tri ở câu kế tiếp, tránh lối diễn đạt lặp và nặng nề trong tiếng Việt.
theological_decisions:
- issue: Vai trò tác nhân trong lời tiên tri
  choice: “lời Chúa đã phán qua nhà tiên tri”
  alternative: “lời nhà tiên tri đã nói từ Chúa”
  rationale: 'Bản dịch giữ sự phân biệt của ὑπό và διά: Chúa là nguồn tối hậu của lời phán, còn nhà tiên tri là người trung gian, nhưng không triển khai thêm một học thuyết ngoài điều câu văn khẳng định.'
- issue: Công thức ứng nghiệm
  choice: “để ứng nghiệm”
  alternative: “với kết quả là ... được ứng nghiệm”
  rationale: Cách dịch giữ nguyên sức căng giữa mục đích và kết quả trong ἵνα + lối giả định, không quyết định quá mức rằng tác giả chỉ nhấn mạnh một trong hai.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại, dễ hiểu. Dùng “nhà tiên tri” là cách gọi phổ thông; cấu trúc “lời Chúa đã phán qua...” vừa tự nhiên trong tiếng Việt vừa bảo toàn sự phân biệt về tác nhân trong nguyên văn.
