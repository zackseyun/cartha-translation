revisions:
- from: 'Mọi việc này đã xảy ra để ứng nghiệm lời Chúa đã phán qua nhà tiên tri[a] rằng:'
  to: 'Tất cả những việc này đã xảy ra để điều Chúa đã phán qua nhà tiên tri được ứng nghiệm rằng:'
  rationale: Đổi “Mọi việc này” thành “Tất cả những việc này” để biểu đạt minh bạch hơn sắc thái toàn thể của τοῦτο δὲ ὅλον. Đổi “để ứng nghiệm lời Chúa...” thành “để điều Chúa ... được ứng nghiệm” nhằm giữ thể bị động của πληρωθῇ, vẫn bảo toàn quan hệ “bởi Chúa, qua nhà tiên tri,” và không quyết định quá mức sắc thái mục đích/kết quả của ἵνα.
