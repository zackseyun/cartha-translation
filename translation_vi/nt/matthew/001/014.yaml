id: MAT.1.14
reference: Matthew 1:14
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἀζὼρ δὲ ἐγέννησεν τὸν Σαδώκ, Σαδὼκ δὲ ἐγέννησεν τὸν Ἀχίμ, Ἀχὶμ δὲ ἐγέννησεν τὸν Ἐλιούδ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/014.yaml
  text: Azor fathered Zadok, Zadok fathered Achim, and Achim fathered Eliud.
translation:
  language: vi
  text: A-xô sinh Xa-đốc; Xa-đốc sinh A-khim; và A-khim sinh Ê-li-út.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀζώρ
  choice: A-xô
  rationale: Phiên âm tên riêng Hy Lạp theo lối viết dễ đọc và quen thuộc trong tiếng Việt.
- source_word: δέ
  choice: dấu chấm phẩy; và
  rationale: Trong gia phả, δέ chủ yếu nối tiếp các mắt xích. Hai dấu chấm phẩy thể hiện sự tiếp nối tự nhiên, còn lần cuối được dịch là “và” để câu tiếng Việt trôi chảy.
- source_word: ἐγέννησεν
  choice: sinh
  rationale: Trong văn cảnh gia phả, “sinh” là cách diễn đạt ngắn gọn, tự nhiên và trang trọng trong tiếng Việt; từ này vẫn có thể chỉ quan hệ tổ tiên–hậu duệ trong một bản gia phả, không nhất thiết khẳng định mọi thế hệ trung gian đều được nêu ra.
- source_word: τὸν
  choice: không dịch riêng
  rationale: Mạo từ đối cách đánh dấu bổ ngữ trực tiếp trong tiếng Hy Lạp; tiếng Việt không dùng mạo từ trước tên riêng trong cấu trúc này.
- source_word: Σαδώκ
  choice: Xa-đốc
  rationale: Phiên âm tên riêng Hy Lạp sang tiếng Việt theo cách rõ âm và dễ đọc.
- source_word: Ἀχίμ
  choice: A-khim
  rationale: Phiên âm tên riêng Hy Lạp sang tiếng Việt theo cách rõ âm và dễ đọc.
- source_word: Ἐλιούδ
  choice: Ê-li-út
  rationale: Phiên âm tên riêng Hy Lạp sang tiếng Việt theo cách rõ âm và dễ đọc.
theological_decisions:
- issue: Phạm vi quan hệ gia phả của ἐγέννησεν
  choice: Dùng “sinh” mà không thêm “trực tiếp” hoặc “làm cha của”
  alternative: làm cha của
  rationale: Cách dịch này giữ sự súc tích của nguyên văn và không giải quyết quá mức khả năng gia phả có thể lược bỏ một số thế hệ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu; giữ nhịp lặp đặc trưng của danh sách gia phả. Không cần chú thích cho câu này.
