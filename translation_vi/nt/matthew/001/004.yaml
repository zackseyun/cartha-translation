id: MAT.1.4
reference: Matthew 1:4
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἀρὰμ δὲ ἐγέννησεν τὸν Ἀμιναδάβ, Ἀμιναδὰβ δὲ ἐγέννησεν τὸν Ναασσών, Ναασσὼν δὲ ἐγέννησεν τὸν Σαλμών,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/004.yaml
  text: Aram fathered Amminadab[a], and Amminadab fathered Nahshon, and Nahshon fathered Salmon.
translation:
  language: vi
  text: A-ram[a] sinh A-mi-na-đáp; A-mi-na-đáp sinh Na-ha-sôn; Na-ha-sôn sinh San-môn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “Ram”. Bản Hy Lạp ghi A-ram (Ἀράμ); nhiều bản dịch dùng “Ram” theo dạng tên trong gia phả Hê-bơ-rơ.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀρὰμ
  choice: A-ram
  rationale: Phiên âm trực tiếp dạng tên Hy Lạp Ἀράμ, đồng thời giữ dạng Ra-ma trong chú thích vì truyền thống gia phả Hê-bơ-rơ thường dùng dạng ấy.
- source_word: δὲ
  choice: dùng dấu chấm phẩy, không dịch thành một từ riêng
  rationale: Trong chuỗi gia phả, δέ có chức năng nối tiếp hơn là tương phản. Dấu chấm phẩy tạo nhịp liệt kê tự nhiên trong tiếng Việt mà vẫn thể hiện sự chuyển sang mắt xích kế tiếp.
- source_word: ἐγέννησεν
  choice: sinh
  rationale: Trong văn cảnh gia phả, từ này chỉ quan hệ sinh thành theo dòng cha. “Sinh” ngắn gọn, rõ ràng và tự nhiên hơn lối cổ “sinh hạ” hay cách diễn đạt dài “trở thành cha của”.
- source_word: Ἀμιναδάβ
  choice: A-mi-na-đáp
  rationale: Phiên âm tên riêng Hy Lạp sang âm tiết tiếng Việt, giữ đủ các thành tố chính của tên.
- source_word: Ναασσών
  choice: Na-ha-sôn
  rationale: Dùng dạng Việt hóa dễ đọc, tương ứng với tên gia phả quen thuộc bắt nguồn từ tiếng Hê-bơ-rơ, thay vì phiên tự máy móc dạng Hy Lạp.
- source_word: Σαλμών
  choice: San-môn
  rationale: Dùng dạng phiên âm tiếng Việt rõ ràng cho tên riêng Hy Lạp, tránh để người đọc hiểu nhầm theo từ vựng của ngôn ngữ khác.
theological_decisions:
- issue: Phạm vi ý nghĩa của ἐγέννησεν trong gia phả
  choice: sinh
  alternative: là tổ phụ của
  rationale: Bản văn dùng công thức gia phả thông thường và không tự nêu rõ có bỏ qua thế hệ hay không. “Sinh” bảo toàn cách diễn đạt trực tiếp của nguồn Hy Lạp, không tự ý mở rộng thành quan hệ tổ tiên xa.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Cấu trúc lặp cùng dấu chấm phẩy giữ nhịp gia phả cô đọng của nguyên văn; tên riêng được ngắt âm bằng dấu gạch nối theo lối Việt hóa.
