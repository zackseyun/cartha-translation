  naturalness: Câu ngắn gọn, nhịp điệu tự nhiên và trang trọng cho văn cảnh gia phả. Cách ngắt âm bằng gạch nối nhất quán với hệ thống tên riêng đang dùng.
  terminology: “Sinh” là cách diễn đạt cô đọng, quen thuộc trong gia phả và không thêm diễn giải về các thế hệ có thể được lược qua. Tuy nhiên, chú thích thay thế “Ra-ma” không tương ứng chính xác với lựa chọn tiếng Anh “Ram” và có thể bị hiểu là một tên khác; nên ghi “Ram” như một dạng thay thế, đồng thời diễn đạt thận trọng rằng đây là dạng thường dùng theo gia phả Hê-bơ-rơ.
