id: MAT.1.9
reference: Matthew 1:9
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ὀζίας δὲ ἐγέννησεν τὸν Ἰωαθάμ, Ἰωαθὰμ δὲ ἐγέννησεν τὸν Ἀχάζ, Ἀχὰζ δὲ ἐγέννησεν τὸν Ἑζεκίαν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/009.yaml
  text: Uzziah fathered Jotham[a], and Jotham fathered Ahaz, and Ahaz fathered Hezekiah,
translation:
  language: vi
  text: Ô-xia sinh Giô-tham[a], Giô-tham sinh A-cha, và A-cha sinh Ê-xê-chia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hy Lạp ἐγέννησεν theo truyền thống có thể dịch là “sinh ra” hoặc “sinh”; ở đây dùng “sinh” theo lối diễn đạt ngắn gọn của gia phả.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὀζίας
  choice: Ô-xia
  rationale: Dùng dạng tên quen thuộc trong Kinh Thánh tiếng Việt cho vua Giu-đa tương ứng, thay vì phiên âm máy móc dạng Hy Lạp.
- source_word: δὲ
  choice: và / không dịch riêng ở đầu các vế
  rationale: Trong chuỗi gia phả, δέ là từ nối nhẹ để tiếp tục danh sách. Tiếng Việt tự nhiên không cần lặp “và” sau mỗi tên; giữ một “và” trước vế cuối vừa rõ quan hệ vừa tránh nặng nề.
- source_word: ἐγέννησεν
  choice: sinh
  rationale: Trong công thức gia phả với chủ thể là người cha, “sinh” là cách diễn đạt ngắn gọn, trang trọng và quen thuộc trong tiếng Việt, bảo toàn nhịp lặp của nguyên văn.
- source_word: Ἰωαθάμ
  choice: Giô-tham
  rationale: Dùng dạng tên Kinh Thánh tiếng Việt quen thuộc của vua Giu-đa này.
- source_word: Ἀχάζ
  choice: A-cha
  rationale: Dùng dạng tên Kinh Thánh tiếng Việt quen thuộc, tương ứng với vua Ahaz.
- source_word: Ἑζεκίαν
  choice: Ê-xê-chia
  rationale: Dùng dạng tên Kinh Thánh tiếng Việt quen thuộc của vua Hezekiah.
theological_decisions:
- issue: Sắc thái gia phả của γεννάω
  choice: Dịch là “sinh”, trình bày sự kế tục theo dòng cha như câu văn nêu trực tiếp.
  alternative: “là cha của”; “sinh ra”; “là tổ tiên của”
  rationale: Công thức lặp của Ma-thi-ơ trình bày quan hệ gia phả trực tiếp. “Sinh” giữ được nghĩa và nhịp điệu mà không tự ý mở rộng thành “là tổ tiên của”, dù các gia phả Kinh Thánh đôi khi có thể lược qua một số thế hệ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc; giữ cấu trúc lặp của gia phả nhưng điều chỉnh liên từ cho tự nhiên trong tiếng Việt. Mọi dấu câu và tên riêng theo lối trình bày Kinh Thánh tiếng Việt phổ biến.
source_grounding:
  english_pob_role: consult_only
