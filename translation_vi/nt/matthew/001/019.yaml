id: MAT.1.19
reference: Matthew 1:19
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἰωσὴφ δὲ ὁ ἀνὴρ αὐτῆς, δίκαιος ὢν καὶ μὴ θέλων αὐτὴν ⸀δειγματίσαι, ἐβουλήθη λάθρᾳ ἀπολῦσαι αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/019.yaml
  text: And Joseph[a], her husband, being a righteous man and not wanting to expose her to public disgrace[c][b], intended to divorce her quietly.
translation:
  language: vi
  text: Giô-sép, chồng nàng[a], là người công chính và không muốn bêu nhục nàng công khai[b], nên định âm thầm ly dị nàng[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “người đã đính hôn với nàng.” Tiếng Hy Lạp nói “người đàn ông/chồng của nàng”, phản ánh hiệu lực pháp lý của việc đính hôn theo phong tục Do Thái.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “đem nàng ra làm gương” hoặc “phơi bày nàng cho thiên hạ chê cười.”'
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể dịch: “cho nàng đi một cách kín đáo.” Trong bối cảnh này, cụm từ chỉ việc chính thức ly dị trong thời gian đính hôn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνὴρ αὐτῆς
  choice: chồng nàng
  rationale: ἀνήρ trong quan hệ với Ma-ri mang nghĩa “chồng”; dù hai người còn ở giai đoạn đính hôn, sự đính ước của người Do Thái có hiệu lực pháp lý, như động từ ἀπολῦσαι cho thấy.
- source_word: δίκαιος
  choice: người công chính
  rationale: “Công chính” giữ được sắc thái đạo đức và thần học của δίκαιος mà không quyết định rằng từ này chỉ nói về việc giữ luật hay chỉ nói về lòng thương xót.
- source_word: δειγματίσαι
  choice: bêu nhục nàng công khai
  rationale: Cách diễn đạt này truyền đạt ý phơi bày một người ra để chịu nhục; “công khai” làm rõ sự tương phản với λάθρᾳ.
- source_word: ἐβουλήθη
  choice: định
  rationale: “Định” diễn đạt tự nhiên một ý định đã được cân nhắc, phù hợp với βούλομαι trong mạch kể.
- source_word: λάθρᾳ
  choice: âm thầm
  rationale: “Âm thầm” diễn tả cách làm kín đáo, không công khai, mà không tạo sắc thái lén lút quá mức.
- source_word: ἀπολῦσαι
  choice: ly dị nàng
  rationale: Trong bối cảnh đính hôn có tính ràng buộc pháp lý, ἀπολύω chỉ việc chính thức chấm dứt quan hệ; “ly dị” truyền đạt rõ hơn “đuổi đi” hay “cho đi” đối với độc giả hiện đại.
- source_word: δὲ
  choice: không dịch thành một liên từ riêng
  rationale: δέ là từ nối nhẹ để tiếp tục câu chuyện; trong tiếng Việt, quan hệ nối tiếp đã rõ từ ngữ cảnh, nên lược bỏ giúp câu tự nhiên mà không mất nội dung.
- source_word: ὢν καὶ μὴ θέλων
  choice: là ... và không muốn
  rationale: Cấu trúc này giữ hai đặc điểm làm nền cho quyết định của Giô-sép, đồng thời phù hợp cú pháp tiếng Việt hiện đại.
theological_decisions:
- issue: Ý nghĩa của việc Giô-sép là δίκαιος
  choice: Dịch là “người công chính” và đặt cạnh việc ông không muốn bêu nhục Ma-ri.
  alternative: Diễn giải là người nghiêm giữ luật hoặc là người giàu lòng thương xót.
  rationale: Bản Hy Lạp đặt sự công chính và sự không muốn làm nhục Ma-ri trong cùng một lập luận nhưng không giải thích chính xác mối quan hệ giữa chúng; bản dịch giữ nguyên sức căng này.
- issue: Địa vị pháp lý của Giô-sép và Ma-ri
  choice: Dùng “chồng” và “ly dị” trong chính văn.
  alternative: Dùng “người đã đính hôn” và “hủy hôn”, hoặc dịch sát chữ là “người đàn ông của nàng” và “cho nàng đi”.
  rationale: Cách nói Hy Lạp cùng bối cảnh đính hôn Do Thái cho thấy đây là quan hệ có tính ràng buộc pháp lý và phải được chấm dứt chính thức; chú thích vẫn bảo lưu cách diễn đạt theo giai đoạn quan hệ và nghĩa sát chữ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “nàng” phù hợp lối kể trang nhã; “bêu nhục công khai” và “âm thầm ly dị” tạo sự tương phản rõ ràng như trong nguyên văn.
