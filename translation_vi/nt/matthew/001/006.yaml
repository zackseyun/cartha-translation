id: MAT.1.6
reference: Matthew 1:6
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἰεσσαὶ δὲ ἐγέννησεν τὸν Δαυὶδ τὸν βασιλέα. Δαυὶδ ⸀δὲ ἐγέννησεν τὸν Σολομῶνα ἐκ τῆς τοῦ Οὐρίου,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/006.yaml
  text: Jesse fathered David the king[a]. David fathered Solomon by the wife of Uriah,
translation:
  language: vi
  text: Giê-sê sinh Đa-vít, là vua. Đa-vít sinh Sa-lô-môn bởi vợ U-ri[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tiếng Hy Lạp theo sát chữ là “từ [người nữ] của U-ri”, một lối nói tỉnh lược, trong đó “người nữ/vợ” được hiểu ngầm; nghĩa là “bởi vợ U-ri”. Ma-thi-ơ không nêu tên Bát-sê-ba tại đây.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγέννησεν
  choice: sinh
  rationale: Trong gia phả, γεννάω chỉ việc người nam sinh thành hoặc làm cha trong dòng dõi. “Sinh” là cách diễn đạt ngắn gọn, quen thuộc trong gia phả tiếng Việt và giữ được công thức lặp của nguyên văn.
- source_word: βασιλέα
  choice: là vua
  rationale: Cụm có mạo từ xác định, τὸν Δαυὶδ τὸν βασιλέα, nhấn mạnh địa vị của Đa-vít với tư cách là vua. “Đa-vít là vua” truyền đạt rõ sự xác định này mà không biến tước hiệu thành một phần của tên riêng.
- source_word: ἐκ τῆς τοῦ Οὐρίου
  choice: với vợ của U-ri
  rationale: Nguyên văn là một lối nói tỉnh lược, theo sát chữ là “từ [người nữ] của U-ri”, trong đó danh từ “vợ/người nữ” được ngầm hiểu. Cách dịch này tự nhiên trong tiếng Việt, nêu đúng vai trò người mẹ và vẫn giữ việc Ma-thi-ơ gọi bà theo quan hệ với U-ri thay vì nêu tên Bát-sê-ba.
- source_word: Ἰεσσαὶ
  choice: Giê-sê
  rationale: Dạng tên riêng quen dùng trong tiếng Việt cho Ἰεσσαί.
- source_word: Δαυὶδ
  choice: Đa-vít
  rationale: Dạng tên riêng quen dùng trong tiếng Việt cho Δαυίδ.
- source_word: Σολομῶνα
  choice: Sa-lô-môn
  rationale: Dạng tên riêng quen dùng trong tiếng Việt cho Σολομών.
- source_word: Οὐρίου
  choice: U-ri
  rationale: Dạng tên riêng quen dùng trong tiếng Việt cho Οὐρίας.
- source_word: δέ
  choice: không dịch thành từ riêng
  rationale: δέ là từ nối nhẹ giữa các mắt xích của gia phả. Việc tách thành hai câu đã thể hiện sự chuyển tiếp, nên thêm “và” hoặc “còn” sẽ làm câu nặng hơn mà không bổ sung ý nghĩa cần thiết.
theological_decisions:
- issue: Cách Ma-thi-ơ gián tiếp nhắc đến Bát-sê-ba
  choice: Giữ cách gọi “vợ của U-ri”, không bổ sung tên Bát-sê-ba.
  alternative: “Bát-sê-ba” hoặc “người trước kia là vợ U-ri”
  rationale: Nguyên văn cố ý xác định người nữ qua U-ri. Cách gọi này duy trì âm hưởng văn chương và đạo đức gắn với câu chuyện trong 2 Sa-mu-ên, đồng thời không giải quyết thay cho độc giả câu hỏi về sắc thái thời gian của mối quan hệ bằng cách thêm “trước kia” vốn không có trong câu Hy Lạp.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Công thức “X sinh Y” được giữ để phù hợp thể loại gia phả; “với vợ của U-ri” làm rõ thành ngữ tỉnh lược của tiếng Hy Lạp mà không xóa cách quy chiếu gián tiếp có chủ ý. Dấu phẩy cuối câu được giữ vì câu này tiếp tục sang câu kế tiếp trong gia phả.
