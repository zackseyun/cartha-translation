source:
  edition: SBLGNT
  text: Σαλμὼν δὲ ἐγέννησεν τὸν ⸂Βόες ἐκ τῆς Ῥαχάβ, Βόες⸃ δὲ ἐγέννησεν τὸν ⸂Ἰωβὴδ ἐκ τῆς Ῥούθ, Ἰωβὴδ⸃ δὲ ἐγέννησεν τὸν Ἰεσσαί,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/005.yaml
  text: Salmon fathered Boaz by Rahab[a], and Boaz fathered Obed by Ruth, and Obed fathered Jesse,
translation:
  language: vi
  text: San-môn sinh Bô-ô bởi Ra-háp[a], Bô-ô sinh Ô-bết bởi Ru-tơ, và Ô-bết sinh Gie-sê,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “từ Ra-háp” và “từ Ru-tơ.” Tiếng Hy Lạp dùng ἐκ với tên của mỗi người mẹ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγέννησεν
  choice: sinh
  rationale: Trong văn cảnh gia phả với chủ ngữ là người nam, “sinh” diễn đạt tự nhiên quan hệ làm cha và sự nối tiếp dòng dõi, đồng thời tránh sắc thái cổ của “sinh ra” theo nghĩa đen quá máy móc.
- source_word: ἐκ
  choice: với
  rationale: Khi đi với tên người mẹ trong công thức gia phả, ἐκ chỉ nguồn gốc về phía mẹ. “Sinh ... với Ra-háp/Ru-tơ” là cách nói tiếng Việt tự nhiên, nêu rõ người mẹ mà không khiến người đọc hiểu người cha trực tiếp sinh con.
- source_word: δὲ
  choice: '[dấu phẩy] / và'
  rationale: δέ ở đây là từ nối nhẹ trong chuỗi gia phả, không mang ý tương phản. Dấu phẩy giữa hai mệnh đề đầu và “và” trước mệnh đề cuối tạo nhịp liệt kê tự nhiên trong tiếng Việt.
- source_word: Σαλμὼν
  choice: San-môn
  rationale: Phiên âm tên riêng theo lối quen thuộc trong Kinh Thánh tiếng Việt, gần với dạng Hy Lạp và dễ đọc.
- source_word: Βόες
  choice: Bô-ô
  rationale: Dùng dạng tên quen thuộc của nhân vật Cựu Ước để duy trì sự nhận diện xuyên suốt Kinh Thánh.
- source_word: Ῥαχάβ
  choice: Ra-háp
  rationale: Dạng phiên âm tiếng Việt thông dụng của tên riêng này.
- source_word: Ἰωβὴδ
  choice: Ô-bết
  rationale: Dùng dạng tên quen thuộc của nhân vật Cựu Ước, thay vì phiên âm máy móc hình thức Hy Lạp.
- source_word: Ῥούθ
  choice: Ru-tơ
  rationale: Dạng tên quen thuộc trong Kinh Thánh tiếng Việt, gắn với nhân vật và sách Ru-tơ.
- source_word: Ἰεσσαί
  choice: Gie-sê
  rationale: Dạng tên truyền thống, dễ nhận biết trong Kinh Thánh tiếng Việt.
theological_decisions:
- issue: Công thức gia phả và việc nêu tên các bà mẹ
  choice: Giữ rõ tên Ra-háp và Ru-tơ bằng cấu trúc “sinh ... với ...”, đồng thời duy trì dòng gia phả theo người cha bằng động từ “sinh”.
  alternative: Dịch “là cha của” mà không thể hiện trực tiếp quan hệ về phía mẹ, hoặc dịch sát hình thức là “sinh ... từ Ra-háp/Ru-tơ”.
  rationale: Bản Hy Lạp đặc biệt nêu tên hai người mẹ bằng ἐκ + sở hữu cách. Bản dịch cần giữ nét nổi bật này nhưng không nên áp đặt thêm cách giải thích thần học về ý nghĩa của việc họ được nêu tên.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cấu trúc lặp giữ nhịp gia phả; dấu phẩy cuối câu được giữ vì câu gia phả còn tiếp tục ở câu kế tiếp. Mọi tên riêng dùng dạng quen thuộc trong Kinh Thánh tiếng Việt.
