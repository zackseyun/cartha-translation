source:
  edition: SBLGNT
  text: ⸀ἐγερθεὶς δὲ ὁ Ἰωσὴφ ἀπὸ τοῦ ὕπνου ἐποίησεν ὡς προσέταξεν αὐτῷ ὁ ἄγγελος κυρίου καὶ παρέλαβεν τὴν γυναῖκα αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/024.yaml
  text: Then Joseph[a], having awakened from sleep, did as the angel of the Lord commanded him and took his wife.
translation:
  language: vi
  text: Khi tỉnh giấc, Giô-sép làm theo điều thiên sứ của Chúa đã truyền cho ông và đón vợ mình về[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “tiếp nhận vợ mình” hoặc “đem vợ mình về với mình.” Động từ Hy Lạp có thể chỉ việc tiếp nhận một người về với mình, có thể hàm ý vào nhà hay gia đình mình.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγερθεὶς δὲ ... ἀπὸ τοῦ ὕπνου
  choice: Khi tỉnh giấc
  rationale: Diễn đạt tự nhiên trong tiếng Việt trình tự của phân từ aorist và thành ngữ chỉ việc thức dậy; δέ có chức năng chuyển tiếp trong mạch kể nên không cần dịch thành một từ riêng.
- source_word: ἐποίησεν ὡς
  choice: làm theo lời
  rationale: Chuyển tải sự làm đúng theo mệnh lệnh, đồng thời tạo cấu trúc tiếng Việt tự nhiên với động từ 'truyền' ở sau.
- source_word: προσέταξεν
  choice: truyền
  rationale: Thể hiện chỉ thị có thẩm quyền; trong cụm 'lời ... truyền', cách dùng này trang trọng, rõ ràng và tự nhiên hơn 'ra lệnh' trong văn cảnh.
- source_word: ὁ ἄγγελος κυρίου
  choice: thiên sứ của Chúa
  rationale: '''Thiên sứ'' là cách gọi trang trọng, dễ hiểu dành cho ἄγγελος; ''của Chúa'' giữ quan hệ sở hữu của κυρίου mà không xác định quá mức.'
- source_word: παρέλαβεν
  choice: đón ... về
  rationale: Trong văn cảnh hôn nhân, cụm này tự nhiên hơn 'nhận/lấy' đơn độc và có thể hàm ý tiếp nhận người vợ về với mình; chú thích bảo tồn các sắc thái từ vựng khác.
- source_word: τὴν γυναῖκα αὐτοῦ
  choice: vợ mình
  rationale: γυνή mang nghĩa 'vợ' trong khung pháp lý-hôn nhân của phân đoạn; đại từ phản thân 'mình' quy chiếu tự nhiên về Giô-sép trong tiếng Việt.
theological_decisions:
- issue: Cách dịch γυνή trước khi hôn nhân được consummated
  choice: vợ mình
  alternative: người phụ nữ của ông
  rationale: Mạch văn xem Ma-ri trong quan hệ hôn nhân hợp pháp với Giô-sép, dù câu kế tiếp nói họ chưa quan hệ vợ chồng. 'Vợ' phản ánh địa vị ấy mà không hàm ý việc chung chăn gối.
- issue: Cách dịch κύριος trong ἄγγελος κυρίου
  choice: thiên sứ của Chúa
  alternative: thiên sứ của Đức Giê-hô-va
  rationale: Bản Hy Lạp dùng κύριος chứ không ghi trực tiếp danh riêng YHWH; 'Chúa' bảo tồn cách gọi của nguồn Hy Lạp và tránh xác định điều văn bản không nói rõ.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Câu được sắp xếp theo lối kể tự nhiên; 'Giô-sép' theo dạng phiên âm Kinh Thánh quen thuộc. Dấu chú thích đặt ngay sau cụm từ cần giải thích.
