  rationale: Sửa cấu trúc chỉ mệnh lệnh để phản ánh minh bạch προσέταξεν αὐτῷ (“đã truyền cho ông”) và dùng tiếng Việt tự nhiên hơn. Giữ “đón vợ mình về” vì cách diễn đạt này phù hợp ngữ cảnh hôn nhân và sắc thái tiếp nhận của παρέλαβεν; chú thích bảo lưu các cách dịch sát hơn mà không biến hàm ý văn hóa thành một khẳng định quá mức trong câu chính.
