id: MAT.1.7
reference: Matthew 1:7
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Σολομὼν δὲ ἐγέννησεν τὸν Ῥοβοάμ, Ῥοβοὰμ δὲ ἐγέννησεν τὸν Ἀβιά, Ἀβιὰ δὲ ἐγέννησεν τὸν ⸂Ἀσάφ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/007.yaml
  text: Solomon fathered Rehoboam[a], Rehoboam fathered Abijah, and Abijah fathered Asaph.
translation:
  language: vi
  text: Sa-lô-môn sinh Rô-bô-am; Rô-bô-am sinh A-bi-gia; và A-bi-gia sinh A-sáp.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Một số thủ bản chép “A-sa”, phù hợp với tên vua Giu-đa trong 1 Các Vua 15 và 2 Sử Ký 14–16; bản Hy Lạp dùng ở đây chép “A-sáp”.
    reason: textual_variant
lexical_decisions:
- source_word: ἐγέννησεν
  choice: sinh
  rationale: Trong gia phả theo dòng cha, động từ này nói đến việc một người nam sinh ra hoặc trở thành tổ phụ của người kế tiếp. “Sinh” là cách diễn đạt ngắn gọn, tự nhiên và quen thuộc trong các gia phả tiếng Việt, đồng thời không buộc câu văn phải xác định khoảng cách thế hệ chặt hơn nguyên văn.
- source_word: δὲ
  choice: ; / và
  rationale: Ở đây δέ là từ nối nhẹ, tiếp tục chuỗi gia phả chứ không mang ý đối lập. Dấu chấm phẩy cùng với “và” ở vế cuối diễn đạt mạch nối tự nhiên trong tiếng Việt.
- source_word: Σολομών
  choice: Sa-lô-môn
  rationale: Dùng dạng tên riêng quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
- source_word: Ῥοβοάμ
  choice: Rô-bô-am
  rationale: Dùng dạng phiên âm tiếng Việt dễ đọc và quen thuộc.
- source_word: Ἀβιά
  choice: A-bi-gia
  rationale: Dùng dạng tên tương ứng với vua Giu-đa trong Cựu Ước, giúp duy trì sự liên hệ giữa các sách.
- source_word: Ἀσάφ
  choice: A-sáp
  rationale: Bản Hy Lạp SBLGNT được cung cấp đọc là Ἀσάφ, nên bản văn chính giữ “A-sáp” thay vì âm thầm sửa thành “A-sa”.
theological_decisions:
- issue: Có nên hài hòa tên Ἀσάφ trong gia phả Ma-thi-ơ với vua A-sa trong Cựu Ước hay không
  choice: Giữ “A-sáp” trong bản văn chính
  alternative: Dịch là “A-sa” theo một số thủ bản và theo danh sách các vua Giu-đa trong 1 Các Vua 15 và 2 Sử Ký 14–16
  rationale: Ưu tiên chứng cứ nguyên ngữ được cung cấp đòi hỏi giữ cách đọc Ἀσάφ. Cách đọc “A-sa” được nêu trong chú thích để bảo tồn dị bản và tránh âm thầm hài hòa hóa.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Các tên riêng được phiên âm theo dạng quen thuộc trong tiếng Việt; cấu trúc lặp của gia phả được giữ, nhưng dùng dấu câu tự nhiên để câu không nặng nề.
