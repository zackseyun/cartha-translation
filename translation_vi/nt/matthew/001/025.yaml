source:
  edition: SBLGNT
  text: καὶ οὐκ ἐγίνωσκεν αὐτὴν ἕως οὗ ἔτεκεν ⸀υἱόν· καὶ ἐκάλεσεν τὸ ὄνομα αὐτοῦ Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/025.yaml
  text: And he did not know her until she gave birth to a son[c][b][a], and he called his name Jesus.
translation:
  language: vi
  text: Ông không quan hệ vợ chồng với bà[a] cho đến khi bà sinh một con trai[b], và ông đặt tên cho con là Giê-su.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “không biết bà”; động từ “biết” được dùng như một cách nói giảm để chỉ quan hệ tình dục.'
    reason: lexical_alternative
  - marker: b
    text: “Cho đến khi” nói rõ điều đúng cho tới lúc Chúa Giê-su ra đời; tự cụm từ này không xác định điều gì xảy ra sau đó.
    reason: alternative_reading
  - marker: c
    text: 'Dịch sát: “ông gọi tên con là Giê-su.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγίνωσκεν
  choice: không quan hệ vợ chồng với bà
  rationale: Trong ngữ cảnh này, γινώσκω (“biết”) là cách nói giảm chỉ quan hệ tình dục. Cách dịch này truyền đạt đúng nghĩa bằng tiếng Việt hiện đại, rõ ràng và trang trọng; dịch sát là “không biết bà” dễ bị hiểu theo nghĩa thông thường.
- source_word: ἕως οὗ
  choice: cho đến khi
  rationale: Đây là cách diễn đạt thời gian tự nhiên, đánh dấu điều đúng cho tới lúc Chúa Giê-su chào đời mà tự nó không xác định điều xảy ra sau đó.
- source_word: ἔτεκεν
  choice: sinh
  rationale: Cách diễn đạt ngắn gọn, tự nhiên trong tiếng Việt hiện đại cho hành động sinh con.
- source_word: υἱόν
  choice: một con trai
  rationale: Danh từ không có mạo từ được diễn đạt tự nhiên với “một”; cách này không thêm sự nhấn mạnh không có trong bản Hy Lạp.
- source_word: ἐκάλεσεν τὸ ὄνομα αὐτοῦ Ἰησοῦν
  choice: ông đặt tên cho con là Giê-su
  rationale: Đây là cách nói tự nhiên trong tiếng Việt, truyền đạt thành ngữ Hy Lạp mang cấu trúc Sê-mít “gọi tên của người là…”.
- source_word: Ἰησοῦν
  choice: Giê-su
  rationale: Dùng dạng tên gọi quen thuộc và tiêu chuẩn trong Tân Ước tiếng Việt.
theological_decisions:
- issue: Hàm ý của “cho đến khi” đối với đời sống hôn nhân của Ma-ri sau khi Chúa Giê-su ra đời
  choice: Dịch ἕως οὗ là “cho đến khi” mà không khẳng định quan hệ vợ chồng có hay không xảy ra về sau.
  alternative: Có người suy ra rằng quan hệ vợ chồng bình thường bắt đầu sau đó; người khác cho rằng cụm từ này không hàm ý bất cứ thay đổi nào sau thời điểm được nói đến.
  rationale: Cụm từ Hy Lạp xác định giới hạn thời gian của điều được trình bày trước khi Chúa Giê-su ra đời, nhưng tự nó không giải quyết câu hỏi về thời gian sau đó. Bản dịch và chú thích giữ nguyên sự căng thẳng thần học, không áp đặt kết luận hệ phái.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “ông” và “bà” phù hợp để nói về Giô-sép và Ma-ri trong ngữ cảnh kể chuyện. “Quan hệ vợ chồng” diễn đạt rõ lối nói giảm của nguyên văn mà không thô tục; “đặt tên cho con” là cách nói tự nhiên hơn trong tiếng Việt.
