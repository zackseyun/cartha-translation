id: MAT.1.10
reference: Matthew 1:10
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἑζεκίας δὲ ἐγέννησεν τὸν Μανασσῆ, Μανασσῆς δὲ ἐγέννησεν τὸν ⸂Ἀμώς, Ἀμὼς⸃ δὲ ἐγέννησεν τὸν Ἰωσίαν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/010.yaml
  text: Hezekiah fathered Manasseh[a], Manasseh fathered Amos, and Amos fathered Josiah.
translation:
  language: vi
  text: Ê-xê-chia sinh Ma-na-se, Ma-na-se sinh A-mốt[a], và A-mốt sinh Giô-si-a.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Một số bản dịch ghi “A-môn” thay cho “A-mốt” để hài hòa tên này với vua Giu-đa trong 2 Các Vua 21; bản Hy Lạp của Ma-thi-ơ ghi “A-mốt”.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐγέννησεν
  choice: sinh
  rationale: Trong gia phả theo dòng cha, động từ này chỉ việc làm cha hoặc sinh ra một hậu duệ. “Sinh” ngắn gọn, tự nhiên trong cách diễn đạt gia phả tiếng Việt và không cổ kính như “sanh” hay “sinh hạ”.
- source_word: Ἑζεκίας
  choice: Ê-xê-chia
  rationale: Dùng dạng tên riêng đã quen thuộc trong truyền thống Kinh Thánh tiếng Việt, tương ứng với vua Giu-đa Hezekiah.
- source_word: Μανασσῆς
  choice: Ma-na-se
  rationale: Dùng dạng tên riêng quen thuộc trong Kinh Thánh tiếng Việt.
- source_word: Ἀμώς
  choice: A-mốt
  rationale: Phiên âm trực tiếp dạng Ἀμώς của bản văn Hy Lạp SBLGNT. Không âm thầm đổi thành A-môn để hài hòa với tên vị vua trong Các Vua.
- source_word: Ἰωσίας
  choice: Giô-si-a
  rationale: Dùng dạng tên riêng quen thuộc trong Kinh Thánh tiếng Việt.
- source_word: δέ
  choice: và / dấu phẩy
  rationale: Trong chuỗi gia phả, δέ là từ nối đơn giản giúp tiếp tục danh sách. Hai lần đầu được thể hiện bằng dấu phẩy, lần cuối bằng “và”, tạo câu tiếng Việt trôi chảy mà vẫn giữ quan hệ nối tiếp.
theological_decisions:
- issue: Sự khác biệt giữa tên trong bản Hy Lạp của Ma-thi-ơ và tên vị vua trong Cựu Ước
  choice: Giữ “A-mốt” theo Ἀμώς trong câu chính
  alternative: Dùng “A-môn” để hài hòa với vị vua Giu-đa trong 2 Các Vua 21
  rationale: Ưu tiên chứng cứ nguyên ngữ và không tự ý giải quyết sự căng thẳng về tên gọi. Chú thích cho độc giả biết dạng tên quen thuộc trong câu chuyện các vua.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cấu trúc lặp “X sinh Y” phù hợp thể loại gia phả. Các tên riêng dùng dạng quen thuộc trong Kinh Thánh tiếng Việt; riêng A-mốt theo sát dạng Hy Lạp và được giải thích bằng chú thích.
