id: MAT.1.15
reference: Matthew 1:15
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἐλιοὺδ δὲ ἐγέννησεν τὸν Ἐλεάζαρ, Ἐλεάζαρ δὲ ἐγέννησεν τὸν Ματθάν, Ματθὰν δὲ ἐγέννησεν τὸν Ἰακώβ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/015.yaml
  text: Eliud fathered Eleazar, and Eleazar fathered Matthan, and Matthan fathered Jacob.
translation:
  language: vi
  text: Ê-li-út sinh Ê-lê-a-sa; Ê-lê-a-sa sinh Ma-than; Ma-than sinh Gia-cốp.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐλιοὺδ
  choice: Ê-li-út
  rationale: Phiên âm tên riêng Hy Lạp sang dạng dễ đọc theo âm tiếng Việt, không dịch nghĩa tên.
- source_word: δὲ
  choice: dấu chấm phẩy
  rationale: Trong chuỗi gia phả, δέ là từ nối nhẹ, chuyển sang mắt xích kế tiếp. Dấu chấm phẩy thể hiện tự nhiên quan hệ nối tiếp trong tiếng Việt mà không nhấn mạnh quá mức bằng một liên từ lặp lại.
- source_word: ἐγέννησεν
  choice: sinh
  rationale: Trong văn cảnh gia phả, động từ chỉ việc sinh ra hoặc trở thành tổ phụ của người kế tiếp. “Sinh” ngắn gọn, tự nhiên và giữ được cách diễn đạt cô đọng của nguyên văn; không thêm “làm cha của,” vốn dài hơn và có thể thu hẹp sắc thái gia phả.
- source_word: τὸν
  choice: không dịch riêng
  rationale: Mạo từ Hy Lạp đánh dấu bổ ngữ trực tiếp trước tên riêng; tiếng Việt không cần mạo từ trong cấu trúc này.
- source_word: Ἐλεάζαρ
  choice: Ê-lê-a-sa
  rationale: Phiên âm tên riêng theo cách đọc rõ ràng, quen thuộc trong tiếng Việt.
- source_word: Ματθάν
  choice: Ma-than
  rationale: Phiên âm tên riêng Hy Lạp, phân biệt với Ma-thi-ơ và giữ gần âm nguồn.
- source_word: Ἰακώβ
  choice: Gia-cốp
  rationale: Dùng dạng tên Kinh Thánh đã quen thuộc trong tiếng Việt cho Ἰακώβ.
theological_decisions:
- issue: Phạm vi huyết thống của ἐγέννησεν trong gia phả
  choice: Giữ cách nói “sinh” cô đọng
  alternative: “làm cha của” hoặc “sinh ra”
  rationale: Nguyên văn khẳng định quan hệ gia phả nhưng tự nó không buộc phải xác định rằng mọi mắt xích đều là cha-con trực tiếp. Cách dịch không thêm lời giải thích nhằm bảo toàn độ mở ấy.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Dùng dấu chấm phẩy để tái hiện nhịp ba vế song song của câu Hy Lạp; tên riêng được phiên âm có gạch nối theo thông lệ tiếng Việt.
source_grounding:
  english_pob_role: consult_only
