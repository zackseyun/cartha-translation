  source_fidelity: Bản dịch giữ đúng ba mệnh đề gia phả song song của Hy Lạp (Ἐλιοὺδ... Ἐλεάζαρ... Ματθάν... Ἰακώβ), với ἐγέννησεν được chuyển nhất quán là “sinh”. Cấu trúc lược liên từ ở các vế sau và dấu chấm phẩy truyền đạt phù hợp tính liên tiếp nhẹ của δέ trong văn cảnh gia phả.
  naturalness: “Ê-li-út sinh Ê-lê-a-sa; Ê-lê-a-sa sinh Ma-than; Ma-than sinh Gia-cốp” ngắn gọn, trang trọng, rõ ràng và tự nhiên trong văn phong Kinh Thánh tiếng Việt hiện đại. Dấu chấm phẩy tạo nhịp liệt kê dễ đọc.
