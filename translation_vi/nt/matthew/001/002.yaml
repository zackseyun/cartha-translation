id: MAT.1.2
reference: Matthew 1:2
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἀβραὰμ ἐγέννησεν τὸν Ἰσαάκ, Ἰσαὰκ δὲ ἐγέννησεν τὸν Ἰακώβ, Ἰακὼβ δὲ ἐγέννησεν τὸν Ἰούδαν καὶ τοὺς ἀδελφοὺς αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/002.yaml
  text: Abraham fathered Isaac[a], and Isaac fathered Jacob, and Jacob fathered Judah and his brothers,
translation:
  language: vi
  text: Áp-ra-ham sinh Y-sác[a]; Y-sác sinh Gia-cốp; Gia-cốp sinh Giu-đa và các anh em trai của Giu-đa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “làm cha của.” Động từ Hy Lạp trong gia phả có thể chỉ việc làm cha hoặc quan hệ tổ tiên theo dòng nam.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγέννησεν
  choice: sinh
  rationale: Trong gia phả, động từ này nói đến quan hệ cha–con hoặc tổ tiên–hậu duệ theo dòng nam. “Sinh” là cách diễn đạt ngắn gọn, tự nhiên và quen thuộc trong gia phả tiếng Việt, đồng thời không nhất thiết khẳng định mọi thế hệ đều được liệt kê đầy đủ.
- source_word: δὲ
  choice: dấu chấm phẩy và lối nối tiếp
  rationale: Ở đây δέ là từ nối nhẹ trong chuỗi gia phả, không biểu thị sự tương phản mạnh. Tiếng Việt tự nhiên có thể thể hiện tiến trình này bằng cách đặt các vế nối tiếp nhau, không cần dịch thành một từ riêng.
- source_word: Ἰούδαν
  choice: Giu-đa
  rationale: Đây là tộc trưởng Giu-đa, con của Gia-cốp; cách phiên âm này phân biệt phù hợp với nhân vật Giu-đa Ích-ca-ri-ốt trong Tân Ước theo ngữ cảnh tiếng Việt.
- source_word: ἀδελφοὺς αὐτοῦ
  choice: các anh em trai của Giu-đa
  rationale: Danh từ Hy Lạp ở đây chỉ những người nam, tức các con trai khác của Gia-cốp. Lặp lại tên Giu-đa giúp tránh sự mơ hồ mà đại từ “ông” có thể gây ra trong tiếng Việt.
- source_word: Ἀβραάμ / Ἰσαάκ / Ἰακώβ
  choice: Áp-ra-ham / Y-sác / Gia-cốp
  rationale: Dùng các dạng tên riêng quen thuộc trong truyền thống Kinh Thánh tiếng Việt, dễ nhận biết đối với độc giả hiện đại.
theological_decisions:
- issue: Cách dịch động từ trong gia phả
  choice: Dùng “sinh” nhất quán
  alternative: “sinh ra”, “làm cha của” hoặc “trở thành cha của”
  rationale: “Sinh” giữ được trọng tâm phả hệ theo dòng cha của nguyên văn mà không tự ý quyết định quan hệ này luôn là cha–con trực tiếp hay đôi khi có thể bao quát quan hệ tổ tiên–hậu duệ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “sinh” theo lối diễn đạt gia phả quen thuộc; dùng dấu chấm phẩy để làm rõ từng mắt xích trong chuỗi. Cụm “anh em trai” thể hiện chính xác giống đực số nhiều của nguyên văn.
