revisions:
- from: Nàng sẽ sinh một con trai, và anh hãy đặt tên con trẻ là Giê-su,[a] vì chính con trẻ ấy sẽ cứu dân mình khỏi những tội lỗi của họ.
  to: Bà ấy sẽ sinh một con trai, và ông sẽ đặt tên con là Giê-su,[a] vì chính người ấy sẽ cứu dân mình khỏi tội lỗi của họ.
  rationale: Sửa xưng hô và cấu trúc đặt tên để tiếng Việt hiện đại tự nhiên, nhất quán về cấp độ trang trọng, đồng thời bảo toàn lực chỉ định của nguyên ngữ. Thay “con trẻ ấy” bằng “người ấy” để giữ αὐτός nhấn mạnh mà không thêm hay làm lệch nghĩa. Chú thích được chỉnh cho chính xác hơn về quan hệ giữa Ἰησοῦς, Yehoshua/Yeshua và Giô-suê.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T02:43:04Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản nháp truyền đạt đúng các thành tố chính: lời báo sinh, mệnh lệnh/công thức đặt tên, tên Giê-su, quan hệ “dân mình”, và sự giải cứu khỏi tội lỗi. Tuy vậy, “anh hãy” vừa hạ giọng quá hội thoại vừa biến thì tương lai có sắc thái mệnh lệnh thành lời khuyên nhẹ. “con trẻ ấy” làm chủ thể tương lai nghe quá trẻ con và kém tự nhiên. Bản sửa giữ sự nhấn mạnh của αὐτός bằng “chính người ấy” mà không diễn giải thần học thêm.'
  naturalness: “Nàng” đi với “anh” tạo sự lệch cấp độ xưng hô trong cùng một câu. “Bà ấy ... ông sẽ” là lối xưng hô hiện đại, lịch sự và mạch lạc hơn trong lời thiên sứ nói với Giô-sép. “Đặt tên con là” là công thức đặt tên tự nhiên trong tiếng Việt hiện đại.
  terminology: 'Giữ “Giê-su” theo quy ước của bản nháp và “cứu dân mình khỏi tội lỗi của họ” sát với σώσει τὸν λαὸν αὐτοῦ ἀπὸ τῶν ἁμαρτιῶν αὐτῶν. Chú thích cần điều chỉnh: Ἰησοῦς có thể tương ứng với cả Yehoshua và dạng rút gọn Yeshua; đồng thời tránh đồng nhất Yeshua với Giô-suê một cách không chính xác tuyệt đối.'
  issues:
  - severity: medium
    issue: Xưng hô “Nàng ... anh” không nhất quán về văn phong
    rationale: “Nàng” là văn chương/trang trọng, còn “anh” là thân mật, hội thoại hiện đại; sự ghép này gây chênh giọng trong lời báo truyền trang trọng.
  - severity: medium
    issue: “anh hãy đặt tên” làm yếu sắc thái của καλέσεις
    rationale: Hình thức tương lai trong công thức đặt tên mang lực chỉ định chắc chắn; “ông sẽ đặt tên” giữ được sắc thái này tự nhiên hơn.
  - severity: low
    issue: “chính con trẻ ấy” kém tự nhiên
    rationale: αὐτός chỉ chủ thể nam là đứa con được nói đến, không nhấn tuổi thơ; “chính người ấy” giữ nhấn mạnh mà tránh cách gọi không phù hợp với hành động cứu trong tương lai.
  - severity: medium
    issue: Chú thích từ nguyên đồng nhất Yeshua với Giô-suê quá đơn giản
    rationale: Tên Hy Lạp Ἰησοῦς có thể biểu thị Yehoshua hoặc dạng rút gọn Yeshua. Cần nêu quan hệ từ nguyên mà không coi hai dạng Hê-bơ-rơ/A-ram là hoàn toàn đồng nhất.
  revised_text: Bà ấy sẽ sinh một con trai, và ông sẽ đặt tên con là Giê-su,[a] vì chính người ấy sẽ cứu dân mình khỏi tội lỗi của họ.
