id: MAT.1.21
reference: Matthew 1:21
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: τέξεται δὲ υἱὸν καὶ καλέσεις τὸ ὄνομα αὐτοῦ Ἰησοῦν, αὐτὸς γὰρ σώσει τὸν λαὸν αὐτοῦ ἀπὸ τῶν ἁμαρτιῶν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/021.yaml
  text: She will bear a son[a], and you shall call his name Jesus, for he will save his people from their sins.
translation:
  language: vi
  text: Bà ấy sẽ sinh một con trai, và ông sẽ đặt tên con là Giê-su,[a] vì chính người ấy sẽ cứu dân mình khỏi tội lỗi của họ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tên Giê-su là dạng Hy Lạp của một tên Hê-bơ-rơ/A-ram, thường được viết là Yehoshua hoặc dạng rút gọn Yeshua (liên hệ với tên Giô-suê), mang ý “Đức Giê-hô-va cứu.” Lời giải thích “vì chính người ấy sẽ cứu” của Ma-thi-ơ phản ánh lối chơi chữ này.
    reason: Giải thích mối liên hệ từ nguyên và lối chơi chữ trong tên mà bản dịch tiếng Việt không thể hiện đầy đủ.
lexical_decisions:
- source_word: τέξεται
  choice: sẽ sinh
  rationale: Động từ ở thì tương lai trong ngữ cảnh sinh nở; “sẽ sinh” tự nhiên, rõ nghĩa và giữ nguyên tính tiên báo.
- source_word: δὲ
  choice: và
  rationale: δέ là liên từ chuyển tiếp nhẹ; “và” nối tự nhiên lời tiên báo với mệnh lệnh đặt tên mà không tạo sắc thái đối lập không cần thiết.
- source_word: υἱὸν
  choice: một con trai
  rationale: Danh từ không có mạo từ trong lời báo sinh được diễn đạt tự nhiên bằng “một con trai”.
- source_word: καλέσεις τὸ ὄνομα αὐτοῦ
  choice: anh hãy đặt tên con trẻ là
  rationale: Cấu trúc tương lai mang lực mệnh lệnh trong công thức đặt tên. Cách diễn đạt này tự nhiên trong tiếng Việt hiện đại, đồng thời giữ sự chú ý vào tên được ban.
- source_word: Ἰησοῦν
  choice: Giê-su
  rationale: Dùng dạng tên quen thuộc trong tiếng Việt cho nhân vật Tân Ước; chú thích giải thích mối liên hệ với Yeshua và ý nghĩa cứu giúp.
- source_word: αὐτὸς
  choice: chính con trẻ ấy
  rationale: Giữ sắc thái nhấn mạnh của đại từ αὐτός và làm rõ chủ thể trong tiếng Việt mà không thêm nội dung thần học ngoài câu.
- source_word: σώσει
  choice: sẽ cứu
  rationale: Trong kết cấu “cứu dân mình khỏi những tội lỗi,” nghĩa cứu rỗi là trực tiếp và phù hợp nhất.
- source_word: τὸν λαὸν αὐτοῦ
  choice: dân mình
  rationale: Giữ quan hệ sở hữu và sắc thái cộng đồng/giao ước của λαός, nhưng không tự ý giới hạn là Israel hay mở rộng thành toàn thể nhân loại.
- source_word: ἀπὸ τῶν ἁμαρτιῶν αὐτῶν
  choice: khỏi những tội lỗi của họ
  rationale: “Khỏi” diễn đạt sự tách lìa do ἀπό; “những tội lỗi” giữ số nhiều của nguyên văn, còn “của họ” giữ đại từ sở hữu số nhiều.
theological_decisions:
- issue: Sự nhấn mạnh của αὐτός đối với công việc cứu rỗi của Giê-su
  choice: “chính con trẻ ấy sẽ cứu”
  alternative: “con trẻ ấy sẽ cứu” hoặc “người sẽ cứu”
  rationale: Cách dịch giữ sự nhấn mạnh rằng chính đứa trẻ được đặt tên là tác nhân cứu dân mình, nhưng không giải thích thêm bản chất thần học của sự cứu rỗi.
- issue: Phạm vi của “dân mình”
  choice: Không xác định thêm đối tượng
  alternative: “dân Israel của mình” hoặc “mọi người thuộc về mình”
  rationale: Ngữ cảnh gần mang sắc thái Do Thái và giao ước, nhưng câu này không tự xác định phạm vi rộng hay hẹp hơn; bản dịch giữ nguyên sự mở ngỏ của nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Anh” diễn đạt đại từ ngôi hai số ít hướng đến Giô-sép theo cách tự nhiên hơn “ngươi”; “nàng” giữ giọng kể trang trọng và quy chiếu rõ đến Ma-ri. Dấu chú thích được đặt ngay sau tên Giê-su, là từ mà chú thích giải thích.
