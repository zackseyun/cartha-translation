id: MAT.1.18
reference: Matthew 1:18
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Τοῦ δὲ ⸀Ἰησοῦ χριστοῦ ἡ ⸀γένεσις οὕτως ἦν. ⸀μνηστευθείσης τῆς μητρὸς αὐτοῦ Μαρίας τῷ Ἰωσήφ, πρὶν ἢ συνελθεῖν αὐτοὺς εὑρέθη ἐν γαστρὶ ἔχουσα ἐκ πνεύματος ἁγίου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/018.yaml
  text: 'The birth of Jesus the Messiah happened in this way: when his mother Mary had been betrothed to Joseph[a], before they came together[c][b], she was found to be pregnant from the Holy Spirit.'
translation:
  language: vi
  text: 'Sự ra đời của Đức Giê-su, Đấng Mê-si-a,[a] diễn ra như sau: Khi Ma-ri, mẹ ngài, đã đính hôn với Giô-sép,[b] thì trước khi hai người về chung sống,[c] người ta nhận thấy bà đã mang thai do Đức Thánh Linh.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “Đức Giê-su Ki-tô.” Từ Hy Lạp Χριστός là một tước hiệu, nghĩa là “Đấng Mê-si-a” hay “Đấng được xức dầu.”'
    reason: alternative_reading
  - marker: b
    text: “Đính hôn” ở đây là một cam kết hôn nhân chính thức, được luật pháp công nhận và có tính ràng buộc cao hơn việc đính hôn thông thường ngày nay.
    reason: cultural_note
  - marker: c
    text: Cụm từ “về chung sống” cũng có thể hàm ý rằng hai người chưa sống chung như vợ chồng.
    reason: lexical_alternative
lexical_decisions:
- source_word: γένεσις
  choice: sự ra đời
  rationale: Trong ngữ cảnh này, từ này chỉ việc Đức Giê-su được sinh ra và dẫn vào trình thuật về sự ra đời của ngài; “sự ra đời” tự nhiên hơn “nguồn gốc” trong tiếng Việt.
- source_word: Ἰησοῦ χριστοῦ
  choice: Đức Giê-su, Đấng Mê-si-a
  rationale: Χριστός mang chức năng tước hiệu ở đây. “Đấng Mê-si-a” chuyển tải ý nghĩa của tước hiệu thay vì khiến người đọc dễ hiểu đó chỉ là một phần của tên riêng.
- source_word: οὕτως ἦν
  choice: diễn ra như sau
  rationale: Cụm này giới thiệu cách thức sự việc xảy ra; cách diễn đạt này rõ ràng, tự nhiên và không thêm một trạng từ thời gian không có trong nguyên văn.
- source_word: μνηστευθείσης
  choice: đã đính hôn
  rationale: Đây là sự cam kết hôn nhân chính thức. “Đính hôn” là cách nói tiếng Việt hiện đại phù hợp, còn chú thích giải thích mức độ ràng buộc về pháp lý và xã hội.
- source_word: πρὶν ἢ συνελθεῖν αὐτούς
  choice: trước khi hai người chung sống với nhau
  rationale: Giữ cách nói kín đáo và phần nào rộng nghĩa của nguyên văn, không đưa thẳng quan hệ tình dục vào chính văn; chú thích nêu hàm ý có thể có về việc hoàn tất hôn nhân.
- source_word: εὑρέθη
  choice: người ta nhận thấy
  rationale: Diễn đạt tự nhiên giá trị bị động không nêu tác nhân của tiếng Hy Lạp mà không tạo sắc thái tiêu cực dễ có trong “bị phát hiện”.
- source_word: ἐν γαστρὶ ἔχουσα
  choice: đã mang thai
  rationale: Đây là thành ngữ chỉ tình trạng có thai; “mang thai” là cách nói hiện đại, trực tiếp và trang trọng vừa phải.
- source_word: ἐκ πνεύματος ἁγίου
  choice: bởi Đức Thánh Linh
  rationale: “Bởi” trong câu này diễn đạt nguồn gốc/nguyên nhân từ Đức Thánh Linh. Danh xưng được viết hoa vì ngữ cảnh chỉ Đức Thánh Linh của Đức Chúa Trời.
theological_decisions:
- issue: Cách dịch Χριστός
  choice: Đấng Mê-si-a
  alternative: Ki-tô
  rationale: Trong lời mở đầu trình thuật này, từ Hy Lạp hoạt động như một tước hiệu. Dịch nghĩa bằng “Đấng Mê-si-a” giúp người đọc nhận ra chức vị được nói đến, đồng thời chú thích bảo lưu cách gọi quen thuộc khác.
- issue: Đối tượng được πνεύματος ἁγίου chỉ đến
  choice: Đức Thánh Linh
  alternative: một linh thánh
  rationale: Trong trình thuật thời thơ ấu của Ma-thi-ơ, cụm từ chỉ Đức Thánh Linh, không phải một sức mạnh thiêng liêng bất định. Việc tiếng Hy Lạp không có mạo từ ở đây không đòi hỏi phải hiểu theo nghĩa bất định.
- issue: Mức độ hàm ý của συνελθεῖν
  choice: chung sống với nhau
  alternative: quan hệ vợ chồng
  rationale: Cụm Hy Lạp có thể nói đến việc đôi vợ chồng bắt đầu sống chung và trong ngữ cảnh có thể bao hàm việc hoàn tất hôn nhân. Chính văn giữ lối nói kín đáo để không thu hẹp sự mơ hồ thật của nguyên văn.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng các tên quen thuộc Giê-su, Ma-ri và Giô-sép; dùng “Đức” với các danh xưng thiêng liêng nhưng tránh lối diễn đạt quá cổ. Các chú thích được đặt ngay sau đúng từ hoặc cụm từ mà chúng giải thích.
