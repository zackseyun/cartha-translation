  to: 'Sự ra đời của Đức Giê-su, Đấng Mê-si-a,[a] diễn ra như sau: Khi Ma-ri, mẹ ngài, đã đính hôn với Giô-sép,[b] thì trước khi hai người về chung sống,[c] người ta nhận thấy bà đã mang thai do Đức Thánh Linh.'
  rationale: Bản sửa giữ nguyên nội dung và mức độ kín đáo của nguyên văn, đồng thời làm rõ quan hệ thời gian của phân từ μνηστευθείσης. “Do Đức Thánh Linh” phản ánh tốt hơn nghĩa nguồn gốc của ἐκ πνεύματος ἁγίου. Chú thích vẫn bảo lưu hàm ý hôn nhân/hoàn tất hôn nhân mà không áp đặt một cách hiểu hẹp.
