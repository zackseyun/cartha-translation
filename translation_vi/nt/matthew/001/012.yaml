  source_fidelity: Bản dịch giữ đúng trình tự thời gian của μετά, ý nghĩa gia phả của ἐγέννησεν, và các liên kết giữa các tên. Tuy nhiên, “cuộc lưu đày sang” nhấn vào tình trạng lưu đày hơn là hành động bị cưỡng bức di chuyển mà μετοικεσία biểu thị; “cuộc bị đày sang” phản ánh sát hơn sự đày đi. Tên Σαλαθιήλ cần dùng dạng Việt ngữ Kinh Thánh thông dụng là “Sa-la-thi-ên,” không phải “Sa-anh-ti-ên.”
