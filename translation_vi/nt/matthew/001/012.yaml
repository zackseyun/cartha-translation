id: MAT.1.12
reference: Matthew 1:12
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Μετὰ δὲ τὴν μετοικεσίαν Βαβυλῶνος Ἰεχονίας ἐγέννησεν τὸν Σαλαθιήλ, Σαλαθιὴλ δὲ ἐγέννησεν τὸν Ζοροβαβέλ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/012.yaml
  text: After the deportation to Babylon[a], Jeconiah fathered Shealtiel, and Shealtiel fathered Zerubbabel.
translation:
  language: vi
  text: Sau cuộc bị đày sang Ba-by-lôn[a], Giê-cô-nia sinh Sa-la-thi-ên, và Sa-la-thi-ên sinh Xô-rô-ba-bên.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “cuộc lưu đày tại Ba-by-lôn.” Từ Hy Lạp chỉ việc dân chúng bị cưỡng bức đưa sang Ba-by-lôn để sống lưu đày.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ δὲ
  choice: Sau
  rationale: μετά với đối cách chỉ trình tự thời gian; δέ là từ nối nhẹ, có thể được lồng tự nhiên vào câu tiếng Việt mà không cần dịch riêng.
- source_word: τὴν μετοικεσίαν Βαβυλῶνος
  choice: cuộc lưu đày sang Ba-by-lôn
  rationale: μετοικεσία chỉ việc bị đưa đi và sống nơi lưu đày. “Cuộc lưu đày sang Ba-by-lôn” vừa tự nhiên trong tiếng Việt, vừa giữ được ý về sự di chuyển cưỡng bức đến Ba-by-lôn.
- source_word: Ἰεχονίας
  choice: Giê-cô-nia
  rationale: Dùng dạng phiên âm quen thuộc trong truyền thống Kinh Thánh tiếng Việt, tương ứng với tên Ἰεχονίας.
- source_word: ἐγέννησεν
  choice: sinh
  rationale: Trong gia phả, γεννάω diễn tả quan hệ nối tiếp theo dòng cha. “Sinh” là cách nói gọn, trang trọng và quen thuộc trong gia phả tiếng Việt, nhưng không buộc phải hiểu mọi thế hệ đều liền kề về mặt sinh học.
- source_word: Σαλαθιήλ
  choice: Sa-anh-ti-ên
  rationale: Phiên âm theo dạng tên Hê-bơ-rơ Shealtiel quen dùng trong Kinh Thánh tiếng Việt, thay vì sao chép trực tiếp hình thức Hy Lạp.
- source_word: δὲ
  choice: và
  rationale: Ở mệnh đề thứ hai, δέ nối hai mắt xích liên tiếp trong gia phả; “và” là từ nối tự nhiên nhất.
- source_word: Ζοροβαβέλ
  choice: Xô-rô-ba-bên
  rationale: Dùng dạng phiên âm quen thuộc trong Kinh Thánh tiếng Việt cho Zerubbabel, tương ứng với Ζοροβαβέλ.
theological_decisions:
- issue: Cách dịch γεννάω trong gia phả
  choice: Dùng “sinh” để diễn tả sự kế tục theo dòng cha mà không khẳng định rằng quan hệ sinh học nhất thiết phải trực tiếp qua từng thế hệ.
  alternative: “là cha của”; “sinh ra”
  rationale: Công thức gia phả có thể dùng ngôn ngữ tổ tiên–hậu duệ và đôi khi lược bỏ thế hệ. “Sinh” giữ được công thức súc tích của nguyên văn mà không giải quyết quá mức phạm vi quan hệ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu; giữ nhịp lặp của công thức gia phả. Các tên riêng dùng dạng phiên âm Kinh Thánh tiếng Việt quen thuộc.
