  text: καὶ αἱ ἀδελφαὶ αὐτοῦ οὐχὶ πᾶσαι πρὸς ἡμᾶς εἰσιν; πόθεν οὖν τούτῳ ταῦτα πάντα;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/056.yaml
  text: And are not all his sisters with us? Where then did this man get all these things?[a]
translation:
  language: vi
  text: Các chị em[a] của người này chẳng phải đều ở cùng chúng ta sao? Vậy thì người này lấy đâu ra tất cả những điều đó?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hoặc “các nữ thân thuộc.” Từ Hy Lạp ở đây thông thường có nghĩa là “các chị em,” nhưng một số người hiểu theo nghĩa rộng hơn dựa trên các tranh luận thần học về sau.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀδελφαὶ
  choice: các chị em gái
  rationale: Đây là nghĩa thân thuộc thông thường và trực tiếp của từ Hy Lạp trong ngữ cảnh dân làng nhắc đến gia đình Chúa Giê-su; cách dịch này không áp đặt một cách giải thích thần học về quan hệ họ hàng rộng hơn.
- source_word: οὐχὶ πᾶσαι
  choice: chẳng phải đều ... sao?
  rationale: Cấu trúc câu hỏi tu từ mong đợi câu trả lời khẳng định; “đều” giữ được trọng tâm về toàn thể các chị em gái.
- source_word: πρὸς ἡμᾶς
  choice: ở với chúng ta
  rationale: Diễn đạt tự nhiên sự hiện diện và gắn bó với cộng đồng địa phương, đồng thời ít diễn giải hơn “ở giữa cộng đồng chúng ta”.
- source_word: πόθεν
  choice: từ đâu
  rationale: Giữ đúng câu hỏi về nguồn gốc của những điều Chúa Giê-su có, thay vì chuyển thành câu hỏi về cách thức.
- source_word: οὖν
  choice: vậy
  rationale: Thể hiện bước suy luận trong lời nói của dân làng bằng một liên từ tự nhiên trong tiếng Việt hiện đại.
- source_word: τούτῳ
  choice: ông ta
  rationale: Đại từ này quy chiếu đến Chúa Giê-su trong lời nói mang sắc thái xa cách, hơi xem thường; “ông ta” truyền đạt sắc thái ấy tự nhiên hơn “người này” trong cấu trúc tiếng Việt của câu.
- source_word: ταῦτα πάντα
  choice: tất cả những điều ấy
  rationale: Giữ dạng số nhiều và quy chiếu rộng đến sự khôn ngoan cùng các việc quyền năng đã được nhắc đến trong ngữ cảnh trước.
theological_decisions:
- issue: Quan hệ của những người được gọi là ἀδελφαὶ với Chúa Giê-su
  choice: Dịch theo nghĩa từ vựng thông thường là “các chị em gái”.
  alternative: “các nữ thân thuộc” hoặc “các chị em họ”
  rationale: Bản dịch cần phản ánh nghĩa tự nhiên của tiếng Hy Lạp trong ngữ cảnh, không dùng cách diễn đạt rộng hơn để ngầm giải quyết những tranh luận thần học về sau. Chú thích ghi nhận cách hiểu khác mà không đưa nó vào chính văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Cấu trúc “chẳng phải ... sao?” giữ tính chất câu hỏi tu từ; “ông ta” tái hiện sắc thái xa cách, hơi coi thường trong lời dân làng mà không làm câu văn thô tục.
