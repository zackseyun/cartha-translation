  language: vi
  text: 'Ngài nói với họ nhiều điều bằng dụ ngôn, rằng: “Kìa, người gieo giống đi ra để gieo.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παραβολαῖς
  choice: các ẩn dụ
  rationale: Diễn đạt tự nhiên trong tiếng Việt hiện đại, đồng thời giữ nghĩa về những hình ảnh hoặc câu chuyện so sánh dùng để truyền đạt chân lý.
- source_word: Ἰδοὺ
  choice: Kìa
  rationale: Giữ chức năng thu hút sự chú ý của mệnh lệnh từ ἰδού, với sắc thái trang trọng nhưng vẫn dễ hiểu.
- source_word: ὁ σπείρων
  choice: người gieo giống
  rationale: Danh từ hóa phân từ hiện tại, chỉ người thực hiện việc gieo; thêm “giống” để cụm từ tự nhiên và rõ nghĩa trong tiếng Việt.
- source_word: ἐξῆλθεν ... τοῦ σπείρειν
  choice: đi ra để gieo
  rationale: Giữ cả động tác đi ra và cấu trúc chỉ mục đích của nguyên văn.
