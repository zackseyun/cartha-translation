review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch giữ được các yếu tố chính: Đức Giê-su nói với họ, nói nhiều điều bằng/trong các παραβολαί, rồi mở đầu lời dụ ngôn bằng lời thu hút chú ý; «người gieo giống đi ra để gieo» phản ánh sát ὁ σπείρων ... τοῦ σπείρειν. Tuy nhiên, «ẩn dụ» thường chỉ một biện pháp tu từ (metaphor), không tương ứng chính xác với παραβολή ở đây, vốn là một dụ ngôn/lời kể so sánh.'
  naturalness: Câu sửa vẫn hiện đại, trang trọng và mạch lạc. «Nói với họ nhiều điều bằng dụ ngôn» diễn đạt tự nhiên hơn «dùng các ẩn dụ mà nói với họ nhiều điều», đồng thời tránh hiểu lầm thể loại.
  terminology: Nên dùng «dụ ngôn» cho παραβολαῖς, là thuật ngữ Kinh Thánh Việt ngữ thông dụng và chính xác hơn trong ngữ cảnh này. «Kìa» bảo toàn lực thu hút chú ý của Ἰδοὺ; «người gieo giống» phù hợp với ὁ σπείρων.
  issues:
  - severity: medium
    issue: «các ẩn dụ» dịch παραβολαῖς
    rationale: «Ẩn dụ» trong tiếng Việt hiện đại chủ yếu là phép chuyển nghĩa/so sánh ngầm, còn παραβολαί trong Ma-thi-ơ 13 chỉ các dụ ngôn. Cần thay bằng «dụ ngôn» để giữ đúng thể loại và thuật ngữ.
  revised_text: 'Ngài nói với họ nhiều điều bằng dụ ngôn, rằng: “Kìa, người gieo giống đi ra để gieo.”'
