id: MAT.13.14
reference: Matthew 13:14
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἀναπληροῦται αὐτοῖς ἡ προφητεία Ἠσαΐου ἡ λέγουσα· Ἀκοῇ ἀκούσετε καὶ οὐ μὴ συνῆτε, καὶ βλέποντες βλέψετε καὶ οὐ μὴ ἴδητε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/014.yaml
  text: 'And in them the prophecy of Isaiah is fulfilled[a], which says: ‘You will indeed hear, but never understand, and seeing you will see, but never perceive.’'
translation:
  language: vi
  text: 'Đối với họ, lời tiên tri của Ê-sai được ứng nghiệm[a]: “Các ngươi sẽ thật sự nghe, nhưng nhất định không hiểu; các ngươi sẽ thật sự nhìn, nhưng nhất định không thấy.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Theo sát nguyên văn: “Bằng sự nghe, các ngươi sẽ nghe ... và đang thấy, các ngươi sẽ thấy”; đây là lối diễn đạt nhấn mạnh kiểu Hê-bơ-rơ, được truyền đạt qua bản văn Hy Lạp.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναπληροῦται
  choice: được ứng nghiệm
  rationale: Thì hiện tại, thể bị động được diễn đạt tự nhiên bằng công thức tiếng Việt “được ứng nghiệm”; không thêm “hoàn toàn” vì có thể làm mạnh quá sắc thái hoàn tất của động từ.
- source_word: αὐτοῖς
  choice: nơi họ
  rationale: Diễn tả lời tiên tri được hiện thực hóa trong trường hợp của những người vừa được nhắc đến, mà không biến họ thành tác nhân làm ứng nghiệm.
- source_word: προφητεία Ἠσαΐου
  choice: lời tiên tri của Ê-sai
  rationale: Cách nói tự nhiên, trang trọng và sát cấu trúc sở hữu trong tiếng Hy Lạp.
- source_word: ἡ λέγουσα
  choice: dấu hai chấm trực tiếp dẫn lời
  rationale: Trong tiếng Việt, dấu hai chấm giới thiệu nội dung lời tiên tri tự nhiên hơn việc dịch cứng là “lời nói rằng”.
- source_word: Ἀκοῇ ἀκούσετε
  choice: Các ngươi sẽ nghe, quả thật sẽ nghe
  rationale: Giữ cấu trúc đồng gốc mang tính nhấn mạnh của tiếng Hy Lạp bằng phép lặp tự nhiên hơn trong tiếng Việt.
- source_word: οὐ μὴ συνῆτε
  choice: nhưng tuyệt nhiên không hiểu
  rationale: “Tuyệt nhiên không” chuyển tải phép phủ định mạnh οὐ μή; “nhưng” làm rõ sự tương phản vốn được diễn đạt bằng καί trong lối văn nguồn.
- source_word: βλέποντες βλέψετε
  choice: sẽ nhìn, quả thật sẽ nhìn
  rationale: Giữ thế song hành và sắc thái nhấn mạnh với mệnh đề về nghe, đồng thời phân biệt hành động nhìn với sự nhận biết ở mệnh đề sau.
- source_word: οὐ μὴ ἴδητε
  choice: nhưng tuyệt nhiên không nhận thấy
  rationale: “Nhận thấy” diễn đạt sự tri nhận mà không lặp đơn thuần động từ “nhìn”; “tuyệt nhiên không” bảo toàn sức mạnh của οὐ μή.
theological_decisions:
- issue: Bản chất của sự ứng nghiệm lời tiên tri
  choice: Lời tiên tri được ứng nghiệm nơi những người này
  alternative: Lời tiên tri chỉ được minh họa qua họ, hoặc được hoàn tất trọn vẹn theo một nghĩa mạnh hơn
  rationale: Bản dịch giữ nguyên ngôn ngữ ứng nghiệm của câu, không quy định cơ chế thần học của sự cứng lòng và cũng không giảm nó thành một sự tương đồng đơn thuần.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Đại từ “các ngươi” giữ ngôi số nhiều của lời trích dẫn và sắc thái công bố tiên tri; phép lặp “quả thật sẽ…” bảo toàn nhịp song hành mà không giải thích quá mức.
