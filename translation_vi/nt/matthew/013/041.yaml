id: MAT.13.41
reference: Matthew 13:41
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀποστελεῖ ὁ υἱὸς τοῦ ἀνθρώπου τοὺς ἀγγέλους αὐτοῦ, καὶ συλλέξουσιν ἐκ τῆς βασιλείας αὐτοῦ πάντα τὰ σκάνδαλα καὶ τοὺς ποιοῦντας τὴν ἀνομίαν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/041.yaml
  text: The Son of Man will send out his angels[a], and they will gather out of his kingdom all causes of stumbling and those who practice lawlessness[b],
translation:
  language: vi
  text: Con Người sẽ sai các thiên sứ của Người đi; họ sẽ thu gom khỏi vương quốc của Người mọi điều gây vấp ngã[a] và những kẻ thực hành sự vô luật pháp[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “mọi chướng ngại gây vấp ngã.” Từ Hy Lạp σκάνδαλα có thể chỉ những điều khiến người ta phạm tội hoặc lìa bỏ đức tin.'
    reason: lexical_alternative
  - marker: b
    text: 'Sát nghĩa: “những kẻ làm sự vô luật pháp.” Cách diễn đạt này nhấn mạnh hành vi chống nghịch luật của Đức Chúa Trời như một đặc điểm thường xuyên.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποστελεῖ
  choice: sẽ sai ... đi
  rationale: Động từ tương lai ἀποστέλλω diễn tả việc phái các tác nhân đi thi hành nhiệm vụ; “sai ... đi” tự nhiên trong tiếng Việt và giữ được sắc thái được ủy nhiệm.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Con Người
  rationale: Cách gọi đã quen thuộc trong tiếng Việt, bảo toàn tính chất danh hiệu và âm vang Đa-ni-ên 7 mà không diễn giải thêm.
- source_word: τοὺς ἀγγέλους αὐτοῦ
  choice: các thiên sứ của mình
  rationale: Trong bối cảnh phán xét cánh chung, ἄγγελοι chỉ các hữu thể thiên giới, không phải sứ giả loài người. “Của mình” quy chiếu tự nhiên về chủ ngữ Con Người.
- source_word: συλλέξουσιν
  choice: họ sẽ gom
  rationale: “Gom” phù hợp hình ảnh thu hoạch và việc tập hợp để loại bỏ trong lời giải thích dụ ngôn.
- source_word: ἐκ τῆς βασιλείας αὐτοῦ
  choice: khỏi vương quốc của Người
  rationale: “Khỏi” diễn tả sự đưa ra khỏi phạm vi vương quốc; “Người” giữ lối xưng hô trang trọng và chỉ Con Người.
- source_word: πάντα τὰ σκάνδαλα
  choice: mọi điều gây vấp ngã
  rationale: σκάνδαλα có thể bao gồm những sự vật, ảnh hưởng hoặc tác nhân khiến người ta phạm tội hay lìa bỏ đức tin. “Mọi điều gây vấp ngã” giữ phạm vi rộng và dễ hiểu.
- source_word: τοὺς ποιοῦντας τὴν ἀνομίαν
  choice: những kẻ làm điều trái luật
  rationale: Cụm này chỉ những người thực hiện ἀνομία. “Làm điều trái luật” khá sát cấu trúc Hy Lạp và giữ liên hệ với luật của Đức Chúa Trời; chú thích nêu rõ sắc thái hành vi có tính thường xuyên.
theological_decisions:
- issue: Cách dịch danh hiệu ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Con Người
  alternative: Đấng thuộc loài người
  rationale: “Con Người” duy trì danh hiệu truyền thống, sự mơ hồ có chủ ý và liên hệ khải huyền với Đa-ni-ên 7 mà không biến nó thành một lời giải nghĩa.
- issue: Phạm vi nghĩa của σκάνδαλα trong bối cảnh phán xét
  choice: mọi điều gây vấp ngã
  alternative: mọi chướng ngại gây vấp ngã
  rationale: Từ số nhiều trung tính có thể nói đến sự vật, ảnh hưởng hoặc tác nhân dẫn người khác vào tội lỗi. Bản dịch chính không thu hẹp phạm vi chỉ còn sự xúc phạm hay chỉ con người.
- issue: Sắc thái của ἀνομία
  choice: điều trái luật
  alternative: sự vô luật pháp
  rationale: “Điều trái luật” tự nhiên hơn trong tiếng Việt phổ thông mà vẫn giữ ý chống nghịch luật của Đức Chúa Trời; không làm nhạt thành khái niệm chung chung “điều ác”.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “Con Người” như danh hiệu quen thuộc; “thiên sứ” cho bối cảnh thiên giới; giữ dấu phẩy cuối câu vì câu Hy Lạp tiếp tục sang câu kế tiếp.
