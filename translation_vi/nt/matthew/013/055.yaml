revisions:
- from: “Chẳng phải người này là con trai của người thợ mộc sao? Mẹ người chẳng phải tên là Ma-ri, còn các anh em trai[a] của người là Gia-cơ, Giô-sép[b], Si-môn và Giu-đa sao?”
  to: “Chẳng phải người này là con trai của người thợ mộc sao? Mẹ người ấy chẳng phải là Ma-ri, và các anh em[a] của người ấy là Gia-cơ, Giô-sép[b], Si-môn và Giu-đa sao?”
  rationale: Sửa cấu trúc định danh của người mẹ để tiếng Việt hiện đại tự nhiên và chính xác. Thay “anh em trai” bằng “anh em” để giữ cách diễn đạt thông dụng và sát nghĩa bề mặt hơn, không áp đặt cách hiểu về quan hệ huyết thống. Các tên riêng, hai câu hỏi tu từ, và các chú thích về nghĩa từ vựng/dị bản được giữ nguyên về nội dung.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T02:47:48Z'
review_pass:
  verdict: revise
  source_fidelity: Bản dịch giữ đúng hai câu hỏi tu từ và các quan hệ gia đình trong nguyên văn. Tuy nhiên, cụm “Mẹ người chẳng phải tên là Ma-ri” không diễn đạt đúng, tự nhiên ý của λέγεται (“được gọi là / tên là”); cần sửa cấu trúc câu.
  naturalness: “Mẹ người chẳng phải tên là” không chuẩn trong tiếng Việt hiện đại. Dùng “Mẹ người ấy chẳng phải là Ma-ri sao?” tự nhiên, trang trọng vừa phải, và vẫn chuyển tải chức năng định danh của λέγεται. “Anh em” tự nhiên hơn “anh em trai” trong câu này; danh sách toàn tên nam đã xác định giới tính, còn chú thích bảo lưu nghĩa rộng.
  terminology: “Người thợ mộc,” “Ma-ri,” “Gia-cơ,” “Giô-sép,” “Si-môn,” và “Giu-đa” phù hợp với cách dùng Kinh Thánh tiếng Việt. Chính văn nên dùng “anh em” theo nghĩa bề mặt của ἀδελφοί, không giải quyết tranh luận về quan hệ chính xác.
  issues:
  - severity: medium
    issue: Cấu trúc “Mẹ người chẳng phải tên là Ma-ri” không tự nhiên và không chuẩn.
    rationale: Trong tiếng Việt, “tên là” cần chủ ngữ trực tiếp là người mang tên, hoặc có động từ như “có tên là/được gọi là”. Câu nguồn hỏi liệu mẹ của ông có phải là Ma-ri hay không.
  - severity: low
    issue: “Anh em trai” là cách nói nặng và kém tự nhiên trong ngữ cảnh liệt kê gia đình.
    rationale: “Anh em” là cách dịch thông dụng, đủ phản ánh ἀδελφοί; các tên được liệt kê cho thấy đây là những nam nhân, trong khi chú thích vẫn nêu khả năng hiểu rộng hơn.
