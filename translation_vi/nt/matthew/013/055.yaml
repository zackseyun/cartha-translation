id: MAT.13.55
reference: Matthew 13:55
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οὐχ οὗτός ἐστιν ὁ τοῦ τέκτονος υἱός; ⸀οὐχ ἡ μήτηρ αὐτοῦ λέγεται Μαριὰμ καὶ οἱ ἀδελφοὶ αὐτοῦ Ἰάκωβος καὶ ⸀Ἰωσὴφ καὶ Σίμων καὶ Ἰούδας;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/055.yaml
  text: Is this not the carpenter’s son? Is not his mother called Mary[b][a], and his brothers James and Joseph and Simon and Judas?
translation:
  language: vi
  text: “Chẳng phải người này là con trai của người thợ mộc sao? Mẹ người ấy chẳng phải là Ma-ri, và các anh em[a] của người ấy là Gia-cơ, Giô-sép[b], Si-môn và Giu-đa sao?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể hiểu là “bà con” hoặc “họ hàng”. Từ Hy Lạp thường có nghĩa là “anh em”, nhưng một số người hiểu theo nghĩa rộng hơn trong ngữ cảnh này.
    reason: lexical_alternative
  - marker: b
    text: Một số thủ bản chép “Giô-xê” thay cho “Giô-sép”.
    reason: textual_variant
lexical_decisions:
- source_word: τέκτονος
  choice: người thợ mộc
  rationale: τέκτων chỉ một thợ thủ công, thường làm việc với gỗ hoặc trong xây dựng. “Người thợ mộc” là cách diễn đạt tự nhiên, quen thuộc trong tiếng Việt và phù hợp với ngữ cảnh, dù từ Hy Lạp có thể có nghĩa rộng hơn là thợ xây hoặc thợ thủ công.
- source_word: υἱός
  choice: con trai
  rationale: Ngữ cảnh gia đình xác định nghĩa trực tiếp là con trai; cách dịch này cũng phân biệt rõ với nghĩa chung hơn của “con” trong tiếng Việt.
- source_word: λέγεται
  choice: tên là
  rationale: Trong ngữ cảnh hỏi về danh tính, thể bị động λέγεται có nghĩa tự nhiên là “được gọi là” hoặc “tên là”; “tên là” gọn và hiện đại hơn trong tiếng Việt.
- source_word: ἀδελφοὶ
  choice: anh em trai
  rationale: Nghĩa thông thường của từ Hy Lạp là những người anh hoặc em trai. Tiếng Việt cần dùng cụm “anh em trai” để không xác định họ lớn tuổi hay nhỏ tuổi hơn Chúa Giê-su; khả năng hiểu rộng hơn được ghi ở chú thích.
- source_word: Ἰάκωβος
  choice: Gia-cơ
  rationale: Dùng dạng tên riêng đã quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
- source_word: Ἰωσὴφ
  choice: Giô-sép
  rationale: Phản ánh cách đọc Ἰωσήφ của SBLGNT và dùng dạng tên quen thuộc trong tiếng Việt; dị bản được nêu trong chú thích.
- source_word: Σίμων
  choice: Si-môn
  rationale: Dùng dạng phiên âm quen thuộc trong Kinh Thánh tiếng Việt.
- source_word: Ἰούδας
  choice: Giu-đa
  rationale: Dùng dạng phiên âm quen thuộc trong Kinh Thánh tiếng Việt, phản ánh tên Hy Lạp Ἰούδας mà không đồng nhất nhân vật này với Giu-đa Ích-ca-ri-ốt.
- source_word: οὐχ ... ;
  choice: Chẳng phải ... sao?
  rationale: Cấu trúc này chuyển tải tự nhiên câu hỏi tu từ mong đợi câu trả lời khẳng định, đồng thời giữ sắc thái chất vấn của nguyên văn.
theological_decisions:
- issue: Mối quan hệ được diễn tả bằng ἀδελφοὶ αὐτοῦ
  choice: Dịch trong chính văn là “các anh em trai của người”
  alternative: “bà con” hoặc “người thân của người”
  rationale: Nghĩa thông thường trên bề mặt của ἀδελφοί là “anh em trai”. Bản dịch không nên tự giải quyết cuộc tranh luận thần học về quan hệ huyết thống chính xác giữa những người này với Chúa Giê-su hay về sự đồng trinh trọn đời của Ma-ri. Chú thích bảo lưu khả năng hiểu rộng hơn.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Người này” và đại từ “người” giữ sắc thái của lời dân chúng trong câu chuyện mà không dùng lối nói quá suồng sã. Hai câu hỏi tu từ được giữ nguyên; “còn” giúp nối tự nhiên danh của người mẹ với danh sách các anh em trai. Các tên riêng dùng dạng phiên âm Kinh Thánh tiếng Việt quen thuộc.
