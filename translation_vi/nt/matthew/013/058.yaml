  text: And he did not do many mighty works there because of their unbelief[a].
translation:
  language: vi
  text: Và Ngài không làm nhiều việc quyền năng tại đó vì sự không tin của họ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “nhiều phép lạ” hoặc “nhiều việc quyền năng.” Từ Hy Lạp này chỉ những việc biểu lộ quyền năng và, trong văn cảnh này, nói đến các việc kỳ diệu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ οὐκ ἐποίησεν
  choice: Ngài không làm
  rationale: Động từ ποιέω có nghĩa rộng là “làm”; với οὐκ, câu nói về việc không thực hiện, chứ không diễn đạt sự bất lực. Không dịch καί thành “vì thế” để tránh thêm sắc thái suy luận không bắt buộc trong nguyên văn.
- source_word: ἐκεῖ
  choice: tại đó
  rationale: Trạng từ chỉ nơi chốn, quy chiếu về quê hương của Ngài trong văn cảnh; “tại đó” tự nhiên và trang trọng.
- source_word: δυνάμεις πολλὰς
  choice: nhiều việc quyền năng
  rationale: Trong văn cảnh các sách Tin Mừng, δύναμις chỉ những việc biểu lộ quyền năng, thường là phép lạ. “Việc quyền năng” giữ được mối liên hệ từ vựng với quyền năng mà không thu hẹp nghĩa hoàn toàn thành “phép lạ”; πολλὰς được dịch là “nhiều”.
- source_word: διὰ τὴν ἀπιστίαν αὐτῶν
  choice: vì sự vô tín của họ
  rationale: διά với đối cách diễn tả nguyên nhân. ἀπιστία mang nghĩa vô tín hoặc thiếu đức tin; “sự vô tín” giữ sắc thái phủ định mạnh trong bối cảnh họ khước từ Ngài.
theological_decisions:
- issue: Câu này nói Chúa Giê-su không thể làm hay đã không làm nhiều việc quyền năng vì sự vô tín?
  choice: “Ngài không làm nhiều việc quyền năng”
  alternative: “Ngài không thể làm nhiều phép lạ”
  rationale: Nguyên văn dùng οὐκ ἐποίησεν, nghĩa là “không làm”, chứ không dùng cách diễn đạt về sự bất lực. Bản dịch giữ nguyên sự phân biệt này và không đưa vào một khẳng định thần học mạnh hơn lời của Ma-thi-ơ.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” phù hợp lối kể kính trọng về Chúa Giê-su; “việc quyền năng” bảo toàn sắc thái của δύναμις. Lược dịch liên từ καί ở đầu câu vì tiếng Việt không cần nối bằng “và” trong câu độc lập, đồng thời tránh biến nó thành quan hệ kết quả.
