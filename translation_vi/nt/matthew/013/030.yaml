  to: 'Cứ để cả hai cùng lớn lên cho đến mùa gặt. Đến mùa gặt, tôi sẽ bảo những người thợ gặt: ‘Trước hết, hãy gom cỏ dại[a] lại và bó chúng thành từng bó để đốt chúng; còn lúa mì thì hãy thu vào kho của tôi.’'
