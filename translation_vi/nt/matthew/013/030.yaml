  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἄφετε συναυξάνεσθαι ἀμφότερα ⸀μέχρι τοῦ θερισμοῦ· καὶ ἐν καιρῷ τοῦ θερισμοῦ ἐρῶ τοῖς θερισταῖς· Συλλέξατε πρῶτον τὰ ζιζάνια καὶ δήσατε αὐτὰ εἰς δέσμας πρὸς τὸ κατακαῦσαι αὐτά, τὸν δὲ σῖτον ⸀συναγάγετε εἰς τὴν ἀποθήκην μου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/030.yaml
  text: Let both grow together until the harvest[a], and at the time of harvest I will tell the reapers, ‘First collect the weeds and tie them into bundles to burn them, but gather the wheat into my storehouse.’
translation:
  language: vi
  text: 'Cứ để cả hai cùng lớn lên cho đến mùa gặt. Đến mùa gặt, tôi sẽ bảo những người thợ gặt: ‘Trước hết, hãy gom cỏ dại[a] lại và bó chúng thành từng bó để đốt chúng; còn lúa mì thì hãy thu vào kho của tôi.’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hoặc có thể là cỏ lùng (một loại cỏ dại giống lúa mì); truyền thống thường dịch là «cỏ độc».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄφετε συναυξάνεσθαι ἀμφότερα
  choice: Cứ để cả hai cùng lớn lên
  rationale: Diễn đạt tự nhiên sắc thái mệnh lệnh cho phép của ἄφετε, đồng thời giữ ý ‘cùng lớn lên’ của động từ ghép συναυξάνεσθαι và ‘cả hai’ của ἀμφότερα.
- source_word: μέχρι τοῦ θερισμοῦ
  choice: cho đến mùa gặt
  rationale: Giữ mốc thời gian xác định trong hình ảnh nông nghiệp của dụ ngôn.
- source_word: ἐν καιρῷ τοῦ θερισμοῦ
  choice: Đến mùa gặt
  rationale: Cách nói tiếng Việt gọn, tự nhiên, truyền đạt thời điểm thích hợp của việc thu hoạch mà không làm câu nặng nề.
- source_word: τοῖς θερισταῖς
  choice: những người thợ gặt
  rationale: Thuật ngữ nông nghiệp rõ ràng, dễ hiểu trong tiếng Việt hiện đại.
- source_word: τὰ ζιζάνια
  choice: cỏ dại
  rationale: ζιζάνια chỉ một loại cỏ có hại, thường được nhận diện là cỏ lùng. ‘Cỏ dại’ dễ hiểu đối với độc giả phổ thông; chú thích bảo lưu nghĩa cụ thể hơn.
- source_word: δήσατε αὐτὰ εἰς δέσμας
  choice: bó thành từng bó
  rationale: Tái hiện cụ thể hành động buộc cỏ thành các bó, đồng thời tránh lối diễn đạt cứng.
- source_word: πρὸς τὸ κατακαῦσαι αὐτά
  choice: để đốt
  rationale: Giữ quan hệ chỉ mục đích của cấu trúc Hy Lạp mà không thêm ý giải thích thần học.
- source_word: τὸν δὲ σῖτον συναγάγετε εἰς τὴν ἀποθήκην μου
  choice: còn lúa mì thì hãy thu vào kho của tôi
  rationale: ‘Còn... thì’ thể hiện rõ sự tương phản δέ; ‘thu vào’ truyền đạt συναγάγετε tự nhiên và phân biệt với hành động gom cỏ trước đó.
theological_decisions:
- issue: Hình ảnh phân rẽ trong dụ ngôn
  choice: Giữ nguyên hình ảnh thu hoạch, đốt cỏ và đưa lúa vào kho.
  alternative: Diễn giải trực tiếp thành sự phán xét cuối cùng hoặc sự hủy diệt.
  rationale: Chính câu này trình bày hình ảnh dụ ngôn; phần giải nghĩa xuất hiện sau đó. Bản dịch không nên đưa lời giải thích thần học vào trước trong lời kể.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ đọc. Dùng ‘tôi’ phù hợp lời của chủ ruộng trong câu chuyện; giữ nhịp mệnh lệnh trực tiếp và sự đối lập giữa cỏ dại với lúa mì.
