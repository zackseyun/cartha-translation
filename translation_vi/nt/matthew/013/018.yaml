  text: Ὑμεῖς οὖν ἀκούσατε τὴν παραβολὴν τοῦ ⸀σπείραντος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/018.yaml
  text: You[a], then, hear the parable of the one who sowed.
translation:
  language: vi
  text: Vậy, anh em hãy nghe dụ ngôn về người gieo giống.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὑμεῖς
  choice: anh em
  rationale: Đại từ được nêu rõ và mang sắc thái nhấn mạnh; “anh em” là cách xưng hô số nhiều tự nhiên, trang trọng trong lời Đức Giê-su nói với các môn đồ.
- source_word: οὖν
  choice: Vậy
  rationale: Diễn đạt quan hệ chuyển tiếp và suy luận với phần trước một cách gọn, tự nhiên.
- source_word: ἀκούσατε
  choice: hãy nghe
  rationale: Giữ nguyên lực mệnh lệnh của động từ aorist; không diễn giải quá mức thành “hãy hiểu”.
- source_word: παραβολὴν
  choice: dụ ngôn
  rationale: Thuật ngữ tiếng Việt chuẩn và chính xác trong bối cảnh lời dạy của các sách Tin Mừng.
- source_word: τοῦ σπείραντος
  choice: về người gieo giống
  rationale: “Người gieo giống” diễn đạt tự nhiên danh hóa phân từ Hy Lạp; “về” làm rõ quan hệ nội dung của dụ ngôn mà không biến cụm này thành một danh hiệu riêng cố định.
theological_decisions: []
