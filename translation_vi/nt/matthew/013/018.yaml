  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ đại từ số nhiều được nhấn mạnh và mệnh lệnh trực tiếp; dùng “gieo giống” thay vì chỉ “gieo” để câu rõ nghĩa trong tiếng Việt.
