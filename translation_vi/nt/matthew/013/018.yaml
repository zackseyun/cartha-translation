  source_fidelity: Bản dịch giữ được đại từ số nhiều được nêu rõ (Ὑμεῖς), liên từ suy luận/chuyển tiếp οὖν (“Vậy”), mệnh lệnh số nhiều ἀκούσατε (“hãy nghe”), và thuật ngữ παραβολή (“dụ ngôn”). Cụm “về người gieo giống” diễn đạt tự nhiên quan hệ của “τὴν παραβολὴν τοῦ σπείραντος” trong tiếng Việt mà không thêm nội dung diễn giải.
