  naturalness: “Thời đại này kết thúc” không tự nhiên trong nhịp văn của câu và làm mờ cấu trúc đồng nhất “mùa gặt là ...”. “Sự tận cùng của thời đại” là cách nói rõ ràng, trang trọng vừa phải, và phù hợp tiếng Việt hiện đại trong ngữ cảnh này.
  terminology: “Kẻ thù,” “gieo,” “mùa gặt,” “những người gặt,” và “các thiên sứ” đều phù hợp. Giữ “ma quỷ” theo lối dùng Kinh Thánh Việt ngữ; ngữ cảnh với mạo từ xác định và vị ngữ đồng nhất cho thấy đây là nhân vật đối nghịch cụ thể, không phải một loại ma quỷ nói chung.
