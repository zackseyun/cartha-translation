  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὁ δὲ ἐχθρὸς ὁ σπείρας αὐτά ἐστιν ὁ διάβολος· ὁ δὲ θερισμὸς συντέλεια ⸀αἰῶνός ἐστιν, οἱ δὲ θερισταὶ ἄγγελοί εἰσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/039.yaml
  text: And the enemy who sowed them is the devil; the harvest is the end of the age[a], and the harvesters are angels.
translation:
  language: vi
  text: Kẻ thù đã gieo chúng là ma quỷ; mùa gặt là sự tận cùng của thời đại[a], còn những người gặt là các thiên sứ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “sự hoàn tất của thời đại”; theo cách dịch truyền thống: “tận cùng thế gian.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐχθρὸς
  choice: kẻ thù
  rationale: Cách gọi tự nhiên, rõ nghĩa trong tiếng Việt hiện đại và giữ được tính chất đối nghịch mang tính cá nhân trong lời giải thích dụ ngôn.
- source_word: ὁ σπείρας
  choice: đã gieo
  rationale: Phân từ aorist xác định kẻ thù qua hành động đã thực hiện; “gieo” duy trì chính xác hình ảnh nông nghiệp của dụ ngôn.
- source_word: αὐτά
  choice: chúng
  rationale: Đại từ chỉ lại cỏ lùng đã được gieo; “chúng” là cách hồi chỉ gọn và tự nhiên.
- source_word: διάβολος
  choice: ma quỷ
  rationale: Ở đây từ này là danh xưng chỉ một hữu thể đối nghịch cụ thể; “ma quỷ” rõ nghĩa với độc giả Việt và tránh biến danh xưng thành nghĩa từ nguyên “kẻ vu khống”.
- source_word: θερισμὸς
  choice: mùa gặt
  rationale: Cách nói thông dụng trong tiếng Việt, vừa chỉ sự thu hoạch vừa giữ nguyên hình ảnh của dụ ngôn.
- source_word: συντέλεια αἰῶνός
  choice: thời đại này kết thúc
  rationale: Diễn đạt tự nhiên ý kết cuộc hoặc giai đoạn hoàn tất của thời đại, đồng thời tránh hiểu αἰών là thế giới vật chất bị hủy diệt. Từ “này” được dùng theo hàm ý ngữ cảnh của “thời đại” hiện tại, không nhằm thêm một đối tượng khác vào nguyên văn.
- source_word: θερισταὶ
  choice: những người gặt
  rationale: Cách gọi minh bạch, tự nhiên hơn “thợ gặt” trong cấu trúc giải nghĩa, đồng thời vẫn giữ hình ảnh nông nghiệp.
- source_word: ἄγγελοί
  choice: các thiên sứ
  rationale: Bối cảnh cánh chung cho thấy đây là các hữu thể thiên giới chứ không chỉ là những sứ giả loài người.
- source_word: δὲ
  choice: dấu chấm phẩy / còn
  rationale: Các δέ nối tiếp đánh dấu sự chuyển sang từng vế giải nghĩa. Dấu chấm phẩy và “còn” thể hiện tiến trình ấy tự nhiên, không ép sắc thái tương phản mạnh.
theological_decisions:
- issue: Cách dịch αἰών trong cụm cánh chung συντέλεια αἰῶνός
  choice: thời đại này kết thúc
  alternative: sự tận cùng của thế gian; sự hoàn tất của thời đại
  rationale: Lựa chọn này giữ nghĩa thời gian của αἰών và nét kết cuộc của συντέλεια, nhưng không đồng nhất câu với sự hủy diệt thế giới vật chất. Chú thích bảo lưu cách diễn đạt sát danh từ hơn và cách dịch truyền thống.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Cấu trúc ba vế được giữ rõ ràng; dấu chấm phẩy giúp thể hiện nhịp giải nghĩa của nguyên văn. Thuật ngữ “thiên sứ” phù hợp văn phong Kinh Thánh tiếng Việt phổ thông.
