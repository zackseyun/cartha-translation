    rationale: Trong cách dùng tiếng Việt chuẩn hiện nay, “cây lúa” thường là rice plant, không phải cách gọi chung cho ngũ cốc hay wheat. Điều này có thể khiến độc giả hiểu sai bối cảnh nông nghiệp của dụ ngôn.
  - severity: low
    issue: Từ τότε chưa được thể hiện trực tiếp
    rationale: Cấu trúc cũ có thể hiểu được quan hệ thời gian, nhưng thêm “thì” sau mệnh đề “khi” phản ánh rõ hơn τότε (“bấy giờ/thì”) và vẫn tự nhiên.
  - severity: low
    issue: Chú thích mô tả cỏ lùng quá xác định về thời điểm giống lúa mì
    rationale: ζιζάνια không buộc phải được nhận diện chắc chắn là một loài cụ thể. Nên dùng cách diễn đạt dè dặt “có thể là” và không giới hạn sự giống nhau vào giai đoạn còn non.
