- from: Nhưng khi cây lúa đã mọc lên và kết hạt, cỏ dại[a] cũng xuất hiện.
  to: Nhưng khi lúa mì đã mọc lên và trổ hạt, thì cỏ dại[a] cũng xuất hiện.
  rationale: Sửa “cây lúa” thành “lúa mì” là cần thiết để tránh nghĩa “lúa gạo” trong tiếng Việt, đồng thời phù hợp với bối cảnh ruộng lúa mì của dụ ngôn. “Trổ hạt” diễn đạt tự nhiên việc cây ngũ cốc cho hạt. Thêm “thì” để phản ánh τότε. Chú thích được làm dè dặt hơn để không biến một nhận diện thực vật học có tranh luận thành điều chắc chắn.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T02:47:34Z'
review_pass:
  verdict: revise
  source_fidelity: Cần sửa “cây lúa”, vì trong tiếng Việt hiện đại cụm này thông thường chỉ cây lúa gạo (rice), trong khi bối cảnh dụ ngôn là ruộng lúa mì. Dù χόρτος tự nó là “cây cỏ/cây trồng”, ngữ cảnh trực tiếp cho phép và cần cách gọi “lúa mì”. Bản sửa giữ trình tự đã nảy mọc rồi ra hạt, và giữ sắc thái “cũng” của καί.
  naturalness: 'Câu sửa tự nhiên, rõ ràng và có nhịp kể chuyện phù hợp: “Nhưng khi lúa mì đã mọc lên và trổ hạt, thì cỏ dại cũng xuất hiện.” Việc thêm “thì” biểu đạt rõ τότε mà không nặng câu.'
  terminology: Dùng “lúa mì” thay cho “cây lúa” để tránh chuyển sai loại ngũ cốc. “Cỏ dại” là cách dịch khái quát tốt cho ζιζάνια; chú thích giữ “cỏ lùng” như một khả năng, không khẳng định nhận diện thực vật học.
  issues:
