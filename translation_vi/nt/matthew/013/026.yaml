  text: ὅτε δὲ ἐβλάστησεν ὁ χόρτος καὶ καρπὸν ἐποίησεν, τότε ἐφάνη καὶ τὰ ζιζάνια.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/026.yaml
  text: But when the plants had sprouted and produced grain[a], then the weeds also appeared.
translation:
  language: vi
  text: Nhưng khi lúa mì đã mọc lên và trổ hạt, thì cỏ dại[a] cũng xuất hiện.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “cỏ lùng”; có thể là một loài cỏ giống lúa mì.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε δὲ
  choice: Nhưng khi
  rationale: ὅτε mở đầu mệnh đề thời gian, còn δέ là liên từ chuyển ý nhẹ; “Nhưng khi” diễn đạt tự nhiên cả trình tự lẫn nét tương phản với việc gieo hạt trước đó.
- source_word: ἐβλάστησεν ὁ χόρτος
  choice: cây lúa đã mọc lên
  rationale: ἐβλάστησεν chỉ việc nảy mầm, đâm chồi hay mọc lên; χόρτος trong bối cảnh đồng lúa mì chỉ cây trồng đang lớn. “Cây lúa” tự nhiên trong tiếng Việt và phù hợp bối cảnh, nhưng không xác định loại lúa theo cách gọi thông thường của tiếng Việt.
- source_word: καρπὸν ἐποίησεν
  choice: kết hạt
  rationale: Cụm từ có nghĩa đen là “làm ra quả”, nhưng trong ngữ cảnh cây ngũ cốc, “kết hạt” truyền đạt đúng việc cây bắt đầu cho thấy sản phẩm của nó và giúp giải thích vì sao cỏ dại lúc ấy mới lộ rõ.
- source_word: τότε
  choice: khi …, … cũng
  rationale: Quan hệ thời gian do τότε đánh dấu được diễn đạt tự nhiên trong cấu trúc tương liên của tiếng Việt; không cần lặp thêm “bấy giờ” vì sẽ làm câu nặng.
- source_word: ἐφάνη
  choice: xuất hiện
  rationale: Động từ ở đây mang nghĩa trở nên thấy rõ hoặc lộ ra; “xuất hiện” ngắn gọn, tự nhiên và không hàm ý rằng cỏ dại chỉ mới bắt đầu tồn tại vào lúc ấy.
- source_word: καὶ τὰ ζιζάνια
  choice: cỏ dại cũng
  rationale: ζιζάνια chỉ loại cỏ mọc lẫn trong ruộng, có thể là cỏ lùng; bản văn chính dùng “cỏ dại” để người đọc hiện đại dễ hiểu, còn καί được thể hiện bằng “cũng”.
theological_decisions:
- issue: Việc xác định chính xác ζιζάνια
  choice: Dịch khái quát là “cỏ dại” trong bản văn chính
  alternative: “cỏ lùng” hoặc một loài cỏ cụ thể giống lúa mì
  rationale: Nguyên văn không đòi hỏi phải xác định chắc chắn loài thực vật. Cách dịch khái quát giữ được ý của dụ ngôn mà không biến một khả năng thực vật học thành điều chắc chắn; phương án truyền thống và cụ thể hơn được giữ trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “cây lúa” theo nghĩa cây ngũ cốc trong ngữ cảnh, tránh cách nói kỹ thuật; đặt dấu chú thích ngay sau “cỏ dại”, là từ mà chú thích giải nghĩa.
