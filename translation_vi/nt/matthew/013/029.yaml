    issue: “nhổ” được dùng để dịch συλλέγοντες
    rationale: συλλέγοντες là “gom/thu gom”; ý “nhổ bật rễ” nằm ở ἐκριζώσητε. Cần bảo toàn sự phân biệt của hai động từ.
  - severity: medium
