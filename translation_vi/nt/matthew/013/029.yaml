id: MAT.13.29
reference: Matthew 13:29
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὁ δέ ⸀φησιν· Οὔ, μήποτε συλλέγοντες τὰ ζιζάνια ἐκριζώσητε ἅμα αὐτοῖς τὸν σῖτον·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/029.yaml
  text: But he said[a], ‘No, lest while gathering the weeds you uproot the wheat along with them.’
translation:
  language: vi
  text: 'Nhưng ông đáp: “Không, kẻo khi gom cỏ dại[a], các anh lại nhổ bật cả lúa mì cùng với chúng.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “cỏ lùng”; có thể là cỏ darnel, một loại cỏ dại lúc còn non có thể trông giống lúa mì.
    reason: lexical_alternative
lexical_decisions:
- source_word: φησιν
  choice: ông đáp
  rationale: Thì hiện tại lịch sử trong tiếng Hy Lạp được diễn đạt tự nhiên bằng quá khứ trong lời kể tiếng Việt; “đáp” phù hợp vì đây là lời trả lời các đầy tớ.
- source_word: Οὔ
  choice: Không nên
  rationale: Trong ngữ cảnh, lời phủ định không chỉ là “không” mà ngăn hành động vừa được đề nghị; “Không nên” tự nhiên và không thêm một mệnh lệnh tuyệt đối.
- source_word: μήποτε
  choice: vì ... có thể
  rationale: Diễn đạt lời cảnh báo về một hậu quả không mong muốn có khả năng xảy ra, giữ sắc thái phòng ngừa của μήποτε.
- source_word: συλλέγοντες τὰ ζιζάνια
  choice: khi nhổ cỏ lùng
  rationale: συλλέγοντες cơ bản là gom hoặc thu lại; trong ngữ cảnh loại bỏ cây cỏ khỏi ruộng, “nhổ” tạo câu tự nhiên và nối rõ với hậu quả nhổ bật rễ, dù hành động nhổ tận rễ nằm chính xác hơn ở động từ kế tiếp.
- source_word: ζιζάνια
  choice: cỏ lùng
  rationale: “Cỏ lùng” là tên gọi tiếng Việt tương đối quen thuộc cho loại cỏ dại giống lúa mì khi còn non; vừa rõ hơn “cỏ dại” vừa tránh khẳng định quá mức một định danh thực vật tuyệt đối.
- source_word: ἐκριζώσητε
  choice: nhổ bật rễ
  rationale: Diễn đạt cụ thể ý kéo cây ra khỏi đất cả rễ của động từ ἐκριζόω.
- source_word: ἅμα αὐτοῖς
  choice: cả ... cùng với nó
  rationale: Giữ ý lúa mì bị nhổ đồng thời và chung với cỏ lùng; đại từ số nhiều trung tính tiếng Hy Lạp được diễn đạt tự nhiên bằng danh từ tập hợp số ít trong tiếng Việt.
- source_word: τὸν σῖτον
  choice: lúa mì
  rationale: Trong sự tương phản với ζιζάνια ở ruộng này, σῖτος chỉ cây lúa mì hơn là ngũ cốc nói chung.
theological_decisions:
- issue: Cách dịch ζιζάνια trong dụ ngôn quen thuộc
  choice: cỏ lùng
  alternative: cỏ dại; cỏ lồng vực
  rationale: “Cỏ lùng” bảo tồn hình ảnh một loại cỏ có thể bị nhầm với lúa mì, điều quan trọng đối với diễn tiến của dụ ngôn. Chú thích giữ lại cách dịch khái quát và tên thực vật khả dĩ, không biến việc định danh thành một khẳng định thần học.
- issue: Mức độ chắc chắn của hậu quả do μήποτε diễn đạt
  choice: có thể nhổ bật rễ
  alternative: kẻo các anh nhổ bật rễ
  rationale: μήποτε nêu hậu quả đáng lo ngại, không nhất thiết khẳng định hậu quả chắc chắn. “Có thể” giữ sắc thái khả hữu mà không làm suy yếu lời cảnh báo.
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. “Các anh” thể hiện lời chủ ruộng nói với nhiều đầy tớ mà không dùng lối xưng hô cổ. Dấu [a] được đặt ngay sau thuật ngữ cần chú thích.
