revisions:
- from: 'Nhưng ông đáp: “Không nên, vì khi nhổ cỏ lùng[a], các anh có thể nhổ bật rễ cả lúa mì cùng với nó.”'
  to: 'Nhưng ông đáp: “Không, kẻo khi gom cỏ dại[a], các anh lại nhổ bật cả lúa mì cùng với chúng.”'
  rationale: Bản sửa giữ lời đáp phủ định trực tiếp của Οὔ, diễn đạt μήποτε bằng “kẻo,” dịch συλλέγοντες là “gom” và dành “nhổ bật rễ” cho ἐκριζώσητε. “Cỏ dại” là lựa chọn hiện đại, không quá chuyên biệt; chú thích bảo lưu khả năng “cỏ lùng”/darnel mà không đồng nhất với một loài thực vật khác. Đại từ “chúng” giữ số nhiều của αὐτοῖς.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T02:47:30Z'
review_pass:
  verdict: revise
  source_fidelity: Bản nháp truyền đạt đúng mạch cảnh báo và hình ảnh nhổ bật rễ lúa mì. Tuy nhiên, συλλέγοντες có nghĩa chính là “gom/thu gom,” không phải “nhổ”; bản nháp dùng “nhổ” cho cả động từ này và ἐκριζώσητε, làm lu mờ sự phân biệt trong câu Hy Lạp. “Không nên” diễn giải lời đáp Οὔ; “Không” giữ sát hơn lời phủ định trực tiếp, còn mệnh lệnh ngầm đã rõ từ ngữ cảnh.
  naturalness: 'Câu sửa vẫn tự nhiên trong tiếng Việt hiện đại: “kẻo khi gom cỏ dại” nêu hành động đang thực hiện, và “lại nhổ bật cả lúa mì cùng với chúng” diễn đạt hậu quả đáng ngại. “Chúng” phù hợp hơn “nó” vì αὐτοῖς quy chiếu số nhiều đến cỏ dại.'
  terminology: 'Dùng “cỏ dại” ở văn bản chính là cách phổ thông, rõ nghĩa cho ζιζάνια. Không nên đồng nhất “cỏ lồng vực” với darnel: đó là một tên thực vật khác và không phù hợp với ghi chú tiếng Anh. Chú thích nên giữ tính dè dặt của việc định danh: có thể là “cỏ lùng”/darnel, một loài cỏ dại có thể giống lúa mì khi còn non.'
  issues:
