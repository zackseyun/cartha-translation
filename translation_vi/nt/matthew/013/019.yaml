revisions:
- from: Khi một người nghe lời về vương quốc mà không hiểu, kẻ ác đến cướp lấy điều đã được gieo trong lòng người ấy. Đây là người được gieo bên vệ đường.[a]
  to: Khi một người nghe lời của vương quốc mà không hiểu, kẻ ác[a] đến cướp mất điều đã được gieo trong lòng người ấy. Đó là người được gieo bên đường.[b]
  rationale: 'Bản sửa ưu tiên giữ cấu trúc và tính mơ hồ hợp lý của tiếng Hy Lạp: «lời của vương quốc» giữ sở hữu cách, còn cách hiểu nội dung không bị loại trừ; «kẻ ác» không định danh tác nhân vượt quá bản văn; và «người được gieo bên đường» duy trì phép hoán dụ khác thường của câu. Các chú thích được tách và neo ngay tại hai biểu thức có phương án dịch đáng kể.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T02:47:28Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản thảo phản ánh đúng cấu trúc chung của câu: người nghe không hiểu, một tác nhân xấu xa đến lấy đi điều đã gieo trong lòng, rồi lời giải thích bằng phép hoán dụ ở cuối câu. Tuy nhiên, «lời của vương quốc» bảo tồn trực tiếp sở hữu cách τῆς βασιλείας hơn «lời về vương quốc»; cách sau vẫn có thể được nêu là một lựa chọn trong chú thích. «Cướp mất» diễn đạt tự nhiên hơn hành động ἁρπάζει là giật/cướp đi. Câu cuối cần giữ «người được gieo», vì phân từ giống đực số ít quy chiếu người nghe theo phép hoán dụ của nguyên văn.'
  naturalness: «Khi một người nghe … mà không hiểu» và «trong lòng người ấy» là tiếng Việt hiện đại, rõ ràng. «Bên đường» tự nhiên hơn «bên vệ đường» và không làm thay đổi hình ảnh παρὰ τὴν ὁδόν. Viết hoa «Kẻ Ác» có thể tạo cảm giác đây là danh hiệu được định danh; viết thường «kẻ ác» duy trì tính cá vị của nguyên văn mà không định danh thêm tác nhân.
  terminology: 'Giữ «vương quốc» cho βασιλεία và «lòng» cho καρδία. «Kẻ ác» giữ cách hiểu tác nhân có ngôi vị của ὁ πονηρός nhưng không gọi đích danh là ma quỷ/Sa-tan. Hai chú thích được đặt đúng ngay sau các cụm có biến thể từ vựng: «kẻ ác» và «bên đường».'
  issues:
  - severity: medium
    issue: Cụm «lời về vương quốc» chọn một sắc thái diễn giải của τῆς βασιλείας trong thân văn.
    rationale: Sở hữu cách có thể diễn tả nội dung, nhưng «lời của vương quốc» sát cấu trúc nguồn hơn và vẫn tự nhiên; «lời về vương quốc» thích hợp làm phương án chú thích.
  - severity: low
    issue: «Bên vệ đường» hẹp nghĩa hơn παρὰ τὴν ὁδόν.
    rationale: Nguyên văn nói cạnh/bên con đường hoặc lối đi, không nhất thiết là phần lề đường; «bên đường» bao quát và tự nhiên hơn.
  - severity: medium
    issue: Bản thảo chỉ có chú thích về cụm cuối, trong khi lựa chọn «kẻ ác» cũng cần chú thích biến thể; cần bảo đảm các dấu chú thích neo đúng cụm từ liên hệ.
    rationale: Điều này phản ánh các lựa chọn từ vựng liên quan ὁ πονηρός và παρὰ τὴν ὁδόν, đồng thời tránh gán chú thích cho một vị trí không liên quan.
  revised_text: Khi một người nghe lời của vương quốc mà không hiểu, kẻ ác[a] đến cướp mất điều đã được gieo trong lòng người ấy. Đó là người được gieo bên đường.[b]
