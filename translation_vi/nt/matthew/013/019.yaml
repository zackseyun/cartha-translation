id: MAT.13.19
reference: Matthew 13:19
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: παντὸς ἀκούοντος τὸν λόγον τῆς βασιλείας καὶ μὴ συνιέντος, ἔρχεται ὁ πονηρὸς καὶ ἁρπάζει τὸ ἐσπαρμένον ἐν τῇ καρδίᾳ αὐτοῦ· οὗτός ἐστιν ὁ παρὰ τὴν ὁδὸν σπαρείς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/019.yaml
  text: When anyone hears the word of the kingdom and does not understand it[a], the evil one comes and snatches away what has been sown in his heart[b]. This is the one sown beside the road.
translation:
  language: vi
  text: Khi một người nghe lời của vương quốc mà không hiểu, kẻ ác[a] đến cướp mất điều đã được gieo trong lòng người ấy. Đó là người được gieo bên đường.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “kẻ gian ác.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “người được gieo dọc theo con đường” hoặc “người được gieo bên vệ đường.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: παντὸς ἀκούοντος
  choice: khi một người nghe
  rationale: Diễn đạt tự nhiên kết cấu phân từ sở hữu cách mang nghĩa khái quát; “một người” giữ số ít đại diện của nguyên văn.
- source_word: λόγον τῆς βασιλείας
  choice: lời về vương quốc
  rationale: “Lời” duy trì hình ảnh lời như hạt giống, còn “về vương quốc” diễn đạt rõ quan hệ nội dung có thể có của sở hữu cách.
- source_word: μὴ συνιέντος
  choice: mà không hiểu
  rationale: Diễn đạt trực tiếp ý không nắm được ý nghĩa; tân ngữ được hiểu từ “lời về vương quốc” nên không cần lặp lại.
- source_word: ὁ πονηρὸς
  choice: kẻ ác
  rationale: Mạo từ cùng ngữ cảnh cho thấy một tác nhân có ngôi vị; “kẻ ác” tự nhiên và không xác định danh tính vượt quá câu.
- source_word: ἁρπάζει
  choice: cướp lấy
  rationale: Giữ sắc thái lấy đi đột ngột và bằng sức mạnh của động từ Hy Lạp.
- source_word: τὸ ἐσπαρμένον
  choice: điều đã được gieo
  rationale: Giữ dạng phân từ hoàn thành bị động được danh từ hóa và liên hệ với hình ảnh gieo giống.
- source_word: ἐν τῇ καρδίᾳ αὐτοῦ
  choice: trong lòng người ấy
  rationale: “Lòng” là cách diễn đạt Kinh Thánh tự nhiên cho καρδία; “người ấy” phản ánh đại từ số ít mà không gây hiểu nhầm về giới tính sinh học.
- source_word: ὁ παρὰ τὴν ὁδὸν σπαρείς
  choice: người được gieo bên vệ đường
  rationale: Giữ phép hoán dụ gây chú ý của nguyên văn, trong đó người nghe được đồng nhất với điều được gieo; “bên vệ đường” phù hợp với παρὰ τὴν ὁδόν.
theological_decisions:
- issue: Căn tính của ὁ πονηρός
  choice: một tác nhân có ngôi vị (“kẻ ác”)
  alternative: sự ác như một sức mạnh trừu tượng
  rationale: Cách dùng có mạo từ và hành động “đến, cướp lấy” nghiêng về một tác nhân có ngôi vị, nhưng bản dịch không gọi đích danh tác nhân ấy.
- issue: Đối tượng trong câu cuối
  choice: giữ cách nói “người được gieo”
  alternative: diễn giải thành “hạt giống được gieo” hoặc “người giống như hạt gieo”
  rationale: Nguyên văn dùng phân từ giống đực số ít và đồng nhất người nghe với hình ảnh được gieo; giữ cách nói này bảo tồn sự căng thẳng trong ẩn dụ.
- issue: Quan hệ của τῆς βασιλείας
  choice: “lời về vương quốc”
  alternative: “lời của vương quốc”
  rationale: Sở hữu cách có thể mang hơn một sắc thái; trong ngữ cảnh, quan hệ nội dung là tự nhiên, nhưng chú thích giữ lại khả năng dịch sát cấu trúc.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “vương quốc” cho βασιλεία, “lòng” cho καρδία, đồng thời giữ nguyên phép hoán dụ khác thường ở mệnh đề cuối. Dấu chú thích [a] xuất hiện ngay sau cụm từ liên quan.
