  to: Những hạt khác rơi trên những chỗ đất đá[a], nơi không có nhiều đất; chúng lập tức mọc lên vì lớp đất ở đó không sâu.
  rationale: Bản sửa thay “nên” bằng cách nối câu trung tính hơn, để quan hệ nguyên nhân chỉ được biểu đạt bởi “vì”, tương ứng với διὰ τὸ. Đồng thời điều chỉnh nhẹ cụm “chỗ đất đá” và chú thích nhằm diễn đạt tự nhiên, chính xác hơn ý “rocky places” mà không thêm diễn giải vào thân văn.
