  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “đất đá” kèm chú thích để tránh khiến độc giả hình dung hạt chỉ rơi trên đá trơ trụi; dấu phẩy và liên từ được sắp xếp theo nhịp câu tiếng Việt.
