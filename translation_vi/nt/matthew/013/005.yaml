  text: ἄλλα δὲ ἔπεσεν ἐπὶ τὰ πετρώδη ὅπου οὐκ εἶχεν γῆν πολλήν, καὶ εὐθέως ἐξανέτειλεν διὰ τὸ μὴ ἔχειν βάθος γῆς,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/005.yaml
  text: Other seed fell on rocky ground[a], where it did not have much soil, and it sprang up at once because it had no depth of soil,
translation:
  language: vi
  text: Những hạt khác rơi trên những chỗ đất đá[a], nơi không có nhiều đất; chúng lập tức mọc lên vì lớp đất ở đó không sâu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sát nghĩa là “trên những chỗ đá/đất đá”; cụm từ này chỉ những nơi có lớp đất mỏng phủ trên nền đá bên dưới.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλα δὲ
  choice: Những hạt khác
  rationale: Tính từ trung tính số nhiều được dùng tỉnh lược, quy chiếu về hạt giống ở câu trước; thêm “hạt” để câu tiếng Việt rõ và tự nhiên.
- source_word: ἔπεσεν
  choice: rơi
  rationale: Giữ đúng động từ đơn giản “rơi” trong hình ảnh của dụ ngôn, không diễn giải thành “được gieo”.
- source_word: ἐπὶ τὰ πετρώδη
  choice: trên chỗ đất đá
  rationale: Diễn đạt tự nhiên các nơi có lớp đất mỏng phủ trên nền đá, đồng thời giữ sắc thái số nhiều của danh từ nguồn.
- source_word: ὅπου οὐκ εἶχεν γῆν πολλήν
  choice: nơi không có nhiều đất
  rationale: Cấu trúc vô chủ tự nhiên trong tiếng Việt thể hiện rõ rằng tại những chỗ ấy lượng đất rất ít.
- source_word: καὶ εὐθέως ἐξανέτειλεν
  choice: nên lập tức mọc lên
  rationale: “Lập tức” bảo toàn ý tức thời của εὐθέως; “mọc lên” phù hợp ngữ cảnh hạt nảy mầm. Liên từ “nên” làm rõ quan hệ kết quả vốn hiển nhiên trong mạch câu.
- source_word: διὰ τὸ μὴ ἔχειν βάθος γῆς
  choice: vì lớp đất không sâu
  rationale: Giữ quan hệ nguyên nhân do διά với động từ nguyên mẫu có mạo từ; cách nói này tự nhiên hơn lối dịch sát “không có độ sâu của đất” mà vẫn bảo toàn hình ảnh lớp đất nông.
