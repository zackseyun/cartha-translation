  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἄλλην παραβολὴν παρέθηκεν αὐτοῖς λέγων· Ὡμοιώθη ἡ βασιλεία τῶν οὐρανῶν ἀνθρώπῳ ⸀σπείραντι καλὸν σπέρμα ἐν τῷ ἀγρῷ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/024.yaml
  text: He set another parable before them[a], saying, “The kingdom of heaven is like a man who sowed good seed in his field.”
translation:
  language: vi
  text: 'Ngài trình bày cho họ một dụ ngôn khác, nói: “Nước Trời được ví như[a] một người đã gieo hạt giống tốt trong ruộng mình.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “giống như một người đã gieo hạt giống tốt trong ruộng mình.” Trong công thức mở đầu dụ ngôn của Ma-thi-ơ, động từ Hy Lạp ở thể bị động có thể được diễn đạt tự nhiên bằng “giống như.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄλλην παραβολὴν
  choice: một dụ ngôn khác
  rationale: Cụm này giới thiệu thêm một dụ ngôn trong chuỗi lời dạy; cách diễn đạt tự nhiên và giữ đúng trình tự tường thuật.
- source_word: παρέθηκεν αὐτοῖς
  choice: đưa ra cho họ
  rationale: παρατίθημι ở đây có nghĩa là đặt ra hoặc trình bày trước người nghe. “Đưa ra cho họ” giữ được phần nào hình ảnh cụ thể của động từ Hy Lạp mà vẫn tự nhiên trong tiếng Việt.
- source_word: λέγων
  choice: nói rằng
  rationale: Phân từ này nối mệnh đề dẫn nhập với lời trích dẫn; “nói rằng” rõ ràng và tự nhiên trong văn kể chuyện tiếng Việt.
- source_word: Ὡμοιώθη
  choice: được ví như
  rationale: Dạng aorist bị động của ὁμοιόω được phản ánh bằng “được ví như”; cách dịch này giữ sắc thái so sánh bị động mà không hàm ý rằng bản chất hay tình trạng của vương quốc đã biến đổi.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: Vương quốc thiên đàng
  rationale: Đây là cách diễn đạt đặc trưng của Ma-thi-ơ. “Thiên đàng” là cách nói tự nhiên trong tiếng Việt và οὐρανῶν không cần được dịch cứng thành số nhiều.
- source_word: ἀνθρώπῳ
  choice: một người
  rationale: Trong ngữ cảnh dụ ngôn, danh từ số ít chỉ một nhân vật nam; tiếng Việt có thể dùng tự nhiên “một người” mà không làm mất chức năng của nhân vật.
- source_word: σπείραντι
  choice: đã gieo
  rationale: Phân từ aorist bổ nghĩa cho ἀνθρώπῳ được chuyển thành mệnh đề quan hệ hàm ẩn; “đã gieo” làm rõ hành động đã thực hiện.
- source_word: καλὸν σπέρμα
  choice: giống tốt
  rationale: καλός ở đây nói đến phẩm chất tốt của hạt giống. “Giống tốt” là cách nói nông nghiệp tự nhiên và chuẩn bị cho sự tương phản với cỏ lùng ở phần sau.
- source_word: ἐν τῷ ἀγρῷ αὐτοῦ
  choice: trong ruộng mình
  rationale: ἀγρός là ruộng hoặc thửa ruộng; đại từ phản thân “mình” quy quyền sở hữu về người gieo giống một cách tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Cách dịch công thức về vương quốc trong Ma-thi-ơ
  choice: Vương quốc thiên đàng
  alternative: Vương quốc của các tầng trời
  rationale: “Vương quốc thiên đàng” giữ thuật ngữ thần học đặc trưng của Ma-thi-ơ và diễn đạt tự nhiên trong tiếng Việt, không biến dạng số nhiều Hy Lạp thành một quan niệm riêng về nhiều tầng trời.
- issue: Sắc thái của Ὡμοιώθη trong lời mở đầu dụ ngôn
  choice: được ví như
  alternative: giống như
  rationale: “Được ví như” phản ánh dạng bị động của động từ Hy Lạp và giữ đây là một phép so sánh trong dụ ngôn, không khẳng định rằng vương quốc đã trở thành một thực thể khác.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Ngài” duy trì sự kính trọng đối với Chúa Giê-su; “đưa ra cho họ” giữ hình ảnh của động từ nguồn, còn “được ví như” bảo toàn sắc thái ngữ pháp mà không quá nặng nề.
