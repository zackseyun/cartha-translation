  source_fidelity: 'Bản dịch truyền đạt đúng cấu trúc và nội dung chính: Đức Giê-su giới thiệu thêm một dụ ngôn, và Nước Trời được đặt trong quan hệ so sánh với một người đã gieo hạt giống tốt trong ruộng của mình. “Được ví như” phản ánh hợp lý thể bị động Ὡμοιώθη, dù công thức này cũng có thể được dịch tự nhiên là “giống như.”'
