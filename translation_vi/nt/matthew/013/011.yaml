id: MAT.13.11
reference: Matthew 13:11
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν ⸀αὐτοῖς· Ὅτι ὑμῖν δέδοται γνῶναι τὰ μυστήρια τῆς βασιλείας τῶν οὐρανῶν, ἐκείνοις δὲ οὐ δέδοται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/011.yaml
  text: He answered them[a], “To you it has been given to know the mysteries of the kingdom of heaven[b], but to them it has not been given.”
translation:
  language: vi
  text: 'Ngài trả lời họ: “Vì anh em đã được ban[a] cho biết những điều mầu nhiệm[b] của Nước Trời, còn họ thì không được ban cho.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Thể bị động “đã được ban” không nêu rõ người ban; trong ngữ cảnh, sự hiểu biết này được hiểu là do Đức Chúa Trời ban.
    reason: theological_clarification
  - marker: b
    text: Cũng có thể dịch là “những bí mật”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν αὐτοῖς
  choice: Ngài đáp họ
  rationale: Cụm phân từ và động từ hữu hạn là một lối diễn đạt Hy Lạp chịu ảnh hưởng Sê-mít, có nghĩa tự nhiên là “đáp”; không cần dịch lặp thành “đáp và nói”.
- source_word: ὑμῖν δέδοται γνῶναι
  choice: Anh em đã được ban cho sự hiểu biết
  rationale: Cách dịch này giữ thể bị động và sắc thái kết quả hiện tại của thì hoàn thành, đồng thời diễn đạt tự nhiên trong tiếng Việt ý “được ban cho để biết”.
- source_word: τὰ μυστήρια
  choice: những điều mầu nhiệm
  rationale: “Những điều mầu nhiệm” chỉ các thực tại thiêng liêng từng bị che giấu nhưng nay được bày tỏ; từ này giữ được chiều kích mặc khải hơn “bí mật”.
- source_word: τῆς βασιλείας τῶν οὐρανῶν
  choice: của vương quốc thiên đàng
  rationale: Đây là cách diễn đạt tự nhiên, trang trọng và quen thuộc cho thành ngữ đặc trưng của Ma-thi-ơ, đồng thời giữ ý về quyền trị vì của trời.
- source_word: ἐκείνοις δὲ οὐ δέδοται
  choice: còn họ thì không được ban cho
  rationale: “Còn họ thì” thể hiện rõ sự tương phản với “anh em”, và việc lặp lại “được ban cho” giữ thế đối xứng của nguyên văn.
theological_decisions:
- issue: Tác nhân hàm ẩn trong thể bị động δέδοται
  choice: Giữ thể bị động “đã được ban” mà không nêu đích danh Đức Chúa Trời
  alternative: “Đức Chúa Trời đã ban cho anh em”
  rationale: Nguyên văn không nói rõ chủ thể ban cho. Dù tác nhân được ngầm hiểu là Đức Chúa Trời, việc giữ thể bị động tránh giải thích thay cho bản văn.
- issue: Ý nghĩa của μυστήρια trong bối cảnh vương quốc
  choice: Dịch là “những điều mầu nhiệm”
  alternative: “những bí mật” hoặc “những chân lý kín giấu”
  rationale: 'Lựa chọn này giữ phạm vi ý nghĩa của từ Hy Lạp: những thực tại của Đức Chúa Trời từng bị che giấu và được mặc khải, mà không thu hẹp thành một lối giải nghĩa riêng.'
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Anh em” phân biệt nhóm môn đồ với “họ”; “Ngài” duy trì lối xưng hô kính trọng dành cho Chúa Giê-su. Cấu trúc bị động và sự đối xứng giữa hai vế được giữ lại.
