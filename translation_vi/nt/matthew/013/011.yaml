revisions:
- from: 'Ngài đáp họ: “Anh em đã được ban[a] cho sự hiểu biết về những điều mầu nhiệm[b] của vương quốc thiên đàng, còn họ thì không được ban cho.”'
  to: 'Ngài trả lời họ: “Vì anh em đã được ban[a] cho biết những điều mầu nhiệm[b] của Nước Trời, còn họ thì không được ban cho.”'
  rationale: Bản sửa khôi phục Ὅτι bằng “Vì”, dịch γνῶναι trực tiếp là “biết”, cải thiện tính tự nhiên của động từ nói, và dùng “Nước Trời” cho thành ngữ Matthean. Thể bị động hoàn thành và sự đối xứng giữa hai vế vẫn được bảo toàn; không nêu Đức Chúa Trời trong thân văn.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T02:47:30Z'
review_pass:
  verdict: revise
  source_fidelity: Bản nháp giữ đúng thế bị động và thế tương phản của δέδοται / οὐ δέδοται, nhưng đã bỏ Ὅτι ở đầu lời đáp. Cụm “được ban cho sự hiểu biết” diễn giải γνῶναι (“biết”) thành một danh từ trừu tượng; “được ban cho biết” sát nguyên văn hơn. “Nước Trời” là cách tương đương tự nhiên và đã định hình trong tiếng Việt cho thành ngữ Matthean βασιλεία τῶν οὐρανῶν.
  naturalness: “Ngài đáp họ” và “vương quốc thiên đàng” kém tự nhiên trong văn phong Kinh Thánh tiếng Việt hiện đại. “Ngài trả lời họ” và “Nước Trời” rõ ràng, trang trọng, và quen thuộc hơn. Cấu trúc “Vì anh em đã được ban cho biết...” giữ được mạch giải thích của câu trả lời.
  terminology: Giữ “Ngài”, “anh em”, “những điều mầu nhiệm”, và thể bị động không nêu tác nhân. “Nước Trời” tránh sắc thái địa điểm hậu thế thường gợi bởi “thiên đàng”, đồng thời phản ánh đúng thành ngữ đặc trưng của Ma-thi-ơ. Chú thích về tác nhân hàm ẩn được diễn đạt như một nhận định ngữ cảnh, không biến nó thành chủ ngữ của bản văn.
  issues:
  - severity: medium
    issue: Bỏ sót Ὅτι
    rationale: Ὅτι mở đầu lời đáp và trong ngữ cảnh này nêu lý do/giải thích; cần được phản ánh bằng “Vì”.
  - severity: medium
    issue: “sự hiểu biết” thay cho động từ γνῶναι
    rationale: Nguyên văn nói rằng các môn đồ được ban cho “biết” các mầu nhiệm. Cách danh từ hóa thêm một khái niệm không cần thiết và làm giảm độ sát nghĩa.
  - severity: low
    issue: “vương quốc thiên đàng” không phải lựa chọn tự nhiên nhất
    rationale: “Nước Trời” là thành ngữ tiếng Việt Kinh Thánh tự nhiên cho βασιλεία τῶν οὐρανῶν; “thiên đàng” dễ gợi nơi chốn hơn là vương quyền/nước cai trị.
  - severity: low
    issue: “Ngài đáp họ” hơi gượng trong tiếng Việt hiện đại
    rationale: “Ngài trả lời họ” diễn đạt tự nhiên hơn mà vẫn giữ αὐτοῖς.
