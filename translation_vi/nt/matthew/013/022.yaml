    text: 'Cũng có thể dịch: “những nỗi lo của thế gian này.” Tiếng Hy Lạp sát nghĩa hơn là “nỗi lo lắng của đời này.”'
    reason: alternative_reading
  - marker: b
    text: 'Cũng có thể dịch: “sự lừa dối của sự giàu có.”'
    reason: lexical_alternative
  revision_rationale: 'Chỉ điều chỉnh các chỗ cần thiết cho tính tự nhiên và lực nghĩa của tiếng Việt: thay “làm lời ấy nghẹt đi” bằng “bóp nghẹt lời ấy”, và dùng thành ngữ “không sinh hoa kết quả”. Không thay đổi chủ thể cá nhân, hình ảnh gieo trong gai, ý nghĩa của αἰών, hay các neo chú thích.'
