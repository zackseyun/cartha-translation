id: MAT.13.22
reference: Matthew 13:22
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὁ δὲ εἰς τὰς ἀκάνθας σπαρείς, οὗτός ἐστιν ὁ τὸν λόγον ἀκούων, καὶ ἡ μέριμνα τοῦ αἰῶνος ⸀τούτου καὶ ἡ ἀπάτη τοῦ πλούτου συμπνίγει τὸν λόγον, καὶ ἄκαρπος γίνεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/022.yaml
  text: And the one sown among the thorns—this is the one who hears the word[a], but the चिंता of this age and the deceitfulness of wealth choke the word[b], and he becomes unfruitful.
translation:
  language: vi
  text: Còn người được gieo giữa những bụi gai là người nghe lời, nhưng nỗi lo lắng của đời này[a] và sự lừa dối của của cải[b] bóp nghẹt lời ấy, và người ấy trở nên không sinh hoa kết quả.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “những nỗi lo của thế gian này.” Tiếng Hy Lạp sát nghĩa hơn là “nỗi lo lắng của đời này.”'
    reason: alternative_reading
  - marker: b
    text: 'Cũng có thể dịch: “sự lừa dối của sự giàu có.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ εἰς τὰς ἀκάνθας σπαρείς
  choice: Còn người được gieo giữa những bụi gai
  rationale: Giữ chủ thể mang tính cá nhân của phân từ giống đực có mạo từ, đồng thời bảo tồn hình ảnh gieo hạt và cách nói tự nhiên của tiếng Việt với nghĩa ‘ở giữa’.
- source_word: ὁ τὸν λόγον ἀκούων
  choice: là người nghe lời
  rationale: Chuyển phân từ hiện tại thành mệnh đề quan hệ tự nhiên trong tiếng Việt; ‘lời’ diễn đạt λόγος như sứ điệp được công bố trong ngữ cảnh dụ ngôn.
- source_word: ἡ μέριμνα τοῦ αἰῶνος τούτου
  choice: nỗi lo lắng của đời này
  rationale: ‘Nỗi lo lắng’ thể hiện sắc thái tiêu cực của μέριμνα; ‘đời này’ giữ ý nghĩa thời đại/đời hiện tại của αἰών mà không biến nó thành thế giới vật chất.
- source_word: ἡ ἀπάτη τοῦ πλούτου
  choice: sự lừa dối của của cải
  rationale: Diễn đạt đặc tính đánh lừa của sự giàu có; ‘của cải’ là cách nói hiện đại, tự nhiên cho πλοῦτος.
- source_word: συμπνίγει τὸν λόγον
  choice: làm lời ấy nghẹt đi
  rationale: Giữ hình ảnh cây bị gai làm nghẹt, đồng thời dùng cấu trúc gây khiến tự nhiên trong tiếng Việt.
- source_word: ἄκαρπος γίνεται
  choice: người ấy trở nên không sinh quả
  rationale: Giữ sự chuyển hướng sang người nghe trong phần giải thích dụ ngôn và bảo tồn hình ảnh sinh quả, thay vì hàm ý bản thân lời trở nên vô hiệu.
theological_decisions:
- issue: Cách dịch αἰών
  choice: đời này
  alternative: thế gian này
  rationale: αἰών chủ yếu chỉ một thời đại hay đời hiện tại; ‘đời này’ giữ được chiều kích thời gian và đạo đức, còn cách dịch quen thuộc ‘thế gian này’ được ghi ở chú thích.
- issue: Chủ thể mang tính cá nhân hay phi cá nhân ở cuối câu
  choice: người ấy trở nên không sinh quả
  alternative: nó trở nên không sinh quả / lời ấy không sinh quả
  rationale: Lời giải thích xác định đối tượng là ‘người nghe lời’; cách dịch mang tính cá nhân tránh gợi ý rằng chính lời vốn không có khả năng sinh quả.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Câu dịch giữ hình ảnh gieo hạt, làm nghẹt và sinh quả; đồng thời duy trì sự chuyển đổi có chủ ý giữa hình ảnh hạt giống và người nghe.
