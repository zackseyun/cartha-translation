revisions:
- from: Vương quốc thiên đàng giống như kho báu được giấu trong một thửa ruộng[a]. Một người tìm thấy thì giấu nó lại; vì vui mừng, người ấy đi bán tất cả những gì mình có rồi mua thửa ruộng đó.[b]
  to: Nước Trời giống như một kho báu được giấu trong một thửa ruộng[a]. Một người tìm được kho báu ấy rồi giấu đi; vì vui mừng, người ấy đi bán tất cả những gì mình có và mua thửa ruộng ấy.[b]
  rationale: 'Bản sửa loại bỏ nghĩa thêm của “lại”, dùng thuật ngữ Việt ngữ tự nhiên hơn cho công thức Ma-thi-ơ, và điều chỉnh cả hai chú thích để chúng phản ánh đúng các lựa chọn diễn đạt có căn cứ từ bản Hy Lạp và audit trail tiếng Anh. Trình tự: tìm thấy, giấu, vì vui mừng đi bán tất cả và mua thửa ruộng vẫn được giữ nguyên.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T02:47:52Z'
review_pass:
  verdict: revise
  source_fidelity: Bản dịch giữ đúng cấu trúc so sánh, kho báu bị giấu, việc bán tất cả và mua chính thửa ruộng ấy. Tuy nhiên, “giấu nó lại” thường hàm ý giấu trở lại/lần nữa, một sắc thái không có trong ἔκρυψεν. “Nước Trời” là tương đương Việt ngữ tự nhiên và ổn định hơn cho ἡ βασιλεία τῶν οὐρανῶν; “thiên đàng” trong tiếng Việt hiện đại thường gợi nơi phúc lạc hơn là lối nói vòng của Ma-thi-ơ về quyền trị của Đức Chúa Trời.
  naturalness: Bản sửa dùng văn phong hiện đại, trang trọng vừa phải. “Một người tìm được kho báu ấy rồi giấu đi” rõ quan hệ với đại từ quan hệ Hy Lạp và tránh sắc thái lặp lại của “lại”.
  terminology: Đổi “Vương quốc thiên đàng” thành “Nước Trời” vì đây là thuật ngữ Kinh Thánh Việt ngữ tự nhiên cho cụm Ma-thi-ơ, đồng thời không thu hẹp βασιλεία chỉ thành lãnh thổ. Giữ “kho báu”, “thửa ruộng”, và “tất cả những gì mình có” phù hợp ngữ cảnh và cấp độ văn phong.
  issues:
  - severity: medium
    issue: “giấu nó lại” thêm sắc thái ‘giấu trở lại’ hoặc lặp lại hành động.
