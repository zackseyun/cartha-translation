id: MAT.13.44
reference: Matthew 13:44
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸀Ὁμοία ἐστὶν ἡ βασιλεία τῶν οὐρανῶν θησαυρῷ κεκρυμμένῳ ἐν τῷ ἀγρῷ, ὃν εὑρὼν ἄνθρωπος ἔκρυψεν, καὶ ἀπὸ τῆς χαρᾶς αὐτοῦ ὑπάγει καὶ ⸂πωλεῖ πάντα ὅσα ἔχει⸃ καὶ ἀγοράζει τὸν ἀγρὸν ἐκεῖνον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/044.yaml
  text: The kingdom of heaven is like a treasure hidden in a field[a], which a man found and hid[b]; and in his joy he goes and sells all that he has and buys that field.
translation:
  language: vi
  text: Nước Trời giống như một kho báu được giấu trong một thửa ruộng[a]. Một người tìm được kho báu ấy rồi giấu đi; vì vui mừng, người ấy đi bán tất cả những gì mình có và mua thửa ruộng ấy.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Nước Trời giống như kho báu được giấu trong một thửa ruộng.”'
    reason: Danh từ θησαυρῷ không có mạo từ; tiếng Việt có thể diễn đạt như một kho báu cụ thể hoặc dùng danh từ trần “kho báu” trong phép so sánh.
  - marker: b
    text: 'Cũng có thể dịch: “Một người tìm được kho báu ấy rồi giấu đi; vì niềm vui của mình, người ấy đi bán mọi thứ mình có và mua thửa ruộng ấy.”'
    reason: Cụm ἀπὸ τῆς χαρᾶς αὐτοῦ diễn tả niềm vui là động lực cho các hành động tiếp theo; tiếng Việt có thể diễn đạt bằng “vì vui mừng” hoặc “vì niềm vui của mình”.
lexical_decisions:
- source_word: Ὁμοία ἐστὶν ἡ βασιλεία τῶν οὐρανῶν
  choice: Vương quốc thiên đàng giống như
  rationale: Giữ công thức so sánh của dụ ngôn và cách nói đặc trưng trong Ma-thi-ơ; “vương quốc” vừa tự nhiên vừa không loại bỏ sắc thái quyền trị của βασιλεία.
- source_word: θησαυρῷ κεκρυμμένῳ ἐν τῷ ἀγρῷ
  choice: kho báu được giấu trong một thửa ruộng
  rationale: Phân từ hoàn thành bị động diễn tả kho báu đang ở trong tình trạng bị giấu. “Một thửa ruộng” tự nhiên trong tiếng Việt khi mới được đưa vào câu chuyện.
- source_word: ὃν εὑρὼν ἄνθρωπος ἔκρυψεν
  choice: Một người tìm thấy thì giấu nó lại
  rationale: Diễn đạt rõ đối tượng ngầm của ἔκρυψεν và giữ trình tự hành động. ἄνθρωπος ở đây chỉ một nhân vật đại diện; tiếng Việt “một người” tự nhiên và không làm mất thông tin giới tính ngữ pháp vốn không được đánh dấu bắt buộc như trong tiếng Anh.
- source_word: ἀπὸ τῆς χαρᾶς αὐτοῦ
  choice: vì vui mừng
  rationale: 'Thể hiện rõ lực nguyên nhân của giới từ ἀπό trong ngữ cảnh: niềm vui thúc đẩy hành động tiếp theo.'
- source_word: πωλεῖ πάντα ὅσα ἔχει
  choice: bán tất cả những gì mình có
  rationale: Giữ trọn tính bao quát của πάντα ὅσα ἔχει bằng một cách nói tự nhiên, trang trọng vừa phải trong tiếng Việt.
- source_word: ἀγοράζει τὸν ἀγρὸν ἐκεῖνον
  choice: mua thửa ruộng đó
  rationale: “Đó” phản ánh đại từ chỉ định ἐκεῖνον và nhấn mạnh chính thửa ruộng chứa kho báu.
theological_decisions:
- issue: Cách dịch βασιλεία τῶν οὐρανῶν
  choice: Vương quốc thiên đàng
  alternative: Quyền trị của trời
  rationale: “Vương quốc thiên đàng” giữ cách diễn đạt đặc trưng của Ma-thi-ơ và để ngỏ cả khía cạnh lãnh vực lẫn quyền cai trị, thay vì thu hẹp nghĩa vào một khía cạnh.
- issue: Chủ thể ἄνθρωπος
  choice: một người
  alternative: một người đàn ông
  rationale: Trong tiếng Hy Lạp, ἄνθρωπος có thể chỉ con người nói chung dù hình thức là giống đực; ngữ cảnh không cần nhấn mạnh giới tính. “Một người” là cách kể dụ ngôn tự nhiên và không áp đặt thêm ý nghĩa thần học.
- issue: Quan hệ của ἀπὸ τῆς χαρᾶς αὐτοῦ với mệnh đề
  choice: vì vui mừng, người ấy đi bán...
  alternative: người ấy giấu nó lại vì vui mừng rồi đi bán...
  rationale: Trật tự và cú pháp Hy Lạp tự nhiên nhất nối cụm này với ὑπάγει καὶ πωλεῖ, nhưng vị trí có thể tạo chút khả năng liên hệ với hành động trước; bản chính theo cách hiểu phổ biến mà không phát triển thêm hàm ý thần học.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và dễ hiểu. Dùng “thửa ruộng” thay cho “cánh đồng” để phù hợp với hành động mua một mảnh đất cụ thể; dùng “người ấy” nhằm tránh lặp nặng và giữ mạch kể tự nhiên.
