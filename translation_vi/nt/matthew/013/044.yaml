  - severity: low
    issue: “Vương quốc thiên đàng” kém tự nhiên và có thể khiến “thiên đàng” được hiểu là cõi phúc lạc.
    rationale: Trong tiếng Việt hiện đại, “Nước Trời” là cách chuyển ngữ quen thuộc và chính xác hơn cho công thức đặc thù βασιλεία τῶν οὐρανῶν của Ma-thi-ơ.
  - severity: low
    issue: Chú thích b hiện chỉ nêu một cách ngắt câu, chưa phản ánh rõ lựa chọn từ vựng về lực nguyên nhân của ἀπό.
    rationale: Sửa chú thích để nêu trực tiếp cách diễn đạt thay thế “vì niềm vui của mình”, giữ nguyên sự mơ hồ nhẹ về sắc thái ‘trong/vì’ mà không thay đổi nội dung.
