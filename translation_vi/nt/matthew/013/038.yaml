  source_fidelity: 'Bản dịch chuyển đạt chính xác ba phép đồng nhất song song của câu Hy Lạp: ruộng là κόσμος, hạt giống tốt là υἱοὶ τῆς βασιλείας, và cỏ lùng là υἱοὶ τοῦ πονηροῦ. “Cỏ lùng” phù hợp với ζιζάνια trong ngữ cảnh dụ ngôn. “Kẻ Ác” phản ánh hợp lý cách hiểu có ngôi vị của τοῦ πονηροῦ mà không thêm tên riêng. Cách diễn đạt “những người thuộc về” giải nghĩa thành ngữ υἱοὶ một cách trung thành; chú thích giữ lại cách nói nguyên văn.'
  naturalness: Tiếng Việt hiện đại, rõ ràng và trang trọng. Các mệnh đề phân song song bằng dấu chấm phẩy tạo nhịp tự nhiên cho phần giải thích dụ ngôn. “Ruộng,” “thế gian,” “hạt giống tốt,” và “cỏ lùng” đều là những lựa chọn quen thuộc, phù hợp ngữ cảnh.
  terminology: “Vương quốc” nhất quán với βασιλεία và giữ được trường nghĩa vương quyền. Viết hoa “Kẻ Ác” nhất quán với cách hiểu nhân vị đã được chú thích, song không đồng nhất hóa nhân vật này với một tên gọi không có trong câu. Các chú thích được đặt đúng sau đơn vị cần giải thích.
