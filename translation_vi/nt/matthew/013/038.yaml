id: MAT.13.38
reference: Matthew 13:38
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὁ δὲ ἀγρός ἐστιν ὁ κόσμος· τὸ δὲ καλὸν σπέρμα, οὗτοί εἰσιν οἱ υἱοὶ τῆς βασιλείας· τὰ δὲ ζιζάνιά εἰσιν οἱ υἱοὶ τοῦ πονηροῦ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/038.yaml
  text: The field is the world[a], and the good seed—these are the sons of the kingdom. And the weeds are the sons of the evil one[c][b],
translation:
  language: vi
  text: Ruộng là thế gian; hạt giống tốt là những người thuộc về vương quốc[a]; còn cỏ lùng là những người thuộc về Kẻ Ác[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “các con trai của vương quốc”, một thành ngữ chỉ những người thuộc về vương quốc.'
    reason: cultural_note
  - marker: b
    text: “Kẻ Ác” cũng có thể dịch là “kẻ gian ác”; ngữ pháp ở đây thiên về một tác nhân có ngôi vị hơn là “sự ác” trừu tượng.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγρός
  choice: ruộng
  rationale: Giữ nguyên hình ảnh nông nghiệp của dụ ngôn; “ruộng” tự nhiên và rõ nghĩa trong tiếng Việt.
- source_word: κόσμος
  choice: thế gian
  rationale: Diễn đạt phạm vi rộng của κόσμος trong lời giải thích dụ ngôn và phù hợp văn phong Kinh Thánh hiện đại.
- source_word: καλὸν σπέρμα
  choice: hạt giống tốt
  rationale: Giữ hình ảnh gieo giống và sự đối lập trực tiếp với cỏ lùng.
- source_word: υἱοὶ τῆς βασιλείας
  choice: những người thuộc về vương quốc
  rationale: Thành ngữ “các con trai của” ở đây chỉ những người có quan hệ thuộc về; cách dịch này truyền đạt đúng chức năng đại diện, bao gồm cả nam lẫn nữ, mà không biến họ thành con cái của một lãnh thổ theo nghĩa đen.
- source_word: βασιλεία
  choice: vương quốc
  rationale: Giữ danh từ chỉ lĩnh vực cai trị trong ngôn ngữ nhất quán, dễ hiểu về vương quyền.
- source_word: ζιζάνια
  choice: cỏ lùng
  rationale: Đây là cách gọi quen thuộc trong tiếng Việt đối với loại cỏ dại giống lúa được nói đến trong dụ ngôn; cụ thể hơn từ chung “cỏ dại”.
- source_word: τοῦ πονηροῦ
  choice: Kẻ Ác
  rationale: Mạo từ cùng dạng giống đực số ít ủng hộ cách hiểu đây là một tác nhân có ngôi vị, không chỉ là sự ác trừu tượng.
theological_decisions:
- issue: τοῦ πονηροῦ chỉ sự ác hay một tác nhân có ngôi vị
  choice: Kẻ Ác
  alternative: sự ác; kẻ gian ác
  rationale: Cấu trúc Hy Lạp có mạo từ và giống đực số ít, trong ngữ cảnh đối lập các nhóm người, tự nhiên nhất là chỉ một nhân vật có ngôi vị; bản dịch không đồng nhất rõ hơn với một danh xưng mà câu này không nêu.
- issue: Cách chuyển υἱοὶ trong thành ngữ quan hệ
  choice: những người thuộc về
  alternative: các con trai; con cái
  rationale: Trong ngữ cảnh này, υἱοὶ biểu thị quan hệ và đặc tính thuộc về hai phía đối nghịch. Tiếng Việt tự nhiên dùng “những người thuộc về”, vừa giữ ý nghĩa vừa tránh khiến độc giả hiểu sai là chỉ nam giới hoặc quan hệ sinh học.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng các mệnh đề song song với dấu chấm phẩy để phản ánh nhịp giải thích của câu Hy Lạp. Viết hoa “Kẻ Ác” để báo hiệu cách hiểu có ngôi vị, nhưng không thêm tên riêng mà nguyên văn không nêu.
