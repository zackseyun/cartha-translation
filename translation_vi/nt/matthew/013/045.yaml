reference: Matthew 13:45
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Πάλιν ὁμοία ἐστὶν ἡ βασιλεία τῶν οὐρανῶν ⸀ἀνθρώπῳ ἐμπόρῳ ζητοῦντι καλοὺς μαργαρίτας·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/045.yaml
  text: Again[a], the kingdom of heaven is like a merchant seeking fine pearls.
translation:
  language: vi
  text: Lại nữa, Nước Trời giống như một thương gia[a] đang tìm những viên ngọc trai đẹp.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát hơn: “giống như một người, một thương gia, đang tìm những viên ngọc trai đẹp.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πάλιν
  choice: Lại nữa
  rationale: Mở đầu một phép so sánh khác trong chuỗi dụ ngôn; cách nói này giữ được mạch tiếp nối mà vẫn tự nhiên, trang trọng trong tiếng Việt.
- source_word: ὁμοία ἐστὶν
  choice: giống như
  rationale: Cách diễn đạt thông dụng, rõ ràng cho công thức so sánh trong dụ ngôn.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: vương quốc thiên đàng
  rationale: Giữ cách nói đặc trưng của Ma-thi-ơ và diễn đạt βασιλεία theo nghĩa quyền trị vì/vương quốc mà không đồng nhất đơn giản với một địa điểm.
- source_word: ἀνθρώπῳ ἐμπόρῳ
  choice: một thương gia
  rationale: ἔμπορος xác định người ấy là người buôn bán; tiếng Việt không cần lặp lại danh từ chung ἄνθρωπος để câu tự nhiên. Chú thích bảo lưu cấu trúc sát chữ.
- source_word: ζητοῦντι
  choice: đang tìm
  rationale: Diễn đạt tự nhiên sắc thái hoạt động đang diễn tiến của phân từ hiện tại.
- source_word: καλοὺς μαργαρίτας
  choice: những viên ngọc trai đẹp
  rationale: καλός ở đây chỉ phẩm chất tốt/đẹp; lựa chọn này không tự ý thu hẹp nghĩa thành giá trị tiền bạc, đồng thời vẫn dễ hiểu trong bối cảnh thương mại.
theological_decisions:
- issue: Phạm vi của phép so sánh trong công thức dụ ngôn
  choice: Câu dịch trực tiếp ví vương quốc thiên đàng với người thương gia.
  alternative: Hiểu vương quốc thiên đàng giống như toàn bộ tình huống một thương gia đi tìm ngọc trai đẹp.
  rationale: Cấu trúc Hy Lạp ὁμοία ἐστὶν ... ἀνθρώπῳ ἐμπόρῳ đặt người thương gia làm đối tượng so sánh trực tiếp, nhưng câu dịch không giải thích quá mức ý nghĩa thần học của phép ví; tình huống rộng hơn tiếp tục được triển khai ở câu sau.
translation_notes:
  register: Tiếng Việt hiện đại, sáng rõ và trang trọng vừa phải. “Lại nữa” giữ mạch văn của chuỗi dụ ngôn; “thương gia” dễ hiểu và phù hợp bối cảnh. Dấu chú thích [a] được đặt ngay sau cụm từ mà chú thích làm rõ.
