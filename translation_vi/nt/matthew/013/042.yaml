source:
  edition: SBLGNT
  text: καὶ βαλοῦσιν αὐτοὺς εἰς τὴν κάμινον τοῦ πυρός· ἐκεῖ ἔσται ὁ κλαυθμὸς καὶ ὁ βρυγμὸς τῶν ὀδόντων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/042.yaml
  text: and they will throw them into the furnace of fire[b][a]. There will be weeping and gnashing of teeth there.
translation:
  language: vi
  text: Và họ sẽ ném những kẻ ấy vào lò lửa. Ở đó sẽ có khóc lóc và nghiến răng.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: Rồi
  rationale: Diễn đạt tự nhiên sự tiếp nối với hành động ở câu trước mà vẫn giữ liên từ đầu câu.
- source_word: βαλοῦσιν
  choice: sẽ ném
  rationale: Động từ ở thì tương lai chủ động, mang sắc thái quăng hoặc ném mạnh; “ném” là cách diễn đạt hiện đại và trực tiếp.
- source_word: αὐτοὺς
  choice: những kẻ ấy
  rationale: Đại từ số nhiều chỉ nhóm người đã được nhắc đến; cách diễn đạt này tránh sự nhập nhằng giữa chủ thể “họ” và đối tượng bị ném.
- source_word: κάμινον τοῦ πυρός
  choice: lò lửa
  rationale: Cách nói tự nhiên trong tiếng Việt, giữ nguyên hình ảnh cụ thể của một lò có lửa mà không diễn giải thành thuật ngữ giáo lý.
- source_word: ἐκεῖ
  choice: Ở đó
  rationale: Giữ rõ nghĩa chỉ nơi chốn, quy chiếu trực tiếp về lò lửa vừa được nhắc đến.
- source_word: κλαυθμὸς
  choice: tiếng khóc lóc
  rationale: Danh từ chỉ sự khóc than; thêm “tiếng” giúp cụm danh từ tự nhiên khi đi cùng “nghiến răng” trong tiếng Việt.
- source_word: βρυγμὸς τῶν ὀδόντων
  choice: nghiến răng
  rationale: Thành ngữ tiếng Việt chính xác và quen thuộc, không thu hẹp ý nghĩa chỉ còn đau buồn hay giận dữ.
theological_decisions:
- issue: Hình ảnh phán xét trong cụm κάμινον τοῦ πυρός
  choice: Giữ hình ảnh cụ thể là “lò lửa”.
  alternative: Diễn giải thành “lửa địa ngục” hoặc tăng cường thành “lò lửa cháy phừng phừng”.
  rationale: Nguyên văn dùng một ẩn dụ cụ thể về sự phán xét; bản dịch không đồng nhất nó với thuật ngữ giáo lý về sau và cũng không làm nhẹ mức độ nghiêm trọng.
- issue: Ý nghĩa của “khóc lóc và nghiến răng”
  choice: Giữ nguyên công thức diễn tả nỗi thống khổ trong sự phán xét.
  alternative: Giải thích “nghiến răng” chỉ là giận dữ hoặc toàn bộ cụm từ chỉ là đau buồn.
  rationale: Cụm từ có thể bao hàm đau khổ, tiếc nuối hoặc phẫn uất; bản dịch bảo tồn độ mở ấy thay vì quyết định thay cho nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu thứ hai đưa “Ở đó” lên đầu để giữ rõ lực chỉ nơi chốn của ἐκεῖ và tạo nhịp tự nhiên trong tiếng Việt.
