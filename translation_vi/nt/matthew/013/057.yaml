id: MAT.13.57
reference: Matthew 13:57
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἐσκανδαλίζοντο ἐν αὐτῷ. ὁ δὲ Ἰησοῦς εἶπεν αὐτοῖς· Οὐκ ἔστιν προφήτης ἄτιμος εἰ μὴ ἐν τῇ ⸀πατρίδι καὶ ἐν τῇ οἰκίᾳ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/057.yaml
  text: And they took offense at him[a]. But Jesus said to them[c][b], “A prophet is not without honor except in his hometown and in his own household.”
translation:
  language: vi
  text: 'Họ lấy làm phật ý về Ngài[a]. Nhưng Đức Giê-su nói với họ: “Nhà tiên tri không bị coi thường, ngoại trừ tại quê quán mình[b] và trong chính nhà mình[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Họ bị xúc phạm vì Ngài” hoặc “Họ vấp ngã vì Ngài”; sát nghĩa: “Họ bị làm cho vấp ngã nơi Ngài.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “quê hương,” “nơi sinh quán,” hoặc “bản quán.”'
    reason: lexical_alternative
  - marker: c
    text: 'Từ Hy Lạp có thể chỉ ngôi nhà hoặc những người trong gia đình; cũng có thể dịch: “trong chính gia đình mình.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσκανδαλίζοντο ἐν αὐτῷ
  choice: họ vấp phạm vì Ngài
  rationale: Giữ lại hình ảnh ‘vấp ngã’ của động từ Hy Lạp, đồng thời diễn đạt phản ứng chống đối và không chấp nhận Đức Giê-su trong ngữ cảnh; chú thích nêu cách hiểu ít ẩn dụ hơn.
- source_word: ὁ δὲ Ἰησοῦς εἶπεν αὐτοῖς
  choice: Nhưng Đức Giê-su nói với họ
  rationale: ‘Nhưng’ thể hiện sự chuyển ý tương phản nhẹ của δέ sau phản ứng vấp phạm của dân chúng.
- source_word: προφήτης
  choice: nhà tiên tri
  rationale: Cách gọi quen thuộc, rõ nghĩa trong tiếng Việt hiện đại và phù hợp với tính chất châm ngôn của lời nói.
- source_word: ἄτιμος
  choice: bị coi thường
  rationale: Diễn đạt tự nhiên tình trạng không được tôn trọng, giữ được sắc thái danh dự–nhục nhã của từ Hy Lạp.
- source_word: εἰ μὴ
  choice: ngoại trừ
  rationale: Thể hiện trực tiếp cấu trúc ngoại lệ của câu Hy Lạp.
- source_word: πατρίδι
  choice: tại quê hương mình
  rationale: Trong bối cảnh Na-xa-rét, từ này chỉ nơi bản quán hoặc nơi người ấy lớn lên hơn là cả một quốc gia; ‘quê hương’ vẫn giữ được độ rộng nghĩa của nguyên ngữ.
- source_word: ἐν τῇ οἰκίᾳ αὐτοῦ
  choice: trong chính nhà mình
  rationale: ‘Nhà’ trong tiếng Việt có thể chỉ cả nơi ở lẫn những người thuộc gia đình, nhờ đó bảo toàn độ mơ hồ của οἰκία; ‘chính’ nhấn mạnh phạm vi thân thuộc của người ấy.
theological_decisions:
- issue: Phạm vi lời châm ngôn của Đức Giê-su về sự khước từ
  choice: Dịch như một nhận định có tính châm ngôn về việc nhà tiên tri bị coi thường trong môi trường quê quán và gia đình, không mở rộng thành một khẳng định thần học tổng quát về mọi sự khước từ Đức Giê-su.
  alternative: Diễn giải rõ rằng chính gia đình không tin Đức Giê-su.
  rationale: Nguyên văn áp dụng một lời châm ngôn vào hoàn cảnh hiện tại nhưng không giải thích sâu hơn; bản dịch giữ nguyên sự căng thẳng và phạm vi của câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. ‘Đức Giê-su’ phù hợp lối gọi tôn kính thông dụng; đại từ ‘Ngài’ duy trì sự trang trọng. Cấu trúc phủ định kèm ngoại lệ được giữ để phản ánh hình thức châm ngôn của nguyên văn.
