base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/002.yaml
  text: And large crowds gathered to him[a], so that he got into a boat and sat down[b], and the whole crowd stood on the shore.
translation:
  language: vi
  text: Đông đảo dân chúng tụ họp đến với Đức Giê-su, đến nỗi ngài xuống một chiếc thuyền và ngồi, còn toàn thể đám đông đứng trên bờ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “trên bãi” hoặc “ven bờ biển hồ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: συνήχθησαν πρὸς αὐτὸν ὄχλοι πολλοί
  choice: Đông đảo dân chúng tụ họp bên Đức Giê-su
  rationale: Cách diễn đạt này chuyển tự nhiên ý nhiều đoàn người cùng tụ tập hướng về Đức Giê-su, tránh lối dịch sát nhưng gượng như “nhiều đám đông.” “Bên” phù hợp với kết quả họ đến gần ngài, trong khi động từ “tụ họp” vẫn giữ ý quy tụ.
- source_word: ὥστε
  choice: đến nỗi
  rationale: Diễn đạt rõ quan hệ kết quả do đám đông quá lớn gây ra.
- source_word: εἰς πλοῖον ἐμβάντα καθῆσθαι
  choice: ngài phải xuống một chiếc thuyền và ngồi đó
  rationale: “Xuống thuyền” là cách nói tự nhiên trong tiếng Việt cho việc bước vào hoặc lên một chiếc thuyền. “Phải” làm rõ kết quả thực tế trong cấu trúc ὥστε theo ngữ cảnh, còn “ngồi đó” giữ cả hành động ngồi lẫn vị trí trên thuyền.
- source_word: πᾶς ὁ ὄχλος
  choice: toàn thể đám đông
  rationale: Giữ sự chuyển đổi của nguyên bản từ các đoàn dân ở số nhiều sang một tập thể được nhìn như một đám đông duy nhất.
- source_word: ἐπὶ τὸν αἰγιαλὸν εἱστήκει
  choice: đứng trên bờ
  rationale: “Bờ” là từ trung tính, tự nhiên, bao quát nghĩa bờ hoặc dải đất sát mặt nước của αἰγιαλός. “Đứng” diễn tả tự nhiên trạng thái mà dạng động từ Hy Lạp trình bày.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện trang trọng vừa phải, hiện đại và dễ hiểu. Dùng “Đức Giê-su” và đại từ “ngài” để giữ sự tôn kính tự nhiên; tránh cấu trúc dịch sát tiếng Hy Lạp gây gượng trong tiếng Việt.
