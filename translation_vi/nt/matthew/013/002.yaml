    issue: Từ “phải” trong “ngài phải xuống một chiếc thuyền” thêm ý bắt buộc.
    rationale: 'Nguyên văn ὥστε… ἐμβάντα καθῆσθαι biểu thị kết quả: ngài xuống/lên thuyền và ngồi. Câu không nói ngài bị bắt buộc phải làm vậy.'
  - severity: low
    issue: “Bên Đức Giê-su” chưa diễn tả trực tiếp hướng chuyển động của πρὸς αὐτόν.
    rationale: πρὸς với đối cách ở đây là “đến với/người ta tụ họp về phía ngài.” “Bên” có thể hiểu chủ yếu là vị trí ở cạnh ngài.
  revised_text: Đông đảo dân chúng tụ họp đến với Đức Giê-su, đến nỗi ngài xuống một chiếc thuyền và ngồi, còn toàn thể đám đông đứng trên bờ.[a]
