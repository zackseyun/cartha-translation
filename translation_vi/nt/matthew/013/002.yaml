revisions:
- from: Đông đảo dân chúng tụ họp bên Đức Giê-su, đến nỗi ngài phải xuống một chiếc thuyền và ngồi đó, còn toàn thể đám đông đứng trên bờ.[a]
  to: Đông đảo dân chúng tụ họp đến với Đức Giê-su, đến nỗi ngài xuống một chiếc thuyền và ngồi, còn toàn thể đám đông đứng trên bờ.[a]
  rationale: Bản sửa loại bỏ ý bắt buộc không có trong nguyên văn và thay “bên” bằng “đến với” để phản ánh πρὸς αὐτόν. Các lựa chọn còn lại được giữ vì tự nhiên, đúng sắc thái kể chuyện, và không áp đặt diễn giải thần học.
