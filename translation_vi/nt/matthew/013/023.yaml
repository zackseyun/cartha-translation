revisions:
- from: 'Còn hạt được gieo trên đất tốt là người nghe lời và hiểu; người ấy thật sự kết quả và sinh ra: người thì gấp trăm, người thì gấp sáu mươi, người thì gấp ba mươi.[a]'
  to: 'Còn hạt giống được gieo trên đất tốt, ấy là người nghe lời và hiểu lời ấy; người ấy thật sự kết quả và cho sản lượng: có người gấp một trăm, có người gấp sáu mươi, có người gấp ba mươi.[a]'
  rationale: Bản sửa làm rõ quan hệ giữa hình ảnh hạt giống và người nghe, thay cách nói «sinh ra» bằng «cho sản lượng» để chuyển đúng ποιεῖ trong ngữ cảnh nông nghiệp, và chỉnh chú thích sát cấu trúc Hy Lạp hơn. Các mức «gấp» được giữ trong văn bản chính như một cách nói Việt ngữ tự nhiên cho sản lượng, đồng thời chú thích nêu cấu trúc nguyên văn không có từ tương ứng trực tiếp với «gấp».
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T02:47:30Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch giữ đúng trình tự chính: được gieo trên đất tốt, nghe lời, hiểu, kết quả, và các mức sản lượng khác nhau. Tuy nhiên, «hạt được gieo ... là người» làm lẫn hình ảnh hạt giống với người mà câu Hy Lạp đang quy chiếu bằng phân từ giống đực; «sinh ra» cũng thiếu bổ ngữ và chưa diễn đạt rõ ý παραγωγής/sản lượng của ποιεῖ.'
  naturalness: «Kết quả» dùng như động từ là quen thuộc trong văn phong Kinh Thánh Việt ngữ, nhưng phối hợp «kết quả và sinh ra» nghe gượng và không rõ sinh ra điều gì. «Hạt giống được gieo ... ấy là người...» tự nhiên hơn, vừa duy trì hình ảnh dụ ngôn vừa giải thích quy chiếu sang người nghe.
  terminology: Giữ «đất tốt», «lời», và «kết quả» là phù hợp với văn mạch dụ ngôn và tiếng Việt chuẩn hiện đại. «Cho sản lượng» diễn đạt ποιεῖ trong bối cảnh nông nghiệp mà không nhập hẳn nó vào «kết quả». «Thật sự» là cách chuyển an toàn cho δή, dù sắc thái chỉ là nhấn mạnh nhẹ.
  issues:
  - severity: medium
    issue: Chủ ngữ «hạt được gieo ... là người» lẫn cấp độ hình ảnh và đối tượng được giải thích.
    rationale: ὁ ... σπαρείς là «người/điều được gieo» theo cách nói ẩn dụ của phần giải thích. Thêm «hạt giống» rồi đồng nhất trực tiếp với «người» dễ gây vấp ngữ nghĩa trong tiếng Việt. Cần đánh dấu rõ hạt giống là hình ảnh quy chiếu đến người nghe.
  - severity: medium
    issue: «kết quả và sinh ra» không tự nhiên và động từ thứ hai không có nội dung được sinh ra.
    rationale: καρποφορεῖ καὶ ποιεῖ có hai động từ; không nên xóa một động từ, nhưng ποιεῖ ở đây cần được diễn đạt là việc cho/đạt sản lượng. «Kết quả và cho sản lượng» giữ được cả hai vế một cách rõ ràng.
  - severity: low
    issue: Chú thích nguyên văn thêm «người thì», dù đại từ quan hệ ὃ không nêu danh từ «người».
    rationale: 'Chú thích nên phản ánh cấu trúc phân phối sát hơn: «một thì một trăm...»; ý nói mức sản lượng khác nhau có thể được giải thích riêng.'
