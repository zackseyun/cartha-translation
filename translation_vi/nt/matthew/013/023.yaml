id: MAT.13.23
reference: Matthew 13:23
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὁ δὲ ἐπὶ τὴν ⸂καλὴν γῆν⸃ σπαρείς, οὗτός ἐστιν ὁ τὸν λόγον ἀκούων καὶ ⸀συνιείς, ὃς δὴ καρποφορεῖ καὶ ποιεῖ ὃ μὲν ἑκατὸν ὃ δὲ ἑξήκοντα ὃ δὲ τριάκοντα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/023.yaml
  text: But the one sown on the good soil—this is the one who hears the word and understands it[a], who indeed bears fruit and produces, in one case a hundred, in another sixty[b], and in another thirty.
translation:
  language: vi
  text: 'Còn hạt giống được gieo trên đất tốt, ấy là người nghe lời và hiểu lời ấy; người ấy thật sự kết quả và cho sản lượng: có người gấp một trăm, có người gấp sáu mươi, có người gấp ba mươi.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “một thì một trăm, một thì sáu mươi, một thì ba mươi”; tức là các mức sản lượng khác nhau. Cũng có thể dịch: “một trăm lần ... sáu mươi lần ... ba mươi lần.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπὶ τὴν καλὴν γῆν
  choice: trên đất tốt
  rationale: Trong bối cảnh nông nghiệp, γῆ chỉ đất tiếp nhận hạt giống; «đất tốt» tự nhiên trong tiếng Việt và καλὴν ở đây nói đến đất thích hợp, màu mỡ.
- source_word: σπαρείς
  choice: hạt được gieo
  rationale: Phân từ thụ động gắn người nghe với hạt giống trong hình ảnh dụ ngôn. Thêm «hạt» làm rõ chủ thể hàm ẩn mà không phá vỡ ẩn dụ.
- source_word: ὁ τὸν λόγον ἀκούων
  choice: người nghe lời
  rationale: Giữ «lời» để bảo tồn cách diễn đạt đặc trưng của văn mạch Tin Mừng, đồng thời câu tiếng Việt vẫn tự nhiên.
- source_word: συνιείς
  choice: hiểu
  rationale: Diễn đạt trực tiếp việc nắm được ý nghĩa của lời đã nghe; tân ngữ được hiểu từ ngữ cảnh nên không cần lặp lại.
- source_word: δὴ
  choice: thật sự
  rationale: Thể hiện sắc thái nhấn mạnh của tiểu từ δή mà không làm câu quá nặng.
- source_word: καρποφορεῖ
  choice: kết quả
  rationale: Giữ hình ảnh sinh hoa trái quen thuộc trong ngôn ngữ Kinh Thánh; «kết quả» ở đây được dùng như động từ.
- source_word: ποιεῖ
  choice: sinh ra
  rationale: Giữ riêng động từ thứ hai, chỉ việc tạo ra sản lượng, thay vì nhập chung với καρποφορεῖ.
- source_word: ὃ μὲν ἑκατὸν ὃ δὲ ἑξήκοντα ὃ δὲ τριάκοντα
  choice: người thì gấp trăm, người thì gấp sáu mươi, người thì gấp ba mươi
  rationale: Cấu trúc phân phối nói đến các mức sản lượng khác nhau. «Gấp» diễn đạt tự nhiên điều được ngữ cảnh hàm ý, dù từ tương ứng không xuất hiện minh nhiên trong tiếng Hy Lạp.
theological_decisions:
- issue: Bản chất sự đáp ứng đối với lời trong dụ ngôn
  choice: Mô tả người nghe lời, hiểu và kết quả với những mức độ khác nhau.
  alternative: Diễn giải rõ thành sự bền đỗ, sự hoán cải thật hoặc bằng chứng của sự tái sinh.
  rationale: Bản văn Hy Lạp nêu việc nghe, hiểu và kết quả, nhưng không minh nhiên xác định các phạm trù tín lý về sự bền đỗ hay tái sinh; bản dịch không thêm kết luận hệ phái.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Duy trì hình ảnh nông nghiệp và hai động từ «kết quả»/«sinh ra». Dấu chú thích [a] được đặt sau toàn bộ chuỗi sản lượng mà nó giải thích.
