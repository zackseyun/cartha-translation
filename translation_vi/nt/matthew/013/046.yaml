source:
  edition: SBLGNT
  text: ⸂εὑρὼν δὲ⸃ ἕνα πολύτιμον μαργαρίτην ἀπελθὼν πέπρακεν πάντα ὅσα εἶχεν καὶ ἠγόρασεν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/046.yaml
  text: and having found one pearl of great value[a], he went away, sold all that he had, and bought it.
translation:
  language: vi
  text: Khi tìm được một viên ngọc trai rất quý giá[a], ông ra đi, bán tất cả những gì mình có rồi mua viên ngọc ấy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “một viên ngọc trai quý báu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εὑρὼν δὲ
  choice: Khi tìm được
  rationale: Phân từ bất định diễn tả hành động xảy ra trước các động từ chính; δέ chỉ nối tiếp nhẹ, nên tiếng Việt tự nhiên có thể dùng cấu trúc thời gian “Khi…” mà không cần một liên từ đối lập.
- source_word: ἕνα
  choice: một viên
  rationale: Giữ rõ số từ ἕνα, nhấn mạnh một viên ngọc duy nhất có giá trị đặc biệt.
- source_word: πολύτιμον
  choice: vô cùng quý giá
  rationale: Diễn đạt tự nhiên mức giá trị đặc biệt cao của πολύτιμος; “quý giá” cũng giữ được sắc thái có thể hiểu là “đắt giá” hoặc “quý báu”.
- source_word: μαργαρίτην
  choice: ngọc trai
  rationale: Tương đương từ vựng chuẩn trong tiếng Việt; lượng từ “viên” phù hợp với danh từ này.
- source_word: ἀπελθὼν
  choice: liền đi
  rationale: Chuyển phân từ thành động từ hữu hạn để câu tiếng Việt sáng rõ; “đi” giữ ý rời khỏi nơi đó, còn “liền” thể hiện mạch hành động nhanh và liên tiếp trong văn cảnh.
- source_word: πέπρακεν
  choice: bán
  rationale: Thì hoàn thành Hy Lạp được diễn đạt tự nhiên bằng động từ chỉ hành động đã hoàn tất trong chuỗi kể chuyện tiếng Việt.
- source_word: πάντα ὅσα εἶχεν
  choice: tất cả những gì mình có
  rationale: Giữ trọn ý tổng quát và toàn bộ tài sản; “mình” quy chiếu tự nhiên về chủ ngữ “ông”.
- source_word: ἠγόρασεν
  choice: mua
  rationale: Tương đương thông dụng, rõ nghĩa và phù hợp văn phong hiện đại.
- source_word: αὐτόν
  choice: viên ngọc ấy
  rationale: Lặp lại danh từ thay vì dùng đại từ mơ hồ; αὐτόν quy chiếu về μαργαρίτην và “ấy” đánh dấu đối tượng đã được nhắc đến.
