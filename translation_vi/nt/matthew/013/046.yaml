  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Cấu trúc phân từ Hy Lạp được chuyển thành chuỗi hành động tự nhiên trong tiếng Việt; không thêm cách giải thích thần học vào câu.
