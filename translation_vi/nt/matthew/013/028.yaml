id: MAT.13.28
reference: Matthew 13:28
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὁ δὲ ἔφη αὐτοῖς· Ἐχθρὸς ἄνθρωπος τοῦτο ἐποίησεν. οἱ δὲ ⸂δοῦλοι αὐτῷ λέγουσιν⸃· Θέλεις οὖν ἀπελθόντες ⸀συλλέξωμεν αὐτά;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/028.yaml
  text: He said to them[a], “An enemy did this.” Then the slaves said to him, “Do you want us to go and gather them up?”
translation:
  language: vi
  text: 'Ông đáp: “Một kẻ thù đã làm việc này.” Các đầy tớ[a] hỏi ông: “Vậy ông có muốn chúng tôi đi nhổ gom chúng lại không?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “nô lệ”. Từ Hy Lạp δοῦλοι có thể chỉ những người phục dịch hoặc những người thuộc thân phận nô lệ, tùy văn cảnh.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφη
  choice: đáp
  rationale: Trong mạch đối thoại, động từ nói này tự nhiên được dịch là “đáp”, vì lời của ông trực tiếp trả lời câu hỏi ở câu trước.
- source_word: Ἐχθρὸς ἄνθρωπος
  choice: một kẻ thù
  rationale: Cụm từ chỉ một người có thái độ thù địch; “một kẻ thù” vừa tự nhiên trong tiếng Việt vừa giữ tính cá thể của ἄνθρωπος.
- source_word: τοῦτο ἐποίησεν
  choice: đã làm việc này
  rationale: Thì aorist chỉ hành động đã xảy ra; “đã làm việc này” truyền đạt rõ cả hành động và đại từ chỉ thị.
- source_word: δοῦλοι
  choice: đầy tớ
  rationale: Trong bối cảnh gia đình và nông nghiệp cổ đại, từ này chỉ những người lệ thuộc chủ nhà. “Đầy tớ” là cách nói tự nhiên, trang trọng vừa phải trong tiếng Việt; nghĩa xã hội mạnh hơn là “nô lệ” được ghi ở chú thích.
- source_word: Θέλεις
  choice: ông có muốn
  rationale: Diễn đạt ý muốn bằng lối hỏi hiện đại, tự nhiên; đại từ “ông” phù hợp với cách những người dưới quyền thưa với chủ nhà trong văn cảnh.
- source_word: οὖν
  choice: vậy
  rationale: Ở đây từ nối biểu thị phản ứng suy ra từ lời giải thích vừa nghe; “vậy” tự nhiên hơn “do đó” trong hội thoại.
- source_word: ἀπελθόντες
  choice: đi
  rationale: Phân từ diễn tả hành động đi trước hoặc đi để thực hiện việc gom; cấu trúc “đi nhổ gom” giữ trình tự một cách tự nhiên.
- source_word: συλλέξωμεν
  choice: nhổ gom ... lại
  rationale: Động từ có nghĩa thu gom. Vì đối tượng là cỏ lùng mọc giữa lúa và câu sau nói đến nguy cơ nhổ bật lúa, “nhổ gom” làm rõ hành động theo văn cảnh mà không chỉ dịch chung chung là “thu gom”.
- source_word: αὐτά
  choice: chúng
  rationale: Đại từ trung tính số nhiều quy chiếu đến cỏ lùng ở câu trước; “chúng” là đại từ số nhiều tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Cách dịch δοῦλοι trong bối cảnh dụ ngôn
  choice: đầy tớ
  alternative: nô lệ
  rationale: “Đầy tớ” đọc tự nhiên trong lời kể tiếng Việt và vẫn thể hiện quan hệ lệ thuộc với chủ nhà. Tuy nhiên, δοῦλοι có thể chỉ người thuộc thân phận nô lệ chứ không chỉ người làm công, nên phương án “nô lệ” được bảo lưu trong chú thích, không làm nhẹ thực tại xã hội của nguyên ngữ.
translation_notes:
  register: Văn phong kể chuyện hiện đại, rõ ràng và trang trọng vừa phải. Dùng “ông” cho chủ ruộng theo văn cảnh trước đó; “đầy tớ” tránh sắc thái hành chính của “người phục vụ”, còn chú thích giữ nghĩa mạnh hơn về thân phận xã hội.
