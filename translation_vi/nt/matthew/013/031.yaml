  to: 'Ngài trình bày với họ một dụ ngôn khác, nói rằng: “Nước Trời giống như một hạt cải mà một người lấy rồi gieo trong ruộng của mình.”'
  rationale: Bản sửa thay động từ mở đầu bằng cách diễn đạt sát παρέθηκεν hơn, dùng thuật ngữ Việt ngữ tự nhiên và quen thuộc cho βασιλεία τῶν οὐρανῶν, đồng thời làm rõ quan hệ giữa “lấy” và “gieo”. Nội dung so sánh và mọi thành tố nông nghiệp của nguyên văn được giữ nguyên, không thêm diễn giải.
