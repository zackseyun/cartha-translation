    rationale: Trong ngữ cảnh này παρατίθημι là trình bày hoặc đưa một dụ ngôn ra trước thính giả, không đơn thuần là kể chuyện.
  - severity: medium
    issue: “mà một người lấy gieo” thiếu từ nối giữa hai động tác.
    rationale: Nguyên văn có phân từ λαβών (“đã/sau khi lấy”) rồi động từ chính ἔσπειρεν (“gieo”). Thêm “rồi” làm rõ trình tự và tự nhiên hơn mà không thêm nghĩa.
  - severity: low
    issue: “Vương quốc thiên đàng” không phải cách diễn đạt tự nhiên nhất cho thuật ngữ Ma-thi-ơ trong tiếng Việt hiện đại.
    rationale: “Nước Trời” là thuật ngữ Kinh Thánh Việt ngữ thông dụng, ngắn gọn, và vẫn bảo toàn tính mở của βασιλεία.
