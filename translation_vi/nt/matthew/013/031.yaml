  text: Ἄλλην παραβολὴν παρέθηκεν αὐτοῖς λέγων· Ὁμοία ἐστὶν ἡ βασιλεία τῶν οὐρανῶν κόκκῳ σινάπεως, ὃν λαβὼν ἄνθρωπος ἔσπειρεν ἐν τῷ ἀγρῷ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/031.yaml
  text: He set another parable before them, saying, “The kingdom of heaven is like a mustard seed, which a man took and sowed in his field.”
translation:
  language: vi
  text: 'Ngài trình bày với họ một dụ ngôn khác, nói rằng: “Nước Trời giống như một hạt cải mà một người lấy rồi gieo trong ruộng của mình.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρέθηκεν
  choice: kể cho họ
  rationale: Trong ngữ cảnh giới thiệu một dụ ngôn cho người nghe, παρατίθημι mang nghĩa trình bày hoặc đưa ra. Tiếng Việt tự nhiên nói “kể cho họ một dụ ngôn”, vừa rõ hành động truyền đạt vừa tránh lối dịch cứng.
- source_word: παραβολὴν
  choice: dụ ngôn
  rationale: “Dụ ngôn” là thuật ngữ tiếng Việt quen thuộc và chính xác cho παραβολή trong lời dạy của các sách Tin Mừng.
- source_word: Ὁμοία ἐστὶν
  choice: giống như
  rationale: Diễn đạt tự nhiên công thức so sánh của nguyên văn mà không giải thích thêm đối tượng hay phạm vi so sánh.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: Vương quốc thiên đàng
  rationale: Giữ cách gọi đặc trưng của Ma-thi-ơ; “vương quốc” có thể bao hàm cả quyền trị vì lẫn lĩnh vực chịu sự trị vì, còn “thiên đàng” diễn đạt tự nhiên τῶν οὐρανῶν trong tiếng Việt.
- source_word: κόκκῳ σινάπεως
  choice: một hạt cải
  rationale: “Hạt cải” là cách gọi ngắn gọn, quen thuộc trong tiếng Việt cho loại hạt được dùng trong hình ảnh này.
- source_word: ὃν λαβὼν ἄνθρωπος
  choice: mà một người lấy
  rationale: Giữ lại động tác λαβών và chủ thể số ít ἄνθρωπος, đồng thời dùng cấu trúc tiếng Việt gọn, tự nhiên.
- source_word: ἔσπειρεν
  choice: gieo
  rationale: σπείρω chỉ việc gieo hạt; “gieo” chính xác hơn “trồng” trong ngữ cảnh này.
- source_word: ἐν τῷ ἀγρῷ αὐτοῦ
  choice: trong ruộng mình
  rationale: “Ruộng” phù hợp bối cảnh canh tác; “mình” quy chiếu tự nhiên về người vừa được nhắc đến và giữ ý sở hữu của αὐτοῦ.
theological_decisions:
- issue: Cách dịch βασιλεία τῶν οὐρανῶν
  choice: Vương quốc thiên đàng
  alternative: Sự trị vì của trời; Vương quốc của các tầng trời
  rationale: “Vương quốc thiên đàng” bảo tồn cách diễn đạt đặc trưng của Ma-thi-ơ và không thu hẹp ý nghĩa chỉ còn hành động cai trị hay chỉ một địa điểm. Bản dịch không giải quyết thay người đọc quan hệ giữa quyền trị vì và lĩnh vực trị vì.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” theo mạch kể để chỉ Chúa Giê-su; câu trực tiếp súc tích. Không thêm lời giải thích về ý nghĩa của hạt cải hoặc vương quốc.
