id: MAT.13.21
reference: Matthew 13:21
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οὐκ ἔχει δὲ ῥίζαν ἐν ἑαυτῷ ἀλλὰ πρόσκαιρός ἐστιν, γενομένης δὲ θλίψεως ἢ διωγμοῦ διὰ τὸν λόγον εὐθὺς σκανδαλίζεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/021.yaml
  text: Yet he has no root in himself[a], but is temporary. When affliction or persecution arises because of the word[b], he immediately falls away.
translation:
  language: vi
  text: Nhưng người ấy không có rễ trong lòng mình, chỉ tồn tại nhất thời. Khi hoạn nạn hay bắt bớ xảy đến vì lời ấy, người ấy lập tức vấp ngã.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “lìa bỏ” hoặc “lấy làm phật ý”; động từ Hy Lạp có thể chỉ việc vấp ngã hoặc phản ứng phật ý.
    reason: lexical_alternative
lexical_decisions:
- source_word: ῥίζαν ἐν ἑαυτῷ
  choice: rễ trong chính mình
  rationale: Giữ nguyên hình ảnh cái rễ trong dụ ngôn và sắc thái phản thân của cụm từ Hy Lạp, không diễn giải thành một phẩm chất thần học cụ thể.
- source_word: πρόσκαιρός
  choice: chỉ tồn tại nhất thời
  rationale: Diễn đạt sự tồn tại không bền lâu, đồng thời tạo thế tương phản tự nhiên với việc không có rễ.
- source_word: γενομένης ... θλίψεως ἢ διωγμοῦ
  choice: khi hoạn nạn hay sự bắt bớ xảy đến
  rationale: Chuyển cấu trúc sở hữu cách tuyệt đối thành mệnh đề thời gian tự nhiên trong tiếng Việt; “hoạn nạn” giữ sắc thái áp lực, khốn khó, còn “sự bắt bớ” diễn đạt chính xác hành vi bách hại.
- source_word: διὰ τὸν λόγον
  choice: vì lời ấy
  rationale: Giữ liên hệ từ vựng với λόγος trong dụ ngôn; từ chỉ định “ấy” giúp người đọc nhận ra đây là lời/sứ điệp vừa được nhắc đến.
- source_word: εὐθὺς
  choice: lập tức
  rationale: Giữ sự nhấn mạnh về phản ứng tức thời.
- source_word: σκανδαλίζεται
  choice: vấp ngã
  rationale: Giữ hình ảnh và phạm vi nghĩa rộng của động từ Hy Lạp, không quyết định thay người đọc rằng đây nhất thiết là sự bội đạo hoàn toàn; các khả năng dịch theo kết quả hoặc phản ứng được nêu trong chú thích.
theological_decisions:
- issue: Ý nghĩa của σκανδαλίζεται trong bối cảnh môn đồ gặp áp lực
  choice: vấp ngã
  alternative: lìa bỏ; bị xúc phạm
  rationale: '“Vấp ngã” bảo toàn hình ảnh của nguyên ngữ và sự căng thẳng thần học: câu nói mô tả sự thất bại khi bị thử thách nhưng không tự động xác định bản chất hay tính vĩnh viễn của sự thất bại ấy.'
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Cấu trúc được chia thành hai câu để sáng rõ, trong khi vẫn giữ quan hệ giữa tình trạng không có rễ và phản ứng khi hoạn nạn hoặc bắt bớ xảy đến.
