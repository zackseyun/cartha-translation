revisions:
- from: Nhưng người ấy không có rễ trong chính mình, chỉ tồn tại nhất thời. Khi hoạn nạn hay sự bắt bớ xảy đến vì lời ấy, người ấy lập tức vấp ngã.[a]
  to: Nhưng người ấy không có rễ trong lòng mình, chỉ tồn tại nhất thời. Khi hoạn nạn hay bắt bớ xảy đến vì lời ấy, người ấy lập tức vấp ngã.[a]
  rationale: Bản sửa chỉ làm cho thành ngữ tiếng Việt tự nhiên hơn và điều chỉnh chú thích để phản ánh chính xác, không quá xác quyết, phạm vi nghĩa của σκανδαλίζεται. Nghĩa cơ bản và tính mơ hồ của nguyên ngữ được giữ nguyên.
