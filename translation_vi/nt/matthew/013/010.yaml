  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Καὶ προσελθόντες οἱ μαθηταὶ εἶπαν αὐτῷ· Διὰ τί ἐν παραβολαῖς λαλεῖς αὐτοῖς;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/010.yaml
  text: Then the disciples came up and said to him[a], “Why do you speak to them in parables?”
translation:
  language: vi
  text: 'Bấy giờ, các môn đồ đến gần và nói với Ngài[a]: “Tại sao Ngài nói với họ bằng các dụ ngôn?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “tiến đến”; phân từ Hy Lạp nhấn mạnh rằng các môn đồ đến gần Chúa Giê-su trước rồi mới nói.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: Bấy giờ
  rationale: Trong mạch kể chuyện, καί nối tiếp sự việc và đưa câu chuyện sang hành động của các môn đồ; “Bấy giờ” tự nhiên trong tiếng Việt mà không thêm nội dung.
- source_word: προσελθόντες
  choice: đến gần
  rationale: Phân từ bất định quá khứ của προσέρχομαι diễn tả các môn đồ tiến lại gần Chúa Giê-su trước khi nói; “đến gần” giữ rõ nét nghĩa chuyển động hướng về Ngài.
- source_word: οἱ μαθηταὶ
  choice: các môn đồ
  rationale: Mạo từ xác định nhóm môn đồ đã được biết trong ngữ cảnh; không thêm từ “Ngài” hay “của Ngài” vì nguyên văn không có đại từ sở hữu.
- source_word: εἶπαν αὐτῷ
  choice: nói với Ngài
  rationale: Giữ sát động từ λέγω là “nói” dù lời trực tiếp là một câu hỏi; cách diễn đạt vẫn tự nhiên trong tiếng Việt.
- source_word: Διὰ τί
  choice: Tại sao
  rationale: Cách hỏi trực tiếp, thông dụng và chính xác cho thành ngữ chỉ nguyên nhân.
- source_word: ἐν παραβολαῖς
  choice: bằng các dụ ngôn
  rationale: ἐν với cách dữ diễn tả phương thức hay phương tiện; “bằng các dụ ngôn” tự nhiên trong tiếng Việt và cho thấy hình thức Ngài dùng để giảng dạy.
- source_word: λαλεῖς
  choice: Ngài nói
  rationale: Động từ hiện tại ngôi thứ hai số ít được chuyển thành lối hỏi tự nhiên trong tiếng Việt; đại từ kính trọng “Ngài” làm rõ chủ thể được nói trực tiếp.
- source_word: αὐτοῖς
  choice: với họ
  rationale: Đại từ cách dữ chỉ những người được Chúa Giê-su nói với; “với họ” là cách diễn đạt tự nhiên trong tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “môn đồ”, “Ngài” và “dụ ngôn” vì đây là các thuật ngữ Kinh Thánh quen thuộc; cấu trúc câu được điều chỉnh vừa đủ để tự nhiên mà vẫn giữ thứ tự hành động trong nguyên văn.
