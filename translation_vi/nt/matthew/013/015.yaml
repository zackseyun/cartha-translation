id: MAT.13.15
reference: Matthew 13:15
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐπαχύνθη γὰρ ἡ καρδία τοῦ λαοῦ τούτου, καὶ τοῖς ὠσὶν βαρέως ἤκουσαν, καὶ τοὺς ὀφθαλμοὺς αὐτῶν ἐκάμμυσαν· μήποτε ἴδωσιν τοῖς ὀφθαλμοῖς καὶ τοῖς ὠσὶν ἀκούσωσιν καὶ τῇ καρδίᾳ συνῶσιν καὶ ἐπιστρέψωσιν, καὶ ἰάσομαι αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/015.yaml
  text: For this people's heart has grown dull[a], and with their ears they hear heavily, and they have closed their eyes, lest they should see with their eyes and hear with their ears and understand with their heart and turn back[c][b], and I will heal them.
translation:
  language: vi
  text: Vì lòng dân này đã trở nên chai lì[a]; với tai, họ nghe một cách nặng nề, và họ đã nhắm mắt lại, e rằng họ sẽ thấy bằng mắt, nghe bằng tai, hiểu bằng lòng, rồi quay về[b], và Ta sẽ chữa lành họ.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đã trở nên đờ đẫn”; theo nghĩa đen: “đã trở nên dày.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “quay lại” hoặc “trở lại.”'
    reason: lexical_alternative
  - marker: c
    text: Trích Ê-sai 6:9–10.
    reason: cross_reference
lexical_decisions:
- source_word: ἐπαχύνθη
  choice: đã trở nên chai lì
  rationale: Động từ theo nghĩa đen là trở nên dày hoặc béo; khi nói về lòng, thành ngữ diễn tả sự đờ đẫn, mất nhạy bén. “Chai lì” tự nhiên trong tiếng Việt và giữ sắc thái đạo đức-tâm linh mà không dịch máy móc.
- source_word: καρδία
  choice: lòng
  rationale: “Lòng” là cách diễn đạt tự nhiên trong tiếng Việt Kinh Thánh cho con người bên trong, nơi nhận thức và thái độ; trong câu này chính lòng là chủ thể của sự hiểu.
- source_word: λαοῦ τούτου
  choice: dân này
  rationale: Giữ đại từ chỉ định τούτου và diễn đạt gọn, tự nhiên theo cấu trúc tiếng Việt.
- source_word: βαρέως ἤκουσαν
  choice: tai họ nghe mà khó tiếp nhận
  rationale: βαρέως mang hình ảnh “nặng nề” và trong ngữ cảnh chỉ sự nghe khó khăn hoặc trì độn. Cách dịch này giữ sự bất lực hoặc miễn cưỡng trong việc tiếp nhận, đồng thời tránh cụm “nghe nặng nề” thiếu tự nhiên.
- source_word: ἐκάμμυσαν
  choice: họ đã nhắm mắt lại
  rationale: Giữ thể chủ động và trách nhiệm của chính dân chúng trong hành động cố ý đóng mắt.
- source_word: μήποτε
  choice: e rằng
  rationale: Giữ lực phủ định mang sắc thái ngăn ngừa của μήποτε và không giải quyết thay độc giả sự căng thẳng giữa mục đích, kết quả và sự phán xét.
- source_word: ἴδωσιν ... ἀκούσωσιν ... συνῶσιν
  choice: mắt họ thấy, tai họ nghe, lòng họ hiểu
  rationale: Giữ trình tự và sự song song của nguyên văn, đồng thời dùng cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: ἐπιστρέψωσιν
  choice: quay về
  rationale: Diễn đạt chuyển hướng hoặc trở lại, thường có hàm ý ăn năn, nhưng không nhập thêm thuật ngữ giáo phái như “quy đạo”.
- source_word: ἰάσομαι
  choice: Ta sẽ chữa lành
  rationale: Dịch thẳng thì tương lai của động từ, giữ lời hứa chữa lành mà không đổi thành điều kiện giả định.
theological_decisions:
- issue: Mệnh đề μήποτε trong lời trích dẫn về sự cứng lòng và trách nhiệm con người
  choice: e rằng ... rồi họ quay về, và Ta sẽ chữa lành họ
  alternative: nếu không, họ sẽ ... quay về, và Ta sẽ chữa lành họ
  rationale: Bản dịch giữ bề mặt cú pháp của μήποτε và hành động chủ động “họ đã nhắm mắt lại”, không làm nhẹ sự căng thẳng giữa phán xét của Đức Chúa Trời và trách nhiệm của con người.
- issue: Ý nghĩa thần học của ἐπιστρέψωσιν
  choice: quay về
  alternative: quay lại; trở lại; được cải đạo
  rationale: “Quay về” giữ hình ảnh định hướng và hàm ý trở về với Đức Chúa Trời nhưng không áp đặt ngôn ngữ giáo hội về sự cải đạo.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “lòng” thay vì “trái tim” để chỉ con người bên trong; viết hoa “Ta” cho lời phán của Đức Chúa Trời trong câu trích dẫn. Các vế song song mắt–tai–lòng được giữ rõ ràng; tránh lối dịch quá sát “nghe nặng nề” vì không tự nhiên trong tiếng Việt.
