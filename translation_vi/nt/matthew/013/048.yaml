  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἣν ὅτε ἐπληρώθη ἀναβιβάσαντες ἐπὶ τὸν αἰγιαλὸν καὶ καθίσαντες συνέλεξαν τὰ καλὰ εἰς ⸀ἄγγη, τὰ δὲ σαπρὰ ἔξω ἔβαλον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/048.yaml
  text: When it was filled[a], they pulled it up onto the shore, sat down, and gathered the good fish into containers[b], but threw the rotten ones out.
translation:
  language: vi
  text: Khi lưới đầy, người ta kéo lưới lên bờ, rồi ngồi xuống, gom cá tốt vào các đồ đựng[a], còn cá hỏng[b] thì ném ra ngoài.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “các vật chứa”. Từ Hy Lạp là từ khái quát chỉ vật dùng để đựng, không nhất thiết là giỏ hay thúng.
    reason: lexical_alternative
  - marker: b
    text: Hay “cá xấu” hoặc “cá thối”. Từ Hy Lạp có thể có nghĩa là thối, hư hỏng, hoặc nói rộng hơn là vô giá trị.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἣν ὅτε ἐπληρώθη
  choice: Khi lưới đầy
  rationale: Đại từ quan hệ ἣν quy chiếu về chiếc lưới ở câu trước. Tiếng Việt tự nhiên nhắc lại “lưới”; “đầy” diễn đạt gọn thể bị động ἐπληρώθη trong ngữ cảnh lưới đầy cá.
- source_word: ἀναβιβάσαντες ἐπὶ τὸν αἰγιαλόν
  choice: người ta kéo lên bờ
  rationale: Phân từ diễn tả việc đưa lưới từ dưới nước lên đất. “Kéo lên bờ” rõ nghĩa và không quy định bờ cát.
- source_word: καθίσαντες
  choice: rồi ngồi xuống
  rationale: Dịch phân từ bất định như hành động kế tiếp trong chuỗi sự việc; “rồi” làm rõ trình tự tự nhiên trong tiếng Việt.
- source_word: συνέλεξαν τὰ καλὰ
  choice: gom cá tốt
  rationale: “Gom” phù hợp thao tác phân loại. Danh từ “cá” được bổ sung từ ngữ cảnh để chỉ rõ đối tượng hàm ẩn của tính từ được danh từ hóa τὰ καλά.
- source_word: εἰς ἄγγη
  choice: vào các đồ chứa
  rationale: ἄγγη là từ khái quát chỉ vật dùng để chứa; “đồ chứa” giữ được độ rộng nghĩa, không thu hẹp thành giỏ hay thúng.
- source_word: τὰ δὲ σαπρά
  choice: còn cá hỏng
  rationale: σαπρά có thể chỉ thứ thối, hư hỏng hoặc vô giá trị. “Cá hỏng” giữ hình ảnh cụ thể mà không khẳng định chúng nhất thiết đã thối rữa.
- source_word: ἔξω ἔβαλον
  choice: thì ném ra ngoài
  rationale: Diễn đạt tự nhiên lực loại bỏ trong cụm động từ Hy Lạp; cặp “còn... thì...” thể hiện sự tương phản với cá tốt.
theological_decisions:
- issue: Cách hiểu hình ảnh phân loại trong dụ ngôn
  choice: Dịch cụ thể như cảnh đánh cá, không đưa lời giải thích về sự phán xét cuối cùng vào câu này.
  alternative: Dùng từ ngữ diễn giải nhằm báo trước ý nghĩa về sự phán xét.
  rationale: Bản thân câu này vẫn thuộc phần hình ảnh của dụ ngôn; phần giải thích thần học xuất hiện ở các câu sau. Giữ nguyên cấp độ hình ảnh tránh áp đặt phần giải nghĩa vào lời kể.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “người ta” làm chủ ngữ phiếm chỉ cho các phân từ số nhiều; giữ hình ảnh đánh cá cụ thể và sự đối lập giữa cá tốt với cá hỏng.
