  text: Τότε ἀφεὶς τοὺς ὄχλους ἦλθεν εἰς τὴν ⸀οἰκίαν. καὶ προσῆλθον αὐτῷ οἱ μαθηταὶ αὐτοῦ λέγοντες· ⸀Διασάφησον ἡμῖν τὴν παραβολὴν τῶν ζιζανίων τοῦ ἀγροῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/036.yaml
  text: Then[a], after leaving the crowds, he went into the house. And his disciples came to him, saying, “Explain to us the parable of the weeds of the field.”
translation:
  language: vi
  text: 'Bấy giờ, sau khi rời đám đông, Đức Giê-su đi vào nhà. Các môn đồ của Ngài đến gần Ngài và thưa: “Xin giải thích cho chúng con dụ ngôn về cỏ lùng[a] trong ruộng.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hoặc dịch là “cỏ dại”; từ Hy Lạp này có thể chỉ cụ thể cỏ lùng, một loại cỏ dại trông giống lúa mì.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Bấy giờ
  rationale: Dấu chỉ thời gian chuyển sang sự việc kế tiếp; “Bấy giờ” tự nhiên, trang trọng và phù hợp văn kể chuyện.
- source_word: ἀφεὶς τοὺς ὄχλους
  choice: sau khi rời đám đông
  rationale: Diễn đạt rõ hành động của phân từ bất định xảy ra trước động từ chính; danh từ Hy Lạp ở số nhiều nhưng tiếng Việt tự nhiên dùng danh từ tập hợp “đám đông”.
- source_word: ἦλθεν εἰς τὴν οἰκίαν
  choice: đi vào nhà
  rationale: Trong mạch kể, động từ chỉ sự di chuyển từ nơi có đám đông vào bên trong; tiếng Việt không cần biểu thị mạo từ xác định của οἰκία bằng “ngôi nhà ấy” khi ngữ cảnh đã đủ rõ.
- source_word: προσῆλθον αὐτῷ
  choice: đến gần Ngài
  rationale: Giữ sắc thái tiến đến gần một người của προσέρχομαι, đồng thời tự nhiên trong tiếng Việt.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: các môn đồ
  rationale: “Môn đồ” là từ quen thuộc, trang trọng cho μαθητής; quan hệ sở hữu đã rõ từ việc họ đến gần Đức Giê-su nên không cần lặp “của Ngài”.
- source_word: λέγοντες
  choice: và thưa
  rationale: Chuyển phân từ sang động từ nối tự nhiên trong tiếng Việt; “thưa” diễn tả lời nói kính trọng với Đức Giê-su mà không thêm nội dung thần học.
- source_word: Διασάφησον ἡμῖν
  choice: Xin giải thích cho chúng con
  rationale: “Giải thích” chuyển đúng yêu cầu làm cho rõ; “xin” thể hiện mệnh lệnh mang hình thức thỉnh cầu trong ngữ cảnh, còn “chúng con” phù hợp lời môn đồ thưa với thầy.
- source_word: τὴν παραβολὴν
  choice: dụ ngôn
  rationale: Thuật ngữ tiếng Việt thông dụng và nhất quán cho παραβολή trong các sách Phúc Âm.
- source_word: τῶν ζιζανίων τοῦ ἀγροῦ
  choice: về cỏ lùng trong ruộng
  rationale: Cách nói tự nhiên trong tiếng Việt, giữ đối tượng của dụ ngôn và mối liên hệ với cánh đồng; “cỏ lùng” chỉ loại cỏ dại giống lúa mì nhưng mức độ định danh chính xác của ζιζάνια vẫn được ghi chú.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Đức Giê-su”, “Ngài”, “môn đồ” và lối xưng hô “chúng con” để lời kể cùng lời thưa được tự nhiên, kính trọng. Dấu chú thích [a] đặt ngay sau câu có thuật ngữ cần giải thích.
