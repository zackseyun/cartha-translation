  source_fidelity: 'Bản dịch truyền đạt đúng trình tự của Τότε, quan hệ thời gian của ἀφεὶς, sự di chuyển vào nhà, lời các môn đồ xin giải thích, và nội dung “dụ ngôn về cỏ lùng trong ruộng.” Tuy nhiên, chú thích hiện có đảo lẫn phương án chính và phương án thay thế: bản văn chính dùng “cỏ lùng” nhưng chú thích lại nói từ Hy Lạp có thể chỉ cụ thể “cỏ lùng.”'
  naturalness: Văn câu tự nhiên, trang trọng vừa phải. “Bấy giờ,” “thưa,” “dụ ngôn,” và “cỏ lùng” phù hợp văn phong Kinh Thánh Việt ngữ hiện đại. Thêm “của Ngài” làm rõ sở hữu được biểu thị trong οἱ μαθηταὶ αὐτοῦ mà không gây nặng câu.
  terminology: “Dụ ngôn” tương ứng tốt với παραβολή. “Cỏ lùng” là cách dịch truyền thống, dễ nhận biết cho ζιζάνια; cần chú thích “cỏ dại” như một phương án rộng hơn và mô tả khả năng chỉ một loài cỏ giống lúa mì mà không khẳng định định danh thực vật học tuyệt đối.
  issues:
