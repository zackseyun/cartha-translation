review_pass:
  verdict: revise
  source_fidelity: 'Bản nháp truyền đạt đúng diễn tiến chính: trong lúc có người ngủ, kẻ thù của chủ ruộng đến gieo ζιζάνια xen giữa lúa mì rồi rời đi. Tuy nhiên, “những người ấy” thêm sắc thái chỉ định/xác định không có trong τοὺς ἀνθρώπους; trong ngữ cảnh này cụm từ Hy Lạp có thể được diễn đạt tự nhiên và không thu hẹp là “mọi người.”'
  naturalness: “Nhưng đang khi” và “những người ấy ngủ” hơi gượng trong văn kể chuyện tiếng Việt hiện đại. “Nhưng trong khi mọi người đang ngủ” tự nhiên hơn, đồng thời giữ được tính đang diễn ra của καθεύδειν.
  terminology: “Kẻ thù của ông,” “cỏ lùng,” và “lúa mì” phù hợp ngữ cảnh dụ ngôn. “Cỏ lùng” là cách gọi truyền thống, chính xác vừa phải cho ζιζάνια; không cần chú thích để khẳng định một định danh thực vật tuyệt đối.
  issues:
  - severity: low
    issue: “những người ấy” có sắc thái chỉ định không được biểu thị trong nguyên ngữ.
    rationale: τοὺς ἀνθρώπους nghĩa cơ bản là “những người/người ta”; bản văn không xác định họ bằng đại từ chỉ định. “Mọi người” giữ tính khái quát và tránh áp đặt rằng chỉ một nhóm đã được nêu rõ đang ngủ.
  - severity: low
    issue: Cách mở đầu “Nhưng đang khi” kém tự nhiên.
    rationale: “Nhưng trong khi” là cấu trúc tiếng Việt hiện đại trôi chảy hơn mà không thay đổi quan hệ đối lập δέ hay thời điểm của hành động.
  revised_text: Nhưng trong khi mọi người đang ngủ, kẻ thù của ông đến gieo cỏ lùng giữa lúa mì rồi đi.
