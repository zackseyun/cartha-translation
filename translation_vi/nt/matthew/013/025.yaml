  to: Nhưng trong khi mọi người đang ngủ, kẻ thù của ông đến gieo cỏ lùng giữa lúa mì rồi đi.
  rationale: Chỉnh nhẹ để bỏ sắc thái chỉ định không có trong τοὺς ἀνθρώπους và làm câu kể tự nhiên hơn. Bản sửa vẫn giữ sự mơ hồ về chính xác những người đang ngủ, quan hệ sở hữu trong “kẻ thù của ông,” hành động gieo xen giữa lúa mì, và việc kẻ thù rời đi.
