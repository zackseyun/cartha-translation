id: MAT.13.25
reference: Matthew 13:25
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐν δὲ τῷ καθεύδειν τοὺς ἀνθρώπους ἦλθεν αὐτοῦ ὁ ἐχθρὸς καὶ ⸀ἐπέσπειρεν ζιζάνια ἀνὰ μέσον τοῦ σίτου καὶ ἀπῆλθεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/025.yaml
  text: But while the men were sleeping, his enemy came and sowed weeds among the wheat and went away.
translation:
  language: vi
  text: Nhưng trong khi mọi người đang ngủ, kẻ thù của ông đến gieo cỏ lùng giữa lúa mì rồi đi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοὺς ἀνθρώπους
  choice: những người ấy
  rationale: Chỉ những người được giao việc trong câu chuyện; ἄνθρωποι có thể bao gồm con người nói chung, nên tránh thu hẹp không cần thiết thành riêng nam giới.
- source_word: αὐτοῦ ὁ ἐχθρός
  choice: kẻ thù của ông
  rationale: Giữ quan hệ sở hữu và sự đối lập cá nhân trong nguyên văn; “ông” quy chiếu về chủ ruộng trong dụ ngôn.
- source_word: ἐπέσπειρεν
  choice: gieo
  rationale: Diễn đạt tự nhiên hành động rải hạt giống; tiền tố ἐπι- trong ngữ cảnh không nhất thiết cần biểu đạt riêng.
- source_word: ζιζάνια
  choice: cỏ lùng
  rationale: Chỉ loại cỏ dại trông giống lúa mì khi còn non, phù hợp bối cảnh nông nghiệp của dụ ngôn hơn từ chung “cỏ dại”.
- source_word: ἀνὰ μέσον τοῦ σίτου
  choice: vào giữa lúa mì
  rationale: Giữ ý cỏ lùng được gieo xen lẫn ngay trong ruộng lúa mì.
- source_word: ἀπῆλθεν
  choice: bỏ đi
  rationale: Cách nói tự nhiên trong tiếng Việt, thể hiện kẻ thù rời khỏi nơi ấy sau hành động.
theological_decisions:
- issue: Phạm vi giới tính của τοὺς ἀνθρώπους
  choice: những người ấy
  alternative: những người đàn ông
  rationale: Nguyên ngữ dùng ἄνθρωπος chứ không phải ἀνήρ; bản dịch không nên thêm sự giới hạn về giới tính nếu ngữ cảnh không đòi hỏi.
- issue: Mức độ xác định của ζιζάνια
  choice: cỏ lùng
  alternative: cỏ dại
  rationale: “Cỏ lùng” bảo toàn hình ảnh một loại cỏ có thể mọc lẫn và khó phân biệt với lúa mì, nhưng không gán thêm ý nghĩa thần học ngoài dụ ngôn.
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Cấu trúc câu bám sát diễn tiến của nguyên văn nhưng được sắp xếp tự nhiên trong tiếng Việt.
