id: MAT.13.9
reference: Matthew 13:9
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὁ ἔχων ⸀ὦτα ἀκουέτω.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/009.yaml
  text: The one who has ears[a], let him hear.
translation:
  language: vi
  text: Ai có tai, hãy nghe.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ἔχων
  choice: Ai có
  rationale: Cụm mạo từ đi với phân từ hiện tại được dùng như danh từ và chỉ chung bất cứ người nào có đặc điểm được nói đến. “Ai có” diễn đạt tự nhiên trong tiếng Việt, vẫn giữ ý nghĩa khái quát và số ít đại diện.
- source_word: ὦτα
  choice: tai
  rationale: Danh từ Hy Lạp ở số nhiều, nhưng tiếng Việt thường không đánh dấu số nhiều khi nói về bộ phận cơ thể trong cách diễn đạt khái quát. “Có tai” là thành ngữ tự nhiên và không làm mất nghĩa của nguyên văn.
- source_word: ἀκουέτω
  choice: hãy nghe
  rationale: Động từ mệnh lệnh ngôi thứ ba số ít mang sức thúc giục. “Hãy nghe” vừa tự nhiên vừa giữ được sắc thái mệnh lệnh, đồng thời để ngữ cảnh hàm ý nghe với sự chú tâm và tiếp nhận.
theological_decisions:
- issue: Chủ thể khái quát ở giống đực số ít trong tiếng Hy Lạp
  choice: Ai có tai, hãy nghe.
  alternative: Người nào có tai, người ấy hãy nghe.
  rationale: Tiếng Việt không buộc phải biểu thị giống ngữ pháp. Đại từ “ai” bao gồm mọi người một cách tự nhiên, không chuyển chủ thể sang số nhiều và không thêm sắc thái giới tính vốn không phải trọng tâm của câu.
- issue: Ý nghĩa của hành động nghe
  choice: Giữ động từ “nghe” mà không diễn giải thêm
  alternative: Ai có tai, hãy lắng nghe.
  rationale: “Nghe” bảo toàn tương ứng từ vựng trực tiếp với ἀκούω và giữ độ mở giữa việc nghe bằng tai với việc chú tâm tiếp nhận. “Lắng nghe” làm rõ hàm ý nhưng cũng diễn giải mạnh hơn nguyên văn.
translation_notes:
  register: Văn phong ngắn gọn, trang trọng và tự nhiên trong tiếng Việt hiện đại. Cấu trúc “Ai có tai, hãy nghe” giữ tính cách ngôn súc tích của lời kêu gọi; không cần chú thích về ngôn ngữ bao hàm vì tiếng Việt không gặp vấn đề đại từ giống như tiếng Anh.
