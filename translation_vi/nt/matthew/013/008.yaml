revisions:
- from: 'Nhưng những hạt khác rơi trên đất tốt và sinh hoa kết quả: hạt thì gấp trăm, hạt thì gấp sáu mươi, hạt thì gấp ba mươi.[a]'
  to: 'Nhưng những hạt khác rơi trên đất tốt và sinh hoa kết quả: một hạt được gấp trăm, hạt khác gấp sáu mươi, hạt khác gấp ba mươi.[a]'
  rationale: Sửa cấu trúc nêu các mức sản lượng để loại bỏ sự mơ hồ tiếng Việt, đồng thời giữ nguyên hình ảnh, số lượng và tính phân phối của nguyên ngữ. Chú thích được điều chỉnh để phản ánh chính xác hai cách diễn đạt phân phối khả dĩ.
  reviewer_model: gpt-5.6-terra
