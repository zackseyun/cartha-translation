  text: ἄλλα δὲ ἔπεσεν ἐπὶ τὴν γῆν τὴν καλὴν καὶ ἐδίδου καρπόν, ὃ μὲν ἑκατὸν ὃ δὲ ἑξήκοντα ὃ δὲ τριάκοντα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/008.yaml
  text: But other seed fell on the good soil and was producing fruit—one a hundredfold, another sixty, and another thirty.
translation:
  language: vi
  text: 'Nhưng những hạt khác rơi trên đất tốt và sinh hoa kết quả: một hạt được gấp trăm, hạt khác gấp sáu mươi, hạt khác gấp ba mươi.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “có hạt được gấp trăm, có hạt gấp sáu mươi, có hạt gấp ba mươi.” Cách nói phân phối trong tiếng Hy Lạp có thể được diễn đạt bằng “một… hạt khác…” hoặc “có… có… có…”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλα
  choice: những hạt khác
  rationale: Tính từ trung tính số nhiều được dùng như danh từ, theo ngữ cảnh chỉ những hạt giống khác; thêm “hạt” để câu tiếng Việt rõ và tự nhiên.
- source_word: δὲ
  choice: Nhưng
  rationale: Nêu sự tương phản với những hạt rơi vào các loại đất trước đó.
- source_word: ἔπεσεν
  choice: rơi
  rationale: Giữ nghĩa trực tiếp của động từ Hy Lạp thay vì diễn giải thành “được gieo”.
- source_word: ἐπὶ τὴν γῆν τὴν καλὴν
  choice: trên đất tốt
  rationale: Trong ngữ cảnh canh tác, “đất tốt” tự nhiên, rõ nghĩa và chỉ loại đất thích hợp để cây sinh trưởng.
- source_word: ἐδίδου καρπόν
  choice: sinh hoa kết quả
  rationale: Diễn đạt tự nhiên hình ảnh nông nghiệp; dạng chưa hoàn thành gợi tiến trình tạo ra sản lượng, còn ngữ cảnh tiếng Việt cho phép thể hiện điều này mà không cần một trợ từ chỉ tiếp diễn nặng nề.
- source_word: ὃ μὲν ἑκατὸν ὃ δὲ ἑξήκοντα ὃ δὲ τριάκοντα
  choice: hạt thì gấp trăm, hạt thì gấp sáu mươi, hạt thì gấp ba mươi
  rationale: Cấu trúc “hạt thì…” tái hiện phép phân phối của tiếng Hy Lạp; “gấp” làm rõ rằng các con số chỉ mức sản lượng so với hạt giống ban đầu.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Sinh hoa kết quả” giữ hình ảnh truyền thống nhưng vẫn tự nhiên trong tiếng Việt; dấu hai chấm dẫn vào ba mức sản lượng. Dấu chú thích [a] được đặt sau toàn bộ cách diễn đạt có phương án dịch khác.
