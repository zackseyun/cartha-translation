source:
  edition: SBLGNT
  text: καὶ βαλοῦσιν αὐτοὺς εἰς τὴν κάμινον τοῦ πυρός· ἐκεῖ ἔσται ὁ κλαυθμὸς καὶ ὁ βρυγμὸς τῶν ὀδόντων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/050.yaml
  text: and they will throw them into the furnace of fire[a]. In that place there will be weeping and gnashing of teeth.
translation:
  language: vi
  text: Và họ sẽ ném họ vào lò lửa[a]. Ở đó sẽ có khóc lóc và nghiến răng.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hy Lạp: “lò của lửa”; cũng có thể dịch tự nhiên hơn là “lò lửa rực cháy.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: βαλοῦσιν
  choice: quăng
  rationale: Động từ ở thì tương lai diễn tả hành động ném mạnh; “quăng” tự nhiên trong tiếng Việt hiện đại và giữ được sắc thái cưỡng bức.
- source_word: αὐτοὺς
  choice: họ
  rationale: Đại từ đối cách số nhiều chỉ những kẻ ác trong ngữ cảnh trước; “họ” là đại từ tân ngữ tự nhiên trong tiếng Việt.
- source_word: κάμινον τοῦ πυρός
  choice: lò lửa
  rationale: Cách nói gọn, tự nhiên, vẫn giữ hình ảnh cụ thể của cấu trúc Hy Lạp, nghĩa đen là “lò của lửa”.
- source_word: ἐκεῖ
  choice: Ở đó
  rationale: Giữ rõ ý nghĩa chỉ nơi chốn và sắc thái nhấn mạnh của trạng từ Hy Lạp.
- source_word: ἔσται
  choice: sẽ có
  rationale: Cấu trúc tồn tại trong tiếng Việt diễn đạt tự nhiên động từ tương lai đi với các danh từ theo sau.
- source_word: ὁ κλαυθμὸς
  choice: tiếng than khóc
  rationale: Diễn đạt sự khóc lóc vì đau khổ; thêm “tiếng” giúp kết hợp tự nhiên với “sẽ có” và công thức tiếp theo.
- source_word: ὁ βρυγμὸς τῶν ὀδόντων
  choice: nghiến răng
  rationale: Thành ngữ tiếng Việt quen thuộc, tương ứng sát với hình ảnh nghiến hoặc siết răng trong công thức phán xét của Ma-thi-ơ.
theological_decisions:
- issue: Hình ảnh phán xét trong bối cảnh cánh chung
  choice: Giữ nguyên các hình ảnh cụ thể “lò lửa,” “than khóc” và “nghiến răng,” không làm nhẹ hay diễn giải thêm.
  alternative: Diễn giải thành sự đau đớn hoặc tuyệt vọng trong hình phạt.
  rationale: Bản Hy Lạp trình bày hình ảnh phán xét mạnh nhưng không giải thích chi tiết bản chất của hình ảnh; bản dịch nên giữ nguyên sức nặng và độ mở thần học ấy.
translation_notes:
  register: Văn phong trang trọng, rõ ràng và hiện đại. “Lò lửa” giữ sắc thái Kinh Thánh mà vẫn dễ hiểu; “ở đó sẽ có tiếng than khóc và nghiến răng” tái hiện công thức trang nghiêm của Ma-thi-ơ.
