  rationale: Bản sửa viết hoa đầu câu, dùng “ném” cho động từ βάλλω trong văn phong hiện đại trang trọng, và thay “tiếng than khóc” bằng “khóc lóc” để bám sát κλαυθμός. Hình ảnh phán xét, thì tương lai, và độ mở thần học của nguyên văn đều được giữ nguyên.
