review_pass:
  verdict: revise
  source_fidelity: 'Bản nháp truyền đạt đúng cấu trúc và hình ảnh chính: động từ tương lai, đối tượng số nhiều, lò lửa, và công thức về khóc lóc/nghiến răng. Tuy nhiên, “ném” là lựa chọn trung tính và sát lực nghĩa của βαλοῦσιν hơn “quăng”, vốn có sắc thái khẩu ngữ hơn trong văn phong trang trọng. “Khóc lóc” phản ánh trực tiếp κλαυθμός mà không thêm danh từ “tiếng”.'
  naturalness: Cần viết hoa đầu câu vì đây là một câu độc lập. “Và họ sẽ ném họ vào lò lửa” là tiếng Việt hiện đại, trang trọng và rõ ràng. Cụm “khóc lóc và nghiến răng” tự nhiên, đồng thời giữ được công thức quen thuộc của Ma-thi-ơ.
  terminology: “Lò lửa” là cách dịch tự nhiên của κάμινον τοῦ πυρός; chú thích có thể nêu cấu trúc chữ nghĩa “lò của lửa” mà không buộc đưa cách nói thiếu tự nhiên ấy vào thân bài. “Nghiến răng” giữ nguyên hình ảnh nguồn văn bản và không diễn giải thần học.
  issues:
