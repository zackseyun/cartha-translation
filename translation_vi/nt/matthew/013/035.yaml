revisions:
- from: 'để lời đã được phán qua nhà tiên tri được ứng nghiệm: “Ta sẽ mở miệng nói bằng các ẩn dụ; ta sẽ thốt ra những điều đã được giấu kín từ thuở dựng nên thế gian.”[a]'
  to: 'để ứng nghiệm lời đã được phán qua nhà tiên tri rằng: “Ta sẽ mở miệng nói bằng các dụ ngôn; ta sẽ thốt ra những điều đã được giấu kín từ thuở khai nguyên.”[a]'
  rationale: 'Bản sửa theo sát SBLGNT: không thêm “thế gian” vào ἀπὸ καταβολῆς, nhưng giữ dị bản có κόσμου trong chú thích. “Từ thuở khai nguyên” chuyển đạt ý thời điểm nền tảng/khởi đầu mà không xác định đối tượng bị lược trong tiếng Hy Lạp. “Dụ ngôn” thay cho “ẩn dụ” để phản ánh đúng thuật ngữ Ma-thi-ơ, và “rằng” dịch chức năng dẫn trích của λέγοντος.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T02:47:41Z'
review_pass:
  verdict: revise
  source_fidelity: Bản thảo thêm “thế gian” vào chính văn, dù SBLGNT chỉ có ἀπὸ καταβολῆς (“từ thuở khai nguyên/từ nền tảng”), và chú thích lại xác nhận đây là phần chỉ có trong một số thủ bản. Cần để phần mở rộng này ở chú thích, không ở chính văn. Bản thảo cũng chưa dịch rõ phân từ λέγοντος (“rằng/nói rằng”).
  naturalness: Câu sửa giữ văn phong trang trọng, hiện đại và nhịp thơ của lời trích. “Dụ ngôn” là thuật ngữ chuẩn, chính xác hơn “ẩn dụ” trong ngữ cảnh các παραβολαί của Ma-thi-ơ. “Từ thuở khai nguyên” tự nhiên và không buộc phải thêm một đối tượng cho “nền tảng.”
  terminology: Dùng “dụ ngôn” cho παραβολαῖς; “được ứng nghiệm” cho πληρωθῇ; “lời đã được phán qua nhà tiên tri” cho τὸ ῥηθὲν διὰ τοῦ προφήτου. Không thêm tên nhà tiên tri. “Ta” phù hợp với giọng thơ của lời trích.
  issues:
  - severity: high
    issue: Chính văn thêm “thế gian” trong cụm “từ thuở dựng nên thế gian.”
    rationale: SBLGNT đọc ἀπὸ καταβολῆς, không có κόσμου (“của thế gian”). Chính chú thích của bản thảo cũng nhận phần mở rộng là dị bản; vì vậy không nên đưa vào chính văn.
  - severity: medium
    issue: “Ẩn dụ” không phải thuật ngữ phù hợp nhất cho παραβολαῖς.
    rationale: Trong Ma-thi-ơ, παραβολή chỉ thể loại “dụ ngôn,” không chỉ riêng biện pháp tu từ ẩn dụ.
  - severity: low
    issue: Thiếu thành tố tương ứng rõ với λέγοντος.
    rationale: Thêm “rằng” sau “nhà tiên tri” phản ánh công thức dẫn nhập trích dẫn mà vẫn tự nhiên trong tiếng Việt.
  revised_text: 'để ứng nghiệm lời đã được phán qua nhà tiên tri rằng: “Ta sẽ mở miệng nói bằng các dụ ngôn; ta sẽ thốt ra những điều đã được giấu kín từ thuở khai nguyên.”[a]'
  revised_footnotes:
