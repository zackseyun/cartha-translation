id: MAT.13.35
reference: Matthew 13:35
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὅπως πληρωθῇ τὸ ῥηθὲν διὰ τοῦ προφήτου λέγοντος· Ἀνοίξω ἐν παραβολαῖς τὸ στόμα μου, ἐρεύξομαι κεκρυμμένα ἀπὸ ⸀καταβολῆς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/035.yaml
  text: 'so that what was spoken through the prophet might be fulfilled[a], saying: “I will open my mouth in parables; I will utter things hidden from the foundation of the world.”'
translation:
  language: vi
  text: 'để ứng nghiệm lời đã được phán qua nhà tiên tri rằng: “Ta sẽ mở miệng nói bằng các dụ ngôn; ta sẽ thốt ra những điều đã được giấu kín từ thuở khai nguyên.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Một số thủ bản thêm: “của thế gian.”'
    reason: textual_variant
lexical_decisions:
- source_word: ὅπως
  choice: để
  rationale: Diễn đạt tự nhiên quan hệ mục đích/kết quả, nối việc Chúa Giê-su dùng ẩn dụ với sự ứng nghiệm lời tiên tri.
- source_word: πληρωθῇ
  choice: được ứng nghiệm
  rationale: Thể bị động và công thức ứng nghiệm đặc trưng của Ma-thi-ơ được giữ rõ ràng; tiếng Việt không cần biểu thị riêng sắc thái giả định của động từ sau ὅπως.
- source_word: τὸ ῥηθὲν διὰ τοῦ προφήτου
  choice: lời đã được phán qua nhà tiên tri
  rationale: Giữ thể bị động và ý nghĩa trung gian của διά với sở hữu cách, đồng thời tự nhiên trong văn phong Kinh Thánh tiếng Việt.
- source_word: ἐν παραβολαῖς
  choice: bằng các ẩn dụ
  rationale: Trong ngữ cảnh này, παραβολή chỉ hình thức giảng dạy bằng sự so sánh hoặc câu chuyện có hàm ý; “ẩn dụ” ngắn gọn, dễ hiểu và phù hợp thuật ngữ xuyên suốt.
- source_word: ἐρεύξομαι
  choice: ta sẽ thốt ra
  rationale: Giữ sắc thái mạnh và thi vị của động từ chỉ việc tuôn ra hay phát lời, nhưng vẫn tự nhiên trong tiếng Việt hiện đại.
- source_word: κεκρυμμένα
  choice: những điều đã được giấu kín
  rationale: Phản ánh phân từ hoàn thành bị động được dùng như danh từ, giữ ý về trạng thái bị che giấu kéo dài.
- source_word: ἀπὸ καταβολῆς
  choice: từ thuở dựng nên thế gian
  rationale: καταβολή đứng tuyệt đối nhưng trong thành ngữ này chỉ buổi sáng tạo hoặc lúc đặt nền thế gian. Bản dịch làm rõ hàm ý để câu tiếng Việt đầy đủ, còn dị bản có κόσμου được ghi chú.
theological_decisions:
- issue: Cách gọi nguồn trích dẫn
  choice: qua nhà tiên tri
  alternative: qua A-sáp, nhà tiên tri
  rationale: SBLGNT chỉ có τοῦ προφήτου, không nêu tên; vì vậy không thêm danh tính vào bản văn.
- issue: Phạm vi ý nghĩa của ἀπὸ καταβολῆς
  choice: từ thuở dựng nên thế gian
  alternative: từ lúc đặt nền móng
  rationale: Cụm từ thiếu danh từ bổ nghĩa trong SBLGNT nhưng là một thành ngữ chỉ khởi nguyên của thế gian. Bản dịch tiếng Việt diễn đạt nghĩa ngữ cảnh mà không biến hình ảnh “nền móng” thành một chi tiết thần học riêng.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại. Đại từ “Ta” trong lời trích dẫn giữ giọng thơ tiên tri. Dấu ghi chú [a] đặt ngay sau phần có dị bản; tuy nhiên do cách dịch thành ngữ trong chính văn đã diễn đạt rõ “thế gian”, chú thích cho biết một số thủ bản ghi thành phần ấy một cách minh nhiên trong tiếng Hy Lạp.
