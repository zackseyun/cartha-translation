  revision_rationale: 'Bản sửa theo sát SBLGNT: không thêm “thế gian” vào ἀπὸ καταβολῆς, nhưng giữ dị bản có κόσμου trong chú thích. “Từ thuở khai nguyên” chuyển đạt ý thời điểm nền tảng/khởi đầu mà không xác định đối tượng bị lược trong tiếng Hy Lạp. “Dụ ngôn” thay cho “ẩn dụ” để phản ánh đúng thuật ngữ Ma-thi-ơ, và “rằng” dịch chức năng dẫn trích của λέγοντος.'
