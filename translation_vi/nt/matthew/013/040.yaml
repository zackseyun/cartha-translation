  text: ὥσπερ οὖν συλλέγεται τὰ ζιζάνια καὶ πυρὶ ⸀καίεται, οὕτως ἔσται ἐν τῇ συντελείᾳ τοῦ ⸀αἰῶνος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/040.yaml
  text: Therefore[a], just as the weeds are gathered and burned with fire[b], so it will be at the end of the age.
translation:
  language: vi
  text: Vậy, cỏ dại[a] được thu gom và đốt trong lửa thế nào, thì vào lúc thời đại kết thúc[b] cũng sẽ như thế ấy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Theo cách gọi truyền thống, “cỏ lùng.” Từ Hy Lạp chỉ một loại cỏ có hại, có lẽ là cỏ lùng.
    reason: lexical_alternative
  - marker: b
    text: 'Hoặc: “vào lúc tận thế”; sát nghĩa, “vào lúc thời đại kết thúc.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ὥσπερ οὖν
  choice: Vậy, như
  rationale: “Như” mở đầu phép so sánh, còn “vậy” giữ quan hệ suy luận hoặc tiếp nối với lời giải thích ngay trước đó.
- source_word: συλλέγεται
  choice: bị gom lại
  rationale: Động từ hiện tại ở thể bị động diễn tả việc cỏ dại bị thu gom; “gom lại” tự nhiên trong ngữ cảnh nông nghiệp.
- source_word: τὰ ζιζάνια
  choice: cỏ dại
  rationale: Từ này chỉ loại cỏ có hại, có lẽ là cỏ lùng. “Cỏ dại” rõ nghĩa với độc giả hiện đại và không xác định loài cây chắc chắn hơn nguồn văn bản.
- source_word: πυρὶ καίεται
  choice: đốt bằng lửa
  rationale: Giữ rõ cả động từ “đốt” lẫn danh từ “lửa”; “bằng” thể hiện cách hiểu công cụ của cách dữ cách πυρί mà không diễn giải thêm.
- source_word: οὕτως ἔσται
  choice: cũng sẽ như vậy
  rationale: Diễn đạt tự nhiên sự tương ứng giữa hình ảnh cỏ bị đốt và điều sẽ xảy ra trong tương lai.
- source_word: ἐν τῇ συντελείᾳ
  choice: vào lúc … kết thúc
  rationale: Diễn đạt dễ hiểu ý nghĩa về điểm hoàn tất hoặc chung cuộc, tránh từ ngữ quá chuyên môn như “thời viên mãn”.
- source_word: τοῦ αἰῶνος
  choice: thời đại
  rationale: αἰών ở đây mang nghĩa thời kỳ hoặc thời đại, không nhất thiết chỉ thế giới vật chất. Không thêm “này” vì nguyên văn không có đại từ chỉ định.
theological_decisions:
- issue: Cụm từ cánh chung συντελείᾳ τοῦ αἰῶνος
  choice: vào lúc thời đại kết thúc
  alternative: vào lúc tận thế
  rationale: Cách dịch đã chọn giữ sắc thái thời gian của αἰών và không đồng nhất cụm từ này với sự hủy diệt thế giới vật chất hay áp đặt một hệ thống cánh chung cụ thể.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cấu trúc so sánh “như … thì … cũng” tái hiện rõ quan hệ ὥσπερ … οὕτως. Dùng “cỏ dại” trong chính văn thay vì thuật ngữ truyền thống ít quen thuộc, đồng thời ghi nhận “cỏ lùng” trong chú thích.
