review_pass:
  verdict: revise
  source_fidelity: 'Bản nháp truyền đạt đúng các thành tố chính của Hy Lạp: quan hệ suy luận và so sánh (ὥσπερ οὖν ... οὕτως), cỏ dại được thu gom, bị đốt, và thời điểm chung cuộc của “thời đại” (τοῦ αἰῶνος). Tuy nhiên, trật tự cụm so sánh trong câu hiện tại khiến “cũng sẽ như vậy” đứng sau cụm chỉ thời gian một cách hơi gượng. “Đốt trong lửa” là cách diễn đạt Việt ngữ tự nhiên hơn “đốt bằng lửa”, đồng thời vẫn để ngỏ sắc thái của cách dữ πυρί.'
  naturalness: 'Cần chỉnh nhẹ để câu so sánh song hành và tự nhiên trong tiếng Việt hiện đại: “... thế nào, thì ... cũng sẽ như thế ấy.” “Được thu gom” phù hợp ngữ cảnh hơn “bị gom lại” mà không làm thay đổi thể bị động.'
  terminology: “Cỏ dại” là lựa chọn rõ ràng, không khẳng định quá mức một loài thực vật; chú thích “cỏ lùng” ghi nhận cách gọi truyền thống và khả năng là darnel. “Thời đại” giữ đúng nghĩa thời gian của αἰών, không chuyển thành “thế giới.” Chú thích về “tận thế” cần nêu đây là cách dịch khác, trong khi bản dịch sát nghĩa vẫn là sự kết thúc của thời đại.
