id: MAT.13.13
reference: Matthew 13:13
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: διὰ τοῦτο ἐν παραβολαῖς αὐτοῖς λαλῶ, ὅτι βλέποντες οὐ βλέπουσιν καὶ ἀκούοντες οὐκ ἀκούουσιν οὐδὲ συνίουσιν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/013.yaml
  text: For this reason I speak to them in parables[a], because seeing they do not see, and hearing they do not hear, nor do they understand.
translation:
  language: vi
  text: Vì thế, tôi nói với họ bằng các dụ ngôn, vì họ nhìn mà không thấy, nghe mà không nghe, cũng không hiểu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “dù nhìn, họ không thấy; dù nghe, họ không nghe, cũng không hiểu.”'
    reason: Ghi nhận khả năng hiểu hai phân từ Hy Lạp theo sắc thái nhượng bộ.
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Vì thế
  rationale: Diễn đạt tự nhiên quan hệ nguyên nhân/hệ quả của cụm từ Hy Lạp mà không làm nó mạnh thành một kết luận thuần suy diễn.
- source_word: ἐν παραβολαῖς
  choice: dùng các dụ ngôn
  rationale: Trong tiếng Việt, “dùng các dụ ngôn mà nói” diễn đạt tự nhiên phương thức nói do ἐν với cách dữ cách chỉ ra; “dụ ngôn” là thuật ngữ quen thuộc và chính xác.
- source_word: αὐτοῖς λαλῶ
  choice: tôi ... nói với họ
  rationale: Giữ ngôi thứ nhất, thì hiện tại và đối tượng gián tiếp của nguyên văn, đồng thời sắp xếp câu theo cú pháp Việt tự nhiên.
- source_word: ὅτι
  choice: bởi vì
  rationale: Hiểu ὅτι theo nghĩa nguyên nhân trong mạch văn, nêu lý do Chúa Giê-su nói với họ bằng dụ ngôn.
- source_word: βλέποντες οὐ βλέπουσιν
  choice: họ nhìn mà không thấy
  rationale: Giữ nghịch lý giữa hành vi nhìn và sự không nhận thấy; cấu trúc “mà không” tự nhiên trong tiếng Việt và không giải thích quá mức loại thị giác nào được nói đến.
- source_word: ἀκούοντες οὐκ ἀκούουσιν
  choice: nghe mà không nghe
  rationale: Giữ phép song hành và sự lặp từ có chủ ý trong nguyên văn, không diễn giải thành “không chịu nghe” hay “không nghe hiểu”.
- source_word: οὐδὲ συνίουσιν
  choice: cũng không hiểu
  rationale: “Cũng không” tiếp nối chuỗi phủ định; “hiểu” diễn đạt rõ συνίημι là nắm được ý nghĩa mà không thêm một phán đoán thần học về nguyên nhân.
theological_decisions:
- issue: Sắc thái của các phân từ βλέποντες và ἀκούοντες
  choice: Dịch bằng cấu trúc “nhìn mà không thấy, nghe mà không nghe”
  alternative: “dù nhìn, họ không thấy; dù nghe, họ không nghe”
  rationale: Cấu trúc chính giữ gần hình thức Hy Lạp và bảo tồn nghịch lý mà không bắt buộc phân từ phải mang nghĩa nhượng bộ. Chú thích ghi nhận cách hiểu nhượng bộ hợp lệ.
- issue: Ý nghĩa của συνίουσιν
  choice: “hiểu”
  alternative: “thấu hiểu” hoặc “nhận thức”
  rationale: “Hiểu” bao quát sự không nắm được ý nghĩa trong ngữ cảnh, đồng thời tránh đưa thêm khẳng định về tình trạng tâm linh hoặc mức độ có lỗi mà câu này không nói rõ.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Giữ phép lặp “nhìn/không thấy” và “nghe/không nghe” để bảo tồn nhịp điệu cùng nghịch lý của nguyên văn; không diễn giải thành sự khác biệt minh nhiên giữa giác quan thể chất và nhận thức tâm linh.
