revisions:
- from: Còn người được gieo trên nơi đất đá[a] là người nghe lời ấy và lập tức vui mừng đón nhận,
  to: Còn người được gieo trên đất đá là người nghe lời và lập tức vui mừng đón nhận lời ấy,
  rationale: Sửa cấu trúc không tự nhiên “trên nơi đất đá” thành “trên đất đá”; làm rõ tân ngữ quy chiếu về “lời”; và điều chỉnh chú thích để nêu lựa chọn sát nguyên văn mà không thêm ý. Câu vẫn giữ phép ẩn dụ khác thường của nguyên văn, không diễn giải thành hạt giống tượng trưng cho người nghe.
