    text: 'Hay, sát nguyên văn hơn: “người được gieo trên những nơi đất đá.”'
    reason: lexical_alternative
  revision_rationale: Sửa cấu trúc không tự nhiên “trên nơi đất đá” thành “trên đất đá”; làm rõ tân ngữ quy chiếu về “lời”; và điều chỉnh chú thích để nêu lựa chọn sát nguyên văn mà không thêm ý. Câu vẫn giữ phép ẩn dụ khác thường của nguyên văn, không diễn giải thành hạt giống tượng trưng cho người nghe.
