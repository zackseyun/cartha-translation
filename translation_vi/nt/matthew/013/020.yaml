  text: ὁ δὲ ἐπὶ τὰ πετρώδη σπαρείς, οὗτός ἐστιν ὁ τὸν λόγον ἀκούων καὶ εὐθὺς μετὰ χαρᾶς λαμβάνων αὐτόν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/020.yaml
  text: As for the one sown on the rocky ground[a], this is the one who hears the word and immediately receives it with joy,
translation:
  language: vi
  text: Còn người được gieo trên đất đá là người nghe lời và lập tức vui mừng đón nhận lời ấy,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δὲ ἐπὶ τὰ πετρώδη σπαρείς
  choice: Còn người được gieo trên nơi đất đá
  rationale: 'Dùng “Còn” để thể hiện δέ như một chuyển ý nhẹ. Cụm phân từ có mạo từ được dịch theo nghĩa danh từ, giữ nguyên hình ảnh cô đọng trong tiếng Hy Lạp: người nghe được nói đến như “người được gieo”, thay vì giải thích thành hạt giống tượng trưng cho người ấy.'
- source_word: πετρώδη
  choice: nơi đất đá
  rationale: Diễn tả địa hình nhiều đá, ít đất theo hình ảnh nông nghiệp của dụ ngôn; tự nhiên trong tiếng Việt mà vẫn gần với dạng số nhiều mang tính khu vực của tiếng Hy Lạp.
- source_word: σπαρείς
  choice: được gieo
  rationale: Giữ thể bị động và ẩn dụ gieo giống của phân từ aorist σπείρω, không diễn giải thêm tác nhân.
- source_word: οὗτός ἐστιν
  choice: là người
  rationale: Thể hiện mệnh đề đồng nhất một cách tự nhiên trong tiếng Việt; danh từ “người” được đưa vào để nối rõ với mệnh đề quan hệ tiếp theo mà không biến câu thành lời giải nghĩa quá mức.
- source_word: ὁ τὸν λόγον ἀκούων
  choice: người nghe lời ấy
  rationale: Chuyển phân từ hiện tại thành kết cấu danh từ–động từ tự nhiên. “Lời ấy” giữ thuật ngữ λόγος và chỉ về lời được nêu trong ngữ cảnh, thay vì diễn giải thành “sứ điệp”.
- source_word: εὐθὺς
  choice: lập tức
  rationale: Tương đương rõ ràng, trang trọng vừa phải, giữ sự nhấn mạnh về phản ứng nhanh chóng.
- source_word: μετὰ χαρᾶς
  choice: vui mừng
  rationale: Cách diễn đạt trạng thái cảm xúc tự nhiên trong tiếng Việt, bảo toàn ý niềm vui của χαρά mà tránh lối dịch cứng “với sự vui mừng”.
- source_word: λαμβάνων αὐτόν
  choice: đón nhận
  rationale: Trong ngữ cảnh tiếp nhận lời, “đón nhận” diễn đạt cả việc nhận và thái độ tiếp nhận; tiếng Việt không cần đại từ tân ngữ vì đối tượng “lời ấy” đã rõ ngay trước đó.
theological_decisions:
- issue: Đối tượng của cụm “người được gieo” trong phần giải thích dụ ngôn
  choice: Giữ cách nói “người được gieo trên nơi đất đá”, rồi để phần sau xác định đó là người nghe lời.
  alternative: Diễn giải thành “Hạt giống gieo trên đất đá tượng trưng cho người nghe lời...”
  rationale: Nguyên văn Hy Lạp cô đọng ẩn dụ bằng cách gọi chính người ấy là “người được gieo”. Bản dịch giữ sự căng giữa hạt giống, đất và người nghe, thay vì âm thầm giải quyết bằng một câu diễn giải.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Câu giữ cấu trúc ẩn dụ khác thường của nguyên văn; dấu phẩy cuối câu được giữ vì câu tiếp tục sang câu 21.
