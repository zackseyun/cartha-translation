id: MAT.13.12
reference: Matthew 13:12
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὅστις γὰρ ἔχει, δοθήσεται αὐτῷ καὶ περισσευθήσεται· ὅστις δὲ οὐκ ἔχει, καὶ ὃ ἔχει ἀρθήσεται ἀπ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/012.yaml
  text: For whoever has[a], more will be given to him, and he will have an abundance; but whoever does not have[b], even what he has will be taken from him.
translation:
  language: vi
  text: Vì ai có, sẽ được ban thêm và sẽ có dư dật; nhưng ai không có, thì ngay cả điều mình có cũng sẽ bị lấy đi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “sẽ được ban cho người ấy và người ấy sẽ dư dật”; các đại từ giống đực số ít trong tiếng Hy Lạp được dùng theo nghĩa đại diện chung.'
    reason: lexical_alternative_and_cultural_note
lexical_decisions:
- source_word: ὅστις
  choice: ai
  rationale: Đại từ quan hệ bất định nêu một nguyên tắc chung; cấu trúc “ai... thì...” tự nhiên trong tiếng Việt và giữ được ý nghĩa áp dụng cho bất cứ người nào.
- source_word: γὰρ
  choice: Vì
  rationale: Giữ chức năng giải thích của câu này đối với lời ngay trước đó.
- source_word: ἔχει
  choice: có
  rationale: Dịch trực tiếp động từ sở hữu và không bổ sung đối tượng, đúng như bản Hy Lạp.
- source_word: δοθήσεται αὐτῷ
  choice: sẽ được ban thêm
  rationale: Động từ ở thể bị động có nghĩa là “sẽ được ban cho”; “thêm” được diễn đạt từ quan hệ đối chiếu và vế nói đến sự dư dật, giúp câu tiếng Việt đầy đủ tự nhiên mà không xác định vật được ban.
- source_word: περισσευθήσεται
  choice: sẽ có dư dật
  rationale: Diễn đạt kết quả là ở trong tình trạng dồi dào; cách nói trang trọng, rõ nghĩa và tự nhiên hơn lối dịch sát cứng “sẽ dư dật”.
- source_word: δὲ
  choice: nhưng
  rationale: Thể hiện rõ sự tương phản giữa hai vế.
- source_word: οὐκ ἔχει
  choice: không có
  rationale: Giữ nguyên sự phủ định và tiếp tục để đối tượng hàm ẩn.
- source_word: καὶ ὃ ἔχει
  choice: ngay cả điều mình đang có cũng
  rationale: “Ngay cả... cũng” truyền đạt sắc thái tăng tiến của καί và làm nổi bật nghịch lý; “đang” giúp phân biệt cái hiện có với điều sẽ bị lấy đi.
- source_word: ἀρθήσεται ἀπ’ αὐτοῦ
  choice: sẽ bị lấy đi
  rationale: Giữ thể bị động và ý nghĩa bị tước khỏi người ấy; tiếng Việt không cần lặp đại từ sở hữu vì chủ thể quy chiếu đã rõ.
- source_word: αὐτῷ / αὐτοῦ
  choice: được ban thêm / bị lấy đi
  rationale: Tiếng Việt có thể lược đại từ gián tiếp và dùng “mình” trong mệnh đề phụ mà vẫn duy trì quy chiếu số ít chung, tránh gán giới tính không được đánh dấu tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Đối tượng hàm ẩn của “có” và “được ban”
  choice: Không nêu đối tượng trong bản văn chính.
  alternative: Giải thích cụ thể là sự hiểu biết, lòng tiếp nhận, hoặc sự hiểu biết về các mầu nhiệm của Nước Trời.
  rationale: Văn cảnh liên quan đến khả năng tiếp nhận lời dạy của Đức Giê-su, nhưng nguyên văn cố ý không nói rõ đối tượng; bản dịch giữ độ mở và sức khái quát của câu.
- issue: Ý nghĩa của περισσευθήσεται
  choice: Dịch là “sẽ có dư dật”, chỉ tình trạng kết quả.
  alternative: Dịch sát hình thức hơn là “sẽ dư dật” hoặc diễn giải “sẽ có nhiều hơn mức cần thiết”.
  rationale: Cách chọn không xác định thứ gì trở nên dư dật, nhờ đó giữ nguyên sự căng mở về ý nghĩa thần học của lời nói.
- issue: Đại từ giống đực số ít dùng theo nghĩa đại diện
  choice: Dùng cấu trúc tiếng Việt chung giới “ai... mình”, không thêm giới tính.
  alternative: Dùng “người ấy” hoặc “người đó” trong cả hai vế.
  rationale: Tiếng Hy Lạp có hình thức giống đực số ít trong cấu trúc đại diện; tiếng Việt không có đối lập giống ngữ pháp tương ứng. Cách dịch chung giới bảo toàn số ít và phạm vi phổ quát mà không nhập thêm giới tính vào tiếng Việt.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cấu trúc “ai... thì...” mang sắc thái châm ngôn tự nhiên; “ban” phù hợp văn cảnh thần học mà không nêu rõ tác nhân, còn “dư dật” giữ sắc thái trang nghiêm của περισσεύω.
