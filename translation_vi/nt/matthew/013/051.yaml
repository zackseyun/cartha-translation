  text: ⸀Συνήκατε ταῦτα πάντα; λέγουσιν αὐτῷ· ⸀Ναί.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/051.yaml
  text: Have you understood all these things? They said to him[a], “Yes.”
translation:
  language: vi
  text: '“Anh em đã hiểu tất cả những điều này chưa?” Họ đáp Người: “Vâng.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Συνήκατε
  choice: đã hiểu ... chưa
  rationale: Động từ aorist chỉ định ngôi thứ hai số nhiều, trong câu hỏi, hướng đến việc các môn đồ đã đạt được sự hiểu biết về những lời vừa nghe hay chưa. Cấu trúc “đã ... chưa?” vừa tự nhiên trong tiếng Việt vừa giữ được sắc thái nhìn lại đến thời điểm này.
- source_word: ταῦτα πάντα
  choice: tất cả những điều này
  rationale: Diễn đạt rõ tổ hợp đại từ chỉ định trung tính số nhiều với πᾶς, quy chiếu đến toàn bộ những điều và các dụ ngôn vừa được dạy.
- source_word: λέγουσιν αὐτῷ
  choice: Họ thưa với Ngài
  rationale: Hiện tại lịch sử của tiếng Hy Lạp được chuyển sang lối kể tự nhiên trong tiếng Việt. “Thưa” phù hợp với lời đáp kính trọng của môn đồ dành cho Đức Giê-su; “với Ngài” giữ lại bổ ngữ αὐτῷ mà không thêm danh xưng không có trong nguyên văn.
- source_word: Ναί
  choice: Vâng
  rationale: Giữ nguyên câu đáp khẳng định đơn giản. “Vâng” tự nhiên và thể hiện sự kính trọng trong tiếng Việt, nhưng không thêm danh xưng như “Chúa” vốn không có trong bản Hy Lạp.
theological_decisions:
- issue: Có nên thêm danh xưng tôn kính vào câu trả lời của các môn đồ hay không
  choice: Chỉ dịch lời đáp là “Vâng.”
  alternative: “Vâng, lạy Chúa.”
  rationale: Nguyên văn chỉ có tiểu từ khẳng định Ναί, nên không thêm danh xưng hay nội dung sùng kính từ truyền thống dịch thuật.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “các con” thể hiện quan hệ thầy–trò trong ngữ cảnh; “Ngài” và động từ “thưa” duy trì sự kính trọng. Không đặt chú thích vì phương án “đã hiểu ... chưa?” đã diễn đạt tự nhiên chính sắc thái của aorist trong tiếng Việt; cách hiểu gần với hiện tại vẫn không bị loại trừ hoàn toàn.
