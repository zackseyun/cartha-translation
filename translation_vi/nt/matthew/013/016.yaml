revisions:
- from: Nhưng mắt các con thật có phước vì thấy, và tai các con thật có phước vì nghe.[a]
  to: Nhưng mắt các con có phước, vì chúng thấy; tai các con có phước, vì chúng nghe.
  rationale: Bản sửa bỏ yếu tố nhấn mạnh không có trong nguồn, duy trì hai mệnh đề song hành tương ứng với οἱ ὀφθαλμοὶ... καὶ τὰ ὦτα..., và giữ quan hệ nguyên nhân của ὅτι bằng “vì”. Đại từ “chúng” chỉ rõ mắt và tai lần lượt là chủ thể của “thấy” và “nghe”, không thêm ý “hiểu” hay “nhận biết”. Chú thích được bỏ vì không có biến thể ngữ nghĩa cần thiết để ghi chú trong tiếng Việt.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T02:47:23Z'
review_pass:
  verdict: revise
  source_fidelity: Bản nháp giữ đúng sự tương phản của δέ, ý nghĩa phúc lành của μακάριοι, và các động từ đơn giản “thấy/nghe”. Tuy nhiên, từ nhấn mạnh “thật” không có trong nguyên văn. Cấu trúc lặp lại “thật có phước” cũng làm yếu tính song hành cô đọng của câu Hy Lạp.
  naturalness: “Mắt các con có phước” và “tai các con có phước” có thể hiểu được, nhưng cần cấu trúc song hành rõ ràng hơn; thêm “chúng” sau “vì” giúp câu tiếng Việt tự nhiên và không mơ hồ về chủ thể của “thấy/nghe”.
  terminology: “Có phước” chuyển đạt μακάριοι phù hợp trong văn phong Kinh Thánh Việt ngữ. “Các con” là cách xưng hô khả dĩ trong lời trực tiếp của Đức Chúa Jêsus với các môn đồ; không cần thêm diễn giải thuộc linh vào “thấy” hay “nghe”.
  issues:
  - severity: low
    issue: Từ “thật” thêm sắc thái nhấn mạnh không được biểu thị trong μακάριοι.
    rationale: Nguyên văn chỉ khẳng định “có phước/phước cho”, không có trạng từ tương đương “thật”.
  - severity: low
    issue: Chú thích không trình bày một lựa chọn dịch thuật thực chất trong tiếng Việt và lại lặp/đổi cấu trúc câu không cần thiết.
    rationale: Cả “vì” và “bởi” đều chỉ là biến thể văn phong cho quan hệ nguyên nhân của ὅτι; chú thích hiện có không giúp làm sáng tỏ một mơ hồ còn lại của bản văn.
  revised_text: Nhưng mắt các con có phước, vì chúng thấy; tai các con có phước, vì chúng nghe.
