id: MAT.13.16
reference: Matthew 13:16
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὑμῶν δὲ μακάριοι οἱ ὀφθαλμοὶ ὅτι βλέπουσιν, καὶ τὰ ὦτα ὑμῶν ὅτι ⸀ἀκούουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/016.yaml
  text: But blessed are your eyes[a], because they see, and your ears, because they hear.
translation:
  language: vi
  text: Nhưng mắt các con có phước, vì chúng thấy; tai các con có phước, vì chúng nghe.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: Nhưng
  rationale: Đánh dấu sự tương phản với những người nhìn mà không thấy và nghe mà không hiểu trong các câu trước.
- source_word: μακάριοι
  choice: thật có phước
  rationale: Diễn đạt tình trạng được ban phước, thay vì chỉ cảm giác vui sướng chủ quan; từ “thật” giúp câu tiếng Việt tự nhiên khi vị ngữ đứng sau danh từ.
- source_word: οἱ ὀφθαλμοὶ ὑμῶν
  choice: mắt các con
  rationale: Cách nói tự nhiên trong tiếng Việt và giữ sự nhấn mạnh vào chính mắt của các môn đồ.
- source_word: ὅτι βλέπουσιν
  choice: vì thấy
  rationale: Hiểu ὅτι theo nghĩa nguyên nhân; tiếng Việt có thể lược đại từ chủ ngữ mà vẫn rõ mắt là chủ thể của hành động thấy.
- source_word: τὰ ὦτα ὑμῶν
  choice: tai các con
  rationale: Giữ cấu trúc song song tự nhiên với “mắt các con”.
- source_word: ὅτι ἀκούουσιν
  choice: vì nghe
  rationale: Hiểu ὅτι theo nghĩa nguyên nhân và giữ động từ cảm giác đơn giản của nguyên văn.
- source_word: βλέπουσιν / ἀκούουσιν
  choice: thấy / nghe
  rationale: Giữ ngôn ngữ cảm giác theo nghĩa trực tiếp, đồng thời để văn mạch truyền đạt chiều kích thuộc linh mà không diễn giải thêm.
theological_decisions:
- issue: Có nên nói rõ việc thấy và nghe là sự nhận biết thuộc linh hay không
  choice: Giữ nguyên ngôn ngữ trực tiếp “thấy” và “nghe”, không thêm “hiểu” hay “nhận biết”.
  alternative: Dịch là “nhận biết” và “thấu hiểu”.
  rationale: Câu này chỉ nói mắt thấy và tai nghe; chiều kích hiểu biết sâu hơn được văn mạch cung cấp. Cách dịch này bảo toàn sự căng thẳng thần học của đoạn văn.
- issue: Quan hệ ngữ nghĩa của ὅτι
  choice: Dịch theo nghĩa nguyên nhân là “vì”.
  alternative: 'Có thể hiểu theo nghĩa nội dung: “có phước là mắt các con được thấy và tai các con được nghe”.'
  rationale: Trong văn cảnh, cách hiểu nguyên nhân phù hợp nhất, nhưng chú thích giữ lại khả năng diễn đạt khác của liên từ Hy Lạp.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “các con” cho ὑμῶν trong lời Đức Chúa Jêsus nói trực tiếp với các môn đồ; giữ phép nhân hóa tự nhiên của nguyên văn khi gọi mắt và tai là có phước.
