- from: 'Khi về quê nhà, Ngài dạy họ trong hội đường của họ, khiến họ kinh ngạc và nói: “Người này có được sự khôn ngoan và những việc quyền năng[a] ấy từ đâu?”'
  to: 'Ngài trở về quê nhà, dạy họ trong hội đường của họ, khiến họ kinh ngạc và nói: “Người này lấy đâu ra sự khôn ngoan này và những việc quyền năng[a] ấy?”'
