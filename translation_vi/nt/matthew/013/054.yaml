reference: Matthew 13:54
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἐλθὼν εἰς τὴν πατρίδα αὐτοῦ ἐδίδασκεν αὐτοὺς ἐν τῇ συναγωγῇ αὐτῶν, ὥστε ἐκπλήσσεσθαι αὐτοὺς καὶ λέγειν· Πόθεν τούτῳ ἡ σοφία αὕτη καὶ αἱ δυνάμεις;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/054.yaml
  text: And coming to his hometown[a], he was teaching them in their synagogue, so that they were astonished and said, “Where did this man get this wisdom and these powers?”
translation:
  language: vi
  text: 'Ngài trở về quê nhà, dạy họ trong hội đường của họ, khiến họ kinh ngạc và nói: “Người này lấy đâu ra sự khôn ngoan này và những việc quyền năng[a] ấy?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn là “các quyền năng”; trong văn cảnh, từ này thường chỉ những việc làm biểu lộ quyền năng và thường được hiểu là các phép lạ.
    reason: lexical_alternative
lexical_decisions:
- source_word: πατρίδα
  choice: quê nhà
  rationale: Trong bối cảnh này, từ này chỉ nơi Đức Giê-su lớn lên và được dân địa phương biết đến, chứ không phải một quốc gia; “quê nhà” tự nhiên và đúng sắc thái địa phương.
- source_word: ἐδίδασκεν
  choice: dạy
  rationale: Thì vị hoàn biểu thị hành động đang diễn ra trong quá khứ; trong cấu trúc tiếng Việt “Khi về quê nhà, Ngài dạy...”, động từ “dạy” diễn đạt tự nhiên hoạt động đang được thuật lại mà không cần thêm từ nặng nề.
- source_word: συναγωγῇ
  choice: hội đường
  rationale: Trong bối cảnh Do Thái, đây là nơi cộng đồng hội họp để thờ phượng và học Kinh Thánh; “hội đường” là cách gọi tiếng Việt rõ ràng và quen thuộc.
- source_word: ὥστε ἐκπλήσσεσθαι αὐτοὺς καὶ λέγειν
  choice: khiến họ kinh ngạc và nói
  rationale: ὥστε nêu kết quả của việc giảng dạy; “khiến” diễn đạt rõ quan hệ kết quả, còn “kinh ngạc” giữ được cường độ của ἐκπλήσσομαι.
- source_word: Πόθεν
  choice: từ đâu
  rationale: Câu hỏi nhắm đến nguồn gốc của sự khôn ngoan và những việc quyền năng; “từ đâu” vừa sát nghĩa vừa tự nhiên.
- source_word: τούτῳ
  choice: Người này
  rationale: Đại từ chỉ định mang sắc thái giữ khoảng cách trong lời đám đông; “Người này” truyền đạt sắc thái ấy mà không thô tục.
- source_word: σοφία
  choice: sự khôn ngoan
  rationale: Cách dịch trực tiếp, tự nhiên, chỉ sự hiểu biết và khả năng giảng dạy phi thường mà người nghe nhận thấy.
- source_word: δυνάμεις
  choice: những việc quyền năng
  rationale: Danh từ số nhiều có nghĩa gốc liên quan đến quyền năng nhưng trong văn cảnh thường chỉ các hành động biểu lộ quyền năng. “Những việc quyền năng” tự nhiên hơn “các quyền năng” trong tiếng Việt, đồng thời ít diễn giải hơn “các phép lạ”.
theological_decisions:
- issue: Cách dịch δυνάμεις khi nói đến hoạt động phi thường của Đức Giê-su
  choice: những việc quyền năng
  alternative: các quyền năng; các phép lạ
  rationale: Cách dịch này giữ mối liên hệ với ý nghĩa “quyền năng”, đồng thời cho thấy số nhiều chỉ các hành động cụ thể. Nó không áp đặt một thuật ngữ thần học kỹ thuật, còn chú thích bảo tồn cả nghĩa sát chữ lẫn cách hiểu theo văn cảnh.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” để nối chủ thể hàm ẩn trong tiếng Hy Lạp mà không lặp tên Đức Giê-su vốn không xuất hiện trong câu này; giữ “hội đường của họ” để bảo toàn đại từ sở hữu của nguyên văn.
