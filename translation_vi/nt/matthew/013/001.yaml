  yaml_path: translation/nt/matthew/013/001.yaml
  text: On that day Jesus went out of the house and sat beside the sea[a][b].
translation:
  language: vi
  text: Hôm ấy, Giê-su ra khỏi nhà và ngồi bên biển[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Cũng chính hôm ấy,” nếu hiểu cụm từ này nhấn mạnh sự tiếp nối với phần trước, thay vì chỉ đơn thuần đánh dấu thời gian.'
    reason: alternative_reading
  - marker: b
    text: 'Cũng có thể dịch: “gần biển.” Cụm từ Hy Lạp chỉ một vị trí gần biển nhưng không xác định khoảng cách chính xác tới bờ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν τῇ ἡμέρᾳ ἐκείνῃ
  choice: Hôm ấy
  rationale: Đây là cách diễn đạt thời gian tự nhiên trong tiếng Việt hiện đại, giữ nguyên sự quy chiếu đến ngày đang được nói tới mà không tự thêm ý nhấn mạnh “cũng chính ngày ấy”.
- source_word: ἐξελθὼν ... τῆς οἰκίας
  choice: ra khỏi nhà
  rationale: Phân từ bất định ἐξελθών cùng sở hữu cách τῆς οἰκίας diễn tả việc rời khỏi căn nhà; chuyển thành động từ phối hợp là tự nhiên trong tiếng Việt.
- source_word: ὁ Ἰησοῦς
  choice: Đức Chúa Jêsus
  rationale: Dùng hình thức tên riêng và cách xưng gọi trang trọng, quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
- source_word: ἐκάθητο
  choice: ngồi
  rationale: Thể chưa hoàn thành trình bày tư thế đang diễn ra trong khung cảnh; tiếng Việt thường dùng “ngồi” mà không cần thêm từ chỉ tiếp diễn.
- source_word: παρὰ τὴν θάλασσαν
  choice: bên biển
  rationale: παρά với đối cách ở đây chỉ vị trí gần biển; “bên biển” tự nhiên và không xác định quá mức khoảng cách tới bờ.
