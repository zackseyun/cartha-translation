    rationale: ὁ Ἰησοῦς chỉ nêu «Giê-su»; mạo từ Hy Lạp không tương đương với tước hiệu «Đức Chúa». Việc thêm tước hiệu làm thay đổi mức độ xưng gọi và đưa nội dung ngoài câu nguồn.
  - severity: medium
    issue: Cách viết «Jêsus» không phải dạng hiện đại tiêu chuẩn được yêu cầu.
    rationale: «Giê-su» là hình thức phiên chuyển hiện hành, dễ hiểu và phù hợp với tiếng Việt hiện đại.
