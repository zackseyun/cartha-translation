  text: ὁ δὲ ἀποκριθεὶς ⸀εἶπεν· Ὁ σπείρων τὸ καλὸν σπέρμα ἐστὶν ὁ υἱὸς τοῦ ἀνθρώπου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/037.yaml
  text: He answered[a], “The one who sows the good seed is the Son of Man.”
translation:
  language: vi
  text: 'Ngài đáp: “Người gieo hạt giống tốt là Con Người.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: Ngài đáp
  rationale: Phân từ ἀποκριθεὶς kết hợp với động từ εἶπεν tạo công thức dẫn lời theo nghĩa ‘đáp lại mà nói’. Tiếng Việt tự nhiên gộp thành ‘Ngài đáp’, tránh cách dịch rườm rà ‘Ngài đáp và nói’.
- source_word: Ὁ σπείρων
  choice: Người gieo
  rationale: Phân từ hiện tại có mạo từ chỉ người được nhận diện qua hành động gieo; ‘Người gieo’ vừa tự nhiên vừa giữ được cấu trúc giải thích của câu.
- source_word: τὸ καλὸν σπέρμα
  choice: hạt giống tốt
  rationale: καλόν ở đây chỉ phẩm chất tốt, đúng hay có giá trị; σπέρμα là danh từ số ít mang nghĩa tập hợp. ‘Hạt giống tốt’ là cách diễn đạt thông dụng và phù hợp với hình ảnh trong dụ ngôn.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Con Người
  rationale: Đây là danh xưng đặc trưng của Chúa Giê-su trong các sách Phúc Âm, có âm hưởng Đa-ni-ên 7. ‘Con Người’ là cách dịch tiếng Việt đã ổn định, giữ được hình thức danh xưng và sức nặng liên văn bản.
theological_decisions:
- issue: Cách dịch danh xưng Kitô học ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Con Người
  alternative: Đấng thuộc về loài người / Người Phàm
  rationale: Cụm từ này không chỉ mô tả một con người nói chung mà hoạt động như danh xưng tự chỉ của Chúa Giê-su, đồng thời gợi đến hình tượng trong Đa-ni-ên 7. Giữ ‘Con Người’ tránh diễn giải quá mức và bảo tồn sự cộng hưởng thần học của danh xưng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng ‘Ngài’ làm chủ ngữ dẫn lời để phù hợp ngữ cảnh Chúa Giê-su đang giải nghĩa dụ ngôn; câu nói giữ cấu trúc ngắn gọn của nguyên văn Hy Lạp.
