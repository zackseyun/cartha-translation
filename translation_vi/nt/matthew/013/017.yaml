id: MAT.13.17
reference: Matthew 13:17
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀμὴν γὰρ λέγω ὑμῖν ὅτι πολλοὶ προφῆται καὶ δίκαιοι ἐπεθύμησαν ἰδεῖν ἃ βλέπετε καὶ οὐκ εἶδαν, καὶ ἀκοῦσαι ἃ ἀκούετε καὶ οὐκ ἤκουσαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/017.yaml
  text: For truly I say to you that many prophets and righteous people longed to see what you see and did not see it[a], and to hear what you hear and did not hear it.
translation:
  language: vi
  text: 'Vì quả thật, tôi nói với anh em rằng: nhiều nhà tiên tri và người công chính[a] đã khao khát được thấy những điều anh em đang thấy, nhưng đã không thấy; và được nghe những điều anh em đang nghe, nhưng đã không nghe.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “những người công chính.” Tiếng Hy Lạp dùng một tính từ làm danh từ, chỉ những người công chính.'
    reason: Làm rõ cách dùng danh từ của δίκαιοι và cung cấp cách diễn đạt số nhiều sát hơn với hình thức tiếng Hy Lạp.
lexical_decisions:
- source_word: ἀμὴν
  choice: quả thật
  rationale: Trong công thức ἀμὴν λέγω ὑμῖν, “quả thật” truyền đạt lời khẳng định long trọng một cách tự nhiên, thay vì phiên âm “a-men”.
- source_word: γὰρ
  choice: vì
  rationale: Liên từ này nêu lý do giải thích và củng cố lời nói ngay trước đó; “vì” giữ rõ mối liên hệ lập luận.
- source_word: λέγω ὑμῖν
  choice: tôi nói với anh em
  rationale: Cách dịch này giữ cấu trúc trực tiếp của tiếng Hy Lạp; “anh em” phù hợp với nhóm môn đồ số nhiều trong ngữ cảnh.
- source_word: πολλοὶ προφῆται καὶ δίκαιοι
  choice: nhiều nhà tiên tri và người công chính
  rationale: “Nhà tiên tri” là cách gọi tự nhiên trong tiếng Việt; δίκαιοι là tính từ được dùng như danh từ, chỉ những người công chính như một nhóm rộng hơn các nhà tiên tri.
- source_word: ἐπεθύμησαν
  choice: đã khao khát
  rationale: Động từ diễn tả ước muốn mạnh mẽ; “khao khát” truyền đạt đúng cường độ mà không hàm ý ham muốn sai trái.
- source_word: ἰδεῖν ἃ βλέπετε καὶ οὐκ εἶδαν
  choice: được thấy những điều anh em đang thấy mà không được thấy
  rationale: “Được thấy” tự nhiên sau “khao khát” và nhấn mạnh điều họ mong được trải nghiệm; “những điều” giữ đối tượng không được xác định cụ thể như trong nguyên văn.
- source_word: ἀκοῦσαι ἃ ἀκούετε καὶ οὐκ ἤκουσαν
  choice: được nghe những điều anh em đang nghe mà không được nghe
  rationale: Giữ cấu trúc song song thấy/nghe của tiếng Hy Lạp và không bổ sung đối tượng diễn giải ngoài nguyên văn.
theological_decisions:
- issue: Phạm vi nghĩa của δίκαιοι
  choice: Dịch là “người công chính”, song song với “nhà tiên tri” nhưng chỉ một nhóm người rộng hơn.
  alternative: Có thể diễn đạt là “những người sống ngay chính”.
  rationale: Tính từ số nhiều được dùng như danh từ. Bản dịch giữ nguyên phạm trù những người công chính mà không đồng nhất họ với riêng các nhà tiên tri hay thêm một định nghĩa giáo phái.
- issue: Đối tượng của việc thấy và nghe
  choice: Giữ là “những điều anh em đang thấy” và “những điều anh em đang nghe”.
  alternative: Diễn giải thành “Đấng Mê-si”, “Chúa Giê-su” hoặc “những mầu nhiệm của vương quốc”.
  rationale: Ngữ cảnh gợi đến sự mặc khải về vương quốc trong chức vụ của Chúa Giê-su, nhưng chính câu này chỉ dùng các mệnh đề quan hệ. Vì vậy bản dịch không giải quyết thay cho nguyên văn điều vẫn được để ngỏ.
translation_notes:
  register: Văn phong hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh em” để xưng hô với nhóm môn đồ; giữ phép song song “thấy/nghe” và sắc thái khao khát nhưng không đạt được của nguyên văn.
