  to: 'Vì quả thật, tôi nói với anh em rằng: nhiều nhà tiên tri và người công chính[a] đã khao khát được thấy những điều anh em đang thấy, nhưng đã không thấy; và được nghe những điều anh em đang nghe, nhưng đã không nghe.'
