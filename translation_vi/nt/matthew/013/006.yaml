  source_fidelity: 'Bản dịch chuyển tải đúng cấu trúc và ý nghĩa của câu Hy Lạp: hoàn cảnh thời gian (“khi mặt trời mọc lên”), tác động bị động của sức nóng (“bị nắng thiêu”), nguyên nhân (“vì không có rễ”), và kết quả (“khô héo”). “Mầm ấy” làm rõ chủ thể theo ngữ cảnh trước đó mà không thêm ý nghĩa thực chất.'
  naturalness: Câu văn hiện đại, rõ ràng và phù hợp hình ảnh nông nghiệp. Cụm “bị nắng thiêu” và “khô héo” tự nhiên trong tiếng Việt. Dấu chấm phẩy trước “và” hơi trang trọng nhưng vẫn chấp nhận được và không gây trở ngại.
  terminology: “Mặt trời,” “mầm,” “rễ,” và “khô héo” đều phù hợp ngữ cảnh. Chú thích “khô đi” bảo lưu hợp lý phương án từ vựng sát với ἐξηράνθη, không áp đặt diễn giải thần học.
