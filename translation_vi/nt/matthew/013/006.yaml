  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἡλίου δὲ ἀνατείλαντος ἐκαυματίσθη καὶ διὰ τὸ μὴ ἔχειν ῥίζαν ἐξηράνθη.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/006.yaml
  text: But when the sun rose[a], it was scorched, and because it had no root, it withered away.
translation:
  language: vi
  text: Nhưng khi mặt trời mọc lên, mầm ấy bị nắng thiêu; và vì không có rễ nên nó khô héo[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “khô đi.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡλίου δὲ ἀνατείλαντος
  choice: Nhưng khi mặt trời mọc lên
  rationale: Cụm sở hữu cách tuyệt đối diễn tả hoàn cảnh thời gian; “nhưng” chuyển tải sắc thái tiếp nối có phần tương phản của δέ.
- source_word: ἐκαυματίσθη
  choice: bị nắng thiêu
  rationale: Động từ bị động chỉ việc bị sức nóng làm cháy hoặc tổn hại; cách diễn đạt này tự nhiên trong hình ảnh cây non dưới ánh mặt trời.
- source_word: διὰ τὸ μὴ ἔχειν
  choice: vì không có
  rationale: διά đi với động từ nguyên mẫu có mạo từ nêu nguyên nhân; mệnh đề nguyên nhân tiếng Việt giữ rõ quan hệ này.
- source_word: ῥίζαν
  choice: rễ
  rationale: Danh từ số ít trong tiếng Hy Lạp; tiếng Việt dùng “rễ” tự nhiên mà không cần đánh dấu số.
- source_word: ἐξηράνθη
  choice: khô héo
  rationale: Trong ngữ cảnh thực vật, ξηραίνω diễn tả việc khô đi và héo tàn; “khô héo” truyền đạt tự nhiên cả trạng thái lẫn kết quả, đồng thời chú thích bảo lưu phương án sát nghĩa hơn.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “mầm ấy” để làm rõ chủ thể ngầm trong tiếng Hy Lạp theo ngữ cảnh hạt đã nảy mầm; dấu chấm phẩy giúp câu tự nhiên mà vẫn giữ hai diễn tiến liên kết.
