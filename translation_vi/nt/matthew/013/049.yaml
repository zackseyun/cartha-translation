base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/049.yaml
  text: 'So it will be at the end of the age: the angels will go out and separate the wicked from among the righteous,[a]'
translation:
  language: vi
  text: 'Vào lúc thời đại kết thúc[a], sự việc sẽ như vậy: các thiên sứ sẽ đi ra và tách những kẻ gian ác ra khỏi giữa những người công chính.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “vào lúc thời đại hoàn tất.” Từ Hy Lạp αἰών ở đây được dịch là “thời đại”; bản dịch truyền thống thường dùng “thế giới.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως ἔσται
  choice: cũng sẽ như vậy
  rationale: Diễn đạt tự nhiên mối liên hệ giữa hình ảnh trong dụ ngôn và lời giải thích, đồng thời giữ ý tương lai của ἔσται.
- source_word: ἐν τῇ συντελείᾳ τοῦ αἰῶνος
  choice: Đến lúc kết thúc thời đại
  rationale: συντέλεια chỉ sự hoàn tất hay điểm kết thúc; αἰών là một thời đại, không trực tiếp có nghĩa là thế giới vật chất.
- source_word: ἐξελεύσονται οἱ ἄγγελοι
  choice: các thiên sứ sẽ đi ra
  rationale: Trong bối cảnh phán xét chung cuộc, ἄγγελοι chỉ các thiên sứ; “đi ra” phản ánh trực tiếp ἐξέρχομαι và tự nhiên trong tiếng Việt.
- source_word: ἀφοριοῦσιν
  choice: tách
  rationale: Giữ nghĩa phân riêng một nhóm ra khỏi một nhóm khác, ngắn gọn và rõ ràng.
- source_word: τοὺς πονηροὺς
  choice: những kẻ gian ác
  rationale: Tính từ được dùng như danh từ để chỉ những người ác; “gian ác” phù hợp với ngữ cảnh phán xét mà vẫn dễ hiểu.
- source_word: ἐκ μέσου τῶν δικαίων
  choice: khỏi những người công chính
  rationale: “Khỏi” diễn đạt việc tách ra từ giữa một nhóm hỗn hợp; “người công chính” là cách dịch rõ và trang trọng của substantival δίκαιοι.
theological_decisions:
- issue: Ý nghĩa của αἰών trong cụm từ cánh chung
  choice: thời đại
  alternative: thế gian / thế giới
  rationale: Bản dịch giữ nghĩa của αἰών là “thời đại”, tránh khiến câu mặc nhiên khẳng định sự chấm dứt của thế giới vật chất.
- issue: Danh tính của οἱ ἄγγελοι
  choice: các thiên sứ
  alternative: các sứ giả
  rationale: Ngữ cảnh về sự phán xét cuối cùng cho thấy đây là các thiên sứ trên trời, không phải sứ giả loài người.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Cấu trúc “cũng sẽ như vậy” nối tự nhiên với dụ ngôn ở câu trước; không dùng lối diễn đạt cổ như “tận thế” vì dễ làm mất nét nghĩa cụ thể của αἰών.
