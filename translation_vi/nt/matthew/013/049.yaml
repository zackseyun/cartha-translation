  rationale: Bản sửa giữ nguyên ý tương lai và hình ảnh phán xét của nguyên văn, đồng thời làm câu tiếng Việt tự nhiên hơn. Cụm “ra khỏi giữa” khôi phục sắc thái ἐκ μέσου, và chú thích được điều chỉnh để giải thích lựa chọn “thời đại” mà không diễn đạt quá mức về phạm vi ngữ nghĩa của αἰών.
