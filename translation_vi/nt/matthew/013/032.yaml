id: MAT.13.32
reference: Matthew 13:32
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὃ μικρότερον μέν ἐστιν πάντων τῶν σπερμάτων, ὅταν δὲ αὐξηθῇ μεῖζον τῶν λαχάνων ἐστὶν καὶ γίνεται δένδρον, ὥστε ἐλθεῖν τὰ πετεινὰ τοῦ οὐρανοῦ καὶ κατασκηνοῦν ἐν τοῖς κλάδοις αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/032.yaml
  text: It is indeed smaller than all the seeds[a], but when it has grown, it is larger than the garden plants and becomes a tree[b], so that the birds of the sky come and nest in its branches.
translation:
  language: vi
  text: Hạt ấy tuy nhỏ hơn mọi hạt giống, nhưng khi đã lớn lên, lại lớn hơn các cây trồng trong vườn và trở thành một cây, đến nỗi chim trời[a] đến làm tổ giữa những cành của nó.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “chim trên không”; nguyên văn là “các loài chim của bầu trời”.
    reason: lexical_alternative
  - marker: b
    text: Hình ảnh chim trú giữa các cành có thể gợi lại hình ảnh Cựu Ước về một cây lớn biểu trưng cho một vương quốc (chẳng hạn Ê-xê-chi-ên 17:23; Đa-ni-ên 4:12), nhưng câu này không nói rõ ý nghĩa biểu tượng.
    reason: cross_reference
lexical_decisions:
- source_word: μικρότερον ... πάντων τῶν σπερμάτων
  choice: nhỏ hơn mọi hạt giống
  rationale: Giữ nguyên hình thức so sánh hơn của tiếng Hy Lạp thay vì chuyển thành dạng tuyệt đối “nhỏ nhất”, đồng thời không thu hẹp “hạt giống” thành một loại hạt nông nghiệp cụ thể.
- source_word: μέν ... δέ
  choice: quả thật ... nhưng
  rationale: Thể hiện rõ sự tương phản giữa khởi đầu nhỏ bé và kết quả lớn lên, bằng lối diễn đạt tự nhiên trong tiếng Việt hiện đại.
- source_word: ὅταν ... αὐξηθῇ
  choice: khi đã lớn lên
  rationale: Diễn đạt hành động lớn lên như một tiến trình đã đạt đến kết quả trước điều được nói trong mệnh đề tiếp theo.
- source_word: μεῖζον τῶν λαχάνων
  choice: lớn hơn các loại cây trong vườn
  rationale: λάχανα chỉ các cây được trồng trong vườn, gồm rau hoặc cây thân thảo; cách dịch rộng này tránh giới hạn nghĩa vào riêng rau ăn hoặc thảo mộc.
- source_word: γίνεται δένδρον
  choice: trở thành cây thân gỗ
  rationale: δένδρον được phân biệt với các cây trong vườn ở mệnh đề trước. “Cây thân gỗ” truyền đạt hình ảnh một cái cây có cành rõ hơn từ “cây” đứng riêng trong tiếng Việt, nhưng không thêm ý “to lớn” vốn không có trực tiếp trong cụm từ này.
- source_word: ὥστε ἐλθεῖν
  choice: đến nỗi ... đến
  rationale: Thể hiện quan hệ kết quả của ὥστε với động từ nguyên mẫu và giữ được sự lặp tự nhiên của hành động chim bay đến.
- source_word: τὰ πετεινὰ τοῦ οὐρανοῦ
  choice: chim trời
  rationale: Cách nói ngắn gọn, tự nhiên và trang trọng trong tiếng Việt, diễn đạt loài chim thuộc bầu trời mà không hiểu οὐρανός theo nghĩa nơi ngự thiêng liêng.
- source_word: κατασκηνοῦν
  choice: làm tổ
  rationale: Trong ngữ cảnh chim và cành cây, động từ mang nghĩa đến trú hoặc làm tổ; “làm tổ” là cách diễn đạt cụ thể và tự nhiên.
- source_word: ἐν τοῖς κλάδοις αὐτοῦ
  choice: giữa những cành của nó
  rationale: “Giữa những cành” diễn đạt vị trí ở trong tán cành tự nhiên hơn lối dịch máy móc “trong các cành”, còn “của nó” giữ đại từ quy chiếu về cây.
theological_decisions:
- issue: Hình ảnh chim trú giữa các cành của một cây lớn có thể gợi lại hình tượng cây tượng trưng cho vương quốc trong Cựu Ước
  choice: Giữ nguyên hình ảnh trong bản văn chính mà không giải nghĩa biểu tượng
  alternative: Giải thích chim là các dân tộc hoặc các cộng đồng tìm nơi nương náu trong vương quốc Đức Chúa Trời
  rationale: Câu này có thể vang vọng Ê-xê-chi-ên 17:23 và Đa-ni-ên 4:12, nhưng bản văn Hy Lạp không xác định ý nghĩa biểu tượng. Bản dịch vì thế bảo tồn khả năng liên tưởng mà không biến một cách giải thích thành nội dung minh nhiên của câu.
translation_notes:
  register: Ngôn ngữ hiện đại, trang trọng vừa phải và dễ hiểu. Cấu trúc so sánh cùng cặp tương phản được giữ rõ; cách dùng “cây thân gỗ” giúp độc giả tiếng Việt nhận ra sự chuyển đổi từ cây trồng trong vườn sang δένδρον mà không thêm cách giải thích giáo lý.
