source:
  edition: SBLGNT
  text: Ταῦτα πάντα ἐλάλησεν ὁ Ἰησοῦς ἐν παραβολαῖς τοῖς ὄχλοις, καὶ χωρὶς παραβολῆς ⸀οὐδὲν ἐλάλει αὐτοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/034.yaml
  text: Jesus spoke all these things to the crowds in parables[a], and apart from a parable he said nothing to them.
translation:
  language: vi
  text: Đức Giê-su nói với đám đông tất cả những điều ấy bằng các dụ ngôn, và Ngài không nói gì với họ mà không dùng dụ ngôn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Thể chưa hoàn thành của động từ Hy Lạp có thể nhấn mạnh rằng đây là cách Đức Giê-su thường nói với đám đông trong bối cảnh này.
    reason: aspectual_ambiguity
lexical_decisions:
- source_word: Ταῦτα πάντα
  choice: tất cả những điều ấy
  rationale: Giữ cả ý chỉ định của Ταῦτα và ý bao quát của πάντα, đồng thời tự nhiên trong tiếng Việt.
- source_word: ἐλάλησεν
  choice: nói
  rationale: Thì bất định tóm lược việc Đức Giê-su giảng dạy; “nói” là cách diễn đạt tự nhiên và sát nghĩa.
- source_word: ἐν παραβολαῖς
  choice: bằng các dụ ngôn
  rationale: ἐν với cách dữ chỉ phương tiện hoặc cách thức; “bằng” diễn đạt rõ việc Đức Giê-su dùng dụ ngôn để truyền đạt.
- source_word: τοῖς ὄχλοις
  choice: với đám đông
  rationale: “Đám đông” là cách gọi tự nhiên trong văn cảnh và có thể mang nghĩa tập hợp, dù danh từ Hy Lạp ở số nhiều.
- source_word: χωρὶς παραβολῆς
  choice: mà không dùng dụ ngôn
  rationale: Diễn đạt tự nhiên nghĩa “không có/ngoài dụ ngôn”; tiếng Việt không cần ép giữ số ít hình thức của παραβολῆς khi nói về phương thức giảng dạy.
- source_word: οὐδὲν ἐλάλει
  choice: Ngài không nói gì
  rationale: Phủ định được giữ đầy đủ; dạng tự nhiên này trong tiếng Việt có thể diễn đạt hành động mang tính thường lệ theo thể chưa hoàn thành của Hy Lạp.
- source_word: αὐτοῖς
  choice: với họ
  rationale: Đại từ quy chiếu trực tiếp về đám đông, tránh lặp danh từ không cần thiết.
theological_decisions:
- issue: Sắc thái thể chưa hoàn thành của ἐλάλει trong mệnh đề thứ hai
  choice: Diễn đạt trong câu chính là “Ngài không nói gì với họ mà không dùng dụ ngôn,” hiểu theo nghĩa đó là cách Ngài thường nói với đám đông trong bối cảnh này.
  alternative: 'Có thể hiểu đơn thuần như một sự kiện quá khứ: “Ngài đã không nói gì với họ nếu không dùng dụ ngôn.”'
  rationale: Tiếng Việt không bắt buộc đánh dấu thể tiếp diễn hay thường lệ trên động từ. Bản dịch chính giữ lời văn tự nhiên, còn chú thích nêu rõ sắc thái có thể có của thể chưa hoàn thành, không biến câu thành một khẳng định tuyệt đối vượt quá văn cảnh.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Giê-su” và đại từ kính trọng “Ngài”; chọn “dụ ngôn” là thuật ngữ Kinh Thánh quen thuộc. Cấu trúc câu giữ sự song hành và nhấn mạnh của nguyên văn mà không gượng ép theo cú pháp Hy Lạp.
