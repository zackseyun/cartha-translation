source:
  edition: SBLGNT
  text: Πάλιν ὁμοία ἐστὶν ἡ βασιλεία τῶν οὐρανῶν σαγήνῃ βληθείσῃ εἰς τὴν θάλασσαν καὶ ἐκ παντὸς γένους συναγαγούσῃ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/047.yaml
  text: Again[b][a], the kingdom of heaven is like a dragnet cast into the sea and gathering from every kind.
translation:
  language: vi
  text: Một lần nữa, Nước Trời giống như một tấm lưới kéo[a] được thả xuống biển và gom đủ mọi loại[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “một tấm lưới”; từ Hy Lạp cụ thể hơn, chỉ loại lưới lớn được kéo qua nước.
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn: “gom từ mọi loại”; theo hình ảnh đánh cá, “cá” được ngầm hiểu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πάλιν
  choice: Một lần nữa
  rationale: Đánh dấu thêm một dụ ngôn trong chuỗi dụ ngôn; cách nói tự nhiên và trang trọng trong tiếng Việt hiện đại.
- source_word: ὁμοία ἐστὶν
  choice: giống như
  rationale: Giữ nguyên công thức so sánh quen thuộc trong các dụ ngôn về vương quốc.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: vương quốc thiên đàng
  rationale: Bảo tồn cách diễn đạt đặc trưng của Ma-thi-ơ, không đổi thành 'vương quốc Đức Chúa Trời' hay diễn giải thành sự cai trị.
- source_word: σαγήνῃ
  choice: một tấm lưới kéo
  rationale: Từ Hy Lạp chỉ một loại lưới lớn được kéo qua nước; 'lưới kéo' chính xác hơn từ chung chung 'lưới'.
- source_word: βληθείσῃ εἰς τὴν θάλασσαν
  choice: được thả xuống biển
  rationale: Diễn đạt tự nhiên thao tác dùng lưới trong tiếng Việt, đồng thời giữ thể bị động và danh từ 'biển' của nguyên văn.
- source_word: ἐκ παντὸς γένους συναγαγούσῃ
  choice: gom đủ mọi loài
  rationale: Giữ đối tượng không được nêu rõ như nguyên văn; 'đủ mọi loài' truyền đạt ý thu gom từ mọi loại mà không chèn trực tiếp từ 'cá' vào câu.
theological_decisions:
- issue: Ý nghĩa của ἡ βασιλεία τῶν οὐρανῶν
  choice: Giữ cách gọi 'vương quốc thiên đàng'.
  alternative: '''vương quốc Đức Chúa Trời'' hoặc ''sự cai trị của trời'''
  rationale: Nguyên văn Ma-thi-ơ dùng cách nói đặc trưng này; bản dịch không nên thay thế bằng một cách diễn đạt thần học tương đương nhưng khác chữ.
- issue: Đối tượng ngầm hiểu của παντὸς γένους
  choice: Không thêm 'cá' vào chính văn; giải thích trong chú thích.
  alternative: gom đủ mọi loài cá
  rationale: Hình ảnh đánh cá khiến 'cá' được ngầm hiểu rõ, nhưng danh từ ấy không có mặt trong tiếng Hy Lạp. Cách chọn này bảo tồn độ hàm ẩn của nguyên văn.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, rõ ràng và trang trọng vừa phải. Dùng 'vương quốc thiên đàng' để giữ thuật ngữ đặc trưng của Ma-thi-ơ; dùng 'lưới kéo' nhằm tái hiện cụ thể loại lưới. Các dấu chú thích [a], [b] đều được đặt ngay sau cụm từ liên quan trong chính văn.
