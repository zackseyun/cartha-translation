  to: Trong khi người gieo giống đang gieo, một số hạt[a] rơi bên đường, chim chóc đến ăn sạch những hạt ấy.
  rationale: Chỉnh “bay đến” thành “đến” để không thêm cách thức không có trong câu Hy Lạp; thêm “những hạt ấy” để dịch rõ αὐτά; và dùng “bên đường” như cách diễn đạt trực tiếp, hiện đại cho vị trí cạnh con đường. Các yếu tố còn lại được giữ nguyên vì phản ánh đúng ngữ cảnh và sắc thái của bản văn.
