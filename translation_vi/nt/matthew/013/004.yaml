  text: καὶ ἐν τῷ σπείρειν αὐτὸν ἃ μὲν ἔπεσεν παρὰ τὴν ὁδόν, καὶ ⸂ἐλθόντα τὰ πετεινὰ⸃ κατέφαγεν αὐτά.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/004.yaml
  text: And as he was sowing[a], some seeds fell beside the path, and the birds came and devoured them.
translation:
  language: vi
  text: Trong khi người gieo giống đang gieo, một số hạt[a] rơi bên đường, chim chóc đến ăn sạch những hạt ấy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn Hy Lạp sát nghĩa là “một số thứ/vật”; “hạt” được bổ sung theo ngữ cảnh về người gieo giống.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τῷ σπείρειν αὐτὸν
  choice: Trong khi người gieo giống đang gieo
  rationale: Cấu trúc ἐν với động từ nguyên mẫu có mạo từ diễn tả hai hành động xảy ra đồng thời. Nêu lại “người gieo giống” theo ngữ cảnh giúp câu tiếng Việt tự nhiên và rõ chủ thể.
- source_word: ἃ μὲν
  choice: một số hạt[a]
  rationale: Đại từ quan hệ trung tính số nhiều có nghĩa sát là “một số vật/thứ”, ngầm chỉ hạt giống trong ngữ cảnh; thêm “hạt” để tiếng Việt rõ nghĩa, đồng thời ghi chú cách diễn đạt sát chữ.
- source_word: ἔπεσεν
  choice: rơi
  rationale: Thì aorist trong lời kể được diễn đạt tự nhiên bằng động từ chỉ sự việc đã xảy ra; tiếng Việt không cần đánh dấu thì riêng.
- source_word: παρὰ τὴν ὁδόν
  choice: bên vệ đường
  rationale: παρά với đối cách chỉ vị trí ở bên cạnh. “Bên vệ đường” tự nhiên trong bối cảnh gieo giống và giữ ý không rơi trên phần đường đi.
- source_word: ἐλθόντα τὰ πετεινὰ
  choice: chim chóc bay đến
  rationale: Phân từ aorist được chuyển thành động từ nối tiếp trong tiếng Việt. πετεινά chỉ các loài chim hay sinh vật biết bay; “chim chóc” là cách nói tự nhiên, còn “bay đến” thể hiện hành động đến mà không thêm cụm “trên trời” vốn không có trong câu Hy Lạp.
- source_word: κατέφαγεν
  choice: ăn sạch
  rationale: κατεσθίω mang sắc thái ăn hết hoặc nuốt sạch; “ăn sạch” truyền đạt cường độ rõ ràng và tự nhiên hơn “ăn” đơn thuần.
- source_word: αὐτά
  choice: (được hàm chứa trong “ăn sạch”)
  rationale: Đối tượng là các hạt vừa rơi. Tiếng Việt có thể lược đại từ tân ngữ khi sở chỉ đã rõ; lặp “chúng” ở đây kém tự nhiên.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “người gieo giống” để xác định chủ thể theo ngữ cảnh, “hạt” thay cho “hạt giống” nhằm tránh lặp nặng, và “ăn sạch” để giữ sắc thái mạnh của động từ Hy Lạp.
