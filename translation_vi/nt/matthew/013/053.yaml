translation:
  language: vi
  text: Khi Đức Giê-su nói xong những dụ ngôn này, ngài rời khỏi đó.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ ἐγένετο ὅτε
  choice: Khi
  rationale: Cụm này đóng vai trò chuyển tiếp trong trình thuật và mở đầu mệnh đề thời gian. “Khi” diễn đạt tự nhiên mối liên hệ thời gian trong tiếng Việt mà không cần dịch cứng là “và đã xảy ra rằng”.
- source_word: ἐτέλεσεν
  choice: kể xong
  rationale: Động từ có nghĩa hoàn tất hoặc kết thúc. Kết hợp “kể xong” với “dụ ngôn” vừa tự nhiên trong tiếng Việt vừa cho thấy hành động đã hoàn tất trước khi Đức Giê-su rời đi.
- source_word: ὁ Ἰησοῦς
  choice: Đức Giê-su
  rationale: Cách gọi trang trọng, phổ thông và quen thuộc trong văn phong Kinh Thánh tiếng Việt hiện đại.
- source_word: τὰς παραβολὰς ταύτας
  choice: những dụ ngôn ấy
  rationale: “Dụ ngôn” giữ đúng thể loại lời dạy; “ấy” quy chiếu tự nhiên đến loạt dụ ngôn vừa được kể ở phần trước.
- source_word: μετῆρεν
  choice: rời
  rationale: Diễn đạt việc chuyển đi khỏi một địa điểm mà không thêm chi tiết về cách thức hay đích đến.
- source_word: ἐκεῖθεν
  choice: nơi đó
  rationale: Khi đi với “rời,” “nơi đó” là cách diễn đạt tự nhiên cho ý nghĩa ‘từ đó/từ nơi ấy’ của trạng từ Hy Lạp.
theological_decisions: []
translation_notes:
  register: 'Văn phong hiện đại, trang trọng nhưng dễ hiểu. Bản dịch ưu tiên cú pháp tiếng Việt tự nhiên, đồng thời giữ nguyên trình tự: Đức Giê-su hoàn tất các dụ ngôn rồi rời địa điểm ấy.'
