  rationale: Thay «kể xong» bằng «nói xong» để không thêm sắc thái kể chuyện ngoài động từ nguồn, và điều chỉnh «rời khỏi đó» cho tự nhiên. Không cần chú thích vì không có vấn đề văn bản hoặc từ vựng cần giữ lại trong bản dịch.
