id: MAT.13.27
reference: Matthew 13:27
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: προσελθόντες δὲ οἱ δοῦλοι τοῦ οἰκοδεσπότου εἶπον αὐτῷ· Κύριε, οὐχὶ καλὸν σπέρμα ⸀ἔσπειρας ἐν τῷ σῷ ἀγρῷ; πόθεν οὖν ἔχει ζιζάνια;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/027.yaml
  text: So the slaves of the master of the house came to him and said[a], ‘Lord, did you not sow good seed in your field? Where then do the weeds come from?’
translation:
  language: vi
  text: 'Vậy, các nô lệ của chủ nhà đến gặp ông và thưa: “Thưa chủ, chẳng phải ông đã gieo giống tốt trong ruộng mình sao? Thế thì cỏ lùng[a] từ đâu ra?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “cỏ dại”; từ Hy Lạp có lẽ chỉ cỏ lùng, một loại cỏ trông giống lúa mì trong giai đoạn đầu.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσελθόντες
  choice: đến thưa với ông
  rationale: Phân từ aorist diễn tả hành động đi đến trước động từ chính εἶπον; cách diễn đạt này tự nhiên trong tiếng Việt và giữ được hướng chuyển động đến gần chủ nhà.
- source_word: δοῦλοι
  choice: các nô lệ
  rationale: Giữ rõ địa vị lệ thuộc mà δοῦλος biểu thị trong bối cảnh gia chủ và những người thuộc quyền ông, thay vì làm nhẹ thành “đầy tớ” hay “người làm”.
- source_word: οἰκοδεσπότου
  choice: chủ nhà
  rationale: Diễn đạt gọn, tự nhiên ý người đứng đầu và có quyền trong gia đình; quan hệ chủ–nô lệ đã được ngữ cảnh làm rõ.
- source_word: Κύριε
  choice: Thưa chủ
  rationale: Trong lời thoại của dụ ngôn, đây là cách xưng hô kính trọng của các nô lệ với chủ mình. “Thưa Chúa” dễ tạo sắc thái thần học trực tiếp mà ngữ cảnh lời thoại không buộc phải có.
- source_word: οὐχὶ
  choice: chẳng phải ... sao
  rationale: Giữ dạng câu hỏi mong đợi câu trả lời khẳng định và có sắc thái trang trọng tự nhiên.
- source_word: καλὸν σπέρμα
  choice: giống tốt
  rationale: Trong ngữ cảnh nông nghiệp, “giống tốt” tự nhiên hơn “hạt giống tốt” mà vẫn truyền đạt chính xác phẩm chất của hạt đã gieo.
- source_word: ἔσπειρας
  choice: đã gieo
  rationale: Phản ánh chính xác động từ gieo hạt và hành động quá khứ.
- source_word: ἐν τῷ σῷ ἀγρῷ
  choice: trong ruộng mình
  rationale: “Mình” quy chiếu tự nhiên về người được hỏi và giữ ý sở hữu của σῷ.
- source_word: πόθεν οὖν
  choice: Thế thì ... từ đâu
  rationale: Giữ cả câu hỏi về nguồn gốc và quan hệ suy luận do οὖν biểu thị.
- source_word: ἔχει ζιζάνια
  choice: cỏ lùng ... từ đâu ra
  rationale: Tiếng Việt tự nhiên diễn đạt sự xuất hiện/nguồn gốc của cỏ bằng “từ đâu ra”, phù hợp chức năng của πόθεν hơn là bám máy móc cấu trúc “có” của tiếng Hy Lạp.
- source_word: ζιζάνια
  choice: cỏ lùng
  rationale: Tên gọi quen dùng cho loại cỏ dại giống lúa mì khi còn non; cụ thể hơn “cỏ dại” và được giải thích bằng chú thích.
theological_decisions:
- issue: Cách dịch δοῦλοι trong bối cảnh gia đình của dụ ngôn
  choice: các nô lệ
  alternative: các đầy tớ
  rationale: “Nô lệ” giữ nguyên quan hệ pháp lý-xã hội lệ thuộc vào chủ mà từ Hy Lạp biểu thị; câu này không tán thành chế độ ấy mà chỉ mô tả bối cảnh của dụ ngôn.
- issue: Cách dịch κύριε trong lời các nô lệ nói với gia chủ
  choice: Thưa chủ
  alternative: Lạy Chúa; thưa ngài
  rationale: Ở đây κύριε trực tiếp xưng hô với gia chủ trong câu chuyện. “Thưa chủ” bảo toàn quan hệ trong lời thoại mà không áp đặt một tuyên bố Kitô học trực tiếp; khả năng vang vọng nghĩa “Chúa” của κύριος vẫn thuộc sự căng thẳng rộng hơn của dụ ngôn.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Lời xưng hô “Thưa chủ” phù hợp quan hệ xã hội trong dụ ngôn; câu cuối được cấu trúc theo lối nói tự nhiên của tiếng Việt, đồng thời giữ câu hỏi về nguồn gốc của cỏ lùng.
