- from: 'Vậy, các nô lệ của chủ nhà đến thưa với ông: “Thưa chủ, chẳng phải ông đã gieo giống tốt trong ruộng mình sao? Thế thì cỏ lùng[a] từ đâu ra?”'
  to: 'Vậy, các nô lệ của chủ nhà đến gặp ông và thưa: “Thưa chủ, chẳng phải ông đã gieo giống tốt trong ruộng mình sao? Thế thì cỏ lùng[a] từ đâu ra?”'
  rationale: Chỉ điều chỉnh cách nối hai hành động để phản ánh rõ προσελθόντες ... εἶπον, và sửa chú thích để không gán đặc tính “độc” mà nguyên ngữ không nêu. Nghĩa của câu và cách dịch các thuật ngữ chính được giữ nguyên.
  reviewer_model: gpt-5.6-terra
