  - severity: low
    issue: “những vật mới lẫn vật cũ” thu hẹp và diễn đạt mạnh hơn nguyên văn.
    rationale: καινὰ καὶ παλαιά là các tính từ trung tính số nhiều được danh từ hóa, không xác định đó là vật thể. “Những điều mới và cũ” bảo toàn độ mở; καὶ là “và”, không nhất thiết hàm ý pha trộn như “lẫn”.
