  verdict: revise
  source_fidelity: 'Bản dịch phản ánh đúng cấu trúc chính của câu: quan hệ suy luận của Διὰ τοῦτο, hình ảnh kinh sư được hình thành/đào luyện trong tương quan với βασιλεία τῶν οὐρανῶν, phép so sánh với οἰκοδεσπότης, và việc lấy ra các điều mới cùng cũ. Tuy nhiên, “vương quốc thiên đàng” không tự nhiên trong tiếng Việt hiện đại và kém phù hợp với thuật ngữ Kinh Thánh thông dụng cho cụm từ đặc trưng của Ma-thi-ơ. “Những vật” cũng thu hẹp các tính từ trung tính số nhiều καινὰ καὶ παλαιά vào đồ vật cụ thể, trong khi nguyên văn để ngỏ đối tượng.'
  naturalness: Câu văn nhìn chung rõ và trang trọng vừa phải. Thay “vương quốc thiên đàng” bằng “Nước Trời” giúp cách diễn đạt tự nhiên, quen thuộc và nhất quán hơn. Thay “những vật mới lẫn vật cũ” bằng “những điều mới và cũ” giữ hình ảnh kho chứa mà không gán đối tượng vật chất quá cụ thể; liên từ “và” sát với καὶ hơn “lẫn”.
  terminology: Giữ “kinh sư” cho γραμματεύς và “gia chủ” cho οἰκοδεσπότης là phù hợp. Dùng “Nước Trời” cho βασιλεία τῶν οὐρανῶν là thuật ngữ hiện đại, chuẩn trong văn mạch Ma-thi-ơ. “Đã được đào luyện về Nước Trời” vẫn giữ thể bị động của μαθητευθείς và cách hiểu đào luyện/hình thành, đồng thời chú thích bảo lưu khả năng “đã trở thành môn đệ”.
