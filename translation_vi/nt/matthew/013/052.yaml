reference: Matthew 13:52
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτοῖς· Διὰ τοῦτο πᾶς γραμματεὺς μαθητευθεὶς ⸂τῇ βασιλείᾳ⸃ τῶν οὐρανῶν ὅμοιός ἐστιν ἀνθρώπῳ οἰκοδεσπότῃ ὅστις ἐκβάλλει ἐκ τοῦ θησαυροῦ αὐτοῦ καινὰ καὶ παλαιά.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/052.yaml
  text: Then he said to them[c][b][a], “Therefore every scribe who has been trained for the kingdom of heaven is like a master of a house who brings out of his treasure new things and old.”
translation:
  language: vi
  text: 'Ngài phán với họ: “Vì thế, mỗi kinh sư đã được đào luyện về Nước Trời[a] đều giống như một gia chủ[b] lấy từ kho của mình[c] ra những điều mới và cũ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đã trở thành môn đệ của Nước Trời.” Động từ Hy Lạp có thể chỉ việc trở thành hoặc được làm thành môn đệ, cũng như được dạy dỗ, đào luyện.'
    reason: alternative_reading
  - marker: b
    text: 'Hay: “chủ nhà” hoặc “người đứng đầu gia đình.”'
    reason: lexical_alternative
  - marker: c
    text: Từ Hy Lạp được dịch là “kho” cũng có thể chỉ kho báu hoặc nơi cất giữ những vật có giá trị.
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: Vì thế
  rationale: Diễn đạt tự nhiên quan hệ suy luận với phần đối thoại ngay trước đó.
- source_word: πᾶς γραμματεὺς
  choice: mỗi kinh sư
  rationale: “Kinh sư” là cách gọi gọn, quen thuộc trong ngữ cảnh Tân Ước, giữ ý người thông thạo và giảng dạy Kinh Luật mà không thu hẹp thành một chức danh hiện đại.
- source_word: μαθητευθεὶς
  choice: đã được đào luyện
  rationale: Giữ thể bị động và ý nghĩa được huấn luyện, hình thành như một môn đệ; chú thích bảo lưu cách hiểu trực tiếp hơn là “đã trở thành môn đệ”.
- source_word: τῇ βασιλείᾳ τῶν οὐρανῶν
  choice: cho vương quốc thiên đàng
  rationale: Giữ nét định hướng hoặc quy chiếu của cách dùng tặng cách bất thường, không quyết định quá mức giữa “cho” và “liên quan đến” vương quốc.
- source_word: ἀνθρώπῳ οἰκοδεσπότῃ
  choice: một gia chủ
  rationale: Cách nói hiện đại, súc tích, chỉ người đứng đầu và quản lý một gia đình hay cơ nghiệp.
- source_word: ἐκβάλλει
  choice: lấy ... ra
  rationale: Trong ngữ cảnh kho chứa, động từ mang nghĩa đem hoặc lấy ra, không phải cưỡng ép quăng ra.
- source_word: ἐκ τοῦ θησαυροῦ αὐτοῦ
  choice: từ kho của mình
  rationale: “Kho” phù hợp với hình ảnh nơi gia chủ cất giữ và lấy đồ ra; chú thích bảo lưu sắc thái tài vật quý giá của θησαυρός.
- source_word: καινὰ καὶ παλαιά
  choice: những vật mới lẫn vật cũ
  rationale: Các tính từ trung tính số nhiều được danh từ hóa; “những vật” tự nhiên trong hình ảnh gia chủ và giữ nguyên thứ tự mới–cũ.
theological_decisions:
- issue: Ý nghĩa của μαθητευθεὶς trong quan hệ với kinh sư và vương quốc
  choice: Một kinh sư đã được đào luyện cho vương quốc thiên đàng
  alternative: Một kinh sư đã trở thành môn đệ của vương quốc thiên đàng
  rationale: Bản dịch chính giữ ý được hình thành, huấn luyện mà không giới hạn câu vào sự cải đạo hay một cơ chế đào tạo chính thức; chú thích giữ cách hiểu về việc trở thành môn đệ.
- issue: Ý nghĩa của “mới” và “cũ”
  choice: 'Giữ hình ảnh mở: “những vật mới lẫn vật cũ”'
  alternative: Giải thích trực tiếp là giáo huấn mới và Kinh Luật cũ
  rationale: Nguyên văn không xác định cụ thể các vật mới và cũ; không nên đưa một cách giải nghĩa thần học riêng vào chính văn.
- issue: Vai trò của οἰκοδεσπότης
  choice: gia chủ
  alternative: chủ nhà; người đứng đầu gia đình
  rationale: Giữ vai trò quản lý và thẩm quyền trong hình ảnh gia đình nhưng không suy diễn thành một khẳng định giáo lý hay xã hội rộng hơn.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ đọc. “Kinh sư,” “vương quốc thiên đàng” và “gia chủ” duy trì sắc thái bối cảnh Kinh Thánh; cấu trúc câu được sắp xếp tự nhiên theo tiếng Việt. Các dấu chú thích [a]–[c] đặt ngay sau cụm từ liên quan.
