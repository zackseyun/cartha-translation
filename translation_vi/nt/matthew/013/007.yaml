  text: ἄλλα δὲ ἔπεσεν ἐπὶ τὰς ἀκάνθας, καὶ ἀνέβησαν αἱ ἄκανθαι καὶ ⸀ἔπνιξαν αὐτά.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/007.yaml
  text: Other seeds fell among the thorns[a], and the thorns came up and choked them.
translation:
  language: vi
  text: Những hạt khác rơi vào giữa đám gai[a], rồi gai mọc lên và làm chúng nghẹt ngòi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tiếng Hy Lạp sát chữ là “rơi trên đám gai”; trong bối cảnh gieo hạt, dịch là “rơi vào giữa đám gai” cho tự nhiên.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλα
  choice: Những hạt khác
  rationale: Tính từ trung tính số nhiều được dùng như danh từ và ngầm chỉ những hạt giống trong ngữ cảnh dụ ngôn; thêm “hạt” giúp câu tiếng Việt rõ ràng, tự nhiên mà không thêm ý mới.
- source_word: δὲ
  choice: không dịch thành một từ riêng; thể hiện bằng sự tiếp nối của câu
  rationale: Ở đây δέ chỉ nhẹ nhàng chuyển sang trường hợp tiếp theo. Tiếng Việt không cần một liên từ riêng vì trình tự kể chuyện đã rõ.
- source_word: ἔπεσεν
  choice: rơi
  rationale: Giữ nghĩa trực tiếp của πίπτω là “rơi”, thay vì diễn giải thành “được gieo”.
- source_word: ἐπὶ τὰς ἀκάνθας
  choice: rơi vào giữa đám gai
  rationale: ἐπί với đối cách có nghĩa sát chữ là “trên”, nhưng trong bối cảnh gieo hạt, “vào giữa đám gai” diễn đạt tự nhiên vị trí hạt rơi mà vẫn giữ hình ảnh nguyên văn.
- source_word: ἀκάνθας / ἄκανθαι
  choice: đám gai / gai
  rationale: “Gai” là cách gọi phổ thông, bao quát các cây cỏ có gai trong bối cảnh này; “đám gai” tự nhiên khi nói về nơi hạt rơi.
- source_word: ἀνέβησαν
  choice: mọc lên
  rationale: Diễn đạt tự nhiên sự phát triển hướng lên của cây và bám sát hình ảnh của ἀναβαίνω.
- source_word: ἔπνιξαν
  choice: làm ... nghẹt đi
  rationale: Giữ ẩn dụ mạnh của πνίγω là làm nghẹt, thay vì làm nhẹ thành “lấn át” hay “chen lấn”.
- source_word: αὐτά
  choice: chúng
  rationale: Đại từ trung tính số nhiều quy chiếu về những hạt/cây mọc từ hạt; “chúng” giữ cách quy chiếu bằng đại từ của nguyên văn.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Câu được tách tại liên từ καί để nhịp kể tự nhiên trong tiếng Việt; không làm thay đổi quan hệ ý nghĩa.
