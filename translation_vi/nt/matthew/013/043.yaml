id: MAT.13.43
reference: Matthew 13:43
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Τότε οἱ δίκαιοι ἐκλάμψουσιν ὡς ὁ ἥλιος ἐν τῇ βασιλείᾳ τοῦ πατρὸς αὐτῶν. ὁ ἔχων ⸀ὦτα ἀκουέτω.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/043.yaml
  text: Then the righteous will shine like the sun in the kingdom of their Father. The one who has ears, let him hear.
translation:
  language: vi
  text: Bấy giờ, những người công chính sẽ chiếu sáng như mặt trời trong vương quốc của Cha họ. Ai có tai, hãy nghe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hy Lạp dùng lời kêu gọi ở số ít: “Người có tai, hãy nghe.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Bấy giờ
  rationale: Đánh dấu thời điểm trong trình tự cánh chung nối với phần giải thích trước; tự nhiên và trang trọng trong tiếng Việt.
- source_word: οἱ δίκαιοι
  choice: những người công chính
  rationale: Diễn đạt tính từ được danh từ hóa, chỉ những người được kể là công chính; giữ được chiều kích đạo đức và giao ước mà không giải thích quá mức.
- source_word: ἐκλάμψουσιν
  choice: sẽ chiếu sáng
  rationale: Giữ thì tương lai và ý nghĩa 'tỏa/chiếu sáng'; hình ảnh so sánh với mặt trời đã truyền đạt độ rực rỡ.
- source_word: ὡς ὁ ἥλιος
  choice: như mặt trời
  rationale: Cách diễn đạt so sánh tự nhiên, sát với hình ảnh của nguyên văn.
- source_word: ἐν τῇ βασιλείᾳ
  choice: trong vương quốc
  rationale: Cụm giới từ có sắc thái địa điểm; 'vương quốc' phù hợp với ngữ cảnh mà không loại bỏ ý niệm về quyền trị vì.
- source_word: τοῦ πατρὸς αὐτῶν
  choice: của Cha họ
  rationale: Theo sát sở hữu cách trong nguyên văn và không thêm từ 'trên trời' vốn không có trong câu này; viết hoa 'Cha' để chỉ Đức Chúa Trời.
- source_word: ὁ ἔχων ὦτα
  choice: Ai có tai
  rationale: Tiếng Việt không bắt buộc thể hiện giống ngữ pháp; 'Ai có tai' tự nhiên, vẫn là lời kêu gọi mang tính đại diện hướng đến từng người.
- source_word: ἀκουέτω
  choice: hãy nghe
  rationale: Thể hiện mệnh lệnh ngôi thứ ba bằng cấu trúc khuyến lệnh tự nhiên trong tiếng Việt; 'nghe' giữ được lối nói cô đọng và hàm ý chú tâm, vâng theo.
theological_decisions:
- issue: Lời kêu gọi ở số ít mang tính đại diện
  choice: Dịch là “Ai có tai, hãy nghe”
  alternative: Người nào có tai, người ấy hãy nghe
  rationale: Tiếng Việt không có đại từ giống đực tương ứng cần giữ lại; cấu trúc 'Ai... hãy...' hướng đến mỗi cá nhân và bảo toàn chức năng đại diện của số ít mà không áp đặt giới tính sinh học.
- issue: Ý nghĩa của βασιλεία trong ngữ cảnh
  choice: Dịch là “vương quốc”
  alternative: quyền trị vì
  rationale: Cụm 'trong vương quốc của Cha họ' có sắc thái địa điểm rõ ràng và gợi đến thực tại cánh chung nơi người công chính chiếu sáng; cách dịch này không phủ nhận chiều kích cai trị.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ hình ảnh mặt trời, danh xưng “Cha” và lời kêu gọi cô đọng; tránh cách nói quá cổ như “kẻ nào có tai”.
