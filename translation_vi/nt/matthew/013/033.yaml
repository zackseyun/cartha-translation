revisions:
- from: 'Ngài kể cho họ một dụ ngôn khác: “Vương quốc thiên đàng giống như men[a] mà một người phụ nữ lấy, giấu vào[b] ba đấu bột[c], cho đến khi tất cả đều dậy men.”'
  to: 'Ngài kể cho họ một dụ ngôn khác: “Nước Trời giống như men[a] mà một người phụ nữ lấy và giấu vào[b] ba sa-ta bột[c], cho đến khi cả khối bột đều dậy men.”'
  rationale: Sửa đơn vị đo và chú thích để phản ánh chính xác σατά mà không thay bằng đơn vị Việt Nam. Đổi “Vương quốc thiên đàng” thành “Nước Trời” vì đây là thuật ngữ tự nhiên, chuẩn mực trong tiếng Việt cho cách nói đặc trưng của Ma-thi-ơ. Thêm “và” trước “giấu vào” để câu văn trôi chảy; “cả khối bột đều dậy men” diễn đạt tự nhiên phạm vi toàn thể của ὅλον, không áp đặt diễn giải thần học.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T02:47:37Z'
review_pass:
  verdict: revise
  source_fidelity: Bản dịch giữ đúng cấu trúc dụ ngôn, hình ảnh men, hành động “giấu vào,” và kết quả toàn thể được làm dậy men. Tuy nhiên, “đấu” là một đơn vị đo Việt Nam, không tương ứng với σατά (seah), và chú thích quy đổi khoảng 39 lít không phù hợp với ba seah (thường khoảng 22 lít, tùy cách quy đổi).
  naturalness: “Vương quốc thiên đàng” ít tự nhiên trong tiếng Việt Kinh Thánh hiện đại; “Nước Trời” là cách gọi thành ngữ, rõ nghĩa và quen dùng. “Ba sa-ta bột” cùng chú thích là cách giữ chi tiết lịch sử mà không thay bằng một đơn vị Việt Nam khác.
  terminology: Dùng “Nước Trời” cho ἡ βασιλεία τῶν οὐρανῶν và “men” cho ζύμῃ là tự nhiên, trung tính về thần học. Giữ “sa-ta” như tên đơn vị gốc; chú thích nêu đây là đơn vị đo khô và chỉ cho số gần đúng, không khẳng định một quy đổi tuyệt đối.
  issues:
  - severity: medium
    issue: “Ba đấu bột” thay thế σατά bằng một đơn vị đo Việt Nam không tương đương.
    rationale: Đấu là đơn vị bản địa có dung tích riêng; dùng nó khiến người đọc hiểu sai số lượng lịch sử trong nguyên ngữ.
  - severity: high
    issue: Chú thích c quy đổi ba sa-ta thành “khoảng 39 lít.”
    rationale: Ba seah thường được ước tính khoảng 22 lít theo thể tích khô, dù các đơn vị cổ có sai khác; 39 lít không phải quy đổi thông thường cho ba seah.
  - severity: low
    issue: “Vương quốc thiên đàng” kém thành ngữ so với thuật ngữ Việt ngữ thông dụng.
    rationale: “Nước Trời” truyền đạt chính xác công thức Matthean mà vẫn là cách dùng hiện đại, tự nhiên trong văn cảnh Kinh Thánh.
