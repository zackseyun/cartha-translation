source:
  edition: SBLGNT
  text: Ἄλλην παραβολὴν ἐλάλησεν αὐτοῖς· Ὁμοία ἐστὶν ἡ βασιλεία τῶν οὐρανῶν ζύμῃ, ἣν λαβοῦσα γυνὴ ⸀ἐνέκρυψεν εἰς ἀλεύρου σάτα τρία ἕως οὗ ἐζυμώθη ὅλον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/033.yaml
  text: 'He told them another parable: “The kingdom of heaven is like leaven[c][b][a], which a woman took and hid in three measures of flour until it was all leavened.”'
translation:
  language: vi
  text: 'Ngài kể cho họ một dụ ngôn khác: “Nước Trời giống như men[a] mà một người phụ nữ lấy và giấu vào[b] ba sa-ta bột[c], cho đến khi cả khối bột đều dậy men.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hy Lạp chỉ chất men dùng để làm bột dậy; cũng có thể dịch là “men làm bánh.”
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể hiểu theo thao tác làm bánh là “trộn vào” hoặc “nhào vào”; nguyên văn là “giấu vào.”
    reason: lexical_alternative
  - marker: c
    text: 'Nguyên văn: “ba sa-ta bột.” Sa-ta là một đơn vị đo khô; ba sa-ta thường được ước tính khoảng 22 lít, dù cách quy đổi đơn vị cổ có thể khác nhau.'
    reason: cultural_note
lexical_decisions:
- source_word: Ἄλλην παραβολὴν ἐλάλησεν αὐτοῖς
  choice: Ngài kể cho họ một dụ ngôn khác
  rationale: Diễn đạt tự nhiên lời dẫn truyện, đồng thời giữ ý đây là một dụ ngôn bổ sung.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: Vương quốc thiên đàng
  rationale: Giữ cách nói đặc trưng của Ma-thi-ơ; dạng số nhiều Hy Lạp mang ảnh hưởng Sê-mít không cần chuyển sát thành “các tầng trời”.
- source_word: ζύμῃ
  choice: men
  rationale: “Men” là từ hiện đại, dễ hiểu, chỉ tác nhân làm bột dậy và không áp đặt sắc thái thần học tích cực hay tiêu cực.
- source_word: ἐνέκρυψεν εἰς
  choice: giấu vào
  rationale: Giữ nghĩa hình ảnh trực tiếp của động từ Hy Lạp là “giấu vào”; cách hiểu theo thao tác làm bánh được nêu trong chú thích.
- source_word: ἀλεύρου σάτα τρία
  choice: ba đấu bột
  rationale: Dùng tên đơn vị đo quen thuộc hơn trong văn phong Kinh Thánh tiếng Việt, còn tên đơn vị gốc và quy mô lớn được giải thích ở chú thích.
- source_word: ἕως οὗ ἐζυμώθη ὅλον
  choice: cho đến khi tất cả đều dậy men
  rationale: Giữ thể bị động và phạm vi toàn thể của ὅλον mà không buộc phải xác định đó là bột khô hay cả khối bột đã nhào.
theological_decisions:
- issue: Sắc thái của ζύμη trong dụ ngôn về vương quốc
  choice: Dịch trung tính là “men”
  alternative: Diễn giải men như biểu tượng vốn tích cực hoặc vốn tiêu cực
  rationale: Câu văn nhấn mạnh tác động lan khắp của men; bản dịch không nên giải quyết thay người đọc cuộc tranh luận thần học về sắc thái của hình ảnh này.
- issue: Đối tượng được ví sánh trong công thức Ὁμοία ἐστὶν
  choice: Giữ nguyên “Vương quốc thiên đàng giống như men”
  alternative: Diễn giải rằng vương quốc chỉ giống toàn bộ quá trình hoặc kết quả men lan ra
  rationale: Cấu trúc Hy Lạp trực tiếp ví vương quốc với men; giữ nguyên hình thức ấy bảo toàn độ mở của dụ ngôn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” theo mạch kể về Chúa Giê-su; giữ hình ảnh “giấu vào” có chủ ý của nguyên văn, đồng thời giải thích cách hiểu tự nhiên trong việc làm bánh qua chú thích.
