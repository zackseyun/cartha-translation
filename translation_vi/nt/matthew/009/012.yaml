id: MAT.9.12
reference: Matthew 9:12
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὁ ⸀δὲ ἀκούσας ⸀εἶπεν· Οὐ χρείαν ἔχουσιν οἱ ἰσχύοντες ἰατροῦ ἀλλὰ οἱ κακῶς ἔχοντες.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/012.yaml
  text: But when he heard it[a], he said, “Those who are well have no need of a physician, but those who are sick do.”
translation:
  language: vi
  text: 'Nhưng Đức Giê-su nghe vậy thì nói: “Người khỏe mạnh không cần thầy thuốc, nhưng người đau ốm thì cần.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀκούσας
  choice: nghe vậy
  rationale: Phân từ bất định quá khứ có đối tượng được hiểu từ ngữ cảnh trước; “nghe vậy” tự nhiên trong tiếng Việt và diễn đạt quan hệ thời gian mà không thêm nội dung cụ thể.
- source_word: δὲ
  choice: Nhưng
  rationale: δέ đánh dấu sự chuyển ý có sắc thái tương phản nhẹ khi Đức Giê-su đáp lại lời chất vấn.
- source_word: εἶπεν
  choice: thì nói
  rationale: Giữ nghĩa thông thường của λέγω là “nói”, không diễn giải thành “đáp” dù lời nói có tính chất hồi đáp.
- source_word: Οὐ χρείαν ἔχουσιν
  choice: không cần
  rationale: Đây là cách diễn đạt tự nhiên, rõ ràng trong tiếng Việt cho thành ngữ χρείαν ἔχειν.
- source_word: οἱ ἰσχύοντες
  choice: người khỏe mạnh
  rationale: Trong thế đối lập y khoa với οἱ κακῶς ἔχοντες, ἰσχύοντες chỉ những người có sức khỏe tốt; “khỏe mạnh” vừa tự nhiên vừa giữ được nét nghĩa có sức lực.
- source_word: ἰατροῦ
  choice: thầy thuốc
  rationale: “Thầy thuốc” là từ tiếng Việt trang trọng, dễ hiểu, phù hợp với hình ảnh y khoa và giọng châm ngôn.
- source_word: οἱ κακῶς ἔχοντες
  choice: người đau ốm
  rationale: Thành ngữ κακῶς ἔχειν trong ngữ cảnh này có nghĩa là bị bệnh; “đau ốm” tạo thế đối lập rõ ràng với “khỏe mạnh”.
theological_decisions:
- issue: Nghĩa ẩn dụ hay nghĩa thể chất đơn thuần của câu châm ngôn
  choice: Dịch trực tiếp bằng ngôn ngữ y khoa, để ngữ cảnh cho thấy sự áp dụng thuộc linh.
  alternative: Diễn giải rõ “người tội lỗi” là những người cần được chữa lành thuộc linh.
  rationale: Bản Hy Lạp tự thân trình bày một câu nói về người khỏe và người bệnh. Không đưa phần áp dụng thần học vào câu dịch giúp bảo toàn hình ảnh và sức căng của văn mạch.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Đức Giê-su” để làm rõ chủ ngữ vốn được hàm ẩn trong động từ Hy Lạp nhưng đã được xác định rõ ở văn cảnh. Cấu trúc “thì cần” bổ sung động từ tỉnh lược ở vế sau để câu tiếng Việt cân đối và tự nhiên.
