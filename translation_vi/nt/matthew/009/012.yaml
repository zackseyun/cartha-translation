  source_fidelity: 'Bản dịch truyền đạt đúng cấu trúc và ý nghĩa của câu Hy Lạp: phân từ ἀκούσας được diễn đạt tự nhiên là “nghe vậy”; δέ là “Nhưng”; lời châm ngôn giữ nguyên đối lập giữa người khỏe mạnh và người bệnh, cùng hình ảnh “thầy thuốc.” “Thì cần” ở vế sau chỉ khôi phục động từ được tỉnh lược trong tiếng Việt, không thêm ý nghĩa mới.'
  naturalness: Câu tiếng Việt hiện đại, rõ ràng và có nhịp điệu tự nhiên. “Người khỏe mạnh,” “thầy thuốc,” và “người đau ốm” phù hợp với văn phong trang trọng vừa phải của bản dịch Kinh Thánh. Cách nói “Đức Giê-su nghe vậy thì nói” trôi chảy trong ngữ cảnh.
  terminology: “Đức Giê-su” nhất quán với cách gọi tôn kính thông dụng. “Thầy thuốc” phản ánh chính xác ἰατρός và phù hợp giọng châm ngôn. “Người đau ốm” diễn đạt đúng thành ngữ κακῶς ἔχοντες trong thế đối lập y khoa, mà không diễn giải ứng dụng thuộc linh.
