id: MAT.9.10
reference: Matthew 9:10
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο αὐτοῦ ἀνακειμένου ἐν τῇ οἰκίᾳ, ⸀καὶ ἰδοὺ πολλοὶ τελῶναι καὶ ἁμαρτωλοὶ ἐλθόντες συνανέκειντο τῷ Ἰησοῦ καὶ τοῖς μαθηταῖς αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/010.yaml
  text: And as he was reclining at table in the house[a], behold[b], many tax collectors and sinners came and were reclining at table with Jesus and his disciples.
translation:
  language: vi
  text: Khi Giê-su đang ngả mình tại bàn ăn[a] trong nhà[b], thì kìa, nhiều người thu thuế và những người tội lỗi đã đến, cùng ngả mình tại bàn ăn với ngài và các môn đồ của ngài.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể diễn đạt tự nhiên hơn là “đang dùng bữa”. Nguyên văn nói cụ thể về tư thế ngả mình khi dùng bữa theo phong tục thời ấy.
    reason: lexical_alternative
  - marker: b
    text: Nguyên văn chỉ nói “trong nhà” và trong riêng câu này không xác định rõ đó là nhà của ai.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐγένετο
  choice: Khi ... thì
  rationale: Cụm καὶ ἐγένετο ở đây chủ yếu chuyển tiếp câu chuyện và thiết lập hoàn cảnh thời gian. Cấu trúc “Khi ... thì” chuyển tải tự nhiên chức năng ấy mà không dịch cứng thành “Và chuyện xảy ra là”.
- source_word: ἀνακειμένου
  choice: đang ngả mình dùng bữa
  rationale: Trong bối cảnh bữa ăn, ἀνάκειμαι chỉ tư thế ngả mình theo phong tục ăn uống thời ấy. Cách dịch này giữ được cả hành động dùng bữa lẫn tư thế, thay vì nói chung chung là “ngồi” hoặc chỉ “ăn”.
- source_word: ἐν τῇ οἰκίᾳ
  choice: trong nhà
  rationale: Nguyên văn có mạo từ xác định nhưng không nói rõ trong chính câu này đó là nhà của ai. “Trong nhà” giữ nguyên mức độ xác định mà không thêm tên chủ nhà.
- source_word: ἰδοὺ
  choice: kìa
  rationale: ἰδού là từ dẫn nhằm thu hút sự chú ý và làm cảnh kể trở nên sống động. “Kìa” là cách diễn đạt hiện đại, ngắn gọn và vẫn có tính đánh dấu rõ ràng.
- source_word: τελῶναι
  choice: người thu thuế
  rationale: Đây là cách gọi rõ ràng, thông dụng cho những người thu thuế trong bối cảnh Tin Mừng, đồng thời không làm mất sắc thái xã hội của nhóm người này.
- source_word: ἁμαρτωλοὶ
  choice: những người tội lỗi
  rationale: Tính từ được dùng như danh từ để chỉ một hạng người. “Những người tội lỗi” tự nhiên trong tiếng Việt và giữ nguyên cách phân loại mang tính xã hội-tôn giáo của nguyên văn.
- source_word: ἐλθόντες
  choice: đã đến
  rationale: Phân từ bất định chỉ hành động xảy ra trước hoặc dẫn vào việc cùng dự bữa. Chuyển thành động từ hữu hạn “đã đến” giúp câu tiếng Việt rõ và tự nhiên.
- source_word: συνανέκειντο
  choice: cùng ngả mình dùng bữa với
  rationale: Động từ ghép diễn tả việc cùng ở trong tư thế dự bữa với người khác, qua đó thể hiện sự đồng bàn. Bản dịch giữ cả bối cảnh bữa ăn và ý cùng dự.
- source_word: τῷ Ἰησοῦ
  choice: với Đức Giê-su
  rationale: “Giê-su” là dạng phiên âm quen thuộc trong tiếng Việt; danh xưng “Đức” tạo giọng văn trang trọng mà không thêm một tước hiệu không có trong nguyên văn.
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: các môn đồ của ngài
  rationale: “Môn đồ” là từ quen thuộc, chính xác cho μαθηταί trong bối cảnh một thầy và những người theo học. Đại từ “ngài” giúp quy chiếu rõ về Đức Giê-su trong tiếng Việt.
theological_decisions:
- issue: Tư thế dùng bữa và ý nghĩa đồng bàn
  choice: Giữ cách nói “ngả mình dùng bữa” và “cùng ngả mình dùng bữa với”.
  alternative: “ăn”, “dùng bữa” hoặc “ngồi ăn” mà không nêu tư thế
  rationale: Nguyên văn nhấn mạnh việc cùng dự bữa theo tư thế đương thời; chi tiết này làm nổi bật sự đồng bàn mà không cần thêm lời diễn giải thần học.
- issue: Danh tính chủ nhà
  choice: Không xác định nhà thuộc về ai trong chính văn.
  alternative: “nhà của ngài”, “nhà của Ma-thi-ơ”
  rationale: Cụm Hy Lạp chỉ nói “trong nhà”. Dù văn cảnh rộng hơn có thể dẫn đến một nhận định về chủ nhà, câu này không nêu rõ, nên bản dịch giữ nguyên sự không xác định ấy.
translation_notes:
  register: Tiếng Việt phổ thông hiện đại, trang trọng nhưng dễ hiểu. Giữ chi tiết văn hóa về tư thế dùng bữa trong chính văn và giải thích ngắn ở chú thích; không xác định chủ nhà ngoài điều nguyên văn nêu rõ. “Kìa” bảo tồn sắc thái thu hút sự chú ý của lời kể.
