  text: καὶ ἐξῆλθεν ἡ φήμη αὕτη εἰς ὅλην τὴν γῆν ἐκείνην.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/026.yaml
  text: And this report went out into all that region[a].
translation:
  language: vi
  text: Và tin ấy lan ra khắp cả vùng đó.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “khắp cả miền đất ấy” hoặc “khắp cả địa hạt đó.” Từ Hy Lạp γῆ có thể chỉ đất, xứ hoặc vùng; tại đây, từ này rất có thể nói đến khu vực chung quanh chứ không phải toàn thể trái đất.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Và
  rationale: Giữ liên từ tường thuật trực tiếp, tự nhiên, không thêm sắc thái nhân quả hay trình tự vốn không được diễn đạt rõ trong nguyên văn.
- source_word: ἐξῆλθεν
  choice: lan ra
  rationale: Động từ theo nghĩa đen là “đi ra”, nhưng khi chủ thể là một tin tức, “lan ra” diễn đạt tự nhiên trong tiếng Việt hình ảnh tin truyền từ một nơi sang khu vực chung quanh.
- source_word: ἡ φήμη αὕτη
  choice: tin ấy
  rationale: φήμη chỉ tin tức hay lời truyền đi, không nhất thiết hàm ý thiếu đáng tin như “tin đồn”; αὕτη quy chiếu đến sự việc vừa kể, nên “ấy” phù hợp với văn phong tường thuật trang trọng.
- source_word: εἰς ὅλην τὴν γῆν ἐκείνην
  choice: khắp cả vùng đó
  rationale: γῆ có thể chỉ đất, xứ hay vùng; bối cảnh địa phương ủng hộ “vùng”. “Khắp cả” thể hiện phạm vi toàn bộ của ὅλην, còn εἰς được diễn đạt tự nhiên qua hướng lan truyền trong cụm “lan ra khắp”.
theological_decisions: []
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. “Tin ấy lan ra” tự nhiên hơn lối dịch sát chữ “tin ấy đi ra”, đồng thời vẫn giữ hình ảnh sự việc được truyền rộng. Dấu chú thích [a] được đặt ngay sau câu.
