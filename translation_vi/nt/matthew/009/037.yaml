  to: 'Bấy giờ, Ngài nói[a] với các môn đệ của Ngài: “Mùa gặt thật dồi dào[b], nhưng thợ gặt thì ít.”'
  rationale: Chỉ cập nhật hai lựa chọn từ ngữ để phù hợp tiếng Việt hiện đại và phản ánh trực tiếp hơn động từ hiện tại lịch sử trong nguyên văn. Không thêm diễn giải về ẩn dụ mùa gặt; trật tự, độ tương phản và nghĩa của câu được giữ nguyên. Các chú thích vẫn được neo đúng vào «nói» và «dồi dào».
