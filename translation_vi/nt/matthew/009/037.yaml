  text: τότε λέγει τοῖς μαθηταῖς αὐτοῦ· Ὁ μὲν θερισμὸς πολύς, οἱ δὲ ἐργάται ὀλίγοι·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/037.yaml
  text: Then he says to his disciples[a], “The harvest indeed is plentiful[b], but the workers are few.”
translation:
  language: vi
  text: 'Bấy giờ, Ngài nói[a] với các môn đệ của Ngài: “Mùa gặt thật dồi dào[b], nhưng thợ gặt thì ít.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hy Lạp dùng hiện tại lịch sử: “Ngài nói”. Một số bản dịch có thể diễn đạt là “Ngài đã nói”.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “Mùa gặt thì nhiều, nhưng người làm thì ít.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Bấy giờ
  rationale: Đánh dấu diễn tiến của câu chuyện một cách ngắn gọn, tự nhiên; cũng có thể hiểu là “lúc ấy”.
- source_word: λέγει
  choice: phán
  rationale: Hiện tại lịch sử trong tiếng Hy Lạp tạo sắc thái sống động. Tiếng Việt không bắt buộc đánh dấu thì trên động từ; “Bấy giờ, Ngài phán” vừa tự nhiên vừa không biến động từ thành một quá khứ được đánh dấu rõ.
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: với các môn đồ của Ngài
  rationale: Giữ rõ đại từ sở hữu αὐτοῦ; “môn đồ” là cách gọi trang trọng, quen thuộc đối với μαθηταί trong bối cảnh này.
- source_word: Ὁ μὲν ... οἱ δὲ
  choice: thật ... nhưng ... thì
  rationale: Diễn đạt rõ thế tương phản μέν...δέ trong tiếng Việt hiện đại mà không dùng cấu trúc cứng nhắc “một đằng... đằng khác”.
- source_word: θερισμός
  choice: mùa gặt
  rationale: Giữ nguyên hình ảnh nông nghiệp và có thể chỉ cả vụ thu hoạch lẫn công việc thu hoạch trong ngữ cảnh.
- source_word: πολύς
  choice: dồi dào
  rationale: Diễn đạt lượng lớn của mùa gặt bằng một kết hợp từ tự nhiên trong tiếng Việt; “nhiều” là phương án sát chữ hơn.
- source_word: ἐργάται
  choice: thợ gặt
  rationale: ἐργάται có nghĩa chung là người làm việc, nhưng hình ảnh mùa gặt khiến “thợ gặt” tự nhiên và rõ ràng trong tiếng Việt mà vẫn duy trì phép ẩn dụ.
- source_word: ὀλίγοι
  choice: ít
  rationale: Tương ứng trực tiếp với vị ngữ ὀλίγοι và giữ nguyên sự tương phản với mùa gặt dồi dào.
theological_decisions:
- issue: Ý nghĩa ẩn dụ của lời nói về mùa gặt
  choice: Giữ nguyên hình ảnh “mùa gặt” và “thợ gặt”, không giải thích đối tượng mà hình ảnh ấy ám chỉ ngay trong câu dịch.
  alternative: Diễn giải mùa gặt là những người sẵn sàng tiếp nhận sứ vụ của Chúa Giê-su.
  rationale: Bản thân câu này nêu hình ảnh nhưng chưa giải nghĩa đầy đủ; diễn giải trong chính văn sẽ đưa thêm cách hiểu mà nguyên văn không nói tường minh.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Ngài” duy trì cách quy chiếu tôn kính quen thuộc dành cho Chúa Giê-su; “môn đồ” và “mùa gặt” giữ thuật ngữ cùng hình ảnh Kinh Thánh quen thuộc. Các dấu chú thích [a], [b] đều xuất hiện đúng vị trí trong chính văn.
