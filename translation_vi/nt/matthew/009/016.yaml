source:
  edition: SBLGNT
  text: οὐδεὶς δὲ ἐπιβάλλει ἐπίβλημα ῥάκους ἀγνάφου ἐπὶ ἱματίῳ παλαιῷ· αἴρει γὰρ τὸ πλήρωμα αὐτοῦ ἀπὸ τοῦ ἱματίου, καὶ χεῖρον σχίσμα γίνεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/016.yaml
  text: But no one puts a patch of unshrunk cloth on an old garment, for the patch pulls away from the garment, and a worse tear results.
translation:
  language: vi
  text: Nhưng không ai lấy miếng vá bằng vải chưa được làm co[a] mà đắp lên áo cũ, vì miếng vá sẽ kéo rách áo, làm cho vết rách càng lớn hơn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “vải chưa qua công đoạn làm dạ”; từ Hy Lạp chỉ loại vải chưa được xử lý. Khi co lại, miếng vá có thể kéo căng áo cũ và làm vết rách lớn hơn.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδεὶς
  choice: không ai
  rationale: Diễn đạt tự nhiên chủ thể phủ định bất định và giữ nguyên ý nghĩa phổ quát, không gắn giới tính.
- source_word: δὲ
  choice: Nhưng
  rationale: Thể hiện sự chuyển ý có sắc thái tương phản nhẹ với văn cảnh trước.
- source_word: ἐπιβάλλει
  choice: lấy ... mà đắp lên
  rationale: Động từ có nghĩa đặt hoặc áp lên; trong ngữ cảnh vá áo, “đắp lên” tự nhiên mà không thêm ý “khâu” vốn không được nói rõ trong động từ.
- source_word: ἐπίβλημα
  choice: miếng vá
  rationale: Chỉ mảnh vật liệu dùng để vá quần áo; đây là cách nói rõ ràng, thông dụng trong tiếng Việt hiện đại.
- source_word: ῥάκους ἀγνάφου
  choice: bằng vải chưa co
  rationale: Chỉ loại vải chưa qua xử lý làm co; cách dịch này truyền đạt trực tiếp cơ chế khiến miếng vá kéo căng áo cũ.
- source_word: ἐπὶ ἱματίῳ παλαιῷ
  choice: lên áo cũ
  rationale: ἱμάτιον chỉ y phục nói chung hoặc áo ngoài; “áo” tự nhiên trong hình ảnh minh họa này mà không thu hẹp thành một kiểu áo cụ thể.
- source_word: αἴρει ... ἀπὸ τοῦ ἱματίου
  choice: kéo rách áo
  rationale: Trong ngữ cảnh, miếng vá co lại và kéo phần áo cũ đến mức rách; cách diễn đạt này giữ sức mạnh của hình ảnh và quan hệ tách lìa, đồng thời tự nhiên trong tiếng Việt.
- source_word: τὸ πλήρωμα αὐτοῦ
  choice: miếng vá
  rationale: Nghĩa đen là phần làm đầy của nó, nhưng trong ngữ cảnh chính là mảnh dùng để vá; lặp lại “miếng vá” giúp người đọc hiểu ngay chủ thể.
- source_word: χεῖρον σχίσμα γίνεται
  choice: chỗ rách càng tệ hơn
  rationale: Giữ ý so sánh của χεῖρον và kết quả phát sinh được diễn tả bởi γίνεται bằng câu tiếng Việt tự nhiên.
theological_decisions: []
