  text: δεήθητε οὖν τοῦ κυρίου τοῦ θερισμοῦ ὅπως ἐκβάλῃ ἐργάτας εἰς τὸν θερισμὸν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/038.yaml
  text: Therefore pray earnestly to the Lord of the harvest that he would send out workers into his harvest[a].
translation:
  language: vi
  text: Vậy, hãy tha thiết cầu xin Chúa của mùa gặt sai những người làm công vào mùa gặt của Ngài.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “đẩy những người làm công ra”; động từ Hy Lạp mạnh hơn từ “sai” thông thường, nhưng ở đây nói đến việc phái người làm công vào mùa gặt.
    reason: lexical_alternative
lexical_decisions:
- source_word: δεήθητε
  choice: hãy tha thiết cầu xin
  rationale: Động từ δέομαι ở thể mệnh lệnh truyền đạt lời cầu xin khẩn thiết; cách dịch này giữ được cả bối cảnh cầu nguyện lẫn sắc thái khẩn khoản.
- source_word: οὖν
  choice: Vậy
  rationale: Nêu kết luận từ câu trước về mùa gặt nhiều nhưng người làm công ít, đồng thời tự nhiên trong tiếng Việt hiện đại.
- source_word: κυρίου
  choice: Chúa
  rationale: Giữ danh xưng chỉ đấng có quyền trên mùa gặt mà không xác định thêm căn tính ngoài điều câu văn nói rõ.
- source_word: θερισμοῦ
  choice: mùa gặt
  rationale: Giữ nguyên hình ảnh ẩn dụ của nguyên văn, thay vì diễn giải thành công cuộc truyền giáo hay sự thu nhóm.
- source_word: ὅπως
  choice: '[cấu trúc] cầu xin ... sai'
  rationale: Trong tiếng Việt, nội dung lời cầu xin được diễn đạt tự nhiên bằng động từ nối trực tiếp, không nhất thiết phải thêm từ tương đương riêng với ὅπως.
- source_word: ἐκβάλῃ
  choice: sai
  rationale: Trong ngữ cảnh này, động từ nói đến việc phái người làm công vào mùa gặt. Từ Hy Lạp mạnh hơn từ 'sai' thông thường, nên sắc thái ấy được ghi trong chú thích.
- source_word: ἐργάτας
  choice: những người làm công
  rationale: Diễn đạt rõ những người lao động trong hình ảnh mùa gặt, tự nhiên và dễ hiểu trong tiếng Việt.
- source_word: εἰς τὸν θερισμὸν αὐτοῦ
  choice: vào mùa gặt của Ngài
  rationale: Giữ ý chuyển động vào phạm vi/công việc của mùa gặt, cùng đại từ sở hữu, mà không thêm 'cánh đồng' vốn không có trong nguyên văn.
theological_decisions:
- issue: Căn tính của “Chúa của mùa gặt”
  choice: Giữ nguyên danh xưng “Chúa của mùa gặt”, không xác định cụ thể là Đức Chúa Cha, Chúa Giê-su hay Đức Chúa Trời nói chung.
  alternative: Xác định danh xưng này là Đức Chúa Cha hoặc là Chúa Giê-su.
  rationale: Bản thân câu này không nêu rõ căn tính ngoài danh xưng ấy; giữ cách nói của nguyên văn bảo toàn độ mở và sức căng thần học.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại, rõ ràng với độc giả phổ thông. “Tha thiết cầu xin” giữ sắc thái khẩn khoản; “mùa gặt” bảo toàn ẩn dụ; “Ngài” dùng để quy chiếu trang trọng đến Chúa mà không giải quyết căn tính cụ thể của danh xưng.
