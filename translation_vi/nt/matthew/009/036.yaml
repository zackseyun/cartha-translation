revisions:
- from: Khi thấy đoàn dân, Ngài động lòng thương xót họ, vì họ bị vùi dập và quỵ ngã[a], như đàn chiên không có người chăn.
  to: Khi thấy đám đông, Ngài động lòng thương xót họ, vì họ bị vùi dập và bị quăng quật[a], như đàn chiên không có người chăn.
  rationale: Sửa “quỵ ngã” thành “bị quăng quật” để giữ thể bị động và sức gợi của ἐρριμμένοι, đồng thời duy trì lối diễn đạt tự nhiên. Đổi “đoàn dân” thành “đám đông” cho sát và hiện đại hơn với τοὺς ὄχλους; dời mỏ neo chú thích để bao trùm đúng cặp phân từ.
