source:
  edition: SBLGNT
  text: Ἰδὼν δὲ τοὺς ὄχλους ἐσπλαγχνίσθη περὶ αὐτῶν ὅτι ἦσαν ἐσκυλμένοι καὶ ἐρριμμένοι ⸀ὡσεὶ πρόβατα μὴ ἔχοντα ποιμένα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/036.yaml
  text: And when he saw the crowds[a], he had compassion on them, because they were harassed and cast down, like sheep without a shepherd.
translation:
  language: vi
  text: Khi thấy đám đông, Ngài động lòng thương xót họ, vì họ bị vùi dập và bị quăng quật[a], như đàn chiên không có người chăn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “bị quấy nhiễu và bất lực.” Hai từ Hy Lạp cũng có thể được hiểu theo nghĩa diễn giải hơn, mô tả đám đông đã kiệt quệ và không thể tự lo liệu cho mình.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰδὼν δὲ
  choice: Khi thấy
  rationale: Phân từ bất định quá khứ được diễn đạt như một mệnh đề thời gian tự nhiên trong tiếng Việt; δέ là từ nối nhẹ và không cần dịch riêng để câu văn trôi chảy.
- source_word: τοὺς ὄχλους
  choice: đoàn dân
  rationale: Diễn đạt một đám đông dân chúng bằng cách nói tự nhiên, trang trọng vừa phải trong tiếng Việt hiện đại.
- source_word: ἐσπλαγχνίσθη περὶ αὐτῶν
  choice: Ngài động lòng thương xót họ
  rationale: Giữ được sắc thái thương cảm sâu xa của động từ Hy Lạp và dùng lối diễn đạt quen thuộc, dễ hiểu trong tiếng Việt.
- source_word: ὅτι
  choice: vì
  rationale: Nêu rõ nguyên nhân khiến Chúa Giê-su thương xót đoàn dân.
- source_word: ἐσκυλμένοι
  choice: bị vùi dập
  rationale: Giữ thể bị động và ý niệm bị đối xử tàn tệ, bị làm cho kiệt quệ, đồng thời tránh cách dịch quá sát theo nghĩa vật lý.
- source_word: καὶ ἐρριμμένοι
  choice: và quỵ ngã
  rationale: Phản ánh hình ảnh bị quăng xuống hoặc nằm rạp trong phân từ ἐρριμμένοι bằng một cách nói tự nhiên, giàu hình ảnh.
- source_word: ὡσεὶ πρόβατα
  choice: như đàn chiên
  rationale: Giữ nguyên phép so sánh; thêm từ 'đàn' cho hợp cách nói tiếng Việt mà không làm thay đổi hình ảnh.
- source_word: μὴ ἔχοντα ποιμένα
  choice: không có người chăn
  rationale: Giữ trực tiếp hình ảnh chiên không có người chăn, tránh diễn giải thành một kết luận thần học cụ thể.
theological_decisions:
- issue: Cách diễn đạt lòng thương xót của Chúa Giê-su
  choice: Ngài động lòng thương xót họ
  alternative: Ngài cảm thương họ sâu sắc
  rationale: Cách chọn giữ sức nặng cảm xúc của σπλαγχνίζομαι mà không giải thích thêm bản chất hay hệ quả thần học của lòng thương xót.
- issue: Tình trạng của đoàn dân
  choice: bị vùi dập và quỵ ngã
  alternative: mệt mỏi và bất lực
  rationale: Bản dịch chính giữ hình ảnh bị tác động và bị quăng xuống trong hai phân từ Hy Lạp; phương án khác dễ đọc hơn nhưng mang tính diễn giải nhiều hơn.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Câu giữ hình ảnh mục tử của nguyên bản, đồng thời dùng chú thích để bảo tồn khoảng nghĩa của hai phân từ mô tả tình trạng đoàn dân.
