revisions:
- from: 'Và kìa, người ta đem đến cho Ngài một người bại liệt đang nằm trên giường. Thấy đức tin của họ[a], Đức Giê-su nói với người bại liệt: “Hãy vững lòng, con ạ; tội lỗi của con được tha rồi.”[b]'
  to: 'Và kìa, người ta đem đến cho Ngài một người bại liệt đang nằm trên giường. Khi Đức Giê-su thấy đức tin của họ[a], Ngài nói với người bại liệt: “Hãy vững lòng, con ạ; tội lỗi của con được tha.”[b]'
  rationale: Chỉnh nhẹ để diễn đạt rõ chủ ngữ được nêu trong nguyên ngữ và tránh làm sắc thái hiện tại của ἀφίενται trở thành hoàn tất trong chính văn. Chú thích b giữ phương án hoàn tất như một khả năng dịch hợp lệ. Không thay đổi ý nghĩa, phạm vi mơ hồ của “đức tin của họ,” hay tác nhân không được nêu của thể bị động.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T02:44:27Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch nhìn chung trung thành với tiếng Hy Lạp: giữ dấu hiệu thu hút chú ý, số nhiều trong “đức tin của họ,” lời xưng hô trìu mến, và thể bị động không nêu tác nhân trong lời tha tội. Tuy nhiên, “được tha rồi” nghiêng về một tình trạng đã hoàn tất, trong khi ἀφίενται là hiện tại bị động trong lời tuyên bố. Nên dùng “được tha” ở chính văn để giữ sát hơn sắc thái hiện tại mà không làm tiếng Việt thiếu tự nhiên. Cũng nên nêu rõ chủ ngữ “Đức Giê-su” ở mệnh đề “thấy đức tin...” như nguyên ngữ, tránh một thoáng mơ hồ do câu trước có chủ ngữ là “người ta.”'
  naturalness: Văn phong trang trọng vừa phải, tự nhiên trong tiếng Việt hiện đại. “Và kìa,” phù hợp với giọng kể Kinh Thánh; “Hãy vững lòng, con ạ” truyền đạt tốt lời trấn an đầy trìu mến. Việc lặp “Đức Giê-su” trong mệnh đề tiếp theo giúp câu rõ ràng và mạch lạc hơn.
  terminology: “Đức Giê-su,” “người bại liệt,” “đức tin,” và “tội lỗi” đều là những lựa chọn chuẩn, dễ hiểu, và phù hợp ngữ vực. “Con ạ” bảo toàn sắc thái thân tình của τέκνον mà không áp đặt giới tính bằng “con trai.”
  issues:
  - severity: low
    issue: “rồi” trong “tội lỗi của con được tha rồi” có thể gợi một hành động đã hoàn tất.
    rationale: Câu ἀφίενταί σου αἱ ἁμαρτίαι dùng hiện tại bị động. “Tội lỗi của con được tha” phản ánh trực tiếp hơn lời công bố hiện tại; cách dịch hoàn tất có thể được nêu ở chú thích như một khả năng.
  - severity: low
    issue: Mệnh đề “Thấy đức tin của họ” lược chủ ngữ Đức Giê-su.
    rationale: Dù vị ngữ chính sau đó xác định Đức Giê-su là người nói, câu ngay trước có chủ ngữ “người ta.” Nêu rõ “Khi Đức Giê-su thấy...” vừa sát nguyên ngữ vừa loại bỏ khả năng đọc lướt bị mơ hồ.
  revised_text: 'Và kìa, người ta đem đến cho Ngài một người bại liệt đang nằm trên giường. Khi Đức Giê-su thấy đức tin của họ[a], Ngài nói với người bại liệt: “Hãy vững lòng, con ạ; tội lỗi của con được tha.”[b]'
