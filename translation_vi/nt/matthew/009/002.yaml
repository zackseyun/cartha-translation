id: MAT.9.2
reference: Matthew 9:2
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Καὶ ἰδοὺ προσέφερον αὐτῷ παραλυτικὸν ἐπὶ κλίνης βεβλημένον. καὶ ἰδὼν ὁ Ἰησοῦς τὴν πίστιν αὐτῶν εἶπεν τῷ παραλυτικῷ· Θάρσει, τέκνον· ⸀ἀφίενταί ⸂σου αἱ ἁμαρτίαι⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/002.yaml
  text: And behold[a], they brought to him a paralytic lying on a bed. And when Jesus saw their faith, he said to the paralytic, “Take courage, child[c][b]; your sins are forgiven.”
translation:
  language: vi
  text: 'Và kìa, người ta đem đến cho Ngài một người bại liệt đang nằm trên giường. Khi Đức Giê-su thấy đức tin của họ[a], Ngài nói với người bại liệt: “Hãy vững lòng, con ạ; tội lỗi của con được tha.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Họ” là số nhiều; có thể chỉ những người đem người bại liệt đến, hoặc bao gồm cả người bại liệt.
    reason: alternative_reading
  - marker: b
    text: 'Cũng có thể dịch: “tội lỗi của con đã được tha.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: kìa
  rationale: Giữ sức hướng sự chú ý và nét sống động của dấu hiệu diễn ngôn trong lời kể của Ma-thi-ơ, đồng thời vẫn tự nhiên trong tiếng Việt.
- source_word: προσέφερον
  choice: đem đến
  rationale: Diễn đạt đúng hành động đưa người bại liệt đến với Đức Giê-su; ngữ cảnh kể chuyện tiếng Việt không cần thể hiện riêng thể chưa hoàn thành bằng cấu trúc tiếp diễn.
- source_word: παραλυτικὸν
  choice: một người bại liệt
  rationale: Cách nói hiện đại, rõ nghĩa và tự nhiên; từ Hy Lạp là tính từ được dùng như danh từ chỉ người.
- source_word: ἐπὶ κλίνης βεβλημένον
  choice: đang nằm trên giường
  rationale: Diễn đạt tư thế và tình trạng của người ấy; κλίνη phù hợp với “giường” hơn là xác định hẹp thành “chiếu”.
- source_word: πίστιν
  choice: đức tin
  rationale: Thuật ngữ tiếng Việt quen thuộc cho πίστις, ở đây là lòng tin được biểu lộ qua hành động.
- source_word: Θάρσει
  choice: Hãy vững lòng
  rationale: Lời khích lệ trực tiếp, tự nhiên và trang trọng; cũng có thể dịch là “Hãy can đảm” hoặc “Hãy yên lòng” tùy sắc thái.
- source_word: τέκνον
  choice: con ạ
  rationale: Giữ sắc thái trìu mến của cách xưng hô τέκνον mà không thêm chữ “trai” vốn không có trong chính danh từ này.
- source_word: ἀφίενταί σου αἱ ἁμαρτίαι
  choice: tội lỗi của con được tha rồi
  rationale: Giữ thể bị động và không nêu tác nhân; “được tha rồi” là lời công bố tự nhiên trong tiếng Việt, không buộc phải xác định đây là trạng thái hoàn tất hay hành động đang diễn ra.
- source_word: ἁμαρτίαι
  choice: tội lỗi
  rationale: Cách dịch chuẩn, trực tiếp của danh từ số nhiều, chỉ các tội của người được nói đến.
theological_decisions:
- issue: Phạm vi của τὴν πίστιν αὐτῶν
  choice: Giữ đại từ số nhiều bằng “đức tin của họ” và không xác định rõ người bại liệt có thuộc nhóm ấy hay không.
  alternative: Chỉ đức tin của những người khiêng; hoặc gồm cả người bại liệt và những người đem ông đến.
  rationale: αὐτῶν là số nhiều nhưng văn bản không nói rõ thành phần chính xác của nhóm. Bản dịch và chú thích bảo tồn sự mở này.
- issue: Tính chất lời tuyên bố tha tội
  choice: Dùng thể bị động “tội lỗi của con được tha rồi,” không nêu tác nhân.
  alternative: Diễn giải thành “Ta tha tội cho con” hoặc nhấn mạnh “đã được tha.”
  rationale: Câu Hy Lạp công bố sự tha thứ bằng thể bị động và để tác nhân không được nói ra; không nên đưa một cách giải thích thần học cụ thể vào chính văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Đức Giê-su” và đại từ kính trọng “Ngài”; lời xưng hô “con ạ” giữ nét trìu mến. Các dấu chú thích [a], [b] đều xuất hiện trong chính văn.
