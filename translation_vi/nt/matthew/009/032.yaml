  text: Αὐτῶν δὲ ἐξερχομένων ἰδοὺ προσήνεγκαν αὐτῷ ⸀ἄνθρωπον κωφὸν δαιμονιζόμενον·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/032.yaml
  text: As they were going out[a], behold, they brought to him a mute[c][b], demon-possessed man.
translation:
  language: vi
  text: Khi họ đang đi ra, kìa, người ta đem đến cho Đức Giê-su một người không nói được[a], bị quỷ ám[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hy Lạp này cũng có thể có nghĩa là “điếc”; trong ngữ cảnh này, câu kế tiếp nói người ấy cất tiếng nói nên “không nói được” phù hợp hơn.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “bị quỷ chi phối”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Αὐτῶν δὲ ἐξερχομένων
  choice: Khi họ đang đi ra
  rationale: Diễn đạt tự nhiên cấu trúc sở hữu cách tuyệt đối với ý nghĩa thời gian; δέ đánh dấu sự chuyển tiếp nhẹ trong câu chuyện và không cần dịch thành một liên từ riêng.
- source_word: ἰδοὺ
  choice: thì kìa
  rationale: Giữ chức năng thu hút sự chú ý và nét sống động của lời kể, đồng thời phù hợp với văn phong tiếng Việt hiện đại, trang trọng.
- source_word: προσήνεγκαν αὐτῷ
  choice: người ta đem đến cho Đức Giê-su
  rationale: προσφέρω ở đây có nghĩa là đem một người đến; chủ ngữ số nhiều không xác định được diễn đạt tự nhiên bằng “người ta”, còn đối tượng gián tiếp được nêu rõ theo ngữ cảnh là Đức Giê-su.
- source_word: ἄνθρωπον
  choice: một người đàn ông
  rationale: Trong trình thuật này, danh từ chỉ một cá nhân nam trưởng thành; cách dịch này giữ đúng đặc điểm giới tính của từ trong ngữ cảnh.
- source_word: κωφὸν
  choice: bị câm
  rationale: κωφός có thể chỉ tình trạng điếc hoặc câm; câu kế tiếp nói người ấy cất tiếng nói nên “bị câm” phù hợp hơn trong ngữ cảnh, còn nghĩa khác được ghi ở chú thích.
- source_word: δαιμονιζόμενον
  choice: bị quỷ ám
  rationale: Đây là cách diễn đạt ngắn gọn, quen thuộc trong tiếng Việt cho tình trạng bị ma quỷ chi phối trong các trình thuật trừ quỷ, nhưng không giải thích quá mức cơ chế của tình trạng ấy.
theological_decisions:
- issue: Cách diễn đạt tình trạng do quỷ gây ra
  choice: bị quỷ ám
  alternative: bị quỷ khống chế
  rationale: Bản văn trình bày tình trạng liên quan đến quỷ như một thực tại trong câu chuyện nhưng không xác định chi tiết mức độ hay cơ chế chi phối. Cách dịch chính quen thuộc và súc tích; chú thích nêu một cách diễn đạt khác để tránh áp đặt một hệ thống quỷ học chi tiết.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. “Thì kìa” giữ nét thu hút sự chú ý của ἰδού mà không dùng lối nói quá cổ; cấu trúc câu vẫn gọn và tự nhiên.
