    issue: “một người đàn ông” diễn giải giới tính cụ thể hơn cần thiết.
    rationale: ἄνθρωπος ở đây chỉ một con người/cá nhân; bản văn không cung cấp chi tiết nào khác cần buộc cách dịch “người đàn ông”.
  - severity: low
    issue: “bị câm” có thể thay bằng cách diễn đạt chức năng hiện đại hơn.
    rationale: Câu 33 xác nhận trọng tâm ngữ cảnh là việc người ấy nói được. “Không nói được” giữ nghĩa này mà tránh nhãn gọi người khuyết tật.
  - severity: low
    issue: Chú thích “bị quỷ khống chế” hơi cụ thể về cách thức tác động.
    rationale: δαιμονιζόμενον khẳng định tình trạng liên hệ với quỷ nhưng không mô tả cơ chế hay mức độ kiểm soát.
