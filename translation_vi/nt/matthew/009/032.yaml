  rationale: Sửa để tránh thêm chi tiết giới tính không cần thiết, dùng cách diễn đạt hiện đại hơn cho tình trạng không nói được, và làm chú thích về δαιμονιζόμενον trung tính hơn về mặt cơ chế. Nghĩa và tính mơ hồ từ vựng của nguyên văn vẫn được giữ.
