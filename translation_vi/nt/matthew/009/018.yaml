id: MAT.9.18
reference: Matthew 9:18
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ταῦτα αὐτοῦ λαλοῦντος αὐτοῖς ἰδοὺ ἄρχων εἷς ⸀ἐλθὼν προσεκύνει αὐτῷ λέγων ὅτι Ἡ θυγάτηρ μου ἄρτι ἐτελεύτησεν· ἀλλὰ ἐλθὼν ἐπίθες τὴν χεῖρά σου ἐπ’ αὐτήν, καὶ ζήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/018.yaml
  text: While he was saying these things to them, look, a ruler came and bowed down before him, saying, “My daughter has just died. But come and lay your hand on her, and she will live.”
translation:
  language: vi
  text: 'Khi Đức Giê-su còn đang nói những điều ấy với họ, thì kìa, một vị lãnh đạo đến phủ phục trước ngài và nói: “Con gái tôi vừa mới chết. Nhưng xin ngài đến đặt tay trên nó, thì nó sẽ sống.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: thì kìa
  rationale: Giữ chức năng thu hút sự chú ý và đánh dấu một diễn biến bất ngờ, đồng thời diễn đạt tự nhiên trong lời kể tiếng Việt.
- source_word: ἄρχων
  choice: một vị lãnh đạo
  rationale: Từ Hy Lạp chỉ người có địa vị cai quản hoặc lãnh đạo nhưng câu này không nêu rõ chức vụ; bản dịch giữ sự khái quát ấy.
- source_word: προσεκύνει
  choice: phủ phục trước
  rationale: Diễn tả cử chỉ hạ mình, tôn kính sâu sắc mà không tự động xác định đây là hành vi thờ phượng theo nghĩa thần học.
- source_word: ἐτελεύτησεν
  choice: đã chết
  rationale: Trong ngữ cảnh này động từ nói rõ việc qua đời; thêm “vừa mới” để chuyển tải ἄρτι.
- source_word: ζήσεται
  choice: sẽ sống
  rationale: Giữ lời khẳng định trực tiếp ở thì tương lai, không diễn giải thêm là chữa lành hay sống lại.
theological_decisions:
- issue: Ý nghĩa của hành động προσεκύνει đối với Đức Giê-su
  choice: phủ phục trước ngài
  alternative: thờ lạy ngài
  rationale: Động từ có thể chỉ sự thờ lạy hoặc hành vi phủ phục bày tỏ tôn kính. Ngữ cảnh không buộc phải phân định sắc thái thần học, nên bản dịch giữ độ mở của nguyên văn.
- issue: Niềm tin của người cha về tình trạng của con gái
  choice: “nó sẽ sống”
  alternative: “nó sẽ sống lại”
  rationale: Nguyên văn dùng ζάω, “sống”, chứ không dùng một động từ chuyên biệt cho sự sống lại; vì vậy không thêm ý vượt quá câu chữ.
translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng hiện đại. Dùng “Đức Giê-su” và đại từ “ngài” cho rõ chủ thể, còn “nó” phù hợp với cách người cha nói về con nhỏ trong tiếng Việt tự nhiên. Cấu trúc “Khi... còn đang..., thì kìa...” giữ diễn tiến đồng thời và nét đột ngột của nguyên văn.
