  text: ὅτε δὲ ἐξεβλήθη ὁ ὄχλος, εἰσελθὼν ἐκράτησεν τῆς χειρὸς αὐτῆς, καὶ ἠγέρθη τὸ κοράσιον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/025.yaml
  text: But when the crowd had been put outside[a], he went in and took her by the hand, and the girl rose.
translation:
  language: vi
  text: Nhưng khi đám đông đã bị đưa ra ngoài, Đức Giê-su đi vào, cầm lấy tay cô bé, và cô bé đứng dậy.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “cô bé được làm cho sống dậy.” Động từ Hy Lạp ở đây cũng có thể được dịch theo cách thụ động.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτε δὲ
  choice: Nhưng khi
  rationale: ὅτε mở đầu mệnh đề thời gian, còn δέ đánh dấu sự chuyển tiếp nhẹ; “Nhưng khi” tự nhiên và giữ được diễn tiến đối lập với cảnh ồn ào trước đó.
- source_word: ἐξεβλήθη
  choice: đã bị đưa ra ngoài
  rationale: Dạng aorist thụ động của ἐκβάλλω. Cách dịch này giữ thể bị động và diễn đạt việc đưa đám đông ra khỏi nơi ấy mà không gợi mức độ cưỡng bức quá mạnh.
- source_word: ὁ ὄχλος
  choice: đám đông
  rationale: ὄχλος chỉ một đám người tụ tập; “đám đông” là cách nói hiện đại, rõ nghĩa.
- source_word: εἰσελθὼν
  choice: Đức Giê-su đi vào
  rationale: Phân từ aorist diễn tả hành động xảy ra trước hành động chính. Chuyển thành động từ hữu hạn giúp câu tiếng Việt tự nhiên; chủ thể được nêu rõ từ ngữ cảnh.
- source_word: ἐκράτησεν τῆς χειρὸς αὐτῆς
  choice: cầm lấy tay em
  rationale: κρατέω đi với sở hữu cách có nghĩa là nắm hoặc cầm lấy. “Cầm lấy tay em” tự nhiên và không nhấn quá mức vào sức mạnh của động tác.
- source_word: ἠγέρθη
  choice: đứng dậy
  rationale: Dạng aorist thụ động của ἐγείρω có thể được hiểu theo nghĩa nội động là đứng dậy, hoặc theo nghĩa thụ động là được làm cho sống dậy. “Đứng dậy” tự nhiên trong tiếng Việt nhưng phương án thụ động được giữ trong chú thích.
- source_word: τὸ κοράσιον
  choice: em gái
  rationale: κοράσιον chỉ một bé gái hoặc cô gái trẻ. Trong văn cảnh này, “em gái” trang nhã, tự nhiên và tránh nhầm với nghĩa ‘chị/em gái’ theo quan hệ họ hàng.
theological_decisions:
- issue: Cách dịch ἠγέρθη trong bối cảnh cô gái được phục hồi sự sống
  choice: đứng dậy
  alternative: được làm cho sống dậy
  rationale: Động từ Hy Lạp ở thể thụ động nhưng có thể được diễn đạt theo nghĩa nội động. Bản chính ưu tiên câu tiếng Việt tự nhiên, còn chú thích bảo tồn khả năng hiểu theo thể thụ động và hàm ý tác nhân.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và dễ hiểu. Dùng “Đức Giê-su” để xác định rõ chủ thể vốn được lược trong câu Hy Lạp. Đại từ “em” phù hợp với một bé gái và tránh lặp danh từ; chú thích giữ nguyên sự mơ hồ về sắc thái nội động hay thụ động của ἠγέρθη.
