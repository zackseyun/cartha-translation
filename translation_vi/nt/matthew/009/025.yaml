revisions:
- from: Nhưng khi đám đông đã bị đưa ra ngoài, Đức Giê-su đi vào, cầm lấy tay em, và em gái đứng dậy.[a]
  to: Nhưng khi đám đông đã bị đưa ra ngoài, Đức Giê-su đi vào, cầm lấy tay cô bé, và cô bé đứng dậy.[a]
  rationale: Thay “em gái” bằng “cô bé” để dịch chính xác và không mơ hồ τὸ κοράσιον, đồng thời lặp lại danh từ để câu rõ ràng. Giữ “đứng dậy” trong bản chính như một cách diễn đạt tự nhiên của ἠγέρθη, và giữ khả năng dịch thụ động trong chú thích.
