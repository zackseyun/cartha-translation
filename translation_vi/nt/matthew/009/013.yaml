  - severity: low
    issue: “sinh tế” có sắc thái cổ/chuyên biệt hơn cần thiết
    rationale: θυσία có thể được chuyển tự nhiên bằng “lễ tế”; cách này rõ nghĩa trong tiếng Việt tiêu chuẩn hiện đại mà không thay đổi nội dung.
