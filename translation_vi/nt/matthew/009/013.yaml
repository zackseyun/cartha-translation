id: MAT.9.13
reference: Matthew 9:13
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: πορευθέντες δὲ μάθετε τί ἐστιν· Ἔλεος θέλω καὶ οὐ θυσίαν· οὐ γὰρ ἦλθον καλέσαι δικαίους ἀλλὰ ⸀ἁμαρτωλούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/013.yaml
  text: 'But go and learn what this means: ‘I desire mercy and not sacrifice.’ For I did not come to call the righteous[c][b][a], but sinners.'
translation:
  language: vi
  text: 'Nhưng hãy đi và học xem điều này có nghĩa gì: “Ta muốn lòng thương xót, chứ không muốn lễ tế.”[a] Vì Ta đến không phải để kêu gọi người công chính,[b] nhưng người tội lỗi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Trích Ô-sê 6:6.
    reason: cross_reference
  - marker: b
    text: Cũng có thể hiểu là “những người nghĩ mình là công chính”; nguyên văn Hy Lạp chỉ nói “người công chính”.
    reason: alternative_reading
lexical_decisions:
- source_word: πορευθέντες δὲ μάθετε
  choice: Nhưng hãy đi và học
  rationale: Phân từ aorist πορευθέντες đi với mệnh lệnh μάθετε tạo thành cách nói mang nghĩa mệnh lệnh; cách dịch này tự nhiên và giữ sắc thái quở trách.
- source_word: τί ἐστιν
  choice: xem lời này có nghĩa gì
  rationale: Diễn đạt tự nhiên ý yêu cầu tìm hiểu ý nghĩa của câu Kinh Thánh, thay vì dịch sát nhưng cứng là “điều này là gì”.
- source_word: Ἔλεος
  choice: lòng thương xót
  rationale: Giữ cả chiều kích đạo đức lẫn âm hưởng giao ước của ἔλεος trong lời trích Ô-sê.
- source_word: θέλω
  choice: Ta muốn
  rationale: Thể hiện trực tiếp ý muốn của Đức Chúa Trời trong lời trích; “Ta” phù hợp văn phong Kinh Thánh trang trọng mà vẫn hiện đại.
- source_word: θυσίαν
  choice: sinh tế
  rationale: Thuật ngữ gọn, quen thuộc để chỉ lễ vật được dâng trong nghi thức hiến tế, đồng thời giữ số ít của nguyên văn.
- source_word: ἦλθον καλέσαι
  choice: tôi đến ... để kêu gọi
  rationale: Diễn đạt mục đích sứ vụ của Chúa Giê-su và giữ nghĩa rộng của καλέσαι là gọi, triệu gọi.
- source_word: δικαίους
  choice: người công chính
  rationale: Giữ nguyên phạm trù của tính từ được dùng như danh từ, không tự ý xác định đây là người thật sự công chính hay người tự cho mình công chính.
- source_word: ἁμαρτωλούς
  choice: người tội lỗi
  rationale: Cách nói tự nhiên trong tiếng Việt, giữ sự tương phản đạo đức rõ nét với “người công chính”.
theological_decisions:
- issue: Sức nặng của lời trích Ô-sê 6:6
  choice: 'Dịch thẳng sự tương phản: “Ta muốn lòng thương xót, chứ không muốn sinh tế.”'
  alternative: Diễn giải rằng Đức Chúa Trời hoàn toàn bác bỏ mọi sinh tế, hoặc làm nhẹ thành một ưu tiên chỉ trong tình huống này.
  rationale: Nguyên văn giữ sự tương phản mang tính tiên tri; bản dịch không biến câu này thành lời bãi bỏ mọi sinh tế, cũng không làm giảm sức quở trách của nó.
- issue: “Người công chính” ám chỉ ai
  choice: Giữ nguyên “người công chính” trong chính văn.
  alternative: Dịch là “những người tưởng mình là công chính” hoặc “kẻ tự cho mình là công chính”.
  rationale: Ngữ cảnh có thể gợi ý sắc thái mỉa mai, nhưng tiếng Hy Lạp chỉ nói δικαίους; vì vậy bản dịch bảo toàn sự mơ hồ và không đưa cách giải thích vào chính văn.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “Ta” trong lời Đức Chúa Trời được trích dẫn và “tôi” trong lời Chúa Giê-su để giữ lời nói tự nhiên, không áp đặt một hệ thống đại từ mang dấu ấn giáo phái.
