  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Καὶ ⸀ἐμβὰς ⸀εἰς πλοῖον διεπέρασεν καὶ ἦλθεν εἰς τὴν ἰδίαν πόλιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/001.yaml
  text: And after getting into a boat[a], he crossed over and came to his own city.
translation:
  language: vi
  text: Sau khi lên thuyền, Đức Chúa Jêsus qua bên kia và đến thành của mình.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “quê hương của Ngài.” Nguyên văn là “thành của chính mình”; theo mạch truyện, có lẽ chỉ Ca-bê-na-um.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμβὰς
  choice: xuống thuyền
  rationale: Phân từ bất định của ἐμβαίνω diễn tả hành động xảy ra trước các động từ chính. Trong tiếng Việt, “xuống thuyền” là cách nói tự nhiên cho việc bước vào hoặc lên một chiếc thuyền; kết hợp với “rồi” vẫn thể hiện trình tự hành động.
- source_word: πλοῖον
  choice: thuyền
  rationale: πλοῖον là từ thông dụng chỉ phương tiện đường thủy; trong bối cảnh biển Ga-li-lê, “thuyền” thích hợp hơn “tàu”. Tiếng Việt không cần biểu thị mạo từ bất định.
- source_word: διεπέρασεν
  choice: vượt qua bên kia
  rationale: διαπεράω chỉ việc đi từ bờ này sang bờ kia, thường qua đường thủy. “Vượt qua bên kia” giữ được sắc thái định hướng của động từ.
- source_word: ἦλθεν
  choice: đến
  rationale: Trong ngữ cảnh này, ἔρχομαι diễn tả việc đến nơi; “đến” tự nhiên và không áp đặt góc nhìn không cần thiết.
- source_word: ἰδίαν πόλιν
  choice: thành của mình
  rationale: Cách dịch này giữ nghĩa thuộc về hoặc gắn bó của ἴδιος mà không diễn giải thành “quê hương” hay xác định thành phố là Ca-bê-na-um.
- source_word: Καὶ ... καὶ
  choice: Rồi ... và
  rationale: Καί đầu câu nối tiếp mạch kể chuyện nên được diễn đạt tự nhiên bằng “Rồi”; καί thứ hai nối hai hành động chính bằng “và”.
theological_decisions:
- issue: Thành được gọi là “thành của mình”
  choice: Giữ cách nói trung tính “thành của mình”, không nêu tên thành trong chính văn.
  alternative: Hiểu là Ca-bê-na-um theo mạch truyện của Ma-thi-ơ, hoặc diễn đạt là quê hương/nơi cư ngụ của Ngài.
  rationale: Nguyên văn không nêu tên thành và cũng không dùng từ chuyên biệt có nghĩa là “quê hương”. Cách dịch trực tiếp bảo toàn độ mở của câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Chúa Jêsus” để làm rõ chủ ngữ vốn được ngữ cảnh Hy Lạp xác định; “thành” giữ sắc thái đô thị của πόλις. Dấu chú thích [a] đặt ngay sau cụm từ cần giải thích.
