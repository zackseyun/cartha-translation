id: MAT.9.8
reference: Matthew 9:8
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἰδόντες δὲ οἱ ὄχλοι ⸀ἐφοβήθησαν καὶ ἐδόξασαν τὸν θεὸν τὸν δόντα ἐξουσίαν τοιαύτην τοῖς ἀνθρώποις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/008.yaml
  text: But when the crowds saw it[a], they were afraid and glorified God[b], who had given such authority to men.
translation:
  language: vi
  text: Khi thấy vậy, dân chúng sợ hãi[a] và tôn vinh Đức Chúa Trời, Đấng đã ban thẩm quyền như thế cho con người[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể hiểu là “đầy lòng kính sợ.” Động từ Hy Lạp có nghĩa trực tiếp là “sợ,” nhưng nỗi sợ ở đây có thể bao hàm sự kinh ngạc đầy tôn kính.
    reason: lexical_alternative
  - marker: b
    text: Hay “cho người ta” hoặc “cho loài người.” Tiếng Hy Lạp dùng danh từ số nhiều chỉ những con người, và trong ngữ cảnh này có thể đại diện cho nhân loại nói chung.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδόντες
  choice: Khi thấy vậy
  rationale: Phân từ bất định quá khứ được diễn đạt tự nhiên như một mệnh đề thời gian; “vậy” chỉ sự việc vừa xảy ra trong văn cảnh mà không giải thích thêm.
- source_word: δὲ
  choice: Khi…
  rationale: Tiểu từ chuyển ý được thể hiện qua cấu trúc chuyển sang phản ứng của dân chúng; dịch riêng là “nhưng” sẽ kém tự nhiên trong tiếng Việt ở đây.
- source_word: οἱ ὄχλοι
  choice: dân chúng
  rationale: Danh từ tập hợp này diễn đạt tự nhiên số đông trong tiếng Việt, dù tiếng Hy Lạp dùng hình thức số nhiều.
- source_word: ἐφοβήθησαν
  choice: sợ hãi
  rationale: Giữ nghĩa trực tiếp của φοβέομαι và không làm nhẹ thành chỉ sự kính sợ hay kinh ngạc; sắc thái kính sợ vẫn được ghi nhận ở chú thích.
- source_word: ἐδόξασαν
  choice: tôn vinh
  rationale: Cách dịch hiện đại, trang trọng của δοξάζω, giữ được sức nặng thần học tốt hơn cách diễn đạt chỉ là “khen ngợi”.
- source_word: τὸν θεὸν
  choice: Đức Chúa Trời
  rationale: Danh xưng tiếng Việt trang trọng và quen thuộc dành cho θεός trong văn cảnh Kinh Thánh.
- source_word: τὸν δόντα
  choice: Đấng đã ban
  rationale: Phân từ có mạo từ bổ nghĩa cho Đức Chúa Trời được chuyển thành mệnh đề quan hệ; “đã ban” thể hiện hành động có trước phản ứng của dân chúng.
- source_word: ἐξουσίαν
  choice: thẩm quyền
  rationale: ἐξουσία chỉ quyền hạn hay quyền hành chính đáng, chính xác hơn từ “quyền năng” vốn dễ nhấn vào năng lực.
- source_word: τοιαύτην
  choice: như thế
  rationale: Giữ ý chỉ loại hoặc mức độ của thẩm quyền vừa được chứng kiến mà không định rõ hơn nguyên văn.
- source_word: τοῖς ἀνθρώποις
  choice: cho con người
  rationale: ἄνθρωποι ở đây có thể chỉ loài người nói chung. “Con người” vừa tự nhiên trong tiếng Việt vừa giữ sự căng thẳng khi dân chúng nhìn thẩm quyền được bày tỏ nơi một con người.
theological_decisions:
- issue: Phản ứng của dân chúng là sợ hãi hay kính sợ kinh ngạc
  choice: sợ hãi
  alternative: đầy lòng kính sợ; kinh ngạc kính sợ
  rationale: Động từ Hy Lạp trực tiếp mang nghĩa sợ. Văn cảnh có thể bao gồm lòng kính sợ, nhưng bản dịch chính không tự ý làm nhẹ hoặc giải quyết sắc thái cảm xúc ấy.
- issue: Phạm vi của τοῖς ἀνθρώποις
  choice: cho con người
  alternative: cho người ta; cho những người
  rationale: Danh từ số nhiều có thể được dùng đại diện cho nhân loại nói chung. Cách dịch này không giới hạn đối tượng vào nam giới, đồng thời không biến câu thành một tuyên bố chi tiết hơn về việc thẩm quyền được phân phối cho mọi người.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu giữ nhịp kể chuyện gọn; dùng “thẩm quyền” để phân biệt quyền hành với năng lực, và đặt chú thích ngay sau các từ ngữ có phương án hiểu khác.
