id: MAT.9.20
reference: Matthew 9:20
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Καὶ ἰδοὺ γυνὴ αἱμορροοῦσα δώδεκα ἔτη προσελθοῦσα ὄπισθεν ἥψατο τοῦ κρασπέδου τοῦ ἱματίου αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/020.yaml
  text: And behold[b][a], a woman who had been suffering from bleeding for twelve years came up behind him and touched the fringe of his garment.
translation:
  language: vi
  text: Kìa, một người phụ nữ bị xuất huyết đã mười hai năm đến gần Ngài từ phía sau và chạm vào viền áo[a][b] của Ngài.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “tua áo”, “mép áo” hoặc “gấu áo”; từ Hy Lạp có thể chỉ phần viền hay mép của y phục, có thể bao gồm tua áo theo cách ăn mặc của người Do Thái.
    reason: lexical_alternative
  - marker: b
    text: Xem Dân Số 15:38 và Phục Truyền Luật Lệ Ký 22:12 về các tua áo được quy định trong luật pháp dành cho Israel.
    reason: cross_reference
lexical_decisions:
- source_word: Καὶ ἰδοὺ
  choice: Kìa
  rationale: Giữ chức năng thu hút sự chú ý và sắc thái sống động, bất ngờ của ἰδού; không cần dịch máy móc liên từ καί trong văn kể tiếng Việt.
- source_word: γυνὴ αἱμορροοῦσα
  choice: một người phụ nữ bị rong huyết
  rationale: Diễn đạt tự nhiên một tình trạng xuất huyết kéo dài ở phụ nữ; tránh từ ngữ gợi một cơn xuất huyết cấp tính.
- source_word: δώδεκα ἔτη
  choice: đã mười hai năm
  rationale: Cấu trúc với “đã” diễn tả tự nhiên khoảng thời gian kéo dài đến thời điểm câu chuyện.
- source_word: προσελθοῦσα ὄπισθεν
  choice: đến từ phía sau
  rationale: Giữ hướng tiếp cận từ đằng sau và thể hiện hành động xảy ra trước hành động chính.
- source_word: ἥψατο
  choice: chạm vào
  rationale: Phù hợp nghĩa theo ngữ cảnh của ἅπτω, không cường điệu thành nắm hoặc giữ lấy.
- source_word: τοῦ κρασπέδου
  choice: tua áo
  rationale: κράσπεδον có thể chỉ mép, viền hoặc tua áo. “Tua áo” tự nhiên và giữ được khả năng liên hệ với tua trên y phục Do Thái, nhưng chú thích vẫn nêu các nghĩa khác để không quyết định quá mức.
- source_word: τοῦ ἱματίου αὐτοῦ
  choice: áo của Ngài
  rationale: “Áo” là cách gọi rộng và tự nhiên cho ἱμάτιον; đại từ tôn kính “Ngài” phù hợp văn phong Kinh Thánh tiếng Việt mà không thêm nội dung vào nguyên văn.
theological_decisions:
- issue: Ý nghĩa Do Thái có thể có của κράσπεδον trên y phục
  choice: Dịch “tua áo” trong chính văn và giải thích độ rộng ngữ nghĩa trong chú thích
  alternative: Dịch “mép áo” hoặc “gấu áo” để chỉ chung phần rìa của y phục
  rationale: Bối cảnh y phục Do Thái khiến nghĩa “tua áo” có cơ sở, nhưng từ Hy Lạp vẫn có thể chỉ viền hoặc mép áo. Chú thích bảo tồn độ mở từ vựng và không khẳng định một biểu tượng thần học mà câu này không giải thích.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. “Kìa” giữ sức gợi của lời kể; “rong huyết” là thuật ngữ quen thuộc cho tình trạng chảy máu kéo dài ở phụ nữ. Các dấu chú thích đều được đặt ngay sau “tua áo”, là cụm từ mà chúng giải thích.
