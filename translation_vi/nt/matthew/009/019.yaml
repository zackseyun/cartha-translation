  text: καὶ ἐγερθεὶς ὁ Ἰησοῦς ⸀ἠκολούθει αὐτῷ καὶ οἱ μαθηταὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/019.yaml
  text: And Jesus rose and followed him, and his disciples did too.
translation:
  language: vi
  text: Đức Giê-su đứng dậy, đi theo ông; các môn đệ của Ngài cũng đi theo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγερθεὶς
  choice: đứng dậy
  rationale: Phân từ bất định quá khứ, hình thức bị động nhưng được dùng với nghĩa nội động trong ngữ cảnh này; “đứng dậy” diễn đạt tự nhiên việc Đức Giê-su rời tư thế đang ngồi để lên đường.
- source_word: ἠκολούθει
  choice: đi theo
  rationale: Thì vị hoàn có thể gợi hành động đang tiếp diễn; trong lời kể tiếng Việt, “đi theo” vừa tự nhiên vừa giữ được ý theo chân của ἀκολουθέω.
- source_word: αὐτῷ
  choice: ông
  rationale: Đại từ chỉ người nam có tiền ngữ là vị lãnh đạo trong câu trước. “Ông” phân biệt người ấy với Đức Giê-su mà không bổ sung danh xưng không có trong nguyên văn.
- source_word: μαθηταὶ
  choice: các môn đệ
  rationale: “Môn đệ” là cách dịch chuẩn xác trong bối cảnh các sách Phúc Âm, giữ được quan hệ thầy–trò và ý nghĩa người theo học.
- source_word: καὶ οἱ μαθηταὶ αὐτοῦ
  choice: các môn đệ của Ngài cũng đi theo
  rationale: Nguyên văn lược bỏ động từ ở vế thứ hai. Tiếng Việt lặp lại “đi theo” để câu rõ và tự nhiên; “của Ngài” xác định các môn đệ thuộc về Đức Giê-su.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Đức Giê-su” cho ὁ Ἰησοῦς, “Ngài” khi quy chiếu về Đức Giê-su, và “ông” cho người lãnh đạo ở câu trước nhằm tránh nhập nhằng đại từ.
