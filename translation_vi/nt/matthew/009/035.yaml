id: MAT.9.35
reference: Matthew 9:35
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Καὶ περιῆγεν ὁ Ἰησοῦς τὰς πόλεις πάσας καὶ τὰς κώμας, διδάσκων ἐν ταῖς συναγωγαῖς αὐτῶν καὶ κηρύσσων τὸ εὐαγγέλιον τῆς βασιλείας καὶ θεραπεύων πᾶσαν νόσον καὶ πᾶσαν ⸀μαλακίαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/035.yaml
  text: And Jesus went throughout all the cities and villages[b][a], teaching in their synagogues and proclaiming the good news of the kingdom and healing every disease and every sickness.
translation:
  language: vi
  text: Đức Giê-su đi khắp mọi thành thị và làng mạc, giảng dạy trong các hội đường của họ, loan báo tin mừng về vương quốc[a], và chữa lành mọi bệnh tật cùng mọi chứng đau yếu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “phúc âm của vương quốc.”'
    reason: lexical_alternative
  - marker: b
    text: 'Hay: “mọi bệnh tật và mọi chứng suy nhược.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: περιῆγεν
  choice: đi khắp
  rationale: Diễn đạt tự nhiên hoạt động lưu hành liên tục của thì chưa hoàn thành, không biến câu thành một chuyến đi đơn lẻ.
- source_word: πόλεις πάσας καὶ τὰς κώμας
  choice: khắp mọi thành thị và làng mạc
  rationale: Giữ phạm vi bao quát của πάσας và sự phân biệt giữa các trung tâm đô thị với những khu dân cư nhỏ hơn.
- source_word: διδάσκων
  choice: giảng dạy
  rationale: Diễn đạt rõ hành động dạy dỗ đang diễn ra song song với việc loan báo và chữa lành.
- source_word: συναγωγαῖς αὐτῶν
  choice: các hội đường của họ
  rationale: Giữ thuật ngữ lịch sử-tôn giáo “hội đường” và đại từ αὐτῶν, dù đối tượng của “họ” được xác định theo văn cảnh.
- source_word: κηρύσσων
  choice: loan báo
  rationale: Truyền đạt sắc thái công khai công bố của κηρύσσω bằng lối nói hiện đại, trang trọng nhưng không quá chuyên biệt về giáo hội.
- source_word: τὸ εὐαγγέλιον τῆς βασιλείας
  choice: tin mừng về vương quốc
  rationale: “Tin mừng” chuyển tải nghĩa thông thường của εὐαγγέλιον; “về vương quốc” giữ quan hệ sở hữu/chủ đề của cụm Hy Lạp mà không tự ý xác định thêm.
- source_word: θεραπεύων
  choice: chữa lành
  rationale: Cách diễn đạt tự nhiên trong văn cảnh các phép chữa bệnh của sách Tin Mừng.
- source_word: πᾶσαν νόσον
  choice: mọi bệnh tật
  rationale: Phản ánh phạm vi bao quát của πᾶσαν và nghĩa bệnh lý thông thường của νόσος.
- source_word: πᾶσαν μαλακίαν
  choice: mọi chứng đau yếu
  rationale: Giữ sắc thái yếu đau/suy nhược của μαλακία và phần nào phân biệt nó với νόσος, đồng thời dùng tiếng Việt dễ hiểu.
theological_decisions:
- issue: Cách dịch εὐαγγέλιον
  choice: tin mừng
  alternative: phúc âm
  rationale: “Tin mừng” làm rõ nghĩa từ vựng cho độc giả hiện đại mà không làm giảm nội dung thần học; phương án truyền thống được giữ trong chú thích.
- issue: Ý nghĩa của τῆς βασιλείας
  choice: về vương quốc
  alternative: của vương quốc
  rationale: Cách dịch “về” tự nhiên trong tiếng Việt và không buộc cụm sở hữu Hy Lạp vào một quan hệ thần học hẹp; không thêm “Đức Chúa Trời” vì câu Hy Lạp không nêu rõ.
- issue: Phạm vi của πᾶσαν νόσον καὶ πᾶσαν μαλακίαν
  choice: mọi bệnh tật cùng mọi chứng đau yếu
  alternative: mọi bệnh tật và mọi chứng suy nhược
  rationale: Giữ phạm vi toàn diện do πᾶσαν được lặp lại, đồng thời bảo tồn hai phạm trù gần nghĩa thay vì gộp thành một.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Giê-su” theo cách gọi tôn kính phổ biến; “hội đường” giữ bối cảnh Do Thái lịch sử. Các phân từ được thể hiện bằng chuỗi động từ song song để câu tiếng Việt tự nhiên mà vẫn phản ánh cấu trúc nguồn.
