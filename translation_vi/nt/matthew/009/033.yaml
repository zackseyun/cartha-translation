id: MAT.9.33
reference: Matthew 9:33
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἐκβληθέντος τοῦ δαιμονίου ἐλάλησεν ὁ κωφός. καὶ ἐθαύμασαν οἱ ὄχλοι λέγοντες· Οὐδέποτε ἐφάνη οὕτως ἐν τῷ Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/033.yaml
  text: And when the demon had been cast out[a], the mute man spoke. And the crowds were amazed, saying, “Never has anything like this appeared in Israel.”
translation:
  language: vi
  text: 'Sau khi quỷ bị đuổi ra, người câm[a] nói được. Đám đông kinh ngạc và nói: “Ở Israel chưa bao giờ người ta thấy điều gì như thế này.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hy Lạp được dịch là “người câm” cũng có thể có nghĩa là “người điếc”; ở đây, ngữ cảnh nghiêng về nghĩa “người câm” vì câu nhấn mạnh rằng người ấy nói được.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκβληθέντος
  choice: Sau khi ... bị đuổi ra
  rationale: Phân từ bất định thụ động trong kết cấu sở hữu cách tuyệt đối diễn tả hành động xảy ra trước động từ chính; cách dịch này tự nhiên và giữ rõ quan hệ thời gian.
- source_word: δαιμονίου
  choice: quỷ
  rationale: Trong bối cảnh trừ quỷ của các sách Phúc Âm, δαιμόνιον được diễn đạt chính xác và gọn bằng “quỷ”.
- source_word: ἐλάλησεν
  choice: nói được
  rationale: Động từ cho biết người trước đó không nói được nay đã nói; “nói được” tự nhiên trong tiếng Việt và làm rõ kết quả của việc quỷ bị đuổi ra mà không thêm ý “bắt đầu”.
- source_word: ὁ κωφός
  choice: người câm
  rationale: κωφός có thể chỉ người điếc hoặc người câm, nhưng ngữ cảnh trực tiếp nhấn mạnh rằng người ấy nói được, nên “người câm” phù hợp hơn.
- source_word: ἐθαύμασαν
  choice: kinh ngạc
  rationale: Diễn đạt tự nhiên mức độ sửng sốt, thán phục của đám đông trước sự việc.
- source_word: οἱ ὄχλοι
  choice: đám đông
  rationale: Dù danh từ Hy Lạp ở số nhiều, tiếng Việt thường dùng danh từ tập hợp “đám đông” tự nhiên hơn “các đám đông” trong ngữ cảnh này.
- source_word: Οὐδέποτε
  choice: chưa bao giờ
  rationale: Kết hợp tự nhiên với câu tiếng Việt nói về một điều chưa từng được chứng kiến cho đến thời điểm ấy.
- source_word: ἐφάνη
  choice: người ta thấy
  rationale: Dạng thụ động của φαίνω có thể mang nghĩa “xuất hiện” hoặc theo lối nói tự nhiên là “được thấy”; cấu trúc vô nhân xưng “người ta thấy” phù hợp tiếng Việt trong lời cảm thán này.
- source_word: οὕτως
  choice: điều gì như thế này
  rationale: οὕτως chỉ tính chất hoặc cách thức của sự việc vừa xảy ra; tiếng Việt cần bổ sung một chủ thể khái quát để câu đầy đủ và tự nhiên.
- source_word: ἐν τῷ Ἰσραήλ
  choice: Ở Israel
  rationale: Giữ được khả năng chỉ cả phạm vi đất nước lẫn cộng đồng Israel, không thu hẹp nghĩa thành riêng lãnh thổ hay dân tộc.
theological_decisions:
- issue: Phạm vi nghĩa của κωφός trong bối cảnh chữa lành và trừ quỷ
  choice: người câm
  alternative: người điếc
  rationale: Từ Hy Lạp có thể mang cả hai nghĩa, nhưng kết quả được nêu ngay sau đó là người ấy nói được, cho thấy tình trạng không nói được là trọng tâm. Chú thích bảo tồn nghĩa thay thế thực sự của từ.
- issue: Cách hiểu ἐφάνη trong lời nhận xét của đám đông
  choice: người ta thấy
  alternative: xuất hiện
  rationale: Cả hai đều nằm trong phạm vi nghĩa của động từ; “người ta thấy” tự nhiên hơn trong tiếng Việt khi nói một việc chưa từng xảy ra hoặc được chứng kiến, nhưng không biến câu thành một tuyên bố thần học rộng hơn.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “quỷ bị đuổi ra” theo cách nói quen thuộc của ngữ cảnh trừ quỷ; dùng “Israel” theo chính tả tên riêng phổ biến. Dấu chú thích [a] đặt ngay sau câu để mọi ký hiệu chú thích đều xuất hiện trong chính văn.
