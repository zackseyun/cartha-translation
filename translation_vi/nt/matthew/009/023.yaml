- from: Khi Đức Giê-su vào nhà vị lãnh đạo[a], thấy những người thổi sáo[b] và đám đông đang ồn ào náo động[c],
  to: Khi Đức Giê-su vào nhà của vị lãnh đạo[a] và thấy những người thổi sáo[b] cùng đám đông đang huyên náo[c],
  rationale: Bản sửa chỉ cải thiện cú pháp và độ tự nhiên của tiếng Việt, đồng thời loại bỏ sự lặp nghĩa. Không thay đổi ý nghĩa, không thu hẹp danh xưng ἄρχων, và vẫn giữ câu ở dạng chưa hoàn tất để nối với phần kể tiếp theo.
