source:
  edition: SBLGNT
  text: καὶ ἐλθὼν ὁ Ἰησοῦς εἰς τὴν οἰκίαν τοῦ ἄρχοντος καὶ ἰδὼν τοὺς αὐλητὰς καὶ τὸν ὄχλον θορυβούμενον
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/023.yaml
  text: And when Jesus came into the ruler's house and saw the flute players and the crowd making a commotion[c][b][a],
translation:
  language: vi
  text: Khi Đức Giê-su vào nhà của vị lãnh đạo[a] và thấy những người thổi sáo[b] cùng đám đông đang huyên náo[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “vị quan chức”. Đối chiếu các trình thuật song song, người này có thể là “người lãnh đạo hội đường”. Tuy nhiên, ở đây Ma-thi-ơ chỉ gọi ông là “vị lãnh đạo”.
    reason: alternative_reading
  - marker: b
    text: Trong bối cảnh tang lễ, những người thổi sáo thường hiện diện cùng những người than khóc chuyên nghiệp.
    reason: cultural_note
  - marker: c
    text: 'Hoặc: “đang náo loạn”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθὼν
  choice: Khi Đức Giê-su vào
  rationale: Phân từ bất định diễn tả trình tự thời gian; cấu trúc “Khi… vào” tự nhiên trong tiếng Việt và giữ được quan hệ thời gian.
- source_word: οἰκίαν
  choice: nhà
  rationale: Nghĩa trực tiếp, tự nhiên trong bối cảnh tường thuật.
- source_word: ἄρχοντος
  choice: vị lãnh đạo
  rationale: Giữ nghĩa tương đối rộng của ἄρχων, không tự ý xác định người này là người lãnh đạo hội đường dựa vào các sách song song.
- source_word: ἰδὼν
  choice: thấy
  rationale: Cách dịch trực tiếp, tự nhiên của động từ tri giác trong mạch kể.
- source_word: αὐλητὰς
  choice: những người thổi sáo
  rationale: Chỉ những người chơi sáo hoặc ống tiêu; cách nói này rõ nghĩa với độc giả hiện đại.
- source_word: ὄχλον
  choice: đám đông
  rationale: Tương đương thông dụng và tự nhiên của ὄχλος trong văn kể chuyện.
- source_word: θορυβούμενον
  choice: đang ồn ào náo động
  rationale: Diễn đạt trạng thái huyên náo của đám đông mà không thêm nguyên nhân hay cảm xúc không được nói rõ trong câu.
theological_decisions:
- issue: Danh tính của chủ nhà
  choice: vị lãnh đạo
  alternative: vị quan chức; người lãnh đạo hội đường
  rationale: Ma-thi-ơ chỉ dùng từ ἄρχων, một danh xưng rộng. Bản dịch không đưa chi tiết cụ thể hơn từ các trình thuật song song vào chính văn.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Đức Giê-su” theo lối gọi tôn kính phổ biến; câu giữ dạng chưa kết thúc vì nguyên văn câu 23 nối sang lời kể tiếp theo.
