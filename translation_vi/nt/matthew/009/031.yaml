  text: οἱ δὲ ἐξελθόντες διεφήμισαν αὐτὸν ἐν ὅλῃ τῇ γῇ ἐκείνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/031.yaml
  text: But after they went out[a], they spread the news about him throughout that whole region.
translation:
  language: vi
  text: Nhưng sau khi ra ngoài, họ loan truyền tin tức về Ngài khắp cả vùng ấy.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “khắp cả miền đất ấy.” Từ Hy Lạp γῆ có thể có nghĩa là “đất,” “miền đất” hoặc “vùng.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Nhưng
  rationale: Diễn tả sự tương phản nhẹ với lời Chúa Giê-su vừa truyền họ không được cho ai biết.
- source_word: ἐξελθόντες
  choice: sau khi ra khỏi đó
  rationale: Phân từ bất định diễn tả hành động xảy ra trước động từ chính; cách dịch này tự nhiên trong tiếng Việt. Từ “đó” được thêm theo ngữ cảnh để câu rõ nghĩa, dù nguyên văn chỉ nói “đi ra”.
- source_word: διεφήμισαν
  choice: họ loan tin
  rationale: Động từ chỉ việc phổ biến rộng rãi tin tức hoặc danh tiếng; “loan tin” vừa tự nhiên vừa giữ sắc thái công bố rộng khắp.
- source_word: αὐτὸν
  choice: về Ngài
  rationale: Trong cấu trúc tiếng Việt, nội dung được loan truyền được diễn đạt tự nhiên là “tin về Ngài”; đại từ tôn kính phù hợp văn phong Kinh Thánh tiếng Việt.
- source_word: ἐν ὅλῃ τῇ γῇ ἐκείνῃ
  choice: khắp cả vùng ấy
  rationale: γῆ ở đây hợp lý nhất là một vùng hay khu vực địa phương; “khắp cả” truyền đạt phạm vi bao trùm toàn vùng.
theological_decisions:
- issue: Phạm vi địa lý của γῆ
  choice: vùng
  alternative: đất; miền đất
  rationale: Mạch truyện nói đến việc tin tức lan truyền trong khu vực địa phương. “Vùng” không phóng đại phạm vi thành cả một xứ hay toàn cõi đất.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Câu giữ sự tương phản với mệnh lệnh giữ kín ở câu trước, đồng thời diễn đạt tự nhiên trình tự hành động.
