id: MAT.9.6
reference: Matthew 9:6
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἵνα δὲ εἰδῆτε ὅτι ἐξουσίαν ἔχει ὁ υἱὸς τοῦ ἀνθρώπου ἐπὶ τῆς γῆς ἀφιέναι ἁμαρτίας— τότε λέγει τῷ παραλυτικῷ· ⸀Ἐγερθεὶς ἆρόν σου τὴν κλίνην καὶ ὕπαγε εἰς τὸν οἶκόν σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/006.yaml
  text: But so that you may know that the Son of Man has authority on earth to forgive sins”—then he says to the paralytic[a], “Get up, pick up your bed[b], and go to your house.”
translation:
  language: vi
  text: 'Nhưng để các ông biết rằng Con Người có thẩm quyền tha tội trên đất—rồi Ngài nói với người bị liệt[a]: “Hãy đứng dậy, nhấc giường[b] của anh lên và đi về nhà.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “người bại liệt.” Từ Hy Lạp được dùng như danh từ, chỉ người bị liệt.
    reason: lexical_alternative
  - marker: b
    text: Hay “tấm đệm nằm.” Từ Hy Lạp κλίνη có thể chỉ giường, trường kỷ hoặc tấm đệm dùng để nằm.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα δὲ εἰδῆτε
  choice: Nhưng để các con biết
  rationale: Giữ sắc thái chuyển ý nhẹ của δέ và mục đích của ἵνα; cách diễn đạt tự nhiên trong tiếng Việt. Đại từ số nhiều phản ánh εἰδῆτε.
- source_word: ἐξουσίαν ἔχει
  choice: có thẩm quyền
  rationale: ἐξουσία nhấn mạnh quyền chính đáng, không chỉ khả năng hay sức mạnh.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Con Người
  rationale: Giữ danh hiệu quen thuộc của Chúa Giê-su và âm hưởng có thể liên hệ đến Đa-ni-ên 7, thay vì diễn giải thành một cách gọi chung về con người.
- source_word: ἐπὶ τῆς γῆς
  choice: trên đất
  rationale: Diễn đạt trực tiếp phạm vi nơi thẩm quyền ấy được thi hành và giữ gần hình thức Hy Lạp.
- source_word: ἀφιέναι ἁμαρτίας
  choice: tha tội
  rationale: Trong ngữ cảnh này, ἀφίημι mang nghĩa tha hoặc xóa bỏ tội; “tha tội” là cách nói rõ ràng, tự nhiên.
- source_word: τότε λέγει
  choice: bấy giờ Ngài phán
  rationale: “Bấy giờ” giữ bước chuyển trong lời kể; “phán” phù hợp lối văn Kinh Thánh trang trọng khi Chúa Giê-su nói. Tiếng Việt không cần tái hiện máy móc thì hiện tại lịch sử.
- source_word: τῷ παραλυτικῷ
  choice: với người bại liệt
  rationale: Tính từ được dùng như danh từ; cách dịch này ngắn gọn và dễ hiểu trong tiếng Việt hiện đại.
- source_word: Ἐγερθεὶς
  choice: Hãy đứng dậy
  rationale: Phân từ aorist có lực mệnh lệnh trong chuỗi hành động; “hãy đứng dậy” truyền đạt tự nhiên lời truyền gọi người bệnh trỗi dậy.
- source_word: ἆρόν
  choice: nhấc ... lên
  rationale: Thể hiện hành động nâng vật lên để mang đi, sát nghĩa αἴρω mà vẫn tự nhiên.
- source_word: κλίνην
  choice: giường
  rationale: κλίνη có thể chỉ giường, trường kỷ hoặc tấm đệm nằm; “giường” là lựa chọn bao quát nhất, còn khả năng “tấm đệm” được ghi chú.
- source_word: ὕπαγε εἰς τὸν οἶκόν σου
  choice: đi về nhà
  rationale: “Về nhà” là cách nói tiếng Việt tự nhiên cho chuyển động trở lại nơi ở của người nghe; không cần dịch cứng là “đi đến nhà của con”.
theological_decisions:
- issue: Danh hiệu Cơ Đốc học ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Con Người
  alternative: Con của loài người; Đấng làm người
  rationale: “Con Người” bảo tồn danh hiệu tự xưng và sự căng thẳng liên văn bản có thể hướng đến Đa-ni-ên 7, không khóa nghĩa vào một lời diễn giải.
- issue: Bản chất của ἐξουσία trong việc tha tội
  choice: thẩm quyền
  alternative: quyền năng; quyền
  rationale: Câu nhấn mạnh tư cách và quyền chính đáng để tha tội, chứ không chỉ nói đến năng lực thực hiện phép lạ.
- issue: Cách xưng hô của Chúa Giê-su với đám đông
  choice: các con
  alternative: các ngươi; quý vị; anh em
  rationale: Động từ Hy Lạp chỉ số nhiều nhưng không mã hóa cấp độ xưng hô. “Các con” phù hợp lời Chúa Giê-su trong văn phong Việt trang trọng, song cấp độ quan hệ vẫn là điều ngôn ngữ đích phải diễn giải.
translation_notes:
  register: 'Tiếng Việt hiện đại, trang trọng và dễ đọc. Giữ “Con Người” như một danh hiệu; dùng “Ngài/phán” để phù hợp văn phong Kinh Thánh tiếng Việt. Dấu gạch ngang giữ sự ngắt lời: Chúa Giê-su tạm dừng câu nói với người nghe để quay sang truyền lệnh cho người bại liệt.'
