review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch chuyển tải đúng các yếu tố chính: mục đích của ἵνα, thẩm quyền (ἐξουσία), danh hiệu «Con Người», phạm vi «trên đất», việc tha tội, và ba mệnh lệnh dành cho người bị liệt. Tuy nhiên, «các con» áp đặt một quan hệ xưng hô thân thuộc/ở vai trên mà ngôi thứ hai số nhiều Hy Lạp không biểu thị; trong ngữ cảnh trước mắt, lời này hướng đến các thầy thông giáo. «Người bại liệt» cũng có thể bị hiểu hẹp hơn tình trạng paralysis mà παραλυτικός chỉ đến.'
  naturalness: Cần bỏ dấu ngoặc kép đóng lẻ sau «đất», vì câu không có ngoặc kép mở tương ứng trong bản dịch câu đơn. «Rồi Ngài nói» tự nhiên hơn «bấy giờ Ngài phán» trong tiếng Việt hiện đại trang trọng. «Giường của anh» là cách giữ sở hữu ngôi hai mà không gán quan hệ «con» cho người bệnh.
  terminology: Giữ «Con Người», «thẩm quyền», và «tha tội» là chuẩn xác, nhất quán và có sắc thái Kinh Thánh phù hợp. Đổi «người bại liệt» thành «người bị liệt» tránh việc đọc «bại liệt» như một bệnh danh cụ thể; phương án cũ được giữ ở chú thích như lựa chọn từ vựng.
  issues:
  - severity: medium
    issue: Cách xưng hô «các con» và «giường của con»
    rationale: εἰδῆτε và σου chỉ ngôi thứ hai, không quy định quan hệ vai vế hay thân tộc. «Các con/con» thêm sắc thái gia trưởng, không được mã hóa trong nguồn. Trong văn mạch, «các ông» thích hợp với những thầy thông giáo được nhắc đến ngay trước đó; «anh» là trung tính và tự nhiên khi nói với người bị liệt.
  - severity: medium
    issue: Dấu ngoặc kép đóng không có ngoặc mở sau «đất”»
    rationale: Đây là lỗi dấu câu trong văn bản tiếng Việt độc lập. Dấu gạch ngang đủ biểu thị sự ngắt lời và chuyển sang lời kể; không nên đặt ngoặc kép đóng lẻ.
  - severity: low
    issue: «Người bại liệt» có thể chuyên biệt hóa παραλυτικός
    rationale: Từ Hy Lạp chỉ người bị paralysis/liệt, không xác định nguyên nhân hay bệnh danh. «Người bị liệt» giữ nghĩa bao quát hơn trong tiếng Việt hiện đại.
