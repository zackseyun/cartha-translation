revisions:
- from: 'Nhưng để các con biết rằng Con Người có thẩm quyền tha tội trên đất”—bấy giờ Ngài phán với người bại liệt[a]: “Hãy đứng dậy, nhấc giường[b] của con lên và đi về nhà.”'
  to: 'Nhưng để các ông biết rằng Con Người có thẩm quyền tha tội trên đất—rồi Ngài nói với người bị liệt[a]: “Hãy đứng dậy, nhấc giường[b] của anh lên và đi về nhà.”'
  rationale: Bản sửa loại bỏ cách xưng hô không được nguồn văn quy định, chỉnh lỗi ngoặc kép, và dùng lối diễn đạt hiện đại hơn mà vẫn giữ nguyên cấu trúc chuyển cảnh của τότε λέγει. Các thuật ngữ thần học chủ chốt và tính mơ hồ về loại giường/đệm đều được bảo tồn.
