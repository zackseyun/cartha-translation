source:
  edition: SBLGNT
  text: Καὶ παράγοντι ἐκεῖθεν τῷ Ἰησοῦ ἠκολούθησαν ⸀αὐτῷ δύο τυφλοὶ κράζοντες καὶ λέγοντες· Ἐλέησον ἡμᾶς, ⸀υἱὲ Δαυίδ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/027.yaml
  text: And as Jesus was passing on from there[a], two blind men followed him, crying out and saying, “Have mercy on us, Son of David.”
translation:
  language: vi
  text: 'Khi Giê-su đi tiếp từ đó, hai người mù đi theo Người, kêu lớn rằng: “Lạy Con vua Đa-vít[a], xin thương xót chúng tôi!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Con vua Đa-vít” là một tước hiệu vương quyền–Mê-si, chỉ Giê-su là hậu tự được hứa của Đa-vít.
    reason: cross_reference
lexical_decisions:
- source_word: παράγοντι ἐκεῖθεν τῷ Ἰησοῦ
  choice: Khi Giê-su từ đó đi tiếp
  rationale: Phân từ hiện tại diễn tả hành động đang diễn ra đồng thời; cách dịch này giữ được ý Giê-su rời nơi ấy và tiếp tục hành trình.
- source_word: ἠκολούθησαν αὐτῷ
  choice: đi theo người
  rationale: Diễn đạt nghĩa tường thuật thông thường của ἀκολουθέω là đi theo về mặt thể chất; “người” tránh thêm một tước hiệu không có trong nguyên văn.
- source_word: δύο τυφλοὶ
  choice: hai người mù
  rationale: Tính từ giống đực số nhiều được dùng như danh từ; tiếng Việt tự nhiên cần có “người”.
- source_word: κράζοντες καὶ λέγοντες
  choice: lớn tiếng kêu
  rationale: Gộp hai phân từ thành một cách nói tự nhiên trong tiếng Việt, đồng thời giữ được sắc thái khẩn thiết và âm lượng lớn của κράζω.
- source_word: Ἐλέησον ἡμᾶς
  choice: xin thương xót chúng tôi
  rationale: Giữ lời cầu xin trực tiếp về hành động thương xót, không thu hẹp thành cảm xúc thương hại.
- source_word: υἱὲ Δαυίδ
  choice: Lạy Con vua Đa-vít
  rationale: “Con vua Đa-vít” là cách gọi tự nhiên và quen thuộc trong tiếng Việt đối với tước hiệu hoàng gia–Mê-si này; “lạy” đánh dấu lời xưng hô khẩn cầu mà không thêm nội dung giải thích vào câu.
theological_decisions:
- issue: Ý nghĩa Mê-si của tước hiệu υἱὲ Δαυίδ
  choice: Giữ nguyên tước hiệu “Con vua Đa-vít” trong chính văn
  alternative: Diễn giải thành “Đấng Mê-si thuộc dòng Đa-vít”
  rationale: Nguyên văn chỉ dùng tước hiệu truyền thống và không giải thích trực tiếp. Giữ tước hiệu bảo toàn hàm ý hoàng gia–Mê-si và không giải quyết thay cho độc giả điều bản văn để trong mạch tường thuật.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Giê-su” theo lối phiên âm phổ thông; giữ lời cầu xin trực tiếp, khẩn thiết. Dấu chú thích được đặt ngay sau tước hiệu mà chú thích giải nghĩa.
