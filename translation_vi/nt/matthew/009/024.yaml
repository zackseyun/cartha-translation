base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/024.yaml
  text: He was saying[a], “Go away, for the girl has not died, but is sleeping.” And they were laughing at him.
translation:
  language: vi
  text: 'Người nói: “Hãy ra ngoài, vì cô bé không chết, nhưng đang ngủ.” Và họ cười nhạo Người.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Động từ Hy Lạp cũng có thể dịch là “chế giễu Người”; đây là tiếng cười mang ý nhạo báng.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: Người nói
  rationale: Thì chưa hoàn thành có thể gợi lời nói đang diễn ra hoặc được lặp lại, nhưng trong tiếng Việt tự nhiên, “Người nói” phù hợp để dẫn lời trực tiếp mà không thêm ý lặp lại vốn không chắc chắn.
- source_word: Ἀναχωρεῖτε
  choice: Hãy lui ra
  rationale: Mệnh lệnh số nhiều yêu cầu những người đang hiện diện rời chỗ; “hãy lui ra” vừa tự nhiên vừa giữ sắc thái yêu cầu họ tránh sang một bên hoặc đi ra.
- source_word: οὐ γὰρ ἀπέθανεν
  choice: vì cô bé không chết
  rationale: γάρ nêu lý do cho mệnh lệnh, còn động từ aorist ἀπέθανεν trình bày cái chết như một sự kiện. Cách diễn đạt này giữ lời phủ định trực tiếp của Chúa Giê-su mà không đổi thành lời giải thích.
- source_word: τὸ κοράσιον
  choice: cô bé
  rationale: κοράσιον chỉ một bé gái hoặc thiếu nữ trẻ; “cô bé” là cách gọi hiện đại, tự nhiên và phù hợp ngữ cảnh.
- source_word: ἀλλὰ καθεύδει
  choice: nhưng đang ngủ
  rationale: Giữ nguyên sự tương phản và hình ảnh “ngủ” trong nguyên văn, đồng thời dùng “đang” để thể hiện hành động hoặc trạng thái hiện tại.
- source_word: κατεγέλων αὐτοῦ
  choice: họ cười nhạo Người
  rationale: καταγελάω không chỉ là cười mà là cười với ý chế giễu; “cười nhạo” chuyển tải rõ sắc thái ấy. Dạng chưa hoàn thành mô tả phản ứng đang diễn ra, nhưng tiếng Việt không nhất thiết phải đánh dấu bằng một trợ từ riêng.
theological_decisions:
- issue: Lời khẳng định cô bé “không chết, nhưng đang ngủ”
  choice: Giữ nguyên cách nói trực tiếp “không chết, nhưng đang ngủ” mà không giải thích thêm.
  alternative: Thêm “chỉ” hoặc giải thích rằng “ngủ” là ẩn dụ chỉ cái chết.
  rationale: Nguyên văn cố ý đặt hai vế trong thế căng thẳng. Việc không diễn giải ngay trong câu bảo tồn tính khiêu khích và sự mơ hồ thần học của lời nói.
- issue: Cách gọi Chúa Giê-su bằng đại từ
  choice: Dùng “Người” viết hoa.
  alternative: Dùng “ông” hoặc “Ngài”.
  rationale: “Người” là cách gọi trang trọng, dễ hiểu trong văn phong Kinh Thánh tiếng Việt, tránh sắc thái quá suồng sã của “ông” và vẫn không thêm một tước hiệu không có trong câu Hy Lạp.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu trực tiếp ngắn gọn giữ nhịp kể chuyện; không thêm lời giải thích nhằm tháo gỡ sự căng thẳng giữa “không chết” và “đang ngủ”.
