  text: καὶ ἠνεῴχθησαν αὐτῶν οἱ ὀφθαλμοί. καὶ ⸀ἐνεβριμήθη αὐτοῖς ὁ Ἰησοῦς λέγων· Ὁρᾶτε μηδεὶς γινωσκέτω·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/030.yaml
  text: And their eyes were opened[a]. And Jesus sternly warned them, saying[b], “See that no one knows.”
translation:
  language: vi
  text: 'Mắt họ được mở ra. Đức Giê-su nghiêm giọng cảnh cáo họ: “Hãy coi chừng, đừng để ai biết việc này.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “Hãy coi chừng, đừng để ai biết.” Cụm “việc này” được hiểu ngầm từ sự chữa lành vừa xảy ra.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠνεῴχθησαν αὐτῶν οἱ ὀφθαλμοί
  choice: Mắt họ liền được mở ra
  rationale: Giữ thể bị động và hình ảnh trực tiếp của tiếng Hy Lạp; “liền” diễn đạt tự nhiên diễn tiến của động từ aorist trong mạch kể, không nêu thêm tác nhân.
- source_word: ἐνεβριμήθη αὐτοῖς
  choice: nghiêm giọng cảnh cáo họ
  rationale: Động từ ἐμβριμάομαι hàm ý cảm xúc mạnh và lời răn bảo đầy sức nặng; cách dịch này thể hiện cả sắc thái nghiêm khắc lẫn chức năng cảnh cáo trong ngữ cảnh.
- source_word: λέγων
  choice: ':'
  rationale: Dấu hai chấm nối tự nhiên động từ cảnh cáo với nội dung lời nói trong tiếng Việt, không cần dịch máy móc là “rằng” hay “nói”.
- source_word: Ὁρᾶτε
  choice: Hãy coi chừng
  rationale: Mệnh lệnh hiện tại được dùng như lời nhắc phải thận trọng; “hãy coi chừng” giữ được sức cảnh báo và tự nhiên trong tiếng Việt.
- source_word: μηδεὶς γινωσκέτω
  choice: đừng để ai biết việc này
  rationale: Diễn đạt tự nhiên mệnh lệnh ngôi thứ ba phủ định. “Việc này” được bổ sung theo ngữ cảnh, chỉ sự chữa lành vừa xảy ra, nhưng được ghi chú vì nguyên văn không có tân ngữ.
theological_decisions:
- issue: Mức độ mạnh trong mệnh lệnh của Đức Giê-su sau phép chữa lành
  choice: Đức Giê-su đưa ra lời cảnh cáo nghiêm khắc, cấm họ để người khác biết sự việc.
  alternative: Đức Giê-su quở trách họ hoặc truyền lệnh nghiêm ngặt cho họ.
  rationale: Bản văn thể hiện một mệnh lệnh mạnh nhưng không giải thích động cơ. Bản dịch giữ sức nặng của lời cấm mà không thêm lý do thần học.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và dễ hiểu. Dùng “Đức Giê-su” theo lối gọi kính trọng phổ thông; tránh cấu trúc dịch sát cứng như “và khiển trách họ, nói rằng”. Marker [a] xuất hiện ngay sau phần câu có nội dung được chú thích.
