source:
  edition: SBLGNT
  text: τί γάρ ἐστιν εὐκοπώτερον, εἰπεῖν· ⸀Ἀφίενταί σου αἱ ἁμαρτίαι, ἢ εἰπεῖν· ⸀Ἔγειρε καὶ περιπάτει;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/005.yaml
  text: 'For which is easier: to say[a], ‘Your sins are forgiven,’ or to say, ‘Get up and walk’?”'
translation:
  language: vi
  text: 'Vì nói: ‘Tội lỗi của anh được tha[a],’ hay nói: ‘Hãy đứng dậy và bước đi,’ thì điều nào dễ hơn?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Tội lỗi của anh đã được tha.” Thì hiện tại bị động trong tiếng Hy Lạp có thể được hiểu là diễn tả một trạng thái do hành động đã xảy ra tạo nên.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τί γάρ ἐστιν εὐκοπώτερον
  choice: Vì điều nào dễ hơn
  rationale: τί đi với dạng so sánh εὐκοπώτερον đặt hai lời nói cạnh nhau để hỏi điều nào dễ hơn; γάρ được giữ bằng “Vì” nhằm nối câu này với lời giải thích ở câu trước.
- source_word: εἰπεῖν
  choice: nói
  rationale: Động từ nguyên mẫu chỉ hành vi nói thông thường; lặp lại “nói” ở cả hai vế giúp giữ cấu trúc song song của nguyên văn.
- source_word: Ἀφίενταί σου αἱ ἁμαρτίαι
  choice: Tội lỗi của anh được tha
  rationale: Đây là cấu trúc hiện tại bị động, trong đó “tội lỗi” là chủ ngữ. Cách dịch này tự nhiên trong tiếng Việt và giữ được nghĩa trạng thái/kết quả mà không ấn định quá mức thời điểm hành động.
- source_word: ἁμαρτίαι
  choice: tội lỗi
  rationale: Cách gọi chuẩn, rõ ràng trong tiếng Việt cho danh từ số nhiều chỉ các tội; tiếng Việt không nhất thiết phải đánh dấu số nhiều bằng một từ riêng.
- source_word: Ἔγειρε
  choice: Hãy đứng dậy
  rationale: Mệnh lệnh trong bối cảnh chữa lành yêu cầu người bại đứng lên; “hãy đứng dậy” vừa tự nhiên vừa giữ rõ sắc thái mệnh lệnh.
- source_word: καὶ περιπάτει
  choice: và bước đi
  rationale: Diễn đạt hành động đi lại sau khi đứng dậy; “bước đi” tự nhiên, trang trọng vừa phải và không thêm ý “đi loanh quanh” vốn không bắt buộc trong ngữ cảnh.
- source_word: σου
  choice: của anh
  rationale: Đại từ ngôi thứ hai số ít chỉ người bại. “Anh” là cách xưng hô hiện đại, dễ hiểu và phù hợp khi nói trực tiếp với một người đàn ông trưởng thành.
theological_decisions:
- issue: Cách diễn đạt lời tuyên bố tha tội của Chúa Giê-su
  choice: Tội lỗi của anh được tha
  alternative: Tội lỗi của anh đã được tha
  rationale: Thì hiện tại bị động Hy Lạp có thể mô tả trạng thái có hiệu lực, nhưng không buộc phải xác định thời điểm bằng “đã”. Bản chính giữ cách diễn đạt trực tiếp và để nguyên sức căng thần học về thẩm quyền tha tội trong văn cảnh.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, rõ ràng và trang nghiêm vừa phải. Cấu trúc đối xứng “nói… hay nói…” được giữ lại; lời truyền “Hãy đứng dậy và bước đi” dễ hiểu trong ngôn ngữ phổ thông. Dùng “anh” để thể hiện ngôi thứ hai số ít mà không mang sắc thái cổ.
