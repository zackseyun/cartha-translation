  source_fidelity: 'Bản nháp phản ánh đúng cấu trúc và nội dung Hy Lạp: δέ là chuyển ý đối lập, ἔλεγον ở thì chưa hoàn thành được diễn đạt bằng “cứ nói,” ἐν mang nghĩa phương tiện qua “nhờ,” và δαιμόνια được giữ là “quỷ.” Tuy nhiên, “kẻ cai trị các quỷ” tuy sát chữ nhưng không phải cách gọi tự nhiên nhất trong tiếng Việt cho một nhân vật đứng đầu các quỷ.'
