  terminology: Giữ “người Pha-ri-si” và “quỷ” là phù hợp. “Thủ lãnh” diễn đạt ἄρχων mà không áp đặt cách đồng nhất nhân vật này với một tên riêng hay một diễn giải giáo phái.
  issues:
