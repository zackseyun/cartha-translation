source:
  edition: SBLGNT
  text: οἱ δὲ Φαρισαῖοι ἔλεγον· Ἐν τῷ ἄρχοντι τῶν δαιμονίων ἐκβάλλει τὰ δαιμόνια.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/034.yaml
  text: But the Pharisees were saying[a], “By the ruler of the demons he casts out the demons.”
translation:
  language: vi
  text: 'Nhưng những người Pha-ri-si cứ nói: “Ông ấy nhờ thủ lãnh[a] các quỷ mà đuổi quỷ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “kẻ cai trị” hoặc “kẻ đứng đầu”.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Nhưng
  rationale: Diễn tả sự tương phản giữa phản ứng thù nghịch của người Pha-ri-si và phản ứng tích cực của đám đông trong câu trước.
- source_word: οἱ Φαρισαῖοι
  choice: những người Pha-ri-si
  rationale: Cách gọi quen thuộc, rõ nghĩa trong tiếng Việt hiện đại; từ “những người” chuyển tải danh từ số nhiều có mạo từ.
- source_word: ἔλεγον
  choice: cứ nói
  rationale: Thì chưa hoàn thành gợi lời nói đang tiếp diễn hoặc được lặp lại; “cứ nói” giữ được sắc thái ấy trong văn cảnh.
- source_word: Ἐν τῷ ἄρχοντι
  choice: nhờ kẻ cai trị
  rationale: ἐν với cách ba mang nghĩa phương tiện hoặc tác nhân ở đây; “nhờ” diễn đạt tự nhiên lời cáo buộc rằng nguồn quyền năng của Chúa Giê-su đến từ kẻ cai trị các quỷ.
- source_word: ἄρχοντι
  choice: kẻ cai trị
  rationale: Diễn đạt trực tiếp ý nghĩa về người nắm quyền của ἄρχων, không thêm hàm ý quý tộc như một số cách dịch truyền thống.
- source_word: τῶν δαιμονίων
  choice: các quỷ
  rationale: 'Giữ đúng danh từ chỉ các hữu thể ma quỷ và quan hệ sở thuộc: kẻ cai trị các quỷ.'
- source_word: ἐκβάλλει
  choice: đuổi
  rationale: Trong ngữ cảnh trừ quỷ, ἐκβάλλω có nghĩa là đuổi ra; tiếng Việt có thể lược “ra” trong cấu trúc “đuổi quỷ” mà vẫn tự nhiên và đầy đủ nghĩa.
- source_word: τὰ δαιμόνια
  choice: quỷ
  rationale: Dịch chính xác δαιμόνια, không đổi thành thuật ngữ rộng hơn là “tà linh”; danh từ tiếng Việt không cần dấu hiệu số nhiều trong cách nói khái quát này.
theological_decisions:
- issue: Cách dịch δαιμόνια trong ngữ cảnh trừ quỷ
  choice: quỷ
  alternative: tà linh
  rationale: Nguyên văn dùng δαιμόνια chứ không dùng πνεύματα; “quỷ” là từ tương đương trực tiếp hơn và giữ nguyên nội dung siêu nhiên của lời cáo buộc.
- issue: Nguồn quyền năng được hàm ý bởi ἐν τῷ ἄρχοντι
  choice: nhờ kẻ cai trị các quỷ
  alternative: bởi quyền của kẻ cai trị các quỷ
  rationale: Giữ nghĩa phương tiện/tác nhân của giới từ mà không thêm danh từ “quyền” vốn không xuất hiện trong nguyên văn, đồng thời không khẳng định lời cáo buộc của người Pha-ri-si là đúng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Cứ nói” giữ sắc thái tiếp diễn hoặc lặp lại của động từ ở thì chưa hoàn thành; “ông ấy” tự nhiên trong lời người Pha-ri-si nói về Chúa Giê-su mà không thêm sắc thái tôn kính không có trong lời cáo buộc.
