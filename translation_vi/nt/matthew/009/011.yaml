source:
  edition: SBLGNT
  text: καὶ ἰδόντες οἱ Φαρισαῖοι ⸀ἔλεγον τοῖς μαθηταῖς αὐτοῦ· Διὰ τί μετὰ τῶν τελωνῶν καὶ ἁμαρτωλῶν ἐσθίει ὁ διδάσκαλος ὑμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/011.yaml
  text: And when the Pharisees saw it[a], they were saying to his disciples, “Why does your teacher eat with tax collectors and sinners?”
translation:
  language: vi
  text: 'Khi những người Pha-ri-si thấy vậy[a], họ nói với các môn đệ của Giê-su: “Tại sao thầy của các ông lại ăn cùng với những người thu thuế và những người tội lỗi?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc, sát hình thức hơn: “Thấy vậy, những người Pha-ri-si nói với các môn đệ của Giê-su ...” Phân từ Hy Lạp không nêu rõ đối tượng của động từ “thấy”; theo ngữ cảnh, đó là cảnh dùng bữa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδόντες
  choice: Khi ... thấy vậy
  rationale: Phân từ bất định quá khứ được diễn đạt tự nhiên như một mệnh đề thời gian. “Vậy” chỉ cảnh ăn uống trong ngữ cảnh, đồng thời chú thích ghi nhận rằng tiếng Hy Lạp để tân ngữ ở dạng hàm ẩn.
- source_word: οἱ Φαρισαῖοι
  choice: những người Pha-ri-si
  rationale: Dùng tên gọi quen thuộc trong tiếng Việt, có gạch nối theo lối phiên âm phổ biến; thêm “những người” giúp câu tự nhiên và chỉ rõ nhóm người.
- source_word: ἔλεγον
  choice: họ nói
  rationale: Thì chưa hoàn thành mô tả hành động lời nói trong diễn tiến quá khứ. Tiếng Việt không bắt buộc đánh dấu thể tiếp diễn; “họ nói” tự nhiên hơn, còn “đang nói” dễ gợi một hành động bị gián đoạn mà văn bản không nêu.
- source_word: μαθηταῖς
  choice: các môn đồ
  rationale: “Môn đồ” là cách dịch chuẩn, dễ hiểu trong văn cảnh Phúc Âm và giữ được quan hệ thầy–trò.
- source_word: Διὰ τί
  choice: Tại sao
  rationale: Cách hỏi lý do tự nhiên, trực tiếp trong tiếng Việt hiện đại.
- source_word: τελωνῶν
  choice: những người thu thuế
  rationale: Diễn đạt rõ nghề nghiệp bị khinh miệt trong bối cảnh mà không đưa thêm thuật ngữ kỹ thuật như “người thầu thuế”.
- source_word: ἁμαρτωλῶν
  choice: những kẻ tội lỗi
  rationale: Giữ cách gọi mang sắc thái phê phán của người Pha-ri-si. “Kẻ” phản ánh sắc thái xã hội–đạo đức trong lời chất vấn mà không định nghĩa chính xác thành phần của nhóm.
- source_word: ἐσθίει
  choice: ăn chung với
  rationale: μετά kết hợp với động từ “ăn” chỉ việc cùng ăn và giao tiếp đồng bàn. “Ăn chung với” tự nhiên trong tiếng Việt và không thêm mức độ trang trọng.
- source_word: ὁ διδάσκαλος ὑμῶν
  choice: thầy của các anh
  rationale: “Thầy” là từ tiếng Việt tự nhiên cho διδάσκαλος trong quan hệ với môn đồ. “Các anh” phù hợp với lời những người Pha-ri-si nói trực tiếp với một nhóm môn đồ.
theological_decisions:
- issue: Có nên nêu rõ đối tượng của động từ “thấy” hay không
  choice: Dùng “thấy vậy” trong câu chính và giải thích bằng chú thích
  alternative: '“Khi thấy cảnh ấy” hoặc cách sát hình thức hơn: “Khi thấy, những người Pha-ri-si...”'
  rationale: Tiếng Hy Lạp không nêu tân ngữ của ἰδόντες; ngữ cảnh cho thấy đó là cảnh Đức Chúa Jêsus dùng bữa với những người thu thuế và kẻ tội lỗi. “Thấy vậy” tạo câu tiếng Việt tự nhiên mà không xác định quá mức điều được thấy.
- issue: Đại từ sở hữu αὐτοῦ chỉ ai
  choice: Dịch tường minh là “của Đức Chúa Jêsus”
  alternative: “của Ngài” hoặc “của ông ấy”
  rationale: Trong tiếng Việt, “của Ngài” có thể bị đọc như lời tôn kính nằm ngay trong miệng người kể hoặc gây mơ hồ về tiền ngữ. Dùng tên riêng làm rõ sở chỉ mà không thay đổi nội dung.
- issue: Sắc thái của ἁμαρτωλοί trong lời người Pha-ri-si
  choice: Giữ nhãn gọi trực tiếp “những kẻ tội lỗi”
  alternative: “những người bị xem là tội lỗi”
  rationale: Bản Hy Lạp trực tiếp gọi họ là ἁμαρτωλοί; thêm “bị xem là” sẽ diễn giải và có thể làm nhẹ đi sự căng thẳng thần học–xã hội vốn có.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Giữ thuật ngữ Kinh Thánh quen thuộc “Pha-ri-si”, “môn đồ”, đồng thời dùng lời thoại tự nhiên. Dùng “Đức Chúa Jêsus” để xác định rõ tiền ngữ của αὐτοῦ; không áp đặt một cách hiểu hệ phái lên câu.
