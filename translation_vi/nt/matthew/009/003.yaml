  text: καὶ ἰδού τινες τῶν γραμματέων εἶπαν ἐν ἑαυτοῖς· Οὗτος βλασφημεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/003.yaml
  text: And behold[a], some of the scribes said among themselves, “This man is blaspheming.”
translation:
  language: vi
  text: 'Kìa, một số kinh sư tự nhủ[a]: “Người này phạm thượng.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “nói với nhau.” Cách diễn đạt Hy Lạp có thể chỉ lời trao đổi kín hoặc sự suy tính trong lòng.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: '[không dịch riêng]'
  rationale: Liên từ nối tiếp mạch kể; trong tiếng Việt, mở câu trực tiếp bằng “Kìa” tự nhiên hơn và vẫn giữ đầy đủ diễn tiến của trình thuật.
- source_word: ἰδού
  choice: Kìa
  rationale: Giữ chức năng hướng sự chú ý và nét sống động của dấu hiệu diễn ngôn, đồng thời phù hợp với văn phong Kinh Thánh trang trọng mà dễ hiểu.
- source_word: τινες τῶν γραμματέων
  choice: mấy kinh sư
  rationale: Diễn đạt một số người không xác định trong nhóm các γραμματεῖς. “Kinh sư” là cách gọi ngắn gọn, quen thuộc trong bối cảnh Tin Mừng và phản ánh vai trò chuyên môn về Kinh Luật.
- source_word: εἶπαν ἐν ἑαυτοῖς
  choice: nói thầm với nhau
  rationale: Giữ động từ “nói” và sắc thái trao đổi kín đáo trong nhóm số nhiều, nhưng không loại trừ khả năng câu Hy Lạp chỉ sự tự nhủ hay suy tính trong lòng.
- source_word: Οὗτος
  choice: Người này
  rationale: Cách chỉ người tự nhiên trong tiếng Việt, giữ được khoảng cách và sắc thái không thiện cảm của lời cáo buộc mà không cường điệu thành miệt thị.
- source_word: βλασφημεῖ
  choice: đang phạm thượng
  rationale: “Phạm thượng” truyền đạt lời cáo buộc xúc phạm đến Thiên Chúa trong ngữ cảnh này; “đang” thể hiện thể diễn tiến của phát ngôn hiện tại mà các kinh sư vừa nghe.
theological_decisions:
- issue: Lời cáo buộc của các kinh sư đối với Chúa Giê-su
  choice: Người này đang phạm thượng
  alternative: Người này nói lời phạm thượng
  rationale: Bản dịch giữ nguyên sức nặng của lời cáo buộc và căng thẳng thần học trong trình thuật, không thêm lời giải thích nhằm xác nhận hay bác bỏ nhận định của các kinh sư.
- issue: εἶπαν ἐν ἑαυτοῖς là lời trao đổi kín hay suy nghĩ nội tâm
  choice: nói thầm với nhau
  alternative: tự nhủ
  rationale: Cấu trúc số nhiều có thể gợi lời nói riêng trong nhóm hoặc sự suy tính bên trong. Chính văn chọn cách diễn đạt phù hợp với nhóm người, còn chú thích bảo lưu khả năng nội tâm.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. “Kìa” giữ nét hướng sự chú ý của ἰδού; “kinh sư” duy trì thuật ngữ nhất quán trong bối cảnh Tin Mừng; chú thích bảo lưu tính mơ hồ thật sự của ἐν ἑαυτοῖς.
