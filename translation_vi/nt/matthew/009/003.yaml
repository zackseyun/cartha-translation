  - severity: medium
    issue: “nói thầm với nhau” thu hẹp nghĩa của εἶπαν ἐν ἑαυτοῖς
    rationale: Cụm Hy Lạp có thể chỉ tự nhủ/suy nghĩ trong lòng hoặc lời trao đổi riêng. “Nói thầm” khẳng định cách phát ngôn bằng lời và âm lượng, điều bản gốc không nêu. Dùng “tự nhủ” ở chính văn và ghi chú lựa chọn “nói với nhau” bảo lưu sự mơ hồ.
