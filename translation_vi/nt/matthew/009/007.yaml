  text: And he got up and went away to his house[a].
translation:
  language: vi
  text: Người ấy đứng dậy và đi về nhà mình.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: và
  rationale: Liên từ nối hành động này với mạch kể trước đó; “và” giữ lối kể đơn giản mà không thêm sắc thái thời gian.
- source_word: ἐγερθεὶς
  choice: đứng dậy
  rationale: Phân từ aorist thể bị động của ἐγείρω được dùng theo nghĩa nội động trong ngữ cảnh; “đứng dậy” tự nhiên và diễn đạt đúng việc người bại liệt trỗi dậy.
- source_word: ἀπῆλθεν
  choice: đi về
  rationale: Động từ ἀπέρχομαι chỉ việc rời nơi đang ở. Khi đi với đích đến là nhà mình, “đi về” vừa tự nhiên trong tiếng Việt vừa hàm ý rời đi để trở về nhà.
- source_word: εἰς τὸν οἶκον αὐτοῦ
  choice: nhà mình
  rationale: Cụm εἰς với οἶκος chỉ hướng chuyển động đến nơi ở của chính chủ thể. “Nhà mình” là cách nói tự nhiên, rõ quan hệ hồi chỉ của αὐτοῦ.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện ngắn gọn, trang trọng vừa phải và tự nhiên trong tiếng Việt hiện đại. Không thêm chú thích vì phương án “đi về nhà mình” đã chuyển tải gọn cả ý rời đi của ἀπῆλθεν và đích đến của εἰς τὸν οἶκον αὐτοῦ; biến thể tiếng Anh không phản ánh một dị bản hay độ mơ hồ cần bảo lưu.
