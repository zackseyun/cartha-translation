  source_fidelity: 'Bản dịch truyền đạt đầy đủ trình tự và các thành phần chính của câu Hy Lạp: Đức Giê-su vào nhà, những người mù đến với ngài, câu hỏi về việc tin vào khả năng của ngài, và lời đáp khẳng định kèm κύριε. “Hai người mù” được ngữ cảnh liền trước xác định và không làm thay đổi nghĩa. “Hỏi” diễn đạt tự nhiên chức năng của λέγει trong câu hỏi trực tiếp; tiếng Việt không cần đánh dấu thì hiện tại lịch sử bằng hình thái động từ.'
