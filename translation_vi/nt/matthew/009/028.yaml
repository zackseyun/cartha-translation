id: MAT.9.28
reference: Matthew 9:28
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐλθόντι δὲ εἰς τὴν οἰκίαν προσῆλθον αὐτῷ οἱ τυφλοί, καὶ λέγει αὐτοῖς ὁ Ἰησοῦς· Πιστεύετε ὅτι δύναμαι τοῦτο ποιῆσαι; λέγουσιν αὐτῷ· Ναί, κύριε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/028.yaml
  text: When he entered the house[a], the blind men approached him, and Jesus said to them, “Do you believe that I am able to do this?” They said to him, “Yes[b], Lord.”
translation:
  language: vi
  text: 'Khi Đức Giê-su vào trong nhà, hai người mù đến gần ngài. Đức Giê-su hỏi họ: “Các anh có tin rằng tôi có thể làm được điều này không?” Họ thưa: “Vâng, thưa Chúa[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “thưa ngài”. Từ Hy Lạp κύριε có thể là cách xưng hô kính trọng, đồng thời cũng có thể hàm ý nhìn nhận thẩm quyền của Đức Giê-su.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐλθόντι δὲ εἰς τὴν οἰκίαν
  choice: Khi Đức Giê-su vào trong nhà
  rationale: Phân từ bất định ἐλθόντι cùng δέ chuyển sang sự việc kế tiếp theo quan hệ thời gian. Cách dịch này tự nhiên trong tiếng Việt và giữ rõ hướng chuyển động εἰς.
- source_word: προσῆλθον αὐτῷ
  choice: đến gần ngài
  rationale: προσέρχομαι chỉ việc đến với hoặc tiến lại gần một người; “đến gần” phân biệt tự nhiên với động từ “vào” ở mệnh đề trước.
- source_word: οἱ τυφλοί
  choice: hai người mù
  rationale: Tính từ có mạo từ được dùng như danh từ. Ngữ cảnh ngay trước xác định đây là hai người, nên nêu rõ số lượng giúp tiếng Việt tự nhiên mà không thêm thông tin ngoài văn mạch.
- source_word: λέγει αὐτοῖς ὁ Ἰησοῦς
  choice: Đức Giê-su hỏi họ
  rationale: Dù λέγει theo nghĩa đen là “nói”, câu trực tiếp mang hình thức câu hỏi nên “hỏi” là cách diễn đạt tiếng Việt tự nhiên. Thì hiện tại lịch sử được chuyển sang hình thức kể chuyện không đánh dấu thì của tiếng Việt.
- source_word: Πιστεύετε ὅτι δύναμαι τοῦτο ποιῆσαι
  choice: Các anh có tin rằng tôi có thể làm được điều này không?
  rationale: Giữ cấu trúc niềm tin hướng đến khả năng của Đức Giê-su; “có thể làm được” truyền đạt rõ δύναμαι và ποιῆσαι mà không diễn giải điều này thành việc chữa lành ngay trong câu.
- source_word: Ναί
  choice: Vâng
  rationale: Từ đáp khẳng định lịch sự và tự nhiên trong tiếng Việt.
- source_word: κύριε
  choice: thưa Chúa
  rationale: “Chúa” giữ cách dịch mặc định của κύριος và khả năng lời xưng hô nhìn nhận thẩm quyền của Đức Giê-su; “thưa” tạo sắc thái hô cách kính trọng tự nhiên.
theological_decisions:
- issue: Cách dịch κύριε khi trực tiếp xưng hô với Đức Giê-su
  choice: thưa Chúa
  alternative: thưa ngài
  rationale: κύριε có thể chỉ là lời xưng hô kính trọng, nhưng “thưa Chúa” bảo tồn khả năng sâu hơn rằng hai người nhìn nhận thẩm quyền của Đức Giê-su, mà không khẳng định quá mức rằng đây là một lời tuyên xưng Kitô học đầy đủ.
- issue: Thì hiện tại lịch sử λέγει / λέγουσιν
  choice: 'Dùng lối kể tự nhiên không đánh dấu thì trong tiếng Việt: “hỏi” / “thưa”'
  alternative: Dịch sát hình thức bằng “nói” / “nói”
  rationale: Động từ tiếng Việt không biến đổi theo thì như tiếng Hy Lạp. Cách dùng động từ theo chức năng lời thoại giữ tính sinh động của trình thuật mà không tạo sự gượng ép.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Đức Giê-su” trong lời trần thuật, “ngài” làm đại từ chỉ Đức Giê-su, và “các anh” để nói với hai người nam. Tách câu sau mệnh đề đầu nhằm tạo nhịp kể tự nhiên trong tiếng Việt.
