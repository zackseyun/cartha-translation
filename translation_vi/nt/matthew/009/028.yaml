  terminology: “Đức Giê-su” nhất quán; “thưa Chúa” giữ được cách dịch κύριε là “Lord” đồng thời chú thích cách đọc “thưa ngài” một cách thận trọng. Chú thích không áp đặt mức độ nhận thức Kitô học vượt quá điều văn bản cho phép. Neo chú thích [a] đặt đúng tại “Chúa.”
