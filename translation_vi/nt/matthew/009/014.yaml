id: MAT.9.14
reference: Matthew 9:14
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Τότε προσέρχονται αὐτῷ οἱ μαθηταὶ Ἰωάννου λέγοντες· Διὰ τί ἡμεῖς καὶ οἱ Φαρισαῖοι νηστεύομεν ⸀πολλά, οἱ δὲ μαθηταί σου οὐ νηστεύουσιν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/014.yaml
  text: Then John's disciples came to him[a], saying, “Why do we and the Pharisees fast often, but your disciples do not fast?”
translation:
  language: vi
  text: 'Bấy giờ, các môn đồ của Giăng đến gặp Đức Giê-su và hỏi: “Tại sao chúng tôi và người Pha-ri-si thường xuyên kiêng ăn[a], còn môn đồ của thầy lại không kiêng ăn?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “kiêng ăn nhiều” hoặc “kiêng ăn nhiều lần”; từ Hy Lạp πολλά đi với “kiêng ăn” diễn tả một thực hành thường xuyên.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Bấy giờ
  rationale: Dấu nối thời gian mở đầu sự việc kế tiếp; “Bấy giờ” tự nhiên và trang trọng trong văn kể chuyện Kinh Thánh.
- source_word: προσέρχονται αὐτῷ
  choice: đến gặp Đức Giê-su
  rationale: Diễn đạt tự nhiên hành động tiến đến gần người đã được nhắc đến; nêu lại Đức Giê-su giúp câu độc lập rõ nghĩa.
- source_word: οἱ μαθηταὶ Ἰωάννου
  choice: các môn đồ của Giăng
  rationale: Giữ quan hệ sở thuộc của nguyên văn và dùng tên gọi Kinh Thánh quen thuộc trong tiếng Việt.
- source_word: λέγοντες
  choice: và hỏi
  rationale: Phân từ đi với lời nghi vấn; “và hỏi” là cách diễn đạt tiếng Việt tự nhiên, đúng chức năng phát ngôn.
- source_word: Διὰ τί
  choice: Tại sao
  rationale: Tương đương trực tiếp, tự nhiên của cụm từ hỏi nguyên nhân.
- source_word: ἡμεῖς καὶ οἱ Φαρισαῖοι
  choice: chúng tôi và người Pha-ri-si
  rationale: Giữ đại từ số nhiều được nhấn mạnh và nhóm đối chiếu; “chúng tôi” phù hợp khi nói với Đức Giê-su.
- source_word: νηστεύομεν
  choice: kiêng ăn
  rationale: Thuật ngữ tiếng Việt thông dụng chỉ việc nhịn hoặc kiêng thức ăn như một thực hành tôn giáo.
- source_word: πολλά
  choice: thường xuyên
  rationale: πολλά được dùng theo nghĩa trạng từ với νηστεύω, diễn tả thực hành nhiều lần hoặc với tần suất cao.
- source_word: οἱ δὲ μαθηταί σου
  choice: còn môn đồ của thầy
  rationale: “Còn” thể hiện rõ sự tương phản của δέ; “thầy” là cách xưng hô tự nhiên với một giáo sư tôn giáo trong ngữ cảnh.
- source_word: οὐ νηστεύουσιν
  choice: lại không kiêng ăn
  rationale: Thì hiện tại trong thế đối chiếu diễn tả thông lệ; “lại” làm nổi bật sự tương phản mà không thêm lời phán xét.
theological_decisions:
- issue: Bản chất của lời chất vấn về việc kiêng ăn
  choice: Trình bày câu hỏi như sự so sánh giữa các thông lệ kiêng ăn
  alternative: Hiểu là lời buộc tội môn đồ Đức Giê-su vi phạm bổn phận, hoặc chỉ nói về một dịp kiêng ăn riêng biệt
  rationale: Các động từ hiện tại cùng πολλά cho thấy một khuôn mẫu thực hành. Bản dịch giữ nguyên sự chất vấn nhưng không biến nó thành lời kết án thần học hay giới hạn vào một dịp cụ thể.
- issue: Cách xưng hô với Đức Giê-su
  choice: thầy
  alternative: Ngài hoặc ông
  rationale: Đại từ σου chỉ ngôi thứ hai số ít và không tự nó ghi một tước hiệu. “Thầy” phù hợp quan hệ giữa các môn đồ và người dạy đạo, đồng thời không thêm một tuyên xưng thần học vào câu hỏi.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Giữ thuật ngữ “môn đồ” và “kiêng ăn” vì quen thuộc trong ngữ cảnh Kinh Thánh; dùng “người Pha-ri-si” để chỉ tập thể. Dấu chân chú [a] được đặt ngay sau cụm từ mà chú thích giải thích.
