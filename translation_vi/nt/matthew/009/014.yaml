  terminology: “Giăng,” “Đức Giê-su,” “môn đồ,” “Pha-ri-si,” và “kiêng ăn” nhất quán với cách dùng Kinh Thánh tiếng Việt. Cách xưng “thầy” phù hợp với ngữ cảnh lời nói trực tiếp và không thêm khẳng định thần học. Chú thích [a] được neo đúng tại cụm có πολλά và giải thích chính xác các khả năng “nhiều/nhiều lần.”
