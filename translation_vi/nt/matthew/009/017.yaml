id: MAT.9.17
reference: Matthew 9:17
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οὐδὲ βάλλουσιν οἶνον νέον εἰς ἀσκοὺς παλαιούς· εἰ δὲ μή γε, ῥήγνυνται οἱ ἀσκοί, καὶ ὁ οἶνος ἐκχεῖται καὶ οἱ ἀσκοὶ ⸀ἀπόλλυνται· ἀλλὰ βάλλουσιν οἶνον νέον εἰς ἀσκοὺς καινούς, καὶ ἀμφότεροι συντηροῦνται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/017.yaml
  text: Nor do they put new wine into old wineskins. Otherwise[a], the wineskins burst, and the wine is spilled, and the wineskins are ruined. Rather, they put new wine into fresh wineskins, and both are preserved.
translation:
  language: vi
  text: Cũng không ai đổ rượu mới vào những bầu da cũ. Nếu không, bầu da sẽ vỡ, rượu sẽ đổ ra, và bầu da sẽ bị hỏng. Trái lại, người ta đổ rượu mới vào những bầu da còn mới[a], thì cả rượu lẫn bầu da đều được bảo toàn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hy Lạp dùng hai từ khác nhau: rượu là “mới” (νέος), còn bầu da là “mới” về tình trạng (καινός).'
    reason: Giải thích sự phân biệt từ vựng trong nguyên văn mà tiếng Việt khó thể hiện trọn vẹn chỉ bằng một từ.
lexical_decisions:
- source_word: οὐδὲ βάλλουσιν
  choice: Cũng không ai đổ
  rationale: Diễn đạt tự nhiên hành động cho rượu vào vật chứa, đồng thời giữ lực nối tiếp của οὐδέ với ví dụ trước.
- source_word: οἶνον νέον
  choice: rượu mới
  rationale: Cách dịch trực tiếp, thông dụng cho rượu mới làm, duy trì sự tương phản với bầu da cũ.
- source_word: ἀσκοὺς παλαιούς
  choice: những bầu da cũ
  rationale: “Bầu da” chỉ vật chứa bằng da dùng cho rượu trong thời cổ; “cũ” phản ánh trực tiếp παλαιούς.
- source_word: εἰ δὲ μή γε
  choice: Nếu làm vậy
  rationale: Trong ngữ cảnh, thành ngữ điều kiện này nêu hậu quả nếu người ta làm điều vừa bị phủ định; cách diễn đạt tiếng Việt này rõ và tự nhiên.
- source_word: ῥήγνυνται
  choice: sẽ nứt
  rationale: Diễn tả bầu da bị bục hoặc rách do áp lực; “nứt” tự nhiên với bầu da mà không cường điệu.
- source_word: ἐκχεῖται
  choice: đổ ra
  rationale: Cho thấy rượu thoát ra ngoài và bị mất khi bầu da nứt.
- source_word: ἀπόλλυνται
  choice: bị hỏng
  rationale: Trong ngữ cảnh, động từ nói đến bầu da trở nên vô dụng, nên “bị hỏng” chính xác và tự nhiên hơn “bị tiêu diệt”.
- source_word: ἀλλὰ
  choice: Trái lại
  rationale: Giữ rõ nét tương phản và sửa lại cách làm không đúng vừa nêu.
- source_word: ἀσκοὺς καινούς
  choice: những bầu da còn mới
  rationale: “Còn mới” nhấn mạnh tình trạng mới, thích hợp của bầu da và phần nào bảo tồn sự phân biệt giữa καινός ở đây với νέος dùng cho rượu.
- source_word: ἀμφότεροι συντηροῦνται
  choice: cả rượu lẫn bầu da đều được giữ nguyên
  rationale: Nêu rõ hai đối tượng mà ἀμφότεροι quy chiếu đến và giữ thể bị động của συντηροῦνται.
theological_decisions:
- issue: Sự phân biệt giữa νέος và καινός trong cùng câu
  choice: Dịch νέος là “mới” và καινός là “còn mới”
  alternative: Dịch cả hai từ đơn giản là “mới”
  rationale: Bản Hy Lạp dùng hai tính từ khác nhau. “Còn mới” giúp gợi sắc thái mới về tình trạng của bầu da mà không áp đặt một cách giải thích thần học lên hình ảnh.
translation_notes:
  register: Văn phong hiện đại, trang trọng nhưng dễ hiểu. “Bầu da” là cách gọi ngắn gọn, quen thuộc trong ngữ cảnh Kinh Thánh, và các động từ “đổ ra”, “bị hỏng”, “giữ nguyên” làm rõ chuỗi hậu quả mà không thêm diễn giải giáo lý.
