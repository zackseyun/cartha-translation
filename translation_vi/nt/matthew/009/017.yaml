  source_fidelity: Bản dịch truyền đạt đúng hình ảnh, quan hệ tương phản và chuỗi hậu quả của nguyên văn. Tuy nhiên, «Nếu làm vậy» đảo nhẹ hướng của εἰ δὲ μή γε, vốn có nghĩa thành ngữ là «Nếu không/Otherwise» sau lời phủ định; «Nếu không» bám sát cấu trúc lập luận hơn.
  naturalness: Văn phong nhìn chung hiện đại và dễ hiểu. «Bầu da sẽ vỡ» diễn tả ῥήγνυνται tự nhiên, trực tiếp hơn «sẽ nứt» trong ngữ cảnh vật chứa bằng da bị áp lực làm bục. «Được bảo toàn» cũng tự nhiên và sát συντηροῦνται hơn «được giữ nguyên».
  terminology: «Bầu da» là thuật ngữ Kinh Thánh phù hợp cho ἀσκοί. «Rượu mới» và «bầu da còn mới» bảo lưu hợp lý sự phân biệt giữa νέος và καινός mà không gán ý nghĩa thần học. Chú thích đặt đúng neo [a] tại «còn mới».
