  - severity: low
    issue: «sẽ nứt» và «được giữ nguyên»
    rationale: «Vỡ» phản ánh rõ hơn động từ ῥήγνυνται (bục/vỡ), còn «được bảo toàn» phản ánh trực tiếp hơn συντηροῦνται (được gìn giữ/bảo toàn).
