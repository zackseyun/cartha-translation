  verdict: approve
  source_fidelity: 'Bản dịch truyền đạt đầy đủ mạch câu Hy Lạp: Đức Giê-su đang đi khỏi nơi ấy, thấy một người được gọi là Ma-thi-ơ đang ngồi ở nơi thu thuế, gọi ông theo mình, và ông đứng dậy đi theo. “Đang ngồi” phản ánh tốt phân từ hiện tại καθήμενον; “Hãy theo tôi” giữ nguyên mệnh lệnh Ἀκολούθει μοι, không diễn giải thành thuật ngữ môn đồ hóa. Tiếng Việt không buộc biểu thị thì nên “Ngài nói” là cách xử lý thích hợp cho λέγει (hiện tại lịch sử).'
  naturalness: Văn bản tự nhiên, rõ ràng, và có đăng ký Kinh Thánh hiện đại vừa phải. “Trạm thu thuế” diễn đạt dễ hiểu cho τελώνιον; “ông đứng dậy và đi theo Ngài” giữ chuỗi hành động gọn, không thêm ý về mức độ tức thì.
  terminology: “Đức Giê-su,” “Ngài,” và “Ma-thi-ơ” nhất quán với lối gọi trang trọng phổ thông trong tiếng Việt. “Hãy theo tôi” là thuật ngữ phù hợp, vừa giữ nghĩa theo bước cụ thể vừa để hàm ý làm môn đồ được thể hiện bởi ngữ cảnh.
