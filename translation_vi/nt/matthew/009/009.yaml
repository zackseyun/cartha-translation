id: MAT.9.9
reference: Matthew 9:9
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Καὶ παράγων ὁ Ἰησοῦς ἐκεῖθεν εἶδεν ἄνθρωπον καθήμενον ἐπὶ τὸ τελώνιον, Μαθθαῖον λεγόμενον, καὶ λέγει αὐτῷ· Ἀκολούθει μοι· καὶ ἀναστὰς ἠκολούθησεν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/009.yaml
  text: And as Jesus was passing on from there[a], he saw a man called Matthew sitting at the tax booth, and he says to him[c][b], “Follow me.” And he rose and followed him.
translation:
  language: vi
  text: 'Khi Đức Giê-su đi khỏi nơi ấy, Ngài thấy một người tên là Ma-thi-ơ đang ngồi tại trạm thu thuế. Ngài nói với ông: “Hãy theo tôi.” Ông đứng dậy và đi theo Ngài.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παράγων … ἐκεῖθεν
  choice: đi khỏi nơi ấy
  rationale: Diễn đạt tự nhiên hành động Đức Giê-su tiếp tục đi từ địa điểm vừa được nhắc đến, đồng thời giữ ý chuyển động của phân từ hiện tại và trạng từ chỉ nơi chốn.
- source_word: ἄνθρωπον
  choice: một người
  rationale: Cách gọi tự nhiên trong tiếng Việt; nhân vật nam được xác định ngay sau đó bằng tên Ma-thi-ơ và đại từ “ông”.
- source_word: καθήμενον ἐπὶ τὸ τελώνιον
  choice: đang ngồi tại trạm thu thuế
  rationale: “Đang ngồi” thể hiện hành động đang diễn ra; “trạm thu thuế” chỉ nơi thu thuế hoặc thu phí mà không khiến người đọc hình dung một cơ quan hành chính hiện đại.
- source_word: Μαθθαῖον λεγόμενον
  choice: tên là Ma-thi-ơ
  rationale: Diễn đạt trực tiếp và tự nhiên trong tiếng Việt ý người này được gọi bằng tên Ma-thi-ơ.
- source_word: λέγει αὐτῷ
  choice: Ngài nói với ông
  rationale: Tiếng Việt không bắt buộc đánh dấu thì trên động từ, nên “nói” vừa tự nhiên trong lời kể vừa không xóa sắc thái hiện tại lịch sử của tiếng Hy Lạp.
- source_word: Ἀκολούθει μοι
  choice: Hãy theo tôi
  rationale: Giữ nguyên mệnh lệnh trực tiếp và hàm ý làm môn đồ mà không diễn giải thêm ngoài nguyên văn.
- source_word: ἀναστὰς
  choice: Ông đứng dậy
  rationale: Thể hiện hành động đứng lên xảy ra trước và gắn liền với việc đi theo Đức Giê-su.
- source_word: ἠκολούθησεν αὐτῷ
  choice: đi theo Ngài
  rationale: Giữ cả nghĩa hành động cụ thể lẫn hàm ý theo làm môn đồ, không chuyển thành một cách giải thích thần học.
theological_decisions:
- issue: Bản chất lời kêu gọi của Đức Giê-su dành cho Ma-thi-ơ
  choice: Dịch đơn giản là “Hãy theo tôi.”
  alternative: “Hãy đến làm môn đồ của tôi” hoặc “Hãy gia nhập với tôi”
  rationale: Nguyên văn rõ ràng hàm ý lời kêu gọi làm môn đồ, nhưng không dùng thuật ngữ giải thích ấy; bản dịch giữ mệnh lệnh ngắn gọn và để ý nghĩa thần học tự bộc lộ trong ngữ cảnh.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Đức Giê-su” và đại từ “Ngài” theo lối văn Kinh Thánh tiếng Việt phổ thông; dùng “ông” cho Ma-thi-ơ. Không thêm trạng từ như “liền” vì nguyên văn chỉ cho thấy chuỗi hành động chứ không có từ tương ứng minh nhiên.
