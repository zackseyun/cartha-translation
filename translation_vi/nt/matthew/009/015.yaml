id: MAT.9.15
reference: Matthew 9:15
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτοῖς ὁ Ἰησοῦς· Μὴ δύνανται οἱ υἱοὶ τοῦ νυμφῶνος πενθεῖν ἐφ’ ὅσον μετ’ αὐτῶν ἐστιν ὁ νυμφίος; ἐλεύσονται δὲ ἡμέραι ὅταν ἀπαρθῇ ἀπ’ αὐτῶν ὁ νυμφίος, καὶ τότε νηστεύσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/015.yaml
  text: And Jesus said to them[a], “The wedding attendants cannot mourn as long as the bridegroom is with them, can they? But days will come when the bridegroom is taken away from them[b], and then they will fast.”
translation:
  language: vi
  text: 'Đức Giê-su nói với họ: “Những người trong đoàn cưới[a] có thể than khóc khi chàng rể còn ở với họ sao? Nhưng sẽ đến những ngày chàng rể bị đem đi khỏi họ[b]; bấy giờ họ sẽ kiêng ăn.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “các con trai của phòng cưới”, một thành ngữ chỉ những người cùng dự lễ cưới, nhất là những người đồng hành với chàng rể.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “bị cất khỏi họ”. Cách nói ở thể bị động gợi nhiều hơn một cuộc ra đi bình thường.'
    reason: lexical_alternative
lexical_decisions:
- source_word: υἱοὶ τοῦ νυμφῶνος
  choice: những người trong đoàn cưới
  rationale: Đây là một thành ngữ chỉ những người cùng tham dự lễ cưới, đặc biệt là những người đồng hành với chàng rể. Cách dịch này tự nhiên trong tiếng Việt, diễn đạt vai trò xã hội mà không dịch cứng hình ảnh “các con trai của phòng cưới”.
- source_word: πενθεῖν
  choice: than khóc
  rationale: Động từ diễn tả việc đau buồn, than khóc; cách chọn này giữ rõ sự tương phản với niềm vui của lễ cưới và với việc kiêng ăn.
- source_word: ἐφ’ ὅσον
  choice: khi ... còn
  rationale: Cấu trúc này diễn đạt tự nhiên ý nghĩa kéo dài “bao lâu mà” trong tiếng Việt hiện đại.
- source_word: νυμφίος
  choice: chàng rể
  rationale: Giữ nguyên hình ảnh trung tâm của câu và sắc thái biểu tượng của nó mà không diễn giải thêm.
- source_word: ἀπαρθῇ
  choice: bị đem đi khỏi
  rationale: Thể bị động và động từ gợi ý một sự tách khỏi, mạnh hơn việc tự mình rời đi; cách dịch không xác định tác nhân và không giải thích quá mức.
- source_word: νηστεύσουσιν
  choice: họ sẽ kiêng ăn
  rationale: “Kiêng ăn” là cách diễn đạt rõ ràng, trang trọng vừa phải cho hành vi nhịn ăn vì mục đích tôn giáo.
- source_word: Μὴ δύνανται ... ;
  choice: có thể ... sao?
  rationale: Câu hỏi tu từ với μή chờ câu trả lời phủ định. Cấu trúc tiếng Việt này giữ được lực tu từ mà không biến câu thành một lời khẳng định phẳng.
- source_word: ἐλεύσονται δὲ ἡμέραι
  choice: Nhưng sẽ đến những ngày
  rationale: Giữ hình thức diễn đạt tương đối sát nguyên văn và thể hiện sự tương phản nhẹ của δέ.
theological_decisions:
- issue: Ý nghĩa Kitô học tiềm ẩn trong hình ảnh chàng rể
  choice: Giữ “chàng rể” như một hình ảnh ẩn dụ, không nói rõ trong bản văn rằng chàng rể là Đấng Mê-si-a.
  alternative: Diễn giải trực tiếp Đức Giê-su là chàng rể Mê-si-a.
  rationale: Câu văn cho phép người đọc nhận ra sự quy chiếu nhưng không tự trình bày lời giải thích thần học ấy; bản dịch vì vậy giữ nguyên độ hàm súc và căng thẳng thần học của nguyên tác.
- issue: Sắc thái của thể bị động trong ἀπαρθῇ
  choice: Dịch “bị đem đi khỏi họ”, không nêu tác nhân.
  alternative: Dịch như một sự ra đi bình thường hoặc xác định rõ tác nhân gây nên cái chết của Đức Giê-su.
  rationale: Nguyên văn gợi một sự tước khỏi hay cưỡng bức mà không nói ai thực hiện. Cách dịch giữ khả năng ám chỉ cuộc thương khó nhưng không biến sự ám chỉ thành lời giải nghĩa.
translation_notes:
  register: Tiếng Việt hiện đại, tự nhiên và trang trọng vừa phải. “Những người trong đoàn cưới” tránh cách dịch từng chữ khó hiểu, còn “bị đem đi khỏi” giữ sắc thái mạnh và thể bị động của nguyên văn. Các dấu chú thích [a], [b] đều được đặt đúng trong chính văn.
