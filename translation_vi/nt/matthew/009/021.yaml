- from: 'Vì bà vẫn tự nhủ: “Chỉ cần tôi chạm vào áo của Ngài, tôi sẽ được cứu.”[a]'
  to: 'Vì bà cứ tự nhủ: “Chỉ cần tôi chạm vào áo của Ngài, tôi sẽ được cứu[a].”'
  rationale: Thay ‘vẫn tự nhủ’ bằng ‘cứ tự nhủ’ để phản ánh sát hơn sắc thái chưa hoàn thành của ἔλεγεν mà không thêm hàm ý ‘vẫn/còn’. Di chuyển ký hiệu chú thích đến ngay sau ‘cứu’ và chỉnh câu giải thích chú thích cho tự nhiên hơn. Các lựa chọn còn lại được giữ nguyên vì phù hợp nguyên văn và tiếng Việt hiện đại.
