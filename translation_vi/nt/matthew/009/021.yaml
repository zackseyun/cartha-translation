  edition: SBLGNT
  text: ἔλεγεν γὰρ ἐν ἑαυτῇ· Ἐὰν μόνον ἅψωμαι τοῦ ἱματίου αὐτοῦ σωθήσομαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/021.yaml
  text: For she was saying to herself[a], “If only I touch his garment, I will be saved.”
translation:
  language: vi
  text: 'Vì bà cứ tự nhủ: “Chỉ cần tôi chạm vào áo của Ngài, tôi sẽ được cứu[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “tôi sẽ được chữa lành” hoặc “tôi sẽ được khỏe lại.” Tiếng Hy Lạp dùng “tôi sẽ được cứu,” một động từ trong văn cảnh này cũng có thể chỉ sự chữa lành.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: vẫn tự nhủ
  rationale: Thì chưa hoàn thành diễn tả lời nói nội tâm đang tiếp diễn hoặc lặp lại; “vẫn tự nhủ” tự nhiên trong tiếng Việt và giữ được sắc thái ấy.
- source_word: γὰρ
  choice: Vì
  rationale: Liên từ nêu lời giải thích cho diễn tiến trong văn cảnh.
- source_word: ἐν ἑαυτῇ
  choice: tự nhủ
  rationale: Cách diễn đạt tự nhiên cho lời nói trong lòng, đồng thời giữ ý phản thân.
- source_word: Ἐὰν μόνον
  choice: Chỉ cần
  rationale: Diễn đạt một điều kiện tối thiểu được nhấn mạnh, tự nhiên hơn lối dịch sát “nếu chỉ” trong tiếng Việt.
- source_word: ἅψωμαι
  choice: tôi chạm vào
  rationale: Động từ trong mệnh đề điều kiện chỉ hành động chạm, không nhất thiết mang nghĩa nắm giữ.
- source_word: τοῦ ἱματίου αὐτοῦ
  choice: áo của Ngài
  rationale: ἱμάτιον chỉ y phục, thường là áo ngoài; “áo” tự nhiên, không xác định quá mức loại y phục. “Ngài” là đại từ tôn kính thông dụng khi chỉ Chúa Giê-su.
- source_word: σωθήσομαι
  choice: tôi sẽ được cứu
  rationale: Giữ nghĩa rộng của σῴζω và hình thức bị động; trong văn cảnh, động từ cũng có thể chỉ việc được chữa lành hoặc được khỏe lại, nên ghi chú nêu rõ khả năng ấy.
theological_decisions:
- issue: Cách dịch σωθήσομαι trong văn cảnh chữa bệnh
  choice: tôi sẽ được cứu
  alternative: tôi sẽ được chữa lành; tôi sẽ được khỏe lại
  rationale: Văn cảnh trực tiếp nói về sự chữa lành thân thể, nhưng nguyên văn dùng σῴζω, một động từ rộng hơn thuật ngữ y khoa. Bản văn chính giữ “được cứu” để bảo toàn độ rộng từ vựng và âm hưởng thần học mà không áp đặt cách hiểu; chú thích cung cấp nghĩa theo văn cảnh.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Vẫn tự nhủ” giữ sắc thái tiếp diễn của động từ Hy Lạp; “chỉ cần” truyền đạt tự nhiên điều kiện tối thiểu được nhấn mạnh. Dấu chú thích [a] được đặt ngay sau câu trích dẫn mà chú thích giải thích.
