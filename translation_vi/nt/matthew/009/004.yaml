  text: καὶ ⸀εἰδὼς ὁ Ἰησοῦς τὰς ἐνθυμήσεις αὐτῶν εἶπεν· ⸀Ἱνατί ἐνθυμεῖσθε πονηρὰ ἐν ταῖς καρδίαις ὑμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/004.yaml
  text: And Jesus[a], knowing their thoughts, said, “Why are you thinking evil in your hearts?”
translation:
  language: vi
  text: 'Đức Giê-su, biết những suy nghĩ của họ, nói: “Tại sao các ông lại nghĩ điều ác trong lòng mình?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰδὼς
  choice: biết
  rationale: Phân từ diễn tả việc Đức Giê-su nhận biết những suy nghĩ thầm kín của họ; “biết” tự nhiên, trực tiếp và không thêm cách giải thích thần học ngoài câu.
- source_word: ἐνθυμήσεις
  choice: những suy nghĩ
  rationale: Danh từ chỉ những suy nghĩ hoặc cân nhắc diễn ra bên trong; “những suy nghĩ” là cách nói hiện đại, rõ nghĩa.
- source_word: Ἱνατί
  choice: Tại sao
  rationale: Từ nghi vấn hỏi về lý do hay động cơ; “Tại sao” là tương đương tự nhiên trong tiếng Việt.
- source_word: ἐνθυμεῖσθε
  choice: lại nghĩ
  rationale: Động từ hiện tại chỉ hoạt động suy nghĩ đang diễn ra trong nội tâm. Từ “lại” phù hợp với sắc thái chất vấn trong ngữ cảnh, nhưng không làm thay đổi nội dung mệnh đề.
- source_word: πονηρὰ
  choice: điều ác
  rationale: Tính từ trung tính số nhiều được dùng như danh từ, chỉ những điều hoặc ý nghĩ xấu ác; “điều ác” vừa tự nhiên vừa giữ được sức nặng luân lý của nguyên ngữ.
- source_word: καρδίαις
  choice: lòng
  rationale: καρδία chỉ trung tâm nội tâm, bao gồm tư tưởng và ý định. “Lòng” giữ được hình ảnh nguồn và tự nhiên hơn “trái tim” trong câu tiếng Việt này.
theological_decisions:
- issue: Việc Đức Giê-su nhận biết những suy nghĩ không nói ra
  choice: Đức Giê-su biết những suy nghĩ của họ
  alternative: Đức Giê-su nhận ra những suy nghĩ của họ
  rationale: Bản dịch trình bày trực tiếp việc Đức Giê-su biết tư tưởng bên trong của họ nhưng không mở rộng câu thành một khẳng định giáo lý vượt quá nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và dễ hiểu. Dùng “Đức Giê-su” theo cách gọi kính trọng phổ biến; “các ông” phù hợp với lời chất vấn hướng đến nhiều người. Cấu trúc “biết... nên nói” diễn đạt tự nhiên quan hệ giữa phân từ và động từ chính.
