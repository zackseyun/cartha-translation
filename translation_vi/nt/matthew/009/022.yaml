revisions:
- from: 'Nhưng Đức Chúa Jêsus quay lại, thấy bà thì phán: “Hãy vững lòng, con gái[a]; đức tin[b] của con đã cứu con[c].” Và người phụ nữ ấy được chữa lành ngay từ giờ đó.'
  to: 'Nhưng Đức Giê-su quay lại, thấy bà, rồi nói: “Hãy vững lòng, con gái[a]; đức tin[b] của con đã cứu con[c].” Và người phụ nữ ấy được chữa lành từ giờ đó.'
  rationale: Sửa tên riêng/tước hiệu sang dạng tiếng Việt hiện đại chuẩn, dùng động từ lời nói trung tính hơn, và bỏ «ngay» để không thêm sắc thái vượt quá ἀπό. Những lựa chọn then chốt về «đức tin», «đã cứu» và «được chữa lành» được giữ nguyên vì trung thành với phạm vi ngữ nghĩa và diễn tiến của nguyên văn.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T02:44:40Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch phản ánh đầy đủ các yếu tố chính của tiếng Hy Lạp: hai phân từ chỉ hành động quay lại và thấy người phụ nữ, lời khích lệ thân tình, «đức tin», σέσωκέν với nghĩa rộng là «đã cứu», và kết quả chữa lành từ thời điểm ấy. Tuy nhiên, «ngay từ giờ đó» thêm sắc thái tức thì không được biểu thị riêng bởi ἀπό («từ»); ngữ cảnh có thể hàm ý điều này, nhưng bản dịch tối ưu-tương-đương nên không cần thêm «ngay».'
  naturalness: Câu văn nhìn chung rõ và tự nhiên. «Đức Chúa Jêsus» và cách viết «Jêsus» mang dấu ấn truyền thống hệ phái/ấn bản hơn là tiếng Việt tiêu chuẩn hiện đại. Dùng «Đức Giê-su» phù hợp hơn với mục tiêu biến thể tiếng Việt hiện đại chuẩn mà vẫn giữ lối gọi tôn kính. «Nói» là động từ trung tính, hiện đại và đủ để dịch εἶπεν.
  terminology: Giữ «đức tin», «đã cứu con» và «được chữa lành» là thích đáng, bảo toàn độ rộng nghĩa của σῴζω trong lời nói và kết quả thể lý trong lời kể. «Con gái» bảo lưu lối xưng hô θύγατερ mà không thêm diễn giải. Các chú thích cho πίστις và σῴζω được neo đúng chỗ và hữu ích.
  issues:
  - severity: medium
    issue: Tên riêng và tước hiệu mang sắc thái hệ phái/không phải chính tả hiện đại chuẩn
    rationale: «Đức Chúa Jêsus» với «Jêsus» là lối dùng gắn với một truyền thống Tin Lành cụ thể. Để giữ tiếng Việt hiện đại chuẩn và tránh áp đặt cách gọi hệ phái, nên dùng «Đức Giê-su».
  - severity: low
    issue: «ngay từ giờ đó» thêm sắc thái
    rationale: ἀπὸ τῆς ὥρας ἐκείνης có nghĩa «từ giờ/thời điểm đó». «Ngay» có thể suy ra từ diễn tiến câu chuyện, nhưng không cần thiết và làm bản văn cụ thể hơn nguyên ngữ.
  - severity: low
    issue: «phán» là cách dùng cổ/trang trọng hơn mức cần thiết
    rationale: εἶπεν chỉ đơn giản là «nói». «Nói» tự nhiên trong tiếng Việt hiện đại và không làm giảm sắc thái thân tình hay thẩm quyền của lời phát biểu.
