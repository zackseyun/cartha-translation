source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς ⸀στραφεὶς καὶ ἰδὼν αὐτὴν εἶπεν· Θάρσει, θύγατερ· ἡ πίστις σου σέσωκέν σε. καὶ ἐσώθη ἡ γυνὴ ἀπὸ τῆς ὥρας ἐκείνης.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/022.yaml
  text: But Jesus[a], turning and seeing her, said, “Take courage, daughter[d][c][b]; your faith has saved you.” And the woman was healed from that hour.
translation:
  language: vi
  text: 'Nhưng Đức Giê-su quay lại, thấy bà, rồi nói: “Hãy vững lòng, con gái[a]; đức tin[b] của con đã cứu con[c].” Và người phụ nữ ấy được chữa lành từ giờ đó.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Hãy can đảm, con gái.”'
    reason: lexical_alternative
  - marker: b
    text: Từ Hy Lạp cũng có thể được diễn đạt là “lòng tin” trong câu này.
    reason: alternative_reading
  - marker: c
    text: 'Cũng có thể dịch: “đã chữa lành con” hoặc “đã làm cho con khỏe lại.” Động từ Hy Lạp có thể mang nghĩa cứu, chữa lành hoặc làm cho khỏe lại; bản văn chính giữ nghĩa rộng hơn trong lời Đức Giê-su.'
    reason: lexical_alternative
lexical_decisions:
- source_word: στραφεὶς καὶ ἰδὼν αὐτὴν
  choice: quay lại, thấy bà
  rationale: Hai phân từ diễn tả các hành động dẫn đến lời phán. Cách diễn đạt này tự nhiên trong tiếng Việt, giữ thứ tự hành động và không xác định quá mức hướng quay.
- source_word: Θάρσει
  choice: Hãy vững lòng
  rationale: Mệnh lệnh này kêu gọi sự can đảm và tin tưởng. “Hãy vững lòng” là cách nói trang trọng, dễ hiểu và tự nhiên trong ngữ cảnh an ủi.
- source_word: θύγατερ
  choice: con gái
  rationale: Giữ nguyên lối xưng hô thân tình mang sắc thái gia đình, không thêm từ ngữ giải thích như “con gái yêu quý”.
- source_word: πίστις
  choice: đức tin
  rationale: “Đức tin” là cách dịch thông dụng và phù hợp với ngữ cảnh; “lòng tin” cũng có thể diễn đạt sắc thái tin cậy ở đây.
- source_word: σέσωκέν σε
  choice: đã cứu con
  rationale: Động từ σῴζω ở thể hoàn thành có thể chỉ cứu, chữa lành hoặc làm cho khỏe lại. “Đã cứu con” bảo toàn phạm vi nghĩa rộng trong lời Đức Chúa Jêsus.
- source_word: ἐσώθη
  choice: được chữa lành
  rationale: Trong câu kết thuật, ngữ cảnh xác định kết quả cụ thể là sự phục hồi thể chất; cách dịch này làm rõ kết quả mà không thu hẹp nghĩa của cùng động từ trong lời phán trước đó.
- source_word: ἀπὸ τῆς ὥρας ἐκείνης
  choice: ngay từ giờ đó
  rationale: Giữ hình ảnh thời gian “giờ đó” của nguyên văn, đồng thời “ngay” truyền đạt sự có hiệu lực tức thì trong văn cảnh.
- source_word: γυνή
  choice: người phụ nữ ấy
  rationale: Chỉ rõ người phụ nữ đã được nhắc đến trong câu chuyện và tự nhiên trong tiếng Việt hiện đại.
theological_decisions:
- issue: Cách dịch πίστις
  choice: đức tin
  alternative: lòng tin
  rationale: “Đức tin” giữ thuật ngữ thần học quen thuộc, trong khi chú thích bảo lưu sắc thái tin cậy có thể có trong ngữ cảnh.
- issue: Cách dịch hai lần xuất hiện của σῴζω
  choice: “đã cứu con” trong lời phán và “được chữa lành” trong lời kể
  alternative: Dịch cả hai là “đã chữa lành/được chữa lành” hoặc “đã làm cho con khỏe lại/được khỏe lại”
  rationale: Sự khác biệt này bảo tồn độ rộng cứu chữa trong lời Đức Chúa Jêsus, đồng thời diễn đạt rõ kết quả chữa lành thể chất trong phần kết của người kể chuyện, không âm thầm xóa bỏ sức căng ngữ nghĩa.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “phán” cho lời của Đức Chúa Jêsus và “Đức Chúa Jêsus” theo lối gọi Tin Lành Việt ngữ; cấu trúc câu được điều chỉnh tự nhiên nhưng vẫn giữ trình tự và sức căng ngữ nghĩa của nguyên văn.
