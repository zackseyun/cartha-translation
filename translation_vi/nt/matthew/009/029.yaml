  naturalness: “Bấy giờ” và “Đức Giê-su chạm vào mắt họ” tự nhiên trong văn thuật sự trang trọng. Cần đặt chú thích ngay sau từ tương ứng với pistis và dùng một cách diễn đạt tiếng Việt mạch lạc hơn cho mệnh lệnh γενηθήτω.
  terminology: Nên giữ “đức tin” trong thân bài, phù hợp với thuật ngữ chuẩn cho πίστις và với chú thích nêu các lựa chọn “lòng tin” và “sự tin cậy”. “Các anh” phù hợp với hai người đàn ông được ngỏ lời trong ngữ cảnh.
  issues:
