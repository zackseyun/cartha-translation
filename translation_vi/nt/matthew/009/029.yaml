    rationale: Nguyên văn dùng danh từ “đức tin” và một mệnh lệnh cách γίνομαι có tính tuyên bố. Bản sửa giữ “đức tin” và thêm chủ thể tối thiểu “điều đó” để câu tiếng Việt rõ ràng, không thêm nội dung thần học.
  - severity: low
