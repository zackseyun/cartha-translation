source:
  edition: SBLGNT
  text: τότε ἥψατο τῶν ὀφθαλμῶν αὐτῶν λέγων· Κατὰ τὴν πίστιν ὑμῶν γενηθήτω ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/029.yaml
  text: Then he touched their eyes[a], saying, “According to your faith, let it be done for you.”
translation:
  language: vi
  text: 'Bấy giờ, Đức Giê-su chạm vào mắt họ và nói: “Theo đức tin[a] của các anh, điều đó hãy xảy ra cho các anh.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Theo lòng tin của các anh, điều đó hãy xảy ra cho các anh.” Từ Hy Lạp pistis cũng có thể mang nghĩa “sự tin cậy” hoặc, trong một số ngữ cảnh, “sự trung tín”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Bấy giờ
  rationale: Trạng từ chỉ bước tiếp theo trong trình tự câu chuyện; “Bấy giờ” tự nhiên và trang trọng trong văn thuật sự.
- source_word: ἥψατο τῶν ὀφθαλμῶν αὐτῶν
  choice: chạm vào mắt họ
  rationale: ἅπτομαι với sở hữu cách chỉ hành động chạm vào một vật; cách diễn đạt này trực tiếp và tự nhiên trong tiếng Việt.
- source_word: λέγων
  choice: và nói
  rationale: Phân từ hiện tại diễn tả lời nói đi kèm hành động chính; chuyển thành động từ phối hợp giúp câu tiếng Việt lưu loát mà vẫn giữ quan hệ đồng thời.
- source_word: Κατὰ τὴν πίστιν ὑμῶν
  choice: Các anh tin thế nào, thì ... như vậy
  rationale: κατά với đối cách diễn tả sự tương ứng hoặc mức độ. Cấu trúc “thế nào ... như vậy” truyền đạt tự nhiên sự tương ứng với lòng tin, không biến nó thành nguyên nhân hay công trạng.
- source_word: γενηθήτω ὑμῖν
  choice: hãy xảy ra cho các anh
  rationale: γενηθήτω là mệnh lệnh cách thụ động ngôi ba của γίνομαι, mang sắc thái lời tuyên bố có hiệu lực; “hãy xảy ra cho” giữ được lực mệnh lệnh và hướng lợi ích của ὑμῖν.
theological_decisions:
- issue: Cách diễn đạt πίστις trong lời chữa lành
  choice: tin
  alternative: đức tin; lòng tin; tin cậy
  rationale: Trong ngữ cảnh gần, danh từ πίστις nói đến việc hai người mù tin Đức Giê-su có thể chữa lành họ. Dùng động từ “tin” trong cấu trúc tiếng Việt tự nhiên vẫn bảo toàn ý nghĩa ấy, không hàm ý công trạng hay sự trung tín của họ.
- issue: Quan hệ giữa lòng tin và việc chữa lành
  choice: 'diễn tả sự tương ứng: “thế nào ... như vậy”'
  alternative: dựa trên đức tin của các anh
  rationale: κατά có thể chỉ chuẩn mực hoặc mức độ; bản dịch tránh xác quyết một quan hệ nhân quả mạnh hơn điều câu Hy Lạp trực tiếp nói.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Đức Giê-su” để xác định chủ thể vốn được hàm trong đại từ Hy Lạp, đồng thời dùng “các anh” phù hợp với lời nói trực tiếp dành cho hai người đàn ông. Cấu trúc chính ưu tiên sự tự nhiên nhưng giữ nguyên độ mở của κατά và sắc thái mệnh lệnh của γενηθήτω.
