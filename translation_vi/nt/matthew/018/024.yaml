base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/024.yaml
  text: And when he began to settle accounts[a], one debtor who owed ten thousand talents was brought to him.
translation:
  language: vi
  text: Khi vua bắt đầu tính sổ, người ta dẫn đến trước vua một người mắc nợ mười ngàn ta-lâng[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ta-lâng là một đơn vị trọng lượng/tiền tệ cổ có giá trị rất lớn; trong bối cảnh dụ ngôn, “mười ngàn ta-lâng” diễn tả một món nợ lớn đến mức không thể tưởng tượng nổi.
    reason: cultural_note
lexical_decisions:
- source_word: ἀρξαμένου δὲ αὐτοῦ συναίρειν
  choice: Khi vua bắt đầu thanh toán sổ sách
  rationale: Cấu trúc sở hữu cách tuyệt đối nêu hoàn cảnh thời gian; động từ συναίρειν trong ngữ cảnh tài chính chỉ việc kiểm tra và giải quyết các khoản phải thu. Thêm “vua” theo nhân vật đã được nêu ở câu trước giúp tiếng Việt tự nhiên mà không làm đổi quy chiếu.
- source_word: προσηνέχθη αὐτῷ
  choice: người ta dẫn đến trước vua
  rationale: Dạng bị động cho thấy con nợ được những người khác đưa tới. Cách diễn đạt chủ động phiếm chỉ “người ta dẫn” tự nhiên trong tiếng Việt; “đến trước vua” thể hiện rõ tình huống trình diện.
- source_word: εἷς ὀφειλέτης
  choice: một con nợ
  rationale: εἷς giới thiệu một trường hợp cụ thể trong số những người phải thanh toán; “con nợ” là cách gọi phổ thông, trực tiếp trong tiếng Việt hiện đại.
- source_word: μυρίων ταλάντων
  choice: mắc mười ngàn ta-lâng
  rationale: Giữ nghĩa số đếm thông thường của μύριοι và giữ đơn vị lịch sử, không quy đổi sang tiền hiện đại vì giá trị chính xác tùy kim loại và bối cảnh. Động từ “mắc” diễn đạt quan hệ nợ được hàm chứa bởi ὀφειλέτης.
