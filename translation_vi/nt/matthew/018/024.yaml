revisions:
- from: Khi vua bắt đầu thanh toán sổ sách, người ta dẫn đến trước vua một con nợ mắc mười ngàn ta-lâng[a].
  to: Khi vua bắt đầu tính sổ, người ta dẫn đến trước vua một người mắc nợ mười ngàn ta-lâng[a].
  rationale: Thay «thanh toán sổ sách» bằng «tính sổ» để dịch sát chức năng kế toán của συναίρειν và tránh nghĩa chi trả. Điều chỉnh cụm chỉ người mắc nợ cho tự nhiên hơn. Chú thích được làm chính xác hơn về tính chất lịch sử của ta-lâng, đồng thời giữ nguyên ý về khoản nợ cực lớn.
  reviewer_model: gpt-5.6-terra
