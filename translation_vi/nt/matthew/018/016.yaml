revisions:
- from: Nhưng nếu người ấy không chịu nghe, hãy dẫn thêm một hoặc hai người đi cùng anh, để mọi sự việc được xác lập căn cứ vào lời của hai hoặc ba nhân chứng.[a][b]
  to: Nhưng nếu người ấy không chịu nghe, hãy đem theo một hoặc hai người nữa, để mọi sự việc được xác lập căn cứ vào lời của hai hoặc ba nhân chứng.[a][b]
  rationale: Bản sửa thay cách nói “dẫn ... đi cùng anh” bằng “đem theo ... nữa” để diễn đạt chính xác và tự nhiên hơn ý đem những người bổ sung đi cùng mình. Chú thích a được điều chỉnh để cho thấy thành ngữ pháp lý của nguyên văn, trong khi bản chính vẫn giữ cách diễn đạt tiếng Việt hiện đại. Không thay đổi phạm vi của “mọi sự việc” hay ý nghĩa pháp lý của câu.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T05:40:33Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch phản ánh đúng các yếu tố chính của bản Hy Lạp: điều kiện về việc không chịu nghe theo, mệnh lệnh đem thêm một hoặc hai người, mục đích, và công thức pháp lý về hai hoặc ba nhân chứng. “Mọi sự việc” diễn đạt phù hợp πᾶν ῥῆμα trong ngữ cảnh này và không thu hẹp thành một lời cáo buộc.'
  naturalness: Câu nhìn chung tự nhiên và có sắc thái trang trọng phù hợp. Tuy nhiên, “hãy dẫn thêm một hoặc hai người đi cùng anh” có thể gợi ý rằng người nói phải dẫn dắt những người ấy; “hãy đem theo một hoặc hai người nữa” tự nhiên hơn và trực tiếp phản ánh παράλαβε μετὰ σοῦ ἔτι ἕνα ἢ δύο.
  terminology: “Không chịu nghe,” “nhân chứng,” và “được xác lập” đều phù hợp ngữ cảnh sửa lỗi và pháp lý. “Căn cứ vào lời của” là cách chuyển ngữ rõ ràng cho thành ngữ ἐπὶ στόματος; chú thích nên nêu thành ngữ nguyên văn để phân biệt với cách diễn đạt chính.
  issues:
  - severity: low
    issue: Cách diễn đạt “dẫn thêm ... đi cùng anh” hơi gượng và có thể hàm ý dẫn dắt người khác.
    rationale: παράλαβε μετὰ σοῦ có nghĩa là đem/đưa người khác theo cùng mình, không nhấn mạnh hành động dẫn dắt họ.
  - severity: low
    issue: Chú thích a hiện chỉ đưa một cách diễn đạt Việt ngữ gần với bản chính mà chưa làm rõ thành ngữ nguồn.
    rationale: 'Một chú thích nêu “Nguyên văn: ‘trên miệng...’” vừa bảo tồn sắc thái thành ngữ Kinh Thánh vừa giải thích lý do bản chính dùng lối nói pháp lý tự nhiên.'
