language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐὰν δὲ μὴ ἀκούσῃ, παράλαβε μετὰ σοῦ ἔτι ἕνα ἢ δύο, ἵνα ἐπὶ στόματος δύο μαρτύρων ἢ τριῶν σταθῇ πᾶν ῥῆμα·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/016.yaml
  text: But if he does not listen[a], take one or two others with you[b], so that by the mouth of two or three witnesses every matter may be established.
translation:
  language: vi
  text: Nhưng nếu người ấy không chịu nghe, hãy đem theo một hoặc hai người nữa, để mọi sự việc được xác lập căn cứ vào lời của hai hoặc ba nhân chứng.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “trên miệng của hai hoặc ba nhân chứng”; cũng có thể dịch: “dựa trên lời chứng của hai hoặc ba nhân chứng.”'
    reason: lexical_alternative
  - marker: b
    text: Câu này gợi nhắc Phục Truyền Luật Lệ Ký 19:15, nơi một sự việc được xác lập bởi hai hoặc ba nhân chứng.
    reason: cross_reference
lexical_decisions:
- source_word: ἀκούσῃ
  choice: không chịu nghe
  rationale: Trong bối cảnh sửa lỗi, động từ chỉ việc nghe và đáp lại, chứ không chỉ tiếp nhận âm thanh; “không chịu nghe” diễn đạt sự từ chối nghe theo.
- source_word: παράλαβε μετὰ σοῦ
  choice: hãy dẫn ... đi cùng anh
  rationale: Mệnh lệnh aorist yêu cầu người nghe đưa thêm người khác cùng đi; cách diễn đạt này tự nhiên trong tiếng Việt và giữ rõ ý đồng hành.
- source_word: ἔτι ἕνα ἢ δύο
  choice: thêm một hoặc hai người
  rationale: ἔτι mang ý bổ sung; “người” được nêu rõ theo ngữ cảnh mà không xác định họ thuộc một nhóm riêng nào.
- source_word: ἵνα
  choice: để
  rationale: Giữ quan hệ mục đích của mệnh đề Hy Lạp bằng cách diễn đạt tự nhiên, gọn rõ.
- source_word: ἐπὶ στόματος δύο μαρτύρων ἢ τριῶν
  choice: căn cứ vào lời của hai hoặc ba nhân chứng
  rationale: Diễn đạt tự nhiên thành ngữ pháp lý mang sắc thái Hê-bơ-rơ “trên miệng”, đồng thời giữ yếu tố “lời” và vai trò xác nhận của các nhân chứng.
- source_word: σταθῇ
  choice: được xác lập
  rationale: Thể bị động và ngữ cảnh pháp lý cho thấy sự việc được làm cho đứng vững, tức được xác nhận hay xác lập.
- source_word: πᾶν ῥῆμα
  choice: mọi sự việc
  rationale: Trong công thức pháp lý được dẫn lại, cụm này không chỉ một lời nói riêng lẻ mà là mọi vấn đề đang được xem xét; “sự việc” giữ được độ rộng ấy.
theological_decisions:
- issue: Công thức pháp lý Cựu Ước trong bối cảnh sửa lỗi cộng đồng
  choice: 'Giữ cấu trúc hai hoặc ba nhân chứng và dịch công thức theo lối pháp lý rõ ràng: “mọi sự việc được xác lập căn cứ vào lời...”'
  alternative: 'Dịch sát thành ngữ hơn: “mọi lời được đứng vững trên miệng của hai hoặc ba nhân chứng”; hoặc diễn giải hẹp hơn: “mọi lời cáo buộc được xác nhận...”'
  rationale: Bản dịch duy trì sự gợi nhắc Phục Truyền Luật Lệ Ký 19:15 và sức nặng pháp lý của lời chứng, nhưng không thu hẹp πᾶν ῥῆμα thành riêng một lời cáo buộc, cũng không giữ một thành ngữ khó hiểu trong tiếng Việt.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. “Anh” được dùng theo ngôi số ít của văn cảnh; “không chịu nghe” làm rõ ý không nghe theo. Các dấu chú thích được đặt ngay sau công thức về nhân chứng vì cả hai chú thích đều giải thích công thức ấy.
