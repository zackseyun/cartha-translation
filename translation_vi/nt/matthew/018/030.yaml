  text: ὁ δὲ οὐκ ἤθελεν, ἀλλὰ ἀπελθὼν ἔβαλεν αὐτὸν εἰς φυλακὴν ἕως ⸀οὗ ἀποδῷ τὸ ὀφειλόμενον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/030.yaml
  text: But he was not willing[a]; instead[c][b], he went away and threw him into prison until he should pay what was owed.
translation:
  language: vi
  text: Nhưng anh ta không chịu[a]. Trái lại, anh ta đi khỏi đó và tống người kia vào tù[b] cho đến khi người kia trả hết món nợ[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sát nghĩa: “không muốn” hoặc “không sẵn lòng.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “bỏ người kia vào tù”; động từ Hy Lạp mạnh hơn, theo nghĩa đen là “ném/quăng vào tù.”'
    reason: lexical_alternative
  - marker: c
    text: 'Hay: “số tiền còn nợ” hoặc “điều mình mắc nợ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ
  choice: Nhưng anh ta
  rationale: Đại từ chỉ người đầy tớ thứ nhất đã được nhắc đến; “nhưng” giữ sự tương phản do δέ biểu thị.
- source_word: οὐκ ἤθελεν
  choice: không chịu
  rationale: Trong ngữ cảnh lời van xin vừa bị bác bỏ, cách nói này tự nhiên trong tiếng Việt và diễn đạt ý không sẵn lòng, nhưng chú thích vẫn bảo lưu nghĩa sát chữ.
- source_word: ἀλλὰ
  choice: Trái lại
  rationale: Diễn đạt rõ sự tương phản mạnh giữa lời cầu xin và hành động tiếp theo.
- source_word: ἀπελθὼν
  choice: anh ta đi
  rationale: Chuyển phân từ aorist thành động từ hữu hạn để câu tiếng Việt tự nhiên, đồng thời giữ trình tự hành động.
- source_word: ἔβαλεν αὐτὸν εἰς φυλακήν
  choice: tống người kia vào tù
  rationale: “Tống ... vào tù” giữ sắc thái mạnh và khắc nghiệt của βάλλω, tự nhiên hơn cách dịch sát hình ảnh “ném vào tù” trong tiếng Việt.
- source_word: ἕως οὗ
  choice: cho đến khi
  rationale: Giữ đúng giới hạn thời gian của việc giam giữ.
- source_word: ἀποδῷ
  choice: trả hết
  rationale: Động từ ἀποδίδω trong ngữ cảnh món nợ mang nghĩa hoàn trả; “hết” diễn đạt sự hoàn tất được hàm ý bởi thể aorist.
- source_word: τὸ ὀφειλόμενον
  choice: món nợ
  rationale: Danh hóa phân từ chỉ điều đang mắc nợ; “món nợ” ngắn gọn, rõ nghĩa và tự nhiên trong ngữ cảnh.
theological_decisions: []
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “anh ta/người kia” để phân biệt hai nhân vật; “tống ... vào tù” bảo toàn sức nặng của hành động mà không tạo hình ảnh gượng ép.
