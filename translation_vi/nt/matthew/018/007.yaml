id: MAT.18.7
reference: Matthew 18:7
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οὐαὶ τῷ κόσμῳ ἀπὸ τῶν σκανδάλων· ἀνάγκη ⸀γὰρ ἐλθεῖν τὰ σκάνδαλα, πλὴν οὐαὶ τῷ ⸀ἀνθρώπῳ δι’ οὗ τὸ σκάνδαλον ἔρχεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/007.yaml
  text: Woe to the world because of stumbling blocks[a]; for it is necessary that the stumbling blocks come[b], but woe to the man through whom the stumbling block comes.
translation:
  language: vi
  text: Khốn cho thế gian vì những điều gây vấp ngã[a]! Vì những điều gây vấp ngã nhất thiết phải đến; nhưng khốn cho người qua người ấy điều gây vấp ngã đến!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “những cớ phạm tội”, “những điều xúc phạm” hoặc “những cái bẫy”. Từ Hy Lạp σκάνδαλον/σκάνδαλα chỉ điều khiến một người vấp ngã, dù bằng cách gây xúc phạm, cám dỗ hay tạo dịp phạm tội.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐαί
  choice: Khốn cho
  rationale: Giữ sắc thái tuyên cáo cảnh cáo và phán xét, đồng thời lặp lại trong hai vế như nguyên văn.
- source_word: κόσμῳ
  choice: thế gian
  rationale: Chỉ rộng đến thế giới loài người đang chịu tác động của tội lỗi, chứ không chỉ riêng tạo vật vật chất; đây cũng là cách diễn đạt trang trọng và quen thuộc trong tiếng Việt.
- source_word: ἀπὸ
  choice: vì
  rationale: Diễn đạt quan hệ nguyên nhân trong ngữ cảnh này một cách tự nhiên và súc tích.
- source_word: σκάνδαλα / σκάνδαλον
  choice: những điều gây vấp ngã / điều gây vấp ngã
  rationale: 'Giữ hình ảnh vấp ngã và phạm vi nghĩa rộng của từ Hy Lạp: điều xúc phạm, cám dỗ hoặc tạo dịp khiến người ta phạm tội. Số nhiều và số ít được phân biệt như trong nguyên văn.'
- source_word: ἀνάγκη
  choice: nhất thiết phải
  rationale: Giữ nguyên ý nghĩa về sự cần thiết hoặc tất yếu nhưng không xác định căn nguyên của tính tất yếu ấy.
- source_word: γάρ
  choice: Vì
  rationale: Nối vế giải thích với lời tuyên cáo đứng trước, phù hợp quan hệ diễn ngôn của nguyên văn.
- source_word: ἐλθεῖν ... ἔρχεται
  choice: đến ... đến
  rationale: Giữ sự lặp lại của cùng một động từ trong tiếng Hy Lạp, thay vì chuyển cả hai thành cách nói trừu tượng như “xảy ra”.
- source_word: πλήν
  choice: nhưng
  rationale: Thể hiện rõ bước chuyển đối lập từ tính tất yếu của các điều gây vấp ngã sang trách nhiệm của tác nhân.
- source_word: ἀνθρώπῳ
  choice: người
  rationale: Trong ngữ cảnh, danh từ giống đực số ít ἄνθρωπος có lực đại diện, chỉ bất cứ cá nhân nào. Tiếng Việt “người” truyền đạt đúng nghĩa mà không gán giới tính nam vốn không được ngữ cảnh khẳng định.
- source_word: δι’ οὗ
  choice: khiến
  rationale: Diễn đạt tự nhiên vai trò trung gian hoặc tác nhân của cá nhân mà qua đó điều gây vấp ngã đến; tránh cấu trúc dịch sát nhưng gượng gạo “qua người ấy”.
theological_decisions:
- issue: Bản chất của sự cần thiết trong ἀνάγκη γὰρ ἐλθεῖν τὰ σκάνδαλα
  choice: Dịch là “nhất thiết phải đến”, khẳng định sự cần thiết hoặc tất yếu nhưng không nêu nguyên nhân.
  alternative: “chắc chắn sẽ đến” hoặc cách diễn đạt hàm ý đây là sắc lệnh trực tiếp của Đức Chúa Trời
  rationale: Nguyên văn khẳng định tính cần thiết nhưng không giải thích đó là tất yếu về hoàn cảnh, lô-gíc hay sự quan phòng. Bản dịch giữ nguyên sức căng thần học này.
- issue: Lực đại diện của ἀνθρώπῳ
  choice: Dùng “người” trong chính văn và chú thích rằng từ Hy Lạp ở giống đực số ít nhưng lời cảnh cáo áp dụng cho bất cứ cá nhân nào.
  alternative: “người đàn ông” hoặc “bất cứ ai”
  rationale: “Người đàn ông” dễ thu hẹp sai phạm vi chỉ còn nam giới, còn “bất cứ ai” làm mất hình thức số ít cụ thể. “Người” vừa tự nhiên trong tiếng Việt vừa giữ được lực đại diện của nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Khốn cho” giữ âm hưởng tuyên cáo mạnh; “điều gây vấp ngã” bảo tồn ẩn dụ của nguyên văn mà vẫn đủ rõ đối với độc giả phổ thông. Dấu chấm than đánh dấu hai lời cảnh cáo song song.
