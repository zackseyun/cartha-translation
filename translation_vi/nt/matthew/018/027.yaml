id: MAT.18.27
reference: Matthew 18:27
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: σπλαγχνισθεὶς δὲ ὁ κύριος τοῦ δούλου ἐκείνου ἀπέλυσεν αὐτόν, καὶ τὸ δάνειον ἀφῆκεν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/027.yaml
  text: Then the master of that servant[a], moved with compassion[b], released him and forgave him the debt.
translation:
  language: vi
  text: Bấy giờ, người chủ của nô lệ ấy động lòng thương xót, thả anh ta ra và tha món nợ[a] cho anh ta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tiếng Hy Lạp dùng danh từ chỉ cụ thể một khoản cho vay, tức điều đã được cho vay.
    reason: lexical_alternative
lexical_decisions:
- source_word: σπλαγχνισθεὶς
  choice: động lòng thương xót
  rationale: Diễn đạt tự nhiên sức nặng cảm xúc của động từ Hy Lạp, chỉ lòng thương xót sâu xa thúc đẩy hành động.
- source_word: δὲ
  choice: Bấy giờ
  rationale: Trong mạch kể chuyện, δέ đánh dấu bước diễn tiến tiếp theo; “Bấy giờ” tự nhiên hơn cách dịch máy móc là “và” hoặc “nhưng”.
- source_word: ὁ κύριος τοῦ δούλου ἐκείνου
  choice: người chủ của nô lệ ấy
  rationale: κύριος ở đây chỉ người chủ trong dụ ngôn, không trực tiếp là danh xưng thần linh; δοῦλος được dịch là “nô lệ” để giữ rõ địa vị lệ thuộc trong bối cảnh.
- source_word: ἀπέλυσεν αὐτόν
  choice: thả anh ta ra
  rationale: ἀπολύω ở đây có nghĩa cho đi hoặc phóng thích khỏi tình trạng đang bị giữ để đòi nợ; cách diễn đạt này rõ ràng và tự nhiên trong tiếng Việt.
- source_word: τὸ δάνειον
  choice: món nợ
  rationale: δάνειον cụ thể là khoản cho vay, nhưng trong ngữ cảnh nghĩa vụ được tha, “món nợ” là cách nói tiếng Việt tự nhiên; sắc thái cụ thể được ghi ở chú thích.
- source_word: ἀφῆκεν αὐτῷ
  choice: tha ... cho anh ta
  rationale: ἀφίημι có thể chỉ tha, miễn hoặc xóa bỏ nghĩa vụ. “Tha món nợ” vừa tự nhiên trong tiếng Việt vừa giữ được sự cộng hưởng với chủ đề tha thứ trong Ma-thi-ơ.
theological_decisions:
- issue: Có thể hiểu κύριος như một danh xưng chỉ Đức Chúa Trời
  choice: người chủ
  alternative: Chúa
  rationale: Đối tượng trực tiếp trong câu chuyện là người chủ của nô lệ. Dịch “người chủ” tránh áp đặt sự đồng nhất trực tiếp với Đức Chúa Trời, đồng thời vẫn để nguyên ý nghĩa biểu trưng rộng hơn của dụ ngôn.
- issue: Mức độ cụ thể về địa vị của δοῦλος
  choice: nô lệ
  alternative: đầy tớ
  rationale: Quan hệ sở hữu và quyền lực bất cân xứng có ý nghĩa trong dụ ngôn về nợ nần, nên “nô lệ” phản ánh cụ thể hơn danh từ Hy Lạp.
- issue: Sự cộng hưởng giữa việc xóa nợ và sự tha thứ
  choice: tha món nợ
  alternative: xóa món nợ
  rationale: “Tha” phù hợp với nghĩa miễn nghĩa vụ tài chính trong ngữ cảnh và không loại bỏ sự cộng hưởng có chủ ý với ngôn ngữ tha thứ, nhưng vẫn nói rõ đối tượng là món nợ.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Người chủ” tránh lối đọc sai thành danh xưng thần linh; “nô lệ” giữ thực tại xã hội của dụ ngôn. Đại từ “anh ta” giúp câu tự nhiên mà không làm thay đổi quan hệ giữa các nhân vật.
