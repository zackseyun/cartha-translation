  text: Ngài gọi một em nhỏ đến với mình, rồi đặt em đứng giữa họ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: gọi ... đến
  rationale: Diễn đạt tự nhiên phân từ aorist trung động, cho thấy Đức Giê-su gọi em nhỏ đến với mình trước hành động tiếp theo.
- source_word: παιδίον
  choice: một em nhỏ
  rationale: Giữ nghĩa chỉ một trẻ nhỏ, với cách gọi tự nhiên và trang trọng vừa phải trong tiếng Việt hiện đại.
- source_word: ἔστησεν
  choice: đặt em đứng
  rationale: 'Bảo toàn sắc thái ngoại động của ἵστημι: Ngài khiến hoặc đặt em vào tư thế đứng, thay vì chỉ nói chung là “đặt”.'
- source_word: ἐν μέσῳ αὐτῶν
  choice: giữa họ
  rationale: Phản ánh trực tiếp vị trí ở giữa nhóm người đang hiện diện mà không bổ sung đối tượng không có trong câu.
