id: MAT.18.32
reference: Matthew 18:32
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: τότε προσκαλεσάμενος αὐτὸν ὁ κύριος αὐτοῦ λέγει αὐτῷ· Δοῦλε πονηρέ, πᾶσαν τὴν ὀφειλὴν ἐκείνην ἀφῆκά σοι, ἐπεὶ παρεκάλεσάς με·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/032.yaml
  text: Then his master summoned him and said to him[a], ‘Wicked servant[b], I forgave you all that debt because you pleaded with me.’
translation:
  language: vi
  text: 'Bấy giờ, người chủ gọi anh ta đến và nói với anh ta: “Nô lệ[a] độc ác kia! Ta đã tha cho ngươi toàn bộ món nợ ấy[b], vì ngươi đã van xin ta.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “đầy tớ”. Từ Hy Lạp δοῦλος có thể chỉ đầy tớ hoặc nô lệ; “nô lệ” ở đây làm rõ mối quan hệ lệ thuộc vào người chủ trong dụ ngôn.
    reason: lexical_alternative
  - marker: b
    text: Hay “xóa toàn bộ món nợ ấy cho ngươi”. Động từ Hy Lạp có thể chỉ việc tha thứ cũng như miễn hoặc xóa một món nợ.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Bấy giờ
  rationale: Dùng một từ nối thời gian tự nhiên trong văn kể chuyện, đánh dấu hành động tiếp theo trong trình tự dụ ngôn.
- source_word: προσκαλεσάμενος
  choice: gọi hắn đến
  rationale: Diễn đạt đúng ý gọi một người đến với mình, đồng thời tự nhiên hơn trong tiếng Việt hiện đại so với cách nói quá hành chính như “triệu đến”.
- source_word: ὁ κύριος αὐτοῦ
  choice: người chủ
  rationale: Trong bối cảnh dụ ngôn, κύριος chỉ người chủ của nô lệ, không phải một tước hiệu thần thánh.
- source_word: λέγει αὐτῷ
  choice: nói
  rationale: Hiện tại lịch sử trong tiếng Hy Lạp được chuyển sang lối kể quá khứ tự nhiên của tiếng Việt; đối tượng đã rõ qua cụm “gọi hắn đến” nên không cần lặp “nói với hắn”.
- source_word: Δοῦλε πονηρέ
  choice: Nô lệ độc ác kia
  rationale: “Nô lệ” thể hiện địa vị lệ thuộc pháp lý-xã hội nổi bật trong dụ ngôn; “độc ác” truyền đạt lời kết án về phẩm chất đạo đức. “Kia” tạo lời gọi trực tiếp tự nhiên trong tiếng Việt mà không làm nhẹ sức nặng của câu.
- source_word: πᾶσαν τὴν ὀφειλὴν ἐκείνην
  choice: toàn bộ món nợ ấy
  rationale: Giữ đầy đủ ý của πᾶσαν và ἐκείνην bằng một cách diễn đạt rõ ràng, tự nhiên.
- source_word: ἀφῆκά σοι
  choice: Ta đã tha cho ngươi
  rationale: “Tha” giữ được sự chồng lấn có chủ ý giữa việc miễn/xóa nợ trong hình ảnh tài chính và sự tha thứ trong ý nghĩa đạo đức-thần học.
- source_word: ἐπεὶ
  choice: vì
  rationale: Nêu trực tiếp lý do cho hành động của người chủ.
- source_word: παρεκάλεσάς με
  choice: ngươi đã van xin ta
  rationale: “Van xin” thể hiện lời khẩn cầu tha thiết phù hợp với hoàn cảnh con nợ cầu xin chủ.
theological_decisions:
- issue: Cách dịch δοῦλος trong quan hệ chủ–nô lệ của dụ ngôn
  choice: nô lệ
  alternative: đầy tớ
  rationale: Quan hệ sở hữu và lệ thuộc của nhân vật đối với người chủ là yếu tố quan trọng trong dụ ngôn. “Nô lệ” minh bạch hơn về địa vị ấy, còn chú thích ghi nhận cách dịch mềm hơn là “đầy tớ”.
- issue: Cách dịch ἀφίημι trong ngữ cảnh món nợ
  choice: tha cho ngươi
  alternative: xóa món nợ cho ngươi
  rationale: Ngữ cảnh trực tiếp nói về việc miễn nợ, nhưng động từ này cũng mang âm hưởng tha thứ xuyên suốt phân đoạn. “Tha” bảo tồn sự giao thoa đó thay vì thu hẹp câu vào nghĩa thương mại.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Cặp đại từ “ta–ngươi” phản ánh rõ quan hệ quyền lực bất đối xứng trong lời người chủ mà vẫn phù hợp với văn phong dụ ngôn. Dùng “hắn” trong lời trần thuật để tránh nhầm nhân vật và giữ khoảng cách kể chuyện.
