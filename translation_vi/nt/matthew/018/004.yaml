  text: ὅστις οὖν ταπεινώσει ἑαυτὸν ὡς τὸ παιδίον τοῦτο, οὗτός ἐστιν ὁ μείζων ἐν τῇ βασιλείᾳ τῶν οὐρανῶν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/004.yaml
  text: Therefore, whoever humbles himself like this child, he is the greatest in the kingdom of heaven.
translation:
  language: vi
  text: Vậy, ai tự hạ mình như đứa trẻ này thì người ấy là người lớn nhất trong vương quốc thiên đàng.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ταπεινώσει ἑαυτόν
  choice: hạ mình xuống
  rationale: Diễn đạt tự nhiên hành động chủ động tự hạ mình, đồng thời giữ sắc thái tương lai trong một mệnh đề khái quát theo điều kiện.
- source_word: τὸ παιδίον τοῦτο
  choice: đứa trẻ này
  rationale: Phản ánh trực tiếp danh từ chỉ trẻ nhỏ cùng đại từ chỉ định; cách nói tự nhiên trong tiếng Việt hiện đại.
- source_word: ὁ μείζων
  choice: người lớn nhất
  rationale: Giữ dạng so sánh dùng với nghĩa cao nhất trong ngữ cảnh, chỉ địa vị lớn lao hơn hết chứ không phải tuổi tác hay kích thước.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: vương quốc thiên đàng
  rationale: Giữ hình ảnh βασιλεία là vương quốc/quyền trị vì và công thức đặc trưng của Ma-thi-ơ, tránh diễn giải thành một hệ phái cụ thể.
theological_decisions:
- issue: Mối liên hệ giữa sự hạ mình và địa vị lớn nhất
  choice: 'Giữ nguyên phát biểu trực tiếp: ai hạ mình như đứa trẻ này thì người ấy là người lớn nhất.'
  alternative: Diễn giải rằng người ấy sẽ được kể là lớn nhất hoặc sẽ trở nên lớn nhất.
  rationale: Bản Hy Lạp dùng οὗτός ἐστιν, ‘người ấy là’, nên không thêm ý về sự tuyên nhận hay một quá trình trở thành.
- issue: Nghĩa của ‘như đứa trẻ này’
  choice: Không giải thích cụ thể đặc tính nào của đứa trẻ được nhấn mạnh ngoài việc hạ mình.
  alternative: Thêm các ý như ngây thơ, tin cậy, lệ thuộc hoặc địa vị thấp.
  rationale: Câu nguồn không xác định riêng các phẩm chất ấy; bản dịch giữ sự căng thẳng và phạm vi diễn giải của văn cảnh.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cấu trúc đề ngữ ‘ai..., người ấy...’ tái hiện sự nhấn mạnh của ὅστις... οὗτος và giữ đại từ hồi chỉ rõ ràng.
