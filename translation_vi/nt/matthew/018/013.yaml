id: MAT.18.13
reference: Matthew 18:13
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἐὰν γένηται εὑρεῖν αὐτό, ἀμὴν λέγω ὑμῖν ὅτι χαίρει ἐπ’ αὐτῷ μᾶλλον ἢ ἐπὶ τοῖς ἐνενήκοντα ἐννέα τοῖς μὴ πεπλανημένοις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/013.yaml
  text: And if he happens to find it[a], truly I tell you[b], he rejoices over it more than over the ninety-nine that have not gone astray.
translation:
  language: vi
  text: Và nếu ông tìm được nó, quả thật, tôi nói với anh em, ông vui mừng về nó hơn là về chín mươi chín con không đi lạc.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “chín mươi chín con không bị lạc.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Và
  rationale: Giữ liên từ đơn giản để nối tiếp tự nhiên với diễn tiến của dụ ngôn.
- source_word: ἐὰν γένηται εὑρεῖν αὐτό
  choice: nếu ông tìm được nó
  rationale: Cách nói này diễn đạt tự nhiên điều kiện mang tính khả hữu trong tiếng Việt; sắc thái sự việc có thể xảy ra của γένηται được hàm chứa trong cấu trúc “nếu... được”.
- source_word: ἀμὴν λέγω ὑμῖν
  choice: tôi thật nói với anh em
  rationale: Giữ tính trang trọng và nhấn mạnh của công thức ἀμὴν, đồng thời dùng lời văn hiện đại, dễ hiểu.
- source_word: χαίρει ἐπ’ αὐτῷ
  choice: ông vui mừng vì nó
  rationale: “Vui mừng” giữ được cường độ tình cảm của χαίρει; “vì nó” diễn đạt tự nhiên đối tượng/lý do của niềm vui.
- source_word: μᾶλλον ἢ
  choice: hơn vì
  rationale: Giữ nguyên phép so sánh thực sự trong tiếng Hy Lạp, không chuyển thành một sự loại trừ.
- source_word: τοῖς ἐνενήκοντα ἐννέα
  choice: chín mươi chín con
  rationale: Thêm loại từ “con” theo ngữ cảnh đàn chiên để câu tiếng Việt tự nhiên, nhưng không cần lặp lại danh từ “chiên” vốn được tỉnh lược trong nguyên văn.
- source_word: τοῖς μὴ πεπλανημένοις
  choice: không đi lạc
  rationale: Diễn đạt rõ hình ảnh những con chiên không rời khỏi đường đúng; chú thích bảo lưu khả năng hiểu sắc thái kết quả của phân từ hoàn thành.
theological_decisions:
- issue: Ý nghĩa của phép so sánh niềm vui của người chăn
  choice: Người chăn vui mừng vì con được tìm thấy hơn vì chín mươi chín con không đi lạc.
  alternative: Làm nhẹ phép so sánh để tránh hàm ý thiên vị, hoặc hiểu rằng chín mươi chín con kém giá trị hơn.
  rationale: μᾶλλον ἢ nêu một phép so sánh trực tiếp. Bản dịch giữ nguyên sức căng của lời nói mà không suy diễn rằng người chăn không quan tâm đến chín mươi chín con hoặc coi chúng kém giá trị.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Đại từ “ông” chỉ người chăn trong dụ ngôn; “anh em” là cách xưng hô số nhiều tự nhiên trong lời Đức Giê-su. Dấu chú thích [a] được đặt ngay sau cụm từ liên quan.
