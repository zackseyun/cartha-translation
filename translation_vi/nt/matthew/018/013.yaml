- from: 'Và nếu ông tìm được nó, tôi thật nói với anh em: ông vui mừng vì nó hơn vì chín mươi chín con không đi lạc.[a]'
  to: Và nếu ông tìm được nó, quả thật, tôi nói với anh em, ông vui mừng về nó hơn là về chín mươi chín con không đi lạc.[a]
  rationale: Bản sửa giữ nguyên tính điều kiện của ἐὰν γένηται εὑρεῖν αὐτό và phép so sánh trực tiếp μᾶλλον ἢ, nhưng dùng trật tự từ và giới từ tự nhiên hơn trong tiếng Việt. Không thêm hàm ý rằng người chăn không quan tâm đến chín mươi chín con, cũng không giải quyết theo giáo phái sắc thái bị động của πεπλανημένοις.
  reviewer_model: gpt-5.6-terra
