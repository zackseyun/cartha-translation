review_pass:
  verdict: revise
  source_fidelity: Bản nháp truyền đạt đúng điều kiện, lời xác quyết trang trọng, niềm vui của người chăn, và phép so sánh với chín mươi chín con. Tuy nhiên, “hơn vì” không diễn đạt tự nhiên quan hệ so sánh của ἐπ’ αὐτῷ ... ἢ ἐπὶ τοῖς..., và công thức “tôi thật nói với anh em” chưa phải trật tự hiện đại tự nhiên của ἀμὴν λέγω ὑμῖν.
  naturalness: Nên dùng “Quả thật, tôi nói với anh em” và lặp giới từ “về” trong hai vế so sánh. “Nó” vẫn có thể dùng cho con chiên đã được nêu trong ngữ cảnh trước đó; “chín mươi chín con” làm rõ cách đếm động vật trong tiếng Việt mà không cần lặp danh từ “chiên”.
  terminology: Giữ “đi lạc” phù hợp hình ảnh chiên lạc và không áp đặt cách giải thích thần học. Chú thích đổi sang một phương án phản ánh dạng bị động của πεπλανημένοις mà không khẳng định tác nhân khiến chúng lạc.
  issues:
  - severity: medium
    issue: Cụm “ông vui mừng vì nó hơn vì chín mươi chín con” thiếu tự nhiên và mơ hồ về quan hệ so sánh.
    rationale: Hy Lạp dùng ἐπὶ ... μᾶλλον ἢ ἐπὶ ..., tức niềm vui “về” một đối tượng nhiều hơn “về” đối tượng kia. “Vui mừng về nó hơn là về...” tái hiện cấu trúc này rõ và tự nhiên.
  - severity: low
    issue: “Tôi thật nói với anh em” là trật tự từ gượng trong văn Việt hiện đại.
    rationale: “Quả thật, tôi nói với anh em” là công thức trang trọng, rõ ràng và tự nhiên hơn, đồng thời bảo toàn lực nhấn của ἀμήν.
  revised_text: Và nếu ông tìm được nó, quả thật, tôi nói với anh em, ông vui mừng về nó hơn là về chín mươi chín con không đi lạc.[a]
