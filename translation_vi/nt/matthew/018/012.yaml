id: MAT.18.12
reference: Matthew 18:12
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: τί ὑμῖν δοκεῖ; ἐὰν γένηταί τινι ἀνθρώπῳ ἑκατὸν πρόβατα καὶ πλανηθῇ ἓν ἐξ αὐτῶν, οὐχὶ ⸀ἀφήσει τὰ ἐνενήκοντα ἐννέα ἐπὶ τὰ ὄρη ⸀καὶ πορευθεὶς ζητεῖ τὸ πλανώμενον;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/012.yaml
  text: What do you think? If a man has a hundred sheep[a], and one of them goes astray[c][b], will he not leave the ninety-nine on the mountains and go and seek the one going astray?
translation:
  language: vi
  text: Anh em nghĩ sao? Nếu một người có một trăm con chiên, và một con trong số đó đi lạc[a], chẳng phải người ấy sẽ để chín mươi chín con kia trên các ngọn núi[b], rồi đi tìm con đang đi lạc[c] sao?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “lang thang” hoặc, trong một số văn cảnh, “bị dẫn lạc.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “trên các ngọn đồi.”'
    reason: lexical_alternative
  - marker: c
    text: 'Nguyên văn: “con đang đi lạc”; theo cách dịch truyền thống: “con bị mất.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: τί ὑμῖν δοκεῖ
  choice: Anh em nghĩ sao?
  rationale: Cách hỏi tự nhiên trong tiếng Việt, giữ lời chất vấn trực tiếp với đại từ số nhiều ὑμῖν.
- source_word: ἐὰν γένηταί τινι ἀνθρώπῳ
  choice: Nếu một người có
  rationale: Diễn đạt tự nhiên thành ngữ chỉ sự sở hữu; “một người” phù hợp với cách dùng đại diện của ἀνθρώπῳ mà không thêm sắc thái không có trong câu.
- source_word: ἑκατὸν πρόβατα
  choice: một trăm con chiên
  rationale: “Con chiên” là cách gọi tự nhiên, trang trọng và quen thuộc trong văn cảnh Kinh Thánh.
- source_word: πλανηθῇ ἓν ἐξ αὐτῶν
  choice: một con trong số đó đi lạc
  rationale: “Đi lạc” giữ được nét nghĩa của thể bị động πλανάω trong văn cảnh đàn chiên mà không xác định quá mức rằng con chiên tự lang thang hay bị dẫn lạc.
- source_word: οὐχὶ ἀφήσει
  choice: chẳng phải người ấy sẽ để ... sao?
  rationale: Giữ thì tương lai và cấu trúc câu hỏi mong đợi câu trả lời khẳng định; “để” phù hợp hơn “bỏ rơi,” vốn hàm ý mạnh hơn.
- source_word: τὰ ἐνενήκοντα ἐννέα
  choice: chín mươi chín con kia
  rationale: Diễn đạt rõ số chiên còn lại, đồng thời tránh lặp danh từ không cần thiết.
- source_word: ἐπὶ τὰ ὄρη
  choice: trên các ngọn núi
  rationale: Giữ hình ảnh địa hình cụ thể và số nhiều của ὄρη; “đồi” vẫn là một khả năng theo văn cảnh.
- source_word: καὶ πορευθεὶς ζητεῖ
  choice: rồi đi tìm
  rationale: Chuyển phân từ cùng động từ chính thành chuỗi hành động tự nhiên trong tiếng Việt; “tìm” truyền đạt đúng ζητεῖ trong văn cảnh.
- source_word: τὸ πλανώμενον
  choice: con đang đi lạc
  rationale: Giữ thể hiện tại của phân từ và lặp lại cùng gốc nghĩa với πλανηθῇ, thay vì đổi thành “con bị mất.”
theological_decisions:
- issue: Sắc thái của πλανάω trong ẩn dụ đàn chiên
  choice: đi lạc / con đang đi lạc
  alternative: lang thang; bị dẫn lạc; con bị mất
  rationale: Cách dịch này giữ cả hình ảnh mục vụ lẫn khả năng liên tưởng đạo đức, nhưng không áp đặt nguyên nhân, mức độ lỗi hay tác nhân dẫn lạc.
- issue: Cách diễn đạt ἀνθρώπῳ giống đực số ít
  choice: một người
  alternative: một người đàn ông
  rationale: Tiếng Việt không đánh dấu giống ngữ pháp ở “người.” Thêm “đàn ông” sẽ nhấn mạnh giới tính hơn mức cần thiết, trong khi “một người” vẫn giữ số ít và chức năng đại diện của nguyên ngữ.
- issue: τὸ πλανώμενον so với cách dịch truyền thống “con bị mất”
  choice: con đang đi lạc
  alternative: con bị mất
  rationale: Nguyên ngữ dùng πλανάω chứ không dùng ἀπόλλυμι; vì vậy bản dịch duy trì ý đang lạc mà không âm thầm chuyển sang phạm trù “bị mất.”
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Anh em” thể hiện lời nói trực tiếp với nhóm người nghe số nhiều; cấu trúc “chẳng phải ... sao?” bảo toàn lực của câu hỏi tu từ mong đợi câu trả lời khẳng định.
