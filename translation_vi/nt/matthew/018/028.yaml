id: MAT.18.28
reference: Matthew 18:28
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐξελθὼν δὲ ὁ δοῦλος ἐκεῖνος εὗρεν ἕνα τῶν συνδούλων αὐτοῦ ὃς ὤφειλεν αὐτῷ ἑκατὸν δηνάρια, καὶ κρατήσας αὐτὸν ἔπνιγεν λέγων· ⸀Ἀπόδος εἴ τι ὀφείλεις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/028.yaml
  text: But when that servant went out[a], he found one of his fellow servants who owed him a hundred denarii, and seizing him, he began choking him, saying[b], ‘Pay back whatever you owe.’
translation:
  language: vi
  text: 'Nhưng khi người nô lệ ấy đi ra, anh ta gặp một người nô lệ cùng với anh ta, người đang nợ anh ta một trăm đơ-na-ri[a]. Rồi anh ta túm lấy và bóp cổ người ấy, nói: “Hãy trả những gì anh nợ!”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Một đơ-na-ri thường tương đương tiền công một ngày của một người lao động hoặc một binh sĩ.
    reason: cultural_note
  - marker: b
    text: 'Dịch sát hơn: “Nếu anh nợ gì thì hãy trả.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: δοῦλος
  choice: người nô lệ
  rationale: “Nô lệ” phản ánh địa vị lệ thuộc và quyền cưỡng chế nổi bật trong dụ ngôn, thay vì làm nhẹ nghĩa thành “đầy tớ”.
- source_word: ἐξελθὼν δὲ
  choice: Nhưng khi ... đi ra
  rationale: Diễn đạt tự nhiên quan hệ thời gian của phân từ aorist và giữ sắc thái chuyển ý của δέ.
- source_word: συνδούλων
  choice: người cùng làm nô lệ với mình
  rationale: Giữ ý nghĩa “cùng-” của σύν- và nhất quán với cách dịch δοῦλος, đồng thời tự nhiên hơn “đồng nô lệ” trong tiếng Việt phổ thông.
- source_word: ὤφειλεν
  choice: nợ
  rationale: Diễn đạt trực tiếp và tự nhiên khoản nợ tài chính.
- source_word: ἑκατὸν δηνάρια
  choice: một trăm đơ-na-ri
  rationale: Giữ đơn vị tiền tệ lịch sử để bảo toàn sự tương phản về quy mô khoản nợ trong dụ ngôn; chú thích giải thích giá trị tương đối.
- source_word: κρατήσας
  choice: túm lấy
  rationale: Thể hiện hành động nắm giữ bằng vũ lực trong văn cảnh.
- source_word: ἔπνιγεν
  choice: bóp cổ
  rationale: Diễn tả hành động bạo lực đang diễn tiến của thể imperfect; cấu trúc nối tiếp trong tiếng Việt cho thấy hành động xảy ra khi người ấy nói.
- source_word: Ἀπόδος
  choice: Hãy trả hết
  rationale: Là mệnh lệnh dứt khoát đòi hoàn trả trong bối cảnh nợ nần.
- source_word: εἴ τι ὀφείλεις
  choice: những gì anh nợ
  rationale: Cách nói tự nhiên trong tiếng Việt, giữ tính không xác định của τι; cách dịch sát cấu trúc điều kiện được nêu trong chú thích.
theological_decisions:
- issue: Cách dịch δοῦλος trong dụ ngôn
  choice: người nô lệ / người cùng làm nô lệ
  alternative: đầy tớ / bạn cùng phục vụ
  rationale: Bối cảnh nhấn mạnh tình trạng lệ thuộc dưới quyền chủ và việc một người dùng bạo lực để đòi nợ người cùng địa vị; “nô lệ” phản ánh rõ thực tại xã hội ấy mà không áp đặt cách hiểu giáo phái.
- issue: Sắc thái của εἴ τι ὀφείλεις
  choice: Hãy trả hết những gì anh nợ!
  alternative: Nếu anh nợ gì thì hãy trả!
  rationale: Bản chính dùng câu đòi nợ tự nhiên nhưng vẫn giữ tính không xác định; chú thích bảo tồn cấu trúc điều kiện và sự mơ hồ chân thực của nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “anh ta” để theo dõi chủ thể rõ ràng; lời đòi nợ ngắn, gắt, phù hợp cảnh cưỡng ép. Các dấu chú thích được đặt ngay sau nội dung mà chúng giải thích.
