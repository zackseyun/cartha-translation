  to: Nếu mắt con khiến con sa ngã[a], hãy móc nó ra và ném nó đi khỏi con. Thà con chỉ còn một mắt mà vào sự sống còn hơn có hai mắt mà bị ném vào Ghê-hen-na của lửa[b].
  rationale: Các sửa đổi chỉ loại bỏ những sắc thái được thêm vào (“xa”, “đủ”), làm rõ μονόφθαλμον là tình trạng chỉ có một mắt, và diễn đạt tự nhiên hơn quan hệ “của lửa” trong γέενναν τοῦ πυρός. Không thay đổi ý nghĩa, mức độ mạnh của mệnh lệnh, hay độ mở cánh chung của nguyên văn.
