id: MAT.18.9
reference: Matthew 18:9
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ εἰ ὁ ὀφθαλμός σου σκανδαλίζει σε, ἔξελε αὐτὸν καὶ βάλε ἀπὸ σοῦ· καλόν σοί ἐστιν μονόφθαλμον εἰς τὴν ζωὴν εἰσελθεῖν, ἢ δύο ὀφθαλμοὺς ἔχοντα βληθῆναι εἰς τὴν γέενναν τοῦ πυρός.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/009.yaml
  text: And if your eye causes you to stumble[a], tear it out and throw it away from you. It is better for you to enter into life with one eye than, having two eyes[b], to be thrown into the Gehenna of fire.
translation:
  language: vi
  text: Nếu mắt con khiến con sa ngã[a], hãy móc nó ra và ném nó đi khỏi con. Thà con chỉ còn một mắt mà vào sự sống còn hơn có hai mắt mà bị ném vào Ghê-hen-na của lửa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “khiến con phạm tội”. Động từ Hy Lạp có thể chỉ việc khiến ai vấp ngã, sa ngã hoặc phạm tội.
    reason: lexical_alternative
  - marker: b
    text: “Ghê-hen-na” chỉ nơi phán xét cuối cùng; theo truyền thống thường được dịch là “địa ngục”.
    reason: alternative_reading
lexical_decisions:
- source_word: σκανδαλίζει
  choice: khiến con sa ngã
  rationale: Giữ hình ảnh vấp ngã của động từ Hy Lạp, đồng thời trong ngữ cảnh có thể hàm ý khiến phạm tội; chú thích bảo lưu nghĩa thay thế.
- source_word: ἔξελε
  choice: móc nó ra
  rationale: Mệnh lệnh mạnh và hình ảnh quyết liệt; “móc ra” tự nhiên trong tiếng Việt khi nói về mắt và không làm nhẹ sắc thái.
- source_word: βάλε ἀπὸ σοῦ
  choice: ném xa khỏi con
  rationale: Diễn tả hành động dứt khoát loại bỏ và tạo khoảng cách khỏi chính mình.
- source_word: καλόν σοί ἐστιν
  choice: Thà ... còn hơn
  rationale: Cấu trúc so sánh tiếng Việt truyền đạt tự nhiên ý điều thứ nhất tốt hơn điều thứ hai.
- source_word: μονόφθαλμον
  choice: chột mắt
  rationale: Cách diễn đạt gọn, tự nhiên và rõ nghĩa trong tiếng Việt hiện đại, chỉ tình trạng chỉ còn một mắt.
- source_word: εἰς τὴν ζωὴν
  choice: vào sự sống
  rationale: Không thêm “đời đời” vì nguyên văn chỉ nói “sự sống”, qua đó giữ nguyên độ mở cánh chung của câu.
- source_word: βληθῆναι
  choice: bị ném
  rationale: Giữ thể bị động và động tác mạnh, rõ của động từ Hy Lạp.
- source_word: γέενναν
  choice: Ghê-hen-na
  rationale: Phiên âm thuật ngữ riêng γέεννα thay vì đồng nhất ngay với khái niệm rộng hơn là “địa ngục”; chú thích giải nghĩa.
- source_word: τοῦ πυρός
  choice: lửa
  rationale: Cụm “Ghê-hen-na lửa” giữ quan hệ trực tiếp với danh từ “lửa” và có sắc thái trang trọng, cô đọng trong tiếng Việt.
theological_decisions:
- issue: Cách dịch γέεννα
  choice: Ghê-hen-na
  alternative: địa ngục
  rationale: Giữ thuật ngữ cụ thể của nguyên văn cùng các liên hệ lịch sử và cánh chung Do Thái, thay vì nhập ngay các liên tưởng thần học rộng hơn của “địa ngục”.
- issue: Cách dịch εἰς τὴν ζωὴν
  choice: vào sự sống
  alternative: vào sự sống đời đời
  rationale: Dù ngữ cảnh có ý nghĩa cánh chung, nguyên văn không có tính từ “đời đời”; bản dịch không thêm điều nguyên văn chưa nói rõ.
- issue: Tính chất của mệnh lệnh về mắt
  choice: Giữ nguyên hình ảnh quyết liệt, không chú giải ngay trong câu là nghĩa bóng hay nghĩa đen
  alternative: Diễn giải thành việc loại bỏ nguyên nhân phạm tội
  rationale: Nguyên văn dùng mệnh lệnh cụ thể và mạnh. Bản dịch bảo tồn sức căng tu từ, không tự quyết định cách áp dụng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và trực tiếp. Dùng đại từ “con” phù hợp lời Chúa Giê-su nói với môn đồ trong mạch văn. Cấu trúc “Thà... còn hơn...” giúp câu so sánh tự nhiên; các thuật ngữ “sự sống” và “Ghê-hen-na” bảo lưu sắc thái của nguyên văn.
