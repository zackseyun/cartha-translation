review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch nhìn chung bám sát nguyên văn: giữ được hình ảnh σκανδαλίζω, mệnh lệnh mạnh ἔξελε, thể bị động của βληθῆναι, và không thêm “đời đời” vào “sự sống”. Tuy nhiên, “ném xa khỏi con” thêm ý khoảng cách (“xa”) không có trong ἀπὸ σοῦ; “có đủ hai mắt” thêm sắc thái “đủ”; và “chột mắt” có thể gợi một mắt bị hỏng hơn là tình trạng “một mắt” của μονόφθαλμον.'
  naturalness: Cấu trúc “Thà ... còn hơn ...” tự nhiên và phù hợp văn phong Kinh Thánh tiếng Việt hiện đại. “Chỉ còn một mắt” rõ ràng, trung tính hơn “chột mắt”. “Ghê-hen-na của lửa” hơi trang trọng nhưng diễn đạt minh bạch hơn “Ghê-hen-na lửa” và bảo toàn quan hệ sở hữu/genitive của nguyên văn.
  terminology: Nên giữ “Ghê-hen-na” thay vì đồng nhất với “địa ngục”; chú thích hiện có giải thích thích đáng. “Sự sống” bảo toàn cách nói không xác định thêm của εἰς τὴν ζωὴν. Chú thích a và b đúng vị trí và nội dung phù hợp.
  issues:
  - severity: low
    issue: “ném xa khỏi con” thêm ý “xa”.
    rationale: βάλε ἀπὸ σοῦ đòi hỏi loại bỏ khỏi mình, nhưng không nêu rõ khoảng cách. “Ném nó đi khỏi con” giữ sắc thái dứt khoát mà không thêm chi tiết.
  - severity: low
    issue: “có đủ hai mắt” thêm sắc thái không có trong nguyên văn.
    rationale: δύο ὀφθαλμοὺς ἔχοντα chỉ nói “có hai mắt”. Cần tránh hàm ý về sự nguyên vẹn ngoài văn bản.
  - severity: medium
    issue: “chột mắt” có thể thu hẹp hoặc lệch hình ảnh “một mắt”.
    rationale: μονόφθαλμον nghĩa là “một mắt/one-eyed”. “Chột mắt” trong cách dùng hiện đại thường gợi tình trạng một mắt bị mù hoặc hỏng; “chỉ còn một mắt” truyền đạt rõ hơn hậu quả của hình ảnh nguyên văn.
  - severity: low
    issue: “Ghê-hen-na lửa” thiếu tự nhiên và quan hệ với “lửa” chưa rõ.
    rationale: Cụm τοῦ πυρός là “của lửa”. “Ghê-hen-na của lửa” giữ cấu trúc và rõ nghĩa hơn trong tiếng Việt.
