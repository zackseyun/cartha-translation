source:
  edition: SBLGNT
  text: πεσὼν οὖν ὁ σύνδουλος ⸀αὐτοῦ παρεκάλει αὐτὸν λέγων· Μακροθύμησον ἐπ’ ⸀ἐμοί, καὶ ἀποδώσω σοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/029.yaml
  text: So his fellow servant fell down and pleaded with him[a], saying, ‘Be patient with me, and I will repay you.’
translation:
  language: vi
  text: 'Liền một người nô lệ cùng chủ với ông ta sấp mình xuống, nài xin ông ta rằng: “Xin hãy kiên nhẫn với tôi, tôi sẽ trả lại cho ông.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σύνδουλος
  choice: người bạn cùng làm nô lệ
  rationale: Từ ghép chỉ một người cùng thân phận nô lệ và cùng có một chủ. Cách diễn đạt này giữ rõ địa vị lệ thuộc trong bối cảnh dụ ngôn, đồng thời tự nhiên hơn một từ ghép gượng ép trong tiếng Việt.
- source_word: παρεκάλει
  choice: van xin
  rationale: Trong hoàn cảnh người mắc nợ khẩn thiết cầu được khoan dung, “van xin” truyền đạt đúng sắc thái tha thiết của động từ và thể chưa hoàn thành.
- source_word: Μακροθύμησον ἐπ’ ἐμοί
  choice: Xin hãy kiên nhẫn với tôi
  rationale: Đây là lời xin người kia nhẫn nại, khoan đòi nợ; cách dịch giữ nghĩa của thành ngữ Hy Lạp và tự nhiên trong tiếng Việt hiện đại.
- source_word: ἀποδώσω
  choice: tôi sẽ trả lại
  rationale: Trong ngữ cảnh món nợ, động từ có nghĩa hoàn trả điều đang mắc; “trả lại” rõ ràng, tự nhiên và không thêm đối tượng vốn không được nêu trong câu Hy Lạp.
- source_word: πεσὼν
  choice: sấp mình xuống
  rationale: Diễn tả hành động hạ mình xuống trong tư thế khẩn cầu, giữ được cả yếu tố thể chất lẫn sắc thái phục supplication của nguyên văn.
- source_word: οὖν
  choice: Vậy
  rationale: Giữ mối nối suy diễn và diễn tiến với câu trước mà vẫn phù hợp văn phong kể chuyện trang trọng, dễ hiểu.
theological_decisions:
- issue: Cách dịch ngôn ngữ δοῦλος trong σύνδουλος
  choice: người bạn cùng làm nô lệ
  alternative: người bạn cùng phục vụ
  rationale: Bối cảnh có vua, chủ, nợ và những người ở dưới quyền, nên thân phận nô lệ là nét có ý nghĩa và cần được giữ. “Bạn cùng phục vụ” tự nhiên hơn nhưng làm nhẹ đi quan hệ lệ thuộc được từ Hy Lạp biểu thị.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Giữ lời cầu xin trực tiếp và quan hệ xã hội của dụ ngôn; không thêm chủ ngữ hay tân ngữ giải thích ngoài nguyên văn.
