id: MAT.18.17
reference: Matthew 18:17
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐὰν δὲ παρακούσῃ αὐτῶν, εἰπὸν τῇ ἐκκλησίᾳ· ἐὰν δὲ καὶ τῆς ἐκκλησίας παρακούσῃ, ἔστω σοι ὥσπερ ὁ ἐθνικὸς καὶ ὁ τελώνης.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/017.yaml
  text: But if he refuses to listen to them[a], tell it to the assembly. And if he also refuses to listen to the assembly, let him be to you like the Gentile and the tax collector.
translation:
  language: vi
  text: Nhưng nếu người ấy không chịu nghe họ, hãy trình sự việc với hội chúng.[a] Nếu người ấy cũng không chịu nghe hội chúng, thì hãy coi người ấy như người ngoại và người thu thuế.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch là “Hội thánh” hoặc “cộng đoàn” (tiếng Hy Lạp: ekklēsia).'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρακούσῃ
  choice: không chịu nghe
  rationale: Trong bối cảnh sửa dạy, động từ này diễn tả việc không chịu lắng nghe hoặc làm theo, chứ không chỉ đơn thuần là không nghe thấy.
- source_word: εἰπὸν
  choice: hãy trình sự việc
  rationale: Mệnh lệnh này nói đến bước đưa vụ việc ra trước cộng đồng; cách dịch giữ đối tượng được hàm ý từ văn cảnh mà không thêm chi tiết.
- source_word: ἐκκλησίᾳ / ἐκκλησίας
  choice: hội chúng
  rationale: Từ Hy Lạp chỉ cộng đồng được tập hợp; “hội chúng” tự nhiên trong tiếng Việt và tránh áp đặt một cơ cấu giáo phái hoặc thể chế về sau.
- source_word: ἔστω σοι
  choice: đối với anh em, hãy coi người ấy
  rationale: Cách diễn đạt tự nhiên trong tiếng Việt, giữ sắc thái mệnh lệnh và đại từ số ít σοι; “anh em” ở đây chỉ một người nhưng không xác định giới tính.
- source_word: ὥσπερ
  choice: như
  rationale: Giữ nguyên phép so sánh trực tiếp của bản Hy Lạp.
- source_word: ὁ ἐθνικὸς
  choice: người ngoại
  rationale: Trong ngữ cảnh Do Thái, từ này chỉ người thuộc các dân ngoài cộng đồng giao ước; “người ngoại” giữ được ý niệm ấy mà không thêm sắc thái miệt thị như một số cách gọi khác.
- source_word: ὁ τελώνης
  choice: người thu thuế
  rationale: Đây là cách gọi rõ ràng, hiện đại cho người làm nghề thu thuế; danh từ được dùng theo nghĩa đại diện cho một hạng người.
theological_decisions:
- issue: Cách dịch ἐκκλησία trong lời dạy về sửa dạy cộng đồng
  choice: hội chúng
  alternative: Hội thánh; cộng đoàn
  rationale: “Hội chúng” phản ánh cộng đồng tụ họp mà không mặc nhiên đưa vào câu một mô hình tổ chức giáo hội về sau; chú thích giữ lại cách dịch truyền thống “Hội thánh” và phương án “cộng đoàn”.
- issue: Ý nghĩa của việc coi người không chịu nghe như người ngoài
  choice: giữ nguyên phép so sánh “như người ngoại và người thu thuế”
  alternative: coi người ấy là người ngoài cộng đồng; khai trừ người ấy
  rationale: Bản dịch không biến phép so sánh thành một công thức kỷ luật chi tiết hay một giáo lý khai trừ hoàn chỉnh mà câu Hy Lạp không nói rõ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “người ấy” để tránh xác định giới tính không cần thiết; dùng “anh em” cho đại từ số ít σοι theo lối xưng hô Kinh Thánh tự nhiên trong tiếng Việt. Dấu chú thích [a] được đặt ngay sau lần xuất hiện đầu tiên của “hội chúng”.
