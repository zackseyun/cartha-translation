  verdict: revise
  source_fidelity: Bản dịch phản ánh tốt trình tự mệnh lệnh của câu, sắc thái cố ý của παρακούσῃ qua “không chịu nghe,” và phép so sánh của ὥσπερ. “Hãy trình sự việc với hội chúng” truyền đạt tự nhiên εἰπὸν τῇ ἐκκλησίᾳ. Tuy nhiên, “đối với anh em” thường được hiểu là ngôi thứ hai số nhiều trong tiếng Việt hiện đại, trong khi σοι là số ít; nên tránh diễn đạt này mà vẫn giữ được mệnh lệnh bằng “hãy coi người ấy như...”.
  naturalness: Văn phong trang trọng, rõ ràng và hiện đại. “Hội chúng,” “người ngoại,” và “người thu thuế” đều dễ hiểu trong ngữ cảnh. Việc bỏ “đối với anh em” cũng làm câu gọn, tự nhiên hơn mà không buộc phải chọn một đại từ ngôi hai có giới tính hoặc quan hệ xã hội cụ thể.
  terminology: “Hội chúng” là lựa chọn thích hợp cho ἐκκλησία, giữ nghĩa cộng đồng hội họp mà không áp đặt mô hình thể chế; chú thích nêu “Hội thánh” và “cộng đoàn” là hữu ích. “Người ngoại” phù hợp với ὁ ἐθνικός trong bối cảnh Do Thái, và “người thu thuế” dịch chính xác τελώνης. Không nên diễn giải phép so sánh thành thuật ngữ khai trừ.
