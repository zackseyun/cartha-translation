id: MAT.18.6
reference: Matthew 18:6
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ὃς δ’ ἂν σκανδαλίσῃ ἕνα τῶν μικρῶν τούτων τῶν πιστευόντων εἰς ἐμέ, συμφέρει αὐτῷ ἵνα κρεμασθῇ μύλος ὀνικὸς ⸀εἰς τὸν τράχηλον αὐτοῦ καὶ καταποντισθῇ ἐν τῷ πελάγει τῆς θαλάσσης.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/006.yaml
  text: But whoever causes one of these little ones who believe in me to stumble[c][b][a], it is better for him that a donkey millstone be hung around his neck and that he be drowned in the open sea.
translation:
  language: vi
  text: Nhưng ai làm cho một trong những người bé mọn này, những người tin Ta, sa ngã[a], thì thà một tảng đá cối xay lớn, loại được lừa quay[b], được treo quanh cổ người ấy, rồi người ấy bị dìm xuống giữa biển khơi[c] còn hơn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “làm cho ... vấp ngã,” “phạm tội,” hoặc “làm cho ... từ bỏ đức tin.” Động từ Hy Lạp có thể chỉ việc làm cho một người vấp ngã, phạm tội, hoặc lìa bỏ đức tin.'
    reason: lexical_alternative
  - marker: b
    text: Nguyên văn là “đá cối xay của lừa,” tức loại đá cối xay lớn thuộc một cối xay được lừa quay.
    reason: cultural_note
  - marker: c
    text: 'Cũng có thể dịch: “ngoài khơi.” Từ Hy Lạp chỉ vùng biển rộng, tức biển khơi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σκανδαλίσῃ
  choice: làm cho ... sa ngã
  rationale: Giữ hình ảnh vấp ngã của động từ Hy Lạp, đồng thời đủ rộng để bao hàm việc khiến người khác phạm tội, lìa bỏ đức tin hoặc bị hủy hoại về mặt thuộc linh.
- source_word: μικρῶν τούτων
  choice: những người bé mọn này
  rationale: Không giới hạn đối tượng ở trẻ em; cách dịch này giữ được khả năng chỉ những môn đồ thấp kém, yếu thế hoặc dễ bị tổn thương trong mạch văn.
- source_word: τῶν πιστευόντων εἰς ἐμέ
  choice: là những người tin Ta
  rationale: Diễn đạt trực tiếp cụm phân từ xác định những người bé mọn là người tin vào Đức Giê-su.
- source_word: συμφέρει αὐτῷ
  choice: thì thà ... còn hơn
  rationale: Chuyển ý lợi hơn/tốt hơn thành cấu trúc so sánh tự nhiên trong tiếng Việt, phù hợp với lời cảnh báo nghiêm khắc.
- source_word: μύλος ὀνικὸς
  choice: một tảng đá cối xay do lừa kéo
  rationale: Nêu rõ đây là loại đá cối xay lớn được lừa kéo, khác với cối xay tay nhỏ.
- source_word: εἰς τὸν τράχηλον αὐτοῦ
  choice: được buộc quanh cổ mình
  rationale: Diễn đạt tự nhiên hình ảnh vật nặng được treo hoặc buộc quanh cổ người gây sa ngã.
- source_word: καταποντισθῇ
  choice: bị nhận chìm
  rationale: Giữ thể bị động và diễn tả rõ việc bị chìm xuống nước sâu; kết quả chết đuối được hàm ý nhưng không bị thêm vào một cách quá hẹp.
- source_word: ἐν τῷ πελάγει τῆς θαλάσσης
  choice: giữa biển khơi
  rationale: πέλαγος chỉ vùng biển rộng, sâu và xa bờ; 'giữa biển khơi' vừa tự nhiên vừa giữ sắc thái ấy.
theological_decisions:
- issue: Phạm vi của cụm 'những người bé mọn này'
  choice: Giữ nghĩa rộng là những người bé mọn tin Đức Giê-su, không đồng nhất họ chỉ với trẻ em.
  alternative: những trẻ nhỏ này tin Ta
  rationale: Mạch văn dùng một đứa trẻ làm hình ảnh minh họa, nhưng mệnh đề 'những người tin Ta' có thể mở rộng đối tượng đến các môn đồ thấp kém hoặc dễ bị tổn thương. Bản dịch duy trì độ mở này.
- issue: Phạm vi ý nghĩa của σκανδαλίσῃ
  choice: sa ngã
  alternative: phạm tội
  rationale: '''Sa ngã'' giữ ẩn dụ và không thu hẹp lời cảnh báo chỉ còn việc khiến người khác thực hiện một tội cụ thể; động từ cũng có thể hàm ý vấp phạm hoặc lìa bỏ đức tin.'
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ta” trong lời Đức Giê-su để giữ sắc thái trang nghiêm; cấu trúc “thà ... còn hơn” truyền đạt tự nhiên lực so sánh của συμφέρει mà không làm nhẹ đi tính nghiêm khắc của lời cảnh báo.
