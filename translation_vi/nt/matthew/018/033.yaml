  text: οὐκ ἔδει καὶ σὲ ἐλεῆσαι τὸν σύνδουλόν σου, ὡς κἀγὼ σὲ ἠλέησα;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/033.yaml
  text: Should you not also have had mercy on your fellow servant[a], as I also had mercy on you?
translation:
  language: vi
  text: Lẽ ra ngươi cũng phải thương xót người đồng nô lệ của ngươi, như ta cũng đã thương xót ngươi, chẳng phải sao?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “người bạn cùng phục vụ” hoặc “người bạn cùng làm nô lệ.” Từ Hy Lạp σύνδουλος chỉ người có cùng một chủ; bản dịch chính giữ ý về thân phận nô lệ trong dụ ngôn này.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὐκ ἔδει
  choice: Lẽ ra ... phải ... chẳng phải sao?
  rationale: ἔδει diễn tả bổn phận đạo đức; câu hỏi phủ định mang sức quở trách. Cách diễn đạt này tự nhiên trong tiếng Việt và giữ được sắc thái ấy.
- source_word: καὶ
  choice: cũng
  rationale: Nêu sự tương ứng giữa lòng thương xót người đầy tớ đáng lẽ phải bày tỏ và lòng thương xót nhà vua đã dành cho người ấy.
- source_word: σὲ
  choice: ngươi
  rationale: Đại từ số ít được giữ rõ; “ngươi” phù hợp lời nhà vua quở trách thuộc hạ trong bối cảnh dụ ngôn, dù có sắc thái bề trên.
- source_word: ἐλεῆσαι / ἠλέησα
  choice: thương xót / đã thương xót
  rationale: Giữ sự lặp lại của cùng một động từ Hy Lạp và sắc thái đạo đức-thần học của ἐλεέω.
- source_word: τὸν σύνδουλόν σου
  choice: người bạn cùng làm nô lệ với mình
  rationale: σύνδουλος chỉ người cùng thân phận nô lệ và cùng thuộc một chủ. Cách dịch này giữ yếu tố σύν- và quan hệ lệ thuộc mà vẫn dễ hiểu trong tiếng Việt hiện đại.
- source_word: ὡς
  choice: như
  rationale: Giữ phép so sánh trực tiếp giữa lòng thương xót đáng lẽ được bày tỏ và lòng thương xót đã nhận.
- source_word: κἀγὼ
  choice: ta
  rationale: κἀγώ có yếu tố καί, nhưng trong tiếng Việt, sự tương ứng đã rõ nhờ “cũng” ở mệnh đề trước và cấu trúc “như ta”; thêm “cũng” lần nữa dễ nặng câu.
theological_decisions:
- issue: Cách dịch từ thuộc nhóm δοῦλος trong σύνδουλος
  choice: người bạn cùng làm nô lệ với mình
  alternative: người bạn cùng phục vụ / người đồng nô lệ
  rationale: Bối cảnh nói đến một vua/chủ và những người lệ thuộc quyền ông; vì vậy cần giữ thân phận nô lệ thay vì làm nhẹ thành người phục vụ. “Bạn cùng làm nô lệ” diễn đạt tự nhiên hơn “đồng nô lệ” mà không xóa ý nghĩa gốc.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng cặp xưng hô “ta–ngươi” để phản ánh quan hệ vua với thuộc hạ và sắc thái quở trách. Dấu hỏi tu từ ở cuối giúp chuyển tải οὐκ ἔδει tự nhiên trong tiếng Việt.
