    text: 'Hoặc: “người bạn cùng phục vụ” hoặc “người bạn cùng làm nô lệ.” Từ Hy Lạp σύνδουλος chỉ người có cùng một chủ; bản dịch chính giữ ý về thân phận nô lệ trong dụ ngôn này.'
    reason: alternative_reading
