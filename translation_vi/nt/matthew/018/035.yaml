    rationale: 'Trong tiếng Việt, “anh em” thường được hiểu là số nhiều hoặc một nhóm quan hệ, trong khi τῷ ἀδελφῷ αὐτοῦ là danh từ giống đực số ít: ‘người anh em của mình’. Cần làm rõ ở bản văn chính.'
  - severity: low
    issue: “Thật lòng” không giữ rõ hình ảnh ‘từ lòng’ của nguyên văn.
    rationale: Cụm này diễn đạt được sự chân thành, nhưng “từ lòng mình” vẫn tự nhiên trong tiếng Việt và phản ánh trực tiếp ἀπὸ τῶν καρδιῶν ὑμῶν trong cấu trúc phân phối với ‘mỗi người’.
  - severity: low
