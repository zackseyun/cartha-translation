id: MAT.18.35
reference: Matthew 18:35
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Οὕτως καὶ ὁ πατήρ μου ὁ ⸀οὐράνιος ποιήσει ὑμῖν ἐὰν μὴ ἀφῆτε ἕκαστος τῷ ἀδελφῷ αὐτοῦ ἀπὸ τῶν καρδιῶν ⸀ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/035.yaml
  text: So also my heavenly Father will do to you[b][a], if each of you does not forgive his brother from your hearts.
translation:
  language: vi
  text: Cha trên trời của tôi cũng sẽ làm như thế với anh chị em, nếu mỗi người trong anh chị em không tha thứ cho người anh em của mình từ lòng mình.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Người anh em của mình” dịch danh từ giống đực số ít trong tiếng Hy Lạp; trong ngữ cảnh, cách dùng này có tính đại diện, chỉ người cùng làm môn đồ hoặc cùng đức tin.
    reason: cultural_note
lexical_decisions:
- source_word: Οὕτως καὶ
  choice: cũng sẽ làm như vậy
  rationale: Nối lời áp dụng trực tiếp với cách người chủ hành xử trong dụ ngôn trước đó, đồng thời diễn đạt tự nhiên trong tiếng Việt.
- source_word: ὁ πατήρ μου ὁ οὐράνιος
  choice: Cha trên trời của tôi
  rationale: Giữ đại từ sở hữu ngôi thứ nhất và ý nghĩa οὐράνιος, với cách nói tiếng Việt tự nhiên, trang trọng.
- source_word: ποιήσει ὑμῖν
  choice: sẽ làm như vậy với anh chị em
  rationale: Giữ động từ có nghĩa rộng và quy chiếu về hành động của người chủ trong dụ ngôn, không giải thích thêm bản chất cuối cùng của sự phán xét. Đại từ số nhiều được diễn đạt bằng cách xưng hô hiện đại, bao quát cử tọa.
- source_word: ἐὰν μὴ
  choice: nếu ... không
  rationale: Giữ rõ cấu trúc điều kiện phủ định của nguyên văn.
- source_word: ἀφῆτε
  choice: tha thứ
  rationale: Trong bối cảnh lỗi phạm và hình ảnh món nợ, ἀφίημι chỉ hành động tha thứ.
- source_word: ἕκαστος
  choice: mỗi người
  rationale: 'Giữ ý phân phối: lời đòi hỏi áp dụng riêng cho từng người trong cử tọa số nhiều.'
- source_word: τῷ ἀδελφῷ αὐτοῦ
  choice: anh em mình
  rationale: Giữ danh từ giống đực số ít của nguyên văn; trong ngữ cảnh, cụm từ đại diện cho một môn đồ hay người cùng đức tin.
- source_word: ἀπὸ τῶν καρδιῶν ὑμῶν
  choice: thật lòng
  rationale: Diễn đạt thành ngữ tự nhiên ý tha thứ từ trong lòng, không thêm mức độ như 'tận đáy lòng'.
theological_decisions:
- issue: Phạm vi và sức nặng của lời cảnh báo
  choice: Giữ lời cảnh báo trực tiếp rằng Cha trên trời sẽ hành xử tương ứng với phán quyết trong dụ ngôn.
  alternative: Giảm nhẹ thành 'sẽ đối xử tương tự' hoặc giải thích đó cụ thể là sự kết án đời đời hay mất phần thưởng.
  rationale: Câu Hy Lạp đưa ra một điều kiện nghiêm trọng nhưng không tự xác định toàn bộ phạm trù thần học hệ thống của sự phán xét; bản dịch không làm nhẹ cũng không mở rộng.
- issue: Ngôn ngữ giống đực trong ἀδελφῷ
  choice: anh em mình
  alternative: anh chị em mình; người cùng đức tin
  rationale: Nguyên văn dùng giống đực số ít. Bản chính giữ hình thức này, còn chú thích nêu rõ chức năng đại diện trong ngữ cảnh.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh chị em” để chỉ cử tọa số nhiều và “anh em mình” tại vị trí danh từ giống đực số ít của nguyên văn. “Thật lòng” truyền đạt tự nhiên thành ngữ ἀπὸ τῶν καρδιῶν ὑμῶν.
