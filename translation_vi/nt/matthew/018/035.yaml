revisions:
- from: Cha trên trời của tôi cũng sẽ làm như vậy với anh chị em, nếu mỗi người không thật lòng tha thứ cho anh em mình.[a]
  to: Cha trên trời của tôi cũng sẽ làm như thế với anh chị em, nếu mỗi người trong anh chị em không tha thứ cho người anh em của mình từ lòng mình.[a]
  rationale: Bản sửa giữ nguyên tính nghiêm trọng nhưng không xác định thêm bản chất của hành động phán xét được quy chiếu từ dụ ngôn. Cụm ‘người anh em của mình’ phản ánh chính xác số ít giống đực; ‘từ lòng mình’ bảo toàn phép ẩn dụ về lòng và ý phân phối của câu mà vẫn tự nhiên trong tiếng Việt.
  reviewer_model: gpt-5.6-terra
