source:
  edition: SBLGNT
  text: Τότε προσελθὼν ⸂αὐτῷ ὁ Πέτρος εἶπεν⸃· Κύριε, ποσάκις ἁμαρτήσει εἰς ἐμὲ ὁ ἀδελφός μου καὶ ἀφήσω αὐτῷ; ἕως ἑπτάκις;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/021.yaml
  text: Then Peter came up to him and said[a], “Lord, how many times will my brother sin against me, and I forgive him? Up to seven times?”
translation:
  language: vi
  text: 'Bấy giờ, Phi-e-rơ đến gần Ngài và thưa: “Lạy Chúa, người anh em của con[a] sẽ phạm tội chống lại con bao nhiêu lần thì con sẽ tha thứ cho người ấy? Đến bảy lần chăng?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tiếng Hy Lạp dùng danh từ giống đực số ít, theo nghĩa đen là “người anh em của con”; trong văn cảnh, từ này có thể chỉ rộng hơn một môn đồ khác, dù là nam hay nữ.
    reason: Nêu rõ hình thức giống đực số ít của nguyên văn và khả năng dùng đại diện trong văn cảnh mà không mở rộng âm thầm trong chính văn.
lexical_decisions:
- source_word: Τότε
  choice: Bấy giờ
  rationale: Giữ chức năng chuyển tiếp theo trình tự của câu chuyện, đồng thời phù hợp với văn phong tường thuật trang trọng, tự nhiên.
- source_word: προσελθὼν αὐτῷ
  choice: đến gần Ngài
  rationale: Diễn đạt hành động Phi-e-rơ tiến đến chỗ Đức Chúa Jêsus; “Ngài” quy chiếu tự nhiên về nhân vật đang được nói đến trong văn cảnh.
- source_word: ὁ Πέτρος εἶπεν
  choice: Phi-e-rơ ... thưa
  rationale: Dùng dạng tên quen thuộc trong tiếng Việt. “Thưa” diễn đạt động từ nói trong quan hệ kính trọng với người được gọi là “Chúa”, dù từ Hy Lạp tự nó là động từ nói thông thường.
- source_word: Κύριε
  choice: Lạy Chúa
  rationale: Giữ cách xưng hô trực tiếp, kính trọng và âm hưởng thần học có thể có của κύριος.
- source_word: ποσάκις
  choice: bao nhiêu lần
  rationale: Nhấn mạnh số lần, phù hợp với giới hạn cụ thể “bảy lần” ở cuối câu.
- source_word: ἁμαρτήσει εἰς ἐμὲ
  choice: sẽ phạm tội với con
  rationale: Giữ hình thức hướng đến tương lai của động từ và diễn đạt εἰς ἐμέ bằng cách nói tiếng Việt tự nhiên về hành vi xúc phạm một người.
- source_word: ὁ ἀδελφός μου
  choice: người anh em của con
  rationale: Giữ số ít và cách gọi thân thuộc của bản Hy Lạp, không tự động mở rộng thành “anh chị em” hoặc diễn giải thành “môn đồ” trong chính văn.
- source_word: καὶ ἀφήσω αὐτῷ
  choice: và con sẽ tha thứ cho người ấy
  rationale: Giữ sự phối hợp bằng καί và hình thức tương lai của ἀφήσω; “tha thứ” là nghĩa thích hợp của ἀφίημι trong văn cảnh đạo đức này.
- source_word: ἕως ἑπτάκις
  choice: Đến bảy lần sao?
  rationale: Diễn đạt đề nghị của Phi-e-rơ về một giới hạn tối đa, đồng thời giữ sắc thái nghi vấn.
theological_decisions:
- issue: Phạm vi chỉ người của ἀδελφός
  choice: Dịch sát là “người anh em của con” trong chính văn.
  alternative: “anh chị em của con” hoặc “một người đồng môn”
  rationale: Danh từ Hy Lạp ở giống đực số ít, nhưng trong văn cảnh cộng đồng môn đồ có thể được dùng rộng hơn. Bản dịch giữ hình thức nguồn và nêu khả năng bao quát hơn trong chú thích.
- issue: Sắc thái của κύριος khi Phi-e-rơ gọi Đức Chúa Jêsus
  choice: “Lạy Chúa”
  alternative: “Thưa Thầy” hoặc “thưa chủ”
  rationale: “Chúa” vừa giữ sự kính trọng vừa không loại bỏ âm hưởng thần học của danh xưng; bản văn không buộc phải thu hẹp danh xưng này chỉ còn nghĩa “Thầy”.
- issue: Quan hệ giữa hai động từ tương lai ἁμαρτήσει và ἀφήσω
  choice: Giữ cả hai bằng “sẽ ... và ... sẽ ...”
  alternative: Diễn giải thành “mỗi khi ... thì con phải tha thứ ...”
  rationale: Cách dịch được chọn bảo toàn cấu trúc và độ căng của câu hỏi Hy Lạp, không ngầm thêm ý nghĩa nghĩa vụ bằng từ “phải”, dù ý nghĩa cân nhắc trách nhiệm tha thứ hiện diện trong văn cảnh.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Cặp xưng hô “Chúa—con” phù hợp với lời Phi-e-rơ kính cẩn nói trực tiếp với Đức Chúa Jêsus. Câu hỏi giữ tương đối sát cấu trúc Hy Lạp để tránh thêm từ tình thái “phải”; dấu phẩy không được dùng để tách sai hai vị ngữ phối hợp.
