  text: οὕτως οὐκ ἔστιν θέλημα ⸀ἔμπροσθεν τοῦ πατρὸς ⸀ὑμῶν τοῦ ἐν οὐρανοῖς ἵνα ἀπόληται ⸀ἓν τῶν μικρῶν τούτων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/014.yaml
  text: In the same way, it is not the will of your Father in heaven that even one of these little ones should perish.
translation:
  language: vi
  text: Cũng vậy, Cha của anh em ở trên trời không muốn một ai trong những người bé mọn này hư mất.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “bị mất.” Động từ Hy Lạp có thể mang nghĩa “hư mất” hoặc “bị mất”; ngữ cảnh ngay trước đó về con chiên đi lạc ủng hộ sắc thái thứ hai.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὕτως
  choice: Cũng vậy
  rationale: Nối lời kết luận này với dụ ngôn con chiên đi lạc ngay trước đó, đồng thời diễn đạt tự nhiên sắc thái so sánh của từ Hy Lạp.
- source_word: οὐκ ἔστιν θέλημα ἔμπροσθεν τοῦ πατρός
  choice: Cha ... không muốn
  rationale: Diễn đạt thành ngữ Hy Lạp về điều không phải là ý muốn trước mặt Cha bằng cấu trúc tiếng Việt tự nhiên, không làm thay đổi chủ thể hay ý định.
- source_word: πατρὸς ὑμῶν τοῦ ἐν οὐρανοῖς
  choice: Cha của anh em ở trên trời
  rationale: Giữ rõ đại từ số nhiều ὑμῶν và ý nghĩa chỉ nơi chốn của cụm 'ở trên trời', bằng lối nói trang trọng, dễ hiểu.
- source_word: ἵνα ἀπόληται
  choice: phải hư mất
  rationale: ἀπόλλυμι ở đây có thể chỉ sự diệt vong hoặc bị mất. 'Hư mất' giữ được mức độ nghiêm trọng của lời cảnh báo; nghĩa phù hợp với hình ảnh chiên đi lạc được ghi ở chú thích.
- source_word: ἓν τῶν μικρῶν τούτων
  choice: một ai trong những người bé mọn này
  rationale: '''Một ai'' tự nhiên trong câu phủ định và nhấn mạnh rằng không một người nào bị loại trừ. ''Những người bé mọn'' không giới hạn đối tượng vào trẻ em, phù hợp ngữ cảnh môn đồ.'
theological_decisions:
- issue: Nghĩa của ἀπόληται trong liên hệ với dụ ngôn con chiên đi lạc
  choice: phải hư mất
  alternative: bị lạc mất
  rationale: Động từ có thể gợi đến sự diệt vong, nhưng ngữ cảnh gần cũng gợi đến tình trạng đi lạc hay bị mất. Bản chính giữ sức nặng của lời cảnh báo, còn chú thích bảo tồn sắc thái theo ngữ cảnh mà không quyết định thay cho người đọc.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh em” cho đại từ số nhiều trong lời Chúa Giê-su nói với các môn đồ; dùng “người bé mọn” để giữ khả năng chỉ những người nhỏ bé trong cộng đồng môn đồ, không thu hẹp thành trẻ nhỏ.
