revisions:
- from: Cũng vậy, Cha của anh em ở trên trời không muốn một ai trong những người bé mọn này phải hư mất.[a]
  to: Cũng vậy, Cha của anh em ở trên trời không muốn một ai trong những người bé mọn này hư mất.[a]
  rationale: Chỉ bỏ “phải” để tránh thêm sắc thái bắt buộc/tất định không có trong ἵνα ἀπόληται, và chỉnh chú thích để nêu nghĩa thay thế sát với động từ hơn. Các lựa chọn còn lại được giữ nguyên vì tự nhiên và trung thành với nguyên ngữ.
