  to: Nhưng vì người ấy không thể hoàn trả, ông chủ[a] ra lệnh bán người ấy, cùng với vợ con và tất cả những gì người ấy có[b], và khoản nợ phải được hoàn trả.
  rationale: Sửa mệnh đề cuối để phản ánh trực tiếp hơn phối hợp từ καὶ và thể bị động của ἀποδοθῆναι. “Khoản nợ” được nêu rõ theo ngữ cảnh trước đó, trong khi “phải được hoàn trả” bảo toàn việc nguyên văn không chỉ rõ ai là người thực hiện sự hoàn trả hay khẳng định số tiền bán được đủ để trả hết.
  reviewer_model: gpt-5.6-terra
