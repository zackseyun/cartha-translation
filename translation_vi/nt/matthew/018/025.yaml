    issue: “để lấy đó mà hoàn trả” diễn giải quá cụ thể mệnh đề cuối.
    rationale: 'καὶ ἀποδοθῆναι là một nguyên mẫu bị động được phối hợp với lệnh bán: “và [sự] hoàn trả phải được thực hiện.” Cụm “lấy đó” khẳng định rõ rằng chính số thu từ việc bán là phương tiện hoàn trả, trong khi câu Hy Lạp chỉ hàm ý mối liên hệ này.'
