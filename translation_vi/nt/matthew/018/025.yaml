id: MAT.18.25
reference: Matthew 18:25
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: μὴ ἔχοντος δὲ αὐτοῦ ἀποδοῦναι ἐκέλευσεν αὐτὸν ὁ ⸀κύριος πραθῆναι καὶ τὴν ⸀γυναῖκα καὶ τὰ τέκνα καὶ πάντα ὅσα ⸀ἔχει καὶ ἀποδοθῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/025.yaml
  text: But since he was unable to repay[a], the master ordered that he be sold, along with his wife and children and all that he had[b], and that payment be made.
translation:
  language: vi
  text: Nhưng vì người ấy không thể hoàn trả, ông chủ[a] ra lệnh bán người ấy, cùng với vợ con và tất cả những gì người ấy có[b], và khoản nợ phải được hoàn trả.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hy Lạp κύριος có thể có nghĩa là “chúa” hoặc “chủ”; tại đây từ này chỉ người chủ của đầy tớ trong dụ ngôn.
    reason: lexical_alternative
  - marker: b
    text: Tức là người mắc nợ, gia đình và tài sản của người ấy đều bị đem bán nhằm thu hồi khoản nợ.
    reason: cultural_note
lexical_decisions:
- source_word: μὴ ἔχοντος δὲ αὐτοῦ ἀποδοῦναι
  choice: Nhưng vì người ấy không có khả năng hoàn trả
  rationale: Kết cấu sở hữu ἔχω với động từ nguyên mẫu diễn tả người ấy không có phương tiện hay khả năng để trả lại khoản nợ; cách dịch này tự nhiên và không hiểu sai rằng ông không có món gì cần phải trả.
- source_word: ἀποδοῦναι / ἀποδοθῆναι
  choice: hoàn trả / để lấy đó mà hoàn trả
  rationale: Trong ngữ cảnh khoản nợ, ἀποδίδωμι chỉ việc trả lại số tiền mắc nợ. Mệnh đề cuối giữ ý rằng việc bán người và tài sản nhằm tạo ra sự hoàn trả, nhưng không thêm một con số hay mức thanh toán mà bản Hy Lạp không nêu.
- source_word: ἐκέλευσεν
  choice: ra lệnh
  rationale: κελεύω diễn tả một mệnh lệnh có thẩm quyền; “ra lệnh” là cách nói hiện đại, rõ ràng và phù hợp với quan hệ chủ–đầy tớ trong dụ ngôn.
- source_word: ὁ κύριος
  choice: ông chủ
  rationale: Trong bối cảnh xã hội của dụ ngôn, κύριος chỉ người chủ của đầy tớ, không phải là một tước hiệu trực tiếp dành cho Đức Chúa Trời. “Ông chủ” vừa tự nhiên trong tiếng Việt vừa giữ đúng quan hệ được kể.
- source_word: πραθῆναι
  choice: bán người ấy
  rationale: Động từ bị động πιπράσκω có nghĩa là bị đem bán. Cách dịch này giữ nguyên thực trạng khắc nghiệt của việc bán con người để thu hồi nợ.
- source_word: τὴν γυναῖκα καὶ τὰ τέκνα
  choice: cùng với vợ con
  rationale: Mạo từ Hy Lạp xác định vợ và các con thuộc gia đình người mắc nợ; tiếng Việt tự nhiên dùng “vợ con” mà không cần lặp đại từ sở hữu.
- source_word: πάντα ὅσα ἔχει
  choice: tất cả những gì người ấy có
  rationale: Cách dịch bám sát ý bao quát của πάντα ὅσα và gồm toàn bộ tài sản thuộc về người ấy.
theological_decisions:
- issue: Cách dịch κύριος trong bối cảnh dụ ngôn
  choice: ông chủ
  alternative: chúa; chủ của người ấy
  rationale: Ở đây κύριος là người có quyền trên đầy tớ trong câu chuyện. Dùng “ông chủ” tránh biến từ này thành một danh hiệu thần học trực tiếp, đồng thời không phủ nhận rằng nhân vật dụ ngôn có thể mang ý nghĩa biểu trưng trong toàn bộ lời dạy.
- issue: Mức độ nói rõ mục đích của việc bán
  choice: để lấy đó mà hoàn trả
  alternative: và phải hoàn trả; để trả món nợ
  rationale: Bản Hy Lạp chỉ nói “và được hoàn trả” mà không nêu tân ngữ. “Lấy đó” liên kết tự nhiên số thu được từ việc bán với sự hoàn trả, nhưng không xác quyết rằng khoản nợ khổng lồ có thể được thanh toán đầy đủ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu giữ nhịp kể của nguyên bản, dùng “ông chủ” theo ngữ cảnh và không làm nhẹ đi chi tiết người mắc nợ cùng gia đình bị bán.
