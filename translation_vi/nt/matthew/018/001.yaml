review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch bám sát tốt trình tự và nội dung Hy Lạp: “Lúc ấy,” cho Ἐν ἐκείνῃ τῇ ὥρᾳ; “đến gần” phản ánh προσῆλθον; và “lớn hơn” giữ dạng so sánh của μείζων, phù hợp với audit trail tiếng Anh. “Hỏi” diễn đạt tự nhiên hành vi nói một câu hỏi, không làm đổi nghĩa λέγοντες. Tuy nhiên, “vương quốc thiên đàng” không phải cách kết hợp tự nhiên trong tiếng Việt và có thể khiến “thiên đàng” bị hiểu chủ yếu là một địa điểm. Công thức Ma-thi-ơ ἡ βασιλεία τῶν οὐρανῶν được chuyển đạt chuẩn xác, quen thuộc hơn bằng “Nước Trời.”'
  naturalness: Câu cần chỉnh nhẹ ở cụm danh từ cuối. “Nước Trời” là cách dùng Kinh Thánh tiếng Việt tự nhiên, hiện đại và trang trọng. Các phần còn lại, gồm “các môn đồ,” “Đức Giê-su,” và trật tự câu hỏi, đều rõ ràng và phù hợp văn phong.
  terminology: Giữ “Đức Giê-su” và “môn đồ” như bản thảo. Thay “vương quốc thiên đàng” bằng “Nước Trời” để phản ánh thành ngữ đặc trưng của Ma-thi-ơ mà không biến nó thành khái niệm địa lý hay áp đặt diễn giải giáo phái. Giữ “lớn hơn,” không thay bằng “lớn nhất,” để bảo toàn hình thức so sánh μείζων.
  issues:
  - severity: medium
    issue: “vương quốc thiên đàng” là kết hợp từ không tự nhiên và dễ gây lệch trường nghĩa.
    rationale: Cụm này thiếu quan hệ sở hữu cần thiết nếu dùng “vương quốc,” trong khi “thiên đàng” tiếng Việt thường chỉ nơi chốn. “Nước Trời” là tương đương thành ngữ, tự nhiên và đã định hình cho βασιλεία τῶν οὐρανῶν trong Ma-thi-ơ.
  revised_text: 'Lúc ấy, các môn đồ đến gần Đức Giê-su và hỏi: “Vậy ai lớn hơn trong Nước Trời?”'
