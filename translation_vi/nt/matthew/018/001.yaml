  text: Ἐν ἐκείνῃ τῇ ὥρᾳ προσῆλθον οἱ μαθηταὶ τῷ Ἰησοῦ λέγοντες· Τίς ἄρα μείζων ἐστὶν ἐν τῇ βασιλείᾳ τῶν οὐρανῶν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/001.yaml
  text: At that time the disciples came to Jesus, saying, “Who then is greater in the kingdom of heaven?”
translation:
  language: vi
  text: 'Lúc ấy, các môn đồ đến gần Đức Giê-su và hỏi: “Vậy ai lớn hơn trong Nước Trời?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐν ἐκείνῃ τῇ ὥρᾳ
  choice: Lúc ấy
  rationale: Cách diễn đạt tự nhiên, trang trọng trong tiếng Việt, truyền đạt đúng ý thời điểm của cụm Hy Lạp.
- source_word: προσῆλθον ... τῷ Ἰησοῦ
  choice: đến gần Đức Giê-su
  rationale: Động từ προσέρχομαι hàm ý tiến đến hoặc đến gần một người; “đến gần” giữ sắc thái này rõ hơn chỉ “đến”.
- source_word: οἱ μαθηταί
  choice: các môn đồ
  rationale: Thuật ngữ quen thuộc, dignified và phân biệt rõ người học theo Đức Giê-su với học sinh thông thường.
- source_word: Τίς ἄρα
  choice: Vậy ai
  rationale: ἄρα ở đây thể hiện suy luận hoặc câu hỏi nảy sinh từ bối cảnh; “vậy” là tương đương tự nhiên.
- source_word: μείζων
  choice: lớn hơn
  rationale: Giữ dạng so sánh của tính từ Hy Lạp thay vì đổi thành dạng cao nhất “lớn nhất”, qua đó bảo tồn nét diễn đạt và độ mở của nguyên văn.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: vương quốc thiên đàng
  rationale: Diễn đạt βασιλεία là “vương quốc” và giữ công thức đặc trưng của Ma-thi-ơ; không thu hẹp nghĩa thành một địa điểm đơn thuần.
theological_decisions:
- issue: Dạng so sánh μίζων trong câu hỏi về địa vị trong vương quốc
  choice: ai lớn hơn
  alternative: ai lớn nhất
  rationale: Nguyên văn dùng dạng so sánh μίζων. Bản dịch giữ nguyên hình thức này và không tự động giải quyết nó theo nghĩa cao nhất, dù ngữ cảnh có thể khiến độc giả hiểu câu hỏi là ai đứng đầu.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “Đức Giê-su” và “môn đồ” theo văn phong Kinh Thánh phổ thông; cấu trúc câu gọn, tự nhiên, đồng thời giữ nét so sánh có chủ ý của nguyên văn.
