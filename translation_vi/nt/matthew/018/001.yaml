  to: 'Lúc ấy, các môn đồ đến gần Đức Giê-su và hỏi: “Vậy ai lớn hơn trong Nước Trời?”'
  rationale: Chỉ sửa thuật ngữ “vương quốc thiên đàng” thành “Nước Trời” vì lý do tự nhiên và chính xác ngữ nghĩa trong tiếng Việt. Các lựa chọn khác được giữ nguyên, đặc biệt là dạng so sánh “lớn hơn.”
