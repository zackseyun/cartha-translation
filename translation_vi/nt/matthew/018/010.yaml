id: MAT.18.10
reference: Matthew 18:10
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ὁρᾶτε μὴ καταφρονήσητε ἑνὸς τῶν μικρῶν τούτων, λέγω γὰρ ὑμῖν ὅτι οἱ ἄγγελοι αὐτῶν ἐν οὐρανοῖς διὰ παντὸς βλέπουσι τὸ πρόσωπον τοῦ πατρός μου τοῦ ἐν ⸀οὐρανοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/010.yaml
  text: See that you do not despise one of these little ones[c][b][a], for I tell you that their angels in heaven continually see the face of my Father who is in heaven.
translation:
  language: vi
  text: Hãy coi chừng, đừng khinh thường một ai trong những người bé mọn này,[a] vì Ta nói với các con rằng các thiên sứ của họ[b] ở trên trời luôn thấy mặt Cha Ta, Đấng ở trên trời.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đừng coi thường một ai trong những người bé mọn này.”'
    reason: lexical_alternative
  - marker: b
    text: “Các thiên sứ của họ” có thể chỉ các thiên sứ gắn với hoặc đại diện cho những người bé mọn này; riêng câu này không xác định đầy đủ giáo lý về thiên sứ hộ mệnh.
    reason: alternative_reading
  - marker: c
    text: Tiếng Hy Lạp dùng dạng số nhiều, sát nghĩa là “trong các trời”; ở đây được dịch theo cách nói tự nhiên là “ở trên trời”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὁρᾶτε μὴ καταφρονήσητε
  choice: Hãy coi chừng, đừng khinh thường
  rationale: Mệnh lệnh Ὁρᾶτε dẫn vào lời cảnh báo, còn μή với động từ ở thể giả định diễn đạt sự ngăn cấm. Cách dịch này tự nhiên trong tiếng Việt và giữ được sức nặng của lời cảnh tỉnh.
- source_word: ἑνὸς τῶν μικρῶν τούτων
  choice: một ai trong những người bé mọn này
  rationale: Giữ phạm vi rộng của μικροί, có thể liên hệ đến trẻ nhỏ nhưng không giới hạn ở trẻ em; trong ngữ cảnh, cụm từ cũng gợi đến những người có địa vị thấp hoặc khiêm nhường.
- source_word: λέγω γὰρ ὑμῖν
  choice: vì Ta nói với các con rằng
  rationale: Giữ chức năng giải thích của γάρ và công thức nhấn mạnh λέγω ὑμῖν. Đại từ được chọn theo văn phong lời Chúa Giê-su nói với các môn đồ.
- source_word: οἱ ἄγγελοι αὐτῶν
  choice: các thiên sứ của họ
  rationale: Dịch trực tiếp quan hệ sở hữu mà không xác định đây nhất thiết là mỗi người có một thiên sứ hộ mệnh riêng.
- source_word: ἐν οὐρανοῖς
  choice: ở trên trời
  rationale: Danh từ số nhiều trong tiếng Hy Lạp được chuyển thành thành ngữ tiếng Việt tự nhiên, không hàm ý phải có nhiều tầng trời.
- source_word: διὰ παντὸς
  choice: luôn
  rationale: Diễn đạt ngắn gọn ý liên tục hoặc mọi lúc của thành ngữ Hy Lạp.
- source_word: βλέπουσι τὸ πρόσωπον
  choice: được thấy mặt
  rationale: Giữ hình ảnh thấy mặt, vốn gợi quyền được hiện diện và tiếp cận trước mặt Đức Chúa Trời; 'được thấy' làm rõ sắc thái đặc ân trong tiếng Việt mà không thay đổi nội dung căn bản.
- source_word: τοῦ πατρός μου τοῦ ἐν οὐρανοῖς
  choice: Cha Ta, Đấng ở trên trời
  rationale: Giữ nguyên ngôn ngữ phụ tử của Chúa Giê-su và mệnh đề chỉ nơi chốn bổ nghĩa cho 'Cha Ta'.
theological_decisions:
- issue: Ý nghĩa của “các thiên sứ của họ”
  choice: Giữ nguyên cụm “các thiên sứ của họ” mà không xác lập giáo lý mỗi cá nhân có một thiên sứ hộ mệnh riêng.
  alternative: Hiểu là các thiên sứ hộ mệnh được chỉ định riêng cho từng trẻ nhỏ hoặc từng tín hữu; hoặc hiểu rộng hơn là các thiên sứ đại diện hay phục vụ họ.
  rationale: Câu Hy Lạp nêu quan hệ giữa các thiên sứ và những người bé mọn nhưng không giải thích chính xác cơ chế hay phạm vi của quan hệ ấy.
- issue: Phạm vi của “những người bé mọn này”
  choice: Dùng “những người bé mọn này” để không giới hạn đối tượng chỉ vào trẻ em.
  alternative: Dịch là “những trẻ nhỏ này”.
  rationale: Ngữ cảnh Ma-thi-ơ 18 bắt đầu với một trẻ nhỏ nhưng dùng sự bé mọn để nói đến địa vị và sự khiêm nhường; bản dịch cần giữ độ mở của từ Hy Lạp.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “Ta/các con” cho lời Chúa Giê-su nói trực tiếp với các môn đồ. Tránh thuật ngữ giáo phái và giữ nguyên độ mở của các cụm “người bé mọn” và “các thiên sứ của họ”.
