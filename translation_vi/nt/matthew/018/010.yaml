  source_fidelity: 'Cần sửa một điểm quan trọng: βλέπουσι là chủ động, ‘các thiên sứ ... thấy mặt Cha Ta’, không phải bị động/được phép ‘được thấy mặt’. Bản sửa giữ nguyên quan hệ chưa được xác định của ‘các thiên sứ của họ’, ý liên tục của διὰ παντός, và phạm vi mở của τῶν μικρῶν τούτων.'
  naturalness: Câu sửa tự nhiên, trang trọng và rõ ràng trong tiếng Việt hiện đại. ‘Luôn thấy mặt’ diễn đạt trực tiếp chủ ngữ hành động, đồng thời vẫn giữ hình ảnh hiện diện trước mặt Đức Chúa Trời.
  terminology: ‘Người bé mọn’, ‘thiên sứ’, và ‘Cha Ta’ phù hợp với văn phong Kinh Thánh tiếng Việt mà không áp đặt cách hiểu giáo phái. Chú thích về số nhiều của οὐρανοῖς được chỉnh để không thêm khái niệm ‘các tầng trời’, vốn không do bản văn này xác định.
