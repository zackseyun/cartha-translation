revisions:
- from: Hãy coi chừng, đừng khinh thường một ai trong những người bé mọn này,[a] vì Ta nói với các con rằng các thiên sứ của họ[b] ở trên trời luôn được thấy mặt Cha Ta, Đấng ở trên trời.[c]
  to: Hãy coi chừng, đừng khinh thường một ai trong những người bé mọn này,[a] vì Ta nói với các con rằng các thiên sứ của họ[b] ở trên trời luôn thấy mặt Cha Ta, Đấng ở trên trời.[c]
  rationale: Thay ‘được thấy mặt’ bằng ‘thấy mặt’ để phản ánh đúng thể chủ động của βλέπουσι. Đồng thời chỉnh chú thích về số nhiều của οὐρανοῖς để giải thích hình thức ngôn ngữ mà không diễn giải thành ‘các tầng trời’. Không thay đổi nghĩa, đối tượng của ‘những người bé mọn’, hay mức độ mở về ý nghĩa của ‘các thiên sứ của họ’.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T05:40:31Z'
