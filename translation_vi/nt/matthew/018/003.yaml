revisions:
- from: 'Ngài nói: “Thật, tôi nói với anh em: nếu anh em không quay lại[a] và trở nên như trẻ em, thì chắc chắn anh em sẽ không được vào vương quốc thiên đàng[b].”'
  to: 'Ngài nói: “Tôi nói thật với anh em: nếu anh em không quay lại[a] và trở nên như trẻ em, thì chắc chắn anh em sẽ không vào được Nước Trời[b].”'
  rationale: 'Bản sửa giữ nguyên ý nghĩa và độ mở diễn giải của bản nguồn: “quay lại” không xác định tác nhân của sự đổi hướng, và “trẻ em” không bị quy thành một phẩm chất cụ thể. Sửa chú thích a để phản ánh trung thực khả năng ngữ pháp và truyền thống dịch thuật, thay “không được vào” bằng “không vào được” để sát động từ nguồn hơn, và dùng “Nước Trời” cho cách nói tiếng Việt tự nhiên của thành ngữ Ma-thi-ơ.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T05:40:38Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch truyền đạt đúng cấu trúc điều kiện, hai động từ phối hợp (στραφῆτε ... γένησθε), phép so sánh với trẻ em, và lực nhấn mạnh của οὐ μή. Tuy nhiên, chú thích a hiện diễn đạt sai lựa chọn ngữ pháp/nghĩa: “không được xoay chuyển” và “không thay đổi hướng đi” đều không phải các cách thay thế thích hợp cho στραφῆτε trong câu này. “Không được vào” cũng dễ gợi ý sự bị từ chối cho phép, trong khi nguyên văn dùng động từ chủ động ‘vào’; ‘không vào được’ giữ nghĩa sát hơn. “Nước Trời” là cách gọi hiện đại, tự nhiên và đã được xác lập trong tiếng Việt cho βασιλεία τῶν οὐρανῶν.'
  naturalness: “Tôi nói thật với anh em” tự nhiên hơn “Thật, tôi nói với anh em” trong lời nói trực tiếp hiện đại mà vẫn giữ tính trang trọng. “Trở nên như trẻ em” là tự nhiên và không áp đặt phẩm chất diễn giải. “Nước Trời” tự nhiên hơn cụm ít thông dụng “vương quốc thiên đàng.”
  terminology: Giữ “quay lại” cho στραφῆτε, tránh áp đặt thuật ngữ thần học kỹ thuật trong chính văn. Giữ “trẻ em” cho τὰ παιδία như một phạm trù chung; tiếng Việt không cần thể hiện mạo từ Hy Lạp. Dùng “Nước Trời” cho thành ngữ đặc trưng của Ma-thi-ơ, không diễn giải thành một hệ thống giáo lý.
  issues:
  - severity: medium
    issue: Chú thích a đưa ra các phương án thay thế không chính xác cho στραφῆτε.
    rationale: Cụm “không được xoay chuyển” thêm phủ định không có trong động từ được chú thích và không phải cách diễn đạt khả dĩ trong ngữ cảnh; “không thay đổi hướng đi” lại phủ định chính hành động mà câu điều kiện đòi hỏi. Chú thích cần nêu khả năng bị động/trung tính của động từ và, nếu cần, thuật ngữ truyền thống “hoán cải.”
  - severity: low
    issue: “Không được vào” có thể hàm ý bị ngăn cấm thay vì hành động ‘vào’ của chủ thể.
    rationale: εἰσέλθητε là động từ chủ động. “Sẽ không vào được” là cách nói tiếng Việt tự nhiên, giữ chủ thể thực hiện hành động và vẫn biểu đạt phủ định nhấn mạnh.
  - severity: low
    issue: “Vương quốc thiên đàng” kém tự nhiên trong tiếng Việt Kinh Thánh hiện đại.
    rationale: “Nước Trời” là cách diễn đạt thành ngữ, rõ nghĩa và phù hợp với βασιλεία τῶν οὐρανῶν; nó không thêm nội dung diễn giải.
