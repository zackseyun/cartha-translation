id: MAT.18.3
reference: Matthew 18:3
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ εἶπεν· Ἀμὴν λέγω ὑμῖν, ἐὰν μὴ στραφῆτε καὶ γένησθε ὡς τὰ παιδία, οὐ μὴ εἰσέλθητε εἰς τὴν βασιλείαν τῶν οὐρανῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/003.yaml
  text: And he said[a], “Truly I say to you, unless you turn and become like children[c][b], you will certainly not enter the kingdom of heaven.”
translation:
  language: vi
  text: 'Ngài nói: “Tôi nói thật với anh em: nếu anh em không quay lại[a] và trở nên như trẻ em, thì chắc chắn anh em sẽ không vào được Nước Trời[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể hiểu là “được quay lại”; trong cách dùng truyền thống, động từ này đôi khi được dịch là “được hoán cải.”
    reason: alternative_reading
  - marker: b
    text: 'Nguyên văn Hy Lạp dùng lối phủ định nhấn mạnh; cũng có thể dịch: “anh em tuyệt nhiên sẽ không vào được Nước Trời.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀμὴν
  choice: Thật
  rationale: Công thức mở đầu trang trọng, xác nhận thẩm quyền của lời phán. “Thật” tự nhiên và dễ hiểu trong tiếng Việt hiện đại hơn việc phiên âm “A-men”.
- source_word: στραφῆτε
  choice: quay lại
  rationale: Động từ ở đây diễn tả một sự đổi hướng dứt khoát; “quay lại” giữ được sắc thái nội động, đồng thời không xác định quá mức tác nhân như cách dịch “được biến đổi”.
- source_word: γένησθε
  choice: trở nên
  rationale: Diễn đạt trực tiếp sự thay đổi trạng thái và kết hợp tự nhiên với “quay lại”.
- source_word: ὡς τὰ παιδία
  choice: như trẻ em
  rationale: Mạo từ Hy Lạp có thể chỉ trẻ em như một lớp người và cũng có thể gợi lại đứa trẻ trong ngữ cảnh gần. Tiếng Việt tự nhiên không cần dùng một từ tương đương với mạo từ; bản dịch không thêm phẩm chất như ngây thơ hay khiêm nhường.
- source_word: οὐ μὴ εἰσέλθητε
  choice: chắc chắn anh em sẽ không được vào
  rationale: Cấu trúc οὐ μή với động từ giả định là lời phủ định nhấn mạnh. “Chắc chắn… sẽ không” thể hiện rõ sức nặng ấy; “được vào” là cách nói tự nhiên trong tiếng Việt về việc vào một vương quốc.
- source_word: βασιλείαν τῶν οὐρανῶν
  choice: vương quốc thiên đàng
  rationale: Giữ cách diễn đạt đặc trưng của Ma-thi-ơ, đồng thời dùng cụm từ trang trọng, dễ hiểu trong tiếng Việt hiện đại.
theological_decisions:
- issue: Sắc thái giống ngôn ngữ hoán cải của στραφῆτε
  choice: Dịch là “quay lại”, không dùng một thuật ngữ thần học kỹ thuật.
  alternative: được hoán cải; được biến đổi
  rationale: Câu này đòi hỏi một sự đổi hướng dứt khoát, nhưng bản thân từ Hy Lạp không buộc phải mang nội hàm của một hệ thống thần học hay truyền thống giáo phái về sự hoán cải.
- issue: Ý nghĩa của việc trở nên như trẻ em
  choice: Giữ phép so sánh cụ thể “như trẻ em”.
  alternative: trở nên ngây thơ như trẻ em; trở nên khiêm nhường như trẻ em
  rationale: Câu này chưa nêu rõ phẩm chất nào của trẻ em được nhấn mạnh. Bản dịch giữ nguyên độ mở giải thích thay vì đưa một phẩm chất suy diễn vào chính văn.
- issue: Mức độ nhấn mạnh của điều kiện không được vào vương quốc
  choice: Thể hiện bằng “chắc chắn… sẽ không”.
  alternative: không bao giờ được vào
  rationale: Cách chọn giữ lực phủ định mạnh của οὐ μή mà không khiến câu nhất thiết mang sắc thái thời gian tuyệt đối hơn cấu trúc nguồn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” cho chủ thể là Chúa Giê-su theo ngữ cảnh, “tôi… anh em” để lời nói trực tiếp tự nhiên và có phẩm cách. Tránh thuật ngữ giáo phái; giữ nguyên sự căng thẳng giữa việc quay lại, trở nên như trẻ em và điều kiện vào vương quốc.
