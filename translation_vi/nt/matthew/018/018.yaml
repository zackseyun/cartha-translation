review_pass:
  verdict: revise
  source_fidelity: Bản dịch giữ đúng cấu trúc song hành, phạm vi khái quát của ὅσα ἐὰν, và cặp ẩn dụ δήσητε/λύσητε bằng “buộc/cởi”. Tuy nhiên, “sẽ là điều đã được buộc/cởi” là một lối diễn đạt gượng trong tiếng Việt và có thể khiến người đọc hiểu rằng chủ ngữ là “điều gì”, thay vì mệnh đề về tình trạng ở trên trời. Cách sửa vẫn biểu đạt ἔσται + phân từ hoàn thành bị động như một tình trạng tương lai mà điều đó đã được buộc/cởi ở trên trời.
  naturalness: “Dưới đất/trên trời” và “buộc/cởi” phù hợp văn phong Kinh Thánh tiếng Việt hiện đại. Việc thêm “ở trong tình trạng” làm rõ quan hệ cú pháp và thời-thể mà không biến ẩn dụ thành cách giải thích pháp lý như “cấm/cho phép”.
  terminology: Giữ “Quả thật”, “anh em”, “buộc”, “cởi”, “dưới đất”, và “trên trời” là nhất quán, trang trọng, và không áp đặt một cách hiểu giáo phái về thẩm quyền buộc/cởi. Chú thích nêu phương án truyền thống một cách cân bằng.
