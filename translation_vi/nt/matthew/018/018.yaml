source:
  edition: SBLGNT
  text: ἀμὴν λέγω ὑμῖν, ὅσα ⸀ἐὰν δήσητε ἐπὶ τῆς γῆς ἔσται δεδεμένα ⸀ἐν οὐρανῷ καὶ ὅσα ἐὰν λύσητε ἐπὶ τῆς γῆς ἔσται λελυμένα ⸁ἐν οὐρανῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/018.yaml
  text: Truly I tell you[a], whatever you bind on earth will have been bound in heaven, and whatever you loose on earth will have been loosed in heaven.
translation:
  language: vi
  text: '“Quả thật, tôi nói với anh em: bất cứ điều gì anh em buộc dưới đất sẽ ở trong tình trạng đã được buộc trên trời, và bất cứ điều gì anh em cởi dưới đất sẽ ở trong tình trạng đã được cởi trên trời.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch theo lối truyền thống: “sẽ được buộc trên trời… sẽ được cởi trên trời.” Tuy nhiên, tiếng Hy Lạp dùng động từ tương lai kết hợp với phân từ hoàn thành bị động; cách dịch trong câu chính có thể diễn tả một tình trạng đã được thiết lập trên trời.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀμὴν
  choice: Quả thật
  rationale: Diễn đạt lời khẳng định trang trọng mở đầu một lời tuyên bố có thẩm quyền, đồng thời tự nhiên và rõ nghĩa trong tiếng Việt hiện đại.
- source_word: λέγω ὑμῖν
  choice: tôi nói với anh em
  rationale: Giữ lời nói trực tiếp và thể số nhiều của ὑμῖν; “anh em” phù hợp với lời Chúa Giê-su nói với các môn đồ trong văn cảnh.
- source_word: ὅσα ἐὰν
  choice: bất cứ điều gì
  rationale: Thể hiện phạm vi bất định, khái quát của đại từ quan hệ đi với ἐάν mà không làm câu văn nặng nề.
- source_word: δήσητε
  choice: buộc
  rationale: Giữ hình ảnh cơ bản của δέω và cặp đối xứng với “cởi”, không thu hẹp nghĩa thành riêng “cấm” hay một hành vi pháp lý cụ thể.
- source_word: ἐπὶ τῆς γῆς
  choice: dưới đất
  rationale: Cách nói quen thuộc trong tiếng Việt Kinh Thánh để chỉ cõi trần, đối lập với “trên trời”; vẫn tự nhiên và dễ hiểu.
- source_word: ἔσται δεδεμένα
  choice: sẽ là điều đã được buộc
  rationale: Phản ánh cấu trúc động từ tương lai ἔσται kết hợp với phân từ hoàn thành bị động δεδεμένα, qua đó giữ ý về một tình trạng đã được thiết lập và còn hiệu lực.
- source_word: ἐν οὐρανῷ
  choice: trên trời
  rationale: Diễn đạt tự nhiên cõi trời, tương phản cân xứng với “dưới đất” trong tiếng Việt.
- source_word: λύσητε
  choice: cởi
  rationale: Giữ nghĩa hình ảnh của λύω và sự đối xứng trực tiếp với “buộc”, tránh giải thích trước thành riêng “cho phép” hay “tha”.
- source_word: ἔσται λελυμένα
  choice: sẽ là điều đã được cởi
  rationale: Giữ cùng cấu trúc tương lai kết hợp trạng thái hoàn thành như vế trước và bảo toàn tính song song của câu.
theological_decisions:
- issue: Giá trị thời gian và thần học của công thức buộc/cởi
  choice: Dịch “sẽ là điều đã được buộc/cởi trên trời”.
  alternative: “sẽ bị/được buộc/cởi trên trời” hoặc “sẽ được buộc/cởi trên trời”.
  rationale: Cấu trúc ἔσται cộng phân từ hoàn thành bị động có thể nhấn mạnh trạng thái đã được thiết lập. Bản dịch chính giữ nét này, nhưng chú thích cũng thừa nhận lối dịch tương lai bị động truyền thống; như vậy không quyết định thay văn bản một học thuyết riêng về thẩm quyền của cộng đồng hay về trình tự hành động giữa trời và đất.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Buộc/cởi” bảo toàn ẩn dụ cùng sự căng thẳng diễn giải của nguyên văn. Cặp “dưới đất/trên trời” tự nhiên trong ngữ vực Kinh Thánh tiếng Việt. Dấu ngoặc kép trình bày lời nói trực tiếp.
