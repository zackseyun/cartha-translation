    rationale: “Thiên đàng” trong tiếng Việt hiện đại thường có nghĩa là paradise và cụm từ này không phải cách chuyển đạt tự nhiên, chuẩn mực cho công thức Matthêu ἡ βασιλεία τῶν οὐρανῶν.
  - severity: medium
    issue: “các đầy tớ” làm bản văn chính cho δοῦλοι
    rationale: Trong dụ ngôn về vua tính sổ với người thuộc quyền, sắc thái nô lệ/lệ thuộc của δοῦλοι là nổi bật. Đưa “nô lệ” vào chú thích thay vì bản văn chính làm giảm nét nghĩa này.
  - severity: low
    issue: “thanh toán sổ sách”
    rationale: Cụm này thường gợi thanh toán các hóa đơn. “Tính sổ với” sát thành ngữ συνᾶραι λόγον hơn, vì diễn tả việc vua gọi các nô lệ đến quyết toán.
