revisions:
- from: Vì vậy, vương quốc thiên đàng được ví như một vị vua muốn thanh toán sổ sách với các đầy tớ[a] của mình.[b]
  to: Vì thế, Nước Trời được ví như một vị vua muốn tính sổ với các nô lệ[a] của mình.[b]
  rationale: Bản sửa thay thuật ngữ không tự nhiên “vương quốc thiên đàng” bằng “Nước Trời”, là cách gọi hiện đại chuẩn cho công thức Matthêu. “Nô lệ” được đặt trong bản văn chính để phản ánh δοῦλοι trong bối cảnh kinh tế–pháp lý của dụ ngôn, với các phương án nhẹ hơn được giữ trong chú thích. “Tính sổ” chuyển tải chính xác và tự nhiên thành ngữ quyết toán συνᾶραι λόγον. Chú thích b được rút gọn để nêu trực tiếp phương án từ vựng của ὡμοιώθη mà không lặp toàn câu.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T05:40:37Z'
review_pass:
  verdict: revise
  source_fidelity: Cần sửa vài chỗ để phản ánh sát hơn cách dùng của nguyên ngữ. Διὰ τοῦτο được chuyển đạt tốt bằng “Vì thế”. ὡμοιώθη được giữ đúng sắc thái bị động trong “được ví như”. Tuy nhiên, δοῦλοι trong bối cảnh vua chủ và việc tính sổ nên được dịch chính là “nô lệ”, thay vì hạ nhẹ thành “đầy tớ”. Thành ngữ συνᾶραι λόγον được diễn đạt tự nhiên và chính xác hơn bằng “tính sổ” thay cho “thanh toán sổ sách”, vốn dễ gợi việc trả hóa đơn hơn là gọi người thuộc quyền đến quyết toán.
  naturalness: “Vương quốc thiên đàng” không phải cách nói hiện đại tự nhiên và “thiên đàng” thường chỉ cõi phúc lạc hơn là công thức Matthêu về “các tầng trời”. “Nước Trời” là cách gọi tiếng Việt chuẩn, gọn và tự nhiên. “Tính sổ với các nô lệ của mình” rõ nghĩa trong văn cảnh dụ ngôn.
  terminology: Dùng “Nước Trời” cho ἡ βασιλεία τῶν οὐρανῶν. Dùng “nô lệ” cho δοῦλοι để biểu đạt địa vị bị sở hữu/lệ thuộc được ngữ cảnh làm nổi bật; chú thích bảo lưu “đầy tớ” và “tôi tớ” như các cách dịch khác.
