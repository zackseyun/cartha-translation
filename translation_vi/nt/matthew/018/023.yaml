  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Διὰ τοῦτο ὡμοιώθη ἡ βασιλεία τῶν οὐρανῶν ἀνθρώπῳ βασιλεῖ ὃς ἠθέλησεν συνᾶραι λόγον μετὰ τῶν δούλων αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/023.yaml
  text: For this reason the kingdom of heaven has become like a king who wanted to settle accounts with his servants[a][b].
translation:
  language: vi
  text: Vì thế, Nước Trời được ví như một vị vua muốn tính sổ với các nô lệ[a] của mình.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “đầy tớ” hoặc “tôi tớ”; tiếng Hy Lạp là “nô lệ” (δοῦλοι), nhấn mạnh địa vị lệ thuộc của họ dưới quyền vua.
    reason: alternative_reading
  - marker: b
    text: 'Hy Lạp: “được ví với” hoặc “được so sánh với.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: Vì vậy
  rationale: Diễn đạt tự nhiên sức nối kết nhân quả/suy luận với lời dạy ngay trước đó.
- source_word: ὡμοιώθη
  choice: được ví như
  rationale: Giữ sắc thái bị động của động từ aorist ὁμοιόω và diễn đạt phép so sánh bằng tiếng Việt tự nhiên.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: vương quốc thiên đàng
  rationale: Cách diễn đạt rõ ràng về quyền trị vì/vương quốc trong công thức đặc trưng của Ma-thi-ơ, đồng thời phù hợp tiếng Việt hiện đại.
- source_word: ἀνθρώπῳ βασιλεῖ
  choice: một vị vua
  rationale: βασιλεῖ giải thích người được nói đến là vua; tiếng Việt tự nhiên không cần dịch riêng ἀνθρώπῳ.
- source_word: ἠθέλησεν
  choice: muốn
  rationale: Chuyển tải trực tiếp ý muốn hoặc ý định của θέλω trong văn kể chuyện.
- source_word: συνᾶραι λόγον
  choice: thanh toán sổ sách
  rationale: Thành ngữ chỉ việc đối chiếu và giải quyết các khoản phải chịu trách nhiệm; giữ được bối cảnh tài chính mà vẫn dễ hiểu.
- source_word: μετὰ τῶν δούλων αὐτοῦ
  choice: với các đầy tớ của mình
  rationale: “Đầy tớ” tự nhiên trong bối cảnh cung đình nhưng có thể không biểu đạt trọn địa vị lệ thuộc của δοῦλοι; chú thích bảo lưu nghĩa mạnh hơn là “nô lệ”.
theological_decisions:
- issue: Cách dịch δοῦλος trong bối cảnh dụ ngôn về vua và việc quyết toán
  choice: đầy tớ
  alternative: nô lệ; tôi tớ
  rationale: “Đầy tớ” dễ hiểu và hợp văn cảnh một vị vua quản lý thuộc hạ, còn chú thích nêu rõ tiếng Hy Lạp có thể chỉ “nô lệ”, bảo lưu địa vị lệ thuộc mà không áp đặt một cách hiểu duy nhất.
- issue: Hình thức bị động của ὡμοιώθη
  choice: được ví như
  alternative: giống như
  rationale: Giữ sắc thái “được đem ra so sánh” của nguyên văn, thay vì làm phẳng thành một phát biểu đồng nhất đơn giản.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Vương quốc thiên đàng” giữ công thức đặc trưng của Ma-thi-ơ; “thanh toán sổ sách” chuyển tải thành ngữ tài chính συνᾶραι λόγον. Các dấu chú thích [a], [b] đều xuất hiện trong câu chính.
