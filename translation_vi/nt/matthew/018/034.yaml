id: MAT.18.34
reference: Matthew 18:34
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ὀργισθεὶς ὁ κύριος αὐτοῦ παρέδωκεν αὐτὸν τοῖς βασανισταῖς ἕως οὗ ἀποδῷ πᾶν τὸ ⸀ὀφειλόμενον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/034.yaml
  text: And in anger his master handed him over to the torturers until he should pay all that was owed[a][b].
translation:
  language: vi
  text: Và trong cơn giận, ông chủ anh ta giao anh ta cho những kẻ tra tấn, cho đến khi anh ta trả hết tất cả những gì còn nợ.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “Chúa”. Từ Hy Lạp là kyrios; ở đây từ này chỉ người chủ của đầy tớ trong câu chuyện ẩn dụ, nên bản văn chính dùng “ông chủ”.
    reason: alternative_reading
  - marker: b
    text: Cũng có thể dịch là “những kẻ hành hạ”, hoặc nhẹ nghĩa hơn là “cai ngục”. Từ Hy Lạp chỉ những người gây đau đớn hoặc tra tấn, chứ không đơn thuần là lính canh ngục.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀργισθεὶς
  choice: trong cơn giận
  rationale: Phân từ bất định thụ động được dùng theo chức năng trạng ngữ; cách diễn đạt này tự nhiên trong tiếng Việt và giữ được sắc thái cảm xúc dẫn đến hành động chính.
- source_word: κύριος
  choice: chủ
  rationale: Trong câu chuyện ẩn dụ, từ này chỉ người chủ của đầy tớ; “chủ” phù hợp quan hệ trong truyện hơn “Chúa” và không áp đặt một tước hiệu thần học vào lời kể.
- source_word: παρέδωκεν
  choice: giao ... cho
  rationale: Giữ ý trao một người vào quyền kiểm soát của những người khác, đồng thời phù hợp sắc thái tư pháp trong ngữ cảnh.
- source_word: βασανισταῖς
  choice: những kẻ tra tấn
  rationale: Danh từ chỉ những người gây đau đớn hoặc tra khảo, mạnh hơn ý “cai ngục” thông thường; lựa chọn này giữ nguyên mức độ nghiêm khắc của tiếng Hy Lạp.
- source_word: ἕως οὗ
  choice: cho đến khi
  rationale: Thể hiện trực tiếp mốc kết thúc dự liệu của hành động.
- source_word: ἀποδῷ
  choice: trả
  rationale: Động từ ở thức giả định sau ἕως οὗ chỉ một điểm kết thúc được dự liệu; cấu trúc “cho đến khi ... trả” diễn đạt tự nhiên sắc thái ấy trong tiếng Việt.
- source_word: πᾶν τὸ ὀφειλόμενον
  choice: hết mọi khoản còn nợ
  rationale: Phản ánh toàn bộ điều đang mắc nợ mà không thu hẹp thành một loại nợ cụ thể; “khoản” giúp câu tiếng Việt rõ và tự nhiên trong bối cảnh tiền nợ.
theological_decisions:
- issue: Có nên dịch κύριος theo tước hiệu thần học “Chúa” hay theo vai trò trong câu chuyện
  choice: chủ
  alternative: Chúa
  rationale: Ở cấp độ lời kể, κύριος là người chủ của đầy tớ. Dịch “chủ” giữ đúng vai trò trong ẩn dụ và vẫn để ngỏ ý nghĩa thần học của toàn câu chuyện, thay vì xác định ngay nhân vật bằng một tước hiệu.
- issue: Mức độ nghiêm khắc của βασανισταῖς trong bối cảnh phán xét của ẩn dụ
  choice: những kẻ tra tấn
  alternative: những kẻ hành hạ; cai ngục
  rationale: “Những kẻ tra tấn” giữ sức nặng từ vựng của nguyên văn. “Cai ngục” làm nhẹ nghĩa, còn câu này tự nó không giải quyết những câu hỏi giáo lý rộng hơn về hình phạt chung cuộc.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “người ấy” để tránh lặp đại từ thiếu rõ ràng; giữ nhịp câu gần nguyên văn và giữ nguyên tính nghiêm khắc, cùng sự căng thẳng thần học, của câu ẩn dụ.
