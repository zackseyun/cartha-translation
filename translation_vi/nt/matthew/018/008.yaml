id: MAT.18.8
reference: Matthew 18:8
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Εἰ δὲ ἡ χείρ σου ἢ ὁ πούς σου σκανδαλίζει σε, ἔκκοψον ⸀αὐτὸν καὶ βάλε ἀπὸ σοῦ· καλόν σοί ἐστιν εἰσελθεῖν εἰς τὴν ζωὴν ⸂κυλλὸν ἢ χωλόν⸃, ἢ δύο χεῖρας ἢ δύο πόδας ἔχοντα βληθῆναι εἰς τὸ πῦρ τὸ αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/008.yaml
  text: And if your hand or your foot causes you to stumble[a], cut it off and throw it away from you. It is better for you to enter into life maimed or lame than, having two hands or two feet, to be thrown into the eternal fire.
translation:
  language: vi
  text: Nếu tay hay chân con làm con vấp ngã[a], hãy chặt nó đi và vứt bỏ nó khỏi mình. Thà con cụt một tay hoặc què một chân mà vào sự sống còn hơn là có hai tay hoặc hai chân mà bị ném vào lửa đời đời.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “khiến con phạm tội.” Động từ Hy Lạp theo nghĩa đen gợi hình ảnh làm cho vấp ngã.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σκανδαλίζει
  choice: làm con vấp ngã
  rationale: Giữ hình ảnh vấp ngã của động từ Hy Lạp, đồng thời chú thích nghĩa luân lý có thể được hiểu là khiến phạm tội.
- source_word: ἔκκοψον
  choice: hãy chặt nó đi
  rationale: Mệnh lệnh mạnh và cụ thể, phù hợp với tay hoặc chân.
- source_word: βάλε ἀπὸ σοῦ
  choice: ném xa khỏi con
  rationale: Diễn đạt tự nhiên hành động mạnh mẽ loại bỏ và tách vật ấy khỏi mình.
- source_word: καλόν σοί ἐστιν
  choice: thà ... còn hơn
  rationale: Cấu trúc so sánh tiếng Việt truyền đạt tự nhiên ý 'tốt hơn cho con' trong ngữ cảnh.
- source_word: εἰσελθεῖν εἰς τὴν ζωὴν
  choice: vào sự sống
  rationale: Giữ nguyên danh từ 'sự sống' mà không tự thêm 'đời đời'; ý nghĩa cánh chung được thể hiện qua sự tương phản trong câu.
- source_word: κυλλὸν
  choice: cụt tay
  rationale: Trong ngữ cảnh vừa nói đến việc chặt tay, cách diễn đạt này cụ thể và tự nhiên hơn từ khái quát chỉ tình trạng tàn tật.
- source_word: χωλόν
  choice: què chân
  rationale: Diễn đạt trực tiếp tình trạng mất khả năng đi đứng bình thường liên quan đến chân trong ngữ cảnh.
- source_word: ἔχοντα
  choice: có đủ
  rationale: Chuyển đạt phân từ 'có' và làm rõ sự tương phản với tình trạng cụt tay hoặc què chân, không thay đổi ý nghĩa cơ bản.
- source_word: βληθῆναι
  choice: bị ném
  rationale: Giữ thể bị động và sức mạnh của động từ βάλλω.
- source_word: τὸ πῦρ τὸ αἰώνιον
  choice: lửa đời đời
  rationale: Cách diễn đạt trang trọng, quen thuộc và sát nghĩa trong ngữ cảnh phán xét.
theological_decisions:
- issue: Nên đạo đức hóa σκανδαλίζει thành 'khiến phạm tội' hay giữ ẩn dụ vấp ngã
  choice: làm con vấp ngã
  alternative: khiến con phạm tội
  rationale: Bản văn Hy Lạp giữ hình ảnh vấp ngã; chú thích nêu nghĩa luân lý mà không làm phẳng hình ảnh trong chính văn.
- issue: Ý nghĩa của 'sự sống' trong εἰς τὴν ζωὴν
  choice: giữ 'sự sống'
  alternative: sự sống đời đời
  rationale: Ngữ cảnh mang ý nghĩa cánh chung, nhưng nguyên văn chỉ nói 'sự sống'; không nên tự thêm từ.
- issue: Tính chất của mệnh lệnh tự cắt bỏ chi thể
  choice: dịch trực tiếp, không làm nhẹ hoặc giải quyết đó là lối nói cường điệu
  alternative: diễn giải thành lời kêu gọi dứt khoát từ bỏ tội lỗi
  rationale: Giữ nguyên sức nặng và sự căng thẳng của hình ảnh trong lời phán.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng đại từ 'con' phù hợp lời Chúa Giê-su trực tiếp dạy môn đồ; cấu trúc 'thà... còn hơn...' tạo sự tương phản tự nhiên. Chính văn giữ hình ảnh mạnh và không thêm lời giải thích giáo phái.
