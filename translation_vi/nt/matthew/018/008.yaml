review_pass:
  verdict: revise
  source_fidelity: Bản dịch phản ánh đúng cấu trúc điều kiện, hai mệnh lệnh mạnh, sự đối lập giữa vào sự sống và bị ném vào lửa đời đời. Tuy nhiên, «có đủ hai tay hoặc hai chân» thêm nét nghĩa «đủ» không được nêu rõ trong ἔχοντα; chỉ cần «có hai tay hoặc hai chân». «Ném xa khỏi con» hiểu đúng ἀπὸ σοῦ nhưng hơi gượng trong tiếng Việt hiện đại; «vứt bỏ nó khỏi mình» truyền đạt rõ hành động loại bỏ và sự tách khỏi bản thân.
  naturalness: Câu nhìn chung tự nhiên và giữ được sắc thái nghiêm trang. Bản chỉnh sửa thay «ném xa khỏi con» bằng cách nói Việt ngữ thông dụng hơn, đồng thời dùng «một tay/một chân» để diễn đạt mạch lạc sự tương phản sau mệnh lệnh chặt bỏ.
  terminology: «làm con vấp ngã» và chú thích giữ được ẩn dụ của σκανδαλίζω mà không áp đặt cách hiểu «phạm tội». «sự sống» không bị mở rộng thành «sự sống đời đời»; «lửa đời đời» phù hợp với τὸ πῦρ τὸ αἰώνιον. «Cụt một tay hoặc què một chân» là cách diễn đạt theo ngữ cảnh cho κυλλὸν ἢ χωλόν, không biến câu thành một giải thích giáo lý.
  issues:
  - severity: low
    issue: «có đủ hai tay hoặc hai chân» thêm từ «đủ».
    rationale: ἔχοντα chỉ nói «có/đang có» hai tay hoặc hai chân. Sự tương phản đã do ngữ cảnh tạo nên; «đủ» là một tăng cường không cần thiết.
  - severity: low
    issue: «ném xa khỏi con» hơi không tự nhiên.
    rationale: Cụm này truyền đạt ý tách xa, nhưng «vứt bỏ nó khỏi mình» tự nhiên hơn trong tiếng Việt hiện đại và vẫn phản ánh βάλε ἀπὸ σοῦ.
  revised_text: Nếu tay hay chân con làm con vấp ngã[a], hãy chặt nó đi và vứt bỏ nó khỏi mình. Thà con cụt một tay hoặc què một chân mà vào sự sống còn hơn là có hai tay hoặc hai chân mà bị ném vào lửa đời đời.
  revised_footnotes:
