revisions:
- from: Nếu tay hay chân con làm con vấp ngã[a], hãy chặt nó đi và ném xa khỏi con. Thà con cụt tay hoặc què chân mà vào sự sống còn hơn là có đủ hai tay hoặc hai chân mà bị ném vào lửa đời đời.
  to: Nếu tay hay chân con làm con vấp ngã[a], hãy chặt nó đi và vứt bỏ nó khỏi mình. Thà con cụt một tay hoặc què một chân mà vào sự sống còn hơn là có hai tay hoặc hai chân mà bị ném vào lửa đời đời.
  rationale: Chỉnh sửa tối thiểu để tránh thêm sắc thái «đủ», cải thiện độ tự nhiên của mệnh lệnh thứ hai, và vẫn giữ nguyên hình ảnh nghiêm khắc, thể bị động, cùng tính mơ hồ diễn giải của nguyên văn.
