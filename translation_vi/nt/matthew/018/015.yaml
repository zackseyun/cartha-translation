revisions:
- from: Nhưng nếu anh em của con phạm tội nghịch cùng con[a], hãy đi chỉ ra lỗi của người ấy, chỉ giữa con với người ấy mà thôi. Nếu người ấy nghe con, con đã được lại anh em mình.
  to: Nhưng nếu người anh em của bạn phạm tội với bạn[a], hãy đi chỉ ra lỗi của người ấy, chỉ giữa bạn với người ấy thôi. Nếu người ấy nghe bạn, bạn đã thu phục được người anh em ấy.
  rationale: Bản sửa thay đại từ “con” bằng “bạn” để phản ánh ngôi thứ hai không đánh dấu giới tính của tiếng Hy Lạp trong tiếng Việt hiện đại. “Với bạn” truyền đạt εἰς σέ mà không dùng lối nói cổ. “Thu phục được” giữ hình ảnh κερδαίνω về việc giành được người anh em, tránh thêm ý phục hồi vốn không có trong động từ. Chú thích dị bản được giữ tại đúng vị trí của cụm từ bị tranh luận.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T05:40:36Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch giữ đúng cấu trúc điều kiện, mệnh lệnh gặp riêng, và kết quả khi người anh em đáp lại. Tuy nhiên, “con” không có cơ sở trong nguyên văn và tạo sai lệch ngôi xưng hô: Chúa Giê-su đang nói với các môn đồ, không phải lời cầu nguyện hay lời nói trực tiếp với Đức Chúa Trời. “Được lại” thêm ý ‘trở lại/khôi phục’ không được κερδαίνω nêu rõ. Cụm “nghịch cùng” vừa cổ vừa kém tự nhiên trong tiếng Việt hiện đại.'
  naturalness: “Anh em của con” và việc lặp “con” không tự nhiên trong ngữ cảnh này. “Phạm tội với bạn,” “chỉ giữa bạn với người ấy thôi,” và “thu phục được người anh em ấy” là tiếng Việt hiện đại, rõ nghĩa, đồng thời giữ được sắc thái của câu.
  terminology: Giữ “phạm tội” cho ἁμαρτήσῃ và “người anh em” cho ἀδελφός, không mở rộng bản chính thành “anh chị em” hay “người cùng đức tin.” “Thu phục được” diễn đạt κερδαίνω như việc giành được người anh em về lại mối quan hệ đúng đắn mà không thêm tiền tố ‘lại’.
  issues:
  - severity: medium
    issue: Đại từ “con” được đưa vào toàn câu.
    rationale: Nguyên văn dùng đại từ ngôi hai số ít, không xác định là lời của một người con với cha. Trong văn cảnh, “con” gây lệch vai giao tiếp và không phù hợp với tiếng Việt hiện đại.
  - severity: medium
    issue: “Đã được lại anh em mình” thêm sắc thái ‘lại’.
    rationale: ἐκέρδησας có nghĩa là ‘đã đạt được/thu phục được’; nguyên văn không có yếu tố tương đương với ‘lại’.
  - severity: low
    issue: “Nghịch cùng” có sắc thái cổ và không tự nhiên.
    rationale: εἰς σέ chỉ hành vi phạm tội nhắm vào người nghe; “phạm tội với bạn” diễn đạt rõ và tự nhiên hơn trong tiếng Việt hiện đại.
  revised_text: Nhưng nếu người anh em của bạn phạm tội với bạn[a], hãy đi chỉ ra lỗi của người ấy, chỉ giữa bạn với người ấy thôi. Nếu người ấy nghe bạn, bạn đã thu phục được người anh em ấy.
