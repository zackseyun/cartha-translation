id: MAT.18.15
reference: Matthew 18:15
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἐὰν δὲ ἁμαρτήσῃ ⸂εἰς σὲ⸃ ὁ ἀδελφός σου, ⸀ὕπαγε ἔλεγξον αὐτὸν μεταξὺ σοῦ καὶ αὐτοῦ μόνου. ἐάν σου ἀκούσῃ, ἐκέρδησας τὸν ἀδελφόν σου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/015.yaml
  text: But if your brother sins against you[a], go and reprove him between you and him alone. If he listens to you[c][b], you have gained your brother.
translation:
  language: vi
  text: Nhưng nếu người anh em của bạn phạm tội với bạn[a], hãy đi chỉ ra lỗi của người ấy, chỉ giữa bạn với người ấy thôi. Nếu người ấy nghe bạn, bạn đã thu phục được người anh em ấy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Một số thủ bản không có cụm “với bạn,” nên câu được đọc là: “Nếu người anh em của bạn phạm tội, hãy đi chỉ ra lỗi của người ấy, chỉ giữa bạn với người ấy thôi.”'
    reason: textual_variant
lexical_decisions:
- source_word: ἁμαρτήσῃ
  choice: phạm tội
  rationale: Giữ rõ sắc thái đạo đức và tôn giáo của ἁμαρτάνω; thể giả định sau ἐὰν được diễn đạt tự nhiên bằng mệnh đề điều kiện tiếng Việt.
- source_word: εἰς σέ
  choice: nghịch cùng con
  rationale: Diễn đạt hành vi phạm tội hướng đến người nghe và giữ cụm từ có trong SBLGNT; dị bản lược bỏ được ghi ở chú thích.
- source_word: ὁ ἀδελφός σου
  choice: anh em của con
  rationale: Giữ hình thức giống đực số ít của tiếng Hy Lạp, đồng thời dùng cách gọi quen thuộc trong cộng đồng môn đồ; phạm vi áp dụng rộng hơn được nêu trong chú thích.
- source_word: ὕπαγε
  choice: hãy đi
  rationale: Mệnh lệnh ngắn gọn, tự nhiên, phù hợp với động tác mở đầu được yêu cầu.
- source_word: ἔλεγξον
  choice: chỉ ra lỗi của người ấy
  rationale: Thể hiện ý vạch rõ và khiến người có lỗi nhận biết lỗi, không mang sắc thái quá gay gắt như một số cách dịch tương đương.
- source_word: μεταξὺ σοῦ καὶ αὐτοῦ μόνου
  choice: chỉ giữa con với người ấy mà thôi
  rationale: Giữ cả ý riêng tư lẫn tính loại trừ được nhấn mạnh bởi μόνου.
- source_word: ἀκούσῃ
  choice: nghe con
  rationale: Giữ được độ mở giữa nghe và nghe theo, không diễn giải quá mức thành vâng lời.
- source_word: ἐκέρδησας
  choice: đã được lại
  rationale: Giữ ẩn dụ đạt được một người anh em trong bối cảnh phục hồi quan hệ; chữ 'lại' làm câu tiếng Việt tự nhiên nhưng không khẳng định chi tiết ngoài ngữ cảnh.
theological_decisions:
- issue: Phạm vi của ἀδελφός trong cộng đồng môn đồ
  choice: anh em của con
  alternative: một người cùng đức tin; anh chị em của con
  rationale: Bản chính giữ hình thức giống đực số ít của nguyên văn, không tự ý thay bằng cách diễn giải bao quát; chú thích cho biết từ này trong ngữ cảnh có thể chỉ rộng hơn đến một môn đồ đồng đạo.
- issue: Tình trạng văn bản của εἰς σέ
  choice: đưa 'nghịch cùng con' vào bản chính
  alternative: lược bỏ, đọc là 'nếu anh em của con phạm tội'
  rationale: SBLGNT được cung cấp có cụm εἰς σέ. Vì dị bản này ảnh hưởng đáng kể đến phạm vi của lời chỉ dẫn, cách đọc ngắn hơn được bảo tồn trong chú thích.
- issue: Sắc thái của κερδαίνω
  choice: con đã được lại anh em mình
  alternative: con đã chinh phục được anh em mình; con đã giành lại được anh em mình
  rationale: Giữ ẩn dụ 'được/thu được' nhưng tránh sắc thái thắng-thua của 'chinh phục'; 'được lại' phù hợp với tiến trình hòa giải mà không biến câu thành một tuyên bố giáo lý chi tiết.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “con” theo ngữ cảnh Đức Giê-su trực tiếp dạy các môn đồ; tránh từ quá cổ hoặc quá chuyên biệt. Các dấu chú thích đều được đặt trong bản chính tại vị trí liên quan.
