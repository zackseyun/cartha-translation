id: MAT.18.19
reference: Matthew 18:19
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Πάλιν ⸀ἀμὴν λέγω ὑμῖν ὅτι ἐὰν δύο ⸂συμφωνήσωσιν ἐξ ὑμῶν⸃ ἐπὶ τῆς γῆς περὶ παντὸς πράγματος οὗ ἐὰν αἰτήσωνται, γενήσεται αὐτοῖς παρὰ τοῦ πατρός μου τοῦ ἐν οὐρανοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/019.yaml
  text: Again[a], truly I tell you, if two of you agree on earth about any matter they ask for[c][b], it will be done for them by my Father in heaven.
translation:
  language: vi
  text: 'Lại nữa, quả thật, tôi nói với anh em rằng: Nếu hai người trong anh em đồng lòng với nhau trên đất về bất cứ điều gì mà họ cầu xin,[a] thì Cha tôi ở trên trời[b] sẽ làm điều ấy cho họ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Trong văn cảnh, lời này tiếp nối sự dạy dỗ của Đức Giê-su về thẩm quyền và việc sửa lỗi trong cộng đồng (18:15–18), dù chính câu này nói rộng về những điều được đồng lòng cầu xin.
    reason: cross_reference
  - marker: b
    text: Nguyên văn Hy Lạp là “trong các tầng trời”; ở đây được dịch theo cách nói tự nhiên là “trên trời”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πάλιν
  choice: Một lần nữa
  rationale: Diễn tả việc Đức Giê-su tiếp tục hoặc nhắc thêm một lời long trọng có liên hệ với lời dạy ngay trước đó.
- source_word: ἀμὴν λέγω ὑμῖν
  choice: thật vậy, tôi nói với anh em
  rationale: Chuyển tải công thức khẳng định long trọng của Đức Giê-su bằng tiếng Việt hiện đại, rõ ràng, không cần phiên âm từ ἀμήν.
- source_word: ἐὰν δύο συμφωνήσωσιν ἐξ ὑμῶν
  choice: nếu hai người trong anh em ... đồng lòng
  rationale: συμφωνέω chỉ sự đồng thuận; ἐξ ὑμῶν được thể hiện tự nhiên là “trong anh em”.
- source_word: ἐπὶ τῆς γῆς
  choice: ở trên đất
  rationale: Giữ nguyên phạm vi trần thế và sự đối chiếu với Cha ở trên trời.
- source_word: περὶ παντὸς πράγματος
  choice: về bất cứ việc gì
  rationale: πρᾶγμα có nghĩa rộng là sự việc hoặc vấn đề; cách dịch này tự nhiên và không thu hẹp phạm vi của câu.
- source_word: οὗ ἐὰν αἰτήσωνται
  choice: họ cầu xin
  rationale: Trong văn cảnh hướng về Đức Chúa Trời, αἰτέω được diễn đạt tự nhiên là “cầu xin”, đồng thời giữ đối tượng lời cầu xin ở dạng rộng.
- source_word: γενήσεται αὐτοῖς παρὰ τοῦ πατρός μου
  choice: Cha tôi ... sẽ làm điều ấy cho họ
  rationale: Diễn đạt tự nhiên kết quả sẽ đến với họ từ hành động của Cha; παρά với sở hữu cách có thể chỉ nguồn hoặc tác nhân.
- source_word: τοῦ ἐν οὐρανοῖς
  choice: ở trên trời
  rationale: Số nhiều οὐρανοῖς được chuyển sang cách nói tiếng Việt thông dụng “trên trời”.
theological_decisions:
- issue: Phạm vi của lời hứa trong văn cảnh
  choice: Dịch lời tuyên bố theo nghĩa rộng của chính câu văn, đồng thời ghi chú mối liên hệ với thẩm quyền và kỷ luật cộng đồng trong 18:15–18.
  alternative: Giới hạn minh nhiên lời này vào các quyết định kỷ luật của hội chúng, hoặc mở rộng thành lời bảo đảm vô điều kiện cho mọi lời cầu xin.
  rationale: Văn cảnh gần nói về việc sửa lỗi và thẩm quyền của cộng đồng, nhưng bản thân câu này dùng ngôn ngữ rộng về sự đồng lòng và cầu xin. Bản dịch không thêm điều kiện hay mở rộng giáo lý mà nguyên văn không nói rõ.
- issue: Nguồn hay tác nhân trong παρὰ τοῦ πατρός μου
  choice: 'Diễn đạt Cha là Đấng thực hiện: “Cha tôi ... sẽ làm”.'
  alternative: 'Dịch theo nguồn: “điều ấy sẽ đến với họ từ Cha tôi”.'
  rationale: Cả sắc thái nguồn và tác nhân đều có thể hiện diện; cách diễn đạt đã chọn tự nhiên trong tiếng Việt và phù hợp với γενήσεται mà không thay đổi trọng tâm thần học.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh em” cho đại từ số nhiều ὑμῖν theo lối xưng hô cộng đồng; giữ cấu trúc điều kiện và tính rộng của lời hứa, không thêm giới hạn giáo phái.
