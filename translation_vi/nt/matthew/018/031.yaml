id: MAT.18.31
reference: Matthew 18:31
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἰδόντες ⸀οὖν οἱ σύνδουλοι αὐτοῦ τὰ γενόμενα ἐλυπήθησαν σφόδρα, καὶ ἐλθόντες διεσάφησαν τῷ κυρίῳ ἑαυτῶν πάντα τὰ γενόμενα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/031.yaml
  text: Therefore[a], when his fellow servants saw what had happened, they were deeply grieved[b], and they came and reported to their lord everything that had happened.
translation:
  language: vi
  text: Vì vậy, khi những nô lệ cùng chủ với anh ta[a] thấy những việc đã xảy ra, họ vô cùng đau buồn. Họ đến trình bày tường tận với chủ của mình[b] mọi việc đã xảy ra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn là “các đồng nô lệ”: những người cùng mang thân phận nô lệ dưới một chủ.'
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “chủ nhân”. Từ Hy Lạp này có nghĩa là người có quyền chủ đối với họ; ở đây chỉ người chủ trong dụ ngôn.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Vì vậy
  rationale: Giữ sắc thái nối kết và suy luận từ diễn biến ngay trước đó, đồng thời tự nhiên trong văn kể tiếng Việt.
- source_word: σύνδουλοι αὐτοῦ
  choice: những người cùng làm nô lệ với anh ta
  rationale: σύνδουλοι chỉ những người có cùng thân phận nô lệ dưới một chủ. Cách diễn đạt này rõ nghĩa và tự nhiên hơn từ ghép ít thông dụng “đồng nô lệ”, đồng thời không làm nhẹ sắc thái của nhóm từ δοῦλος.
- source_word: τὰ γενόμενα / πάντα τὰ γενόμενα
  choice: chuyện đã xảy ra / mọi việc đã xảy ra
  rationale: Diễn đạt tự nhiên phân từ được danh từ hóa của γίνομαι; πάντα ở lần thứ hai được thể hiện bằng “mọi việc” để giữ ý bao quát tăng cường.
- source_word: ἐλυπήθησαν σφόδρα
  choice: vô cùng đau buồn
  rationale: λυπέω diễn tả nỗi buồn hoặc đau lòng, còn σφόδρα nhấn mạnh mức độ; bản dịch giữ đầy đủ sức nặng cảm xúc mà không thêm ý.
- source_word: ἐλθόντες
  choice: Họ đến
  rationale: Chuyển phân từ bất định quá khứ chỉ hành động đi kèm thành động từ hữu hạn, phù hợp trình tự kể chuyện tự nhiên trong tiếng Việt.
- source_word: διεσάφησαν
  choice: thuật lại cặn kẽ
  rationale: Động từ mang nghĩa báo cáo hoặc trình bày rõ ràng, đầy đủ; “thuật lại cặn kẽ” giữ sắc thái chi tiết hơn từ “báo lại” đơn thuần.
- source_word: τῷ κυρίῳ ἑαυτῶν
  choice: cho chủ mình
  rationale: Trong bối cảnh dụ ngôn nói về một người có các nô lệ, “chủ” là cách gọi tự nhiên và chính xác cho κύριος; đại từ phản thân ἑαυτῶν được thể hiện bằng “mình”.
theological_decisions:
- issue: Cách dịch từ thuộc nhóm δοῦλος trong bối cảnh xã hội của dụ ngôn
  choice: những người cùng làm nô lệ với anh ta
  alternative: các bạn cùng phục vụ với anh ta; các đồng nô lệ của anh ta
  rationale: Thân phận lệ thuộc chung dưới cùng một chủ có vai trò trong logic của dụ ngôn. “Nô lệ” giữ sắc thái nguồn, còn cấu trúc diễn giải giúp câu dễ hiểu trong tiếng Việt hiện đại.
- issue: Cách dịch κύριος khi chỉ người bề trên trong dụ ngôn
  choice: chủ
  alternative: chúa; ông chủ
  rationale: Nhân vật ở đây là người chủ của các nô lệ, nên “chủ” phù hợp ngữ cảnh và không khiến người đọc lầm tưởng danh xưng trực tiếp chỉ Đức Chúa Trời. Bản dịch vẫn giữ quan hệ quyền chủ được κύριος biểu thị.
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “anh ta” cho nhân vật nô lệ đã được nhắc đến, “chủ mình” cho quan hệ của cả nhóm với người chủ. Hai dấu chú thích [a], [b] đều xuất hiện đúng vị trí trong chính văn.
