id: MAT.18.20
reference: Matthew 18:20
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οὗ γάρ εἰσιν δύο ἢ τρεῖς συνηγμένοι εἰς τὸ ἐμὸν ὄνομα, ἐκεῖ εἰμι ἐν μέσῳ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/020.yaml
  text: For where two or three are gathered in my name[a], there I am in their midst.
translation:
  language: vi
  text: Vì nơi nào có hai hoặc ba người tụ họp nhân danh tôi, thì tôi ở đó, giữa họ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “ở cùng họ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗ
  choice: nơi nào
  rationale: Diễn đạt tự nhiên mệnh đề chỉ nơi chốn và kết hợp rõ với ἐκεῖ (“ở đó”); không mở rộng quá mức thành “bất cứ nơi nào”.
- source_word: γάρ
  choice: vì
  rationale: Giữ chức năng giải thích, nối lời này với văn cảnh ngay trước đó.
- source_word: δύο ἢ τρεῖς
  choice: hai hoặc ba người
  rationale: Giữ nguyên con số; thêm “người” theo cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: συνηγμένοι
  choice: tụ họp
  rationale: Diễn đạt trạng thái cùng quy tụ của phân từ hoàn thành bị động mà không khiến câu tiếng Việt trở nên nặng nề; không xác định ai là tác nhân tập hợp.
- source_word: εἰς τὸ ἐμὸν ὄνομα
  choice: nhân danh tôi
  rationale: Là cách nói tiếng Việt tự nhiên, hàm ý quy tụ với sự quy chiếu đến danh, thẩm quyền hoặc lòng trung thành với Chúa Giê-su, nhưng không giải nghĩa quá mức trong chính văn.
- source_word: ἐκεῖ
  choice: ở đó
  rationale: Tương ứng với οὗ (“nơi nào… ở đó”), giữ cấu trúc định vị của câu Hy Lạp.
- source_word: εἰμι
  choice: tôi ở
  rationale: Trong tiếng Việt, “tôi ở đó” truyền đạt tự nhiên động từ tồn tại/hiện diện trong ngữ cảnh nơi chốn, đồng thời tránh thêm từ giải nghĩa như “hiện diện”.
- source_word: ἐν μέσῳ αὐτῶν
  choice: giữa họ
  rationale: Giữ hình ảnh không gian của nguyên văn; “ở giữa họ” hoặc “ở cùng họ” cũng có thể truyền đạt ý nghĩa gần tương đương.
theological_decisions:
- issue: Hàm ý Kitô học về sự hiện diện của Chúa Giê-su giữa các môn đồ tụ họp
  choice: Dịch trực tiếp rằng Chúa Giê-su ở đó, giữa những người tụ họp nhân danh ngài.
  alternative: Giải nghĩa thành “tôi hiện diện với họ,” hoặc gắn câu này với một quan niệm bí tích hay giáo hội học cụ thể.
  rationale: Câu Hy Lạp khẳng định sự hiện diện của Chúa Giê-su nhưng không xác định cách thức siêu hình của sự hiện diện ấy; bản dịch không nên du nhập lập trường hệ phái.
- issue: Ý nghĩa của εἰς τὸ ἐμὸν ὄνομα
  choice: Giữ thành ngữ “nhân danh tôi” trong chính văn.
  alternative: Diễn giải là “dưới thẩm quyền của tôi,” “vì tôi,” hoặc “trong lòng trung thành với tôi.”
  rationale: Cụm Hy Lạp có thể bao hàm nhiều sắc thái liên hệ đến danh, thẩm quyền và sự quy thuộc. Thành ngữ tiếng Việt giữ được độ mở thần học thay vì chọn duy nhất một cách giải thích.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Cấu trúc “nơi nào… thì… ở đó” giữ mối tương quan định vị của nguyên văn; “tụ họp” tự nhiên hơn một cấu trúc bị động nặng nề.
