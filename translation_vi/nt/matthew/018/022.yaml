  source_fidelity: 'Bản dịch phản ánh đúng cấu trúc đối lập của câu Hy Lạp: không phải bảy lần mà là cụm số ἑβδομηκοντάκις ἑπτά. Việc bổ sung động từ “tha” được ngữ cảnh ngay trước đó (18:21) chi phối và giúp tiếng Việt rõ nghĩa. Cách dịch chính “bảy mươi bảy lần” là một cách đọc có cơ sở; chú thích giữ cách hiểu thay thế “bảy mươi lần bảy,” nên không giải quyết tính mơ hồ của nguyên ngữ theo một hướng giáo lý.'
