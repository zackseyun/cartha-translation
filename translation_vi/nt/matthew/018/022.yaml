id: MAT.18.22
reference: Matthew 18:22
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: λέγει αὐτῷ ὁ Ἰησοῦς· Οὐ λέγω σοι ἕως ἑπτάκις ἀλλὰ ἕως ἑβδομηκοντάκις ἑπτά.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/022.yaml
  text: Jesus says to him[a], “I do not say to you, up to seven times, but up to seventy times seven.
translation:
  language: vi
  text: 'Đức Giê-su nói với ông: “Thầy không bảo con chỉ tha đến bảy lần, nhưng đến bảy mươi bảy lần[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “bảy mươi lần bảy.”'
    reason: Cụm từ Hy Lạp có thể được hiểu là “bảy mươi bảy lần” hoặc “bảy mươi lần bảy”; chú thích bảo tồn cách đọc thay thế.
lexical_decisions:
- source_word: λέγει αὐτῷ ὁ Ἰησοῦς
  choice: Đức Giê-su nói với ông
  rationale: Dịch sát cấu trúc Hy Lạp và giữ đại từ chỉ Phê-rô theo ngữ cảnh. Tiếng Việt không bắt buộc biểu thị sự đối lập giữa hiện tại lịch sử và quá khứ trong hình thức động từ, nên “nói” vừa tự nhiên vừa không thêm sắc thái thời gian không cần thiết.
- source_word: Οὐ λέγω σοι
  choice: Thầy không bảo con
  rationale: Các đại từ xưng hô “Thầy—con” phù hợp quan hệ giữa Chúa Giê-su và môn đồ trong tiếng Việt hiện đại. “Bảo” diễn đạt tự nhiên hành vi nói trực tiếp với người nghe.
- source_word: ἕως ἑπτάκις
  choice: chỉ tha đến bảy lần
  rationale: “Đến bảy lần” diễn đạt giới hạn số lần; thêm “tha” để làm rõ động từ được tỉnh lược nhưng hiển nhiên từ câu hỏi ngay trước đó về việc tha thứ. “Chỉ” làm rõ sự tương phản về giới hạn mà không đổi ý.
- source_word: ἀλλὰ
  choice: nhưng
  rationale: Liên từ đối lập thông dụng và trực tiếp trong tiếng Việt.
- source_word: ἕως ἑβδομηκοντάκις ἑπτά
  choice: đến bảy mươi bảy lần
  rationale: Chọn cách hiểu “bảy mươi bảy lần” như một cách phân tích trực tiếp hợp lý của cụm từ Hy Lạp, đồng thời ghi cách hiểu truyền thống “bảy mươi lần bảy” trong chú thích để giữ nguyên tính mơ hồ thực sự.
theological_decisions:
- issue: Cụm số ἑβδομηκοντάκις ἑπτά có thể được hiểu theo hai cách
  choice: bảy mươi bảy lần
  alternative: bảy mươi lần bảy
  rationale: Cú pháp Hy Lạp cho phép cả hai cách hiểu. Bản dịch chính dùng “bảy mươi bảy lần” nhưng không loại bỏ cách đọc kia; chú thích giữ lại phương án thay thế. Không diễn giải con số thành một giới hạn giáo lý hay thêm kết luận thần học vào chính câu.
- issue: Động từ “tha” được tỉnh lược trong câu Hy Lạp
  choice: thêm “tha” trong câu dịch
  alternative: 'giữ nguyên câu tỉnh lược: “đến bảy lần”'
  rationale: Câu hỏi ngay trước đó xác định rõ hành động là tha thứ. Việc khôi phục động từ giúp câu tiếng Việt tự nhiên và dễ hiểu, không đưa thêm một ý niệm ngoài ngữ cảnh.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “Đức Giê-su” và cặp xưng hô “Thầy—con” phù hợp với bối cảnh thầy và môn đồ; tránh lối xưng hô cổ “ta—ngươi”. Dấu chú thích [a] được đặt ngay sau cụm số mà chú thích giải thích.
