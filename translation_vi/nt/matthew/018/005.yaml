  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ὃς ⸀ἐὰν δέξηται ⸂ἓν παιδίον τοιοῦτο⸃ ἐπὶ τῷ ὀνόματί μου, ἐμὲ δέχεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/005.yaml
  text: And whoever receives one such child in my name receives me[a][b].
translation:
  language: vi
  text: Và ai đón tiếp[a] một đứa trẻ như thế này[b] nhân danh tôi thì đón tiếp tôi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “tiếp nhận” hoặc “chấp nhận”. Động từ Hy Lạp có thể mang nghĩa “đón tiếp”, “tiếp nhận” hay “chấp nhận”.
    reason: lexical_alternative
  - marker: b
    text: 'Sát nghĩa: “một đứa trẻ như thế này”; trong câu này, tiếng Hy Lạp không có tính từ “nhỏ”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς ἐὰν
  choice: ai ... thì
  rationale: Cấu trúc đại từ quan hệ đi với ἐάν diễn tả điều kiện khái quát. Mẫu câu “ai ... thì” tự nhiên trong tiếng Việt và giữ được ý nghĩa áp dụng cho bất cứ người nào.
- source_word: δέξηται / δέχεται
  choice: đón tiếp / đón tiếp
  rationale: Động từ δέχομαι có thể mang nghĩa tiếp nhận, đón tiếp hoặc chấp nhận. “Đón tiếp” tự nhiên khi nói về một đứa trẻ, đồng thời việc lặp lại cùng một từ giữ nguyên mối liên hệ trực tiếp giữa đón tiếp đứa trẻ và đón tiếp Chúa Giê-su.
- source_word: ἓν παιδίον τοιοῦτο
  choice: một đứa trẻ như thế này
  rationale: Cụm từ chỉ một đứa trẻ thuộc loại hoặc có đặc điểm như đứa trẻ vừa được nêu. Bản dịch không thêm ý “nhỏ” vì câu này không có tính từ μικρόν.
- source_word: ἐπὶ τῷ ὀνόματί μου
  choice: nhân danh tôi
  rationale: Cụm giới từ diễn tả hành động được thực hiện liên quan đến danh, thẩm quyền hoặc sự quy thuộc về Chúa Giê-su. “Nhân danh tôi” là cách nói tự nhiên, quen thuộc và không thu hẹp cụm từ vào chỉ một sắc thái.
- source_word: ἐμὲ
  choice: tôi
  rationale: Đại từ ngôi thứ nhất ở dạng nhấn mạnh được chuyển tự nhiên là “tôi”; sự lặp lại động từ và vị trí cuối câu đã làm nổi bật sự đồng nhất mang tính đại diện.
theological_decisions:
- issue: Sự đồng nhất mang tính đại diện giữa đứa trẻ và Chúa Giê-su
  choice: Đón tiếp một đứa trẻ như thế này nhân danh Chúa Giê-su chính là đón tiếp Ngài.
  alternative: Hiểu nhẹ hơn rằng hành động ấy chỉ bày tỏ sự tôn kính đối với Chúa Giê-su.
  rationale: Việc dùng lại cùng động từ δέχομαι và đổi tân ngữ từ “một đứa trẻ như thế này” sang “tôi” tạo nên sự đồng nhất trực tiếp. Bản dịch giữ sức nặng ấy nhưng không thêm những hàm ý bí tích hay giáo hội mà câu không nêu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ liên từ mở đầu “Và” để nối với mạch văn trước; lặp lại “đón tiếp” nhằm phản ánh phép lặp có chủ ý trong nguyên văn.
