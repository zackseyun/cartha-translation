  terminology: “Đón tiếp” là một lựa chọn phù hợp cho δέχομαι trong ngữ cảnh tiếp nhận một đứa trẻ và giữ được sự lặp lại với vế nói về việc tiếp nhận Chúa Giê-su. “Đứa trẻ” không thêm tính từ “nhỏ”, và chú thích b nêu đúng điểm này. Cách dùng “nhân danh tôi” phù hợp văn phong Kinh Thánh hiện đại và không diễn giải quá mức.
