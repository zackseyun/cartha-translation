id: MAT.18.26
reference: Matthew 18:26
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: πεσὼν οὖν ὁ δοῦλος προσεκύνει αὐτῷ λέγων· ⸀Μακροθύμησον ἐπ’ ⸀ἐμοί, καὶ πάντα ⸂ἀποδώσω σοι⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/026.yaml
  text: So the servant fell down before him and kept pleading[a], saying, ‘Be patient with me, and I will repay you everything.’
translation:
  language: vi
  text: 'Vì vậy, người nô lệ sụp xuống, phủ phục[a] trước mặt vua và thưa: “Xin kiên nhẫn với tôi, tôi sẽ trả hết cho ngài.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hoặc “bái lạy”. Trong những ngữ cảnh khác, động từ Hy Lạp này cũng có thể được dịch là “thờ lạy”; tại đây, nó chỉ cử chỉ phủ phục cung kính trước một vị vua là con người.
    reason: lexical_alternative
lexical_decisions:
- source_word: πεσὼν
  choice: sụp xuống
  rationale: Phân từ bất định quá khứ của πίπτω diễn tả hành động hạ mình xuống trước khi nói; “sụp xuống” tự nhiên và thể hiện rõ tư thế khẩn cầu.
- source_word: οὖν
  choice: Vì vậy
  rationale: Liên từ nối hành động này như hệ quả của phán quyết ở câu trước.
- source_word: δοῦλος
  choice: người nô lệ
  rationale: δοῦλος chỉ người thuộc địa vị lệ thuộc; trong dụ ngôn về món nợ và nghĩa vụ hoàn toàn, “người nô lệ” phản ánh thực trạng xã hội chính xác hơn từ nhẹ nghĩa “đầy tớ”.
- source_word: προσεκύνει
  choice: phủ phục
  rationale: Trong ngữ cảnh một người nô lệ đứng trước vua, προσκυνέω chỉ cử chỉ hạ mình cung kính, không nhất thiết là sự thờ phượng theo nghĩa tôn giáo. “Phủ phục” giữ được tư thế và sắc thái tôn kính.
- source_word: λέγων
  choice: và thưa
  rationale: Phân từ giới thiệu lời nói trực tiếp; “thưa” phù hợp với cách một người ở địa vị thấp nói với vua mà không thêm quá mức ý nghĩa van xin vào chính động từ.
- source_word: Μακροθύμησον ἐπ’ ἐμοί
  choice: Xin kiên nhẫn với tôi
  rationale: Mệnh lệnh này xin người chủ nhẫn nại và hoãn việc thi hành phán quyết; cách diễn đạt rõ ràng, hiện đại.
- source_word: πάντα
  choice: hết
  rationale: Từ này mang nghĩa bao quát, ở đây chỉ toàn bộ món nợ; “trả hết” là cách nói tự nhiên trong tiếng Việt.
- source_word: ἀποδώσω σοι
  choice: tôi sẽ trả ... cho ngài
  rationale: Trong ngữ cảnh món nợ, ἀποδίδωμι có nghĩa là hoàn trả. Đại từ “ngài” thể hiện cách xưng hô kính trọng với vua.
theological_decisions:
- issue: Ý nghĩa của προσκυνέω khi hướng đến một người chủ là con người
  choice: Diễn đạt là hành động phủ phục cung kính
  alternative: thờ lạy vua; bái lạy vua
  rationale: Trong thế giới của dụ ngôn, đối tượng là vị vua/chủ, và nghĩa trực tiếp là cử chỉ hạ mình kính cẩn. Dịch là “thờ lạy” dễ đưa vào câu hàm ý tôn giáo mạnh hơn điều ngữ cảnh đòi hỏi.
translation_notes:
  register: Bản dịch dùng tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. “Người nô lệ” giữ đúng địa vị xã hội của δοῦλος; “vua” làm rõ đối tượng của đại từ Hy Lạp dựa trên ngữ cảnh trực tiếp của dụ ngôn. Dấu chú thích [a] được đặt ngay sau từ cần giải thích.
