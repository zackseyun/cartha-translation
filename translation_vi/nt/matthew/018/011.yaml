  text: Ἦλθεν γὰρ ὁ υἱὸς τοῦ ἀνθρώπου σῶσαι τὸ ἀπολωλός.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/011.yaml
  text: For the Son[a] of Man came to save the lost.
translation:
  language: vi
  text: Vì Con Người[a] đã đến để cứu điều đã hư mất.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Câu này không có trong các thủ bản Hy Lạp sớm nhất, gồm Codex Sinaiticus và Codex Vaticanus thuộc thế kỷ IV, cũng như trong các bản dịch Copt cổ; nhưng có trong Codex Bezae thuộc thế kỷ V, truyền thống thủ bản Byzantine chiếm đa số và bản Vulgata tiếng La-tinh. Có lẽ những người chép tay về sau đã thêm câu này để hài hòa với Lu-ca 19:10.
    reason: textual_critical
lexical_decisions:
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Con Người
  rationale: Cách dịch quen thuộc và trang trọng của tước hiệu Hy Lạp, giữ nguyên hình thức và sắc thái Kinh Thánh.
- source_word: σῶσαι
  choice: để cứu
  rationale: Động từ nguyên mẫu chỉ mục đích, diễn tả việc giải cứu khỏi tình trạng hư mất mà không thêm một cách hiểu hệ phái.
- source_word: τὸ ἀπολωλός
  choice: điều đã bị mất
  rationale: Phân từ hoàn thành trung tính số ít được dùng như danh từ; cách dịch này giữ nét phiếm chỉ và trạng thái hiện tại do một sự mất mát đã xảy ra, thay vì tự ý giới hạn đối tượng thành một người hay một nhóm người.
- source_word: γὰρ
  choice: Vì
  rationale: Giữ liên từ giải thích, nối câu này với lời cảnh báo và lý do trong ngữ cảnh trước.
theological_decisions:
- issue: Đối tượng của hành động cứu trong τὸ ἀπολωλός
  choice: điều đã bị mất
  alternative: người bị hư mất
  rationale: Nguyên văn dùng dạng trung tính số ít, vì vậy bản dịch không chuyển rõ nghĩa sang chỉ con người dù ngữ cảnh có thể hướng đến những người lạc mất.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “Con Người” như một tước hiệu; giữ cấu trúc giải thích “Vì …” và sự phiếm chỉ của cụm trung tính τὸ ἀπολωλός.
