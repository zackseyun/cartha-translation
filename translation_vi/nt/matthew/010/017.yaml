    issue: “đánh đòn” chưa diễn đạt rõ phương thức đánh bằng roi của μαστιγώσουσιν.
    rationale: Động từ μαστιγόω chỉ việc flog/scourge, tức hình phạt đánh bằng roi. “Đánh roi” là cách diễn đạt hiện đại, tự nhiên và chính xác hơn mà không thêm chi tiết ngoài bản gốc.
