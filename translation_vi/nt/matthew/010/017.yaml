- from: Nhưng hãy đề phòng người ta, vì họ sẽ nộp anh em cho các hội đồng và đánh đòn anh em trong các hội đường của họ.
  to: Nhưng hãy đề phòng người ta, vì họ sẽ nộp anh em cho các hội đồng và sẽ đánh roi anh em trong các hội đường của họ.
  rationale: 'Chỉ thay “đánh đòn” bằng “đánh roi” và thêm “sẽ” để làm rõ cấu trúc tương lai song hành. Không cần chú thích: “người ta” diễn đạt tự nhiên nghĩa khái quát của ἀνθρώπων, còn “các hội đồng” và “các hội đường” đã giữ được tính số nhiều và tính không-chuyên biệt hóa của nguyên ngữ.'
