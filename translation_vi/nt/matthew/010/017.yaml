id: MAT.10.17
reference: Matthew 10:17
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: προσέχετε δὲ ἀπὸ τῶν ἀνθρώπων· παραδώσουσιν γὰρ ὑμᾶς εἰς συνέδρια, καὶ ἐν ταῖς συναγωγαῖς αὐτῶν μαστιγώσουσιν ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/017.yaml
  text: But beware of people[a], for they will hand you over to councils, and in their synagogues they will flog you.
translation:
  language: vi
  text: Nhưng hãy đề phòng người ta, vì họ sẽ nộp anh em cho các hội đồng và sẽ đánh roi anh em trong các hội đường của họ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσέχετε
  choice: hãy đề phòng
  rationale: Mệnh lệnh số nhiều cảnh báo các môn đồ về mối nguy từ những người chống đối; “hãy đề phòng” tự nhiên và giữ được sắc thái cảnh giác.
- source_word: δὲ
  choice: Nhưng
  rationale: δέ đánh dấu bước chuyển nhẹ mang tính tương phản từ lời chỉ dẫn trước đó sang lời cảnh báo.
- source_word: ἀπὸ τῶν ἀνθρώπων
  choice: người ta
  rationale: Sau προσέχω, ἀπό chỉ nguồn gây nguy hiểm. ἄνθρωποι ở đây mang nghĩa khái quát, chỉ những người sẽ bắt bớ, không giới hạn ở nam giới.
- source_word: παραδώσουσιν
  choice: sẽ nộp ... cho
  rationale: παραδίδωμι ở đây chỉ việc giao người cho cơ quan có thẩm quyền; “nộp ... cho” giữ sắc thái pháp lý mà không hàm ý quá mức về sự phản bội cá nhân.
- source_word: συνέδρια
  choice: các hội đồng
  rationale: Số nhiều chỉ các hội đồng cai quản hoặc xét xử tại địa phương, không nhất thiết là Đại Hội đồng tại Giê-ru-sa-lem.
- source_word: συναγωγαῖς
  choice: các hội đường
  rationale: Từ này chỉ cụ thể những nơi hội họp và thờ phượng của người Do Thái; “hội đường” là cách gọi quen thuộc, rõ nghĩa trong tiếng Việt Kinh Thánh.
- source_word: αὐτῶν
  choice: của họ
  rationale: Đại từ sở hữu bổ nghĩa tự nhiên cho “các hội đường”, chỉ sự liên hệ của những người chống đối với các hội đường ấy.
- source_word: μαστιγώσουσιν
  choice: đánh đòn
  rationale: μαστιγόω chỉ hình phạt thân thể bằng roi; “đánh đòn” rõ ràng, trang trọng vừa phải và tự nhiên hơn cách nói cổ “đánh bằng roi” trong câu này.
theological_decisions:
- issue: Cách diễn đạt giới tính của ἀνθρώπων
  choice: người ta
  alternative: những người đàn ông
  rationale: Danh từ Hy Lạp có hình thức giống đực số nhiều nhưng mang nghĩa khái quát trong văn cảnh, chỉ những con người chống đối chứ không khẳng định họ chỉ là nam giới.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang nghiêm và dễ hiểu. Dùng “anh em” để diễn đạt đại từ ngôi thứ hai số nhiều trong lời Đức Giê-su nói với nhóm môn đồ; cụm từ này không nhằm giới hạn đối tượng ở nam giới. Không thêm chú thích vì tiếng Việt “người ta” đã thể hiện tự nhiên nghĩa khái quát của ἀνθρώπων.
