review_pass:
  verdict: revise
  source_fidelity: Bản dịch truyền đạt đúng lời cảnh báo, đối tượng nguy hiểm mang nghĩa khái quát, việc bị nộp cho các hội đồng địa phương và bị xử phạt trong các hội đường. Tuy nhiên, “đánh đòn” chỉ nêu việc trừng phạt thân thể nói chung, trong khi μαστιγόω xác định hình phạt bằng roi/đòn roi; “đánh roi” giữ được nét nghĩa này rõ hơn.
  naturalness: Câu văn tự nhiên, trang nghiêm và phù hợp tiếng Việt hiện đại. Việc lặp “sẽ” ở vế hai làm cấu trúc song hành rõ ràng hơn.
  terminology: “Hội đồng” phù hợp với συνέδρια số nhiều, không đồng nhất với Đại Hội đồng; “hội đường” là thuật ngữ Kinh Thánh quen thuộc cho συναγωγαί. “Anh em” là cách xưng hô số nhiều phù hợp trong lời nói với nhóm môn đồ. Thay “đánh đòn” bằng “đánh roi” để phản ánh chính xác μαστιγόω.
  issues:
