id: MAT.10.4
reference: Matthew 10:4
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Σίμων ὁ ⸀Καναναῖος καὶ Ἰούδας ⸀ὁ Ἰσκαριώτης ὁ καὶ παραδοὺς αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/004.yaml
  text: Simon the Cananaean[a], and Judas Iscariot[b], who also betrayed him.
translation:
  language: vi
  text: Si-môn người Ca-na-nê[a], và Giu-đa Ích-ca-ri-ốt, là người cũng đã phản bội Ngài.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể hiểu là “Si-môn người Nhiệt Thành.” Tiếng Hy Lạp tại đây là “Ca-na-nê”, có lẽ phản ánh một danh xưng A-ram/Hê-bơ-rơ vốn theo truyền thống được hiểu là “người Nhiệt Thành.”
    reason: lexical_alternative
  - marker: b
    text: Hay “là người cũng đã giao nộp Ngài.” Động từ Hy Lạp có thể mang nghĩa “giao nộp”; trong trường hợp Giu-đa, “phản bội” phù hợp với ngữ cảnh trình thuật.
    reason: alternative_reading
lexical_decisions:
- source_word: Καναναῖος
  choice: người Ca-na-nê
  rationale: Phiên âm danh xưng Hy Lạp có nguồn gốc A-ram/Hê-bơ-rơ thay vì đưa cách giải thích “người Nhiệt Thành” thẳng vào chính văn. Cách này giữ hình thức của nguồn và tránh khiến độc giả hiểu nhầm đây là từ Hy Lạp thông thường ζηλωτής.
- source_word: Ἰσκαριώτης
  choice: Ích-ca-ri-ốt
  rationale: Dùng dạng phiên âm quen thuộc trong tiếng Việt cho biệt danh/tên riêng này.
- source_word: παραδοὺς
  choice: đã phản bội
  rationale: Động từ παραδίδωμι có nghĩa rộng là “giao nộp”, nhưng trong ngữ cảnh Giu-đa trao Đức Giê-su vào tay đối phương, “phản bội” diễn đạt tự nhiên sức nặng quan hệ và đạo đức của hành động. Nghĩa sát hơn được giữ trong chú thích.
- source_word: ὁ καὶ παραδοὺς αὐτόν
  choice: là người cũng đã phản bội Ngài
  rationale: Cấu trúc mạo từ đi với phân từ có chức năng định ngữ, nhận diện Giu-đa qua hành động của ông. Mệnh đề quan hệ tiếng Việt là cách diễn đạt tự nhiên; “cũng” giữ καί và “Ngài” chỉ Đức Giê-su.
theological_decisions:
- issue: Nên dịch παραδοὺς theo nghĩa rộng “giao nộp” hay theo sắc thái ngữ cảnh “phản bội”
  choice: phản bội
  alternative: giao nộp
  rationale: Trong danh sách các sứ đồ, Giu-đa được nhận diện bằng hành động phản trắc mà trình thuật Tin Mừng thuật lại. “Phản bội” truyền đạt đúng sức nặng ngữ cảnh, trong khi chú thích bảo lưu phạm vi nghĩa rộng hơn của động từ Hy Lạp.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Tên riêng được phiên âm theo cách dùng Kinh Thánh tiếng Việt quen thuộc; danh xưng ít quen “Ca-na-nê” được giải thích bằng chú thích. Đại từ “Ngài” giữ sắc thái tôn kính mà không thêm danh xưng không có trong câu Hy Lạp.
