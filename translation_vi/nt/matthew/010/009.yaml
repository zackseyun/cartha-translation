id: MAT.10.9
reference: Matthew 10:9
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: μὴ κτήσησθε χρυσὸν μηδὲ ἄργυρον μηδὲ χαλκὸν εἰς τὰς ζώνας ὑμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/009.yaml
  text: Do not acquire gold or silver or copper for your belts[b][a],
translation:
  language: vi
  text: Đừng sắm vàng, bạc hay đồng[a] để giắt vào thắt lưng[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “đồng thiếc.”
    reason: lexical_alternative
  - marker: b
    text: Tức là tiền được cất trong thắt lưng hoặc túi đựng tiền đeo ngang hông.
    reason: cultural_note
lexical_decisions:
- source_word: μὴ κτήσησθε
  choice: Đừng sắm
  rationale: κτάομαι mang nghĩa sắm, kiếm được hoặc thủ đắc. “Đừng sắm” diễn đạt tự nhiên mệnh lệnh cấm chuẩn bị hay kiếm tiền cho mình, thay vì chỉ cấm mang theo.
- source_word: χρυσὸν
  choice: vàng
  rationale: Chỉ kim loại vàng; trong ngữ cảnh này được dùng như tiền.
- source_word: ἄργυρον
  choice: bạc
  rationale: Chỉ kim loại bạc; trong ngữ cảnh này được dùng như tiền.
- source_word: χαλκὸν
  choice: đồng
  rationale: χαλκός có thể chỉ đồng đỏ hoặc đồng thiếc; trong danh sách vàng, bạc và đồng, từ này nói đến loại tiền có giá trị thấp hơn. “Đồng” ngắn gọn và tự nhiên, còn khả năng “đồng thiếc” được giữ trong chú thích.
- source_word: εἰς τὰς ζώνας ὑμῶν
  choice: để giắt vào thắt lưng
  rationale: εἰς diễn tả hướng vào, còn ζώνη là thắt lưng hoặc đai lưng, nơi người ta có thể cất tiền. Cách dịch này rõ nghĩa trong tiếng Việt mà không biến phần giải thích văn hóa thành nội dung chính.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Đừng sắm” giữ trọng tâm của động từ ở việc kiếm hoặc chuẩn bị cho mình; “giắt vào thắt lưng” truyền đạt tập quán mang tiền thời đó mà vẫn giữ chú thích văn hóa.
