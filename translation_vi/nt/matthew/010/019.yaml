source:
  edition: SBLGNT
  text: ὅταν δὲ ⸀παραδῶσιν ὑμᾶς, μὴ μεριμνήσητε πῶς ἢ τί λαλήσητε· δοθήσεται γὰρ ὑμῖν ἐν ἐκείνῃ τῇ ὥρᾳ τί ⸀λαλήσητε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/019.yaml
  text: But when they hand you over[a], do not worry about how or what you should speak[b], for what you should speak will be given to you in that hour.
translation:
  language: vi
  text: Nhưng khi người ta giao nộp anh em, đừng lo về việc phải nói thế nào hay nói gì; vì vào giờ ấy, điều anh em phải nói sẽ được ban cho anh em.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cụm “sẽ được ban” không nêu rõ ai là Đấng ban; câu tiếp theo cho biết Thánh Linh của Cha anh em là Đấng nói qua anh em.
    reason: cross_reference
lexical_decisions:
- source_word: ὅταν δὲ
  choice: Nhưng khi
  rationale: ὅταν chỉ một tình huống tương lai sẽ xảy đến, còn δέ chuyển ý nhẹ từ lời cảnh báo trước đó; “Nhưng khi” tự nhiên và phù hợp mạch văn.
- source_word: παραδῶσιν ὑμᾶς
  choice: người ta giao nộp anh em
  rationale: παραδίδωμι ở đây mang nghĩa trao nộp cho nhà chức trách trong bối cảnh thù địch. “Giao nộp” giữ sắc thái pháp lý mà không thu hẹp thành “phản bội”.
- source_word: μὴ μεριμνήσητε
  choice: đừng lo
  rationale: μεριμνάω diễn tả sự lo lắng về việc phải làm chứng sắp tới. “Đừng lo” rõ ràng, tự nhiên trong tiếng Việt hiện đại.
- source_word: πῶς ἢ τί λαλήσητε
  choice: phải nói thế nào hay nói gì
  rationale: Giữ sự phân biệt giữa cách nói và nội dung nói, đồng thời chuyển cấu trúc Hy Lạp sang trật tự tự nhiên của tiếng Việt.
- source_word: δοθήσεται
  choice: sẽ được ban cho anh em
  rationale: Giữ thể bị động và không nêu đích danh tác nhân, đúng với sự dè dặt của câu Hy Lạp; “ban” phù hợp với ngữ cảnh sự trợ giúp đến từ Đức Chúa Trời.
- source_word: ἐν ἐκείνῃ τῇ ὥρᾳ
  choice: ngay giờ ấy
  rationale: “Giờ ấy” bảo tồn hình ảnh thời điểm của nguyên văn, còn “ngay” làm rõ tính đúng lúc của điều được ban.
- source_word: τί λαλήσητε
  choice: điều anh em phải nói
  rationale: Diễn đạt tự nhiên nội dung lời nói được ban, đồng thời lặp lại ý của λαλέω trong vế trước.
theological_decisions:
- issue: Tác nhân hàm ẩn trong thể bị động δοθήσεται
  choice: Giữ thể bị động “sẽ được ban” và không gọi tên tác nhân trong chính câu.
  alternative: “Đức Chúa Trời sẽ ban cho anh em” hoặc “Thánh Linh sẽ ban cho anh em.”
  rationale: Nguyên văn câu này không nêu tác nhân; câu kế tiếp mới xác định Thánh Linh của Cha là Đấng phán qua các môn đồ. Bản dịch vì thế giữ nguyên mức độ hàm ẩn của câu.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại, dùng “anh em” để chỉ nhóm môn đồ được Đức Giê-su trực tiếp phán dạy. Cấu trúc được làm tự nhiên trong tiếng Việt nhưng vẫn giữ thể bị động và sự phân biệt giữa cách nói với nội dung lời nói.
