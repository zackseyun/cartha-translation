  source_fidelity: 'Bản dịch giữ đúng các yếu tố chính: tình huống tương lai, việc bị giao nộp, mệnh lệnh không lo lắng về cách thức/nội dung lời nói, và thể bị động không nêu tác nhân của δοθήσεται. Tuy nhiên, “ngay giờ ấy” thêm sắc thái tức thì không được phát biểu rõ trong ἐν ἐκείνῃ τῇ ὥρᾳ; “vào giờ ấy” sát và tự nhiên hơn.'
