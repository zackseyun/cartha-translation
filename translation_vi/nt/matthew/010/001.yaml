  terminology: “Thẩm quyền” chuyển đạt chính xác ἐξουσία trong bối cảnh quyền được trao. “Môn đồ” phù hợp văn thể Phúc Âm. “Các linh ô uế” là thuật ngữ sát nguồn và ổn định hơn “tà linh”.
