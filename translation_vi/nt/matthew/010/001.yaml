id: MAT.10.1
reference: Matthew 10:1
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Καὶ προσκαλεσάμενος τοὺς δώδεκα μαθητὰς αὐτοῦ ἔδωκεν αὐτοῖς ἐξουσίαν πνευμάτων ἀκαθάρτων ὥστε ἐκβάλλειν αὐτὰ καὶ θεραπεύειν πᾶσαν νόσον καὶ πᾶσαν μαλακίαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/001.yaml
  text: And calling his twelve disciples to himself[a], he gave them authority over unclean spirits[c][b], to cast them out and to heal every disease and every sickness.
translation:
  language: vi
  text: Ngài gọi mười hai môn đồ của Ngài đến với Ngài và ban cho họ thẩm quyền trên các linh ô uế, để đuổi chúng ra và chữa lành mọi bệnh tật và mọi chứng đau yếu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn dùng hai từ gần nghĩa, có thể dịch là “mọi bệnh tật và mọi chứng suy nhược”.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: gọi ... đến
  rationale: Động từ trung cách προσκαλέομαι mang nghĩa gọi người khác đến với mình. “Gọi ... đến” diễn đạt tự nhiên sắc thái ấy trong tiếng Việt; phân từ bất định quá khứ được nối với động từ chính mà không buộc phải xác định quan hệ thời gian là “sau khi”.
- source_word: τοὺς δώδεκα μαθητὰς αὐτοῦ
  choice: mười hai môn đồ của mình
  rationale: “Môn đồ” là cách gọi quen thuộc, trang trọng và chính xác trong ngữ cảnh các sách Phúc Âm; “của mình” quy chiếu tự nhiên về chủ ngữ là Chúa Giê-su.
- source_word: ἔδωκεν
  choice: ban cho
  rationale: δίδωμι có nghĩa cơ bản là “cho”. Trong văn cảnh Chúa Giê-su trao thẩm quyền, “ban cho” vừa tự nhiên vừa giữ sắc thái trang trọng, không thêm ý ngoài văn bản.
- source_word: ἐξουσίαν
  choice: thẩm quyền
  rationale: ἐξουσία nhấn mạnh quyền được trao để hành động hơn là chỉ sức mạnh; “thẩm quyền” giữ rõ nét nghĩa này.
- source_word: πνευμάτων ἀκαθάρτων
  choice: trên các tà linh
  rationale: Sở hữu cách sau ἐξουσίαν diễn tả đối tượng chịu quyền chi phối. “Tà linh” là cách nói hiện đại, dễ hiểu cho các linh ô uế; chú thích bảo lưu cách dịch sát hình thức là “các linh ô uế”.
- source_word: ὥστε ἐκβάλλειν αὐτὰ
  choice: để đuổi chúng ra
  rationale: ὥστε với động từ nguyên mẫu có thể hàm ý mục đích hoặc kết quả. “Để” tự nhiên trong tiếng Việt và không cần phân giải quá mức ranh giới giữa hai sắc thái trong văn cảnh này.
- source_word: θεραπεύειν
  choice: chữa lành
  rationale: θεραπεύω ở đây chỉ hành động chữa trị, làm cho người bệnh được lành; “chữa lành” là cách diễn đạt rõ ràng và quen thuộc.
- source_word: πᾶσαν νόσον καὶ πᾶσαν μαλακίαν
  choice: mọi thứ bệnh tật, đau yếu
  rationale: 'Cụm từ giữ hai danh từ gần nghĩa nhưng không hoàn toàn đồng nhất: νόσος chỉ bệnh tật, còn μαλακία có thể chỉ tình trạng đau yếu hoặc suy nhược. Dùng cả hai thành tố giúp không làm phẳng cách diễn đạt của nguyên bản.'
theological_decisions:
- issue: Bản chất quyền được trao cho các môn đồ
  choice: Chúa Giê-su ban cho mười hai môn đồ thẩm quyền trên các tà linh
  alternative: Chúa Giê-su ban cho họ quyền năng đối với các tà linh
  rationale: ἐξουσία phù hợp nhất với “thẩm quyền”, cho thấy quyền hành động được Chúa Giê-su trao, thay vì chỉ nói đến năng lực hay sức mạnh phi cá nhân.
- issue: Quan hệ do ὥστε diễn tả
  choice: để đuổi chúng ra và chữa lành
  alternative: đến nỗi họ đuổi chúng ra và chữa lành
  rationale: Cấu trúc ὥστε với động từ nguyên mẫu có thể nằm giữa mục đích và kết quả. Trong lời sai phái này, “để” tự nhiên hơn nhưng vẫn không thêm một khẳng định thần học vượt quá câu văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu tiếng Việt dùng kết cấu phối hợp thay cho việc mô phỏng cứng nhắc phân từ Hy Lạp. “Tà linh” được chọn trong chính văn vì tự nhiên với độc giả phổ thông, còn “các linh ô uế” được bảo lưu trong chú thích. Mọi dấu chú thích đều xuất hiện trong chính văn.
