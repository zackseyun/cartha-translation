  source_fidelity: 'Cần sửa hai điểm để sát nguyên ngữ hơn: προσκαλεσάμενος có sắc thái gọi các môn đồ đến với chính Ngài, và πνεύματα ἀκάθαρτα nên được dịch trực tiếp là “các linh ô uế”, thay vì “tà linh”, vốn khái quát và diễn giải hơn.'
