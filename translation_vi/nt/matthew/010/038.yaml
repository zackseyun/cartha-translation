  source_fidelity: 'Bản dịch truyền đạt trung thành cấu trúc và ý nghĩa của câu Hy Lạp: mệnh đề quan hệ khái quát “Ai…”, hai hành động phối hợp “vác thập tự giá của mình” và “theo sau tôi”, cùng kết luận phủ định “không xứng đáng với tôi.” “Vác thập tự giá” là cách diễn đạt tự nhiên và phù hợp ngữ cảnh cho λαμβάνει τὸν σταυρόν, không làm mất hình ảnh cụ thể của nguyên văn. “Theo sau tôi” phản ánh hữu ích sắc thái ὀπίσω μου.'
  naturalness: Câu văn hiện đại, trang trọng, rõ ràng và dễ đọc trong tiếng Việt. Cách dùng “của mình” quy chiếu tự nhiên đến từng người trong chủ ngữ khái quát, không cần ép tiếng Việt theo giống ngữ pháp Hy Lạp.
  terminology: “Thập tự giá” là thuật ngữ Kinh Thánh quen thuộc, chính xác và giữ được tính liên kết với ngữ cảnh môn đồ hóa và khổ hình. “Không xứng đáng với tôi” là cách diễn đạt tự nhiên cho μου ἄξιος, không thêm diễn giải giáo lý. Các chú thích được neo đúng chỗ và phản ánh thích đáng dạng giống đực số ít khái quát cùng sắc thái ὀπίσω.
