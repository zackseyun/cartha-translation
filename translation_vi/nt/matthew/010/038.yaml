id: MAT.10.38
reference: Matthew 10:38
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ὃς οὐ λαμβάνει τὸν σταυρὸν αὐτοῦ καὶ ἀκολουθεῖ ὀπίσω μου, οὐκ ἔστιν μου ἄξιος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/038.yaml
  text: And whoever does not take up his cross and follow after me is not worthy of me[a][b].
translation:
  language: vi
  text: Ai không vác thập tự giá của mình[a] và theo sau tôi[b] thì không xứng đáng với tôi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hy Lạp dùng đại từ giống đực số ít, theo nghĩa khái quát: mỗi môn đồ phải vác thập tự giá của chính mình.'
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch đơn giản là “theo tôi.” Tiếng Hy Lạp nói rõ hơn là “theo sau tôi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς
  choice: Ai
  rationale: Đại từ quan hệ bất định, mang nghĩa khái quát, được diễn đạt tự nhiên trong tiếng Việt bằng “ai”.
- source_word: λαμβάνει τὸν σταυρὸν
  choice: vác thập tự giá
  rationale: Trong ngữ cảnh người môn đồ, “vác” diễn đạt tự nhiên hành động nhận lấy và mang thập tự giá, đồng thời giữ nguyên hình ảnh cụ thể của nguyên bản.
- source_word: τὸν σταυρὸν αὐτοῦ
  choice: thập tự giá của mình
  rationale: “Của mình” quy chiếu tự nhiên về từng người được nói đến, giữ nghĩa mỗi người phải vác thập tự giá của chính mình mà không làm câu tiếng Việt gượng ép.
- source_word: ἀκολουθεῖ ὀπίσω μου
  choice: theo sau tôi
  rationale: Cách dịch này giữ sắc thái vị trí của ὀπίσω, tức đi theo ở phía sau, thay vì lược thành chỉ “theo tôi”.
- source_word: οὐκ ἔστιν μου ἄξιος
  choice: không xứng đáng với tôi
  rationale: Cách diễn đạt trực tiếp, trang trọng và tự nhiên, giữ nguyên sự đánh giá mang tính quan hệ đối với chính Chúa Giê-su.
theological_decisions:
- issue: Hình ảnh vác thập tự giá trong lời kêu gọi làm môn đồ
  choice: Giữ nguyên hình ảnh cụ thể “vác thập tự giá”
  alternative: Diễn giải thành “chấp nhận đau khổ” hoặc “từ bỏ chính mình”
  rationale: Nguyên bản dùng hình ảnh thập tự giá với sức nặng lịch sử và thần học riêng; diễn giải trừu tượng sẽ thu hẹp ý nghĩa và làm mất sự căng thẳng của lời Chúa Giê-su.
- issue: Đại từ giống đực số ít αὐτοῦ được dùng theo nghĩa khái quát
  choice: Dịch tự nhiên là “của mình” và giải thích dạng thức Hy Lạp trong chú thích
  alternative: Dịch sát hình thức là “của người ấy” hoặc thêm một đại từ chỉ nam giới
  rationale: Tiếng Việt không đánh dấu giống ngữ pháp trong cấu trúc này. “Của mình” giữ rõ quan hệ quy chiếu đến từng môn đồ, còn chú thích bảo lưu thông tin hình thái của nguyên bản.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Thập tự giá” bảo lưu thuật ngữ Kinh Thánh quen thuộc; “vác” và “theo sau” tạo câu tự nhiên nhưng vẫn bám sát hình ảnh và cấu trúc Hy Lạp.
