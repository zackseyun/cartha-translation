revisions:
- from: Hãy chữa lành người bệnh, làm cho người chết sống lại, làm cho người mắc bệnh phong[a] được sạch, và đuổi quỷ. Anh em đã nhận không, hãy cho không.
  to: Hãy chữa lành người bệnh, khiến người chết sống lại, làm cho người mắc bệnh phong[a] được sạch, và đuổi quỷ. Anh em đã nhận nhưng không, thì cũng hãy cho nhưng không.
  rationale: Thay “nhận không ... cho không” bằng “nhận nhưng không ... cho nhưng không” để diễn đạt rõ δωρεάν là ‘không phải trả gì/miễn phí’, đồng thời bảo toàn sự lặp lại cân xứng và giọng văn trang trọng của nguyên văn. Các mệnh lệnh còn lại được giữ nguyên về ý nghĩa; chú thích được chỉnh để nêu chính xác phạm vi văn hóa-ngữ nghĩa của λεπροί.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T02:45:01Z'
review_pass:
  verdict: revise
  source_fidelity: Bốn mệnh lệnh được chuyển đạt đúng trình tự và lực mệnh lệnh của tiếng Hy Lạp. “Làm cho ... được sạch” thích hợp cho καθαρίζετε vì không thu hẹp ý nghĩa vào chữa trị. Tuy nhiên, “đã nhận không, hãy cho không” không diễn đạt rõ trạng từ δωρεάν (‘nhưng không/không phải trả gì’) trong tiếng Việt hiện đại.
  naturalness: Phần liệt kê các hành động tự nhiên, trang trọng và dễ hiểu. Câu kết cần dùng cấu trúc thành ngữ “nhưng không” để tránh cách nói “nhận không” dễ bị hiểu là phủ định việc nhận.
  terminology: “Chữa lành,” “khiến người chết sống lại,” “được sạch,” và “đuổi quỷ” phản ánh tốt các thuật ngữ nguồn. Giữ “bệnh phong” kèm chú thích văn hóa là phù hợp; chú thích cần nói rõ phạm vi của thuật ngữ Kinh Thánh mà không đồng nhất nó với bệnh Hansen hiện đại.
  issues:
  - severity: medium
    issue: Cụm “Anh em đã nhận không, hãy cho không” mơ hồ và không tự nhiên.
    rationale: Trong tiếng Việt, “nhận không” thường có thể được hiểu là ‘không nhận’. δωρεάν ở cả hai vế nghĩa là nhận/cho nhưng không, không phải trả tiền; cần biểu đạt rõ trạng ngữ này và vẫn giữ phép song hành.
  - severity: low
    issue: Chú thích có thể diễn đạt chính xác hơn về thuật ngữ “bệnh phong.”
    rationale: Thuật ngữ Kinh Thánh chỉ một phạm vi tình trạng da rộng hơn bệnh Hansen hiện đại; cách viết lại giúp tránh cảm giác rằng từ Hy Lạp tự nó chỉ đích danh bệnh phong theo nghĩa y học hiện đại.
  revised_text: Hãy chữa lành người bệnh, khiến người chết sống lại, làm cho người mắc bệnh phong[a] được sạch, và đuổi quỷ. Anh em đã nhận nhưng không, thì cũng hãy cho nhưng không.
