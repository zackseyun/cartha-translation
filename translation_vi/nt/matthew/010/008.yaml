source:
  edition: SBLGNT
  text: ἀσθενοῦντας θεραπεύετε, ⸂νεκροὺς ἐγείρετε⸃, λεπροὺς καθαρίζετε, δαιμόνια ἐκβάλλετε· δωρεὰν ἐλάβετε, δωρεὰν δότε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/008.yaml
  text: Heal the sick[a], raise the dead, cleanse lepers, cast out demons. Freely you received; freely give.
translation:
  language: vi
  text: Hãy chữa lành người bệnh, khiến người chết sống lại, làm cho người mắc bệnh phong[a] được sạch, và đuổi quỷ. Anh em đã nhận nhưng không, thì cũng hãy cho nhưng không.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Thuật ngữ Hy Lạp được dịch là “bệnh phong” có thể chỉ nhiều chứng bệnh da nghiêm trọng trong cách dùng của Kinh Thánh, chứ không chỉ riêng bệnh phong Hansen theo cách hiểu y học hiện đại.
    reason: cultural_note
lexical_decisions:
- source_word: ἀσθενοῦντας θεραπεύετε
  choice: Hãy chữa lành người bệnh
  rationale: Trong ngữ cảnh này, ἀσθενέω chỉ người đau ốm, còn θεραπεύω nói đến việc chữa lành; cách diễn đạt này tự nhiên và giữ nguyên mệnh lệnh trực tiếp.
- source_word: νεκροὺς ἐγείρετε
  choice: làm cho người chết sống lại
  rationale: ἐγείρω ở đây chỉ việc khiến người chết sống lại, không chỉ là đánh thức; cách dịch này rõ nghĩa trong tiếng Việt hiện đại.
- source_word: λεπροὺς καθαρίζετε
  choice: làm cho người mắc bệnh phong được sạch
  rationale: λεπρός là người mắc một chứng bệnh da khiến họ bị xem là ô uế trong bối cảnh Kinh Thánh; καθαρίζω bao hàm cả sự sạch về thân thể lẫn địa vị nghi lễ, nên không đơn giản hóa thành 'chữa lành'.
- source_word: δαιμόνια ἐκβάλλετε
  choice: đuổi quỷ
  rationale: Đây là cách diễn đạt trực tiếp, tự nhiên cho hành động trục xuất δαιμόνια.
- source_word: δωρεὰν ἐλάβετε, δωρεὰν δότε
  choice: Anh em đã nhận không, hãy cho không
  rationale: Lặp lại 'không' giữ được thế song song và ý nghĩa không thu tiền, không đòi trả giá của δωρεάν, đồng thời diễn đạt gọn như nguyên văn.
theological_decisions:
- issue: Phạm vi của các mệnh lệnh về phép lạ
  choice: Giữ nguyên các động từ dưới dạng mệnh lệnh trực tiếp dành cho nhóm môn đồ trong bài sai phái.
  alternative: Hiểu một số hành động theo nghĩa ẩn dụ hoặc chỉ như thực hành của Hội Thánh về sau.
  rationale: Bản Hy Lạp dùng một chuỗi mệnh lệnh số nhiều, chỉ những hành động cụ thể. Bản dịch không làm nhẹ nghĩa, cũng không tự mở rộng hay thu hẹp phạm vi áp dụng vượt quá câu văn.
- issue: Ý nghĩa của καθαρίζετε đối với người mắc bệnh phong
  choice: Dịch là 'làm cho ... được sạch' để giữ cả chiều kích chữa lành và thanh sạch theo nghi lễ.
  alternative: Chỉ dịch là 'chữa lành'.
  rationale: καθαρίζω nhấn mạnh việc được sạch, một ý niệm quan trọng trong bối cảnh bệnh da và luật thanh sạch; chỉ dịch 'chữa lành' sẽ làm mất chiều kích này.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh em” cho lời Chúa Giê-su nói với các môn đồ, tránh thêm quan hệ thần học không được biểu thị trong đại từ Hy Lạp. Cụm “nhận không… cho không” giữ nhịp song song cô đọng của nguyên văn.
