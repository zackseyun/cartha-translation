id: MAT.10.33
reference: Matthew 10:33
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὅστις ⸂δ’ ἂν⸃ ἀρνήσηταί με ἔμπροσθεν τῶν ἀνθρώπων, ἀρνήσομαι ⸂κἀγὼ αὐτὸν⸃ ἔμπροσθεν τοῦ πατρός μου τοῦ ⸀ἐν οὐρανοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/033.yaml
  text: But whoever denies me before men[b][a], I also will deny him before my Father who is in heaven.
translation:
  language: vi
  text: Nhưng ai chối Ta trước mặt mọi người, thì Ta cũng sẽ chối người ấy trước mặt Cha Ta, Đấng ở trên trời.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sát nghĩa: “Đấng ở trong các trời.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅστις δ’ ἂν
  choice: Nhưng ai
  rationale: ὅστις với ἄν diễn tả một trường hợp khái quát, còn δέ tạo thế tương phản với câu trước. “Nhưng ai” tự nhiên trong tiếng Việt và giữ được cả hai nét nghĩa.
- source_word: ἀρνήσηταί με
  choice: chối Ta
  rationale: ἀρνέομαι ở đây mang nghĩa công khai phủ nhận hoặc không nhận có quan hệ với Chúa Giê-su. “Chối” ngắn gọn, trang trọng và cho phép lặp lại cùng một động từ ở vế sau.
- source_word: ἔμπροσθεν τῶν ἀνθρώπων
  choice: trước mặt người đời
  rationale: ἔμπροσθεν chỉ sự hiện diện công khai; ἀνθρώπων có nghĩa khái quát là con người. “Người đời” diễn đạt tự nhiên phạm vi xã hội loài người, không giới hạn ở nam giới.
- source_word: ἀρνήσομαι κἀγὼ αὐτὸν
  choice: thì Ta cũng sẽ chối người ấy
  rationale: 'κἀγώ nhấn mạnh sự đáp lại tương ứng: “Ta cũng.” Lặp lại “chối” giữ nguyên tính đối xứng tu từ và thần học; “người ấy” chuyển tải đại từ quy chiếu mà không áp đặt giới tính trong tiếng Việt.'
- source_word: ἔμπροσθεν τοῦ πατρός μου
  choice: trước mặt Cha Ta
  rationale: Giữ sự song song với “trước mặt người đời” và chuyển tải trực tiếp cách Chúa Giê-su gọi Đức Chúa Trời là “Cha Ta.”
- source_word: τοῦ ἐν οὐρανοῖς
  choice: Đấng ở trên trời
  rationale: Cụm thuộc ngữ bổ nghĩa cho “Cha Ta.” “Đấng” giúp câu tiếng Việt rõ và trang trọng; số nhiều οὐρανοῖς được diễn đạt theo lối Việt tự nhiên là “trên trời,” với dạng sát chữ được ghi ở chú thích.
theological_decisions:
- issue: Tính đối ứng của lời chối bỏ
  choice: chối Ta ... Ta cũng sẽ chối người ấy
  alternative: không nhận Ta ... Ta cũng sẽ không nhận người ấy
  rationale: Dùng cùng một động từ cho hai lần ἀρνέομαι bảo toàn sự tương ứng nghiêm trọng trong lời cảnh báo mà không bổ sung cách giải thích thần học ngoài văn bản.
- issue: Phạm vi của ἀνθρώπων và đại từ αὐτόν
  choice: người đời ... người ấy
  alternative: những người nam ... người đó
  rationale: Trong ngữ cảnh, dạng số nhiều ἀνθρώπων có lực khái quát, chỉ loài người nói chung. Tiếng Việt không cần đánh dấu giống ở “người ấy,” nên bản dịch giữ đúng phạm vi phổ quát mà không làm mất thông tin ngữ nghĩa.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Viết hoa “Ta” và “Cha Ta” theo quy ước tôn kính; dùng “người đời” để diễn đạt tự nhiên ý nghĩa khái quát của ἀνθρώπων. Dấu chú thích [a] được đặt ngay sau cụm từ mà nó giải thích.
