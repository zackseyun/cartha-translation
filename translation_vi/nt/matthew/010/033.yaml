revisions:
- from: Nhưng ai chối Ta trước mặt người đời, thì Ta cũng sẽ chối người ấy trước mặt Cha Ta, Đấng ở trên trời.[a]
  to: Nhưng ai chối Ta trước mặt mọi người, thì Ta cũng sẽ chối người ấy trước mặt Cha Ta, Đấng ở trên trời.[a]
  rationale: Sửa “người đời” thành “mọi người” để diễn đạt trung tính và tự nhiên hơn nghĩa khái quát của ἀνθρώπων. Điều chỉnh chú thích để phản ánh số nhiều của οὐρανοῖς mà không thêm ý ‘các tầng’.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T02:45:17Z'
review_pass:
  verdict: revise
  source_fidelity: Bản dịch giữ được cấu trúc đối ứng của hai lần ἀρνέομαι, tương lai của ἀρνήσομαι qua “sẽ,” và quan hệ công khai do ἔμπροσθεν diễn tả. Tuy nhiên, “người đời” thường có sắc thái chỉ thế gian/người trần theo nghĩa đối lập hoặc đánh giá, không hoàn toàn trung tính như ἀνθρώπων trong câu này. “Mọi người” truyền đạt tự nhiên hơn phạm vi con người nói chung trong bối cảnh công khai.
  naturalness: Câu văn trang trọng, rõ ràng và phù hợp tiếng Việt hiện đại. Việc thay “người đời” bằng “mọi người” tránh một liên tưởng không cần thiết, trong khi vẫn giữ nhịp song song “trước mặt ... trước mặt ...”.
  terminology: “Chối Ta ... Ta cũng sẽ chối người ấy” giữ nhất quán động từ ἀρνέομαι và sắc thái nghiêm trọng của lời nói. “Cha Ta, Đấng ở trên trời” là cách gọi chuẩn mực và tự nhiên. Chú thích sát nghĩa nên tránh “các tầng trời,” vì “tầng” thêm ý phân tầng không có trong οὐρανοῖς.
  issues:
  - severity: medium
    issue: “người đời” có thể mang sắc thái ‘thế gian’ hơn là chỉ con người nói chung.
    rationale: τῶν ἀνθρώπων là số nhiều khái quát, nghĩa là con người/người ta. Trong tiếng Việt hiện đại, “người đời” đôi khi gợi một tập thể đời tục hoặc một đánh giá về ‘đời,’ là nét nghĩa không cần thiết ở đây.
  - severity: low
    issue: Chú thích “các tầng trời” thêm khái niệm ‘tầng’.
    rationale: οὐρανοῖς là dạng số nhiều của ‘trời/các trời’; bản thân từ này không khẳng định các tầng hay lớp trời. Chú thích nên giữ tính sát nghĩa mà không mở rộng hình ảnh.
  revised_text: Nhưng ai chối Ta trước mặt mọi người, thì Ta cũng sẽ chối người ấy trước mặt Cha Ta, Đấng ở trên trời.[a]
  revised_footnotes:
