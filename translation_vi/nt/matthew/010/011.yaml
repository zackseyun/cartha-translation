  source_fidelity: 'Chính văn bám sát câu Hy Lạp: mệnh đề bất định “bất cứ ... nào,” mệnh lệnh tìm hỏi, đánh giá “xứng đáng,” mệnh lệnh ở lại, và giới hạn “cho đến khi ... rời đi” đều được giữ. “Ở đó” diễn đạt tự nhiên ἐν αὐτῇ, còn “rồi ở lại đó” giữ được lực nối của κἀκεῖ mà không thêm chi tiết về nhà cửa.'
  naturalness: Bản dịch rõ ràng, hiện đại và có giọng văn Kinh Thánh vừa phải. “Thành hay làng” và “anh em” phù hợp ngữ cảnh lời sai phái một nhóm môn đồ. Cú pháp mạch lạc, không cần đổi chính văn.
  terminology: “Xứng đáng” là lựa chọn chuẩn cho ἄξιος và nên được giữ để không giải nghĩa quá mức trong chính văn. Chú thích cần tránh diễn đạt “lập công để được ... ban ơn,” vì cách nói ấy thêm khung khái niệm không có trực tiếp trong câu và dễ gợi một cơ chế thần học cụ thể hơn mức chú thích tiếng Anh.
  issues:
