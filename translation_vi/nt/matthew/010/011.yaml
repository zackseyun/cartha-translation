  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εἰς ἣν δ’ ἂν πόλιν ἢ κώμην εἰσέλθητε, ἐξετάσατε τίς ἐν αὐτῇ ἄξιός ἐστιν· κἀκεῖ μείνατε ἕως ἂν ἐξέλθητε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/011.yaml
  text: Into whatever city or village you enter[a], find out who in it is worthy[b], and stay there until you leave.
translation:
  language: vi
  text: Khi vào bất cứ thành hay làng nào, anh em hãy tìm hiểu xem ai ở đó là người xứng đáng[a], rồi ở lại đó cho đến khi anh em rời đi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Xứng đáng” ở đây có lẽ chỉ người thích hợp hoặc sẵn lòng tiếp đón các sứ giả, chứ không phải người đã tự mình kiếm được sự chấp nhận của Đức Chúa Trời.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς ἣν δ’ ἂν πόλιν ἢ κώμην εἰσέλθητε
  choice: Khi vào bất cứ thành hay làng nào
  rationale: Cách diễn đạt này giữ ý bất định của ἣν ... ἂν, động tác đi vào của εἰς/εἰσέλθητε, và sự phân biệt tự nhiên giữa πόλις với κώμη.
- source_word: ἐξετάσατε
  choice: hãy tìm hiểu
  rationale: Động từ chỉ việc dò hỏi hoặc xem xét có chủ ý. “Tìm hiểu” rõ ràng, tự nhiên trong tiếng Việt hiện đại mà không làm sắc thái mạnh quá thành điều tra chính thức.
- source_word: τίς ἐν αὐτῇ ἄξιός ἐστιν
  choice: xem ai ở đó là người xứng đáng
  rationale: Giữ câu hỏi về một người trong địa phương ấy và bảo toàn sắc thái đánh giá của ἄξιος, thay vì diễn giải ngay thành “hiếu khách” hay “sẵn lòng tiếp nhận”.
- source_word: κἀκεῖ μείνατε
  choice: rồi ở lại đó
  rationale: “Ở lại” diễn đạt tự nhiên mệnh lệnh μείνατε; “đó” giữ cách quy chiếu khá mở của ἐκεῖ mà không tự ý thêm “nhà người ấy” vào bản văn.
- source_word: ἕως ἂν ἐξέλθητε
  choice: cho đến khi anh em rời đi
  rationale: Diễn đạt tự nhiên giới hạn thời gian hướng tới lúc ra đi; chủ ngữ số nhiều được thể hiện bằng “anh em” theo ngữ cảnh Chúa Giê-su sai các môn đồ.
theological_decisions:
- issue: Ý nghĩa của “xứng đáng” trong lời chỉ dẫn truyền giáo
  choice: Giữ “người xứng đáng” trong chính văn và giải thích thận trọng trong chú thích là người thích hợp để tiếp đón các sứ giả.
  alternative: Dịch diễn giải là “người sẵn lòng tiếp đón anh em” hoặc hiểu theo nghĩa người có công trạng trước Đức Chúa Trời.
  rationale: ἄξιος có sắc thái xứng hợp/xứng đáng. Ngữ cảnh gợi đến tư cách thích hợp để tiếp nhận các môn đồ, nhưng chính văn không nói trực tiếp về công trạng cứu rỗi hay chỉ riêng thái độ hiếu khách; vì vậy cần giữ độ căng và tránh áp đặt giáo lý.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Anh em” thể hiện lời nói với nhóm môn đồ; không thêm danh xưng hay chi tiết về căn nhà vốn không hiện diện rõ trong câu Hy Lạp.
