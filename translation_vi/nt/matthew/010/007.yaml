source:
  edition: SBLGNT
  text: πορευόμενοι δὲ κηρύσσετε λέγοντες ὅτι Ἤγγικεν ἡ βασιλεία τῶν οὐρανῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/007.yaml
  text: And as you go[a], proclaim, saying[c][b], ‘The kingdom of heaven has drawn near.’
translation:
  language: vi
  text: 'Trên đường đi[a], hãy rao giảng[c] rằng: “Nước Trời[b] đã đến gần.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Khi đi” hoặc “Trong khi đi”.'
    reason: lexical_alternative
  - marker: b
    text: Ma-thi-ơ thường dùng cách nói “Nước Trời”, trong khi các sách Tin Mừng khác thường dùng “Nước Đức Chúa Trời”.
    reason: cross_reference
  - marker: c
    text: 'Dịch sát cấu trúc Hy Lạp: “hãy rao giảng, nói rằng”.'
    reason: source_structure
lexical_decisions:
- source_word: πορευόμενοι
  choice: Khi đi
  rationale: Phân từ hiện tại diễn tả hành động đi kèm mệnh lệnh chính; cách dịch này giữ được ý thời gian mà vẫn tự nhiên trong tiếng Việt.
- source_word: δὲ
  choice: không dịch thành một từ riêng
  rationale: Tiểu từ nối nhẹ với lời dặn trước đó; trong tiếng Việt, mạch nối đã rõ từ ngữ cảnh, nên thêm “và” sẽ kém tự nhiên.
- source_word: κηρύσσετε
  choice: hãy rao giảng
  rationale: Động từ chỉ việc công bố công khai với thẩm quyền. “Rao giảng” giữ được sắc thái ấy mà không thu hẹp thành một bài giảng trong nghi lễ.
- source_word: λέγοντες
  choice: dấu hai chấm sau “rao giảng”
  rationale: Phân từ này giới thiệu nội dung được công bố. Dấu hai chấm truyền đạt chức năng ấy tự nhiên hơn trong tiếng Việt, còn cách dịch sát cấu trúc được ghi ở chú thích.
- source_word: ὅτι
  choice: lời trích dẫn trực tiếp
  rationale: ὅτι giới thiệu nội dung lời rao giảng; đặt nội dung trong ngoặc kép phản ánh đúng chức năng mà không cần thêm “rằng” sau dấu hai chấm.
- source_word: ἤγγικεν
  choice: đã đến gần
  rationale: Thì hoàn thành diễn tả sự đến gần đã xảy ra và còn hiệu lực. “Đã đến gần” giữ cả kết quả hiện tại lẫn sắc thái trang trọng.
- source_word: ἡ βασιλεία
  choice: Vương quốc
  rationale: Cách dịch này có thể bao hàm cả lãnh vực cai trị lẫn quyền trị vì, không buộc câu chỉ mang một trong hai nghĩa.
- source_word: τῶν οὐρανῶν
  choice: thiên đàng
  rationale: Giữ nguyên cách nói đặc trưng của Ma-thi-ơ thay vì đồng nhất hóa thành “của Đức Chúa Trời”; số ít là cách diễn đạt tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Ý nghĩa của “Vương quốc thiên đàng”
  choice: Giữ “Vương quốc thiên đàng”
  alternative: quyền trị vì của thiên đàng; Vương quốc Đức Chúa Trời
  rationale: Giữ cách diễn đạt riêng của Ma-thi-ơ và độ rộng nghĩa của βασιλεία, không đồng nhất hóa với cách nói trong các sách khác hoặc thu hẹp thành chỉ quyền cai trị.
- issue: Thể của ἤγγικεν
  choice: đã đến gần
  alternative: ở gần; đã tới gần
  rationale: Phản ánh ý nghĩa kết quả hiện tại của thì hoàn thành mà không giải quyết thay bản văn những vấn đề thần học rộng hơn về thời điểm và mức độ hiện diện của Vương quốc.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Mệnh lệnh “hãy rao giảng” giữ sắc thái công bố công khai; dấu hai chấm tránh lối diễn đạt lặp “rao giảng, nói rằng” trong câu chính nhưng chú thích vẫn bảo tồn cấu trúc nguồn.
