review_pass:
  verdict: revise
  source_fidelity: Cần sửa thuật ngữ trung tâm. Τῶν οὐρανῶν là cách nói đặc trưng của Ma-thi-ơ về “trời/các tầng trời”; trong tiếng Việt Kinh Thánh hiện đại, “Nước Trời” truyền đạt cách nói này chính xác hơn. “Thiên đàng” thường chỉ cõi phúc lạc/paradise, nên “Vương quốc thiên đàng” có thể làm lệch nghĩa. Bản sửa vẫn giữ thể hoàn thành của ἤγγικεν bằng “đã đến gần” và giữ nội dung của λέγοντες qua “rằng”.
  naturalness: “Trên đường đi” tự nhiên hơn “Khi đi” trong câu mệnh lệnh độc lập, đồng thời vẫn diễn đạt phân từ πορευόμενοι như hành động đi kèm. “Hãy rao giảng rằng” là lối diễn đạt trang trọng, rõ ràng và tự nhiên trong văn phong Kinh Thánh tiếng Việt.
  terminology: Đổi “Vương quốc thiên đàng” thành “Nước Trời”. Đây là thuật ngữ quen dùng, vừa bảo tồn cách diễn đạt riêng của Ma-thi-ơ, vừa tránh đồng nhất hóa với “Nước Đức Chúa Trời”.
  issues:
  - severity: medium
    issue: “Vương quốc thiên đàng” dùng “thiên đàng” cho τῶν οὐρανῶν.
    rationale: “Thiên đàng” trong tiếng Việt thường gợi cõi phúc lạc hơn là cách nói Matthean “trời/các tầng trời”. “Nước Trời” là tương đương chuẩn xác và tự nhiên hơn trong ngữ cảnh này.
  - severity: low
    issue: “Khi đi” hơi cụt và kém tự nhiên trong câu mệnh lệnh đứng độc lập.
    rationale: “Trên đường đi” giữ nghĩa hành động đi kèm của πορευόμενοι và đọc trôi chảy hơn.
  revised_text: 'Trên đường đi[a], hãy rao giảng[c] rằng: “Nước Trời[b] đã đến gần.”'
