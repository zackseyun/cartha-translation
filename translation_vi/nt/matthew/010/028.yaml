id: MAT.10.28
reference: Matthew 10:28
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ μὴ ⸀φοβεῖσθε ἀπὸ τῶν ἀποκτεννόντων τὸ σῶμα τὴν δὲ ψυχὴν μὴ δυναμένων ἀποκτεῖναι· ⸁φοβεῖσθε δὲ μᾶλλον τὸν δυνάμενον ⸀καὶ ψυχὴν ⸁καὶ σῶμα ἀπολέσαι ἐν γεέννῃ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/028.yaml
  text: And do not fear those who kill the body but are not able to kill the soul. Rather[a], fear the one who is able to destroy both soul and body in Gehenna.
translation:
  language: vi
  text: Đừng sợ những kẻ giết thân thể nhưng không thể giết linh hồn. Trái lại, hãy sợ người có thể hủy diệt cả linh hồn lẫn thân thể trong Ghê-hen-na.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “trong địa ngục.” Từ Hy Lạp là “Ghê-hen-na,” bắt nguồn từ tên Thung lũng Hi-nôm và được dùng để chỉ nơi phán xét cuối cùng.'
    reason: lexical_alternative
lexical_decisions:
- source_word: φοβεῖσθε
  choice: sợ / hãy sợ
  rationale: Giữ cùng một động từ cốt lõi ở cả hai vế đối lập, phản ánh sự lặp lại trong tiếng Hy Lạp và duy trì sức nặng của lời cảnh báo.
- source_word: ἀπὸ τῶν ἀποκτεννόντων
  choice: những kẻ giết
  rationale: Phân từ có mạo từ chỉ một nhóm người nói chung; cách diễn đạt này tự nhiên và trực tiếp trong tiếng Việt.
- source_word: σῶμα
  choice: thân thể
  rationale: Cách dịch thông dụng, trang trọng và làm rõ sự tương phản với linh hồn.
- source_word: ψυχήν
  choice: linh hồn
  rationale: Trong thế tương phản với thân thể, từ này chỉ phương diện phi vật chất của con người; “sự sống” sẽ làm mờ sự tương phản được nêu rõ trong câu.
- source_word: μὴ δυναμένων ἀποκτεῖναι
  choice: không thể giết
  rationale: Diễn đạt tự nhiên trong tiếng Việt đồng thời giữ nguyên ý về sự bất lực.
- source_word: μᾶλλον
  choice: trái lại
  rationale: 'Thể hiện sự chuyển hướng tương phản: không sợ đối tượng này, nhưng phải sợ đối tượng kia.'
- source_word: τὸν δυνάμενον
  choice: Đấng có thể
  rationale: Giữ cách gọi không nêu danh tính như nguyên văn. Viết hoa “Đấng” là cách xưng gọi tự nhiên, trang trọng trong tiếng Việt, nhưng không chèn tên riêng vào câu.
- source_word: ἀπολέσαι
  choice: hủy diệt
  rationale: Truyền đạt tính chất nghiêm trọng và dứt khoát của sự phán xét mà không xác định thêm cơ chế siêu hình.
- source_word: ἐν γεέννῃ
  choice: trong Ghê-hen-na
  rationale: Phiên âm thuật ngữ Hy Lạp để bảo tồn bối cảnh Do Thái của địa danh/thuật ngữ này, thay vì thay trực tiếp bằng một từ mang nhiều liên tưởng thần học về sau.
theological_decisions:
- issue: Danh tính của “Đấng có thể hủy diệt cả linh hồn lẫn thân thể trong Ghê-hen-na”
  choice: 'Không nêu đích danh trong chính văn: “Đấng có thể”'
  alternative: Đức Chúa Trời; Sa-tan
  rationale: Theo ngữ cảnh, cách hiểu tự nhiên nhất là Đức Chúa Trời, Đấng có thẩm quyền phán xét cuối cùng; tuy nhiên, câu Hy Lạp không trực tiếp nêu danh tính, nên bản dịch giữ độ mở của nguyên văn.
- issue: Cách chuyển dịch γέεννα
  choice: Ghê-hen-na
  alternative: địa ngục
  rationale: Giữ thuật ngữ có nền tảng từ Thung lũng Hi-nôm và bối cảnh Do Thái; nghĩa quen thuộc “địa ngục” được cung cấp trong chú thích thay vì thay thế nguyên ngữ trong chính văn.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Cấu trúc đối lập được giữ rõ bằng “Đừng sợ … Trái lại, hãy sợ …”; “cả … lẫn …” phản ánh hai đối tượng ψυχή và σῶμα.
