  naturalness: Câu văn rõ ràng, trang trọng và tự nhiên. “Người có thể” vẫn tự nhiên trong văn cảnh này và giữ tính không xác định của nguyên văn tốt hơn. Chú thích cần chỉnh nhẹ để diễn đạt tự nhiên hơn.
  terminology: “Thân thể,” “linh hồn,” “hủy diệt,” và “Ghê-hen-na” phù hợp. Không nên viết hoa “Đấng” khi chủ ý dịch thuật là không xác định trực tiếp danh tính của nhân vật.
