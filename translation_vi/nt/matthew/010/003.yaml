id: MAT.10.3
reference: Matthew 10:3
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Φίλιππος καὶ Βαρθολομαῖος, Θωμᾶς καὶ Μαθθαῖος ὁ τελώνης, Ἰάκωβος ὁ τοῦ Ἁλφαίου καὶ ⸀Θαδδαῖος,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/003.yaml
  text: Philip and Bartholomew[a], Thomas and Matthew the tax collector, James the son of Alphaeus and Thaddaeus,
translation:
  language: vi
  text: Phi-líp và Ba-thê-lê-mi[a], Thô-ma và Ma-thi-ơ, người thu thuế, Gia-cơ con của An-phê và Tha-đê,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Một số thủ bản chép “Lê-bê” (hoặc “Lê-bê, được gọi là Tha-đê”); còn trong các danh sách sứ đồ của Lu-ca, tên ở vị trí tương ứng là “Giu-đa, con của Gia-cơ.”
    reason: textual_variant
lexical_decisions:
- source_word: Φίλιππος
  choice: Phi-líp
  rationale: Dùng dạng phiên âm quen thuộc trong Kinh Thánh tiếng Việt cho tên riêng Hy Lạp.
- source_word: Βαρθολομαῖος
  choice: Ba-thê-lê-mi
  rationale: Dùng dạng tên quen thuộc, dễ nhận biết đối với độc giả Kinh Thánh tiếng Việt.
- source_word: Θωμᾶς
  choice: Thô-ma
  rationale: Dùng dạng phiên âm đã phổ biến trong tiếng Việt.
- source_word: Μαθθαῖος
  choice: Ma-thi-ơ
  rationale: Dùng dạng phiên âm quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
- source_word: ὁ τελώνης
  choice: người thu thuế
  rationale: Diễn đạt rõ nghề nghiệp của Ma-thi-ơ bằng tiếng Việt hiện đại; tránh cách gọi cổ hoặc quá hẹp như người thu lệ phí.
- source_word: Ἰάκωβος
  choice: Gia-cơ
  rationale: Dùng dạng tên quen thuộc trong Tân Ước tiếng Việt để giữ khả năng nhận diện nhân vật.
- source_word: ὁ τοῦ Ἁλφαίου
  choice: con của An-phê
  rationale: Cấu trúc sở hữu Hy Lạp trong ngữ cảnh này chỉ quan hệ cha con; diễn đạt rõ ràng và tự nhiên trong tiếng Việt.
- source_word: Ἁλφαίου
  choice: An-phê
  rationale: Dùng dạng phiên âm quen thuộc của tên riêng này trong tiếng Việt.
- source_word: Θαδδαῖος
  choice: Tha-đê
  rationale: Theo trực tiếp cách đọc Θαδδαῖος của SBLGNT trong chính văn; các tên khác thuộc dị bản hoặc danh sách song song được nêu ở chú thích.
- source_word: καὶ
  choice: và
  rationale: Giữ phép nối đơn giản của danh sách Hy Lạp, đồng thời tạo câu tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Danh tính vị sứ đồ cuối cùng trong phần câu này
  choice: Tha-đê
  alternative: Lê-bê hoặc Giu-đa, con của Gia-cơ
  rationale: Chính văn SBLGNT đọc Θαδδαῖος, nên bản dịch giữ Tha-đê. Các dị bản thủ bản và cách gọi trong danh sách sứ đồ của Lu-ca được trình bày ở chú thích thay vì bị hòa giải vào chính văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ cấu trúc liệt kê của nguyên văn; thêm dấu phẩy quanh cụm đồng vị “người thu thuế” để tránh nhập nhằng. Các tên riêng dùng dạng phiên âm quen thuộc trong Kinh Thánh tiếng Việt.
