  - severity: low
    issue: “Bị giải đến trước” hơi kém tự nhiên trong văn phong hiện đại.
    rationale: “Bị đưa ra trước” diễn đạt tự nhiên hơn cho ἀχθήσεσθε trong bối cảnh bị áp giải/trình diện trước nhà cầm quyền, mà không thêm sắc thái bạo lực.
