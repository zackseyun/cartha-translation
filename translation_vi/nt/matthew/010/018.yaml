  terminology: Nên dùng “các tổng đốc và các vua” để phản ánh riêng biệt ἡγεμόνας và βασιλεῖς. “Làm chứng cho họ” bảo toàn sắc thái trung tính của αὐτοῖς; “các dân ngoại” là lựa chọn phù hợp cho τοῖς ἔθνεσιν trong ngữ cảnh Ma-thi-ơ. Các chú thích giữ đúng vị trí và nội dung cần thiết.
  issues:
