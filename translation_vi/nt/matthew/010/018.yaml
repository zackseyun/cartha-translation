  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἐπὶ ἡγεμόνας δὲ καὶ βασιλεῖς ἀχθήσεσθε ἕνεκεν ἐμοῦ εἰς μαρτύριον αὐτοῖς καὶ τοῖς ἔθνεσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/018.yaml
  text: And you will be brought before governors and kings because of me[b][a], as a testimony to them and to the Gentiles.
translation:
  language: vi
  text: Vì cớ tôi, anh em sẽ bị đưa ra trước các tổng đốc và các vua, để làm chứng cho họ[b] và cho các dân ngoại.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “các dân tộc.”
    reason: lexical_alternative
  - marker: b
    text: Trong ngữ cảnh, “cho họ” cũng có thể được hiểu là “chống lại họ,” dù tặng cách trong tiếng Hy Lạp tự nó không nói rõ điều đó.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπὶ ἡγεμόνας ... καὶ βασιλεῖς
  choice: đến trước các tổng đốc và vua chúa
  rationale: Sau động từ chỉ việc bị dẫn đi, ἐπί với đối cách diễn tả việc bị đưa ra trước mặt nhà cầm quyền. “Tổng đốc” phù hợp với ἡγεμών trong bối cảnh chính quyền, còn “vua chúa” diễn đạt tự nhiên số nhiều βασιλεῖς.
- source_word: ἀχθήσεσθε
  choice: sẽ bị giải
  rationale: Động từ tương lai bị động của ἄγω cho biết các môn đồ bị người khác đưa đi. “Bị giải” tự nhiên trong bối cảnh phải ra trước nhà cầm quyền, nhưng không hàm ý mức độ bạo lực mạnh như “bị lôi đi”.
- source_word: ἕνεκεν ἐμοῦ
  choice: vì cớ tôi
  rationale: ἕνεκεν với sở hữu cách nêu nguyên nhân. “Vì cớ tôi” giữ rõ sự quy chiếu về Đức Giê-su và có sắc thái trang trọng, dễ hiểu.
- source_word: εἰς μαρτύριον
  choice: để làm chứng
  rationale: 'Cụm từ biểu thị mục đích hoặc kết quả: việc họ bị đưa ra trước các nhà cầm quyền sẽ trở thành lời chứng. Cách diễn đạt bằng động từ tự nhiên hơn trong tiếng Việt mà vẫn giữ nội dung của danh từ μαρτύριον.'
- source_word: αὐτοῖς
  choice: cho họ
  rationale: Đại từ tặng cách tự nhiên nhất quy chiếu về các tổng đốc và vua chúa. “Cho họ” giữ cách hiểu trung tính; ngữ pháp Hy Lạp không tự nó xác định đây là lời chứng chống lại họ.
- source_word: τοῖς ἔθνεσιν
  choice: các dân ngoại
  rationale: Trong Ma-thi-ơ, ἔθνη thường chỉ những dân không thuộc Ít-ra-ên. “Các dân ngoại” thể hiện nghĩa có khả năng nhất, đồng thời chú thích bảo lưu nghĩa rộng hơn là “các dân tộc”.
theological_decisions:
- issue: Sắc thái của μαρτύριον αὐτοῖς
  choice: “làm chứng cho họ” theo nghĩa trung tính
  alternative: “làm chứng chống lại họ”
  rationale: Tặng cách αὐτοῖς không minh nhiên mang nghĩa đối nghịch. Bản dịch chính vì thế không quyết định trước lời chứng ấy là cơ hội để họ nghe hay là bằng chứng chống lại họ nếu họ khước từ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Anh em” được dùng để chỉ nhóm môn đồ mà Đức Giê-su đang trực tiếp phán dạy; “bị giải đến trước” gợi đúng bối cảnh pháp lý mà không cường điệu bạo lực. Các dấu chú thích được đặt ngay sau những cụm từ liên quan.
