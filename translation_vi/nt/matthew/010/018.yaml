revisions:
- from: Vì cớ tôi, anh em sẽ bị giải đến trước các tổng đốc và vua chúa, để làm chứng cho họ[b] và cho các dân ngoại.[a]
  to: Vì cớ tôi, anh em sẽ bị đưa ra trước các tổng đốc và các vua, để làm chứng cho họ[b] và cho các dân ngoại.[a]
  rationale: Thay “vua chúa” bằng “các vua” để không thêm danh xưng ngoài nguyên văn βασιλεῖς; thay “bị giải đến trước” bằng “bị đưa ra trước” để câu văn hiện đại và tự nhiên hơn, vẫn phản ánh chính xác thể bị động tương lai của ἄγω và bối cảnh trình diện trước nhà cầm quyền. Những phần còn lại, kể cả hai chú thích, được giữ vì bảo toàn đúng các khả năng ngữ nghĩa của τοῖς ἔθνεσιν và αὐτοῖς.
  reviewer_model: gpt-5.6-terra
