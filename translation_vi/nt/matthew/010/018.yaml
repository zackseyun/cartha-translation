  source_fidelity: 'Bản dịch truyền đạt đúng cấu trúc và ý chính của câu: các môn đồ sẽ bị đưa ra trước giới cầm quyền vì Đức Giê-su, và sự việc ấy trở thành lời chứng cho họ cùng các dân ngoại. Tuy nhiên, “vua chúa” không phải là tương đương chính xác của βασιλεῖς; từ “chúa” thêm một danh xưng không có trong nguyên văn. “Các vua” giữ đúng nghĩa và vẫn tự nhiên.'
