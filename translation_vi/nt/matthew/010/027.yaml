  to: Điều Thầy nói với các con trong bóng tối[a], hãy nói trong ánh sáng; và điều các con nghe rỉ tai[b], hãy rao truyền trên mái nhà.
  rationale: Chỉnh sửa giới hạn ở những chỗ cần thiết để tiếng Việt hiện đại tự nhiên hơn. Bản sửa vẫn giữ nguyên các hình ảnh, tính đối xứng và hàm ý từ điều được tiếp nhận riêng tư đến sự rao truyền công khai; chú thích nêu rõ hình ảnh “vào tai” của nguyên văn thay vì biến chính văn thành một diễn giải thuần túy.
