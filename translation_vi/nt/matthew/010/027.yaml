id: MAT.10.27
reference: Matthew 10:27
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὃ λέγω ὑμῖν ἐν τῇ σκοτίᾳ, εἴπατε ἐν τῷ φωτί· καὶ ὃ εἰς τὸ οὖς ἀκούετε, κηρύξατε ἐπὶ τῶν δωμάτων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/027.yaml
  text: What I tell you in the darkness[a], say in the light; and what you hear in the ear[b], proclaim on the housetops.
translation:
  language: vi
  text: Điều Thầy nói với các con trong bóng tối[a], hãy nói trong ánh sáng; và điều các con nghe rỉ tai[b], hãy rao truyền trên mái nhà.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể hiểu là “trong chỗ kín đáo… công khai”; nguyên văn Hy Lạp giữ hình ảnh “trong bóng tối… trong ánh sáng”.
    reason: lexical_alternative
  - marker: b
    text: Cụm “nghe rỉ tai” diễn tả điều được nghe riêng tư. Nguyên văn dùng hình ảnh “nghe vào tai”; nhà thời xưa thường có mái bằng, nên “trên mái nhà” gợi một nơi cao, dễ thấy, thích hợp để công bố cho nhiều người.
    reason: cultural_note
lexical_decisions:
- source_word: ὃ λέγω ὑμῖν
  choice: Điều Thầy nói với các con
  rationale: Diễn đạt tự nhiên quan hệ thầy-trò trong ngữ cảnh Chúa Giê-su sai phái các môn đồ; “điều” giữ chức năng danh từ của đại từ quan hệ ὃ.
- source_word: ἐν τῇ σκοτίᾳ
  choice: trong bóng tối
  rationale: Giữ nguyên hình ảnh Hy Lạp và sự đối lập trực tiếp với “giữa ánh sáng”, thay vì giải nghĩa ngay thành “kín đáo”.
- source_word: εἴπατε
  choice: hãy nói ra
  rationale: Thể mệnh lệnh được thể hiện bằng “hãy”; “ra” làm rõ sự chuyển từ điều kín đáo sang lời nói công khai mà không xóa bỏ hình ảnh.
- source_word: ἐν τῷ φωτί
  choice: giữa ánh sáng
  rationale: Giữ hình ảnh đối ứng với “trong bóng tối”; “giữa” tạo cách diễn đạt tiếng Việt tự nhiên.
- source_word: εἰς τὸ οὖς ἀκούετε
  choice: điều các con nghe bên tai
  rationale: Giữ hình ảnh truyền đạt sát tai, mang nghĩa riêng tư. “Bên tai” tự nhiên hơn lối dịch máy móc “vào tai” trong tiếng Việt.
- source_word: κηρύξατε
  choice: hãy công bố
  rationale: Truyền đạt ý rao báo công khai của κηρύσσω mà không thu hẹp thành việc giảng đạo theo nghĩa chuyên biệt.
- source_word: ἐπὶ τῶν δωμάτων
  choice: trên mái nhà
  rationale: Giữ hình ảnh văn hóa về mái bằng của nhà cổ, là nơi cao và dễ được công chúng nghe thấy.
theological_decisions:
- issue: Nên giữ nguyên hình ảnh bóng tối/ánh sáng và bên tai/mái nhà hay chuyển hoàn toàn thành kín đáo/công khai
  choice: Giữ các hình ảnh trong chính văn và giải thích hàm ý bằng chú thích.
  alternative: 'Dịch diễn giải: “Điều Thầy nói riêng, hãy nói công khai; điều được nói thầm với các con, hãy loan báo cho mọi người.”'
  rationale: Lời Hy Lạp dùng những cặp hình ảnh sống động để nhấn mạnh việc đưa sứ điệp từ chỗ riêng tư ra công khai. Giữ hình ảnh bảo toàn sức tu từ và không loại bỏ khả năng người đọc nhận ra cả nghĩa cụ thể lẫn nghĩa hàm ẩn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng cặp xưng hô “Thầy—các con” để phản ánh lời Chúa Giê-su nói trực tiếp với nhóm môn đồ trong ngữ cảnh, đồng thời tránh lối cổ “các ngươi”. Các hình ảnh cốt lõi của nguyên văn được giữ lại, với chú thích ngắn để hỗ trợ độc giả hiện đại.
