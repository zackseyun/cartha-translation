  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: μὴ οὖν ⸀φοβεῖσθε· πολλῶν στρουθίων διαφέρετε ὑμεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/031.yaml
  text: Therefore[a], do not be afraid; you are worth more than many sparrows.
translation:
  language: vi
  text: Vậy, đừng sợ; anh em quý giá hơn nhiều chim sẻ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “anh em có giá trị hơn nhiều chim sẻ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ οὖν φοβεῖσθε
  choice: Vậy, đừng sợ
  rationale: οὖν nêu kết luận từ lời khẳng định ngay trước đó về sự chăm sóc của Cha; μὴ với mệnh lệnh hiện tại φοβεῖσθε tạo thành lời ngăn cấm. “Vậy, đừng sợ” tự nhiên và giữ rõ quan hệ suy luận.
- source_word: πολλῶν στρουθίων
  choice: nhiều chim sẻ
  rationale: Trong ngữ cảnh gần, στρουθίον chỉ chim sẻ; sở hữu cách đi sau διαφέρετε mang ý so sánh.
- source_word: διαφέρετε
  choice: quý giá hơn
  rationale: Ở đây διαφέρω có nghĩa vượt hơn về giá trị hay tầm quan trọng, chứ không chỉ là khác biệt. “Quý giá hơn” diễn đạt tự nhiên ý so sánh trong bối cảnh nói về sự chăm sóc của Đức Chúa Trời.
- source_word: ὑμεῖς
  choice: các con
  rationale: Đại từ được nêu tường minh trong tiếng Hy Lạp để nhấn mạnh những người Đức Chúa Jesus đang trực tiếp dạy bảo. “Các con” phù hợp lời thầy nói với các môn đồ và phân biệt số nhiều, dù tiếng Việt không cần thêm từ phản thân để thể hiện trọng âm.
theological_decisions:
- issue: Giá trị tương đối của các môn đồ và chim sẻ trong lời dạy của Đức Chúa Jesus
  choice: các con quý giá hơn nhiều chim sẻ
  alternative: các con đáng giá hơn nhiều chim sẻ
  rationale: Cách dịch giữ lực so sánh của διαφέρετε và nhấn mạnh sự chăm sóc lớn hơn dành cho các môn đồ, nhưng không hàm ý Đức Chúa Trời không quan tâm đến loài vật.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “các con” để thể hiện lời Đức Chúa Jesus trực tiếp nói với nhóm môn đồ; giữ dấu chấm phẩy nhằm bảo toàn quan hệ chặt chẽ giữa mệnh lệnh và lý do.
