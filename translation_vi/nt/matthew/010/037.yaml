id: MAT.10.37
reference: Matthew 10:37
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὁ φιλῶν πατέρα ἢ μητέρα ὑπὲρ ἐμὲ οὐκ ἔστιν μου ἄξιος· καὶ ὁ φιλῶν υἱὸν ἢ θυγατέρα ὑπὲρ ἐμὲ οὐκ ἔστιν μου ἄξιος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/037.yaml
  text: The one who loves father or mother more than me is not worthy of me[a], and the one who loves son or daughter more than me is not worthy of me.
translation:
  language: vi
  text: Ai yêu cha hoặc mẹ hơn tôi thì không xứng đáng với tôi; và ai yêu con trai hoặc con gái hơn tôi thì không xứng đáng với tôi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ φιλῶν
  choice: ai yêu
  rationale: Mạo từ đi với phân từ hiện tại tạo thành cách gọi khái quát về người có hành động này. “Ai yêu” tự nhiên trong tiếng Việt hiện đại và giữ được ý nghĩa bao quát.
- source_word: πατέρα ἢ μητέρα
  choice: cha hoặc mẹ
  rationale: Dịch trực tiếp các danh từ chỉ quan hệ, không thêm đại từ sở hữu vốn không được nói rõ trong tiếng Hy Lạp.
- source_word: ὑπὲρ ἐμέ
  choice: hơn tôi
  rationale: Trong cấu trúc so sánh này, ὑπέρ diễn tả mức độ yêu hoặc sự ưu tiên cao hơn. “Hơn tôi” là cách diễn đạt rõ ràng, tự nhiên trong tiếng Việt.
- source_word: οὐκ ἔστιν μου ἄξιος
  choice: không xứng đáng với tôi
  rationale: Giữ sát cấu trúc ἄξιος với sở hữu cách μου mà không thêm ý giải thích như “thuộc về tôi” hay “làm môn đồ tôi”.
- source_word: καὶ
  choice: và
  rationale: Liên từ đơn giản giữ nguyên cấu trúc song song giữa hai mệnh đề.
- source_word: υἱὸν ἢ θυγατέρα
  choice: con trai hoặc con gái
  rationale: Dịch trực tiếp các danh từ chỉ quan hệ và không thêm đại từ sở hữu không có trong nguyên văn.
theological_decisions:
- issue: Đòi hỏi của Chúa Giê-su đối với lòng yêu thương và sự gắn bó với gia đình
  choice: Bản dịch thể hiện rằng Chúa Giê-su phải được yêu hơn cả những người thân gần gũi nhất.
  alternative: Diễn giải nhẹ hơn rằng người ta chỉ cần yêu Chúa Giê-su ngang bằng gia đình, hoặc mạnh hơn rằng phải ghét gia đình.
  rationale: Nguyên văn dùng phép so sánh “hơn tôi” và tuyên bố “không xứng đáng với tôi”. Bản dịch giữ nguyên đòi hỏi mạnh mẽ về thứ tự ưu tiên nhưng không biến nó thành sự phủ nhận tình yêu gia đình.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “tôi” giữ lời nói trực tiếp của Chúa Giê-su theo lối tự xưng tự nhiên trong tiếng Việt, đồng thời tránh tự ý nâng hoặc hạ sắc thái quan hệ. Dấu chấm phẩy làm rõ hai vế song song.
