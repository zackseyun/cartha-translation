id: MAT.10.35
reference: Matthew 10:35
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἦλθον γὰρ διχάσαι ἄνθρωπον κατὰ τοῦ πατρὸς αὐτοῦ καὶ θυγατέρα κατὰ τῆς μητρὸς αὐτῆς καὶ νύμφην κατὰ τῆς πενθερᾶς αὐτῆς,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/035.yaml
  text: For I came to set a man against his father[a], and a daughter against her mother, and a daughter-in-law against her mother-in-law[b],
translation:
  language: vi
  text: Vì tôi đã đến để khiến một người đàn ông chống lại cha mình[a], con gái chống lại mẹ mình, và con dâu chống lại mẹ chồng mình[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “chia rẽ”; động từ Hy Lạp mang nghĩa gây chia rẽ, còn các cụm “chống lại” theo sau làm rõ sự đối nghịch trong quan hệ.
    reason: lexical_alternative
  - marker: b
    text: Từ Hy Lạp νύμφη trong một số ngữ cảnh có thể có nghĩa là “cô dâu”; ở đây từ này có nghĩa là “con dâu” vì được đặt song song với “mẹ chồng.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθον
  choice: tôi đến
  rationale: Động từ aorist trong lời nói này chỉ việc Đức Giê-su đến và sứ mạng của ngài; cách diễn đạt này tự nhiên trong tiếng Việt và không buộc phải thêm sắc thái hoàn thành.
- source_word: γὰρ
  choice: Vì
  rationale: Giữ chức năng giải thích của liên từ đối với lời tuyên bố ngay trước đó.
- source_word: διχάσαι
  choice: để khiến ... chống lại
  rationale: Động từ có nghĩa là chia rẽ hoặc gây phân rẽ; các cụm κατά với sở hữu cách theo sau làm rõ rằng đây là sự đối nghịch trong quan hệ gia đình.
- source_word: ἄνθρωπον
  choice: một người đàn ông
  rationale: Dù ἄνθρωπος đôi khi mang nghĩa chung là con người, tại đây nó đứng trong chuỗi song song với con gái và con dâu, nên giữ nét giống đực là thích hợp.
- source_word: κατὰ τοῦ πατρὸς αὐτοῦ
  choice: chống lại cha mình
  rationale: κατά với sở hữu cách diễn tả sự đối nghịch; “cha mình” thể hiện tự nhiên quan hệ quy chiếu trong tiếng Việt.
- source_word: θυγατέρα
  choice: con gái
  rationale: Tương đương trực tiếp, tự nhiên của danh từ chỉ người con thuộc giới nữ.
- source_word: κατὰ τῆς μητρὸς αὐτῆς
  choice: chống lại mẹ mình
  rationale: Giữ cấu trúc đối nghịch lặp lại, đồng thời dùng đại từ phản thân tự nhiên trong tiếng Việt.
- source_word: νύμφην
  choice: con dâu
  rationale: νύμφη có thể chỉ cô dâu, nhưng khi đi đôi với πενθερά thì nghĩa quan hệ gia đình “con dâu” là phù hợp.
- source_word: κατὰ τῆς πενθερᾶς αὐτῆς
  choice: chống lại mẹ chồng mình
  rationale: “Mẹ chồng” là cách gọi tự nhiên trong tiếng Việt đối với mẹ của chồng nhìn từ người con dâu; cụm từ duy trì mô hình đối nghịch trong gia đình.
theological_decisions:
- issue: Tính chất sứ mạng được Đức Giê-su tuyên bố
  choice: Giữ cách nói mạnh rằng ngài đến để khiến các thành viên gia đình chống lại nhau.
  alternative: Diễn giải rằng lòng trung thành với Đức Giê-su chỉ vô tình dẫn đến bách hại hoặc xung đột gia đình.
  rationale: Bản Hy Lạp trình bày trực tiếp sự chia rẽ như mục đích hoặc kết quả gắn với việc ngài đến. Bản dịch cần giữ nguyên sức căng thần học ấy, không làm nhẹ câu nói cũng không thêm lời giải thích thần học vào chính văn.
translation_notes:
  register: Dùng tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Đại từ “tôi” giữ lời nói trực tiếp tự nhiên mà không đưa thêm lối xưng hô mang dấu ấn hệ phái. Phép lặp “chống lại” bảo toàn nhịp và sức nặng của ba cấu trúc song song trong nguyên văn.
