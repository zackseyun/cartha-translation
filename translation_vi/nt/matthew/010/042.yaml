    issue: Chú thích b đặt neo ở cuối câu thay vì ngay sau “những người bé mọn này”.
    rationale: Nội dung chú thích chỉ giải thích cụm “những người bé mọn”; neo ở cuối câu có thể khiến người đọc hiểu nhầm chú thích giải thích “phần thưởng” hoặc toàn bộ mệnh đề. Cần chuyển [b] đến cụm được chú giải.
  - severity: low
    issue: Cách dịch sát trong chú thích a là “trong danh nghĩa một môn đồ”.
    rationale: Cụm này gượng và không phải tương đương hình thức thông dụng của εἰς ὄνομα μαθητοῦ. “nhân danh một môn đồ” là cách dịch sát tự nhiên hơn; bản chính “vì người ấy là môn đồ” vẫn diễn đạt đúng lực ngữ cảnh.
  - severity: low
    issue: “tôi thật nói với anh em” hơi thiếu tự nhiên trong tiếng Việt hiện đại.
    rationale: “Quả thật, tôi nói với anh em” giữ nguyên tính trang trọng và xác quyết của công thức nguồn nhưng trôi chảy hơn.
