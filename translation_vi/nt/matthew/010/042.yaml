id: MAT.10.42
reference: Matthew 10:42
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ὃς ⸀ἂν ποτίσῃ ἕνα τῶν μικρῶν τούτων ποτήριον ψυχροῦ μόνον εἰς ὄνομα μαθητοῦ, ἀμὴν λέγω ὑμῖν, οὐ μὴ ἀπολέσῃ τὸν μισθὸν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/042.yaml
  text: And whoever gives one of these little ones even a cup of cold water in the name of a disciple[a], truly I say to you[b], he will certainly not lose his reward.
translation:
  language: vi
  text: 'Và bất cứ ai cho một trong những người bé mọn này[b] uống dù chỉ một chén nước lạnh vì người ấy là môn đồ[a], quả thật, tôi nói với anh em: người đó chắc chắn sẽ không mất phần thưởng của mình.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch sát hơn: “nhân danh một môn đồ.” Cụm từ Hy Lạp cho biết hành động được thực hiện vì người nhận mang căn tính môn đồ.'
    reason: alternative_reading
  - marker: b
    text: “Những người bé mọn” ở đây, theo ngữ cảnh, có lẽ chỉ những người có địa vị thấp hoặc ít được coi trọng trong số những người theo Chúa Giê-su, chứ không nhất thiết chỉ là trẻ em.
    reason: cross_reference
lexical_decisions:
- source_word: ὃς ἂν
  choice: bất cứ ai
  rationale: Đại từ quan hệ đi với ἄν mang ý nghĩa phiếm chỉ, khái quát; “bất cứ ai” tự nhiên và giữ được tính rộng mở của lời tuyên bố.
- source_word: ποτίσῃ
  choice: cho … uống
  rationale: Diễn đạt trực tiếp nghĩa của động từ là cho người khác uống, đồng thời tự nhiên trong cấu trúc tiếng Việt.
- source_word: ἕνα τῶν μικρῶν τούτων
  choice: một trong những người bé mọn này
  rationale: “Bé mọn” giữ được sắc thái thấp kém, ít được coi trọng mà không giới hạn đối tượng vào trẻ em.
- source_word: ποτήριον ψυχροῦ
  choice: một chén nước lạnh
  rationale: Danh từ chỉ nước được hàm ý trong tiếng Hy Lạp; “chén nước lạnh” là cách diễn đạt rõ ràng, quen thuộc và thể hiện món quà rất đơn sơ.
- source_word: μόνον
  choice: dù chỉ
  rationale: Cụm này nhấn mạnh sự nhỏ bé, tối thiểu của hành động, tương ứng tự nhiên với μόνον trong ngữ cảnh.
- source_word: εἰς ὄνομα μαθητοῦ
  choice: vì người ấy là môn đồ
  rationale: Diễn đạt ý hành động được thực hiện vì căn tính môn đồ của người nhận, tránh khiến “nhân danh” bị hiểu như một công thức tuyên xưng; cách dịch sát hình thức được ghi ở chú thích.
- source_word: ἀμὴν λέγω ὑμῖν
  choice: tôi thật nói với anh em
  rationale: Giữ sức nặng trang trọng, xác quyết của công thức ἀμήν, đồng thời dùng ngôn ngữ hiện đại và dễ hiểu.
- source_word: οὐ μὴ ἀπολέσῃ
  choice: chắc chắn sẽ không mất
  rationale: Hai yếu tố phủ định tạo lời phủ định nhấn mạnh; cách dịch này truyền đạt rõ sự bảo đảm mạnh mẽ.
- source_word: τὸν μισθὸν αὐτοῦ
  choice: phần thưởng của mình
  rationale: Trong ngữ cảnh môn đồ, μισθός phù hợp nhất với “phần thưởng”; “của mình” quy chiếu tự nhiên về người thực hiện hành động.
theological_decisions:
- issue: Đối tượng của cụm “những người bé mọn này”
  choice: Giữ cách gọi rộng là “những người bé mọn này”, không đồng nhất riêng với trẻ em.
  alternative: “những trẻ nhỏ này” hoặc chỉ những tín hữu mới hay yếu đuối
  rationale: Ngữ cảnh nói đến việc tiếp nhận các môn đồ, nhưng chính cách diễn đạt vẫn gợi sự nhỏ bé và địa vị thấp. Bản dịch không thu hẹp sự mơ hồ chính đáng của câu.
- issue: Ý nghĩa của εἰς ὄνομα μαθητοῦ
  choice: Dịch theo chức năng là “vì người ấy là môn đồ”, kèm chú thích cách dịch sát hình thức.
  alternative: “nhân danh một môn đồ” hoặc “trong danh nghĩa một môn đồ”
  rationale: Cụm từ chỉ căn cứ khiến người ta thực hiện hành động—căn tính môn đồ của người nhận. Cách dịch chính làm rõ ý này mà không áp đặt sắc thái nghi lễ hay công thức.
- issue: Bản chất của “phần thưởng”
  choice: Giữ nguyên khái niệm “phần thưởng” mà không giải thích nguồn, thời điểm hay hình thức.
  alternative: Diễn giải thành phần thưởng đời đời, sự cứu rỗi, hoặc sự đền đáp trong đời này
  rationale: Câu văn không xác định chi tiết; việc không diễn giải bảo toàn sự dè dặt và căng thẳng thần học của nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “anh em” cho ὑμῖν số nhiều trong lời Chúa Giê-su nói với các môn đồ. “Bé mọn” giữ sắc thái Kinh Thánh quen thuộc nhưng vẫn rõ nghĩa; “chén nước lạnh” tự nhiên và dignified trong tiếng Việt.
