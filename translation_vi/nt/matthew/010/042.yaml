- from: 'Và bất cứ ai cho một trong những người bé mọn này uống dù chỉ một chén nước lạnh vì người ấy là môn đồ[a], tôi thật nói với anh em: người đó chắc chắn sẽ không mất phần thưởng của mình.[b]'
