  rationale: 'Chỉ sửa những điểm an toàn về tính tự nhiên và cấu trúc chú thích: chuyển neo chú thích b về đúng cụm từ được giải thích, chuẩn hóa cách dịch sát trong chú thích a, và làm trôi chảy công thức long trọng. Ý nghĩa của câu và sự dè dặt trước các cách hiểu thu hẹp về “những người bé mọn” hoặc bản chất phần thưởng đều được giữ nguyên.'
  reviewer_model: gpt-5.6-terra
