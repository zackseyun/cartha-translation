id: MAT.10.39
reference: Matthew 10:39
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὁ εὑρὼν τὴν ψυχὴν αὐτοῦ ἀπολέσει αὐτήν, καὶ ὁ ἀπολέσας τὴν ψυχὴν αὐτοῦ ἕνεκεν ἐμοῦ εὑρήσει αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/039.yaml
  text: The one who finds his life will lose it[a], and the one who loses his life for my sake will find it.
translation:
  language: vi
  text: Ai tìm được mạng sống mình thì sẽ mất nó,[a] còn ai vì tôi mà mất mạng sống mình thì sẽ tìm được nó.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch “linh hồn” ở cả hai vế. Từ Hy Lạp ψυχή có thể chỉ “mạng sống” hoặc “linh hồn”; trong ngữ cảnh này, “mạng sống” phù hợp hơn với việc mất và tìm được mạng sống trên con đường làm môn đồ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ εὑρὼν
  choice: Ai tìm được
  rationale: Mạo từ đi với phân từ aorist tạo thành một cách gọi người mang nghĩa khái quát. “Ai” tự nhiên trong tiếng Việt hiện đại và giữ được tính phổ quát của câu.
- source_word: τὴν ψυχὴν αὐτοῦ
  choice: mạng sống mình
  rationale: Trong ngữ cảnh môn đồ có thể phải đối diện cái chết, ψυχή chủ yếu chỉ mạng sống. “Mình” quy chiếu tự nhiên về chủ thể “ai” mà không áp đặt giới tính.
- source_word: ἀπολέσει αὐτήν
  choice: sẽ mất nó
  rationale: Ở đây ἀπόλλυμι diễn tả sự mất mạng sống, không nhất thiết là hủy diệt. “Mất” duy trì thế đối lập nghịch lý với “tìm được”; “nó” giữ đại từ chỉ lại mạng sống.
- source_word: ὁ ἀπολέσας
  choice: ai ... mất
  rationale: Dù phân từ ở thì aorist, cấu trúc châm ngôn mang nghĩa khái quát; tiếng Việt dùng “ai ... mất” tự nhiên hơn cách biểu đạt một hành động quá khứ đã hoàn tất.
- source_word: ἕνεκεν ἐμοῦ
  choice: vì tôi
  rationale: Cụm này chỉ nguyên nhân hoặc động cơ liên quan đến Chúa Giê-su. “Vì tôi” ngắn gọn, tự nhiên và bảo toàn trọng tâm về lòng trung thành với chính Người.
- source_word: εὑρήσει αὐτήν
  choice: sẽ tìm lại được
  rationale: “Tìm lại được” diễn đạt tự nhiên việc có lại điều đã mất, đồng thời vẫn giữ sự lặp lại có chủ ý của động từ “tìm” trong nguyên văn.
theological_decisions:
- issue: Cách dịch ψυχή trong nghịch lý về đời môn đồ
  choice: mạng sống
  alternative: linh hồn; sự sống
  rationale: Ngữ cảnh Ma-thi-ơ 10 nói đến nguy cơ mất mạng vì trung thành với Chúa Giê-su, nên “mạng sống” phù hợp hơn “linh hồn” và tránh đưa vào đây sự phân biệt thân xác–linh hồn mà câu không trực tiếp nhấn mạnh. Chú thích vẫn bảo tồn phạm vi nghĩa rộng hơn của từ Hy Lạp.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Cấu trúc song song được giữ để làm nổi bật nghịch lý. Dùng “tôi” theo lời trực tiếp của Chúa Giê-su, phù hợp lối diễn đạt tiếng Việt phổ thông; dùng “ai/mình” thay vì đại từ giống đực vì tiếng Việt không đánh dấu giống trong cấu trúc khái quát này.
