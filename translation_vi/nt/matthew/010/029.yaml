id: MAT.10.29
reference: Matthew 10:29
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οὐχὶ δύο στρουθία ἀσσαρίου πωλεῖται; καὶ ἓν ἐξ αὐτῶν οὐ πεσεῖται ἐπὶ τὴν γῆν ἄνευ τοῦ πατρὸς ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/029.yaml
  text: Are not two sparrows sold for an assarion? Yet not one of them will fall to the ground apart from your Father[a][b].
translation:
  language: vi
  text: Chẳng phải hai con chim sẻ được bán với giá một đồng át-sa-ri[b] sao? Thế mà không một con nào trong chúng rơi xuống đất mà không tách khỏi Cha của anh em[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể diễn đạt là “mà không có Cha của anh em”. Cụm từ này có thể hàm ý không ngoài sự biết, sự chăm sóc hoặc ý muốn của Ngài, nhưng tiếng Hy Lạp không nói rõ là phương diện nào.
    reason: alternative_reading
  - marker: b
    text: Át-sa-ri là một đồng tiền nhỏ bằng đồng của La Mã, có giá trị rất thấp.
    reason: cultural_note
lexical_decisions:
- source_word: στρουθία
  choice: chim sẻ
  rationale: Trong ngữ cảnh này, từ này thường chỉ chim sẻ; cách dịch cụ thể này tự nhiên hơn từ khái quát “chim nhỏ”.
- source_word: ἀσσαρίου
  choice: một đồng át-sa-ri
  rationale: Giữ tên đồng tiền La Mã cụ thể trong nguyên văn, đồng thời thêm “đồng” để người đọc tiếng Việt nhận ra đây là tiền; chú thích giải thích giá trị rất thấp của nó.
- source_word: πωλεῖται
  choice: được bán với giá
  rationale: Diễn đạt tự nhiên thể bị động hiện tại và giữ rõ ý mua bán.
- source_word: ἓν ἐξ αὐτῶν
  choice: một con nào trong chúng
  rationale: Thể hiện tự nhiên cấu trúc chỉ một cá thể thuộc nhóm đã nhắc đến; kết hợp với phủ định thành “không một con nào trong chúng”.
- source_word: πεσεῖται ἐπὶ τὴν γῆν
  choice: rơi xuống đất
  rationale: Cách diễn đạt tiếng Việt tự nhiên, sát nghĩa chuyển động hướng xuống mặt đất.
- source_word: ἄνευ τοῦ πατρὸς ὑμῶν
  choice: mà không có Cha của anh em
  rationale: Giữ cấu trúc rộng và chưa xác định của ἄνευ, không tự ý bổ sung “sự biết”, “sự cho phép” hay “ý muốn” của Cha. Chú thích bảo toàn các khả năng diễn giải.
- source_word: οὐχὶ ... ;
  choice: Chẳng phải ... sao?
  rationale: Truyền đạt câu hỏi tu từ mong đợi câu trả lời khẳng định bằng một cấu trúc tiếng Việt tự nhiên.
- source_word: καὶ
  choice: Thế mà
  rationale: 'Trong ngữ cảnh, liên từ làm nổi bật sự tương phản: dù chim sẻ có giá trị rất thấp, không một con nào lại ở ngoài mối liên hệ với Cha.'
theological_decisions:
- issue: Ý nghĩa của cụm “không có Cha của anh em” đối với sự quan phòng của Đức Chúa Trời
  choice: Giữ cách nói rộng “mà không có Cha của anh em”, không xác định cụ thể phương diện liên hệ của Cha.
  alternative: “mà Cha của anh em không biết” hoặc “nếu Cha của anh em không cho phép”
  rationale: Câu này khẳng định sự liên hệ quan phòng của Cha, nhưng tiếng Hy Lạp không nói rõ đó cụ thể là sự biết, chăm sóc, hiện diện, cho phép hay ý muốn. Bản dịch vì thế không thu hẹp sự mơ hồ có thật của nguyên văn.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “anh em” cho đại từ số nhiều ὑμῶν trong lời Đức Giê-su nói với các môn đồ; viết hoa “Cha” để chỉ Đức Chúa Trời. Cách phiên âm “át-sa-ri” giữ sắc thái lịch sử mà vẫn đọc được tự nhiên.
