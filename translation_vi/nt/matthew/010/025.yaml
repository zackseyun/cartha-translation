id: MAT.10.25
reference: Matthew 10:25
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀρκετὸν τῷ μαθητῇ ἵνα γένηται ὡς ὁ διδάσκαλος αὐτοῦ, καὶ ὁ δοῦλος ὡς ὁ κύριος αὐτοῦ. εἰ τὸν οἰκοδεσπότην Βεελζεβοὺλ ⸀ἐπεκάλεσαν, πόσῳ μᾶλλον τοὺς οἰκιακοὺς αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/025.yaml
  text: It is enough for the disciple that he become like his teacher[a], and the slave like his master. If they called the master of the house Beelzebul, how much more those of his household.
translation:
  language: vi
  text: Môn đồ trở nên giống như thầy mình, và nô lệ giống như chủ mình, thì đã đủ rồi. Nếu người ta đã gọi chủ nhà là Bê-ên-xê-bun[a], huống chi những người trong nhà ông!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có dạng tên quen thuộc theo truyền thống là “Bê-ên-xê-búp.”
    reason: Ghi nhận dạng tên truyền thống/biến thể mà không thay thế dạng Βεελζεβούλ trong bản văn Hy Lạp được dùng làm nguồn.
lexical_decisions:
- source_word: ἀρκετὸν
  choice: thì đã đủ rồi
  rationale: Diễn đạt tự nhiên ý nghĩa đầy đủ, thỏa đáng của tính từ vị ngữ, đồng thời giữ trọng tâm rằng môn đồ và nô lệ không nên mong địa vị hay cách đối xử hơn người ở trên mình.
- source_word: μαθητῇ
  choice: môn đồ
  rationale: “Môn đồ” giữ được quan hệ gắn bó, học tập và noi theo thầy trong bối cảnh Tin Mừng, sâu hơn nghĩa học thuật đơn thuần của “học sinh”.
- source_word: ἵνα γένηται ὡς
  choice: trở nên giống như
  rationale: Giữ rõ động thái γένηται (“trở nên”) và ý so sánh của ὡς (“giống như”), không thu gọn thành một trạng thái tĩnh.
- source_word: διδάσκαλος
  choice: thầy
  rationale: Trong cặp μαθητής–διδάσκαλος, “thầy” là cách gọi tự nhiên, trang trọng và phân biệt được với κύριος ở vế kế tiếp.
- source_word: δοῦλος
  choice: nô lệ
  rationale: Bối cảnh đối lập trực tiếp với κύριος nhấn mạnh địa vị lệ thuộc trong cơ cấu chủ–nô; “nô lệ” chính xác hơn cách nói nhẹ hơn là “đầy tớ”.
- source_word: κύριος
  choice: chủ
  rationale: Ở đây từ này chỉ người chủ đối với nô lệ trong một phép so sánh xã hội–gia đình, chứ không trực tiếp được dùng như tước hiệu thần học “Chúa”.
- source_word: οἰκοδεσπότην
  choice: chủ nhà
  rationale: Diễn đạt gọn và tự nhiên người đứng đầu, cai quản một gia đình hay hộ, đồng thời nối kết với οἰκιακούς ở cuối câu.
- source_word: Βεελζεβοὺλ
  choice: Bê-ên-xê-bun
  rationale: Phiên âm theo dạng Βεελζεβούλ của bản văn Hy Lạp SBLGNT; dạng truyền thống khác được ghi ở chú thích.
- source_word: ἐπεκάλεσαν
  choice: đã gọi
  rationale: Trong ngữ cảnh này động từ có nghĩa gán cho hay gọi một người bằng một tên; thì quá khứ của tiếng Việt phản ánh aorist mà không diễn giải quá mức.
- source_word: πόσῳ μᾶλλον
  choice: huống chi
  rationale: Đây là thành ngữ tiếng Việt tự nhiên cho lập luận từ điều lớn hơn đến điều càng dễ xảy ra hơn, giữ sức mạnh tu từ của cụm Hy Lạp.
- source_word: οἰκιακοὺς
  choice: những người trong nhà
  rationale: Cụm này bao quát các thành viên thuộc hộ gia đình, không giới hạn vào người thân hay nô lệ.
theological_decisions:
- issue: Cách dịch κύριος trong phép so sánh về chủ và nô lệ
  choice: chủ
  alternative: Chúa
  rationale: Quan hệ song song với δοῦλος và hình ảnh οἰκοδεσπότης xác định nghĩa xã hội là người chủ. Dịch “Chúa” tại đây sẽ làm nổi bật một tước hiệu thần học mà bản thân mệnh đề so sánh không trực tiếp xác định.
- issue: Cách dịch δοῦλος
  choice: nô lệ
  alternative: đầy tớ
  rationale: Sự đối lập địa vị với κύριος khiến quan hệ sở thuộc và lệ thuộc nổi bật; “nô lệ” bảo toàn thực tại xã hội mạnh hơn “đầy tớ”.
- issue: Chủ thể không được nêu của ἐπεκάλεσαν
  choice: người ta đã gọi
  alternative: họ đã gọi
  rationale: Động từ ngôi ba số nhiều không nêu rõ chủ thể. “Người ta” giữ tính không xác định, tránh tự ý đồng nhất họ với một nhóm cụ thể.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “môn đồ” vì sắc thái quan hệ học theo trong sách Tin Mừng; dùng “nô lệ” để giữ độ mạnh lịch sử của phép đối chiếu. Cấu trúc “thì đã đủ rồi” và “huống chi” tạo nhịp tiếng Việt tự nhiên mà vẫn bám sát lập luận của nguyên văn.
