id: MAT.10.26
reference: Matthew 10:26
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Μὴ οὖν φοβηθῆτε αὐτούς· οὐδὲν γάρ ἐστιν κεκαλυμμένον ὃ οὐκ ἀποκαλυφθήσεται, καὶ κρυπτὸν ὃ οὐ γνωσθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/026.yaml
  text: Therefore, do not fear them, for nothing is covered that will not be revealed, and hidden that will not be made known.
translation:
  language: vi
  text: Vậy, đừng sợ họ, vì không có gì bị che phủ mà sẽ không được phơi bày, cũng không có gì bị giấu kín mà sẽ không được biết đến.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μὴ οὖν φοβηθῆτε αὐτούς
  choice: Vậy, đừng sợ họ
  rationale: “Vậy” truyền đạt quan hệ suy luận của οὖν trong mạch văn; “đừng sợ họ” diễn đạt tự nhiên mệnh lệnh phủ định và giữ đại từ chỉ những người đang chống đối các môn đồ.
- source_word: κεκαλυμμένον
  choice: bị che phủ
  rationale: Giữ hình ảnh cụ thể và dạng bị động của từ Hy Lạp, đồng thời đối ứng rõ với “được phơi bày”.
- source_word: ἀποκαλυφθήσεται
  choice: sẽ không được phơi bày
  rationale: “Phơi bày” diễn tả việc gỡ bỏ sự che phủ và làm cho điều bị che trở nên hiển lộ; dạng bị động và thời tương lai được bảo toàn.
- source_word: κρυπτὸν
  choice: kín giấu
  rationale: Diễn đạt điều bí mật hoặc bị giấu kín mà không thu hẹp nghĩa vào một loại bí mật cụ thể.
- source_word: γνωσθήσεται
  choice: sẽ không được biết đến
  rationale: Giữ dạng bị động và nghĩa rộng “trở nên được biết”, thay vì thêm một chủ thể biết không có trong câu.
theological_decisions:
- issue: Phạm vi và tác nhân của việc mặc khải
  choice: Dùng các cấu trúc bị động “được phơi bày” và “được biết đến”.
  alternative: Nêu rõ “Đức Chúa Trời sẽ phơi bày/làm cho người ta biết”.
  rationale: Nguyên văn không nêu tác nhân. Cách dịch bị động bảo toàn sự rộng mở và không tự ý xác định đây là bị động thần học.
- issue: Tính khẳng định phổ quát của câu
  choice: Giữ cấu trúc “không có gì... mà sẽ không...” ở cả hai vế.
  alternative: Diễn giải thành “mọi điều... đều sẽ...”.
  rationale: Cấu trúc phủ định kép phản ánh sát hình thức nhấn mạnh của nguyên văn và giữ sức nặng tu từ của lời tuyên bố.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Hai vế song song được giữ rõ; không thêm chú thích vì câu không có dị bản hay điểm mơ hồ cần giải thích trong bản văn chính.
