  verdict: revise
  source_fidelity: 'Bản nháp hiểu đúng cấu trúc: εἰσερχόμενοι là mệnh đề thời gian đi với mệnh lệnh ἀσπάσασθε, và αὐτήν quy chiếu số ít giống cái về οἰκίαν. Tuy nhiên, “chào nhà ấy” tuy bám sát hình thức lại không tự nhiên trong tiếng Việt hiện đại và có thể bị hiểu là chào một tòa nhà. Trong ngữ cảnh này, “nhà” là hoán dụ chỉ hộ gia đình/người trong nhà.'
  naturalness: “Khi vào nhà” thiếu sắc thái khái quát của chỉ dẫn dành cho từng nhà mà các môn đồ vào; “Khi vào một nhà” rõ và tự nhiên hơn. “Hãy chào gia đình ấy” truyền đạt đúng hành vi giao tiếp được nguyên văn diễn đạt bằng hoán dụ, đồng thời tránh cách kết hợp từ không tự nhiên “chào nhà ấy.”
  terminology: “Anh em” phù hợp với lời sai phái số nhiều trong văn phong Kinh Thánh Việt ngữ hiện đại. “Gia đình” ở đây được dùng theo nghĩa hộ gia đình/những người sống trong nhà; chú thích cần nêu rõ rằng nguyên văn nói theo lối hoán dụ là “nhà.”
  issues:
