  text: As you enter the house[a], greet it.
translation:
  language: vi
  text: Khi vào một nhà, anh em hãy chào gia đình ấy.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “hãy chào nhà ấy.” “Nhà” được dùng theo lối hoán dụ để chỉ gia đình hoặc những người sống trong đó.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσερχόμενοι
  choice: Khi vào
  rationale: Phân từ hiện tại số nhiều làm trạng ngữ cho mệnh lệnh; mệnh đề thời gian với “khi” tự nhiên trong tiếng Việt và giữ được quan hệ đồng thời.
- source_word: δὲ
  choice: không dịch riêng
  rationale: δέ là liên từ chuyển ý nhẹ; trong câu tiếng Việt, sự nối tiếp đã được thể hiện tự nhiên qua cấu trúc “Khi vào”, nên không cần thêm một từ mang sắc thái đối lập.
- source_word: τὴν οἰκίαν
  choice: nhà
  rationale: οἰκία có thể chỉ căn nhà hoặc gia đình sống trong đó. “Nhà” giữ hình ảnh cụ thể phù hợp với động từ “vào”, đồng thời vẫn có thể được hiểu theo lối hoán dụ.
- source_word: ἀσπάσασθε
  choice: hãy chào
  rationale: Động từ mệnh lệnh aorist, ngôi hai số nhiều. “Hãy chào” là cách diễn đạt rõ ràng, hiện đại và đúng lực mệnh lệnh.
- source_word: αὐτήν
  choice: nhà ấy
  rationale: Đại từ giống cái số ít quy chiếu về οἰκίαν. Lặp lại “nhà ấy” thay vì dùng đại từ vô tri giúp câu tiếng Việt rõ nghĩa mà vẫn giữ cách nói hoán dụ của nguyên văn.
theological_decisions:
- issue: Chào căn nhà theo lối hoán dụ hay nói rõ là chào những người trong nhà
  choice: Giữ cách nói hoán dụ “hãy chào nhà ấy” trong chính văn
  alternative: “hãy chào gia đình ấy” hoặc “hãy chào những người trong nhà”
  rationale: Nguyên văn dùng đại từ giống cái số ít quy chiếu trực tiếp về “nhà”. Giữ lối diễn đạt này bảo toàn hình thức và độ mở của tiếng Hy Lạp; đối tượng xã hội có lẽ là những người sống trong nhà được giải thích ở chú thích thay vì đưa thẳng vào bản dịch.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Anh em” làm rõ chủ thể số nhiều hàm ẩn trong động từ Hy Lạp; “nhà ấy” giữ lối hoán dụ của nguyên văn dù hơi khác cách nói thông thường trong tiếng Việt.
