  - severity: low
    issue: “Khi vào nhà” có thể gợi nghĩa “vào nhà/về nhà” nói chung hơn là bước vào một nhà cụ thể.
    rationale: Mạo từ xác định trong tiếng Hy Lạp ở đây có thể mang giá trị khái quát trong chỉ dẫn. “Khi vào một nhà” làm rõ điều này mà không thay đổi ý nghĩa.
  - severity: low
    issue: Chú thích hiện tại gọi “hãy chào gia đình ấy” là một khả năng thay thế, trong khi chính văn lại giữ bản dịch quá chữ nghĩa.
