id: MAT.10.2
reference: Matthew 10:2
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: τῶν δὲ δώδεκα ἀποστόλων τὰ ὀνόματά ἐστιν ταῦτα· πρῶτος Σίμων ὁ λεγόμενος Πέτρος καὶ Ἀνδρέας ὁ ἀδελφὸς ⸀αὐτοῦ, Ἰάκωβος ὁ τοῦ Ζεβεδαίου καὶ Ἰωάννης ὁ ἀδελφὸς αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/002.yaml
  text: 'These are the names of the twelve apostles: first[a], Simon who is called Peter, and Andrew his brother; James the son of Zebedee, and John his brother,'
translation:
  language: vi
  text: 'Tên của mười hai sứ đồ là: đầu tiên[a] là Si-môn, người được gọi là Phi-e-rơ, và Anh-rê, người anh em của Si-môn; Gia-cơ, con Xê-bê-đê, và Giăng, người anh em của Gia-cơ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hy Lạp cũng có thể hàm ý Phi-e-rơ là người nổi bật trong nhóm Mười Hai, chứ không chỉ là người được kể tên đầu tiên.
    reason: alternative_reading
lexical_decisions:
- source_word: δὲ
  choice: không dịch thành một từ riêng
  rationale: δέ đánh dấu sự chuyển ý nhẹ; trong tiếng Việt, câu mở đầu tự nhiên đã chuyển sang việc liệt kê tên, nên không cần thêm một từ chỉ thời gian như “bấy giờ”.
- source_word: δώδεκα ἀποστόλων
  choice: mười hai sứ đồ
  rationale: “Sứ đồ” là cách gọi quen thuộc và chính xác trong ngữ cảnh Tin Mừng, chỉ nhóm mười hai người được Chúa Giê-su sai phái.
- source_word: τὰ ὀνόματά ἐστιν ταῦτα
  choice: Tên ... là
  rationale: Cấu trúc này diễn đạt tự nhiên trong tiếng Việt, đồng thời giữ chức năng giới thiệu danh sách của câu Hy Lạp.
- source_word: πρῶτος
  choice: trước hết
  rationale: Giữ nghĩa đứng đầu danh sách mà không tự ý khẳng định địa vị hay quyền tối thượng.
- source_word: ὁ λεγόμενος
  choice: người được gọi là
  rationale: Phản ánh rõ cấu trúc phân từ Hy Lạp dùng để nhận diện Si-môn bằng tên Phi-e-rơ.
- source_word: Πέτρος
  choice: Phi-e-rơ
  rationale: Dùng dạng tên riêng quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
- source_word: ὁ ἀδελφὸς αὐτοῦ
  choice: em ông
  rationale: ἀδελφός chỉ anh em ruột; theo quan hệ gia đình được biết trong ngữ cảnh, Anh-rê là em của Si-môn và Giăng là em của Gia-cơ. “Ông” tránh lặp tên và giữ văn phong trang trọng.
- source_word: ὁ τοῦ Ζεβεδαίου
  choice: con Xê-bê-đê
  rationale: Cụm sở hữu Hy Lạp ngầm chỉ quan hệ cha con; cách diễn đạt này rõ ràng và tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Ý nghĩa của πρῶτος gắn với Si-môn/Phi-e-rơ
  choice: Dịch “trước hết” như vị trí mở đầu danh sách
  alternative: Có thể hàm ý Si-môn nổi bật hoặc có vị trí hàng đầu trong nhóm Mười Hai
  rationale: Ngữ cảnh trực tiếp là một danh sách tên. Bản văn chính không áp đặt kết luận giáo phái về quyền tối thượng, còn chú thích bảo lưu sắc thái nổi bật có thể có của từ Hy Lạp.
translation_notes:
  register: 'Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng các dạng tên Kinh Thánh quen thuộc: Si-môn, Phi-e-rơ, Anh-rê, Gia-cơ, Xê-bê-đê và Giăng.'
