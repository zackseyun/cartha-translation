revisions:
- from: 'Tên của mười hai sứ đồ là: trước hết[a], Si-môn, người được gọi là Phi-e-rơ, và Anh-rê, em ông; Gia-cơ, con Xê-bê-đê, và Giăng, em ông.'
  to: 'Tên của mười hai sứ đồ là: đầu tiên[a] là Si-môn, người được gọi là Phi-e-rơ, và Anh-rê, người anh em của Si-môn; Gia-cơ, con Xê-bê-đê, và Giăng, người anh em của Gia-cơ.'
  rationale: Sửa “trước hết” thành “đầu tiên là” để thể hiện πρῶτος như sự đánh dấu Si-môn ở vị trí đầu danh sách. Thay “em ông” bằng “người anh em của [tên]” để không thêm thứ bậc tuổi tác không được nguyên văn nêu. Chú thích giữ đúng chức năng bảo lưu khả năng πρῶτος hàm ý sự nổi bật mà không áp đặt kết luận giáo phái.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T02:44:48Z'
review_pass:
  verdict: revise
  source_fidelity: Bản nháp truyền đạt đúng cấu trúc giới thiệu danh sách, nhóm “mười hai sứ đồ,” cách định danh Si-môn là Phi-e-rơ, và quan hệ cha con của Gia-cơ với Xê-bê-đê. Tuy nhiên, “em ông” xác định thêm thứ bậc tuổi tác mà ἀδελφός không nêu; bản văn chỉ nói “người anh em/brother.” “Trước hết” có thể hiểu như một lời dẫn nhập chung hơn là vị trí thứ nhất của Si-môn; “đầu tiên là” gắn rõ πρῶτος với tên Si-môn.
  naturalness: Câu sửa vẫn dùng tiếng Việt hiện đại, trang trọng và dễ đọc. Việc lặp tên Si-môn và Gia-cơ trong các quan hệ anh em tránh đại từ “ông” mơ hồ khi liệt kê nhiều nhân vật, đồng thời không thêm thông tin về tuổi tác.
  terminology: “Sứ đồ,” “Phi-e-rơ,” “Anh-rê,” “Gia-cơ,” “Xê-bê-đê,” và “Giăng” là các thuật ngữ/dạng tên quen thuộc, nhất quán với bản nháp. “Người anh em của” là cách diễn đạt trung tính hơn “em,” bảo toàn nghĩa của ἀδελφός.
  issues:
  - severity: medium
    issue: “em ông” thêm quan hệ lớn–nhỏ không có trong nguyên ngữ.
    rationale: ἀδελφός chỉ quan hệ anh em; dù truyền thống hoặc ngữ cảnh rộng có thể cho biết thứ bậc, câu này không xác định Andrew hay John là em. Bản dịch nên không mã hóa chi tiết ấy.
  - severity: low
    issue: “trước hết” chưa gắn rõ với Si-môn như phần tử đầu danh sách.
    rationale: πρῶτος đứng trực tiếp trước Σίμων. “Đầu tiên là Si-môn” phản ánh liên kết này rõ và tự nhiên hơn, không quyết định tranh luận về vị thế.
