  rationale: Sửa cụm chỉ οἰκιακοί để diễn đạt rõ các thành viên của gia hộ thay vì những người ở trong nhà theo nghĩa không gian. Giữ “một người” cho cách dùng đại diện của ἀνθρώπου, “sẽ là” theo mạch vị lai của ngữ cảnh, và “Và” cho liên từ καὶ.
