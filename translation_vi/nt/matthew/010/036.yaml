  text: καὶ ἐχθροὶ τοῦ ἀνθρώπου οἱ οἰκιακοὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/036.yaml
  text: And a man's enemies will be those of his own household[a].
translation:
  language: vi
  text: Và kẻ thù của một người sẽ là người nhà của người ấy.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “Kẻ thù của một người sẽ là những người thuộc hộ gia đình của người ấy.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Và
  rationale: Giữ nguyên lực nối kết đơn giản với câu trước, không thêm quan hệ giải thích.
- source_word: ἐχθροὶ
  choice: kẻ thù
  rationale: Diễn đạt tự nhiên danh từ hóa số nhiều chỉ những người thù nghịch.
- source_word: τοῦ ἀνθρώπου
  choice: của một người
  rationale: ἄνθρωπος ở đây chỉ một con người theo nghĩa đại diện; tiếng Việt dùng “một người” tự nhiên và không cần biểu thị giống ngữ pháp như tiếng Hy Lạp.
- source_word: οἱ οἰκιακοὶ αὐτοῦ
  choice: những người trong chính nhà mình
  rationale: οἰκιακοί chỉ người thuộc về nhà/hộ gia đình, không phải căn nhà vật chất; “chính” thể hiện sắc thái nhấn mạnh của αὐτοῦ trong lời nói tương phản này.
theological_decisions:
- issue: Ngôn ngữ đại diện của ἀνθρώπου
  choice: một người
  alternative: một người đàn ông
  rationale: Danh từ Hy Lạp ở số ít giống đực nhưng trong châm ngôn này mang nghĩa đại diện chung. “Một người” bảo toàn phạm vi chỉ con người và phù hợp ngữ pháp tiếng Việt, còn “một người đàn ông” dễ thu hẹp nghĩa về giới tính.
- issue: Phạm vi của οἰκιακοί
  choice: những người trong chính nhà mình
  alternative: người nhà mình
  rationale: Bản dịch chính giữ nghĩa rộng của những người thuộc hộ gia đình, vốn có thể rộng hơn gia đình hạt nhân, đồng thời không xác định cụ thể quan hệ thân thuộc.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cấu trúc “sẽ là” giữ sắc thái vị lai của ngữ cảnh trích dẫn; “trong chính nhà mình” nhấn mạnh nghịch lý mà không giới hạn οἰκιακοί vào gia đình hạt nhân.
