  verdict: revise
  source_fidelity: 'Bản nháp truyền đạt đúng các yếu tố chính: καὶ được giữ là “Và,” ἐχθροὶ là “kẻ thù,” τοῦ ἀνθρώπου được hiểu theo nghĩa đại diện chung, và οἰκιακοί chỉ những người thuộc gia hộ. Tuy nhiên, “những người trong chính nhà mình” có thể gợi vị trí ở trong căn nhà hơn là tư cách thành viên của gia hộ. Bản sửa nêu rõ quan hệ “người nhà” mà vẫn không thu hẹp vào gia đình hạt nhân.'
