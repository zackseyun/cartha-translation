  terminology: “Kẻ thù” và “người nhà” phù hợp với văn cảnh và giữ sắc thái đối nghịch của câu. “Một người” phản ánh cách dùng đại diện của ἀνθρώπου mà không áp đặt giới tính không được đánh dấu về mặt ngữ nghĩa trong tiếng Việt.
