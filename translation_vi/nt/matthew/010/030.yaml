  text: ὑμῶν δὲ καὶ αἱ τρίχες τῆς κεφαλῆς πᾶσαι ἠριθμημέναι εἰσίν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/030.yaml
  text: But even the hairs of your head are all numbered[a].
translation:
  language: vi
  text: Nhưng ngay cả từng sợi tóc trên đầu anh em cũng đã được đếm[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đều được đếm.” Thể hoàn thành bị động trong tiếng Hy Lạp có thể nhấn mạnh tình trạng hiện tại phát sinh từ một hành động đã hoàn tất.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμῶν
  choice: anh em
  rationale: Đại từ sở hữu ngôi thứ hai số nhiều được diễn đạt tự nhiên trong tiếng Việt qua cụm “trên đầu anh em”.
- source_word: δὲ
  choice: Nhưng
  rationale: Giữ sắc thái chuyển ý và tương phản nhẹ với lời trấn an trong văn cảnh trước đó.
- source_word: καὶ
  choice: ngay cả
  rationale: 'Thể hiện lực nhấn mạnh: đến từng sợi tóc, một chi tiết rất nhỏ, cũng nằm trong phạm vi được biết đến.'
- source_word: αἱ τρίχες τῆς κεφαλῆς
  choice: tóc trên đầu anh em
  rationale: Đây là cách nói tự nhiên trong tiếng Việt, chỉ toàn bộ các sợi tóc riêng lẻ trên đầu người nghe.
- source_word: πᾶσαι
  choice: hết
  rationale: Đặt sau động từ theo lối tiếng Việt tự nhiên mà vẫn nhấn mạnh tính toàn thể, không sót sợi nào.
- source_word: ἠριθμημέναι εἰσίν
  choice: đã được đếm
  rationale: 'Phản ánh thể hoàn thành bị động ngoại vi: hành động đã hoàn tất và kết quả vẫn còn hiệu lực.'
theological_decisions:
- issue: Mức độ hiểu biết và chăm sóc của Đức Chúa Trời được hàm ý
  choice: Giữ nguyên hình ảnh cụ thể rằng tóc đã được đếm hết, không diễn giải thêm chủ thể hay giáo lý về sự quan phòng.
  alternative: Diễn ý thành Đức Chúa Trời biết hoặc chăm sóc đến từng sợi tóc.
  rationale: Bản Hy Lạp dùng thể bị động và không nêu chủ thể ngay trong câu; bản dịch nên để hàm ý thần học phát sinh từ văn cảnh thay vì đưa lời giải thích vào chính văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Anh em” biểu thị đối tượng số nhiều; “ngay cả” giữ lực nhấn mạnh; “đã được đếm hết” vừa tự nhiên vừa phản ánh trạng thái kết quả của thể hoàn thành.
