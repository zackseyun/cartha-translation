id: MAT.10.22
reference: Matthew 10:22
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἔσεσθε μισούμενοι ὑπὸ πάντων διὰ τὸ ὄνομά μου· ὁ δὲ ὑπομείνας εἰς τέλος οὗτος σωθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/022.yaml
  text: And you will be hated by all because of my name[d][c][b][a]. But the one who endures to the end will be saved.
translation:
  language: vi
  text: Anh em sẽ bị mọi người thù ghét vì danh Ta.[a] Nhưng ai bền lòng cho đến cuối cùng, người ấy sẽ được cứu.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “vì cớ danh Ta.”'
    reason: lexical_alternative
  - marker: b
    text: “Bền lòng” cũng có thể dịch là “kiên trì” hoặc “chịu đựng.”
    reason: lexical_alternative
  - marker: c
    text: Tùy cách hiểu văn cảnh, “được cứu” cũng có thể mang nghĩa “được giải thoát” hoặc “được giải cứu.”
    reason: alternative_reading
lexical_decisions:
- source_word: μισούμενοι
  choice: bị ... thù ghét
  rationale: Diễn đạt tự nhiên trạng thái tương lai trong kết cấu ἔσεσθε + phân từ, đồng thời giữ sắc thái mạnh của μισέω.
- source_word: ὑπὸ πάντων
  choice: bị mọi người
  rationale: ὑπό với sở hữu cách chỉ tác nhân trong câu bị động; “mọi người” tự nhiên trong tiếng Việt và giữ sức khái quát của πάντων.
- source_word: διὰ τὸ ὄνομά μου
  choice: vì danh Ta
  rationale: διά với đối cách nêu nguyên nhân. “Danh” giữ được nội hàm rộng, quy chiếu đến chính con người, thẩm quyền và sự gắn bó với Chúa Giê-su.
- source_word: ὁ δὲ ὑπομείνας
  choice: nhưng ai bền lòng
  rationale: Phân từ có mạo từ được diễn đạt tự nhiên bằng “ai”; “bền lòng” truyền đạt sự đứng vững, chịu đựng trong bối cảnh bị bách hại mà không áp đặt thuật ngữ thần học về sự kiên trì.
- source_word: εἰς τέλος
  choice: cho đến cuối cùng
  rationale: Giữ ý tiếp tục chịu đựng tới điểm cuối, đồng thời là cách nói tự nhiên trong tiếng Việt.
- source_word: οὗτος
  choice: người ấy
  rationale: Giữ lực nhấn mạnh và chức năng hồi chỉ của đại từ Hy Lạp mà vẫn tự nhiên trong cấu trúc tiếng Việt “ai..., người ấy...”.
- source_word: σωθήσεται
  choice: sẽ được cứu
  rationale: Giữ phạm vi nghĩa rộng của σῴζω, không thu hẹp thành sự giải cứu thể chất hay quy định cụ thể bản chất cánh chung của sự cứu rỗi.
theological_decisions:
- issue: Ý nghĩa của việc được cứu trong mối liên hệ với sự bền lòng
  choice: Giữ cách nói rộng “sẽ được cứu”.
  alternative: “sẽ được giải thoát” hoặc “sẽ được giải cứu”.
  rationale: Câu này liên kết việc bền lòng giữa sự bách hại với sự cứu, nhưng không tự nó giải quyết các tranh luận giáo lý về sự bền đỗ hay xác định đây chỉ là giải cứu thể chất. Bản dịch giữ nguyên sức căng thần học của câu.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng cặp cấu trúc “ai..., người ấy...” để giữ nét nhấn mạnh của οὗτος; dùng “Ta” trong lời Chúa Giê-su theo sắc thái Kinh Thánh trang trọng, không thêm nội dung hệ phái.
