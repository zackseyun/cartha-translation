id: MAT.10.21
reference: Matthew 10:21
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: παραδώσει δὲ ἀδελφὸς ἀδελφὸν εἰς θάνατον καὶ πατὴρ τέκνον, καὶ ἐπαναστήσονται τέκνα ἐπὶ γονεῖς καὶ θανατώσουσιν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/021.yaml
  text: And brother will hand over brother to death[a], and a father his child, and children will rise up against parents and put them to death.
translation:
  language: vi
  text: Anh em sẽ nộp anh em mình cho chết[a], cha sẽ nộp con mình; con cái sẽ nổi lên chống lại cha mẹ và giết họ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “giao nộp”; trong ngữ cảnh phản trắc, động từ này cũng có thể mang nghĩa “phản bội”.
    reason: lexical_alternative
lexical_decisions:
- source_word: παραδώσει
  choice: sẽ nộp
  rationale: Diễn tả việc giao một người vào tay thế lực thù địch, với hậu quả là cái chết. “Nộp” tự nhiên và giữ được sắc thái cụ thể mà không mặc nhiên thu hẹp nghĩa thành “phản bội”.
- source_word: ἀδελφὸς ... ἀδελφὸν
  choice: anh em ... nhau
  rationale: “Anh em” giữ trường nghĩa quan hệ nam giới của ἀδελφός; “nhau” diễn đạt tự nhiên cấu trúc một người anh/em nộp người anh/em kia trong tiếng Việt.
- source_word: εἰς θάνατον
  choice: để bị giết
  rationale: Cụm từ chỉ kết quả hoặc mục đích dẫn đến cái chết. Cách dịch này làm rõ rằng người bị nộp là người phải chết, nhưng không xác định ai thi hành việc giết.
- source_word: πατὴρ τέκνον
  choice: cha ... con mình
  rationale: τέκνον là “con”, không riêng con trai; thêm “mình” để câu tiếng Việt tự nhiên và thể hiện quan hệ sở hữu vốn được ngữ cảnh hàm ý.
- source_word: ἐπαναστήσονται
  choice: sẽ nổi lên chống lại
  rationale: Giữ hình ảnh mạnh của động từ ἐπανίσταμαι và ý đối nghịch, không thu hẹp thành một cuộc nổi loạn mang tính chính trị.
- source_word: τέκνα
  choice: con cái
  rationale: Thuật ngữ bao gồm cả con trai lẫn con gái và phù hợp với số nhiều đại diện trong câu.
- source_word: ἐπὶ γονεῖς
  choice: chống lại cha mẹ
  rationale: ἐπί với đối cách trong ngữ cảnh thù nghịch mang nghĩa “chống lại”; γονεῖς chỉ cha mẹ.
- source_word: θανατώσουσιν
  choice: khiến ... phải chết
  rationale: θανατόω có nghĩa làm cho ai chết hoặc đưa ai đến chỗ chết. Cách dịch này giữ sắc thái gây ra cái chết mà không khẳng định con cái nhất thiết trực tiếp ra tay giết.
- source_word: αὐτούς
  choice: họ
  rationale: Đại từ chỉ về “cha mẹ”; giữ đại từ giúp câu theo sát dòng diễn đạt của tiếng Hy Lạp.
theological_decisions:
- issue: Các từ chỉ thành viên gia đình và giới tính
  choice: Dịch ἀδελφός bằng “anh em”, còn τέκνα và γονεῖς bằng “con cái” và “cha mẹ”
  alternative: Dùng từ hoàn toàn trung tính như “người cùng huyết thống” cho ἀδελφός
  rationale: Bản dịch giữ phạm vi nam giới của ἀδελφός, đồng thời không gán giới tính riêng cho τέκνα và γονεῖς, vốn có nghĩa bao quát.
- issue: Mức độ trực tiếp trong hành động θανατώσουσιν
  choice: “khiến họ phải chết”
  alternative: “giết họ” hoặc “đưa họ đi xử tử”
  rationale: Động từ có thể chỉ việc trực tiếp giết hoặc làm cho bị giết. Cách dịch đã chọn bảo tồn độ rộng này và không tự ý xác định cơ chế gây chết.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dấu chấm phẩy làm rõ hai vế về sự tan vỡ trong gia đình, đồng thời giữ nhịp dồn dập của nguyên văn.
