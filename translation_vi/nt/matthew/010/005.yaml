- from: 'Đức Giê-su sai mười hai người này đi và truyền dặn họ: “Đừng đi theo đường đến với dân ngoại[a], cũng đừng vào một thành nào của người Sa-ma-ri[b].”'
  to: 'Đức Giê-su sai mười hai người này đi và truyền dặn họ: “Đừng đi theo đường đến vùng dân ngoại[a], cũng đừng vào một thành nào của người Sa-ma-ri[b].”'
  rationale: Chỉ thay “đến với dân ngoại” bằng “đến vùng dân ngoại” để diễn đạt tự nhiên hơn hướng đi hàm ý trong εἰς ὁδὸν ἐθνῶν. Giữ chú thích a để nêu phương án gần chữ và tính không hoàn toàn chắc chắn của cách hiểu cụm “đường”; không thêm bất cứ giải thích nào về tính vĩnh viễn hay thần học của mệnh lệnh.
  reviewer_model: gpt-5.6-terra
