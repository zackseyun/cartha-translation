review_pass:
  verdict: revise
  source_fidelity: Bản dịch giữ đúng chủ thể, nhóm “mười hai người này”, hành động sai phái, và hai mệnh lệnh phủ định. Tuy nhiên, “đi theo đường đến với dân ngoại” không tự nhiên trong tiếng Việt và có thể gợi ý việc đi cùng/đến gặp dân ngoại hơn là hướng đi đến lãnh thổ dân ngoại. “đường đến vùng dân ngoại” diễn đạt rõ hơn hướng đi của cụm εἰς ὁδὸν ἐθνῶν, đồng thời vẫn giữ hình ảnh “đường” của nguyên ngữ.
  naturalness: Cần chỉnh nhẹ để tiếng Việt hiện đại trôi chảy hơn. “Đường đến với dân ngoại” là kết hợp từ không tự nhiên; “đường đến vùng dân ngoại” tự nhiên và đúng ngữ cảnh hơn. Các phần còn lại, gồm “Đức Giê-su”, “sai ... đi”, “truyền dặn họ”, và “thành của người Sa-ma-ri”, phù hợp văn phong trang trọng, hiện đại.
  terminology: “Dân ngoại” phù hợp với ἐθνῶν trong bối cảnh Do Thái của câu này. “Người Sa-ma-ri” và “thành” là các lựa chọn chuẩn, không áp đặt diễn giải thần học. Giữ “Đức Giê-su” nhất quán với thanh ghi kính trọng của bản dịch.
  issues:
  - severity: medium
    issue: Cụm “đi theo đường đến với dân ngoại” thiếu tự nhiên và không rõ quan hệ hướng đi.
    rationale: “Đến với dân ngoại” trong tiếng Việt thường gợi ý tiếp cận con người, trong khi cụm Hy Lạp dùng ngôn ngữ con đường/hướng đi, nhiều khả năng chỉ hướng đến lãnh thổ dân ngoại. Đổi thành “đi theo đường đến vùng dân ngoại” khắc phục độ gượng mà không biến lời cấm thành một lệnh cấm lâu dài hay rộng hơn văn bản.
