source:
  edition: SBLGNT
  text: Τούτους τοὺς δώδεκα ἀπέστειλεν ὁ Ἰησοῦς παραγγείλας αὐτοῖς λέγων· Εἰς ὁδὸν ἐθνῶν μὴ ἀπέλθητε καὶ εἰς πόλιν Σαμαριτῶν μὴ εἰσέλθητε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/005.yaml
  text: Jesus sent out these twelve, instructing them, saying, “Do not go on the road to the Gentiles, and do not enter a town of the Samaritans.”
translation:
  language: vi
  text: 'Đức Giê-su sai mười hai người này đi và truyền dặn họ: “Đừng đi theo đường đến vùng dân ngoại[a], cũng đừng vào một thành nào của người Sa-ma-ri[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Đừng đi vào đường của dân ngoại.” Cụm từ Hy Lạp dùng hình ảnh con đường và có thể chỉ việc hướng đến vùng dân ngoại.'
    reason: lexical_alternative
  - marker: b
    text: 'Hay: “một thành của người Sa-ma-ri.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τούτους τοὺς δώδεκα
  choice: mười hai người này
  rationale: Giữ nguyên đại từ chỉ định và con số; không thêm “môn đồ” vì từ ấy không có trong câu Hy Lạp.
- source_word: ἀπέστειλεν
  choice: sai ... đi
  rationale: Diễn đạt tự nhiên hành động phái họ lên đường thi hành sứ mạng, không biến động từ thành một thuật ngữ chức vụ.
- source_word: παραγγείλας αὐτοῖς λέγων
  choice: và truyền dặn họ
  rationale: Gộp hai phân từ theo cú pháp tiếng Việt tự nhiên; “truyền dặn” giữ được sắc thái chỉ thị có thẩm quyền của παραγγέλλω, còn nội dung lời nói được dẫn trực tiếp sau dấu hai chấm.
- source_word: Εἰς ὁδὸν ἐθνῶν μὴ ἀπέλθητε
  choice: Đừng đi theo đường đến với dân ngoại
  rationale: Giữ hình ảnh “đường” của ὁδός và thể hiện hướng đi trong εἰς; “dân ngoại” chỉ những người không thuộc dân Do Thái trong bối cảnh này.
- source_word: εἰς πόλιν Σαμαριτῶν μὴ εἰσέλθητε
  choice: cũng đừng vào một thành nào của người Sa-ma-ri
  rationale: “Thành” bao quát πόλις mà không nhất thiết nhấn mạnh quy mô; “một ... nào” diễn đạt tự nhiên phạm vi của lời cấm; cấu trúc sở hữu giữ gần nguyên văn Hy Lạp.
theological_decisions:
- issue: Phạm vi và thời hạn của lệnh cấm đi đến dân ngoại và vào thành của người Sa-ma-ri
  choice: Trình bày như một mệnh lệnh trực tiếp dành cho lần sai phái này, không thêm từ ngữ cho rằng đó là lệnh cấm vĩnh viễn.
  alternative: Diễn đạt thành một sự loại trừ tuyệt đối hoặc lâu dài đối với dân ngoại và người Sa-ma-ri.
  rationale: Bản văn nêu một chỉ thị cụ thể nhưng không tự xác định ở câu này rằng lệnh ấy có hiệu lực vĩnh viễn; bản dịch giữ nguyên sức nặng và sự căng thẳng thần học mà không giải quyết thay cho bản văn.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “Đức Giê-su” theo lối gọi kính trọng phổ biến; phiên âm “Sa-ma-ri”. Các dấu chú thích [a], [b] đều được đặt trong chính văn.
