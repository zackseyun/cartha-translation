    rationale: Trong tiếng Việt, vị ngữ đặt sau một cụm sở thuộc có thể tạo điểm mơ hồ về thành tố mà nó bổ nghĩa. Nguyên văn xác định rõ phân từ τὸ λαλοῦν đồng dạng với τὸ πνεῦμα, tức «Thần Khí» là Đấng/chủ thể đang nói.
  revised_text: Vì không phải chính anh em đang nói, nhưng chính Thần Khí của Cha anh em đang nói trong anh em.[a]
