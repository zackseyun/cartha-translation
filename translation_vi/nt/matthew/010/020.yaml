- from: Vì không phải chính anh em đang nói, nhưng là Thần Khí của Cha anh em đang nói trong anh em.[a]
  to: Vì không phải chính anh em đang nói, nhưng chính Thần Khí của Cha anh em đang nói trong anh em.[a]
  rationale: Thêm «chính» trước «Thần Khí» để xác định rõ Thần Khí, chứ không phải «Cha anh em», là chủ thể của «đang nói». Sự thêm này cũng phù hợp với thế đối lập nhấn mạnh trong câu, đồng thời giữ nguyên nghĩa, thì hiện tại của phân từ, và tính mở của ἐν ὑμῖν.
