  text: οὐ γὰρ ὑμεῖς ἐστε οἱ λαλοῦντες ἀλλὰ τὸ πνεῦμα τοῦ πατρὸς ὑμῶν τὸ λαλοῦν ἐν ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/020.yaml
  text: For it is not you who are speaking[b][a], but the Spirit of your Father speaking in you.
translation:
  language: vi
  text: Vì không phải chính anh em đang nói, nhưng chính Thần Khí của Cha anh em đang nói trong anh em.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể hiểu: “qua anh em.” Bản Hy Lạp viết “trong anh em,” nhưng trong ngữ cảnh này cũng có thể hàm ý Thần Khí phán qua các môn đồ.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὐ γὰρ
  choice: Vì không phải
  rationale: γάρ nối câu này với lời bảo đảm trước đó bằng sắc thái giải thích; “Vì” diễn đạt tự nhiên quan hệ ấy.
- source_word: ὑμεῖς
  choice: chính anh em
  rationale: Đại từ được nêu rõ và có tính nhấn mạnh; “chính anh em” giữ được điểm nhấn ấy trong tiếng Việt.
- source_word: ἐστε οἱ λαλοῦντες
  choice: đang nói
  rationale: Kết cấu với phân từ hiện tại nhấn mạnh người thực hiện và hành động đang diễn ra; “đang nói” là cách diễn đạt tự nhiên.
- source_word: ἀλλὰ
  choice: nhưng là
  rationale: Giữ sự tương phản mạnh giữa các môn đồ và chủ thể thật sự đang nói.
- source_word: τὸ πνεῦμα
  choice: Thần Khí
  rationale: Ngữ cảnh chỉ Thần Khí thuộc về Đức Chúa Trời, không phải tinh thần con người hay hơi thở; viết hoa cho thấy đối tượng quy chiếu thần linh.
- source_word: τοῦ πατρὸς ὑμῶν
  choice: của Cha anh em
  rationale: Giữ đúng quan hệ sở thuộc và cách gọi trực tiếp của nguyên文; không thêm “trên trời,” vốn không có trong câu này.
- source_word: τὸ λαλοῦν
  choice: đang nói
  rationale: Phân từ hiện tại giống trung, số ít quy chiếu rõ về τὸ πνεῦμα và diễn tả hành động đang tiếp diễn.
- source_word: ἐν ὑμῖν
  choice: trong anh em
  rationale: Giữ nghĩa trực tiếp nhất của ἐν và không tự ý giải quyết sự căng thẳng giữa sự hiện diện bên trong với việc nói qua các môn đồ.
theological_decisions:
- issue: Nên hiểu ἐν ὑμῖν là sự hiện diện bên trong (“trong anh em”) hay phương tiện hành động (“qua anh em”)
  choice: trong anh em
  alternative: qua anh em
  rationale: Nghĩa trực tiếp của ἐν là “trong.” Ngữ cảnh có thể hàm ý lời nói được phát ra qua các môn đồ, nhưng dịch thẳng thành “qua” sẽ giải quyết một sắc thái mà bản Hy Lạp vẫn để mở.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh em” cho đại từ số nhiều ὑμεῖς theo ngữ cảnh Chúa Giê-su nói với các môn đồ; dùng “Thần Khí” để chỉ πνεῦμα thần linh. Cấu trúc “không phải chính anh em… nhưng là…” giữ sự nhấn mạnh và tương phản của nguyên văn.
