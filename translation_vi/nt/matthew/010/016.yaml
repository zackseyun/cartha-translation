id: MAT.10.16
reference: Matthew 10:16
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἰδοὺ ἐγὼ ἀποστέλλω ὑμᾶς ὡς πρόβατα ἐν μέσῳ λύκων· γίνεσθε οὖν φρόνιμοι ὡς οἱ ὄφεις καὶ ἀκέραιοι ὡς αἱ περιστεραί.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/016.yaml
  text: Look, I am sending you out as sheep in the midst of wolves; therefore be wise as the snakes and innocent as the doves.
translation:
  language: vi
  text: Này, chính tôi sai anh em đi như chiên ở giữa bầy sói; vậy, hãy khôn ngoan như rắn và trong sạch như bồ câu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἰδοὺ
  choice: Này
  rationale: Một từ gọi sự chú ý trang trọng nhưng tự nhiên trong văn phong Kinh Thánh tiếng Việt hiện đại.
- source_word: ἐγὼ ἀποστέλλω ὑμᾶς
  choice: chính tôi sai anh em đi
  rationale: Đại từ ἐγώ được nhấn mạnh bằng “chính tôi”; “sai ... đi” diễn đạt tự nhiên hành động ủy nhiệm và phái đi.
- source_word: ὡς πρόβατα ἐν μέσῳ λύκων
  choice: như chiên vào giữa bầy sói
  rationale: Giữ nguyên hình ảnh đối lập giữa sự mong manh của chiên và mối nguy từ sói; “bầy” tự nhiên trong tiếng Việt.
- source_word: φρόνιμοι
  choice: khôn ngoan
  rationale: Diễn đạt sự sáng suốt, thận trọng và biết ứng xử thích hợp, không hàm ý xảo quyệt.
- source_word: ἀκέραιοι
  choice: trong sạch
  rationale: Thể hiện ý không pha tạp, không gian trá hay gây hại; phù hợp với sự đối xứng đạo đức trong câu.
- source_word: ὄφεις ... περιστεραί
  choice: rắn ... bồ câu
  rationale: Giữ các hình ảnh động vật ở dạng chỉ loài tự nhiên trong tiếng Việt, không cần mạo từ như tiếng Hy Lạp.
theological_decisions:
- issue: Mối căng thẳng giữa sự khôn ngoan và sự trong sạch
  choice: Giữ song song “khôn ngoan như rắn” và “trong sạch như bồ câu”
  alternative: Diễn giải thành “thận trọng nhưng vô hại”
  rationale: Bản dịch giữ nguyên hai ẩn dụ và sức căng của nguyên văn, không làm suy giảm mệnh lệnh khôn ngoan cũng không biến sự trong sạch thành ngây thơ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh em” cho số nhiều ὑμᾶς trong lời Đức Giê-su nói với nhóm môn đồ; tránh lối cổ “các ngươi”. Không thêm chú thích vì câu văn rõ và không có dị bản cần nêu.
