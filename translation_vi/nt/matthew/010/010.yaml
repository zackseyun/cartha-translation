id: MAT.10.10
reference: Matthew 10:10
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: μὴ πήραν εἰς ὁδὸν μηδὲ δύο χιτῶνας μηδὲ ὑποδήματα μηδὲ ⸀ῥάβδον· ἄξιος γὰρ ὁ ἐργάτης τῆς τροφῆς ⸀αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/010.yaml
  text: do not take a traveler's bag for the road[a], or two tunics, or sandals, or a staff; for the worker is worthy of his food.
translation:
  language: vi
  text: Đừng mang theo túi đi đường, hai áo trong, dép hay gậy[a]; vì người làm công xứng đáng được nhận thức ăn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Một số người hiểu lệnh cấm “gậy” là cấm mang thêm một cây gậy, nhất là vì Mác 6:8 cho phép mang gậy.
    reason: Ghi nhận cách hiểu khác và bảo toàn sự khác biệt bề mặt giữa Ma-thi-ơ 10:10 với Mác 6:8.
lexical_decisions:
- source_word: πήραν
  choice: túi đi đường
  rationale: Chỉ loại túi mang theo khi đi xa, thường dùng đựng lương thực; cách nói này tự nhiên và giữ rõ bối cảnh hành trình.
- source_word: εἰς ὁδὸν
  choice: đi đường
  rationale: Diễn đạt mục đích mang theo trong chuyến đi, kết hợp tự nhiên với 'túi' trong tiếng Việt.
- source_word: δύο χιτῶνας
  choice: hai áo dài
  rationale: χιτών là áo mặc sát người, dài theo kiểu cổ đại. 'Áo dài' dễ hiểu hơn từ phiên âm chuyên môn, nhưng không đồng nhất với áo dài truyền thống Việt Nam.
- source_word: ὑποδήματα
  choice: giày dép
  rationale: Từ Hy Lạp chỉ vật mang dưới chân; 'giày dép' là cách gọi phổ thông, không buộc nghĩa hẹp hơn mức từ nguồn.
- source_word: ῥάβδον
  choice: gậy
  rationale: Trong ngữ cảnh này là gậy dùng khi đi đường. Giữ nguyên lệnh cấm trong Ma-thi-ơ thay vì hòa giải với Mác 6:8.
- source_word: ἄξιος
  choice: xứng đáng
  rationale: Giữ sắc thái đánh giá của ἄξιος, rằng người làm công có quyền chính đáng nhận điều cần thiết.
- source_word: ὁ ἐργάτης
  choice: người làm công
  rationale: Diễn đạt một người lao động bằng ngôn ngữ phổ thông và phù hợp với hình ảnh người làm việc được nuôi ăn.
- source_word: τῆς τροφῆς αὐτοῦ
  choice: được cấp thức ăn
  rationale: τροφή trực tiếp chỉ thức ăn hay sự nuôi dưỡng. Cấu trúc tiếng Việt này truyền đạt tự nhiên ý người làm công đáng được nhận phần ăn của mình mà không mở rộng thành mọi hình thức hỗ trợ.
theological_decisions:
- issue: Khả năng hòa giải với các trình thuật song song về vật dụng được phép mang theo
  choice: Giữ lệnh cấm 'gậy' trong chính văn theo Ma-thi-ơ.
  alternative: Hiểu là cấm mang thêm một cây gậy, hoặc dịch thoáng để hòa hợp với Mác 6:8.
  rationale: Bản Hy Lạp của Ma-thi-ơ trực tiếp liệt kê ῥάβδον trong các vật không được mang. Bản dịch bảo toàn sự căng thẳng giữa các trình thuật và ghi nhận cách hiểu khác trong chú thích thay vì tự giải quyết trong chính văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng 'đừng... cũng đừng...' để thể hiện chuỗi phủ định. 'Áo dài' ở đây chỉ loại áo dài mặc sát người thời cổ, không phải quốc phục Việt Nam; nếu cần tránh liên tưởng văn hóa trong ngữ cảnh rộng hơn, có thể cân nhắc 'áo trong'.
