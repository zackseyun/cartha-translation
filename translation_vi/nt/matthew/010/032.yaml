id: MAT.10.32
reference: Matthew 10:32
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Πᾶς οὖν ὅστις ὁμολογήσει ἐν ἐμοὶ ἔμπροσθεν τῶν ἀνθρώπων, ὁμολογήσω κἀγὼ ἐν αὐτῷ ἔμπροσθεν τοῦ πατρός μου τοῦ ⸀ἐν οὐρανοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/032.yaml
  text: Therefore everyone who confesses me before men[b][a], I also will confess before my Father who is in heaven.
translation:
  language: vi
  text: Vậy, bất cứ ai xưng nhận tôi trước mặt mọi người thì tôi cũng sẽ xưng nhận người ấy[a] trước mặt Cha tôi, Đấng ở trên trời.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hy Lạp có thể hiểu sát là “trong người ấy” hoặc “liên quan đến/đối với người ấy”; câu dịch “xưng nhận người ấy” theo cách diễn đạt tự nhiên trong tiếng Việt.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πᾶς οὖν ὅστις
  choice: Vậy, bất cứ ai
  rationale: Cụm này khái quát bao hàm mọi người đáp ứng điều kiện được nêu; “Vậy” giữ quan hệ suy luận với ngữ cảnh trước.
- source_word: ὁμολογήσει
  choice: xưng nhận
  rationale: Ở đây ὁμολογέω chỉ việc công khai nhìn nhận Chúa Giê-xu. “Xưng nhận” giữ được chiều kích công khai, bằng lời, đồng thời có thể lặp lại tự nhiên ở vế sau.
- source_word: ἐν ἐμοὶ
  choice: tôi
  rationale: Dù tiếng Hy Lạp dùng giới từ ἐν, trong kết cấu này Chúa Giê-xu là đối tượng được xưng nhận; dịch “xưng nhận tôi” là tiếng Việt tự nhiên hơn “xưng nhận trong tôi”.
- source_word: ἔμπροσθεν τῶν ἀνθρώπων
  choice: trước mặt người đời
  rationale: ἔμπροσθεν diễn tả sự hiện diện công khai, còn ἀνθρώπων chỉ con người nói chung. “Người đời” là cách nói bao quát, tự nhiên trong tiếng Việt và không giới hạn vào nam giới.
- source_word: ὁμολογήσω κἀγὼ
  choice: thì tôi cũng sẽ xưng nhận
  rationale: Lặp lại “xưng nhận” để bảo toàn tính tương ứng của cùng một động từ ở hai vế; “cũng” thể hiện κἀγώ.
- source_word: ἐν αὐτῷ
  choice: người ấy[a]
  rationale: Cách dịch này diễn đạt tự nhiên người được Chúa Giê-xu xưng nhận, trong khi chú thích bảo lưu hình thức khác thường và độ mở của giới từ ἐν trong nguyên văn.
- source_word: τοῦ πατρός μου τοῦ ἐν οὐρανοῖς
  choice: Cha tôi, Đấng ở trên trời
  rationale: Cách diễn đạt trang trọng, rõ ràng, giữ mệnh đề xác định nơi ở; số nhiều οὐρανοῖς được chuyển theo cách nói tự nhiên của tiếng Việt là “trên trời”.
theological_decisions:
- issue: Việc công khai xưng nhận Chúa Giê-xu và sự xưng nhận tương ứng của Ngài
  choice: 'Trình bày trực tiếp lời hứa tương ứng: ai xưng nhận Chúa Giê-xu trước người đời thì Ngài sẽ xưng nhận người ấy trước Cha.'
  alternative: Xác định đây riêng biệt là lời tuyên nhận mang tính pháp đình trong cuộc phán xét cuối cùng, hoặc chỉ là ngôn ngữ về đời sống môn đồ hiện tại.
  rationale: Câu này không tự xác định thời điểm hay cơ chế tín lý rộng hơn; bản dịch giữ nguyên sức nặng thần học mà không giải quyết thay cho văn bản.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. “Xưng nhận” được dùng nhất quán ở cả hai vế để giữ phép đối ứng của nguyên văn; “người đời” chuyển tải đối tượng con người nói chung.
