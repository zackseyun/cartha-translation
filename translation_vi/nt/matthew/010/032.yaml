revisions:
- from: Vậy, bất cứ ai xưng nhận tôi trước mặt người đời, thì tôi cũng sẽ xưng nhận người ấy[a] trước mặt Cha tôi, Đấng ở trên trời.
  to: Vậy, bất cứ ai xưng nhận tôi trước mặt mọi người thì tôi cũng sẽ xưng nhận người ấy[a] trước mặt Cha tôi, Đấng ở trên trời.
  rationale: Chỉ thay “người đời” bằng “mọi người” để phản ánh chính xác hơn nghĩa khái quát của ἀνθρώπων mà không thêm sắc thái “thế gian.” Chú thích được điều chỉnh để bảo lưu tính đáng chú ý và độ mở của ἐν αὐτῷ, trong khi bản văn chính vẫn dùng cách nói tiếng Việt tự nhiên. Không thay đổi nội dung hay diễn giải thần học của câu.
