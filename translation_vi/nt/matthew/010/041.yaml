  terminology: 'Thuật ngữ nhất quán và phù hợp: “nhà tiên tri” cho προφήτης, “người công chính” cho δίκαιος, và “phần thưởng” cho μισθός. Không cần thêm yếu tố giới tính vào “người công chính”, vì tiếng Việt không biểu thị giống ngữ pháp và ngữ cảnh không đòi hỏi nhấn mạnh nam giới.'
