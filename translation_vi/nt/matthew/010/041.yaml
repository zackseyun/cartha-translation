id: MAT.10.41
reference: Matthew 10:41
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὁ δεχόμενος προφήτην εἰς ὄνομα προφήτου μισθὸν προφήτου λήμψεται, καὶ ὁ δεχόμενος δίκαιον εἰς ὄνομα δικαίου μισθὸν δικαίου λήμψεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/041.yaml
  text: The one who receives a prophet in the name of a prophet will receive a prophet’s reward[b][a], and the one who receives a righteous man in the name of a righteous man will receive a righteous man’s reward.
translation:
  language: vi
  text: Ai đón tiếp một nhà tiên tri vì người ấy là nhà tiên tri[a] sẽ nhận phần thưởng của nhà tiên tri; và ai đón tiếp một người công chính vì người ấy là người công chính[b] sẽ nhận phần thưởng của người công chính.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “trong danh một nhà tiên tri”; cũng có thể hiểu là “với tư cách là một nhà tiên tri.”'
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn: “trong danh một người công chính”; cũng có thể hiểu là “với tư cách là một người công chính.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δεχόμενος
  choice: ai đón tiếp
  rationale: Phân từ hiện tại có mạo từ được dùng như danh từ và nêu một nguyên tắc chung. “Ai đón tiếp” tự nhiên trong tiếng Việt, đồng thời diễn đạt đúng ý bất cứ người nào thực hiện hành động này.
- source_word: προφήτην
  choice: một nhà tiên tri
  rationale: Đây là tân ngữ trực tiếp; “nhà tiên tri” là cách gọi thông dụng, rõ nghĩa và giữ nguyên vai trò được nói đến.
- source_word: εἰς ὄνομα προφήτου
  choice: vì người ấy là nhà tiên tri
  rationale: Thành ngữ này chỉ việc đón tiếp một người dựa trên căn tính hoặc tư cách được nhìn nhận của người ấy. Cách dịch này rõ ràng, tự nhiên trong tiếng Việt; hình thức sát chữ và một khả năng dịch khác được giữ trong chú thích.
- source_word: μισθὸν προφήτου
  choice: phần thưởng của nhà tiên tri
  rationale: Cách diễn đạt này giữ quan hệ sở hữu/liên hệ của sở hữu cách Hy Lạp và không quyết định quá mức liệu đó là phần thưởng dành cho nhà tiên tri hay phần thưởng tương ứng với việc đón tiếp nhà tiên tri.
- source_word: λήμψεται
  choice: sẽ nhận
  rationale: Thì tương lai được diễn đạt tự nhiên bằng “sẽ nhận”; cách này trang trọng vừa phải và chính xác hơn lối nói khẩu ngữ.
- source_word: δίκαιον
  choice: một người công chính
  rationale: Tính từ được dùng như danh từ. “Người công chính” truyền đạt phẩm chất đạo đức/tôn giáo của δίκαιος một cách tự nhiên; tiếng Việt không cần đánh dấu giống ngữ pháp như tiếng Hy Lạp.
- source_word: εἰς ὄνομα δικαίου
  choice: vì người ấy là người công chính
  rationale: 'Giữ đúng cấu trúc ý nghĩa song song với vế đầu: người này được đón tiếp dựa trên căn tính được nhìn nhận là người công chính. Hình thức sát chữ được nêu trong chú thích.'
- source_word: μισθὸν δικαίου
  choice: phần thưởng của người công chính
  rationale: Giữ phép song hành với “phần thưởng của nhà tiên tri” và bảo tồn độ mở của quan hệ sở hữu cách.
theological_decisions:
- issue: Ý nghĩa của thành ngữ εἰς ὄνομα + sở hữu cách
  choice: Dịch trong chính văn là “vì người ấy là…” và ghi cách dịch sát chữ trong chú thích.
  alternative: “nhân danh một nhà tiên tri/người công chính” hoặc “với tư cách là một nhà tiên tri/người công chính”
  rationale: Trong ngữ cảnh, cụm từ nói đến lý do hoặc căn cứ để đón tiếp người ấy, tức nhận biết căn tính hay tư cách của họ. “Nhân danh” trong tiếng Việt dễ bị hiểu là người đón tiếp hành động thay mặt người kia, nên cách dịch theo nghĩa được ưu tiên, còn sắc thái nguyên văn được bảo tồn ở chú thích.
- issue: Ý nghĩa của μισθὸν προφήτου / μισθὸν δικαίου
  choice: Giữ cách nói “phần thưởng của…” mà không giải thích thêm.
  alternative: “phần thưởng dành cho nhà tiên tri/người công chính” hoặc “phần thưởng vì đã đón tiếp nhà tiên tri/người công chính”
  rationale: Sở hữu cách có thể chỉ phần thưởng nhà tiên tri/người công chính nhận, hoặc phần thưởng gắn với việc tiếp nhận họ. Chính văn không thu hẹp sự mơ hồ chân thực này.
- issue: Cách thể hiện giống của δίκαιον
  choice: Dùng “người công chính”.
  alternative: “người đàn ông công chính”
  rationale: Dù hình thức Hy Lạp là giống đực số ít, trong tiếng Việt “người” vừa tự nhiên vừa không che khuất nội dung từ vựng; thêm “đàn ông” sẽ nhấn mạnh giới tính hơn mức ngữ cảnh đòi hỏi.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Ai… sẽ…” diễn đạt nguyên tắc chung tự nhiên hơn việc mô phỏng cứng cấu trúc phân từ Hy Lạp. Hai vế được giữ song hành chặt chẽ; dấu chấm phẩy làm rõ cấu trúc mà không tách rời câu.
