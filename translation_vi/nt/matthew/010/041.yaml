  source_fidelity: Bản dịch truyền đạt đúng cấu trúc song hành và ý nghĩa của câu Hy Lạp. “Ai đón tiếp… sẽ nhận” diễn đạt phù hợp phân từ có mạo từ ὁ δεχόμενος và động từ tương lai λήμψεται. Cách dịch “vì người ấy là…” phản ánh đúng giá trị thành ngữ của εἰς ὄνομα + sở hữu cách trong ngữ cảnh, còn chú thích bảo lưu cách diễn đạt sát chữ và cách hiểu “với tư cách là”. “Phần thưởng của…” giữ được độ mở hợp lý của sở hữu cách trong μισθὸν προφήτου / δικαίου.
