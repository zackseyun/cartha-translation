  text: but go instead to the lost sheep of the house of Israel[a].
translation:
  language: vi
  text: Nhưng trái lại, hãy đi đến với những con chiên lạc mất của nhà Y-sơ-ra-ên[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “Nhưng đúng hơn, hãy đi đến với những con chiên đã lạc của nhà Y-sơ-ra-ên.”'
    reason: Bảo lưu cách diễn đạt tường minh hơn của δὲ μᾶλλον («nhưng đúng hơn»), trong khi vẫn giữ hình ảnh và quan hệ sở hữu của cụm «nhà Y-sơ-ra-ên».
lexical_decisions:
- source_word: πορεύεσθε
  choice: hãy đi
  rationale: Động từ mệnh lệnh số nhiều; “hãy đi” là cách truyền đạt tự nhiên, rõ ràng một chỉ thị trực tiếp.
- source_word: δὲ μᾶλλον
  choice: nhưng hãy đi đến
  rationale: Cụm này đối lập và chuyển hướng so với lệnh cấm ở câu trước. Tiếng Việt không cần dịch μᾶλλον thành một từ riêng như “thay vào đó” vì “nhưng” cùng ngữ cảnh đã biểu đạt sự chuyển hướng; chú thích bảo lưu khả năng dịch tường minh hơn.
- source_word: πρὸς
  choice: đến với
  rationale: Sau động từ chỉ chuyển động, πρός diễn tả hướng đến đối tượng. “Đến với” tự nhiên khi nói về việc tìm đến con người, đồng thời không làm mất hình ảnh ẩn dụ.
- source_word: τὰ πρόβατα
  choice: những con chiên
  rationale: Giữ nguyên hình ảnh đàn chiên trong nguyên bản và âm hưởng Kinh Thánh; “những con chiên” vừa dễ hiểu vừa không diễn giải thành “người”.
- source_word: τὰ ἀπολωλότα
  choice: lạc mất
  rationale: Phân từ hoàn thành của ἀπόλλυμι ở đây bổ nghĩa cho “chiên.” “Lạc mất” phù hợp với ẩn dụ mục tử và giữ được sắc thái vừa đi lạc vừa ở trong tình trạng bị mất.
- source_word: οἴκου Ἰσραήλ
  choice: của nhà Y-sơ-ra-ên
  rationale: Giữ cấu trúc và âm hưởng giao ước của thành ngữ “nhà Y-sơ-ra-ên,” thay vì diễn giải thành “dân Y-sơ-ra-ên.”
theological_decisions:
- issue: Cách hiểu ẩn dụ về Y-sơ-ra-ên
  choice: Giữ nguyên “những con chiên lạc mất của nhà Y-sơ-ra-ên.”
  alternative: “những người Y-sơ-ra-ên đã đi lạc”
  rationale: Nguyên văn dùng trực tiếp hình ảnh chiên và mang âm hưởng ngôn ngữ tiên tri. Giữ ẩn dụ bảo toàn mối liên hệ văn chương và thần học mà không áp đặt phần diễn giải.
- issue: Quan hệ của cụm sở hữu οἴκου Ἰσραήλ
  choice: Hiểu là những con chiên lạc mất thuộc nhà Y-sơ-ra-ên.
  alternative: Những con chiên đã bị mất khỏi nhà Y-sơ-ra-ên.
  rationale: Cú pháp Hy Lạp có thể gợi cả hai cách liên hệ. Bản chính dùng cách hiểu tự nhiên hơn trong ngữ cảnh, còn chú thích bảo lưu cách hiểu “mất khỏi nhà.”
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Y-sơ-ra-ên” theo lối phiên âm Kinh Thánh quen thuộc; giữ “con chiên” và “nhà Y-sơ-ra-ên” để bảo toàn hình ảnh cùng âm hưởng nguyên bản.
