  text: Οὐκ ἔστιν μαθητὴς ὑπὲρ τὸν διδάσκαλον οὐδὲ δοῦλος ὑπὲρ τὸν κύριον αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/024.yaml
  text: A disciple is not above the teacher[b][a], nor a slave above his master.
translation:
  language: vi
  text: Người môn đệ không hơn thầy, người nô lệ cũng không hơn chủ của mình.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hoặc “tôi tớ”. Từ Hy Lạp δοῦλος có thể chỉ người phục dịch, nhưng trong cặp với “chủ” ở đây, nó nhấn mạnh quan hệ lệ thuộc.
    reason: alternative_reading
lexical_decisions:
- source_word: μαθητής
  choice: môn đồ
  rationale: “Môn đồ” giữ được ý nghĩa về người theo học trong mối quan hệ gắn bó với thầy, phù hợp bối cảnh sách Tin Mừng hơn “học sinh”.
- source_word: ὑπέρ
  choice: hơn
  rationale: Khi đi với đối cách ở đây, từ này diễn tả địa vị cao hơn; “không hơn” tự nhiên và chính xác trong tiếng Việt.
- source_word: διδάσκαλος
  choice: thầy
  rationale: “Thầy” là cách gọi tự nhiên, trang trọng và cô đọng đối với người dạy, đồng thời cân xứng với “môn đồ”.
- source_word: δοῦλος
  choice: tôi tớ
  rationale: Trong tiếng Việt hiện đại, “tôi tớ” vừa diễn tả địa vị lệ thuộc vào chủ vừa giữ sắc thái trang trọng của lời ví von; chú thích nêu cách dịch mạnh hơn là “nô lệ”.
- source_word: κύριος
  choice: chủ
  rationale: Trong cặp δοῦλος/κύριος, từ này chỉ người chủ trong quan hệ xã hội, không phải tước hiệu thần tính; “chủ” là cách dịch rõ và tự nhiên.
- source_word: αὐτοῦ
  choice: mình
  rationale: Đại từ sở hữu quy chiếu về người tôi tớ; “chủ mình” là lối diễn đạt tiếng Việt tự nhiên và không thêm ý ngoài nguyên văn.
- source_word: οὐδέ
  choice: cũng không
  rationale: Cụm này nối mệnh đề phủ định thứ hai với mệnh đề đầu một cách tự nhiên, giữ quan hệ song song của nguyên văn.
theological_decisions:
- issue: Cách dịch δοῦλος trong phép ví von về địa vị xã hội
  choice: tôi tớ
  alternative: nô lệ
  rationale: δοῦλος có thể chỉ một người thuộc quyền và lệ thuộc vào chủ. “Tôi tớ” phù hợp văn phong Kinh Thánh tiếng Việt và dễ hiểu, còn “nô lệ” làm nổi bật mạnh hơn tình trạng bị sở hữu; phương án ấy được giữ trong chú thích để không che khuất sắc thái nguyên ngữ.
- issue: Cách dịch κύριος trong bối cảnh không chỉ về Đức Chúa Trời
  choice: chủ
  alternative: Chúa
  rationale: Ở đây κύριος đứng đối ứng với δοῦλος trong một phép so sánh xã hội và có αὐτοῦ bổ nghĩa, nên chỉ người chủ của tôi tớ. Dịch “chủ” tránh gán cho từ này một tước hiệu thần tính mà văn cảnh không đòi hỏi.
translation_notes:
  register: Văn phong hiện đại, trang trọng và cô đọng. Cấu trúc song song “không hơn… cũng không hơn…” phản ánh sát nhịp và lập luận của câu Hy Lạp; dùng “môn đồ/thầy” và “tôi tớ/chủ” để giữ hai cặp quan hệ phân biệt.
