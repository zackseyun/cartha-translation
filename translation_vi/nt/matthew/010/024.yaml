  to: Người môn đệ không hơn thầy, người nô lệ cũng không hơn chủ của mình.[a]
  rationale: Bản sửa thay “tôi tớ” bằng “nô lệ” để diễn đạt sát hơn δοῦλος trong tương quan với κύριος, đồng thời thay “môn đồ” bằng “người môn đệ” cho tiếng Việt chuẩn hiện đại. Cấu trúc phủ định song song, các quan hệ thầy/môn đệ và chủ/nô lệ, cùng đại từ sở hữu quy chiếu về người nô lệ đều được giữ nguyên. Chú thích được đặt ngay sau “nô lệ” và chỉ nêu phương án thay thế có ích cho người đọc.
  reviewer_model: gpt-5.6-terra
