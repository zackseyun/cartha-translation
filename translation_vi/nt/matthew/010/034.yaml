  terminology: “Hòa bình” phù hợp với εἰρήνη; “gươm” là từ trang trọng, quen thuộc trong tiếng Việt Kinh Thánh và bảo toàn hình ảnh cụ thể của μάχαιρα. Đại từ “tôi” phù hợp với lời nói trực tiếp trong bản dịch hiện đại.
