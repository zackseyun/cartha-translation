  source_fidelity: Bản nháp giữ đúng mệnh lệnh phủ định, mục đích của việc đến, sự đối lập “hòa bình ... nhưng là gươm”, và không diễn giải hình ảnh “gươm” trong chính văn. Tuy nhiên, cùng một động từ Hy Lạp ἦλθον được dịch không nhất quán là “đã đến” rồi “đến”; nên giữ nhất quán để phản ánh phép lặp có chủ ý của nguyên văn. Chú thích a cũng đang đặt sau “thế gian”, dù nội dung chú thích liên quan đến “đã đến”.
