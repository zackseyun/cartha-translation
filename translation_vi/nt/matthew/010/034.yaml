  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Μὴ νομίσητε ὅτι ἦλθον βαλεῖν εἰρήνην ἐπὶ τὴν γῆν· οὐκ ἦλθον βαλεῖν εἰρήνην ἀλλὰ μάχαιραν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/034.yaml
  text: Do not think that I came to bring peace on the earth[a]; I did not come to bring peace[b], but a sword.
translation:
  language: vi
  text: Đừng nghĩ rằng tôi đã đến[a] để đem hòa bình đến thế gian. Tôi đã đến không phải để đem hòa bình, nhưng là gươm[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “tôi đến” thay cho “tôi đã đến”.'
    reason: lexical_alternative
  - marker: b
    text: Tiếng Hy Lạp nói là “gươm”; trong văn cảnh, hình ảnh này nói đến sự chia rẽ chứ không cổ xúy bạo lực.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ νομίσητε
  choice: Đừng nghĩ rằng
  rationale: Mệnh lệnh phủ định với μή và động từ ở thể giả định aorist được diễn đạt tự nhiên, trực tiếp trong tiếng Việt bằng “Đừng nghĩ rằng”.
- source_word: ἦλθον
  choice: tôi đã đến / Tôi đến
  rationale: Aorist chỉ việc đến gắn với sứ mạng và mục đích. Tiếng Việt có thể dùng “đã đến” ở lần đầu để nêu sự kiện, rồi “Tôi đến” trong câu đối chiếu để diễn đạt mục đích tự nhiên.
- source_word: βαλεῖν
  choice: để đem
  rationale: Dù nghĩa đen là “ném/quăng”, trong cấu trúc này với “hòa bình” và “gươm”, “đem” truyền đạt tự nhiên kết quả hay mục đích mà không làm hình ảnh trở nên khó hiểu.
- source_word: εἰρήνην
  choice: hòa bình
  rationale: Đây là từ tương ứng thông dụng, rõ nghĩa của εἰρήνη trong tiếng Việt hiện đại.
- source_word: ἐπὶ τὴν γῆν
  choice: đến thế gian
  rationale: γῆ ở đây có nghĩa rộng là cõi đất/thế gian. “Đến thế gian” đi tự nhiên với động từ “đem” và tránh cách nói cứng “trên trái đất”.
- source_word: ἀλλὰ
  choice: nhưng là
  rationale: Diễn đạt rõ sự tương phản mạnh và cấu trúc rút gọn “không phải... nhưng là...” trong tiếng Việt.
- source_word: μάχαιραν
  choice: gươm
  rationale: Giữ nguyên hình ảnh cụ thể của μάχαιρα thay vì diễn giải thành “chia rẽ”. “Gươm” là cách gọi trang trọng, quen thuộc trong văn cảnh Kinh Thánh.
theological_decisions:
- issue: Có nên làm nhẹ lời của Chúa Giê-su bằng cách diễn giải “gươm” thành “sự chia rẽ” trong chính văn hay không
  choice: Giữ hình ảnh cụ thể “gươm” trong chính văn
  alternative: sự chia rẽ
  rationale: Bản Hy Lạp nói rõ μάχαιραν, “gươm”. Văn cảnh kế tiếp cho thấy hậu quả chia rẽ, nhưng dịch thuật không nên giải quyết hình ảnh và sức căng thần học ngay trong chính văn.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng đại từ “tôi” theo lời nói trực tiếp; giữ hình ảnh “gươm” để bảo toàn sức mạnh và sự căng thẳng của nguyên văn.
