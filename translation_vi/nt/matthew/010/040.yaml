id: MAT.10.40
reference: Matthew 10:40
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ὁ δεχόμενος ὑμᾶς ἐμὲ δέχεται, καὶ ὁ ἐμὲ δεχόμενος δέχεται τὸν ἀποστείλαντά με.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/040.yaml
  text: The one who receives you receives me[a], and the one who receives me receives the one who sent me.
translation:
  language: vi
  text: Ai tiếp nhận anh em là tiếp nhận tôi[a], và ai tiếp nhận tôi là tiếp nhận Đấng đã sai tôi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “đón tiếp” hoặc “chấp nhận”; động từ Hy Lạp có thể mang các nghĩa này, nhất là khi nói đến việc tiếp nhận một sứ giả.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὁ δεχόμενος
  choice: Ai tiếp nhận
  rationale: Phân từ hiện tại có mạo từ được dùng như danh từ và mang ý nghĩa khái quát. Cấu trúc “ai...” tự nhiên trong tiếng Việt hiện đại và giữ được phạm vi áp dụng chung.
- source_word: δέχομαι / δέχεται
  choice: tiếp nhận
  rationale: Giữ nguyên sự lặp lại có chủ ý của động từ trong cả hai vế, qua đó thể hiện chuỗi liên hệ giữa các môn đồ, Chúa Giê-su và Đấng sai Ngài. “Tiếp nhận” bao hàm việc đón tiếp và chấp nhận sứ giả.
- source_word: ὑμᾶς
  choice: anh em
  rationale: Đại từ ngôi thứ hai số nhiều chỉ các môn đồ đang được Chúa Giê-su phán bảo. “Anh em” thể hiện số nhiều và phù hợp với lời nói trực tiếp trang trọng, tự nhiên.
- source_word: ἐμέ / με
  choice: tôi
  rationale: Đại từ ngôi thứ nhất số ít chỉ Chúa Giê-su. “Tôi” là cách tự xưng trực tiếp, rõ ràng trong diễn ngôn.
- source_word: τὸν ἀποστείλαντά με
  choice: Đấng đã sai tôi
  rationale: Phân từ chủ động bất định có mạo từ được dùng như danh từ. “Đấng đã sai tôi” tự nhiên, giữ tính ngôi vị và không bổ sung danh xưng “Cha” vốn không xuất hiện trực tiếp trong câu Hy Lạp.
theological_decisions:
- issue: Danh tính của Đấng sai Chúa Giê-su
  choice: Đấng đã sai tôi
  alternative: Cha, Đấng đã sai tôi
  rationale: Văn cảnh và thần học Ma-thi-ơ cho thấy Đấng ấy là Đức Chúa Cha, nhưng nguyên văn chỉ nói “Đấng đã sai tôi”. Bản dịch giữ cách diễn đạt của nguồn, không đưa phần giải thích thần học vào chính văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “tiếp nhận” xuyên suốt để bảo toàn phép lặp và chuỗi liên hệ trong nguyên văn; viết hoa “Đấng” như một đại từ tôn kính nhưng không nêu rõ danh tính ngoài điều câu Hy Lạp trực tiếp nói.
