source:
  edition: SBLGNT
  text: ἀμὴν λέγω ὑμῖν, ἀνεκτότερον ἔσται γῇ Σοδόμων καὶ Γομόρρων ἐν ἡμέρᾳ κρίσεως ἢ τῇ πόλει ἐκείνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/015.yaml
  text: Truly I say to you[c][b][a], it will be more bearable for the land of Sodom and Gomorrah on the day of judgment than for that town.
translation:
  language: vi
  text: 'Quả thật, tôi nói với anh em: Vào ngày phán xét, đất Sô-đôm và Gô-mô-rơ sẽ dễ chịu hơn thành ấy.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Thành” cũng có thể dịch là “thị trấn.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν
  choice: Thật
  rationale: Trong công thức long trọng ἀμὴν λέγω ὑμῖν, “Thật” truyền đạt sức xác quyết mà vẫn tự nhiên, trang trọng trong tiếng Việt hiện đại.
- source_word: λέγω ὑμῖν
  choice: tôi nói với anh em
  rationale: Bám sát công thức lời nói trực tiếp của Hy Lạp; “anh em” là cách xưng hô số nhiều tự nhiên trong lời Đức Giê-su nói với các môn đồ.
- source_word: ἀνεκτότερον
  choice: còn dễ chịu đựng hơn
  rationale: Diễn đạt rõ nghĩa so sánh ‘dễ chịu nổi hơn, có thể dung chịu hơn’, đồng thời tránh lối nói quá trừu tượng.
- source_word: γῇ Σοδόμων καὶ Γομόρρων
  choice: đất Sô-đôm và Gô-mô-rơ
  rationale: Giữ hình ảnh địa lý cụ thể của γῇ và quan hệ sở thuộc trong nguyên văn, thay vì giản lược thành tên hai thành.
- source_word: ἐν ἡμέρᾳ κρίσεως
  choice: Trong ngày phán xét
  rationale: Chuyển tải tự nhiên thời điểm phán xét mang định hướng tương lai mà không bổ sung một hệ thống cánh chung ngoài câu chữ.
- source_word: τῇ πόλει ἐκείνῃ
  choice: thành ấy
  rationale: πόλις có thể là thành hoặc thị trấn; “thành ấy” ngắn gọn, trang trọng và giữ được lực hồi chỉ của ἐκείνῃ.
theological_decisions:
- issue: Bản chất của ‘ngày phán xét’
  choice: Giữ cách nói ‘ngày phán xét’ như một ngày phán xét tương lai của Đức Chúa Trời, không diễn giải thêm.
  alternative: Hiểu theo nghĩa một thời kỳ phán xét tổng quát.
  rationale: Cụm từ tự nhiên hướng đến sự phán xét cánh chung, nhưng bản dịch không nên áp đặt chi tiết giáo lý mà câu này không nêu.
- issue: Mức độ phán xét khác nhau
  choice: Giữ nguyên phép so sánh rằng đất Sô-đôm và Gô-mô-rơ sẽ dễ chịu đựng hơn thành ấy.
  alternative: Diễn giải thành mức hình phạt cụ thể khác nhau.
  rationale: Nguyên văn khẳng định một sự so sánh nhưng không giải thích cơ chế hay mức phạt; bản dịch bảo toàn sự căng thẳng ấy.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ trật tự nhấn mạnh của câu bằng cách đưa “Trong ngày phán xét” lên trước mệnh đề so sánh. Dùng địa danh quen thuộc “Sô-đôm” và “Gô-mô-rơ”; tránh các từ ngữ mang màu sắc hệ phái.
