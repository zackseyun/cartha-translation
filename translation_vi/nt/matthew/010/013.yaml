id: MAT.10.13
reference: Matthew 10:13
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἐὰν μὲν ᾖ ἡ οἰκία ἀξία, ἐλθάτω ἡ εἰρήνη ὑμῶν ἐπ’ αὐτήν· ἐὰν δὲ μὴ ᾖ ἀξία, ἡ εἰρήνη ὑμῶν ⸀πρὸς ὑμᾶς ἐπιστραφήτω.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/013.yaml
  text: And if the house is worthy[a], let your peace come upon it; but if it is not worthy[c][b], let your peace return to you.
translation:
  language: vi
  text: Nếu nhà ấy xứng đáng[a], nguyện sự bình an của anh em đến trên nhà ấy; còn nếu nhà ấy không xứng đáng[b], nguyện sự bình an của anh em trở về với anh em.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Nhà” cũng có thể chỉ gia đình hoặc những người sống trong nhà; từ Hy Lạp có thể nói đến nơi ở và, theo nghĩa mở rộng, những người ở đó.
    reason: lexical_alternative
  - marker: b
    text: “Xứng đáng” ở đây có nghĩa là thích hợp để tiếp nhận các sứ giả cùng sự bình an của họ, chứ không có nghĩa là hoàn toàn vô tội về đạo đức.
    reason: cultural_note
lexical_decisions:
- source_word: οἰκία
  choice: nhà
  rationale: Đây là từ tương đương trực tiếp và tự nhiên; trong ngữ cảnh, từ này cũng có thể bao hàm gia đình hoặc những người sống trong nhà.
- source_word: ἀξία
  choice: xứng đáng
  rationale: Giữ sắc thái đánh giá của nguyên văn mà không thu hẹp nghĩa thành chỉ 'sẵn lòng tiếp nhận'; ở đây ngữ cảnh xác định đó là sự thích hợp để tiếp đón các sứ giả và lời chúc bình an.
- source_word: ἐλθάτω
  choice: nguyện ... đến
  rationale: Diễn đạt mệnh lệnh ngôi thứ ba theo lối tự nhiên, trang trọng trong tiếng Việt, đồng thời không biến câu thành một lời khẳng định đơn thuần.
- source_word: εἰρήνη
  choice: sự bình an
  rationale: Là từ tương đương thông dụng, vẫn để ngỏ sắc thái rộng hơn của lời chúc phúc và sự an lành trong bối cảnh Do Thái.
- source_word: ἐπ’ αὐτήν
  choice: đến trên nhà ấy
  rationale: Giữ hướng chuyển động và hình ảnh sự bình an đến trên ngôi nhà, đồng thời nêu lại 'nhà ấy' để tiếng Việt rõ ràng, tự nhiên.
- source_word: πρὸς ὑμᾶς ἐπιστραφήτω
  choice: nguyện ... trở về với anh em
  rationale: Truyền đạt tự nhiên ý sự bình an quay trở lại phía các môn đồ; 'với anh em' phù hợp với cách nói tiếng Việt hơn 'đến anh em'.
- source_word: μὲν ... δὲ
  choice: nếu ...; còn nếu ...
  rationale: Thể hiện rõ cấu trúc đối chiếu của hai điều kiện mà không dùng lối diễn đạt nặng nề.
theological_decisions:
- issue: Bản chất của 'sự bình an của anh em'
  choice: Giữ nguyên hình ảnh sự bình an do các môn đồ đem đến có thể đến trên nhà hoặc trở về với họ.
  alternative: Diễn giải thành 'lời chào bình an', 'lời chúc bình an' hoặc một năng lực được truyền ban.
  rationale: Nguyên văn trình bày sự bình an một cách cụ thể nhưng không giải thích cơ chế. Bản dịch giữ sự căng thẳng và tính gợi hình ấy, không giản lược thành lời chào xã giao cũng không hệ thống hóa thành một giáo lý về sự truyền ban.
- issue: Ý nghĩa của 'xứng đáng'
  choice: Giữ 'xứng đáng' trong chính văn và giải thích bằng chú thích rằng từ này nói đến sự thích hợp để tiếp nhận các sứ giả cùng sự bình an của họ.
  alternative: Dịch thẳng là 'sẵn lòng tiếp nhận' hoặc hiểu là hoàn toàn vô tội về đạo đức.
  rationale: ἀξία có nghĩa đánh giá rộng hơn 'sẵn lòng tiếp nhận', nhưng trong ngữ cảnh không đòi hỏi sự hoàn hảo đạo đức.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng 'anh em' cho đại từ số nhiều ὑμῶν/ὑμᾶς theo lời Đức Giê-su nói với nhóm môn đồ. Cấu trúc 'nguyện ...' diễn đạt tự nhiên mệnh lệnh ngôi thứ ba và giữ sắc thái của lời bình an được sai đến hoặc trở về.
