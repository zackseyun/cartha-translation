id: MAT.10.14
reference: Matthew 10:14
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ὃς ⸀ἂν μὴ δέξηται ὑμᾶς μηδὲ ἀκούσῃ τοὺς λόγους ὑμῶν, ἐξερχόμενοι ⸀ἔξω τῆς οἰκίας ἢ τῆς πόλεως ἐκείνης ἐκτινάξατε τὸν κονιορτὸν τῶν ποδῶν ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/014.yaml
  text: And whoever does not receive you or listen to your words[a], as you go out of that house or that town[c][b], shake off the dust from your feet.
translation:
  language: vi
  text: Còn ai không tiếp đón anh em, cũng không nghe lời anh em, thì khi ra khỏi nhà hay thành ấy, hãy giũ bụi khỏi chân mình.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Giũ bụi khỏi chân” là một hành động tượng trưng, bày tỏ sự đoạn tuyệt và sự phán xét đối với những người khước từ sứ điệp.
    reason: cultural_note
lexical_decisions:
- source_word: καὶ ὃς ἂν μὴ
  choice: Còn ai không
  rationale: Diễn đạt tự nhiên cấu trúc phiếm chỉ ὃς ἂν μὴ, mang nghĩa “bất cứ ai không”; καί nối tiếp lời dạy trước bằng “Còn”.
- source_word: δέξηται ὑμᾶς
  choice: tiếp đón anh em
  rationale: δέχομαι trong ngữ cảnh nói đến việc đón nhận các sứ giả, bao gồm sắc thái hiếu khách và chấp nhận sứ mạng của họ. “Tiếp đón” rõ và tự nhiên trong tiếng Việt.
- source_word: μηδὲ ἀκούσῃ τοὺς λόγους ὑμῶν
  choice: cũng không nghe lời anh em
  rationale: Giữ động từ ἀκούω là “nghe” và λόγοι là “lời”, không diễn giải quá mức thành vâng theo; trong ngữ cảnh, cụm này vẫn có thể hàm ý không chịu lắng nghe.
- source_word: ἐξερχόμενοι ἔξω
  choice: khi ra khỏi
  rationale: Phân từ chỉ hoàn cảnh đi kèm mệnh lệnh chính; “khi ra khỏi” tái hiện rõ ý chuyển động ra ngoài mà vẫn tự nhiên.
- source_word: τῆς οἰκίας ἢ τῆς πόλεως ἐκείνης
  choice: nhà hay thành ấy
  rationale: Giữ hai địa điểm thay thế nhau và lực chỉ định của ἐκείνης. “Thành” đủ rộng để chỉ một đô thị hay thị trấn thời cổ mà không buộc quy mô hiện đại.
- source_word: ἐκτινάξατε τὸν κονιορτὸν τῶν ποδῶν ὑμῶν
  choice: hãy giũ bụi khỏi chân mình
  rationale: “Giũ” diễn tả hành động phủi bật bụi theo mệnh lệnh ἐκτινάξατε; “bụi” tương ứng chính xác với κονιορτός, và “khỏi chân mình” thể hiện sự loại bỏ bụi khỏi chân của chính các môn đồ.
theological_decisions:
- issue: Hành động tượng trưng đối với những người khước từ các môn đồ và sứ điệp
  choice: Giữ nguyên mệnh lệnh cụ thể “hãy giũ bụi khỏi chân mình” trong chính văn.
  alternative: Diễn giải thành “để làm chứng nghịch lại họ” hoặc “hãy để họ chịu phán xét”.
  rationale: Câu này chỉ nêu hành động tượng trưng mà không tự giải thích đầy đủ ý nghĩa. Không nhập lời từ các đoạn song song hay giải quyết ngầm sắc thái phán xét; chú thích cung cấp bối cảnh văn hóa ở mức cần thiết.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh em” cho đại từ số nhiều ὑμᾶς/ὑμῶν trong lời Đức Giê-su nói với các môn đồ; dùng “mình” hồi chỉ tự nhiên về chủ thể số nhiều. “Thành” giữ sắc thái Kinh Thánh trang trọng nhưng không nhất thiết hàm ý một đô thị lớn.
