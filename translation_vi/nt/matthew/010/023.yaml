revisions:
- from: 'Nhưng khi người ta bắt bớ anh em trong thành này, hãy trốn sang thành khác.[a] Thật, tôi nói với anh em: anh em chắc chắn chưa đi hết các thành của Ít-ra-ên thì Con Người đã đến.[b][c]'
  to: 'Khi nào người ta bắt bớ anh em trong thành này, hãy trốn sang thành khác.[a] Quả thật, tôi nói với anh em: anh em nhất định sẽ không đi hết các thành của Ít-ra-ên trước khi Con Người đến.[b][c]'
  rationale: Sửa thì “đã đến” thành “đến” để giữ đúng hướng tương lai của ἕως ἂν ἔλθῃ và giữ nguyên độ mở cánh chung. “Trước khi” diễn đạt rõ trong tiếng Việt quan hệ mà câu phủ định nhấn mạnh οὐ μή thiết lập. Các chú thích được giữ nguyên nội dung thiết yếu, đồng bộ với chính văn đã sửa.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T02:45:12Z'
review_pass:
  verdict: revise
  source_fidelity: Bản thảo chuyển tải đúng mệnh lệnh chạy khỏi sự bắt bớ, đối tượng “các thành của Ít-ra-ên”, và danh xưng “Con Người”. Tuy nhiên, “Con Người đã đến” dùng thì hoàn thành và có thể khiến sự đến bị hiểu là đã xảy ra, trong khi ἕως ἂν ἔλθῃ hướng đến một biến cố tương lai. Cần đổi thành “Con Người đến” và điều chỉnh cấu trúc thời gian cho rõ quan hệ tương lai.
  naturalness: “Nhưng khi” không sai, nhưng “Khi nào” phản ánh tự nhiên hơn sắc thái không xác định/lặp lại của ὅταν trong một chỉ dẫn chung. “Quả thật” là công thức tiếng Việt hiện đại tự nhiên hơn “Thật” ở đầu lời xác quyết. Cấu trúc “nhất định sẽ không ... trước khi ... đến” rõ ràng và tránh hàm ý quá khứ của “đã đến”.
  terminology: “bắt bớ”, “anh em”, “thành”, “Ít-ra-ên”, và “Con Người” phù hợp với văn phong Kinh Thánh tiếng Việt hiện đại. Giữ “tôi nói với anh em” là lựa chọn trung tính, không áp đặt một truyền thống xưng hô giáo phái. Chú thích c cần đồng bộ thì tương lai của chính văn.
  issues:
  - severity: medium
    issue: Thì của “Con Người đã đến”
    rationale: ἔλθῃ là động từ giả định aorist trong mệnh đề thời gian với ἕως ἄν, chỉ mốc đến trong tương lai. Cách dùng “đã đến” trong tiếng Việt dễ được đọc như một sự kiện hoàn tất, không phù hợp trực tiếp với nguyên ngữ.
  - severity: low
    issue: Sắc thái của ὅταν và công thức ἀμήν
    rationale: “Khi nào” diễn tả rõ hơn điều kiện thời gian không xác định của ὅταν; “Quả thật” tự nhiên và quen thuộc hơn “Thật” khi mở đầu một lời tuyên bố long trọng.
