id: MAT.10.23
reference: Matthew 10:23
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὅταν δὲ διώκωσιν ὑμᾶς ἐν τῇ πόλει ταύτῃ, φεύγετε εἰς τὴν ⸀ἑτέραν· ἀμὴν γὰρ λέγω ὑμῖν, οὐ μὴ τελέσητε τὰς πόλεις ⸀τοῦ Ἰσραὴλ ἕως ⸀ἂν ἔλθῃ ὁ υἱὸς τοῦ ἀνθρώπου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/023.yaml
  text: But whenever they persecute you in this city[a], flee to the next one. For truly I say to you[c][b], you will certainly not finish going through the cities of Israel until the Son of Man comes.
translation:
  language: vi
  text: 'Khi nào người ta bắt bớ anh em trong thành này, hãy trốn sang thành khác.[a] Quả thật, tôi nói với anh em: anh em nhất định sẽ không đi hết các thành của Ít-ra-ên trước khi Con Người đến.[b][c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “hãy trốn sang thành kế tiếp.” Tiếng Hy Lạp nói sát nghĩa là “sang thành kia/thành khác”, trong đó từ “thành” được hiểu từ mệnh đề trước.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch sát hơn: “anh em nhất định sẽ không hoàn tất các thành của Ít-ra-ên.” Cách dịch “đi hết” làm rõ hành trình qua các thành được hàm ý trong văn cảnh.'
    reason: lexical_alternative
  - marker: c
    text: 'Cụm từ “Con Người đến” được chủ ý để ngỏ. Có những cách hiểu khác nhau: lời này nói về việc Chúa Giê-su được minh chứng, việc ngài đến để phán xét, hoặc cuộc trở lại cuối cùng của ngài.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὅταν
  choice: khi
  rationale: Trong tiếng Việt, “khi” tự nhiên và có thể diễn đạt một tình huống có thể xảy ra; lực khái quát của mệnh đề được giữ trong lời chỉ dẫn chung.
- source_word: διώκωσιν
  choice: bắt bớ
  rationale: Diễn tả sự truy bức thù địch trong bối cảnh sai phái, mạnh hơn nghĩa đơn thuần là đuổi theo.
- source_word: πόλει ταύτῃ
  choice: thành này
  rationale: Giữ sắc thái trực tiếp của đại từ chỉ định gần ταύτῃ.
- source_word: φεύγετε
  choice: hãy trốn
  rationale: Mệnh lệnh khẩn cấp rời khỏi nơi bị bắt bớ; cách nói này tự nhiên, rõ ràng trong tiếng Việt hiện đại.
- source_word: εἰς τὴν ἑτέραν
  choice: sang thành khác
  rationale: Danh từ “thành” được hiểu ngầm trong tiếng Hy Lạp từ mệnh đề trước; tiếng Việt cần nhắc lại để câu rõ và tự nhiên. ἑτέραν có thể là thành khác hoặc thành kế tiếp.
- source_word: ἀμὴν
  choice: Thật
  rationale: Giữ công thức long trọng mở đầu lời khẳng định có thẩm quyền mà vẫn gọn và dễ hiểu.
- source_word: οὐ μὴ τελέσητε
  choice: chắc chắn chưa đi hết
  rationale: “Chắc chắn” chuyển tải phép phủ định nhấn mạnh οὐ μή; “đi hết” làm rõ hoạt động di chuyển qua các thành được hàm ý bởi τελέω cùng tân ngữ.
- source_word: τὰς πόλεις τοῦ Ἰσραήλ
  choice: các thành của Ít-ra-ên
  rationale: Chuyển tải trực tiếp cấu trúc sở thuộc, chỉ các thành thuộc Ít-ra-ên trong bối cảnh sứ mạng.
- source_word: ἕως ἂν ἔλθῃ
  choice: thì ... đã đến
  rationale: Trong cấu trúc tiếng Việt “chưa ... thì ... đã”, câu diễn đạt tự nhiên rằng việc đi hết các thành sẽ không hoàn tất trước khi Con Người đến, đồng thời không xác định bản chất của sự đến ấy.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Con Người
  rationale: Danh xưng truyền thống, giữ nguyên hình ảnh và âm hưởng thần học của nguyên ngữ.
theological_decisions:
- issue: Ý nghĩa của việc “Con Người đến” trong văn cảnh này
  choice: Giữ nguyên cách diễn đạt “Con Người đã đến” mà không xác định sự kiện nào
  alternative: Giải thích là sự phục sinh và minh chứng, sự phán xét Giê-ru-sa-lem, hoặc cuộc quang lâm cuối cùng
  rationale: Nguyên ngữ không xác định rõ sự quy chiếu; bản dịch phải giữ độ mở và căng thẳng cánh chung thay vì đưa một hệ giải thích riêng vào chính văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “anh em” cho đại từ số nhiều ὑμᾶς/ὑμῖν trong lời Chúa Giê-su nói với các môn đồ; dùng “tôi” nhằm giữ lời nói trực tiếp tự nhiên mà không thêm sắc thái giáo phái. “Ít-ra-ên” được phiên âm theo lối quen dùng trong bản văn Kinh Thánh tiếng Việt.
