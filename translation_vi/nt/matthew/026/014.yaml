  terminology: “Giu-đa Ích-ca-ri-ốt” và “các thượng tế” phù hợp cách dùng Kinh Thánh tiếng Việt. Không nên thêm “môn đồ” trong phần văn chính; có thể nêu “Nhóm Mười Hai” như một phương án chú thích.
