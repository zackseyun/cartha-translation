  text: Τότε πορευθεὶς εἷς τῶν δώδεκα, ὁ λεγόμενος Ἰούδας Ἰσκαριώτης, πρὸς τοὺς ἀρχιερεῖς
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/014.yaml
  text: Then one of the twelve[a], the one called Judas Iscariot, went to the chief priests,
translation:
  language: vi
  text: Bấy giờ, một người trong số mười hai người, tên là Giu-đa Ích-ca-ri-ốt, đến với các thượng tế,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τότε
  choice: Bấy giờ
  rationale: Dấu hiệu thời gian nối sự việc này với trình tự tường thuật trước đó; cách diễn đạt tự nhiên và trang trọng trong tiếng Việt.
- source_word: πορευθεὶς
  choice: đi đến gặp
  rationale: Phân từ aorist của πορεύομαι diễn tả chuyển động hướng đến các thượng tế. Tiếng Việt tự nhiên dùng động từ hữu hạn; thêm “gặp” làm rõ đích đến là những người được tiếp xúc mà không thay đổi ý chính.
- source_word: εἷς τῶν δώδεκα
  choice: một người trong số mười hai môn đồ
  rationale: Giữ quan hệ bộ phận của cụm Hy Lạp; “môn đồ” được thêm để người đọc tiếng Việt nhận rõ nhóm mười hai người, đồng thời chú thích bảo lưu cách dịch sát hơn.
- source_word: ὁ λεγόμενος
  choice: tên là
  rationale: Cách diễn đạt tự nhiên trong tiếng Việt để giới thiệu người được gọi bằng tên Giu-đa Ích-ca-ri-ốt.
- source_word: Ἰούδας Ἰσκαριώτης
  choice: Giu-đa Ích-ca-ri-ốt
  rationale: Phiên âm tên riêng theo cách dùng Kinh Thánh tiếng Việt quen thuộc.
- source_word: πρὸς τοὺς ἀρχιερεῖς
  choice: đến gặp các thượng tế
  rationale: πρός với đối cách biểu thị hướng chuyển động; ἀρχιερεῖς chỉ các chức sắc tư tế cấp cao, nên dịch theo thuật ngữ tiếng Việt quen thuộc là “các thượng tế”.
theological_decisions:
- issue: Cách gọi nhóm τῶν δώδεκα
  choice: mười hai môn đồ
  alternative: Nhóm Mười Hai; mười hai người
  rationale: “Mười hai môn đồ” giúp độc giả phổ thông nhận ra nhóm thân cận của Chúa Giê-su, nhưng không viết hoa để tránh áp đặt cách hiểu như một danh hiệu chính thức. Chú thích ghi cách dịch sát cấu trúc nguồn.
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng và dễ hiểu. Dùng “thượng tế” theo thuật ngữ Kinh Thánh tiếng Việt thông dụng; giữ dấu câu cho thấy câu còn tiếp sang câu kế.
