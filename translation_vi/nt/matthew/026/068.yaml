  text: λέγοντες· Προφήτευσον ἡμῖν, χριστέ, τίς ἐστιν ὁ παίσας σε;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/068.yaml
  text: 'saying[a], “Prophesy to us, Messiah: who is it that struck you?”'
translation:
  language: vi
  text: 'và nói: “Hãy tiên tri cho chúng ta biết, hỡi Đấng Mê-si-a: ai là kẻ đã đánh ông?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγοντες
  choice: và nói
  rationale: Phân từ hiện tại giới thiệu lời của những kẻ chế nhạo; “và nói” nối tự nhiên với hành động ở câu trước mà không biến nó thành một động từ chính độc lập.
- source_word: Προφήτευσον
  choice: Hãy nói tiên tri
  rationale: Giữ dạng mệnh lệnh và sắc thái chế nhạo của lời thách thức, đồng thời dùng cách diễn đạt rõ nghĩa trong tiếng Việt hiện đại.
- source_word: ἡμῖν
  choice: cho chúng ta
  rationale: Diễn đạt đối tượng tiếp nhận lời tiên tri được đòi hỏi.
- source_word: χριστέ
  choice: hỡi Đấng Mê-si
  rationale: Đây là hô cách của một tước hiệu. “Đấng Mê-si” truyền đạt chức danh được xức dầu, thay vì coi Χριστός như một phần tên riêng.
- source_word: τίς ἐστιν ὁ παίσας
  choice: Ai là kẻ đã đánh
  rationale: Giữ cấu trúc hỏi nhận diện “ai là người/kẻ đã đánh”; “kẻ” phù hợp với lời thách thức mà không thêm thông tin ngoài bản Hy Lạp.
- source_word: σε
  choice: ông
  rationale: Đại từ ngôi hai số ít chỉ Chúa Giê-su. “Ông” là cách xưng hô tự nhiên trong tiếng Việt hiện đại; sự chế nhạo đã rõ từ ngữ cảnh nên không cần thêm sắc thái miệt thị không được mã hóa trong đại từ Hy Lạp.
theological_decisions:
- issue: Cách dịch tước hiệu Χριστός
  choice: Đấng Mê-si
  alternative: Đấng Christ / Đấng Ki-tô
  rationale: Trong câu này Χριστός ở hô cách và rõ ràng được dùng như một tước hiệu trong lời chế nhạo. Dịch là “Đấng Mê-si” làm nổi bật ý nghĩa tước hiệu và sức nặng về Đấng được xức dầu, đồng thời chú thích dạng quen thuộc khác.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ nguyên hình thức mệnh lệnh cùng câu hỏi chế nhạo; tránh đại từ cổ “ngươi” và cũng không tăng mức xúc phạm bằng “mày” vì bản Hy Lạp không biểu thị riêng sắc thái ấy.
