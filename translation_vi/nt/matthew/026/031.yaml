id: MAT.26.31
reference: Matthew 26:31
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Τότε λέγει αὐτοῖς ὁ Ἰησοῦς· Πάντες ὑμεῖς σκανδαλισθήσεσθε ἐν ἐμοὶ ἐν τῇ νυκτὶ ταύτῃ, γέγραπται γάρ· Πατάξω τὸν ποιμένα, καὶ ⸀διασκορπισθήσονται τὰ πρόβατα τῆς ποίμνης·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/031.yaml
  text: 'Then Jesus says to them[a], “You will all fall away because of me this night, for it is written: ‘I will strike the shepherd[c][b], and the sheep of the flock will be scattered.’”'
translation:
  language: vi
  text: 'Bấy giờ, Đức Giê-su nói với họ: “Ngay đêm nay, tất cả anh em sẽ vấp ngã vì tôi[a], vì có lời chép rằng: ‘Ta sẽ đánh người chăn[b], và chiên trong đàn sẽ bị tản lạc.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “sẽ sa ngã,” “sẽ bị làm cho vấp ngã” hoặc “sẽ lấy làm cớ vấp phạm vì tôi.” Từ Hy Lạp có dải nghĩa rộng; trong văn cảnh này, lời ấy hướng đến việc các môn đồ lìa bỏ Đức Giê-su và chạy trốn.
    reason: lexical_alternative
  - marker: b
    text: Trích Xa-cha-ri 13:7.
    reason: cross_reference
lexical_decisions:
- source_word: Τότε λέγει αὐτοῖς ὁ Ἰησοῦς
  choice: Bấy giờ, Đức Giê-su nói với họ
  rationale: “Bấy giờ” nối tiếp trình tự câu chuyện; “nói” truyền đạt tự nhiên thì hiện tại lịch sử của λέγει trong tiếng Việt mà không cần đánh dấu thời quá khứ.
- source_word: Πάντες ὑμεῖς
  choice: tất cả anh em
  rationale: Giữ sắc thái nhấn mạnh rằng lời báo trước áp dụng cho toàn thể các môn đồ; “anh em” là cách xưng hô tự nhiên, trang trọng vừa phải trong ngữ cảnh này.
- source_word: σκανδαλισθήσεσθε ἐν ἐμοὶ
  choice: sẽ vấp ngã vì tôi
  rationale: “Vấp ngã” giữ được hình ảnh và độ rộng nghĩa của động từ Hy Lạp, còn “vì tôi” diễn đạt quan hệ nguyên nhân/liên hệ với Đức Giê-su. Chú thích nêu rõ rằng trong văn cảnh, điều này dẫn đến việc các môn đồ lìa bỏ Ngài.
- source_word: ἐν τῇ νυκτὶ ταύτῃ
  choice: ngay đêm nay
  rationale: Cách nói tự nhiên trong tiếng Việt, giữ ý “đêm này” và làm nổi bật tính cận kề của lời báo trước.
- source_word: γέγραπται γάρ
  choice: vì có lời chép rằng
  rationale: Công thức tiếng Việt tự nhiên để giới thiệu một câu Kinh Thánh được trích dẫn, đồng thời giữ quan hệ giải thích của γάρ.
- source_word: Πατάξω τὸν ποιμένα
  choice: Ta sẽ đánh người chăn
  rationale: Giữ trực tiếp động từ “đánh” và hình ảnh “người chăn” mà không thêm kết quả như giết hay đánh gục.
- source_word: διασκορπισθήσονται τὰ πρόβατα τῆς ποίμνης
  choice: chiên trong đàn sẽ bị tan tác
  rationale: “Sẽ bị tan tác” giữ thể bị động và hình ảnh phân tán; “chiên trong đàn” thể hiện cả πρόβατα và ποίμνης bằng lối nói gọn, tự nhiên hơn “những con chiên của đàn”.
theological_decisions:
- issue: Ý nghĩa của σκανδαλισθήσεσθε trong mối liên hệ với Đức Giê-su
  choice: Dùng “vấp ngã vì tôi,” đồng thời giải thích trong chú thích rằng văn cảnh hướng đến việc các môn đồ lìa bỏ Đức Giê-su trong đêm ấy.
  alternative: “sẽ lìa bỏ tôi,” “sẽ sa ngã vì tôi,” hoặc “sẽ bị xúc phạm vì tôi”
  rationale: Bản dịch chính giữ hình ảnh và độ rộng nghĩa của nguyên ngữ, tránh biến lời này thành một phán quyết về sự bội đạo chung cuộc. Chú thích giúp người đọc nhận ra hành động bỏ chạy được văn cảnh trực tiếp dự báo.
- issue: Chủ thể ngôi thứ nhất trong lời trích dẫn “Ta sẽ đánh”
  choice: Giữ nguyên “Ta” mà không xác định thêm danh tính trong bản văn.
  alternative: Thêm rõ “Đức Chúa Trời sẽ đánh” hoặc giải thích trực tiếp người chăn là Đức Giê-su
  rationale: Nguyên văn trích dẫn dùng ngôi thứ nhất và hình ảnh ẩn dụ mà không giải nghĩa ngay trong câu; bản dịch không nên âm thầm giải quyết các liên hệ thần học ấy.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “Đức Giê-su” và cách xưng hô “anh em” phù hợp lời Ngài nói với các môn đồ. Câu trích dẫn giữ nhịp điệu cô đọng và hình ảnh người chăn–đàn chiên của nguyên văn.
