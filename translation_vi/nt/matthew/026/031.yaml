review_pass:
  verdict: revise
  source_fidelity: Bản dịch phản ánh đúng trình tự, tính nhấn mạnh của “tất cả anh em”, ý liên hệ/nguyên nhân trong ἐν ἐμοί, và công thức dẫn Kinh Thánh. “Ta sẽ đánh người chăn” giữ đúng ngôi thứ nhất và không giải thích thêm chủ thể. Tuy nhiên, “bị tan tác” thiên về trạng thái rã rời/đổ vỡ hơn là động từ bị động διασκορπισθήσονται (“bị phân tán, tản lạc”); nên dùng “bị tản lạc” để sát hình ảnh đàn chiên bị phân tán.
  naturalness: Văn phong hiện đại, trang trọng và dễ đọc. “Bấy giờ, Đức Giê-su nói với họ” và “tất cả anh em” phù hợp ngữ cảnh. “Chiên trong đàn sẽ bị tản lạc” tự nhiên và chính xác hơn “chiên trong đàn sẽ bị tan tác.”
  terminology: “Đức Giê-su,” “người chăn,” và “chiên” nhất quán với văn phong Kinh Thánh tiếng Việt. Chú thích nên thay “sẽ bất bình vì tôi”, vốn không diễn đạt tốt sắc thái σκανδαλίζω, bằng “sẽ lấy làm cớ vấp phạm vì tôi” (hoặc tương đương), đồng thời giữ giải thích về sự lìa bỏ/chạy trốn trong văn cảnh.
