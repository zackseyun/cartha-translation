  to: 'Bấy giờ, Đức Giê-su nói với họ: “Ngay đêm nay, tất cả anh em sẽ vấp ngã vì tôi[a], vì có lời chép rằng: ‘Ta sẽ đánh người chăn[b], và chiên trong đàn sẽ bị tản lạc.’”'
