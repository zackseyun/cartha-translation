  to: Hãy đứng dậy, chúng ta đi nào. Kìa, người phản bội tôi[a] đã đến gần.
  rationale: Sửa duy nhất cụm danh ngữ chỉ Judas để đạt tính tự nhiên và rõ nghĩa trong tiếng Việt hiện đại. Bản chính dùng cách gọi theo ngữ cảnh, còn chú thích bảo tồn cách diễn đạt cụ thể của phân từ παραδιδούς. Các yếu tố thời, thể và sắc thái khẩn trương của câu được giữ nguyên.
