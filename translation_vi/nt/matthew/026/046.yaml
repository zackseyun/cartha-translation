  text: ἐγείρεσθε ἄγωμεν· ἰδοὺ ἤγγικεν ὁ παραδιδούς με.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/046.yaml
  text: Get up, let us go. Look, my betrayer[a] is near.
translation:
  language: vi
  text: Hãy đứng dậy, chúng ta đi nào. Kìa, người phản bội tôi[a] đã đến gần.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nghĩa sát hơn: “người giao nộp tôi.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγείρεσθε
  choice: Hãy đứng dậy
  rationale: Động từ ở thể mệnh lệnh số nhiều, trực tiếp bảo các môn đồ đứng lên; cách diễn đạt này tự nhiên và rõ ràng trong tiếng Việt hiện đại.
- source_word: ἄγωμεν
  choice: chúng ta đi nào
  rationale: Thể giả định ngôi thứ nhất số nhiều mang ý khích lệ cùng hành động; “chúng ta đi nào” truyền đạt tự nhiên sắc thái ấy.
- source_word: ἰδού
  choice: Kìa
  rationale: Tiểu từ thu hút sự chú ý đến diễn biến cấp bách ngay trước mắt; “Kìa” ngắn gọn, sinh động và không cổ.
- source_word: ἤγγικεν
  choice: đã đến gần
  rationale: Thì hoàn thành diễn tả việc đến gần đã xảy ra và hiện đang có hiệu lực; “đã đến gần” giữ được cả tiến trình lẫn kết quả hiện tại.
- source_word: ὁ παραδιδούς με
  choice: kẻ nộp tôi
  rationale: Phân từ được danh từ hóa chỉ người đang giao nộp Đức Giê-su. “Kẻ nộp tôi” giữ hình ảnh hành động cụ thể của nguyên văn và trong ngữ cảnh cũng hàm ý phản bội.
theological_decisions:
- issue: Cách dịch παραδιδούς trong bối cảnh cuộc thương khó
  choice: kẻ nộp tôi
  alternative: kẻ phản bội tôi
  rationale: Động từ nguyên văn trước hết mô tả hành động giao nộp Đức Giê-su, còn tính chất phản bội được ngữ cảnh cho thấy. Chọn cách dịch cụ thể hơn để không thay thế hành động bằng một diễn giải, đồng thời chú thích nêu rõ nghĩa ngữ cảnh.
translation_notes:
  register: Lời nói trực tiếp, gấp gáp và trang trọng vừa phải; dùng tiếng Việt hiện đại, dễ hiểu. Nhịp ba vế ngắn bảo tồn tính khẩn cấp của nguyên văn.
