id: MAT.26.28
reference: Matthew 26:28
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: τοῦτο γάρ ἐστιν τὸ αἷμά ⸀μου ⸀τῆς διαθήκης τὸ περὶ πολλῶν ἐκχυννόμενον εἰς ἄφεσιν ἁμαρτιῶν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/028.yaml
  text: For this is my blood of the covenant[b][a], which is poured out for many for the forgiveness of sins.
translation:
  language: vi
  text: Vì đây là huyết ta, huyết của giao ước[a], được đổ ra vì nhiều người[b] để tha tội.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Một số bản chép tay ghi: “huyết ta của giao ước mới.”'
    reason: textual_variant
  - marker: b
    text: 'Cũng có thể dịch: “thay cho nhiều người.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο
  choice: đây
  rationale: Dịch trực tiếp đại từ chỉ định, nói về điều Đức Chúa Jêsus đang trao trong bữa ăn; không thêm “chén” vì danh từ ấy không có trong mệnh đề này.
- source_word: γάρ
  choice: vì
  rationale: Giữ chức năng giải thích, nối lời này với mệnh lệnh uống ngay trước đó.
- source_word: τὸ αἷμά μου
  choice: huyết ta
  rationale: Giữ cách nói trực tiếp, trang trọng và sắc thái hy sinh của αἷμα; “huyết” phù hợp văn cảnh Kinh Thánh hơn “máu” mà vẫn dễ hiểu.
- source_word: τῆς διαθήκης
  choice: của giao ước
  rationale: Theo SBLGNT, vốn không có καινῆς (“mới”); “giao ước” là cách diễn đạt tự nhiên và đã quen thuộc trong tiếng Việt.
- source_word: περὶ πολλῶν
  choice: vì nhiều người
  rationale: Trong văn cảnh hy sinh, περί với sở hữu cách có thể chỉ điều được thực hiện vì lợi ích của người khác. Cách dịch này tự nhiên, giữ nguyên “nhiều người” và không giải quyết thay văn bản các tranh luận về phạm vi chuộc tội.
- source_word: ἐκχυννόμενον
  choice: được đổ ra
  rationale: Phản ánh phân từ hiện tại bị động bổ nghĩa cho “huyết”, đồng thời giữ hình ảnh huyết hy sinh được tuôn đổ.
- source_word: εἰς ἄφεσιν ἁμαρτιῶν
  choice: để tha tội
  rationale: Diễn đạt rõ và gọn ý mục đích/kết quả của εἰς; không thêm chủ thể hay giới hạn đối tượng mà tiếng Hy Lạp không nêu rõ.
theological_decisions:
- issue: Có thêm “mới” vào “giao ước” hay không
  choice: của giao ước
  alternative: của giao ước mới
  rationale: Bản SBLGNT được cung cấp không có καινῆς. Bản dịch chính theo văn bản nguồn, còn dị bản phổ biến được ghi ở chú thích.
- issue: Ý nghĩa của “vì nhiều người” trong ngôn ngữ chuộc tội
  choice: vì nhiều người
  alternative: vì mọi người
  rationale: πολλῶν có nghĩa là “nhiều người”. Bản dịch giữ nguyên cách nói này, không đổi thành “mọi người” và không dùng câu này để tự ý phân xử tranh luận thần học rộng hơn.
- issue: Sắc thái của περί trong περὶ πολλῶν
  choice: vì nhiều người
  alternative: thay cho nhiều người
  rationale: “Vì” truyền đạt tự nhiên ý hướng đến lợi ích của nhiều người, trong khi “thay cho” có thể nhấn mạnh sắc thái đại diện/thế chỗ mạnh hơn mức cần thiết. Khả năng ấy được bảo lưu trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “huyết” để giữ sắc thái giao ước và hy sinh; cấu trúc lặp “huyết ta, huyết của giao ước” giúp câu tiếng Việt tự nhiên mà vẫn bám sát quan hệ cú pháp của nguyên văn.
