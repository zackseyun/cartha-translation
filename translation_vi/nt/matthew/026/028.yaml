  terminology: '“Huyết,” “giao ước,” và “tha tội” nhất quán với ngữ vực Kinh Thánh và bảo tồn sắc thái hy sinh/giao ước. Các chú thích đặt đúng chỗ: [a] gắn với “giao ước” cho dị bản “giao ước mới”; [b] gắn với “nhiều người” cho phương án nghĩa của περί.'
