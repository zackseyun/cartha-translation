  to: 'Nhưng Giê-su vẫn im lặng. Vị thượng tế nói với Người: “Ta nhân danh Đức Chúa Trời hằng sống buộc ngươi phải nói cho chúng ta biết[b]: ngươi có phải là Đấng Mê-si-a[a], Con Đức Chúa Trời, hay không.”'
