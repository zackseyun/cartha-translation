id: MAT.26.63
reference: Matthew 26:63
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς ἐσιώπα. ⸀καὶ ὁ ἀρχιερεὺς εἶπεν αὐτῷ· Ἐξορκίζω σε κατὰ τοῦ θεοῦ τοῦ ζῶντος ἵνα ἡμῖν εἴπῃς εἰ σὺ εἶ ὁ χριστὸς ὁ υἱὸς τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/063.yaml
  text: 'But Jesus kept silent[a]. And the high priest said to him, “I put you under oath by the living God: tell us if you are the Messiah[b], the Son of God.”'
translation:
  language: vi
  text: 'Nhưng Giê-su vẫn im lặng. Vị thượng tế nói với Người: “Ta nhân danh Đức Chúa Trời hằng sống buộc ngươi phải nói cho chúng ta biết[b]: ngươi có phải là Đấng Mê-si-a[a], Con Đức Chúa Trời, hay không.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “Đấng Ki-tô.” Từ Hy Lạp Christos ở đây là tước hiệu chỉ Đấng được xức dầu.
    reason: alternative_reading
  - marker: b
    text: Hay “Ta long trọng buộc ngươi nhân danh Đức Chúa Trời hằng sống.” Câu Hy Lạp là một công thức buộc người khác trả lời cách long trọng, tương tự việc đặt người ấy dưới lời thề.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσιώπα
  choice: vẫn im lặng
  rationale: Thì chưa hoàn thành diễn tả sự im lặng tiếp diễn; “vẫn im lặng” tự nhiên trong tiếng Việt và giữ được sắc thái này.
- source_word: ἀρχιερεὺς
  choice: vị thượng tế
  rationale: Cách gọi chính xác, trang trọng và quen thuộc cho chức vụ tư tế đứng đầu trong bối cảnh xét xử này.
- source_word: Ἐξορκίζω σε κατὰ τοῦ θεοῦ τοῦ ζῶντος
  choice: Trước Đức Chúa Trời hằng sống, ta buộc ngươi phải trả lời
  rationale: Diễn đạt công thức buộc trả lời cách long trọng có sự viện dẫn Đức Chúa Trời, tránh hiểu sai động từ theo nghĩa trừ quỷ và cũng tránh hàm ý rằng Giê-su bị yêu cầu tự mình thề.
- source_word: ἵνα ἡμῖν εἴπῃς
  choice: Hãy nói cho chúng ta biết
  rationale: Truyền đạt tự nhiên nội dung mà vị thượng tế đòi Giê-su phải nói ra.
- source_word: ὁ χριστὸς
  choice: Đấng Mê-si-a
  rationale: Trong câu hỏi này, từ ngữ là một tước hiệu chỉ Đấng được xức dầu mà người Do Thái trông đợi, chứ không phải tên riêng.
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: Con Đức Chúa Trời
  rationale: Giữ nguyên tước hiệu thần học của nguyên văn mà không giải thích thêm hoặc làm giảm nghĩa.
- source_word: ὁ δὲ Ἰησοῦς
  choice: Nhưng Giê-su
  rationale: “Nhưng” thể hiện sự tương phản nhẹ với lời buộc tội trong mạch văn trước đó.
theological_decisions:
- issue: Cách dịch Χριστός trong câu thẩm vấn trực tiếp về căn tính của Giê-su
  choice: Đấng Mê-si-a
  alternative: Đấng Ki-tô
  rationale: Mạo từ và bối cảnh cho thấy đây là tước hiệu về Đấng được xức dầu; cách dịch chính giữ bối cảnh Do Thái, còn cách gọi truyền thống được nêu trong chú thích.
- issue: Sắc thái của công thức Ἐξορκίζω σε κατὰ τοῦ θεοῦ τοῦ ζῶντος
  choice: Một lời buộc trả lời long trọng trước Đức Chúa Trời
  alternative: Ta buộc ngươi phải thề trước Đức Chúa Trời hằng sống
  rationale: Nguyên văn là công thức tuyên thệ hoặc thỉnh cầu long trọng trong khung cảnh xét xử. Bản dịch giữ sức nặng pháp lý và tôn giáo nhưng không nói quá rằng Giê-su được lệnh phải tự thề.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “Giê-su” thay vì thêm tước hiệu “Chúa” vào tên tại nơi nguyên văn chỉ có tên riêng; dùng “Đức Chúa Trời” nhất quán cho θεός. Đại từ “Người” trong lời kể thể hiện sự tôn kính, còn “ta/ngươi” trong lời thượng tế giữ sắc thái quyền lực và đối chất của bối cảnh xét xử. Các ký hiệu [a], [b] đều xuất hiện đúng tại nội dung được chú thích.
