  source_fidelity: Cần chỉnh nhẹ công thức Ἐξορκίζω σε κατὰ τοῦ θεοῦ τοῦ ζῶντος. “Trước Đức Chúa Trời hằng sống” có thể chỉ địa điểm/phạm vi chứng kiến, trong khi κατά ở đây cùng với ἐξορκίζω là lời buộc long trọng có viện dẫn danh Đức Chúa Trời. “Nhân danh Đức Chúa Trời hằng sống” chuyển tải trực tiếp hơn lực của công thức. Các phần còn lại, gồm “vẫn im lặng,” tước hiệu “Đấng Mê-si-a,” và “Con Đức Chúa Trời,” đều trung thành với nguyên văn.
  naturalness: 'Bản sửa tránh cấu trúc hơi gãy “buộc ngươi phải trả lời: Hãy nói...”. “Buộc ngươi phải nói cho chúng ta biết” tự nhiên, trang trọng, và vẫn giữ giọng đối chất của phiên xét xử.'
