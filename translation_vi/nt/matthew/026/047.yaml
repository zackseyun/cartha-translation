id: MAT.26.47
reference: Matthew 26:47
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Καὶ ἔτι αὐτοῦ λαλοῦντος ἰδοὺ Ἰούδας εἷς τῶν δώδεκα ἦλθεν καὶ μετ’ αὐτοῦ ὄχλος πολὺς μετὰ μαχαιρῶν καὶ ξύλων ἀπὸ τῶν ἀρχιερέων καὶ πρεσβυτέρων τοῦ λαοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/047.yaml
  text: And while he was still speaking[a], behold, Judas, one of the twelve, came, and with him a large crowd with swords and clubs[b], from the chief priests and elders of the people.
translation:
  language: vi
  text: Khi Đức Giê-su còn đang nói, thì kìa, Giu-đa, một trong Nhóm Mười Hai, đến, cùng với ông là một đám đông lớn mang gươm và gậy[a], từ các thượng tế và các trưởng lão của dân chúng[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Theo nghĩa đen là “các khúc gỗ”; trong ngữ cảnh này, có lẽ chỉ gậy dùng làm vũ khí.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể hiểu là “do các thượng tế và các trưởng lão của dân chúng phái đến”. Tiếng Hy Lạp sát nghĩa hơn là “từ các thượng tế và các trưởng lão của dân chúng”.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔτι αὐτοῦ λαλοῦντος
  choice: Khi Đức Giê-su còn đang nói
  rationale: Cấu trúc sở hữu cách tuyệt đối diễn tả hành động xảy ra đồng thời; “còn đang” chuyển tải tự nhiên cả ἔτι lẫn thể tiếp diễn trong tiếng Việt.
- source_word: ἰδοὺ
  choice: thì kìa
  rationale: Giữ lại dấu hiệu diễn ngôn tạo tính sống động và báo hiệu sự xuất hiện đáng chú ý, thay vì lược bỏ hoặc diễn giải quá mức thành “bỗng nhiên”.
- source_word: Ἰούδας
  choice: Giu-đa
  rationale: Dạng phiên âm quen thuộc trong tiếng Việt.
- source_word: εἷς τῶν δώδεκα
  choice: một trong Nhóm Mười Hai
  rationale: Diễn đạt rõ nhóm người đã được xác định trong mạch truyện mà không thêm danh xưng “sứ đồ” hay “môn đồ” vốn không có ngay trong cụm từ Hy Lạp này.
- source_word: ἦλθεν
  choice: đã đến
  rationale: Chuyển tải trực tiếp động từ trần thuật ở thì aorist; “đã” giúp câu kể tiếng Việt rõ và tự nhiên.
- source_word: ὄχλος πολὺς
  choice: một đám đông lớn
  rationale: Giữ nghĩa định lượng của πολύς mà không thêm sắc thái hỗn loạn hoặc bạo động như “đám đông hung hãn”.
- source_word: μετὰ μαχαιρῶν
  choice: mang theo gươm
  rationale: μάχαιρα chỉ loại gươm hoặc vũ khí có lưỡi; “gươm” là cách dịch rộng, quen thuộc và phù hợp bối cảnh bắt giữ.
- source_word: καὶ ξύλων
  choice: và gậy gộc
  rationale: ξύλον theo nghĩa đen là gỗ hoặc khúc gỗ, nhưng ở số nhiều và đi cùng vũ khí thì chỉ những cây gậy được dùng làm vũ khí; “gậy gộc” tự nhiên hơn “các khúc gỗ”.
- source_word: ἀπὸ τῶν ἀρχιερέων καὶ πρεσβυτέρων τοῦ λαοῦ
  choice: từ phía các thượng tế và các trưởng lão của dân chúng
  rationale: “Từ phía” giữ ý nguồn gốc hoặc sự liên hệ của ἀπό nhưng không biến hàm ý được ủy quyền thành động từ minh nhiên “phái đến”.
theological_decisions:
- issue: Có nên nói rõ đám đông được các lãnh đạo Do Thái phái đến hay không
  choice: từ phía các thượng tế và các trưởng lão của dân chúng
  alternative: do các thượng tế và các trưởng lão của dân chúng phái đến
  rationale: Ngữ cảnh hàm ý đám đông hành động theo sự ủy quyền, nhưng bản Hy Lạp chỉ dùng giới từ ἀπό để nêu nguồn gốc, không có động từ “sai phái”. Bản chính giữ độ mở của nguyên văn, còn chú thích nêu cách hiểu minh nhiên hơn.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. “Thì kìa” duy trì sức đẩy trần thuật của ἰδοὺ; “ông ta” tránh sắc thái khinh miệt quá mức nhưng vẫn phân biệt Giu-đa với Đức Giê-su. Dấu chấm phẩy giúp câu dài sáng rõ mà vẫn giữ quan hệ liên tục của nguyên văn.
