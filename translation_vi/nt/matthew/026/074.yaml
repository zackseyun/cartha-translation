  to: 'Bấy giờ, ông bắt đầu thề độc và thề[a]: “Tôi không biết người ấy.” Ngay lập tức, một con gà trống gáy.'
  rationale: Thay “nguyền rủa” bằng “thề độc” để truyền đạt chính xác hơn chức năng của καταθεματίζειν khi đi cùng ὀμνύειν, đồng thời tránh hàm ý không có cơ sở rằng Phi-e-rơ nguyền rủa Chúa Giê-su. Chú thích được chỉnh cho tự nhiên hơn và vẫn bảo lưu tính dè dặt của cách hiểu tự nguyền.
