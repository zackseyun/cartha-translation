review_pass:
  verdict: revise
  source_fidelity: 'Cụm καταθεματίζειν καὶ ὀμνύειν diễn tả hai hành vi tăng cấp: viện/tuyên lời nguyền và thề. “Nguyền rủa” trong tiếng Việt thường gợi một hành vi hướng đến người khác, nên có thể bị hiểu là ông nguyền rủa Chúa Giê-su. “Thề độc” là cách nói tự nhiên và chính xác hơn trong ngữ cảnh thề, đồng thời không khẳng định quá mức trong chính văn đối tượng của lời nguyền. Các yếu tố còn lại, gồm sắc thái khởi đầu, lời phủ nhận, và tiếng gà gáy ngay lập tức, đều được giữ đúng.'
  naturalness: “Bấy giờ” và “Ngay lập tức” phù hợp văn phong Kinh Thánh hiện đại. “Ông bắt đầu thề độc và thề” tuy lặp từ “thề” theo chủ ý để phản ánh hai động từ Hy Lạp, vẫn là lối diễn đạt Việt ngữ rõ ràng. “Người ấy” tự nhiên trong lời phủ nhận trực tiếp.
  terminology: Dùng “thề độc” cho καταθεματίζειν giúp phân biệt với lời chửi rủa/thóa mạ và phù hợp với chú thích về lời nguyền tự chuốc. “Thề” giữ đúng ὀμνύειν. Không cần đưa “tự mình” vào chính văn vì điều đó là hàm ý ngữ cảnh, không được nêu minh nhiên.
  issues:
  - severity: medium
    issue: “nguyền rủa” có thể bị hiểu là ông nguyền rủa một người khác, đặc biệt là Chúa Giê-su.
    rationale: Trong tiếng Việt hiện đại, “nguyền rủa” thường cần hoặc ngầm gợi một đối tượng bị nguyền. Ngữ cảnh Hy Lạp kết hợp với “thề” hợp hơn với hành vi thề độc/viện lời nguyền để củng cố lời chối.
  - severity: low
    issue: Cụm chú thích “viện đến lời nguyền” chưa tự nhiên.
    rationale: “Thề độc” là một cách diễn đạt tiếng Việt thông dụng, vừa phản ánh nghĩa từ vựng vừa đọc tự nhiên hơn.
