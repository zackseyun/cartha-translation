language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: τότε ἤρξατο καταθεματίζειν καὶ ὀμνύειν ὅτι Οὐκ οἶδα τὸν ἄνθρωπον. καὶ ⸀εὐθέως ἀλέκτωρ ἐφώνησεν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/074.yaml
  text: Then he began to curse and to swear[a], “I do not know the man.” And immediately a rooster crowed.
translation:
  language: vi
  text: 'Bấy giờ, ông bắt đầu thề độc và thề[a]: “Tôi không biết người ấy.” Ngay lập tức, một con gà trống gáy.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc, sát nghĩa: “bắt đầu viện lời nguyền và thề.” Trong ngữ cảnh này, có lẽ ông tự chuốc lời nguyền nếu lời phủ nhận của mình không đúng.'
    reason: Nêu nghĩa sát của καταθεματίζειν và cách hiểu có khả năng nhất trong ngữ cảnh lời thề, mà không biến điều hàm ý thành điều được nói rõ trong chính văn.
lexical_decisions:
- source_word: τότε
  choice: Bấy giờ
  rationale: Đánh dấu diễn tiến kế tiếp trong trình thuật một cách tự nhiên và trang trọng.
- source_word: ἤρξατο
  choice: ông bắt đầu
  rationale: Giữ sắc thái khởi đầu của hành động, cho thấy lời phủ nhận leo thang.
- source_word: καταθεματίζειν
  choice: nguyền rủa
  rationale: Giữ nghĩa trực tiếp là viện đến lời nguyền mà không đưa đối tượng của lời nguyền vào chính văn; ngữ cảnh lời thề có thể hàm ý ông tự chuốc lời nguyền.
- source_word: ὀμνύειν
  choice: thề
  rationale: Diễn đạt hành vi thề trang trọng nhằm củng cố lời phủ nhận.
- source_word: ὅτι
  choice: dấu hai chấm và lời nói trực tiếp
  rationale: Dẫn nội dung lời thề/phủ nhận rõ ràng, tự nhiên trong tiếng Việt.
- source_word: Οὐκ οἶδα
  choice: Tôi không biết
  rationale: Diễn đạt trực tiếp sự phủ nhận quen biết.
- source_word: τὸν ἄνθρωπον
  choice: người ấy
  rationale: Chỉ người đàn ông đang được nhắc đến, tức Chúa Giê-su, bằng cách nói tự nhiên trong tiếng Việt; tránh sắc thái khinh miệt không tất yếu của “tên đó”.
- source_word: καὶ εὐθέως
  choice: Ngay lập tức
  rationale: Nhấn mạnh sự ứng nghiệm tức thì của lời Chúa Giê-su đã báo trước; không cần giữ liên từ καί một cách máy móc.
- source_word: ἀλέκτωρ
  choice: một con gà trống
  rationale: Danh từ không có mạo từ được diễn đạt tự nhiên bằng một danh ngữ bất định trong tiếng Việt.
- source_word: ἐφώνησεν
  choice: gáy
  rationale: Động từ chuyên dùng và tự nhiên cho tiếng kêu của gà trống.
theological_decisions:
- issue: Ý nghĩa của καταθεματίζειν trong lời phủ nhận của Phi-e-rơ
  choice: Dịch chính văn là “nguyền rủa”, đồng thời chú thích rằng trong ngữ cảnh lời thề, có lẽ ông tự chuốc lời nguyền để bảo chứng lời phủ nhận.
  alternative: Nói chung ông buông lời nguyền rủa, hoặc ông nguyền rủa Chúa Giê-su.
  rationale: Động từ kết hợp với ὀμνύειν rất có thể mô tả một lời thề có tính tự nguyền; tuy nhiên, đại từ phản thân không xuất hiện minh nhiên trong câu Hy Lạp, nên giữ chính văn gọn và nêu cách hiểu trong chú thích để bảo toàn mức độ hàm nghĩa.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “ông” vì câu trích riêng lẻ không nêu tên Phi-e-rơ; “người ấy” tự nhiên hơn “người đàn ông” trong lời nói trực tiếp. Dấu chú thích [a] đặt ngay sau cụm động từ mà chú thích giải thích.
