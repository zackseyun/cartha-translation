reference: Matthew 26:29
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: λέγω δὲ ⸀ὑμῖν, οὐ μὴ πίω ἀπ’ ἄρτι ἐκ τούτου τοῦ γενήματος τῆς ἀμπέλου ἕως τῆς ἡμέρας ἐκείνης ὅταν αὐτὸ πίνω μεθ’ ὑμῶν καινὸν ἐν τῇ βασιλείᾳ τοῦ πατρός μου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/029.yaml
  text: But I tell you[a], from now on I will certainly not drink from this fruit of the vine until that day when I drink it new with you in the kingdom of my Father.
translation:
  language: vi
  text: 'Nhưng tôi bảo anh em: từ nay, tôi nhất quyết không uống hoa trái này của cây nho cho đến ngày ấy, khi tôi cùng anh em uống thứ ấy như một điều mới[a] trong vương quốc của Cha tôi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “uống thứ ấy mới” hoặc “lại uống thứ ấy.” Tính từ Hy Lạp có thể chỉ sự mới mẻ về loại hoặc phẩm chất; trong ngữ cảnh này, cụm từ cũng có thể hàm ý uống theo một cách mới trong vương quốc sắp đến.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω δὲ ὑμῖν
  choice: Nhưng tôi nói với anh em
  rationale: δέ ở đây chuyển ý với sắc thái đối chiếu nhẹ; “nhưng” tự nhiên và không làm mức độ tương phản mạnh hơn quá mức.
- source_word: οὐ μὴ πίω
  choice: tôi chắc chắn sẽ không uống ... nữa
  rationale: Cấu trúc οὐ μή với động từ ở lối giả định aorist diễn tả sự phủ định tương lai được nhấn mạnh; “chắc chắn sẽ không” giữ được sức nhấn mà không biến thành lời phủ định tuyệt đối ngoài khung thời gian đã nêu.
- source_word: ἀπ’ ἄρτι
  choice: từ nay
  rationale: Diễn tả thời điểm bắt đầu ngay từ hiện tại trở đi; “từ nay” ngắn gọn và tự nhiên trong tiếng Việt hiện đại.
- source_word: ἐκ τούτου τοῦ γενήματος τῆς ἀμπέλου
  choice: sản vật này của cây nho
  rationale: γένημα là sản phẩm hoặc hoa trái được sinh ra; cách dịch này giữ hình ảnh và lối nói của nguyên bản thay vì thay thẳng bằng “rượu”.
- source_word: ἕως τῆς ἡμέρας ἐκείνης
  choice: cho đến ngày ấy
  rationale: Giữ đại từ chỉ định ἐκείνης, hướng đến một ngày xác định trong tương lai.
- source_word: ὅταν αὐτὸ πίνω
  choice: khi tôi uống thứ ấy
  rationale: ὅταν với lối giả định chỉ sự kiện tương lai về thời gian; “thứ ấy” quay lại sản vật của cây nho vừa được nhắc đến.
- source_word: καινὸν
  choice: một thứ mới
  rationale: καινός thường chỉ sự mới mẻ về loại hoặc phẩm chất. Cách dịch trực tiếp này không quyết định rằng đó là rượu mới làm hay chỉ là hành động uống lại.
- source_word: μεθ’ ὑμῶν
  choice: cùng với anh em
  rationale: Diễn đạt rõ sự đồng hành và dự phần chung, đồng thời tự nhiên trong tiếng Việt.
- source_word: ἐν τῇ βασιλείᾳ τοῦ πατρός μου
  choice: trong vương quốc của Cha tôi
  rationale: Giữ rõ danh từ βασιλεία và cấu trúc “của Cha tôi”, phù hợp với sắc thái trang trọng của câu.
theological_decisions:
- issue: Có nên nói rõ thức uống là “rượu” hay giữ lối nói của nguyên bản
  choice: Giữ “sản vật này của cây nho” trong chính văn
  alternative: rượu nho
  rationale: Nguyên bản dùng γένημα τῆς ἀμπέλου chứ không dùng οἶνος. Giữ lối nói này tôn trọng chứng cứ Hy Lạp và không đưa thêm mức độ xác định mang tính nghi lễ hoặc biểu tượng.
- issue: Ý nghĩa của καινὸν trong bữa tiệc thuộc vương quốc tương lai
  choice: Dịch “một thứ mới” và ghi chú khả năng hiểu là uống lại theo cách mới
  alternative: lại uống; uống theo cách mới; rượu mới
  rationale: Tính từ có thể nói đến sự mới mẻ về loại hoặc phẩm chất, và trong ngữ cảnh có thể gợi ý việc uống lại theo một cách mới. Câu không giải quyết hoàn toàn sắc thái này, nên chính văn và chú thích cùng bảo toàn sự mơ hồ.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh em” cho số nhiều ὑμῖν và “Cha tôi” để giữ sắc thái quan hệ trong nguyên bản. Dấu gạch ngang giúp cụm “một thứ mới” bổ nghĩa cho “thứ ấy” mà không buộc câu phải chọn giữa “rượu mới” và “uống lại”.
