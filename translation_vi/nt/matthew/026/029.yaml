revisions:
- from: 'Nhưng tôi nói với anh em: Từ nay, tôi chắc chắn sẽ không uống sản vật này của cây nho nữa cho đến ngày ấy, khi tôi uống thứ ấy—một thứ mới[a]—cùng với anh em trong vương quốc của Cha tôi.'
  to: 'Nhưng tôi bảo anh em: từ nay, tôi nhất quyết không uống hoa trái này của cây nho cho đến ngày ấy, khi tôi cùng anh em uống thứ ấy như một điều mới[a] trong vương quốc của Cha tôi.'
  rationale: Thay “sản vật” bằng “hoa trái” để có tiếng Việt tự nhiên hơn mà vẫn giữ thành ngữ nguyên bản. Điều chỉnh cách trình bày καινόν để tránh biến tính từ thành một “thứ” riêng biệt. Cách dịch “như một điều mới” vẫn cần chú thích vì tiếng Việt không thể tái tạo trọn vẹn sự mơ hồ ngữ pháp-ngữ nghĩa của καινόν mà không thành gượng.
  reviewer_model: gpt-5.6-terra
