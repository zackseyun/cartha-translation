  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἀναστὰς ὁ ἀρχιερεὺς εἶπεν αὐτῷ· Οὐδὲν ἀποκρίνῃ; τί οὗτοί σου καταμαρτυροῦσιν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/062.yaml
  text: And the high priest stood up and said to him[b][a], “Do you give no answer? What is it that these men are testifying against you?”
translation:
  language: vi
  text: 'Thượng tế đứng dậy và nói với ông: “Ông không trả lời gì sao? Những người này đang làm chứng chống lại ông về điều gì?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναστὰς
  choice: đứng dậy
  rationale: Diễn tả hành động thể lý xảy ra trước khi thượng tế lên tiếng, tự nhiên trong tiếng Việt và giữ được sức nặng kịch tính của cảnh xét hỏi.
- source_word: ὁ ἀρχιερεὺς
  choice: Thượng tế
  rationale: Danh xưng thông dụng, chính xác cho chức vụ tư tế cao nhất của người Do Thái trong bối cảnh này.
- source_word: εἶπεν αὐτῷ
  choice: nói với ông
  rationale: Giữ đại từ của nguyên văn thay vì thay bằng tên riêng; “ông” phù hợp với lời thuật và cách xưng hô trực tiếp trong cảnh xét hỏi.
- source_word: Οὐδὲν ἀποκρίνῃ;
  choice: Ông không trả lời gì sao?
  rationale: Câu hỏi tự nhiên trong tiếng Việt, giữ ý người hỏi đòi một lời đáp và không biến nó thành một lời khẳng định.
- source_word: τί
  choice: về điều gì
  rationale: Đặt ở cuối câu theo cú pháp tiếng Việt để hỏi về nội dung lời chứng mà không thêm cách giải thích vượt quá nguyên văn.
- source_word: οὗτοί
  choice: những người này
  rationale: Thể hiện đại từ chỉ định số nhiều giống đực, chỉ những người đang làm chứng tại chỗ.
- source_word: σου
  choice: chống lại ông
  rationale: Khi đi với καταμαρτυροῦσιν, đại từ mang quan hệ bất lợi trong bối cảnh pháp lý, không chỉ đơn thuần là “về ông”.
- source_word: καταμαρτυροῦσιν
  choice: đang làm chứng chống lại
  rationale: Giữ sắc thái pháp lý của động từ và tính đang diễn ra của thì hiện tại, chính xác hơn cách diễn giải rộng là “buộc tội”.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Trật tự “làm chứng chống lại ông về điều gì” được chọn để câu hỏi tự nhiên trong tiếng Việt mà vẫn giữ đầy đủ sắc thái pháp lý của nguyên văn.
