lexical_decisions:
- source_word: συνεβουλεύσαντο
  choice: cùng nhau bàn mưu
  rationale: Diễn đạt hành động cùng bàn bạc và lập kế hoạch; trong ngữ cảnh âm mưu sát hại, “bàn mưu” truyền đạt tự nhiên sắc thái hiểm độc.
- source_word: ἵνα
  choice: để
  rationale: Giữ quan hệ mục đích của mệnh đề Hy Lạp mà không làm câu tiếng Việt nặng nề.
- source_word: δόλῳ
  choice: dùng thủ đoạn
  rationale: Truyền đạt phương cách gian trá, quỷ quyệt; tự nhiên hơn cách dịch sát chữ “bằng sự lừa dối” trong ngữ cảnh bắt người.
- source_word: κρατήσωσιν
  choice: bắt
  rationale: Trong ngữ cảnh này, động từ mang nghĩa bắt giữ, khống chế.
- source_word: ἀποκτείνωσιν
  choice: giết
  rationale: Tương ứng trực tiếp với hành động làm chết, bằng từ phổ thông và rõ nghĩa.
