  text: καὶ ἀπὸ τότε ἐζήτει εὐκαιρίαν ἵνα αὐτὸν παραδῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/016.yaml
  text: And from then on he was seeking an opportunity to hand him over[a].
translation:
  language: vi
  text: Từ lúc ấy, ông ta tìm kiếm dịp thuận tiện để giao nộp Ngài[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “phản bội Ngài.” Động từ Hy Lạp theo nghĩa sát hơn là “giao nộp” hoặc “nộp” một người.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπὸ τότε
  choice: Từ lúc ấy
  rationale: Diễn đạt tự nhiên điểm khởi đầu trong thời gian và hàm ý hành động tiếp diễn kể từ đó.
- source_word: ἐζήτει
  choice: tìm
  rationale: Thì chưa hoàn thành Hy Lạp cho thấy một hành động đang tiếp diễn hoặc lặp lại; trong tiếng Việt, kết cấu “Từ lúc ấy... tìm” truyền đạt tự nhiên ý này mà không cần thêm trạng từ.
- source_word: εὐκαιρίαν
  choice: cơ hội
  rationale: Chỉ một dịp thuận lợi hoặc thích hợp; “cơ hội” rõ ràng, tự nhiên và để ngữ cảnh truyền đạt sắc thái thuận lợi.
- source_word: ἵνα
  choice: để
  rationale: Biểu thị mục đích một cách tự nhiên trong tiếng Việt.
- source_word: αὐτὸν
  choice: Ngài
  rationale: Đại từ chỉ Chúa Giê-su theo ngữ cảnh; viết hoa theo quy ước tôn kính phổ biến trong văn phong Kinh Thánh tiếng Việt mà không làm thay đổi nghĩa.
- source_word: παραδῷ
  choice: nộp
  rationale: Giữ nghĩa căn bản là giao hoặc trao một người vào tay người khác, thay vì thu hẹp ngay thành “phản bội”.
theological_decisions:
- issue: Cách dịch παραδῷ trong bối cảnh Giu-đa
  choice: nộp Ngài
  alternative: phản bội Ngài
  rationale: Hành động của Giu-đa thực sự là sự phản bội, nhưng động từ Hy Lạp có nghĩa rộng hơn là giao/nộp một người. Bản văn chính giữ nghĩa từ vựng, còn chú thích nêu cách hiểu theo ngữ cảnh.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “hắn” để duy trì chủ thể là Giu-đa từ ngữ cảnh trước; dùng “nộp Ngài” nhằm giữ sắc thái từ vựng rộng của παραδίδωμι và tránh giải nghĩa quá mức ngay trong chính văn.
