  rationale: Thay đại từ mang tính miệt thị bằng cách xưng hô trung tính, làm rõ khía cạnh tiếp diễn của ἐζήτει, và diễn đạt εὐκαιρίαν cùng παραδῷ sát hơn trong tiếng Việt hiện đại. Không thay đổi nghĩa, chủ thể quy chiếu theo văn mạch, hoặc lựa chọn không thu hẹp παραδίδωμι thành “phản bội” trong chính văn.
