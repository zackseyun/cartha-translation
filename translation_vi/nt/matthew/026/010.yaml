  text: γνοὺς δὲ ὁ Ἰησοῦς εἶπεν αὐτοῖς· Τί κόπους παρέχετε τῇ γυναικί; ἔργον γὰρ καλὸν ἠργάσατο εἰς ἐμέ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/010.yaml
  text: But Jesus[a], knowing this, said to them[b], “Why are you causing trouble for the woman? For she has done a beautiful work to me.
translation:
  language: vi
  text: 'Nhưng Đức Giê-su biết chuyện ấy nên nói với họ: “Tại sao các anh lại gây phiền hà cho người phụ nữ? Vì cô ấy đã làm một việc cao đẹp cho tôi.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γνοὺς
  choice: biết chuyện ấy
  rationale: Phân từ bất định của γινώσκω diễn tả hoàn cảnh xảy ra trước lời nói; “chuyện ấy” nêu rõ đối tượng được hàm ý từ ngữ cảnh, tức lời phàn nàn của các môn đồ.
- source_word: δὲ
  choice: Nhưng
  rationale: δέ đánh dấu sự chuyển ý có sắc thái tương phản nhẹ giữa lời phàn nàn của các môn đồ và lời Đức Giê-su sửa bảo họ.
- source_word: Τί κόπους παρέχετε
  choice: Tại sao các anh lại gây phiền hà
  rationale: Thành ngữ κόπους παρέχετε có nghĩa là gây khó khăn, phiền toái hoặc khổ sở; “gây phiền hà” tự nhiên trong tiếng Việt và giữ được sắc thái quở trách.
- source_word: τῇ γυναικί
  choice: cho người phụ nữ này
  rationale: Cách ở đây chỉ người chịu tác động. Từ “này” được dùng tự nhiên theo ngữ cảnh hiện diện, dù nguyên văn chỉ có mạo từ xác định.
- source_word: ἔργον καλὸν
  choice: một việc cao đẹp
  rationale: καλός vừa mang nghĩa tốt vừa có sắc thái đẹp đẽ, đáng quý và thích hợp; “việc cao đẹp” truyền đạt tự nhiên cả chiều kích đạo đức lẫn vẻ đẹp của hành động.
- source_word: ἠργάσατο
  choice: đã làm
  rationale: Động từ bất định chỉ hành động đã hoàn tất; “đã làm” là cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: εἰς ἐμέ
  choice: cho tôi
  rationale: εἰς với một người có thể chỉ hướng quy về hoặc mối liên hệ; trong ngữ cảnh này, “cho tôi” tự nhiên và vẫn giữ ý hành động hướng đến Đức Giê-su.
theological_decisions:
- issue: Sự đánh giá hành động của người phụ nữ
  choice: một việc cao đẹp
  alternative: một việc tốt
  rationale: Cách dịch này giữ lời khen rõ ràng và sắc thái thẩm mỹ-đạo đức của καλός mà không đưa thêm ý niệm thần học về công đức hay bí tích.
- issue: Mối liên hệ của hành động với Đức Giê-su
  choice: cho tôi
  alternative: đối với tôi
  rationale: “Cho tôi” diễn đạt tự nhiên εἰς ἐμέ trong tiếng Việt, nhưng không xác quyết quá mức rằng giới từ chỉ duy nhất lợi ích; ý hướng quy về Đức Giê-su vẫn được bảo toàn.
translation_notes:
  register: Văn phong hiện đại, trang trọng nhưng dễ hiểu. Dùng “Đức Giê-su” theo lối gọi phổ biến trong tiếng Việt; “các anh” phù hợp với lời nói trực tiếp với nhóm môn đồ. Không thêm chú thích vì các phương án khác không tạo ra khác biệt cần thiết cho việc hiểu câu.
