revisions:
- from: 'Nhưng Đức Giê-su nói với hắn[a]: “Bạn ơi, hãy làm điều anh đến để làm.” Bấy giờ, họ tiến đến, tra tay bắt Đức Giê-su và giữ chặt Ngài.'
  to: 'Nhưng Đức Giê-su nói với Giu-đa[a]: “Bạn ơi, hãy làm điều bạn đến để làm.” Bấy giờ, họ tiến đến, đặt tay lên Đức Giê-su và bắt giữ Ngài.'
  rationale: Sửa các đại từ để giữ giọng kể trung tính của nguyên văn và nhất quán trong lời xưng hô. Thay “tra tay bắt ... và giữ chặt” bằng “đặt tay lên ... và bắt giữ” để phản ánh minh bạch hai hành động liên tiếp trong tiếng Hy Lạp. Giữ cách dịch chính và chú thích nghi vấn nhằm bảo tồn sự cô đọng, mơ hồ có thật của ἐφ’ ὃ πάρει.
