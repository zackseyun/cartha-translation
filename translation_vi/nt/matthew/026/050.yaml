base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/050.yaml
  text: But Jesus said to him[a], “Friend, do what you came for.” Then they came up, laid hands on Jesus, and seized him.
translation:
  language: vi
  text: 'Nhưng Đức Giê-su nói với Giu-đa[a]: “Bạn ơi, hãy làm điều bạn đến để làm.” Bấy giờ, họ tiến đến, đặt tay lên Đức Giê-su và bắt giữ Ngài.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Bạn ơi, bạn đến đây để làm gì?” Cụm từ Hy Lạp rất cô đọng và có thể được hiểu là một câu hỏi.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἑταῖρε
  choice: Bạn ơi
  rationale: Lời xưng hô trực tiếp với Giu-đa, giữ sắc thái có chừng mực và không nhất thiết hàm ý tình bạn thân thiết. “Bạn ơi” tự nhiên trong tiếng Việt hiện đại mà không làm lời nói trở nên quá trìu mến.
- source_word: ἐφ’ ὃ πάρει
  choice: hãy làm điều anh đến để làm
  rationale: Cụm Hy Lạp cô đọng và có thể được hiểu như một lời cho phép hoặc thúc giục mang tính hàm ẩn. Cách dịch này truyền đạt ý chính trong ngữ cảnh, còn cách hiểu nghi vấn được giữ trong chú thích.
- source_word: προσελθόντες
  choice: họ tiến đến
  rationale: Diễn tả nhóm người tiến lại gần Đức Giê-su và phù hợp với trình tự kể chuyện của phân từ aorist.
- source_word: ἐπέβαλον τὰς χεῖρας ἐπὶ τὸν Ἰησοῦν
  choice: tra tay bắt Đức Giê-su
  rationale: Thành ngữ tiếng Việt tự nhiên diễn tả việc dùng tay khống chế để bắt giữ, tương ứng với hành động mang tính thù địch trong nguyên văn.
- source_word: ἐκράτησαν αὐτόν
  choice: giữ chặt Ngài
  rationale: κρατέω ở đây chỉ việc nắm giữ và khống chế bằng sức mạnh; “giữ chặt” bảo toàn tính thể chất của hành động mà không thêm sắc thái pháp lý.
- source_word: δὲ
  choice: Nhưng
  rationale: δέ đánh dấu sự chuyển ý có sắc thái tương phản nhẹ giữa hành động của Giu-đa và lời đáp của Đức Giê-su.
theological_decisions:
- issue: Cách hiểu lời Đức Giê-su nói với Giu-đa
  choice: “Bạn ơi, hãy làm điều anh đến để làm.”
  alternative: “Bạn ơi, anh đến đây để làm gì?”
  rationale: Giữ sắc thái kiềm chế trong cách Đức Giê-su gọi Giu-đa, đồng thời không biến câu nói thành hoàn toàn trìu mến hay hoàn toàn kết án. Vì cấu trúc Hy Lạp cô đọng và có thể hiểu như câu hỏi, cách hiểu ấy được ghi ở chú thích.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “Đức Giê-su” theo lối gọi kính trọng phổ biến; đại từ “hắn” chỉ Giu-đa phản ánh đối tượng vừa được nhắc đến trong mạch văn, còn “Ngài” dành cho Đức Giê-su. Chú thích bảo tồn sự mơ hồ có thật của nguyên văn.
