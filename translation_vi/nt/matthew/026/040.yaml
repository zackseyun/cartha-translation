id: MAT.26.40
reference: Matthew 26:40
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἔρχεται πρὸς τοὺς μαθητὰς καὶ εὑρίσκει αὐτοὺς καθεύδοντας, καὶ λέγει τῷ Πέτρῳ· Οὕτως οὐκ ἰσχύσατε μίαν ὥραν γρηγορῆσαι μετ’ ἐμοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/040.yaml
  text: And he comes to the disciples and finds them sleeping[a], and he says to Peter, “So[b], were you not able to stay awake with me for one hour?”
translation:
  language: vi
  text: 'Rồi Ngài đến chỗ các môn đồ và thấy họ đang ngủ. Ngài nói với Phi-e-rơ: “Vậy mà các anh[b] không thể thức[a] với tôi được một giờ sao?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “thức canh” hoặc “canh thức.”'
    reason: γρηγορέω vừa có nghĩa tỉnh thức, không ngủ, vừa có thể hàm ý cảnh giác hoặc canh giữ.
  - marker: b
    text: “Các anh” là số nhiều trong nguyên văn, dù Ngài đang nói với Phi-e-rơ.
    reason: Chú thích giúp người đọc nhận ra sự chuyển đổi số vốn hiện diện trong tiếng Hy Lạp mà không diễn giải Phi-e-rơ là đại diện cho nhóm.
lexical_decisions:
- source_word: ἔρχεται
  choice: đến
  rationale: Dịch động từ hiện tại lịch sử bằng cách kể tự nhiên trong tiếng Việt; từ “Rồi” duy trì diễn tiến sống động của câu chuyện mà không ép dùng dấu hiệu thì không tự nhiên.
- source_word: πρὸς τοὺς μαθητὰς
  choice: đến chỗ các môn đồ
  rationale: Diễn đạt tự nhiên hướng chuyển động của πρός và cho thấy Ngài trở lại nơi các môn đồ đang ở.
- source_word: εὑρίσκει αὐτοὺς καθεύδοντας
  choice: thấy họ đang ngủ
  rationale: “Đang ngủ” giữ tính động từ của phân từ καθεύδοντας và làm rõ trạng thái Ngài bắt gặp họ.
- source_word: λέγει τῷ Πέτρῳ
  choice: Ngài nói với Phi-e-rơ
  rationale: Giữ rõ Phi-e-rơ là người trực tiếp được nói với; “Phi-e-rơ” là dạng tên quen thuộc trong tiếng Việt.
- source_word: Οὕτως
  choice: Vậy mà
  rationale: Trong ngữ cảnh này, οὕτως mở đầu lời trách nhẹ pha ngạc nhiên; “Vậy mà” truyền đạt sắc thái ấy tự nhiên hơn cách dịch máy móc “như thế”.
- source_word: οὐκ ἰσχύσατε
  choice: các anh không thể … được … sao?
  rationale: ἰσχύω chỉ khả năng hoặc sức lực. Cấu trúc hỏi phủ định tiếng Việt giữ được sắc thái trách nhẹ và sự ngạc nhiên.
- source_word: μίαν ὥραν
  choice: được một giờ
  rationale: Một giờ là khoảng thời gian kéo dài; cấu trúc “thức … được một giờ” là cách nói tự nhiên trong tiếng Việt.
- source_word: γρηγορῆσαι
  choice: thức
  rationale: Trong thế đối lập trực tiếp với việc họ đang ngủ, “thức” truyền đạt nghĩa cụ thể trước hết của γρηγορέω; sắc thái canh thức được ghi ở chú thích.
- source_word: μετ’ ἐμοῦ
  choice: với tôi
  rationale: Dịch trực tiếp ý đồng hành của μετά, không thêm mục đích mà nguyên văn không nêu.
theological_decisions:
- issue: Ngài nói với riêng Phi-e-rơ nhưng động từ ἰσχύσατε ở ngôi thứ hai số nhiều
  choice: Giữ Phi-e-rơ là người được nói với, đồng thời dùng đại từ số nhiều “các anh” trong lời trách.
  alternative: Dùng số ít “anh” để lời trách chỉ hướng đến Phi-e-rơ, hoặc diễn giải rằng Phi-e-rơ đại diện cho cả nhóm.
  rationale: Nguyên văn cố ý đặt người nghe trực tiếp ở số ít bên cạnh động từ số nhiều. Bản dịch không giải quyết thay người đọc sự căng thẳng này.
translation_notes:
  register: Văn phong hiện đại, trang trọng nhưng dễ hiểu. Dùng câu hỏi phủ định tự nhiên để giữ giọng trách nhẹ. “Ngài” làm chủ ngữ theo ngữ cảnh và tránh lặp tên; lời trực tiếp dùng “tôi” đúng với ngôi thứ nhất của μετ’ ἐμοῦ.
