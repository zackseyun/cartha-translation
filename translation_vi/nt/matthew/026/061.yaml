source:
  edition: SBLGNT
  text: εἶπαν· Οὗτος ἔφη· Δύναμαι καταλῦσαι τὸν ναὸν τοῦ θεοῦ καὶ διὰ τριῶν ἡμερῶν ⸀οἰκοδομῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/061.yaml
  text: They said[a], “This man said[b], ‘I am able to destroy the temple of God and to build it in three days.’”
translation:
  language: vi
  text: 'Họ nói: “Người này đã nói: ‘Tôi có thể phá đổ đền thờ của Đức Chúa Trời và xây dựng đền thờ ấy trong ba ngày[a].’”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “trong vòng ba ngày.” Cụm từ Hy Lạp có thể chỉ việc hoàn tất trong khoảng thời gian đó.'
    reason: lexical_alternative
  - marker: b
    text: Xem Giăng 2:19–21, nơi lời của Chúa Giê-su về đền thờ được giải thích là nói về thân thể ngài.
    reason: cross_reference
lexical_decisions:
- source_word: εἶπαν
  choice: Họ nói
  rationale: Thì bất định trình bày lời tố cáo của các nhân chứng như một sự việc đơn nhất trong quá khứ; tiếng Việt kể chuyện tự nhiên không cần thêm dấu hiệu quá khứ.
- source_word: Οὗτος
  choice: Người này
  rationale: Giữ sắc thái chỉ trỏ, có phần khinh miệt, trong lời buộc tội mà vẫn tự nhiên hơn cách dịch sát chữ “người này đây”.
- source_word: ἔφη
  choice: đã nói
  rationale: Động từ chỉ việc nói được dịch đơn giản; “đã” làm rõ rằng họ đang thuật lại một phát ngôn trước đó.
- source_word: Δύναμαι
  choice: Tôi có thể
  rationale: Diễn đạt trực tiếp khả năng trong tiếng Việt hiện đại, không làm tăng sắc thái thành lời khoe quyền năng.
- source_word: καταλῦσαι
  choice: phá đổ
  rationale: Trong ngữ cảnh một công trình, từ này có nghĩa phá hoặc triệt hạ; “phá đổ” cụ thể và tự nhiên.
- source_word: τὸν ναὸν τοῦ θεοῦ
  choice: đền thờ của Đức Chúa Trời
  rationale: ναός chỉ đền thờ hoặc khu thánh; ở đây “đền thờ” rõ nghĩa đối với độc giả phổ thông, còn sở hữu cách được giữ bằng “của Đức Chúa Trời”.
- source_word: διὰ τριῶν ἡμερῶν
  choice: trong ba ngày
  rationale: διά với sở hữu cách diễn tả một khoảng thời gian; “trong ba ngày” giữ được khả năng hiểu là việc hoàn tất diễn ra trong khoảng ấy.
- source_word: οἰκοδομῆσαι
  choice: xây lại
  rationale: Ngữ cảnh ngôi đền vừa bị phá khiến “xây lại” là cách diễn đạt tự nhiên trong tiếng Việt, dù động từ Hy Lạp tự nó có nghĩa cơ bản là “xây”.
theological_decisions:
- issue: Đối tượng được gọi là “đền thờ của Đức Chúa Trời” trong lời tố cáo
  choice: Dịch lời tố cáo theo nghĩa bề mặt là đền thờ vật chất.
  alternative: Đưa ngay vào câu dịch cách hiểu đền thờ là thân thể của Chúa Giê-su.
  rationale: Ma-thi-ơ đang thuật lại lời các nhân chứng gán cho Chúa Giê-su. Không nên dùng lời giải thích của Giăng 2:21 để thay đổi nội dung lời tố cáo trong chính văn; mối liên hệ ấy được nêu ở chú thích đối chiếu.
- issue: Sắc thái của đại từ ngôi thứ nhất trong lời trích dẫn
  choice: Tôi
  alternative: Ta
  rationale: Bản Hy Lạp chỉ đánh dấu ngôi thứ nhất và không tự quy định cấp độ xưng hô. “Tôi” là cách nói hiện đại, trung tính, tránh thêm sắc thái uy quyền vốn có thể đi kèm “Ta” trong tiếng Việt.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dấu hai chấm cùng hai tầng ngoặc kép làm rõ lời các nhân chứng và lời họ trích dẫn. Các chú thích được đặt đúng tại cụm thời gian và toàn bộ lời được đối chiếu.
