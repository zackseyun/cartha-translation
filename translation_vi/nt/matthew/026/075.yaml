    rationale: με chỉ là «tôi/tớ», còn ngôi thứ hai trong động từ không xác định quan hệ thầy-trò hay lối xưng «con». «anh sẽ chối tôi» giữ nội dung trung tính hơn mà vẫn tự nhiên.
