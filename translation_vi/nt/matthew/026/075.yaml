reference: Matthew 26:75
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἐμνήσθη ὁ Πέτρος τοῦ ⸀ῥήματος Ἰησοῦ ⸀εἰρηκότος ὅτι Πρὶν ἀλέκτορα φωνῆσαι τρὶς ἀπαρνήσῃ με, καὶ ἐξελθὼν ἔξω ἔκλαυσεν πικρῶς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/075.yaml
  text: 'And Peter remembered the word Jesus had spoken: “Before a rooster crows[a], you will deny me three times.” And he went outside and wept bitterly.'
translation:
  language: vi
  text: 'Phi-e-rơ nhớ lại lời Giê-su đã nói: “Trước khi gà gáy[a], anh sẽ chối tôi ba lần.” Rồi ông đi ra ngoài và khóc cay đắng.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Trước khi con gà gáy.” Tiếng Hy Lạp không có mạo từ; câu nói nhấn vào việc gà gáy hơn là xác định một con gà cụ thể.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμνήσθη
  choice: nhớ lại
  rationale: Diễn đạt tự nhiên ý Phi-e-rơ chợt nhớ lại lời đã được nói trước đó, phù hợp với lực kể chuyện của động từ aorist.
- source_word: ῥήματος
  choice: lời
  rationale: Trong ngữ cảnh này, ῥῆμα chỉ một lời nói hay phát biểu cụ thể; “lời” vừa ngắn gọn vừa tự nhiên trong tiếng Việt.
- source_word: εἰρηκότος
  choice: đã nói
  rationale: Phân từ hoàn thành chỉ lời Đức Giê-su đã nói trước đó và nay vẫn có ý nghĩa; “đã nói” thể hiện rõ quan hệ thời gian.
- source_word: Πρὶν ἀλέκτορα φωνῆσαι
  choice: Trước khi gà gáy
  rationale: Chuyển cấu trúc nguyên mẫu chỉ thời gian sang mệnh đề tiếng Việt tự nhiên. Danh từ ἀλέκτωρ không có mạo từ; tiếng Việt có thể nói tự nhiên “gà gáy” mà không buộc xác định một con gà cụ thể.
- source_word: τρὶς
  choice: ba lần
  rationale: Cách nói hiện đại, rõ ràng và tương ứng trực tiếp với trạng từ Hy Lạp.
- source_word: ἀπαρνήσῃ
  choice: con sẽ chối Thầy
  rationale: “Chối” diễn đạt hành động phủ nhận mối liên hệ với Đức Giê-su. Đại từ “con–Thầy” phản ánh quan hệ thầy trò trong lời trực tiếp mà không thêm tước hiệu thần học.
- source_word: ἐξελθὼν ἔξω
  choice: đi ra ngoài
  rationale: Giữ ý chuyển động rời khỏi nơi đang đứng, đồng thời tránh lặp vụng về theo cấu trúc Hy Lạp.
- source_word: ἔκλαυσεν πικρῶς
  choice: khóc cay đắng
  rationale: Giữ hình ảnh và sức nặng của tổ hợp động từ–trạng từ, diễn tả nỗi đau sâu sắc mà không diễn giải thêm nguyên nhân hay trạng thái nội tâm.
theological_decisions:
- issue: Cách gọi Ἰησοῦ
  choice: Đức Giê-su
  alternative: Chúa Giê-su
  rationale: Nguyên văn chỉ dùng tên Ἰησοῦ, không có tước hiệu “Chúa”. “Đức Giê-su” là cách gọi tên trang trọng, tự nhiên trong văn phong Kinh Thánh tiếng Việt mà không thêm tước hiệu Kitô học.
- issue: Đại từ trong lời Đức Giê-su nói với Phi-e-rơ
  choice: con … Thầy
  alternative: ngươi … ta
  rationale: Nguyên văn chỉ biểu thị ngôi thứ hai và ngôi thứ nhất, không mã hóa sắc thái đại từ như tiếng Việt. “Con–Thầy” phù hợp quan hệ môn đệ–thầy, tự nhiên và trang trọng; tránh sắc thái xa cách hoặc gay gắt không tất yếu của “ngươi–ta”.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Câu văn giữ nhịp kể ngắn gọn và sức nặng cảm xúc của nguyên văn; không thêm tước hiệu cho Đức Giê-su hay giải thích nỗi khóc của Phi-e-rơ.
