  source_fidelity: 'Bản dịch chuyển tải đúng trình tự và nội dung chính của nguyên văn: Phi-e-rơ nhớ lại lời nói trước đó của Giê-su, lời dự báo việc chối ba lần trước tiếng gà gáy, rồi đi ra ngoài khóc cách cay đắng. Tuy nhiên, nguyên văn chỉ có tên Ἰησοῦ, không có yếu tố tôn kính hay tước hiệu; «Đức Giê-su» thêm sắc thái tôn kính. Trong lời trích, «con ... Thầy» cũng xác định quan hệ xưng hô mà tiếng Hy Lạp chỉ dùng các đại từ «anh ... tôi».'
