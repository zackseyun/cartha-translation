  yaml_path: translation/nt/matthew/026/032.yaml
  text: But after I am raised up[a], I will go ahead of you into Galilee.
translation:
  language: vi
  text: Nhưng sau khi tôi được phục sinh[a], tôi sẽ đi trước các anh đến Ga-li-lê.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “sau khi tôi sống lại.” Nguyên văn Hy Lạp dùng thể bị động: “sau khi tôi được phục sinh.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ δὲ
  choice: Nhưng sau khi
  rationale: μετά với động từ nguyên mẫu có mạo từ diễn tả thời gian “sau khi”; δέ tạo nét tương phản nhẹ với lời báo trước ngay trước đó.
- source_word: τὸ ἐγερθῆναί με
  choice: tôi được làm cho sống lại
  rationale: Dạng nguyên mẫu aorist bị động của ἐγείρω, với με làm chủ thể, được giữ ở thể bị động; cách nói này tự nhiên trong tiếng Việt và không nêu rõ tác nhân.
- source_word: προάξω ὑμᾶς
  choice: tôi sẽ đi trước các anh
  rationale: προάγω ở đây có nghĩa đi trước ai; “đi trước” giữ nghĩa phương hướng mà không diễn giải quá mức thành dẫn dắt.
- source_word: εἰς τὴν Γαλιλαίαν
  choice: đến Ga-li-lê
  rationale: εἰς chỉ chuyển động hướng tới hoặc đi vào một nơi; “đến Ga-li-lê” là cách diễn đạt tự nhiên trong tiếng Việt hiện đại.
theological_decisions:
- issue: Cách diễn đạt sự phục sinh trong ἐγερθῆναί
  choice: sau khi được làm cho sống lại
  alternative: sau khi sống lại
  rationale: Giữ thể bị động rõ ràng của nguyên ngữ và hàm ý tác động mà không xác định tác nhân; chú thích cung cấp cách nói chủ động tự nhiên hơn.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải. “Các anh” thể hiện số nhiều khi Đức Giê-su nói với các môn đệ; tên địa danh được phiên âm theo cách quen dùng trong tiếng Việt.
