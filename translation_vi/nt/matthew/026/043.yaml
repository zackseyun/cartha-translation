  source_fidelity: 'Bản dịch chuyển tải đầy đủ trình tự và quan hệ của nguyên văn: Chúa Giê-su đến lần nữa, thấy các môn đồ đang ngủ, và câu sau giải thích rằng mắt họ ở trong tình trạng nặng nề. “Đang ngủ” diễn tả phù hợp phân từ hiện tại καθεύδοντας; “mắt họ nặng trĩu” diễn đạt tự nhiên trạng thái kết quả của βεβαρημένοι mà không thêm chi tiết ngoài bản văn.'
