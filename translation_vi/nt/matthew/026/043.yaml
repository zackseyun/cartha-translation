source:
  edition: SBLGNT
  text: καὶ ἐλθὼν ⸂πάλιν εὗρεν αὐτοὺς⸃ καθεύδοντας, ἦσαν γὰρ αὐτῶν οἱ ὀφθαλμοὶ βεβαρημένοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/043.yaml
  text: And coming again[a], he found them sleeping, for their eyes were weighed down.
translation:
  language: vi
  text: Ngài lại đến và thấy họ đang ngủ, vì mắt họ nặng trĩu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλθὼν
  choice: đến
  rationale: Phân từ bất định thì của ἔρχομαι diễn tả hành động xảy ra trước động từ chính; cấu trúc “lại đến và thấy” tự nhiên trong tiếng Việt mà vẫn giữ trình tự của câu Hy Lạp.
- source_word: πάλιν
  choice: lại
  rationale: Diễn tả sự lặp lại ngắn gọn và tự nhiên.
- source_word: εὗρεν
  choice: thấy
  rationale: Trong văn cảnh này, εὑρίσκω mang nghĩa nhận ra hoặc bắt gặp họ trong tình trạng đang ngủ; “thấy” là cách diễn đạt tự nhiên, không hàm ý trước đó họ bị thất lạc.
- source_word: καθεύδοντας
  choice: đang ngủ
  rationale: Phân từ hiện tại mô tả tình trạng đang tiếp diễn của các môn đồ lúc Ngài đến.
- source_word: ἦσαν γὰρ
  choice: vì ...
  rationale: γάρ nêu lý do giải thích việc họ đang ngủ; “vì” thể hiện rõ quan hệ giải thích trong tiếng Việt.
- source_word: αὐτῶν οἱ ὀφθαλμοὶ
  choice: mắt họ
  rationale: Chuyển cấu trúc sở hữu Hy Lạp sang cách nói gọn và tự nhiên của tiếng Việt.
- source_word: βεβαρημένοι
  choice: nặng trĩu
  rationale: Phân từ hoàn thành bị động của βαρέω chỉ trạng thái đã trở nên nặng và vẫn còn kéo dài. “Nặng trĩu” truyền đạt sinh động tình trạng mí mắt khó mở vì buồn ngủ mà không cần thêm lời giải thích.
theological_decisions: []
