  terminology: “Ngài” phù hợp với quy ước tôn kính trong ngữ cảnh và không gây mơ hồ. Không có thuật ngữ thần học chuyên biệt hoặc tên riêng cần điều chỉnh. Bản dịch giữ “mắt” như nguyên văn, không thay bằng “mí mắt.”
