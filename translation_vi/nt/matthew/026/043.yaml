  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Ngài” theo ngữ cảnh để chỉ Chúa Giê-su; câu ngắn, giữ nguyên quan hệ nhân quả của nguyên văn.
