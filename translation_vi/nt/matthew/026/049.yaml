  terminology: Giữ “Giê-su,” “Ra-bi,” và “Ngài” là nhất quán với văn phong Kinh Thánh tiếng Việt trang trọng. Chú thích a cần nêu nghĩa của “Ra-bi,” vì bản dịch chọn phiên âm tước hiệu thay vì dịch là “Thầy”; đồng thời phương án thay thế phải bao gồm cả cụm chào và tước hiệu, không chỉ “Chào.”
