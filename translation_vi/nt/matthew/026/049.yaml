  source_fidelity: 'Bản dịch theo sát trình tự và nội dung Hy Lạp: trạng từ εὐθέως, hành động đến gần, lời chào, tước hiệu ῥαββί, và hành động hôn. Tuy nhiên, “ông ta” thường mang sắc thái xa cách hoặc chê trách trong tiếng Việt hiện đại, vượt quá đại từ ngôi ba không đánh dấu sắc thái trong nguyên văn. “Ông” giữ tham chiếu ngữ cảnh mà không thêm phán xét.'
