  - severity: low
    issue: Chú thích a chưa giải thích tước hiệu “Ra-bi” và phương án “Chào” không phản ánh đầy đủ cụm Χαῖρε, ῥαββί.
    rationale: Vì chính văn bảo lưu tước hiệu phiên âm, chú thích nên cho độc giả nghĩa “Thầy” và đưa phương án dịch tương ứng đầy đủ.
