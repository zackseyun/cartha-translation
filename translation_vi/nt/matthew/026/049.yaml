base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/049.yaml
  text: And immediately he came up to Jesus and said[a], “Greetings[b], Rabbi,” and kissed him.
translation:
  language: vi
  text: 'Ngay lập tức, ông đến gần Giê-su và nói: “Kính chào, Ra-bi!” rồi hôn Ngài[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'Động từ Hy Lạp có thể hàm ý một nụ hôn nhấn mạnh hoặc được lặp lại: “hôn Ngài tha thiết” hoặc “hôn Ngài nhiều lần”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθέως
  choice: ngay lập tức
  rationale: Diễn đạt rõ tính tức thời và nhịp kể khẩn trương, bằng tiếng Việt hiện đại.
- source_word: προσελθὼν τῷ Ἰησοῦ
  choice: đến gần Giê-su
  rationale: Diễn đạt tự nhiên hành động tiến lại gần Chúa Giê-su; không thêm ý ngoài chuyển động được nêu trong nguyên văn.
- source_word: εἶπεν
  choice: nói
  rationale: Tương ứng trực tiếp với động từ kể lời nói đơn giản trong nguyên văn.
- source_word: Χαῖρε
  choice: Kính chào
  rationale: Trong ngữ cảnh này, đây là lời chào thông dụng. “Kính chào” vừa tự nhiên, vừa phù hợp với cách xưng hô bằng tước hiệu Ra-bi, mà không biến lời ấy thành một lời tung hô thần học.
- source_word: ῥαββί
  choice: Ra-bi
  rationale: Giữ hình thức phiên âm của tước hiệu Semit như bản Hy Lạp; chú thích có thể giúp người đọc nhận ra nghĩa “Thầy”.
- source_word: κατεφίλησεν
  choice: hôn
  rationale: Động từ có thể mang sắc thái hôn tha thiết hoặc hôn nhiều lần, nhưng chỉ dịch “hôn” trong chính văn để tránh diễn giải quá mức; sắc thái tăng cường được bảo lưu trong chú thích.
- source_word: αὐτόν
  choice: Ngài
  rationale: Đại từ chỉ Giê-su được chuyển sang cách xưng hô kính trọng, tự nhiên trong văn phong Kinh Thánh tiếng Việt.
theological_decisions:
- issue: Sắc thái của lời chào Χαῖρε
  choice: Kính chào
  alternative: Chào; hãy vui mừng
  rationale: Tại đây từ này hoạt động như một lời chào xã giao, không nhất thiết là mệnh lệnh “hãy vui mừng”. Cách dịch không làm đậm thêm cũng không xóa đi tính mỉa mai do bối cảnh phản bội tạo nên.
- issue: Mức độ nhấn mạnh của κατεφίλησεν
  choice: hôn
  alternative: hôn tha thiết; hôn nhiều lần
  rationale: Tiền tố trong động từ có thể gợi hành động hôn mạnh mẽ hoặc lặp lại, nhưng mức độ chính xác vẫn có phần bất định. Chính văn giữ cách dịch không cường giải, còn chú thích nêu các khả năng.
- issue: Cách chuyển dịch ῥαββί
  choice: Ra-bi
  alternative: Thầy
  rationale: Giữ tước hiệu được phiên âm trong nguyên văn Hy Lạp, tránh làm phẳng sắc thái lịch sử và văn hóa; nghĩa của tước hiệu được nêu trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “ông ta” để giữ đại từ ngôi thứ ba của nguyên văn mà không đưa tên Giu-đa vào câu; dùng “Ra-bi” nhằm bảo lưu tước hiệu lịch sử. Tất cả dấu chú thích đều đặt ngay sau từ ngữ liên quan trong chính văn.
