    issue: Kính ngữ “Đức” được thêm trước tên Giê-su.
    rationale: Tên riêng Ἰησοῦς không tự mang kính ngữ trong tiếng Hy Lạp. Bỏ “Đức” tránh bổ sung sắc thái tôn xưng ngoài văn bản, đồng thời vẫn giữ giọng trang trọng qua ngữ cảnh.
  - severity: low
    issue: “Các môn đồ” và “đã truyền dặn” chưa tối ưu cho tiếng Việt tiêu chuẩn hiện đại.
    rationale: “Môn đệ” là cách gọi hiện đại, trung tính và thông dụng; “chỉ dặn” diễn đạt tự nhiên ý συντάσσω trong ngữ cảnh mà không tạo cảm giác lặp hoặc cổ.
