  text: καὶ ἐποίησαν οἱ μαθηταὶ ὡς συνέταξεν αὐτοῖς ὁ Ἰησοῦς, καὶ ἡτοίμασαν τὸ πάσχα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/019.yaml
  text: And the disciples did as Jesus had directed them[a], and they prepared the Passover.
translation:
  language: vi
  text: Các môn đệ đã làm theo điều Giê-su đã chỉ dặn họ, rồi chuẩn bị lễ Vượt Qua.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “bữa ăn Vượt Qua”; từ Hy Lạp πάσχα có thể chỉ việc cử hành lễ Vượt Qua nói chung, kể cả bữa ăn được chuẩn bị cho dịp ấy.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐποίησαν
  choice: làm theo
  rationale: Trong kết cấu với ὡς συνέταξεν, động từ mang nghĩa thực hiện theo điều đã được chỉ dẫn; “làm theo” tự nhiên và rõ nghĩa trong tiếng Việt.
- source_word: οἱ μαθηταὶ
  choice: các môn đồ
  rationale: Cách gọi quen thuộc trong văn phong Kinh Thánh tiếng Việt, diễn tả những người theo học và gắn bó với Đức Giê-su.
- source_word: ὡς
  choice: theo
  rationale: 'Diễn đạt sự phù hợp với chỉ thị: họ làm đúng theo điều Đức Giê-su đã dặn.'
- source_word: συνέταξεν
  choice: đã truyền dặn
  rationale: συντάσσω ở đây có nghĩa ra chỉ thị hoặc căn dặn. “Truyền dặn” giữ được thẩm quyền của Đức Giê-su mà không tạo sắc thái gay gắt quá mức.
- source_word: ἡτοίμασαν
  choice: chuẩn bị
  rationale: Cách dịch trực tiếp, tự nhiên của ἑτοιμάζω trong ngữ cảnh chuẩn bị cho lễ và bữa ăn.
- source_word: τὸ πάσχα
  choice: lễ Vượt Qua
  rationale: πάσχα có thể chỉ lễ Vượt Qua nói chung, bữa ăn lễ hoặc lễ vật liên quan. “Lễ Vượt Qua” giữ phạm vi rộng của từ Hy Lạp; chú thích nêu nghĩa cụ thể hơn có thể phù hợp trong ngữ cảnh.
- source_word: ὁ Ἰησοῦς
  choice: Đức Giê-su
  rationale: Dạng tên riêng theo quy ước tiếng Việt hiện đại; “Đức” duy trì giọng văn kính trọng, trang nghiêm.
theological_decisions:
- issue: Phạm vi nghĩa của τὸ πάσχα
  choice: lễ Vượt Qua
  alternative: bữa ăn lễ Vượt Qua; chiên lễ Vượt Qua
  rationale: Ngữ cảnh hướng đến việc chuẩn bị bữa ăn, nhưng danh từ Hy Lạp không tự nó giới hạn nghĩa vào bữa ăn hay con sinh tế. Bản văn chính giữ cách nói rộng, còn chú thích bảo tồn khả năng chỉ bữa ăn.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang nghiêm nhưng dễ hiểu. Cấu trúc câu gọn và tự nhiên; thuật ngữ “môn đồ” và “lễ Vượt Qua” duy trì tính liên tục với cách dùng Kinh Thánh phổ biến.
