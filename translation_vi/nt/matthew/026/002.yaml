revisions:
- from: Anh em biết rằng sau hai ngày nữa là lễ Vượt Qua, và Con Người sẽ bị nộp để chịu đóng đinh vào thập tự giá.[a]
  to: Anh em biết rằng sau hai ngày nữa là lễ Vượt Qua, và Con Người sẽ bị giao nộp để bị đóng đinh trên thập tự giá.[a]
  rationale: Đổi «bị nộp» thành «bị giao nộp» để diễn đạt παραδίδοται rõ và tự nhiên hơn, vẫn bảo toàn nghĩa rộng của động từ. Đổi «chịu đóng đinh vào thập tự giá» thành «bị đóng đinh trên thập tự giá» để sửa cách kết hợp từ và phản ánh chính xác động từ thụ động σταυρωθῆναι. Chú thích được giữ để nêu phương án «bị phản bội» mà không áp đặt cách hiểu hẹp.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T05:44:34Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch phản ánh đúng các thành tố chính: lời nói ở ngôi thứ hai số nhiều, mốc thời gian sắp đến, lễ Vượt Qua, danh xưng «Con Người», và nghĩa rộng của παραδίδοται là bị giao/nộp thay vì chỉ «bị phản bội». Tuy nhiên, «chịu đóng đinh vào thập tự giá» dùng giới từ không tự nhiên và không chính xác bằng cách nói đóng đinh «trên» thập tự giá.'
  naturalness: «Anh em biết rằng sau hai ngày nữa là lễ Vượt Qua» là tiếng Việt hiện đại, tự nhiên trong ngữ cảnh Chúa nói với các môn đồ. Cụm cuối nên đổi thành «để bị đóng đinh trên thập tự giá»; cách này rõ ràng, trang trọng, và phù hợp cách dùng Kinh Thánh tiếng Việt.
  terminology: «lễ Vượt Qua», «Con Người», và «thập tự giá» được dùng nhất quán và phù hợp. «Bị nộp» giữ được tính bao quát của παραδίδοται, nhưng «bị giao nộp» tự nhiên hơn khi đứng độc lập và làm rõ nghĩa mà không thu hẹp thành phản bội.
  issues:
  - severity: medium
    issue: Cụm «chịu đóng đinh vào thập tự giá» không tự nhiên và dùng sai/không chuẩn giới từ trong tiếng Việt hiện đại.
    rationale: σταυρωθῆναι có nghĩa là «bị đóng đinh/crucified»; tiếng Việt thường nói «bị đóng đinh trên thập tự giá», không phải «vào thập tự giá». Dạng thụ động cũng phản ánh trực tiếp hơn động từ nguyên mẫu thụ động Hy Lạp.
