source:
  edition: SBLGNT
  text: Οἴδατε ὅτι μετὰ δύο ἡμέρας τὸ πάσχα γίνεται, καὶ ὁ υἱὸς τοῦ ἀνθρώπου παραδίδοται εἰς τὸ σταυρωθῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/002.yaml
  text: You know that after two days the Passover is coming[a], and the Son of Man is being handed over to be crucified.
translation:
  language: vi
  text: Anh em biết rằng sau hai ngày nữa là lễ Vượt Qua, và Con Người sẽ bị giao nộp để bị đóng đinh trên thập tự giá.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “sẽ bị phản bội.” Động từ Hy Lạp có thể chỉ sự phản bội, nhưng nghĩa rộng hơn là “bị giao nộp” hoặc “bị trao vào tay người khác.”'
    reason: alternative_reading
lexical_decisions:
- source_word: Οἴδατε
  choice: Anh em biết
  rationale: Động từ ngôi thứ hai số nhiều, dạng hoàn thành nhưng mang nghĩa hiện tại; “anh em biết” tự nhiên trong lời Chúa Giê-su nói với các môn đồ.
- source_word: μετὰ δύο ἡμέρας
  choice: sau hai ngày nữa
  rationale: Giữ ý thời gian của μετά với đối cách (“sau hai ngày”), đồng thời thêm “nữa” để câu tiếng Việt tự nhiên và diễn tả thời điểm sắp đến.
- source_word: τὸ πάσχα
  choice: lễ Vượt Qua
  rationale: Cách gọi đã quen thuộc trong tiếng Việt; “lễ” làm rõ đây là kỳ lễ mà không diễn giải quá mức.
- source_word: γίνεται
  choice: là
  rationale: Trong cấu trúc chỉ thời điểm của kỳ lễ, “sau hai ngày nữa là lễ Vượt Qua” là cách diễn đạt tiếng Việt tự nhiên, chuyển tải việc lễ ấy sắp diễn ra.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Con Người
  rationale: Giữ danh xưng tự chỉ quen thuộc của Chúa Giê-su cùng âm hưởng Kinh Thánh và ý nghĩa thần học của nó.
- source_word: παραδίδοται
  choice: sẽ bị nộp
  rationale: Hiện tại thụ động có sắc thái tương lai gần trong lời tiên báo. “Bị nộp” giữ nghĩa rộng của παραδίδωμι, không thu hẹp thành riêng hành vi phản bội.
- source_word: εἰς τὸ σταυρωθῆναι
  choice: để chịu đóng đinh vào thập tự giá
  rationale: Cấu trúc εἰς với động từ nguyên mẫu có mạo từ diễn tả mục đích hoặc kết quả; bản dịch nói rõ mục đích của việc bị nộp.
theological_decisions:
- issue: Cách dịch παραδίδοται trong lời tiên báo thương khó
  choice: sẽ bị nộp
  alternative: sẽ bị phản bội
  rationale: Bối cảnh có sự phản bội của Giu-đa, nhưng động từ Hy Lạp rộng hơn, có thể chỉ việc giao nộp hoặc trao vào tay người khác. “Bị nộp” duy trì sự căng thẳng giữa hành động phản bội của con người và việc Con Người được trao nộp trong diễn tiến thương khó.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh em” cho đại từ số nhiều hướng đến các môn đồ; giữ danh xưng “Con Người” và thuật ngữ quen thuộc “lễ Vượt Qua”, “thập tự giá”.
