  naturalness: “Vì người phụ nữ này đổ dầu thơm lên thân thể tôi là để…” có thể hiểu được, nhưng chưa tự nhiên trong văn phong Việt hiện đại trang trọng. Dùng mệnh đề thời gian và “đã làm điều đó” rõ ràng, mạch lạc hơn.
  terminology: “Dầu thơm,” “thân thể,” và “mai táng” phù hợp ngữ cảnh và văn phong. “Chuẩn bị cho việc mai táng tôi” diễn đạt thận trọng sắc thái của ἐνταφιάζω mà không thêm diễn giải giáo lý.
