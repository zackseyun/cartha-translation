base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/012.yaml
  text: For when she poured this perfume on my body[b][a], she did it to prepare me for burial.
translation:
  language: vi
  text: Vì khi người phụ nữ này đã đổ dầu thơm này lên thân thể tôi, bà đã làm điều đó để chuẩn bị cho việc mai táng tôi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch gọn: “cho việc mai táng tôi”; động từ Hy Lạp bao hàm ý chuẩn bị thi thể để an táng.'
    reason: lexical_alternative
lexical_decisions:
- source_word: βαλοῦσα
  choice: đổ
  rationale: Phân từ bất định quá khứ của βάλλω trong ngữ cảnh này chỉ việc đổ hoặc thoa dầu thơm, chứ không mang nghĩa đen là ném.
- source_word: γὰρ
  choice: Vì
  rationale: γάρ mở đầu lời giải thích của Chúa Giê-su về ý nghĩa hành động của người phụ nữ.
- source_word: αὕτη
  choice: người phụ nữ này
  rationale: Đại từ chỉ định giống cái được diễn đạt rõ để giữ sắc thái chỉ trực tiếp đến người phụ nữ đang được nói tới.
- source_word: μύρον
  choice: dầu thơm
  rationale: μύρον chỉ loại dầu hoặc thuốc thơm dùng để xức; “dầu thơm” tự nhiên trong tiếng Việt và phù hợp với vật chất được đổ lên thân thể.
- source_word: ἐπὶ τοῦ σώματός μου
  choice: lên thân thể tôi
  rationale: ἐπί với sở hữu cách ở đây diễn tả sự tiếp xúc trên bề mặt; cách nói này rõ ràng và tự nhiên.
- source_word: πρὸς τὸ ἐνταφιάσαι με
  choice: để chuẩn bị mai táng tôi
  rationale: πρός với động từ nguyên mẫu có mạo từ diễn tả mục đích; ἐνταφιάζω bao hàm việc chuẩn bị thi thể để an táng, không chỉ riêng hành động chôn.
- source_word: ἐποίησεν
  choice: là để
  rationale: Cấu trúc tiếng Việt “đổ… là để…” diễn đạt tự nhiên hành động chính và mục đích của nó, tránh lặp vụng về “cô ấy đã làm điều đó” mà vẫn giữ quan hệ cú pháp.
theological_decisions:
- issue: Ý nghĩa của ἐνταφιάζω liên quan đến cái chết của Chúa Giê-su
  choice: Hành động của người phụ nữ được Chúa Giê-su giải thích là sự chuẩn bị cho việc mai táng ngài.
  alternative: Hành động chỉ được nói chung là “cho việc mai táng tôi”, không nêu rõ ý chuẩn bị.
  rationale: Nghĩa từ vựng của ἐνταφιάζω liên quan đến việc sửa soạn thi thể để an táng. Bản dịch giữ ý báo trước về việc mai táng mà không thêm một kết luận thần học ngoài câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “dầu thơm” thay vì “nước hoa” để phản ánh đúng loại dầu hoặc thuốc thơm trong bối cảnh; giữ “thân thể” và “mai táng” để phù hợp sắc thái trang nghiêm của lời báo trước về cái chết.
