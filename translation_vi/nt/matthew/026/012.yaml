- from: Vì người phụ nữ này đổ dầu thơm lên thân thể tôi là để chuẩn bị mai táng tôi.[a]
  to: Vì khi người phụ nữ này đã đổ dầu thơm này lên thân thể tôi, bà đã làm điều đó để chuẩn bị cho việc mai táng tôi.[a]
