id: MAT.26.48
reference: Matthew 26:48
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὁ δὲ παραδιδοὺς αὐτὸν ἔδωκεν αὐτοῖς σημεῖον λέγων· Ὃν ἂν φιλήσω αὐτός ἐστιν· κρατήσατε αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/048.yaml
  text: The one betraying him had given them a sign[a], saying, “The one I kiss is he[b]; seize him.”
translation:
  language: vi
  text: 'Kẻ phản bội Ngài đã cho họ một dấu hiệu[a], nói: “Tôi hôn ai thì chính là người đó; hãy bắt giữ người ấy.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Kẻ giao nộp Ngài.” Động từ Hy Lạp có nghĩa là “giao nộp,” nhưng trong ngữ cảnh này nói đến hành động phản bội của Giu-đa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παραδιδοὺς
  choice: kẻ phản bội
  rationale: Trong trình thuật thương khó, động từ này không chỉ nói đến việc giao nộp theo nghĩa trung tính mà chỉ hành động phản bội của Giu-đa; cách dịch này truyền đạt đúng sắc thái đạo đức trong ngữ cảnh.
- source_word: σημεῖον
  choice: dấu hiệu
  rationale: Ở đây từ này chỉ dấu hiệu nhận diện đã được thỏa thuận trước; “dấu hiệu” vừa sát nghĩa vừa tự nhiên trong tiếng Việt.
- source_word: Ὃν ἂν φιλήσω
  choice: Tôi hôn ai
  rationale: Cách diễn đạt tự nhiên trong tiếng Việt, giữ được tính bất định về người sẽ được nhận diện của mệnh đề quan hệ Hy Lạp.
- source_word: φιλήσω
  choice: hôn
  rationale: Động từ chỉ trực tiếp hành động hôn dùng làm dấu hiệu nhận diện; không cần thêm ý “chào bằng một nụ hôn” vốn không được nói rõ.
- source_word: αὐτός ἐστιν
  choice: chính là người đó
  rationale: Giữ sắc thái nhấn mạnh nhận diện của αὐτός và tự nhiên hơn lối dịch từng chữ trong tiếng Việt.
- source_word: κρατήσατε
  choice: hãy bắt giữ
  rationale: Diễn đạt việc khống chế và giữ chặt trong bối cảnh bắt Chúa Giê-su, nhưng không thêm chi tiết thủ tục pháp lý.
theological_decisions:
- issue: Sắc thái đạo đức của παραδιδοὺς khi nói về Giu-đa
  choice: Dịch là “kẻ phản bội”
  alternative: “người giao nộp Ngài”
  rationale: Ngữ cảnh trực tiếp của cuộc thương khó cho thấy đây là hành vi phản bội. Tuy vậy, nghĩa căn bản “giao nộp” được giữ trong chú thích để bảo tồn khả năng từ vựng của nguyên ngữ.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” để chỉ Chúa Giê-su; câu nói trực tiếp dùng cấu trúc tự nhiên “Tôi hôn ai thì chính là người đó.” Chỉ đặt một chú thích đúng với điểm đa nghĩa thực sự trong nguyên văn; không gắn chú thích vào αὐτός ἐστιν vì đó không phải vị trí của phương án “signal” trong dữ liệu tiếng Anh.
