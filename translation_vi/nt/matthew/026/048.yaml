  source_fidelity: 'Bản dịch truyền đạt chính xác các thành tố chính của nguyên văn: ὁ δὲ παραδιδοὺς αὐτόν là “Kẻ phản bội Ngài”; ἔδωκεν αὐτοῖς σημεῖον là “đã cho họ một dấu hiệu”; mệnh đề bất định Ὃν ἂν φιλήσω được diễn đạt tự nhiên bằng “Tôi hôn ai”; αὐτός ἐστιν giữ được sắc thái nhận diện/nhấn mạnh trong “chính là người đó”; và κρατήσατε αὐτόν được chuyển đúng ngữ cảnh bằng “hãy bắt giữ người ấy.”'
  naturalness: Tiếng Việt hiện đại, rõ ràng và trang trọng. Cấu trúc lời nói trực tiếp “Tôi hôn ai thì chính là người đó” tự nhiên, không gượng ép theo cú pháp Hy Lạp. Đại từ “Ngài” phù hợp với văn phong bản dịch Kinh Thánh trang trọng.
  terminology: “Kẻ phản bội” phản ánh đúng lực ngữ cảnh của παραδιδοὺς trong trình thuật về Giu-đa, đồng thời chú thích nêu phương án từ vựng trung tính hơn là “giao nộp.” “Dấu hiệu” là lựa chọn sát nghĩa và tự nhiên cho σημεῖον; “bắt giữ” phù hợp với hành động khống chế trong bối cảnh bắt Chúa Giê-su.
