id: MAT.26.45
reference: Matthew 26:45
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: τότε ἔρχεται πρὸς τοὺς ⸀μαθητὰς καὶ λέγει αὐτοῖς· Καθεύδετε ⸀τὸ λοιπὸν καὶ ἀναπαύεσθε· ἰδοὺ ἤγγικεν ἡ ὥρα καὶ ὁ υἱὸς τοῦ ἀνθρώπου παραδίδοται εἰς χεῖρας ἁμαρτωλῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/045.yaml
  text: Then he comes to the disciples and says to them[a], “Sleep on now and take your rest. Look, the hour has drawn near[c][b], and the Son of Man is being handed over into the hands of sinners.”
translation:
  language: vi
  text: 'Bấy giờ, Ngài đến với các môn đồ và nói với họ: “Bây giờ cứ ngủ tiếp và nghỉ đi[a]. Kìa, giờ đã gần kề[b], và Con Người đang bị trao nộp vào tay những kẻ tội lỗi[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “Các ông vẫn còn ngủ và nghỉ sao?” Câu Hy Lạp có thể được hiểu là một câu hỏi tu từ; cách dịch trong chính văn giữ lại sắc thái mỉa mai và sự không dứt khoát của câu nói.'
    reason: alternative_reading
  - marker: b
    text: 'Hoặc: “giờ đã đến” hay “giờ đã đến gần.”'
    reason: lexical_alternative
  - marker: c
    text: 'Hoặc: “đang bị phản bội.” Từ Hy Lạp có nghĩa rộng hơn là “bị trao nộp” hoặc “bị giao nộp.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Bấy giờ
  rationale: Liên từ thời gian dẫn sang sự việc kế tiếp; cách diễn đạt tự nhiên, trang trọng trong văn thuật chuyện.
- source_word: ἔρχεται πρὸς τοὺς μαθητάς
  choice: Ngài đến chỗ các môn đồ
  rationale: Chuyển động hướng đến các môn đồ được diễn đạt tự nhiên bằng “đến chỗ”; tiếng Việt không cần gượng ép giữ thì hiện tại lịch sử.
- source_word: λέγει αὐτοῖς
  choice: nói với họ
  rationale: Bản dịch trực tiếp, tự nhiên, không thêm sắc thái như ra lệnh hay trách mắng.
- source_word: Καθεύδετε τὸ λοιπὸν καὶ ἀναπαύεσθε
  choice: Bây giờ cứ ngủ tiếp và nghỉ đi
  rationale: Giữ hình thức bề mặt như lời cho phép hoặc mệnh lệnh mang tính mỉa mai, đồng thời “ngủ tiếp” thể hiện sắc thái tiếp diễn của τὸ λοιπὸν trong ngữ cảnh.
- source_word: ἰδοὺ
  choice: Kìa
  rationale: Từ gọi sự chú ý mang sắc thái trang trọng nhưng vẫn thông dụng trong tiếng Việt hiện đại.
- source_word: ἤγγικεν ἡ ὥρα
  choice: giờ đã đến gần
  rationale: Giữ nghĩa về sự gần kề của động từ hoàn thành ἤγγικεν mà không thu hẹp thành “đã đến”.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Con Người
  rationale: Danh xưng đã được xác lập trong Kinh Thánh, được dịch thay vì diễn giải.
- source_word: παραδίδοται
  choice: đang bị nộp
  rationale: Giữ nghĩa rộng của hành động trao nộp và thể bị động, không giới hạn ý nghĩa chỉ vào sự phản bội của Giu-đa.
- source_word: εἰς χεῖρας ἁμαρτωλῶν
  choice: vào tay những kẻ tội lỗi
  rationale: Giữ hình ảnh cụ thể “vào tay” của nguyên văn; “những kẻ tội lỗi” chỉ những người thực hiện việc bắt giữ mà không bổ sung căn tính của họ.
theological_decisions:
- issue: Sắc thái của Καθεύδετε ... καὶ ἀναπαύεσθε
  choice: 'Dịch như một lời cho phép hoặc mệnh lệnh có sắc thái mỉa mai: “Bây giờ cứ ngủ tiếp và nghỉ đi.”'
  alternative: 'Có thể hiểu là câu hỏi tu từ: “Các con vẫn còn ngủ và nghỉ sao?”'
  rationale: Hình thức Hy Lạp và ngữ cảnh cho phép nhiều cách hiểu. Bản chính giữ sự căng thẳng và sắc thái mỉa mai có thể có, thay vì dứt khoát biến câu này thành câu hỏi.
- issue: Ý nghĩa của παραδίδοται trong trình thuật thương khó
  choice: đang bị nộp
  alternative: đang bị phản bội
  rationale: “Bị nộp” bảo toàn phạm vi nghĩa rộng hơn của động từ, bao gồm sự phản bội và việc bị giao vào quyền lực của những người bắt giữ, mà không áp đặt một cách giải thích thần học hẹp hơn.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Ngài” cho đại từ thuật chuyện về Chúa Giê-su, “môn đồ” theo thuật ngữ Kinh Thánh quen thuộc, đồng thời tránh lối diễn đạt cổ như “nầy” hoặc “hãy xem”.
