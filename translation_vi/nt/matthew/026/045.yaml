- from: 'Bấy giờ, Ngài đến chỗ các môn đồ và nói với họ: “Bây giờ cứ ngủ tiếp và nghỉ đi[a]. Kìa, giờ đã đến gần[b], và Con Người đang bị nộp vào tay những kẻ tội lỗi[c].”'
