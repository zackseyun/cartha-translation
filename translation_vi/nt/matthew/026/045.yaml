review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch nhìn chung bám sát SBLGNT: giữ được diễn tiến tự sự, danh xưng “Con Người,” thể bị động của παραδίδοται, và thành ngữ “vào tay.” Tuy nhiên, “đang bị nộp” kém rõ trong tiếng Việt hiện đại và chưa diễn đạt đầy đủ nét ‘trao/giao nộp’ của παραδίδοται; “đang bị trao nộp” sát nghĩa và tự nhiên hơn. “Giờ đã đến gần” cũng hơi gượng; “giờ đã gần kề” diễn đạt tự nhiên ý ἤγγικεν mà không biến nó thành “đã đến.”'
  naturalness: Văn phong trang trọng, dễ đọc. “Ngài đến chỗ các môn đồ” chấp nhận được, nhưng “đến với các môn đồ” tự nhiên hơn trong ngữ cảnh Ngài trở lại chỗ họ. Câu hỏi thay thế trong chú thích không nên thêm cách xưng hô “các con,” vì nguyên văn chỉ nói với các môn đệ; “các ông” trung tính hơn trong ngữ cảnh thuật chuyện.
  terminology: Giữ “môn đồ,” “Con Người,” và “những kẻ tội lỗi” là nhất quán với phong cách Kinh Thánh tiếng Việt. Dùng “trao nộp” cho παραδίδοται giúp bảo toàn phạm vi nghĩa rộng hơn “phản bội,” đồng thời vẫn giữ thể bị động.
  issues:
  - severity: medium
    issue: “đang bị nộp” chưa đủ rõ và chưa chuyển tải tự nhiên động từ παραδίδοται.
    rationale: παραδίδοται có nghĩa là ‘được trao/giao nộp, bị bàn giao’; “đang bị trao nộp” vừa rõ nghĩa vừa không thu hẹp thành hành vi phản bội.
  - severity: low
    issue: “giờ đã đến gần” hơi không tự nhiên trong tiếng Việt hiện đại.
    rationale: “Giờ đã gần kề” là cách nói tự nhiên, vẫn giữ ý giờ ấy đã tiến đến gần, không khẳng định nó đã thực sự xảy đến.
  - severity: low
    issue: Chú thích a dùng “Các con,” thêm sắc thái xưng hô không có trong nguyên văn.
    rationale: Nên dùng “Các ông” hoặc không nêu đại từ để chú thích chỉ phản ánh khả năng câu hỏi tu từ của tiếng Hy Lạp.
