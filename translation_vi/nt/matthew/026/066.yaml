  text: τί ὑμῖν δοκεῖ; οἱ δὲ ἀποκριθέντες εἶπαν· Ἔνοχος θανάτου ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/066.yaml
  text: What do you think? They answered[a], “He is deserving of death.”
translation:
  language: vi
  text: '“Các ông nghĩ sao?” Họ đáp[a]: “Người đáng chết.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Người có tội đáng chết” hoặc “Người phải chịu án tử hình.” Cụm từ Hy Lạp là một lời tuyên án mang tính pháp lý.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τί ὑμῖν δοκεῖ
  choice: Các ông nghĩ sao?
  rationale: Cụm δοκέω với đại từ ở cách dữ cách hỏi trực tiếp về ý kiến hay phán quyết. Cách dịch này tự nhiên trong tiếng Việt hiện đại và giữ nguyên lực của câu hỏi.
- source_word: οἱ δὲ ἀποκριθέντες εἶπαν
  choice: Họ đáp
  rationale: Kết cấu phân từ ἀποκριθέντες đi với εἶπαν là lối kể chuyện quen thuộc, được chuyển thành một động từ hữu hạn tự nhiên trong tiếng Việt. δέ chỉ có tính nối nhẹ nên không nhất thiết phải dịch riêng.
- source_word: ἔνοχος
  choice: đáng phải
  rationale: Trong ngữ cảnh xét xử và khi đi với θανάτου, ἔνοχος diễn tả tình trạng bị xem là có tội, phải chịu hoặc đáng nhận án tử hình. “Đáng phải” truyền đạt rõ lời tuyên án, còn các sắc thái pháp lý khác được ghi ở chú thích.
- source_word: θανάτου
  choice: chết
  rationale: Sở hữu cách θανάτου đi với ἔνοχος chỉ sự chịu trách nhiệm pháp lý dẫn đến cái chết; “đáng phải chết” là cách nói gọn và tự nhiên trong tiếng Việt.
- source_word: ἐστίν
  choice: Hắn ...
  rationale: Động từ nối cùng chủ ngữ ngầm được thể hiện bằng đại từ “Hắn” trong tiếng Việt. Đại từ này phù hợp với lời kết án mang sắc thái khinh miệt của các đối thủ trong ngữ cảnh, nhưng không biến lời kể thành phán quyết của người dịch.
theological_decisions:
- issue: Tính pháp lý trong phán quyết của hội đồng
  choice: Hắn đáng phải chết
  alternative: Hắn có tội đáng chết; Hắn phải chịu án tử hình
  rationale: Bản dịch giữ đây là lời phán quyết của những người xét xử Chúa Giê-su, không khẳng định Ngài thực sự có tội trước Đức Chúa Trời và cũng không đưa giáo lý chuộc tội vào câu.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và dễ hiểu. “Các ông” thể hiện lời chất vấn hướng đến cả hội đồng; “Hắn” phản ánh thái độ của những người đang kết án. Dấu chú thích [a] được đặt ngay sau động từ dẫn lời.
