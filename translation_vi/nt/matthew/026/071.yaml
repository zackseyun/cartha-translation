  text: ἐξελθόντα ⸀δὲ εἰς τὸν πυλῶνα εἶδεν αὐτὸν ἄλλη καὶ λέγει ⸀τοῖς ἐκεῖ· ⸀Οὗτος ἦν μετὰ Ἰησοῦ τοῦ Ναζωραίου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/071.yaml
  text: But when he had gone out to the gateway, another woman saw him and says to those there, “This man was with Jesus the Nazarene.”
translation:
  language: vi
  text: 'Nhưng khi ông đi ra phía cổng, một người phụ nữ khác thấy ông và nói với những người ở đó: “Người này đã ở với Giê-su người Na-xa-rét.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πυλών
  choice: cổng
  rationale: Chỉ khu vực cổng hoặc lối vào có mái; “phía cổng” tự nhiên trong tiếng Việt và không xác định quá mức cấu trúc kiến trúc.
- source_word: ἄλλη
  choice: một người phụ nữ khác
  rationale: Danh từ giống cái được lược trong Hy Lạp nhưng ngữ cảnh cho thấy một phụ nữ khác, thường được hiểu là một nữ tỳ khác.
- source_word: λέγει
  choice: nói
  rationale: Giữ thì hiện tại lịch sử của bản Hy Lạp bằng hình thức tiếng Việt không đánh dấu thì, tạo sắc thái kể chuyện trực tiếp mà không gượng ép.
- source_word: Ἰησοῦ τοῦ Ναζωραίου
  choice: Giê-su người Na-xa-rét
  rationale: Diễn đạt danh xưng địa lý tự nhiên, sát nghĩa “Jesus the Nazarene”.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Đại từ “ông” chỉ Phi-e-rơ theo ngữ cảnh; câu trực tiếp dùng “người này” để phản ánh sắc thái chỉ người của οὗτος.
