source:
  edition: SBLGNT
  text: οἱ δὲ ἀρχιερεῖς ⸀καὶ τὸ συνέδριον ὅλον ἐζήτουν ψευδομαρτυρίαν κατὰ τοῦ Ἰησοῦ ὅπως ⸂αὐτὸν θανατώσωσιν⸃,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/059.yaml
  text: The chief priests and the whole council were seeking false testimony against Jesus so that they might put him to death[b][a],
translation:
  language: vi
  text: Các thượng tế và toàn thể Hội đồng[a] đang tìm lời chứng gian dối[b] chống lại Đức Giê-su để giết Người.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “toàn thể Tòa Công luận”. Từ Hy Lạp chỉ hội đồng lãnh đạo của người Do Thái.
    reason: cultural_note
  - marker: b
    text: Hay “chứng gian”. Từ Hy Lạp có thể chỉ lời chứng gian dối hoặc việc làm chứng gian trong bối cảnh pháp lý.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: không dịch thành từ riêng
  rationale: Đây là liên từ chuyển tiếp nhẹ trong mạch kể; tiếng Việt không cần thêm “bấy giờ” hay “nhưng”, vì những từ ấy dễ tạo sắc thái thời gian hoặc tương phản mạnh hơn nguyên văn.
- source_word: ἀρχιερεῖς
  choice: các thượng tế
  rationale: Cách gọi quen thuộc, chính xác cho giới lãnh đạo tư tế cấp cao; không hàm ý rằng tất cả đều đồng thời giữ chức thượng tế duy nhất.
- source_word: συνέδριον ὅλον
  choice: toàn thể Hội đồng
  rationale: Diễn đạt cơ quan lãnh đạo Do Thái bằng từ dễ hiểu; “toàn thể” phản ánh ὅλον và nói đến cả hội đồng với tư cách một tập thể.
- source_word: ἐζήτουν
  choice: đang tìm
  rationale: Thể chưa hoàn thành biểu thị một nỗ lực đang tiếp diễn trong bối cảnh câu chuyện.
- source_word: ψευδομαρτυρίαν
  choice: lời chứng gian dối
  rationale: Phù hợp bối cảnh pháp lý và chỉ nội dung lời khai; nguyên ngữ cũng có thể được hiểu là “chứng gian”.
- source_word: κατὰ τοῦ Ἰησοῦ
  choice: chống lại Đức Giê-su
  rationale: κατά với sở hữu cách diễn tả sự chống đối nhắm vào Đức Giê-su trong tiến trình xét xử.
- source_word: ὅπως
  choice: để
  rationale: Giữ rõ ý mục đích bằng cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: αὐτὸν θανατώσωσιν
  choice: có thể kết án tử hình Người
  rationale: Trong bối cảnh xét xử, cách dịch này truyền đạt mục tiêu dùng lời chứng để đưa Đức Giê-su đến án tử hình; vẫn giữ sắc thái pháp lý của hành động làm cho Người phải chết.
theological_decisions:
- issue: Sắc thái pháp lý trong ý định của các nhà lãnh đạo
  choice: Diễn tả việc họ đang tìm lời chứng gian dối nhằm có thể kết án tử hình Đức Giê-su.
  alternative: “tìm chứng gian để giết Người” hoặc “để xử tử Người”
  rationale: Thể chưa hoàn thành ἐζήτουν cùng mệnh đề mục đích ὅπως...θανατώσωσιν cho thấy một sự vận động pháp lý có chủ ý và đang tiếp diễn. Bản dịch giữ sức nặng đạo đức và pháp lý ấy mà không thêm bình luận giáo lý.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Giê-su/Người” theo lối diễn đạt Kinh Thánh tiếng Việt phổ thông; các dấu chú thích [a], [b] được đặt ngay sau cụm từ liên quan.
