revisions:
- from: Các thượng tế và toàn thể Hội đồng[a] đang tìm lời chứng gian dối[b] chống lại Đức Giê-su để có thể kết án tử hình Người.
  to: Các thượng tế và toàn thể Hội đồng[a] đang tìm lời chứng gian dối[b] chống lại Đức Giê-su để giết Người.
  rationale: Thay “để có thể kết án tử hình Người” bằng “để giết Người” để phản ánh trực tiếp động từ θανατώσωσιν và mệnh đề mục đích ὅπως, mà không thêm hành động tuyên án. Các thành phần khác và toàn bộ hệ chú thích được giữ nguyên vì phù hợp với nguyên văn và cách dùng tiếng Việt hiện đại.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T05:45:13Z'
review_pass:
  verdict: revise
  source_fidelity: Cần sửa mệnh đề mục đích. θανατώσωσιν có nghĩa là “giết/đưa đến chỗ chết, xử tử,” chứ không trực tiếp là “kết án tử hình”; bản hiện tại thêm hành vi tuyên án vốn không được nêu trong tiếng Hy Lạp. “Để giết Người” giữ đúng mục đích được diễn tả, không áp đặt thủ tục pháp lý cụ thể.
  naturalness: Câu sửa vẫn tự nhiên, trang trọng và phù hợp văn phong Kinh Thánh tiếng Việt hiện đại. “Các thượng tế,” “toàn thể Hội đồng,” và “lời chứng gian dối” đều rõ nghĩa trong ngữ cảnh.
  terminology: Giữ “các thượng tế” cho ἀρχιερεῖς và chú thích “Tòa Công luận” cho συνέδριον. “Lời chứng gian dối” phản ánh ψευδομαρτυρίαν; chú thích cung cấp phương án ngắn gọn “chứng gian.”
  issues:
  - severity: high
    issue: “để có thể kết án tử hình Người” dịch αὐτὸν θανατώσωσιν quá cụ thể và sai trọng tâm hành động.
    rationale: Động từ θανατόω nói đến việc làm chết/giết/đưa đến cái chết. Dù bối cảnh là xét xử, nguyên văn không nói họ “kết án” Người; cách dịch hiện tại thêm một bước tố tụng và làm giảm mục đích trực tiếp là giết Người.
  revised_text: Các thượng tế và toàn thể Hội đồng[a] đang tìm lời chứng gian dối[b] chống lại Đức Giê-su để giết Người.
