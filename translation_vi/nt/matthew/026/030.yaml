  source_fidelity: Bản dịch truyền đạt đúng quan hệ thời gian của phân từ ὑμνήσαντες (“Sau khi hát…”), hành động chính ἐξῆλθον (“họ đi ra”), và hướng đến địa danh εἰς τὸ Ὄρος τῶν Ἐλαιῶν (“núi Ô-liu”). Cách dùng số ít không xác định trong “hát thánh ca” tự nhiên trong tiếng Việt và không buộc xác định số lượng bài hát.
