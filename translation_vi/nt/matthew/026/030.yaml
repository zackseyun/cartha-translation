id: MAT.26.30
reference: Matthew 26:30
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ὑμνήσαντες ἐξῆλθον εἰς τὸ Ὄρος τῶν Ἐλαιῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/030.yaml
  text: And after singing a hymn[a], they went out to the Mount of Olives.
translation:
  language: vi
  text: Sau khi hát thánh ca[a], họ đi ra núi Ô-liu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “hát ngợi khen”. Động từ Hy Lạp có thể chỉ chung việc hát lời ngợi khen, dù “hát thánh ca” phù hợp với bối cảnh bữa ăn ngay trước đó và cách dùng thông thường.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμνήσαντες
  choice: sau khi hát thánh ca
  rationale: Phân từ bất định quá khứ chủ động của ὑμνέω diễn tả việc hát lời ca ngợi xảy ra trước hành động chính. “Hát thánh ca” tự nhiên trong tiếng Việt và phù hợp với bối cảnh bữa ăn, nhưng chú thích vẫn giữ nghĩa rộng hơn là hát ngợi khen.
- source_word: ἐξῆλθον
  choice: họ đi ra
  rationale: Động từ ἐξέρχομαι ở đây mang nghĩa trực tiếp là đi ra; cách dịch này giản dị, tự nhiên và không thêm sắc thái mà nguyên văn không nêu.
- source_word: εἰς τὸ Ὄρος τῶν Ἐλαιῶν
  choice: ra núi Ô-liu
  rationale: εἰς chỉ hướng chuyển động đến nơi ấy; trong tiếng Việt, “đi ra núi Ô-liu” diễn đạt tự nhiên theo ngữ cảnh. “Núi Ô-liu” là địa danh quen dùng, tương ứng với nghĩa đen “Núi Cây Ô-liu”.
- source_word: καὶ
  choice: sau khi …,
  rationale: Quan hệ nối tiếp của καὶ cùng phân từ chỉ hành động đi trước được diễn đạt tự nhiên bằng cấu trúc “Sau khi…, họ…”, không cần thêm một liên từ mở đầu gượng ép trong tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “họ” theo mạch kể chuyện; giữ địa danh quen thuộc “núi Ô-liu”. Dấu chú thích [a] được đặt ngay sau cụm từ liên quan.
