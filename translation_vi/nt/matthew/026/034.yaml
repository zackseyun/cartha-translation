base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/034.yaml
  text: Jesus said to him, “Truly I tell you, in this very night, before a rooster crows, you will deny me three times.”
translation:
  language: vi
  text: 'Giê-su nói với ông: “Quả thật, tôi nói với anh: ngay đêm nay,[a] trước khi gà gáy,[b] anh sẽ chối bỏ tôi ba lần.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “chính trong đêm nay.” Tiếng Hy Lạp là “trong đêm này,” với ý nhấn mạnh ở từ “này.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “trước khi một con gà gáy.” Tiếng Hy Lạp không có mạo từ ở đây.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφη αὐτῷ ὁ Ἰησοῦς
  choice: Đức Giê-su nói với ông
  rationale: Dùng động từ kể chuyện tự nhiên “nói”; “ông” làm rõ người được nói với mà không thêm tên không có trong câu Hy Lạp.
- source_word: Ἀμὴν λέγω σοι
  choice: Thật, tôi nói với anh
  rationale: Giữ công thức khẳng định trang trọng và lời xưng hô trực tiếp của Đức Giê-su; không để nguyên từ vay mượn “A-men” trong chính văn.
- source_word: ἐν ταύτῃ τῇ νυκτί
  choice: ngay đêm nay
  rationale: Cách nói tự nhiên trong tiếng Việt hiện đại, đồng thời “ngay” bảo toàn sắc thái nhấn mạnh của ταύτῃ.
- source_word: πρὶν ἀλέκτορα φωνῆσαι
  choice: trước khi gà gáy
  rationale: Diễn đạt tự nhiên cấu trúc nguyên mẫu Hy Lạp; danh từ không có mạo từ nên câu có thể được hiểu chung là tiếng gà gáy, không nhất thiết một con gà cụ thể.
- source_word: τρὶς
  choice: ba lần
  rationale: Tương đương trực tiếp, rõ ràng trong tiếng Việt hiện đại.
- source_word: ἀπαρνήσῃ με
  choice: anh sẽ chối tôi
  rationale: “Chối” là từ tự nhiên và quen thuộc trong ngữ cảnh Phi-e-rơ phủ nhận mối liên hệ với Đức Giê-su, không diễn giải mạnh hơn thành “từ bỏ” hay “đoạn tuyệt”.
theological_decisions:
- issue: Công thức mở đầu Ἀμὴν λέγω σοι
  choice: Thật, tôi nói với anh
  alternative: A-men, tôi nói với anh; Tôi quả quyết với anh
  rationale: Bảo toàn tính long trọng và thẩm quyền trực tiếp trong lời Đức Giê-su mà không du nhập sắc thái phụng vụ về sau hoặc diễn giải công thức này thành một lời bảo đảm.
- issue: Đối tượng của hành động ἀπαρνήσῃ
  choice: chối tôi
  alternative: không nhận tôi; chối bỏ tôi
  rationale: Giữ đối tượng trực tiếp “tôi” và sức căng của lời tiên báo, nhưng không làm động từ mạnh hơn mức văn bản đòi hỏi.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “Đức Giê-su” theo lối gọi kính trọng phổ biến; đại từ “tôi—anh” giữ tính trực tiếp của lời nói với một người nam trưởng thành. Các dấu chú thích [a], [b] đều xuất hiện trong chính văn.
