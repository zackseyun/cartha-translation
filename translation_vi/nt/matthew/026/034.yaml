  - severity: low
    issue: «Thật, tôi nói với anh» hơi gượng trong tiếng Việt hiện đại.
    rationale: «Quả thật, tôi nói với anh» bảo toàn chức năng khẳng định long trọng của Ἀμὴν λέγω σοι với cách diễn đạt thông dụng hơn.
  - severity: low
    issue: «Chối tôi» không phải là cách kết hợp tự nhiên nhất trong tiếng Việt hiện đại.
    rationale: «Chối bỏ tôi» là cách nói quen thuộc cho hành động ἀπαρνήσῃ με trong ngữ cảnh phủ nhận/khước từ một người, đồng thời không mở rộng thành một mô tả cụ thể như «chối là biết tôi».
