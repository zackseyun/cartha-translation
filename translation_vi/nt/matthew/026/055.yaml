  source_fidelity: 'Bản dịch phản ánh đầy đủ cấu trúc và ý chính của tiếng Hy Lạp: mốc thời gian tức thời, lời nói với đám đông, câu hỏi tu từ về việc họ đến có vũ trang để bắt Đức Giê-su như bắt một λῃστής, thói quen hằng ngày ngồi dạy trong khu Đền Thờ, và việc họ đã không bắt ngài khi đó. “Khuôn viên đền thờ” diễn đạt hợp lý ἱερόν là toàn khu phức hợp Đền Thờ, không chỉ nội điện.'
  naturalness: Văn tiếng Việt hiện đại, rõ và có nhịp điệu tự nhiên. “Các người mang gươm và gậy kéo đến bắt tôi ... sao?” giữ được sắc thái chất vấn đối đầu của câu hỏi tu từ. Cấu trúc “Ngày nào tôi cũng ... mà ...” diễn đạt tự nhiên lực lặp lại của καθ’ ἡμέραν và sự tương phản ở mệnh đề cuối.
  terminology: “Đức Giê-su,” “gươm,” “gậy,” “bắt,” và “đền thờ” nhất quán với văn phong Kinh Thánh Việt ngữ trang trọng vừa phải. “Tên cướp” là lựa chọn nghĩa rộng, không áp đặt nghĩa chính trị cho λῃστής; chú thích neo đúng chỗ và bảo lưu khả năng nghĩa kẻ cướp bạo lực hoặc kẻ nổi loạn.
