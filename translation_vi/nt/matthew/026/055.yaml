id: MAT.26.55
reference: Matthew 26:55
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐν ἐκείνῃ τῇ ὥρᾳ εἶπεν ὁ Ἰησοῦς τοῖς ὄχλοις· Ὡς ἐπὶ λῃστὴν ἐξήλθατε μετὰ μαχαιρῶν καὶ ξύλων συλλαβεῖν με; καθ’ ⸀ἡμέραν ⸂ἐν τῷ ἱερῷ ἐκαθεζόμην διδάσκων⸃ καὶ οὐκ ἐκρατήσατέ με.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/055.yaml
  text: At that hour Jesus said to the crowds[a], “Have you come out with swords and clubs to arrest me, as against a robber? Day after day I was sitting in the temple teaching[b], and you did not seize me.”
translation:
  language: vi
  text: 'Ngay lúc ấy, Đức Giê-su nói với đám đông: “Các người mang gươm và gậy kéo đến bắt tôi như bắt một tên cướp[a] sao? Ngày nào tôi cũng ngồi giảng dạy trong khuôn viên đền thờ, mà các người không bắt tôi.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hy Lạp cũng có thể chỉ một kẻ cướp có vũ trang hoặc, trong một số ngữ cảnh, một kẻ nổi loạn.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἐκείνῃ τῇ ὥρᾳ
  choice: Ngay lúc ấy
  rationale: Diễn đạt tự nhiên trong tiếng Việt hiện đại, đồng thời giữ sắc thái tức thời của cụm chỉ thời gian.
- source_word: τοῖς ὄχλοις
  choice: với đám đông
  rationale: Danh từ Hy Lạp ở số nhiều, nhưng tiếng Việt thường dùng danh từ tập hợp “đám đông” tự nhiên hơn “các đám đông” trong cảnh này.
- source_word: Ὡς ἐπὶ λῃστὴν
  choice: như bắt một tên cướp
  rationale: Kết hợp tự nhiên với động từ “kéo đến bắt”, diễn tả việc họ đối xử với Đức Giê-su như với một tội phạm nguy hiểm mà không áp đặt riêng nghĩa chính trị.
- source_word: ἐξήλθατε
  choice: kéo đến
  rationale: Trong ngữ cảnh một toán người có vũ trang đến chỗ Đức Giê-su, “kéo đến” truyền đạt rõ hành động có tổ chức và mang tính đối đầu.
- source_word: μετὰ μαχαιρῶν καὶ ξύλων
  choice: mang gươm và gậy
  rationale: “Gươm” và “gậy” là cách gọi rõ, trang trọng vừa phải; ξύλα ở đây chỉ gậy gỗ dùng làm vũ khí.
- source_word: συλλαβεῖν με
  choice: bắt tôi
  rationale: “Bắt” tự nhiên và chính xác trong bối cảnh bắt giữ; không nhất thiết phải thêm sắc thái thủ tục pháp lý của “bắt giữ”.
- source_word: καθ’ ἡμέραν
  choice: Ngày nào ... cũng
  rationale: Cấu trúc tiếng Việt tự nhiên, giữ lực phân phối và ý nghĩa hành động lặp lại mỗi ngày.
- source_word: ἐν τῷ ἱερῷ
  choice: trong khuôn viên đền thờ
  rationale: ἱερόν chỉ toàn bộ khu đền thờ chứ không riêng nơi thánh bên trong; “khuôn viên đền thờ” làm rõ sự phân biệt này.
- source_word: ἐκαθεζόμην διδάσκων
  choice: ngồi giảng dạy
  rationale: Giữ hình ảnh Đức Giê-su ngồi và dạy, đồng thời diễn đạt gọn, tự nhiên; thì chưa hoàn thành được thể hiện qua cấu trúc thói quen “Ngày nào ... cũng”.
- source_word: οὐκ ἐκρατήσατέ με
  choice: các người không bắt tôi
  rationale: κρατέω ở đây là tóm/bắt lấy. Lặp lại “bắt” tự nhiên trong tiếng Việt và làm nổi bật sự tương phản giữa việc không bắt công khai trước đó với hành động hiện tại.
theological_decisions:
- issue: Sắc thái của λῃστής trong câu hỏi tu từ
  choice: tên cướp
  alternative: kẻ cướp có vũ trang; tên thảo khấu; kẻ nổi loạn
  rationale: λῃστής có thể chỉ kẻ cướp bạo lực hoặc, trong một số ngữ cảnh, kẻ nổi loạn. “Tên cướp” là nghĩa rộng, dễ hiểu; chú thích giữ lại phạm vi nghĩa mà không gán chắc một hàm ý chính trị cho câu này.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Đức Giê-su” theo lối gọi tôn kính phổ biến; lời trực tiếp dùng “các người” để giữ sắc thái chất vấn. Không đưa chú thích [b] của lớp tiếng Anh vào vì nội dung chú thích ấy không tương ứng với vị trí đánh dấu và chỉ lặp lại câu trước, không phản ánh một dị bản hay nét nghĩa cần thiết của nguồn Hy Lạp.
