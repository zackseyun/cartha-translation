  text: πῶς οὖν πληρωθῶσιν αἱ γραφαὶ ὅτι οὕτως δεῖ γενέσθαι;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/054.yaml
  text: How then would the Scriptures be fulfilled[a], that it must happen this way?
translation:
  language: vi
  text: Vậy thì làm sao Kinh Thánh được ứng nghiệm rằng phải xảy ra như thế?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Vậy thì làm sao Kinh Thánh có thể được ứng nghiệm rằng phải xảy ra như thế?”'
    reason: Phản ánh cách diễn đạt rõ hơn sắc thái khả thể của thể giả định πληρωθῶσιν, mà không thêm chủ ngữ hoặc phạm vi cho biến cố.
lexical_decisions:
- source_word: πῶς οὖν
  choice: Vậy thì làm sao
  rationale: Cách diễn đạt tự nhiên cho câu hỏi tu từ, đồng thời giữ quan hệ suy luận của οὖν với lời ngay trước đó.
- source_word: πληρωθῶσιν
  choice: được ứng nghiệm
  rationale: Thể thụ động giả định của πληρόω nói đến việc lời Kinh Thánh đạt đến sự ứng nghiệm; ngữ cảnh câu hỏi tu từ truyền tải sắc thái khả thể mà không cần thêm trợ động từ gượng ép trong tiếng Việt.
- source_word: αἱ γραφαὶ
  choice: Kinh Thánh
  rationale: Số nhiều Hy Lạp chỉ các sách thánh của Israel; tiếng Việt thường dùng danh từ tập hợp “Kinh Thánh” cho ý nghĩa này.
- source_word: ὅτι
  choice: rằng
  rationale: Giới thiệu nội dung được Kinh Thánh cho biết, giữ cấu trúc và sự mơ hồ có thật của nguyên văn.
- source_word: οὕτως
  choice: như thế
  rationale: Chỉ cách thức các biến cố bắt giữ và chịu khổ đang diễn ra, với cách nói tự nhiên, trang trọng vừa phải.
- source_word: δεῖ
  choice: phải
  rationale: Giữ nguyên sức nặng của sự tất yếu mà không giải thích thêm nguồn gốc thần học của sự tất yếu ấy.
- source_word: γενέσθαι
  choice: những việc này ... xảy ra
  rationale: γίνομαι ở đây nói về các biến cố xảy đến. Chủ ngữ “những việc này” được bổ sung tối thiểu để câu tiếng Việt rõ nghĩa, quy chiếu về hoàn cảnh đang diễn ra.
theological_decisions:
- issue: Bản chất của sự tất yếu trong δεῖ
  choice: “phải xảy ra”
  alternative: “phải xảy ra theo ý định của Đức Chúa Trời”
  rationale: Mối liên hệ với sự ứng nghiệm Kinh Thánh ngụ ý một sự tất yếu thuộc chương trình thần thượng, nhưng nguyên văn không giải thích rõ hơn; vì vậy không thêm diễn giải thần học.
- issue: Quan hệ của ὅτι với mệnh đề trước
  choice: Giữ “rằng” để giới thiệu nội dung
  alternative: 'Dịch theo nghĩa nguyên nhân: “vì những việc này phải xảy ra như thế”'
  rationale: ὅτι có thể được hiểu theo vài sắc thái cú pháp, nhưng cách chỉ nội dung phù hợp trực tiếp với cấu trúc và giữ gần nguyên văn.
translation_notes:
  register: Tiếng Việt hiện đại, dễ hiểu và trang nghiêm; câu hỏi tu từ được giữ nguyên. Dùng “Kinh Thánh” theo quy ước phổ biến, tránh lối nói cổ như “được nên trọn” hoặc “xảy đến thể ấy”.
