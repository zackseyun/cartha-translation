revisions:
- from: Vậy thì làm sao Kinh Thánh được ứng nghiệm rằng những việc này phải xảy ra như thế?[a]
  to: Vậy thì làm sao Kinh Thánh được ứng nghiệm rằng phải xảy ra như thế?[a]
  rationale: Bản sửa bỏ các bổ sung “những việc này” và “mọi việc,” vì nguyên văn dùng cấu trúc vô nhân xưng. Các yếu tố trọng yếu—câu hỏi tu từ, sự ứng nghiệm của Kinh Thánh, và tính tất yếu “phải”—được giữ nguyên; không áp đặt cách giải thích thần học cho δεῖ.
