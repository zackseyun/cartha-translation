  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Τῇ δὲ πρώτῃ τῶν ἀζύμων προσῆλθον οἱ μαθηταὶ τῷ Ἰησοῦ ⸀λέγοντες· Ποῦ θέλεις ⸀ἑτοιμάσωμέν σοι φαγεῖν τὸ πάσχα;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/017.yaml
  text: On the first day of Unleavened Bread[a], the disciples came to Jesus, saying[b], “Where do you want us to prepare for you to eat the Passover?”
translation:
  language: vi
  text: 'Vào ngày thứ nhất của Lễ Bánh Không Men[a], các môn đồ đến gặp Đức Giê-su và hỏi: “Thầy muốn chúng con chuẩn bị lễ Vượt Qua ở đâu để Thầy ăn?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cụm từ Hy Lạp nói sát nghĩa là “ngày thứ nhất của Bánh Không Men”. Không nên chỉ dựa vào bản dịch câu này để kết luận vấn đề niên đại của lễ Vượt Qua.
    reason: cultural_note
lexical_decisions:
- source_word: Τῇ δὲ πρώτῃ τῶν ἀζύμων
  choice: Vào ngày thứ nhất của kỳ Bánh Không Men
  rationale: Cụm ở cách cho thời gian được diễn đạt tự nhiên bằng “vào ngày thứ nhất”; δέ là liên từ nhẹ nên không cần dịch riêng. Danh từ hóa số nhiều τῶν ἀζύμων chỉ thời kỳ lễ hội dùng bánh không men; thêm “kỳ” giúp câu tiếng Việt rõ nghĩa mà không giải quyết thay vấn đề niên đại.
- source_word: προσῆλθον οἱ μαθηταὶ τῷ Ἰησοῦ
  choice: các môn đồ đến gặp Đức Giê-su
  rationale: προσέρχομαι diễn tả việc đến gần hoặc đến với một người. “Đến gặp” tự nhiên trong tiếng Việt và giữ hướng đến Đức Giê-su. Mạo từ xác định nhóm môn đồ đã biết trong ngữ cảnh, không cần thêm “của Ngài”.
- source_word: λέγοντες
  choice: và nói
  rationale: Phân từ đồng thời được chuyển thành động từ nối tiếp để câu tiếng Việt tự nhiên, không diễn giải cụ thể hơn thành “hỏi” dù lời nói có hình thức câu hỏi.
- source_word: Ποῦ θέλεις
  choice: Thầy muốn ... ở đâu?
  rationale: θέλω diễn tả ý muốn. Đưa “ở đâu” về cuối câu phù hợp cú pháp tiếng Việt. “Thầy” là cách các môn đồ trực tiếp xưng hô với Đức Giê-su một cách tự nhiên và tôn kính trong ngữ cảnh.
- source_word: ἑτοιμάσωμέν σοι φαγεῖν τὸ πάσχα
  choice: chúng con chuẩn bị lễ Vượt Qua cho Thầy ăn
  rationale: Thể giả định ngôi thứ nhất số nhiều trong câu hỏi cân nhắc được diễn đạt bằng “chúng con chuẩn bị”. σοι và φαγεῖν đều được giữ qua “cho Thầy ăn”. Trong ngữ cảnh chuẩn bị để ăn, πάσχα chỉ bữa lễ Vượt Qua, nhưng bản dịch chính giữ cách gọi ngắn gọn “lễ Vượt Qua” và chú thích làm rõ.
theological_decisions:
- issue: Cách hiểu “ngày thứ nhất của kỳ Bánh Không Men” liên quan đến thời điểm bữa lễ Vượt Qua
  choice: Giữ nguyên cách diễn đạt về kỳ lễ theo tiếng Hy Lạp, không hài hòa hóa niên đại.
  alternative: Diễn giải thành “ngày trước kỳ Bánh Không Men” hoặc đổi thành “ngày thứ nhất của lễ Vượt Qua”.
  rationale: Bản Hy Lạp nói trực tiếp “ngày thứ nhất của Bánh Không Men”. Việc diễn giải lại sẽ tự giải quyết một vấn đề niên đại đang được tranh luận; bản dịch nên bảo toàn sự căng thẳng của văn bản.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Giê-su”, “các môn đồ” và cặp xưng hô “Thầy—chúng con” phù hợp lời trực tiếp. Chỉ dùng một chú thích vì ghi chú về “bữa lễ Vượt Qua” không tương ứng hợp lý với vị trí marker [a] trong lớp tham khảo tiếng Anh; ý nghĩa bữa ăn đã được thể hiện bằng động từ “ăn” trong câu chính.
