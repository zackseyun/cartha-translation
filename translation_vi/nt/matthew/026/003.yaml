  text: Τότε συνήχθησαν οἱ ⸀ἀρχιερεῖς καὶ οἱ πρεσβύτεροι τοῦ λαοῦ εἰς τὴν αὐλὴν τοῦ ἀρχιερέως τοῦ λεγομένου Καϊάφα,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/003.yaml
  text: Then the chief priests and the elders of the people were gathered in the courtyard of the high priest[a], who was called Caiaphas[b],
translation:
  language: vi
  text: Bấy giờ, các thượng tế và các trưởng lão của dân tụ họp[a] tại sân trong dinh[b] của thượng tế tên là Cai-pha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “được triệu tập”. Động từ Hy Lạp có hình thức thụ động.'
    reason: lexical_alternative
  - marker: b
    text: Từ Hy Lạp có thể chỉ “sân trong” hoặc khu sân của một dinh thự lớn.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Bấy giờ
  rationale: Dấu nối thời gian dẫn vào sự việc kế tiếp; tự nhiên và trang trọng trong văn kể chuyện.
- source_word: συνήχθησαν
  choice: tụ họp
  rationale: Diễn đạt việc các nhân vật cùng tập trung lại; tiếng Hy Lạp có hình thức thụ động, nhưng tiếng Việt dùng “tụ họp” tự nhiên hơn mà không làm thay đổi nội dung sự việc.
- source_word: ἀρχιερεῖς
  choice: các thượng tế
  rationale: Chỉ giới lãnh đạo tư tế, không hàm ý có nhiều người đồng thời giữ chức thầy thượng tế.
- source_word: πρεσβύτεροι τοῦ λαοῦ
  choice: các trưởng lão trong dân chúng
  rationale: Diễn đạt các vị lãnh đạo được nhìn nhận trong dân; tránh cách hiểu họ là người cao tuổi nói chung.
- source_word: εἰς τὴν αὐλὴν
  choice: tại sân dinh
  rationale: Trong ngữ cảnh tụ họp, cụm từ nêu địa điểm đến và nơi hội họp. αὐλή có thể chỉ sân trong thuộc một dinh thự.
- source_word: τοῦ ἀρχιερέως
  choice: của thầy thượng tế
  rationale: Chỉ người duy nhất đang giữ chức vụ này trong ngữ cảnh.
- source_word: τοῦ λεγομένου Καϊάφα
  choice: tên là Cai-pha
  rationale: Cách nhận diện nhân vật tự nhiên trong tiếng Việt, phản ánh ý của phân từ λεγομένου.
theological_decisions: []
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng thuật ngữ quen thuộc “thượng tế”, “trưởng lão”, “thầy thượng tế”; tên Καϊάφα được phiên âm là “Cai-pha”. Các chú thích giữ lại sắc thái thụ động của động từ và phạm vi nghĩa của αὐλή.
