revisions:
- from: Bấy giờ, các thượng tế và các trưởng lão trong dân chúng tụ họp[a] tại sân dinh[b] của thầy thượng tế tên là Cai-pha.
  to: Bấy giờ, các thượng tế và các trưởng lão của dân tụ họp[a] tại sân trong dinh[b] của thượng tế tên là Cai-pha.
  rationale: 'Sửa chức danh số ít từ “thầy thượng tế” thành “thượng tế” để dùng thuật ngữ tự nhiên, nhất quán và sát nguồn; đổi “các trưởng lão trong dân chúng” thành “các trưởng lão của dân” để phản ánh trực tiếp sở hữu cách τοῦ λαοῦ; và làm rõ αὐλή bằng “sân trong dinh.” Các chú thích giữ đúng vị trí neo: [a] sau động từ và [b] sau cụm địa điểm.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T05:44:35Z'
review_pass:
  verdict: revise
  source_fidelity: Bản dịch truyền đạt đúng trình tự thời gian, các nhóm lãnh đạo được nêu, và địa điểm hội họp. “Tụ họp” là cách diễn đạt tự nhiên cho συνήχθησαν, dù không thể hiện hình thức bị động; chú thích đã nêu lựa chọn này. “Sân trong dinh” phản ánh αὐλή rõ hơn “sân dinh” đơn thuần.
  naturalness: Câu văn nhìn chung tự nhiên, trang trọng. Tuy nhiên, “thầy thượng tế” không phải cách gọi chức danh tự nhiên trong tiếng Việt hiện đại và cũng gây không nhất quán với “các thượng tế” ở đầu câu.
  terminology: Giữ “các thượng tế” cho ἀρχιερεῖς và “thượng tế” cho ἀρχιερεύς là nhất quán và đủ phân biệt số nhiều lãnh đạo tư tế với chức vụ số ít. “Các trưởng lão của dân” sát τοῦ λαοῦ hơn và gọn tự nhiên hơn “trong dân chúng.”
  issues:
  - severity: medium
    issue: “thầy thượng tế” là cách gọi không tự nhiên và không nhất quán.
    rationale: ἀρχιερεύς ở đây chỉ chức danh số ít; “thượng tế” là đủ. Thêm “thầy” không có cơ sở từ văn bản nguồn và làm câu kém tự nhiên.
  - severity: low
    issue: “sân dinh” chưa diễn đạt rõ nét nghĩa sân/khu sân bên trong một dinh thự của αὐλή.
    rationale: “Sân trong dinh” bảo lưu nghĩa chính của αὐλή mà không khẳng định quá mức rằng đây là một “cung điện.”
