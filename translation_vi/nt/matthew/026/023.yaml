  source_fidelity: 'Bản dịch giữ đúng các thành phần chính của câu Hy Lạp: lời đáp, hành động nhúng tay cùng với Chúa Giê-su, vật đựng thức ăn, sự nhấn mạnh của οὗτός, và lời báo trước về việc phản bội. Tuy nhiên, “kẻ” thêm sắc thái miệt thị không có rõ trong ὁ ... οὗτος; chú thích “nộp” cũng quá lược, chưa phản ánh đối tượng “Ta” của παραδώσει με.'
