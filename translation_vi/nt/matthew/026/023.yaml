  rationale: Thay “kẻ” bằng “người” để tránh thêm sắc thái miệt thị; dùng “bát” làm cách dịch chính tự nhiên hơn cho τρυβλίον trong ngữ cảnh nhúng tay dùng thức ăn; và mở rộng chú thích về παραδίδωμι để giữ đủ tân ngữ của nguyên văn. Cấu trúc “chính người ấy” tiếp tục bảo toàn lực nhấn mạnh của οὗτός.
