  text: ὁ δὲ ἀποκριθεὶς εἶπεν· Ὁ ἐμβάψας μετ’ ἐμοῦ ⸂τὴν χεῖρα ἐν τῷ τρυβλίῳ⸃ οὗτός με παραδώσει·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/023.yaml
  text: He answered[b][a], “The one who dipped his hand with me in the bowl—this one will betray me.”
translation:
  language: vi
  text: 'Người đáp: “Người đã nhúng tay cùng Ta vào bát[a], chính người ấy sẽ phản bội Ta.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “đĩa.”
    reason: lexical_alternative
  - marker: b
    text: Hay “sẽ giao nộp Ta.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: Người đáp
  rationale: Cấu trúc phân từ đi với động từ hữu hạn là một lối diễn đạt Hy Lạp chịu ảnh hưởng Sê-mít; dịch gọn là “Người đáp” vừa tự nhiên trong tiếng Việt vừa giữ trọn ý.
- source_word: ἐμβάψας
  choice: đã ... nhúng
  rationale: Phân từ bất định chỉ hành động nhận diện được trình bày như đã xảy ra; “đã nhúng” thể hiện rõ sắc thái này.
- source_word: μετ’ ἐμοῦ
  choice: cùng Ta
  rationale: Diễn đạt tự nhiên ý đồng hành của μετά với sở hữu cách và giữ mối liên hệ trực tiếp giữa hành động của người ấy với Chúa Giê-su.
- source_word: τὴν χεῖρα
  choice: tay
  rationale: Tiếng Việt không cần thêm đại từ sở hữu trong cụm “nhúng tay”; chủ thể của bàn tay đã rõ từ ngữ cảnh.
- source_word: ἐν τῷ τρυβλίῳ
  choice: vào đĩa
  rationale: τρύβλιον chỉ vật đựng thức ăn, có thể là đĩa sâu hoặc bát. “Đĩa” tự nhiên trong ngữ cảnh cùng dùng thức ăn; “bát” được ghi ở chú thích như một khả năng từ vựng.
- source_word: οὗτός
  choice: chính kẻ ấy
  rationale: Đại từ chỉ định mang tính nhấn mạnh; “chính kẻ ấy” giữ được lực nhấn mạnh rõ hơn một đại từ đơn thuần.
- source_word: παραδώσει
  choice: sẽ phản bội
  rationale: Trong bối cảnh cuộc thương khó, động từ chỉ việc giao nộp Chúa Giê-su bằng hành vi phản trắc. “Phản bội” truyền đạt rõ nghĩa theo ngữ cảnh; nghĩa sát mặt chữ hơn được giữ trong chú thích.
theological_decisions:
- issue: Cách dịch παραδίδωμι trong bối cảnh Giu-đa
  choice: sẽ phản bội
  alternative: sẽ nộp
  rationale: Động từ có nghĩa rộng là giao hoặc nộp một người, nhưng trong quan hệ giữa Giu-đa và Chúa Giê-su, hành động ấy mang tính phản trắc. Bản chính dùng “phản bội” để truyền đạt nghĩa theo ngữ cảnh, đồng thời chú thích giữ khả năng dịch sát hơn nhằm tránh che khuất phạm vi nghĩa của nguyên ngữ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Ta” phù hợp lời Chúa Giê-su trong ngữ cảnh trang trọng; cấu trúc “chính kẻ ấy” bảo toàn sự nhấn mạnh của nguyên văn mà vẫn tự nhiên trong tiếng Việt.
