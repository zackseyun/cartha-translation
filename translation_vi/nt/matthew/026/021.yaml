revisions:
- from: 'Trong khi họ đang ăn, Ngài nói: “Tôi nói thật với anh em: một người trong anh em sẽ phản bội tôi.[a]”'
  to: 'Trong khi họ đang ăn, Ngài nói: “Tôi nói thật với anh em: một người trong số anh em sẽ phản bội[a] tôi.”'
  rationale: Chỉnh sửa chỉ nhằm làm tự nhiên hơn cách diễn đạt ý phân bộ và làm chú thích từ vựng trung thành hơn với phạm vi nghĩa của παραδίδωμι. Bản chính vẫn giữ “phản bội” theo ngữ cảnh, còn chú thích bảo lưu các cách dịch “nộp/trao” mà không thêm một người nhận không có trong nguyên văn.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T05:44:45Z'
review_pass:
  verdict: revise
  source_fidelity: Bản dịch giữ đúng quan hệ thời gian của sở hữu cách tuyệt đối, lời xác quyết trang trọng của Ἀμήν λέγω ὑμῖν, ý phân bộ của εἷς ἐξ ὑμῶν, thì tương lai của παραδώσει, và tân ngữ με. “Sẽ phản bội” phù hợp ngữ cảnh, miễn là chú thích bảo lưu nghĩa rộng hơn là trao/nộp.
  naturalness: Văn phong nhìn chung tự nhiên, hiện đại và trang trọng vừa phải. “Một người trong số anh em” rõ và tự nhiên hơn “một người trong anh em.” Đặt ký hiệu chú thích ngay sau động từ giúp neo chú thích chính xác vào παραδώσει.
  terminology: “Ngài,” “anh em,” và “tôi” tạo thành lối xưng hô hiện đại, tôn trọng và nhất quán trong câu. Không cần áp đặt cách xưng hô truyền thống như “Ta.” Chú thích cần tránh thêm đối tượng/người nhận không được nêu trong động từ Hy Lạp.
  issues:
  - severity: low
    issue: Chú thích thêm cụm “vào tay người khác.”
    rationale: παραδώσει có thể là “trao/nộp,” nhưng bản thân từ này không nêu rõ người nhận là “người khác.” Cụm này là một cách diễn giải có thể có trong ngữ cảnh, không phải phương án sát nghĩa trực tiếp; nên thay bằng phương án không thêm thông tin.
  - severity: low
    issue: Cách nói “một người trong anh em” hơi kém tự nhiên và ký hiệu chú thích chưa neo trực tiếp vào động từ.
    rationale: “Một người trong số anh em” diễn đạt rõ cấu trúc phân bộ εἷς ἐξ ὑμῶν. Đặt [a] sau “phản bội” làm rõ chú thích giải thích παραδώσει, không phải riêng đại từ “tôi.”
  revised_text: 'Trong khi họ đang ăn, Ngài nói: “Tôi nói thật với anh em: một người trong số anh em sẽ phản bội[a] tôi.”'
