source:
  edition: SBLGNT
  text: καὶ ἐσθιόντων αὐτῶν εἶπεν· Ἀμὴν λέγω ὑμῖν ὅτι εἷς ἐξ ὑμῶν παραδώσει με.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/021.yaml
  text: And while they were eating[a], he said, “Truly I tell you, one of you will betray me.”
translation:
  language: vi
  text: 'Trong khi họ đang ăn, Ngài nói: “Tôi nói thật với anh em: một người trong số anh em sẽ phản bội[a] tôi.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hoặc, sát nghĩa hơn, “sẽ nộp tôi” hoặc “sẽ trao tôi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσθιόντων αὐτῶν
  choice: Trong khi họ đang ăn
  rationale: Cụm sở hữu cách tuyệt đối diễn tả hành động xảy ra đồng thời; cách dịch này tự nhiên và giữ rõ ý thời gian.
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: Tôi nói thật với anh em
  rationale: Cách diễn đạt tiếng Việt tự nhiên, gộp lời xác quyết long trọng Ἀμὴν với công thức λέγω ὑμῖν mà vẫn giữ lời nói trực tiếp và sắc thái trang trọng.
- source_word: εἷς ἐξ ὑμῶν
  choice: một người trong anh em
  rationale: 'Giữ đúng ý phân bộ: một người thuộc nhóm những người đang được Chúa Giê-su trực tiếp nói với.'
- source_word: παραδώσει
  choice: sẽ phản bội
  rationale: Động từ có nghĩa rộng là trao hoặc nộp một người, nhưng trong ngữ cảnh Giu-đa hành động chống lại Chúa Giê-su, “phản bội” truyền đạt tự nhiên sắc thái bội tín; thì tương lai được giữ bằng “sẽ”.
- source_word: με
  choice: tôi
  rationale: Đại từ tân ngữ ngôi thứ nhất chỉ Chúa Giê-su; “tôi” là cách tự xưng trung tính, hiện đại trong lời nói trực tiếp.
theological_decisions:
- issue: Cách dịch παραδώσει trong bối cảnh cuộc thương khó
  choice: sẽ phản bội
  alternative: sẽ nộp tôi / sẽ trao tôi vào tay người khác
  rationale: “Phản bội” làm rõ tính bội tín trong hành động của một môn đồ, nhưng chú thích vẫn bảo lưu nghĩa từ vựng rộng hơn của động từ Hy Lạp, tránh che khuất sự nhập nhằng có thật.
translation_notes:
  register: Văn phong tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. “Ngài” xác định chủ thể theo ngữ cảnh; “anh em” giữ cách nói trực tiếp với nhóm môn đồ. Dấu chú thích được đặt ngay sau từ ngữ mà chú thích giải thích.
