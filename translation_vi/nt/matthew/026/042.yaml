  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: πάλιν ἐκ δευτέρου ἀπελθὼν προσηύξατο λέγων· Πάτερ μου, εἰ οὐ δύναται ⸀τοῦτο ⸀παρελθεῖν ἐὰν μὴ αὐτὸ πίω, γενηθήτω τὸ θέλημά σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/042.yaml
  text: Again[a], a second time he went away and prayed, saying, “My Father, if this cannot pass unless I drink it[b], your will be done.”
translation:
  language: vi
  text: 'Ngài lại rời đi và cầu nguyện lần thứ hai rằng: “Cha của con, nếu điều này không thể qua đi mà con không uống nó[a][b], xin ý Cha được thực hiện.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Điều này” và “nó” chỉ về chén được nói đến ở câu trước; tại đây tiếng Hy Lạp chỉ dùng đại từ chỉ định và đại từ, không lặp lại từ “chén”.
    reason: cross_reference
  - marker: b
    text: 'Hoặc: “nếu điều này không thể qua đi, trừ khi con uống nó.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν ἐκ δευτέρου
  choice: lại ... lần thứ hai
  rationale: Giữ cả trạng từ chỉ sự lặp lại πάλιν và thành ngữ ἐκ δευτέρου, đồng thời sắp xếp theo trật tự tự nhiên của tiếng Việt.
- source_word: ἀπελθὼν
  choice: đi khỏi đó
  rationale: Chuyển phân từ aorist thành động từ hữu hạn trong mạch kể; “đó” làm rõ nghĩa rời khỏi chỗ đang ở mà không thêm địa điểm cụ thể.
- source_word: προσηύξατο λέγων
  choice: cầu nguyện ... rằng
  rationale: Diễn đạt tự nhiên hành động cầu nguyện và lời cầu nguyện trực tiếp, không cần dịch máy móc phân từ λέγων là “nói rằng”.
- source_word: Πάτερ μου
  choice: Cha của con
  rationale: Giữ trực tiếp cách xưng hô thân thuộc giữa Con với Cha; tránh thêm tước hiệu hay sắc thái hệ phái không có trong nguyên văn.
- source_word: εἰ οὐ δύναται τοῦτο παρελθεῖν
  choice: nếu điều này không thể qua đi
  rationale: Giữ cấu trúc điều kiện, ý bất khả và động từ “qua đi”; “điều này” tương ứng với đại từ chỉ định τοῦτο mà không tự ý đưa “chén” vào chính văn.
- source_word: ἐὰν μὴ αὐτὸ πίω
  choice: trừ khi con uống nó
  rationale: “Trừ khi” diễn đạt sát thành ngữ điều kiện ἐὰν μή; “nó” giữ phép hồi chỉ của αὐτό mà không nêu rõ danh từ vốn chỉ được hàm ý theo ngữ cảnh.
- source_word: γενηθήτω τὸ θέλημά σου
  choice: nguyện ý Cha được nên
  rationale: “Nguyện” chuyển tải sắc thái lời cầu xin của mệnh lệnh cách; “ý Cha được nên” giữ sức nặng thần học và sự tương ứng với lời cầu nguyện ở Ma-thi-ơ 6:10.
theological_decisions:
- issue: Có nên nêu rõ “chén” cho τοῦτο và αὐτό trong chính văn hay không
  choice: Giữ “điều này” và “nó” trong chính văn
  alternative: Dịch là “chén này” và “chén ấy”
  rationale: Ngữ cảnh Ma-thi-ơ 26:39 cho thấy đối tượng là chén đau khổ, nhưng câu 42 không lặp lại danh từ ποτήριον. Cách dịch đã chọn giữ đúng mức độ minh thị của nguyên văn và giải thích sở chỉ trong chú thích.
- issue: Cách diễn đạt lời thuận phục γενηθήτω τὸ θέλημά σου
  choice: nguyện ý Cha được nên
  alternative: xin ý Cha được thực hiện
  rationale: Cách chọn giữ lực cầu nguyện của mệnh lệnh cách và sự vang vọng với Ma-thi-ơ 6:10, nhưng không biến lời này thành một phát biểu thuần túy về điều sẽ xảy ra.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu dịch giữ sự lặp có chủ ý trong “lại ... lần thứ hai”, đồng thời bảo toàn cách nói hàm ý “điều này ... nó” của nguyên văn. “Ngài” được dùng cho chủ thể Giê-su theo văn phong kể chuyện kính trọng; trong lời cầu nguyện, “Cha/con” giữ quan hệ xưng hô trực tiếp.
