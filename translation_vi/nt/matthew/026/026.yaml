id: MAT.26.26
reference: Matthew 26:26
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἐσθιόντων δὲ αὐτῶν λαβὼν ὁ Ἰησοῦς ⸀ἄρτον καὶ ⸀εὐλογήσας ἔκλασεν καὶ ⸂δοὺς τοῖς μαθηταῖς⸃ εἶπεν· Λάβετε φάγετε, τοῦτό ἐστιν τὸ σῶμά μου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/026.yaml
  text: While they were eating[a], Jesus took bread, and after blessing it, he broke it and gave it to the disciples and said, “Take, eat[d][c][b]; this is my body.”
translation:
  language: vi
  text: 'Khi họ đang ăn[a], Giê-su lấy bánh, chúc phước[b], rồi bẻ ra và trao cho các môn đệ. Ngài nói: “Hãy cầm lấy mà ăn[c]; đây là thân thể của tôi[d].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Trong lúc họ đang ăn.”'
    reason: lexical_alternative
  - marker: b
    text: Nguyên văn không nêu rõ đối tượng của lời chúc phước; một số người hiểu đây là việc dâng lời tạ ơn trên bánh.
    reason: lexical_alternative
  - marker: c
    text: 'Sát hơn: “Hãy cầm lấy, hãy ăn.”'
    reason: lexical_alternative
  - marker: d
    text: Tiếng Hy Lạp viết sát nghĩa là “đây là thân thể của tôi.” Một số người giải thích câu này theo nghĩa “đây có nghĩa là/tượng trưng cho thân thể của tôi,” nhưng bản dịch giữ nguyên cách diễn đạt của nguồn.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐσθιόντων δὲ αὐτῶν
  choice: Khi họ đang ăn
  rationale: Cụm sở hữu cách tuyệt đối nêu bối cảnh thời gian với hành động đang diễn ra. “Khi họ đang ăn” tự nhiên trong tiếng Việt; δέ chỉ có tác dụng nối nhẹ nên không cần dịch thành một từ mang ý tương phản.
- source_word: λαβὼν
  choice: lấy
  rationale: Phân từ bất định quá khứ diễn tả hành động xảy ra trước các hành động tiếp theo; chuyển thành động từ hữu hạn giúp câu kể tự nhiên mà vẫn giữ đúng trình tự.
- source_word: ἄρτον
  choice: bánh
  rationale: ἄρτος chỉ bánh mì hoặc một ổ bánh trong bối cảnh bữa ăn. “Bánh” là cách gọi gọn, quen thuộc trong văn cảnh Kinh Thánh và không xác định hình dạng mà nguyên văn không nêu rõ.
- source_word: εὐλογήσας
  choice: chúc phước
  rationale: Giữ nghĩa trực tiếp của εὐλογέω và không đồng nhất từ này với εὐχαριστέω (“tạ ơn”), dù trong bối cảnh bữa ăn hai hành động có quan hệ gần gũi.
- source_word: ἔκλασεν
  choice: bẻ ra
  rationale: Động từ κλάω có nghĩa là bẻ, thường dùng về bánh. “Bẻ ra” là cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: δοὺς τοῖς μαθηταῖς
  choice: trao cho các môn đệ
  rationale: Phân từ được chuyển thành động từ nối tiếp để câu tiếng Việt trôi chảy. Mạo từ xác định nhóm môn đệ đã biết; không thêm “của Ngài” vì nguyên văn không có từ sở hữu.
- source_word: Λάβετε φάγετε
  choice: Hãy cầm lấy mà ăn
  rationale: Hai mệnh lệnh bất định quá khứ đứng liền nhau. Cấu trúc “cầm lấy mà ăn” tự nhiên trong tiếng Việt, giữ cả hai hành động mà không làm mất sức mệnh lệnh.
- source_word: τοῦτό ἐστιν
  choice: đây là
  rationale: ἐστιν là hệ từ “là”. “Đây là” giữ nguyên cách khẳng định của nguồn, không diễn giải thành “có nghĩa là” hay “tượng trưng cho”.
- source_word: τὸ σῶμά μου
  choice: thân thể của tôi
  rationale: σῶμα có nghĩa thông thường là “thân thể”; đại từ sở hữu được dịch trực tiếp. “Tôi” tránh đưa vào nguyên văn một danh xưng quan hệ như “Thầy” hoặc lối xưng hô cổ “Ta”.
theological_decisions:
- issue: Lời của Giê-su về bánh trong bữa ăn
  choice: “đây là thân thể của tôi”
  alternative: “đây tượng trưng cho thân thể của tôi” hoặc “đây có nghĩa là thân thể của tôi”
  rationale: Nguyên văn dùng hệ từ đơn giản ἐστιν (“là”). Bản dịch giữ nguyên lời khẳng định và sự căng thẳng thần học của câu, không áp đặt một cách hiểu riêng về Tiệc Thánh.
- issue: Đối tượng của hành động εὐλογήσας
  choice: “chúc phước” mà không chỉ rõ đối tượng
  alternative: “chúc phước cho bánh” hoặc “dâng lời tạ ơn”
  rationale: Nguyên văn không nêu tân ngữ. Không thêm đối tượng giúp tránh quyết định thay cho nguồn rằng lời chúc hướng đến bánh hay là lời chúc tụng/tạ ơn dâng lên Đức Chúa Trời.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “môn đệ” như thuật ngữ phổ thông chỉ μαθητής; dùng “Giê-su” không kèm tước hiệu vì nguyên văn chỉ có tên riêng. Chia lời kể thành hai câu để tiếng Việt tự nhiên, nhưng vẫn giữ nguyên trình tự hành động và nội dung phát ngôn.
