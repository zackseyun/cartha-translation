source:
  edition: SBLGNT
  text: καὶ ἀφεὶς αὐτοὺς ⸂πάλιν ἀπελθὼν⸃ προσηύξατο ἐκ τρίτου τὸν αὐτὸν λόγον εἰπὼν ⸀πάλιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/044.yaml
  text: And leaving them again[a], he went away and prayed a third time, saying the same thing again.
translation:
  language: vi
  text: Rồi Ngài lại rời họ, đi khỏi đó và cầu nguyện lần thứ ba, lại nói cùng một lời.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “lại nói cùng một điều.” Tiếng Hy Lạp: “cùng một lời/lời nói.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀφεὶς αὐτοὺς
  choice: rời họ
  rationale: Diễn đạt tự nhiên động tác Đức Giê-su rời các môn đồ, đồng thời giữ trình tự của phân từ aorist.
- source_word: πάλιν
  choice: lại
  rationale: Lần xuất hiện thứ nhất đánh dấu việc Ngài một lần nữa rời các môn đồ và đi cầu nguyện.
- source_word: ἀπελθὼν
  choice: đi ra
  rationale: Thể hiện chuyển động ra xa nhóm môn đồ bằng cách nói tự nhiên trong văn kể chuyện tiếng Việt.
- source_word: προσηύξατο
  choice: cầu nguyện
  rationale: Tương đương trực tiếp và thông dụng của động từ chỉ hành động cầu nguyện.
- source_word: ἐκ τρίτου
  choice: lần thứ ba
  rationale: Cách diễn đạt rõ ràng, tự nhiên cho lần thực hiện thứ ba.
- source_word: τὸν αὐτὸν λόγον
  choice: cùng một lời cầu nguyện
  rationale: λόγον ở số ít chỉ lời nói hay nội dung được nói; trong ngữ cảnh này, “lời cầu nguyện” vừa tự nhiên vừa giữ tính số ít và không buộc phải hiểu là từng từ hoàn toàn giống nhau.
- source_word: εἰπὼν πάλιν
  choice: lặp lại
  rationale: Chuyển tải cả hành động nói và trạng từ “lại” bằng một động từ tiếng Việt tự nhiên, nhấn mạnh rằng nội dung cầu nguyện được nói lại.
theological_decisions:
- issue: Sự lặp lại trong lời cầu nguyện của Đức Giê-su
  choice: Giữ cả việc cầu nguyện lần thứ ba và việc lặp lại cùng một lời cầu nguyện.
  alternative: Lược bỏ ý “lại” ở cuối vì cho là trùng lặp về văn phong.
  rationale: Bản Hy Lạp có hai lần πάλιν và còn nói rõ ἐκ τρίτου; bản dịch giữ sự nhấn mạnh của trình thuật mà không suy diễn về hình thức hay ý nghĩa thần học của sự lặp lại.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Ngài” để chỉ Đức Giê-su theo mạch văn; “Rồi” nối tự nhiên với câu trước. Dấu chú thích [a] đặt ngay sau cụm cần giải thích.
