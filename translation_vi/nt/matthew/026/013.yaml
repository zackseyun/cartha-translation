review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch truyền đạt đúng cấu trúc và ý chính của câu Hy Lạp: lời khẳng định long trọng, mệnh đề địa điểm bất định, việc rao truyền Tin Mừng trên toàn thế giới, và việc làm của người phụ nữ sẽ được thuật lại/nhắc đến. Tuy nhiên, “cô” gợi tuổi tác và có sắc thái thân mật mà αὐτῆς không xác định; “người ấy” giữ quy chiếu nữ tính theo ngữ cảnh mà không thêm sắc thái.'
  naturalness: Câu văn tự nhiên, trang trọng và phù hợp tiếng Việt hiện đại. Cần viết thường “bất cứ” sau dấu hai chấm, và thay đại từ “cô” để nhất quán với văn phong tường thuật trang trọng.
  terminology: “Tin Mừng,” “rao truyền,” và “khắp thế giới” đều phù hợp với εὐαγγέλιον, κηρυχθῇ, và ἐν ὅλῳ τῷ κόσμῳ. “Được kể lại” là cách dịch có thể chấp nhận cho λαληθήσεται trong ngữ cảnh, còn “được nhắc đến” là lựa chọn thay thế gần nghĩa.
  issues:
  - severity: low
    issue: Đại từ “cô” thêm sắc thái tuổi tác/thân mật.
    rationale: Hy Lạp chỉ dùng đại từ giống cái αὐτῆς, không cho biết tuổi hay quan hệ thân mật. “Người ấy” trung tính hơn trong văn phong hiện đại và vẫn quy chiếu rõ đến người phụ nữ vừa nêu.
  - severity: low
    issue: Viết hoa “Bất” sau dấu hai chấm.
    rationale: Mệnh đề sau dấu hai chấm tiếp nối trực tiếp lời nói, nên viết thường sẽ tự nhiên và nhất quán hơn.
