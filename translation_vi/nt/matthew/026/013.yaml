  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀμὴν λέγω ὑμῖν, ὅπου ἐὰν κηρυχθῇ τὸ εὐαγγέλιον τοῦτο ἐν ὅλῳ τῷ κόσμῳ, λαληθήσεται καὶ ὃ ἐποίησεν αὕτη εἰς μνημόσυνον αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/013.yaml
  text: Truly I tell you, wherever this good news is proclaimed in the whole world, what this woman has done will also be spoken of in memory of her.
translation:
  language: vi
  text: 'Thật, tôi nói với anh em: bất cứ nơi nào Tin Mừng này được rao truyền khắp thế giới, việc người phụ nữ này đã làm cũng sẽ được kể lại để tưởng nhớ người ấy.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “việc người phụ nữ này đã làm cũng sẽ được nhắc đến như một sự tưởng niệm về người ấy.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν
  choice: Thật
  rationale: Mở đầu một lời khẳng định long trọng của Chúa Giê-su; “Thật” tự nhiên trong tiếng Việt và giữ được sức nặng của công thức này.
- source_word: λέγω ὑμῖν
  choice: tôi nói với anh em
  rationale: Giữ cách xưng hô trực tiếp và trang trọng; “anh em” phù hợp với nhóm môn đệ trong ngữ cảnh.
- source_word: ὅπου ἐὰν
  choice: bất cứ nơi nào
  rationale: Diễn đạt rõ ý địa điểm bất định của tổ hợp Hy Lạp.
- source_word: κηρυχθῇ
  choice: được rao truyền
  rationale: Giữ thể bị động và sắc thái công bố rộng rãi của κηρύσσω, đồng thời tự nhiên trong văn phong Kinh Thánh tiếng Việt.
- source_word: τὸ εὐαγγέλιον τοῦτο
  choice: Tin Mừng này
  rationale: “Tin Mừng” vừa chuyển tải nghĩa tin tốt lành của εὐαγγέλιον vừa là cách gọi quen thuộc, trang trọng trong tiếng Việt.
- source_word: ἐν ὅλῳ τῷ κόσμῳ
  choice: khắp thế giới
  rationale: Cách diễn đạt tự nhiên, gọn và giữ phạm vi phổ quát của cụm Hy Lạp.
- source_word: λαληθήσεται
  choice: sẽ được kể lại
  rationale: Với đối tượng là một việc đã làm, “được kể lại” là tiếng Việt tự nhiên và vẫn giữ thể bị động cùng ý được nhắc đến.
- source_word: ὃ ἐποίησεν αὕτη
  choice: việc người phụ nữ này đã làm
  rationale: Đại từ trung tính chỉ hành động; αὕτη được làm rõ theo ngữ cảnh là người phụ nữ vừa được nhắc đến.
- source_word: εἰς μνημόσυνον αὐτῆς
  choice: để tưởng nhớ cô
  rationale: Diễn đạt tự nhiên mục đích hoặc kết quả tưởng niệm mà εἰς μνημόσυνον có thể biểu thị; “cô” quy chiếu rõ đến người phụ nữ.
theological_decisions:
- issue: Cách dịch εὐαγγέλιον
  choice: Tin Mừng
  alternative: tin lành
  rationale: “Tin Mừng” phản ánh nghĩa của từ Hy Lạp và là thuật ngữ phổ thông, liên hệ phái tính thấp hơn trong tiếng Việt hiện đại.
- issue: Quan hệ của εἰς μνημόσυνον αὐτῆς với lời kể
  choice: để tưởng nhớ cô
  alternative: như một kỷ niệm về cô
  rationale: Giữ ý tưởng niệm mà không xác định quá mức bản chất hay nghi thức của việc tưởng niệm; chú thích bảo tồn cách hiểu danh từ trang trọng hơn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Tin Mừng” thay vì thuật ngữ dễ mang dấu ấn hệ phái; giữ lời khẳng định mở đầu súc tích và nhịp câu tuyên bố long trọng.
