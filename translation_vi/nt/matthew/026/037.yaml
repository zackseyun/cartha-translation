  to: Ngài dẫn theo Phi-e-rơ và hai con trai của Xê-bê-đê, rồi bắt đầu buồn rầu và khổ não.[a]
  rationale: Sửa cách diễn đạt về việc đưa các môn đồ đi cùng và thay thuật ngữ dễ gợi đau đớn thể xác bằng từ chỉ sự khổ sở nội tâm. Bản sửa vẫn giữ sắc thái khởi đầu của ἤρξατο, cách nhận diện nguyên văn “hai con trai của Xê-bê-đê,” và sự song hành của hai động từ chỉ cảm xúc.
