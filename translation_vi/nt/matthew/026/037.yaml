  text: καὶ παραλαβὼν τὸν Πέτρον καὶ τοὺς δύο υἱοὺς Ζεβεδαίου ἤρξατο λυπεῖσθαι καὶ ἀδημονεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/037.yaml
  text: And taking Peter and the two sons of Zebedee with him[a], he began to be sorrowful and deeply distressed.
translation:
  language: vi
  text: Ngài dẫn theo Phi-e-rơ và hai con trai của Xê-bê-đê, rồi bắt đầu buồn rầu và khổ não.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “buồn phiền và vô cùng bối rối.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: παραλαβὼν
  choice: đem theo
  rationale: Phân từ bất định quá khứ diễn tả việc Chúa Giê-su đưa những người bạn đồng hành được chọn đi cùng; “đem theo” tự nhiên và hàm ý họ ở với Ngài.
- source_word: τοὺς δύο υἱοὺς Ζεβεδαίου
  choice: hai con trai của Xê-bê-đê
  rationale: Giữ nguyên cách nhận diện trong tiếng Hy Lạp, không diễn giải thêm tên Gia-cơ và Giăng vốn không xuất hiện trong câu này.
- source_word: ἤρξατο
  choice: bắt đầu
  rationale: Chuyển tải rõ sắc thái khởi đầu của động từ đi với hai động từ nguyên mẫu.
- source_word: λυπεῖσθαι
  choice: buồn rầu
  rationale: Diễn tả nỗi buồn và đau buồn thật sự với văn phong trang trọng nhưng dễ hiểu.
- source_word: ἀδημονεῖν
  choice: vô cùng đau đớn
  rationale: Diễn tả trạng thái khốn quẫn, đau đớn nội tâm mãnh liệt, mạnh hơn λυπεῖσθαι nhưng không đẩy nghĩa thành tuyệt vọng.
- source_word: καὶ ... καὶ
  choice: và ... và
  rationale: Giữ sự phối hợp và tính dồn lớp của các thành phần trong tiếng Hy Lạp bằng liên từ tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Sự mô tả trạng thái cảm xúc của Chúa Giê-su trong tương quan với Kitô học
  choice: Chuyển tải thẳng thắn cả hai động từ như nỗi buồn và sự đau đớn thật sự của con người
  alternative: Làm nhẹ mức độ dễ tổn thương về cảm xúc, hoặc tăng nghĩa thành kinh hoàng hay tuyệt vọng
  rationale: 'Câu dịch giữ nguyên chứng cứ từ vựng và sự căng thẳng thần học: Chúa Giê-su thực sự trải qua đau khổ cảm xúc của con người, nhưng bản văn không nói Ngài tuyệt vọng.'
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” theo ngữ cảnh để chỉ Chúa Giê-su; giữ cách gọi “hai con trai của Xê-bê-đê” sát nguồn. Dấu chú thích [a] xuất hiện ngay sau mệnh đề có phương án từ vựng.
