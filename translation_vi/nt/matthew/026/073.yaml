  text: μετὰ μικρὸν δὲ προσελθόντες οἱ ἑστῶτες εἶπον τῷ Πέτρῳ· Ἀληθῶς καὶ σὺ ἐξ αὐτῶν εἶ, καὶ γὰρ ἡ λαλιά σου δῆλόν σε ποιεῖ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/073.yaml
  text: After a little while[a], those standing there came up and said to Peter, “Surely you also are one of them, for even your accent makes you evident.”
translation:
  language: vi
  text: 'Một lát sau,[a] những người đứng đó tiến lại và nói với Phi-e-rơ: “Đúng là anh cũng thuộc nhóm họ, vì ngay cả giọng nói của anh cũng khiến người ta nhận ra anh.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “Ít lâu sau” / “Một lúc sau.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ μικρὸν
  choice: Một lát sau
  rationale: Diễn đạt tự nhiên một khoảng thời gian ngắn trôi qua, đúng chức năng trạng ngữ thời gian của cụm Hy Lạp.
- source_word: δὲ
  choice: —
  rationale: Đây là liên từ nhẹ tiếp nối diễn biến; tiếng Việt không cần dịch thành một từ riêng vì “Một lát sau” đã tạo chuyển tiếp tự nhiên.
- source_word: προσελθόντες
  choice: tiến lại
  rationale: Diễn tả những người ấy di chuyển đến gần Phi-e-rơ; cách nói tự nhiên và giữ được hành động của phân từ.
- source_word: οἱ ἑστῶτες
  choice: những người đứng đó
  rationale: Bám sát nghĩa “những người đang đứng,” với “đó” làm rõ họ là những người có mặt gần đó mà không diễn giải quá mức.
- source_word: εἶπον τῷ Πέτρῳ
  choice: nói với Phi-e-rơ
  rationale: Cách chuyển ngữ trực tiếp, tự nhiên của động từ λέγω cùng tân ngữ gián tiếp.
- source_word: Ἀληθῶς
  choice: Đúng là
  rationale: Thể hiện lời khẳng định chắc chắn trong một lời nhận diện hoặc buộc tội, tự nhiên hơn “thật vậy” trong hội thoại tiếng Việt.
- source_word: καὶ σὺ
  choice: anh cũng
  rationale: Giữ ý nhấn mạnh rằng Phi-e-rơ cũng nằm trong nhóm đang được nói đến.
- source_word: ἐξ αὐτῶν
  choice: thuộc nhóm họ
  rationale: Diễn đạt tự nhiên ý thuộc về hoặc liên hệ với nhóm ấy; tránh lối nói cứng “từ trong số họ.”
- source_word: καὶ γὰρ
  choice: vì ngay cả ... cũng
  rationale: γάρ nêu lý do, còn καί có sắc thái bổ sung hoặc nhấn mạnh; cấu trúc tiếng Việt này thể hiện cả hai.
- source_word: ἡ λαλιά σου
  choice: giọng nói của anh
  rationale: λαλιά có thể chỉ lời nói, cách nói hoặc giọng nói. “Giọng nói” giữ được độ rộng hơn “giọng địa phương,” đồng thời phù hợp việc nhận diện Phi-e-rơ qua cách ông nói.
- source_word: δῆλόν σε ποιεῖ
  choice: làm lộ anh ra
  rationale: Truyền đạt tự nhiên cấu trúc “làm cho anh trở nên rõ/hiển nhiên,” nghĩa là cách nói khiến thân phận hoặc mối liên hệ của Phi-e-rơ bị nhận ra.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Lời thoại mang sắc thái khẳng định chắc chắn. Không thêm “Ga-li-lê” vì câu Hy Lạp chỉ nói đến λαλιά, không nêu đích danh địa phương.
