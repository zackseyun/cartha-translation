revisions:
- from: 'Bấy giờ, Đức Chúa Jêsus phán với người ấy: “Hãy tra gươm của con về chỗ cũ, vì tất cả những ai dùng gươm[a] đều sẽ chết bởi gươm.”'
  to: 'Bấy giờ, Giê-su nói với người ấy: “Hãy đưa gươm của anh trở lại chỗ của nó, vì mọi người cầm lấy gươm[a] sẽ chết bởi gươm.”'
  rationale: Bản sửa loại bỏ tước hiệu không có trong nguyên văn, dùng chính tả hiện đại “Giê-su”, và chuyển “dùng gươm” thành “cầm lấy gươm” để bảo lưu độ mở của λαβόντες. Mệnh lệnh được dịch không giả định cụ thể nơi cất giữ là bao gươm. Chú thích được giữ tại lần xuất hiện thứ nhất của “gươm” và nêu cách hiểu thành ngữ như một khả năng, không áp đặt một lập trường thần học về bạo lực.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T05:45:15Z'
review_pass:
  verdict: revise
  source_fidelity: Bản nháp truyền đạt đúng mệnh lệnh trả vũ khí và cấu trúc châm ngôn của câu. Tuy nhiên, “Đức Chúa Jêsus” thêm tước hiệu không có trong ὁ Ἰησοῦς, còn “dùng gươm” nghiêng câu khái quát sang nghĩa chủ động sử dụng bạo lực hơn phân từ λαβόντες (“đã/cầm lấy”).
  naturalness: “Bấy giờ” và “bởi gươm” phù hợp văn phong Kinh Thánh trang trọng. “Hãy đưa gươm của anh trở lại chỗ của nó” là cách diễn đạt hiện đại, rõ nghĩa hơn “tra gươm ... về chỗ cũ”, vốn có thể gợi cụ thể cái vỏ gươm không được nêu trong nguyên văn. Đại từ “anh” giữ số ít và phù hợp với người nam trong ngữ cảnh.
  terminology: Dùng dạng tên hiện đại chuẩn “Giê-su” thay cho cách viết hệ phái/cũ “Jêsus”. Không thêm “Đức Chúa” vào tên riêng vì nguyên văn tại đây chỉ gọi là “Giê-su”. “Cầm lấy gươm” giữ được độ mở của cách nói Hy Lạp; chú thích nêu cách hiểu thành ngữ mà không biến nó thành nghĩa duy nhất.
  issues:
  - severity: medium
    issue: “Đức Chúa Jêsus” thêm tước hiệu và dùng chính tả tên không phải dạng hiện đại chuẩn.
    rationale: SBLGNT viết ὁ Ἰησοῦς, nghĩa là “Giê-su”, không có κύριος (“Chúa”) hoặc một tước hiệu tương đương. Bản dịch cần không thêm danh hiệu vào lời kể; “Giê-su” là dạng hiện đại chuẩn.
  - severity: medium
    issue: “Dùng gươm” diễn giải λαβόντες quá cụ thể.
    rationale: λαμβάνειν μάχαιραν theo nghĩa đen là “cầm/lấy gươm”; trong ngữ cảnh nó có thể hàm ý dùng bạo lực. Cách dịch “cầm lấy gươm” bảo lưu cả nghĩa mặt chữ lẫn tính châm ngôn, còn chú thích có thể ghi nhận cách hiểu thành ngữ.
  - severity: low
    issue: “Tra gươm ... về chỗ cũ” có thể gợi cái vỏ gươm và “chỗ cũ” không sát bằng “chỗ của nó”.
    rationale: εἰς τὸν τόπον αὐτῆς nói việc đưa thanh gươm trở lại vị trí của nó, nhưng không nêu rõ bao gươm. Cách sửa giữ tính không xác định này.
