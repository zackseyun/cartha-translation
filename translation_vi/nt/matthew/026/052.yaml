  text: τότε λέγει αὐτῷ ὁ Ἰησοῦς· Ἀπόστρεψον ⸂τὴν μάχαιράν σου⸃ εἰς τὸν τόπον αὐτῆς, πάντες γὰρ οἱ λαβόντες μάχαιραν ἐν μαχαίρῃ ⸀ἀπολοῦνται·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/052.yaml
  text: Then Jesus said to him[a], “Put your sword back in its place, for all who take up the sword will perish by the sword.”
translation:
  language: vi
  text: 'Bấy giờ, Giê-su nói với người ấy: “Hãy đưa gươm của anh trở lại chỗ của nó, vì mọi người cầm lấy gươm[a] sẽ chết bởi gươm.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hoặc “cầm gươm”; cách nói này có lẽ chỉ việc dùng đến bạo lực, chứ không chỉ đơn thuần cầm một vũ khí.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Bấy giờ
  rationale: Diễn tả bước tiếp theo trong trình tự tường thuật bằng lối văn tự nhiên và trang trọng.
- source_word: λέγει αὐτῷ
  choice: phán với người ấy
  rationale: Thì hiện tại lịch sử của tiếng Hy Lạp được chuyển sang lối kể quá khứ theo văn phong tiếng Việt; “phán” phù hợp khi Đức Chúa Jêsus nói, còn “người ấy” giữ nguyên đại từ không nêu danh.
- source_word: Ἀπόστρεψον τὴν μάχαιράν σου εἰς τὸν τόπον αὐτῆς
  choice: Hãy tra gươm của con về chỗ cũ
  rationale: Mệnh lệnh yêu cầu hành động ngay; “tra gươm” là cách nói tự nhiên về việc đưa gươm trở lại nơi cất giữ, còn “về chỗ cũ” phản ánh ý quay trả lại vị trí của nó.
- source_word: μάχαιρα
  choice: gươm
  rationale: Từ này có thể chỉ dao, đoản kiếm hoặc gươm; trong cảnh bắt giữ và trong câu nói mang tính châm ngôn, “gươm” là cách dịch rõ ràng, quen thuộc nhất.
- source_word: πάντες γὰρ οἱ λαβόντες μάχαιραν
  choice: vì tất cả những ai dùng gươm
  rationale: Phân từ có mạo từ mang ý khái quát. “Dùng gươm” truyền đạt việc chọn hoặc sử dụng bạo lực bằng vũ khí, đồng thời không loại bỏ nghĩa trực tiếp là cầm lấy gươm.
- source_word: ἐν μαχαίρῃ ἀπολοῦνται
  choice: đều sẽ chết bởi gươm
  rationale: Cách nói này giữ phép đối xứng của câu; trong ngữ cảnh, ἀπόλλυμι chỉ sự mất mạng, nên “chết” tự nhiên và chính xác hơn “hư mất” hoặc “bị hủy diệt” trong tiếng Việt.
theological_decisions:
- issue: Phạm vi lời Đức Chúa Jêsus nói về gươm
  choice: 'Trình bày như một nguyên tắc khái quát: “tất cả những ai dùng gươm ... đều sẽ chết bởi gươm.”'
  alternative: Hiểu đây là lệnh tuyệt đối cấm mọi hình thức dùng vũ lực, hoặc chỉ là lời tiên báo dành riêng cho người môn đồ trong tình huống này.
  rationale: Cấu trúc Hy Lạp có tính khái quát, nhưng bản dịch không nên tự quyết định những ứng dụng thần học vượt quá lời văn.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “Đức Chúa Jêsus” và đại từ “con” theo văn phong Kinh Thánh Tin Lành phổ thông; giữ nhịp điệu ngắn gọn và tính châm ngôn của vế cuối.
