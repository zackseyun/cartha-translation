  source_fidelity: Bản nháp truyền đạt đúng cấu trúc mặc cả của Τί θέλετέ μοι δοῦναι và nghĩa trung tính, rộng của παραδώσω. Tuy nhiên, đặt chú thích sau toàn bộ lời nói khiến điểm neo không trực tiếp gắn với “giao”; và “ông ta” có sắc thái tạo khoảng cách/khinh miệt không được biểu thị bởi nguyên văn.
  naturalness: “Các ông sẵn lòng cho tôi bao nhiêu” và cấu trúc điều kiện “thì tôi sẽ...” tự nhiên, rõ nghĩa trong tiếng Việt hiện đại. “Ông ấy” giữ giọng kể trung tính hơn “ông ta”.
  terminology: Giữ “giao” cho παραδίδωμι, với chú thích nêu “phản bội” như một khả năng theo ngữ cảnh. “Ba mươi đồng bạc” vẫn không áp đặt một mệnh giá cụ thể và phù hợp với ἀργύρια.
  issues:
