  text: εἶπεν· Τί θέλετέ μοι δοῦναι κἀγὼ ὑμῖν παραδώσω αὐτόν; οἱ δὲ ἔστησαν αὐτῷ τριάκοντα ἀργύρια.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/015.yaml
  text: He said[a], “What are you willing to give me, and I will hand him over to you?” And they weighed out for him thirty pieces of silver.
translation:
  language: vi
  text: 'Ông ấy nói: “Các ông sẵn lòng cho tôi bao nhiêu, thì tôi sẽ giao[a] người ấy cho các ông?” Họ cân cho ông ấy ba mươi đồng bạc.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “phản bội người ấy cho các ông.” Động từ Hy Lạp có thể có nghĩa là “giao,” “trao nộp,” hoặc, trong ngữ cảnh này, “phản bội.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί θέλετέ μοι δοῦναι
  choice: Các ông chịu cho tôi bao nhiêu
  rationale: θέλω diễn tả ý muốn hoặc sự sẵn lòng. Trong ngữ cảnh mặc cả, “chịu cho tôi bao nhiêu” truyền đạt tự nhiên sắc thái tự nguyện và hàm ý hỏi số tiền, dù tiếng Hy Lạp dùng đại từ nghi vấn “gì” chứ không nêu trực tiếp “bao nhiêu”.
- source_word: κἀγὼ ὑμῖν παραδώσω αὐτόν
  choice: để tôi giao người ấy cho các ông
  rationale: παραδίδωμι có nghĩa rộng là giao, trao nộp hoặc phó vào tay người khác. “Giao” giữ được nghĩa cơ bản và không đưa sự đánh giá đạo đức “phản bội” trực tiếp vào chính động từ, dù ngữ cảnh rõ ràng là hành vi phản bội.
- source_word: οἱ δὲ
  choice: Họ
  rationale: δέ là liên từ chuyển tiếp nhẹ. Trong tiếng Việt, sang câu mới không nhất thiết phải dịch bằng “và” hay “nhưng”; bỏ liên từ tạo mạch kể tự nhiên mà không làm mất quan hệ ý nghĩa.
- source_word: ἔστησαν αὐτῷ
  choice: cân cho ông ta
  rationale: Trong ngữ cảnh trả bạc, ἔστησαν có thể chỉ việc cân hoặc định lượng số bạc để trao. “Cân cho” giữ hình ảnh giao dịch cụ thể của thời dùng bạc theo trọng lượng, thay vì khái quát thành “trả” hoặc “định giá”.
- source_word: τριάκοντα ἀργύρια
  choice: ba mươi đồng bạc
  rationale: ἀργύρια chỉ những miếng hoặc đồng tiền bằng bạc mà không nêu rõ mệnh giá. “Đồng bạc” là cách diễn đạt tự nhiên, dễ hiểu trong tiếng Việt và không tự ý xác định loại tiền.
theological_decisions:
- issue: Cách dịch παραδώσω trong lời đề nghị của Giu-đa
  choice: giao người ấy
  alternative: phản bội người ấy mà giao cho các ông; nộp người ấy
  rationale: “Giao” bảo toàn phạm vi nghĩa rộng của động từ Hy Lạp và sự căng thẳng giữa hành động được mô tả với ý nghĩa đạo đức hiển nhiên trong ngữ cảnh. Chú thích nêu rõ cách hiểu “phản bội” mà không biến nó thành nghĩa duy nhất của động từ.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Ông ta” giúp nối chủ thể Giu-đa từ ngữ cảnh trước mà không thêm tên không có trong câu; “người ấy” duy trì đại từ chỉ Chúa Giê-su của nguyên văn. Cấu trúc câu hỏi được điều chỉnh nhẹ theo lối mặc cả tự nhiên trong tiếng Việt.
