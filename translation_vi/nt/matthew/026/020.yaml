- from: Khi chiều tối đến, Đức Chúa Jêsus ngồi vào bàn ăn[a] cùng mười hai môn đồ.
  to: Khi chiều đến, Đức Giê-su ngả mình dùng bữa với mười hai môn đệ[a].
  rationale: Bản sửa giữ nguyên ý thời gian và nhóm người được nêu trong bản SBLGNT, đồng thời dịch ἀνέκειτο bằng “ngả mình dùng bữa” để bảo toàn tư thế dùng bữa theo phong tục cổ. Thuật ngữ và chính tả được hiện đại hóa; dấu chú thích được chuyển đến đúng cụm có biến thể bản văn.
