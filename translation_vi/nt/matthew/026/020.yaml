review_pass:
  verdict: revise
  source_fidelity: 'Bản nháp chuyển đạt đúng khung thời gian, sự đồng hành với Nhóm Mười Hai, và danh từ μαθητῶν. Tuy nhiên, “ngồi vào bàn ăn” làm mất nét nghĩa đặc thù của ἀνέκειτο: tư thế ngả/nằm tựa khi dùng bữa, chứ không chỉ là ngồi xuống bàn.'
  naturalness: “Khi chiều đến” và “ngả mình dùng bữa với” là cách diễn đạt hiện đại, tự nhiên, đồng thời vẫn cho thấy phong tục dùng bữa hàm trong động từ Hy Lạp. “Môn đệ” và cách viết “Giê-su” phù hợp tiếng Việt chuẩn hiện đại hơn “môn đồ” và “Jêsus.”
  terminology: Dùng “Đức Giê-su” theo cách gọi trang trọng, hiện đại; dùng “môn đệ” cho μαθηταί. Chú thích biến thể cần được neo sau cụm “mười hai môn đệ”, vì biến thể liên quan trực tiếp đến μαθητῶν, không liên quan đến “bàn ăn.”
  issues:
  - severity: medium
    issue: “ngồi vào bàn ăn” chưa phản ánh đầy đủ ἀνέκειτο.
    rationale: Động từ này trong bối cảnh bữa ăn chỉ tư thế ngả/nằm tựa để dùng bữa. Bản dịch nên giữ nét này mà không diễn giải quá mức.
  - severity: low
    issue: Dấu chú thích đang đặt sau “bàn ăn”.
    rationale: Biến thể được nêu là có/không có μαθητῶν (“môn đệ”), nên dấu neo phải đặt sau cụm “mười hai môn đệ.”
  - severity: low
    issue: “Jêsus” và “môn đồ” không phải lựa chọn chuẩn nhất cho tiếng Việt hiện đại.
    rationale: “Giê-su” và “môn đệ” là các hình thức hiện hành, trung tính và dễ hiểu trong bản dịch tiếng Việt chuẩn hiện đại.
  revised_text: Khi chiều đến, Đức Giê-su ngả mình dùng bữa với mười hai môn đệ[a].
