  text: When evening came[a], he reclined at the table with the twelve disciples.
translation:
  language: vi
  text: Khi chiều đến, Đức Giê-su ngả mình dùng bữa với mười hai môn đệ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Một số bản chép tay chỉ ghi “với mười hai người” thay vì “với mười hai môn đệ.”
    reason: textual_variant
lexical_decisions:
- source_word: Ὀψίας δὲ γενομένης
  choice: Khi chiều tối đến
  rationale: Cụm sở hữu cách tuyệt đối nêu thời điểm. Cách dịch này tự nhiên trong tiếng Việt hiện đại và giữ đúng ý nghĩa thời gian.
- source_word: ἀνέκειτο
  choice: ngồi vào bàn ăn
  rationale: Động từ chỉ tư thế tựa mình dùng bữa theo phong tục thời ấy. Dịch sát là “nằm tựa”, nhưng “ngồi vào bàn ăn” truyền đạt tự nhiên chức năng của hành động trong tiếng Việt mà không khiến độc giả hiểu đơn thuần là nằm xuống.
- source_word: μετὰ
  choice: cùng
  rationale: Với sở hữu cách, μετά biểu thị sự đồng hành; “cùng” là cách diễn đạt ngắn gọn và tự nhiên.
- source_word: τῶν δώδεκα μαθητῶν
  choice: mười hai môn đồ
  rationale: μαθητῶν có trong bản SBLGNT nên được dịch. “Môn đồ” là thuật ngữ quen thuộc, chính xác trong văn cảnh các sách Phúc Âm.
