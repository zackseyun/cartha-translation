  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὁ δὲ Πέτρος ἠκολούθει αὐτῷ ἀπὸ μακρόθεν ἕως τῆς αὐλῆς τοῦ ἀρχιερέως, καὶ εἰσελθὼν ἔσω ἐκάθητο μετὰ τῶν ὑπηρετῶν ἰδεῖν τὸ τέλος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/058.yaml
  text: But Peter was following him from a distance[a], as far as the courtyard of the high priest. And after going inside[b], he sat with the officers to see the outcome.
translation:
  language: vi
  text: Nhưng Phi-e-rơ theo Ngài từ đằng xa, đến tận sân của thầy thượng tế. Sau khi vào bên trong, ông ngồi cùng những người phục dịch[a] để xem kết cuộc ra sao[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “những người phục vụ”, “những người hầu cận” hoặc “lính canh”. Từ Hy Lạp ὑπηρέται có thể chỉ những nhân viên cấp dưới hoặc người phục vụ; sắc thái chính xác tùy thuộc ngữ cảnh.
    reason: lexical_alternative
  - marker: b
    text: Hay “để xem cái kết”. Cụm từ Hy Lạp τὸ τέλος theo nghĩa sát hơn là “cái kết”, nhưng ở đây có lẽ chỉ kết quả của những gì sẽ xảy đến với Đức Giê-su.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠκολούθει
  choice: theo
  rationale: Thì vị hoàn diễn tả hành động đang tiếp diễn trong bối cảnh; tiếng Việt tự nhiên có thể biểu đạt phương diện này bằng mạch kể mà không nhất thiết thêm “đang”.
- source_word: ἀπὸ μακρόθεν
  choice: từ đằng xa
  rationale: Cách nói tự nhiên trong tiếng Việt hiện đại, giữ rõ khoảng cách về không gian.
- source_word: ἕως τῆς αὐλῆς
  choice: đến tận sân
  rationale: “Đến tận” thể hiện giới hạn hay phạm vi của ἕως; “sân” chỉ khu sân có bao quanh tại tư dinh thầy thượng tế.
- source_word: ἀρχιερέως
  choice: thầy thượng tế
  rationale: Thuật ngữ quen thuộc, chính xác trong bối cảnh trình thuật thương khó.
- source_word: εἰσελθὼν ἔσω
  choice: sau khi vào bên trong
  rationale: 'Diễn đạt tự nhiên quan hệ thời gian: hành động đi vào xảy ra trước hành động ngồi.'
- source_word: ἐκάθητο
  choice: ông ngồi
  rationale: Thì vị hoàn gợi tư thế kéo dài; trong tiếng Việt, “ngồi” sau mệnh đề chỉ trình tự vừa tự nhiên vừa có thể bao hàm trạng thái tiếp diễn.
- source_word: μετὰ τῶν ὑπηρετῶν
  choice: cùng các thuộc hạ
  rationale: ὑπηρέται chỉ những người phục vụ hoặc nhân viên cấp dưới gắn với nhà thầy thượng tế; “thuộc hạ” giữ được vai trò chức năng mà không xác định quá mức rằng họ là lính canh.
- source_word: ἰδεῖν
  choice: để xem
  rationale: Giữ trực tiếp ý nghĩa mục đích của động từ nguyên mẫu.
- source_word: τὸ τέλος
  choice: kết cuộc ra sao
  rationale: Trong ngữ cảnh, cụm từ hướng đến kết quả của sự việc; cách dịch này rõ nghĩa trong tiếng Việt nhưng vẫn gần với nghĩa đen “cái kết”.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” cho đại từ αὐτῷ theo ngữ cảnh chỉ Đức Giê-su, đồng thời không lặp tên không có trong câu Hy Lạp. Các dấu chú thích được đặt ngay sau đúng từ ngữ có phương án dịch thay thế.
