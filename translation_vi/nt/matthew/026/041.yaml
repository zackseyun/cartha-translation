id: MAT.26.41
reference: Matthew 26:41
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: γρηγορεῖτε καὶ προσεύχεσθε, ἵνα μὴ εἰσέλθητε εἰς πειρασμόν· τὸ μὲν πνεῦμα πρόθυμον ἡ δὲ σὰρξ ἀσθενής.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/041.yaml
  text: Stay awake and pray[a], so that you may not enter into temptation. The spirit indeed is willing, but the flesh is weak.
translation:
  language: vi
  text: Hãy tỉnh thức và cầu nguyện, để anh em không rơi vào cám dỗ.[a] Tinh thần thì sẵn lòng, nhưng xác thịt yếu đuối.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “thử thách” hoặc “thử luyện”. Từ Hy Lạp πειρασμός có thể chỉ sự lôi kéo phạm tội hoặc một hoàn cảnh thử thách.
    reason: lexical_alternative
lexical_decisions:
- source_word: γρηγορεῖτε
  choice: Hãy tỉnh thức
  rationale: Mệnh lệnh số nhiều có nghĩa là thức/canh thức. Trong bối cảnh các môn đồ vừa ngủ, “tỉnh thức” vừa gợi sự thức về thể chất vừa giữ sắc thái cảnh giác thuộc linh.
- source_word: προσεύχεσθε
  choice: cầu nguyện
  rationale: Cách diễn đạt chuẩn, tự nhiên cho mệnh lệnh hiện tại; kết hợp với “hãy tỉnh thức” vẫn truyền đạt lời kêu gọi tiếp tục hành động.
- source_word: ἵνα μὴ εἰσέλθητε
  choice: để anh em không sa vào
  rationale: ἵνα μή diễn tả mục đích/ngăn ngừa. “Sa vào” là cách nói tự nhiên trong tiếng Việt khi đi với “cơn cám dỗ”, tuy ít sát hình ảnh “đi vào” hơn; nó không hàm ý rằng họ nhất thiết đã phạm tội.
- source_word: πειρασμόν
  choice: cơn cám dỗ
  rationale: Trong ngữ cảnh áp lực sắp đến và nguy cơ thất bại về đạo đức, “cám dỗ” phù hợp nhất. Danh từ này cũng có thể chỉ thử thách hoặc thử luyện, nên ghi chú giữ lại phạm vi nghĩa.
- source_word: τὸ μὲν πνεῦμα
  choice: Tâm thần thì
  rationale: “Tâm thần” chỉ phần bên trong/ý hướng của con người và tạo đối lập tự nhiên với “xác thịt”; chữ thường tránh khẳng định đây là Đức Thánh Linh. Tiểu từ μέν được thể hiện bằng cấu trúc “thì... nhưng...”.
- source_word: πρόθυμον
  choice: sẵn lòng
  rationale: Diễn đạt tự nhiên ý sẵn sàng, có thiện chí hoặc mong muốn hành động, không cường điệu thành nhiệt tình mạnh mẽ.
- source_word: ἡ δὲ σὰρξ
  choice: nhưng xác thịt lại
  rationale: Giữ hình ảnh Kinh Thánh của σάρξ và sự căng thẳng với “tâm thần”, thay vì giải nghĩa thành “bản tính tội lỗi”. Từ “lại” làm rõ nét tương phản μέν...δέ.
- source_word: ἀσθενής
  choice: yếu đuối
  rationale: Truyền đạt trực tiếp sự yếu kém, bất lực của con người trong bối cảnh các môn đồ không thể tiếp tục tỉnh thức.
theological_decisions:
- issue: Đối tượng quy chiếu của πνεῦμα
  choice: Tâm thần/phần bên trong của con người
  alternative: Đức Thánh Linh
  rationale: Sự đối lập với “xác thịt” và việc các môn đồ có ý tốt nhưng thất bại nghiêng về tâm thần hay ý hướng bên trong của con người. Cách viết không hoa tránh đưa vào một khẳng định thần học mà câu văn không nói rõ.
- issue: Cách dịch σάρξ
  choice: xác thịt
  alternative: thân thể; bản tính tội lỗi
  rationale: Ở đây từ này nói đến sự yếu đuối hữu hạn của con người, không nhất thiết là phạm trù “bản tính tội lỗi”. “Xác thịt” giữ nguyên ẩn dụ và sự căng thẳng thần học của nguyên văn.
- issue: Sắc thái của πειρασμός
  choice: cám dỗ trong chính văn
  alternative: thử thách; thử luyện
  rationale: Nguy cơ các môn đồ thất bại dưới áp lực khiến “cám dỗ” phù hợp trong câu chính, nhưng ghi chú giữ lại sự đa nghĩa thật sự của từ Hy Lạp.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng đại từ “anh em” để thể hiện mệnh lệnh số nhiều hướng đến các môn đồ. Cấu trúc “thì... nhưng...” giữ rõ thế đối lập của μέν...δέ.
