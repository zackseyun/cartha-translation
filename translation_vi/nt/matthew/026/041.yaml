- from: Hãy tỉnh thức và cầu nguyện, để anh em không sa vào cơn cám dỗ.[a] Tâm thần thì sẵn lòng, nhưng xác thịt lại yếu đuối.
  to: Hãy tỉnh thức và cầu nguyện, để anh em không rơi vào cám dỗ.[a] Tinh thần thì sẵn lòng, nhưng xác thịt yếu đuối.
  rationale: 'Sửa hai cách diễn đạt để phù hợp tiếng Việt hiện đại mà không thay đổi nghĩa: “tinh thần” thay cho “tâm thần” nhằm chỉ ý hướng sẵn lòng của con người; “rơi vào cám dỗ” thay cho “sa vào cơn cám dỗ” nhằm có lối diễn đạt gọn, tự nhiên. Giữ nguyên đối lập “tinh thần/xác thịt”, sắc thái không viết hoa của πνεῦμα, và chú thích về tính đa nghĩa của πειρασμός.'
