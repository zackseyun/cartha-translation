  source_fidelity: Bản dịch truyền đạt đúng hai mệnh lệnh số nhiều, mệnh đề mục đích nhằm tránh πειρασμόν, và thế tương phản μέν...δέ giữa πνεῦμα sẵn lòng với σάρξ yếu đuối. Tuy nhiên, “tâm thần” trong tiếng Việt hiện đại thường gợi lĩnh vực tâm lý/tâm thần học, không phải cách tự nhiên để chỉ ý hướng nội tâm trong câu này.
  naturalness: “Hãy tỉnh thức và cầu nguyện” tự nhiên, trang trọng và phù hợp ngữ cảnh. Nên thay “tâm thần” bằng “tinh thần”, là cách nói hiện đại, rõ nghĩa hơn trong sự đối lập với “xác thịt”. “Rơi vào cám dỗ” cũng là cách diễn đạt thông dụng, vẫn giữ được hình ảnh bị đưa vào/ở trong πειρασμόν mà không khẳng định hành vi phạm tội đã xảy ra.
  terminology: 'Giữ “xác thịt” là thích đáng: câu nói nhấn mạnh sự yếu đuối của con người, không đòi hỏi diễn giải thành “bản tính tội lỗi”. “Cám dỗ” phù hợp chính văn; chú thích đúng khi bảo lưu các nghĩa “thử thách” và “thử luyện”.'
