reference: Matthew 26:18
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν· Ὑπάγετε εἰς τὴν πόλιν πρὸς τὸν δεῖνα καὶ εἴπατε αὐτῷ· Ὁ διδάσκαλος λέγει· Ὁ καιρός μου ἐγγύς ἐστιν· πρὸς σὲ ποιῶ τὸ πάσχα μετὰ τῶν μαθητῶν μου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/018.yaml
  text: He said[a], “Go into the city to a certain man and tell him, ‘The Teacher says, “My time is near[c][b]. I am keeping the Passover with you with my disciples.”’”
translation:
  language: vi
  text: 'Ngài đáp: “Hãy vào thành, đến gặp một người nọ[a] và nói với ông ấy: ‘Thầy nói: Thời điểm của tôi đã đến gần. Tôi sẽ cử hành lễ Vượt Qua tại chỗ ông[b], cùng với các môn đồ của tôi.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn chỉ một người cụ thể nhưng không nêu tên; cũng có thể dịch là “ông X”.
    reason: lexical_alternative
  - marker: b
    text: Sát nghĩa là “với ông” hoặc “nơi ông”; trong văn cảnh, ý nói tại chỗ của người ấy, có thể là nhà ông.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὑπάγετε
  choice: Hãy vào thành
  rationale: Mệnh lệnh chỉ sự di chuyển; cách diễn đạt này tự nhiên trong tiếng Việt và kết hợp trực tiếp với εἰς τὴν πόλιν.
- source_word: πρὸς τὸν δεῖνα
  choice: đến gặp một người kia
  rationale: δεῖνα chỉ một người cụ thể nhưng cố ý không nêu tên; “một người kia” giữ được tính xác định mà không quá khẩu ngữ.
- source_word: Ὁ διδάσκαλος
  choice: Thầy
  rationale: Trong lời nhắn trực tiếp, “Thầy” là danh xưng tự nhiên, trang trọng vừa phải và đúng nghĩa διδάσκαλος.
- source_word: Ὁ καιρός μου ἐγγύς ἐστιν
  choice: Thời điểm của tôi đã gần
  rationale: καιρός có thể chỉ thời điểm có ý nghĩa hoặc đã định; bản dịch không thu hẹp thành giờ chết hay chỉ riêng bữa ăn.
- source_word: πρὸς σὲ
  choice: tại chỗ ông
  rationale: Giữ sắc thái hướng đến/ngụ tại nơi của người nhận mà không thêm rõ “nhà”, điều nguyên văn không nói trực tiếp.
- source_word: ποιῶ τὸ πάσχα
  choice: Tôi sẽ dự lễ Vượt Qua
  rationale: ποιέω với πάσχα là thành ngữ chỉ việc cử hành/giữ lễ Vượt Qua. Thì hiện tại có thể mang sắc thái dự định chắc chắn; tiếng Việt dùng “sẽ” tự nhiên trong lời báo trước.
- source_word: μετὰ τῶν μαθητῶν μου
  choice: cùng với các môn đồ của tôi
  rationale: “Môn đồ” giữ được quan hệ thầy-trò và ý nghĩa quen thuộc trong văn cảnh Phúc Âm.
theological_decisions:
- issue: Phạm vi ý nghĩa của καιρός sắp đến
  choice: Thời điểm của tôi đã gần
  alternative: Thời điểm đã định cho tôi đã gần; Giờ của tôi đã gần
  rationale: Câu này báo một thời điểm hệ trọng đang đến nhưng không tự xác định đó chỉ là cái chết, bữa lễ, hay toàn bộ cao trào sứ mạng; bản dịch giữ nguyên độ mở ấy.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” cho chủ thể là Chúa Giê-su, “Thầy” trong lời tự xưng được truyền đạt, và “ông” cho người nhận chưa nêu tên. Dấu ngoặc kép phân tầng lời nói rõ ràng.
