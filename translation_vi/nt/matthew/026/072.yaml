  text: καὶ πάλιν ἠρνήσατο μετὰ ὅρκου ὅτι Οὐκ οἶδα τὸν ἄνθρωπον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/072.yaml
  text: 'And again he denied it with an oath: “I do not know the man.”[a]'
translation:
  language: vi
  text: 'Ông lại lấy lời thề mà chối: “Tôi không biết người ấy.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Ông lại chối điều đó”; trong tiếng Hy Lạp, sau động từ “chối” là nội dung của lời chối.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ πάλιν
  choice: Ông lại
  rationale: “Lại” diễn đạt sự lặp lại của hành động chối; tiếng Việt không cần dịch καὶ thành một liên từ riêng ở đầu câu để giữ mạch kể tự nhiên.
- source_word: ἠρνήσατο
  choice: chối
  rationale: Trong ngữ cảnh Phi-e-rơ không nhận biết Đức Chúa Jêsus, “chối” là từ ngắn gọn, tự nhiên và giữ được mối liên hệ với các lần chối trước.
- source_word: μετὰ ὅρκου
  choice: lấy lời thề mà
  rationale: Diễn đạt việc lời chối đi kèm một lời thề, nhưng không gợi đến thủ tục tuyên thệ chính thức trước tòa.
- source_word: ὅτι
  choice: ':'
  rationale: ὅτι giới thiệu nội dung lời chối; dấu hai chấm và lời nói trực tiếp là cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: Οὐκ οἶδα
  choice: Tôi không biết
  rationale: Chuyển tải trực tiếp lời phủ nhận sự quen biết, với sắc thái trang trọng vừa phải.
- source_word: τὸν ἄνθρωπον
  choice: người ấy
  rationale: Giữ cách gọi gián cách của Phi-e-rơ thay vì thay bằng “Ngài” hoặc “Jêsus”; “người ấy” tự nhiên hơn cách dịch máy móc mạo từ xác định.
theological_decisions:
- issue: Đối tượng được gọi là τὸν ἄνθρωπον trong lời chối của Phi-e-rơ
  choice: Giữ cách nói “người ấy”.
  alternative: “Ngài”, “ông ấy” hoặc “Jêsus”
  rationale: Nguyên văn dùng danh từ “người” chứ không nêu tên hay dùng đại từ. Cách dịch này bảo toàn sắc thái Phi-e-rơ cố tình tạo khoảng cách, không làm nhẹ sức nặng của lời chối.
- issue: Tân ngữ của động từ ἠρνήσατο
  choice: Không thêm tân ngữ trong chính văn; để nội dung trích dẫn làm rõ điều bị chối.
  alternative: “chối điều đó”
  rationale: Nguyên văn đặt động từ chối trước mệnh đề nêu nội dung. Tiếng Việt có thể dùng “chối” theo cách này mà không cần xác định thêm một tân ngữ vốn không được nói rõ.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm nhưng dễ hiểu. Cấu trúc “lấy lời thề mà chối” giữ quan hệ đi kèm của μετὰ ὅρκου và tránh sắc thái pháp đình mà “tuyên thệ” có thể gợi ra.
