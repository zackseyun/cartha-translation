id: MAT.26.39
reference: Matthew 26:39
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ⸀προελθὼν μικρὸν ἔπεσεν ἐπὶ πρόσωπον αὐτοῦ προσευχόμενος καὶ λέγων· Πάτερ μου, εἰ δυνατόν ἐστιν, παρελθάτω ἀπ’ ἐμοῦ τὸ ποτήριον τοῦτο· πλὴν οὐχ ὡς ἐγὼ θέλω ἀλλ’ ὡς σύ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/039.yaml
  text: And going a little farther[a], he fell on his face, praying and saying, “My Father, if it is possible, let this cup pass from me; yet not as I will[b], but as you will.”
translation:
  language: vi
  text: 'Ngài đi thêm một quãng ngắn, rồi ngã sấp mặt xuống đất[a] và cầu nguyện rằng: “Cha của con, nếu có thể được, xin cho chén này lìa khỏi con[b]. Tuy nhiên, không như con muốn, nhưng như Cha muốn.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “phủ phục xuống đất.”'
    reason: lexical_alternative
  - marker: b
    text: “Chén” là hình ảnh Kinh Thánh chỉ phần được định, đặc biệt là sự đau khổ; xem Ma-thi-ơ 20:22 và 26:42.
    reason: cross_reference
lexical_decisions:
- source_word: προελθὼν μικρὸν
  choice: đi xa hơn một quãng ngắn
  rationale: Diễn đạt việc đi tiếp một khoảng ngắn và giữ được sắc thái so sánh của προέρχομαι trong ngữ cảnh.
- source_word: ἔπεσεν ἐπὶ πρόσωπον αὐτοῦ
  choice: sấp mặt xuống đất
  rationale: Đây là cách nói tự nhiên trong tiếng Việt về tư thế phủ phục; chú thích giữ lại khả năng dịch sát động từ ἔπεσεν là “ngã sấp mặt xuống đất”.
- source_word: προσευχόμενος καὶ λέγων
  choice: và cầu nguyện
  rationale: Trong tiếng Việt, lời cầu nguyện được trích dẫn ngay sau dấu hai chấm nên không cần lặp thêm “và nói”; cách diễn đạt vẫn thể hiện hành động đồng thời và giữ dòng kể tự nhiên.
- source_word: Πάτερ μου
  choice: Cha của con
  rationale: Giữ cả quan hệ thân mật lẫn lòng tôn kính trong lời xưng hô trực tiếp, không thêm sắc thái tình cảm ngoài nguyên văn.
- source_word: εἰ δυνατόν ἐστιν
  choice: nếu có thể được
  rationale: Phản ánh đầy đủ mệnh đề điều kiện mà không tự ý chỉ rõ điều gì khiến việc ấy có thể.
- source_word: παρελθάτω ἀπ’ ἐμοῦ
  choice: xin cho ... lìa khỏi con
  rationale: Thể hiện thể mệnh lệnh mang ý cầu xin và hướng chuyển động ra khỏi người nói; “lìa khỏi” trang trọng nhưng vẫn dễ hiểu.
- source_word: τὸ ποτήριον τοῦτο
  choice: chén này
  rationale: Giữ nguyên hình ảnh ẩn dụ của nguyên văn thay vì giải nghĩa ngay thành sự đau khổ hay số phận.
- source_word: πλὴν
  choice: tuy vậy
  rationale: Đánh dấu rõ sự chuyển ý mạnh từ lời cầu xin sang sự thuận phục.
- source_word: οὐχ ὡς ἐγὼ θέλω ἀλλ’ ὡς σύ
  choice: không theo ý muốn của con, mà theo ý muốn của Cha
  rationale: Giữ sự đối chiếu giữa ý muốn của Chúa Giê-xu và ý muốn của Cha, đồng thời bổ sung thành phần tỉnh lược ở vế sau để tiếng Việt rõ nghĩa.
theological_decisions:
- issue: Hình ảnh “chén” trong lời cầu nguyện của Chúa Giê-xu
  choice: Giữ “chén này” trong chính văn
  alternative: nỗi đau khổ này; số phận này
  rationale: ποτήριον là một hình ảnh Kinh Thánh về phần được định, đặc biệt là đau khổ; giữ nguyên hình ảnh bảo toàn chiều sâu liên văn bản và không thu hẹp nghĩa quá sớm.
- issue: Ý muốn của Chúa Giê-xu trong tương quan với ý muốn của Cha
  choice: Dịch θέλω bằng “ý muốn” ở cả hai vế
  alternative: điều con muốn ... điều Cha muốn
  rationale: “Ý muốn” vừa tự nhiên vừa giữ được sức nặng của sự tương phản và sự thuận phục, không làm mờ ý chí thực sự được bày tỏ trong lời cầu nguyện.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và dễ hiểu. Dùng “Ngài” trong lời kể và cặp xưng hô “Cha—con” trong lời cầu nguyện. Giữ hình ảnh “chén” và sự căng thẳng giữa hai ý muốn mà không diễn giải theo một lập trường hệ phái.
