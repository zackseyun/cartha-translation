revisions:
- from: 'Ngài đi xa hơn một quãng ngắn, rồi sấp mặt xuống đất[a] và cầu nguyện: “Cha của con, nếu có thể được, xin cho chén này lìa khỏi con[b]. Tuy vậy, không theo ý muốn của con, mà theo ý muốn của Cha.”'
  to: 'Ngài đi thêm một quãng ngắn, rồi ngã sấp mặt xuống đất[a] và cầu nguyện rằng: “Cha của con, nếu có thể được, xin cho chén này lìa khỏi con[b]. Tuy nhiên, không như con muốn, nhưng như Cha muốn.”'
  rationale: Bản sửa phục hồi động tác “ngã” trong nguyên ngữ, làm cụm chỉ chuyển động ngắn gọn và tự nhiên hơn, đồng thời diễn đạt trực tiếp sự tương phản “con muốn—Cha muốn.” Hình ảnh “chén,” tính điều kiện của lời xin, và giọng điệu trang nghiêm đều được giữ nguyên.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T05:45:02Z'
