  naturalness: 'Cần điều chỉnh nhẹ để tiếng Việt hiện đại tự nhiên hơn: “đi thêm một quãng ngắn,” “ngã sấp mặt xuống đất,” và cấu trúc trực tiếp “không như con muốn, nhưng như Cha muốn.”'
  terminology: “Ngài,” cặp xưng hô “Cha—con,” và “chén này” phù hợp văn phong trang nghiêm và bảo tồn các thuật ngữ, hình ảnh trọng yếu. Chú thích về “chén” hữu ích, không áp đặt cách giải thích giáo phái.
