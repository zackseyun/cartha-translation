- from: 'Nhưng Phi-e-rơ thưa với Ngài: “Dù tất cả mọi người đều vấp ngã vì Ngài[a], con sẽ không bao giờ vấp ngã.”'
  to: 'Nhưng Phi-e-rơ thưa Ngài: “Dù tất cả đều vấp ngã vì Ngài[a], con sẽ không bao giờ vấp ngã.”'
  rationale: 'Chỉ chỉnh hai điểm nhỏ để sát nguyên ngữ và tự nhiên hơn: thay “tất cả mọi người” bằng “tất cả”, và dùng “thưa Ngài” thay cho “thưa với Ngài”. Giữ nguyên cách hiểu không giáo phái của σκανδαλίζω, sự lặp lại của động từ trong câu, và neo chú thích ngay sau cụm được giải thích.'
