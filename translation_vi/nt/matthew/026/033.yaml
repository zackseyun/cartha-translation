  source_fidelity: 'Bản dịch phản ánh đúng cấu trúc chính: δέ được chuyển là “Nhưng”; công thức ἀποκριθεὶς ... εἶπεν được diễn đạt tự nhiên bằng “thưa”; mệnh đề nhượng bộ “Dù”; hai lần σκανδαλίζω được dịch nhất quán là “vấp ngã”; và “vì Ngài” diễn đạt hợp lý ἐν σοί. Tuy nhiên, “tất cả mọi người” thêm danh từ “mọi người”, trong khi πάντες ở đây chỉ “tất cả” theo nhóm môn đồ trong ngữ cảnh mà không nêu danh từ. Bỏ phần thêm này giữ sát nguồn hơn mà vẫn tự nhiên.'
