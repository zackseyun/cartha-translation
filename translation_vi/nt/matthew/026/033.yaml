source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ὁ Πέτρος εἶπεν αὐτῷ· Εἰ πάντες σκανδαλισθήσονται ἐν σοί, ⸀ἐγὼ οὐδέποτε σκανδαλισθήσομαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/033.yaml
  text: But Peter answered him[a], “Even if all fall away because of you, I will never fall away.”
translation:
  language: vi
  text: 'Nhưng Phi-e-rơ thưa Ngài: “Dù tất cả đều vấp ngã vì Ngài[a], con sẽ không bao giờ vấp ngã.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “sa ngã”, “lìa bỏ Ngài” hoặc “bị làm cho vấp”. Động từ Hy Lạp có thể chỉ việc bị vấp, bị xúc phạm hoặc dao động vì ai đó, hay lìa bỏ lòng trung thành.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ Πέτρος εἶπεν αὐτῷ
  choice: Nhưng Phi-e-rơ thưa với Ngài
  rationale: Cụm phân từ ἀποκριθείς đi với động từ εἶπεν là công thức kể chuyện có nghĩa ‘đáp lời mà nói’. Tiếng Việt tự nhiên có thể gọn thành ‘thưa’; ‘nhưng’ thể hiện sắc thái tương phản của δέ, còn ‘với Ngài’ giữ αὐτῷ và phù hợp cách Phi-e-rơ nói với Chúa Giê-xu.
- source_word: Εἰ πάντες
  choice: Dù tất cả mọi người
  rationale: Εἰ về hình thức là ‘nếu’, nhưng trong lời khẳng định đầy tương phản của Phi-e-rơ, mệnh đề có lực nhượng bộ; ‘dù’ diễn đạt tự nhiên sắc thái ‘ngay cả nếu’.
- source_word: σκανδαλισθήσονται / σκανδαλισθήσομαι
  choice: vấp ngã
  rationale: Động từ σκανδαλίζω ở thể bị động có thể chỉ bị làm cho vấp, bị dao động hoặc lìa bỏ lòng trung thành. ‘Vấp ngã’ giữ được hình ảnh và độ rộng nghĩa, không mặc nhiên biến lời này thành một thuật ngữ giáo lý về sự bội đạo chung cuộc.
- source_word: ἐν σοί
  choice: vì Ngài
  rationale: 'Với σκανδαλίζω, ἐν σοί diễn tả nguyên nhân hoặc mối liên hệ: vấp ngã vì cớ Chúa Giê-xu. ‘Vì Ngài’ ngắn gọn và tự nhiên trong tiếng Việt.'
- source_word: ἐγὼ οὐδέποτε
  choice: con sẽ không bao giờ
  rationale: Đại từ ἐγώ được nêu rõ để đối lập Phi-e-rơ với ‘tất cả mọi người’, còn οὐδέποτε là phủ định thời gian mạnh. Cách xưng ‘con’ thể hiện người môn đồ trực tiếp thưa với Chúa Giê-xu; ‘không bao giờ’ giữ sức nhấn mạnh.
theological_decisions:
- issue: Nghĩa của σκανδαλίζω trong bối cảnh môn đồ thất bại
  choice: vấp ngã
  alternative: lìa bỏ Ngài; sa ngã; bị xúc phạm
  rationale: Bối cảnh nói đến các môn đồ bỏ Chúa Giê-xu khi gặp áp lực, nhưng từ Hy Lạp vẫn chứa hình ảnh bị làm cho vấp và không tự nó xác định đây là sự bội đạo chung cuộc. ‘Vấp ngã’ bảo tồn độ mở và sự căng thẳng thần học ấy; chú thích nêu nghĩa mạnh hơn.
- issue: Cách xưng hô của Phi-e-rơ với Chúa Giê-xu
  choice: con—Ngài
  alternative: tôi—ông; con—Thầy
  rationale: Bản Hy Lạp chỉ có đại từ ‘tôi’ và ‘ngài/ông’, không ghi danh xưng ‘Thầy’. ‘Con—Ngài’ là lối xưng hô kính trọng, tự nhiên trong văn phong Kinh Thánh tiếng Việt, nhưng không thêm một tước hiệu không có trong câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng ‘thưa’ để diễn đạt tự nhiên công thức ‘đáp lời mà nói’, đồng thời giữ sự tương phản bằng ‘nhưng’. Dấu chú thích [a] được đặt ngay sau cụm từ mà nó giải thích.
