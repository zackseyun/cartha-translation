  text: and they did not find any[a], though many false witnesses had come forward. But later two came forward
translation:
  language: vi
  text: Và họ không tìm được gì[a], mặc dù nhiều nhân chứng giả đã đến trình diện. Về sau, có hai người đến trình diện.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “họ không tìm thấy gì.” Tiếng Hy Lạp không nêu rõ tân ngữ; theo ngữ cảnh, điều được tìm là lời chứng hoặc một lời buộc tội chống lại Đức Giê-su.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐχ εὗρον
  choice: họ không tìm được gì
  rationale: Tân ngữ được hàm ý từ ngữ cảnh câu 59, tức lời chứng hay cáo buộc có thể dùng để kết án Đức Giê-su. Cách dịch này giữ sự không xác định của nguyên văn thay vì tự ý thêm một tân ngữ cụ thể.
- source_word: πολλῶν προσελθόντων ψευδομαρτύρων
  choice: dù nhiều nhân chứng giả đã ra làm chứng
  rationale: Kết cấu sở hữu cách tuyệt đối mang ý nhượng bộ trong ngữ cảnh xét xử. “Nhân chứng giả” giữ đúng vai trò pháp lý của ψευδομαρτύρων; “ra làm chứng” diễn đạt tự nhiên hành động tiến ra trước hội đồng.
- source_word: ὕστερον δὲ
  choice: Sau đó
  rationale: ὕστερον đánh dấu thời điểm muộn hơn trong tiến trình xét xử, còn δέ làm nhiệm vụ chuyển tiếp nhẹ. “Sau đó” tự nhiên và đủ thể hiện bước chuyển của câu chuyện.
- source_word: προσελθόντες δύο
  choice: có hai người ra làm chứng
  rationale: Trong bối cảnh pháp đình, προσέρχομαι không chỉ là đến gần về mặt không gian mà là bước ra trình bày lời chứng. Cấu trúc “có hai người” bảo toàn trọng tâm đặt trên con số hai.
