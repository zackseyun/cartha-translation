  naturalness: Văn phong nhìn chung tự nhiên, trang trọng và phù hợp tiếng Việt hiện đại. “Chúng ta còn cần nhân chứng làm gì nữa?” là một câu hỏi tu từ lưu loát. “Này, giờ đây” giữ được lực thu hút chú ý và tính tức thời của ἴδε νῦν.
  terminology: “Thượng tế” và “phạm thượng” là các thuật ngữ chính xác, quen dùng và giữ được trọng lượng tôn giáo-pháp lý của lời buộc tội. “Áo” có thể dùng bao quát cho ἱμάτια trong ngữ cảnh này; chú thích văn hóa làm rõ cử chỉ.
