id: MAT.26.65
reference: Matthew 26:65
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: τότε ὁ ἀρχιερεὺς διέρρηξεν τὰ ἱμάτια αὐτοῦ ⸀λέγων· Ἐβλασφήμησεν· τί ἔτι χρείαν ἔχομεν μαρτύρων; ἴδε νῦν ἠκούσατε τὴν ⸀βλασφημίαν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/065.yaml
  text: Then the high priest tore his garments[a], saying, “He has blasphemed! What further need do we have of witnesses? See[b], now you have heard the blasphemy.”
translation:
  language: vi
  text: 'Bấy giờ, thượng tế xé áo mình[a] và nói: “Người này đã phạm thượng! Chúng ta còn cần nhân chứng làm gì nữa? Này, giờ đây các ông đã nghe lời phạm thượng ấy.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Việc xé áo là dấu hiệu công khai bày tỏ sự kinh hãi, đau buồn hoặc phẫn nộ.
    reason: cultural_note
lexical_decisions:
- source_word: τότε
  choice: Bấy giờ
  rationale: Liên từ thời gian này nối sự việc với diễn tiến ngay trước đó; “Bấy giờ” tự nhiên trong văn kể trang trọng.
- source_word: ὁ ἀρχιερεὺς
  choice: thượng tế
  rationale: Chỉ người đang giữ chức vụ tư tế cao nhất; “thượng tế” là cách gọi rõ và quen thuộc trong bối cảnh Do Thái.
- source_word: διέρρηξεν τὰ ἱμάτια αὐτοῦ
  choice: xé áo mình
  rationale: Diễn đạt trực tiếp hành động xé y phục. “Áo” tự nhiên hơn “y phục” trong tiếng Việt mà không giới hạn vào một loại lễ phục cụ thể.
- source_word: Ἐβλασφήμησεν
  choice: Hắn đã phạm thượng
  rationale: Giữ nguyên sức nặng tôn giáo-pháp lý của lời cáo buộc, đồng thời đại từ “hắn” thể hiện giọng kết án của thượng tế chứ không phải nhận định của người kể.
- source_word: τί ἔτι χρείαν ἔχομεν μαρτύρων;
  choice: Chúng ta còn cần nhân chứng làm gì nữa?
  rationale: Chuyển đúng ý câu hỏi tu từ và sắc thái ἔτι, bằng cách nói tự nhiên trong tiếng Việt hiện đại.
- source_word: ἴδε νῦν
  choice: Này, giờ đây
  rationale: “Này” làm nhiệm vụ thu hút sự chú ý của ἴδε, còn “giờ đây” giữ rõ yếu tố thời gian νῦν.
- source_word: ἠκούσατε τὴν βλασφημίαν
  choice: chính các ông đã nghe lời phạm thượng ấy
  rationale: “Chính” làm nổi bật những người vừa trực tiếp nghe; “lời phạm thượng ấy” diễn đạt danh từ βλασφημία tự nhiên hơn trong tiếng Việt.
theological_decisions:
- issue: Lời cáo buộc βλασφημέω / βλασφημία
  choice: phạm thượng / lời phạm thượng
  alternative: xúc phạm Đức Chúa Trời / lời báng bổ
  rationale: “Phạm thượng” bảo toàn tính chất tôn giáo và pháp lý của lời cáo buộc mà không thêm đối tượng không được nêu trực tiếp trong câu Hy Lạp. Toàn câu cho thấy đây là lời phán đoán của thượng tế, không phải sự xác nhận của người kể.
translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng hiện đại. Lời của thượng tế mang sắc thái kết án mạnh; câu hỏi tu từ được giữ tự nhiên. Đại từ “các ông” phản ánh số nhiều của ἠκούσατε và phù hợp với lời nói trước hội đồng.
