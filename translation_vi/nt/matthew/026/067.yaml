base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/067.yaml
  text: Then they spat in his face and struck him with their fists[c][b][a], and others slapped him.
translation:
  language: vi
  text: Bấy giờ, họ nhổ vào mặt Ngài và đấm Ngài; còn những người khác thì tát Ngài.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τότε
  choice: Bấy giờ
  rationale: Trạng từ chỉ thời gian nối tiếp diễn tiến câu chuyện; “Bấy giờ” tự nhiên, trang trọng và gọn trong văn thuật sự.
- source_word: ἐνέπτυσαν εἰς τὸ πρόσωπον αὐτοῦ
  choice: họ nhổ vào mặt Ngài
  rationale: ἐμπτύω là “nhổ”; cụm εἰς τὸ πρόσωπον diễn tả hành vi nhổ thẳng vào mặt. Cách nói tiếng Việt này tự nhiên và giữ nguyên sắc thái sỉ nhục.
- source_word: ἐκολάφισαν αὐτόν
  choice: đấm Ngài
  rationale: κολαφίζω chỉ việc đánh bằng nắm tay; “đấm” truyền đạt cụ thể cách hành hung, thay vì làm mờ thành một từ chung như “đánh”.
- source_word: οἱ δὲ ἐράπισαν
  choice: còn những kẻ khác thì tát Ngài
  rationale: Mạo từ οἱ được dùng như danh từ, chỉ một nhóm khác; ῥαπίζω thường chỉ cú đánh bằng bàn tay mở, nên “tát” là cách diễn đạt tự nhiên. Tân ngữ “Ngài” được bổ sung rõ từ ngữ cảnh.
- source_word: δέ
  choice: còn ... thì
  rationale: δέ chuyển sang nhóm người và hành động khác với sắc thái đối chiếu nhẹ; cấu trúc “còn ... thì” thể hiện rõ sự chuyển ý mà không tạo tương phản quá mạnh.
theological_decisions:
- issue: Sự sỉ nhục và hành hung Đức Chúa Giê-su trước hội đồng
  choice: 'Diễn đạt cụ thể ba hành động: nhổ vào mặt, đấm và tát.'
  alternative: Khái quát hóa thành “ngược đãi” hoặc “đánh đập”.
  rationale: Nguyên văn nhấn mạnh cả sự làm nhục lẫn các hình thức bạo lực cụ thể. Bản dịch giữ sức nặng của lời thuật mà không thêm bình luận thần học.
translation_notes:
  register: Tiếng Việt hiện đại, dễ hiểu nhưng trang nghiêm. Dùng “Ngài” để chỉ Đức Chúa Giê-su theo văn phong Kinh Thánh tiếng Việt phổ biến; câu ngắn, trực diện, không làm nhẹ mức độ bạo hành.
