  rationale: Bản sửa phục hồi “Và” cho Καὶ, dùng “đã nói xong” để biểu thị hành động hoàn tất trước động từ chính, và đổi “của mình” thành “của ngài” để giữ rõ sở hữu αὐτοῦ. Không thay đổi ý nghĩa, mức độ trang trọng, hay tính dẫn nhập của dấu hai chấm.
