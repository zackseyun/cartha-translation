  source_fidelity: 'Cần giữ rõ liên từ mở đầu Καὶ (“Và”), vốn hiện diện trong nguyên văn và trong vế chuyển tiếp của công thức trần thuật. Các thành tố còn lại được chuyển đúng: ἐτέλεσεν là “đã nói xong”, πάντας τοὺς λόγους τούτους là “tất cả những lời này”, và εἶπεν là “nói”.'
  naturalness: “Và khi Giê-su đã nói xong tất cả những lời này, ngài nói với các môn đồ của ngài:” là tiếng Việt hiện đại, mạch lạc trong văn phong Kinh Thánh vừa phải. “Của ngài” tự nhiên và rõ quan hệ sở hữu hơn “của mình” khi chủ ngữ ở mệnh đề sau được lặp lại.
