  text: Καὶ ἐγένετο ὅτε ἐτέλεσεν ὁ Ἰησοῦς πάντας τοὺς λόγους τούτους, εἶπεν τοῖς μαθηταῖς αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/001.yaml
  text: And when Jesus had finished all these words[a], he said to his disciples,
translation:
  language: vi
  text: 'Và khi Giê-su đã nói xong tất cả những lời này,[a] ngài nói với các môn đồ của ngài:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát hình thức hơn: “Và xảy ra rằng, khi Giê-su hoàn tất tất cả những lời này, ngài nói với các môn đồ của ngài.”'
    reason: Nêu công thức trần thuật Καὶ ἐγένετο và cách dịch sát hơn của ἐτέλεσεν, vốn được diễn đạt tự nhiên hơn trong chính văn.
lexical_decisions:
- source_word: Καὶ ἐγένετο ὅτε
  choice: Khi
  rationale: Đây là công thức chuyển tiếp trần thuật mang sắc thái Sê-mít. Chỉ dùng “Khi” truyền đạt tự nhiên quan hệ thời gian trong tiếng Việt hiện đại, còn cách dịch sát từng chữ “Và xảy ra rằng khi” sẽ nặng nề mà không thêm nội dung đáng kể.
- source_word: ἐτέλεσεν
  choice: nói xong
  rationale: Động từ có nghĩa là hoàn tất; kết hợp với “những lời”, “nói xong” là cách diễn đạt tự nhiên và cho thấy lời giảng trước đó đã kết thúc.
- source_word: πάντας τοὺς λόγους τούτους
  choice: tất cả những lời này
  rationale: Giữ nghĩa trực tiếp của λόγους là “lời” và chức năng khép lại toàn bộ phần diễn từ vừa nêu.
- source_word: εἶπεν
  choice: nói
  rationale: Cách dịch trung tính, trực tiếp của λέγω, không thêm sắc thái mệnh lệnh hay trang trọng vốn không được biểu thị rõ trong nguyên văn.
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: với các môn đồ của mình
  rationale: “Môn đồ” là thuật ngữ quen thuộc cho μαθηταί; “của mình” giữ quan hệ sở hữu của αὐτοῦ và tránh lặp đại từ thiếu tự nhiên.
theological_decisions:
- issue: Cách gọi Ἰησοῦς
  choice: Giê-su
  alternative: Chúa Giê-su; Đức Giê-su
  rationale: Nguyên văn chỉ có tên riêng, không kèm tước hiệu κύριος. Vì vậy không thêm “Chúa”; đồng thời cũng không cần thêm kính ngữ “Đức” không hiện diện trong câu Hy Lạp.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “ngài” viết thường làm đại từ quy chiếu kính trọng đến Giê-su, không biến đại từ thành một tước hiệu. Dấu hai chấm giữ câu ở trạng thái dẫn nhập sang lời nói trực tiếp trong câu kế tiếp.
