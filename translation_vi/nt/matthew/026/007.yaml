  text: προσῆλθεν αὐτῷ γυνὴ ⸂ἔχουσα ἀλάβαστρον μύρου⸃ βαρυτίμου καὶ κατέχεεν ἐπὶ ⸂τῆς κεφαλῆς⸃ αὐτοῦ ἀνακειμένου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/007.yaml
  text: a woman came to him holding an alabaster jar of very costly perfume[b][a], and she poured it on his head as he was reclining at the table.
translation:
  language: vi
  text: Một người phụ nữ đến gần Đức Chúa Jêsus, cầm một bình alabaster đựng dầu thơm rất đắt giá[a], rồi đổ dầu thơm ấy lên đầu Ngài khi Ngài đang ngả mình dùng bữa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “một bình alabaster đựng thuốc thơm rất đắt giá.” Từ Hy Lạp μύρον có thể chỉ dầu thơm hoặc thuốc thơm, không nhất thiết là nước hoa dạng lỏng ngày nay.'
    reason: lexical_alternative
  - marker: b
    text: Thời ấy, người ta thường nằm nghiêng hoặc ngả mình quanh bàn khi dùng bữa.
    reason: cultural_note
lexical_decisions:
- source_word: προσῆλθεν αὐτῷ
  choice: đến gần Đức Chúa Jêsus
  rationale: Diễn đạt tự nhiên chuyển động hướng đến nhân vật được đại từ chỉ đến; dùng danh xưng để câu đứng riêng vẫn rõ nghĩa.
- source_word: γυνή
  choice: một người phụ nữ
  rationale: Danh từ số ít không xác định và không kèm đặc điểm nhận dạng.
- source_word: ἔχουσα
  choice: mang theo
  rationale: Phân từ hiện tại mô tả người phụ nữ có và đem chiếc bình đến; “mang theo” tự nhiên hơn “có” trong ngữ cảnh này.
- source_word: ἀλάβαστρον μύρου
  choice: một bình bằng đá hoa chứa dầu thơm
  rationale: ἀλάβαστρον chỉ bình làm bằng hoặc thuộc loại thường làm bằng alabaster; μύρον là chất thơm dạng dầu hay thuốc thơm. “Đá hoa” là cách gọi dễ hiểu, còn chú thích bảo lưu phạm vi nghĩa.
- source_word: βαρυτίμου
  choice: rất quý
  rationale: Truyền đạt giá trị rất cao của dầu thơm, với văn phong tự nhiên và trang trọng.
- source_word: κατέχεεν
  choice: đổ dầu ấy
  rationale: Động từ chỉ hành động đổ xuống hoặc đổ lên; bổ sung “dầu ấy” làm tân ngữ hiển nhiên trong tiếng Việt mà không thay đổi nội dung.
- source_word: ἐπὶ τῆς κεφαλῆς αὐτοῦ
  choice: lên đầu Ngài
  rationale: Diễn đạt trực tiếp vị trí và hướng của hành động đổ.
- source_word: ἀνακειμένου
  choice: khi Ngài đang dùng bữa trong tư thế nằm tựa
  rationale: Phân từ chỉ tư thế nằm nghiêng/ngả mình theo tập tục dùng bữa thời ấy; bản dịch nêu rõ bối cảnh để tránh bị hiểu là nằm nghỉ.
