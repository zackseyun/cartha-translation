revisions:
- from: Một người phụ nữ đến gần Đức Chúa Jêsus, mang theo một bình bằng đá hoa chứa dầu thơm rất quý[a], rồi đổ dầu ấy lên đầu Ngài khi Ngài đang dùng bữa trong tư thế nằm tựa[b].
  to: Một người phụ nữ đến gần Đức Chúa Jêsus, cầm một bình alabaster đựng dầu thơm rất đắt giá[a], rồi đổ dầu thơm ấy lên đầu Ngài khi Ngài đang ngả mình dùng bữa[b].
  rationale: Bản sửa thay cách gọi vật liệu không chính xác bằng thuật ngữ “alabaster”, làm rõ giá trị cao của dầu thơm, và dùng lối diễn đạt Việt ngữ trôi chảy hơn cho tư thế dùng bữa. Không thêm chi tiết lịch sử hay diễn giải thần học; các chú thích vẫn được neo đúng trong chính văn.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T05:44:40Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch truyền đạt đúng các thành phần chính của câu: một phụ nữ đến với Chúa Giê-su, có một bình đựng μύρον rất đắt giá, đổ chất thơm ấy lên đầu Ngài lúc Ngài đang dùng bữa theo tư thế ngả mình. Tuy nhiên, “đá hoa” thường chỉ marble trong tiếng Việt, không phải cách gọi chính xác hay an toàn cho ἀλάβαστρον; từ Hy Lạp này có thể chỉ bình alabaster (và đôi khi nhấn vào loại bình hơn là xác định chính xác vật liệu).'
  naturalness: Câu hiện tại nhìn chung tự nhiên, nhưng “đang dùng bữa trong tư thế nằm tựa” hơi nặng và chưa thật trôi chảy. “đang ngả mình dùng bữa” vừa tự nhiên trong văn phong Kinh Thánh hiện đại vừa giữ được tư thế ἀνακείμενος.
  terminology: Nên dùng “bình alabaster” thay cho “bình bằng đá hoa”. “Dầu thơm rất đắt giá” phản ánh trực tiếp hơn βαρυτίμου (giá trị/costly) so với “rất quý”. Giữ “Đức Chúa Jêsus/Ngài” để nhất quán với đăng ký bản dịch.
  issues:
  - severity: medium
    issue: “bình bằng đá hoa” không phải cách dịch an toàn cho ἀλάβαστρον.
    rationale: Trong tiếng Việt hiện đại, “đá hoa” chủ yếu gợi marble, trong khi ἀλάβαστρον là bình alabaster; việc xác định vật liệu chính xác cũng không cần được khẳng định trong chính văn. Dùng “bình alabaster” bảo toàn thuật ngữ nguồn mà không áp đặt một nhận diện khoáng vật quá cụ thể.
  - severity: low
    issue: “rất quý” làm nhạt sắc thái giá trị/đắt tiền của βαρυτίμου.
    rationale: “Rất đắt giá” diễn đạt rõ hơn ý “very costly” của tính từ này.
  - severity: low
    issue: Cụm “dùng bữa trong tư thế nằm tựa” hơi gượng.
    rationale: “Ngả mình dùng bữa” là cách diễn đạt tự nhiên hơn cho tư thế dự tiệc nằm nghiêng/ngả mình, còn chú thích có thể giải thích phong tục.
  revised_text: Một người phụ nữ đến gần Đức Chúa Jêsus, cầm một bình alabaster đựng dầu thơm rất đắt giá[a], rồi đổ dầu thơm ấy lên đầu Ngài khi Ngài đang ngả mình dùng bữa[b].
