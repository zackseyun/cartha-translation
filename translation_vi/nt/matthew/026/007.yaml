translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “Đức Chúa Jêsus/Ngài” theo văn phong Kinh Thánh; làm rõ tư thế dùng bữa nhưng giữ chú thích văn hóa. Các dấu chú thích [a], [b] đều xuất hiện trong chính văn.
