review_pass:
  verdict: revise
  source_fidelity: 'Cần sửa “Đức Chúa Jêsus”: nguyên văn chỉ có tên Ἰησοῦ, không có danh xưng “Đức Chúa” (κύριος). Bản sửa dùng “Giê-su”, giữ đúng mức độ xưng gọi của nguồn. Cụm “Khi ... đang ở” truyền đạt tự nhiên chức năng hoàn cảnh-thời gian của thuộc cách tuyệt đối. “tại nhà của Si-môn, người mắc bệnh phong” giữ quan hệ sở hữu và biệt hiệu nhận diện, không thêm thông tin về việc chữa lành hoặc thời điểm mắc bệnh.'
  naturalness: Bản sửa dùng tiếng Việt hiện đại, rõ ràng. “Nhà của Si-môn” rõ quan hệ hơn “nhà Si-môn”; dấu phẩy cuối cần được giữ vì đây là mệnh đề mở sang câu kế tiếp.
  terminology: Dùng “Giê-su” là cách phiên âm hiện đại, không đưa vào danh xưng không có trong câu Hy Lạp. “Người mắc bệnh phong” là cách diễn đạt ít kỳ thị hơn nhãn danh từ, còn chú thích giải thích giới hạn ngữ nghĩa của λεπρός và không đồng nhất máy móc với bệnh Hansen.
  issues:
  - severity: high
    issue: Thêm danh xưng “Đức Chúa” vào tên Giê-su
    rationale: SBLGNT chỉ viết Ἰησοῦ; không có κύριος hay một danh xưng tương đương. Thêm “Đức Chúa” làm bản dịch mạnh hơn nguyên văn và áp đặt lối xưng hô thuộc truyền thống dịch thuật.
  - severity: low
    issue: Thuật ngữ ngữ pháp trong chú thích a chưa phải cách gọi thông dụng nhất
    rationale: “Thuộc cách tuyệt đối” là cách gọi quen thuộc hơn “sở hữu cách tuyệt đối” khi chỉ genitive absolute trong ngữ pháp Hy Lạp.
  revised_text: Khi Giê-su đang ở Bê-tha-ni[a], tại nhà của Si-môn, người mắc bệnh phong[b],
