  yaml_path: translation/nt/matthew/026/006.yaml
  text: While Jesus was in Bethany[a], in the house of Simon the leper[b],
translation:
  language: vi
  text: Khi Giê-su đang ở Bê-tha-ni[a], tại nhà của Si-môn, người mắc bệnh phong[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Lúc Giê-su ở Bê-tha-ni.” Trong tiếng Hy Lạp, cấu trúc thuộc cách tuyệt đối dùng để đặt bối cảnh thời gian.'
    reason: lexical_alternative
  - marker: b
    text: Nguyên văn dùng một từ làm biệt hiệu nhận diện Si-môn; riêng từ này không cho biết lúc ấy ông vẫn còn mắc bệnh hay trước kia từng mắc bệnh. Từ Hy Lạp cũng có thể chỉ nhiều loại bệnh ngoài da, không nhất thiết tương ứng chính xác với bệnh Hansen ngày nay.
    reason: cultural_note
lexical_decisions:
- source_word: Τοῦ δὲ Ἰησοῦ γενομένου
  choice: Khi Đức Chúa Jêsus đang ở
  rationale: Cấu trúc sở hữu cách tuyệt đối với γίνομαι đặt bối cảnh thời gian. Cách dịch này tự nhiên trong tiếng Việt và giữ được sắc thái hoàn cảnh, không dịch máy móc là “đã trở nên”.
- source_word: δὲ
  choice: không dịch thành một từ riêng
  rationale: δέ là liên từ nhẹ để chuyển cảnh; quan hệ diễn ngôn đã được thể hiện tự nhiên qua mệnh đề mở đầu “Khi…”, nên thêm “bấy giờ” hoặc “nhưng” sẽ dễ làm quá nghĩa.
- source_word: ἐν Βηθανίᾳ
  choice: ở Bê-tha-ni
  rationale: ἐν được dùng theo nghĩa vị trí, với địa danh Βηθανία.
- source_word: ἐν οἰκίᾳ Σίμωνος
  choice: tại nhà Si-môn
  rationale: οἰκία chỉ địa điểm vật chất; cấu trúc sở hữu được diễn đạt tự nhiên trong tiếng Việt bằng “nhà Si-môn”.
- source_word: τοῦ λεπροῦ
  choice: người mắc bệnh phong
  rationale: λεπρός là biệt hiệu nhận diện Si-môn và có thể chỉ một bệnh ngoài da thuộc phạm vi rộng hơn chẩn đoán Hansen hiện đại. “Người mắc bệnh phong” dễ hiểu, trang trọng hơn một nhãn danh từ mang tính miệt thị, nhưng không tự ý xác định chính xác bệnh trạng.
theological_decisions:
- issue: Biệt hiệu τοῦ λεπροῦ có hàm ý Si-môn hiện còn bệnh hay đã được chữa lành hay không
  choice: Giữ cách nhận diện “Si-môn, người mắc bệnh phong” mà không nói ông đã từng mắc hay đã được chữa lành
  alternative: Si-môn, người trước kia mắc bệnh phong
  rationale: Bản Hy Lạp chỉ dùng một biệt hiệu nhận diện, không xác định thời điểm, tình trạng hiện tại hay một việc chữa lành trước đó.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “Đức Chúa Jêsus” theo văn phong Kinh Thánh Tin Lành Việt ngữ; “tại nhà” tự nhiên hơn “trong nhà” khi nêu địa điểm. Câu giữ dấu phẩy cuối vì đây là mệnh đề dẫn sang câu kế tiếp.
