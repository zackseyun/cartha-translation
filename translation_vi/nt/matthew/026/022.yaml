  text: καὶ λυπούμενοι σφόδρα ἤρξαντο λέγειν αὐτῷ ⸂εἷς ἕκαστος⸃· Μήτι ἐγώ εἰμι, κύριε;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/022.yaml
  text: And being deeply grieved[a], they began to say to him one by one, “Surely not I[b], Lord?”
translation:
  language: vi
  text: 'Họ vô cùng buồn rầu, và từng người một[a] bắt đầu thưa với Ngài: “Lạy Chúa, chắc không phải chính con chứ?”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “mỗi người một” hoặc “người này đến người khác.” Một số bản chép tay không có cụm này.'
    reason: lexical_alternative
  - marker: b
    text: 'Từ μήτι trong tiếng Hy Lạp mở đầu một câu hỏi mong đợi câu trả lời phủ định: “Chắc không phải chính con chứ, lạy Chúa?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: λυπούμενοι σφόδρα
  choice: vô cùng buồn rầu
  rationale: Phân từ hiện tại diễn tả trạng thái buồn đau đang tiếp diễn, còn σφόδρα nhấn mạnh mức độ. Cụm này tự nhiên, rõ nghĩa và giữ được sắc thái mạnh của nguyên văn.
- source_word: ἤρξαντο λέγειν αὐτῷ
  choice: bắt đầu ... thưa với Ngài
  rationale: Giữ ý khởi đầu của ἤρξαντο; “thưa” phù hợp với lời nói trực tiếp đầy kính trọng hướng đến Chúa Giê-su, còn “với Ngài” phản ánh đại từ gián tiếp αὐτῷ.
- source_word: εἷς ἕκαστος
  choice: lần lượt từng người
  rationale: Cách diễn đạt phân phối kép nhấn mạnh rằng mỗi môn đồ đều đích thân lên tiếng; bản dịch Việt ngữ vừa giữ ý “từng người” vừa truyền đạt diễn tiến “lần lượt”.
- source_word: Μήτι ἐγώ εἰμι
  choice: chắc không phải con chứ?
  rationale: μήτι mở đầu câu hỏi mong đợi câu trả lời phủ định. Cấu trúc “chắc không phải ... chứ?” truyền đạt tự nhiên kỳ vọng ấy; “con” phù hợp với cách một môn đồ kính cẩn tự xưng khi thưa với Chúa Giê-su.
- source_word: κύριε
  choice: Lạy Chúa
  rationale: κύριε là dạng hô cách. “Lạy Chúa” giữ cách xưng hô trực tiếp, trang trọng và sức nặng tường thuật-thần học của danh xưng này.
theological_decisions:
- issue: Cách dịch κύριε khi các môn đồ thưa với Chúa Giê-su
  choice: Lạy Chúa
  alternative: thưa thầy / thưa ngài
  rationale: Trong ngữ cảnh sách Ma-thi-ơ, danh xưng κύριε dành cho Chúa Giê-su có thể mang sức nặng vượt quá phép lịch sự thông thường. “Lạy Chúa” giữ được điều đó mà không diễn giải thêm.
- issue: Sắc thái của câu hỏi với μήτι
  choice: chắc không phải con chứ?
  alternative: có phải con không?
  rationale: Nguyên văn không phải là một câu hỏi trung tính mà biểu thị người hỏi mong đợi câu trả lời phủ định. Bản dịch giữ nguyên sắc thái ấy thay vì làm phẳng thành câu hỏi thông tin.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Ngài” và “Lạy Chúa” duy trì sự kính trọng; “con” thể hiện quan hệ môn đồ với Chúa Giê-su mà không thêm một danh xưng không có trong nguyên văn. Các dấu chú thích được đặt ngay sau cụm từ tương ứng.
