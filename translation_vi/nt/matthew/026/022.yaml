    rationale: “bắt đầu lần lượt từng người thưa” làm cụm “lần lượt từng người” chen giữa bổ ngữ của “bắt đầu” và động từ chính. “từng người một bắt đầu thưa” rõ và tự nhiên hơn, vẫn giữ εἷς ἕκαστος cùng ý khởi phát của ἤρξαντο.
