    rationale: “con” đã đúng nghĩa theo lối xưng hô, nhưng thêm “chính” là một cách tự nhiên để phản ánh đại từ ngôi thứ nhất được nêu tường minh trong câu hỏi Hy Lạp, không thêm nội dung.
  - severity: low
