id: MAT.26.53
reference: Matthew 26:53
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἢ δοκεῖς ὅτι οὐ ⸀δύναμαι παρακαλέσαι τὸν πατέρα μου, καὶ παραστήσει μοι ⸂ἄρτι πλείω⸃ δώδεκα λεγιῶνας ἀγγέλων;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/053.yaml
  text: Or do you think that I cannot appeal to my Father[c][b][a], and he will at once place at my disposal more than twelve legions of angels?
translation:
  language: vi
  text: Hay anh tưởng rằng Ta không thể cầu xin[a] Cha Ta, và Ngài sẽ ngay lập tức đặt hơn mười hai quân đoàn[c] thiên sứ ở bên Ta[b] sao?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “kêu cầu” hoặc “xin”.
    reason: lexical_alternative
  - marker: b
    text: Nghĩa đen là “đặt bên Ta”, tức là khiến lực lượng ấy có mặt sẵn để trợ giúp Ta.
    reason: lexical_alternative
  - marker: c
    text: Quân đoàn là một đơn vị quân đội La Mã rất lớn; cách nói này nhấn mạnh một lực lượng trên trời áp đảo.
    reason: cultural_note
lexical_decisions:
- source_word: ἢ
  choice: Hay
  rationale: Mở ra một lời chất vấn thay thế, nối trực tiếp với lời quở trách trước đó.
- source_word: δοκεῖς
  choice: anh tưởng rằng
  rationale: Diễn đạt tự nhiên sức nặng của câu hỏi tu từ hướng đến người môn đồ đang được nói với.
- source_word: οὐ δύναμαι
  choice: Ta không thể
  rationale: Giữ đúng ý về khả năng hay quyền năng, không chuyển thành sự không được phép hoặc không muốn.
- source_word: παρακαλέσαι
  choice: cầu xin
  rationale: Phù hợp với lời khẩn cầu xin trợ giúp trong quan hệ giữa Đức Giê-su và Cha, đồng thời vẫn tự nhiên trong tiếng Việt hiện đại.
- source_word: τὸν πατέρα μου
  choice: Cha Ta
  rationale: Giữ nguyên quan hệ phụ tử trực tiếp với Đức Chúa Trời; viết hoa theo cách dùng danh xưng thần linh trong văn phong Kinh Thánh tiếng Việt.
- source_word: παραστήσει μοι
  choice: Ngài sẽ đặt bên Ta
  rationale: Bám sát hình ảnh đặt lực lượng ở bên để sẵn sàng trợ giúp, thay vì thu hẹp nghĩa thành chỉ ‘sai đến’.
- source_word: ἄρτι
  choice: ngay lúc này
  rationale: Thể hiện sự trợ giúp có thể hiện diện ngay trong tình thế hiện tại.
- source_word: πλείω δώδεκα
  choice: hơn mười hai
  rationale: Truyền đạt trực tiếp lượng vượt quá con số mười hai.
- source_word: λεγιῶνας
  choice: quân đoàn
  rationale: Giữ hình ảnh quân sự La Mã về một lực lượng rất lớn; thuật ngữ này dễ hiểu trong tiếng Việt khi có chú thích.
- source_word: ἀγγέλων
  choice: thiên sứ
  rationale: Ngữ cảnh nói rõ đến các hữu thể trên trời chứ không phải sứ giả loài người.
theological_decisions:
- issue: Lời Đức Giê-su nói về khả năng, sự cho phép hay ý muốn xin Cha trợ giúp
  choice: 'Diễn đạt theo khả năng: ‘Ta không thể cầu xin Cha Ta’'
  alternative: Diễn đạt lỏng theo hướng Đức Giê-su không muốn hoặc không được phép xin trợ giúp
  rationale: δύναμαι chỉ khả năng hoặc quyền năng. Cách dịch giữ nguyên điểm nhấn rằng việc Đức Giê-su bị bắt không phải vì Ngài bất lực, nhưng không thêm lời giải thích giáo lý vào câu.
- issue: Cách hiểu quan hệ giữa lời cầu xin và việc Cha cung ứng thiên sứ
  choice: Giữ liên từ ‘và’ cùng hình thức câu hỏi tu từ của nguyên văn
  alternative: Đổi thành ‘để Ngài’ hoặc tách thành một câu khẳng định riêng
  rationale: καί nối hai mệnh đề mà không xác định tường minh quan hệ mục đích hay kết quả; giữ ‘và’ bảo tồn cấu trúc và độ mở của nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ ‘anh’ thể hiện lời nói trực tiếp với người môn đồ trong ngữ cảnh mà không dùng ‘ngươi’ mang sắc thái cổ; ‘Ta’ và ‘Ngài’ duy trì sắc thái trang nghiêm quen thuộc khi Đức Giê-su nói về chính mình và về Cha.
