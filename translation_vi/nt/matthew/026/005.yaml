  text: ἔλεγον δέ· Μὴ ἐν τῇ ἑορτῇ, ἵνα μὴ θόρυβος γένηται ἐν τῷ λαῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/005.yaml
  text: But they were saying[a], “Not during the feast[b], lest there be an uproar among the people.”
translation:
  language: vi
  text: 'Nhưng họ nói: “Đừng làm việc ấy trong kỳ lễ[a], kẻo xảy ra náo động trong dân chúng[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “trong dịp lễ hội.” Từ Hy Lạp có thể chỉ một kỳ lễ hoặc lễ hội; ở đây ngữ cảnh nói đến Lễ Vượt Qua.
    reason: lexical_alternative
  - marker: b
    text: Hay “náo loạn trong dân chúng”; từ Hy Lạp chỉ sự náo động, hỗn loạn công khai và trong một số ngữ cảnh có thể mạnh đến mức bạo loạn.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγον
  choice: họ nói
  rationale: Thì chưa hoàn thành cho thấy lời nói diễn ra trong lúc họ đang bàn tính; tiếng Việt tự nhiên thường dùng “họ nói” trong mạch kể mà không cần thêm từ nhấn mạnh tính tiếp diễn.
- source_word: δέ
  choice: Nhưng
  rationale: 'Diễn tả bước chuyển có sắc thái tương phản nhẹ với âm mưu vừa được nêu: họ muốn bắt và giết Đức Giê-su, nhưng dè dặt về thời điểm.'
- source_word: Μὴ ἐν τῇ ἑορτῇ
  choice: Đừng làm việc ấy trong kỳ lễ
  rationale: Câu Hy Lạp tỉnh lược động từ. “Đừng làm việc ấy” bổ sung điều đã rõ từ ngữ cảnh để câu tiếng Việt tự nhiên, còn “trong kỳ lễ” giữ nghĩa thời gian của ἐν và nghĩa rộng của ἑορτή.
- source_word: ἵνα μὴ
  choice: kẻo
  rationale: “Kẻo” diễn đạt tự nhiên mục đích tránh một hậu quả không mong muốn.
- source_word: θόρυβος
  choice: náo động
  rationale: Chỉ tình trạng ồn ào, hỗn loạn hoặc bất ổn công khai; “náo động” không mặc nhiên đẩy nghĩa đến mức một cuộc bạo loạn có tổ chức.
- source_word: γένηται ἐν τῷ λαῷ
  choice: xảy ra ... trong dân chúng
  rationale: Giữ ý “phát sinh/xảy ra” của γίνομαι và phạm vi xã hội được diễn tả bởi ἐν τῷ λαῷ.
