  text: λέγει αὐτῷ ὁ Πέτρος· Κἂν δέῃ με σὺν σοὶ ἀποθανεῖν, οὐ μή σε ⸀ἀπαρνήσομαι. ⸀ὁμοίως καὶ πάντες οἱ μαθηταὶ εἶπαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/035.yaml
  text: Peter said to him[a], “Even if I must die with you, I will certainly not deny you.” Likewise all the disciples also said the same.
translation:
  language: vi
  text: 'Phi-e-rơ thưa với Ngài: “Dù con phải chết cùng Ngài, con nhất định sẽ không chối Ngài.” Tất cả các môn đồ cũng nói như vậy.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: thưa
  rationale: Dùng động từ kể chuyện ở thì quá khứ được ngữ cảnh tiếng Việt tự nhiên biểu đạt mà không cần đánh dấu thời; “thưa” phù hợp khi Phi-e-rơ trực tiếp nói với Chúa Giê-su và giữ sắc thái kính trọng.
- source_word: Κἂν
  choice: Dù
  rationale: κἄν mở đầu một điều kiện nhượng bộ; “dù” diễn đạt tự nhiên và đầy đủ ý “ngay cả nếu” trong cấu trúc này.
- source_word: δέῃ με
  choice: con phải
  rationale: δέῃ diễn tả sự cần thiết; đại từ “con” được dùng theo quan hệ xưng hô trong lời trực tiếp với Ngài.
- source_word: σὺν σοὶ ἀποθανεῖν
  choice: chết cùng Ngài
  rationale: Diễn đạt trực tiếp ý đồng hành của σύν và hành động chết, bằng trật tự tự nhiên trong tiếng Việt.
- source_word: οὐ μή
  choice: nhất định sẽ không
  rationale: Cụm phủ định kép οὐ μή có lực nhấn mạnh mạnh; “nhất định sẽ không” bảo toàn sự quả quyết của Phi-e-rơ mà không thêm cách giải thích thần học.
- source_word: ἀπαρνήσομαι
  choice: chối Ngài
  rationale: Trong văn cảnh này, ἀπαρνέομαι chỉ việc phủ nhận hoặc không thừa nhận mối liên hệ với Chúa Giê-su; “chối” là từ rõ ràng, quen thuộc và sát nghĩa.
- source_word: ὁμοίως
  choice: cũng ... như vậy
  rationale: Cách diễn đạt này chuyển tự nhiên ý “tương tự/cùng một cách” của trạng từ ὁμοίως.
- source_word: πάντες οἱ μαθηταὶ
  choice: tất cả các môn đồ khác
  rationale: “Môn đồ” là cách gọi quen thuộc cho μαθητής. Thêm “khác” làm rõ rằng Phi-e-rơ cũng thuộc nhóm môn đồ nhưng câu sau nói đến toàn thể những người còn lại; đây là hàm ý diễn ngôn, không phải một nhóm mới.
- source_word: εἶπαν
  choice: nói
  rationale: Động từ λέγω ở đây được chuyển bằng “nói”, cách diễn đạt trung tính và tự nhiên.
theological_decisions:
- issue: Mức độ nhấn mạnh trong lời Phi-e-rơ phủ nhận khả năng mình sẽ chối Chúa
  choice: “con nhất định sẽ không chối Ngài”
  alternative: “con sẽ không bao giờ chối Ngài”
  rationale: οὐ μή là lối phủ định tương lai rất mạnh. “Nhất định sẽ không” giữ nguyên sự quả quyết và căng thẳng giữa lời tự tin của Phi-e-rơ với diễn biến sau đó, mà không diễn giải thêm.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Trong lời trực tiếp, dùng cặp xưng hô “con—Ngài” để thể hiện sự kính trọng; lời kể dùng tên “Phi-e-rơ” theo lối phiên âm quen thuộc. Không cần chú thích vì sắc thái nhấn mạnh của οὐ μή đã được thể hiện ngay trong bản dịch.
