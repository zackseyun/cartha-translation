  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Τότε ἔρχεται μετ’ αὐτῶν ὁ Ἰησοῦς εἰς χωρίον λεγόμενον Γεθσημανί, καὶ λέγει τοῖς μαθηταῖς· Καθίσατε αὐτοῦ ἕως οὗ ἀπελθὼν ⸂ἐκεῖ προσεύξωμαι⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/036.yaml
  text: Then Jesus comes with them to a place called Gethsemane[a], and he says to the disciples, “Sit here while I go over there and pray.”
translation:
  language: vi
  text: 'Bấy giờ, Đức Giê-su cùng các môn đồ đến một nơi gọi là Ghết-sê-ma-nê. Ngài bảo các môn đồ: “Hãy ngồi đây trong lúc Thầy đi sang đằng kia để cầu nguyện.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch sát hơn: “Hãy ngồi đây cho đến khi Thầy đi sang đó và cầu nguyện.” Cụm từ Hy Lạp có nghĩa đen là “cho đến khi”, nhưng “trong lúc” tự nhiên hơn trong câu này.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Bấy giờ
  rationale: Liên từ thời gian nối sự kiện này với diễn tiến ngay trước đó; “Bấy giờ” tự nhiên trong văn kể trang trọng.
- source_word: ἔρχεται
  choice: đến
  rationale: Động từ hiện tại lịch sử tạo sắc thái sống động trong tiếng Hy Lạp; tiếng Việt không biến đổi hình thái theo thì, nên “đến” truyền đạt tự nhiên mà không cần thêm dấu hiệu quá khứ.
- source_word: μετ’ αὐτῶν
  choice: cùng các môn đồ
  rationale: Diễn đạt quan hệ đồng hành. “Các môn đồ” làm rõ đối tượng của đại từ theo ngữ cảnh liền kề mà không thay đổi quy chiếu.
- source_word: χωρίον
  choice: một nơi
  rationale: χωρίον có thể chỉ một nơi, khu đất hoặc điền trang. “Một nơi” giữ phạm vi nghĩa rộng của Ma-thi-ơ, không đưa chi tiết “vườn” từ sách Giăng vào.
- source_word: λεγόμενον Γεθσημανί
  choice: gọi là Ghết-sê-ma-nê
  rationale: Công thức thông thường để nêu tên địa điểm; tên riêng được phiên âm theo cách đọc quen thuộc trong tiếng Việt.
- source_word: λέγει
  choice: Ngài bảo
  rationale: “Bảo” tự nhiên khi giới thiệu lời chỉ dẫn trực tiếp. “Ngài” cung cấp chủ ngữ cần thiết và giữ giọng văn tôn kính, dễ hiểu.
- source_word: τοῖς μαθηταῖς
  choice: các môn đồ
  rationale: μαθητής trong bối cảnh này chỉ những người theo học Chúa Giê-su; “môn đồ” là từ ngữ hiện hành, trang trọng và chính xác.
- source_word: Καθίσατε αὐτοῦ
  choice: Hãy ngồi đây
  rationale: Mệnh lệnh đơn giản được diễn đạt tự nhiên bằng “hãy”; αὐτοῦ là trạng từ địa điểm, nghĩa là “ở đây”.
- source_word: ἕως οὗ
  choice: trong lúc
  rationale: Nghĩa sát là “cho đến khi”, nhưng trong lời dặn chờ tại chỗ, “trong lúc” truyền đạt tự nhiên khoảng thời gian các môn đồ ngồi lại; phương án sát chữ được giữ trong chú thích.
- source_word: ἀπελθὼν ἐκεῖ
  choice: Thầy đi đằng kia
  rationale: Phân từ chỉ hành động đi khỏi chỗ các môn đồ và đến một vị trí khác. “Đằng kia” làm rõ sự đối lập với “đây”. Đại từ tự xưng “Thầy” phù hợp quan hệ giữa Chúa Giê-su và các môn đồ trong tiếng Việt.
- source_word: προσεύξωμαι
  choice: cầu nguyện
  rationale: Diễn đạt trực tiếp hành động hướng lời lên Đức Chúa Trời, không thêm đối tượng hay nội dung vốn không có trong câu.
theological_decisions:
- issue: Tính chất của địa điểm Ghết-sê-ma-nê
  choice: Dịch χωρίον là “một nơi”
  alternative: “một khu vườn”
  rationale: Bản văn Ma-thi-ơ chỉ gọi đây là χωρίον, không nói rõ là vườn. Dịch “vườn” sẽ đưa chi tiết từ Giăng 18:1 vào lời văn của Ma-thi-ơ.
- issue: Cách tự xưng của Chúa Giê-su
  choice: “Thầy”
  alternative: “tôi” hoặc “Ta”
  rationale: Động từ Hy Lạp ở ngôi thứ nhất nhưng không có đại từ nhấn mạnh. “Thầy” diễn đạt tự nhiên quan hệ được nêu giữa Chúa Giê-su và các môn đồ, đồng thời tránh sắc thái quá suồng sã của “tôi” hoặc sắc thái uy quyền được tăng thêm bởi “Ta”.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Câu kể gọn, tránh từ cổ; dùng “Đức Giê-su”, “Ngài” và cách tự xưng “Thầy” để duy trì sự tôn kính và quan hệ thầy–trò trong ngữ cảnh. Dấu chú thích [a] được đặt ngay sau phần lời nói mà chú thích giải thích.
