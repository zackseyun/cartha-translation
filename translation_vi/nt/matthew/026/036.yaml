  verdict: revise
  source_fidelity: Bản dịch truyền đạt đúng trình tự câu chuyện, việc Chúa Giê-su đi cùng các môn đồ đến một nơi tên Ghết-sê-ma-nê, và lời dặn họ ngồi lại trong khi Ngài đi đến một vị trí khác để cầu nguyện. “Một nơi” giữ đúng độ rộng của χωρίον, không nhập chi tiết “vườn”. Tuy nhiên, cụm “đi đằng kia cầu nguyện” trong tiếng Việt thiếu liên kết rõ ràng giữa việc đi và mục đích cầu nguyện, có thể bị đọc như vừa đi vừa cầu nguyện.
