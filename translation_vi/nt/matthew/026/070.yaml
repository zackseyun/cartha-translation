  text: ὁ δὲ ἠρνήσατο ⸀ἔμπροσθεν πάντων λέγων· Οὐκ οἶδα τί λέγεις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/070.yaml
  text: But he denied it before them all[a], saying, “I do not know what you are saying.”
translation:
  language: vi
  text: 'Nhưng ông chối trước mặt mọi người: “Tôi không biết cô đang nói gì.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἠρνήσατο
  choice: chối
  rationale: Động từ ἀρνέομαι ở đây diễn tả việc Phi-e-rơ phủ nhận lời cáo buộc vừa được nêu. Tiếng Việt có thể dùng nội động từ “chối” tự nhiên mà không cần thêm một tân ngữ vốn không xuất hiện trong tiếng Hy Lạp.
- source_word: ἔμπροσθεν πάντων
  choice: trước mặt mọi người
  rationale: Cụm từ này chỉ hành động diễn ra công khai, ngay trước sự hiện diện của tất cả những người đang có mặt.
- source_word: λέγων
  choice: ':'
  rationale: Dấu hai chấm dẫn lời trực tiếp diễn đạt tự nhiên chức năng của phân từ “nói rằng” trong tiếng Việt, tránh lối văn nặng nề.
- source_word: Οὐκ οἶδα
  choice: Tôi không biết
  rationale: Bản dịch trực tiếp, trang trọng vừa phải và tự nhiên của mệnh đề phủ định chỉ sự biết.
- source_word: τί λέγεις
  choice: cô đang nói gì
  rationale: Giữ sát nghĩa “điều cô đang nói”; đại từ “cô” dựa trên ngữ cảnh người đang nói với Phi-e-rơ là một nữ tỳ, đồng thời phù hợp với cách xưng hô tiếng Việt hiện đại.
theological_decisions:
- issue: Đối tượng của hành động chối
  choice: Không thêm tân ngữ sau “chối”
  alternative: “chối điều đó” hoặc “chối Chúa Giê-su”
  rationale: Bản Hy Lạp không nêu tân ngữ; ngữ cảnh cho thấy Phi-e-rơ phủ nhận lời cáo buộc vừa nghe. Cách dịch này giữ nguyên độ hàm ẩn và không xác định cụ thể hơn nguồn.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và dễ hiểu. Câu trực tiếp giữ lời phủ nhận ngắn, dứt khoát; không cần chú thích vì bản dịch có thể vừa tự nhiên vừa bám sát nguyên văn.
