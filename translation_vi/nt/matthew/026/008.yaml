  text: ἰδόντες δὲ οἱ ⸀μαθηταὶ ἠγανάκτησαν λέγοντες· Εἰς τί ἡ ἀπώλεια αὕτη;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/008.yaml
  text: But when the disciples saw it[a], they were indignant, saying, “Why this waste?”
translation:
  language: vi
  text: 'Nhưng khi thấy vậy, các môn đệ lấy làm bất bình và nói: “Sự phí phạm này để làm gì?[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “Tại sao lại có sự phí phạm này?”'
    reason: Cụm εἰς τί có thể được dịch ngắn gọn như câu hỏi “tại sao?”, trong khi bản văn chính giữ nghĩa sát hơn là hỏi về mục đích.
lexical_decisions:
- source_word: ἰδόντες
  choice: khi thấy vậy
  rationale: Phân từ bất định quá khứ của ὁράω được hiểu theo nghĩa thời gian. “Vậy” diễn đạt tự nhiên đối tượng được ngầm hiểu trong tiếng Hy Lạp, tức việc người phụ nữ vừa làm.
- source_word: δὲ
  choice: Nhưng
  rationale: δέ đánh dấu bước chuyển nhẹ và sự tương phản giữa hành động trước đó với phản ứng tiêu cực của các môn đồ.
- source_word: οἱ μαθηταὶ
  choice: các môn đồ
  rationale: Cách gọi quen thuộc và trang trọng trong văn cảnh Phúc Âm; không thêm “của Ngài” vì nguyên văn không nói rõ.
- source_word: ἠγανάκτησαν
  choice: phẫn nộ
  rationale: ἀγανακτέω chỉ sự bất bình mạnh mẽ, có sắc thái lên án; “phẫn nộ” giữ được cường độ ấy.
- source_word: λέγοντες
  choice: nói
  rationale: Trong tiếng Việt, chuyển phân từ hiện tại thành động từ nối trực tiếp với lời nói giúp câu tự nhiên mà vẫn giữ quan hệ với phản ứng phẫn nộ.
- source_word: Εἰς τί
  choice: Sao lại
  rationale: Cụm này theo sát nghĩa là hỏi “nhằm mục đích gì”; trong lời trách móc, “Sao lại” truyền đạt tự nhiên lực của câu hỏi.
- source_word: ἡ ἀπώλεια αὕτη
  choice: lãng phí thế này
  rationale: Trong văn cảnh dầu thơm quý bị đổ ra, ἀπώλεια mang nghĩa sự hao phí; cách diễn đạt này tự nhiên trong tiếng Việt và giữ sắc thái chê trách.
theological_decisions: []
