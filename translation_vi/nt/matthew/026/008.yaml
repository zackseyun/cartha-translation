  register: Tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “môn đồ” để phù hợp văn phong Kinh Thánh quen thuộc; lời thoại ngắn, tự nhiên, giữ nguyên giọng bất bình của nguyên văn.
