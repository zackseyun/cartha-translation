    rationale: Trong ngữ cảnh này, động từ diễn tả sự bất bình/phẫn uất; “lấy làm bất bình” giữ sắc thái phản đối mạnh mà không cường điệu thành cơn thịnh nộ.
  - severity: low
    issue: “Sao lại lãng phí thế này?” diễn giải câu danh ngữ ἡ ἀπώλεια αὕτη thành mô tả cách thức của hành động.
    rationale: “Sự phí phạm này để làm gì?” biểu đạt trực tiếp hơn “việc/sự phí phạm này” và câu hỏi εἰς τί (“để làm gì/nhằm mục đích gì”).
