    rationale: αὐτοῦ bổ nghĩa cho μάχαιραν. Dù “rút gươm” có thể hàm ý sở hữu trong tiếng Việt, thêm “mình” giữ được chi tiết nguồn mà vẫn tự nhiên.
  - severity: low
    issue: “thầy thượng tế” kém tự nhiên hơn cách gọi hiện đại trung tính.
    rationale: “Vị thượng tế” vẫn giữ đúng danh xưng ἀρχιερεύς và phù hợp văn phong kể chuyện tiếng Việt hiện đại.
