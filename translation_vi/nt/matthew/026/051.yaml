  terminology: Dùng “Đức Giê-su” là phù hợp. Nên dùng “nô lệ” cho δοῦλος trong bản văn chính và đặt “đầy tớ” ở chú thích như một phương án dịch mềm hơn. “Vị thượng tế” dịch chính xác ἀρχιερεύς mà không gắn với truyền thống giáo phái riêng.
