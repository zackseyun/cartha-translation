id: MAT.26.51
reference: Matthew 26:51
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ εἷς τῶν μετὰ Ἰησοῦ ἐκτείνας τὴν χεῖρα ἀπέσπασεν τὴν μάχαιραν αὐτοῦ καὶ πατάξας τὸν δοῦλον τοῦ ἀρχιερέως ἀφεῖλεν αὐτοῦ τὸ ὠτίον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/051.yaml
  text: And behold[a], one of those with Jesus stretched out his hand, drew his sword, and struck the high priest’s servant, and cut off his ear.
translation:
  language: vi
  text: Kìa, một người trong số những người đi cùng Đức Giê-su đưa tay, rút gươm của mình, rồi đánh người nô lệ của vị thượng tế và chém đứt tai người ấy.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '“Nô lệ”: cũng có thể dịch là “đầy tớ”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: Kìa
  rationale: Giữ sắc thái đột ngột, sống động của dấu hiệu diễn ngôn trong lời kể, đồng thời tự nhiên và dễ hiểu trong tiếng Việt hiện đại.
- source_word: εἷς τῶν μετὰ Ἰησοῦ
  choice: một người trong số những người đi cùng Đức Giê-su
  rationale: Phản ánh sát kết cấu bộ phận của tiếng Hy Lạp mà không xác định danh tính hay quan hệ cụ thể hơn nguồn.
- source_word: ἐκτείνας τὴν χεῖρα
  choice: đưa tay
  rationale: Diễn đạt tự nhiên động tác đi trước việc rút gươm; tránh lối dịch máy móc 'duỗi tay'.
- source_word: ἀπέσπασεν τὴν μάχαιραν αὐτοῦ
  choice: rút gươm
  rationale: Cách nói ngắn gọn, quen thuộc cho hành động lấy vũ khí của mình ra.
- source_word: μάχαιραν
  choice: gươm
  rationale: Từ này có thể chỉ gươm ngắn hoặc dao lớn; 'gươm' là cách gọi truyền thống, đủ rộng và không đặc tả quá mức.
- source_word: πατάξας
  choice: đánh
  rationale: Truyền đạt cú ra đòn bằng vũ khí trong văn cảnh; tự nhiên hơn 'đập' và ít cổ hơn 'đánh phạt'.
- source_word: δοῦλον
  choice: đầy tớ
  rationale: Trong ngữ cảnh thuộc hạ trong nhà của thầy thượng tế, 'đầy tớ' là cách diễn đạt tự nhiên; chú thích bảo lưu nghĩa xã hội mạnh hơn là 'nô lệ'.
- source_word: ἀρχιερέως
  choice: thầy thượng tế
  rationale: Danh xưng quen thuộc và chính xác cho vị thượng tế Do Thái trong ngữ cảnh Tân Ước.
- source_word: ἀφεῖλεν αὐτοῦ τὸ ὠτίον
  choice: chém đứt tai người ấy
  rationale: Diễn đạt rõ kết quả của nhát gươm và giữ động từ hữu hạn phối hợp của nguyên văn.
- source_word: ὠτίον
  choice: tai
  rationale: Dạng từ có sắc thái giảm nhẹ nhưng trong văn cảnh chỉ tai nói chung; 'dái tai' sẽ cụ thể hóa quá mức.
theological_decisions:
- issue: Cách dịch δοῦλος trong bối cảnh xã hội cụ thể
  choice: 'đầy tớ, kèm chú thích ''Cũng có thể dịch: nô lệ'''
  alternative: nô lệ
  rationale: δοῦλος có thể nhấn mạnh thân phận bị sở hữu, nhưng tiếng Việt 'đầy tớ' tự nhiên hơn trong lời kể này và không buộc phải xác định chính xác địa vị pháp lý vốn không được câu văn giải thích; chú thích bảo lưu khả năng dịch mạnh hơn.
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải. Dùng “Đức Giê-su” và “thầy thượng tế” theo lối gọi quen thuộc trong tiếng Việt; giữ “Kìa” để tái hiện sự chuyển cảnh đột ngột. Dấu chú thích [a] được đặt ngay sau câu có từ cần chú giải.
