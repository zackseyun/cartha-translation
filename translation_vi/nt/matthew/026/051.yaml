revisions:
- from: Kìa, một người trong số những người đi cùng Đức Giê-su đưa tay rút gươm, đánh đầy tớ của thầy thượng tế và chém đứt tai người ấy.[a]
  to: Kìa, một người trong số những người đi cùng Đức Giê-su đưa tay, rút gươm của mình, rồi đánh người nô lệ của vị thượng tế và chém đứt tai người ấy.[a]
  rationale: Chỉnh “đầy tớ” thành “nô lệ” để phản ánh trực tiếp δοῦλος, đồng thời đảo phương án thay thế trong chú thích. Bổ sung “của mình” cho αὐτοῦ và thay “thầy thượng tế” bằng “vị thượng tế” để câu văn hiện đại, trung tính hơn. Các thay đổi không xác định thêm danh tính của người cầm gươm hay mức độ tổn thương ngoài điều nguồn văn nói.
