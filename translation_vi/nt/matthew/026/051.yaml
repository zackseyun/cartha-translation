  verdict: revise
  source_fidelity: 'Bản dịch truyền đạt đúng chuỗi hành động và kết quả: người đi với Đức Giê-su rút gươm, đánh thuộc hạ của thượng tế, khiến tai người ấy bị chém đứt. Tuy nhiên, δοῦλον có nghĩa cơ bản là “nô lệ”; “đầy tớ” trong thân câu làm giảm nghĩa xã hội cụ thể hơn của từ này. Bản dịch cũng nên biểu thị rõ sở hữu trong “gươm của mình” (αὐτοῦ).'
