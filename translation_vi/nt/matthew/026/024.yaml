revisions:
- from: Con Người ra đi như lời đã chép về Ngài; nhưng khốn cho kẻ phản Con Người! Thà kẻ ấy đừng sinh ra thì hơn.
  to: Con Người quả thật ra đi đúng như điều đã chép về Ngài, nhưng khốn cho người ấy, là kẻ qua người ấy Con Người bị phản bội[a]! Thà người ấy đừng sinh ra thì hơn.
