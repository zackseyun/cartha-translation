id: MAT.26.24
reference: Matthew 26:24
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὁ μὲν υἱὸς τοῦ ἀνθρώπου ὑπάγει καθὼς γέγραπται περὶ αὐτοῦ, οὐαὶ δὲ τῷ ἀνθρώπῳ ἐκείνῳ δι’ οὗ ὁ υἱὸς τοῦ ἀνθρώπου παραδίδοται· καλὸν ἦν αὐτῷ εἰ οὐκ ἐγεννήθη ὁ ἄνθρωπος ἐκεῖνος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/024.yaml
  text: The Son of Man indeed goes just as it is written about him[a], but woe to that man through whom the Son of Man is betrayed. It would have been better for him if that man had not been born.
translation:
  language: vi
  text: Con Người quả thật ra đi đúng như điều đã chép về Ngài, nhưng khốn cho người ấy, là kẻ qua người ấy Con Người bị phản bội[a]! Thà người ấy đừng sinh ra thì hơn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: «bị trao nộp». Động từ Hy Lạp có thể mang nghĩa «phản bội» hoặc, theo nghĩa sát hơn, «trao nộp»; trong ngữ cảnh này, «bị phản bội» làm rõ sự phản trắc của Giu-đa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ μὲν υἱὸς τοῦ ἀνθρώπου
  choice: Con Người
  rationale: Giữ danh hiệu đã được xác lập trong truyền thống Kinh Thánh tiếng Việt; tương phản μὲν...δὲ được thể hiện tự nhiên qua dấu chấm phẩy và “nhưng”, không cần dịch μὲν riêng thành một từ dễ gây nặng câu.
- source_word: ὑπάγει
  choice: ra đi
  rationale: Giữ cách nói kín đáo của động từ hiện tại, không diễn giải trực tiếp thành “đi chịu chết”, dù cuộc thương khó sắp đến được hàm ý trong văn cảnh.
- source_word: καθὼς γέγραπται περὶ αὐτοῦ
  choice: như lời đã chép về Ngài
  rationale: Cách nói tự nhiên, trang trọng trong tiếng Việt, truyền đạt hành động đã được chép và còn hiệu lực; “về Ngài” giữ đúng περὶ αὐτοῦ.
- source_word: οὐαὶ δὲ τῷ ἀνθρώπῳ ἐκείνῳ
  choice: nhưng khốn cho kẻ ấy
  rationale: “Khốn cho” giữ sắc thái tuyên cáo phán xét của οὐαί; “kẻ ấy” chỉ người đàn ông cụ thể trong ngữ cảnh và tránh lặp từ nặng nề.
- source_word: δι’ οὗ ... παραδίδοται
  choice: kẻ phản Con Người
  rationale: “Phản” diễn đạt tự nhiên hành vi phản bội của Giu-đa trong ngữ cảnh, đồng thời cấu trúc tiếng Việt gọn hơn lối dịch sát “qua người mà...”. Ý rộng hơn “trao nộp” được ghi ở chú thích.
- source_word: καλὸν ἦν αὐτῷ εἰ οὐκ ἐγεννήθη
  choice: Thà kẻ ấy đừng sinh ra thì hơn
  rationale: Thành ngữ tiếng Việt tự nhiên truyền đạt đầy đủ lực phản thực và ý điều đó tốt hơn cho chính người ấy, không biến câu thành một khẳng định giáo lý vượt quá văn bản.
theological_decisions:
- issue: Mối quan hệ giữa điều Kinh Thánh đã chép và trách nhiệm của người phản bội
  choice: 'Giữ cả hai vế: Con Người ra đi theo lời đã chép, còn người phản Ngài vẫn ở dưới lời tuyên bố “khốn cho”.'
  alternative: Giải thích theo hướng tất định làm nhẹ trách nhiệm của Giu-đa, hoặc chỉ nhấn mạnh hành động con người và làm nhẹ sự ứng nghiệm Kinh Thánh.
  rationale: Bản dịch bảo toàn sự căng thẳng thần học ngay trong câu mà không giải quyết nó theo một hệ phái.
- issue: Lực của lời nói về việc không sinh ra
  choice: 'Dịch như một lời phán xét nghiêm trọng: “Thà kẻ ấy đừng sinh ra thì hơn.”'
  alternative: Xem đây chỉ là cường điệu tu từ, hoặc dùng câu này để khẳng định một giáo thuyết chi tiết về số phận đời đời.
  rationale: Cách dịch giữ nguyên mức độ nghiêm trọng nhưng không thêm kết luận hệ thống mà nguyên văn không nói rõ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Tuy nhiên, bản chính không dùng chú thích nên không đặt dấu [a].
