  terminology: Giữ «Con Người», «Ngài», «khốn cho», và «phản bội» phù hợp văn phong Kinh Thánh tiếng Việt hiện đại. Chú thích nêu «bị trao nộp» bảo toàn biên độ nghĩa của παραδίδοται mà không ép một cách giải thích thần học.
