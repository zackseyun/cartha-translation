  text: ἀποκριθεὶς δὲ Ἰούδας ὁ παραδιδοὺς αὐτὸν εἶπεν· Μήτι ἐγώ εἰμι, ῥαββί; λέγει αὐτῷ· Σὺ εἶπας.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/025.yaml
  text: Then Judas, the one betraying him, answered and said, “Surely I am not the one, Rabbi?” He said to him, “You have said so.”
translation:
  language: vi
  text: 'Bấy giờ Giu-đa, kẻ phản Ngài, đáp: “Thưa Ra-bi, chẳng lẽ con là người đó sao?” Ngài nói với ông: “Chính anh đã nói.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ παραδιδοὺς αὐτόν
  choice: kẻ đang phản nộp Ngài
  rationale: Phân từ hiện tại xác định Giu-đa là người đang giao nộp Đức Giê-su; “phản nộp” giữ được cả ý giao nộp lẫn tính phản bội trong ngữ cảnh.
- source_word: Μήτι ἐγώ εἰμι
  choice: chẳng lẽ là con sao?
  rationale: μήτι cho thấy người hỏi mong đợi câu trả lời phủ định; cách nói này tự nhiên trong tiếng Việt và vẫn giữ sắc thái né tránh của câu hỏi.
- source_word: ῥαββί
  choice: Ráp-bi
  rationale: Giữ danh xưng Do Thái bằng dạng phiên âm quen thuộc; đại từ “con” diễn đạt cách xưng hô của môn đồ với thầy.
- source_word: Σὺ εἶπας
  choice: Chính anh đã nói
  rationale: Dịch sát lối đáp gián tiếp, dè dặt của tiếng Hy Lạp, không diễn giải thẳng thành “Đúng, chính là anh”.
theological_decisions:
- issue: Mức độ xác nhận trong câu Σὺ εἶπας
  choice: Chính anh đã nói.
  alternative: Đúng, chính là anh.
  rationale: Nguyên văn dùng một công thức đáp gián tiếp. Bản dịch giữ nguyên sự hàm ý và căng thẳng của lời đáp thay vì làm cho nó minh nhiên hơn nguồn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Ngài” dùng cho Đức Giê-su; “anh” trong lời đáp phân biệt với cách Giu-đa tự xưng “con” khi gọi Đức Giê-su là Ráp-bi.
