id: MAT.26.11
reference: Matthew 26:11
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: πάντοτε γὰρ τοὺς πτωχοὺς ἔχετε μεθ’ ἑαυτῶν, ἐμὲ δὲ οὐ πάντοτε ἔχετε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/011.yaml
  text: For you always have the poor with you[a], but you do not always have me.
translation:
  language: vi
  text: Vì các con luôn có người nghèo ở bên mình[a], nhưng các con không phải lúc nào cũng có Ta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “những người nghèo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντοτε
  choice: luôn
  rationale: Diễn đạt sự hiện diện thường xuyên, tự nhiên trong tiếng Việt và giữ được sự đối ứng với οὐ πάντοτε ở vế sau.
- source_word: γὰρ
  choice: vì
  rationale: Nêu lý do cho lời nói ngay trước đó và giữ rõ quan hệ giải thích.
- source_word: τοὺς πτωχοὺς
  choice: người nghèo
  rationale: Chỉ những người nghèo nói chung; tiếng Việt không cần mạo từ hay dấu hiệu số nhiều tại đây.
- source_word: ἔχετε
  choice: có
  rationale: Trong cả hai vế, động từ nói đến sự hiện diện hay khả năng ở cùng, chứ không hàm ý sở hữu.
- source_word: μεθ’ ἑαυτῶν
  choice: ở bên mình
  rationale: Diễn đạt tự nhiên việc người nghèo hiện diện cùng các môn đồ, đồng thời phản ánh đại từ phản thân số nhiều mà không dùng cách nói gượng ép.
- source_word: ἐμὲ
  choice: thầy
  rationale: Đại từ chỉ Đức Giê-su được chuyển thành cách môn đồ xưng gọi người dạy mình, phù hợp ngữ cảnh đối thoại và tự nhiên trong tiếng Việt.
- source_word: δὲ
  choice: nhưng
  rationale: Thể hiện rõ sự tương phản giữa sự hiện diện thường xuyên của người nghèo và khoảng thời gian hữu hạn Đức Giê-su ở cùng họ.
- source_word: οὐ πάντοτε
  choice: không phải lúc nào cũng
  rationale: Cách nói tự nhiên trong tiếng Việt, giữ nguyên ý phủ định ‘không luôn luôn’ mà không biến thành ‘không bao giờ’.
theological_decisions:
- issue: Hàm ý về sự hiện diện của Đức Giê-su
  choice: Giữ nguyên sự tương phản về thời gian giữa người nghèo luôn hiện diện và việc các môn đồ không phải lúc nào cũng có Đức Giê-su ở cùng.
  alternative: Hiểu câu này như sự xem nhẹ việc chăm lo cho người nghèo.
  rationale: Bản văn Hy Lạp thiết lập một tương phản về thời gian, không đưa ra sự hạ thấp giá trị của người nghèo. Bản dịch không thêm lời giải thích nhằm phủ nhận trách nhiệm thương xót, cũng không xác định sâu hơn bản chất sự vắng mặt sắp đến của Đức Giê-su.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “các con—thầy” để phản ánh quan hệ giữa Đức Giê-su và các môn đồ trong ngữ cảnh; tránh cách dịch quá sát “với chính các con” vì không tự nhiên. Dấu [a] được đặt ngay sau cụm từ liên quan.
