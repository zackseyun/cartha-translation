    issue: “thầy” thay cho ἐμέ
    rationale: ἐμέ là đại từ ngôi thứ nhất, “mình/Ta”, chứ không phải danh xưng διδάσκαλος (“thầy”). Dù phù hợp ngữ cảnh, “thầy” thêm sắc thái quan hệ không có trong câu nguồn.
