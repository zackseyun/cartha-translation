review_pass:
  verdict: revise
  source_fidelity: Bản dịch giữ đúng quan hệ giải thích của γάρ, sự đối lập πάντοτε/οὐ πάντοτε, và nghĩa tập thể của τοὺς πτωχούς. Tuy nhiên, “thầy” diễn giải đại từ trực tiếp ἐμέ (“tôi/Ta”) thành một tước xưng; bản Hy Lạp chỉ nói “mình/Ta”, không dùng danh xưng “thầy”.
  naturalness: Câu văn tự nhiên, rõ ràng trong tiếng Việt hiện đại. Việc lặp “các con” ở vế hai làm rõ chủ ngữ vốn được lược trong tiếng Hy Lạp và vẫn phù hợp văn phong Kinh Thánh trang trọng vừa phải.
  terminology: Dùng cặp xưng hô “các con—Ta” phù hợp lời Đức Giê-su nói với các môn đồ và bảo toàn tính trực tiếp của ἐμέ tốt hơn “các con—thầy”. “Người nghèo” là cách nói tập thể tự nhiên.
  issues:
