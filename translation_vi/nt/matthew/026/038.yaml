    rationale: ἕως θανάτου diễn tả nỗi buồn đạt đến cực độ, “đến chết”; từ “được” không có đối ứng trong nguyên ngữ và làm giảm tính trang trọng của lời nói.
  - severity: low
    issue: “Thức canh” dễ nghiêng về nghĩa canh gác.
    rationale: γρηγορεῖτε bao hàm thức không ngủ và sự tỉnh táo/cảnh giác. “Canh thức” diễn đạt tự nhiên hơn cả hai sắc thái trong văn phong Kinh Thánh.
  - severity: low
    issue: “Linh hồn tôi” có thể gợi nghĩa kỹ thuật hơn mức cần thiết trong tiếng Việt hiện đại.
    rationale: ψυχή nên được giữ bằng một danh từ, nhưng “tâm hồn tôi” là cách nói tự nhiên khi diễn tả nỗi đau sâu xa mà không hàm ý một lập trường nhân học đặc thù.
