id: MAT.26.38
reference: Matthew 26:38
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: τότε λέγει ⸀αὐτοῖς· Περίλυπός ἐστιν ἡ ψυχή μου ἕως θανάτου· μείνατε ὧδε καὶ γρηγορεῖτε μετ’ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/038.yaml
  text: Then he says to them[a], “My soul is deeply grieved, even to death[c][b]. Remain here and keep watch with me.”
translation:
  language: vi
  text: 'Bấy giờ, Ngài nói với họ: “Tâm hồn tôi vô cùng buồn rầu, đến chết.[a] Hãy ở lại đây và canh thức với tôi.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “Tâm hồn tôi buồn rầu đến mức chết.”'
    reason: lexical_alternative
  - marker: b
    text: “Canh thức” cũng có thể dịch là “hãy thức với tôi” hoặc “hãy tỉnh thức với tôi.” Từ Hy Lạp có thể bao hàm cả việc không ngủ lẫn sự cảnh giác, tỉnh thức.
    reason: alternative_reading
lexical_decisions:
- source_word: τότε
  choice: Bấy giờ
  rationale: Liên từ thời gian nối tiếp diễn biến; “Bấy giờ” tự nhiên trong văn kể trang trọng và giữ mạch tường thuật.
- source_word: λέγει αὐτοῖς
  choice: Ngài nói với họ
  rationale: Giữ thì hiện tại lịch sử của tiếng Hy Lạp để tạo tính sống động; “Ngài” phù hợp văn phong Kinh Thánh tiếng Việt hiện đại và chỉ Chúa Giê-su trong ngữ cảnh.
- source_word: Περίλυπός ἐστιν
  choice: buồn rầu
  rationale: περίλυπος diễn tả nỗi buồn rất sâu và bao trùm; mức độ mãnh liệt được truyền đạt qua toàn cụm “buồn rầu đến chết được,” tránh diễn đạt nặng nề không tự nhiên.
- source_word: ἡ ψυχή μου
  choice: Linh hồn tôi
  rationale: Giữ danh từ ψυχή thay vì giản lược thành “tôi,” bảo toàn cách diễn đạt nguyên ngữ và chiều sâu của nỗi đau nội tâm mà không áp đặt một hệ thống nhân học.
- source_word: ἕως θανάτου
  choice: đến chết được
  rationale: Thành ngữ tiếng Việt tự nhiên diễn tả mức độ tột cùng, tương ứng với ý nỗi buồn chạm đến ngưỡng cái chết; chú thích bảo lưu cách hiểu “đến mức phải chết.”
- source_word: μείνατε ὧδε
  choice: Hãy ở lại đây
  rationale: Mệnh lệnh yêu cầu các môn đồ tiếp tục ở tại chỗ; bản dịch trực tiếp, tự nhiên và trang trọng.
- source_word: γρηγορεῖτε
  choice: thức canh
  rationale: Kết hợp nghĩa thức không ngủ với sự tỉnh thức, canh chừng; thích hợp với bối cảnh Ghết-sê-ma-nê và bảo tồn hai sắc thái của động từ.
- source_word: μετ’ ἐμοῦ
  choice: với tôi
  rationale: Dịch trực tiếp ý đồng hành của μετά với sở hữu cách.
theological_decisions:
- issue: Cách dịch ψυχή trong lời Chúa Giê-su
  choice: Linh hồn tôi
  alternative: Tôi buồn rầu
  rationale: Giữ danh từ hiện diện rõ trong nguyên ngữ và thực tại trọn vẹn của nỗi thống khổ nơi Chúa Giê-su, nhưng không suy diễn thành một khẳng định kỹ thuật về cấu tạo con người.
- issue: Sắc thái của γρηγορεῖτε
  choice: thức canh
  alternative: hãy tỉnh thức; hãy thức với tôi
  rationale: “Thức canh” cùng lúc gợi việc không ngủ và sự cảnh giác. Chú thích nêu cách diễn đạt sát nghĩa trực tiếp hơn để không làm mất tính đa nghĩa.
- issue: Ý nghĩa của ἕως θανάτου
  choice: đến chết được
  alternative: đến mức phải chết; cho đến chết
  rationale: Cụm từ có thể diễn tả nỗi buồn tột độ, đến ngưỡng cái chết. Bản chính dùng thành ngữ Việt tự nhiên, còn chú thích bảo lưu cách diễn đạt trực tiếp hơn mà không quyết định cơ chế cụ thể.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Giữ hiện tại lịch sử “nói,” giữ “linh hồn” theo nguyên ngữ, và dùng “thức canh” để chuyển tải đồng thời sự thức không ngủ và thái độ tỉnh thức.
