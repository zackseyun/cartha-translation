review_pass:
  verdict: revise
  source_fidelity: Bản nháp truyền đạt đúng cấu trúc và nội dung cốt lõi của câu, gồm hiện tại lịch sử, danh từ ψυχή, mức độ cực độ của nỗi sầu khổ, lệnh ở lại, và γρηγορεῖτε μετ’ ἐμοῦ. Tuy nhiên, “đến chết được” là một thành ngữ khẩu ngữ, không phù hợp với văn phong trang trọng và làm câu kém tự nhiên. “Thức canh” có thể gợi hành vi canh gác hơn là lời kêu gọi vừa thức không ngủ vừa tỉnh táo của γρηγορεῖτε.
  naturalness: 'Nên dùng “tâm hồn” cho ἡ ψυχή μου: vẫn giữ danh từ của nguyên ngữ, tự nhiên hơn “linh hồn” trong cách nói về nỗi sầu khổ nội tâm. “Canh thức” là cụm từ Kinh Thánh tiếng Việt quen thuộc và phù hợp hơn “thức canh.”'
  terminology: “Ngài,” “tâm hồn,” và “canh thức” giữ được sắc thái trang trọng hiện đại. “Tâm hồn” ở đây không áp đặt một phân biệt nhân học kỹ thuật; nó chuyển tải cách dùng ψυχή như chủ thể của đời sống/nỗi đau nội tâm. Chú thích cần nêu rõ sắc thái vừa không ngủ vừa cảnh giác của γρηγορεῖτε.
  issues:
