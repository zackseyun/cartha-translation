  text: ἐδύνατο γὰρ ⸀τοῦτο πραθῆναι πολλοῦ καὶ δοθῆναι πτωχοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/009.yaml
  text: For this could have been sold for a great deal and given to the poor[a].
translation:
  language: vi
  text: Vì thứ này có thể đã được bán với giá cao, và số tiền thu được được đem cho người nghèo[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “bán được nhiều tiền” hoặc “bán với giá rất cao.” Tiếng Hy Lạp dùng sở hữu cách để chỉ giá bán.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδύνατο
  choice: đã có thể
  rationale: Động từ ở thì chưa hoàn thành diễn tả một khả năng trong quá khứ nhưng đã không được thực hiện.
- source_word: γὰρ
  choice: Vì
  rationale: Giữ chức năng giải thích của liên từ, nối lời này với lời phàn nàn ngay trước đó.
- source_word: τοῦτο
  choice: thứ này
  rationale: Đại từ chỉ định giống trung số ít chỉ vật vừa được nhắc đến; cách dịch này tự nhiên trong tiếng Việt mà không lặp thêm danh từ không có trong câu Hy Lạp.
- source_word: πραθῆναι
  choice: được bán
  rationale: Động từ nguyên mẫu aorist bị động của πιπράσκω, phối hợp với ἐδύνατο để nói về khả năng bán trong quá khứ.
- source_word: πολλοῦ
  choice: với giá cao
  rationale: Sở hữu cách chỉ giá tiền sau động từ 'bán'; cách diễn đạt này tự nhiên và giữ ý một khoản lớn mà không xác định con số.
- source_word: δοθῆναι
  choice: tiền đem cho
  rationale: Nguyên mẫu aorist bị động của δίδωμι phối hợp với 'được bán'. Tiếng Việt cần nêu ngầm hiểu rằng số tiền thu được, chứ không phải chính vật ấy, được trao cho người nghèo.
- source_word: πτωχοῖς
  choice: người nghèo
  rationale: Tính từ số nhiều dùng như danh từ ở cách tặng dữ, chỉ những người nghèo nói chung.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “rồi tiền đem cho” để diễn đạt tự nhiên quan hệ ý nghĩa giữa việc bán món đồ và trao số tiền thu được, đồng thời tránh cách hiểu rằng chính món đồ sẽ được cho người nghèo.
