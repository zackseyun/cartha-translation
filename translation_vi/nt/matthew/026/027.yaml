id: MAT.26.27
reference: Matthew 26:27
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ⸀λαβὼν ποτήριον καὶ εὐχαριστήσας ἔδωκεν αὐτοῖς λέγων· Πίετε ἐξ αὐτοῦ πάντες,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/027.yaml
  text: And having taken a cup and given thanks[a], he gave it to them, saying, “Drink from it[c][b], all of you,”
translation:
  language: vi
  text: 'Ngài cầm một chén[a], dâng lời tạ ơn rồi trao cho họ và phán: “Tất cả hãy uống từ chén ấy.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “chén ấy.” Tiếng Hy Lạp không có mạo từ trước từ “chén,” dù ngữ cảnh bữa ăn có thể khiến chiếc chén được hiểu là đã xác định.
    reason: lexical_alternative
lexical_decisions:
- source_word: λαβὼν
  choice: cầm
  rationale: Phân từ bất định diễn tả hành động xảy ra trước động từ chính; tiếng Việt tự nhiên có thể dùng chuỗi động từ “cầm… dâng… rồi trao” mà vẫn giữ rõ trình tự.
- source_word: ποτήριον
  choice: một chén
  rationale: Danh từ Hy Lạp không có mạo từ; “một chén” phản ánh trực tiếp hình thức ấy, còn ngữ cảnh bữa ăn vẫn có thể khiến người đọc hiểu đó là chiếc chén cụ thể.
- source_word: εὐχαριστήσας
  choice: dâng lời tạ ơn
  rationale: Diễn đạt đúng nghĩa cảm tạ, với văn phong trang trọng và tự nhiên, không đưa thêm thuật ngữ bí tích hay ý nghĩa “chúc phước cho chén” vốn không được nói rõ.
- source_word: ἔδωκεν αὐτοῖς
  choice: trao cho họ
  rationale: “Trao” phù hợp với việc đưa chén cho các môn đồ; “cho họ” thể hiện trực tiếp bổ ngữ gián tiếp.
- source_word: λέγων
  choice: và phán
  rationale: Tiếng Việt tự nhiên chuyển phân từ giới thiệu lời nói thành động từ hữu hạn; “phán” giữ sắc thái trang trọng thích hợp với lời của Chúa Giê-su.
- source_word: Πίετε
  choice: hãy uống
  rationale: Thể mệnh lệnh số nhiều được diễn đạt tự nhiên bằng “hãy uống”.
- source_word: ἐξ αὐτοῦ
  choice: từ chén ấy
  rationale: Giữ ý nguồn của ἐξ và làm rõ đại từ chỉ về chiếc chén vừa được nhắc đến.
- source_word: πάντες
  choice: tất cả
  rationale: Đặt cùng mệnh lệnh để cho thấy lời truyền hướng đến toàn thể những người hiện diện, chứ không nói rằng họ phải uống hết lượng trong chén.
theological_decisions:
- issue: Sắc thái bí tích có thể được gán cho εὐχαριστήσας
  choice: dâng lời tạ ơn
  alternative: chúc phước cho chén
  rationale: Động từ Hy Lạp nói rõ hành động cảm tạ; bản dịch không nhập thêm cách giải thích thần học về đối tượng hay hiệu lực của lời tạ ơn.
- issue: Phạm vi của πάντες
  choice: Tất cả hãy uống
  alternative: hãy uống hết chén ấy
  rationale: πάντες chỉ toàn thể những người được truyền uống, không bổ nghĩa cho lượng thức uống; cách dịch tránh biến câu này thành mệnh lệnh uống cạn.
- issue: Tính xác định của ποτήριον
  choice: một chén
  alternative: chén ấy
  rationale: Tiếng Hy Lạp không dùng mạo từ, nhưng ngữ cảnh có thể cho phép cách hiểu xác định; bản chính giữ hình thức không xác định và ghi nhận phương án kia trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Chuỗi “cầm… dâng lời tạ ơn rồi trao” tái hiện trình tự của hai phân từ đứng trước động từ chính mà không tạo câu nặng nề trong tiếng Việt. Đại từ chủ ngữ “Ngài” duy trì phép quy chiếu kính trọng quen thuộc; câu mệnh lệnh không thêm danh xưng quan hệ như “các con” hay “anh em,” vì nguyên văn chỉ có động từ số nhiều và πάντες.
