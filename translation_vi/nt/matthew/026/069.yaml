source:
  edition: SBLGNT
  text: Ὁ δὲ Πέτρος ⸂ἐκάθητο ἔξω⸃ ἐν τῇ αὐλῇ· καὶ προσῆλθεν αὐτῷ μία παιδίσκη λέγουσα· Καὶ σὺ ἦσθα μετὰ Ἰησοῦ τοῦ Γαλιλαίου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/069.yaml
  text: Peter was sitting outside in the courtyard[a], and one servant girl came up to him, saying, “You also were with Jesus the Galilean.”
translation:
  language: vi
  text: 'Còn Phi-e-rơ đang ngồi ở ngoài sân thì một cô hầu[a] đến gần ông và nói: “Ông cũng đã ở cùng Giê-su, người Ga-li-lê.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “nữ tỳ” hoặc “nữ nô lệ.” Từ Hy Lạp παιδίσκη chỉ một người nữ phục dịch, thường là người trẻ; đôi khi từ này có thể hàm ý thân phận nô lệ.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Còn
  rationale: Đánh dấu sự chuyển cảnh nhẹ và đưa câu chuyện trở lại với Phi-e-rơ, không biến nó thành một từ chỉ thời gian.
- source_word: ἐκάθητο ἔξω
  choice: đang ngồi bên ngoài
  rationale: “Đang ngồi” thể hiện trạng thái tiếp diễn của thì vị hoàn; “bên ngoài” đặt Phi-e-rơ ở ngoài nơi cuộc xét hỏi đang diễn ra.
- source_word: ἐν τῇ αὐλῇ
  choice: trong sân
  rationale: αὐλή ở đây là khoảng sân thuộc dinh thượng tế; “trong sân” tự nhiên và đủ rõ trong tiếng Việt.
- source_word: προσῆλθεν αὐτῷ
  choice: đến gần ông
  rationale: Diễn đạt trực tiếp hành động tiến đến chỗ Phi-e-rơ.
- source_word: μία παιδίσκη
  choice: một nữ tỳ
  rationale: Giữ số từ μία và diễn đạt vai trò nữ gia nhân của παιδίσκη; địa vị nô lệ có thể có nhưng không hoàn toàn chắc chắn nên được nêu trong chú thích.
- source_word: λέγουσα
  choice: và nói
  rationale: Chuyển phân từ sang động từ hữu hạn để câu tiếng Việt tự nhiên mà vẫn giữ đúng trình tự hành động.
- source_word: Καὶ σὺ
  choice: Ông cũng
  rationale: “Cũng” giữ ý nhấn mạnh rằng Phi-e-rơ là một trong những người có liên hệ với Đức Giê-su.
- source_word: ἦσθα μετὰ
  choice: đã ở với
  rationale: Giữ nghĩa quan hệ trực tiếp, không diễn giải thành “là môn đồ” hay “thuộc nhóm người theo”.
- source_word: Ἰησοῦ τοῦ Γαλιλαίου
  choice: Giê-su, người Ga-li-lê
  rationale: Giữ cách cô gái nhận diện Đức Giê-su theo vùng xuất thân, với lối diễn đạt tự nhiên trong tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “ông” trong lời cô gái nói với Phi-e-rơ; giữ danh xưng địa lý “người Ga-li-lê” mà không thêm diễn giải thần học.
