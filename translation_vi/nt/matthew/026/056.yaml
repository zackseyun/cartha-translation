id: MAT.26.56
reference: Matthew 26:56
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: τοῦτο δὲ ὅλον γέγονεν ἵνα πληρωθῶσιν αἱ γραφαὶ τῶν προφητῶν. τότε οἱ μαθηταὶ πάντες ἀφέντες αὐτὸν ἔφυγον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/056.yaml
  text: But all this has happened so that the Scriptures of the prophets might be fulfilled[a]. Then all the disciples left him and fled.
translation:
  language: vi
  text: Nhưng tất cả những điều này đã xảy ra để những lời Kinh Thánh của các nhà tiên tri được ứng nghiệm. Bấy giờ, tất cả các môn đồ đều bỏ Ngài[a] mà chạy trốn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “ruồng bỏ Ngài”; phân từ ἀφέντες trong ngữ cảnh có thể mang sắc thái mạnh là bỏ rơi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο δὲ ὅλον
  choice: Nhưng tất cả những điều này
  rationale: Cụm này chỉ toàn bộ sự việc vừa diễn ra; “nhưng” giữ sắc thái nối ý nhẹ của δέ, còn cách diễn đạt này tự nhiên trong tiếng Việt.
- source_word: γέγονεν
  choice: đã xảy ra
  rationale: Thì hoàn thành của γίνομαι diễn tả sự việc đã thành hiện thực và vẫn có ý nghĩa ở hiện tại; “đã xảy ra” là cách nói rõ ràng, tự nhiên.
- source_word: ἵνα πληρωθῶσιν
  choice: để ... được ứng nghiệm
  rationale: Giữ cấu trúc mục đích/kết quả của ἵνα với động từ bị động, đồng thời dùng thuật ngữ Kinh Thánh quen thuộc mà không giải thích quá mức.
- source_word: αἱ γραφαὶ τῶν προφητῶν
  choice: lời Kinh Thánh của các nhà tiên tri
  rationale: γραφαί trong ngữ cảnh này là Kinh Thánh; sở hữu cách “của các nhà tiên tri” được giữ ngắn gọn, không thêm ý “do viết” hay “do nói” vốn không được xác định rõ trong tiếng Hy Lạp.
- source_word: τότε
  choice: Bấy giờ
  rationale: Đánh dấu bước tiếp theo trong trình tự thuật chuyện với văn phong trang trọng nhưng vẫn dễ hiểu.
- source_word: οἱ μαθηταὶ πάντες
  choice: tất cả các môn đồ
  rationale: Giữ trọn ý tổng quát và nhấn mạnh của πάντες, không thêm từ “của Ngài” dù ngữ cảnh đã hàm ý.
- source_word: ἀφέντες αὐτὸν
  choice: bỏ Ngài
  rationale: Trong ngữ cảnh, ἀφίημι mang nghĩa rời bỏ hoặc bỏ lại. “Bỏ Ngài” tự nhiên, cô đọng và có thể truyền tải sắc thái mạnh hơn “rời Ngài”; chú thích ghi nhận cách hiểu nhấn mạnh sự ruồng bỏ.
- source_word: ἔφυγον
  choice: chạy trốn
  rationale: Diễn đạt trực tiếp hành động φεύγω, rõ hơn “bỏ chạy” và giữ sắc thái nghiêm trọng của cảnh thuật.
theological_decisions:
- issue: Ngôn ngữ ứng nghiệm và Kinh Thánh tiên tri
  choice: 'Giữ nguyên ý rõ ràng: “để lời Kinh Thánh của các nhà tiên tri được ứng nghiệm.”'
  alternative: “để những điều các nhà tiên tri viết trở thành sự thật”
  rationale: Mô-típ ứng nghiệm có ý nghĩa thần học rõ rệt trong Ma-thi-ơ. Bản dịch duy trì thể bị động và mối liên hệ với Kinh Thánh, không giản lược thành một cách diễn giải.
- issue: Sắc thái mục đích hay kết quả của ἵνα
  choice: Dịch “để”, giữ khả năng diễn tả mục đích/kết quả.
  alternative: “vì thế ... đã được ứng nghiệm”
  rationale: Cấu trúc Hy Lạp không nên bị biến thành quan hệ nguyên nhân thuần túy; “để” bảo tồn sức căng thần học của câu mà không xác quyết vượt quá văn bản.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” cho đại từ chỉ Đức Giê-su; “môn đồ”, “Kinh Thánh” và “ứng nghiệm” giữ văn phong Kinh Thánh quen thuộc. Dấu chú thích [a] được đặt ngay sau mệnh đề liên quan.
