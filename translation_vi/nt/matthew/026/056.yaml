  terminology: “Kinh Thánh,” “ứng nghiệm,” “môn đồ,” và “Ngài” nhất quán với văn phong Kinh Thánh tiếng Việt. “Những lời Kinh Thánh của các nhà tiên tri” bảo toàn cách nói sở hữu không mở rộng thành “được viết/nói bởi.”
