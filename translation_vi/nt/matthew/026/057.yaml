  text: Οἱ δὲ κρατήσαντες τὸν Ἰησοῦν ἀπήγαγον πρὸς Καϊάφαν τὸν ἀρχιερέα, ὅπου οἱ γραμματεῖς καὶ οἱ πρεσβύτεροι συνήχθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/057.yaml
  text: Those who had seized Jesus led him away to Caiaphas the high priest[a], where the scribes and the elders had gathered.
translation:
  language: vi
  text: Những người đã bắt giữ Đức Giê-su dẫn ngài đến chỗ thượng tế Cai-pha, nơi các kinh sư và các trưởng lão đã tụ họp[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đã được tập hợp.” Trong ngữ cảnh này, động từ Hy Lạp có thể được hiểu theo nghĩa thụ động hoặc theo nghĩa nội động: “đã tụ họp.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἱ δὲ
  choice: Những người
  rationale: Mạo từ đi với phân từ được chuyển thành cụm danh từ tự nhiên trong tiếng Việt. δέ chỉ nhẹ nhàng tiếp nối câu chuyện nên không cần thêm một từ nối có sắc thái đối lập rõ.
- source_word: κρατήσαντες
  choice: đã bắt giữ
  rationale: Phân từ bất định chỉ hành động xảy ra trước động từ chính; “đã bắt giữ” vừa thể hiện thứ tự thời gian vừa giữ nghĩa nắm giữ, khống chế mà không tăng sắc thái pháp lý như “bắt giam”.
- source_word: ἀπήγαγον
  choice: dẫn ngài đến
  rationale: Động từ có nghĩa dẫn hoặc đưa đi. Cách dịch này tự nhiên trong tiếng Việt và giữ hình ảnh di chuyển dưới sự kiểm soát, không thêm chi tiết về địa điểm.
- source_word: πρὸς Καϊάφαν
  choice: đến chỗ ... Cai-pha
  rationale: πρός với đối cách diễn tả hướng chuyển động đến một người. “Đến chỗ” tự nhiên hơn “đến Cai-pha” trong tiếng Việt và không thêm ý “ra trước mặt” hay “đến nhà” Cai-pha.
- source_word: τὸν ἀρχιερέα
  choice: thượng tế
  rationale: Đây là danh xưng tiêu chuẩn cho chức vụ ἀρχιερεύς ở số ít trong bối cảnh này.
- source_word: ὅπου
  choice: nơi
  rationale: Giữ nghĩa chỉ địa điểm của trạng từ quan hệ và nối mệnh đề một cách gọn, tự nhiên.
- source_word: οἱ γραμματεῖς
  choice: các kinh sư
  rationale: “Kinh sư” là cách gọi quen thuộc và chính xác cho những chuyên gia sao chép, giải thích và giảng dạy Luật trong bối cảnh Do Thái giáo.
- source_word: οἱ πρεσβύτεροι
  choice: các trưởng lão
  rationale: Chỉ những vị lãnh đạo được công nhận trong cộng đồng Do Thái; “trưởng lão” là thuật ngữ rõ và đã được dùng rộng rãi.
- source_word: συνήχθησαν
  choice: đã tụ họp
  rationale: Thì bất định trong mạch kể cho thấy họ đã có mặt khi Đức Giê-su được dẫn đến. Hình thức Hy Lạp có thể hiểu theo nghĩa thụ động hoặc như một sự việc nội động; bản chính dùng cách diễn đạt tự nhiên “đã tụ họp” và giữ cách hiểu thụ động trong chú thích.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Giê-su” theo cách xưng gọi kính trọng phổ biến trong tiếng Việt; “ngài” viết thường để tránh đưa thêm một tuyên bố thần học vốn không nằm trong đại từ ngầm của câu Hy Lạp.
