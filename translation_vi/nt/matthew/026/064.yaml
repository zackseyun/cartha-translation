id: MAT.26.64
reference: Matthew 26:64
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: λέγει αὐτῷ ὁ Ἰησοῦς· Σὺ εἶπας· πλὴν λέγω ὑμῖν, ἀπ’ ἄρτι ὄψεσθε τὸν υἱὸν τοῦ ἀνθρώπου καθήμενον ἐκ δεξιῶν τῆς δυνάμεως καὶ ἐρχόμενον ἐπὶ τῶν νεφελῶν τοῦ οὐρανοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/064.yaml
  text: Jesus said to him[a], “You have said so. But I tell you[c][b], from now on you will see the Son of Man seated at the right hand of Power and coming on the clouds of heaven.”
translation:
  language: vi
  text: 'Đức Giê-su nói với ông: “Ông đã nói như vậy.[a] Nhưng tôi nói với các ông rằng,[c] từ nay các ông sẽ thấy Con Người ngự bên hữu Đấng Quyền Năng[b] và đến trên các đám mây trên trời.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Ông đã nói điều đó.” Cách nói Hy Lạp này là một lời đáp mang tính xác nhận.'
    reason: lexical_alternative
  - marker: b
    text: “Đấng Quyền Năng” là cách nói tôn kính để chỉ Đức Chúa Trời.
    reason: cultural_note
  - marker: c
    text: Lời này gợi đến Đa-ni-ên 7:13 và Thi Thiên 110:1.
    reason: cross_reference
lexical_decisions:
- source_word: Σὺ εἶπας
  choice: Chính ông đã nói như vậy
  rationale: Giữ nguyên lối đáp mang tính xác nhận nhưng không giản lược thành một tiếng “Phải”; từ “chính” làm rõ sắc thái nhấn mạnh của đại từ Σὺ.
- source_word: πλὴν
  choice: Nhưng
  rationale: Diễn đạt tự nhiên sức chuyển ý đối lập sang lời tuyên bố long trọng tiếp theo.
- source_word: ἀπ’ ἄρτι
  choice: từ nay
  rationale: Diễn đạt mốc thời gian bắt đầu từ thời điểm này mà không buộc nghĩa thành “ngay lập tức”.
- source_word: ὄψεσθε
  choice: các ông sẽ thấy
  rationale: Dạng số nhiều hướng đến những người hiện diện trong phiên xét xử; “sẽ thấy” là cách dịch trực tiếp và tự nhiên.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: Con Người
  rationale: Giữ danh xưng đã định hình trong Kinh Thánh cùng âm hưởng Đa-ni-ên, thay vì diễn giải thành một danh xưng thần học khác.
- source_word: καθήμενον
  choice: ngự
  rationale: Trong ngữ cảnh tôn vương và tôn cao, “ngự” tự nhiên và trang trọng hơn “ngồi”, đồng thời vẫn thể hiện tư thế được nói đến.
- source_word: ἐκ δεξιῶν
  choice: bên hữu
  rationale: Giữ thành ngữ Kinh Thánh chỉ vị trí danh dự và thẩm quyền; văn phong trang trọng nhưng vẫn quen thuộc.
- source_word: τῆς δυνάμεως
  choice: Đấng Quyền Năng
  rationale: Giữ lối nói tôn kính quy chiếu về Đức Chúa Trời mà không thay trực tiếp bằng “Đức Chúa Trời”; cách nhân xưng này tự nhiên hơn danh từ trừu tượng “Quyền Năng” trong tiếng Việt.
- source_word: ἐρχόμενον
  choice: ngự đến
  rationale: Giữ chuyển động “đến” và sắc thái uy nghi phù hợp với hình ảnh Đa-ni-ên, không giải thích thời điểm ứng nghiệm.
- source_word: ἐπὶ τῶν νεφελῶν τοῦ οὐρανοῦ
  choice: trên mây trời
  rationale: Phản ánh trực tiếp giới từ ἐπί và giữ nguyên hình ảnh liên văn bản trong Đa-ni-ên 7:13.
theological_decisions:
- issue: Sức xác nhận của câu Σὺ εἶπας
  choice: 'Một lời xác nhận có dè giữ: “Chính ông đã nói như vậy.”'
  alternative: “Phải” hoặc xem đây là lời lảng tránh
  rationale: Câu Hy Lạp có chức năng xác nhận nhưng giữ nguyên cách diễn đạt của Đức Giê-su; bản dịch không làm lời đáp thẳng hơn hoặc mơ hồ hơn nguyên văn.
- issue: Quy chiếu của τῆς δυνάμεως
  choice: Dịch là “Đấng Quyền Năng”, một lối nói tôn kính quy chiếu về Đức Chúa Trời.
  alternative: Dịch thẳng là “Đức Chúa Trời” hoặc dịch sát hình thức là “Quyền Năng”
  rationale: Không thay lối nói kính cẩn bằng tên gọi trực tiếp, đồng thời dùng một cách diễn đạt tiếng Việt có thể hiểu tự nhiên như danh xưng.
- issue: Phạm vi thời gian của hình ảnh ngự bên hữu và ngự đến
  choice: Giữ hai hình ảnh cùng thuộc nội dung “các ông sẽ thấy”, không ấn định một lịch trình cánh chung cụ thể.
  alternative: Xem toàn bộ là ứng nghiệm tức thời hoặc chỉ nói về sự tái lâm trong tương lai
  rationale: Nguyên văn đặt hai phân từ song song, kết hợp sự tôn cao với sự minh chứng mang sắc thái cánh chung; bản dịch bảo toàn sức căng này.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “ông/các ông” theo sự chuyển đổi số ít sang số nhiều trong nguyên văn; dùng “ngự” để truyền đạt sắc thái tôn vương. Mọi dấu chú thích đều được đặt trong chính văn.
