id: MAT.15.6
reference: Matthew 15:6
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸀οὐ μὴ ⸀τιμήσει τὸν πατέρα ⸀αὐτοῦ· καὶ ἠκυρώσατε ⸂τὸν λόγον⸃ τοῦ θεοῦ διὰ τὴν παράδοσιν ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/006.yaml
  text: he certainly need not honor his father[b][a]. And you have nullified the word of God for the sake of your tradition.
translation:
  language: vi
  text: “thì người ấy chắc chắn không cần phải hiếu kính cha mình[b].” Và các ông đã làm cho lời Đức Chúa Trời[a] mất hiệu lực vì truyền thống của mình.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Một số thủ bản chép “điều răn của Đức Chúa Trời” thay cho “lời Đức Chúa Trời”.
    reason: textual_variant
  - marker: b
    text: Ở đây, “hiếu kính” có lẽ bao gồm bổn phận thực tế là chu cấp và chăm lo cho cha mẹ, chứ không chỉ bày tỏ lòng kính trọng.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ μὴ
  choice: chắc chắn không cần phải
  rationale: Cụm phủ định nhấn mạnh οὐ μή được giữ bằng “chắc chắn”; trong ngữ cảnh, lời truyền dạy ấy được dùng để miễn trừ bổn phận, nên “không cần phải” tự nhiên và đúng ý hơn một lời dự báo đơn thuần.
- source_word: τιμήσει
  choice: hiếu kính
  rationale: “Hiếu kính” diễn đạt tự nhiên bổn phận tôn kính cha mẹ trong tiếng Việt, đồng thời vẫn đủ rộng để bao hàm việc chăm lo thực tế mà không thu hẹp nghĩa thành chỉ chu cấp vật chất.
- source_word: τὸν πατέρα αὐτοῦ
  choice: cha mình
  rationale: Bản Hy Lạp ghi rõ danh từ số ít “cha”; bản dịch không mở rộng thành “cha hoặc mẹ” theo văn cảnh rộng hơn.
- source_word: ἠκυρώσατε
  choice: đã làm cho … mất hiệu lực
  rationale: Cách diễn đạt này truyền đạt rõ nghĩa làm mất giá trị hoặc vô hiệu hóa của ἀκυρόω, đồng thời tự nhiên trong tiếng Việt hiện đại.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: lời Đức Chúa Trời
  rationale: Theo đúng SBLGNT với λόγον, bản dịch dùng “lời” thay vì đưa dị bản “điều răn” vào chính văn.
- source_word: διὰ τὴν παράδοσιν ὑμῶν
  choice: vì truyền thống của mình
  rationale: διά với đối cách chỉ nguyên nhân; “vì” nêu rõ truyền thống của họ là nguyên do khiến lời Đức Chúa Trời bị làm cho mất hiệu lực. Đại từ “mình” quy chiếu tự nhiên về “các ông” trong tiếng Việt.
theological_decisions:
- issue: Có nên nói rõ rằng “hiếu kính” bao gồm việc chu cấp cho cha mẹ hay không
  choice: Giữ “hiếu kính” trong chính văn và giải thích hàm ý thực tế ở chú thích.
  alternative: Dịch là “chu cấp cho” hoặc “chăm lo cho” để làm nổi bật nghĩa vụ vật chất.
  rationale: Động từ Hy Lạp là τιμάω, mang nghĩa tôn kính, dù cuộc tranh luận trong văn cảnh liên quan đến việc chăm lo vật chất. Giữ nghĩa rộng bảo tồn liên hệ với điều răn và tránh diễn giải quá hẹp.
- issue: Có nên điều hòa câu này với văn cảnh hoặc dị bản hay không
  choice: Dịch “cha mình” và “lời Đức Chúa Trời” theo văn bản SBLGNT.
  alternative: Mở rộng thành “cha hoặc mẹ”, hoặc dùng “điều răn của Đức Chúa Trời”.
  rationale: Ưu tiên chứng cứ nguyên ngữ đòi hỏi theo sát văn bản đã cho; dị bản đáng chú ý được ghi ở chú thích thay vì đưa vào chính văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Các ông” giữ sắc thái đối thoại trực tiếp với số nhiều; “hiếu kính” phù hợp ngữ cảnh điều răn về cha mẹ. Dấu ngoặc kép mở đầu phản ánh đây là phần tiếp nối của lời được trích dẫn từ câu trước.
