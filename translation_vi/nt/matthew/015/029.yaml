source:
  edition: SBLGNT
  text: Καὶ μεταβὰς ἐκεῖθεν ὁ Ἰησοῦς ἦλθεν παρὰ τὴν θάλασσαν τῆς Γαλιλαίας, καὶ ἀναβὰς εἰς τὸ ὄρος ἐκάθητο ἐκεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/029.yaml
  text: And departing from there[a], Jesus came along the Sea of Galilee, and after going up on the mountain[b], he sat there.
translation:
  language: vi
  text: Rời nơi ấy, Giê-su đi dọc theo bờ Biển Ga-li-lê[a]. Rồi Người lên núi và ngồi tại đó.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đến bên Biển Ga-li-lê.” Giới từ Hy Lạp có thể chỉ sự di chuyển dọc theo bờ hoặc vị trí ở bên biển.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μεταβὰς ἐκεῖθεν
  choice: Rời nơi ấy
  rationale: Phân từ bất định chỉ hành động xảy ra trước động từ chính; cách diễn đạt này giữ trình tự tự nhiên mà không làm câu tiếng Việt nặng nề.
- source_word: ἦλθεν παρὰ τὴν θάλασσαν τῆς Γαλιλαίας
  choice: đi dọc theo bờ Biển Ga-li-lê
  rationale: Với động từ chỉ chuyển động, παρά + đối cách có thể diễn tả sự di chuyển dọc theo mép biển. Thêm “bờ” giúp câu tiếng Việt rõ và tự nhiên, dù từ này được hàm ý chứ không xuất hiện riêng trong tiếng Hy Lạp.
- source_word: ἀναβὰς εἰς τὸ ὄρος
  choice: Rồi Ngài lên núi
  rationale: Phân từ bất định diễn tả hành động đi lên xảy ra trước việc ngồi; “rồi” chuyển tải trình tự gọn và tự nhiên. Mạo từ Hy Lạp không nhất thiết cho biết đây là một ngọn núi đã được xác định bằng tên.
- source_word: ἐκάθητο ἐκεῖ
  choice: ngồi tại đó
  rationale: Thì chưa hoàn thành mô tả tư thế hoặc trạng thái đang tiếp diễn. Trong tiếng Việt, “ngồi tại đó” tự nhiên và không ép động từ thành hành động bắt đầu ngồi.
- source_word: ὁ Ἰησοῦς
  choice: Đức Giê-su
  rationale: Dùng dạng phiên âm và kính ngữ thông dụng trong văn phong Kinh Thánh tiếng Việt hiện đại.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” để tránh lặp tên riêng, không thêm diễn giải thần học. Câu được tách làm hai để dòng thuật sự tự nhiên trong tiếng Việt.
