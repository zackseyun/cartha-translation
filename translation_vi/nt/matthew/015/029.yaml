  source_fidelity: 'Câu dịch phản ánh đúng trình tự chính: rời khỏi nơi trước đó, đến dọc theo Biển Ga-li-lê, lên núi, rồi ở đó trong tư thế ngồi. “Ngồi tại đó” diễn đạt được trạng thái của ἐκάθητο, dù tiếng Việt không bắt buộc đánh dấu thì chưa hoàn thành. Tuy nhiên, “Đức” trước tên riêng không có tương ứng trong ὁ Ἰησοῦς; bản Hy Lạp chỉ nêu tên Giê-su với mạo từ tường thuật.'
