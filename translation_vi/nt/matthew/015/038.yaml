base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/038.yaml
  text: Those who had eaten were four thousand men[a], besides women and children.
translation:
  language: vi
  text: 'Có bốn nghìn người đàn ông đã ăn, không kể phụ nữ và trẻ em.[a]


    [a] Cũng có thể dịch: “ngoài phụ nữ và trẻ em.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “ngoài phụ nữ và trẻ em.”'
    reason: Nêu cách diễn đạt khác của χωρίς, vẫn giữ ý rằng phụ nữ và trẻ em không được tính trong con số bốn nghìn.
lexical_decisions:
- source_word: οἱ δὲ
  choice: Số người
  rationale: Mạo từ đi với phân từ được diễn đạt như một nhóm người; δέ là từ nối nhẹ, không cần dịch riêng trong câu tiếng Việt này vì không mang ý tương phản rõ.
- source_word: ἐσθίοντες
  choice: đã ăn
  rationale: Dù là phân từ hiện tại về hình thức, trong ngữ cảnh nó chỉ những người đã dùng xong bữa ăn; “đã ăn” diễn đạt tự nhiên ý hoàn tất.
- source_word: ἦσαν
  choice: là
  rationale: Động từ liên kết dùng để nêu số lượng; cấu trúc “Số người... là...” tự nhiên trong tiếng Việt.
- source_word: τετρακισχίλιοι
  choice: bốn ngàn
  rationale: Dịch trực tiếp số từ chỉ số lượng.
- source_word: ἄνδρες
  choice: người đàn ông
  rationale: Từ Hy Lạp chỉ nam giới trưởng thành, không phải con người nói chung; cách dịch này giữ sự phân biệt với phụ nữ và trẻ em được nhắc riêng.
- source_word: χωρὶς
  choice: không kể
  rationale: Trong công thức đếm này, từ ấy cho biết phụ nữ và trẻ em không nằm trong con số bốn ngàn; “không kể” rõ nghĩa và tự nhiên.
- source_word: γυναικῶν
  choice: phụ nữ
  rationale: Nghĩa khái quát “phụ nữ” phù hợp hơn “vợ”, vốn sẽ thu hẹp đối tượng vào những người đã kết hôn.
- source_word: καὶ παιδίων
  choice: và trẻ em
  rationale: Diễn đạt rõ nghĩa chung của παιδίον trong ngữ cảnh mà không ấn định một độ tuổi quá hẹp.
theological_decisions:
- issue: Công thức đếm phân biệt giới tính
  choice: Giữ “người đàn ông” trong phần chính và nhắc riêng phụ nữ cùng trẻ em là những người không được tính vào con số bốn ngàn.
  alternative: Dịch ἄνδρες là “người” để bao gồm mọi giới.
  rationale: Bản Hy Lạp dùng ἄνδρες, chỉ nam giới, rồi nêu phụ nữ và trẻ em riêng. Dịch là “người” sẽ xóa đi sự phân biệt có thật trong nguyên văn.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “bốn ngàn” theo lối đọc số tự nhiên; cấu trúc “Số người đã ăn là...” làm rõ rằng câu đang nêu tổng số người đàn ông đã dùng bữa.
