  text: καὶ ἔφαγον πάντες καὶ ἐχορτάσθησαν, καὶ ⸂τὸ περισσεῦον τῶν κλασμάτων ἦραν⸃ ἑπτὰ σπυρίδας πλήρεις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/037.yaml
  text: And they all ate and were satisfied[a], and they picked up seven full baskets of the leftover pieces.
translation:
  language: vi
  text: Mọi người đều ăn no, rồi họ thu gom những mẩu còn thừa được bảy giỏ đầy.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hy Lạp σπυρίς có thể chỉ một loại giỏ lớn hơn loại giỏ được dùng trong một số trình thuật khác về việc hóa bánh ra nhiều.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφαγον
  choice: ăn
  rationale: Động từ aorist của ἐσθίω được dịch trực tiếp là “ăn”; nguyên văn không nêu tân ngữ.
- source_word: πάντες
  choice: mọi người đều
  rationale: Diễn đạt tự nhiên phạm vi bao quát của πάντες đối với cả đám đông.
- source_word: ἐχορτάσθησαν
  choice: ăn no
  rationale: χορτάζω trong ngữ cảnh này chỉ việc được ăn đến no đủ; “ăn no” tự nhiên và rõ nghĩa trong tiếng Việt hiện đại.
- source_word: τὸ περισσεῦον τῶν κλασμάτων
  choice: những mẩu còn thừa
  rationale: Kết hợp ý của phân từ danh từ hóa τὸ περισσεῦον (“phần còn lại”) với κλασμάτων (“những mẩu, miếng vụn”) thành cách nói gọn và tự nhiên.
- source_word: ἦραν
  choice: thu lại
  rationale: Trong ngữ cảnh gom phần thức ăn còn thừa, αἴρω mang nghĩa nhặt hoặc thu gom; “thu lại” phù hợp văn cảnh.
- source_word: ἑπτὰ σπυρίδας πλήρεις
  choice: bảy giỏ đầy
  rationale: Giữ nguyên con số và tính chất đầy của các giỏ; sắc thái σπυρίς có thể là loại giỏ lớn được nêu trong chú thích.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “ăn no” thay cho lối diễn đạt bị động thiếu tự nhiên trong tiếng Việt; giữ chú thích về khả năng σπυρίς là giỏ lớn.
