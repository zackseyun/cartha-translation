id: MAT.15.9
reference: Matthew 15:9
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: μάτην δὲ σέβονταί με, διδάσκοντες διδασκαλίας ἐντάλματα ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/009.yaml
  text: But they worship me in vain[b][a], teaching as doctrines the commandments of men.
translation:
  language: vi
  text: Nhưng họ thờ phượng ta cách vô ích, vì họ dạy những điều răn của loài người như những giáo lý.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “vì họ lấy những điều răn của loài người làm giáo lý mà dạy.”'
    reason: alternative_reading
lexical_decisions:
- source_word: μάτην
  choice: cách vô ích
  rationale: Diễn đạt ý ‘không đạt mục đích, luống công’; cách nói này tự nhiên trong tiếng Việt và giữ sắc thái phán xét của lời trích dẫn.
- source_word: δὲ
  choice: Nhưng
  rationale: Đánh dấu sự tiếp nối có nét tương phản nhẹ; ‘Nhưng’ phù hợp với lời quở trách trong ngữ cảnh.
- source_word: σέβονταί
  choice: họ thờ phượng
  rationale: Động từ chỉ sự tôn kính hay thờ phượng hướng về Đức Chúa Trời; ‘thờ phượng’ là cách diễn đạt rõ ràng, tự nhiên.
- source_word: με
  choice: ta
  rationale: Đại từ làm tân ngữ, chỉ Đức Chúa Trời trong lời trích dẫn Ê-sai; ‘ta’ phù hợp với lời Đức Chúa Trời phán trong văn phong Kinh Thánh tiếng Việt.
- source_word: διδάσκοντες
  choice: vì họ dạy
  rationale: Phân từ hiện tại nêu hoàn cảnh hoặc cách thức giải thích vì sao sự thờ phượng ấy vô ích. ‘Vì họ dạy’ làm rõ quan hệ hợp lý trong tiếng Việt mà không thay đổi nội dung.
- source_word: διδασκαλίας
  choice: như những giáo lý
  rationale: Danh từ số nhiều đứng trong quan hệ bổ nghĩa gần như đồng vị với ‘những điều răn’; thêm ‘như’ thể hiện việc các điều răn của con người được dạy với địa vị giáo lý.
- source_word: ἐντάλματα
  choice: những điều răn
  rationale: Chỉ các mệnh lệnh hay quy định được truyền dạy; ‘điều răn’ giữ sắc thái tôn giáo trang trọng.
- source_word: ἀνθρώπων
  choice: của loài người
  rationale: Danh từ mang nghĩa chung về con người, đối lập nguồn gốc con người với nguồn gốc thần thượng; ‘loài người’ vừa chính xác về giới vừa giữ rõ sự đối lập này.
theological_decisions:
- issue: Cách hiểu cụm διδασκαλίας ἐντάλματα ἀνθρώπων
  choice: họ dạy những điều răn của loài người như những giáo lý
  alternative: họ dạy làm giáo lý những điều răn của loài người
  rationale: Câu Hy Lạp cô đọng và phản ánh lời trích trong Ê-sai. Bản dịch chính cho thấy các điều răn có nguồn gốc từ con người được truyền dạy với thẩm quyền của giáo lý, đồng thời giữ lại khả năng diễn đạt khác trong chú thích.
- issue: Phạm vi nghĩa chung của ἀνθρώπων
  choice: của loài người
  alternative: của con người
  rationale: Từ Hy Lạp ở đây không chỉ riêng nam giới mà nhấn mạnh sự tương phản giữa điều thuộc con người và điều thuộc Đức Chúa Trời. ‘Loài người’ thể hiện rõ nét tương phản ấy mà không áp đặt sắc thái giới tính.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng ‘thờ phượng’, ‘điều răn’, ‘giáo lý’ để giữ sắc thái tôn giáo của lời trích dẫn; tránh lối nói cổ như ‘luống công’ trong câu chính.
