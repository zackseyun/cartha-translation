  terminology: “Thờ phượng,” “điều răn,” và “giáo lý” là các thuật ngữ phù hợp với văn phong Kinh Thánh. “Của loài người” phản ánh đúng nghĩa chung của ἀνθρώπων và duy trì sự tương phản giữa nguồn gốc con người và điều thuộc về Đức Chúa Trời, không giới hạn vào nam giới.
