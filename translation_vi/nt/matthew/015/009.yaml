  source_fidelity: 'Bản dịch truyền đạt đầy đủ các yếu tố của câu Hy Lạp: nét tương phản của δέ (“Nhưng”), sự thờ phượng hướng về Đức Chúa Trời, μάτην (“cách vô ích”), và hành động dạy các điều răn có nguồn gốc con người như giáo lý. “Vì họ dạy” diễn đạt cách tự nhiên chức năng giải thích của phân từ διδάσκοντες mà không thêm một nội dung thần học riêng.'
