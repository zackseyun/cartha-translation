  rationale: Giữ nguyên bản văn chính vì “đã phật lòng” là cách diễn đạt tự nhiên cho phản ứng tiêu cực trong ngữ cảnh. Chỉ sửa chú thích a để phương án thay thế phản ánh chính xác hơn sắc thái “vấp phạm” của động từ Hy Lạp, đồng thời vẫn lưu giữ cách diễn đạt sát chữ về hình ảnh bị làm cho vấp ngã.
