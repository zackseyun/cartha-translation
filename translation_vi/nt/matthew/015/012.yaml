  text: Τότε προσελθόντες οἱ ⸀μαθηταὶ ⸀λέγουσιν αὐτῷ· Οἶδας ὅτι οἱ Φαρισαῖοι ἀκούσαντες τὸν λόγον ἐσκανδαλίσθησαν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/012.yaml
  text: Then the disciples came and said to him[b][a], “Do you know that the Pharisees were offended when they heard this word?”
translation:
  language: vi
  text: 'Bấy giờ, các môn đồ đến nói với Đức Giê-su: “Thầy có biết rằng những người Pha-ri-si đã phật lòng[a] khi nghe lời ấy[b] không?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đã vấp phạm”; sát nghĩa hơn: “đã bị làm cho vấp ngã.”'
    reason: lexical_alternative
  - marker: b
    text: “Lời ấy” chỉ lời Đức Giê-su vừa nói trước đó.
    reason: cross_reference
lexical_decisions:
- source_word: Τότε
  choice: Bấy giờ
  rationale: Diễn tả sự tiếp nối trong trình thuật một cách tự nhiên và trang trọng.
- source_word: προσελθόντες οἱ μαθηταὶ λέγουσιν αὐτῷ
  choice: các môn đồ đến nói với Đức Giê-su
  rationale: Chuyển cấu trúc phân từ rồi đến động từ lịch sử hiện tại thành lối kể tự nhiên trong tiếng Việt; không thêm ý sở hữu vào “các môn đồ”.
- source_word: Οἶδας
  choice: Thầy có biết ... không?
  rationale: Giữ nguyên câu hỏi trực tiếp; đại từ xưng hô “Thầy” phù hợp quan hệ môn đồ với Đức Giê-su trong tiếng Việt.
- source_word: οἱ Φαρισαῖοι
  choice: những người Pha-ri-si
  rationale: Cách gọi rõ ràng, quen thuộc đối với độc giả tiếng Việt hiện đại.
- source_word: ἀκούσαντες τὸν λόγον
  choice: khi nghe lời ấy
  rationale: “Lời ấy” gần với λόγον và tự nhiên trong ngữ cảnh, quy chiếu về lời Đức Giê-su vừa nói mà không diễn giải nội dung.
- source_word: ἐσκανδαλίσθησαν
  choice: đã phật lòng
  rationale: Diễn đạt tự nhiên phản ứng tiêu cực trong ngữ cảnh, đồng thời chú thích nét nghĩa sát chữ hơn là bị làm cho vấp ngã.
theological_decisions:
- issue: Sắc thái của σκανδαλίζω trong phản ứng của người Pha-ri-si
  choice: đã phật lòng
  alternative: đã bị xúc phạm; đã bị làm cho vấp ngã
  rationale: Ngữ cảnh nhấn mạnh phản ứng bất bình trước lời dạy của Đức Giê-su. “Phật lòng” không biến câu này thành một khẳng định giáo lý về sự sa ngã, còn chú thích bảo tồn hình ảnh và tính bị động của nguyên ngữ.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “Đức Giê-su” trong lời dẫn và “Thầy” trong lời các môn đồ; giữ câu hỏi trực tiếp và không giải quyết quá mức sắc thái của σκανδαλίζω.
