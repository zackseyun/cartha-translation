  source_fidelity: Bản dịch chuyển đúng trình tự tường thuật, câu hỏi trực tiếp, đối tượng là người Pha-ri-si, và phản ứng của họ sau khi nghe lời Đức Giê-su. “Đã phật lòng” diễn đạt được sắc thái ngữ cảnh của ἐσκανδαλίσθησαν, nhưng chú thích hiện có dùng “đã bị xúc phạm” dễ gợi nghĩa bị ai đó lăng mạ hơn là phản ứng vấp phạm/phẫn nộ trước lời nói.
