id: MAT.15.30
reference: Matthew 15:30
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ προσῆλθον αὐτῷ ὄχλοι πολλοὶ ἔχοντες μεθ’ ἑαυτῶν ⸂κωφούς, τυφλούς, χωλούς, κυλλούς⸃, καὶ ἑτέρους πολλούς, καὶ ἔρριψαν αὐτοὺς παρὰ τοὺς πόδας ⸀αὐτοῦ, καὶ ἐθεράπευσεν αὐτούς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/030.yaml
  text: And large crowds came to him[a], bringing with them the mute, the blind, the lame, the crippled, and many others, and they laid them at his feet[b], and he healed them.
translation:
  language: vi
  text: Có rất đông dân chúng đến với Ngài, đem theo những người câm[a], mù, què, khuyết tật tay chân[b] và nhiều người khác. Họ đặt những người ấy bên chân Ngài, và Ngài chữa lành cho họ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “người điếc”; từ Hy Lạp κωφός có thể chỉ người điếc, người câm, hoặc người vừa điếc vừa câm, tùy ngữ cảnh.
    reason: lexical_alternative
  - marker: b
    text: Từ Hy Lạp κυλλός nói chung chỉ người có tay chân bị suy yếu, biến dạng hoặc thiếu hụt.
    reason: lexical_clarification
lexical_decisions:
- source_word: προσῆλθον αὐτῷ
  choice: đến với Ngài
  rationale: Diễn đạt tự nhiên hành động đến gần Đức Giê-su, đồng thời giữ đại từ của nguyên văn.
- source_word: ὄχλοι πολλοὶ
  choice: rất đông dân chúng
  rationale: Cách nói tự nhiên trong tiếng Việt cho nhiều đám đông, truyền đạt rõ quy mô lớn mà không dùng cụm từ gượng gạo.
- source_word: ἔχοντες μεθ’ ἑαυτῶν
  choice: đem theo
  rationale: Trong ngữ cảnh, phân từ này cho biết dân chúng đưa những người bệnh và khuyết tật đi cùng mình.
- source_word: κωφούς
  choice: những người câm
  rationale: κωφός có thể chỉ người không nói được, không nghe được, hoặc cả hai; bản dịch chính chọn nghĩa 'câm' và giữ nghĩa khác trong chú thích.
- source_word: τυφλούς
  choice: mù
  rationale: Tương đương trực tiếp, rõ ràng của τυφλός trong danh sách những người cần được chữa lành.
- source_word: χωλούς
  choice: què
  rationale: Diễn đạt ngắn gọn tình trạng suy giảm khả năng đi lại được χωλός chỉ đến trong ngữ cảnh này.
- source_word: κυλλούς
  choice: khuyết tật tay chân
  rationale: κυλλός chỉ tình trạng tay chân bị suy yếu, biến dạng hoặc thiếu hụt; cách dịch này vừa bao quát vừa phù hợp với ngôn ngữ hiện đại, tôn trọng phẩm giá con người.
- source_word: ἑτέρους πολλούς
  choice: nhiều người khác
  rationale: Giữ ý rằng còn nhiều người khác ngoài các nhóm đã được liệt kê.
- source_word: ἔρριψαν αὐτούς
  choice: đặt những người ấy
  rationale: Dù ῥίπτω có thể mang nghĩa đen là 'ném', trong ngữ cảnh đưa người cần chữa lành đến với Đức Giê-su, 'đặt' truyền đạt đúng hành động mà không hàm ý đối xử thô bạo.
- source_word: παρὰ τοὺς πόδας αὐτοῦ
  choice: bên chân Ngài
  rationale: 'Giữ sắc thái không gian của παρά với đối cách: đặt họ ngay cạnh, trong tầm hiện diện của Ngài.'
- source_word: ἐθεράπευσεν αὐτούς
  choice: Ngài chữa lành cho họ
  rationale: Cách diễn đạt tự nhiên và quen thuộc cho hành động chữa lành trong các trình thuật Phúc Âm.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” cho đại từ chỉ Đức Giê-su theo nguyên văn; chọn cách gọi người khuyết tật tương đối ngắn gọn nhưng tránh lối diễn đạt miệt thị. Các dấu chú thích được đặt ngay sau những từ mà chú thích giải nghĩa.
