id: MAT.15.20
reference: Matthew 15:20
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ταῦτά ἐστιν τὰ κοινοῦντα τὸν ἄνθρωπον, τὸ δὲ ἀνίπτοις χερσὶν φαγεῖν οὐ κοινοῖ τὸν ἄνθρωπον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/020.yaml
  text: These are the things that defile the man[b][a], but to eat with unwashed hands does not defile the man.
translation:
  language: vi
  text: Những điều ấy làm ô uế con người[a][b], còn ăn khi chưa rửa tay thì không làm ô uế con người.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “làm cho con người không thanh sạch”. Động từ Hy Lạp có thể chỉ việc khiến một người trở nên ô uế theo nghi thức; ở đây, “làm ô uế” giữ được cả bối cảnh thanh sạch theo nghi thức lẫn ý nghĩa hư hoại rộng hơn trong lời dạy của Chúa Giê-su.
    reason: lexical_alternative
  - marker: b
    text: “Con người” ở đây là danh từ số ít mang nghĩa đại diện, nói chung về bất cứ người nào.
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῦτά ἐστιν τὰ
  choice: Những điều ấy
  rationale: Diễn đạt tự nhiên trong tiếng Việt, giữ đại từ chỉ định số nhiều và sự quy chiếu nhấn mạnh về những điều vừa được nêu.
- source_word: κοινοῦντα / κοινοῖ
  choice: làm ô uế / làm ô uế
  rationale: Trong bối cảnh tranh luận về sự thanh sạch, cách dịch này giữ được cả sắc thái ô uế theo nghi thức lẫn ý nghĩa đạo đức rộng hơn, đồng thời duy trì cùng một từ ngữ ở hai vế tương phản.
- source_word: τὸν ἄνθρωπον
  choice: con người
  rationale: Danh từ số ít có mạo từ được dùng theo nghĩa đại diện, chỉ một con người nói chung. “Con người” tự nhiên trong tiếng Việt và không biến câu thành số nhiều.
- source_word: ἀνίπτοις χερσὶν
  choice: khi chưa rửa tay
  rationale: Đây là cách nói hiện đại, tự nhiên, diễn đạt rõ việc ăn trong tình trạng tay chưa được rửa mà không hàm ý rằng tay là dụng cụ bắt buộc để ăn.
- source_word: φαγεῖν
  choice: ăn
  rationale: Động từ nguyên mẫu có mạo từ được chuyển thành cụm động từ làm chủ đề trong tiếng Việt, phù hợp cú pháp tự nhiên.
- source_word: δέ
  choice: còn
  rationale: “Còn” thể hiện rõ sự tương phản giữa điều thật sự làm ô uế và việc ăn khi chưa rửa tay.
theological_decisions:
- issue: Phạm vi nghĩa của κοινόω trong cuộc tranh luận về sự thanh sạch
  choice: Dịch là “làm ô uế” để giữ cả nền tảng thanh sạch theo nghi thức và sức nặng đạo đức trong lời dạy của Chúa Giê-su.
  alternative: làm cho không thanh sạch
  rationale: “Làm ô uế” ngắn gọn, tự nhiên và đủ rộng; phương án “làm cho không thanh sạch” có thể khiến người đọc chỉ nghĩ đến tình trạng nghi lễ.
- issue: Số ít đại diện của ἄνθρωπον
  choice: Dịch là “con người”, giữ hình thức số ít mang nghĩa khái quát.
  alternative: một người; người ta; loài người
  rationale: “Con người” vừa tự nhiên vừa giữ được chân lý khái quát về từng con người, không chuyển sang số nhiều hay một danh từ tập thể.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Câu giữ hai vế đối lập song song; lặp lại “làm ô uế con người” để phản ánh phép đối xứng có chủ ý của nguyên văn.
