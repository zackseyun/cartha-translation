  to: 'Nhưng Ngài không đáp lại bà một lời nào. Các môn đồ đến gần và cứ xin Ngài: “Xin cho bà ấy đi[a], vì bà ấy cứ kêu la ở phía sau chúng ta[b].”'
  rationale: Chỉ điều chỉnh “cứ kêu” thành “cứ kêu la” để truyền đạt tự nhiên hơn sắc thái tiếng kêu lớn của κράζει. Giữ nguyên cách dịch trung tính “Xin cho bà ấy đi” và hai chú thích, vì nguyên ngữ không xác định các môn đồ muốn ban cho lời thỉnh cầu của bà hay chỉ muốn đuổi bà đi.
