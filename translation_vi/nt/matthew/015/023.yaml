  terminology: “Ngài,” “các môn đồ,” và “Chúa Giê-su” nhất quán với văn phong Kinh Thánh tiếng Việt hiện đại. “Xin cho bà ấy đi” giữ được tính trung lập cần thiết của Ἀπόλυσον αὐτήν.
