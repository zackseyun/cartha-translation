  source_fidelity: 'Bản dịch phản ánh đúng mạch chính: Đức Giê-su không đáp, các môn đồ đến gần và liên tục thỉnh cầu, với lý do người phụ nữ đang kêu ở phía sau họ. Tuy nhiên, “cứ kêu” chưa diễn đạt rõ sắc thái kêu to/cất tiếng kêu của κράζει.'
