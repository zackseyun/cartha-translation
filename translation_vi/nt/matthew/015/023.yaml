source:
  edition: SBLGNT
  text: ὁ δὲ οὐκ ἀπεκρίθη αὐτῇ λόγον. καὶ προσελθόντες οἱ μαθηταὶ αὐτοῦ ⸀ἠρώτουν αὐτὸν λέγοντες· Ἀπόλυσον αὐτήν, ὅτι κράζει ὄπισθεν ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/023.yaml
  text: But he did not answer her a word[a]. And his disciples came and kept asking him, saying, “Send her away[b], because she is crying out behind us.”
translation:
  language: vi
  text: 'Nhưng Ngài không đáp lại bà một lời nào. Các môn đồ đến gần và cứ xin Ngài: “Xin cho bà ấy đi[a], vì bà ấy cứ kêu la ở phía sau chúng ta[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Xin đuổi bà ấy đi.” Lời của các môn đồ không nói rõ họ muốn Chúa Giê-su đáp ứng lời cầu xin của bà rồi cho bà đi, hay chỉ muốn bà rời khỏi họ.'
    reason: alternative_reading
  - marker: b
    text: 'Cũng có thể dịch: “theo sau chúng ta.” Cụm từ Hy Lạp có thể chỉ vị trí ở phía sau hoặc hành động đi theo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη αὐτῇ λόγον
  choice: không đáp lại bà một lời nào
  rationale: 'Giữ sắc thái nhấn mạnh của thành ngữ Hy Lạp: Chúa Giê-su hoàn toàn không đưa ra lời đáp nào.'
- source_word: προσελθόντες
  choice: đến gần
  rationale: Diễn đạt rõ chuyển động của các môn đồ đến chỗ Chúa Giê-su, tự nhiên trong văn kể chuyện tiếng Việt.
- source_word: ἠρώτουν
  choice: cứ xin
  rationale: Thể chưa hoàn thành cho thấy hành động tiếp diễn hoặc lặp lại; “cứ xin” truyền đạt điều này mà không cường điệu thành van nài.
- source_word: Ἀπόλυσον αὐτήν
  choice: Xin cho bà ấy đi
  rationale: Cách nói tự nhiên và đủ trung tính, không quyết định rằng các môn đồ muốn Chúa đáp ứng lời cầu xin của bà hay chỉ muốn đuổi bà đi.
- source_word: κράζει
  choice: cứ kêu
  rationale: Diễn đạt tiếng gọi lớn và liên tục trong ngữ cảnh; “kêu” tự nhiên hơn “la hét” và không thêm sắc thái tiêu cực quá mức.
- source_word: ὄπισθεν ἡμῶν
  choice: phía sau chúng ta
  rationale: Giữ nghĩa không gian trực tiếp của cụm từ, đồng thời chú thích khả năng chỉ việc bà đi theo họ.
theological_decisions:
- issue: Ý định của các môn đồ trong câu Ἀπόλυσον αὐτήν
  choice: Dịch trung tính là “Xin cho bà ấy đi.”
  alternative: “Xin đuổi bà ấy đi” hoặc “Xin đáp lời bà ấy rồi cho bà ấy đi.”
  rationale: Mệnh lệnh Hy Lạp không nói rõ họ muốn Chúa Giê-su đáp ứng lời cầu xin của bà rồi cho bà đi, hay chỉ đơn giản đuổi bà khỏi họ. Bản dịch giữ nguyên sự căng thẳng của trình thuật.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Ngài” theo lối kể tôn kính; lời thoại dùng “Xin” để thể hiện mệnh lệnh hướng đến Chúa Giê-su mà không làm tăng mức độ khẩn cầu ngoài nguyên văn.
