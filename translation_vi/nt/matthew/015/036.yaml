    issue: “bẻ ra” không nêu rõ vật bị bẻ
    rationale: Dù tân ngữ được ngầm hiểu từ ngữ cảnh, cách nói này trong tiếng Việt có thể tạo cảm giác thiếu bổ ngữ. “Bẻ bánh” làm rõ hành động κλάω mà không hàm ý cá cũng bị bẻ.
  - severity: low
    issue: “tiếp tục trao” hơi cơ học trong văn kể
    rationale: Thì chưa hoàn thành ἐδίδου có thể được diễn đạt tự nhiên bằng “cứ trao”, vẫn cho thấy hành động phân phát tiếp diễn/lặp lại.
