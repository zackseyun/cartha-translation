id: MAT.15.36
reference: Matthew 15:36
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸀ἔλαβεν τοὺς ἑπτὰ ἄρτους καὶ τοὺς ἰχθύας ⸀καὶ εὐχαριστήσας ἔκλασεν καὶ ⸀ἐδίδου τοῖς ⸀μαθηταῖς οἱ δὲ μαθηταὶ ⸂τοῖς ὄχλοις⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/036.yaml
  text: He took the seven loaves and the fish[a], and after giving thanks he broke them and kept giving them to the disciples, and the disciples to the crowds.
translation:
  language: vi
  text: Ngài lấy bảy ổ bánh và những con cá, tạ ơn[a], rồi bẻ bánh và cứ trao cho các môn đồ; còn các môn đồ thì trao cho đám đông.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “sau khi tạ ơn.” Phân từ Hy Lạp cũng có thể được diễn đạt theo cách sát hình thức hơn như vậy.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλαβεν
  choice: lấy
  rationale: Trong chuỗi hành động này, λαμβάνω diễn tả việc Đức Giê-su cầm/lấy thức ăn để tạ ơn, bẻ ra và phân phát; “lấy” là cách kể tự nhiên và sát nghĩa trong tiếng Việt.
- source_word: τοὺς ἑπτὰ ἄρτους
  choice: bảy ổ bánh
  rationale: ἄρτος ở đây chỉ những ổ bánh cụ thể trong phép lạ hóa bánh; “ổ bánh” tự nhiên hơn “bảy bánh” và giữ được số lượng.
- source_word: τοὺς ἰχθύας
  choice: những con cá
  rationale: ἰχθύας là số nhiều và có mạo từ; “những con cá” thể hiện tính xác định mà không thêm số lượng vốn không được nêu trong câu.
- source_word: εὐχαριστήσας
  choice: dâng lời tạ ơn
  rationale: Phân từ bất định diễn tả hành động xảy ra trước việc bẻ bánh. Cụm này tự nhiên, trang trọng và không thêm tân ngữ “Đức Chúa Trời,” vốn không xuất hiện trong nguyên văn.
- source_word: ἔκλασεν
  choice: bẻ ra
  rationale: κλάω chỉ hành động bẻ bánh để phân phát. Không thêm tân ngữ nhằm giữ cách diễn đạt gọn của nguyên văn và tránh gợi rằng cá cũng nhất thiết bị bẻ.
- source_word: ἐδίδου
  choice: tiếp tục trao
  rationale: Thì chưa hoàn thành diễn tả hành động phân phát đang tiếp diễn hoặc lặp lại; “tiếp tục trao” giữ sắc thái này rõ hơn quá khứ đơn.
- source_word: τοῖς μαθηταῖς
  choice: cho các môn đồ
  rationale: Dữ cách đánh dấu người nhận. Không thêm “của Ngài” vì đại từ sở hữu không có trong nguyên văn.
- source_word: οἱ δὲ μαθηταὶ τοῖς ὄχλοις
  choice: còn các môn đồ thì trao cho đám đông
  rationale: Nguyên văn tỉnh lược động từ ở vế sau; tiếng Việt cần lặp lại “trao” để câu rõ và tự nhiên. ὄχλοις được dịch bằng danh từ tập hợp “đám đông,” phù hợp ngữ cảnh.
theological_decisions:
- issue: Âm hưởng Tiệc Thánh có thể có trong εὐχαριστήσας
  choice: Dịch hành động thuật chuyện thông thường là “dâng lời tạ ơn,” không mở rộng theo nghi lễ.
  alternative: Dùng cách diễn đạt mang tính phụng vụ rõ hơn để nhấn mạnh âm hưởng Tiệc Thánh.
  rationale: Câu này có thể gợi đến mô thức sau này gắn với Bữa Tiệc của Chúa, nhưng bản thân câu chỉ thuật lại việc Đức Giê-su tạ ơn trước khi phân phát thức ăn. Bản dịch không nên đưa một cách hiểu bí tích vào vượt quá lời Hy Lạp.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Ngài” theo ngữ cảnh chỉ Đức Giê-su; dùng “môn đồ” để giữ thuật ngữ quen thuộc trong Kinh Thánh. Dấu chấm phẩy giúp thể hiện hai cấp phân phát mà vẫn giữ nhịp kể của câu Hy Lạp.
