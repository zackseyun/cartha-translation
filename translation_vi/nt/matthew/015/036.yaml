- from: Ngài lấy bảy ổ bánh và những con cá, dâng lời tạ ơn[a], rồi bẻ ra và tiếp tục trao cho các môn đồ; còn các môn đồ thì trao cho đám đông.
  to: Ngài lấy bảy ổ bánh và những con cá, tạ ơn[a], rồi bẻ bánh và cứ trao cho các môn đồ; còn các môn đồ thì trao cho đám đông.
  rationale: Bản sửa làm rõ đối tượng của hành động “bẻ” theo ngữ cảnh trực tiếp là bánh, đồng thời diễn đạt tự nhiên hơn sắc thái chưa hoàn thành của ἐδίδου. Không thêm đối tượng cho hành động tạ ơn, không diễn giải theo hướng bí tích, và vẫn giữ cấu trúc phân phát từ Ngài qua các môn đồ đến đám đông.
