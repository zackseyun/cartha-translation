language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: τότε ἀποκριθεὶς ὁ Ἰησοῦς εἶπεν αὐτῇ· Ὦ γύναι, μεγάλη σου ἡ πίστις· γενηθήτω σοι ὡς θέλεις. καὶ ἰάθη ἡ θυγάτηρ αὐτῆς ἀπὸ τῆς ὥρας ἐκείνης.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/028.yaml
  text: Then Jesus answered her[a], “O woman, great is your faith[b]; let it be done for you as you desire.” And her daughter was healed from that hour.
translation:
  language: vi
  text: 'Bấy giờ, Đức Giê-su đáp lời bà: “Thưa bà, đức tin của bà thật lớn lao![a] Nguyện được như bà mong muốn.” Và từ giờ ấy, con gái bà được chữa lành.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “sự tin cậy của bà thật lớn lao!” Từ Hy Lạp πίστις cũng có thể mang nghĩa “sự tin cậy”; ở đây “đức tin” là cách dịch chính.
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn: “từ giờ ấy”; cũng có thể dịch “ngay từ lúc ấy.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Bấy giờ
  rationale: Dấu nối thời gian gắn lời đáp này với cuộc đối thoại ngay trước đó; “Bấy giờ” tự nhiên trong văn kể chuyện và trang trọng vừa phải.
- source_word: ἀποκριθεὶς ... εἶπεν αὐτῇ
  choice: đáp lời bà
  rationale: Hai động từ Hy Lạp tạo thành công thức dẫn lời; gộp lại thành một cách diễn đạt tiếng Việt tự nhiên, đồng thời giữ đối tượng αὐτῇ.
- source_word: Ὦ γύναι
  choice: Này bà
  rationale: Giữ lời gọi trực tiếp và sắc thái nhấn mạnh của Ὦ, nhưng tránh cách dịch máy móc “Ôi, người đàn bà”; “bà” là lối xưng hô tôn trọng, phù hợp ngữ cảnh.
- source_word: μεγάλη σου ἡ πίστις
  choice: đức tin của bà thật lớn lao
  rationale: Diễn đạt tự nhiên trong tiếng Việt đồng thời phản ánh vị trí nhấn mạnh của μεγάλη; “đức tin” là cách dịch mặc định của πίστις trong ngữ cảnh người phụ nữ tin cậy nơi Đức Giê-su.
- source_word: γενηθήτω σοι ὡς θέλεις
  choice: Điều bà mong muốn sẽ được thành tựu
  rationale: Truyền đạt mệnh lệnh thụ động mang hiệu lực tuyên phán của γενηθήτω và sắc thái “cho bà” của σοι mà không tạo câu tiếng Việt gượng gạo.
- source_word: ἰάθη
  choice: được chữa lành
  rationale: Giữ thể thụ động và ý nghĩa chữa lành trong trình thuật phép lạ.
- source_word: ἀπὸ τῆς ὥρας ἐκείνης
  choice: Ngay từ giờ phút ấy
  rationale: Giữ hình ảnh thời gian của ὥρα nhưng dùng cụm tiếng Việt tự nhiên, biểu thị sự chữa lành có hiệu lực tức thì.
theological_decisions:
- issue: Cách dịch πίστις trong lời khen của Đức Giê-su
  choice: đức tin
  alternative: lòng tin; sự tin cậy
  rationale: Ngữ cảnh nhấn mạnh sự tin cậy bền bỉ của người phụ nữ nơi Đức Giê-su. “Đức tin” giữ thuật ngữ thần học quen thuộc mà không loại bỏ sắc thái tin cậy, được nêu trong chú thích.
- issue: Hiệu lực của γενηθήτω
  choice: sẽ được thành tựu
  alternative: hãy xảy ra; nguyện được như bà muốn
  rationale: Cách chọn giữ sắc thái thụ động và hiệu lực của lời Đức Giê-su, nhưng không giải thích thêm về cơ chế hay bản chất thần học của sự chữa lành.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “Đức Giê-su” và đại từ “bà” để giữ sự tôn trọng. Câu dẫn lời được Việt hóa tự nhiên; các chú thích bảo tồn sắc thái từ vựng và cách nói thời gian của nguyên văn.
