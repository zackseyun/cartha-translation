- from: 'Bấy giờ, Đức Giê-su đáp lời bà: “Này bà, đức tin của bà thật lớn lao![a] Điều bà mong muốn sẽ được thành tựu.” Ngay từ giờ phút ấy, con gái bà được chữa lành.[b]'
