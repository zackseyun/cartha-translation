  text: ὑποκριταί, καλῶς ἐπροφήτευσεν περὶ ὑμῶν Ἠσαΐας λέγων·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/007.yaml
  text: 'Hypocrites[a], Isaiah rightly prophesied about you, saying:'
translation:
  language: vi
  text: 'Hỡi những kẻ đạo đức giả, tiên tri Ê-sai đã tiên tri rất đúng về các ông rằng:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑποκριταί
  choice: Hỡi những kẻ đạo đức giả
  rationale: Danh từ số nhiều ở hô cách, trực tiếp quở trách người nghe. “Những kẻ đạo đức giả” truyền đạt sức nặng đạo đức–tôn giáo của từ Hy Lạp; “Hỡi” làm rõ chức năng xưng hô trong tiếng Việt.
- source_word: καλῶς
  choice: thật đúng
  rationale: Trạng từ bổ nghĩa cho ἐπροφήτευσεν, diễn tả rằng lời tiên tri của Ê-sai ứng hợp và xác đáng đối với những người đang được nói đến.
- source_word: ἐπροφήτευσεν
  choice: đã nói tiên tri
  rationale: Giữ nguyên sắc thái tiên tri và liên hệ trực tiếp với vai trò tiên tri của Ê-sai; “đã” thể hiện hành động quá khứ của động từ Hy Lạp.
- source_word: περὶ ὑμῶν
  choice: về các ông
  rationale: περί với sở hữu cách có nghĩa là “về/liên quan đến.” “Các ông” phù hợp với lời trực tiếp nhắm đến các lãnh đạo tôn giáo nam giới trong ngữ cảnh, đồng thời giữ sắc thái đối thoại.
- source_word: Ἠσαΐας
  choice: Ê-sai
  rationale: Dùng dạng tên quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
- source_word: λέγων
  choice: 'rằng:'
  rationale: Phân từ hiện tại mở đầu lời trích dẫn tiếp theo. “Rằng:” tự nhiên trong tiếng Việt sau cụm “nói tiên tri” và tránh lặp vụng về “nói rằng”.
theological_decisions:
- issue: Sức nặng của lời Chúa Giê-su trực tiếp quở trách
  choice: Hỡi những kẻ đạo đức giả
  alternative: Hỡi những kẻ giả hình / Những kẻ đóng kịch
  rationale: ὑποκριταί trong ngữ cảnh là lời kết án mạnh mẽ về sự không nhất quán giữa vẻ ngoài tôn giáo và thực chất bên trong. “Đạo đức giả” là cách diễn đạt hiện đại, rõ nghĩa, không làm nhẹ lời quở trách.
- issue: Quan hệ giữa lời tiên tri của Ê-sai và những người nghe Chúa Giê-su
  choice: đã nói tiên tri thật đúng về các ông
  alternative: đã khéo nói tiên tri về các ông
  rationale: καλῶς có thể mang nghĩa “đúng, xác đáng” hoặc “hay, tốt.” Bản dịch chọn “thật đúng” để diễn tả lời Ê-sai ứng nghiệm/xác đáng đối với họ, nhưng không thêm một khẳng định thần học vượt quá câu Hy Lạp.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại, giữ sự sắc bén của lời quở trách. Cấu trúc “nói tiên tri thật đúng” hơi mang sắc thái Kinh Thánh nhưng vẫn rõ và tự nhiên; dấu hai chấm báo hiệu lời trích dẫn ở câu tiếp theo.
