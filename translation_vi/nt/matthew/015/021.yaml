  text: Καὶ ἐξελθὼν ἐκεῖθεν ὁ Ἰησοῦς ἀνεχώρησεν εἰς τὰ μέρη Τύρου καὶ Σιδῶνος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/021.yaml
  text: And Jesus went out from there and withdrew to the region of Tyre and Sidon[a].
translation:
  language: vi
  text: Đức Giê-su rời khỏi đó và lui về miền Ty-rơ và Si-đôn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đi đến vùng Ty-rơ và Si-đôn.” Động từ Hy Lạp có thể được dịch trung tính hơn, nhưng “lui về” phản ánh cách Ma-thi-ơ thường dùng động từ này.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: và
  rationale: Liên từ nối tiếp mạch tường thuật; trong tiếng Việt tự nhiên, không nhất thiết phải đặt “và” ở đầu câu.
- source_word: ἐξελθὼν
  choice: rời khỏi
  rationale: Phân từ bất định diễn tả hành động xảy ra trước động từ chính. “Rời khỏi” truyền đạt tự nhiên việc đi ra khỏi địa điểm trước đó.
- source_word: ἐκεῖθεν
  choice: đó
  rationale: Kết hợp với “rời khỏi” thành “rời khỏi đó”, cách diễn đạt gọn và tự nhiên cho ý ‘từ nơi ấy’.
- source_word: ἀνεχώρησεν
  choice: lui về
  rationale: Giữ sắc thái rút đi/lánh sang nơi khác thường thấy trong cách Ma-thi-ơ dùng động từ này, nhưng không hàm ý mạnh như “rút lui” vì thất bại.
- source_word: εἰς τὰ μέρη
  choice: về miền
  rationale: Chỉ sự di chuyển đến khu vực rộng liên hệ với hai thành, không khẳng định Đức Giê-su đã vào chính các thành ấy.
- source_word: Τύρου καὶ Σιδῶνος
  choice: Ty-rơ và Si-đôn
  rationale: Dùng dạng địa danh quen thuộc trong tiếng Việt, phụ thuộc vào “miền” để chỉ khu vực gắn với hai thành.
theological_decisions:
- issue: Sắc thái việc Đức Giê-su di chuyển đến vùng gắn với dân ngoại
  choice: Dịch ἀνεχώρησεν là “lui về” nhưng không nêu động cơ.
  alternative: Có thể dịch trung tính hơn là “đi đến” hoặc mạnh hơn là “rút lui”.
  rationale: Động từ có thể gợi ý một sự lánh đi có chủ ý trong văn phong Ma-thi-ơ, nhưng câu không nói rõ nguyên nhân. Bản dịch giữ sắc thái mà không gán thêm động cơ tâm lý hay thần học.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Đức Giê-su” giữ sắc thái tôn kính; “lui về miền” vừa tự nhiên vừa bảo tồn sắc thái và phạm vi địa lý của nguyên văn.
