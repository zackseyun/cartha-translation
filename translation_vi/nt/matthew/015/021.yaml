  terminology: Tên riêng “Đức Giê-su,” “Ty-rơ,” và “Si-đôn” nhất quán với chính tả Kinh Thánh tiếng Việt thông dụng. Cách dùng “lui về” tránh hàm ý thất bại có thể đi kèm “rút lui,” đồng thời không làm phẳng sắc thái của động từ thành chỉ “đi đến.” Chú thích được neo đúng sau địa danh và nêu đúng khả năng dịch trung tính hơn.
