  source_fidelity: 'Bản dịch truyền đạt đúng trình tự và nội dung của câu Hy Lạp: Đức Giê-su rời nơi trước đó rồi ἀνεχώρησεν đến khu vực gắn với Ty-rơ và Si-đôn. “Lui về” giữ được sắc thái lánh/rút đi của ἀναχωρέω trong Ma-thi-ơ mà không khẳng định động cơ; “miền” diễn đạt phù hợp τὰ μέρη, là khu vực chứ không nhất thiết là chính hai thành.'
