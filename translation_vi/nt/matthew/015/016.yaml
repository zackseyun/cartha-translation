  text: ὁ ⸀δὲ εἶπεν· Ἀκμὴν καὶ ὑμεῖς ἀσύνετοί ἐστε;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/016.yaml
  text: But he said[a], “Are you also still without understanding?”
translation:
  language: vi
  text: 'Nhưng Ngài nói: “Cho đến bây giờ, các con cũng vẫn chưa hiểu sao?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: Nhưng
  rationale: Đánh dấu sự chuyển ý có sắc thái tương phản nhẹ từ lời của các môn đồ sang lời đáp của Đức Chúa Giê-su.
- source_word: ὁ … εἶπεν
  choice: Ngài nói
  rationale: Mạo từ ὁ được dùng như đại từ, chỉ Đức Chúa Giê-su trong ngữ cảnh; “Ngài nói” là cách kể tự nhiên và trang trọng.
- source_word: Ἀκμὴν
  choice: cho đến bây giờ … vẫn
  rationale: Diễn đạt ý kéo dài đến thời điểm hiện tại; kết hợp “cho đến bây giờ” với “vẫn” làm rõ sắc thái quở trách vì sự thiếu hiểu biết còn tiếp diễn.
- source_word: καὶ ὑμεῖς
  choice: các con cũng
  rationale: καί mang nghĩa “cũng”, còn đại từ ὑμεῖς được nhấn mạnh; “các con” phù hợp với lời Đức Chúa Giê-su nói trực tiếp với các môn đồ.
- source_word: ἀσύνετοί ἐστε
  choice: chưa hiểu
  rationale: Trong ngữ cảnh, ἀσύνετος nói đến việc thiếu khả năng lĩnh hội. Câu hỏi “vẫn chưa hiểu sao?” tự nhiên trong tiếng Việt và không đẩy lời quở trách sang nghĩa lên án đạo đức như “ngu dại”.
theological_decisions:
- issue: Sắc thái lời quở trách của Đức Chúa Giê-su đối với các môn đồ
  choice: Một câu hỏi thẳng, cho thấy họ vẫn chưa hiểu sau những lời dạy trước đó
  alternative: “Các con cũng vẫn là những người thiếu hiểu biết sao?”
  rationale: Bản dịch giữ được sự nghiêm khắc và nỗi thất vọng hàm chứa trong câu Hy Lạp, nhưng không tăng mức độ thành lời kết án nặng nề.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” cho Đức Chúa Giê-su và “các con” cho các môn đồ; câu hỏi cuối với “sao?” tạo giọng quở trách tự nhiên mà vẫn dignified.
