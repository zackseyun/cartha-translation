  to: 'Còn các ông nói: ‘Ai nói với cha hoặc mẹ mình rằng: “Bất cứ điều gì người có thể được ích từ tôi đều là lễ vật[a],”’'
  rationale: Bản sửa làm rõ rằng cha hoặc mẹ là người nhận ích lợi “từ tôi”, giữ cấu trúc số ít của tiếng Hy Lạp qua cách xưng hô “người”, và bảo toàn tính chưa khép của lời trích dẫn, vốn tiếp tục ở câu sau. “Lễ vật” và chú thích được giữ nguyên về nội dung, vì chúng phù hợp với δῶρον mà không thay từ ngữ của Ma-thi-ơ bằng thuật ngữ của Mác.
