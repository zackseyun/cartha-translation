source:
  edition: SBLGNT
  text: ὑμεῖς δὲ λέγετε· Ὃς ἂν εἴπῃ τῷ πατρὶ ἢ τῇ μητρί· Δῶρον ὃ ἐὰν ἐξ ἐμοῦ ὠφεληθῇς,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/005.yaml
  text: But you say[a], ‘Whoever says to his father or his mother, “Whatever you would have benefited from me is a gift,”’
translation:
  language: vi
  text: 'Còn các ông nói: ‘Ai nói với cha hoặc mẹ mình rằng: “Bất cứ điều gì người có thể được ích từ tôi đều là lễ vật[a],”’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “quà dâng”. Ý nói những gì lẽ ra có thể dùng để phụng dưỡng cha mẹ đã được tuyên bố là dâng cho Đức Chúa Trời; so sánh Mác 7:11, nơi dùng thuật ngữ “Cô-ban”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς δὲ λέγετε
  choice: Còn các ông lại nói
  rationale: δὲ tạo thế tương phản với điều răn được trích dẫn trước đó; đại từ ὑμεῖς được thể hiện bằng “các ông”, phù hợp với lời quở trách trực tiếp, còn “lại” làm rõ sắc thái đối lập.
- source_word: Ὃς ἂν εἴπῃ
  choice: Ai nói
  rationale: Đại từ quan hệ đi với ἄν và động từ giả định diễn tả một trường hợp khái quát, được chuyển tự nhiên sang tiếng Việt bằng “Ai nói”.
- source_word: τῷ πατρὶ ἢ τῇ μητρί
  choice: với cha hoặc mẹ mình
  rationale: Cách nói này thể hiện đối tượng gián tiếp và quan hệ gia đình một cách tự nhiên trong tiếng Việt, không cần lặp đại từ sở hữu.
- source_word: Δῶρον
  choice: lễ vật
  rationale: Trong ngữ cảnh tôn giáo, δῶρον chỉ vật được dâng hiến cho Đức Chúa Trời. “Lễ vật” vừa giữ nghĩa ‘vật dâng’ vừa tránh đưa thuật ngữ Cô-ban của Mác vào bản văn Ma-thi-ơ.
- source_word: ὃ ἐὰν ἐξ ἐμοῦ ὠφεληθῇς
  choice: Những gì cha mẹ có thể được tôi giúp đỡ
  rationale: Cụm này giữ ý khái quát của ὃ ἐὰν, hướng nguồn của ἐξ ἐμοῦ (“từ tôi”) và thể bị động của ὠφεληθῇς. “Cha mẹ” trong lời trích dẫn bao quát người cha hoặc người mẹ vừa được nhắc đến và tránh đại từ tiếng Việt gây lệch giới.
theological_decisions:
- issue: Có đưa thuật ngữ kỹ thuật “Cô-ban” vào lời của Ma-thi-ơ hay không
  choice: Giữ từ ngữ của Ma-thi-ơ bằng “lễ vật”
  alternative: Cô-ban; vật đã dâng cho Đức Chúa Trời
  rationale: Ma-thi-ơ dùng δῶρον chứ không dùng κορβᾶν như Mác 7:11. Bản dịch vì thế giữ từ thực sự có trong nguồn, còn hàm ý dâng hiến được giải thích ở chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Các ông” giữ sắc thái đối thoại quở trách; “lễ vật” là cách diễn đạt tôn giáo quen thuộc nhưng không quá chuyên biệt. Câu được để mở vì ý chính tiếp tục sang câu kế tiếp.
