id: MAT.15.18
reference: Matthew 15:18
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: τὰ δὲ ἐκπορευόμενα ἐκ τοῦ στόματος ἐκ τῆς καρδίας ἐξέρχεται, κἀκεῖνα κοινοῖ τὸν ἄνθρωπον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/018.yaml
  text: But the things that come out of the mouth come from the heart[a], and those defile the man.
translation:
  language: vi
  text: Nhưng những gì từ miệng ra đều phát xuất từ lòng, và những điều ấy làm ô uế con người[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn dùng danh từ số ít mang nghĩa đại diện, theo nghĩa “một con người nói chung”.
    reason: Làm rõ lực khái quát của ἄνθρωπον và lý do dịch là “con người”.
lexical_decisions:
- source_word: τὰ ... ἐκπορευόμενα
  choice: những gì từ miệng ra
  rationale: Phân từ trung tính số nhiều được dùng như danh từ, chỉ chung những điều được nói ra; cách dịch này tự nhiên trong tiếng Việt mà vẫn giữ hình ảnh đi ra từ miệng.
- source_word: στόματος
  choice: miệng
  rationale: Giữ nguyên hình ảnh thân thể trong nguyên văn và phù hợp trực tiếp với ngữ cảnh lời nói.
- source_word: καρδίας
  choice: lòng
  rationale: Trong tiếng Việt Kinh Thánh và ngôn ngữ hiện đại, “lòng” tự nhiên chỉ con người bên trong, gồm tư tưởng và ý hướng đạo đức; phù hợp hơn “tim” trong ngữ cảnh này.
- source_word: ἐξέρχεται
  choice: đều phát xuất từ
  rationale: Động từ số ít đi với chủ ngữ trung tính số nhiều theo cách dùng Hy Lạp; “phát xuất từ” diễn đạt rõ nguồn gốc bên trong và tránh lặp vụng “ra từ” sau cụm “từ miệng ra”.
- source_word: κἀκεῖνα
  choice: và chính những điều ấy
  rationale: Diễn đạt cả ý nối kết “và” lẫn đại từ hồi chỉ “những điều ấy”; thêm “chính” làm rõ rằng các điều vừa nói mới là tác nhân gây ô uế.
- source_word: κοινοῖ
  choice: làm cho ... bị ô uế
  rationale: Trong ngữ cảnh thanh sạch, động từ có nghĩa khiến một người trở nên ô uế; cách dịch giữ được sắc thái thanh sạch lẫn hàm ý đạo đức mà không thu hẹp vào một hệ phái.
- source_word: ἄνθρωπον
  choice: con người
  rationale: Mạo từ cùng danh từ số ít mang nghĩa đại diện chung. Tiếng Việt “con người” bảo toàn số ít khái quát và không tạo ra giới tính nam vốn không phải trọng tâm ngữ nghĩa của ἄνθρωπος tại đây.
theological_decisions:
- issue: Nguồn gốc bên trong của sự ô uế
  choice: Câu văn trình bày những gì phát ra từ miệng là xuất phát từ lòng và làm con người bị ô uế.
  alternative: Hiểu câu này chỉ nói đến sự ô uế nghi lễ do lời nói.
  rationale: Ngữ cảnh đối chiếu thức ăn đi vào từ bên ngoài với điều phát ra từ bên trong. Giữ “lòng” và “bị ô uế” bảo toàn cả chiều kích thanh sạch lẫn đạo đức, không giải nghĩa quá mức.
- issue: Nghĩa đại diện của ἄνθρωπον
  choice: con người
  alternative: người ấy; người ta; người đàn ông
  rationale: Ở đây danh từ số ít có chức năng đại diện cho một con người nói chung. “Con người” là cách nói trang trọng, tự nhiên và chính xác trong tiếng Việt; “người đàn ông” sẽ thêm nét nghĩa giới tính không được ngữ cảnh nhấn mạnh.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “lòng” thay vì “tim” để diễn đạt tự nhiên khái niệm con người bên trong; dùng “bị ô uế” nhằm giữ trường nghĩa thanh sạch của ngữ cảnh.
