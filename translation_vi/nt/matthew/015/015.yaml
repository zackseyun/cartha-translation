  text: Ἀποκριθεὶς δὲ ὁ Πέτρος εἶπεν αὐτῷ· Φράσον ἡμῖν τὴν παραβολὴν ⸀ταύτην.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/015.yaml
  text: But Peter answered and said to him[a], “Explain this parable to us.”
translation:
  language: vi
  text: 'Nhưng Phi-e-rơ đáp lời Người: “Xin giải thích cho chúng con dụ ngôn này.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀποκριθεὶς δὲ ... εἶπεν
  choice: Nhưng ... đáp lời
  rationale: Cụm phân từ đi với động từ nói là một lối diễn đạt kể chuyện. Tiếng Việt tự nhiên chỉ cần “đáp lời”; “nhưng” thể hiện bước chuyển hoặc tương phản nhẹ của δέ mà không lặp vụng “đáp và nói”.
- source_word: ὁ Πέτρος
  choice: Phi-e-rơ
  rationale: Dùng dạng phiên âm tên riêng quen thuộc trong văn phong Kinh Thánh tiếng Việt.
- source_word: αὐτῷ
  choice: Người
  rationale: Đại từ chỉ Chúa Giê-su trong ngữ cảnh; viết hoa để giúp nhận diện đối tượng mà không thêm danh xưng không có trong nguyên văn.
- source_word: Φράσον
  choice: Xin giải thích
  rationale: Mệnh lệnh cách của φράζω ở đây là yêu cầu làm sáng tỏ ý nghĩa. Thêm “xin” để lời yêu cầu tự nhiên và kính trọng trong tiếng Việt, không làm thay đổi nội dung mệnh lệnh.
- source_word: ἡμῖν
  choice: cho chúng con
  rationale: Người nói là các môn đồ thưa với Chúa Giê-su; “chúng con” diễn đạt tự nhiên quan hệ giao tiếp và vẫn giữ ngôi thứ nhất số nhiều.
- source_word: τὴν παραβολὴν ταύτην
  choice: dụ ngôn này
  rationale: “Dụ ngôn” duy trì thuật ngữ quen thuộc của các sách Phúc Âm, còn “này” chỉ lời nói hình tượng ngay trước đó.
theological_decisions:
- issue: Cách xưng hô của môn đồ với Chúa Giê-su
  choice: Người / chúng con
  alternative: ông / chúng tôi
  rationale: Tiếng Hy Lạp không mã hóa mức độ kính trọng này, nhưng tiếng Việt buộc phải chọn đại từ. “Người / chúng con” phù hợp văn phong Kinh Thánh trang trọng và quan hệ môn đồ–thầy, song không thêm một tước hiệu thần học vào câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Lược bỏ phép lặp sát chữ “đáp... nói” để câu tiếng Việt tự nhiên, đồng thời giữ sắc thái chuyển ý của δέ bằng “Nhưng”.
