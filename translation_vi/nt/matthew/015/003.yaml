id: MAT.15.3
reference: Matthew 15:3
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν αὐτοῖς· Διὰ τί καὶ ὑμεῖς παραβαίνετε τὴν ἐντολὴν τοῦ θεοῦ διὰ τὴν παράδοσιν ὑμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/003.yaml
  text: But he answered and said to them[a], “Why do you also transgress the commandment of God for the sake of your tradition?”
translation:
  language: vi
  text: 'Nhưng Ngài đáp lời họ: “Tại sao các ông cũng vi phạm điều răn của Đức Chúa Trời vì truyền thống của các ông?[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “do truyền thống của các ông” hoặc “vì muốn giữ truyền thống của các ông.”'
    reason: διά với đối cách có thể được diễn đạt thiên về nguyên nhân (“do”) hoặc thiên về điều họ muốn bảo vệ (“vì muốn giữ”); bản văn chính dùng “vì” để không thu hẹp sắc thái.
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν αὐτοῖς
  choice: đáp lời họ
  rationale: Cụm phân từ + động từ hữu hạn mang sắc thái Semit. Tiếng Việt tự nhiên diễn đạt gọn là “đáp lời họ”, vẫn giữ cả ý trả lời lẫn nói với họ mà tránh lối dịch nặng nề “đáp lại và nói”.
- source_word: Διὰ τί
  choice: Tại sao
  rationale: Cách hỏi nguyên nhân tự nhiên, rõ ràng trong tiếng Việt hiện đại.
- source_word: καὶ ὑμεῖς
  choice: chính các ông cũng
  rationale: “Cũng” giữ sự đối ứng với lời cáo buộc trước đó; “chính” làm rõ rằng Chúa Giê-su chuyển lời chất vấn trở lại những người đang hỏi mà không cường điệu thành “ngay cả”.
- source_word: παραβαίνετε
  choice: vi phạm
  rationale: Diễn đạt đúng ý vượt qua hoặc làm trái một mệnh lệnh; trang trọng vừa phải và dễ hiểu hơn “phạm giới” hay “xâm phạm” trong ngữ cảnh này.
- source_word: τὴν ἐντολὴν τοῦ θεοῦ
  choice: điều răn của Đức Chúa Trời
  rationale: “Điều răn” giữ sắc thái Kinh Thánh và giao ước của ἐντολή, đồng thời duy trì sự tương phản trực tiếp với truyền thống của con người.
- source_word: διὰ τὴν παράδοσιν ὑμῶν
  choice: vì truyền thống của mình
  rationale: “Vì” có thể chỉ nguyên nhân hoặc điều người ta muốn bảo vệ, phù hợp độ mở của διά với đối cách. “Truyền thống” phản ánh điều được lưu truyền; “của mình” quy chiếu tự nhiên về chủ ngữ “các ông”.
theological_decisions:
- issue: Sự tương phản giữa thẩm quyền của Đức Chúa Trời và truyền thống của con người
  choice: Giữ cặp “điều răn của Đức Chúa Trời” và “truyền thống của mình”.
  alternative: Dịch παράδοσις là “tục lệ” hoặc “lời dạy truyền lại”.
  rationale: 'Cách dịch này bảo toàn lời quở trách cụ thể: họ vi phạm điều Đức Chúa Trời truyền vì truyền thống của chính họ. Nó không mở rộng câu nói thành sự lên án mọi truyền thống.'
- issue: Quan hệ ý nghĩa của διά với đối cách
  choice: Dùng “vì”, cho phép hiểu là nguyên nhân hoặc vì muốn duy trì truyền thống.
  alternative: Dùng “do” để nhấn mạnh nguyên nhân, hoặc “để giữ” để nhấn mạnh mục đích/lợi ích.
  rationale: Nguyên văn cho thấy truyền thống là căn cứ khiến họ vi phạm điều răn nhưng không buộc phải xác định hoàn toàn đó chỉ là nguyên nhân hay mục đích; bản dịch chính giữ độ mở này.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Các ông” phù hợp lời Chúa Giê-su nói trực tiếp với nhóm người Pha-ri-si và các kinh sư; “Ngài” giữ cách xưng hô tôn kính quen thuộc. Dấu chú thích [a] được đặt ngay sau cụm từ mà chú thích giải thích.
