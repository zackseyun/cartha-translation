    rationale: καὶ ὑμεῖς tự nhiên là “các ông cũng”; “chính” có thể làm lời đối chất mạnh hơn mức cần thiết.
  - severity: low
    issue: “truyền thống của mình” không phản ánh minh thị ngôi thứ hai số nhiều của ὑμῶν.
    rationale: Dù có thể hiểu đúng theo chủ ngữ, “truyền thống của các ông” rõ ràng hơn, sát nguyên văn hơn, và duy trì thế đối lập trực tiếp với “điều răn của Đức Chúa Trời.”
