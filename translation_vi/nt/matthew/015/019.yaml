id: MAT.15.19
reference: Matthew 15:19
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐκ γὰρ τῆς καρδίας ἐξέρχονται διαλογισμοὶ πονηροί, φόνοι, μοιχεῖαι, πορνεῖαι, κλοπαί, ψευδομαρτυρίαι, βλασφημίαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/019.yaml
  text: For out of the heart come evil thoughts[a], murders, adulteries, sexual immoralities, thefts, false testimonies, and blasphemies.
translation:
  language: vi
  text: Vì từ lòng mà ra những ý nghĩ xấu xa, giết người, ngoại tình, gian dâm, trộm cắp, lời chứng dối và những lời phỉ báng[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “những lời phạm thượng.” Từ Hy Lạp này có thể chỉ lời phỉ báng người khác hoặc lời xúc phạm Đức Chúa Trời, tùy theo văn cảnh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ γὰρ τῆς καρδίας ἐξέρχονται
  choice: Vì từ lòng người mà ra
  rationale: “Vì” thể hiện lực giải thích của γάρ; “từ… mà ra” giữ hình ảnh nguồn gốc và sự phát xuất của ἐκ…ἐξέρχονται. “Lòng người” diễn đạt tự nhiên καρδία như con người bên trong, không thu hẹp vào cảm xúc.
- source_word: διαλογισμοὶ πονηροί
  choice: những ý nghĩ xấu xa
  rationale: διαλογισμοί có thể chỉ ý nghĩ, suy luận hoặc toan tính; cách dịch này tự nhiên và giữ độ rộng nghĩa mà không mặc nhiên giới hạn vào âm mưu.
- source_word: φόνοι
  choice: những vụ giết người
  rationale: Diễn đạt rõ các hành vi giết người có tính tội lỗi và giữ sắc thái số nhiều của danh từ.
- source_word: μοιχεῖαι
  choice: ngoại tình
  rationale: Thuật ngữ tiếng Việt trực tiếp và thông dụng cho hành vi vi phạm sự chung thủy trong hôn nhân; không cần gượng ép biểu thị số nhiều về hình thái.
- source_word: πορνεῖαι
  choice: gian dâm
  rationale: Chỉ rộng các hành vi tình dục trái phép trong văn cảnh Kinh Thánh, đồng thời giữ văn phong trang trọng, dễ hiểu.
- source_word: κλοπαί
  choice: trộm cắp
  rationale: Cách gọi tự nhiên, súc tích cho các hành vi lấy tài sản của người khác.
- source_word: ψευδομαρτυρίαι
  choice: làm chứng dối
  rationale: Giữ sắc thái làm chứng hoặc khai chứng sai, thay vì làm nhạt thành lời nói dối nói chung.
- source_word: βλασφημίαι
  choice: những lời phỉ báng
  rationale: βλασφημία có thể chỉ lời xúc phạm, vu khống người khác hoặc lời phạm thượng đối với Đức Chúa Trời. “Phỉ báng” phù hợp với danh sách các điều ác nói chung, còn nghĩa hướng về Đức Chúa Trời được bảo lưu trong chú thích.
theological_decisions:
- issue: Phạm vi nghĩa của βλασφημίαι
  choice: Dịch là “những lời phỉ báng”
  alternative: “những lời phạm thượng”
  rationale: Văn cảnh không nêu rõ đối tượng của lời xúc phạm. Bản văn chính dùng nghĩa rộng, còn chú thích bảo lưu khả năng chỉ lời xúc phạm Đức Chúa Trời, tránh giải quyết dứt khoát một sự mơ hồ có thật.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Cấu trúc “từ lòng người mà ra” giữ ẩn dụ Kinh Thánh về lòng như nguồn phát sinh hành vi đạo đức. Danh sách được trình bày nhịp nhàng, không cố tái tạo số nhiều Hy Lạp ở những chỗ tiếng Việt không đánh dấu số một cách tự nhiên.
