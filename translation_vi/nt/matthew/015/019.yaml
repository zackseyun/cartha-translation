revisions:
- from: Vì từ lòng người mà ra những ý nghĩ xấu xa, những vụ giết người, ngoại tình, gian dâm, trộm cắp, làm chứng dối và những lời phỉ báng.[a]
  to: Vì từ lòng mà ra những ý nghĩ xấu xa, giết người, ngoại tình, gian dâm, trộm cắp, lời chứng dối và những lời phỉ báng[a].
  rationale: Bản sửa giữ nguyên nghĩa và mức độ mơ hồ của nguyên văn, nhưng dùng các danh ngữ tự nhiên, sát nghĩa hơn trong danh sách và chuyển ký hiệu chú thích tới đúng từ được chú giải. Không cần thay đổi lựa chọn “những lời phỉ báng” hay nội dung chú thích.
  reviewer_model: gpt-5.6-terra
