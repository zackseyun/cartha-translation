  - severity: low
    issue: Neo chú thích đặt ở cuối câu
    rationale: Chú thích chỉ liên quan đến βλασφημίαι/“những lời phỉ báng”; cần đặt ký hiệu ngay sau cụm từ này để xác định phạm vi rõ ràng.
