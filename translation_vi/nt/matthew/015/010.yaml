- from: 'Ngài gọi đám đông lại và nói với họ: “Hãy lắng nghe và hiểu.”'
  to: 'Ngài gọi đám đông đến gần rồi nói với họ: “Hãy lắng nghe và hiểu.”'
  rationale: Sửa tối thiểu “gọi ... lại” thành “gọi ... đến gần” để phản ánh chính xác hơn lực hướng của προσκαλεσάμενος, đồng thời dùng “rồi” để diễn tả tự nhiên hành động phân từ xảy ra trước lời nói. Không cần chú thích vì không còn điểm mơ hồ đáng kể cần ghi chú trong tiếng Việt.
