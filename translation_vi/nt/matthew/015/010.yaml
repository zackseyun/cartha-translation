  text: And calling the crowd to him[a], he said to them, “Listen and understand.”
translation:
  language: vi
  text: 'Ngài gọi đám đông đến gần rồi nói với họ: “Hãy lắng nghe và hiểu.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: và
  rationale: Liên từ tiếp nối mạch kể chuyện; tiếng Việt tự nhiên hơn khi đặt giữa hai hành động trong cùng câu.
- source_word: προσκαλεσάμενος
  choice: gọi ... lại
  rationale: Phân từ bất định trung cách diễn tả việc triệu tập đám đông đến gần; cấu trúc nối tiếp bằng “và” vừa tự nhiên trong tiếng Việt vừa không nhấn quá mức quan hệ thời gian.
- source_word: τὸν ὄχλον
  choice: đám đông
  rationale: Cách gọi thông dụng, hiện đại cho một nhóm người tụ tập, phù hợp với ngữ cảnh.
- source_word: εἶπεν αὐτοῖς
  choice: nói với họ
  rationale: Chuyển tải trực tiếp động từ λέγω cùng bổ ngữ gián tiếp αὐτοῖς, tự nhiên và sát nghĩa.
- source_word: Ἀκούετε
  choice: Hãy lắng nghe
  rationale: Mệnh lệnh số nhiều kêu gọi chú ý đến lời sắp nói; “lắng nghe” tự nhiên và thể hiện rõ hơn sự chú tâm so với chỉ “nghe”.
- source_word: συνίετε
  choice: hiểu
  rationale: Diễn tả việc nắm bắt ý nghĩa của điều nghe được, giữ sự phân biệt với hành động nghe.
