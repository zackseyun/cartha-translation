  text: καὶ λέγει αὐτοῖς ὁ Ἰησοῦς· Πόσους ἄρτους ἔχετε; οἱ δὲ εἶπαν· Ἑπτά, καὶ ὀλίγα ἰχθύδια.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/034.yaml
  text: And Jesus said to them[a], “How many loaves do you have?” And they said, “Seven, and a few small fish.”
translation:
  language: vi
  text: 'Đức Giê-su hỏi họ: “Anh em có bao nhiêu ổ bánh?” Họ đáp: “Bảy ổ, và vài con cá nhỏ.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: hỏi
  rationale: Động từ nguyên nghĩa là “nói”, ở thì hiện tại lịch sử; nhưng vì lời trực tiếp là một câu hỏi, “hỏi” diễn đạt tự nhiên và chính xác chức năng phát ngôn trong tiếng Việt.
- source_word: αὐτοῖς
  choice: họ
  rationale: Đại từ số nhiều được dịch trực tiếp, chỉ những người Đức Giê-su đang nói với.
- source_word: Πόσους ἄρτους
  choice: bao nhiêu ổ bánh
  rationale: ἄρτους là danh từ đếm được ở số nhiều; “ổ bánh” là cách nói tự nhiên trong tiếng Việt và giữ rõ ý hỏi về số lượng.
- source_word: ἔχετε
  choice: anh em có
  rationale: Cách hỏi hiện tại tự nhiên trong tiếng Việt; “anh em” phù hợp với lời Đức Giê-su nói với nhóm môn đồ trong ngữ cảnh.
- source_word: οἱ δὲ εἶπαν
  choice: Họ đáp
  rationale: δέ ở đây chủ yếu chuyển tiếp lời thoại, không cần dịch thành từ đối lập mạnh; “đáp” tự nhiên hơn “nói” sau một câu hỏi.
- source_word: Ἑπτά
  choice: Bảy ổ
  rationale: “Ổ” được bổ sung theo danh từ “ổ bánh” đã xuất hiện trong câu hỏi, giúp câu trả lời tự nhiên mà không thay đổi nội dung.
- source_word: ὀλίγα
  choice: vài con
  rationale: Diễn đạt một số lượng nhỏ không xác định; loại từ “con” phù hợp với cá trong tiếng Việt.
- source_word: ἰχθύδια
  choice: cá nhỏ
  rationale: Dạng giảm nhẹ ἰχθύδια gợi ý những con cá nhỏ, nên sắc thái kích thước được giữ lại trong bản dịch.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Đức Giê-su” theo lối gọi tôn kính thông dụng; lời thoại ngắn gọn, tự nhiên. Không đặt chú thích vì sắc thái giảm nhẹ của ἰχθύδια đã được thể hiện trực tiếp bằng “cá nhỏ”.
