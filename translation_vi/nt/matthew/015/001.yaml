- from: Bấy giờ, những người Pha-ri-si và các kinh sư từ Giê-ru-sa-lem đến gặp Đức Giê-su[a] và hỏi:[b]
  to: 'Bấy giờ, những người Pha-ri-si và các kinh sư[b] từ Giê-ru-sa-lem đến gặp Giê-su[a], nói:'
  rationale: Đổi “hỏi” thành “nói” để phản ánh trực tiếp λέγοντες và giữ cấu trúc dẫn vào lời phát biểu ở câu kế tiếp. Bỏ “Đức” vì câu Hy Lạp chỉ nêu tên Giê-su. Điều chỉnh vị trí chú thích để chú thích thuật ngữ “kinh sư” được neo đúng chỗ; giữ chú thích lựa chọn cho προσέρχονται.
  reviewer_model: gpt-5.6-terra
