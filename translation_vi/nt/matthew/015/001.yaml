    issue: “hỏi” dịch λέγοντες
    rationale: λέγοντες là phân từ của λέγω, nghĩa cơ bản là “nói”. Hình thức câu hỏi trong câu sau không cho phép thay động từ dẫn lời bằng “hỏi” ở câu này mà không thêm diễn giải.
  - severity: low
    issue: Thêm danh xưng “Đức” trước tên Giê-su
    rationale: Nguyên văn chỉ có tên riêng Ἰησοῦ, không có tước hiệu hay kính ngữ. Bỏ “Đức” tránh bổ sung sắc thái tôn kính không được biểu thị từ vựng trong câu.
  - severity: low
