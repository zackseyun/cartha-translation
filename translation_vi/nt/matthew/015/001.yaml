  text: Τότε προσέρχονται τῷ ⸀Ἰησοῦ ἀπὸ Ἱεροσολύμων ⸂Φαρισαῖοι καὶ γραμματεῖς⸃ λέγοντες
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/001.yaml
  text: Then Pharisees and scribes from Jerusalem come to Jesus[a], saying[b],
translation:
  language: vi
  text: 'Bấy giờ, những người Pha-ri-si và các kinh sư[b] từ Giê-ru-sa-lem đến gặp Giê-su[a], nói:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đến gần Giê-su.”'
    reason: lexical_alternative
  - marker: b
    text: “Kinh sư” trong bối cảnh này cũng có thể hiểu là “chuyên gia Luật pháp” hoặc “thầy dạy Luật pháp”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Bấy giờ
  rationale: Dấu mốc thời gian mở đầu một diễn cảnh mới; cách diễn đạt tự nhiên, trang trọng và giữ được mạch kể.
- source_word: προσέρχονται
  choice: đến gặp
  rationale: Diễn tả chuyển động đến gần một người để giao tiếp. Tiếng Việt thường không dùng thì hiện tại lịch sử như tiếng Hy Lạp, nên hình thức không đánh dấu thì phù hợp với văn kể.
- source_word: τῷ Ἰησοῦ
  choice: Đức Giê-su
  rationale: Bổ ngữ chỉ người được họ đến gặp; danh xưng có từ kính trọng phù hợp với văn phong Kinh Thánh tiếng Việt hiện đại.
- source_word: ἀπὸ Ἱεροσολύμων
  choice: từ Giê-ru-sa-lem
  rationale: ἀπό chỉ nơi xuất phát hoặc nguồn gốc; không suy diễn rằng họ là phái đoàn chính thức.
- source_word: Φαρισαῖοι
  choice: những người Pha-ri-si
  rationale: Tên gọi lịch sử của một nhóm Do Thái; thêm từ chỉ người để câu tiếng Việt rõ và tự nhiên.
- source_word: γραμματεῖς
  choice: các kinh sư
  rationale: Trong bối cảnh này, từ này chỉ những người thông thạo và giảng dạy Luật pháp; “kinh sư” vừa gọn vừa quen thuộc trong văn liệu Kinh Thánh.
- source_word: καὶ
  choice: và
  rationale: Liên kết hai nhóm người và, trong cấu trúc tiếng Việt, nối hành động đến gặp với lời nói tiếp theo.
- source_word: λέγοντες
  choice: hỏi
  rationale: Phân từ nghĩa đen là “nói”, nhưng lời trực tiếp ở câu kế tiếp có hình thức câu hỏi; “hỏi” tạo liên kết tự nhiên trong tiếng Việt mà không thay đổi chức năng phát ngôn.
theological_decisions:
- issue: Thì hiện tại lịch sử trong lời kể
  choice: 'Dùng động từ tiếng Việt không đánh dấu thì: “đến gặp”'
  alternative: Thêm dấu hiệu quá khứ như “đã đến gặp”, hoặc cố giữ sắc thái hiện tại
  rationale: Tiếng Việt không biến đổi động từ theo thì; thêm “đã” dễ nhấn quá khứ quá mức, còn cách không đánh dấu thì vẫn tự nhiên và cho phép ngữ cảnh xác định thời gian.
- issue: Sắc thái của nhóm từ “từ Giê-ru-sa-lem”
  choice: Chỉ nêu nơi xuất phát
  alternative: Diễn giải họ là phái đoàn có thẩm quyền từ Giê-ru-sa-lem
  rationale: Nguyên văn cho biết nguồn gốc hoặc nơi họ đi đến từ đó, nhưng không tuyên bố rõ địa vị chính thức của họ.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Giữ cấu trúc dẫn sang lời trực tiếp ở câu kế tiếp; dùng “hỏi” theo chức năng của phát ngôn, đồng thời ghi nghĩa sát chữ trong chú thích.
