id: MAT.15.27
reference: Matthew 15:27
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἡ δὲ εἶπεν· Ναί, κύριε, καὶ γὰρ τὰ κυνάρια ἐσθίει ἀπὸ τῶν ψιχίων τῶν πιπτόντων ἀπὸ τῆς τραπέζης τῶν κυρίων αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/027.yaml
  text: She said[a], “Yes, Lord[b], for even the little dogs eat from the crumbs that fall from their masters’ table.”
translation:
  language: vi
  text: 'Bà thưa: “Vâng, lạy Chúa,[b] vì ngay cả những con chó nhỏ[a] cũng ăn những mẩu vụn rơi từ bàn của chủ của chúng.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “chó”, “chó nhà” hoặc “chó con”; tiếng Hy Lạp dùng dạng giảm nhẹ, gợi đến những con chó nhỏ nuôi trong nhà.
    reason: lexical_alternative
  - marker: b
    text: “Chúa” cũng có thể được hiểu là lời xưng hô kính trọng “ngài”; bản dịch giữ cách dịch thông thường của κύριος trong các sách Tin Mừng.
    reason: alternative_reading
lexical_decisions:
- source_word: Ναί
  choice: Vâng
  rationale: Lời đáp khẳng định trực tiếp, tự nhiên và kính trọng trong tiếng Việt, đồng thời cho thấy bà chấp nhận hình ảnh Chúa Giê-su vừa nêu.
- source_word: κύριε
  choice: lạy Chúa
  rationale: Giữ cách dịch thông thường của κύριος khi trực tiếp thưa với Chúa Giê-su; từ “lạy” tạo lối xưng hô kính trọng tự nhiên trong tiếng Việt mà vẫn để ngỏ sắc thái “thưa ngài”.
- source_word: καὶ γὰρ
  choice: vì ngay cả
  rationale: “Vì” giữ chức năng giải thích/lập luận của γάρ, còn “ngay cả” thể hiện sắc thái bổ sung và nhấn mạnh của καί.
- source_word: κυνάρια
  choice: những con chó nhỏ
  rationale: Giữ sắc thái giảm nhẹ của dạng từ κυνάριον, có thể gợi những con chó nhỏ nuôi trong nhà, nhưng không diễn giải quá mức thành “chó con”.
- source_word: ἐσθίει
  choice: ăn
  rationale: Đây là nghĩa trực tiếp; tiếng Việt không cần biểu thị sự hòa hợp số giữa chủ ngữ và động từ.
- source_word: ψιχίων
  choice: những mẩu vụn
  rationale: Diễn đạt các mảnh thức ăn nhỏ rơi từ bàn mà không tự ý thêm “bánh”, vốn không có trong câu Hy Lạp.
- source_word: τῶν πιπτόντων
  choice: rơi ... xuống
  rationale: Chuyển phân từ hiện tại thành cụm miêu tả tự nhiên trong tiếng Việt và giữ hình ảnh các mẩu vụn rơi khỏi bàn.
- source_word: τραπέζης
  choice: bàn
  rationale: Giữ nghĩa thông thường và hình ảnh sinh hoạt gia đình của câu ví von.
- source_word: τῶν κυρίων αὐτῶν
  choice: của chủ chúng
  rationale: Trong hình ảnh này, κύριος chỉ người chủ của các con chó, không phải tước hiệu thần học; tiếng Việt dùng danh từ số ít theo nghĩa loại/chung một cách tự nhiên, dù tiếng Hy Lạp là số nhiều.
theological_decisions:
- issue: Cách dịch κύριε khi người phụ nữ trực tiếp thưa với Chúa Giê-su
  choice: lạy Chúa
  alternative: thưa ngài
  rationale: “Lạy Chúa” bảo tồn khả năng từ này vừa là lời xưng hô kính trọng vừa hàm ý nhìn nhận thẩm quyền của Chúa Giê-su, thay vì thu hẹp nó thành phép lịch sự đơn thuần.
- issue: Sắc thái giảm nhẹ của κυνάρια trong một hình ảnh có thể gây khó chịu
  choice: những con chó nhỏ
  alternative: chó; chó nhà; chó con
  rationale: Bản dịch phản ánh dạng giảm nhẹ trong tiếng Hy Lạp mà không xóa bỏ sự căng thẳng của hình ảnh hoặc làm mềm nó bằng một lối diễn giải xa hơn nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng nhưng dễ hiểu. Dùng “Bà thưa” thay vì “Bà nói” để phù hợp với lời đáp kính trọng. Trật tự “những mẩu vụn rơi từ bàn của chủ chúng xuống” giữ rõ quan hệ bổ nghĩa và hình ảnh của nguyên văn. Các dấu chú thích được đặt ngay sau từ ngữ liên quan; dấu [a] gắn với “chó nhỏ”, sửa sự lệch vị trí thấy trong lớp tham khảo tiếng Anh.
