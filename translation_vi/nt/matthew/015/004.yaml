review_pass:
  verdict: revise
  source_fidelity: 'Cần chỉnh nhẹ ở κακολογῶν. Bản nháp dùng “nguyền rủa” làm bản chính, nhưng động từ Hy Lạp có phạm vi rộng hơn: nói ác, mắng nhiếc/lăng mạ, hoặc nguyền rủa. Bản chính nên giữ nghĩa rộng; phương án “nguyền rủa” nên được bảo tồn bằng chú thích. Công thức θανάτῳ τελευτάτω được dịch đúng là “thì chắc chắn phải chết,” không thêm tác nhân thi hành án.'
  naturalness: “Hãy hiếu kính cha ngươi và mẹ ngươi” và “Ai lăng mạ cha hoặc mẹ” vừa rõ ràng vừa giữ giọng trang trọng của lời trích dẫn Kinh Thánh. Bỏ “đã” trước “phán” giúp câu gọn hơn mà không làm mất ý của thì quá khứ dùng để giới thiệu lời Kinh Thánh.
  terminology: “Đức Chúa Trời,” “phán,” và “hiếu kính” phù hợp văn phong Kinh Thánh tiếng Việt. “Lăng mạ” phản ánh tốt phạm vi của κακολογέω hơn “nguyền rủa” khi đứng một mình; chú thích giữ phương án mạnh hơn, truyền thống hơn.
  issues:
  - severity: medium
    issue: “Nguyền rủa” thu hẹp nghĩa của κακολογῶν khi được dùng làm bản chính và không có chú thích.
    rationale: κακολογέω có thể là nói ác, mắng nhiếc/lăng mạ, hoặc nguyền rủa. Bản tiếng Anh POB chọn nghĩa rộng “speaks evil of” và đưa “curses” ở chú thích. Bản tiếng Việt nên tương tự, để không quyết định quá hẹp một khả năng từ vựng.
