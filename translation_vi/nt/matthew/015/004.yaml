  text: ὁ γὰρ θεὸς ⸀εἶπεν· Τίμα τὸν πατέρα καὶ τὴν μητέρα, καί· Ὁ κακολογῶν πατέρα ἢ μητέρα θανάτῳ τελευτάτω·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/004.yaml
  text: For God said[a], ‘Honor your father and your mother,’ and, ‘Whoever speaks evil of father or mother must surely die.’
translation:
  language: vi
  text: 'Vì Đức Chúa Trời phán: “Hãy hiếu kính cha ngươi và mẹ ngươi,” và: “Ai lăng mạ cha hoặc mẹ[a] thì chắc chắn phải chết.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “nguyền rủa cha hoặc mẹ.”'
    reason: Phương án từ vựng cho κακολογέω, có thể mang nghĩa nguyền rủa bên cạnh nói ác hoặc lăng mạ.
lexical_decisions:
- source_word: ὁ γὰρ θεὸς
  choice: Vì Đức Chúa Trời
  rationale: γάρ nêu lý do làm nền cho lập luận của Đức Giê-su; “Vì” giữ quan hệ giải thích, còn “Đức Chúa Trời” là cách gọi trang trọng, quen thuộc trong văn phong Kinh Thánh tiếng Việt.
- source_word: εἶπεν
  choice: đã phán
  rationale: λέγω giới thiệu lời trích dẫn Kinh Thánh. “Phán” tự nhiên khi chủ thể là Đức Chúa Trời và không tăng nghĩa thành “truyền lệnh”.
- source_word: Τίμα
  choice: Hãy hiếu kính
  rationale: τιμάω đòi hỏi dành cho cha mẹ sự tôn kính đúng mức. “Hiếu kính” vừa rõ nghĩa trong quan hệ cha mẹ-con cái vừa giữ sức nặng luân lý của điều răn.
- source_word: τὸν πατέρα καὶ τὴν μητέρα
  choice: cha mẹ ngươi
  rationale: Cách diễn đạt gọn và tự nhiên trong tiếng Việt; “ngươi” giữ sắc thái trực tiếp, trang trọng của điều răn được trích dẫn.
- source_word: Ὁ κακολογῶν
  choice: Kẻ nào nguyền rủa
  rationale: κακολογέω có thể chỉ nói xấu, lăng mạ hoặc nguyền rủa. Trong ngữ cảnh luật pháp trích từ Xuất Hành 21:17, “nguyền rủa” diễn đạt thích hợp sức nặng của hành vi mà không thu hẹp thành lời nói tục cụ thể.
- source_word: πατέρα ἢ μητέρα
  choice: cha hoặc mẹ
  rationale: Giữ nguyên cấu trúc lựa chọn của tiếng Hy Lạp và tính khái quát của danh từ không có sở hữu từ.
- source_word: θανάτῳ τελευτάτω
  choice: thì chắc chắn phải chết
  rationale: Cụm danh từ chỉ cái chết đi với mệnh lệnh tạo thành công thức hình phạt tử hình trang nghiêm. Cách dịch này giữ mức độ chắc chắn và nghiêm trọng nhưng không nói rõ tác nhân thi hành hơn bản Hy Lạp.
theological_decisions:
- issue: Cách dịch công thức hình phạt pháp lý θανάτῳ τελευτάτω
  choice: thì chắc chắn phải chết
  alternative: thì phải bị xử tử
  rationale: Bản văn viện dẫn luật Kinh Thánh và phải giữ nguyên tính nghiêm khắc. “Chắc chắn phải chết” phản ánh công thức pháp lý có nền Semit, đồng thời không thêm tác nhân thi hành mà câu Hy Lạp không nói rõ.
translation_notes:
  register: Văn phong hiện đại nhưng trang trọng, phù hợp lời trích Kinh Thánh. Dùng “ngươi” trong chính điều răn để giữ giọng trực tiếp và uy nghi; ngoài phần trích dẫn không thêm đại từ hay lời giải thích. Không đặt chú thích vì các phương án khác đã được ghi trong hồ sơ quyết định dịch, và bản chính chọn được cách diễn đạt rõ mà vẫn giữ độ mở về tác nhân của án tử hình.
