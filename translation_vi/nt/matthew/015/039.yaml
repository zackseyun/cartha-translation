id: MAT.15.39
reference: Matthew 15:39
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἀπολύσας τοὺς ὄχλους ἐνέβη εἰς τὸ πλοῖον, καὶ ἦλθεν εἰς τὰ ὅρια ⸀Μαγαδάν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/039.yaml
  text: And after dismissing the crowds[a], he got into the boat and came to the region of Magadan.
translation:
  language: vi
  text: Sau khi cho dân chúng ra về, Đức Giê-su lên thuyền và đến miền Ma-ga-đan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Một số bản chép tay ghi “Ma-đa-la” thay cho “Ma-ga-đan.”
    reason: textual_variant
lexical_decisions:
- source_word: ἀπολύσας
  choice: Sau khi cho ... ra về
  rationale: Phân từ bất định quá khứ diễn tả hành động xảy ra trước động từ chính; cách nói này tự nhiên trong tiếng Việt và đúng với nghĩa cho đám đông giải tán.
- source_word: τοὺς ὄχλους
  choice: dân chúng
  rationale: Diễn đạt số đông tụ họp quanh Đức Giê-su bằng tiếng Việt hiện đại, tự nhiên; ngữ cảnh cho phép dùng danh từ tập hợp dù tiếng Hy Lạp ở số nhiều.
- source_word: ἐνέβη εἰς τὸ πλοῖον
  choice: lên thuyền
  rationale: Đây là cách nói tiếng Việt tự nhiên và chính xác cho hành động bước lên hoặc vào thuyền để đi.
- source_word: ἦλθεν
  choice: đến
  rationale: Trong trình thuật di chuyển, 'đến' diễn đạt tự nhiên kết quả của hành trình mà không áp đặt điểm nhìn 'đi' hay 'về'.
- source_word: τὰ ὅρια
  choice: miền
  rationale: Dạng số nhiều có nghĩa thành ngữ là vùng hoặc địa hạt, chứ không chỉ các đường ranh giới; 'miền' gọn và tự nhiên.
- source_word: Μαγαδάν
  choice: Ma-ga-đan
  rationale: Phiên âm địa danh theo bản văn SBLGNT, không thay bằng dị bản quen thuộc hơn.
theological_decisions:
- issue: Dạng địa danh ở cuối câu
  choice: Ma-ga-đan
  alternative: Ma-đa-la
  rationale: Đây là vấn đề dị bản văn bản hơn là thần học. Bản chính SBLGNT đọc Μαγαδάν, nên bản dịch giữ Ma-ga-đan và nêu dị bản Ma-đa-la trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Đức Giê-su” để xác định chủ thể được tiếp nối từ ngữ cảnh; tiếng Hy Lạp chỉ dùng đại từ hàm ẩn trong động từ. Dấu chú thích đặt ngay sau địa danh mà chú thích giải thích.
source_grounding:
