source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν· Οὐκ ἔστιν καλὸν λαβεῖν τὸν ἄρτον τῶν τέκνων καὶ βαλεῖν τοῖς κυναρίοις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/026.yaml
  text: But he answered[a], “It is not right to take the children's bread and throw it to the little dogs.”
translation:
  language: vi
  text: 'Nhưng Người đáp: “Không phải lẽ khi lấy bánh của con cái mà ném cho chó nhỏ[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “chó nuôi trong nhà” hoặc “chó con”. Từ Hy Lạp dùng dạng giảm nhẹ của từ “chó”, có thể gợi những con chó nhỏ hoặc chó nuôi trong nhà.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: đáp
  rationale: Cụm phân từ kết hợp với động từ hữu hạn có nghĩa tự nhiên là “đáp”; cách dịch gọn này giữ được ý hồi đáp mà không mô phỏng cấu trúc Hy Lạp một cách nặng nề.
- source_word: καλὸν
  choice: phải lẽ
  rationale: Trong câu này, καλόν nói đến điều hợp lẽ, thích đáng; “phải lẽ” truyền đạt sắc thái ấy tự nhiên và trang trọng hơn cách hiểu thuần túy là “tốt”.
- source_word: λαβεῖν
  choice: lấy
  rationale: Động từ diễn tả hành động lấy vật trong tay hoặc lấy đi; “lấy” là nghĩa trực tiếp, phù hợp với hình ảnh của câu.
- source_word: ἄρτον
  choice: bánh
  rationale: “Bánh” giữ nguyên hình ảnh cụ thể của ἄρτος, thay vì diễn giải rộng thành “thức ăn”.
- source_word: τέκνων
  choice: con cái
  rationale: τέκνα bao gồm con trẻ không phân biệt giới tính; “con cái” vừa chính xác vừa tự nhiên trong tiếng Việt.
- source_word: βαλεῖν
  choice: ném
  rationale: “Ném” giữ sức gợi hình trực tiếp của βάλλω, không làm nhẹ thành “cho”.
- source_word: κυναρίοις
  choice: chó con
  rationale: κυνάριον là dạng giảm nhẹ của từ “chó”, có thể gợi chó nhỏ hoặc chó nuôi trong nhà. “Chó con” giữ được nét giảm nhẹ, còn các khả năng khác được ghi trong chú thích.
theological_decisions:
- issue: Ẩn dụ về con cái, bánh và chó có thể được diễn giải theo các đối tượng trong văn cảnh.
  choice: Giữ nguyên các hình ảnh “bánh của con cái” và “chó con”, không nêu rõ các đối tượng mà chúng tượng trưng trong chính văn.
  alternative: Diễn giải trực tiếp ẩn dụ theo dân Israel và dân ngoại.
  rationale: Câu Hy Lạp không giải thích trực tiếp các đối tượng của ẩn dụ tại đây. Giữ nguyên hình ảnh bảo toàn sức căng và sự mơ hồ có chủ ý của lời nói, để văn cảnh định hướng cách hiểu.
translation_notes:
  register: Bản dịch dùng tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Cụm “không phải lẽ” diễn đạt tính không thích đáng của hành động; đại từ “ngài” giữ cách xưng hô kính trọng mà không thêm lời giải thích vào câu.
