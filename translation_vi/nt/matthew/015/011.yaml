id: MAT.15.11
reference: Matthew 15:11
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οὐ τὸ εἰσερχόμενον εἰς τὸ στόμα κοινοῖ τὸν ἄνθρωπον, ἀλλὰ τὸ ἐκπορευόμενον ἐκ τοῦ στόματος τοῦτο κοινοῖ τὸν ἄνθρωπον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/011.yaml
  text: It is not what enters into the mouth that defiles the man[b][a], but what comes out of the mouth—this defiles the man.
translation:
  language: vi
  text: Không phải điều đi vào miệng làm cho một người bị ô uế,[a] nhưng điều từ miệng đi ra—chính điều ấy làm cho một người bị ô uế.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “làm cho một người không thanh sạch.” Động từ Hy Lạp có thể chỉ việc khiến một người trở nên ô uế trong ý nghĩa liên quan đến sự thanh sạch.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κοινοῖ
  choice: làm cho ... bị ô uế
  rationale: Trong bối cảnh tranh luận về sự thanh sạch, động từ này chỉ việc khiến một người trở nên ô uế, đồng thời có thể gợi cả phương diện nghi lễ lẫn đạo đức. Cách dịch này tự nhiên hơn trong tiếng Việt so với việc dùng một động từ hiếm hoặc chỉ gợi sự bẩn thỉu.
- source_word: τὸ εἰσερχόμενον εἰς τὸ στόμα
  choice: điều đi vào miệng
  rationale: Danh động tính từ có mạo từ được diễn đạt tự nhiên bằng “điều...”; “đi vào miệng” giữ nguyên hình ảnh cụ thể và hướng chuyển động của εἰς.
- source_word: τὸ ἐκπορευόμενον ἐκ τοῦ στόματος
  choice: điều từ miệng đi ra
  rationale: Cách diễn đạt giữ rõ giới từ ἐκ (“từ”) và sự đối lập với điều đi vào miệng, đồng thời vẫn tự nhiên trong tiếng Việt hiện đại.
- source_word: ἄνθρωπον
  choice: một người
  rationale: ἄνθρωπος ở đây là danh từ số ít mang nghĩa đại diện, chỉ một con người nói chung. Tiếng Việt không đánh dấu giống ngữ pháp như tiếng Hy Lạp; “một người” truyền đạt chính xác lực khái quát mà không thu hẹp đối tượng thành nam giới.
- source_word: τοῦτο
  choice: chính điều ấy
  rationale: 'Thêm “chính” để bảo toàn sự nhấn mạnh của đại từ chỉ định: điều từ miệng đi ra mới là điều gây ô uế.'
- source_word: οὐ ... ἀλλὰ
  choice: Không phải ... nhưng ...
  rationale: Cấu trúc này thể hiện rõ phép đối lập mạnh của nguyên văn và phù hợp với văn phong trang trọng, hiện đại.
theological_decisions:
- issue: Ngôn ngữ thanh sạch trong κοινόω
  choice: Dịch là “làm cho ... bị ô uế” để giữ cả sắc thái thanh sạch nghi lễ và sự ô uế đạo đức.
  alternative: “làm cho ... không thanh sạch” hoặc “làm ô nhiễm”
  rationale: “Bị ô uế” là cách nói quen thuộc trong ngữ cảnh Kinh Thánh và không giới hạn câu nói vào vệ sinh thể chất; đồng thời nó không buộc người đọc phải hiểu riêng theo nghĩa nghi lễ hay riêng theo nghĩa đạo đức.
- issue: Ý nghĩa đại diện của ἄνθρωπον
  choice: Dùng “một người” với nghĩa một con người nói chung.
  alternative: “người đàn ông”
  rationale: Danh từ Hy Lạp ở đây mang lực khái quát. Vì tiếng Việt không có yêu cầu giữ giống ngữ pháp tương ứng, “một người” bảo toàn nghĩa chỉ con người nói chung và tránh tạo ra một giới hạn giới tính không có trong ý nghĩa ngữ cảnh.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dấu gạch ngang làm nổi bật τοῦτο (“chính điều ấy”) và giữ nhịp đối lập của câu Hy Lạp. Chỉ dùng một chú thích vì nghĩa khái quát của “một người” đã rõ tự nhiên trong tiếng Việt.
