source:
  edition: SBLGNT
  text: Διὰ τί οἱ μαθηταί σου παραβαίνουσιν τὴν παράδοσιν τῶν πρεσβυτέρων; οὐ γὰρ νίπτονται τὰς χεῖρας ⸀αὐτῶν ὅταν ἄρτον ἐσθίωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/002.yaml
  text: Why do your disciples break the tradition of the elders? For they do not wash their hands when they eat bread[a][b].
translation:
  language: vi
  text: “Tại sao các môn đồ của thầy vi phạm truyền thống của người xưa? Vì họ không rửa tay khi ăn bánh[a][b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Đây là việc rửa tay theo lệ do truyền thống của người xưa quy định, chứ không chỉ là vấn đề vệ sinh thông thường.
    reason: cultural_note
  - marker: b
    text: 'Cũng có thể dịch: “khi dùng bữa”; từ Hy Lạp được dịch là “bánh” đôi khi chỉ thức ăn nói chung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὰ τί
  choice: Tại sao
  rationale: Cách hỏi lý do tự nhiên, rõ ràng trong tiếng Việt hiện đại.
- source_word: οἱ μαθηταί σου
  choice: các môn đồ của thầy
  rationale: Giữ thuật ngữ quen thuộc chỉ những người theo học một vị thầy; đại từ “thầy” phù hợp với lời chất vấn trực tiếp trong bối cảnh.
- source_word: παραβαίνουσιν
  choice: vi phạm
  rationale: Diễn đạt việc vượt qua hoặc không tuân giữ một quy định có thẩm quyền; tự nhiên hơn “phạm” và trang trọng vừa phải.
- source_word: τὴν παράδοσιν τῶν πρεσβυτέρων
  choice: truyền thống của các trưởng lão
  rationale: Giữ ý về truyền thống được lưu truyền từ những bậc có thẩm quyền, không làm nhẹ thành một tập quán thông thường.
- source_word: νίπτονται τὰς χεῖρας αὐτῶν
  choice: họ không rửa tay
  rationale: Cách diễn đạt tự nhiên của tiếng Việt cho hành động rửa một bộ phận cơ thể; đại từ sở hữu không cần lặp lại vì đã rõ chủ thể.
- source_word: ὅταν
  choice: khi
  rationale: Diễn đạt tự nhiên một tình huống có tính thường lệ trong ngữ cảnh.
- source_word: ἄρτον
  choice: bánh
  rationale: Giữ nghĩa trực tiếp của từ Hy Lạp, đồng thời chú thích khả năng hoán dụ chỉ bữa ăn hoặc thức ăn nói chung.
- source_word: ἐσθίωσιν
  choice: ăn
  rationale: Động từ đơn giản và tự nhiên; kết hợp với “khi” truyền đạt phù hợp hành động có tính thông lệ.
theological_decisions:
- issue: Tính chất của việc rửa tay được nhắc đến
  choice: Trong chính văn, trình bày đây là vấn đề liên quan đến truyền thống của các trưởng lão, không thêm từ “nghi lễ” hay “thanh sạch”.
  alternative: Giải thích trực tiếp trong chính văn là rửa tay theo nghi thức, hoặc hiểu đơn thuần là vệ sinh thông thường.
  rationale: Câu văn quy vấn đề về việc tuân giữ truyền thống nhưng không tự nó giải thích đầy đủ bản chất của nghi thức; chú thích cung cấp bối cảnh mà không giải quyết quá mức sự căng thẳng của bản văn.
translation_notes:
  register: Văn phong hiện đại, rõ ràng và trang trọng vừa phải. “Môn đồ”, “trưởng lão” và “truyền thống” duy trì sắc thái lịch sử–tôn giáo; cấu trúc câu hỏi trực tiếp tự nhiên trong tiếng Việt.
