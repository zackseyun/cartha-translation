    issue: “Vì thế” chưa phản ánh đầy đủ giá trị kết quả của ὥστε.
    rationale: Trong cấu trúc ὥστε + nguyên mẫu, câu mô tả kết quả của các việc chữa lành vừa nêu; “Đến nỗi” biểu đạt trực tiếp hơn quan hệ này.
  - severity: low
