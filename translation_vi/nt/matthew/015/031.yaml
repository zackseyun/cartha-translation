reference: Matthew 15:31
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὥστε ⸂τὸν ὄχλον⸃ θαυμάσαι βλέποντας κωφοὺς λαλοῦντας ⸂κυλλοὺς ὑγιεῖς⸃ ⸀καὶ χωλοὺς περιπατοῦντας καὶ τυφλοὺς βλέποντας· καὶ ἐδόξασαν τὸν θεὸν Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/031.yaml
  text: so that the crowd marveled as they saw the mute speaking, the crippled made well, the lame walking, and the blind seeing; and they glorified the God of Israel.
translation:
  language: vi
  text: Đến nỗi đám đông kinh ngạc khi thấy những người không nói được nói,[a] những người bị tật ở tay chân đã lành,[b] những người bị què đi lại được và những người mù thấy được; họ tôn vinh Đức Chúa Trời của Y-sơ-ra-ên.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “những người điếc nói.” Từ Hy Lạp có thể chỉ người điếc hoặc người không nói được; ở đây cách hiểu “người không nói được” phù hợp hơn vì trọng tâm trực tiếp là việc họ nói.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “những người có chi thể bị tổn thương được phục hồi” hoặc “những người bị tật được khỏe mạnh.” Từ Hy Lạp chỉ những người có chi thể bị khuyết tật hoặc tổn thương, nay ở tình trạng lành mạnh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: Vì thế
  rationale: Diễn tả kết quả của những sự chữa lành vừa được thuật lại, tự nhiên trong tiếng Việt.
- source_word: τὸν ὄχλον
  choice: đoàn dân
  rationale: Chỉ đám đông đang hiện diện, với sắc thái trang trọng nhưng vẫn dễ hiểu.
- source_word: θαυμάσαι
  choice: kinh ngạc
  rationale: Truyền đạt phản ứng sửng sốt, thán phục trước những phép chữa lành.
- source_word: βλέποντας
  choice: khi thấy
  rationale: Diễn đạt tự nhiên phân từ chỉ điều họ tận mắt chứng kiến và là nguyên nhân khiến họ kinh ngạc.
- source_word: κωφοὺς
  choice: người câm
  rationale: κωφός có thể chỉ người điếc hoặc người câm; λαλοῦντας, “nói,” khiến nghĩa “người câm” phù hợp hơn trong ngữ cảnh.
- source_word: λαλοῦντας
  choice: nói được
  rationale: “Được” làm rõ khả năng nói đã được phục hồi, phù hợp với ngữ cảnh chữa lành.
- source_word: κυλλοὺς
  choice: người tàn tật
  rationale: Chỉ những người có chi thể bị khuyết tật hoặc tổn thương; cách nói này rõ và tôn trọng trong tiếng Việt hiện đại.
- source_word: ὑγιεῖς
  choice: được lành lặn
  rationale: Phản ánh tình trạng khỏe mạnh, nguyên vẹn sau khi được chữa lành mà không diễn giải quá mức.
- source_word: χωλοὺς
  choice: người què
  rationale: Tương ứng trực tiếp với người bị suy giảm khả năng đi lại trong bối cảnh chữa lành.
- source_word: περιπατοῦντας
  choice: đi được
  rationale: Nêu rõ khả năng đi lại đã được phục hồi.
- source_word: τυφλοὺς βλέποντας
  choice: người mù thấy được
  rationale: Giữ cấu trúc tương phản trực tiếp và nhịp liệt kê của nguyên văn.
- source_word: ἐδόξασαν
  choice: tôn vinh
  rationale: Diễn đạt việc quy vinh quang và danh dự cho Đức Chúa Trời, tự nhiên hơn lối dịch sát “làm vinh hiển.”
- source_word: τὸν θεὸν Ἰσραήλ
  choice: Đức Chúa Trời của Y-sơ-ra-ên
  rationale: Giữ quan hệ sở thuộc của cụm Hy Lạp và cách gọi Kinh Thánh quen thuộc trong tiếng Việt.
theological_decisions:
- issue: Nghĩa của κωφοὺς trong κωφοὺς λαλοῦντας
  choice: người câm nói được
  alternative: người điếc nói được
  rationale: Từ này có thể mang cả hai nghĩa, nhưng động từ “nói” tạo sự đối lập trực tiếp với tình trạng không nói được; chú thích bảo tồn nghĩa thay thế.
- issue: Sắc thái của δοξάζω khi hướng về Đức Chúa Trời
  choice: tôn vinh Đức Chúa Trời
  alternative: ca ngợi Đức Chúa Trời; dâng vinh quang cho Đức Chúa Trời
  rationale: “Tôn vinh” giữ được ý quy vinh quang và danh dự cho Đức Chúa Trời mà vẫn tự nhiên trong tiếng Việt.
- issue: Tình trạng được mô tả bởi κυλλοὺς ὑγιεῖς
  choice: người tàn tật được lành lặn
  alternative: người có chi thể bị thương tổn được phục hồi nguyên vẹn
  rationale: Bản dịch chính ngắn gọn và dễ hiểu; chú thích giữ sắc thái có thể bao gồm chi thể bị khuyết hoặc tổn thương.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Các vế “nói được, được lành lặn, đi được, thấy được” tạo nhịp cân đối, đồng thời phân biệt người tàn tật về chi thể (κυλλοί) với người què (χωλοί). Mọi chú thích đều có ký hiệu tương ứng trong chính văn.
