revisions:
- from: Vì thế, đoàn dân kinh ngạc khi thấy người câm nói được,[a] người tàn tật được lành lặn,[b] người què đi được và người mù thấy được; rồi họ tôn vinh Đức Chúa Trời của Y-sơ-ra-ên.
  to: Đến nỗi đám đông kinh ngạc khi thấy những người không nói được nói,[a] những người bị tật ở tay chân đã lành,[b] những người bị què đi lại được và những người mù thấy được; họ tôn vinh Đức Chúa Trời của Y-sơ-ra-ên.
  rationale: Bản sửa thay “Vì thế” bằng “Đến nỗi” để phản ánh chính xác quan hệ kết quả của ὥστε; thay “đoàn dân” bằng “đám đông”; và điều chỉnh các cách gọi về khuyết tật theo lối hiện đại, tôn trọng hơn. Cấu trúc liệt kê, tính mơ hồ từ vựng của κωφός, sự phân biệt giữa κυλλός và χωλός, cùng hai điểm neo chú thích đều được duy trì.
