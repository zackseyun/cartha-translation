  text: ὁ δὲ ἀποκριθεὶς εἶπεν· Πᾶσα φυτεία ἣν οὐκ ἐφύτευσεν ὁ πατήρ μου ὁ οὐράνιος ἐκριζωθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/013.yaml
  text: But he answered and said[a], “Every plant that my heavenly Father did not plant will be uprooted.”
translation:
  language: vi
  text: 'Nhưng Ngài đáp: “Mọi cây mà Cha Ta ở trên trời không trồng đều sẽ bị nhổ tận gốc.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: đáp
  rationale: Cụm này là công thức kể chuyện chịu ảnh hưởng Semit. Tiếng Việt tự nhiên chỉ cần “đáp”; dịch cả hai động từ thành “đáp và nói” sẽ nặng và thừa nghĩa.
- source_word: Πᾶσα
  choice: Mọi
  rationale: “Mọi” diễn đạt tự nhiên sắc thái phân bố của từ Hy Lạp số ít và phù hợp với danh từ “cây” theo sau.
- source_word: φυτεία
  choice: cây
  rationale: Danh từ có thể chỉ vật được trồng hoặc việc trồng. “Cây” tự nhiên trong hình ảnh này và ăn khớp với hành động bị nhổ tận gốc, nhưng vẫn không xác định đối tượng ẩn dụ.
- source_word: ἐφύτευσεν
  choice: trồng
  rationale: Giữ nguyên hình ảnh nông nghiệp và sự liên kết cùng gốc từ với φυτεία.
- source_word: ὁ πατήρ μου ὁ οὐράνιος
  choice: Cha trên trời của tôi
  rationale: Cách diễn đạt rõ ràng, hiện đại, giữ cả đại từ sở hữu “của tôi” và đặc tính “trên trời”, đồng thời tránh cách viết hoa đại từ ngoài văn bản nguồn.
- source_word: ἐκριζωθήσεται
  choice: sẽ bị nhổ tận gốc
  rationale: Diễn đạt rõ thì tương lai và thể bị động, đồng thời giữ đầy đủ hình ảnh bị nhổ khỏi rễ.
theological_decisions:
- issue: Đối tượng ẩn dụ của “mọi cây”
  choice: Giữ nguyên ẩn dụ “mọi cây”, không xác định đó là giáo huấn, truyền thống hay con người.
  alternative: Dịch giải nghĩa thành “mọi giáo huấn”, “mọi truyền thống” hoặc “mọi người không được Cha trồng”.
  rationale: Bản Hy Lạp để ngỏ đối tượng quy chiếu của ẩn dụ; giữ hình ảnh bảo toàn sự mơ hồ và sức căng thần học của câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Lược công thức kép “đáp và nói” để tiếng Việt tự nhiên hơn, nhưng không làm mất nội dung. Không thêm chú thích vì phương án “việc trồng” tuy khả dĩ về từ vựng nhưng kém tự nhiên trong câu và không cần thiết để hiểu bản văn.
