- from: 'Nhưng Ngài đáp: “Mọi cây mà Cha trên trời của tôi không trồng đều sẽ bị nhổ tận gốc.”'
  to: 'Nhưng Ngài đáp: “Mọi cây mà Cha Ta ở trên trời không trồng đều sẽ bị nhổ tận gốc.”'
  rationale: 'Chỉ điều chỉnh cách xưng hô và trật tự diễn đạt của cụm chỉ Cha để tiếng Việt tự nhiên, nhất quán về đăng cấp, đồng thời vẫn giữ nguyên nghĩa, hình ảnh ẩn dụ và tính không xác định của nguyên văn. Không cần chú thích: nghĩa thay thế “việc trồng” không cần thiết cho việc hiểu câu và bản văn chính vẫn bảo toàn ẩn dụ.'
  reviewer_model: gpt-5.6-terra
