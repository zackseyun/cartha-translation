  text: And after instructing the crowd to recline on the ground,[a]
translation:
  language: vi
  text: Rồi Ngài bảo đám đông ngồi xuống đất.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “ngả mình xuống đất.” Động từ Hy Lạp có thể chỉ việc vào chỗ để dùng bữa, thường mang sắc thái ngả mình nằm.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Rồi
  rationale: Liên từ nối tiếp diễn biến; “Rồi” tự nhiên trong văn kể tiếng Việt và cho thấy hành động kế tiếp.
- source_word: παραγγείλας
  choice: bảo
  rationale: Phân từ bất định quá khứ diễn tả lời chỉ dẫn có tính mệnh lệnh của Chúa Giê-su, xảy ra trước hành động ở câu kế tiếp. “Bảo” vừa tự nhiên vừa giữ được lực chỉ thị mà không quá nặng như “ra lệnh”.
- source_word: τῷ ὄχλῳ
  choice: đám đông
  rationale: Danh từ số ít ở cách tặng, chỉ đối tượng nhận lời chỉ dẫn; “đám đông” là cách gọi hiện đại, rõ nghĩa.
- source_word: ἀναπεσεῖν
  choice: ngồi xuống
  rationale: Trong bối cảnh dùng bữa, động từ chỉ việc vào tư thế ăn, thường là ngả mình nằm. Vì tiếng Việt hiện đại thường diễn đạt hành động này là “ngồi xuống”, bản dịch dùng cách nói tự nhiên và ghi chú sắc thái nguyên ngữ.
- source_word: ἐπὶ τὴν γῆν
  choice: xuống đất
  rationale: Ở đây γῆ chỉ mặt đất nơi đám đông ngồi hoặc ngả mình, không phải toàn thể trái đất; “xuống đất” kết hợp tự nhiên với “ngồi xuống”.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Đại từ “Ngài” chỉ Chúa Giê-su được suy ra từ ngữ cảnh, vì chủ thể của phân từ không được nêu lại trong câu Hy Lạp. Dấu chú thích [a] được đặt ngay sau cụm từ cần giải thích.
