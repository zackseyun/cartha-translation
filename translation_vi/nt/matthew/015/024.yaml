id: MAT.15.24
reference: Matthew 15:24
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν· Οὐκ ἀπεστάλην εἰ μὴ εἰς τὰ πρόβατα τὰ ἀπολωλότα οἴκου Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/024.yaml
  text: But he answered[a], “I was sent only to the lost sheep of the house of Israel.”
translation:
  language: vi
  text: 'Nhưng Ngài đáp: “Ta chỉ được sai đến với những con chiên lạc mất của nhà Y-sơ-ra-ên.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay dịch sát hơn: “Ta không được sai đến đâu khác ngoài những con chiên lạc mất của nhà Y-sơ-ra-ên.”'
    reason: Nêu cấu trúc phủ định–ngoại trừ Οὐκ ... εἰ μὴ vốn được diễn đạt gọn hơn bằng “chỉ” trong chính văn.
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: Ngài đáp
  rationale: Cụm phân từ + động từ hữu hạn được chuyển tự nhiên sang tiếng Việt bằng một động từ “đáp”, vẫn giữ đầy đủ chức năng dẫn lời hồi đáp.
- source_word: Οὐκ ἀπεστάλην
  choice: Ta được sai
  rationale: Thể bị động aorist diễn tả việc được sai phái, tức sứ mạng được giao; tiếng Việt không cần đánh dấu thì quá khứ tại đây.
- source_word: εἰ μὴ
  choice: chỉ ... đến với
  rationale: Trong cấu trúc phủ định–ngoại trừ, εἰ μὴ giới hạn phạm vi sứ mạng. “Chỉ” diễn đạt tự nhiên mà vẫn giữ tính hạn định rõ ràng.
- source_word: πρόβατα
  choice: những con chiên
  rationale: Giữ nguyên hình ảnh ẩn dụ về chiên thay vì diễn giải thành dân chúng; “chiên” phù hợp văn phong Kinh Thánh tiếng Việt và vẫn dễ hiểu.
- source_word: ἀπολωλότα
  choice: lạc mất
  rationale: Phân từ hoàn thành được dùng như tính từ chỉ những con chiên ở trong tình trạng bị lạc. “Lạc mất” phù hợp hình ảnh mục tử và không hàm ý sự hủy diệt chung cuộc như “bị diệt mất”.
- source_word: οἴκου Ἰσραήλ
  choice: nhà Y-sơ-ra-ên
  rationale: Giữ thành ngữ Kinh Thánh mang sắc thái dân tộc và giao ước; cách phiên âm “Y-sơ-ra-ên” quen thuộc, dễ nhận biết trong tiếng Việt.
- source_word: δὲ
  choice: Nhưng
  rationale: Thể hiện bước chuyển có sắc thái tương phản nhẹ trong mạch đối thoại.
theological_decisions:
- issue: Phạm vi sứ mạng Chúa Giê-su nêu trong lời này
  choice: 'Dịch thẳng như một giới hạn đối với sứ mạng được nói đến trong bối cảnh này: “chỉ được sai đến”.'
  alternative: Diễn giải nhẹ hơn thành sự ưu tiên dành cho Israel, hoặc đưa sứ mạng về sau đối với các dân ngoại vào câu dịch.
  rationale: Cấu trúc Οὐκ ... εἰ μὴ có tính hạn định rõ ràng. Bản dịch giữ nguyên sức căng thần học của lời nói trong trình thuật, không dùng những diễn biến rộng hơn của Kinh Thánh để làm dịu hoặc mở rộng câu này.
- issue: Cách xưng hô của Chúa Giê-su
  choice: Dùng “Ta” trong lời trực tiếp và “Ngài” trong lời dẫn.
  alternative: Dùng “tôi” hoặc “thầy” trong lời trực tiếp.
  rationale: “Ta” và “Ngài” tạo giọng trang trọng, quen thuộc trong văn phong Kinh Thánh tiếng Việt, nhưng không bổ sung một tước hiệu thần học không có trong nguyên văn.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng và dễ hiểu. Giữ hình ảnh “chiên” và thành ngữ “nhà Y-sơ-ra-ên”; tránh diễn giải làm giảm tính giới hạn của lời nói. Dấu chú thích [a] được đặt ngay sau câu trích dẫn.
