source:
  edition: SBLGNT
  text: ἄφετε αὐτούς· ⸂τυφλοί εἰσιν ὁδηγοὶ τυφλῶν⸃· τυφλὸς δὲ τυφλὸν ἐὰν ὁδηγῇ, ἀμφότεροι εἰς βόθυνον πεσοῦνται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/014.yaml
  text: Leave them alone[a]; they are blind guides of the blind. But if a blind man guides a blind man[c][b], both will fall into a pit.
translation:
  language: vi
  text: Cứ để mặc họ; họ là những người mù dẫn đường cho người mù. Nhưng nếu người mù dẫn đường cho người mù thì cả hai sẽ rơi xuống hố.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “hào”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄφετε αὐτούς
  choice: Cứ để mặc họ
  rationale: Trong ngữ cảnh này, ἀφίημι mang nghĩa để mặc, không can thiệp; “cứ để mặc họ” diễn đạt tự nhiên sắc thái mệnh lệnh của nguyên văn.
- source_word: τυφλοί ... ὁδηγοὶ τυφλῶν
  choice: những người mù dẫn đường cho người mù
  rationale: Giữ nguyên hình ảnh “mù” và chức năng “dẫn đường”, thay vì diễn giải thành sự thiếu hiểu biết hay vai trò lãnh đạo.
- source_word: τυφλὸς ... τυφλὸν
  choice: người mù ... người mù
  rationale: Tiếng Việt dùng “người mù” tự nhiên cho cách nói đơn số mang tính đại diện; không cần thêm giới tính vốn không được biểu thị tương ứng trong tiếng Việt.
- source_word: ἐὰν ὁδηγῇ
  choice: nếu ... dẫn đường
  rationale: Diễn đạt điều kiện khái quát một cách tự nhiên, đồng thời giữ sự liên kết từ vựng với ὁδηγοί ở mệnh đề trước.
- source_word: ἀμφότεροι
  choice: cả hai
  rationale: Chuyển tải trực tiếp ý cả người dẫn lẫn người được dẫn.
- source_word: εἰς βόθυνον πεσοῦνται
  choice: sẽ rơi xuống hố
  rationale: “Hố” là cách gọi rộng, rõ và giàu hình ảnh cho βόθυνος; động từ tương lai được thể hiện bằng “sẽ rơi”.
theological_decisions:
- issue: Ý nghĩa ẩn dụ của “mù”
  choice: Giữ nguyên hình ảnh “mù” mà không giải nghĩa trong chính văn.
  alternative: Dịch diễn giải là “mù quáng về tâm linh” hoặc “không hiểu biết”.
  rationale: Nguyên văn dùng một ẩn dụ và một câu nói mang tính châm ngôn; giải nghĩa ngay trong bản dịch sẽ thu hẹp hàm ý và làm giảm sức gợi của hình ảnh.
- issue: Tính đại diện của danh từ số ít trong câu châm ngôn
  choice: Dùng “người mù” theo nghĩa đại diện chung.
  alternative: Thêm từ chỉ giới tính như “người đàn ông mù”.
  rationale: Dạng giống đực trong tiếng Hy Lạp có chức năng ngữ pháp và đại diện chung; tiếng Việt không bắt buộc đánh dấu giới tính ở đây, nên “người mù” vừa tự nhiên vừa giữ đúng phạm vi áp dụng của câu nói.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Cứ để mặc họ” tự nhiên hơn lối dịch sát chữ “hãy để họ”, còn sự lặp lại “người mù” được giữ để bảo toàn nhịp điệu và sức mạnh của câu châm ngôn.
