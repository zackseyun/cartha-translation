  text: ⸂Ὁ λαὸς οὗτος⸃ τοῖς χείλεσίν με τιμᾷ, ἡ δὲ καρδία αὐτῶν πόρρω ἀπέχει ἀπ’ ἐμοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/008.yaml
  text: This people honors me with their lips[a], but their heart is far from me.
translation:
  language: vi
  text: Dân này lấy môi miệng tôn kính Ta, nhưng lòng họ lại cách xa Ta.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὁ λαὸς οὗτος
  choice: Dân này
  rationale: Giữ nghĩa tập thể của λαός và sắc thái chỉ định của οὗτος; cách nói ngắn gọn, trang trọng và tự nhiên trong lời trích dẫn tiên tri.
- source_word: τοῖς χείλεσίν
  choice: bằng môi miệng
  rationale: Diễn đạt cách dùng công cụ của cách dữ cách và giữ hình ảnh cụ thể về môi, không chuyển thành ý trừu tượng như “lời nói”.
- source_word: με
  choice: Ta
  rationale: Đại từ ngôi thứ nhất là tân ngữ trực tiếp của τιμᾷ. Viết hoa theo quy ước tiếng Việt khi lời nói quy chiếu đến Đức Chúa Trời, nhưng không thêm danh xưng vào nguyên văn.
- source_word: τιμᾷ
  choice: tôn kính
  rationale: τιμάω chỉ hành động bày tỏ sự tôn trọng, tôn quý; “tôn kính” tự nhiên trong ngữ cảnh hướng về Đức Chúa Trời mà không đẩy nghĩa sang “tôn vinh”.
- source_word: ἡ δὲ καρδία αὐτῶν
  choice: nhưng lòng họ
  rationale: Giữ καρδία ở số ít mang nghĩa tập thể và dùng δέ theo nghĩa tương phản. Tiếng Việt tự nhiên có thể dùng “lòng họ” mà vẫn bảo tồn hình thức số ít.
- source_word: πόρρω ἀπέχει ἀπ’ ἐμοῦ
  choice: cách xa Ta
  rationale: Diễn đạt trực tiếp tình trạng ở xa theo cả hình ảnh khoảng cách và hàm ý xa cách trong mối quan hệ, không thêm ý chủ động tránh né.
theological_decisions:
- issue: “Lòng” số ít mang nghĩa tập thể hay số nhiều phân phối
  choice: 'Giữ số ít: “lòng họ”'
  alternative: “lòng của mỗi người trong họ” hoặc “những tấm lòng của họ”
  rationale: Nguyên văn dùng καρδία số ít để trình bày cả dân như một tập thể có chung khuynh hướng nội tâm. “Lòng họ” vừa tự nhiên trong tiếng Việt vừa không diễn giải thành từng cá nhân.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng cặp tương phản “môi miệng” và “lòng” để giữ sức nặng tu từ của câu. Đại từ “Ta” phù hợp với lời Đức Chúa Trời được trích dẫn trong ngữ cảnh Kinh Thánh tiếng Việt.
