revisions:
- from: Anh em không hiểu rằng mọi thứ vào miệng đều đi xuống bụng rồi bị thải ra nơi phóng uế[a] sao?
  to: Anh em không hiểu rằng mọi thứ đi vào miệng đều đi vào bụng rồi bị thải ra nhà tiêu[a] sao?
  rationale: Chỉ điều chỉnh “đi xuống” thành “đi vào” để phản ánh chính xác χωρεῖ εἰς (“đi vào”), và dùng “nhà tiêu” làm cách gọi hiện đại, tự nhiên cho ἀφεδρών; các cách gọi tương đương được giữ ở chú thích. Ý nghĩa, sắc thái câu hỏi chất vấn, và tính không-diễn-giải của bản dịch được bảo toàn.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T05:40:07Z'
review_pass:
  verdict: revise
  source_fidelity: Bản dịch phản ánh đúng câu hỏi tu từ, phạm vi khái quát của πᾶν τὸ εἰσπορευόμενον, và quá trình đi vào miệng, vào bụng, rồi bị bài xuất vào nơi bài tiết. Tuy nhiên, “đi xuống bụng” thêm sắc thái hướng xuống không được diễn đạt trong χωρεῖ, vốn ở đây là “đi/vào bụng”.
  naturalness: Câu văn nhìn chung tự nhiên, đúng văn phong Việt ngữ hiện đại. Đổi “đi xuống bụng” thành “đi vào bụng” vừa sát nguyên ngữ vừa mạch lạc. “Nhà tiêu” là cách gọi phổ thông, trung tính hơn “nơi phóng uế” trong câu chính; chú thích có thể nêu các cách gọi thay thế.
  terminology: “Hiểu,” “mọi thứ,” “bụng,” và “bị thải ra” phù hợp ngữ cảnh. Không thêm diễn giải về luật thực phẩm hay sự thanh sạch. Giữ “Anh em” là phù hợp với ngữ cảnh Đức Giê-su nói với các môn đồ, dù đại từ số nhiều không được nêu rõ trong động từ Hy Lạp.
