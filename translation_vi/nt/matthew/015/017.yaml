id: MAT.15.17
reference: Matthew 15:17
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸀οὐ νοεῖτε ὅτι πᾶν τὸ εἰσπορευόμενον εἰς τὸ στόμα εἰς τὴν κοιλίαν χωρεῖ καὶ εἰς ἀφεδρῶνα ἐκβάλλεται;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/017.yaml
  text: Do you not understand that everything entering into the mouth goes into the stomach and is expelled into the latrine?[a]
translation:
  language: vi
  text: Anh em không hiểu rằng mọi thứ đi vào miệng đều đi vào bụng rồi bị thải ra nhà tiêu[a] sao?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “nơi phóng uế,” “hố xí.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: νοεῖτε
  choice: hiểu
  rationale: Chỉ sự lĩnh hội bằng trí óc đối với điều Đức Giê-su đang dạy; “hiểu” tự nhiên và giữ được sắc thái chất vấn.
- source_word: πᾶν τὸ εἰσπορευόμενον
  choice: mọi thứ vào
  rationale: Kết cấu phân từ có mạo từ, giống trung số ít, mang nghĩa khái quát về bất cứ thứ gì đi vào qua việc ăn.
- source_word: εἰς τὸ στόμα
  choice: vào miệng
  rationale: Giữ trực tiếp ý chuyển động vào trong của εἰς và hình ảnh sinh lý trong câu.
- source_word: κοιλίαν
  choice: bụng
  rationale: Trong ngữ cảnh tiêu hóa, κοιλία chỉ phần bên trong bụng; “bụng” là cách nói tự nhiên, phổ thông và không đòi hỏi độ chính xác giải phẫu mà từ Hy Lạp không nhất thiết hàm ý.
- source_word: χωρεῖ
  choice: đi xuống
  rationale: Diễn đạt tự nhiên sự di chuyển của thức ăn từ miệng đến bụng; “xuống” phù hợp với hình ảnh cơ thể mà không thêm ý thần học.
- source_word: ἀφεδρῶνα
  choice: nơi phóng uế
  rationale: Chỉ nơi dùng để bài tiết, tương ứng với nhà tiêu/hố xí; lựa chọn này chính xác, trang trọng và tránh từ quá hiện đại hoặc thô.
- source_word: ἐκβάλλεται
  choice: bị thải ra
  rationale: Giữ thể bị động và ý bài xuất của quá trình tiêu hóa bằng cách diễn đạt rõ ràng, tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Mối liên hệ giữa lời này và luật thanh sạch nghi lễ
  choice: Dịch thẳng phát biểu về quá trình tiêu hóa, không thêm lời tuyên bố rằng mọi thức ăn đều thanh sạch.
  alternative: Mở rộng theo lối diễn giải rằng qua đó Đức Giê-su tuyên bố mọi thức ăn là thanh sạch.
  rationale: Câu này hỗ trợ lập luận về điều thực sự làm ô uế, nhưng bản Hy Lạp của Ma-thi-ơ 15:17 không có lời bình rõ như Mác 7:19; không nên đưa kết luận diễn giải ấy vào chính câu dịch.
translation_notes:
  register: Tiếng Việt hiện đại, phổ thông và trang trọng vừa phải. Dùng “anh em” cho chủ ngữ số nhiều ngầm trong νοεῖτε, phù hợp lời Đức Giê-su nói với các môn đồ trong ngữ cảnh. Cấu trúc câu hỏi kết bằng “sao?” giữ sắc thái trách nhẹ của câu hỏi Hy Lạp.
