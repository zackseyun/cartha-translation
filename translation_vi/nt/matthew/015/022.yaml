id: MAT.15.22
reference: Matthew 15:22
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ γυνὴ Χαναναία ἀπὸ τῶν ὁρίων ἐκείνων ἐξελθοῦσα ⸀ἔκραζεν λέγουσα· Ἐλέησόν με, κύριε ⸀υἱὸς Δαυίδ· ἡ θυγάτηρ μου κακῶς δαιμονίζεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/022.yaml
  text: And behold[a], a Canaanite woman from those regions came out and was crying out, saying, “Have mercy on me, Lord, Son of David; my daughter is badly demon-possessed.”
translation:
  language: vi
  text: 'Kìa, một người phụ nữ Ca-na-an từ vùng ấy đi ra, cứ kêu lên rằng: “Lạy Chúa, Con vua Đa-vít, xin thương xót tôi! Con gái tôi bị quỷ hành hạ dữ dội.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “bị quỷ ám nặng.”'
    reason: Bảo lưu cách hiểu truyền thống của δαιμονίζεται và sự tăng cường của κακῶς mà không buộc bản chính phải xác định chính xác tính chất của tác động ma quỷ.
lexical_decisions:
- source_word: ἰδοὺ
  choice: Kìa
  rationale: Giữ chức năng hướng sự chú ý và nét sống động của lời kể, đồng thời vẫn tự nhiên trong tiếng Việt hiện đại.
- source_word: Χαναναία
  choice: người phụ nữ Ca-na-an
  rationale: Dịch đúng cách gọi của Ma-thi-ơ, giữ âm hưởng lịch sử của dân Ca-na-an; không thay bằng “Sy-rô Phê-ni-xi” từ trình thuật song song trong Mác.
- source_word: ἀπὸ τῶν ὁρίων ἐκείνων
  choice: từ vùng ấy
  rationale: ὅρια trong ngữ cảnh chỉ địa phận hay vùng lãnh thổ. Cách dịch này tự nhiên và không buộc số nhiều hình thức của tiếng Hy Lạp vào tiếng Việt.
- source_word: ἐξελθοῦσα
  choice: đi ra
  rationale: Chuyển phân từ bất định quá khứ thành động từ nối tiếp tự nhiên trong lời kể; “đi ra” phù hợp với hướng nhìn của câu và không thêm địa điểm không có trong nguyên văn.
- source_word: ἔκραζεν
  choice: cứ kêu lên
  rationale: Diễn đạt thể chưa hoàn thành, gợi hành động đang tiếp diễn hoặc lặp lại, rõ hơn dạng đơn “kêu lên”.
- source_word: Ἐλέησόν με
  choice: xin thương xót tôi
  rationale: Giữ lời cầu xin khẩn thiết và từ vựng về lòng thương xót, với trật tự tự nhiên trong lời khẩn cầu tiếng Việt.
- source_word: κύριε
  choice: Lạy Chúa
  rationale: “Lạy” phù hợp với cách trực tiếp thưa gọi đầy tôn kính; “Chúa” giữ khả năng κύριε mang ý nghĩa cao hơn một lời xưng hô lịch sự trong liên kết với tước hiệu “Con vua Đa-vít”.
- source_word: υἱὸς Δαυίδ
  choice: Con vua Đa-vít
  rationale: Giữ tước hiệu Đa-vít và làm rõ Đa-vít là vua đối với độc giả phổ thông; “con” trong tước hiệu có thể chỉ hậu duệ chứ không nhất thiết là con trực tiếp.
- source_word: κακῶς
  choice: dữ dội
  rationale: Thể hiện mức độ nghiêm trọng của tình trạng, tự nhiên hơn cách ghép sát chữ như “bị quỷ ám một cách tồi tệ”.
- source_word: δαιμονίζεται
  choice: bị quỷ hành hạ
  rationale: Giữ rõ tác nhân ma quỷ nhưng tránh quy định quá mức hiện tượng là “chiếm hữu”; chú thích bảo lưu cách dịch truyền thống “bị quỷ ám”.
theological_decisions:
- issue: Cách dịch κύριε trong lời xưng hô gắn với tước hiệu Đa-vít
  choice: Lạy Chúa
  alternative: Thưa ngài
  rationale: Tước hiệu “Con vua Đa-vít” cho thấy lời xưng hô có thể mang sắc thái tôn kính và Mê-si-a hơn phép lịch sự thông thường. “Lạy Chúa” bảo lưu khả năng ấy nhưng tự câu này không khẳng định người phụ nữ đã có một tín điều hoàn chỉnh về thần tính của Đức Giê-su.
- issue: Mức độ xác định trong δαιμονίζεται
  choice: bị quỷ hành hạ
  alternative: bị quỷ ám
  rationale: Động từ quy tình trạng của cô gái cho tác động của quỷ nhưng không tự nó mô tả chính xác cơ chế hay mức độ kiểm soát. Bản chính tránh thu hẹp nghĩa; cách nói truyền thống được nêu trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Kìa” để giữ dấu hiệu hướng sự chú ý; “cứ kêu lên” giữ tính tiếp diễn. Lời khẩn cầu được sắp xếp theo trật tự tự nhiên của tiếng Việt. Mọi chú thích đều có dấu tương ứng trong chính văn.
