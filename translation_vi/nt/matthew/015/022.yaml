  source_fidelity: 'Bản dịch bám sát SBLGNT: «Kìa» phản ánh ἰδοὺ; «người phụ nữ Ca-na-an» giữ đúng cách gọi riêng của Ma-thi-ơ; «từ vùng ấy đi ra» phản ánh ἀπὸ τῶν ὁρίων ἐκείνων ἐξελθοῦσα; «cứ kêu lên» truyền đạt sắc thái chưa hoàn thành của ἔκραζεν. Lời cầu xin và tước hiệu được giữ đầy đủ. «Bị quỷ hành hạ dữ dội» diễn đạt hợp lý δαιμονίζεται cùng κακῶς mà không khẳng định chi tiết cơ chế vượt quá câu Hy Lạp.'
