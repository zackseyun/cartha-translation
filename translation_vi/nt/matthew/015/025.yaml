  yaml_path: translation/nt/matthew/015/025.yaml
  text: But she came and knelt before him[a], saying, “Lord, help me.”
translation:
  language: vi
  text: 'Nhưng bà đến quỳ trước mặt Ngài[a] và thưa: “Lạy Chúa, xin giúp tôi!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “thờ lạy Ngài.” Động từ Hy Lạp có thể chỉ việc cúi mình tôn kính, bày tỏ lòng thần phục hoặc thờ lạy, tùy theo văn cảnh.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Nhưng
  rationale: Diễn tả sự tương phản nhẹ với lời đáp trước đó và làm nổi bật việc bà vẫn kiên trì cầu xin.
- source_word: ἐλθοῦσα
  choice: bà đến
  rationale: Chuyển phân từ bất định quá khứ thành động từ hữu hạn tự nhiên trong tiếng Việt, vẫn giữ ý bà tiến đến gần Chúa Giê-su.
- source_word: προσεκύνει αὐτῷ
  choice: quỳ trước mặt Ngài
  rationale: Động từ προσκυνέω có thể chỉ hành động phủ phục, bày tỏ lòng tôn kính hoặc thờ lạy. Cách dịch này thể hiện tư thế kính cẩn mà không xác định quá mức nhận thức thần học của người phụ nữ; nghĩa “thờ lạy Ngài” được giữ trong chú thích.
- source_word: λέγουσα
  choice: và thưa
  rationale: “Thưa” là cách dẫn lời tự nhiên, phù hợp với thái độ kính trọng của người phụ nữ khi nói với Chúa Giê-su.
- source_word: Κύριε
  choice: Lạy Chúa
  rationale: Giữ cách xưng hô trang trọng và có sức nặng của κύριος; “lạy” phù hợp với lời khẩn cầu trực tiếp trong tiếng Việt.
- source_word: βοήθει μοι
  choice: xin giúp con
  rationale: Giữ lời cầu xin ngắn gọn, trực tiếp và khẩn thiết. Đại từ “con” tự nhiên trong lời cầu khẩn kính cẩn với Đấng được gọi là Chúa.
theological_decisions:
- issue: Cách dịch προσκυνέω khi đối tượng là Chúa Giê-su
  choice: quỳ trước mặt Ngài
  alternative: thờ lạy Ngài
  rationale: Nguyên ngữ có thể nói đến hành động phủ phục tôn kính hoặc sự thờ lạy. Bản chính giữ hành động hữu hình mà không khép lại hàm ý thần học; chú thích bảo lưu cách hiểu mạnh hơn vốn cũng phù hợp với cách dùng trong Ma-thi-ơ.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “bà” cho người phụ nữ và viết hoa “Ngài”, “Chúa” theo lối văn Kinh Thánh phổ thông; lời cầu xin được diễn đạt ngắn gọn, khẩn thiết.
