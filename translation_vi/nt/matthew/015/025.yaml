review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch phản ánh đúng diễn tiến chính: người phụ nữ đến, thực hiện một cử chỉ kính cẩn trước Chúa Giê-su, rồi khẩn cầu. «Quỳ trước mặt Ngài» là cách diễn đạt thận trọng, không áp đặt nghĩa thần học duy nhất cho προσκυνέω; chú thích bảo lưu cách dịch «thờ lạy». Tuy nhiên, «xin giúp con» thêm quan hệ xưng hô con–Chúa mà μοι chỉ nói đơn giản là «tôi/mình».'
  naturalness: Câu văn trang trọng, rõ ràng và tự nhiên trong tiếng Việt hiện đại. «Lạy Chúa, xin giúp tôi!» vẫn là lời khẩn cầu kính trọng, tự nhiên, đồng thời sát với đại từ ngôi thứ nhất số ít của nguyên ngữ hơn.
  terminology: «Chúa» cho Κύριε và «Ngài» phù hợp với quy ước Kinh Thánh Việt ngữ. Chú thích về «thờ lạy» nêu đúng dải nghĩa liên quan của προσκυνέω trong ngữ cảnh này.
  issues:
  - severity: medium
    issue: «xin giúp con» thêm đại từ quan hệ không có trong μοι.
    rationale: μού/μοι chỉ có nghĩa «tôi, cho tôi». Trong văn phong cầu nguyện, «con» có thể tự nhiên, nhưng nó xác định người nói theo quan hệ con cái với Chúa, một sắc thái không được phát biểu trong câu Hy Lạp. «Tôi» giữ nguyên độ mở của nguyên ngữ mà vẫn lịch sự sau «Lạy Chúa».
  revised_text: 'Nhưng bà đến quỳ trước mặt Ngài[a] và thưa: “Lạy Chúa, xin giúp tôi!”'
