  text: καὶ λέγουσιν αὐτῷ οἱ ⸀μαθηταί· Πόθεν ἡμῖν ἐν ἐρημίᾳ ἄρτοι τοσοῦτοι ὥστε χορτάσαι ὄχλον τοσοῦτον;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/033.yaml
  text: And the disciples said to him[c][b][a], “Where could we get enough bread in this desolate place to satisfy so large a crowd?”
translation:
  language: vi
  text: 'Các môn đồ thưa với Ngài: “Ở nơi hoang vắng này, chúng ta lấy đâu ra đủ bánh để cho một đám đông lớn như vậy ăn no?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγουσιν
  choice: thưa
  rationale: Thì hiện tại lịch sử được diễn đạt tự nhiên trong lối kể tiếng Việt; “thưa” phù hợp khi các môn đồ nói với Chúa Giê-su mà không làm thay đổi nội dung.
- source_word: οἱ μαθηταί
  choice: các môn đồ
  rationale: Mạo từ xác định chỉ nhóm môn đồ đã được biết trong ngữ cảnh; không thêm “của Ngài” vì nguyên văn không nói rõ.
- source_word: Πόθεν ἡμῖν
  choice: chúng ta lấy đâu ra
  rationale: Diễn đạt tự nhiên câu hỏi về nguồn cung cấp, đồng thời thể hiện đại từ ngôi thứ nhất số nhiều trong ἡμῖν.
- source_word: ἐν ἐρημίᾳ
  choice: ở nơi hoang vắng này
  rationale: ἐρημία chỉ một nơi vắng vẻ, ít hoặc không có người ở; “này” được thêm theo tình huống trực tiếp để câu tiếng Việt tự nhiên.
- source_word: ἄρτοι τοσοῦτοι
  choice: đủ bánh
  rationale: Dù sát chữ là “nhiều ổ bánh đến thế”, trong câu hỏi này cụm từ nói đến số lượng bánh đủ cho nhu cầu; cách dịch giữ rõ ý lượng thực phẩm cần thiết.
- source_word: ὥστε χορτάσαι
  choice: để ... ăn no
  rationale: χορτάζω trong ngữ cảnh thực phẩm có nghĩa cho ăn đến no; cách dịch này cụ thể và tự nhiên hơn “làm thỏa mãn”.
- source_word: ὄχλον τοσοῦτον
  choice: một đám đông lớn như vậy
  rationale: Giữ danh từ tập hợp ὄχλος và sắc thái nhấn mạnh quy mô của τοσοῦτον bằng lối nói tự nhiên trong tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “môn đồ” theo thuật ngữ Kinh Thánh quen thuộc; “Ngài” giữ sắc thái tôn kính. Câu hỏi vẫn thể hiện sự bất khả thi mà các môn đồ cảm nhận, không thêm lời giải thích thần học.
