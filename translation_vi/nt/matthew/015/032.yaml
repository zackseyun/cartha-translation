id: MAT.15.32
reference: Matthew 15:32
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ὁ δὲ Ἰησοῦς προσκαλεσάμενος τοὺς μαθητὰς αὐτοῦ εἶπεν· Σπλαγχνίζομαι ἐπὶ τὸν ὄχλον, ὅτι ἤδη ἡμέραι τρεῖς προσμένουσίν μοι καὶ οὐκ ἔχουσιν τί φάγωσιν· καὶ ἀπολῦσαι αὐτοὺς νήστεις οὐ θέλω, μήποτε ἐκλυθῶσιν ἐν τῇ ὁδῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/032.yaml
  text: Then Jesus called his disciples to him and said[a], “I have compassion on the crowd, because they have already remained with me for three days and have nothing to eat. And I do not want to send them away hungry[d][c][b], lest they collapse on the way.”
translation:
  language: vi
  text: 'Giê-su gọi các môn đồ đến với mình và nói: “Ta thương xót đám đông[a], vì họ đã ở với ta ba ngày rồi mà không có gì ăn. Ta không muốn cho họ ra về khi còn đói[b], e rằng họ sẽ kiệt sức dọc đường[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Ta động lòng thương xót đám đông.”'
    reason: lexical_alternative
  - marker: b
    text: Từ Hy Lạp có nghĩa đen là “đang nhịn ăn” hoặc “không có thức ăn”; ở đây nói đến việc họ chưa được ăn, không nhất thiết là một kỳ kiêng ăn vì lý do tôn giáo.
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể dịch: “e rằng họ sẽ lả đi dọc đường” hoặc “ngất xỉu dọc đường.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: gọi ... đến
  rationale: Diễn đạt tự nhiên hành động Chúa Giê-su gọi các môn đồ đến với mình, giữ được sắc thái hướng về người gọi của dạng trung động.
- source_word: Σπλαγχνίζομαι
  choice: Ta thương xót
  rationale: Động từ diễn tả lòng trắc ẩn sâu xa; “thương xót” vừa trang trọng vừa dễ hiểu trong tiếng Việt hiện đại.
- source_word: ὄχλον
  choice: dân chúng
  rationale: Phù hợp với một số đông người tụ họp quanh Chúa Giê-su và tự nhiên hơn “đoàn dân” trong văn cảnh này.
- source_word: ἤδη ἡμέραι τρεῖς προσμένουσίν μοι
  choice: họ đã ở với ta ba ngày rồi
  rationale: Giữ ý họ tiếp tục ở lại với Chúa Giê-su trong ba ngày; “rồi” chuyển tải tự nhiên sắc thái ἤδη.
- source_word: τί φάγωσιν
  choice: không có gì ăn
  rationale: Đây là cách diễn đạt tiếng Việt tự nhiên cho thành ngữ Hy Lạp chỉ việc không có thức ăn.
- source_word: ἀπολῦσαι
  choice: để ... ra về
  rationale: Trong bối cảnh giải tán dân chúng, cách dịch này tự nhiên hơn “thả” hay “giải phóng”.
- source_word: νήστεις
  choice: nhịn đói
  rationale: Cho biết họ ra về khi chưa được ăn, không hàm ý họ đang thực hành một kỳ kiêng ăn tôn giáo.
- source_word: μήποτε ἐκλυθῶσιν
  choice: e rằng họ sẽ kiệt sức
  rationale: “E rằng” bảo toàn sắc thái kết quả đáng lo ngại; “kiệt sức” diễn tả việc suy nhược hoặc lả đi trên đường mà không cường điệu thành chắc chắn ngã quỵ.
- source_word: ἐν τῇ ὁδῷ
  choice: dọc đường
  rationale: Cách nói tự nhiên, chỉ lúc họ đang trên đường trở về.
theological_decisions: []
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “Chúa Giê-su”, “các môn đồ” và đại từ “Ta” phù hợp lời phán trong văn thuật Kinh Thánh; tránh thuật ngữ giáo phái riêng. Các câu ngắn, tự nhiên, đồng thời giữ quan hệ nguyên nhân và sắc thái lo ngại của bản Hy Lạp.
