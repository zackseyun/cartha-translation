revisions:
- from: 'Bấy giờ, Chúa Giê-su gọi các môn đồ đến và phán: “Ta thương xót dân chúng[a], vì họ đã ở với ta ba ngày rồi mà không có gì ăn. Ta không muốn để họ nhịn đói mà ra về[b], e rằng họ sẽ kiệt sức dọc đường[c].”'
  to: 'Giê-su gọi các môn đồ đến với mình và nói: “Ta thương xót đám đông[a], vì họ đã ở với ta ba ngày rồi mà không có gì ăn. Ta không muốn cho họ ra về khi còn đói[b], e rằng họ sẽ kiệt sức dọc đường[c].”'
  rationale: 'Sửa tối thiểu để bám sát bản Hy Lạp: bỏ tước hiệu không có trong câu nguồn; bổ sung «với mình» để phản ánh προσκαλεσάμενος; và đổi cấu trúc giải tán đám đông thành «cho họ ra về khi còn đói». Các chú thích được giữ đúng vị trí neo và điều chỉnh chú thích a cho tự nhiên hơn.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T05:40:12Z'
