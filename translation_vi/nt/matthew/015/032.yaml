  source_fidelity: Cần sửa để không thêm tước hiệu «Chúa» vào tên Ἰησοῦς, đồng thời diễn đạt rõ hướng «gọi ... đến với mình» của προσκαλεσάμενος và hành động chủ động «cho/để họ ra về» của ἀπολῦσαι. Các ý còn lại, gồm ba ngày, thiếu thức ăn và nỗi lo họ kiệt sức trên đường, được giữ đúng.
  naturalness: 'Bản sửa dùng tiếng Việt hiện đại, tự nhiên: «gọi các môn đồ đến với mình», «đám đông», «khi còn đói», và «dọc đường». «Ta» vẫn phù hợp với lời nói trực tiếp trong văn phong Kinh Thánh trang trọng.'
  terminology: Dùng «Giê-su» theo đúng tên riêng trong nguồn Hy Lạp, không thêm tước hiệu không có trong câu. «Môn đồ», «thương xót», và «đám đông» là những cách dùng rõ ràng, không mang sắc thái giáo phái riêng.
