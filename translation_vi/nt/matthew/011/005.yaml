id: MAT.11.5
reference: Matthew 11:5
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: τυφλοὶ ἀναβλέπουσιν καὶ χωλοὶ περιπατοῦσιν, λεπροὶ καθαρίζονται καὶ κωφοὶ ἀκούουσιν, ⸀καὶ νεκροὶ ἐγείρονται καὶ πτωχοὶ εὐαγγελίζονται·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/005.yaml
  text: The blind receive sight and the lame walk[a], lepers are cleansed and the deaf hear[b], and the dead are raised and the poor have good news proclaimed to them.
translation:
  language: vi
  text: Người mù thấy được, người què đi được, người mắc bệnh phong được thanh sạch, người điếc nghe được, người chết được sống lại, và người nghèo được loan báo tin mừng[a].[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “người nghèo được rao giảng Tin Mừng.” Động từ Hy Lạp ở dạng bị động, theo nghĩa đen là họ “được đem tin mừng đến cho.”'
    reason: lexical_alternative
  - marker: b
    text: Danh sách này gợi lại Ê-sai 35:5–6 và 61:1, nêu những dấu hiệu gắn với công việc của Đấng Mê-si-a.
    reason: cross_reference
lexical_decisions:
- source_word: τυφλοὶ ἀναβλέπουσιν
  choice: người mù thấy được
  rationale: Diễn đạt tự nhiên việc người mù nhận lại hoặc nhận được thị lực trong bối cảnh chữa lành, thay vì nghĩa đen không phù hợp là “ngước nhìn”.
- source_word: χωλοὶ περιπατοῦσιν
  choice: người què đi được
  rationale: Giữ lối liệt kê ngắn gọn của nguyên văn và diễn tả khả năng đi lại được phục hồi.
- source_word: λεπροὶ καθαρίζονται
  choice: người mắc bệnh phong được thanh sạch
  rationale: “Người mắc bệnh phong” là cách gọi hiện đại, tôn trọng con người; “được thanh sạch” giữ sắc thái vừa thể chất vừa thanh sạch theo nghi lễ của καθαρίζονται, thay vì thu hẹp thành “được chữa lành”.
- source_word: κωφοὶ ἀκούουσιν
  choice: người điếc nghe được
  rationale: Trong sự kết hợp với ἀκούουσιν, κωφοὶ rõ ràng chỉ người điếc; “nghe được” diễn tả khả năng được phục hồi một cách tự nhiên.
- source_word: νεκροὶ ἐγείρονται
  choice: người chết được sống lại
  rationale: Giữ dạng tiếp nhận hành động của động từ Hy Lạp và ý nghĩa được làm cho sống lại, bằng cách diễn đạt quen thuộc, trang trọng trong tiếng Việt.
- source_word: πτωχοὶ εὐαγγελίζονται
  choice: người nghèo được loan báo tin mừng
  rationale: Giữ người nghèo là đối tượng tiếp nhận việc công bố tin mừng, phản ánh dạng bị động của động từ và tránh biến động từ thành thuật ngữ giáo hội chuyên biệt.
theological_decisions:
- issue: Cách dịch εὐαγγελίζονται và quan hệ với thuật ngữ “Tin Mừng”
  choice: được loan báo tin mừng
  alternative: được rao giảng Tin Mừng; được nghe tin mừng
  rationale: Cách dịch được chọn giữ dạng bị động và nghĩa công bố tin tốt lành, nhưng không mặc nhiên thu hẹp cụm từ thành một thuật ngữ giáo hội về sau. Chữ thường cũng bảo tồn sắc thái ngôn ngữ thông thường của danh ý hàm chứa trong động từ.
- issue: Danh sách phép lạ như dấu hiệu về công việc của Đấng Mê-si-a
  choice: Giữ nguyên các lời xác nhận trực tiếp, không thêm ngôn ngữ “ứng nghiệm” vào câu chính
  alternative: Thêm lời giải thích rằng những việc này ứng nghiệm lời Ê-sai
  rationale: Câu Hy Lạp gợi rõ Ê-sai 35:5–6 và 61:1 nhưng không tự thêm một mệnh đề giải nghĩa về sự ứng nghiệm; mối liên hệ được nêu trong chú thích để không giải quyết thay cho người đọc điều nguyên văn chỉ gợi lên.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu; các vế song song, ngắn gọn, theo nhịp liệt kê của nguyên văn. Dùng “người mắc bệnh phong” thay cho cách gọi dễ gây kỳ thị. “Được thanh sạch” có chủ ý giữ đồng thời sắc thái chữa lành và thanh sạch theo nghi lễ.
