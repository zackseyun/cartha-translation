source:
  edition: SBLGNT
  text: πλὴν λέγω ὑμῖν ὅτι γῇ Σοδόμων ἀνεκτότερον ἔσται ἐν ἡμέρᾳ κρίσεως ἢ σοί.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/024.yaml
  text: But I tell you that it will be more tolerable for the land of Sodom on the day of judgment than for you[a].
translation:
  language: vi
  text: 'Nhưng Ta bảo các ngươi: Vào ngày phán xét, đất Sô-đôm sẽ dễ chịu hơn ngươi.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “có thể chịu đựng được hơn.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: πλὴν
  choice: Nhưng
  rationale: Trong ngữ cảnh, từ này đánh dấu sự tương phản mạnh và chuyển sang lời tuyên bố nghiêm trọng; “Nhưng” tự nhiên và chính xác trong tiếng Việt hiện đại.
- source_word: λέγω ὑμῖν
  choice: Ta nói với ngươi
  rationale: Cụm Hy Lạp có đại từ số nhiều, nhưng đối tượng đang được trực tiếp gọi như một thành phố ở số ít trong mạch văn; tiếng Việt dùng “Ta” cho lời Đức Giê-su và “ngươi” để duy trì giọng phán truyền cùng cách nhân cách hóa địa danh.
- source_word: γῇ Σοδόμων
  choice: đất Sô-đôm
  rationale: Giữ danh từ γῇ, chỉ vùng đất gắn với Sô-đôm, thay vì rút gọn thành tên thành phố.
- source_word: ἀνεκτότερον
  choice: dễ chịu hơn
  rationale: Diễn đạt mức độ có thể chịu đựng được trong bối cảnh phán xét bằng tiếng Việt tự nhiên; “dễ chịu hơn” không hàm ý ngày phán xét là dễ dàng, mà là mức án ít khắc nghiệt hơn khi so sánh.
- source_word: ἔσται
  choice: sẽ
  rationale: Thể hiện rõ thì tương lai của động từ εἰμί trong cấu trúc vị ngữ tiếng Việt.
- source_word: ἐν ἡμέρᾳ κρίσεως
  choice: Trong ngày phán xét
  rationale: Bám sát cấu trúc chỉ thời gian của nguyên văn và dùng thuật ngữ thần học phổ thông, dễ hiểu.
- source_word: ἢ σοί
  choice: hơn ngươi
  rationale: Giữ đại từ số ít của σοί và lời nói trực tiếp với thành phố được nhân cách hóa, không diễn giải thành cư dân hay tập thể.
theological_decisions:
- issue: Đối tượng của đại từ số ít σοί
  choice: Giữ “ngươi” ở số ít, chỉ thành phố được nhân cách hóa trong mạch văn.
  alternative: Diễn giải là “các ngươi” hoặc “dân thành ngươi”.
  rationale: Nguyên văn dùng số ít và tiếp nối lối phán truyền trực tiếp với một thành phố; giữ số ít bảo toàn sức tu từ và không áp đặt cách giải thích.
- issue: Ý nghĩa so sánh trong sự phán xét
  choice: Giữ lời so sánh “dễ chịu hơn” mà không giải thích thành các cấp độ hình phạt cụ thể.
  alternative: Diễn giải rõ là “bị hình phạt nhẹ hơn”.
  rationale: Nguyên văn khẳng định một sự so sánh nhưng không trình bày cơ chế hay cấp độ hình phạt; bản dịch nên giữ nguyên sức căng thần học đó.
translation_notes:
  register: Văn phong hiện đại, trang trọng và mang sắc thái phán truyền. “Ta/ngươi” được dùng vì Đức Giê-su đang trực tiếp nói với một thành phố được nhân cách hóa; dấu hai chấm làm rõ phần nội dung của lời tuyên bố. Mọi dấu chú thích đều có trong chính văn.
