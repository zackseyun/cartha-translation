  to: 'Nhưng Ta bảo các ngươi: Vào ngày phán xét, đất Sô-đôm sẽ dễ chịu hơn ngươi.[a]'
  rationale: Sửa người nghe của λέγω ὑμῖν thành số nhiều (“các ngươi”), đồng thời giữ số ít “ngươi” ở cuối câu cho σοί và do đó bảo toàn sự chuyển đổi có chủ ý trong nguyên văn. Thêm “sẽ” cho ἔσται và dùng “Vào ngày phán xét” cho cách diễn đạt thời gian tự nhiên. Không diễn giải phép so sánh thành các mức độ hình phạt cụ thể.
