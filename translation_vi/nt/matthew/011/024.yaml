review_pass:
  verdict: revise
  source_fidelity: Bản nháp giữ đúng đối lập πλὴν, cụm chỉ thời điểm phán xét, hình ảnh “đất Sô-đôm”, và đại từ số ít ở vế so sánh cuối, vốn hướng đến thành phố được nhân cách hóa. Tuy nhiên, λέγω ὑμῖν có người nghe số nhiều, không phải số ít; vì vậy “Ta nói với ngươi” không phản ánh nguyên văn. Bản nháp cũng không thể hiện tương lai của ἔσται trong chính văn.
  naturalness: “Đất Sô-đôm sẽ dễ chịu hơn ngươi” là một lối diễn đạt trang trọng, quen thuộc trong văn phong Kinh Thánh tiếng Việt, dù mang tính rút gọn; nó truyền đạt phép so sánh về mức độ có thể chịu đựng được mà không diễn giải thêm. “Vào ngày phán xét” tự nhiên hơn “Trong ngày phán xét” trong tiếng Việt hiện đại.
  terminology: Giữ “phán xét” là thuật ngữ phù hợp. Giữ “Ta/ngươi” bảo toàn sắc thái lời phán truyền và đại từ số ít cuối câu; nhưng phải dùng “các ngươi” ở lời dẫn nhập để phản ánh ὑμῖν số nhiều. “Dễ chịu hơn” có thể giữ trong chính văn; chú thích nên nêu phương án sát nghĩa hơn là “có thể chịu đựng được hơn.”
  issues:
  - severity: medium
    issue: “Ta nói với ngươi” dịch sai số của ὑμῖν.
    rationale: 'Ὑμῖν là cách số nhiều: Đức Giê-su nói với nhóm người nghe, trong khi μόνο σοί ở cuối câu là số ít, chỉ thành phố được nhân cách hóa theo ngữ cảnh.'
  - severity: medium
    issue: Chính văn thiếu từ chỉ tương lai cho ἔσται.
    rationale: Bản giải trình chọn “sẽ”, nhưng câu dịch hiện tại không có “sẽ”; cần biểu thị rõ tương lai của động từ Hy Lạp.
  - severity: low
    issue: Chú thích “dễ chịu đựng hơn” không tự nhiên.
    rationale: Cụm “có thể chịu đựng được hơn” là phương án tiếng Việt rõ ràng hơn cho ἀνεκτότερον.
