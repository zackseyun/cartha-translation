id: MAT.11.12
reference: Matthew 11:12
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀπὸ δὲ τῶν ἡμερῶν Ἰωάννου τοῦ βαπτιστοῦ ἕως ἄρτι ἡ βασιλεία τῶν οὐρανῶν βιάζεται, καὶ βιασταὶ ἁρπάζουσιν αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/012.yaml
  text: But from the days of John the Baptist until now[a], the kingdom of heaven suffers violence, and violent men seize it.
translation:
  language: vi
  text: Nhưng từ thời Giăng Báp-tít cho đến nay, vương quốc thiên đàng đang phải chịu bạo lực, và những kẻ bạo lực cướp lấy nó.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “vương quốc thiên đàng đang mạnh mẽ tiến lên, và những người mạnh mẽ nắm lấy nó.” Động từ Hy Lạp được dịch là “đang phải chịu bạo lực” cũng có thể được hiểu theo nghĩa trung động.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπὸ δὲ
  choice: Nhưng từ
  rationale: ἀπό nêu mốc khởi đầu, còn δέ là liên từ chuyển ý nhẹ; “Nhưng từ” giữ được sự chuyển ý mà không nhấn mạnh sự đối lập quá mức.
- source_word: τῶν ἡμερῶν Ἰωάννου τοῦ βαπτιστοῦ
  choice: thời Giăng Báp-tít
  rationale: Cách nói này tự nhiên trong tiếng Việt hiện đại và diễn đạt đúng khoảng thời gian gắn với chức vụ của Giăng; dịch sát là “những ngày của Giăng Báp-tít” kém tự nhiên hơn.
- source_word: ἕως ἄρτι
  choice: cho đến nay
  rationale: Cách diễn đạt thông dụng, giữ ý liên tục từ thời Giăng đến thời điểm Chúa Giê-su đang nói.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: vương quốc thiên đàng
  rationale: Giữ cách diễn đạt đặc trưng của Ma-thi-ơ và biểu thị vương quyền hay vương quốc có nguồn gốc từ trời, không diễn giải thêm theo một hệ phái.
- source_word: βιάζεται
  choice: phải chịu bạo lực
  rationale: Dạng trung động/bị động có thể được hiểu theo nghĩa bị động hoặc trung động. Bản văn chính chọn nghĩa bị động, phù hợp tự nhiên với mệnh đề kế tiếp, nhưng ghi nhận nghĩa khác trong chú thích.
- source_word: βιασταὶ
  choice: những kẻ bạo lực
  rationale: Danh từ chỉ những người dùng sức mạnh hoặc bạo lực. “Những kẻ bạo lực” giữ sắc thái tiêu cực của cách hiểu bị động trong bản văn chính mà không thêm giới tính không cần thiết trong tiếng Việt.
- source_word: ἁρπάζουσιν αὐτήν
  choice: chiếm lấy nó
  rationale: ἁρπάζω chỉ hành động đoạt hoặc giành lấy bằng sức mạnh. “Chiếm lấy” ngắn gọn, tự nhiên và vẫn giữ sắc thái cưỡng đoạt.
theological_decisions:
- issue: Cách hiểu βιάζεται đối với vương quốc thiên đàng
  choice: 'Nghĩa bị động trong bản văn chính: “vương quốc thiên đàng phải chịu bạo lực”'
  alternative: 'Nghĩa trung động/nội động: “vương quốc thiên đàng đang mạnh mẽ tiến tới, và những người mạnh mẽ nắm lấy nó”'
  rationale: Câu Hy Lạp thực sự mơ hồ và từ lâu có nhiều cách giải thích. Nghĩa bị động liên kết chặt chẽ với “những kẻ bạo lực chiếm lấy nó”, còn nghĩa trung động cũng có cơ sở từ vựng và ngữ pháp đáng kể. Vì vậy, bản chính chọn một cách hiểu có căn cứ và bảo lưu cách kia trong chú thích.
translation_notes:
  register: Văn phong trang trọng vừa phải, tự nhiên và dễ hiểu trong tiếng Việt hiện đại. Dùng “Giăng Báp-tít” theo lối gọi quen thuộc; dùng “vương quốc thiên đàng” để giữ danh từ βασιλεία và cách nói đặc trưng của Ma-thi-ơ. Đại từ “nó” có tiền ngữ rõ là “vương quốc thiên đàng”.
