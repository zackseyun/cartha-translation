review_pass:
  verdict: revise
  source_fidelity: Bản dịch giữ đúng mốc thời gian, chủ ngữ “vương quốc thiên đàng”, và cách hiểu bị động có cơ sở của βιάζεται. Tuy nhiên, “chiếm lấy” có thể nghiêng về chiếm đóng/chiếm hữu hơn là sắc thái giật lấy, đoạt lấy của ἁρπάζουσιν. Thêm “đang” cũng biểu đạt rõ hơn thì hiện tại của βιάζεται.
  naturalness: “Đang phải chịu bạo lực” tự nhiên và rõ nghĩa hơn “phải chịu bạo lực” trong tiếng Việt hiện đại. “Cướp lấy” diễn đạt rõ hành động cưỡng đoạt, phù hợp với ngữ cảnh và động từ Hy Lạp.
  terminology: “Giăng Báp-tít” và “vương quốc thiên đàng” nhất quán với lựa chọn thuật ngữ của bản thảo. Chú thích vẫn bảo lưu đúng sự mơ hồ trung động/bị động, không áp đặt cách giải thích giáo phái.
  issues:
  - severity: low
    issue: Thì hiện tại của βιάζεται chưa được biểu thị rõ trong bản chính.
    rationale: “Phải chịu bạo lực” có thể dùng như hiện tại khái quát trong tiếng Việt, nhưng “đang phải chịu bạo lực” phản ánh trực tiếp hơn hiện tại đang diễn ra của động từ Hy Lạp mà vẫn không giải quyết sự mơ hồ ngữ pháp.
  - severity: medium
    issue: “Chiếm lấy” chưa chuyển tải đầy đủ lực nghĩa của ἁρπάζω.
    rationale: Ἁρπάζω chỉ việc giật, cướp, đoạt bằng sức mạnh. “Cướp lấy” tự nhiên hơn ở đây và giữ được sắc thái mạnh của động từ, trong khi “chiếm lấy” có thể gợi việc chiếm đóng hoặc giành quyền sở hữu nói chung.
