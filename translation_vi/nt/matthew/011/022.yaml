  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: πλὴν λέγω ὑμῖν, Τύρῳ καὶ Σιδῶνι ἀνεκτότερον ἔσται ἐν ἡμέρᾳ κρίσεως ἢ ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/022.yaml
  text: But I tell you[a], it will be more tolerable for Tyre and Sidon on the day of judgment than for you.
translation:
  language: vi
  text: 'Nhưng Ta bảo các ngươi: Trong ngày phán xét, Ty-rơ và Si-đôn sẽ chịu đựng được dễ hơn[a] các ngươi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “sẽ có thể chịu đựng được hơn.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: πλὴν
  choice: Nhưng
  rationale: Diễn tả rõ sự tương phản mạnh với lời quở trách ở phần trước, đồng thời tự nhiên trong tiếng Việt hiện đại.
- source_word: λέγω ὑμῖν
  choice: Ta bảo các ngươi
  rationale: Giữ lời nói trực tiếp, sắc thái trang trọng và đại từ số nhiều của nguyên văn. Cách xưng hô này phù hợp với lời Đức Giê-su trong văn phong Kinh Thánh trang nghiêm.
- source_word: Τύρῳ καὶ Σιδῶνι
  choice: Ty-rơ và Si-đôn
  rationale: Giữ nguyên hai địa danh; quan hệ lợi-hại của cách dative được thể hiện qua cấu trúc so sánh trong toàn câu.
- source_word: ἀνεκτότερον
  choice: dễ chịu đựng hơn
  rationale: Diễn đạt nghĩa so sánh của điều có thể chịu nổi mà không chuyển thành ‘bị phạt nhẹ hơn’, vốn sẽ xác định cụ thể một hệ quả không được nói thẳng trong nguyên văn.
- source_word: ἔσται
  choice: sẽ
  rationale: Thể hiện thì tương lai của động từ Hy Lạp một cách gọn và tự nhiên trong cấu trúc tiếng Việt.
- source_word: ἐν ἡμέρᾳ κρίσεως
  choice: Trong ngày phán xét
  rationale: Giữ hình ảnh về ngày xét xử mang tính cánh chung, không thu hẹp κρίσις thành riêng kết án hay hình phạt.
- source_word: ἢ ὑμῖν
  choice: hơn các ngươi
  rationale: Hoàn tất phép so sánh và giữ rõ đại từ số nhiều chỉ những người đang được nói đến.
theological_decisions:
- issue: Bản chất của sự phán xét sắp đến
  choice: ngày phán xét
  alternative: một ngày phán xét
  rationale: Dù cụm Hy Lạp không có mạo từ, ngữ cảnh Ma-thi-ơ hướng đến ngày phán xét cánh chung đã được nhận biết. Cách dịch này không thêm chi tiết về hình thức hay kết quả của sự phán xét.
- issue: Ý nghĩa của mức độ so sánh trong phán xét
  choice: dễ chịu đựng hơn
  alternative: chịu hình phạt nhẹ hơn
  rationale: Nguyên văn nói điều đó sẽ ‘có thể chịu nổi hơn’ đối với Ty-rơ và Si-đôn, nhưng không trực tiếp dùng từ ‘hình phạt’. Bản dịch giữ nguyên độ mở và sự căng thẳng thần học ấy.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và dễ hiểu. Dùng “Ta—các ngươi” để giữ sắc thái long trọng của lời Đức Giê-su và số nhiều của ὑμῖν; tránh cách diễn giải giáo phái hoặc bổ sung khái niệm ‘hình phạt’ vào câu chính.
