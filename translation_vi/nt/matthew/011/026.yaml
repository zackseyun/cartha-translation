  text: ναί, ὁ πατήρ, ὅτι οὕτως ⸂εὐδοκία ἐγένετο⸃ ἔμπροσθέν σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/026.yaml
  text: Yes[a], Father, because this was pleasing in your sight.
translation:
  language: vi
  text: Vâng[a], thưa Cha, vì điều này đẹp ý Cha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Quả vậy.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ναί
  choice: Vâng
  rationale: Diễn đạt lời xác nhận và thuận tình trong lời cầu nguyện một cách tự nhiên, kính trọng.
- source_word: ὁ πατήρ
  choice: thưa Cha
  rationale: Danh từ có mạo từ được dùng như lời xưng hô. “Thưa Cha” tự nhiên trong tiếng Việt hiện đại và giữ sắc thái tôn kính mà không cổ hóa.
- source_word: ὅτι
  choice: vì
  rationale: 'Giữ ý nghĩa nguyên nhân: lời tiếp theo nêu lý do cho sự xác nhận của Đức Giê-su.'
- source_word: οὕτως
  choice: điều này
  rationale: Chỉ về cách Đức Chúa Cha giấu và bày tỏ những điều vừa được nhắc đến; cách diễn đạt này tự nhiên hơn “như vậy” trong cấu trúc câu tiếng Việt.
- source_word: εὐδοκία ἐγένετο
  choice: đẹp ý
  rationale: Thành ngữ tiếng Việt gọn và tự nhiên, diễn đạt điều được Cha vui lòng hoặc chấp thuận mà không mặc nhiên biến danh từ εὐδοκία thành một sắc lệnh hay kế hoạch.
- source_word: ἔμπροσθέν σου
  choice: Cha
  rationale: Trong thành ngữ “đẹp ý Cha,” đối tượng đánh giá đã được diễn đạt rõ; cách này chuyển tải ý “trước mặt/ngay trong mắt Ngài” mà không tạo câu tiếng Việt nặng nề.
theological_decisions:
- issue: Có nên dịch εὐδοκία theo hướng nhấn mạnh sắc lệnh, ý định hay sự vui lòng của Đức Chúa Cha hay không
  choice: “đẹp ý Cha,” nhấn mạnh sự vui lòng và chấp thuận
  alternative: “theo ý tốt lành của Cha” hoặc “đó là ý muốn tốt lành của Cha”
  rationale: Cụm Hy Lạp khẳng định cách hành động này là điều đẹp ý Cha. “Đẹp ý Cha” giữ được ý đánh giá và vui lòng, đồng thời tránh áp đặt sắc thái sắc lệnh mạnh hơn điều câu văn trực tiếp nói.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng gần gũi. “Thưa Cha” phù hợp với lời cầu nguyện; “đẹp ý Cha” là thành ngữ tự nhiên, sáng rõ và giữ được sự cô đọng của nguyên văn.
