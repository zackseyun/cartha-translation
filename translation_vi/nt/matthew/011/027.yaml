id: MAT.11.27
reference: Matthew 11:27
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Πάντα μοι παρεδόθη ὑπὸ τοῦ πατρός μου, καὶ οὐδεὶς ἐπιγινώσκει τὸν υἱὸν εἰ μὴ ὁ πατήρ, οὐδὲ τὸν πατέρα τις ἐπιγινώσκει εἰ μὴ ὁ υἱὸς καὶ ᾧ ἐὰν βούληται ὁ υἱὸς ἀποκαλύψαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/027.yaml
  text: All things have been handed over to me by my Father[a], and no one knows the Son except the Father[b], nor does anyone know the Father except the Son and anyone to whom the Son chooses to reveal him.
translation:
  language: vi
  text: Mọi sự đã được Cha tôi giao cho tôi. Không ai biết Con ngoài Cha; cũng không ai biết Cha ngoài Con và người nào mà Con muốn cho biết về Cha.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πάντα
  choice: Mọi sự
  rationale: Giữ phạm vi bao quát của dạng trung tính số nhiều mà không tự ý xác định cụ thể những gì được giao.
- source_word: παρεδόθη
  choice: đã được ... giao cho
  rationale: Phản ánh thể thụ động và hành động chuyển giao đã hoàn tất; cách nói này tự nhiên và trang trọng trong tiếng Việt.
- source_word: ὑπὸ τοῦ πατρός μου
  choice: Cha tôi
  rationale: Giữ quan hệ sở hữu và dùng “Cha” như danh xưng chỉ Đức Chúa Trời trong quan hệ đối ứng với “Con”.
- source_word: ἐπιγινώσκει
  choice: biết rõ
  rationale: Diễn đạt khả năng chỉ sự nhận biết sâu sắc hoặc đầy đủ của động từ, nhưng kèm chú thích để bảo toàn cách hiểu đơn giản là “biết”.
- source_word: τὸν υἱὸν / τὸν πατέρα
  choice: Con / Cha
  rationale: Dùng như các danh xưng đối ứng trong ngữ cảnh này, giữ cấu trúc song song của nguyên văn.
- source_word: εἰ μὴ
  choice: ngoài
  rationale: 'Diễn đạt tự nhiên ý loại trừ sau mệnh đề phủ định: “không ai ... ngoài ...”.'
- source_word: ᾧ ἐὰν βούληται ὁ υἱὸς ἀποκαλύψαι
  choice: người nào mà Con chọn để bày tỏ Cha cho
  rationale: “Chọn” truyền đạt ý chí chủ động của βούληται; “bày tỏ” là cách nói hiện đại, dễ hiểu cho ἀποκαλύψαι, và “Cha” được nêu rõ làm đối tượng theo văn cảnh.
theological_decisions:
- issue: Sắc thái của ἐπιγινώσκω trong sự hiểu biết tương hỗ giữa Cha và Con
  choice: biết rõ
  alternative: biết
  rationale: “Biết rõ” làm nổi bật chiều sâu và tính độc nhất của sự hiểu biết được nói đến, nhưng không dùng thuật ngữ tín lý vượt quá bản văn; chú thích giữ lại khả năng dịch trung tính hơn là “biết”.
- issue: Ý chí của Con trong βούληται
  choice: chọn
  alternative: muốn
  rationale: “Chọn” thể hiện sáng kiến và ý chí thật của Con trong việc bày tỏ Cha, trong khi chú thích bảo toàn cách dịch sát hơn là “muốn”, không áp đặt một hệ thống thần học riêng.
- issue: Đối tượng được bày tỏ trong ἀποκαλύψαι
  choice: nêu rõ “Cha”
  alternative: dùng đại từ “Ngài”
  rationale: Nguyên văn lược đối tượng nhưng văn cảnh quy chiếu về Cha; nêu lại “Cha” giúp tiếng Việt rõ nghĩa mà không thay đổi nội dung.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Giữ thế song song “không ai ... ngoài ...; cũng không ai ... ngoài ...” của nguyên văn. Viết hoa “Cha” và “Con” vì đây là các danh xưng đối ứng trong ngữ cảnh.
