- from: Mọi sự đã được Cha tôi giao cho tôi. Không ai biết rõ[a] Con ngoài Cha; cũng không ai biết rõ Cha ngoài Con và người nào mà Con chọn để bày tỏ Cha cho.[b]
  to: Mọi sự đã được Cha tôi giao cho tôi. Không ai biết Con ngoài Cha; cũng không ai biết Cha ngoài Con và người nào mà Con muốn cho biết về Cha.
  rationale: 'Bản sửa dùng các cách dịch trung tính và tự nhiên hơn: “biết” cho ἐπιγινώσκει, và “muốn cho biết về Cha” cho mệnh đề mặc khải. Bản sửa vẫn giữ tính bao quát của “Mọi sự”, thể thụ động của việc giao phó, cấu trúc loại trừ song song, và sự quy chiếu của đối tượng được bày tỏ về Cha. Các chú thích cũ được bỏ vì sau sửa đổi chúng không còn là các phương án thay thế cần thiết.'
