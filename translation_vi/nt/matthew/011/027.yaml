review_pass:
  verdict: revise
  source_fidelity: Cần dịch ἐπιγινώσκει trung tính là “biết”. Dù động từ có thể mang sắc thái nhận biết trọn vẹn trong một số ngữ cảnh, bản thân hình thức này không buộc phải thêm “rõ”; tính độc nhất và sâu xa của sự biết đã được cấu trúc loại trừ của câu diễn đạt. Với ᾧ ἐὰν βούληται ... ἀποκαλύψαι, “người nào mà Con muốn cho biết về Cha” truyền đạt tự nhiên người nhận ở cách gián tiếp, ý chí của Con, và đối tượng được mặc khải theo văn cảnh.
  naturalness: Cụm “bày tỏ Cha cho” ở cuối mệnh đề không tự nhiên trong tiếng Việt hiện đại, vì “cho” không có bổ ngữ được biểu thị rõ. Cấu trúc “cho biết về Cha” tự nhiên, rõ quan hệ giữa người nhận và nội dung được bày tỏ, mà không thêm ý nghĩa thực chất.
  terminology: Giữ viết hoa “Cha” và “Con” như các danh xưng đối ứng trong ngữ cảnh. “Mọi sự” và “đã được ... giao cho” phù hợp với phạm vi của Πάντα và thể thụ động của παρεδόθη. “Muốn” là cách dịch trực tiếp, không cường điệu, của βούληται.
  issues:
  - severity: medium
    issue: “biết rõ” diễn giải tăng cường ἐπιγινώσκει.
    rationale: Sắc thái tăng cường có thể có, nhưng không chắc đến mức cần đưa vào bản văn chính. “Biết” bảo toàn độ mở từ vựng và vẫn giữ lực nhấn của mệnh đề loại trừ song song.
  - severity: medium
    issue: “người nào mà Con chọn để bày tỏ Cha cho” không tự nhiên và cú pháp người nhận chưa hoàn chỉnh.
    rationale: Giới từ “cho” bị để lửng, còn “để” có thể khiến cấu trúc mục đích nặng nề. “người nào mà Con muốn cho biết về Cha” là cách diễn đạt tiếng Việt thông suốt và phản ánh đúng quan hệ mặc khải.
  - severity: low
    issue: Chú thích a trở nên không cần thiết sau khi bản văn chính dùng “biết”.
    rationale: Chú thích hiện tại chỉ nêu “biết” như một phương án thay thế cho chính cách dịch nên được bỏ; không có biến thể văn bản hoặc vấn đề ngữ pháp nào cần neo chú thích.
  - severity: low
    issue: Chú thích b lặp lại cách dịch “muốn” nhưng bản văn chính cần dùng chính cách dịch trực tiếp này.
    rationale: Sau khi dùng “muốn” trong bản văn chính, chú thích không còn cung cấp một phương án có ích.
  revised_text: Mọi sự đã được Cha tôi giao cho tôi. Không ai biết Con ngoài Cha; cũng không ai biết Cha ngoài Con và người nào mà Con muốn cho biết về Cha.
