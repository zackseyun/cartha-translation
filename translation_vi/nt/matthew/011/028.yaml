review_pass:
  verdict: revise
  source_fidelity: Bản dịch truyền đạt đúng lời mời phổ quát, tình trạng lao nhọc, và lời hứa về sự nghỉ ngơi. Tuy nhiên, “mang gánh nặng” không thể hiện rõ sắc thái bị động hoàn thành của πεφορτισμένοι; bản sửa “bị đè nặng” bảo toàn tốt hơn tình trạng hiện tại do đã bị chất gánh nặng lên. Liên từ κἀγώ cũng nên được thể hiện bằng “và tôi”.
  naturalness: “Hãy đến với tôi, tất cả những ai...” là tiếng Việt chuẩn hiện đại, rõ ràng và phù hợp văn phong trang trọng. “Bị đè nặng” tự nhiên hơn cách chú giải “bị chất nặng” và không giới hạn loại gánh nặng.
  terminology: Giữ “nhọc nhằn”, “gánh nặng”, và “nghỉ ngơi” theo nghĩa rộng của nguyên văn; không diễn giải gánh nặng hay bản chất sự nghỉ ngơi theo hướng giáo phái.
