    rationale: Phân từ πεφορτισμένοι diễn tả người đã bị chất/đặt gánh nặng lên và còn ở trong tình trạng đó. “Bị đè nặng” diễn đạt tự nhiên hơn tình trạng chịu tác động này.
  - severity: low
    issue: Bản dịch bỏ liên từ rõ ràng trong κἀγώ.
    rationale: Dấu phẩy có thể nối hai mệnh đề trong tiếng Việt, nhưng thêm “và” phản ánh tốt hơn κἀγώ mà vẫn tự nhiên.
