  text: Δεῦτε πρός με πάντες οἱ κοπιῶντες καὶ πεφορτισμένοι, κἀγὼ ἀναπαύσω ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/028.yaml
  text: Come to me[a], all who labor and are burdened[b], and I will give you rest.
translation:
  language: vi
  text: Hãy đến với tôi, tất cả những ai đang nhọc nhằn và bị đè nặng[a], và tôi sẽ cho các bạn được nghỉ ngơi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đã bị chất đầy gánh nặng.” Phân từ hoàn thành bị động trong tiếng Hy Lạp mô tả những người đã bị đặt gánh nặng lên và vẫn còn ở trong tình trạng ấy.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “tôi sẽ làm cho các bạn được hồi sức.” Động từ Hy Lạp có thể mang nghĩa làm cho ai đó nghỉ ngơi hoặc hồi sức.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Δεῦτε πρός με
  choice: Hãy đến với tôi
  rationale: Diễn đạt tự nhiên lời mời trực tiếp và giữ rõ hướng chuyển động đến với người nói.
- source_word: πάντες
  choice: hỡi tất cả những ai
  rationale: Giữ phạm vi bao quát của lời mời, đồng thời nối tự nhiên với hai phân từ mô tả những người được mời.
- source_word: οἱ κοπιῶντες
  choice: đang nhọc nhằn
  rationale: Giữ sắc thái chủ động và tiếp diễn của việc lao nhọc, vất vả mà không giới hạn vào lao động thể chất.
- source_word: πεφορτισμένοι
  choice: mang gánh nặng
  rationale: Diễn đạt trạng thái hiện tại do đã bị chất gánh lên; cách nói tự nhiên trong tiếng Việt và vẫn bảo toàn hình ảnh gánh nặng.
- source_word: κἀγὼ
  choice: tôi
  rationale: Chủ ngữ được nêu rõ; tiếng Việt không cần thêm đại từ nhấn mạnh, còn quan hệ tiếp nối được thể hiện tự nhiên bằng dấu phẩy.
- source_word: ἀναπαύσω ὑμᾶς
  choice: tôi sẽ cho các bạn được nghỉ ngơi
  rationale: Giữ nghĩa tác động 'làm cho nghỉ/nghỉ ngơi' và lời hứa hướng đến số nhiều, không thu hẹp thành chỉ sự khuây khỏa về cảm xúc.
theological_decisions:
- issue: Bản chất của sự nghỉ ngơi được hứa trong ἀναπαύσω
  choice: cho các bạn được nghỉ ngơi
  alternative: làm cho các bạn được hồi sức
  rationale: Giữ nghĩa rộng của lời hứa, không tự quyết định đó chỉ là sự nghỉ ngơi thuộc linh, thể chất, cảm xúc hay cánh chung.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “các bạn” để thể hiện đối tượng số nhiều trong lời mời trực tiếp; tránh từ cổ và không diễn giải loại gánh nặng hay bản chất của sự nghỉ ngơi.
