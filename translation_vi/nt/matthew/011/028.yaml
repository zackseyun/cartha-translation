  rationale: Sửa cách diễn đạt của πεφορτισμένοι để phản ánh rõ hơn sắc thái bị động hoàn thành mà vẫn tự nhiên trong tiếng Việt; thêm “và” để thể hiện κἀγώ. Các phần còn lại trung thành với nguyên văn và giữ nghĩa thần học mở của ἀναπαύσω.
