id: MAT.11.7
reference: Matthew 11:7
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Τούτων δὲ πορευομένων ἤρξατο ὁ Ἰησοῦς λέγειν τοῖς ὄχλοις περὶ Ἰωάννου· Τί ἐξήλθατε εἰς τὴν ἔρημον θεάσασθαι; κάλαμον ὑπὸ ἀνέμου σαλευόμενον;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/007.yaml
  text: 'As these men were going away[b][a], Jesus began to speak to the crowds about John: “What did you go out into the wilderness to look at? A reed being shaken by the wind?”'
translation:
  language: vi
  text: 'Khi những người ấy đang ra về, Đức Giê-su bắt đầu nói với đám đông về ông Giăng: “Anh em đã ra hoang mạc để xem gì?[a] Một cây sậy bị gió lay động chăng?[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Anh em đã ra hoang mạc để nhìn gì?”'
    reason: lexical_alternative
  - marker: b
    text: Hình ảnh cây sậy bị gió lay động có thể gợi ý sự bất định hoặc dao động; trong ngữ cảnh, câu hỏi của Đức Giê-su hàm ý rằng ông Giăng không phải là người như thế.
    reason: cultural_note
lexical_decisions:
- source_word: Τούτων δὲ πορευομένων
  choice: Khi những người ấy đang đi khỏi
  rationale: Kết cấu sở hữu cách tuyệt đối diễn tả hành động đang diễn ra đồng thời. “Những người ấy” giữ cách quy chiếu của nguyên văn; theo văn cảnh, đó là các môn đệ của ông Giăng.
- source_word: ἤρξατο ... λέγειν
  choice: bắt đầu nói
  rationale: Diễn đạt tự nhiên và sát nghĩa kết cấu ἄρχομαι với động từ nguyên mẫu.
- source_word: τοῖς ὄχλοις
  choice: với đám đông
  rationale: Danh từ Hy Lạp ở số nhiều, nhưng tiếng Việt tự nhiên thường dùng danh từ tập hợp “đám đông” trong ngữ cảnh này.
- source_word: περὶ Ἰωάννου
  choice: về ông Giăng
  rationale: περί với sở hữu cách chỉ đề tài. Thêm đại từ xưng gọi “ông” là cách nói tiếng Việt tự nhiên, tôn trọng nhân vật mà không thêm địa vị thần học.
- source_word: Τί ἐξήλθατε εἰς τὴν ἔρημον θεάσασθαι;
  choice: Anh em đã ra hoang mạc để xem gì?
  rationale: Τί được giữ là câu hỏi “gì”, không chuyển thành “tại sao”. “Xem” diễn đạt θεάομαι như hành động chủ ý quan sát; “hoang mạc” phù hợp bối cảnh Giu-đê và văn phong Kinh Thánh hiện đại.
- source_word: κάλαμον
  choice: một cây sậy
  rationale: Giữ danh từ số ít và hình ảnh cụ thể của nguyên văn.
- source_word: ὑπὸ ἀνέμου σαλευόμενον
  choice: bị gió lay động
  rationale: Giữ thể bị động và ý chuyển động do gió gây ra, đồng thời là cách diễn đạt tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Đối tượng được Τούτων (“những người ấy”) quy chiếu
  choice: Giữ là “những người ấy”, theo văn cảnh chỉ các môn đệ của ông Giăng
  alternative: Nói rõ “các môn đệ của ông Giăng”
  rationale: Cách chọn này bảo toàn mức độ minh thị của nguyên văn và tránh đưa lời giải thích văn cảnh vào chính câu Kinh Thánh.
- issue: Hàm ý của hình ảnh cây sậy bị gió lay động
  choice: Giữ nguyên dưới dạng câu hỏi tu từ và giải thích hàm ý trong chú thích
  alternative: Diễn giải trong câu rằng ông Giăng không phải người dao động, thiếu kiên định
  rationale: Nguyên văn không nói thẳng hàm ý; giữ hình ảnh bảo tồn sức gợi và sự căng thẳng tu từ của lời Đức Giê-su.
translation_notes:
  register: Bản dịch dùng tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. “Đức Giê-su” và “ông Giăng” tạo sắc thái kính trọng tự nhiên; “anh em” phù hợp lời nói trực tiếp với đám đông. Dấu “chăng” được dùng vừa phải để thể hiện câu hỏi tu từ mong đợi câu trả lời phủ định.
