- from: 'Khi những người ấy đang đi khỏi, Đức Giê-su bắt đầu nói với đám đông về ông Giăng: “Anh em đã ra hoang mạc để xem gì?[a] Một cây sậy bị gió lay động chăng?[b]”'
  to: 'Khi những người ấy đang ra về, Đức Giê-su bắt đầu nói với đám đông về ông Giăng: “Anh em đã ra hoang mạc để xem gì?[a] Một cây sậy bị gió lay động chăng?[b]”'
  rationale: Chỉ thay “đang đi khỏi” bằng “đang ra về” để tiếng Việt tự nhiên hơn, không thêm thông tin về các môn đệ của ông Giăng vào bản văn. Chú thích b được làm gọn và thận trọng hơn, trong khi vẫn giải thích chức năng tu từ của hình ảnh.
