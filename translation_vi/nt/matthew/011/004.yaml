base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/004.yaml
  text: And Jesus answered them[a], “Go and report to John what you hear and see:”
translation:
  language: vi
  text: 'Đức Giê-su đáp lời họ: “Hãy đi báo lại cho ông Giăng những điều các anh nghe và thấy.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: '[không dịch riêng]'
  rationale: Liên từ nối tiếp mạch kể; trong tiếng Việt hiện đại, mở câu bằng “Và” ở đây không cần thiết vì sự tiếp nối đã rõ từ ngữ cảnh.
- source_word: ἀποκριθεὶς ... εἶπεν αὐτοῖς
  choice: Đức Giê-su đáp lời họ
  rationale: Công thức kể chuyện Hy Lạp theo nghĩa sát là “đáp và nói với họ”; “đáp lời họ” diễn đạt tự nhiên cả chức năng hồi đáp lẫn việc dẫn vào lời nói trực tiếp.
- source_word: ὁ Ἰησοῦς
  choice: Đức Giê-su
  rationale: Dùng dạng tên gọi quen thuộc, trang trọng trong tiếng Việt; mạo từ Hy Lạp không cần được dịch riêng.
- source_word: Πορευθέντες
  choice: Hãy đi
  rationale: Phân từ aorist đi kèm mệnh lệnh mang lực của hành động phụ trợ nối tiếp; “Hãy đi” giữ rõ mệnh lệnh và trình tự hành động.
- source_word: ἀπαγγείλατε
  choice: báo lại
  rationale: Động từ chỉ việc trình báo hoặc truyền lại tin; “báo lại” phù hợp với việc các môn đồ trở về thuật lại cho Giăng.
- source_word: Ἰωάννῃ
  choice: cho ông Giăng
  rationale: Dữ cách chỉ người nhận. “Ông” tạo cách xưng gọi tự nhiên, tôn trọng; “Giăng” là dạng tên Kinh Thánh quen thuộc trong tiếng Việt.
- source_word: ἃ
  choice: những điều
  rationale: Đại từ quan hệ trung tính số nhiều chỉ nội dung họ quan sát; “những điều” tự nhiên và vẫn thể hiện số nhiều.
- source_word: ἀκούετε καὶ βλέπετε
  choice: các anh đang nghe và thấy
  rationale: Hai động từ hiện tại chỉ trải nghiệm đang diễn ra. “Đang” dùng chung cho cả hai; “các anh” phù hợp với nhóm sứ giả nam được Đức Giê-su trực tiếp sai đi.
theological_decisions:
- issue: Công thức dẫn lời ἀποκριθεὶς ... εἶπεν
  choice: Đức Giê-su đáp lời họ
  alternative: Đức Giê-su đáp và nói với họ
  rationale: Đây là vấn đề văn phong, không phải tín lý. Bản dịch chính tránh lối lặp không tự nhiên trong tiếng Việt nhưng vẫn giữ rõ đây là lời đáp; không cần chú thích vì không có khác biệt nội dung đáng kể.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Giê-su” và “ông Giăng” theo cách gọi tự nhiên trong tiếng Việt; câu mệnh lệnh trực tiếp, rõ ràng. Không thêm chú thích chỉ để ghi lại thành ngữ kể chuyện Hy Lạp vốn có thể chuyển tải đầy đủ bằng tiếng Việt tự nhiên.
