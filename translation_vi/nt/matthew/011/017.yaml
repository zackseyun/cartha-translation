base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/017.yaml
  text: They say[a], ‘We played the flute for you, and you did not dance; we sang a lament[c][b], and you did not mourn.’
translation:
  language: vi
  text: 'Chúng nói: “Chúng tôi đã thổi sáo cho các bạn, mà các bạn không nhảy múa; chúng tôi đã hát bài ai ca[a], mà các bạn không than khóc[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “cất tiếng than” hoặc “hát bài tang ca.”'
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn: “không đấm ngực”, nói đến cử chỉ than khóc theo phong tục tang chế.'
    reason: cultural_note
lexical_decisions:
- source_word: λέγουσιν
  choice: Chúng nói
  rationale: Thì hiện tại làm lời phàn nàn của bọn trẻ trở nên sống động trong cảnh ví von; cách nói này tự nhiên trong tiếng Việt.
- source_word: Ηὐλήσαμεν
  choice: chúng tôi đã thổi sáo
  rationale: Động từ αὐλέω chỉ cụ thể việc chơi sáo hoặc ống tiêu; “thổi sáo” vừa tự nhiên vừa giữ được hình ảnh nhạc cụ.
- source_word: ὑμῖν
  choice: cho các bạn
  rationale: Diễn đạt màn trình diễn hướng đến nhóm trẻ còn lại và giữ sắc thái của cách dùng tặng cách trong ngữ cảnh.
- source_word: ὠρχήσασθε
  choice: các bạn không nhảy múa
  rationale: Dạng trung ở đây được diễn đạt tự nhiên bằng “nhảy múa”, không cần thêm sắc thái phản thân.
- source_word: ἐθρηνήσαμεν
  choice: chúng tôi đã hát khúc ai ca
  rationale: θρηνέω chỉ việc cất lời than, đặc biệt theo lối tang lễ; cách dịch này giữ thế song song mang tính trình diễn với “thổi sáo”.
- source_word: ἐκόψασθε
  choice: các bạn không đấm ngực than khóc
  rationale: Trong bối cảnh tang chế, κόπτω ở dạng trung nói đến cử chỉ tự đấm ngực để biểu lộ đau buồn; bản dịch giữ cả hành động cụ thể lẫn ý nghĩa văn hóa.
