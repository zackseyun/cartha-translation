  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Đại từ “chúng/các bạn” phù hợp với hình ảnh trẻ em trong ví dụ; “khúc ai ca” giữ sắc thái tang lễ mà không quá cổ. Các dấu chú thích [a], [b] đều xuất hiện trong chính văn.
