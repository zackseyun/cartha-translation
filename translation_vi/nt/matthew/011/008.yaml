  source_fidelity: Bản dịch giữ đúng chuỗi câu hỏi tu từ, lực đối lập của ἀλλά, và ý đối chiếu giữa người mặc y phục mềm mại với nơi ở của các vua. Tuy nhiên, “áo mềm mại” quá hẹp (gợi một chiếc áo) so với μαλακοῖς / τὰ μαλακά, vốn chỉ y phục nói chung; “y phục mềm mại” phản ánh sát hơn và giữ được sự lặp từ của nguyên văn.
