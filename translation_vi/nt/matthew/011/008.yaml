id: MAT.11.8
reference: Matthew 11:8
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀλλὰ τί ἐξήλθατε ἰδεῖν; ἄνθρωπον ἐν ⸀μαλακοῖς ἠμφιεσμένον; ἰδοὺ οἱ τὰ μαλακὰ φοροῦντες ἐν τοῖς οἴκοις τῶν ⸀βασιλέων ⸀εἰσίν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/008.yaml
  text: But what did you go out to see? A man dressed in soft clothes? Look[b][a], those who wear soft clothes are in the houses of kings.
translation:
  language: vi
  text: Nhưng các ông đi ra để xem gì? Một người mặc y phục mềm mại sao? Kìa, những người mặc y phục mềm mại[a] thì ở trong nhà của các vua[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “mặc y phục sang trọng.” Tiếng Hy Lạp nói theo nghĩa đen là “những thứ mềm,” chỉ y phục mềm mại, tinh tế hoặc xa hoa.
    reason: lexical_alternative
  - marker: b
    text: Hoặc “trong các cung điện hoàng gia.” Tiếng Hy Lạp dịch sát là “trong nhà của các vua.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Nhưng
  rationale: Liên từ chuyển ý tiếp nối chuỗi câu hỏi tương phản của Đức Giê-su; “Nhưng” tự nhiên và giữ được lực đối lập.
- source_word: τί ἐξήλθατε ἰδεῖν
  choice: các ông đi ra để xem gì
  rationale: Giữ τί là “gì” và diễn đạt cấu trúc chỉ mục đích ἐξήλθατε ἰδεῖν một cách tự nhiên trong tiếng Việt.
- source_word: ἄνθρωπον
  choice: một người
  rationale: Danh từ số ít chỉ người đang được nói đến là Giăng; “một người” tự nhiên trong câu hỏi tu từ và không làm mất tham chiếu nam giới trong ngữ cảnh.
- source_word: ἐν μαλακοῖς ἠμφιεσμένον
  choice: mặc áo mềm mại
  rationale: μαλακοῖς theo nghĩa đen là những thứ mềm, ngầm chỉ y phục tinh tế, xa hoa; cách dịch giữ hình ảnh cụ thể mà vẫn dễ hiểu.
- source_word: ἰδοὺ
  choice: Kìa
  rationale: Tiểu từ thu hút sự chú ý được chuyển thành lời chỉ dẫn trang trọng nhưng vẫn thông dụng trong văn phong Kinh Thánh hiện đại.
- source_word: οἱ τὰ μαλακὰ φοροῦντες
  choice: những người mặc áo mềm mại
  rationale: Giữ sự lặp lại của μαλακά với vế trước; φοροῦντες gợi việc thường mặc loại y phục ấy.
- source_word: ἐν τοῖς οἴκοις τῶν βασιλέων εἰσίν
  choice: thì ở trong cung điện của các vua
  rationale: “Cung điện” truyền đạt tự nhiên ý nghĩa theo ngữ cảnh của “nhà các vua,” đồng thời giữ dạng số nhiều “các vua” của nguyên văn.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Các ông” phù hợp với lời Đức Giê-su trực tiếp hỏi đám đông. Bản dịch giữ chuỗi câu hỏi tu từ và sự lặp từ của nguyên văn; các chú thích nêu nghĩa hàm ẩn của y phục mềm mại và cách diễn đạt sát chữ “nhà của các vua.”
