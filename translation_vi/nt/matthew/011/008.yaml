  to: Nhưng các ông đi ra để xem gì? Một người mặc y phục mềm mại sao? Kìa, những người mặc y phục mềm mại[a] thì ở trong nhà của các vua[b].
  rationale: Sửa “áo” thành “y phục” để không thu hẹp trường nghĩa của từ Hy Lạp và để sự lặp lại giữa hai vế được nhất quán. Đổi “cung điện” trong bản văn chính thành “nhà” để bảo toàn cách diễn đạt của nguyên ngữ; nghĩa theo ngữ cảnh được nêu ở chú thích.
