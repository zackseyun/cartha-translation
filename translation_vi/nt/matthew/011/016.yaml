id: MAT.11.16
reference: Matthew 11:16
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Τίνι δὲ ὁμοιώσω τὴν γενεὰν ταύτην; ὁμοία ἐστὶν παιδίοις ⸂καθημένοις ἐν ταῖς ἀγοραῖς ἃ προσφωνοῦντα τοῖς ἑτέροις⸃
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/016.yaml
  text: But to what shall I compare this generation? It is like children sitting in the marketplaces[a], calling out to the others[b],
translation:
  language: vi
  text: Nhưng Ta sẽ ví thế hệ này với điều gì? Thế hệ này giống như những đứa trẻ ngồi ở các khu chợ[a], gọi những người khác[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “tại các quảng trường chợ.” Từ Hy Lạp ἀγοραῖς chỉ những khu vực công cộng có chợ và là nơi dân chúng tụ họp.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “gọi những đứa trẻ khác.” Nguyên văn nói “gọi những người khác”; ngữ cảnh của hình ảnh ví von hàm ý đó là những đứa trẻ khác.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τίνι ... ὁμοιώσω
  choice: Ta sẽ ví ... với ai?
  rationale: Τίνι là đại từ nghi vấn ở cách cho, chỉ đối tượng được dùng để so sánh. Cách nói “ví ... với ai” tự nhiên trong tiếng Việt và giữ sắc thái câu hỏi tu từ của động từ tương lai ὁμοιώσω.
- source_word: δὲ
  choice: Nhưng
  rationale: δέ đánh dấu một bước chuyển nhẹ, có thể mang sắc thái tương phản; “Nhưng” phù hợp với mạch lập luận.
- source_word: τὴν γενεὰν ταύτην
  choice: thế hệ này
  rationale: γενεά ở đây chỉ những người cùng thời được nhìn như một tập thể; “thế hệ này” là cách dịch trực tiếp, quen thuộc và không thu hẹp nghĩa.
- source_word: ὁμοία ἐστὶν
  choice: Họ giống như
  rationale: Đại từ “Họ” quy chiếu tự nhiên đến những người thuộc “thế hệ này” trong tiếng Việt, còn “giống như” diễn đạt trực tiếp quan hệ tương đồng.
- source_word: παιδίοις
  choice: những đứa trẻ
  rationale: παιδίον chỉ trẻ em; “những đứa trẻ” tự nhiên, dễ hiểu và không nhấn quá mức sắc thái nhỏ tuổi.
- source_word: καθημένοις
  choice: ngồi
  rationale: Phân từ hiện tại mô tả tư thế trong cảnh ví dụ; “ngồi” gọn và tự nhiên.
- source_word: ἐν ταῖς ἀγοραῖς
  choice: ở các khu chợ
  rationale: ἀγορά chỉ khu vực công cộng dùng làm chợ và nơi tụ họp. “Khu chợ” dễ hiểu trong tiếng Việt hiện đại, đồng thời chú thích làm rõ phạm vi nghĩa.
- source_word: προσφωνοῦντα
  choice: gọi
  rationale: Động từ diễn tả việc cất tiếng gọi hoặc nói với người khác. “Gọi” phù hợp với cảnh trẻ em gọi nhóm kia và tránh thêm sắc thái không có trong nguyên văn.
- source_word: τοῖς ἑτέροις
  choice: những đứa khác
  rationale: ἕτεροι có nghĩa là “những người khác/nhóm kia.” Ngữ cảnh cho thấy đó là những trẻ khác; bản dịch nêu rõ thành phần được ngầm hiểu, còn chú thích bảo lưu cách diễn đạt ít xác định hơn của tiếng Hy Lạp.
theological_decisions:
- issue: Đại từ ngôi thứ nhất hàm ẩn trong ὁμοιώσω
  choice: Ta
  alternative: tôi
  rationale: Người nói là Đức Giê-su; “Ta” duy trì văn phong trang trọng, quen thuộc trong lời Ngài mà không thay đổi nội dung thần học.
- issue: Sự hòa hợp ý nghĩa của ὁμοία với γενεὰν
  choice: Họ giống như
  alternative: Thế hệ ấy giống như
  rationale: Dùng “Họ” làm rõ rằng đối tượng là những người thuộc thế hệ này, tránh cách nhân cách hóa cứng nhắc, nhưng không quyết định thêm họ là một nhóm cụ thể nào.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng vừa phải và dễ đọc. Giữ câu hỏi tu từ, hình ảnh sinh hoạt nơi công cộng và dấu phẩy cuối câu vì lời ví von còn tiếp tục ở câu sau.
