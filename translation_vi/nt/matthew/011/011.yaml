review_pass:
  verdict: revise
  source_fidelity: Bản nháp truyền đạt đúng cấu trúc nghịch lý và ý nghĩa chính của câu. Tuy nhiên, “thiên đàng” thường chỉ cõi phước hạnh/paradise trong tiếng Việt, không phải tương đương thích hợp của τῶν οὐρανῶν trong thành ngữ Ma-thi-ơ “vương quốc/nước Trời”.
  naturalness: “Thật, tôi nói với anh em” và đặc biệt “vương quốc thiên đàng” không tự nhiên trong tiếng Việt Kinh Thánh hiện đại. “Quả thật, tôi nói với anh em” và “Nước Trời” vừa rõ vừa có register trang trọng, hiện đại.
  terminology: Dùng “Nước Trời” cho βασιλεία τῶν οὐρανῶν. “Người nhỏ bé nhất” phản ánh lối dùng so sánh có mạo từ ὁ μικρότερος với ý người có địa vị thấp nhất, tránh nghĩa tuổi tác có thể phát sinh từ “người nhỏ hơn”. “Vĩ đại hơn” làm rõ μείζων là sự lớn lao/địa vị, không phải kích thước.
  issues:
  - severity: high
    issue: “vương quốc thiên đàng” dịch không chính xác βασιλεία τῶν οὐρανῶν.
    rationale: “Thiên đàng” trong cách dùng Việt ngữ thông thường là paradise/cõi phước hạnh, còn cụm Ma-thi-ơ nói về Nước hay quyền cai trị của Trời. Chú thích hiện có cũng sai khi đề xuất “vương quyền của trời” như một nghĩa thay thế trực tiếp của cả cụm và khi đồng nhất “thiên đàng” với cách nói kính tránh.
  - severity: medium
    issue: “người nhỏ hơn” dễ được hiểu là người ít tuổi hơn và chưa diễn đạt tự nhiên ý cấp bậc của ὁ μικρότερος.
    rationale: Trong ngữ cảnh đối chiếu về sự vĩ đại, μορφή so sánh này thường có giá trị “người nhỏ bé nhất/người thấp kém nhất”. Cách sửa không giải thích cơ chế thần học của nghịch lý.
  - severity: low
    issue: Công thức mở đầu “Thật, tôi nói với anh em” hơi gượng.
    rationale: “Quả thật, tôi nói với anh em” là công thức tiếng Việt tự nhiên, trang trọng và tương ứng tốt với ἀμὴν λέγω ὑμῖν.
