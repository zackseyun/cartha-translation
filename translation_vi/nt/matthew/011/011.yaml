revisions:
- from: 'Thật, tôi nói với anh em: Trong số những người do phụ nữ sinh ra, chưa từng xuất hiện ai lớn hơn Giăng Báp-tít; nhưng người nhỏ hơn trong vương quốc thiên đàng[a] lại lớn hơn ông.'
  to: 'Quả thật, tôi nói với anh em: Trong số những người do phụ nữ sinh ra, chưa từng xuất hiện ai vĩ đại hơn Giăng Báp-tít; nhưng người nhỏ bé nhất trong Nước Trời lại vĩ đại hơn ông.'
  rationale: Thay thuật ngữ sai lệch “vương quốc thiên đàng” bằng “Nước Trời”, chỉnh công thức mở đầu cho tự nhiên, và diễn đạt ὁ μικρότερος theo giá trị thành ngữ chỉ người có địa vị thấp nhất. Bản sửa vẫn giữ nguyên nghịch lý của câu, không quyết định cách giải thích thần học về sự so sánh với Giăng.
