  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀμὴν λέγω ὑμῖν, οὐκ ἐγήγερται ἐν γεννητοῖς γυναικῶν μείζων Ἰωάννου τοῦ βαπτιστοῦ· ὁ δὲ μικρότερος ἐν τῇ βασιλείᾳ τῶν οὐρανῶν μείζων αὐτοῦ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/011.yaml
  text: Truly I say to you[a], among those born of women no one greater than John the Baptist has arisen[c][b]; yet the least in the kingdom of heaven is greater than he.
translation:
  language: vi
  text: 'Quả thật, tôi nói với anh em: Trong số những người do phụ nữ sinh ra, chưa từng xuất hiện ai vĩ đại hơn Giăng Báp-tít; nhưng người nhỏ bé nhất trong Nước Trời lại vĩ đại hơn ông.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀμὴν λέγω ὑμῖν
  choice: Thật, tôi nói với anh em
  rationale: Giữ sắc thái long trọng, có thẩm quyền của công thức mở đầu, đồng thời dùng lối diễn đạt rõ ràng, trang trọng trong tiếng Việt hiện đại.
- source_word: οὐκ ἐγήγερται
  choice: chưa từng xuất hiện
  rationale: Trong ngữ cảnh này, động từ chỉ việc một người xuất hiện trên sân khấu lịch sử; cách dịch này thể hiện kết quả kéo dài của thì hoàn thành mà không gợi sai đến sự sống lại.
- source_word: ἐν γεννητοῖς γυναικῶν
  choice: trong số những người do phụ nữ sinh ra
  rationale: Bảo tồn thành ngữ mang màu sắc Kinh Thánh, chỉ loài người nói chung, thay vì diễn giải thành 'giữa loài người'.
- source_word: μείζων Ἰωάννου τοῦ βαπτιστοῦ
  choice: ai lớn hơn Giăng Báp-tít
  rationale: Diễn đạt tự nhiên cấu trúc so sánh của tiếng Hy Lạp và giữ danh xưng quen thuộc của Giăng.
- source_word: ὁ δὲ μικρότερος
  choice: nhưng người nhỏ hơn
  rationale: Giữ nguyên hình thức so sánh và sự mơ hồ có thật của μικρότερος, thay vì nhất thiết diễn giải thành bậc tuyệt đối 'người nhỏ nhất'.
- source_word: ἐν τῇ βασιλείᾳ τῶν οὐρανῶν
  choice: trong vương quốc thiên đàng
  rationale: Diễn đạt tự nhiên thành ngữ đặc trưng của Ma-thi-ơ, trong đó βασιλεία có thể nhấn mạnh cả quyền trị vì lẫn lĩnh vực cai trị.
- source_word: μείζων αὐτοῦ ἐστιν
  choice: lại lớn hơn ông
  rationale: Giữ nguyên nghịch lý so sánh với Giăng và dùng đại từ tôn trọng, tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Sự vĩ đại của Giăng so với người ở trong vương quốc thiên đàng
  choice: Dịch trực tiếp nghịch lý mà không giải thích phương diện người kia lớn hơn Giăng.
  alternative: Diễn giải đây là địa vị trong lịch sử cứu chuộc, đặc ân giao ước mới hoặc mức độ thánh thiện cá nhân.
  rationale: Câu Hy Lạp không nêu cơ chế thần học của phép so sánh; bản dịch cần giữ nguyên sự căng thẳng thay vì áp đặt một cách giải thích.
- issue: Phạm vi của ὁ μικρότερος
  choice: Giữ cách nói so sánh 'người nhỏ hơn'.
  alternative: Diễn giải thành 'người nhỏ nhất' hoặc xác định đó là một môn đồ cụ thể.
  rationale: Hình thức Hy Lạp là so sánh và có thể được hiểu theo cấp bậc hay địa vị; không nên thu hẹp đối tượng quá mức.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh em” cho đại từ số nhiều ὑμῖν; giữ thành ngữ “do phụ nữ sinh ra” và nghịch lý của câu. Danh xưng “Giăng Báp-tít” theo cách gọi quen thuộc trong tiếng Việt.
