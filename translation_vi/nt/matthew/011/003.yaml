source:
  edition: SBLGNT
  text: εἶπεν αὐτῷ· Σὺ εἶ ὁ ἐρχόμενος ἢ ἕτερον προσδοκῶμεν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/003.yaml
  text: and said to him, “Are you the Coming One, or should we expect another?”
translation:
  language: vi
  text: 'và nói với Ngài: “Ngài có phải là Đấng Phải Đến[a], hay chúng tôi phải trông đợi một người khác?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “đấng sẽ đến” hoặc “đấng đang đến”. Cụm từ Hy Lạp này có thể được dùng như một danh xưng chỉ Đấng Mê-si được mong đợi.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν αὐτῷ
  choice: và hỏi Ngài
  rationale: Động từ εἶπεν theo nghĩa đen là “nói”, nhưng vì lời trực tiếp theo sau là một câu hỏi nên “hỏi Ngài” tự nhiên và chính xác trong tiếng Việt. “Và” nối tiếp hành động sai các môn đồ đi ở câu trước, dù không phải là một từ riêng trong cụm Hy Lạp được trích.
- source_word: Σὺ εἶ
  choice: Ngài có phải là
  rationale: Cấu trúc này diễn đạt tự nhiên một câu hỏi xác nhận trong tiếng Việt. Đại từ Σὺ được thể hiện bằng “Ngài”, phù hợp với cách các môn đồ của Giăng thưa với Chúa Giê-su mà không cường điệu sắc thái nhấn mạnh.
- source_word: ὁ ἐρχόμενος
  choice: Đấng Phải Đến
  rationale: Phân từ hiện tại có mạo từ được dùng như danh từ, nghĩa đen là “đấng/người đang đến” hoặc “đấng/người sẽ đến”. “Đấng Phải Đến” giữ được sắc thái danh xưng chỉ nhân vật được mong đợi trong bối cảnh, nhưng không diễn giải thẳng thành “Đấng Mê-si”.
- source_word: ἢ
  choice: hay
  rationale: Liên từ phân cách, đưa ra khả năng thứ hai trong câu hỏi.
- source_word: ἕτερον
  choice: một người khác
  rationale: ἕτερον chỉ một người khác hoặc một người khác biệt. “Một người khác” rõ nghĩa và tự nhiên hơn cách dịch chỉ bằng “người khác” trong câu này.
- source_word: προσδοκῶμεν
  choice: chúng tôi phải trông đợi
  rationale: Trong câu hỏi cân nhắc này, động từ mang nghĩa mong đợi hoặc chờ đợi. “Phải trông đợi” giữ cả ý chờ đón lẫn kỳ vọng, đồng thời diễn đạt tự nhiên sắc thái “chúng tôi có nên/phải… không”.
theological_decisions:
- issue: Sắc thái danh xưng chỉ Đấng Mê-si của ὁ ἐρχόμενος
  choice: Dịch là “Đấng Phải Đến” và viết hoa như một danh xưng theo ngữ cảnh.
  alternative: “đấng sẽ đến”, “người đang đến”, hoặc diễn giải là “Đấng Mê-si”
  rationale: Ngữ cảnh cho thấy Giăng hỏi liệu Chúa Giê-su có phải là nhân vật cứu thế được mong đợi hay không. Tuy nhiên, nguyên văn chỉ dùng một phân từ có mạo từ chứ không trực tiếp nói “Đấng Mê-si”; vì vậy bản dịch giữ sắc thái danh xưng nhưng không giải quyết quá mức sự hàm ẩn thần học.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Ngài” thích hợp trong lời thưa trực tiếp với Chúa Giê-su; “Đấng Phải Đến” giữ âm hưởng danh xưng Kinh Thánh mà vẫn có chú thích giải thích nghĩa sát chữ.
