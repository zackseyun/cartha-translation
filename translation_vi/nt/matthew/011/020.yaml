revisions:
- from: Bấy giờ, Đức Giê-su bắt đầu quở trách các thành nơi Ngài đã thực hiện phần lớn các việc quyền năng[a], vì dân chúng không ăn năn.
  to: Bấy giờ, Đức Giê-su bắt đầu trách cứ các thành phố, nơi đã diễn ra phần lớn những việc quyền năng của Ngài, vì dân chúng ở đó không ăn năn.[a]
  rationale: Bản sửa dùng “đã diễn ra” để phản ánh ἐγένοντο mà không thêm một lựa chọn cú pháp chủ động không có trong câu Hy Lạp; thay “các thành” bằng “các thành phố” cho tự nhiên hơn; và thêm “ở đó” để làm rõ rằng chủ thể hoán dụ của “không ăn năn” là dân cư các thành phố. Dấu chú thích được đặt ngay sau mệnh đề có “những việc quyền năng,” là chỗ neo rõ ràng cho δυνάμεις.
