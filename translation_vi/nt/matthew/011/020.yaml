source:
  edition: SBLGNT
  text: Τότε ⸀ἤρξατο ὀνειδίζειν τὰς πόλεις ἐν αἷς ἐγένοντο αἱ πλεῖσται δυνάμεις αὐτοῦ, ὅτι οὐ μετενόησαν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/020.yaml
  text: Then he began to reproach the cities in which most of his mighty works had been done[a], because they did not repent.
translation:
  language: vi
  text: Bấy giờ, Đức Giê-su bắt đầu trách cứ các thành phố, nơi đã diễn ra phần lớn những việc quyền năng của Ngài, vì dân chúng ở đó không ăn năn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay “các phép lạ” hoặc “những việc thể hiện quyền năng” (Hy Lạp: dynameis).'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Bấy giờ
  rationale: Dấu mốc thời gian mở ra diễn tiến kế tiếp; “Bấy giờ” tự nhiên và trang trọng trong văn kể chuyện.
- source_word: ἤρξατο ὀνειδίζειν
  choice: bắt đầu quở trách
  rationale: Giữ nguyên ý khởi đầu của ἤρξατο; “quở trách” diễn đạt lời trách cứ nghiêm khắc mà không đẩy nghĩa sang sự kết án chính thức.
- source_word: τὰς πόλεις ἐν αἷς
  choice: các thành nơi
  rationale: “Các thành” phù hợp với πόλεις; “nơi” chuyển quan hệ địa điểm sang tiếng Việt tự nhiên.
- source_word: ἐγένοντο αἱ πλεῖσται δυνάμεις αὐτοῦ
  choice: Ngài đã thực hiện phần lớn các việc quyền năng
  rationale: Câu chủ động tự nhiên trong tiếng Việt, vẫn quy các việc ấy cho Đức Giê-su; “phần lớn” giữ sắc thái so sánh cao nhất của πλεῖσται, còn “các việc quyền năng” bảo toàn mối liên hệ của δυνάμεις với quyền năng.
- source_word: ὅτι οὐ μετενόησαν
  choice: vì dân chúng không ăn năn
  rationale: “Vì” nêu lý do Ngài quở trách. Chủ thể số nhiều được diễn đạt là dân chúng trong các thành để tránh cách nói tiếng Việt thiếu tự nhiên rằng chính các đô thị ăn năn; “ăn năn” giữ trọng lượng luân lý và thuộc linh của μετανοέω.
theological_decisions:
- issue: Cách dịch δυνάμεις trong bối cảnh các phép lạ
  choice: các việc quyền năng
  alternative: các phép lạ
  rationale: “Các việc quyền năng” giữ trọng tâm của từ Hy Lạp vào quyền năng được biểu lộ và không thu hẹp từ này thành một thuật ngữ phân loại; chú thích nêu cách dịch tự nhiên khác.
- issue: Cách dịch μετενόησαν
  choice: không ăn năn
  alternative: không thay đổi lòng mình / không quay lại
  rationale: Trong ngữ cảnh này, động từ nói đến việc không đáp ứng thích đáng trước các việc của Đức Giê-su. “Ăn năn” vừa tự nhiên vừa giữ ý nghĩa luân lý-thuộc linh mà không thêm nội dung hệ phái.
- issue: Chủ thể của hành động ăn năn
  choice: dân chúng
  alternative: các thành ấy
  rationale: Ngữ pháp Hy Lạp quy đại từ ngầm cho “các thành” theo phép hoán dụ, tức cư dân của chúng. Nêu “dân chúng” làm rõ ý trong tiếng Việt mà không thay đổi đối tượng bị quở trách.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Giê-su” và đại từ “Ngài” theo lối tôn kính phổ thông; tránh lối cổ. Cấu trúc được điều chỉnh nhẹ sang câu chủ động và dùng “dân chúng” để truyền đạt rõ phép hoán dụ của nguyên văn.
