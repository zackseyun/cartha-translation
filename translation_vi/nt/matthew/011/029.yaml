review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch giữ đúng mệnh lệnh số nhiều, hình ảnh «ách», ý học từ Chúa Giê-su, lý do phẩm tính của Ngài, và lời hứa về sự an nghỉ. Tuy nhiên, «có lòng dịu dàng và khiêm nhường» làm mờ cấu trúc nguyên ngữ: πραΰς là vị ngữ tính từ «dịu dàng/nhu mì», còn ταπεινὸς τῇ καρδίᾳ xác định rõ «khiêm nhường trong lòng».'
  naturalness: «Hãy mang ách của tôi trên mình» và «học nơi tôi» đều có thể hiểu được, nhưng «mang lấy ách của tôi» và «học từ tôi» tự nhiên hơn trong tiếng Việt hiện đại. Cụm «vì tôi dịu dàng và khiêm nhường trong lòng» vừa trôi chảy vừa sát nghĩa.
  terminology: «Ách» và «sự an nghỉ» phù hợp với ẩn dụ và thanh điệu Kinh Thánh. «Tâm hồn» là lựa chọn có thể chấp nhận cho ψυχαῖς trong ngữ cảnh này. Đại từ «tôi/các con» nhất quán trong lời trực tiếp, dù đây là lựa chọn đăng ký văn phong hơn là đòi hỏi của nguyên ngữ.
  issues:
  - severity: medium
    issue: Cấu trúc «có lòng dịu dàng và khiêm nhường» không phản ánh rõ «khiêm nhường trong lòng».
    rationale: Nguyên ngữ đặt τῇ καρδίᾳ với ταπεινός, không mô tả cả hai phẩm tính như cùng là «có lòng». Sửa thành «tôi dịu dàng và khiêm nhường trong lòng» bảo toàn phạm vi cú pháp mà vẫn tự nhiên.
  - severity: low
    issue: «Học nơi tôi» và «mang ... trên mình» hơi kém tự nhiên trong văn xuôi Việt hiện đại.
    rationale: «Học từ tôi» là tương ứng trực tiếp, thông dụng cho ἀπ’ ἐμοῦ; «mang lấy ách ...» diễn tả thành ngữ tiếp nhận cái ách và tránh hình ảnh hơi gượng của «trên mình».
  revised_text: Hãy mang lấy ách của tôi và học từ tôi, vì tôi dịu dàng và khiêm nhường trong lòng; rồi các con sẽ tìm được sự an nghỉ cho tâm hồn mình.
