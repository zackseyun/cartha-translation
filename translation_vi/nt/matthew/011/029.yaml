id: MAT.11.29
reference: Matthew 11:29
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἄρατε τὸν ζυγόν μου ἐφ’ ὑμᾶς καὶ μάθετε ἀπ’ ἐμοῦ, ὅτι πραΰς εἰμι καὶ ταπεινὸς τῇ καρδίᾳ, καὶ εὑρήσετε ἀνάπαυσιν ταῖς ψυχαῖς ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/029.yaml
  text: Take my yoke upon you and learn from me[a], because I am gentle and humble in heart, and you will find rest for your souls.
translation:
  language: vi
  text: Hãy mang lấy ách của tôi và học từ tôi, vì tôi dịu dàng và khiêm nhường trong lòng; rồi các con sẽ tìm được sự an nghỉ cho tâm hồn mình.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄρατε τὸν ζυγόν μου ἐφ’ ὑμᾶς
  choice: Hãy mang ách của tôi trên mình
  rationale: Giữ nguyên hình ảnh cụ thể về cái ách và diễn đạt tự nhiên hành động tiếp nhận, mang lấy ách ấy; mệnh lệnh số nhiều được thể hiện bằng “hãy” và đại từ tập thể “các con” ở vế sau.
- source_word: ζυγόν
  choice: ách
  rationale: “Ách” là từ tương ứng trực tiếp, quen thuộc trong văn phong Kinh Thánh và bảo toàn ẩn dụ về sự thuận phục dưới sự dạy dỗ hoặc thẩm quyền.
- source_word: μάθετε ἀπ’ ἐμοῦ
  choice: học nơi tôi
  rationale: Diễn đạt tự nhiên việc học từ chính Chúa Giê-su, đồng thời có thể bao hàm cả tiếp nhận lời dạy lẫn noi theo Ngài.
- source_word: ὅτι
  choice: vì
  rationale: 'Thể hiện chức năng giải thích nguyên nhân: phẩm tính của Chúa Giê-su là lý do người nghe có thể mang ách và học nơi Ngài.'
- source_word: πραΰς
  choice: dịu dàng
  rationale: Truyền đạt sự ôn hòa, không khắc nghiệt mà không gợi ý sự yếu đuối như một số cách hiểu hiện đại của “nhu mì”.
- source_word: ταπεινὸς τῇ καρδίᾳ
  choice: có lòng ... khiêm nhường
  rationale: 'Giữ rõ τῇ καρδίᾳ là phẩm chất nội tâm, đồng thời tạo một cấu trúc tiếng Việt trôi chảy với πραΰς: “có lòng dịu dàng và khiêm nhường”.'
- source_word: εὑρήσετε
  choice: sẽ tìm được
  rationale: Giữ nguyên ý tương lai và sắc thái lời hứa của động từ.
- source_word: ἀνάπαυσιν
  choice: sự an nghỉ
  rationale: Bảo toàn ý nghỉ ngơi, thanh thản và âm hưởng Kinh Thánh, không thu hẹp thành sự giảm nhẹ nhất thời.
- source_word: ταῖς ψυχαῖς ὑμῶν
  choice: cho tâm hồn mình
  rationale: Dịch cách cho lợi ích bằng “cho”; “tâm hồn” diễn đạt đời sống nội tâm/con người bên trong một cách tự nhiên, còn “mình” quy chiếu trở lại nhóm người được gọi là “các con”.
theological_decisions:
- issue: Lời Chúa Giê-su tự mô tả bằng πραΰς καὶ ταπεινὸς τῇ καρδίᾳ
  choice: tôi có lòng dịu dàng và khiêm nhường
  alternative: tôi nhu mì và có lòng khiêm nhường
  rationale: Cách chọn giữ cả sự ôn hòa lẫn khiêm hạ nội tâm trong lời tự mô tả, không suy diễn thành một lập trường giáo lý riêng; “dịu dàng” dễ hiểu hơn trong tiếng Việt hiện đại.
- issue: Phạm vi nghĩa của ψυχή
  choice: tâm hồn
  alternative: linh hồn; chính mình
  rationale: “Tâm hồn” bảo toàn chiều kích nội tâm của con người mà không buộc câu này phải nói riêng về một thực thể tách biệt khỏi thân thể; đồng thời tự nhiên hơn “chính mình” trong cụm nói về sự an nghỉ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ ẩn dụ “ách” cùng âm hưởng “sự an nghỉ”. Dùng “tôi/các con” để diễn tả lời Chúa Giê-su nói với nhiều môn đồ; không dùng từ cổ nếu từ hiện đại truyền đạt nghĩa rõ hơn.
