revisions:
- from: Hãy mang ách của tôi trên mình và học nơi tôi, vì tôi có lòng dịu dàng và khiêm nhường; rồi các con sẽ tìm được sự an nghỉ cho tâm hồn mình.
  to: Hãy mang lấy ách của tôi và học từ tôi, vì tôi dịu dàng và khiêm nhường trong lòng; rồi các con sẽ tìm được sự an nghỉ cho tâm hồn mình.
  rationale: Điều chỉnh tối thiểu để làm rõ rằng «trong lòng» bổ nghĩa cho «khiêm nhường», phù hợp với ταπεινὸς τῇ καρδίᾳ; đồng thời dùng các kết hợp từ tự nhiên hơn trong tiếng Việt hiện đại. Không thay đổi hình ảnh «ách», sắc thái mệnh lệnh/lời hứa, hay phạm vi nghĩa của «tâm hồn».
  reviewer_model: gpt-5.6-terra
