id: MAT.11.19
reference: Matthew 11:19
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἦλθεν ὁ υἱὸς τοῦ ἀνθρώπου ἐσθίων καὶ πίνων, καὶ λέγουσιν· Ἰδοὺ ἄνθρωπος φάγος καὶ οἰνοπότης, τελωνῶν φίλος καὶ ἁμαρτωλῶν. καὶ ἐδικαιώθη ἡ σοφία ἀπὸ τῶν ⸀ἔργων αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/019.yaml
  text: The Son of Man came eating and drinking[a], and they say, ‘Look, a glutton and a drunkard[b], a friend of tax collectors and sinners!’ And wisdom was justified by her works.
translation:
  language: vi
  text: 'Con Người đến, ăn và uống, thì họ nói: “Kìa, một kẻ tham ăn, một kẻ say rượu, bạn của những người thu thuế và những kẻ tội lỗi!” Và sự khôn ngoan được chứng tỏ là đúng qua những việc làm của mình.[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Và sự khôn ngoan được minh chứng qua những việc làm của mình.”'
    reason: lexical_alternative
  - marker: b
    text: 'Một số thủ bản chép “con cái” thay cho “việc làm”: “Sự khôn ngoan được chứng tỏ là đúng qua con cái của mình.”'
    reason: textual_variant
lexical_decisions:
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Con Người
  rationale: Cách dịch danh hiệu đã quen thuộc trong Kinh Thánh tiếng Việt, bảo toàn nền tảng Semit cùng ý nghĩa cứu thế và thần học mà không diễn giải thêm.
- source_word: ἐσθίων καὶ πίνων
  choice: ăn và uống
  rationale: Diễn đạt trực tiếp hai phân từ, giữ sự tương phản trong văn cảnh với lối sống khổ hạnh của Giăng mà không cường điệu thành ăn tiệc.
- source_word: Ἰδοὺ
  choice: Kìa
  rationale: Từ cảm thán tự nhiên, trang trọng vừa phải, giữ sắc thái chỉ trỏ và lên án công khai.
- source_word: φάγος
  choice: một kẻ tham ăn
  rationale: Giữ nguyên sắc thái miệt thị của danh từ chỉ người ăn uống quá độ.
- source_word: οἰνοπότης
  choice: nghiện rượu
  rationale: Trong lời buộc tội này, từ ngữ hàm ý uống rượu quá độ chứ không chỉ trung tính là người uống rượu.
- source_word: τελωνῶν φίλος καὶ ἁμαρτωλῶν
  choice: bạn của những người thu thuế và những kẻ tội lỗi
  rationale: Bảo toàn cấu trúc và sức nặng xã hội–tôn giáo của hai nhãn gọi; “người thu thuế” dễ hiểu hơn thuật ngữ cổ “người thu thuế vụ”.
- source_word: ἐδικαιώθη
  choice: được chứng tỏ là đúng
  rationale: Trong câu này, động từ mang nghĩa được các kết quả xác nhận là đúng. Cách dịch này tự nhiên trong tiếng Việt và tránh khiến người đọc hiểu theo nghĩa pháp lý hoặc nghĩa được xưng công chính của người có tội.
- source_word: ἡ σοφία
  choice: sự khôn ngoan
  rationale: Giữ nguyên hình ảnh nhân cách hóa mà không đồng nhất rõ ràng với Chúa Giê-xu, kế hoạch của Đức Chúa Trời hay một cách giải thích riêng.
- source_word: ἀπὸ τῶν ἔργων αὐτῆς
  choice: qua những việc làm của mình
  rationale: “Qua” diễn đạt tự nhiên phương diện bằng chứng trong thành ngữ này; “của mình” duy trì nét nhân cách hóa nhưng tránh đại từ giống cái gượng ép trong tiếng Việt.
theological_decisions:
- issue: Ý nghĩa của “sự khôn ngoan” trong mệnh đề cuối
  choice: Giữ nguyên cách nói nhân cách hóa “sự khôn ngoan”, không xác định cụ thể đối tượng.
  alternative: Đồng nhất sự khôn ngoan với chính Chúa Giê-xu hoặc với sự khôn ngoan/chương trình cứu rỗi của Đức Chúa Trời.
  rationale: Bản văn không giải thích rõ đối tượng, nên bản dịch bảo toàn tính hàm nghĩa và sức căng thần học thay vì thu hẹp theo một cách giải nghĩa.
- issue: Dạng văn bản của mệnh đề cuối
  choice: Theo SBLGNT với ἔργων, “những việc làm”, trong chính văn.
  alternative: τέκνων, “con cái”, có trong một số thủ bản và trong câu song song Lu-ca 7:35.
  rationale: Nguồn Hy Lạp được chỉ định đọc ἔργων; dị bản nổi bật được ghi chú để người đọc có thể kiểm chứng.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Lời buộc tội được giữ sắc bén; mệnh đề kết giữ tính cách ngôn và nét nhân cách hóa mà không dùng đại từ giống cái vốn thiếu tự nhiên trong tiếng Việt.
