revisions:
- from: 'Con Người đến, ăn và uống, thì họ nói: “Kìa, một kẻ tham ăn, nghiện rượu, bạn của những người thu thuế và những kẻ tội lỗi!” Và sự khôn ngoan được chứng tỏ là đúng qua những việc làm của mình.[a][b]'
  to: 'Con Người đến, ăn và uống, thì họ nói: “Kìa, một kẻ tham ăn, một kẻ say rượu, bạn của những người thu thuế và những kẻ tội lỗi!” Và sự khôn ngoan được chứng tỏ là đúng qua những việc làm của mình.[a][b]'
  rationale: Chỉ thay thuật ngữ chỉ lời tố cáo về rượu để tránh diễn giải οἰνοπότης thành một chẩn đoán nghiện rượu theo cách hiểu hiện đại. Giữ nguyên cách đọc “việc làm” của SBLGNT, tính nhân cách hóa của “sự khôn ngoan,” và các chú thích về lựa chọn từ vựng cùng dị bản “con cái.”
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T02:45:49Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch theo đúng bản SBLGNT: danh hiệu “Con Người,” lời tố cáo về việc ăn uống, “bạn của những người thu thuế và những kẻ tội lỗi,” và cách đọc ἔργων (“việc làm”) đều được bảo toàn. Tuy nhiên, “nghiện rượu” trong tiếng Việt hiện đại thường gợi một chẩn đoán lệ thuộc rượu, mạnh và cụ thể hơn lời miệt thị οἰνοπότης trong ngữ cảnh này.'
  naturalness: Câu văn nhìn chung tự nhiên và đúng giọng văn Kinh Thánh hiện đại. Thay “nghiện rượu” bằng “say rượu” giữ được tính lên án mà tránh sắc thái chẩn đoán y khoa/xã hội hiện đại.
  terminology: “Con Người,” “sự khôn ngoan,” “người thu thuế,” và “kẻ tội lỗi” phù hợp. “Được chứng tỏ là đúng” diễn đạt tốt nghĩa xác nhận/minh oan của ἐδικαιώθη mà không áp đặt nghĩa pháp lý hay thần học.
  issues:
