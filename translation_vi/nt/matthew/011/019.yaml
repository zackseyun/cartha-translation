    rationale: οἰνοπότης là một nhãn miệt thị về người uống rượu quá độ/“drunkard,” không nhất thiết khẳng định tình trạng nghiện theo nghĩa hiện đại. “Kẻ say rượu” sát và trung tính hơn về mặt này.
