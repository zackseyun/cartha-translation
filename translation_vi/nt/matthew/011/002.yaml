  text: Ὁ δὲ Ἰωάννης ἀκούσας ἐν τῷ δεσμωτηρίῳ τὰ ἔργα τοῦ χριστοῦ πέμψας ⸀διὰ τῶν μαθητῶν αὐτοῦ
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/002.yaml
  text: When John heard in prison about the works of the Messiah[a], he sent word through his disciples
translation:
  language: vi
  text: Khi đang ở trong tù, Giăng nghe về những việc Đấng Mê-si làm, ông sai các môn đồ của mình đi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: không dịch thành một từ riêng
  rationale: Tiểu từ này đánh dấu bước chuyển trong mạch kể; cấu trúc câu tiếng Việt đã thể hiện sự chuyển ý tự nhiên, nên thêm “bấy giờ” hoặc “nhưng” sẽ dễ gợi sắc thái thời gian hay tương phản mạnh hơn nguyên văn.
- source_word: ἀκούσας
  choice: Khi ... nghe
  rationale: Chuyển phân từ bất định quá khứ thành mệnh đề thời gian tự nhiên trong tiếng Việt, đồng thời giữ quan hệ hành động nghe xảy ra trước hành động sai truyền lời.
- source_word: ἐν τῷ δεσμωτηρίῳ
  choice: đang ở trong tù
  rationale: Cách nói thông dụng, rõ nghĩa trong tiếng Việt; “đang ở” diễn đạt hoàn cảnh của Giăng khi ông nghe tin.
- source_word: τὰ ἔργα
  choice: những việc ... làm
  rationale: Diễn đạt tự nhiên hơn “các công việc” trong ngữ cảnh kể về những hành động của Chúa Giê-su, mà vẫn giữ phạm vi nghĩa rộng của ἔργα.
- source_word: τοῦ χριστοῦ
  choice: Đấng Mê-si
  rationale: Χριστός ở đây mang chức năng tước hiệu, chỉ Đấng được xức dầu; “Đấng Mê-si” truyền đạt ý nghĩa và bối cảnh Do Thái rõ hơn cách dùng “Đấng Christ” như một tên riêng.
- source_word: πέμψας διὰ τῶν μαθητῶν αὐτοῦ
  choice: ông nhờ các môn đồ của mình chuyển lời
  rationale: διά với sở hữu cách diễn tả các môn đồ là người trung gian. “Chuyển lời” thể hiện tự nhiên đối tượng được hiểu ngầm của hành động sai phái mà không đưa nội dung câu hỏi ở câu kế tiếp vào câu này.
theological_decisions:
- issue: Cách dịch Χριστός
  choice: Đấng Mê-si
  alternative: Đấng Christ
  rationale: Trong câu này từ ngữ hoạt động như một tước hiệu nói về các việc của Đấng được xức dầu. Bản dịch chính nêu rõ ý nghĩa tước hiệu, còn cách gọi truyền thống được giữ trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Câu giữ nguyên tính tiếp nối sang câu 3; không thêm nội dung câu hỏi hoặc người nhận vốn chưa xuất hiện trong phần nguyên văn được cung cấp.
