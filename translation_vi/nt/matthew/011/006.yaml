  text: καὶ μακάριός ἐστιν ὃς ⸀ἐὰν μὴ σκανδαλισθῇ ἐν ἐμοί.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/006.yaml
  text: And blessed is the one who is not offended by me[a].
translation:
  language: vi
  text: Và phước cho người nào không vấp ngã vì tôi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “không bị vấp ngã vì tôi,” “không lấy tôi làm cớ vấp ngã,” hoặc “không bị xúc phạm vì tôi.”'
    reason: 'Nêu các sắc thái khả dĩ của σκανδαλισθῇ ἐν ἐμοί: vấp ngã, lấy Đức Giê-su làm chướng ngại hay cớ vấp ngã, hoặc bị xúc phạm vì Ngài.'
lexical_decisions:
- source_word: καὶ
  choice: Và
  rationale: Giữ mối liên kết trực tiếp của lời tuyên bố này với ngữ cảnh ngay trước đó.
- source_word: μακάριός
  choice: phước cho
  rationale: Cách diễn đạt tự nhiên trong văn phong Kinh Thánh tiếng Việt, giữ được sắc thái tuyên bố ân phước hơn là chỉ trạng thái vui vẻ hay may mắn.
- source_word: ὃς ἐὰν μὴ
  choice: người nào không
  rationale: Diễn đạt tự nhiên ý nghĩa phiếm chỉ và điều kiện của cấu trúc Hy Lạp, không giới hạn vào một người cụ thể.
- source_word: σκανδαλισθῇ
  choice: vấp ngã
  rationale: Giữ hình ảnh ẩn dụ về sự vấp ngã và hàm ý bị cản trở trong đức tin, thay vì thu hẹp nghĩa vào cảm giác bị xúc phạm.
- source_word: ἐν ἐμοί
  choice: vì tôi
  rationale: Trong kết hợp này, cụm từ chỉ Đức Giê-su là nguyên cớ hay dịp khiến người ta vấp ngã; “vì tôi” tự nhiên trong tiếng Việt và không quy trực tiếp cho Ngài hành động làm người ấy ngã.
theological_decisions:
- issue: Mức độ và nguyên nhân của σκανδαλισθῇ ἐν ἐμοί
  choice: không vì tôi mà vấp ngã
  alternative: không thấy bị xúc phạm vì tôi / không lấy tôi làm cớ vấp phạm
  rationale: Bản chính giữ ẩn dụ vấp ngã cùng sự căng thẳng giữa việc tiếp nhận Đức Giê-su và việc vì Ngài mà chùn bước hoặc lìa bỏ đức tin, nhưng không diễn giải quá mức rằng chính Ngài chủ động khiến người ta ngã.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Cấu trúc “phước cho người nào” gợi âm hưởng lời chúc phước mà vẫn tự nhiên; đảo cụm “vì tôi” lên trước “mà vấp ngã” để câu rõ nghĩa.
