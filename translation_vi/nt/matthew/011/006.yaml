    rationale: '“Không thấy bị xúc phạm vì tôi” không phải cách nói Việt ngữ tự nhiên; “không lấy tôi làm cớ vấp phạm” có thể đổi chủ thể/hướng của hành động. Cần nêu các phương án sát nghĩa: bị vấp ngã vì tôi; lấy làm chướng ngại/cớ vấp ngã; bị xúc phạm vì tôi.'
