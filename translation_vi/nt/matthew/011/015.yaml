id: MAT.11.15
reference: Matthew 11:15
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὁ ἔχων ⸀ὦτα ἀκουέτω.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/015.yaml
  text: The one who has ears[a], let him hear.
translation:
  language: vi
  text: Ai có tai[a], hãy nghe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Người nào có tai thì hãy nghe.” Tiếng Hy Lạp dùng cách nói số ít mang nghĩa khái quát và danh từ “tai” ở số nhiều.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἔχων
  choice: Ai có
  rationale: Mạo từ đi với phân từ hiện tại được dùng như danh từ, chỉ khái quát bất cứ người nào có đặc điểm được nói đến. “Ai có” tự nhiên trong tiếng Việt và giữ được ý nghĩa khái quát của cách nói số ít.
- source_word: ὦτα
  choice: tai
  rationale: Từ Hy Lạp ở dạng số nhiều, nghĩa là “những tai”. Trong tiếng Việt, danh từ “tai” không cần dấu hiệu số nhiều trong thành ngữ này; cách dịch vẫn truyền đạt đầy đủ lời kêu gọi dùng khả năng nghe.
- source_word: ἀκουέτω
  choice: hãy nghe
  rationale: Động từ là mệnh lệnh cách ngôi thứ ba, thì hiện tại. “Hãy nghe” diễn đạt tự nhiên lời thúc giục phải chú ý, tiếp nhận và làm theo, đồng thời không thu hẹp nghĩa chỉ còn hành động lắng nghe bằng tai.
theological_decisions:
- issue: Cách nói giống đực số ít mang nghĩa khái quát
  choice: Ai có tai, hãy nghe.
  alternative: Người nào có tai thì người ấy hãy nghe.
  rationale: Tiếng Hy Lạp dùng cấu trúc giống đực số ít nhưng mang nghĩa khái quát. Tiếng Việt không đánh dấu giống ngữ pháp trong đại từ “ai”, nên cách dịch này bảo toàn phạm vi chỉ mọi người mà không thêm ý phân biệt giới tính vốn không thuộc trọng tâm của câu.
translation_notes:
  register: Lời văn ngắn gọn, trang trọng và tự nhiên trong tiếng Việt hiện đại. Dấu phẩy giữ nhịp của câu mệnh lệnh Hy Lạp; “hãy nghe” bảo toàn sắc thái kêu gọi chú tâm và đáp ứng.
