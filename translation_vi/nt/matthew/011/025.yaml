revisions:
- from: 'Lúc ấy, Đức Giê-su cất tiếng nói: “Lạy Cha, Chúa của trời và đất, con ca ngợi Cha[a], vì Cha đã giấu những điều này khỏi những người khôn ngoan và hiểu biết, nhưng lại bày tỏ chúng cho trẻ thơ[b].”'
  to: 'Lúc ấy, Đức Giê-su đáp lời và nói: “Lạy Cha, Chúa của trời và đất, con ca ngợi Cha[a], vì Cha đã giấu những điều này khỏi những người khôn ngoan và hiểu biết, và bày tỏ chúng cho trẻ thơ[b].”'
  rationale: Chỉnh «cất tiếng nói» thành «đáp lời và nói» để giữ cả hai thành tố của ἀποκριθεὶς ... εἶπεν, đồng thời thay «nhưng lại» bằng «và» để không thêm một liên từ đối nghịch không có trong nguyên văn. Những phần còn lại và các chú thích được giữ nguyên vì trung thành với bản Hy Lạp và tự nhiên trong tiếng Việt hiện đại.
