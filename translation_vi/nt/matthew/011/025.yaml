id: MAT.11.25
reference: Matthew 11:25
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἐν ἐκείνῳ τῷ καιρῷ ἀποκριθεὶς ὁ Ἰησοῦς εἶπεν· Ἐξομολογοῦμαί σοι, πάτερ κύριε τοῦ οὐρανοῦ καὶ τῆς γῆς, ὅτι ⸀ἔκρυψας ταῦτα ἀπὸ σοφῶν καὶ συνετῶν, καὶ ἀπεκάλυψας αὐτὰ νηπίοις·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/025.yaml
  text: At that time Jesus answered and said[a], “I praise you, Father, Lord of heaven and earth, because you hid these things from the wise and understanding[b], and revealed them to little children.”
translation:
  language: vi
  text: 'Lúc ấy, Đức Giê-su đáp lời và nói: “Lạy Cha, Chúa của trời và đất, con ca ngợi Cha[a], vì Cha đã giấu những điều này khỏi những người khôn ngoan và hiểu biết, và bày tỏ chúng cho trẻ thơ[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “con cảm tạ Cha.” Động từ Hy Lạp có thể diễn tả sự cảm tạ, ca ngợi hoặc công khai nhìn nhận.'
    reason: lexical_alternative
  - marker: b
    text: Nguyên ngữ cũng có thể chỉ “trẻ sơ sinh.” Ở đây, “trẻ thơ” có lẽ được dùng theo nghĩa ẩn dụ về những người có tư thế đơn sơ, dễ tiếp nhận như trẻ nhỏ.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν ἐκείνῳ τῷ καιρῷ
  choice: Lúc ấy
  rationale: Cách diễn đạt thời gian tự nhiên trong tiếng Việt, giữ nguyên bối cảnh tường thuật mà không hàm ý một thời điểm tức khắc hơn bản Hy Lạp.
- source_word: ἀποκριθεὶς ... εἶπεν
  choice: cất tiếng nói
  rationale: Diễn đạt tự nhiên công thức tường thuật mang ảnh hưởng Sê-mít ‘đáp lại và nói’; tránh tạo cảm giác rằng trước đó có một câu hỏi trực tiếp, nhưng vẫn cho thấy Đức Giê-su lên tiếng đáp ứng hoàn cảnh.
- source_word: Ἐξομολογοῦμαί σοι
  choice: con ca ngợi Cha
  rationale: Trong lời thưa trực tiếp với Cha, động từ chỉ sự công khai nhìn nhận kèm sắc thái ca ngợi hoặc cảm tạ. ‘Ca ngợi’ phù hợp giọng tôn vinh và không gợi ý việc xưng tội.
- source_word: πάτερ κύριε τοῦ οὐρανοῦ καὶ τῆς γῆς
  choice: Lạy Cha, Chúa của trời và đất
  rationale: Giữ chuỗi hô cách và quyền tể trị được diễn tả bởi κύριος; ‘Lạy’ tạo lối xưng hô trang trọng, tự nhiên trong tiếng Việt.
- source_word: ὅτι
  choice: vì
  rationale: Thể hiện trực tiếp căn nguyên hoặc nội dung làm cơ sở cho lời ca ngợi trong ngữ cảnh.
- source_word: ἔκρυψας
  choice: Cha đã giấu
  rationale: Giữ động từ chủ động và quy trực tiếp hành động cho Cha như bản Hy Lạp.
- source_word: ταῦτα ... αὐτά
  choice: những điều này ... chúng
  rationale: Giữ tính mở về đối tượng được nhắc đến, không giải thích thêm đó là chân lý hay mầu nhiệm nào.
- source_word: ἀπὸ σοφῶν καὶ συνετῶν
  choice: khỏi những người khôn ngoan và hiểu biết
  rationale: Giữ hai tính từ được dùng như danh từ chỉ người và sự phân biệt sắc thái giữa khôn ngoan với có khả năng hiểu biết.
- source_word: ἀπεκάλυψας
  choice: bày tỏ
  rationale: Cách nói hiện đại, dễ hiểu cho hành động làm cho điều bị che khuất trở nên được biết, đồng thời vẫn giữ ý nghĩa về sự tỏ lộ của Đức Chúa Trời.
- source_word: νηπίοις
  choice: trẻ thơ
  rationale: Giữ hình ảnh cụ thể của từ Hy Lạp, vốn có thể chỉ trẻ nhỏ hoặc trẻ sơ sinh, mà không thay bằng một khái niệm diễn giải như ‘người khiêm nhường’.
theological_decisions:
- issue: Tác động trực tiếp của Cha trong việc giấu và bày tỏ
  choice: 'Giữ lời quy trực tiếp cho Cha: ‘Cha đã giấu ... nhưng lại bày tỏ’'
  alternative: Làm nhẹ thành ngôn ngữ cho phép, chẳng hạn ‘Cha đã để cho những điều này vẫn bị che giấu’
  rationale: Hai động từ Hy Lạp đều ở thể chủ động với Cha là chủ thể. Bản dịch duy trì căng thẳng thần học của câu, không tự ý giải thích theo tiền định, sự phán xét hay sự cho phép.
- issue: Ý nghĩa của νηπίοις
  choice: Giữ ẩn dụ bằng ‘trẻ thơ’
  alternative: Dịch sát theo độ tuổi là ‘trẻ sơ sinh’, hoặc giải nghĩa thành ‘người khiêm nhường’
  rationale: Ngữ cảnh đối lập những người được xem là khôn ngoan, hiểu biết với những người giống trẻ nhỏ trong tư thế tiếp nhận. ‘Trẻ thơ’ bảo tồn hình ảnh mà không đóng khung ý nghĩa thần học.
- issue: Cách xưng hô giữa Đức Giê-su và Cha
  choice: Dùng cặp xưng hô tự nhiên ‘con ... Cha’
  alternative: Dùng đại từ trung tính hoặc lặp danh xưng mà không thể hiện quan hệ
  rationale: Tiếng Việt cần chọn đại từ theo quan hệ. Cặp ‘con ... Cha’ diễn đạt tự nhiên quan hệ đã có ngay trong πάτερ, không thêm một tuyên bố giáo lý ngoài câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng nhưng dễ hiểu. Dùng ‘Đức Giê-su’ và lối thưa ‘Lạy Cha’ phù hợp văn bản Kinh Thánh tiếng Việt; tránh thuật ngữ quá chuyên biệt bằng cách chọn ‘bày tỏ’ thay cho một từ thần học khó hơn. Cấu trúc đối lập được làm rõ bằng ‘nhưng lại’ mà không thay đổi tác nhân của hai hành động.
