id: MAT.11.21
reference: Matthew 11:21
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Οὐαί σοι, Χοραζίν· οὐαί σοι, Βηθσαϊδά· ὅτι εἰ ἐν Τύρῳ καὶ Σιδῶνι ἐγένοντο αἱ δυνάμεις αἱ γενόμεναι ἐν ὑμῖν, πάλαι ἂν ἐν σάκκῳ καὶ σποδῷ μετενόησαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/021.yaml
  text: Woe to you[a], Chorazin! Woe to you, Bethsaida! For if the mighty works done among you had taken place in Tyre and Sidon, they would have repented long ago in sackcloth and ashes.
translation:
  language: vi
  text: “Khốn cho ngươi, hỡi Cô-ra-xin! Khốn cho ngươi, hỡi Bết-sai-đa! Vì nếu những việc quyền năng[a] đã xảy ra giữa các ngươi mà xảy ra tại Ty-rơ và Si-đôn, thì họ đã ăn năn từ lâu trong áo vải thô và tro bụi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “các phép lạ”; tiếng Hy Lạp có nghĩa là “những việc quyền năng” hoặc “những việc thể hiện quyền năng.”
    reason: Nêu phương án từ vựng quen thuộc hơn mà vẫn giải thích sắc thái của danh từ Hy Lạp.
lexical_decisions:
- source_word: Οὐαί σοι
  choice: Khốn cho ngươi
  rationale: Giữ được sắc thái vừa than tiếc vừa tuyên cáo sự phán xét của lời cảnh báo mang tính tiên tri; đại từ số ít phù hợp với việc trực tiếp gọi từng thành.
- source_word: Χοραζίν
  choice: Cô-ra-xin
  rationale: Phiên âm địa danh Hy Lạp theo lối viết dễ đọc và quen thuộc trong tiếng Việt.
- source_word: Βηθσαϊδά
  choice: Bết-sai-đa
  rationale: Phiên âm địa danh theo quy ước tiếng Việt hiện hành.
- source_word: ὅτι
  choice: Vì
  rationale: Giới thiệu lý do cho lời tuyên bố 'Khốn cho ngươi'.
- source_word: εἰ ... ἂν ... μετενόησαν
  choice: nếu ... thì ... đã ... rồi
  rationale: Diễn đạt tự nhiên điều kiện trái với thực tế trong quá khứ mà không làm mất tính giả định của nguyên văn.
- source_word: αἱ δυνάμεις
  choice: những việc quyền năng
  rationale: Chỉ những việc bày tỏ quyền năng, thường là các phép lạ, đồng thời giữ được mối liên hệ từ vựng với ý niệm 'quyền năng'.
- source_word: ἐν ὑμῖν
  choice: giữa các ngươi
  rationale: Đại từ số nhiều chỉ dân cư của hai thành; 'giữa' nói đến những việc xảy ra trong cộng đồng của họ, không phải bên trong họ.
- source_word: πάλαι
  choice: từ lâu rồi
  rationale: Chuyển tải rõ ý rằng sự ăn năn giả định ấy hẳn đã xảy ra sớm hơn từ lâu.
- source_word: ἐν σάκκῳ καὶ σποδῷ
  choice: mặc áo vải thô, ngồi trong tro
  rationale: Diễn đạt cụ thể và tự nhiên trong tiếng Việt hai dấu hiệu văn hóa của sự đau buồn và ăn năn, dù động từ 'mặc' và 'ngồi' được hàm ý chứ không xuất hiện riêng trong tiếng Hy Lạp.
- source_word: μετενόησαν
  choice: ăn năn
  rationale: Là cách diễn đạt tự nhiên, chính xác trong văn cảnh lời kêu gọi quay khỏi tội lỗi, tránh cách dịch máy móc 'thay đổi suy nghĩ'.
theological_decisions:
- issue: Tính chất của sự so sánh với Ty-rơ và Si-đôn
  choice: Giữ nguyên lời khẳng định phản thực rằng hai thành ngoại bang ấy hẳn đã ăn năn nếu chứng kiến những việc quyền năng này.
  alternative: Hiểu câu này chỉ là lời cường điệu tu từ, không hàm ý sự so sánh thực về trách nhiệm.
  rationale: Cấu trúc điều kiện phản thực làm nổi bật trách nhiệm lớn hơn của các thành đã chứng kiến những việc quyền năng nhưng không ăn năn; bản dịch không bổ sung kết luận giáo lý vượt quá câu văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “ngươi/các ngươi” để bảo toàn sự chuyển đổi từ lời gọi trực tiếp từng thành ở số ít sang lời nói với dân chúng hai thành ở số nhiều. Cụm “mặc áo vải thô, ngồi trong tro” làm rõ thành ngữ văn hóa mà vẫn giữ nguyên hình ảnh của nguyên văn.
