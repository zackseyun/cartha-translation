revisions:
- from: “Khốn cho ngươi, hỡi Cô-ra-xin! Khốn cho ngươi, hỡi Bết-sai-đa! Vì nếu những việc quyền năng[a] đã được thực hiện giữa các ngươi mà được thực hiện tại Ty-rơ và Si-đôn, thì họ đã mặc áo vải thô, ngồi trong tro và ăn năn từ lâu rồi.”
  to: “Khốn cho ngươi, hỡi Cô-ra-xin! Khốn cho ngươi, hỡi Bết-sai-đa! Vì nếu những việc quyền năng[a] đã xảy ra giữa các ngươi mà xảy ra tại Ty-rơ và Si-đôn, thì họ đã ăn năn từ lâu trong áo vải thô và tro bụi.”
  rationale: Bản sửa loại bỏ hành động “ngồi” vốn không có trong nguyên văn, giữ thành ngữ về áo vải thô và tro bụi, đồng thời làm trôi chảy cách diễn đạt của mệnh đề phản thực mà không thay đổi ý nghĩa hay mức độ nhấn mạnh.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T02:45:39Z'
review_pass:
  verdict: revise
  source_fidelity: Bản nháp truyền đạt đúng lời than trách, cấu trúc điều kiện phản thực, các việc quyền năng, và ý ăn năn từ lâu. Tuy nhiên, “ngồi trong tro” thêm một hành động không được nêu trong tiếng Hy Lạp; nguyên văn chỉ dùng thành ngữ “trong áo vải thô và tro bụi.” Cụm “đã được thực hiện giữa các ngươi mà được thực hiện tại...” cũng nặng và chưa tự nhiên.
  naturalness: Cần thay cấu trúc lặp bị động bằng “đã xảy ra giữa các ngươi mà xảy ra tại...”, vừa tự nhiên vừa vẫn phản ánh sự lặp lại của γίνομαι. “Trong áo vải thô và tro bụi” là cách diễn đạt hiện đại, trang trọng và giữ hình ảnh nguyên văn mà không thêm chi tiết.
  terminology: “Khốn cho ngươi,” “những việc quyền năng,” và “ăn năn” phù hợp văn cảnh và giữ được sắc thái phán xét/than tiếc, quyền năng, và sự hoán cải của nguyên văn. Giữ chú thích cho “những việc quyền năng” là hữu ích.
  issues:
  - severity: medium
    issue: Thêm chi tiết “ngồi trong tro”
    rationale: Cụm ἐν σάκκῳ καὶ σποδῷ chỉ nói “trong áo vải thô và tro bụi/tro”; không có động từ “ngồi”. Dù là hình ảnh văn hóa quen thuộc, việc thêm hành động này vượt quá câu nguồn.
  - severity: low
    issue: Cấu trúc “đã được thực hiện ... mà được thực hiện” nặng và không tự nhiên
    rationale: Sự lặp lại của γίνομαι không đòi phải lặp cùng một bị động tiếng Việt. “Đã xảy ra ... mà xảy ra” vừa mượt vừa bảo toàn đối chiếu phản thực.
  revised_text: “Khốn cho ngươi, hỡi Cô-ra-xin! Khốn cho ngươi, hỡi Bết-sai-đa! Vì nếu những việc quyền năng[a] đã xảy ra giữa các ngươi mà xảy ra tại Ty-rơ và Si-đôn, thì họ đã ăn năn từ lâu trong áo vải thô và tro bụi.”
  revised_footnotes:
