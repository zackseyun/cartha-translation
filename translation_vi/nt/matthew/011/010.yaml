- from: 'Đây chính là người mà lời chép sau đây nói đến: “Này, ta sai sứ giả của ta đi trước mặt ngươi; người sẽ chuẩn bị con đường của ngươi ở phía trước ngươi.”'
  to: 'Đây chính là người mà có chép về người ấy rằng: “Này, ta sai sứ giả của ta đi trước mặt ngươi; người ấy sẽ chuẩn bị con đường của ngươi ở phía trước ngươi.”'
  rationale: 'Chỉ sửa phần dẫn nhập để bỏ ý thêm “sau đây,” phục hồi rõ công thức trích dẫn của nguyên văn, và làm câu tiếng Việt tự nhiên hơn. Lời trích dẫn được giữ sát bản nháp: vẫn dùng “sứ giả,” vẫn bảo tồn hai cụm chỉ vị trí, và không áp đặt cách giải thích thần học qua đại từ xưng hô.'
