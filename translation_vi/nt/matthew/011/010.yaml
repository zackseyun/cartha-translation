id: MAT.11.10
reference: Matthew 11:10
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸀οὗτός ἐστιν περὶ οὗ γέγραπται· Ἰδοὺ ἐγὼ ἀποστέλλω τὸν ἄγγελόν μου πρὸ προσώπου σου, ὃς κατασκευάσει τὴν ὁδόν σου ἔμπροσθέν σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/010.yaml
  text: 'This is he about whom it is written: ‘Behold[a], I am sending my messenger before your face, who will prepare your way before you.’'
translation:
  language: vi
  text: 'Đây chính là người mà có chép về người ấy rằng: “Này, ta sai sứ giả của ta đi trước mặt ngươi; người ấy sẽ chuẩn bị con đường của ngươi ở phía trước ngươi.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὗτός
  choice: Đây chính là người
  rationale: Diễn đạt rõ chức năng xác định và sắc thái nhấn mạnh của đại từ chỉ định, đồng thời tự nhiên trong tiếng Việt hiện đại.
- source_word: περὶ οὗ γέγραπται
  choice: mà lời chép sau đây nói đến
  rationale: Giữ ý rằng lời được chép nói về người này, đồng thời chuyển công thức bị động Hy Lạp sang một cấu trúc tiếng Việt tự nhiên mà không buộc phải thêm danh từ “Kinh Thánh” vào chính văn.
- source_word: Ἰδοὺ
  choice: Này
  rationale: Từ dẫn trang trọng, gọn và quen thuộc trong lời tiên tri, có tác dụng hướng sự chú ý đến lời công bố tiếp theo.
- source_word: ἀποστέλλω
  choice: ta sai ... đi
  rationale: “Sai đi” truyền đạt đúng ý phái một người làm nhiệm vụ và phù hợp với hiện tại mang sức hướng tới tương lai trong lời trích dẫn.
- source_word: ἄγγελόν
  choice: sứ giả
  rationale: Trong ngữ cảnh này từ này chỉ một người được sai đi, tức người đi trước, chứ không nhất thiết là một thiên sứ.
- source_word: πρὸ προσώπου σου
  choice: trước mặt ngươi
  rationale: Giữ hình ảnh cụ thể “trước mặt” của nguyên văn và sắc thái trang trọng của lời trích dẫn.
- source_word: κατασκευάσει
  choice: sẽ chuẩn bị
  rationale: Diễn đạt trực tiếp hành động làm cho sẵn sàng, đồng thời giữ rõ thì tương lai.
- source_word: τὴν ὁδόν σου
  choice: con đường của ngươi
  rationale: “Con đường” bảo tồn được cả hình ảnh đường đi cụ thể lẫn ý nghĩa rộng hơn về việc chuẩn bị lối đi.
- source_word: ἔμπροσθέν σου
  choice: ở phía trước ngươi
  rationale: Phân biệt tự nhiên với “trước mặt ngươi” ở vế trước, nhưng vẫn giữ cụm từ thứ hai và tính song song của nguyên văn.
theological_decisions:
- issue: Hai cụm từ gần nghĩa trong lời trích dẫn
  choice: Giữ cả “trước mặt ngươi” và “ở phía trước ngươi”
  alternative: Gộp hoặc làm trơn thành một cụm duy nhất như “đi trước ngươi”
  rationale: Nguyên văn có cả πρὸ προσώπου σου và ἔμπροσθέν σου. Giữ cả hai tránh xóa bỏ sự lặp lại có tính nhấn mạnh và bảo tồn hình thức của lời Kinh Thánh được trích dẫn.
- issue: Cách hiểu ἄγγελος trong ngữ cảnh
  choice: sứ giả
  alternative: thiên sứ
  rationale: Câu này nói về người được sai đi để chuẩn bị đường; từ Hy Lạp có thể chỉ người đưa tin hoặc thiên sứ, và ngữ cảnh xác định chức năng sứ giả của một con người.
- issue: Đại từ trong lời Thiên Chúa phán với nhân vật được xưng hô
  choice: ta / ngươi
  alternative: Ta / Con hoặc tôi / bạn
  rationale: “Ta/ngươi” giữ giọng trang trọng và quan hệ quyền uy trong lời tiên tri mà không diễn giải thêm quan hệ thần học bằng đại từ “Con”.
translation_notes:
  register: Văn phong trang trọng nhưng dễ hiểu, phù hợp với lời trích dẫn tiên tri. Cấu trúc mở đầu được diễn đạt tự nhiên trong tiếng Việt; phần trích dẫn cố ý giữ hai cụm chỉ vị trí gần nghĩa để phản ánh sát kết cấu Hy Lạp.
