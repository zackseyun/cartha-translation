  text: ἦλθεν γὰρ Ἰωάννης μήτε ἐσθίων μήτε πίνων, καὶ λέγουσιν· Δαιμόνιον ἔχει·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/018.yaml
  text: For John came neither eating nor drinking[a], and they say, ‘He has a demon.’
translation:
  language: vi
  text: 'Vì Giăng đến, không ăn cũng không uống, và họ nói: “Ông ấy có quỷ.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Ông ấy bị quỷ ám.” Tiếng Hy Lạp dịch sát là: “Ông ấy có quỷ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθεν
  choice: đến
  rationale: Động từ aorist ἔρχομαι chỉ việc Giăng xuất hiện trong sứ vụ; “đến” giữ nghĩa thông thường và tự nhiên.
- source_word: γὰρ
  choice: Vì
  rationale: γάρ nêu lời giải thích cho câu trước; “Vì” thể hiện rõ quan hệ giải thích trong tiếng Việt.
- source_word: Ἰωάννης
  choice: Giăng
  rationale: Dùng dạng tên Kinh Thánh quen thuộc trong tiếng Việt, chỉ Giăng Báp-tít theo ngữ cảnh.
- source_word: μήτε ἐσθίων μήτε πίνων
  choice: không ăn cũng không uống
  rationale: Giữ lối diễn đạt cô đọng về nếp sống khổ hạnh của Giăng, không thêm “bánh” hay “rượu” vốn không có trong câu Hy Lạp này.
- source_word: καὶ λέγουσιν
  choice: nên người ta nói
  rationale: Chủ thể không xác định được diễn đạt tự nhiên là “người ta”; trong mạch lập luận, καί dẫn đến phản ứng trước nếp sống của Giăng, nên “nên” làm rõ quan hệ hàm ý mà không đổi nội dung.
- source_word: Δαιμόνιον ἔχει
  choice: Ông ấy có quỷ
  rationale: Bám sát thành ngữ Hy Lạp, nghĩa đen là “có một quỷ”; “quỷ” phân biệt δαιμόνιον với danh xưng chỉ ma quỷ là διάβολος.
theological_decisions:
- issue: Cách dịch lời cáo buộc có δαιμόνιον
  choice: Ông ấy có quỷ
  alternative: Ông ấy bị quỷ ám
  rationale: Đây là lời người ta cáo buộc Giăng, không phải lời xác nhận của người kể. Cách dịch sát chữ giữ nguyên sức căng của lời cáo buộc và tránh diễn giải mức độ chi phối của quỷ nhiều hơn nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Giăng” theo truyền thống tên riêng quen thuộc trong Kinh Thánh tiếng Việt; dùng “người ta” cho chủ thể số nhiều không xác định. Dấu [a] đặt ngay sau lời cáo buộc mà chú thích giải thích.
