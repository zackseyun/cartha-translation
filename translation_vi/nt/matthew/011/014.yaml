id: MAT.11.14
reference: Matthew 11:14
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ εἰ θέλετε δέξασθαι, αὐτός ἐστιν Ἠλίας ὁ μέλλων ἔρχεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/014.yaml
  text: And if you are willing to accept it[b][a], he is Elijah who is to come.
translation:
  language: vi
  text: Và nếu anh em sẵn lòng chấp nhận điều này[a], thì chính ông là Ê-li[b], người sẽ đến.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “nếu anh em sẵn lòng tiếp nhận lời này.” Tiếng Hy Lạp không nêu rõ điều được tiếp nhận.'
    reason: lexical_alternative
  - marker: b
    text: Tức là Giăng Báp-tít được đồng nhất với Ê-li, người đi trước đã được hứa sẽ đến; so sánh Ma-la-chi 4:5 và Ma-thi-ơ 17:10–13.
    reason: cross_reference
lexical_decisions:
- source_word: εἰ θέλετε δέξασθαι
  choice: nếu anh em sẵn lòng chấp nhận điều này
  rationale: θέλετε đi với động từ nguyên mẫu diễn tả sự sẵn lòng; δέξασθαι có nghĩa là tiếp nhận hoặc chấp nhận. Tiếng Hy Lạp không nêu rõ tân ngữ, nên “điều này” được bổ sung cho tự nhiên và chỉ về lời nhận định của Chúa Giê-su liên quan đến Giăng.
- source_word: αὐτός
  choice: chính ông
  rationale: Đại từ chỉ về Giăng Báp-tít. Từ “chính” giữ được sắc thái nhấn mạnh có thể có của αὐτός mà vẫn tự nhiên trong tiếng Việt.
- source_word: ἐστιν Ἠλίας
  choice: là Ê-li
  rationale: Giữ nguyên sức mạnh trực tiếp của lời đồng nhất trong tiếng Hy Lạp, không làm nhẹ thành “giống như Ê-li” hay “đóng vai trò Ê-li.” “Ê-li” là dạng tên quen dùng trong tiếng Việt.
- source_word: ὁ μέλλων ἔρχεσθαι
  choice: người sẽ đến
  rationale: Cụm này chỉ Ê-li được trông đợi sẽ đến. “Người sẽ đến” giữ hướng quy chiếu tương lai và sắc thái mong đợi theo lời tiên tri, không thu hẹp thành sự sắp xảy ra ngay tức khắc.
- source_word: καὶ
  choice: Và
  rationale: Giữ liên kết đơn giản với mạch văn trước mà không diễn giải thêm quan hệ lập luận.
theological_decisions:
- issue: Sự đồng nhất Giăng Báp-tít với Ê-li
  choice: “chính ông là Ê-li”
  alternative: “ông làm trọn vai trò của Ê-li” hoặc “ông giống như Ê-li”
  rationale: Nguyên văn phát biểu trực tiếp αὐτός ἐστιν Ἠλίας, nhưng đặt trong lời mời gọi có điều kiện về sự tiếp nhận của người nghe. Bản dịch giữ cả sức mạnh của lời đồng nhất lẫn sự căng thẳng thần học, không tự giải thích bản chất của sự đồng nhất ấy.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Anh em” dùng để chỉ những người đang nghe Chúa Giê-su; “chính ông” quy chiếu rõ về Giăng Báp-tít. Câu dịch không thêm danh xưng thần học hoặc giải quyết sự căng thẳng giữa lời đồng nhất này với các phân đoạn liên quan.
