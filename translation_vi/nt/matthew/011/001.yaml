id: MAT.11.1
reference: Matthew 11:1
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ὅτε ἐτέλεσεν ὁ Ἰησοῦς διατάσσων τοῖς δώδεκα μαθηταῖς αὐτοῦ, μετέβη ἐκεῖθεν τοῦ διδάσκειν καὶ κηρύσσειν ἐν ταῖς πόλεσιν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/001.yaml
  text: And when Jesus had finished instructing his twelve disciples[b][a], he went on from there to teach and preach in their cities.
translation:
  language: vi
  text: Sau khi Đức Giê-su dặn bảo mười hai môn đồ của mình[a], Ngài rời nơi đó để đi dạy dỗ và rao giảng trong các thành của họ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “truyền lệnh cho mười hai môn đồ của mình”.'
    reason: lexical_alternative
  - marker: b
    text: Cụm từ “các thành của họ” trong tiếng Hy Lạp không xác định rõ “họ” là ai; có thể chỉ các môn đồ hoặc nói chung là dân chúng trong vùng lân cận.
    reason: alternative_reading
lexical_decisions:
- source_word: Καὶ ἐγένετο ὅτε
  choice: Sau khi
  rationale: Công thức trần thuật này chủ yếu chuyển tiếp và thiết lập quan hệ thời gian. “Sau khi” tự nhiên trong tiếng Việt và nối trực tiếp hành động đã hoàn tất với hành động tiếp theo.
- source_word: ἐτέλεσεν
  choice: đã hoàn tất (được thể hiện qua cấu trúc “Sau khi …”)
  rationale: Ý hoàn thành trước hành động “rời nơi đó” được diễn đạt tự nhiên bằng cấu trúc thời gian, không cần thêm từ “xong”.
- source_word: διατάσσων
  choice: dặn bảo
  rationale: Từ này chỉ việc đưa ra những chỉ dẫn có thẩm quyền. “Dặn bảo” phù hợp với ngữ cảnh Đức Giê-su sai phái các môn đồ, đồng thời không làm sắc thái trở nên quá quân sự; nghĩa mạnh hơn “truyền lệnh” được giữ trong chú thích.
- source_word: τοῖς δώδεκα μαθηταῖς αὐτοῦ
  choice: mười hai môn đồ của mình
  rationale: “Môn đồ” là cách gọi quen thuộc và chính xác trong văn cảnh Phúc Âm; “của mình” quy chiếu tự nhiên về chủ ngữ Đức Giê-su.
- source_word: μετέβη ἐκεῖθεν
  choice: Ngài rời nơi đó
  rationale: Diễn đạt rõ sự chuyển từ địa điểm hiện tại sang nơi khác và giữ nhịp kể chuyện tự nhiên.
- source_word: τοῦ διδάσκειν καὶ κηρύσσειν
  choice: để đi dạy dỗ và rao giảng
  rationale: Cấu trúc nguyên ngữ nêu mục đích. “Dạy dỗ” và “rao giảng” giữ được sự phân biệt giữa việc chỉ dạy và việc công bố sứ điệp.
- source_word: ἐν ταῖς πόλεσιν αὐτῶν
  choice: trong các thành của họ
  rationale: Bản dịch giữ nguyên đại từ số nhiều chưa xác định rõ đối tượng quy chiếu. “Thành” phản ánh trực tiếp πόλις, dù tùy quy mô cũng có thể hiểu là thị trấn.
theological_decisions:
- issue: Đối tượng quy chiếu của αὐτῶν trong ἐν ταῖς πόλεσιν αὐτῶν
  choice: Giữ cách nói mơ hồ “các thành của họ”.
  alternative: “các thành của các môn đồ”, “các thành của người Do Thái”, hoặc “các thành trong vùng ấy”
  rationale: Nguyên văn không xác định rõ “họ” là ai. Việc chỉ định một nhóm cụ thể sẽ giải quyết thay cho bản văn một điểm mà bản văn để ngỏ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Đức Giê-su” cùng đại từ kính trọng “Ngài” tạo sắc thái tôn kính quen thuộc trong tiếng Việt mà không thêm một tước hiệu thần học vào câu. Cách nói hơi lạ “các thành của họ” được chủ ý giữ lại để bảo toàn tính mơ hồ của nguyên văn, kèm chú thích giải thích.
