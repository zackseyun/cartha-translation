  naturalness: Câu tiếng Việt hiện đại, mạch lạc và có sắc thái trang trọng phù hợp văn bản Phúc Âm. “Dặn bảo” tự nhiên trong ngữ cảnh chỉ dẫn các môn đồ; “Ngài” có quy chiếu rõ ràng về Đức Giê-su. Cách nói “các thành của họ” hơi không thông dụng trong hội thoại nhưng thích hợp ở đây vì cần giữ sự mơ hồ của nguyên văn và đã có chú thích.
