    issue: Chú thích dùng từ “chứng ngôn” và “đỉnh điểm” khá nặng và không thật tự nhiên trong văn phong phổ thông.
    rationale: Đây là chú thích giải thích mơ hồ của ἕως Ἰωάννου; cách nói “lời chứng mang tính tiên tri” và “điểm tột đỉnh” truyền đạt cùng nội dung rõ hơn mà không thêm diễn giải giáo phái.
  - severity: low
    issue: Phương án chú thích “đến Giăng” hầu như không khác về nghĩa với bản văn chính “cho đến Giăng.”
    rationale: 'Có thể giữ như một biến thể ngắn gọn, nhưng cần trình bày nó rõ là cách diễn đạt khác, đồng thời giữ phương án thực sự làm rõ cách hiểu thời gian: “cho đến thời của Giăng.”'
