  yaml_path: translation/nt/matthew/011/013.yaml
  text: For all the prophets and the Law prophesied until John[a].
translation:
  language: vi
  text: Vì tất cả các nhà tiên tri và Luật pháp đều đã nói tiên tri cho đến Giăng[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đến Giăng” hoặc “cho đến thời của Giăng”. Cụm từ này có thể coi Giăng là điểm tột đỉnh của lời chứng mang tính tiên tri, hoặc là ranh giới đánh dấu sự chuyển tiếp của lời chứng ấy.'
    reason: alternative_reading
lexical_decisions:
- source_word: πάντες
  choice: tất cả
  rationale: Bổ nghĩa cho toàn thể nhóm các nhà tiên tri; “tất cả” là cách diễn đạt tự nhiên và chính xác trong tiếng Việt.
- source_word: γὰρ
  choice: Vì
  rationale: Giữ chức năng giải thích, nêu cơ sở cho lời phát biểu ngay trước đó.
- source_word: οἱ προφῆται
  choice: các nhà tiên tri
  rationale: Cách gọi chuẩn, tự nhiên trong tiếng Việt đối với những người thay mặt Đức Chúa Trời nói lời tiên tri.
- source_word: ὁ νόμος
  choice: Luật pháp
  rationale: Chỉ Luật pháp Môi-se như một phần Kinh Thánh của Israel, chứ không phải luật lệ nói chung; viết hoa giúp biểu thị nghĩa danh xưng này.
- source_word: ἕως Ἰωάννου
  choice: cho đến Giăng
  rationale: Giữ cách nói ngắn gọn về giới hạn thời gian, đồng thời không quyết định liệu Giăng được kể là đỉnh điểm của thời kỳ tiên tri hay là ranh giới chuyển tiếp của thời kỳ ấy.
- source_word: ἐπροφήτευσαν
  choice: đã nói tiên tri
  rationale: 'Diễn đạt trực tiếp động từ ở thì aorist và giữ nguyên phép nhân cách hóa: cả các nhà tiên tri lẫn Luật pháp đều làm chứng mang tính tiên tri.'
theological_decisions:
- issue: Nên hiểu ὁ νόμος là luật nói chung hay danh xưng chỉ một phần Kinh Thánh
  choice: Luật pháp
  alternative: luật pháp
  rationale: Ngữ cảnh nói đến chứng ngôn Kinh Thánh của Israel qua “các nhà tiên tri và Luật pháp”; cách viết hoa biểu thị danh xưng mà không thêm nội dung vào nguyên văn.
- issue: ἕως Ἰωάννου có bao gồm Giăng trong thời kỳ tiên tri hay chỉ xem ông là điểm kết thúc
  choice: cho đến Giăng
  alternative: đến Giăng; cho đến thời Giăng
  rationale: Cụm từ Hy Lạp không giải quyết dứt khoát vấn đề này. Bản dịch giữ nguyên ngôn ngữ về ranh giới thời gian thay vì áp đặt một cách hiểu thần học.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ “nói tiên tri” để bảo toàn tuyên bố rằng không chỉ các nhà tiên tri mà chính Luật pháp cũng mang chức năng làm chứng tiên tri; dùng tên gọi quen thuộc “Giăng” trong truyền thống Kinh Thánh tiếng Việt.
