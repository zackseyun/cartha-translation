revisions:
- from: Còn ngươi, Ca-bê-na-um, ngươi sẽ được nâng lên tận trời sao? Ngươi sẽ phải xuống âm phủ[a]. Vì nếu những việc quyền năng đã được thực hiện nơi ngươi cũng được thực hiện tại Sô-đôm, thì thành ấy hẳn đã còn tồn tại cho đến ngày nay.
  to: Còn ngươi, Ca-bê-na-um, ngươi sẽ được nâng lên tận trời sao? Ngươi sẽ xuống Ha-đét[a]. Vì nếu những việc quyền năng đã xảy ra nơi ngươi cũng đã xảy ra ở Sô-đôm, thì thành ấy đã còn tồn tại cho đến ngày nay.
  rationale: Sửa tối thiểu để loại bỏ sắc thái cưỡng bách không có trong nguyên văn, bảo toàn thuật ngữ ᾅδης bằng chuyển tự trong thân bài, và phản ánh nhất quán động từ γίνομαι bằng “xảy ra.” Câu hỏi tu từ, đối lập trời/Ha-đét, tính phản thực và thời hạn “cho đến ngày nay” đều được giữ nguyên.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T02:45:42Z'
review_pass:
  verdict: revise
  source_fidelity: Câu hỏi tu từ ở vế đầu được giữ đúng. Tuy nhiên, “sẽ phải xuống” thêm sắc thái bị ép buộc không được nêu bởi καταβήσῃ, và “âm phủ” có thể gợi các liên tưởng dân gian/giáo lý vượt quá ᾅδης. Dùng “Ha-đét” trong thân bài, kèm chú thích giải thích, bảo toàn thuật ngữ nguồn và phân biệt với Ghê-hen-na.
  naturalness: Bản sửa vẫn dùng văn phong Việt hiện đại, trang trọng. “Các việc quyền năng” và cấu trúc điều kiện phản thực với “đã ... cũng đã ...; thì ... đã ...” rõ ràng, tự nhiên.
  terminology: Giữ Ca-bê-na-um và Sô-đôm theo lối phiên âm đang dùng. “Ha-đét” là cách chuyển tự an toàn cho ᾅδης; chú thích nêu “cõi người chết” là diễn giải, không đồng nhất với Ghê-hen-na.
  issues:
  - severity: medium
    issue: “Ngươi sẽ phải xuống âm phủ”
    rationale: “Phải” thêm ý tất yếu/ép buộc, trong khi καταβήσῃ chỉ nói “ngươi sẽ xuống.” “Âm phủ” cũng dễ mang nội hàm văn hóa Việt rộng hơn thuật ngữ Ha-đét.
  - severity: low
    issue: “đã được thực hiện” cho γενόμεναι / ἐγενήθησαν
    rationale: Dạng bị động có thể chấp nhận theo ngữ cảnh, nhưng γίνομαι trực tiếp hơn là “đã xảy ra”; cách này cũng giữ sự lặp lại có chủ ý của động từ nguồn.
  - severity: low
    issue: “hẳn đã còn tồn tại”
    rationale: “Hẳn” có thể được hiểu là suy đoán. Quan hệ phản thực đã được thể hiện đủ bằng cấu trúc điều kiện “nếu ... thì ... đã ...”.
