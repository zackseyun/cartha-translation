id: MAT.11.23
reference: Matthew 11:23
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ σύ, Καφαρναούμ, ⸂μὴ ἕως οὐρανοῦ ὑψωθήσῃ⸃; ἕως ᾅδου ⸀καταβήσῃ· ὅτι εἰ ἐν Σοδόμοις ⸀ἐγενήθησαν αἱ δυνάμεις αἱ γενόμεναι ἐν σοί, ⸀ἔμεινεν ἂν μέχρι τῆς σήμερον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/023.yaml
  text: And you[a], Capernaum, will you be exalted to heaven? You will go down to Hades. For if the mighty works done in you had happened in Sodom, it would have remained until today.
translation:
  language: vi
  text: Còn ngươi, Ca-bê-na-um, ngươi sẽ được nâng lên tận trời sao? Ngươi sẽ xuống Ha-đét[a]. Vì nếu những việc quyền năng đã xảy ra nơi ngươi cũng đã xảy ra ở Sô-đôm, thì thành ấy đã còn tồn tại cho đến ngày nay.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hy Lạp: Ha-đét, tức cõi người chết; không phải Ghê-hen-na.'
    reason: Làm rõ nghĩa của ᾅδης và tránh đồng nhất từ này với thuật ngữ chỉ sự phán xét cuối cùng.
lexical_decisions:
- source_word: Καφαρναούμ
  choice: Ca-bê-na-um
  rationale: Dùng dạng phiên âm tiếng Việt quen thuộc của địa danh Capernaum.
- source_word: μὴ ἕως οὐρανοῦ ὑψωθήσῃ;
  choice: ngươi sẽ được nâng lên tận trời sao?
  rationale: Hiểu μή với động từ tương lai bị động là câu hỏi tu từ hàm ý phủ định; cách dịch giữ hình ảnh không gian và tránh tự ý xác định đây là sự tự cao hay được tôn cao.
- source_word: ἕως ᾅδου καταβήσῃ
  choice: Ngươi sẽ phải xuống âm phủ
  rationale: ‘Xuống’ thể hiện καταβαίνω; ‘sẽ phải’ diễn đạt tự nhiên sắc thái chắc chắn, đối lập với câu hỏi tu từ trước đó. ‘Âm phủ’ chỉ cõi người chết, không đồng nhất với Gehenna.
- source_word: δυνάμεις
  choice: những việc quyền năng
  rationale: Giữ cả ý về những hành động cụ thể lẫn quyền năng biểu lộ qua chúng, không thu hẹp hoàn toàn thành thuật ngữ ‘phép lạ’.
- source_word: γενόμεναι ἐν σοί / ἐγενήθησαν
  choice: đã được thực hiện nơi ngươi / cũng được thực hiện
  rationale: Trong ngữ cảnh, γίνομαι nói về các việc quyền năng xảy ra hoặc được thực hiện tại hai thành; cấu trúc bị động tiếng Việt tự nhiên và làm rõ sự song hành.
- source_word: ἔμεινεν ἂν
  choice: thành ấy hẳn đã còn tồn tại
  rationale: Chủ ngữ số ít quy chiếu về Sô-đôm như một thành; ‘hẳn đã’ chuyển tải kết quả phản thực đi với ἄν.
- source_word: μέχρι τῆς σήμερον
  choice: cho đến ngày nay
  rationale: Cách diễn đạt tiếng Việt hiện đại, trang trọng và giữ nguyên giới hạn thời gian.
theological_decisions:
- issue: Cách dịch ᾅδης
  choice: âm phủ
  alternative: Ha-đét; cõi người chết; địa ngục
  rationale: ‘Âm phủ’ là cách gọi ngắn gọn, dễ hiểu cho cõi người chết trong văn cảnh này. Chú thích nêu rõ từ Hy Lạp là Hades chứ không phải Gehenna, tránh nhập hai khái niệm vào một từ ‘địa ngục’.
- issue: Sắc thái của câu hỏi về việc được nâng lên trời
  choice: 'câu hỏi tu từ: ‘ngươi sẽ được nâng lên tận trời sao?’'
  alternative: 'lời phủ định trực tiếp: ‘ngươi sẽ không được nâng lên tận trời’'
  rationale: μή với động từ tương lai phù hợp nhất với câu hỏi mong đợi câu trả lời phủ định; giữ hình thức câu hỏi bảo toàn sức tu từ và phần mơ hồ chân thực của bản Hy Lạp.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ ‘ngươi’ được giữ vì lời quở trách trực tiếp một thành được nhân cách hóa. ‘Nơi ngươi’ duy trì cách xưng hô ấy; ‘thành ấy’ làm rõ chủ thể Sô-đôm trong mệnh đề kết quả.
