id: MAT.11.9
reference: Matthew 11:9
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀλλὰ τί ἐξήλθατε⸂; προφήτην ἰδεῖν⸃; ναί, λέγω ὑμῖν, καὶ περισσότερον προφήτου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/009.yaml
  text: But what did you go out to see? A prophet? Yes[a], I tell you, and more than a prophet.
translation:
  language: vi
  text: 'Nhưng anh em đã đi ra để xem gì? Một nhà tiên tri chăng? Phải, tôi nói với anh em: còn hơn cả một nhà tiên tri nữa.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “một người cao trọng hơn một nhà tiên tri.” Nguyên văn sát nghĩa là “hơn một nhà tiên tri.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Nhưng
  rationale: Đánh dấu sự tương phản với chuỗi câu hỏi tu từ trước đó, đồng thời tự nhiên trong tiếng Việt hiện đại.
- source_word: τί ἐξήλθατε
  choice: anh em đã đi ra để xem gì
  rationale: τί ở đây là “gì”, hỏi về đối tượng họ đi ra để gặp và xem, chứ không trực tiếp hỏi lý do “tại sao”.
- source_word: ἰδεῖν
  choice: để xem
  rationale: Diễn đạt động từ nguyên mẫu chỉ mục đích sau ἐξήλθατε một cách rõ ràng, tự nhiên.
- source_word: προφήτην
  choice: một nhà tiên tri
  rationale: Danh từ số ít không có mạo từ mang ý nghĩa bất định tự nhiên trong câu hỏi tu từ này.
- source_word: ναί
  choice: Phải
  rationale: Lời khẳng định trực tiếp đáp lại câu hỏi tu từ; trang trọng vừa phải và phù hợp văn cảnh.
- source_word: λέγω ὑμῖν
  choice: tôi nói với anh em
  rationale: Giữ sát công thức diễn ngôn của nguyên văn mà vẫn rõ nghĩa trong tiếng Việt hiện đại.
- source_word: καὶ περισσότερον προφήτου
  choice: còn hơn cả một nhà tiên tri nữa
  rationale: Giữ phép so sánh “hơn một nhà tiên tri” và không giải thích thêm cụ thể Giăng vượt hơn nhà tiên tri ở phương diện nào. “Còn… nữa” chuyển tải lực tăng tiến của καί trong tiếng Việt.
theological_decisions:
- issue: Thân phận và địa vị của Giăng Báp-tít trong lời Đức Giê-su
  choice: Dịch “còn hơn cả một nhà tiên tri nữa” mà không giải thích thêm ý nghĩa ngầm.
  alternative: một người cao trọng hơn một nhà tiên tri
  rationale: Nguyên văn nâng Giăng lên trên phạm trù nhà tiên tri nhưng không nói rõ trong mệnh đề này ông vượt hơn như thế nào. Cách dịch dè dặt giữ nguyên sức nặng và độ mở thần học của câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Anh em” dùng cho đại từ số nhiều ὑμῖν. Dấu hai chấm giúp câu tỉnh lược cuối câu tự nhiên hơn mà không đưa thêm chủ ngữ không có trong nguyên văn.
