review_pass:
  verdict: revise
  source_fidelity: Bản nháp giữ đúng cấu trúc song song và dịch chính xác φορτίον là “gánh nặng” cùng ἐλαφρόν là “nhẹ”. Tuy nhiên, êm ái thường tả cảm giác mềm, dịu hoặc không gây khó chịu về mặt vật lý; khi gán cho “ách”, từ này không chuyển tải rõ nét trường nghĩa của χρηστός là tốt lành, nhân hậu, dễ chịu/không khắc nghiệt. Trong ngữ cảnh cái ách, “dễ chịu” phản ánh tự nhiên hơn tính chất thuận lợi, không hà khắc mà không biến câu này thành một khẳng định tuyệt đối rằng đời sống môn đồ không khó khăn.
  naturalness: “Ách của tôi dễ chịu” là lối nói hiện đại, rõ nghĩa và phù hợp với hình ảnh ẩn dụ. Bỏ hai từ “thì” làm câu gọn và tự nhiên hơn mà vẫn giữ được phép đối xứng nguyên ngữ.
  terminology: Giữ “ách” cho ζυγός, vì đây là hình ảnh cụ thể và ẩn dụ quan trọng. Giữ “gánh nặng” và “nhẹ”. “Dễ chịu” cho χρηστός phù hợp với cách dùng khi bổ nghĩa cho ách; chú thích nêu các khả năng “tốt lành”, “tử tế” và “dễ mang”, nhờ đó không áp đặt một nghĩa duy nhất.
  issues:
  - severity: medium
    issue: “Êm ái” không phải là tương đương tự nhiên, rõ nét cho χρηστός khi mô tả “ách”.
