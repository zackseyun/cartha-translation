source:
  edition: SBLGNT
  text: ὁ γὰρ ζυγός μου χρηστὸς καὶ τὸ φορτίον μου ἐλαφρόν ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/030.yaml
  text: For my yoke is kind, and my burden is light.
translation:
  language: vi
  text: Vì ách của tôi dễ chịu[a], và gánh nặng của tôi nhẹ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hy Lạp ở đây cũng có thể được dịch là “tốt lành”, “tử tế”, hoặc, trong ngữ cảnh này, là “dễ mang”.
    reason: Ghi nhận trường nghĩa của χρηστός và bảo tồn sắc thái vừa tốt lành vừa không khắc nghiệt của “ách”, thay vì giới hạn nó vào một nghĩa duy nhất.
lexical_decisions:
- source_word: χρηστός
  choice: êm ái
  rationale: Từ này có thể mang nghĩa tốt lành, tử tế, nhân hậu; khi nói về một cái ách, nó cũng gợi ý một cái ách dễ chịu, không khắc nghiệt. “Êm ái” diễn đạt tự nhiên phẩm chất nhân từ của ách mà không đồng nhất hoàn toàn với “dễ”.
- source_word: ζυγός
  choice: ách
  rationale: Giữ nguyên hình ảnh cụ thể về chiếc ách, đồng thời bảo tồn nghĩa bóng về sự quy phục và trách nhiệm.
- source_word: φορτίον
  choice: gánh nặng
  rationale: Diễn đạt tự nhiên vật phải mang và giữ được sự đối chiếu với tính từ “nhẹ”.
- source_word: ἐλαφρόν
  choice: nhẹ
  rationale: Tương đương trực tiếp, rõ ràng, bảo tồn nghịch lý có chủ ý giữa “gánh nặng” và “nhẹ”.
theological_decisions:
- issue: Phẩm chất của ách Chúa Giê-su qua χρηστός
  choice: êm ái
  alternative: dễ mang; tốt lành; nhân từ
  rationale: Không thu hẹp lời này thành một lời hứa rằng môn đồ hóa luôn “dễ”, cũng không dùng cách nói thiếu tự nhiên như “ách nhân từ”. Bản dịch giữ ý rằng ách ấy không khắc nghiệt mà mang phẩm chất tốt lành, dịu nhẹ.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Cấu trúc song song “ách của tôi… gánh nặng của tôi…” được giữ lại; “êm ái” tự nhiên hơn việc gán trực tiếp “nhân từ” cho một cái ách.
