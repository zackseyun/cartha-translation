id: MAT.25.31
reference: Matthew 25:31
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ὅταν δὲ ἔλθῃ ὁ υἱὸς τοῦ ἀνθρώπου ἐν τῇ δόξῃ αὐτοῦ καὶ πάντες ⸀οἱ ἄγγελοι μετ’ αὐτοῦ, τότε καθίσει ἐπὶ θρόνου δόξης αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/031.yaml
  text: But when the Son of Man comes in his glory[a], and all the angels with him, then he will sit on his glorious throne.
translation:
  language: vi
  text: Nhưng khi Con Người đến trong vinh quang của Người, cùng với tất cả các thiên sứ, bấy giờ Người sẽ ngồi trên ngai vinh quang của Người.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc, sát nghĩa hơn: “ngai của vinh quang của Người.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅταν δὲ
  choice: Nhưng khi
  rationale: Ὅταν mở đầu mệnh đề thời gian chỉ một biến cố tương lai; δὲ đánh dấu sự chuyển ý nhẹ. “Nhưng khi” vừa tự nhiên vừa giữ được quan hệ diễn ngôn.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Con Người
  rationale: Giữ danh hiệu quen thuộc của Chúa Giê-su và âm vang Đa-ni-ên 7, thay vì diễn giải thành một cách gọi thuần nhân học.
- source_word: ἐν τῇ δόξῃ αὐτοῦ
  choice: trong vinh quang của mình
  rationale: “Vinh quang” giữ được ý về uy nghi được bày tỏ và âm hưởng Kinh Thánh; “của mình” quy chiếu tự nhiên về Con Người.
- source_word: πάντες οἱ ἄγγελοι μετ’ αὐτοῦ
  choice: cùng với tất cả các thiên sứ
  rationale: Bản Hy Lạp nói “tất cả các thiên sứ”, không có đại từ sở hữu; bản dịch không thêm “của Người” nhưng diễn đạt rõ sự đồng hành.
- source_word: τότε
  choice: bấy giờ
  rationale: Đánh dấu hành động tiếp theo sau khi Con Người đến; “bấy giờ” có sắc thái trang trọng, tự nhiên trong văn cảnh cánh chung.
- source_word: καθίσει ἐπὶ θρόνου
  choice: Người sẽ ngồi trên ngai
  rationale: Giữ trực tiếp thì tương lai và ý nghĩa vị trí của ἐπί với sở hữu cách, không diễn giải thêm thành “ngự trị” hay “lên ngôi”.
- source_word: θρόνου δόξης αὐτοῦ
  choice: ngai vinh quang của mình
  rationale: Giữ khá sát kết cấu sở hữu cách “ngai của vinh quang Người” mà vẫn tự nhiên trong tiếng Việt; không chuyển hẳn thành “ngai vinh hiển” để tránh che khuất quan hệ sở hữu/căn nguyên có thể có.
theological_decisions:
- issue: Danh hiệu Kitô học ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Con Người
  alternative: Đấng làm Người
  rationale: “Con Người” là danh hiệu Kinh Thánh đã được xác lập, bảo tồn liên hệ với Đa-ni-ên 7 và vai trò vương giả, xét xử trong ngữ cảnh mà không áp đặt một cách diễn giải riêng.
- issue: Cách hiểu θρόνου δόξης αὐτοῦ
  choice: ngai vinh quang của mình
  alternative: ngai vinh hiển của Người
  rationale: 'Cách dịch chính giữ sự căng thẳng của kết cấu sở hữu cách: ngai thuộc về hoặc được đặc trưng bởi vinh quang của Con Người. Chú thích cung cấp lối dịch sát chữ hơn để minh bạch.'
- issue: Đại từ chỉ Con Người
  choice: Người / mình
  alternative: Ngài / của Ngài
  rationale: “Người” trang trọng và dễ hiểu mà không nhập thêm quy ước xưng hô của một hệ phái; “mình” trong hai cụm phản thân làm rõ vinh quang và ngai thuộc về chính chủ thể Con Người.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ đọc. Giữ “Con Người” như một danh hiệu; dùng “thiên sứ” cho ἄγγελοι. Dấu chú thích [a] được đặt ngay sau cụm từ mà chú thích giải thích.
