revisions:
- from: Nhưng khi Con Người đến trong vinh quang của mình, cùng với tất cả các thiên sứ, bấy giờ Người sẽ ngồi trên ngai vinh quang của mình.[a]
  to: Nhưng khi Con Người đến trong vinh quang của Người, cùng với tất cả các thiên sứ, bấy giờ Người sẽ ngồi trên ngai vinh quang của Người.[a]
  rationale: Chỉnh nhẹ đại từ để có văn phong trang trọng, nhất quán và tự nhiên hơn; đồng thời sửa chú thích để diễn đạt đầy đủ, rõ ràng cấu trúc «ngai của vinh quang của Người» của nguyên văn. Nghĩa của câu và mức độ mơ hồ hợp lý của θρόνου δόξης αὐτοῦ vẫn được giữ nguyên.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T05:44:25Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch chuyển tải đúng trình tự và các thành tố chính của câu Hy Lạp: mệnh đề thời gian tương lai, danh hiệu «Con Người», việc đến trong vinh quang của Người, tất cả thiên sứ ở cùng Người, và việc Người sẽ ngồi trên ngai. Cách dịch «ngai vinh quang của Người» là cách diễn đạt Việt ngữ tự nhiên cho θρόνου δόξης αὐτοῦ; chú thích cần phản ánh sát hơn cấu trúc genitive của nguyên văn.'
  naturalness: Câu văn trang trọng, rõ ràng và phù hợp tiếng Việt hiện đại. Việc dùng nhất quán «Người/của Người» thay cho đại từ phản thân «mình» trong văn cảnh danh hiệu và tường thuật trang trọng tự nhiên hơn, đồng thời tránh cảm giác khẩu ngữ. Chú thích hiện tại «ngai của vinh quang mình» không tự nhiên và thiếu đại từ sở hữu đầy đủ.
  terminology: «Con Người», «vinh quang», «thiên sứ», và «ngai» đều phù hợp với thuật ngữ Kinh Thánh Việt ngữ và không áp đặt diễn giải hệ phái. Không thêm sở hữu từ vào «tất cả các thiên sứ», vì nguyên văn không có đại từ sở hữu ở cụm này.
  issues:
  - severity: low
    issue: Đại từ «mình» được dùng trong bản văn chính và chú thích.
    rationale: Dù có thể hiểu theo phản thân, «của Người» trang trọng và tự nhiên hơn trong văn xuôi Kinh Thánh hiện đại, nhất là khi chủ ngữ là danh hiệu «Con Người». Sự thay đổi này không làm thay đổi nghĩa.
  - severity: medium
    issue: 'Chú thích «Sát nghĩa hơn: “ngai của vinh quang mình.”» thiếu tự nhiên và chưa đầy đủ về quan hệ sở hữu.'
    rationale: Cách ghi này thiếu «của» trước «mình» hoặc một đại từ sở hữu đầy đủ. «Ngai của vinh quang của Người» phản ánh trực tiếp θρόνου δόξης αὐτοῦ và đọc rõ ràng hơn.
  revised_text: Nhưng khi Con Người đến trong vinh quang của Người, cùng với tất cả các thiên sứ, bấy giờ Người sẽ ngồi trên ngai vinh quang của Người.[a]
