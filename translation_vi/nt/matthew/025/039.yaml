  text: πότε δέ σε εἴδομεν ⸀ἀσθενοῦντα ἢ ἐν φυλακῇ καὶ ἤλθομεν πρός σε;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/039.yaml
  text: And when did we see you sick or in prison and come to you?[a]
translation:
  language: vi
  text: Vậy, khi nào chúng tôi đã thấy Ngài đau yếu hoặc ở tù và đến với Ngài?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “thăm Ngài.” Cụm Hy Lạp sát nghĩa là: “đến với Ngài.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: πότε
  choice: khi nào
  rationale: Trạng từ nghi vấn hỏi về thời điểm; “khi nào” là cách nói tự nhiên trong câu hỏi trực tiếp.
- source_word: δέ
  choice: thế
  rationale: Ở đây δέ là từ nối nhẹ, tiếp tục chuỗi câu hỏi. “Thế” diễn đạt tự nhiên sự chuyển tiếp mà không tạo sắc thái đối lập mạnh.
- source_word: εἴδομεν
  choice: chúng tôi đã thấy
  rationale: Động từ aorist chỉ việc nhìn thấy trong quá khứ; cấu trúc “đã thấy” phù hợp với câu hỏi tiếng Việt.
- source_word: ἀσθενοῦντα
  choice: đau yếu
  rationale: Phân từ của ἀσθενέω trong ngữ cảnh này nói đến tình trạng bệnh tật. “Đau yếu” trang trọng, dễ hiểu và giữ được sắc thái trạng thái đang mắc bệnh.
- source_word: ἐν φυλακῇ
  choice: ở trong tù
  rationale: φυλακή ở đây là nơi giam giữ; “ở trong tù” là cách diễn đạt chuẩn, không thêm các phân biệt pháp lý hiện đại.
- source_word: ἤλθομεν πρός σε
  choice: đến với Ngài
  rationale: Cụm Hy Lạp có nghĩa sát là “đến với Ngài”. Cách dịch này giữ sự đơn giản của nguyên văn thay vì diễn giải cụ thể thành “thăm”.
theological_decisions:
- issue: Nên dịch ἤλθομεν πρός σε theo nghĩa sát là “đến với Ngài” hay theo lối thành ngữ là “thăm Ngài”
  choice: đến với Ngài
  alternative: thăm Ngài
  rationale: Nguyên văn dùng động từ chỉ sự đi đến gần một người, chứ không dùng riêng một động từ có nghĩa “thăm”. Bản chính giữ cách nói sát nguồn để không thêm nét nghĩa diễn giải; phương án thành ngữ được ghi ở chú thích.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Đại từ “Ngài” giữ cách xưng hô kính trọng với nhân vật đang được thưa chuyện; “chúng tôi” phù hợp với lời đáp tập thể. Câu hỏi được sắp xếp tự nhiên trong tiếng Việt nhưng vẫn bảo toàn quan hệ giữa việc thấy Ngài đau yếu hoặc ở tù và việc đến với Ngài.
