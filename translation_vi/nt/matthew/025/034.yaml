id: MAT.25.34
reference: Matthew 25:34
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: τότε ἐρεῖ ὁ βασιλεὺς τοῖς ἐκ δεξιῶν αὐτοῦ· Δεῦτε, οἱ εὐλογημένοι τοῦ πατρός μου, κληρονομήσατε τὴν ἡτοιμασμένην ὑμῖν βασιλείαν ἀπὸ καταβολῆς κόσμου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/034.yaml
  text: Then the King will say to those on his right[a], ‘Come, you who are blessed by my Father[b], inherit the kingdom prepared for you from the foundation of the world.’
translation:
  language: vi
  text: 'Bấy giờ, Vua sẽ phán với những người ở bên phải mình: “Hãy đến, hỡi những người được Cha ta ban phước[a]! Hãy thừa hưởng vương quốc đã được chuẩn bị cho các ngươi từ khi thế gian được đặt nền móng[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sát cấu trúc Hy Lạp hơn: “những người được Cha ta chúc phước.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể diễn đạt: “từ thuở lập nền thế gian” hoặc “kể từ khi thế gian được đặt nền móng”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Bấy giờ
  rationale: Đánh dấu trình tự trong cảnh phán xét; cách diễn đạt trang trọng, tự nhiên và không hàm ý một thời điểm khác ngoài mạch văn.
- source_word: ἐρεῖ
  choice: sẽ phán
  rationale: Thì tương lai của λέγω. Trong lời dẫn trực tiếp của một vị vua và Đấng xét xử, “phán” phù hợp với ngữ vực trang trọng của tiếng Việt.
- source_word: ὁ βασιλεὺς
  choice: Vua
  rationale: Danh xưng xác định chỉ nhân vật hoàng gia cụ thể trong ngữ cảnh; viết hoa để biểu thị danh hiệu ở đây, không nhằm bổ sung một nhận định thần học ngoài câu.
- source_word: τοῖς ἐκ δεξιῶν αὐτοῦ
  choice: với những người ở bên phải mình
  rationale: Giữ nguyên vị trí không gian ở phía bên phải của Vua; “mình” quy chiếu tự nhiên về chủ ngữ trong tiếng Việt.
- source_word: Δεῦτε
  choice: Hãy đến
  rationale: Lời triệu gọi ở thể mệnh lệnh, ngắn gọn và trang trọng.
- source_word: οἱ εὐλογημένοι τοῦ πατρός μου
  choice: hỡi những người được Cha ta ban phước
  rationale: Phân từ hoàn thành bị động được diễn đạt như một nhóm người đang ở trong tình trạng đã nhận phước; sở hữu cách τοῦ πατρός μου được hiểu tự nhiên là nguồn hoặc tác nhân ban phước.
- source_word: κληρονομήσατε
  choice: Hãy thừa hưởng
  rationale: Giữ sắc thái nhận cơ nghiệp của κληρονομέω, thay vì dùng một động từ chung chung như “nhận lấy”.
- source_word: τὴν ... βασιλείαν
  choice: vương quốc
  rationale: Trong kết cấu “thừa hưởng” và “đã được chuẩn bị”, βασιλεία thích hợp nhất với nghĩa vương quốc/cõi cai trị được ban làm cơ nghiệp, dù từ này cũng có thể nhấn mạnh vương quyền.
- source_word: ἡτοιμασμένην ὑμῖν
  choice: đã được chuẩn bị cho các ngươi
  rationale: Thể hoàn thành bị động cho thấy việc chuẩn bị đã hoàn tất và kết quả vẫn còn; “cho các ngươi” giữ rõ đối tượng thụ hưởng.
- source_word: ἀπὸ καταβολῆς κόσμου
  choice: từ khi thế gian được đặt nền móng
  rationale: Giữ hình ảnh “đặt nền móng” của καταβολή và liên kết tự nhiên với việc vương quốc đã được chuẩn bị.
theological_decisions:
- issue: Tác nhân hoặc nguồn của phước lành trong τοῦ πατρός μου
  choice: Diễn đạt “được Cha ta ban phước”, hiểu Cha là nguồn/tác nhân.
  alternative: 'Dịch sát cấu trúc sở hữu cách hơn: “những người được phước của Cha ta”.'
  rationale: Cách chọn rõ nghĩa và tự nhiên trong tiếng Việt hiện đại, nhưng chú thích vẫn bảo lưu hình thức cô đọng hơn của tiếng Hy Lạp.
- issue: Nghĩa của βασιλεία trong bối cảnh cơ nghiệp cánh chung
  choice: Dịch là “vương quốc”.
  alternative: Dịch là “vương quyền” hoặc “sự trị vì”.
  rationale: Việc vương quốc được “thừa hưởng” và “chuẩn bị cho” một nhóm người nghiêng về nghĩa cõi/vương quốc, đồng thời không phủ nhận sắc thái quyền cai trị vốn có của từ.
- issue: Phạm vi bổ nghĩa của ἀπὸ καταβολῆς κόσμου
  choice: Gắn cụm từ với “đã được chuẩn bị cho các ngươi”.
  alternative: Hiểu rộng hơn là bổ nghĩa cho toàn bộ lời mời gọi.
  rationale: Đây là liên kết cú pháp gần và tự nhiên nhất, nhưng bản dịch không xây dựng thêm một hệ thống giáo lý về thời điểm hoặc cách thức chuẩn bị.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng và dễ hiểu. “Phán”, “hỡi” và “các ngươi” duy trì giọng uy nghiêm của lời Vua nói với một tập thể mà không dùng quá nhiều từ cổ. Dấu chú thích [a], [b] được đặt ngay sau các cụm từ tương ứng.
