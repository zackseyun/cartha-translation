id: MAT.25.43
reference: Matthew 25:43
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ξένος ἤμην καὶ οὐ συνηγάγετέ με, γυμνὸς καὶ οὐ περιεβάλετέ με, ἀσθενὴς καὶ ἐν φυλακῇ καὶ οὐκ ἐπεσκέψασθέ με.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/043.yaml
  text: I was a stranger and you did not welcome me[a], naked and you did not clothe me[b], sick and in prison and you did not visit me.
translation:
  language: vi
  text: Ta là người xa lạ mà các ngươi không tiếp đón ta[a]; ta trần truồng mà các ngươi không cho ta mặc; ta đau ốm và ở trong tù mà các ngươi không thăm nom ta[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “đón ta vào” hoặc “tiếp nhận ta”. Động từ Hy Lạp có nghĩa đen là “tập hợp”, nhưng ở đây chỉ việc đón nhận người xa lạ với lòng hiếu khách.
    reason: lexical_alternative
  - marker: b
    text: “Thăm nom ta” cũng hàm ý quan tâm, chăm sóc ta, chứ không chỉ đến thăm xã giao.
    reason: lexical_alternative
lexical_decisions:
- source_word: ξένος
  choice: người xa lạ
  rationale: Trong danh sách những người dễ bị tổn thương đang cần lòng thương xót, từ này chỉ người ở ngoài gia đình hoặc cộng đồng của một người và cần được tiếp nhận. “Người xa lạ” giữ được nghĩa rộng, không thu hẹp thành người ngoại quốc và cũng không mặc nhiên biến người ấy thành khách đã được đón tiếp.
- source_word: συνηγάγετέ
  choice: tiếp đón
  rationale: Động từ συνάγω có nghĩa đen là “tập hợp”, nhưng trong kết hợp này diễn tả việc đón nhận người xa lạ với lòng hiếu khách. “Tiếp đón” tự nhiên trong tiếng Việt và giữ được sắc thái đón nhận hơn là chỉ đưa vào một nơi.
- source_word: γυμνός
  choice: trần truồng
  rationale: Từ này có thể chỉ hoàn toàn không có quần áo hoặc không đủ áo mặc. “Trần truồng” giữ nguyên sức mạnh của cách diễn đạt Hy Lạp, còn vế “không cho ta mặc” làm rõ nhu cầu được cấp quần áo.
- source_word: περιεβάλετέ
  choice: cho ta mặc
  rationale: Động từ có nghĩa là khoác hoặc đặt vật gì quanh người, từ đó mang nghĩa cho mặc quần áo. “Cho ta mặc” là cách nói tự nhiên và rõ hành động cứu giúp trong tiếng Việt.
- source_word: ἀσθενής
  choice: đau ốm
  rationale: Dù từ này cũng có thể mang nghĩa yếu đuối, trong danh sách các cảnh ngộ cần được thương xót, nghĩa bệnh tật là tự nhiên nhất. “Đau ốm” rõ ràng và thông dụng.
- source_word: ἐν φυλακῇ
  choice: ở trong tù
  rationale: φυλακή ở đây nói đến tình trạng bị giam giữ. “Ở trong tù” là cách diễn đạt chuẩn, không thu hẹp vào một loại cơ sở giam giữ cụ thể.
- source_word: ἐπεσκέψασθέ
  choice: thăm nom
  rationale: ἐπισκέπτομαι chỉ việc đến thăm với sự quan tâm và có thể hàm ý chăm sóc. “Thăm nom” giữ được hành động cụ thể đồng thời truyền đạt tốt hơn “thăm” đơn thuần sắc thái quan tâm vốn có.
theological_decisions:
- issue: Sắc thái của hành động thương xót trong ἐπεσκέψασθέ με
  choice: thăm nom ta
  alternative: thăm ta; chăm sóc ta
  rationale: “Thăm nom” bảo toàn hành động đến với người đau ốm hoặc bị tù, đồng thời không làm mất sắc thái quan tâm thực tế. Dịch hẳn là “chăm sóc” có thể diễn giải rộng hơn điều động từ trực tiếp nêu, còn chỉ dùng “thăm” dễ bị hiểu là một cuộc viếng thăm xã giao.
translation_notes:
  register: Dùng lối xưng hô “Ta—các ngươi” phù hợp lời phán trang trọng của Vua trong ngữ cảnh, đồng thời giữ câu văn hiện đại, dễ hiểu. Phép lặp “ta” bảo toàn nhịp liệt kê và trọng tâm nhận diện của nguyên văn; dấu chấm phẩy giúp ba hoàn cảnh được phân định rõ.
