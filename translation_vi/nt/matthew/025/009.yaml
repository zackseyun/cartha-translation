  text: ἀπεκρίθησαν δὲ αἱ φρόνιμοι λέγουσαι· Μήποτε ⸂οὐ μὴ⸃ ἀρκέσῃ ἡμῖν καὶ ὑμῖν· ⸀πορεύεσθε μᾶλλον πρὸς τοὺς πωλοῦντας καὶ ἀγοράσατε ἑαυταῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/009.yaml
  text: But the wise answered[a], saying, ‘No, lest there not be enough for us and for you. Go instead to those who sell, and buy for yourselves.’
translation:
  language: vi
  text: 'Nhưng những cô khôn ngoan đáp: “Không được đâu, e rằng sẽ chẳng đủ cho chúng tôi và các cô.[a] Các cô nên đi đến chỗ những người bán để mua cho mình.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn Hy Lạp dùng lối phủ định nhấn mạnh sau “e rằng”, diễn tả sự lo ngại mạnh rằng số đang có có thể không đủ cho cả hai nhóm.
    reason: Giải thích sắc thái của Μήποτε οὐ μή mà không chuyển sự lo ngại thành điều chắc chắn.
lexical_decisions:
- source_word: ἀπεκρίθησαν δὲ αἱ φρόνιμοι λέγουσαι
  choice: Nhưng những cô khôn ngoan đáp
  rationale: Dùng “đáp” để diễn đạt tự nhiên cả động từ trả lời lẫn phân từ dẫn lời; “những cô khôn ngoan” khôi phục danh từ chỉ các cô gái đã được nêu trong ngữ cảnh mà không làm thay đổi đối tượng.
- source_word: Μήποτε ⸂οὐ μὴ⸃ ἀρκέσῃ
  choice: Không được đâu, e rằng sẽ chẳng đủ
  rationale: “Không được đâu” diễn đạt lời từ chối hàm ẩn, còn “e rằng sẽ chẳng đủ” giữ sắc thái lo ngại cùng sức nhấn mạnh của cụm phủ định Hy Lạp.
- source_word: ἡμῖν καὶ ὑμῖν
  choice: cho cả chúng tôi lẫn các cô
  rationale: Cấu trúc “cả… lẫn…” làm rõ rằng số dầu có nguy cơ không đủ cho hai nhóm; cách xưng hô phù hợp với các nhân vật nữ trong dụ ngôn.
- source_word: πορεύεσθε μᾶλλον πρὸς τοὺς πωλοῦντας
  choice: Các cô hãy đi đến những người bán… thì hơn
  rationale: “Hãy đi” giữ lực mệnh lệnh, còn “thì hơn” thể hiện μᾶλλον như một phương án thay thế được đề nghị.
- source_word: καὶ ἀγοράσατε ἑαυταῖς
  choice: mà mua cho mình
  rationale: Cách nói gọn, tự nhiên, giữ động từ mệnh lệnh và ý nghĩa phản thân là mua để chính họ dùng.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Giữ lời thoại trực tiếp, tránh từ Hán-Việt nặng như “đầy đủ” hoặc “mãi biện”; không thêm “dầu” trong mệnh đề vì câu Hy Lạp chỉ nói “đủ”, dù đối tượng đã rõ từ ngữ cảnh.
