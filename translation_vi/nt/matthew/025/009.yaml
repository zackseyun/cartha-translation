- from: 'Nhưng những cô khôn ngoan đáp: “Không được đâu, e rằng sẽ chẳng đủ cho cả chúng tôi lẫn các cô.[a] Các cô hãy đi đến những người bán mà mua cho mình thì hơn.”'
  to: 'Nhưng những cô khôn ngoan đáp: “Không được đâu, e rằng sẽ chẳng đủ cho chúng tôi và các cô.[a] Các cô nên đi đến chỗ những người bán để mua cho mình.”'
