  verdict: revise
  source_fidelity: Bản dịch truyền đạt đúng cấu trúc so sánh tương lai và các thành tố chính của câu. Tuy nhiên, “cầm đèn” không biểu đạt rõ phân từ λαβοῦσαι (“đã lấy/mang theo”), và “vương quốc thiên đàng” không phải cách gọi Việt ngữ chuẩn, tự nhiên cho công thức Μα-thi-ơ ἡ βασιλεία τῶν οὐρανῶν.
  naturalness: “Nước Trời” là cách gọi hiện đại, trang trọng, và đã được chuẩn hóa rộng rãi hơn nhiều so với “vương quốc thiên đàng”. “Họ đã lấy đèn của mình rồi đi ra” biểu đạt trình tự hành động của nguyên ngữ rõ hơn mà vẫn tự nhiên.
  terminology: Dùng “Nước Trời” cho ἡ βασιλεία τῶν οὐρανῶν. Giữ “cô gái đồng trinh” để chuyển tải trực tiếp παρθένοις mà không thêm vai trò xã hội như phù dâu. Giữ “chàng rể” cho νυμφίος.
