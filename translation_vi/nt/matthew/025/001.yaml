  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Τότε ὁμοιωθήσεται ἡ βασιλεία τῶν οὐρανῶν δέκα παρθένοις, αἵτινες λαβοῦσαι τὰς λαμπάδας ⸀ἑαυτῶν ἐξῆλθον εἰς ⸀ὑπάντησιν τοῦ νυμφίου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/001.yaml
  text: Then the kingdom of heaven will be like ten virgins[c][b][a], who took their lamps and went out to meet the bridegroom.
translation:
  language: vi
  text: Bấy giờ, Nước Trời sẽ được ví như[a] mười cô gái đồng trinh[b]. Họ đã lấy đèn[c] của mình rồi đi ra đón chàng rể.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “sẽ giống như.” Động từ Hy Lạp ở thể bị động; dịch sát có thể là “sẽ được ví như” hoặc “sẽ được so sánh với.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “mười trinh nữ” hoặc “mười cô gái chưa chồng.” Từ Hy Lạp chỉ những phụ nữ trẻ chưa kết hôn và, trong cách dùng này, có thể nhấn mạnh sự đồng trinh.'
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể dịch: “đuốc.” Từ Hy Lạp có thể chỉ một nguồn sáng cầm tay dùng trong đoàn rước.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Bấy giờ
  rationale: Dùng một dấu nối thời gian tự nhiên, liên kết dụ ngôn này với mạch văn cánh chung ngay trước đó.
- source_word: ὁμοιωθήσεται
  choice: sẽ được ví như
  rationale: Giữ sắc thái tương lai và thể bị động của động từ Hy Lạp, đồng thời vẫn tự nhiên trong tiếng Việt.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: vương quốc thiên đàng
  rationale: Diễn đạt công thức đặc trưng trong Ma-thi-ơ bằng tiếng Việt trang trọng, dễ hiểu; số nhiều hình thức của οὐρανῶν không cần chuyển thành số nhiều trong tiếng Việt.
- source_word: δέκα παρθένοις
  choice: mười cô gái đồng trinh
  rationale: παρθένος chỉ những phụ nữ trẻ chưa kết hôn và mang nghĩa đồng trinh trong bối cảnh này; cách dịch này rõ nghĩa hơn từ Hán-Việt đơn độc “trinh nữ”.
- source_word: αἵτινες
  choice: Họ
  rationale: Chuyển mệnh đề quan hệ sang một câu mới để câu tiếng Việt sáng rõ mà vẫn duy trì đúng chủ thể là mười cô gái.
- source_word: λαβοῦσαι
  choice: cầm
  rationale: Phân từ bất định quá khứ diễn tả hành động đi trước hoặc đi kèm việc đi ra; “cầm” tự nhiên trong ngữ cảnh đoàn rước và không buộc phải nhấn mạnh trình tự.
- source_word: τὰς λαμπάδας ἑαυτῶν
  choice: đèn của mình
  rationale: λαμπάς có thể là đèn hoặc đuốc cầm tay. “Đèn” phù hợp với cách tiếp nhận quen thuộc của dụ ngôn, còn khả năng “đuốc” được ghi ở chú thích.
- source_word: ἐξῆλθον εἰς ὑπάντησιν
  choice: đi ra đón
  rationale: Diễn đạt tự nhiên hành động ra ngoài nhằm gặp và tiếp đón một người đang đến.
- source_word: τοῦ νυμφίου
  choice: chàng rể
  rationale: Chỉ người nam sắp cưới trong bối cảnh hôn lễ; “chàng rể” tự nhiên và giữ rõ hình ảnh lễ cưới.
theological_decisions:
- issue: Công thức so sánh trong dụ ngôn
  choice: vương quốc thiên đàng sẽ được ví như mười cô gái đồng trinh
  alternative: vương quốc thiên đàng sẽ giống như mười cô gái đồng trinh
  rationale: Bản chính giữ thể bị động của ὁμοιωθήσεται mà không giải thích quan hệ tượng trưng giữa vương quốc và các nhân vật trong dụ ngôn; cách nói chủ động hơn được bảo lưu trong chú thích.
- issue: Ý nghĩa của παρθένοις
  choice: cô gái đồng trinh
  alternative: cô gái chưa chồng
  rationale: Giữ nét nghĩa trực tiếp của từ Hy Lạp trong bối cảnh hôn lễ, thay vì thu hẹp nó chỉ còn tình trạng hôn nhân hoặc tự ý gọi họ là phù dâu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. “Bấy giờ” duy trì mối nối với văn cảnh trước; “vương quốc thiên đàng” và “chàng rể” giữ hình ảnh đặc trưng của nguyên văn. Tách mệnh đề quan hệ thành câu thứ hai giúp câu tự nhiên trong tiếng Việt mà không đổi quan hệ cú pháp hay ý nghĩa.
