revisions:
- from: 'Người đã nhận một ta-lâng cũng tiến đến và nói: “Thưa chủ, tôi biết ông là người khắc nghiệt[a], gặt nơi mình không gieo và thu gom từ nơi mình không rải ra[b].”'
  to: 'Người đã nhận một ta-lâng cũng đến và nói: “Thưa chủ, tôi biết ông là người khắc nghiệt[a], gặt nơi ông không gieo và thu gom từ nơi ông không rải ra[b].”'
  rationale: Chỉ chỉnh các đại từ để chúng quy chiếu đúng đến người chủ được xưng là “ông”, đồng thời thay “tiến đến” bằng “đến” cho tự nhiên hơn. Giữ nguyên tính hàm ẩn của tân ngữ sau “rải ra”, với chú thích làm rõ khả năng hiểu theo ngữ cảnh nông nghiệp.
  reviewer_model: gpt-5.6-terra
