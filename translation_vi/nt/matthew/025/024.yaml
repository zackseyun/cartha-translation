id: MAT.25.24
reference: Matthew 25:24
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: προσελθὼν δὲ καὶ ὁ τὸ ἓν τάλαντον εἰληφὼς εἶπεν· Κύριε, ἔγνων σε ὅτι σκληρὸς εἶ ἄνθρωπος, θερίζων ὅπου οὐκ ἔσπειρας καὶ συνάγων ὅθεν οὐ διεσκόρπισας·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/024.yaml
  text: Then the one who had received the one talent also came and said[a], ‘Lord, I knew that you are a hard man[b], reaping where you did not sow and gathering where you did not scatter.’
translation:
  language: vi
  text: 'Người đã nhận một ta-lâng cũng đến và nói: “Thưa chủ, tôi biết ông là người khắc nghiệt[a], gặt nơi ông không gieo và thu gom từ nơi ông không rải ra[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hy Lạp cũng có thể mang nghĩa “cứng rắn”, “hà khắc” hoặc “nghiêm khắc”.
    reason: lexical_alternative
  - marker: b
    text: Nguyên văn không nêu vật được “rải ra”. Trong hình ảnh nông nghiệp này, có thể hiểu là rải hạt giống.
    reason: implicit_object
lexical_decisions:
- source_word: προσελθὼν
  choice: tiến đến
  rationale: Diễn đạt hành động người đầy tớ đến trình diện trước chủ để nói, tự nhiên trong mạch kể.
- source_word: δὲ καὶ
  choice: cũng
  rationale: καί đưa người đầy tớ này vào cùng chuỗi những người lần lượt đến; quan hệ chuyển tiếp của δέ đã được thể hiện tự nhiên qua trật tự kể chuyện.
- source_word: ὁ τὸ ἓν τάλαντον εἰληφὼς
  choice: người đã nhận một ta-lâng
  rationale: Giữ cấu trúc định danh bằng phân từ và sắc thái hành động đã hoàn tất của εἰληφώς.
- source_word: τάλαντον
  choice: ta-lâng
  rationale: Giữ đơn vị tiền/trọng lượng của nguyên văn và sự liên kết xuyên suốt dụ ngôn, thay vì quy đổi thành một số tiền suy diễn.
- source_word: Κύριε
  choice: Thưa chủ
  rationale: Trong lời thoại của dụ ngôn, đây là cách một đầy tớ kính cẩn xưng hô với chủ mình; cách dịch này tự nhiên và không áp đặt rằng người nói đang dùng một tước hiệu thần học.
- source_word: ἔγνων σε ὅτι
  choice: tôi biết ông là
  rationale: Chuyển cấu trúc Hy Lạp sang tiếng Việt tự nhiên, diễn tả lời người đầy tớ tự nhận mình biết tính cách của chủ.
- source_word: σκληρὸς
  choice: khắc nghiệt
  rationale: Diễn đạt sự cứng rắn, nghiêm khắc hoặc hà khắc trong lời cáo buộc của người đầy tớ; chú thích giữ lại phạm vi nghĩa.
- source_word: θερίζων ὅπου οὐκ ἔσπειρας
  choice: gặt nơi mình không gieo
  rationale: Giữ nguyên hình ảnh nông nghiệp và cặp động từ đối ứng ‘gặt–gieo’.
- source_word: συνάγων ὅθεν οὐ διεσκόρπισας
  choice: thu gom từ nơi mình không rải ra
  rationale: Giữ ὅθεν là ‘từ nơi’ và không tự ý thêm tân ngữ ‘hạt giống’, vốn không hiện diện trong nguyên văn.
theological_decisions:
- issue: Cách dịch κύριος trong lời xưng hô thuộc dụ ngôn
  choice: Thưa chủ
  alternative: Lạy Chúa
  rationale: Ngữ cảnh trực tiếp là người đầy tớ nói với chủ trong câu chuyện. ‘Thưa chủ’ bảo toàn quan hệ đó mà không loại trừ ý nghĩa rộng hơn của dụ ngôn.
- issue: Lời mô tả người chủ của đầy tớ
  choice: Trình bày nguyên vẹn như nhận định của người đầy tớ, không xác nhận cũng không làm nhẹ lời ấy
  alternative: Dịch nhẹ hơn là ‘nghiêm khắc’ hoặc giải thích rằng nhận định này sai
  rationale: Câu chỉ thuật lại lời người đầy tớ. Bản dịch cần giữ căng thẳng về việc lời đánh giá ấy có đúng hay không.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “ta-lâng” để giữ thuật ngữ cổ của dụ ngôn; “Thưa chủ… tôi… ông” tạo lời thoại kính cẩn, tự nhiên giữa đầy tớ và chủ. Các dấu chú thích [a], [b] đều được đặt ngay tại cụm từ liên quan.
