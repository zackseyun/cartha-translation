id: MAT.25.36
reference: Matthew 25:36
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: γυμνὸς καὶ περιεβάλετέ με, ἠσθένησα καὶ ἐπεσκέψασθέ με, ἐν φυλακῇ ἤμην καὶ ἤλθατε πρός με.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/036.yaml
  text: I was naked and you clothed me[a]; I was sick and you visited me[b]; I was in prison and you came to me.
translation:
  language: vi
  text: Ta trần truồng, các con đã mặc áo cho ta; ta đau ốm, các con đã thăm nom ta[a]; ta ở trong tù, các con đã đến với ta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “chăm sóc ta”; động từ Hy Lạp có thể chỉ việc đến thăm với sự quan tâm hoặc chăm nom.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γυμνὸς
  choice: trần truồng
  rationale: Diễn đạt trực tiếp tình trạng không có quần áo và giữ sự tương ứng rõ với hành động “mặc áo cho” ở vế sau.
- source_word: περιεβάλετέ
  choice: mặc áo cho
  rationale: Động từ περιβάλλω ở đây chỉ việc khoác hoặc mặc quần áo cho một người; cách dịch này tự nhiên và cụ thể trong tiếng Việt.
- source_word: ἠσθένησα
  choice: ta đau ốm
  rationale: Trong ngữ cảnh các hành động thương xót, động từ này hợp lý nhất khi chỉ tình trạng bệnh tật, dù nghĩa rộng hơn có thể là yếu đuối.
- source_word: ἐπεσκέψασθέ
  choice: các con đã thăm nom ta
  rationale: ἐπισκέπτομαι có thể chỉ việc đến thăm với sự quan tâm, chăm sóc. “Thăm nom” giữ được cả hành động đến thăm lẫn sắc thái quan tâm mà không mở rộng thành chăm sóc toàn diện.
- source_word: φυλακῇ
  choice: trong tù
  rationale: φυλακή ở đây là nơi giam giữ; “trong tù” là cách nói chuẩn, tự nhiên và đủ rộng trong tiếng Việt.
- source_word: ἤλθατε πρός με
  choice: các con đã đến với ta
  rationale: Bám sát câu Hy Lạp đơn giản “các con đã đến với ta”, không thêm ý “thăm” vốn không được nói rõ trong vế này.
theological_decisions:
- issue: Mức độ diễn giải các hành động thương xót
  choice: 'Giữ các hành động cụ thể: “mặc áo cho”, “thăm nom” và “đến với ta”.'
  alternative: Diễn giải rộng hơn như “chăm sóc ta” hoặc “đến thăm ta”.
  rationale: Nguyên văn nhấn mạnh những hành động cụ thể và không đòi hỏi mở rộng theo hướng thần học hay mục vụ. Cách dịch này bảo toàn sự giản dị và tránh thêm ý không được nói rõ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “ta—các con” để thể hiện lời Đức Vua phán với những người được Ngài tiếp nhận; nhịp ba vế và cấu trúc song song của nguyên văn được giữ lại.
