  text: καὶ τὸν ἀχρεῖον δοῦλον ἐκβάλετε εἰς τὸ σκότος τὸ ἐξώτερον· ἐκεῖ ἔσται ὁ κλαυθμὸς καὶ ὁ βρυγμὸς τῶν ὀδόντων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/030.yaml
  text: And throw the worthless servant into the outer darkness[a]. In that place there will be weeping and gnashing of teeth.
translation:
  language: vi
  text: Còn tên nô lệ vô dụng ấy, hãy quăng ra chỗ tối tăm bên ngoài. Ở đó sẽ có khóc lóc và nghiến răng.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀχρεῖον
  choice: vô dụng
  rationale: Từ này chỉ người không đem lại ích lợi hay giá trị theo sự đánh giá của chủ. “Vô dụng” là cách nói hiện đại, tự nhiên và giữ được mức độ nghiêm khắc của lời phán xét.
- source_word: δοῦλον
  choice: người nô lệ
  rationale: Trong bối cảnh dụ ngôn về quan hệ chủ–nô lệ, cách dịch này thể hiện rõ địa vị lệ thuộc và bị sở hữu; chú thích ghi nhận cách dịch ít trực diện hơn là “đầy tớ”.
- source_word: ἐκβάλετε
  choice: hãy ném ra
  rationale: Mệnh lệnh aorist có sắc thái mạnh và dứt khoát. “Hãy ném ra” diễn đạt sinh động hành động trục xuất mà không dùng lối nói cổ.
- source_word: σκότος τὸ ἐξώτερον
  choice: nơi tối tăm bên ngoài
  rationale: Cách dịch này giữ cả hình ảnh bóng tối lẫn ý ở phía ngoài, qua đó diễn tả sự bị loại khỏi nơi phước lành mà không giải thích thêm vào chính văn.
- source_word: ἐκεῖ
  choice: Ở đó
  rationale: Trạng từ chỉ thẳng về địa điểm vừa được nhắc đến; “Ở đó” ngắn gọn và tự nhiên trong tiếng Việt.
- source_word: κλαυθμὸς
  choice: khóc lóc
  rationale: “Khóc lóc” diễn tả nỗi đau buồn rõ ràng nhưng không tự ý nâng cường độ thành than vãn theo nghi thức.
- source_word: βρυγμὸς τῶν ὀδόντων
  choice: nghiến răng
  rationale: Đây là thành ngữ tự nhiên trong tiếng Việt, giữ được hình ảnh có thể biểu thị đau đớn, tuyệt vọng hoặc giận dữ mà không thu hẹp vào một cảm xúc duy nhất.
theological_decisions:
- issue: Bản chất của hình ảnh phán xét trong dụ ngôn
  choice: Giữ nguyên hình ảnh bị loại ra ngoài, ở trong bóng tối, cùng sự khóc lóc và nghiến răng.
  alternative: Giải thích trực tiếp đây là hỏa ngục, sự phán xét cuối cùng, hoặc chỉ là một hình phạt tạm thời hay mang tính ẩn dụ.
  rationale: Câu này dùng ngôn ngữ phán xét đặc trưng trong Ma-thi-ơ, nhưng không tự định nghĩa đầy đủ bản chất hay thời hạn của hình phạt. Bản dịch vì thế giữ sự căng thẳng thần học của chính văn thay vì đưa một kết luận giáo lý vào câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cấu trúc “người ta sẽ khóc lóc và nghiến răng” chuyển hai danh từ hành động Hy Lạp thành động từ tiếng Việt tự nhiên, đồng thời không xác định riêng chủ thể ngoài những người ở nơi vừa nói đến.
