review_pass:
  verdict: revise
  source_fidelity: Bản nháp chuyển đúng các thành tố chính của câu. Tuy nhiên, cụm “ném ra nơi tối tăm bên ngoài” thiếu giới từ đích đến tự nhiên trong tiếng Việt; cần dùng cấu trúc “quăng ... ra chỗ ...” để diễn đạt cả sự trục xuất của ἐκβάλετε lẫn hướng đến của εἰς. Mệnh đề cuối nên giữ cấu trúc phi cá thể của nguyên ngữ (“sẽ có”) thay vì thêm chủ ngữ khái quát “người ta”.
  naturalness: “Người nô lệ vô dụng ấy” hiểu được, nhưng “tên nô lệ vô dụng ấy” tự nhiên hơn trong một mệnh lệnh trục xuất và phản ánh sắc thái đánh giá bất lợi của ngữ cảnh. “Ở đó sẽ có khóc lóc và nghiến răng” là công thức tiếng Việt gọn, trang trọng và phù hợp với lối diễn đạt lặp lại của Ma-thi-ơ.
  terminology: Giữ “nô lệ” cho δοῦλος là phù hợp với bối cảnh dụ ngôn chủ–nô lệ; chú thích thay thế “đầy tớ” được neo đúng vào từ này. “Chỗ tối tăm bên ngoài” giữ hình ảnh thành ngữ Ma-thi-ơ mà không diễn giải nó thành một khẳng định giáo lý cụ thể. “Khóc lóc và nghiến răng” giữ nguyên tính mở của hình ảnh phán xét.
  issues:
  - severity: medium
    issue: Cấu trúc “ném ra nơi tối tăm bên ngoài” chưa tự nhiên và chưa biểu thị rõ hướng của εἰς.
    rationale: Tiếng Việt thường cần “vào” hoặc, tự nhiên hơn trong ngữ cảnh trục xuất, cấu trúc “quăng ... ra chỗ ...”. Cách này bảo toàn lực mạnh của ἐκβάλετε và đích đến của hành động.
  - severity: low
    issue: “Người ta sẽ khóc lóc và nghiến răng” thêm một chủ thể khái quát không có trong nguyên ngữ.
    rationale: 'ὁ κλαυθμὸς καὶ ὁ βρυγμὸς là cấu trúc danh ngữ: “sẽ có khóc lóc và nghiến răng.” Cấu trúc phi cá thể tiếng Việt sát nguồn hơn và cũng là lối văn Kinh Thánh tự nhiên.'
  revised_text: Còn tên nô lệ vô dụng ấy, hãy quăng ra chỗ tối tăm bên ngoài. Ở đó sẽ có khóc lóc và nghiến răng.
