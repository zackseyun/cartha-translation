- from: Còn người nô lệ vô dụng ấy[a], hãy ném ra nơi tối tăm bên ngoài. Ở đó, người ta sẽ khóc lóc và nghiến răng.
  to: Còn tên nô lệ vô dụng ấy, hãy quăng ra chỗ tối tăm bên ngoài. Ở đó sẽ có khóc lóc và nghiến răng.
  rationale: Bản sửa làm rõ cú pháp trục xuất “quăng ... ra chỗ ...”, vốn truyền đạt tự nhiên mệnh lệnh mạnh ἐκβάλετε εἰς. Câu cuối được trả về cấu trúc phi cá thể tương ứng với công thức Hy Lạp, không thêm chủ thể. Hình ảnh tối tăm, khóc lóc và nghiến răng vẫn được giữ nguyên, không áp đặt cách giải thích về bản chất của sự phán xét.
