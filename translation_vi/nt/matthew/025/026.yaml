language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ὁ κύριος αὐτοῦ εἶπεν αὐτῷ· Πονηρὲ δοῦλε καὶ ὀκνηρέ, ᾔδεις ὅτι θερίζω ὅπου οὐκ ἔσπειρα καὶ συνάγω ὅθεν οὐ διεσκόρπισα;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/026.yaml
  text: But his master answered and said to him[a], ‘Wicked and lazy servant[b], you knew that I reap where I did not sow and gather where I did not scatter?
translation:
  language: vi
  text: 'Nhưng chủ của anh ta đáp: “Đầy tớ gian ác và lười biếng kia[a], ngươi đã biết rằng ta gặt nơi ta không gieo và thu gom nơi ta không rải?[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “Nô lệ gian ác và lười biếng kia.” Từ Hy Lạp doulos có thể có nghĩa là “đầy tớ” hoặc “nô lệ”, tùy theo ngữ cảnh.
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể hiểu đây là một lời khẳng định: “Ngươi đã biết rằng ta gặt nơi ta không gieo và thu gom nơi ta không rải.” Tiếng Hy Lạp có thể được đọc như một lời khẳng định thay vì một câu hỏi tu từ.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ
  choice: Nhưng ... đáp
  rationale: Cách dịch này giữ sắc thái chuyển ý nhẹ của δέ và chuyển tự nhiên công thức trần thuật ἀποκριθεὶς ... εἶπεν sang tiếng Việt.
- source_word: ὁ κύριος αὐτοῦ
  choice: chủ của anh ta
  rationale: Trong bối cảnh dụ ngôn về quan hệ chủ–đầy tớ, κύριος chỉ người chủ, chứ tại đây không trực tiếp được dùng như tước hiệu thần học “Chúa”.
- source_word: Πονηρὲ
  choice: gian ác
  rationale: πονĥρός ở đây là lời phán xét về đạo đức, mạnh hơn ý “xấu” hoặc “kém” nói chung.
- source_word: δοῦλε
  choice: đầy tớ
  rationale: “Đầy tớ” là cách diễn đạt tự nhiên trong mạch dụ ngôn tiếng Việt, trong khi từ Hy Lạp cũng có thể chỉ “nô lệ”; khả năng ấy được giữ trong chú thích.
- source_word: ὀκνηρέ
  choice: lười biếng
  rationale: Diễn đạt rõ nghĩa không muốn hoặc chậm trễ hành động của ὀκνηρός bằng tiếng Việt hiện đại.
- source_word: ᾔδεις
  choice: ngươi đã biết
  rationale: Giữ nội dung về điều người đầy tớ vốn biết; “đã biết” tự nhiên trong tiếng Việt và phù hợp lực thời của hình thái từ οἶδα.
- source_word: ὅτι
  choice: rằng
  rationale: ὅτι giới thiệu nội dung được biết, không phải mệnh đề nguyên nhân.
- source_word: θερίζω ὅπου οὐκ ἔσπειρα
  choice: ta gặt nơi ta không gieo
  rationale: Giữ nguyên hình ảnh nông nghiệp và sự đối xứng giữa gặt với gieo.
- source_word: συνάγω ὅθεν οὐ διεσκόρπισα
  choice: thu gom nơi ta không rải
  rationale: Giữ sự tương phản giữa thu gom và rải, đồng thời không thêm danh từ “hạt giống” vốn chỉ được hàm ý chứ không có mặt trong nguyên văn.
theological_decisions:
- issue: 'Lực của lời cuối: câu hỏi tu từ hay lời khẳng định'
  choice: Dịch như một câu hỏi tu từ, kết bằng “phải không?”
  alternative: 'Dịch như lời khẳng định: “Ngươi đã biết rằng ta gặt nơi ta không gieo và thu gom nơi ta không rải.”'
  rationale: Bản Hy Lạp có thể được chấm câu theo cả hai cách. Câu hỏi tu từ phù hợp với việc người chủ dùng chính lời người đầy tớ vừa nói để chất vấn anh ta, nhưng chú thích vẫn bảo lưu cách hiểu như lời khẳng định.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “ngươi/ta” thể hiện quan hệ bất đối xứng giữa chủ và đầy tớ trong bối cảnh dụ ngôn mà không dùng lối nói quá khẩu ngữ. Từ “kia” làm lời gọi trực tiếp tự nhiên hơn trong tiếng Việt.
