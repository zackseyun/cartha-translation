  text: ἐπείνασα γὰρ καὶ οὐκ ἐδώκατέ μοι φαγεῖν, ⸀ἐδίψησα καὶ οὐκ ἐποτίσατέ με,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/042.yaml
  text: For I was hungry and you gave me nothing to eat[a]; I was thirsty and you gave me nothing to drink.
translation:
  language: vi
  text: Vì Ta đói mà các ngươi không cho Ta ăn; Ta khát mà các ngươi không cho Ta uống.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπείνασα
  choice: Ta đói
  rationale: Động từ aorist diễn tả tình trạng đói của người nói trong quá khứ; tiếng Việt không bắt buộc đánh dấu thì, và ngữ cảnh đã xác định thời điểm.
- source_word: γὰρ
  choice: Vì
  rationale: Giữ chức năng giải thích nguyên do của lời phán xét trong văn mạch.
- source_word: ἐδώκατέ μοι φαγεῖν
  choice: các ngươi không cho Ta ăn
  rationale: Cách nói tự nhiên trong tiếng Việt, đồng thời bám sát cấu trúc phủ định và giữ rõ đối tượng ngôi thứ nhất.
- source_word: ἐδίψησα
  choice: Ta khát
  rationale: Cách diễn đạt gọn, tự nhiên và song hành với “Ta đói”.
- source_word: ἐποτίσατέ με
  choice: các ngươi không cho Ta uống
  rationale: ποτίζω trong ngữ cảnh này có nghĩa cung cấp thức uống; cách dịch giữ sự song hành với “không cho Ta ăn” và trọng tâm cá nhân của sự bỏ mặc.
theological_decisions:
- issue: Mức độ minh nhiên khi dịch hai mệnh đề phủ định về việc không cung cấp thức ăn, thức uống
  choice: Dịch là “không cho Ta ăn ... không cho Ta uống.”
  alternative: “không cho Ta gì để ăn ... không cho Ta gì để uống.”
  rationale: Cách chọn gần với cấu trúc Hy Lạp, tự nhiên trong tiếng Việt và không thêm sắc thái ngoài bản văn; vẫn giữ nguyên sức nặng của việc không bày tỏ lòng thương xót trong lời phán xét.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ta/các ngươi” để thể hiện lời Chúa Giê-su phán với một tập thể trong bối cảnh xét xử; dấu chấm phẩy giữ hai vế song hành.
