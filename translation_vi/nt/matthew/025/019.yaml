id: MAT.25.19
reference: Matthew 25:19
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: μετὰ δὲ ⸂πολὺν χρόνον⸃ ἔρχεται ὁ κύριος τῶν δούλων ἐκείνων καὶ συναίρει ⸂λόγον μετ’ αὐτῶν⸃
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/019.yaml
  text: After a long time[a], the master of those servants comes and settles accounts with them.
translation:
  language: vi
  text: Sau một thời gian dài, người chủ của những nô lệ ấy đến và tính sổ với họ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μετὰ δὲ πολὺν χρόνον
  choice: Sau một thời gian dài
  rationale: μετά với đối cách chỉ sự kế tiếp về thời gian; δέ chỉ là liên từ chuyển ý nhẹ, nên không cần thêm từ nối trong tiếng Việt.
- source_word: ἔρχεται
  choice: trở về
  rationale: Hiện tại lịch sử làm câu chuyện sống động. Trong ngữ cảnh người chủ đã đi xa rồi quay lại, “trở về” diễn đạt tự nhiên hướng chuyển động hàm ý trong câu chuyện.
- source_word: ὁ κύριος
  choice: chủ
  rationale: Trong dụ ngôn, κύριος chỉ người có quyền trên các δοῦλοι, không nhất thiết là tước hiệu thần học “Chúa”; “chủ” giữ đúng quan hệ xã hội và kinh tế trong câu chuyện.
- source_word: τῶν δούλων ἐκείνων
  choice: của những nô lệ ấy
  rationale: δοῦλος có thể chỉ đầy tớ hoặc nô lệ; ở đây quan hệ lệ thuộc dưới quyền một người chủ nổi bật, nên “nô lệ” phản ánh rõ địa vị bị ràng buộc hơn.
- source_word: συναίρει λόγον μετ’ αὐτῶν
  choice: thanh toán sổ sách với họ
  rationale: Thành ngữ mang nghĩa đối chiếu và giải quyết các khoản phải tính; cách nói này tự nhiên trong tiếng Việt và giữ sắc thái kinh tế-kế toán của dụ ngôn.
theological_decisions:
- issue: Cách dịch κύριος trong dụ ngôn
  choice: chủ
  alternative: Chúa; ông chủ
  rationale: Chủ thể trong mệnh đề là người chủ trong câu chuyện. Dịch “chủ” tránh áp đặt trực tiếp một tước hiệu Cơ Đốc học, trong khi ý nghĩa rộng hơn của dụ ngôn vẫn do văn cảnh truyền tải.
- issue: Cách dịch δοῦλος
  choice: nô lệ
  alternative: đầy tớ; tôi tớ
  rationale: Bối cảnh nhấn mạnh quyền của chủ và trách nhiệm kinh tế của những người thuộc quyền ông; “nô lệ” giữ rõ địa vị xã hội mà từ Hy Lạp có thể biểu thị.
- issue: Hiện tại lịch sử ἔρχεται
  choice: trở về
  alternative: đã trở về; trở lại
  rationale: Tiếng Việt có thể dùng hiện tại trong lối kể để giữ tính sống động của nguyên văn; không thêm dấu thời quá khứ.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Thanh toán sổ sách” giữ hình ảnh kế toán của dụ ngôn; “nô lệ” được dùng thay vì cách nói nhẹ hơn để phản ánh quan hệ lệ thuộc trong nguyên văn.
