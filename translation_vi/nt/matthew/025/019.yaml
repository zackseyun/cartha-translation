  naturalness: “Thanh toán sổ sách với họ” không phải là cách kết hợp tự nhiên để diễn đạt việc đối chiếu/quyết toán tài khoản với người khác. “Tính sổ với họ” là lối nói hiện đại, ngắn gọn và giữ đúng sắc thái kế toán của thành ngữ Hy Lạp.
  terminology: “Người chủ” phù hợp với κύριος trong vai nhân vật dụ ngôn, không áp đặt tước hiệu thần học. “Nô lệ” phản ánh δοῦλοι trong quan hệ sở hữu/lệ thuộc được nêu rõ ở đây.
