  to: Sau một thời gian dài, người chủ của những nô lệ ấy đến và tính sổ với họ.
  rationale: Chỉnh “trở về” thành “đến” để bám sát ἔρχεται, và thay “thanh toán sổ sách” bằng “tính sổ” để diễn đạt tự nhiên, chính xác thành ngữ συναίρει λόγον. Các lựa chọn “người chủ” và “nô lệ” được giữ lại vì phù hợp với ngữ cảnh dụ ngôn và từ vựng nguồn.
