id: MAT.25.15
reference: Matthew 25:15
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ᾧ μὲν ἔδωκεν πέντε τάλαντα ᾧ δὲ δύο ᾧ δὲ ἕν, ἑκάστῳ κατὰ τὴν ἰδίαν δύναμιν, καὶ ἀπεδήμησεν. εὐθέως
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/015.yaml
  text: And to one he gave five talents[a], to another two, and to another one, to each according to his own ability[b]; and he went away immediately.
translation:
  language: vi
  text: Ông trao cho người này năm ta-lâng[a], cho người kia hai, và cho người khác nữa một, tùy theo khả năng riêng của mỗi người[b], rồi đi xa. Ngay lập tức,[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ta-lâng là một đơn vị trọng lượng và tiền tệ rất lớn thời xưa; ở đây không có nghĩa là năng khiếu hay tài năng tự nhiên.
    reason: lexical_clarification
  - marker: b
    text: 'Cũng có thể dịch: “theo khả năng của từng người”.'
    reason: lexical_alternative
  - marker: c
    text: Trong bản văn SBLGNT, “ngay lập tức” mở đầu mệnh đề tiếp theo ở câu 16.
    reason: syntactic_clarification
lexical_decisions:
- source_word: τάλαντα
  choice: ta-lâng
  rationale: Đây là đơn vị trọng lượng và tiền tệ rất lớn trong thế giới cổ đại, không phải “tài năng” theo nghĩa năng khiếu tự nhiên hiện nay. Dùng thuật ngữ lịch sử “ta-lâng” tránh quy đổi võ đoán sang một loại tiền hiện đại.
- source_word: ᾧ μὲν ... ᾧ δὲ ... ᾧ δὲ
  choice: cho người này ... người kia ... và người khác nữa
  rationale: Cách diễn đạt phân phối này giữ rõ ba người nhận những số lượng khác nhau, đồng thời tự nhiên trong tiếng Việt hiện đại.
- source_word: ἕν
  choice: một
  rationale: Danh từ “ta-lâng” được hiểu ngầm từ phần trước; lược lại ở đây giữ được cấu trúc cô đọng của tiếng Hy Lạp mà không làm mất nghĩa.
- source_word: ἑκάστῳ κατὰ τὴν ἰδίαν δύναμιν
  choice: tùy theo khả năng riêng của mỗi người
  rationale: δύναμις ở đây chỉ năng lực hay khả năng đảm nhận, không phải quyền năng phép lạ. Cách dịch này thể hiện rõ ý phân phối của ἑκάστῳ và tránh đại từ giống đực không cần thiết trong tiếng Việt.
- source_word: ἀπεδήμησεν
  choice: đi xa
  rationale: Động từ nói đến việc rời nhà hay đi đến nơi xa, thường hàm ý một chuyến đi. “Đi xa” ngắn gọn, tự nhiên và giữ được sắc thái ấy.
- source_word: εὐθέως
  choice: ngay lập tức
  rationale: Trạng từ mang nghĩa “ngay lập tức”. Theo dấu câu của SBLGNT, từ này đứng đầu mệnh đề tiếp theo, dù về cú pháp cũng có thể được hiểu là bổ nghĩa cho việc ra đi.
theological_decisions:
- issue: Ý nghĩa của τάλαντα trong dụ ngôn
  choice: Đơn vị tiền tệ/trọng lượng cổ được phiên âm là “ta-lâng”
  alternative: số tiền rất lớn
  rationale: Ngữ cảnh nói về tài sản được giao phó. Bản dịch không nên khiến độc giả hiểu từ này là năng khiếu tự nhiên, nhưng cũng không nên quy đổi thành một giá trị tiền hiện đại thiếu chắc chắn.
- issue: Quan hệ cú pháp của εὐθέως
  choice: Giữ từ này ở đầu câu kế tiếp theo dấu câu của SBLGNT
  alternative: 'Gắn với ἀπεδήμησεν: “rồi lập tức đi xa”'
  rationale: Vị trí và dấu câu của bản nguồn ủng hộ việc nối εὐθέως với hành động ở câu 16, nhưng tiếng Hy Lạp không loại trừ hoàn toàn cách gắn nó với động từ “đi xa”. Ghi chú giữ lại sự mơ hồ thật sự thay vì âm thầm quyết định.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Ta-lâng” được giữ như một thuật ngữ lịch sử, kèm chú thích để ngăn cách hiểu theo nghĩa “tài năng”. Cụm “Ngay lập tức,” được để mở vì phần nguồn được cung cấp kết thúc ngay sau trạng từ vốn dẫn sang câu 16.
