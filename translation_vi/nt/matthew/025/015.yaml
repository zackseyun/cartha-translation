- from: Ông trao cho người này năm ta-lâng[a], người kia hai, và người khác nữa một, tùy theo khả năng riêng của mỗi người[b], rồi đi xa. Ngay lập tức,[c]
  to: Ông trao cho người này năm ta-lâng[a], cho người kia hai, và cho người khác nữa một, tùy theo khả năng riêng của mỗi người[b], rồi đi xa. Ngay lập tức,[c]
