  source_fidelity: 'Bản dịch truyền đạt đầy đủ cấu trúc bộ phận và sự phân đôi cân xứng của nguyên văn: năm người thuộc nhóm được nêu là dại, và năm người là khôn ngoan. “Còn” phản ánh δέ cách tự nhiên mà không tạo đối lập quá mạnh. Việc lược động từ “là” phù hợp cú pháp tiếng Việt.'
