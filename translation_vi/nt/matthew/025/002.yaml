id: MAT.25.2
reference: Matthew 25:2
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: πέντε δὲ ⸂ἐξ αὐτῶν ἦσαν⸃ ⸂μωραὶ καὶ πέντε φρόνιμοι⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/002.yaml
  text: And five of them were foolish, and five were wise.
translation:
  language: vi
  text: Trong số đó, năm cô dại, còn năm cô khôn ngoan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πέντε
  choice: năm
  rationale: Số từ chỉ số lượng được dịch trực tiếp là “năm”; lần xuất hiện thứ hai được giữ lại để bảo toàn thế cân đối và tương phản của câu Hy Lạp.
- source_word: δὲ
  choice: còn
  rationale: δέ ở đây vừa nối tiếp lời kể vừa đánh dấu sự phân chia trong nhóm; “còn” tự nhiên trong tiếng Việt và không làm sắc thái đối lập mạnh quá mức.
- source_word: ἐξ αὐτῶν
  choice: trong số đó
  rationale: Cụm chỉ bộ phận cho biết năm người này thuộc nhóm đã nhắc đến; “trong số đó” diễn đạt rõ và tự nhiên.
- source_word: ἦσαν
  choice: '[được diễn đạt bằng cấu trúc vị ngữ không có từ “là”]'
  rationale: Trong tiếng Việt, tính từ có thể trực tiếp làm vị ngữ; không cần dịch động từ hệ từ ἦσαν bằng “là” mà ý nghĩa vẫn đầy đủ.
- source_word: μωραὶ
  choice: dại
  rationale: μωρός chỉ sự thiếu sáng suốt hoặc thiếu phán đoán đúng đắn. “Dại” tạo cặp đối xứng tự nhiên với “khôn ngoan” và phù hợp văn cảnh dụ ngôn.
- source_word: καὶ πέντε φρόνιμοι
  choice: còn năm cô khôn ngoan
  rationale: φρόνιμος mang nghĩa khôn ngoan, biết suy xét hoặc thận trọng. “Khôn ngoan” giữ được sắc thái tích cực và sự tương phản với “dại”; danh từ “cô” được bổ sung theo đối tượng giống cái đã nêu ở câu trước.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cấu trúc “năm cô dại, còn năm cô khôn ngoan” giữ nhịp cân đối của nguyên văn; “cô” làm rõ đối tượng nữ trong tiếng Việt mà không thêm cách giải thích thần học.
