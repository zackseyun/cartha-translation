  verdict: revise
  source_fidelity: 'Bản dịch chuyển tải đúng các thành tố chính của câu Hy Lạp: trình tự thời gian, nhóm ở bên trái, lời truyền phải rời khỏi người nói, tình trạng «bị nguyền rủa», đích đến là lửa đời đời, và lửa ấy đã được chuẩn bị cho ma quỷ cùng các thiên sứ của nó. Tuy nhiên, trật tự hiện tại đặt lời gọi «Hỡi những kẻ bị nguyền rủa» trước mệnh lệnh, trong khi nguyên văn mở đầu bằng mệnh lệnh «Hãy đi khỏi Ta»; có thể điều chỉnh nhẹ để phản ánh cấu trúc và lực của lời tuyên án sát hơn.'
  naturalness: «Bấy giờ», «sẽ phán», «bên trái», và «lửa đời đời» đều tự nhiên trong văn phong Kinh Thánh tiếng Việt hiện đại. Cụm «hãy lìa khỏi Ta mà vào lửa» hơi dễ tạo cảm giác quan hệ phương tiện/mục đích do từ «mà». Đặt hai mệnh lệnh song song bằng dấu phẩy tạo câu rõ và mạnh hơn.
  terminology: '«Ma quỷ», «thiên sứ», «đời đời», và cách dùng «Ta» trong lời phán của Vua phù hợp ngữ cảnh và truyền thống thuật ngữ Việt ngữ. «Bị nguyền rủa» giữ đúng bị động của κατηραμένοι, không thêm chủ thể nguyền rủa. Không cần chú thích: phương án «lìa khỏi»/«rời khỏi» không tạo khác biệt nghĩa đáng kể trong bản dịch Việt.'
