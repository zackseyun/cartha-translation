  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: τότε ἐρεῖ καὶ τοῖς ἐξ εὐωνύμων· Πορεύεσθε ἀπ’ ἐμοῦ ⸀οἱ κατηραμένοι εἰς τὸ πῦρ τὸ αἰώνιον τὸ ἡτοιμασμένον τῷ διαβόλῳ καὶ τοῖς ἀγγέλοις αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/041.yaml
  text: Then he will also say to those on the left[a], ‘Go away from me, you cursed, into the eternal fire prepared for the devil and his angels.’
translation:
  language: vi
  text: 'Bấy giờ, Ngài cũng sẽ phán với những người ở bên trái: “Hãy lìa khỏi Ta, hỡi những kẻ bị nguyền rủa, mà vào ngọn lửa đời đời, là ngọn lửa đã được chuẩn bị cho ma quỷ và các thiên sứ của nó.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τότε
  choice: Bấy giờ
  rationale: Diễn tả trình tự thời gian trong cảnh phán xét, tự nhiên và trang trọng trong tiếng Việt.
- source_word: ἐρεῖ
  choice: sẽ phán
  rationale: Là thì tương lai của λέγω. Trong lời tuyên án của vị vua, “phán” phù hợp với ngữ cảnh trang trọng mà không làm thay đổi nội dung hành động nói.
- source_word: τοῖς ἐξ εὐωνύμων
  choice: với những người ở bên trái
  rationale: Diễn đạt tự nhiên vị trí của nhóm người đứng bên trái vị vua trong văn cảnh ngay trước đó.
- source_word: Πορεύεσθε ἀπ’ ἐμοῦ
  choice: hãy lìa khỏi Ta
  rationale: Giữ sức mạnh của mệnh lệnh và ý nghĩa bị buộc phải rời khỏi sự hiện diện của người nói; “lìa khỏi” trang trọng nhưng vẫn dễ hiểu.
- source_word: οἱ κατηραμένοι
  choice: Hỡi những kẻ bị nguyền rủa
  rationale: Phân từ hoàn thành bị động được dùng như lời gọi trực tiếp. Cách dịch giữ sắc thái bị nguyền rủa mà không xác định thêm chủ thể thi hành lời nguyền.
- source_word: εἰς τὸ πῦρ τὸ αἰώνιον
  choice: vào lửa đời đời
  rationale: “Vào” giữ hướng chuyển động của εἰς; “đời đời” là cách diễn đạt tự nhiên, quen thuộc cho αἰώνιον trong ngữ cảnh phán xét.
- source_word: τὸ ἡτοιμασμένον
  choice: là lửa đã được chuẩn bị
  rationale: Giữ thể bị động và trạng thái hiện tại do hành động chuẩn bị trước đó tạo nên; lặp lại “lửa” giúp câu tiếng Việt rõ nghĩa.
- source_word: τῷ διαβόλῳ
  choice: cho ma quỷ
  rationale: Trong ngữ cảnh cánh chung, διάβολος là danh xưng đã xác lập của kẻ đối nghịch, không chỉ là danh từ chung chỉ người vu cáo.
- source_word: τοῖς ἀγγέλοις αὐτοῦ
  choice: các thiên sứ của nó
  rationale: Trong ngữ cảnh này, ἄγγελοι chỉ các hữu thể siêu nhiên thuộc về ma quỷ, không phải các sứ giả loài người.
theological_decisions:
- issue: Ý nghĩa của αἰώνιον trong ngữ cảnh phán xét
  choice: đời đời
  alternative: vĩnh viễn; thuộc về thời đại
  rationale: “Đời đời” phản ánh cách dùng thông thường của αἰώνιον trong ngữ cảnh này và giữ nguyên mức độ nghiêm trọng của lời phán xét, không thêm một hệ thống giáo lý chi tiết ngoài câu văn.
- issue: Đối tượng được nói đến bởi διάβολος và ἄγγελοι
  choice: ma quỷ và các thiên sứ của nó
  alternative: kẻ vu cáo và các sứ giả của nó
  rationale: Cảnh phán xét cuối cùng và cách kết hợp từ ngữ cho thấy đây là ma quỷ cùng các hữu thể thiên sứ theo nó; dịch theo nghĩa chung sẽ làm mờ đối tượng đã được xác lập trong văn cảnh.
- issue: Thể bị động trong οἱ κατηραμένοι
  choice: những kẻ bị nguyền rủa
  alternative: những kẻ đáng nguyền rủa
  rationale: Giữ thể bị động của nguyên văn và không chuyển nó thành lời đánh giá về phẩm chất hay mức độ xứng đáng của họ.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Viết hoa “Ngài” và “Ta” để giữ cách xưng hô tôn kính trong lời của vị vua; dùng “nó” cho ma quỷ để tránh tôn xưng. Không thêm chú thích vì các phương án dịch khác không tạo ra khác biệt đủ lớn cần đưa vào bản văn.
