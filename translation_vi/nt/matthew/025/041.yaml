- from: 'Bấy giờ, Ngài cũng sẽ phán với những người ở bên trái: “Hỡi những kẻ bị nguyền rủa, hãy lìa khỏi Ta mà vào lửa đời đời, là lửa đã được chuẩn bị cho ma quỷ và các thiên sứ của nó.”'
  to: 'Bấy giờ, Ngài cũng sẽ phán với những người ở bên trái: “Hãy lìa khỏi Ta, hỡi những kẻ bị nguyền rủa, mà vào ngọn lửa đời đời, là ngọn lửa đã được chuẩn bị cho ma quỷ và các thiên sứ của nó.”'
