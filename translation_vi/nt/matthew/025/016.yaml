  terminology: “Ta-lâng” nhất quán và chú thích đúng là đơn vị tiền tệ lớn trong ngữ cảnh này, không phải “năng khiếu.” Cách nói “đơn vị trọng lượng và tiền tệ” phản ánh nền tảng lịch sử của thuật ngữ mà vẫn không làm thay đổi nghĩa trong câu.
