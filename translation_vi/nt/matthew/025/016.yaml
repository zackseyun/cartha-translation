  text: ⸀πορευθεὶς ὁ τὰ πέντε τάλαντα λαβὼν ἠργάσατο ἐν αὐτοῖς καὶ ⸀ἐκέρδησεν ἄλλα ⸀πέντε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/016.yaml
  text: The one who had received the five talents went and worked with them[b][a], and gained another five.
translation:
  language: vi
  text: Người đã nhận năm ta-lâng đi dùng số tiền ấy để làm ăn[a] và kiếm thêm được năm ta-lâng nữa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ta-lâng là một đơn vị trọng lượng và tiền tệ có giá trị rất lớn thời ấy, không phải là năng khiếu tự nhiên.
    reason: cultural_note
lexical_decisions:
- source_word: πορευθεὶς
  choice: liền đi
  rationale: Phân từ chỉ hành động đi trước hành động chính. “Liền đi” diễn đạt tự nhiên sự tiếp nối mau lẹ trong mạch truyện, nhưng không thêm “ngay lập tức” như một ý nhấn mạnh độc lập.
- source_word: ὁ τὰ πέντε τάλαντα λαβὼν
  choice: người đã nhận năm ta-lâng
  rationale: Giữ cấu trúc xác định người đầy tớ qua số tiền đã nhận, không thêm danh xưng không có trong cụm từ Hy Lạp.
- source_word: τάλαντα
  choice: ta-lâng
  rationale: Giữ thuật ngữ chỉ đơn vị trọng lượng và tiền tệ lớn trong bối cảnh cổ đại; chú thích ngăn người đọc hiểu theo nghĩa năng khiếu hiện đại.
- source_word: ἠργάσατο ἐν αὐτοῖς
  choice: dùng số tiền ấy để làm ăn
  rationale: Diễn đạt việc chủ động sử dụng khoản tiền nhằm sinh lợi. “Làm ăn” tự nhiên trong tiếng Việt và không thu hẹp nghĩa thành một hình thức giao dịch cụ thể.
- source_word: ἐκέρδησεν
  choice: kiếm thêm được
  rationale: Thể hiện rõ kết quả sinh lợi của κερδαίνω trong ngữ cảnh tiền bạc.
- source_word: ἄλλα πέντε
  choice: năm ta-lâng nữa
  rationale: Diễn đạt tự nhiên ý cộng thêm năm đơn vị; lặp lại “ta-lâng” để câu rõ nghĩa trong tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Làm ăn” truyền đạt sắc thái sử dụng tiền để sinh lợi; “số tiền ấy” làm rõ đại từ số nhiều chỉ các ta-lâng mà không thay thế thuật ngữ nguồn.
