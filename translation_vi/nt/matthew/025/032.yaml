  text: καὶ ⸀συναχθήσονται ἔμπροσθεν αὐτοῦ πάντα τὰ ἔθνη, καὶ ἀφορίσει αὐτοὺς ἀπ’ ἀλλήλων, ὥσπερ ὁ ποιμὴν ἀφορίζει τὰ πρόβατα ἀπὸ τῶν ἐρίφων,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/032.yaml
  text: And all the nations will be gathered before him[a], and he will separate them from one another, just as the shepherd separates the sheep from the goats[b],
translation:
  language: vi
  text: Tất cả các dân tộc sẽ được tập hợp trước mặt Người[a], và Người sẽ tách họ ra khỏi nhau, như người chăn chiên tách chiên khỏi dê con[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “mọi dân”; tiếng Hy Lạp là “tất cả các dân tộc” (πάντα τὰ ἔθνη).
    reason: lexical_alternative
  - marker: b
    text: Từ Hy Lạp ἐρίφων có thể chỉ cụ thể là “dê non” hoặc “dê con.”
    reason: lexical_alternative
lexical_decisions:
- source_word: συναχθήσονται
  choice: sẽ được tập hợp
  rationale: Giữ thể tương lai bị động của động từ Hy Lạp mà không thêm tác nhân không được nêu rõ.
- source_word: ἔμπροσθεν αὐτοῦ
  choice: trước mặt Người
  rationale: Cách diễn đạt tự nhiên, trang trọng, phù hợp với cảnh phán xét và giữ đại từ chỉ nhân vật đã được nói đến trong ngữ cảnh.
- source_word: πάντα τὰ ἔθνη
  choice: tất cả các dân tộc
  rationale: Giữ độ rộng nghĩa của ἔθνη là các dân tộc hoặc các nước, không thu hẹp thành dân ngoại.
- source_word: ἀφορίσει
  choice: sẽ phân chia
  rationale: Diễn đạt trực tiếp hành động tách thành các nhóm; đồng thời tránh lặp quá nhiều từ “tách” trong cùng câu.
- source_word: αὐτοὺς ἀπ’ ἀλλήλων
  choice: họ với nhau
  rationale: Kết hợp với “phân chia” để diễn đạt việc phân tách những người đã được tập hợp thành các nhóm khác nhau.
- source_word: ὥσπερ
  choice: như
  rationale: Dấu hiệu so sánh gọn và tự nhiên trong tiếng Việt.
- source_word: ὁ ποιμὴν
  choice: người chăn chiên
  rationale: Cách gọi quen thuộc, cụ thể và trang trọng; mạo từ Hy Lạp có chức năng chỉ loại trong hình ảnh minh họa.
- source_word: τὰ πρόβατα
  choice: chiên
  rationale: Giữ hình ảnh con vật cụ thể thay vì chuyển thành nghĩa tập thể là bầy.
- source_word: τῶν ἐρίφων
  choice: dê con
  rationale: ἐρίφων có thể chỉ dê non; “dê con” tự nhiên trong tiếng Việt và chính xác hơn từ khái quát “dê”.
theological_decisions:
- issue: Phạm vi của πάντα τὰ ἔθνη
  choice: tất cả các dân tộc
  alternative: mọi dân; tất cả dân ngoại
  rationale: Bản dịch giữ nghĩa rộng của cụm từ Hy Lạp, không quyết định rằng đối tượng chỉ là dân ngoại và cũng không áp đặt một mô hình thần học cụ thể về cuộc phán xét.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Viết hoa “Người” để giúp nhận diện nhân vật trong ngữ cảnh mà không thêm danh xưng thần học. Duy trì nhịp câu song song của nguyên văn và giữ dấu phẩy cuối câu theo đơn vị câu trích được cung cấp.
