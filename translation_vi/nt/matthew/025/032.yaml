revisions:
- from: Tất cả các dân tộc sẽ được tập hợp trước mặt Người[a], và Người sẽ phân chia họ với nhau, như người chăn chiên phân chia chiên khỏi dê con[b].
  to: Tất cả các dân tộc sẽ được tập hợp trước mặt Người[a], và Người sẽ tách họ ra khỏi nhau, như người chăn chiên tách chiên khỏi dê con[b].
  rationale: Bản sửa thay “phân chia họ với nhau” bằng “tách họ ra khỏi nhau” để phản ánh chính xác ἀφορίσει αὐτοὺς ἀπ’ ἀλλήλων và làm rõ phép so sánh được lặp lại bằng động từ “tách.” Chú thích b được sửa để phản ánh đúng sắc thái “dê non/dê con” của ἐρίφων. Không thay đổi phạm vi mở của “tất cả các dân tộc” hoặc thêm diễn giải thần học.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T05:44:24Z'
review_pass:
  verdict: revise
  source_fidelity: 'Cần sửa cụm “phân chia họ với nhau”: cụm này không diễn đạt rõ chiều hướng ἀπ’ ἀλλήλων (“ra khỏi nhau/tách khỏi nhau”) và có thể bị hiểu là chia họ cùng với nhau. Bản dịch “dê con” phản ánh hợp lý sắc thái cụ thể hơn của ἐρίφων.'
  naturalness: “Tách họ ra khỏi nhau” là cách nói tiếng Việt hiện đại, tự nhiên và chính xác trong ngữ cảnh. Giữ “người chăn chiên,” “chiên,” và “dê con” tạo một hình ảnh so sánh nhất quán, trang trọng, dễ hiểu.
  terminology: “Tất cả các dân tộc” bảo toàn độ rộng của πάντα τὰ ἔθνη, không thu hẹp thành “dân ngoại.” “Trước mặt Người” phù hợp với ἔμπροσθεν αὐτοῦ. Chú thích b cần được đảo lại để nói rằng ἐρίφων có thể chỉ cụ thể là dê non/dê con, thay vì nói là nghĩa rộng hơn “dê.”
  issues:
  - severity: medium
    issue: “phân chia họ với nhau” chưa chuyển đạt ἀφορίσει αὐτοὺς ἀπ’ ἀλλήλων.
    rationale: Nguyên ngữ nói đến việc tách họ khỏi nhau, không phải phân chia họ “với nhau.” Cần dùng “tách họ ra khỏi nhau” để giữ rõ quan hệ phân cách.
  - severity: medium
    issue: Chú thích b mô tả sai hướng sắc thái từ vựng của ἐρίφων.
    rationale: ἐρίφων có thể mang nghĩa cụ thể hơn là “dê non/dê con”; “dê” là cách dịch khái quát hơn, không phải nghĩa rộng hơn mà từ Hy Lạp có thể được hiểu.
  revised_text: Tất cả các dân tộc sẽ được tập hợp trước mặt Người[a], và Người sẽ tách họ ra khỏi nhau, như người chăn chiên tách chiên khỏi dê con[b].
