  terminology: “Đầy tớ,” “trung tín,” “ông chủ/chủ,” và “cai quản” nhất quán với ngữ cảnh và từ vựng nguồn. Việc lặp “trung tín” phản ánh đúng sự lặp πιστός/πιστέ.
