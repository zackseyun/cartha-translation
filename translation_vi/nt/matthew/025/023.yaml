id: MAT.25.23
reference: Matthew 25:23
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἔφη αὐτῷ ὁ κύριος αὐτοῦ· Εὖ, δοῦλε ἀγαθὲ καὶ πιστέ, ἐπὶ ὀλίγα ἦς πιστός, ἐπὶ πολλῶν σε καταστήσω· εἴσελθε εἰς τὴν χαρὰν τοῦ κυρίου σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/023.yaml
  text: His master said to him[a], ‘Well done, good and faithful servant. You were faithful over a few things; I will put you over many things. Enter into the joy of your master.’
translation:
  language: vi
  text: 'Ông chủ nói với anh: “Tốt lắm, hỡi đầy tớ[a] tốt và trung tín! Anh đã trung tín trong ít việc, ta sẽ giao cho anh cai quản nhiều việc. Hãy bước vào niềm vui của chủ anh.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “nô lệ”. Từ Hy Lạp δοῦλος có thể chỉ đầy tớ hoặc nô lệ, tùy văn cảnh.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔφη αὐτῷ ὁ κύριος αὐτοῦ
  choice: Ông chủ nói với anh
  rationale: Diễn đạt tự nhiên lời dẫn trực tiếp; κύριος trong bối cảnh dụ ngôn chỉ người chủ của đầy tớ, còn αὐτῷ được thể hiện bằng “với anh”.
- source_word: Εὖ
  choice: Tốt lắm
  rationale: Lời khen tự nhiên trong tiếng Việt, truyền đạt sự tán thưởng của người chủ.
- source_word: δοῦλε ἀγαθὲ καὶ πιστέ
  choice: hỡi đầy tớ tốt và trung tín
  rationale: Giữ lối xưng hô trực tiếp của các tính từ ở hô cách; “trung tín” cũng duy trì liên hệ từ vựng với πιστός ở mệnh đề sau.
- source_word: ἐπὶ ὀλίγα ἦς πιστός
  choice: Anh đã trung tín trong ít việc
  rationale: ἐπί ở đây chỉ phạm vi trách nhiệm được giao; “ít việc” giữ sự tương phản trực tiếp với “nhiều việc” mà không thêm ý các việc ấy nhất thiết nhỏ về tầm quan trọng.
- source_word: ἐπὶ πολλῶν σε καταστήσω
  choice: ta sẽ giao cho anh cai quản nhiều việc
  rationale: καθίστημι trong ngữ cảnh này mang nghĩa đặt hoặc bổ nhiệm ai vào trách nhiệm; cách dịch làm rõ ý quản nhiệm hàm chứa trong cấu trúc Hy Lạp.
- source_word: εἴσελθε εἰς τὴν χαρὰν
  choice: Hãy bước vào niềm vui
  rationale: Giữ hình ảnh đi vào của động từ εἰσέρχομαι và không giản lược ngay thành “chung vui” hay “hưởng vui”.
- source_word: τοῦ κυρίου σου
  choice: của chủ anh
  rationale: Giữ quan hệ sở hữu và dịch κύριος nhất quán theo nghĩa người chủ trong thế giới của dụ ngôn.
theological_decisions:
- issue: Cách dịch κύριος trong dụ ngôn
  choice: chủ / ông chủ
  alternative: Chúa
  rationale: Trong bình diện câu chuyện, từ này chỉ người chủ của đầy tớ. Dịch “chủ” để bám sát vai trò trong dụ ngôn, không áp đặt trước việc đồng nhất nhân vật với Chúa, nhưng vẫn để ý nghĩa thần học của dụ ngôn tự bộc lộ trong văn cảnh.
- issue: Cách dịch δοῦλος
  choice: đầy tớ
  alternative: nô lệ
  rationale: δοῦλος có thể chỉ người nô lệ hoặc đầy tớ thuộc quyền chủ. Trọng tâm câu này là lòng trung tín trong trách nhiệm được giao; “đầy tớ” tự nhiên và trang trọng trong tiếng Việt, còn sắc thái “nô lệ” được ghi rõ trong chú thích.
- issue: Hình ảnh εἴσελθε εἰς τὴν χαράν
  choice: bước vào niềm vui
  alternative: chung hưởng niềm vui
  rationale: Giữ nguyên ẩn dụ không gian của bản Hy Lạp, tránh âm thầm quyết định rằng cụm từ chỉ có nghĩa tham dự hay chung hưởng, dù đó là một hàm ý hợp lý.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Đại từ “anh” phù hợp lời người chủ nói với người đầy tớ trưởng thành; “ta” thể hiện quan hệ trên dưới trong dụ ngôn mà không mang sắc thái thô miệt. Dấu cảm thán làm rõ giọng khen ngợi vốn có trong Εὖ.
