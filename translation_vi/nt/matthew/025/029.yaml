id: MAT.25.29
reference: Matthew 25:29
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: τῷ γὰρ ἔχοντι παντὶ δοθήσεται καὶ περισσευθήσεται· ⸂τοῦ δὲ⸃ μὴ ἔχοντος καὶ ὃ ἔχει ἀρθήσεται ἀπ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/029.yaml
  text: For to everyone who has[a], more will be given, and he will have an abundance; but from the one who does not have, even what he has will be taken away from him.
translation:
  language: vi
  text: Vì ai có thì sẽ được ban thêm, và sẽ có dư dật; còn người không có thì ngay cả điều người ấy đang có cũng sẽ bị lấy khỏi người ấy.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τῷ γὰρ ἔχοντι παντὶ
  choice: Vì ai có thì
  rationale: γάρ nối câu này với lời giải thích ở trước bằng “Vì”; kết cấu phân từ có mạo từ cùng παντί mang ý phân phối, được diễn đạt tự nhiên trong tiếng Việt là “ai có thì”.
- source_word: δοθήσεται
  choice: sẽ được ban thêm
  rationale: Giữ thể bị động của δίδωμι. “Thêm” được hàm ý tự nhiên từ đối lập giữa đang có và tiếp tục được ban, đồng thời làm câu tiếng Việt rõ nghĩa.
- source_word: περισσευθήσεται
  choice: sẽ có dư dật
  rationale: περισσεύω ở đây chỉ tình trạng dồi dào, vượt quá mức đủ. “Có dư dật” vừa tự nhiên vừa giữ sắc thái phong phú của động từ.
- source_word: τοῦ δὲ μὴ ἔχοντος
  choice: còn người không có
  rationale: δέ đánh dấu sự tương phản; “còn” thể hiện quan hệ ấy tự nhiên. Danh hóa số ít được giữ bằng “người không có”.
- source_word: καὶ ὃ ἔχει
  choice: ngay cả điều người ấy đang có
  rationale: καί mang nghĩa tăng tiến “ngay cả”, nhấn mạnh nghịch lý. Thì hiện tại của ἔχει được thể hiện bằng “đang có”.
- source_word: ἀρθήσεται ἀπ’ αὐτοῦ
  choice: cũng sẽ bị lấy khỏi người ấy
  rationale: Giữ thể bị động tương lai và ý tách khỏi của ἀπό. “Lấy khỏi” là cách diễn đạt gọn, rõ trong tiếng Việt.
theological_decisions:
- issue: Cách diễn đạt chủ thể đại diện ở số ít
  choice: Dùng “ai” ở vế đầu và “người… người ấy” ở vế sau
  alternative: 'Chuyển cả hai vế sang số nhiều: “những ai… họ”'
  rationale: Tiếng Việt không cần đánh dấu giống ngữ pháp. Cách dùng số ít đại diện giữ cấu trúc khái quát của nguyên văn mà không đưa thêm hàm ý giới tính.
- issue: Đối tượng được ban và bị lấy không được nêu rõ
  choice: Không bổ sung danh từ như “ơn”, “tài năng” hay “của cải”
  alternative: Nêu rõ một đối tượng dựa theo cách giải thích dụ ngôn
  rationale: Nguyên văn cố ý dùng tuyệt đối “có” và “được ban”; giữ cách nói mở bảo toàn tính khái quát và sức căng thần học của câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ nhịp đối xứng giữa “ai có” và “người không có”, không dùng đại từ mang giới tính và không giải nghĩa dụ ngôn ngay trong bản văn.
