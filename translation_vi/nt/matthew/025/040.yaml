  naturalness: “Trong chừng mực mà” là tiếng Việt hiện đại, trang trọng và chính xác hơn trong văn cảnh này. Câu được điều chỉnh nhẹ để đọc tự nhiên, đồng thời duy trì tính song hành của hai lần ἐποιήσατε.
