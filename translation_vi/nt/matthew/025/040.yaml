id: MAT.25.40
reference: Matthew 25:40
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἀποκριθεὶς ὁ βασιλεὺς ἐρεῖ αὐτοῖς· Ἀμὴν λέγω ὑμῖν, ἐφ’ ὅσον ἐποιήσατε ἑνὶ τούτων τῶν ἀδελφῶν μου τῶν ἐλαχίστων, ἐμοὶ ἐποιήσατε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/040.yaml
  text: And the King will answer them[a], ‘Truly I say to you, insofar as you did it to one of the least of these brothers of mine[b], you did it to me.’
translation:
  language: vi
  text: 'Vua sẽ đáp lời họ: “Thật, tôi nói với các anh[a], trong chừng mực mà các anh đã làm điều ấy cho một người trong số những anh em nhỏ bé nhất này của tôi[b], thì các anh đã làm cho chính tôi.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay, sát nguyên văn hơn: “A-men, tôi nói với các anh.”'
    reason: lexical_alternative
  - marker: b
    text: “Anh em” dịch danh từ Hy Lạp giống đực số nhiều. Cụm “những anh em nhỏ bé nhất này của tôi” có thể chỉ riêng các môn đồ của Chúa Giê-su, các tín hữu nói chung, hoặc rộng hơn là những người yếu thế; bản dịch giữ nguyên cách diễn đạt mà không quyết định vấn đề diễn giải.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποκριθεὶς ὁ βασιλεὺς ἐρεῖ αὐτοῖς
  choice: Vua sẽ đáp lời họ
  rationale: Gộp phân từ ἀποκριθείς với động từ tương lai ἐρεῖ thành cách diễn đạt tự nhiên trong tiếng Việt, đồng thời giữ sắc thái hồi đáp.
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: Thật, tôi nói với các anh
  rationale: “Thật” truyền đạt lực xác quyết trang trọng của ἀμήν; “tôi nói với các anh” bám sát công thức Hy Lạp. Chú thích nêu cách dịch sát hình thức hơn.
- source_word: ἐφ’ ὅσον
  choice: chừng nào
  rationale: Diễn đạt quan hệ mức độ/phạm vi của cụm Hy Lạp mà không chuyển thành một mệnh đề quan hệ tự do như “bất cứ điều gì”.
- source_word: ἐποιήσατε
  choice: đã làm điều ấy
  rationale: Bổ sung “điều ấy” theo đối tượng được hàm ý, giúp tiếng Việt rõ nghĩa và duy trì sự lặp lại song song ở cuối câu.
- source_word: ἑνὶ τούτων
  choice: cho một người trong số ... này
  rationale: Giữ lực cá thể hóa của ἑνί và quan hệ hướng đến người nhận hành động.
- source_word: τῶν ἀδελφῶν μου τῶν ἐλαχίστων
  choice: những anh em nhỏ bé nhất này của tôi
  rationale: Giữ danh từ giống đực số nhiều “anh em,” đại từ chỉ định “này,” sở hữu “của tôi,” và nghĩa mở về địa vị/tầm vóc của ἐλάχιστος mà không tự ý xác định nhóm người được nói đến.
- source_word: ἐμοὶ ἐποιήσατε
  choice: các anh đã làm cho chính tôi
  rationale: “Cho ... tôi” thể hiện cách dùng tặng cách; “chính” làm rõ sự nhấn mạnh do ἐμοί đứng đầu cụm và sự đồng nhất mang tính tu từ.
theological_decisions:
- issue: Đối tượng của cụm “những anh em ... này của tôi”
  choice: Giữ nguyên cách gọi “những anh em nhỏ bé nhất này của tôi,” không xác định họ là nhóm nào.
  alternative: Xác định là các môn đồ/sứ giả của Chúa Giê-su, các tín hữu nói chung, hoặc mọi người nghèo yếu và dễ bị tổn thương.
  rationale: Bản thân câu Hy Lạp không giải quyết dứt điểm vấn đề quy chiếu; giữ cách nói nguyên bản bảo toàn sự căng thẳng diễn giải.
- issue: Cách thể hiện giống của ἀδελφῶν
  choice: anh em
  alternative: anh chị em; đồng loại
  rationale: Từ Hy Lạp ở dạng giống đực số nhiều. “Anh em” vừa tự nhiên trong tiếng Việt vừa không thêm một phạm vi quy chiếu mà nguyên văn chưa minh định.
- issue: Cách xưng hô của nhà vua với nhóm người
  choice: tôi ... các anh
  alternative: Ta ... các ngươi; ta ... anh em
  rationale: “Tôi ... các anh” là tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu; tránh dùng lối xưng hô cổ có thể thêm sắc thái quyền uy vượt quá chính đại từ Hy Lạp.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Viết hoa “Vua” như một tước hiệu quy chiếu đến nhân vật xét xử trong ngữ cảnh. Dấu chú thích [b] đặt ngay sau cụm gây vấn đề diễn giải; [a] đặt sau toàn bộ lời phán để chú giải công thức mở đầu.
