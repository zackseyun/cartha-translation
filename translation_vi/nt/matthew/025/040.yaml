- from: 'Vua sẽ đáp lời họ: “Thật, tôi nói với các anh, chừng nào các anh đã làm điều ấy cho một người trong số những anh em nhỏ bé nhất này của tôi[b], thì các anh đã làm cho chính tôi.”[a]'
  to: 'Vua sẽ đáp lời họ: “Thật, tôi nói với các anh[a], trong chừng mực mà các anh đã làm điều ấy cho một người trong số những anh em nhỏ bé nhất này của tôi[b], thì các anh đã làm cho chính tôi.”'
