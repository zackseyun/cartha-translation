source:
  edition: SBLGNT
  text: Ὥσπερ γὰρ ἄνθρωπος ἀποδημῶν ἐκάλεσεν τοὺς ἰδίους δούλους καὶ παρέδωκεν αὐτοῖς τὰ ὑπάρχοντα αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/014.yaml
  text: For it is like a man going on a journey[a], who called his own servants and entrusted his possessions to them.
translation:
  language: vi
  text: 'Vì điều ấy giống như một người sắp đi xa: ông gọi những nô lệ[a] của mình đến và giao tài sản của mình cho họ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “đầy tớ” hoặc “tôi tớ”. Từ Hy Lạp doulos có thể chỉ đầy tớ hoặc nô lệ tùy ngữ cảnh; ở đây dùng “nô lệ” vì quyền sở hữu và thẩm quyền của người chủ được nhấn mạnh.
    reason: alternative_reading
lexical_decisions:
- source_word: Ὥσπερ γὰρ
  choice: Vì chuyện ấy cũng giống như
  rationale: Cụm từ mở đầu đưa ra một sự so sánh nhằm giải thích lời trước đó. Tiếng Việt thêm “chuyện ấy” để câu văn tự nhiên, đồng thời không xác định quá mức đối tượng được so sánh.
- source_word: ἄνθρωπος
  choice: một người
  rationale: Trong dụ ngôn, danh từ số ít chỉ một người cụ thể; tiếng Việt “một người” tự nhiên và không cần thêm từ chỉ giới tính vì các đại từ tiếp theo đã làm rõ nhân vật.
- source_word: ἀποδημῶν
  choice: sắp đi xa
  rationale: Phân từ diễn tả việc rời nơi mình ở để đến nơi khác. “Đi xa” tự nhiên hơn “đi ra nước ngoài” và không diễn giải quá mức; “sắp” phù hợp với việc ông gọi các nô lệ trước khi lên đường.
- source_word: ἐκάλεσεν
  choice: gọi ... đến
  rationale: Diễn đạt trực tiếp hành động gọi những người thuộc nhà mình đến gặp, tự nhiên trong tiếng Việt hiện đại.
- source_word: τοὺς ἰδίους δούλους
  choice: những nô lệ của mình
  rationale: δοῦλος có thể là đầy tớ hoặc nô lệ tùy ngữ cảnh. Ở đây quyền sở hữu và thẩm quyền của chủ nổi bật, nên “nô lệ” giữ rõ địa vị lệ thuộc; ἰδίους được thể hiện bằng “của mình”.
- source_word: παρέδωκεν
  choice: giao
  rationale: Trong ngữ cảnh trao tài sản để quản lý, “giao” hàm ý trao trách nhiệm mà không cần bổ sung một cách diễn giải như “ủy thác quản lý”.
- source_word: τὰ ὑπάρχοντα αὐτοῦ
  choice: tài sản
  rationale: Cụm từ chỉ những gì thuộc về người ấy. “Tài sản” ngắn gọn, rõ nghĩa và phù hợp bối cảnh kinh tế của dụ ngôn.
theological_decisions:
- issue: Cách dịch δοῦλος trong bối cảnh gia đình của dụ ngôn
  choice: nô lệ
  alternative: đầy tớ; tôi tớ
  rationale: “Nô lệ” giữ lại thực trạng xã hội về sự lệ thuộc và quyền của người chủ vốn nổi bật trong dụ ngôn, thay vì làm nhẹ nghĩa bằng một từ chỉ người phục vụ nói chung. Chú thích ghi nhận các cách dịch truyền thống và ít trực diện hơn.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dấu hai chấm giúp mở phần hành động minh họa sau lời so sánh. Không thêm ý “đi nước ngoài”, vì nguyên ngữ chỉ nói đến việc rời đi xa.
