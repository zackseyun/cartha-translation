  text: Likewise[a], the one with the two gained two more.
translation:
  language: vi
  text: Cũng vậy, người có hai ta-lâng đã kiếm thêm được hai ta-lâng nữa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὡσαύτως
  choice: Cũng vậy
  rationale: Diễn đạt tự nhiên mối liên hệ so sánh với hành động của người đầy tớ ở câu 16.
- source_word: ὁ τὰ δύο
  choice: người có hai ta-lâng
  rationale: Giữ cấu trúc tỉnh lược của tiếng Hy Lạp nhưng bổ sung danh từ chỉ đơn vị từ ngữ cảnh để câu tiếng Việt rõ nghĩa.
- source_word: ἐκέρδησεν
  choice: đã kiếm thêm được
  rationale: Trong ngữ cảnh tiền bạc, cách nói này diễn đạt việc thu được khoản gia tăng nhờ hoạt động thành công, mà không hàm ý tiền công.
- source_word: ἄλλα δύο
  choice: hai ta-lâng nữa
  rationale: Diễn đạt rõ số lượng bổ sung cùng loại; “nữa” tương ứng tự nhiên với ἄλλα.
theological_decisions: []
