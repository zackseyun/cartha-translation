  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀπερχομένων δὲ αὐτῶν ἀγοράσαι ἦλθεν ὁ νυμφίος, καὶ αἱ ἕτοιμοι εἰσῆλθον μετ’ αὐτοῦ εἰς τοὺς γάμους, καὶ ἐκλείσθη ἡ θύρα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/010.yaml
  text: But while they were going away to buy[a], the bridegroom came, and those who were ready went in with him to the wedding feast, and the door was shut.
translation:
  language: vi
  text: Nhưng trong khi họ đi mua, chàng rể đến; những cô đã sẵn sàng cùng chàng vào dự tiệc cưới[a], rồi cửa đóng lại.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “lễ cưới” hoặc “yến tiệc cưới.” Từ Hy Lạp ở số nhiều có thể chỉ toàn bộ lễ mừng cưới.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπερχομένων δὲ αὐτῶν ἀγοράσαι
  choice: Nhưng trong khi họ đi mua
  rationale: Cấu trúc sở hữu cách tuyệt đối diễn tả hành động đang diễn ra đồng thời; “đi mua” tự nhiên trong tiếng Việt, giữ mục đích của động từ nguyên mẫu ἀγοράσαι và không tự thêm đối tượng “dầu” vốn không được nêu trong câu này.
- source_word: ὁ νυμφίος
  choice: chàng rể
  rationale: Cách gọi thông dụng, chính xác trong bối cảnh cưới hỏi và giữ nguyên hình ảnh của dụ ngôn.
- source_word: αἱ ἕτοιμοι
  choice: những cô đã sẵn sàng
  rationale: Tính từ giống cái số nhiều được dùng như danh từ, chỉ những cô gái trong văn cảnh; cách dịch này vừa tự nhiên vừa giữ ý họ ở trong trạng thái sẵn sàng.
- source_word: εἰσῆλθον μετ’ αὐτοῦ
  choice: cùng chàng vào
  rationale: Diễn đạt gọn và tự nhiên hành động họ đi vào cùng chàng rể.
- source_word: εἰς τοὺς γάμους
  choice: vào dự tiệc cưới
  rationale: Danh từ số nhiều trong tiếng Hy Lạp có thể chỉ toàn bộ cuộc vui hay lễ mừng cưới; “dự tiệc cưới” truyền đạt rõ sự tham dự vào dịp ấy bằng tiếng Việt hiện đại.
- source_word: ἐκλείσθη ἡ θύρα
  choice: cửa đóng lại
  rationale: Giữ sắc thái bị động/phi tác nhân mà không thêm người đóng cửa, đồng thời truyền tải tính dứt khoát của cảnh kết.
theological_decisions:
- issue: Hình ảnh cưới hỏi trong dụ ngôn
  choice: Giữ “chàng rể” và “tiệc cưới” như hình ảnh kể chuyện, không diễn giải căn tính hay ý nghĩa thần học của chàng rể ngay trong bản văn.
  alternative: Nói rõ chàng rể tượng trưng cho ai hoặc thay “tiệc cưới” bằng một thuật ngữ thần học.
  rationale: Bản dịch nên để ý nghĩa thần học nảy sinh từ dụ ngôn và văn cảnh, thay vì đưa phần giải nghĩa vào lời kể.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Dấu chấm phẩy giữ mạch liên tục của câu Hy Lạp nhưng giúp phân biệt hai chuyển biến chính; “rồi” thể hiện diễn tiến kể chuyện mà không xác định thêm tác nhân đóng cửa.
