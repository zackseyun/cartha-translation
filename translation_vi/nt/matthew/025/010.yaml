  source_fidelity: 'Bản dịch truyền đạt đúng diễn tiến chính của câu: trong lúc họ đi mua, chàng rể đến; các cô đã sẵn sàng vào cùng chàng rể dự tiệc cưới; cửa bị đóng. “Tiệc cưới” diễn đạt phù hợp τοὺς γάμους trong văn cảnh. “Cửa đóng lại” giữ được việc không nêu tác nhân, dù sắc thái bị động của ἐκλείσθη được diễn đạt gián tiếp.'
