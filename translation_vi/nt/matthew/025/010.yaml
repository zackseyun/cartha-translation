  terminology: “Chàng rể,” “những cô đã sẵn sàng,” và “tiệc cưới” phù hợp với hình ảnh dụ ngôn, không thêm diễn giải thần học. Chú thích nên dùng các phương án từ vựng tự nhiên hơn.
