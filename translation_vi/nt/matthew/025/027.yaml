id: MAT.25.27
reference: Matthew 25:27
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἔδει ⸂σε οὖν⸃ βαλεῖν ⸂τὰ ἀργύριά⸃ μου τοῖς τραπεζίταις, καὶ ἐλθὼν ἐγὼ ἐκομισάμην ἂν τὸ ἐμὸν σὺν τόκῳ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/027.yaml
  text: Therefore[a], you should have deposited my money with the bankers, and when I came, I would have received what was mine with interest.
translation:
  language: vi
  text: Vậy thì, lẽ ra ngươi phải gửi tiền[a] của ta cho người làm nghề ngân hàng; khi ta trở về, ta đã nhận lại những gì thuộc về ta cùng với tiền lãi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “bạc”.'
    reason: ἀργύρια có thể chỉ bạc theo nghĩa vật chất hoặc tiền nói chung; trong ngữ cảnh tài chính, “tiền” là cách dịch chính tự nhiên hơn.
lexical_decisions:
- source_word: ἔδει σε οὖν
  choice: Vậy, đáng lẽ ngươi phải
  rationale: Diễn đạt tự nhiên nghĩa vụ lẽ ra phải thực hiện trong quá khứ của ἔδει, đồng thời giữ quan hệ suy luận do οὖν đánh dấu và giọng quở trách của chủ đối với đầy tớ.
- source_word: βαλεῖν τὰ ἀργύριά μου
  choice: gửi bạc của ta
  rationale: Trong ngữ cảnh tài chính, βαλεῖν chỉ việc giao hoặc ký gửi tài sản; ἀργύρια có thể là bạc hoặc tiền. Cách dịch này giữ hình ảnh vật chất của nguyên văn mà vẫn dễ hiểu trong văn cảnh.
- source_word: τοῖς τραπεζίταις
  choice: cho những người làm nghề ngân hàng
  rationale: τραπεζίτης chỉ người kinh doanh tiền tệ, có chức năng gần với chủ ngân hàng hoặc người đổi tiền thời xưa. Cụm diễn đạt tránh gợi sai về định chế ngân hàng hiện đại nhưng vẫn phù hợp với việc sinh lãi.
- source_word: ἐλθὼν ἐγὼ
  choice: khi trở về, ta
  rationale: Phân từ aorist mang nghĩa thời gian, chỉ việc chủ trở về trước khi nhận lại tài sản; đại từ ἐγώ được thể hiện bằng chủ ngữ 'ta'.
- source_word: ἐκομισάμην ἂν
  choice: đã có thể nhận lại
  rationale: Thể trung của κομίζω trong ngữ cảnh này mang nghĩa thu hồi hoặc nhận lại; kết hợp với ἄν diễn tả kết quả đã có thể xảy ra trong tình huống trái với thực tế.
- source_word: τὸ ἐμὸν
  choice: phần của mình
  rationale: Giữ tính danh từ hóa của đại từ sở hữu và nhấn mạnh tài sản thuộc về người chủ, không xác định quá mức đó chỉ là vốn hay cả khoản phải thu.
- source_word: σὺν τόκῳ
  choice: cùng với tiền lãi
  rationale: τόκος ở đây là khoản lãi phát sinh từ tiền gửi; 'tiền lãi' là cách nói trung tính, hiện đại, không tự thêm phán xét đạo đức.
theological_decisions:
- issue: Ngôn ngữ tài chính trong dụ ngôn và nguy cơ suy diễn đạo đức về việc lấy lãi
  choice: Dịch các thuật ngữ tài chính theo nghĩa trung tính trong hình ảnh của dụ ngôn.
  alternative: Dùng từ mang sắc thái lên án như 'lãi nặng' hoặc diễn giải câu này thành sự tán thành việc cho vay lấy lãi.
  rationale: Bản văn nêu một tình huống kinh tế để phục vụ luận điểm của dụ ngôn, nhưng tại đây không trực tiếp đưa ra giáo huấn tổng quát nhằm tán thành hay lên án mọi hình thức lấy lãi.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cặp đại từ 'ta—ngươi' giữ giọng của người chủ đang nghiêm khắc quở trách đầy tớ trong dụ ngôn. 'Những người làm nghề ngân hàng' diễn đạt chức năng cổ đại mà không đồng nhất hoàn toàn với ngân hàng hiện đại.
