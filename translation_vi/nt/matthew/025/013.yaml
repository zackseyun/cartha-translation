  text: γρηγορεῖτε οὖν, ὅτι οὐκ οἴδατε τὴν ἡμέραν οὐδὲ τὴν ⸀ὥραν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/013.yaml
  text: Therefore[a], stay awake, because you do not know the day or the hour.
translation:
  language: vi
  text: Vậy, hãy luôn tỉnh thức[a], vì anh em không biết ngày nào, giờ nào.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “hãy luôn canh thức” hoặc “hãy luôn cảnh giác.” Động từ Hy Lạp diễn tả sự tỉnh thức liên tục.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γρηγορεῖτε
  choice: hãy luôn tỉnh thức
  rationale: Động từ mệnh lệnh hiện tại, số nhiều, kêu gọi sự cảnh giác liên tục. “Tỉnh thức” vừa giữ được hình ảnh không ngủ trong dụ ngôn, vừa tự nhiên và trang trọng trong tiếng Việt; “luôn” làm rõ sắc thái tiếp diễn của thì hiện tại.
- source_word: οὖν
  choice: Vậy
  rationale: Nêu kết luận rút ra từ dụ ngôn ngay trước đó. “Vậy” tự nhiên trong tiếng Việt hiện đại và giữ rõ quan hệ suy luận.
- source_word: ὅτι
  choice: vì
  rationale: Dẫn vào lý do cho mệnh lệnh và diễn đạt trực tiếp quan hệ nguyên nhân.
- source_word: οὐκ οἴδατε
  choice: anh em không biết
  rationale: Giữ nguyên nghĩa phủ định của động từ biết ở ngôi thứ hai số nhiều. “Anh em” biểu thị rõ lời nói hướng đến nhiều người mà không thêm ý ngoài bản Hy Lạp.
- source_word: τὴν ἡμέραν οὐδὲ τὴν ὥραν
  choice: ngày nào, giờ nào
  rationale: Cách nói tiếng Việt tự nhiên sau “không biết,” tương ứng với hai danh từ xác định được nối bằng οὐδέ, nhưng không bổ sung điều mà ngày và giờ ấy chỉ về.
theological_decisions:
- issue: Hình ảnh cảnh giác trong mệnh lệnh
  choice: hãy luôn tỉnh thức
  alternative: hãy canh thức; hãy cảnh giác
  rationale: “Tỉnh thức” giữ hình ảnh của dụ ngôn và lời kêu gọi sẵn sàng liên tục, không thu hẹp câu thành một hệ thống cánh chung cụ thể hay làm mất tính ẩn dụ.
- issue: Phạm vi của “ngày” và “giờ”
  choice: giữ nguyên cách nói “ngày nào, giờ nào” mà không giải thích thêm
  alternative: ngày giờ Con Người đến; thời điểm đã định
  rationale: Bối cảnh rộng hơn liên quan đến sự đến và phán xét, nhưng chính câu này không nêu rõ đối tượng ấy. Bản dịch tránh đưa phần diễn giải thần học vào chính văn.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, tự nhiên và trang trọng vừa phải. Dấu phẩy giữa “ngày nào, giờ nào” tạo nhịp cân xứng quen thuộc trong tiếng Việt; chú thích bảo tồn các lựa chọn từ vựng hợp lệ.
