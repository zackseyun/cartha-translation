  source_fidelity: Bản dịch truyền đạt đúng mệnh lệnh hiện tại số nhiều γρηγορεῖτε bằng “hãy luôn tỉnh thức,” giữ sắc thái cảnh tỉnh bền bỉ. “Vậy” phản ánh quan hệ suy luận của οὖν; “vì” phản ánh ὅτι theo nghĩa nguyên nhân. “Anh em không biết ngày nào, giờ nào” diễn đạt tự nhiên phủ định οὐκ οἴδατε cùng hai đối tượng “ngày” và “giờ,” không thêm đối tượng cánh chung vốn không được nêu trong câu theo bản SBLGNT.
  naturalness: Tiếng Việt hiện đại, rõ ràng và có register Kinh Thánh vừa phải. “Tỉnh thức” phù hợp hình ảnh dụ ngôn và tự nhiên hơn một số lựa chọn quá khẩu ngữ. Cặp “ngày nào, giờ nào” là cách nói Việt ngữ thông dụng sau “không biết.”
  terminology: “Tỉnh thức” là thuật ngữ phù hợp cho γρηγορεῖτε trong ngữ cảnh lời kêu gọi canh thức. Chú thích nêu các khả năng từ vựng hợp lệ và không áp đặt diễn giải thần học.
