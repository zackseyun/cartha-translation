revisions:
- from: 'Bấy giờ, những người công chính sẽ thưa với ngài: “Lạy Chúa, có bao giờ chúng con thấy Chúa đói mà cho ăn, hay khát mà cho uống?”'
  to: 'Bấy giờ, những người công chính sẽ thưa với ngài: “Lạy Chúa, khi nào chúng con thấy Chúa đói mà cho Chúa ăn, hoặc thấy Chúa khát mà cho Chúa uống?”'
  rationale: Đổi «có bao giờ» thành «khi nào» để giữ đúng chức năng nghi vấn thời điểm của πότε, và nêu rõ tân ngữ «Chúa» cho cả hai hành động để phản ánh σε trong nguyên ngữ. Thêm «thấy Chúa» ở vế sau để duy trì cấu trúc song song rõ ràng; «hoặc» dịch ἤ tự nhiên trong câu hỏi song hành.
  reviewer_model: gpt-5.6-terra
