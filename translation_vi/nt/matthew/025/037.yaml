  text: τότε ἀποκριθήσονται αὐτῷ οἱ δίκαιοι λέγοντες· Κύριε, πότε σε εἴδομεν πεινῶντα καὶ ἐθρέψαμεν, ἢ διψῶντα καὶ ἐποτίσαμεν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/037.yaml
  text: Then the righteous will answer him[a], saying, ‘Lord, when did we see you hungry and feed you, or thirsty and give you drink?’
translation:
  language: vi
  text: 'Bấy giờ, những người công chính sẽ thưa với ngài: “Lạy Chúa, khi nào chúng con thấy Chúa đói mà cho Chúa ăn, hoặc thấy Chúa khát mà cho Chúa uống?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τότε
  choice: Bấy giờ
  rationale: Đánh dấu trình tự trong diễn ngôn, tự nhiên và trang trọng trong văn kể tiếng Việt.
- source_word: ἀποκριθήσονται αὐτῷ
  choice: sẽ thưa với ngài
  rationale: Động từ mang nghĩa chủ động dù có hình thái trung gian; “thưa” phù hợp lời đáp kính trọng, còn “với ngài” giữ quan hệ gián tiếp của đại từ ở cách dữ.
- source_word: οἱ δίκαιοι
  choice: những người công chính
  rationale: Tính từ được danh từ hóa, chỉ nhóm người được nhìn nhận là công chính trong cảnh phán xét; cách dịch này rõ nghĩa và không thêm diễn giải thần học.
- source_word: λέγοντες
  choice: '[không dịch riêng]'
  rationale: Trong tiếng Việt, nội dung lời nói trực tiếp sau dấu hai chấm đã thể hiện tự nhiên chức năng của phân từ “nói rằng”; lược bỏ tránh câu nặng nề.
- source_word: Κύριε
  choice: Lạy Chúa
  rationale: Giữ tước hiệu κύριος và sắc thái hô cách kính trọng khi trực tiếp thưa với Chúa.
- source_word: πότε σε εἴδομεν
  choice: có bao giờ chúng con thấy Chúa
  rationale: Trong câu hỏi hồi tưởng mang sắc thái ngạc nhiên, “có bao giờ” tự nhiên hơn “khi nào”; “chúng con” phù hợp tương quan kính trọng trong lời thưa trực tiếp.
- source_word: πεινῶντα καὶ ἐθρέψαμεν
  choice: đói mà cho ăn
  rationale: Giữ trạng thái đói và hành động cho ăn bằng cách diễn đạt ngắn gọn, tự nhiên; tân ngữ được hiểu rõ từ “Chúa” ở trước.
- source_word: ἢ διψῶντα καὶ ἐποτίσαμεν
  choice: hay khát mà cho uống
  rationale: Giữ cấu trúc song song với vế trước và chuyển đúng nghĩa cụ thể của ποτίζω là cho ai uống.
theological_decisions:
- issue: Cách dịch κύριος khi trực tiếp thưa với Đức Giê-su
  choice: Chúa
  alternative: Chủ; Thầy
  rationale: “Chúa” vừa giữ sắc thái tôn kính vừa bảo toàn âm hưởng Kitô học của tước hiệu trong Ma-thi-ơ mà không giải thích vượt quá bản văn.
- issue: Cách gọi οἱ δίκαιοι
  choice: những người công chính
  alternative: những người ngay chính; người công nghĩa
  rationale: “Công chính” là cách nói hiện đại, dễ hiểu và giữ được phạm vi nghĩa về sự ngay thẳng/được nhìn nhận là đúng trong cảnh phán xét, không quyết định thêm cơ sở thần học của địa vị ấy.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “thưa”, “Lạy Chúa” và “chúng con” để thể hiện phép xưng hô kính trọng trong lời đối thoại; giữ hai vế hỏi cân xứng và cô đọng.
