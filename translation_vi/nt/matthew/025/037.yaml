review_pass:
  verdict: revise
  source_fidelity: Bản dịch truyền đạt đúng trình tự, nhóm «những người công chính», lời xưng hô kính trọng, và hai tình huống đói/khát. Tuy nhiên, «có bao giờ» thêm sắc thái «ever» không được biểu thị riêng bởi πότε («khi nào»), và «đói mà cho ăn / khát mà cho uống» có thể để mơ hồ tân ngữ của hành động, trong khi tiếng Hy Lạp nêu rõ «bạn/Chúa» là người được cho ăn và cho uống ở cả hai vế.
  naturalness: Văn phong nhìn chung hiện đại và trang trọng. «Khi nào» là câu hỏi thời điểm tự nhiên, chính xác hơn trong ngữ cảnh này. Lặp «Chúa» sau động từ giúp câu sáng nghĩa mà vẫn tự nhiên trong lời thưa kính trọng.
  terminology: «Những người công chính» phù hợp với οἱ δίκαιοι; «Lạy Chúa» bảo toàn Κύριε và sắc thái hô cách. «Thưa với ngài» dùng kính ngữ phù hợp; chữ thường «ngài» trong lời dẫn thuật không có vấn đề.
  issues:
  - severity: medium
    issue: «có bao giờ» thay cho «khi nào»
    rationale: πότε là nghi vấn từ về thời điểm, «khi nào». «Có bao giờ» thường mang sắc thái phủ định/ngạc nhiên kiểu «ever»; dù hợp ngữ cảnh, nó diễn đạt thêm sắc thái không cần thiết.
  - severity: medium
    issue: Tân ngữ của «cho ăn» và «cho uống» không được nêu rõ
    rationale: Trong câu tiếng Việt hiện tại, các cụm «đói mà cho ăn» và «khát mà cho uống» có thể được hiểu theo lối khái quát. Nêu lại «Chúa» làm rõ hai động từ đều có tân ngữ σε, phù hợp cấu trúc nguyên ngữ.
  revised_text: 'Bấy giờ, những người công chính sẽ thưa với ngài: “Lạy Chúa, khi nào chúng con thấy Chúa đói mà cho Chúa ăn, hoặc thấy Chúa khát mà cho Chúa uống?”'
