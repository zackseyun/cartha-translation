  source_fidelity: Bản dịch giữ đúng trình tự, thì tương lai, công thức trang trọng Ἀμὴν λέγω ὑμῖν, số ít đại diện trong ἑνὶ, và phép song hành phủ định với Chúa Giê-su. Tuy nhiên, “Trong chừng mực” tuy gần hình thức với ἐφ’ ὅσον nhưng không tự nhiên trong tiếng Việt hiện đại ở ngữ cảnh này; “vì” diễn đạt quan hệ được nêu trong lời phán một cách thành ngữ mà không xác định thêm đối tượng “những người bé mọn nhất này”.
  naturalness: “Bấy giờ” và hệ xưng hô “Ngài/Ta/các ngươi” phù hợp văn phong trang trọng. Thay “Trong chừng mực” bằng “vì” làm câu tiếng Việt lưu loát hơn; thêm “rằng” sau “đáp lời họ” nối tự nhiên với lời nói trực tiếp.
  terminology: “Quả thật”, “Ta nói với các ngươi”, “những người bé mọn nhất này”, và “làm cho Ta” đều giữ được sắc thái Kinh Thánh trang trọng, không áp đặt cách hiểu về căn tính của nhóm “những người bé mọn nhất này”. Chú thích giữ đúng tính mở của cụm từ.
  issues:
