id: MAT.25.45
reference: Matthew 25:45
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: τότε ἀποκριθήσεται αὐτοῖς λέγων· Ἀμὴν λέγω ὑμῖν, ἐφ’ ὅσον οὐκ ἐποιήσατε ἑνὶ τούτων τῶν ἐλαχίστων, οὐδὲ ἐμοὶ ἐποιήσατε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/045.yaml
  text: Then he will answer them[a], saying, ‘Truly I say to you, insofar as you did not do it for one of the least of these[b], neither did you do it for me.’
translation:
  language: vi
  text: 'Bấy giờ, Ngài sẽ đáp lời họ rằng: “Quả thật, Ta nói với các ngươi[a], vì các ngươi đã không làm điều ấy cho một trong những người bé mọn nhất này[b], thì các ngươi cũng đã không làm cho Ta.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch sát hình thức hơn: “A-men, Ta nói với các ngươi.”'
    reason: lexical_alternative
  - marker: b
    text: “Những người bé mọn nhất này” có thể được hiểu riêng là các môn đồ của Chúa Giê-su, hoặc rộng hơn là những người thấp hèn và thiếu thốn; bản dịch giữ nguyên cách nói của câu Kinh Thánh.
    reason: alternative_reading
lexical_decisions:
- source_word: τότε
  choice: Bấy giờ
  rationale: Diễn tả trình tự trong cảnh phán xét, tự nhiên và trang trọng trong tiếng Việt.
- source_word: ἀποκριθήσεται αὐτοῖς λέγων
  choice: Ngài sẽ đáp lời họ
  rationale: Gộp cấu trúc phân từ chỉ lời nói vào một cách diễn đạt tiếng Việt tự nhiên, đồng thời giữ thì tương lai và đối tượng được đáp lời.
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: Quả thật, Ta nói với các ngươi
  rationale: Giữ tính long trọng, nhấn mạnh của công thức lời phán của Chúa Giê-su; đại từ “Ta” và “các ngươi” phù hợp với lời tuyên phán trực tiếp trong bối cảnh xét xử.
- source_word: ἐφ’ ὅσον
  choice: Trong chừng mực
  rationale: Giữ sắc thái mức độ/phạm vi của thành ngữ Hy Lạp, thay vì giản lược thành quan hệ nguyên nhân bằng “vì”.
- source_word: οὐκ ἐποιήσατε
  choice: các ngươi đã không làm điều ấy
  rationale: “Điều ấy” làm rõ tân ngữ được hiểu ngầm từ các hành động nêu ở ngữ cảnh trước mà không thêm nội dung mới.
- source_word: ἑνὶ τούτων τῶν ἐλαχίστων
  choice: cho một trong những người bé mọn nhất này
  rationale: Giữ số ít đại diện “một”, nhóm chỉ định “những người ... này”, và cấp so sánh cao nhất của ἐλαχίστων.
- source_word: οὐδὲ ἐμοὶ ἐποιήσατε
  choice: thì các ngươi cũng đã không làm cho Ta
  rationale: Giữ phép đối xứng phủ định và sự đồng nhất trực tiếp giữa cách đối xử với người bé mọn và cách đối xử với Chúa Giê-su.
theological_decisions:
- issue: “Những người bé mọn nhất này” là ai
  choice: Giữ nguyên cụm từ mà không xác định nhóm người ngoài điều câu Kinh Thánh nói rõ.
  alternative: Hiểu riêng là các môn đồ/sứ giả của Chúa Giê-su, hoặc hiểu rộng là những người thấp hèn và thiếu thốn.
  rationale: Câu này khẳng định việc không làm cho họ chính là không làm cho Chúa Giê-su, nhưng tự nó không giải quyết dứt điểm phạm vi của nhóm người ấy.
- issue: Sự đồng nhất của Chúa Giê-su với những người bé mọn
  choice: Dịch trực tiếp “cũng đã không làm cho Ta”.
  alternative: Diễn giải thành việc chỉ gián tiếp xúc phạm hoặc làm Chúa buồn.
  rationale: Nguyên văn đưa ra sự đồng nhất mạnh và trực tiếp; bản dịch không làm nhẹ đi căng thẳng thần học ấy.
translation_notes:
  register: Văn phong hiện đại nhưng trang trọng, phù hợp với lời tuyên phán trong cảnh xét xử. Dùng “Ngài/Ta” cho nhân vật đang phán và “các ngươi” cho những người bị phán xét; cách xưng hô này giữ sắc thái uy quyền mà không thêm cách gọi mang tính hệ phái.
