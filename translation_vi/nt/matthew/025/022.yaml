id: MAT.25.22
reference: Matthew 25:22
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: προσελθὼν ⸀δὲ καὶ ὁ τὰ δύο ⸀τάλαντα εἶπεν· Κύριε, δύο τάλαντά μοι παρέδωκας· ἴδε ἄλλα δύο τάλαντα ⸀ἐκέρδησα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/022.yaml
  text: Then the one who had received the two talents also came forward and said[a], ‘Lord, you handed over to me two talents. Look[b], I gained two more talents.’
translation:
  language: vi
  text: 'Người đã nhận hai ta-lâng cũng đến và thưa: “Thưa chủ[a], chủ đã giao cho tôi hai ta-lâng. Kìa, tôi đã kiếm được thêm hai ta-lâng.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “Thưa Chúa.” Từ Hy Lạp kyrios có thể có nghĩa là “Chúa” hoặc là cách đầy tớ kính cẩn gọi chủ mình.
    reason: alternative_reading
  - marker: b
    text: Ta-lâng là một đơn vị trọng lượng và giá trị tiền tệ rất lớn thời xưa, không phải là năng khiếu tự nhiên.
    reason: cultural_note
lexical_decisions:
- source_word: προσελθὼν
  choice: đến
  rationale: Phân từ aorist của προσέρχομαι diễn tả người đầy tớ tiến đến trước mặt chủ để trình báo; “đến” tự nhiên trong mạch kể tiếng Việt.
- source_word: δὲ καὶ
  choice: cũng
  rationale: Thể hiện sự tiếp nối và song song với người đầy tớ trước đó; trật tự câu tiếng Việt đã đủ biểu đạt diễn tiến.
- source_word: ὁ τὰ δύο τάλαντα
  choice: người đã nhận hai ta-lâng
  rationale: Cụm có mạo từ dùng như danh từ để nhận diện người đầy tớ theo số tiền được giao; “đã nhận” được bổ sung từ ngữ cảnh gần để câu rõ và tự nhiên.
- source_word: Κύριε
  choice: Thưa chủ
  rationale: κύριος ở đây là lời xưng hô kính trọng của đầy tớ với chủ trong dụ ngôn. “Thưa chủ” giữ đúng quan hệ xã hội và sắc thái tôn kính mà không buộc danh xưng này mang nghĩa thần học vốn không nhất thiết được xác định ngay trong câu.
- source_word: παρέδωκας
  choice: đã giao
  rationale: παραδίδωμι có nghĩa trao hoặc giao vào tay; “đã giao” vừa gần hình ảnh nguyên ngữ vừa phù hợp với việc chủ giao tài sản cho đầy tớ quản lý.
- source_word: μοι
  choice: cho tôi
  rationale: Đại từ cách dữ biểu thị người tiếp nhận; “cho tôi” là cách diễn đạt tự nhiên, rõ nghĩa.
- source_word: ἴδε
  choice: Kìa
  rationale: Thán từ kêu gọi người nghe chú ý đến kết quả trước mắt; “Kìa” giữ được lực chỉ dẫn mà vẫn trang trọng, tự nhiên.
- source_word: ἄλλα δύο τάλαντα
  choice: hai ta-lâng nữa
  rationale: ἄλλα với số từ chỉ một lượng bổ sung tương đương; “hai ... nữa” là cách nói tiếng Việt tự nhiên.
- source_word: ἐκέρδησα
  choice: đã làm lợi thêm được
  rationale: κερδαίνω nghĩa là thu lợi hoặc kiếm thêm. Trong bối cảnh quản lý tiền, “làm lợi thêm được” diễn đạt rõ khoản tăng thêm mà không quy định cụ thể phương thức.
- source_word: τάλαντα
  choice: ta-lâng
  rationale: τάλαντον là đơn vị trọng lượng và giá trị tiền tệ lớn trong thế giới cổ đại. Giữ thuật ngữ truyền thống “ta-lâng” để bảo tồn hình ảnh của dụ ngôn, kèm chú thích tránh hiểu là tài năng bẩm sinh.
theological_decisions:
- issue: Cách dịch κύριος trong lời xưng hô thuộc dụ ngôn
  choice: chủ
  alternative: Chúa
  rationale: Trong quan hệ trực tiếp giữa đầy tớ và người sở hữu tài sản, “chủ” là nghĩa ngữ cảnh tự nhiên của κύριος. Chú thích giữ lại khả năng dịch “Chúa”, bảo tồn độ mở của danh xưng mà không áp đặt trước cách nhận diện nhân vật trong dụ ngôn.
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng và dễ hiểu. Dùng “thưa chủ” để thể hiện lời nói kính trọng; giữ “ta-lâng” theo thuật ngữ Kinh Thánh quen thuộc và giải thích bằng chú thích. Dấu chú thích [a] đặt ngay sau danh xưng cần làm rõ; [b] đặt sau câu có thuật ngữ văn hóa.
