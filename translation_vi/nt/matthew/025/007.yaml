base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/007.yaml
  text: Then all those virgins got up and trimmed their lamps[a].
translation:
  language: vi
  text: Bấy giờ, tất cả các trinh nữ ấy đều đứng dậy và sửa soạn đèn[a] của mình.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch là “đuốc” (tiếng Hy Lạp: λαμπάδας); từ này có thể chỉ một nguồn sáng cầm tay, và bối cảnh nói đến dầu cùng việc chuẩn bị phù hợp với cả hai cách dịch.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Bấy giờ
  rationale: Trạng từ thời gian đánh dấu sự việc kế tiếp trong mạch kể; “Bấy giờ” tự nhiên và trang trọng trong tiếng Việt hiện đại.
- source_word: ἠγέρθησαν
  choice: đứng dậy
  rationale: Động từ ở đây chỉ việc trỗi dậy sau khi ngủ hoặc đang nghỉ; “đứng dậy” diễn đạt trực tiếp hành động, không buộc phải hiểu theo nghĩa bị đánh thức.
- source_word: πᾶσαι αἱ παρθένοι ἐκεῖναι
  choice: tất cả các trinh nữ ấy
  rationale: παρθένοι có nghĩa trực tiếp là những trinh nữ; bối cảnh tiệc cưới phù hợp với nghĩa cụ thể này. Cách dịch giữ được đặc tính từ vựng của nguyên bản.
- source_word: ἐκόσμησαν
  choice: sửa soạn
  rationale: κοσμέω có nghĩa sắp xếp, chỉnh đốn hoặc làm cho sẵn sàng. Trong ngữ cảnh nguồn sáng dùng dầu, “sửa soạn” bao quát việc chỉnh bấc và chuẩn bị để thắp mà không thêm chi tiết không được nói rõ.
- source_word: λαμπάδας
  choice: đèn
  rationale: λαμπάς có thể chỉ đèn hoặc đuốc. Bối cảnh có dầu và hành động sửa soạn khiến “đèn” là cách dịch tự nhiên, nhưng “đuốc” vẫn là khả năng từ vựng cần ghi chú.
- source_word: ἑαυτῶν
  choice: của mình
  rationale: Đại từ phản thân sở hữu quy chiếu về chính các trinh nữ; “của mình” là cách diễn đạt tự nhiên trong tiếng Việt và không tạo thêm sắc thái nhấn mạnh.
