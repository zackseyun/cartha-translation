  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “trinh nữ” để giữ nghĩa cụ thể của nguyên ngữ; dùng “sửa soạn” thay vì chỉ “tỉa bấc” để tránh diễn giải quá mức hành động không được mô tả chi tiết.
