id: MAT.25.21
reference: Matthew 25:21
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸀ἔφη αὐτῷ ὁ κύριος αὐτοῦ· Εὖ, δοῦλε ἀγαθὲ καὶ πιστέ, ἐπὶ ὀλίγα ἦς πιστός, ἐπὶ πολλῶν σε καταστήσω· εἴσελθε εἰς τὴν χαρὰν τοῦ κυρίου σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/021.yaml
  text: His master said to him[a], ‘Well done, good and faithful servant. You were faithful over a few things; I will appoint you over many things[b]. Enter into the joy of your master.’
translation:
  language: vi
  text: 'Ông chủ nói với người ấy: “Tốt lắm, hỡi đầy tớ[a] tốt và trung tín! Anh đã trung tín trong một ít việc; ta sẽ đặt anh cai quản nhiều việc. Hãy bước vào niềm vui của chủ[b] anh.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “nô lệ”. Từ Hy Lạp doulos có thể chỉ “đầy tớ” hoặc “nô lệ”, tùy ngữ cảnh.
    reason: alternative_reading
  - marker: b
    text: Từ Hy Lạp kyrios cũng có thể dịch là “Chúa”; ở đây, “chủ” phù hợp với quan hệ giữa người chủ và đầy tớ trong dụ ngôn.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφη αὐτῷ
  choice: nói với người ấy
  rationale: Cách dẫn lời tự nhiên trong tiếng Việt, diễn đạt đầy đủ động từ φημί và đại từ chỉ người nhận lời.
- source_word: κύριος
  choice: ông chủ / chủ
  rationale: Trong bình diện câu chuyện, κύριος chỉ người chủ của đầy tớ; “ông chủ” ở đầu câu tự nhiên, còn “chủ anh” trong lời trực tiếp giữ rõ quan hệ sở thuộc.
- source_word: δοῦλε
  choice: đầy tớ
  rationale: “Đầy tớ” diễn đạt quan hệ phục dịch và lệ thuộc trong dụ ngôn bằng lối nói trang trọng, quen thuộc; sắc thái mạnh hơn là “nô lệ” được ghi ở chú thích.
- source_word: Εὖ
  choice: Tốt lắm
  rationale: Lời khen tự nhiên tương ứng với εὖ trong ngữ cảnh này.
- source_word: ἀγαθὲ καὶ πιστέ
  choice: tốt và trung tín
  rationale: Giữ hai phẩm chất riêng biệt và dùng “trung tín” nhất quán với πιστός ở mệnh đề kế tiếp.
- source_word: ἐπὶ ὀλίγα ἦς πιστός
  choice: anh đã trung tín trong một ít việc
  rationale: Diễn đạt phạm vi trách nhiệm được giao, đồng thời giữ sự đối lập giữa ít việc và nhiều việc.
- source_word: ἐπὶ πολλῶν σε καταστήσω
  choice: ta sẽ đặt anh cai quản nhiều việc
  rationale: καθίστημι ở đây nói đến việc bổ nhiệm vào trách nhiệm; “đặt… cai quản” vừa rõ nghĩa vừa giữ hình ảnh trao quyền quản lý.
- source_word: εἴσελθε εἰς τὴν χαρὰν
  choice: hãy bước vào niềm vui
  rationale: Giữ hình ảnh chuyển động “vào” của nguyên văn thay vì diễn giải hoàn toàn thành “chung hưởng”.
theological_decisions:
- issue: Cách dịch κύριος trong dụ ngôn, nơi người chủ có thể tượng trưng cho Đức Chúa Trời hoặc Đấng Christ
  choice: ông chủ / chủ
  alternative: Chúa
  rationale: Quan hệ trực tiếp trong câu chuyện là giữa đầy tớ và người chủ. Cách dịch này không biến hàm ý thần học của dụ ngôn thành một tước hiệu minh nhiên mà nguyên văn trong bình diện câu chuyện chưa buộc phải thể hiện.
- issue: Cách dịch δοῦλος trong bối cảnh này
  choice: đầy tớ
  alternative: nô lệ
  rationale: “Đầy tớ” tự nhiên và trang trọng trong lời khen của dụ ngôn, còn địa vị lệ thuộc vốn có của δοῦλος vẫn được bảo toàn bằng chú thích nêu cách dịch “nô lệ”.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “ta—anh” thể hiện rõ quan hệ quyền bính trong lời trực tiếp mà không dùng lối xưng hô quá cổ. Cấu trúc “bước vào niềm vui” chủ ý giữ hình ảnh của nguyên văn.
