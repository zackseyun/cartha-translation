  text: καὶ στήσει τὰ μὲν πρόβατα ἐκ δεξιῶν αὐτοῦ τὰ δὲ ἐρίφια ἐξ εὐωνύμων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/033.yaml
  text: And he will place the sheep at his right hand[b][a], but the goats at the left.
translation:
  language: vi
  text: Ngài sẽ đặt chiên ở bên phải Ngài, còn dê con[a] ở bên trái.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “dê non.”
    reason: lexical_alternative
  - marker: b
    text: Nguyên văn Hy Lạp nói sát nghĩa là “từ phía bên phải… từ phía bên trái,” một cách nói chỉ việc đặt ở bên phải và bên trái.
    reason: lexical_alternative
lexical_decisions:
- source_word: στήσει
  choice: sẽ đặt
  rationale: Động từ ἵστημι ở thể chủ động, có bổ ngữ trực tiếp, mang nghĩa khiến đứng vào một vị trí; “sẽ đặt” tự nhiên và phù hợp với cảnh người chăn phân đàn.
- source_word: πρόβατα
  choice: chiên
  rationale: πρόβατα là từ thông dụng chỉ chiên; tiếng Việt không cần mạo từ để chỉ hai nhóm đã được nhắc đến trong ngữ cảnh.
- source_word: ἐκ δεξιῶν αὐτοῦ
  choice: ở bên phải mình
  rationale: Cụm ἐκ + sở hữu cách ở đây là thành ngữ chỉ vị trí bên phải. “Mình” quy chiếu tự nhiên về chủ ngữ “Ngài” và tránh lối diễn đạt nặng nề.
- source_word: ἐρίφια
  choice: dê con
  rationale: ἐρίφια cụ thể chỉ dê non hoặc dê con. Tiếng Việt “dê con” tự nhiên, rõ nghĩa và giữ được sắc thái tuổi mà nguyên văn có.
- source_word: ἐξ εὐωνύμων
  choice: ở bên trái
  rationale: Cụm này chỉ vị trí bên trái. Nguyên văn không lặp lại αὐτοῦ, nên bản dịch cũng không cần lặp “mình”; vị trí tương quan vẫn rõ.
- source_word: μὲν ... δὲ
  choice: '..., còn ...'
  rationale: Cấu trúc “..., còn ...” diễn đạt tự nhiên sự đối chiếu giữa hai nhóm mà không làm mức độ tương phản mạnh hơn nguyên văn.
theological_decisions:
- issue: Có nên diễn giải ý nghĩa biểu tượng của bên phải và bên trái hay không
  choice: 'Chỉ dịch vị trí không gian: “ở bên phải mình ... ở bên trái”'
  alternative: Diễn giải thành vị trí được ưu ái và vị trí bị thất sủng
  rationale: Câu này trực tiếp mô tả việc phân hai nhóm theo vị trí. Ý nghĩa phán xét được thể hiện trong ngữ cảnh; đưa sự ưu ái hay thất sủng vào câu sẽ vượt quá điều nguyên văn nói rõ.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và dễ hiểu. Dùng “Ngài” theo mạch văn nói về Con Người; dùng “còn” để giữ thế đối chiếu cân xứng. Mọi dấu chú thích đều xuất hiện trong chính văn.
