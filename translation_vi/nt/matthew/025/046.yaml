  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἀπελεύσονται οὗτοι εἰς κόλασιν αἰώνιον, οἱ δὲ δίκαιοι εἰς ζωὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/046.yaml
  text: And these will go away into eternal punishment[a], but the righteous into eternal life.
translation:
  language: vi
  text: Và những người này sẽ đi vào hình phạt đời đời[a], còn những người công chính thì vào sự sống đời đời.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “hình phạt kéo dài một thời đại” ... “sự sống kéo dài một thời đại.” Nghĩa của tính từ αἰώνιος được tranh luận trong một số văn cảnh; tại đây, cùng một từ bổ nghĩa cho cả “hình phạt” và “sự sống,” nên bản dịch giữ cấu trúc song song bằng cách dùng “đời đời” ở cả hai vế.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπελεύσονται
  choice: sẽ đi vào
  rationale: Động từ tương lai của ἀπέρχομαι diễn tả việc rời đi; kết hợp với εἰς, cách dịch này tự nhiên trong tiếng Việt và giữ hướng đi đến kết cục được nêu.
- source_word: οὗτοι
  choice: những người này
  rationale: Đại từ chỉ định quy chiếu về nhóm vừa được nói đến; thêm “người” là cần thiết để câu tiếng Việt rõ và tự nhiên.
- source_word: κόλασιν
  choice: hình phạt
  rationale: Trong bối cảnh phán xét, κόλασις chỉ hậu quả mang tính trừng phạt; “hình phạt” là cách diễn đạt rõ ràng, không thêm ý giải thích.
- source_word: αἰώνιον
  choice: đời đời
  rationale: Cùng một tính từ bổ nghĩa cho cả “hình phạt” lẫn “sự sống”; lặp lại “đời đời” bảo toàn cấu trúc song song và là cách diễn đạt trang trọng, quen thuộc trong tiếng Việt.
- source_word: οἱ δὲ δίκαιοι
  choice: còn những người công chính thì
  rationale: δὲ đánh dấu sự tương phản, còn tính từ được dùng như danh từ chỉ những người công chính. Cấu trúc “còn ... thì” thể hiện đối chiếu tự nhiên trong tiếng Việt.
- source_word: ζωὴν
  choice: sự sống
  rationale: “Sự sống” là cách dịch chuẩn của ζωή và thích hợp với văn cảnh cánh chung, không mở rộng nghĩa quá mức.
theological_decisions:
- issue: Cách dịch αἰώνιον trong hai cụm κόλασιν αἰώνιον và ζωὴν αἰώνιον
  choice: Dịch nhất quán là “đời đời” trong cả hai vế
  alternative: “thuộc thời đại” hoặc “kéo dài một thời đại”
  rationale: Bản Hy Lạp dùng cùng một tính từ cho cả hình phạt và sự sống. Cách dịch nhất quán bảo toàn sự song song và không áp đặt thời lượng khác nhau cho hai vế; phương án từ nguyên đang được tranh luận được ghi ở chú thích.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng cấu trúc đối chiếu “những người này ... còn những người công chính thì ...” để phản ánh hai nhóm và hai kết cục song song của nguyên văn.
