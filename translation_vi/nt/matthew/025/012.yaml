  yaml_path: translation/nt/matthew/025/012.yaml
  text: But he answered[a], ‘Truly I tell you, I do not know you.’
translation:
  language: vi
  text: 'Nhưng người ấy đáp: “Quả thật, tôi nói với các cô, tôi không biết các cô.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “tôi không nhận ra các cô.” Câu Hy Lạp dịch sát là “tôi không biết các cô”; trong ngữ cảnh, câu này có thể hàm ý không nhìn nhận các cô về mặt quan hệ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ ἀποκριθεὶς εἶπεν
  choice: Nhưng người đáp
  rationale: Lược công thức phân từ + động từ thành cách kể tự nhiên trong tiếng Việt; δέ được dịch là “Nhưng” để giữ nét tương phản với lời cầu xin trước đó. “Người” chỉ nhân vật chàng rể/chủ nhà trong ngữ cảnh.
- source_word: Ἀμὴν
  choice: Thật
  rationale: Giữ công thức xác quyết trang trọng của lời nói mà vẫn rõ nghĩa trong tiếng Việt hiện đại; không nhân đôi vì bản Hy Lạp chỉ có một Ἀμήν.
- source_word: λέγω ὑμῖν
  choice: tôi nói với các cô
  rationale: Cách diễn đạt trực tiếp, tự nhiên, giữ đại từ số nhiều; “các cô” phù hợp với nhóm trinh nữ trong dụ ngôn.
- source_word: οὐκ οἶδα
  choice: tôi không biết … là ai
  rationale: οἶδα cơ bản là “biết”. Cấu trúc tiếng Việt “không biết … là ai” tự nhiên trong ngữ cảnh không nhìn nhận, đồng thời chưa diễn giải thành một tuyên bố thần học đầy đủ.
- source_word: ὑμᾶς
  choice: các cô
  rationale: Đại từ ngôi hai số nhiều hướng đến nhóm các trinh nữ trong dụ ngôn; lựa chọn này làm rõ số nhiều và phù hợp quan hệ giao tiếp trong cảnh truyện.
theological_decisions:
- issue: Sức nặng của câu “οὐκ οἶδα ὑμᾶς” trong dụ ngôn
  choice: 'Giữ lời từ chối nhìn nhận ở dạng đơn giản: “tôi không biết các cô là ai”, kèm chú thích về cách dịch sát chữ.'
  alternative: “Tôi không nhận ra các cô” hoặc “Tôi không có quan hệ gì với các cô”
  rationale: Câu nói hàm ý loại trừ và không nhìn nhận về mặt quan hệ, nhưng bản dịch không nên mở rộng thành một kết luận giáo lý về sự cứu rỗi vượt quá nội dung câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “các cô” để thể hiện số nhiều và bối cảnh các trinh nữ trong dụ ngôn; đặt dấu chú thích ngay sau câu được chú giải.
