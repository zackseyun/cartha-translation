id: MAT.25.35
reference: Matthew 25:35
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐπείνασα γὰρ καὶ ἐδώκατέ μοι φαγεῖν, ἐδίψησα καὶ ἐποτίσατέ με, ξένος ἤμην καὶ συνηγάγετέ με,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/035.yaml
  text: For I was hungry and you gave me something to eat[a]; I was thirsty and you gave me something to drink; I was a stranger and you welcomed me,
translation:
  language: vi
  text: Vì Ta đói, các con đã cho Ta ăn; Ta khát, các con đã cho Ta uống; Ta là khách lạ, các con đã đón tiếp Ta[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “các con đã tiếp nhận Ta.” Động từ Hy Lạp có nghĩa đen là “quy tụ” hoặc “đưa lại với nhau,” nhưng ở đây chỉ việc tiếp nhận một người lạ với lòng hiếu khách.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπείνασα
  choice: Ta đói
  rationale: Động từ ở thì aorist diễn tả việc trải qua cơn đói trong quá khứ; cách nói này tự nhiên và trực tiếp trong tiếng Việt.
- source_word: γὰρ
  choice: Vì
  rationale: Liên từ này nêu lý do giải thích cho lời phán ở câu trước; “Vì” giữ rõ quan hệ lập luận.
- source_word: ἐδώκατέ μοι φαγεῖν
  choice: các con đã cho Ta ăn
  rationale: Cấu trúc δίδωμι với tân ngữ gián tiếp và động từ nguyên mẫu có nghĩa là cho ai ăn; tiếng Việt không cần thêm danh từ “thức ăn”.
- source_word: ἐδίψησα
  choice: Ta khát
  rationale: Diễn đạt tự nhiên trạng thái khát đã xảy ra, song song với “Ta đói”.
- source_word: ἐποτίσατέ με
  choice: các con đã cho Ta uống
  rationale: ποτίζω trong ngữ cảnh này nghĩa là cung cấp đồ uống cho người đang khát; “cho Ta uống” vừa tự nhiên vừa không tự ý giới hạn thành nước.
- source_word: ξένος
  choice: khách lạ
  rationale: ξένος chỉ người xa lạ, không thuộc vòng quan hệ quen biết và cần được tiếp nhận; “khách lạ” giữ cả ý xa lạ lẫn bối cảnh tiếp đãi.
- source_word: συνηγάγετέ με
  choice: các con đã đón tiếp Ta
  rationale: Dù nghĩa cơ bản của συνάγω là quy tụ hoặc đưa lại với nhau, khi đi với ξένος, từ này chỉ hành động tiếp nhận người lạ bằng lòng hiếu khách. “Đón tiếp” truyền đạt ý đó tự nhiên mà không thêm rõ địa điểm.
theological_decisions:
- issue: Sắc thái hiếu khách trong ξένος … συνηγάγετέ με
  choice: “Ta là khách lạ, các con đã đón tiếp Ta”
  alternative: “Ta là người xa lạ, các con đã cho Ta vào ở”
  rationale: Bản dịch chính nhấn mạnh sự tiếp nhận đầy lòng thương xót mà không thu hẹp ξένος vào quốc tịch hay địa vị pháp lý, cũng không thêm minh nhiên ý “vào nhà” vốn chỉ được ngữ cảnh gợi ra.
- issue: Đại từ của vị vua trong dụ ngôn
  choice: “Ta … các con”
  alternative: “tôi … anh em” hoặc “ta … các ngươi”
  rationale: “Ta … các con” giữ được vị thế trang trọng của người đang phán mà vẫn dễ hiểu trong tiếng Việt hiện đại; tránh sắc thái cổ và xa cách của “các ngươi”.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Các vế ngắn được giữ song song theo nguyên văn. Dấu phẩy cuối câu cho thấy lời phán còn tiếp tục sang câu kế tiếp.
