revisions:
- from: Và khi nào chúng con thấy Ngài là người xa lạ[a] mà tiếp đón Ngài[b], hoặc trần truồng[c] mà mặc áo cho Ngài?
  to: Và khi nào chúng con thấy Ngài là người lạ[a] mà đón Ngài vào nhà[b], hoặc trần truồng[c] mà mặc áo cho Ngài?
  rationale: Sửa “người xa lạ” thành “người lạ” để câu Việt tự nhiên hơn, và thay “tiếp đón” bằng “đón ... vào nhà” để phản ánh cụ thể hơn nghĩa tiếp nhận hiếu khách của συνηγάγομεν. Chỉnh chú thích b để phân biệt nghĩa gốc của động từ với nghĩa theo ngữ cảnh. Không thay đổi phạm vi nghĩa của ξένος hay γυμνός, và giữ nguyên các neo chú thích.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T05:44:30Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch truyền đạt đúng cấu trúc câu hỏi và các ý chính của nguyên văn: thấy, người lạ, đón nhận/cho vào, trần truồng, và mặc áo. Tuy nhiên, “tiếp đón” có thể chỉ sự chào đón xã giao, chưa diễn đạt rõ sắc thái tiếp nhận cho ở nhờ của συνηγάγομεν trong ngữ cảnh hiếu khách.'
  naturalness: “Người lạ” tự nhiên và gọn hơn “người xa lạ” trong câu này. “Đón Ngài vào nhà” diễn đạt rõ ràng, tự nhiên hành vi hiếu khách; “mặc áo cho Ngài” vẫn là cách nói phù hợp.
  terminology: 'Các đại từ “chúng con / Ngài” phù hợp mạch văn lời thưa kính trọng với Vua/Chúa trong câu trước. Chú thích b cần chỉnh: “quy tụ vào” không phải là diễn đạt nghĩa đen chính xác của συνάγω; nghĩa đen là “gom lại/quy tụ,” còn nghĩa theo ngữ cảnh là đón nhận, cho vào ở.'
  issues:
