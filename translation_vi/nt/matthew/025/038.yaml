  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: πότε δέ σε εἴδομεν ξένον καὶ συνηγάγομεν, ἢ γυμνὸν καὶ περιεβάλομεν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/038.yaml
  text: And when did we see you as a stranger and take you in[c][b][a], or naked and clothe you?
translation:
  language: vi
  text: Và khi nào chúng con thấy Ngài là người lạ[a] mà đón Ngài vào nhà[b], hoặc trần truồng[c] mà mặc áo cho Ngài?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “người ngoại quốc.” Từ Hy Lạp có thể chỉ người lạ, người không quen biết hoặc người ở ngoài cộng đồng của mình; tại đây, ý chính là một người cần được tiếp đãi.'
    reason: lexical_alternative
  - marker: b
    text: Theo nghĩa đen, động từ này là “gom lại” hoặc “quy tụ”; trong ngữ cảnh này, nó chỉ việc đón nhận và cho một người lạ vào ở.
    reason: lexical_alternative
  - marker: c
    text: Cũng có thể hiểu là “thiếu áo mặc.” Từ Hy Lạp có thể chỉ người trần truồng hoàn toàn hoặc người không có đủ quần áo.
    reason: lexical_alternative
lexical_decisions:
- source_word: πότε
  choice: khi nào
  rationale: Trạng từ nghi vấn hỏi về thời điểm; “khi nào” là cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: δέ
  choice: Và
  rationale: Ở đây δέ nối nhẹ câu hỏi này với câu hỏi trước trong cùng một chuỗi, không nhất thiết biểu thị sự tương phản.
- source_word: σε
  choice: Ngài
  rationale: Đại từ làm bổ ngữ trực tiếp, chỉ về vị vua được những người công chính thưa chuyện; “Ngài” phù hợp với lối xưng hô kính trọng trong ngữ cảnh.
- source_word: εἴδομεν
  choice: chúng con thấy
  rationale: Động từ aorist chỉ việc nhìn thấy trong những dịp được hỏi đến. Tiếng Việt không bắt buộc đánh dấu thì quá khứ khi ngữ cảnh đã rõ.
- source_word: ξένον
  choice: là người xa lạ
  rationale: ξένος chỉ một người xa lạ hoặc ở ngoài vòng quen biết, trong ngữ cảnh này là người cần được tiếp đón. Cách dịch này giữ được sắc thái xã hội mà không thu hẹp thành quốc tịch nước ngoài.
- source_word: συνηγάγομεν
  choice: tiếp đón Ngài
  rationale: συνάγω có nghĩa đen là quy tụ hoặc đưa vào; trong ngữ cảnh hiếu khách, nó chỉ việc đón nhận và cho người xa lạ vào nơi ở. “Tiếp đón” tự nhiên và rõ nghĩa trong tiếng Việt.
- source_word: ἢ
  choice: hoặc
  rationale: Liên từ phân cách, nối trường hợp thứ hai với trường hợp thứ nhất.
- source_word: γυμνὸν
  choice: trần truồng
  rationale: γυμνός có thể chỉ hoàn toàn không mặc gì hoặc không có đủ quần áo. “Trần truồng” giữ nghĩa trực tiếp, còn nghĩa rộng hơn được ghi chú.
- source_word: περιεβάλομεν
  choice: mặc áo cho Ngài
  rationale: περιβάλλω ở đây có nghĩa khoác hoặc mặc quần áo cho một người. “Mặc áo cho” là cách diễn đạt tự nhiên, cụ thể trong tiếng Việt.
theological_decisions:
- issue: Ý nghĩa của ξένος trong dụ ngôn về sự phán xét
  choice: người xa lạ
  alternative: người ngoại quốc
  rationale: Trọng tâm là hành động thương xót và tiếp đãi một người không quen biết đang cần nơi nương náu. “Người xa lạ” giữ phạm vi nghĩa của từ Hy Lạp và tránh tự ý giới hạn vào căn tính dân tộc hay quốc tịch.
- issue: Đại từ xưng hô khi những người công chính nói với vị vua
  choice: chúng con / Ngài
  alternative: chúng tôi / ông
  rationale: Ngữ cảnh liền trước là lời thưa kính trọng với “Chúa”; cặp “chúng con / Ngài” thể hiện quan hệ lời nói trong tiếng Việt mà không thay đổi căn tính của nhân vật.
translation_notes:
  register: Bản dịch dùng tiếng Việt hiện đại, trang trọng và dễ hiểu. Cấu trúc câu hỏi được giữ gần với nguyên văn; các đại từ “chúng con / Ngài” phù hợp với lời thưa kính trọng trong mạch văn. Các dấu chú thích được đặt ngay sau những cụm từ tương ứng.
