  source_fidelity: Bản dịch truyền đạt đúng trình tự thời gian của ὕστερον, lực bổ sung của καί, chủ ngữ “những trinh nữ còn lại,” và lời thỉnh cầu lặp lại. “Xin mở cửa cho chúng tôi” diễn đạt tự nhiên mệnh lệnh ἄνοιξον ἡμῖν; danh từ “cửa” không có trong nguyên văn nhưng được bổ sung minh bạch bằng chú thích và được ngữ cảnh đòi hỏi.
  naturalness: Tiếng Việt hiện đại, trang trọng và lưu loát. “Sau đó ... cũng đến và nói” phù hợp văn kể chuyện; “Lạy Chúa, lạy Chúa” giữ được sắc thái khẩn thiết của lời trực tiếp.
  terminology: “Trinh nữ” bám sát παρθένοι trong ngữ cảnh dụ ngôn. “Chúa” cho Κύριε bảo tồn khả năng cộng hưởng vừa tôn kính vừa thần học trong Ma-thi-ơ mà không áp đặt một diễn giải hẹp. Các chú thích nêu đúng lựa chọn thay thế và phần được suy ra từ ngữ cảnh.
