id: MAT.25.11
reference: Matthew 25:11
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὕστερον δὲ ἔρχονται καὶ αἱ λοιπαὶ παρθένοι λέγουσαι· Κύριε κύριε, ἄνοιξον ἡμῖν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/011.yaml
  text: Later[a], the other virgins also come, saying, ‘Lord, lord[c][b], open to us.’
translation:
  language: vi
  text: 'Sau đó, những trinh nữ còn lại[a] cũng đến và nói: “Lạy Chúa, lạy Chúa[b], xin mở cửa cho chúng tôi[c]!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “những trinh nữ khác.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể hiểu là “Lạy ngài” hoặc “Lạy chủ.” Tiếng Hy Lạp: Kyrios, kyrios.'
    reason: alternative_reading
  - marker: c
    text: Tiếng Hy Lạp chỉ nói “mở cho chúng tôi”; từ “cửa” được hiểu theo ngữ cảnh.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὕστερον
  choice: Sau đó
  rationale: Trạng từ chỉ thời gian đánh dấu hành động xảy ra tiếp theo; “Sau đó” tự nhiên trong lời kể tiếng Việt và giữ đúng trình tự.
- source_word: δὲ
  choice: —
  rationale: δέ là từ nối nhẹ; quan hệ chuyển tiếp đã được diễn đạt tự nhiên bằng “Sau đó”, nên không cần thêm một liên từ riêng.
- source_word: ἔρχονται
  choice: đến
  rationale: Hiện tại kể chuyện tạo tính sống động; tiếng Việt dùng “đến” tự nhiên trong mạch kể mà không cần mô phỏng hình thái thì.
- source_word: καὶ
  choice: cũng
  rationale: 'Diễn đạt ý bổ sung: nhóm trinh nữ còn lại cũng xuất hiện tại nơi ấy.'
- source_word: αἱ λοιπαὶ παρθένοι
  choice: những trinh nữ còn lại
  rationale: “Còn lại” thể hiện trực tiếp nghĩa của λοιπαί, còn “trinh nữ” giữ cách gọi cụ thể của παρθένοι trong nguyên văn.
- source_word: λέγουσαι
  choice: và nói
  rationale: Chuyển phân từ Hy Lạp thành động từ phối hợp để câu tiếng Việt tự nhiên, đồng thời vẫn giới thiệu nguyên văn lời nói.
- source_word: Κύριε κύριε
  choice: Lạy Chúa, lạy Chúa
  rationale: “Lạy” đánh dấu lời xưng hô trực tiếp và khẩn thiết; “Chúa” giữ được cả nghĩa tôn kính trong câu chuyện lẫn âm hưởng thần học rộng hơn trong Ma-thi-ơ. Sự lặp lại được giữ nguyên.
- source_word: ἄνοιξον ἡμῖν
  choice: xin mở cửa cho chúng tôi
  rationale: “Xin” diễn đạt mệnh lệnh mang tính khẩn cầu. Tân ngữ “cửa” được bổ sung từ ngữ cảnh để câu tiếng Việt tự nhiên; chú thích cho biết từ này không được viết ra trong tiếng Hy Lạp.
theological_decisions:
- issue: Cách dịch κύριος trong lời xưng hô trực tiếp
  choice: Chúa
  alternative: ngài; chủ
  rationale: “Chúa” bảo toàn sự căng nghĩa giữa một cách xưng hô tôn kính trong nội dung dụ ngôn và hàm ý thần học có thể có trong toàn sách Ma-thi-ơ, thay vì thu hẹp từ này thành một danh xưng xã hội đơn thuần.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Lời cầu xin giữ sắc thái gấp gáp qua việc lặp lại danh xưng và dùng “xin”; dấu ngoặc kép cong được dùng cho lời nói trực tiếp.
