    rationale: πότε là nghi vấn từ hỏi “khi nào”; cấu trúc hiện tại tạo sắc thái “chẳng khi nào”/phủ định tu từ rõ hơn. Nên giữ câu hỏi trực tiếp để phản ánh nguồn ngữ sát hơn mà không thêm lực diễn ngôn.
  - severity: low
    issue: “đau yếu” cho ἀσθενῆ
    rationale: Không sai, nhưng “bệnh” tự nhiên và trực tiếp hơn trong danh sách các tình trạng cần được giúp đỡ, đồng thời tương ứng sát với nghĩa ngữ cảnh của ἀσθενής.
