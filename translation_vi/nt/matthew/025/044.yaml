  to: 'Bấy giờ, chính họ cũng sẽ thưa rằng: “Lạy Chúa, khi nào chúng con đã thấy Ngài đói, khát, là khách lạ, trần truồng, bệnh hoặc ở trong tù mà không phục vụ Ngài?”[a]'
