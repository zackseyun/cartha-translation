id: MAT.25.44
reference: Matthew 25:44
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: τότε ἀποκριθήσονται καὶ αὐτοὶ λέγοντες· Κύριε, πότε σε εἴδομεν πεινῶντα ἢ διψῶντα ἢ ξένον ἢ γυμνὸν ἢ ἀσθενῆ ἢ ἐν φυλακῇ καὶ οὐ διηκονήσαμέν σοι;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/044.yaml
  text: Then they too will answer, saying, ‘Lord, when did we see you hungry or thirsty or a stranger or naked or sick or in prison, and not serve you?’
translation:
  language: vi
  text: 'Bấy giờ, chính họ cũng sẽ thưa rằng: “Lạy Chúa, khi nào chúng con đã thấy Ngài đói, khát, là khách lạ, trần truồng, bệnh hoặc ở trong tù mà không phục vụ Ngài?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Phục vụ” cũng có thể dịch là “chăm sóc” hoặc “hầu việc”; từ Hy Lạp διακονέω chỉ sự phục vụ hay giúp đỡ thiết thực.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Bấy giờ
  rationale: Đánh dấu diễn tiến tiếp theo trong cảnh phán xét, với sắc thái trang trọng và tự nhiên.
- source_word: ἀποκριθήσονται καὶ αὐτοὶ λέγοντες
  choice: chính họ cũng sẽ thưa rằng
  rationale: “Chính họ cũng” giữ sắc thái nhấn mạnh của καὶ αὐτοί; “thưa” phù hợp với lời đáp kính cẩn hướng đến Chúa, còn “rằng” giới thiệu lời nói trực tiếp tự nhiên.
- source_word: Κύριε
  choice: Lạy Chúa
  rationale: Giữ tước hiệu κύριος và hình thức xưng hô trực tiếp, kính trọng trong tiếng Việt.
- source_word: πότε σε εἴδομεν
  choice: có khi nào chúng con thấy Ngài
  rationale: Trong câu hỏi phủ định kết thúc bằng “đâu”, cách diễn đạt “có khi nào... mà không... đâu?” chuyển tải tự nhiên ý “khi nào chúng con đã thấy... mà không...?”; “chúng con/Ngài” phù hợp quan hệ xưng hô kính cẩn.
- source_word: πεινῶντα ἢ διψῶντα
  choice: đói, khát
  rationale: Các tính từ ngắn gọn, tự nhiên, giữ cấu trúc liệt kê những cảnh thiếu thốn.
- source_word: ξένον
  choice: là khách lạ
  rationale: Diễn tả người ngoài cộng đồng hoặc gia đình đang cần được tiếp đón, nhưng không thu hẹp thành người ngoại quốc.
- source_word: γυμνὸν
  choice: trần truồng
  rationale: Giữ nghĩa trực tiếp của từ Hy Lạp và tính song song với danh sách trong phân đoạn, dù trong ngữ cảnh có thể bao hàm thiếu áo mặc.
- source_word: ἀσθενῆ
  choice: đau yếu
  rationale: Phù hợp ngữ cảnh nhu cầu thân thể và vẫn giữ phần nào dải nghĩa “yếu, bệnh” của ἀσθενής.
- source_word: ἐν φυλακῇ
  choice: ở trong tù
  rationale: Cách nói hiện đại, rõ nghĩa cho tình trạng bị giam giữ.
- source_word: οὐ διηκονήσαμέν σοι
  choice: mà không phục vụ Ngài đâu
  rationale: “Phục vụ” giữ nghĩa rộng của διακονέω là đáp ứng nhu cầu bằng hành động; cấu trúc “mà không... đâu” làm câu hỏi tu từ tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Cách dịch κύριος khi dùng để thưa với Đức Giê-su
  choice: Lạy Chúa
  alternative: Thưa Chủ
  rationale: “Lạy Chúa” vừa giữ sự kính trọng trong lời xưng hô vừa bảo toàn âm hưởng Kitô học, không diễn giải vượt quá văn bản.
- issue: Sắc thái của διακονέω trong mệnh đề cuối
  choice: phục vụ Ngài
  alternative: chăm sóc Ngài; hầu việc Ngài
  rationale: “Phục vụ” giữ phạm vi nghĩa rộng, bao gồm sự trợ giúp thiết thực, đồng thời bảo toàn mối liên hệ giữa việc giúp người thiếu thốn và phục vụ vị Vua; chú thích nêu các khả năng gần nghĩa.
- issue: Hình thức câu hỏi với οὐ
  choice: có khi nào... mà không... đâu?
  alternative: khi nào... mà chúng con đã không phục vụ Ngài?
  rationale: Cả hai đều có thể chuyển tải câu hỏi Hy Lạp; lựa chọn chính tự nhiên hơn trong tiếng Việt và không biến câu hỏi thành một lời phủ nhận tuyệt đối.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng cặp xưng hô “chúng con—Ngài” vì đây là lời thưa trực tiếp với “Chúa”. Dấu [a] được đặt ngay sau toàn bộ câu vì chú thích liên quan đến động từ ở cuối lời nói.
