  text: ἄρατε οὖν ἀπ’ αὐτοῦ τὸ τάλαντον καὶ δότε τῷ ἔχοντι τὰ δέκα τάλαντα·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/028.yaml
  text: Therefore take the talent from him and give it to the one who has the ten talents[a][b].
translation:
  language: vi
  text: Vậy, hãy lấy[a] ta-lâng[b] khỏi người ấy và trao cho người có mười ta-lâng.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “hãy lấy đi khỏi người ấy.” Mệnh lệnh Hy Lạp có thể được diễn đạt theo cả hai cách.'
    reason: lexical_alternative
  - marker: b
    text: “Ta-lâng” là một đơn vị trọng lượng lớn và, theo nghĩa mở rộng, cũng là một đơn vị tiền tệ.
    reason: cultural_note
lexical_decisions:
- source_word: ἄρατε
  choice: hãy lấy
  rationale: Động từ mệnh lệnh số nhiều của αἴρω truyền đạt một lệnh trực tiếp. “Hãy lấy” tự nhiên trong tiếng Việt; ý tách vật đó khỏi người đang giữ được làm rõ bằng “khỏi người ấy”.
- source_word: οὖν
  choice: vậy
  rationale: Từ nối này nêu kết luận phát sinh từ phán quyết ngay trước đó. “Vậy” ngắn gọn, tự nhiên và giữ rõ quan hệ suy luận.
- source_word: ἀπ’ αὐτοῦ
  choice: khỏi người ấy
  rationale: ἀπό với sở hữu cách biểu thị sự tách khỏi người vừa bị xét trong dụ ngôn. “Khỏi người ấy” diễn đạt trực tiếp ý này mà không thêm cách giải thích.
- source_word: τὸ τάλαντον
  choice: ta-lâng
  rationale: Giữ thuật ngữ lịch sử chỉ một đơn vị trọng lượng lớn và, theo nghĩa mở rộng, một khoản tiền lớn; cách phiên âm tránh đồng nhất nó với năng khiếu bẩm sinh.
- source_word: δότε
  choice: trao
  rationale: Động từ mệnh lệnh của δίδωμι. “Trao” là cách diễn đạt tự nhiên khi chuyển một khoản được giao giữ từ người này sang người khác và vẫn giữ nguyên lực mệnh lệnh.
- source_word: τῷ ἔχοντι
  choice: cho người có
  rationale: Phân từ có mạo từ được dùng như danh từ. “Người có” gọn, tự nhiên và không bổ sung giới tính hay đặc điểm không cần thiết.
- source_word: τὰ δέκα τάλαντα
  choice: mười ta-lâng
  rationale: Chỉ số lượng cụ thể đã được nhắc đến trong mạch truyện. Tiếng Việt không có mạo từ tương ứng, nên tính xác định được truyền đạt tự nhiên qua ngữ cảnh.
theological_decisions:
- issue: Ý nghĩa của τάλαντον trong bối cảnh dụ ngôn
  choice: Dùng thuật ngữ lịch sử “ta-lâng” và chú thích rằng đây là đơn vị trọng lượng, cũng được dùng để chỉ tiền.
  alternative: Dịch diễn giải là “khoản tiền” hoặc hiểu là “tài năng”.
  rationale: Dụ ngôn nói về những khoản được giao và việc chịu trách nhiệm. “Ta-lâng” bảo tồn bối cảnh lịch sử mà không áp đặt nghĩa phát sinh là năng khiếu; chú thích giúp độc giả hiện đại hiểu nghĩa tiền tệ.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Cấu trúc mệnh lệnh được giữ rõ bằng “hãy”; “vậy” nối câu với phán quyết trước đó. Thuật ngữ “ta-lâng” được phiên âm và giải thích bằng chú thích để tránh cách hiểu hiện đại là năng khiếu.
