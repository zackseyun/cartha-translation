source:
  edition: SBLGNT
  text: ὁ δὲ τὸ ἓν λαβὼν ἀπελθὼν ὤρυξεν ⸀γῆν καὶ ⸀ἔκρυψεν τὸ ἀργύριον τοῦ κυρίου αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/018.yaml
  text: But the one who had received the one talent went away[a], dug in the ground, and hid his master's money.
translation:
  language: vi
  text: Nhưng người đã nhận một ta-lâng thì đi đào đất và giấu số tiền[a] của chủ mình.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc, sát nghĩa hơn: “bạc của chủ mình.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ
  choice: Nhưng người
  rationale: δέ đánh dấu sự tương phản với những đầy tớ trước; “Nhưng” giữ rõ nét đối lập, còn mạo từ được hiểu theo nghĩa danh từ là “người”.
- source_word: τὸ ἓν
  choice: một ta-lâng
  rationale: “Một” trong tiếng Hy Lạp tỉnh lược danh từ, quy chiếu về ta-lâng ở ngữ cảnh trước (25:15); bổ sung “ta-lâng” giúp câu tiếng Việt rõ nghĩa mà không thêm ý mới.
- source_word: λαβὼν
  choice: đã nhận
  rationale: Phân từ diễn tả hành động xảy ra trước các động từ chính; “đã nhận” tự nhiên và phù hợp với việc người đầy tớ được giao tiền.
- source_word: ἀπελθὼν
  choice: đi khỏi
  rationale: Giữ ý chuyển động rời đi và trình tự hành động của phân từ, bằng cách diễn đạt tiếng Việt gọn, tự nhiên.
- source_word: ὤρυξεν γῆν
  choice: đào đất
  rationale: Cụm Hy Lạp nói đến việc đào vào đất; “đào đất” sát nguyên văn và dễ hiểu, không diễn giải thêm rõ ràng thành “đào một cái hố”.
- source_word: ἔκρυψεν
  choice: giấu
  rationale: Từ thông dụng, trực tiếp và tự nhiên tương ứng với κρύπτω trong ngữ cảnh này.
- source_word: τὸ ἀργύριον
  choice: số tiền
  rationale: ἀργύριον có thể chỉ bạc hoặc tiền; trong ngữ cảnh tài sản được giao phó, “số tiền” truyền đạt đúng chức năng và tự nhiên trong tiếng Việt.
- source_word: τοῦ κυρίου αὐτοῦ
  choice: của chủ mình
  rationale: κύριος ở đây chỉ người chủ của đầy tớ trong câu chuyện; “chủ mình” diễn đạt rõ quan hệ xã hội và đại từ phản thân quy chiếu về người đầy tớ.
theological_decisions:
- issue: Cách dịch κύριος khi chỉ nhân vật con người trong dụ ngôn
  choice: chủ
  alternative: Chúa
  rationale: Trong thế giới câu chuyện, κύριος trực tiếp chỉ người chủ của đầy tớ, không phải là một danh xưng thần học trực tiếp. “Chủ” giữ đúng quan hệ quyền uy mà không áp đặt nghĩa danh hiệu thần linh vào câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Giữ thuật ngữ “ta-lâng” để nối với đơn vị tiền tệ lớn trong ngữ cảnh dụ ngôn; không thêm chú thích vì trong câu này ἀργύριον được dịch tự nhiên là “số tiền”, còn nghĩa vật liệu “bạc” không cần thiết để hiểu nội dung.
