revisions:
- from: Nhưng người đã nhận một ta-lâng thì đi khỏi, đào đất và giấu số tiền của chủ mình.
  to: Nhưng người đã nhận một ta-lâng thì đi đào đất và giấu số tiền[a] của chủ mình.
  rationale: Chỉnh “đi khỏi, đào đất” thành “đi đào đất” để tiếng Việt tự nhiên hơn, đồng thời vẫn phản ánh trình tự của phân từ ἀπελθών và động từ “đào”. Thêm chú thích cho ἀργύριον để bảo tồn phương án nghĩa đen “bạc” mà không thay đổi nghĩa ngữ cảnh là “số tiền”.
