id: MAT.25.20
reference: Matthew 25:20
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ προσελθὼν ὁ τὰ πέντε τάλαντα λαβὼν προσήνεγκεν ἄλλα πέντε τάλαντα λέγων· Κύριε, πέντε τάλαντά μοι παρέδωκας· ἴδε ἄλλα πέντε τάλαντα ⸀ἐκέρδησα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/020.yaml
  text: And the one who had received the five talents came forward and brought another five talents[a], saying, ‘Lord, you delivered five talents to me; look[b], I have gained another five talents.’
translation:
  language: vi
  text: 'Người đã nhận năm ta-lâng tiến đến, đem thêm năm ta-lâng nữa[a] và nói: ‘Thưa chủ, chủ đã giao cho tôi năm ta-lâng; xem này[b], tôi đã làm lợi thêm năm ta-lâng nữa.’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ta-lâng là một đơn vị trọng lượng lớn, cũng được dùng để tính những khoản tiền rất lớn.
    reason: cultural_note
  - marker: b
    text: 'Cũng có thể dịch: “hãy xem.”'
    reason: alternative_reading
lexical_decisions:
- source_word: προσελθὼν
  choice: tiến đến
  rationale: Diễn đạt hành động đến gần để trình diện trước chủ, tự nhiên trong tiếng Việt và giữ sắc thái của προσέρχομαι.
- source_word: ὁ τὰ πέντε τάλαντα λαβὼν
  choice: người đã nhận năm ta-lâng
  rationale: Cấu trúc phân từ có mạo từ xác định người đầy tớ qua việc đã nhận tiền trước đó; không thêm từ chỉ giới tính mà nguyên văn không nêu.
- source_word: τάλαντα
  choice: ta-lâng
  rationale: Giữ nguyên thuật ngữ chỉ đơn vị trọng lượng và tiền tệ lớn thời cổ, tránh thu hẹp nghĩa thành một loại kim loại hay túi tiền cụ thể.
- source_word: προσήνεγκεν
  choice: đem
  rationale: Trong ngữ cảnh này, προσφέρω nói đến việc mang khoản tiền tăng thêm đến trước mặt chủ; “đem” rõ ràng, tự nhiên và không gợi sắc thái tế lễ.
- source_word: ἄλλα πέντε τάλαντα
  choice: thêm năm ta-lâng nữa
  rationale: Diễn đạt rõ một khoản bổ sung bằng đúng số ban đầu, đồng thời tự nhiên hơn lối dịch sát chữ trong tiếng Việt.
- source_word: Κύριε
  choice: thưa chủ
  rationale: Trong lời nói trực tiếp của đầy tớ, κύριος là cách xưng hô kính trọng với người chủ; “thưa chủ” tự nhiên và không áp đặt danh xưng thần học ngoài bối cảnh trực tiếp.
- source_word: παρέδωκας
  choice: đã giao cho tôi
  rationale: Giữ nghĩa căn bản là trao/giao vào tay người khác mà không diễn giải quá mức thành “ủy thác,” dù ý ủy thác hiện diện trong bối cảnh.
- source_word: ἴδε
  choice: xem này
  rationale: Giữ chức năng thu hút sự chú ý và chỉ vào kết quả đang được trình ra; cách nói hiện đại, sống động nhưng trang nhã.
- source_word: ἐκέρδησα
  choice: đã làm lợi thêm
  rationale: κερδαίνω ở đây chỉ việc thu được lợi nhuận từ số vốn đã giao; “làm lợi thêm” phù hợp ngữ cảnh hơn “kiếm được,” vốn có thể gợi tiền công.
theological_decisions:
- issue: Cách dịch κύριος trong lời người đầy tớ thưa với chủ
  choice: thưa chủ
  alternative: Lạy Chúa
  rationale: Bối cảnh trực tiếp là quan hệ giữa đầy tớ và người chủ trong dụ ngôn. “Thưa chủ” bảo toàn nghĩa xã hội của κύριος và lời xưng hô kính trọng, đồng thời không loại bỏ ý nghĩa rộng hơn của toàn dụ ngôn nhưng cũng không biến câu nói thành lời tuyên xưng thần học một cách quá sớm.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Lời xưng hô “thưa chủ… chủ… tôi” phù hợp quan hệ trong dụ ngôn. Các dấu chú thích [a], [b] đều xuất hiện trong chính văn; thứ tự chú thích được đặt theo đúng vị trí nội dung mà chúng giải thích.
source_grounding:
  english_pob_role: consult_only
