id: MAT.25.5
reference: Matthew 25:5
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: χρονίζοντος δὲ τοῦ νυμφίου ἐνύσταξαν πᾶσαι καὶ ἐκάθευδον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/005.yaml
  text: But while the bridegroom was delayed[b][a], they all became drowsy and fell asleep.
translation:
  language: vi
  text: Nhưng vì chàng rể đến chậm[a], tất cả các cô đều buồn ngủ rồi ngủ thiếp đi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “trong khi chàng rể còn lâu mới đến.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “tất cả các cô đều trở nên buồn ngủ và đang ngủ.” Tiếng Hy Lạp phân biệt việc trở nên buồn ngủ (ἐνύσταξαν) với trạng thái đang ngủ (ἐκάθευδον).'
    reason: lexical_alternative
lexical_decisions:
- source_word: χρονίζοντος
  choice: đến chậm
  rationale: Phân từ hiện tại trong cấu trúc sở hữu cách tuyệt đối diễn tả việc chàng rể chậm đến hoặc mất nhiều thời gian hơn dự kiến. “Đến chậm” tự nhiên trong tiếng Việt và phù hợp với bối cảnh chờ đợi.
- source_word: δὲ
  choice: Nhưng
  rationale: 'δέ đánh dấu một bước chuyển nhẹ có sắc thái tương phản: chàng rể chưa đến như mong đợi, nên các cô trở nên buồn ngủ.'
- source_word: νυμφίου
  choice: chàng rể
  rationale: νυμφίος chỉ người nam trong lễ cưới. “Chàng rể” giữ nguyên hình ảnh của dụ ngôn, có sắc thái trang trọng vừa phải và dễ hiểu.
- source_word: ἐνύσταξαν
  choice: đều buồn ngủ
  rationale: νυστάζω diễn tả việc trở nên buồn ngủ. Cách dịch này giữ được giai đoạn buồn ngủ trước hành động ngủ thực sự.
- source_word: πᾶσαι
  choice: tất cả các cô đều
  rationale: Dạng giống cái số nhiều quy chiếu về toàn bộ mười cô gái trong dụ ngôn. Nêu rõ “các cô” giúp câu tiếng Việt tự nhiên và tránh mơ hồ.
- source_word: ἐκάθευδον
  choice: ngủ thiếp đi
  rationale: καθεύδω có nghĩa là ngủ; thì chưa hoàn thành có thể nhấn mạnh trạng thái đang ngủ. Trong chuỗi hành động sau “buồn ngủ”, “ngủ thiếp đi” diễn đạt tự nhiên sự chuyển sang giấc ngủ, còn phương án sát thể hơn được ghi ở chú thích.
theological_decisions:
- issue: Hình ảnh chàng rể trong dụ ngôn
  choice: Giữ “chàng rể” như hình ảnh trong câu chuyện, không diễn giải trực tiếp là Đấng Christ trong chính bản dịch.
  alternative: Dịch khái quát hơn hoặc thêm lời giải thích về căn tính của chàng rể.
  rationale: Ngữ cảnh rộng hơn của Ma-thi-ơ có thể tạo âm hưởng thần học, nhưng câu này vẫn kể dụ ngôn bằng hình ảnh chàng rể. Bản dịch không nên đưa phần diễn giải vào lời văn.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, tự nhiên và trang trọng vừa phải. Câu giữ nhịp tiến triển từ chờ đợi, buồn ngủ đến ngủ; các chú thích bảo tồn sắc thái từ vựng và thể động từ của tiếng Hy Lạp.
