  source_fidelity: 'Bản dịch truyền đạt đúng diễn tiến của câu: sự chậm đến của chàng rể dẫn đến việc tất cả các cô buồn ngủ rồi ngủ. “Vì chàng rể đến chậm” là cách diễn đạt nhân-quả tự nhiên trong tiếng Việt cho phân từ sở hữu cách tuyệt đối χρονίζοντος; sắc thái thời gian/hậu quả vẫn được bảo toàn. “Buồn ngủ rồi ngủ thiếp đi” phản ánh hợp lý sự phân biệt giữa ἐνύσταξαν và ἐκάθευδον, dù thì chưa hoàn thành của động từ sau cũng có thể nhấn mạnh trạng thái đang ngủ như chú thích nêu rõ.'
