base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/003.yaml
  text: For the foolish[a], when they took their lamps, did not take oil with them.
translation:
  language: vi
  text: Vì những cô dại, khi mang đèn[a] của mình, đã không mang dầu theo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch là “đuốc” (Hy Lạp: λαμπάδας).'
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: Vì
  rationale: Giữ chức năng giải thích của liên từ, nối câu này với nhận định ở câu trước một cách tự nhiên trong tiếng Việt.
- source_word: μωραὶ
  choice: những cô dại
  rationale: Tính từ giống cái số nhiều được dùng như danh từ và quy chiếu về các trinh nữ trong dụ ngôn; “những cô dại” vừa thể hiện quy chiếu ấy vừa tránh lặp lại đầy đủ danh từ.
- source_word: λαβοῦσαι
  choice: khi mang ... theo
  rationale: Phân từ bất định diễn tả hoàn cảnh hoặc thời điểm đi kèm hành động chính; cấu trúc “khi ...” tự nhiên và giữ được quan hệ với động từ ἔλαβον.
- source_word: λαμπάδας
  choice: đèn
  rationale: “Đèn” là cách dịch quen thuộc, phù hợp với việc nhắc đến dầu; khả năng dịch là “đuốc” được giữ trong chú thích.
- source_word: οὐκ ἔλαβον
  choice: không mang ... theo
  rationale: Diễn đạt tự nhiên ý họ không đem dầu cùng mình, đồng thời lặp lại cụm “mang ... theo” để phản ánh sự lặp từ λαμβάνω trong nguyên văn.
- source_word: μεθ’ ἑαυτῶν
  choice: theo
  rationale: Trong tiếng Việt, “mang ... theo” truyền đạt tự nhiên ý ‘cùng với mình’ mà không cần một đại từ phản thân nặng nề.
- source_word: ἔλαιον
  choice: dầu
  rationale: Tương đương trực tiếp và rõ ràng; trong ngữ cảnh, đây là dầu dùng cho đèn hoặc đuốc.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Trật tự câu được điều chỉnh cho tự nhiên trong tiếng Việt, còn sự đối ứng “mang đèn theo” nhưng “không mang dầu theo” được bảo toàn.
