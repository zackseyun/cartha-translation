  to: Vì sợ, tôi đã đi và giấu ta-lâng[a] của ông dưới đất. Đây, ông có cái thuộc về ông.
  rationale: Sửa cách liên kết hai hành động cho tự nhiên hơn; thay “nhận lại” bằng “có” để phản ánh trực tiếp ἔχεις; thay cách diễn đạt cuối câu bằng “cái thuộc về ông” để giữ tính tỉnh lược và nhấn mạnh sở hữu; đồng thời đặt ký hiệu chú thích ngay sau “ta-lâng.”
