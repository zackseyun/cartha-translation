source:
  edition: SBLGNT
  text: καὶ φοβηθεὶς ἀπελθὼν ἔκρυψα τὸ τάλαντόν σου ἐν τῇ γῇ· ἴδε ἔχεις τὸ σόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/025.yaml
  text: And being afraid[a], I went away and hid your talent in the ground. Look, you have what is yours.
translation:
  language: vi
  text: Vì sợ, tôi đã đi và giấu ta-lâng[a] của ông dưới đất. Đây, ông có cái thuộc về ông.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ta-lâng là một đơn vị trọng lượng và tiền tệ có giá trị lớn, không phải là “tài năng” theo nghĩa năng khiếu tự nhiên.
    reason: lexical_alternative
lexical_decisions:
- source_word: φοβηθεὶς
  choice: Vì sợ
  rationale: Phân từ bất định được dùng để nêu hoàn cảnh, cụ thể là động cơ của hành động; “vì sợ” diễn đạt tự nhiên quan hệ này mà không hiểu thành lòng kính sợ.
- source_word: ἀπελθὼν
  choice: đã đi
  rationale: Phân từ bất định đi trước động từ chính, biểu thị hành động xảy ra trước hoặc gắn liền với việc giấu; kết cấu “đã đi giấu” tự nhiên trong tiếng Việt và giữ được trình tự hành động.
- source_word: ἔκρυψα
  choice: giấu
  rationale: κρύπτω có nghĩa trực tiếp là giấu hoặc che kín; “giấu” không đưa ý chôn vào chính động từ, dù cụm “dưới đất” hàm ý điều đó.
- source_word: τὸ τάλαντόν σου
  choice: ta-lâng của ông
  rationale: τάλαντον là đơn vị trọng lượng và tiền tệ có giá trị lớn. Giữ thuật ngữ lịch sử “ta-lâng” để bảo toàn bối cảnh của dụ ngôn, đồng thời chú thích rõ đây là tiền, không phải tài năng thiên phú.
- source_word: ἐν τῇ γῇ
  choice: dưới đất
  rationale: Trong ngữ cảnh giấu một khoản tiền bằng cách vùi xuống, cách nói tiếng Việt tự nhiên là “dưới đất”; cụm này chuyển tải đúng nơi cất giấu mà không cần đổi động từ thành “chôn”.
- source_word: ἴδε
  choice: Kìa
  rationale: ἴδε là từ thu hút sự chú ý và chỉ vào vật được trao trả; “Kìa” giữ sắc thái chỉ xuất, trang trọng vừa phải và tự nhiên trong lời thoại.
- source_word: ἔχεις τὸ σόν
  choice: ông nhận lại phần thuộc về mình
  rationale: Cụm Hy Lạp có tính tỉnh lược, sát nghĩa là “ông có cái thuộc về ông.” Cách dịch này giữ sự nhấn mạnh quyền sở hữu, đồng thời thể hiện tự nhiên tình huống người đầy tớ trao lại tài sản cho chủ.
theological_decisions:
- issue: Ý nghĩa của τάλαντον trong dụ ngôn thường bị liên hệ với năng khiếu tự nhiên
  choice: Giữ thuật ngữ lịch sử “ta-lâng” trong chính văn và giải thích nghĩa tiền tệ trong chú thích.
  alternative: Dịch trực tiếp là “một khoản tiền lớn” hoặc dùng một giá trị tiền hiện đại.
  rationale: Trong tiếng Hy Lạp, từ này chỉ một đơn vị trọng lượng hoặc tiền tệ lớn, không trực tiếp chỉ năng khiếu. Giữ “ta-lâng” bảo toàn màu sắc lịch sử và tính liên tục văn chương, còn chú thích ngăn cách hiểu sai theo nghĩa hiện đại.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, rõ ràng và trang trọng vừa phải. Đại từ “tôi—ông” phù hợp lời người đầy tớ thưa với chủ mà không thêm tước hiệu ngoài nguyên văn. Dấu chú thích được đặt sau toàn câu vì nội dung chú thích giải nghĩa thuật ngữ “ta-lâng” đã xuất hiện trong câu.
