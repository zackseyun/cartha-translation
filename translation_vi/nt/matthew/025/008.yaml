  terminology: Cặp “dại/khôn” giữ được thế đối lập μωραί/φρόνιμοι. “Đèn” là lựa chọn ngữ cảnh hợp lý cho λαμπάδες; chú thích nên giữ khả năng “đuốc” bằng cách diễn đạt gọn, tự nhiên hơn.
  issues:
