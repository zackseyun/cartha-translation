review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch phản ánh đúng các thành phần chính của câu Hy Lạp: đối lập giữa nhóm dại và nhóm khôn, lời yêu cầu xin một phần dầu, và mệnh đề chỉ lý do. Tuy nhiên, σβέννυνται ở thì hiện tại diễn tả tiến trình ngọn đèn đang tắt/đang lịm dần; “sắp tắt” chuyển trọng tâm sang một trạng thái còn chưa diễn ra, nên kém sát hơn.'
