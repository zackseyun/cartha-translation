source:
  edition: SBLGNT
  text: αἱ δὲ μωραὶ ταῖς φρονίμοις εἶπαν· Δότε ἡμῖν ἐκ τοῦ ἐλαίου ὑμῶν, ὅτι αἱ λαμπάδες ἡμῶν σβέννυνται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/008.yaml
  text: But the foolish said to the wise[a], ‘Give us some of your oil, because our lamps are going out.’
translation:
  language: vi
  text: 'Nhưng những cô dại nói với những cô khôn: “Hãy cho chúng tôi một ít dầu của các cô, vì đèn[a] của chúng tôi đang tắt.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “đuốc”; từ Hy Lạp λαμπάδες có thể chỉ một vật phát sáng cầm tay đang cháy, và cách dịch khác nhau tùy theo cách hiểu bối cảnh.
    reason: lexical_alternative
lexical_decisions:
- source_word: μωραὶ
  choice: những cô dại
  rationale: Tính từ được dùng như danh từ, chỉ nhóm trinh nữ dại trong dụ ngôn. “Những cô dại” tự nhiên trong ngữ cảnh và giữ được sự tương phản với “những cô khôn”.
- source_word: φρονίμοις
  choice: những cô khôn
  rationale: Từ này chỉ sự khôn ngoan thực tế, thể hiện qua việc chuẩn bị sẵn sàng. “Những cô khôn” vừa thông dụng vừa giữ sự đối xứng với μωραὶ.
- source_word: Δότε
  choice: Hãy cho
  rationale: Mệnh lệnh cách aorist số nhiều diễn tả một lời yêu cầu trực tiếp; “Hãy cho” truyền đạt rõ sắc thái ấy bằng tiếng Việt tự nhiên.
- source_word: ἐκ τοῦ ἐλαίου ὑμῶν
  choice: một ít dầu của các cô
  rationale: ἐκ với sở hữu cách mang nghĩa phân lượng, tức xin một phần từ số dầu của họ; “một ít dầu của các cô” diễn đạt tự nhiên nghĩa này.
- source_word: λαμπάδες
  choice: đèn
  rationale: λαμπάς có thể chỉ đèn hoặc đuốc. “Đèn” phù hợp với hình ảnh dầu trong dụ ngôn và cách hiểu quen thuộc, còn khả năng dịch là “đuốc” được giữ trong chú thích.
- source_word: σβέννυνται
  choice: sắp tắt
  rationale: Thì hiện tại diễn tả ngọn lửa đang trong quá trình tắt. “Sắp tắt” là cách nói tự nhiên, cho thấy tình trạng tắt đang cận kề, không hiểu thành đã tắt hẳn.
- source_word: ὅτι
  choice: vì
  rationale: Liên từ nêu lý do cho lời xin; “vì” rõ ràng và tự nhiên trong tiếng Việt hiện đại.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “các cô” vì các nhân vật là những trinh nữ đã được xác định trong ngữ cảnh; giữ cặp đối xứng “cô dại/cô khôn” và không thêm cách giải thích thần học vào câu.
