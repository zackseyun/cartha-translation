    issue: “sắp tắt” dịch σβέννυνται
    rationale: Động từ hiện tại σβέννυνται mô tả đèn đang tắt hay đang lịm dần, không chỉ đơn thuần là sẽ tắt trong tương lai gần. “Đang tắt” bảo toàn rõ hơn phương diện tiến hành của nguyên ngữ.
  - severity: low
    issue: Diễn đạt chú thích “nguồn sáng cháy được cầm tay” hơi gượng
    rationale: Có thể nói tự nhiên hơn là “vật phát sáng cầm tay đang cháy,” đồng thời vẫn giữ nguyên sự mơ hồ từ vựng giữa “đèn” và “đuốc”.
