  to: 'Nhưng những cô dại nói với những cô khôn: “Hãy cho chúng tôi một ít dầu của các cô, vì đèn[a] của chúng tôi đang tắt.”'
  rationale: Chỉ sửa “sắp tắt” thành “đang tắt” để phản ánh sát hơn thì hiện tại của σβέννυνται. Chú thích từ vựng được chỉnh nhẹ cho tự nhiên, vẫn duy trì phương án “đuốc” và không áp đặt một cách hình dung duy nhất về bối cảnh.
