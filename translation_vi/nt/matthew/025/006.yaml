    rationale: Bản văn nguồn có αὐτοῦ (“người ấy/người đó”) ở cuối câu. Với thuật ngữ “chú rể”, dịch đại từ là “người ấy” giúp chú thích về sự vắng mặt của đại từ có điểm neo minh bạch.
