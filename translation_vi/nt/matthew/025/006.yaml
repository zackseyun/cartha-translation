revisions:
- from: 'Nhưng đến nửa đêm, có tiếng kêu vang lên: “Kìa[a], chàng rể! Hãy ra đón chàng.”[b]'
  to: 'Nhưng đến nửa đêm, có tiếng hô vang lên: “Kìa[a], chú rể! Hãy ra đón người ấy.”[b]'
  rationale: Bản sửa thay thuật ngữ hôn lễ không chuẩn bằng “chú rể”, làm rõ sắc thái loan báo của κραυγή bằng “tiếng hô”, và duy trì αὐτοῦ bằng đại từ “người ấy”. Nhờ đó, chú thích biến thể ở cuối câu được neo vào đúng yếu tố văn bản, trong khi vẫn giữ nguyên mức độ diễn giải và hình tượng dụ ngôn của nguyên văn.
