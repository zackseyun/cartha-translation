  - severity: low
    issue: “Tiếng kêu” có thể gợi tiếng kêu nói chung hơn là lời hô/loan báo.
    rationale: κραυγή ở đây là một tiếng hô lớn báo tin. “Tiếng hô vang lên” thể hiện rõ chức năng công bố mà không thêm diễn giải.
  - severity: low
