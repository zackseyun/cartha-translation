  text: μέσης δὲ νυκτὸς κραυγὴ γέγονεν· Ἰδοὺ ὁ ⸀νυμφίος, ἐξέρχεσθε εἰς ἀπάντησιν ⸀αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/006.yaml
  text: 'But at midnight a cry rang out: ‘Look[b][a], the bridegroom! Come out to meet him.’'
translation:
  language: vi
  text: 'Nhưng đến nửa đêm, có tiếng hô vang lên: “Kìa[a], chú rể! Hãy ra đón người ấy.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Này, chú rể!”'
    reason: lexical_alternative
  - marker: b
    text: Một số thủ bản không có đại từ “người ấy” ở cuối câu.
    reason: textual_variant
lexical_decisions:
- source_word: μέσης δὲ νυκτός
  choice: Nhưng đến nửa đêm
  rationale: Cấu trúc sở hữu cách chỉ thời gian có nghĩa tự nhiên là “đến nửa đêm”; “nhưng” thể hiện δέ như một chuyển tiếp trần thuật có sắc thái tương phản nhẹ.
- source_word: κραυγὴ γέγονεν
  choice: có tiếng kêu vang lên
  rationale: Diễn đạt tự nhiên sự xuất hiện đột ngột của một tiếng hô lớn, đồng thời phản ánh γέγονεν như động từ giới thiệu một biến cố xảy ra.
- source_word: Ἰδού
  choice: Kìa
  rationale: “Kìa” là từ gọi sự chú ý tự nhiên trong tiếng Việt, giữ được tính chỉ xuất và sắc thái thông báo đột ngột của ἰδού.
- source_word: ὁ νυμφίος
  choice: chàng rể
  rationale: “Chàng rể” chỉ đúng nhân vật nam trong bối cảnh lễ cưới và tự nhiên hơn “tân lang” đối với độc giả phổ thông hiện đại.
- source_word: ἐξέρχεσθε
  choice: Hãy ra
  rationale: Mệnh lệnh số nhiều kêu gọi những người đang chờ đi ra khỏi nơi họ ở; tiếng Việt không cần buộc chọn góc nhìn “đi” hay “đến” như tiếng Anh.
- source_word: εἰς ἀπάντησιν αὐτοῦ
  choice: đón chàng
  rationale: Trong bối cảnh đoàn rước cưới, “đón chàng” diễn đạt tự nhiên hành động đi ra gặp và tiếp đón người đang đến; đại từ “chàng” phù hợp với “chàng rể”.
theological_decisions:
- issue: Hàm ý dụ ngôn của νυμφίος
  choice: Dịch là “chàng rể”, không viết hoa và không nêu rõ nhân vật này là Đấng Christ.
  alternative: “Chàng Rể” hoặc diễn giải trực tiếp là Đấng Christ
  rationale: Câu này trình bày nhân vật ở bình diện câu chuyện dụ ngôn. Cách dịch không viết hoa giữ nguyên hình ảnh văn chương và không đưa sự đồng nhất hóa thần học vào chính lời văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Kìa” giữ lực gọi chú ý mà không cổ kính; “chàng rể” duy trì rõ hình ảnh lễ cưới. Dấu chú thích [a] và [b] đều xuất hiện trong chính văn.
