base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/004.yaml
  text: But the wise took oil in their containers with their lamps[a].
translation:
  language: vi
  text: Còn các cô khôn ngoan thì mang theo dầu trong các bình, cùng với đèn[a] của mình.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “đuốc”; từ Hy Lạp lampadas có thể chỉ đuốc hoặc đèn, tùy ngữ cảnh.
    reason: lexical_alternative
lexical_decisions:
- source_word: φρόνιμοι
  choice: khôn ngoan
  rationale: Diễn tả sự khôn ngoan thực tế và giữ nguyên sự đối lập với các cô dại trong ngữ cảnh, không thu hẹp nghĩa thành chỉ ‘có chuẩn bị’.
- source_word: ἔλαβον
  choice: mang theo
  rationale: Trong ngữ cảnh kể chuyện, động từ chỉ việc họ đem dầu đi cùng; ‘mang theo’ tự nhiên và rõ hơn cách dịch sát chữ ‘lấy’.
- source_word: ἔλαιον
  choice: dầu
  rationale: Giữ nghĩa khái quát của từ Hy Lạp; không thêm ‘ô-liu’ vì nguyên văn không cần xác định cụ thể tại đây.
- source_word: ἀγγείοις
  choice: các bình đựng
  rationale: Đây là từ khái quát chỉ vật chứa; ‘bình đựng’ tự nhiên trong tiếng Việt mà không xác định quá mức hình dáng hay chất liệu.
- source_word: λαμπάδων
  choice: đèn
  rationale: Từ Hy Lạp có thể chỉ đèn hoặc đuốc. ‘Đèn’ phù hợp với truyền thống diễn đạt và việc mang thêm dầu; nghĩa ‘đuốc’ được giữ trong chú thích.
- source_word: ἑαυτῶν
  choice: của mình
  rationale: Thể hiện sắc thái phản thân, quy chiếu rõ các cây đèn thuộc về chính những cô khôn ngoan.
- source_word: μετὰ τῶν λαμπάδων ἑαυτῶν
  choice: cùng với đèn của mình
  rationale: Giữ ý nghĩa đi kèm của μετά với sở hữu phản thân, đồng thời tạo câu tiếng Việt tự nhiên.
