base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/006.yaml
  text: and they were being baptized by him in the Jordan River[a], confessing their sins.
translation:
  language: vi
  text: Và họ được ông làm phép báp-têm trong sông Giô-đanh[a], đồng thời xưng nhận tội lỗi của mình.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “họ đang được ông làm phép báp-têm”; thì chưa hoàn thành trong tiếng Hy Lạp có thể nhấn mạnh hành động đang tiếp diễn hoặc lặp lại.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: và
  rationale: Giữ liên từ đơn giản, nối câu này với mạch tường thuật trước đó.
- source_word: ἐβαπτίζοντο
  choice: được ông làm phép báp-têm
  rationale: Thể bị động cho thấy họ nhận hành động do ông thực hiện. Thuật ngữ “làm phép báp-têm” quen thuộc, không tự quyết định phương thức nghi lễ; nét tiếp diễn hoặc lặp lại của thì chưa hoàn thành được ghi nhận trong chú thích.
- source_word: ἐν τῷ Ἰορδάνῃ ποταμῷ
  choice: dưới sông Giô-đanh
  rationale: Cách nói tự nhiên trong tiếng Việt cho việc làm phép báp-têm tại sông; “sông” thể hiện rõ ποταμῷ, còn “Giô-đanh” là tên riêng quen dùng.
- source_word: ὑπ’ αὐτοῦ
  choice: được ông
  rationale: Giữ đại từ chỉ tác nhân như nguyên văn, không thay bằng tên Giăng dù ngữ cảnh cho thấy đại từ chỉ về ông.
- source_word: ἐξομολογούμενοι
  choice: đồng thời xưng nhận
  rationale: Phân từ hiện tại diễn tả hành động diễn ra cùng với động từ chính; “xưng nhận” truyền đạt việc công khai thừa nhận điều sai phạm mà không thêm mức độ công khai ngoài câu chữ.
- source_word: τὰς ἁμαρτίας αὐτῶν
  choice: tội lỗi mình
  rationale: Diễn đạt tự nhiên quan hệ sở hữu phản thân trong tiếng Việt và giữ ý nghĩa số nhiều mang tính tập hợp của các tội.
theological_decisions:
- issue: Thuật ngữ và phương thức báp-têm
  choice: Dùng “làm phép báp-têm”, không xác định phương thức.
  alternative: dìm mình / nhúng chìm / tẩy rửa
  rationale: Trong ngữ cảnh này, βαπτίζω là thuật ngữ nghi lễ; câu không chủ ý giải thích chính xác phương thức. Cách dịch này tránh đưa kết luận hệ phái vào bản văn.
- issue: Sắc thái thể của ἐβαπτίζοντο
  choice: Dùng câu chính tự nhiên và ghi nét tiếp diễn hoặc lặp lại trong chú thích.
  alternative: đang lần lượt được ông làm phép báp-têm
  rationale: Thì chưa hoàn thành có thể trình bày một hoạt động đang diễn ra hoặc lặp lại, nhưng tiếng Việt không cần bắt buộc đánh dấu sắc thái ấy ngay trong câu; chú thích bảo tồn khả năng diễn giải mà không làm câu nặng nề.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Ông” giữ cách quy chiếu bằng đại từ của nguyên văn; “dưới sông” là cách nói tiếng Việt tự nhiên cho địa điểm nghi lễ. Dấu chú thích [a] xuất hiện ngay sau cụm liên quan.
