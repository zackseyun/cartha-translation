review_pass:
  verdict: revise
  source_fidelity: 'Bản nháp giữ đúng các thành phần chính: phép báp-têm do “ông” thực hiện, địa điểm là sông Giô-đanh, và việc xưng nhận tội diễn ra đồng thời. Tuy nhiên, “dưới sông Giô-đanh” trong tiếng Việt thường gợi vị trí ở bên dưới một con sông, không phải ở trong nước/sông, nên không phản ánh chính xác ἐν ... ποταμῷ.'
  naturalness: Cấu trúc “được ông làm phép báp-têm” có thể hiểu được và phù hợp văn phong trang trọng. Đổi “dưới sông” thành “trong sông” vừa tự nhiên vừa chính xác. Thêm “của” trong “tội lỗi của mình” giúp quan hệ sở hữu rõ và trôi chảy.
  terminology: “Làm phép báp-têm” là thuật ngữ nghi lễ chấp nhận được và không áp đặt phương thức. “Xưng nhận” chuyển tải phù hợp ἐξομολογούμενοι; “tội lỗi của mình” giữ ý các tội của họ mà không thêm diễn giải thần học.
  issues:
  - severity: medium
    issue: “dưới sông Giô-đanh” dịch sai quan hệ địa điểm.
    rationale: ἐν τῷ Ἰορδάνῃ ποταμῷ nghĩa là “trong sông Giô-đanh.” Trong tiếng Việt hiện đại, “dưới sông” thường chỉ vị trí phía dưới/mặt đáy hoặc ở dưới một dòng sông, không phải địa điểm thực hiện hành động ở trong sông.
  - severity: low
    issue: Chú thích nêu “đang lần lượt” như lựa chọn thay thế.
    rationale: Thì chưa hoàn thành có thể gợi tiến trình hoặc sự lặp lại, nhưng “lần lượt” thêm sắc thái tuần tự không được nêu rõ trong tiếng Hy Lạp. Nên dùng một lựa chọn chỉ tiến trình và giải thích khả năng tiếp diễn/lặp lại.
