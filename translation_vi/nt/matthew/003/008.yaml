  text: ποιήσατε οὖν καρπὸν ἄξιον τῆς μετανοίας
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/008.yaml
  text: Therefore[a], produce fruit worthy of repentance.
translation:
  language: vi
  text: Vậy, hãy sinh hoa trái xứng với sự ăn năn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “hoa trái phù hợp với sự hối cải.”'
    reason: Nêu cách diễn đạt khác cho quan hệ tương ứng của ἄξιον với μετανοίας, không hàm ý rằng hoa trái tạo ra hay mua được sự ăn năn.
lexical_decisions:
- source_word: ποιήσατε
  choice: hãy sinh
  rationale: Động từ mệnh lệnh aorist, ngôi thứ hai số nhiều, đòi hỏi hành động dứt khoát. Trong hình ảnh hoa trái, “sinh hoa trái” tự nhiên hơn cách dịch sát chữ “làm ra hoa trái” mà vẫn giữ nguyên sức mạnh của mệnh lệnh.
- source_word: οὖν
  choice: Vậy
  rationale: Nêu kết luận từ lời kêu gọi và cảnh báo ngay trước đó; “Vậy” diễn đạt quan hệ suy luận rõ ràng, tự nhiên trong tiếng Việt.
- source_word: καρπὸν
  choice: hoa trái
  rationale: Giữ hình ảnh ẩn dụ về kết quả hữu hình trong đời sống. Danh từ số ít trong tiếng Hy Lạp có nghĩa tập hợp, nên tiếng Việt không cần đánh dấu số.
- source_word: ἄξιον
  choice: xứng hợp với
  rationale: ἄξιος đi với sở hữu cách ở đây chỉ sự phù hợp hay tương ứng. “Xứng hợp với” giữ được ý nghĩa ấy mà không gợi rằng hành vi có thể tạo ra hoặc mua được sự ăn năn.
- source_word: μετανοίας
  choice: lòng ăn năn
  rationale: Diễn tả sự thay đổi hướng lòng và đời sống theo lời kêu gọi của Giăng. “Lòng ăn năn” là cách nói tự nhiên, trang trọng trong tiếng Việt và không thu hẹp nghĩa vào cảm giác hối tiếc đơn thuần.
theological_decisions:
- issue: Ý nghĩa của cụm καρπὸν ἄξιον τῆς μετανοίας
  choice: Hoa trái trong đời sống phải phù hợp với lòng ăn năn chân thật
  alternative: Hoa trái khiến người ta đạt được hoặc xứng đáng nhận sự ăn năn
  rationale: Cấu trúc sở hữu cách diễn tả sự tương ứng, không phải công trạng. Bản dịch giữ lời đòi hỏi về hành vi hữu hình nhưng không biến hành vi ấy thành nguyên nhân hay giá mua của sự ăn năn.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. “Sinh hoa trái” bảo toàn hình ảnh của nguyên văn; “xứng hợp với” diễn đạt tự nhiên mối tương ứng giữa hành vi và lòng ăn năn.
