id: MAT.3.9
reference: Matthew 3:9
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ μὴ δόξητε λέγειν ἐν ἑαυτοῖς· Πατέρα ἔχομεν τὸν Ἀβραάμ, λέγω γὰρ ὑμῖν ὅτι δύναται ὁ θεὸς ἐκ τῶν λίθων τούτων ἐγεῖραι τέκνα τῷ Ἀβραάμ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/009.yaml
  text: And do not presume to say among yourselves[a], ‘We have Abraham as our father,’ for I tell you that God is able to raise up children for Abraham from these stones.
translation:
  language: vi
  text: 'Đừng tưởng rằng các người có thể nói với nhau[a]: ‘Chúng ta có Áp-ra-ham là cha.’ Vì tôi nói với các người rằng Đức Chúa Trời có thể từ những hòn đá này dựng nên con cái cho Áp-ra-ham.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “nói trong lòng mình.” Cụm từ Hy Lạp có thể chỉ lời tự nhủ bên trong hoặc điều họ nói với nhau trong nhóm.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ δόξητε
  choice: Đừng tự phụ
  rationale: Mệnh lệnh phủ định cảnh báo họ đừng nuôi một sự tin chắc không có cơ sở; “tự phụ” diễn đạt sắc thái ỷ lại đầy tự tin trong lời quở trách, mạnh hơn cách dịch đơn thuần là “đừng nghĩ”.
- source_word: λέγειν ἐν ἑαυτοῖς
  choice: mà nói với nhau
  rationale: Đại từ phản thân số nhiều có thể chỉ lời tự nhủ trong lòng hoặc điều họ nói trong nhóm. “Nói với nhau” tự nhiên và phù hợp với lời tuyên bố chung về nguồn gốc, còn khả năng nội tâm được giữ trong chú thích.
- source_word: Πατέρα ἔχομεν τὸν Ἀβραάμ
  choice: Chúng ta có Áp-ra-ham là tổ phụ
  rationale: “Tổ phụ” diễn đạt quan hệ huyết thống với một vị tổ tiên lịch sử rõ hơn “cha” trong tiếng Việt hiện đại, đồng thời giữ nguyên lời viện dẫn đặc quyền dòng dõi.
- source_word: λέγω γὰρ ὑμῖν
  choice: Vì tôi nói với các người
  rationale: Giữ liên từ giải thích γάρ và công thức phát ngôn trực tiếp, với giọng trang trọng nhưng dễ hiểu.
- source_word: δύναται
  choice: có thể
  rationale: Diễn đạt tự nhiên năng lực của Đức Chúa Trời trong tiếng Việt hiện đại mà không làm yếu ý nghĩa quyền năng.
- source_word: ἐκ τῶν λίθων τούτων
  choice: từ những hòn đá này
  rationale: Giữ nguyên hình ảnh cụ thể và quan hệ nguồn gốc do ἐκ biểu thị.
- source_word: ἐγεῖραι
  choice: dựng nên
  rationale: Trong ngữ cảnh này, động từ chỉ việc làm xuất hiện hoặc tạo nên con cháu, không nhất thiết nói về sự sống lại. “Dựng nên” giữ sắc thái mạnh mà không áp đặt nghĩa phục sinh.
- source_word: τέκνα
  choice: con cháu
  rationale: Trong lời nói về Áp-ra-ham, từ này chỉ những người thuộc dòng dõi hoặc được kể là hậu duệ; “con cháu” tự nhiên hơn “con cái” và không giới hạn giới tính.
- source_word: τῷ Ἀβραάμ
  choice: cho Áp-ra-ham
  rationale: 'Giữ quan hệ của cách dữ cách: Đức Chúa Trời có thể dựng nên những người làm con cháu thuộc về Áp-ra-ham.'
theological_decisions:
- issue: Ý nghĩa của dòng dõi Áp-ra-ham trong lời cảnh báo
  choice: Câu này bác bỏ việc tự phụ rằng chỉ cần có huyết thống từ Áp-ra-ham là đủ để được an toàn trước mặt Đức Chúa Trời, nhưng không phủ nhận Áp-ra-ham là tổ phụ lịch sử của họ.
  alternative: Xem lời này chỉ là cường điệu không phê phán đặc quyền dòng dõi, hoặc diễn giải thành tuyên bố rằng dân Y-sơ-ra-ên đã bị thay thế.
  rationale: Bản văn trực tiếp quở trách sự ỷ lại vào tổ tiên, nhưng không trình bày một hệ thống thần học về việc thay thế dân tộc nào; bản dịch giữ nguyên giới hạn và sức căng đó.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “tổ phụ” để tránh cho người đọc hiểu Áp-ra-ham là cha ruột trực tiếp; dùng “các người” để giữ giọng quở trách số nhiều mà không quá khẩu ngữ. Dấu chú thích [a] xuất hiện ngay sau cụm từ có khả năng hiểu theo hai cách.
