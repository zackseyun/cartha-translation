id: MAT.3.17
reference: Matthew 3:17
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ φωνὴ ἐκ τῶν οὐρανῶν λέγουσα· Οὗτός ἐστιν ὁ υἱός μου ὁ ἀγαπητός, ἐν ᾧ εὐδόκησα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/017.yaml
  text: And behold[a], a voice from the heavens said, “This is my beloved Son[b], with whom I am well pleased.”
translation:
  language: vi
  text: 'Và kìa, có một tiếng từ trời[a] phán rằng: “Đây là Con yêu dấu của Ta; Ta hài lòng về Con.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “từ các trời.” Tiếng Hy Lạp dùng dạng số nhiều.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch sát cấu trúc hơn: “nơi Con, Ta vui lòng.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ἰδοὺ
  choice: Và kìa
  rationale: “Kìa” giữ chức năng thu hút sự chú ý và sắc thái trang trọng của ἰδού; “và” phản ánh καί, nối sự kiện này với trình thuật trước đó.
- source_word: φωνὴ
  choice: một tiếng
  rationale: Trong ngữ cảnh có lời nói trực tiếp theo sau, φωνή chỉ một tiếng nói có nội dung, không phải âm thanh vô nghĩa. Cách nói “có một tiếng… phán rằng” tự nhiên trong tiếng Việt.
- source_word: ἐκ τῶν οὐρανῶν
  choice: từ các tầng trời
  rationale: Giữ dạng số nhiều οὐρανῶν và diễn đạt bằng cách nói tiếng Việt dễ hiểu; phương án quen thuộc “từ trời” được ghi ở chú thích.
- source_word: λέγουσα
  choice: phán rằng
  rationale: Phân từ này giới thiệu lời trực tiếp. Vì tiếng nói đến từ các tầng trời và lời nói xưng “Ta” về Đức Chúa Giê-xu, “phán” phù hợp với ngữ cảnh thần thượng mà không thêm nội dung ngoài bản văn.
- source_word: Οὗτός ἐστιν
  choice: Đây là
  rationale: Diễn đạt tự nhiên, trực tiếp lực xác định của đại từ chỉ định cùng động từ nối.
- source_word: ὁ υἱός μου ὁ ἀγαπητός
  choice: Con yêu dấu của Ta
  rationale: Giữ rõ quan hệ Con và sắc thái được yêu quý của ἀγαπητός. Viết hoa “Con” và “Ta” theo quy ước tiếng Việt khi lời phán trực tiếp nói về Đức Chúa Giê-xu và người nói là Đức Chúa Trời.
- source_word: ἐν ᾧ
  choice: về Con
  rationale: Trong kết cấu với εὐδοκέω, “hài lòng về Con” là tiếng Việt hiện đại, tự nhiên. Chú thích bảo lưu một cách dịch khác gần với cấu trúc Hy Lạp hơn.
- source_word: εὐδόκησα
  choice: Ta hài lòng
  rationale: Diễn đạt lời công bố sự chấp thuận và vui thích của Đức Chúa Trời mà không ép thì aorist thành một hành động chỉ thuộc quá khứ; đây là cách hiểu thích hợp trong công thức tuyên bố này.
theological_decisions:
- issue: Lời tuyên bố về địa vị làm Con của Đức Chúa Giê-xu
  choice: Con yêu dấu của Ta
  alternative: Con rất yêu dấu của Ta
  rationale: Giữ nguyên lời xác nhận trực tiếp về quan hệ làm Con và tình yêu dành cho Ngài, không diễn giải thành một học thuyết chi tiết hơn hay làm yếu ý nghĩa thành vai trò thuần túy chức năng.
- issue: Dạng số nhiều của οὐρανῶν
  choice: từ các tầng trời
  alternative: từ trời
  rationale: Bản văn Hy Lạp dùng số nhiều. Bản dịch chính bảo lưu đặc điểm ấy, còn chú thích cung cấp lối nói số ít quen thuộc trong tiếng Việt.
- issue: Ý nghĩa của ἐν ᾧ εὐδόκησα
  choice: Ta hài lòng về Con
  alternative: nơi Con, Ta vui lòng
  rationale: Cách dịch chính chuyển thành thành ngữ tiếng Việt tự nhiên nhưng không làm mất ý Đức Chúa Trời vui thích và chấp thuận Con. Cách dịch sát cấu trúc hơn được nêu trong chú thích để bảo lưu sắc thái nguyên văn.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại. “Và kìa” giữ sắc thái đánh dấu một biến cố đặc biệt; “phán” phù hợp với lời từ trời. Câu trích dẫn dùng cách xưng hô “Ta—Con” quen thuộc trong văn cảnh thần thượng, đồng thời tránh thuật ngữ giáo phái hoặc diễn giải thần học vượt quá bản văn.
