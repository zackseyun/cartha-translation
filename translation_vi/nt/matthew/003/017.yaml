- from: 'Và kìa, có một tiếng từ các tầng trời[a] phán rằng: “Đây là Con yêu dấu của Ta; Ta hài lòng về Con.[b]”'
  to: 'Và kìa, có một tiếng từ trời[a] phán rằng: “Đây là Con yêu dấu của Ta; Ta hài lòng về Con.[b]”'
  rationale: Thay “từ các tầng trời” bằng “từ trời” để dùng thành ngữ tiếng Việt hiện đại, tránh thêm ý về các tầng/lớp trời, đồng thời bảo lưu số nhiều nguyên ngữ trong chú thích. Dời ký hiệu b đến cuối mệnh đề mà chú thích giải thích. Không thay đổi ý nghĩa của lời phán.
