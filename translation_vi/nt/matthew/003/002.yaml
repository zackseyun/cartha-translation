  text: and saying[a], “Repent[b], for the kingdom of heaven has drawn near.”
translation:
  language: vi
  text: 'và nói: “Hãy ăn năn[a], vì Nước Trời[b] đã đến gần.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể diễn đạt: “Hãy thay đổi cách nghĩ và định hướng sống” hoặc “Hãy đổi hướng.” Động từ Hy Lạp này chỉ một sự thay đổi sâu xa trong cách nghĩ và định hướng sống, không chỉ là cảm giác ân hận.'
    reason: lexical_alternative
  - marker: b
    text: 'Sát nghĩa: “vương quốc của các trời.” Đây là cách nói đặc trưng của Ma-thi-ơ; “Nước Trời” không nhất thiết chỉ một nơi chốn mà có thể bao hàm cả sự cai trị của Đức Chúa Trời.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ λέγων
  choice: và nói
  rationale: Giữ liên kết với câu trước và diễn đạt tự nhiên cấu trúc phân từ λέγων trong tiếng Việt, không thêm sắc thái chuyên biệt như “rao giảng” hay “công bố”.
- source_word: Μετανοεῖτε
  choice: Hãy ăn năn
  rationale: Động từ mệnh lệnh số nhiều μετανοεῖτε kêu gọi một sự đổi hướng sâu xa trong lòng trí và đời sống. “Hãy ăn năn” là cách diễn đạt ngắn gọn, trang trọng và quen thuộc trong tiếng Việt; chú thích làm rõ rằng ý nghĩa không chỉ là cảm thấy ân hận.
- source_word: γὰρ
  choice: vì
  rationale: Nêu lý do cho lời kêu gọi ăn năn, đúng chức năng giải thích của γὰρ và tự nhiên trong tiếng Việt.
- source_word: ἤγγικεν
  choice: đã đến gần
  rationale: Thể hoàn thành của ἐγγίζω cho biết vương quốc đã tiến đến và hiện đang ở gần; “đã đến gần” giữ được sắc thái ấy.
- source_word: ἡ βασιλεία
  choice: vương quốc
  rationale: βασιλεία có thể chỉ cả quyền cai trị lẫn lĩnh vực cai trị. “Vương quốc” giữ hình ảnh vương quyền và không thu hẹp nghĩa chỉ còn một khái niệm trừu tượng.
- source_word: τῶν οὐρανῶν
  choice: thiên đàng
  rationale: Cụm Hy Lạp ở số nhiều, sát nghĩa là “của các tầng trời”, nhưng trong cách nói đặc trưng của Ma-thi-ơ, “thiên đàng” là lối diễn đạt tiếng Việt tự nhiên, trang trọng và dễ hiểu.
theological_decisions:
- issue: Ý nghĩa của “vương quốc thiên đàng”
  choice: Giữ nguyên cách nói “vương quốc thiên đàng” trong câu chính.
  alternative: “quyền cai trị của thiên đàng” hoặc “vương quốc của Đức Chúa Trời”
  rationale: Cách dịch này bảo tồn lối diễn đạt đặc trưng của Ma-thi-ơ và độ rộng nghĩa của βασιλεία, không tự ý đồng nhất hoàn toàn với một cách diễn giải thần học cụ thể.
- issue: Phạm vi của lời kêu gọi μετανοεῖτε
  choice: Dịch là “Hãy ăn năn” và giải thích độ rộng nghĩa trong chú thích.
  alternative: “Hãy thay đổi lòng trí” hoặc “Hãy đổi hướng”
  rationale: Ngữ cảnh lời rao báo của Giăng bao hàm sự thay đổi sâu xa về suy nghĩ, định hướng và đời sống. Chỉ dịch theo nghĩa cảm xúc là quá hẹp, còn “thay đổi cách suy nghĩ” trong câu chính dễ bị hiểu như một điều chỉnh ý kiến đơn thuần.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Câu giữ quan hệ nối tiếp với ngữ cảnh trước bằng “và nói”; lời công bố dùng nhịp ngắn, trực tiếp. Các thuật ngữ quen thuộc được giữ trong câu chính, còn những nét nghĩa dễ bị thu hẹp được trình bày trong chú thích.
