review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch phản ánh đúng cấu trúc cơ bản của câu: liên từ, lời nói kèm mệnh lệnh số nhiều, lý do γάρ, và sắc thái hoàn thành của ἤγγικεν. Tuy nhiên, “thiên đàng” trong tiếng Việt hiện đại thường chỉ cõi phước hạnh sau khi chết, nên không chuyển tải an toàn thành ngữ Ma-thi-ơ ἡ βασιλεία τῶν οὐρανῶν; cần dùng “Nước Trời” (hoặc “vương quốc của trời”).'
  naturalness: “Và nói” tự nhiên khi câu được đặt tiếp sau 3:1. “Hãy ăn năn” là lối dịch trang trọng, quen thuộc và phù hợp cho μετανοεῖτε; chú thích có thể nêu phạm vi rộng hơn mà không thay thế mệnh lệnh bằng một diễn giải hẹp. “Nước Trời” là cách dùng tự nhiên, chuẩn mực hơn “vương quốc thiên đàng.”
  terminology: Đổi “vương quốc thiên đàng” thành “Nước Trời.” Thuật ngữ này giữ được cách nói đặc trưng của Ma-thi-ơ, tránh nghĩa hậu thế của “thiên đàng,” và không áp đặt việc hiểu βασιλεία chỉ là lãnh thổ hay chỉ là quyền cai trị. Giữ “ăn năn”; thay “lòng trí” trong chú thích bằng “cách nghĩ và định hướng sống” để tự nhiên hơn.
  issues:
  - severity: medium
    issue: “Vương quốc thiên đàng” dùng “thiên đàng” cho τῶν οὐρανῶν.
    rationale: Trong tiếng Việt hiện đại, “thiên đàng” thường gợi nơi người công chính hưởng phước sau khi chết. Cụm của Ma-thi-ơ là thành ngữ “Nước Trời,” một lối nói thay cho Đức Chúa Trời, không nên bị thu hẹp hoặc chuyển hướng sang khái niệm hậu thế.
  - severity: low
    issue: Chú thích a dùng cụm “thay đổi lòng trí.”
    rationale: Cụm này không tự nhiên trong tiếng Việt hiện đại và có thể gợi một thuật ngữ nội tâm mơ hồ. “Thay đổi cách nghĩ và định hướng sống” truyền đạt tốt hơn phạm vi của μετανοέω mà vẫn không biến nó thành định nghĩa duy nhất.
  - severity: low
    issue: Chú thích b nói “các tầng trời.”
    rationale: Số nhiều của οὐρανοί có thể dịch sát là “các trời”; thêm “tầng” không có trong nguyên ngữ và dễ gợi một vũ trụ quan cụ thể không cần thiết.
