id: MAT.3.3
reference: Matthew 3:3
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οὗτος γάρ ἐστιν ὁ ῥηθεὶς ⸀διὰ Ἠσαΐου τοῦ προφήτου λέγοντος· Φωνὴ βοῶντος ἐν τῇ ἐρήμῳ· Ἑτοιμάσατε τὴν ὁδὸν κυρίου, εὐθείας ποιεῖτε τὰς τρίβους αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/003.yaml
  text: 'For this is the one spoken of through Isaiah the prophet[a], saying: “A voice of one crying in the wilderness: ‘Prepare the way of the Lord[b]; make his paths straight.’”'
translation:
  language: vi
  text: 'Vì đây chính là người đã được nói đến qua nhà tiên tri Ê-sai, rằng:


    “Có tiếng người kêu trong hoang địa:[a]

    ‘Hãy chuẩn bị con đường của Chúa;[b]

    hãy làm thẳng các lối của Ngài.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể ngắt câu: “Có tiếng người kêu: ‘Trong hoang địa, hãy chuẩn bị con đường của Chúa…’” Cách ngắt này phản ánh rõ hơn câu Hê-bơ-rơ trong Ê-sai 40:3.'
    reason: alternative_reading
  - marker: b
    text: Trong Ê-sai 40:3, câu Hê-bơ-rơ dùng danh riêng của Đức Chúa Trời là YHWH; vì vậy cũng có thể trình bày là “con đường của ĐỨC CHÚA”.
    reason: divine_name_background
lexical_decisions:
- source_word: οὗτος γάρ ἐστιν
  choice: Vì đây chính là người
  rationale: “Vì” thể hiện chức năng giải thích của γάρ; “đây chính là người” giữ sắc thái chỉ định của οὗτος và quy chiếu rõ đến Giăng trong văn cảnh.
- source_word: ὁ ῥηθεὶς διὰ Ἠσαΐου τοῦ προφήτου
  choice: đã được nói đến qua nhà tiên tri Ê-sai
  rationale: Giữ cấu trúc bị động của ὁ ῥηθεὶς và ý nghĩa trung gian của διά với sở hữu cách, đồng thời vẫn tự nhiên trong tiếng Việt.
- source_word: Φωνὴ βοῶντος
  choice: Có tiếng người kêu
  rationale: Diễn đạt tự nhiên cấu trúc danh từ kèm phân từ sở hữu cách, không thêm chủ thể cụ thể ngoài điều bản Hy Lạp cho biết.
- source_word: ἐν τῇ ἐρήμῳ
  choice: trong hoang địa
  rationale: “Hoang địa” phù hợp bối cảnh địa lý và văn phong tiên tri, đồng thời tránh giới hạn nghĩa vào một sa mạc toàn cát.
- source_word: Ἑτοιμάσατε τὴν ὁδὸν κυρίου
  choice: Hãy chuẩn bị con đường của Chúa
  rationale: Giữ mệnh lệnh trực tiếp, hình ảnh “con đường” và cách gọi κύριος trong bản Hy Lạp.
- source_word: εὐθείας ποιεῖτε τὰς τρίβους αὐτοῦ
  choice: hãy làm thẳng các lối của Ngài
  rationale: Bảo tồn ẩn dụ về việc làm thẳng đường và đại từ chỉ chính Chúa, với cách diễn đạt trang trọng, dễ hiểu.
theological_decisions:
- issue: Cách dịch κυρίου trong lời trích Ê-sai 40:3, nơi bản Hê-bơ-rơ dùng danh YHWH
  choice: Chúa
  alternative: ĐỨC CHÚA
  rationale: Bản Hy Lạp của Ma-thi-ơ có κυρίου, nên chính văn dịch là “Chúa”; chú thích cho biết nền tảng Hê-bơ-rơ dùng danh YHWH mà không che khuất mối liên hệ thần học này.
- issue: Vị trí của cụm “trong hoang địa”
  choice: Gắn với “tiếng người kêu” theo cú pháp tự nhiên của bản Hy Lạp Ma-thi-ơ
  alternative: 'Gắn với mệnh lệnh: “Trong hoang địa, hãy chuẩn bị con đường...”'
  rationale: Cách ngắt chính văn phản ánh cách đọc tự nhiên của câu Hy Lạp trong Ma-thi-ơ, còn chú thích bảo lưu cách ngắt có thể thấy rõ hơn trong văn cảnh Hê-bơ-rơ của Ê-sai 40:3.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “hoang địa” để giữ sắc thái Kinh Thánh mà vẫn thông dụng; viết hoa “Ngài” như một lựa chọn kính ngữ tiếng Việt, không nhằm giải quyết thêm bất kỳ điểm mơ hồ nào của nguyên văn.
