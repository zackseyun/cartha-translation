id: MAT.3.4
reference: Matthew 3:4
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: αὐτὸς δὲ ὁ Ἰωάννης εἶχεν τὸ ἔνδυμα αὐτοῦ ἀπὸ τριχῶν καμήλου καὶ ζώνην δερματίνην περὶ τὴν ὀσφὺν αὐτοῦ, ἡ δὲ τροφὴ ⸂ἦν αὐτοῦ⸃ ἀκρίδες καὶ μέλι ἄγριον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/004.yaml
  text: John himself wore clothing made of camel’s hair and a leather belt around his waist[c][b][a], and his food was locusts and wild honey.
translation:
  language: vi
  text: Chính Giăng mặc một chiếc áo bằng lông lạc đà và thắt một cái đai bằng da quanh eo[c][b][a]; thức ăn của ông là châu chấu và mật ong rừng.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Y phục của Giăng gợi nhớ diện mạo của tiên tri Ê-li trong 2 Các Vua 1:8; đây là bối cảnh quan trọng để hiểu cách Ma-thi-ơ trình bày về Giăng.
    reason: cross_reference
  - marker: b
    text: 'Hay: “y phục của ông bằng lông lạc đà.”'
    reason: lexical_alternative
  - marker: c
    text: 'Dịch sát hơn: “có áo làm bằng lông lạc đà.”'
    reason: previous_rendering
lexical_decisions:
- source_word: αὐτὸς δὲ ὁ Ἰωάννης
  choice: Chính Giăng
  rationale: αὐτός nhấn mạnh chính nhân vật Giăng. Không nhất thiết phải dịch δέ bằng một từ nối riêng trong tiếng Việt vì câu mô tả chuyển chủ đề tự nhiên theo văn mạch.
- source_word: εἶχεν τὸ ἔνδυμα αὐτοῦ
  choice: mặc áo
  rationale: εἶχεν có nghĩa đen là “có”, nhưng trong ngữ cảnh nói về y phục, “mặc áo” truyền đạt trạng thái thường xuyên một cách tự nhiên và tránh hàm ý rằng Giăng đặt người khác may áo.
- source_word: ἀπὸ τριχῶν καμήλου
  choice: làm bằng lông lạc đà
  rationale: ἀπό ở đây chỉ chất liệu; cách dịch này rõ ràng cho độc giả hiện đại và không xác định quá mức kiểu dệt hay cấu tạo của áo.
- source_word: ζώνην δερματίνην
  choice: đai da
  rationale: ζώνη là đai hoặc dây thắt lưng, còn δερματίνην nêu chất liệu bằng da. “Đai da” ngắn gọn, tự nhiên và phù hợp y phục cổ.
- source_word: περὶ τὴν ὀσφὺν αὐτοῦ
  choice: quanh eo
  rationale: ὀσφύς chỉ vùng eo hoặc thắt lưng. “Eo” là từ hiện đại, rõ nghĩa hơn cách nói cổ “hông/lưng” trong cấu trúc này.
- source_word: ἡ δὲ τροφὴ ἦν αὐτοῦ
  choice: thức ăn của ông là
  rationale: τροφὴ là thức ăn hoặc chất nuôi dưỡng. Cấu trúc này giữ sát mệnh đề danh từ của Hy Lạp mà vẫn tự nhiên trong tiếng Việt.
- source_word: ἀκρίδες
  choice: châu chấu
  rationale: Nghĩa từ vựng thông thường là loài côn trùng châu chấu; văn cảnh không có cơ sở để thay bằng tên một loại thực vật.
- source_word: μέλι ἄγριον
  choice: mật ong rừng
  rationale: ἄγριον mô tả mật ong lấy trong tự nhiên. “Mật ong rừng” là cách nói tiếng Việt tự nhiên, không hàm ý loại mật đã được nuôi hoặc sản xuất có kiểm soát.
theological_decisions:
- issue: Hình ảnh khổ hạnh và sự gợi nhớ đến tiên tri Ê-li
  choice: Dịch thẳng phần mô tả y phục và thức ăn, chỉ nêu mối liên hệ với Ê-li trong chú thích.
  alternative: Đưa trực tiếp sự so sánh Giăng với Ê-li vào chính văn.
  rationale: Bản văn mô tả Giăng mà không gọi đích danh Ê-li. Cách dịch này giữ nguyên sự gợi liên văn với 2 Các Vua 1:8 nhưng không biến một hàm ý văn chương thành lời giải thích minh nhiên.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Giăng” theo dạng tên Kinh Thánh quen thuộc trong tiếng Việt; “ông” giữ giọng kể tôn trọng nhưng không cổ hóa. Dấu chấm phẩy phân tách tự nhiên hai nét mô tả về y phục và thức ăn.
