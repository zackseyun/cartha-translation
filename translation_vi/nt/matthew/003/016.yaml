id: MAT.3.16
reference: Matthew 3:16
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸂βαπτισθεὶς δὲ⸃ ὁ Ἰησοῦς ⸂εὐθὺς ἀνέβη⸃ ἀπὸ τοῦ ὕδατος· καὶ ἰδοὺ ⸀ἠνεῴχθησαν οἱ οὐρανοί, καὶ εἶδεν ⸀πνεῦμα θεοῦ καταβαῖνον ὡσεὶ ⸀περιστερὰν ἐρχόμενον ἐπ’ αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/016.yaml
  text: And when Jesus was baptized[a], he immediately came up from the water. And behold, the heavens were opened[c][b], and he saw the Spirit of God descending like a dove and coming upon him.
translation:
  language: vi
  text: Sau khi Đức Giê-su chịu phép báp-têm, Người lập tức lên khỏi nước. Kìa, các tầng trời mở ra, và Người thấy Thần Khí của Đức Chúa Trời ngự xuống tựa như chim bồ câu và đến trên Người.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Đến trên Người” cũng có thể dịch là “đến trên ngài”. Động từ Hy Lạp có nghĩa là “đến”, không nói cụ thể là “đậu xuống”.
    reason: lexical_alternative
lexical_decisions:
- source_word: βαπτισθεὶς δὲ ὁ Ἰησοῦς
  choice: Sau khi chịu phép báp-têm, Đức Giê-su
  rationale: Phân từ bất định thụ động diễn tả hành động xảy ra trước động từ chính; tiếng Việt có thể lược chủ ngữ lặp lại mà vẫn rõ Đức Giê-su là người chịu phép báp-têm.
- source_word: εὐθὺς ἀνέβη ἀπὸ τοῦ ὕδατος
  choice: lập tức lên khỏi nước
  rationale: Giữ sắc thái nhanh chóng của εὐθύς và chuyển ἀπό bằng cách nói tự nhiên trong tiếng Việt; cụm này không tự nó xác định phương thức báp-têm.
- source_word: ἰδοὺ
  choice: Kìa
  rationale: Giữ chức năng thu hút sự chú ý và sắc thái sống động của lời kể.
- source_word: ἠνεῴχθησαν οἱ οὐρανοί
  choice: các tầng trời mở ra
  rationale: Giữ dạng số nhiều của οἱ οὐρανοί bằng thành ngữ Việt trang trọng, đồng thời diễn đạt tự nhiên biến cố được thuật lại.
- source_word: πνεῦμα θεοῦ
  choice: Thần Khí của Đức Chúa Trời
  rationale: Giữ nguyên cấu trúc sở thuộc và cách gọi của bản Hy Lạp, không thay bằng danh xưng diễn giải hơn là “Đức Thánh Linh”.
- source_word: καταβαῖνον ὡσεὶ περιστερὰν
  choice: ngự xuống tựa như chim bồ câu
  rationale: “Tựa như” bảo toàn ý so sánh của ὡσεὶ, không đồng nhất Thần Khí với một con chim bồ câu theo nghĩa đen; “ngự xuống” phù hợp văn phong tôn nghiêm.
- source_word: ἐρχόμενον ἐπ’ αὐτόν
  choice: đến trên mình
  rationale: Dịch sát chuyển động của ἔρχομαι với ἐπί và tránh thêm ý chuyên biệt “đậu xuống”; “mình” quy chiếu tự nhiên về Đức Giê-su trong câu.
theological_decisions:
- issue: πνεῦμα θεοῦ là cách nói chung hay chỉ Đức Thánh Linh
  choice: Thần Khí của Đức Chúa Trời
  alternative: Đức Thánh Linh; một thần khí từ Đức Chúa Trời
  rationale: Ngữ cảnh phép báp-têm cho thấy đây là Thần Khí của Đức Chúa Trời, nhưng bản dịch giữ đúng cách diễn đạt của câu Hy Lạp thay vì thay bằng danh xưng giải thích rõ hơn.
- issue: ὡσεὶ περιστερὰν nói về sự tương tự hay đồng nhất Thần Khí với chim bồ câu
  choice: tựa như chim bồ câu
  alternative: như một con chim bồ câu
  rationale: Tiểu từ so sánh ὡσεὶ chỉ sự tương tự; bản dịch không khẳng định Thần Khí theo nghĩa đen là chim bồ câu.
- issue: ἐρχόμενον ἐπ’ αὐτόν có nên được hiểu chuyên biệt là “đậu trên ngài” hay không
  choice: đến trên mình
  alternative: đậu trên ngài
  rationale: Động từ Hy Lạp có nghĩa cơ bản là “đến”; “đậu” tạo hình ảnh cụ thể hơn mức bản văn nêu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Giê-su”, “Đức Chúa Trời” và “Thần Khí” nhất quán; giữ lời gọi chú ý “Kìa” và hình ảnh “các tầng trời” mà không giải thích thêm trong chính văn.
