  verdict: revise
  source_fidelity: Bản dịch nhìn chung phản ánh đúng trình tự, tính thụ động của βαπτισθείς, tính tức thời của εὐθύς, số nhiều của οἱ οὐρανοί, và ý so sánh của ὡσεὶ. Tuy nhiên, “đến trên mình” không tự nhiên trong tiếng Việt hiện đại và dễ tạo cảm giác phản thân/thân thể không cần thiết; ἐπ’ αὐτόν được diễn đạt rõ và tự nhiên hơn là “đến trên Người.”
  naturalness: “Sau khi chịu phép báp-têm” có thể hiểu được, nhưng việc nêu rõ chủ ngữ ngay trong mệnh đề đầu giúp câu tiếng Việt mạch lạc hơn. “Đến trên Người” tự nhiên và rõ nghĩa hơn nhiều so với “đến trên mình.”
  terminology: Giữ “Đức Giê-su,” “Đức Chúa Trời,” và “Thần Khí” nhất quán với bản thảo. “Các tầng trời” bảo toàn số nhiều của tiếng Hy Lạp; “tựa như chim bồ câu” bảo toàn ý so sánh, không đồng nhất Thần Khí với chim bồ câu.
