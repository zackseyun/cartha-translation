  to: Sau khi Đức Giê-su chịu phép báp-têm, Người lập tức lên khỏi nước. Kìa, các tầng trời mở ra, và Người thấy Thần Khí của Đức Chúa Trời ngự xuống tựa như chim bồ câu và đến trên Người.[a]
