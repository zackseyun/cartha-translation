    rationale: Trong văn xuôi tiếng Việt hiện đại, “mình” thường có sắc thái phản thân hoặc thân mật và không phải cách tự nhiên để chỉ Đức Giê-su trong ngữ cảnh này. “Đến trên Người” diễn đạt ἐρχόμενον ἐπ’ αὐτόν rõ ràng, đồng thời không thêm ý “đậu xuống.”
  - severity: low
