source:
  edition: SBLGNT
  text: ὁ δὲ ⸀Ἰωάννης διεκώλυεν αὐτὸν λέγων· Ἐγὼ χρείαν ἔχω ὑπὸ σοῦ βαπτισθῆναι, καὶ σὺ ἔρχῃ πρός με;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/014.yaml
  text: But John kept trying to prevent him[a], saying, “I need to be baptized by you, and do you come to me?”
translation:
  language: vi
  text: 'Nhưng Giăng cứ cố ngăn Người[a], nói: “Tôi cần được Ngài báp-têm, còn Ngài lại đến với tôi sao?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Giăng tìm cách ngăn Người.” Động từ Hy Lạp ở thì chưa hoàn thành có thể diễn tả hành động kéo dài hoặc lặp lại.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διεκώλυεν
  choice: cứ ngăn cản
  rationale: Thì chưa hoàn thành diễn tả hành động đang tiếp diễn hoặc được cố sức duy trì; “cứ ngăn cản” truyền đạt sắc thái ấy tự nhiên trong tiếng Việt, mà không khẳng định rằng Giăng đã ngăn được Chúa Giê-su.
- source_word: λέγων
  choice: và nói
  rationale: Phân từ hiện tại gắn lời nói với hành động ngăn cản. Trong tiếng Việt, “và nói” tự nhiên hơn “nói rằng” mà vẫn giữ quan hệ đồng thời.
- source_word: χρείαν ἔχω
  choice: tôi mới cần
  rationale: Thành ngữ có nghĩa là “tôi cần.” Từ “mới” làm rõ sự tương phản được hàm ý giữa Giăng và Chúa Giê-su mà không thêm một lý do thần học.
- source_word: ὑπὸ σοῦ βαπτισθῆναι
  choice: được Ngài làm phép báp-têm
  rationale: Cấu trúc bị động với ὑπό + sở hữu cách chỉ tác nhân cá nhân. Cách dịch này giữ rõ Chúa Giê-su là người thực hiện phép báp-têm, đồng thời dùng thuật ngữ Kinh Thánh quen thuộc mà không quy định phương thức.
- source_word: καὶ σὺ ἔρχῃ πρός με;
  choice: thế mà Ngài lại đến với tôi sao?
  rationale: Câu hỏi tu từ nhấn mạnh sự đảo ngược gây kinh ngạc. “Thế mà… lại… sao?” diễn đạt tự nhiên lực tương phản của καί trong ngữ cảnh, dù các từ nối này không cần được hiểu là những từ riêng biệt có mặt trong nguyên văn.
- source_word: δὲ
  choice: Nhưng
  rationale: Tiểu từ đánh dấu sự tương phản giữa việc Chúa Giê-su đến chịu báp-têm và phản ứng ngăn cản của Giăng.
theological_decisions:
- issue: Lời phản đối của Giăng khi làm phép báp-têm cho Chúa Giê-su
  choice: Dịch trực tiếp rằng Giăng cần được Chúa Giê-su làm phép báp-têm, qua đó giữ nguyên sự nhìn nhận về địa vị vượt trội của Chúa Giê-su.
  alternative: Giải thích rõ lời này chủ yếu dựa trên sự vô tội của Chúa Giê-su hoặc chỉ dựa trên cấp bậc và thẩm quyền.
  rationale: Câu này không nêu đầy đủ căn cứ thần học cho lời phản đối. Bản dịch không nên đưa một cách giải thích riêng vào chính văn.
- issue: Cách xưng hô giữa Giăng và Chúa Giê-su
  choice: Dùng “tôi” và “Ngài”.
  alternative: Dùng “tôi” và “ông”, hoặc viết hoa mọi đại từ chỉ Chúa Giê-su.
  rationale: “Ngài” thể hiện sự kính trọng và phù hợp với nhận thức của Giăng về địa vị Chúa Giê-su, nhưng không tự nó giải quyết bản tính hay nền tảng thần học của sự vượt trội ấy. “Người” trong lời dẫn là cách gọi trang trọng, dễ hiểu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Giăng” và “phép báp-têm” theo cách dùng Kinh Thánh Tin Lành quen thuộc; cách diễn đạt không xác định phương thức cử hành. Dấu [a] được đặt ngay sau cụm từ mà chú thích giải thích.
