revisions:
- from: Và lưỡi rìu đã được đặt sẵn sát gốc các cây[a]. Vì thế, bất cứ cây nào không sinh trái tốt đều bị đốn hạ và ném vào lửa.
  to: Và rìu đã được đặt sẵn ngay gốc các cây[a]. Vì thế, bất cứ cây nào không sinh trái tốt đều bị đốn hạ và ném vào lửa.
  rationale: Đổi “lưỡi rìu” thành “rìu” để dịch đầy đủ ἀξίνη. Đổi “sát gốc” thành “ngay gốc” để diễn đạt tự nhiên quan hệ vị trí của πρὸς τὴν ῥίζαν mà không tăng cường sắc thái “áp sát.” Các thành phần còn lại giữ nguyên vì phản ánh trung thành bản văn Hy Lạp và dùng tiếng Việt hiện đại tự nhiên.
