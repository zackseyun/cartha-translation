id: MAT.3.10
reference: Matthew 3:10
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἤδη ⸀δὲ ἡ ἀξίνη πρὸς τὴν ῥίζαν τῶν δένδρων κεῖται· πᾶν οὖν δένδρον μὴ ποιοῦν καρπὸν καλὸν ἐκκόπτεται καὶ εἰς πῦρ βάλλεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/010.yaml
  text: And already the axe is laid at the root of the trees[a]. Therefore every tree not producing good fruit is cut down and thrown into the fire.
translation:
  language: vi
  text: Và rìu đã được đặt sẵn ngay gốc các cây[a]. Vì thế, bất cứ cây nào không sinh trái tốt đều bị đốn hạ và ném vào lửa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “đã nằm sẵn ngay gốc các cây.”'
    reason: κέῖται có thể diễn tả trạng thái “được đặt” hoặc “nằm/ở” tại một vị trí; cả hai cách đều giữ hình ảnh chiếc rìu đã sẵn sàng.
lexical_decisions:
- source_word: ἤδη
  choice: đã ... sẵn
  rationale: Diễn đạt việc chiếc rìu đã ở vị trí sẵn sàng ngay từ lúc này, giữ sắc thái cấp bách của ἤδη mà vẫn tự nhiên trong tiếng Việt.
- source_word: δὲ
  choice: Và
  rationale: Ở đây δέ nối tiếp lời cảnh báo trước đó chứ không biểu thị sự tương phản mạnh; “Và” giữ được mạch văn.
- source_word: ἡ ἀξίνη
  choice: lưỡi rìu
  rationale: “Lưỡi rìu” là cách gọi tự nhiên trong tiếng Việt và làm rõ hình ảnh dụng cụ đang kề sát gốc để chặt cây.
- source_word: πρὸς τὴν ῥίζαν τῶν δένδρων κεῖται
  choice: được đặt sẵn sát gốc các cây
  rationale: Giữ hình ảnh chiếc rìu đã được bố trí ngay sát gốc, sẵn sàng được sử dụng. Cách dịch bị động phản ánh nghĩa “được đặt/nằm đó” của κεῖται; phương án sát chữ hơn được ghi ở chú thích.
- source_word: πᾶν οὖν δένδρον
  choice: Vì thế, bất cứ cây nào
  rationale: “Vì thế” thể hiện quan hệ suy luận của οὖν; “bất cứ cây nào” truyền đạt lực phân phối của πᾶν với danh từ số ít một cách tự nhiên.
- source_word: μὴ ποιοῦν καρπὸν καλὸν
  choice: không sinh trái tốt
  rationale: “Sinh trái” là cách nói tự nhiên về cây cối, còn “trái tốt” giữ nguyên phẩm chất καλόν mà không diễn giải thêm ý nghĩa đạo đức của ẩn dụ.
- source_word: ἐκκόπτεται
  choice: bị đốn hạ
  rationale: Trong hình ảnh cây cối, “đốn hạ” diễn đạt rõ hành động chặt cho cây ngã và giữ thể bị động của động từ Hy Lạp.
- source_word: εἰς πῦρ βάλλεται
  choice: bị ... ném vào lửa
  rationale: Cách diễn đạt hiện đại, rõ ràng, giữ lực của βάλλεται và không xác định thêm bản chất của “lửa”.
theological_decisions:
- issue: Bản chất của hình ảnh lửa
  choice: Giữ nguyên là “lửa”, không diễn giải mở rộng.
  alternative: Sự phán xét chung cuộc; sự phán xét trong lịch sử; lửa địa ngục.
  rationale: Câu này rõ ràng dùng hình ảnh phán xét nhưng không tự xác định cụ thể bản chất hay thời điểm của lửa; giữ nguyên ẩn dụ tránh thu hẹp ý nghĩa theo một lập trường giáo lý.
- issue: Tính cấp bách của sự phán xét
  choice: Dùng “đã ... sẵn” để cho thấy rìu hiện đã ở vị trí chuẩn bị hành động.
  alternative: Chỉ dịch “rìu ở sát gốc”, làm nhẹ sắc thái thời gian của ἤδη.
  rationale: Bản văn nhấn mạnh rằng sự phán xét không chỉ xa xôi mà đã cận kề, song không nói rõ chính xác khi nào hành động chặt cây sẽ xảy ra.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. “Đốn hạ” phù hợp với hình ảnh cây cối; cấu trúc “bất cứ cây nào ... đều” tự nhiên và giữ được ý nghĩa phân phối của câu Hy Lạp.
