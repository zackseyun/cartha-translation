revisions:
- from: 'Nhưng Đức Giê-su đáp lời ông: “Bây giờ cứ làm như vậy đi, vì chúng ta nên làm thế để làm trọn mọi sự công chính[a].” Bấy giờ ông Giăng thuận theo Ngài.'
  to: 'Nhưng Đức Giê-su đáp lời ông: “Bây giờ cứ để như vậy, vì như vậy là điều thích hợp cho chúng ta làm trọn mọi điều công chính[a].” Bấy giờ ông Giăng chấp thuận.'
  rationale: Sửa hai động từ ἀφίημι để phản ánh nhất quán nghĩa “cho phép/để cho” trong cả lời Đức Giê-su và hành động đáp lại của Giăng. Điều chỉnh cụm δικαιοσύνη cho tự nhiên hơn trong tiếng Việt, đồng thời duy trì sự rộng nghĩa và chú thích về phương án “công lý.”
  reviewer_model: gpt-5.6-terra
