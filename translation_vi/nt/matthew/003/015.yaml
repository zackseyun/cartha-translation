  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν ⸂πρὸς αὐτόν⸃· Ἄφες ἄρτι, οὕτως γὰρ πρέπον ἐστὶν ἡμῖν πληρῶσαι πᾶσαν δικαιοσύνην. τότε ἀφίησιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/015.yaml
  text: But Jesus answered him[a], “Permit it for now, for in this way it is fitting for us to fulfill all righteousness.” Then he permitted him.
translation:
  language: vi
  text: 'Nhưng Đức Giê-su đáp lời ông: “Bây giờ cứ để như vậy, vì như vậy là điều thích hợp cho chúng ta làm trọn mọi điều công chính[a].” Bấy giờ ông Giăng chấp thuận.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “mọi điều công lý.” Từ Hy Lạp có thể chỉ sự công chính hoặc công lý; ở đây “công chính” phù hợp hơn với sự nhấn mạnh của Ma-thi-ơ về việc làm theo ý muốn của Đức Chúa Trời.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν πρὸς αὐτόν
  choice: Nhưng Đức Giê-su đáp lời ông
  rationale: Cụm ἀποκριθεὶς ... εἶπεν là lối nói có nghĩa tự nhiên là “đáp lời”; δέ biểu thị sự tương phản với lời ngăn cản của Giăng ở câu trước. “Ông” giữ đại từ của nguyên văn mà không lặp tên không cần thiết.
- source_word: Ἄφες ἄρτι
  choice: Bây giờ cứ làm như vậy đi
  rationale: ἀφίημι tại đây có nghĩa cho phép hoặc để việc đang nói đến diễn ra, không phải “tha thứ”; ἄρτι nhấn mạnh thời điểm hiện tại. Cách diễn đạt này tự nhiên trong tiếng Việt và ngầm chỉ việc Giăng làm phép báp-têm cho Đức Giê-su theo văn cảnh.
- source_word: οὕτως γὰρ πρέπον ἐστὶν ἡμῖν
  choice: vì chúng ta nên làm thế
  rationale: οὕτως chỉ cách thức vừa được nói đến, còn πρέπον diễn tả điều thích hợp hoặc phải lẽ. “Nên” giữ sắc thái thích đáng về mặt đạo đức và hoàn cảnh, không biến câu thành một mệnh lệnh luật pháp tuyệt đối.
- source_word: πληρῶσαι
  choice: làm trọn
  rationale: πληρόω thường mang âm hưởng “làm ứng nghiệm/làm trọn” trong Ma-thi-ơ. Ở đây “làm trọn” vừa tự nhiên vừa giữ liên hệ với việc hoàn tất ý định của Đức Chúa Trời.
- source_word: πᾶσαν δικαιοσύνην
  choice: mọi sự công chính
  rationale: δικαιοσύνη ở đây chỉ rộng đến điều phù hợp với ý muốn công chính của Đức Chúa Trời. “Sự công chính” giữ độ rộng và tính thần học của danh từ Hy Lạp, thay vì thu hẹp thành việc tuân giữ luật lệ hay chỉ riêng công lý xã hội.
- source_word: τότε ἀφίησιν αὐτόν
  choice: Bấy giờ ông Giăng thuận theo Ngài
  rationale: ἀφίησιν là hiện tại lịch sử nhưng được dịch theo thì kể chuyện tự nhiên. Trong văn cảnh, câu này có nghĩa Giăng thôi phản đối và chấp thuận làm phép báp-têm cho Đức Giê-su; nêu tên Giăng làm rõ sự chuyển đổi chủ thể vốn dễ gây mơ hồ trong tiếng Việt.
theological_decisions:
- issue: Ý nghĩa của “mọi sự công chính”
  choice: Giữ cách nói rộng, chỉ việc làm trọn điều phù hợp với ý muốn công chính của Đức Chúa Trời trong hoàn cảnh này, cụ thể là Đức Giê-su nhận phép báp-têm từ Giăng.
  alternative: Hiểu hẹp là hoàn tất mọi đòi hỏi của luật pháp, hoặc dịch δικαιοσύνη chủ yếu là “công lý”.
  rationale: Nguyên văn không giải thích thành một hệ thống giáo lý hay chỉ giới hạn vào luật pháp. Cách dịch giữ nguyên sức căng và độ rộng của δικαιοσύνη trong thần học Ma-thi-ơ, đồng thời để văn cảnh xác định hành động cụ thể.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Cứ làm như vậy đi” là lời cho phép tự nhiên trong tiếng Việt; “làm trọn mọi sự công chính” giữ sắc thái Kinh Thánh và chiều rộng thần học của nguyên văn. Dấu chú thích [a] được đặt ngay sau cụm từ mà chú thích giải nghĩa.
