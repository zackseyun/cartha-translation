  text: Ἐν δὲ ταῖς ἡμέραις ἐκείναις παραγίνεται Ἰωάννης ὁ βαπτιστὴς κηρύσσων ἐν τῇ ἐρήμῳ τῆς Ἰουδαίας
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/001.yaml
  text: In those days John the Baptist came[a], preaching in the wilderness of Judea[b],
translation:
  language: vi
  text: Trong những ngày ấy, Giăng, người làm phép báp-têm[a], xuất hiện và rao giảng trong vùng hoang vắng của xứ Giu-đê.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “Giăng, người làm phép rửa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν δὲ ταῖς ἡμέραις ἐκείναις
  choice: Trong những ngày ấy
  rationale: Diễn đạt tự nhiên cụm chỉ thời gian; δέ là liên từ chuyển ý nhẹ nên không cần thêm một từ nối riêng trong tiếng Việt.
- source_word: παραγίνεται
  choice: xuất hiện
  rationale: Hiện tại lịch sử giới thiệu Giăng bước vào câu chuyện. “Xuất hiện” tự nhiên trong văn kể và không nhất thiết hàm ý một sự hiện ra siêu nhiên.
- source_word: Ἰωάννης ὁ βαπτιστὴς
  choice: Giăng, người làm phép báp-têm
  rationale: Dùng dạng tên quen thuộc trong Kinh Thánh tiếng Việt; cụm giải thích chuyển tải chức năng của βαπτιστής mà không biến nó thành tên của một hệ phái về sau.
- source_word: κηρύσσων
  choice: rao giảng
  rationale: Diễn đạt hành động công bố công khai diễn ra đồng thời với động từ chính.
- source_word: ἐν τῇ ἐρήμῳ τῆς Ἰουδαίας
  choice: trong hoang mạc miền Giu-đê
  rationale: “Hoang mạc” chỉ vùng hoang vắng, ít người ở, không bó hẹp vào sa mạc cát; “miền Giu-đê” xác định khu vực địa lý.
theological_decisions:
- issue: Cách dịch danh xưng βαπτιστής của Giăng
  choice: người làm phép báp-têm
  alternative: Giăng Báp-tít; người làm phép rửa
  rationale: Chọn cách diễn đạt chức năng của danh xưng Hy Lạp, tránh để độc giả hiện đại hiểu “Báp-tít” như tên hệ phái. Chú thích giữ phương án “người làm phép rửa,” vốn rõ nghĩa hơn nhưng ít quen thuộc hơn trong một số truyền thống tiếng Việt.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ nhịp kể ngắn gọn; không cố tái hiện hiện tại lịch sử của tiếng Hy Lạp bằng thì hiện tại tiếng Việt, nhưng dùng “xuất hiện” để đánh dấu nhân vật bước vào trình thuật.
