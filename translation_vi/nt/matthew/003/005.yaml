    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Bấy giờ
  rationale: Dùng như một dấu nối thời gian, liên kết phản ứng của dân chúng với chức vụ của Giăng trong phần trước.
- source_word: ἐξεπορεύετο
  choice: đều kéo đến
  rationale: Động từ ở thì chưa hoàn thành diễn tả hành động đang tiếp diễn hoặc lặp lại. “Kéo đến” tự nhiên trong tiếng Việt và gợi một dòng người đông đảo tìm đến.
- source_word: πρὸς αὐτόν
  choice: đến với ông
  rationale: πρός với đối cách sau động từ chuyển động chỉ hướng về một người; “đến với ông” diễn đạt tự nhiên và quy chiếu về Giăng.
- source_word: Ἱεροσόλυμα
  choice: dân thành Giê-ru-sa-lem
  rationale: Nguyên văn dùng địa danh theo phép hoán dụ để chỉ cư dân. Thêm “dân thành” làm rõ chủ thể là con người mà không thay đổi ý nghĩa.
- source_word: πᾶσα ἡ Ἰουδαία
  choice: cả miền Giu-đê
  rationale: Giữ phạm vi địa lý rộng của πᾶσα và cách gọi vùng đất, đồng thời để phép hoán dụ chỉ cư dân đứng nguyên trong mạch câu.
- source_word: πᾶσα ἡ περίχωρος τοῦ Ἰορδάνου
  choice: toàn vùng quanh sông Giô-đanh
  rationale: περίχωρος chỉ khu vực bao quanh; cách dịch này rõ ràng, tự nhiên và giữ nguyên tham chiếu địa lý đến sông Giô-đanh.
- source_word: καὶ ... καὶ
  choice: '..., ... và ...'
  rationale: Tiếng Việt tự nhiên dùng dấu phẩy và “và” để phối hợp ba khu vực theo cấu trúc liệt kê tích lũy.
theological_decisions:
- issue: Phạm vi của các cách nói địa lý bao quát
  choice: Giữ “cả miền” và “toàn vùng” như những cách nói rộng về sự hưởng ứng đông đảo
  alternative: Diễn giải thành “người từ nhiều nơi trong miền Giu-đê và vùng quanh sông Giô-đanh”
  rationale: Các cách nói bao quát trong câu mô tả quy mô rộng lớn của sự hưởng ứng đối với Giăng, không nhất thiết khẳng định từng cá nhân đều đến. Bản dịch giữ sức mạnh tu từ của nguyên văn và giải thích bằng chú thích thay vì thu hẹp ngay trong câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Kéo đến” truyền đạt tự nhiên hình ảnh nhiều người liên tục tìm đến Giăng; các địa danh dùng dạng phiên âm quen thuộc trong tiếng Việt.
