id: MAT.3.7
reference: Matthew 3:7
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἰδὼν δὲ πολλοὺς τῶν Φαρισαίων καὶ Σαδδουκαίων ἐρχομένους ἐπὶ τὸ βάπτισμα ⸀αὐτοῦ εἶπεν αὐτοῖς· Γεννήματα ἐχιδνῶν, τίς ὑπέδειξεν ὑμῖν φυγεῖν ἀπὸ τῆς μελλούσης ὀργῆς;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/007.yaml
  text: But when he saw many of the Pharisees and Sadducees coming for his baptism[a], he said to them, “Offspring of vipers[b], who warned you to flee from the coming wrath?”
translation:
  language: vi
  text: 'Nhưng khi thấy nhiều người trong giới Pha-ri-si và Sa-đu-sê đến với phép báp-têm của ông[a], ông nói với họ: “Nòi rắn độc[b] kia! Ai đã cảnh báo các người phải chạy trốn cơn thịnh nộ sắp đến[c]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Một số bản chép không có cụm “của ông”.
    reason: textual_variant
  - marker: b
    text: 'Cũng có thể dịch: “Bầy rắn độc”.'
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể dịch: “cơn thịnh nộ sẽ đến”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰδὼν δὲ
  choice: Nhưng khi thấy
  rationale: Chuyển phân từ bất định quá khứ thành mệnh đề thời gian tự nhiên trong tiếng Việt; “nhưng” giữ sắc thái chuyển ý nhẹ của δέ.
- source_word: πολλοὺς τῶν Φαρισαίων καὶ Σαδδουκαίων
  choice: nhiều người trong giới Pha-ri-si và Sa-đu-sê
  rationale: 'Diễn đạt cấu trúc bộ phận: nhiều người thuộc hai nhóm ấy, không hàm ý toàn thể mọi người Pha-ri-si và Sa-đu-sê.'
- source_word: ἐρχομένους ἐπὶ τὸ βάπτισμα αὐτοῦ
  choice: đến với phép báp-têm của ông
  rationale: Giữ ý họ tiến đến hoạt động báp-têm của Giăng mà không khẳng định thêm rằng họ thực sự đã chịu báp-têm.
- source_word: Γεννήματα ἐχιδνῶν
  choice: Nòi rắn lục
  rationale: “Nòi” diễn đạt những kẻ được sinh ra hay sản sinh từ; “rắn lục” truyền đạt hình ảnh loài rắn độc của ἐχίδνα bằng cách nói ngắn gọn, mạnh và tự nhiên.
- source_word: τίς ὑπέδειξεν ὑμῖν
  choice: Ai đã cảnh báo các người
  rationale: Trong ngữ cảnh chạy trốn cơn thịnh nộ, ὑποδείκνυμι mang sắc thái cảnh báo hơn là chỉ đơn thuần chỉ cho biết.
- source_word: φυγεῖν ἀπὸ
  choice: phải chạy trốn
  rationale: “Chạy trốn” giữ hình ảnh khẩn cấp của φυγεῖν; “phải” làm rõ quan hệ bổ túc với động từ cảnh báo mà không thay đổi nội dung.
- source_word: τῆς μελλούσης ὀργῆς
  choice: cơn thịnh nộ sắp đến
  rationale: “Thịnh nộ” giữ sức nặng thần học của ὀργή, còn “sắp đến” phản ánh lực hướng tới tương lai của μελλούσης.
theological_decisions:
- issue: Phạm vi những người bị quở trách
  choice: Giăng nói với nhiều người thuộc hai giới Pha-ri-si và Sa-đu-sê đang đến với phép báp-têm của ông.
  alternative: Hiểu lời này là lời mô tả không phân biệt về toàn thể mọi người Pha-ri-si và Sa-đu-sê.
  rationale: Cấu trúc bộ phận πολλοὺς τῶν chỉ một số đông thuộc các nhóm này; bản dịch tránh khái quát vượt quá câu Hy Lạp.
- issue: Sắc thái cánh chung của ὀργή
  choice: cơn thịnh nộ
  alternative: sự phán xét; hình phạt
  rationale: “Cơn thịnh nộ” bảo toàn ngôn ngữ trực tiếp và sức nặng thần học của nguyên văn, không giải nghĩa nó thành một hệ quả cụ thể hơn.
- issue: Ý định của những người đang đến
  choice: đến với phép báp-têm
  alternative: đến để chịu phép báp-têm
  rationale: Nguyên văn nói họ đang đến với hay hướng đến phép báp-têm, nhưng câu này không nói rõ họ đã nhận hoặc chắc chắn định nhận phép ấy; bản dịch giữ độ mở này.
translation_notes:
  register: Văn phong hiện đại, trang trọng và trực diện. Giữ các tên nhóm quen dùng “Pha-ri-si”, “Sa-đu-sê” và thuật ngữ phổ thông “phép báp-têm”. Đại từ “các người” truyền tải lời quở trách gay gắt mà không dùng cách xưng hô thô tục; dấu chấm than sau lời gọi làm rõ lực tu từ của câu Hy Lạp.
