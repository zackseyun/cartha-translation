id: MAT.3.12
reference: Matthew 3:12
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οὗ τὸ πτύον ἐν τῇ χειρὶ αὐτοῦ, καὶ διακαθαριεῖ τὴν ἅλωνα αὐτοῦ καὶ συνάξει τὸν σῖτον αὐτοῦ εἰς τὴν ⸀ἀποθήκην, τὸ δὲ ἄχυρον κατακαύσει πυρὶ ἀσβέστῳ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/012.yaml
  text: His winnowing fork is in his hand[a], and he will thoroughly clear his threshing floor and gather his wheat into the storehouse[b], but the chaff he will burn up with unquenchable fire.
translation:
  language: vi
  text: Người cầm nia sảy trong tay; người sẽ dọn sạch sân đập lúa của mình, thu lúa mì vào kho[b], còn trấu thì người sẽ thiêu rụi trong lửa không thể dập tắt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Hay “kho lúa”.
    reason: lexical_alternative
lexical_decisions:
- source_word: πτύον
  choice: nia sảy
  rationale: Chỉ dụng cụ dùng để tung và sảy ngũ cốc, tách hạt khỏi trấu. “Nia sảy” tự nhiên và dễ hình dung trong tiếng Việt, dù hình dạng chính xác của dụng cụ cổ có thể là xẻng hoặc chĩa sảy.
- source_word: διακαθαριεῖ
  choice: sẽ dọn sạch
  rationale: 'Giữ sắc thái tăng cường của động từ: làm sạch hoàn toàn sân đập lúa, đồng thời phù hợp tự nhiên với hình ảnh nông nghiệp.'
- source_word: ἅλωνα
  choice: sân đập lúa
  rationale: Diễn đạt nơi lúa được đập và sảy; chính xác về bối cảnh nông nghiệp và dễ hiểu trong tiếng Việt hiện đại.
- source_word: σῖτον
  choice: lúa mì
  rationale: Trong thế đối lập với trấu ở hình ảnh sảy lúa, “lúa mì” là cách dịch cụ thể, tự nhiên; từ Hy Lạp cũng có thể chỉ ngũ cốc nói chung.
- source_word: ἀποθήκην
  choice: kho
  rationale: Từ Hy Lạp chỉ nơi chứa hàng hoặc ngũ cốc nói chung. “Kho” ngắn gọn, rộng nghĩa và không áp đặt một kiểu kiến trúc cụ thể.
- source_word: ἄχυρον
  choice: trấu
  rationale: Trong ngữ cảnh sảy lúa, từ này chỉ phần nhẹ, vô dụng bị tách khỏi hạt; “trấu” truyền đạt rõ hình ảnh ấy hơn “rơm”.
- source_word: κατακαύσει
  choice: sẽ thiêu rụi
  rationale: Thể hiện sắc thái đốt cháy hoàn toàn của động từ ghép, mạnh hơn cách nói đơn giản “sẽ đốt”.
- source_word: πυρὶ ἀσβέστῳ
  choice: trong lửa không thể dập tắt
  rationale: Diễn đạt rõ đặc tính của ngọn lửa là không thể bị dập tắt, đồng thời giữ nguyên sức nặng của hình ảnh phán xét.
- source_word: οὗ
  choice: Tay người
  rationale: Đại từ sở hữu quan hệ quy chiếu về Đấng đang đến trong câu trước. Cấu trúc “Tay người cầm…” chuyển tải tự nhiên ý sở hữu trong tiếng Việt mà không cần lặp “của người”.
theological_decisions:
- issue: Hình ảnh phán xét qua việc phân chia lúa mì và trấu
  choice: Giữ nguyên ẩn dụ nông nghiệp cụ thể và kết quả phán xét ở thì tương lai.
  alternative: Diễn giải trực tiếp lúa mì và trấu là người công chính và kẻ gian ác ngay trong chính văn.
  rationale: Câu Hy Lạp trình bày hình ảnh mà không giải nghĩa trực tiếp các thành phần. Bản dịch giữ sức nặng thần học và sự căng thẳng của ẩn dụ, không thêm cách đồng nhất mang tính diễn giải.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “người” để quy chiếu về Đấng đang đến trong ngữ cảnh liền trước, tránh tự ý thêm tước hiệu. Các từ “dọn sạch”, “thiêu rụi” giữ sắc thái tăng cường của hai động từ Hy Lạp.
