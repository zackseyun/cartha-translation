id: MAT.3.11
reference: Matthew 3:11
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἐγὼ μὲν ⸂ὑμᾶς βαπτίζω⸃ ἐν ὕδατι εἰς μετάνοιαν· ὁ δὲ ὀπίσω μου ἐρχόμενος ἰσχυρότερός μού ἐστιν, οὗ οὐκ εἰμὶ ἱκανὸς τὰ ὑποδήματα βαστάσαι· αὐτὸς ὑμᾶς βαπτίσει ἐν πνεύματι ἁγίῳ ⸂καὶ πυρί⸃·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/011.yaml
  text: I indeed baptize you in water for repentance[a], but the one coming after me is stronger than I, whose sandals I am not worthy to carry[c][b]. He himself will baptize you in the Holy Spirit and fire.
translation:
  language: vi
  text: “Tôi làm phép báp-têm cho anh em bằng nước[a], hướng đến sự ăn năn[b]; nhưng Đấng đến sau tôi mạnh hơn tôi; tôi không xứng đáng mang dép của Ngài. Chính Ngài sẽ làm phép báp-têm cho anh em trong Thánh Linh và lửa[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “trong nước”, và ở phần sau là “trong Thánh Linh và lửa”; giới từ Hy Lạp ἐν trong các cụm này có thể chỉ môi trường hoặc phương tiện.
    reason: lexical_alternative
  - marker: b
    text: Cụm Hy Lạp εἰς μετάνοιαν có ý hướng đến sự ăn năn, nhưng tự nó không xác định phép báp-têm đi trước, tạo nên hay biểu thị sự ăn năn.
    reason: lexical_alternative
  - marker: c
    text: “Lửa” có thể gợi đến sự thanh luyện hoặc sự phán xét; hình ảnh trong nguyên văn vẫn để ngỏ và cần được hiểu theo ngữ cảnh.
    reason: alternative_reading
lexical_decisions:
- source_word: βαπτίζω / βαπτίσει
  choice: làm phép báp-têm
  rationale: Dùng thuật ngữ nghi lễ đã quen thuộc trong tiếng Việt mà không ấn định phương thức là dìm mình, vì ngữ cảnh không giải thích cụ thể phương thức.
- source_word: ἐν ὕδατι
  choice: trong nước
  rationale: Giữ sát cấu trúc ἐν với cách hiểu về phạm vi/môi trường, đồng thời duy trì sự song song với “trong Thánh Linh và lửa”; chú thích nêu cách dịch công cụ “bằng nước”.
- source_word: εἰς μετάνοιαν
  choice: để ăn năn
  rationale: Diễn đạt ngắn gọn và tự nhiên ý hướng đích của εἰς, nhưng không thêm rằng phép báp-têm tạo ra hay chỉ biểu thị sự ăn năn; chú thích bảo lưu độ mở của quan hệ này.
- source_word: ὁ ὀπίσω μου ἐρχόμενος
  choice: Đấng đến sau tôi
  rationale: Diễn đạt tự nhiên phân từ được dùng như danh từ và giữ ý thứ tự/thời điểm của ὀπίσω μου.
- source_word: ἰσχυρότερός μού
  choice: mạnh hơn tôi
  rationale: Dịch trực tiếp dạng so sánh, tránh diễn giải thêm thành một tuyên bố chuyên biệt về quyền năng thần linh.
- source_word: οὗ οὐκ εἰμὶ ἱκανὸς
  choice: tôi không xứng đáng
  rationale: Trong công thức tự hạ mình này, “không xứng đáng” truyền đạt tự nhiên lực ngữ dụng của ἱκανός hơn cách dịch máy móc “không đủ khả năng”.
- source_word: τὰ ὑποδήματα βαστάσαι
  choice: mang dép cho Ngài
  rationale: βαστάσαι có nghĩa là mang/vác chứ không phải tháo; “dép” phù hợp với loại giày dép trong bối cảnh cổ đại.
- source_word: αὐτός
  choice: Chính Ngài
  rationale: Bảo tồn sắc thái nhấn mạnh và sự tương phản giữa phép báp-têm của Giăng với hành động của Đấng đến sau.
- source_word: ἐν πνεύματι ἁγίῳ
  choice: trong Thánh Linh
  rationale: Giữ cấu trúc song song với “trong nước” và hiểu cụm từ là chỉ Thánh Linh; cách gọi này tránh diễn giải thành một năng lực vô ngôi.
- source_word: καὶ πυρί
  choice: và lửa
  rationale: Dịch thẳng cụm từ phối hợp, không quyết định rằng lửa chỉ sự thanh luyện hay sự phán xét.
theological_decisions:
- issue: Ý nghĩa của “Thánh Linh và lửa”
  choice: Giữ nguyên hình ảnh “trong Thánh Linh và lửa”.
  alternative: “trong Thánh Linh và lửa thanh luyện” hoặc “trong Thánh Linh và lửa phán xét”
  rationale: Cụm Hy Lạp không tự xác định dứt khoát chức năng của lửa; ngữ cảnh kế tiếp gợi mạnh đến phán xét nhưng hình ảnh vẫn không nên bị giải nghĩa ngay trong chính văn.
- issue: Sở chỉ của πνεύματι ἁγίῳ
  choice: “Thánh Linh”, hiểu là một sở chỉ có tính ngôi vị.
  alternative: “linh thánh” hoặc “quyền năng của Thánh Linh”
  rationale: Trong ngữ cảnh Ma-thi-ơ, cách hiểu thông thường là Thánh Linh; không thêm “quyền năng” vì từ ấy không có trong nguyên văn.
- issue: Quan hệ giữa phép báp-têm và sự ăn năn
  choice: Dịch “để ăn năn” nhưng kèm chú thích về lực hướng đích của εἰς.
  alternative: “vì đã ăn năn” hoặc “để biểu thị sự ăn năn”
  rationale: Hai cách thay thế đều xác định trình tự hay chức năng thần học rõ hơn điều cụm Hy Lạp tự nó khẳng định.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh em” cho đại từ số nhiều hướng đến người nghe, “Ngài” để chỉ Đấng đến sau, và “làm phép báp-têm” như thuật ngữ nghi lễ quen thuộc. Tránh các cách diễn đạt cổ như “Đấng quyền năng hơn ta” và tránh bổ sung diễn giải giáo phái vào chính văn.
