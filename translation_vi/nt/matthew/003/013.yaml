id: MAT.3.13
reference: Matthew 3:13
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Τότε παραγίνεται ὁ Ἰησοῦς ἀπὸ τῆς Γαλιλαίας ἐπὶ τὸν Ἰορδάνην πρὸς τὸν Ἰωάννην τοῦ βαπτισθῆναι ὑπ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/013.yaml
  text: Then Jesus comes from Galilee to the Jordan[a], to John[c][b], to be baptized by him.
translation:
  language: vi
  text: Bấy giờ, Giê-su từ Ga-li-lê đến[a] sông Giô-đanh, đến với Giăng, để được ông làm phép báp-têm.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Động từ Hy Lạp ở thì hiện tại lịch sử, một cách kể chuyện tạo cảm giác sống động; theo trình tự thời gian cũng có thể hiểu là “đã đến”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Bấy giờ
  rationale: Đánh dấu sự kiện kế tiếp trong mạch kể; cách diễn đạt này tự nhiên và trang trọng trong tiếng Việt.
- source_word: παραγίνεται
  choice: đến
  rationale: Động từ chỉ việc đi đến hoặc xuất hiện tại một nơi. Tiếng Việt không biểu thị thì bằng biến đổi động từ, nên “đến” vừa tự nhiên vừa không làm mất sắc thái hiện tại lịch sử của lời kể.
- source_word: ἀπὸ τῆς Γαλιλαίας
  choice: từ Ga-li-lê
  rationale: ἀπό chỉ nơi xuất phát; “từ” truyền đạt trực tiếp quan hệ này.
- source_word: ἐπὶ τὸν Ἰορδάνην
  choice: đến sông Giô-đanh
  rationale: ἐπί với đối cách trong ngữ cảnh chuyển động chỉ hướng đến một địa điểm. Thêm danh từ loại “sông” giúp độc giả Việt nhận biết địa danh mà không thay đổi ý nghĩa.
- source_word: πρὸς τὸν Ἰωάννην
  choice: gặp Giăng
  rationale: πρός với đối cách diễn tả sự hướng đến một người. Trong tiếng Việt, đặt “gặp Giăng” sau địa điểm diễn đạt tự nhiên việc Giê-su đi đến chỗ Giăng, không thêm danh hiệu vốn không có trong câu Hy Lạp.
- source_word: τοῦ βαπτισθῆναι
  choice: để được … làm phép báp-têm
  rationale: Cấu trúc nguyên mẫu có mạo từ diễn tả mục đích, còn dạng bị động cho biết Giê-su là người nhận hành động. “Để được” thể hiện cả mục đích lẫn thể bị động một cách tự nhiên.
- source_word: ὑπ’ αὐτοῦ
  choice: được ông làm
  rationale: ὑπό với sở hữu cách đánh dấu tác nhân. Đại từ “ông” giữ cách quy chiếu của nguyên văn về Giăng mà không lặp lại tên.
theological_decisions:
- issue: Hiện tại lịch sử của παραγίνεται
  choice: Dùng động từ không đánh dấu thì “đến”
  alternative: Diễn đạt rõ bằng một dạng quá khứ như “đã đến”
  rationale: Tiếng Việt thường để trình tự văn cảnh xác định thời gian. Không thêm “đã” giúp giữ nhịp kể sống động và tránh áp đặt một sự đối lập về thì mà tiếng Việt không cần biểu thị.
- issue: Danh hiệu của Giăng
  choice: Chỉ dùng “Giăng”
  alternative: “Giăng Báp-tít” hoặc “Giăng, người làm phép báp-têm”
  rationale: Câu Hy Lạp tại đây chỉ ghi tên Ἰωάννην. Không thêm danh hiệu giúp bản dịch bám sát nguồn và tránh đưa thông tin từ văn cảnh vào chính câu này.
- issue: Cách diễn đạt phép báp-têm của Giê-su
  choice: “để được ông làm phép báp-têm”
  alternative: “để chịu phép báp-têm bởi ông”
  rationale: Lựa chọn này giữ rõ mục đích, thể bị động và tác nhân, nhưng tránh lối diễn đạt thụ động gượng gạo trong tiếng Việt. Nó không giải thích thêm ý nghĩa thần học của sự kiện.
translation_notes:
  register: 'Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng cách phiên âm tên riêng quen thuộc trong Kinh Thánh tiếng Việt. Cấu trúc câu được điều chỉnh cho tự nhiên trong tiếng Việt nhưng vẫn giữ thứ tự chính: từ Ga-li-lê, đến sông Giô-đanh, hướng đến Giăng, với mục đích nhận phép báp-têm.'
