  rationale: Sửa đại từ sở hữu để phản ánh αὐτοῦ mà không thêm tước hiệu; làm trơn liên kết lời thoại và cách diễn đạt hành trình theo tiếng Việt hiện đại. Giữ “tìm giết” trong bản văn chính vì diễn đạt đúng ý thành ngữ τὴν ψυχὴν ... ζητεῖν, đồng thời chú thích bảo lưu cách dịch sát chữ “mạng sống.”
