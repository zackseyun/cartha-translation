id: MAT.2.20
reference: Matthew 2:20
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: λέγων· Ἐγερθεὶς παράλαβε τὸ παιδίον καὶ τὴν μητέρα αὐτοῦ καὶ πορεύου εἰς γῆν Ἰσραήλ, τεθνήκασιν γὰρ οἱ ζητοῦντες τὴν ψυχὴν τοῦ παιδίου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/020.yaml
  text: saying[a], “Get up, take the child and his mother, and go to the land of Israel, for those seeking the child’s life are dead.”
translation:
  language: vi
  text: 'nói: “Hãy đứng dậy, đưa đứa trẻ và mẹ nó về xứ Israel, vì những kẻ tìm giết đứa trẻ[a] đã chết rồi.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sát nghĩa hơn: “tìm mạng sống của đứa trẻ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγων
  choice: nói rằng
  rationale: Giữ liên kết phân từ với câu trước, đồng thời diễn đạt tự nhiên trong tiếng Việt.
- source_word: Ἐγερθείς
  choice: Hãy đứng dậy
  rationale: Phân từ bất định được dùng theo lối mệnh lệnh nối tiếp; cách dịch này truyền đạt tự nhiên mệnh lệnh trước khi lên đường.
- source_word: παράλαβε
  choice: đem
  rationale: Trong ngữ cảnh, động từ có nghĩa đưa người khác đi cùng mình; “đem” gọn và tự nhiên hơn “tiếp nhận”.
- source_word: τὸ παιδίον
  choice: con trẻ
  rationale: Chỉ một đứa trẻ, không thêm mức tuổi cụ thể; “con trẻ” giữ sắc thái trang trọng, quen thuộc trong văn Kinh Thánh.
- source_word: τὴν μητέρα αὐτοῦ
  choice: mẹ Ngài
  rationale: Đại từ chỉ về con trẻ; viết hoa “Ngài” giúp tham chiếu rõ đến Chúa Giê-su trong văn cảnh mà không thay đổi cú pháp sở hữu.
- source_word: πορεύου
  choice: đi
  rationale: Mệnh lệnh đơn giản về việc lên đường, được diễn đạt trực tiếp và tự nhiên.
- source_word: εἰς γῆν Ἰσραήλ
  choice: đến đất Israel
  rationale: Giữ ý nghĩa địa lý của γῆ và đích đến do εἰς biểu thị.
- source_word: τεθνήκασιν
  choice: đã chết rồi
  rationale: Thể hoàn thành nhấn mạnh cái chết đã xảy ra và tình trạng hiện tại còn hiệu lực; “đã… rồi” chuyển tải cả hai phương diện tự nhiên trong tiếng Việt.
- source_word: οἱ ζητοῦντες
  choice: những kẻ tìm
  rationale: Giữ sắc thái chủ động, liên tục của phân từ được danh từ hóa; kết hợp với bổ ngữ để diễn đạt mục đích gây chết.
- source_word: τὴν ψυχὴν τοῦ παιδίου
  choice: giết con trẻ
  rationale: Trong thành ngữ này, ψυχή là mạng sống, và “tìm mạng sống” có nghĩa tìm cách giết; bản dịch chính ưu tiên cách nói rõ ràng, tự nhiên, còn chú thích bảo lưu hình thức sát chữ.
theological_decisions:
- issue: Cách dịch ψυχή trong bối cảnh đe dọa tính mạng
  choice: giết
  alternative: mạng sống
  rationale: Cụm “tìm ψυχή của ai” ở đây nói đến ý định giết người ấy, không nói về linh hồn phi vật chất. “Tìm giết” truyền đạt đúng ý trong tiếng Việt, trong khi chú thích giữ cách dịch sát chữ “tìm mạng sống”.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ “nói rằng” để nối cú pháp với câu trước. Dùng “con trẻ” thay vì “đứa trẻ” nhằm duy trì sắc thái tôn nghiêm của trình thuật; “đất Israel” giữ địa danh theo dạng quốc tế hiện hành.
