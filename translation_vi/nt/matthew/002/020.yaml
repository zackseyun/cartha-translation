    rationale: αὐτοῦ chỉ sở hữu của “đứa trẻ”; bản Hy Lạp không sử dụng tước hiệu hay đại từ tôn kính. Viết hoa “Ngài” thêm sắc thái tôn kính/diễn giải và có thể làm câu khó hiểu.
  - severity: low
    issue: “nói rằng:” trước lời trích dẫn trực tiếp
    rationale: Trong tiếng Việt hiện đại, “nói:” là liên kết tự nhiên hơn; vẫn giữ chức năng của λέγων nối với câu trước.
  - severity: low
    issue: “đem ... đi đến đất Israel”
    rationale: Cấu trúc này kém gọn trong tiếng Việt. “đưa ... về xứ Israel” tự nhiên hơn và giữ ý đem những người ấy đi đến lãnh thổ Israel.
