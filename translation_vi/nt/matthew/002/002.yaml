source:
  edition: SBLGNT
  text: λέγοντες· Ποῦ ἐστιν ὁ τεχθεὶς βασιλεὺς τῶν Ἰουδαίων; εἴδομεν γὰρ αὐτοῦ τὸν ἀστέρα ἐν τῇ ἀνατολῇ καὶ ἤλθομεν προσκυνῆσαι αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/002.yaml
  text: saying[b][a], “Where is the one who has been born king of the Jews? For we saw his star in the east and have come to pay him homage.”
translation:
  language: vi
  text: 'Họ nói: “Vị vua dân Do Thái vừa được sinh ra đang ở đâu? Vì chúng tôi đã thấy ngôi sao của ngài ở phương đông[a] và đã đến để bái lạy ngài.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “lúc ngôi sao ấy mọc.” Cụm từ Hy Lạp có thể chỉ phương đông hoặc thời điểm ngôi sao mọc.'
    reason: alternative_reading
  - marker: b
    text: 'Cũng có thể dịch: “thờ lạy ngài.” Động từ Hy Lạp có thể chỉ việc bày tỏ lòng tôn kính trước một vị vua hoặc sự thờ phượng, tùy ngữ cảnh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγοντες
  choice: Họ hỏi
  rationale: Phân từ hiện tại giới thiệu lời nói của các nhà thông thái; vì nội dung trực tiếp là một câu hỏi, “Họ hỏi” tự nhiên trong tiếng Việt mà vẫn giữ đúng chức năng tự sự.
- source_word: Ποῦ ἐστιν
  choice: hiện ở đâu?
  rationale: Diễn đạt trực tiếp câu hỏi về nơi chốn; “hiện” làm câu tiếng Việt tự nhiên hơn mà không thêm ý suy đoán.
- source_word: ὁ τεχθεὶς
  choice: mới sinh
  rationale: Diễn đạt phân từ thụ động dùng như danh từ và nhấn mạnh việc vị vua ấy vừa được sinh ra, không dùng một danh xưng mang thêm hàm ý thần học.
- source_word: βασιλεὺς τῶν Ἰουδαίων
  choice: Vua dân Do Thái
  rationale: Cách diễn đạt tự nhiên, trang trọng, giữ nguyên tước hiệu chính trị và hàm ý về Đấng Mê-si-a.
- source_word: εἴδομεν γὰρ
  choice: Chúng tôi đã thấy … nên
  rationale: γάρ nêu lý do cho câu hỏi. Cấu trúc nguyên nhân–kết quả với “nên” tự nhiên trong tiếng Việt và liên kết cả việc nhìn thấy với việc họ đến.
- source_word: αὐτοῦ τὸν ἀστέρα
  choice: ngôi sao của ngài
  rationale: Giữ quan hệ sở hữu của đại từ αὐτοῦ mà không xác định thêm bản chất của dấu hiệu thiên văn.
- source_word: ἐν τῇ ἀνατολῇ
  choice: ở phương đông
  rationale: Đây là nghĩa địa lý truyền thống và hợp ngữ cảnh của ἀνατολή; nghĩa thiên văn “khi mọc” được giữ trong chú thích vì cụm từ Hy Lạp thực sự đa nghĩa.
- source_word: ἤλθομεν
  choice: đến
  rationale: Trong cấu trúc “nên đến”, động từ diễn tả hành trình đã hoàn tất với kết quả hiện tại là họ đang có mặt; tiếng Việt không cần đánh dấu thì riêng.
- source_word: προσκυνῆσαι αὐτῷ
  choice: để bái lạy ngài
  rationale: “Bái lạy” diễn tả hành động cúi mình tôn kính một vị vua và vẫn có thể mang sắc thái thờ lạy, nhờ đó không loại bỏ chiều kích thần học rộng hơn của động từ.
theological_decisions:
- issue: Cách dịch προσκυνῆσαι đối với hài nhi Giê-su
  choice: để bái lạy ngài
  alternative: để thờ lạy ngài
  rationale: Trong ngữ cảnh trực tiếp, các nhà thông thái đang tìm “Vua dân Do Thái”, nên sự tôn kính dành cho vua là nét nghĩa nổi bật. “Bái lạy” giữ được hành động tôn kính sâu xa mà không buộc câu này chỉ mang nghĩa thờ phượng thần linh; chú thích bảo lưu cách hiểu “thờ lạy” và chiều sâu Cơ Đốc học của từ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “ngài” để thể hiện sự tôn kính đối với vị vua được nhắc đến; câu văn tránh thuật ngữ giáo phái và giữ nguyên sự đa nghĩa của các cụm từ Hy Lạp quan trọng.
