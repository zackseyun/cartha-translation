  terminology: 'Tên riêng và thuật ngữ được xử lý nhất quán. “Các nhà thông thái” là phương án an toàn cho μάγοι, không gán địa vị hoàng gia hay chuyên môn cụ thể. Chú thích về “magi” cần diễn đạt trọn câu tự nhiên hơn: “có lẽ có liên hệ...”.'
