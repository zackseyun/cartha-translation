id: MAT.2.1
reference: Matthew 2:1
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Τοῦ δὲ Ἰησοῦ γεννηθέντος ἐν Βηθλέεμ τῆς Ἰουδαίας ἐν ἡμέραις Ἡρῴδου τοῦ βασιλέως, ἰδοὺ μάγοι ἀπὸ ἀνατολῶν παρεγένοντο εἰς Ἱεροσόλυμα
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/001.yaml
  text: After Jesus was born in Bethlehem of Judea in the days of Herod the king[a], behold, wise men from the east arrived in Jerusalem,
translation:
  language: vi
  text: Sau khi Giê-su ra đời tại Bết-lê-hem, thuộc xứ Giu-đê, vào thời vua Hê-rốt, thì kìa, có các nhà thông thái[a] từ phương Đông đến Giê-ru-sa-lem,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “các magi”. Từ Hy Lạp chỉ những người uyên bác từ phương Đông, có lẽ có liên hệ với chiêm tinh hoặc giới cố vấn cung đình.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῦ δὲ Ἰησοῦ γεννηθέντος
  choice: Sau khi Giê-su sinh ra
  rationale: Kết cấu sở hữu cách tuyệt đối nêu hoàn cảnh xảy ra trước hành động chính. “Sau khi” diễn đạt tự nhiên quan hệ thời gian; δέ chỉ là chuyển tiếp nhẹ nên không cần thêm một từ nối riêng làm nặng câu.
- source_word: Βηθλέεμ τῆς Ἰουδαίας
  choice: Bết-lê-hem thuộc xứ Giu-đê
  rationale: “Thuộc xứ Giu-đê” diễn đạt rõ quan hệ địa lý và giúp phân biệt địa danh này với những nơi khác cùng tên.
- source_word: ἐν ἡμέραις Ἡρῴδου τοῦ βασιλέως
  choice: vào thời vua Hê-rốt
  rationale: Đây là cách diễn đạt tiếng Việt tự nhiên cho thành ngữ định vị biến cố trong lịch sử, đồng thời giữ rõ tước hiệu của Hê-rốt.
- source_word: ἰδοὺ
  choice: kìa
  rationale: Giữ chức năng thu hút sự chú ý và sắc thái kể chuyện nổi bật của từ Hy Lạp, thay vì lược bỏ dấu hiệu diễn ngôn này.
- source_word: μάγοι
  choice: các nhà thông thái
  rationale: Cách gọi dễ hiểu, chỉ những người uyên bác từ phương Đông mà không gán cho họ số lượng, địa vị vua chúa hay những chi tiết do truyền thống về sau thêm vào. Chú thích bảo lưu phạm vi nghĩa chuyên biệt của từ Hy Lạp.
- source_word: ἀπὸ ἀνατολῶν
  choice: từ phương Đông
  rationale: Diễn đạt tự nhiên ý nghĩa tập hợp của dạng số nhiều Hy Lạp, tức từ các vùng ở phía đông.
- source_word: παρεγένοντο εἰς Ἱεροσόλυμα
  choice: đến Giê-ru-sa-lem
  rationale: Động từ chỉ việc đến nơi hoặc xuất hiện tại một địa điểm; “đến” kết hợp tự nhiên với địa danh đích trong tiếng Việt.
theological_decisions:
- issue: Chuyển dịch μάγοι mà không đưa truyền thống hậu kỳ vào bản văn
  choice: các nhà thông thái
  alternative: các đạo sĩ; các nhà chiêm tinh; các magi
  rationale: Từ này chỉ những nhân vật uyên bác phương Đông, có thể liên hệ với chiêm tinh hoặc giới cố vấn cung đình. “Các nhà thông thái” dễ hiểu và không khẳng định quá mức nghề nghiệp, tôn giáo, số lượng hay địa vị của họ; nét nghĩa chuyên môn được giải thích trong chú thích.
translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng hiện đại. “Kìa” giữ sắc thái thu hút sự chú ý của nguyên văn; các địa danh dùng dạng phiên âm quen thuộc trong tiếng Việt. Dấu phẩy cuối câu được giữ vì câu nói còn tiếp sang câu kế tiếp.
