  source_fidelity: 'Bản dịch chuyển đạt đúng các yếu tố chính: hoàn cảnh thời gian trước hành động chính, Bết-lê-hem thuộc Giu-đê, thời vua Hê-rốt, dấu hiệu thu hút chú ý ἰδού, các μάγοι từ phương Đông, và việc họ đến Giê-ru-sa-lem. Tuy nhiên, thêm “có” sau “kìa” phản ánh tự nhiên hơn cấu trúc trình hiện của ἰδού mà không thêm thông tin.'
