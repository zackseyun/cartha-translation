  - severity: low
    issue: Cách kết hợp “bí mật triệu ... đến” hơi gượng.
    rationale: Với nghĩa ra lệnh gọi đến của một nhà vua, “bí mật cho triệu ... đến” tự nhiên hơn và nêu rõ hành động sai phái mà không thêm nghĩa.
