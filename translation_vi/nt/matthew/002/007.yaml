  text: Τότε Ἡρῴδης λάθρᾳ καλέσας τοὺς μάγους ἠκρίβωσεν παρ’ αὐτῶν τὸν χρόνον τοῦ φαινομένου ἀστέρος,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/007.yaml
  text: Then Herod secretly summoned the magi and determined from them the time when the star had appeared,[a]
translation:
  language: vi
  text: Bấy giờ, Hê-rốt bí mật cho triệu các nhà chiêm tinh[a] đến, rồi hỏi họ cặn kẽ về thời điểm ngôi sao xuất hiện.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “các nhà thông thái.” Từ Hy Lạp μάγοι chỉ những học giả kiêm chiêm tinh gia phương Đông.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Bấy giờ
  rationale: Dấu nối thời gian đưa câu chuyện sang sự việc kế tiếp; “Bấy giờ” tự nhiên và trang trọng trong văn kể chuyện.
- source_word: Ἡρῴδης
  choice: Hê-rốt
  rationale: Phiên âm tên riêng theo cách viết quen thuộc trong tiếng Việt.
- source_word: λάθρᾳ
  choice: bí mật
  rationale: Diễn tả việc làm kín đáo, không để người khác biết.
- source_word: καλέσας
  choice: triệu ... đến
  rationale: Phân từ bất định quá khứ diễn tả hành động xảy ra trước động từ chính; “triệu ... đến” phù hợp với địa vị nhà vua và vẫn tự nhiên.
- source_word: τοὺς μάγους
  choice: các nhà chiêm tinh
  rationale: μάγοι chỉ những học giả–chiêm tinh gia phương Đông; cách dịch này truyền đạt vai trò của họ rõ hơn từ vay mượn “magi” đối với độc giả Việt hiện đại.
- source_word: ἠκρίβωσεν
  choice: hỏi ... cho thật chính xác
  rationale: Động từ mang nghĩa tìm hiểu hoặc xác định cặn kẽ; trong cấu trúc có παρ’ αὐτῶν, Hê-rốt hỏi họ để biết chính xác.
- source_word: παρ’ αὐτῶν
  choice: hỏi họ
  rationale: παρά với sở hữu cách đánh dấu nguồn thông tin; tiếng Việt diễn đạt tự nhiên bằng đối tượng được hỏi.
- source_word: τὸν χρόνον
  choice: vào thời điểm nào
  rationale: Chuyển cụm danh từ chỉ thời gian thành một mệnh đề nghi vấn gián tiếp tự nhiên trong tiếng Việt.
- source_word: τοῦ φαινομένου ἀστέρος
  choice: ngôi sao đã xuất hiện
  rationale: Phân từ hiện tại ở thuộc cách được diễn đạt tự nhiên thành mệnh đề; “đã xuất hiện” xác định sự xuất hiện của ngôi sao là điều Hê-rốt muốn biết thời điểm.
theological_decisions: []
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng vừa phải và dễ hiểu. Giữ sắc thái bí mật cùng ý niệm tìm hiểu chính xác; không đưa hình ảnh truyền thống về số lượng hoặc địa vị vua chúa của các μάγοι vào bản dịch.
