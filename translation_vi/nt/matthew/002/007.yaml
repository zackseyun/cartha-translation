- from: Bấy giờ, Hê-rốt bí mật triệu các nhà chiêm tinh[a] đến và hỏi họ cho thật chính xác ngôi sao đã xuất hiện vào thời điểm nào.
  to: Bấy giờ, Hê-rốt bí mật cho triệu các nhà chiêm tinh[a] đến, rồi hỏi họ cặn kẽ về thời điểm ngôi sao xuất hiện.
  rationale: Bản sửa giữ nguyên nội dung và trình tự của câu Hy Lạp, nhưng dùng “hỏi họ cặn kẽ về” để phản ánh rõ hơn việc Hê-rốt tìm hiểu chính xác từ các μάγοι, và điều chỉnh “cho triệu” cho tự nhiên trong tiếng Việt. Chú thích được viết gọn, rõ, và không thêm các chi tiết truyền thống ngoài từ μάγοι.
  reviewer_model: gpt-5.6-terra
