id: MAT.2.18
reference: Matthew 2:18
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Φωνὴ ἐν Ῥαμὰ ⸀ἠκούσθη, κλαυθμὸς καὶ ὀδυρμὸς πολύς· Ῥαχὴλ κλαίουσα τὰ τέκνα αὐτῆς, καὶ οὐκ ἤθελεν παρακληθῆναι ὅτι οὐκ εἰσίν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/018.yaml
  text: 'A voice was heard in Ramah[a], weeping and great mourning: Rachel weeping for her children, and she was not willing to be comforted[c][b], because they are no more.'
translation:
  language: vi
  text: '“Tại Ra-ma, có tiếng được nghe thấy:

    tiếng khóc than và nỗi ai oán sâu xa;

    Ra-chên khóc thương các con mình,

    và bà không muốn được an ủi[a],

    vì chúng không còn nữa[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “bà không chịu nhận lời an ủi.”'
    reason: lexical_alternative
  - marker: b
    text: 'Dịch sát: “vì chúng không hiện hữu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Φωνὴ ἐν Ῥαμὰ ἠκούσθη
  choice: Có tiếng vang lên tại Ra-ma
  rationale: Cách diễn đạt tự nhiên trong tiếng Việt, đồng thời giữ hình thức tường thuật bị động về một tiếng được nghe thấy. “Tại” phù hợp với địa danh; “Ra-ma” là dạng phiên âm quen dùng.
- source_word: κλαυθμὸς καὶ ὀδυρμὸς πολύς
  choice: tiếng khóc than và lời ai oán thảm thiết
  rationale: 'Giữ hai danh từ gần nghĩa nhưng không đồng nhất: κλαυθμός là tiếng khóc than có thể nghe thấy, còn ὀδυρμός là lời than khóc, ai oán; πολύς được diễn đạt bằng “thảm thiết” để truyền đạt cường độ một cách tự nhiên.'
- source_word: Ῥαχὴλ κλαίουσα τὰ τέκνα αὐτῆς
  choice: Ra-chên khóc thương các con mình
  rationale: Giữ Ra-chên như nhân vật mẫu tử trong lời tiên tri mà không giải thích biểu tượng; τέκνα là “các con”, không giới hạn ở con trai. “Khóc thương” phù hợp ngữ cảnh mất mát.
- source_word: οὐκ ἤθελεν παρακληθῆναι
  choice: bà không muốn được an ủi
  rationale: Theo sát sắc thái của θέλω là muốn hoặc sẵn lòng, tránh làm mạnh thành “khước từ”; thể bị động của παρακαλέω được giữ bằng “được an ủi”.
- source_word: ὅτι οὐκ εἰσίν
  choice: vì chúng không còn nữa
  rationale: Diễn đạt thành ngữ Hy Lạp tự nhiên trong tiếng Việt và giữ sự ngắn gọn, đau xót, không bổ sung trực tiếp từ “đã chết”.
theological_decisions:
- issue: Bản chất của Ra-chên trong lời trích dẫn
  choice: Giữ Ra-chên là hình tượng người mẹ trong lời tiên tri, không giải nghĩa biểu tượng trong chính văn.
  alternative: Giải thích trực tiếp Ra-chên tượng trưng cho các bà mẹ của Y-sơ-ra-ên, hoặc hiểu đây thuần túy là lời nói của người mẹ lịch sử.
  rationale: Bản Hy Lạp chỉ trình bày Ra-chên đang khóc; bản dịch nên bảo toàn chiều kích tiên tri và tính đa tầng của lời trích dẫn mà không áp đặt một cách giải nghĩa riêng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và giàu nhịp điệu để phù hợp với lời trích dẫn tiên tri. Dùng các tên riêng Ra-ma và Ra-chên theo lối phiên âm tiếng Việt quen thuộc. Các dòng thơ giúp thể hiện cấu trúc và sắc thái ai ca của câu.
