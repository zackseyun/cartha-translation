  rationale: Bản sửa chỉ điều chỉnh cách diễn đạt để phản ánh chính xác hơn ἠκούσθη (“được nghe thấy”) và để cụm than khóc tương ứng rõ hơn với κλαυθμὸς καὶ ὀδυρμὸς πολύς. Không thay đổi nghĩa, không giải thích thêm về Ra-chên, và giữ nguyên các neo chú thích.
