id: MAT.2.10
reference: Matthew 2:10
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἰδόντες δὲ τὸν ἀστέρα ἐχάρησαν χαρὰν μεγάλην σφόδρα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/010.yaml
  text: And when they saw the star[a], they rejoiced with exceedingly great joy.
translation:
  language: vi
  text: Khi thấy ngôi sao, họ vui mừng khôn xiết.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tiếng Hy Lạp diễn đạt sát là “họ vui một niềm vui vô cùng lớn,” một lối nói nhấn mạnh mạnh mẽ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδόντες
  choice: Khi thấy
  rationale: Phân từ bất định quá khứ của ὁράω có chức năng chỉ thời gian; “Khi thấy” tự nhiên trong tiếng Việt và giữ quan hệ với động từ chính.
- source_word: δὲ
  choice: không dịch riêng
  rationale: δέ là liên từ nhẹ để tiếp nối câu chuyện; trong tiếng Việt, quan hệ nối tiếp đã rõ và thêm “và” ở đầu câu sẽ kém tự nhiên.
- source_word: τὸν ἀστέρα
  choice: ngôi sao
  rationale: ἀστήρ có nghĩa là “sao”; danh từ chỉ vật thể thiên văn thường đi với loại từ “ngôi” trong tiếng Việt. Ngữ cảnh cho thấy đây là ngôi sao đã được nhắc đến.
- source_word: ἐχάρησαν
  choice: họ vui mừng
  rationale: Dạng của χαίρω mang nghĩa chủ động theo cách dùng; “vui mừng” giữ được sắc thái mạnh và trang trọng vừa phải.
- source_word: χαρὰν μεγάλην σφόδρα
  choice: khôn xiết
  rationale: Cụm tân ngữ đồng căn χαρὰν μεγάλην cùng trạng từ σφόδρα nhấn mạnh niềm vui ở mức rất lớn. “Vui mừng khôn xiết” truyền đạt tự nhiên sức nhấn mạnh của toàn cụm mà không lặp vụng trong tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Bản dịch ưu tiên cách diễn đạt tự nhiên “vui mừng khôn xiết,” còn chú thích bảo tồn cấu trúc nhấn mạnh bằng động từ và danh từ đồng căn trong nguyên文.
