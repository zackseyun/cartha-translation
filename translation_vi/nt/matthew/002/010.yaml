  source_fidelity: Bản dịch chuyển đạt đúng quan hệ thời gian của ἰδόντες (“Khi thấy”), đối tượng xác định τὸν ἀστέρα (“ngôi sao”), và mức độ nhấn mạnh rất mạnh của ἐχάρησαν χαρὰν μεγάλην σφόδρα qua “họ vui mừng khôn xiết.” Việc không dịch riêng δέ là phù hợp với liên từ tiếp diễn nhẹ trong văn phong tiếng Việt.
  naturalness: “Khi thấy ngôi sao, họ vui mừng khôn xiết” tự nhiên, rõ ràng, trang trọng vừa phải và phù hợp tiếng Việt hiện đại. Cụm “vui mừng khôn xiết” tránh được sự lặp từ gượng ép mà vẫn giữ cường độ của nguyên ngữ.
  terminology: “Ngôi sao” là cách gọi chuẩn và phù hợp ngữ cảnh. “Vui mừng” và “khôn xiết” giữ được giọng kể trang trọng cùng sắc thái vui mừng mãnh liệt của câu Hy Lạp.
