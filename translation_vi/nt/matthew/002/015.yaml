id: MAT.2.15
reference: Matthew 2:15
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἦν ἐκεῖ ἕως τῆς τελευτῆς Ἡρῴδου· ἵνα πληρωθῇ τὸ ῥηθὲν ⸀ὑπὸ κυρίου διὰ τοῦ προφήτου λέγοντος· Ἐξ Αἰγύπτου ἐκάλεσα τὸν υἱόν μου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/015.yaml
  text: and was there until the death of Herod[a], so that what was spoken by the Lord through the prophet might be fulfilled, saying[c][b], “Out of Egypt I called my son.”
translation:
  language: vi
  text: 'và ông ở đó cho đến khi Hê-rốt qua đời, để điều Chúa đã phán qua nhà tiên tri được ứng nghiệm: “Ta đã gọi con Ta ra khỏi Ai Cập.”[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ô-sê 11:1.
    reason: cross_reference
  - marker: b
    text: Trong Ô-sê 11:1, “con Ta” ban đầu chỉ dân Ít-ra-ên; tại đây, Ma-thi-ơ trình bày biến cố liên quan đến Chúa Giê-su là sự ứng nghiệm lời Kinh Thánh ấy.
    reason: cross_reference
lexical_decisions:
- source_word: ἦν ἐκεῖ
  choice: ở đó
  rationale: Giữ cách diễn đạt đơn giản của động từ εἰμί ở thì chưa hoàn thành; trong mạch văn tiếng Việt, chủ ngữ được hiểu từ câu trước.
- source_word: ἕως τῆς τελευτῆς Ἡρῴδου
  choice: cho đến khi Hê-rốt qua đời
  rationale: τελευτή chỉ sự qua đời; kết cấu động từ này tự nhiên hơn trong tiếng Việt mà không đổi nghĩa.
- source_word: ἵνα πληρωθῇ
  choice: Như vậy ... được ứng nghiệm
  rationale: Diễn đạt tự nhiên sắc thái mục đích/kết quả của công thức ứng nghiệm, không giản lược thành việc chủ thể con người chủ động làm ứng nghiệm.
- source_word: τὸ ῥηθὲν
  choice: điều ... đã phán
  rationale: Dịch thành mệnh đề tự nhiên trong tiếng Việt và giữ ý lời đã được nói trước đó.
- source_word: ὑπὸ κυρίου
  choice: Chúa ... phán
  rationale: Chuyển thể bị động Hy Lạp sang chủ động tự nhiên trong tiếng Việt, vẫn xác định Chúa là nguồn tối hậu của lời tiên tri và không thêm từ “Đức Chúa Trời” ngoài nguyên văn.
- source_word: διὰ τοῦ προφήτου
  choice: qua nhà tiên tri
  rationale: Giữ vai trò trung gian của nhà tiên tri, phân biệt với Chúa là Đấng phán.
- source_word: λέγοντος
  choice: dấu hai chấm trước lời trích
  rationale: Trong tiếng Việt, dấu hai chấm giới thiệu lời trích tự nhiên hơn việc dịch máy móc là “rằng” hoặc “nói rằng”.
- source_word: Ἐξ Αἰγύπτου
  choice: ra khỏi Ai Cập
  rationale: Thể hiện rõ chuyển động từ bên trong ra ngoài hàm chứa trong ἐξ và kết hợp tự nhiên với “gọi” trong tiếng Việt.
- source_word: ἐκάλεσα
  choice: Ta đã gọi
  rationale: καλέω mang nghĩa gọi ra; “gọi” giữ được phạm vi nghĩa và mối liên hệ với Ô-sê 11:1, không thu hẹp thành “triệu tập”.
- source_word: τὸν υἱόν μου
  choice: Con Ta
  rationale: υἱός là “con trai/con”; trong lời phán của Chúa, “Con Ta” vừa tự nhiên vừa giữ nguyên ngôn ngữ quan hệ cha-con quan trọng của câu trích.
theological_decisions:
- issue: Công thức ứng nghiệm và việc trích Ô-sê 11:1
  choice: Giữ lời khẳng định rằng biến cố này làm ứng nghiệm điều Chúa đã phán qua nhà tiên tri, nhưng không nêu cơ chế ứng nghiệm trong chính bản văn.
  alternative: Diễn giải rõ đây chỉ là lời tiên báo trực tiếp, hoặc rõ đây là sự tái hiện mang tính hình bóng của lịch sử Ít-ra-ên.
  rationale: Ma-thi-ơ khẳng định sự ứng nghiệm, còn bản dịch không nên tự quyết thay người đọc giữa các cách giải thích về quan hệ giữa Ô-sê 11:1 và Chúa Giê-su.
- issue: κύριος trong công thức ứng nghiệm
  choice: Chúa
  alternative: ĐỨC CHÚA
  rationale: Nguyên văn Hy Lạp dùng κύριος; “Chúa” phản ánh trực tiếp văn bản mà không áp đặt lối trình bày danh riêng của Đức Chúa Trời từ nền Hê-bơ-rơ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “qua đời” thay cho danh hóa nặng nề “cái chết của”; “nhà tiên tri” là cách gọi phổ thông. Viết hoa “Con Ta” theo ngữ cảnh lời Chúa và cách Ma-thi-ơ áp dụng câu trích, nhưng không thêm một lý thuyết ứng nghiệm vào câu chính.
