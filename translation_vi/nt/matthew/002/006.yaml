  to: '“Còn ngươi, Bết-lê-hem, đất Giu-đa,

    chẳng hề là nhỏ nhất giữa các thủ lãnh của Giu-đa;

    vì từ ngươi sẽ xuất hiện[a] một vị lãnh đạo,

    người sẽ chăn dắt[b] dân Ta là Y-sơ-ra-ên.”'
  rationale: Chỉnh nhẹ cách diễn đạt phủ định để phản ánh rõ và tự nhiên hơn οὐδαμῶς ἐλαχίστη, đồng thời giản lược chú thích về ποιμανεῖ để bảo toàn cả sắc thái mục tử lẫn sắc thái cai trị mà không áp đặt diễn giải thêm. Các yếu tố còn lại của bản dịch được giữ nguyên vì phù hợp với nguyên văn và văn phong Kinh Thánh tiếng Việt.
