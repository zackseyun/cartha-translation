id: MAT.2.6
reference: Matthew 2:6
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Καὶ σύ, Βηθλέεμ γῆ Ἰούδα, οὐδαμῶς ἐλαχίστη εἶ ἐν τοῖς ἡγεμόσιν Ἰούδα· ἐκ σοῦ γὰρ ἐξελεύσεται ἡγούμενος, ὅστις ποιμανεῖ τὸν λαόν μου τὸν Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/006.yaml
  text: And you[a], Bethlehem, land of Judah, are by no means least among the rulers of Judah[b]; for from you will come a ruler who will shepherd my people Israel.
translation:
  language: vi
  text: '“Còn ngươi, Bết-lê-hem, đất Giu-đa,

    chẳng hề là nhỏ nhất giữa các thủ lãnh của Giu-đa;

    vì từ ngươi sẽ xuất hiện[a] một vị lãnh đạo,

    người sẽ chăn dắt[b] dân Ta là Y-sơ-ra-ên.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sát nghĩa hơn: “sẽ đi ra.”'
    reason: lexical_alternative
  - marker: b
    text: “Chăn dắt” cũng có thể mang nghĩa “cai trị,” trong khi vẫn giữ hình ảnh người chăn.
    reason: lexical_alternative
lexical_decisions:
- source_word: γῆ
  choice: đất
  rationale: Trong cụm đồng vị với Bết-lê-hem và sở hữu cách ‘của Giu-đa’, từ này chỉ vùng đất thuộc Giu-đa, không phải đất theo nghĩa thổ nhưỡng.
- source_word: οὐδαμῶς
  choice: hoàn toàn không
  rationale: Cách dịch này giữ được sức nhấn mạnh của trạng từ phủ định, mạnh hơn một từ ‘không’ đơn thuần.
- source_word: ἐλαχίστη
  choice: nhỏ bé nhất
  rationale: Giữ hình ảnh về sự nhỏ bé đồng thời vẫn có thể hàm ý địa vị hay tầm quan trọng thấp, không thu hẹp nghĩa chỉ còn ‘kém quan trọng nhất’.
- source_word: ἡγεμόσιν
  choice: các thủ lãnh
  rationale: Diễn đạt nghĩa những người đứng đầu hoặc cai quản trong Giu-đa mà không áp đặt một chức vụ hành chính cụ thể như ‘thống đốc’.
- source_word: ἐξελεύσεται
  choice: sẽ xuất hiện
  rationale: Truyền đạt tự nhiên ý một người sẽ ra từ Bết-lê-hem; nghĩa sát chữ ‘sẽ đi ra’ được giữ trong chú thích.
- source_word: ἡγούμενος
  choice: một vị lãnh đạo
  rationale: Phân từ được dùng như danh từ, chỉ vai trò dẫn dắt và cai trị của nhân vật sắp đến; ‘vị’ tạo sắc thái trang trọng tự nhiên nhưng không định danh chức tước cụ thể.
- source_word: ποιμανεῖ
  choice: sẽ chăn dắt
  rationale: Giữ nguyên ẩn dụ người chăn chiên quan trọng trong câu, đồng thời tiếng Việt vẫn cho phép hiểu rộng là dẫn dắt và cai trị.
- source_word: λαόν μου τὸν Ἰσραήλ
  choice: dân Ta là Y-sơ-ra-ên
  rationale: Giữ quan hệ đồng vị và sắc thái giao ước của cụm từ Hy Lạp; ‘Ta’ phù hợp lời phán trực tiếp của Đức Chúa Trời trong văn phong Kinh Thánh trang trọng.
theological_decisions:
- issue: Sắc thái vương quyền và mục vụ trong lời mô tả nhân vật sắp đến
  choice: Dịch ἡγούμενος là ‘một vị lãnh đạo’ và ποιμανεῖ là ‘sẽ chăn dắt’.
  alternative: Dùng hoàn toàn ngôn ngữ chính trị (‘người cai trị’ / ‘sẽ cai trị’) hoặc hoàn toàn ngôn ngữ mục tử.
  rationale: Nguyên văn kết hợp quyền lãnh đạo với hình ảnh người chăn. Giữ cả hai phương diện tránh giải quyết sự căng thẳng thần học theo riêng một hướng.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Giữ cấu trúc thơ của lời trích dẫn và cách xưng ‘Ta’ trong lời Đức Chúa Trời; dùng các tên riêng theo dạng phiên âm quen thuộc trong Kinh Thánh tiếng Việt.
