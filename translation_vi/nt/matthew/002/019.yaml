id: MAT.2.19
reference: Matthew 2:19
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Τελευτήσαντος δὲ τοῦ Ἡρῴδου ἰδοὺ ἄγγελος κυρίου ⸂φαίνεται κατ’ ὄναρ⸃ τῷ Ἰωσὴφ ἐν Αἰγύπτῳ
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/019.yaml
  text: But after Herod died[a], behold, an angel of the Lord appears in a dream to Joseph in Egypt.
translation:
  language: vi
  text: Sau khi Hê-rốt qua đời, kìa, một thiên sứ của Chúa[a] hiện ra với Giô-sép trong giấc mơ, khi ông đang ở Ai Cập.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “vị thiên sứ của Chúa.” Tiếng Hy Lạp ở đây không có mạo từ trước từ “thiên sứ.”'
    reason: Giữ lại khả năng dịch có tính xác định vốn mang những liên hệ liên văn bản và thần học trong truyền thống, đồng thời nói rõ bằng chứng ngữ pháp của nguyên văn.
lexical_decisions:
- source_word: Τελευτήσαντος ... τοῦ Ἡρῴδου
  choice: Sau khi Hê-rốt qua đời
  rationale: Phân từ bất định trong cấu trúc sở hữu tuyệt đối mang ý nghĩa thời gian; “sau khi ... qua đời” diễn đạt tự nhiên và cho thấy sự việc tiếp theo xảy ra sau cái chết của Hê-rốt.
- source_word: δὲ
  choice: Sau khi
  rationale: δέ đánh dấu bước chuyển trong câu chuyện. Trong tiếng Việt, quan hệ chuyển tiếp được thể hiện tự nhiên qua mệnh đề thời gian mở đầu, không cần thêm một liên từ như “nhưng” vốn có thể tạo sắc thái đối lập quá mạnh.
- source_word: ἰδοὺ
  choice: kìa
  rationale: Giữ lại lời nhắc gây chú ý đầy sinh động và trang trọng của Ma-thi-ơ.
- source_word: ἄγγελος κυρίου
  choice: một thiên sứ của Chúa
  rationale: Danh từ ἄγγελος không có mạo từ; “một thiên sứ” là cách thể hiện trực tiếp nhất trong tiếng Việt, còn “của Chúa” truyền đạt quan hệ sở hữu của κυρίου.
- source_word: φαίνεται
  choice: hiện ra
  rationale: Hiện tại lịch sử trong tiếng Hy Lạp tạo sự sống động cho trình thuật; tiếng Việt không bắt buộc đánh dấu thì nên “hiện ra” giữ được sắc thái này mà vẫn tự nhiên.
- source_word: κατ’ ὄναρ
  choice: trong giấc mơ
  rationale: Đây là thành ngữ chỉ việc nhận sự mặc khải qua một giấc mơ.
- source_word: τῷ Ἰωσὴφ
  choice: với Giô-sép
  rationale: Dữ cách chỉ người được thiên sứ hiện ra; “hiện ra với” là cách nói tự nhiên trong tiếng Việt.
- source_word: ἐν Αἰγύπτῳ
  choice: tại Ai Cập
  rationale: Cụm từ chỉ nơi Giô-sép đang ở khi nhận giấc mơ; “tại” giúp phân biệt địa điểm này với cụm “trong giấc mơ” ngay trước đó.
theological_decisions:
- issue: Cách dịch κύριος trong ἄγγελος κυρίου
  choice: Chúa
  alternative: chủ
  rationale: Trong ngữ cảnh này, κύριος là tước hiệu chỉ Đức Chúa Trời; “Chúa” là cách dịch tự nhiên, trang trọng và không áp đặt thêm một cách nhận diện thần học ngoài văn bản.
- issue: Tính xác định của ἄγγελος
  choice: một thiên sứ của Chúa
  alternative: thiên sứ của Chúa / vị thiên sứ của Chúa
  rationale: Tiếng Hy Lạp không có mạo từ trước ἄγγελος, nên bản chính không xác định đây là một nhân vật mang danh hiệu riêng. Chú thích giữ lại cách dịch truyền thống có tính xác định hơn mà không đưa nó vào bản chính.
translation_notes:
  register: 'Văn phong kể chuyện hiện đại, trang trọng và dễ hiểu. Giữ “kìa” để bảo tồn sức gợi của ἰδοὺ; dùng các dạng tên quen thuộc trong tiếng Việt: Hê-rốt, Giô-sép và Ai Cập.'
