    rationale: Nguyên văn nói “để điều đã được phán ... được ứng nghiệm.” Đặt “lời” làm chủ ngữ của “được ứng nghiệm” tránh khả năng hiểu rằng chính Người là chủ thể ngữ pháp của hành động “ứng nghiệm”.
  - severity: low
