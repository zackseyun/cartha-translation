id: MAT.2.23
reference: Matthew 2:23
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἐλθὼν κατῴκησεν εἰς πόλιν λεγομένην Ναζαρέτ, ὅπως πληρωθῇ τὸ ῥηθὲν διὰ τῶν προφητῶν ὅτι Ναζωραῖος κληθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/023.yaml
  text: 'And he came and lived in a city called Nazareth[a], so that what was spoken through the prophets might be fulfilled: “He will be called a Nazarene.”'
translation:
  language: vi
  text: 'Người đến và cư ngụ tại một thành gọi là Na-xa-rét[a], để lời đã được phán qua các nhà tiên tri được ứng nghiệm: “Người sẽ được gọi là người Na-xa-rét.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch danh xưng này là “người Na-xô-rê.” Nền tảng tiên tri chính xác của câu “Người sẽ được gọi là người Na-xa-rét” vẫn còn được tranh luận; Ma-thi-ơ có thể đang tóm lược những chủ đề trong các sách tiên tri thay vì trích dẫn một câu cụ thể.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθὼν
  choice: Người đến
  rationale: Phân từ bất định đi trước động từ chính, được diễn đạt tự nhiên bằng động từ hữu hạn, giữ đúng trình tự hành động.
- source_word: κατῴκησεν
  choice: cư ngụ
  rationale: Diễn tả việc ở hoặc lập nơi cư trú; “cư ngụ” trang trọng vừa phải, tự nhiên và không nhấn quá mức tính định cư vĩnh viễn.
- source_word: εἰς πόλιν λεγομένην Ναζαρέτ
  choice: tại một thành gọi là Na-xa-rét
  rationale: Với động từ chỉ cư trú, εἰς được chuyển tự nhiên là “tại”; πόλις được giữ là “thành,” còn tên riêng được phiên âm quen thuộc trong tiếng Việt.
- source_word: ὅπως πληρωθῇ
  choice: để ứng nghiệm
  rationale: Giữ sắc thái mục đích/kết quả của công thức ứng nghiệm trong Ma-thi-ơ mà vẫn tự nhiên trong tiếng Việt.
- source_word: τὸ ῥηθὲν
  choice: lời đã được phán
  rationale: Diễn đạt tự nhiên phân từ thụ động có mạo từ và giữ sắc thái lời tiên tri được công bố.
- source_word: διὰ τῶν προφητῶν
  choice: qua các nhà tiên tri
  rationale: Giữ ý nghĩa trung gian/phương tiện của διά với sở hữu cách và số nhiều rõ ràng của “các nhà tiên tri.”
- source_word: Ναζωραῖος
  choice: người Na-xa-rét
  rationale: Trong ngữ cảnh, đây là danh xưng gắn với Na-xa-rét; cách dịch này rõ nghĩa đối với độc giả Việt và không đồng nhất với người Na-xi-rê.
- source_word: κληθήσεται
  choice: sẽ được gọi
  rationale: Giữ nguyên thì tương lai và thể bị động của καλέω trong lời trích dẫn.
theological_decisions:
- issue: Bản chất của lời ứng nghiệm không có một câu Cựu Ước tương ứng chính xác
  choice: Giữ nguyên công thức số nhiều “qua các nhà tiên tri” mà không xác định một nguồn cụ thể trong chính văn.
  alternative: Hiểu là ám chỉ Ê-sai 11:1, là tóm lược chủ đề Đấng Mê-si bị khinh dể, hoặc liên hệ với người Na-xi-rê.
  rationale: Nguyên văn dùng “các nhà tiên tri” ở số nhiều, có thể chỉ lời chứng tổng hợp hoặc theo chủ đề. Việc xác định một câu riêng lẻ sẽ giải quyết quá mức điều bản văn để ngỏ.
- issue: Ý nghĩa của Ναζωραῖος
  choice: người Na-xa-rét
  alternative: người Na-xô-rê; người Na-xi-rê
  rationale: Ngữ cảnh trực tiếp gắn danh xưng với thành Na-xa-rét. “Người Na-xi-rê” bị loại vì đó là một khái niệm và thuật ngữ khác; dạng sát âm hơn cùng sự bất định về nền tảng tiên tri được ghi ở chú thích.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “Người” để chỉ Chúa Giê-su theo văn mạch; tránh lối cổ như “ngụ tại” đứng riêng và tránh đồng nhất Ναζωραῖος với danh xưng Na-xi-rê.
