source:
  edition: SBLGNT
  text: ἀκούσας δὲ ⸂ὁ βασιλεὺς Ἡρῴδης⸃ ἐταράχθη καὶ πᾶσα Ἱεροσόλυμα μετ’ αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/003.yaml
  text: When King Herod heard this[a], he was troubled[b], and all Jerusalem with him.
translation:
  language: vi
  text: Khi vua Hê-rốt nghe vậy, ông bối rối[a], và cả thành Giê-ru-sa-lem cũng bối rối cùng với ông.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “xao động”, “bất an” hoặc “hoảng hốt”.'
    reason: lexical_alternative
  - marker: b
    text: “Cả thành Giê-ru-sa-lem” dùng tên thành phố để chỉ cư dân; đây có thể là cách nói khái quát hoặc cường điệu về sự bối rối chung của thành.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀκούσας
  choice: Khi ... nghe vậy
  rationale: Phân từ bất định quá khứ có chức năng chỉ thời gian. “Nghe vậy” diễn đạt tự nhiên và làm rõ đối tượng được hàm ý từ văn cảnh trước, tức lời các nhà thông thái vừa nói.
- source_word: δὲ
  choice: Khi
  rationale: δέ là liên từ chuyển tiếp nhẹ; khi kết hợp với ἀκούσας, sắc thái diễn ngôn được chuyển tải tự nhiên trong mệnh đề thời gian tiếng Việt mà không cần thêm một liên từ riêng.
- source_word: ὁ βασιλεὺς Ἡρῴδης
  choice: vua Hê-rốt
  rationale: Cách gọi tự nhiên trong tiếng Việt hiện đại, giữ cả tước hiệu βασιλεύς và tên riêng.
- source_word: ἐταράχθη
  choice: bối rối
  rationale: Động từ thể bị động chỉ sự xáo động, bất an hoặc hoảng hốt trong lòng. “Bối rối” giữ được độ mở về mức độ cảm xúc, không giải thích quá mức.
- source_word: πᾶσα Ἱεροσόλυμα
  choice: cả thành Giê-ru-sa-lem
  rationale: Giữ phép hoán dụ của nguyên văn, dùng tên thành phố để chỉ cư dân, thay vì đưa “dân chúng” vào chính văn.
- source_word: μετ’ αὐτοῦ
  choice: cũng bối rối cùng ông
  rationale: “Cùng ông” bảo toàn mối liên hệ mà μετά với sở hữu cách diễn tả; lặp lại “bối rối” giúp câu tiếng Việt rõ nghĩa vì chỉ nói “cả thành ... cùng ông” sẽ thiếu tự nhiên.
theological_decisions:
- issue: Phạm vi của πᾶσα Ἱεροσόλυμα
  choice: 'Giữ cách nói mang tính tập thể và hoán dụ: “cả thành Giê-ru-sa-lem”'
  alternative: Hiểu là nhiều người trong thành, hoặc cụ thể là giới lãnh đạo Giê-ru-sa-lem
  rationale: Nguyên văn gọi đích danh toàn thành, có thể là cách nói khái quát hoặc cường điệu về cư dân. Không nên thu hẹp thành một nhóm lãnh đạo cụ thể khi câu không nói như vậy.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Hê-rốt” và “Giê-ru-sa-lem” theo lối phiên âm quen thuộc trong tiếng Việt. Chính văn giữ phép hoán dụ và mức độ mơ hồ cảm xúc của nguyên văn; chú thích giải thích các khả năng mà không thu hẹp ý nghĩa.
