id: MAT.2.8
reference: Matthew 2:8
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ πέμψας αὐτοὺς εἰς Βηθλέεμ εἶπεν· Πορευθέντες ⸂ἐξετάσατε ἀκριβῶς⸃ περὶ τοῦ παιδίου· ἐπὰν δὲ εὕρητε, ἀπαγγείλατέ μοι, ὅπως κἀγὼ ἐλθὼν προσκυνήσω αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/008.yaml
  text: And after sending them to Bethlehem[a], he said, “Go and search carefully for the child, and when you find him, report to me, so that I too may come and worship him.”
translation:
  language: vi
  text: 'Sau khi đã sai họ đến Bết-lê-hem, vua nói: “Hãy đi tìm hiểu thật kỹ về đứa trẻ ấy. Khi tìm được đứa trẻ ấy, hãy báo lại cho ta, để ta cũng đến thờ lạy[a] đứa trẻ ấy.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “bái lạy” hoặc “phủ phục trước.” Động từ Hy Lạp có thể chỉ sự thờ phượng hoặc hành động tỏ lòng tôn kính trước một nhân vật hoàng gia.
    reason: lexical_alternative
lexical_decisions:
- source_word: πέμψας
  choice: Rồi vua sai
  rationale: Phân từ bất định chỉ hành động xảy ra trước động từ chính; “rồi” diễn đạt tự nhiên trình tự sai đi rồi nói. Chủ ngữ “vua” được làm rõ từ ngữ cảnh, vì đại từ Hy Lạp được lược bỏ trong câu này.
- source_word: Πορευθέντες
  choice: Hãy đi
  rationale: Phân từ này phối hợp với mệnh lệnh ἐξετάσατε và mang lực mệnh lệnh; “hãy đi” là cách nói tự nhiên trong tiếng Việt.
- source_word: ἐξετάσατε ἀκριβῶς
  choice: tìm hiểu thật kỹ
  rationale: Cụm từ nói đến việc dò hỏi hoặc điều tra một cách chính xác, cẩn thận. “Tìm hiểu thật kỹ” giữ được sắc thái điều tra mà không hàm ý chỉ tìm kiếm bằng mắt.
- source_word: περὶ τοῦ παιδίου
  choice: về con trẻ
  rationale: περί chỉ đối tượng của việc dò hỏi, nên “về con trẻ” sát nghĩa hơn cách diễn đạt chỉ việc tìm vị trí.
- source_word: παιδίου
  choice: con trẻ
  rationale: παιδίον chỉ một đứa trẻ; “con trẻ” có sắc thái trang trọng, tự nhiên trong văn phong Kinh Thánh và không xác định quá mức tuổi của em.
- source_word: ἐπὰν δὲ εὕρητε
  choice: Khi tìm được
  rationale: ἐπάν với giả định thức diễn tả một sự việc tương lai có điều kiện. “Khi” phù hợp với lời dặn mang tính chờ đợi, nhưng không khẳng định tuyệt đối rằng họ chắc chắn sẽ tìm thấy.
- source_word: ἀπαγγείλατέ μοι
  choice: hãy báo lại cho ta
  rationale: Động từ mang nghĩa đem tin hoặc báo cáo trở lại; “báo lại” giữ rõ sắc thái hồi báo.
- source_word: ὅπως κἀγὼ
  choice: để ta cũng
  rationale: ὅπως diễn tả mục đích, còn κἀγώ nhấn mạnh rằng Hê-rốt tự nhận mình có cùng ý định với các nhà chiêm tinh.
- source_word: ἐλθὼν προσκυνήσω αὐτῷ
  choice: đến thờ lạy con trẻ
  rationale: Phân từ và động từ chính được diễn đạt thành hai hành động nối tiếp tự nhiên. “Thờ lạy” giữ được khả năng chỉ sự thờ phượng, đồng thời chú thích nêu rõ nghĩa kính phục hoặc phủ phục trước một nhân vật hoàng gia.
theological_decisions:
- issue: Ý nghĩa của προσκυνήσω đối với con trẻ Giê-su
  choice: thờ lạy
  alternative: bái lạy; phủ phục trước
  rationale: προσκυνέω có thể chỉ sự thờ phượng hoặc hành động phủ phục tôn kính trước vua. “Thờ lạy” giữ được chiều kích thần học có thể có trong cách Ma-thi-ơ dùng từ, nhưng chú thích bảo tồn độ mở từ vựng và không biến lời dối trá của Hê-rốt thành lời tuyên xưng chân thành.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “ta” trong lời vua Hê-rốt cho phù hợp địa vị và ngữ cảnh. Dấu chú thích [a] được đặt ngay sau cụm từ cần giải thích.
