revisions:
- from: 'Rồi vua sai họ đến Bết-lê-hem và nói: “Hãy đi tìm hiểu thật kỹ về con trẻ. Khi tìm được, hãy báo lại cho ta, để ta cũng đến thờ lạy[a] con trẻ.”'
  to: 'Sau khi đã sai họ đến Bết-lê-hem, vua nói: “Hãy đi tìm hiểu thật kỹ về đứa trẻ ấy. Khi tìm được đứa trẻ ấy, hãy báo lại cho ta, để ta cũng đến thờ lạy[a] đứa trẻ ấy.”'
  rationale: Bản sửa chỉ làm rõ trình tự của phân từ πέμψας và đối tượng của εὕρητε, không thay đổi ý nghĩa. Giữ ‘thờ lạy’ theo lựa chọn có thể biện minh từ προσκυνέω và giữ chú thích để không loại trừ nghĩa tôn kính/triều bái.
  reviewer_model: gpt-5.6-terra
