id: MAT.2.12
reference: Matthew 2:12
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ χρηματισθέντες κατ’ ὄναρ μὴ ἀνακάμψαι πρὸς Ἡρῴδην δι’ ἄλλης ὁδοῦ ἀνεχώρησαν εἰς τὴν χώραν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/012.yaml
  text: And having been warned in a dream not to return to Herod[b][a], they departed for their own country by another route.
translation:
  language: vi
  text: Sau khi được báo[a] trong giấc mơ không được trở lại gặp Hê-rốt, họ đã trở về xứ mình bằng một con đường khác[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “được Đức Chúa Trời báo.” Tiếng Hy Lạp hàm ý lời báo đến từ Đức Chúa Trời, dù câu này không nêu đích danh Ngài.'
    reason: lexical_alternative
  - marker: b
    text: 'Hay: “theo một lộ trình khác.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: χρηματισθέντες
  choice: được báo
  rationale: Dạng phân từ bị động chỉ việc nhận một lời báo hay chỉ dẫn, trong văn cảnh này hàm ý nguồn từ Đức Chúa Trời nhưng không nêu đích danh tác nhân.
- source_word: κατ’ ὄναρ
  choice: trong giấc mơ
  rationale: Cách diễn đạt tự nhiên trong tiếng Việt cho việc nhận lời báo qua một giấc mơ.
- source_word: μὴ ἀνακάμψαι
  choice: đừng trở lại
  rationale: Diễn đạt nội dung của lời báo bằng mệnh lệnh gián tiếp tự nhiên, phù hợp với bối cảnh hành trình.
- source_word: πρὸς Ἡρῴδην
  choice: gặp Hê-rốt
  rationale: πρός với đối cách chỉ hướng đến một người; trong tiếng Việt, “trở lại gặp Hê-rốt” tự nhiên hơn “trở lại đến Hê-rốt” và phù hợp với việc các nhà thông thái đã gặp ông trước đó.
- source_word: δι’ ἄλλης ὁδοῦ
  choice: đi đường khác
  rationale: ὁδός ở đây mang nghĩa cụ thể là đường hay lộ trình; cách nói này ngắn gọn, rõ ràng và tự nhiên.
- source_word: ἀνεχώρησαν
  choice: họ đi ... về
  rationale: Trong chuỗi hành trình này, động từ mang nghĩa rời đi hoặc lui đi; kết hợp với đích đến thành “đi ... về” là tự nhiên trong tiếng Việt.
- source_word: εἰς τὴν χώραν αὐτῶν
  choice: về xứ mình
  rationale: χώρα có thể là xứ, vùng hoặc đất nước; “xứ mình” truyền đạt gọn nghĩa trở về quê hương của họ.
theological_decisions:
- issue: Tác nhân thần linh được hàm ý trong lời báo
  choice: Giữ dạng bị động “được báo”, không thêm “bởi Đức Chúa Trời” vào chính văn.
  alternative: “được Đức Chúa Trời báo” hoặc “được báo từ trời”
  rationale: Văn cảnh và cách dùng χρηματίζω hàm ý lời báo đến từ Đức Chúa Trời, nhưng câu Hy Lạp không nêu Ngài cách minh nhiên. Bản dịch giữ hàm ý ấy mà không bổ sung chủ thể.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Hê-rốt” theo lối phiên âm quen thuộc; “xứ mình” giữ sắc thái gọn, tự nhiên của câu kể hành trình.
