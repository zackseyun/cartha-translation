id: MAT.2.22
reference: Matthew 2:22
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀκούσας δὲ ὅτι Ἀρχέλαος ⸀βασιλεύει τῆς Ἰουδαίας ἀντὶ ⸂τοῦ πατρὸς αὐτοῦ Ἡρῴδου⸃ ἐφοβήθη ἐκεῖ ἀπελθεῖν· χρηματισθεὶς δὲ κατ’ ὄναρ ἀνεχώρησεν εἰς τὰ μέρη τῆς Γαλιλαίας,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/022.yaml
  text: But when he heard that Archelaus was reigning over Judea in place of his father Herod[a], he was afraid to go there. And after being warned in a dream, he withdrew to the regions of Galilee,
translation:
  language: vi
  text: Nhưng khi nghe rằng A-khê-la-ô đang cai trị xứ Giu-đê thay cho cha mình là Hê-rốt, ông sợ đến đó. Sau khi được cảnh báo trong giấc mơ[a], ông lui về miền Ga-li-lê,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “được chỉ dẫn trong giấc mơ”; động từ Hy Lạp thường hàm ý lời cảnh báo hoặc chỉ dẫn đến từ Đức Chúa Trời, dù ở đây tác nhân không được nêu rõ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσας
  choice: khi nghe rằng
  rationale: Phân từ bất định chỉ hoàn cảnh xảy ra trước hành động chính; cách diễn đạt này tự nhiên trong tiếng Việt và giữ rõ quan hệ thời gian.
- source_word: δὲ
  choice: Nhưng
  rationale: 'Đánh dấu bước chuyển có tính tương phản: ý định trở về bị cản trở bởi tin về A-khê-la-ô.'
- source_word: βασιλεύει τῆς Ἰουδαίας
  choice: đang cai trị xứ Giu-đê
  rationale: Giữ sắc thái hiện tại tiếp diễn trong lời tường thuật gián tiếp. Trong tiếng Việt, “cai trị” diễn đạt tự nhiên quyền cai quản của một vua trên lãnh thổ.
- source_word: ἀντὶ τοῦ πατρὸς αὐτοῦ Ἡρῴδου
  choice: thay cho cha mình là Hê-rốt
  rationale: ἀντί chỉ sự thay thế hoặc kế vị; bản dịch không thêm ý vượt quá việc A-khê-la-ô cai trị ở vị trí của cha mình.
- source_word: ἐφοβήθη ἐκεῖ ἀπελθεῖν
  choice: ông sợ đến đó
  rationale: Diễn đạt trực tiếp nỗi sợ gắn với việc đi tới địa điểm vừa nói, không thêm nguyên nhân ngoài văn bản.
- source_word: χρηματισθεὶς κατ’ ὄναρ
  choice: sau khi được cảnh báo trong giấc mơ
  rationale: Giữ dạng bị động và phương tiện hoặc bối cảnh của lời cảnh báo, đồng thời không đưa tác nhân “Đức Chúa Trời” vào câu khi nguyên văn để ngầm.
- source_word: ἀνεχώρησεν
  choice: ông lui về
  rationale: Diễn đạt một sự rời đi có chủ ý trước nguy cơ hoặc hoàn cảnh, mạnh hơn cách nói trung tính “đi” nhưng không hàm ý tháo chạy.
- source_word: εἰς τὰ μέρη τῆς Γαλιλαίας
  choice: về miền Ga-li-lê
  rationale: μέρη ở số nhiều chỉ khu vực hoặc địa phận. “Miền Ga-li-lê” là cách nói tự nhiên, bao quát, tránh lối dịch cứng “các phần của Ga-li-lê”.
theological_decisions:
- issue: Có nên nêu rõ Đức Chúa Trời là nguồn của lời cảnh báo trong χρηματισθείς hay không
  choice: Giữ cách nói bị động “được cảnh báo” mà không thêm tác nhân.
  alternative: “được Đức Chúa Trời cảnh báo” hoặc “nhận chỉ dẫn từ Đức Chúa Trời”
  rationale: Trong ngữ cảnh Ma-thi-ơ, động từ thường hàm ý sự truyền đạt từ Đức Chúa Trời, nhưng câu Hy Lạp không nêu tác nhân. Giữ tác nhân ngầm bảo toàn sự dè dặt và độ mở của nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng các địa danh quen thuộc “Giu-đê” và “Ga-li-lê”; tên Ἀρχέλαος được phiên âm gần âm Hy Lạp là “A-khê-la-ô”. Dấu phẩy cuối câu được giữ vì câu Hy Lạp và lớp tham khảo tiếng Anh tiếp nối sang câu sau.
