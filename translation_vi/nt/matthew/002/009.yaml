  source_fidelity: 'Bản dịch theo sát trình tự và các thành tố chính của tiếng Hy Lạp: nghe nhà vua, lên đường, lời đánh dấu gây chú ý, ngôi sao đã thấy ở phương đông, đi trước họ, rồi đến và dừng phía trên nơi đứa trẻ ở. Chú thích bảo lưu đúng sự mơ hồ có thực của ἐν τῇ ἀνατολῇ. Tuy nhiên, “Hài Nhi” viết hoa là lối gọi tôn kính theo truyền thống hơn là nghĩa trung tính của τὸ παιδίον; nên dùng “đứa trẻ” để không thêm sắc thái ngoài câu.'
