id: MAT.2.9
reference: Matthew 2:9
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οἱ δὲ ἀκούσαντες τοῦ βασιλέως ἐπορεύθησαν, καὶ ἰδοὺ ὁ ἀστὴρ ὃν εἶδον ἐν τῇ ἀνατολῇ προῆγεν αὐτούς, ἕως ἐλθὼν ⸀ἐστάθη ἐπάνω οὗ ἦν τὸ παιδίον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/009.yaml
  text: After hearing the king[a], they went on their way, and behold, the star that they had seen in the east went before them until it came and stood over where the child was.
translation:
  language: vi
  text: Nghe vua nói xong, họ lên đường. Kìa, ngôi sao mà họ đã thấy ở phương đông[a] đi trước họ, cho đến khi nó đến và dừng lại phía trên chỗ đứa trẻ ở.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “khi ngôi sao mọc”; cụm từ Hy Lạp có thể chỉ phương đông như một khu vực hoặc hướng, hoặc chỉ lúc một ngôi sao mọc.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀκούσαντες τοῦ βασιλέως
  choice: Nghe vua nói xong
  rationale: Diễn đạt tự nhiên cấu trúc phân từ quá khứ đi trước động từ chính, đồng thời giữ nguyên cách gọi “vua” của bản Hy Lạp mà không tự ý thêm tên Hê-rốt.
- source_word: ἐπορεύθησαν
  choice: họ lên đường
  rationale: Diễn tả tự nhiên hành động rời đi và tiếp tục hành trình sau khi nghe vua nói.
- source_word: ἰδοὺ
  choice: Kìa
  rationale: Giữ dấu hiệu diễn ngôn gây chú ý và sắc thái sống động, bất ngờ của lời kể.
- source_word: ἀστὴρ
  choice: ngôi sao
  rationale: Nghĩa thông dụng và trực tiếp của từ Hy Lạp trong ngữ cảnh.
- source_word: ὃν εἶδον
  choice: mà họ đã thấy
  rationale: Từ “đã” làm rõ việc nhìn thấy xảy ra trước hành động ngôi sao đi trước họ.
- source_word: ἐν τῇ ἀνατολῇ
  choice: ở phương đông
  rationale: Giữ cách hiểu địa lý quen thuộc và tự nhiên; nghĩa thiên văn “khi nó mọc” được bảo lưu trong chú thích vì cụm Hy Lạp có thể mang cả hai nghĩa.
- source_word: προῆγεν αὐτούς
  choice: đi trước họ
  rationale: Bám sát hình ảnh của προάγω mà không giải thích quá mức cơ chế ngôi sao hướng dẫn họ.
- source_word: ἕως ἐλθὼν ἐστάθη
  choice: cho đến khi nó đến và dừng lại
  rationale: Thể hiện trình tự đến rồi đứng lại; “dừng lại” là cách nói tự nhiên trong tiếng Việt đối với chuyển động của ngôi sao.
- source_word: ἐπάνω οὗ ἦν
  choice: phía trên nơi ... ở
  rationale: Truyền đạt vị trí ở bên trên địa điểm mà câu Hy Lạp xác định.
- source_word: τὸ παιδίον
  choice: Hài Nhi
  rationale: Cách gọi trang trọng, quen thuộc trong văn cảnh Chúa Giê-su thời thơ ấu; vẫn diễn đạt παιδίον là một trẻ nhỏ mà không thêm độ tuổi cụ thể.
theological_decisions:
- issue: Ý nghĩa của ἐν τῇ ἀνατολῇ trong trình thuật về ngôi sao
  choice: ở phương đông
  alternative: khi nó mọc
  rationale: Cụm từ có thể chỉ phương đông như một khu vực hoặc hướng, cũng có thể chỉ lúc một thiên thể mọc. Bản chính dùng cách hiểu địa lý quen thuộc, còn chú thích bảo lưu nghĩa thiên văn để không âm thầm loại bỏ sự mơ hồ thật sự của nguyên văn.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, rõ ràng và trang trọng vừa phải. Dùng “Kìa” để giữ sức sống của lời kể; đặt dấu chú thích ngay sau cụm từ có nghĩa kép. “Hài Nhi” được viết hoa theo quy ước kính trọng trong ngữ cảnh, không nhằm thêm một khẳng định thần học ngoài câu.
