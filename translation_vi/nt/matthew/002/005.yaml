revisions:
- from: 'Họ thưa với vua: “Tại Bết-lê-hem thuộc miền Giu-đê, vì qua lời nhà tiên tri có chép rằng:”'
  to: 'Họ thưa với vua: “Ở Bết-lê-hem, thuộc xứ Giu-đê, vì đã có chép qua nhà tiên tri rằng:”'
  rationale: Chỉnh trật tự từ để «đã có chép qua nhà tiên tri» phản ánh rõ công thức γέγραπται διὰ τοῦ προφήτου, vẫn giữ sắc thái hoàn thành của «đã có chép» và tính trung gian của διά. Đổi «miền» thành «xứ» để định danh Giu-đê tự nhiên hơn. Dấu hai chấm được giữ vì nội dung lời tiên tri bắt đầu ở câu kế tiếp.
