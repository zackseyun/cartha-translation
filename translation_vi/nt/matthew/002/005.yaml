  text: οἱ δὲ εἶπαν αὐτῷ· Ἐν Βηθλέεμ τῆς Ἰουδαίας· οὕτως γὰρ γέγραπται διὰ τοῦ προφήτου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/005.yaml
  text: And they said to him[a], “In Bethlehem of Judea[b], for thus it has been written through the prophet:”
translation:
  language: vi
  text: 'Họ thưa với vua: “Ở Bết-lê-hem, thuộc xứ Giu-đê, vì đã có chép qua nhà tiên tri rằng:”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ δὲ εἶπαν αὐτῷ
  choice: Họ thưa với vua
  rationale: Mạo từ dùng như đại từ chỉ các thượng tế và các chuyên gia kinh luật ở câu trước. Trong ngữ cảnh họ đáp lời vua Hê-rốt, “thưa với vua” tự nhiên, trang trọng và làm rõ đối tượng của αὐτῷ mà không đổi nghĩa.
- source_word: Ἐν Βηθλέεμ τῆς Ἰουδαίας
  choice: Tại Bết-lê-hem thuộc miền Giu-đê
  rationale: ἐν chỉ địa điểm; sở hữu cách τῆς Ἰουδαίας xác định đây là Bết-lê-hem thuộc Giu-đê. “Tại” và “thuộc miền” là cách diễn đạt tiếng Việt rõ ràng, tự nhiên.
- source_word: οὕτως γὰρ
  choice: vì ... rằng
  rationale: γάρ nêu lý do cho câu trả lời, còn οὕτως hướng tới nội dung trích dẫn tiếp theo. Cấu trúc “vì ... có chép rằng” truyền đạt chức năng ấy tự nhiên trong tiếng Việt.
- source_word: γέγραπται
  choice: có chép
  rationale: Đây là thể hoàn thành bị động và là công thức quen thuộc khi dẫn Kinh Thánh. “Có chép” vừa gọn, vừa giữ ý văn bản đã được ghi lại và vẫn có giá trị.
- source_word: διὰ τοῦ προφήτου
  choice: qua lời nhà tiên tri
  rationale: διά với sở hữu cách diễn tả trung gian. “Qua lời nhà tiên tri” bảo tồn ý nhà tiên tri là người truyền đạt, đồng thời tránh cách nói tiếng Việt thiếu tự nhiên “qua nhà tiên tri” trong câu này.
theological_decisions:
- issue: Công thức nói về sự truyền đạt qua nhà tiên tri
  choice: qua lời nhà tiên tri
  alternative: do nhà tiên tri chép
  rationale: Bản dịch giữ sắc thái trung gian của διά, không xác quyết nhà tiên tri là nguồn tối hậu của lời được trích và cũng không thêm một chủ thể thần học không hiện diện trực tiếp trong câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “thưa” phù hợp khi các lãnh đạo tôn giáo trả lời vua; tên riêng được viết theo lối phiên âm quen thuộc trong tiếng Việt. Dấu hai chấm được giữ vì câu trích dẫn tiếp tục ở câu sau.
