  source_fidelity: 'Bản dịch truyền đạt đúng diễn tiến, cơn thịnh nộ của Hê-rốt, việc sai người sát hại, đối tượng là các bé trai, phạm vi địa lý và giới hạn tuổi. Tuy nhiên, “thời gian ông đã hỏi kỹ các nhà chiêm tinh” nghiêng về hành vi hỏi hơn là điều nguyên văn nói: Hê-rốt đã xác định/tra xét kỹ thời điểm từ họ.'
  naturalness: Văn phong nhìn chung hiện đại, rõ ràng. Dùng “thấy rằng ... nên” tự nhiên hơn cấu trúc “thấy mình đã ... thì”; đặt địa điểm trước giới hạn tuổi cũng theo sát cấu trúc nguyên ngữ và giảm khả năng hiểu lầm phạm vi bổ nghĩa.
  terminology: “Hê-rốt,” “Bết-lê-hem,” “các nhà chiêm tinh,” và “bị đánh lừa” phù hợp. Chú thích về μάγοι nên tránh mô tả quá hẹp là “học giả–chiêm tinh gia”; “các nhân vật thông thái/chiêm tinh từ phương Đông” vừa dễ hiểu vừa giữ độ mở lịch sử của thuật ngữ.
  issues:
