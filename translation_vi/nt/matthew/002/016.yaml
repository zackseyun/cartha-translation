  - severity: low
    issue: Cụm “học giả–chiêm tinh gia” trong chú thích a quá cụ thể.
    rationale: μάγοι là một thuật ngữ văn hóa-lịch sử có biên độ nghĩa; chú thích nên mô tả khái quát mà không ấn định họ là một nhóm “học giả” theo nghĩa hiện đại.
