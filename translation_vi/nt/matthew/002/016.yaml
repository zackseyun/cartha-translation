id: MAT.2.16
reference: Matthew 2:16
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Τότε Ἡρῴδης ἰδὼν ὅτι ἐνεπαίχθη ὑπὸ τῶν μάγων ἐθυμώθη λίαν, καὶ ἀποστείλας ἀνεῖλεν πάντας τοὺς παῖδας τοὺς ἐν Βηθλέεμ καὶ ἐν πᾶσι τοῖς ὁρίοις αὐτῆς ἀπὸ διετοῦς καὶ κατωτέρω, κατὰ τὸν χρόνον ὃν ἠκρίβωσεν παρὰ τῶν μάγων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/016.yaml
  text: Then Herod[a], seeing that he had been tricked by the magi, became very angry, and sending men, he killed all the boys in Bethlehem and in all its surrounding districts, from two years old and under[b], according to the time that he had determined from the magi.
translation:
  language: vi
  text: Bấy giờ, Hê-rốt thấy rằng mình đã bị các nhà chiêm tinh[a] đánh lừa[b] nên vô cùng tức giận. Ông sai người giết tất cả các bé trai ở Bết-lê-hem và trong toàn vùng phụ cận, từ hai tuổi trở xuống, căn cứ vào thời điểm ông đã xác định kỹ từ các nhà chiêm tinh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hy Lạp magoi, chỉ những nhân vật thông thái và gắn với chiêm tinh từ phương Đông; theo truyền thống thường được gọi là “các nhà thông thái” hoặc “các đạo sĩ.”
    reason: cultural_note
  - marker: b
    text: Cũng có thể dịch sát hơn là “bị chế nhạo” hoặc “bị đem ra làm trò cười.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Bấy giờ
  rationale: Liên từ thời gian mở đầu diễn biến kế tiếp; cách dịch này tự nhiên, trang trọng và giữ được trình tự của câu chuyện.
- source_word: Ἡρῴδης
  choice: Hê-rốt
  rationale: Phiên âm tên riêng theo cách dùng quen thuộc trong tiếng Việt.
- source_word: ἰδὼν ὅτι
  choice: thấy mình đã
  rationale: Diễn đạt sự nhận biết của Hê-rốt về điều đã xảy ra, đồng thời giữ mối liên hệ nguyên nhân với cơn giận tiếp theo.
- source_word: ἐνεπαίχθη
  choice: bị … đánh lừa
  rationale: Trong ngữ cảnh, các nhà chiêm tinh đã không trở lại báo tin, khiến Hê-rốt thấy mình bị qua mặt. Nghĩa sát hơn là “bị chế nhạo” được giữ trong chú thích.
- source_word: ὑπὸ τῶν μάγων
  choice: bị các nhà chiêm tinh
  rationale: μάγοι chỉ những nhân vật phương Đông gắn với học thuật và chiêm tinh; “nhà chiêm tinh” rõ nghĩa hơn với độc giả hiện đại mà không du nhập hình ảnh truyền thống không có trong câu.
- source_word: ἐθυμώθη λίαν
  choice: vô cùng tức giận
  rationale: Giữ cả ý nổi giận của động từ và mức độ nhấn mạnh của λίαν bằng cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: ἀποστείλας
  choice: Ông sai người
  rationale: Phân từ hàm ý Hê-rốt phái người thi hành việc giết chóc; thêm “người” là sự minh thị tự nhiên trong tiếng Việt.
- source_word: ἀνεῖλεν
  choice: giết
  rationale: Động từ ở đây có nghĩa trực tiếp là giết hoặc sát hại; “giết” rõ ràng và không giảm nhẹ hành động.
- source_word: πάντας τοὺς παῖδας
  choice: tất cả các bé trai
  rationale: Trong ngữ cảnh truy tìm một con trai và giới hạn tuổi, παῖδας chỉ các trẻ nam; “bé trai” tự nhiên và chính xác hơn “trẻ em”.
- source_word: τοὺς ἐν Βηθλέεμ καὶ ἐν πᾶσι τοῖς ὁρίοις αὐτῆς
  choice: ở Bết-lê-hem và toàn vùng phụ cận
  rationale: ὅρια ở đây nói đến địa hạt hoặc khu vực xung quanh Bết-lê-hem, không chỉ đường biên giới.
- source_word: ἀπὸ διετοῦς καὶ κατωτέρω
  choice: từ hai tuổi trở xuống
  rationale: Thành ngữ nêu giới hạn tuổi trên theo nghĩa bao gồm cả trẻ hai tuổi.
- source_word: κατὰ τὸν χρόνον ὃν ἠκρίβωσεν παρὰ τῶν μάγων
  choice: căn cứ vào thời gian ông đã hỏi kỹ các nhà chiêm tinh
  rationale: Diễn đạt việc Hê-rốt xác định kỹ mốc thời gian từ lời các nhà chiêm tinh; “căn cứ vào” giữ lực của κατά mà vẫn tự nhiên.
theological_decisions:
- issue: Cách gọi μάγοι
  choice: các nhà chiêm tinh
  alternative: các nhà thông thái; các đạo sĩ
  rationale: Từ Hy Lạp chỉ những học giả–chiêm tinh gia phương Đông. Lựa chọn này tránh gán cho họ địa vị vua hoặc một chức danh tôn giáo không được câu văn nêu ra; chú thích giữ nguyên thuật ngữ Hy Lạp để minh bạch.
- issue: Sắc thái của ἐνεπαίχθη
  choice: bị đánh lừa
  alternative: bị chế nhạo; bị qua mặt
  rationale: “Bị đánh lừa” truyền đạt hành động trong ngữ cảnh, còn “bị chế nhạo” phản ánh nghĩa sát hơn và được nêu trong chú thích, nhờ đó không xóa bỏ độ căng từ vựng của nguyên bản.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu dài Hy Lạp được tách thành hai câu tiếng Việt để sáng nghĩa, nhưng vẫn giữ nguyên trình tự hành động, tác nhân được sai đi, phạm vi địa lý, giới hạn tuổi và căn cứ thời gian.
