  text: 'Then what was spoken through Jeremiah the prophet was fulfilled[a], saying:'
translation:
  language: vi
  text: 'Bấy giờ, lời đã được phán qua nhà tiên tri Giê-rê-mi được ứng nghiệm, như sau:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τότε
  choice: Bấy giờ
  rationale: Trạng từ chỉ thời gian nối tiếp diễn biến; “Bấy giờ” tự nhiên trong văn kể trang trọng và giữ được mạch tường thuật.
- source_word: ἐπληρώθη
  choice: được ứng nghiệm
  rationale: Động từ aorist bị động của πληρόω trong công thức ứng nghiệm của Ma-thi-ơ; cách dịch này giữ nguyên ý niệm lời tiên tri đạt đến sự thực hiện.
- source_word: τὸ ῥηθὲν
  choice: điều đã được phán
  rationale: Phân từ có mạo từ được dùng như danh từ; “điều đã được phán” vừa tự nhiên vừa giữ sắc thái lời được tuyên phán.
- source_word: διὰ Ἰερεμίου
  choice: qua ... Giê-rê-mi
  rationale: διά với sở hữu cách chỉ tác nhân trung gian; “qua” cho thấy Giê-rê-mi là người truyền đạt lời tiên tri.
- source_word: τοῦ προφήτου
  choice: nhà tiên tri
  rationale: Cụm đồng vị xác định vai trò của Giê-rê-mi.
- source_word: λέγοντος
  choice: rằng
  rationale: Phân từ hiện tại mở đầu nội dung trích dẫn ở câu kế tiếp. Trong tiếng Việt, “rằng” là liên từ tự nhiên để dẫn lời và tránh cấu trúc gượng “nói rằng” sau mệnh đề bị động.
theological_decisions:
- issue: Công thức ứng nghiệm của Ma-thi-ơ
  choice: 'Giữ rõ ngôn ngữ ứng nghiệm: “được ứng nghiệm”'
  alternative: xảy ra để làm ứng nghiệm; làm ứng nghiệm lời
  rationale: Bản Hy Lạp trình bày lời đã được phán như chủ thể của động từ bị động, vì vậy bản dịch không thêm mục đích hay đổi tác thể.
- issue: Tác nhân truyền đạt lời tiên tri
  choice: “qua nhà tiên tri Giê-rê-mi”
  alternative: “bởi nhà tiên tri Giê-rê-mi”
  rationale: “Qua” bảo toàn sắc thái trung gian của διά mà không xác định thêm nguồn tối hậu của lời ngoài điều văn bản trực tiếp diễn đạt.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “phán” cho lời tiên tri và “ứng nghiệm” cho công thức đặc trưng của Ma-thi-ơ; giữ dấu hai chấm để dẫn sang lời trích ở câu 18.
