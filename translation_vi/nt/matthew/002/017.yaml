    issue: Liên kết «được ứng nghiệm rằng» không tự nhiên.
    rationale: Trong tiếng Việt, «rằng» thường dẫn nội dung của một động từ nói/phán hoặc mệnh đề tương đương, chứ không nối trực tiếp một cách tự nhiên với «được ứng nghiệm». Hy Lạp dùng λέγοντος để giới thiệu lời trích ở câu 18; «như sau:» chuyển chức năng này rõ và tự nhiên hơn.
  - severity: low
    issue: «điều đã được phán» kém tự nhiên hơn «lời đã được phán» trong công thức ứng nghiệm.
    rationale: Cả hai đều có thể chuyển τὸ ῥηθέν, nhưng «lời» hợp ngữ cảnh lời tiên tri và kết hợp tự nhiên với «được ứng nghiệm», không thu hẹp hay thêm nghĩa.
