id: MAT.2.11
reference: Matthew 2:11
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἐλθόντες εἰς τὴν οἰκίαν εἶδον τὸ παιδίον μετὰ Μαρίας τῆς μητρὸς αὐτοῦ, καὶ πεσόντες προσεκύνησαν αὐτῷ, καὶ ἀνοίξαντες τοὺς θησαυροὺς αὐτῶν προσήνεγκαν αὐτῷ δῶρα, χρυσὸν καὶ λίβανον καὶ σμύρναν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/011.yaml
  text: 'And when they came into the house[a], they saw the child with Mary his mother, and falling down they paid homage to him, and opening their treasures they offered him gifts: gold and frankincense and myrrh.'
translation:
  language: vi
  text: 'Họ vào nhà, thấy con trẻ cùng với Ma-ri, mẹ Người. Họ sụp xuống, bái lạy Người[a]. Rồi họ mở các kho tàng của mình và dâng lên Người những lễ vật: vàng, nhũ hương và một dược.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “thờ lạy Người”. Động từ Hy Lạp có thể chỉ sự thờ phượng hoặc một hành vi bày tỏ lòng tôn kính sâu xa, tùy theo ngữ cảnh.
    reason: alternative_reading
lexical_decisions:
- source_word: οἰκίαν
  choice: nhà
  rationale: Danh từ này chỉ một ngôi nhà hoặc nơi ở; “nhà” là cách dịch trực tiếp, tự nhiên và không thêm suy diễn.
- source_word: παιδίον
  choice: con trẻ
  rationale: Từ Hy Lạp chỉ một đứa trẻ hoặc trẻ nhỏ. “Con trẻ” vừa chính xác, trang trọng vừa không xác định tuổi hay giới tính quá mức.
- source_word: μετὰ Μαρίας τῆς μητρὸς αὐτοῦ
  choice: cùng với Ma-ri, mẹ Người
  rationale: Giữ quan hệ “cùng với” và thành phần đồng vị xác định Ma-ri là mẹ của con trẻ.
- source_word: πεσόντες
  choice: sụp xuống
  rationale: Diễn tả rõ tư thế hạ mình xuống trước hành động bái lạy, đồng thời giữ sắc thái sinh động của phân từ Hy Lạp.
- source_word: προσεκύνησαν
  choice: bái lạy
  rationale: “Bái lạy” diễn tả hành vi tôn kính sâu xa mà không buộc ngữ cảnh phải chỉ mang nghĩa thờ phượng; khả năng dịch “thờ lạy” được giữ trong chú thích.
- source_word: θησαυροὺς
  choice: các kho báu của mình
  rationale: Giữ nghĩa rộng của số nhiều θησαυροί, có thể chỉ nơi chứa hoặc những vật quý, mà không cụ thể hóa thành “rương” hay “tráp”.
- source_word: προσήνεγκαν
  choice: dâng lên
  rationale: Phù hợp với hành động long trọng trao lễ vật, đồng thời tự nhiên trong tiếng Việt.
- source_word: δῶρα
  choice: những lễ vật
  rationale: “Lễ vật” diễn tả quà được kính cẩn dâng tặng trong ngữ cảnh này, nhưng không nhất thiết biến chúng thành lễ vật tế tự.
- source_word: λίβανον
  choice: nhũ hương
  rationale: Tên gọi chính xác trong tiếng Việt của frankincense, loại nhựa thơm được nói đến ở đây.
- source_word: σμύρναν
  choice: một dược
  rationale: Tên gọi truyền thống và chính xác trong tiếng Việt của myrrh.
theological_decisions:
- issue: Sắc thái của προσκυνέω đối với con trẻ Giê-su
  choice: bái lạy
  alternative: thờ lạy
  rationale: Trong ngữ cảnh, hành động có thể được hiểu là sự tôn kính dành cho một vị vua, đồng thời cũng có thể mang sức nặng của sự thờ phượng. Bản văn chính dùng “bái lạy” để giữ độ rộng ngữ nghĩa, còn chú thích bảo lưu cách hiểu “thờ lạy”.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “Người” để quy chiếu con trẻ Giê-su một cách tôn kính; giữ nhịp kể rõ ràng và đặt dấu chú thích ngay sau cụm từ mà chú thích giải thích.
