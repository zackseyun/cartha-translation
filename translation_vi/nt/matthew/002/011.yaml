  terminology: “Con trẻ,” “Ma-ri,” “nhũ hương,” và “một dược” đều phù hợp. “Bái lạy” giữ được tính mơ hồ giữa hành vi tôn kính sâu xa và sự thờ phượng; chú thích được đặt đúng neo. “Lễ vật” trong văn cảnh dâng tặng trang trọng vẫn chấp nhận được cho δῶρα.
