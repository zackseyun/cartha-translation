  rationale: Thay “triệu tập” bằng “tập hợp” và “dò hỏi” bằng “hỏi” để tránh thêm sắc thái không được phát biểu trong tiếng Hy Lạp. Các yếu tố còn lại, gồm tước hiệu “Đấng Mê-si,” mệnh đề chỉ nơi chốn, và chú thích, được giữ vì phản ánh trung thành nguồn văn và tự nhiên trong tiếng Việt hiện đại.
