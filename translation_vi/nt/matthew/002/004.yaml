id: MAT.2.4
reference: Matthew 2:4
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ συναγαγὼν πάντας τοὺς ἀρχιερεῖς καὶ γραμματεῖς τοῦ λαοῦ ἐπυνθάνετο παρ’ αὐτῶν ποῦ ὁ χριστὸς γεννᾶται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/004.yaml
  text: And gathering together all the chief priests and scribes of the people[a], he was inquiring of them where the Messiah was to be born.
translation:
  language: vi
  text: Sau khi tập hợp tất cả các thượng tế và các kinh sư của dân, ông hỏi họ Đấng Mê-si[a] sẽ sinh ra ở đâu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “Đấng Ki-tô.” Từ Hy Lạp Χριστός có nghĩa là “Đấng được xức dầu.”
    reason: Nêu cách dịch tương đương của tước hiệu và làm rõ ý nghĩa nguyên ngữ.
lexical_decisions:
- source_word: συναγαγὼν
  choice: sau khi triệu tập
  rationale: Phân từ bất định quá khứ diễn tả hành động xảy ra trước động từ chính; cách dịch này tự nhiên trong tiếng Việt và giữ rõ trình tự hành động.
- source_word: πάντας
  choice: tất cả
  rationale: Giữ nguyên ý bao quát của từ Hy Lạp.
- source_word: ἀρχιερεῖς
  choice: các thượng tế
  rationale: Chỉ giới lãnh đạo tư tế cấp cao, không hàm ý có nhiều người đồng thời giữ chức thầy tế lễ thượng phẩm duy nhất.
- source_word: γραμματεῖς
  choice: các kinh sư
  rationale: Thuật ngữ quen thuộc và chính xác cho những người chuyên thông thạo, sao chép và giải thích Kinh Luật.
- source_word: τοῦ λαοῦ
  choice: của dân chúng
  rationale: Giữ cấu trúc sở thuộc của nguyên văn mà không thêm lời giải thích sắc tộc.
- source_word: ἐπυνθάνετο παρ’ αὐτῶν
  choice: ông dò hỏi họ
  rationale: “Dò hỏi” truyền đạt sắc thái tìm hiểu thông tin; trong tiếng Việt, giới từ παρά được thể hiện tự nhiên qua cấu trúc động từ–tân ngữ. Dạng quá khứ chưa hoàn thành được chuyển theo lối kể tự nhiên, không cường điệu thành hành động lặp lại.
- source_word: ποῦ
  choice: ở đâu
  rationale: Cách dịch trực tiếp và tự nhiên của trạng từ nghi vấn chỉ nơi chốn.
- source_word: ὁ χριστὸς
  choice: Đấng Mê-si
  rationale: Trong bối cảnh này, Χριστός là tước hiệu của vị vua được xức dầu mà dân Do Thái trông đợi, không phải tên riêng.
- source_word: γεννᾶται
  choice: sẽ sinh ra
  rationale: Thì hiện tại bị động nằm trong câu hỏi gián tiếp về nơi sinh được tiên báo của Đấng Mê-si; tiếng Việt tự nhiên dùng “sẽ” để diễn đạt định hướng tương lai trong ngữ cảnh ấy.
theological_decisions:
- issue: Cách dịch tước hiệu Χριστός
  choice: Đấng Mê-si
  alternative: Đấng Ki-tô
  rationale: Ngữ cảnh nói đến vị được xức dầu mà lời tiên tri Do Thái mong đợi. “Đấng Mê-si” giữ rõ bối cảnh Do Thái và chức năng tước hiệu, trong khi chú thích bảo lưu cách gọi tương đương “Đấng Ki-tô”.
translation_notes:
  register: Văn phong hiện đại, trang trọng nhưng dễ hiểu. Dùng “kinh sư” và “thượng tế” là các thuật ngữ Kinh Thánh phổ thông; đại từ “ông” tiếp nối chủ thể Hê-rốt từ văn cảnh mà không thêm danh xưng không có trong câu Hy Lạp.
