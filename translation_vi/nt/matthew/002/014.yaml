  - severity: low
    issue: “liền” diễn giải δέ mạnh hơn cần thiết.
    rationale: δέ là từ nối nhẹ để tiếp tục trình thuật; có thể dịch tự nhiên bằng cách không thêm từ nối mang nghĩa lập tức.
  - severity: medium
    issue: “lánh sang” đưa sắc thái tránh né vào động từ chính.
    rationale: ἀναχωρέω có thể mang nghĩa rút/lánh trong một số ngữ cảnh, nhưng nghĩa an toàn và trực tiếp ở đây là rời đi hoặc lên đường. Bối cảnh giải thích động cơ, còn động từ không cần bị diễn giải mạnh trong bản dịch.
  - severity: low
