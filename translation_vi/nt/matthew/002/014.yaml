  register: Văn phong thuật chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Cấu trúc câu giữ trình tự hành động của bản Hy Lạp; cụm “mẹ của con trẻ” ưu tiên sự rõ nghĩa hơn lối dùng đại từ có thể mơ hồ trong tiếng Việt.
