  text: ὁ δὲ ἐγερθεὶς παρέλαβε τὸ παιδίον καὶ τὴν μητέρα αὐτοῦ νυκτὸς καὶ ἀνεχώρησεν εἰς Αἴγυπτον,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/014.yaml
  text: So he got up[a], took the child and his mother during the night, and departed for Egypt.
translation:
  language: vi
  text: Ông đứng dậy, đem con trẻ và mẹ của con trẻ đi trong đêm, rồi lên đường sang Ai Cập.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: liền
  rationale: δέ là liên từ nhẹ tiếp nối diễn biến; “liền” tạo mạch kể tự nhiên và cho thấy Giô-sép thực hiện ngay lời truyền trước đó mà không làm quan hệ nhân quả trở nên quá mạnh.
- source_word: ἐγερθεὶς
  choice: trỗi dậy
  rationale: Phân từ bất định quá khứ diễn tả hành động đứng dậy để thi hành mệnh lệnh. “Trỗi dậy” trang trọng, tự nhiên trong văn thuật chuyện Kinh Thánh và không nhất thiết thu hẹp nghĩa thành chỉ tỉnh ngủ.
- source_word: παρέλαβε
  choice: đem ... đi
  rationale: Trong ngữ cảnh này, παραλαμβάνω có nghĩa đem người khác đi cùng mình. “Đem ... đi” diễn đạt rõ nét nghĩa ấy hơn “nhận lấy”.
- source_word: τὸ παιδίον
  choice: con trẻ
  rationale: παιδίον chỉ một đứa trẻ. “Con trẻ” là cách gọi dễ hiểu, có sắc thái trang trọng vừa phải và không thêm tuổi cụ thể.
- source_word: τὴν μητέρα αὐτοῦ
  choice: mẹ của con trẻ
  rationale: Đại từ αὐτοῦ quy chiếu tự nhiên về con trẻ. Lặp lại “con trẻ” giúp tiếng Việt tránh khả năng hiểu lầm là mẹ của Giô-sép.
- source_word: νυκτὸς
  choice: ngay trong đêm
  rationale: Sở hữu cách chỉ thời gian cho biết hành động diễn ra ban đêm. “Ngay trong đêm” vừa tự nhiên vừa truyền đạt tính tức thời trong mạch văn.
- source_word: ἀνεχώρησεν
  choice: lánh sang
  rationale: ἀναχωρέω có thể nghĩa là rời đi hoặc lui/lánh đi. Trong bối cảnh trốn khỏi hiểm nguy, “lánh sang” giữ được sắc thái rút đi mà không diễn giải quá mức.
- source_word: εἰς Αἴγυπτον
  choice: sang Ai Cập
  rationale: εἰς biểu thị chuyển động hướng đến một nơi. Với động từ “lánh”, “sang Ai Cập” là cách nói tự nhiên trong tiếng Việt.
theological_decisions: []
