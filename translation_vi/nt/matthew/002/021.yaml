id: MAT.2.21
reference: Matthew 2:21
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὁ δὲ ἐγερθεὶς παρέλαβε τὸ παιδίον καὶ τὴν μητέρα αὐτοῦ καὶ ⸀εἰσῆλθεν εἰς γῆν Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/021.yaml
  text: So he rose, took the child and his mother, and entered the land of Israel.
translation:
  language: vi
  text: Ông liền trỗi dậy, đem con trẻ và mẹ con trẻ theo, rồi đi vào đất Israel.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: liền
  rationale: Trong mạch kể chuyện, δέ đánh dấu diễn tiến hơn là sự tương phản; “liền” nối tự nhiên với mệnh lệnh trước đó và diễn tả hành động tiếp nối.
- source_word: ἐγερθεὶς
  choice: trỗi dậy
  rationale: Phân từ aorist thụ động ở đây có nghĩa nội động là đứng dậy; “trỗi dậy” trang trọng vừa phải và phù hợp văn kể Kinh Thánh hiện đại.
- source_word: παρέλαβε
  choice: đem ... theo
  rationale: παραλαμβάνω ở đây có nghĩa đưa người khác đi cùng mình; “đem ... theo” truyền đạt rõ sắc thái này hơn từ đơn thuần “đem” hoặc “nhận”.
- source_word: τὸ παιδίον
  choice: con trẻ
  rationale: παιδίον chỉ một đứa trẻ, không nhất thiết hàm ý trẻ sơ sinh; “con trẻ” tự nhiên trong văn cảnh và không thêm độ tuổi cụ thể.
- source_word: τὴν μητέρα αὐτοῦ
  choice: mẹ con trẻ
  rationale: Đại từ αὐτοῦ quy chiếu tự nhiên về con trẻ. Lặp lại “con trẻ” tránh sự mơ hồ mà đại từ “mẹ nó” có thể gây ra trong tiếng Việt.
- source_word: εἰσῆλθεν
  choice: đi vào
  rationale: εἰσέρχομαι diễn tả việc vào một nơi; “đi vào” tự nhiên trong tiếng Việt và giữ hướng chuyển động của câu.
- source_word: εἰς γῆν Ἰσραήλ
  choice: đất Israel
  rationale: Cụm từ chỉ lãnh thổ gắn với Israel; “đất Israel” ngắn gọn, rõ nghĩa và giữ sắc thái địa lý-dân tộc của nguyên văn.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng nhưng dễ hiểu. Giữ cách gọi “con trẻ” và cấu trúc nhấn vào con trẻ trước người mẹ như nguyên văn; không thêm tên Giô-sép hay Ma-ri vì câu Hy Lạp không nêu tên.
