  source_fidelity: Bản dịch chuyển đạt đầy đủ tiến trình tự sự của δέ, phân từ ἐγερθείς («trỗi dậy»), hành động παραλαμβάνω («đem ... theo»), và việc đi vào «đất Israel». «Mẹ con trẻ» làm rõ đúng quy chiếu của αὐτοῦ về con trẻ, không thêm tên riêng hay chi tiết diễn giải.
