id: MAT.2.13
reference: Matthew 2:13
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἀναχωρησάντων δὲ αὐτῶν ἰδοὺ ἄγγελος κυρίου ⸂φαίνεται κατ’ ὄναρ⸃ τῷ Ἰωσὴφ λέγων· Ἐγερθεὶς παράλαβε τὸ παιδίον καὶ τὴν μητέρα αὐτοῦ καὶ φεῦγε εἰς Αἴγυπτον, καὶ ἴσθι ἐκεῖ ἕως ἂν εἴπω σοι· μέλλει γὰρ Ἡρῴδης ζητεῖν τὸ παιδίον τοῦ ἀπολέσαι αὐτό.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/013.yaml
  text: After they had departed[a], behold, an angel of the Lord appeared to Joseph in a dream, saying, “Get up, take the child and his mother, and flee to Egypt, and stay there until I tell you[c][b]; for Herod is about to seek the child in order to destroy him.”
translation:
  language: vi
  text: 'Sau khi họ đi khỏi, kìa, một thiên sứ của Chúa hiện ra với Giô-sép trong giấc mơ và nói: “Hãy đứng dậy, đem đứa trẻ và mẹ em ấy, rồi chạy trốn sang Ai Cập; cứ ở đó cho đến khi ta bảo, vì Hê-rốt sắp tìm đứa trẻ để giết em ấy.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀναχωρησάντων δὲ αὐτῶν
  choice: Sau khi họ đi khỏi
  rationale: Cụm sở hữu cách tuyệt đối diễn tả hành động xảy ra trước; cách dịch này tự nhiên và giữ đúng trình tự thời gian. “Họ” chỉ những nhà thông thái vừa được nhắc đến.
- source_word: ἰδοὺ
  choice: kìa
  rationale: Giữ dấu hiệu trần thuật sống động của Ma-thi-ơ, báo hiệu một sự can thiệp bất ngờ từ Đức Chúa Trời.
- source_word: ἄγγελος κυρίου
  choice: một thiên sứ của Chúa
  rationale: Danh từ không có mạo từ được dịch theo nghĩa bất định; “của Chúa” giữ danh xưng κύριος mà không thu hẹp căn tính của thiên sứ.
- source_word: φαίνεται κατ’ ὄναρ τῷ Ἰωσὴφ
  choice: hiện ra với Giô-sép trong giấc mơ
  rationale: Thì hiện tại lịch sử được chuyển thành lối kể quá khứ tự nhiên trong tiếng Việt; κατ’ ὄναρ là thành ngữ chỉ sự hiện thấy trong giấc mơ.
- source_word: Ἐγερθεὶς παράλαβε
  choice: Hãy trỗi dậy, đem
  rationale: Phân từ Ἐγερθεὶς nằm trong chuỗi mệnh lệnh nên được diễn đạt như lời truyền bảo; παράλαβε mang nghĩa đem theo mình.
- source_word: τὸ παιδίον καὶ τὴν μητέρα αὐτοῦ
  choice: con trẻ cùng mẹ Người
  rationale: 'Giữ thứ tự và trọng tâm của nguyên văn: đứa trẻ được nêu trước, rồi đến mẹ của Người. “Người” là đại từ tôn kính theo văn phong Kinh Thánh tiếng Việt.'
- source_word: φεῦγε εἰς Αἴγυπτον
  choice: trốn sang Ai Cập
  rationale: Diễn đạt rõ sự cấp bách và việc tránh hiểm nguy; “sang Ai Cập” tự nhiên trong tiếng Việt.
- source_word: ἴσθι ἐκεῖ ἕως ἂν εἴπω σοι
  choice: cứ ở đó cho đến khi ta bảo
  rationale: ἴσθι ἐκεῖ có nghĩa tiếp tục ở lại; cấu trúc với ἕως ἂν chỉ một thời điểm tương lai chưa xác định.
- source_word: μέλλει γὰρ Ἡρῴδης ζητεῖν
  choice: vì Hê-rốt sắp tìm
  rationale: μέλλει với động từ nguyên mẫu diễn tả ý định hoặc hành động sắp xảy ra, nên “sắp” bảo toàn sắc thái cận kề.
- source_word: τοῦ ἀπολέσαι αὐτό
  choice: để giết Người
  rationale: ἀπόλλυμι cơ bản là hủy diệt/làm cho chết; trong ngữ cảnh Hê-rốt truy tìm đứa trẻ, nghĩa cụ thể và tự nhiên là giết.
theological_decisions:
- issue: Cách dịch κύριος trong ἄγγελος κυρίου
  choice: Chúa
  alternative: Chủ
  rationale: “Chúa” là danh xưng tự nhiên và quen thuộc trong ngữ cảnh Kinh Thánh, đồng thời không ép cụm từ này thành một nhận định hẹp hơn về căn tính của thiên sứ.
- issue: Tính xác định của ἄγγελος κυρίου
  choice: một thiên sứ của Chúa
  alternative: thiên sứ của Chúa
  rationale: ἄγγελος không có mạo từ nên bản dịch dùng “một”; tuy nhiên tiếng Việt cũng có thể tự nhiên lược bỏ từ chỉ bất định mà không nhất thiết biến cụm này thành xác định.
- issue: Ý nghĩa của ἀπολέσαι đối với con trẻ
  choice: giết Người
  alternative: hủy diệt Người
  rationale: Trong ngữ cảnh này từ chỉ việc làm cho con trẻ chết. “Giết” diễn đạt đúng kết quả cụ thể, không giảm nhẹ ý định sát hại của Hê-rốt.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ “kìa” để tái hiện nét kể chuyện nổi bật của nguyên văn; dùng “trỗi dậy” thay cho lối cổ hơn như “chỗi dậy”. Không thêm chú thích vì các lựa chọn quan trọng có thể được thể hiện rõ trong chính câu dịch mà không cần gây gián đoạn.
