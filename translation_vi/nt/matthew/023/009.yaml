id: MAT.23.9
reference: Matthew 23:9
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ πατέρα μὴ καλέσητε ὑμῶν ἐπὶ τῆς γῆς, εἷς γάρ ἐστιν ⸂ὑμῶν ὁ πατὴρ⸃ ὁ ⸀οὐράνιος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/009.yaml
  text: And call no man on earth your father[a], for one is your Father[b], the heavenly One.
translation:
  language: vi
  text: Đừng gọi bất cứ ai trên đất là cha mình[a], vì anh em chỉ có một Cha, là Cha trên trời[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Đừng gọi ai trên đất là cha của anh em.”'
    reason: lexical_alternative
  - marker: b
    text: 'Hoặc: “vì một Đấng là Cha của anh em, Đấng thiên thượng,” hoặc “vì anh em chỉ có một Cha, là Đấng ở trên trời.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: πατέρα μὴ καλέσητε
  choice: Đừng gọi ai ... là cha
  rationale: Μή với động từ ở thể giả định aorist tạo thành lời cấm. Cách diễn đạt này tự nhiên trong tiếng Việt và giữ nguyên sự trực tiếp của mệnh lệnh; không thêm lời giải thích rằng đây chỉ là cách xưng hô mang tính tôn kính.
- source_word: ὑμῶν
  choice: của mình
  rationale: Đại từ sở hữu liên hệ với những người được ngỏ lời. “Của mình” tự nhiên sau cấu trúc “gọi ai ... là,” đồng thời tránh cách nói gượng “cha của các con” trong vế cấm.
- source_word: ἐπὶ τῆς γῆς
  choice: trên đất
  rationale: Diễn đạt phạm vi thuộc trần thế, đối lập với Đấng ở trên trời; ngắn gọn và sát nghĩa.
- source_word: εἷς γάρ ἐστιν ὑμῶν ὁ πατήρ
  choice: vì các con chỉ có một Cha
  rationale: Giữ ý số lượng “một” và diễn đạt tự nhiên quan hệ sở hữu của ὑμῶν. “Chỉ” làm rõ tính độc nhất vốn do εἷς và ngữ cảnh phủ định biểu đạt, không thêm một nhân vật hay khái niệm mới.
- source_word: ὁ οὐράνιος
  choice: Đấng ở trên trời
  rationale: Tính từ có mạo từ được dùng theo lối danh từ hóa để xác định “Cha.” Cách dịch này giữ lối diễn đạt có phần cô đọng của tiếng Hy Lạp mà vẫn rõ ràng, đồng thời không buộc phải lặp lại “Cha”.
theological_decisions:
- issue: Phạm vi của lệnh cấm gọi người khác là “cha”
  choice: Giữ lời cấm trực tiếp và không giải nghĩa phạm vi ngay trong câu.
  alternative: Diễn giải thành lệnh cấm tuyệt đối mọi cách dùng từ “cha,” hoặc thu hẹp rõ thành lệnh cấm một tước hiệu tôn giáo.
  rationale: Nguyên văn có lời cấm mạnh nhưng không tự giải quyết mối liên hệ với cách gọi cha ruột hay cách dùng xã hội thông thường. Bản dịch vì thế bảo tồn sức nặng và sự căng thẳng thần học thay vì áp đặt một cách giải thích.
- issue: Cách hiểu ὁ οὐράνιος
  choice: Dịch là “Đấng ở trên trời.”
  alternative: “Cha trên trời” hoặc “Đấng thuộc trời.”
  rationale: Cả cách hiểu như tính từ chỉ phẩm tính và như cách nói về nơi ngự đều có thể được cân nhắc. Cách dịch chính tự nhiên trong tiếng Việt, phù hợp sự đối lập với “trên đất,” còn phương án sát hình thức hơn được ghi chú.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “các con” để thể hiện số nhiều của ὑμῶν trong lời Chúa Giê-su nói với các môn đồ và đám đông; viết hoa “Cha” và “Đấng” khi chỉ về Đức Chúa Trời. Các dấu chú thích [a], [b] đều xuất hiện trong chính văn.
