id: MAT.23.18
reference: Matthew 23:18
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καί· Ὃς ⸀ἂν ὀμόσῃ ἐν τῷ θυσιαστηρίῳ, οὐδέν ἐστιν, ὃς δ’ ἂν ὀμόσῃ ἐν τῷ δώρῳ τῷ ἐπάνω αὐτοῦ ὀφείλει.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/018.yaml
  text: And[a], ‘Whoever swears by the altar, it is nothing[b]; but whoever swears by the gift on top of it is obligated.’
translation:
  language: vi
  text: 'Và: “Ai thề lấy bàn thờ thì lời thề ấy không có giá trị[a]; nhưng ai thề lấy lễ vật[b] ở trên đó thì bị ràng buộc.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nghĩa là, theo lối dạy mà Đức Giê-su đang lên án, lời thề lấy bàn thờ làm chứng bị xem là không có giá trị, còn lời thề lấy lễ vật trên đó làm chứng lại được coi là có tính ràng buộc.
    reason: cultural_note
  - marker: b
    text: Từ Hy Lạp cũng có thể dịch là “vật dâng”; từ này chỉ món quà được dâng lên Đức Chúa Trời trong đền thờ.
    reason: lexical_alternative
lexical_decisions:
- source_word: καί
  choice: Lại nữa
  rationale: Tiếp nối chuỗi lời dạy mà Đức Giê-su đang trích dẫn để lên án; cách nối này tự nhiên trong tiếng Việt và thể hiện ý bổ sung.
- source_word: Ὃς ἂν ... ὀμόσῃ / ὃς δ’ ἂν ... ὀμόσῃ
  choice: Ai ... mà thề / nhưng ai ... mà thề
  rationale: Cấu trúc ὅς + ἄν với động từ giả định diễn tả một trường hợp tổng quát, bất định; “ai ... mà” giữ được sắc thái ấy trong tiếng Việt hiện đại.
- source_word: ἐν τῷ θυσιαστηρίῳ
  choice: lấy bàn thờ mà thề
  rationale: Trong công thức thề, ἐν chỉ đối tượng được viện dẫn để thề; “lấy ... mà thề” là cách diễn đạt tự nhiên và chính xác trong tiếng Việt.
- source_word: θυσιαστήριον
  choice: bàn thờ
  rationale: Từ tương đương thông dụng, chính xác cho bàn thờ dâng sinh tế trong bối cảnh đền thờ.
- source_word: οὐδέν ἐστιν
  choice: chẳng kể là gì
  rationale: Giữ hình ảnh diễn đạt ngắn gọn của nguyên văn, đồng thời truyền đạt rằng theo quan niệm đang bị lên án, lời thề ấy không được tính là có hiệu lực.
- source_word: ἐν τῷ δώρῳ
  choice: lấy lễ vật ... mà thề
  rationale: δῶρον có nghĩa căn bản là quà tặng, nhưng trong bối cảnh bàn thờ chỉ vật được dâng cho Đức Chúa Trời; “lễ vật” tự nhiên và rõ nghĩa hơn “quà tặng” trong tiếng Việt.
- source_word: τῷ ἐπάνω αὐτοῦ
  choice: ở trên bàn thờ
  rationale: Diễn đạt vị trí của lễ vật trên bàn thờ và làm rõ sở chỉ của đại từ αὐτοῦ mà không thay đổi nội dung.
- source_word: ὀφείλει
  choice: bị ràng buộc
  rationale: Trong bối cảnh lời thề, động từ chỉ tình trạng phải có trách nhiệm hoặc nghĩa vụ; cách dịch này giữ nguyên việc nguyên văn không nói rõ bổ ngữ của nghĩa vụ.
theological_decisions:
- issue: Bổ ngữ hàm ẩn của ὀφείλει trong công thức thề
  choice: bị ràng buộc
  alternative: phải giữ lời thề ấy
  rationale: Nguyên văn không nêu rõ người ấy bị ràng buộc phải làm gì. Bản dịch chính giữ sự cô đọng và độ mở này, thay vì thêm lời giải thích “phải giữ lời thề” vào câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Lấy ... mà thề” phù hợp với cách nói tiếng Việt về việc viện dẫn một đối tượng làm chứng cho lời thề; “chẳng kể là gì” giữ nét súc tích, hơi nghịch lý của lời dạy đang được trích dẫn.
