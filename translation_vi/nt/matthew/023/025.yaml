id: MAT.23.25
reference: Matthew 23:25
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Οὐαὶ ὑμῖν, γραμματεῖς καὶ Φαρισαῖοι ὑποκριταί, ὅτι καθαρίζετε τὸ ἔξωθεν τοῦ ποτηρίου καὶ τῆς παροψίδος, ἔσωθεν δὲ γέμουσιν ἐξ ἁρπαγῆς καὶ ⸀ἀκρασίας.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/025.yaml
  text: Woe to you[a], scribes and Pharisees, hypocrites! For you clean the outside of the cup and the dish, but inside they are full of greed and self-indulgence.
translation:
  language: vi
  text: Khốn cho các ông, các kinh sư và người Pha-ri-si, là những kẻ giả hình! Vì các ông rửa sạch bên ngoài chén và đĩa, nhưng bên trong chúng thì đầy dẫy sự tham lam và buông thả[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đầy dẫy cướp bóc/bóc lột và thiếu tự chủ.” Các từ Hy Lạp có thể mang sắc thái mạnh hơn, chỉ hành vi chiếm đoạt và sự buông thả không được kiềm chế.'
    reason: Bảo lưu những khả năng từ vựng mạnh hơn của ἁρπαγή và ἀκρασία, đồng thời giữ quan hệ liên kết giữa hai từ trong nguyên ngữ.
lexical_decisions:
- source_word: Οὐαὶ
  choice: Khốn cho
  rationale: Giữ được sắc thái tuyên án mạnh mẽ của lời quở trách mang tính ngôn sứ, thay vì làm nhẹ thành một lời than tiếc.
- source_word: γραμματεῖς
  choice: các kinh sư
  rationale: Thuật ngữ quen thuộc, ngắn gọn và phù hợp với vai trò của những người thông thạo, giảng dạy Luật trong bối cảnh các sách Phúc Âm.
- source_word: Φαρισαῖοι
  choice: người Pha-ri-si
  rationale: Dùng tên gọi đã quen thuộc trong tiếng Việt cho nhóm tôn giáo này.
- source_word: ὑποκριταί
  choice: những kẻ giả hình
  rationale: Diễn đạt trực tiếp sự giả dối về đạo đức và tôn giáo, đồng thời giữ sức nặng của lời quở trách.
- source_word: καθαρίζετε
  choice: rửa sạch
  rationale: Tự nhiên trong tiếng Việt khi nói về chén đĩa và truyền đạt rõ hành động làm sạch.
- source_word: τὸ ἔξωθεν
  choice: bên ngoài
  rationale: Giữ nguyên sự tương phản không gian với ἔσωθεν, tức “bên trong”.
- source_word: ποτηρίου
  choice: chén
  rationale: Tương đương thông dụng và thích hợp với dụng cụ dùng trên bàn ăn.
- source_word: παροψίδος
  choice: đĩa
  rationale: Cách gọi rộng và tự nhiên cho vật đựng thức ăn; không xác định quá mức hình dáng của vật dụng.
- source_word: ἔσωθεν
  choice: bên trong
  rationale: Giữ rõ hình ảnh đối lập giữa phần ngoài đã được rửa sạch và phần trong ô uế.
- source_word: γέμουσιν
  choice: chúng đầy
  rationale: Động từ Hy Lạp ở số nhiều, quy chiếu tự nhiên đến cả chén lẫn đĩa; đại từ “chúng” bảo toàn cấu trúc hình ảnh này.
- source_word: ἁρπαγῆς
  choice: tham lam
  rationale: Trong lời tố cáo về sự ô uế bên trong, “tham lam” diễn đạt tự nhiên thói chiếm đoạt vì lòng ham muốn; chú thích bảo lưu các nghĩa mạnh hơn như cướp bóc hoặc bóc lột.
- source_word: ἀκρασίας
  choice: buông thả
  rationale: Diễn đạt tình trạng không kiềm chế dục vọng và chiều theo bản thân; ngắn gọn, tự nhiên và phù hợp với cặp tật xấu trong câu.
theological_decisions:
- issue: Đối tượng mang sự ô uế ở bên trong
  choice: 'Giữ chén và đĩa làm chủ thể của hình ảnh: “bên trong chúng đầy...”'
  alternative: Diễn giải trực tiếp thành “bên trong các ông đầy...”
  rationale: Cú pháp Hy Lạp dùng động từ số nhiều quy chiếu đến chén và đĩa. Dù hình ảnh rõ ràng ám chỉ các lãnh đạo tôn giáo, bản dịch không nên tự ý thay hình ảnh bằng phần diễn giải.
- issue: Sắc thái của ἁρπαγῆς và ἀκρασίας
  choice: Dùng “tham lam và buông thả” trong chính văn, kèm chú thích về các nghĩa mạnh hơn
  alternative: Dịch thẳng là “cướp bóc/bóc lột và thiếu tự chủ”
  rationale: Hai từ Hy Lạp cho phép hiểu cả tật xấu nội tâm lẫn hành vi chiếm đoạt và sự quá độ. Chính văn ưu tiên cách diễn đạt tự nhiên nhưng chú thích bảo tồn độ mạnh và sự rộng nghĩa của nguyên ngữ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Các ông” thể hiện lời nói trực tiếp mang tính quở trách; “khốn cho” và “những kẻ giả hình” giữ nguyên sức nặng của câu tuyên án. Hình ảnh bên ngoài/bên trong của chén và đĩa được bảo toàn, không diễn giải thành “tấm lòng” trong chính văn.
