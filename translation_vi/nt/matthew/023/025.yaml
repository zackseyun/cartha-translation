  rationale: Chỉ điều chỉnh nhẹ cách diễn đạt trong chính văn để câu tiếng Việt trôi chảy hơn, và sửa chú thích để phân biệt rõ các nghĩa thay thế của ἁρπαγή mà không làm mờ liên từ “và” của nguyên ngữ. Hình ảnh chén và đĩa vẫn được giữ làm chủ thể của mệnh đề “bên trong chúng.”
