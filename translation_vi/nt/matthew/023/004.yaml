source:
  edition: SBLGNT
  text: δεσμεύουσιν ⸀δὲ φορτία ⸀βαρέα καὶ ἐπιτιθέασιν ἐπὶ τοὺς ὤμους τῶν ἀνθρώπων, ⸂αὐτοὶ δὲ τῷ⸃ δακτύλῳ αὐτῶν οὐ θέλουσιν κινῆσαι αὐτά.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/004.yaml
  text: They tie up heavy burdens and lay them on the shoulders of men[a], but they themselves are unwilling to move them with their finger.
translation:
  language: vi
  text: Họ bó những gánh nặng lại và đặt chúng lên vai người ta, nhưng chính họ lại không muốn dùng một ngón tay để xê dịch chúng.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δεσμεύουσιν
  choice: bó
  rationale: Động từ diễn tả việc buộc hoặc gom lại thành bó; “bó” tự nhiên trong tiếng Việt và giữ được hình ảnh chuẩn bị một gánh để đặt lên người khác.
- source_word: φορτία βαρέα
  choice: những gánh nặng
  rationale: Giữ cả hình ảnh cụ thể về vật nặng lẫn sức gợi ẩn dụ về những đòi hỏi gây áp lực.
- source_word: ἐπιτιθέασιν ἐπὶ τοὺς ὤμους
  choice: đặt lên vai
  rationale: Diễn đạt trực tiếp hành động đặt vật gì lên trên và bảo toàn hình ảnh thân thể cụ thể của nguyên văn.
- source_word: τῶν ἀνθρώπων
  choice: người ta
  rationale: ἄνθρωποι ở đây chỉ con người nói chung. “Người ta” là cách nói tự nhiên, bao quát trong tiếng Việt và làm rõ sự đối lập giữa họ với những người bị chất gánh.
- source_word: αὐτοὶ δὲ
  choice: nhưng chính họ lại
  rationale: “Chính họ” giữ sắc thái nhấn mạnh của đại từ; “nhưng... lại” thể hiện rõ sự tương phản.
- source_word: τῷ δακτύλῳ αὐτῶν
  choice: dùng một ngón tay
  rationale: Giữ danh từ số ít và thành ngữ chỉ một nỗ lực tối thiểu; “một ngón tay” tự nhiên hơn lối dịch sở hữu máy móc trong tiếng Việt.
- source_word: οὐ θέλουσιν κινῆσαι αὐτά
  choice: không muốn ... lay chuyển chúng
  rationale: “Không muốn” giữ đúng sắc thái ý chí của θέλω, còn “lay chuyển” phản ánh κινέω mà không đổi thành ý cụ thể hơn như nâng hay mang.
theological_decisions:
- issue: Những gánh nặng là nghĩa đen hay nghĩa bóng
  choice: Giữ nguyên hình ảnh cụ thể “những gánh nặng” mà không giải thích rõ đối tượng ám chỉ.
  alternative: Diễn giải trực tiếp là luật lệ, nghĩa vụ hoặc quy định tôn giáo.
  rationale: Trong ngữ cảnh, hình ảnh có thể chỉ những đòi hỏi nặng nề do các kinh sư và người Pha-ri-si áp đặt, nhưng câu Hy Lạp không nêu cụ thể. Giữ ẩn dụ tránh thu hẹp ý nghĩa theo một cách giải thích thần học.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cấu trúc tương phản được giữ rõ; không cần chú thích cho ἀνθρώπων vì “người ta” đã truyền đạt tự nhiên nghĩa bao quát của từ Hy Lạp.
