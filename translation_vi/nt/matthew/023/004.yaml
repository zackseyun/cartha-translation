revisions:
- from: Họ bó những gánh nặng rồi đặt lên vai người ta, nhưng chính họ lại không muốn dùng một ngón tay để lay chuyển chúng.
  to: Họ bó những gánh nặng lại và đặt chúng lên vai người ta, nhưng chính họ lại không muốn dùng một ngón tay để xê dịch chúng.
  rationale: Chỉnh sửa tối thiểu để tiếng Việt tự nhiên và để động từ cuối phản ánh chính xác κινέω (‘di chuyển’) mà vẫn giữ nguyên hình ảnh ẩn dụ và mức độ mơ hồ của nguyên văn.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T05:42:06Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch giữ đúng các thành tố chính: hành động bó/buộc các gánh nặng, đặt lên vai người khác, sự nhấn mạnh tương phản nơi “chính họ,” và ý chí từ chối của θέλουσιν. Tuy nhiên, “lay chuyển chúng” không phù hợp với κινῆσαι trong hình ảnh này: tiếng Việt thường dùng “lay chuyển” cho việc làm dao động hoặc thay đổi lập trường/tình thế, không phải di chuyển một gánh nặng bằng ngón tay. “Xê dịch chúng” giữ được nghĩa ‘di chuyển’ mà không diễn giải thành ‘nâng’ hay ‘mang’.'
  naturalness: Cần thêm “lại” sau “bó” để diễn đạt tự nhiên động tác buộc/gom thành bó. Liên từ “và” phản ánh trực tiếp quan hệ phối hợp của καὶ hơn “rồi,” vốn có thể thêm sắc thái trình tự. “Xê dịch chúng” là cách nói hiện đại, rõ nghĩa và hợp với cụm “dùng một ngón tay.”
  terminology: '“Gánh nặng,” “vai người ta,” và “chính họ” đều thích đáng. Không cần chú thích cho ἀνθρώπων: “người ta” truyền đạt nghĩa khái quát, không đánh dấu giới tính, của từ này. Không nên xác định các gánh nặng là luật lệ hoặc quy định, vì nguyên văn không nêu rõ.'
  issues:
  - severity: medium
    issue: “lay chuyển chúng” không diễn đạt tự nhiên nghĩa của κινῆσαι trong ngữ cảnh này.
    rationale: κινέω có nghĩa là làm di chuyển; “lay chuyển” trong tiếng Việt thường chỉ làm dao động hoặc tác động khiến thay đổi, nên có thể đổi hình ảnh và gây hiểu sai. “Xê dịch chúng” bảo toàn nghĩa di chuyển tối thiểu bằng một ngón tay.
  - severity: low
    issue: “Bó những gánh nặng” thiếu tiểu từ kết quả và “rồi” thêm sắc thái tuần tự.
    rationale: “Bó những gánh nặng lại và đặt chúng...” tự nhiên hơn, đồng thời giữ quan hệ nối kết đơn giản của δεσμεύουσιν ... καὶ ἐπιτιθέασιν.
  revised_text: Họ bó những gánh nặng lại và đặt chúng lên vai người ta, nhưng chính họ lại không muốn dùng một ngón tay để xê dịch chúng.
