id: MAT.23.15
reference: Matthew 23:15
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Οὐαὶ ὑμῖν, γραμματεῖς καὶ Φαρισαῖοι ὑποκριταί, ὅτι περιάγετε τὴν θάλασσαν καὶ τὴν ξηρὰν ποιῆσαι ἕνα προσήλυτον, καὶ ὅταν γένηται ποιεῖτε αὐτὸν υἱὸν γεέννης διπλότερον ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/015.yaml
  text: Woe to you[a], scribes and Pharisees, hypocrites! Because you travel over sea and land to make one convert, and when he becomes one[b], you make him twice as much a son of Gehenna as yourselves.
translation:
  language: vi
  text: Khốn cho các ông, những kinh sư và người Pha-ri-si, là những kẻ đạo đức giả! Vì các ông đi khắp biển cả lẫn đất liền để khiến một người nhập đạo[a]; và khi người ấy trở thành người nhập đạo, các ông làm cho người ấy trở thành một con của Ghê-hen-na[b] gấp đôi các ông.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “một người cải đạo”; ở đây nói đến một người ngoại chuyển sang Do Thái giáo.
    reason: lexical_alternative
  - marker: b
    text: Hay “con của địa ngục.” Tiếng Hy Lạp là “con của Ghê-hen-na.”
    reason: alternative_reading
lexical_decisions:
- source_word: Οὐαὶ
  choice: Khốn cho
  rationale: Giữ sức nặng của lời lên án mang tính ngôn sứ, tự nhiên và quen thuộc trong tiếng Việt Kinh Thánh.
- source_word: γραμματεῖς
  choice: kinh sư
  rationale: Chỉ đúng nhóm học giả và chuyên gia Luật pháp Do Thái, đồng thời tránh diễn giải quá mức chức năng của họ.
- source_word: Φαρισαῖοι
  choice: người Pha-ri-si
  rationale: Dùng cách phiên âm phổ biến trong tiếng Việt cho nhóm tôn giáo Do Thái này.
- source_word: ὑποκριταί
  choice: những kẻ đạo đức giả
  rationale: Diễn đạt rõ sự giả hình về đạo đức và tôn giáo trong lời quở trách này.
- source_word: περιάγετε τὴν θάλασσαν καὶ τὴν ξηρὰν
  choice: đi khắp biển cả đất liền
  rationale: Truyền đạt sự đi lại rộng khắp và nỗ lực lớn, đồng thời giữ hình ảnh bao quát gồm biển và đất liền.
- source_word: ποιῆσαι ἕνα προσήλυτον
  choice: để khiến một người nhập đạo
  rationale: “Người nhập đạo” vừa dễ hiểu vừa gần với nghĩa chuyên biệt của προσήλυτος hơn từ chung chung “người cải đạo”; chú thích làm rõ bối cảnh Do Thái giáo.
- source_word: ὅταν γένηται
  choice: khi người ấy đã nhập đạo
  rationale: Diễn đạt tự nhiên kết quả được hàm ý trong động từ γένηται và vẫn giữ quy chiếu số ít của bản Hy Lạp.
- source_word: υἱὸν γεέννης
  choice: con của Ghê-hen-na
  rationale: Giữ nguyên thành ngữ Semit “con của” và tên Ghê-hen-na, thay vì âm thầm làm phẳng thành ngữ hoặc đồng nhất thuật ngữ với khái niệm rộng hơn là “địa ngục”.
- source_word: διπλότερον ὑμῶν
  choice: gấp đôi chính các ông
  rationale: Phản ánh trực tiếp ý so sánh của διπλότερον và nhấn mạnh sự đối chiếu với chính những người đang bị quở trách.
theological_decisions:
- issue: Cách dịch γεέννα
  choice: Ghê-hen-na
  alternative: địa ngục
  rationale: Bản Hy Lạp dùng γεέννα, một thuật ngữ có bối cảnh lịch sử và cánh chung Do Thái riêng. Phiên âm giữ được nét ấy; cách gọi quen thuộc “địa ngục” được nêu trong chú thích.
- issue: Cách dịch thành ngữ υἱὸν γεέννης
  choice: con của Ghê-hen-na
  alternative: kẻ thuộc về Ghê-hen-na
  rationale: Giữ hình thức thành ngữ Semit và sức căng của nguyên văn, thay vì giải nghĩa hoàn toàn ngay trong chính văn.
- issue: Quy chiếu số ít giống đực sau προσήλυτον
  choice: người ấy
  alternative: người đó
  rationale: Tiếng Việt không đánh dấu giống ở đại từ này, nhưng vẫn giữ rõ quy chiếu cá nhân số ít mà không thêm một giới tính không cần biểu thị trong tiếng Việt.
translation_notes:
  register: Văn phong hiện đại, trang trọng và trực diện. Giữ nhịp điệu của lời quở trách, các danh xưng lịch sử quen thuộc, hình ảnh “biển cả đất liền,” cùng thành ngữ khó nhưng có chủ ý “con của Ghê-hen-na.”
