review_pass:
  verdict: revise
  source_fidelity: Bản dịch chuyển tải đúng lời khốn trách, các nhóm được nêu tên, nỗ lực đi lại rộng khắp, việc làm một người thành προσήλυτος, và hình ảnh “con của Ghê-hen-na”. Tuy nhiên, cụm “gấp đôi chính các ông” chưa đặt rõ quan hệ so sánh mà διπλότερον ὑμῶν đòi hỏi; cần nêu minh thị “gấp đôi các ông” theo phương diện là “con của Ghê-hen-na”.
  naturalness: Văn phong nhìn chung hiện đại, trang trọng và phù hợp. “Đi khắp biển cả đất liền” có thể tự nhiên hơn với liên từ “lẫn”. Cấu trúc so sánh được chỉnh để tiếng Việt rõ nghĩa, không gây cảm giác “làm thành ... gấp đôi”.
  terminology: “Kinh sư”, “Pha-ri-si”, “đạo đức giả”, và “Ghê-hen-na” phù hợp. “Người nhập đạo” là lựa chọn khả dĩ cho προσήλυτος; chú thích giữ phương án “người cải đạo” và giải thích bối cảnh Do Thái giáo. “Con của Ghê-hen-na” bảo tồn thành ngữ Hy Lạp/Semit mà không đồng nhất trực tiếp với “địa ngục”.
  issues:
  - severity: medium
    issue: Quan hệ so sánh trong “làm cho người ấy thành con của Ghê-hen-na gấp đôi chính các ông” chưa rõ.
    rationale: διπλότερον ὑμῶν bổ nghĩa cho việc trở thành “con của Ghê-hen-na” trong sự so sánh với những người bị gọi là “các ông”. Cách đặt hiện tại có thể bị hiểu là mức độ “làm cho thành” gấp đôi. Cần diễn đạt rõ “một con của Ghê-hen-na gấp đôi các ông”.
  - severity: low
    issue: “Biển cả đất liền” thiếu yếu tố nối hai vế của thành ngữ bao quát.
    rationale: Nguyên ngữ có “biển và đất liền”. Thêm “lẫn” giúp câu tiếng Việt tự nhiên hơn mà vẫn giữ nguyên hình ảnh và phạm vi.
