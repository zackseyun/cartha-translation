revisions:
- from: Khốn cho các ông, những kinh sư và người Pha-ri-si, là những kẻ đạo đức giả! Vì các ông đi khắp biển cả đất liền để khiến một người nhập đạo[a]; và khi người ấy đã nhập đạo, các ông làm cho người ấy thành con của Ghê-hen-na[b] gấp đôi chính các ông.
  to: Khốn cho các ông, những kinh sư và người Pha-ri-si, là những kẻ đạo đức giả! Vì các ông đi khắp biển cả lẫn đất liền để khiến một người nhập đạo[a]; và khi người ấy trở thành người nhập đạo, các ông làm cho người ấy trở thành một con của Ghê-hen-na[b] gấp đôi các ông.
  rationale: 'Chỉnh câu so sánh để phản ánh rõ διπλότερον ὑμῶν: người ấy bị làm cho trở thành một “con của Ghê-hen-na” gấp đôi chính những người đang bị quở trách. Cũng thêm “lẫn” trong cặp “biển cả lẫn đất liền” để câu tiếng Việt tự nhiên hơn. Các thuật ngữ lịch sử và thần học chủ chốt cùng hệ thống chú thích được giữ nguyên.'
