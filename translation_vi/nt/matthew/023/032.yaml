  text: καὶ ὑμεῖς πληρώσατε τὸ μέτρον τῶν πατέρων ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/032.yaml
  text: And you[a], fill up the measure of your fathers.
translation:
  language: vi
  text: Còn các ngươi, hãy làm cho đầy trọn mức của tổ phụ các ngươi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “hãy làm cho đầy trọn mức tội lỗi của tổ phụ các ngươi.” Nguyên văn Hy Lạp là “hãy làm cho đầy mức của tổ phụ các ngươi”, dùng hình ảnh tội lỗi tích tụ cho đến giới hạn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Còn
  rationale: Trong mạch lời lên án, từ nối này tiếp tục lập luận và đưa trọng tâm sang chính những người đang bị nói đến; “Còn” tự nhiên hơn “Và” trong tiếng Việt tại đây.
- source_word: ὑμεῖς
  choice: các ngươi
  rationale: Đại từ được nêu rõ trong tiếng Hy Lạp nên mang sắc thái nhấn mạnh. “Các ngươi” giữ ngôi số nhiều và giọng quở trách nghiêm nghị của văn cảnh.
- source_word: πληρώσατε
  choice: hãy làm đầy
  rationale: Đây là động từ mệnh lệnh aorist, ngôi thứ hai số nhiều. “Hãy làm đầy” giữ cả hình thức mệnh lệnh lẫn hình ảnh một mức đang được đưa tới chỗ đầy trọn.
- source_word: τὸ μέτρον
  choice: mức
  rationale: “Mức” diễn đạt hình ảnh một lượng có giới hạn mà không tự thêm danh từ “tội lỗi” vốn chỉ được hàm ý theo văn cảnh.
- source_word: τῶν πατέρων ὑμῶν
  choice: của tổ phụ mình
  rationale: Trong văn cảnh, πατέρων chỉ những người đi trước trong dòng dõi và trong khuôn mẫu chống nghịch. “Tổ phụ” rõ nghĩa hơn “cha” trong tiếng Việt, còn “mình” liên kết tự nhiên với chủ ngữ “các ngươi”.
theological_decisions:
- issue: Lời của Chúa Giê-su là mệnh lệnh hay lời tiên báo mang tính mỉa mai
  choice: 'Giữ hình thức mệnh lệnh với sức nặng mỉa mai và phán xét: “hãy làm đầy”.'
  alternative: 'Dịch thành lời mô tả hoặc tiên báo: “các ngươi đang/sẽ làm đầy”.'
  rationale: Hình thái πληρώσατε là mệnh lệnh aorist số nhiều. Bản dịch giữ nguyên dạng ngữ pháp, đồng thời không giải thích quá mức chức năng tu từ của lời lên án.
- issue: “Mức của tổ phụ” có trực tiếp nghĩa là mức tội lỗi hay không
  choice: Giữ ẩn dụ trong chính văn và giải thích tội lỗi tích tụ ở chú thích.
  alternative: Đưa thẳng “mức tội lỗi của tổ phụ” vào chính văn.
  rationale: Bản Hy Lạp không có từ “tội lỗi”. Việc giữ ẩn dụ bảo toàn tính cô đọng và sức căng của câu, trong khi chú thích giúp độc giả hiểu nghĩa theo văn cảnh.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và trực tiếp. “Các ngươi” được dùng có chủ ý để phản ánh lời quở trách số nhiều; “tổ phụ” tránh cách hiểu chỉ cha ruột. Dấu chú thích [a] xuất hiện ngay sau câu.
