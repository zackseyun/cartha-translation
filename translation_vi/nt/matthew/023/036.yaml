  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀμὴν λέγω ὑμῖν, ⸀ἥξει ⸂ταῦτα πάντα⸃ ἐπὶ τὴν γενεὰν ταύτην.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/036.yaml
  text: Truly I say to you[b][a], all these things will come upon this generation.
translation:
  language: vi
  text: 'Quả thật, tôi nói với các ông: tất cả những điều này[a] sẽ xảy đến cho thế hệ này[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể diễn đạt là “tất cả điều này.” Tiếng Hy Lạp dùng số nhiều: “tất cả những điều này.”'
    reason: lexical_alternative
  - marker: b
    text: Một số người cũng hiểu “thế hệ này” là “những người này” hoặc rộng hơn là một thế hệ không tin; tuy nhiên, cách đọc trực tiếp nhất của tiếng Hy Lạp là “thế hệ này.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἀμὴν
  choice: Quả thật
  rationale: Trong công thức ἀμὴν λέγω ὑμῖν của các sách Tin Mừng Nhất Lãm, ἀμήν là lời xác quyết long trọng mở đầu một tuyên bố có thẩm quyền. “Quả thật” truyền đạt tự nhiên sắc thái ấy trong tiếng Việt hiện đại.
- source_word: λέγω ὑμῖν
  choice: tôi nói với các ông
  rationale: Cách dịch này bám sát động từ hiện tại và đại từ số nhiều, đồng thời giữ nhịp điệu trang trọng của công thức tuyên bố. “Các ông” phù hợp với nhóm người nam đang được Đức Giê-su trực tiếp nói đến trong văn cảnh.
- source_word: ἥξει
  choice: sẽ xảy đến
  rationale: Dạng tương lai của ἥκω diễn tả việc những điều vừa nêu sẽ đến và tác động đến đối tượng. “Sẽ xảy đến” tự nhiên trong tiếng Việt, không thêm sắc thái đột ngột mà nguyên văn không nói rõ.
- source_word: ταῦτα πάντα
  choice: tất cả những điều này
  rationale: Cụm đại từ chỉ định trung tính số nhiều cùng πᾶς được thể hiện rõ bằng “tất cả những điều này,” quy chiếu về các sự việc và sự phán xét đã nêu trước đó.
- source_word: ἐπὶ τὴν γενεὰν
  choice: cho thế hệ
  rationale: Với đối cách trong cấu trúc này, ἐπί biểu thị những điều ấy đến trên hoặc xảy đến cho đối tượng. “Xảy đến cho” là cách diễn đạt tự nhiên, vẫn giữ ý đối tượng phải hứng chịu mà không diễn giải quá mức.
- source_word: γενεὰν ταύτην
  choice: thế hệ này
  rationale: Đây là cách tương ứng trực tiếp nhất với γενεὰν ταύτην, giữ nguyên lực chỉ định và không đổi cụm từ thành “thời đại này” hay “những người này.”
theological_decisions:
- issue: Đối tượng được chỉ bởi “thế hệ này” (γενεὰν ταύτην)
  choice: Dịch trực tiếp là “thế hệ này,” không mở rộng trong chính văn.
  alternative: Có thể hiểu là lớp người mang đặc tính không tin, dân Do Thái xuyên suốt các thời đại, hoặc thời đại hiện tại.
  rationale: Nguyên văn trực tiếp nói “thế hệ này.” Giữ cách diễn đạt ấy bảo toàn sức nặng thời gian và sự căng thẳng giải nghĩa, thay vì áp đặt một hệ thống cánh chung cụ thể.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dấu hai chấm làm rõ phần tuyên bố sau công thức mở đầu. Bản dịch giữ cách nói trực tiếp của nguyên văn, tránh thuật ngữ hệ phái và không quyết định thay người đọc phạm vi của “thế hệ này.”
