base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/021.yaml
  text: And whoever swears by the temple swears by it and by the One dwelling in it[a].
translation:
  language: vi
  text: Ai thề lấy đền thờ thì cũng thề lấy đền thờ ấy và Đấng ngự trong đó.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch sát: “thề trong đền thờ ... trong đó”; giới từ Hy Lạp có nghĩa đen là “trong”, nhưng trong công thức thề ở đây mang nghĩa “lấy ... mà thề”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ὀμόσας
  choice: Ai ... mà thề
  rationale: Phân từ aorist có mạo từ được dùng như danh từ với ý nghĩa khái quát. Cấu trúc “Ai ... mà thề” tự nhiên trong tiếng Việt hiện đại và không giới hạn giới tính.
- source_word: ἐν τῷ ναῷ
  choice: lấy đền thờ mà thề
  rationale: Dù ἐν thường có nghĩa là “trong”, trong công thức thề ở ngữ cảnh này, từ này chỉ đối tượng được viện dẫn khi thề. Cách nói “lấy ... mà thề” vừa rõ nghĩa vừa tự nhiên trong tiếng Việt.
- source_word: ναῷ
  choice: đền thờ
  rationale: ναός có thể chỉ nơi thánh hoặc chính điện của đền thờ; “đền thờ” là cách gọi phổ thông, rõ ràng trong mạch văn này.
- source_word: ὀμνύει
  choice: thì cũng ... mà thề
  rationale: Thì hiện tại diễn tả một nguyên tắc chung. “Thì cũng” làm rõ hệ quả khẳng định của mệnh đề mà không thêm nội dung.
- source_word: ἐν αὐτῷ
  choice: lấy chính đền thờ ... mà thề
  rationale: Đại từ quy chiếu về đền thờ; lặp lại danh từ tự nhiên và rõ hơn “lấy nó” trong tiếng Việt. “Chính” nhấn rõ đối tượng quy chiếu mà không thay đổi ý nghĩa.
- source_word: τῷ κατοικοῦντι αὐτόν
  choice: Đấng ngự trong đó
  rationale: Phân từ hiện tại có mạo từ chỉ Đấng cư ngụ trong đền thờ, tức Đức Chúa Trời theo ngữ cảnh. “Ngự” là từ trang trọng, tự nhiên khi nói về sự hiện diện của Đức Chúa Trời; “Đấng” giữ cách quy chiếu kính trọng và rõ ràng.
theological_decisions:
- issue: Danh tính của Đấng ngự trong đền thờ
  choice: “Đấng ngự trong đó” được viết hoa để chỉ Đức Chúa Trời
  alternative: “người ngự trong đó” hoặc không viết hoa, giữ sự quy chiếu ngầm hơn
  rationale: Ngữ cảnh cho thấy Đức Chúa Trời là Đấng hiện diện trong đền thờ. Viết hoa “Đấng” phản ánh đối tượng quy chiếu rõ ràng, không thêm một xác quyết giáo phái.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “lấy ... mà thề” để chuyển tải thành ngữ thề trong tiếng Hy Lạp; dùng “ngự” cho sự hiện diện của Đức Chúa Trời trong đền thờ.
