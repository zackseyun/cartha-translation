  source_fidelity: 'Bản dịch giữ đúng các thành tố của văn bản SBLGNT: lời gọi chú ý (ἰδοὺ), động từ bị động hiện tại (ἀφίεται), bổ ngữ “cho các ngươi” (ὑμῖν), hình ảnh rộng “nhà của các ngươi” (ὁ οἶκος ὑμῶν), và tình trạng “hoang tàn” (ἔρημος). Không thu hẹp quy chiếu của “nhà” trong chính văn.'
  naturalness: “Kìa, nhà của các ngươi bị bỏ lại cho các ngươi, hoang tàn” là tiếng Việt trang trọng, rõ nghĩa và phù hợp với giọng tuyên án tiên tri. “Kìa” và “các ngươi” hơi văn chương nhưng thích hợp trong ngữ cảnh quở trách trực diện; “hoang tàn” truyền tải tự nhiên trạng thái đổ nát/bỏ vắng.
  terminology: “Nhà của các ngươi” bảo toàn hình ảnh và độ mở của οἶκος; chú thích nêu khả năng chỉ đền thờ mà không biến đó thành nghĩa duy nhất. “Bị bỏ lại” giữ sắc thái bị động mà không thêm tác nhân; “hoang tàn” phù hợp với ἔρημος trong ngữ cảnh phán xét.
