  text: ἰδοὺ ἀφίεται ὑμῖν ὁ οἶκος ὑμῶν ⸀ἔρημος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/038.yaml
  text: Look[a], your house is left to you desolate.
translation:
  language: vi
  text: Kìa, nhà của các ngươi bị bỏ lại cho các ngươi, hoang tàn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cụm từ “nhà của các ngươi” có thể chỉ riêng đền thờ, dù cách diễn đạt trong tiếng Hy Lạp có nghĩa rộng hơn.
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδοὺ
  choice: Kìa
  rationale: Dùng từ gọi sự chú ý tự nhiên nhưng trang trọng trong tiếng Việt, phù hợp với sắc thái của một lời tuyên bố nghiêm trọng.
- source_word: ἀφίεται
  choice: bị bỏ lại
  rationale: Giữ thể bị động và thì hiện tại của động từ Hy Lạp, không xác định rõ tác nhân và không diễn giải mạnh thành “bị ruồng bỏ”.
- source_word: ὑμῖν
  choice: cho các ngươi
  rationale: Giữ lại thành phần gián tiếp của câu Hy Lạp, gợi ý ngôi nhà được để lại cho chính những người được nói đến.
- source_word: ὁ οἶκος ὑμῶν
  choice: nhà của các ngươi
  rationale: Dịch sát hình ảnh “nhà của các ngươi”, không thu hẹp ngay thành đền thờ, thành Giê-ru-sa-lem hay nhà Ít-ra-ên.
- source_word: ἔρημος
  choice: hoang tàn
  rationale: Diễn đạt trạng thái bị bỏ vắng và tiêu điều trong bối cảnh lời phán xét mang tính tiên tri; tự nhiên và trang trọng hơn “trống không”.
theological_decisions:
- issue: Đối tượng được chỉ bởi “nhà của các ngươi”
  choice: Giữ nguyên cách nói rộng “nhà của các ngươi” trong chính văn.
  alternative: Dịch cụ thể là “đền thờ của các ngươi”, “Giê-ru-sa-lem” hoặc “nhà Ít-ra-ên”.
  rationale: Ngữ cảnh hướng mạnh đến đền thờ và Giê-ru-sa-lem, nhưng từ Hy Lạp οἶκος vẫn rộng hơn; giữ “nhà” bảo tồn tính đa nghĩa và sức nặng tiên tri của lời nói.
- issue: Sắc thái của ἔρημος
  choice: hoang tàn
  alternative: hoang vắng; bị bỏ hoang; trống không
  rationale: “Hoang tàn” truyền đạt cả sự vắng bỏ lẫn cảnh tiêu điều do phán xét, nhưng không xác định thêm cách thức hủy diệt.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. “Các ngươi” được dùng để giữ sắc thái quở trách trực diện đối với số nhiều; cấu trúc hơi trang nghiêm phù hợp với lời tuyên án trong văn mạch.
