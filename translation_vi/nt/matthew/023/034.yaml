    rationale: Dù hiểu được, cách xưng hô này kém tự nhiên và kém nhất quán với văn phong trang trọng của lời quở trách. “Ta/các ngươi” là cách dùng Kinh Thánh tiếng Việt rõ ràng, không thêm diễn giải thần học.
