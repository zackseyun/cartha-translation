revisions:
- from: Vì thế, này, tôi sai các nhà tiên tri, các bậc khôn ngoan và các kinh sư đến với các người. Trong số họ, các người sẽ giết và đóng đinh một số người vào thập tự giá; một số khác, các người sẽ đánh bằng roi trong các hội đường của mình và truy đuổi hết thành này đến thành khác.
  to: Vì thế, kìa, Ta sai các nhà tiên tri, các bậc khôn ngoan và các kinh sư đến với các ngươi. Trong số họ, các ngươi sẽ giết và đóng đinh một số người vào thập tự giá; một số khác, các ngươi sẽ đánh bằng roi trong các hội đường của mình và truy đuổi từ thành này sang thành khác.
  rationale: Chỉnh nhẹ để câu tự nhiên và nhất quán hơn trong tiếng Việt hiện đại có sắc thái Kinh Thánh, đồng thời loại bỏ sắc thái “hết” vượt quá nguyên văn. Bản sửa vẫn giữ thì hiện tại của “Ta sai,” tính không xác định của hai lần ἐξ αὐτῶν, và không xác định các nhóm ấy hoàn toàn tách biệt.
