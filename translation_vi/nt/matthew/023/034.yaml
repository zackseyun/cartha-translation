  source_fidelity: 'Bản nháp truyền đạt đúng cấu trúc và các hành động chính của câu Hy Lạp: λόγ nối kết διὰ τοῦτο, lời thu hút chú ý ἰδοὺ, hành động hiện tại có đại từ nhấn mạnh ἐγώ ἀποστέλλω, ba hạng người được sai, và hai nhóm không xác định bởi ἐξ αὐτῶν. Tuy nhiên, “truy đuổi hết thành này đến thành khác” thêm sắc thái hoàn tất/phủ khắp qua từ “hết”, không có trong ἀπὸ πόλεως εἰς πόλιν. Cần đổi thành “từ thành này sang thành khác.”'
  naturalness: “Vì thế, này” và cặp “tôi/các người” tạo nhịp lời nói hơi gượng trong văn xuôi Kinh Thánh hiện đại. “Vì thế, kìa” giữ chức năng của ἰδοὺ trong một cách nói Việt ngữ quen thuộc hơn; “Ta/các ngươi” duy trì nhất quán giọng đối thoại trang trọng, quở trách của ngữ cảnh.
  terminology: “Kinh sư,” “thập tự giá,” “hội đường,” và “đánh bằng roi” đều phù hợp. “Đóng đinh ... vào thập tự giá” diễn đạt đúng σταυρώσετε. Không cần chú thích văn bản hay thuật ngữ.
