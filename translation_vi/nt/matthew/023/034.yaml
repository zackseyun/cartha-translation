id: MAT.23.34
reference: Matthew 23:34
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: διὰ τοῦτο ἰδοὺ ἐγὼ ἀποστέλλω πρὸς ὑμᾶς προφήτας καὶ σοφοὺς καὶ γραμματεῖς· ⸀ἐξ αὐτῶν ἀποκτενεῖτε καὶ σταυρώσετε, καὶ ἐξ αὐτῶν μαστιγώσετε ἐν ταῖς συναγωγαῖς ὑμῶν καὶ διώξετε ἀπὸ πόλεως εἰς πόλιν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/034.yaml
  text: Therefore, look, I am sending to you prophets and wise men and scribes. Some of them you will kill and crucify, and some of them you will flog in your synagogues and persecute from city to city.
translation:
  language: vi
  text: Vì thế, kìa, Ta sai các nhà tiên tri, các bậc khôn ngoan và các kinh sư đến với các ngươi. Trong số họ, các ngươi sẽ giết và đóng đinh một số người vào thập tự giá; một số khác, các ngươi sẽ đánh bằng roi trong các hội đường của mình và truy đuổi từ thành này sang thành khác.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: này
  rationale: Giữ chức năng thu hút sự chú ý của lời tuyên bố, với cách diễn đạt trang trọng và tự nhiên trong văn phong Kinh Thánh tiếng Việt.
- source_word: ἀποστέλλω
  choice: tôi sai ... đến
  rationale: Diễn đạt giá trị hiện tại của động từ và hướng πρὸς ὑμᾶς một cách tự nhiên; “sai” cũng giữ sắc thái ủy nhiệm.
- source_word: γραμματεῖς
  choice: các kinh sư
  rationale: Chỉ những người thông thạo và giảng dạy Kinh Luật/Kinh Thánh, tránh nghĩa hiện đại dễ gây nhầm của “thư ký”.
- source_word: σταυρώσετε
  choice: đóng đinh ... vào thập tự giá
  rationale: Thể hiện rõ phương thức hành hình được động từ Hy Lạp chỉ đến, bằng cách nói quen thuộc trong tiếng Việt.
- source_word: μαστιγώσετε
  choice: đánh bằng roi
  rationale: Truyền đạt cụ thể hành động dùng roi đánh, tự nhiên hơn một từ Hán-Việt ít thông dụng.
- source_word: διώξετε ἀπὸ πόλεως εἰς πόλιν
  choice: truy đuổi hết thành này đến thành khác
  rationale: Giữ ý bức hại, săn đuổi liên tục qua nhiều thành, đồng thời phù hợp cú pháp tiếng Việt.
theological_decisions:
- issue: Chủ thể “tôi” trong ἐγὼ ἀποστέλλω
  choice: Giữ nguyên lời tự xưng trực tiếp “tôi sai”
  alternative: Diễn giải người sai là Đức Chúa Trời hoặc đổi thành “ta sẽ sai” theo một cách hiểu thần học
  rationale: Bản Hy Lạp đặt đại từ nhấn mạnh ἐγώ và động từ hiện tại; bản dịch không nên giải thích thay người đọc về quan hệ giữa lời của Chúa Giê-su và sự sai phái của Đức Chúa Trời.
- issue: Phạm vi của ἐξ αὐτῶν trong hai mệnh đề
  choice: “một số người” và “một số khác”
  alternative: Có thể hiểu các hành động chồng lấn trên cùng một số người
  rationale: Cách diễn đạt phản ánh sự phân chia không xác định trong nguồn mà không khẳng định các nhóm hoàn toàn loại trừ nhau.
translation_notes:
  register: Văn phong hiện đại, trang trọng, trực tiếp và dễ hiểu. Dùng “các người” để phản ánh số nhiều ὑμᾶς và sắc thái quở trách trong ngữ cảnh; giữ “này” thay vì thêm một diễn giải như “hãy xem”.
