id: MAT.23.26
reference: Matthew 23:26
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Φαρισαῖε τυφλέ, καθάρισον πρῶτον τὸ ἐντὸς τοῦ ποτηρίου ⸂καὶ τῆς παροψίδος⸃, ἵνα γένηται καὶ τὸ ἐκτὸς ⸀αὐτοῦ καθαρόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/026.yaml
  text: Blind Pharisee[a], first clean the inside of the cup and the dish, so that its outside also may become clean.
translation:
  language: vi
  text: Hỡi người Pha-ri-si mù quáng! Trước hết, hãy làm sạch bên trong chén và đĩa[a], để bên ngoài cũng trở nên sạch.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hy Lạp παροψίς cũng có thể chỉ bát, mâm hoặc đĩa lớn dùng để dọn thức ăn.
    reason: Nêu các khả năng từ vựng mà không ấn định quá cụ thể hình dạng của vật dụng.
lexical_decisions:
- source_word: Φαρισαῖε
  choice: người Pha-ri-si
  rationale: Danh từ số ít ở hô cách, dùng để gọi trực tiếp; giữ nguyên tên gọi của nhóm tôn giáo mà không diễn giải thêm.
- source_word: τυφλέ
  choice: mù quáng
  rationale: Tính từ ở hô cách mang nghĩa ẩn dụ về sự thiếu nhận thức thuộc linh; “mù quáng” tự nhiên trong tiếng Việt và giữ được lời quở trách mạnh.
- source_word: καθάρισον
  choice: hãy làm sạch
  rationale: Mệnh lệnh aorist đòi hỏi hành động dứt khoát; “làm sạch” phù hợp với hình ảnh vật dụng, đồng thời vẫn để ngỏ ý nghĩa đạo đức.
- source_word: πρῶτον
  choice: trước hết
  rationale: Diễn tả thứ tự ưu tiên cả về trình tự lẫn logic.
- source_word: τὸ ἐντὸς
  choice: bên trong
  rationale: Trạng từ được danh từ hóa, chỉ phần phía trong của vật dụng; cách diễn đạt này tự nhiên và song song với “bên ngoài”.
- source_word: τοῦ ποτηρίου
  choice: chén
  rationale: Từ thông dụng chỉ vật dùng để uống; “chén” phù hợp ngữ cảnh Kinh Thánh và tiếng Việt hiện đại.
- source_word: καὶ τῆς παροψίδος
  choice: và đĩa
  rationale: παροψίς chỉ vật dùng để đựng hoặc dọn thức ăn; “đĩa” là cách gọi rộng và tự nhiên, còn các khả năng về hình dạng được ghi ở chú thích.
- source_word: ἵνα γένηται
  choice: để ... trở nên
  rationale: 'Giữ sắc thái kết quả của γίνομαι: phần bên ngoài đi đến tình trạng sạch, chứ không chỉ đơn thuần “là sạch”.'
- source_word: καὶ
  choice: cũng
  rationale: Καί có chức năng bổ sung, cho biết phần bên ngoài tương ứng cũng được sạch.
- source_word: τὸ ἐκτὸς αὐτοῦ
  choice: bên ngoài
  rationale: Diễn đạt tự nhiên trong tiếng Việt và tránh áp đặt một đại từ số ít lên hai vật dụng vừa được nhắc đến; quan hệ sở hữu đã rõ từ ngữ cảnh.
- source_word: καθαρόν
  choice: sạch
  rationale: Giữ nguyên hình ảnh cụ thể về vật dụng, đồng thời không loại bỏ hàm ý đạo đức.
theological_decisions:
- issue: Hình ảnh vật dụng cụ thể hay diễn giải trực tiếp ý nghĩa đạo đức
  choice: Giữ hình ảnh làm sạch bên trong và bên ngoài chén, đĩa.
  alternative: Diễn giải thành việc trước hết phải làm sạch đời sống nội tâm để đời sống bên ngoài cũng thanh sạch.
  rationale: Lời của Chúa Giê-su chủ ý truyền đạt ý nghĩa qua ẩn dụ cụ thể. Nói thẳng ý nghĩa đạo đức trong chính văn sẽ vượt quá câu Hy Lạp và làm giảm sức mạnh tu từ.
- issue: Đại từ số ít αὐτοῦ sau hai danh từ
  choice: Không biểu thị đại từ riêng trong tiếng Việt, dịch tự nhiên là “bên ngoài”.
  alternative: Dịch “bên ngoài của nó” hoặc đổi thành số nhiều “bên ngoài của chúng”.
  rationale: Bản Hy Lạp dùng đại từ số ít dù vừa nói đến chén và đĩa. Lược đại từ trong tiếng Việt giữ được ý nghĩa mà không tự ý giải quyết sự căng thẳng về số.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và dễ hiểu. Dấu chấm than sau lời gọi trực tiếp giữ sức nặng quở trách của hai từ hô cách; cấu trúc “bên trong ... bên ngoài” bảo toàn phép đối xứng của nguyên văn.
