revisions:
- from: Khốn cho các ông, những kinh sư và người Pha-ri-si, là những kẻ đạo đức giả! Vì các ông nuốt chửng nhà cửa của các góa phụ, lại còn giả vờ cầu nguyện dài dòng; bởi vậy, các ông sẽ phải chịu sự kết án nặng hơn.[a]
  to: Khốn cho các ông, những kinh sư và người Pha-ri-si, là những kẻ đạo đức giả! Vì các ông nuốt chửng gia sản của các góa phụ, lại lấy việc cầu nguyện dài dòng làm bình phong; bởi vậy, các ông sẽ phải chịu sự kết án nặng hơn.[a]
  rationale: Bản sửa chỉ cải thiện tính tự nhiên và độ chính xác ngữ nghĩa của hai ẩn dụ/cấu trúc then chốt. “Gia sản” diễn đạt nghĩa ngữ cảnh của “nhà cửa” như tài sản của người góa phụ; “làm bình phong” làm rõ lời cầu nguyện dài là vẻ bề ngoài nhằm che đậy. Chú thích phê bình văn bản được giữ nguyên, và ký hiệu [a] vẫn neo ở cuối câu để chỉ toàn bộ câu đang có vấn đề dị bản.
