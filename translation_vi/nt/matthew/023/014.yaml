id: MAT.23.14
reference: Matthew 23:14
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: robinson-pierpont-2005-byzantine
  text: Οὐαὶ ὑμῖν, γραμματεῖς καὶ Φαρισαῖοι ὑποκριταί, ὅτι κατεσθίετε τὰς οἰκίας τῶν χηρῶν, καὶ προφάσει μακρὰ προσευχόμενοι· διὰ τοῦτο λήψεσθε περισσότερον κρίμα.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/014.yaml
  text: Woe[a] to you, scribes and Pharisees, hypocrites! For you devour widows' houses, and as a pretext make long prayers; therefore you will receive greater condemnation.
translation:
  language: vi
  text: Khốn cho các ông, những kinh sư và người Pha-ri-si, là những kẻ đạo đức giả! Vì các ông nuốt chửng gia sản của các góa phụ, lại lấy việc cầu nguyện dài dòng làm bình phong; bởi vậy, các ông sẽ phải chịu sự kết án nặng hơn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Câu này không có trong các thủ bản Hy Lạp cổ nhất, gồm Codex Sinaiticus và Codex Vaticanus thế kỷ IV, cũng như trong các bản dịch Coptic cổ; nhưng có trong truyền thống đa số Byzantine, các bản La-tinh cổ, Vulgata và Syriac. Có lẽ những người sao chép về sau đã thêm câu này để làm cho đoạn văn tương ứng với Mác 12:40 và Lu-ca 20:47. Trong các thủ bản có câu này, vị trí của nó cũng khác nhau: trước hoặc sau câu 13.'
    reason: textual_critical
lexical_decisions:
- source_word: κατεσθίετε
  choice: nuốt chửng
  rationale: Giữ hình ảnh mạnh của động từ Hy Lạp, diễn tả việc bóc lột tàn nhẫn khiến tài sản và nhà cửa của các góa phụ bị chiếm đoạt.
- source_word: τὰς οἰκίας τῶν χηρῶν
  choice: nhà cửa của các góa phụ
  rationale: Dịch sát hình thức Hy Lạp; “nhà cửa” trong ngữ cảnh có thể bao hàm gia sản hoặc sinh kế của họ mà không cần thu hẹp nghĩa trong chính văn.
- source_word: προφάσει
  choice: giả vờ
  rationale: Diễn đạt tự nhiên ý dùng lời cầu nguyện dài làm bình phong hoặc cớ che đậy động cơ thật.
- source_word: μακρὰ προσευχόμενοι
  choice: cầu nguyện dài dòng
  rationale: Phản ánh trực tiếp độ dài của lời cầu nguyện và sắc thái phê phán trong ngữ cảnh.
- source_word: περισσότερον κρίμα
  choice: sự kết án nặng hơn
  rationale: Trong văn cảnh trừng phạt, κρίμα chỉ phán quyết bất lợi, còn περισσότερον biểu thị mức độ nghiêm trọng hơn.
theological_decisions:
- issue: Đối tượng và sắc thái của lời quở trách
  choice: “các ông” và “những kẻ đạo đức giả”
  alternative: “các ngươi” và “những kẻ giả hình”
  rationale: “Các ông” là cách xưng hô hiện đại, trực diện nhưng không cổ hóa; “đạo đức giả” chuyển tải rõ ὑποκριταί là sự bất nhất giữa vẻ sùng đạo bên ngoài và hành vi bóc lột.
- issue: Quan hệ giữa hành vi và sự kết án
  choice: “bởi vậy ... sẽ phải chịu sự kết án nặng hơn”
  alternative: “vì thế ... sẽ nhận sự phán xét lớn hơn”
  rationale: Giữ mối liên hệ nhân quả của διὰ τοῦτο và sức nặng trừng phạt của κρίμα, nhưng không xác định thêm bản chất hay thời điểm của sự kết án.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ hình ảnh mạnh “nuốt chửng” của nguyên văn; dùng “kinh sư” cho γραμματεῖς và phiên âm quen thuộc “Pha-ri-si”. Dấu chú thích [a] được đặt cuối câu để báo cho độc giả về vấn đề văn bản liên quan đến toàn bộ câu.
