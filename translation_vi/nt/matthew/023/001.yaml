  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τότε
  choice: Bấy giờ
  rationale: Trạng từ chỉ trình tự trong mạch kể; “Bấy giờ” tự nhiên, trang trọng vừa phải và nối câu này với diễn tiến trước đó.
- source_word: ὁ Ἰησοῦς
  choice: Đức Giê-su
  rationale: Tên riêng có mạo từ theo lối kể chuyện Hy Lạp; tiếng Việt không biểu thị mạo từ, còn “Đức Giê-su” là cách gọi kính trọng, quen thuộc trong văn phong Kinh Thánh.
- source_word: ἐλάλησεν
  choice: nói
  rationale: Động từ aorist của λαλέω chỉ hành động nói; “nói với” diễn đạt trực tiếp, tự nhiên mà không thêm sắc thái như “giảng dạy” hay “phán bảo”.
- source_word: τοῖς ὄχλοις
  choice: với đám đông
  rationale: Danh từ số nhiều chỉ những nhóm người tụ họp. Tiếng Việt thường dùng danh từ tập hợp “đám đông” ở dạng không biến đổi số; cách này tự nhiên hơn “các đám đông” trong ngữ cảnh.
- source_word: καὶ
  choice: và
  rationale: Liên từ đơn giản nối hai nhóm người nghe.
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: các môn đồ của Ngài
  rationale: Cụm danh từ số nhiều với sở hữu cách. “Môn đồ” là thuật ngữ quen thuộc cho μαθητής; “của Ngài” giữ quan hệ sở hữu và quy chiếu kính trọng đến Đức Giê-su.
