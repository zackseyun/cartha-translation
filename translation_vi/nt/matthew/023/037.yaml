id: MAT.23.37
reference: Matthew 23:37
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἰερουσαλὴμ Ἰερουσαλήμ, ἡ ⸀ἀποκτείνουσα τοὺς προφήτας καὶ λιθοβολοῦσα τοὺς ἀπεσταλμένους πρὸς αὐτήν— ποσάκις ἠθέλησα ἐπισυναγαγεῖν τὰ τέκνα σου, ὃν τρόπον ⸂ὄρνις ἐπισυνάγει⸃ τὰ νοσσία ⸀αὐτῆς ὑπὸ τὰς πτέρυγας, καὶ οὐκ ἠθελήσατε;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/037.yaml
  text: Jerusalem[a], Jerusalem, the one who kills the prophets and stones those sent to her—how often I wanted to gather your children together, the way a hen gathers her chicks under her wings[b], and you were not willing!
translation:
  language: vi
  text: Hỡi Giê-ru-sa-lem, Giê-ru-sa-lem, ngươi giết các nhà tiên tri và ném đá những người được sai đến với ngươi—đã bao lần ta muốn quy tụ con cái ngươi, như gà mẹ[a] quy tụ đàn con dưới cánh mình, mà các ngươi lại không muốn?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hy Lạp được dịch là “gà mẹ” cũng có thể chỉ “chim” nói chung, nhưng hình ảnh quy tụ con non dưới cánh đặc biệt gợi đến gà mẹ.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰερουσαλὴμ Ἰερουσαλήμ
  choice: Hỡi Giê-ru-sa-lem, Giê-ru-sa-lem
  rationale: Giữ nguyên cách gọi lặp đầy cảm xúc; thêm “Hỡi” để lời than trực tiếp được tự nhiên và trang trọng trong tiếng Việt.
- source_word: ἡ ἀποκτείνουσα τοὺς προφήτας καὶ λιθοβολοῦσα
  choice: ngươi giết các nhà tiên tri và ném đá
  rationale: Hai phân từ hiện tại mô tả đặc tính của thành phố được nhân cách hóa; câu quan hệ ngầm với “ngươi” tự nhiên hơn trong tiếng Việt mà vẫn giữ ý nghĩa.
- source_word: τοὺς ἀπεσταλμένους πρὸς αὐτήν
  choice: những người được sai đến với ngươi
  rationale: Giữ thể bị động và hình ảnh thành phố được xưng hô như một nhân vật.
- source_word: ποσάκις ἠθέλησα
  choice: Đã bao lần ta muốn
  rationale: Diễn đạt tự nhiên lời than về ước muốn nhiều lần, không tăng cường thành ý định tất định.
- source_word: ἐπισυναγαγεῖν τὰ τέκνα σου
  choice: tụ họp con cái ngươi
  rationale: “Tụ họp” giữ sắc thái quy về một chỗ của động từ ghép; “con cái” bảo toàn ẩn dụ quan hệ với thành phố.
- source_word: ὄρνις ἐπισυνάγει τὰ νοσσία αὐτῆς
  choice: gà mẹ tụ họp đàn con
  rationale: ὄρνις có thể chỉ chim nói chung, nhưng ngữ cảnh con non dưới cánh cho thấy hình ảnh gà mẹ; “đàn con” tự nhiên và không buộc phải lặp “gà con”.
- source_word: ὑπὸ τὰς πτέρυγας
  choice: dưới cánh mình
  rationale: Giữ nguyên hình ảnh che chở; “mình” quy chiếu tự nhiên về gà mẹ.
- source_word: καὶ οὐκ ἠθελήσατε
  choice: nhưng các ngươi không muốn
  rationale: Số nhiều của động từ được thể hiện bằng “các ngươi”, làm rõ sự chuyển từ thành phố số ít được nhân cách hóa sang những người thuộc về thành ấy; “nhưng” diễn đạt đúng quan hệ tương phản trong ngữ cảnh.
theological_decisions:
- issue: Sự tương phản ý chí giữa Chúa Giê-su và Giê-ru-sa-lem
  choice: Dùng cùng từ “muốn” cho cả ἠθέλησα và ἠθελήσατε.
  alternative: Dùng “quyết định” cho vế đầu hoặc diễn giải vế đầu chỉ như một cảm xúc thương tiếc.
  rationale: Cách dịch giữ nguyên sự tương phản thực sự giữa điều Chúa Giê-su muốn và sự không muốn của những người được nói đến, nhưng không giải quyết thay bản văn các tranh luận về ý chí thần linh và trách nhiệm con người.
- issue: Đối tượng của “con cái ngươi”
  choice: Giữ nguyên “con cái ngươi”.
  alternative: Diễn giải thành “dân ngươi” hoặc “cư dân ngươi”.
  rationale: Cách dịch bảo toàn phép nhân cách hóa Giê-ru-sa-lem và không thu hẹp đối tượng hơn điều bản văn nói.
- issue: Sự chuyển đổi từ số ít sang số nhiều
  choice: Dịch σου bằng “ngươi” nhưng ἠθελήσατε bằng “các ngươi”.
  alternative: Đồng nhất cả hai thành số ít hoặc diễn giải rõ “dân ngươi không muốn”.
  rationale: 'Giữ nét ngữ pháp và sức căng của nguyên văn: thành phố được gọi ở số ít, còn sự không muốn được quy cho tập thể số nhiều.'
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “ta/ngươi/các ngươi” để giữ sắc thái lời tuyên phán và làm rõ sự đối lập số ít–số nhiều trong nguyên văn; tránh từ quá cổ như “bấy phen” hoặc “chẳng khứng”.
