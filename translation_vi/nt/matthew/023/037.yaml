  - severity: low
    issue: Ký hiệu chú thích [a] đang neo sau “cánh mình” thay vì sau “gà mẹ.”
    rationale: Chú thích giải thích ὄρνις và lựa chọn dịch “gà mẹ,” nên cần gắn trực tiếp với cụm từ đó.
  - severity: low
    issue: “Tụ họp” có sắc thái chủ thể tự tập hợp hơn là chủ thể quy tụ người khác.
    rationale: ἐπισυναγαγεῖν là hành động quy tụ con cái; “quy tụ” diễn đạt rõ hơn tác động tập hợp của chủ thể mà vẫn tự nhiên.
