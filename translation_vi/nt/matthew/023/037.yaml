revisions:
- from: Hỡi Giê-ru-sa-lem, Giê-ru-sa-lem, ngươi giết các nhà tiên tri và ném đá những người được sai đến với ngươi! Đã bao lần ta muốn tụ họp con cái ngươi, như gà mẹ tụ họp đàn con dưới cánh mình,[a] nhưng các ngươi không muốn!
  to: Hỡi Giê-ru-sa-lem, Giê-ru-sa-lem, ngươi giết các nhà tiên tri và ném đá những người được sai đến với ngươi—đã bao lần ta muốn quy tụ con cái ngươi, như gà mẹ[a] quy tụ đàn con dưới cánh mình, mà các ngươi lại không muốn?
  rationale: Sửa dấu câu để bảo toàn cấu trúc câu hỏi tu từ và mạch lời than của nguyên văn; thay “tụ họp” bằng “quy tụ” để diễn đạt rõ tác động của động từ; và chuyển neo chú thích đến đúng từ “gà mẹ.” Các lựa chọn xưng hô, tên riêng, phép nhân cách hóa, và tương phản “muốn/không muốn” được giữ nguyên.
