revisions:
- from: Hỡi những kẻ dẫn đường mù quáng! Các ngươi lọc bỏ con muỗi nhỏ[a] nhưng lại nuốt chửng con lạc đà!
  to: Hỡi những người dẫn đường mù! Các ngươi lọc bỏ con muỗi[a] nhưng lại nuốt con lạc đà!
  rationale: Bản sửa bảo toàn hình ảnh “người dẫn đường mù” và động từ “nuốt” sát nguyên văn, tránh thêm các sắc thái “quáng”, “nhỏ”, và “chửng”. Chú thích được chỉnh để gắn trực tiếp với động từ có dấu neo, theo đúng chức năng của chú thích từ vựng, đồng thời giữ mô tả cần thiết về việc lọc chất lỏng.
