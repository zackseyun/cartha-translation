base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/024.yaml
  text: Blind guides[a], straining out the gnat but swallowing the camel!
translation:
  language: vi
  text: Hỡi những người dẫn đường mù! Các ngươi lọc bỏ con muỗi[a] nhưng lại nuốt con lạc đà!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “lọc ra con muỗi.” Động từ Hy Lạp chỉ việc lọc chất lỏng để loại một vật không tinh sạch ra.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁδηγοὶ τυφλοί
  choice: những kẻ dẫn đường mù quáng
  rationale: Giữ nguyên hình ảnh người dẫn đường nhưng lại mù; “mù quáng” tự nhiên trong tiếng Việt khi nói về sự không nhận biết thuộc linh và vẫn duy trì sức nặng của lời quở trách.
- source_word: διϋλίζοντες
  choice: lọc bỏ
  rationale: Động từ chỉ việc lọc chất lỏng để loại một vật không mong muốn; “lọc bỏ” diễn đạt rõ cả thao tác lẫn mục đích loại ra.
- source_word: τὸν κώνωπα
  choice: con muỗi nhỏ
  rationale: κώνωψ chỉ một loại côn trùng rất nhỏ như muỗi hoặc ruồi nhuế. “Muỗi nhỏ” dễ hiểu với độc giả Việt và làm nổi bật sự tương phản về kích thước với lạc đà.
- source_word: τὴν δὲ κάμηλον
  choice: nhưng lại ... con lạc đà
  rationale: “Nhưng lại” thể hiện rõ δέ tương phản và nhấn mạnh sự phi lý giữa việc tỉ mỉ loại bỏ vật cực nhỏ với việc nuốt vật khổng lồ.
- source_word: καταπίνοντες
  choice: nuốt chửng
  rationale: “Nuốt chửng” truyền đạt sinh động ý nuốt xuống hoàn toàn và giữ được tính cường điệu mạnh của hình ảnh Hy Lạp.
theological_decisions:
- issue: Sức gợi của hình ảnh ô uế theo nghi lễ
  choice: 'Giữ nguyên hình ảnh cụ thể: lọc bỏ một côn trùng nhỏ nhưng nuốt chửng một con lạc đà.'
  alternative: Diễn giải thành việc quá chú trọng lỗi nhỏ nhưng bỏ qua lỗi lớn.
  rationale: Nguyên văn không giải thích trực tiếp mà dùng một hình ảnh cường điệu. Giữ hình ảnh bảo toàn lời quở trách về sự mất cân đối trong phán đoán, đồng thời không thu hẹp ý nghĩa vào một cách diễn giải thần học riêng.
translation_notes:
  register: Văn phong trực tiếp, trang trọng và dễ hiểu. “Hỡi” đánh dấu lời gọi đầy quở trách; “các ngươi” phù hợp với lời tố cáo công khai và số nhiều trong ngữ cảnh. Cấu trúc song hành giữ nhịp điệu và sự tương phản sắc bén của nguyên văn.
