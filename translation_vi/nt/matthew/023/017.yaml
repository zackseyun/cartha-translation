  - severity: low
    issue: Chú thích [a] diễn giải ναός là “phần cung thánh” hơi quá cụ thể.
    rationale: ναός thường chỉ khu thánh điện/sanctuary, không nhất thiết chỉ một phần cụ thể được gọi là “cung thánh”; cách diễn đạt rộng hơn bảo lưu đúng phạm vi nghĩa.
