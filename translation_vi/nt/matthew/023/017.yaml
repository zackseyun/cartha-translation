source:
  edition: SBLGNT
  text: μωροὶ καὶ τυφλοί, τίς γὰρ μείζων ἐστίν, ὁ χρυσὸς ἢ ὁ ναὸς ὁ ⸀ἁγιάσας τὸν χρυσόν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/017.yaml
  text: 'You fools and blind men, for which is greater: the gold, or the temple that sanctified the gold?'
translation:
  language: vi
  text: 'Hỡi những kẻ ngu dại và mù quáng, vì cái nào lớn hơn: vàng hay đền thờ[a] đã thánh hóa[b] vàng?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hy Lạp ναός có thể chỉ cụ thể hơn khu thánh điện của Đền Thờ.
    reason: cultural_note
  - marker: b
    text: 'Hay: “làm cho vàng nên thánh.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: μωροὶ
  choice: những kẻ ngu dại
  rationale: Tính từ số nhiều ở hô cách được diễn đạt thành lời gọi trực tiếp, giữ nguyên sức nặng của lời quở trách nhưng không dùng từ thô tục.
- source_word: τυφλοί
  choice: mù quáng
  rationale: Trong lời quở trách này, cách nói tự nhiên bằng tiếng Việt diễn tả sự thiếu khả năng nhận biết đúng; đi cùng “những kẻ” ở trước nên không cần lặp danh từ.
- source_word: τίς γὰρ μείζων ἐστίν
  choice: Vì điều nào lớn hơn
  rationale: τίς hỏi lựa chọn giữa hai đối tượng đã nêu; “điều nào” tự nhiên trong tiếng Việt, còn “vì” giữ chức năng giải thích của γάρ.
- source_word: ὁ χρυσὸς
  choice: vàng
  rationale: Chỉ số vàng cụ thể đang được bàn đến trong ngữ cảnh; tiếng Việt không có mạo từ nên danh từ trần là tự nhiên.
- source_word: ὁ ναὸς
  choice: đền thờ
  rationale: Đây là cách gọi phổ thông, rõ nghĩa; chú thích bảo lưu nghĩa cụ thể hơn của ναός là nơi thánh trong Đền Thờ.
- source_word: ὁ ἁγιάσας
  choice: đã thánh hóa
  rationale: Phân từ chủ động aorist được thể hiện bằng “đã”, sát hình thái nguồn và giữ sắc thái nghi lễ của ἁγιάζω mà không giải thích thêm cơ chế.
- source_word: τὸν χρυσόν
  choice: vàng
  rationale: Lặp lại “vàng” theo nguyên văn để giữ thế song song và sức mạnh tu từ của câu hỏi.
theological_decisions:
- issue: Cách dịch ἁγιάζω trong bối cảnh Đền Thờ
  choice: đã thánh hóa
  alternative: làm cho vàng nên thánh
  rationale: “Thánh hóa” giữ được sắc thái thần học và nghi lễ của động từ, trong khi chú thích cung cấp cách diễn đạt minh bạch hơn mà không thu hẹp ý nghĩa.
- issue: Giá trị thời của phân từ aorist ὁ ἁγιάσας
  choice: đã thánh hóa
  alternative: thánh hóa
  rationale: Giữ dấu hiệu hoàn thành của aorist theo bề mặt văn bản; cách hiểu như một chân lý khái quát vẫn có thể được nhận ra từ lập luận, nhưng không được âm thầm thay vào bản dịch chính.
translation_notes:
  register: Văn phong hiện đại, trang trọng và trực diện. Dấu chấm than thể hiện lời quở trách; câu hỏi giữ cấu trúc đối chiếu của nguyên văn. Các dấu chú thích [a], [b] đều xuất hiện trong chính văn.
