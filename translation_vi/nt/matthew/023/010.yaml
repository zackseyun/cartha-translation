  source_fidelity: Bản dịch truyền đạt đầy đủ μηδὲ κληθῆτε καθηγηταί bằng mệnh lệnh phủ định nối tiếp, giữ đúng sắc thái được gọi bằng danh xưng qua “để người ta gọi”. “Người hướng dẫn”/“Đấng Hướng Dẫn” phản ánh nhất quán καθηγητής mà không đồng nhất với διδάσκαλος ở các câu lân cận. Cấu trúc “anh em chỉ có một” diễn đạt tự nhiên và bảo toàn trọng tâm của εἷς. “Đấng Mê-si-a” dịch đúng ὁ χριστός như một tước hiệu.
  naturalness: Câu văn hiện đại, rõ ràng và phù hợp văn phong giáo huấn trang trọng. “Cũng đừng” liên kết tự nhiên với chuỗi lời dạy trước đó; “vì” nêu lý do gọn, mạch lạc. Viết hoa ở lần thứ hai giúp nhận diện danh xưng quy về Đấng Mê-si-a, trong khi lần thứ nhất vẫn là cách gọi chung.
  terminology: '“Đấng Mê-si-a” phù hợp việc dịch tước hiệu Χριστός; chú thích “Hay: ‘Đấng Christ.’” cung cấp cách gọi truyền thống thay thế và được neo đúng tại thuật ngữ liên quan. “Anh em” là lựa chọn xưng hô số nhiều thích hợp trong ngữ cảnh lời dạy.'
