id: MAT.23.10
reference: Matthew 23:10
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: μηδὲ κληθῆτε καθηγηταί, ⸂ὅτι καθηγητὴς ὑμῶν ἐστιν εἷς⸃ ὁ χριστός·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/010.yaml
  text: Do not be called instructors, for you have one instructor, the Messiah[a].
translation:
  language: vi
  text: Cũng đừng để người ta gọi anh em là người hướng dẫn, vì anh em chỉ có một Đấng Hướng Dẫn, là Đấng Mê-si-a[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “Đấng Christ.”'
    reason: Nêu cách chuyển tự truyền thống khác của tước hiệu Χριστός.
lexical_decisions:
- source_word: μηδὲ
  choice: Cũng đừng
  rationale: Giữ chức năng nối tiếp các điều cấm ở những câu trước, đồng thời diễn đạt tự nhiên trong tiếng Việt.
- source_word: κληθῆτε
  choice: để người ta gọi anh em là
  rationale: Diễn đạt thể bị động của καλέω trong ngữ cảnh được gọi bằng một danh xưng; cấu trúc chủ động phiếm chỉ tự nhiên hơn trong tiếng Việt.
- source_word: καθηγηταί / καθηγητὴς
  choice: người hướng dẫn / Đấng Hướng Dẫn
  rationale: καθηγητής chỉ người dẫn dắt hoặc chỉ dạy. “Người hướng dẫn” tự nhiên, giữ được sắc thái dẫn dắt và không đồng nhất từ này với διδάσκαλος ở văn cảnh gần.
- source_word: ὅτι
  choice: vì
  rationale: Giới thiệu lý do cho điều cấm một cách ngắn gọn và tự nhiên.
- source_word: ὑμῶν ἐστιν εἷς
  choice: anh em chỉ có một
  rationale: Chuyển cấu trúc vị ngữ sở hữu của tiếng Hy Lạp sang cách nói Việt tự nhiên, đồng thời giữ sự nhấn mạnh rằng chỉ có một vị hướng dẫn.
- source_word: ὁ χριστός
  choice: Đấng Mê-si-a
  rationale: Mạo từ cho thấy Χριστός được dùng như một tước hiệu; “Đấng Mê-si-a” truyền đạt ý nghĩa tước hiệu và bối cảnh Do Thái.
theological_decisions:
- issue: Cách dịch Χριστός
  choice: Đấng Mê-si-a
  alternative: Đấng Christ
  rationale: Trong câu này, từ ngữ hoạt động như một tước hiệu hơn là một tên riêng. Bản dịch chính nêu rõ tước hiệu Mê-si-a, còn cách gọi quen thuộc “Đấng Christ” được giữ trong chú thích.
- issue: Sự duy nhất của καθηγητής
  choice: anh em chỉ có một Đấng Hướng Dẫn
  alternative: Đấng Hướng Dẫn của anh em là một
  rationale: 'Cách chọn tự nhiên hơn trong tiếng Việt và vẫn bảo toàn điểm nhấn εἷς: cộng đồng chỉ có một vị giữ địa vị tối hậu này.'
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Anh em” dùng làm đại từ số nhiều trong lời giáo huấn; cách viết hoa “Đấng Hướng Dẫn” ở lần thứ hai phản ánh việc danh xưng này quy về Đấng Mê-si-a, không biến lần dùng chung trước đó thành một tước hiệu riêng.
