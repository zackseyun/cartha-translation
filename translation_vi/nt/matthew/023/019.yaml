revisions:
- from: 'Hỡi những kẻ mù quáng![a] Vì điều nào lớn hơn: lễ vật[b], hay bàn thờ làm cho lễ vật nên thánh[c]?'
  to: 'Hỡi những người mù![a] Vì cái nào lớn hơn: lễ vật[b] hay bàn thờ làm cho lễ vật nên thánh[c]?'
  rationale: Đổi “những kẻ mù quáng” thành “những người mù” để phản ánh trực tiếp τυφλοί và không diễn giải trước hình ảnh của bản văn. Đổi “điều nào” thành “cái nào” cho câu hỏi so sánh tự nhiên hơn. Giữ nguyên các thuật ngữ tế tự, sắc thái “làm cho nên thánh,” và chú thích dị bản để không đưa cách đọc có thêm “ngu dại” vào bản văn chính.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T05:44:05Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch giữ đúng trật tự lập luận và các thuật ngữ tế tự chính: δῶρον là “lễ vật,” θυσιαστήριον là “bàn thờ,” và mệnh đề phân từ hiện tại τὸ ἁγιάζον được diễn đạt là tác động khiến lễ vật nên thánh. Tuy nhiên, τυφλοί theo nghĩa đen là “những người mù”; “mù quáng” chuyển ngay sang nghĩa bóng và vì thế giảm bớt hình ảnh tu từ nguyên ngữ.'
  naturalness: “Vì điều nào lớn hơn” có thể hiểu được nhưng hơi gượng trong câu hỏi so sánh về hai sự vật. “Vì cái nào lớn hơn” tự nhiên hơn trong tiếng Việt hiện đại mà vẫn trang trọng trong ngữ cảnh này.
  terminology: “Lễ vật,” “bàn thờ,” và “làm cho lễ vật nên thánh” đều phù hợp với văn cảnh Đền Thờ và giữ được trọng lượng của ἁγιάζω. Không nên thêm “ngu dại” vào bản văn chính, vì SBLGNT chỉ đọc τυφλοί.
  issues:
  - severity: medium
    issue: “những kẻ mù quáng” diễn giải τυφλοί thành nghĩa bóng.
    rationale: Từ Hy Lạp là tính từ “mù,” được danh từ hóa trong lời gọi trực tiếp. “Những người mù” giữ hình ảnh và sức quở trách của nguyên ngữ mà vẫn để người đọc nhận ra hàm ý đạo đức trong văn cảnh.
  - severity: low
    issue: “Vì điều nào lớn hơn” chưa tự nhiên bằng cách hỏi về hai đối tượng cụ thể.
    rationale: τί γὰρ μεῖζον hỏi đối chiếu lễ vật với bàn thờ; “Vì cái nào lớn hơn” diễn đạt trực tiếp, tự nhiên, và vẫn bảo toàn γάρ cùng so sánh μεῖζον.
