  text: ⸀τυφλοί, τί γὰρ μεῖζον, τὸ δῶρον ἢ τὸ θυσιαστήριον τὸ ἁγιάζον τὸ δῶρον;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/019.yaml
  text: Blind men[a], for which is greater[b], the gift or the altar that sanctifies the gift?
translation:
  language: vi
  text: 'Hỡi những người mù![a] Vì cái nào lớn hơn: lễ vật[b] hay bàn thờ làm cho lễ vật nên thánh[c]?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Một số bản chép có: “Hỡi những kẻ ngu dại và mù quáng!”'
    reason: textual_variant
  - marker: b
    text: Cũng có thể dịch là “vật dâng”.
    reason: lexical_alternative
  - marker: c
    text: Hay “thánh hóa lễ vật”.
    reason: lexical_alternative
lexical_decisions:
- source_word: τυφλοί
  choice: những kẻ mù quáng
  rationale: Tính từ số nhiều được dùng như danh từ trong lời gọi trực tiếp mang tính quở trách. “Mù quáng” tự nhiên trong tiếng Việt và diễn đạt sự mù lòa về nhận thức; không tự ý thêm ý “ngu dại” vào bản văn chính.
- source_word: τί γὰρ μεῖζον
  choice: Vì điều nào lớn hơn
  rationale: “Điều nào” diễn đạt câu hỏi so sánh của τί, “lớn hơn” giữ trực tiếp sắc thái của μεῖζον, còn “vì” thể hiện chức năng giải thích của γάρ.
- source_word: τὸ δῶρον
  choice: lễ vật
  rationale: Trong bối cảnh đền thờ, δῶρον là vật được dâng lên. “Lễ vật” vừa dễ hiểu vừa làm rõ ngữ cảnh tế tự, trong khi “quà tặng” có thể gây hiểu lầm trong tiếng Việt hiện đại.
- source_word: θυσιαστήριον
  choice: bàn thờ
  rationale: Cách dịch thông dụng và chính xác cho θυσιαστήριον trong bối cảnh thờ phượng và tế lễ.
- source_word: τὸ ἁγιάζον
  choice: làm cho ... nên thánh
  rationale: Cụm này truyền đạt rõ tác động của ἁγιάζω đối với lễ vật, đồng thời giữ nguyên ngôn ngữ về sự thánh khiết trong lập luận của câu.
theological_decisions:
- issue: Ngôn ngữ tế tự của ἁγιάζω trong quan hệ giữa bàn thờ và lễ vật
  choice: bàn thờ làm cho lễ vật nên thánh
  alternative: bàn thờ thánh hóa lễ vật
  rationale: Cách dịch đã chọn giữ khẳng định rằng bàn thờ truyền tính thánh cho lễ vật, nhưng dùng lối nói tự nhiên và dễ hiểu hơn “thánh hóa” mà không làm suy giảm sức nặng thần học.
- issue: Dị bản trong lời quở trách mở đầu
  choice: những kẻ mù quáng
  alternative: những kẻ ngu dại và mù quáng
  rationale: Bản văn chính theo SBLGNT chỉ có τυφλοί. Cụm “ngu dại và” được ghi ở chú thích như một dị bản, thay vì đưa vào bản văn chính.
translation_notes:
  register: Văn phong hiện đại, trang trọng và trực tiếp. “Hỡi” giữ hình thức gọi rõ ràng của lời quở trách; “những kẻ mù quáng” có sức nặng nhưng không thêm lời xúc phạm không có trong bản văn SBLGNT. Cấu trúc câu hỏi được giữ gần nguyên văn, đồng thời dùng “lễ vật” và “làm cho ... nên thánh” để người đọc phổ thông dễ hiểu.
