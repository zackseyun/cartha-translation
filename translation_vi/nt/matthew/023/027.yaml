revisions:
- from: '“Khốn cho các ông, những kinh sư và người Pha-ri-si, là những kẻ giả hình! Vì các ông giống như những ngôi mộ quét vôi trắng[a]: bên ngoài trông đẹp đẽ, nhưng bên trong đầy xương người chết và mọi thứ ô uế[b].”'
  to: '“Khốn cho các ông, những kinh sư và người Pha-ri-si, là những kẻ giả hình! Vì các ông giống như những ngôi mộ quét vôi trắng[a]: bên ngoài trông đẹp đẽ, nhưng bên trong đầy xương người chết và mọi sự ô uế[b].”'
  rationale: Chỉ thay «mọi thứ ô uế» bằng «mọi sự ô uế» để phản ánh chính xác và tự nhiên hơn phạm vi trừu tượng, rộng mở của πάσης ἀκαθαρσίας. Không thay đổi ý nghĩa, sắc thái phán xét, hay tính mơ hồ có chủ ý về ô uế nghi lễ và đạo đức.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T05:42:27Z'
review_pass:
  verdict: revise
  source_fidelity: Bản dịch truyền đạt đúng lời tuyên án «Khốn cho», các đối tượng được gọi tên, phép so sánh với mộ quét vôi trắng, và sự tương phản giữa vẻ ngoài với thực trạng bên trong. «Xương người chết» phản ánh tự nhiên ὀστέων νεκρῶν. Tuy nhiên, «mọi thứ ô uế» dễ chuyển nghĩa từ khái niệm/trạng thái ἀκαθαρσία sang các vật thể ô uế; «mọi sự ô uế» giữ sát và bao quát hơn.
  naturalness: Văn phong hiện đại, trang trọng, và lời quở trách trực diện rất tự nhiên. Cấu trúc «bên ngoài trông đẹp đẽ, nhưng bên trong đầy...» rõ và nhịp nhàng.
  terminology: «Kinh sư», «người Pha-ri-si», «kẻ giả hình», và «mộ quét vôi trắng» đều phù hợp với cách dùng Kinh Thánh tiếng Việt hiện đại. Nên dùng «mọi sự ô uế» cho danh từ trừu tượng ἀκαθαρσία; chú thích tiếp tục bảo toàn cả bình diện nghi lễ lẫn đạo đức, không áp đặt một cách hiểu đơn tuyến.
  issues:
  - severity: low
    issue: «mọi thứ ô uế»
    rationale: πάσης ἀκαθαρσίας là «mọi sự ô uế/điều ô uế» theo nghĩa bao quát. «Mọi thứ» trong tiếng Việt thường gợi các vật/sự vật riêng lẻ hơn và kém sát sắc thái danh từ trừu tượng của nguyên ngữ.
