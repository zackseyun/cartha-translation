id: MAT.23.27
reference: Matthew 23:27
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Οὐαὶ ὑμῖν, γραμματεῖς καὶ Φαρισαῖοι ὑποκριταί, ὅτι ⸀παρομοιάζετε τάφοις κεκονιαμένοις, οἵτινες ἔξωθεν μὲν φαίνονται ὡραῖοι ἔσωθεν δὲ γέμουσιν ὀστέων νεκρῶν καὶ πάσης ἀκαθαρσίας·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/027.yaml
  text: Woe to you[a], scribes and Pharisees, hypocrites! For you are like whitewashed tombs, which outwardly appear beautiful[b], but inwardly are full of dead people's bones and every kind of uncleanness.
translation:
  language: vi
  text: '“Khốn cho các ông, những kinh sư và người Pha-ri-si, là những kẻ giả hình! Vì các ông giống như những ngôi mộ quét vôi trắng[a]: bên ngoài trông đẹp đẽ, nhưng bên trong đầy xương người chết và mọi sự ô uế[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “những ngôi mộ được trát vôi trắng.”'
    reason: lexical_alternative
  - marker: b
    text: “Ô uế” ở đây có thể bao gồm cả sự ô uế theo nghi lễ lẫn sự bại hoại về đạo đức.
    reason: cultural_note
lexical_decisions:
- source_word: Οὐαὶ
  choice: Khốn cho
  rationale: Giữ sắc thái tuyên cáo phán xét và lên án mạnh mẽ của lời cảnh cáo tiên tri, thay vì làm nhẹ thành một lời than buồn.
- source_word: γραμματεῖς
  choice: kinh sư
  rationale: Danh xưng ngắn gọn, quen dùng để chỉ giới học giả và chuyên gia Kinh Luật Do Thái; ít diễn giải hơn “thầy dạy luật”.
- source_word: Φαρισαῖοι
  choice: người Pha-ri-si
  rationale: Phiên âm chuẩn, dễ nhận biết tên của nhóm tôn giáo này.
- source_word: ὑποκριταί
  choice: những kẻ giả hình
  rationale: Diễn đạt rõ sự giả dối trong đời sống đạo đức và tôn giáo mà lời lên án nhắm đến.
- source_word: παρομοιάζετε
  choice: các ông giống như
  rationale: Cách nói tự nhiên trong tiếng Việt, giữ nguyên phép so sánh trực tiếp.
- source_word: τάφοις κεκονιαμένοις
  choice: những ngôi mộ quét vôi trắng
  rationale: Tái hiện cụ thể hình ảnh các ngôi mộ được phủ vôi, đồng thời giữ lối diễn đạt rõ ràng và giàu hình ảnh.
- source_word: ἔξωθεν μὲν ... ἔσωθεν δὲ
  choice: bên ngoài ... nhưng bên trong
  rationale: Giữ rõ thế đối lập tu từ giữa dáng vẻ bề ngoài và thực trạng bên trong.
- source_word: φαίνονται ὡραῖοι
  choice: trông đẹp đẽ
  rationale: Thể hiện vẻ đẹp chỉ thuộc bình diện nhìn thấy và nhấn mạnh yếu tố bề ngoài.
- source_word: γέμουσιν
  choice: đầy
  rationale: Cách diễn đạt trực tiếp, tự nhiên cho ý “chứa đầy”.
- source_word: ὀστέων νεκρῶν
  choice: xương người chết
  rationale: Chuyển cấu trúc sở hữu Hy Lạp sang tiếng Việt tự nhiên mà không tạo cảm giác rằng bản thân xương được gọi là “chết”.
- source_word: πάσης ἀκαθαρσίας
  choice: mọi thứ ô uế
  rationale: Giữ nghĩa rộng của ἀκαθαρσία, không giới hạn vào sự ô uế nghi lễ hay sự bại hoại đạo đức.
theological_decisions:
- issue: Phạm vi ý nghĩa của ἀκαθαρσία trong hình ảnh ẩn dụ
  choice: mọi thứ ô uế
  alternative: sự ô uế theo nghi lễ; sự bại hoại đạo đức
  rationale: Mộ và hài cốt gợi đến sự ô uế theo nghi lễ trong bối cảnh Do Thái, còn lời quở trách những kẻ giả hình cũng hàm ý sự bại hoại đạo đức bên trong. Cách dịch rộng duy trì cả hai chiều nghĩa.
translation_notes:
  register: Văn phong hiện đại, trang trọng và trực diện. “Các ông” phù hợp với lời quở trách công khai dành cho một nhóm nam giới có địa vị tôn giáo; “kinh sư” và “kẻ giả hình” là những cách gọi dễ hiểu trong tiếng Việt Kinh Thánh hiện nay. Dấu hai chấm làm rõ rằng phần sau giải thích hình ảnh so sánh.
source_grounding:
  english_pob_role: consult_only
