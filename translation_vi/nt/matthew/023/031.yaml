  text: ὥστε μαρτυρεῖτε ἑαυτοῖς ὅτι υἱοί ἐστε τῶν φονευσάντων τοὺς προφήτας.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/031.yaml
  text: So you testify against yourselves that you are sons of those who murdered the prophets[a].
translation:
  language: vi
  text: Vì thế, các ông làm chứng chống lại chính mình rằng các ông là con của những kẻ đã sát hại các nhà tiên tri.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc dịch sát hơn: “các ông làm chứng về chính mình.” Cấu trúc Hy Lạp có thể được dịch sát theo cách này, nhưng trong ngữ cảnh, lời chứng ấy buộc tội chính họ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: Như vậy
  rationale: Diễn đạt tự nhiên ý kết quả hoặc suy luận từ lời vừa nói ở câu trước.
- source_word: μαρτυρεῖτε
  choice: làm chứng
  rationale: Giữ nghĩa căn bản là đưa ra lời chứng, đồng thời phù hợp với sắc thái lời chứng mang tính buộc tội trong ngữ cảnh.
- source_word: ἑαυτοῖς
  choice: chống lại chính mình
  rationale: Dạng tặng cách có thể dịch sát là “cho/với chính mình”, nhưng trong ngữ cảnh, lời chứng của họ lại quy tội cho chính họ; bản dịch chính diễn đạt rõ tác dụng này.
- source_word: ὅτι
  choice: rằng
  rationale: Dẫn vào nội dung của lời chứng, chứ không phải một mệnh đề chỉ nguyên nhân.
- source_word: υἱοί
  choice: con
  rationale: Giữ hình ảnh quan hệ cha-con của nguyên văn và hàm ý vừa thuộc dòng dõi vừa đồng lòng về mặt đạo đức; “hậu duệ” sẽ làm yếu hình ảnh gia đình.
- source_word: τῶν φονευσάντων
  choice: của những kẻ đã sát hại
  rationale: Phân từ aorist xác định họ qua hành động đã xảy ra; “sát hại” truyền đạt tính chất giết người sai trái rõ hơn “giết”.
- source_word: τοὺς προφήτας
  choice: các nhà tiên tri
  rationale: Cách gọi tự nhiên trong tiếng Việt đối với nhóm sứ giả của Đức Chúa Trời được nhắc đến trong lịch sử Israel.
theological_decisions:
- issue: Nên dịch υἱοί theo hình ảnh “con” hay diễn giải rộng thành “con cháu/hậu duệ”.
  choice: con
  alternative: con cháu; hậu duệ
  rationale: “Con” bảo toàn hình ảnh gia đình và sức nặng tu từ của lời quở trách, đồng thời trong tiếng Việt vẫn có thể chỉ cả quan hệ dòng dõi lẫn sự tiếp nối thái độ và hành vi của tổ tiên.
translation_notes:
  register: Văn phong hiện đại, trang trọng và trực tiếp. Dùng “các ông” để phù hợp với lời quở trách hướng đến nhóm lãnh đạo tôn giáo nam trong ngữ cảnh. Cụm “chống lại chính mình” nêu rõ sắc thái tự buộc tội, còn chú thích giữ lại cách hiểu sát cấu trúc Hy Lạp.
