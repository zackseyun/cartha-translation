revisions:
- from: Nhưng khốn cho các ông, những kinh sư và người Pha-ri-si, là những kẻ đạo đức giả! Vì các ông đóng cửa vương quốc thiên đàng[a] trước mặt người ta. Chính các ông không vào, mà cũng không để những người đang vào[b] được vào.
  to: Nhưng khốn cho các ông, những kinh sư và người Pha-ri-si, là những kẻ đạo đức giả! Vì các ông đóng cửa Nước Trời[a] trước mặt người ta. Chính các ông không vào, mà cũng không để những người đang vào[b] vào được.
  rationale: Sửa “vương quốc thiên đàng” thành “Nước Trời” để dùng thành ngữ Việt ngữ tự nhiên, đúng chức năng của cụm từ đặc trưng trong Ma-thi-ơ và tránh gợi sai về một địa điểm. Điều chỉnh vị trí của “được” làm câu tự nhiên hơn mà không thay đổi nghĩa hoặc làm mất sự lặp có chủ ý trong tiếng Hy Lạp.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T05:42:18Z'
review_pass:
  verdict: revise
  source_fidelity: Bản dịch truyền đạt đầy đủ lời khốn, đối tượng bị quở trách, hành động ngăn trở, và đối ứng “không vào/không cho vào” của nguyên văn. Tuy nhiên, “vương quốc thiên đàng” dễ gợi một địa điểm hậu thế hơn là thành ngữ Matthean về quyền trị vì của Đức Chúa Trời; “Nước Trời” là cách nói Việt ngữ tự nhiên và chính xác hơn trong ngữ cảnh này.
  naturalness: Văn phong nhìn chung hiện đại, trang trọng và rõ. “Nước Trời” tự nhiên hơn “vương quốc thiên đàng”. Cấu trúc lặp “đang vào ... được vào” có cơ sở trong nguyên văn và vẫn chấp nhận được; sửa nhẹ thành “vào được” giúp câu trôi chảy mà vẫn giữ cả phân từ hiện tại lẫn động từ nguyên mẫu.
  terminology: Giữ “kinh sư”, “Pha-ri-si”, “đạo đức giả”, và “khốn cho” là phù hợp. Đổi thuật ngữ chính thành “Nước Trời”; chú thích bảo lưu dạng sát chữ số nhiều “các tầng trời”, không áp đặt phân biệt giáo lý với “Nước Đức Chúa Trời”.
