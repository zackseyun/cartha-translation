id: MAT.23.13
reference: Matthew 23:13
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Οὐαὶ ⸀δὲ ὑμῖν, γραμματεῖς καὶ Φαρισαῖοι ὑποκριταί, ὅτι κλείετε τὴν βασιλείαν τῶν οὐρανῶν ἔμπροσθεν τῶν ἀνθρώπων· ὑμεῖς γὰρ οὐκ εἰσέρχεσθε, οὐδὲ τοὺς εἰσερχομένους ἀφίετε ⸀εἰσελθεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/013.yaml
  text: But woe to you[a], scribes and Pharisees, hypocrites! For you shut the kingdom of heaven before people; for you do not enter[c][b], nor do you allow those who are entering to enter.
translation:
  language: vi
  text: Nhưng khốn cho các ông, những kinh sư và người Pha-ri-si, là những kẻ đạo đức giả! Vì các ông đóng cửa Nước Trời[a] trước mặt người ta. Chính các ông không vào, mà cũng không để những người đang vào[b] vào được.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát hơn: “vương quốc của các tầng trời.” Ma-thi-ơ thường dùng cách diễn đạt này ở những chỗ mà trong các ngữ cảnh khác có thể nói “vương quốc của Đức Chúa Trời.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể hiểu: “những người đang tìm cách vào.” Phân từ Hy Lạp có thể chỉ những người đang trong tiến trình đi vào hoặc đang tìm cách vào.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐαὶ
  choice: khốn cho
  rationale: Giữ sắc thái tuyên án mạnh mẽ theo truyền thống ngôn sứ, thay vì làm nhẹ thành một lời than buồn.
- source_word: γραμματεῖς
  choice: những kinh sư
  rationale: Chỉ những người thông thạo và giảng dạy kinh luật; cách gọi này ngắn gọn, trang trọng và quen thuộc trong văn cảnh Tin Mừng.
- source_word: Φαρισαῖοι
  choice: người Pha-ri-si
  rationale: Phiên âm tên của nhóm tôn giáo Do Thái này theo cách dùng tiếng Việt phổ biến.
- source_word: ὑποκριταί
  choice: những kẻ đạo đức giả
  rationale: Diễn đạt rõ sự giả hình về đạo đức và tôn giáo hàm chứa trong lời quở trách.
- source_word: κλείετε
  choice: đóng cửa
  rationale: Tiếng Hy Lạp nói theo ẩn dụ rằng họ đóng vương quốc lại; thêm danh từ tự nhiên 'cửa' trong tiếng Việt làm rõ hình ảnh ngăn lối vào mà không thay đổi ý.
- source_word: βασιλείαν τῶν οὐρανῶν
  choice: vương quốc thiên đàng
  rationale: Giữ ý nghĩa về quyền trị vì và vương quốc, đồng thời phản ánh cách diễn đạt đặc trưng của Ma-thi-ơ mà không đồng nhất hoặc phân biệt nó về mặt giáo lý với 'vương quốc của Đức Chúa Trời'.
- source_word: ἔμπροσθεν τῶν ἀνθρώπων
  choice: trước mặt người ta
  rationale: Giữ hình ảnh họ đóng lối ngay trước những người muốn tiếp cận; 'người ta' mang nghĩa chung, không giới hạn ở nam giới.
- source_word: τοὺς εἰσερχομένους
  choice: những người đang vào
  rationale: Giữ thể hiện tại của phân từ, có thể chỉ những người trong tiến trình đi vào; một chú thích nêu khả năng hiểu là những người đang tìm cách vào.
- source_word: ἀφίετε εἰσελθεῖν
  choice: để ... được vào
  rationale: Trong cấu trúc này, ἀφίημι mang nghĩa cho phép; cách diễn đạt tiếng Việt tự nhiên vẫn giữ động từ 'vào' được nêu rõ trong nguyên văn.
theological_decisions:
- issue: Cách dịch βασιλεία τῶν οὐρανῶν
  choice: vương quốc thiên đàng
  alternative: vương quốc của các tầng trời
  rationale: Bản chính dùng cách nói tự nhiên hơn trong tiếng Việt nhưng không đưa vào một sự phân biệt giáo lý với 'vương quốc của Đức Chúa Trời'; chú thích bảo tồn dạng số nhiều theo sát tiếng Hy Lạp.
- issue: Sắc thái của τοὺς εἰσερχομένους
  choice: những người đang vào
  alternative: những người đang tìm cách vào
  rationale: Bản chính bảo tồn trực tiếp tiến trình 'đang vào', còn chú thích thừa nhận phân từ hiện tại trong văn cảnh cũng có thể nói đến những người đang cố gắng hoặc mong muốn vào.
translation_notes:
  register: Văn phong hiện đại, trang trọng và trực tiếp. Đại từ “các ông” phù hợp với lời quở trách trực diện dành cho các lãnh đạo nam được nêu đích danh; “người ta” giữ nghĩa bao quát của ἀνθρώπων. Cấu trúc lặp “đang vào ... được vào” được giữ có chủ ý để phản ánh sự lặp εἰσερχομένους ... εἰσελθεῖν trong nguyên văn.
