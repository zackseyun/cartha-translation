id: MAT.23.33
reference: Matthew 23:33
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὄφεις γεννήματα ἐχιδνῶν, πῶς φύγητε ἀπὸ τῆς κρίσεως τῆς γεέννης;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/033.yaml
  text: You snakes[a], offspring of vipers! How will you escape from the judgment of Gehenna?
translation:
  language: vi
  text: Hỡi những con rắn, nòi rắn độc! Làm sao các người thoát khỏi sự phán xét của Ghê-hen-na[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “sự phán xét của hỏa ngục.” Tiếng Hy Lạp: “Ghê-hen-na.”'
    reason: Nêu cách dịch quen thuộc trong khi bản văn chính giữ thuật ngữ cụ thể của nguyên ngữ.
lexical_decisions:
- source_word: ὄφεις
  choice: những con rắn
  rationale: Lời gọi trực tiếp mang tính quở trách; cách diễn đạt hiện đại, tự nhiên và giữ nguyên hình ảnh.
- source_word: γεννήματα ἐχιδνῶν
  choice: nòi rắn lục
  rationale: “Nòi” diễn đạt điều được sinh ra, còn “rắn lục” giữ tính cụ thể của ἐχιδνῶν; cả cụm ngắn gọn và có sức tố cáo trong tiếng Việt.
- source_word: πῶς φύγητε
  choice: Làm sao các người thoát khỏi
  rationale: Giữ dạng câu hỏi tu từ và sắc thái hướng đến kết quả tương lai mà không thu hẹp thành chỉ khả năng hay chỉ dự báo.
- source_word: κρίσεως
  choice: sự phán xét
  rationale: Giữ nghĩa tư pháp rộng của từ Hy Lạp, không diễn giải mạnh hơn thành “sự kết án”.
- source_word: γεέννης
  choice: Ghê-hen-na
  rationale: Phiên âm địa danh/thuật ngữ Hy Lạp để giữ bối cảnh Do Thái và tính đặc thù của nguyên văn; nghĩa quen thuộc hơn được nêu trong chú thích.
theological_decisions:
- issue: Cách dịch γέεννα
  choice: Ghê-hen-na
  alternative: hỏa ngục
  rationale: Giữ thuật ngữ cụ thể của nguyên văn cùng những liên hệ lịch sử và cánh chung của nó, thay vì mặc nhiên đồng nhất với mọi quan niệm về “hỏa ngục”; chú thích cung cấp cách dịch truyền thống.
- issue: Sắc thái của κρίσις
  choice: sự phán xét
  alternative: sự kết án
  rationale: Nguyên văn dùng từ chỉ sự xét xử/phán xét; “sự kết án” sẽ quyết định trước kết quả theo cách mạnh hơn riêng danh từ này đòi hỏi.
translation_notes:
  register: Văn phong hiện đại, trang trọng và trực diện. “Các người” truyền đạt giọng quở trách gay gắt trong ngữ cảnh; “nòi rắn lục” tự nhiên hơn lối diễn đạt quá sát chữ nhưng vẫn giữ đầy đủ hình ảnh nguồn.
