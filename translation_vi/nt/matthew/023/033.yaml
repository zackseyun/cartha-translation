revisions:
- from: Hỡi những con rắn, nòi rắn lục! Làm sao các người thoát khỏi sự phán xét của Ghê-hen-na[a]?
  to: Hỡi những con rắn, nòi rắn độc! Làm sao các người thoát khỏi sự phán xét của Ghê-hen-na[a]?
  rationale: Sửa duy nhất «nòi rắn lục» thành «nòi rắn độc» để tránh thu hẹp ἐχιδνῶν vào một loài rắn cụ thể mà nguyên văn không xác định. Giữ nguyên cấu trúc, sắc thái quở trách, câu hỏi tu từ, thuật ngữ Ghê-hen-na và chú thích.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T05:42:39Z'
review_pass:
  verdict: revise
  source_fidelity: Cụm «nòi rắn lục» không phù hợp sát với ἐχιδνῶν. Từ này chỉ loài rắn độc/viper, không riêng loài «rắn lục» (một tên gọi cụ thể, thường gợi màu sắc và nhóm rắn khác trong tiếng Việt). Các thành tố còn lại giữ được lời mắng trực diện, câu hỏi tu từ, ý «thoát khỏi», và thuật ngữ γεέννα.
  naturalness: Câu văn trang trọng, rõ ràng và tự nhiên. «Hỡi những con rắn» và «các người» truyền được giọng quở trách; chỉ cần thay tên loài quá đặc thù để câu vừa tự nhiên vừa chính xác hơn.
  terminology: Nên dùng «rắn độc» cho ἐχιδνῶν trong bản văn Việt ngữ phổ thông. «Ghê-hen-na» giữ được thuật ngữ Hy Lạp đặc thù; chú thích nêu «hỏa ngục» như cách dịch quen thuộc mà không đồng nhất hóa thuật ngữ này trong bản văn chính. «Sự phán xét» phản ánh κρίσις tốt hơn «sự kết án».
  issues:
  - severity: medium
    issue: «rắn lục» là cách định danh quá đặc thù cho ἐχιδνῶν.
    rationale: ἐχίδνα là viper/rắn độc, không đòi hỏi nghĩa «rắn lục». «Rắn lục» trong tiếng Việt thường chỉ một loài/nhóm rắn cụ thể, nên thêm chi tiết phân loại không có trong nguyên văn. «Nòi rắn độc» giữ lực tố cáo và nghĩa cần thiết.
