id: MAT.23.22
reference: Matthew 23:22
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ὁ ὀμόσας ἐν τῷ οὐρανῷ ὀμνύει ἐν τῷ θρόνῳ τοῦ θεοῦ καὶ ἐν τῷ καθημένῳ ἐπάνω αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/022.yaml
  text: And whoever swears by heaven swears by the throne of God and by the one seated upon it[a].
translation:
  language: vi
  text: Ai lấy trời mà thề thì cũng lấy ngai của Đức Chúa Trời và Đấng ngự trên ngai ấy[a] mà thề.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “Đấng đang ngồi trên ngai ấy.”
    reason: Ghi nhận cách dịch sát hình thức hơn của τῷ καθημένῳ; “ngự” truyền đạt sắc thái ngai vua, còn “đang ngồi” biểu đạt trực tiếp tư thế trong nguyên văn.
lexical_decisions:
- source_word: ὁ ὀμόσας
  choice: ai ... mà thề
  rationale: Phân từ aorist có mạo từ được dùng theo nghĩa khái quát, chỉ bất cứ người nào thề; cách diễn đạt này tự nhiên trong tiếng Việt và không buộc hành động vào quá khứ.
- source_word: ἐν
  choice: lấy ... mà thề
  rationale: Trong công thức thề nguyện, ἐν với cách dữ liệu nêu đối tượng được viện dẫn để thề; tiếng Việt tự nhiên dùng cấu trúc “lấy ... mà thề” thay vì nghĩa không gian “trong”.
- source_word: οὐρανῷ
  choice: trời
  rationale: Trong ngữ cảnh tôn giáo Do Thái và sự liên hệ ngay sau đó với ngai Đức Chúa Trời, οὐρανός chỉ cõi trời chứ không đơn thuần là bầu trời vật lý.
- source_word: ὀμνύει
  choice: thì cũng ... mà thề
  rationale: Thì hiện tại diễn tả một chân lý khái quát; “thì cũng” làm rõ hệ quả đồng nhất giữa lời thề lấy trời và lời thề lấy ngai cùng Đấng ngự trên đó.
- source_word: θρόνῳ τοῦ θεοῦ
  choice: ngai của Đức Chúa Trời
  rationale: Giữ rõ kết cấu sở hữu của nguyên văn và giọng trang trọng, đồng thời dùng cách gọi quen thuộc, tôn kính trong tiếng Việt.
- source_word: τῷ καθημένῳ
  choice: Đấng ngự
  rationale: Phân từ chỉ vị đang ngồi trên ngai; “Đấng ngự” vừa tự nhiên, trang trọng, vừa thể hiện hình ảnh đăng quang mà không thay trực tiếp bằng danh xưng “Đức Chúa Trời”.
- source_word: ἐπάνω αὐτοῦ
  choice: trên ngai ấy
  rationale: Trong ngữ cảnh này, cụm từ chỉ việc ngự trên ngai, không phải ở phía trên nhưng tách rời khỏi ngai. Lặp lại “ngai ấy” giúp đại từ quy chiếu rõ ràng trong tiếng Việt.
theological_decisions:
- issue: Đối tượng được gọi là “Đấng ngự trên ngai ấy”
  choice: Giữ lối nói tôn kính gián tiếp, chỉ Đức Chúa Trời đang ngự trên ngai
  alternative: Nói thẳng “Đức Chúa Trời” hoặc dùng cách ít xác định hơn như “đấng ngồi trên đó”
  rationale: Cụm “ngai của Đức Chúa Trời” làm đối tượng quy chiếu đủ rõ, nhưng nguyên văn vẫn dùng một danh hóa phân từ. Bản dịch giữ lối nói gián tiếp này để bảo toàn cấu trúc và sắc thái thần học của câu.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Cấu trúc “lấy ... mà thề” phù hợp thành ngữ thề nguyện; “Đấng ngự” duy trì sắc thái tôn kính và hình ảnh ngai vua.
