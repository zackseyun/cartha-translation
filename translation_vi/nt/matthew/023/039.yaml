revisions:
- from: 'Vì tôi nói với các người rằng[a], từ nay các người chắc chắn sẽ không thấy tôi cho đến khi các người nói rằng[b]: “Phước cho Đấng đến nhân danh Chúa!”'
  to: 'Vì tôi nói với các người[a]: từ nay các người chắc chắn sẽ không thấy tôi cho đến khi các người nói[b]: “Phước cho Đấng nhân danh Chúa mà đến!”'
  rationale: Chỉnh nhẹ cú pháp để câu tiếng Việt bớt lặp và tự nhiên hơn; điều chỉnh trật tự cụm trích dẫn theo cách nói Việt ngữ thông dụng. Mức độ nhấn mạnh của οὐ μή, thời hạn tương lai của ἕως ἄν, và sự mơ hồ có chủ ý về biến cố tương lai đều được giữ nguyên.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T05:42:44Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch giữ đúng các thành tố chính: γάρ («Vì»), phủ định nhấn mạnh οὐ μή («chắc chắn sẽ không»), mốc «từ nay», và giới hạn tương lai «cho đến khi». Tuy nhiên, trật tự «Đấng đến nhân danh Chúa» chưa phản ánh tự nhiên đầy đủ cụm ὁ ἐρχόμενος ἐν ὀνόματι κυρίου trong tiếng Việt; «Đấng nhân danh Chúa mà đến» chuyển đạt rõ việc ‘đến trong/nhân danh Chúa’ mà không thêm diễn giải.'
  naturalness: «Vì tôi nói với các người rằng ... nói rằng:» lặp «rằng» và làm câu nặng. Dùng dấu hai chấm sau «các người» là tự nhiên, trang trọng và vẫn giữ lời nói trực tiếp. «Đấng nhân danh Chúa mà đến» là nhịp câu Kinh Thánh tự nhiên hơn.
  terminology: Giữ «Chúa» cho κύριος, «Phước cho» cho Εὐλογημένος, và «Đấng» cho phân từ được danh hóa. Không thêm cách giải thích về thời điểm họ sẽ thấy Đức Giê-su hoặc về căn tính của Đấng đang đến.
  issues:
  - severity: low
    issue: Cấu trúc «rằng ... nói rằng:» bị lặp.
    rationale: Tiếng Hy Lạp chỉ có một công thức λέγω ... ὅτι; tiếng Việt có thể dùng dấu hai chấm sau động từ nói để tránh lặp mà không thay đổi nghĩa.
  - severity: low
    issue: Trật tự trong «Đấng đến nhân danh Chúa» kém tự nhiên.
    rationale: Cụm «Đấng nhân danh Chúa mà đến» diễn đạt rõ và tự nhiên hơn quan hệ giữa ‘đến’ và ‘nhân danh Chúa’, đồng thời bảo toàn tính mở của ὁ ἐρχόμενος.
