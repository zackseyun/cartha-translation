id: MAT.23.39
reference: Matthew 23:39
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: λέγω γὰρ ὑμῖν, οὐ μή με ἴδητε ἀπ’ ἄρτι ἕως ἂν εἴπητε· Εὐλογημένος ὁ ἐρχόμενος ἐν ὀνόματι κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/039.yaml
  text: For I tell you[a], from now on you will certainly not see me until you say[b], ‘Blessed is he who comes in the name of the Lord.’
translation:
  language: vi
  text: 'Vì tôi nói với các người[a]: từ nay các người chắc chắn sẽ không thấy tôi cho đến khi các người nói[b]: “Phước cho Đấng nhân danh Chúa mà đến!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn dùng đại từ số nhiều; “các người” ở đây chỉ những người đang được Đức Giê-su ngỏ lời.
    reason: grammar_clarification
  - marker: b
    text: Trích dẫn hoặc gợi nhắc Thi Thiên 118:26.
    reason: cross_reference
lexical_decisions:
- source_word: λέγω γὰρ ὑμῖν
  choice: Vì tôi nói với các người rằng
  rationale: Giữ liên từ giải thích γάρ bằng “Vì” và công thức nói trực tiếp λέγω...ὑμῖν bằng cách diễn đạt rõ ràng, trang trọng. Trong ngữ cảnh quở trách các lãnh đạo và Giê-ru-sa-lem, “các người” truyền đạt số nhiều ὑμῖν và sắc thái nghiêm nghị.
- source_word: οὐ μή
  choice: chắc chắn sẽ không
  rationale: οὐ μή cùng động từ giả định aorist là lối phủ định nhấn mạnh; “chắc chắn sẽ không” giữ được sức nhấn mà không biến thành khẳng định tuyệt đối “không bao giờ”.
- source_word: ἴδητε
  choice: thấy
  rationale: Cách tương đương trực tiếp, tự nhiên của ὁράω trong ngữ cảnh này.
- source_word: ἀπ’ ἄρτι
  choice: từ nay
  rationale: Diễn đạt tự nhiên mốc thời gian bắt đầu từ hiện tại.
- source_word: ἕως ἂν εἴπητε
  choice: cho đến khi các người nói rằng
  rationale: Giữ điểm kết thúc có tính tương lai của ἕως ἄν với động từ giả định, nhưng không xác định thêm thời điểm hay biến cố.
- source_word: Εὐλογημένος
  choice: Phước cho
  rationale: Cách diễn đạt Việt ngữ trang trọng, quen thuộc trong lời chúc tụng của Thi Thiên, đồng thời truyền đạt ý được chúc phước.
- source_word: ὁ ἐρχόμενος
  choice: Đấng đến
  rationale: Danh hóa phân từ có mạo từ; “Đấng đến” tự nhiên và trang trọng, giữ khả năng vang vọng tước hiệu mà không giải thích quá mức.
- source_word: ἐν ὀνόματι κυρίου
  choice: nhân danh Chúa
  rationale: “Nhân danh” là cách diễn đạt tiếng Việt tự nhiên và chính xác cho ἐν ὀνόματι; “Chúa” giữ cách gọi κύριος và âm hưởng trích dẫn Kinh Thánh.
theological_decisions:
- issue: Ý nghĩa của việc sẽ thấy lại và lời nhìn nhận trong tương lai
  choice: Giữ nguyên tuyên bố rằng họ sẽ không thấy Đức Giê-su từ nay cho đến khi thốt lên lời chúc tụng được trích dẫn, không xác định biến cố cụ thể.
  alternative: Giải thích trực tiếp là cuộc vào thành khải hoàn, sự tái lâm, hoặc sự ăn năn trong tương lai của Y-sơ-ra-ên.
  rationale: Bản Hy Lạp không định rõ thời điểm lịch sử hay cánh chung; bản dịch cần bảo toàn sự căng thẳng và tính mở của câu.
- issue: Sắc thái của ὁ ἐρχόμενος
  choice: Đấng đến
  alternative: người đến; Đấng phải đến
  rationale: “Đấng đến” phản ánh cấu trúc danh hóa và âm hưởng Thi Thiên; không thêm chữ “phải,” vốn sẽ làm sắc thái tước hiệu rõ hơn nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “các người” để thể hiện số nhiều và giọng quở trách của ngữ cảnh; giữ “tôi” theo lời nói trực tiếp. Câu trích dẫn có nhịp điệu Kinh Thánh nhưng không dùng từ cổ.
