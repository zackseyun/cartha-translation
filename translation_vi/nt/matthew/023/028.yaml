id: MAT.23.28
reference: Matthew 23:28
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οὕτως καὶ ὑμεῖς ἔξωθεν μὲν φαίνεσθε τοῖς ἀνθρώποις δίκαιοι, ἔσωθεν δέ ⸂ἐστε μεστοὶ⸃ ὑποκρίσεως καὶ ἀνομίας.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/028.yaml
  text: In the same way[a], you also outwardly appear righteous to people, but inwardly you are full of hypocrisy and lawlessness.
translation:
  language: vi
  text: Cũng vậy, bề ngoài các ông có vẻ công chính trước mặt người ta, nhưng bên trong lại đầy sự giả hình và vô pháp.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὕτως
  choice: Cũng vậy
  rationale: Nối trực tiếp câu này với hình ảnh mồ mả quét vôi ở câu trước, giữ sắc thái so sánh và suy luận tự nhiên trong tiếng Việt.
- source_word: ἔξωθεν
  choice: bề ngoài
  rationale: Tạo thế đối lập rõ ràng, tự nhiên với ἔσωθεν, “bên trong”.
- source_word: φαίνεσθε
  choice: có vẻ
  rationale: Diễn tả ấn tượng mà người khác nhìn thấy, không khẳng định họ thực sự công chính.
- source_word: τοῖς ἀνθρώποις
  choice: trước mặt người ta
  rationale: Thể hiện nghĩa xét theo cái nhìn của con người; “người ta” mang nghĩa khái quát, không giới hạn giới tính.
- source_word: δίκαιοι
  choice: công chính
  rationale: Giữ sắc thái đạo đức và tôn giáo của từ Hy Lạp, đồng thời phù hợp với văn phong Kinh Thánh tiếng Việt hiện đại.
- source_word: ἔσωθεν
  choice: bên trong
  rationale: Đối xứng tự nhiên với “bề ngoài” và giữ sự tương phản giữa vẻ ngoài với thực trạng nội tâm.
- source_word: μεστοὶ
  choice: đầy
  rationale: Cách diễn đạt trực tiếp, tự nhiên cho trạng thái chứa đầy điều gì.
- source_word: ὑποκρίσεως
  choice: sự giả hình
  rationale: Diễn đạt sự bất nhất giữa vẻ đạo đức bên ngoài và thực trạng bên trong trong lời quở trách của Chúa Giê-su.
- source_word: ἀνομίας
  choice: vô pháp
  rationale: Giữ nghĩa coi thường hoặc vi phạm luật pháp, thay vì làm yếu đi thành sự gian ác nói chung.
theological_decisions:
- issue: δίκαιοι nói đến tình trạng công chính thật hay chỉ là vẻ công chính trong mắt người khác
  choice: chỉ là vẻ công chính trước mặt người ta
  alternative: thực sự công chính
  rationale: φαίνεσθε cùng sự tương phản với tình trạng bên trong cho thấy câu nói mô tả cách họ được người khác nhìn nhận, chứ không xác nhận họ thật sự công chính.
translation_notes:
  register: Bản dịch dùng tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. “Các ông” phù hợp với lời Chúa Giê-su trực tiếp quở trách các kinh sư và người Pha-ri-si trong ngữ cảnh; “vô pháp” giữ nét nghĩa gắn với luật nhưng có phần trang trọng, phù hợp giọng văn tố cáo mạnh của câu.
source_grounding:
  english_pob_role: consult_only
