  source_fidelity: 'Bản dịch phản ánh đúng cấu trúc đối lập của nguyên văn: vẻ ngoài/trước mắt người ta đối lập với thực trạng bên trong. “Có vẻ công chính” chuyển đạt chính xác φαίνεσθε mà không hàm ý họ thực sự công chính; “vô pháp” giữ được nét nghĩa chuyên biệt của ἀνομία là tình trạng/chủ trương trái nghịch luật pháp, thay vì chỉ nói chung là điều ác.'
  naturalness: Câu văn rõ, trang trọng và tự nhiên trong tiếng Việt hiện đại. “Cũng vậy,” liên kết thích đáng với phép so sánh ở câu trước; “bề ngoài ... nhưng bên trong” tạo tương phản mạch lạc. Cụm “đầy sự giả hình và vô pháp” có sắc thái Kinh Thánh trang trọng nhưng vẫn hiểu được trong văn cảnh.
