id: MAT.23.3
reference: Matthew 23:3
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: πάντα οὖν ὅσα ⸀ἐὰν εἴπωσιν ὑμῖν ⸂ποιήσατε καὶ τηρεῖτε⸃, κατὰ δὲ τὰ ἔργα αὐτῶν μὴ ποιεῖτε, λέγουσιν γὰρ καὶ οὐ ποιοῦσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/003.yaml
  text: Therefore[a], do and keep everything they tell you, but do not do according to their works, for they say and do not do.
translation:
  language: vi
  text: Vậy, tất cả những gì họ bảo anh em, hãy làm và tuân giữ; nhưng đừng làm theo những việc họ làm[a], vì họ nói mà không làm.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “đừng hành động như họ.”'
    reason: Cách diễn đạt tự nhiên khác của κατὰ τὰ ἔργα αὐτῶν μὴ ποιεῖτε, nhấn mạnh ý không noi theo cách hành xử của họ.
lexical_decisions:
- source_word: πάντα οὖν ὅσα ἐὰν
  choice: Vậy, tất cả những gì
  rationale: Cách dịch này giữ sắc thái suy luận của οὖν và sức bao quát của πάντα kết hợp với ὅσα ἐὰν, đồng thời tự nhiên trong tiếng Việt hiện đại.
- source_word: εἴπωσιν ὑμῖν
  choice: họ bảo anh em
  rationale: εἴπωσιν mang nghĩa nói hoặc bảo; “bảo” diễn đạt lời nói hướng đến người nghe mà không thêm sắc thái chuyên biệt như “dạy bảo”. “Anh em” là cách xưng hô số nhiều tự nhiên, trang trọng vừa phải trong văn cảnh môn đồ.
- source_word: ποιήσατε καὶ τηρεῖτε
  choice: hãy làm và tuân giữ
  rationale: “Làm” chuyển tải trực tiếp ποιέω, còn “tuân giữ” bảo tồn ý giữ gìn, thực hành theo của τηρέω cũng như sự phân biệt giữa hai động từ.
- source_word: κατὰ δὲ τὰ ἔργα αὐτῶν μὴ ποιεῖτε
  choice: nhưng đừng làm theo những việc họ làm
  rationale: “Làm theo” thể hiện κατά với nghĩa lấy điều gì làm khuôn mẫu; “những việc họ làm” diễn đạt τὰ ἔργα αὐτῶν tự nhiên và duy trì sự lặp lại có chủ ý của động từ “làm”.
- source_word: λέγουσιν γὰρ καὶ οὐ ποιοῦσιν
  choice: vì họ nói mà không làm
  rationale: Câu ngắn gọn này giữ nguyên sự đối lập sắc bén giữa lời nói và hành động, không thêm tân ngữ vốn không có trong tiếng Hy Lạp.
theological_decisions:
- issue: Có nên nói rõ nội dung họ bảo là sự dạy dỗ của các kinh sư và người Pha-ri-si từ câu trước hay không
  choice: Giữ đối tượng của lời bảo ở dạng khái quát như chính câu Hy Lạp.
  alternative: Mở rộng thành “mọi điều họ dạy anh em” hoặc “mọi điều họ bảo anh em từ tòa Môi-se”.
  rationale: Văn cảnh nhận diện những người được nói đến, nhưng câu này không lặp lại chức vụ hay phạm vi lời dạy của họ. Không thêm nội dung giúp bảo toàn cả tính cô đọng lẫn sức căng của mệnh lệnh.
- issue: Có nên thay các lần lặp của ποιέω bằng những động từ khác nhau để câu văn trôi chảy hơn hay không
  choice: Duy trì sự lặp lại của “làm”.
  alternative: Dùng các từ khác nhau như “thực hành”, “noi theo” và “hành động”.
  rationale: Sự lặp lại của ποιέω là một nét tu từ quan trọng, làm nổi bật sự tương phản giữa điều họ nói và điều họ thực hiện.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Bản dịch tránh lối xưng hô cổ như “các ngươi”, giữ nhịp mệnh lệnh ngắn gọn và sự lặp lại có chủ ý của “làm”.
