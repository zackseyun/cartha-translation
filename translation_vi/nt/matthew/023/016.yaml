id: MAT.23.16
reference: Matthew 23:16
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Οὐαὶ ὑμῖν, ὁδηγοὶ τυφλοὶ οἱ λέγοντες· Ὃς ἂν ὀμόσῃ ἐν τῷ ναῷ, οὐδέν ἐστιν, ὃς δ’ ἂν ὀμόσῃ ἐν τῷ χρυσῷ τοῦ ναοῦ ὀφείλει.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/016.yaml
  text: Woe to you[a], blind guides, who say, ‘Whoever swears by the temple, it is nothing[b]; but whoever swears by the gold of the temple is bound.’
translation:
  language: vi
  text: 'Khốn cho các ngươi, những kẻ dẫn đường mù, là những kẻ nói: ‘Ai lấy đền thờ mà thề thì lời thề ấy chẳng có giá trị[a]; nhưng ai lấy vàng của đền thờ mà thề thì bị ràng buộc.’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sát chữ: “thì chẳng là gì”, nghĩa là lời thề ấy bị xem là không có tính ràng buộc.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐαὶ ὑμῖν
  choice: Khốn cho các ngươi
  rationale: Giữ sức nặng của lời tuyên cáo phán xét mang tính ngôn sứ; cách xưng hô này trang trọng và phù hợp với lời quở trách trực tiếp.
- source_word: ὁδηγοὶ τυφλοὶ
  choice: những kẻ dẫn đường mù quáng
  rationale: Bảo tồn hình ảnh ẩn dụ về những người chỉ đường cho người khác nhưng chính mình lại mù; “dẫn đường” sát nghĩa hơn “lãnh đạo”.
- source_word: οἱ λέγοντες
  choice: Các ngươi nói
  rationale: Phân từ có mạo từ mô tả chính những “kẻ dẫn đường mù quáng”; tách thành câu trực tiếp giúp tiếng Việt tự nhiên mà không đổi đối tượng.
- source_word: Ὃς ἂν ὀμόσῃ
  choice: Ai ... mà thề
  rationale: Diễn đạt tự nhiên mệnh đề quan hệ bất định với ἄν và thể giả định, mang nghĩa khái quát “bất cứ ai thề”.
- source_word: ἐν τῷ ναῷ
  choice: lấy đền thờ mà thề
  rationale: Trong công thức tuyên thệ ở ngữ cảnh này, ἐν chỉ điều được viện dẫn làm bảo chứng, không phải địa điểm thực hiện lời thề.
- source_word: οὐδέν ἐστιν
  choice: lời thề ấy chẳng có giá trị
  rationale: Cụm Hy Lạp rất cô đọng, sát chữ là “chẳng là gì”; bản dịch nêu rõ chủ thể hàm ẩn là lời thề và ý nghĩa trong ngữ cảnh là lời thề bị coi như không có hiệu lực.
- source_word: χρυσῷ τοῦ ναοῦ
  choice: vàng của đền thờ
  rationale: Giữ nguyên quan hệ sở thuộc và sự tương phản giữa chính đền thờ với vàng thuộc về đền thờ.
- source_word: ὀφείλει
  choice: bị ràng buộc
  rationale: Động từ mang nghĩa mắc nợ hoặc có nghĩa vụ; trong ngữ cảnh lời thề, “bị ràng buộc” truyền đạt nghĩa phải thực hiện lời đã thề mà không thêm một tân ngữ không được nói rõ trong Hy Lạp.
theological_decisions:
- issue: Tính tỉnh lược trong cách nói về hiệu lực của lời thề
  choice: Làm rõ rằng “chẳng có giá trị” nói về lời thề, nhưng giữ “bị ràng buộc” không bổ sung “bởi lời thề của mình”.
  alternative: 'Dịch sát hình thức hơn: “thì chẳng là gì ... thì mắc nợ/phải có nghĩa vụ”.'
  rationale: Nguyên văn đối chiếu οὐδέν ἐστιν với ὀφείλει trong một quy tắc về lời thề. Cách dịch làm sáng nghĩa hàm ẩn cần thiết cho độc giả hiện đại nhưng không đưa thêm một cách giải thích thần học hay pháp lý vượt quá văn cảnh.
translation_notes:
  register: Văn phong hiện đại, trang trọng và mạnh mẽ. Dùng “các ngươi” trong lời quở trách để giữ sắc thái trực tiếp của số nhiều ὑμῖν; “mù quáng” tự nhiên hơn “mù” khi mô tả sự thiếu khả năng phân định về đạo đức, đồng thời vẫn giữ ẩn dụ gốc.
