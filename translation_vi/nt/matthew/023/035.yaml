id: MAT.23.35
reference: Matthew 23:35
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὅπως ἔλθῃ ἐφ’ ὑμᾶς πᾶν αἷμα δίκαιον ἐκχυννόμενον ἐπὶ τῆς γῆς ἀπὸ τοῦ αἵματος Ἅβελ τοῦ δικαίου ἕως τοῦ αἵματος Ζαχαρίου υἱοῦ Βαραχίου, ὃν ἐφονεύσατε μεταξὺ τοῦ ναοῦ καὶ τοῦ θυσιαστηρίου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/035.yaml
  text: so that upon you may come all the righteous blood being poured out on the earth[a], from the blood of righteous Abel to the blood of Zechariah son of Berechiah[b], whom you murdered between the sanctuary and the altar.
translation:
  language: vi
  text: để mọi máu của người công chính đã đổ ra trên đất[a] sẽ giáng trên các ngươi, từ máu của A-bên, người công chính, cho đến máu của Xa-cha-ri, con của Ba-ra-chi[b], người mà các ngươi đã sát hại giữa nơi thánh và bàn thờ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “trên xứ”. Từ Hy Lạp này có thể chỉ “đất” nói chung hoặc một vùng đất.
    reason: lexical_alternative
  - marker: b
    text: Danh tính của «Xa-cha-ri, con của Ba-ra-chi» còn gây tranh luận. Có người đồng nhất ông với tiên tri Xa-cha-ri; có người với Xa-cha-ri, con của Giê-hô-gia-đa (2 Sử Ký 24:20–22). Bản dịch giữ nguyên cách ghi trong bản Hy Lạp.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅπως
  choice: để
  rationale: Giữ sắc thái mục đích hoặc kết quả nối với lời tố cáo ở câu trước.
- source_word: ἔλθῃ ἐφ’ ὑμᾶς
  choice: đều đổ trên các ngươi
  rationale: Trong ngữ cảnh máu và huyết tội, cách nói này tự nhiên trong tiếng Việt và giữ ý hậu quả xét xử giáng trên họ.
- source_word: πᾶν αἷμα δίκαιον
  choice: mọi máu vô tội
  rationale: δίκαιον bổ nghĩa cho 'máu' theo phép hoán dụ, chỉ máu của những người công chính hoặc vô tội; cách diễn đạt này rõ nghĩa trong tiếng Việt.
- source_word: ἐκχυννόμενον
  choice: đã đổ ra
  rationale: Diễn đạt tự nhiên hình ảnh máu bị làm cho tuôn đổ; trong mệnh đề bao quát lịch sử từ A-bên đến Xa-cha-ri, tiếng Việt dùng dạng hoàn thành này rõ hơn dạng tiếp diễn.
- source_word: ἐπὶ τῆς γῆς
  choice: trên đất
  rationale: γῆ có thể chỉ toàn thể đất hoặc một vùng đất; 'trên đất' giữ được phần nào độ mở ấy, kèm chú thích.
- source_word: ἀπὸ τοῦ αἵματος Ἅβελ τοῦ δικαίου
  choice: từ máu của A-bên, người công chính
  rationale: Giữ cấu trúc nói về máu và danh hiệu δίκαιος của A-bên mà vẫn tự nhiên trong tiếng Việt.
- source_word: ἕως τοῦ αἵματος Ζαχαρίου υἱοῦ Βαραχίου
  choice: cho đến máu của Xa-cha-ri, con trai Ba-ra-chi
  rationale: Giữ nguyên phạm vi ἀπό...ἕως và phụ hệ đúng như bản Hy Lạp.
- source_word: ὃν ἐφονεύσατε
  choice: người mà các ngươi đã sát hại
  rationale: φονεύω mang sắc thái giết người có trách nhiệm luân lý, mạnh hơn từ 'giết' chung chung.
- source_word: μεταξὺ τοῦ ναοῦ καὶ τοῦ θυσιαστηρίου
  choice: giữa nơi thánh và bàn thờ
  rationale: ναός chỉ riêng phần thánh điện, không phải toàn bộ khuôn viên đền thờ; 'nơi thánh' truyền đạt phạm vi hẹp này.
theological_decisions:
- issue: Danh tính Xa-cha-ri, con trai Ba-ra-chi
  choice: Giữ nguyên tên và phụ hệ như bản Hy Lạp, không dung hòa.
  alternative: Đồng nhất với tiên tri Xa-cha-ri, hoặc với Xa-cha-ri con trai Giê-hô-gia-đa trong 2 Sử Ký 24:20–22.
  rationale: Bản dịch phải phản ánh chứng cứ văn bản Hy Lạp và giữ nguyên vấn đề lịch sử chưa được xác định chắc chắn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và trực tiếp. Dùng “các ngươi” để giữ giọng quở trách số nhiều trong diễn ngôn. Tên riêng được phiên âm theo lối quen thuộc trong Kinh Thánh tiếng Việt.
