  source_fidelity: Bản dịch nhìn chung bám sát cấu trúc và ý nghĩa Hy Lạp, nhưng «máu vô tội» thu hẹp/diễn giải δίκαιον («công chính») và cách lặp «đổ» trong «máu ... đã đổ ra ... đều đổ trên» không phản ánh rõ động từ ἔλθῃ («đến/giáng xuống»).
  naturalness: Câu có thể tự nhiên và trang trọng hơn bằng «mọi máu của người công chính ... sẽ giáng trên các ngươi». «Nơi thánh» là cách dịch phù hợp, dễ hiểu cho ναός trong đối lập với bàn thờ.
  terminology: Cần giữ «người công chính» cho δίκαιος, thay vì đồng nhất với «vô tội». Chú thích về γῆ cần neo [a], và chú thích về danh tính Xa-cha-ri cần neo [b]; bản nháp hiện dùng [a] hai lần và thiếu chú thích lịch sử tương ứng cho tên riêng.
