revisions:
- from: Còn các con đừng để người ta gọi mình là “Ra-bi”[a], vì các con chỉ có một vị Thầy, và tất cả các con đều là anh em[b].
  to: Nhưng anh em đừng để người ta gọi anh em là “Ra-bi”[a], vì anh em chỉ có một thầy, và tất cả anh em đều là anh em[b].
  rationale: Đổi “các con” thành “anh em” để không thêm quan hệ xưng hô ngoài nguyên văn, đồng thời dùng nhất quán một cách xưng hô tự nhiên trong tiếng Việt Kinh Thánh. Đổi “mình” thành “anh em” để chủ thể bị gọi được rõ ràng. Bỏ “vị” và viết thường “thầy” nhằm giữ διδάσκαλος ở mức danh từ thông thường, không áp đặt định danh thần học. Các chú thích được giữ với điều chỉnh chữ hoa/thường cho nhất quán.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T05:42:13Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản nháp truyền đạt đúng mệnh lệnh phủ định thụ động μὴ κληθῆτε, giữ danh xưng Ῥαββί, và phản ánh lý do: chỉ có một διδάσκαλος của người nghe; mọi người nghe là ἀδελφοί. Tuy nhiên, đại từ “các con” không có trong nguyên văn và thêm sắc thái quan hệ cha/thầy–con không được câu này nêu rõ. Viết hoa “Thầy” và thêm từ tôn xưng “vị” cũng có thể định hướng cách hiểu vượt quá cách gọi thông thường ὁ διδάσκαλος.'
  naturalness: “Anh em” là cách xưng hô Kinh Thánh hiện đại, trang trọng và phù hợp để dịch ngôi thứ hai số nhiều trong bối cảnh cộng đồng môn đồ. Dùng nhất quán “anh em” cũng làm rõ quan hệ với mệnh đề cuối. Cấu trúc “chỉ có một thầy” tự nhiên trong tiếng Việt và giữ được tính đơn nhất của εἷς.
  terminology: Giữ “Ra-bi” là thích hợp vì bảo tồn danh xưng Do Thái và không đồng nhất nó với διδάσκαλος. “Anh em” phản ánh đúng dạng giống đực số nhiều của ἀδελφοί; chú thích có thể ghi nhận khả năng chỉ chung cộng đồng môn đồ. Dùng “thầy” viết thường tránh gán định danh thần học qua quy ước viết hoa mà nguyên văn câu này không nêu.
  issues:
  - severity: medium
    issue: “Các con” thêm một quan hệ xưng hô không được biểu thị trong nguyên văn.
    rationale: Ὑμεῖς là ngôi thứ hai số nhiều, không có từ nào tương đương “con”. Trong khi bối cảnh là lời dạy môn đồ, lựa chọn này vẫn có thể làm thay đổi sắc thái quan hệ và tạo bất cân xứng với ἀδελφοί ở cuối câu.
  - severity: low
    issue: “Vị Thầy” viết hoa thêm sắc thái tôn xưng/định danh.
    rationale: Ὁ διδάσκαλος nghĩa là “thầy/giáo sư”; câu không tự xác định danh tính bằng một danh xưng riêng. “Thầy” viết thường, không kèm “vị”, sát và trung tính hơn.
  revised_text: Nhưng anh em đừng để người ta gọi anh em là “Ra-bi”[a], vì anh em chỉ có một thầy, và tất cả anh em đều là anh em[b].
