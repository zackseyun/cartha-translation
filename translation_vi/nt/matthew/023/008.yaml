id: MAT.23.8
reference: Matthew 23:8
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὑμεῖς δὲ μὴ κληθῆτε· Ῥαββί, εἷς γάρ ἐστιν ὑμῶν ὁ ⸀διδάσκαλος, πάντες δὲ ὑμεῖς ἀδελφοί ἐστε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/008.yaml
  text: But you are not to be called ‘Rabbi,’ for one is your teacher[b][a], and you are all brothers.
translation:
  language: vi
  text: Nhưng anh em đừng để người ta gọi anh em là “Ra-bi”[a], vì anh em chỉ có một thầy, và tất cả anh em đều là anh em[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ra-bi” là một danh xưng Do Thái có nghĩa là “thầy.” Giữ dạng phiên âm giúp bảo tồn bối cảnh Do Thái và phân biệt danh xưng này với từ “thầy” ở phần sau của câu.
    reason: lexical_alternative
  - marker: b
    text: Từ Hy Lạp được dịch là “anh em” có hình thức giống đực số nhiều; trong ngữ cảnh, từ này có thể chỉ chung những người đồng môn.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ κληθῆτε
  choice: đừng để người ta gọi mình
  rationale: Diễn đạt tự nhiên cấu trúc cấm đoán ở thể bị động, đồng thời giữ trọng tâm là việc các môn đồ được người khác gọi bằng danh hiệu ấy.
- source_word: Ῥαββί
  choice: Ra-bi
  rationale: Giữ danh xưng được phiên âm trong bản Hy Lạp, bảo tồn bối cảnh Do Thái và không đồng nhất nó hoàn toàn với διδάσκαλος ở phần sau câu.
- source_word: εἷς
  choice: chỉ có một
  rationale: Trong tiếng Việt, “chỉ có một” diễn đạt tự nhiên lực nhấn mạnh về tính duy nhất do cấu trúc εἷς γάρ ἐστιν truyền đạt, mà không xác định thêm vị Thầy ấy là ai.
- source_word: ὑμῶν ὁ διδάσκαλος
  choice: các con ... có một vị Thầy
  rationale: Thể hiện quan hệ sở hữu của ὑμῶν bằng cấu trúc tiếng Việt tự nhiên; “vị Thầy” giữ sắc thái kính trọng phù hợp mà không thêm một danh hiệu thần học.
- source_word: πάντες δὲ ὑμεῖς
  choice: tất cả các con đều
  rationale: Giữ lực nhấn mạnh tập thể của πάντες và ὑμεῖς trong trật tự từ tự nhiên của tiếng Việt.
- source_word: ἀδελφοί
  choice: anh em
  rationale: “Anh em” là cách gọi tập thể tự nhiên, trang trọng trong tiếng Việt, bảo tồn hình ảnh gia đình và hình thức giống đực số nhiều của nguyên văn.
theological_decisions:
- issue: Lệnh cấm danh xưng “Ra-bi” là tuyệt đối trong mọi hoàn cảnh hay nhắm đến địa vị trong cộng đồng môn đồ
  choice: Giữ nguyên lệnh cấm trực tiếp, không mở rộng hoặc thu hẹp phạm vi áp dụng bằng lời diễn giải trong chính văn.
  alternative: Diễn giải thành lệnh cấm tuyệt đối mọi danh hiệu tương tự, hoặc chỉ thành lời phê phán tham vọng giả hình.
  rationale: Câu Hy Lạp nêu lệnh cấm cùng lý do nhưng không giải quyết mọi cách áp dụng về sau; bản dịch cần bảo tồn độ căng thần học ấy.
- issue: Danh tính của “một vị Thầy”
  choice: Không thêm “Đấng Christ,” “Đức Chúa Trời,” hay một chủ thể xác định khác.
  alternative: Xác định rõ vị Thầy là Đức Chúa Jêsus hoặc Đấng Christ.
  rationale: SBLGNT tại câu này chỉ có ὁ διδάσκαλος; việc bổ sung danh tính sẽ vượt quá chứng cứ trực tiếp của nguyên văn.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “các con” để phản ánh lời Đức Chúa Jêsus trực tiếp dạy các môn đồ, nhất quán với quan hệ thầy–trò; viết hoa “Thầy” nhằm biểu thị danh xưng trong ngữ cảnh, không nhằm xác quyết thêm danh tính ngoài nguyên văn.
