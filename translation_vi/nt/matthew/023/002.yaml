review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch giữ đúng các thành phần chính của câu: phân từ λέγων được nối với câu trước bằng “nói rằng,” γραμματεῖς là “kinh sư,” và Φαρισαῖοι được phiên âm phù hợp. Tuy nhiên, ἐπί với “ghế Môi-se” nên được dịch là “trên ghế Môi-se” thay vì “vào ghế của Môi-se”; cách sau chuyển trọng tâm sang hành vi nhận/chếm một chức vị và làm mờ hình ảnh không gian trong nguyên văn. Aorist ἐκάθισαν có thể chỉ việc đã ngồi/đã đảm nhận vị trí, nên cần một chú thích bảo lưu cả cách hiểu trung tính lẫn sắc thái chiếm giữ có thể có.'
  naturalness: “Ngồi trên ghế Môi-se” tự nhiên, rõ ràng trong tiếng Việt hiện đại và vẫn giữ được ẩn dụ về vị trí giảng dạy có thẩm quyền. Đặt ký hiệu chú thích ngay sau động từ giúp người đọc nhận biết chính xác điểm có các khả năng dịch khác.
  terminology: “Kinh sư,” “Pha-ri-si,” và “Môi-se” phù hợp với văn cảnh Do Thái thế kỷ thứ nhất và với lối phiên âm Kinh Thánh tiếng Việt. Dùng “ghế Môi-se” thay cho “ghế của Môi-se” gọn, tự nhiên và không thay đổi nghĩa liên hệ/thuộc về trong cụm genitive.
  issues:
  - severity: medium
    issue: “vào ghế của Môi-se” diễn giải ἐπί và nhấn quá mức hành vi chiếm lấy vị trí.
    rationale: Nguyên văn nói theo hình ảnh “trên ghế Môi-se.” “Ngồi vào” có thể là một khả năng diễn giải của aorist, nhưng không nên thay thế hình ảnh chính trong bản văn mà không để rõ tính khả dĩ của nó.
  - severity: low
    issue: Ký hiệu chú thích hiện đặt sau “Môi-se,” dù chú thích chủ yếu bàn về động từ ἐκάθισαν.
    rationale: Đặt ký hiệu sau “đã ngồi” neo chú thích trực tiếp vào từ/cụm từ có các phương án dịch.
  - severity: low
    issue: Chú thích chưa nêu rõ khả năng sắc thái ‘tự nhận/chiếm giữ’ vị trí mà không khẳng định đó là nghĩa bắt buộc.
    rationale: Đây là điểm diễn giải được nêu trong hồ sơ tiếng Anh; nên bảo lưu như một khả năng, đồng thời tránh áp đặt nghĩa phản thân vào động từ.
