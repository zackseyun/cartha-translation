translation:
  language: vi
  text: 'nói rằng: “Các kinh sư và người Pha-ri-si đã ngồi[a] trên ghế Môi-se.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “ngồi trên ghế Môi-se” hoặc “đã ngồi vào ghế Môi-se.” Động từ Hy Lạp có thể chỉ đơn thuần việc ngồi hay đảm nhận một vị trí; trong văn cảnh, cũng có thể gợi ý việc chiếm giữ một vị trí có thẩm quyền, nhưng không nói rõ rằng họ tự bổ nhiệm mình.'
    reason: alternative_reading
lexical_decisions:
- source_word: λέγων
  choice: nói rằng
  rationale: Giữ mối liên kết phân từ hiện tại với câu trước, thay vì thêm một chủ ngữ và biến thành động từ hữu hạn.
- source_word: Ἐπὶ τῆς Μωϋσέως καθέδρας
  choice: vào ghế của Môi-se
  rationale: Trong ngữ cảnh này, hình ảnh chiếc ghế chỉ vị trí giảng dạy có thẩm quyền gắn với Môi-se; “ngồi vào ghế” tự nhiên trong tiếng Việt và vẫn giữ nguyên ẩn dụ.
- source_word: ἐκάθισαν
  choice: đã ngồi vào
  rationale: Thể aorist được diễn đạt bằng “đã”; “ngồi vào” có thể chỉ việc chiếm giữ một vị trí mà không thêm sắc thái phản thân “tự đặt mình” vốn không được nói rõ trong tiếng Hy Lạp.
- source_word: οἱ γραμματεῖς
  choice: các kinh sư
  rationale: Chỉ tầng lớp chuyên chép, nghiên cứu và giảng giải Luật; “kinh sư” là cách gọi ngắn gọn, quen thuộc và phù hợp văn cảnh Do Thái.
- source_word: οἱ Φαρισαῖοι
  choice: người Pha-ri-si
  rationale: Phiên âm tên nhóm theo cách dùng Kinh Thánh tiếng Việt thông dụng.
theological_decisions:
- issue: ἐκάθισαν mô tả trung tính việc ngồi/giữ vị trí hay hàm ý tự chiếm lấy thẩm quyền
  choice: đã ngồi vào
  alternative: ngồi; đã tự đặt mình vào
  rationale: “Đã ngồi vào” bảo lưu khả năng câu nói đề cập đến việc họ đảm nhiệm hoặc chiếm giữ vị trí có thẩm quyền, nhưng không áp đặt sắc thái tự tôn hay tự bổ nhiệm mà động từ Hy Lạp không minh nhiên nêu ra.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Ghế của Môi-se” giữ nguyên hình ảnh về vị trí giảng dạy có thẩm quyền; câu mở đầu “nói rằng” chủ ý nối với câu trước.
