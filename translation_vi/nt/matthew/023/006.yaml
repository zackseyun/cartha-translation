  yaml_path: translation/nt/matthew/023/006.yaml
  text: And they love the places of honor at banquets and the best seats in the synagogues[c][b][a],
translation:
  language: vi
  text: Họ ưa thích chỗ danh dự nhất tại các bữa tiệc[a][c] và những ghế danh dự nhất trong các hội đường[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “chỗ cao trọng nhất tại bàn ăn”. Từ Hy Lạp nói đến vị trí ngả mình dùng bữa được tôn trọng nhất trong các bữa ăn trang trọng thời cổ đại.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “những ghế cao trọng nhất”. Từ Hy Lạp nhấn mạnh các chỗ ngồi có địa vị hoặc thứ bậc cao nhất.
    reason: lexical_alternative
  - marker: c
    text: Trong thế giới Địa Trung Hải cổ đại, chỗ ngồi tại các bữa tiệc được sắp xếp theo thứ bậc danh dự thấy rõ. Vì vậy, câu này nói đến lòng ham muốn địa vị công khai, chứ không chỉ muốn ngồi thoải mái.
    reason: cultural_note
lexical_decisions:
- source_word: φιλοῦσι
  choice: ưa thích
  rationale: Động từ ở đây diễn tả sự ham chuộng mạnh mẽ, không mang nghĩa tình yêu giao ước hay thần học. “Ưa thích” tự nhiên trong tiếng Việt và giữ được sắc thái phê phán của lời Đức Giê-su.
- source_word: δὲ
  choice: không dịch thành một từ riêng
  rationale: δέ chỉ nối nhẹ câu này với phần mô tả trước. Trong tiếng Việt, sự tiếp nối đã rõ từ cấu trúc câu; thêm “và” ở đầu câu sẽ kém tự nhiên, còn “nhưng” sẽ nhấn mạnh sự tương phản quá mức.
- source_word: πρωτοκλισίαν
  choice: chỗ danh dự nhất
  rationale: Từ này chỉ vị trí ngả mình dùng bữa có địa vị cao nhất. Cách dịch truyền đạt thứ bậc danh dự trong bữa ăn cổ đại mà không buộc độc giả phải biết phong tục nằm nghiêng khi ăn.
- source_word: ἐν τοῖς δείπνοις
  choice: trong các bữa tiệc
  rationale: Trong ngữ cảnh địa vị xã hội, δεῖπνον nói đến những bữa ăn trang trọng, nơi thứ bậc được thể hiện công khai. “Bữa tiệc” tự nhiên và phù hợp hơn “bữa tối”.
- source_word: πρωτοκαθεδρίας
  choice: những ghế hàng đầu
  rationale: Từ Hy Lạp chỉ các ghế có địa vị hoặc thứ bậc cao nhất. “Ghế hàng đầu” giữ được cả hình ảnh chỗ ngồi lẫn ý nghĩa nổi bật, ưu tiên.
- source_word: ἐν ταῖς συναγωγαῖς
  choice: trong các hội đường
  rationale: Đây là cụm chỉ địa điểm. “Hội đường” là cách gọi ngắn gọn, trang trọng và dễ hiểu cho nơi cộng đồng Do Thái hội họp.
theological_decisions: []
translation_notes:
  register: Bản dịch dùng tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. “Chỗ danh dự nhất” và “ghế hàng đầu” phân biệt hai danh từ Hy Lạp, đồng thời giữ trọng tâm của câu về sự ham chuộng địa vị công khai.
