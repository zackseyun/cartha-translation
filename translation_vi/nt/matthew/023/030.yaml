  text: καὶ λέγετε· Εἰ ⸀ἤμεθα ἐν ταῖς ἡμέραις τῶν πατέρων ἡμῶν, οὐκ ἂν ⸁ἤμεθα ⸂αὐτῶν κοινωνοὶ⸃ ἐν τῷ αἵματι τῶν προφητῶν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/030.yaml
  text: and you say[a], ‘If we had been living in the days of our fathers[b], we would not have been partners with them in the blood of the prophets.’
translation:
  language: vi
  text: 'và các ông nói: “Nếu chúng tôi đã sống vào thời cha ông chúng tôi[a], chúng tôi đã không cùng họ dự phần trong việc đổ máu các nhà tiên tri[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “tổ phụ chúng tôi”; từ Hy Lạp có nghĩa đen là “các cha” và ở đây chỉ các bậc tiền nhân.
    reason: lexical_alternative
  - marker: b
    text: 'Sát nghĩa: “cùng họ dự phần trong máu của các nhà tiên tri.” Cụm từ này nói đến việc cùng tham gia hoặc cùng chịu trách nhiệm về việc đổ máu họ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγετε
  choice: các ông nói
  rationale: Động từ hiện tại, ngôi thứ hai số nhiều, là lời Đức Giê-su trực tiếp nói với những người đang bị quở trách. “Các ông” tự nhiên trong tiếng Việt hiện đại và phù hợp với đối tượng nam được nêu trong văn cảnh.
- source_word: Εἰ ἤμεθα ἐν ταῖς ἡμέραις
  choice: Nếu chúng tôi sống vào thời
  rationale: Thể chưa hoàn thành trong điều kiện trái với thực tế chỉ một tình huống giả định thuộc quá khứ. Cách nói này truyền đạt tự nhiên ý “nếu khi ấy chúng tôi sống vào thời đó”.
- source_word: τῶν πατέρων ἡμῶν
  choice: cha ông chúng tôi
  rationale: πατέρων có nghĩa đen là “các cha” và trong ngữ cảnh chỉ các bậc tiền nhân. “Cha ông” vừa giữ sắc thái nam tính của từ nguồn vừa là cách nói hiện đại, dễ hiểu.
- source_word: οὐκ ἂν ἤμεθα
  choice: hẳn chúng tôi đã không
  rationale: οὐκ ἄν đi với thể chưa hoàn thành tạo mệnh đề kết quả của điều kiện trái với thực tế. “Hẳn… đã không” biểu đạt rõ kết quả giả định trong quá khứ.
- source_word: αὐτῶν κοινωνοὶ
  choice: cùng họ dự phần
  rationale: κοινωνοί chỉ những người có phần chung, cùng tham dự hoặc liên can. “Cùng họ dự phần” giữ ý tham gia và hàm ý đồng trách nhiệm mà không tăng mức độ thành “đồng lõa” trong chính văn.
- source_word: ἐν τῷ αἵματι τῶν προφητῶν
  choice: vào việc làm đổ máu các nhà tiên tri
  rationale: Cụm Hy Lạp nói sát là “trong máu của các nhà tiên tri”; trong ngữ cảnh, “máu” chỉ việc giết họ và trách nhiệm về việc ấy. Bản dịch làm rõ thành ngữ bằng tiếng Việt nhưng vẫn giữ hình ảnh “đổ máu”.
theological_decisions:
- issue: Mức độ liên can được diễn tả bởi κοινωνοὶ ἐν τῷ αἵματι
  choice: “cùng họ dự phần vào việc làm đổ máu các nhà tiên tri”
  alternative: “đồng lõa với họ trong việc sát hại các nhà tiên tri”; hoặc sát chữ hơn, “cùng họ dự phần trong máu của các nhà tiên tri”
  rationale: Câu nói phủ nhận sự tham gia vào tội làm đổ máu các nhà tiên tri của cha ông họ. Cách dịch đã chọn giữ ý cùng tham dự và trách nhiệm đạo đức, nhưng không áp đặt sắc thái pháp lý mạnh hơn của “đồng lõa”; đồng thời “làm đổ máu” diễn đạt tự nhiên hình ảnh cụ thể của nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ liên từ mở đầu “và” để phản ánh καί và mạch nối với câu trước. Dùng “các ông” thay cho đại từ cổ “các ngươi”; lời trích dẫn dùng “chúng tôi” đúng với ngôi thứ nhất số nhiều của nguyên văn.
