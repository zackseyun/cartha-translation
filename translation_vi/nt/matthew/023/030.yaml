- from: 'và các ông nói: “Nếu chúng tôi sống vào thời cha ông chúng tôi[a], hẳn chúng tôi đã không cùng họ dự phần vào việc làm đổ máu các nhà tiên tri[b].”'
  to: 'và các ông nói: “Nếu chúng tôi đã sống vào thời cha ông chúng tôi[a], chúng tôi đã không cùng họ dự phần trong việc đổ máu các nhà tiên tri[b].”'
  rationale: Chỉnh sửa tối thiểu để biểu thị rõ tính giả định quá khứ của câu điều kiện và làm câu tiếng Việt tự nhiên hơn. Bản chính vẫn không thay thế hình ảnh “máu” bằng một diễn giải pháp lý hoặc giáo lý; chú thích nêu cách dịch sát chữ và ý nghĩa ngữ cảnh.
