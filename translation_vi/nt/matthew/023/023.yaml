revisions:
- from: '“Khốn cho các ông, những kinh sư và người Pha-ri-si giả hình! Vì các ông nộp một phần mười bạc hà, thì là và tiểu hồi, nhưng lại bỏ qua những điều hệ trọng hơn trong luật pháp: công lý, lòng thương xót và lòng thành tín.[a] Những điều này các ông phải làm, mà những điều kia cũng không được bỏ.”'
  to: '“Khốn cho các ông, những kinh sư và người Pha-ri-si giả hình! Vì các ông nộp một phần mười từ bạc hà, thì là và thì là Ai Cập, nhưng lại bỏ qua những điều hệ trọng hơn trong Luật pháp: công lý, lòng thương xót và lòng thành tín.[a] Những điều này các ông phải làm, mà những điều kia cũng không được bỏ.”'
  rationale: Sửa tên gia vị κύμινον để tránh đồng nhất nhầm với fennel và để phân biệt với ἄνηθον đã dịch là “thì là”. Giữ “lòng thành tín” ở bản văn chính vì phù hợp ngữ cảnh đạo đức, đồng thời bảo tồn tính đa nghĩa của πίστις bằng chú thích trung tính. Điều chỉnh “từ bạc hà...” làm rõ rằng đối tượng của phần mười là các loại rau gia vị.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T05:42:30Z'
review_pass:
  verdict: revise
  source_fidelity: Bản dịch giữ đúng cấu trúc lời quở trách, đối tượng được gọi tên, việc nộp một phần mười, sự đối lập với các điều quan trọng hơn của Luật pháp, và mệnh lệnh phải thực hiện cả hai. Tuy nhiên, “tiểu hồi” thường chỉ fennel/tiểu hồi hương, không phải κύμινον (cumin); cần đổi thành “thì là Ai Cập” để phân biệt với ἄνηθον (dill, “thì là”).
  naturalness: Văn phong trang trọng, hiện đại và lời xưng hô “các ông” thích hợp với ngữ cảnh quở trách. “Thì là Ai Cập” rõ nghĩa hơn trong danh sách hai loại gia vị khác nhau. Chú thích được rút gọn để không đưa vào một cách giải thích đạo đức vượt quá phạm vi từ πίστις.
  terminology: “Kinh sư,” “Pha-ri-si,” “giả hình,” “nộp một phần mười,” “công lý,” và “lòng thương xót” đều phù hợp. Dịch πίστιν là “lòng thành tín” có thể chấp nhận trong bộ ba đạo đức, với các khả năng “đức tin” và “lòng tin cậy” được giữ ở chú thích. “Thì là Ai Cập” là tên phân biệt phù hợp cho cumin.
  issues:
  - severity: medium
    issue: “Tiểu hồi” không phải là cách gọi chính xác, không mơ hồ cho κύμινον.
    rationale: Trong cách dùng tiếng Việt, “tiểu hồi/tiểu hồi hương” thường chỉ fennel, trong khi κύμινον là cumin (Cuminum cyminum), có thể gọi là “thì là Ai Cập”. Bản văn đã có ἄνηθον, tức dill (“thì là”), nên cần một tên phân biệt rõ cho cumin.
  - severity: low
    issue: Chú thích hiện có thêm diễn giải “lòng trung thành với điều mình có bổn phận phải làm.”
    rationale: Cụm này thu hẹp πίστις theo một cách diễn giải cụ thể. Chú thích nên chỉ nêu phạm vi nghĩa từ vựng đang tranh luận—đức tin, sự tin cậy, hoặc sự trung tín/thành tín.
