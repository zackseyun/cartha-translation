id: MAT.23.23
reference: Matthew 23:23
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Οὐαὶ ὑμῖν, γραμματεῖς καὶ Φαρισαῖοι ὑποκριταί, ὅτι ἀποδεκατοῦτε τὸ ἡδύοσμον καὶ τὸ ἄνηθον καὶ τὸ κύμινον, καὶ ἀφήκατε τὰ βαρύτερα τοῦ νόμου, τὴν κρίσιν καὶ ⸂τὸ ἔλεος⸃ καὶ τὴν πίστιν· ⸀ταῦτα ἔδει ποιῆσαι κἀκεῖνα μὴ ⸀ἀφιέναι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/023.yaml
  text: 'Woe to you[a], scribes and Pharisees, hypocrites! For you tithe mint and dill and cumin, and have neglected the weightier matters of the law: justice and mercy and faith. These you ought to have done, without neglecting the others.'
translation:
  language: vi
  text: '“Khốn cho các ông, những kinh sư và người Pha-ri-si giả hình! Vì các ông nộp một phần mười từ bạc hà, thì là và thì là Ai Cập, nhưng lại bỏ qua những điều hệ trọng hơn trong Luật pháp: công lý, lòng thương xót và lòng thành tín.[a] Những điều này các ông phải làm, mà những điều kia cũng không được bỏ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “đức tin” hoặc “lòng tin cậy”. Từ Hy Lạp có thể chỉ đức tin, sự tin cậy, hoặc sự trung tín/thành tín.
    reason: alternative_reading
lexical_decisions:
- source_word: Οὐαὶ
  choice: Khốn cho
  rationale: Giữ sắc thái tuyên cáo phán xét mạnh mẽ của lời quở trách mang tính ngôn sứ, tự nhiên trong văn phong Kinh Thánh tiếng Việt.
- source_word: γραμματεῖς
  choice: kinh sư
  rationale: Danh xưng gọn, quen thuộc trong bối cảnh các sách Phúc Âm và chính xác hơn cách diễn giải rộng như “thầy dạy luật”.
- source_word: ὑποκριταί
  choice: giả hình
  rationale: Diễn đạt nghĩa đạo đức ẩn dụ của từ trong ngữ cảnh này bằng cách nói tự nhiên, phổ thông.
- source_word: ἀποδεκατοῦτε
  choice: nộp một phần mười
  rationale: Nêu rõ hành động dâng hoặc nộp một phần mười, dễ hiểu hơn thuật ngữ chuyên biệt nhưng vẫn giữ sắc thái luật lệ-tôn giáo.
- source_word: ἡδύοσμον
  choice: bạc hà
  rationale: Tên gọi thông dụng của loại rau thơm được nói đến.
- source_word: ἄνηθον
  choice: thì là
  rationale: Tên gọi tiếng Việt thông dụng của loại rau gia vị này.
- source_word: κύμινον
  choice: tiểu hồi
  rationale: Tên gọi tiếng Việt chuẩn của cumin, phân biệt với đại hồi.
- source_word: ἀφήκατε
  choice: bỏ qua
  rationale: Trong ngữ cảnh, động từ chỉ việc để sang một bên hoặc không thực hành; “bỏ qua” truyền đạt rõ lời quở trách.
- source_word: τὰ βαρύτερα τοῦ νόμου
  choice: những điều hệ trọng hơn trong luật pháp
  rationale: Chuyển tải phép so sánh ẩn dụ về “sức nặng” thành cách nói tiếng Việt tự nhiên về mức độ quan trọng.
- source_word: κρίσιν
  choice: công lý
  rationale: Trong bộ ba phẩm chất đạo đức, từ này nói đến việc thực thi lẽ công chính hơn là hành động xét xử.
- source_word: ἔλεος
  choice: lòng thương xót
  rationale: Cách dịch Kinh Thánh quen thuộc, giữ được chiều kích nhân từ và đạo đức giao ước.
- source_word: πίστιν
  choice: lòng thành tín
  rationale: Trong bộ ba yêu cầu đạo đức của luật pháp, nghĩa “sự trung tín” phù hợp trực tiếp hơn “đức tin”, đồng thời không loại trừ trường nghĩa tin cậy của từ Hy Lạp.
- source_word: ταῦτα... κἀκεῖνα
  choice: những điều này... những điều kia
  rationale: 'Giữ nguyên sự đối chiếu của câu Hy Lạp: phải thực hành các điều hệ trọng mà không bỏ các việc nộp phần mười.'
theological_decisions:
- issue: Nghĩa của πίστιν trong bộ ba đạo đức
  choice: lòng thành tín
  alternative: đức tin hoặc lòng tin cậy
  rationale: Ngữ cảnh liệt kê các nghĩa vụ phải thực hành—công lý, lòng thương xót và πίστις—nên “lòng thành tín” có sức thuyết phục ngữ cảnh cao; chú thích bảo tồn phạm vi nghĩa thật sự của từ.
- issue: Quan hệ giữa các điều hệ trọng và việc nộp phần mười
  choice: “Những điều này các ông phải làm, mà những điều kia cũng không được bỏ”
  alternative: Hiểu lời này như hủy bỏ việc nộp phần mười đối với các loại rau thơm
  rationale: 'Cấu trúc Hy Lạp khẳng định cả hai: phải làm những điều hệ trọng và không bỏ những điều kia; bản dịch không giải quyết lời căng thẳng này theo một lập trường hệ phái.'
translation_notes:
  register: Văn phong hiện đại, trang trọng và trực tiếp. Dùng “các ông” để thể hiện lời quở trách hướng thẳng đến các kinh sư và người Pha-ri-si; tránh từ cổ khó hiểu. Dấu chú thích [a] được đặt ngay sau “lòng thành tín”, là từ mà chú thích giải thích.
