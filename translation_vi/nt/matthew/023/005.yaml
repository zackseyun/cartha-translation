    issue: Vế «và các tua áo[b] lớn hơn» thiếu động từ.
    rationale: Nguyên văn có động từ μεγαλύνουσι song song với πλατύνουσι. Trong tiếng Việt, cần lặp hoặc cung cấp động từ như «làm cho» để mệnh đề hoàn chỉnh và giữ quan hệ song song.
  - severity: low
    issue: Chú thích a dùng cụm «đeo theo cách họ thực hành những lời dạy» chưa tự nhiên và chưa diễn đạt trực tiếp quan hệ với mệnh lệnh Kinh Thánh.
    rationale: Có thể nói rõ, trung tính hơn rằng một số người Do Thái đeo các hộp này để thực hành các mệnh lệnh như Phục truyền luật lệ 6:8.
