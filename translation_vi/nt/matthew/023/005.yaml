- from: Nhưng mọi việc họ làm đều chỉ cốt để người ta thấy; vì họ làm cho các thẻ kinh[a] của mình rộng ra và các tua áo[b] lớn hơn.
  to: Nhưng mọi việc họ làm đều chỉ cốt để người ta thấy; vì họ làm cho các thẻ kinh[a] của mình rộng ra và làm cho các tua áo[b] lớn hơn.
  rationale: Bổ sung «làm cho» trước «các tua áo» để phản ánh động từ μεγαλύνουσι, hoàn chỉnh cú pháp tiếng Việt và duy trì thế song song với «làm cho các thẻ kinh ... rộng ra». Chú thích a được chỉnh cho tự nhiên, trực tiếp và trung tính hơn, không thay đổi nội dung hay hàm ý thần học.
  reviewer_model: gpt-5.6-terra
