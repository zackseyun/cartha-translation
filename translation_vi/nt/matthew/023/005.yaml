source:
  edition: SBLGNT
  text: πάντα δὲ τὰ ἔργα αὐτῶν ποιοῦσιν πρὸς τὸ θεαθῆναι τοῖς ἀνθρώποις· πλατύνουσι ⸀γὰρ τὰ φυλακτήρια αὐτῶν καὶ μεγαλύνουσι τὰ ⸀κράσπεδα,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/005.yaml
  text: But they do all their works to be seen by people[b][a], for they widen their phylacteries and enlarge their tassels.
translation:
  language: vi
  text: Nhưng mọi việc họ làm đều chỉ cốt để người ta thấy; vì họ làm cho các thẻ kinh[a] của mình rộng ra và làm cho các tua áo[b] lớn hơn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Thẻ kinh” là những hộp da nhỏ đựng các đoạn Kinh Thánh, được một số người Do Thái đeo để thực hành các mệnh lệnh như Phục truyền luật lệ 6:8.
    reason: cultural_note
  - marker: b
    text: Cũng có thể dịch là “các tua viền”. Xem Dân số 15:38–39 về những tua được gắn vào áo.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα δὲ τὰ ἔργα αὐτῶν ποιοῦσιν
  choice: Nhưng mọi việc họ làm
  rationale: “Nhưng” thể hiện sắc thái tương phản của δὲ trong ngữ cảnh; “mọi việc họ làm” chuyển tải tự nhiên toàn bộ cụm πάντα τὰ ἔργα αὐτῶν ποιοῦσιν.
- source_word: πρὸς τὸ θεαθῆναι τοῖς ἀνθρώποις
  choice: đều chỉ cốt để người ta thấy
  rationale: “Chỉ cốt để” diễn đạt rõ mục đích của cấu trúc πρὸς τό với động từ nguyên mẫu; “người ta” chỉ con người nói chung, không giới hạn giới tính.
- source_word: πλατύνουσι γὰρ τὰ φυλακτήρια αὐτῶν
  choice: vì họ làm cho các thẻ kinh của mình rộng ra
  rationale: “Vì” giữ chức năng giải thích của γὰρ. “Thẻ kinh” là cách gọi ngắn gọn, tương đối quen thuộc cho các hộp da nhỏ đựng những đoạn Kinh Thánh; “rộng ra” phản ánh trực tiếp πλατύνουσι.
- source_word: καὶ μεγαλύνουσι τὰ κράσπεδα
  choice: và các tua áo lớn hơn
  rationale: Trong bối cảnh Do Thái, κράσπεδα là các tua gắn ở áo theo luật Torah. “Lớn hơn” giữ nghĩa khái quát của μεγαλύνουσι mà không thu hẹp thành riêng việc kéo dài.
theological_decisions:
- issue: Diễn đạt các vật dụng tôn giáo Do Thái mà không hàm ý bản thân chúng đáng bị lên án
  choice: Dùng “thẻ kinh” và “tua áo”, kèm chú thích giải thích tập tục.
  alternative: Diễn giải thành “hộp cầu nguyện” và “diềm áo”.
  rationale: Lời phê phán trong câu nhắm vào động cơ phô trương và việc cố ý làm vật dụng nổi bật hơn, chứ không phủ nhận chính các tập tục gắn với Phục truyền luật lệ 6:8 và Dân số 15:38–39.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Cấu trúc đối lập và giải thích của nguyên văn được giữ bằng “Nhưng” và “vì”; cách nói “chỉ cốt để người ta thấy” làm rõ động cơ phô trương mà không thêm lời kết án vượt quá câu Hy Lạp.
