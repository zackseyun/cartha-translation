review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch chuyển tải đúng lời tuyên cáo «Οὐαί», nhóm người được gọi đích danh, quan hệ nguyên nhân do ὅτι, và hai hành động ở thì hiện tại: xây các τάφους của các nhà tiên tri và tô điểm các μνημεῖα của người công chính. Tuy nhiên, cụm «những kinh sư và người Pha-ri-si giả hình» có thể khiến «giả hình» bị hiểu là chỉ bổ nghĩa cho người Pha-ri-si, trong khi ὑποκριταί là lời gọi áp dụng cho cả hai nhóm.'
  naturalness: «Khốn cho các ngươi» và «vì» phù hợp với giọng quở trách trang trọng, hiện đại. Đặt «những kẻ giả hình» sau tên cả hai nhóm, có dấu phẩy tách rõ, tự nhiên hơn và làm rõ phạm vi của lời gọi.
  terminology: «Kinh sư», «Pha-ri-si», «nhà tiên tri», và «những người công chính» đều phù hợp. Giữ «mộ» / «lăng mộ» để phản ánh hai danh từ khác nhau trong tiếng Hy Lạp; chú thích bảo lưu việc μνημεῖα cũng có thể chỉ mộ hoặc công trình tưởng niệm.
  issues:
  - severity: medium
    issue: Phạm vi của «giả hình» chưa rõ
    rationale: Trong câu hiện tại, «người Pha-ri-si giả hình» dễ được đọc như một cụm danh từ mà «giả hình» chỉ quy về người Pha-ri-si. Nguyên văn gọi chung «các kinh sư và người Pha-ri-si» là «những kẻ giả hình».
  revised_text: Khốn cho các ngươi, các kinh sư và người Pha-ri-si, những kẻ giả hình, vì các ngươi xây mộ cho các nhà tiên tri và tô điểm lăng mộ[a] của những người công chính.
