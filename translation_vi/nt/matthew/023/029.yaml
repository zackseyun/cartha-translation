- from: Khốn cho các ngươi, những kinh sư và người Pha-ri-si giả hình, vì các ngươi xây mộ cho các nhà tiên tri và tô điểm lăng mộ[a] của những người công chính.
  to: Khốn cho các ngươi, các kinh sư và người Pha-ri-si, những kẻ giả hình, vì các ngươi xây mộ cho các nhà tiên tri và tô điểm lăng mộ[a] của những người công chính.
  rationale: Chỉ điều chỉnh vị trí và cách ngắt cụm «những kẻ giả hình» để nó rõ ràng là lời gọi dành cho cả các kinh sư lẫn người Pha-ri-si, đúng với cấu trúc đồng vị của nguyên văn. Các lựa chọn từ vựng còn lại được giữ nguyên.
