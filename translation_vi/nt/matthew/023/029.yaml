id: MAT.23.29
reference: Matthew 23:29
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Οὐαὶ ὑμῖν, γραμματεῖς καὶ Φαρισαῖοι ὑποκριταί, ὅτι οἰκοδομεῖτε τοὺς τάφους τῶν προφητῶν καὶ κοσμεῖτε τὰ μνημεῖα τῶν δικαίων,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/029.yaml
  text: Woe to you[a], scribes and Pharisees, hypocrites, because you build the tombs of the prophets and decorate the monuments of the righteous[b],
translation:
  language: vi
  text: Khốn cho các ngươi, các kinh sư và người Pha-ri-si, những kẻ giả hình, vì các ngươi xây mộ cho các nhà tiên tri và tô điểm lăng mộ[a] của những người công chính.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hy Lạp có thể chỉ mộ hoặc công trình tưởng niệm.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐαί
  choice: Khốn cho
  rationale: Giữ sức nặng của lời tuyên cáo mang tính tiên tri về sự đoán phạt; tự nhiên và trang trọng hơn một tiếng than nhẹ như “Ôi” trong ngữ cảnh này.
- source_word: γραμματεῖς
  choice: kinh sư
  rationale: Danh xưng quen thuộc trong tiếng Việt dành cho những chuyên gia Do Thái về Kinh Luật, đồng thời bám sát thuật ngữ Hy Lạp hơn cách diễn giải “thầy dạy luật”.
- source_word: Φαρισαῖοι
  choice: người Pha-ri-si
  rationale: Phiên âm tên của nhóm tôn giáo theo cách dùng quen thuộc trong tiếng Việt.
- source_word: ὑποκριταί
  choice: giả hình
  rationale: Diễn đạt tự nhiên sự giả dối về đạo đức và tôn giáo mà lời quở trách nhắm đến.
- source_word: ὅτι
  choice: vì
  rationale: 'Thể hiện rõ quan hệ nguyên nhân: hành động tiếp theo là lý do cho lời tuyên cáo “Khốn cho”.'
- source_word: οἰκοδομεῖτε
  choice: xây
  rationale: Giữ nghĩa trực tiếp của động từ mà không thêm ý “xây lại”, vốn không được chính động từ đòi hỏi.
- source_word: τάφους
  choice: mộ
  rationale: Phù hợp với nơi chôn cất được xây dựng và tự nhiên trong tiếng Việt.
- source_word: προφητῶν
  choice: các nhà tiên tri
  rationale: Diễn đạt trực tiếp sở thuộc cách và dùng danh xưng phổ thông trong tiếng Việt.
- source_word: κοσμεῖτε
  choice: tô điểm
  rationale: Chuyển tải ý làm đẹp hoặc trang hoàng, với sắc thái trang trọng vừa phải.
- source_word: μνημεῖα
  choice: lăng mộ
  rationale: Giữ liên hệ với công trình chôn cất trong ngữ cảnh, đồng thời phân biệt phần nào với τάφους (“mộ”); chú thích bảo lưu khả năng từ này chỉ mộ hoặc công trình tưởng niệm.
- source_word: δικαίων
  choice: những người công chính
  rationale: Làm rõ tính từ được dùng như danh từ để chỉ những người sống ngay thẳng trước mặt Đức Chúa Trời, không áp đặt một hệ thống giáo lý về sự xưng công chính.
theological_decisions:
- issue: Ý nghĩa của δικαίων trong lời nói về các nhân vật trung tín thời trước
  choice: những người công chính
  alternative: những người ngay chính
  rationale: “Công chính” bảo tồn thuật ngữ đạo đức-thần học của nguyên văn và phù hợp với văn phong Kinh Thánh tiếng Việt, nhưng không xác định thêm họ được công chính theo nghĩa giáo lý nào.
translation_notes:
  register: Văn phong hiện đại, trang trọng và trực tiếp. Giữ cấu trúc một câu để nối lời tuyên cáo “Khốn cho” với lý do được dẫn bằng “vì”; cách xưng “các ngươi” bảo tồn giọng quở trách mạnh trong lời nói trực tiếp.
