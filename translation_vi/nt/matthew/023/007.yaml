  text: καὶ τοὺς ἀσπασμοὺς ἐν ταῖς ἀγοραῖς καὶ καλεῖσθαι ὑπὸ τῶν ἀνθρώπων· ⸀Ῥαββί.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/007.yaml
  text: and greetings in the marketplaces, and to be called by men, ‘Rabbi.’
translation:
  language: vi
  text: và những lời chào hỏi nơi phố chợ, cùng việc được người ta gọi là “Ra-bi”[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ra-bi: một danh xưng kính trọng, nghĩa là “thầy của tôi”.'
    reason: Giải thích danh hiệu Semit được phiên âm trong chính văn mà không thu hẹp phạm vi danh xưng vượt quá điều nguồn văn nêu.
lexical_decisions:
- source_word: ἀσπασμούς
  choice: những lời chào hỏi
  rationale: Giữ ý số nhiều của danh từ Hy Lạp và sắc thái những lời chào mang tính kính trọng, công khai trong bối cảnh.
- source_word: ἀγοραῖς
  choice: phố chợ
  rationale: ἀγορά chỉ nơi họp chợ và không gian công cộng trung tâm; “phố chợ” tự nhiên, ngắn gọn và rộng hơn một khu chợ chỉ dành cho mua bán.
- source_word: ὑπὸ τῶν ἀνθρώπων
  choice: được người ta
  rationale: Trong ngữ cảnh này, ἄνθρωποι chỉ con người nói chung chứ không riêng nam giới; “người ta” diễn đạt tự nhiên tác nhân của thể bị động.
- source_word: Ῥαββί
  choice: Ra-bi
  rationale: Phiên âm danh xưng Semit thay vì thay trực tiếp bằng “thầy”, nhờ đó bảo tồn màu sắc lịch sử và sự nhấn mạnh vào danh hiệu.
theological_decisions:
- issue: Phạm vi giới tính của ἀνθρώπων
  choice: người ta
  alternative: những người đàn ông
  rationale: Danh từ số nhiều ở đây được dùng theo nghĩa khái quát là người đời/công chúng; dịch riêng là nam giới sẽ thu hẹp nghĩa mà ngữ cảnh không đòi hỏi.
- issue: Cách thể hiện danh hiệu Ῥαββί
  choice: Giữ danh hiệu “Ra-bi” và giải thích bằng chú thích
  alternative: Dịch ngay là “Thầy”
  rationale: Giữ nguyên danh hiệu giúp bảo tồn bối cảnh Do Thái và mối liên kết với lập luận tiếp theo, trong khi chú thích giúp độc giả hiện đại hiểu nghĩa.
translation_notes:
  register: Câu này tiếp nối cấu trúc ngữ pháp của câu trước nên được giữ như một vế nối bằng “và”. Văn phong hiện đại, trang trọng; “cùng việc” làm rõ sự song song giữa hai điều được ưa chuộng mà không bổ sung một động từ mới vào câu.
