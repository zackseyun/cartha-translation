  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὁ δὲ μείζων ὑμῶν ἔσται ὑμῶν διάκονος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/011.yaml
  text: But the greatest among you will be your servant[a].
translation:
  language: vi
  text: Nhưng người lớn nhất trong anh em sẽ là người phục vụ anh em.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc dịch sát hơn: “Người lớn hơn trong anh em sẽ là người phục vụ anh em.” Dạng so sánh hơn trong tiếng Hy Lạp có thể được dùng theo lối nói chỉ người có địa vị cao nhất trong nhóm.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μείζων
  choice: người lớn nhất
  rationale: Dạng so sánh hơn của μέγας ở đây có thể được dùng theo nghĩa gần như cao nhất trong nhóm; cách dịch này tự nhiên trong tiếng Việt và phù hợp với ngữ cảnh nói về địa vị.
- source_word: ὑμῶν (thứ nhất)
  choice: trong anh em
  rationale: Sở hữu cách mang nghĩa phân xuất, chỉ một người thuộc nhóm những người đang được nói với.
- source_word: ἔσται
  choice: sẽ là
  rationale: Diễn đạt trực tiếp thì tương lai của εἰμί bằng tiếng Việt hiện đại.
- source_word: ὑμῶν (thứ hai)
  choice: anh em
  rationale: Diễn tả quan hệ của διάκονος với cộng đồng được nói đến; trong tiếng Việt, 'người phục vụ anh em' tự nhiên hơn lối dịch sát cứng nhắc.
- source_word: διάκονος
  choice: người phục vụ
  rationale: Trong ngữ cảnh này, từ này chỉ người phục vụ người khác, không phải chức vụ chính thức trong hội thánh; tránh các từ mang sắc thái giáo phẩm như 'chấp sự'.
- source_word: δὲ
  choice: Nhưng
  rationale: Nêu bật sự tương phản với việc theo đuổi địa vị và danh xưng trong phần trước.
theological_decisions:
- issue: Ngôn ngữ về địa vị trong lời dạy của Chúa Giê-su về sự lớn lao và phục vụ
  choice: 'Dịch như một sự đảo ngược địa vị: ''người lớn nhất trong anh em sẽ là người phục vụ anh em.'''
  alternative: người lớn hơn trong anh em sẽ là đầy tớ của anh em
  rationale: Giữ nguyên nghịch lý rằng sự lớn lao đích thực được thể hiện qua việc phục vụ, đồng thời không đưa vào khái niệm chức vụ giáo hội về sau.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng 'anh em' để phù hợp lời nói trực tiếp với một cộng đồng môn đồ; dùng 'người phục vụ' thay vì thuật ngữ chức vụ giáo hội.
