  source_fidelity: 'Bản dịch phản ánh đúng cấu trúc và ý nghĩa của câu Hy Lạp: δέ được thể hiện bằng “Nhưng”; μείζων được hiểu theo cách dùng so sánh mang giá trị gần như so sánh bậc nhất trong ngữ cảnh địa vị; hai lần ὑμῶν lần lượt được diễn đạt tự nhiên là “trong anh em” và “anh em”; thì tương lai ἔσται là “sẽ là”; và διάκονος được dịch phi-chức-vụ là “người phục vụ.”'
  naturalness: “Nhưng người lớn nhất trong anh em sẽ là người phục vụ anh em” là tiếng Việt tiêu chuẩn, rõ ràng và giữ được sắc thái trang trọng, dễ hiểu của lời dạy. Cách lặp “anh em” tự nhiên trong văn cảnh diễn từ hướng đến cộng đồng môn đồ.
  terminology: “Người phục vụ” truyền đạt đúng διάκονος trong ngữ cảnh phục vụ, không gợi một chức danh hội thánh về sau. “Người lớn nhất” phù hợp với ý địa vị trong ngữ cảnh; chú thích cung cấp cách dịch sát hơn của dạng so sánh và giải thích hợp lý, không áp đặt diễn giải giáo phái.
