- from: Vậy, ai thề bởi bàn thờ thì cũng thề bởi bàn thờ ấy và bởi mọi thứ ở trên đó.[a]
  to: Vậy, ai thề bởi bàn thờ thì thề bởi bàn thờ ấy và bởi mọi thứ ở trên bàn thờ ấy.[a]
  rationale: Bản sửa chỉ loại bỏ sắc thái bổ sung không được đánh dấu riêng trong tiếng Hy Lạp và làm rõ đại từ chỉ bàn thờ. Cách dịch vẫn giữ «mọi thứ» theo nghĩa khái quát, phù hợp với nguyên văn và không đồng nhất cụm này với riêng lễ vật.
