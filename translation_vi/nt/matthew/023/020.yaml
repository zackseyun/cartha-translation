  text: ὁ οὖν ὀμόσας ἐν τῷ θυσιαστηρίῳ ὀμνύει ἐν αὐτῷ καὶ ἐν πᾶσι τοῖς ἐπάνω αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/020.yaml
  text: Therefore[a], the one who swears by the altar swears by it and by everything on it.
translation:
  language: vi
  text: Vậy, ai thề bởi bàn thờ thì thề bởi bàn thờ ấy và bởi mọi thứ ở trên bàn thờ ấy.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “và bởi tất cả những gì ở trên bàn thờ ấy.” Cụm từ Hy Lạp rộng hơn một “lễ vật” riêng lẻ và có thể bao gồm mọi thứ được đặt trên bàn thờ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ οὖν ὀμόσας
  choice: Vậy, ai thề
  rationale: Phân từ có mạo từ được hiểu theo nghĩa khái quát là “ai thề”; οὖν được dịch là “vậy” để nối kết suy luận với lập luận ngay trước đó.
- source_word: ἐν τῷ θυσιαστηρίῳ
  choice: bởi bàn thờ
  rationale: Trong công thức thề, ἐν đi với ὀμνύω mang nghĩa phương tiện hoặc đối tượng viện dẫn, nên “bởi” tự nhiên và chính xác hơn cách dịch theo nghĩa không gian.
- source_word: ὀμνύει
  choice: thì cũng thề
  rationale: Thì hiện tại diễn đạt một nguyên tắc chung; “cũng” làm rõ sự bao hàm được nêu trong mệnh đề kết luận mà không thêm nội dung thần học.
- source_word: ἐν αὐτῷ
  choice: bởi bàn thờ ấy
  rationale: Đại từ αὐτῷ chỉ lại bàn thờ. Lặp danh từ giúp tiếng Việt rõ nghĩa hơn đại từ “nó” trong văn phong trang trọng.
- source_word: καὶ ἐν πᾶσι τοῖς ἐπάνω αὐτοῦ
  choice: và bởi mọi thứ ở trên đó
  rationale: Cụm từ chỉ chung mọi vật ở trên bàn thờ, rộng hơn một lễ vật riêng lẻ; “ở trên đó” giữ được phạm vi khái quát và sắc thái vị trí của nguyên văn.
theological_decisions:
- issue: Đối tượng của cụm “mọi thứ ở trên đó”
  choice: Giữ cách nói khái quát, chỉ mọi thứ ở trên bàn thờ.
  alternative: mọi lễ vật trên đó; mọi thứ ở phía trên nó
  rationale: Ngữ cảnh trước đó nói đến lễ vật, nhưng nguyên văn ở câu này dùng một cụm rộng hơn. Bản dịch không thu hẹp đối tượng thành riêng các lễ vật và cũng không giải quyết quá mức tính khái quát của câu.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “bàn thờ” theo thuật ngữ Kinh Thánh quen thuộc; lặp lại “bàn thờ ấy” để tránh đại từ mơ hồ. Dấu chú thích [a] được đặt ngay sau cụm từ mà chú thích giải thích.
