    rationale: Trong tiếng Việt hiện đại, “tự tôn” thường chỉ lòng tự trọng hoặc tự tôn dân tộc. Trong câu này, ὑψώσει ἑαυτόν chỉ việc tự đề cao mình. Thay bằng “tự đề cao mình” loại bỏ sự mơ hồ mà vẫn giữ nghĩa nguồn.
  - severity: low
