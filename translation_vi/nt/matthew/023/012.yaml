  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὅστις δὲ ὑψώσει ἑαυτὸν ταπεινωθήσεται, καὶ ὅστις ταπεινώσει ἑαυτὸν ⸀ὑψωθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/012.yaml
  text: But whoever exalts himself will be humbled[b][a], and whoever humbles himself will be exalted.
translation:
  language: vi
  text: Nhưng ai tự đề cao mình sẽ bị hạ xuống[a], còn ai tự hạ mình sẽ được đề cao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “sẽ bị hạ thấp”; và ở cuối câu: “sẽ được nâng lên.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅστις
  choice: ai
  rationale: Đại từ quan hệ bất định nêu một nguyên tắc áp dụng chung; “ai” tự nhiên và bao quát trong tiếng Việt.
- source_word: δὲ
  choice: Nhưng
  rationale: Diễn tả sắc thái tương phản nhẹ với lời dạy ngay trước đó.
- source_word: ὑψώσει ἑαυτόν
  choice: tự tôn mình lên
  rationale: Giữ ý chủ động tự đề cao bản thân và đồng thời duy trì hình ảnh cao–thấp của động từ Hy Lạp.
- source_word: ταπεινωθήσεται
  choice: sẽ bị hạ xuống
  rationale: Giữ thì tương lai và thể bị động, không nêu rõ tác nhân; cách diễn đạt cũng bảo tồn hình ảnh đảo ngược địa vị.
- source_word: καὶ
  choice: còn
  rationale: Trong hai vế đối xứng, “còn” diễn đạt tự nhiên sự nối kết đồng thời tương phản trong tiếng Việt.
- source_word: ταπεινώσει ἑαυτόν
  choice: tự hạ mình xuống
  rationale: Diễn đạt rõ hành động tự nguyện hạ mình và giữ sự đối xứng với “tự tôn mình lên”.
- source_word: ὑψωθήσεται
  choice: sẽ được tôn lên
  rationale: Giữ thì tương lai, thể bị động và sự lặp lại từ vựng với động từ ở vế đầu.
theological_decisions:
- issue: Tác nhân của hai động từ bị động
  choice: Giữ thể bị động, không nói rõ ai là người hạ xuống hoặc tôn lên
  alternative: 'Nêu Đức Chúa Trời làm chủ thể: “Đức Chúa Trời sẽ hạ người ấy xuống… sẽ tôn người ấy lên”'
  rationale: Bản Hy Lạp không nêu tác nhân. Cách dịch này giữ nguyên sự hàm ẩn có thể chỉ hành động của Đức Chúa Trời mà không biến điều hàm ẩn thành điều được nói rõ.
- issue: Phạm vi khái quát của đại từ giống đực số ít
  choice: Dùng “ai” và “mình” để chỉ bất cứ người nào
  alternative: Dùng một danh từ giống đực như “người đàn ông nào”
  rationale: Trong câu Hy Lạp, hình thức giống đực số ít có chức năng đại diện và nêu nguyên tắc chung. Tiếng Việt không đánh dấu giống ở “ai” hay “mình”, nên cách dịch tự nhiên này truyền đạt đúng phạm vi mà không thu hẹp đối tượng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Hai vế được giữ cân xứng bằng các cặp “tự tôn mình lên/bị hạ xuống” và “tự hạ mình xuống/được tôn lên”; “bị/được” duy trì thể bị động mà không xác định tác nhân.
