- from: Nhưng ai tự tôn mình lên sẽ bị hạ xuống[a], còn ai tự hạ mình xuống sẽ được tôn lên.
  to: Nhưng ai tự đề cao mình sẽ bị hạ xuống[a], còn ai tự hạ mình sẽ được đề cao.
  rationale: 'Bản sửa thay cách nói có thể mơ hồ “tự tôn mình lên” bằng “tự đề cao mình”, là cách diễn đạt hiện đại, tự nhiên và chính xác hơn cho hành vi tự nâng địa vị mình. Cặp đối xứng vẫn giữ nguyên: tự đề cao/tự hạ mình và bị hạ xuống/được đề cao. Các động từ bị động tương lai vẫn không xác định tác nhân, đúng với bản Hy Lạp.'
  reviewer_model: gpt-5.6-terra
