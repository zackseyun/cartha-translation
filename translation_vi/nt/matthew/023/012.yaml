    rationale: “Bị làm cho thấp xuống” không tự nhiên. “Bị hạ thấp” và “được nâng lên” là những phương án tiếng Việt rõ ràng, đồng thời phản ánh trường nghĩa cao/thấp của nguyên ngữ.
  revised_text: Nhưng ai tự đề cao mình sẽ bị hạ xuống[a], còn ai tự hạ mình sẽ được đề cao.
