review_pass:
  verdict: revise
  source_fidelity: Bản nháp truyền đạt đúng nguyên tắc khái quát, thì tương lai và hai động từ bị động không nêu tác nhân. Tuy nhiên, cụm “tự tôn mình lên” có thể gợi nghĩa “tự trọng” trong tiếng Việt hiện đại, thay vì hành vi tự đề cao; cần thay bằng cách nói rõ hơn.
  naturalness: “Tự tôn mình lên” và, ở mức nhẹ hơn, “tự hạ mình xuống” hơi nặng và không phải cặp diễn đạt tự nhiên nhất trong văn xuôi tiếng Việt hiện đại. “Tự đề cao mình / tự hạ mình” là cặp cân xứng, rõ nghĩa và phù hợp ngữ cảnh lời dạy.
  terminology: “Đề cao” diễn đạt tự nhiên ý ὑψόω trong hành vi tự tôn cao địa vị mình; “hạ mình” diễn đạt ταπεινόω. “Sẽ bị hạ xuống / sẽ được đề cao” giữ thể bị động và không thêm tác nhân. Không cần chú thích về giống ngữ pháp vì tiếng Việt không đánh dấu giống ở “ai” và “mình”.
  issues:
  - severity: medium
