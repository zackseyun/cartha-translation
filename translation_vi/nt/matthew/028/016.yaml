  yaml_path: translation/nt/matthew/028/016.yaml
  text: The eleven disciples went to Galilee[a], to the mountain where Jesus had directed them,
translation:
  language: vi
  text: Mười một môn đồ đi đến Ga-li-lê, tới ngọn núi mà Giê-su đã chỉ định cho họ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “ngọn núi mà Giê-su đã dặn họ đến.” Động từ Hy Lạp có thể mang nghĩa “chỉ định”, “sắp đặt” hoặc “truyền bảo”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: không dịch thành một từ riêng
  rationale: δέ là liên từ nhẹ đánh dấu bước chuyển trong trình thuật. Tiếng Việt không cần thêm “bấy giờ” hay “nhưng” ở đây, vì những từ ấy sẽ nhấn mạnh sắc thái thời gian hoặc tương phản hơn nguyên văn.
- source_word: ἕνδεκα μαθηταὶ
  choice: mười một môn đồ
  rationale: Giữ con số xác định sau khi Giu-đa không còn thuộc nhóm Mười Hai; “môn đồ” là cách gọi quen thuộc đối với những người học theo Giê-su.
- source_word: ἐπορεύθησαν
  choice: đi đến
  rationale: Diễn đạt tự nhiên hành động đi tới một địa điểm; không nâng văn phong quá mức như “lên đường hành trình”.
- source_word: εἰς τὴν Γαλιλαίαν
  choice: đến Ga-li-lê
  rationale: εἰς chỉ hướng chuyển động tới một vùng; “đến” phù hợp với cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: εἰς τὸ ὄρος
  choice: đến ngọn núi
  rationale: ὄρος có thể chỉ núi hoặc vùng đồi, nhưng ở đây có mạo từ và mệnh đề xác định theo sau, nên “ngọn núi” giữ được tính cụ thể của địa điểm.
- source_word: οὗ
  choice: mà
  rationale: Đại từ quan hệ được diễn đạt tự nhiên trong cấu trúc tiếng Việt “ngọn núi mà…”, với địa điểm làm đối tượng đã được Giê-su chỉ định.
- source_word: ἐτάξατο
  choice: đã chỉ định
  rationale: τάσσω ở thể trung có thể mang nghĩa chỉ định, sắp đặt hoặc truyền bảo. “Đã chỉ định” giữ được ý Giê-su đã xác định địa điểm từ trước mà không biến câu thành một mệnh lệnh mạnh hơn nguyên văn.
- source_word: αὐτοῖς
  choice: cho họ
  rationale: Giữ rõ đối tượng tiếp nhận sự chỉ định trong cấu trúc tiếng Việt.
- source_word: ὁ Ἰησοῦς
  choice: Giê-su
  rationale: Phiên âm tên riêng theo cách dùng tiếng Việt, không thêm tước hiệu vốn không có trong cụm từ Hy Lạp này.
theological_decisions:
- issue: Mức độ thẩm quyền hàm chứa trong việc Giê-su xác định nơi gặp
  choice: đã chỉ định cho họ
  alternative: đã truyền cho họ đến; đã dặn họ đến
  rationale: Cách dịch chính cho biết Giê-su đã xác định địa điểm từ trước nhưng không áp đặt sắc thái mệnh lệnh hay cơ cấu bổ nhiệm mà ngữ cảnh không đòi hỏi.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “môn đồ” vì đây là thuật ngữ Kinh Thánh quen thuộc; phiên âm tên riêng là “Giê-su”. Dấu chú thích được đặt ngay sau cụm từ có phương án dịch khác.
