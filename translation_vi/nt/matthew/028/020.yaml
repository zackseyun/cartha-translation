  to: dạy họ tuân giữ mọi điều Ta đã truyền cho anh em. Và này, Ta ở cùng anh em mọi ngày, cho đến khi thời đại hoàn tất[a].
  rationale: Thay “các con” bằng “anh em” để không thêm quan hệ không được đánh dấu trong tiếng Hy Lạp. Đổi cụm kết câu thành “cho đến khi thời đại hoàn tất” để diễn đạt tự nhiên và sát hơn sắc thái của συντέλεια, vẫn giữ αἰών là “thời đại”. Chú thích được chỉnh để đối chiếu rõ phương án “tận cùng thời đại” với cách dịch truyền thống “tận thế”.
