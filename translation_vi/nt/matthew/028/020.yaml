id: MAT.28.20
reference: Matthew 28:20
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: διδάσκοντες αὐτοὺς τηρεῖν πάντα ὅσα ἐνετειλάμην ὑμῖν· καὶ ἰδοὺ ἐγὼ μεθ’ ὑμῶν εἰμι πάσας τὰς ἡμέρας ἕως τῆς συντελείας τοῦ ⸀αἰῶνος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/020.yaml
  text: teaching them to keep all that I commanded you. And behold[a], I am with you all the days, until the end of the age.
translation:
  language: vi
  text: dạy họ tuân giữ mọi điều Ta đã truyền cho anh em. Và này, Ta ở cùng anh em mọi ngày, cho đến khi thời đại hoàn tất[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “cho đến tận cùng thời đại.” Theo cách dịch truyền thống: “cho đến tận thế.” Từ Hy Lạp αἰών nói về một thời đại, không trực tiếp chỉ thế giới vật chất.'
    reason: Làm rõ sắc thái của συντέλεια và αἰών, đồng thời ghi nhận cách dịch truyền thống có thể gây hiểu lầm.
lexical_decisions:
- source_word: διδάσκοντες
  choice: dạy
  rationale: Phân từ hiện tại diễn tả cách thức liên tục để thực hiện việc khiến người ta trở thành môn đồ ở câu trước; “dạy” trực tiếp và tự nhiên.
- source_word: τηρεῖν
  choice: tuân giữ
  rationale: Kết hợp ý vâng theo với ý gìn giữ, thực hành cẩn trọng các mệnh lệnh, không thu hẹp nghĩa vào sự tuân thủ bề ngoài.
- source_word: πάντα ὅσα
  choice: mọi điều
  rationale: Diễn đạt tự nhiên tính bao quát của thành ngữ Hy Lạp mà không rườm rà.
- source_word: ἐνετειλάμην
  choice: Ta đã truyền
  rationale: Giữ sức nặng thẩm quyền của động từ ἐντέλλομαι; “truyền” trang trọng nhưng vẫn quen thuộc trong tiếng Việt hiện đại.
- source_word: ἰδοὺ
  choice: này
  rationale: Giữ chức năng kêu gọi chú ý và sắc thái long trọng của tiểu từ, tự nhiên hơn “hãy xem” trong ngữ cảnh này.
- source_word: μεθ’ ὑμῶν εἰμι
  choice: Ta ở cùng các con
  rationale: Diễn đạt trực tiếp sự hiện diện với các môn đồ; đại từ duy trì giọng trang trọng và quan hệ của Chúa Giê-su với những người Ngài dạy dỗ.
- source_word: πάσας τὰς ἡμέρας
  choice: mỗi ngày
  rationale: Truyền đạt tự nhiên ý từng ngày liên tục của nghĩa đen “tất cả các ngày”, thay vì làm phẳng hoàn toàn thành “luôn luôn”.
- source_word: συντελείας
  choice: tận cùng
  rationale: Chỉ điểm hoàn tất hay chung cuộc của một thời kỳ; cách nói này tự nhiên, trang trọng và không nhất thiết hàm ý sự hủy diệt.
- source_word: αἰῶνος
  choice: thời đại
  rationale: αἰών ở đây là thời đại hay kỷ nguyên, không trực tiếp chỉ thế giới vật chất.
theological_decisions:
- issue: Cụm thời gian ἕως τῆς συντελείας τοῦ αἰῶνος
  choice: cho đến tận cùng của thời đại
  alternative: 'cho đến khi thời đại hoàn tất; theo cách dịch truyền thống: cho đến tận thế'
  rationale: Giữ ý chung cuộc của thời đại hiện tại trong συντέλεια + αἰών, đồng thời tránh khiến độc giả hiểu rằng nguyên văn nói cụ thể đến sự hủy diệt của thế giới vật chất.
- issue: Lời hứa hiện diện πάσας τὰς ἡμέρας
  choice: Ta ở cùng các con mỗi ngày
  alternative: Ta luôn ở cùng các con
  rationale: “Mỗi ngày” giữ được hình ảnh ngày qua ngày trong nguyên văn mà vẫn biểu đạt sự hiện diện liên tục, không giải thích thêm bản chất thần học của sự hiện diện ấy.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Ta/các con” tạo sắc thái lời phán có thẩm quyền nhưng gần gũi; “tuân giữ” và “tận cùng của thời đại” ưu tiên độ chính xác đối với nguyên văn mà vẫn tự nhiên trong tiếng Việt.
