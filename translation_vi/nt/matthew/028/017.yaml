  text: καὶ ἰδόντες αὐτὸν ⸀προσεκύνησαν, οἱ δὲ ἐδίστασαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/017.yaml
  text: And when they saw him[a], they worshiped him, but some doubted.
translation:
  language: vi
  text: Khi thấy Ngài, họ thờ lạy Ngài, nhưng một số người nghi ngờ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “do dự” hoặc “dao động.” Từ Hy Lạp có thể chỉ sự không chắc chắn hơn là thái độ không tin đã dứt khoát.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδόντες
  choice: Khi thấy
  rationale: Phân từ bất định quá khứ của ὁράω được diễn đạt như một mệnh đề chỉ thời gian, vừa tự nhiên trong tiếng Việt vừa giữ quan hệ với các động từ chính.
- source_word: προσεκύνησαν
  choice: thờ lạy
  rationale: προσκυνέω có thể chỉ hành động phủ phục, bày tỏ lòng tôn kính hoặc thờ phượng. Trong bối cảnh Chúa Giê-su đã sống lại, “thờ lạy” giữ được cả sắc thái tôn kính sâu xa lẫn sức nặng thần học của hành động này.
- source_word: οἱ δὲ
  choice: nhưng một số người
  rationale: Cụm có tính đối chiếu và tỉnh lược, chỉ một bộ phận trong nhóm vừa được nhắc đến. Tiếng Việt cần nêu rõ chủ thể, nên “một số người” truyền đạt tự nhiên ý nghĩa ấy.
- source_word: ἐδίστασαν
  choice: nghi ngờ
  rationale: διστάζω có thể mang nghĩa nghi ngờ, do dự hoặc dao động. “Nghi ngờ” là cách dịch trực tiếp, còn chú thích bảo lưu sắc thái bất định hoặc dao động thay vì sự không tin đã dứt khoát.
theological_decisions:
- issue: Sắc thái của προσκυνέω hướng về Chúa Giê-su phục sinh
  choice: thờ lạy
  alternative: phủ phục trước Ngài; bày tỏ lòng tôn kính với Ngài
  rationale: Bối cảnh sau sự phục sinh và đối tượng trực tiếp là Chúa Giê-su ủng hộ cách dịch “thờ lạy”; cách này có cơ sở từ vựng nhưng không diễn giải vượt quá câu Hy Lạp.
- issue: Sắc thái của διστάζω
  choice: nghi ngờ trong chính văn
  alternative: do dự; dao động
  rationale: Từ Hy Lạp có thể diễn tả sự chần chừ hoặc bất định, chứ không nhất thiết là thái độ không tin đã ổn định. Chính văn giữ cách dịch trực tiếp, còn chú thích bảo lưu độ mở này.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” để chỉ Chúa Giê-su; cấu trúc câu ngắn gọn, giữ nguyên sự tương phản giữa việc thờ lạy và sự nghi ngờ của một số người.
