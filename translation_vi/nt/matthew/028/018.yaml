source:
  edition: SBLGNT
  text: καὶ προσελθὼν ὁ Ἰησοῦς ἐλάλησεν αὐτοῖς λέγων· Ἐδόθη μοι πᾶσα ἐξουσία ἐν οὐρανῷ καὶ ἐπὶ ⸀τῆς γῆς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/018.yaml
  text: And Jesus came near and spoke to them[a], saying[b], “All authority in heaven and on earth has been given to me.”
translation:
  language: vi
  text: 'Đức Giê-su đến gần và nói với họ: “Mọi thẩm quyền[a] trên trời và trên đất đã được trao cho tôi[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “mọi quyền”. Từ Hy Lạp ἐξουσία nói về thẩm quyền, quyền hạn hoặc quyền cai trị chính đáng, chứ không chỉ về sức mạnh.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “đã được ban cho tôi”. Động từ Hy Lạp ở thì bất định, thể bị động, nói đến một hành động trao ban đã xảy ra; trong ngữ cảnh, thẩm quyền ấy hiện thuộc về Đức Giê-su phục sinh.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσελθὼν
  choice: đến gần
  rationale: Phân từ bất định của προσέρχομαι diễn tả Đức Giê-su tiến lại gần trước khi nói; “đến gần” tự nhiên và giữ được ý nghĩa không gian.
- source_word: ἐλάλησεν αὐτοῖς λέγων
  choice: nói với họ
  rationale: Tiếng Việt không cần lặp lại theo sát cấu trúc “nói với họ rằng rằng”; cách diễn đạt này truyền đạt tự nhiên động từ ἐλάλησεν, tân ngữ gián tiếp αὐτοῖς và chức năng dẫn lời của λέγων.
- source_word: πᾶσα ἐξουσία
  choice: mọi thẩm quyền
  rationale: Với danh từ trừu tượng số ít, πᾶσα chỉ toàn thể; ἐξουσία nhấn mạnh quyền cai quản chính đáng hơn là sức mạnh thuần túy.
- source_word: Ἐδόθη μοι
  choice: đã được trao cho tôi
  rationale: Giữ thể bị động của động từ bất định Ἐδόθη và diễn tả một hành động đã hoàn tất, có hiệu lực trong hiện tại; μοι xác định Đức Giê-su là người nhận.
- source_word: ἐν οὐρανῷ καὶ ἐπὶ τῆς γῆς
  choice: trên trời và dưới đất
  rationale: Cặp từ quen thuộc, trang trọng và dễ hiểu trong tiếng Việt để chỉ toàn bộ hai phạm vi trời và đất.
theological_decisions:
- issue: Bản chất việc Đức Giê-su có thẩm quyền phổ quát
  choice: Mọi thẩm quyền ... đã được trao cho tôi
  alternative: Mọi quyền năng ... thuộc về tôi
  rationale: Giữ nguyên thể bị động của Ἐδόθη, không biến câu thành một lời khẳng định trừu tượng về sự sở hữu vốn có; đồng thời “thẩm quyền” phản ánh ἐξουσία chính xác hơn “quyền năng”.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Giê-su” theo lối gọi tôn kính thông dụng; rút gọn cấu trúc dẫn lời để tránh lặp vụng trong tiếng Việt nhưng vẫn giữ đầy đủ nội dung của nguyên văn.
