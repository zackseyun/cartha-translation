  to: 'Đức Giê-su đến gần và nói với họ: “Mọi thẩm quyền[a] trên trời và trên đất đã được trao cho tôi[b].”'
  rationale: Chỉ thay “dưới đất” bằng “trên đất” để phản ánh trực tiếp ἐπὶ τῆς γῆς (“trên đất/on earth”) và tránh hàm ý không chủ định về vùng bên dưới mặt đất. Không thay đổi nội dung, sắc thái bị động, hay các neo chú thích.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T07:38:38Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch giữ đúng trình tự chính: Đức Giê-su tiến lại gần, nói với các môn đồ, và tuyên bố rằng mọi thẩm quyền đã được trao cho Ngài. “Đã được trao cho tôi” phản ánh đúng động từ bất định thể bị động Ἐδόθη và không quy định chủ thể trao ban. Tuy nhiên, “dưới đất” thường gợi vị trí ở bên dưới mặt đất; ἐπὶ τῆς γῆς ở đây là “trên đất/on earth.”'
  naturalness: 'Câu văn trang trọng, rõ ràng và tự nhiên. Cấu trúc “nói với họ: ...” chuyển tải chức năng dẫn lời của λέγων cách thành ngữ trong tiếng Việt. “Trên trời và trên đất” tự nhiên trong văn phong Kinh Thánh hiện đại và khớp chính xác hơn với hai giới từ của nguyên văn.'
  terminology: “Thẩm quyền” là lựa chọn tốt cho ἐξουσία, phân biệt với sức mạnh hay quyền năng thuần túy. “Đức Giê-su” phù hợp với lối gọi tôn kính hiện đại. Các chú thích giữ đúng neo [a] cho ἐξουσία và [b] cho Ἐδόθη μοι.
  issues:
  - severity: medium
    issue: “dưới đất” cho ἐπὶ τῆς γῆς
    rationale: Dù cụm thành ngữ “trên trời dưới đất” có thể chỉ toàn thể vũ trụ, “dưới đất” theo nghĩa thông thường dễ gợi điều ở dưới mặt đất. Nguyên văn nói thẩm quyền “trên đất,” đối ứng với “trên trời”; nên cần dùng “trên đất” để bảo toàn ý nghĩa vị trí và phạm vi.
  revised_text: 'Đức Giê-su đến gần và nói với họ: “Mọi thẩm quyền[a] trên trời và trên đất đã được trao cho tôi[b].”'
