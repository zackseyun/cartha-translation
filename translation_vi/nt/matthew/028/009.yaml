- from: 'Và kìa, Đức Giê-su gặp họ và nói: “Chào các chị em!”[a] Họ tiến lại, ôm lấy chân Ngài và thờ lạy Ngài.[b]'
  to: 'Và kìa, Đức Giê-su gặp họ và nói: “Chào các chị!”[a] Họ tiến lại, nắm lấy chân Ngài và thờ lạy Ngài.[b]'
  rationale: Chỉnh “ôm lấy” thành “nắm lấy” để phản ánh chính xác hơn κρατέω. Lời chào được làm gọn cho tự nhiên trong tiếng Việt, vẫn biểu thị người nghe là các phụ nữ trong ngữ cảnh. Chú thích về προσκυνέω được điều chỉnh để bảo lưu phạm vi nghĩa của từ Hy Lạp và tránh diễn giải thần học quá quyết định.
  reviewer_model: gpt-5.6-terra
