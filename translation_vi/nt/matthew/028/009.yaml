  source_fidelity: 'Bản dịch bảo toàn tốt trình tự và các yếu tố chính của câu: dấu hiệu thu hút chú ý (ἰδού), việc Đức Giê-su gặp các phụ nữ, lời chào số nhiều, việc họ đến gần, nắm chân Ngài và hành động προσκυνέω. Tuy nhiên, “ôm lấy chân” thiên về cử chỉ ôm choàng hơn là κρατέω (“nắm/giữ chặt”), nên cần chỉnh để giữ nét nghĩa cụ thể của nguyên ngữ.'
  naturalness: Văn phong nhìn chung tự nhiên, hiện đại và trang trọng vừa phải. “Và kìa” phù hợp văn kể chuyện Kinh Thánh. “Chào các chị em!” có thể hiểu được, nhưng “Chào các chị!” gọn và tự nhiên hơn trong lời chào trực tiếp, đồng thời phản ánh người nghe là số nhiều giống cái theo ngữ cảnh.
  terminology: “Đức Giê-su,” “Ngài,” và “thờ lạy” nhất quán với văn phong kính trọng. “Thờ lạy” là một cách dịch có cơ sở cho προσκυνέω trong ngữ cảnh phục sinh, nhưng chú thích cần trình bày các nghĩa thay thế như những khả năng ngữ nghĩa, không khẳng định rằng ngữ cảnh tất yếu đòi một nghĩa mạnh hơn.
