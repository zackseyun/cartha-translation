  text: ⸀καὶ ⸀ἰδοὺ Ἰησοῦς ⸀ὑπήντησεν αὐταῖς λέγων· Χαίρετε· αἱ δὲ προσελθοῦσαι ἐκράτησαν αὐτοῦ τοὺς πόδας καὶ προσεκύνησαν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/009.yaml
  text: And behold[a], Jesus met them, saying, “Greetings!” And they came up, took hold of his feet[b], and worshiped him.
translation:
  language: vi
  text: 'Và kìa, Đức Giê-su gặp họ và nói: “Chào các chị!”[a] Họ tiến lại, nắm lấy chân Ngài và thờ lạy Ngài.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Hãy vui mừng!” Từ Hy Lạp χαίρετε theo nghĩa đen là một mệnh lệnh số nhiều, nhưng trong ngữ cảnh này được dùng như một lời chào.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “phủ phục trước Ngài” hoặc “tôn kính Ngài.” Động từ Hy Lạp προσκυνέω có thể chỉ hành động phủ phục, tỏ lòng tôn kính, hoặc thờ lạy; ở đây bản dịch dùng “thờ lạy” theo bối cảnh Đức Giê-su phục sinh.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδοὺ
  choice: kìa
  rationale: Giữ chức năng thu hút sự chú ý và nét sống động của lời kể; “kìa” tự nhiên, trang trọng vừa phải trong tiếng Việt hiện đại.
- source_word: ὑπήντησεν
  choice: gặp
  rationale: Diễn đạt ngắn gọn việc Đức Giê-su gặp họ trên đường mà không thêm sắc thái phương hướng ngoài điều động từ tự nó xác định.
- source_word: Χαίρετε
  choice: Chào các chị em!
  rationale: Dù về hình thức là mệnh lệnh số nhiều của χαίρω, từ này ở đây có chức năng như một lời chào. “Các chị em” làm rõ đối tượng nữ số nhiều vốn được mã hóa trong ngữ cảnh và đại từ Hy Lạp.
- source_word: προσελθοῦσαι
  choice: tiến lại
  rationale: Thể hiện việc họ đến gần Đức Giê-su trước hai hành động tiếp theo, đồng thời tự nhiên trong lời kể tiếng Việt.
- source_word: ἐκράτησαν αὐτοῦ τοὺς πόδας
  choice: ôm lấy chân Ngài
  rationale: Diễn đạt sự tiếp xúc có chủ ý và giữ chặt chân Đức Giê-su; “ôm lấy chân” tự nhiên hơn lối dịch máy móc “nắm lấy hai bàn chân” trong cảnh phủ phục này.
- source_word: προσεκύνησαν αὐτῷ
  choice: thờ lạy Ngài
  rationale: “Thờ lạy” phù hợp với sức nặng tôn giáo của προσκυνέω trong bối cảnh Đức Giê-su phục sinh, đồng thời vẫn gợi tư thế cúi phục của hành động.
theological_decisions:
- issue: Cách dịch προσκυνέω đối với Đức Giê-su phục sinh
  choice: thờ lạy Ngài
  alternative: phủ phục trước Ngài / bày tỏ lòng tôn kính với Ngài
  rationale: Trong bối cảnh ngay sau sự phục sinh và trong cách Ma-thi-ơ trình bày về Đức Giê-su, hành động này có sức nặng hơn sự kính trọng xã giao. Tuy nhiên, chú thích vẫn bảo lưu phạm vi nghĩa của động từ Hy Lạp, vốn cũng có thể chỉ việc phủ phục hoặc tỏ lòng tôn kính.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Giê-su” và đại từ kính trọng “Ngài”; “kìa” bảo toàn dấu hiệu diễn ngôn ἰδού. Hai chú thích giữ lại các khả năng từ vựng thực sự của Χαίρετε và προσκυνέω.
