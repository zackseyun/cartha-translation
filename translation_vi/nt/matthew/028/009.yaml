    rationale: Cụm “rất có thể mang nghĩa mạnh hơn là thờ lạy” vừa không tự nhiên về diễn đạt vừa nghiêng sang quyết định thần học. Nên bảo lưu rằng động từ có thể chỉ phủ phục, tôn kính hoặc thờ lạy; bản văn chọn “thờ lạy” theo ngữ cảnh.
