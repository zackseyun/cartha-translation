id: MAT.28.14
reference: Matthew 28:14
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἐὰν ἀκουσθῇ τοῦτο ⸀ἐπὶ τοῦ ἡγεμόνος, ἡμεῖς πείσομεν ⸀αὐτὸν καὶ ὑμᾶς ἀμερίμνους ποιήσομεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/014.yaml
  text: And if this is heard by the governor, we will persuade him and keep you out of trouble.
translation:
  language: vi
  text: Nếu việc này đến tai tổng đốc,[a] chúng tôi sẽ thuyết phục ông ấy và lo liệu để các anh không bị rắc rối.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Nếu việc này được trình lên tổng đốc.”'
    reason: lexical_alternative
  - marker: b
    text: 'Sát nghĩa: “làm cho các anh khỏi phải lo.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκουσθῇ ... ἐπὶ τοῦ ἡγεμόνος
  choice: việc này đến tai tổng đốc
  rationale: Cách nói tự nhiên trong tiếng Việt diễn đạt thể bị động và ý nghĩa thành ngữ rằng sự việc được vị tổng đốc biết đến, không khẳng định ông là tác nhân làm phát sinh tin ấy.
- source_word: ἡγεμόνος
  choice: tổng đốc
  rationale: Trong bối cảnh chính quyền La Mã tại Giu-đê, từ này chỉ viên quan cai trị cấp tỉnh, tức Phi-lát; “tổng đốc” là cách gọi quen thuộc và chính xác theo ngữ cảnh.
- source_word: πείσομεν αὐτόν
  choice: chúng tôi sẽ thuyết phục ông ấy
  rationale: Giữ nghĩa trực tiếp của πείθω là thuyết phục; ngữ cảnh có thể hàm ý xoa dịu hoặc thu xếp với tổng đốc nhưng không cần đưa hàm ý ấy vào chính văn.
- source_word: ἀμερίμνους ποιήσομεν
  choice: lo liệu để các anh không bị rắc rối
  rationale: Cụm từ có nghĩa đen là làm cho họ không phải lo; trong ngữ cảnh các lính canh có nguy cơ bị kỷ luật, cách dịch này truyền đạt tự nhiên kết quả được hứa hẹn, còn nghĩa sát chữ được giữ trong chú thích.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Các anh” phù hợp với lời các thượng tế và trưởng lão nói trực tiếp với nhóm lính canh; “lo liệu” diễn đạt lời hứa chủ động can thiệp mà không nói rõ phương thức.
