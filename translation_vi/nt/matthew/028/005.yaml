  naturalness: “Còn các bà, đừng sợ” có thể hiểu được, nhưng “các bà” trong tiếng Việt hiện đại dễ gợi tuổi tác và không nhất quán với cách gọi “các phụ nữ” ở lời dẫn. “Còn các phụ nữ, đừng sợ” không tự nhiên trong lời thoại. Dùng “Các bà, đừng sợ” giữ được đại từ số nhiều rõ nét trong một văn cảnh Kinh Thánh trang trọng; chú thích giải thích phần nhấn mạnh/có thể tương phản.
