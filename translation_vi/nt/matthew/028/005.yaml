id: MAT.28.5
reference: Matthew 28:5
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ὁ ἄγγελος εἶπεν ταῖς γυναιξίν· Μὴ φοβεῖσθε ὑμεῖς, οἶδα γὰρ ὅτι Ἰησοῦν τὸν ἐσταυρωμένον ζητεῖτε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/005.yaml
  text: But the angel answered and said to the women[a], “Do not be afraid[b]; for I know that you are seeking Jesus who has been crucified.”
translation:
  language: vi
  text: 'Nhưng thiên sứ đáp lời và nói với các phụ nữ: “Các bà, đừng sợ,[a] vì tôi biết các bà đang tìm Giê-su, người đã bị đóng đinh.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn Hy Lạp nêu rõ đại từ “các bà” để nhấn mạnh; đại từ này cũng có thể gợi một sự tương phản.
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “Giê-su, người chịu đóng đinh” hoặc “Giê-su, người đã chịu đóng đinh.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ... εἶπεν
  choice: Nhưng ... nói
  rationale: Công thức kể chuyện Hy Lạp có nghĩa sát là “đáp lời và nói”; trong tiếng Việt hiện đại, chỉ dùng “nói” tự nhiên hơn, còn “nhưng” giữ sắc thái chuyển ý nhẹ của δέ.
- source_word: ὁ ἄγγελος
  choice: thiên sứ
  rationale: Trong bối cảnh phục sinh, từ này chỉ một sứ giả thiên giới; “thiên sứ” là cách gọi rõ nghĩa và trang trọng.
- source_word: ταῖς γυναιξίν
  choice: với các phụ nữ
  rationale: Dịch trực tiếp danh từ số nhiều chỉ những người phụ nữ đã được nhắc đến trong trình thuật.
- source_word: Μὴ φοβεῖσθε ὑμεῖς
  choice: Còn các bà, đừng sợ
  rationale: “Các bà” phù hợp với lời nói trực tiếp dành cho nhóm phụ nữ trưởng thành; “còn” giúp thể hiện đại từ ὑμεῖς được nêu rõ để nhấn mạnh, mà vẫn tự nhiên trong tiếng Việt.
- source_word: οἶδα γὰρ ὅτι
  choice: vì tôi biết
  rationale: γάρ nêu lý do cho lời trấn an, còn ὅτι giới thiệu nội dung được biết; tiếng Việt có thể diễn đạt tự nhiên mà không cần một từ tương ứng riêng cho ὅτι.
- source_word: Ἰησοῦν
  choice: Đức Giê-su
  rationale: Dùng dạng tên riêng quen thuộc trong tiếng Việt và kính ngữ thông dụng, không thêm diễn giải giáo phái.
- source_word: τὸν ἐσταυρωμένον
  choice: Đấng đã bị đóng đinh
  rationale: Phân từ hoàn thành bị động xác định Đức Giê-su bằng việc Người đã chịu đóng đinh; “đã bị đóng đinh” giữ hành động đã hoàn tất, còn “Đấng” tạo lối diễn đạt tự nhiên, trang trọng.
- source_word: ζητεῖτε
  choice: các bà đang tìm
  rationale: Thì hiện tại trong ngữ cảnh diễn tả hành động đang diễn ra; “đang tìm” là cách nói tự nhiên hơn “tìm kiếm” ở đây.
theological_decisions:
- issue: Sự nhấn mạnh của đại từ ὑμεῖς trong lời trấn an
  choice: “Còn các bà, đừng sợ”
  alternative: “Đừng sợ” hoặc “Chính các bà đừng sợ”
  rationale: Đại từ được nêu rõ mang sắc thái nhấn mạnh hoặc đối chiếu. “Còn các bà” bảo tồn sắc thái ấy mà không xác định quá mức đối tượng đối chiếu hay lý do thần học.
- issue: Sắc thái của phân từ hoàn thành τὸν ἐσταυρωμένον
  choice: “Đấng đã bị đóng đinh”
  alternative: “Đấng chịu đóng đinh” hoặc “Đấng đã chịu đóng đinh”
  rationale: Bản dịch giữ thể bị động và biến cố đã hoàn tất, nhưng không thêm chủ thể gây ra hành động hay khai triển ý nghĩa cứu chuộc vốn không được phát biểu trực tiếp trong câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “các bà” trong lời thiên sứ nói trực tiếp với nhóm phụ nữ trưởng thành; dùng “thiên sứ” và “Đức Giê-su” theo lối dùng Kinh Thánh tiếng Việt quen thuộc. Hai chú thích bảo tồn sự nhấn mạnh của ὑμεῖς và các khả năng diễn đạt phân từ hoàn thành bị động.
