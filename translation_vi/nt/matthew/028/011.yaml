  text: Πορευομένων δὲ αὐτῶν ἰδού τινες τῆς κουστωδίας ἐλθόντες εἰς τὴν πόλιν ἀπήγγειλαν τοῖς ἀρχιερεῦσιν ἅπαντα τὰ γενόμενα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/011.yaml
  text: While they were going[a], behold[b], some of the guard came into the city and reported to the chief priests everything that had happened.
translation:
  language: vi
  text: Khi các phụ nữ đang đi đường[a], kìa[b], một số người trong toán lính canh đã vào thành và báo cho các thượng tế mọi việc đã xảy ra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Trong khi các phụ nữ đang đi.” Tiếng Hy Lạp dùng cấu trúc thuộc cách tuyệt đối để đặt khung thời gian cho diễn biến tiếp theo.'
    reason: lexical_alternative
  - marker: b
    text: “Kìa” chuyển tải từ Hy Lạp ἰδού, một dấu hiệu thu hút sự chú ý, báo hiệu một diễn biến đột ngột hoặc đáng lưu ý trong lời kể.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πορευομένων δὲ αὐτῶν
  choice: Khi các phụ nữ đang trên đường đi
  rationale: Cấu trúc sở hữu cách tuyệt đối đặt bối cảnh thời gian và δέ chuyển sang diễn biến tiếp theo. Đại từ giống cái số nhiều αὐτῶν quy chiếu đến các phụ nữ trong ngữ cảnh trước; nêu rõ đối tượng giúp câu tiếng Việt tự nhiên mà không xác định thêm đích đến.
- source_word: ἰδού
  choice: kìa
  rationale: Giữ lại dấu hiệu thu hút sự chú ý, báo hiệu một diễn biến đột ngột hoặc đáng lưu ý trong lời kể.
- source_word: τινες τῆς κουστωδίας
  choice: một số lính canh
  rationale: κουστωδία chỉ toán lính canh được bố trí tại mộ; cách diễn đạt này rõ ràng và tự nhiên trong tiếng Việt hiện đại.
- source_word: ἐλθόντες εἰς τὴν πόλιν
  choice: vào thành
  rationale: Phân từ bất định quá khứ diễn tả hành động xảy ra trước động từ chính; tiếng Việt có thể chuyển tự nhiên thành chuỗi hành động mà không cần dùng kết cấu phân từ cứng nhắc.
- source_word: ἀπήγγειλαν
  choice: báo
  rationale: Động từ chỉ việc đem tin và trình báo; “báo” phù hợp với việc những người lính thuật lại sự việc cho giới lãnh đạo.
- source_word: τοῖς ἀρχιερεῦσιν
  choice: cho các thượng tế
  rationale: “Các thượng tế” là cách gọi quen thuộc cho ἀρχιερεῖς trong bối cảnh giới lãnh đạo Do Thái thời Đền Thờ thứ hai.
- source_word: ἅπαντα τὰ γενόμενα
  choice: mọi việc đã xảy ra
  rationale: ἅπαντα nhấn mạnh tính toàn bộ, còn τὰ γενόμενα nói đến các sự việc đã diễn ra; cách dịch giữ được ý bao quát và tự nhiên.
theological_decisions: []
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “kìa” để giữ chức năng diễn ngôn của ἰδού dù từ này có sắc thái nổi bật hơn lời kể thông thường; dùng “thành” phù hợp bối cảnh Giê-ru-sa-lem đã được xác lập.
