review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch phản ánh đúng trình tự và nội dung Hy Lạp: mệnh đề thuộc cách tuyệt đối làm bối cảnh thời gian, dấu hiệu ἰδού, một số người thuộc toán lính canh, việc họ vào thành rồi trình báo các thượng tế toàn bộ sự việc. “Các phụ nữ” có căn cứ từ ngữ cảnh ngay trước đó (28:8–10).'
  naturalness: Câu hiện có dễ hiểu, nhưng “đang trên đường đi” hơi nặng và chuỗi “lính canh vào thành và báo” chưa biểu lộ rõ sắc thái phân từ προηγούμενο của ἐλθόντες. “Đang đi đường” và “đã vào thành” tự nhiên, mạch lạc hơn trong tiếng Việt hiện đại.
  terminology: “Kìa,” “toán lính canh,” và “các thượng tế” giữ được sắc thái trần thuật cũng như thuật ngữ lãnh đạo tôn giáo trong bản gốc. Không có vấn đề thần học cần điều chỉnh.
  issues:
  - severity: low
    issue: Cụm “đang trên đường đi” hơi trùng ý và thiếu tự nhiên.
    rationale: Πορευομένων chỉ hành động đang đi; “đang đi đường” diễn đạt khung thời gian ấy gọn, tự nhiên hơn.
  - severity: low
    issue: Quan hệ trước–sau của ἐλθόντες chưa được nêu rõ trong “vào thành và báo.”
    rationale: Phân từ aorist ἐλθόντες đặt việc vào thành trước động từ chính ἀπήγγειλαν. Thêm “đã” là điều chỉnh an toàn, không thêm nghĩa.
  revised_text: Khi các phụ nữ đang đi đường[a], kìa[b], một số người trong toán lính canh đã vào thành và báo cho các thượng tế mọi việc đã xảy ra.
