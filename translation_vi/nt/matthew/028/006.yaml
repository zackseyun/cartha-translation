revisions:
- from: Ngài không ở đây, vì Ngài đã được làm cho sống lại[a], đúng như Ngài đã nói. Hãy đến xem nơi Ngài đã nằm[b].
  to: Ngài không ở đây, vì Ngài đã sống lại[a], đúng như Ngài đã nói. Hãy đến xem nơi Ngài đã nằm[b].
  rationale: Sửa cách diễn đạt phục sinh để đạt tiếng Việt hiện đại, tự nhiên và rõ nghĩa, không thay đổi nội dung của câu. Vì tiếng Việt không có một cách bị động tương đương vừa tự nhiên vừa không gây lệch nghĩa ở đây, bản văn chính dùng “đã sống lại”; chú thích bảo lưu dữ kiện quan trọng rằng ἠγέρθη có hình thức bị động. Chú thích về nơi thi thể nằm cũng được làm tự nhiên hơn, không áp đặt tác nhân.
  reviewer_model: gpt-5.6-terra
