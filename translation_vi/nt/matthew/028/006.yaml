source:
  edition: SBLGNT
  text: οὐκ ἔστιν ὧδε, ἠγέρθη γὰρ καθὼς εἶπεν· δεῦτε ἴδετε τὸν τόπον ὅπου ⸀ἔκειτο·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/006.yaml
  text: He is not here[a], for he has been raised, just as he said. Come[b], see the place where he was lying.
translation:
  language: vi
  text: Ngài không ở đây, vì Ngài đã sống lại[a], đúng như Ngài đã nói. Hãy đến xem nơi Ngài đã nằm[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc dịch sát hình thức bị động của tiếng Hy Lạp: “Ngài đã được phục sinh.” Cách dịch “đã sống lại” là cách diễn đạt tự nhiên, quen thuộc trong tiếng Việt.'
    reason: alternative_reading
  - marker: b
    text: 'Cũng có thể dịch: “nơi Ngài nằm” hoặc “nơi Ngài đã được đặt.” Động từ Hy Lạp chủ yếu diễn tả trạng thái nằm.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ ἔστιν ὧδε
  choice: Ngài không ở đây
  rationale: Đây là cách diễn đạt tự nhiên trong tiếng Việt cho lời xác nhận về vị trí; chủ ngữ được bổ sung theo ngữ cảnh rõ ràng.
- source_word: ἠγέρθη
  choice: đã được làm cho sống lại
  rationale: Động từ Hy Lạp ở thể bị động. Cách dịch này vừa dễ hiểu vừa giữ được ý rằng sự sống lại là hành động được thực hiện trên Ngài, thay vì âm thầm đổi sang thể chủ động.
- source_word: γὰρ
  choice: vì
  rationale: Từ này nêu lý do Ngài không còn ở đó; “vì” diễn đạt rõ quan hệ giải thích trong tiếng Việt hiện đại.
- source_word: καθὼς εἶπεν
  choice: đúng như Ngài đã nói
  rationale: “Đúng như” giữ sắc thái tương ứng chính xác với lời Ngài đã báo trước; “đã nói” làm rõ hành động xảy ra trước đó một cách tự nhiên.
- source_word: δεῦτε ἴδετε
  choice: Hãy đến xem
  rationale: Kết hợp lời mời gọi δεῦτε với mệnh lệnh quan sát ἴδετε thành câu tiếng Việt ngắn gọn, tự nhiên và giữ đủ hai ý.
- source_word: τὸν τόπον
  choice: nơi
  rationale: “Nơi” chỉ vị trí cụ thể trong mộ và tránh sự nặng nề không cần thiết của “địa điểm”.
- source_word: ὅπου ἔκειτο
  choice: nơi Ngài đã nằm
  rationale: Cách dịch này giữ nghĩa trạng thái của κεῖμαι và phù hợp với ngữ cảnh thân thể Ngài từng nằm trong mộ, nhưng không áp đặt rõ tác nhân đặt Ngài ở đó.
theological_decisions:
- issue: Thể và tác nhân trong lời tuyên bố về sự sống lại
  choice: Ngài đã được làm cho sống lại
  alternative: Ngài đã sống lại
  rationale: Bản Hy Lạp dùng hình thức bị động ἠγέρθη. Giữ thể bị động bảo toàn sắc thái rằng sự sống lại là hành động được thực hiện trên Ngài, trong khi không phủ nhận những cách diễn đạt khác về vai trò của Chúa Giê-su ở các phân đoạn khác.
- issue: Trạng thái hay hành động đặt thi thể trong mộ
  choice: nơi Ngài đã nằm
  alternative: nơi Ngài đã được đặt nằm
  rationale: κεῖμαι chủ yếu diễn tả trạng thái nằm hoặc được đặt. Bản chính giữ nét nghĩa trạng thái và để ngỏ sắc thái bị động thay vì xác định một hành động hay tác nhân không được nêu rõ trong câu.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “Ngài” theo ngữ cảnh nói về Chúa Giê-su. Cấu trúc “đã được làm cho sống lại” hơi đầy hơn cách nói truyền thống nhưng cần thiết để giữ thể bị động của nguyên văn; chú thích cung cấp cách dịch quen thuộc hơn.
