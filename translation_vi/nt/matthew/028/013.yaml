  text: λέγοντες· Εἴπατε ὅτι Οἱ μαθηταὶ αὐτοῦ νυκτὸς ἐλθόντες ἔκλεψαν αὐτὸν ἡμῶν κοιμωμένων·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/013.yaml
  text: saying[a], “Say[b], ‘His disciples came by night and stole him while we were sleeping.’”
translation:
  language: vi
  text: 'và bảo: “Hãy nói: ‘Các môn đệ của người ấy đã đến vào ban đêm[a] và lấy trộm người ấy[b] trong khi chúng tôi đang ngủ.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “ban đêm”. Tiếng Hy Lạp dùng sở hữu cách với chức năng trạng từ để chỉ thời điểm họ đến.'
    reason: lexical_alternative
  - marker: b
    text: Tiếng Hy Lạp là “người ấy”, không phải “thi thể của người ấy”.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγοντες
  choice: và bảo
  rationale: Phân từ hiện tại giới thiệu nội dung lời chỉ thị. Trong mạch kể tiếng Việt, “và bảo” tự nhiên hơn lối dịch sát hình thức “đang nói rằng”.
- source_word: Εἴπατε
  choice: Hãy nói
  rationale: Động từ mệnh lệnh quá khứ, ngôi thứ hai số nhiều; “Hãy nói” giữ nguyên lực truyền lệnh mà không thêm đối tượng không có trong nguyên văn.
- source_word: ὅτι
  choice: thể hiện bằng dấu hai chấm và lời trích dẫn
  rationale: ὅτι giới thiệu nội dung lời nói; cấu trúc trích dẫn trực tiếp truyền đạt chức năng này tự nhiên trong tiếng Việt.
- source_word: Οἱ μαθηταὶ αὐτοῦ
  choice: Các môn đồ của ông ấy
  rationale: Giữ quan hệ sở hữu và dùng cách gọi thông dụng, dễ hiểu; không thêm sắc thái tôn kính hoặc miệt thị không được biểu thị rõ trong nguyên văn.
- source_word: νυκτὸς
  choice: vào ban đêm
  rationale: Sở hữu cách dùng như trạng từ chỉ thời điểm các môn đồ được cho là đã đến.
- source_word: ἐλθόντες
  choice: đã đến
  rationale: Phân từ quá khứ diễn tả hành động xảy ra trước hoặc gắn liền với hành động chính; tiếng Việt diễn đạt tự nhiên bằng động từ hữu hạn nối với “và”.
- source_word: ἔκλεψαν
  choice: lấy trộm ... đi
  rationale: Diễn đạt hành vi trộm cắp bằng tiếng Việt tự nhiên, đồng thời phù hợp với tân ngữ chỉ người trong câu.
- source_word: αὐτὸν
  choice: ông ấy
  rationale: Giữ đại từ chỉ chính Chúa Giê-su, thay vì diễn giải thành “thi thể của ông ấy” vốn không có trong tiếng Hy Lạp.
- source_word: ἡμῶν κοιμωμένων
  choice: trong khi chúng tôi đang ngủ
  rationale: Diễn đạt rõ kết cấu sở hữu cách tuyệt đối và giữ quan hệ đồng thời của hoàn cảnh.
theological_decisions:
- issue: Đối tượng mà αὐτόν chỉ đến trong lời khai bịa đặt
  choice: Giữ đại từ chỉ người “ông ấy”
  alternative: “thi thể của ông ấy”
  rationale: Nguyên văn dùng đại từ nhân xưng αὐτόν, không dùng danh từ “thi thể”. Cách dịch không nên tự ý giải thích thêm dù ngữ cảnh liên quan đến ngôi mộ.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Môn đồ” giữ thuật ngữ Kinh Thánh quen thuộc. Hai lớp dấu ngoặc kép làm rõ mệnh lệnh và lời khai được yêu cầu bịa ra; đại từ “ông ấy” tránh cả sắc thái tôn kính quá mức lẫn miệt thị trong lời trích dẫn.
