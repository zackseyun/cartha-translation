- from: 'và bảo: “Hãy nói: ‘Các môn đồ của ông ấy đã đến vào ban đêm[a] và lấy trộm ông ấy đi[b] trong khi chúng tôi đang ngủ.’”'
  to: 'và bảo: “Hãy nói: ‘Các môn đệ của người ấy đã đến vào ban đêm[a] và lấy trộm người ấy[b] trong khi chúng tôi đang ngủ.’”'
  rationale: Bản sửa duy trì sát nguyên văn SBLGNT và cấu trúc trích dẫn lồng nhau, nhưng thay các cách diễn đạt có sắc thái hoặc kém tự nhiên bằng tiếng Việt hiện đại trung tính hơn. Đại từ vẫn được giữ là đại từ chỉ người, đúng với αὐτόν, thay vì thêm danh từ giải thích “thi thể”.
