  text: τότε λέγει αὐταῖς ὁ Ἰησοῦς· Μὴ φοβεῖσθε· ὑπάγετε ἀπαγγείλατε τοῖς ἀδελφοῖς μου ἵνα ἀπέλθωσιν εἰς τὴν Γαλιλαίαν, κἀκεῖ με ὄψονται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/010.yaml
  text: Then Jesus said to them[a], “Do not be afraid. Go, tell my brothers to go to Galilee[c][b], and there they will see me.”
translation:
  language: vi
  text: 'Bấy giờ, Đức Giê-su nói với họ: “Đừng sợ. Hãy đi bảo anh em tôi[a] đến Ga-li-lê; tại đó họ sẽ thấy tôi.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Trong câu này, “anh em tôi” chỉ các môn đồ của Đức Giê-su. Từ Hy Lạp ở đây là danh từ giống đực số nhiều.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Bấy giờ
  rationale: Đánh dấu diễn tiến tiếp theo của câu chuyện một cách tự nhiên và trang trọng trong văn kể tiếng Việt.
- source_word: λέγει αὐταῖς
  choice: Đức Giê-su nói với họ
  rationale: Dùng thì kể chuyện tự nhiên trong tiếng Việt; “họ” giữ đại từ của nguyên bản, còn ngữ cảnh xác định đó là những phụ nữ.
- source_word: Μὴ φοβεῖσθε
  choice: Đừng sợ
  rationale: Cách diễn đạt ngắn gọn, tự nhiên, truyền đạt đúng mệnh lệnh phủ định.
- source_word: ὑπάγετε ἀπαγγείλατε
  choice: Hãy đi báo cho
  rationale: Giữ cả mệnh lệnh di chuyển lẫn ý chuyển đạt một thông điệp; “báo cho” tự nhiên hơn lối diễn đạt quá hành chính như “trình báo”.
- source_word: τοῖς ἀδελφοῖς μου
  choice: anh em tôi
  rationale: Giữ danh từ thân tộc giống đực số nhiều của Hy Lạp thay vì thay bằng cách giải nghĩa “các môn đồ”; chú thích làm rõ đối tượng trong văn cảnh.
- source_word: ἵνα ἀπέλθωσιν εἰς τὴν Γαλιλαίαν
  choice: đi đến Ga-li-lê
  rationale: Sau động từ truyền tin, mệnh đề ἵνα diễn đạt nội dung mệnh lệnh gián tiếp; cấu trúc tiếng Việt với “báo cho … đi đến” truyền đạt tự nhiên ý ấy.
- source_word: κἀκεῖ με ὄψονται
  choice: tại đó họ sẽ thấy tôi
  rationale: Giữ rõ địa điểm và nghĩa thông thường của ὄψονται là “sẽ thấy”, không thu hẹp thành “sẽ gặp”.
theological_decisions:
- issue: Đối tượng của cụm “anh em tôi”
  choice: Giữ nguyên cách gọi thân tộc “anh em tôi”, với chú thích rằng trong văn cảnh đó là các môn đồ của Đức Giê-su.
  alternative: Dịch trực tiếp là “các môn đồ tôi” hoặc hiểu rộng là mọi người theo Đức Giê-su.
  rationale: Văn cảnh gần nhất hướng đến các môn đồ, nhưng việc giữ “anh em” bảo toàn sắc thái thân tình và ý nghĩa thần học của chính cách gọi trong nguyên bản mà không thay nó bằng lời giải nghĩa.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Đức Giê-su” theo lối gọi tôn kính phổ biến; giữ câu mệnh lệnh gọn và trực tiếp. Dấu chấm phẩy giúp phân biệt lời nhắn phải đi đến Ga-li-lê với lời hứa rằng họ sẽ thấy Đức Giê-su tại đó.
