  naturalness: “Bấy giờ,” “Đừng sợ,” và “tại đó họ sẽ thấy tôi” đều tự nhiên trong văn phong Kinh Thánh Việt ngữ hiện đại. Thay “báo cho … đi đến” bằng “bảo … đến” tạo một mệnh lệnh gián tiếp rõ ràng, gọn và tự nhiên.
