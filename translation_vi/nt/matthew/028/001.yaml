  source_fidelity: 'Bản nháp phản ánh đúng các thành tố chính: thời điểm sau/ngày Sa-bát, hai người phụ nữ, hành động đến nhìn và ngôi mộ. Tuy nhiên, “hướng đến ngày thứ nhất trong tuần” là cách chuyển dịch quá sát cấu trúc tiếng Hy Lạp và không diễn đạt tự nhiên quan hệ thời gian trong tiếng Việt. Cụm này nên được chuyển thành “vào ngày thứ nhất trong tuần”; sắc thái “hướng tới” của εἰς được biểu hiện đầy đủ bởi toàn cụm χρονological với động từ “rạng sáng”.'
  naturalness: “Sau ngày Sa-bát, khi trời bắt đầu sáng, hướng đến ngày thứ nhất trong tuần” không tự nhiên và gây vấp, như thể ánh sáng đang có một hướng chuyển động. “Sau ngày Sa-bát, khi trời bắt đầu rạng sáng, vào ngày thứ nhất trong tuần” là tiếng Việt hiện đại, rõ nghĩa và vẫn thận trọng với cấu trúc thời gian của nguyên văn. “Ma-ri khác” trực tiếp hơn và sát ἡ ἄλλη Μαρία hơn “Ma-ri kia”.
  terminology: “Ngày Sa-bát,” “Ma-ri Ma-đơ-len,” và “ngôi mộ” phù hợp với văn phong Kinh Thánh tiếng Việt hiện đại. Dùng “Ma-ri khác” giữ đúng sự phân biệt được nêu trong tiếng Hy Lạp mà không thêm sắc thái chỉ trỏ của “kia”.
