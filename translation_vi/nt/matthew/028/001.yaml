reference: Matthew 28:1
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ὀψὲ δὲ σαββάτων, τῇ ἐπιφωσκούσῃ εἰς μίαν σαββάτων, ἦλθεν ⸀Μαριὰμ ἡ Μαγδαληνὴ καὶ ἡ ἄλλη Μαρία θεωρῆσαι τὸν τάφον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/001.yaml
  text: After the Sabbath[a], as it was dawning toward the first day of the week, Mary Magdalene and the other Mary came to look at the tomb.
translation:
  language: vi
  text: Sau ngày Sa-bát[a], khi trời bắt đầu rạng sáng, vào ngày thứ nhất trong tuần, Ma-ri Ma-đơ-len và Ma-ri khác đến xem ngôi mộ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Vào cuối ngày Sa-bát, khi trời bắt đầu rạng sáng, vào ngày thứ nhất trong tuần.” Cụm từ Hy Lạp mở đầu có thể được hiểu là “sau ngày Sa-bát” hoặc “vào cuối ngày Sa-bát”.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ὀψὲ δὲ σαββάτων
  choice: Sau ngày Sa-bát
  rationale: ὀψέ đi với sở hữu cách có thể chỉ thời điểm sau một biến cố; trong mạch kể về sự phục sinh, cách hiểu tự nhiên là sau khi ngày Sa-bát kết thúc. σαββάτων có hình thức số nhiều nhưng ở đây được dùng theo lối thành ngữ để chỉ ngày Sa-bát. δέ chỉ tạo sự nối tiếp nhẹ nên không cần dịch thành một từ riêng trong tiếng Việt.
- source_word: τῇ ἐπιφωσκούσῃ
  choice: khi trời bắt đầu sáng
  rationale: Phân từ của ἐπιφώσκω ở đây tự nhiên nhất là nói đến ánh sáng ban mai đang xuất hiện; cách diễn đạt này rõ ràng và tự nhiên trong tiếng Việt.
- source_word: εἰς μίαν σαββάτων
  choice: hướng đến ngày thứ nhất trong tuần
  rationale: μίαν σαββάτων là cách nói thành ngữ chỉ ngày thứ nhất trong tuần; “hướng đến” phản ánh giới từ εἰς và giữ cấu trúc thời gian hơi khác thường của nguyên văn.
- source_word: ἦλθεν
  choice: đến
  rationale: Động từ ἔρχομαι trong lối kể chuyện này được chuyển tự nhiên là “đến”.
- source_word: Μαριὰμ ἡ Μαγδαληνὴ
  choice: Ma-ri Ma-đơ-len
  rationale: Tên riêng được phiên âm theo cách dùng tiếng Việt hiện đại, dễ nhận biết.
- source_word: ἡ ἄλλη Μαρία
  choice: Ma-ri kia
  rationale: ἄλλη phân biệt người này với Ma-ri Ma-đơ-len; “Ma-ri kia” tự nhiên hơn “Ma-ri khác” trong ngữ cảnh có hai người cùng tên.
- source_word: θεωρῆσαι
  choice: xem
  rationale: θεωρέω diễn tả việc chủ ý nhìn hoặc quan sát; “xem” giữ được ý này mà không cường điệu thành một cuộc kiểm tra chính thức.
- source_word: τὸν τάφον
  choice: ngôi mộ
  rationale: τάφος chỉ nơi chôn cất; “ngôi mộ” là cách tương đương rõ ràng, thông dụng trong tiếng Việt.
theological_decisions:
- issue: Cụm từ chỉ thời gian mở đầu trình thuật phục sinh
  choice: Dịch là “Sau ngày Sa-bát”, đặt sự việc sau khi ngày Sa-bát kết thúc và lúc trời bắt đầu sáng hướng đến ngày thứ nhất trong tuần.
  alternative: “Vào cuối ngày Sa-bát”
  rationale: Cụm ὀψὲ σαββάτων có thể được hiểu theo cả hai cách. Mạch thời gian chung nghiêng về nghĩa “sau ngày Sa-bát”, nhưng chú thích giữ lại cách hiểu thay thế để không xóa bỏ sự mơ hồ thật sự của tiếng Hy Lạp.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Bản dịch giữ cách diễn đạt thời gian có phần khác thường của nguyên văn bằng “hướng đến ngày thứ nhất trong tuần”, đồng thời dùng chú thích để bảo tồn sự mơ hồ của cụm mở đầu.
