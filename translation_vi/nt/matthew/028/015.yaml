revisions:
- from: Vậy, họ nhận số bạc và làm theo như đã được chỉ dẫn. Câu chuyện này được truyền rộng giữa người Do Thái cho đến ngày nay.[a]
  to: Vậy, họ nhận số bạc và làm như đã được chỉ dẫn. Câu chuyện này đã được lan truyền trong cộng đồng người Do Thái cho đến ngày nay.[a]
  rationale: Chỉnh sửa chỉ nhằm làm tiếng Việt tự nhiên hơn và làm rõ quan hệ giữa hành động lan truyền trong quá khứ với mốc “cho đến ngày nay.” Các lựa chọn về “số bạc,” “câu chuyện này,” và “người Do Thái” được giữ nguyên về nghĩa; không áp đặt một cách hiểu giáo phái hoặc mở rộng phạm vi của lời tường thuật.
