source:
  edition: SBLGNT
  text: οἱ δὲ λαβόντες ⸀τὰ ἀργύρια ἐποίησαν ὡς ἐδιδάχθησαν. Καὶ διεφημίσθη ὁ λόγος οὗτος παρὰ Ἰουδαίοις μέχρι τῆς σήμερον ⸀ἡμέρας.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/015.yaml
  text: So they took the silver and did as they had been instructed[a]. And this story has been spread among the Jews to this day.
translation:
  language: vi
  text: Vậy, họ nhận số bạc và làm như đã được chỉ dẫn. Câu chuyện này đã được lan truyền trong cộng đồng người Do Thái cho đến ngày nay.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “lời tường thuật này.” Từ Hy Lạp λόγος có thể mang nghĩa “lời”, “tin”, “lời tường thuật” hoặc “câu chuyện”, tùy ngữ cảnh.
    reason: lexical_alternative
lexical_decisions:
- source_word: λαβόντες
  choice: nhận
  rationale: Phân từ aorist của λαμβάνω có thể là “lấy” hoặc “nhận”. Vì câu trước nói các thượng tế trao tiền cho lính, “nhận” diễn đạt tự nhiên quan hệ cho–nhận trong ngữ cảnh.
- source_word: τὰ ἀργύρια
  choice: số bạc
  rationale: ἀργύρια chỉ bạc dùng làm tiền; “số bạc” giữ hình ảnh cụ thể của nguyên văn mà không xác định quá mức là loại đồng tiền nào.
- source_word: ἐποίησαν ὡς ἐδιδάχθησαν
  choice: làm theo như đã được chỉ dẫn
  rationale: Cụm này nói họ thực hiện điều đã được dặn phải nói; “được chỉ dẫn” tự nhiên hơn “được dạy” trong ngữ cảnh chỉ thị.
- source_word: διεφημίσθη
  choice: được truyền rộng
  rationale: Động từ chỉ việc một tin hay lời tường thuật được lan truyền rộng rãi. Cách dịch bị động giữ cấu trúc nguyên văn.
- source_word: ὁ λόγος οὗτος
  choice: câu chuyện này
  rationale: λόγος ở đây chỉ lời giải thích do lính phổ biến. “Câu chuyện” phù hợp ngữ cảnh kể chuyện, trong khi “lời tường thuật” vẫn là một khả năng chính đáng và được ghi ở chú thích.
- source_word: παρὰ Ἰουδαίοις
  choice: giữa người Do Thái
  rationale: παρά với cách dữ ở đây mang nghĩa “giữa/trong cộng đồng”. Cách dịch này nói về phạm vi lưu truyền của câu chuyện, không mở rộng thành nhận định về toàn thể người Do Thái.
- source_word: μέχρι τῆς σήμερον ἡμέρας
  choice: cho đến ngày nay
  rationale: Đây là thành ngữ chỉ sự tiếp diễn tới thời điểm tác giả viết; “cho đến ngày nay” trang trọng, rõ ràng và tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Cách dịch Ἰουδαίοις trong bối cảnh có nguy cơ bị hiểu thành lời quy kết chống người Do Thái
  choice: giữa người Do Thái
  alternative: giữa những người Giu-đê
  rationale: Trong câu này, trọng tâm là câu chuyện lưu truyền trong cộng đồng Do Thái, không phải căn tính địa lý riêng của dân Giu-đê. Bản dịch giữ nghĩa trực tiếp nhưng không thêm một lời quy kết rộng hơn điều trình thuật nói.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “nhận số bạc” để nối tự nhiên với hành động trao tiền ở câu trước; giữ thể bị động trong vế nói về sự lan truyền. Dấu chú thích [a] được đặt ngay sau câu có từ cần giải thích.
