revisions:
- from: 'Hãy mau đi nói với các môn đồ của Ngài rằng: ‘Ngài đã sống lại từ cõi chết. Kìa, Ngài đang đi trước các ngươi đến Ga-li-lê; tại đó các ngươi sẽ thấy Ngài.’ Này, ta đã nói cho các ngươi biết.'
  to: 'Hãy mau đi báo cho các môn đồ của Ngài rằng: ‘Ngài đã sống lại từ cõi chết, và kìa, Ngài đang đi trước các anh em đến Ga-li-lê; tại đó các anh em sẽ thấy Ngài.’ Này, ta đã nói cho các người biết.'
  rationale: Chỉnh «nói với» thành «báo cho» để câu tiếng Việt tự nhiên hơn. Thay đại từ trong lời nhắn bằng «các anh em» để chỉ rõ lời hứa về Ga-li-lê nhắm đến các môn đồ, đồng thời giữ ngôi hai số nhiều của nguyên ngữ. Giữ «các người» ở lời kết vì đây là lời thiên sứ trực tiếp nói với các phụ nữ, nhờ vậy phân biệt rõ hai nhóm người nghe.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T07:38:36Z'
review_pass:
  verdict: revise
  source_fidelity: Bản dịch truyền đạt đúng mệnh lệnh đi gấp, lời báo cho các môn đồ, sự sống lại, việc Ngài đi trước vào Ga-li-lê, lời hứa sẽ gặp Ngài tại đó, và lời xác nhận kết thúc. Tuy nhiên, «các ngươi» trong lời được truyền đạt dễ bị hiểu là các phụ nữ đang nghe thiên sứ, trong khi ὑμᾶς trong nội dung phải báo được hướng đến các môn đồ. Cần làm rõ người được nhắm đến mà vẫn giữ đại từ ngôi hai của lời nói trực tiếp.
  naturalness: «Hãy mau đi nói với» có thể hiểu được, nhưng «Hãy mau đi báo cho» tự nhiên và phù hợp hơn với một lời loan báo. «các anh em» là lối xưng hô hiện đại, trang trọng, tự nhiên hơn «các ngươi» trong lời nhắn dành cho các môn đồ.
  terminology: «đã sống lại từ cõi chết» diễn đạt tự nhiên Ἠγέρθη ἀπὸ τῶν νεκρῶν mà không nêu thêm tác nhân cho thể bị động. «đi trước» giữ đúng sắc thái của προάγει. Duy trì «Ngài» đối với Chúa Giê-su và «Ga-li-lê» theo cách viết tên riêng quen dùng.
  issues:
  - severity: medium
    issue: Quy chiếu của «các ngươi» trong lời trích dẫn không rõ
    rationale: Trong nguyên ngữ, lời này được bảo các phụ nữ truyền cho các môn đồ; «các ngươi» trong nội dung được truyền đạt hướng đến các môn đồ. Trong tiếng Việt, không có dấu hiệu chuyển người nghe trong câu trích dẫn, nên độc giả dễ quy đại từ này về các phụ nữ.
  - severity: low
    issue: «Hãy mau đi nói với» hơi kém tự nhiên
    rationale: «Hãy mau đi báo cho các môn đồ» diễn đạt mệnh lệnh πορευθεῖσαι εἴπατε tự nhiên hơn mà không đổi nghĩa.
  revised_text: 'Hãy mau đi báo cho các môn đồ của Ngài rằng: ‘Ngài đã sống lại từ cõi chết, và kìa, Ngài đang đi trước các anh em đến Ga-li-lê; tại đó các anh em sẽ thấy Ngài.’ Này, ta đã nói cho các người biết.'
