source:
  edition: SBLGNT
  text: καὶ ταχὺ πορευθεῖσαι εἴπατε τοῖς μαθηταῖς αὐτοῦ ὅτι Ἠγέρθη ἀπὸ τῶν νεκρῶν, καὶ ἰδοὺ προάγει ὑμᾶς εἰς τὴν Γαλιλαίαν, ἐκεῖ αὐτὸν ὄψεσθε· ἰδοὺ εἶπον ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/007.yaml
  text: And go quickly and tell his disciples, ‘He has been raised from the dead, and look, he is going ahead of you into Galilee. There you will see him.’ Look, I have told you.
translation:
  language: vi
  text: 'Hãy mau đi báo cho các môn đồ của Ngài rằng: ‘Ngài đã sống lại từ cõi chết, và kìa, Ngài đang đi trước các anh em đến Ga-li-lê; tại đó các anh em sẽ thấy Ngài.’ Này, ta đã nói cho các người biết.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἠγέρθη
  choice: đã sống lại
  rationale: Động từ ở thể bị động, theo nghĩa đen là ‘đã được khiến trỗi dậy’; ‘đã sống lại’ là cách nói tự nhiên trong tiếng Việt mà không xác định tác nhân vốn không được nêu rõ trong câu.
- source_word: προάγει
  choice: đang đi trước
  rationale: Giữ thì hiện tại và ý nghĩa đi trước để dẫn đường hoặc đến trước.
- source_word: ἰδού
  choice: Kìa / Này
  rationale: 'Dùng hai từ cảm thán tự nhiên theo ngữ cảnh: ‘Kìa’ hướng sự chú ý vào tin được công bố, còn ‘Này’ nhấn mạnh lời kết của thiên sứ.'
- source_word: ἀπὸ τῶν νεκρῶν
  choice: từ cõi chết
  rationale: Diễn đạt tự nhiên ý Ngài đã trỗi dậy khỏi tình trạng và phạm vi của những người chết.
theological_decisions:
- issue: Thể bị động của Ἠγέρθη
  choice: Ngài đã sống lại
  alternative: Ngài đã được khiến sống lại
  rationale: Bản dịch chính tránh lối diễn đạt gượng trong tiếng Việt, đồng thời không thêm tác nhân vào câu; ngữ pháp nguồn vẫn để ngỏ tác nhân.
- issue: Ý nghĩa của προάγει
  choice: Ngài đang đi trước các ngươi đến Ga-li-lê
  alternative: Ngài sẽ đến Ga-li-lê trước các ngươi
  rationale: Giữ sắc thái hiện tại và hình ảnh Ngài đi trước, thay vì thu hẹp câu chỉ còn nghĩa đến nơi sớm hơn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng ‘Ngài’ cho Chúa Giê-su; lời thiên sứ dùng cặp đại từ ‘ta/các ngươi’ để giữ sắc thái trang trọng của lời công bố. Không thêm chú thích vì các điểm ngữ nghĩa có thể được chuyển đạt đầy đủ trong chính văn.
