id: MAT.28.19
reference: Matthew 28:19
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: πορευθέντες ⸀οὖν μαθητεύσατε πάντα τὰ ἔθνη, ⸀βαπτίζοντες αὐτοὺς εἰς τὸ ὄνομα τοῦ πατρὸς καὶ τοῦ υἱοῦ καὶ τοῦ ἁγίου πνεύματος,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/019.yaml
  text: Therefore[a], go and make disciples of all the nations, baptizing them into the name of the Father and of the Son and of the Holy Spirit,
translation:
  language: vi
  text: Vậy nên, hãy đi và làm cho muôn dân trở nên môn đồ, báp-têm họ vào danh Cha, Con và Đức Thánh Linh,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “nhân danh Cha, Con và Đức Thánh Linh.” Tiếng Hy Lạp viết là “vào danh,” có thể nhấn mạnh việc bước vào mối liên hệ hoặc sự đồng nhất với danh ấy.
    reason: alternative_reading
lexical_decisions:
- source_word: πορευθέντες
  choice: hãy đi
  rationale: Phân từ bất định quá khứ đứng trước mệnh lệnh chính μαθητεύσατε và trong ngữ cảnh mang sắc thái hành động đi kèm mệnh lệnh. “Hãy đi” tự nhiên, giữ sức nặng của lời sai phái hơn “khi đang đi”.
- source_word: οὖν
  choice: vậy
  rationale: Nêu kết luận từ lời tuyên bố về mọi thẩm quyền của Đức Giê-su ở câu 18. “Vậy” ngắn gọn, tự nhiên và thể hiện rõ quan hệ suy luận.
- source_word: μαθητεύσατε
  choice: khiến ... trở thành môn đồ
  rationale: Động từ có nghĩa gây cho người khác trở thành môn đồ. Cách diễn đạt này giữ lực gây khiến và dễ hiểu trong tiếng Việt hiện đại.
- source_word: πάντα τὰ ἔθνη
  choice: muôn dân
  rationale: ἔθνη chỉ các dân tộc hoặc các dân. “Muôn dân” diễn đạt phạm vi phổ quát một cách tự nhiên, trang trọng, không thu hẹp thành riêng dân ngoại.
- source_word: βαπτίζοντες
  choice: làm phép báp-têm
  rationale: Giữ thuật ngữ quen thuộc của nghi thức Cơ Đốc mà không quyết định trước phương thức thực hiện như nhúng chìm hay rảy nước.
- source_word: εἰς τὸ ὄνομα
  choice: vào trong danh
  rationale: εἰς thường biểu thị hướng đi vào; “vào trong danh” giữ được ý niệm bước vào mối liên hệ hoặc sự đồng nhất, thay vì chỉ biểu thị thẩm quyền hay phương tiện.
- source_word: τοῦ πατρὸς καὶ τοῦ υἱοῦ καὶ τοῦ ἁγίου πνεύματος
  choice: của Cha, Con và Đức Thánh Linh
  rationale: Đây là ba tước hiệu thần linh cùng phụ thuộc vào danh từ số ít “danh”. Viết hoa cho thấy đây là các danh xưng riêng trong công thức làm phép báp-têm, mà không thêm lời giải thích thần học ngoài văn bản.
theological_decisions:
- issue: Cách dịch giới từ εἰς trong công thức làm phép báp-têm
  choice: vào trong danh
  alternative: nhân danh
  rationale: “Vào trong” bám sát hướng nghĩa thông thường của εἰς và bảo tồn sắc thái bước vào mối liên hệ hoặc sự đồng nhất, nhưng không áp đặt một học thuyết bí tích cụ thể. “Nhân danh” là cách nói truyền thống, tự nhiên trong tiếng Việt và được ghi ở chú thích như một khả năng dịch.
- issue: Cách hiểu và viết hoa Cha, Con và Đức Thánh Linh
  choice: Cha, Con và Đức Thánh Linh
  alternative: cha, con và thần khí thánh
  rationale: Cú pháp có một “danh” số ít theo sau bởi ba thành phần sở hữu phối hợp, trong một công thức làm phép báp-têm. Viết hoa phản ánh chức năng danh xưng thần linh của các từ này, không khai triển vượt quá câu Hy Lạp.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Muôn dân” giữ sắc thái phổ quát; “làm phép báp-têm” tránh quyết định phương thức nghi lễ. Dấu chú thích [a] được đặt ngay sau cụm từ mà chú thích giải thích.
