  rationale: Bản sửa thay các cách nói gượng theo từng chữ bằng tiếng Việt tự nhiên hơn, nhưng vẫn giữ mối liên hệ suy luận của οὖν, lực sai phái của πορευθέντες, nghĩa gây khiến của μαθητεύσατε, phạm vi phổ quát của πάντα τὰ ἔθνη, và hướng nghĩa của εἰς. Chú thích bảo tồn cách dịch truyền thống khả dĩ mà không quyết định một diễn giải bí tích cụ thể.
