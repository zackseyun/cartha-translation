  text: ἦν δὲ ἡ εἰδέα αὐτοῦ ⸀ὡς ἀστραπὴ καὶ τὸ ἔνδυμα αὐτοῦ λευκὸν ὡς χιών.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/003.yaml
  text: His appearance was like lightning[a], and his clothing white as snow.
translation:
  language: vi
  text: Diện mạo của vị ấy như tia chớp[a], và y phục trắng như tuyết.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “hình dạng” hoặc “vẻ ngoài” thay cho “diện mạo”.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: không dịch tách riêng
  rationale: Đây là liên từ nhẹ nối tiếp mạch kể; tiếng Việt không cần biểu đạt riêng ở đây.
- source_word: εἰδέα
  choice: diện mạo
  rationale: Chỉ vẻ bề ngoài có thể nhìn thấy; “diện mạo” tự nhiên, trang trọng và không thu hẹp nghĩa thành nét mặt.
- source_word: ὡς ἀστραπή
  choice: như chớp
  rationale: Giữ nguyên phép so sánh và diễn đạt gọn, tự nhiên trong tiếng Việt.
- source_word: ἔνδυμα
  choice: y phục
  rationale: Là từ khái quát về đồ mặc, không tự ý xác định đó là áo choàng hay một kiểu áo cụ thể.
- source_word: λευκὸν ὡς χιών
  choice: trắng như tuyết
  rationale: Giữ hình ảnh so sánh trực tiếp về màu trắng mà không thêm mức độ sáng không có trong nguyên văn.
theological_decisions:
- issue: Đối tượng của đại từ αὐτοῦ
  choice: Dùng “vị ấy”, chỉ thiên sứ được nói đến ngay trước đó.
  alternative: Có thể lặp rõ “thiên sứ” để tránh người đọc hiểu là Đức Giê-su.
  rationale: Tiền ngữ gần nhất trong ngữ cảnh là thiên sứ của Chúa ở câu 2. Bản dịch giữ cách dùng đại từ của tiếng Hy Lạp, đồng thời “vị ấy” phù hợp với một nhân vật thiên giới và không chèn thêm danh từ vào câu.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Cấu trúc song hành của hai phép so sánh được giữ lại; không thêm động từ “thì” ở vế sau vì câu tỉnh lược tự nhiên trong tiếng Việt.
