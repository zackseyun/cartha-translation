source:
  edition: SBLGNT
  text: καὶ ⸀ἀπελθοῦσαι ταχὺ ἀπὸ τοῦ μνημείου μετὰ φόβου καὶ χαρᾶς μεγάλης ἔδραμον ἀπαγγεῖλαι τοῖς μαθηταῖς αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/008.yaml
  text: And leaving the tomb quickly[a], with fear and great joy, they ran to report to his disciples.
translation:
  language: vi
  text: Họ vội rời khỏi ngôi mộ, vừa sợ hãi[a] vừa rất vui mừng, rồi chạy đi báo cho các môn đệ của Người.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “kính sợ”. Từ Hy Lạp ở đây cũng có thể hàm ý sự kinh sợ đầy tôn kính trong văn cảnh này.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπελθοῦσαι ταχὺ ἀπὸ τοῦ μνημείου
  choice: Họ vội rời khỏi ngôi mộ
  rationale: Phân từ bất định ἀπελθοῦσαι diễn tả việc rời đi, còn ταχύ diễn tả sự khẩn trương. Cách dịch này tự nhiên trong tiếng Việt và giữ rõ điểm xuất phát là ngôi mộ.
- source_word: μετὰ φόβου καὶ χαρᾶς μεγάλης
  choice: vừa sợ hãi vừa hết sức vui mừng
  rationale: Giữ nguyên sự đồng hiện và tương phản giữa φόβος và χαρὰ μεγάλη; cấu trúc “vừa… vừa…” diễn đạt tự nhiên hai trạng thái cùng đi với hành động.
- source_word: ἔδραμον
  choice: chạy đi
  rationale: Động từ bất định của τρέχω chỉ hành động chạy theo nghĩa trực tiếp, sống động hơn cách diễn ý là “vội vã”.
- source_word: ἀπαγγεῖλαι
  choice: báo
  rationale: Động từ nguyên mẫu chỉ mục đích của việc chạy. Nguyên văn không nêu tân ngữ trực tiếp, nên bản dịch cũng không thêm “việc ấy” hay nội dung cụ thể.
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: cho các môn đồ của Ngài
  rationale: μαθηταί là thuật ngữ quen thuộc chỉ những người học theo Chúa Giê-su; αὐτοῦ quy chiếu về Ngài trong văn cảnh.
theological_decisions:
- issue: Sự căng thẳng giữa sợ hãi và vui mừng trong phản ứng của các phụ nữ
  choice: vừa sợ hãi vừa hết sức vui mừng
  alternative: vừa kính sợ vừa hết sức vui mừng
  rationale: φόβος có thể bao hàm sự kính sợ trong văn cảnh này, nhưng bản văn đặt cảm xúc ấy cạnh niềm vui mà không giải nghĩa thêm. Dịch “sợ hãi” bảo toàn sự căng thẳng, còn chú thích nêu khả năng nghĩa khác.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Ngài” để quy chiếu về Chúa Giê-su; giữ “môn đồ” như thuật ngữ quen thuộc trong văn thuật Phúc Âm.
