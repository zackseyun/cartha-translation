  text: καὶ συναχθέντες μετὰ τῶν πρεσβυτέρων συμβούλιόν τε λαβόντες ἀργύρια ἱκανὰ ἔδωκαν τοῖς στρατιώταις
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/012.yaml
  text: And after gathering with the elders and taking counsel[a], they gave a considerable sum of silver to the soldiers,
translation:
  language: vi
  text: Sau khi họp với các trưởng lão và bàn bạc, họ đã đưa cho những người lính một khoản bạc đáng kể[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “một khoản tiền bằng bạc lớn.” Theo sát chữ, tiếng Hy Lạp nói đến “bạc đáng kể.”'
    reason: Làm rõ rằng ἀργύρια có thể chỉ tiền bằng bạc, đồng thời giữ mức độ của ἱκανὰ mà không cường điệu hóa.
lexical_decisions:
- source_word: συναχθέντες
  choice: Sau khi tụ họp
  rationale: Phân từ aorist diễn tả hành động xảy ra trước động từ chính; cách dịch này tự nhiên trong tiếng Việt và giữ được trình tự của câu Hy Lạp.
- source_word: μετὰ τῶν πρεσβυτέρων
  choice: với các trưởng lão
  rationale: μετά với sở hữu cách chỉ sự cùng tham gia; “trưởng lão” là cách gọi quen thuộc dành cho nhóm lãnh đạo này.
- source_word: συμβούλιόν τε λαβόντες
  choice: và cùng nhau bàn bạc
  rationale: Thành ngữ συμβούλιον λαμβάνω chỉ việc hội ý, bàn bạc để đi đến quyết định, chứ không đơn thuần là nhận lời khuyên.
- source_word: ἀργύρια ἱκανὰ
  choice: một khoản tiền bạc rất lớn
  rationale: ἀργύρια có thể chỉ bạc dùng làm tiền, còn ἱκανὰ ở đây nói đến số lượng đáng kể. Cách diễn đạt này vừa tự nhiên vừa giữ hình ảnh “bạc” của nguyên văn.
- source_word: ἔδωκαν
  choice: họ đưa cho
  rationale: δίδωμι có nghĩa cơ bản là cho; “đưa cho” phù hợp với hành động trao tiền trong ngữ cảnh.
- source_word: τοῖς στρατιώταις
  choice: những người lính
  rationale: στρατιώταις có nghĩa trực tiếp là binh lính; không đổi thành “lính canh” dù đó là nhiệm vụ của họ trong ngữ cảnh.
theological_decisions:
- issue: Chủ thể được ngầm hiểu của các động từ
  choice: “họ” tiếp nối các thượng tế ở câu trước
  alternative: một nhóm người không được xác định
  rationale: Các phân từ và động từ chính đều ở số nhiều giống đực, với chủ thể được tiếp nối từ Ma-thi-ơ 28:11. Bản dịch dùng đại từ “họ” thay vì tự ý lặp lại danh xưng “các thượng tế”.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. “Cùng nhau bàn bạc” diễn đạt tự nhiên sắc thái hội ý; dấu chú thích được đặt ngay sau cụm từ mà chú thích giải thích.
