- from: Sau khi tụ họp với các trưởng lão và cùng nhau bàn bạc, họ đưa cho những người lính một khoản tiền bạc rất lớn[a],
  to: Sau khi họp với các trưởng lão và bàn bạc, họ đã đưa cho những người lính một khoản bạc đáng kể[a],
  rationale: Sửa duy nhất mức độ của ἱκανὰ từ “rất lớn” thành “đáng kể”, phù hợp hơn với nghĩa Hy Lạp và bản tiếng Anh đối chiếu. Cấu trúc câu, chủ thể ngầm hiểu, các thuật ngữ chỉ nhóm người, và dấu neo chú thích đều được giữ nguyên về nghĩa.
