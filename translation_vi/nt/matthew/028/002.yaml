  to: Kìa, một trận động đất lớn xảy ra, vì một thiên sứ của Chúa từ trời xuống, tiến lại gần, lăn tảng đá ra và đang ngồi trên đó.
  rationale: 'Bản sửa bảo toàn trình tự và quan hệ cú pháp của nguyên văn: trận động đất được nêu trước; γάρ được dịch là «vì»; hai phân từ «từ trời xuống, tiến lại gần» được thể hiện riêng; hành động lăn đá và tư thế ngồi trên đá được giữ rõ. Không thêm diễn giải về thời điểm tuyệt đối của các hành động hay danh tính của «Chúa».'
  reviewer_model: gpt-5.6-terra
