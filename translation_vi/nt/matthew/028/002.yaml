id: MAT.28.2
reference: Matthew 28:2
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ σεισμὸς ἐγένετο μέγας· ἄγγελος γὰρ κυρίου καταβὰς ἐξ οὐρανοῦ ⸀καὶ προσελθὼν ἀπεκύλισε τὸν ⸀λίθον καὶ ἐκάθητο ἐπάνω αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/002.yaml
  text: And behold, there was a great earthquake, for an angel of the Lord had come down from heaven and came up and rolled away the stone and was sitting on it.
translation:
  language: vi
  text: Kìa, một trận động đất lớn xảy ra, vì một thiên sứ của Chúa từ trời xuống, tiến lại gần, lăn tảng đá ra và đang ngồi trên đó.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδού
  choice: Kìa
  rationale: Giữ lời dẫn gây chú ý của nguyên văn bằng một từ tự nhiên, trang trọng trong tiếng Việt.
- source_word: σεισμὸς ... μέγας
  choice: một trận động đất lớn
  rationale: Diễn đạt trực tiếp mức độ của σεισμός và μέγας theo cách nói tiếng Việt hiện đại.
- source_word: ἄγγελος ... κυρίου
  choice: một thiên sứ của Chúa
  rationale: Ἄγγελος trong ngữ cảnh là sứ giả thiên giới; κυρίου không có mạo từ và được giữ theo cách diễn đạt quen thuộc mà không xác định thêm ngoài nguyên văn.
- source_word: προσελθών
  choice: đến
  rationale: Phân từ chỉ việc tiến đến hoặc lại gần; 'đến' tự nhiên và không thêm một đích đến vốn không được nêu rõ.
- source_word: ἀπεκύλισε
  choice: lăn ... ra
  rationale: Giữ hình ảnh cụ thể của động tác lăn tảng đá khỏi vị trí của nó.
- source_word: ἐκάθητο ἐπάνω αὐτοῦ
  choice: ngồi lên trên
  rationale: Thể hiện hành động đang ở tư thế ngồi trên chính tảng đá; đại từ được lược theo tiếng Việt vì đối tượng đã rõ ngay trước đó.
theological_decisions:
- issue: Quan hệ thời gian giữa việc thiên sứ xuống, đến, lăn đá và ngồi
  choice: từ trời xuống, đến lăn tảng đá ra rồi ngồi lên trên
  alternative: đã từ trời xuống, tiến lại gần, lăn tảng đá ra và đang ngồi trên đó
  rationale: Các phân từ aorist và động từ chính imperfect cho thấy chuỗi hành động dẫn tới tư thế ngồi; bản dịch giữ trình tự mà không áp đặt rằng việc xuống trời xảy ra từ trước trận động đất.
- issue: Cách hiểu 'Chúa' trong ἄγγελος κυρίου
  choice: thiên sứ của Chúa
  alternative: thiên sứ của Đức Chúa Trời
  rationale: Giữ cách gọi κύριος của nguyên văn, không tự ý xác định danh xưng thần học cụ thể hơn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Kìa” để giữ sắc thái trình thuật đột ngột; câu được sắp xếp tự nhiên trong tiếng Việt nhưng vẫn bảo toàn quan hệ nguyên nhân do γάρ biểu thị.
