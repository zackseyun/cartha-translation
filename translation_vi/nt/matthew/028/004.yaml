  text: ἀπὸ δὲ τοῦ φόβου αὐτοῦ ἐσείσθησαν οἱ τηροῦντες καὶ ἐγενήθησαν ⸀ὡς νεκροί.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/004.yaml
  text: And from fear of him the guards shook and became like dead men[a].
translation:
  language: vi
  text: Vì sợ vị ấy, những người lính canh run rẩy và trở nên như người chết.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Do khiếp sợ vị ấy, những người lính canh run rẩy.”'
    reason: Nêu cách diễn đạt khác cho quan hệ nguyên nhân của ἀπό và sắc thái có thể mạnh hơn của φόβος.
lexical_decisions:
- source_word: ἀπὸ δὲ τοῦ φόβου αὐτοῦ
  choice: Vì sợ vị ấy
  rationale: ἀπό với sở hữu cách ở đây diễn tả nguyên nhân. “Vì sợ” tự nhiên trong tiếng Việt và cho thấy phản ứng của lính canh phát sinh do nỗi sợ vị thiên sứ được nhắc đến ngay trước đó. δέ là liên từ nhẹ trong mạch kể nên không nhất thiết phải dịch riêng.
- source_word: ἐσείσθησαν
  choice: run rẩy
  rationale: Dạng bị động của σείω có thể hiểu sát là “bị lay động”, nhưng trong phản ứng của con người trước nỗi sợ, “run rẩy” diễn đạt tự nhiên và chính xác.
- source_word: οἱ τηροῦντες
  choice: những người lính canh
  rationale: Nguyên văn là “những người đang canh giữ”; theo ngữ cảnh, đây là những người lính được giao canh mộ. Cách dịch này rõ nghĩa và tự nhiên.
- source_word: ἐγενήθησαν
  choice: trở nên
  rationale: γίνομαι diễn tả sự chuyển sang một trạng thái mới; “trở nên” giữ được sắc thái thay đổi ấy.
- source_word: ὡς νεκροί
  choice: như người chết
  rationale: ὡς đánh dấu phép so sánh, không khẳng định họ thực sự đã chết. “Như người chết” giữ nguyên sự so sánh và tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Đối tượng được đại từ αὐτοῦ chỉ đến
  choice: “vị ấy” chỉ vị thiên sứ được mô tả ở câu trước
  alternative: Hiểu rộng hơn là biến cố từ trời nói chung
  rationale: Tiền ngữ gần nhất là vị thiên sứ có diện mạo như chớp. Dùng “vị ấy” giữ quy chiếu cá nhân của đại từ mà không thêm cách giải thích vào chính văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Vị ấy” tránh cách gọi suồng sã đối với nhân vật thiên sứ; “những người lính canh” làm rõ chức năng theo ngữ cảnh. Dấu chú thích [a] được đặt ngay sau câu.
