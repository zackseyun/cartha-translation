id: MAT.6.32
reference: Matthew 6:32
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: πάντα γὰρ ταῦτα τὰ ἔθνη ⸀ἐπιζητοῦσιν· οἶδεν γὰρ ὁ πατὴρ ὑμῶν ὁ οὐράνιος ὅτι χρῄζετε τούτων ἁπάντων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/032.yaml
  text: For the Gentiles eagerly seek all these things; for your heavenly Father knows that you need all these things.
translation:
  language: vi
  text: Vì dân ngoại[a] mải miết tìm kiếm[b] tất cả những điều ấy; vì Cha trên trời của anh em biết rằng anh em cần tất cả những điều ấy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “các dân” hoặc “người ngoại đạo”. Từ Hy Lạp có thể chỉ các dân nói chung, nhưng ở đây có lẽ nói đến những người ở ngoài dân giao ước.
    reason: alternative_reading
  - marker: b
    text: Cũng có thể dịch là “tìm kiếm” hoặc “theo đuổi”. Động từ này gợi ý sự tìm kiếm tha thiết hoặc dai dẳng.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ ἔθνη
  choice: dân ngoại
  rationale: Trong ngữ cảnh này, cụm từ chỉ những người ngoài dân giao ước, đối lập với các môn đồ của Đức Giê-su. “Dân ngoại” tự nhiên trong tiếng Việt và giữ được nét phân biệt lịch sử-xã hội mà không thêm sắc thái miệt thị.
- source_word: ἐπιζητοῦσιν
  choice: mải miết tìm kiếm
  rationale: Động từ ἐπιζητέω diễn tả sự tìm kiếm tha thiết hoặc dai dẳng. “Mải miết tìm kiếm” truyền đạt sắc thái ấy trong tiếng Việt hiện đại mà không đẩy nghĩa đến mức “tranh đấu để đạt được”.
- source_word: ὁ πατὴρ ὑμῶν ὁ οὐράνιος
  choice: Cha trên trời của anh em
  rationale: Cách diễn đạt này giữ cả quan hệ sở hữu “của anh em” lẫn đặc tính thuộc trời, đồng thời tự nhiên và trang trọng trong tiếng Việt.
- source_word: οἶδεν
  choice: biết
  rationale: Dù có hình thái hoàn thành, οἶδα mang nghĩa hiện tại ở đây; “biết” là cách dịch trực tiếp và tự nhiên.
- source_word: χρῄζετε
  choice: anh em cần
  rationale: “Cần” diễn đạt rõ ràng, hiện đại ý nghĩa của χρῄζω, không dùng cấu trúc cổ hoặc nặng nề.
- source_word: πάντα γὰρ ταῦτα ... τούτων ἁπάντων
  choice: tất cả những điều ấy ... tất cả những điều ấy
  rationale: Giữ nguyên sự lặp lại có chủ ý trong tiếng Hy Lạp để bảo toàn điểm nhấn của câu.
- source_word: γὰρ ... γὰρ
  choice: vì ... vì
  rationale: Giữ cả hai liên từ giải thích nhằm phản ánh mạch lập luận của nguyên văn, dù tiếng Việt trau chuốt có thể lược hoặc biến đổi liên từ thứ hai.
theological_decisions:
- issue: Đối tượng được τὰ ἔθνη chỉ đến trong lời dạy của Đức Giê-su
  choice: dân ngoại
  alternative: các dân; người ngoại đạo
  rationale: Ngữ cảnh tạo sự tương phản giữa các môn đồ biết Cha trên trời và những người ở ngoài cộng đồng giao ước. “Dân ngoại” giữ được sự phân biệt ấy mà không biến câu thành một phán xét tuyệt đối về mọi người không phải Do Thái.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh em” cho đại từ số nhiều ὑμῶν/χρῄζετε, phù hợp lời Đức Giê-su nói với các môn đồ. Giữ phép lặp và hai mệnh đề giải thích của nguyên văn.
