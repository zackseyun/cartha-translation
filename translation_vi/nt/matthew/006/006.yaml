id: MAT.6.6
reference: Matthew 6:6
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: σὺ δὲ ὅταν προσεύχῃ, εἴσελθε εἰς τὸ ταμεῖόν σου καὶ κλείσας τὴν θύραν σου πρόσευξαι τῷ πατρί σου τῷ ἐν τῷ κρυπτῷ· καὶ ὁ πατήρ σου ὁ βλέπων ἐν τῷ κρυπτῷ ἀποδώσει ⸀σοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/006.yaml
  text: But when you pray[a], go into your inner room, and after shutting your door, pray to your Father who is in secret; and your Father, who sees in secret[b], will reward you.
translation:
  language: vi
  text: Nhưng khi con cầu nguyện, hãy vào phòng riêng của con[a], đóng cửa lại, rồi cầu nguyện cùng Cha của con, Đấng ở nơi kín đáo; và Cha của con, Đấng thấy trong nơi kín đáo, sẽ ban thưởng cho con[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “phòng phía trong”, “phòng kín” hoặc “phòng chứa đồ”. Từ Hy Lạp chỉ một căn phòng bên trong dùng để cất giữ đồ đạc hoặc có sự riêng tư.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “sẽ báo đáp con” hoặc “sẽ trả lại cho con”. Động từ Hy Lạp có thể mang nghĩa trả lại, báo đáp hoặc ban thưởng, tùy ngữ cảnh.
    reason: lexical_alternative
lexical_decisions:
- source_word: σὺ δὲ
  choice: Nhưng ... con
  rationale: Đại từ được nêu rõ cùng δέ tạo thế tương phản với những kẻ đạo đức giả ở câu trước. “Nhưng” và đại từ “con” giữ được sự chuyển hướng nhấn mạnh mà vẫn tự nhiên trong tiếng Việt.
- source_word: ὅταν προσεύχῃ
  choice: khi con cầu nguyện
  rationale: ὅταν đi với thể giả định diễn tả hoàn cảnh có tính khái quát hoặc lặp lại. “Khi con cầu nguyện” tự nhiên và không biến lời này thành giả định rằng người nghe có thể chẳng bao giờ cầu nguyện.
- source_word: εἴσελθε
  choice: hãy vào
  rationale: Mệnh lệnh aorist kêu gọi thực hiện hành động đi vào; “hãy vào” trực tiếp, rõ ràng và phù hợp văn phong khuyên dạy.
- source_word: ταμεῖόν
  choice: phòng kín
  rationale: ταμεῖον chỉ một căn phòng phía trong, thường dùng làm nơi cất giữ hoặc nơi riêng tư. “Phòng kín” nhấn mạnh không gian tách khỏi ánh nhìn công khai mà không gợi sai nghĩa hiện đại của “tủ”.
- source_word: κλείσας τὴν θύραν σου
  choice: đóng cửa lại rồi
  rationale: Phân từ aorist diễn tả hành động xảy ra trước mệnh lệnh chính. Cấu trúc “đóng ... rồi” giữ rõ trình tự và tự nhiên trong tiếng Việt.
- source_word: πρόσευξαι
  choice: cầu nguyện
  rationale: Đây là cách dịch trực tiếp, thông dụng và trang trọng vừa phải của προσεύχομαι.
- source_word: τῷ πατρί σου
  choice: với Cha của con
  rationale: Nguyên văn chỉ nói “Cha của con”, không thêm “ở trên trời”. Viết hoa “Cha” giúp nhận rõ đây là cách gọi Đức Chúa Trời trong ngữ cảnh, nhưng không diễn giải thêm.
- source_word: τῷ ἐν τῷ κρυπτῷ
  choice: Đấng ở nơi kín đáo
  rationale: Cách dịch này giữ sắc thái kín giấu và khả năng hiểu theo nơi chốn của cụm Hy Lạp, đồng thời tránh giải thích quá mức là “vô hình” hay chỉ “ở riêng tư”.
- source_word: ὁ βλέπων ἐν τῷ κρυπτῷ
  choice: Đấng thấy nơi kín đáo
  rationale: Giữ lại sự lặp từ với vế trước và sự cô đọng của nguyên văn. Câu không tự ý thêm tân ngữ như “những việc con làm”.
- source_word: ἀποδώσει σοι
  choice: sẽ ban thưởng cho con
  rationale: ἀποδίδωμι có thể mang nghĩa trả lại, báo đáp hoặc ban thưởng. Trong mạch văn về sự đáp lại của Cha đối với lòng sùng kính không phô trương, “ban thưởng” diễn đạt nghĩa tích cực mà không xác định phần thưởng là gì.
theological_decisions:
- issue: Ý nghĩa của cụm lặp lại ἐν τῷ κρυπτῷ
  choice: Dịch nhất quán là “nơi kín đáo” cho cả sự hiện diện của Cha và việc Ngài thấy.
  alternative: “trong chỗ kín nhiệm”, “trong nơi riêng tư”, hoặc ở vế sau là “những gì được làm kín đáo”
  rationale: Nguyên văn nhấn mạnh điều kín giấu đối lập với sự phô bày công khai. Giữ cách diễn đạt gần như nhau bảo toàn phép lặp và không quyết định thay người đọc rằng cụm này hoàn toàn chỉ nơi chốn hay hoàn toàn chỉ cách thức.
- issue: Cách dịch πατήρ khi chỉ về Đức Chúa Trời
  choice: Cha
  alternative: Cha trên trời hoặc Đức Chúa Cha
  rationale: Chúa Giê-su trực tiếp dùng danh xưng “Cha” trong câu này. Không thêm “trên trời” hay một tước hiệu thần học vốn không có trong nguyên văn.
- issue: Tính chất của sự đáp lại trong ἀποδώσει
  choice: ban thưởng
  alternative: báo đáp hoặc hoàn trả
  rationale: “Ban thưởng” phù hợp ngữ cảnh tích cực, nhưng chú thích bảo lưu phạm vi nghĩa rộng hơn của động từ và không xác định hình thức hay thời điểm của phần thưởng.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “con” số ít để phản ánh đại từ số ít trong nguyên văn và quan hệ Cha–con trong lời dạy. Nhịp câu giữ sự tương phản, trình tự hành động và phép lặp về điều kín đáo; tránh các từ cổ như “phòng kín nhiệm” và tránh thêm nội dung không có trong bản Hy Lạp.
