  source_fidelity: Bản nháp truyền đạt đúng mạch tương phản, mệnh lệnh vào một không gian riêng tư, đóng cửa, cầu nguyện với Cha, và lời hứa Ngài sẽ ban thưởng. Tuy nhiên, “phòng kín” trong tiếng Việt hiện đại có thể chỉ một phòng bị đóng/kín hoặc một “phòng bí mật”, chưa phản ánh rõ bằng “phòng riêng” nghĩa phòng phía trong, riêng tư của ταμεῖον. Cụm “Đấng thấy nơi kín đáo” cũng cần giới từ “trong” để diễn đạt rõ chức năng của ἐν τῷ κρυπτῷ.
