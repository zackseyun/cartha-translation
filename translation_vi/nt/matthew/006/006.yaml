revisions:
- from: Nhưng khi con cầu nguyện, hãy vào phòng kín của mình[a], đóng cửa lại rồi cầu nguyện với Cha của con, Đấng ở nơi kín đáo; và Cha của con, Đấng thấy nơi kín đáo, sẽ ban thưởng cho con[b].
  to: Nhưng khi con cầu nguyện, hãy vào phòng riêng của con[a], đóng cửa lại, rồi cầu nguyện cùng Cha của con, Đấng ở nơi kín đáo; và Cha của con, Đấng thấy trong nơi kín đáo, sẽ ban thưởng cho con[b].
