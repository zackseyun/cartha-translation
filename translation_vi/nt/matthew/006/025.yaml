revisions:
- from: 'Vì vậy, tôi nói với anh em: đừng lo lắng cho sự sống mình[a], rằng sẽ ăn gì, cũng đừng lo cho thân thể mình, rằng sẽ mặc gì. Chẳng phải sự sống quý hơn thức ăn, và thân thể quý hơn quần áo sao?'
  to: 'Vì vậy, tôi nói với anh em: đừng lo lắng về mạng sống mình: sẽ ăn gì; cũng đừng lo lắng về thân thể mình: sẽ mặc gì. Chẳng phải mạng sống quan trọng hơn thức ăn, và thân thể quan trọng hơn quần áo sao?'
  rationale: Đã thay cấu trúc có “rằng” bằng cách diễn đạt trực tiếp và song song, đổi “sự sống” thành “mạng sống” để chỉ ψυχή theo ngữ cảnh nuôi sống, và đổi “quý hơn” thành “quan trọng hơn” để truyền đạt chính xác hơn lực so sánh của πλεῖον. Chú thích bảo lưu lựa chọn từ vựng “linh hồn” mà không áp đặt một cách hiểu thần học.
  reviewer_model: gpt-5.6-terra
