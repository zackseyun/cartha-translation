id: MAT.6.25
reference: Matthew 6:25
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Διὰ τοῦτο λέγω ὑμῖν· μὴ μεριμνᾶτε τῇ ψυχῇ ὑμῶν τί ⸀φάγητε, μηδὲ τῷ σώματι ὑμῶν τί ἐνδύσησθε· οὐχὶ ἡ ψυχὴ πλεῖόν ἐστι τῆς τροφῆς καὶ τὸ σῶμα τοῦ ἐνδύματος;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/025.yaml
  text: Therefore I tell you[a], do not worry about your life, what you will eat, or about your body, what you will wear. Is not life more than food, and the body than clothing?
translation:
  language: vi
  text: 'Vì vậy, tôi nói với anh em: đừng lo lắng về mạng sống mình: sẽ ăn gì; cũng đừng lo lắng về thân thể mình: sẽ mặc gì. Chẳng phải mạng sống quan trọng hơn thức ăn, và thân thể quan trọng hơn quần áo sao?'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: Vì vậy
  rationale: Diễn tả kết luận rút ra từ lời dạy ngay trước đó, đồng thời tự nhiên trong tiếng Việt hiện đại.
- source_word: μεριμνᾶτε
  choice: đừng lo lắng
  rationale: Chỉ sự lo âu, bận tâm về nhu cầu đời sống; cách diễn đạt này rõ ràng và thông dụng.
- source_word: ψυχῇ
  choice: sự sống
  rationale: Trong ngữ cảnh ăn uống và sự đối chiếu với thân thể, từ này nói đến sự sống của con người hơn là riêng phần linh hồn.
- source_word: τί φάγητε
  choice: rằng sẽ ăn gì
  rationale: Giữ nội dung của câu hỏi gián tiếp hướng về tương lai; 'rằng' giúp gắn rõ điều người ta lo với 'sự sống mình'.
- source_word: σώματι
  choice: thân thể
  rationale: Chỉ thân thể vật chất và tạo sắc thái trang trọng, tự nhiên trong văn Kinh Thánh tiếng Việt.
- source_word: τί ἐνδύσησθε
  choice: rằng sẽ mặc gì
  rationale: Diễn đạt tự nhiên hành động mặc quần áo và giữ hướng tương lai của mối lo.
- source_word: οὐχὶ
  choice: Chẳng phải ... sao?
  rationale: Thể hiện câu hỏi tu từ mong đợi câu trả lời khẳng định.
- source_word: πλεῖόν
  choice: quý hơn
  rationale: Trong câu hỏi tu từ, từ so sánh không chỉ nói đến số lượng mà đến tầm quan trọng hay giá trị; 'quý hơn' tự nhiên trong tiếng Việt nhưng không biến câu thành một định giá vật chất.
- source_word: τροφῆς
  choice: thức ăn
  rationale: Chỉ thực phẩm nuôi sống con người; đây là từ thông dụng và phù hợp với ngữ cảnh.
- source_word: ἐνδύματος
  choice: quần áo
  rationale: Chỉ chung những gì người ta mặc; cách nói hiện đại và dễ hiểu hơn 'y phục'.
theological_decisions:
- issue: Ý nghĩa của ψυχή trong lời dạy của Chúa Giê-su
  choice: Dịch là 'sự sống'
  alternative: linh hồn
  rationale: Ngữ cảnh trực tiếp nói đến ăn uống, thân thể và quần áo, nên ψυχή ở đây chỉ sự sống của con người, không xác định riêng một phần phi vật chất. Chú thích vẫn bảo lưu khả năng từ vựng 'linh hồn'.
- issue: Sắc thái của πλεῖόν trong câu hỏi tu từ
  choice: Dịch là 'quý hơn'
  alternative: nhiều hơn; lớn hơn
  rationale: Ý chính là sự sống và thân thể vượt quá thức ăn và quần áo về tầm quan trọng. 'Quý hơn' truyền đạt quan hệ ấy tự nhiên mà không thêm một hệ thống thần học.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng 'anh em' cho ὑμῖν trong bối cảnh Chúa Giê-su nói với các môn đồ; giữ cấu trúc song song giữa sự sống/thức ăn và thân thể/quần áo, cùng lực của câu hỏi tu từ.
