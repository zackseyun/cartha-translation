  text: σοῦ δὲ ποιοῦντος ἐλεημοσύνην μὴ γνώτω ἡ ἀριστερά σου τί ποιεῖ ἡ δεξιά σου,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/003.yaml
  text: But when you give to the needy[a], do not let your left hand know what your right hand is doing,
translation:
  language: vi
  text: Nhưng khi con bố thí[a], đừng để tay trái biết tay phải đang làm gì.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “làm việc cứu tế”; từ Hy Lạp chỉ việc giúp đỡ người nghèo hoặc người thiếu thốn bằng vật chất.
    reason: lexical_alternative
lexical_decisions:
- source_word: σοῦ δὲ ποιοῦντος
  choice: Nhưng khi con bố thí
  rationale: Kết cấu sở hữu cách tuyệt đối cùng δέ tạo sự tương phản với lời dạy trước đó; “Nhưng khi con…” tự nhiên trong tiếng Việt. ποιέω kết hợp với ἐλεημοσύνην mang nghĩa thực hiện việc bố thí.
- source_word: ἐλεημοσύνην
  choice: bố thí
  rationale: Từ này chỉ việc giúp đỡ bằng vật chất cho người nghèo hoặc thiếu thốn. “Bố thí” ngắn gọn, quen thuộc và giữ được ý niệm về hành vi cứu tế; chú thích nêu cách diễn đạt rộng hơn để tránh hiểu sai sắc thái.
- source_word: μὴ γνώτω
  choice: đừng để ... biết
  rationale: Mệnh lệnh ngôi thứ ba đi với μή được chuyển thành lời cấm tự nhiên trong tiếng Việt, đồng thời giữ nguyên phép nhân hóa hai bàn tay.
- source_word: ἡ ἀριστερά σου
  choice: tay trái
  rationale: Bản dịch trực tiếp bảo tồn hình ảnh và thế đối xứng đáng nhớ của câu nói.
- source_word: τί ποιεῖ ἡ δεξιά σου
  choice: tay phải đang làm gì
  rationale: Cách diễn đạt này thể hiện tự nhiên hành động đang diễn ra của động từ hiện tại ποιεῖ và giữ nguyên hình ảnh trong nguyên văn.
theological_decisions:
- issue: Ý nghĩa lời nói về tay trái và tay phải
  choice: Giữ nguyên hình ảnh như lời kêu gọi bố thí kín đáo, không phô trương bản thân.
  alternative: Diễn giải thành lời dạy chung về sự khiêm nhường, hoặc thành lệnh tuyệt đối cấm mọi hình thức làm từ thiện công khai.
  rationale: Nguyên văn dùng phép nhân hóa và lối nói cường điệu. Giữ nguyên hình ảnh bảo tồn sức gợi và không áp đặt một quy định giáo lý chặt hơn điều câu này trực tiếp nói.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Đại từ “con” phù hợp với lời Chúa Giê-su trực tiếp dạy người nghe trong ngữ cảnh; hình ảnh hai bàn tay được giữ nguyên. Dấu chú thích [a] đặt ngay sau cụm từ liên quan.
