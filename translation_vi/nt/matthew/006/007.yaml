source:
  edition: SBLGNT
  text: Προσευχόμενοι δὲ μὴ βατταλογήσητε ὥσπερ οἱ ἐθνικοί, δοκοῦσιν γὰρ ὅτι ἐν τῇ πολυλογίᾳ αὐτῶν εἰσακουσθήσονται·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/007.yaml
  text: And when you pray[a], do not heap up empty words like the Gentiles[b], for they think that they will be heard because of their many words.
translation:
  language: vi
  text: Khi cầu nguyện, anh em đừng lải nhải những lời sáo rỗng như dân ngoại[a], vì họ tưởng rằng nhờ nói nhiều, mình sẽ được lắng nghe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “như người ngoại giáo.” Nguyên văn Hy Lạp chỉ dân ngoại, tức các dân ở ngoài dân giao ước.
    reason: lexical_alternative
lexical_decisions:
- source_word: Προσευχόμενοι δὲ
  choice: Khi cầu nguyện
  rationale: Phân từ mang chức năng trạng ngữ, tự nhiên nhất trong tiếng Việt là mở đầu hoàn cảnh của mệnh lệnh bằng “Khi cầu nguyện”; δέ nối tiếp lời dạy và không cần dịch riêng trong tiếng Việt.
- source_word: μὴ βατταλογήσητε
  choice: đừng lải nhải những lời sáo rỗng
  rationale: Động từ hiếm này chỉ lời nói dài dòng, máy móc hoặc rỗng nghĩa; cách dịch tránh hàm ý rằng mọi sự lặp lại chân thành trong cầu nguyện đều bị cấm.
- source_word: ὥσπερ οἱ ἐθνικοί
  choice: như dân ngoại
  rationale: Trong bối cảnh Do Thái, từ này chỉ những dân ngoài dân giao ước; “dân ngoại” là cách gọi quen thuộc, trực tiếp và ít diễn giải hơn “người ngoại giáo”.
- source_word: δοκοῦσιν
  choice: họ tưởng rằng
  rationale: Diễn đạt nhận định sai lầm hoặc giả định của họ một cách tự nhiên trong tiếng Việt.
- source_word: ἐν τῇ πολυλογίᾳ αὐτῶν
  choice: nhờ nói nhiều
  rationale: Cụm giới từ nêu cơ sở mà họ cho là khiến lời cầu nguyện được nghe; “nhờ” thể hiện rõ phương tiện hoặc căn cứ bị lầm tưởng.
- source_word: εἰσακουσθήσονται
  choice: sẽ được nhậm lời
  rationale: Động từ bị động mang sắc thái được nghe đến một cách thuận tình. “Được nhậm lời” là cách diễn đạt trang trọng, quen thuộc trong ngữ cảnh cầu nguyện, nhưng không nói rõ lời cầu xin sẽ được đáp ứng theo cách nào.
theological_decisions:
- issue: Đức Giê-su cấm mọi sự lặp lại trong cầu nguyện hay cấm lời cầu nguyện rỗng tuếch, dài dòng
  choice: Dịch βατταλογήσητε là “lải nhải những lời sáo rỗng”, nhấn mạnh sự dài dòng vô nghĩa hoặc máy móc.
  alternative: “đừng nói lặp đi lặp lại cách vô nghĩa” hoặc “đừng lảm nhảm”
  rationale: Cách dịch giữ sức nặng của động từ hiếm nhưng không biến câu này thành lời cấm mọi sự lặp lại chân thành. Trọng tâm là quan niệm sai rằng nhiều lời tự nó sẽ khiến Đức Chúa Trời lắng nghe.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh em” theo số nhiều ngầm có trong động từ Hy Lạp. “Lải nhải” đủ mạnh để diễn tả lời nói dài dòng, máy móc; kết hợp với “những lời sáo rỗng” để tránh sắc thái chỉ đơn thuần nói nhiều. Dấu chú thích [a] được đặt ngay sau cụm từ liên quan.
