id: MAT.6.10
reference: Matthew 6:10
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐλθέτω ἡ βασιλεία σου, γενηθήτω τὸ θέλημά σου, ὡς ἐν οὐρανῷ καὶ ⸀ἐπὶ γῆς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/010.yaml
  text: May your kingdom come; may your will be done[a], as in heaven, so also on earth.
translation:
  language: vi
  text: Nguyện vương quốc của Cha đến; nguyện ý Cha được thực hiện[a], dưới đất cũng như trên trời.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc có thể hiểu: “Nguyện vương quốc của Cha đến; nguyện ý Cha được thực hiện, dưới đất cũng như trên trời,” trong đó “dưới đất cũng như trên trời” áp dụng cho cả hai lời cầu xin.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐλθέτω
  choice: Nguyện ... đến
  rationale: Động từ mệnh lệnh bất định chủ động, ngôi thứ ba số ít, diễn đạt lời cầu xin hướng lên Đức Chúa Trời. “Nguyện ... đến” tự nhiên và trang trọng trong lời cầu nguyện tiếng Việt.
- source_word: βασιλεία
  choice: vương quốc
  rationale: Từ này có thể chỉ vương quốc hoặc quyền cai trị. “Vương quốc” phù hợp với cách dùng trong Ma-thi-ơ và vẫn hàm chứa vương quyền cai trị của Đức Chúa Trời.
- source_word: γενηθήτω
  choice: nguyện ... được thực hiện
  rationale: Động từ mệnh lệnh bất định thụ động, ngôi thứ ba số ít. Khi đi với θέλημα, cụm này tự nhiên mang nghĩa ý muốn được thực hiện hoặc thành sự.
- source_word: θέλημα
  choice: ý
  rationale: Chỉ điều một người muốn, mong ước hoặc định làm. “Ý Cha” là cách diễn đạt ngắn gọn, tự nhiên trong ngữ cảnh cầu nguyện và không xác định quá mức là ý muốn, ước muốn hay mục đích.
- source_word: ὡς
  choice: như
  rationale: Dẫn vào sự so sánh; trong cấu trúc tiếng Việt, “dưới đất cũng như trên trời” diễn đạt tự nhiên quan hệ so sánh của câu Hy Lạp.
- source_word: ἐν οὐρανῷ
  choice: trên trời
  rationale: Chỉ cõi trời; “trên trời” là cách nói thông dụng và phù hợp với thế đối xứng trời–đất trong tiếng Việt.
- source_word: ἐπὶ γῆς
  choice: dưới đất
  rationale: ἐπί với sở hữu cách mang nghĩa “trên đất/trên mặt đất.” Trong cặp đối xứng tiếng Việt “trên trời–dưới đất,” “dưới đất” tự nhiên và ở đây chỉ trần thế, không phải bên dưới mặt đất.
- source_word: καὶ
  choice: cũng
  rationale: Trong cấu trúc so sánh ὡς ... καὶ ..., καί hoàn tất ý “cũng như,” được thể hiện tự nhiên bằng “dưới đất cũng như trên trời.”
theological_decisions:
- issue: Phạm vi bổ nghĩa của cụm ὡς ἐν οὐρανῷ καὶ ἐπὶ γῆς
  choice: 'Trong chính văn, cụm so sánh được gắn gần nhất với lời cầu xin thứ hai: “nguyện ý Cha được thực hiện ... dưới đất cũng như trên trời.”'
  alternative: 'Có thể hiểu “dưới đất cũng như trên trời” áp dụng cho cả hai lời cầu xin: vương quốc của Cha đến và ý Cha được thực hiện.'
  rationale: Dấu câu trong các ấn bản Hy Lạp hiện đại thuộc quyết định biên tập. Cú pháp cho phép bàn luận về phạm vi của cụm so sánh; cách gắn với mệnh đề gần nhất là tự nhiên nhất, nhưng khả năng áp dụng cho cả hai lời cầu xin cần được bảo lưu trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu, thích hợp với lời cầu nguyện. Đại từ “Cha” theo ngữ cảnh trực tiếp của Kinh Lạy Cha. Dùng “vương quốc” thay vì “nước” để tránh nghĩa quốc gia hiện đại; dùng cấu trúc Việt tự nhiên “dưới đất cũng như trên trời,” dù trật tự này đảo thứ tự bề mặt của tiếng Hy Lạp nhưng giữ nguyên quan hệ so sánh.
