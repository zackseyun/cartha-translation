    issue: “Ngắm kỹ” hơi thu hẹp sắc thái của καταμάθετε.
    rationale: Động từ này kêu gọi quan sát/chú ý để nhận ra, không chỉ chiêm ngưỡng. “Hãy xem” là cách nói tự nhiên, bao quát hơn trong tiếng Việt.
  - severity: low
    issue: “Chúng không nhọc công” chưa thật tự nhiên.
    rationale: “Lao nhọc” diễn đạt trực tiếp κοπιάω và tạo thế song song gọn, tự nhiên với “cũng không kéo sợi.”
  - severity: low
