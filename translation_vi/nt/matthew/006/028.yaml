id: MAT.6.28
reference: Matthew 6:28
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ περὶ ἐνδύματος τί μεριμνᾶτε; καταμάθετε τὰ κρίνα τοῦ ἀγροῦ πῶς ⸂αὐξάνουσιν· οὐ κοπιῶσιν οὐδὲ νήθουσιν⸃·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/028.yaml
  text: 'And why are you anxious about clothing? Consider the lilies of the field[a], how they grow: they do not labor[c][b], nor do they spin.'
translation:
  language: vi
  text: 'Còn về quần áo, tại sao lại lo lắng? Hãy xem hoa huệ ngoài đồng[a] mọc lên thế nào: chúng không lao nhọc, cũng không kéo sợi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể hiểu rộng là “những bông hoa dại ngoài đồng.”
    reason: lexical_alternative
lexical_decisions:
- source_word: περὶ ἐνδύματος
  choice: về quần áo
  rationale: Danh từ số ít chỉ chung nhu cầu về y phục; “quần áo” là cách diễn đạt tự nhiên trong tiếng Việt hiện đại.
- source_word: τί μεριμνᾶτε
  choice: tại sao lại lo lắng
  rationale: Trong mạch văn, động từ nói đến nỗi lo âu về nhu cầu vật chất; cách diễn đạt không chủ ngữ vừa tự nhiên vừa tránh áp đặt một đại từ xưng hô không có trong cụm từ này.
- source_word: καταμάθετε
  choice: hãy ngắm kỹ
  rationale: Mệnh lệnh này kêu gọi quan sát chăm chú để rút ra sự hiểu biết; “ngắm kỹ” tự nhiên hơn một cách dịch thuần học thuật.
- source_word: τὰ κρίνα τοῦ ἀγροῦ
  choice: những hoa huệ ngoài đồng
  rationale: κρίνα trực tiếp chỉ hoa huệ, còn τοῦ ἀγροῦ đặt chúng trong khung cảnh đồng nội; khả năng hiểu rộng hơn là hoa dại được giữ trong chú thích.
- source_word: πῶς αὐξάνουσιν
  choice: xem chúng lớn lên thế nào
  rationale: αὐξάνω ở đây mô tả sự sinh trưởng tự nhiên; trật tự tiếng Việt này kết nối tự nhiên với mệnh lệnh quan sát.
- source_word: οὐ κοπιῶσιν
  choice: chúng không nhọc công
  rationale: κοπιάω diễn tả lao nhọc hoặc làm việc vất vả; “nhọc công” giữ được sắc thái nỗ lực nặng nhọc và tính cô đọng.
- source_word: οὐδὲ νήθουσιν
  choice: cũng không kéo sợi
  rationale: νήθω chỉ việc se hoặc kéo sợi để làm vải; “kéo sợi” rõ nghĩa trong tiếng Việt và duy trì sự song song với vế trước.
theological_decisions:
- issue: Sắc thái của μεριμνάω trong lời dạy về sự chu cấp
  choice: lo lắng
  alternative: bận tâm
  rationale: “Lo lắng” thể hiện sự bất an trong lòng phù hợp với toàn đoạn, nhưng không biến lời dạy thành sự phủ nhận mọi quan tâm hoặc hoạch định chính đáng.
- issue: Đại từ dùng cho người nghe
  choice: lược chủ ngữ trong câu hỏi
  alternative: anh em / các con
  rationale: Bản Hy Lạp biểu thị ngôi thứ hai số nhiều qua động từ nhưng không nêu danh xưng. Lược chủ ngữ là tự nhiên trong tiếng Việt và tránh áp đặt quan hệ xã hội hoặc sắc thái thần học mà nguyên văn không nói rõ.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Ngắm kỹ” truyền đạt cả việc quan sát lẫn suy xét; “kéo sợi” giữ hình ảnh lao động dệt may của nguyên văn.
