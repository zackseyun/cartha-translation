  verdict: revise
  source_fidelity: 'Bản dịch truyền đạt đúng các thành phần chính: sự lo lắng về y phục, mệnh lệnh quan sát hoa huệ ngoài đồng, sự sinh trưởng, và hai phủ định song song về lao nhọc và kéo sợi. Tuy nhiên, “ngắm kỹ” thiên về chiêm ngưỡng bằng mắt hơn là quan sát để nhận biết/học hỏi của καταμάθετε; “xem” phù hợp hơn. “Nhọc công” hiểu được nhưng không tự nhiên bằng “lao nhọc” trong cấu trúc phủ định này.'
