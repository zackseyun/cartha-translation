  terminology: “Quần áo,” “hoa huệ,” và “kéo sợi” đều phù hợp. Chú thích về khả năng hiểu κρίνα theo nghĩa rộng là “hoa dại” được neo đúng tại “hoa huệ” và giữ được sự dè dặt cần thiết về định danh thực vật.
  issues:
