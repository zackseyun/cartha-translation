source:
  edition: SBLGNT
  text: μὴ οὖν μεριμνήσητε εἰς τὴν αὔριον, ἡ γὰρ αὔριον μεριμνήσει ⸀αὑτῆς· ἀρκετὸν τῇ ἡμέρᾳ ἡ κακία αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/034.yaml
  text: Therefore do not worry about tomorrow[a], for tomorrow will worry about itself. Each day has enough trouble of its own.
translation:
  language: vi
  text: Vậy, đừng lo lắng về ngày mai, vì ngày mai sẽ tự lo cho mình. Mỗi ngày có đủ nỗi khổ riêng của mình.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Mỗi ngày có đủ sự dữ của riêng mình.” Từ Hy Lạp có thể có nghĩa là “điều ác” hoặc “sự dữ”, nhưng ở đây có lẽ chỉ nỗi khổ, gian nan hay phiền muộn trong ngày.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μεριμνήσητε
  choice: lo lắng
  rationale: Trong mạch văn Ma-thi-ơ 6:25–34, động từ này chỉ sự lo âu về những nhu cầu và điều chưa xảy đến; “lo lắng” là cách nói tự nhiên, rõ nghĩa trong tiếng Việt hiện đại.
- source_word: εἰς τὴν αὔριον
  choice: về ngày mai
  rationale: Giới từ εἰς đi với μεριμνάω diễn tả đối tượng mà sự lo lắng hướng đến; “về ngày mai” truyền đạt đúng quan hệ này.
- source_word: ἡ αὔριον
  choice: ngày mai
  rationale: Cụm từ được nhân cách hóa làm chủ ngữ; tiếng Việt có thể giữ phép nhân cách hóa một cách tự nhiên bằng “ngày mai”.
- source_word: μεριμνήσει αὑτῆς
  choice: sẽ tự lo cho mình
  rationale: Cách dịch giữ sự lặp lại của động từ “lo” và phép nhân cách hóa, đồng thời diễn đạt tự nhiên sắc thái phản thân của αὑτῆς.
- source_word: ἀρκετὸν τῇ ἡμέρᾳ
  choice: Mỗi ngày có đủ
  rationale: ἀρκετόν mang nghĩa “đủ”; cấu trúc tiếng Việt “mỗi ngày có đủ” thể hiện rõ ý phân bổ theo từng ngày mà không sao chép cứng trật tự Hy Lạp.
- source_word: κακία
  choice: nỗi khó nhọc
  rationale: Từ này có thể mang nghĩa “điều ác” hoặc “sự khốn khó”; trong lời dạy về lo âu, nó chỉ những khó khăn, phiền toái mà một ngày đem đến. “Nỗi khó nhọc” trang trọng, tự nhiên và phù hợp ngữ cảnh.
- source_word: αὐτῆς
  choice: của riêng ngày ấy
  rationale: Đại từ sở hữu quy chiếu về “ngày”; cách dịch này làm rõ mỗi ngày có phần khó nhọc thuộc về chính nó.
theological_decisions:
- issue: Ý nghĩa của κακία trong lời kết về sự lo lắng
  choice: Dịch là “nỗi khó nhọc”
  alternative: “điều ác” hoặc “sự dữ”
  rationale: Ngữ cảnh tập trung vào nỗi lo trước các gánh nặng của tương lai, nên nghĩa chỉ nghịch cảnh hay khó nhọc phù hợp hơn. Tuy vậy, vì κακία cũng thực sự có thể chỉ điều ác, phương án ấy được giữ trong chú thích thay vì bị loại bỏ.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Giữ phép nhân cách hóa “ngày mai sẽ tự lo cho mình”; dùng “Vậy” để thể hiện οὖν như kết luận từ lời dạy ngay trước đó.
