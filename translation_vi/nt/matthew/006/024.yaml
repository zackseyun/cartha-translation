  to: Không ai có thể làm tôi hai chủ, vì người ấy sẽ ghét chủ này mà yêu chủ kia, hoặc sẽ gắn bó với chủ này mà khinh thường chủ kia. Anh em không thể làm tôi cho Đức Chúa Trời và Ma-môn[a].
