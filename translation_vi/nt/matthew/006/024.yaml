id: MAT.6.24
reference: Matthew 6:24
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Οὐδεὶς δύναται δυσὶ κυρίοις δουλεύειν· ἢ γὰρ τὸν ἕνα μισήσει καὶ τὸν ἕτερον ἀγαπήσει, ἢ ἑνὸς ἀνθέξεται καὶ τοῦ ἑτέρου καταφρονήσει. οὐ δύνασθε θεῷ δουλεύειν καὶ μαμωνᾷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/024.yaml
  text: No one is able to serve two masters[a], for either he will hate the one and love the other, or he will be devoted to one and despise the other. You are not able to serve God and mammon.
translation:
  language: vi
  text: Không ai có thể làm tôi hai chủ, vì người ấy sẽ ghét chủ này mà yêu chủ kia, hoặc sẽ gắn bó với chủ này mà khinh thường chủ kia. Anh em không thể làm tôi cho Đức Chúa Trời và Ma-môn[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “của cải” hoặc “tiền bạc.” Tiếng Hy Lạp dùng từ vay mượn gốc A-ram “Ma-môn,” có thể nhân cách hóa của cải như một chủ đối nghịch.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐδεὶς
  choice: Không ai
  rationale: Diễn đạt tự nhiên đại từ phủ định phổ quát, giữ nguyên ý rằng không một người nào là ngoại lệ.
- source_word: δύναται / δύνασθε
  choice: có thể / không thể
  rationale: Truyền đạt trực tiếp khả năng và sự bất khả; việc lặp lại “có thể/không thể” bảo toàn điểm nhấn của câu Hy Lạp.
- source_word: δυσὶ κυρίοις
  choice: hai chủ
  rationale: Trong bối cảnh δουλεύειν, κύριος chỉ người chủ có quyền trên tôi tớ; “chủ” tự nhiên và tránh nhầm với tước hiệu thần thánh “Chúa”.
- source_word: δουλεύειν
  choice: làm tôi
  rationale: Giữ rõ sắc thái phục dịch trong địa vị tôi tớ hoặc nô lệ, đồng thời là cách nói ngắn gọn, trang trọng và quen thuộc trong tiếng Việt.
- source_word: μισήσει / ἀγαπήσει
  choice: sẽ ghét / yêu
  rationale: Giữ nguyên thế đối lập mạnh trong nguyên văn, không tự ý làm nhẹ μισέω thành “yêu ít hơn”.
- source_word: ἑνὸς ἀνθέξεται
  choice: sẽ gắn bó với chủ này
  rationale: ἀντέχομαι mang nghĩa bám giữ, đứng về phía hoặc tận tâm với một người; “gắn bó với” tự nhiên mà vẫn giữ sắc thái trung thành.
- source_word: καταφρονήσει
  choice: khinh thường
  rationale: Diễn đạt thái độ coi thường hoặc khinh miệt và tạo thế đối xứng rõ với “gắn bó”.
- source_word: θεῷ
  choice: Đức Chúa Trời
  rationale: Cách gọi trang trọng, dễ nhận biết trong văn phong Kinh Thánh tiếng Việt cho θεός ở đây.
- source_word: μαμωνᾷ
  choice: Ma-môn
  rationale: Giữ từ vay mượn gốc A-ram để bảo toàn phép nhân cách hóa của cải như một ông chủ cạnh tranh với Đức Chúa Trời; nghĩa từ vựng được giải thích trong chú thích.
theological_decisions:
- issue: Cách dịch κύριος trong ngữ cảnh xã hội, không phải tước hiệu thần thánh
  choice: chủ
  alternative: Chúa
  rationale: Số nhiều cùng hình ảnh làm tôi cho thấy đây là quan hệ chủ–tớ. Dịch “chủ” giữ đúng nghĩa theo ngữ cảnh và không khiến người đọc tưởng câu nói đến hai thần linh.
- issue: Cách thể hiện μαμωνᾶς
  choice: Ma-môn
  alternative: của cải hoặc tiền bạc
  rationale: Giữ nguyên từ vay mượn duy trì thế song song tu từ giữa Đức Chúa Trời và Ma-môn như hai chủ đòi hỏi lòng trung thành. Chú thích cung cấp nghĩa thông thường mà không làm phẳng hình ảnh trong chính văn.
- issue: Cường độ của μισήσει
  choice: sẽ ghét
  alternative: sẽ yêu ít hơn
  rationale: Nguyên văn đặt “ghét” đối lập trực tiếp với “yêu”; bản dịch giữ sức căng của lời nói thay vì tự giải thích nó theo nghĩa so sánh nhẹ hơn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Làm tôi” bảo toàn hình ảnh quan hệ chủ–tớ; “anh em” thể hiện ngôi thứ hai số nhiều của δύνασθε. Dấu nối trong “Ma-môn” hỗ trợ cách đọc tiếng Việt và giữ đây là một tên gọi được nhân cách hóa.
