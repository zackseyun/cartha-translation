  text: σὺ δὲ νηστεύων ἄλειψαί σου τὴν κεφαλὴν καὶ τὸ πρόσωπόν σου νίψαι,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/017.yaml
  text: But you[a], when you fast, anoint your head and wash your face[b],
translation:
  language: vi
  text: Còn bạn, khi kiêng ăn, hãy xức dầu lên đầu[a] và rửa mặt[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “thoa dầu lên đầu”. Động từ Hy Lạp có thể chỉ việc dùng dầu trong sự chăm sóc diện mạo hằng ngày.'
    reason: lexical_alternative
  - marker: b
    text: Nghĩa là giữ diện mạo bình thường, thay vì cố làm cho người khác nhận thấy mình đang kiêng ăn.
    reason: cultural_note
lexical_decisions:
- source_word: σὺ δὲ
  choice: Còn bạn
  rationale: Đại từ được nêu rõ tạo thế tương phản với những kẻ đạo đức giả ở câu trước. “Còn bạn” giữ được sự nhấn mạnh và ngôi số ít bằng tiếng Việt hiện đại.
- source_word: νηστεύων
  choice: khi kiêng ăn
  rationale: Phân từ hiện tại có chức năng chỉ thời gian; cách dịch này tự nhiên và không hàm ý rằng việc kiêng ăn diễn ra liên tục.
- source_word: ἄλειψαί
  choice: hãy xức dầu
  rationale: Động từ chỉ việc thoa dầu, ở đây phù hợp với tập quán chăm sóc diện mạo thông thường. “Xức dầu” giữ sắc thái văn hóa của nguyên văn, còn chú thích làm rõ nghĩa trong ngữ cảnh.
- source_word: τὴν κεφαλήν
  choice: lên đầu
  rationale: Dịch trực tiếp κεφαλή là “đầu”; giới từ “lên” diễn đạt tự nhiên hành động xức dầu trong tiếng Việt.
- source_word: καὶ
  choice: và
  rationale: Giữ quan hệ phối hợp đơn giản giữa hai mệnh lệnh.
- source_word: τὸ πρόσωπόν σου
  choice: mặt
  rationale: πρόσωπον ở đây là khuôn mặt nhìn thấy được; “mặt” là cách nói tự nhiên, rõ ràng.
- source_word: νίψαι
  choice: rửa
  rationale: νίπτω thường chỉ việc rửa một phần thân thể; “rửa mặt” là cách diễn đạt thông dụng và chính xác trong ngữ cảnh.
theological_decisions:
- issue: Bản chất của lời dạy về diện mạo khi kiêng ăn
  choice: Lời dạy yêu cầu giữ diện mạo bình thường khi kiêng ăn, thay vì cố làm cho người khác nhận thấy.
  alternative: Hiểu đây là nghi thức xức dầu, hoặc là lệnh cấm mọi hình thức kiêng ăn công khai.
  rationale: Ngữ cảnh gần đối chiếu việc làm cho khuôn mặt tiều tụy với cách chăm sóc diện mạo bình thường. Câu này không cấm kiêng ăn và cũng không nhất thiết quy định một nghi thức.
translation_notes:
  register: Bản dịch dùng tiếng Việt hiện đại, trực tiếp và trang trọng vừa phải. “Bạn” giữ ngôi số ít của σὺ mà tránh từ “ngươi” mang sắc thái cổ; “kiêng ăn” dễ hiểu hơn thuật ngữ Hán-Việt “kiêng trai” hoặc cách nói có thể mang nghĩa rộng khác.
