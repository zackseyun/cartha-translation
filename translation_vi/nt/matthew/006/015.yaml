  text: ἐὰν δὲ μὴ ἀφῆτε τοῖς ⸀ἀνθρώποις, οὐδὲ ὁ πατὴρ ὑμῶν ἀφήσει τὰ παραπτώματα ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/015.yaml
  text: But if you do not forgive people[a], neither will your Father forgive your trespasses.
translation:
  language: vi
  text: Nhưng nếu anh em không tha thứ cho người ta, thì Cha của anh em cũng sẽ không tha những lỗi phạm của anh em[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch “những sự vi phạm” hoặc “những điều xúc phạm” thay cho “những lỗi phạm.”
    reason: Nêu các khả năng từ vựng chính của παραπτώματα mà không làm thay đổi câu chính.
lexical_decisions:
- source_word: ἐὰν δὲ μὴ
  choice: Nhưng nếu ... không
  rationale: ἐάν mở đầu mệnh đề điều kiện, δέ tạo sự tương phản với câu trước, còn μή phủ định điều kiện. Cách diễn đạt này vừa rõ nghĩa vừa tự nhiên trong tiếng Việt.
- source_word: ἀφῆτε
  choice: tha thứ
  rationale: Trong ngữ cảnh những lỗi người này phạm với người kia, ἀφίημι mang nghĩa tha thứ. Cụm “tha thứ cho người ta” là cách nói tự nhiên trong tiếng Việt.
- source_word: τοῖς ἀνθρώποις
  choice: cho người ta
  rationale: ἄνθρωποι chỉ con người nói chung, không riêng nam giới. “Người ta” giữ được tính khái quát và phù hợp với lời dạy trực tiếp.
- source_word: οὐδὲ
  choice: cũng sẽ không
  rationale: οὐδέ nối kết phủ định ở mệnh đề kết quả với phủ định trong điều kiện. “Cũng sẽ không” thể hiện rõ sự tương ứng giữa hai vế trong tiếng Việt.
- source_word: ὁ πατὴρ ὑμῶν
  choice: Cha của anh em
  rationale: Bản Hy Lạp chỉ nói “Cha của anh em”, không có tính từ “trên trời”; vì vậy không thêm ý ngoài văn bản. Viết hoa “Cha” biểu thị danh xưng chỉ Đức Chúa Trời.
- source_word: ἀφήσει
  choice: tha
  rationale: Dùng cùng trường nghĩa với ἀφῆτε để giữ cấu trúc tương ứng. Với tân ngữ là “những lỗi phạm”, tiếng Việt tự nhiên hơn khi nói “tha” thay vì lặp đầy đủ “tha thứ”.
- source_word: τὰ παραπτώματα ὑμῶν
  choice: những lỗi phạm của anh em
  rationale: παραπτώματα chỉ những bước sai, hành vi sai trái hoặc sự vi phạm. “Những lỗi phạm” giữ được sắc thái đạo đức và số nhiều mà vẫn dễ hiểu trong tiếng Việt hiện đại.
theological_decisions:
- issue: Mối quan hệ có điều kiện giữa việc con người tha thứ và việc Cha tha thứ
  choice: 'Giữ nguyên phát biểu điều kiện trực tiếp: nếu anh em không tha thứ, Cha cũng sẽ không tha.'
  alternative: Diễn giải đây chỉ là bằng chứng của sự được tha thứ, hoặc chỉ là mất sự tương giao chứ không phải không được tha thứ.
  rationale: Câu Hy Lạp trình bày một điều kiện thẳng thắn và không giải thích thêm. Bản dịch giữ nguyên sức căng thần học ấy, không làm nhẹ hoặc hệ thống hóa theo một lập trường giáo phái.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Đại từ “anh em” phù hợp với lời Chúa Giê-su nói trực tiếp với nhiều người; không dùng từ chỉ riêng nam giới theo nghĩa loại trừ. Cấu trúc hai vế được giữ cân xứng để phản ánh sự lặp lại của ἀφίημι trong nguyên văn.
