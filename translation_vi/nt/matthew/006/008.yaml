id: MAT.6.8
reference: Matthew 6:8
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: μὴ οὖν ὁμοιωθῆτε αὐτοῖς, οἶδεν γὰρ ⸀ὁ πατὴρ ὑμῶν ὧν χρείαν ἔχετε πρὸ τοῦ ὑμᾶς αἰτῆσαι αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/008.yaml
  text: Therefore[a], do not become like them, for your Father knows what you need before you ask him.
translation:
  language: vi
  text: Vậy, đừng trở nên giống như họ, vì Cha của anh em biết anh em cần gì trước khi anh em cầu xin Ngài.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μὴ οὖν
  choice: Vậy, đừng
  rationale: Diễn đạt tự nhiên mệnh lệnh phủ định cùng quan hệ suy luận với lời cảnh báo ngay trước đó.
- source_word: ὁμοιωθῆτε
  choice: trở nên giống như
  rationale: Giữ sắc thái của động từ aorist thụ động giả định trong lời cấm, tức không nên trở nên hay đồng hóa với kiểu mẫu của họ, đồng thời vẫn tự nhiên trong tiếng Việt.
- source_word: αὐτοῖς
  choice: họ
  rationale: Đại từ quy chiếu tự nhiên về những người ngoại được nhắc trong ngữ cảnh trước.
- source_word: οἶδεν
  choice: biết
  rationale: οἶδα tuy có hình thái hoàn thành nhưng mang nghĩa hiện tại ở đây.
- source_word: ὁ πατὴρ ὑμῶν
  choice: Cha của anh em
  rationale: Bám sát bản Hy Lạp chỉ nói 'Cha của anh em', không tự thêm 'ở trên trời'.
- source_word: ὧν χρείαν ἔχετε
  choice: anh em cần gì
  rationale: Cách diễn đạt hiện đại, gọn và chính xác cho cấu trúc chỉ nội dung nhu cầu.
- source_word: πρὸ τοῦ ὑμᾶς αἰτῆσαι αὐτόν
  choice: trước khi anh em cầu xin Ngài
  rationale: πρὸ τοῦ với động từ nguyên mẫu chỉ thời điểm trước; 'cầu xin Ngài' phù hợp ngữ cảnh cầu nguyện và giữ đối tượng chỉ Đức Chúa Trời.
theological_decisions:
- issue: Sự biết trước của Đức Chúa Trời trong mối liên hệ với lời cầu nguyện
  choice: Khẳng định trực tiếp rằng Cha biết nhu cầu của các môn đồ trước khi họ cầu xin.
  alternative: Diễn giải thêm rằng cầu nguyện nhằm xây dựng mối quan hệ chứ không nhằm cung cấp thông tin, hoặc dùng lời lẽ nhấn mạnh một hệ thống giáo lý cụ thể về sự biết trước.
  rationale: Câu này nêu sự biết trước của Cha nhưng không giải thích vì sao vẫn cần cầu nguyện; bản dịch giữ nguyên sự căng thẳng thần học ấy, không tự giải quyết.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Dùng 'anh em' cho đại từ số nhiều ὑμεῖς và 'Ngài' để quy chiếu kính trọng về Cha. Không cần chú thích vì 'trở nên giống như' vừa phản ánh sắc thái nguồn vừa rõ nghĩa.
