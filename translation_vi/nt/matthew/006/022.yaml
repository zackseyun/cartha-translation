source:
  edition: SBLGNT
  text: Ὁ λύχνος τοῦ σώματός ἐστιν ὁ ὀφθαλμός. ἐὰν οὖν ⸂ᾖ ὁ ὀφθαλμός σου ἁπλοῦς⸃, ὅλον τὸ σῶμά σου φωτεινὸν ἔσται·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/022.yaml
  text: The eye is the lamp of the body. Therefore[a], if your eye is healthy, your whole body will be full of light.
translation:
  language: vi
  text: Mắt là ngọn đèn của thân thể. Vậy, nếu mắt bạn tốt[a], thì toàn thân bạn sẽ sáng.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “đơn thuần,” “trong sáng” hoặc “lành mạnh”; từ Hy Lạp này cũng có thể mang nghĩa không chia rẽ, và trong một số văn cảnh là hào phóng.
    reason: lexical_alternative
lexical_decisions:
- source_word: λύχνος
  choice: ngọn đèn
  rationale: Danh từ này chỉ một chiếc đèn cụ thể; “ngọn đèn” giữ nguyên hình ảnh ẩn dụ về mắt soi sáng thân thể.
- source_word: σῶμα
  choice: thân thể
  rationale: Cách dịch trực tiếp, tự nhiên trong hình ảnh về cơ thể.
- source_word: ὀφθαλμός
  choice: mắt
  rationale: Giữ nguyên cả nghĩa thân thể lẫn khả năng mang ý nghĩa đạo đức trong ẩn dụ.
- source_word: ἐὰν οὖν
  choice: Vậy, nếu
  rationale: οὖν nêu hệ luận từ mệnh đề trước; “Vậy, nếu” thể hiện quan hệ logic ấy bằng tiếng Việt tự nhiên.
- source_word: ἁπλοῦς
  choice: tốt
  rationale: Trong hình ảnh về thị giác và sự soi sáng, “mắt tốt” gợi một con mắt hoạt động đúng cách mà vẫn không thu hẹp hết trường nghĩa của từ Hy Lạp. Các nghĩa “đơn nhất,” “trong sáng,” “lành mạnh” và sắc thái không phân chia hoặc rộng rãi được nêu trong chú thích.
- source_word: ὅλον
  choice: toàn
  rationale: Diễn đạt đầy đủ ý bao quát của từ Hy Lạp và kết hợp tự nhiên trong cụm “toàn thân”.
- source_word: φωτεινὸν
  choice: sáng
  rationale: Tính từ vị ngữ có nghĩa là sáng hoặc đầy ánh sáng; “sáng” tự nhiên, súc tích và duy trì hình ảnh soi sáng.
- source_word: ἔσται
  choice: sẽ
  rationale: Giữ rõ thì tương lai của động từ Hy Lạp.
theological_decisions:
- issue: Ý nghĩa của ἁπλοῦς trong ẩn dụ về mắt
  choice: Dịch là “tốt” trong chính văn
  alternative: “đơn nhất,” “trong sáng,” “lành mạnh”; cũng có thể hàm ý không bị phân chia hoặc, trong một số văn cảnh, rộng rãi
  rationale: Văn cảnh trực tiếp nói về mắt như ngọn đèn và đối lập với “mắt xấu” ở câu kế tiếp, nên “mắt tốt” giữ được hình ảnh một con mắt hoạt động đúng cách. Chú thích bảo lưu độ rộng ngữ nghĩa, tránh quyết định rằng câu chỉ nói về thị lực, lòng chuyên nhất hay sự rộng rãi.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Đại từ “bạn” diễn đạt ngôi thứ hai số ít mà không giả định tuổi tác, giới tính hay địa vị. Câu ngắn và nhịp đối xứng bảo toàn hình ảnh đèn–mắt–thân thể.
