  source_fidelity: Bản dịch giữ được mệnh lệnh tương phản, số nhiều của “kho báu,” ẩn dụ “trên trời,” và phạm vi rộng của βρῶσις qua “sự mục nát.” “Mối mọt” là cách gọi quen thuộc trong tiếng Việt Kinh Thánh cho σής, dù từ Hy Lạp nói riêng về loài bướm đêm phá hoại đồ cất giữ. Hình ảnh διορύσσω được bảo toàn bằng “khoét vách” và chú thích văn hóa phù hợp.
  naturalness: 'Câu nhìn chung tự nhiên và có văn phong trang trọng vừa phải. Tuy nhiên, cấu trúc “không khoét vách mà lấy cắp” có thể bị hiểu như quan hệ phương tiện/mục đích hoặc thế đối lập “không... mà...”, trong khi nguyên văn phủ định song song hai hành động: không khoét xuyên và cũng không trộm cắp. “Cũng là nơi” không sai, nhưng “và nơi” phản ánh phép lặp của nguyên văn gọn hơn.'
  terminology: “Tích trữ,” “kho báu trên trời,” “mối mọt,” “sự mục nát,” “kẻ trộm,” và “lấy cắp” phù hợp với tiếng Việt hiện đại và không diễn giải thần học. Chú thích tại [a] được neo đúng vào “khoét vách” và giải thích chính xác sắc thái văn hóa của διορύσσω.
