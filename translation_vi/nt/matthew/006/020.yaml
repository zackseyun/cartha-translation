id: MAT.6.20
reference: Matthew 6:20
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: θησαυρίζετε δὲ ὑμῖν θησαυροὺς ἐν οὐρανῷ, ὅπου οὔτε σὴς οὔτε βρῶσις ἀφανίζει, καὶ ὅπου κλέπται οὐ διορύσσουσιν οὐδὲ κλέπτουσιν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/020.yaml
  text: But store up for yourselves treasures in heaven[a], where neither moth nor decay destroys[b], and where thieves do not break in and steal.
translation:
  language: vi
  text: Nhưng hãy tích trữ cho mình những kho báu trên trời, nơi mối mọt và sự mục nát không phá hủy, và nơi kẻ trộm không khoét vách[a], cũng không lấy cắp.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn là “đào xuyên” hoặc “khoét xuyên,” có lẽ nói đến việc kẻ trộm khoét qua vách nhà để đột nhập.
    reason: cultural_note
lexical_decisions:
- source_word: θησαυρίζετε
  choice: hãy tích trữ
  rationale: Thể mệnh lệnh hiện tại kêu gọi hành động liên tục; “tích trữ” tự nhiên trong tiếng Việt và giữ được hình ảnh gom góp của cải.
- source_word: δὲ
  choice: Nhưng
  rationale: Thể hiện sự tương phản với mệnh lệnh phủ định ở câu trước.
- source_word: ὑμῖν
  choice: cho mình
  rationale: Diễn đạt sắc thái hưởng lợi/phản thân một cách tự nhiên khi chủ thể là số nhiều được hiểu từ ngữ cảnh.
- source_word: θησαυροὺς
  choice: những kho báu
  rationale: Giữ số nhiều và mô-típ kho báu trong nguyên văn.
- source_word: ἐν οὐρανῷ
  choice: trên trời
  rationale: Cách nói tiếng Việt tự nhiên, giữ nghĩa chỉ nơi chốn mà không giải thích thêm bản chất của kho báu.
- source_word: σὴς
  choice: mối mọt
  rationale: Chỉ loài phá hoại quần áo và tài sản cất giữ; “mối mọt” là cách diễn đạt quen thuộc và bao quát trong tiếng Việt.
- source_word: βρῶσις
  choice: sự mục nát
  rationale: Từ này có thể chỉ sự ăn mòn hay tác nhân tiêu hủy; “sự mục nát” giữ nghĩa rộng hơn “rỉ sét” và phù hợp với nhiều loại của cải.
- source_word: ἀφανίζει
  choice: phá hủy
  rationale: Diễn đạt rõ việc khiến vật bị tiêu tan hoặc hư mất, dùng tự nhiên với cả mối mọt lẫn sự mục nát.
- source_word: κλέπται
  choice: kẻ trộm
  rationale: Tương đương trực tiếp và thông dụng.
- source_word: διορύσσουσιν
  choice: khoét vách
  rationale: Giữ hình ảnh cụ thể của động từ “đào xuyên/khoét xuyên,” liên quan đến việc đột nhập qua vách nhà.
- source_word: κλέπτουσιν
  choice: lấy cắp
  rationale: Cách diễn đạt trực tiếp, tự nhiên cho hành động trộm lấy tài sản.
theological_decisions:
- issue: Bản chất của “những kho báu trên trời”
  choice: Giữ nguyên ẩn dụ “những kho báu trên trời”
  alternative: phần thưởng trên trời; của cải thuộc linh
  rationale: Nguyên văn không xác định cụ thể bản chất của kho báu; giữ ẩn dụ tránh áp đặt một hệ thống thần học về công trạng hay phần thưởng.
- issue: Phạm vi nghĩa của βρῶσις
  choice: sự mục nát
  alternative: rỉ sét; sự ăn mòn
  rationale: Cách dịch rộng này bảo toàn ý về tác nhân làm tiêu hủy của cải trần thế, thay vì thu hẹp vào kim loại.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “hãy tích trữ” để giữ lực mệnh lệnh; giữ ẩn dụ “kho báu trên trời.” “Khoét vách” bảo tồn hình ảnh văn hóa của nguyên văn, với chú thích giải nghĩa.
