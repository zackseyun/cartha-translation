revisions:
- from: Nhưng hãy cẩn thận, đừng thực hành sự công chính của anh em trước mặt người ta cốt để họ thấy[a]; bằng không, anh em không có phần thưởng nơi Cha của anh em, Đấng ở trên các tầng trời.[b]
  to: Nhưng hãy cẩn thận, đừng làm điều công chính của anh em trước mặt người ta nhằm được họ thấy[a]; bằng không, anh em không có phần thưởng từ Cha của anh em, Đấng ở trong các tầng trời.[b]
  rationale: Bản sửa bảo toàn phạm vi rộng của δικαιοσύνην, ý mục đích và thể bị động của πρὸς τὸ θεαθῆναι αὐτοῖς, quan hệ nguồn ban trong παρὰ τῷ πατρὶ, và số nhiều của τοῖς οὐρανοῖς. Các chú thích vẫn được neo đúng tại nội dung liên quan và bảo tồn dị bản về “việc bố thí.”
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T02:47:13Z'
review_pass:
  verdict: revise
  source_fidelity: 'Cần chỉnh hai điểm để sát nguyên văn hơn: παρά + cách ba trong ngữ cảnh μισθός diễn tả phần thưởng “từ” Cha, không phải chủ yếu “nơi” Cha; và động từ bị động θεαθῆναι nên được diễn đạt rõ là “được họ thấy.” Cụm ἐν τοῖς οὐρανοῖς cũng cần giữ quan hệ vị trí “trong,” thay vì “trên.”'
  naturalness: Bản sửa dùng tiếng Việt hiện đại, trang trọng và rõ nghĩa. “Đừng làm điều công chính ... nhằm được họ thấy” tự nhiên hơn “đừng thực hành sự công chính ... cốt để họ thấy,” đồng thời tránh sự mơ hồ về chủ thể của “thấy.”
  terminology: Giữ “công chính” cho δικαιοσύνην, với phạm vi rộng trong chính văn. Giữ “phần thưởng,” “Cha,” và số nhiều “các tầng trời”; không thu hẹp sang “bố thí.”
  issues:
  - severity: medium
    issue: “nơi Cha của anh em” cho παρὰ τῷ πατρὶ ὑμῶν
    rationale: 'Trong mệnh đề phủ định việc có μισθός, παρά với cách ba tự nhiên chỉ nguồn/đấng ban phần thưởng: “từ Cha anh em.” “Nơi” làm yếu quan hệ ban thưởng được ngữ cảnh yêu cầu.'
  - severity: medium
    issue: “cốt để họ thấy” chưa phản ánh rõ thể bị động của θεαθῆναι
    rationale: Nguyên văn nói hành vi công chính được người khác nhìn thấy, không chỉ nói rằng “họ thấy” theo cách có thể mơ hồ. “Nhằm được họ thấy” nêu rõ ý bị động và mục đích.
  - severity: low
    issue: “ở trên các tầng trời” cho ἐν τοῖς οὐρανοῖς
    rationale: ἐν có nghĩa vị trí “trong.” “Trên” là cách nói quen thuộc nhưng không giữ sát giới từ; “ở trong các tầng trời” phản ánh nguyên văn hơn.
