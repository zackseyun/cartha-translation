id: MAT.6.1
reference: Matthew 6:1
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Προσέχετε ⸀δὲ τὴν ⸀δικαιοσύνην ὑμῶν μὴ ποιεῖν ἔμπροσθεν τῶν ἀνθρώπων πρὸς τὸ θεαθῆναι αὐτοῖς· εἰ δὲ μή γε, μισθὸν οὐκ ἔχετε παρὰ τῷ πατρὶ ὑμῶν τῷ ἐν τοῖς οὐρανοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/001.yaml
  text: But be careful not to practice your righteousness before people in order to be seen by them[a]; otherwise[b], you have no reward from your Father in the heavens.
translation:
  language: vi
  text: Nhưng hãy cẩn thận, đừng làm điều công chính của anh em trước mặt người ta nhằm được họ thấy[a]; bằng không, anh em không có phần thưởng từ Cha của anh em, Đấng ở trong các tầng trời.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “những việc công chính của anh em.” Một dị bản chép “việc bố thí của anh em.”
    reason: textual_variant
  - marker: b
    text: Tiếng Hy Lạp dùng dạng số nhiều, sát nghĩa là “các tầng trời”; nhiều bản dịch diễn đạt đơn giản là “trên trời.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Προσέχετε
  choice: hãy cẩn thận
  rationale: Mệnh lệnh hiện tại số nhiều kêu gọi sự cảnh giác liên tục; cách diễn đạt này tự nhiên trong tiếng Việt hiện đại mà vẫn giữ sắc thái cảnh báo.
- source_word: δὲ
  choice: Nhưng
  rationale: Đánh dấu bước chuyển có tính tương phản sang lời cảnh báo, liên kết câu này với phần dạy trước đó.
- source_word: δικαιοσύνην
  choice: sự công chính
  rationale: Giữ phạm vi rộng của từ trong bản SBLGNT, không thu hẹp ngay thành việc bố thí; cách hiểu cụ thể hơn được nêu trong chú thích.
- source_word: μὴ ποιεῖν
  choice: đừng thực hành
  rationale: Diễn tả điều người nghe phải tránh làm và phù hợp với ý niệm thực hành đời sống công chính, thay vì chỉ một hành động đơn lẻ.
- source_word: ἔμπροσθεν τῶν ἀνθρώπων
  choice: trước mặt người ta
  rationale: Chỉ những người quan sát nói chung, không riêng nam giới; đây là cách nói tự nhiên và đúng phạm vi trong tiếng Việt.
- source_word: πρὸς τὸ θεαθῆναι αὐτοῖς
  choice: cốt để họ thấy
  rationale: 'Giữ rõ ý chỉ mục đích của cấu trúc Hy Lạp: hành động được làm nhằm thu hút ánh nhìn của người khác.'
- source_word: εἰ δὲ μή γε
  choice: bằng không
  rationale: Chuyển lời cảnh báo có điều kiện sang một thành ngữ tiếng Việt gọn và tự nhiên.
- source_word: μισθὸν
  choice: phần thưởng
  rationale: Trong ngữ cảnh sự đáp trả của Đức Chúa Trời đối với lòng đạo đức, từ này tự nhiên và ít gây hiểu lầm hơn 'tiền công'.
- source_word: παρὰ τῷ πατρὶ ὑμῶν
  choice: nơi Cha của anh em
  rationale: Giữ được sắc thái hiện diện hoặc nguồn ban của παρά với cách ba mà không buộc câu phải chỉ nói về nguồn gốc của phần thưởng.
- source_word: τῷ ἐν τοῖς οὐρανοῖς
  choice: Đấng ở trên các tầng trời
  rationale: Phản ánh dạng số nhiều của τοῖς οὐρανοῖς và văn phong đặc trưng của Ma-thi-ơ, đồng thời vẫn dễ hiểu trong tiếng Việt.
theological_decisions:
- issue: Phạm vi nghĩa của δικαιοσύνην
  choice: Giữ nghĩa rộng là 'sự công chính' trong chính văn
  alternative: các việc công chính; việc bố thí
  rationale: Bản SBLGNT đọc δικαιοσύνην, vốn có phạm vi rộng hơn việc bố thí. Ngữ cảnh có thể hướng đến những hành vi công chính cụ thể, còn một dị bản ghi 'việc bố thí'; chú thích bảo tồn các khả năng ấy mà không thu hẹp chính văn.
- issue: Cách hiểu παρά bên cạnh 'Cha'
  choice: nơi Cha của anh em
  alternative: từ Cha của anh em
  rationale: Trong ngữ cảnh phần thưởng, cụm từ có thể nhấn mạnh Cha là nguồn ban, nhưng hình thức Hy Lạp với cách ba cũng gợi ý phần thưởng ở nơi Ngài. 'Nơi' bảo tồn độ mở đó.
- issue: Dạng số nhiều của τοῖς οὐρανοῖς
  choice: các tầng trời
  alternative: trời; thiên đàng
  rationale: Giữ dạng số nhiều của nguyên văn và lối dùng quen thuộc trong Ma-thi-ơ mà không thêm một khẳng định thần học ngoài câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng đại từ số nhiều “anh em” phù hợp với lời Đức Giê-su nói cùng các môn đồ và thính giả; giữ “sự công chính” để bảo tồn thuật ngữ và phạm vi nghĩa của nguyên văn. Mọi dấu chú thích đều được đặt ngay tại nội dung liên quan trong chính văn.
