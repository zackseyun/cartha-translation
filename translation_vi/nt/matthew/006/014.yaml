reference: Matthew 6:14
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐὰν γὰρ ἀφῆτε τοῖς ἀνθρώποις τὰ παραπτώματα αὐτῶν, ἀφήσει καὶ ὑμῖν ὁ πατὴρ ὑμῶν ὁ οὐράνιος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/014.yaml
  text: For if you forgive people their trespasses[b][a], your heavenly Father will also forgive you.
translation:
  language: vi
  text: Vì nếu anh em tha thứ cho người khác những lỗi phạm của họ[a], thì Cha trên trời của anh em[b] cũng sẽ tha thứ cho anh em.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “những sự vi phạm”, “những điều xúc phạm” hoặc “những việc sai trái”. Từ Hy Lạp chỉ những lỗi lầm về đạo đức hay những bước đi sai lệch.
    reason: lexical_alternative
  - marker: b
    text: 'Sát nghĩa: “Cha của anh em, Đấng ở trên trời”; theo cách dịch truyền thống: “Cha của anh em ở trên trời”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν γὰρ
  choice: Vì nếu
  rationale: “Vì” giữ chức năng giải thích của γάρ, nối câu này với lời cầu nguyện ngay trước đó; “nếu” diễn đạt tự nhiên mệnh đề điều kiện do ἐάν với động từ ở thể giả định tạo nên.
- source_word: ἀφῆτε … ἀφήσει
  choice: tha thứ … sẽ tha thứ
  rationale: Trong ngữ cảnh lỗi phạm giữa người với người và trước Đức Chúa Trời, ἀφίημι mang nghĩa tha thứ. Dùng cùng một cách dịch ở cả hai vị trí để giữ sự đối ứng của nguyên văn.
- source_word: τοῖς ἀνθρώποις
  choice: người khác
  rationale: Cụm từ chỉ con người nói chung, không riêng nam giới. Trong tiếng Việt, “người khác” diễn đạt tự nhiên đối tượng được tha thứ trong quan hệ với “anh em”.
- source_word: τὰ παραπτώματα αὐτῶν
  choice: những lỗi phạm của người khác
  rationale: παράπτωμα chỉ một bước sai, hành vi xúc phạm hoặc sự vi phạm về đạo đức. “Lỗi phạm” vừa rõ nghĩa vừa giữ sắc thái đạo đức và quan hệ, còn sở hữu từ αὐτῶν được thể hiện bằng “của người khác”.
- source_word: καὶ ὑμῖν
  choice: cũng … cho anh em
  rationale: “Cũng” giữ quan hệ tương ứng do καί biểu thị; ὑμῖν được diễn đạt tự nhiên bằng “cho anh em”.
- source_word: ὁ πατὴρ ὑμῶν ὁ οὐράνιος
  choice: Cha trên trời của anh em
  rationale: Cách diễn đạt này tự nhiên, trang trọng và gần với cấu trúc Hy Lạp “Cha của anh em, Đấng ở trên trời”, đồng thời tránh biến cụm từ thành một danh xưng quá cố định.
theological_decisions:
- issue: Quan hệ có điều kiện giữa việc con người tha thứ và việc Cha tha thứ
  choice: 'Giữ nguyên lời khẳng định dưới dạng điều kiện thực sự: nếu anh em tha thứ, Cha cũng sẽ tha thứ.'
  alternative: Giải thích rằng việc tha thứ của con người hoặc tạo công trạng để được Đức Chúa Trời tha thứ, hoặc chỉ là bằng chứng về sự tha thứ đã nhận trước đó.
  rationale: Nguyên văn nêu một điều kiện trực tiếp nhưng không giải thích cơ chế thần học. Bản dịch vì thế giữ nguyên sức căng của câu, không bổ sung cách giải nghĩa thuộc riêng một hệ phái.
translation_notes:
  register: Dùng tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. “Anh em” thể hiện ngôi thứ hai số nhiều và phù hợp giọng dạy bảo dành cho các môn đồ; “Cha” được viết hoa vì chỉ Đức Chúa Trời. Các dấu chú thích được đặt ngay sau cụm từ liên quan.
