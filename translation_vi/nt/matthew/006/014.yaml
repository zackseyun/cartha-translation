  to: Vì nếu anh em tha thứ cho người khác những lỗi phạm của họ[a], thì Cha trên trời của anh em[b] cũng sẽ tha thứ cho anh em.
  rationale: 'Chỉ điều chỉnh trật tự và thêm giới từ «cho» để câu tiếng Việt biểu đạt tự nhiên và minh bạch quan hệ cú pháp của nguyên văn: tha thứ cho con người về những lỗi phạm của họ. Nghĩa, sắc thái điều kiện, thuật ngữ chính và các neo chú thích được giữ nguyên.'
