    rationale: Nguyên văn có ἀφίημι với người nhận ở cách gián tiếp (τοῖς ἀνθρώποις) và «những lỗi phạm của họ» làm đối tượng trực tiếp. Thêm «cho» trước «người khác» phản ánh quan hệ này rõ ràng và tự nhiên hơn trong tiếng Việt.
