id: MAT.6.26
reference: Matthew 6:26
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐμβλέψατε εἰς τὰ πετεινὰ τοῦ οὐρανοῦ ὅτι οὐ σπείρουσιν οὐδὲ θερίζουσιν οὐδὲ συνάγουσιν εἰς ἀποθήκας, καὶ ὁ πατὴρ ὑμῶν ὁ οὐράνιος τρέφει αὐτά· οὐχ ὑμεῖς μᾶλλον διαφέρετε αὐτῶν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/026.yaml
  text: Look at the birds of the sky[a], that they do not sow or reap or gather into barns, and your heavenly Father feeds them[b]. Are you not of much more value than they are?
translation:
  language: vi
  text: 'Hãy nhìn xem chim trời[a]: chúng không gieo, không gặt, cũng không thu vào kho, và Cha trên trời của anh em nuôi chúng. Chẳng phải anh em quý giá hơn chúng sao?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch sát hơn: “chim trên trời”; theo cách dịch truyền thống: “chim trên không.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμβλέψατε
  choice: Hãy nhìn xem
  rationale: Diễn đạt mệnh lệnh hướng sự chú ý vào một đối tượng; tự nhiên trong tiếng Việt hiện đại mà không cường điệu sắc thái của động từ.
- source_word: πετεινὰ τοῦ οὐρανοῦ
  choice: chim trời
  rationale: Chỉ các loài chim bay trong bầu trời. “Chim trời” ngắn gọn, tự nhiên và phù hợp ngữ cảnh thế giới hữu hình; chú thích giữ lại cách dịch sát cấu trúc hơn.
- source_word: ὅτι
  choice: ':'
  rationale: Dấu hai chấm để phần sau trình bày điều người nghe cần quan sát nơi chim trời, giữ được khả năng giải thích của ὅτι mà không buộc câu tiếng Việt vào “rằng” hoặc “vì” một cách thiếu tự nhiên.
- source_word: σπείρουσιν ... θερίζουσιν ... συνάγουσιν
  choice: gieo ... gặt ... thu
  rationale: Giữ nguyên chuỗi hình ảnh nông nghiệp và cấu trúc song hành của nguyên văn.
- source_word: εἰς ἀποθήκας
  choice: vào kho
  rationale: ἀποθήκη là nơi chứa nông sản; “kho” rõ nghĩa và tự nhiên hơn “nhà kho” trong chuỗi động từ này.
- source_word: ὁ πατὴρ ὑμῶν ὁ οὐράνιος
  choice: Cha trên trời của anh em
  rationale: Giữ cả mối quan hệ “Cha”, đại từ sở hữu số nhiều và đặc tính thuộc trời, bằng lối diễn đạt tiếng Việt rõ ràng, không dùng thuật ngữ cổ.
- source_word: τρέφει
  choice: nuôi
  rationale: Trong ngữ cảnh, động từ nói đến việc cung cấp thức ăn và duy trì sự sống; “nuôi” tự nhiên hơn “cho ăn” khi nói về sự chăm sóc liên tục của Đức Chúa Trời.
- source_word: οὐχ ὑμεῖς μᾶλλον διαφέρετε αὐτῶν;
  choice: Chẳng phải anh em quý giá hơn chúng nhiều sao?
  rationale: Giữ câu hỏi tu từ mong đợi câu trả lời khẳng định và phép so sánh về giá trị, nhưng không thêm lý do thần học cho giá trị ấy.
theological_decisions:
- issue: Giá trị tương đối của con người và chim trời trong lập luận của Chúa Giê-su
  choice: Câu dịch khẳng định người nghe quý giá hơn chim trời trong sự chăm sóc của Đức Chúa Trời, nhưng không nêu căn nguyên giáo lý cho sự khác biệt đó.
  alternative: Nói rõ con người quý giá hơn vì mang hình ảnh Đức Chúa Trời, hoặc chỉ vì thuộc quan hệ giao ước.
  rationale: Nguyên văn đưa ra phép so sánh nhưng không giải thích nền tảng thần học của nó; bản dịch vì thế không bổ sung điều câu này không nói.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Anh em” được dùng cho đại từ ngôi thứ hai số nhiều theo lối xưng hô Kinh Thánh quen thuộc; tránh “các ngươi” vì cổ và nặng sắc thái. “Thế mà” làm rõ sự tương phản hàm ý giữa việc chim không thực hiện các công việc tích trữ và việc Cha trên trời vẫn nuôi chúng.
