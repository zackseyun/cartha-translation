  text: τὸν ἄρτον ἡμῶν τὸν ἐπιούσιον δὸς ἡμῖν σήμερον·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/011.yaml
  text: Give us today our daily bread[a].
translation:
  language: vi
  text: Xin ban cho chúng con hôm nay bánh hằng ngày[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “bánh cho hôm nay,” “bánh cho ngày sắp tới,” hoặc “bánh chúng con cần dùng.” Tính từ Hy Lạp ἐπιούσιον rất hiếm gặp, và nghĩa chính xác của nó vẫn còn được tranh luận.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸν ἄρτον ἡμῶν
  choice: bánh ăn ... chúng con
  rationale: ἄρτος có nghĩa trực tiếp là bánh, nhưng trong tiếng Việt, “bánh ăn” tự nhiên hơn “bánh của chúng con” trong lời cầu xin và vẫn giữ hình ảnh cụ thể về lương thực; đại từ số nhiều ἡμῶν được thể hiện bằng “chúng con,” phù hợp với lời cầu nguyện kính cẩn hướng về Đức Chúa Trời.
- source_word: τὸν ἐπιούσιον
  choice: hằng ngày
  rationale: ἐπιούσιος là từ hiếm, nghĩa chính xác còn được tranh luận. “Hằng ngày” là cách dịch quen thuộc, dễ hiểu và thích hợp với σήμερον, nhưng các khả năng “cho hôm nay,” “cho ngày sắp tới,” hoặc “cần dùng” được giữ trong chú thích.
- source_word: δὸς ἡμῖν
  choice: Xin ban cho chúng con
  rationale: δὸς là mệnh lệnh cách của δίδωμι, nghĩa là “hãy cho.” Trong lời cầu nguyện tiếng Việt, thêm “xin” và dùng “ban cho” diễn đạt lời khẩn cầu tự nhiên, trang trọng mà không làm thay đổi nội dung; ἡμῖν được dịch là “chúng con.”
- source_word: σήμερον
  choice: hôm nay
  rationale: σήμερον có nghĩa trực tiếp là “hôm nay,” là cách diễn đạt tự nhiên trong tiếng Việt hiện đại.
theological_decisions:
- issue: Ý nghĩa của ἐπιούσιον trong Lời Cầu Nguyện của Chúa
  choice: hằng ngày
  alternative: cho hôm nay; cho ngày sắp tới; cần dùng
  rationale: Bản văn Hy Lạp không xác định chắc chắn từ này nói đến bánh cho ngày hiện tại, ngày sắp tới, hay bánh cần thiết để sinh sống. Bản chính dùng cách dịch quen thuộc và rõ ràng “hằng ngày,” còn chú thích bảo lưu sự mơ hồ có thật thay vì giải quyết nó theo một lập trường thần học riêng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và tự nhiên cho lời cầu nguyện. “Chúng con” biểu thị thái độ kính cẩn thông dụng khi thưa với Đức Chúa Trời; “xin ban cho” mềm mại và tự nhiên hơn mệnh lệnh trực tiếp trong tiếng Việt. Dấu chú thích [a] được đặt ngay sau cụm từ đang được giải thích.
