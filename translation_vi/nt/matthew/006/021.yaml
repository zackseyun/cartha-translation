id: MAT.6.21
reference: Matthew 6:21
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὅπου γάρ ἐστιν ὁ θησαυρός ⸀σου, ἐκεῖ ἔσται καὶ ἡ καρδία ⸁σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/021.yaml
  text: For where your treasure is[a], there your heart will be also.
translation:
  language: vi
  text: Vì kho báu của anh em ở đâu, lòng anh em cũng sẽ ở đó.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch theo lối diễn đạt một chân lý luôn đúng: “Vì kho báu của anh em ở đâu, lòng anh em cũng ở đó.” Tuy nhiên, động từ Hy Lạp ở thì tương lai: “sẽ ở”.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὅπου
  choice: ở đâu
  rationale: Giới thiệu mệnh đề quan hệ chỉ nơi chốn và kết hợp tự nhiên với ἐκεῖ trong cấu trúc tiếng Việt “ở đâu… ở đó”.
- source_word: γάρ
  choice: vì
  rationale: Giữ rõ quan hệ giải thích với lời dạy ngay trước đó về việc tích trữ kho báu.
- source_word: θησαυρός
  choice: kho báu
  rationale: Giữ được cả nghĩa cụ thể lẫn sức gợi ẩn dụ của từ Hy Lạp mà không thu hẹp thành tiền của hay điều được quý trọng.
- source_word: σου
  choice: của anh em
  rationale: Diễn đạt quan hệ sở hữu bằng lối xưng hô hiện đại, trang trọng và quen thuộc trong lời dạy hướng đến người nghe; tiếng Hy Lạp dùng đại từ số ít để nói trực tiếp với từng người.
- source_word: ἐκεῖ
  choice: ở đó
  rationale: Tương ứng với ὅπου và bảo toàn cấu trúc song hành gọn tự nhiên “ở đâu… ở đó”.
- source_word: ἔσται
  choice: sẽ ở
  rationale: Giữ nguyên lực tương lai của động từ Hy Lạp thay vì chuyển thành hiện tại mang tính châm ngôn.
- source_word: καρδία
  choice: lòng
  rationale: Trong tiếng Việt, “lòng” diễn đạt tự nhiên trung tâm của ước muốn, tình cảm và sự hướng về bên trong; “trái tim” ở đây dễ thiên về hình ảnh cơ thể hoặc sắc thái tình cảm hiện đại.
- source_word: καὶ
  choice: cũng
  rationale: Giữ ý bổ sung, liên kết vị trí của lòng với vị trí của kho báu một cách tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Giá trị thời gian của ἔσται trong một lời nói mang tính châm ngôn
  choice: Giữ thì tương lai bằng “sẽ ở”
  alternative: 'Dùng hiện tại: “lòng anh em cũng ở đó”'
  rationale: Bản Hy Lạp dùng hình thái tương lai. Giữ “sẽ” bảo toàn khả năng câu nói nhấn mạnh hướng vận động của lòng theo kho báu, đồng thời không loại bỏ tính khái quát của lời dạy.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cấu trúc “ở đâu… ở đó” giữ nhịp song hành của nguyên văn. “Anh em” được dùng như cách xưng hô chung với người nghe; không chuyển “kho báu” thành một khái niệm diễn giải hẹp hơn.
