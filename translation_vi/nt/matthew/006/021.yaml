  verdict: approve
  source_fidelity: 'Bản dịch bám sát câu Hy Lạp: “Vì” phản ánh γάρ; cấu trúc tương ứng “ở đâu… ở đó” chuyển tải ὅπου… ἐκεῖ; “kho báu,” “lòng,” và “cũng” giữ được các thành tố chính. “Sẽ ở” phản ánh đúng thì tương lai ἔσται, không chuyển sang hiện tại châm ngôn.'
  naturalness: Câu văn hiện đại, rõ ràng và có nhịp song hành tự nhiên trong tiếng Việt. Cách xưng hô “anh em” phù hợp văn cảnh lời dạy trang trọng hướng đến thính giả, dù đại từ Hy Lạp có hình thức số ít mang tính phân phối.
  terminology: “Kho báu” giữ được phạm vi nghĩa cụ thể lẫn ẩn dụ của θησαυρός; “lòng” là cách chuyển καρδία tự nhiên và rộng nghĩa trong tiếng Việt, không thu hẹp vào tình cảm. Thuật ngữ và sắc thái không áp đặt diễn giải giáo phái.
