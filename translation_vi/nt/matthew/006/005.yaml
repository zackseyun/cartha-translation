id: MAT.6.5
reference: Matthew 6:5
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Καὶ ὅταν ⸂προσεύχησθε, οὐκ ἔσεσθε ὡς⸃ οἱ ὑποκριταί· ὅτι φιλοῦσιν ἐν ταῖς συναγωγαῖς καὶ ἐν ταῖς γωνίαις τῶν πλατειῶν ἑστῶτες προσεύχεσθαι, ⸀ὅπως φανῶσιν τοῖς ἀνθρώποις· ἀμὴν λέγω ⸀ὑμῖν, ἀπέχουσι τὸν μισθὸν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/005.yaml
  text: And whenever you pray[a], you shall not be like the hypocrites, because they love to stand and pray in the synagogues and on the corners of the broad streets, so that they may be seen by people. Truly I say to you[c][b], they have received their reward.
translation:
  language: vi
  text: 'Mỗi khi các con cầu nguyện, đừng như những kẻ đạo đức giả, vì họ thích đứng cầu nguyện trong các hội đường và tại các góc đường lớn để được người ta nhìn thấy. Thầy bảo thật các con: họ đã nhận đủ phần thưởng của mình.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “họ đã nhận phần thưởng của mình.” Động từ Hy Lạp có thể mang sắc thái thương mại là đã nhận đủ khoản được trả.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν προσεύχησθε
  choice: Mỗi khi cầu nguyện
  rationale: Diễn đạt tự nhiên tính chất bất định và lặp lại của ὅταν với động từ hiện tại giả định.
- source_word: οὐκ ἔσεσθε ὡς οἱ ὑποκριταί
  choice: các con đừng như những kẻ đạo đức giả
  rationale: Dùng mệnh lệnh phủ định tự nhiên trong tiếng Việt để truyền đạt lực ngăn cấm của thì tương lai Hy Lạp; “đạo đức giả” là cách gọi thông dụng, đúng với sự phô diễn lòng mộ đạo trong ngữ cảnh.
- source_word: φιλοῦσιν
  choice: họ thích
  rationale: Trong ngữ cảnh, từ này chỉ sự ưa chuộng hành vi phô trương; “thích” tự nhiên hơn “yêu thích” mà vẫn giữ lực ý chí.
- source_word: ἐν ταῖς συναγωγαῖς
  choice: trong các hội đường
  rationale: Giữ nét lịch sử Do Thái của συναγωγή bằng thuật ngữ tiếng Việt quen dùng.
- source_word: ἐν ταῖς γωνίαις τῶν πλατειῶν
  choice: tại các góc đường lớn
  rationale: Phản ánh cả γωνίαις và πλατειῶν, đồng thời tự nhiên trong tiếng Việt hiện đại.
- source_word: ἑστῶτες προσεύχεσθαι
  choice: đứng cầu nguyện
  rationale: Giữ rõ tư thế được phân từ ἑστῶτες diễn tả mà không hàm ý việc đứng cầu nguyện tự thân là điều bị lên án.
- source_word: ὅπως φανῶσιν τοῖς ἀνθρώποις
  choice: để được người ta nhìn thấy
  rationale: Diễn đạt rõ mục đích và hiểu ἀνθρώποις theo nghĩa bao quát con người nói chung.
- source_word: ἀμὴν λέγω ὑμῖν
  choice: Thật, Thầy bảo các con
  rationale: Giữ sắc thái long trọng của công thức ἀμήν; đại từ xưng hô phù hợp lời Đức Giê-su nói với các môn đồ trong văn cảnh.
- source_word: ἀπέχουσι τὸν μισθὸν αὐτῶν
  choice: họ đã nhận đủ phần thưởng của mình
  rationale: '“Nhận đủ” truyền đạt thành ngữ thương mại của ἀπέχουσι: phần thưởng đã được lĩnh trọn, chứ không chỉ đang được nhận.'
theological_decisions:
- issue: Đối tượng được ἀνθρώποις chỉ đến
  choice: người ta
  alternative: người / loài người
  rationale: Ở đây danh từ Hy Lạp có nghĩa chung về những người quan sát, không chỉ nam giới.
- issue: Lực nghĩa của ἀπέχουσι đối với phần thưởng
  choice: đã nhận đủ phần thưởng
  alternative: đã nhận phần thưởng / có phần thưởng
  rationale: “Nhận đủ” giữ sắc thái thành ngữ thương mại có thể có của động từ, đồng thời chú thích để bảo toàn cách hiểu ít diễn giải hơn.
- issue: Cách xưng hô trong lời Đức Giê-su
  choice: Thầy… các con
  alternative: Ta… các ngươi / Tôi… anh em
  rationale: “Thầy… các con” trang trọng, dễ hiểu và phù hợp quan hệ giữa Đức Giê-su với các môn đồ, không thêm một khẳng định giáo phái.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Tránh lối cổ “các ngươi” và giữ hình ảnh cụ thể “các góc đường lớn”. Dấu chú thích [a] được đặt ngay sau mệnh đề liên quan.
