revisions:
- from: 'Mỗi khi cầu nguyện, các con đừng như những kẻ đạo đức giả, vì họ thích đứng cầu nguyện trong các hội đường và tại các góc đường lớn để được người ta nhìn thấy. Thật, Thầy bảo các con: họ đã nhận đủ phần thưởng của mình.[a]'
  to: 'Mỗi khi các con cầu nguyện, đừng như những kẻ đạo đức giả, vì họ thích đứng cầu nguyện trong các hội đường và tại các góc đường lớn để được người ta nhìn thấy. Thầy bảo thật các con: họ đã nhận đủ phần thưởng của mình.[a]'
  rationale: Chỉnh nhẹ để làm rõ chủ ngữ số nhiều trong mệnh đề thời gian và dùng trật tự từ tiếng Việt tự nhiên hơn cho lời khẳng định long trọng. Giữ “đã nhận đủ” cùng chú thích, vì cách diễn đạt này thích hợp với sắc thái thành ngữ của ἀπέχουσι mà không loại trừ cách dịch đơn giản hơn.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T02:43:32Z'
