id: MAT.6.4
reference: Matthew 6:4
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὅπως ᾖ σου ἡ ἐλεημοσύνη ἐν τῷ κρυπτῷ· καὶ ὁ πατήρ σου ὁ βλέπων ἐν τῷ ⸀κρυπτῷ ἀποδώσει ⸀σοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/004.yaml
  text: so that your giving to the poor may be in secret[b][a]; and your Father who sees in secret will reward you.
translation:
  language: vi
  text: để việc con giúp đỡ người nghèo được thực hiện trong kín đáo; và Cha con, Đấng thấy trong kín đáo, sẽ ban thưởng cho con.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “sẽ báo đáp con.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπως ᾖ
  choice: để ... được
  rationale: Diễn đạt tự nhiên mục đích của ὅπως đi với động từ giả định ᾖ, đồng thời nối trực tiếp với lời dạy ở câu trước.
- source_word: ἡ ἐλεημοσύνη σου
  choice: việc con giúp đỡ người nghèo
  rationale: ἐλεημοσύνη ở đây chỉ việc bố thí, cụ thể là giúp đỡ người nghèo; cách dịch này rõ nghĩa hơn từ Hán-Việt truyền thống “bố thí” và không mở rộng thành hoạt động từ thiện nói chung.
- source_word: ἐν τῷ κρυπτῷ
  choice: được giữ kín / điều kín giấu
  rationale: Thành ngữ nói đến điều không phô bày trước công chúng. Tiếng Việt cần điều chỉnh nhẹ theo từng mệnh đề để tự nhiên, nhưng vẫn giữ sự lặp lại có chủ ý của cùng một ý niệm.
- source_word: ὁ πατήρ σου
  choice: Cha của con
  rationale: Giữ đúng bản Hy Lạp chỉ nói “Cha của con”, không thêm “trên trời” từ văn cảnh lân cận.
- source_word: ὁ βλέπων
  choice: Đấng nhìn thấy
  rationale: Chuyển phân từ có mạo từ thành cụm đồng vị tự nhiên và trang trọng trong tiếng Việt.
- source_word: ἀποδώσει σοι
  choice: sẽ ban thưởng cho con
  rationale: Trong ngữ cảnh này, động từ chỉ sự đáp lại tích cực của Đức Chúa Trời; “ban thưởng” tự nhiên và không xác định phần thưởng thuộc loại nào.
theological_decisions:
- issue: Bản chất sự đáp lại của Đức Chúa Trời trong ἀποδώσει
  choice: sẽ ban thưởng cho con
  alternative: sẽ báo đáp con
  rationale: “Ban thưởng” truyền đạt ý nghĩa tích cực trong văn cảnh nhưng không xác định đó là phần thưởng vật chất, thuộc linh, đời này hay đời sau. Chú thích giữ lại nghĩa sát hơn là “báo đáp”.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “con” để phù hợp lời Đức Giê-su trực tiếp dạy môn đồ và cách xưng hô với Cha; tránh từ “bố thí” vì trong tiếng Việt hiện nay có thể gợi sắc thái ban ơn hoặc miệt thị. Dấu chú thích đặt ngay sau mệnh đề liên quan.
