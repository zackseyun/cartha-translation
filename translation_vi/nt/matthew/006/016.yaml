id: MAT.6.16
reference: Matthew 6:16
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ὅταν δὲ νηστεύητε, μὴ γίνεσθε ⸀ὡς οἱ ὑποκριταὶ σκυθρωποί, ἀφανίζουσιν γὰρ τὰ πρόσωπα αὐτῶν ὅπως φανῶσιν τοῖς ἀνθρώποις νηστεύοντες· ἀμὴν λέγω ⸀ὑμῖν, ἀπέχουσιν τὸν μισθὸν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/016.yaml
  text: And whenever you fast[a], do not become gloomy like the hypocrites, for they disfigure their faces so that they may appear to people to be fasting. Truly I say to you, they have received their reward in full.
translation:
  language: vi
  text: 'Mỗi khi các con ăn chay, đừng có vẻ buồn rầu như những kẻ đạo đức giả, vì họ làm cho khuôn mặt mình tiều tụy để người ta thấy rằng họ đang ăn chay. Thật, Thầy bảo các con: họ đã nhận đủ phần thưởng của mình rồi.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὅταν δὲ νηστεύητε
  choice: Khi ăn chay
  rationale: Ὅταν với động từ giả định chỉ một hoàn cảnh có thể lặp lại. Trong tiếng Việt, “khi” tự nhiên và đủ sức diễn đạt ý “mỗi khi”; δὲ nối tiếp các lời dạy song song trước đó nên không cần dịch thành một từ riêng.
- source_word: μὴ γίνεσθε ... σκυθρωποί
  choice: đừng làm ra vẻ buồn rầu
  rationale: γίνεσθε có sắc thái mang lấy hoặc biểu lộ một trạng thái; trong ngữ cảnh phô bày lòng sùng đạo, “làm ra vẻ” tự nhiên hơn cách dịch sát cứng “đừng trở nên” và kết hợp rõ với σκυθρωποί.
- source_word: ὡς οἱ ὑποκριταί
  choice: như những kẻ đạo đức giả
  rationale: ὑποκριτής ở đây chỉ người phô diễn lòng đạo không chân thật. “Kẻ đạo đức giả” là cách nói hiện đại, rõ nghĩa và phù hợp ngữ cảnh.
- source_word: ἀφανίζουσιν ... τὰ πρόσωπα αὐτῶν
  choice: họ làm cho khuôn mặt mình tiều tụy
  rationale: Động từ có thể gợi ý làm biến dạng, làm khó nhận ra hoặc cố tình bỏ bê diện mạo. “Làm cho ... tiều tụy” giữ hình ảnh cụ thể của khuôn mặt và truyền đạt dấu hiệu ăn chay được cố ý phô ra mà không xác quyết chính xác phương thức.
- source_word: ὅπως φανῶσιν τοῖς ἀνθρώποις νηστεύοντες
  choice: để người ta thấy rằng họ đang ăn chay
  rationale: ὅπως biểu thị mục đích; φανῶσιν có nghĩa được thấy hoặc hiện ra. “Người ta” diễn đạt tự nhiên nghĩa khái quát của τοῖς ἀνθρώποις trong tiếng Việt.
- source_word: ἀμὴν λέγω ὑμῖν
  choice: Thật, Thầy bảo các con
  rationale: Giữ sức nặng khẳng định của ἀμήν. Trong diễn ngôn của Chúa Giê-su với các môn đồ, “Thầy—các con” là lối xưng hô tự nhiên, trang trọng và dễ hiểu.
- source_word: ἀπέχουσιν τὸν μισθὸν αὐτῶν
  choice: họ đã nhận đủ phần thưởng của mình rồi
  rationale: ἀπέχω là thuật ngữ biên nhận, hàm ý đã được thanh toán đầy đủ. “Đã nhận đủ ... rồi” chuyển tải trọn vẹn sắc thái hoàn tất và không còn phần nào khác.
theological_decisions:
- issue: Phạm vi của τοῖς ἀνθρώποις
  choice: người ta
  alternative: mọi người; người đời
  rationale: Danh từ Hy Lạp chỉ con người nói chung, không chỉ nam giới. “Người ta” giữ nghĩa bao quát và phù hợp với lời nói tự nhiên trong tiếng Việt.
- issue: Sắc thái của ἀπέχουσιν τὸν μισθὸν αὐτῶν
  choice: đã nhận đủ phần thưởng của mình rồi
  alternative: đã có phần thưởng của mình; đang nhận phần thưởng của mình
  rationale: Cụm từ mang sắc thái thương mại về việc nhận đủ khoản thanh toán. Bản dịch giữ sự căng thẳng của đoạn văn giữa sự công nhận trước mắt của con người và phần thưởng khác được hàm ý, nhưng không diễn giải thêm nguồn ban thưởng.
- issue: Cách diễn đạt ἀφανίζουσιν về diện mạo
  choice: làm cho khuôn mặt mình tiều tụy
  alternative: làm biến dạng khuôn mặt; bỏ bê diện mạo
  rationale: Nguyên ngữ cho phép nhiều cách hiểu về việc cố ý làm xấu hoặc làm khác diện mạo. Lựa chọn này truyền đạt hiệu quả bên ngoài mà không thêm một nghi thức ăn chay cụ thể.
translation_notes:
  register: Văn phong hiện đại, trang trọng nhưng gần gũi. Câu văn giữ cấu trúc đối chiếu và giọng cảnh báo trực tiếp. Không dùng chú thích vì các điểm từ vựng chính có thể được diễn đạt rõ ngay trong chính văn.
