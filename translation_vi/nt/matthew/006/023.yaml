  source_fidelity: 'Bản dịch giữ sát cấu trúc và hình ảnh của bản Hy Lạp: điều kiện với “mắt,” hệ quả toàn thân tối tăm, rồi nghịch lý “ánh sáng trong con” là “bóng tối” và lời cảm thán kết thúc. “Mắt con xấu” tương ứng với πονηρός theo cách đủ rộng, không quyết định trước là bệnh tật, gian ác hay keo kiệt. “Lớn biết bao” truyền đạt đúng lực cảm thán về mức độ của πόσον.'
