  terminology: “Mắt,” “thân thể,” “ánh sáng,” và “bóng tối” nhất quán, cụ thể, và không diễn giải ẩn dụ thành một lập trường thần học. Chú thích giải thích các khả năng của πονηρός mà vẫn để chính văn mở. Đại từ “con” phù hợp với ngữ vực lời dạy trực tiếp đã chọn trong bản dịch.
