id: MAT.6.23
reference: Matthew 6:23
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐὰν δὲ ὁ ὀφθαλμός σου πονηρὸς ᾖ, ὅλον τὸ σῶμά σου σκοτεινὸν ἔσται. εἰ οὖν τὸ φῶς τὸ ἐν σοὶ σκότος ἐστίν, τὸ σκότος πόσον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/023.yaml
  text: But if your eye is bad[a], your whole body will be dark. If then the light in you is darkness, how great is the darkness!
translation:
  language: vi
  text: Nhưng nếu mắt con xấu[a], cả thân thể con sẽ tối tăm. Vậy, nếu ánh sáng trong con lại là bóng tối, thì bóng tối ấy lớn biết bao!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “ác,” “không lành mạnh,” hoặc có thể mang nghĩa “keo kiệt” theo thành ngữ về “con mắt” và văn cảnh chung quanh.
    reason: lexical_alternative
lexical_decisions:
- source_word: πονηρὸς
  choice: xấu
  rationale: '“Xấu” giữ được phạm vi nghĩa rộng của từ Hy Lạp: có thể chỉ điều ác, tình trạng không lành mạnh hoặc, theo thành ngữ về “con mắt,” thái độ keo kiệt. Cách dịch này không thu hẹp ẩn dụ quá mức.'
- source_word: σκοτεινὸν
  choice: tối tăm
  rationale: Diễn đạt tự nhiên trạng thái chìm trong tối của toàn thân, đồng thời giữ quan hệ trực tiếp với “bóng tối” ở vế sau.
- source_word: φῶς
  choice: ánh sáng
  rationale: Giữ nguyên hình ảnh ánh sáng thay vì giải thích thành nhận thức hay sự soi sáng nội tâm.
- source_word: σκότος
  choice: bóng tối
  rationale: Giữ sự tương phản và nghịch lý với “ánh sáng,” cũng như sức nhấn trong câu kết.
- source_word: πόσον
  choice: lớn biết bao
  rationale: Chuyển tải tự nhiên sắc thái cảm thán về mức độ trong mệnh đề tỉnh lược của tiếng Hy Lạp.
- source_word: ὀφθαλμός
  choice: mắt
  rationale: Giữ danh từ cụ thể làm nền cho ẩn dụ về sự nhận biết, ý hướng và khuynh hướng đạo đức.
- source_word: ὅλον τὸ σῶμά σου
  choice: cả thân thể con
  rationale: Giữ ý nghĩa toàn thể của ὅλον bằng một cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: τὸ φῶς τὸ ἐν σοὶ
  choice: ánh sáng trong con
  rationale: Bám sát cấu trúc Hy Lạp và không diễn giải quá mức thành “ánh sáng nội tâm.”
theological_decisions:
- issue: Ý nghĩa của hình ảnh “mắt xấu”
  choice: Giữ cách nói rộng “mắt con xấu” trong chính văn.
  alternative: Có thể hiểu là “mắt ác,” “mắt không lành mạnh,” hoặc theo thành ngữ là “mắt keo kiệt.”
  rationale: Văn cảnh Ma-thi-ơ 6:19–24 cho phép các sắc thái chồng lấn về sự bại hoại đạo đức, nhận thức sai lệch và có thể cả thái độ không rộng rãi. Bản dịch không nên âm thầm chọn riêng một cách hiểu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “con” phù hợp với lời dạy trực tiếp trong văn cảnh. Dùng “lại là” để biểu đạt tự nhiên nghịch lý của câu điều kiện mà không thêm một cách giải nghĩa thần học.
