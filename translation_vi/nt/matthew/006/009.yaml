source:
  edition: SBLGNT
  text: Οὕτως οὖν προσεύχεσθε ὑμεῖς· Πάτερ ἡμῶν ὁ ἐν τοῖς οὐρανοῖς· ἁγιασθήτω τὸ ὄνομά σου,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/009.yaml
  text: 'Therefore[a], you should pray like this: Our Father in the heavens, may your name be treated as holy[b],'
translation:
  language: vi
  text: 'Vậy, anh em hãy cầu nguyện như thế này: “Lạy Cha chúng con, Đấng ở trong các tầng trời,[a] nguyện danh Cha được tôn là thánh.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Theo truyền thống có thể dịch: “ở trên trời.” Tiếng Hy Lạp dùng dạng số nhiều, sát hơn là “ở trong các tầng trời.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch sát hình thức hơn: “nguyện danh Cha được thánh hóa.” Lời cầu xin hướng đến việc danh Cha được nhìn nhận và tôn kính là thánh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὕτως
  choice: như thế này
  rationale: Diễn tả cách thức hay khuôn mẫu cầu nguyện; cách nói này tự nhiên trong tiếng Việt hiện đại và không hàm ý chỉ phải lặp nguyên văn.
- source_word: οὖν
  choice: Vậy
  rationale: Giữ quan hệ suy luận với lời dạy ngay trước đó bằng một liên từ gọn, tự nhiên.
- source_word: προσεύχεσθε ὑμεῖς
  choice: anh em hãy cầu nguyện
  rationale: “Hãy” thể hiện mệnh lệnh; “anh em” diễn đạt đại từ số nhiều chỉ các môn đồ trong văn phong Kinh Thánh hiện đại. Đại từ ὑμεῖς được thể hiện rõ, dù sắc thái nhấn mạnh không được cường điệu.
- source_word: Πάτερ ἡμῶν
  choice: Lạy Cha chúng con
  rationale: “Lạy” đánh dấu lời thưa trực tiếp một cách tự nhiên và trang trọng; “chúng con” giữ tính cộng đồng của đại từ số nhiều.
- source_word: ὁ ἐν τοῖς οὐρανοῖς
  choice: Đấng ở trên các tầng trời
  rationale: “Đấng” làm rõ cấu trúc chỉ Đấng đang được thưa với; “các tầng trời” giữ dạng số nhiều của οὐρανοῖς. “Ở” tránh thêm sắc thái vương quyền không có trực tiếp trong động từ được lược của tiếng Hy Lạp.
- source_word: ἁγιασθήτω
  choice: nguyện ... được tôn là thánh
  rationale: Diễn đạt mệnh lệnh thụ động ngôi ba như một lời cầu xin, đồng thời truyền đạt ý danh Đức Chúa Trời được nhìn nhận và tôn kính là thánh bằng tiếng Việt dễ hiểu.
- source_word: τὸ ὄνομά σου
  choice: danh Cha
  rationale: Giữ hình ảnh “danh” của nguyên văn; lặp “Cha” tự nhiên hơn “danh của Ngài” trong lời cầu nguyện trực tiếp và tránh thay đổi ngôi xưng hô.
theological_decisions:
- issue: Cách dịch địa chỉ thần linh và dạng số nhiều “các tầng trời”
  choice: Lạy Cha chúng con, Đấng ở trên các tầng trời
  alternative: Lạy Cha chúng con ở trên trời
  rationale: Bản dịch chính giữ số nhiều τοῖς οὐρανοῖς và cả sự gần gũi của “Cha” lẫn tính siêu việt của Đấng ở trên các tầng trời. Bản dịch truyền thống ở số ít được ghi ở chú thích để người đọc nhận biết.
- issue: Ý nghĩa của ἁγιασθήτω đối với danh Đức Chúa Trời
  choice: nguyện danh Cha được tôn là thánh
  alternative: nguyện danh Cha được thánh hóa
  rationale: Cách chọn tránh gợi ý rằng danh Đức Chúa Trời vốn chưa thánh, nhưng vẫn giữ thể thụ động và hình thức lời nguyện. Chú thích nêu cách dịch sát hình thức hơn để không che khuất độ rộng nghĩa của nguyên ngữ.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Câu dịch giữ nhịp của một lời cầu nguyện, dùng “Lạy” và “nguyện” vì đây vẫn là những từ thông dụng trong ngữ cảnh thưa cầu trang nghiêm; tránh từ cổ “nguyện danh Cha cả sáng” và tránh “các ngươi”.
