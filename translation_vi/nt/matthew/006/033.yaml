id: MAT.6.33
reference: Matthew 6:33
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ζητεῖτε δὲ πρῶτον τὴν ⸀βασιλείαν καὶ τὴν δικαιοσύνην αὐτοῦ, καὶ ταῦτα πάντα προστεθήσεται ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/033.yaml
  text: But seek first his kingdom and his righteousness[a], and all these things will be added to you.
translation:
  language: vi
  text: Nhưng trước hết, hãy tìm kiếm vương quốc của Ngài và sự công chính của Ngài[a], thì tất cả những điều ấy cũng sẽ được thêm cho anh em.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “công lý của Ngài”. Từ Hy Lạp có thể chỉ sự công chính hoặc công lý; ở đây, “sự công chính” được dùng vì ngữ cảnh bao gồm cả địa vị đúng đắn và cách sống ngay thẳng trước Đức Chúa Trời, chứ không chỉ công lý trong xã hội hay xét xử.
    reason: lexical_alternative
lexical_decisions:
- source_word: ζητεῖτε
  choice: hãy tìm kiếm
  rationale: Động từ mệnh lệnh hiện tại số nhiều diễn tả sự chủ động và có thể hàm ý tiếp diễn. “Hãy tìm kiếm” tự nhiên, rõ nghĩa và không diễn giải quá mức.
- source_word: δὲ
  choice: Nhưng
  rationale: Liên từ đánh dấu sự tương phản với việc lo lắng và chạy theo các nhu cầu vật chất trong ngữ cảnh trước.
- source_word: πρῶτον
  choice: trước hết
  rationale: Giữ được cả nghĩa thứ tự lẫn ý ưu tiên hàng đầu mà không cần diễn giải thành một cụm dài hơn.
- source_word: βασιλείαν
  choice: vương quốc
  rationale: βασιλεία có thể chỉ vương quốc hoặc quyền trị vì. “Vương quốc” là cách dịch quen thuộc trong sách Ma-thi-ơ và vẫn có thể bao hàm sự cai trị của Đức Chúa Trời.
- source_word: δικαιοσύνην
  choice: sự công chính
  rationale: Cụm từ bao gồm tình trạng ngay thẳng và lối sống phù hợp với ý muốn Đức Chúa Trời; “sự công chính” giữ được bề rộng ấy hơn cách chỉ nhấn mạnh công lý.
- source_word: αὐτοῦ
  choice: của Ngài
  rationale: Giữ hình thức đại từ của tiếng Hy Lạp; trong ngữ cảnh, đại từ này quy chiếu về Đức Chúa Trời/Cha.
- source_word: ταῦτα πάντα
  choice: tất cả những điều ấy
  rationale: Chỉ lại các nhu cầu vật chất vừa được nhắc đến, gồm thức ăn, thức uống và quần áo.
- source_word: προστεθήσεται
  choice: cũng sẽ được thêm
  rationale: Giữ sắc thái tương lai bị động và ý những điều ấy được ban thêm bên cạnh điều phải ưu tiên tìm kiếm.
- source_word: ὑμῖν
  choice: cho anh em
  rationale: Diễn đạt trực tiếp cách dùng tặng cách số nhiều. “Anh em” là đại từ số nhiều trang trọng, tự nhiên trong văn phong Kinh Thánh tiếng Việt.
theological_decisions:
- issue: Cách dịch δικαιοσύνη
  choice: sự công chính
  alternative: công lý
  rationale: Trong ngữ cảnh Ma-thi-ơ, từ này bao quát sự ngay thẳng trước Đức Chúa Trời và cách sống hợp với ý Ngài; “công lý” có thể làm nghĩa bị thu hẹp. Phương án kia được ghi ở chú thích.
- issue: Đối tượng sở hữu của αὐτοῦ
  choice: của Ngài
  alternative: của Đức Chúa Trời
  rationale: Bản chính giữ đại từ như nguyên văn để tránh minh giải không cần thiết, dù ngữ cảnh cho thấy đối tượng quy chiếu là Đức Chúa Trời/Cha.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Câu giữ cấu trúc đối lập và thứ tự ưu tiên của nguyên văn; dùng “anh em” để thể hiện đối tượng số nhiều.
