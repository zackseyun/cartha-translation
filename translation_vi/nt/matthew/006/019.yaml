id: MAT.6.19
reference: Matthew 6:19
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Μὴ θησαυρίζετε ὑμῖν θησαυροὺς ἐπὶ τῆς γῆς, ὅπου σὴς καὶ βρῶσις ἀφανίζει, καὶ ὅπου κλέπται διορύσσουσιν καὶ κλέπτουσιν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/019.yaml
  text: Do not store up for yourselves treasures on earth[a], where moth and decay destroy[b], and where thieves break in and steal.
translation:
  language: vi
  text: Đừng tích trữ cho mình của cải trên đất, nơi mối mọt và sự hư hoại[a] làm tiêu tan, và nơi kẻ trộm khoét vách[b] và lấy cắp.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “gỉ sét”; từ Hy Lạp có thể chỉ rộng hơn sự ăn mòn, tiêu hao hoặc hư hoại, chứ không chỉ sự gỉ của kim loại.
    reason: lexical_alternative
  - marker: b
    text: Nguyên văn là “đào xuyên qua” hoặc “khoét xuyên qua”, có lẽ nói đến việc kẻ trộm khoét qua vách nhà bằng đất.
    reason: cultural_note
lexical_decisions:
- source_word: Μὴ θησαυρίζετε
  choice: Đừng tích trữ
  rationale: Mệnh lệnh hiện tại đi với μή diễn đạt lời cấm; “tích trữ” tự nhiên trong tiếng Việt hiện đại và giữ được ý gom góp, dành dụm.
- source_word: ὑμῖν
  choice: cho mình
  rationale: Đại từ tặng cách mang nghĩa phản thân trong ngữ cảnh, chỉ việc tích trữ vì lợi ích hoặc làm sở hữu riêng của người nghe.
- source_word: θησαυροὺς
  choice: của cải
  rationale: Trong ngữ cảnh, từ này chỉ những vật có giá trị được tích lũy. “Của cải” tự nhiên hơn “kho báu” khi nói về tài sản mà mối mọt, hư hoại và trộm cắp có thể làm mất.
- source_word: ἐπὶ τῆς γῆς
  choice: trên đất
  rationale: Giữ ý chỉ phạm vi trần thế, tương phản với trời trong câu kế tiếp, đồng thời là cách nói gọn và tự nhiên.
- source_word: σὴς
  choice: mối mọt
  rationale: Chỉ loài côn trùng phá hoại quần áo hoặc hàng hóa cất giữ; cách nói ghép “mối mọt” quen thuộc trong tiếng Việt và truyền đạt rõ sự hủy hoại.
- source_word: βρῶσις
  choice: sự mục nát
  rationale: Danh từ có nghĩa rộng về sự ăn mòn, tiêu hao hoặc hư hoại, không nhất thiết chỉ là gỉ kim loại. “Sự mục nát” giữ được phạm vi rộng ấy.
- source_word: ἀφανίζει
  choice: phá hủy
  rationale: Động từ chỉ việc làm cho biến mất hoặc trở nên tiêu tan, hư hỏng; “phá hủy” phù hợp với cả mối mọt lẫn sự mục nát.
- source_word: κλέπται
  choice: kẻ trộm
  rationale: Tương đương trực tiếp, rõ nghĩa trong tiếng Việt hiện đại.
- source_word: διορύσσουσιν
  choice: khoét vách
  rationale: Động từ theo nghĩa đen là đào hoặc khoét xuyên qua; trong bối cảnh nhà có vách đất, “khoét vách” vừa cụ thể vừa tự nhiên.
- source_word: κλέπτουσιν
  choice: lấy cắp
  rationale: Diễn đạt trực tiếp hành vi trộm lấy tài sản và tránh lặp từ “trộm” quá sát.
theological_decisions:
- issue: Phạm vi của γῆ trong sự tương phản với trời
  choice: trên đất
  alternative: ở trần gian
  rationale: “Trên đất” giữ hình ảnh không gian cụ thể và sự tương phản với trời ở câu kế tiếp mà không thêm một hệ thống thần học ngoài văn bản.
- issue: Cách hiểu βρῶσις
  choice: sự mục nát
  alternative: gỉ sét
  rationale: Từ Hy Lạp có thể bao quát sự ăn mòn hoặc tiêu hao rộng hơn hiện tượng ôxy hóa kim loại. Bản dịch chính giữ nghĩa rộng, còn khả năng “gỉ sét” được nêu trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Cho mình” có nghĩa phản thân chung dành cho số nhiều người nghe. Cấu trúc song song “nơi… cũng là nơi…” giữ nhịp của câu Hy Lạp; các chú thích bảo tồn độ rộng nghĩa của βρῶσις và hình ảnh văn hóa trong διορύσσουσιν.
