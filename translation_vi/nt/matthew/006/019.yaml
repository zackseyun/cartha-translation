revisions:
- from: Đừng tích trữ cho mình của cải trên đất, nơi mối mọt và sự mục nát[a] phá hủy, cũng là nơi kẻ trộm khoét vách[b] và lấy cắp.
  to: Đừng tích trữ cho mình của cải trên đất, nơi mối mọt và sự hư hoại[a] làm tiêu tan, và nơi kẻ trộm khoét vách[b] và lấy cắp.
  rationale: Bản sửa dùng “sự hư hoại” để giữ độ rộng nghĩa của βρῶσις, thay động từ bằng “làm tiêu tan” để diễn đạt tự nhiên ἀφανίζει, và phục hồi liên kết song hành trực tiếp “và nơi” tương ứng với καὶ ὅπου. Các chú thích và neo chú thích được giữ nguyên, đúng vị trí và đúng chức năng.
