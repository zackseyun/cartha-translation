id: MAT.6.2
reference: Matthew 6:2
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ὅταν οὖν ποιῇς ἐλεημοσύνην, μὴ σαλπίσῃς ἔμπροσθέν σου, ὥσπερ οἱ ὑποκριταὶ ποιοῦσιν ἐν ταῖς συναγωγαῖς καὶ ἐν ταῖς ῥύμαις, ὅπως δοξασθῶσιν ὑπὸ τῶν ἀνθρώπων· ἀμὴν λέγω ὑμῖν, ἀπέχουσιν τὸν μισθὸν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/002.yaml
  text: Therefore[a], whenever you give alms, do not sound a trumpet before you, as the hypocrites do in the synagogues and in the streets, so that they may be glorified by people. Truly I say to you[e][d][c][b], they have received their reward in full.
translation:
  language: vi
  text: 'Vậy, mỗi khi con bố thí[a], đừng thổi kèn trước mặt mình[b] như những kẻ đạo đức giả thường làm trong các hội đường và trên các đường phố, để được người ta tôn vinh[c]. Thật, Ta bảo các con: họ đã nhận đủ phần thưởng của mình rồi[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “giúp đỡ người nghèo” hoặc “làm việc thương xót.” Cụm từ Hy Lạp nói đến việc dùng của cải để cứu giúp người túng thiếu.'
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn: “đừng thổi kèn trước mặt mình.” Hình ảnh này có thể là lối nói cường điệu hoặc ẩn dụ về việc phô trương, loan báo việc mình làm.'
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể dịch: “được người ta ca ngợi” hoặc “tôn trọng.” Động từ Hy Lạp theo nghĩa sát là “được tôn vinh.”'
    reason: lexical_alternative
  - marker: d
    text: Cụm “đã nhận đủ phần thưởng” dùng một thành ngữ thương mại, hàm ý họ đã nhận trọn tất cả phần thưởng mà họ sẽ được nhận.
    reason: cultural_note
lexical_decisions:
- source_word: Ὅταν οὖν
  choice: Vậy, mỗi khi
  rationale: “Vậy” giữ mối liên hệ suy luận/tiếp nối của οὖν; “mỗi khi” diễn đạt mệnh đề thời gian bất định với động từ ở thể giả định.
- source_word: ποιῇς ἐλεημοσύνην
  choice: con bố thí
  rationale: Thành ngữ chỉ việc giúp đỡ người nghèo bằng của cải. “Bố thí” ngắn gọn, quen thuộc trong tiếng Việt và không giới hạn hành động vào một hình thức cụ thể.
- source_word: μὴ σαλπίσῃς ἔμπροσθέν σου
  choice: đừng thổi kèn trước mặt mình
  rationale: Giữ nguyên hình ảnh mạnh và có thể mang tính cường điệu của nguyên văn; “trước mặt mình” diễn đạt tự nhiên hướng quy chiếu về chủ thể.
- source_word: οἱ ὑποκριταὶ
  choice: những kẻ đạo đức giả
  rationale: Trong ngữ cảnh phô diễn lòng đạo để được nhìn nhận, cụm này rõ nghĩa hơn từ vay mượn hoặc cách dịch thiên về nghề diễn.
- source_word: ἐν ταῖς συναγωγαῖς καὶ ἐν ταῖς ῥύμαις
  choice: trong các hội đường và ngoài đường phố
  rationale: “Hội đường” là cách gọi quen thuộc cho nơi nhóm họp Do Thái; ῥύμαις chỉ các đường hoặc ngõ công cộng, nên “ngoài đường phố” tự nhiên trong tiếng Việt.
- source_word: ὅπως δοξασθῶσιν ὑπὸ τῶν ἀνθρώπων
  choice: để được người ta tôn vinh
  rationale: “Để” giữ ý mục đích; “tôn vinh” bảo toàn sắc thái mạnh của δοξάζω, còn “người ta” diễn đạt nghĩa chỉ con người nói chung.
- source_word: ἀμὴν λέγω ὑμῖν
  choice: Thật, Ta bảo các con
  rationale: Giữ tính trang trọng và thẩm quyền của công thức tuyên bố, đồng thời dùng lối nói tự nhiên, dễ hiểu trong tiếng Việt.
- source_word: ἀπέχουσιν τὸν μισθὸν αὐτῶν
  choice: họ đã nhận đủ phần thưởng của mình rồi
  rationale: ἀπέχουσιν có sắc thái thương mại là đã nhận đủ hoặc nhận trọn; thêm “đủ” và “rồi” làm rõ rằng đó là toàn bộ phần thưởng họ sẽ có.
theological_decisions:
- issue: Sắc thái của δοξασθῶσιν
  choice: được người ta tôn vinh
  alternative: được người ta ca ngợi / khen ngợi
  rationale: “Tôn vinh” giữ sức nặng của động từ Hy Lạp và sự căng thẳng giữa vinh dự do con người ban với phần thưởng được nói đến trong ngữ cảnh, mà không diễn giải quá mức.
- issue: Ý nghĩa của ἀπέχουσιν trong lời phán về phần thưởng
  choice: đã nhận đủ phần thưởng của mình rồi
  alternative: đã có phần thưởng của mình
  rationale: Bản dịch giữ thành ngữ thương mại hàm ý món nợ đã được thanh toán đầy đủ, tránh ngụ ý rằng họ còn một phần thưởng khác chưa nhận.
- issue: Phạm vi của ἀνθρώπων
  choice: người ta
  alternative: người đời / mọi người
  rationale: Danh từ ở đây chỉ người quan sát nói chung, không riêng nam giới; “người ta” vừa trung tính vừa tự nhiên.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và trực tiếp. Dùng “Ta—các con” cho lời Đức Giê-su nói với các môn đệ; giữ hình ảnh “thổi kèn” và động từ mạnh “tôn vinh,” đồng thời dùng chú thích để bảo toàn các khả năng diễn đạt khác.
