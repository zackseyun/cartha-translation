id: MAT.6.18
reference: Matthew 6:18
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὅπως μὴ φανῇς τοῖς ἀνθρώποις νηστεύων ἀλλὰ τῷ πατρί σου τῷ ἐν τῷ ⸀κρυφαίῳ· καὶ ὁ πατήρ σου ὁ βλέπων ἐν τῷ ⸁κρυφαίῳ ἀποδώσει σοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/018.yaml
  text: so that you may not appear to men to be fasting[a], but to your Father who is in secret[b]; and your Father who sees in secret will reward you.
translation:
  language: vi
  text: để con không tỏ ra trước mặt người ta là đang kiêng ăn, nhưng trước mặt Cha con, Đấng ở nơi kín đáo; và Cha con, Đấng thấy ở nơi kín đáo, sẽ ban thưởng cho con.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅπως
  choice: để
  rationale: Diễn đạt mục đích một cách tự nhiên, đồng thời giữ lực chỉ mục đích của liên từ Hy Lạp.
- source_word: μὴ φανῇς τοῖς ἀνθρώποις νηστεύων
  choice: việc con kiêng ăn không lộ ra trước mặt người ta
  rationale: Chuyển cấu trúc Hy Lạp sang tiếng Việt tự nhiên nhưng vẫn giữ ý không để những người quan sát nhận thấy việc kiêng ăn. “Người ta” chỉ con người nói chung, không riêng nam giới.
- source_word: ἀλλὰ τῷ πατρί σου
  choice: mà chỉ trước mặt Cha con
  rationale: Làm rõ sự tương phản giữa người đời và Cha; “chỉ” được hàm ý bởi kết cấu phủ định–tương phản μὴ…ἀλλά, không hàm ý rằng Đức Chúa Cha cần một màn trình diễn bề ngoài.
- source_word: τῷ ἐν τῷ κρυφαίῳ
  choice: Đấng ở nơi kín đáo
  rationale: Giữ hình ảnh về sự hiện diện kín nhiệm của Cha và liên kết với lần lặp lại của κρυφαίῳ ở vế sau.
- source_word: ὁ βλέπων ἐν τῷ κρυφαίῳ
  choice: Đấng thấy trong nơi kín đáo
  rationale: Giữ sát cấu trúc ngắn gọn của nguyên văn, không thêm tân ngữ “những việc được làm” vốn chỉ là điều được ngầm hiểu.
- source_word: ἀποδώσει σοι
  choice: sẽ ban thưởng cho con
  rationale: Trong ngữ cảnh thực hành đạo đức và sự đáp lại của Đức Chúa Trời, ἀποδίδωμι mang nghĩa thưởng đáp; “ban thưởng” rõ ràng và trang trọng trong tiếng Việt.
theological_decisions:
- issue: Phạm vi nghĩa của τοῖς ἀνθρώποις
  choice: “người ta”, chỉ những người quan sát nói chung
  alternative: “người đời” hoặc “mọi người”
  rationale: Danh từ Hy Lạp ở đây mang nghĩa khái quát về con người, không giới hạn ở nam giới; “người ta” vừa chính xác vừa tự nhiên.
- issue: Ý nghĩa của κρυφαίῳ trong hai lần xuất hiện
  choice: Giữ nhất quán trường nghĩa “nơi kín đáo”
  alternative: “chỗ riêng tư” hoặc trạng từ “kín nhiệm”
  rationale: Cách dịch nhất quán bảo toàn mối liên hệ tu từ giữa sự hiện diện kín nhiệm của Cha và việc Ngài thấy điều diễn ra trong chỗ kín, mà không xác định quá mức đó là một địa điểm cụ thể.
- issue: Sự tương phản μὴ…ἀλλά
  choice: Diễn đạt “không… mà chỉ…”
  alternative: 'Giữ phép tỉnh lược sát chữ: “không tỏ ra cho người ta… nhưng cho Cha con”'
  rationale: Bản dịch được chọn làm rõ hai đối tượng tương phản và tránh câu tiếng Việt gượng gạo, trong khi không biến việc kiêng ăn thành một hành vi phô diễn trước Đức Chúa Cha.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “con” theo ngữ cảnh lời Đức Chúa Giê-su trực tiếp dạy môn đồ; viết hoa “Cha” và “Đấng” để chỉ Đức Chúa Trời. Lặp “nơi kín đáo” nhằm bảo toàn phép lặp có chủ ý trong nguyên văn.
