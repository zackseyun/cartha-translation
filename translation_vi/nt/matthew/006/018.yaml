- from: để việc con kiêng ăn không lộ ra trước mặt người ta, mà chỉ trước mặt Cha con, Đấng ở nơi kín đáo; và Cha con, Đấng thấy trong nơi kín đáo, sẽ ban thưởng cho con.
  to: để con không tỏ ra trước mặt người ta là đang kiêng ăn, nhưng trước mặt Cha con, Đấng ở nơi kín đáo; và Cha con, Đấng thấy ở nơi kín đáo, sẽ ban thưởng cho con.
  rationale: Sửa an toàn nhằm phục hồi chủ thể ngôi hai của nguyên văn trong vế đầu và thay cụm từ không tự nhiên ở vế sau. Bản sửa không thêm ý về điều Cha thấy, không áp đặt cách hiểu giáo phái, và duy trì sự lặp lại có chủ ý của “nơi kín đáo.”
