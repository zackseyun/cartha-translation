  text: καὶ μὴ εἰσενέγκῃς ἡμᾶς εἰς πειρασμόν, ἀλλὰ ῥῦσαι ἡμᾶς ἀπὸ τοῦ ⸀πονηροῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/013.yaml
  text: And do not lead us into temptation[b][a], but deliver us from evil.
translation:
  language: vi
  text: Xin đừng dẫn chúng con vào sự cám dỗ[a], nhưng xin giải cứu chúng con khỏi điều ác[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “sự thử thách” hoặc “cơn thử luyện”. Từ Hy Lạp có thể chỉ sự cám dỗ hoặc một hoàn cảnh thử thách.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “Kẻ Ác” hoặc “sự dữ”. Cụm từ Hy Lạp có thể được hiểu là một nhân vật (“Kẻ Ác”) hoặc cái ác nói chung.
    reason: alternative_reading
lexical_decisions:
- source_word: μὴ εἰσενέγκῃς
  choice: xin đừng dẫn
  rationale: Cách diễn đạt này giữ nguyên lời cầu xin trực tiếp của cấu trúc μή với động từ ở thể giả định aorist, không diễn giải thành “đừng để chúng con bị dẫn” hay “đừng để chúng con sa vào”.
- source_word: πειρασμόν
  choice: sự cám dỗ
  rationale: Từ Hy Lạp có thể chỉ sự cám dỗ phạm tội hoặc một cuộc thử thách. “Sự cám dỗ” tự nhiên trong ngữ cảnh lời cầu nguyện, còn nghĩa rộng hơn được giữ trong chú thích.
- source_word: ῥῦσαι
  choice: xin giải cứu
  rationale: Động từ diễn tả hành động cứu thoát tích cực. “Giải cứu” rõ nghĩa, trang trọng vừa phải và phù hợp với lời cầu nguyện hiện đại.
- source_word: τοῦ πονηροῦ
  choice: Kẻ Ác
  rationale: Cụm có mạo từ có thể được hiểu ở giống đực là một tác nhân cá nhân (“Kẻ Ác”) hoặc ở giống trung là “điều ác/sự dữ”. Bản chính chọn nghĩa cá nhân, đồng thời giữ cách hiểu phi cá nhân trong chú thích.
theological_decisions:
- issue: Ý nghĩa của τοῦ πονηροῦ
  choice: Kẻ Ác
  alternative: điều ác hoặc sự dữ
  rationale: Hình thức Hy Lạp thực sự mơ hồ giữa một đối thủ mang tính cá nhân và cái ác nói chung. Ngữ cảnh đối lập với sự cám dỗ cho phép cách hiểu cá nhân, nhưng chú thích bảo lưu cách hiểu phi cá nhân để không xóa bỏ sự căng thẳng của nguyên văn.
- issue: Quan hệ giữa Đức Chúa Trời và sự cám dỗ/thử thách
  choice: Giữ lời cầu xin trực tiếp “xin đừng dẫn”
  alternative: xin đừng để chúng con sa vào
  rationale: Nguyên văn nói trực tiếp “đừng dẫn chúng con vào” mà không giải thích cơ chế thần học. Bản dịch không làm nhẹ câu bằng một diễn giải cho phép, nhờ đó giữ nguyên sức nặng và sự căng thẳng của lời cầu xin.
translation_notes:
  register: Văn phong hiện đại, trang trọng và thích hợp với lời cầu nguyện. Đại từ “chúng con” thể hiện lời thưa với Đức Chúa Trời theo cách dùng phổ biến trong tiếng Việt. Viết hoa “Kẻ Ác” để biểu thị cách hiểu mang tính cá nhân trong bản chính; cả hai dấu chú thích [a], [b] đều được đặt ngay sau cụm từ liên quan.
