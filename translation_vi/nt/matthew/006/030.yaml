id: MAT.6.30
reference: Matthew 6:30
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εἰ δὲ τὸν χόρτον τοῦ ἀγροῦ σήμερον ὄντα καὶ αὔριον εἰς κλίβανον βαλλόμενον ὁ θεὸς οὕτως ἀμφιέννυσιν, οὐ πολλῷ μᾶλλον ὑμᾶς, ὀλιγόπιστοι;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/030.yaml
  text: But if God so clothes the grass of the field[a], which is here today and tomorrow is thrown into an oven, will he not much more clothe you[b], you of little faith?
translation:
  language: vi
  text: Nhưng nếu Đức Chúa Trời mặc cho cỏ ngoài đồng như thế—thứ hôm nay còn đó, ngày mai bị ném vào lò[a]—thì Ngài há chẳng mặc cho anh em nhiều hơn sao, hỡi những người ít đức tin[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Lò” ở đây là lò nướng; cỏ khô và cây cỏ ngoài đồng có thể được dùng làm nhiên liệu.
    reason: cultural_note
  - marker: b
    text: 'Cũng có thể dịch: “hỡi những người có đức tin nhỏ bé.” Từ Hy Lạp ὀλιγόπιστοι là lời gọi trực tiếp, mang sắc thái quở trách vì lòng tin chưa đủ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δὲ
  choice: Nhưng nếu
  rationale: Giữ bước chuyển nhẹ trong lập luận do δέ đánh dấu, đồng thời mở đầu tự nhiên cho mệnh đề điều kiện.
- source_word: τὸν χόρτον τοῦ ἀγροῦ
  choice: cỏ ngoài đồng
  rationale: χόρτος có thể chỉ cỏ hoặc cây cỏ nói chung. “Cỏ ngoài đồng” tự nhiên trong tiếng Việt, giữ hình ảnh thảm thực vật ngắn ngủi mà không thu hẹp thành hoa.
- source_word: σήμερον ὄντα
  choice: hôm nay còn đó
  rationale: Diễn đạt thành ngữ cho nghĩa hiện hữu của ὄντα, đồng thời làm nổi bật tính tạm thời mà không thêm ý “còn sống” vốn không được nói rõ.
- source_word: αὔριον εἰς κλίβανον βαλλόμενον
  choice: ngày mai bị ném vào lò
  rationale: κλίβανος là lò dùng để nướng, không nhất thiết là lò luyện; thể bị động của βαλλόμενον được giữ rõ.
- source_word: οὕτως ἀμφιέννυσιν
  choice: mặc cho ... như thế
  rationale: Giữ phép ẩn dụ “mặc áo” của ἀμφιέννυμι và nghĩa chỉ cách thức của οὕτως, không diễn giải mạnh hơn thành “trang điểm” hay “tô điểm”.
- source_word: οὐ πολλῷ μᾶλλον ὑμᾶς
  choice: há chẳng mặc cho anh em hơn bội phần sao
  rationale: Bổ sung động từ đã được tỉnh lược trong tiếng Hy Lạp để câu tiếng Việt rõ nghĩa, đồng thời giữ nguyên câu hỏi tu từ và lập luận từ điều nhỏ đến điều lớn.
- source_word: ὀλιγόπιστοι
  choice: hỡi những người ít đức tin
  rationale: Giữ hình thức hô cách số nhiều và sắc thái quở trách về lòng tin chưa đủ, nhưng tránh lối nói quá cổ.
theological_decisions:
- issue: Lập luận về sự chăm sóc của Đức Chúa Trời từ điều nhỏ đến điều lớn
  choice: 'Giữ nguyên dưới dạng câu hỏi tu từ: Đức Chúa Trời chắc chắn sẽ mặc cho các môn đồ hơn bội phần.'
  alternative: Chuyển thành một câu khẳng định trực tiếp về sự chu cấp.
  rationale: Cấu trúc Hy Lạp οὐ πολλῷ μᾶλλον và lời gọi trực tiếp ở cuối câu cho thấy đây là câu hỏi tu từ nhằm nhấn mạnh lời quở trách về sự thiếu tin cậy; bản dịch không mở rộng thành một cam kết thần học vượt quá hình ảnh trong câu.
- issue: Sắc thái của ὀλιγόπιστοι
  choice: “những người ít đức tin,” hiểu là lời gọi trực tiếp quở trách lòng tin chưa đủ.
  alternative: “những người có đức tin nhỏ bé,” có thể bị hiểu là đánh giá kích thước hoặc loại đức tin theo nghĩa kỹ thuật.
  rationale: Từ Hy Lạp để ngỏ sắc thái giữa “ít đức tin” và “thiếu lòng tin”; cách dịch chính giữ sự căng thẳng ấy mà không biến lời nói thành phán quyết rằng người nghe hoàn toàn vô tín.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “Đức Chúa Trời” cho ὁ θεός và “anh em” cho đại từ số nhiều ὑμᾶς; giữ phép ẩn dụ mặc áo và câu hỏi tu từ. Dấu gạch ngang làm rõ cụm mô tả tính chóng qua của cỏ mà không thay đổi quan hệ cú pháp.
