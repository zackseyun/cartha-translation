  to: Nhưng nếu Đức Chúa Trời mặc cho cỏ ngoài đồng như thế—thứ hôm nay còn đó, ngày mai bị ném vào lò[a]—thì Ngài há chẳng mặc cho anh em nhiều hơn sao, hỡi những người ít đức tin[b]?
  rationale: Chỉ điều chỉnh một cụm so sánh để tiếng Việt hiện đại tự nhiên hơn và phản ánh sát hơn πολλῷ μᾶλλον (“nhiều hơn rất nhiều”), không thay đổi nghĩa, hình ảnh, giọng điệu quở trách, hay các neo chú thích.
