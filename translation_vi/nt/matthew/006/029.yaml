source:
  edition: SBLGNT
  text: λέγω δὲ ὑμῖν ὅτι οὐδὲ Σολομὼν ἐν πάσῃ τῇ δόξῃ αὐτοῦ περιεβάλετο ὡς ἓν τούτων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/029.yaml
  text: But I tell you that not even Solomon in all his glory was clothed like one of these[a].
translation:
  language: vi
  text: 'Nhưng tôi nói với anh em rằng: ngay cả Sa-lô-môn, trong tất cả vẻ huy hoàng của mình, cũng không được mặc như một bông nào trong số này.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “trong tất cả vẻ lộng lẫy của mình.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω δὲ ὑμῖν
  choice: Nhưng tôi nói với anh em
  rationale: Động từ λέγω đi với ὑμῖν được diễn đạt tự nhiên là “tôi nói với anh em”; δέ biểu thị sự tương phản nhẹ với nhận xét ở câu trước.
- source_word: οὐδὲ
  choice: Ngay cả ... cũng không
  rationale: Cấu trúc tiếng Việt này thể hiện rõ sắc thái phủ định nhấn mạnh của οὐδέ.
- source_word: Σολομὼν
  choice: vua Sa-lô-môn
  rationale: Dùng cách phiên âm quen thuộc trong tiếng Việt; thêm “vua” để người đọc hiện đại nhận ra ngay địa vị hoàng gia vốn được ngữ cảnh và danh tiếng của Sa-lô-môn hàm ý.
- source_word: ἐν πάσῃ τῇ δόξῃ αὐτοῦ
  choice: trong tất cả vẻ huy hoàng của mình
  rationale: Ở đây δόξα chỉ sự lộng lẫy, huy hoàng của vua Sa-lô-môn, không phải vinh quang thần thượng; “vẻ huy hoàng” vừa tự nhiên vừa giữ sắc thái trang trọng.
- source_word: περιεβάλετο
  choice: mặc đẹp
  rationale: Dạng trung động của περιβάλλω trong ngữ cảnh nói đến việc ăn mặc. “Mặc đẹp” giúp phép so sánh với vẻ đẹp của hoa tự nhiên trong tiếng Việt mà không thêm loại y phục cụ thể.
- source_word: ὡς ἓν τούτων
  choice: bằng một trong những bông hoa này
  rationale: Giữ phép so sánh và số ít ἓν; danh từ “bông hoa” được bổ sung từ đối tượng chỉ định trong ngữ cảnh trước để câu tiếng Việt rõ nghĩa.
theological_decisions:
- issue: Ý nghĩa của δόξα khi nói về Sa-lô-môn
  choice: vẻ huy hoàng
  alternative: vinh quang; vẻ lộng lẫy
  rationale: Ngữ cảnh nói về sự nguy nga của một vị vua và y phục của ông. “Vẻ huy hoàng” tránh khiến người đọc hiểu nhầm là vinh quang thần thượng, nhưng vẫn giữ sắc thái cao quý.
- issue: Sắc thái của περιεβάλετο
  choice: mặc đẹp
  alternative: được mặc; ăn mặc
  rationale: Câu nhấn mạnh rằng sự ăn mặc lộng lẫy của Sa-lô-môn vẫn không sánh được với hoa. Bản dịch không xác định ai mặc áo cho ông hay hàm ý một hành động thần học nào.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng đại từ “tôi—anh em” phù hợp lời Đức Chúa Jêsus dạy các môn đồ và đám đông; giữ tên gọi quen thuộc “Sa-lô-môn”. Marker [a] được đặt trong chính văn.
