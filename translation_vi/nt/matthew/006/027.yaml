id: MAT.6.27
reference: Matthew 6:27
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: τίς δὲ ἐξ ὑμῶν μεριμνῶν δύναται προσθεῖναι ἐπὶ τὴν ἡλικίαν αὐτοῦ πῆχυν ἕνα;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/027.yaml
  text: And which of you[a], by being anxious, can add one cubit to his stature?
translation:
  language: vi
  text: Có ai trong anh em, nhờ lo lắng, mà có thể kéo dài đời mình[a] thêm một cu-bít không?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “làm cho mình cao thêm một cu-bít.” Từ Hy Lạp ở đây có thể chỉ tuổi đời/quãng đời hoặc chiều cao/vóc dáng. Một cu-bít là đơn vị chiều dài khoảng 45 cm.'
    reason: Bảo lưu nghĩa từ vựng thay thế thực sự của ἡλικία và giải thích đơn vị đo cổ.
lexical_decisions:
- source_word: τίς δὲ ἐξ ὑμῶν
  choice: Có ai trong anh em
  rationale: Cụm này là một câu hỏi tu từ, tự nhiên nhất trong tiếng Việt là “Có ai trong anh em... không?”. δέ chỉ nối nhẹ với mạch văn nên không cần dịch bằng một từ đối lập mạnh.
- source_word: μεριμνῶν
  choice: nhờ lo lắng
  rationale: 'Phân từ diễn tả phương tiện: chính nhờ việc lo lắng mà đạt được điều được hỏi. Cách dịch này giữ sắc thái phương tiện và phù hợp với chủ đề lo âu trong ngữ cảnh.'
- source_word: δύναται προσθεῖναι
  choice: có thể kéo dài ... thêm
  rationale: δύναται chỉ khả năng; προσθεῖναι là thêm vào. Với cách hiểu ἡλικία là quãng đời, “kéo dài ... thêm” vừa tự nhiên vừa giữ ý tăng thêm.
- source_word: ἐπὶ τὴν ἡλικίαν αὐτοῦ
  choice: đời mình
  rationale: ἡλικία có thể chỉ tuổi đời/quãng đời hoặc vóc dáng. Trong lập luận về sự lo lắng và sự sống, “đời mình” phù hợp, nhưng nghĩa “chiều cao” vẫn được bảo lưu trong chú thích. Đại từ phản thân “mình” diễn đạt tự nhiên chủ thể khái quát trong tiếng Việt.
- source_word: πῆχυν ἕνα
  choice: một cu-bít
  rationale: Giữ nguyên đơn vị đo chiều dài cụ thể của nguyên văn thay vì tự ý đổi sang đơn vị hiện đại; hình ảnh một đơn vị chiều dài được áp dụng cho đời người vẫn được giữ lại.
theological_decisions:
- issue: Nghĩa của ἡλικία trong lời dạy này
  choice: đời mình (tuổi đời/quãng đời)
  alternative: chiều cao/vóc dáng của mình
  rationale: Cả hai nghĩa đều có cơ sở từ vựng. Nghĩa “đời mình” phù hợp với chủ đề về mạng sống và việc con người không thể nhờ lo lắng mà kéo dài đời mình; tuy nhiên, sự kết hợp với đơn vị “cu-bít” khiến nghĩa “chiều cao” vẫn là một khả năng thực sự, nên không được loại bỏ mà được nêu trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cấu trúc hỏi tu từ “Có ai... không?” tự nhiên trong tiếng Việt; “anh em” phù hợp với lời nói hướng đến một nhóm người mà không thêm sắc thái hệ phái.
