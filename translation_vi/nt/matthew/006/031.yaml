id: MAT.6.31
reference: Matthew 6:31
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: μὴ οὖν μεριμνήσητε λέγοντες· Τί φάγωμεν; ἤ· Τί πίωμεν; ἤ· Τί περιβαλώμεθα;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/031.yaml
  text: Therefore do not worry[a], saying, ‘What will we eat?’ or ‘What will we drink?’ or ‘What will we wear?’
translation:
  language: vi
  text: 'Vậy, đừng lo lắng[a] mà nói: ‘Chúng ta sẽ ăn gì?’ hay: ‘Chúng ta sẽ uống gì?’ hay: ‘Chúng ta sẽ mặc gì?’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đừng lo âu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ οὖν μεριμνήσητε
  choice: Vậy, đừng lo lắng
  rationale: μεριμνάω trong ngữ cảnh này chỉ sự lo âu về các nhu cầu vật chất; “đừng lo lắng” tự nhiên trong tiếng Việt hiện đại và giữ nguyên lực ngăn cấm. οὖν được chuyển là “Vậy” để nối câu này như một kết luận từ lập luận trước đó.
- source_word: λέγοντες
  choice: mà nói
  rationale: Phân từ diễn tả lời nói đi kèm và bộc lộ sự lo lắng. “Mà nói” tạo quan hệ tự nhiên trong tiếng Việt mà không diễn giải quá mức.
- source_word: Τί
  choice: gì
  rationale: τί mở đầu các câu hỏi trực tiếp về những nhu cầu thiết yếu; “gì” là cách diễn đạt thông dụng và chính xác trong tiếng Việt.
- source_word: φάγωμεν
  choice: Chúng ta sẽ ăn gì?
  rationale: Thể giả định aorist được dùng trong câu hỏi cân nhắc về sự cung ứng sắp tới. “Sẽ ăn gì?” truyền đạt tự nhiên sắc thái hướng đến tương lai.
- source_word: πίωμεν
  choice: Chúng ta sẽ uống gì?
  rationale: Song song với φάγωμεν, đây là câu hỏi cân nhắc về nhu cầu trong tương lai; “sẽ uống gì?” giữ đúng ý và tự nhiên.
- source_word: περιβαλώμεθα
  choice: Chúng ta sẽ mặc gì?
  rationale: περιβάλλω ở đây nói đến việc khoác hoặc mặc quần áo. “Mặc gì?” là tương đương tự nhiên hơn lối dịch sát nhưng nặng nề như “khoác gì lên mình”.
- source_word: ἤ ... ἤ ... ἤ
  choice: hay ... hay ... hay
  rationale: Giữ sự lặp lại của liên từ phân cách để phản ánh ba câu hỏi nối tiếp trong nguyên bản.
theological_decisions:
- issue: Phạm vi lời cấm của Chúa Giê-su đối với các nhu cầu vật chất
  choice: Dịch μεριμνήσητε là lời cấm lo âu, không phải lời cấm tuyệt đối mọi sự quan tâm hoặc chuẩn bị khôn ngoan.
  alternative: Đừng quan tâm chút nào.
  rationale: Ngữ cảnh trực tiếp nói đến nỗi lo âu về sự cung ứng, chứ không phủ nhận việc dự liệu có trách nhiệm. “Đừng lo lắng” giữ được sức nặng của lời dạy mà không đưa vào bản văn một khẳng định tuyệt đối vượt quá ý nghĩa ngữ cảnh.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “chúng ta” trong các câu hỏi trực tiếp để thể hiện ngôi thứ nhất số nhiều của động từ Hy Lạp; giữ ba câu hỏi và ba liên từ “hay” nhằm bảo toàn nhịp điệu của nguyên bản.
