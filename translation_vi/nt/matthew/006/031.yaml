  terminology: “Lo lắng” là lựa chọn thông dụng, đúng ngữ cảnh lo âu về sự cung ứng vật chất, không biến lời dạy thành cấm mọi sự dự liệu. Chú thích “đừng lo âu” cung cấp một tương đương từ vựng hợp lệ và được gắn đúng vị trí.
