  source_fidelity: Bản dịch giữ đúng lực cấm của μὴ ... μεριμνήσητε qua “đừng lo lắng,” chuyển οὖν bằng “Vậy,” và bảo toàn ba câu hỏi cân nhắc về nhu cầu tương lai. “Mà nói” diễn đạt chấp nhận được phân từ λέγοντες dẫn vào nội dung lời lo lắng. Ba động từ “ăn / uống / mặc” phản ánh chính xác φάγωμεν, πίωμεν, và περιβαλώμεθα trong ngữ cảnh.
