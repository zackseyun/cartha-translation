id: MAT.6.12
reference: Matthew 6:12
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἄφες ἡμῖν τὰ ὀφειλήματα ἡμῶν, ὡς καὶ ἡμεῖς ⸀ἀφήκαμεν τοῖς ὀφειλέταις ἡμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/012.yaml
  text: And forgive us our debts[b][a], as we also have forgiven our debtors.
translation:
  language: vi
  text: Và xin tha nợ cho chúng con[a], như chúng con cũng đã tha cho những người mắc nợ chúng con[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Theo nghĩa đen là “những món nợ”; ở đây hình ảnh nợ nần có lẽ chỉ tội lỗi hoặc những điều xúc phạm.
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “như chúng con cũng tha cho những người mắc nợ chúng con.” Động từ Hy Lạp trình bày hành động như một toàn thể, thường được hiểu là đã hoàn tất, nhưng không tự nó xác định mọi sắc thái thời gian.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄφες
  choice: xin tha
  rationale: Động từ mệnh lệnh bất định ἀφίημι trong lời cầu nguyện mang nghĩa xin tha thứ; “xin tha” tự nhiên, trang trọng và vẫn giữ sắc thái khẩn cầu.
- source_word: τὰ ὀφειλήματα ἡμῶν
  choice: nợ cho chúng con
  rationale: ὀφειλήματα theo nghĩa đen là những khoản nợ hay điều còn mắc; “tha nợ cho chúng con” giữ hình ảnh nợ nần của nguyên văn mà vẫn tương đối tự nhiên trong tiếng Việt.
- source_word: ὡς
  choice: như
  rationale: “Như” giữ quan hệ so sánh giữa sự tha thứ được cầu xin nơi Đức Chúa Trời và sự tha thứ mà người cầu nguyện đã dành cho người khác.
- source_word: καὶ ἡμεῖς
  choice: chúng con cũng
  rationale: “Cũng” thể hiện καὶ nhấn mạnh phía người cầu nguyện, còn “chúng con” phù hợp với ngôi số nhiều trong lời cầu nguyện dâng lên Đức Chúa Trời.
- source_word: ἀφήκαμεν
  choice: đã tha
  rationale: Thì bất định Hy Lạp trình bày hành động như đã hoàn tất; “đã tha” là cách diễn đạt tự nhiên, không áp đặt một sắc thái thời quá cụ thể.
- source_word: τοῖς ὀφειλέταις ἡμῶν
  choice: cho những người mắc nợ chúng con
  rationale: Cách dịch này giữ mối liên hệ từ vựng giữa “nợ” và “người mắc nợ,” đồng thời không tự ý thay hình ảnh bằng “người xúc phạm.”
- source_word: καὶ
  choice: Và
  rationale: Καὶ ở đầu câu nối lời cầu xin này với các lời cầu xin trước trong bài cầu nguyện.
theological_decisions:
- issue: Hình ảnh đạo đức của ὀφειλήματα
  choice: Giữ “nợ” trong chính văn như hình ảnh chi phối về tội lỗi hoặc điều xúc phạm trước Đức Chúa Trời.
  alternative: Dịch trực tiếp là “tội lỗi” hoặc “những điều xúc phạm.”
  rationale: Nguyên văn dùng ngôn ngữ nợ nần và lặp lại cùng gốc từ ở “người mắc nợ.” Giữ hình ảnh này bảo toàn tính cụ thể và sự liên kết của câu, còn nghĩa đạo đức được làm rõ trong chú thích.
- issue: Sắc thái thời của ἀφήκαμεν
  choice: Dịch “đã tha,” trình bày sự tha thứ của người cầu nguyện như một hành động đã được thực hiện.
  alternative: “tha” hoặc “đã từng tha.”
  rationale: “Đã tha” phản ánh thể bất định mà không khẳng định quá mức rằng đây chỉ là một biến cố đơn lẻ hay một trạng thái hoàn tất kéo dài; vì vậy vẫn giữ được sức căng thần học trong quan hệ so sánh của câu.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Đại từ “chúng con” phù hợp với lời cầu nguyện hướng lên Đức Chúa Trời. Cụm “tha nợ” được giữ có chủ ý để bảo toàn ẩn dụ và sự lặp từ của tiếng Hy Lạp; chú thích ngăn người đọc hiểu câu chỉ theo nghĩa tài chính.
