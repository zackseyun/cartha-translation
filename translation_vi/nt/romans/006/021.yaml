id: ROM.6.21
reference: Romans 6:21
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: τίνα οὖν καρπὸν εἴχετε τότε ἐφ’ οἷς νῦν ἐπαισχύνεσθε; τὸ γὰρ τέλος ἐκείνων θάνατος·
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/021.yaml
  text: So what fruit did you have then from the things of which you are now ashamed? For the end of those things is death[a].
translation:
  language: vi
  text: Vậy, lúc ấy anh em đã có hoa trái gì từ những điều mà bây giờ anh em hổ thẹn? Vì kết cuộc của những điều ấy là sự chết.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch “kết quả” thay cho “kết cuộc”.
    reason: lexical_alternative
lexical_decisions:
- source_word: τίνα
  choice: gì
  rationale: Dùng trong câu hỏi tu từ, tự nhiên trong tiếng Việt và hỏi về kết quả mà lối sống trước kia đã sinh ra.
- source_word: καρπὸν
  choice: hoa trái
  rationale: Giữ nguyên ẩn dụ của Phao-lô về điều được sinh ra, thay vì làm phẳng thành “lợi ích” hay “kết quả”.
- source_word: εἴχετε
  choice: đã thu được
  rationale: Trong ngữ cảnh “hoa trái”, cách diễn đạt này tự nhiên trong tiếng Việt và truyền đạt việc họ từng có được kết quả nào từ đời sống trước kia.
- source_word: τότε
  choice: lúc ấy
  rationale: Tạo sự tương phản rõ ràng và tự nhiên với “bây giờ”.
- source_word: ἐφ’ οἷς
  choice: từ những điều mà
  rationale: Thể hiện cách hiểu rằng hoa trái phát sinh từ những việc trước kia, đồng thời bổ sung danh từ hàm ẩn để câu tiếng Việt rõ nghĩa.
- source_word: νῦν
  choice: bây giờ
  rationale: Giữ sự tương phản thời gian trực tiếp với “lúc ấy”.
- source_word: ἐπαισχύνεσθε
  choice: phải hổ thẹn
  rationale: Diễn đạt sức nặng luân lý của động từ; “hổ thẹn” trang trọng và mạnh hơn “ngượng ngùng”.
- source_word: τέλος
  choice: kết cuộc
  rationale: Giữ cả ý về điểm cuối và hệ quả cuối cùng, không thu hẹp hoàn toàn thành “kết quả”.
- source_word: ἐκείνων
  choice: những điều ấy
  rationale: Làm rõ đối tượng được nhắc lại từ mệnh đề trước.
- source_word: θάνατος
  choice: sự chết
  rationale: Cách dịch trực tiếp, trang trọng, giữ nguyên sức nặng thần học của từ ngữ.
theological_decisions:
- issue: Nên dịch τέλος là “kết cuộc” hay diễn giải thành “kết quả”
  choice: kết cuộc
  alternative: kết quả
  rationale: “Kết cuộc” giữ được cả nghĩa điểm tận cùng lẫn hậu quả của lối sống trước kia, nhờ đó không âm thầm giải quyết sự căng thẳng ý nghĩa trong nguyên văn.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Giữ ẩn dụ “hoa trái”, cặp tương phản “lúc ấy—bây giờ”, và sức nặng luân lý của “hổ thẹn”. Dùng “anh em” phù hợp cách Phao-lô trực tiếp nói với cộng đồng tín hữu.
