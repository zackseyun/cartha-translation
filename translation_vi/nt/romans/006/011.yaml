id: ROM.6.11
reference: Romans 6:11
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οὕτως καὶ ὑμεῖς λογίζεσθε ἑαυτοὺς ⸂εἶναι νεκροὺς μὲν⸃ τῇ ἁμαρτίᾳ ζῶντας δὲ τῷ θεῷ ἐν Χριστῷ ⸀Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/011.yaml
  text: So also you[c][b][a], consider yourselves to be dead to sin but alive to God in Messiah Jesus.
translation:
  language: vi
  text: Cũng vậy, anh chị em hãy tự xem mình là đã chết đối với tội lỗi, nhưng sống cho Đức Chúa Trời trong Đấng Mê-si-a Giê-su[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “trong Đấng Christ Giê-su”; “Mê-si-a” dịch tước hiệu Χριστός.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως καὶ
  choice: Cũng vậy
  rationale: Diễn đạt tự nhiên mối liên hệ suy luận với lập luận ngay trước đó.
- source_word: λογίζεσθε
  choice: hãy kể mình là
  rationale: Giữ sắc thái xem hay kể một điều là thật, đồng thời thể hiện mệnh lệnh hiện tại trong tiếng Hy Lạp.
- source_word: ἑαυτοὺς εἶναι
  choice: mình là
  rationale: Giữ đại từ phản thân và nội dung của động từ nguyên mẫu εἶναι trong một cấu trúc tiếng Việt tự nhiên.
- source_word: νεκροὺς μὲν τῇ ἁμαρτίᾳ
  choice: đã chết đối với tội lỗi
  rationale: “Đối với” diễn đạt quan hệ của cách ba; “đã chết” tự nhiên trong tiếng Việt và phù hợp với sự tương phản cùng “đang sống”.
- source_word: ζῶντας δὲ τῷ θεῷ
  choice: nhưng đang sống cho Đức Chúa Trời
  rationale: Giữ dạng phân từ mang nghĩa sống và sự tương phản μέν…δέ; “cho” diễn đạt quan hệ hướng về Đức Chúa Trời mà không giải thích quá mức.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: trong Đấng Mê-si-a Giê-su
  rationale: Giữ nguyên giới từ ἐν và sắc thái tước hiệu của Χριστός, tránh diễn giải thành phương tiện hay nguyên nhân.
theological_decisions:
- issue: Cách dịch Χριστῷ như tước hiệu hay dạng tên riêng
  choice: Đấng Mê-si-a
  alternative: Đấng Christ
  rationale: Trong cụm này, Χριστός vẫn mang nội dung tước hiệu; “Đấng Mê-si-a” giúp độc giả hiện đại nhận ra ý nghĩa ấy.
- issue: Ý nghĩa của ἐν Χριστῷ Ἰησοῦ
  choice: trong Đấng Mê-si-a Giê-su
  alternative: nhờ Đấng Mê-si-a Giê-su
  rationale: Giữ “trong” để bảo toàn ngôn ngữ đặc trưng của Phao-lô về mối liên hệ hay phạm vi hiện hữu trong Đấng Mê-si-a, không thu hẹp thành phương tiện.
- issue: Quan hệ của τῇ ἁμαρτίᾳ và τῷ θεῷ
  choice: đối với tội lỗi … cho Đức Chúa Trời
  alternative: về phương diện tội lỗi … về phương diện Đức Chúa Trời
  rationale: Cách dịch đã chọn giữ sự đối xứng thần học nhưng vẫn tự nhiên trong tiếng Việt, không quyết định dứt khoát mọi sắc thái của cách ba.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh chị em” cho đại từ số nhiều ὑμεῖς; giữ mệnh lệnh trực tiếp và thế tương phản “đã chết… nhưng đang sống”. Chỉ đặt chú thích tại chỗ có phương án dịch đáng kể.
