id: ROM.6.9
reference: Romans 6:9
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εἰδότες ὅτι Χριστὸς ἐγερθεὶς ἐκ νεκρῶν οὐκέτι ἀποθνῄσκει, θάνατος αὐτοῦ οὐκέτι κυριεύει·
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/009.yaml
  text: knowing that the Messiah[a], having been raised from the dead, no longer dies; death no longer rules over him.
translation:
  language: vi
  text: vì biết rằng Đấng Mê-si[a] đã được làm cho sống lại từ cõi chết, không còn chết nữa; sự chết không còn thống trị Ngài nữa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “Đấng Christ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰδότες
  choice: vì biết rằng
  rationale: Phân từ chỉ điều đã biết làm cơ sở cho lập luận. Tiếng Việt tự nhiên cần nêu rõ quan hệ này bằng “vì biết rằng”, nhưng không thêm một chủ thể vốn được hiểu từ ngữ cảnh.
- source_word: Χριστὸς
  choice: Đấng Mê-si
  rationale: Ở đây Χριστός mang ý nghĩa tước hiệu; “Đấng Mê-si” chuyển tải ý nghĩa ấy thay vì chỉ phiên âm thành một thành tố gần như tên riêng.
- source_word: ἐγερθεὶς
  choice: một khi đã được làm cho sống lại
  rationale: Cách dịch giữ thể bị động và hành động đã xảy ra trước mệnh đề chính; “một khi” cũng làm rõ tính dứt khoát, không lặp lại của biến cố mà không biến nó thành một mệnh đề nhân quả.
- source_word: ἐκ νεκρῶν
  choice: từ cõi chết
  rationale: Đây là cách diễn đạt tự nhiên trong tiếng Việt về việc sống lại từ tình trạng và phạm vi của người chết.
- source_word: οὐκέτι
  choice: không còn ... nữa
  rationale: Cấu trúc tiếng Việt này giữ trọn sắc thái chấm dứt và được dùng nhất quán ở cả hai vế.
- source_word: ἀποθνῄσκει
  choice: chết
  rationale: Động từ hiện tại ở đây diễn tả thực tại tiếp diễn rằng Ngài không còn chịu sự chết; hiện tại đơn tiếng Việt truyền đạt điều đó tự nhiên.
- source_word: θάνατος
  choice: sự chết
  rationale: Giữ danh từ làm chủ ngữ và phép nhân cách hóa trong lời của Phao-lô.
- source_word: κυριεύει
  choice: cai trị
  rationale: Diễn đạt quyền thống trị hay làm chủ một cách mạnh, tự nhiên và hiện đại, đồng thời giữ hình ảnh sự chết từng nắm quyền trên Ngài.
theological_decisions:
- issue: Cách dịch Χριστός trong diễn ngôn của Phao-lô
  choice: Đấng Mê-si
  alternative: Đấng Christ
  rationale: Ngữ cảnh phù hợp với việc giữ ý nghĩa tước hiệu. Chú thích vẫn cung cấp cách gọi quen thuộc “Đấng Christ” mà không buộc người đọc xem từ này chỉ như tên riêng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dấu chấm phẩy giữ sự song song giữa việc Đấng Mê-si không còn chết và sự chết không còn cai trị Ngài; đại từ “Ngài” thể hiện sự tôn kính theo lối dùng phổ biến trong tiếng Việt Cơ Đốc.
