- from: vì biết rằng Đấng Mê-si[a], một khi đã được làm cho sống lại từ cõi chết, thì không còn chết nữa; sự chết không còn cai trị Ngài nữa.
  to: vì biết rằng Đấng Mê-si[a] đã được làm cho sống lại từ cõi chết, không còn chết nữa; sự chết không còn thống trị Ngài nữa.
