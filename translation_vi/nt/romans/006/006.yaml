- from: 'Chúng ta biết điều này: con người cũ của chúng ta đã cùng bị đóng đinh với Ngài, để thân thể của tội lỗi bị vô hiệu hóa[a], hầu chúng ta không còn làm nô lệ cho tội lỗi nữa[b].'
