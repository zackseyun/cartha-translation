id: ROM.6.6
reference: Romans 6:6
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: τοῦτο γινώσκοντες ὅτι ὁ παλαιὸς ἡμῶν ἄνθρωπος συνεσταυρώθη, ἵνα καταργηθῇ τὸ σῶμα τῆς ἁμαρτίας, τοῦ μηκέτι δουλεύειν ἡμᾶς τῇ ἁμαρτίᾳ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/006.yaml
  text: knowing this[a], that our old self was crucified with him, so that the body of sin might be rendered powerless, so that we should no longer be enslaved to sin[c][b],
translation:
  language: vi
  text: 'Chúng ta biết điều này: con người cũ của chúng ta đã bị đóng đinh cùng với Ngài, để thân thể của tội lỗi bị vô hiệu hóa[a], hầu chúng ta không còn làm nô lệ cho tội lỗi nữa[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “bị triệt tiêu hiệu lực” hoặc “bị loại bỏ.”'
    reason: lexical_alternative
  - marker: b
    text: 'Hay: “không còn phục vụ tội lỗi nữa.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο γινώσκοντες
  choice: Chúng ta biết điều này
  rationale: Chuyển phân từ sang mệnh đề tự nhiên trong tiếng Việt, đồng thời giữ liên hệ với lập luận trước đó.
- source_word: ὁ παλαιὸς ἡμῶν ἄνθρωπος
  choice: con người cũ của chúng ta
  rationale: Giữ hình ảnh nhân học của nguyên văn mà vẫn tự nhiên và không khiến người đọc hiểu là chỉ nói về nam giới.
- source_word: συνεσταυρώθη
  choice: đã cùng bị đóng đinh với Ngài
  rationale: Từ 'cùng' thể hiện tiền tố συν-, còn 'với Ngài' diễn đạt rõ sự đồng chịu đóng đinh với Đấng Christ trong văn mạch.
- source_word: καταργηθῇ
  choice: bị vô hiệu hóa
  rationale: Diễn đạt việc mất hiệu lực hay quyền chi phối mà không khẳng định mạnh hơn rằng thân thể bị tiêu hủy hoàn toàn.
- source_word: τὸ σῶμα τῆς ἁμαρτίας
  choice: thân thể của tội lỗi
  rationale: Giữ cấu trúc sở hữu cô đọng và sự mơ hồ thật của cụm Hy Lạp, thay vì giải nghĩa thành 'thân thể bị tội lỗi cai trị'.
- source_word: τοῦ μηκέτι δουλεύειν ἡμᾶς τῇ ἁμαρτίᾳ
  choice: hầu chúng ta không còn làm nô lệ cho tội lỗi nữa
  rationale: Giữ hình ảnh nô lệ/chủ nhân của δουλεύω và diễn đạt mục đích một cách tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Thành ngữ nhân học ὁ παλαιὸς ἡμῶν ἄνθρωπος
  choice: con người cũ của chúng ta
  alternative: bản ngã cũ của chúng ta
  rationale: '''Con người cũ'' gần hình ảnh nguyên ngữ hơn, không thu hẹp ý nghĩa vào nội tâm hay ý niệm hiện đại về ''bản ngã''.'
- issue: Sắc thái của καταργηθῇ đối với thân thể của tội lỗi
  choice: bị vô hiệu hóa
  alternative: bị tiêu diệt
  rationale: '''Bị vô hiệu hóa'' bảo toàn khả năng nghĩa là bị tước hiệu lực hay quyền lực; ''bị tiêu diệt'' có thể hàm ý hủy diệt hoàn toàn quá mức nguyên văn.'
- issue: Quan hệ mục đích trong ἵνα ... τοῦ μηκέτι
  choice: để ... hầu ...
  alternative: để ... đến nỗi ...
  rationale: Cách dịch này giữ hướng mục đích của câu mà không xóa mối liên hệ giữa việc thân thể của tội lỗi bị vô hiệu hóa và việc không còn làm nô lệ cho tội lỗi.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” theo văn mạch để chỉ Đấng Christ; giữ cụm “thân thể của tội lỗi” nhằm bảo toàn sự cô đọng và hàm nghĩa chưa được giải quyết của nguyên văn.
