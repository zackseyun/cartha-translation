id: ROM.6.5
reference: Romans 6:5
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Εἰ γὰρ σύμφυτοι γεγόναμεν τῷ ὁμοιώματι τοῦ θανάτου αὐτοῦ, ἀλλὰ καὶ τῆς ἀναστάσεως ἐσόμεθα·
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/005.yaml
  text: For if we have become united with him in the likeness of his death[b][a], we will certainly also be united with him in the likeness of his resurrection.
translation:
  language: vi
  text: Vì nếu chúng ta đã trở nên hiệp nhất với Ngài trong sự tương đồng với cái chết của Ngài[a], thì chắc chắn chúng ta cũng sẽ hiệp nhất với Ngài trong sự tương đồng với sự sống lại của Ngài.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đã cùng lớn lên với Ngài trong sự tương đồng với cái chết của Ngài.”'
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn Hy Lạp diễn đạt cô đọng: “nhưng chúng ta cũng sẽ là của sự sống lại”; vị ngữ “hiệp nhất với Ngài trong sự tương đồng với” được hiểu ngầm từ vế trước.'
    reason: alternative_reading
lexical_decisions:
- source_word: σύμφυτοι
  choice: hiệp nhất với Ngài
  rationale: Tính từ này diễn tả sự gắn kết hữu cơ hoặc cùng dự phần. “Hiệp nhất với Ngài” truyền đạt rõ sức nặng tương quan trong tiếng Việt hiện đại mà không giới hạn cách thức của sự hiệp nhất.
- source_word: γεγόναμεν
  choice: đã trở nên
  rationale: Thì hoàn thành chỉ một sự việc đã xảy ra và còn kết quả trong hiện tại; “đã trở nên” giữ được sắc thái ấy.
- source_word: τῷ ὁμοιώματι
  choice: trong sự tương đồng
  rationale: 'Cách dịch này giữ hình ảnh ὁμοίωμα và để ngỏ sắc thái chính xác của cách dữ cách: quan hệ, phạm vi hay sự tương ứng.'
- source_word: τοῦ θανάτου αὐτοῦ
  choice: với cái chết của Ngài
  rationale: Diễn đạt trực tiếp kết cấu sở hữu; “Ngài” chỉ về Đấng Christ theo ngữ cảnh.
- source_word: ἀλλὰ καὶ
  choice: thì chắc chắn ... cũng
  rationale: Trong kết cấu câu điều kiện này, cụm từ nhấn mạnh rằng vế về sự sống lại tất yếu đi cùng vế về cái chết; lối dịch này tự nhiên trong tiếng Việt.
- source_word: τῆς ἀναστάσεως
  choice: trong sự tương đồng với sự sống lại của Ngài
  rationale: Tiếng Hy Lạp lược bỏ các yếu tố đã có ở vế trước. Bổ sung chúng trong câu chính giúp tiếng Việt sáng nghĩa, còn chú thích bảo lưu hình thức cô đọng của nguyên văn.
- source_word: ἐσόμεθα
  choice: chúng ta cũng sẽ hiệp nhất với Ngài
  rationale: Động từ có nghĩa đen là “chúng ta sẽ là”; vị ngữ σύμφυτοι được hiểu ngầm từ vế đầu và cần được nhắc lại để câu tiếng Việt đầy đủ.
theological_decisions:
- issue: Có nên xác định sự hiệp nhất này theo một cơ chế bí tích, huyền nhiệm hay thuần ẩn dụ hay không
  choice: Giữ cách nói “hiệp nhất với Ngài trong sự tương đồng”
  alternative: “cùng lớn lên với Ngài”, “được kết hợp với khuôn mẫu”, hoặc diễn giải cụ thể cơ chế dự phần
  rationale: Câu văn khẳng định sự dự phần thực sự nơi Đấng Christ nhưng đồng thời dùng từ “sự tương đồng”. Bản dịch giữ nguyên sức căng này và không áp đặt một cách giải thích giáo phái.
- issue: Sự sống lại ở đây có phải là sự sống lại của Đấng Christ hay không
  choice: Dùng “sự sống lại của Ngài” trong câu chính
  alternative: Chỉ dịch sát hình thức là “thuộc về sự sống lại”
  rationale: Phép song song với “cái chết của Ngài” cho thấy sự sống lại của Đấng Christ là ý được hiểu, nhưng chú thích ghi rõ rằng nguyên văn Hy Lạp diễn đạt cô đọng hơn.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Dùng “Ngài” để chỉ Đấng Christ theo ngữ cảnh. Cấu trúc song song được làm rõ vừa đủ cho tiếng Việt, còn các chú thích bảo lưu hình ảnh hữu cơ của σύμφυτοι và sự tỉnh lược trong vế sau.
