id: ROM.6.17
reference: Romans 6:17
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: χάρις δὲ τῷ θεῷ ὅτι ἦτε δοῦλοι τῆς ἁμαρτίας ὑπηκούσατε δὲ ἐκ καρδίας εἰς ὃν παρεδόθητε τύπον διδαχῆς,
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/017.yaml
  text: But thanks be to God that[a], though you were servants of sin[b], you obeyed from the heart the pattern of teaching to which you were handed over.
translation:
  language: vi
  text: Nhưng tạ ơn Đức Chúa Trời, vì dù anh em từng là nô lệ của tội lỗi, anh em đã từ lòng mình vâng theo khuôn mẫu giáo huấn[a] mà anh em đã được giao cho.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “hình thức giáo huấn” hoặc “chuẩn mực giáo huấn.”
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch sát hơn là “mà anh em đã được trao vào khuôn mẫu giáo huấn.”
    reason: alternative_reading
lexical_decisions:
- source_word: χάρις δὲ τῷ θεῷ
  choice: Nhưng tạ ơn Đức Chúa Trời
  rationale: Trong cấu trúc này, χάρις diễn tả lời cảm tạ dâng lên Đức Chúa Trời; δὲ giữ sắc thái chuyển ý hoặc tương phản của mạch văn.
- source_word: δοῦλοι τῆς ἁμαρτίας
  choice: nô lệ của tội lỗi
  rationale: “Nô lệ” giữ nguyên hình ảnh về quyền sở hữu và sự thống trị vốn là trọng tâm trong lập luận của Rô-ma 6, mạnh hơn cách dịch “đầy tớ”.
- source_word: ὑπηκούσατε
  choice: vâng theo
  rationale: Động từ chỉ sự vâng phục thực sự chứ không chỉ nghe; “vâng theo” tự nhiên khi đi với giáo huấn.
- source_word: ἐκ καρδίας
  choice: từ tận lòng
  rationale: Cách diễn đạt này vừa giữ hình ảnh “lòng” của nguyên ngữ vừa truyền đạt sự chân thành, sâu xa của sự vâng phục.
- source_word: τύπον διδαχῆς
  choice: khuôn mẫu giáo huấn
  rationale: τύπος có thể chỉ khuôn, mẫu hoặc chuẩn mực; διδαχή là sự dạy dỗ hay giáo huấn. Cụm này giữ được hình ảnh đặc thù mà vẫn rõ nghĩa trong tiếng Việt hiện đại.
- source_word: παρεδόθητε
  choice: được trao
  rationale: Giữ thể bị động và hình ảnh khác thường rằng chính các tín hữu được chuyển giao, thay vì đổi thành giáo huấn được truyền cho họ.
- source_word: εἰς ὃν
  choice: mà anh em được trao vào
  rationale: “Trao vào” giữ sắc thái chuyển động vào trong của εἰς và hình ảnh người tin được đặt vào một khuôn giáo huấn, dù đây là cách nói có chủ ý hơi khác thường.
theological_decisions:
- issue: Nên dịch δοῦλοι là “đầy tớ” hay “nô lệ”
  choice: nô lệ của tội lỗi
  alternative: đầy tớ của tội lỗi
  rationale: Toàn chương khai triển phép ẩn dụ về sự nô lệ, quyền thống trị và việc đổi chủ; “nô lệ” bảo toàn sức nặng thần học ấy mà không làm nhẹ nghĩa.
- issue: Chủ thể nào được trao trong cụm παρεδόθητε τύπον διδαχῆς
  choice: các tín hữu được trao vào khuôn mẫu giáo huấn
  alternative: khuôn mẫu giáo huấn được truyền lại cho các tín hữu
  rationale: Nguyên ngữ đặt động từ ở thể bị động ngôi thứ hai số nhiều, nên chính các tín hữu là những người “được trao.” Bản dịch giữ hình ảnh gây chú ý này thay vì đảo quan hệ cho quen tai hơn.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại. “Anh em” phù hợp với lời trực tiếp gửi cộng đồng tín hữu. Cụm “được trao vào” được giữ hơi khác thường có chủ ý để phản ánh hình ảnh và thể bị động của nguyên ngữ; chú thích cung cấp cách diễn đạt tự nhiên hơn.
