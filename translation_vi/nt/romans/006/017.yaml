    rationale: ἐκ καρδίας diễn tả sự vâng phục từ nội tâm. «Từ lòng mình» vừa tự nhiên vừa giữ hình ảnh «lòng» của nguyên ngữ.
  - severity: medium
    issue: Chú thích b hiện nêu «được giao phó cho» nhưng bản chính dùng «được trao vào», khiến chú thích không làm rõ lựa chọn chính và cách diễn đạt thay thế.
    rationale: 'Sau khi sửa bản chính thành cách diễn đạt tự nhiên hơn, chú thích nên nêu lựa chọn sát hướng chuyển động của εἰς: «được trao vào khuôn mẫu giáo huấn».'
