revisions:
- from: Nhưng tạ ơn Đức Chúa Trời, vì dù anh em từng là nô lệ của tội lỗi, anh em đã từ tận lòng vâng theo khuôn mẫu giáo huấn[a] mà anh em được trao vào[b].
  to: Nhưng tạ ơn Đức Chúa Trời, vì dù anh em từng là nô lệ của tội lỗi, anh em đã từ lòng mình vâng theo khuôn mẫu giáo huấn[a] mà anh em đã được giao cho.[b]
  rationale: Bản sửa thay cách nói «được trao vào» bằng «được giao cho» để câu tiếng Việt rõ và tự nhiên hơn, nhưng không đảo thể bị động thành việc giáo huấn được trao cho các tín hữu. «Từ lòng mình» thay cho «từ tận lòng» để phản ánh ἐκ καρδίας bằng cách diễn đạt hiện đại hơn. Chú thích b duy trì phương án sát nét hướng của εἰς mà không biến cách nói ít tự nhiên ấy thành bản chính.
