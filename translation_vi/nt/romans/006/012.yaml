id: ROM.6.12
reference: Romans 6:12
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Μὴ οὖν βασιλευέτω ἡ ἁμαρτία ἐν τῷ θνητῷ ὑμῶν σώματι εἰς τὸ ⸀ὑπακούειν ταῖς ἐπιθυμίαις αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/012.yaml
  text: Therefore[a], do not let sin reign in your mortal body, so that you obey its desires.
translation:
  language: vi
  text: Vậy, đừng để tội lỗi cai trị trong thân thể phải chết của anh chị em, khiến anh chị em vâng theo những ham muốn của thân thể ấy.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể hiểu: “khiến anh chị em vâng theo những ham muốn của tội lỗi.”'
    reason: Cách hiểu khác về đối tượng mà đại từ αὐτοῦ liên hệ đến trong ngữ cảnh.
lexical_decisions:
- source_word: οὖν
  choice: Vậy
  rationale: Diễn tả kết luận suy ra từ lập luận ngay trước đó, tự nhiên và rõ ràng trong tiếng Việt hiện đại.
- source_word: βασιλευέτω
  choice: đừng để ... cai trị
  rationale: Giữ lực mệnh lệnh cấm và hình ảnh vương quyền, đồng thời phù hợp với cách nói tự nhiên trong tiếng Việt.
- source_word: ἡ ἁμαρτία
  choice: tội lỗi
  rationale: Giữ nguyên cách Phao-lô nhân cách hóa tội lỗi như một quyền lực có thể cai trị, không diễn giải thành các hành vi riêng lẻ.
- source_word: ἐν τῷ θνητῷ ὑμῶν σώματι
  choice: trong thân thể phải chết của anh chị em
  rationale: “Phải chết” truyền đạt rõ θνητός là thân phận hữu tử; “anh chị em” diễn đạt số nhiều ὑμῶν theo lối xưng hô bao gồm cả cộng đồng.
- source_word: εἰς τὸ ὑπακούειν
  choice: khiến ... vâng theo
  rationale: Giữ được sắc thái kết quả hoặc hệ quả của cấu trúc εἰς τό với động từ nguyên mẫu mà không buộc phải phân định dứt khoát giữa mục đích và kết quả.
- source_word: ταῖς ἐπιθυμίαις
  choice: những ham muốn
  rationale: Đủ rộng để chỉ các dục vọng hay khao khát sai trái trong ngữ cảnh, không thu hẹp riêng vào ham muốn tình dục.
- source_word: αὐτοῦ
  choice: của thân thể ấy
  rationale: Đại từ sở hữu số ít giống đực/trung trong tiếng Hy Lạp phù hợp về ngữ pháp với σώματι, danh từ giống trung số ít; lặp lại “thân thể” giúp tiếng Việt tránh đại từ sở hữu mơ hồ.
theological_decisions:
- issue: Tội lỗi là hành vi hay một quyền lực cai trị
  choice: 'Giữ hình ảnh nhân cách hóa: “tội lỗi cai trị”.'
  alternative: Diễn giải thành việc hành vi tội lỗi kiểm soát con người.
  rationale: Động từ βασιλεύω mang hình ảnh vương quyền; giữ ẩn dụ này bảo toàn sức nặng thần học của lời văn mà không thêm hệ thống giải thích.
- issue: Tiền ngữ của αὐτοῦ
  choice: Hiểu là “những ham muốn của thân thể ấy”.
  alternative: Hiểu theo liên hệ ý nghĩa là “những ham muốn của tội lỗi”.
  rationale: Về hòa hợp ngữ pháp, αὐτοῦ phù hợp tự nhiên với σώματι (giống trung số ít), không phù hợp trực tiếp với ἁμαρτία (giống cái); tuy vậy, ngữ cảnh nhân cách hóa tội lỗi cho phép một liên hệ ý nghĩa khác, nên ghi ở chú thích.
- issue: Quan hệ của εἰς τὸ ὑπακούειν với mệnh đề chính
  choice: Dùng “khiến” để nhấn hệ quả mà không loại trừ sắc thái hướng đến kết quả.
  alternative: Dùng “để rồi” hoặc “đến nỗi”.
  rationale: Cấu trúc có thể mang sắc thái mục đích/kết quả. “Khiến” tự nhiên trong tiếng Việt và không giải quyết quá mức sự căng nghĩa này.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “anh chị em” cho đại từ số nhiều nhằm nói với toàn thể cộng đồng; giữ hình ảnh “cai trị” và tránh từ “dục vọng” vì dễ bị hiểu quá hẹp theo nghĩa tình dục.
