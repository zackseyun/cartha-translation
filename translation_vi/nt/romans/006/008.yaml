  to: Nếu chúng ta đã chết với Đấng Mê-si[a], thì chúng ta tin rằng chúng ta cũng sẽ sống với Ngài.
  rationale: Chỉ thay “mình” bằng “chúng ta” để duy trì nhất quán ngôi thứ nhất số nhiều và văn phong trang trọng. Các yếu tố khác của bản dịch và chú thích đều giữ nguyên vì phản ánh trung thành câu Hy Lạp mà không thu hẹp ý nghĩa thần học của “sẽ sống với Ngài”.
