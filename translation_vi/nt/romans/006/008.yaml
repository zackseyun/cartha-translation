reference: Romans 6:8
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εἰ δὲ ἀπεθάνομεν σὺν Χριστῷ, πιστεύομεν ὅτι καὶ συζήσομεν αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/008.yaml
  text: If we died with Messiah[a], we believe that we will also live with him.
translation:
  language: vi
  text: Nếu chúng ta đã chết với Đấng Mê-si[a], thì chúng ta tin rằng chúng ta cũng sẽ sống với Ngài.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch là “Đấng Christ”; tiếng Hy Lạp: Χριστῷ (Christō).'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δὲ
  choice: Nếu ... thì
  rationale: εἰ mở đầu mệnh đề điều kiện; δέ đánh dấu bước chuyển trong lập luận. Cấu trúc “Nếu ... thì” tự nhiên trong tiếng Việt và diễn đạt rõ quan hệ điều kiện mà không thêm ý thời gian.
- source_word: ἀπεθάνομεν
  choice: chúng ta đã chết
  rationale: Động từ chỉ một biến cố đã xảy ra; “đã chết” phù hợp với việc Phao-lô vừa nói đến sự đồng chết với Đấng Mê-si.
- source_word: σὺν Χριστῷ
  choice: với Đấng Mê-si
  rationale: σύν diễn đạt sự cùng dự phần hay kết hợp; Χριστός được dùng như tước hiệu nên dịch là “Đấng Mê-si”, đồng thời chú thích phương án quen thuộc “Đấng Christ”.
- source_word: πιστεύομεν
  choice: chúng ta tin
  rationale: Cách dịch trực tiếp, tự nhiên của πιστεύομεν trong lời xác quyết này.
- source_word: ὅτι
  choice: rằng
  rationale: Dẫn vào nội dung của điều được tin và giữ rõ cấu trúc câu Hy Lạp.
- source_word: καὶ
  choice: cũng
  rationale: Nêu sự tương ứng giữa việc đã chết với Ngài và việc sẽ sống với Ngài.
- source_word: συζήσομεν
  choice: sẽ sống
  rationale: Động từ ghép mang nghĩa sống cùng; yếu tố “cùng với” được diễn đạt rõ qua αὐτῷ ở cuối mệnh đề, tránh lặp vụng trong tiếng Việt.
- source_word: αὐτῷ
  choice: với Ngài
  rationale: Đi với συζάω, đại từ cách dữ được hiểu tự nhiên là “với Ngài”; viết hoa thể hiện cách xưng hô tôn kính phổ biến mà không thay đổi nội dung.
theological_decisions:
- issue: Cách dịch Χριστῷ
  choice: Đấng Mê-si
  alternative: Đấng Christ
  rationale: Trong lập luận này, Χριστός mang chức năng tước hiệu. Bản dịch chính làm rõ nghĩa “Mê-si”, còn chú thích bảo lưu cách gọi quen thuộc “Đấng Christ”.
- issue: Bản chất của sự sống tương lai trong συζήσομεν αὐτῷ
  choice: mình cũng sẽ sống với Ngài
  alternative: mình cũng sẽ sống lại với Ngài
  rationale: Không thêm từ “lại” hay giới hạn câu vào một cơ chế thần học cụ thể; giữ nguyên độ rộng của lời tuyên bố về sự sống tương lai cùng Đấng Mê-si.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “chúng ta” ở mệnh đề đầu và “mình” ở mệnh đề sau để tránh lặp nặng mà vẫn giữ cùng chủ thể; “Ngài” là đại từ tôn kính tự nhiên trong văn phong Kinh Thánh tiếng Việt.
