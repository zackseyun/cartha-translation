  terminology: “Đấng Mê-si” phản ánh hợp lý chức năng tước hiệu của Χριστῷ; chú thích “Đấng Christ” bảo lưu cách gọi quen thuộc. “Ngài” là cách quy chiếu tôn kính tự nhiên trong tiếng Việt Kinh Thánh.
