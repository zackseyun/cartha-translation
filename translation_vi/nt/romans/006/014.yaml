source:
  edition: SBLGNT
  text: ἁμαρτία γὰρ ὑμῶν οὐ κυριεύσει, οὐ γάρ ἐστε ὑπὸ νόμον ἀλλὰ ὑπὸ χάριν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/014.yaml
  text: For sin will not rule over you[b][a], because you are not under the law but under grace.
translation:
  language: vi
  text: Vì tội lỗi sẽ không cai trị[a] anh chị em, vì anh chị em không ở dưới luật pháp[b] nhưng ở dưới ân điển.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “sẽ không thống trị anh chị em” hoặc “sẽ không làm chủ anh chị em”.'
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn: “dưới luật pháp”, một thành ngữ chỉ việc ở dưới quyền hoặc chế độ của luật pháp.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἁμαρτία
  choice: tội lỗi
  rationale: Cách dịch chuẩn và tự nhiên; danh từ được giữ ở dạng thường dù trong câu được nhân cách hóa như một thế lực cai trị.
- source_word: κυριεύσει
  choice: sẽ không cai trị
  rationale: Diễn đạt rõ ý thực thi quyền làm chủ hay thống trị, đồng thời giữ hình ảnh tội lỗi như một thế lực cai trị.
- source_word: ὑπὸ νόμον
  choice: ở dưới luật pháp
  rationale: Giữ thành ngữ của Phao-lô về việc ở dưới quyền hoặc chế độ của luật pháp mà không diễn giải quá mức ngay trong chính văn.
- source_word: χάριν
  choice: ân điển
  rationale: Thuật ngữ quen thuộc và phù hợp với sự tương phản của Phao-lô giữa luật pháp và ân điển; truyền đạt nhiều hơn ý một sự ưu ái thông thường.
- source_word: γὰρ … γάρ
  choice: Vì … bởi
  rationale: Từ thứ nhất nối câu này với lập luận trước đó; từ thứ hai giới thiệu lý do giải thích cho lời khẳng định ở mệnh đề đầu.
theological_decisions:
- issue: Có nên làm nổi bật việc nhân cách hóa tội lỗi bằng cách viết hoa hoặc dùng hình ảnh mạnh hơn hay không
  choice: Giữ “tội lỗi” ở dạng thường và dịch động từ là “sẽ không cai trị”.
  alternative: “Tội Lỗi sẽ không thống trị anh chị em” hoặc “tội lỗi sẽ không làm chủ anh chị em”.
  rationale: Tiếng Hy Lạp rõ ràng trình bày tội lỗi như một thế lực cai trị, nhưng không đòi hỏi viết hoa. Cách dịch này giữ nguyên hình ảnh thần học mà không thêm một khuôn khổ giải thích.
- issue: Phạm vi ý nghĩa của νόμος trong thành ngữ “ở dưới luật pháp”
  choice: Giữ cách nói “ở dưới luật pháp” trong chính văn.
  alternative: Diễn giải là “ở dưới quyền của luật pháp” hoặc xác định rõ “luật pháp Môi-se”.
  rationale: Ngữ cảnh thư Rô-ma khiến luật pháp Môi-se là cách hiểu tự nhiên, nhưng câu Hy Lạp dùng một thành ngữ không có mạo từ; giữ cách nói gọn giúp bảo toàn phạm vi và sức căng của sự tương phản với ân điển.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh chị em” để truyền đạt đại từ số nhiều ὑμῶν theo cách bao quát; giữ các thuật ngữ quen thuộc “luật pháp” và “ân điển”. Cấu trúc “không… nhưng…” bảo toàn sự tương phản trực tiếp của οὐ… ἀλλά.
