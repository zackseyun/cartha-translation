  source_fidelity: 'Bản dịch truyền đạt đúng cấu trúc và ý nghĩa của ἁμαρτία γὰρ ὑμῶν οὐ κυριεύσει: tội lỗi được nhân cách hóa như quyền lực cai trị. Cặp đối lập οὐ ... ἀλλὰ và hai cụm ὑπὸ νόμον / ὑπὸ χάριν đều được giữ lại. “Luật pháp” và “ân điển” phù hợp với thuật ngữ Phao-lô; không cần xác định rõ hơn là luật Môi-se trong chính văn.'
