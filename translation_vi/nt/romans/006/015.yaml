source:
  edition: SBLGNT
  text: Τί οὖν; ⸀ἁμαρτήσωμεν ὅτι οὐκ ἐσμὲν ὑπὸ νόμον ἀλλὰ ὑπὸ χάριν; μὴ γένοιτο·
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/015.yaml
  text: What then? Should we sin because we are not under law but under grace? May it never be![a][b]
translation:
  language: vi
  text: Vậy thì sao? Chúng ta có nên phạm tội vì không ở dưới luật pháp nhưng ở dưới ân điển không?[a] Tuyệt đối không![b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Chúng ta sẽ phạm tội sao?”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “Không thể như vậy được!”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί οὖν
  choice: Vậy thì sao?
  rationale: Diễn đạt ngắn gọn câu hỏi chuyển ý mang tính suy luận của Phao-lô, không thêm nội dung ngoài bản Hy Lạp.
- source_word: ἁμαρτήσωμεν
  choice: Chúng ta cứ phạm tội ... sao?
  rationale: Động từ ở thể giả định bất định ngôi thứ nhất số nhiều có ý nghĩa cân nhắc trong câu hỏi tu từ. Từ “cứ” làm rõ sắc thái đề nghị tiếp tục phạm tội trong tiếng Việt tự nhiên mà không biến câu thành một mệnh lệnh.
- source_word: ὅτι
  choice: vì
  rationale: 'Nêu lý do được giả định cho việc phạm tội: vì người tin không ở dưới luật pháp nhưng ở dưới ân điển.'
- source_word: ὑπὸ νόμον
  choice: ở dưới luật pháp
  rationale: Giữ hình ảnh quyền chi phối của giới từ ὑπό và không thu hẹp νόμος thành một hệ luật cụ thể; “luật pháp” là cách diễn đạt trang trọng, quen thuộc trong ngữ cảnh Kinh Thánh tiếng Việt.
- source_word: ὑπὸ χάριν
  choice: ở dưới ân điển
  rationale: Giữ cấu trúc đối xứng với “ở dưới luật pháp” và dùng thuật ngữ thần học quen thuộc cho χάρις.
- source_word: μὴ γένοιτο
  choice: Tuyệt đối không!
  rationale: Truyền đạt lời bác bỏ rất mạnh của thành ngữ Hy Lạp bằng tiếng Việt hiện đại, tự nhiên và dứt khoát.
theological_decisions:
- issue: Phạm vi của νόμος trong sự tương phản của Phao-lô
  choice: Dịch là “luật pháp” mà không xác định thêm là luật Môi-se.
  alternative: luật Môi-se; Luật Pháp
  rationale: Danh từ Hy Lạp không có mạo từ; bản dịch không nên tự thu hẹp phạm vi thần học mà văn bản tại đây chưa nói rõ.
- issue: Sắc thái của câu hỏi ἁμαρτήσωμεν
  choice: “Chúng ta cứ phạm tội ... sao?”
  alternative: “Chúng ta có nên phạm tội ... không?”
  rationale: Cách dịch chính giữ đây là một đề nghị giả định bị bác bỏ và nối tự nhiên với lập luận về ân điển, nhưng không hàm ý rằng ân điển cho phép phạm tội.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Giữ nhịp tranh luận ngắn, mạnh của câu Hy Lạp và cấu trúc đối xứng “ở dưới luật pháp ... ở dưới ân điển”.
