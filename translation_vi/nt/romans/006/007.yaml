  yaml_path: translation/nt/romans/006/007.yaml
  text: For the one who has died has been acquitted from sin.
translation:
  language: vi
  text: Vì người đã chết đã được tuyên công chính, thoát khỏi tội lỗi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đã được xưng là công chính khỏi tội lỗi”; theo văn cảnh cũng có thể hiểu là “đã được giải thoát khỏi tội lỗi.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ... ἀποθανὼν
  choice: người đã chết
  rationale: Mạo từ đi với phân từ bất định quá khứ tạo thành một danh ngữ. Cách dịch này tự nhiên, không chỉ định giới tính và giữ được ý nghĩa đại diện.
- source_word: γὰρ
  choice: Vì
  rationale: Liên từ γάρ nêu lý do hoặc lời giải thích cho câu trước; “Vì” diễn đạt rõ quan hệ lập luận ấy.
- source_word: δεδικαίωται
  choice: đã được tuyên trắng án
  rationale: Động từ δικαιόω thường mang sắc thái pháp đình. “Được tuyên trắng án” giữ được nét nghĩa tư pháp, đồng thời phù hợp với ý một người đã thoát khỏi quyền đòi hỏi của tội lỗi; chú thích bảo lưu các khả năng “được xưng công chính” và, theo văn cảnh, “được giải thoát”.
- source_word: ἀπὸ τῆς ἁμαρτίας
  choice: khỏi tội lỗi
  rationale: Giới từ ἀπό diễn tả sự phân cách hoặc thoát khỏi. “Khỏi tội lỗi” tự nhiên trong tiếng Việt và không thu hẹp ý nghĩa chỉ còn hình phạt hay quyền lực của tội lỗi.
theological_decisions:
- issue: Nên hiểu δικαιόω ở đây chủ yếu theo nghĩa pháp đình (“được xưng công chính/tuyên trắng án”) hay theo nghĩa giải phóng (“được giải thoát”).
  choice: đã được tuyên trắng án khỏi tội lỗi
  alternative: đã được xưng công chính khỏi tội lỗi; đã được giải thoát khỏi tội lỗi
  rationale: Rô-ma 6 nhấn mạnh việc thoát khỏi quyền thống trị của tội lỗi, nhưng Phao-lô dùng δικαιόω, một động từ có sắc thái pháp đình. Bản chính giữ nét tư pháp bằng “được tuyên trắng án”, còn chú thích bảo lưu cả cách dịch sát thuật ngữ lẫn kết quả giải phóng trong văn cảnh, không xóa bỏ sự căng thẳng thần học.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Cấu trúc “người đã chết” không chỉ định giới tính; “tội lỗi” có thể bao hàm tội lỗi như một quyền lực được nhân cách hóa trong Rô-ma 6.
