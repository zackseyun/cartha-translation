- from: Vì người đã chết thì đã được tuyên trắng án khỏi tội lỗi.[a]
  to: Vì người đã chết đã được tuyên công chính, thoát khỏi tội lỗi.[a]
  rationale: Sửa cách diễn đạt pháp lý không tự nhiên “tuyên trắng án khỏi” thành “tuyên công chính,” gần với phạm vi nghĩa thông thường của δικαιόω hơn. Vế “thoát khỏi tội lỗi” cho phép tiếng Việt diễn đạt rõ quan hệ ἀπό và cộng hưởng với ngữ cảnh Rô-ma 6, trong khi chú thích bảo lưu cả phương án thuật ngữ sát hơn lẫn phương án giải phóng.
