  text: Τί οὖν ἐροῦμεν; ⸀ἐπιμένωμεν τῇ ἁμαρτίᾳ, ἵνα ἡ χάρις πλεονάσῃ;
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/001.yaml
  text: What then shall we say? Should we continue in sin so that grace may increase?[a][b]
translation:
  language: vi
  text: Vậy, chúng ta sẽ nói gì? Chúng ta có nên tiếp tục ở trong tội lỗi[a] để ân điển gia tăng không?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “cứ ở mãi trong tội lỗi”.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “để ân điển càng dư dật”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί οὖν
  choice: Vậy
  rationale: Diễn đạt tự nhiên quan hệ suy luận với lập luận trước đó, đồng thời giữ giọng chuyển ý tu từ của Phao-lô.
- source_word: ἐροῦμεν
  choice: chúng ta sẽ nói gì
  rationale: Giữ sắc thái tương lai mang tính cân nhắc trong câu hỏi tu từ và diễn đạt tự nhiên bằng tiếng Việt hiện đại.
- source_word: ἐπιμένωμεν
  choice: chúng ta có nên tiếp tục sống
  rationale: Thể giả định hiện tại đặt ra câu hỏi cân nhắc về một lối sống kéo dài. “Có nên tiếp tục sống” truyền đạt cả tính liên tục lẫn lực đạo đức của câu hỏi.
- source_word: τῇ ἁμαρτίᾳ
  choice: trong tội lỗi
  rationale: Giữ hình ảnh ở trong phạm vi hoặc nếp sống của tội lỗi, thay vì thu hẹp ý nghĩa chỉ còn những hành vi phạm tội riêng lẻ.
- source_word: ἵνα
  choice: để
  rationale: Nêu rõ mục đích hoặc kết quả được giả định trong lập luận phản vấn của Phao-lô.
- source_word: ἡ χάρις
  choice: ân điển
  rationale: Thuật ngữ thần học quen thuộc và chính xác trong tiếng Việt, chỉ ân huệ nhưng không của Đức Chúa Trời trong mạch lập luận này.
- source_word: πλεονάσῃ
  choice: càng gia tăng
  rationale: Diễn đạt rõ ý tăng thêm về mức độ; “càng” tự nhiên trong tương quan với việc tiếp tục sống trong tội lỗi được giả định ở vế trước.
theological_decisions:
- issue: Câu hỏi của Phao-lô diễn tả sự cho phép, nghĩa vụ hay dự đoán
  choice: 'Câu hỏi cân nhắc về đạo đức: “Chúng ta có nên tiếp tục sống trong tội lỗi... không?”'
  alternative: “Chúng ta sẽ tiếp tục sống trong tội lỗi... sao?”
  rationale: Thể giả định Hy Lạp đưa ra một đường hướng hành động để chất vấn. “Có nên” làm rõ lực cân nhắc đạo đức mà không tự trả lời câu hỏi hoặc đưa thêm kết luận thần học của câu kế tiếp.
- issue: τῇ ἁμαρτίᾳ chỉ hành vi phạm tội hay tình trạng/nếp sống trong tội lỗi
  choice: Giữ cách nói “sống trong tội lỗi”
  alternative: “tiếp tục phạm tội”
  rationale: Cách chọn giữ được sắc thái ở lại hoặc bền bỉ trong phạm vi của tội lỗi, tránh thu hẹp cụm từ thành các hành vi riêng lẻ.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Cấu trúc câu hỏi tu từ được giữ rõ; “ân điển” duy trì thuật ngữ Kinh Thánh quen thuộc, còn các phần khác tránh lối diễn đạt cổ hoặc quá sát chữ.
