id: ROM.6.4
reference: Romans 6:4
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: συνετάφημεν οὖν αὐτῷ διὰ τοῦ βαπτίσματος εἰς τὸν θάνατον, ἵνα ὥσπερ ἠγέρθη Χριστὸς ἐκ νεκρῶν διὰ τῆς δόξης τοῦ πατρός, οὕτως καὶ ἡμεῖς ἐν καινότητι ζωῆς περιπατήσωμεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/004.yaml
  text: Therefore we were buried with him through baptism into death[a], so that just as Messiah was raised from the dead through the glory of the Father, so also we might walk in newness of life.
translation:
  language: vi
  text: Vậy, qua phép báp-têm, chúng ta đã được chôn cùng với Ngài vào trong sự chết, để cũng như Đấng Mê-si-a[a] đã được sống lại từ cõi chết nhờ vinh quang của Đức Chúa Cha, thì chúng ta cũng có thể bước đi trong sự mới mẻ của sự sống.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: Đấng Christ.'
    reason: Cung cấp danh xưng truyền thống khác cho Χριστός mà vẫn giữ cách dịch chính là chức danh "Đấng Mê-si-a".
lexical_decisions:
- source_word: συνετάφημεν
  choice: chúng ta đã được chôn cùng với ngài
  rationale: Thể thụ động aorist chỉ hành động đã xảy ra; ý nghĩa của tiền tố συν- được diễn đạt tự nhiên bằng “cùng với ngài”.
- source_word: οὖν
  choice: Vậy
  rationale: Đánh dấu kết luận suy ra từ lập luận ngay trước đó và phù hợp với mạch văn tiếng Việt hiện đại.
- source_word: διὰ τοῦ βαπτίσματος
  choice: qua phép báp-têm
  rationale: Giữ sắc thái phương tiện của διά với sở hữu cách mà không tự quyết định một lập trường hệ phái về hiệu lực của phép báp-têm.
- source_word: εἰς τὸν θάνατον
  choice: vào trong sự chết
  rationale: Giữ lực hướng đích của εἰς và ý niệm đi vào sự chết, thay vì chỉ nói đến sự chết một cách chung chung.
- source_word: ἵνα
  choice: để
  rationale: Diễn đạt tự nhiên ý nghĩa mục đích của mệnh đề.
- source_word: Χριστὸς
  choice: Đấng Mê-si-a
  rationale: Giữ chức danh của Χριστός trong ngữ cảnh này; chú thích cung cấp cách gọi quen thuộc khác.
- source_word: ἐκ νεκρῶν
  choice: từ cõi chết
  rationale: Cách diễn đạt tự nhiên trong tiếng Việt, chỉ sự sống lại khỏi phạm vi của những người chết.
- source_word: διὰ τῆς δόξης τοῦ πατρός
  choice: nhờ vinh quang của Đức Chúa Cha
  rationale: “Nhờ” giữ sắc thái phương tiện của διά; “vinh quang” bảo toàn nội dung rộng của δόξα, không thu hẹp thành “quyền năng”.
- source_word: περιπατήσωμεν
  choice: chúng ta cũng bước đi
  rationale: Giữ hình ảnh “bước đi” của Phao-lô thay vì làm phẳng thành “sống”; trong tiếng Việt, hình ảnh này vẫn có thể chỉ nếp sống.
- source_word: ἐν καινότητι ζωῆς
  choice: trong đời sống mới
  rationale: Diễn đạt rõ ràng và tự nhiên ý niệm “sự mới mẻ của sự sống”, đồng thời tránh cấu trúc danh hóa nặng nề trong tiếng Việt.
theological_decisions:
- issue: Cách diễn đạt vai trò của phép báp-têm mà không áp đặt một giáo lý bí tích cụ thể
  choice: qua phép báp-têm
  alternative: bởi phép báp-têm
  rationale: Bản dịch giữ tính phương tiện trong ngữ pháp Hy Lạp nhưng không giải quyết thay cho độc giả mối quan hệ thần học chính xác giữa phép báp-têm và sự hiệp nhất với Đấng Mê-si-a.
- issue: Tác nhân và phương tiện trong việc Đấng Mê-si-a sống lại
  choice: đã được sống lại … nhờ vinh quang của Đức Chúa Cha
  alternative: đã được Đức Chúa Cha khiến sống lại bằng quyền năng của Ngài
  rationale: Giữ thể thụ động và cụm từ “vinh quang của Cha” như nguyên văn, không đồng nhất hoàn toàn “vinh quang” với “quyền năng” hay diễn giải quá mức tác nhân.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại. “Báp-têm” là thuật ngữ Kinh Thánh quen thuộc; “bước đi trong đời sống mới” giữ ẩn dụ nguyên văn trong một cấu trúc dễ hiểu đối với độc giả phổ thông.
