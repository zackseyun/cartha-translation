revisions:
- from: Đừng trao các phần thân thể mình cho tội lỗi làm vũ khí của sự bất chính[a]; trái lại, hãy dâng chính mình cho Đức Chúa Trời như những người từ cõi chết mà sống, và trao các phần thân thể mình cho Đức Chúa Trời làm vũ khí của sự công chính[b].
  to: Đừng dâng các phần thân thể mình cho tội lỗi làm vũ khí của sự bất chính[a]; nhưng hãy dâng chính mình cho Đức Chúa Trời như những người từ sự chết mà sống, và dâng các phần thân thể mình cho Đức Chúa Trời làm vũ khí của sự công chính[b].
  rationale: Bản sửa giữ đầy đủ cấu trúc đối lập và các quan hệ cú pháp của câu Hy Lạp, đồng thời dùng nhất quán một động từ cho παριστάνετε / παραστήσατε. Cụm chỉ sự sống được điều chỉnh để không thêm hình ảnh “cõi” hoặc diễn giải rằng ai đã làm họ sống. Chú thích từ vựng cho δικαιοσύνη được chuẩn hóa thành lựa chọn tiếng Việt sát nghĩa hơn.
  reviewer_model: gpt-5.6-terra
