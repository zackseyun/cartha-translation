id: ROM.6.13
reference: Romans 6:13
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: μηδὲ παριστάνετε τὰ μέλη ὑμῶν ὅπλα ἀδικίας τῇ ἁμαρτίᾳ, ἀλλὰ παραστήσατε ἑαυτοὺς τῷ θεῷ ⸀ὡσεὶ ἐκ νεκρῶν ζῶντας καὶ τὰ μέλη ὑμῶν ὅπλα δικαιοσύνης τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/013.yaml
  text: And do not present your members to sin as weapons of unrighteousness[a], but present yourselves to God as alive from the dead[b], and your members to God as weapons of righteousness.
translation:
  language: vi
  text: Đừng dâng các phần thân thể mình cho tội lỗi làm vũ khí của sự bất chính[a]; nhưng hãy dâng chính mình cho Đức Chúa Trời như những người từ sự chết mà sống, và dâng các phần thân thể mình cho Đức Chúa Trời làm vũ khí của sự công chính[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “công cụ” của sự bất chính và của sự công chính.
    reason: lexical_alternative
  - marker: b
    text: “Sự công chính” cũng có thể dịch là “công lý.”
    reason: lexical_alternative
lexical_decisions:
- source_word: παριστάνετε / παραστήσατε
  choice: trao / dâng
  rationale: Động từ mang ý đặt một người hay thân thể mình dưới quyền sử dụng của bên khác. “Trao” tự nhiên với các phần thân thể, còn “dâng chính mình” tự nhiên và trang trọng khi hướng về Đức Chúa Trời; cả hai vẫn giữ ý tự nguyện đặt mình dưới quyền sử dụng.
- source_word: μέλη
  choice: các phần thân thể mình
  rationale: Cách dịch này chỉ rõ các bộ phận của thân thể dùng trong hành động đạo đức, đồng thời dễ hiểu hơn “các chi thể” trong tiếng Việt hiện đại.
- source_word: ὅπλα
  choice: vũ khí
  rationale: Giữ hình ảnh chiến trận rõ nét của từ Hy Lạp; nghĩa rộng hơn “công cụ” được ghi ở chú thích.
- source_word: ἀδικίας
  choice: sự bất chính
  rationale: Giữ sắc thái đạo đức-thần học và tạo cặp đối lập trực tiếp với “sự công chính”.
- source_word: ἁμαρτίᾳ
  choice: tội lỗi
  rationale: Dịch trực tiếp danh từ Hy Lạp và vẫn để ngỏ sắc thái nhân cách hóa tội lỗi như một quyền lực trong văn mạch.
- source_word: ὡσεὶ ἐκ νεκρῶν ζῶντας
  choice: như những người từ cõi chết mà sống
  rationale: Giữ từ so sánh “như”, chuyển động “từ cõi chết” và tình trạng “sống” mà không diễn giải thêm cơ chế khiến họ sống.
- source_word: δικαιοσύνης
  choice: sự công chính
  rationale: Phù hợp với văn mạch đạo đức-thần học của Phao-lô và đối xứng với “sự bất chính”; nghĩa “sự công minh” được bảo lưu trong chú thích.
theological_decisions:
- issue: Sự đối lập giữa tội lỗi và Đức Chúa Trời như hai bên đòi quyền sử dụng con người
  choice: Giữ trực tiếp các quan hệ “cho tội lỗi” và “cho Đức Chúa Trời”.
  alternative: Diễn giải thành “để phục vụ tội lỗi” và “để phục vụ Đức Chúa Trời”.
  rationale: Các cách diễn đạt trực tiếp đã hàm ý sự quy phục và hướng phục vụ, nhưng không thêm lời giải thích vượt quá bản Hy Lạp.
- issue: Sắc thái phục sinh trong ὡσεὶ ἐκ νεκρῶν ζῶντας
  choice: “như những người từ cõi chết mà sống”
  alternative: “như những người đã được làm cho sống lại từ cõi chết”
  rationale: Bản dịch giữ hình ảnh từ chết sang sống và lực so sánh của ὡσεὶ, nhưng không thêm thể bị động hay xác định rõ tác nhân vốn không được nêu trong cụm từ này.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “Đức Chúa Trời” cho θεός; dùng “các phần thân thể mình” thay cho thuật ngữ cổ hoặc dễ gây hiểu nhầm “các chi thể”. Cấu trúc đối lập và hình ảnh chiến trận của câu Hy Lạp được giữ rõ.
