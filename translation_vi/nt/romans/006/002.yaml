source:
  edition: SBLGNT
  text: μὴ γένοιτο· οἵτινες ἀπεθάνομεν τῇ ἁμαρτίᾳ, πῶς ἔτι ζήσομεν ἐν αὐτῇ;
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/002.yaml
  text: Absolutely not! We who died to sin—how can we still live in it?[a]
translation:
  language: vi
  text: Tuyệt đối không! Chúng ta đã chết đối với tội lỗi, làm sao còn có thể sống trong tội lỗi?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Quyết không!”; đây là một lời bác bỏ rất mạnh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ γένοιτο
  choice: Tuyệt đối không!
  rationale: Thành ngữ bày tỏ sự bác bỏ rất mạnh. Cách dịch này tự nhiên trong tiếng Việt hiện đại và giữ được sức nặng của lời phủ định.
- source_word: οἵτινες
  choice: Chúng ta là những người
  rationale: Đại từ quan hệ xác định chính những tín hữu đang được nói đến, đồng thời giữ cách diễn đạt bao gồm cả Phao-lô qua ngôi thứ nhất số nhiều.
- source_word: ἀπεθάνομεν
  choice: đã chết
  rationale: Thì aorist trình bày sự việc như một biến cố xác định; “đã chết” diễn đạt rõ điều đó mà không giải thích thêm bản chất của sự chết này.
- source_word: τῇ ἁμαρτίᾳ
  choice: đối với tội lỗi
  rationale: 'Dữ cách với động từ “chết” chỉ mối quan hệ hay phương diện: chết xét trong quan hệ với tội lỗi. “Đối với tội lỗi” chính xác và giữ nguyên ẩn dụ.'
- source_word: πῶς ἔτι
  choice: làm sao còn có thể
  rationale: Diễn đạt cả sắc thái nghi vấn tu từ đầy ngỡ ngàng lẫn ý tiếp diễn của ἔτι.
- source_word: ζήσομεν
  choice: sống
  rationale: Thì tương lai được dùng trong câu hỏi tu từ; kết hợp “có thể sống” là cách nói tự nhiên trong tiếng Việt mà vẫn giữ nguyên lực của câu.
- source_word: ἐν αὐτῇ
  choice: trong đó
  rationale: Đại từ quy chiếu về tội lỗi như một phạm vi hay quyền lực. “Trong đó” giữ liên kết của nguyên văn và tránh lặp từ không cần thiết.
theological_decisions:
- issue: Câu nói mô tả sự cải thiện đạo đức hay một sự đoạn tuyệt dứt khoát với quyền thống trị của tội lỗi
  choice: Giữ nguyên ẩn dụ “đã chết đối với tội lỗi” mà không diễn giải cơ chế thần học.
  alternative: “đã trở nên vô cảm với tội lỗi” hoặc “đã quay lưng lại với tội lỗi”
  rationale: Nguyên văn trực tiếp nói về việc chết đối với tội lỗi. Giữ nguyên hình ảnh này bảo tồn sức căng thần học và không thu hẹp câu vào một cách giải thích riêng về tiến trình nên thánh.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Câu hỏi tu từ và ẩn dụ “chết đối với tội lỗi” được giữ nguyên; đại từ “chúng ta” bảo tồn giọng điệu bao gồm của nguyên văn.
