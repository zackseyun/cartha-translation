  to: Tuyệt đối không! Chúng ta đã chết đối với tội lỗi, làm sao còn có thể sống trong tội lỗi?[a]
  rationale: Bản sửa giữ nguyên ý nghĩa và ẩn dụ của nguyên văn, đồng thời thay cấu trúc quan hệ nặng bằng cách diễn đạt tiếng Việt hiện đại tự nhiên hơn. Việc lặp “tội lỗi” giúp câu cuối rõ nghĩa. Chú thích được điều chỉnh để nêu phương án thay thế phản ánh trực tiếp hơn sắc thái bác bỏ mạnh của μὴ γένοιτο.
