id: ROM.6.16
reference: Romans 6:16
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οὐκ οἴδατε ὅτι ᾧ παριστάνετε ἑαυτοὺς δούλους εἰς ὑπακοήν, δοῦλοί ἐστε ᾧ ὑπακούετε, ἤτοι ἁμαρτίας εἰς θάνατον ἢ ὑπακοῆς εἰς δικαιοσύνην;
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/016.yaml
  text: Do you not know that if you present yourselves as servants for obedience[a], you are servants of the one whom you obey—either of sin leading to death, or of obedience leading to righteousness?
translation:
  language: vi
  text: 'Anh em không biết rằng: anh em tự đặt mình làm nô lệ để vâng phục ai, thì anh em là nô lệ của người anh em vâng phục đó sao? Hoặc là nô lệ cho tội lỗi, dẫn đến sự chết, hoặc là nô lệ cho sự vâng phục, dẫn đến sự công chính[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “công lý”.
    reason: lexical_alternative
lexical_decisions:
- source_word: παριστάνετε ἑαυτούς
  choice: tự hiến mình cho ai
  rationale: Diễn đạt việc chủ động đặt chính mình dưới quyền và sẵn sàng phục vụ một chủ; tự nhiên hơn lối dịch sát cứng “trình diện chính mình”.
- source_word: δούλους / δοῦλοί
  choice: nô lệ
  rationale: Giữ rõ địa vị bị chủ sở hữu và chi phối, vốn là trọng tâm của hình ảnh tương phản trong câu.
- source_word: εἰς ὑπακοήν
  choice: để vâng phục
  rationale: Chuyển danh từ Hy Lạp thành động từ tự nhiên trong tiếng Việt, đồng thời giữ ý mục đích của εἰς.
- source_word: ᾧ ὑπακούετε
  choice: kẻ mình vâng phục
  rationale: Giữ sắc thái quy chiếu đến một chủ trong hình ảnh nô lệ mà không thêm danh từ “chủ” vào nguyên văn.
- source_word: ἁμαρτίας
  choice: tội lỗi
  rationale: Giữ cách nói trực tiếp của nguyên văn; ngữ cảnh nô lệ tự truyền đạt sự nhân cách hóa tội lỗi.
- source_word: εἰς θάνατον
  choice: dẫn đến sự chết
  rationale: Thể hiện rõ hướng đi hoặc kết quả của εἰς bằng cách nói hiện đại.
- source_word: ὑπακοῆς
  choice: sự vâng phục
  rationale: Giữ danh từ trừu tượng và thế đối xứng của nguyên văn giữa tội lỗi và sự vâng phục.
- source_word: δικαιοσύνην
  choice: sự công chính
  rationale: Thuật ngữ quen thuộc, trang trọng trong văn mạch Phao-lô, bao quát sắc thái đạo đức và thần học hơn “công lý” đơn thuần.
theological_decisions:
- issue: Cách dịch δικαιοσύνη trong thế tương phản của Phao-lô
  choice: sự công chính
  alternative: công lý
  rationale: Trong văn mạch này, sự chết được đặt đối lập với kết quả của sự vâng phục; “sự công chính” giữ được chiều kích đạo đức-thần học rộng, còn khả năng “công lý” được bảo lưu trong chú thích.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh em” cho số nhiều ngôi thứ hai theo văn phong thư tín; lặp “nô lệ” để giữ sức nặng và cấu trúc đối xứng của nguyên văn.
