revisions:
- from: Nhưng một khi đã được giải thoát khỏi tội lỗi, anh chị em trở thành nô lệ của sự công chính.[a]
  to: Nhưng sau khi được giải thoát khỏi tội lỗi, anh chị em đã bị đặt làm nô lệ của sự công chính.[a]
  rationale: 'Bản sửa khôi phục thể bị động của cả hai động từ trọng tâm: người nghe «được giải thoát» và «đã bị đặt làm nô lệ». «Nhưng» có thể giữ được như một liên từ đối lập nhẹ trong diễn tiến lập luận trực tiếp, và «sự công chính» tiếp tục là thuật ngữ chính cho δικαιοσύνη. Ghi chú được đổi để nêu một phương án từ vựng rộng và phù hợp hơn.'
  reviewer_model: gpt-5.6-terra
