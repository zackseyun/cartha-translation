review_pass:
  verdict: revise
  source_fidelity: Bản nháp truyền đạt đúng sự đối lập giữa tội lỗi và sự công chính, đồng thời giữ được hình ảnh «nô lệ». Tuy nhiên, «trở thành nô lệ» làm mờ thể bị động của ἐδουλώθητε; nguyên ngữ nói người nghe đã bị đặt/làm thành nô lệ cho sự công chính. «Một khi» cũng thêm một sắc thái điều kiện-thời điểm không cần thiết cho phân từ bất định đã hoàn tất.
  naturalness: Câu sửa giữ văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. «Sau khi được giải thoát» diễn đạt tự nhiên phân từ bất định thụ động; «đã bị đặt làm nô lệ của» giữ rõ cả tính bị động lẫn phép ẩn dụ mạnh của động từ δουλόω.
  terminology: «Tội lỗi», «nô lệ», và «sự công chính» là các lựa chọn phù hợp với mạch văn Phao-lô. Ghi chú «sự chính trực» không phải là lựa chọn từ vựng tương đương tốt nhất cho δικαιοσύνη trong ngữ cảnh này, vì thu hẹp thuật ngữ vào phẩm hạnh cá nhân; «công lý» phản ánh tốt hơn lựa chọn thay thế trong audit trail mà không thay thế thuật ngữ chính.
  issues:
  - severity: medium
    issue: Thể bị động của ἐδουλώθητε bị suy giảm
    rationale: '«Trở thành nô lệ» chủ yếu nêu kết quả/trạng thái, còn ἐδουλώθητε là động từ bất định thụ động: «đã bị đặt/làm thành nô lệ». Bản sửa bảo toàn hành động được thực hiện trên người nghe.'
  - severity: low
    issue: «Một khi» thêm sắc thái không có trong phân từ
    rationale: ἐλευθερωθέντες chỉ hành động đã hoàn tất, làm nền cho mệnh đề chính; «sau khi được giải thoát» sát nghĩa hơn mà vẫn tự nhiên.
  - severity: low
    issue: Ghi chú từ vựng cần điều chỉnh
    rationale: «Sự chính trực» hẹp hơn phạm vi δικαιοσύνη; «công lý» là phương án thay thế thích hợp hơn và phù hợp audit trail tiếng Anh.
