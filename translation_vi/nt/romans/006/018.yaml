  text: ἐλευθερωθέντες δὲ ἀπὸ τῆς ἁμαρτίας ἐδουλώθητε τῇ δικαιοσύνῃ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/018.yaml
  text: And having been freed from sin[b][a], you were enslaved to righteousness.
translation:
  language: vi
  text: Nhưng sau khi được giải thoát khỏi tội lỗi, anh chị em đã bị đặt làm nô lệ của sự công chính.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “công lý.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλευθερωθέντες
  choice: một khi đã được giải thoát
  rationale: Phân từ bất định thụ động chỉ hành động giải phóng mà người nhận đã trải qua; cách diễn đạt này giữ ý hoàn tất và thể thụ động, đồng thời tự nhiên trong tiếng Việt.
- source_word: δὲ
  choice: Nhưng
  rationale: Liên từ chuyển ý nhẹ; trong mạch đối lập giữa quyền thống trị của tội lỗi và sự công chính, “Nhưng” thể hiện quan hệ lập luận rõ ràng mà không cường điệu.
- source_word: ἁμαρτίας
  choice: tội lỗi
  rationale: Danh từ số ít có mạo từ có thể vừa chỉ tội lỗi nói chung vừa gợi tội lỗi như một quyền lực thống trị; “tội lỗi” bảo toàn cả hai sắc thái.
- source_word: ἐδουλώθητε
  choice: trở thành nô lệ
  rationale: Động từ bất định thụ động của δουλόω diễn tả việc bị đặt dưới thân phận hoặc quyền làm chủ của một chủ khác. “Trở thành nô lệ” giữ nguyên ẩn dụ mạnh về chế độ nô lệ và đọc tự nhiên hơn lối dịch máy móc “đã bị nô lệ hóa”.
- source_word: δικαιοσύνῃ
  choice: sự công chính
  rationale: Giữ thuật ngữ quen thuộc của Phao-lô với các sắc thái đạo đức, giao ước và pháp đình; cách dịch khác “sự chính trực” được ghi chú để phản ánh phạm vi nghĩa mà không thu hẹp câu chính.
theological_decisions:
- issue: Ẩn dụ δουλόω về chế độ nô lệ
  choice: trở thành nô lệ của sự công chính
  alternative: trở thành tôi tớ của sự công chính
  rationale: Mạch lập luận trong Rô-ma 6 dựa vào sự chuyển đổi quyền làm chủ từ tội lỗi sang sự công chính. “Nô lệ” bảo toàn sức nặng gây căng thẳng của ẩn dụ, còn “tôi tớ” sẽ làm nhẹ ý bị đặt dưới quyền.
- issue: Sắc thái của δικαιοσύνη
  choice: sự công chính
  alternative: sự chính trực
  rationale: “Sự công chính” giữ độ rộng thần học và pháp đình của thuật ngữ Phao-lô, trong khi không buộc câu này chỉ mang nghĩa công lý xã hội hoặc phẩm hạnh cá nhân.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “anh chị em” diễn đạt số nhiều của động từ Hy Lạp. Cấu trúc được điều chỉnh tự nhiên cho tiếng Việt nhưng vẫn giữ thể thụ động của hành động giải thoát và ẩn dụ nô lệ ở mệnh đề chính.
