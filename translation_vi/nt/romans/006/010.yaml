  text: ὃ γὰρ ἀπέθανεν, τῇ ἁμαρτίᾳ ἀπέθανεν ἐφάπαξ· ὃ δὲ ζῇ, ζῇ τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/010.yaml
  text: For the death he died[a], he died to sin once for all; but the life he lives, he lives to God.
translation:
  language: vi
  text: Vì Ngài đã chết thì đã chết đối với tội lỗi[a] một lần là đủ cả; còn Ngài sống thì sống cho Đức Chúa Trời.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Ngài đã chết vì tội lỗi” hoặc “Ngài đã chết liên quan đến tội lỗi.”'
    reason: Ghi nhận các cách hiểu hợp lý của cách dữ τῇ ἁμαρτίᾳ và bảo tồn tính đa nghĩa thật sự của nguyên văn.
lexical_decisions:
- source_word: ὃ γὰρ ἀπέθανεν
  choice: Vì sự chết mà Ngài đã chết
  rationale: Cụm đại từ quan hệ giống trung ὃ kết hợp với động từ lặp lại chỉ sự việc Ngài đã chết. Cách dịch này giữ được nét nhấn mạnh và cấu trúc song song của nguyên văn, đồng thời γάρ được thể hiện bằng “Vì” để nối câu với lời giải thích trước đó.
- source_word: ἀπέθανεν
  choice: đã chết
  rationale: Thì aorist chỉ hành động đã hoàn tất; “đã chết” là cách diễn đạt tự nhiên trong tiếng Việt và nêu rõ sự kiện quá khứ.
- source_word: τῇ ἁμαρτίᾳ
  choice: đối với tội lỗi
  rationale: Cách dịch này giữ nghĩa quan hệ của cách dữ và không mặc nhiên giải thích thành sự chết đền tội. Nó cũng duy trì sự tương ứng về ý với τῷ θεῷ ở vế sau.
- source_word: ἐφάπαξ
  choice: một lần đủ cả
  rationale: Diễn đạt một hành động duy nhất, không cần lặp lại và có hiệu lực trọn vẹn; đây là cách nói trang trọng nhưng vẫn dễ hiểu trong tiếng Việt.
- source_word: ὃ δὲ ζῇ
  choice: nhưng sự sống Ngài đang sống
  rationale: Giữ cấu trúc song song với “sự chết mà Ngài đã chết”; thể hiện δέ bằng “nhưng” để làm rõ sự tương phản giữa chết và sống.
- source_word: τῷ θεῷ
  choice: cho Đức Chúa Trời
  rationale: “Cho Đức Chúa Trời” diễn đạt sự quy hướng của đời sống về Đức Chúa Trời và tạo một đối xứng tự nhiên về nghĩa với “đối với tội lỗi”.
theological_decisions:
- issue: τῇ ἁμαρτίᾳ có thể được hiểu là “đối với tội lỗi”, “vì tội lỗi” hoặc “liên quan đến tội lỗi”.
  choice: đối với tội lỗi
  alternative: vì tội lỗi; liên quan đến tội lỗi
  rationale: “Đối với tội lỗi” bảo toàn sự căng thẳng thần học và phép đối lập của Phao-lô mà không hàm ý Đấng Christ có tội riêng, cũng không đưa cách giải thích về sự đền tội trực tiếp vào chính văn.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” cho chủ thể là Đấng Christ và “Đức Chúa Trời” cho θεός. Giữ phép song song giữa chết và sống, đồng thời tránh diễn giải giáo phái.
