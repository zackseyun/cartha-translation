id: ROM.6.23
reference: Romans 6:23
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: τὰ γὰρ ὀψώνια τῆς ἁμαρτίας θάνατος, τὸ δὲ χάρισμα τοῦ θεοῦ ζωὴ αἰώνιος ἐν Χριστῷ Ἰησοῦ τῷ κυρίῳ ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/023.yaml
  text: For the wages of sin is death[b][a], but the gift of God is eternal life in Messiah Jesus our Lord.
translation:
  language: vi
  text: Vì tiền công của tội lỗi là sự chết, nhưng quà tặng[a] của Đức Chúa Trời là sự sống đời đời trong Đấng Mê-si-a Giê-su[b], Chúa chúng ta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “ân huệ” hoặc “quà tặng bởi ân điển.”'
    reason: lexical_alternative
  - marker: b
    text: Cụm “trong Đấng Mê-si-a Giê-su” cũng có thể được hiểu là “nhờ Đấng Mê-si-a Giê-su,” nhưng “trong” sát với cách diễn đạt của nguyên văn hơn.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀψώνια
  choice: tiền công
  rationale: Danh từ số nhiều chỉ khoản được trả hay điều người ta kiếm được; “tiền công” tự nhiên trong tiếng Việt và giữ rõ sự tương phản giữa điều kiếm được với quà tặng.
- source_word: τῆς ἁμαρτίας
  choice: của tội lỗi
  rationale: Giữ cấu trúc sở hữu cô đọng của nguyên văn, có thể gợi cả tiền công thuộc về tội lỗi lẫn điều tội lỗi trả.
- source_word: θάνατος
  choice: sự chết
  rationale: Chuyển tải trực tiếp danh từ vị ngữ mà không tự ý giới hạn vào cái chết thể chất hay thuộc linh.
- source_word: χάρισμα
  choice: quà tặng
  rationale: Diễn đạt tự nhiên điều được ban nhưng không, đồng thời duy trì sự đối lập với “tiền công”; sắc thái ân điển được ghi ở chú thích.
- source_word: ζωὴ αἰώνιος
  choice: sự sống đời đời
  rationale: Cách diễn đạt quen thuộc, trang trọng và chính xác, bao hàm cả tính trường tồn lẫn phẩm chất thần học của sự sống.
- source_word: ἐν
  choice: trong
  rationale: Giữ nguyên hình ảnh Phao-lô về phạm vi hay sự hiệp nhất với Đấng Mê-si-a, thay vì thu hẹp thành ý nghĩa phương tiện.
- source_word: Χριστῷ
  choice: Đấng Mê-si-a
  rationale: Dịch tước hiệu Χριστός theo nghĩa nguồn là Đấng Mê-si-a, thay vì chỉ phiên âm thành “Christ”.
- source_word: κυρίῳ
  choice: Chúa
  rationale: Cách dịch tự nhiên và trang trọng, giữ sức nặng tuyên xưng của κύριος trong ngữ cảnh.
theological_decisions:
- issue: Ý nghĩa của ἐν Χριστῷ Ἰησοῦ
  choice: trong Đấng Mê-si-a Jêsus
  alternative: nhờ Đấng Mê-si-a Jêsus
  rationale: “Trong” bảo tồn nghĩa tự nhiên về phạm vi hoặc sự hiệp nhất với Đấng Mê-si-a, không lặng lẽ biến cụm từ thành phương tiện đơn thuần.
- issue: Phạm vi nghĩa của θάνατος
  choice: sự chết
  alternative: cái chết thể chất; sự chết thuộc linh
  rationale: Nguyên văn không xác định riêng loại chết nào tại đây; bản dịch giữ nguyên độ rộng và sức căng thần học.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “tiền công” và “quà tặng” để làm nổi bật phép đối lập của câu; dùng “Đấng Mê-si-a Jêsus” để thể hiện Χριστός như một tước hiệu. Đại từ “chúng ta” bao gồm người nói và người nghe, phù hợp với ἡμῶν.
