revisions:
- from: Tôi nói theo cách của loài người vì xác thịt anh chị em yếu đuối.[a] Trước đây, anh chị em đã hiến các chi thể mình làm nô lệ cho sự ô uế và sự vô luật pháp, dẫn đến càng vô luật pháp thể nào, thì bây giờ hãy hiến các chi thể mình làm nô lệ cho sự công chính,[b] dẫn đến sự thánh hóa thể ấy.
  to: Tôi nói theo cách của loài người vì sự yếu đuối của xác thịt anh chị em.[a] Vì cũng như trước đây anh chị em đã đặt các chi thể của mình làm nô lệ cho sự ô uế và sự vô luật pháp, dẫn đến sự vô luật pháp, thì nay cũng vậy, hãy đặt các chi thể của mình làm nô lệ cho sự công chính,[b] dẫn đến sự thánh hóa.
  rationale: Bản sửa loại bỏ ý tăng cấp không được nêu trực tiếp trong nguyên văn, đồng thời làm rõ đối chiếu “cũng như ... thì nay cũng vậy” và giữ sự lặp lại có chủ ý của các động từ và thuật ngữ then chốt.
