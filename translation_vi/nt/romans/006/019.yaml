id: ROM.6.19
reference: Romans 6:19
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀνθρώπινον λέγω διὰ τὴν ἀσθένειαν τῆς σαρκὸς ὑμῶν· ὥσπερ γὰρ παρεστήσατε τὰ μέλη ὑμῶν δοῦλα τῇ ἀκαθαρσίᾳ καὶ τῇ ἀνομίᾳ εἰς τὴν ἀνομίαν, οὕτως νῦν παραστήσατε τὰ μέλη ὑμῶν δοῦλα τῇ δικαιοσύνῃ εἰς ἁγιασμόν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/019.yaml
  text: I am speaking in human terms because of the weakness of your flesh[a]. For just as you presented your members as servants to impurity and to lawlessness, leading to lawlessness, so now present your members as servants to righteousness[b], leading to sanctification.
translation:
  language: vi
  text: Tôi nói theo cách của loài người vì sự yếu đuối của xác thịt anh chị em.[a] Vì cũng như trước đây anh chị em đã đặt các chi thể của mình làm nô lệ cho sự ô uế và sự vô luật pháp, dẫn đến sự vô luật pháp, thì nay cũng vậy, hãy đặt các chi thể của mình làm nô lệ cho sự công chính,[b] dẫn đến sự thánh hóa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Xác thịt” ở đây cũng có thể được hiểu theo lối diễn giải hơn là “bản tính tội lỗi”, nhưng tiếng Hy Lạp có nghĩa rộng hơn.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “công lý”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνθρώπινον λέγω
  choice: Tôi nói theo cách của loài người
  rationale: Diễn đạt thành ngữ Hy Lạp bằng tiếng Việt tự nhiên, cho thấy Phao-lô đang dùng lối trình bày phù hợp với sự hiểu biết thông thường của con người mà không thu hẹp thành một phép loại suy cụ thể.
- source_word: ἀσθένειαν τῆς σαρκὸς ὑμῶν
  choice: vì xác thịt anh chị em yếu đuối
  rationale: Giữ hình ảnh rộng của σάρξ và cấu trúc ý nghĩa về sự yếu đuối, không diễn giải hẹp thành “bản tính tội lỗi”.
- source_word: παρεστήσατε / παραστήσατε
  choice: đã hiến / hãy hiến
  rationale: Dùng cùng một động từ để bảo toàn sự lặp lại và thế đối lập giữa hành vi trước đây với lời kêu gọi hiện nay; “hiến” cũng diễn tả việc đặt chính mình vào sự phục vụ.
- source_word: τὰ μέλη
  choice: các chi thể mình
  rationale: “Chi thể” bảo toàn cách nói của Phao-lô về các bộ phận và năng lực thuộc thân thể, đồng thời phù hợp với văn phong Kinh Thánh trang trọng mà vẫn dễ hiểu.
- source_word: δοῦλα
  choice: nô lệ
  rationale: Hình ảnh chế độ nô lệ là trọng tâm lập luận trong Rô-ma 6; “nô lệ” giữ được sức nặng về quyền làm chủ và sự lệ thuộc hơn “đầy tớ”.
- source_word: ἀκαθαρσίᾳ
  choice: sự ô uế
  rationale: Diễn đạt rõ nghĩa luân lý của từ Hy Lạp và giữ sắc thái trang trọng.
- source_word: ἀνομίᾳ / ἀνομίαν
  choice: sự vô luật pháp / vô luật pháp
  rationale: Giữ nguyên sự lặp từ và đà tiến triển tu từ từ tình trạng vô luật pháp đến càng vô luật pháp.
- source_word: εἰς τὴν ἀνομίαν
  choice: dẫn đến càng vô luật pháp
  rationale: εἰς biểu thị hướng đi hoặc kết quả; thêm “càng” làm rõ sự gia tăng hàm chứa trong việc vô luật pháp sinh thêm vô luật pháp mà không thay đổi hướng nghĩa.
- source_word: δικαιοσύνῃ
  choice: sự công chính
  rationale: “Công chính” phù hợp với cách dùng của Phao-lô và tạo thế đối lập đạo đức với ô uế và vô luật pháp; khả năng dịch là “công lý” được bảo lưu trong chú thích.
- source_word: εἰς ἁγιασμόν
  choice: dẫn đến sự thánh hóa
  rationale: Giữ sắc thái hướng tới kết quả hoặc tiến trình của εἰς và ἁγιασμός; “thánh hóa” diễn tả rõ tiến trình trở nên thánh khiết.
theological_decisions:
- issue: Ý nghĩa của σάρξ trong cụm “sự yếu đuối của xác thịt anh chị em”
  choice: xác thịt
  alternative: bản tính tội lỗi
  rationale: Ngữ cảnh liên quan đến giới hạn và sự dễ sa ngã của con người trong đời sống có thân xác, nhưng tiếng Hy Lạp không buộc phải hiểu theo nghĩa giáo lý hẹp là “bản tính tội lỗi”. Giữ “xác thịt” bảo toàn độ rộng và sức căng thần học của câu.
- issue: Cách dịch δικαιοσύνη trong ngữ cảnh Phao-lô
  choice: sự công chính
  alternative: công lý
  rationale: Trong thế đối lập với ô uế và vô luật pháp ở đây, “sự công chính” phù hợp nhất với ý nghĩa đạo đức; “công lý” vẫn là một khả năng từ vựng chính đáng và được ghi ở chú thích.
- issue: Sắc thái của ἁγιασμός
  choice: sự thánh hóa
  alternative: sự thánh khiết
  rationale: Mạch lập luận mô tả một hướng đi hay kết quả phát sinh từ việc làm nô lệ cho sự công chính. “Sự thánh hóa” giữ rõ sắc thái tiến trình/kết quả, trong khi “sự thánh khiết” có thể nhấn mạnh trạng thái.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng và dễ hiểu. Dùng “anh chị em” để chuyển đại từ số nhiều ὑμῶν; giữ hình ảnh “nô lệ” và thuật ngữ “chi thể” vì chúng thiết yếu cho lập luận của cả phân đoạn. Các dấu chú thích [a], [b] đều xuất hiện trong chính văn và được đặt ngay sau từ/cụm từ liên quan.
