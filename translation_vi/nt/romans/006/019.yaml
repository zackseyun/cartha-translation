  - severity: low
    issue: Cấu trúc “dẫn đến ... thể nào, thì ... dẫn đến ... thể ấy” thiếu tự nhiên.
    rationale: Hai cụm chỉ kết quả chen vào làm cấu trúc so sánh tiếng Việt nặng và khó theo dõi. Có thể chuyển thành “cũng như ... thì nay cũng vậy ...” mà vẫn bảo toàn đối chiếu ὥσπερ ... οὕτως.
