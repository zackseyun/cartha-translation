  text: Ὅτε γὰρ δοῦλοι ἦτε τῆς ἁμαρτίας, ἐλεύθεροι ἦτε τῇ δικαιοσύνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/020.yaml
  text: For when you were servants of sin[b][a], you were free in regard to righteousness.
translation:
  language: vi
  text: Vì khi anh em còn là nô lệ của tội lỗi, anh em được tự do đối với sự công chính[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: «khỏi sự công chính» hoặc «xét về sự công chính».'
    reason: lexical_alternative
lexical_decisions:
- source_word: δοῦλοι
  choice: nô lệ
  rationale: Giữ sắc thái lệ thuộc mạnh và sự đối lập giữa hai ách nô lệ xuyên suốt Rô-ma 6; «đầy tớ» sẽ làm nhẹ hình ảnh này.
- source_word: ἁμαρτίας
  choice: của tội lỗi
  rationale: 'Diễn đạt tự nhiên quan hệ sở thuộc/quyền chi phối của sở hữu cách: họ là nô lệ thuộc quyền tội lỗi.'
- source_word: ἐλεύθεροι
  choice: được tự do
  rationale: 'Bảo toàn nghịch lý sắc bén của Phao-lô: khi làm nô lệ cho tội lỗi, họ không bị sự công chính ràng buộc.'
- source_word: τῇ δικαιοσύνῃ
  choice: đối với sự công chính
  rationale: Hiểu cách dữ liệu như chỉ phương diện hoặc quan hệ; cách dịch này tự nhiên trong tiếng Việt và không khiến sự công chính nghe như một thế lực áp bức mà họ được giải thoát khỏi.
- source_word: δικαιοσύνῃ
  choice: sự công chính
  rationale: Phù hợp với cách dùng chủ đạo của δικαιοσύνη trong lập luận của Phao-lô; «công lý» là khả năng từ vựng nhưng kém phù hợp hơn trong ngữ cảnh này.
- source_word: γὰρ
  choice: Vì
  rationale: Giữ liên kết giải thích với lập luận ngay trước đó.
theological_decisions:
- issue: Cách diễn đạt mối quan hệ với sự công chính trong thế đối lập của Phao-lô
  choice: đối với sự công chính, anh em được tự do
  alternative: anh em được tự do khỏi sự công chính; anh em không liên can gì đến sự công chính
  rationale: Giữ được sự căng thẳng tu từ và tính mơ hồ có thật của cách dữ liệu, không biến sự công chính thành một ách áp bức cũng không diễn giải quá mức thành sự hoàn toàn không liên can.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Dùng «anh em» cho ngôi thứ hai số nhiều theo lối xưng hô quen thuộc trong thư tín Tân Ước; giữ «nô lệ» để phản ánh đầy đủ hình ảnh của nguyên ngữ.
