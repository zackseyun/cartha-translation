revisions:
- from: Nhưng giờ đây, sau khi được giải thoát khỏi tội lỗi và được đặt làm nô lệ cho Đức Chúa Trời[a], anh chị em có hoa trái dẫn đến sự thánh hóa[b], và kết cuộc[c] là sự sống đời đời.
  to: Nhưng giờ đây, được giải thoát khỏi tội lỗi và được làm nô lệ của Đức Chúa Trời[a], anh chị em có hoa trái dẫn đến sự thánh hóa[b], và kết cuộc ấy là sự sống đời đời[c].
  rationale: Chỉnh nhẹ để tiếng Việt tự nhiên hơn và bảo toàn sát hơn cấu trúc hai phân từ bị động song hành trong tiếng Hy Lạp. Không thay đổi các lựa chọn thuật ngữ thần học cốt yếu, cũng không giải quyết quá mức sắc thái của ἁγιασμός hay τέλος.
