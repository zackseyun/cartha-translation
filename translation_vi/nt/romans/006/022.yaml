id: ROM.6.22
reference: Romans 6:22
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: νυνὶ δέ, ἐλευθερωθέντες ἀπὸ τῆς ἁμαρτίας δουλωθέντες δὲ τῷ θεῷ, ἔχετε τὸν καρπὸν ὑμῶν εἰς ἁγιασμόν, τὸ δὲ τέλος ζωὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/022.yaml
  text: But now[a], having been freed from sin and enslaved to God, you have your fruit unto sanctification, and the end[c][b], eternal life.
translation:
  language: vi
  text: Nhưng giờ đây, được giải thoát khỏi tội lỗi và được làm nô lệ của Đức Chúa Trời[a], anh chị em có hoa trái dẫn đến sự thánh hóa[b], và kết cuộc ấy là sự sống đời đời[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “sau khi trở thành nô lệ của Đức Chúa Trời.”'
    reason: Phương án diễn đạt tự nhiên hơn, nhưng không thể hiện rõ thể bị động của δουλωθέντες như chính văn.
  - marker: b
    text: 'Hay: “sự thánh khiết.”'
    reason: ἁγιασμός có thể chỉ cả tiến trình thánh hóa lẫn tình trạng thánh khiết.
  - marker: c
    text: 'Hay: “kết quả cuối cùng” hoặc “điểm đến cuối cùng.”'
    reason: τέλος có thể nhấn mạnh kết quả, điểm đến, hoặc kết cuộc.
lexical_decisions:
- source_word: νυνὶ δέ
  choice: Nhưng giờ đây
  rationale: Giữ rõ sự tương phản mạnh với tình trạng trước kia, đồng thời diễn đạt tự nhiên trong tiếng Việt hiện đại.
- source_word: ἐλευθερωθέντες ἀπὸ τῆς ἁμαρτίας
  choice: sau khi được giải thoát khỏi tội lỗi
  rationale: Cấu trúc bị động và ý nghĩa hành động đã xảy ra của phân từ được giữ lại; số ít ἁμαρτία được hiểu theo mạch văn là quyền lực hay phạm vi của tội lỗi.
- source_word: δουλωθέντες δὲ τῷ θεῷ
  choice: và được đặt làm nô lệ cho Đức Chúa Trời
  rationale: Giữ thể bị động cùng hình ảnh nô lệ mạnh mẽ mà Phao-lô cố ý dùng để đối lập với ách nô lệ của tội lỗi.
- source_word: ἔχετε τὸν καρπὸν ὑμῶν
  choice: anh chị em có hoa trái
  rationale: Giữ động từ 'có' và hình ảnh nông nghiệp của καρπός thay vì chuyển thành khái niệm trừu tượng như 'lợi ích'.
- source_word: εἰς ἁγιασμόν
  choice: dẫn đến sự thánh hóa
  rationale: Diễn đạt hướng đi hoặc kết quả hàm chứa trong εἰς; 'sự thánh hóa' giữ được sắc thái quá trình hoặc kết quả mà không loại trừ nghĩa 'sự thánh khiết'.
- source_word: τὸ δὲ τέλος
  choice: và kết cuộc
  rationale: '''Kết cuộc'' diễn đạt τέλος như điểm đến hoặc kết quả cuối cùng, không chỉ đơn thuần là sự chấm dứt.'
- source_word: ζωὴν αἰώνιον
  choice: sự sống đời đời
  rationale: Cách diễn đạt chuẩn, tự nhiên và chính xác cho khái niệm thần học này trong tiếng Việt.
theological_decisions:
- issue: Hình ảnh nô lệ trong mối quan hệ với Đức Chúa Trời
  choice: Giữ cách nói mạnh 'được đặt làm nô lệ cho Đức Chúa Trời'.
  alternative: trở thành người phục vụ Đức Chúa Trời
  rationale: 'Mạch lập luận Rô-ma 6 cố ý đối chiếu hai quyền sở hữu: trước kia làm nô lệ cho tội lỗi, nay làm nô lệ cho Đức Chúa Trời. Làm nhẹ thành ''phục vụ'' sẽ làm suy yếu sự đối chiếu ấy.'
- issue: Ý nghĩa của ἁγιασμός
  choice: Dùng 'sự thánh hóa' trong chính văn.
  alternative: sự thánh khiết
  rationale: Từ Hy Lạp có thể nhấn mạnh tiến trình được làm nên thánh hoặc tình trạng thánh khiết. Chính văn giữ sắc thái tiến trình/kết quả, còn chú thích bảo tồn phương án chỉ tình trạng.
- issue: Ý nghĩa của τέλος
  choice: Dùng 'kết cuộc'.
  alternative: kết quả cuối cùng; điểm đến cuối cùng
  rationale: Cách dịch này giữ được sức căng giữa nghĩa 'điểm cuối' và 'kết quả' mà không thu hẹp từ này thành sự chấm dứt.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại, dùng “anh chị em” để thể hiện đại từ số nhiều. Câu giữ hình ảnh “hoa trái” và “nô lệ” của nguyên văn, đồng thời sắp xếp các thành phần để đọc tự nhiên trong tiếng Việt.
