id: ROM.6.3
reference: Romans 6:3
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἢ ἀγνοεῖτε ὅτι ὅσοι ἐβαπτίσθημεν εἰς Χριστὸν Ἰησοῦν εἰς τὸν θάνατον αὐτοῦ ἐβαπτίσθημεν;
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/003.yaml
  text: Or do you not know that all of us who were baptized into Messiah Jesus were baptized into his death?[a]
translation:
  language: vi
  text: Hay anh chị em không biết rằng tất cả chúng ta, những người đã được báp-têm vào Đấng Mê-si-a[a] Giê-su, đều đã được báp-têm vào sự chết của Ngài sao?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay “Đấng Ki-tô”. Tiếng Hy Lạp: Christos Iēsous.'
    reason: Nêu cách dịch quen thuộc khác của tước hiệu Χριστός mà không xóa nghĩa “Đấng Mê-si-a” trong chính văn.
lexical_decisions:
- source_word: ἢ
  choice: Hay
  rationale: Giữ liên kết lập luận với câu trước và sắc thái chất vấn nhẹ của Phao-lô.
- source_word: ἀγνοεῖτε
  choice: anh chị em không biết ... sao?
  rationale: Diễn đạt tự nhiên câu hỏi tu từ ở thì hiện tại, đồng thời giữ lời kêu gọi dựa trên điều độc giả đáng lẽ đã biết.
- source_word: ὅσοι ... ἐβαπτίσθημεν
  choice: tất cả chúng ta, những người đã được báp-têm
  rationale: Thể hiện đầy đủ phạm vi bao quát của ὅσοι cùng ngôi thứ nhất số nhiều; thể bị động và tính sự kiện của động từ aorist được giữ lại.
- source_word: εἰς
  choice: vào
  rationale: Là cách dịch trực tiếp, giữ hình ảnh hướng vào hoặc được kết nhập mà không ấn định cơ chế thần học.
- source_word: Χριστὸν Ἰησοῦν
  choice: Đấng Mê-si-a Giê-su
  rationale: Thể hiện Χριστός theo nghĩa tước hiệu và giữ trật tự Hy Lạp, đồng thời dùng cách gọi dễ hiểu trong tiếng Việt hiện đại.
- source_word: τὸν θάνατον αὐτοῦ
  choice: sự chết của Ngài
  rationale: Dịch trực tiếp danh từ θάνατος và quan hệ sở hữu của αὐτοῦ; “Ngài” phù hợp văn phong Kinh Thánh trang trọng khi chỉ Chúa Giê-su.
theological_decisions:
- issue: 'Cách hiểu εἰς trong ngôn ngữ về phép báp-têm: hiệu lực bí tích, sự đồng nhất mang tính biểu tượng, hay sự hiệp nhất giao ước.'
  choice: Dịch cả hai lần là “vào”.
  alternative: “liên hệ với”; “được hiệp nhất với”
  rationale: “Vào” bảo toàn sức nặng về hướng đến hoặc sự kết nhập trong nguyên văn nhưng không quyết định một cách giải thích giáo phái cụ thể.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh chị em” để biểu đạt số nhiều được ngỏ lời; “báp-têm” giữ thuật ngữ quen thuộc và tránh diễn giải nghi lễ. Dấu [a] xuất hiện ngay sau danh xưng tương ứng.
