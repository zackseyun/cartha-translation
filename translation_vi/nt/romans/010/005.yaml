id: ROM.10.5
reference: Romans 10:5
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Μωϋσῆς γὰρ γράφει ⸂ὅτι τὴν δικαιοσύνην τὴν ἐκ ⸀τοῦ νόμου⸃ ὁ ⸀ποιήσας ἄνθρωπος ζήσεται ἐν ⸀αὐτῇ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/005.yaml
  text: 'For Moses writes about the righteousness that is from the law: the man who does these things will live by them[a][b][c].'
translation:
  language: vi
  text: 'Vì Môi-se viết về sự công chính đến từ Luật pháp rằng: “Người nào làm những điều ấy thì sẽ nhờ đó mà sống.”[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch “sự chính trực” hoặc “công lý” thay cho “sự công chính” (δικαιοσύνη).
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch “thì sẽ sống trong đó”; Phao-lô đang nhắc lại Lê-vi Ký 18:5.
    reason: alternative_reading
lexical_decisions:
- source_word: γὰρ
  choice: Vì
  rationale: Đánh dấu mối liên hệ giải thích với lập luận ngay trước đó; “Vì” tự nhiên và súc tích trong tiếng Việt.
- source_word: γράφει
  choice: viết
  rationale: Giữ thì hiện tại và công thức dẫn Kinh Thánh của nguyên văn.
- source_word: δικαιοσύνην
  choice: sự công chính
  rationale: Trong Rô-ma, từ này mang trọng lượng pháp lý và thần học, đồng thời duy trì sự tương ứng với sự công chính bởi đức tin trong ngữ cảnh.
- source_word: τὴν ἐκ τοῦ νόμου
  choice: đến từ Luật pháp
  rationale: Diễn đạt ἐκ theo nghĩa nguồn gốc và giữ nguyên sự tương phản giữa các dạng sự công chính.
- source_word: νόμου
  choice: Luật pháp
  rationale: Mạo từ và ngữ cảnh Phao-lô cho thấy Luật pháp Môi-se như một phạm trù đã được xác định; viết hoa giúp người đọc Việt nhận ra sở chỉ này.
- source_word: ὁ ποιήσας ἄνθρωπος
  choice: Người nào làm những điều ấy
  rationale: Truyền đạt tự nhiên nguyên tắc khái quát của phân từ aorist và lực đại diện của ἄνθρωπος, không giới hạn vào nam giới.
- source_word: ζήσεται
  choice: sẽ ... sống
  rationale: Phản ánh trực tiếp thì tương lai và âm hưởng của Lê-vi Ký 18:5.
- source_word: ἐν αὐτῇ
  choice: nhờ đó
  rationale: Giữ đại từ số ít giống cái của bản Hy Lạp gần hơn “nhờ những điều ấy”, đồng thời diễn đạt tự nhiên ý nghĩa phương tiện trong tiếng Việt; sự mơ hồ giữa “nhờ đó” và “trong đó” được ghi chú.
theological_decisions:
- issue: Cách dịch δικαιοσύνη trong sự tương phản của Phao-lô
  choice: sự công chính
  alternative: sự chính trực; công lý
  rationale: “Sự công chính” duy trì liên kết thần học với chủ đề xuyên suốt Rô-ma mà không thu hẹp từ này chỉ vào công lý xã hội hay phẩm chất đạo đức.
- issue: Lực đại diện của ἄνθρωπος
  choice: Người nào
  alternative: người đàn ông
  rationale: Dù cấu trúc Hy Lạp ở giống đực số ít, ἄνθρωπος ở đây chỉ bất kỳ người nào thực hành điều được nói đến. Tiếng Việt không cần đánh dấu giống, nên “người nào” vừa chính xác vừa tự nhiên.
- issue: Quan hệ được diễn đạt bởi ἐν αὐτῇ
  choice: nhờ đó mà sống
  alternative: sống trong đó
  rationale: “Nhờ đó” truyền đạt cách hiểu phương tiện phù hợp với lời dẫn Lê-vi Ký 18:5, nhưng ghi chú giữ lại khả năng dịch sát hình thức là “trong đó”.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Môi-se” theo cách gọi quen thuộc trong tiếng Việt. Dấu ngoặc kép làm rõ phần trích dẫn Kinh Thánh. “Người nào” thể hiện tự nhiên ý nghĩa đại diện của danh từ Hy Lạp mà không thêm một chú thích giới tính không cần thiết trong tiếng Việt.
