id: ROM.10.6
reference: Romans 10:6
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἡ δὲ ἐκ πίστεως δικαιοσύνη οὕτως λέγει· Μὴ εἴπῃς ἐν τῇ καρδίᾳ σου· Τίς ἀναβήσεται εἰς τὸν οὐρανόν; τοῦτ’ ἔστιν Χριστὸν καταγαγεῖν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/006.yaml
  text: 'But the righteousness from faith speaks in this way: “Do not say in your heart[a], ‘Who will ascend into heaven?’” (that is[c][b], to bring Messiah down).'
translation:
  language: vi
  text: 'Nhưng sự công chính đến từ đức tin[a] nói thế này: “Đừng nói trong lòng mình: ‘Ai sẽ lên trời?’”[b] (tức là đem Đấng Mê-si[c] xuống).'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hy Lạp δικαιοσύνη cũng có thể mang nghĩa “công lý”; ở đây “sự công chính” phù hợp hơn với lập luận của Phao-lô.
    reason: lexical_alternative
  - marker: b
    text: Phao-lô nhắc lại Phục Truyền Luật Lệ Ký 30:12 và áp dụng lời ấy cho Đấng Mê-si.
    reason: cross_reference
  - marker: c
    text: Tiếng Hy Lạp là Χριστός, nghĩa là “Đấng Mê-si” hay “Đấng Christ”; ở đây từ này được hiểu như một tước hiệu.
    reason: lexical_alternative
lexical_decisions:
- source_word: δικαιοσύνη
  choice: sự công chính
  rationale: Cách dịch quen thuộc và phù hợp nhất trong lập luận của Phao-lô, giữ được sắc thái về địa vị đúng đắn và điều phù hợp với chuẩn mực của Đức Chúa Trời; khả năng mang nghĩa “công lý” được ghi ở chú thích.
- source_word: ἐκ πίστεως
  choice: đến từ đức tin
  rationale: Phản ánh trực tiếp giới từ ἐκ, đồng thời diễn đạt tự nhiên nguồn gốc của sự công chính và giữ sự tương phản với câu trước.
- source_word: οὕτως λέγει
  choice: nói thế này
  rationale: Giữ nguyên phép nhân hóa khi “sự công chính” làm chủ ngữ của động từ λέγει, bằng lối nói tự nhiên trong tiếng Việt hiện đại.
- source_word: Μὴ εἴπῃς ἐν τῇ καρδίᾳ σου
  choice: Đừng nói trong lòng mình
  rationale: Bám sát lời trích dẫn, trong đó “lòng” chỉ nơi suy nghĩ và ý định nội tâm.
- source_word: Τίς ἀναβήσεται εἰς τὸν οὐρανόν;
  choice: Ai sẽ lên trời?
  rationale: “Lên trời” là cách diễn đạt tự nhiên, rõ nghĩa của ἀναβήσεται εἰς τὸν οὐρανόν trong tiếng Việt.
- source_word: Χριστόν
  choice: Đấng Mê-si
  rationale: Trong phần giải thích lời Kinh Thánh này, Χριστός mang chức năng tước hiệu; “Đấng Mê-si” truyền đạt ý nghĩa tước hiệu thay vì xử lý như một tên riêng.
- source_word: καταγαγεῖν
  choice: đem ... xuống
  rationale: Diễn đạt tự nhiên ý nghĩa khiến hoặc đưa một người từ trên cao xuống, đồng thời giữ quan hệ giải thích với câu hỏi tu từ trước đó.
theological_decisions:
- issue: Phép nhân hóa “sự công chính đến từ đức tin”
  choice: Giữ “sự công chính ... nói thế này”
  alternative: 'Diễn đạt trừu tượng hơn: “Đây là điều sự công chính bởi đức tin nói”'
  rationale: δικαιοσύνη là chủ ngữ ngữ pháp của λέγει; giữ phép nhân hóa bảo tồn thủ pháp tu từ và sự đối chiếu của Phao-lô.
- issue: Cách hiểu Χριστός
  choice: Đấng Mê-si
  alternative: Đấng Christ
  rationale: Trong lập luận dựa trên Kinh Thánh ở đây, từ này hoạt động rõ ràng như một tước hiệu. Cách dịch “Đấng Mê-si” làm sáng nghĩa tước hiệu mà không thêm một lập trường hệ phái.
- issue: Quan hệ của lời trong ngoặc với câu hỏi tu từ
  choice: 'Giữ lời giải thích cô đọng: “tức là đem Đấng Mê-si xuống”'
  alternative: 'Mở rộng: “nghĩa là lên để đem Đấng Mê-si xuống”'
  rationale: Bản Hy Lạp dùng cụm nguyên mẫu giải thích ngắn gọn; bản dịch không bổ sung chủ thể hoặc mục đích ngoài điều văn bản nêu.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “nói thế này” để giữ phép nhân hóa mà không tạo giọng cổ; dùng “trong lòng mình” và “lên trời” theo cách diễn đạt tự nhiên. Các dấu chú thích được đặt ngay sau từ hoặc mệnh đề liên quan.
