id: ROM.10.13
reference: Romans 10:13
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Πᾶς γὰρ ὃς ἂν ἐπικαλέσηται τὸ ὄνομα κυρίου σωθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/013.yaml
  text: For everyone who calls on the name of the Lord will be saved[a][b].
translation:
  language: vi
  text: Vì bất cứ ai kêu cầu danh Chúa đều sẽ được cứu.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Phao-lô trích dẫn Giô-ên 2:32. Trong sách Giô-ên, “Chúa” chỉ về YHWH (“ĐỨC CHÚA”); còn ở đây, xét theo văn cảnh, Phao-lô áp dụng lời ấy cho Chúa Giê-su.
    reason: cross_reference
  - marker: b
    text: 'Cũng có thể dịch: “cầu khẩn danh Chúa.” Cách diễn đạt Hy Lạp có nghĩa khấn gọi hoặc hướng lời thỉnh cầu đến Chúa bằng cách xưng danh Ngài.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πᾶς … ὃς ἂν
  choice: bất cứ ai
  rationale: Cấu trúc này diễn tả phạm vi phổ quát, không giới hạn giới tính. “Bất cứ ai” tự nhiên trong tiếng Việt và giữ được ý nghĩa khái quát của nguyên văn.
- source_word: γὰρ
  choice: Vì
  rationale: Từ này dẫn vào lời Kinh Thánh làm cơ sở hoặc giải thích cho khẳng định ngay trước đó; “Vì” giữ rõ mối liên kết lập luận.
- source_word: ἐπικαλέσηται
  choice: kêu cầu
  rationale: Trong thành ngữ Kinh Thánh đi với “danh”, động từ này có nghĩa cầu khẩn, khấn gọi hoặc hướng lời thỉnh cầu đến Chúa. “Kêu cầu” vừa dễ hiểu vừa giữ được sắc thái cầu nguyện và xưng nhận.
- source_word: τὸ ὄνομα
  choice: danh
  rationale: “Danh” là cách diễn đạt Kinh Thánh tự nhiên trong tiếng Việt, chỉ căn tính và thẩm quyền được bày tỏ của Đấng được kêu cầu; không nên diễn giải rộng ngay trong chính văn.
- source_word: κυρίου
  choice: Chúa
  rationale: Nguyên văn dùng κύριος. Giữ “Chúa” thay vì thêm “Giê-su” hoặc đổi thành “ĐỨC CHÚA” giúp bảo toàn lời văn Hy Lạp và sự đan xen với câu trích từ sách Giô-ên.
- source_word: σωθήσεται
  choice: sẽ được cứu
  rationale: Thể tương lai bị động của σῴζω trong văn cảnh Rô-ma mang ý nghĩa cứu rỗi; “sẽ được cứu” là cách dịch rõ ràng, chính xác và tự nhiên.
theological_decisions:
- issue: Đối tượng được gọi là “Chúa” trong lời trích từ Giô-ên
  choice: Giữ “Chúa” trong chính văn, không chỉ rõ thêm là “Giê-su”.
  alternative: “ĐỨC CHÚA” hoặc “Chúa Giê-su”
  rationale: Bản Hy Lạp viết κυρίου. Trong Giô-ên 2:32, lời này nói về YHWH, còn văn cảnh Rô-ma 10 cho thấy Phao-lô áp dụng lời ấy cho Chúa Giê-su. Giữ nguyên “Chúa” trong chính văn tránh giải nghĩa quá mức, còn chú thích nêu rõ chiều kích liên văn bản và Cơ Đốc học.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Kêu cầu danh Chúa” giữ âm hưởng Kinh Thánh quen thuộc mà vẫn tự nhiên trong tiếng Việt; “bất cứ ai” nhấn mạnh phạm vi phổ quát, không hàm ý chỉ nam giới.
