id: ROM.10.10
reference: Romans 10:10
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καρδίᾳ γὰρ πιστεύεται εἰς δικαιοσύνην, στόματι δὲ ὁμολογεῖται εἰς σωτηρίαν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/010.yaml
  text: For with the heart one believes unto righteousness[a], and with the mouth one confesses unto salvation.
translation:
  language: vi
  text: Vì tin bằng lòng thì hướng đến sự công chính[a], còn tuyên xưng bằng miệng thì hướng đến sự cứu rỗi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hoặc “công lý.” Từ Hy Lạp δικαιοσύνη cũng có thể được dịch là “công lý,” dù trong các thư của Phao-lô, “sự công chính” thường là cách dịch phù hợp hơn.
    reason: lexical_alternative
lexical_decisions:
- source_word: καρδίᾳ
  choice: bởi lòng
  rationale: Dạng tặng cách có sắc thái phương tiện hoặc chỉ phương diện con người bên trong. “Bởi lòng” tự nhiên trong tiếng Việt và giữ được thế song song với “bởi miệng”.
- source_word: γὰρ
  choice: Vì
  rationale: Nối câu này với câu trước như một lời giải thích, phù hợp chức năng của γάρ.
- source_word: πιστεύεται
  choice: người ta tin
  rationale: Dạng động từ thụ động/trung gian được dùng theo nghĩa khái quát. “Người ta tin” diễn đạt tự nhiên chủ thể tổng quát mà không gán cho một nhóm cụ thể.
- source_word: εἰς δικαιοσύνην
  choice: để được kể là công chính
  rationale: εἰς biểu thị hướng tới hoặc kết quả. Trong mạch văn Rô-ma về đức tin, cách dịch này truyền đạt quan hệ với địa vị công chính mà vẫn tránh diễn giải một trình tự cứu rỗi mang tính cơ chế.
- source_word: δικαιοσύνην
  choice: được kể là công chính
  rationale: Trong ngữ cảnh Phao-lô, δικαιοσύνη có thể mang sắc thái pháp đình, giao ước và đạo đức. Cụm này tự nhiên hơn danh từ trừu tượng “sự công chính” trong tiếng Việt, còn nghĩa “công lý” được ghi ở chú thích.
- source_word: στόματι
  choice: bởi miệng
  rationale: Giữ cấu trúc phương tiện và sự đối xứng giữa con người bên trong với lời tuyên xưng bên ngoài.
- source_word: δὲ
  choice: và
  rationale: δέ ở đây nối hai vế bổ sung và chỉ tạo tương phản nhẹ; “và” tránh khiến hai hành động có vẻ đối nghịch.
- source_word: ὁμολογεῖται
  choice: người ta tuyên xưng
  rationale: “Tuyên xưng” phù hợp với ngữ cảnh trực tiếp ở câu 9, nơi miệng công khai thừa nhận Đức Chúa Jêsus là Chúa, đồng thời giữ tính khái quát của dạng động từ.
- source_word: εἰς σωτηρίαν
  choice: để được cứu rỗi
  rationale: Diễn đạt tự nhiên hướng tới hoặc kết quả của εἰς, đồng thời giữ thế song song với “để được kể là công chính”.
- source_word: σωτηρίαν
  choice: cứu rỗi
  rationale: Đây là cách diễn đạt quen thuộc và trang trọng trong ngữ cảnh cứu chuộc của Phao-lô, có thể bao hàm cả chiều kích hiện tại lẫn tương lai.
theological_decisions:
- issue: Quan hệ giữa tin, tuyên xưng, sự công chính và sự cứu rỗi
  choice: 'Giữ nguyên hai vế song song: tin bằng lòng hướng tới việc được kể là công chính, và tuyên xưng bằng miệng hướng tới việc được cứu rỗi.'
  alternative: Xem lời tuyên xưng chỉ là bằng chứng của sự cứu rỗi, hoặc xem nó là một công trạng bổ sung để kiếm được sự cứu rỗi.
  rationale: Bản Hy Lạp đặt hai mệnh đề song song với cùng cấu trúc εἰς. Bản dịch không áp đặt một trình tự cơ giới về sự xưng công chính và sự cứu rỗi, cũng không biến lời tuyên xưng thành công trạng.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Cấu trúc “bởi lòng… bởi miệng” giữ nhịp đối xứng của nguyên văn; “người ta” thể hiện ý khái quát. Dùng “Đức Chúa Jêsus” không xuất hiện trong câu này nên không cần xử lý danh xưng.
