revisions:
- from: Vì bởi lòng mà người ta tin để được kể là công chính[a], và bởi miệng mà người ta tuyên xưng để được cứu rỗi.
  to: Vì tin bằng lòng thì hướng đến sự công chính[a], còn tuyên xưng bằng miệng thì hướng đến sự cứu rỗi.
  rationale: Bản sửa loại bỏ ý “được kể là,” vốn không được diễn đạt trực tiếp trong câu, và dùng cấu trúc song song “hướng đến sự…” để phản ánh hai cụm εἰς mà không biến lời tuyên xưng thành công trạng hoặc ấn định một trật tự giáo lý. “Bằng lòng/bằng miệng” là cách dùng hiện đại, tự nhiên hơn và bảo toàn đối xứng nội tâm/công khai.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T10:26:05Z'
review_pass:
  verdict: revise
  source_fidelity: Bản thảo chuyển εἰς δικαιοσύνην thành “để được kể là công chính,” đưa thêm ý được quy kể/xưng công chính mà danh từ δικαιοσύνη và giới từ εἰς không nói minh nhiên. Điều này cũng làm hai vế kém song song, vì εἰς σωτηρίαν được diễn đạt là “để được cứu rỗi.” Bản sửa giữ quan hệ hướng đến/kết quả của εἰς và duy trì các danh từ song song.
  naturalness: “Bởi lòng mà… bởi miệng mà…” có thể hiểu được nhưng hơi gượng trong tiếng Việt chuẩn hiện đại. “Tin bằng lòng… tuyên xưng bằng miệng…” tự nhiên, trang trọng và vẫn giữ tương phản lòng/miệng.
  terminology: “Sự công chính,” “sự cứu rỗi,” và “tuyên xưng” phù hợp ngữ cảnh Rô-ma. Không nên thay δικαιοσύνη bằng riêng ý pháp đình “được kể là công chính,” vì điều đó thu hẹp phạm vi của từ. Chú thích giữ khả năng “công lý” như một lựa chọn từ vựng, không khẳng định đó là nghĩa chính tại đây.
  issues:
  - severity: medium
    issue: Diễn giải δικαιοσύνη là “được kể là công chính”
    rationale: Cụm này thêm động từ pháp đình “kể là” không có trong nguyên văn và thu hẹp danh từ δικαιοσύνη. Cần giữ “sự công chính” trong văn bản chính.
  - severity: low
    issue: Thế song song của hai cụm εἰς bị lệch
    rationale: “Để được kể là công chính” và “để được cứu rỗi” không giữ cùng kiểu diễn đạt của δύο cụm εἰς. Dùng “hướng đến sự…” cho cả hai vế phản ánh cấu trúc song hành mà không giải quyết trước quan hệ thần học.
  - severity: low
    issue: Chú thích hiện tại nêu “để đạt đến sự công chính” như một phương án thay thế cho một bản dịch đã diễn giải
    rationale: Sau khi văn bản chính dùng danh từ trung tính “sự công chính,” chú thích nên chỉ giải thích lựa chọn từ vựng “công lý,” thay vì lặp các cách diễn đạt quan hệ εἰς.
  revised_text: Vì tin bằng lòng thì hướng đến sự công chính[a], còn tuyên xưng bằng miệng thì hướng đến sự cứu rỗi.
