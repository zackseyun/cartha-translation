id: ROM.10.14
reference: Romans 10:14
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Πῶς οὖν ⸀ἐπικαλέσωνται εἰς ὃν οὐκ ἐπίστευσαν; πῶς δὲ ⸀πιστεύσωσιν οὗ οὐκ ἤκουσαν; πῶς δὲ ⸀ἀκούσωσιν χωρὶς κηρύσσοντος;
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/014.yaml
  text: How then will they call on him in whom they have not believed? And how will they believe in him of whom they have not heard? And how will they hear without someone preaching?[a]
translation:
  language: vi
  text: Vậy thì, làm sao họ kêu cầu Đấng mà họ chưa tin? Làm sao họ tin Đấng mà họ chưa nghe nói đến? Làm sao họ nghe nếu không có người rao giảng?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πῶς οὖν
  choice: Vậy thì, làm sao
  rationale: Giữ lực suy luận của οὖν và chuỗi câu hỏi tu từ, đồng thời diễn đạt tự nhiên trong tiếng Việt hiện đại.
- source_word: ἐπικαλέσωνται
  choice: họ kêu cầu
  rationale: “Kêu cầu” diễn đạt hành động khẩn cầu hoặc cầu xin danh Chúa và nối trực tiếp với ngữ cảnh ngay trước đó.
- source_word: εἰς ὃν οὐκ ἐπίστευσαν
  choice: Đấng họ chưa tin
  rationale: 'Cách nói tự nhiên trong tiếng Việt, giữ đối tượng chỉ về một thân vị và mối liên hệ logic: tin có trước việc kêu cầu.'
- source_word: πιστεύσωσιν
  choice: họ tin
  rationale: “Tin” là từ tương đương trực tiếp, quen thuộc cho πιστεύω và bảo toàn chuỗi thuật ngữ về đức tin của Phao-lô.
- source_word: οὗ οὐκ ἤκουσαν
  choice: Đấng họ chưa nghe
  rationale: Giữ gần cấu trúc Hy Lạp và không âm thầm quyết định liệu ý câu là chưa trực tiếp nghe Đấng ấy hay chưa nghe nói về Đấng ấy; cách hiểu thứ hai được ghi ở chú thích.
- source_word: ἀκούσωσιν
  choice: họ nghe
  rationale: Giữ sự lặp lại có chủ ý của động từ ἀκούω và mạch lập luận về việc nghe lời được công bố.
- source_word: χωρὶς κηρύσσοντος
  choice: nếu không có người rao giảng
  rationale: Diễn đạt tự nhiên cấu trúc “không có người đang rao truyền,” nhấn mạnh hoạt động rao giảng thay vì ngầm xác lập một chức vụ chuyên biệt.
theological_decisions:
- issue: Ngôn ngữ πιστεύω về đức tin
  choice: tin
  alternative: tin cậy
  rationale: “Tin” là lựa chọn mặc định, ngắn gọn và sát từ; “tin cậy” có thể thêm sắc thái diễn giải không được câu này tự nó xác định.
- issue: Đối tượng của việc nghe trong οὗ οὐκ ἤκουσαν
  choice: Đấng họ chưa nghe
  alternative: Đấng mà họ chưa nghe nói đến
  rationale: Đại từ sở hữu cách οὗ sau ἀκούω cho phép hiểu là nghe chính Đấng ấy hoặc nghe về Ngài. Bản chính giữ cấu trúc mở; chú thích nêu rõ cách hiểu “nghe nói về” mà không loại bỏ khả năng kia.
translation_notes:
  register: Văn phong hiện đại, trang trọng nhưng dễ hiểu. Ba câu hỏi được giữ ngắn và song song để tái hiện nhịp lập luận tăng tiến của nguyên văn; “Đấng” dùng để chỉ thân vị được kêu cầu và tin.
