id: ROM.10.3
reference: Romans 10:3
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀγνοοῦντες γὰρ τὴν τοῦ θεοῦ δικαιοσύνην, καὶ τὴν ⸀ἰδίαν ζητοῦντες στῆσαι, τῇ δικαιοσύνῃ τοῦ θεοῦ οὐχ ὑπετάγησαν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/003.yaml
  text: For[a], being ignorant of the righteousness of God and seeking to establish their own[b], they did not submit to the righteousness of God.
translation:
  language: vi
  text: Vì họ không nhận biết sự công chính của Đức Chúa Trời[a][b], lại tìm cách xác lập sự công chính riêng của mình, nên họ đã không quy phục sự công chính của Đức Chúa Trời.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch “công lý” ở cả hai lần xuất hiện của “sự công chính”. Trong cách dùng của Phao-lô, δικαιοσύνη có thể chỉ sự công chính, công lý, hoặc đường lối công chính qua đó Đức Chúa Trời đưa con người vào tình trạng đúng đắn.
    reason: lexical_alternative
  - marker: b
    text: “Sự công chính của Đức Chúa Trời” cũng có thể được hiểu là “sự công chính đến từ Đức Chúa Trời” hoặc “đức công chính của Đức Chúa Trời”. Cách diễn đạt Hy Lạp cho phép nhiều sắc thái.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀγνοοῦντες
  choice: không nhận biết
  rationale: Diễn đạt tự nhiên phân từ hiện tại chỉ hoàn cảnh mang tính nguyên nhân; giữ ý thiếu nhận thức mà không tự động quy thành sự cố ý khước từ.
- source_word: γὰρ
  choice: Vì
  rationale: Giữ chức năng giải thích và liên kết câu này với phát biểu ngay trước đó.
- source_word: δικαιοσύνην / δικαιοσύνῃ
  choice: sự công chính
  rationale: Đây là cách diễn đạt trang trọng, dễ hiểu trong văn cảnh Phao-lô, có thể bao hàm phẩm tính công chính, địa vị đúng đắn và cách Đức Chúa Trời làm cho con người được kể là đúng; phương án “công lý” được giữ trong chú thích.
- source_word: τοῦ θεοῦ
  choice: của Đức Chúa Trời
  rationale: Cấu trúc “của” bám sát sở hữu cách Hy Lạp và không xác quyết hoàn toàn rằng cụm từ chỉ nói đến phẩm tính của Đức Chúa Trời hay sự công chính đến từ Ngài; các sắc thái được nêu trong chú thích.
- source_word: ἰδίαν
  choice: sự công chính riêng của mình
  rationale: Tính từ được dùng tỉnh lược trong tiếng Hy Lạp, với δικαιοσύνη được hiểu ngầm; tiếng Việt cần khôi phục danh từ để câu rõ ràng và tự nhiên.
- source_word: ζητοῦντες
  choice: tìm cách
  rationale: Thể hiện hành động đang theo đuổi hoặc cố thực hiện, đồng thời tự nhiên hơn cách dịch máy móc “tìm kiếm” trong kết cấu này.
- source_word: στῆσαι
  choice: xác lập
  rationale: Truyền đạt nghĩa thành ngữ của ἵστημι là thiết lập hay làm cho đứng vững trong lập luận về sự công chính.
- source_word: ὑπετάγησαν
  choice: đã không quy phục
  rationale: 'Diễn đạt tự nhiên sắc thái trung động trong văn cảnh: họ không đặt mình dưới sự công chính của Đức Chúa Trời, mà không thêm lời giải thích thần học vào chính câu.'
theological_decisions:
- issue: Ý nghĩa của cụm “sự công chính của Đức Chúa Trời” trong cách dùng của Phao-lô
  choice: Giữ nguyên cụm “sự công chính của Đức Chúa Trời” ở cả hai lần xuất hiện.
  alternative: “sự công chính đến từ Đức Chúa Trời” hoặc “đức công chính của Đức Chúa Trời”
  rationale: Sở hữu cách Hy Lạp có thể mang sắc thái sở hữu, nguồn gốc, hoặc hoạt động cứu độ công chính của Đức Chúa Trời. Bản dịch chính không thu hẹp cụm từ vào một cách giải nghĩa giáo lý duy nhất.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “không nhận biết”, “tìm cách xác lập” và “quy phục” để giữ quan hệ lập luận cùng sức nặng của bản Hy Lạp mà không làm câu nặng tính thuật ngữ.
