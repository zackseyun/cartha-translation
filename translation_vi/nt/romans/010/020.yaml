id: ROM.10.20
reference: Romans 10:20
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἠσαΐας δὲ ἀποτολμᾷ καὶ λέγει· Εὑρέθην ⸀ἐν τοῖς ἐμὲ μὴ ζητοῦσιν, ἐμφανὴς ⸀ἐγενόμην τοῖς ἐμὲ μὴ ἐπερωτῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/020.yaml
  text: But Isaiah is very bold and says[a], “I was found by those who were not seeking me[b]; I became manifest to those who were not asking for me.”
translation:
  language: vi
  text: 'Nhưng Ê-sai mạnh dạn nói: “Ta đã được những người không tìm kiếm Ta tìm thấy[a]; Ta đã hiển lộ cho những người không hỏi đến Ta[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “Ta đã được tìm thấy giữa những người không tìm kiếm Ta.”'
    reason: Bảo lưu khả năng dịch gần hình thức của giới từ ἐν là “giữa/trong số,” thay vì hiểu theo tác nhân với động từ thụ động.
  - marker: b
    text: 'Hoặc: “Ta đã tỏ mình ra cho những người không hỏi đến Ta.”'
    reason: Diễn đạt thành ngữ hơn của ἐμφανὴς ἐγενόμην; bản chính giữ gần hơn ý trở nên hiển lộ của nguyên văn.
lexical_decisions:
- source_word: ἀποτολμᾷ
  choice: còn mạnh dạn nói
  rationale: Diễn đạt sắc thái dám nói một lời táo bạo; “còn” đồng thời nối ý tương phản và tăng tiến trong ngữ cảnh.
- source_word: Εὑρέθην
  choice: Ta đã được những người… tìm thấy
  rationale: Giữ thể thụ động aorist và sự tự xưng của Đức Chúa Trời trong lời trích dẫn, đồng thời dùng cú pháp tự nhiên trong tiếng Việt.
- source_word: ἐν τοῖς ἐμὲ μὴ ζητοῦσιν
  choice: những người không tìm kiếm Ta
  rationale: Trong cấu trúc đi với động từ thụ động “được tìm thấy,” ἐν chỉ những người đã tìm thấy; cách diễn đạt này rõ nghĩa mà không thêm ý ngoài văn bản.
- source_word: ζητοῦσιν
  choice: tìm kiếm
  rationale: Giữ sắc thái chủ động, có chủ ý của ζητέω và âm hưởng trang trọng quen thuộc trong văn Kinh Thánh.
- source_word: ἐμφανὴς ἐγενόμην
  choice: Ta đã trở nên tỏ rõ
  rationale: Giữ cấu trúc vị ngữ “trở nên” và ý được biểu lộ/hiện rõ, không diễn giải thành hành động phản thân “Ta bày tỏ chính mình.”
- source_word: ἐπερωτῶσιν
  choice: cầu hỏi Ta
  rationale: “Cầu hỏi” diễn đạt việc hỏi han, thỉnh cầu nơi Đức Chúa Trời trong ngữ cảnh trang trọng, nhưng không đồng nhất từ này với ý chuyên biệt “kêu cầu.”
- source_word: δὲ
  choice: Nhưng
  rationale: Đánh dấu sự tương phản với mạch lập luận và lời trích dẫn trước đó.
- source_word: Ἠσαΐας
  choice: Ê-sai
  rationale: Dùng dạng tên riêng quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
theological_decisions:
- issue: Cách diễn đạt sự tự bày tỏ của Đức Chúa Trời trong lời trích Ê-sai
  choice: Ta đã trở nên tỏ rõ cho những người không cầu hỏi Ta
  alternative: Ta đã tỏ mình ra cho những người không cầu hỏi Ta
  rationale: Bản chính giữ gần hình thức ἐμφανὴς ἐγενόμην, nhấn mạnh trạng thái trở nên hiển lộ mà không chuyển thành một động tác phản thân rõ rệt hơn nguyên văn.
- issue: Tác nhân của động từ thụ động Εὑρέθην với giới từ ἐν
  choice: Ta đã được những người không tìm kiếm Ta tìm thấy
  alternative: Ta đã được tìm thấy giữa những người không tìm kiếm Ta
  rationale: Trong ngữ cảnh, cách hiểu tác nhân tạo câu tiếng Việt rõ và tự nhiên; tuy vậy, giới từ ἐν về hình thức cũng có thể gợi nghĩa “giữa/trong số,” nên không nên phủ nhận hoàn toàn khả năng ấy.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “Ta” được viết hoa để biểu thị lời Đức Chúa Trời tự xưng theo quy ước tiếng Việt, không nhằm giải quyết thêm vấn đề thần học. Không thêm chú thích vì các phương án khác đã được ghi nhận trong hồ sơ quyết định, còn câu chính đủ rõ và giữ được độ căng của nguyên văn.
