id: ROM.10.18
reference: Romans 10:18
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἀλλὰ λέγω, μὴ οὐκ ἤκουσαν; μενοῦνγε· Εἰς πᾶσαν τὴν γῆν ἐξῆλθεν ὁ φθόγγος αὐτῶν, καὶ εἰς τὰ πέρατα τῆς οἰκουμένης τὰ ῥήματα αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/018.yaml
  text: 'But I ask[a], did they not hear? Indeed they did: “Their voice has gone out into all the earth[c][b], and their words to the ends of the inhabited world.”'
translation:
  language: vi
  text: 'Nhưng tôi hỏi: Chẳng lẽ họ không nghe sao? Quả thật, họ đã nghe:


    “Tiếng[a] của chúng đã vang ra khắp cõi đất,

    và lời của chúng đã đến tận cùng thế giới có người sinh sống.”[b][c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Âm thanh của chúng đã truyền ra khắp cõi đất.”'
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch đơn giản là “thế giới”; tiếng Hy Lạp nói đến “thế giới có người sinh sống.”
    reason: lexical_alternative
  - marker: c
    text: Phao-lô trích Thi Thiên 19:4 và vận dụng ngôn ngữ của câu ấy vào sự lan truyền của sứ điệp.
    reason: cross_reference
lexical_decisions:
- source_word: μὴ οὐκ ἤκουσαν
  choice: Chẳng lẽ họ đã không nghe sao?
  rationale: Diễn đạt tự nhiên câu hỏi tu từ có hai yếu tố phủ định và hàm ý câu trả lời khẳng định, đồng thời phản ánh động từ aorist bằng cách nói về việc đã nghe.
- source_word: μενοῦνγε
  choice: Chắc chắn là họ đã nghe
  rationale: Làm rõ lời đáp khẳng định đầy nhấn mạnh mà tiểu từ Hy Lạp hàm chứa, phù hợp cách diễn đạt tiếng Việt hiện đại.
- source_word: φθόγγος
  choice: Tiếng
  rationale: Giữ sắc thái âm thanh có thể nghe được và sự song đối thi ca với “lời”; “âm thanh” cũng là một khả năng dịch sát.
- source_word: γῆ
  choice: đất
  rationale: Trong lời trích dẫn có phạm vi phổ quát, “khắp đất” truyền đạt toàn cõi đất chứ không phải một vùng lãnh thổ riêng.
- source_word: ἐξῆλθεν
  choice: đã vang ra
  rationale: “Vang ra” là cách diễn đạt tự nhiên đối với tiếng lan truyền rộng khắp, còn “đã” phản ánh giá trị quá khứ của aorist.
- source_word: πέρατα
  choice: tận cùng
  rationale: Giữ hình ảnh thi ca về những nơi xa nhất và tạo câu tiếng Việt trang trọng, tự nhiên.
- source_word: οἰκουμένης
  choice: thế giới có người sinh sống
  rationale: Thể hiện rõ sắc thái từ vựng là thế giới có cư dân, thay vì chỉ nói chung về thế giới.
- source_word: ῥήματα
  choice: lời
  rationale: Là tương đương trực tiếp, tự nhiên và duy trì sự song đối với “tiếng” mà không diễn giải thành “sứ điệp”.
- source_word: αὐτῶν
  choice: của chúng
  rationale: Đại từ “chúng” không buộc đối tượng quy chiếu phải là con người, nhờ đó tránh quyết định liệu Phao-lô đang nói đến các tầng trời trong Thi Thiên hay những người rao truyền trong cách ông vận dụng câu trích.
theological_decisions:
- issue: Đối tượng của đại từ “của chúng” trong lời trích Thi Thiên
  choice: Giữ đại từ trung tính, không thêm danh từ giải thích
  alternative: Nêu rõ “chúng” là các tầng trời, hoặc đổi thành “những người rao giảng”
  rationale: Phao-lô trích Thi Thiên 19:4 và vận dụng ngôn ngữ ấy vào việc sứ điệp được truyền đi. Bản dịch giữ nguyên độ mở của đại từ, không loại bỏ sự căng thẳng liên văn bản bằng một kết luận diễn giải.
translation_notes:
  register: Ngôn ngữ hiện đại, trang trọng vừa phải và dễ hiểu. Cấu trúc hai dòng được giữ để làm nổi bật tính thi ca của lời trích. “Chúng” được dùng trong phần trích dẫn nhằm bảo toàn tính chưa xác định của đối tượng quy chiếu; “họ” trong câu hỏi vẫn tự nhiên khi chỉ những người được nói đến trong lập luận trực tiếp.
