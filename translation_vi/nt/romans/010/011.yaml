  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: λέγει γὰρ ἡ γραφή· Πᾶς ὁ πιστεύων ἐπ’ αὐτῷ οὐ καταισχυνθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/011.yaml
  text: For the Scripture says[a], “Everyone who believes in him will not be put to shame.”
translation:
  language: vi
  text: 'Vì Kinh Thánh nói: “Bất cứ ai tin nơi Ngài sẽ không bị làm cho hổ thẹn.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Bất cứ ai tin nơi Ngài sẽ không hổ thẹn.”'
    reason: Phương án này diễn đạt động từ theo sắc thái trạng thái/chủ động trong tiếng Việt; bản văn chính giữ rõ sắc thái tương lai bị động của từ Hy Lạp.
lexical_decisions:
- source_word: λέγει
  choice: nói rằng
  rationale: Thì hiện tại trong công thức trích dẫn được diễn đạt tự nhiên bằng “nói rằng”, giữ sức sống của lời Kinh Thánh.
- source_word: γὰρ
  choice: Vì
  rationale: Từ nối này nêu căn cứ cho lời khẳng định trước đó và giữ mạch lập luận của Phao-lô.
- source_word: ἡ γραφή
  choice: Kinh Thánh
  rationale: Trong công thức trích dẫn của Phao-lô, từ này chỉ phần Kinh Thánh thiêng liêng, không chỉ một văn bản nói chung.
- source_word: Πᾶς ὁ πιστεύων
  choice: Bất cứ ai tin
  rationale: Cấu trúc có nghĩa khái quát và bao gồm mọi người; cách diễn đạt này tự nhiên trong tiếng Việt và không biến giống đực ngữ pháp thành giới tính nam.
- source_word: πιστεύων
  choice: tin
  rationale: “Tin” là cách tương đương trực tiếp, tự nhiên trong ngữ cảnh này, đồng thời vẫn cho phép giới từ đi kèm biểu đạt sự nương cậy hướng về một người.
- source_word: ἐπ’ αὐτῷ
  choice: nơi Ngài
  rationale: Với πιστεύω, ἐπί cộng tặng cách diễn tả lòng tin và sự nương cậy đặt nơi một người. “Tin nơi Ngài” vừa tự nhiên vừa giữ đại từ mà không giải thích thêm danh tính.
- source_word: καταισχυνθήσεται
  choice: sẽ không bị hổ thẹn
  rationale: Cách dịch giữ thì tương lai và sắc thái bị động, đồng thời diễn đạt sự không phải chịu nhục khi niềm tin được chứng thực.
theological_decisions:
- issue: Phạm vi khái quát của Πᾶς ὁ πιστεύων
  choice: Bất cứ ai tin
  alternative: Mọi người tin; người nào tin
  rationale: Giống đực số ít trong tiếng Hy Lạp có chức năng đại diện, không giới hạn ở nam giới; bản dịch giữ phạm vi phổ quát.
- issue: Đối tượng của αὐτῷ
  choice: Ngài
  alternative: Đấng ấy; Chúa
  rationale: Ngữ cảnh xác định đối tượng của lòng tin, nhưng bản dịch giữ hình thức đại từ của câu trích dẫn thay vì thêm danh xưng giải nghĩa.
- issue: Sắc thái của καταισχυνθήσεται
  choice: sẽ không bị hổ thẹn
  alternative: sẽ không phải thất vọng; sẽ không bị làm nhục
  rationale: Lựa chọn này giữ thể bị động và sự căng thẳng giữa cảm nghiệm hổ thẹn với việc bị làm cho nhục nhã, không thu hẹp ý nghĩa vào cảm xúc chủ quan.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” để chỉ đại từ quy chiếu về Đấng được tin cậy, nhưng không đưa danh tính giải thích vào chính câu trích dẫn.
