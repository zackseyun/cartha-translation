- from: 'Vì Kinh Thánh nói rằng: “Bất cứ ai tin nơi Ngài sẽ không bị hổ thẹn.”[a]'
  to: 'Vì Kinh Thánh nói: “Bất cứ ai tin nơi Ngài sẽ không bị làm cho hổ thẹn.”[a]'
  rationale: Chỉnh công thức dẫn trích cho gọn tự nhiên, thay “bị hổ thẹn” bằng “bị làm cho hổ thẹn” để bảo toàn thể bị động, và thay chú thích diễn giải “thất vọng” bằng phương án từ vựng sát hơn với nghĩa hổ thẹn/nhục nhã. Không thay đổi phạm vi phổ quát, đối tượng của lòng tin, hay ý nghĩa thần học của câu.
