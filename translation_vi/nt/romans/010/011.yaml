review_pass:
  verdict: revise
  source_fidelity: Bản dịch truyền đạt đúng mạch lập luận của γάρ, công thức trích dẫn hiện tại của λέγει, tính phổ quát của Πᾶς ὁ πιστεύων, và đại từ quy chiếu trong αὐτῷ. Tuy nhiên, καταισχυνθήσεται là động từ tương lai thể bị động; “bị hổ thẹn” chưa tự nhiên và chưa biểu đạt rõ tác động bị động như “bị làm cho hổ thẹn.” Chú thích hiện có chuyển sang “thất vọng,” làm ý nghĩa nghiêng về thất vọng chủ quan hơn là bị làm nhục/hổ thẹn và không phải là phương án sát nhất trong vết kiểm tra tiếng Anh.
  naturalness: “Kinh Thánh nói:” là công thức trích dẫn hiện đại, tự nhiên và gọn hơn “Kinh Thánh nói rằng:”. “Sẽ không bị làm cho hổ thẹn” vừa rõ nghĩa vừa giữ được thể bị động; vẫn phù hợp văn phong trang trọng hiện đại.
  terminology: Giữ “Kinh Thánh,” “tin nơi Ngài,” và “Ngài” phù hợp văn cảnh trích dẫn và phong cách trang trọng. Không mở rộng đại từ thành danh xưng hay giải thích thần học. Phương án chú thích “sẽ không hổ thẹn” phản ánh cách hiểu chủ động/trạng thái được ghi nhận trong audit trail mà không thay thế bản văn chính có sắc thái bị động.
  issues:
  - severity: medium
    issue: Cụm “sẽ không bị hổ thẹn” không diễn đạt rõ thể bị động của καταισχυνθήσεται.
    rationale: Động từ Hy Lạp là tương lai bị động, với ý bị làm cho nhục nhã/hổ thẹn. “Bị làm cho hổ thẹn” biểu đạt trực tiếp hơn và tự nhiên hơn trong tiếng Việt.
  - severity: medium
    issue: Chú thích “sẽ không phải thất vọng” không phải phương án thay thế gần nhất về mặt từ vựng.
    rationale: καταισχύνω chủ yếu nói đến hổ thẹn, nhục nhã, hoặc bị làm cho mất mặt; “thất vọng” có thể là hệ quả diễn giải nhưng dễ chuyển trọng tâm sang tâm trạng chủ quan. Audit trail tiếng Anh nêu “will not be ashamed” là lựa chọn thay thế phù hợp hơn.
