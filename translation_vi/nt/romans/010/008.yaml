id: ROM.10.8
reference: Romans 10:8
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀλλὰ τί λέγει; Ἐγγύς σου τὸ ῥῆμά ἐστιν, ἐν τῷ στόματί σου καὶ ἐν τῇ καρδίᾳ σου, τοῦτ’ ἔστιν τὸ ῥῆμα τῆς πίστεως ὃ κηρύσσομεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/008.yaml
  text: But what does it say? “The word is near you[a], in your mouth and in your heart” — that is[b], the word of faith that we proclaim.
translation:
  language: vi
  text: Nhưng lời ấy nói gì? “lời ở gần bạn, ở trong miệng bạn và trong lòng bạn.”[a] Tức là lời của đức tin mà chúng tôi rao giảng.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Phao-lô nhắc lại Phục Truyền Luật Lệ Ký 30:14 rồi áp dụng ngôn ngữ của câu ấy cho sứ điệp được rao giảng.
    reason: cross_reference
  - marker: b
    text: Cụm “lời của đức tin” cũng có thể hiểu là “sứ điệp về đức tin” hoặc “sứ điệp kêu gọi lòng tin.” Từ Hy Lạp πίστις đôi khi cũng có nghĩa là “lòng tin” hay “sự trung tín.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Nhưng
  rationale: Diễn đạt tự nhiên quan hệ tương phản với phần lập luận trước.
- source_word: τί λέγει
  choice: lời ấy nói gì?
  rationale: Động từ ngôi thứ ba số ít có chủ thể hàm ẩn từ ngữ cảnh trích dẫn Kinh Thánh. “Lời ấy” giúp câu tiếng Việt tự nhiên mà không xác định quá mức là “Kinh Thánh” hay một nhân vật nói.
- source_word: Ἐγγύς σου
  choice: ở gần bạn
  rationale: Giữ ý không gian và ẩn dụ súc tích của câu trích dẫn; “bạn” là đại từ số ít phù hợp với σου.
- source_word: τὸ ῥῆμα
  choice: Lời
  rationale: Giữ sự lặp lại từ vựng trong câu trích và phần giải thích của Phao-lô; từ này cũng có thể mang nghĩa “sứ điệp”.
- source_word: ἐν τῷ στόματί σου καὶ ἐν τῇ καρδίᾳ σου
  choice: ở trong miệng bạn và trong lòng bạn
  rationale: Bảo toàn hình ảnh thân thể và nội tâm của nguyên văn, đồng thời nghe tự nhiên trong văn phong Kinh Thánh tiếng Việt.
- source_word: τοῦτ’ ἔστιν
  choice: Đó chính là
  rationale: Giới thiệu phần Phao-lô giải thích câu trích; “chính” làm rõ quan hệ đồng vị mà không đổi nội dung.
- source_word: τὸ ῥῆμα τῆς πίστεως
  choice: lời của đức tin
  rationale: Giữ liên kết với ῥῆμα ở vế trước và không giải quyết quá mức quan hệ sở hữu rộng của τῆς πίστεως; có thể hiểu là lời liên quan đến, kêu gọi, hoặc mang đặc tính đức tin.
- source_word: ὃ κηρύσσομεν
  choice: mà chúng tôi rao giảng
  rationale: “Rao giảng” diễn đạt hành động công bố công khai của κηρύσσω và là cách nói hiện đại, dễ hiểu.
theological_decisions:
- issue: Ý nghĩa của πίστις trong τὸ ῥῆμα τῆς πίστεως
  choice: đức tin
  alternative: lòng tin; sự trung tín; sứ điệp về đức tin
  rationale: “Đức tin” phù hợp với cách dùng của Phao-lô trong ngữ cảnh và giữ cấu trúc cô đọng của nguyên văn, trong khi chú thích ghi nhận trường nghĩa rộng hơn mà không áp đặt một hệ phái hay cách giải thích riêng.
- issue: Quan hệ giữa câu trích Phục Truyền Luật Lệ Ký 30:14 và lời rao giảng
  choice: Giữ nguyên câu trích rồi để Phao-lô giải thích bằng “Đó chính là”
  alternative: Diễn giải ngay câu trích thành “sứ điệp phúc âm ở gần bạn”
  rationale: 'Cách chọn bảo toàn tiến trình lập luận: trước hết là ngôn ngữ của câu Kinh Thánh được dẫn lại, sau đó Phao-lô áp dụng ngôn ngữ ấy cho lời đức tin được rao giảng.'
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “bạn” để phản ánh đại từ số ít σου và tránh lối xưng hô cổ; giữ “miệng” và “lòng” nhằm bảo toàn hình ảnh của nguyên văn. Các dấu chú thích [a], [b] đều xuất hiện trong bản văn chính.
