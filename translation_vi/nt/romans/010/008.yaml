revisions:
- from: Nhưng lời ấy nói gì? “Lời ở gần bạn, ở trong miệng bạn và trong lòng bạn.”[a] Đó chính là lời của đức tin mà chúng tôi rao giảng.[b]
  to: Nhưng lời ấy nói gì? “lời ở gần bạn, ở trong miệng bạn và trong lòng bạn.”[a] Tức là lời của đức tin mà chúng tôi rao giảng.[b]
  rationale: 'Chỉ thực hiện các chỉnh sửa an toàn ở mức độ hình thức và sắc thái: hạ chữ viết hoa của “lời” để tránh hàm ý không có trong nguyên ngữ, và thay “Đó chính là” bằng “Tức là” để phản ánh trực tiếp hơn τοῦτ’ ἔστιν. Các chú thích giữ nguyên neo [a] sau câu trích và [b] sau cụm có πίστις; cả hai đều khớp nội dung chú thích.'
  reviewer_model: gpt-5.6-terra
