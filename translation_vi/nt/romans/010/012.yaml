id: ROM.10.12
reference: Romans 10:12
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οὐ γάρ ἐστιν διαστολὴ Ἰουδαίου τε καὶ Ἕλληνος, ὁ γὰρ αὐτὸς κύριος πάντων, πλουτῶν εἰς πάντας τοὺς ἐπικαλουμένους αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/012.yaml
  text: For there is no distinction between Jew and Greek[a], for the same Lord is Lord of all[b], being rich toward all who call on him.
translation:
  language: vi
  text: 'Vì không có sự phân biệt giữa người Do Thái và người Hy Lạp[a], bởi cùng một Chúa là Chúa của tất cả[b], và Ngài rộng lượng với tất cả những ai kêu cầu Ngài.


    [a] Nguyên văn Hy Lạp là “người Hy Lạp”; ở đây, cặp “người Do Thái/người Hy Lạp” diễn tả sự tương phản giữa người Do Thái và người không phải Do Thái. Một số bản dịch dùng “dân ngoại”.


    [b] Cũng có thể dịch: “cùng một Chúa ở trên tất cả”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn Hy Lạp là “người Hy Lạp”; ở đây, cặp “người Do Thái/người Hy Lạp” diễn tả sự tương phản giữa người Do Thái và người không phải Do Thái. Một số bản dịch dùng “dân ngoại”.
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “cùng một Chúa ở trên tất cả”.'
    reason: alternative_reading
lexical_decisions:
- source_word: διαστολή
  choice: sự phân biệt
  rationale: Danh từ này chỉ việc phân định hay khác biệt giữa hai nhóm. “Sự phân biệt” tự nhiên trong tiếng Việt và không thêm hàm ý đánh giá hơn kém.
- source_word: Ἰουδαίου ... Ἕλληνος
  choice: người Do Thái ... người Hy Lạp
  rationale: Giữ đúng danh xưng “người Hy Lạp” của nguyên văn; chú thích giải thích rằng trong ngữ cảnh này cặp từ có chức năng đối chiếu người Do Thái với người không phải Do Thái.
- source_word: ὁ ... αὐτὸς κύριος πάντων
  choice: cùng một Chúa là Chúa của tất cả
  rationale: Lặp lại “Chúa” để câu tiếng Việt rõ quan hệ vị ngữ và giữ πάντων theo nghĩa “của tất cả”; chú thích bảo lưu cách hiểu “ở trên tất cả”.
- source_word: κύριος
  choice: Chúa
  rationale: Đây là tước hiệu có sức nặng thần học trong Rô-ma 10; “Chúa” phù hợp hơn “chủ” và không diễn giải thêm danh tính ngay trong câu.
- source_word: πλουτῶν εἰς πάντας
  choice: rộng lượng với tất cả
  rationale: Cụm này mô tả sự dư dật được hướng đến người kêu cầu. “Rộng lượng với” truyền đạt tự nhiên ý nghĩa hào phóng của ẩn dụ giàu có, tránh lối nói gượng “giàu có đối với”.
- source_word: τοὺς ἐπικαλουμένους αὐτόν
  choice: những ai kêu cầu Ngài
  rationale: “Kêu cầu” diễn tả việc hướng về Chúa để cầu xin trong đức tin và nối tự nhiên với câu 13.
theological_decisions:
- issue: Đối tượng được gọi là “Chúa”
  choice: Giữ nguyên tước hiệu “Chúa”; ngữ cảnh Rô-ma 10:9–13 cho thấy đó là Chúa được xưng nhận, tức Đức Giê-su, đồng thời vẫn vang vọng câu Kinh Thánh nói về việc kêu cầu Chúa.
  alternative: Hiểu theo nghĩa khái quát là Đức Chúa Trời mà không xác định là Đấng Christ.
  rationale: Bản dịch không chèn tên “Đức Giê-su” vào câu, nên để chính ngữ cảnh biểu đạt tuyên bố Cơ Đốc học và bảo tồn sự cộng hưởng với lời trích từ Giô-ên.
- issue: Phạm vi của “tất cả”
  choice: “Tất cả” được giới hạn bởi cụm “những ai kêu cầu Ngài”.
  alternative: Hiểu là một tuyên bố cứu rỗi phổ quát không có điều kiện đối với mọi người.
  rationale: Cú pháp gắn phạm vi phổ quát với nhóm người kêu cầu Chúa, vừa khẳng định không phân biệt Do Thái/Hy Lạp vừa giữ nguyên điều kiện được nêu trong câu.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. “Rộng lượng với” ưu tiên sự tự nhiên mà vẫn giữ ý về nguồn dư dật hào phóng; đại từ “Ngài” duy trì sắc thái tôn kính. Dấu nối “và” trước mệnh đề cuối làm rõ rằng phân từ πλουτῶν tiếp tục mô tả cùng một Chúa.
