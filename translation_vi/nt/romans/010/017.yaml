  text: ἄρα ἡ πίστις ἐξ ἀκοῆς, ἡ δὲ ἀκοὴ διὰ ῥήματος ⸀Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/017.yaml
  text: So faith comes from hearing[a], and hearing through the word of Messiah.
translation:
  language: vi
  text: Vậy đức tin đến từ việc nghe, và việc nghe đến qua lời của Đấng Mê-si[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “lời về Đấng Mê-si” hoặc “sứ điệp liên quan đến Đấng Mê-si.” Sở hữu cách trong tiếng Hy Lạp có thể được hiểu theo nhiều cách.'
    reason: Bảo lưu cách hiểu khác của cụm ῥήματος Χριστοῦ.
lexical_decisions:
- source_word: ἄρα
  choice: Vậy
  rationale: Tiểu từ suy luận này rút ra kết luận từ lập luận ngay trước đó; “Vậy” tự nhiên và giữ rõ mối liên hệ logic.
- source_word: πίστις
  choice: đức tin
  rationale: Trong ngữ cảnh Rô-ma 10:14–16, từ này chỉ sự đáp ứng bằng đức tin đối với lời được công bố, chứ không chủ yếu mang nghĩa “sự trung tín”.
- source_word: ἐξ ἀκοῆς
  choice: đến từ việc nghe
  rationale: ἐξ diễn tả nguồn gốc; thêm “đến” để diễn đạt tự nhiên mệnh đề không có động từ trong tiếng Hy Lạp.
- source_word: ἀκοή
  choice: việc nghe
  rationale: ἀκοή có thể chỉ hành động nghe hoặc điều được nghe. “Việc nghe” ưu tiên nghĩa hành động trong ngữ cảnh nhưng không giải thích quá mức.
- source_word: δὲ
  choice: còn
  rationale: Ở đây δέ nối tiếp và chuyển nhẹ sang mệnh đề thứ hai, không biểu thị sự tương phản mạnh.
- source_word: διὰ
  choice: qua
  rationale: διά với sở hữu cách diễn tả phương tiện hoặc trung gian; “qua” ngắn gọn và sát nghĩa.
- source_word: ῥήματος
  choice: lời
  rationale: ῥῆμα thường chỉ lời được nói hay lời phán. “Lời” giữ sắc thái từ vựng và âm hưởng quen thuộc mà vẫn dễ hiểu.
- source_word: Χριστοῦ
  choice: của Đấng Mê-si
  rationale: Χριστός ở đây là tước hiệu nên được dịch là “Đấng Mê-si”. Cách dịch với “của” giữ tương đối sát cấu trúc sở hữu cách và để ngỏ quan hệ chính xác; cách hiểu “lời về Đấng Mê-si” được ghi ở chú thích.
theological_decisions:
- issue: Nghĩa của πίστις trong ngữ cảnh này
  choice: đức tin
  alternative: sự tin cậy; sự trung tín
  rationale: Mạch văn nói đến phản ứng của con người khi nghe Tin Mừng được công bố, nên “đức tin” phù hợp nhất mà không áp đặt một nghĩa chuyên biệt khác.
- issue: Quan hệ của Χριστοῦ với ῥήματος
  choice: lời của Đấng Mê-si
  alternative: lời về Đấng Mê-si; sứ điệp liên quan đến Đấng Mê-si
  rationale: Sở hữu cách Hy Lạp có thể được hiểu theo nghĩa chủ thể/sở hữu hoặc nghĩa đối tượng. Bản văn chính giữ cách diễn đạt tương đối hình thức, còn cách hiểu mang nghĩa đối tượng được bảo lưu trong chú thích.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “Đấng Mê-si” như một tước hiệu; giữ sự lặp lại của ἀκοή bằng “việc nghe” và không làm mất tính hàm nghĩa của nguyên văn.
