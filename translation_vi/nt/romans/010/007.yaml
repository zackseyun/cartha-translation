  text: ἤ· Τίς καταβήσεται εἰς τὴν ἄβυσσον; τοῦτ’ ἔστιν Χριστὸν ἐκ νεκρῶν ἀναγαγεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/007.yaml
  text: or[a], “Who will descend into the abyss?” (that is[b], to bring Messiah up from the dead).
translation:
  language: vi
  text: 'hay[a]: “Ai sẽ xuống vực sâu?” (tức là đem Đấng Mê-si-a[b] từ cõi chết lên).'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch là “hay: ‘Ai sẽ xuống nơi sâu thẳm?’” Phao-lô nhắc lại Phục Truyền Luật Lệ Ký 30:13, nhưng tại đây ông dùng “vực sâu” và áp dụng lời ấy vào việc đem Đấng Mê-si-a lên từ cõi chết.'
    reason: lexical_alternative
  - marker: b
    text: Tiếng Hy Lạp dùng Χριστός, nghĩa là “Đấng Mê-si-a”; từ này được dịch theo nghĩa tước hiệu tại đây.
    reason: alternative_reading
lexical_decisions:
- source_word: ἤ
  choice: hay
  rationale: Mở đầu vế thứ hai mang tính đối chiếu; “hay” ngắn gọn và tự nhiên trong mạch lập luận tiếng Việt.
- source_word: Τίς καταβήσεται
  choice: Ai sẽ xuống
  rationale: Giữ nguyên câu hỏi tu từ và thì tương lai của động từ, đồng thời dùng cách diễn đạt tự nhiên.
- source_word: εἰς τὴν ἄβυσσον
  choice: xuống vực sâu
  rationale: “Vực sâu” bảo tồn hình ảnh của ἄβυσσος và không thu hẹp nghĩa thành mồ mả hay âm phủ.
- source_word: τοῦτ’ ἔστιν
  choice: tức là
  rationale: Công thức giải thích thông dụng, gần sát tiếng Hy Lạp và tự nhiên trong tiếng Việt.
- source_word: Χριστόν
  choice: Đấng Mê-si-a
  rationale: Χριστός tại đây mang chức năng tước hiệu; “Đấng Mê-si-a” truyền đạt nội dung tước hiệu thay vì chỉ phiên âm truyền thống.
- source_word: ἐκ νεκρῶν
  choice: từ cõi chết
  rationale: Diễn đạt thành ngữ chỉ trạng thái hoặc phạm vi của những người chết bằng tiếng Việt trang trọng, dễ hiểu.
- source_word: ἀναγαγεῖν
  choice: đem ... lên
  rationale: Giữ hình ảnh không gian đối ứng với “xuống,” tránh thay trực tiếp bằng thuật ngữ giải nghĩa “làm cho sống lại.”
theological_decisions:
- issue: Cách dịch Χριστός
  choice: Đấng Mê-si-a
  alternative: Đấng Christ
  rationale: Trong lời giải thích này, từ ngữ hoạt động như một tước hiệu; bản dịch nêu rõ nghĩa của tước hiệu mà không thêm nét giáo phái.
- issue: Ý nghĩa của ἄβυσσος
  choice: Giữ hình ảnh “vực sâu” trong chính văn
  alternative: biển sâu; cõi chết; âm phủ
  rationale: Phao-lô vọng lại Phục Truyền Luật Lệ Ký 30:13 nhưng áp dụng lời ấy vào việc đem Đấng Mê-si-a lên từ cõi chết. Không đồng nhất “vực sâu” với một địa hạt cụ thể giúp bảo tồn tính ám chỉ và căng thẳng thần học của câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “vực sâu” để giữ hình ảnh nguyên ngữ, “Đấng Mê-si-a” để biểu đạt tước hiệu, và cấu trúc “đem ... lên” để duy trì sự đối ứng không gian với “xuống.”
