  source_fidelity: 'Bản nháp truyền đạt đúng các thành tố chính: lời xưng hô, lòng ao ước của Phao-lô, lời khẩn cầu hướng đến Đức Chúa Trời cho “họ,” và mục tiêu họ được cứu. Tuy nhiên, cấu trúc “... là để họ được cứu” không tự nhiên trong tiếng Việt và làm quan hệ cú pháp giữa hai vế danh từ với mục tiêu bị nặng nề. Bản sửa diễn đạt rõ rằng cả lòng ao ước lẫn lời cầu xin đều hướng đến việc họ được cứu, mà vẫn giữ đại từ “họ” của nguyên văn.'
