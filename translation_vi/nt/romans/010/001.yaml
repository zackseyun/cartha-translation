id: ROM.10.1
reference: Romans 10:1
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἀδελφοί, ἡ μὲν εὐδοκία τῆς ἐμῆς καρδίας καὶ ἡ ⸀δέησις πρὸς τὸν θεὸν ὑπὲρ ⸀αὐτῶν εἰς σωτηρίαν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/001.yaml
  text: Brothers[a], the desire of my heart and my prayer to God for them is for their salvation.
translation:
  language: vi
  text: Thưa anh em[a], lòng tôi ao ước và tôi cầu xin Đức Chúa Trời cho họ được cứu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “thưa anh chị em”; tiếng Hy Lạp dùng hình thức số nhiều giống đực, nhưng có thể dùng để gọi một nhóm gồm cả nam lẫn nữ.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀδελφοί
  choice: Thưa anh em
  rationale: Hô cách số nhiều của ἀδελφός được dịch bằng cách xưng hô tự nhiên, trang trọng trong tiếng Việt; hình thức giống đực của nguyên văn được giữ, còn phạm vi có thể bao gồm cả nữ giới được nêu trong chú thích.
- source_word: εὐδοκία τῆς ἐμῆς καρδίας
  choice: điều lòng tôi ao ước
  rationale: Trong ngữ cảnh này, εὐδοκία chỉ điều Phao-lô tha thiết mong muốn. Cách diễn đạt này tự nhiên hơn lối dịch sát chữ nhưng nặng nề như “ước muốn của lòng tôi”.
- source_word: δέησις
  choice: lời tôi cầu xin
  rationale: δέησις mang sắc thái lời khẩn cầu hay thỉnh nguyện; “lời tôi cầu xin” vừa rõ nghĩa vừa giữ sắc thái tha thiết hơn từ khái quát “lời cầu nguyện”.
- source_word: πρὸς τὸν θεόν
  choice: Đức Chúa Trời
  rationale: Giới từ πρός diễn tả hướng của lời cầu xin. Trong cấu trúc tiếng Việt, động từ “cầu xin” trực tiếp đi với đối tượng nên không cần thêm “với” hay “lên”.
- source_word: ὑπὲρ αὐτῶν
  choice: cho họ
  rationale: ὑπέρ ở đây diễn tả lợi ích hoặc thay mặt cho người khác; “cho họ” ngắn gọn, tự nhiên và giữ đại từ của nguyên văn.
- source_word: εἰς σωτηρίαν
  choice: là để họ được cứu
  rationale: εἰς biểu thị mục tiêu. Thêm “họ” làm rõ chủ thể thụ hưởng đã có trong ὑπὲρ αὐτῶν mà không thay đại từ bằng danh từ giải nghĩa.
- source_word: μὲν
  choice: không dịch thành từ riêng
  rationale: μέν có tác dụng diễn ngôn nhẹ và hướng tới phần triển khai tiếp theo; đưa một từ như “quả thật” vào đây sẽ khiến tiếng Việt gượng và nhấn quá mức.
theological_decisions:
- issue: Phạm vi của lời xưng hô Ἀδελφοί
  choice: Giữ “anh em” trong chính văn và chú thích khả năng bao gồm cả nam lẫn nữ
  alternative: Dịch trực tiếp “anh chị em”
  rationale: Nguyên văn dùng hình thức số nhiều giống đực, nhưng trong cách xưng hô cộng đồng, từ này có thể chỉ toàn thể hội chúng gồm cả nam và nữ. Chính văn giữ hình thức nguồn, còn chú thích bảo toàn phạm vi bao hàm có thể có.
- issue: Ý nghĩa của εἰς σωτηρίαν
  choice: Mục tiêu là để họ được cứu
  alternative: “hướng đến sự cứu rỗi” hoặc “dẫn đến sự cứu rỗi”
  rationale: Cụm từ diễn tả mục tiêu của niềm ao ước và lời cầu xin, không khẳng định rằng lời cầu nguyện tự nó tất yếu tạo ra kết quả cứu rỗi.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Câu giữ đại từ “họ” của nguyên văn, với đối tượng được nhận biết từ văn mạch trước. Dùng “ao ước” và “cầu xin” để truyền đạt sắc thái tha thiết mà không cường điệu.
