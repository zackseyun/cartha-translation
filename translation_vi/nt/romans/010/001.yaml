  terminology: “Thưa anh em,” là lời xưng hô phù hợp và giữ dạng giống đực số nhiều của Ἀδελφοί. “Đức Chúa Trời,” “cầu xin,” và “được cứu” đều phù hợp với văn phong Kinh Thánh tiếng Việt hiện đại. Chú thích về khả năng bao gồm cả nam lẫn nữ được giữ nguyên về nội dung.
