  text: τέλος γὰρ νόμου Χριστὸς εἰς δικαιοσύνην παντὶ τῷ πιστεύοντι.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/004.yaml
  text: For Messiah is the end of the law for righteousness to everyone who believes[a][b].
translation:
  language: vi
  text: Vì Đấng Mê-si là sự kết thúc của luật pháp, đem lại sự công chính cho mọi người tin[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch “mục tiêu”, “đỉnh điểm” hoặc “sự hoàn tất”; từ Hy Lạp được dịch là “sự kết thúc” có thể mang các nghĩa này.
    reason: alternative_reading
  - marker: b
    text: Trong cách dùng của Phao-lô, từ được dịch là “sự công chính” cũng có thể được dịch là “công lý”.
    reason: lexical_alternative
lexical_decisions:
- source_word: τέλος
  choice: đích điểm
  rationale: “Đích điểm” vừa có thể chỉ điểm kết thúc vừa gợi mục tiêu hay điểm hội tụ, nhờ đó giữ được phần nào sự đa nghĩa của τέλος trong câu văn cô đọng này.
- source_word: νόμου
  choice: luật pháp
  rationale: Trong mạch lập luận của Rô-ma, từ này chỉ Luật pháp Môi-se như một phạm trù giao ước đã được biết đến; “luật pháp” là cách diễn đạt tự nhiên và trang trọng trong tiếng Việt.
- source_word: Χριστὸς
  choice: Đấng Mê-si
  rationale: Ở đây danh hiệu mang ý nghĩa nổi bật vì Phao-lô nói về mối liên hệ của Chúa Giê-su với luật pháp và niềm hy vọng giao ước của Y-sơ-ra-ên.
- source_word: εἰς δικαιοσύνην
  choice: đem sự công chính đến
  rationale: Cách dịch này thể hiện hướng đích hoặc kết quả của εἰς bằng tiếng Việt tự nhiên, nhưng không xác định quá mức cơ chế thần học của sự công chính.
- source_word: δικαιοσύνην
  choice: sự công chính
  rationale: “Sự công chính” giữ được thuật ngữ thần học quen thuộc trong thư Rô-ma; khả năng dịch là “công lý” được ghi nhận trong chú thích.
- source_word: παντὶ τῷ πιστεύοντι
  choice: cho mọi người tin
  rationale: Cách diễn đạt bao quát, rõ ràng và giữ được sắc thái phân từ của πιστεύοντι mà không thêm một công thức giáo phái.
- source_word: γὰρ
  choice: Vì
  rationale: “Vì” cho thấy câu này giải thích cho lập luận ngay trước đó, đúng với chức năng liên kết của γάρ.
theological_decisions:
- issue: Ý nghĩa của τέλος νόμου đối với Luật pháp Môi-se
  choice: “đích điểm của luật pháp” trong chính văn
  alternative: “điểm kết thúc của luật pháp”, “mục tiêu của luật pháp”, hoặc “sự hoàn tất của luật pháp”
  rationale: τέλος có thể mang nghĩa chấm dứt, mục tiêu, kết quả hoặc điểm hoàn tất. “Đích điểm” và chú thích đi kèm bảo tồn sự căng thẳng giữa sắc thái kết thúc và sắc thái hướng đích, thay vì quyết định dứt khoát theo một cách giải thích.
- issue: Cách dịch Χριστός
  choice: Đấng Mê-si
  alternative: Đấng Christ
  rationale: Ngữ cảnh về luật pháp và câu chuyện giao ước của Y-sơ-ra-ên làm nổi bật chức danh Mê-si.
- issue: Cách dịch δικαιοσύνη
  choice: sự công chính
  alternative: công lý
  rationale: “Sự công chính” phù hợp với cách dùng chủ đạo trong lập luận của Phao-lô, còn “công lý” là khả năng từ vựng chính đáng được bảo tồn trong chú thích.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. “Đấng Mê-si” giữ rõ tính chất danh hiệu; “đích điểm” được chọn để tránh thu hẹp τέλος chỉ còn nghĩa chấm dứt hoặc chỉ còn nghĩa mục tiêu. Cấu trúc “đem sự công chính đến cho” làm rõ quan hệ εἰς ... παντὶ bằng tiếng Việt tự nhiên mà không thêm ý “được kể là” hay một cơ chế xưng công chính không có trực tiếp trong câu Hy Lạp.
