    rationale: Trong tiếng Việt hiện đại, “đích điểm” chủ yếu gợi mục tiêu hoặc nơi hướng đến, trong khi τέλος cũng có thể chỉ sự kết thúc. Dịch “sự kết thúc” tương ứng sát hơn với lựa chọn “end” của bản kiểm tra tiếng Anh; chú thích có thể bảo lưu các sắc thái mục tiêu, đỉnh điểm và hoàn tất.
  - severity: low
