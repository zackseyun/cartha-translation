id: ROM.10.9
reference: Romans 10:9
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὅτι ἐὰν ⸀ὁμολογήσῃς ἐν τῷ στόματί ⸀σου κύριον Ἰησοῦν, καὶ πιστεύσῃς ἐν τῇ καρδίᾳ σου ὅτι ὁ θεὸς αὐτὸν ἤγειρεν ἐκ νεκρῶν, σωθήσῃ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/009.yaml
  text: because if you confess with your mouth that Jesus is Lord[a], and believe in your heart that God raised him from the dead, you will be saved.
translation:
  language: vi
  text: Vì nếu bạn tuyên xưng bằng miệng rằng Đức Giê-su là Chúa[a], và trong lòng bạn tin rằng Đức Chúa Trời đã làm cho Ngài sống lại từ cõi chết, thì bạn sẽ được cứu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “tuyên xưng Đức Giê-su là Chúa.”'
    reason: Nêu cách diễn đạt gọn hơn của cụm Hy Lạp κύριον Ἰησοῦν mà không thay đổi nội dung lời tuyên xưng.
lexical_decisions:
- source_word: ὅτι
  choice: Vì
  rationale: Diễn đạt quan hệ giải thích/nguyên nhân với câu trước một cách tự nhiên trong tiếng Việt.
- source_word: ἐὰν
  choice: nếu
  rationale: Phản ánh trực tiếp tiểu từ điều kiện đi với các động từ ở thể giả định.
- source_word: ὁμολογήσῃς
  choice: tuyên xưng
  rationale: Giữ được sắc thái công khai, bằng lời nói, về việc thừa nhận niềm tin và lòng trung thành.
- source_word: ἐν τῷ στόματί σου
  choice: miệng bạn
  rationale: Trong cấu trúc “miệng bạn tuyên xưng”, tiếng Việt diễn đạt tự nhiên phương tiện của lời tuyên xưng mà không cần thêm giới từ.
- source_word: κύριον Ἰησοῦν
  choice: rằng Đức Giê-su là Chúa
  rationale: Làm rõ nội dung của lời tuyên xưng và giữ κύριος như một tước hiệu, thay vì biến toàn cụm thành một danh xưng cố định.
- source_word: πιστεύσῃς
  choice: tin
  rationale: Là cách dịch trực tiếp và tự nhiên khi theo sau là mệnh đề nêu nội dung được tin.
- source_word: ἐν τῇ καρδίᾳ σου
  choice: lòng bạn
  rationale: “Lòng” diễn đạt tự nhiên con người nội tâm và niềm xác tín sâu xa trong tiếng Việt hiện đại.
- source_word: ὁ θεὸς αὐτὸν ἤγειρεν
  choice: Đức Chúa Trời đã khiến Ngài sống lại
  rationale: Diễn đạt hành động của Đức Chúa Trời làm cho Đức Giê-su sống lại; “đã” phù hợp với sự kiện quá khứ được động từ aorist nêu ra.
- source_word: ἐκ νεκρῶν
  choice: từ cõi chết
  rationale: Cách nói gọn, trang trọng và dễ hiểu về sự sống lại khỏi tình trạng/lãnh vực của người chết.
- source_word: σωθήσῃ
  choice: bạn sẽ được cứu
  rationale: Giữ đúng thể bị động và ý nghĩa cứu rỗi trong văn mạch của Phao-lô.
theological_decisions:
- issue: Cách dịch κύριος trong công thức tuyên xưng
  choice: Chúa
  alternative: Chủ
  rationale: “Chúa” vừa diễn đạt thẩm quyền vừa giữ âm hưởng Kinh Thánh mạnh trong văn mạch Rô-ma 10, không thu hẹp nghĩa thành quan hệ chủ-tớ thông thường.
- issue: Cấu trúc κύριον Ἰησοῦν
  choice: rằng Đức Giê-su là Chúa
  alternative: tuyên xưng Đức Giê-su là Chúa
  rationale: Cách dịch chính làm rõ đây là nội dung của lời tuyên xưng; phương án thay thế cũng khả dĩ nhưng ít thể hiện rõ cấu trúc mệnh đề nội dung hơn.
- issue: Ý nghĩa cứu rỗi của σωθήσῃ
  choice: bạn sẽ được cứu
  alternative: bạn sẽ được giải cứu
  rationale: “Được cứu” giữ đúng ý nghĩa cứu rỗi trong văn mạch, trong khi “được giải cứu” có thể bị hiểu quá rộng như thoát khỏi một nguy nan nhất thời.
- issue: Chủ thể hành động trong sự sống lại
  choice: Đức Chúa Trời đã khiến Ngài sống lại
  alternative: Đức Chúa Trời đã làm cho Đức Giê-su sống lại
  rationale: Giữ rõ Đức Chúa Trời là tác nhân và Đức Giê-su là đối tượng của hành động, không đồng nhất hai ngôi; “Ngài” nối tự nhiên với Đức Giê-su vừa được nhắc đến.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Dùng “tuyên xưng” để giữ sắc thái công khai của lời nói; dùng “lòng” thay cho cách nói nặng tính giải phẫu “trái tim”. Danh xưng “Đức Giê-su” và “Đức Chúa Trời” phù hợp văn phong Kinh Thánh tiếng Việt phổ thông.
