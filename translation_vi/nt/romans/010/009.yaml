- from: Vì nếu miệng bạn tuyên xưng rằng Đức Giê-su là Chúa[a], và lòng bạn tin rằng Đức Chúa Trời đã khiến Ngài sống lại từ cõi chết, thì bạn sẽ được cứu.
  to: Vì nếu bạn tuyên xưng bằng miệng rằng Đức Giê-su là Chúa[a], và trong lòng bạn tin rằng Đức Chúa Trời đã làm cho Ngài sống lại từ cõi chết, thì bạn sẽ được cứu.
  rationale: Chỉnh “miệng bạn tuyên xưng” thành “bạn tuyên xưng bằng miệng” để phản ánh tự nhiên hơn cụm ἐν τῷ στόματί σου. Giữ nguyên các lựa chọn thuật ngữ và nội dung còn lại vì chúng trung thành với bản Hy Lạp và phù hợp văn phong Kinh Thánh tiếng Việt hiện đại.
