  to: 'Còn về Israel, Ngài phán[a]: “Suốt ngày Ta đã dang tay hướng về dân không vâng lời[b] và chống đối[c].”'
  rationale: 'Chỉnh sửa tối thiểu nhằm làm câu tự nhiên hơn trong tiếng Việt hiện đại: thay “Nhưng về” bằng “Còn về” và bỏ số từ không cần thiết trong “một dân”. Hình ảnh dang tay, thì quá khứ của lời trích dẫn, chủ thể hàm ẩn theo ngữ cảnh, và hai phân từ mô tả sự khước từ cùng phản kháng đều được giữ nguyên.'
