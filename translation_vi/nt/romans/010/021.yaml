  text: πρὸς δὲ τὸν Ἰσραὴλ λέγει· Ὅλην τὴν ἡμέραν ἐξεπέτασα τὰς χεῖράς μου πρὸς λαὸν ἀπειθοῦντα καὶ ἀντιλέγοντα.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/021.yaml
  text: But concerning Israel he says[c][b][a], “All day long I have stretched out my hands to a disobedient and opposing people.”
translation:
  language: vi
  text: 'Còn về Israel, Ngài phán[a]: “Suốt ngày Ta đã dang tay hướng về dân không vâng lời[b] và chống đối[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Nhưng với Israel, Ngài phán.” Cấu trúc Hy Lạp có thể chỉ lời nói với Israel hoặc lời nói về Israel.'
    reason: alternative_reading
  - marker: b
    text: Từ Hy Lạp cũng có thể mang nghĩa “không tin” hoặc “không chịu nghe theo.”
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể dịch: “cãi lại,” “phản bác” hoặc “nói chống lại.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸς δὲ τὸν Ἰσραὴλ
  choice: Nhưng về Israel
  rationale: Cụm πρός với λέγει có thể nêu đối tượng được nói đến; cách dịch này tự nhiên trong tiếng Việt, còn khả năng hiểu là nói trực tiếp với Israel được giữ trong chú thích.
- source_word: λέγει
  choice: Ngài phán
  rationale: Giữ thì hiện tại của công thức trích dẫn. Chủ thể được ngữ cảnh hiểu là Đức Chúa Trời nhưng không được nêu trong câu Hy Lạp; đại từ tôn kính tiếng Việt truyền đạt chủ thể hàm ẩn mà không thêm danh xưng.
- source_word: Ὅλην τὴν ἡμέραν
  choice: Suốt ngày
  rationale: Cách nói tiếng Việt tự nhiên, diễn đạt đầy đủ khoảng thời gian kéo dài.
- source_word: ἐξεπέτασα τὰς χεῖράς μου
  choice: Ta đã dang tay ra
  rationale: Giữ hình ảnh nhân hình về hành động mời gọi hoặc khẩn thiết hướng đến dân; “dang tay ra” tự nhiên hơn lối dịch máy móc “trải các bàn tay”.
- source_word: πρὸς λαὸν
  choice: hướng về một dân
  rationale: Diễn đạt rõ hướng của cử chỉ dang tay và giữ λαός là một cộng đồng dân chúng.
- source_word: ἀπειθοῦντα
  choice: không vâng lời
  rationale: Thể hiện sự bất tuân và khước từ để được thuyết phục; sắc thái không tin được ghi trong chú thích.
- source_word: ἀντιλέγοντα
  choice: chống đối
  rationale: Bao quát hành động phản bác, nói ngược lại và tích cực chống lại, đồng thời tự nhiên trong tiếng Việt hiện đại.
theological_decisions:
- issue: Cách mô tả phản ứng của Israel trước Đức Chúa Trời
  choice: “không vâng lời và chống đối”
  alternative: “không tin và cãi lại”
  rationale: Giữ cả sự khước từ lẫn thái độ phản kháng tích cực, đồng thời không thu hẹp câu này thành một khẳng định giáo lý vượt quá lời trích dẫn của Phao-lô.
- issue: Chủ thể hàm ẩn của λέγει
  choice: “Ngài phán”
  alternative: “có lời phán” hoặc “Đức Chúa Trời phán”
  rationale: Ngữ cảnh lời trích dẫn cho thấy chủ thể là Đức Chúa Trời, nhưng bản Hy Lạp không nêu danh xưng tại đây. “Ngài” vừa tự nhiên vừa tránh bổ sung danh từ không có trong câu.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “Israel” theo dạng tên riêng phổ biến; “Ta/Ngài” phù hợp lời phán của Đức Chúa Trời. Các dấu chú thích đặt ngay sau thành phần liên quan trong chính văn.
