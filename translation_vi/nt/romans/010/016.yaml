id: ROM.10.16
reference: Romans 10:16
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀλλ’ οὐ πάντες ὑπήκουσαν τῷ εὐαγγελίῳ· Ἠσαΐας γὰρ λέγει· Κύριε, τίς ἐπίστευσεν τῇ ἀκοῇ ἡμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/016.yaml
  text: But not all obeyed the good news[a]. For Isaiah says, “Lord[b], who has believed our message?”
translation:
  language: vi
  text: 'Nhưng không phải tất cả đều vâng theo tin mừng[a]. Vì Ê-sai nói: “Lạy Chúa, ai đã tin sứ điệp của chúng tôi[b]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “Phúc Âm.”'
    reason: lexical_alternative
  - marker: b
    text: 'Hay: “lời rao truyền của chúng tôi”; sát nghĩa: “điều chúng tôi nghe.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: Nhưng
  rationale: Diễn đạt tự nhiên sự tương phản với lập luận ngay trước đó.
- source_word: οὐ πάντες
  choice: không phải tất cả
  rationale: Giữ đúng ý phủ định bộ phận của tiếng Hy Lạp, không biến thành sự khước từ hoàn toàn.
- source_word: ὑπήκουσαν
  choice: vâng theo
  rationale: Giữ nghĩa vâng lời, đáp ứng bằng sự thuận phục, chứ không thu hẹp thành chỉ nghe thấy.
- source_word: τῷ εὐαγγελίῳ
  choice: tin mừng
  rationale: Diễn đạt trực tiếp nghĩa của εὐαγγέλιον bằng tiếng Việt hiện đại; cách gọi truyền thống “Phúc Âm” được nêu trong chú thích.
- source_word: Ἠσαΐας
  choice: Ê-sai
  rationale: Dùng dạng tên vị tiên tri quen thuộc trong tiếng Việt.
- source_word: γὰρ
  choice: Vì
  rationale: Cho thấy lời trích dẫn Kinh Thánh làm căn cứ giải thích cho mệnh đề trước.
- source_word: λέγει
  choice: nói
  rationale: Giữ thì hiện tại của nguyên văn, phù hợp với cách Tân Ước dẫn Kinh Thánh như lời đang lên tiếng.
- source_word: Κύριε
  choice: Lạy Chúa
  rationale: “Lạy” thể hiện tự nhiên hô cách trang trọng trong tiếng Việt mà không thêm nội dung thần học.
- source_word: τίς ἐπίστευσεν
  choice: ai đã tin
  rationale: Câu hỏi tu từ được chuyển đạt ngắn gọn, tự nhiên, đồng thời giữ khía cạnh hoàn thành của động từ aorist.
- source_word: τῇ ἀκοῇ ἡμῶν
  choice: sứ điệp của chúng tôi
  rationale: Trong ngữ cảnh lời trích Ê-sai, ἀκοή chỉ điều được nghe, tức lời loan báo hay sứ điệp; chú thích bảo lưu những nét nghĩa khác.
theological_decisions:
- issue: Bản chất của sự đáp ứng đối với tin mừng trong ὑπήκουσαν τῷ εὐαγγελίῳ
  choice: vâng theo tin mừng
  alternative: nghe theo tin mừng; đón nhận tin mừng
  rationale: Động từ Hy Lạp mang nghĩa vâng lời. Cách dịch này giữ mối liên hệ trong lập luận của Phao-lô giữa đức tin và sự đáp ứng thuận phục, nhưng không áp đặt một hệ thống giáo phái về sự cứu rỗi.
- issue: Nghĩa của ἀκοή trong lời trích Ê-sai
  choice: sứ điệp
  alternative: lời rao truyền; điều nghe được
  rationale: Từ này có thể chỉ việc nghe hoặc nội dung được nghe. “Sứ điệp” tự nhiên nhất trong câu, còn chú thích giữ lại tính đa nghĩa của nguyên văn.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Cấu trúc “không phải tất cả” được giữ để bảo toàn phép phủ định bộ phận; “vâng theo” giữ sức nặng của động từ chỉ sự vâng lời. Dấu chú thích [b] được đặt ngay sau cụm từ mà chú thích giải thích.
