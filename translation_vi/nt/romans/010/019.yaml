id: ROM.10.19
reference: Romans 10:19
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀλλὰ λέγω, μὴ ⸂Ἰσραὴλ οὐκ ἔγνω⸃; πρῶτος Μωϋσῆς λέγει· Ἐγὼ παραζηλώσω ὑμᾶς ἐπ’ οὐκ ἔθνει, ἐπ’ ἔθνει ἀσυνέτῳ παροργιῶ ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/019.yaml
  text: But I ask[a], did Israel not know? First Moses says, “I will make you jealous by what is not a nation[b]; by a nation without understanding I will provoke you to anger.”
translation:
  language: vi
  text: 'Nhưng tôi hỏi: Chẳng lẽ Israel không biết[a] sao? Trước hết, Môi-se nói: “Ta sẽ dùng một dân không phải là dân[b] để khiến các ngươi ghen tức; Ta sẽ dùng một dân thiếu hiểu biết để chọc giận các ngươi.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “không hiểu.” Động từ Hy Lạp có thể chỉ việc biết hoặc hiểu; trong mạch văn này, nó có thể nói đến việc nắm được ý nghĩa của điều đã nghe.'
    reason: lexical_alternative
  - marker: b
    text: Trích Phục Truyền Luật Lệ Ký 32:21. “Một dân không phải là dân” có thể chỉ một cộng đồng bị xem là không phải dân thật, tức các dân ngoại.
    reason: cross_reference
lexical_decisions:
- source_word: μὴ Ἰσραὴλ οὐκ ἔγνω
  choice: Chẳng lẽ Israel không biết sao?
  rationale: Giữ nghĩa trực tiếp của ἔγνω là “biết” và diễn đạt tự nhiên sắc thái câu hỏi tu từ của kết cấu Hy Lạp; chú thích nêu khả năng hiểu là “hiểu.”
- source_word: πρῶτος
  choice: Trước hết
  rationale: Giữ chức năng trạng từ, giới thiệu Môi-se như chứng nhân đầu tiên trong chuỗi trích dẫn Kinh Thánh.
- source_word: Μωϋσῆς
  choice: Môi-se
  rationale: Dùng dạng tên riêng quen thuộc trong tiếng Việt.
- source_word: παραζηλώσω
  choice: khiến các ngươi ghen tức
  rationale: Diễn đạt tự nhiên ý gây nên lòng ghen tức, đồng thời giữ sắc thái tác động của động từ.
- source_word: ἐπ’ οὐκ ἔθνει
  choice: dùng một dân không phải là dân
  rationale: Giữ nghịch lý và sức nhấn tu từ của nguyên văn, không tự ý xác định dân ấy là ai.
- source_word: ἔθνει ἀσυνέτῳ
  choice: một dân thiếu hiểu biết
  rationale: Phản ánh sát nghĩa ἀσυνέτῳ là thiếu sự hiểu biết, tránh chuyển thành một phán đoán rộng hơn như “ngu dại.”
- source_word: παροργιῶ
  choice: chọc giận
  rationale: Cách nói tự nhiên trong tiếng Việt, giữ nghĩa gây cho người khác nổi giận.
- source_word: ὑμᾶς
  choice: các ngươi
  rationale: Thể hiện rõ số nhiều và phù hợp với văn phong trang trọng của lời Đức Chúa Trời được trích dẫn.
theological_decisions:
- issue: Đối tượng được gọi là “một dân không phải là dân” và “một dân thiếu hiểu biết”
  choice: Giữ nguyên cách nói của lời trích dẫn, không xác định đối tượng ngay trong chính văn.
  alternative: Giải thích trực tiếp là các dân ngoại hoặc một cộng đồng bị Israel xem là không phải dân thật.
  rationale: Phao-lô trích Phục Truyền Luật Lệ Ký 32:21; giữ cách diễn đạt nghịch lý bảo tồn độ mở và sức căng thần học của lời trích dẫn thay vì đưa cách giải nghĩa vào chính văn.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Chính văn dùng “Israel” theo dạng quốc tế thông dụng và “Môi-se” theo truyền thống tiếng Việt. Trong lời trích dẫn, “Ta/các ngươi” duy trì sắc thái Kinh Thánh trang nghiêm và làm rõ đại từ số nhiều.
