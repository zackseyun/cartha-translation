- from: 'Nhưng nếu không được sai đi, làm sao họ có thể rao giảng? Như có lời chép rằng: “Bàn chân của những người đem tin mừng về những điều tốt lành đẹp biết bao!”[a]'
  to: 'Vậy, nếu không được sai đi, làm sao họ có thể rao truyền? Như có chép rằng: “Bàn chân của những người đem tin mừng về những điều tốt lành đẹp biết bao!”[a]'
  rationale: Chỉnh nhẹ liên từ và động từ công bố để sát chức năng của tiếng Hy Lạp và tránh thu hẹp ý nghĩa vào hoạt động giảng đạo chính thức. Các thành tố còn lại, kể cả sự lặp ý giữa “tin mừng” và “những điều tốt lành”, được giữ lại để bảo tồn cách diễn đạt của nguyên văn.
  reviewer_model: gpt-5.6-terra
