  - severity: low
    issue: “Rao giảng” có thể gợi phạm vi hẹp hơn
    rationale: κηρύσσω là công bố/loan báo công khai. “Rao truyền” giữ nghĩa rộng hơn và hài hòa với hình ảnh các sứ giả trong câu trích dẫn.
