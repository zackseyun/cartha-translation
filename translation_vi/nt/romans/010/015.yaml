  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: πῶς δὲ ⸀κηρύξωσιν ἐὰν μὴ ἀποσταλῶσιν; ⸀καθὼς γέγραπται· Ὡς ὡραῖοι οἱ πόδες τῶν ⸀εὐαγγελιζομένων ⸀τὰ ἀγαθά.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/015.yaml
  text: And how are they to proclaim unless they are sent? As it is written[b][a], “How beautiful are the feet of those who bring good news of good things!”
translation:
  language: vi
  text: 'Vậy, nếu không được sai đi, làm sao họ có thể rao truyền? Như có chép rằng: “Bàn chân của những người đem tin mừng về những điều tốt lành đẹp biết bao!”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Đẹp” cũng có thể mang sắc thái “đáng mừng” hoặc “đến thật đúng lúc”; câu này ca ngợi sự xuất hiện đáng quý của người mang tin mừng.
    reason: lexical_alternative
lexical_decisions:
- source_word: κηρύξωσιν
  choice: rao giảng
  rationale: Diễn đạt hành động công khai loan báo sứ điệp; trong tiếng Việt, “rao giảng” tự nhiên trong văn cảnh này nhưng không nhất thiết giới hạn vào một bài giảng chính thức.
- source_word: ἀποσταλῶσιν
  choice: được sai đi
  rationale: Giữ thể bị động và ý nghĩa lệ thuộc vào một chủ thể sai phái, đồng thời là cách nói quen thuộc, trang trọng trong tiếng Việt.
- source_word: καθὼς γέγραπται
  choice: Như có lời chép rằng
  rationale: Công thức dẫn Kinh Thánh tự nhiên và trang trọng trong tiếng Việt.
- source_word: ὡραῖοι
  choice: đẹp biết bao
  rationale: Giữ nghĩa trực tiếp về vẻ đẹp/đáng quý và sắc thái cảm thán của ὡς; chú thích nêu thêm nét nghĩa về sự đáng mừng hoặc đúng lúc.
- source_word: πόδες
  choice: bàn chân
  rationale: Bảo tồn hình ảnh cụ thể của lời trích dẫn, chỉ sự xuất hiện và hành trình của các sứ giả.
- source_word: εὐαγγελιζομένων
  choice: những người đem tin mừng
  rationale: Phù hợp với hình ảnh sứ giả đến mang tin, tránh thu hẹp vào chức vụ giảng đạo chính thức.
- source_word: τὰ ἀγαθά
  choice: về những điều tốt lành
  rationale: Phản ánh danh từ hóa số nhiều “những điều tốt lành”, không đồng nhất hoàn toàn với chính động từ loan báo tin mừng.
theological_decisions:
- issue: Mối liên hệ giữa lời trích dẫn về sứ giả và việc rao truyền Tin Mừng
  choice: Giữ hình ảnh rộng về những người được sai đi và đem tin mừng, không giới hạn vào người giữ một chức vụ giáo hội chính thức.
  alternative: Dịch bằng thuật ngữ có thể chỉ riêng việc giảng đạo hoặc một chức vụ được phong nhiệm.
  rationale: Mạch lập luận nói đến việc được sai phái và công khai loan báo, còn lời trích dẫn tôn vinh sự xuất hiện của các sứ giả; bản dịch giữ cả hai phương diện mà không đưa thêm một mô hình chức vụ cụ thể.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Trật tự câu đầu giữ chuỗi lập luận của Phao-lô; lời trích dẫn bảo tồn hình ảnh “bàn chân” và sự lặp ý có chủ đích giữa “tin mừng” với “những điều tốt lành”.
