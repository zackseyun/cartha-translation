revisions:
- from: Vì tôi làm chứng về họ rằng họ có lòng sốt sắng đối với Đức Chúa Trời[a], nhưng không theo sự hiểu biết[b].
  to: Vì tôi làm chứng về họ rằng họ có lòng nhiệt thành đối với Đức Chúa Trời[a], nhưng không theo sự hiểu biết[b].
  rationale: Thay “lòng sốt sắng” bằng “lòng nhiệt thành” để có cách diễn đạt hiện đại, tự nhiên hơn mà vẫn giữ lực nghĩa của ζῆλος. Điều chỉnh chú thích a để phản ánh chính xác hơn tính đa nghĩa của sở hữu cách θεοῦ, trong khi vẫn giữ cách hiểu ngữ cảnh là nhiệt thành hướng về Đức Chúa Trời. Các phần còn lại được giữ vì trung thành với nguyên văn và bảo toàn độ mở của οὐ κατ’ ἐπίγνωσιν.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T10:25:59Z'
