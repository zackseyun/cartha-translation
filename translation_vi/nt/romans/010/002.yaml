  text: μαρτυρῶ γὰρ αὐτοῖς ὅτι ζῆλον θεοῦ ἔχουσιν· ἀλλ’ οὐ κατ’ ἐπίγνωσιν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/002.yaml
  text: For I testify about them that they have zeal for God[a], but not according to knowledge[b],
translation:
  language: vi
  text: Vì tôi làm chứng về họ rằng họ có lòng nhiệt thành đối với Đức Chúa Trời[a], nhưng không theo sự hiểu biết[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch sát hình thức: “lòng nhiệt thành của Đức Chúa Trời”; sở hữu cách tiếng Hy Lạp có thể được hiểu theo nhiều cách, nhưng trong ngữ cảnh này rất có thể chỉ lòng nhiệt thành hướng về Đức Chúa Trời.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “không với sự hiểu biết đầy đủ” hoặc “không dựa trên sự hiểu biết”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μαρτυρῶ
  choice: tôi làm chứng
  rationale: Giữ lực chứng nhận trực tiếp của động từ hiện tại ngôi thứ nhất, đồng thời tự nhiên và trang trọng trong tiếng Việt.
- source_word: γὰρ
  choice: Vì
  rationale: Giữ mối liên hệ giải thích với câu trước.
- source_word: αὐτοῖς
  choice: về họ
  rationale: Trong ngữ cảnh này, đại từ chỉ những người mà Phao-lô làm chứng về họ, chứ không phải người tiếp nhận lời chứng.
- source_word: ζῆλον θεοῦ
  choice: lòng sốt sắng đối với Đức Chúa Trời
  rationale: 'Hiểu θεοῦ như sở hữu cách khách thể: lòng sốt sắng hướng về Đức Chúa Trời; cách diễn đạt này tránh hàm ý đó là lòng sốt sắng của chính Đức Chúa Trời.'
- source_word: ἔχουσιν
  choice: họ có
  rationale: Cách tương đương trực tiếp, tự nhiên của động từ hiện tại.
- source_word: ἀλλ’
  choice: nhưng
  rationale: Thể hiện rõ sự tương phản giữa lòng sốt sắng và sự thiếu hiểu biết.
- source_word: οὐ κατ’ ἐπίγνωσιν
  choice: không theo sự hiểu biết
  rationale: Giữ tương đối sát cấu trúc κατά với đối cách và không tự ý xác định ἐπίγνωσις là sự hiểu biết 'đầy đủ' hay 'đúng đắn'.
theological_decisions:
- issue: Bản chất lòng sốt sắng của Y-sơ-ra-ên
  choice: Lòng sốt sắng của họ hướng về Đức Chúa Trời nhưng không theo sự hiểu biết.
  alternative: Họ có lòng sốt sắng của Đức Chúa Trời; hoặc họ có lòng nhiệt thành tôn giáo mà không nêu rõ đối tượng.
  rationale: 'Ngữ cảnh thuận cho việc hiểu θεοῦ là sở hữu cách khách thể. Bản dịch duy trì sự căng thẳng của câu: lòng chân thành được thừa nhận nhưng tính phù hợp với sự hiểu biết bị phủ nhận.'
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. “Lòng sốt sắng” truyền đạt sắc thái nhiệt thành tôn giáo tự nhiên hơn “nhiệt tâm”; “theo sự hiểu biết” cố ý giữ độ mở của nguyên ngữ.
