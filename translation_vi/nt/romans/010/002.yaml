  source_fidelity: 'Bản dịch phản ánh đúng cấu trúc và ý chính của nguyên văn: μαρτυρῶ γὰρ αὐτοῖς là “Vì tôi làm chứng về họ”, ζῆλον θεοῦ được hiểu hợp lý là lòng nhiệt thành hướng về Đức Chúa Trời, và οὐ κατ’ ἐπίγνωσιν được giữ ở mức khái quát, không diễn giải thành “hiểu biết đúng đắn” hay “đầy đủ”.'
