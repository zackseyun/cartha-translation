id: ROM.11.25
reference: Romans 11:25
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Οὐ γὰρ θέλω ὑμᾶς ἀγνοεῖν, ἀδελφοί, τὸ μυστήριον τοῦτο, ἵνα μὴ ⸀ἦτε ἑαυτοῖς φρόνιμοι, ὅτι πώρωσις ἀπὸ μέρους τῷ Ἰσραὴλ γέγονεν ἄχρι οὗ τὸ πλήρωμα τῶν ἐθνῶν εἰσέλθῃ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/025.yaml
  text: 'For I do not want you to be unaware[a], brothers, of this mystery, so that you may not be wise in your own sight: a partial hardening has come upon Israel until the fullness of the Gentiles has come in[b],'
translation:
  language: vi
  text: 'Thưa anh em,[a] tôi không muốn anh em không biết về huyền nhiệm này, để anh em khỏi tự cho mình là khôn ngoan: Y-sơ-ra-ên đã bị cứng lòng một phần, cho đến khi sự đầy trọn của các dân ngoại vào,[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “anh chị em”; từ Hy Lạp là “anh em” và có thể dùng để nói với một nhóm gồm cả nam lẫn nữ.
    reason: lexical_alternative
  - marker: b
    text: Hay “cho đến khi toàn bộ số người thuộc các dân ngoại vào.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἀγνοεῖν
  choice: không biết
  rationale: Trong công thức quen thuộc của Phao-lô, cụm này có nghĩa là không được thông tin hay không nhận biết; “không biết” tự nhiên trong tiếng Việt và không mang sắc thái miệt thị.
- source_word: ἀδελφοί
  choice: anh em
  rationale: Giữ cách xưng hô số nhiều giống đực của nguyên văn; trong tiếng Việt, “anh em” cũng thường có thể chỉ chung cộng đồng tín hữu. Chú thích làm rõ phạm vi có thể gồm cả nữ giới.
- source_word: μυστήριον
  choice: huyền nhiệm
  rationale: Chỉ ý định của Đức Chúa Trời từng được che giấu nhưng nay được bày tỏ; “huyền nhiệm” giữ được sắc thái thần học mà không gợi một bí mật riêng tư.
- source_word: ἵνα μὴ ἦτε ἑαυτοῖς φρόνιμοι
  choice: để anh em khỏi tự cho mình là khôn ngoan
  rationale: Diễn đạt tự nhiên lời cảnh báo đừng khôn ngoan theo sự đánh giá của chính mình, tức đừng tự phụ, nhưng không diễn giải quá mức.
- source_word: πώρωσις
  choice: trở nên cứng lòng
  rationale: Diễn đạt tình trạng chai lì hay không nhạy bén về mặt thuộc linh bằng thành ngữ Việt ngữ rõ ràng và quen thuộc.
- source_word: ἀπὸ μέρους
  choice: một phần dân Y-sơ-ra-ên
  rationale: Gắn phạm vi “một phần” với Y-sơ-ra-ên, phù hợp cách hiểu rằng sự cứng lòng không bao trùm toàn thể dân này; tránh khiến người đọc tưởng đó là mức độ cứng lòng chưa hoàn toàn.
- source_word: τῷ Ἰσραήλ
  choice: dân Y-sơ-ra-ên
  rationale: “Dân Y-sơ-ra-ên” làm rõ đây là cộng đồng dân tộc trong thế đối chiếu với các dân ngoại.
- source_word: γέγονεν
  choice: đã trở nên
  rationale: Thể hoàn thành Hy Lạp nói đến một tình trạng hiện hữu do điều đã xảy ra; “đã trở nên” giữ cả sự phát sinh lẫn kết quả còn tiếp diễn.
- source_word: πλήρωμα
  choice: sự đầy trọn
  rationale: Giữ tính mở của từ Hy Lạp, vốn có thể chỉ sự đầy đủ, tổng số đầy đủ hoặc sự hoàn tất, thay vì quyết định sẵn một cách hiểu.
- source_word: τῶν ἐθνῶν
  choice: các dân ngoại
  rationale: Trong ngữ cảnh đối chiếu với Y-sơ-ra-ên, cụm này chỉ những người không thuộc dân Do Thái; “các dân ngoại” truyền đạt rõ sự đối chiếu ấy.
- source_word: εἰσέλθῃ
  choice: đã vào
  rationale: Sau “cho đến khi,” cách dịch này đánh dấu điểm kết thúc của tình trạng được nói đến, đồng thời giữ nguyên việc nguyên văn không nêu rõ họ vào đâu.
theological_decisions:
- issue: Ý nghĩa của “sự đầy trọn của các dân ngoại”
  choice: Giữ “sự đầy trọn của các dân ngoại” trong chính văn, không xác định đó là tổng số đầy đủ, sự gia nhập trọn vẹn hay sự hoàn tất thời kỳ cánh chung.
  alternative: toàn bộ số người thuộc các dân ngoại
  rationale: Cụm từ có nhiều cách hiểu thần học. Bản dịch giữ sự mơ hồ thực sự của nguyên văn; chú thích nêu một cách hiểu thông dụng mà không nâng nó thành chính văn.
- issue: Phạm vi của ἀδελφοί
  choice: Dịch là “anh em” trong chính văn.
  alternative: anh chị em
  rationale: Nguyên văn dùng danh từ giống đực số nhiều, nhưng lời xưng hô có thể hướng đến một cộng đồng gồm cả nam lẫn nữ. Chú thích bảo toàn nghĩa bao hàm này.
- issue: Phạm vi của sự cứng lòng
  choice: Dịch “một phần dân Y-sơ-ra-ên đã trở nên cứng lòng.”
  alternative: sự cứng lòng một phần đã xảy đến với dân Y-sơ-ra-ên
  rationale: ἀπὸ μέρους tự nhiên giới hạn phạm vi trong Y-sơ-ra-ên. Cách dịch không tuyên bố cá nhân nào thuộc phần ấy và không biến giới hạn phạm vi thành giới hạn về mức độ hay thời gian.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “huyền nhiệm” để giữ sắc thái thần học của μυστήριον; giữ động từ “vào” không bổ sung một đích đến mà nguyên văn không nói rõ. Dấu phẩy cuối câu phản ánh câu Hy Lạp tiếp tục sang câu kế.
