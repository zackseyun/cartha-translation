- from: 'Vì thưa anh em,[a] tôi không muốn anh em không biết huyền nhiệm này, để anh em khỏi tự cho mình là khôn ngoan: một phần dân Y-sơ-ra-ên đã trở nên cứng lòng, cho đến khi sự đầy trọn của các dân ngoại đã vào,[b]'
  to: 'Thưa anh em,[a] tôi không muốn anh em không biết về huyền nhiệm này, để anh em khỏi tự cho mình là khôn ngoan: Y-sơ-ra-ên đã bị cứng lòng một phần, cho đến khi sự đầy trọn của các dân ngoại vào,[b]'
