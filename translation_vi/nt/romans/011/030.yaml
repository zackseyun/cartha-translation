id: ROM.11.30
reference: Romans 11:30
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὥσπερ ⸀γὰρ ὑμεῖς ποτε ἠπειθήσατε τῷ θεῷ, νῦν δὲ ἠλεήθητε τῇ τούτων ἀπειθείᾳ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/030.yaml
  text: For just as you once were disobedient to God[a], but now have received mercy because of their disobedience,
translation:
  language: vi
  text: Vì cũng như trước kia anh chị em đã không vâng phục Đức Chúa Trời,[a] nhưng nay đã nhận được lòng thương xót vì sự không vâng phục của họ,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch “đã không tin Đức Chúa Trời” và “sự không tin của họ”; các từ Hy Lạp ở đây có thể mang cả nghĩa không tin lẫn không vâng phục.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥσπερ γὰρ
  choice: Vì như
  rationale: Giữ cả sắc thái giải thích của γάρ và ý so sánh của ὥσπερ, đồng thời nối tự nhiên với lập luận xung quanh.
- source_word: ὑμεῖς
  choice: anh chị em
  rationale: Diễn đạt đại từ ngôi thứ hai số nhiều bằng lối xưng hô tự nhiên, trang trọng và bao quát trong tiếng Việt, không thêm rõ đối tượng là dân ngoại vào chính câu.
- source_word: ποτε
  choice: trước kia
  rationale: Thể hiện rõ thời điểm quá khứ và sự tương phản với νῦν, “nay”.
- source_word: ἠπειθήσατε
  choice: đã không vâng phục
  rationale: ἀπειθέω có thể bao hàm cả không tin và không vâng phục; cách dịch này giữ khía cạnh đạo đức–quan hệ đối với Đức Chúa Trời và tương ứng với danh từ ἀπείθεια ở cuối câu.
- source_word: τῷ θεῷ
  choice: Đức Chúa Trời
  rationale: Bổ ngữ gián tiếp của ἀπειθέω được diễn đạt tự nhiên trong cấu trúc “không vâng phục Đức Chúa Trời”.
- source_word: νῦν δὲ
  choice: nhưng nay
  rationale: Giữ sự tương phản mạnh giữa tình trạng trước kia và việc nhận lòng thương xót hiện nay.
- source_word: ἠλεήθητε
  choice: đã nhận được lòng thương xót
  rationale: Diễn đạt tự nhiên thể bị động của ἐλεάω, giữ trọng tâm nơi lòng thương xót được ban cho người nghe.
- source_word: τῇ τούτων ἀπειθείᾳ
  choice: vì sự không vâng phục của họ
  rationale: Dative có thể mang nghĩa nguyên nhân hoặc phương tiện; “vì” truyền đạt rõ quan hệ này mà không xác định quá mức cơ chế. “Họ” chỉ những người đang không vâng phục trong văn mạch.
theological_decisions:
- issue: Sắc thái của ἀπειθέω / ἀπείθεια trong văn mạch cứu rỗi của Phao-lô
  choice: không vâng phục
  alternative: không tin
  rationale: Các từ Hy Lạp có thể bao hàm cả hai ý. “Không vâng phục” giữ được mối liên hệ từ vựng giữa động từ và danh từ trong câu, đồng thời không thu hẹp ngôn ngữ của Phao-lô thành một phạm trù chỉ thuộc nhận thức. Chú thích bảo tồn sắc thái “không tin” có thật trong nguyên ngữ.
- issue: Quan hệ được biểu thị bởi τῇ τούτων ἀπειθείᾳ
  choice: vì sự không vâng phục của họ
  alternative: qua sự không vâng phục của họ
  rationale: Dative cho phép cách hiểu theo nguyên nhân hoặc phương tiện. “Vì” rõ và tự nhiên trong tiếng Việt, nhưng không nên suy diễn rằng chính sự không vâng phục tự nó là tác nhân ban lòng thương xót.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh chị em” để biểu thị số nhiều của ὑμεῖς; giữ cấu trúc câu chưa khép lại bằng dấu phẩy vì câu Hy Lạp tiếp tục sang câu kế tiếp. Thuật ngữ “lòng thương xót” giữ sắc thái thần học quen thuộc mà vẫn tự nhiên.
