  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ Δαυὶδ λέγει· Γενηθήτω ἡ τράπεζα αὐτῶν εἰς παγίδα καὶ εἰς θήραν καὶ εἰς σκάνδαλον καὶ εἰς ἀνταπόδομα αὐτοῖς,
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/009.yaml
  text: And David says[b][a], “Let their table become a snare and a trap and a stumbling block and a retribution to them,”
translation:
  language: vi
  text: 'Và Đa-vít nói: “Nguyện bàn ăn của họ trở thành cái bẫy, cái rập, vật gây vấp ngã và sự báo trả cho họ.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Δαυὶδ
  choice: Đa-vít
  rationale: Dùng dạng phiên âm Kinh Thánh quen thuộc trong tiếng Việt hiện đại.
- source_word: λέγει
  choice: nói
  rationale: Giữ thì hiện tại văn chương khi giới thiệu lời trích dẫn.
- source_word: Γενηθήτω
  choice: Nguyện cho ... trở thành
  rationale: Diễn đạt tự nhiên lực cầu khiến/nguyện ước của mệnh lệnh cách aorist, không biến thành lời dự báo đơn thuần.
- source_word: τράπεζα
  choice: bàn ăn
  rationale: Giữ hình ảnh cụ thể của chiếc bàn, đồng thời tự nhiên hơn 'cái bàn' trong ngữ cảnh ăn uống và yến tiệc.
- source_word: παγίδα
  choice: cái bẫy
  rationale: Chỉ phương tiện gài bắt, đồng thời phân biệt tương đối với thuật ngữ săn bắt kế tiếp.
- source_word: θήραν
  choice: lưới săn
  rationale: Thuật ngữ có liên hệ đến việc săn bắt; 'lưới săn' giữ sắc thái ấy và tránh lặp nguyên từ 'bẫy', dù hai từ gần nghĩa trong ngữ cảnh.
- source_word: σκάνδαλον
  choice: vật làm họ vấp ngã
  rationale: Giữ ẩn dụ về điều gây sa ngã hay sụp đổ, thay vì thu hẹp thành sự xúc phạm chủ quan.
- source_word: ἀνταπόδομα
  choice: sự báo trả
  rationale: Diễn đạt sự đền đáp tương xứng trong ngữ cảnh phán xét, nhưng không thêm đối tượng hay tác nhân không có trong nguyên văn.
- source_word: αὐτοῖς
  choice: dành cho họ
  rationale: Thể hiện hướng quy về họ của sự báo trả bằng cách nói tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Lời nguyền/cầu phán xét trích từ Thi Thiên 69:22
  choice: 'Giữ trực tiếp sắc thái nguyện cầu: “Nguyện cho ... trở thành”.'
  alternative: “Bàn ăn của họ sẽ trở thành ...” hoặc “Hãy để ... trở thành ...”.
  rationale: Nguyên văn dùng mệnh lệnh cách mang lực nguyện ước/cầu khiến; bản dịch không làm nhẹ thành một lời tiên báo, cũng không khiến câu tiếng Việt nghe như đang cho phép.
translation_notes:
  register: Văn phong trang trọng, rõ ràng và hiện đại. Giữ chuỗi bốn hình ảnh/hậu quả của nguyên văn; không thêm chú thích vì các lựa chọn có thể được truyền đạt đủ rõ trong chính văn.
