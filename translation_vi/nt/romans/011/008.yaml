  terminology: “Đức Chúa Trời” nhất quán với bản thảo. “Thần trí mê muội” bảo toàn trường nghĩa của πνεῦμα và κατάνυξις tốt hơn “tâm trí mê muội”; chú thích nêu phương án “thần trí ngủ mê” gắn với tiếng vọng Ê-sai 29:10 mà không đồng nhất các từ ngữ.
  issues:
