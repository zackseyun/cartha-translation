id: ROM.11.8
reference: Romans 11:8
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸀καθὼς γέγραπται· Ἔδωκεν αὐτοῖς ὁ θεὸς πνεῦμα κατανύξεως, ὀφθαλμοὺς τοῦ μὴ βλέπειν καὶ ὦτα τοῦ μὴ ἀκούειν, ἕως τῆς σήμερον ἡμέρας.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/008.yaml
  text: 'just as it is written: “God gave them a spirit of stupor[a], eyes not to see and ears not to hear, until this very day.”'
translation:
  language: vi
  text: 'Đúng như lời đã chép: “Đức Chúa Trời đã ban cho họ một thần trí mê muội[a], mắt không thấy, tai không nghe, cho đến ngày nay.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “một thần trí ngủ mê.” Cụm từ này gợi lại Ê-sai 29:10; tuy nhiên, từ Hy Lạp dùng ở đây chỉ sự đờ đẫn, tê liệt hoặc mê muội.'
    reason: alternative_reading
lexical_decisions:
- source_word: καθὼς γέγραπται
  choice: đúng như lời đã chép
  rationale: Công thức dẫn Kinh Thánh quen thuộc; “đúng như” thể hiện rõ καθὼς, còn “lời đã chép” giữ sắc thái trang trọng và tự nhiên.
- source_word: Ἔδωκεν αὐτοῖς ὁ θεὸς
  choice: Đức Chúa Trời đã ban cho họ
  rationale: Giữ nguyên Đức Chúa Trời là chủ thể trực tiếp của động từ aorist ἔδωκεν, không chuyển thành ý chỉ cho phép.
- source_word: πνεῦμα κατανύξεως
  choice: tâm trí mê muội
  rationale: Trong ngữ cảnh này, πνεῦμα chỉ trạng thái hoặc khuynh hướng nội tâm; κατανύξεως diễn tả sự đờ đẫn, mất khả năng nhận biết. Cách dịch này tự nhiên trong tiếng Việt mà vẫn giữ ý phán xét khiến con người trở nên vô cảm về tâm linh.
- source_word: ὀφθαλμοὺς τοῦ μὴ βλέπειν
  choice: mắt mà không thấy
  rationale: Diễn đạt gọn kết cấu τοῦ μή với động từ nguyên mẫu, bảo toàn nhịp song song và sắc thái trích dẫn Kinh Thánh mà không gượng ép theo cú pháp Hy Lạp.
- source_word: ὦτα τοῦ μὴ ἀκούειν
  choice: tai mà không nghe
  rationale: Giữ cấu trúc song song với vế trước và nghĩa căn bản của ἀκούω là nghe.
- source_word: ἕως τῆς σήμερον ἡμέρας
  choice: cho đến chính ngày nay
  rationale: “Chính” phản ánh sắc thái nhấn mạnh của thành ngữ Hy Lạp và nối lời trích dẫn với thời điểm hiện tại của Phao-lô.
theological_decisions:
- issue: Tác động trực tiếp của Đức Chúa Trời trong sự mê muội như một hình thức phán xét
  choice: Đức Chúa Trời đã ban cho họ tâm trí mê muội
  alternative: Đức Chúa Trời đã để cho họ trở nên mê muội
  rationale: Bản Hy Lạp nêu rõ Đức Chúa Trời là chủ thể của ἔδωκεν. Bản dịch giữ nguyên sức căng thần học này, không làm nhẹ thành sự cho phép đơn thuần và cũng không xây dựng thêm một hệ thống giáo lý ngoài câu văn.
- issue: Nghĩa của πνεῦμα trong cụm πνεῦμα κατανύξεως
  choice: tâm trí mê muội
  alternative: thần khí mê muội; tinh thần mê muội; trạng thái ngủ mê
  rationale: Ở đây πνεῦμα có thể chỉ trạng thái nội tâm hơn là một hữu thể thần linh. “Tâm trí” truyền đạt rõ nghĩa ấy cho độc giả hiện đại, nhưng chú thích vẫn bảo lưu hình ảnh “ngủ mê” từ nền Cựu Ước và phạm vi nghĩa của κατανύξεως.
translation_notes:
  register: Văn phong trang trọng, sáng rõ và phù hợp với công thức trích dẫn Kinh Thánh. Cấu trúc “mắt mà không thấy, tai mà không nghe” tự nhiên trong tiếng Việt hiện đại, đồng thời giữ được tính cô đọng và phép song đối của nguyên văn.
