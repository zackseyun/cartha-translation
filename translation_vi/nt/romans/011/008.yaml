    rationale: πνεῦμα trong cụm πνεῦμα κατανύξεως là “spirit” theo lối diễn đạt Kinh Thánh, chỉ trạng thái/tinh thần mê muội. “Tâm trí” chỉ nêu một phần nghĩa và làm mờ hình ảnh của nguyên văn.
  - severity: low
