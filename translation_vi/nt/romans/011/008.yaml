  source_fidelity: 'Cần sửa “tâm trí mê muội”: πνεῦμα κατανύξεως được diễn đạt trực tiếp hơn là “một thần trí mê muội”, vừa giữ hình ảnh “spirit” của nguyên văn vừa không khẳng định đây là một hữu thể riêng biệt. Các vế “mắt ... không thấy, tai ... không nghe” và tác động trực tiếp của Đức Chúa Trời đều phù hợp với tiếng Hy Lạp.'
