id: ROM.11.27
reference: Romans 11:27
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ αὕτη αὐτοῖς ἡ παρ’ ἐμοῦ διαθήκη, ὅταν ἀφέλωμαι τὰς ἁμαρτίας αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/027.yaml
  text: And this will be my covenant with them[a], when I take away their sins.
translation:
  language: vi
  text: Và đây sẽ là giao ước của Ta với họ[a], khi Ta cất bỏ tội lỗi của họ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát hơn: “giao ước từ Ta dành cho họ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: διαθήκη
  choice: giao ước
  rationale: Trong ngữ cảnh Phao-lô trích dẫn lời hứa tiên tri, từ này chỉ giao ước do Đức Chúa Trời thiết lập, chứ không phải di chúc hay một thỏa thuận thông thường.
- source_word: ἡ παρ’ ἐμοῦ διαθήκη
  choice: giao ước của Ta
  rationale: Cụm Hy Lạp nhấn mạnh giao ước xuất phát từ Đức Chúa Trời; “giao ước của Ta” tự nhiên trong tiếng Việt và vẫn giữ ý nguồn gốc thần thượng, còn cách dịch sát hơn được ghi ở chú thích.
- source_word: αὐτοῖς
  choice: với họ
  rationale: Dù hình thức cách có thể là “cho họ/đối với họ”, tiếng Việt tự nhiên nói lập hoặc có giao ước “với” một bên.
- source_word: ὅταν
  choice: khi
  rationale: Ở đây từ này dẫn vào thời điểm lời hứa tiên tri được thực hiện, không mô tả những lần lặp lại bất định.
- source_word: ἀφέλωμαι
  choice: Ta cất bỏ
  rationale: Động từ diễn tả việc loại bỏ tội lỗi; “cất bỏ” vừa rõ nghĩa vừa giữ sắc thái Kinh Thánh trang trọng mà vẫn dễ hiểu.
- source_word: τὰς ἁμαρτίας αὐτῶν
  choice: tội lỗi của họ
  rationale: Cách dịch trực tiếp, tự nhiên, giữ nguyên nội dung luân lý và thần học của danh từ số nhiều trong nguyên văn.
- source_word: καὶ αὕτη
  choice: Và đây sẽ là
  rationale: Nguyên văn tỉnh lược động từ; bổ sung “sẽ là” phù hợp với ngữ cảnh lời hứa hướng tới tương lai mà không ấn định thời điểm.
theological_decisions:
- issue: Bản chất của διαθήκη trong lời trích dẫn tiên tri
  choice: giao ước
  alternative: di chúc
  rationale: “Giao ước” bảo toàn bối cảnh lời hứa cứu chuộc của Đức Chúa Trời và mối liên hệ với Cựu Ước, không đưa vào nghĩa pháp lý về di chúc.
- issue: Sắc thái thời gian của ὅταν ἀφέλωμαι
  choice: khi Ta cất bỏ tội lỗi của họ
  alternative: mỗi khi Ta cất bỏ tội lỗi của họ
  rationale: Mạch văn trình bày một lời hứa chắc chắn trong lịch sử cứu chuộc, không phải một điều xảy ra lặp đi lặp lại.
- issue: Quan hệ được diễn tả bởi παρ’ ἐμοῦ và αὐτοῖς
  choice: giao ước của Ta với họ
  alternative: giao ước từ Ta đến với họ
  rationale: Bản dịch chính dùng lối nói tiếng Việt tự nhiên nhưng không phủ nhận sắc thái giao ước phát xuất từ Đức Chúa Trời; sắc thái ấy được bảo tồn trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “Ta” phản ánh lời phán trực tiếp của Đức Chúa Trời trong lời trích dẫn. “Cất bỏ” giữ sắc thái Kinh Thánh nhưng vẫn thông dụng; dấu chú thích [a] được đặt ngay sau cụm liên quan.
