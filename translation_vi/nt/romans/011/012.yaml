id: ROM.11.12
reference: Romans 11:12
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εἰ δὲ τὸ παράπτωμα αὐτῶν πλοῦτος κόσμου καὶ τὸ ἥττημα αὐτῶν πλοῦτος ἐθνῶν, πόσῳ μᾶλλον τὸ πλήρωμα αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/012.yaml
  text: If their trespass means riches for the world[a], and their loss means riches for the Gentiles[b], how much more will their fullness mean?
translation:
  language: vi
  text: Nếu sự vi phạm của họ đem lại sự giàu có cho thế gian, và sự suy giảm của họ[a] đem lại sự giàu có cho các dân ngoại, thì sự đầy trọn của họ[b] còn đem lại nhiều hơn biết bao!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “sự thất bại” hoặc “sự hao hụt của họ”.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể hiểu là “đủ số người của họ”, “việc họ được tiếp nhận đầy đủ” hoặc “sự phục hồi trọn vẹn của họ”.
    reason: alternative_reading
lexical_decisions:
- source_word: παράπτωμα
  choice: sự vi phạm
  rationale: Giữ sắc thái đạo đức của một bước sai, hành vi phạm lỗi hay sự xúc phạm, đồng thời tự nhiên hơn trong tiếng Việt hiện đại so với cách dịch quá sát như “sự sa chân”.
- source_word: πλοῦτος
  choice: sự giàu có
  rationale: Giữ nguyên ẩn dụ về sự giàu có, ở đây chỉ sự dồi dào của lợi ích hay phước lành chứ không nhất thiết là của cải vật chất.
- source_word: κόσμου
  choice: thế gian
  rationale: Diễn đạt phạm vi rộng của κόσμος và phù hợp với sự đối chiếu giữa Israel với phần còn lại của nhân loại trong văn cảnh.
- source_word: ἥττημα
  choice: sự suy giảm
  rationale: Từ Hy Lạp hiếm này có thể chỉ sự thua kém, thất bại, mất mát hoặc suy giảm. “Sự suy giảm” giữ được khả năng nói đến mức độ hay số lượng mà không loại bỏ sắc thái thất bại.
- source_word: ἐθνῶν
  choice: các dân ngoại
  rationale: Trong Rô-ma, từ này thường chỉ những người không thuộc Israel; “các dân ngoại” làm rõ sự đối chiếu Do Thái–dân ngoại hơn “các dân tộc”.
- source_word: πόσῳ μᾶλλον
  choice: còn… nhiều hơn biết bao
  rationale: Thể hiện tự nhiên lập luận từ điều nhỏ đến điều lớn của thành ngữ Hy Lạp.
- source_word: πλήρωμα
  choice: sự đầy trọn
  rationale: Giữ độ rộng nghĩa của từ Hy Lạp, có thể gợi đến số lượng đầy đủ, sự tham dự trọn vẹn hoặc tình trạng được phục hồi, mà không quyết định thay cho nguyên văn.
theological_decisions:
- issue: Ý nghĩa và sở chỉ của τὸ πλήρωμα αὐτῶν
  choice: sự đầy trọn của họ
  alternative: đủ số người của họ; việc họ được tiếp nhận đầy đủ; sự phục hồi trọn vẹn của họ
  rationale: Cách nói của Phao-lô cô đọng và có chủ ý mở. Bản dịch chính không xác định đây chỉ là số lượng, sự tiếp nhận hay sự phục hồi cánh chung, nhờ đó bảo toàn sự căng thẳng thần học trong nguyên văn.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại. Cấu trúc “đem lại” làm sáng tỏ quan hệ hàm ý trong các mệnh đề danh từ Hy Lạp; câu cuối vẫn giữ nét tỉnh lược bằng cách không thêm một đối tượng cụ thể cho điều mà “sự đầy trọn” sẽ đem lại. Các dấu chú thích được đặt ngay sau những cụm từ mà chúng giải thích.
