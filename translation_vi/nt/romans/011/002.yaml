  to: Đức Chúa Trời không từ bỏ dân Ngài, là dân mà Ngài đã biết trước.[a] Hay anh em không biết Kinh Thánh nói gì trong đoạn về Ê-li[b], về việc ông thưa với Đức Chúa Trời chống lại Israel sao?[c]
