id: ROM.11.2
reference: Romans 11:2
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οὐκ ἀπώσατο ὁ θεὸς τὸν λαὸν αὐτοῦ ὃν προέγνω. ἢ οὐκ οἴδατε ἐν Ἠλίᾳ τί λέγει ἡ γραφή, ὡς ἐντυγχάνει τῷ θεῷ κατὰ τοῦ ⸀Ἰσραήλ;
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/002.yaml
  text: God has not rejected his people[a], whom he foreknew. Or do you not know what the Scripture says in the passage about Elijah[c][b], how he appeals to God against Israel?
translation:
  language: vi
  text: Đức Chúa Trời không từ bỏ dân Ngài, là dân mà Ngài đã biết trước.[a] Hay anh em không biết Kinh Thánh nói gì trong đoạn về Ê-li[b], về việc ông thưa với Đức Chúa Trời chống lại Israel sao?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Đã biết trước” cũng có thể dịch là “đã biết từ trước.” Có người hiểu từ này theo nghĩa mạnh hơn là “đã chọn từ trước,” nhưng bản Hy Lạp dùng động từ “biết trước.”
    reason: alternative_reading
  - marker: b
    text: 'Nguyên văn Hy Lạp: “trong Ê-li,” một thành ngữ có nghĩa là “trong đoạn Kinh Thánh nói về Ê-li.”'
    reason: lexical_alternative
  - marker: c
    text: 'Hay: “ông thưa kiện Israel trước Đức Chúa Trời.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπώσατο
  choice: không từ bỏ
  rationale: Động từ ἀπωθέομαι ở đây có nghĩa là khước từ hoặc gạt bỏ. “Không từ bỏ” là cách nói tự nhiên, rõ ràng trong tiếng Việt và phù hợp với lời phủ định rằng Đức Chúa Trời đã đoạn tuyệt với dân Ngài.
- source_word: τὸν λαὸν αὐτοῦ
  choice: dân Ngài
  rationale: λαός thường chỉ một dân tộc, đặc biệt là dân giao ước. “Dân Ngài” giữ được sắc thái thuộc về Đức Chúa Trời mà không thêm tên Israel vào mệnh đề đầu.
- source_word: ὃν προέγνω
  choice: là dân mà Ngài đã biết trước
  rationale: προγινώσκω theo nghĩa trực tiếp là “biết trước.” Cách dịch này giữ nguyên cách diễn đạt của bản Hy Lạp và không đưa cách hiểu mạnh hơn là “chọn trước” vào chính văn.
- source_word: ἢ οὐκ οἴδατε
  choice: Hay anh em không biết ... sao?
  rationale: Cấu trúc này mở đầu một câu hỏi tu từ. Cách diễn đạt với “sao?” tự nhiên trong tiếng Việt hiện đại và vẫn giữ sắc thái chất vấn của Phao-lô.
- source_word: ἐν Ἠλίᾳ
  choice: trong đoạn về Ê-li
  rationale: Cụm từ Hy Lạp theo nghĩa đen là “trong Ê-li,” nhưng đây là thành ngữ chỉ phần Kinh Thánh nói về Ê-li. Dịch rõ nghĩa giúp độc giả hiện đại hiểu đúng mà vẫn ghi nhận nguyên văn trong chú thích.
- source_word: ἡ γραφή
  choice: Kinh Thánh
  rationale: Trong cách dùng của Phao-lô, γραφή chỉ trước tác thánh có thẩm quyền. “Kinh Thánh” là cách gọi tự nhiên và trang trọng trong tiếng Việt.
- source_word: ὡς ἐντυγχάνει τῷ θεῷ
  choice: ông kêu cầu Đức Chúa Trời ... thế nào
  rationale: ἐντυγχάνω có thể chỉ việc thỉnh cầu, khẩn nài hoặc trình bày một vụ việc. “Kêu cầu” giữ được ý hướng lời thỉnh nguyện đến Đức Chúa Trời mà không gợi nghĩa tích cực của việc cầu thay, vốn không phù hợp với cụm “chống lại Israel.”
- source_word: κατὰ τοῦ Ἰσραήλ
  choice: chống lại Israel
  rationale: κατά đi với sở hữu cách mang nghĩa đối nghịch là “chống lại.” Tên riêng Israel được giữ nguyên.
theological_decisions:
- issue: Ý nghĩa của προέγνω trong mối liên hệ với sự tuyển chọn của Đức Chúa Trời
  choice: đã biết trước
  alternative: đã biết từ trước; đã yêu từ trước; đã chọn từ trước
  rationale: Câu này liên quan đến cuộc thảo luận thần học rộng hơn về sự tuyển chọn, nhưng riêng động từ Hy Lạp không buộc bản dịch phải giải quyết cuộc tranh luận ấy. “Đã biết trước” giữ được dữ liệu từ vựng và sự căng thẳng thần học của nguyên văn.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Đại từ “anh em” giữ cách Phao-lô trực tiếp nói với cộng đồng. Câu hỏi tu từ được sắp xếp lại vừa đủ để tự nhiên trong tiếng Việt, trong khi vẫn giữ nội dung và tính chất chưa phân định hoàn toàn của προέγνω và ἐντυγχάνει.
