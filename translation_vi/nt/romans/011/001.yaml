id: ROM.11.1
reference: Romans 11:1
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Λέγω οὖν, μὴ ἀπώσατο ὁ θεὸς τὸν λαὸν αὐτοῦ; μὴ γένοιτο· καὶ γὰρ ἐγὼ Ἰσραηλίτης εἰμί, ἐκ σπέρματος Ἀβραάμ, φυλῆς Βενιαμίν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/001.yaml
  text: So I ask[a], has God rejected his people? May it never be! For I myself am an Israelite, from the offspring of Abraham[c][b], of the tribe of Benjamin.
translation:
  language: vi
  text: 'Vậy tôi hỏi: Chẳng lẽ Đức Chúa Trời đã từ bỏ dân Ngài sao?[a] Tuyệt đối không![b] Vì chính tôi là người Y-sơ-ra-ên, thuộc dòng dõi Áp-ra-ham,[c] thuộc bộ tộc Bên-gia-min.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đã gạt bỏ dân Ngài sao?”'
    reason: lexical_alternative
  - marker: b
    text: 'Tiếng Hy Lạp dùng một lời bác bỏ rất mạnh; cũng có thể dịch: “Không bao giờ!”'
    reason: lexical_alternative
  - marker: c
    text: 'Dịch sát: “từ hạt giống của Áp-ra-ham”, nghĩa là thuộc dòng dõi Áp-ra-ham.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Λέγω οὖν
  choice: Vậy tôi hỏi
  rationale: Diễn đạt tự nhiên việc Phao-lô nêu câu hỏi tu từ, đồng thời giữ lực suy luận của οὖν.
- source_word: μὴ ἀπώσατο
  choice: Chẳng lẽ ... đã từ bỏ ... sao?
  rationale: Cấu trúc μή dự kiến câu trả lời phủ định; ἀπωθέομαι chỉ sự gạt bỏ hay khước từ. Cách dịch này giữ rõ tính tu từ mà không thêm ý 'hoàn toàn' hay 'mãi mãi'.
- source_word: ὁ θεὸς
  choice: Đức Chúa Trời
  rationale: Cách gọi trang trọng, quen thuộc và rõ nghĩa trong tiếng Việt.
- source_word: τὸν λαὸν αὐτοῦ
  choice: dân Ngài
  rationale: Giữ danh từ λαός và quan hệ sở hữu, không diễn giải thêm phạm vi thần học.
- source_word: μὴ γένοιτο
  choice: Tuyệt đối không!
  rationale: Truyền đạt lời bác bỏ rất mạnh trong cách nói tự nhiên của tiếng Việt hiện đại.
- source_word: καὶ γὰρ ἐγὼ
  choice: Vì chính tôi cũng
  rationale: γάρ nêu lý do; καί cùng đại từ ἐγώ được nhấn mạnh cho thấy chính Phao-lô là một bằng chứng.
- source_word: Ἰσραηλίτης
  choice: người Y-sơ-ra-ên
  rationale: Diễn đạt căn tính dân tộc và giao ước bằng cách gọi quen thuộc trong văn phong Kinh Thánh tiếng Việt.
- source_word: ἐκ σπέρματος Ἀβραάμ
  choice: thuộc dòng dõi Áp-ra-ham
  rationale: σπέρμα theo nghĩa gốc là 'hạt giống' nhưng ở đây chỉ hậu duệ; 'dòng dõi' tự nhiên, trang trọng và giữ sắc thái gia hệ.
- source_word: φυλῆς Βενιαμίν
  choice: thuộc bộ tộc Bên-gia-min
  rationale: φυλή chỉ một bộ tộc của Y-sơ-ra-ên; cách dịch này rõ ràng và sát nghĩa.
theological_decisions:
- issue: Câu hỏi của Phao-lô có hàm ý Đức Chúa Trời hoàn toàn hoặc vĩnh viễn loại bỏ dân Y-sơ-ra-ên hay không
  choice: Dịch đơn giản là 'Chẳng lẽ Đức Chúa Trời đã từ bỏ dân Ngài sao?'
  alternative: Chẳng lẽ Đức Chúa Trời đã hoàn toàn từ bỏ dân Ngài sao? / Chẳng lẽ Đức Chúa Trời đã vĩnh viễn loại bỏ dân Ngài sao?
  rationale: Bản Hy Lạp không có trạng từ mang nghĩa 'hoàn toàn' hay 'vĩnh viễn'. Không thêm các yếu tố ấy để mạch văn tiếp theo tự xác định phạm vi của câu hỏi.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng câu hỏi 'Chẳng lẽ ... sao?' để thể hiện kỳ vọng về câu trả lời phủ định; giữ nguyên sức căng thần học, không thêm ý hoàn toàn hay vĩnh viễn.
