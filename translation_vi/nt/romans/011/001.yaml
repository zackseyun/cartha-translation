- from: 'Vậy tôi hỏi: Chẳng lẽ Đức Chúa Trời đã từ bỏ dân Ngài sao?[a] Tuyệt đối không![b] Vì chính tôi cũng là người Y-sơ-ra-ên, thuộc dòng dõi Áp-ra-ham,[c] thuộc bộ tộc Bên-gia-min.'
  to: 'Vậy tôi hỏi: Chẳng lẽ Đức Chúa Trời đã từ bỏ dân Ngài sao?[a] Tuyệt đối không![b] Vì chính tôi là người Y-sơ-ra-ên, thuộc dòng dõi Áp-ra-ham,[c] thuộc bộ tộc Bên-gia-min.'
  rationale: Chỉ sửa «Vì chính tôi cũng là» thành «Vì chính tôi là» để tránh thêm sắc thái so sánh không được nêu rõ trong tiếng Hy Lạp, đồng thời vẫn giữ lực nhấn mạnh của ἐγώ và chức năng chứng minh của γάρ. Các dấu neo chú thích và nội dung chú thích được giữ nguyên; không có lỗi cấu trúc cần xử lý.
