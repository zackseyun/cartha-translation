id: ROM.11.26
reference: Romans 11:26
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ οὕτως πᾶς Ἰσραὴλ σωθήσεται· καθὼς γέγραπται· Ἥξει ἐκ Σιὼν ὁ ⸀ῥυόμενος, ἀποστρέψει ἀσεβείας ἀπὸ Ἰακώβ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/026.yaml
  text: 'And in this way all Israel will be saved[a], just as it is written: “The Deliverer will come from Zion[c][b]; he will turn away ungodliness from Jacob.”'
translation:
  language: vi
  text: 'Và theo cách ấy[a], toàn thể Y-sơ-ra-ên[b] sẽ được cứu, như có lời chép: “Đấng Giải Cứu sẽ đến từ Si-ôn; Ngài sẽ khiến sự vô đạo lìa khỏi Gia-cốp.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Và như vậy, toàn thể Y-sơ-ra-ên sẽ được cứu.” Từ Hy Lạp οὕτως có thể mang nghĩa “như vậy”, nhưng ở đây có thể nhấn mạnh cách thức vừa được trình bày.'
    reason: lexical_alternative
  - marker: b
    text: “Toàn thể Y-sơ-ra-ên” là một cụm từ có nhiều cách giải thích. Bản dịch giữ nguyên cách nói của tiếng Hy Lạp, không quyết định Phao-lô muốn nói toàn thể dân Y-sơ-ra-ên theo huyết thống, phần sót lại có đức tin, hay toàn thể dân Đức Chúa Trời.
    reason: alternative_reading
lexical_decisions:
- source_word: οὕτως
  choice: theo cách ấy
  rationale: Giữ nghĩa chỉ cách thức của trạng từ và tự nhiên hướng về tiến trình vừa được mô tả trong văn cảnh, thay vì mặc nhiên biến nó thành một kết quả đơn thuần.
- source_word: πᾶς Ἰσραήλ
  choice: toàn thể Y-sơ-ra-ên
  rationale: Diễn đạt tự nhiên toàn bộ cụm từ Hy Lạp mà không xác định thêm phạm vi hay thành phần của Y-sơ-ra-ên.
- source_word: σωθήσεται
  choice: sẽ được cứu
  rationale: Thể tương lai bị động của σῴζω mang sức nặng cứu rỗi trong văn mạch Phao-lô; cách dịch này giữ cả thời và thái.
- source_word: καθὼς γέγραπται
  choice: như có lời chép
  rationale: Công thức dẫn Kinh Thánh quen thuộc, trang trọng và tự nhiên trong tiếng Việt.
- source_word: Ἥξει ἐκ Σιὼν ὁ ῥυόμενος
  choice: Đấng Giải Cứu sẽ đến từ Si-ôn
  rationale: Dịch phân từ có mạo từ như một danh xưng; “từ Si-ôn” thể hiện tự nhiên giới từ ἐκ mà vẫn giữ nguyên địa danh của câu trích dẫn.
- source_word: ἀποστρέψει ἀσεβείας ἀπὸ Ἰακώβ
  choice: Ngài sẽ khiến sự bất kính lìa khỏi Gia-cốp
  rationale: Giữ hình ảnh khiến điều gì quay/lìa đi trong ἀποστρέψει và sắc thái tôn giáo-đạo đức của ἀσεβείας, đồng thời không đổi “Gia-cốp” thành “Y-sơ-ra-ên”.
theological_decisions:
- issue: Đối tượng được chỉ bởi “toàn thể Y-sơ-ra-ên”
  choice: Giữ nguyên cụm “toàn thể Y-sơ-ra-ên” mà không diễn giải thêm.
  alternative: Toàn bộ dân Y-sơ-ra-ên theo huyết thống; phần sót lại có đức tin trong Y-sơ-ra-ên; hoặc toàn thể dân Đức Chúa Trời gồm cả dân ngoại.
  rationale: Bản văn Hy Lạp không tự phân xử các cách hiểu đang được tranh luận; bản dịch cần giữ nguyên độ mở và sức căng thần học ấy.
- issue: Tính chất danh xưng của ὁ ῥυόμενος
  choice: Dịch là “Đấng Giải Cứu”.
  alternative: “người giải cứu” hoặc “Đấng giải thoát”.
  rationale: Phân từ có mạo từ hoạt động như một danh xưng trong lời tiên tri; cách viết hoa phù hợp văn phong tiếng Việt mà không thêm danh tính ngoài câu chữ.
translation_notes:
  register: 'Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng các dạng tên quen thuộc trong truyền thống Kinh Thánh tiếng Việt: Y-sơ-ra-ên, Si-ôn, Gia-cốp. Cấu trúc lời trích giữ nhịp tiên tri và không giải nghĩa thay cho nguyên văn.'
