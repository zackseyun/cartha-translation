  source_fidelity: 'Bản dịch nhìn chung sát với văn bản Hy Lạp: οὕτως được giữ theo nghĩa cách thức; πᾶς Ἰσραήλ không bị giải thích thu hẹp; σωθήσεται giữ thì tương lai bị động; và Gia-cốp được bảo lưu trong câu trích. Tuy nhiên, các chú thích hiện chưa được đặt tại những từ/cụm từ mà chúng giải thích. Cần chuyển chú thích về οὕτως đến “theo cách ấy” và chú thích về πᾶς Ἰσραήλ đến “toàn thể Y-sơ-ra-ên”. Cũng nên dùng “vô đạo” cho ἀσεβείας để biểu đạt rõ hơn sắc thái thiếu kính sợ Đức Chúa Trời, thay vì “bất kính”, vốn có thể chỉ sự thiếu tôn trọng nói chung.'
  naturalness: “Và theo cách ấy” và “như có lời chép” tự nhiên, phù hợp văn phong Kinh Thánh tiếng Việt hiện đại. “Khiến sự vô đạo lìa khỏi Gia-cốp” là lối diễn đạt trang trọng, rõ nghĩa và giữ được sắc thái khiến điều ác quay/lìa đi của ἀποστρέψει.
  terminology: Các tên Y-sơ-ra-ên, Si-ôn và Gia-cốp nhất quán với cách dùng Kinh Thánh tiếng Việt. “Đấng Giải Cứu” phù hợp với phân từ danh từ hóa ὁ ῥυόμενος trong ngữ cảnh trích dẫn. “Sự vô đạo” là thuật ngữ chính xác hơn cho ἀσεβείας.
