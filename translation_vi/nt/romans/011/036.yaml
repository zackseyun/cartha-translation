source:
  edition: SBLGNT
  text: ὅτι ἐξ αὐτοῦ καὶ δι’ αὐτοῦ καὶ εἰς αὐτὸν τὰ πάντα· αὐτῷ ἡ δόξα εἰς τοὺς αἰῶνας, ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/036.yaml
  text: For from him and through him and to him are all things[a]. To him be the glory forever[b]. Amen.
translation:
  language: vi
  text: Vì muôn vật đều từ Ngài, nhờ Ngài và hướng về Ngài.[a] Vinh quang thuộc về Ngài cho đến đời đời.[b] A-men.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Bởi vì muôn vật đều từ Ngài, nhờ Ngài và hướng về Ngài.”'
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn: “đến các thời đại”; đây là thành ngữ chỉ thời gian vô tận.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Vì
  rationale: Liên từ này nêu cơ sở cho lời tôn vinh ngay trước đó; “Vì” tự nhiên trong tiếng Việt và giữ nguyên sức nặng nhân quả.
- source_word: ἐξ αὐτοῦ
  choice: từ Ngài
  rationale: ἐξ với sở hữu cách chỉ nguồn gốc; “từ Ngài” diễn đạt ngắn gọn rằng muôn vật bắt nguồn nơi Đức Chúa Trời.
- source_word: δι’ αὐτοῦ
  choice: qua Ngài
  rationale: διά với sở hữu cách biểu thị phương tiện hoặc tác nhân; “qua Ngài” giữ sắc thái trung gian mà không diễn giải quá mức.
- source_word: εἰς αὐτὸν
  choice: hướng về Ngài
  rationale: εἰς biểu thị đích đến, phương hướng hoặc mục tiêu; “hướng về Ngài” giữ rõ sức hướng đích và không thu hẹp thành một nghĩa mục đích duy nhất.
- source_word: τὰ πάντα
  choice: muôn vật
  rationale: Cụm trung tính số nhiều có phạm vi bao quát; “muôn vật” tự nhiên, trang trọng và chuyển tải tầm vóc toàn thể của câu.
- source_word: αὐτῷ ἡ δόξα
  choice: Nguyện vinh quang thuộc về Ngài
  rationale: Mệnh đề Hy Lạp không có động từ và mang tính tôn vinh. “Nguyện… thuộc về Ngài” diễn đạt tự nhiên lực cầu chúc/tuyên xưng mà không thêm nội dung thần học.
- source_word: εἰς τοὺς αἰῶνας
  choice: cho đến đời đời
  rationale: Nghĩa đen là “đến các thời đại,” một thành ngữ chỉ thời gian vô tận; cách dịch này trang trọng và quen thuộc trong tiếng Việt hiện đại.
- source_word: ἀμήν
  choice: A-men
  rationale: Giữ dạng phiên âm quen dùng trong ngôn ngữ Kinh Thánh và phụng vụ tiếng Việt.
theological_decisions:
- issue: Đối tượng được chỉ bởi các đại từ αὐτοῦ/αὐτὸν/αὐτῷ
  choice: Giữ đại từ “Ngài” xuyên suốt, với Đức Chúa Trời là đối tượng theo ngữ cảnh Rô-ma 11:33–35.
  alternative: Thay các đại từ bằng danh xưng “Đức Chúa Trời.”
  rationale: Ngữ cảnh cho thấy lời tôn vinh hướng về Đức Chúa Trời, nhưng giữ đại từ bảo toàn cấu trúc tu từ của nguyên văn và tránh xác định rõ hơn chính văn.
- issue: Cách diễn đạt αὐτῷ ἡ δόξα trong lời tôn vinh
  choice: Nguyện vinh quang thuộc về Ngài
  alternative: Vinh quang thuộc về Ngài
  rationale: Nguyên văn là một mệnh đề không động từ, có thể được hiểu như lời cầu chúc hoặc lời xác nhận. “Nguyện” truyền đạt lực tôn vinh tự nhiên trong tiếng Việt; chú thích bảo lưu khả năng dịch theo lối xác nhận.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “muôn vật” để giữ tầm vóc bao quát của τὰ πάντα; viết hoa “Ngài” theo quy ước tôn kính phổ biến. Các vế “từ Ngài, qua Ngài và hướng về Ngài” được giữ song song nhằm bảo toàn nhịp điệu và chuyển động thần học của nguyên văn.
