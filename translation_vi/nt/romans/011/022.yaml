id: ROM.11.22
reference: Romans 11:22
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἴδε οὖν χρηστότητα καὶ ἀποτομίαν θεοῦ· ἐπὶ μὲν τοὺς πεσόντας ⸀ἀποτομία, ἐπὶ δὲ σὲ ⸂χρηστότης θεοῦ⸃, ἐὰν ⸀ἐπιμένῃς τῇ χρηστότητι, ἐπεὶ καὶ σὺ ἐκκοπήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/022.yaml
  text: 'Consider[a], then, the kindness and severity of God: severity toward those who have fallen, but God''s kindness toward you, if you continue in his kindness[b]; otherwise you too will be cut off.'
translation:
  language: vi
  text: 'Vậy, hãy xem sự nhân từ và sự nghiêm khắc của Đức Chúa Trời: sự nghiêm khắc đối với những người đã sa ngã, nhưng sự nhân từ của Đức Chúa Trời đối với bạn, nếu bạn tiếp tục ở trong sự nhân từ ấy; bằng không, bạn cũng sẽ bị chặt bỏ.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “bị cắt bỏ.” “Bị chặt bỏ” phù hợp với hình ảnh nhánh cây ô-liu trong ngữ cảnh; động từ Hy Lạp mang nghĩa cắt hoặc chặt bỏ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἴδε
  choice: hãy xem
  rationale: Giữ sắc thái mệnh lệnh kêu gọi người đọc chú ý và suy xét; cách nói tự nhiên, trang trọng vừa phải trong tiếng Việt hiện đại.
- source_word: χρηστότητα / χρηστότης
  choice: sự nhân từ
  rationale: Diễn đạt lòng tốt đầy thiện ý của Đức Chúa Trời và tạo thế đối lập rõ với sự nghiêm khắc; “sự tốt lành” cũng có thể dùng nhưng ít nhấn mạnh chiều kích tương quan hơn.
- source_word: ἀποτομίαν / ἀποτομία
  choice: sự nghiêm khắc / nghiêm khắc
  rationale: Truyền đạt tính quyết liệt trong sự phán xét mà không cường điệu thành tàn nhẫn.
- source_word: ἐπὶ μὲν τοὺς πεσόντας
  choice: với những người đã sa ngã
  rationale: “Với” diễn đạt tự nhiên hướng áp dụng của sự nghiêm khắc; “đã sa ngã” giữ trạng thái phát sinh từ hành động sa ngã trong hình ảnh cây ô-liu.
- source_word: ἐπὶ δὲ σὲ
  choice: với bạn
  rationale: Giữ cấu trúc đối ứng với vế trước và số ít của đại từ Hy Lạp.
- source_word: ἐὰν ἐπιμένῃς τῇ χρηστότητι
  choice: nếu bạn cứ ở trong sự nhân từ ấy
  rationale: “Cứ ở trong” diễn đạt sự tiếp tục, bền đỗ trong phạm vi sự nhân từ của Đức Chúa Trời; “ấy” quy chiếu rõ về sự nhân từ vừa nêu mà không thêm ý ngoài văn bản.
- source_word: ἐπεὶ
  choice: bằng không
  rationale: Trong ngữ cảnh, từ này dẫn vào hậu quả khi điều kiện không được đáp ứng; “bằng không” thể hiện tự nhiên logic cảnh báo.
- source_word: ἐκκοπήσῃ
  choice: sẽ bị chặt bỏ
  rationale: Giữ thể tương lai bị động và nghĩa trực tiếp của động từ, đồng thời phù hợp với hình ảnh nhánh cây ô-liu trong đoạn văn.
theological_decisions:
- issue: Lời cảnh báo có điều kiện liên quan đến sự nhân từ và sự phán xét của Đức Chúa Trời
  choice: 'Giữ nguyên điều kiện và hậu quả thực sự trong câu: nếu người được nói đến cứ ở trong sự nhân từ ấy thì hưởng sự nhân từ; bằng không cũng sẽ bị chặt bỏ.'
  alternative: Làm nhẹ lời cảnh báo thành một giả định thuần túy, hoặc diễn giải câu theo một lập trường hệ phái cụ thể về sự bền đỗ hay sự sa ngã.
  rationale: Câu Hy Lạp đưa ra lời khuyên răn và cảnh báo có điều kiện nhưng không tự giải quyết tranh luận thần học về sự bền đỗ, bội đạo, hay phạm vi cá nhân so với cộng đồng.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “Đức Chúa Trời” theo lối Kinh Thánh Tin Lành phổ biến, không thêm cách diễn giải hệ phái. Cấu trúc đối lập và lời cảnh báo có điều kiện được giữ rõ.
