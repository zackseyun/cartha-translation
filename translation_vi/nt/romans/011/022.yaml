revisions:
- from: 'Vậy, hãy xem sự nhân từ và nghiêm khắc của Đức Chúa Trời: Ngài nghiêm khắc với những người đã sa ngã, nhưng nhân từ với bạn, nếu bạn cứ ở trong sự nhân từ ấy; bằng không, bạn cũng sẽ bị chặt bỏ.[a]'
  to: 'Vậy, hãy xem sự nhân từ và sự nghiêm khắc của Đức Chúa Trời: sự nghiêm khắc đối với những người đã sa ngã, nhưng sự nhân từ của Đức Chúa Trời đối với bạn, nếu bạn tiếp tục ở trong sự nhân từ ấy; bằng không, bạn cũng sẽ bị chặt bỏ.[a]'
  rationale: Bản sửa phục hồi sự đối ứng danh từ và quy chiếu về Đức Chúa Trời vốn được nêu rõ trong nguyên văn, đồng thời thay «cứ ở trong» bằng «tiếp tục ở trong» để diễn đạt chính xác và tự nhiên hơn ý tiếp diễn của động từ Hy Lạp. Lời cảnh báo có điều kiện, tính bị động tương lai của «bị chặt bỏ», và tính không giải quyết tranh luận hệ phái đều được giữ nguyên.
  reviewer_model: gpt-5.6-terra
