  source_fidelity: 'Bản dịch bám sát SBLGNT: ἐρεῖς οὖν được chuyển là “Vậy bạn sẽ nói”; mệnh đề bị động Ἐξεκλάσθησαν κλάδοι là “Các nhánh đã bị bẻ đi”; và ἵνα ἐγὼ ἐγκεντρισθῶ là “để tôi được ghép vào.” Thì tương lai, quan hệ suy luận, hình ảnh cây cối, và thể bị động đều được bảo toàn. Bản dịch cũng không biến lời của người đối thoại thành một khẳng định thần học của chính Phao-lô.'
