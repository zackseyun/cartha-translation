  text: ἐρεῖς οὖν· Ἐξεκλάσθησαν κλάδοι ἵνα ἐγὼ ἐγκεντρισθῶ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/019.yaml
  text: You will say then, “Branches were broken off so that I might be grafted in.”
translation:
  language: vi
  text: 'Vậy bạn sẽ nói: “Các nhánh đã bị bẻ đi để tôi được ghép vào.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐρεῖς
  choice: bạn sẽ nói
  rationale: Động từ tương lai chủ động, ngôi thứ hai số ít của λέγω. Cách dịch này giữ nguyên lời trực tiếp hướng đến người đối thoại giả định trong lập luận của Phao-lô.
- source_word: οὖν
  choice: Vậy
  rationale: Liên từ suy luận/chuyển tiếp, nối câu này với lập luận trước đó. “Vậy” tự nhiên trong tiếng Việt hiện đại và vẫn thể hiện quan hệ logic.
- source_word: Ἐξεκλάσθησαν
  choice: đã bị bẻ đi
  rationale: Động từ aorist bị động của ἐκκλάω. “Bẻ đi” giữ rõ hình ảnh các nhánh bị tách khỏi cây hơn cách diễn đạt trừu tượng như “loại bỏ”.
- source_word: κλάδοι
  choice: các nhánh
  rationale: Dịch trực tiếp danh từ số nhiều trong ẩn dụ cây ô-liu. Mạo từ không có trong tiếng Hy Lạp, nhưng “các nhánh” là cách diễn đạt tự nhiên trong tiếng Việt mà không xác định đó là toàn bộ các nhánh.
- source_word: ἵνα
  choice: để
  rationale: Giới thiệu mệnh đề chỉ mục đích hoặc kết quả. “Để” ngắn gọn, tự nhiên và giữ nguyên lời suy luận của người nói.
- source_word: ἐγὼ
  choice: tôi
  rationale: Đại từ được nêu rõ và có tính nhấn mạnh trong tiếng Hy Lạp. Việc giữ “tôi” làm chủ ngữ nổi bật bảo toàn sự tự quy hướng trong lời nói.
- source_word: ἐγκεντρισθῶ
  choice: được ghép vào
  rationale: Động từ aorist bị động giả định của ἐγκεντρίζω. “Được ghép vào” là thuật ngữ làm vườn tự nhiên, giữ thể bị động và không thêm đối tượng không có trong câu.
theological_decisions:
- issue: Có nên nói rõ đây là lời của một người đối thoại giả định trong cách lập luận của Phao-lô hay không
  choice: 'Giữ nguyên lời trực tiếp ở ngôi thứ hai: “bạn sẽ nói”'
  alternative: “Có lẽ bạn sẽ nói” hoặc “Bấy giờ có người sẽ nói”
  rationale: Bản Hy Lạp chỉ nói “bạn sẽ nói”. Không thêm “có lẽ” hay “có người”, để không diễn giải quá mức hình thức đối thoại của đoạn văn.
- issue: Có nên biến mệnh đề mục đích thành lời khẳng định được Phao-lô xác nhận về ý định của Đức Chúa Trời hay không
  choice: 'Dịch thẳng lời suy luận: “để tôi được ghép vào”'
  alternative: “nhằm cho tôi có thể được ghép vào”
  rationale: Đây là phát biểu của người đối thoại trong lập luận, chưa nhất thiết là cách Phao-lô xác nhận động cơ thần học. Bản dịch giữ nguyên sức căng ấy mà không thêm lời tán thành hay bác bỏ.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Bẻ đi” cùng “ghép vào” duy trì nhất quán ẩn dụ làm vườn. Không cần chú thích cho câu này.
