  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: κἀκεῖνοι δέ, ἐὰν μὴ ⸀ἐπιμένωσι τῇ ἀπιστίᾳ, ἐγκεντρισθήσονται· δυνατὸς γάρ ⸂ἐστιν ὁ θεὸς⸃ πάλιν ἐγκεντρίσαι αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/023.yaml
  text: And even they[a], if they do not continue in unbelief, will be grafted in[b]; for God is able to graft them in again.
translation:
  language: vi
  text: Còn họ, nếu không tiếp tục ở trong sự không tin, thì cũng sẽ được ghép vào; vì Đức Chúa Trời có thể ghép họ vào một lần nữa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κἀκεῖνοι δέ
  choice: Còn họ cũng vậy
  rationale: Diễn đạt cả bước chuyển nhẹ của δέ lẫn sắc thái bổ sung của καί trong κἀκεῖνοι, chỉ về những người đã được nhắc đến trong hình ảnh các nhánh cây.
- source_word: ἐὰν μὴ ἐπιμένωσι τῇ ἀπιστίᾳ
  choice: nếu không cứ ở trong sự không tin
  rationale: Cấu trúc điều kiện được giữ nguyên; “cứ ở trong” diễn đạt sự tiếp tục hoặc dai dẳng trong một trạng thái, còn ἀπιστία trong văn cảnh này chủ yếu là sự không tin.
- source_word: ἐγκεντρισθήσονται
  choice: sẽ được ghép vào
  rationale: Giữ thể tương lai bị động và hình ảnh ghép nhánh ô-liu; không thêm ý “lại” tại đây vì πάλιν chỉ xuất hiện trong mệnh đề sau.
- source_word: δυνατὸς γάρ ἐστιν ὁ θεὸς
  choice: vì Đức Chúa Trời có thể
  rationale: Cách nói tự nhiên trong tiếng Việt, giữ nguyên lý do dựa trên khả năng của Đức Chúa Trời.
- source_word: πάλιν ἐγκεντρίσαι αὐτούς
  choice: ghép họ vào lại
  rationale: “Lại” thể hiện rõ πάλιν và ý phục hồi, đồng thời lặp lại động từ ghép để duy trì hình ảnh xuyên suốt câu.
theological_decisions:
- issue: Ý nghĩa của ἀπιστία trong văn cảnh
  choice: sự không tin
  alternative: sự bất trung
  rationale: Rô-ma 11 trực tiếp đối chiếu tin và không tin trong việc được đứng vững hay bị cắt khỏi cây ô-liu. “Sự không tin” bảo toàn sự đối chiếu ấy mà không mở rộng thuật ngữ thành một phạm trù giao ước không được nói rõ tại đây.
- issue: Có nên đưa ý phục hồi vào động từ ghép thứ nhất hay không
  choice: Chỉ dịch “sẽ được ghép vào” ở mệnh đề thứ nhất và dùng “lại” ở mệnh đề thứ hai
  alternative: sẽ được ghép trở lại
  rationale: Bản Hy Lạp chỉ ghi πάλιν trong mệnh đề thứ hai. Cách dịch đã chọn giữ đúng vị trí thông tin được nêu rõ, trong khi toàn câu vẫn truyền đạt đầy đủ ý phục hồi.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Cứ ở trong sự không tin” giữ sắc thái kéo dài của ἐπιμένω; “ghép vào lại” là cách nói tự nhiên trong tiếng Việt và bảo toàn vị trí của πάλιν.
