  - severity: low
    issue: Cách gọi “những người ngoại” có thể mơ hồ trong tiếng Việt hiện đại.
    rationale: Trong ngữ cảnh Phao-lô đối chiếu Y-sơ-ra-ên với ἔθνη, “dân ngoại” là cách gọi chuyên biệt và nhất quán hơn.
  - severity: low
