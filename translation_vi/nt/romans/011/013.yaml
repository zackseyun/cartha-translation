id: ROM.11.13
reference: Romans 11:13
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ὑμῖν ⸀δὲ λέγω τοῖς ἔθνεσιν. ἐφ’ ὅσον μὲν ⸀οὖν εἰμι ἐγὼ ἐθνῶν ἀπόστολος, τὴν διακονίαν μου δοξάζω,
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/013.yaml
  text: I am speaking to you Gentiles[a]. Inasmuch, then, as I am an apostle to the Gentiles, I magnify my ministry[b],
translation:
  language: vi
  text: 'Tôi nói với anh chị em thuộc dân ngoại[a] rằng: Vậy, vì tôi là sứ đồ cho dân ngoại, tôi đề cao chức vụ của mình[b],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “các dân tộc” ở cả hai lần xuất hiện của từ này.
    reason: lexical_alternative
  - marker: b
    text: 'Hay: “tôi làm vẻ vang chức vụ của mình” hoặc “tôi tôn vinh chức vụ của mình.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὑμῖν δὲ λέγω τοῖς ἔθνεσιν
  choice: Tôi nói với anh chị em là những người ngoại
  rationale: Kết hợp đại từ số nhiều với thành phần đồng vị chỉ đối tượng được nói đến. δέ đánh dấu chuyển ý nhẹ; trong tiếng Việt không cần thêm một từ nối riêng. “Anh chị em” diễn đạt tự nhiên lời trực tiếp gửi đến cộng đồng độc giả.
- source_word: ἐφ’ ὅσον μὲν οὖν
  choice: Vì
  rationale: Trong ngữ cảnh, cụm này nêu cơ sở cho lời tiếp theo. “Vì” truyền đạt quan hệ lập luận tự nhiên, còn sắc thái của các tiểu từ μὲν οὖν không cần tách riêng một cách gượng ép.
- source_word: ἐθνῶν ἀπόστολος
  choice: sứ đồ cho các dân ngoại
  rationale: ἀπόστολος ở đây là chức vụ đặc thù của Phao-lô; sở hữu cách ἐθνῶν chỉ phạm vi hay đối tượng sứ mạng. “Cho các dân ngoại” rõ nghĩa và tự nhiên.
- source_word: τὴν διακονίαν μου
  choice: chức vụ của mình
  rationale: Trong văn cảnh, διακονία là công tác phục vụ được giao gắn với sứ mạng sứ đồ. “Chức vụ” diễn đạt thích hợp hơn “sự phục vụ” đơn thuần.
- source_word: δοξάζω
  choice: tôi coi trọng
  rationale: Ở đây động từ chỉ việc đề cao, làm nổi bật hoặc tôn quý chức vụ. “Coi trọng” tự nhiên trong tiếng Việt và tránh gợi ý rằng Phao-lô tự tôn vinh bản thân.
theological_decisions:
- issue: Ý nghĩa của việc Phao-lô δοξάζω chức vụ mình
  choice: Phao-lô coi trọng và đề cao chức vụ được giao, chứ không tự tôn vinh bản thân.
  alternative: “Tôi làm vẻ vang chức vụ của mình” hoặc “tôi tôn vinh chức vụ của mình.”
  rationale: Tân ngữ là “chức vụ của tôi,” và văn cảnh đặt chức vụ ấy trong mục đích cứu rỗi của Đức Chúa Trời. Bản dịch giữ trọng tâm ở giá trị của chức vụ mà không thêm ý khoe mình.
- issue: Đối tượng của ἔθνη / ἐθνῶν
  choice: những người ngoại / các dân ngoại
  alternative: các dân tộc
  rationale: Trong Rô-ma 9–11, từ này chủ yếu chỉ những người không thuộc dân Y-sơ-ra-ên, dù nghĩa chữ rộng hơn có thể là “các dân tộc.”
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh chị em” cho lời trực tiếp số nhiều; dùng “sứ đồ” và “chức vụ” theo cách dùng Kinh Thánh Việt ngữ quen thuộc. Dấu hai chấm giúp thể hiện câu sau giải thích cho lời Phao-lô nói với độc giả dân ngoại.
