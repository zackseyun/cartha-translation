  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: συνέκλεισεν γὰρ ὁ θεὸς τοὺς πάντας εἰς ἀπείθειαν ἵνα τοὺς πάντας ἐλεήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/032.yaml
  text: For God has shut up all into disobedience[c][b][a], so that he may show mercy to all.
translation:
  language: vi
  text: Vì Đức Chúa Trời đã giam tất cả trong sự không vâng phục,[a][b][c] để Ngài thương xót tất cả.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “đã nhốt”, “đã giam giữ” hoặc “đã đặt tất cả dưới sự kiềm tỏa”.
    reason: lexical_alternative
  - marker: b
    text: “Sự không vâng phục” trong một số văn cảnh cũng có thể dịch là “sự không tin”; ở đây nghĩa rộng hơn là không chịu vâng phục có lẽ phù hợp hơn.
    reason: lexical_alternative
  - marker: c
    text: Nguyên văn lặp lại “tất cả” ở cả hai vế. Không nên vội thu hẹp từ này; trong văn cảnh, Phao-lô đang bàn về người Do Thái và dân ngoại cùng nhau.
    reason: alternative_reading
lexical_decisions:
- source_word: συνέκλεισεν
  choice: đã giam
  rationale: Động từ συγκλείω diễn tả việc đóng kín hoặc giam chung. “Đã giam” giữ được hình ảnh cụ thể và hành động đã hoàn tất của thì aorist, nhưng không nhấn mạnh quá mức sắc thái hình phạt như “đã bỏ tù”.
- source_word: γὰρ
  choice: Vì
  rationale: γάρ đưa ra lời giải thích cho lập luận ngay trước đó; “Vì” giữ rõ mối liên kết lập luận và tự nhiên trong tiếng Việt.
- source_word: τοὺς πάντας
  choice: tất cả
  rationale: Cụm từ này được lặp lại ở cả hai vế. “Tất cả” bảo toàn độ rộng và phép đối xứng của nguyên văn, không tự ý giới hạn hoặc mở rộng đối tượng.
- source_word: εἰς ἀπείθειαν
  choice: trong sự không vâng phục
  rationale: ἀπείθεια chỉ sự không vâng phục, cũng có thể mang sắc thái không tin. Trong tiếng Việt, “giam ... trong sự không vâng phục” vừa tự nhiên hơn cách dịch máy móc “vào”, vừa giữ được hình ảnh bị đặt trong một tình trạng.
- source_word: ἵνα
  choice: để
  rationale: ἵνα biểu thị mục đích hoặc kết quả; “để” ngắn gọn, tự nhiên và giữ được lực mục đích trong câu.
- source_word: ἐλεήσῃ
  choice: Ngài thương xót
  rationale: ἐλεάω có nghĩa là thương xót hoặc bày tỏ lòng thương xót. “Thương xót” là cách diễn đạt rõ ràng, trang trọng và quen thuộc; thể giả định sau ἵνα không cần được biểu đạt như sự bất định trong tiếng Việt.
theological_decisions:
- issue: Phạm vi của “tất cả” trong cả hai vế
  choice: Giữ nguyên “tất cả” ở cả hai lần xuất hiện, theo đúng phép đối xứng của τοὺς πάντας.
  alternative: Diễn giải thành “mọi người”, “hết thảy mọi người”, hoặc “cả người Do Thái lẫn dân ngoại”.
  rationale: Nguyên văn lặp cùng một cụm từ rộng ở cả hai vế. Bối cảnh đề cập người Do Thái và dân ngoại, nhưng bản dịch không nên tự giải quyết tranh luận thần học về phạm vi của lòng thương xót bằng cách thu hẹp hay mở rộng câu chữ.
- issue: Quan hệ giữa hành động của Đức Chúa Trời và sự không vâng phục
  choice: Dịch sát hình ảnh “đã giam tất cả trong sự không vâng phục”.
  alternative: Diễn giải nhẹ thành “để mặc tất cả không vâng phục” hoặc mạnh hơn thành “khiến tất cả không vâng phục”.
  rationale: συνέκλεισεν εἰς mô tả việc đặt hoặc giam trong một tình trạng, nhưng không trực tiếp nói Đức Chúa Trời là tác giả gây ra sự không vâng phục. Cách dịch được chọn giữ nguyên sức căng ấy.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ cấu trúc đối xứng “tất cả ... tất cả” và hình ảnh mạnh của động từ “giam”, đồng thời dùng “Đức Chúa Trời” và đại từ “Ngài” nhất quán.
