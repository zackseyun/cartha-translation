id: ROM.11.34
reference: Romans 11:34
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Τίς γὰρ ἔγνω νοῦν κυρίου; ἢ τίς σύμβουλος αὐτοῦ ἐγένετο;
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/034.yaml
  text: For who has known the mind of the Lord? Or who has become his counselor?[a]
translation:
  language: vi
  text: Vì ai đã biết tâm trí của Chúa? Hay ai đã trở thành người cố vấn của Ngài?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Phao-lô gợi lại Ê-sai 40:13, nơi bản Hy Lạp cũng hỏi ai đã biết tâm trí của Chúa hoặc đã trở thành người cố vấn của Ngài.
    reason: cross_reference
lexical_decisions:
- source_word: Τίς
  choice: ai
  rationale: Đại từ nghi vấn mở đầu câu hỏi tu từ; “ai” tự nhiên và giữ nguyên sức mạnh của lời trích dẫn.
- source_word: γὰρ
  choice: Vì
  rationale: Liên từ nêu cơ sở cho lời khẳng định ngay trước đó; “Vì” bảo toàn mối liên kết giải thích trong lập luận.
- source_word: ἔγνω
  choice: đã biết
  rationale: Động từ γινώσκω ở thì aorist trong câu hỏi tu từ; “đã biết” sát nghĩa và tự nhiên trong tiếng Việt, không diễn giải quá mức thành “đã hiểu thấu”.
- source_word: νοῦν
  choice: tâm trí
  rationale: Chỉ tâm trí, ý định hoặc sự hiểu biết; “tâm trí” trực tiếp, rõ ràng và phù hợp với âm hưởng Ê-sai 40:13.
- source_word: κυρίου
  choice: của Chúa
  rationale: Giữ cách gọi κύριος là “Chúa”, không đưa danh xưng giao ước từ bối cảnh Ê-sai vào chính văn Tân Ước.
- source_word: ἢ
  choice: Hay
  rationale: Giữ cấu trúc phân tuyển nối hai câu hỏi tu từ song song.
- source_word: σύμβουλος
  choice: người cố vấn
  rationale: Diễn đạt tự nhiên trong tiếng Việt hiện đại về người đưa ra lời khuyên, đồng thời giữ sắc thái trang trọng.
- source_word: αὐτοῦ
  choice: của Ngài
  rationale: Đại từ sở hữu quy chiếu về Chúa; cách diễn đạt này tự nhiên và tôn kính trong văn phong Kinh Thánh tiếng Việt.
- source_word: ἐγένετο
  choice: đã trở thành
  rationale: Giữ nghĩa căn bản của γίνομαι là “trở thành”, nhấn mạnh rằng không ai từng đảm nhận vai trò cố vấn cho Đức Chúa Trời.
theological_decisions:
- issue: Đối tượng của danh xưng “Chúa” trong lời trích dẫn dựa trên Ê-sai
  choice: Dịch là “Chúa” mà không thu hẹp thêm; trong ngữ cảnh, từ này chỉ Đức Chúa Trời và làm nổi bật sự khôn ngoan không thể dò thấu của Ngài.
  alternative: Dùng một cách dịch gắn rõ hơn với danh Đức Chúa Trời trong bối cảnh Ê-sai.
  rationale: Bản Hy Lạp có κυρίου. Bản dịch giữ nguyên cách diễn đạt của Tân Ước và tránh đưa một sự xác định từ văn cảnh Cựu Ước vào chính văn.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Hai câu hỏi tu từ được giữ nguyên cấu trúc song song; “tâm trí” và “người cố vấn” vừa sát nguồn Hy Lạp vừa tự nhiên với độc giả phổ thông.
