id: ROM.11.15
reference: Romans 11:15
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εἰ γὰρ ἡ ἀποβολὴ αὐτῶν καταλλαγὴ κόσμου, τίς ἡ πρόσλημψις εἰ μὴ ζωὴ ἐκ νεκρῶν;
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/015.yaml
  text: For if their rejection means reconciliation for the world[b][a], what will their acceptance mean if not life from the dead?
translation:
  language: vi
  text: Vì nếu việc họ bị loại bỏ đem lại sự hòa giải cho thế gian, thì việc họ được đón nhận sẽ là gì, nếu không phải là sự sống từ cõi chết[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Sự sống từ cõi chết” có thể chỉ theo nghĩa bóng một sự đổi mới thuộc linh phi thường, hoặc cụ thể hơn là sự sống lại; cách nói cô đọng của Phao-lô để ngỏ cả hai khả năng.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποβολὴ
  choice: việc họ bị loại bỏ
  rationale: Diễn đạt tự nhiên ý bị gạt bỏ hay khước từ trong quan hệ, đồng thời giữ dạng danh hóa của câu Hy Lạp và tạo thế đối lập với πρόσλημψις.
- source_word: καταλλαγὴ
  choice: sự hòa giải
  rationale: Đây là thuật ngữ Phao-lô thường dùng cho việc mối quan hệ được phục hồi; cách dịch này chính xác và quen thuộc trong tiếng Việt.
- source_word: κόσμου
  choice: thế gian
  rationale: Giữ phạm vi rộng của κόσμος, không thu hẹp ngay trong chính văn thành dân ngoại dù văn cảnh bao gồm họ.
- source_word: πρόσλημψις
  choice: việc họ được đón nhận
  rationale: Tạo đối xứng rõ với 'việc họ bị loại bỏ' và truyền đạt khả năng họ được tiếp nhận trở lại mà không thêm chủ thể tiếp nhận vốn không được nêu trong tiếng Hy Lạp.
- source_word: ζωὴ ἐκ νεκρῶν
  choice: sự sống từ cõi chết
  rationale: Giữ hình ảnh cô đọng và sức gợi của nguyên văn, không quyết định đó là sự phục hưng thuộc linh hay sự sống lại trong thời cuối cùng.
- source_word: εἰ μὴ
  choice: nếu không phải là
  rationale: Phù hợp với câu hỏi tu từ và đưa ra câu trả lời được chờ đợi với sắc thái nhấn mạnh.
- source_word: γὰρ
  choice: Vì
  rationale: Giữ liên kết giải thích với lập luận ngay trước đó.
theological_decisions:
- issue: Ý nghĩa của 'sự sống từ cõi chết'
  choice: Giữ cách diễn đạt mở, cô đọng, không xác định đây là sự đổi mới thuộc linh hay sự sống lại.
  alternative: Có thể hiểu theo nghĩa bóng là một cuộc phục hưng phi thường, hoặc cụ thể hơn là sự sống lại trong thời cuối cùng.
  rationale: Cụm từ Hy Lạp ngắn gọn và giàu sức gợi; việc dịch rõ theo một cách duy nhất sẽ giải quyết một căng thẳng thần học mà chính Phao-lô để ngỏ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Hai vế 'việc họ bị loại bỏ' và 'việc họ được đón nhận' được đặt đối xứng. Dùng 'thế gian' theo ngôn ngữ Kinh Thánh phổ thông nhưng vẫn tự nhiên; tránh thu hẹp κόσμος thành riêng dân ngoại.
