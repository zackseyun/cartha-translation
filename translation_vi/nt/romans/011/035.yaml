  terminology: “Ngài” phù hợp với quy chiếu và sắc thái tôn kính trong văn mạch. “hoàn trả” thích hợp với trường nghĩa ἀνταποδίδωμι trong lập luận về sự đáp trả/nghĩa vụ. Các chú thích dùng thuật ngữ rõ ràng, không áp đặt diễn giải giáo phái.
