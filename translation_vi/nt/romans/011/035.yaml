id: ROM.11.35
reference: Romans 11:35
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἢ τίς προέδωκεν αὐτῷ, καὶ ἀνταποδοθήσεται αὐτῷ;
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/035.yaml
  text: Or who has first given to him[b][a], and it will be repaid to him?
translation:
  language: vi
  text: Hay ai đã cho Ngài trước[a], để Ngài phải hoàn trả cho người ấy?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đã cho Ngài từ trước.”'
    reason: lexical_alternative
  - marker: b
    text: 'Sát chữ hơn: “và sẽ được hoàn trả cho người ấy?” Ý của câu hỏi tu từ là không ai từng cho Đức Chúa Trời theo cách khiến Ngài mắc nợ và phải trả lại.'
    reason: translation_and_context
lexical_decisions:
- source_word: ἢ
  choice: Hay
  rationale: Nối câu này với chuỗi câu hỏi tu từ trước đó; “Hay” là liên từ tự nhiên và cô đọng trong tiếng Việt.
- source_word: τίς
  choice: ai
  rationale: Đại từ nghi vấn chỉ người, thích hợp với câu hỏi tu từ.
- source_word: προέδωκεν
  choice: đã cho … trước
  rationale: Giữ sắc thái ưu tiên của tiền tố προ-, tức là cho trước hoặc cho đầu tiên, qua đó diễn đạt ý không ai có thể khiến Đức Chúa Trời mắc nợ mình.
- source_word: αὐτῷ (lần thứ nhất)
  choice: Ngài
  rationale: Đại từ này chỉ về Đức Chúa Trời trong văn cảnh. Viết “Ngài” giúp tiếng Việt rõ nghĩa mà vẫn giữ hình thức đại từ của nguyên văn.
- source_word: καὶ
  choice: để
  rationale: Trong cấu trúc câu hỏi tu từ tiếng Việt, “để” diễn đạt tự nhiên hệ quả được giả định giữa việc cho trước và việc được hoàn trả. Quan hệ liên kết đơn giản của καὶ vẫn được ghi nhận trong chú thích.
- source_word: ἀνταποδοθήσεται
  choice: phải hoàn trả
  rationale: Động từ tương lai bị động mang nghĩa được trả lại hoặc được đền đáp. Cách diễn đạt chủ động trong tiếng Việt tránh câu bị động gượng gạo, còn “phải” làm rõ hệ quả mắc nghĩa vụ vốn là sức nặng của câu hỏi tu từ.
- source_word: αὐτῷ (lần thứ hai)
  choice: cho người ấy
  rationale: Đại từ lần này chỉ người giả định đã cho Đức Chúa Trời trước, không cùng đối tượng với αὐτῷ thứ nhất; “người ấy” làm rõ sự chuyển đổi quy chiếu cần thiết trong tiếng Việt.
theological_decisions:
- issue: Hai lần xuất hiện của αὐτῷ có quy chiếu khác nhau
  choice: Lần thứ nhất dịch là “Ngài” (Đức Chúa Trời), lần thứ hai là “người ấy” (người giả định đã cho trước).
  alternative: Dùng cùng một đại từ ở cả hai vị trí.
  rationale: Ngữ pháp và lô-gíc của câu đòi hỏi Đức Chúa Trời là người nhận món cho trước, còn người cho là người được hoàn trả. Phân biệt đại từ ngăn sự mơ hồ sai lệch trong tiếng Việt.
- issue: Sắc thái Đức Chúa Trời mắc nghĩa vụ
  choice: Dùng “phải hoàn trả” trong câu hỏi tu từ.
  alternative: 'Dịch sát hình thức hơn: “và sẽ được hoàn trả cho người ấy.”'
  rationale: Nguyên văn không có một từ riêng tương đương với “phải”, nhưng sự kết hợp giữa “cho trước” và “hoàn trả” trong câu hỏi tu từ hàm ý đặt Đức Chúa Trời dưới nghĩa vụ đáp trả. Cách dịch này biểu đạt tự nhiên sức nặng ấy mà không khẳng định rằng thực sự có người làm được như vậy.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Ngài” giữ sự tôn kính dành cho Đức Chúa Trời; “hoàn trả” phù hợp với ngữ cảnh nghĩa vụ hơn “trả lại” hoặc “báo đáp”.
