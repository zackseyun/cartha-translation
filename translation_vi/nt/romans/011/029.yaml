source:
  edition: SBLGNT
  text: ἀμεταμέλητα γὰρ τὰ χαρίσματα καὶ ἡ κλῆσις τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/029.yaml
  text: For the gifts and the calling of God are irrevocable[a].
translation:
  language: vi
  text: Vì các ân tứ và sự kêu gọi của Đức Chúa Trời là không thể thu hồi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “không gây hối tiếc” hoặc “không bị rút lại.” Một số bản dịch tiếng Anh cổ dịch sát chữ là “không có sự hối tiếc.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμεταμέλητα
  choice: không thể thu hồi
  rationale: Tính từ này có nghĩa là không khiến người ban phải hối tiếc, vì thế không bị lấy lại. Trong ngữ cảnh nói về các ân tứ và sự kêu gọi của Đức Chúa Trời, “không thể thu hồi” diễn đạt tự nhiên việc Ngài không rút lại chúng, mà không mở rộng thành ý niệm tuyệt đối “không thể thay đổi”.
- source_word: γὰρ
  choice: Vì
  rationale: Liên từ này đưa ra căn cứ hoặc lời giải thích cho mệnh đề trước; “Vì” giữ được quan hệ lập luận ấy.
- source_word: τὰ χαρίσματα
  choice: các ân tứ
  rationale: χάρισμα chỉ món quà do ân điển ban cho. “Các ân tứ” là cách diễn đạt quen thuộc, trang trọng, giữ nguyên số nhiều và sắc thái ân điển.
- source_word: ἡ κλῆσις
  choice: sự kêu gọi
  rationale: Cách dịch này giữ sắc thái thần học trong lối dùng của Phao-lô mà không diễn giải thêm đối tượng hoặc hiệu lực của lời gọi.
- source_word: τοῦ θεοῦ
  choice: của Đức Chúa Trời
  rationale: Giữ cấu trúc sở hữu/xuất nguồn rộng của sở hữu cách Hy Lạp, áp dụng tự nhiên cho cả “các ân tứ” lẫn “sự kêu gọi”.
theological_decisions:
- issue: Phạm vi của “các ân tứ và sự kêu gọi của Đức Chúa Trời”
  choice: Giữ nguyên cụm từ, không nói rõ thêm đối tượng.
  alternative: Giải thích cụ thể là các đặc ân và sự kêu gọi dành cho Israel, hoặc khái quát hóa thành mọi ân tứ và sự kêu gọi dành cho các tín hữu.
  rationale: Ngữ cảnh Rô-ma 9–11 hướng mạnh đến Israel, nhưng chính câu Hy Lạp không nhắc lại đối tượng. Bản dịch giữ cách nói của Phao-lô để không thu hẹp hoặc mở rộng kết luận thần học ngay trong chính văn.
- issue: Sắc thái của ἀμεταμέλητα
  choice: Dịch là “không thể thu hồi,” đồng thời ghi chú các khả năng sát mặt chữ.
  alternative: “Không gây hối tiếc,” “không bị lấy lại,” hoặc lối dịch cổ “không có sự ăn năn.”
  rationale: Trong quan hệ với quà tặng và sự kêu gọi, từ này hàm ý chúng không bị rút lại. Tuy nhiên, ghi chú bảo lưu sắc thái từ nguyên liên quan đến sự hối tiếc, tránh làm mất tính đa nghĩa.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. “Ân tứ” giữ sắc thái ân điển của χάρισμα; “sự kêu gọi” giữ trọng lượng thần học mà không thêm cách giải thích hệ phái. Dấu chú thích [a] được đặt ngay sau mệnh đề liên quan.
