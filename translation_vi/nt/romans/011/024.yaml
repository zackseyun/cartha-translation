id: ROM.11.24
reference: Romans 11:24
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εἰ γὰρ σὺ ἐκ τῆς κατὰ φύσιν ἐξεκόπης ἀγριελαίου καὶ παρὰ φύσιν ἐνεκεντρίσθης εἰς καλλιέλαιον, πόσῳ μᾶλλον οὗτοι οἱ κατὰ φύσιν ἐγκεντρισθήσονται τῇ ἰδίᾳ ἐλαίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/024.yaml
  text: For if you were cut from what is by nature a wild olive tree and[a], contrary to nature, were grafted into a cultivated olive tree, how much more will these, the natural branches[b], be grafted into their own olive tree.
translation:
  language: vi
  text: Vì nếu bạn đã bị cắt khỏi cây ô-liu hoang tự nhiên, rồi trái với tự nhiên được ghép vào cây ô-liu trồng, thì huống chi những cành tự nhiên ấy[a] sẽ được ghép vào chính cây ô-liu của mình[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn Hy Lạp chỉ nói “những kẻ theo tự nhiên”; từ “cành” được bổ sung theo hình ảnh cây ô-liu trong văn cảnh.
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể diễn đạt: “sẽ được ghép trở lại vào chính cây ô-liu của mình.” Ý trở lại được hàm ý trong văn cảnh, nhưng không được nói rõ trong động từ Hy Lạp.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξεκόπης
  choice: đã bị cắt khỏi
  rationale: Động từ ἐκκόπτω mang nghĩa cắt ra hoặc cắt khỏi. Cách dịch này giữ sắc thái bị động và phù hợp với hình ảnh làm vườn, thay vì đồng hóa với ý 'bẻ gãy' ở văn cảnh lân cận.
- source_word: ἀγριελαίου
  choice: cây ô-liu hoang
  rationale: Danh từ chỉ cây ô-liu mọc hoang; thêm 'cây' giúp hình ảnh và quan hệ với giới từ ἐκ được rõ ràng trong tiếng Việt.
- source_word: κατὰ φύσιν
  choice: theo bản tính tự nhiên
  rationale: Cụm này mô tả nguồn gốc tự nhiên của cây ô-liu hoang và tạo thế đối xứng với παρὰ φύσιν. 'Theo bản tính tự nhiên' rõ nghĩa hơn chỉ nói 'theo tự nhiên' trong vế đầu.
- source_word: παρὰ φύσιν
  choice: trái với tự nhiên
  rationale: Giữ nguyên sự tương phản tu từ với κατὰ φύσιν và diễn đạt tự nhiên trong tiếng Việt hiện đại.
- source_word: ἐνεκεντρίσθης
  choice: được ghép vào
  rationale: Đây là động từ chuyên biệt về việc ghép cây; 'ghép vào' thể hiện thể bị động và phù hợp với εἰς.
- source_word: καλλιέλαιον
  choice: cây ô-liu trồng
  rationale: Từ này chỉ cây ô-liu được vun trồng, đối lập với cây ô-liu hoang. 'Ô-liu trồng' gọn, rõ và tránh sắc thái đánh giá của 'ô-liu tốt'.
- source_word: πόσῳ μᾶλλον
  choice: thì huống chi
  rationale: Thành ngữ tiếng Việt tự nhiên diễn đạt phép lập luận từ điều khó tin hơn đến điều càng hợp lý hơn.
- source_word: οὗτοι οἱ κατὰ φύσιν
  choice: những cành vốn thuộc về cây ấy theo tự nhiên
  rationale: Tiếng Hy Lạp chỉ nói 'những người/vật này, những kẻ theo tự nhiên'; 'cành' được bổ sung hợp lý từ ẩn dụ xuyên suốt. 'Vốn thuộc về cây ấy' làm rõ quan hệ tự nhiên mà không chèn trực tiếp danh xưng dân tộc.
- source_word: ἐγκεντρισθήσονται
  choice: sẽ được ghép vào
  rationale: Giữ đúng thì tương lai và thể bị động. Không đưa 'trở lại' vào chính văn vì yếu tố trở về chỉ được hàm ý bởi văn cảnh, không nằm rõ trong động từ.
- source_word: τῇ ἰδίᾳ ἐλαίᾳ
  choice: vào chính cây ô-liu của mình
  rationale: Đại từ ἰδίᾳ nhấn mạnh sự thuộc về riêng; 'chính ... của mình' tái hiện sự nhấn mạnh ấy và giữ hình ảnh ghép vào cây.
theological_decisions:
- issue: Có nêu rõ 'những cành' là người Do Thái hoặc Israel hay không
  choice: 'Giữ cách gọi bằng ẩn dụ: ''những cành vốn thuộc về cây ấy theo tự nhiên''.'
  alternative: Dịch trực tiếp là 'những người Do Thái' hoặc 'những người Israel'.
  rationale: Văn cảnh xác định đối tượng là Israel, nhưng câu Hy Lạp không dùng danh xưng dân tộc tại đây. Giữ ẩn dụ tránh nói rõ hơn nguyên văn và bảo toàn mạch lập luận về cây ô-liu.
- issue: Có bổ sung danh từ 'cành' hay không
  choice: Bổ sung 'cành' trong chính văn.
  alternative: Dịch sát hình thức là 'những người/vật này, những kẻ theo tự nhiên'.
  rationale: Danh từ không hiện diện trong câu Hy Lạp nhưng được hàm ý mạnh bởi văn cảnh ghép cây. Bổ sung này cần thiết để tiếng Việt rõ và tự nhiên, đồng thời không giải quyết thay độc giả vấn đề thần học.
- issue: Có thêm ý 'trở lại' vào động từ ghép hay không
  choice: Không thêm 'trở lại' trong chính văn; ghi nhận ở chú thích.
  alternative: Dịch 'sẽ được ghép trở lại'.
  rationale: Việc trở về cây của mình được văn cảnh và cụm τῇ ἰδίᾳ ἐλαίᾳ hàm ý, nhưng tiền tố hay động từ ἐγκεντρίζω tự nó không biểu thị 'trở lại'.
translation_notes:
  register: Văn phong trang trọng vừa phải, hiện đại và dễ hiểu. Dùng 'bạn' cho đại từ số ít σὺ vì Phao-lô đang trực tiếp nói với một người đại diện trong lập luận; giữ thuật ngữ làm vườn 'ghép' và cấu trúc 'huống chi' để bảo toàn sức nặng tu từ.
