  naturalness: “Theo bản tính tự nhiên” đi với “cây ô-liu hoang” không tự nhiên trong tiếng Việt hiện đại. “Cây ô-liu hoang tự nhiên” diễn đạt gọn hơn ý “wild olive by nature”. Ở vế sau, “những cành tự nhiên ấy” là cách rút gọn, mạch lạc trong ẩn dụ; chú thích giải thích phần danh từ “cành” được cung cấp.
