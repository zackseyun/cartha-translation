id: ROM.11.4
reference: Romans 11:4
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀλλὰ τί λέγει αὐτῷ ὁ χρηματισμός; Κατέλιπον ἐμαυτῷ ἑπτακισχιλίους ἄνδρας, οἵτινες οὐκ ἔκαμψαν γόνυ τῇ Βάαλ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/004.yaml
  text: But what does the divine response say to him? “I have kept for myself seven thousand men[b][a], who have not bent the knee to Baal.”
translation:
  language: vi
  text: Nhưng lời đáp từ Đức Chúa Trời[a] nói gì với ông? “Ta đã giữ lại cho mình[b] bảy ngàn người nam, là những người đã không quỳ gối trước Ba-anh.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “lời đáp của Đức Chúa Trời” hoặc “sấm ngôn.”
    reason: lexical_alternative
  - marker: b
    text: Hay “đã để dành cho mình.”
    reason: lexical_alternative
lexical_decisions:
- source_word: χρηματισμός
  choice: lời đáp của Đức Chúa Trời
  rationale: Trong ngữ cảnh này, danh từ chỉ lời phán đáp có thẩm quyền của Đức Chúa Trời dành cho Ê-li. Cách dịch này tự nhiên, rõ nguồn của lời đáp, đồng thời không diễn giải quá mức.
- source_word: Κατέλιπον
  choice: đã để dành
  rationale: Động từ aorist diễn tả hành động Đức Chúa Trời giữ lại một số người cho chính mình. “Đã để dành” vừa phản ánh hành động đã thực hiện vừa hàm ý số người ấy vẫn còn.
- source_word: ἐμαυτῷ
  choice: cho mình
  rationale: Đại từ phản thân ở cách tặng cách cho biết Đức Chúa Trời giữ họ lại cho chính Ngài; trong lời nói trực tiếp, “cho mình” là tự nhiên và chính xác.
- source_word: ἑπτακισχιλίους ἄνδρας
  choice: bảy ngàn người nam
  rationale: ἄνδρας là danh từ chỉ nam giới, nên “người nam” bảo toàn nét nghĩa giới tính cụ thể của nguyên văn.
- source_word: οἵτινες
  choice: là những người
  rationale: Cụm này giới thiệu đặc điểm xác định của bảy ngàn người; “là những người” diễn đạt rõ chức năng quan hệ mà không nhấn mạnh quá mức.
- source_word: οὐκ ἔκαμψαν γόνυ
  choice: chưa quỳ gối
  rationale: Thành ngữ theo nghĩa đen là “không uốn đầu gối,” chỉ hành động quỳ phục trong sự thờ phượng. “Chưa quỳ gối” giữ được hình ảnh và phù hợp với ý nghĩa của thể aorist trong lời trích dẫn.
- source_word: τῇ Βάαλ
  choice: trước Ba-anh
  rationale: Trong tiếng Việt, “quỳ gối trước” diễn đạt tự nhiên hành động quy phục hoặc thờ lạy một thần. Ba-anh là dạng phiên âm quen thuộc của tên riêng Βάαλ.
theological_decisions:
- issue: Có nên nói rõ nguồn của lời đáp là Đức Chúa Trời hay không
  choice: Dịch χρηματισμός là “lời đáp của Đức Chúa Trời” và giữ lời phán trực tiếp ở ngôi thứ nhất.
  alternative: Dịch tối giản là “lời đáp” hoặc dùng “sấm ngôn.”
  rationale: Ngữ cảnh và nguồn Cựu Ước cho thấy đây là lời Đức Chúa Trời đáp Ê-li. Việc nói rõ nguồn phản ánh ý nghĩa của χρηματισμός mà không thêm nội dung giáo lý ngoài bản văn.
- issue: Cách thể hiện giới tính của ἄνδρας
  choice: người nam
  alternative: người
  rationale: Nguyên văn dùng danh từ chỉ nam giới cụ thể; bản dịch giữ nét nghĩa này thay vì trung tính hóa.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Lời đáp của Đức Chúa Trời” tránh sắc thái cổ hoặc khó hiểu của “sấm ngôn”; “quỳ gối trước Ba-anh” giữ hình ảnh thờ lạy trong nguyên văn. Các dấu chú thích [a], [b] đều được đặt ngay sau cụm từ liên quan.
