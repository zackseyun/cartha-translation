source:
  edition: SBLGNT
  text: τί οὖν; ὃ ἐπιζητεῖ Ἰσραήλ, τοῦτο οὐκ ἐπέτυχεν, ἡ δὲ ἐκλογὴ ἐπέτυχεν· οἱ δὲ λοιποὶ ἐπωρώθησαν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/007.yaml
  text: What then? Israel did not obtain what it seeks[a], but the elect obtained it, and the rest were hardened[b],
translation:
  language: vi
  text: Vậy thì sao? Điều dân Y-sơ-ra-ên đang tìm kiếm, họ đã không đạt được; nhưng những người được chọn đã đạt được, còn những người còn lại thì bị làm cho cứng lòng[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “trở nên chai sạn” hoặc “bị làm cho mất nhạy bén về tâm linh.” Động từ Hy Lạp diễn tả tình trạng trở nên cứng, chai sạn hoặc mất nhạy bén.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τί οὖν
  choice: Vậy thì sao?
  rationale: Cách hỏi tu từ tự nhiên trong tiếng Việt, giữ chức năng suy luận và chuyển ý của công thức Phao-lô dùng.
- source_word: ὃ ἐπιζητεῖ Ἰσραήλ
  choice: Điều dân Y-sơ-ra-ên đang tìm kiếm
  rationale: Diễn đạt đối tượng mà Y-sơ-ra-ên tha thiết theo đuổi; thể tiếp diễn “đang tìm kiếm” phản ánh tự nhiên sắc thái hiện tại của động từ.
- source_word: Ἰσραήλ
  choice: dân Y-sơ-ra-ên
  rationale: Trong ngữ cảnh, tên gọi chỉ cộng đồng dân tộc Y-sơ-ra-ên chứ không phải cá nhân tổ phụ; thêm “dân” giúp tiếng Việt rõ và tự nhiên.
- source_word: ἐπέτυχεν
  choice: đạt được
  rationale: Động từ mang nghĩa đạt được điều đang theo đuổi. Lặp lại cùng một cách dịch ở hai vế để giữ phép đối lập của nguyên văn.
- source_word: ἡ δὲ ἐκλογὴ
  choice: những người được chọn
  rationale: Danh từ “sự lựa chọn” được dùng hoán dụ để chỉ những người được chọn, như sự tương phản với “những người khác” cho thấy.
- source_word: οἱ δὲ λοιποὶ
  choice: còn những người khác
  rationale: Chỉ phần còn lại, đối lập với những người được chọn; cách diễn đạt này rõ ràng và tự nhiên trong tiếng Việt.
- source_word: ἐπωρώθησαν
  choice: bị chai lì
  rationale: Giữ hình ảnh trở nên cứng/chai và ý nghĩa mất nhạy bén về tâm linh, đồng thời không xác định tác nhân của dạng bị động.
theological_decisions:
- issue: Ý nghĩa của ἡ ἐκλογὴ
  choice: Dịch là “những người được chọn,” chỉ một nhóm người.
  alternative: “sự lựa chọn” hoặc “nhóm được chọn”
  rationale: Vế sau đối chiếu nhóm này với “những người khác,” nên danh từ trừu tượng ở đây nhiều khả năng được dùng hoán dụ cho những người được chọn. Cách dịch không xác lập thêm một hệ thống thần học nào.
- issue: Thể bị động và tác nhân của ἐπωρώθησαν
  choice: Giữ thể bị động “bị chai lì” mà không nêu tác nhân.
  alternative: “Đức Chúa Trời khiến họ chai lì” hoặc “họ tự trở nên chai lì”
  rationale: Nguyên văn không nói rõ tác nhân. Bản dịch giữ nguyên sự căng thẳng giữa hành động phán xét của Đức Chúa Trời và trách nhiệm của con người, thay vì tự ý giải quyết.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Y-sơ-ra-ên” theo lối phiên âm quen thuộc; “dân” làm rõ nghĩa tập thể. Dấu chấm phẩy giúp giữ cấu trúc đối lập gồm ba vế của câu Hy Lạp.
