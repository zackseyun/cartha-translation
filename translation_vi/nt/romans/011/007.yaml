  to: Vậy thì sao? Điều dân Y-sơ-ra-ên đang tìm kiếm, họ đã không đạt được; nhưng những người được chọn đã đạt được, còn những người còn lại thì bị làm cho cứng lòng[a].
  rationale: Chỉ sửa cách dịch ἐπωρώθησαν và điều chỉnh chú thích tương ứng. Bản sửa giữ hình ảnh cứng/chai, giữ thể bị động, và không nêu tác nhân; đồng thời dùng tiếng Việt tự nhiên hơn. “Những người còn lại” diễn đạt sát hơn οἱ λοιποί so với “những người khác.”
