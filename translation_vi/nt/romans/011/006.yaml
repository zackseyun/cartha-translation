id: ROM.11.6
reference: Romans 11:6
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εἰ δὲ χάριτι, οὐκέτι ἐξ ἔργων, ἐπεὶ ἡ χάρις οὐκέτι γίνεται ⸀χάρις.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/006.yaml
  text: But if by grace, it is no longer from works; otherwise grace no longer becomes grace.
translation:
  language: vi
  text: Nhưng nếu là do ân điển thì không còn do việc làm nữa; nếu không, ân điển không còn là ân điển.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χάριτι
  choice: bởi ân điển
  rationale: 'Dịch cách thức/cơ sở được diễn tả bằng cách: điều ấy là do ân điển, tức sự ban cho nhưng không của Đức Chúa Trời.'
- source_word: ἐξ ἔργων
  choice: bởi việc làm
  rationale: Giữ sự đối lập trực tiếp giữa nguồn/cơ sở là ân điển và việc làm; không tự ý giới hạn thành 'việc làm của luật pháp' vì câu này chỉ có ἔργων.
- source_word: γίνεται
  choice: trở thành
  rationale: Phản ánh động từ γίνομαι thay vì rút gọn thành động từ 'là', đồng thời giữ nguyên lập luận rằng khi pha trộn với việc làm, ân điển không còn mang tính chất ân điển.
theological_decisions:
- issue: Mối quan hệ loại trừ giữa ân điển và việc làm
  choice: Giữ cấu trúc 'nếu... thì không còn...' mà không bổ sung đối tượng hay điều kiện cứu rỗi.
  alternative: Diễn giải thành 'nếu được chọn/cứu bởi ân điển thì không phải nhờ công đức'.
  rationale: Ngữ cảnh gần nói về sự tuyển chọn bởi ân điển, nhưng bản thân câu tỉnh lược chủ thể; bản dịch nên bảo toàn sự hàm súc và không thêm một cách giải nghĩa giáo phái.
- issue: Sắc thái của οὐκέτι γίνεται χάρις
  choice: không còn trở thành ân điển
  alternative: không còn là ân điển
  rationale: Cách chọn giữ gần hình thức và sắc thái của γίνεται trong văn bản nguồn, dù tiếng Việt 'không còn là ân điển' tự nhiên hơn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng 'ân điển' là thuật ngữ Kinh Thánh quen thuộc; câu giữ phép đối xứng và lối lập luận cô đọng của nguyên văn.
