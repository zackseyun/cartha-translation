id: ROM.11.11
reference: Romans 11:11
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Λέγω οὖν, μὴ ἔπταισαν ἵνα πέσωσιν; μὴ γένοιτο· ἀλλὰ τῷ αὐτῶν παραπτώματι ἡ σωτηρία τοῖς ἔθνεσιν, εἰς τὸ παραζηλῶσαι αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/011.yaml
  text: So I say[a], they did not stumble so as to fall, did they? May it never be! Rather, by their trespass salvation has come to the Gentiles[d][c][b], to make them jealous.
translation:
  language: vi
  text: 'Vậy tôi hỏi: Lẽ nào họ đã vấp chân để ngã xuống sao? Tuyệt đối không! Trái lại, bởi sự vi phạm của họ[b], sự cứu rỗi đã đến với các dân ngoại[c], để khơi dậy lòng ghen tị nơi họ[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'Cũng có thể dịch: “qua sự phạm lỗi của họ.”'
    reason: lexical_alternative
  - marker: c
    text: Nguyên văn Hy Lạp là “các dân tộc”; trong ngữ cảnh này, “các dân ngoại” chỉ những dân không phải người Do Thái.
    reason: lexical_alternative
  - marker: d
    text: 'Cũng có thể dịch: “để khiến họ ghen tị” hoặc “để khơi dậy lòng ghen tị nơi họ.” Ý này có thể bao gồm việc thôi thúc họ mong muốn cùng một sự cứu rỗi.'
    reason: alternative_reading
lexical_decisions:
- source_word: Λέγω οὖν
  choice: Vậy tôi hỏi
  rationale: Trong mạch lập luận, cụm này mở đầu một câu hỏi tu từ. “Vậy tôi hỏi” diễn đạt tự nhiên chức năng diễn ngôn của λέγω và giữ được ý suy luận của οὖν.
- source_word: μὴ ἔπταισαν
  choice: Có phải họ đã vấp chân ... không?
  rationale: μή trong câu hỏi với động từ chỉ định cho thấy câu trả lời được mong đợi là phủ định. “Có phải ... không?” giữ hình thức câu hỏi tu từ, còn “vấp chân” bảo tồn hình ảnh của πταίω và phân biệt với hành động ngã xuống.
- source_word: ἵνα πέσωσιν
  choice: để ngã xuống
  rationale: ἵνα với lối giả định có thể chỉ mục đích hoặc kết quả; “để” duy trì độ mở ấy. Bản dịch không thêm các ý như “hoàn toàn” hay “không thể phục hồi,” vốn không được nói rõ trong câu Hy Lạp.
- source_word: μὴ γένοιτο
  choice: Tuyệt đối không!
  rationale: Đây là lời bác bỏ mạnh quen thuộc của Phao-lô. Cách nói này tự nhiên trong tiếng Việt hiện đại và giữ được sức nhấn mạnh, dù không mô phỏng nguyên dạng cầu khiến của tiếng Hy Lạp.
- source_word: τῷ αὐτῶν παραπτώματι
  choice: bởi sự vi phạm của họ
  rationale: παράπτωμα chỉ một bước sai, lỗi phạm hoặc sự vi phạm. “Sự vi phạm” rõ nghĩa, có trọng lượng luân lý và không quá chuyên biệt; “bởi” diễn đạt cách hiểu công cụ/nguyên nhân của cách ba.
- source_word: ἡ σωτηρία
  choice: sự cứu rỗi
  rationale: Trong thư Rô-ma, σωτηρία mang nội dung cứu độ rõ rệt; “sự cứu rỗi” là cách diễn đạt quen thuộc và phù hợp ngữ cảnh.
- source_word: τοῖς ἔθνεσιν
  choice: các dân ngoại
  rationale: Trong thế đối chiếu Do Thái–ngoại bang ở Rô-ma 9–11, ἔθνη chỉ các dân không thuộc dân Do Thái. “Các dân ngoại” truyền đạt đúng nghĩa theo ngữ cảnh, còn nghĩa sát chữ “các dân tộc” được ghi ở chú thích.
- source_word: εἰς τὸ παραζηλῶσαι αὐτούς
  choice: để khiến họ ghen tức
  rationale: εἰς với động từ nguyên mẫu có mạo từ biểu thị mục đích hoặc kết quả. παραζηλόω có thể nói đến việc khơi dậy lòng ghen hoặc sự muốn noi theo; “khiến họ ghen tức” giữ cách nói trực tiếp mà không tự ý giải thích động cơ là hoàn toàn tiêu cực hay tích cực.
theological_decisions:
- issue: Sự vấp chân của Israel có được mô tả là một kết cục cuối cùng, không thể đảo ngược hay không
  choice: Giữ riêng hai hình ảnh “vấp chân” và “ngã xuống,” đồng thời để câu hỏi tu từ phủ nhận rằng sự vấp chân nhằm dẫn đến việc ngã xuống.
  alternative: Diễn giải rõ thành “ngã hoàn toàn,” “hư mất vĩnh viễn” hoặc “ngã không thể phục hồi.”
  rationale: Bản Hy Lạp phân biệt πταίω với πίπτω nhưng không trực tiếp thêm các ý “hoàn toàn,” “vĩnh viễn” hay “không thể phục hồi.” Bản dịch vì thế bảo tồn sự căng thẳng thần học thay vì quyết định thay cho văn bản.
- issue: Ý nghĩa của ngôn ngữ ghen tức trong chương trình cứu rỗi
  choice: Dịch trực tiếp là “khiến họ ghen tức,” để ngỏ việc lòng ghen ấy có thể thúc đẩy họ tìm kiếm cùng một sự cứu rỗi.
  alternative: Giải thích hẳn là lòng đố kỵ tiêu cực, hoặc đổi thành sự thi đua/noi theo hoàn toàn tích cực.
  rationale: παραζηλόω có thể bao gồm cả việc khơi dậy lòng ghen lẫn thôi thúc muốn có được phước lành tương tự. Bản chính không thu hẹp sắc thái; chú thích nêu khả năng rộng hơn.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Cấu trúc câu hỏi tu từ được diễn đạt tự nhiên; các hình ảnh “vấp chân” và “ngã xuống” được giữ riêng. Các thuật ngữ “sự cứu rỗi” và “các dân ngoại” phù hợp ngữ cảnh thư Rô-ma, với nghĩa gốc được làm rõ trong chú thích.
