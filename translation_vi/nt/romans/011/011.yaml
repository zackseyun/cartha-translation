  to: 'Vậy tôi hỏi: Lẽ nào họ đã vấp chân để ngã xuống sao? Tuyệt đối không! Trái lại, bởi sự vi phạm của họ[b], sự cứu rỗi đã đến với các dân ngoại[c], để khơi dậy lòng ghen tị nơi họ[d].'
  rationale: Sửa câu hỏi tu từ để phản ánh rõ hơn câu hỏi phủ định trong tiếng Hy Lạp, và thay cách diễn đạt về παραζηλόω bằng tiếng Việt chính xác, tự nhiên hơn. Chú thích a không còn cần thiết vì câu chính đã trực tiếp giữ sự phân biệt “vấp chân”/“ngã xuống” và lực phủ định; các chú thích còn lại được giữ hoặc điều chỉnh để bảo tồn các khả năng từ vựng quan trọng.
