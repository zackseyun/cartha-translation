- from: Nguyện mắt họ tối lại để không thấy được, và xin Ngài cứ làm cho lưng họ còng xuống.[a]
  to: Nguyện mắt họ tối đi để không thấy được, và xin hãy luôn uốn cong lưng họ.[a]
  rationale: Loại bỏ ý không có trong nguyên văn ở “tối lại,” thay cách diễn đạt khẩu ngữ “cứ” bằng “luôn,” và dùng “uốn cong” để phản ánh sát hơn σύγκαμψον. Vẫn giữ lời cầu khiến và tác nhân được ngỏ lời ở ngôi thứ hai mà không thêm định danh thần học vào bản văn.
