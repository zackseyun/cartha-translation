source:
  edition: SBLGNT
  text: σκοτισθήτωσαν οἱ ὀφθαλμοὶ αὐτῶν τοῦ μὴ βλέπειν, καὶ τὸν νῶτον αὐτῶν διὰ παντὸς σύγκαμψον.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/010.yaml
  text: Let their eyes be darkened so that they may not see[b][a], and bend their back continually.
translation:
  language: vi
  text: Nguyện mắt họ tối đi để không thấy được, và xin hãy luôn uốn cong lưng họ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “và xin hãy liên tục uốn cong lưng họ.” Cụm từ Hy Lạp có thể chỉ sự liên tục hoặc thường xuyên.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σκοτισθήτωσαν
  choice: Nguyện ... tối lại
  rationale: Động từ mệnh lệnh thụ động ngôi thứ ba mang sắc thái cầu khiến. “Tối lại” giữ nguyên hình ảnh bóng tối của nguyên văn, thay vì diễn giải thẳng thành “mù đi”.
- source_word: οἱ ὀφθαλμοὶ αὐτῶν
  choice: mắt họ
  rationale: Cách diễn đạt trực tiếp, tự nhiên trong tiếng Việt và giữ hình ảnh thân thể làm trung tâm của câu.
- source_word: τοῦ μὴ βλέπειν
  choice: để không thấy được
  rationale: Cấu trúc động từ nguyên mẫu có mạo từ với μή có thể chỉ mục đích hoặc kết quả; “để không thấy được” giữ được độ mở ấy mà không phân định quá mức.
- source_word: τὸν νῶτον αὐτῶν
  choice: lưng họ
  rationale: Giữ danh từ số ít mang nghĩa phân phối như trong tiếng Hy Lạp; cách nói này cũng tự nhiên trong tiếng Việt.
- source_word: διὰ παντός
  choice: cứ
  rationale: Trong kết cấu “cứ làm cho ... còng xuống,” từ này diễn tả tình trạng liên tục hoặc thường xuyên mà không hàm ý mạnh hơn là “đời đời”.
- source_word: σύγκαμψον
  choice: xin Ngài ... làm cho ... còng xuống
  rationale: Mệnh lệnh chủ động hướng đến Đức Chúa Trời trong lời trích dẫn. “Làm cho lưng ... còng xuống” truyền đạt hình ảnh bị uốn cong, khom xuống; thêm “xin Ngài” làm rõ chủ thể được trực tiếp cầu xin vốn hàm ẩn trong động từ ngôi thứ hai.
theological_decisions:
- issue: Lời cầu khiến về sự phán xét và tác nhân thần linh
  choice: 'Giữ dạng lời cầu khiến: “Nguyện ... và xin Ngài ...”'
  alternative: Chuyển thành lời tiên báo (“mắt họ sẽ tối lại”) hoặc làm mờ tác nhân bằng một hệ quả bị động
  rationale: Câu trích dẫn giữ sức nặng của một lời cầu xin/phán quyết hướng đến Đức Chúa Trời. Bản dịch không làm nhẹ thành dự báo đơn thuần, cũng không thêm lời giải thích thần học ngoài văn bản.
- issue: Mục đích hay kết quả trong τοῦ μὴ βλέπειν
  choice: Dùng “để không thấy được”
  alternative: Diễn giải dứt khoát là “đến nỗi không thấy được” hoặc “nhằm khiến họ không thấy được”
  rationale: Nguyên văn có thể biểu đạt mục đích hoặc kết quả; cách dịch được chọn bảo tồn sự căng mở này.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. “Nguyện” cùng “xin Ngài” duy trì sắc thái cầu khiến của lời trích dẫn; “còng xuống” giữ hình ảnh thân thể rõ ràng trong tiếng Việt. Dấu chú thích [a] được đặt ngay sau mệnh đề liên quan.
