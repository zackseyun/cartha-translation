review_pass:
  verdict: revise
  source_fidelity: Bản nháp giữ đúng lực cầu khiến của hai mệnh lệnh và hình ảnh mắt/lưng. Tuy nhiên, “tối lại” thêm sắc thái ‘trở lại’ không có trong σκοτισθήτωσαν; “cứ” hơi khẩu ngữ và không biểu đạt rõ bằng “luôn” ý διὰ παντός. “Còng xuống” nghiêng về tình trạng gù/còng hơn là hành động ‘uốn cong’ của σύγκαμψον.
  naturalness: Câu sửa vẫn trang trọng, hiện đại, và mạch lạc. “Nguyện ... và xin hãy ...” diễn đạt tự nhiên hai vế cầu khiến trong tiếng Việt; “luôn” rõ nghĩa hơn “cứ” trong văn phong Kinh Thánh hiện đại.
  terminology: Giữ “Nguyện,” “mắt họ,” và “lưng họ.” Dùng “uốn cong” để sát với hình ảnh thân thể của σύγκαμψον, không diễn giải thành một tình trạng bệnh lý hay tư thế cố định.
  issues:
  - severity: medium
    issue: “tối lại” thêm ý ‘lại/trở lại’.
    rationale: σκοτισθήτωσαν có nghĩa là ‘hãy bị làm cho tối/được tối đi’; nguyên văn không biểu thị một sự trở lại trạng thái tối.
  - severity: low
    issue: “cứ” chưa phản ánh rõ διὰ παντός trong thanh giọng trang trọng.
    rationale: διὰ παντός chỉ sự liên tục/thường xuyên; “luôn” trực tiếp và tự nhiên hơn trong ngữ cảnh này.
  - severity: low
    issue: “làm cho lưng họ còng xuống” diễn giải mạnh hơn động từ ‘uốn cong’.
    rationale: σύγκαμψον trực tiếp nói đến việc bẻ/uốn cong lưng; “uốn cong” giữ hình ảnh và tác động của nguyên văn sát hơn.
  revised_text: Nguyện mắt họ tối đi để không thấy được, và xin hãy luôn uốn cong lưng họ.[a]
