  terminology: “Đồng bào ruột thịt của tôi” chuyển đạt phù hợp σάρξ theo nghĩa bà con tự nhiên/đồng bào dân tộc, không lẫn với nghĩa đạo đức của “xác thịt.” “Cứu được” bảo toàn sắc thái cứu rỗi và tình trạng chưa chắc chắn của mệnh đề.
