  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εἴ πως παραζηλώσω μου τὴν σάρκα καὶ σώσω τινὰς ἐξ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/014.yaml
  text: if somehow I may provoke my own people to jealousy and save some of them[a].
translation:
  language: vi
  text: nếu bằng cách nào đó tôi có thể khơi dậy lòng ganh tị trong đồng bào ruột thịt của tôi và cứu được một số người trong họ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “thịt của tôi,” nghĩa là những người cùng huyết thống và dân tộc với Phao-lô, tức các đồng bào Do Thái của ông.'
    reason: Giải thích thành ngữ Hy Lạp μου τὴν σάρκα và làm rõ đối tượng trong văn cảnh.
lexical_decisions:
- source_word: εἴ πως
  choice: nếu bằng cách nào đó
  rationale: Diễn đạt niềm hy vọng hay mục đích chưa chắc chắn của Phao-lô, đồng thời giữ sắc thái dò tìm phương cách của cụm Hy Lạp.
- source_word: παραζηλώσω
  choice: tôi có thể khơi lòng ganh tị nơi
  rationale: Giữ ý gây nên lòng ganh tị và sự liên kết với chủ đề dân Israel được khơi lòng ganh tị bởi việc dân ngoại được tiếp nhận trong văn cảnh.
- source_word: μου τὴν σάρκα
  choice: đồng bào ruột thịt của tôi
  rationale: Trong ngữ cảnh này, thành ngữ nghĩa đen là 'thịt của tôi' chỉ những người cùng huyết thống và dân tộc với Phao-lô. 'Đồng bào ruột thịt' truyền đạt cả quan hệ dân tộc lẫn hình ảnh thân thuộc tự nhiên mà không khiến câu tiếng Việt trở nên khó hiểu.
- source_word: σώσω
  choice: cứu được
  rationale: Giữ trọng lượng cứu rỗi thường có của động từ trong cách dùng của Phao-lô; 'được' giúp câu tiếng Việt diễn đạt kết quả Phao-lô hy vọng đạt tới.
- source_word: τινὰς ἐξ αὐτῶν
  choice: một số người trong họ
  rationale: Diễn đạt rõ một bộ phận được rút ra từ nhóm đồng bào vừa nói đến.
theological_decisions:
- issue: Ý nghĩa của σάρξ khi Phao-lô nói về nhóm dân tộc của mình
  choice: Hiểu theo nghĩa quan hệ huyết thống/dân tộc và dịch là 'đồng bào ruột thịt của tôi'
  alternative: Dịch sát hình thức là 'thịt của tôi' hoặc diễn giải rõ là 'những người Do Thái đồng bào với tôi'
  rationale: Ở đây σάρξ không chỉ bản tính tội lỗi nhưng chỉ bà con tự nhiên của Phao-lô, tức đồng bào Israel. Bản dịch chính giữ nét quan hệ ruột thịt mà vẫn tự nhiên; chú thích nêu hình thức sát chữ và đối tượng trong văn cảnh.
- issue: Vai trò của Phao-lô trong việc 'cứu' một số người
  choice: Giữ ngôi thứ nhất trực tiếp 'tôi... cứu được' như nguyên văn
  alternative: Diễn giải là 'để một số người nhờ đó được cứu'
  rationale: Nguyên văn quy hành động σώσω cho Phao-lô theo nghĩa công cụ trong chức vụ của ông. Không nên âm thầm làm yếu hoặc giải quyết căng thẳng thần học bằng thể bị động.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cụm 'đồng bào ruột thịt' giữ được sắc thái thân tộc của σάρξ mà tránh cách dịch sát 'thịt của tôi' vốn không tự nhiên và dễ gây hiểu lầm trong tiếng Việt. Dấu chú thích [a] xuất hiện trong câu chính.
