id: ROM.11.21
reference: Romans 11:21
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εἰ γὰρ ὁ θεὸς τῶν κατὰ φύσιν κλάδων οὐκ ἐφείσατο, ⸀οὐδὲ σοῦ φείσεται.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/021.yaml
  text: For if God did not spare the natural branches[a], neither will he spare you.
translation:
  language: vi
  text: Vì nếu Đức Chúa Trời đã không dung tha các cành tự nhiên[a], thì Ngài cũng sẽ không dung tha bạn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “các cành theo tự nhiên”; sát nghĩa: “các cành theo tự nhiên.”'
    reason: Nêu cách dịch sát cấu trúc của κατὰ φύσιν, đồng thời giữ cách dịch chính gọn và tự nhiên trong tiếng Việt.
lexical_decisions:
- source_word: εἰ γὰρ
  choice: Vì nếu
  rationale: Giữ cả quan hệ giải thích của γάρ và điều kiện của εἰ, đồng thời nối tự nhiên với lập luận trước đó.
- source_word: ὁ θεὸς
  choice: Đức Chúa Trời
  rationale: Cách gọi trang trọng, quen thuộc trong tiếng Việt đối với θεός khi chỉ Đức Chúa Trời.
- source_word: τῶν κατὰ φύσιν κλάδων
  choice: các cành vốn thuộc về cây theo tự nhiên
  rationale: Diễn đạt κατὰ φύσιν như sự thuộc về tự nhiên trong ẩn dụ cây ô-liu, tránh khiến người đọc hiểu rằng bản thân các cành có một phẩm tính gọi là 'tự nhiên'.
- source_word: οὐκ ἐφείσατο
  choice: đã không dung tha
  rationale: ‘Dung tha’ truyền đạt đúng ý không miễn trừ khỏi sự xử lý hay tổn hại và giữ được phép đối xứng với mệnh đề sau.
- source_word: οὐδὲ σοῦ φείσεται
  choice: thì Ngài cũng sẽ không dung tha bạn
  rationale: ‘Cũng ... không’ thể hiện liên kết phủ định của οὐδέ; ‘bạn’ giữ ngôi thứ hai số ít của σοῦ và lời cảnh báo trực tiếp.
theological_decisions:
- issue: Đối tượng được chỉ bởi ‘các cành vốn thuộc về cây theo tự nhiên’
  choice: Giữ nguyên hình ảnh các cành trong câu chính, không diễn giải trực tiếp là dân Israel.
  alternative: Dịch giải nghĩa thành ‘dân Israel, là các cành tự nhiên’.
  rationale: Văn cảnh cho thấy hình ảnh này chỉ Israel, nhưng câu Hy Lạp vẫn diễn đạt bằng ẩn dụ; bản dịch không nên biến cách hiểu theo văn cảnh thành lời giải thích trong chính câu.
- issue: Phạm vi và ý nghĩa thần học của lời cảnh báo dành cho ‘bạn’
  choice: Giữ lời cảnh báo trực tiếp ở ngôi thứ hai số ít mà không thêm điều kiện hay hệ thống thần học.
  alternative: Giải thích ‘bạn’ theo nghĩa hoàn toàn cá nhân hoặc hoàn toàn tập thể, hay thêm cách hiểu về sự cứu rỗi và bền đỗ.
  rationale: σοῦ là số ít và lời cảnh báo có sức nặng thực sự, nhưng câu này tự nó không giải quyết các tranh luận về sự tuyển chọn, bội đạo hoặc phạm vi cá nhân so với tập thể.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng ‘Đức Chúa Trời’ và đại từ ‘Ngài’ theo lối văn Kinh Thánh phổ thông; dùng ‘bạn’ để giữ ngôi thứ hai số ít và tính trực tiếp của lời cảnh báo.
