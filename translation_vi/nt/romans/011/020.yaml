id: ROM.11.20
reference: Romans 11:20
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καλῶς· τῇ ἀπιστίᾳ ἐξεκλάσθησαν, σὺ δὲ τῇ πίστει ἕστηκας. μὴ ⸂ὑψηλὰ φρόνει⸃, ἀλλὰ φοβοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/020.yaml
  text: 'Quite right: they were broken off because of unbelief[a], but you stand by faith. Do not be arrogant[d][c][b], but fear.'
translation:
  language: vi
  text: 'Đúng vậy[a]: họ đã bị bẻ lìa vì không tin, còn bạn đứng vững nhờ đức tin[b]. Đừng tự cao[c], nhưng hãy sợ[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Phải” hoặc “Điều đó đúng.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “bởi đức tin,” “qua đức tin” hoặc “nhờ sự tin cậy.”'
    reason: alternative_reading
  - marker: c
    text: 'Cũng có thể dịch: “Đừng có tư tưởng cao ngạo” hoặc “đừng suy nghĩ kiêu căng.”'
    reason: lexical_alternative
  - marker: d
    text: Tức là hãy kính sợ và thận trọng cách khiêm nhường trước Đức Chúa Trời, thay vì tự phụ kiêu ngạo.
    reason: lexical_alternative
lexical_decisions:
- source_word: καλῶς
  choice: Đúng vậy
  rationale: 'Trong mạch đối thoại với lời khẳng định ở câu trước, từ này biểu thị sự thừa nhận: điều vừa nói là đúng. “Đúng vậy” tự nhiên và giữ được sắc thái tán thành.'
- source_word: ἀπιστίᾳ
  choice: vì không tin
  rationale: Dạng tặng cách ở đây mang ý nghĩa nguyên nhân hoặc phương tiện. Cách dịch này nêu rõ sự không tin là lý do họ bị bẻ lìa, đồng thời tạo thế đối lập tự nhiên với “đức tin”.
- source_word: ἐξεκλάσθησαν
  choice: đã bị bẻ lìa
  rationale: Giữ nguyên hình ảnh các nhánh ô-liu trong văn cảnh. Thể bị động và thời quá khứ được thể hiện rõ, còn “bẻ lìa” diễn đạt cụ thể việc nhánh bị tách khỏi cây.
- source_word: πίστει
  choice: nhờ đức tin
  rationale: Dạng tặng cách chỉ phương tiện hoặc cơ sở của việc đứng vững. “Đức tin” là cách dịch chuẩn, còn “nhờ” diễn đạt tự nhiên ý nghĩa phương tiện trong tiếng Việt.
- source_word: ἕστηκας
  choice: đứng vững
  rationale: Thể hoàn thành diễn tả tình trạng hiện tại phát sinh từ hành động trước đó. “Đứng vững” vừa tự nhiên trong tiếng Việt vừa giữ hình ảnh và sắc thái về tình trạng đang được duy trì.
- source_word: ὑψηλὰ φρόνει
  choice: tự cao
  rationale: Thành ngữ Hy Lạp nói đến việc nghĩ cao về chính mình. “Tự cao” ngắn gọn, hiện đại và truyền đạt đúng lời cảnh báo chống kiêu ngạo.
- source_word: φοβοῦ
  choice: hãy sợ
  rationale: Giữ sức nặng trực tiếp của mệnh lệnh và không làm nhẹ thành chỉ “tôn trọng.” Chú thích làm rõ sắc thái kính sợ, thận trọng trong văn cảnh mà không loại bỏ sự căng thẳng của từ “sợ”.
theological_decisions:
- issue: Ý nghĩa của πίστις trong thế đối lập với ἀπιστία
  choice: đức tin
  alternative: sự tin cậy; lòng trung tín
  rationale: Thế đối lập trực tiếp với “không tin” cho thấy đây chủ yếu là sự đáp ứng tin cậy của con người. Tuy vậy, chú thích vẫn bảo lưu “sự tin cậy” như một cách diễn đạt khả hữu, còn “lòng trung tín” không được đưa vào chính văn vì ít phù hợp hơn trong ngữ cảnh này.
- issue: Sắc thái của φοβοῦ
  choice: hãy sợ
  alternative: hãy kính sợ; hãy lo sợ
  rationale: Bản dịch giữ nguyên lời cảnh báo sắc bén trước sự tự phụ, không thu hẹp nó thành sự tôn kính đơn thuần cũng không cường điệu thành nỗi hoảng loạn. Chú thích giải thích sắc thái kính sợ và thận trọng trước Đức Chúa Trời.
translation_notes:
  register: Văn phong hiện đại, trang trọng nhưng dễ hiểu. Đại từ “bạn” giữ lối xưng hô số ít của nguyên văn, trong đó Phao-lô nói trực tiếp với người ngoại điển hình. Câu văn giữ phép ẩn dụ về cây ô-liu và sự đối lập cân xứng giữa “không tin” với “đức tin,” giữa “tự cao” với “sợ.”
