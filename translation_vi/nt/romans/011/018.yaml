source:
  edition: SBLGNT
  text: μὴ κατακαυχῶ τῶν κλάδων· εἰ δὲ κατακαυχᾶσαι, οὐ σὺ τὴν ῥίζαν βαστάζεις ἀλλὰ ἡ ῥίζα σέ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/018.yaml
  text: do not boast over the branches[a]. But if you do boast, it is not you who support the root[b], but the root supports you.
translation:
  language: vi
  text: Đừng khoe mình hơn các nhánh ấy.[a] Nhưng nếu bạn khoe mình hơn các nhánh ấy, thì không phải bạn nâng đỡ rễ, mà chính rễ nâng đỡ bạn.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đừng khoe khoang chống lại các nhánh ấy.”'
    reason: lexical_alternative
  - marker: b
    text: 'Hay: “không phải bạn mang rễ, mà rễ mang bạn.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατακαυχῶ / κατακαυχᾶσαι
  choice: khoe mình hơn / khoe mình
  rationale: Động từ chỉ việc tự hào hoặc khoe khoang với hàm ý đặt mình cao hơn hay chống lại đối tượng. “Khoe mình hơn” truyền đạt quan hệ hơn-thua trong κατά một cách tự nhiên; lần thứ hai dùng “nếu bạn khoe mình” theo đúng cấu trúc điều kiện.
- source_word: τῶν κλάδων
  choice: các nhánh ấy
  rationale: “Các nhánh ấy” quy chiếu đến những nhánh cụ thể trong hình ảnh cây ô-liu ở văn cảnh trước, đồng thời phù hợp cách biểu đạt tự nhiên của tiếng Việt.
- source_word: τὴν ῥίζαν / ἡ ῥίζα
  choice: rễ
  rationale: Giữ nhất quán hình ảnh rễ cây trong cả hai lần xuất hiện và không diễn giải rễ tượng trưng cho ai hay điều gì.
- source_word: βαστάζεις
  choice: nâng đỡ
  rationale: Trong ẩn dụ cây ô-liu, từ này diễn tả việc mang và duy trì sự sống. “Nâng đỡ” vừa tự nhiên vừa giữ được ý về sự lệ thuộc và hỗ trợ.
- source_word: οὐ σὺ ... ἀλλὰ ἡ ῥίζα σέ
  choice: không phải bạn nâng đỡ rễ, mà chính rễ nâng đỡ bạn
  rationale: Cấu trúc “không phải... mà chính...” bảo toàn sự nhấn mạnh tương phản giữa “bạn” và “rễ”, cũng như sự đảo ngược quan hệ lệ thuộc.
- source_word: μὴ
  choice: đừng
  rationale: “Đừng” là lối cấm đoán trực tiếp, tự nhiên trong tiếng Việt hiện đại và không diễn giải quá mức thể hiện tại của mệnh lệnh.
theological_decisions:
- issue: Ý nghĩa ẩn dụ của rễ và các nhánh trong hình ảnh cây ô-liu
  choice: Giữ nguyên ẩn dụ, không xác định cụ thể rễ hoặc các nhánh tượng trưng cho ai trong chính văn.
  alternative: Diễn giải rễ là các tổ phụ, Áp-ra-ham hoặc các lời hứa giao ước.
  rationale: Bản Hy Lạp chỉ nêu hình ảnh ẩn dụ. Việc xác định cụ thể sẽ đưa lời giải nghĩa thần học vào bản dịch và làm mất độ mở mà văn bản duy trì.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và trực tiếp. Đại từ “bạn” phù hợp lời nói hướng đến người đọc ở ngôi số ít trong văn cảnh. “Khoe mình hơn” tránh sắc thái tích cực thường có của “tự hào” và giữ ý tự tôn trước các nhánh khác.
