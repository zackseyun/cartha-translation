  - severity: low
    issue: Mệnh đề điều kiện «nếu bạn khoe mình» không lặp lại rõ quan hệ với các nhánh.
    rationale: Κατακαυχᾶσαι lặp lại cùng động từ ở câu trước; thêm «hơn các nhánh ấy» giữ được đối tượng và sắc thái tự đề cao của động từ mà bản dịch đã chọn.
