  source_fidelity: 'Bản dịch giữ đúng mệnh lệnh phủ định, hình ảnh «các nhánh» và «rễ», cùng thế tương phản nhấn mạnh: không phải người đọc nâng đỡ rễ, nhưng rễ nâng đỡ người đọc. Tuy nhiên, từ «thì» ở đầu câu không có tương ứng trong câu Hy Lạp của câu này và tạo cảm giác câu bị lệ thuộc vào mệnh đề trước. Lần lặp δεύτε của κατακαυχᾶσαι cũng nên giữ rõ đối tượng/ý hơn-thua như lần đầu.'
  naturalness: «Đừng khoe mình hơn các nhánh ấy» là cách nói hiện đại, dễ hiểu và có sắc thái cảnh báo phù hợp. Bỏ «thì» đầu câu làm câu độc lập, tự nhiên hơn. Lặp lại «hơn các nhánh ấy» trong mệnh đề điều kiện giúp câu chặt chẽ mà không thành gượng ép.
  terminology: «Các nhánh ấy», «rễ», và «nâng đỡ» nhất quán với ẩn dụ cây ô-liu và không diễn giải căn tính biểu tượng của chúng. «Khoe mình hơn» phản ánh thích đáng sắc thái tự đề cao hơn/chống lại của κατακαυχάομαι; chú thích nêu phương án «chống lại» hữu ích.
