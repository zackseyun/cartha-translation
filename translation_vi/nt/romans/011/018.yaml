  to: Đừng khoe mình hơn các nhánh ấy.[a] Nhưng nếu bạn khoe mình hơn các nhánh ấy, thì không phải bạn nâng đỡ rễ, mà chính rễ nâng đỡ bạn.[b]
  rationale: Chỉnh sửa chỉ loại bỏ từ nối không có trong nguyên ngữ và làm rõ sự lặp lại của động từ «khoe mình hơn» trong mệnh đề điều kiện. Hình ảnh ẩn dụ, tương phản nhấn mạnh, và các phương án chú thích được giữ nguyên.
