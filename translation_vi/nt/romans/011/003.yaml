revisions:
- from: “Lạy Chúa, họ đã giết các nhà tiên tri của Ngài, phá đổ các bàn thờ của Ngài; chỉ còn lại một mình con, mà họ cũng đang tìm cách lấy mạng con[a].”
  to: “Lạy Chúa, họ đã giết các nhà tiên tri của Ngài, phá đổ các bàn thờ của Ngài; chỉ còn lại một mình con, và họ đang tìm cách lấy mạng con[a].”
  rationale: Bản sửa chỉ loại bỏ sắc thái đối lập/phụ gia không được đánh dấu trong καί và làm chú thích nhất quán với ngôi xưng của lời thưa. Cách dịch thành ngữ chính vẫn giữ ý ψυχή là “mạng sống”, không phải “linh hồn”.
  reviewer_model: gpt-5.6-terra
