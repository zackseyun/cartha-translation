source:
  edition: SBLGNT
  text: Κύριε, τοὺς προφήτας σου ἀπέκτειναν, ⸀τὰ θυσιαστήριά σου κατέσκαψαν, κἀγὼ ὑπελείφθην μόνος, καὶ ζητοῦσιν τὴν ψυχήν μου.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/003.yaml
  text: Lord[a], they killed your prophets, they tore down your altars, and I alone was left, and they are seeking my life.
translation:
  language: vi
  text: “Lạy Chúa, họ đã giết các nhà tiên tri của Ngài, phá đổ các bàn thờ của Ngài; chỉ còn lại một mình con, và họ đang tìm cách lấy mạng con[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sát nghĩa hơn: “họ đang tìm kiếm mạng sống của con”; đây là một thành ngữ có nghĩa là họ đang tìm cách giết con.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Κύριε
  choice: Lạy Chúa
  rationale: Đây là hô cách của κύριος trong lời trực tiếp thưa với Đức Chúa Trời. “Lạy Chúa” tự nhiên, trang trọng và thể hiện đúng sắc thái xưng hô trong tiếng Việt.
- source_word: ἀπέκτειναν
  choice: đã giết
  rationale: Động từ ở thì aorist diễn tả hành động giết các nhà tiên tri. “Đã giết” rõ ràng và không thêm sắc thái pháp lý hay đạo đức vượt quá từ Hy Lạp.
- source_word: τοὺς προφήτας σου
  choice: các nhà tiên tri của Ngài
  rationale: “Các nhà tiên tri” là cách gọi hiện đại, dễ hiểu cho προφήτας; “của Ngài” giữ quan hệ sở hữu và lối xưng hô tôn kính với Đức Chúa Trời.
- source_word: τὰ θυσιαστήριά σου
  choice: các bàn thờ của Ngài
  rationale: θυσιαστήριον chỉ bàn thờ dùng cho việc dâng tế lễ. “Bàn thờ” đã đủ rõ trong ngữ cảnh và tránh lối diễn đạt nặng nề.
- source_word: κατέσκαψαν
  choice: phá đổ
  rationale: κατασκάπτω mang ý san phá hoặc triệt hạ một công trình. “Phá đổ” vừa cụ thể vừa tự nhiên khi nói về các bàn thờ.
- source_word: κἀγὼ ὑπελείφθην μόνος
  choice: chỉ còn lại một mình con
  rationale: Cách diễn đạt này giữ ý Ê-li tự nhận mình là người duy nhất còn lại, đồng thời dùng đại từ “con” tự nhiên trong lời thưa với Đức Chúa Trời.
- source_word: ζητοῦσιν τὴν ψυχήν μου
  choice: họ cũng đang tìm cách lấy mạng con
  rationale: Trong thành ngữ này, ψυχή nói đến mạng sống, còn ζητοῦσιν diễn tả hành động đang tiếp diễn. “Tìm cách lấy mạng con” truyền đạt tự nhiên ý họ muốn giết Ê-li; “cũng” thể hiện lực nối của καί trong mạch câu.
theological_decisions:
- issue: Cách hiểu ψυχή trong thành ngữ chỉ sự đe dọa tính mạng
  choice: mạng con
  alternative: linh hồn con
  rationale: Trong ngữ cảnh, cụm từ nói đến việc truy sát Ê-li, không trình bày giáo lý về phần phi vật chất của con người. “Mạng con” giữ đúng ý của thành ngữ mà không đưa thêm một lập trường nhân học thần học vào câu.
- issue: Tính độc nhất trong μόνος
  choice: chỉ còn lại một mình con
  alternative: con bị bỏ lại cô độc
  rationale: μόνος nhấn mạnh nhận thức của Ê-li rằng chỉ mình ông còn lại. Bản dịch tránh biến câu thành lời chủ yếu nói về cảm giác cô đơn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Lạy Chúa” và cặp đại từ “Ngài/con” cho lời cầu thưa trực tiếp. Dấu chấm phẩy giúp giữ nhịp liệt kê của nguyên văn mà không làm câu tiếng Việt rời rạc. Dấu chú thích [a] được đặt ngay sau cụm từ mà chú thích giải thích.
