  source_fidelity: 'Bản nháp giữ đúng cấu trúc điều kiện, hình ảnh cành bị bẻ, cây ô-liu hoang được ghép vào, và không diễn giải ẩn dụ thành một lập trường thần học. Tuy nhiên, “phần rễ, tức nguồn màu mỡ” đặt quan hệ giải thích mà tiếng Hy Lạp không xác định: πιότητος không nhất thiết là “nguồn” của rễ. Cần giữ hai yếu tố “rễ” và “sự màu mỡ” song song trong bản chính, đồng thời bảo lưu cách đọc “rễ màu mỡ” ở chú thích.'
  naturalness: “Cùng dự phần vào” tự nhiên và chính xác hơn “được cùng chia sẻ”, vì ἐγένου biểu thị việc trở thành/đi vào một tư cách mới. “Sự màu mỡ của cây ô-liu” là cách diễn đạt hiện đại, rõ nghĩa trong ẩn dụ làm vườn.
  terminology: Giữ “cây ô-liu hoang”, “được ghép vào”, và “cành” là phù hợp. “Người cùng dự phần” chuyển tải συγκοινωνός mà không thêm diễn giải giáo lý. Chú thích b cần phản ánh đúng khả năng cú pháp, thay vì biến “tức” của bản chính thành cách hiểu chính.
