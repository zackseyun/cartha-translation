id: ROM.11.17
reference: Romans 11:17
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Εἰ δέ τινες τῶν κλάδων ἐξεκλάσθησαν, σὺ δὲ ἀγριέλαιος ὢν ἐνεκεντρίσθης ἐν αὐτοῖς καὶ συγκοινωνὸς τῆς ⸀ῥίζης τῆς πιότητος τῆς ἐλαίας ἐγένου,
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/017.yaml
  text: But if some of the branches were broken off[a], and you, although being a wild olive tree, were grafted in among them and became a fellow sharer in the root, in the richness of the olive tree[b],
translation:
  language: vi
  text: Nhưng nếu một số cành đã bị bẻ đi, còn bạn vốn là cây ô-liu hoang lại được ghép vào giữa các cành ấy[a] và trở thành người cùng dự phần vào rễ và sự màu mỡ của cây ô-liu[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “được ghép vào giữa chúng.”'
    reason: Đại từ αὐτοῖς có thể được dịch chung là “chúng”; theo ngữ cảnh ẩn dụ, từ này nhiều khả năng chỉ các cành còn lại.
  - marker: b
    text: 'Hoặc: “trở thành người cùng dự phần vào rễ màu mỡ của cây ô-liu”; theo lối dịch truyền thống: “rễ và nhựa béo của cây ô-liu.”'
    reason: Chuỗi sở hữu cách τῆς ῥίζης τῆς πιότητος τῆς ἐλαίας có thể được hiểu là hai đối tượng cùng được dự phần (“rễ và sự màu mỡ”), hoặc là “rễ màu mỡ” của cây ô-liu.
lexical_decisions:
- source_word: Εἰ δέ
  choice: Nhưng nếu
  rationale: Giữ cả ý điều kiện của εἰ và sắc thái tương phản nhẹ của δέ bằng cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: τινες τῶν κλάδων
  choice: một số cành
  rationale: Diễn đạt tự nhiên ý bất định và quan hệ bộ phận của cụm Hy Lạp; 'một số trong các cành' sát hình thức hơn nhưng nặng nề.
- source_word: ἐξεκλάσθησαν
  choice: đã bị bẻ đi
  rationale: Thể bị động aorist trong ẩn dụ về cây; 'bẻ đi' gợi đúng hình ảnh cành bị tách khỏi cây hơn 'chặt bỏ'.
- source_word: σὺ δὲ
  choice: còn bạn
  rationale: '''Còn'' biểu thị sự tương phản với các cành bị bẻ đi; đại từ số ít ''bạn'' giữ cách xưng hô trực tiếp của σὺ.'
- source_word: ἀγριέλαιος ὢν
  choice: vốn là cây ô-liu hoang
  rationale: '''Vốn là'' truyền đạt sắc thái hoàn cảnh, gần với ý nhượng bộ trong ngữ cảnh, đồng thời giữ nguyên ẩn dụ cây ô-liu thay vì giải nghĩa thành dân ngoại.'
- source_word: ἐνεκεντρίσθης
  choice: được ghép vào
  rationale: Thuật ngữ làm vườn tự nhiên trong tiếng Việt, giữ thể bị động.
- source_word: ἐν αὐτοῖς
  choice: vào giữa các cành ấy
  rationale: Đại từ số nhiều nhiều khả năng chỉ các cành còn lại; nêu rõ sở chỉ để tiếng Việt dễ hiểu mà không thay đổi hình ảnh.
- source_word: συγκοινωνὸς ... ἐγένου
  choice: được cùng chia sẻ
  rationale: Diễn đạt việc bước vào tư cách đồng dự phần với những cành khác; 'cùng chia sẻ' tự nhiên hơn danh ngữ cứng như 'người đồng dự phần'.
- source_word: τῆς ῥίζης τῆς πιότητος τῆς ἐλαίας
  choice: phần rễ, tức nguồn màu mỡ của cây ô-liu
  rationale: Chuỗi sở hữu cách có thể hiểu πιότητος là xác định đặc tính hoặc nguồn lợi dưỡng của rễ. Bản chính giữ cả 'rễ' và sự màu mỡ trong một câu tiếng Việt dễ đọc, còn chú thích bảo lưu cách phân tích song song.
theological_decisions:
- issue: Căn tính ẩn dụ của ἀγριέλαιος
  choice: Giữ nguyên hình ảnh 'cây ô-liu hoang'.
  alternative: '''chồi ô-liu hoang'' hoặc diễn giải là ''người ngoại quốc'''
  rationale: Phao-lô lập luận bằng ẩn dụ làm vườn; không nên thay hình ảnh bằng một cách nhận diện thần học đã được diễn giải sẵn. 'Chồi' hợp logic ghép cây nhưng không phải nghĩa bắt buộc của danh từ.
- issue: Quan hệ giữa 'rễ' và 'sự màu mỡ'
  choice: Dịch 'phần rễ, tức nguồn màu mỡ của cây ô-liu', đồng thời ghi cách hiểu song song trong chú thích.
  alternative: '''cùng chia sẻ phần rễ và sự màu mỡ của cây ô-liu'' hoặc ''cùng hưởng phần rễ màu mỡ của cây ô-liu'''
  rationale: Chuỗi τῆς ῥίζης τῆς πιότητος τῆς ἐλαίας cô đọng và có thể được phân tích theo hơn một cách. Bản dịch không biến nó thành một khẳng định giáo lý riêng, còn chú thích công khai giữ sự mơ hồ cú pháp.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng 'ô-liu' theo cách viết thông dụng; giữ câu ở dạng chưa kết thúc bằng dấu phẩy vì câu Hy Lạp tiếp tục sang câu kế tiếp. Các chú thích chỉ nêu những phương án thực sự do từ vựng hoặc cú pháp cho phép.
