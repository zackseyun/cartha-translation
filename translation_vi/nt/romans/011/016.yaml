  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εἰ δὲ ἡ ἀπαρχὴ ἁγία, καὶ τὸ φύραμα· καὶ εἰ ἡ ῥίζα ἁγία, καὶ οἱ κλάδοι.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/016.yaml
  text: If the firstfruits are holy[a], so is the whole batch of dough; and if the root is holy, so are the branches.
translation:
  language: vi
  text: Nếu phần đầu mùa là thánh, thì cả khối bột[a] cũng thánh; và nếu rễ là thánh, thì các cành cũng thánh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “cả mẻ bột”. Từ Hy Lạp φύραμα chỉ một khối hoặc hỗn hợp bột đã nhào.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπαρχὴ
  choice: phần đầu tiên được dâng
  rationale: Diễn đạt phần đầu tiên được biệt riêng dâng cho Đức Chúa Trời, giữ sắc thái lễ nghi của từ Hy Lạp, đồng thời phù hợp với hình ảnh khối bột trong vế kế tiếp.
- source_word: ἁγία
  choice: là thánh
  rationale: Giữ nguyên phạm trù Kinh Thánh và sự song song giữa hai hình ảnh, không thu hẹp nghĩa thành chỉ 'được biệt riêng' hay 'được thánh hóa'.
- source_word: φύραμα
  choice: cả khối bột
  rationale: Từ này chỉ một khối hay hỗn hợp bột đã nhào; cách dịch này tự nhiên trong tiếng Việt và làm rõ quan hệ giữa phần đầu tiên với toàn khối.
- source_word: ῥίζα
  choice: rễ
  rationale: Cách gọi tự nhiên, chính xác cho hình ảnh thực vật và phù hợp với ẩn dụ cây ô-liu trong văn mạch.
- source_word: κλάδοι
  choice: các cành
  rationale: Cách dịch thông dụng, rõ nghĩa và phù hợp với ẩn dụ thực vật ở phần tiếp theo.
- source_word: εἰ δὲ ... καὶ ...; καὶ εἰ ... καὶ ...
  choice: Nếu ... thì ... cũng vậy; và nếu ... thì ... cũng vậy
  rationale: Tiếng Hy Lạp lược bỏ động từ ở kết quả của mỗi vế. 'Cũng vậy' tái hiện lối diễn đạt cô đọng mà vẫn làm rõ quan hệ suy luận trong tiếng Việt; không thêm một từ chỉ thời gian tương đương với 'bây giờ'.
theological_decisions:
- issue: Bản chất của sự thánh trong các hình ảnh phần đầu tiên/khối bột và rễ/cành
  choice: Giữ từ 'thánh' mà không xác định đó là sự thánh khiết theo giao ước, tính đại diện hay sự cứu rỗi.
  alternative: Diễn giải là 'được biệt riêng theo giao ước' hoặc 'được làm nên thánh để được cứu'.
  rationale: Câu này khẳng định một mối liên hệ phát sinh giữa phần đầu tiên và toàn khối, cũng như giữa rễ và các cành, nhưng không tự giải thích chính xác tính chất của mối liên hệ ấy. Bản dịch vì thế không quyết định thay cho văn bản.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Hai vế được giữ cân xứng; 'cũng vậy' bảo toàn sự cô đọng của nguyên văn. Cụm 'phần đầu tiên được dâng' giúp độc giả nhận ra sắc thái lễ nghi của ἀπαρχή mà không buộc cách hiểu về căn tính cụ thể của 'phần đầu tiên' hay 'rễ'.
