  terminology: Giữ “thánh”, “rễ”, và “cành” là phù hợp với thuật ngữ Kinh Thánh và ẩn dụ của văn mạch. “Phần đầu mùa” duy trì sắc thái lễ nghi/giao ước của ἀπαρχή mà không thêm diễn giải về đối tượng được dâng.
