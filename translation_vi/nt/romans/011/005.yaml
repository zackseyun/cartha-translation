    issue: Phân bố không rõ hai yếu tố οὕτως và καί
    rationale: Trong “Vậy thì ... cũng thế”, “cũng thế” có thể bị hiểu là toàn bộ phần tương ứng của câu, trong khi οὕτως οὖν phù hợp với “Vậy thì” và καί nên được giữ bằng “cũng” gắn với mệnh đề hiện tại.
  - severity: low
    issue: Neo chú thích không sát cụm từ được chú giải
    rationale: Chú thích chủ yếu đưa các phương án cho “theo sự tuyển chọn của ân điển”, nhưng dấu [a] lại đặt ở cuối câu và còn bao gồm một nhận xét về động từ. Đặt dấu ngay sau “ân điển” và giới hạn chú thích vào cụm đó giúp minh bạch neo chú thích.
