  text: οὕτως οὖν καὶ ἐν τῷ νῦν καιρῷ λεῖμμα κατ’ ἐκλογὴν χάριτος γέγονεν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/005.yaml
  text: So then, in the present time also, a remnant has come to be according to the election of grace.
translation:
  language: vi
  text: Vậy thì, trong thời hiện tại, cũng có một số người còn sót lại theo sự tuyển chọn của ân điển.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “theo sự tuyển chọn bởi ân điển” hoặc “theo sự tuyển chọn đầy ân điển.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως οὖν καὶ
  choice: Vậy thì ... cũng thế
  rationale: Cụm này rút ra kết luận từ trường hợp Ê-li ở phần trước và đồng thời nêu sự tương ứng với thời hiện tại.
- source_word: ἐν τῷ νῦν καιρῷ
  choice: trong thời hiện tại
  rationale: καιρός chỉ thời kỳ đang diễn ra; cách dịch này giữ được sự đối chiếu giữa thời Ê-li và thời của Phao-lô.
- source_word: λεῖμμα
  choice: một số còn sót lại
  rationale: Diễn đạt tự nhiên trong tiếng Việt ý về một bộ phận thiểu số còn lại, đồng thời phù hợp với bối cảnh Cựu Ước và cách dùng của Phao-lô.
- source_word: κατ’ ἐκλογὴν χάριτος
  choice: theo sự tuyển chọn của ân điển
  rationale: Giữ cả ἐκλογή và χάρις cũng như quan hệ sở hữu ngữ cô đọng giữa chúng, không thu hẹp thành một cách giải thích thần học duy nhất.
- source_word: γέγονεν
  choice: có
  rationale: Trong tiếng Việt, cấu trúc tồn tại 'có' diễn đạt tự nhiên trạng thái hiện hữu do một diễn tiến trước đó tạo nên; sắc thái động từ hoàn thành được giải thích ở chú thích.
theological_decisions:
- issue: Cách dịch ἐκλογή trong ngữ cảnh thần học gây tranh luận
  choice: sự tuyển chọn
  alternative: sự lựa chọn; việc được chọn
  rationale: ‘Sự tuyển chọn’ giữ được trọng lượng thần học của thuật ngữ Phao-lô dùng mà không áp đặt một hệ phái hay một cơ chế thần học cụ thể.
- issue: Quan hệ giữa ân điển và sự tuyển chọn trong κατ’ ἐκλογὴν χάριτος
  choice: theo sự tuyển chọn của ân điển
  alternative: theo sự tuyển chọn bởi ân điển; theo sự tuyển chọn đầy ân điển
  rationale: Cách dịch bảo toàn quan hệ sở hữu ngữ vốn có thể chỉ nguồn, nền tảng hoặc đặc tính, thay vì âm thầm quyết định một cách hiểu duy nhất.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. ‘Một số còn sót lại’ tự nhiên hơn danh từ Hán-Việt ít thông dụng ‘phần dư sót’, còn ‘sự tuyển chọn của ân điển’ chủ ý giữ nét cô đọng và sự mơ hồ chân thực của nguyên văn.
