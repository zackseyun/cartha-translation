id: ROM.11.28
reference: Romans 11:28
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: κατὰ μὲν τὸ εὐαγγέλιον ἐχθροὶ δι’ ὑμᾶς, κατὰ δὲ τὴν ἐκλογὴν ἀγαπητοὶ διὰ τοὺς πατέρας·
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/028.yaml
  text: With respect to the gospel[a], they are enemies for your sake; but with respect to election[b], they are beloved because of the fathers.
translation:
  language: vi
  text: Xét theo Tin Mừng[a], họ là kẻ thù vì anh chị em; nhưng xét theo sự tuyển chọn, họ được yêu thương vì cớ các tổ phụ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Về phương diện Tin Mừng, họ là kẻ thù vì anh chị em; nhưng về phương diện sự tuyển chọn, họ được yêu thương vì cớ các tổ phụ.”'
    reason: lexical_alternative
  - marker: b
    text: “Các tổ phụ” chỉ các tổ phụ của Israel, đặc biệt là Áp-ra-ham, Y-sác và Gia-cốp.
    reason: cross_reference
lexical_decisions:
- source_word: κατὰ μὲν τὸ εὐαγγέλιον
  choice: Xét theo Tin Mừng
  rationale: κατά với đối cách nêu phương diện được xét đến; cách dịch này giữ cấu trúc đối ứng μέν...δέ và tự nhiên trong tiếng Việt.
- source_word: ἐχθροὶ
  choice: kẻ thù
  rationale: Giữ lực vị ngữ và ý nghĩa quan hệ của từ Hy Lạp, không chuyển thành 'bị ghét' hoặc làm nhẹ thành chỉ 'chống đối'.
- source_word: δι’ ὑμᾶς
  choice: vì cớ anh chị em
  rationale: διά với đối cách có thể chỉ nguyên do hoặc lợi ích; 'vì cớ' giữ được độ mở ấy trong mạch lập luận về việc dân ngoại được tiếp nhận.
- source_word: κατὰ δὲ τὴν ἐκλογὴν
  choice: nhưng xét theo sự tuyển chọn
  rationale: Tái hiện phương diện tương phản trong câu; 'sự tuyển chọn' diễn đạt ἐκλογή mà không mở rộng rõ chủ thể trong chính bản văn.
- source_word: ἀγαπητοὶ
  choice: những người được yêu thương
  rationale: Diễn đạt tự nhiên tính từ vị ngữ ở thể thụ động về nghĩa, đồng thời giữ sức nặng giao ước của mệnh đề.
- source_word: διὰ τοὺς πατέρας
  choice: vì cớ các tổ phụ
  rationale: Giữ quan hệ căn cứ/nguyên do của διά và dùng cách gọi tiếng Việt quen thuộc cho các vị tổ tiên giao ước.
theological_decisions:
- issue: Đối tượng của chủ ngữ hàm ẩn
  choice: Giữ đại từ 'họ', chỉ Israel trong mạch lập luận chung
  alternative: Thu hẹp thành những người Do Thái không tin ở thời Phao-lô
  rationale: Ngữ cảnh nói đến Israel theo phương diện tập thể nhưng không buộc bản dịch câu này thu hẹp đối tượng.
- issue: Sự căng thẳng giữa 'kẻ thù' và 'được yêu thương'
  choice: Giữ nguyên cả hai vế đối nghịch
  alternative: Giải thích 'kẻ thù' thành bị Đức Chúa Trời ghét tuyệt đối hoặc chỉ là chống đối xã hội
  rationale: Chính câu văn đặt hai tình trạng cạnh nhau; bản dịch không được làm phẳng nghịch lý thần học này.
- issue: Ý nghĩa của 'các tổ phụ'
  choice: Giữ cách gọi 'các tổ phụ', hàm chỉ các tổ phụ của Israel
  alternative: Mở rộng ngay trong chính văn thành Áp-ra-ham, Y-sác và Gia-cốp
  rationale: Cách dịch giữ kết cấu cô đọng của nguồn, còn chú thích làm rõ đối tượng mà không đưa phần giải nghĩa vào chính văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh chị em” cho đại từ số nhiều ὑμᾶς; giữ “Tin Mừng”, “sự tuyển chọn” và “các tổ phụ” như các thuật ngữ Kinh Thánh quen thuộc. Các dấu chú thích [a], [b] đều xuất hiện trong chính văn.
