id: ROM.11.33
reference: Romans 11:33
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ὦ βάθος πλούτου καὶ σοφίας καὶ γνώσεως θεοῦ· ὡς ἀνεξεραύνητα τὰ κρίματα αὐτοῦ καὶ ἀνεξιχνίαστοι αἱ ὁδοὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/033.yaml
  text: Oh[b][a], the depth of the riches and wisdom and knowledge of God! How unsearchable are his judgments and untraceable his ways!
translation:
  language: vi
  text: Ôi, sự giàu có, sự khôn ngoan và sự hiểu biết của Đức Chúa Trời sâu thẳm biết bao![a] Các phán quyết của Ngài thật không thể dò xét, và các đường lối của Ngài không thể lần theo![b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Ôi, chiều sâu của sự phong phú về sự khôn ngoan và hiểu biết của Đức Chúa Trời biết bao!” Cú pháp Hy Lạp cho phép gắn “sự giàu có” chặt hơn với hai danh từ theo sau; bản chính hiểu cả ba danh từ là những điều thuộc về Đức Chúa Trời.'
    reason: alternative_reading
  - marker: b
    text: “Không thể lần theo” dịch một từ mang nghĩa không thể truy tìm dấu vết hay lần ra đến tận cùng, nhờ đó giữ được sắc thái khác với “không thể dò xét”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὦ
  choice: Ôi
  rationale: Thán từ mở đầu diễn tả sự kinh ngạc và tôn kính; “Ôi” tự nhiên, trang trọng trong tiếng Việt hiện đại.
- source_word: βάθος
  choice: sâu thẳm biết bao
  rationale: Chuyển danh từ “chiều sâu” thành cách cảm thán tự nhiên trong tiếng Việt, vẫn giữ hình ảnh về độ sâu không thể đo lường.
- source_word: πλούτου
  choice: sự giàu có
  rationale: Giữ hình ảnh về nguồn phong phú dồi dào và sắc thái thần học thường thấy trong cách dùng của Phao-lô.
- source_word: σοφίας
  choice: khôn ngoan
  rationale: Diễn đạt phẩm tính khôn ngoan của Đức Chúa Trời bằng từ ngữ quen thuộc, đồng thời phân biệt với “hiểu biết”.
- source_word: γνώσεως
  choice: hiểu biết
  rationale: Diễn đạt tri thức của Đức Chúa Trời bằng tiếng Việt tự nhiên và giữ nó như một khái niệm riêng với sự khôn ngoan.
- source_word: θεοῦ
  choice: của Đức Chúa Trời
  rationale: Đặt sau cả ba danh từ để theo cách hiểu chính rằng sở hữu cách này bổ nghĩa cho sự giàu có, khôn ngoan và hiểu biết.
- source_word: ἀνεξεραύνητα
  choice: không thể dò xét
  rationale: Diễn tả điều không thể được khảo sát hay tìm hiểu đến tận cùng.
- source_word: κρίματα
  choice: các phán quyết
  rationale: Bao quát các sự phán xét, quyết định và định đoạt của Đức Chúa Trời mà không thu hẹp thành sắc lệnh.
- source_word: ἀνεξιχνίαστοι
  choice: không thể lần theo
  rationale: Giữ hình ảnh nguyên ngữ về điều không thể truy dấu, đồng thời phân biệt với “không thể dò xét”.
- source_word: ὁδοὶ
  choice: các đường lối
  rationale: Bảo tồn ẩn dụ chỉ cách thức và tiến trình hành động của Đức Chúa Trời.
theological_decisions:
- issue: Quan hệ của θεοῦ với πλούτου, σοφίας và γνώσεως
  choice: 'Hiểu “của Đức Chúa Trời” là bổ nghĩa cho cả ba: sự giàu có, khôn ngoan và hiểu biết.'
  alternative: “Chiều sâu của sự phong phú trong sự khôn ngoan và hiểu biết của Đức Chúa Trời.”
  rationale: Chuỗi sở hữu cách Hy Lạp có thể được phân tích theo hơn một cách. Bản chính giữ ba danh từ song song như các phẩm tính thuộc về Đức Chúa Trời, còn chú thích bảo tồn cách hiểu gắn “sự giàu có” chặt hơn với hai danh từ sau.
- issue: Phân biệt ἀνεξεραύνητα và ἀνεξιχνίαστοι
  choice: Dùng “không thể dò xét” và “không thể lần theo”.
  alternative: Dùng hai từ gần đồng nghĩa như “không thể thấu hiểu” cho cả hai.
  rationale: Hai tính từ Hy Lạp có liên hệ nhưng mang hình ảnh khác nhau; cách dịch phân biệt chúng giữ được nét tu từ mà không biến sự khác biệt ấy thành một phân biệt giáo lý kỹ thuật.
translation_notes:
  register: Văn phong cảm thán, trang trọng nhưng hiện đại. Cấu trúc được điều chỉnh theo cú pháp tiếng Việt để câu đầu tự nhiên, trong khi phép song hành và hai hình ảnh “dò xét/lần theo” của nguyên ngữ vẫn được giữ lại.
