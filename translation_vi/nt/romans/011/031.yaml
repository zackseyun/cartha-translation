id: ROM.11.31
reference: Romans 11:31
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οὕτως καὶ οὗτοι νῦν ἠπείθησαν τῷ ὑμετέρῳ ἐλέει ἵνα καὶ αὐτοὶ ⸀νῦν ἐλεηθῶσιν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/031.yaml
  text: So also these now have been disobedient[a], so that by the mercy shown to you they also may now receive mercy.
translation:
  language: vi
  text: Cũng vậy, hiện nay họ đã không vâng phục, để nhờ lòng thương xót đã được bày tỏ cho anh em[a], chính họ giờ đây cũng được thương xót.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “nhờ lòng thương xót của anh em.” Cụm từ Hy Lạp có thể được hiểu sát chữ theo cách này, nhưng trong ngữ cảnh, nhiều khả năng nó chỉ lòng thương xót Đức Chúa Trời đã bày tỏ cho anh em.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὕτως καὶ
  choice: Cũng vậy
  rationale: Diễn đạt tự nhiên sự tương ứng với câu trước, đồng thời giữ lực so sánh và suy luận của cụm từ Hy Lạp.
- source_word: οὗτοι
  choice: họ
  rationale: Trong ngữ cảnh, đại từ chỉ về người Israel. Tiếng Việt dùng “họ” tự nhiên hơn “những người này” mà vẫn rõ nhờ mạch văn.
- source_word: νῦν
  choice: hiện nay / giờ đây
  rationale: Giữ cả hai lần xuất hiện của νῦν và nhấn mạnh giai đoạn hiện tại trong lập luận của Phao-lô; thay đổi nhẹ cách diễn đạt để câu tiếng Việt tự nhiên.
- source_word: ἠπείθησαν
  choice: đã không vâng phục
  rationale: ἀπειθέω có thể bao hàm cả không tin lẫn không vâng phục. Cách dịch này giữ nghĩa rộng, không thu hẹp thành sự bất tín thuần túy về nhận thức.
- source_word: τῷ ὑμετέρῳ ἐλέει
  choice: nhờ lòng thương xót đã được bày tỏ cho anh em
  rationale: Cụm cách cho trong tiếng Hy Lạp khá cô đọng và có thể hiểu theo hơn một cách. Trong mạch Rô-ma 11:30–32, cách diễn đạt này hợp lý nhất khi chỉ lòng thương xót của Đức Chúa Trời mà độc giả dân ngoại đã nhận, đồng thời ghi nhận cách hiểu sát chữ hơn trong chú thích.
- source_word: ἵνα
  choice: để
  rationale: Giữ quan hệ mục đích hoặc kết quả mà không buộc phải phân định cứng giữa hai sắc thái vốn có thể chồng lấn trong ngữ cảnh.
- source_word: καὶ αὐτοὶ
  choice: chính họ ... cũng
  rationale: Giữ sắc thái nhấn mạnh và sự bao gồm của αὐτοὶ cùng với καί.
- source_word: ἐλεηθῶσιν
  choice: được thương xót
  rationale: Giữ thể bị động của động từ, qua đó không nêu đích danh tác nhân nhưng trong ngữ cảnh tác nhân được hiểu là Đức Chúa Trời.
theological_decisions:
- issue: “Lòng thương xót của anh em” là lòng thương xót do tín hữu dân ngoại thực hiện hay lòng thương xót Đức Chúa Trời đã bày tỏ cho họ
  choice: lòng thương xót đã được bày tỏ cho anh em
  alternative: lòng thương xót của anh em
  rationale: Mạch lập luận trong Rô-ma 11:30–32 đối chiếu sự không vâng phục với việc nhận lòng thương xót của Đức Chúa Trời. Bản văn chính phản ánh cách hiểu ấy nhưng chú thích vẫn bảo tồn cách đọc sát hình thức Hy Lạp hơn.
- issue: Sắc thái của ἀπειθέω
  choice: không vâng phục
  alternative: không tin
  rationale: Từ Hy Lạp có thể gợi cả bất tín lẫn bất tuân. “Không vâng phục” bảo tồn phạm vi giao ước và đạo đức rộng hơn, không phủ nhận yếu tố không tin trong ngữ cảnh.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh em” để chỉ cộng đồng độc giả theo lối xưng hô thư tín; giữ cả hai chỉ dấu thời gian νῦν bằng “hiện nay” và “giờ đây”. Dấu chú thích được đặt ngay sau cụm từ mà chú thích giải thích.
