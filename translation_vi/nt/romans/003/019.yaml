  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Οἴδαμεν δὲ ὅτι ὅσα ὁ νόμος λέγει τοῖς ἐν τῷ νόμῳ λαλεῖ, ἵνα πᾶν στόμα φραγῇ καὶ ὑπόδικος γένηται πᾶς ὁ κόσμος τῷ θεῷ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/019.yaml
  text: We know that whatever the law says[a], it speaks to those under the law[c][b], so that every mouth may be stopped and the whole world may become accountable to God.
translation:
  language: vi
  text: Chúng ta biết rằng hễ luật pháp nói điều gì, thì đều nói với những người ở dưới luật pháp[a], để mọi miệng đều im bặt[b] và cả thế gian trở thành người phải chịu trách nhiệm trước Đức Chúa Trời[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sát chữ: “những người ở trong luật pháp.”'
    reason: lexical_alternative
  - marker: b
    text: Hay “mọi miệng đều bị khóa lại,” tức không còn lời tự biện hộ.
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể dịch: “phải khai trình,” “phải chịu sự phán xét,” hoặc “mắc tội” trước Đức Chúa Trời.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἴδαμεν δὲ
  choice: Chúng ta biết rằng
  rationale: Diễn đạt tự nhiên một nhận định chung ở thì hiện tại. Không thêm từ chỉ thời gian như “bây giờ”; sắc thái nối tiếp nhẹ của δέ được để cho văn mạch thể hiện.
- source_word: ὁ νόμος
  choice: luật pháp
  rationale: Giữ cách gọi khái quát về luật pháp như một thẩm quyền đã được nhận biết, không xác định quá mức điều bản Hy Lạp nói rõ.
- source_word: τοῖς ἐν τῷ νόμῳ
  choice: những người ở dưới luật pháp
  rationale: Thành ngữ tiếng Việt này truyền đạt tự nhiên ý những người thuộc phạm vi chi phối của luật pháp; nghĩa sát chữ “ở trong luật pháp” được ghi ở chú thích.
- source_word: λέγει ... λαλεῖ
  choice: nói ... là nói với
  rationale: Giữ sự lặp lại có chủ ý và làm rõ rằng lời của luật pháp hướng đến những người thuộc phạm vi của nó, đồng thời tránh lối diễn đạt gượng ép.
- source_word: ἵνα
  choice: để
  rationale: Thể hiện quan hệ mục đích hoặc kết quả dự liệu một cách gọn và tự nhiên.
- source_word: πᾶν στόμα φραγῇ
  choice: mọi miệng đều phải im tiếng
  rationale: Giữ hình ảnh cụ thể về miệng bị ngăn lại, đồng thời diễn đạt tự nhiên ý không còn lời tự biện hộ trong bối cảnh pháp đình.
- source_word: ὑπόδικος
  choice: phải chịu trách nhiệm
  rationale: Giữ sắc thái pháp lý là phải trả lời trước thẩm quyền xét xử, nhưng không mặc nhiên nâng thành lời tuyên án “đã bị kết tội”.
- source_word: γένηται
  choice: phải chịu
  rationale: Trong tiếng Việt, kết cấu này diễn đạt tự nhiên tình trạng mà cả thế gian bị đặt vào do lời của luật pháp; sắc thái chuyển thành tình trạng ấy được giải thích trong chú thích.
- source_word: πᾶς ὁ κόσμος
  choice: cả thế gian
  rationale: Bảo toàn phạm vi bao quát toàn thể nhân loại trong lập luận của Phao-lô.
- source_word: τῷ θεῷ
  choice: trước Đức Chúa Trời
  rationale: “Trước” diễn đạt tự nhiên bối cảnh pháp đình và trách nhiệm đối với Đức Chúa Trời mà cách dative này hàm ý.
theological_decisions:
- issue: Sức nặng pháp lý của ὑπόδικος trước sự phán xét của Đức Chúa Trời
  choice: cả thế gian phải chịu trách nhiệm trước Đức Chúa Trời
  alternative: cả thế gian mắc tội trước Đức Chúa Trời; cả thế gian phải chịu sự phán xét của Đức Chúa Trời
  rationale: Bản dịch chính giữ ý toàn thể thế gian ở trong địa vị phải trả lời trước tòa của Đức Chúa Trời, nhưng không biến tính từ này thành một lời tuyên án mạnh hơn mức từ ngữ tự nó đòi hỏi.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Bản dịch giữ hình ảnh pháp đình và hình ảnh “miệng” trong nguyên văn, tránh thuật ngữ giáo phái và tránh giải quyết quá mức độ mở của ὑπόδικος.
