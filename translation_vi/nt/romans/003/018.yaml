  text: οὐκ ἔστιν φόβος θεοῦ ἀπέναντι τῶν ὀφθαλμῶν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/018.yaml
  text: There is no fear of God before their eyes[a][b].
translation:
  language: vi
  text: Trước mắt họ chẳng có lòng kính sợ Đức Chúa Trời.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Trước mắt họ chẳng có lòng tôn kính Đức Chúa Trời.”'
    reason: lexical_alternative
  - marker: b
    text: Trích Thi Thiên 36:1 (theo bản Bảy Mươi là 35:2).
    reason: cross_reference
lexical_decisions:
- source_word: οὐκ ἔστιν
  choice: chẳng có
  rationale: Diễn đạt tự nhiên phép phủ định hiện tại, đồng thời giữ nguyên sức khẳng định tuyệt đối của câu Hy Lạp.
- source_word: φόβος
  choice: lòng kính sợ
  rationale: Giữ ý nghĩa căn bản là sợ, nhưng trong quan hệ với Đức Chúa Trời, cách nói quen thuộc “lòng kính sợ” cũng bao hàm sự tôn kính mà không làm mất sắc thái nghiêm trọng của từ gốc.
- source_word: θεοῦ
  choice: Đức Chúa Trời
  rationale: Thể hiện rõ Đức Chúa Trời là đối tượng của lòng kính sợ; cấu trúc tiếng Việt không cần dịch riêng hình thái sở hữu cách.
- source_word: ἀπέναντι
  choice: trước
  rationale: Giữ hình ảnh không gian mang nghĩa ẩn dụ của nguyên văn và kết hợp tự nhiên với “mắt họ”.
- source_word: τῶν ὀφθαλμῶν αὐτῶν
  choice: mắt họ
  rationale: Bảo tồn hình ảnh cụ thể về đôi mắt, chỉ điều ở trước sự nhận biết và định hướng đạo đức của họ.
theological_decisions:
- issue: Sắc thái của φόβος khi hướng về Đức Chúa Trời
  choice: lòng kính sợ
  alternative: nỗi sợ; lòng tôn kính
  rationale: “Lòng kính sợ” duy trì cả yếu tố sợ và tôn kính, tránh thu hẹp từ này thành kinh hãi đơn thuần hoặc làm nhẹ nó thành chỉ sự kính trọng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đảo cụm “Trước mắt họ” lên đầu để câu tiếng Việt tự nhiên, đồng thời vẫn giữ nổi bật hình ảnh ἀπέναντι τῶν ὀφθαλμῶν αὐτῶν. Dùng “chẳng có” để phù hợp sắc thái văn chương Kinh Thánh mà vẫn thông dụng.
