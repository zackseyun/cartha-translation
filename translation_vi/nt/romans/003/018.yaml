  source_fidelity: Bản dịch truyền đạt chính xác mệnh đề hiện hữu phủ định οὐκ ἔστιν, đối tượng φόβος θεοῦ, và hình ảnh ἀπέναντι τῶν ὀφθαλμῶν αὐτῶν. Cụm “lòng kính sợ Đức Chúa Trời” bảo toàn phù hợp sắc thái ‘fear’ trong ngữ cảnh Kinh Thánh mà không thu hẹp thành sợ hãi thuần túy.
