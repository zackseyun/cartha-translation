  terminology: Giữ “người Do Thái,” “người Hy Lạp,” và “tội lỗi” theo cách dùng Kinh Thánh tiếng Việt hiện đại. “Quyền lực của tội lỗi” làm rõ quan hệ phục thuộc được ὑπό diễn tả; bản sát chữ được bảo tồn ở chú thích.
  issues:
  - severity: medium
    issue: Câu “Chúng ta có hơn không?” thiếu tự nhiên về cú pháp/ngữ nghĩa.
    rationale: Trong tiếng Việt hiện đại, “hơn” thông thường cần đối tượng so sánh hoặc cách nói thay thế. “Có gì hơn không?” tự nhiên hơn và vẫn giữ được tính đa nghĩa của προεχόμεθα.
  - severity: medium
    issue: “Ở dưới tội lỗi” khó hiểu trong tiếng Việt hiện đại.
    rationale: Cụm này sao chép ẩn dụ Hy Lạp quá trực tiếp và có thể bị hiểu là vị trí thay vì sự lệ thuộc. “Ở dưới quyền lực của tội lỗi” chuyển tải trung thành ý bị tội lỗi thống trị; cách dịch sát chữ được đưa xuống chú thích.
