source:
  edition: SBLGNT
  text: Τί οὖν; προεχόμεθα; οὐ πάντως, προῃτιασάμεθα γὰρ Ἰουδαίους τε καὶ Ἕλληνας πάντας ὑφ’ ἁμαρτίαν εἶναι,
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/009.yaml
  text: What then? Are we better? Not at all[a], for we have already charged that both Jews and Greeks are all under sin[b],
translation:
  language: vi
  text: Vậy thì sao? Chúng ta có gì hơn không? Không hề[a], vì chúng ta đã cáo buộc rằng cả người Do Thái lẫn người Hy Lạp đều ở dưới quyền lực của tội lỗi[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc dịch: “Chúng ta có lợi thế gì không?”'
    reason: alternative_reading
  - marker: b
    text: 'Sát chữ: “đều ở dưới tội lỗi.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί οὖν
  choice: Vậy thì sao?
  rationale: Giữ rõ ý suy luận của οὖν và lối chất vấn ngắn gọn trong lập luận của Phao-lô, không thêm nội dung ngoài nguyên văn.
- source_word: προεχόμεθα
  choice: Chúng ta có hơn không?
  rationale: Cách dịch ngắn gọn này giữ được sắc thái so sánh nhưng không xác quyết quá mức rằng động từ chỉ sự hơn kém về đạo đức hay lợi thế; cách hiểu về lợi thế được ghi ở chú thích.
- source_word: οὐ πάντως
  choice: Hoàn toàn không
  rationale: Diễn đạt tự nhiên và mạnh mẽ lời phủ định dứt khoát trong ngữ cảnh.
- source_word: προῃτιασάμεθα
  choice: chúng ta đã cáo buộc
  rationale: Giữ sắc thái pháp lý của động từ, phù hợp với mạch lập luận mang tính buộc tội trong thư Rô-ma.
- source_word: Ἰουδαίους τε καὶ Ἕλληνας
  choice: cả người Do Thái lẫn người Hy Lạp
  rationale: Phản ánh đầy đủ kết cấu liên kết τε καὶ và giữ nguyên cặp đối chiếu dân tộc trong nguyên văn.
- source_word: πάντας
  choice: tất cả
  rationale: Giữ sự nhấn mạnh rằng lời kết luận bao gồm toàn thể cả hai nhóm.
- source_word: ὑφ’ ἁμαρτίαν εἶναι
  choice: đều ở dưới tội lỗi
  rationale: Giữ hình ảnh cô đọng về tình trạng lệ thuộc trong nguyên văn thay vì giải nghĩa ngay thành quyền thống trị của tội lỗi.
theological_decisions:
- issue: Ý nghĩa của ngôi thứ nhất số nhiều trong προεχόμεθα và tính đa nghĩa của động từ
  choice: Chúng ta có hơn không?
  alternative: Chúng ta có lợi thế gì không?
  rationale: Ngữ cảnh Rô-ma 3:1–9 bàn cả về đặc quyền của người Do Thái lẫn trách nhiệm chung trước tội lỗi. Bản chính giữ câu hỏi so sánh rộng, còn chú thích bảo tồn cách hiểu hợp lý về lợi thế mà không xóa bỏ độ căng của văn bản.
- issue: Ý nghĩa của ὑφ’ ἁμαρτίαν
  choice: ở dưới tội lỗi
  alternative: ở dưới quyền lực của tội lỗi
  rationale: Cách dịch chính giữ nguyên ẩn dụ súc tích của Phao-lô; phương án chú thích làm rõ hàm ý bị tội lỗi chi phối nhưng mang tính giải thích hơn.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Câu hỏi ngắn giữ nhịp tranh luận của Phao-lô; thuật ngữ “ở dưới tội lỗi” được giữ có chủ ý vì vừa sát nguyên văn vừa bảo tồn hình ảnh thần học cô đọng.
