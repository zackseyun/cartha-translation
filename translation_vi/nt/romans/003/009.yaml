  source_fidelity: 'Bản nháp phản ánh đúng mạch lập luận và hầu hết các yếu tố Hy Lạp: Τί οὖν, phủ định mạnh οὐ πάντως, cáo buộc trước đó, cặp người Do Thái/người Hy Lạp, và tính bao quát của πάντας. Tuy nhiên, “Chúng ta có hơn không?” chưa tự nhiên trong tiếng Việt vì thiếu đối tượng so sánh; còn “ở dưới tội lỗi” quá sát chữ nhưng không phải cách diễn đạt hiện đại rõ nghĩa cho ὑφ’ ἁμαρτίαν.'
