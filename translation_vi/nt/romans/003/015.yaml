  text: Chân họ mau lẹ đổ máu,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát hơn: “Chân họ sắc bén để đổ máu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀξεῖς
  choice: nhanh nhẹn
  rationale: Tính từ này theo nghĩa đen là “sắc, bén,” nhưng khi nói về chân sẵn sàng thực hiện bạo lực, “nhanh nhẹn” diễn đạt tự nhiên ý hành động mau lẹ mà vẫn giữ sắc thái khẩn cấp.
- source_word: οἱ πόδες
  choice: chân
  rationale: Cách dịch trực tiếp và tự nhiên, giữ nguyên hình ảnh thân thể trong nguyên văn.
- source_word: αὐτῶν
  choice: chúng
  rationale: Đại từ sở hữu được diễn đạt tự nhiên trong tiếng Việt bằng cấu trúc “chân chúng,” nối với những người đang được mô tả trong văn cảnh.
- source_word: ἐκχέαι
  choice: làm đổ
  rationale: Động từ có nghĩa căn bản là “đổ ra”; đi với “máu,” cụm “làm đổ máu” vừa tự nhiên vừa thể hiện hành vi bạo lực.
- source_word: αἷμα
  choice: máu
  rationale: Tương đương trực tiếp, thông dụng của danh từ Hy Lạp và phù hợp với văn cảnh bạo lực.
