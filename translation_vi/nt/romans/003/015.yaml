- from: Chân chúng nhanh nhẹn làm đổ máu,[a]
  to: Chân họ mau lẹ đổ máu,[a]
  rationale: Sửa đại từ để phù hợp với đối tượng con người trong văn mạch và tiếng Việt hiện đại; thay “nhanh nhẹn” bằng “mau lẹ” để diễn đạt tự nhiên hơn nghĩa ngữ cảnh của ὀξεῖς. Giữ “đổ máu” và cấu trúc ngắn gọn, hoán dụ của nguyên văn. Chú thích vẫn bảo lưu nghĩa đen “sắc bén” của ὀξεῖς.
