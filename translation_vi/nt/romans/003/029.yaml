id: ROM.3.29
reference: Romans 3:29
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἢ Ἰουδαίων ὁ θεὸς μόνον; ⸀οὐχὶ καὶ ἐθνῶν; ναὶ καὶ ἐθνῶν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/029.yaml
  text: Or is God the God of the Jews only? Is he not also the God of the Gentiles? Yes[a], of the Gentiles also.
translation:
  language: vi
  text: Hay Đức Chúa Trời chỉ là Đức Chúa Trời của người Do Thái thôi sao? Chẳng phải Ngài cũng là Đức Chúa Trời của các dân ngoại sao? Phải, Ngài cũng là Đức Chúa Trời của các dân ngoại.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “các dân”, theo cách dịch sát chữ hơn của ἐθνῶν.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἢ
  choice: Hay
  rationale: Mở ra một khả năng tu từ tiếp theo trong lập luận của Phao-lô; “Hay” tự nhiên và giữ được mạch tranh luận.
- source_word: Ἰουδαίων
  choice: của người Do Thái
  rationale: Dạng sở hữu phụ thuộc vào θεός; cách diễn đạt này tự nhiên trong tiếng Việt và chỉ cộng đồng Do Thái nói chung.
- source_word: ὁ θεὸς
  choice: Đức Chúa Trời
  rationale: Danh xưng truyền thống, trang trọng và dễ hiểu trong tiếng Việt; được lặp lại ở các mệnh đề tỉnh lược để câu hỏi rõ nghĩa.
- source_word: μόνον
  choice: chỉ ... thôi
  rationale: Giữ nguyên ý loại trừ, đồng thời tạo câu hỏi tu từ tự nhiên trong tiếng Việt.
- source_word: οὐχὶ καὶ
  choice: Chẳng phải ... cũng ... sao?
  rationale: οὐχί mở câu hỏi chờ đợi câu trả lời khẳng định; cấu trúc này giữ cả hình thức nghi vấn lẫn lực tu từ ấy.
- source_word: ἐθνῶν
  choice: các dân ngoại
  rationale: Trong thế đối lập với người Do Thái, từ này chỉ các dân không thuộc dân Do Thái; “các dân ngoại” vừa rõ theo ngữ cảnh vừa giữ sắc thái số nhiều của nguyên ngữ.
- source_word: ναὶ
  choice: Phải
  rationale: Lời đáp khẳng định ngắn gọn, tự nhiên, tương ứng với câu hỏi tu từ.
- source_word: καὶ
  choice: cũng
  rationale: Thêm các dân ngoại bên cạnh người Do Thái và giữ trọng tâm bao gồm của lập luận.
theological_decisions:
- issue: 'Cách dịch ἐθνῶν: “các dân ngoại” hay “các dân”'
  choice: các dân ngoại
  alternative: các dân
  rationale: Sự đối chiếu trực tiếp với người Do Thái cho thấy đối tượng là những dân không phải Do Thái, không đơn thuần là các quốc gia theo nghĩa địa chính trị. Chú thích vẫn bảo lưu cách dịch sát chữ hơn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” để nối các mệnh đề mà tiếng Hy Lạp lược bỏ động từ và bổ ngữ; giữ chuỗi câu hỏi tu từ cùng lời đáp khẳng định ngắn gọn.
