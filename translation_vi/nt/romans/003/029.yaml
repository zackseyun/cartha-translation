  source_fidelity: 'Bản dịch giữ đúng cấu trúc tu từ của nguyên văn: câu hỏi lựa chọn mở đầu (ἢ), tính độc hữu của Đức Chúa Trời đối với người Do Thái (μόνον), câu hỏi phủ định chờ đáp án khẳng định (οὐχί), và lời xác nhận ngắn gọn (ναί). “Các dân ngoại” truyền đạt đúng ἐθνῶν trong thế đối chiếu Do Thái/Dân ngoại; việc lặp “Ngài/Đức Chúa Trời” ở câu cuối là một khai triển tiếng Việt rõ nghĩa, không thêm nội dung thần học.'
