review_pass:
  verdict: revise
  source_fidelity: Bản nháp truyền đạt đúng cấu trúc điều kiện, đối lập giữa sự chân thật của Đức Chúa Trời và lời nói dối của người nói, cùng câu hỏi tu từ về việc vẫn bị xét xử như tội nhân. Tuy nhiên, “càng tỏ rõ” làm hẹp ἐπερίσσευσεν (“trở nên dư dật/dồi dào hơn”) thành ý bộc lộ; và “khiến Ngài được vinh hiển” diễn giải mạnh hơn quan hệ εἰς τὴν δόξαν αὐτοῦ.
  naturalness: “Càng thêm dồi dào, đem lại vinh quang cho Ngài” là tiếng Việt hiện đại, rõ ràng, và giữ tốt hơn ý gia tăng cùng hướng-kết quả của nguyên văn. “Qua” cũng tự nhiên cho sắc thái phương tiện của ἐν.
  terminology: “Sự chân thật của Đức Chúa Trời,” “lời nói dối,” “bị xét xử,” và “tội nhân” phù hợp ngữ cảnh Rô-ma 3:4–7, không áp đặt cách giải thích giáo phái. Giữ danh xưng “Đức Chúa Trời” nhất quán với bản nháp.
  issues:
  - severity: medium
    issue: “càng tỏ rõ” không bảo toàn đầy đủ nghĩa của ἐπερίσσευσεν.
    rationale: Động từ này nói đến sự dư dật, gia tăng, hoặc tràn đầy hơn; ý “tỏ rõ” chỉ nêu hệ quả nhận thức và bỏ mất nét gia tăng.
  - severity: low
    issue: “khiến Ngài được vinh hiển” hơi diễn giải εἰς τὴν δόξαν αὐτοῦ.
    rationale: Cụm Hy Lạp nói “cho/hướng đến vinh quang của Ngài.” “Đem lại vinh quang cho Ngài” tự nhiên hơn mà không xác định quá mức quan hệ này là một mệnh đề kết quả bị động.
  revised_text: Nhưng nếu sự chân thật của Đức Chúa Trời[a], qua lời nói dối của tôi[b], đã càng thêm dồi dào, đem lại vinh quang cho Ngài[c], thì tại sao tôi vẫn còn bị xét xử như một tội nhân?
