id: ROM.3.7
reference: Romans 3:7
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εἰ ⸀δὲ ἡ ἀλήθεια τοῦ θεοῦ ἐν τῷ ἐμῷ ψεύσματι ἐπερίσσευσεν εἰς τὴν δόξαν αὐτοῦ, τί ἔτι κἀγὼ ὡς ἁμαρτωλὸς κρίνομαι,
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/007.yaml
  text: But if God’s truthfulness has abounded through my lie for his glory, why am I still being judged as a sinner?
translation:
  language: vi
  text: Nhưng nếu sự chân thật của Đức Chúa Trời[a], qua lời nói dối của tôi[b], đã càng thêm dồi dào, đem lại vinh quang cho Ngài[c], thì tại sao tôi vẫn còn bị xét xử như một tội nhân?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “lẽ thật của Đức Chúa Trời” hoặc “sự thật của Đức Chúa Trời.”'
    reason: lexical_alternative
  - marker: b
    text: 'Hoặc: “qua sự giả dối của tôi” hoặc “trong lời nói dối của tôi.”'
    reason: lexical_alternative
  - marker: c
    text: 'Sát nghĩa: “hướng đến/cho vinh quang của Ngài.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλήθεια τοῦ θεοῦ
  choice: sự chân thật của Đức Chúa Trời
  rationale: Trong mạch văn Rô-ma 3:4–7, cụm từ này đối lập phẩm tính chân thật của Đức Chúa Trời với sự giả dối của con người. Cách dịch này tự nhiên trong tiếng Việt và vẫn giữ được sắc thái phẩm tính của ἀλήθεια.
- source_word: ἐν τῷ ἐμῷ ψεύσματι
  choice: nhờ lời nói dối của tôi
  rationale: ἐν ở đây có thể mang nghĩa phương tiện; “nhờ” diễn đạt tự nhiên ý điều giả định rằng lời nói dối của người nói lại làm nổi bật sự chân thật của Đức Chúa Trời.
- source_word: ψεύσματι
  choice: lời nói dối
  rationale: Cách diễn đạt trực tiếp, thông dụng, phù hợp với sự đối lập giữa Đức Chúa Trời chân thật và con người nói dối trong ngữ cảnh.
- source_word: ἐπερίσσευσεν
  choice: càng tỏ rõ
  rationale: Động từ diễn tả sự gia tăng hoặc trở nên dồi dào. Trong tiếng Việt, “càng tỏ rõ” truyền đạt tự nhiên việc sự chân thật của Đức Chúa Trời được làm nổi bật hơn qua sự tương phản, dù sắc thái hình ảnh “dư dật” được diễn đạt theo chức năng.
- source_word: εἰς τὴν δόξαν αὐτοῦ
  choice: khiến Ngài được vinh hiển
  rationale: Diễn đạt εἰς theo nghĩa kết quả trong câu giả định, bằng tiếng Việt rõ ràng và tự nhiên; không buộc phải quyết định rằng đây chỉ là mục đích.
- source_word: τί ἔτι
  choice: tại sao ... vẫn còn
  rationale: Giữ được ý tiếp diễn của ἔτι trong câu hỏi tu từ.
- source_word: κἀγὼ
  choice: tôi
  rationale: κἀγώ có sắc thái “cả tôi/tôi cũng”, nhưng trong tiếng Việt, chủ thể “tôi” cùng cấu trúc câu hỏi đã truyền tải tự nhiên trọng tâm mà không làm câu nặng nề.
- source_word: κρίνομαι
  choice: bị xét xử
  rationale: Giữ nghĩa thụ động và không thu hẹp từ này thành “bị kết án”, nhờ đó bảo toàn phạm vi nghĩa và sự căng thẳng của lập luận.
- source_word: ὡς ἁμαρτωλὸς
  choice: như một tội nhân
  rationale: Cách dịch trực tiếp, rõ ràng của biểu thức vị ngữ, phù hợp với tiếng Việt hiện đại.
theological_decisions:
- issue: ἀλήθεια τοῦ θεοῦ nên được hiểu như chân lý thuộc về Đức Chúa Trời hay phẩm tính chân thật của Ngài.
  choice: sự chân thật của Đức Chúa Trời
  alternative: chân lý của Đức Chúa Trời / lẽ thật của Đức Chúa Trời
  rationale: Ngữ cảnh gần đối lập Đức Chúa Trời là chân thật với con người nói dối (Rô-ma 3:4–7), nên “sự chân thật” làm rõ sắc thái phẩm tính mà không áp đặt một lập trường hệ phái.
- issue: εἰς τὴν δόξαν αὐτοῦ biểu thị mục đích hay kết quả.
  choice: khiến Ngài được vinh hiển
  alternative: để Ngài được vinh hiển / cho vinh quang của Ngài
  rationale: Bản dịch chọn cách diễn đạt kết quả tự nhiên trong mạch câu giả định, nhưng không phủ nhận khả năng εἰς có sắc thái hướng tới mục đích.
- issue: κρίνομαι có nên được dịch là xét xử hay kết án.
  choice: bị xét xử
  alternative: bị kết án
  rationale: “Bị xét xử” giữ phạm vi rộng của động từ và không vội đồng nhất hành động này với phán quyết kết tội cuối cùng.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Câu hỏi tu từ cùng sự căng thẳng trong lập luận được giữ nguyên; không thêm lời giải thích vào chính văn.
