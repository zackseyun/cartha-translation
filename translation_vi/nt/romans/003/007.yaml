revisions:
- from: Nhưng nếu sự chân thật của Đức Chúa Trời nhờ lời nói dối của tôi mà càng tỏ rõ, khiến Ngài được vinh hiển, thì tại sao tôi vẫn còn bị xét xử như một tội nhân?
  to: Nhưng nếu sự chân thật của Đức Chúa Trời[a], qua lời nói dối của tôi[b], đã càng thêm dồi dào, đem lại vinh quang cho Ngài[c], thì tại sao tôi vẫn còn bị xét xử như một tội nhân?
  rationale: Sửa hai chỗ để phản ánh sát hơn ἐπερίσσευσεν và εἰς τὴν δόξαν αὐτοῦ, đồng thời duy trì mạch lập luận giả định, sắc thái chưa giải quyết của câu hỏi tu từ, và lối văn tiếng Việt hiện đại.
  reviewer_model: gpt-5.6-terra
