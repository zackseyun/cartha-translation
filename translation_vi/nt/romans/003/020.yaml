  source_fidelity: 'Bản dịch truyền đạt đúng lập luận chính: không ai được công chính hóa trước mặt Đức Chúa Trời bởi ἔργων νόμου, và luật pháp dẫn đến sự nhận biết tội lỗi. Tuy nhiên, động từ bị động tương lai δικαιωθήσεται chưa được biểu thị rõ trong câu tiếng Việt hiện có. Cụm “làm những việc luật pháp đòi hỏi” cũng diễn giải rộng hơn cụm danh từ ἐξ ἔργων νόμου.'
