id: ROM.3.20
reference: Romans 3:20
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: διότι ἐξ ἔργων νόμου οὐ δικαιωθήσεται πᾶσα σὰρξ ἐνώπιον αὐτοῦ, διὰ γὰρ νόμου ἐπίγνωσις ἁμαρτίας.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/020.yaml
  text: because by works of the law no one will be justified before him, for through the law comes the knowledge of sin.
translation:
  language: vi
  text: vì bởi những việc làm theo luật pháp, sẽ không ai được kể là công chính trước mặt Ngài; vì nhờ luật pháp mà người ta nhận biết tội lỗi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξ ἔργων νόμου
  choice: nhờ làm những việc luật pháp đòi hỏi
  rationale: Diễn đạt tự nhiên ý 'bởi các việc của luật pháp', đồng thời giữ luật pháp làm chuẩn mực quy định các việc ấy.
- source_word: οὐ δικαιωθήσεται
  choice: không ... được kể là công chính
  rationale: Thể bị động tương lai trong ngữ cảnh phán xét; 'được kể là công chính' truyền đạt sắc thái tuyên nhận/phán quyết mà không áp đặt một hệ thần học riêng.
- source_word: πᾶσα σὰρξ
  choice: không một người nào
  rationale: Thành ngữ Semit chỉ toàn thể loài người trong sự yếu đuối hữu hạn; dịch theo nghĩa trong tiếng Việt hiện đại thay vì sát chữ là 'mọi xác thịt'.
- source_word: ἐνώπιον αὐτοῦ
  choice: trước mặt Ngài
  rationale: Giữ hình ảnh đứng trước sự hiện diện và phán xét của Đức Chúa Trời; đại từ viết hoa phù hợp văn phong Kinh Thánh tiếng Việt.
- source_word: ἐπίγνωσις ἁμαρτίας
  choice: nhận biết tội lỗi
  rationale: Diễn đạt sự hiểu biết/nhận thức rõ về tội lỗi do luật pháp đem lại.
theological_decisions:
- issue: Ý nghĩa của δικαιόω
  choice: được kể là công chính
  alternative: được xưng công chính; được làm cho công chính
  rationale: Lựa chọn này giữ sắc thái phán quyết của ngữ cảnh 'trước mặt Ngài', nhưng tránh biến câu thành tuyên bố độc quyền về toàn bộ cơ chế của sự công chính hóa.
- issue: Phạm vi của νόμος
  choice: luật pháp
  alternative: Luật Mô-se
  rationale: Nguyên văn không nêu đích danh Mô-se; giữ cách gọi rộng để không thu hẹp một sự mơ hồ có thật trong lập luận.
- issue: Chức năng của luật pháp
  choice: qua luật pháp người ta nhận biết tội lỗi
  alternative: luật pháp đem đến sự nhận biết tội lỗi
  rationale: Giữ nguyên quan hệ phương tiện của διά và không suy diễn rằng đây là chức năng duy nhất của luật pháp.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dấu chấm phẩy giữ quan hệ chặt giữa hai mệnh đề; 'thật vậy' thể hiện γάρ mang ý giải thích. Không dùng chú thích vì bản dịch chính đã truyền đạt thành ngữ πᾶσα σὰρξ tự nhiên.
