id: ROM.3.30
reference: Romans 3:30
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸀εἴπερ εἷς ὁ θεός, ὃς δικαιώσει περιτομὴν ἐκ πίστεως καὶ ἀκροβυστίαν διὰ τῆς πίστεως.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/030.yaml
  text: since God is one[c][b][a], who will justify the circumcised by faith and the uncircumcised through faith.
translation:
  language: vi
  text: vì Đức Chúa Trời là một[a], Đấng sẽ xưng công chính cho người chịu cắt bì bởi đức tin và người không chịu cắt bì qua đức tin[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “nếu quả thật Đức Chúa Trời là một.”'
    reason: alternative_reading
  - marker: b
    text: 'Phao-lô dùng hai cách nói khác nhau: “bởi đức tin” và “qua đức tin”; sự khác biệt này có thể chỉ thuộc về cách diễn đạt chứ không nhất thiết tạo nên một sự đối lập rõ nét.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴπερ
  choice: vì
  rationale: Trong mạch lập luận, từ này nêu nền tảng dựa trên niềm xác tín chung rằng Đức Chúa Trời là một, chứ không biểu thị sự nghi ngờ; chú thích giữ lại cách hiểu có điều kiện.
- source_word: εἷς ὁ θεός
  choice: Đức Chúa Trời là một
  rationale: Giữ sắc thái nhấn mạnh của lời tuyên xưng độc thần và mối liên hệ với lập luận tiếp theo.
- source_word: δικαιώσει
  choice: sẽ xưng công chính
  rationale: Giữ thì tương lai và diễn đạt nghĩa pháp đình của δικαιόω bằng thuật ngữ tiếng Việt rõ ràng, quen thuộc.
- source_word: περιτομήν
  choice: người chịu cắt bì
  rationale: Danh từ được dùng hoán dụ để chỉ những người đã chịu cắt bì, không chỉ nghi thức; cách dịch này tránh tự động đồng nhất họ với một nhãn sắc tộc.
- source_word: ἐκ πίστεως
  choice: bởi đức tin
  rationale: Diễn đạt tự nhiên đức tin như cơ sở hoặc phương cách, đồng thời phân biệt với giới từ διά ở vế sau.
- source_word: ἀκροβυστίαν
  choice: người không chịu cắt bì
  rationale: Danh từ được dùng hoán dụ để chỉ những người không chịu cắt bì; không diễn giải quá mức thành 'dân ngoại'.
- source_word: διὰ τῆς πίστεως
  choice: qua đức tin
  rationale: Giữ sự khác biệt về giới từ so với ἐκ πίστεως, nhưng không áp đặt một đối lập thần học rõ nét.
- source_word: πίστεως
  choice: đức tin
  rationale: Trong câu này πίστις chỉ đức tin; không có cấu trúc sở hữu gây tranh luận cần được giải quyết theo hướng khác.
theological_decisions:
- issue: Liệu Phao-lô có chủ ý phân biệt thần học giữa ἐκ πίστεως và διὰ τῆς πίστεως hay không
  choice: Giữ khác biệt bằng 'bởi đức tin' và 'qua đức tin', nhưng không khẳng định có sự đối lập giáo lý.
  alternative: Dịch cả hai là 'bởi đức tin', hoặc hiểu chúng như sự phân biệt tinh tế giữa cơ sở và phương tiện.
  rationale: Bản Hy Lạp dùng hai giới từ khác nhau, nên bản dịch phản ánh khác biệt ấy; tuy nhiên, văn cảnh không buộc phải xác định đây là một phân biệt thần học sắc nét.
- issue: Sắc thái của εἴπερ
  choice: Dịch là 'vì' trong chính văn.
  alternative: “nếu quả thật Đức Chúa Trời là một”
  rationale: Trong lập luận này, Phao-lô dựa trên niềm xác tín độc thần được thừa nhận, nhưng cấu trúc Hy Lạp vẫn có thể được thể hiện sát hơn theo dạng điều kiện trong chú thích.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “Đức Chúa Trời” và “xưng công chính” để giữ độ chính xác thần học; dùng “người chịu cắt bì/người không chịu cắt bì” nhằm làm rõ phép hoán dụ trong nguyên văn mà không diễn giải thành nhãn sắc tộc.
