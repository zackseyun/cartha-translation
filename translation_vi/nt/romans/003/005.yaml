id: ROM.3.5
reference: Romans 3:5
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εἰ δὲ ἡ ἀδικία ἡμῶν θεοῦ δικαιοσύνην συνίστησιν, τί ἐροῦμεν; μὴ ἄδικος ὁ θεὸς ὁ ἐπιφέρων τὴν ὀργήν; κατὰ ἄνθρωπον λέγω.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/005.yaml
  text: But if our unrighteousness demonstrates God’s righteousness[a], what shall we say? Is God unjust to inflict wrath? (I am speaking in a human way.)
translation:
  language: vi
  text: Nhưng nếu sự bất chính của chúng ta làm nổi bật sự công chính của Đức Chúa Trời[a], thì chúng ta sẽ nói gì? Chẳng lẽ Đức Chúa Trời bất công khi giáng cơn thịnh nộ sao? (Tôi đang nói theo cách của loài người.)
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “sự bất công của chúng ta làm nổi bật công lý của Đức Chúa Trời.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀδικία
  choice: sự bất chính
  rationale: Giữ sự tương phản về đạo đức và quan hệ với δικαιοσύνη, đồng thời tự nhiên trong lập luận của Phao-lô; nghĩa “sự bất công” vẫn được ghi nhận ở chú thích.
- source_word: δικαιοσύνη
  choice: sự công chính
  rationale: Đây là cách dịch quen thuộc, phù hợp với chiều rộng nghĩa của thuật ngữ trong thư Rô-ma; nghĩa “công lý” được bảo lưu trong chú thích như một khả năng theo ngữ cảnh.
- source_word: συνίστησιν
  choice: làm nổi bật
  rationale: Diễn đạt việc sự bất chính của con người khiến sự công chính của Đức Chúa Trời được bày tỏ rõ ràng, không hàm ý rằng nó tạo ra sự công chính ấy.
- source_word: μὴ ἄδικος
  choice: Chẳng lẽ Đức Chúa Trời bất công ... sao?
  rationale: Cấu trúc “chẳng lẽ... sao?” tự nhiên trong tiếng Việt và phản ánh câu hỏi tu từ với câu trả lời phủ định được trông đợi do μή gợi ra.
- source_word: ἐπιφέρων τὴν ὀργήν
  choice: khi giáng cơn thịnh nộ
  rationale: “Giáng” truyền đạt hành động đem sự thịnh nộ đến trong bối cảnh xét xử, còn “cơn thịnh nộ” giữ sắc thái mạnh của ὀργή.
- source_word: κατὰ ἄνθρωπον λέγω
  choice: Tôi đang nói theo cách của loài người
  rationale: Giữ sát thành ngữ Hy Lạp và cho thấy đây là lời phân trần của Phao-lô về lối lập luận mang tính con người.
theological_decisions:
- issue: Cách thể hiện câu hỏi tu từ về sự công minh của Đức Chúa Trời khi phán xét
  choice: Dùng “Chẳng lẽ Đức Chúa Trời bất công... sao?” để báo hiệu câu trả lời phủ định được trông đợi.
  alternative: “Đức Chúa Trời có bất công khi giáng cơn thịnh nộ không?”
  rationale: μή định hướng người nghe đến câu trả lời phủ định, nhưng câu vẫn phải giữ nguyên sức căng của lời phản bác thay vì biến thành một lời khẳng định giáo lý trực tiếp.
- issue: Mối tương phản giữa ἀδικία và δικαιοσύνη
  choice: Dùng “sự bất chính” và “sự công chính” trong chính văn.
  alternative: “Sự bất công” và “công lý”.
  rationale: Cặp từ chính văn bảo toàn phạm vi đạo đức và quan hệ rộng hơn trong lập luận của Phao-lô, trong khi chú thích giữ lại cách hiểu pháp lý có thật của cả hai từ.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. “Chẳng lẽ... sao?” giữ sức mạnh tu từ; đại từ “chúng ta” và “Tôi” theo sát sự chuyển giọng trong nguyên văn. Dấu ngoặc giữ lời phân trần cuối câu như nguồn Hy Lạp.
