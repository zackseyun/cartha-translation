id: ROM.3.31
reference: Romans 3:31
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: νόμον οὖν καταργοῦμεν διὰ τῆς πίστεως; μὴ γένοιτο, ἀλλὰ νόμον ⸀ἱστάνομεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/031.yaml
  text: Do we then nullify the law through faith? May it never be! On the contrary[a], we uphold the law.
translation:
  language: vi
  text: Vậy, có phải chúng ta nhờ đức tin mà làm cho luật pháp mất hiệu lực không? Tuyệt đối không! Trái lại, chúng ta giữ vững luật pháp.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “chúng ta xác lập luật pháp.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: νόμον
  choice: luật pháp
  rationale: Trong mạch lập luận của Rô-ma, danh từ không có mạo từ này chỉ luật pháp đã được xác định trong ngữ cảnh, tức Luật pháp/Torah. “Luật pháp” là cách diễn đạt quen thuộc, trang trọng và nhất quán.
- source_word: οὖν
  choice: vậy
  rationale: “Vậy” tự nhiên trong câu hỏi suy luận, nối kết phát biểu này với lập luận ngay trước đó.
- source_word: καταργοῦμεν
  choice: làm cho ... mất hiệu lực
  rationale: Cụm này diễn đạt ý khiến luật pháp trở nên vô hiệu mà không nghiêng sang nghĩa bãi bỏ bằng hành vi lập pháp; đồng thời tạo thế đối lập rõ với “giữ vững”.
- source_word: διὰ τῆς πίστεως
  choice: nhờ đức tin
  rationale: “Nhờ” thể hiện sắc thái phương tiện của διά với sở hữu cách; “đức tin” là cách gọi tự nhiên, đã định hình trong văn phong Kinh Thánh tiếng Việt.
- source_word: μὴ γένοιτο
  choice: Tuyệt đối không!
  rationale: Cách nói mạnh, tự nhiên trong tiếng Việt hiện đại, truyền đạt lời bác bỏ dứt khoát của thành ngữ Hy Lạp.
- source_word: ἀλλὰ
  choice: Trái lại
  rationale: Đánh dấu rõ sự tương phản và đính chính mạnh giữa việc làm luật pháp mất hiệu lực với việc giữ vững luật pháp.
- source_word: ἱστάνομεν
  choice: giữ vững
  rationale: Trong ngữ cảnh đối lập với καταργοῦμεν, “giữ vững” truyền đạt việc xác nhận và duy trì hiệu lực của luật pháp, đồng thời tránh hàm ý rằng đức tin mới dựng lập luật pháp lần đầu.
theological_decisions:
- issue: Mối quan hệ giữa đức tin và luật pháp
  choice: chúng ta giữ vững luật pháp
  alternative: chúng ta xác lập luật pháp
  rationale: ἱστάνομεν có thể mang nghĩa “xác lập”, nhưng trong tiếng Việt cụm ấy có thể gợi ý tạo lập luật pháp. “Giữ vững” bảo toàn thế đối lập với việc làm mất hiệu lực, mà không áp đặt một hệ thống thần học cụ thể.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu hỏi tu từ cùng lời bác bỏ mạnh được giữ nguyên; thuật ngữ “luật pháp” và “đức tin” phù hợp với ngữ cảnh thư Rô-ma.
