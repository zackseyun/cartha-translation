id: ROM.3.6
reference: Romans 3:6
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: μὴ γένοιτο· ἐπεὶ πῶς κρινεῖ ὁ θεὸς τὸν κόσμον;
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/006.yaml
  text: Absolutely not! Otherwise[a], how will God judge the world?
translation:
  language: vi
  text: Không thể nào! Nếu vậy, Đức Chúa Trời sẽ phán xét thế gian thế nào?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μὴ γένοιτο
  choice: Không thể nào!
  rationale: Đây là công thức bác bỏ mạnh mẽ, mang tính thành ngữ. “Không thể nào!” truyền đạt tự nhiên sức phủ nhận trong tiếng Việt hiện đại mà không biến câu thành một lời cầu chúc theo nghĩa đen.
- source_word: ἐπεὶ
  choice: Nếu vậy
  rationale: Trong câu hỏi tu từ này, từ nối nêu hệ quả nếu chấp nhận tiền đề vừa bị bác bỏ. “Nếu vậy” thể hiện rõ và tự nhiên mạch lập luận của Phao-lô.
- source_word: κρινεῖ
  choice: sẽ phán xét
  rationale: Động từ ở thì tương lai chỉ hành động phán xét của Đức Chúa Trời; “sẽ phán xét” giữ trực tiếp hình thái và ý nghĩa của nguyên văn.
- source_word: ὁ θεὸς
  choice: Đức Chúa Trời
  rationale: Danh xưng tiếng Việt trang trọng, quen thuộc và phù hợp để chỉ vị Đức Chúa Trời duy nhất trong văn mạch.
- source_word: τὸν κόσμον
  choice: thế gian
  rationale: Trong văn mạch, κόσμος là toàn thể thế giới, đặc biệt nhân loại, trong tư cách đối tượng chịu sự phán xét của Đức Chúa Trời. “Thế gian” là cách diễn đạt Kinh Thánh tự nhiên và quen thuộc.
theological_decisions:
- issue: Sức mạnh của công thức bác bỏ μὴ γένοιτο
  choice: 'Một lời phủ nhận dứt khoát: “Không thể nào!”'
  alternative: '“Chẳng hề như vậy!” hoặc cách sát hình thức hơn: “Mong đừng bao giờ xảy ra!”'
  rationale: Cụm từ là công thức Phao-lô thường dùng để bác bỏ mạnh một kết luận. Dịch theo thành ngữ giữ đúng lực nghĩa mà không thêm nội dung giáo lý.
- issue: Quan hệ lập luận do ἐπεὶ biểu thị
  choice: “Nếu vậy” giới thiệu hệ quả phi lý của tiền đề bị bác bỏ.
  alternative: Có thể hiểu theo sắc thái “vì nếu thế” hoặc “bằng không”.
  rationale: Cách dịch này giữ câu hỏi tu từ và cho thấy việc Đức Chúa Trời phán xét thế gian sẽ trở nên khó hiểu nếu kết luận trước đó là đúng, nhưng không giải quyết thay độc giả toàn bộ căng thẳng thần học của lập luận.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu ngắn giữ nhịp bác bỏ mạnh rồi chuyển ngay sang câu hỏi tu từ. Không dùng chú thích vì các phương án khác không cần thiết để hiểu câu và bản tiếng Việt đã bảo toàn ý nghĩa cùng lực diễn đạt của nguyên văn.
