id: ROM.3.1
reference: Romans 3:1
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Τί οὖν τὸ περισσὸν τοῦ Ἰουδαίου, ἢ τίς ἡ ὠφέλεια τῆς περιτομῆς;
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/001.yaml
  text: What then is the advantage of the Jew? Or what is the benefit of circumcision?[a][b]
translation:
  language: vi
  text: Vậy, người Do Thái có ưu thế gì? Hay phép cắt bì có ích lợi gì?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Hay phép cắt bì có giá trị gì?”'
    reason: lexical_alternative
  - marker: b
    text: “Người Do Thái” ở đây là cách dùng số ít mang tính đại diện, chỉ người Do Thái nói chung.
    reason: cultural_note
lexical_decisions:
- source_word: Τί οὖν
  choice: Vậy, ... gì?
  rationale: Giữ mối liên hệ suy luận và cấu trúc câu hỏi tu từ của Phao-lô bằng cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: τὸ περισσὸν
  choice: ưu thế
  rationale: Trong ngữ cảnh này, từ này chỉ điều nổi trội hay lợi thế; “ưu thế” bảo toàn sắc thái khác với ὠφέλεια mà không khẳng định sự cao hơn về bản chất dân tộc.
- source_word: τοῦ Ἰουδαίου
  choice: người Do Thái
  rationale: Danh từ số ít có mạo từ được dùng theo nghĩa đại diện cho một hạng người. Tiếng Việt có thể giữ dạng số ít tự nhiên mà không cần thêm quán từ.
- source_word: ἢ τίς
  choice: Hay ... gì?
  rationale: Giữ tính song song của câu hỏi tu từ thứ hai.
- source_word: ἡ ὠφέλεια
  choice: ích lợi
  rationale: “Ích lợi” là cách nói rõ ràng, hiện đại, đồng thời giữ được nét phân biệt nhẹ với “ưu thế” ở vế trước.
- source_word: τῆς περιτομῆς
  choice: phép cắt bì
  rationale: Gọi trực tiếp nghi thức giao ước được nêu trong nguyên văn; thêm “phép” giúp cách diễn đạt tự nhiên và trang trọng trong tiếng Việt.
theological_decisions:
- issue: Nên dịch Ἰουδαίου theo nghĩa số ít đại diện hay chuyển thành số nhiều
  choice: người Do Thái
  alternative: dân Do Thái; những người Do Thái
  rationale: Giữ số ít đại diện của Phao-lô và cấu trúc câu hỏi tu từ, trong khi tiếng Việt không tạo ra vấn đề về giống ngữ pháp.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Hai câu hỏi ngắn giữ nhịp điệu tranh biện của nguyên văn; “ưu thế” và “ích lợi” bảo toàn sự thay đổi từ vựng trong tiếng Hy Lạp.
