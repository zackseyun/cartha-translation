  terminology: “Được xưng công chính” là thuật ngữ phù hợp cho δικαιοῦσθαι và giữ sắc thái pháp đình. “Đức tin” và “luật pháp” nhất quán với ngữ vực Kinh Thánh. Chú thích về phương án “được tuyên bố là công chính” hữu ích và được giữ nguyên.
