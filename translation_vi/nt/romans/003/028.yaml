    rationale: “Theo luật pháp” có thể giải thích cụm từ là những việc được luật quy định. “Của luật pháp” bảo toàn liên hệ danh từ nguyên ngữ và không thu hẹp hoặc diễn giải phạm vi cụm từ Phao-lô.
