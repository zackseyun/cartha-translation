id: ROM.3.28
reference: Romans 3:28
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: λογιζόμεθα ⸀γὰρ ⸂δικαιοῦσθαι πίστει⸃ ἄνθρωπον χωρὶς ἔργων νόμου.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/028.yaml
  text: For we conclude that a person is justified by faith apart from works of the law[a][b].
translation:
  language: vi
  text: Vì chúng ta kết luận rằng một người được xưng công chính bởi đức tin, không bởi các việc làm của luật pháp[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “được tuyên bố là công chính.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: λογιζόμεθα
  choice: chúng ta kết luận
  rationale: Động từ diễn tả nhận định có suy xét của Phao-lô trong mạch lập luận; “kết luận” tự nhiên và rõ nghĩa trong tiếng Việt hiện đại.
- source_word: γάρ
  choice: Vì
  rationale: Liên từ nêu cơ sở giải thích cho lập luận trước đó; “Vì” giữ được quan hệ lý do.
- source_word: δικαιοῦσθαι
  choice: được xưng công chính
  rationale: Cách diễn đạt này giữ sắc thái tuyên nhận/pháp đình của động từ thể bị động, đồng thời không giản lược ý nghĩa thần học thành sự biến đổi đạo đức nội tại.
- source_word: πίστει
  choice: bởi đức tin
  rationale: Cách dịch quen thuộc, trang trọng, thể hiện vai trò phương tiện của đức tin mà không diễn giải quá mức.
- source_word: ἄνθρωπον
  choice: một người
  rationale: Danh từ giống đực ở đây được dùng theo nghĩa khái quát, chỉ con người nói chung chứ không riêng nam giới.
- source_word: χωρὶς
  choice: không phụ thuộc vào
  rationale: Trong thế đối lập này, cụm từ diễn tả rằng sự xưng công chính không dựa trên hay lệ thuộc vào các việc làm theo luật pháp; cách dịch tự nhiên hơn lối sát chữ “tách khỏi”.
- source_word: ἔργων νόμου
  choice: các việc làm theo luật pháp
  rationale: Giữ mối liên hệ trực tiếp với νόμος và cho thấy đây là những việc làm gắn với luật pháp, không thu hẹp thành mọi nỗ lực đạo đức nói chung.
theological_decisions:
- issue: Sắc thái của δικαιοῦσθαι trong cách dùng của Phao-lô
  choice: được xưng công chính
  alternative: được tuyên bố là công chính
  rationale: Bản chính dùng thuật ngữ ngắn gọn, quen thuộc và giữ sắc thái pháp đình; chú thích nêu cách diễn đạt minh giải mà không giải quyết hết chiều sâu thần học của động từ.
- issue: Phạm vi của ἄνθρωπον giống đực
  choice: một người
  alternative: một người nam
  rationale: Ngữ cảnh cho thấy nghĩa khái quát về con người; dịch là “một người” phản ánh đúng phạm vi quy chiếu, không áp đặt giới tính nam.
- issue: Quan hệ giữa đức tin và các việc làm theo luật pháp
  choice: bởi đức tin, không phụ thuộc vào các việc làm theo luật pháp
  alternative: bởi đức tin, ngoài các việc làm của luật pháp
  rationale: Cách dịch giữ sự đối lập của Phao-lô mà không tự xác định “các việc làm theo luật pháp” chỉ là nghi lễ, việc thiện hay công đức của con người.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “chúng ta” để phản ánh ngôi thứ nhất số nhiều; “luật pháp” duy trì thuật ngữ Kinh Thánh quen thuộc. Chỉ đặt một chú thích vì tiếng Việt “một người” đã tự nhiên truyền đạt nghĩa khái quát của ἄνθρωπον, nên không cần chú thích riêng về giống ngữ pháp.
