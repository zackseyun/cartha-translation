id: ROM.3.8
reference: Romans 3:8
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ μὴ καθὼς βλασφημούμεθα καὶ καθώς φασίν τινες ἡμᾶς λέγειν ὅτι Ποιήσωμεν τὰ κακὰ ἵνα ἔλθῃ τὰ ἀγαθά; ὧν τὸ κρίμα ἔνδικόν ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/008.yaml
  text: And why not say—as we are slandered and as some claim that we say—“Let us do evil so that good may come”? Their condemnation is just[a][b].
translation:
  language: vi
  text: Và tại sao không nói—như chúng tôi bị vu khống và như một số người quả quyết rằng chúng tôi nói—“Chúng ta hãy làm điều ác để điều lành đến”? Sự kết án của họ là chính đáng.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cách dịch sát hình thức hơn: “Và chẳng phải—như chúng tôi bị vu khống và như một số người nói rằng chúng tôi nói—‘Chúng ta hãy làm điều ác để điều lành đến’ sao?”'
    reason: lexical_alternative
  - marker: b
    text: “Của họ” gần nhất chỉ “một số người” đã vu khống; cũng có thể được hiểu rộng hơn là những người đưa ra hoặc tán thành lời cáo buộc và lối suy luận này.
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ μὴ
  choice: Vậy tại sao không nói
  rationale: Cụm từ Hy Lạp mang tính tỉnh lược và tiếp nối lập luận ở câu trước; cách dịch này làm rõ ý hàm ẩn mà không thêm một khẳng định mới.
- source_word: βλασφημούμεθα
  choice: chúng tôi bị vu khống
  rationale: Trong ngữ cảnh này, động từ chỉ việc lời giảng của Phao-lô và các cộng sự bị xuyên tạc một cách ác ý, chứ không trực tiếp nói đến sự phạm thượng đối với Đức Chúa Trời.
- source_word: φασίν τινες
  choice: một số người quả quyết
  rationale: Diễn đạt lời cáo buộc được thuật lại và giữ sắc thái khẳng định của φημί; “quả quyết” tự nhiên hơn một cách dịch thuần túy là “nói” trong ngữ cảnh tranh luận.
- source_word: λέγειν
  choice: rằng chúng tôi nói
  rationale: Giữ đúng nghĩa trực tiếp của động từ nguyên mẫu; dịch là “dạy” sẽ diễn giải quá lời văn.
- source_word: Ποιήσωμεν
  choice: Chúng ta hãy làm
  rationale: Thể giả định ngôi thứ nhất số nhiều có chức năng khuyến dụ, được chuyển tự nhiên bằng “hãy”.
- source_word: τὰ κακὰ
  choice: điều ác
  rationale: Tính từ có mạo từ được dùng như danh từ số nhiều; “điều ác” vừa gọn vừa tự nhiên trong tiếng Việt.
- source_word: ἵνα ἔλθῃ τὰ ἀγαθά
  choice: để điều lành đến
  rationale: Giữ quan hệ mục đích hoặc kết quả của ἵνα và sự đối xứng giữa “điều ác” với “điều lành”.
- source_word: κρίμα
  choice: sự kết án
  rationale: Trong ngữ cảnh này, từ chỉ phán quyết bất lợi mang tính xét xử; “sự kết án” chính xác hơn nghĩa rộng của “sự phán xét”.
- source_word: ἔνδικόν
  choice: công minh
  rationale: 'Giữ cả sắc thái pháp lý lẫn đạo đức: sự kết án ấy là đúng lẽ và xứng đáng.'
theological_decisions:
- issue: Đối tượng của ὧν trong “ὧν τὸ κρίμα”
  choice: “họ” chỉ những người vu khống hoặc tán thành lời cáo buộc và lối suy luận vừa nêu
  alternative: Hiểu “họ” là những người thực sự chủ trương làm điều ác để điều lành đến
  rationale: Đại từ quan hệ số nhiều liên hệ tự nhiên nhất với “một số người” ngay trước đó, nhưng lời chú thích thừa nhận phạm vi quy chiếu có thể được hiểu rộng hơn theo lối suy luận bị lên án.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dấu gạch ngang giữ phần chen dài của câu Hy Lạp; cặp “điều ác/điều lành” bảo toàn tính đối xứng. “Chúng tôi” chỉ Phao-lô và những người cùng rao giảng, còn “chúng ta” nằm trong lời bị gán cho họ.
