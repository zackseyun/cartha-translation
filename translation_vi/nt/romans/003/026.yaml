id: ROM.3.26
reference: Romans 3:26
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐν τῇ ἀνοχῇ τοῦ θεοῦ, πρὸς ⸀τὴν ἔνδειξιν τῆς δικαιοσύνης αὐτοῦ ἐν τῷ νῦν καιρῷ, εἰς τὸ εἶναι αὐτὸν δίκαιον καὶ δικαιοῦντα τὸν ἐκ πίστεως Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/026.yaml
  text: in God's forbearance[a], for the demonstration of his righteousness at the present time[c][b], so that he might be just and the justifier of the one who has faith in Jesus.
translation:
  language: vi
  text: trong sự nhẫn nhịn của Đức Chúa Trời, nhằm bày tỏ sự công chính[a] của Ngài trong thời hiện tại, để Ngài vừa là Đấng công chính, vừa là Đấng xưng công chính[b] cho người có đức tin nơi Đức Giê-su.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “công lý.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “Đấng tuyên bố là công chính.”'
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể hiểu: “người nhờ sự thành tín của Đức Giê-su.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνοχῇ
  choice: sự nhẫn nhịn
  rationale: Diễn tả việc Đức Chúa Trời chủ ý kiềm giữ sự phán xét tức thời; tự nhiên hơn cách nói quá chung là “kiên nhẫn” và vẫn giữ được sắc thái trì hoãn có chủ ý.
- source_word: ἔνδειξιν
  choice: bày tỏ
  rationale: Giữ ý nghĩa làm cho điều gì được thấy rõ hoặc được chứng tỏ, đồng thời phù hợp với văn phong tiếng Việt hiện đại.
- source_word: δικαιοσύνης
  choice: sự công chính
  rationale: Giữ thuật ngữ nhất quán cho δικαιοσύνη và phù hợp với mạch lập luận của Phao-lô; sắc thái “công lý” được ghi nhận trong chú thích.
- source_word: νῦν καιρῷ
  choice: trong thời hiện tại
  rationale: Cách diễn đạt tự nhiên, đồng thời giữ trọng tâm thời gian của νῦν và καιρός.
- source_word: δίκαιον
  choice: Đấng công chính
  rationale: Giữ nghĩa đạo đức–pháp lý và tạo liên hệ ngôn từ với động từ δικαιοῦντα ngay sau đó.
- source_word: δικαιοῦντα
  choice: Đấng xưng công chính
  rationale: Phân từ hiện tại được dùng như danh từ. “Xưng công chính” giữ sắc thái tuyên bố trong bối cảnh pháp lý và bảo tồn sự tương ứng với “Đấng công chính”.
- source_word: ἐκ πίστεως Ἰησοῦ
  choice: người có đức tin nơi Đức Giê-su
  rationale: Theo cách hiểu sở hữu cách khách quan, đây là cách diễn đạt rõ ràng và tự nhiên trong tiếng Việt. Cách hiểu sở hữu cách chủ quan, nhấn mạnh sự thành tín của Đức Giê-su, được giữ trong chú thích.
theological_decisions:
- issue: Ý nghĩa của ἐκ πίστεως Ἰησοῦ
  choice: người có đức tin nơi Đức Giê-su
  alternative: người thuộc về sự thành tín của Đức Giê-su
  rationale: Cấu trúc sở hữu cách có thể chỉ đức tin hướng đến Đức Giê-su hoặc sự thành tín của Đức Giê-su. Bản chính dùng cách hiểu quen thuộc, dễ đọc hơn, nhưng chú thích bảo tồn cách hiểu còn đang được tranh luận.
- issue: Quan hệ giữa δίκαιον và δικαιοῦντα
  choice: Đấng công chính ... Đấng xưng công chính
  alternative: Đấng công chính ... Đấng làm cho nên công chính
  rationale: Cách chọn giữ được mối liên hệ từ vựng và sắc thái pháp lý mà không buộc câu phải giải quyết toàn bộ câu hỏi thần học về tính chất của hành động công chính hóa.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu được giữ như một mệnh đề tiếp nối câu trước vì bản Hy Lạp mở đầu bằng cụm giới từ. Cặp “Đấng công chính / Đấng xưng công chính” bảo tồn phép chơi chữ và sức căng pháp lý–thần học của δίκαιον / δικαιοῦντα.
