id: ROM.3.3
reference: Romans 3:3
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: τί γάρ; εἰ ἠπίστησάν τινες, μὴ ἡ ἀπιστία αὐτῶν τὴν πίστιν τοῦ θεοῦ καταργήσει;
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/003.yaml
  text: What then? If some were unfaithful[a], will their unfaithfulness nullify God's faithfulness?
translation:
  language: vi
  text: Vậy thì sao? Nếu một số người đã không trung tín, chẳng lẽ sự không trung tín của họ sẽ làm cho sự thành tín của Đức Chúa Trời trở nên vô hiệu sao?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Nếu một số người đã không tin, chẳng lẽ sự không tin của họ sẽ làm cho đức tin của Đức Chúa Trời trở nên vô hiệu sao?” Cụm Hy Lạp theo sát mặt chữ là “đức tin của Đức Chúa Trời”, nhưng trong ngữ cảnh này có lẽ nói đến sự thành tín của Ngài.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τί γάρ
  choice: Vậy thì sao?
  rationale: Cụm này mở ra một bước chuyển trong lập luận và nêu lời phản biện; cách diễn đạt này tự nhiên trong tiếng Việt hiện đại mà vẫn giữ được tính ngắn gọn.
- source_word: ἠπίστησάν
  choice: đã không trung tín
  rationale: Động từ có thể chỉ việc không tin, nhưng sự song hành với ἀπιστία và tương phản với πίστις của Đức Chúa Trời nghiêng về ý không trung tín.
- source_word: τινες
  choice: một số người
  rationale: Diễn đạt tự nhiên một đại từ số nhiều bất định, không hàm ý một nhóm được xác định rõ.
- source_word: ἀπιστία
  choice: sự không trung tín
  rationale: Giữ sự tương ứng với động từ ἠπίστησάν và sự tương phản với sự thành tín của Đức Chúa Trời; nghĩa 'sự không tin' vẫn có thể có.
- source_word: πίστιν τοῦ θεοῦ
  choice: sự thành tín của Đức Chúa Trời
  rationale: Cụm Hy Lạp theo sát mặt chữ là 'đức tin của Đức Chúa Trời', nhưng trong ngữ cảnh đối lập với sự không trung tín của con người, nghĩa sự thành tín hay đáng tin cậy của Đức Chúa Trời là tự nhiên hơn.
- source_word: καταργήσει
  choice: làm cho ... trở nên vô hiệu
  rationale: Truyền đạt ý làm mất hiệu lực hoặc khiến điều gì không còn tác dụng, đồng thời phù hợp với câu hỏi tu từ.
theological_decisions:
- issue: Cách dịch cụm πίστιν τοῦ θεοῦ đang được tranh luận
  choice: sự thành tín của Đức Chúa Trời
  alternative: đức tin của Đức Chúa Trời
  rationale: Sự tương phản giữa ἀπιστία của con người và πίστις của Đức Chúa Trời trong câu này nghiêng mạnh về phẩm tính thành tín của Đức Chúa Trời. Chú thích vẫn bảo lưu cách hiểu sát mặt chữ để không xóa bỏ sự mơ hồ có thật.
- issue: Sắc thái của ἠπίστησάν và ἀπιστία
  choice: không trung tín / sự không trung tín
  alternative: không tin / sự không tin
  rationale: Cách chọn chính giữ được phép đối xứng tu từ với 'sự thành tín'; chú thích ghi nhận khả năng chỉ sự không tin.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Cấu trúc câu hỏi tu từ được giữ lại; 'chẳng lẽ ... sao?' truyền đạt kỳ vọng về câu trả lời phủ định. Danh xưng 'Đức Chúa Trời' được dùng nhất quán.
