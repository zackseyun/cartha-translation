translation:
  language: vi
  text: Miệng họ đầy những lời nguyền rủa và cay đắng.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὧν
  choice: họ
  rationale: Đại từ quan hệ sở hữu liên kết với những người trong văn cảnh trước; tiếng Việt diễn đạt tự nhiên bằng kết cấu “miệng họ” mà vẫn giữ quan hệ sở hữu.
- source_word: τὸ στόμα
  choice: miệng
  rationale: Giữ hình ảnh cụ thể của nguyên văn; danh từ số ít có thể được dùng theo nghĩa khái quát trong tiếng Việt.
- source_word: ἀρᾶς
  choice: lời nguyền rủa
  rationale: Danh từ chỉ lời nguyền hoặc hành vi nguyền rủa; thêm “lời” làm rõ rằng câu đang nói về nội dung phát ra từ miệng.
- source_word: πικρίας
  choice: cay độc
  rationale: Trong ngữ cảnh lời nói, “cay độc” truyền đạt tự nhiên tính chất đắng cay, độc địa của lời lẽ mà không thu hẹp thành một cảm xúc nội tâm.
- source_word: γέμει
  choice: đầy
  rationale: Diễn đạt trực tiếp trạng thái hiện tại “đầy” và phù hợp tự nhiên với cấu trúc “miệng… đầy…”.
