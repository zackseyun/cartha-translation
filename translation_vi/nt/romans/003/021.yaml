id: ROM.3.21
reference: Romans 3:21
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Νυνὶ δὲ χωρὶς νόμου δικαιοσύνη θεοῦ πεφανέρωται, μαρτυρουμένη ὑπὸ τοῦ νόμου καὶ τῶν προφητῶν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/021.yaml
  text: But now[a], apart from the law, the righteousness of God has been revealed, attested by the Law and the Prophets[c][b],
translation:
  language: vi
  text: Nhưng nay, ngoài Luật Pháp, sự công chính của Đức Chúa Trời[a][b] đã được bày tỏ, có Luật Pháp và các Tiên tri[c] làm chứng.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “công lý của Đức Chúa Trời.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể hiểu: “sự công chính đến từ Đức Chúa Trời.”'
    reason: alternative_reading
  - marker: c
    text: “Luật Pháp và các Tiên tri” là cách gọi chỉ Kinh Thánh được lưu truyền cho dân Y-sơ-ra-ên.
    reason: cross_reference
lexical_decisions:
- source_word: Νυνὶ δὲ
  choice: Nhưng nay
  rationale: Diễn đạt cả sắc thái tương phản của δὲ lẫn ý nghĩa thời điểm của νυνί, đồng thời tạo bước chuyển mạnh trong lập luận của Phao-lô.
- source_word: χωρὶς νόμου
  choice: ngoài Luật Pháp
  rationale: Giữ ý nghĩa tách biệt của χωρίς mà không diễn giải thành phương tiện hay công trạng. Viết hoa “Luật Pháp” vì trong ngữ cảnh, νόμος nhiều khả năng chỉ Luật Môi-se.
- source_word: δικαιοσύνη
  choice: sự công chính
  rationale: “Sự công chính” là cách diễn đạt thần học quen thuộc, bao quát hơn “công lý”; khả năng dịch là “công lý” được giữ trong chú thích.
- source_word: θεοῦ
  choice: của Đức Chúa Trời
  rationale: Cấu trúc “của Đức Chúa Trời” bám sát sở hữu cách Hy Lạp và không quyết đoán rằng cụm từ chỉ nói về nguồn ban, thuộc tính hay hành động cứu độ của Đức Chúa Trời.
- source_word: πεφανέρωται
  choice: đã được bày tỏ
  rationale: Thể hoàn thành diễn tả điều đã được biểu lộ và hiện vẫn ở trong trạng thái được nhận biết; “đã được bày tỏ” là tự nhiên và trang trọng trong tiếng Việt.
- source_word: μαρτυρουμένη
  choice: được ... làm chứng
  rationale: Giữ dạng bị động và quan hệ phân từ với mệnh đề chính; cách nói này tự nhiên hơn lối dịch máy móc “đang được chứng thực” trong tiếng Việt.
- source_word: ὑπὸ τοῦ νόμου καὶ τῶν προφητῶν
  choice: được Luật Pháp và các Nhà Tiên Tri làm chứng
  rationale: Diễn đạt rõ tác thể của cấu trúc bị động. Viết hoa để cho thấy đây có thể là tên gọi quy ước chỉ chứng ngôn của Kinh Thánh.
theological_decisions:
- issue: Ý nghĩa sở hữu cách trong δικαιοσύνη θεοῦ
  choice: sự công chính của Đức Chúa Trời
  alternative: sự công chính đến từ Đức Chúa Trời; công lý/công chính thuộc về bản tính và hành động của Đức Chúa Trời
  rationale: Cách dịch chính giữ nguyên độ mở của cụm Hy Lạp, không thu hẹp nó chỉ còn món quà Đức Chúa Trời ban hay chỉ còn phẩm tính công chính của Ngài.
- issue: Quan hệ giữa “ngoài Luật Pháp” và chứng ngôn của “Luật Pháp và các Nhà Tiên Tri”
  choice: Giữ cả hai vế trong thế căng thẳng nguyên văn
  alternative: Diễn giải rằng sự công chính không đến nhờ việc làm theo Luật Pháp nhưng đã được Cựu Ước báo trước
  rationale: Nguyên văn cố ý đặt sự độc lập với Luật Pháp bên cạnh sự làm chứng của Luật Pháp và các Nhà Tiên Tri; bản dịch không giải thích thay cho câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Dùng “Đức Chúa Trời” theo lối xưng gọi Tin Lành phổ biến, nhưng tránh thêm cách giải thích mang tính hệ phái. “Nhưng nay” cô đọng hơn “Nhưng bây giờ” và phù hợp nhịp văn nghị luận. Các thuật ngữ “Luật Pháp,” “sự công chính” và “làm chứng” vừa quen thuộc với độc giả Kinh Thánh vừa đủ rõ trong tiếng Việt hiện đại.
