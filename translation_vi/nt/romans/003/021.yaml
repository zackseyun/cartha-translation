revisions:
- from: Nhưng nay, ngoài Luật Pháp, sự công chính của Đức Chúa Trời[a][b] đã được bày tỏ, được Luật Pháp và các Nhà Tiên Tri[c] làm chứng.
  to: Nhưng nay, ngoài Luật Pháp, sự công chính của Đức Chúa Trời[a][b] đã được bày tỏ, có Luật Pháp và các Tiên tri[c] làm chứng.
  rationale: Chỉ sửa cách gọi «các Nhà Tiên Tri» thành «các Tiên tri» và làm mượt cấu trúc chứng thực. Không thay đổi ý nghĩa, độ mở thần học của δικαιοσύνη θεοῦ, hay quan hệ căng thẳng giữa «ngoài Luật Pháp» và chứng từ của «Luật Pháp và các Tiên tri».
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T10:24:34Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch giữ đúng các thành tố chính của nguyên văn: chuyển ý vừa tương phản vừa thời điểm trong «Nhưng nay», ý tách biệt trong «ngoài Luật Pháp», sở hữu cách còn để ngỏ trong «sự công chính của Đức Chúa Trời», thể hoàn thành trong «đã được bày tỏ», và chứng từ của «Luật Pháp và các Tiên tri». Cách dùng «có ... làm chứng» truyền đạt chính xác phân từ bị động μαρτυρουμένη mà không buộc tiếng Việt phải theo cú pháp bị động gượng.'
  naturalness: «Các Nhà Tiên Tri» viết hoa từng từ và dùng danh từ «nhà» không tự nhiên trong một tên gọi quy ước của Kinh Thánh tiếng Việt. «Luật Pháp và các Tiên tri» là cách gọi rõ, tự nhiên hơn. Đồng thời, «có ... làm chứng» trôi chảy hơn «được ... làm chứng» trong vị trí phân từ sau mệnh đề chính.
  terminology: Giữ «sự công chính của Đức Chúa Trời» để không quyết định trước ý nghĩa của sở hữu cách θεοῦ. Giữ «Luật Pháp» cho νόμος trong ngữ cảnh Môi-se và «Luật Pháp và các Tiên tri» cho công thức quy ước. Các chú thích a và b tiếp tục nêu các khả năng từ vựng/giải nghĩa mà không áp đặt một lập trường giáo phái.
  issues:
  - severity: low
    issue: «các Nhà Tiên Tri» không phải cách gọi tự nhiên trong cụm quy ước.
    rationale: Cụm τοῦ νόμου καὶ τῶν προφητῶν chỉ các bộ phận/chứng nhân Kinh Thánh, không đơn thuần chỉ một nhóm người mang nghề nghiệp «nhà tiên tri». «các Tiên tri» phù hợp hơn với cách dùng tiếng Việt hiện đại.
  - severity: low
    issue: Cú pháp «được Luật Pháp và các ... làm chứng» hơi nặng.
    rationale: Dù hiểu được và không sai nghĩa, «có Luật Pháp và các Tiên tri làm chứng» tự nhiên hơn trong văn nghị luận tiếng Việt, đồng thời vẫn diễn đạt việc sự công chính ấy được các chứng nhân này chứng thực.
