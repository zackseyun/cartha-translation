  - marker: b
    text: 'Theo cách gọi truyền thống: “Đấng Christ Giê-su.”'
    reason: alternative_rendering
lexical_decisions:
- source_word: δικαιούμενοι
  choice: được xưng công chính
  rationale: Giữ thể bị động và sắc thái pháp lý của δικαιόω; cụm phân từ liên kết với mạch câu trước.
- source_word: δωρεὰν
  choice: nhưng không
  rationale: Trong ngữ cảnh Rô-ma 3:24, δωρεάν nói đến việc được ban nhưng không, không do công trạng; cách diễn đạt này tự nhiên trong tiếng Việt.
- source_word: τῇ αὐτοῦ χάριτι
  choice: bởi ân điển của Ngài
  rationale: Diễn đạt phương tiện hoặc căn nguyên của việc xưng công chính, đồng thời giữ thuật ngữ quen thuộc của Phao-lô.
- source_word: ἀπολυτρώσεως
  choice: sự cứu chuộc
  rationale: Giữ ý giải phóng bằng giá chuộc và thuật ngữ thần học đã thông dụng.
- source_word: Χριστῷ Ἰησοῦ
  choice: Đấng Mê-si-a là Đức Giê-su
  rationale: Dịch Χριστός theo chức hiệu 'Đấng Mê-si-a', đồng thời dùng cấu trúc tiếng Việt tự nhiên để nhận diện chức hiệu với Đức Giê-su.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: ở trong Đấng Mê-si-a là Đức Giê-su
  rationale: Giữ quan hệ ἐν và để cụm giới từ bổ nghĩa cho 'sự cứu chuộc', không giải nghĩa quá mức.
theological_decisions:
- issue: Ngôn ngữ xưng công chính của Phao-lô
  choice: được xưng công chính
  alternative: được tuyên bố là công chính
  rationale: Cách chính giữ thuật ngữ pháp lý-thần học cô đọng mà không quyết định vượt quá văn bản về toàn bộ cơ chế; phương án giải thích được nêu trong chú thích.
- issue: Ý nghĩa của ἐν Χριστῷ Ἰησοῦ
  choice: sự cứu chuộc ở trong Đấng Mê-si-a là Đức Giê-su
  alternative: sự cứu chuộc được thực hiện qua Đấng Mê-si-a là Đức Giê-su
  rationale: Giữ sự rộng nghĩa của ἐν, tránh thu hẹp quan hệ này chỉ thành phương tiện.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Câu giữ dạng tiếp nối với Rô-ma 3:23 theo cấu trúc phân từ Hy Lạp; “nhưng không” mang nghĩa được ban miễn phí, không do công trạng.
