base_translation:
  language: en
  yaml_path: translation/nt/romans/003/024.yaml
  text: being justified freely by his grace through the redemption that is in Messiah Jesus[b][a],
translation:
  language: vi
  text: được xưng công chính[a] nhưng không, nhờ ân điển của Ngài, qua sự cứu chuộc ở trong Đấng Mê-si-a[b] là Đức Giê-su.
  philosophy: optimal-equivalence
