- source_word: καὶ
  choice: và
  rationale: Giữ liên từ nối tiếp chuỗi lời cáo buộc trong phần trích dẫn của Phao-lô.
- source_word: ὁδὸν
  choice: con đường
  rationale: Diễn đạt tự nhiên trong tiếng Việt, vừa giữ hình ảnh con đường vừa có thể chỉ lối sống hay cách hành xử.
- source_word: εἰρήνης
  choice: hòa bình
  rationale: Là cách dịch rõ ràng, thông dụng của εἰρήνη ở đây, nói đến một con đường mang đặc tính hòa bình.
- source_word: οὐκ ἔγνωσαν
  choice: không biết
  rationale: Diễn đạt gọn và tự nhiên; động từ aorist trong ngữ cảnh lời cáo buộc khái quát không buộc phải thể hiện bằng một dấu hiệu thì riêng trong tiếng Việt.
