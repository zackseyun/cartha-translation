  rationale: Đổi “hòa bình” thành “bình an” để phản ánh εἰρήνη phù hợp hơn trong ngữ cảnh Kinh Thánh tiếng Việt, đồng thời chỉnh chú thích để nêu một lựa chọn từ vựng trực tiếp cho ὁδός. Không thay đổi nghĩa, hình ảnh ẩn dụ, hay sắc thái khái quát của động từ aorist.
