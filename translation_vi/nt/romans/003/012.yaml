    issue: “lìa khỏi đường ngay” thêm hình ảnh không được nêu rõ trong nguyên văn
    rationale: Cụm “đường ngay” giải thích hóa động từ ἐξέκλιναν. Nên dùng cách diễn đạt không thêm đối tượng hay chuẩn mực cụ thể, chẳng hạn “đã lạc lối.”
  - severity: low
    issue: Câu kết có cấu trúc phủ định gượng
    rationale: “Không một ai ... dù chỉ một người cũng không” lặp phủ định theo cách kém tự nhiên. Có thể giữ nguyên sự nhấn mạnh của οὐκ ἔστιν ... οὐκ ἔστιν ἕως ἑνός bằng “Không ai ... không có lấy một người.”
  revised_text: Tất cả đều đã lạc lối; tất cả cùng trở nên vô dụng[a]. Không ai làm điều tốt[b], không có lấy một người.
