id: ROM.3.12
reference: Romans 3:12
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: πάντες ἐξέκλιναν, ἅμα ἠχρεώθησαν· οὐκ ⸀ἔστιν ποιῶν χρηστότητα, οὐκ ἔστιν ἕως ἑνός.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/012.yaml
  text: All have turned aside[a]; together they have become worthless. There is no one who does what is good[b]; there is not even one.
translation:
  language: vi
  text: Tất cả đều đã lạc lối; tất cả cùng trở nên vô dụng[a]. Không ai làm điều tốt[b], không có lấy một người.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “trở nên vô giá trị” hoặc “trở nên hư hoại.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “thực hành sự tốt lành”; χρηστότητα cũng có thể mang nghĩa “lòng nhân từ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντες
  choice: Tất cả
  rationale: Giữ nguyên phạm vi phổ quát của số nhiều mà không thêm danh từ không có trong bản Hy Lạp.
- source_word: ἐξέκλιναν
  choice: lìa khỏi đường ngay
  rationale: Diễn đạt tự nhiên ý chệch hướng về mặt đạo đức; động từ quá khứ được chuyển phù hợp với mạch trích dẫn.
- source_word: ἅμα
  choice: cùng nhau
  rationale: 'Giữ ý tập thể: mọi người đều chung một tình trạng.'
- source_word: ἠχρεώθησαν
  choice: trở nên vô dụng
  rationale: Giữ sắc thái bị biến đổi dẫn đến tình trạng không còn hữu ích; chú thích nêu phương án nhấn mạnh sự hư hoại hoặc vô giá trị.
- source_word: ποιῶν
  choice: làm
  rationale: Chuyển phân từ sang động từ tự nhiên trong tiếng Việt, vẫn giữ ý hành động đặc trưng.
- source_word: χρηστότητα
  choice: điều tốt
  rationale: Cách nói rõ ràng, tự nhiên trong ngữ cảnh đạo đức, đồng thời chú thích giữ nghĩa khả dĩ là lòng nhân từ.
- source_word: οὐκ ἔστιν
  choice: Không một ai
  rationale: Diễn đạt phủ định mạnh, tự nhiên trong tiếng Việt hiện đại.
- source_word: ἕως ἑνός
  choice: dù chỉ một người cũng không
  rationale: Chuyển thành ngữ Hy Lạp thành lời kết nhấn mạnh rằng không có lấy một ngoại lệ.
theological_decisions:
- issue: Phạm vi của lời phủ định
  choice: Giữ các cách nói tuyệt đối “Tất cả” và “Không một ai”
  alternative: Làm nhẹ thành một nhận định khái quát, có thể có ngoại lệ
  rationale: Bản Hy Lạp nhấn mạnh tính phổ quát bằng πάντες, οὐκ ἔστιν và ἕως ἑνός; bản dịch không nên tự ý giảm nhẹ sức nặng thần học của lời khẳng định.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “lìa khỏi đường ngay” để làm rõ hình ảnh lệch khỏi chuẩn mực; giữ nhịp phủ định mạnh ở câu cuối.
