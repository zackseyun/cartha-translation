  to: Tất cả đều đã lạc lối; tất cả cùng trở nên vô dụng[a]. Không ai làm điều tốt[b], không có lấy một người.
  rationale: Thay cách dịch diễn giải “lìa khỏi đường ngay” bằng “đã lạc lối” để không thêm hình ảnh ngoài nguyên văn và để phản ánh sắc thái hoàn thành. Chỉnh câu phủ định cuối cho tự nhiên hơn, đồng thời giữ hai nhịp phủ định tăng cường của tiếng Hy Lạp. Giữ nguyên các lựa chọn từ vựng và neo chú thích phù hợp.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T10:24:29Z'
review_pass:
  verdict: revise
  source_fidelity: “Lìa khỏi đường ngay” diễn giải thêm hình ảnh “đường ngay,” vốn không hiện diện trong câu Hy Lạp; ἐξέκλιναν chỉ nêu việc lệch/lạc khỏi hướng. “Đã lạc lối” truyền đạt sát hơn ý hoàn thành và sắc thái đạo đức mà không thêm chi tiết. Các vế còn lại truyền đạt đúng tính phổ quát của πάντες, tính tập thể của ἅμα, kết quả của ἠχρεώθησαν, và phủ định nhấn mạnh ở cuối câu.
  naturalness: Câu cuối trong bản thảo, “Không một ai ... dù chỉ một người cũng không,” hơi nặng và lặp cấu trúc phủ định không tự nhiên. “Không ai ... không có lấy một người” vẫn giữ nhịp nhấn mạnh của nguyên văn nhưng tự nhiên trong tiếng Việt hiện đại.
  terminology: “Trở nên vô dụng” phù hợp với ἠχρεώθησαν; chú thích nêu “vô giá trị” và “hư hoại” như các khả năng từ vựng. “Điều tốt” phù hợp với χρηστότητα trong ngữ cảnh đạo đức, và chú thích đúng khi bảo lưu khả năng “lòng nhân từ.” Các neo chú thích được đặt đúng sau từ/cụm từ mà chúng giải thích.
  issues:
