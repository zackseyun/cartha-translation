id: ROM.3.27
reference: Romans 3:27
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ποῦ οὖν ἡ καύχησις; ἐξεκλείσθη. διὰ ποίου νόμου; τῶν ἔργων; οὐχί, ἀλλὰ διὰ νόμου πίστεως.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/027.yaml
  text: Where, then, is boasting? It has been excluded. Through what kind of law? A law of works? No, but through a law of faith.
translation:
  language: vi
  text: Vậy thì sự khoe khoang ở đâu? Nó đã bị loại trừ. Bởi loại luật nào? Luật của việc làm chăng? Không, nhưng bởi luật của đức tin.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καύχησις
  choice: sự khoe mình
  rationale: Diễn đạt danh từ chỉ hành vi hoặc thái độ tự hào, khoe khoang; cách nói này tự nhiên trong tiếng Việt và không giới hạn đối tượng được khoe.
- source_word: ἐξεκλείσθη
  choice: đã bị loại trừ
  rationale: 'Giữ thể bị động và ý nghĩa dứt khoát của động từ: sự khoe mình đã bị gạt ra, không còn chỗ đứng.'
- source_word: διὰ ποίου νόμου
  choice: bởi loại luật nào
  rationale: ποίου hỏi về tính chất hay loại luật, còn διά với sở hữu cách chỉ phương tiện; “bởi” giữ được sắc thái phương tiện mà không diễn giải quá mức.
- source_word: τῶν ἔργων
  choice: luật của việc làm
  rationale: Giữ kết cấu sở hữu cách cô đọng của nguyên văn và cách dùng thần học quen thuộc của ἔργα, không thêm ý như “công đức” hay “việc lành” vốn hẹp hơn.
- source_word: νόμου πίστεως
  choice: luật của đức tin
  rationale: Bảo tồn sự đối xứng và độ căng trong cách nói nghịch lý “luật của đức tin”, thay vì giải nghĩa νόμος thành một “nguyên tắc” cụ thể.
theological_decisions:
- issue: Ý nghĩa của νόμος trong hai cụm “luật của việc làm” và “luật của đức tin”
  choice: Giữ nhất quán là “luật”
  alternative: “nguyên tắc” hoặc “hệ thống”
  rationale: Nguyên văn lặp lại νόμος và có thể hàm ý luật, quy tắc hay nguyên lý. Giữ “luật” bảo tồn lối chơi ý niệm và không đóng khung cách giải thích.
- issue: Quan hệ sở hữu cách trong τῶν ἔργων và πίστεως
  choice: Dùng kết cấu trung tính “của”
  alternative: “dựa trên việc làm” và “dựa trên đức tin”
  rationale: “Dựa trên” sẽ xác định quan hệ ngữ nghĩa rõ hơn nguyên văn. “Của” duy trì sự song hành và tính hàm súc.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Chuỗi câu hỏi–đáp ngắn được giữ để tái hiện sức mạnh lập luận của Phao-lô; “chăng” tạo sắc thái nghi vấn tu từ trang trọng nhưng vẫn quen thuộc.
