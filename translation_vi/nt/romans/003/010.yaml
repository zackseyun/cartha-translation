  text: 'Như có chép rằng: “Không có ai công chính, dù chỉ một người.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθὼς
  choice: Như
  rationale: Kết hợp tự nhiên với “có lời chép rằng” để dẫn vào lời trích Kinh Thánh, đồng thời giữ quan hệ đối chiếu của καθὼς.
- source_word: γέγραπται
  choice: có lời chép
  rationale: Cách diễn đạt trang trọng, quen thuộc trong tiếng Việt cho công thức trích dẫn ở thể hoàn thành bị động; hàm ý lời đã được chép vẫn có giá trị.
- source_word: ὅτι
  choice: 'rằng:'
  rationale: “Rằng” thể hiện rõ chức năng dẫn lời của ὅτι; dấu hai chấm giúp câu trích dẫn tự nhiên trong tiếng Việt.
- source_word: Οὐκ ἔστιν
  choice: Không có
  rationale: Diễn đạt tự nhiên cấu trúc tồn tại kết hợp phủ định của tiếng Hy Lạp.
- source_word: δίκαιος
  choice: người công chính
  rationale: “Công chính” giữ được sắc thái đạo đức và pháp lý-giao ước của δίκαιος trong văn mạch Phao-lô.
- source_word: οὐδὲ εἷς
  choice: dù chỉ một người
  rationale: Thể hiện sức nhấn mạnh của οὐδὲ εἷς và làm rõ rằng không có ngoại lệ, bằng tiếng Việt hiện đại tự nhiên.
theological_decisions:
- issue: Nên diễn đạt mệnh đề theo hướng phẩm chất cá nhân (“không ai là công chính”) hay theo cấu trúc tồn tại bao quát (“không có người công chính nào”).
  choice: Không có người công chính nào
  alternative: Không ai là công chính
  rationale: Lựa chọn này bám sát cấu trúc tồn tại Οὐκ ἔστιν δίκαιος và giữ tính khái quát, tuyệt đối của lời trích, mà không bổ sung cách giải thích thần học.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Cụm “có lời chép rằng” giữ âm hưởng Kinh Thánh mà không quá cổ; “dù chỉ một người” truyền đạt sự nhấn mạnh rõ ràng.
