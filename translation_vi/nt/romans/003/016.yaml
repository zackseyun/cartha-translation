review_pass:
  verdict: revise
  source_fidelity: Bản nháp truyền đạt đúng hai danh từ phối hợp σύντριμμα («sự hủy hoại») và ταλαιπωρία («khốn khổ»), cũng như hình ảnh «đường/lối» của ἐν ταῖς ὁδοῖς αὐτῶν. Tuy nhiên, «ở trên đường chúng đi» không phản ánh rõ số nhiều của ταῖς ὁδοῖς và cách dùng «chúng» cho nhóm người trong mạch văn này có sắc thái thiếu phù hợp.
  naturalness: «Ở trên đường chúng đi» không tự nhiên trong tiếng Việt hiện đại; «trên các đường lối của họ có...» vừa rõ ràng vừa giữ được cấu trúc định vị của nguyên văn. Cụm «đường lối» bảo toàn hình ảnh con đường đồng thời cho phép sắc thái nghĩa bóng.
  terminology: «Sự hủy hoại» và «khốn khổ» là các tương đương phù hợp, trang trọng vừa phải. «Họ» là đại từ trung tính, thích hợp hơn «chúng» khi chỉ con người.
  issues:
  - severity: medium
    issue: Cụm «ở trên đường chúng đi» thiếu tự nhiên và không giữ rõ số nhiều của «các con đường/lối» (ταῖς ὁδοῖς).
    rationale: Cấu trúc «trên các đường lối của họ có...» là tiếng Việt tự nhiên hơn, phản ánh số nhiều của nguyên ngữ, và không thêm ý nghĩa.
  - severity: low
    issue: Đại từ «chúng» không phù hợp sắc thái khi nói về con người trong ngữ cảnh này.
    rationale: Nguyên ngữ chỉ ngôi thứ ba số nhiều, không mang sắc thái vật hóa hay miệt thị; «họ» là lựa chọn trung tính trong tiếng Việt hiện đại.
  revised_text: Trên các đường lối của họ có sự hủy hoại và khốn khổ,[a]
