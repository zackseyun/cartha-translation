- source_word: σύντριμμα
  choice: sự hủy hoại
  rationale: Diễn đạt hậu quả của việc đập phá hoặc tàn phá; tự nhiên trong tiếng Việt hiện đại và giữ được sức nặng của từ Hy Lạp.
- source_word: ταλαιπωρία
  choice: khốn khổ
  rationale: Chuyển tải tình trạng đau đớn, cơ cực và bất hạnh nghiêm trọng bằng cách nói thông dụng, trang trọng vừa phải.
- source_word: ἐν ταῖς ὁδοῖς αὐτῶν
  choice: ở trên đường chúng đi
  rationale: Giữ hình ảnh cụ thể về con đường, đồng thời cho phép hiểu theo nghĩa rộng là lối sống hay hành trình của họ.
- source_word: καὶ
  choice: và
  rationale: Liên từ thông thường nối hai danh từ song song.
