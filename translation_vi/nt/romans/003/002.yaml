  text: πολὺ κατὰ πάντα τρόπον. πρῶτον μὲν ⸀γὰρ ὅτι ἐπιστεύθησαν τὰ λόγια τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/002.yaml
  text: Much in every way. For first of all[a], they were entrusted with the oracles of God.
translation:
  language: vi
  text: Nhiều lắm, về mọi phương diện. Trước hết là vì họ đã được giao phó những lời phán của Đức Chúa Trời.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “những lời sấm truyền của Đức Chúa Trời.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: πολὺ
  choice: Nhiều lắm
  rationale: Dùng theo nghĩa trạng từ để trả lời câu hỏi ngầm về lợi ích; cách diễn đạt này tự nhiên và nhấn mạnh mức độ lớn.
- source_word: κατὰ πάντα τρόπον
  choice: về mọi phương diện
  rationale: Thành ngữ diễn tả tính toàn diện; cách dịch này rõ ràng và trang trọng trong tiếng Việt hiện đại.
- source_word: πρῶτον μὲν γὰρ
  choice: Trước hết
  rationale: Mở đầu lợi ích đầu tiên được nêu. Quan hệ giải thích của γάρ đã được thể hiện tự nhiên qua mạch nối sau câu trả lời, tránh dùng một liên từ gượng ép trong tiếng Việt.
- source_word: ἐπιστεύθησαν
  choice: họ đã được giao phó
  rationale: Thể bị động của πιστεύω ở đây mang nghĩa được trao cho điều gì để quản giữ, chứ không phải ‘họ đã tin’.
- source_word: τὰ λόγια
  choice: những lời phán
  rationale: λόγια chỉ những lời do thần linh phán truyền; ‘những lời phán’ vừa dễ hiểu vừa giữ được sắc thái mặc khải từ Đức Chúa Trời.
- source_word: τοῦ θεοῦ
  choice: của Đức Chúa Trời
  rationale: Dịch trực tiếp sở hữu/cội nguồn của các lời phán, theo cách gọi trang trọng và quen thuộc trong tiếng Việt.
theological_decisions:
- issue: Phạm vi của ‘những lời phán của Đức Chúa Trời’
  choice: Giữ cách nói khái quát, không đồng nhất minh nhiên với toàn bộ Kinh Thánh hay riêng luật pháp.
  alternative: Dịch diễn giải là ‘Kinh Thánh’ hoặc ‘luật pháp của Đức Chúa Trời’.
  rationale: λόγια τοῦ θεοῦ nói đến các lời mặc khải của Đức Chúa Trời nhưng câu này không xác định hẹp hơn; bản dịch không nên giải quyết quá mức phạm vi thần học của cụm từ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. ‘Nhiều lắm’ đáp trực tiếp, mạnh mẽ cho câu hỏi ở câu trước; ‘về mọi phương diện’ duy trì độ bao quát. Dấu chú thích [a] đặt ngay sau cụm từ được chú giải.
