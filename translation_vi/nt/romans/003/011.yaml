  text: οὐκ ἔστιν ⸀ὁ συνίων, οὐκ ἔστιν ⸁ὁ ἐκζητῶν τὸν θεόν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/011.yaml
  text: There is no one who understands[a]; there is no one who seeks God.
translation:
  language: vi
  text: Không ai có sự hiểu biết; không ai tìm kiếm Đức Chúa Trời.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “ra sức tìm kiếm Đức Chúa Trời” hoặc “chuyên tâm tìm kiếm Đức Chúa Trời.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: συνίων
  choice: hiểu biết
  rationale: Phân từ được danh từ hóa chỉ người có sự hiểu biết hoặc nhận thức thấu đáo. “Hiểu biết” tự nhiên trong tiếng Việt và giữ được sắc thái nhận thức mà không diễn giải thêm đối tượng được hiểu.
- source_word: ἐκζητῶν
  choice: tìm kiếm
  rationale: Động từ ghép có thể hàm ý tìm kiếm một cách chuyên tâm hoặc ráo riết, nhưng “tìm kiếm” là cách diễn đạt rõ ràng, tự nhiên và không cường điệu quá mức; sắc thái mạnh hơn được nêu trong chú thích.
- source_word: οὐκ ἔστιν
  choice: Không một ai
  rationale: Cách diễn đạt này giữ nguyên tính tuyệt đối và nhấn mạnh của lời phủ định trong tiếng Hy Lạp, đồng thời tạo cấu trúc tiếng Việt tự nhiên.
- source_word: ὁ συνίων / ὁ ἐκζητῶν
  choice: ai hiểu biết / ai tìm kiếm
  rationale: Các phân từ có chức năng danh từ được chuyển thành cấu trúc chỉ người với “ai”, phù hợp cú pháp tiếng Việt và bảo toàn phép song hành.
- source_word: τὸν θεόν
  choice: Đức Chúa Trời
  rationale: Cách gọi trang trọng, quen thuộc trong văn phong Kinh Thánh tiếng Việt, biểu đạt rõ đối tượng xác định là God trong câu.
theological_decisions:
- issue: Phạm vi của lời phủ định trong chuỗi trích dẫn của Phao-lô
  choice: 'Giữ nguyên hai lời phủ định tuyệt đối: “Không một ai...”'
  alternative: Không ai thật sự hiểu biết; không ai thật lòng tìm kiếm Đức Chúa Trời
  rationale: Bản Hy Lạp đưa ra lời phủ định dứt khoát, không kèm trạng từ hạn định. Thêm “thật sự” hay “thật lòng” sẽ diễn giải và làm dịu sức nặng của câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Phép lặp “Không một ai” được giữ để phản ánh cấu trúc song hành và sức nhấn của nguyên văn; dấu chấm phẩy nối hai vế phủ định tương ứng.
