id: ROM.3.4
reference: Romans 3:4
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: μὴ γένοιτο· γινέσθω δὲ ὁ θεὸς ἀληθής, πᾶς δὲ ἄνθρωπος ψεύστης, ⸀καθὼς γέγραπται· Ὅπως ἂν δικαιωθῇς ἐν τοῖς λόγοις σου καὶ ⸀νικήσεις ἐν τῷ κρίνεσθαί σε.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/004.yaml
  text: 'May it never be! Rather[a], let God be true, and every person a liar[b], as it is written: “So that you may be justified in your words and prevail when you are judged.”'
translation:
  language: vi
  text: 'Tuyệt đối không! Trái lại, Đức Chúa Trời phải là chân thật, còn mọi người đều là kẻ nói dối, như có lời chép:


    “Để Ngài được chứng tỏ là công chính trong những lời Ngài phán,


    và thắng kiện khi Ngài bị xét xử.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “và chiến thắng khi Ngài xét xử.” Cách này phản ánh trực tiếp hơn lời Hê-bơ-rơ trong Thi Thiên 51:4; còn câu Hy Lạp ở Rô-ma được hiểu tự nhiên là “khi Ngài bị xét xử.”'
    reason: alternative_reading
lexical_decisions:
- source_word: μὴ γένοιτο
  choice: Tuyệt đối không!
  rationale: Diễn đạt tự nhiên và mạnh mẽ lời bác bỏ dứt khoát của Phao-lô; tiếng Việt không có cách tương ứng trực tiếp vừa tự nhiên vừa giữ được sắc thái nguyện cầu của thức optative.
- source_word: γινέσθω δὲ ὁ θεὸς ἀληθής
  choice: Trái lại, hãy để Đức Chúa Trời được chứng tỏ là chân thật
  rationale: Giữ lực mệnh lệnh của γινέσθω, đồng thời trong tiếng Việt làm rõ đây không phải là Đức Chúa Trời trở nên chân thật, nhưng sự chân thật của Ngài được xác nhận trong tương phản với sự giả dối của loài người.
- source_word: πᾶς δὲ ἄνθρωπος ψεύστης
  choice: còn mọi người đều là kẻ nói dối
  rationale: ἄνθρωπος chỉ con người nói chung, không riêng nam giới; cách dịch này giữ cả ý phân phối của πᾶς và sự đối lập sắc nét với Đức Chúa Trời chân thật.
- source_word: καθὼς γέγραπται
  choice: như có lời chép
  rationale: Công thức dẫn Kinh Thánh quen thuộc, trang trọng và tự nhiên trong tiếng Việt.
- source_word: δικαιωθῇς ἐν τοῖς λόγοις σου
  choice: Ngài được chứng tỏ là công chính trong những lời Ngài phán
  rationale: Truyền đạt nghĩa pháp đình là được xác nhận đúng và công chính, không hàm ý Đức Chúa Trời từ chỗ không công chính trở thành công chính.
- source_word: νικήσεις
  choice: thắng kiện
  rationale: Động từ mang nghĩa chiến thắng; trong ngữ cảnh xét xử, “thắng kiện” truyền đạt rõ sắc thái pháp đình hơn “chiến thắng”.
- source_word: ἐν τῷ κρίνεσθαί σε
  choice: khi Ngài bị xét xử
  rationale: Dạng nguyên mẫu hiện tại bị động trong bản Hy Lạp Rô-ma được hiểu tự nhiên nhất theo nghĩa “khi Ngài bị xét xử”; cách đọc dựa sát tiếng Hê-bơ-rơ của Thi Thiên được giữ trong chú thích.
theological_decisions:
- issue: Nghĩa pháp đình của δικαιωθῇς khi nói về Đức Chúa Trời
  choice: “được chứng tỏ là công chính”
  alternative: “được xưng công chính” hoặc “được minh oan”
  rationale: Ngữ cảnh nói về sự chân thật của Đức Chúa Trời đối lập với sự giả dối của con người. Câu này không nói Đức Chúa Trời được biến đổi về đạo đức, mà nói Ngài được xác nhận là đúng và công chính.
- issue: Thể của κρίνεσθαί trong lời trích Thi Thiên 51:4
  choice: 'Đọc theo thể bị động: “khi Ngài bị xét xử”'
  alternative: “khi Ngài xét xử”
  rationale: Bản Hy Lạp trong Rô-ma được đọc tự nhiên là bị động, trong khi bản Hê-bơ-rơ của Thi Thiên 51:4 trực tiếp hơn theo nghĩa “khi Ngài xét xử.” Không âm thầm hòa nhập hai cách đọc; phương án kia được nêu trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” trong lời trích vì đối tượng là Đức Chúa Trời. “Tuyệt đối không!” giữ sức mạnh bác bỏ; “được chứng tỏ là chân thật/công chính” tránh ngụ ý rằng phẩm tính của Đức Chúa Trời thay đổi. Dấu chú thích [a] được đặt ngay sau câu trích liên quan.
