  text: πάντες γὰρ ἥμαρτον καὶ ὑστεροῦνται τῆς δόξης τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/023.yaml
  text: For all have sinned and fall short of the glory of God[b][a],
translation:
  language: vi
  text: Vì mọi người đều đã phạm tội và không đạt tới vinh quang của Đức Chúa Trời[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “thiếu vinh quang của Đức Chúa Trời” hoặc “đang thiếu vinh quang của Đức Chúa Trời.”'
    reason: lexical_alternative
  - marker: b
    text: Cụm “vinh quang của Đức Chúa Trời” có thể chỉ chính vinh quang của Ngài, vinh quang mà con người vốn được định để phản chiếu, hoặc vinh quang do Ngài ban cho.
    reason: alternative_reading
lexical_decisions:
- source_word: πάντες
  choice: mọi người đều
  rationale: Dạng số nhiều dùng như danh từ có phạm vi bao quát con người trong ngữ cảnh. “Mọi người đều” tự nhiên trong tiếng Việt và giữ nguyên khẳng định phổ quát của Phao-lô.
- source_word: γὰρ
  choice: vì
  rationale: “Vì” thể hiện chức năng giải thích của γάρ và nối câu này với lập luận ngay trước đó.
- source_word: ἥμαρτον
  choice: đã phạm tội
  rationale: Thì aorist tóm lược thực tại mọi người đã phạm tội; “đã phạm tội” diễn đạt rõ sự kiện ấy bằng tiếng Việt hiện đại.
- source_word: ὑστεροῦνται
  choice: không đạt tới
  rationale: Thì hiện tại chỉ tình trạng thiếu hụt đang tiếp diễn. “Không đạt tới” tự nhiên, đồng thời giữ được ý không đạt được hoặc còn thiếu so với điều được nói đến.
- source_word: δόξης
  choice: vinh quang
  rationale: “Vinh quang” là từ tương ứng quen thuộc và thích hợp với δόξα, nhưng không tự quyết định đó là vinh quang vốn thuộc về Đức Chúa Trời, vinh quang con người đáng lẽ phản chiếu, hay vinh quang Ngài ban.
- source_word: τοῦ θεοῦ
  choice: của Đức Chúa Trời
  rationale: Dịch trực tiếp sở hữu cách Hy Lạp, tránh chuyển thành “từ Đức Chúa Trời” trong chính văn và nhờ đó không thu hẹp ý nghĩa.
theological_decisions:
- issue: Ý nghĩa của cụm “vinh quang của Đức Chúa Trời”
  choice: Giữ nguyên cách diễn đạt trung tính “vinh quang của Đức Chúa Trời”.
  alternative: “vinh quang đến từ Đức Chúa Trời”, “tiêu chuẩn vinh hiển của Đức Chúa Trời”, hoặc “được dự phần vào vinh quang của Đức Chúa Trời”
  rationale: Cụm Hy Lạp ngắn gọn và có thể mang nhiều sắc thái thần học. Chính văn không chọn riêng một cách hiểu, còn chú thích nêu rõ các khả năng chính.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cấu trúc “mọi người đều” làm rõ chủ thể hàm ẩn trong πάντες; “không đạt tới” giữ câu tự nhiên mà không giải quyết dứt khoát sắc thái của ὑστεροῦνται hay nội dung thần học của “vinh quang”.
