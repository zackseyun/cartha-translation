id: ROM.3.13
reference: Romans 3:13
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: τάφος ἀνεῳγμένος ὁ λάρυγξ αὐτῶν, ταῖς γλώσσαις αὐτῶν ἐδολιοῦσαν, ἰὸς ἀσπίδων ὑπὸ τὰ χείλη αὐτῶν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/013.yaml
  text: Their throat is an open grave[a]; they deceive with their tongues[c][b]; the venom of asps is under their lips.
translation:
  language: vi
  text: Cổ họng họ là một ngôi mộ mở toang; họ dùng lưỡi mình mà lừa dối[a]; nọc của rắn độc[b] ở dưới môi họ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “họ vẫn dùng lưỡi mình mà lừa dối,” để thể hiện rõ hơn tính tiếp diễn hoặc lặp lại của động từ Hy Lạp.'
    reason: lexical_alternative
  - marker: b
    text: Nguyên văn chỉ một loại rắn cực độc, có thể dịch là “rắn hổ mang” hoặc theo cách gọi truyền thống là “rắn asp.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τάφος
  choice: ngôi mộ
  rationale: Diễn đạt tự nhiên hình ảnh về sự chết và ô uế; “mồ mả” cũng có thể dùng nhưng kém gọn trong cấu trúc số ít này.
- source_word: ἀνεῳγμένος
  choice: mở toang
  rationale: Phân từ hoàn thành bị động chỉ trạng thái đã được mở và vẫn đang mở; “mở toang” truyền đạt rõ trạng thái ấy và sức mạnh của hình ảnh.
- source_word: λάρυγξ
  choice: cổ họng
  rationale: Tương đương thông dụng, chính xác và giữ nguyên hình ảnh cơ thể trong nguyên văn.
- source_word: ἐδολιοῦσαν
  choice: dùng lưỡi mình mà lừa dối
  rationale: Động từ chỉ hành vi gian dối bằng lời nói; thì chưa hoàn thành gợi hành động diễn tiến hoặc lặp lại, được giữ như một khả năng trong chú thích.
- source_word: ἰὸς
  choice: nọc
  rationale: Trong ngữ cảnh rắn, “nọc” chính xác và tự nhiên hơn từ chung “chất độc”.
- source_word: ἀσπίδων
  choice: rắn độc
  rationale: Tên Hy Lạp chỉ một loại rắn cực độc nhưng việc đồng nhất chính xác loài rắn không chắc chắn; cách gọi khái quát này giữ trọng tâm của hình ảnh mà không khẳng định quá mức về loài.
- source_word: ὑπὸ τὰ χείλη αὐτῶν
  choice: ở dưới môi họ
  rationale: Bám sát cụm giới từ và giữ nguyên hình ảnh sống động của nguyên văn.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Bản dịch giữ ba hình ảnh song song về cổ họng, lưỡi và môi; dùng “họ” thay vì đại từ miệt thị. Các dấu chú thích được đặt đúng tại từ ngữ liên quan; thứ tự chú thích tiếng Anh được hiệu chỉnh vì các dấu và nội dung trong lớp tham khảo không khớp nhau.
