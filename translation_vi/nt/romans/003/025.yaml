revisions:
- from: Đấng ấy, Đức Chúa Trời đã đưa ra làm của lễ chuộc tội[a], qua đức tin nơi huyết Ngài[b], để bày tỏ sự công chính của Ngài[c], vì Ngài đã bỏ qua những tội lỗi người ta đã phạm trước kia.
  to: Đức Chúa Trời đã đưa Ngài ra làm của lễ chuộc tội[a], qua đức tin nơi huyết của Ngài[b], để bày tỏ sự công chính của Ngài[c], vì đã bỏ qua các tội lỗi đã phạm trước kia.
  rationale: Sửa những chỗ chưa tự nhiên trong tiếng Việt mà không thay đổi nghĩa của câu hay lựa chọn dịch thuật chính. Bản sửa duy trì “của lễ chuộc tội” cho ἱλαστήριον và giữ các phương án tranh luận trong chú thích; đồng thời tránh biến “bỏ qua” thành “tha thứ” hoặc áp đặt một quan hệ cú pháp duy nhất cho διὰ πίστεως ἐν τῷ αὐτοῦ αἵματι.
  reviewer_model: gpt-5.6-terra
