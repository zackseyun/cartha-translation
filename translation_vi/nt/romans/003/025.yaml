reference: Romans 3:25
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὃν προέθετο ὁ θεὸς ἱλαστήριον ⸀διὰ πίστεως ἐν τῷ αὐτοῦ αἵματι εἰς ἔνδειξιν τῆς δικαιοσύνης αὐτοῦ διὰ τὴν πάρεσιν τῶν προγεγονότων ἁμαρτημάτων
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/025.yaml
  text: whom God put forward as an atoning sacrifice[a] through faith in his blood[b], to demonstrate his righteousness[c], because of the passing over of previously committed sins.
translation:
  language: vi
  text: Đức Chúa Trời đã đưa Ngài ra làm của lễ chuộc tội[a], qua đức tin nơi huyết của Ngài[b], để bày tỏ sự công chính của Ngài[c], vì đã bỏ qua các tội lỗi đã phạm trước kia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “lễ vật làm nguôi cơn thịnh nộ”; hoặc “nắp chuộc tội” (cũng gọi là “nắp thi ân”), tức nắp bằng vàng trên Hòm Giao Ước, nơi huyết tế lễ chuộc tội được rảy.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể hiểu: “qua đức tin, bởi huyết Ngài”; cụm từ Hy Lạp cho phép những cách xác định quan hệ cú pháp khác nhau.'
    reason: alternative_reading
  - marker: c
    text: 'Cũng có thể dịch: “công lý”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προέθετο
  choice: đã đưa ra
  rationale: Diễn đạt việc Đức Chúa Trời đặt Đức Kitô ra trước công chúng trong vai trò được nêu, đồng thời tránh thu hẹp từ này thành ý nghĩa chỉ ‘định trước’.
- source_word: ἱλαστήριον
  choice: của lễ chuộc tội
  rationale: Cách nói dễ hiểu, giữ sắc thái tế lễ và công hiệu chuộc tội mà không quyết định riêng theo hướng ‘làm nguôi cơn thịnh nộ’ hay đồng nhất hoàn toàn với nắp Hòm Giao Ước.
- source_word: διὰ πίστεως
  choice: qua đức tin
  rationale: Giữ nghĩa phương tiện của διά và dùng cách dịch thông dụng, rõ ràng cho πίστις.
- source_word: ἐν τῷ αὐτοῦ αἵματι
  choice: nơi huyết Ngài
  rationale: Giữ khá sát hình thức Hy Lạp và cách diễn đạt trang trọng trong văn cảnh tế lễ; chú thích bảo tồn cách phân đoạn cú pháp khác.
- source_word: εἰς ἔνδειξιν
  choice: để bày tỏ
  rationale: Diễn đạt tự nhiên lực mục đích của cụm giới từ.
- source_word: δικαιοσύνης
  choice: sự công chính
  rationale: Giữ thuật ngữ chủ đạo trong lập luận của Phao-lô, trong khi ‘công lý’ được ghi nhận như một sắc thái khả dĩ.
- source_word: πάρεσιν
  choice: đã bỏ qua
  rationale: Phân biệt hành động tạm thời không xử phạt hoặc không kể đến với từ ngữ chỉ sự tha thứ trọn vẹn.
- source_word: προγεγονότων ἁμαρτημάτων
  choice: những tội lỗi người ta đã phạm trước kia
  rationale: Làm rõ lực thời gian và ý nghĩa của phân từ bằng tiếng Việt tự nhiên mà không xác định quá mức nhóm người phạm tội.
theological_decisions:
- issue: Cách dịch thuật ngữ gây tranh luận ἱλαστήριον
  choice: của lễ chuộc tội
  alternative: lễ vật làm nguôi cơn thịnh nộ; nắp chuộc tội (nắp thi ân)
  rationale: Bản chính giữ đồng thời khung tế lễ và công hiệu chuộc tội, nhưng không ép người đọc chọn duy nhất cách hiểu hướng về việc làm nguôi cơn thịnh nộ hay hình ảnh nắp Hòm Giao Ước.
- issue: Quan hệ cú pháp trong διὰ πίστεως ἐν τῷ αὐτοῦ αἵματι
  choice: qua đức tin nơi huyết Ngài
  alternative: qua đức tin, bởi huyết Ngài
  rationale: Bản chính hiểu huyết là đối tượng gắn với đức tin; chú thích giữ khả năng huyết chỉ phương tiện khiến Đức Kitô trở thành của lễ chuộc tội.
- issue: Sắc thái của δικαιοσύνη khi nói về Đức Chúa Trời
  choice: sự công chính
  alternative: công lý
  rationale: ‘Sự công chính’ bảo tồn thuật ngữ rộng hơn trong thần học Phao-lô; ‘công lý’ có thể nhấn mạnh hành động xét xử đúng đắn của Đức Chúa Trời.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “Đấng ấy” để nối đại từ quan hệ ὃν với tiền ngữ ở câu trước; dùng “huyết” thay vì “máu” nhằm giữ sắc thái tế lễ trong văn cảnh, nhưng tránh các thuật ngữ thần học quá chuyên môn ở bản chính.
