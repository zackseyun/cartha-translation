id: ROM.3.22
reference: Romans 3:22
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: δικαιοσύνη δὲ θεοῦ διὰ πίστεως Ἰησοῦ Χριστοῦ, εἰς ⸀πάντας τοὺς πιστεύοντας, οὐ γάρ ἐστιν διαστολή.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/022.yaml
  text: And the righteousness of God through faith in Jesus the Messiah[a], for all who believe[b]; for there is no distinction.
translation:
  language: vi
  text: Đó là sự công chính[a] của Đức Chúa Trời, qua đức tin nơi Giê-su, Đấng Mê-si[b], dành cho tất cả những ai tin, vì không có sự phân biệt nào.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “sự công lý.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “qua sự thành tín của Giê-su, Đấng Mê-si.”'
    reason: alternative_reading
lexical_decisions:
- source_word: δικαιοσύνη
  choice: sự công chính
  rationale: “Sự công chính” giữ được sắc thái về tính đúng đắn, hành động công chính và địa vị được kể là công chính trong cách dùng của Phao-lô; “sự công lý” được giữ lại trong chú thích như một khả năng từ vựng có thật.
- source_word: θεοῦ
  choice: của Đức Chúa Trời
  rationale: Dịch trực tiếp sở hữu cách để bảo toàn độ rộng của cụm từ Hy Lạp, thay vì diễn giải hẹp thành “đến từ Đức Chúa Trời”.
- source_word: διὰ πίστεως
  choice: qua đức tin
  rationale: “Đức tin” là cách diễn đạt quen thuộc, trang trọng và tự nhiên; khả năng mang nghĩa “sự thành tín” được bảo lưu trong chú thích về toàn bộ cấu trúc sở hữu cách.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Giê-su, Đấng Mê-si
  rationale: Χριστός được chuyển tải như tước hiệu “Đấng Mê-si”, không như một họ; dấu phẩy giúp tiếng Việt thể hiện rõ tước hiệu đồng vị.
- source_word: εἰς πάντας τοὺς πιστεύοντας
  choice: dành cho tất cả những ai tin
  rationale: Cách diễn đạt tự nhiên trong tiếng Việt, giữ nguyên phạm vi bao quát của πάντας và ý nghĩa chủ động, tiếp diễn của phân từ πιστεύοντας.
- source_word: διαστολή
  choice: sự phân biệt
  rationale: Diễn đạt phù hợp việc không có sự phân chia hay khác biệt về địa vị trong mạch lập luận, đồng thời không thêm đối tượng mà câu Hy Lạp không nêu.
theological_decisions:
- issue: πίστεως Ἰησοῦ Χριστοῦ
  choice: đức tin nơi Giê-su, Đấng Mê-si
  alternative: sự thành tín của Giê-su, Đấng Mê-si
  rationale: Cấu trúc sở hữu cách có thể được hiểu theo hướng khách thể (“tin nơi Giê-su”) hoặc chủ thể (“sự thành tín của Giê-su”). Bản chính dùng cách hiểu phổ biến hơn nhưng chú thích bảo toàn cách hiểu còn lại mà không giải quyết thay cho độc giả.
- issue: δικαιοσύνη θεοῦ
  choice: sự công chính của Đức Chúa Trời
  alternative: sự công lý của Đức Chúa Trời
  rationale: Cụm từ có thể bao hàm phẩm tính và hành động công chính của Đức Chúa Trời cũng như địa vị công chính Ngài ban. Bản dịch sát cấu trúc sở hữu cách và ghi nhận sắc thái “công lý” trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Đấng Mê-si” thể hiện Χριστός như một tước hiệu. Cụm mở đầu “Đó là” nối tự nhiên với câu trước trong văn mạch, nơi câu này giải thích rõ hơn “sự công chính của Đức Chúa Trời” vừa được nhắc đến.
