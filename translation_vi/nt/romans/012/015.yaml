id: ROM.12.15
reference: Romans 12:15
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: χαίρειν μετὰ ⸀χαιρόντων, κλαίειν μετὰ κλαιόντων.
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/015.yaml
  text: Rejoice with those who rejoice[a]; weep with those who weep.
translation:
  language: vi
  text: Hãy vui với người vui; hãy khóc với người khóc.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χαίρειν
  choice: hãy vui
  rationale: Động từ nguyên mẫu hiện tại chủ động mang chức năng khuyên truyền lệnh trong chuỗi lời khuyên ở Rô-ma 12; “hãy vui” truyền đạt tự nhiên cả sắc thái cảm xúc lẫn lực thúc giục.
- source_word: μετὰ
  choice: với
  rationale: Đi với sở hữu cách, μετά chỉ sự đồng hành hoặc chia sẻ; “với” là cách tương đương chính xác và tự nhiên trong tiếng Việt.
- source_word: χαιρόντων
  choice: người vui
  rationale: Phân từ hiện tại chủ động số nhiều được danh từ hóa; “người vui” gọn, tự nhiên và giữ được ý nghĩa khái quát.
- source_word: κλαίειν
  choice: hãy khóc
  rationale: Động từ nguyên mẫu này cũng mang lực khuyên truyền lệnh. “Khóc” sát với κλαίω hơn “đau buồn” và giữ cấu trúc song song với “vui”.
- source_word: κλαιόντων
  choice: người khóc
  rationale: Phân từ hiện tại chủ động số nhiều được danh từ hóa sau μετά; “người khóc” rõ nghĩa và duy trì phép song song của câu.
theological_decisions:
- issue: Lực mệnh lệnh của các động từ nguyên mẫu trong chuỗi lời khuyên
  choice: Dịch cả hai động từ nguyên mẫu bằng dạng khuyên truyền lệnh “hãy vui…; hãy khóc…”
  alternative: “Vui với người vui; khóc với người khóc” hoặc “Vui với người đang vui; khóc với người đang khóc”
  rationale: Dù bản Hy Lạp dùng động từ nguyên mẫu, ngữ cảnh Rô-ma 12:9–21 là một chuỗi lời khuyên, nên cách dịch có “hãy” truyền đạt rõ chức năng diễn ngôn mà không thêm nội dung thần học.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Giữ nguyên cấu trúc song song, ngắn gọn của bản Hy Lạp; không cần chú thích vì các lựa chọn từ vựng không tạo ra khác biệt đáng kể cần nêu trong bản văn.
