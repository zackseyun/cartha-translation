id: ROM.12.16
reference: Romans 12:16
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: τὸ αὐτὸ εἰς ἀλλήλους φρονοῦντες, μὴ τὰ ὑψηλὰ φρονοῦντες ἀλλὰ τοῖς ταπεινοῖς συναπαγόμενοι. μὴ γίνεσθε φρόνιμοι παρ’ ἑαυτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/016.yaml
  text: Be of the same mind toward one another[a]; do not set your mind on high things, but associate with the lowly[b]. Do not become wise in your own sight.
translation:
  language: vi
  text: Hãy đồng lòng với nhau; đừng hướng lòng vào những điều cao sang, nhưng hãy hòa mình với những người có địa vị thấp[a]. Đừng tự cho mình là khôn ngoan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “hãy thuận theo những điều thấp kém.” Từ Hy Lạp ở đây có thể chỉ người có địa vị thấp hoặc những điều thấp kém.'
    reason: alternative_reading
lexical_decisions:
- source_word: τὸ αὐτὸ εἰς ἀλλήλους φρονοῦντες
  choice: Hãy đồng lòng với nhau
  rationale: Thành ngữ diễn tả một tâm hướng chung và sự hòa hợp trong cộng đồng, chứ không đòi hỏi mọi người có suy nghĩ giống hệt nhau. “Đồng lòng với nhau” tự nhiên, rõ nghĩa và giữ sức nặng tương giao của câu Hy Lạp.
- source_word: μὴ τὰ ὑψηλὰ φρονοῦντες
  choice: đừng hướng lòng vào những điều cao sang
  rationale: Cách dịch giữ hình ảnh “nghĩ đến/hướng về những điều cao” và để ngỏ cả sắc thái kiêu ngạo lẫn sự ham chuộng địa vị hoặc những điều được xã hội coi là cao sang.
- source_word: τοῖς ταπεινοῖς συναπαγόμενοι
  choice: hãy hòa mình với những người thấp hèn
  rationale: συναπαγόμενοι có nghĩa được dẫn đi cùng, hòa theo hoặc kết giao; trong tiếng Việt, “hòa mình với” truyền đạt tự nhiên lời kêu gọi không xa cách người có địa vị thấp. Dạng τοῖς ταπεινοῖς vẫn có thể được hiểu là “những điều thấp hèn”, nên ghi chú bảo tồn khả năng ấy.
- source_word: μὴ γίνεσθε
  choice: Đừng tự cho mình
  rationale: Dịch cả cụm với thành ngữ kế tiếp thành lời cảnh báo tự nhiên trong tiếng Việt. Ý tiến trình của γίνεσθε được thể hiện như việc đừng rơi vào hoặc nhận lấy thái độ tự đánh giá mình là khôn ngoan.
- source_word: φρόνιμοι παρ’ ἑαυτοῖς
  choice: là khôn ngoan
  rationale: Kết hợp với “tự cho mình” để diễn đạt sát thành ngữ Hy Lạp về việc khôn ngoan theo sự đánh giá của chính mình, tránh lối dịch cứng “khôn ngoan trong mắt mình”.
theological_decisions:
- issue: Ý nghĩa của τὰ ὑψηλά và τοῖς ταπεινοῖς trong lời khuyên về sự khiêm nhường
  choice: “những điều cao sang” đối lập với “những người thấp hèn”, kèm chú thích nêu khả năng thứ hai
  alternative: “đừng kiêu ngạo, nhưng hãy thuận theo những việc thấp hèn”
  rationale: Văn phạm Hy Lạp cho phép τοῖς ταπεινοῖς chỉ người thấp hèn hoặc những điều thấp hèn; τὰ ὑψηλά cũng có thể chỉ tham vọng cao sang hoặc thái độ kiêu căng. Bản chính ưu tiên cách hiểu mang tính tương giao, phù hợp với “với nhau” ở đầu câu, nhưng không loại bỏ cách hiểu trung tính bằng chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Đồng lòng”, “hướng lòng” và “hòa mình” tạo nhịp khuyên bảo tự nhiên; “người thấp hèn” chỉ địa vị thấp kém trong xã hội, không hàm ý họ kém giá trị.
