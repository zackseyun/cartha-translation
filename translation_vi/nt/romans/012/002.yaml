id: ROM.12.2
reference: Romans 12:2
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ μὴ ⸀συσχηματίζεσθε τῷ αἰῶνι τούτῳ, ἀλλὰ ⸀μεταμορφοῦσθε τῇ ἀνακαινώσει τοῦ ⸀νοός, εἰς τὸ δοκιμάζειν ὑμᾶς τί τὸ θέλημα τοῦ θεοῦ, τὸ ἀγαθὸν καὶ εὐάρεστον καὶ τέλειον.
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/002.yaml
  text: And do not be conformed to this age[a], but be transformed by the renewing of your mind[c][b], so that you may discern what the will of God is—the good and pleasing and perfect.
translation:
  language: vi
  text: Đừng rập khuôn theo thời đại này[a], nhưng hãy được biến đổi nhờ sự đổi mới của tâm trí, để anh chị em có thể phân định đâu là ý muốn của Đức Chúa Trời—điều tốt lành, đẹp lòng[c] và trọn vẹn.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “thế gian này.” Từ Hy Lạp αἰών chính xác hơn có nghĩa là “thời đại,” tức trật tự hoặc thời kỳ hiện tại.'
    reason: lexical_alternative
  - marker: b
    text: “Phân định” cũng có thể dịch là “thử nghiệm và công nhận”; động từ Hy Lạp có thể bao hàm cả việc kiểm nghiệm lẫn nhận ra điều được chấp thuận.
    reason: lexical_alternative
  - marker: c
    text: Nguyên văn chỉ nói “đẹp lòng” hoặc “đáng chấp nhận,” không nêu trực tiếp ai là người được làm đẹp lòng; trong ngữ cảnh, có thể hiểu là đẹp lòng Đức Chúa Trời.
    reason: lexical_alternative
lexical_decisions:
- source_word: συσχηματίζεσθε
  choice: rập khuôn theo
  rationale: Diễn đạt tự nhiên việc mang lấy khuôn mẫu bên ngoài, đồng thời giữ sắc thái mệnh lệnh thụ động/trung gian trong lời cấm.
- source_word: αἰῶνι τούτῳ
  choice: thời đại này
  rationale: αἰών chỉ thời kỳ hoặc trật tự hiện tại hơn là thế giới thụ tạo; “thời đại này” giữ được chiều kích thời gian–đạo đức.
- source_word: μεταμορφοῦσθε
  choice: hãy được biến đổi
  rationale: Giữ dạng thụ động và diễn tả sự thay đổi sâu xa, đối lập với việc rập khuôn bên ngoài.
- source_word: τῇ ἀνακαινώσει τοῦ νοός
  choice: nhờ tâm trí được đổi mới
  rationale: Hiểu cách dữ cách theo nghĩa phương tiện; cách diễn đạt này tự nhiên trong tiếng Việt và không thêm đại từ sở hữu vốn không có trực tiếp trong Hy Lạp.
- source_word: εἰς τὸ δοκιμάζειν
  choice: để ... có thể nhận biết
  rationale: Cấu trúc nêu mục đích/kết quả; “nhận biết” truyền đạt sự phân định qua thử nghiệm, còn sắc thái thử và công nhận được ghi chú.
- source_word: τί τὸ θέλημα τοῦ θεοῦ
  choice: đâu là ý muốn của Đức Chúa Trời
  rationale: Giữ nội dung nghi vấn của τί và cách nói trang trọng, tự nhiên trong tiếng Việt.
- source_word: ἀγαθὸν
  choice: tốt lành
  rationale: Cách dịch chuẩn và phù hợp với phẩm tính của ý muốn Đức Chúa Trời.
- source_word: εὐάρεστον
  choice: đẹp lòng Ngài
  rationale: Diễn đạt tự nhiên ý nghĩa “làm hài lòng”; “Ngài” làm rõ đối tượng được hài lòng nhưng được đánh dấu bằng chú thích vì Hy Lạp không nêu trực tiếp.
- source_word: τέλειον
  choice: trọn vẹn
  rationale: Trong tiếng Việt hiện đại, “trọn vẹn” diễn đạt tính hoàn hảo/đầy đủ mà không dễ gợi ý rằng ý muốn Đức Chúa Trời từng có khiếm khuyết.
theological_decisions:
- issue: Cách dịch αἰών trong sự tương phản đạo đức
  choice: thời đại này
  alternative: thế gian này
  rationale: Tránh biến sự tương phản thành lời phủ định thế giới thụ tạo và giữ khung thời đại hiện tại đối lập với công việc đổi mới của Đức Chúa Trời.
- issue: Sắc thái của δοκιμάζειν đối với ý muốn Đức Chúa Trời
  choice: nhận biết
  alternative: thử nghiệm và công nhận
  rationale: Không ngụ ý con người phán xét ý muốn Đức Chúa Trời; đồng thời chú thích bảo lưu sắc thái kiểm nghiệm và xác nhận điều được chấp thuận.
- issue: Chủ thể được εὐάρεστον làm đẹp lòng
  choice: đẹp lòng Ngài
  alternative: đáng chấp nhận
  rationale: Trong ngữ cảnh, Đức Chúa Trời là đối tượng hợp lý, nhưng bản Hy Lạp vẫn có thể được diễn đạt ít xác định hơn; chú thích bảo lưu điểm này.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh chị em” để thể hiện đối tượng số nhiều của ὑμᾶς; giữ thế đối lập cân xứng giữa “rập khuôn” và “được biến đổi.”
