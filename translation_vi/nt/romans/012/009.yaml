  source_fidelity: 'Bản dịch giữ đúng cấu trúc khuyên bảo của câu và chuyển tải đầy đủ các đối ứng chính: ἀγάπη, ἀποστυγοῦντες, τὸ πονηρόν, κολλώμενοι, và τῷ ἀγαθῷ. “Ghê tởm điều ác” phản ánh tốt sắc thái mạnh của ἀποστυγοῦντες; “gắn bó với điều thiện” phản ánh ý bám chặt của κολλώμενοι. Tuy nhiên, “tình yêu thương phải không giả hình” là cách kết hợp từ chưa tự nhiên trong tiếng Việt, vì “giả hình” thường bổ nghĩa trực tiếp cho người hơn là cho “tình yêu thương.”'
