source:
  edition: SBLGNT
  text: Ἡ ἀγάπη ἀνυπόκριτος. ἀποστυγοῦντες τὸ πονηρόν, κολλώμενοι τῷ ἀγαθῷ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/009.yaml
  text: Let love be without hypocrisy[a]. Abhor what is evil; cling to what is good.
translation:
  language: vi
  text: Tình yêu thương phải chân thành.[a] Hãy ghê tởm điều ác, gắn bó với điều thiện.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Tình yêu thương phải không giả hình.” Nguyên văn Hy Lạp nói sát nghĩa: “Tình yêu thương không giả hình”; câu này không có động từ.'
    reason: Nêu cách dịch sát chữ của ἀνυπόκριτος và giải thích cấu trúc mệnh đề không có động từ trong tiếng Hy Lạp.
lexical_decisions:
- source_word: ἀγάπη
  choice: tình yêu thương
  rationale: Cách diễn đạt tự nhiên trong tiếng Việt hiện đại, nêu rõ tình yêu theo nghĩa đạo đức và quan hệ, không mang sắc thái cổ.
- source_word: ἀνυπόκριτος
  choice: không giả hình
  rationale: 'Giữ hình ảnh cụ thể của từ Hy Lạp: không đạo đức giả, không đóng vai. Thêm “phải” để thể hiện lực khuyên bảo của mệnh đề không có động từ trong văn cảnh.'
- source_word: ἀποστυγοῦντες
  choice: hãy ghê tởm
  rationale: Diễn đạt mức độ căm ghét mạnh của phân từ này và chuyển sang thể mệnh lệnh theo chuỗi lời khuyên trong Rô-ma 12.
- source_word: τὸ πονηρόν
  choice: điều ác
  rationale: Tính từ trung tính có mạo từ được dùng như danh từ; “điều ác” giữ nghĩa đạo đức khái quát và tự nhiên trong tiếng Việt.
- source_word: κολλώμενοι
  choice: gắn bó với
  rationale: Truyền đạt ý bám chặt, kết hợp mật thiết và kiên trì theo điều gì; tự nhiên hơn lối dịch quá sát như “dính vào”.
- source_word: τῷ ἀγαθῷ
  choice: điều thiện
  rationale: Tính từ trung tính có mạo từ được dùng như danh từ; “điều thiện” tạo thế đối xứng rõ với “điều ác” và giữ phạm vi đạo đức rộng.
theological_decisions:
- issue: Lực của mệnh đề không có động từ và các phân từ trong văn cảnh khuyên bảo
  choice: 'Dịch thành một chuỗi lời khuyên: “Tình yêu thương phải… Hãy ghê tởm… gắn bó…”'
  alternative: 'Dịch sát cấu trúc rời: “Tình yêu thương không giả hình, ghê tởm điều ác, gắn bó với điều thiện.”'
  rationale: Nguyên văn mở đầu bằng một mệnh đề danh từ rồi dùng các phân từ, nhưng văn cảnh Rô-ma 12 là chuỗi huấn thị. Cách dịch có lực mệnh lệnh truyền đạt chức năng diễn ngôn mà không áp đặt một cách hiểu giáo lý riêng.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “tình yêu thương” để rõ nghĩa, “ghê tởm” để giữ cường độ của động từ Hy Lạp, và cặp “điều ác/điều thiện” để duy trì cấu trúc song đối.
