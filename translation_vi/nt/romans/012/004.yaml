  text: καθάπερ γὰρ ἐν ἑνὶ σώματι ⸂πολλὰ μέλη⸃ ἔχομεν, τὰ δὲ μέλη πάντα οὐ τὴν αὐτὴν ἔχει πρᾶξιν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/004.yaml
  text: For just as in one body we have many members[a], but the members do not all have the same function[b],
translation:
  language: vi
  text: Vì cũng như trong một thân thể, chúng ta có nhiều bộ phận[a], nhưng không phải tất cả các bộ phận đều có cùng một chức năng[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “nhiều chi thể”.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “cùng một hoạt động”. Từ Hy Lạp có thể chỉ hoạt động hoặc chức năng; trong hình ảnh thân thể ở đây, “chức năng” phù hợp với ngữ cảnh các vai trò khác nhau.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθάπερ γὰρ
  choice: Vì như
  rationale: “Vì” giữ mối liên hệ giải thích với lời khuyên trước đó, còn “như” mở đầu phép so sánh sẽ được hoàn tất ở câu kế tiếp; cách diễn đạt này tự nhiên trong tiếng Việt.
- source_word: ἐν ἑνὶ σώματι
  choice: trong một thân thể
  rationale: Giữ nguyên hình ảnh cụ thể và tính duy nhất của thân thể, không diễn giải sớm thành Hội Thánh.
- source_word: πολλὰ μέλη
  choice: nhiều bộ phận
  rationale: μέλη chỉ các chi thể hay bộ phận của thân thể. “Bộ phận” là cách nói hiện đại, dễ hiểu và vẫn giữ được hình ảnh cơ thể; “chi thể” được ghi nhận như một lựa chọn truyền thống.
- source_word: ἔχομεν
  choice: chúng ta có
  rationale: Chuyển trực tiếp động từ hiện tại ngôi thứ nhất số nhiều, giữ sự bao gồm của “chúng ta”.
- source_word: τὰ δὲ μέλη πάντα οὐ
  choice: nhưng không phải tất cả các bộ phận đều
  rationale: 'Cách đặt phủ định này thể hiện đúng phạm vi: không phải mọi bộ phận đều giống nhau về chức năng, chứ không phải mọi bộ phận đều hoàn toàn không có chức năng ấy.'
- source_word: τὴν αὐτὴν ἔχει πρᾶξιν
  choice: có cùng một chức năng
  rationale: Trong ẩn dụ về thân thể và ngữ cảnh các ân tứ khác nhau, “chức năng” truyền đạt tự nhiên nhất nghĩa của πρᾶξις, đồng thời không loại bỏ sắc thái “hoạt động” được nêu trong chú thích.
theological_decisions:
- issue: Ý nghĩa Hội Thánh học của hình ảnh thân thể
  choice: Giữ nguyên phép so sánh “một thân thể” và “nhiều bộ phận”, không thêm “Hội Thánh” vào câu này.
  alternative: Diễn giải thành “một thân thể là Hội Thánh”.
  rationale: Câu này trình bày vế hình ảnh của phép so sánh; câu kế tiếp mới áp dụng hình ảnh ấy. Cách dịch giữ đúng tiến trình lập luận và không đưa phần giải thích vào chính văn.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. “Thân thể” duy trì sắc thái Kinh Thánh tự nhiên; “bộ phận” tránh sự cổ kính của “chi thể” trong chính văn. Dấu phẩy cuối câu được giữ vì câu 4 dẫn trực tiếp sang câu 5.
