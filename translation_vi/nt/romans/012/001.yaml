id: ROM.12.1
reference: Romans 12:1
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Παρακαλῶ οὖν ὑμᾶς, ἀδελφοί, διὰ τῶν οἰκτιρμῶν τοῦ θεοῦ παραστῆσαι τὰ σώματα ὑμῶν θυσίαν ζῶσαν ἁγίαν ⸂εὐάρεστον τῷ θεῷ⸃, τὴν λογικὴν λατρείαν ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/001.yaml
  text: Therefore I urge you[a], brothers, by the mercies of God, to present your bodies as a living sacrifice[b], holy and pleasing to God—your reasonable worship.
translation:
  language: vi
  text: Vậy, thưa anh em[a], bởi lòng thương xót của Đức Chúa Trời, tôi khuyên anh em hãy dâng thân thể mình làm một của lễ sống, thánh khiết và đẹp lòng Đức Chúa Trời—đó là sự thờ phượng hợp lẽ của anh em.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “thưa anh chị em”; tiếng Hy Lạp viết “anh em” và thường dùng hình thức giống đực để xưng hô với một nhóm gồm cả nam lẫn nữ.
    reason: alternative_reading
  - marker: b
    text: Cũng có thể dịch là “đó là sự thờ phượng thuộc linh của anh em” hoặc “đó là sự phụng sự hợp lý của anh em”. Cụm từ Hy Lạp có thể mang nghĩa sự thờ phượng hay phụng sự có suy xét, thích hợp hoặc thuộc linh.
    reason: lexical_alternative
lexical_decisions:
- source_word: Παρακαλῶ
  choice: tôi khuyên
  rationale: Diễn đạt lời khuyên giục tha thiết của vị sứ đồ bằng tiếng Việt hiện đại, tự nhiên, không làm nhẹ thành một lời đề nghị đơn thuần.
- source_word: οὖν
  choice: Vậy
  rationale: Giữ mối liên hệ suy luận với lập luận ở Rô-ma 1–11; “Vậy” tự nhiên và trang trọng trong tiếng Việt.
- source_word: ἀδελφοί
  choice: anh em
  rationale: Giữ hình thức xưng hô giống đực số nhiều của nguyên văn; chú thích làm rõ rằng trong ngữ cảnh từ này có thể bao gồm cả nam lẫn nữ.
- source_word: διὰ τῶν οἰκτιρμῶν τοῦ θεοῦ
  choice: bởi lòng thương xót của Đức Chúa Trời
  rationale: “Bởi” chuyển tải cơ sở của lời khuyên. Tiếng Việt thường dùng danh từ tập hợp “lòng thương xót”, dù tiếng Hy Lạp dùng hình thức số nhiều.
- source_word: παραστῆσαι
  choice: hãy dâng
  rationale: Trong ngữ cảnh tế lễ, “dâng” tự nhiên hơn “trình diện” và giữ rõ sắc thái hiến dâng cho Đức Chúa Trời.
- source_word: τὰ σώματα ὑμῶν
  choice: thân thể mình
  rationale: Giữ hình ảnh cụ thể “thân thể” thay vì khái quát hóa thành “chính mình”; “mình” quy chiếu tự nhiên về cộng đồng được xưng hô.
- source_word: θυσίαν ζῶσαν
  choice: làm sinh tế sống
  rationale: Giữ nghịch lý tế lễ của Phao-lô; “sinh tế” là cách nói ngắn gọn, trang trọng cho một lễ vật hiến sinh.
- source_word: ἁγίαν
  choice: thánh khiết
  rationale: Diễn đạt tình trạng được biệt riêng cho Đức Chúa Trời bằng thuật ngữ quen thuộc và trang trọng.
- source_word: εὐάρεστον τῷ θεῷ
  choice: đẹp lòng Đức Chúa Trời
  rationale: Cách nói tiếng Việt tự nhiên, truyền đạt điều làm Đức Chúa Trời vui nhận chứ không chỉ đạt mức có thể chấp nhận.
- source_word: λογικὴν
  choice: hợp lẽ
  rationale: Giữ phạm vi nghĩa liên quan đến điều hợp lý, phù hợp và có suy xét mà không thu hẹp hẳn thành “thuộc linh” hay duy lý triết học.
- source_word: λατρείαν
  choice: sự thờ phượng
  rationale: Trong văn cảnh dâng tế lễ cho Đức Chúa Trời, “sự thờ phượng” truyền đạt rõ hướng quy về Đức Chúa Trời; nghĩa “phụng sự” được nêu trong chú thích.
theological_decisions:
- issue: Cách dịch lời xưng hô ἀδελφοί đối với cộng đồng có cả nam lẫn nữ
  choice: anh em
  alternative: anh chị em
  rationale: Giữ hình thức giống đực của nguyên văn trong chính văn, đồng thời dùng chú thích để nói rõ phạm vi bao gồm cả cộng đồng mà không xóa nét hình thức của tiếng Hy Lạp.
- issue: Cách dịch λογικὴν λατρείαν
  choice: sự thờ phượng hợp lẽ
  alternative: sự thờ phượng thuộc linh; sự phụng sự hợp lý
  rationale: Cụm từ có độ mở ngữ nghĩa thật sự giữa hợp lý, thích hợp và thuộc linh. Chính văn dùng cách dịch gần và ít quyết đoán hơn; chú thích bảo tồn các khả năng khác.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Câu giữ cấu trúc lập luận và hình ảnh tế lễ của nguyên văn; dấu gạch ngang làm rõ rằng mệnh đề cuối giải thích ý nghĩa của việc dâng thân thể.
