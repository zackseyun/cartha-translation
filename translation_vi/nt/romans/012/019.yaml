id: ROM.12.19
reference: Romans 12:19
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: μὴ ἑαυτοὺς ἐκδικοῦντες, ἀγαπητοί, ἀλλὰ δότε τόπον τῇ ὀργῇ, γέγραπται γάρ· Ἐμοὶ ἐκδίκησις, ἐγὼ ἀνταποδώσω, λέγει κύριος.
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/019.yaml
  text: 'Do not avenge yourselves[a], beloved, but give place to wrath, for it is written: “Vengeance is mine; I will repay[b], says the Lord.”'
translation:
  language: vi
  text: 'Anh chị em yêu dấu, đừng tự mình báo thù, nhưng hãy nhường chỗ cho cơn thịnh nộ[a], vì có lời chép rằng: “Sự báo thù thuộc về Ta; chính Ta sẽ báo trả[b], Chúa phán.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn nói “nhường chỗ cho cơn thịnh nộ”; xét theo lời trích dẫn ngay sau đó, nhiều khả năng đây là cơn thịnh nộ của Đức Chúa Trời.
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “Ta sẽ đền trả.”'
    reason: alternative_reading
lexical_decisions:
- source_word: μὴ ἑαυτοὺς ἐκδικοῦντες
  choice: đừng tự mình báo thù
  rationale: 'Diễn đạt tự nhiên mệnh lệnh phủ định trong ngữ cảnh, đồng thời giữ rõ ý phản thân ἑαυτούς: không được đích thân thi hành sự báo thù.'
- source_word: ἀγαπητοί
  choice: anh chị em yêu dấu
  rationale: Giữ sắc thái trìu mến của lời xưng hô và phù hợp cách nói trang trọng, tự nhiên với cộng đồng tín hữu trong tiếng Việt hiện đại.
- source_word: ἀλλὰ δότε τόπον τῇ ὀργῇ
  choice: nhưng hãy nhường chỗ cho cơn thịnh nộ
  rationale: Giữ hình ảnh của thành ngữ δότε τόπον và không tự ý thêm “của Đức Chúa Trời”; ngữ cảnh của câu trích dẫn tiếp theo cho thấy nhiều khả năng đây là cơn thịnh nộ của Ngài.
- source_word: γέγραπται γάρ
  choice: vì có lời chép rằng
  rationale: Công thức tiếng Việt quen thuộc và trang trọng để giới thiệu lời Kinh Thánh, phản ánh thể hoàn thành bị động của γέγραπται.
- source_word: Ἐμοὶ ἐκδίκησις
  choice: Sự báo thù thuộc về Ta
  rationale: Thể hiện quan hệ sở hữu của đại từ ở cách dữ mà không làm nhẹ ý nghĩa xét xử của ἐκδίκησις.
- source_word: ἐγὼ ἀνταποδώσω
  choice: chính Ta sẽ báo trả
  rationale: “Báo trả” phù hợp bối cảnh công lý và sự đền đáp; “chính Ta” giữ sức nhấn mạnh của đại từ ἐγώ.
- source_word: λέγει κύριος
  choice: Chúa phán
  rationale: Cách diễn đạt trang trọng, tự nhiên trong công thức trích dẫn lời Đức Chúa Trời; “Chúa” chuyển tải κύριος mà không thêm một danh xưng không có trong câu Hy Lạp.
theological_decisions:
- issue: Đối tượng được nói đến trong τῇ ὀργῇ
  choice: Giữ cách nói ngắn gọn “cơn thịnh nộ” trong chính văn, với chú thích rằng ngữ cảnh nhiều khả năng chỉ cơn thịnh nộ của Đức Chúa Trời.
  alternative: Dịch thẳng là “cơn thịnh nộ của Đức Chúa Trời”, hoặc hiểu là cơn giận nói chung.
  rationale: Lời trích dẫn ngay sau đó đặt quyền báo thù và báo trả nơi Chúa, nên cơn thịnh nộ của Đức Chúa Trời là cách hiểu có cơ sở nhất. Tuy nhiên, nguyên văn không có từ “Đức Chúa Trời”, vì vậy chính văn không nên loại bỏ hoàn toàn độ hàm ẩn ấy.
- issue: Quyền báo thù trong Ἐμοὶ ἐκδίκησις
  choice: “Sự báo thù thuộc về Ta”
  alternative: “Sự báo thù là của Ta”
  rationale: Cả hai đều bảo toàn việc quyền xét xử thuộc riêng về Chúa; cách được chọn tự nhiên và trang trọng hơn trong tiếng Việt hiện đại.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Thưa anh chị em yêu dấu” chuyển lời gọi ἀγαπητοί sang cách xưng hô cộng đồng tự nhiên trong tiếng Việt; đại từ “Ta” viết hoa trong lời Chúa để nhận diện người nói, không nhằm đưa thêm nội dung thần học.
