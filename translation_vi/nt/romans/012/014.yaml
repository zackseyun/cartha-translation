  yaml_path: translation/nt/romans/012/014.yaml
  text: Bless those who persecute you[a]; bless and do not curse.
translation:
  language: vi
  text: Hãy chúc phước cho những người bắt bớ anh chị em[a]; hãy chúc phước và đừng nguyền rủa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “những người đuổi theo anh chị em.” Động từ Hy Lạp có thể mang nghĩa “đuổi theo”, nhưng ở đây có lẽ chỉ sự bắt bớ thù nghịch.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: hãy chúc phước
  rationale: Động từ mệnh lệnh số nhiều được dịch bằng “hãy chúc phước”, cách diễn đạt tự nhiên trong ngữ cảnh tôn giáo và đạo đức, bao hàm việc nói và cầu điều tốt lành cho người khác. Giữ nguyên sự lặp lại để bảo tồn nét nhấn mạnh của Phao-lô.
- source_word: τοὺς διώκοντας
  choice: những người bắt bớ anh chị em
  rationale: Phân từ có mạo từ được dùng như danh từ, chỉ những người đang thực hiện hành động. Trong ngữ cảnh này, διώκω mang nghĩa thù nghịch là “bắt bớ”; “anh chị em” được bổ sung để diễn đạt rõ đối tượng ngầm hiểu của lời khuyên dành cho cộng đồng.
- source_word: καὶ
  choice: (thể hiện bằng dấu phẩy)
  rationale: Liên từ nối mệnh lệnh tích cực được lặp lại với lời cấm theo sau. Trong tiếng Việt, dấu phẩy tạo sự liên kết tự nhiên và súc tích hơn việc dùng “và” tại vị trí này mà không làm mất quan hệ liên kết.
- source_word: μὴ καταρᾶσθε
  choice: đừng nguyền rủa
  rationale: Mệnh lệnh phủ định với μή được chuyển thành “đừng”, còn καταράομαι là “nguyền rủa”. Cách dịch này rõ ràng và giữ nguyên thế đối lập trực tiếp với “chúc phước”.
theological_decisions:
- issue: Phạm vi nghĩa của διώκω trong ngữ cảnh
  choice: Hiểu là sự bắt bớ mang tính thù nghịch
  alternative: những người đuổi theo anh chị em
  rationale: Dù διώκω cũng có thể có nghĩa rộng là “đuổi theo”, cách dùng trong ngữ cảnh đạo đức Cơ Đốc thời đầu và sự tương phản giữa chúc phước với nguyền rủa cho thấy nghĩa “bắt bớ” phù hợp hơn. Chú thích vẫn bảo tồn khả năng từ vựng rộng hơn.
- issue: Cách xưng hô cho đại từ số nhiều ngầm hiểu
  choice: anh chị em
  alternative: các bạn / anh em
  rationale: “Anh chị em” là cách gọi cộng đồng tự nhiên, trang trọng vừa phải và bao gồm cả nam lẫn nữ; đây là phần được bổ sung để làm rõ đối tượng ngầm hiểu, không phải một từ hiện diện trực tiếp sau phân từ Hy Lạp.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Giữ cấu trúc mệnh lệnh, sự lặp lại “hãy chúc phước” và thế đối lập chúc phước/nguyền rủa của nguyên văn.
