translation:
  language: vi
  text: nếu là việc phục vụ[a], thì hãy chuyên tâm phục vụ; nếu là người dạy, thì hãy chuyên tâm dạy dỗ[b];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “nếu là chức vụ, thì hãy chuyên tâm trong chức vụ ấy.” Từ Hy Lạp διακονία có thể có nghĩa là “sự phục vụ” hoặc “chức vụ,” tùy ngữ cảnh.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “nếu là người dạy, thì hãy chuyên tâm vào việc giảng dạy.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴτε
  choice: nếu là
  rationale: Trong danh sách cô đọng về các ân tứ và chức năng, εἴτε giới thiệu từng trường hợp. “Nếu là” diễn đạt tự nhiên cấu trúc điều kiện tỉnh lược trong tiếng Việt.
- source_word: διακονίαν
  choice: phục vụ
  rationale: διακονία có thể chỉ sự phục vụ, công việc phục vụ hoặc chức vụ. “Phục vụ” giữ nghĩa rộng và không mặc nhiên giới hạn vào một chức vụ chính thức trong hội thánh.
- source_word: ἐν τῇ διακονίᾳ
  choice: hãy chuyên tâm phục vụ
  rationale: Cụm ἐν với danh từ được dùng tỉnh lược để khuyên người có ân tứ chuyên chú vào chính lĩnh vực ấy. Cách dịch này tự nhiên trong tiếng Việt và vẫn giữ sự lặp ý của nguyên văn.
- source_word: ὁ διδάσκων
  choice: người dạy
  rationale: Phân từ hiện tại có mạo từ nói đến người đang thực hiện chức năng dạy, chứ không nhất thiết là một chức danh chính thức. “Người dạy” giữ được sắc thái chức năng ấy.
- source_word: διδασκαλίᾳ
  choice: dạy dỗ
  rationale: διδασκαλία ở đây chỉ hoạt động dạy. “Dạy dỗ” rõ ràng, tự nhiên và không mang sắc thái kỹ thuật hoặc giáo phái như một số cách dịch tương đương với “giáo lý”.
theological_decisions:
- issue: Có nên dịch διακονία bằng thuật ngữ mang tính cơ cấu hội thánh hay không
  choice: phục vụ
  alternative: chức vụ
  rationale: Ngữ cảnh liệt kê các ân tứ hoặc chức năng. “Phục vụ” bảo toàn phạm vi rộng của từ Hy Lạp và tránh áp đặt quan niệm về một chức vụ chính thức; chú thích ghi nhận cách hiểu thay thế.
- issue: Có nên biến ὁ διδάσκων thành một chức danh chính thức hay không
  choice: người dạy
  alternative: giáo sư
  rationale: Nguyên văn dùng phân từ chỉ người thực hiện hành động dạy, không minh nhiên gọi tên một chức vụ. “Người dạy” giữ trọng tâm chức năng và tránh nói quá điều văn bản xác định.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Hai lần thêm “hãy chuyên tâm” làm rõ cấu trúc khuyên nhủ vốn được tỉnh lược trong tiếng Hy Lạp; dấu chấm phẩy giữ nhịp song song của danh sách. Các dấu chú thích [a], [b] đều xuất hiện trong chính văn.
