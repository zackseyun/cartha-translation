  text: τῇ σπουδῇ μὴ ὀκνηροί, τῷ πνεύματι ζέοντες, τῷ κυρίῳ δουλεύοντες,
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/011.yaml
  text: Do not be lazy in zeal[a]; be fervent in spirit; serve the Lord.
translation:
  language: vi
  text: Đừng biếng nhác, nhưng hãy chuyên cần; hãy nhiệt thành trong tinh thần[a]; hãy phục vụ Chúa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “hãy nhiệt thành trong Đức Thánh Linh”, nếu πνεύματι được hiểu là chỉ Đức Thánh Linh thay vì tinh thần của người tin.'
    reason: alternative_reading
lexical_decisions:
- source_word: σπουδῇ
  choice: trong sự sốt sắng
  rationale: Danh từ chỉ sự chuyên cần, nhiệt tâm hay sốt sắng. Trong lời khuyên này, “sự sốt sắng” đi cùng sự tương phản với “biếng nhác” và diễn đạt tự nhiên lòng nhiệt tâm thể hiện qua hành động.
- source_word: ὀκνηροί
  choice: biếng nhác
  rationale: Tính từ diễn tả sự lười nhác, chậm chạp hoặc ngại dấn thân. “Biếng nhác” trang trọng vừa phải và làm rõ sự đối lập với σπουδή.
- source_word: πνεύματι
  choice: trong tâm linh
  rationale: Danh từ ở dạng tặng cách không tự nó xác định dứt khoát là tâm linh của con người hay Đức Thánh Linh. Bản văn chính dùng “tâm linh” theo cách hiểu phù hợp với chuỗi lời khuyên về thái độ nội tâm, còn cách hiểu chỉ Đức Thánh Linh được giữ trong chú thích.
- source_word: ζέοντες
  choice: hãy nhiệt thành
  rationale: Động từ theo nghĩa đen là “sôi”, tại đây được dùng ẩn dụ cho sự nồng nhiệt và đầy nhiệt huyết. “Nhiệt thành” truyền đạt tự nhiên sức mạnh của hình ảnh ấy.
- source_word: κυρίῳ
  choice: Chúa
  rationale: Danh hiệu κύριος trong văn cảnh Phao-lô rất có thể chỉ Chúa Giê-su; cách dịch “Chúa” giữ nguyên danh hiệu mà không giải thích vượt quá câu văn.
- source_word: δουλεύοντες
  choice: hãy phục vụ
  rationale: Động từ có nền nghĩa làm nô lệ, nhưng với đối tượng ở tặng cách trong lời khuyên này, “phục vụ Chúa” diễn đạt tự nhiên sự tận hiến và vâng phục mà không làm câu tiếng Việt thô cứng.
theological_decisions:
- issue: Đối tượng quy chiếu của πνεύματι trong τῷ πνεύματι ζέοντες
  choice: tâm linh của người tin / nội tâm
  alternative: Đức Thánh Linh
  rationale: Cấu trúc song song của chuỗi lời khuyên đạo đức thuận với nghĩa “nhiệt thành trong tâm linh”. Tuy nhiên, tiếng Hy Lạp không xác định rõ đối tượng quy chiếu, nên cách hiểu “nhờ Đức Thánh Linh” được ghi ở chú thích thay vì bị loại bỏ.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Ba vế khuyên bảo được giữ cân đối; từ ngữ tránh cổ kính quá mức. Dấu chú thích đặt ngay sau cụm từ có cách hiểu khác.
