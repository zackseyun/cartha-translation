review_pass:
  verdict: revise
  source_fidelity: Bản nháp phản ánh đúng ba mệnh đề khuyên bảo và dịch σωt... Tuy nhiên, “trong sự sốt sắng” vừa kém tự nhiên vừa làm σπουδῇ nghiêng về cảm xúc ‘sốt sắng’ hơn là sự chuyên cần/dốc lòng trong hành động. “Tâm linh” trong tiếng Việt hiện đại thường chỉ lĩnh vực hay đời sống tâm linh, không tự nhiên bằng “tinh thần” khi nói về πνεύματι là nội tâm/thái độ của người tin. Chú thích hiện có cũng chuyển cách hiểu Đức Thánh Linh sang sắc thái phương tiện (“nhờ”), không được biểu thị riêng bởi tiếng Hy Lạp.
  naturalness: 'Nên dùng một cấu trúc mệnh lệnh Việt ngữ trực tiếp, cân đối: “Đừng biếng nhác, nhưng hãy chuyên cần; hãy nhiệt thành trong tinh thần; hãy phục vụ Chúa.” Cách này tự nhiên, hiện đại, và vẫn giữ ba vế song song của nguyên văn.'
  terminology: “Chuyên cần” phù hợp với σπουδῇ trong thế đối lập với ὀκνηροί. “Nhiệt thành” diễn đạt tốt ζέοντες. “Tinh thần” giữ cách hiểu chính là nội tâm/thái độ mà không khẳng định đó là Đức Thánh Linh; chú thích phải nêu khả năng “trong Đức Thánh Linh” thay vì diễn giải là “nhờ”. “Chúa” và “phục vụ Chúa” phù hợp với κυρίῳ δουλεύοντες.
  issues:
  - severity: medium
    issue: “trong sự sốt sắng” dịch σπουδῇ chưa tự nhiên và chưa tối ưu về nghĩa.
    rationale: σπουδή bao hàm sự chuyên cần, siêng năng, dốc lòng; đặt sau “biếng nhác” dưới dạng “trong sự sốt sắng” tạo cụm diễn đạt gượng trong tiếng Việt.
  - severity: medium
    issue: “tâm linh” không phải từ tương đương tự nhiên nhất cho πνεύματι trong câu này.
    rationale: Trong tiếng Việt hiện đại, “tâm linh” thường là khái niệm trừu tượng về đời sống/lĩnh vực thiêng liêng. “Tinh thần” thích hợp hơn cho nội tâm, thái độ, đồng thời vẫn để ngỏ cách hiểu Đức Thánh Linh qua chú thích.
  - severity: medium
    issue: Chú thích diễn đạt phương án Đức Thánh Linh là “nhờ Đức Thánh Linh”.
    rationale: πνεύματι không xác định rõ quan hệ là phương tiện. Khi hiểu là Đức Thánh Linh, “trong Đức Thánh Linh” bảo toàn tốt hơn cấu trúc và tính mơ hồ của nguyên ngữ.
