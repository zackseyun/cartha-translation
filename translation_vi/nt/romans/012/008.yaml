  to: nếu khuyên bảo[a], thì hãy khuyên bảo; người chia sẻ, hãy chia sẻ cách rộng rãi[b]; người lãnh đạo, hãy lãnh đạo cách tận tâm[c]; người thực hành lòng thương xót, hãy làm với lòng vui vẻ[d].
  rationale: Bản sửa bỏ ý “chuyên tâm” không có trong cụm về khuyên bảo, đồng thời đặt ý sốt sắng/tận tâm đúng ở ἐν σπουδῇ. Cấu trúc lặp lại động từ giữ được tính cô đọng và song song của nguyên văn mà vẫn tự nhiên trong tiếng Việt. Mệnh đề cuối được làm rõ để diễn đạt phân từ chủ động “người thực hành lòng thương xót” cùng thái độ vui vẻ, sẵn lòng.
