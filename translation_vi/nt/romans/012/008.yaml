id: ROM.12.8
reference: Romans 12:8
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εἴτε ὁ παρακαλῶν ἐν τῇ παρακλήσει, ὁ μεταδιδοὺς ἐν ἁπλότητι, ὁ προϊστάμενος ἐν σπουδῇ, ὁ ἐλεῶν ἐν ἱλαρότητι.
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/008.yaml
  text: if exhorting[a], in exhortation; the one who shares, with generosity; the one who leads, with diligence; the one who shows mercy[e][d][c][b], with cheerfulness.
translation:
  language: vi
  text: nếu khuyên bảo[a], thì hãy khuyên bảo; người chia sẻ, hãy chia sẻ cách rộng rãi[b]; người lãnh đạo, hãy lãnh đạo cách tận tâm[c]; người thực hành lòng thương xót, hãy làm với lòng vui vẻ[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “nếu khích lệ, thì hãy khích lệ.” Cặp từ Hy Lạp ở đây có thể mang nghĩa khuyên bảo, thúc giục hoặc khích lệ.'
    reason: lexical_alternative
  - marker: b
    text: “Người chia sẻ” cũng có thể dịch là “người ban cho” hoặc “người đóng góp”; “cách rộng rãi” cũng có thể mang sắc thái “với lòng chân thành,” “đơn sơ” hoặc “không vụ lợi.”
    reason: lexical_alternative
  - marker: c
    text: “Người lãnh đạo” cũng có thể dịch là “người cai quản,” “người quản lý” hoặc “người chủ tọa”; “cách tận tâm” cũng có thể dịch là “với sự sốt sắng” hoặc “chuyên cần.”
    reason: lexical_alternative
  - marker: d
    text: 'Cũng có thể dịch: “với lòng hoan hỉ” hoặc “cách vui vẻ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ παρακαλῶν … ἐν τῇ παρακλήσει
  choice: nếu là khuyên bảo, hãy chuyên tâm khuyên bảo
  rationale: Giữ mối liên hệ cùng gốc giữa động từ và danh từ Hy Lạp, đồng thời diễn đạt tự nhiên cấu trúc tỉnh lược tiếp nối câu trước. "Khuyên bảo" có thể bao hàm sự thúc giục và khích lệ.
- source_word: ὁ μεταδιδοὺς
  choice: người chia sẻ
  rationale: Diễn tả việc san sẻ hoặc ban phát từ những gì mình có, không giới hạn vào một loại đóng góp cụ thể.
- source_word: ἐν ἁπλότητι
  choice: hãy rộng rãi
  rationale: Trong ngữ cảnh chia sẻ của cải, nghĩa rộng lượng phù hợp nhất; chú thích vẫn bảo lưu sắc thái chân thành, đơn thuần của từ Hy Lạp.
- source_word: ὁ προϊστάμενος
  choice: người lãnh đạo
  rationale: Cách dịch rộng và tự nhiên, chỉ việc dẫn dắt hoặc coi sóc mà không biến từ này thành tên gọi của một chức vụ Hội Thánh cụ thể.
- source_word: ἐν σπουδῇ
  choice: hãy tận tâm
  rationale: Thể hiện sự chuyên cần, sốt sắng và nghiêm túc cần có trong việc lãnh đạo.
- source_word: ὁ ἐλεῶν … ἐν ἱλαρότητι
  choice: người thương xót, hãy vui lòng mà làm
  rationale: Giữ tính chủ động của phân từ và diễn đạt ἱλαρότης là thái độ vui vẻ, sẵn lòng khi thực thi lòng thương xót.
theological_decisions:
- issue: Phạm vi nghĩa của προϊστάμενος
  choice: người lãnh đạo
  alternative: người cai quản; người quản lý; người chủ tọa
  rationale: Câu này liệt kê các ân ban bằng những phân từ có nghĩa rộng và không nêu chức vụ cụ thể; vì vậy bản dịch không áp đặt một mô hình quản trị giáo hội.
- issue: Nghĩa của ἁπλότης trong việc chia sẻ
  choice: rộng rãi
  alternative: chân thành; đơn sơ; không vụ lợi
  rationale: Mối liên hệ trực tiếp với việc san sẻ khiến nghĩa rộng lượng nổi bật hơn, nhưng chú thích bảo lưu sự đa nghĩa thực sự của từ.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Cấu trúc “hãy…” được bổ sung để làm rõ các mệnh đề tỉnh lược trong danh sách, còn các lựa chọn chú thích bảo lưu độ rộng nghĩa của nguyên văn.
