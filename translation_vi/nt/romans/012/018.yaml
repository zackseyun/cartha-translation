  text: εἰ δυνατόν, τὸ ἐξ ὑμῶν μετὰ πάντων ἀνθρώπων εἰρηνεύοντες·
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/018.yaml
  text: If possible[a], as far as it depends on you, live at peace with all people.
translation:
  language: vi
  text: Nếu có thể, trong phạm vi khả năng của anh chị em, hãy sống hòa thuận với mọi người.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰ δυνατόν
  choice: Nếu có thể được
  rationale: Cụm điều kiện này nêu một giới hạn thực tế, không biến lời khuyên thành mệnh lệnh tuyệt đối; cách diễn đạt tự nhiên trong tiếng Việt vẫn giữ nguyên tính khả hữu.
- source_word: τὸ ἐξ ὑμῶν
  choice: trong phạm vi tùy thuộc vào anh chị em
  rationale: Thành ngữ này chỉ phần nằm trong khả năng và trách nhiệm của người đọc. Cách dịch giữ rõ giới hạn ấy mà vẫn trang trọng, dễ hiểu.
- source_word: μετὰ πάντων ἀνθρώπων
  choice: với mọi người
  rationale: ἄνθρωποι ở đây chỉ con người nói chung, không riêng nam giới; “mọi người” diễn đạt tự nhiên và chính xác phạm vi phổ quát.
- source_word: εἰρηνεύοντες
  choice: hãy sống hòa thuận
  rationale: Phân từ hiện tại có chức năng khuyên bảo trong mạch văn và diễn tả lối sống liên tục; “sống hòa thuận” tự nhiên hơn một cách dịch sát hình thức.
theological_decisions:
- issue: Phạm vi và giới hạn của lời khuyên
  choice: Kêu gọi các tín hữu sống hòa thuận với mọi người, nhưng giới hạn trách nhiệm của họ ở điều thực sự thuộc khả năng của họ.
  alternative: Hiểu đây là mệnh lệnh không điều kiện, hoặc là lời bảo đảm rằng hòa thuận luôn đạt được nếu tín hữu hành động đúng.
  rationale: Hai cụm εἰ δυνατόν và τὸ ἐξ ὑμῶν cùng ngăn việc hiểu lời này như một đòi hỏi hay sự bảo đảm tuyệt đối, trong khi μετὰ πάντων ἀνθρώπων vẫn giữ phạm vi phổ quát.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh chị em” để chỉ cộng đồng người nhận thuộc cả hai giới; giữ cả điều kiện khách quan và giới hạn trách nhiệm cá nhân.
