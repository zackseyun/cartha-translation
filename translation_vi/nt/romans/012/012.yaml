  source_fidelity: 'Bản dịch truyền đạt chính xác ba phân từ khuyến dụ phối hợp: vui mừng trong niềm hy vọng, bền bỉ chịu đựng trong hoạn nạn, và chuyên cần trong sự cầu nguyện. Việc dùng «Hãy» một lần ở đầu câu diễn đạt tự nhiên lực khuyến dụ của cả chuỗi mà không thêm ý nghĩa đáng kể.'
  naturalness: Tiếng Việt hiện đại, rõ ràng, nhịp ba vế cân đối. «Bền lòng trong hoạn nạn» và «kiên trì cầu nguyện» đều tự nhiên trong văn phong Kinh Thánh trang trọng mà vẫn dễ hiểu.
