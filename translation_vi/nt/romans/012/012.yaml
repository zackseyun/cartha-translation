  text: τῇ ἐλπίδι χαίροντες, τῇ θλίψει ὑπομένοντες, τῇ προσευχῇ προσκαρτεροῦντες,
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/012.yaml
  text: rejoicing in hope[a], enduring in affliction, persisting in prayer[b],
translation:
  language: vi
  text: Hãy vui mừng trong niềm hy vọng, bền lòng trong hoạn nạn[a], kiên trì cầu nguyện[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là «gian truân» hoặc «khốn khó»; từ Hy Lạp chỉ sức ép nặng nề, cảnh đau khổ hay hoạn nạn.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là «chuyên tâm cầu nguyện»; từ Hy Lạp nhấn mạnh sự gắn bó bền bỉ, chứ không chỉ việc tiếp tục làm một điều gì đó.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλπίδι
  choice: trong niềm hy vọng
  rationale: Cách diễn đạt tự nhiên trong tiếng Việt cho thể tặng cách chỉ phương diện hoặc nền tảng; từ «niềm» giúp danh từ trừu tượng trở nên tự nhiên mà không biến hy vọng thành một đối tượng được xác định quá mức.
- source_word: χαίροντες
  choice: Hãy vui mừng
  rationale: Phân từ hiện tại nằm trong chuỗi lời khuyên mang lực khuyến lệnh. Dùng «hãy» diễn đạt rõ chức năng khuyên bảo trong tiếng Việt, còn «vui mừng» giữ được ý nghĩa và sắc thái trang trọng.
- source_word: θλίψει
  choice: trong hoạn nạn
  rationale: θλῖψις chỉ sức ép, cảnh khốn khó hoặc đau khổ. «Hoạn nạn» giữ được sức nặng của từ Hy Lạp, dễ hiểu trong tiếng Việt hiện đại và không giới hạn vào một loại đau khổ cụ thể.
- source_word: ὑπομένοντες
  choice: bền lòng
  rationale: ὑπομένω diễn tả việc đứng vững và tiếp tục chịu đựng dưới nghịch cảnh. «Bền lòng» truyền đạt sự chịu đựng kiên định, đồng thời tự nhiên và gọn trong cấu trúc ba vế.
- source_word: προσευχῇ
  choice: cầu nguyện
  rationale: Danh từ προσευχή chỉ sự cầu nguyện nói chung. Trong tiếng Việt, chuyển thành cụm động từ «cầu nguyện» sau «kiên trì» là cách diễn đạt tự nhiên, không làm thay đổi nội dung.
- source_word: προσκαρτεροῦντες
  choice: kiên trì
  rationale: προσκαρτερέω có nghĩa tiếp tục một cách vững vàng, chuyên tâm hoặc gắn bó bền bỉ. «Kiên trì» giữ rõ nét tiếp diễn và bền bỉ, phù hợp với nhịp ngắn gọn của câu.
theological_decisions: []
translation_notes:
  register: Bản dịch dùng tiếng Việt hiện đại, trang trọng và dễ hiểu. Ba phân từ Hy Lạp có lực khuyến lệnh được thể hiện thành một chuỗi lời khuyên mở đầu bằng «Hãy», vừa tự nhiên trong tiếng Việt vừa giữ cấu trúc ba vế cân đối. Các dấu chú thích được đặt ngay sau những từ ngữ mà chú thích giải thích.
