id: ROM.12.21
reference: Romans 12:21
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: μὴ νικῶ ὑπὸ τοῦ κακοῦ, ἀλλὰ νίκα ἐν τῷ ἀγαθῷ τὸ κακόν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/021.yaml
  text: Do not be overcome by evil[a], but overcome evil with good.
translation:
  language: vi
  text: Đừng để điều ác thắng mình,[a] nhưng hãy lấy điều thiện thắng điều ác.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Đừng để sự ác thắng mình, nhưng hãy lấy sự thiện thắng sự ác.” Các tính từ trung tính có mạo từ trong tiếng Hy Lạp có thể được hiểu theo nghĩa trừu tượng (“sự ác”, “sự thiện”) hoặc là “điều ác”, “điều thiện”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ νικῶ
  choice: Đừng để ... thắng mình
  rationale: Động từ ở thể bị động, mệnh lệnh hiện tại ngôi thứ hai số ít, đi với μή để diễn tả lời cấm. Cách nói này tự nhiên trong tiếng Việt, giữ ý bị khuất phục mà không dùng lối diễn đạt nặng nề như “bị chinh phục”.
- source_word: ὑπὸ τοῦ κακοῦ
  choice: điều ác
  rationale: ὑπό với sở hữu cách chỉ tác nhân trong mệnh đề bị động. Tính từ trung tính có mạo từ τοῦ κακοῦ có thể chỉ “sự ác” hoặc “điều gì là ác”; “điều ác” vừa tự nhiên vừa giữ được phạm vi khái quát.
- source_word: ἀλλὰ νίκα
  choice: nhưng hãy ... thắng
  rationale: ἀλλά tạo thế đối lập mạnh; νίκα là mệnh lệnh hiện tại chủ động. Dùng lại “thắng” bảo toàn phép lặp từ và sự đối xứng của nguyên văn.
- source_word: ἐν τῷ ἀγαθῷ
  choice: lấy điều thiện
  rationale: ἐν với tặng cách ở đây biểu thị phương tiện. “Lấy điều thiện” là cách nói tiếng Việt gọn, rõ, cho biết điều thiện là phương tiện để thắng điều ác.
- source_word: τὸ κακόν
  choice: điều ác
  rationale: Tính từ trung tính có mạo từ được dùng theo nghĩa khái quát. “Điều ác” duy trì sự tương phản súc tích với “điều thiện” và không cá nhân hóa điều ác.
theological_decisions:
- issue: Có nên hiểu κακός/ἀγαθός theo nghĩa cá nhân hóa, như “kẻ ác”, hay là các phạm trù đạo đức?
  choice: 'Giữ theo nghĩa khái quát: “điều ác” và “điều thiện”.'
  alternative: Cá nhân hóa thành “kẻ ác” hoặc một chủ thể ác cụ thể.
  rationale: Các dạng trung tính có mạo từ tự nhiên chỉ điều ác và điều thiện nói chung; cú pháp và văn cảnh đạo đức của Rô-ma 12 không đòi hỏi một chủ thể cá nhân như Sa-tan.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cấu trúc hai vế đối lập được giữ ngắn gọn; phép lặp “thắng” phản ánh cùng một động từ νικάω ở thể bị động rồi chủ động.
