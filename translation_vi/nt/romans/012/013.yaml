  text: sharing in the needs of the saints[b][a], pursuing hospitality.
translation:
  language: vi
  text: Hãy góp phần đáp ứng nhu cầu của các thánh đồ[a]; hãy tích cực tìm cách tiếp đón khách lạ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Hãy chia sẻ trong việc đáp ứng nhu cầu của các thánh đồ.”'
    reason: lexical_alternative
  - marker: b
    text: 'Hoặc: “hãy nhiệt thành thực hành lòng hiếu khách.” Từ Hy Lạp này có thể hàm ý việc rộng lòng đón tiếp người lạ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: χρείαις
  choice: những nhu cầu
  rationale: Danh từ này chỉ những nhu cầu thiết thực hoặc điều cần thiết. “Những nhu cầu” là cách diễn đạt tự nhiên, bao quát và phù hợp với lời khuyên về sự trợ giúp cụ thể.
- source_word: ἁγίων
  choice: các thánh đồ
  rationale: Trong cách dùng của Phao-lô, từ này chỉ chung những người tin Chúa như dân thánh của Đức Chúa Trời, chứ không phải một nhóm người được phong thánh theo nghĩa xuất hiện về sau. “Các thánh đồ” giữ được thuật ngữ thần học quen thuộc.
- source_word: κοινωνοῦντες
  choice: chia sẻ với ... trong
  rationale: Động từ có thể mang nghĩa cùng dự phần, chia sẻ hoặc đóng góp. Cách dịch này giữ sắc thái liên đới và dự phần vào việc đáp ứng nhu cầu, thay vì giới hạn ý nghĩa vào tiền bạc.
- source_word: φιλοξενίαν
  choice: tiếp đón khách lạ
  rationale: Danh từ Hy Lạp chỉ lòng hiếu khách, với sắc thái nguyên nghĩa là yêu mến người xa lạ. Dịch thành hành động “tiếp đón khách lạ” làm rõ chiều hướng hướng ra ngoài của đức tính này trong tiếng Việt hiện đại.
- source_word: διώκοντες
  choice: sốt sắng tìm cách
  rationale: Động từ διώκω diễn tả sự theo đuổi tích cực và bền bỉ. “Sốt sắng tìm cách” truyền đạt tính chủ động mạnh hơn cách nói đơn thuần “thực hành”.
theological_decisions:
- issue: Đối tượng của cụm từ “các thánh đồ”
  choice: Toàn thể những người tin Chúa, tức dân thánh của Đức Chúa Trời
  alternative: Những người được phong thánh theo nghĩa giáo hội xuất hiện về sau
  rationale: Trong thư tín Phao-lô, οἱ ἅγιοι thường là cách gọi cộng đồng các tín hữu. Bản dịch giữ thuật ngữ “các thánh đồ” nhưng không thu hẹp đối tượng vào một hạng người đặc biệt.
translation_notes:
  register: Văn phong khuyên nhủ trang trọng nhưng hiện đại. Hai phân từ Hy Lạp được chuyển thành hai mệnh lệnh nối tiếp để phù hợp với ngữ cảnh các lời khuyên trong Rô-ma 12. Cụm “sốt sắng tìm cách” giữ sức mạnh chủ động của διώκω mà vẫn tự nhiên trong tiếng Việt.
