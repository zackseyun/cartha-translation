  rationale: Sửa mệnh đề đầu để diễn đạt không mơ hồ ý συμμε dự/góp phần của κοινωνέω trong việc đáp ứng những nhu cầu thiết thực của cộng đồng tín hữu. Sửa nhẹ mệnh đề và chú thích thứ hai để giữ cả lực chủ động của διώκω lẫn chiều kích đón tiếp người lạ của φιλοξενία, với lối diễn đạt hiện đại và tự nhiên.
