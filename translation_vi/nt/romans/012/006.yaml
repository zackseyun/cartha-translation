  text: ἔχοντες δὲ χαρίσματα κατὰ τὴν χάριν τὴν δοθεῖσαν ἡμῖν διάφορα, εἴτε προφητείαν κατὰ τὴν ἀναλογίαν τῆς πίστεως,
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/006.yaml
  text: 'But having gifts that differ according to the grace given to us: if prophecy[a], in proportion to faith;'
translation:
  language: vi
  text: 'Nhưng chúng ta có những ân tứ khác nhau, tùy theo ân điển đã được ban cho chúng ta: nếu là nói tiên tri, hãy nói tương xứng với đức tin[a];'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể hiểu là “tương xứng với đức tin của mình”; hoặc “phù hợp với nội dung đức tin”. Cụm từ Hy Lạp có thể chỉ mức độ đức tin được ban cho người nói, hoặc sự phù hợp với nội dung của đức tin Cơ Đốc.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔχοντες δὲ
  choice: Nhưng chúng ta có
  rationale: Chuyển phân từ số nhiều thành mệnh đề hữu hạn để câu tiếng Việt tự nhiên, đồng thời giữ sắc thái chuyển ý nhẹ của δέ và mối liên hệ với câu trước.
- source_word: χαρίσματα
  choice: những ân tứ
  rationale: “Ân tứ” là cách diễn đạt ngắn gọn, quen thuộc trong ngữ cảnh Phao-lô và vẫn cho thấy đây là những sự ban cho bởi ân điển.
- source_word: κατὰ τὴν χάριν τὴν δοθεῖσαν ἡμῖν
  choice: tùy theo ân điển đã ban cho mình
  rationale: κατά biểu thị sự tương ứng; “ân điển” diễn đạt χάρις như sự ban cho nhưng không do công trạng. “Mình” quy chiếu tự nhiên về chủ ngữ bao gồm người nói và độc giả.
- source_word: διάφορα
  choice: khác nhau
  rationale: Giữ nghĩa về sự đa dạng của các ân tứ bằng cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: εἴτε προφητείαν
  choice: nếu là nói tiên tri
  rationale: Giữ cấu trúc liệt kê rút gọn do εἴτε mở đầu; dùng “nói tiên tri” để chỉ hoạt động/chức năng thay vì ngầm thêm một định nghĩa giáo phái về ân tứ này.
- source_word: κατὰ τὴν ἀναλογίαν τῆς πίστεως
  choice: hãy nói tương xứng với đức tin
  rationale: “Tương xứng với” bảo tồn ý niệm tỷ lệ hoặc tương quan của ἀναλογία. Động từ “hãy nói” được bổ sung từ ý nghĩa hàm ẩn để tiếng Việt thành câu tự nhiên, còn “đức tin” giữ nguyên tính khái quát của πίστις.
theological_decisions:
- issue: Ý nghĩa của κατὰ τὴν ἀναλογίαν τῆς πίστεως
  choice: tương xứng với đức tin
  alternative: tương xứng với đức tin của mình; phù hợp với nội dung đức tin Cơ Đốc
  rationale: Cụm Hy Lạp có thể nói đến mức độ đức tin được ban cho người nói, hoặc sự phù hợp với nội dung đức tin. Bản văn chính không xác định dứt khoát cách hiểu nào; các khả năng chính được giữ trong chú thích.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Câu giữ dấu hai chấm và dấu chấm phẩy vì đây là phần mở đầu của danh sách tiếp tục ở câu sau; chú thích bảo tồn sự mơ hồ thực sự của cụm từ Hy Lạp.
