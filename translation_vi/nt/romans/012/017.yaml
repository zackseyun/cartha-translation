revisions:
- from: Đừng lấy điều ác báo điều ác cho bất cứ ai; hãy lưu tâm làm điều tốt[a] trước mặt mọi người.
  to: Đừng lấy điều ác đáp lại điều ác cho bất cứ ai; hãy suy xét trước để làm điều tốt[a] trước mặt mọi người.
  rationale: Chỉnh nhẹ để tránh lưỡng nghĩa tiềm ẩn của “báo ... cho ai” và phản ánh rõ hơn sắc thái suy tính trước của προνοέω. Các lựa chọn từ vựng chính và chú thích về καλά được giữ nguyên.
