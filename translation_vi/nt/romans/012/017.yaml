review_pass:
  verdict: revise
  source_fidelity: Mệnh đề đầu truyền đạt đúng ý cấm trả đũa (μηδενὶ κακὸν ἀντὶ κακοῦ ἀποδιδόντες). Tuy nhiên, trật tự “báo điều ác cho bất cứ ai” có thể thoáng gây lưỡng nghĩa với động từ “báo” (‘thông báo’). Mệnh đề sau phản ánh đúng hướng nghĩa của προνοούμενοι và καλά, nhưng “lưu tâm làm” giảm nhẹ yếu tố suy tính trước của προνοούμενοι.
  naturalness: Bản dịch nhìn chung hiện đại, trang trọng và dễ hiểu. “Lấy điều ác đáp lại điều ác” là cách nói tự nhiên hơn trong văn cảnh này; “suy xét trước để làm” diễn đạt rõ sự cân nhắc chủ động mà vẫn tự nhiên.
  terminology: “Điều ác,” “điều tốt,” và “mọi người” phù hợp với phạm vi và sắc thái đạo đức của κακόν, καλά, và πάντων ἀνθρώπων. Chú thích bảo tồn hợp lý các khả năng ‘đáng trọng’ và ‘cao đẹp’ của καλά.
  issues:
  - severity: low
    issue: Cụm “báo điều ác cho bất cứ ai” có thể gây vướng hoặc lướt qua lưỡng nghĩa của “báo.”
    rationale: Trong tiếng Việt hiện đại, “báo ... cho ai” đôi khi được hiểu là ‘thông báo ... cho ai’. Đổi sang “đáp lại điều ác” làm rõ quan hệ trả đũa của ἀποδιδόντες và ἀντί.
  - severity: low
    issue: “Hãy lưu tâm làm” chưa biểu lộ rõ nét nghĩa suy tính trước của προνοούμενοι.
    rationale: προνοούμενοι nói đến việc cân nhắc/chủ động tính trước đối với điều tốt. “Hãy suy xét trước để làm điều tốt” giữ nét này mà không biến động từ thành nghĩa chu cấp.
  revised_text: Đừng lấy điều ác đáp lại điều ác cho bất cứ ai; hãy suy xét trước để làm điều tốt[a] trước mặt mọi người.
