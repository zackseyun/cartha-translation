  text: μηδενὶ κακὸν ἀντὶ κακοῦ ἀποδιδόντες· προνοούμενοι καλὰ ἐνώπιον πάντων ἀνθρώπων·
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/017.yaml
  text: Repaying no one evil for evil[a], but taking thought for what is good in the sight of all people.
translation:
  language: vi
  text: Đừng lấy điều ác đáp lại điều ác cho bất cứ ai; hãy suy xét trước để làm điều tốt[a] trước mặt mọi người.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “điều đáng trọng” hoặc “điều cao đẹp.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: μηδενὶ
  choice: cho bất cứ ai
  rationale: Dạng tặng cách làm bổ ngữ gián tiếp cho ἀποδιδόντες. Trong cấu trúc phủ định tiếng Việt, “đừng… cho bất cứ ai” diễn đạt tự nhiên và giữ trọn phạm vi phổ quát.
- source_word: κακὸν ἀντὶ κακοῦ
  choice: lấy điều ác báo điều ác
  rationale: Cách nói quen thuộc, trang trọng trong tiếng Việt, giữ được sức nặng đạo đức của κακόν và ý trao trả, báo đáp của ἀντί trong ngữ cảnh trả đũa.
- source_word: ἀποδιδόντες
  choice: báo
  rationale: Phân từ hiện tại mang sức khuyên bảo theo mạch văn. “Báo” trong thành ngữ “lấy điều ác báo điều ác” diễn đạt rõ hành động đáp trả mà không thu hẹp vào thiệt hại vật chất.
- source_word: προνοούμενοι
  choice: hãy lưu tâm làm
  rationale: προνοέω chỉ việc suy xét và chủ tâm trước về cách hành xử. “Lưu tâm làm” vừa tự nhiên trong tiếng Việt vừa giữ phương diện cân nhắc có chủ ý, không hiểu từ này theo nghĩa hẹp là chu cấp.
- source_word: καλὰ
  choice: điều tốt
  rationale: καλά có thể chỉ điều tốt về đạo đức, đồng thời mang sắc thái đáng trọng hoặc cao đẹp. “Điều tốt” giữ nghĩa rộng trong chính văn; các sắc thái khác được ghi ở chú thích.
- source_word: ἐνώπιον πάντων ἀνθρώπων
  choice: trước mặt mọi người
  rationale: Cụm này diễn đạt điều được thấy hoặc được đánh giá công khai. “Trước mặt mọi người” tự nhiên, bao gồm mọi người không phân biệt giới tính và giữ khía cạnh trách nhiệm xã hội.
theological_decisions:
- issue: Sắc thái đạo đức và công khai của καλά
  choice: điều tốt
  alternative: điều đáng trọng; điều cao đẹp
  rationale: Trong bối cảnh “trước mặt mọi người,” từ này có thể bao gồm cả sự tốt lành về đạo đức lẫn điều được nhìn nhận là đáng trọng. Chính văn dùng nghĩa rộng, không thu hẹp lời khuyên thành việc chỉ chăm lo vẻ bề ngoài; chú thích bảo tồn sắc thái danh dự và cao đẹp.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Hai mệnh đề khuyên bảo được diễn đạt bằng “Đừng…” và “hãy…”. Thành ngữ “lấy điều ác báo điều ác” giúp câu tự nhiên mà vẫn bám sát cấu trúc và ý trả đũa của nguyên ngữ.
