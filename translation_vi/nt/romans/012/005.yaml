  text: οὕτως οἱ πολλοὶ ἓν σῶμά ἐσμεν ἐν Χριστῷ, ⸀τὸ δὲ καθ’ εἷς ἀλλήλων μέλη.
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/005.yaml
  text: so we[a], though many, are one body in Messiah, and individually members of one another.
translation:
  language: vi
  text: Cũng vậy, chúng ta tuy nhiều nhưng là một thân thể trong Đấng Mê-si-a[a]; còn từng người một là chi thể của nhau.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “trong Đấng Ki-tô.” Danh hiệu Hy Lạp Χριστός có thể dịch theo cả hai cách; ở đây dùng “Đấng Mê-si-a” để giữ rõ nghĩa danh hiệu.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὕτως
  choice: Cũng vậy
  rationale: Nối phép so sánh với hình ảnh một thân thể có nhiều chi thể ở câu trước, đồng thời diễn đạt tự nhiên trong tiếng Việt.
- source_word: οἱ πολλοὶ
  choice: chúng ta tuy nhiều
  rationale: Ngữ cảnh cho thấy Phao-lô nói bao gồm chính mình và các tín hữu; “tuy nhiều” giữ được sự tương phản với “một thân thể”.
- source_word: ἓν σῶμά
  choice: một thân thể
  rationale: Giữ nguyên ẩn dụ về thân thể và nhấn mạnh sự hiệp nhất.
- source_word: ἐν Χριστῷ
  choice: trong Đấng Mê-si-a
  rationale: Giữ cấu trúc thần học “trong” và chuyển Χριστός theo nghĩa danh hiệu, thay vì chỉ dùng như tên riêng.
- source_word: τὸ δὲ καθ’ εἷς
  choice: còn xét riêng từng người
  rationale: Diễn đạt rõ lực phân phối của thành ngữ καθ’ εἷς và giữ nét đối chiếu của δέ.
- source_word: μέλη
  choice: những chi thể
  rationale: “Chi thể” giữ hình ảnh các bộ phận của thân thể và phù hợp với văn phong Kinh Thánh trang trọng nhưng dễ hiểu.
- source_word: ἀλλήλων
  choice: thuộc về nhau
  rationale: Thể hiện quan hệ hỗ tương của đại từ ἀλλήλων bằng tiếng Việt tự nhiên, không làm suy yếu ý mỗi người gắn bó với những người khác.
theological_decisions:
- issue: Cách chuyển danh hiệu Χριστῷ trong ἐν Χριστῷ
  choice: trong Đấng Mê-si-a
  alternative: trong Đấng Ki-tô
  rationale: “Đấng Mê-si-a” làm rõ tính chất danh hiệu của Χριστός, trong khi vẫn giữ nguyên ngôn ngữ của Phao-lô về sự hợp nhất “trong” Ngài. Chú thích ghi nhận cách gọi quen thuộc “Đấng Ki-tô” mà không giải quyết thiên lệch sắc thái của danh hiệu.
- issue: Quan hệ giữa các tín hữu trong ἀλλήλων μέλη
  choice: những chi thể thuộc về nhau
  alternative: những chi thể của nhau
  rationale: “Thuộc về nhau” là tiếng Việt tự nhiên hơn nhưng vẫn giữ quan hệ hỗ tương mạnh của nguyên văn, không giản lược thành việc họ chỉ cùng thuộc một tổ chức.
translation_notes:
  register: 'Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “chi thể” để duy trì nhất quán ẩn dụ thân thể; cấu trúc dấu chấm phẩy làm rõ hai vế: sự hiệp nhất của toàn thể và quan hệ hỗ tương của từng người.'
