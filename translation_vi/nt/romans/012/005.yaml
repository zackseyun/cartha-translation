  source_fidelity: 'Bản dịch giữ đúng các yếu tố chính của nguyên văn: phép nối suy luận của οὕτως, thế tương phản “nhiều/một thân thể”, cụm thần học ἐν Χριστῷ được dịch theo nghĩa danh hiệu, và quan hệ hỗ tương trong ἀλλήλων μέλη. Tuy nhiên, việc lặp lại “chúng ta” sau “xét riêng từng người” làm chủ ngữ của vế sau kém khớp với lực phân phối của καθ’ εἷς.'
