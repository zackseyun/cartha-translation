    issue: Đại từ “anh chị em” במקום đại từ số ít
    rationale: Nguyên văn dùng σου, số ít, trong cả “kẻ thù của bạn” và chủ ngữ của σωρεύσεις. “Anh chị em” là lối xưng hô số nhiều hướng đến cộng đồng và do đó không bảo toàn trực tiếp số của bản văn.
  - severity: low
    issue: “khi làm như vậy”
    rationale: Không sai nghĩa, nhưng “vì làm như vậy” phản ánh trực tiếp hơn phân từ ποιῶν với sắc thái phương tiện (“by doing this”), đồng thời câu gọn và tự nhiên hơn.
  - severity: low
