revisions:
- from: Nhưng nếu kẻ thù của anh chị em đói, hãy cho người ấy ăn; nếu khát, hãy cho người ấy uống; vì khi làm như vậy, anh chị em sẽ chất than hồng trên đầu người ấy.[a]
  to: Nhưng nếu kẻ thù của bạn đói, hãy cho người ấy ăn; nếu khát, hãy cho người ấy uống; vì làm như vậy, bạn sẽ chất than hồng trên đầu người ấy.[a]
  rationale: Bản sửa chỉ thay hệ thống đại từ để bảo toàn số ít của σου và σωρεύσεις, điều chỉnh liên từ/cụm phân từ cho sát sắc thái “bằng việc làm này,” và làm mượt câu chú thích. Hình ảnh “than hồng trên đầu người ấy” được giữ nguyên, không diễn giải thần học.
  reviewer_model: gpt-5.6-terra
