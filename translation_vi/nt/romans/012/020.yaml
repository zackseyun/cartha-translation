id: ROM.12.20
reference: Romans 12:20
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸂ἀλλὰ ἐὰν⸃ πεινᾷ ὁ ἐχθρός σου, ψώμιζε αὐτόν· ἐὰν διψᾷ, πότιζε αὐτόν· τοῦτο γὰρ ποιῶν ἄνθρακας πυρὸς σωρεύσεις ἐπὶ τὴν κεφαλὴν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/020.yaml
  text: But if your enemy is hungry[a], feed him; if he is thirsty, give him something to drink; for by doing this you will heap burning coals on his head.
translation:
  language: vi
  text: Nhưng nếu kẻ thù của bạn đói, hãy cho người ấy ăn; nếu khát, hãy cho người ấy uống; vì làm như vậy, bạn sẽ chất than hồng trên đầu người ấy.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sát chữ: “những cục than lửa.” Hình ảnh này có thể gợi sự hổ thẹn dẫn đến ăn năn, sự day dứt lương tâm đau đớn, hoặc sự phán xét sắp đến; chính văn giữ nguyên ẩn dụ Hy Lạp.'
    reason: Nêu cách dịch sát chữ và các cách hiểu khả dĩ của ẩn dụ đang được tranh luận, không áp đặt một cách giải thích trong chính văn.
lexical_decisions:
- source_word: ἀλλὰ ἐὰν
  choice: Nhưng nếu
  rationale: ἀλλά tạo thế tương phản với lời cấm trả thù ở câu trước, còn ἐάν mở đầu mệnh đề điều kiện. “Nhưng nếu” tự nhiên và giữ đủ hai sắc thái này.
- source_word: πεινᾷ ὁ ἐχθρός σου
  choice: kẻ thù của anh chị em đói
  rationale: Giữ danh từ số ít “kẻ thù” và diễn đạt trạng thái đói bằng cách nói tự nhiên trong tiếng Việt. “Anh chị em” phù hợp với lời khuyên trực tiếp dành cho cộng đồng tín hữu mà không làm thay đổi ý nghĩa sở hữu của σου.
- source_word: ψώμιζε αὐτόν
  choice: hãy cho người ấy ăn
  rationale: ψωμίζω chỉ hành động cung cấp thức ăn. Cách dịch này rõ nghĩa, tự nhiên hơn lối dịch sát chữ cứng nhắc và giữ mệnh lệnh ở thì hiện tại.
- source_word: ἐὰν διψᾷ, πότιζε αὐτόν
  choice: nếu khát, hãy cho người ấy uống
  rationale: ποτίζω có nghĩa là cho uống, không nhất thiết chỉ cho uống nước. Chủ thể “kẻ thù” được hiểu rõ từ mệnh đề trước nên có thể lược bỏ tự nhiên trong tiếng Việt.
- source_word: τοῦτο γὰρ ποιῶν
  choice: vì khi làm như vậy
  rationale: Cụm phân từ nêu cơ sở hoặc kết quả gắn với việc thực hiện các mệnh lệnh vừa nói. “Khi làm như vậy” giữ được liên hệ ấy mà không áp đặt một cách giải thích thần học.
- source_word: ἄνθρακας πυρὸς
  choice: than hồng
  rationale: Cụm Hy Lạp sát chữ là “những cục than lửa”. “Than hồng” là cách nói hiện đại, gọn và tự nhiên cho than đang cháy, đồng thời giữ nguyên hình ảnh cụ thể.
- source_word: σωρεύσεις ἐπὶ τὴν κεφαλὴν αὐτοῦ
  choice: anh chị em sẽ chất ... trên đầu người ấy
  rationale: Giữ thì tương lai của σωρεύσεις, hành động chất thành đống và hình ảnh cụ thể “trên đầu” mà không diễn giải ẩn dụ.
theological_decisions:
- issue: Ý nghĩa của hình ảnh “chất than hồng trên đầu”
  choice: Giữ nguyên ẩn dụ trong chính văn, không xác định một cách giải thích duy nhất.
  alternative: Diễn giải thành sự hổ thẹn dẫn đến ăn năn, sự cáo trách đau đớn, hoặc sự phán xét sắp đến.
  rationale: Hình ảnh Hy Lạp có nhiều cách hiểu và văn cảnh không giải thích minh nhiên. Dịch nguyên hình ảnh bảo toàn sự mơ hồ và sức căng thần học của câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “anh chị em” để nói với cộng đồng độc giả, “người ấy” để chỉ kẻ thù số ít mà không thêm sắc thái miệt thị; giữ nhịp song song “nếu… hãy…” của nguyên văn.
