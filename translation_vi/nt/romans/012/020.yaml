    rationale: “Sự cáo trách đau đớn về mặt đạo đức” không thật tự nhiên trong tiếng Việt hiện đại. “Sự day dứt lương tâm đau đớn” truyền đạt rõ khả năng giải thích về sự xác tín/đau đớn luân lý mà không quyết định nghĩa của ẩn dụ.
