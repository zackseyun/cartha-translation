id: ROM.12.10
reference: Romans 12:10
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: τῇ φιλαδελφίᾳ εἰς ἀλλήλους φιλόστοργοι, τῇ τιμῇ ἀλλήλους προηγούμενοι,
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/010.yaml
  text: In brotherly love, be affectionate toward one another; in honor, outdo one another.
translation:
  language: vi
  text: Hãy yêu thương nhau tha thiết như anh chị em trong một gia đình; hãy thi đua tôn trọng nhau.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “hãy chủ động đi đầu trong việc tôn trọng nhau.”'
    reason: Nguyên ngữ προηγούμενοι có thể mang nghĩa vượt lên người khác hoặc đi trước, dẫn đầu.
lexical_decisions:
- source_word: φιλαδελφίᾳ
  choice: như anh chị em trong một gia đình
  rationale: Diễn đạt tình yêu thương giữa những người cùng thuộc một gia đình, đồng thời dùng cách gọi bao quát và tự nhiên trong tiếng Việt hiện đại.
- source_word: φιλόστοργοι
  choice: yêu thương nhau tha thiết
  rationale: Chuyển tải sự trìu mến, gắn bó sâu đậm vốn đặc trưng cho tình thân trong gia đình mà không tạo lối diễn đạt gượng ép.
- source_word: τιμῇ
  choice: tôn trọng
  rationale: Thể hiện việc dành sự quý trọng và danh dự cho người khác; đây là cách nói rõ ràng, tự nhiên trong tiếng Việt.
- source_word: προηγούμενοι
  choice: thi đua
  rationale: Giữ sắc thái chủ động cố gắng vượt lên trong việc tôn trọng người khác, phù hợp với ngữ cảnh khích lệ lẫn nhau, đồng thời không biến câu thành lời dạy về địa vị.
theological_decisions:
- issue: Ý nghĩa của προηγούμενοι trong mệnh đề về sự tôn trọng
  choice: hãy thi đua tôn trọng nhau
  alternative: hãy chủ động đi đầu trong việc tôn trọng nhau
  rationale: Động từ có thể gợi ý cả việc vượt lên lẫn việc đi trước làm gương. Bản chính giữ sức căng của lời kêu gọi cạnh tranh theo hướng tích cực; chú thích nêu cách hiểu khả dĩ còn lại.
translation_notes:
  register: Văn phong khuyên nhủ, trang trọng nhưng gần gũi. “Anh chị em” và “trong một gia đình” làm rõ hình ảnh tình thân cho độc giả hiện đại; “thi đua” giữ sức mạnh tu từ của nguyên văn mà vẫn tự nhiên trong tiếng Việt.
