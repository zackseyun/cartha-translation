revisions:
- from: 'Vì nhờ ân điển đã ban cho tôi, tôi nói với mỗi người trong anh em: đừng nghĩ về mình cao hơn mức phải nghĩ, nhưng hãy suy xét cách sáng suốt,[a] theo mức độ đức tin mà Đức Chúa Trời đã phân cho mỗi người.[b]'
  to: 'Vì nhờ ân điển đã ban cho tôi, tôi nói với mỗi người trong anh em: đừng tự đánh giá mình cao hơn mức nên đánh giá, nhưng hãy suy nghĩ cách sáng suốt,[a] tùy theo một mức độ đức tin mà Đức Chúa Trời đã phân cho mỗi người.[b]'
  rationale: Chỉnh sửa nhẹ để tiếng Việt tự nhiên hơn, phản ánh rõ hơn tính phản thân của lời cảnh báo và mạo tính bất định của μέτρον, đồng thời bảo toàn sự mơ hồ có chủ ý về ý nghĩa của μέτρον πίστεως. Các neo chú thích vẫn đặt đúng tại cụm có biến thể từ vựng và cụm có các cách hiểu khả dĩ.
  reviewer_model: gpt-5.6-terra
