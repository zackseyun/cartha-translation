id: ROM.12.3
reference: Romans 12:3
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Λέγω γὰρ διὰ τῆς χάριτος τῆς δοθείσης μοι παντὶ τῷ ὄντι ἐν ὑμῖν μὴ ὑπερφρονεῖν παρ’ ὃ δεῖ φρονεῖν, ἀλλὰ φρονεῖν εἰς τὸ σωφρονεῖν, ἑκάστῳ ὡς ὁ θεὸς ἐμέρισεν μέτρον πίστεως.
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/003.yaml
  text: For by the grace given to me I say to everyone among you not to think of himself more highly than he ought to think, but to think with sound judgment, as God has apportioned to each a measure of faith.
translation:
  language: vi
  text: 'Vì nhờ ân điển đã ban cho tôi, tôi nói với mỗi người trong anh em: đừng tự đánh giá mình cao hơn mức nên đánh giá, nhưng hãy suy nghĩ cách sáng suốt,[a] tùy theo một mức độ đức tin mà Đức Chúa Trời đã phân cho mỗi người.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “nhưng hãy suy nghĩ sao cho biết tự chủ” hoặc “nhưng hãy suy nghĩ để có sự tỉnh táo.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “theo thước đo đức tin,” hoặc có thể là “một mức độ tin cậy/trung tín.” Cụm từ Hy Lạp chỉ một mức đo liên hệ đến đức tin do Đức Chúa Trời ban, nhưng không xác định chính xác sắc thái.'
    reason: alternative_reading
lexical_decisions:
- source_word: διὰ τῆς χάριτος τῆς δοθείσης μοι
  choice: nhờ ân điển đã ban cho tôi
  rationale: διά với sở hữu cách diễn tả phương tiện hoặc cơ sở; cách dịch này tự nhiên và vẫn gợi đến thẩm quyền, chức vụ Phao-lô nhận bởi ân điển.
- source_word: παντὶ τῷ ὄντι ἐν ὑμῖν
  choice: với mỗi người trong anh em
  rationale: Giữ lực phân phối của παντί và diễn đạt tự nhiên việc Phao-lô nói với từng thành viên trong cộng đồng.
- source_word: μὴ ὑπερφρονεῖν παρ’ ὃ δεῖ φρονεῖν
  choice: đừng nghĩ về mình cao hơn mức phải nghĩ
  rationale: Giữ hình ảnh nhận thức và sự lặp ý của φρονέω, đồng thời chuyển tải giới hạn đúng đắn trong cách tự đánh giá.
- source_word: ἀλλὰ φρονεῖν εἰς τὸ σωφρονεῖν
  choice: nhưng hãy suy xét cách sáng suốt
  rationale: Diễn đạt sắc thái tỉnh táo, hợp lý và tự chủ của σωφρονεῖν bằng tiếng Việt hiện đại, trang trọng.
- source_word: ἐμέρισεν
  choice: đã phân
  rationale: μερίζω có nghĩa chia hoặc phân cho; cách dịch ngắn gọn này phù hợp với hành động Đức Chúa Trời phân định cho từng người.
- source_word: μέτρον πίστεως
  choice: mức độ đức tin
  rationale: Giữ πίστις là “đức tin” và không xác định cụm từ này là đức tin cứu rỗi, năng lực phục vụ hay một chuẩn mực; “mức độ” chuyển tải μέτρον tự nhiên trong ngữ cảnh.
theological_decisions:
- issue: Ý nghĩa của μέτρον πίστεως
  choice: mức độ đức tin
  alternative: thước đo đức tin; mức độ tin cậy hoặc trung tín
  rationale: Ngữ cảnh kế tiếp nói đến các ân tứ khác nhau, nhưng chính cụm từ Hy Lạp không buộc phải hiểu theo một học thuyết cụ thể. Bản dịch giữ nguyên độ mở thần học.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “ân điển” và “đức tin” theo thuật ngữ Kinh Thánh quen thuộc; dùng “anh em” theo lối xưng hô cộng đồng trong thư tín, mang nghĩa bao quát theo ngữ cảnh.
