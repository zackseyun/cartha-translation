  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: τί γὰρ ἡ γραφὴ λέγει; Ἐπίστευσεν δὲ Ἀβραὰμ τῷ θεῷ καὶ ἐλογίσθη αὐτῷ εἰς δικαιοσύνην.
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/003.yaml
  text: For what does the Scripture say? Abraham believed God[b][a], and it was counted to him as righteousness.
translation:
  language: vi
  text: Vì Kinh Thánh nói gì? “Áp-ra-ham tin Đức Chúa Trời, và điều đó được kể[a] cho ông là sự công chính[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “được kể cho ông là sự công chính” hoặc “được ghi nhận cho ông là sự công chính.”'
    reason: lexical_alternative
  - marker: b
    text: “Sự công chính” cũng có thể dịch là “công lý.”
    reason: lexical_alternative
lexical_decisions:
- source_word: γραφή
  choice: Kinh Thánh
  rationale: Trong cách dùng của Phao-lô, danh từ có mạo từ này chỉ trước tác thánh có thẩm quyền, nên “Kinh Thánh” tự nhiên và chính xác hơn “văn bản” hay “điều được viết”.
- source_word: Ἐπίστευσεν
  choice: tin
  rationale: “Tin” diễn đạt trực tiếp động từ πιστεύω và không thêm sắc thái giải thích quá mức như “đặt đức tin nơi”.
- source_word: τῷ θεῷ
  choice: Đức Chúa Trời
  rationale: Tặng cách sau πιστεύω ở đây mang nghĩa Áp-ra-ham tin lời Đức Chúa Trời; tiếng Việt có thể diễn đạt tự nhiên là “tin Đức Chúa Trời” mà không cần thêm giới từ.
- source_word: ἐλογίσθη
  choice: được kể
  rationale: “Được kể” giữ thể bị động và sắc thái quy tính của λογίζομαι; các cách “được kể là” hoặc “được ghi nhận là” được nêu trong chú thích để bảo tồn phạm vi nghĩa.
- source_word: εἰς δικαιοσύνην
  choice: là sự công chính
  rationale: Trong ngữ cảnh lập luận của Phao-lô, “sự công chính” là cách dịch quen thuộc và phù hợp của δικαιοσύνη, đồng thời không tự quyết định toàn bộ sắc thái tuyên bố, đạo đức hay quan hệ của từ.
theological_decisions:
- issue: Cách dịch δικαιοσύνη trong ngữ cảnh Phao-lô bàn về việc được xưng công chính
  choice: sự công chính
  alternative: sự chính trực; lẽ công chính
  rationale: “Sự công chính” bảo tồn thuật ngữ thần học chủ đạo và độ rộng nghĩa của δικαιοσύνη mà không thu hẹp thành phẩm chất đạo đức cá nhân hay chỉ thành công lý xã hội.
- issue: Chủ ngữ ngữ pháp của ἐλογίσθη
  choice: điều đó
  alternative: đức tin ấy
  rationale: Nguyên văn dùng động từ số ít nhưng không nêu rõ chủ ngữ; “điều đó” giữ được sự quy chiếu đến việc Áp-ra-ham tin mà không giải thích dứt khoát rằng chính “đức tin” như một thực thể là điều được kể.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Vì” để giữ γὰρ, cho thấy câu này giải thích lập luận ngay trước đó. Dấu ngoặc kép đánh dấu lời trích Sáng Thế Ký 15:6; “Áp-ra-ham” và “Đức Chúa Trời” theo lối gọi quen thuộc trong tiếng Việt Cơ Đốc.
