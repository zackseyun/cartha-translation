id: ROM.4.20
reference: Romans 4:20
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εἰς δὲ τὴν ἐπαγγελίαν τοῦ θεοῦ οὐ διεκρίθη τῇ ἀπιστίᾳ ἀλλὰ ἐνεδυναμώθη τῇ πίστει, δοὺς δόξαν τῷ θεῷ
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/020.yaml
  text: Yet regarding the promise of God[a], he did not waver in unbelief, but was strengthened in faith[b], giving glory to God.
translation:
  language: vi
  text: Nhưng đối với lời hứa của Đức Chúa Trời, ông không dao động vì vô tín[a]; trái lại, ông được thêm sức trong đức tin[b] và dâng vinh quang cho Đức Chúa Trời.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “ông không nghi ngờ do vô tín.”'
    reason: lexical_alternative
  - marker: b
    text: 'Hoặc: “ông được thêm sức bởi đức tin.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς δὲ τὴν ἐπαγγελίαν τοῦ θεοῦ
  choice: Nhưng đối với lời hứa của Đức Chúa Trời
  rationale: εἰς với đối cách mang nghĩa quy chiếu, “đối với/về,” chứ không chỉ sự chuyển động; δέ tạo nét tương phản nhẹ. Cách dịch này giữ rõ trọng tâm là lời hứa của Đức Chúa Trời.
- source_word: οὐ διεκρίθη
  choice: không dao động
  rationale: Trong ngữ cảnh, διακρίνω chỉ sự phân tâm, do dự hoặc chao đảo nội tâm. “Không dao động” rộng hơn sự nghi ngờ thuần túy về nhận thức và phù hợp với thế đối lập ở vế sau.
- source_word: τῇ ἀπιστίᾳ
  choice: vì vô tín
  rationale: Dữ cách có thể chỉ căn nguyên, phương tiện hoặc trạng thái đi kèm. “Vì vô tín” là cách nói tự nhiên trong tiếng Việt nhưng vẫn để ngỏ quan hệ chính xác giữa sự vô tín và sự dao động.
- source_word: ἐνεδυναμώθη
  choice: được thêm sức
  rationale: Giữ thể bị động của động từ và diễn đạt tự nhiên ý được làm cho mạnh mẽ, không xác định thêm tác nhân khi nguyên văn không nêu rõ tại đây.
- source_word: τῇ πίστει
  choice: trong đức tin
  rationale: Giữ cách hiểu dữ cách như phạm vi hoặc trạng thái, đồng thời duy trì sự tương phản với ἀπιστία; khả năng hiểu theo nghĩa phương tiện được ghi ở chú thích.
- source_word: δοὺς δόξαν τῷ θεῷ
  choice: và dâng vinh quang cho Đức Chúa Trời
  rationale: Phân từ chỉ hành động đi kèm được chuyển thành mệnh đề nối bằng “và” để câu tiếng Việt tự nhiên, mà không áp đặt quan hệ nhân quả hay kết quả.
theological_decisions:
- issue: Phản ứng của Áp-ra-ham là sự nghi ngờ thuần túy về nhận thức hay sự dao động rộng hơn do vô tín
  choice: không dao động vì vô tín
  alternative: không nghi ngờ do vô tín
  rationale: “Dao động” phản ánh đầy đủ hơn sắc thái của διακρίνω trong văn cảnh và giữ thế căng giữa vô tín với việc được thêm sức trong đức tin, không thu hẹp câu vào một hoạt động trí óc.
- issue: Dữ cách τῇ πίστει chỉ phạm vi hay phương tiện
  choice: trong đức tin
  alternative: bởi đức tin
  rationale: Nguyên văn cho phép cả hai sắc thái. Bản chính chọn nghĩa phạm vi để giữ cấu trúc đối lập, còn chú thích bảo tồn cách hiểu theo phương tiện.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Đức Chúa Trời,” “đức tin” và “vô tín” duy trì thuật ngữ thần học quen thuộc; cấu trúc câu vẫn phản ánh rõ sự tương phản của nguyên văn mà không trở nên nặng nề.
