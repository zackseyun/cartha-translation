id: ROM.4.4
reference: Romans 4:4
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: τῷ δὲ ἐργαζομένῳ ὁ μισθὸς οὐ λογίζεται κατὰ χάριν ἀλλὰ κατὰ ὀφείλημα·
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/004.yaml
  text: To the one who works[a], the wages are not credited as a gift[b], but as an obligation.
translation:
  language: vi
  text: Còn với người làm việc, tiền công không được kể là ân huệ[a], nhưng là khoản phải trả[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “theo ân điển” hoặc “như một món quà”.
    reason: lexical_alternative
  - marker: b
    text: Hay “như một món nợ” hoặc “như điều mắc nợ”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐργαζομένῳ
  choice: người làm việc
  rationale: Phân từ hiện tại có mạo từ được dùng như danh từ, chỉ chung người làm việc; cách dịch này tự nhiên và giữ được ý khái quát.
- source_word: μισθὸς
  choice: tiền công
  rationale: Trong bối cảnh lao động và chi trả, từ này chỉ khoản thù lao kiếm được, nên “tiền công” chính xác và tự nhiên.
- source_word: λογίζεται
  choice: được kể
  rationale: Giữ hình ảnh tính toán hoặc ghi nhận của λογίζομαι, đồng thời phù hợp với cả hai vế “ân huệ” và “khoản phải trả”.
- source_word: κατὰ χάριν
  choice: là ân huệ
  rationale: Trong thế đối lập với tiền công phải trả, χάρις nhấn mạnh điều được ban không do công lao; “ân huệ” vẫn giữ liên hệ từ vựng với khái niệm ân điển mà không làm câu quá trừu tượng.
- source_word: ὀφείλημα
  choice: khoản phải trả
  rationale: Diễn đạt rõ điều mắc nợ hoặc có nghĩa vụ phải trả trong quan hệ lao động, tự nhiên hơn “món nợ” ở cấu trúc này.
- source_word: δὲ
  choice: Còn
  rationale: Thể hiện sự chuyển ý và đối chiếu với lập luận ngay trước đó mà không thêm sắc thái thời gian.
theological_decisions:
- issue: Cách dịch χάρις trong sự đối lập giữa lao động và tiền công
  choice: là ân huệ
  alternative: theo ân điển; như một món quà
  rationale: “Ân huệ” truyền đạt tính không do công lao mà có, đồng thời bảo toàn sắc thái của χάρις và sự căng thẳng giữa ân huệ với nghĩa vụ phải trả.
- issue: Cách biểu đạt ὀφείλημα
  choice: khoản phải trả
  alternative: món nợ; điều mắc nợ
  rationale: Cách dịch này giữ ý nghĩa điều người trả công đang mắc và có nghĩa vụ thanh toán, không mở rộng câu thành một tuyên bố giáo lý riêng.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. “Còn” nối câu với lập luận trước; “tiền công” và “khoản phải trả” duy trì hình ảnh lao động–kế toán. Tất cả dấu chú thích đều xuất hiện trong chính văn.
