id: ROM.4.11
reference: Romans 4:11
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ σημεῖον ἔλαβεν περιτομῆς, σφραγῖδα τῆς δικαιοσύνης τῆς πίστεως τῆς ἐν τῇ ἀκροβυστίᾳ, εἰς τὸ εἶναι αὐτὸν πατέρα πάντων τῶν πιστευόντων δι’ ἀκροβυστίας, εἰς τὸ ⸀λογισθῆναι αὐτοῖς τὴν δικαιοσύνην,
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/011.yaml
  text: And he received the sign of circumcision as a seal of the righteousness of the faith that he had while uncircumcised[a], so that he might be the father of all who believe while uncircumcised, so that righteousness might be counted to them also[c][b],
translation:
  language: vi
  text: Ông đã nhận phép cắt bì làm dấu hiệu, làm dấu ấn xác nhận sự công chính bởi đức tin mà ông đã có khi chưa chịu cắt bì[a], để ông làm cha của tất cả những người tin trong tình trạng chưa chịu cắt bì, hầu sự công chính cũng được kể cho họ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “trong tình trạng không cắt bì”; nghĩa là khi ông chưa chịu cắt bì.'
    reason: lexical_alternative
  - marker: b
    text: “Được kể cho” cũng có thể dịch là “được ghi nhận cho” hoặc “được quy cho”.
    reason: lexical_alternative
lexical_decisions:
- source_word: σημεῖον
  choice: dấu hiệu
  rationale: Cách dịch tự nhiên, minh bạch, giữ ý nghĩa phép cắt bì là dấu chỉ bên ngoài.
- source_word: περιτομή
  choice: phép cắt bì / chịu cắt bì
  rationale: Thuật ngữ chuẩn trong tiếng Việt; danh từ được dùng cho nghi thức, còn dạng động từ giúp diễn đạt tự nhiên tình trạng của Áp-ra-ham và những người tin.
- source_word: σφραγίς
  choice: ấn xác nhận
  rationale: Giữ hình ảnh của σφραγίς như một dấu ấn chứng thực, đồng thời tránh sự tối nghĩa của từ đơn lẻ “ấn” trong tiếng Việt hiện đại.
- source_word: δικαιοσύνη
  choice: sự công chính
  rationale: Thuật ngữ tiếng Việt quen thuộc cho δικαιοσύνη trong lập luận của Phao-lô, bao gồm địa vị đúng đắn trước Đức Chúa Trời mà không thu hẹp thành công lý xã hội.
- source_word: πίστις
  choice: đức tin
  rationale: Phù hợp với ngữ cảnh, nơi cụm sở hữu liên kết sự công chính với đức tin.
- source_word: ἐν τῇ ἀκροβυστίᾳ
  choice: khi chưa chịu cắt bì
  rationale: Diễn đạt rõ tình trạng và thời điểm Áp-ra-ham có đức tin, tự nhiên hơn lối dịch sát “trong sự không cắt bì”.
- source_word: πατέρα πάντων τῶν πιστευόντων
  choice: cha của tất cả những người tin
  rationale: Giữ nguyên ngôn ngữ đại diện và quan hệ thuộc linh trong lập luận của Phao-lô.
- source_word: δι’ ἀκροβυστίας
  choice: dù chưa chịu cắt bì
  rationale: Diễn tả hoàn cảnh của những người tin mà không khiến διά bị hiểu sai theo nghĩa phép cắt bì là phương tiện.
- source_word: λογίζομαι
  choice: được kể cho
  rationale: Giữ ẩn dụ tính toán và cách dùng xuyên suốt Rô-ma 4; chú thích nêu những cách hiểu tương đương tự nhiên hơn.
- source_word: καί
  choice: cũng
  rationale: Biểu thị rõ rằng sự công chính cũng được kể cho những người tin chưa chịu cắt bì.
theological_decisions:
- issue: Quan hệ giữa phép cắt bì và sự công chính
  choice: Phép cắt bì là dấu hiệu và ấn xác nhận sự công chính bởi đức tin mà Áp-ra-ham đã có khi chưa chịu cắt bì.
  alternative: Có thể diễn đạt theo cách khiến người đọc tưởng phép cắt bì là phương tiện đem lại sự công chính.
  rationale: Trình tự Hy Lạp trình bày phép cắt bì như sự chứng thực đến sau, không phải nguyên nhân tạo nên sự công chính; bản dịch bảo toàn trình tự đó mà không áp đặt một hệ thống thần học hậu kỳ.
- issue: Sắc thái mục đích của hai cụm εἰς τὸ
  choice: 'Dùng “Vì thế ... để ...” nhằm thể hiện kết quả có chủ đích: Áp-ra-ham là cha của những người tin chưa cắt bì, và sự công chính được kể cho họ.'
  alternative: Dịch lặp sát “để ông là ... để ...”, giữ nguyên cấu trúc Hy Lạp nhưng kém tự nhiên trong tiếng Việt.
  rationale: Cách diễn đạt tiếng Việt vẫn bảo toàn mối liên hệ mục đích/kết quả của hai cụm mà tránh câu nặng và khó hiểu.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Cấu trúc câu được điều chỉnh vừa phải cho tiếng Việt, trong khi vẫn giữ các hình ảnh “dấu hiệu”, “ấn xác nhận” và “được kể cho” vốn quan trọng trong lập luận của Phao-lô.
