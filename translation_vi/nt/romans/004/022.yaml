revisions:
- from: Vì vậy, điều ấy được kể cho ông là sự công chính.[a][b]
  to: Vì vậy, điều ấy được kể là sự công chính cho ông.[a][b]
  rationale: Bản sửa chỉ điều chỉnh trật tự từ để làm rõ thành ngữ “được kể là … cho ông”, và chuẩn hóa hai chú thích từ vựng theo cách dùng tiếng Việt hiện đại. Bản dịch vẫn giữ chủ ngữ trung tính “điều ấy”, thể bị động, phép ẩn chủ thể thực hiện hành động tính kể, và không giải thích thêm cơ chế thần học.
