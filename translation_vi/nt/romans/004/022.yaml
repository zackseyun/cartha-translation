lexical_decisions:
- source_word: διό
  choice: Vì vậy
  rationale: Diễn tả kết luận rút ra từ lập luận ngay trước đó, đồng thời tự nhiên trong tiếng Việt hiện đại.
- source_word: ἐλογίσθη
  choice: được kể
  rationale: Giữ thể bị động của tiếng Hy Lạp và hình ảnh tính kể/hạch toán xuyên suốt Rô-ma 4; các cách dịch gần nghĩa được ghi ở chú thích.
- source_word: αὐτῷ
  choice: cho ông
  rationale: Diễn đạt tự nhiên sở dữ cách và giữ quy chiếu đến Áp-ra-ham trong ngữ cảnh.
- source_word: εἰς
  choice: là
  rationale: Trong cấu trúc λογίζομαι ... εἰς, “là” diễn tả tự nhiên địa vị hay giá trị được tính kể mà không thêm ý ngoài bản văn.
- source_word: δικαιοσύνην
  choice: sự công chính
  rationale: Đây là cách dịch quen thuộc và phù hợp với nghĩa thần học-pháp lý của δικαιοσύνη trong lập luận của Phao-lô; nghĩa gần “sự công bình” được bảo lưu trong chú thích.
theological_decisions:
- issue: Chuyển tải ngôn ngữ tính kể của Phao-lô mà không đưa thêm một hệ thống giáo lý vào câu
  choice: điều ấy được kể cho ông là sự công chính
  alternative: điều ấy được kể vào sự công chính cho ông; điều ấy được ghi nhận cho ông là sự công chính
  rationale: Cách dịch giữ hình ảnh tính kể và thể bị động của nguyên văn, nhưng không xác định thêm chủ thể ngầm hoặc cơ chế thần học mà câu Hy Lạp không nói rõ.
translation_notes:
  register: Văn phong trang trọng, rõ ràng và hiện đại. Đại từ “ông” dựa vào quy chiếu ngữ cảnh đến Áp-ra-ham. Cụm “điều ấy” giữ chủ ngữ ngầm của động từ bị động mà không tự ý xác định lại là “đức tin” ngay trong câu này.
