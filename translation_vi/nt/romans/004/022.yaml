  text: Therefore it was counted to him as righteousness[a][b].
translation:
  language: vi
  text: Vì vậy, điều ấy được kể là sự công chính cho ông.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “được ghi nhận” hoặc “được tính.”'
