id: ROM.4.19
reference: Romans 4:19
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ μὴ ἀσθενήσας τῇ ⸀πίστει κατενόησεν τὸ ἑαυτοῦ ⸀σῶμα νενεκρωμένον, ἑκατονταετής που ὑπάρχων, καὶ τὴν νέκρωσιν τῆς μήτρας Σάρρας,
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/019.yaml
  text: And without weakening in faith[b][a], he considered his own body as good as dead—since he was about a hundred years old—and the deadness of Sarah’s womb.
translation:
  language: vi
  text: Ông không suy yếu trong đức tin, đã xét đến thân thể mình kể như đã chết—vì ông khoảng một trăm tuổi—và sự chết của dạ con Sa-ra.[b][a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Một truyền thống văn bản khác chép: “ông không xét đến thân thể mình, vốn kể như đã chết.”'
    reason: textual_variant
  - marker: b
    text: Hoặc có thể dịch “sự vô sinh” thay cho “sự chết.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσθενήσας
  choice: yếu đi
  rationale: Diễn đạt phân từ aorist theo nghĩa suy giảm sức mạnh; kết hợp với μὴ thành “không yếu đi”, tự nhiên và sát mạch lập luận.
- source_word: πίστει
  choice: trong đức tin
  rationale: Giữ thuật ngữ thần học quen thuộc “đức tin”; trong ngữ cảnh, đó là lòng tin cậy của Áp-ra-ham nơi lời hứa của Đức Chúa Trời.
- source_word: κατενόησεν
  choice: đã xem xét
  rationale: Diễn tả việc chú ý và cân nhắc thực trạng một cách có ý thức, không hàm ý ông phớt lờ sự thật.
- source_word: νενεκρωμένον
  choice: kể như đã chết
  rationale: Phân từ hoàn thành chỉ tình trạng hầu như mất khả năng sinh sản, không phải thân thể đã chết theo nghĩa đen; cách dịch vẫn giữ hình ảnh về sự chết.
- source_word: ἑκατονταετής που ὑπάρχων
  choice: vì ông đã gần một trăm tuổi
  rationale: πού làm con số mang tính xấp xỉ; “gần một trăm tuổi” là cách nói tự nhiên trong tiếng Việt và nêu lý do thân thể được kể như đã chết.
- source_word: νέκρωσιν
  choice: tình trạng chết
  rationale: Giữ sự tương ứng về hình ảnh sự chết với νενεκρωμένον, thay vì diễn giải thành “vô sinh” hay “son sẻ”.
- source_word: μήτρας Σάρρας
  choice: tử cung Sa-ra
  rationale: Giữ hình ảnh cơ thể cụ thể của nguyên văn, với trật tự sở hữu tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Có nên làm nhẹ hình ảnh sự chết liên quan đến khả năng sinh sản hay không
  choice: 'Giữ ngôn ngữ về sự chết trong cả hai vế: “kể như đã chết” và “tình trạng chết của tử cung Sa-ra”'
  alternative: Dịch diễn giải là “không còn khả năng sinh con”, “son sẻ” hoặc “vô sinh”
  rationale: Phao-lô cố ý dùng hai từ cùng trường nghĩa sự chết cho thân thể Áp-ra-ham và tử cung Sa-ra, nhấn mạnh tình thế bất khả thi mà lời hứa của Đức Chúa Trời vượt qua.
- issue: Dị bản về việc Áp-ra-ham có xem xét thân thể mình hay không
  choice: 'Theo bản văn SBLGNT được cung cấp: ông “đã xem xét” thân thể mình'
  alternative: 'Theo một truyền thống văn bản khác: ông “không xem xét” thân thể mình'
  rationale: Vị trí và sự hiện diện của phủ định trong truyền thống thủ bản tạo ra hai cách đọc thực sự; giữ bản văn chính theo SBLGNT và ghi cách đọc khác trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “đức tin” theo cách dùng Kinh Thánh quen thuộc; giữ hình ảnh mạnh “chết” của nguyên văn. Tên riêng được viết là “Sa-ra” theo lối phiên âm phổ biến. Dấu chú thích [a] đặt ở cuối câu vì liên quan đến cấu trúc toàn mệnh đề.
