revisions:
- from: Ông không yếu đi trong đức tin, nhưng đã xem xét thân thể mình kể như đã chết—vì ông đã gần một trăm tuổi—và tình trạng chết của tử cung Sa-ra.[a]
  to: Ông không suy yếu trong đức tin, đã xét đến thân thể mình kể như đã chết—vì ông khoảng một trăm tuổi—và sự chết của dạ con Sa-ra.[b][a]
  rationale: 'Bản sửa loại bỏ liên từ tương phản không có trong tiếng Hy Lạp, diễn đạt που là “khoảng,” và thay cụm từ gượng bằng “sự chết của dạ con Sa-ra.” Bản văn chính tiếp tục bảo toàn phép song hành về sự chết giữa thân thể Áp-ra-ham và dạ con Sa-ra. Hai chú thích được neo ngay sau cụm liên quan: [b] cho νέκρωσις và [a] cho dị bản tác động đến mệnh đề về việc xét đến thân thể.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T10:24:46Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch theo đúng cách đọc SBLGNT: Áp-ra-ham không suy yếu trong đức tin và vẫn xét đến thực trạng thân thể mình cùng sự chết của dạ con Sa-ra. Tuy nhiên, “nhưng” không có đối ứng trong nguyên văn và tạo thế tương phản không cần thiết. “Gần một trăm tuổi” có thể gợi nghĩa sắp đến 100 hơn là xấp xỉ; πού nên là “khoảng một trăm tuổi.”'
  naturalness: “Tình trạng chết của tử cung Sa-ra” khá gượng trong tiếng Việt hiện đại. “Sự chết của dạ con Sa-ra” giữ được hình ảnh chết có chủ ý của νέκρωσις, đồng thời tự nhiên hơn trong văn phong Kinh Thánh. “Không suy yếu trong đức tin” cũng trôi chảy và phù hợp hơn “không yếu đi trong đức tin.”
  terminology: Giữ “đức tin,” “kể như đã chết,” và tên “Sa-ra.” Dùng “dạ con” cho μήτρα bảo tồn hình ảnh cụ thể của nguyên văn, không diễn giải thành “vô sinh” hay “son sẻ.” Bổ sung chú thích về khả năng dịch “sự chết” là “sự vô sinh,” tương ứng với dấu vết kiểm tra tiếng Anh, nhưng không đưa cách diễn giải này vào bản văn chính.
  issues:
  - severity: medium
    issue: Thêm từ “nhưng” vào mệnh đề chính.
    rationale: καὶ nối tiếp mạch câu, không biểu thị tương phản. “Nhưng” có thể làm người đọc hiểu rằng việc xét đến thân thể đối lập với việc không suy yếu, trong khi nguyên văn chỉ đặt hai ý song hành.
  - severity: low
    issue: “Gần một trăm tuổi” không thể hiện rõ sắc thái xấp xỉ của που.
    rationale: Trong tiếng Việt, “gần một trăm” thường nghiêng về nghĩa chưa tới một trăm; “khoảng một trăm tuổi” biểu thị đúng hơn con số ước chừng.
  - severity: medium
    issue: “Tình trạng chết của tử cung Sa-ra” gượng và thiếu chú thích từ vựng tương ứng.
    rationale: Cụm từ này không tự nhiên; cần giữ trường nghĩa “chết” của νέκρωσις nhưng diễn đạt dễ đọc hơn. Chú thích lựa chọn “vô sinh” cho thấy đây là khả năng từ vựng mà không làm nhẹ bản văn chính.
  revised_text: Ông không suy yếu trong đức tin, đã xét đến thân thể mình kể như đã chết—vì ông khoảng một trăm tuổi—và sự chết của dạ con Sa-ra.[b][a]
