id: ROM.4.10
reference: Romans 4:10
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: πῶς οὖν ἐλογίσθη; ἐν περιτομῇ ὄντι ἢ ἐν ἀκροβυστίᾳ; οὐκ ἐν περιτομῇ ἀλλ’ ἐν ἀκροβυστίᾳ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/010.yaml
  text: How then was it counted? While he was circumcised[a], or uncircumcised? Not while circumcised, but while uncircumcised.
translation:
  language: vi
  text: Vậy, điều ấy được kể[a] cho ông như thế nào? Khi ông đã chịu cắt bì, hay khi chưa chịu cắt bì? Không phải khi đã chịu cắt bì, mà là khi chưa chịu cắt bì.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Được kể” cũng có thể dịch là “được kể là”, “được tính cho” hoặc “được ghi có”.
    reason: lexical_alternative
lexical_decisions:
- source_word: πῶς οὖν
  choice: Vậy, ... như thế nào?
  rationale: Diễn đạt tự nhiên sức suy luận của οὖν và câu hỏi về hoàn cảnh trong đó việc kể được thực hiện.
- source_word: ἐλογίσθη
  choice: được kể
  rationale: Giữ hình ảnh hạch toán của λογίζομαι và phù hợp với mạch Rô-ma 4; chú thích nêu các cách dịch tương đương để bảo toàn sắc thái.
- source_word: ἐν περιτομῇ ὄντι
  choice: khi ông đã chịu cắt bì
  rationale: Chuyển kết cấu danh từ kèm phân từ sang cách nói tiếng Việt tự nhiên, chỉ tình trạng của Áp-ra-ham vào thời điểm ấy.
- source_word: ἐν ἀκροβυστίᾳ
  choice: khi chưa chịu cắt bì
  rationale: Diễn đạt tình trạng chưa cắt bì một cách rõ ràng, tự nhiên và duy trì thế đối lập với περιτομή.
- source_word: οὐκ ... ἀλλ’
  choice: Không phải ... mà là ...
  rationale: Bảo toàn cấu trúc phủ định–đối lập và sự nhấn mạnh trong câu trả lời của Phao-lô.
theological_decisions:
- issue: Đối tượng ngầm của ἐλογίσθη
  choice: “điều ấy” và “cho ông”
  alternative: Lặp lại “đức tin được kể là công chính” từ ngữ cảnh trước
  rationale: Động từ Hy Lạp lược chủ thể và người tiếp nhận vì đã rõ trong ngữ cảnh. Bản dịch dùng đại từ quy chiếu ngắn gọn, không bổ sung một diễn giải thần học dài vào câu.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. “Chịu cắt bì” là cách nói quen thuộc và tự nhiên; nhịp câu hỏi–đáp được giữ để phản ánh lập luận tu từ của nguyên văn.
