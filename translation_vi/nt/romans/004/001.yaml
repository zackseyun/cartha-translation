  text: Τί οὖν ἐροῦμεν ⸀εὑρηκέναι Ἀβραὰμ τὸν ⸀προπάτορα ⸀ἡμῶν κατὰ σάρκα;
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/001.yaml
  text: What then shall we say that Abraham[a], our forefather according to the flesh[c][b], has found?
translation:
  language: vi
  text: Vậy, chúng ta sẽ nói rằng Áp-ra-ham, tổ phụ của chúng ta về huyết thống[a], đã tìm được gì?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc, theo cách nói sát chữ: “tổ phụ của chúng ta theo xác thịt.”'
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể hiểu “theo xác thịt” bổ nghĩa cho “đã tìm được,” tức là điều Áp-ra-ham đã tìm được theo phương diện con người hoặc bằng khả năng của con người.
    reason: alternative_reading
lexical_decisions:
- source_word: Τί οὖν ἐροῦμεν
  choice: Vậy, chúng ta sẽ nói… điều gì?
  rationale: Giữ chức năng chuyển ý mang tính tu từ của οὖν và sắc thái cân nhắc hướng tới câu trả lời của động từ tương lai ἐροῦμεν, đồng thời diễn đạt tự nhiên trong tiếng Việt.
- source_word: εὑρηκέναι
  choice: đã tìm được
  rationale: Phản ánh động từ nguyên mẫu hoàn thành, nhấn mạnh kết quả mà Áp-ra-ham đã đạt tới; ít diễn giải hơn “đã khám phá ra”.
- source_word: Ἀβραὰμ
  choice: Áp-ra-ham
  rationale: Dùng dạng tên riêng đã quen thuộc trong tiếng Việt.
- source_word: προπάτορα
  choice: tổ phụ
  rationale: Chuyển tải danh từ giống đực số ít chỉ vị tiền nhân, đồng thời phù hợp với địa vị của Áp-ra-ham trong lập luận; “tổ tiên” là cách nói bao quát hơn nhưng làm mờ sắc thái này.
- source_word: ἡμῶν
  choice: của chúng ta
  rationale: Giữ đại từ sở hữu được nêu rõ trong nguyên văn và sự đồng nhất chung của người nói với Áp-ra-ham.
- source_word: κατὰ σάρκα
  choice: theo phần xác
  rationale: Giữ cách nói đặc trưng của Phao-lô và nghĩa về quan hệ huyết thống/thể lý trong ngữ cảnh, không diễn thành “bản tính tội lỗi”.
theological_decisions:
- issue: Phạm vi bổ nghĩa của κατὰ σάρκα
  choice: 'Hiểu cụm từ này bổ nghĩa cho quan hệ tổ phụ: “tổ phụ của chúng ta theo phần xác”.'
  alternative: Có thể hiểu cụm từ bổ nghĩa cho “đã tìm được”, nghĩa là Áp-ra-ham đã tìm được điều gì theo phương diện con người hoặc bằng khả năng của con người.
  rationale: Cách kết nối với cụm đồng vị nói về Áp-ra-ham và quan hệ tổ tiên phù hợp tự nhiên với cú pháp và mạch bàn luận về huyết thống. Tuy nhiên, trật tự từ Hy Lạp cho phép cách hiểu khác, nên sự nhập nhằng thật sự được ghi nhận trong chú thích.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Câu hỏi được sắp xếp theo cú pháp tiếng Việt với “điều gì” ở cuối; dấu phẩy làm rõ “tổ phụ của chúng ta theo phần xác” là cụm đồng vị nhưng không xóa bỏ cách phân tích cú pháp khác, vốn được nêu trong chú thích.
