  to: Ngài đã bị trao nộp vì những vi phạm của chúng ta, và đã được làm cho sống lại để chúng ta được xưng công chính.[a][b]
  rationale: Chỉ sửa “những sự vi phạm” thành “những vi phạm” để tiếng Việt gọn và tự nhiên hơn. Bản dịch vẫn giữ bị động của nguyên văn, quan hệ nhân quả ở vế đầu, và cách hiểu “để ... được xưng công chính” ở vế sau; phương án nhân quả vẫn được neo bằng chú thích [a].
