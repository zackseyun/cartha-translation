  terminology: “Trao nộp,” “làm cho sống lại,” và “được xưng công chính” là các lựa chọn nhất quán với thuật ngữ Kinh Thánh và giữ được sắc thái pháp lý của δικαίωσις. Chú thích từ vựng nên nêu các cách diễn đạt thay thế như những cách nói cho cùng khái niệm, không làm chúng có vẻ là các bản dịch hoàn toàn đồng nhất.
