source:
  edition: SBLGNT
  text: ὃς παρεδόθη διὰ τὰ παραπτώματα ἡμῶν καὶ ἠγέρθη διὰ τὴν δικαίωσιν ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/025.yaml
  text: who was handed over because of our trespasses and was raised for our justification[a][b].
translation:
  language: vi
  text: Ngài đã bị trao nộp vì những vi phạm của chúng ta, và đã được làm cho sống lại để chúng ta được xưng công chính.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “vì chúng ta được xưng công chính.”'
    reason: alternative_reading
  - marker: b
    text: “Được xưng công chính” cũng có thể diễn đạt là “được tuyên là công chính” hoặc “được tuyên trắng án.”
    reason: lexical_alternative
lexical_decisions:
- source_word: παρεδόθη
  choice: đã bị trao nộp
  rationale: Giữ dạng bị động của tiếng Hy Lạp và hàm ý rằng Đức Chúa Trời là tác nhân, đồng thời dùng cách diễn đạt tự nhiên, trang trọng trong tiếng Việt hiện đại.
- source_word: διὰ τὰ παραπτώματα ἡμῶν
  choice: vì những sự vi phạm của chúng ta
  rationale: διά với đối cách trong vế đầu tự nhiên nhất mang nghĩa nguyên nhân; “vì” diễn đạt rõ quan hệ ấy.
- source_word: παραπτώματα
  choice: những sự vi phạm
  rationale: Diễn đạt hành vi sai phạm về đạo đức, cụ thể hơn từ rộng hơn là “tội lỗi”, mà vẫn dễ hiểu.
- source_word: ἠγέρθη
  choice: đã được làm cho sống lại
  rationale: Thể hiện rõ dạng bị động và ý nghĩa phục sinh của động từ trong ngữ cảnh, tự nhiên hơn cách dịch máy móc “được dựng dậy”.
- source_word: διὰ τὴν δικαίωσιν ἡμῶν
  choice: để chúng ta được xưng công chính
  rationale: Chuyển danh từ trừu tượng thành mệnh đề tự nhiên trong tiếng Việt và thể hiện cách hiểu hướng đến mục đích hoặc kết quả; cách hiểu nguyên nhân vẫn được giữ trong chú thích.
- source_word: δικαίωσιν
  choice: được xưng công chính
  rationale: 'Giữ sắc thái pháp lý-cứu rỗi của δικαίωσις trong Phao-lô: được tuyên nhận là công chính, thay vì hàm ý được biến đổi về đạo đức.'
theological_decisions:
- issue: διὰ τὴν δικαίωσιν ἡμῶν chỉ mục đích/kết quả hay nguyên nhân
  choice: để chúng ta được xưng công chính
  alternative: vì chúng ta được xưng công chính
  rationale: Cách dịch chính phản ánh cách hiểu phổ biến rằng sự phục sinh của Đấng Christ gắn với việc đem lại hoặc hoàn tất sự xưng công chính cho người tin. Tuy nhiên, cấu trúc διά với đối cách cũng có thể được hiểu theo nghĩa nguyên nhân, nên phương án ấy được bảo lưu trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “Ngài” nối tự nhiên với chủ thể ở câu trước. Hai dạng bị động được giữ; riêng ἠγέρθη được diễn đạt thành “được làm cho sống lại” để nêu rõ nghĩa phục sinh. Các dấu chú thích đều xuất hiện trong chính văn.
