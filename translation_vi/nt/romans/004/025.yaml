  source_fidelity: 'Bản dịch giữ đúng hai động từ bị động của nguyên văn: παρεδόθη là “bị trao nộp” và ἠγέρθη là “được làm cho sống lại”. Quan hệ nguyên nhân của διὰ τὰ παραπτώματα ἡμῶν được diễn đạt chính xác bằng “vì”. Vế sau chọn cách hiểu hướng đích/kết quả của διὰ τὴν δικαίωσιν ἡμῶν, đồng thời chú thích bảo lưu cách hiểu nguyên nhân có thể có.'
