id: ROM.4.17
reference: Romans 4:17
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καθὼς γέγραπται ὅτι Πατέρα πολλῶν ἐθνῶν τέθεικά σε), κατέναντι οὗ ἐπίστευσεν θεοῦ τοῦ ζῳοποιοῦντος τοὺς νεκροὺς καὶ καλοῦντος τὰ μὴ ὄντα ὡς ὄντα·
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/017.yaml
  text: as it is written[a], "I have made you the father of many nations"—in the presence of the God in whom he believed[b], who gives life to the dead and calls the things that are not as though they were.
translation:
  language: vi
  text: 'như có lời chép: “Ta đã lập con làm cha của nhiều dân tộc”[a]—trước mặt Đức Chúa Trời, Đấng mà ông đã tin, Đấng làm cho người chết sống lại và gọi những gì không hiện hữu như thể chúng hiện hữu.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Dân tộc” ở đây cũng có thể được hiểu là “dân ngoại”; tuy nhiên, trong lời trích từ Sáng Thế Ký này, nghĩa rộng hơn có lẽ phù hợp hơn.
    reason: lexical_alternative
  - marker: b
    text: 'Hoặc, theo cách dịch mang tính diễn giải hơn: “gọi những gì chưa hiện hữu vào hiện hữu.”'
    reason: alternative_reading
lexical_decisions:
- source_word: καθὼς γέγραπται
  choice: như có lời chép
  rationale: Công thức trích dẫn Kinh Thánh quen thuộc; cách diễn đạt này tự nhiên trong tiếng Việt và giữ được ý lời đã được chép vẫn có hiệu lực.
- source_word: Πατέρα πολλῶν ἐθνῶν
  choice: làm cha của nhiều dân tộc
  rationale: Trong lời trích Sáng Thế Ký, ἐθνῶν chỉ nhiều dân tộc hay cộng đồng dân tộc nói chung, không nhất thiết chỉ dân ngoại đối lập với người Do Thái.
- source_word: τέθεικά σε
  choice: Ta đã lập con
  rationale: “Đã lập” truyền đạt hành động thiết lập hoặc đặt vào địa vị cùng hiệu lực còn tiếp diễn của thể hoàn thành, đồng thời phù hợp với lời hứa được trích dẫn.
- source_word: κατέναντι
  choice: trước mặt
  rationale: Giữ nghĩa quan hệ của từ Hy Lạp là “ở trước mặt, trước sự hiện diện của,” mà vẫn tự nhiên trong tiếng Việt.
- source_word: οὗ ἐπίστευσεν
  choice: Đấng ông đã tin
  rationale: Diễn đạt đối tượng đức tin của Áp-ra-ham mà không thêm ý giải thích vượt quá bản văn.
- source_word: ζῳοποιοῦντος τοὺς νεκρούς
  choice: Đấng làm cho người chết sống lại
  rationale: Cách nói rõ ràng, tự nhiên, giữ ý Đức Chúa Trời ban sự sống cho những người chết.
- source_word: καλοῦντος
  choice: gọi
  rationale: Giữ nghĩa cơ bản của động từ và không tự động diễn giải thành “gọi vào hiện hữu”; cách hiểu ấy được nêu trong chú thích.
- source_word: τὰ μὴ ὄντα ὡς ὄντα
  choice: những gì không hiện hữu như thể chúng hiện hữu
  rationale: Bám sát cấu trúc cô đọng của tiếng Hy Lạp và bảo toàn độ mở giữa lời tuyên gọi của Đức Chúa Trời với cách hiểu cụ thể hơn là khiến sự vật bắt đầu hiện hữu.
theological_decisions:
- issue: Mệnh đề cuối có nên được dịch thẳng thành lời khẳng định Đức Chúa Trời gọi những điều chưa tồn tại vào hiện hữu hay không.
  choice: gọi những gì không hiện hữu như thể chúng hiện hữu
  alternative: gọi những gì chưa hiện hữu vào hiện hữu
  rationale: Nguyên văn có thể hàm ý quyền năng sáng tạo của Đức Chúa Trời, nhưng cách nói Hy Lạp cô đọng hơn và không minh nhiên dùng động từ “tạo dựng” hay cụm “vào hiện hữu.” Bản chính giữ sự căng thẳng này; chú thích cung cấp cách hiểu diễn giải.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “Đức Chúa Trời” theo lối gọi phổ thông trong ngữ cảnh Kinh Thánh; đại từ “ông” chỉ Áp-ra-ham. Các chú thích được đặt đúng tại cụm từ mà chúng giải thích.
