  to: 'như có lời chép: “Ta đã lập con làm cha của nhiều dân tộc”[a]—trước mặt Đức Chúa Trời, Đấng mà ông đã tin, Đấng làm cho người chết sống lại và gọi những gì không hiện hữu như thể chúng hiện hữu.[b]'
  rationale: Chỉ sửa một điểm cú pháp để tiếng Việt tự nhiên hơn và làm rõ quan hệ của «Đấng» với «ông đã tin». Giữ nguyên các lựa chọn từ vựng còn lại, thứ tự ý chính, sự dè dặt diễn giải của mệnh đề cuối, và các neo chú thích tương ứng với cụm được giải thích.
