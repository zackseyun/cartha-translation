id: ROM.4.14
reference: Romans 4:14
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εἰ γὰρ οἱ ἐκ νόμου κληρονόμοι, κεκένωται ἡ πίστις καὶ κατήργηται ἡ ἐπαγγελία·
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/014.yaml
  text: For if those who are of the law are heirs[c][b][a], faith has been emptied and the promise has been nullified.
translation:
  language: vi
  text: Vì nếu những người thuộc về luật pháp là người thừa kế, thì đức tin đã bị làm cho trống rỗng[a], và lời hứa đã bị vô hiệu hóa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đức tin đã trở nên trống rỗng” hoặc “đức tin đã trở thành vô ích.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “lời hứa đã mất hiệu lực” hoặc “không còn tác dụng.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ ἐκ νόμου
  choice: những người thuộc về luật pháp
  rationale: Giữ cách diễn đạt cô đọng của Phao-lô về những người được xác định bởi mối liên hệ với luật pháp, không diễn giải hẹp thành chỉ những người tuân giữ luật pháp.
- source_word: κληρονόμοι
  choice: người thừa kế
  rationale: Cách nói tự nhiên và quen thuộc trong ngữ cảnh lời hứa và quyền thừa hưởng.
- source_word: κεκένωται
  choice: đã trở nên trống rỗng
  rationale: Giữ hình ảnh 'làm trống' của động từ và thể hoàn thành, diễn tả đức tin bị tước mất nội dung hay tác dụng.
- source_word: πίστις
  choice: đức tin
  rationale: Phù hợp với thế đối lập giữa đức tin và luật pháp trong lập luận của Rô-ma 4, đồng thời là cách dịch thần học tự nhiên trong tiếng Việt.
- source_word: κατήργηται
  choice: đã mất hiệu lực
  rationale: Diễn đạt việc lời hứa bị làm cho không còn tác dụng mà không hàm ý lời hứa bị tiêu diệt.
- source_word: ἐπαγγελία
  choice: lời hứa
  rationale: Trực tiếp, tự nhiên và chỉ lời hứa cụ thể đang được bàn đến trong ngữ cảnh.
theological_decisions:
- issue: Cách dịch πίστις trong thế đối lập với νόμος của Phao-lô
  choice: đức tin
  alternative: sự tin cậy; sự thành tín
  rationale: Mạch lập luận nói về quyền thừa kế không dựa trên luật pháp nhưng qua đức tin; 'đức tin' giữ đúng sự căng thẳng thần học mà không xác định thêm chủ thể của sự thành tín.
- issue: Ý nghĩa của οἱ ἐκ νόμου
  choice: những người thuộc về luật pháp
  alternative: những người sống theo luật pháp; những người dựa vào luật pháp
  rationale: Bản dịch chính giữ tính khái quát và sự cô đọng của nguyên ngữ, tránh quyết định thay Phao-lô rằng cụm từ chỉ riêng việc tuân giữ hay dựa cậy vào luật pháp.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Cấu trúc điều kiện cùng hai động từ thể hoàn thành được thể hiện bằng “nếu... thì” và “đã”, còn phép ẩn dụ của κεκένωται được giữ trong bản văn chính.
