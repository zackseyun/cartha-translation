  terminology: “Luật pháp”, “đức tin”, “người thừa kế” và “lời hứa” phù hợp với ngữ cảnh Phao-lô và không áp đặt cách hiểu giáo phái. “Những người thuộc về luật pháp” giữ được tính khái quát của οἱ ἐκ νόμου.
  issues:
  - severity: low
    issue: Sắc thái bị động của κεκένωται và κατήργηται chưa được biểu đạt rõ trong bản văn chính.
