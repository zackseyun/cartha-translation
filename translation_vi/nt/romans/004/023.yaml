  text: Οὐκ ἐγράφη δὲ δι’ αὐτὸν μόνον ὅτι ἐλογίσθη αὐτῷ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/023.yaml
  text: It was not written for his sake alone that it was credited to him,[a]
translation:
  language: vi
  text: Nhưng câu “được kể cho ông” không phải chỉ vì riêng ông mà được chép lại,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “được tính cho ông” hoặc “được quy cho ông.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγράφη
  choice: được chép
  rationale: Dạng bị động trực tiếp, tự nhiên trong văn phong Kinh Thánh và giữ liên hệ với lời đã được ghi thành văn.
- source_word: δὲ
  choice: Nhưng
  rationale: 'Giữ sắc thái chuyển tiếp có đối chiếu: lời ấy không chỉ liên quan đến Áp-ra-ham mà còn đến những người được nói tới tiếp theo.'
- source_word: δι’ αὐτὸν μόνον
  choice: vì riêng ông
  rationale: Diễn đạt tự nhiên διά với đối cách và giữ nguyên điểm nhấn μόνον rằng lời chép không nhằm riêng Áp-ra-ham.
- source_word: ὅτι
  choice: lời
  rationale: Trong tiếng Việt, chuyển mệnh đề nội dung thành lời trích dẫn trực tiếp giúp câu rõ và tự nhiên; nội dung Hy Lạp vẫn được giữ nguyên, không thêm ý.
- source_word: ἐλογίσθη
  choice: được kể
  rationale: “Kể” giữ được nghĩa xem hoặc tính một điều cho ai trong lập luận của Rô-ma 4, đồng thời tránh khóa nghĩa vào một cách diễn giải thần học duy nhất.
- source_word: αὐτῷ
  choice: cho ông
  rationale: “Cho ông” diễn đạt tự nhiên quan hệ của tặng cách với động từ bị động “được kể” và chỉ về Áp-ra-ham.
theological_decisions:
- issue: Cách dịch λογίζομαι trong lập luận của Phao-lô về sự xưng công chính
  choice: được kể
  alternative: được tính cho; được quy cho
  rationale: “Được kể” bảo toàn hình ảnh đánh giá hoặc hạch toán mà không giải quyết thay cho độc giả bản chất chính xác của việc điều được nói ở câu trước được kể cho Áp-ra-ham.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Đặt nội dung được chép trong ngoặc kép để câu tự nhiên và cho thấy ὅτι dẫn vào nội dung trích dẫn; câu vẫn để mở sang câu 24 như nguyên văn.
