id: ROM.4.15
reference: Romans 4:15
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὁ γὰρ νόμος ὀργὴν κατεργάζεται, οὗ ⸀δὲ οὐκ ἔστιν νόμος, οὐδὲ παράβασις.
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/015.yaml
  text: For the law produces wrath[a], but where there is no law[b], neither is there transgression.
translation:
  language: vi
  text: Vì luật pháp gây ra cơn thịnh nộ[a]; nhưng nơi nào không có luật pháp thì cũng không có sự vi phạm.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn không nói rõ đây là cơn thịnh nộ của ai; trong văn mạch có thể hiểu là cơn thịnh nộ của Đức Chúa Trời.
    reason: genuine_ambiguity
  - marker: b
    text: 'Cũng có thể dịch: “sự vượt quá giới hạn” hoặc “sự phạm điều luật”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: νόμος
  choice: luật pháp
  rationale: Giữ phạm vi rộng của từ ngữ Phao-lô dùng, không mặc nhiên giới hạn vào Luật Môi-se; tiếng Việt không dùng mạo từ nên sự mơ hồ này được bảo toàn tự nhiên.
- source_word: ὀργή
  choice: cơn thịnh nộ
  rationale: Diễn đạt sắc thái nghiêm trọng, mang tính phán xét trong văn mạch Phao-lô, mạnh hơn sự tức giận thông thường.
- source_word: κατεργάζεται
  choice: gây ra
  rationale: Cách nói tự nhiên, rõ nghĩa trong tiếng Việt và giữ quan hệ nhân quả của động từ.
- source_word: οὗ δὲ
  choice: nhưng nơi nào
  rationale: Phản ánh cấu trúc chỉ nơi chốn cùng sắc thái tương phản nhẹ của δέ.
- source_word: παράβασις
  choice: sự vi phạm
  rationale: Chỉ hành vi vượt qua hoặc phá vỡ một ranh giới hay điều răn đã được xác lập; tự nhiên hơn “sự phạm pháp” trong ngữ cảnh này.
theological_decisions:
- issue: Phạm vi của νόμος trong lập luận của Phao-lô
  choice: luật pháp
  alternative: Luật Pháp
  rationale: Không viết hoa để tránh quyết định trước rằng câu này chỉ nói riêng về Luật Môi-se, đồng thời vẫn để ngỏ nền tảng ấy trong văn mạch.
- issue: Chủ thể ngầm của ὀργή
  choice: cơn thịnh nộ
  alternative: cơn thịnh nộ của Đức Chúa Trời
  rationale: Nguyên văn không nêu rõ chủ thể; bản dịch không thêm “của Đức Chúa Trời”, nhờ đó bảo toàn sự hàm ẩn và sức căng thần học.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “luật pháp” nhất quán nhưng không viết hoa để giữ độ rộng nghĩa; cấu trúc hai vế được giữ gọn, rõ và gần với nhịp lập luận Hy Lạp.
