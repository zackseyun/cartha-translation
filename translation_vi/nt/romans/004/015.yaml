  terminology: “Luật pháp,” “cơn thịnh nộ,” và “sự vi phạm” phù hợp với thuật ngữ Phao-lô và không áp đặt việc hiểu νόμος chỉ là Luật Môi-se. Chú thích a bảo toàn việc nguyên văn không nêu chủ thể của cơn thịnh nộ; chú thích b nêu các khả năng từ vựng mà không thay đổi nghĩa chính.
