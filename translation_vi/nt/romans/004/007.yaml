revisions:
- from: Phước cho những người được tha các việc trái luật[a], và những người có tội lỗi được che phủ.
  to: Phước cho những người mà các việc trái luật của họ đã được tha, và tội lỗi của họ đã được che phủ.
  rationale: Bản sửa làm rõ trong cả hai vế rằng «các việc trái luật» và «tội lỗi» là những điều thuộc về các người được tuyên bố có phước, đồng thời giữ thể bị động, sự phân biệt từ vựng, và ẩn dụ «che phủ» của nguyên văn. Đã điều chỉnh chú thích để phù hợp sát hơn với sắc thái của ἀνομίαι.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T10:24:35Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản nháp giữ đúng cấu trúc song hành, thể bị động và ẩn dụ «che phủ» của nguyên văn. Tuy nhiên, cụm «những người có tội lỗi được che phủ» sai quan hệ sở hữu của ὧν: điều được che phủ là tội lỗi của họ, không phải con người có tội lỗi được che phủ.'
  naturalness: «Phước cho những người...» là cách nói Kinh Thánh tự nhiên, nhưng việc lặp «những người» và cấu trúc «có tội lỗi được che phủ» làm câu nặng và không tự nhiên. Dùng mệnh đề sở hữu song hành sẽ rõ và trôi chảy hơn.
  terminology: «Các việc trái luật» truyền đạt hợp lý ἀνομίαι và phân biệt với «tội lỗi» (ἁμαρτίαι). «Được tha» phù hợp ἀφέθησαν; «được che phủ» bảo toàn hình ảnh của ἐπεκαλύφθησαν. Chú thích hiện có dùng «các điều gian ác», không phải lựa chọn tương đương sát nhất cho ἀνομίαι; «những việc trái luật» là phương án sát và tự nhiên hơn.
  issues:
  - severity: high
    issue: «những người có tội lỗi được che phủ» gán cụm bị động «được che phủ» cho «những người» thay vì cho «tội lỗi».
    rationale: Trong ὧν ἐπεκαλύφθησαν αἱ ἁμαρτίαι, αἱ ἁμαρτίαι là chủ ngữ của động từ bị động; ὧν biểu thị sở hữu («tội lỗi của họ»). Cần chỉnh để không đổi nghĩa.
  - severity: low
    issue: Lặp lại «những người» không cần thiết và làm yếu phép song hành sở hữu của nguyên văn.
    rationale: Cấu trúc «những người mà ... của họ...» trong cả hai vế diễn đạt rõ ὧν, đồng thời tự nhiên trong tiếng Việt.
  - severity: low
    issue: Chú thích thay thế «các điều gian ác» làm mờ sắc thái vi phạm luật của ἀνομίαι.
    rationale: Phương án «những việc trái luật» duy trì rõ sắc thái lexical của từ Hy Lạp mà vẫn là một cách diễn đạt tiếng Việt tự nhiên.
  revised_text: Phước cho những người mà các việc trái luật của họ đã được tha, và tội lỗi của họ đã được che phủ.
  revised_footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “những việc trái luật của họ đã được tha.”'
    reason: lexical_alternative
  revision_rationale: Bản sửa làm rõ trong cả hai vế rằng «các việc trái luật» và «tội lỗi» là những điều thuộc về các người được tuyên bố có phước, đồng thời giữ thể bị động, sự phân biệt từ vựng, và ẩn dụ «che phủ» của nguyên văn. Đã điều chỉnh chú thích để phù hợp sát hơn với sắc thái của ἀνομίαι.
