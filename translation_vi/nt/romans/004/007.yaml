  yaml_path: translation/nt/romans/004/007.yaml
  text: Blessed are those whose lawless deeds have been forgiven[a], and whose sins have been covered.
translation:
  language: vi
  text: Phước cho những người mà các việc trái luật của họ đã được tha, và tội lỗi của họ đã được che phủ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μακάριοι
  choice: Phước cho
  rationale: Cách diễn đạt quen thuộc, trang trọng của lời tuyên bố phước lành; tránh thu hẹp ý nghĩa vào cảm xúc chủ quan như “hạnh phúc”.
- source_word: ἀφέθησαν
  choice: được tha
  rationale: Dạng bị động diễn tả hành động tha thứ; tiếng Việt tự nhiên không cần biểu thị riêng thì quá khứ hoàn thành nhưng vẫn truyền đạt kết quả đã thành.
- source_word: ἀνομίαι
  choice: các việc trái luật
  rationale: Giữ sắc thái vi phạm luật của ἀνομία và diễn đạt rõ ràng cho độc giả hiện đại, đồng thời phân biệt với ἁμαρτίαι.
- source_word: ἐπεκαλύφθησαν
  choice: được che phủ
  rationale: Giữ nguyên hình ảnh ẩn dụ của câu trích Thi Thiên 32:1, thay vì giải thích thành “được xóa bỏ” hay “được tha”.
- source_word: ἁμαρτίαι
  choice: tội lỗi
  rationale: Từ tương ứng chuẩn, tự nhiên và minh bạch trong tiếng Việt.
theological_decisions:
- issue: Mối quan hệ giữa ἀνομίαι và ἁμαρτίαι
  choice: Dịch phân biệt là “các việc trái luật” và “tội lỗi”
  alternative: Dịch cả hai bằng cùng một từ chung như “tội lỗi”
  rationale: Bản Hy Lạp duy trì phép song hành thi ca bằng hai từ gần nghĩa nhưng không đồng nhất. Việc phân biệt chúng phản ánh nguyên văn mà không áp đặt một khác biệt thần học sắc nét hơn câu này.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. “Phước cho” giữ giọng tuyên bố phước lành trong Kinh Thánh; cấu trúc song hành và ẩn dụ “che phủ” được bảo toàn.
