id: ROM.4.9
reference: Romans 4:9
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ὁ μακαρισμὸς οὖν οὗτος ἐπὶ τὴν περιτομὴν ἢ καὶ ἐπὶ τὴν ἀκροβυστίαν; λέγομεν ⸀γάρ· Ἐλογίσθη τῷ Ἀβραὰμ ἡ πίστις εἰς δικαιοσύνην.
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/009.yaml
  text: Is this blessing[a], then, for the circumcised, or also for the uncircumcised? For we say, “Faith was counted to Abraham as righteousness.”
translation:
  language: vi
  text: 'Vậy, phước lành này dành cho người chịu cắt bì, hay cũng dành cho người không chịu cắt bì? Vì chúng ta nói rằng: “Đức tin được kể cho Áp-ra-ham là sự công chính[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “công lý.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: μακαρισμός
  choice: phước lành
  rationale: Chỉ tình trạng có phước vừa được công bố trong Rô-ma 4:6–8; “phước lành” tự nhiên, trang trọng và dễ hiểu trong tiếng Việt hiện đại.
- source_word: περιτομή
  choice: người chịu cắt bì
  rationale: Danh từ “sự cắt bì” được dùng hoán dụ cho nhóm người mang dấu cắt bì; diễn đạt bằng người giúp làm rõ đối tượng mà vẫn giữ phép đối lập của Phao-lô.
- source_word: ἀκροβυστία
  choice: người không chịu cắt bì
  rationale: Danh từ này được dùng hoán dụ cho nhóm không cắt bì; cách dịch đối xứng với περιτομή và rõ nghĩa trong tiếng Việt.
- source_word: πίστις
  choice: đức tin
  rationale: Đây là cách dịch thông dụng, phù hợp với ngữ cảnh Phao-lô trích dẫn lời nói về Áp-ra-ham, đồng thời không tự ý thu hẹp thành sự trung tín.
- source_word: ἐλογίσθη
  choice: được kể
  rationale: Giữ hình ảnh tính/kể của λογίζομαι và dạng bị động, đồng thời là cách nói quen thuộc trong ngữ cảnh trích dẫn Sáng Thế Ký.
- source_word: δικαιοσύνη
  choice: sự công chính
  rationale: Phù hợp với lập luận về địa vị của Áp-ra-ham trước Đức Chúa Trời; “công lý” là khả năng từ vựng nhưng không tự nhiên bằng trong ngữ cảnh này.
- source_word: εἰς δικαιοσύνην
  choice: là sự công chính
  rationale: Diễn đạt thành ngữ quy kể ‘như/là sự công chính’ bằng tiếng Việt tự nhiên, không mở rộng thành một hệ thống thần học.
theological_decisions:
- issue: Mối liên hệ giữa đức tin của Áp-ra-ham và sự công chính
  choice: “Đức tin của Áp-ra-ham được kể là sự công chính.”
  alternative: “Đức tin được kể cho Áp-ra-ham để được sự công chính.”
  rationale: Cách chọn giữ cấu trúc quy kể và sự căng thẳng thần học của câu trích dẫn, không bổ sung cách giải thích về cơ chế hay nền tảng của sự xưng công chính.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng cặp diễn đạt đối xứng “người chịu cắt bì / người không chịu cắt bì”; giữ thuật ngữ thần học quen thuộc “đức tin” và “sự công chính”.
