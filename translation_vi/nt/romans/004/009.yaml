  to: 'Vậy, phước lành này dành cho người chịu cắt bì, hay cũng dành cho người không chịu cắt bì? Vì chúng ta nói rằng: “Đức tin được kể cho Áp-ra-ham là sự công chính[a].”'
  rationale: 'Sửa cách diễn đạt của câu trích để phản ánh ἡ πίστις ... ἐλογίσθη τῷ Ἀβραὰμ εἰς δικαιοσύνην: đức tin là điều được quy kể, và Áp-ra-ham là người nhận sự quy kể. Không giải thích thêm cơ chế thần học. Dời neo chú thích đến đúng từ có phương án từ vựng thay thế và rút gọn nội dung chú thích cho tự nhiên.'
