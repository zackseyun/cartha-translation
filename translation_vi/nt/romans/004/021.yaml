id: ROM.4.21
reference: Romans 4:21
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ πληροφορηθεὶς ὅτι ὃ ἐπήγγελται δυνατός ἐστιν καὶ ποιῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/021.yaml
  text: and being fully convinced that what he had promised[c][b][a], he was also able to do.
translation:
  language: vi
  text: và hoàn toàn tin chắc[a] rằng điều Ngài đã hứa[c], Ngài cũng có khả năng thực hiện[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “hoàn toàn xác tín” hoặc “tin chắc chắn”.'
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn dùng thì hiện tại: “có khả năng”; ý nói Ngài đủ quyền năng để thực hiện điều đã hứa.'
    reason: lexical_alternative
  - marker: c
    text: “Ngài” được hiểu là Đức Chúa Trời theo ngữ cảnh chung quanh.
    reason: cross_reference
lexical_decisions:
- source_word: πληροφορηθεὶς
  choice: hoàn toàn tin chắc
  rationale: Phân từ diễn tả trạng thái xác tín trọn vẹn. Cách dịch này tự nhiên trong tiếng Việt hiện đại và giữ được cường độ của từ Hy Lạp.
- source_word: ὅτι
  choice: rằng
  rationale: Dẫn vào nội dung điều Áp-ra-ham tin chắc một cách trực tiếp và tự nhiên.
- source_word: ὃ
  choice: điều
  rationale: Đại từ quan hệ trung tính được diễn đạt tự nhiên trong cấu trúc tiếng Việt là “điều Ngài đã hứa”.
- source_word: ἐπήγγελται
  choice: đã hứa
  rationale: Thì hoàn thành Hy Lạp chỉ lời hứa đã được ban và vẫn còn hiệu lực; “đã hứa” chuyển tải điều này tự nhiên mà không áp đặt sắc thái quá khứ hoàn thành vốn không bắt buộc trong tiếng Việt.
- source_word: δυνατός ἐστιν
  choice: có khả năng
  rationale: Giữ giá trị hiện tại của tiếng Hy Lạp và diễn tả năng lực vốn có, bền vững của chủ thể; tránh chuyển thành quá khứ chỉ vì mạch kể.
- source_word: καὶ
  choice: cũng
  rationale: 'Nêu sự tương ứng: Đấng đã hứa cũng có khả năng thực hiện điều ấy.'
- source_word: ποιῆσαι
  choice: thực hiện
  rationale: Trong ngữ cảnh lời hứa, “thực hiện” tự nhiên và rõ hơn “làm”, đồng thời không thêm nội dung ngoài ý hoàn thành điều đã hứa.
theological_decisions:
- issue: Chủ thể ngầm của lời hứa và khả năng thực hiện
  choice: Dùng đại từ tôn kính “Ngài” trong câu chính, không chèn danh xưng “Đức Chúa Trời”.
  alternative: 'Dịch rõ: “Đức Chúa Trời cũng có khả năng thực hiện điều Ngài đã hứa.”'
  rationale: Ngữ cảnh xác định chủ thể là Đức Chúa Trời, nhưng câu Hy Lạp chỉ hàm ẩn chủ thể trong các động từ. “Ngài” giữ sự liên kết với ngữ cảnh mà không bổ sung danh xưng vào chính câu.
- issue: Thời của δυνατός ἐστιν
  choice: Giữ ý hiện tại bằng “có khả năng”.
  alternative: 'Dịch theo bối cảnh kể chuyện: “đã có khả năng” hoặc “có thể”.'
  rationale: Nguyên văn dùng hiện tại, có thể nhấn mạnh năng lực thường hằng của Đức Chúa Trời. Tiếng Việt không cần lùi thì theo mạch kể như tiếng Anh.
translation_notes:
  register: 'Văn phong hiện đại, trang trọng và dễ hiểu. Cấu trúc giữ thứ tự trọng tâm của nguyên văn: điều đã hứa trước, khả năng thực hiện sau. Đại từ “Ngài” viết hoa theo quy ước tiếng Việt dành cho Đức Chúa Trời; các dấu chú thích được đặt ngay sau thành phần liên quan.'
