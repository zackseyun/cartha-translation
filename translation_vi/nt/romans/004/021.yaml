  source_fidelity: 'Bản dịch chuyển tải đúng cấu trúc và ý nghĩa của câu Hy Lạp: phân từ πληροφορηθεὶς là trạng thái xác tín trọn vẹn; ὅτι mở nội dung xác tín; ὃ ἐπήγγελται là “điều Ngài đã hứa”; và δυνατός ἐστιν καὶ ποιῆσαι là Ngài có khả năng cũng để thực hiện điều ấy. Cách dùng “đã hứa” phù hợp với thì hoàn thành mà không ép tiếng Việt phải biểu thị một sắc thái thì không tự nhiên. “Có khả năng” giữ được hiện tại của ἐστιν và không làm yếu ý nghĩa trong ngữ cảnh.'
  naturalness: “và hoàn toàn tin chắc rằng điều Ngài đã hứa, Ngài cũng có khả năng thực hiện” là câu tiếng Việt hiện đại, trang trọng và dễ hiểu. Việc đưa “điều Ngài đã hứa” lên trước rồi nối bằng dấu phẩy tạo trọng tâm tự nhiên, đồng thời giữ được quan hệ với “thực hiện”.
  terminology: “Ngài” là cách quy chiếu tôn kính, rõ nghĩa theo ngữ cảnh trước sau mà không thêm danh xưng vào nguyên văn câu. “Thực hiện” là lựa chọn phù hợp cho việc làm thành điều đã hứa. Các chú thích giải thích lựa chọn từ vựng, thì hiện tại và chủ thể ngầm đều có cơ sở; các neo chú thích được đặt đúng thành phần liên quan.
