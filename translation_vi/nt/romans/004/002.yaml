id: ROM.4.2
reference: Romans 4:2
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εἰ γὰρ Ἀβραὰμ ἐξ ἔργων ἐδικαιώθη, ἔχει καύχημα· ἀλλ’ οὐ ⸀πρὸς θεόν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/002.yaml
  text: For if Abraham was justified by works[b][a], he has a boast—but not before God.
translation:
  language: vi
  text: Vì nếu Áp-ra-ham được xưng công chính bởi việc làm[a], thì ông có điều để khoe mình[b]—nhưng không phải trước mặt Đức Chúa Trời.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “được tuyên bố là công chính.”'
    reason: lexical_alternative
  - marker: b
    text: 'Hay: “thì ông có cớ để khoe mình.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ γὰρ
  choice: Vì nếu
  rationale: Giữ mạch lập luận của γάρ (“vì”) và sắc thái điều kiện của εἰ (“nếu”), không thêm từ ngữ khiến giả thiết bị hiểu là sự thật hay phản thực.
- source_word: Ἀβραὰμ
  choice: Áp-ra-ham
  rationale: Dùng dạng tên riêng Kinh Thánh quen thuộc trong tiếng Việt.
- source_word: ἐξ ἔργων
  choice: bởi việc làm
  rationale: Diễn đạt việc làm như căn cứ hay phương diện làm nền cho sự xưng công chính, đồng thời giữ cách nói ngắn gọn của nguyên văn.
- source_word: ἐδικαιώθη
  choice: được xưng công chính
  rationale: Thể hiện động từ bị động và sắc thái pháp lý/tuyên nhận của δικαιόω mà không đồng nhất nó một cách đơn giản với việc trở nên có đạo đức.
- source_word: ἔχει καύχημα
  choice: có điều để khoe mình
  rationale: Diễn đạt tự nhiên danh từ καύχημα theo nghĩa có căn cứ hoặc điều để tự hào/khoe mình.
- source_word: ἀλλ’ οὐ πρὸς θεόν
  choice: nhưng không phải trước mặt Đức Chúa Trời
  rationale: “Trước mặt Đức Chúa Trời” diễn đạt tự nhiên sự quy chiếu đến sự đánh giá của Đức Chúa Trời, đồng thời giữ nét cô đọng của cụm Hy Lạp.
theological_decisions:
- issue: Giả thiết này là trường hợp có thật hay chỉ mang tính lập luận
  choice: Dịch trực tiếp là “nếu Áp-ra-ham được xưng công chính bởi việc làm”
  alternative: “nếu quả thật Áp-ra-ham được xưng công chính bởi việc làm” hoặc “nếu Áp-ra-ham đã được xưng công chính bởi việc làm” theo nghĩa phản thực
  rationale: Cấu trúc điều kiện Hy Lạp không tự nó yêu cầu thêm “quả thật” hoặc biến thành điều kiện phản thực. Bản dịch giữ nguyên sức căng trong lập luận của Phao-lô thay vì đưa kết luận của văn mạch vào ngay mệnh đề giả thiết.
- issue: Quan hệ giữa sự khoe mình và Đức Chúa Trời
  choice: “nhưng không phải trước mặt Đức Chúa Trời”
  alternative: “nhưng không phải đối với Đức Chúa Trời”
  rationale: Cụm πρὸς θεόν có thể được hiểu theo sự quy chiếu hoặc trong tương quan với Đức Chúa Trời. Cách dịch đã chọn tự nhiên trong tiếng Việt nhưng không giải thích thêm rằng sự khoe mình chỉ đúng trước loài người.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Xưng công chính” giữ thuật ngữ thần học quen thuộc nhưng được chú thích bằng cách diễn đạt giải thích. Các dấu chú thích [a], [b] đều xuất hiện ngay sau cụm từ liên quan trong câu chính.
