source:
  edition: SBLGNT
  text: τῷ δὲ μὴ ἐργαζομένῳ, πιστεύοντι δὲ ἐπὶ τὸν δικαιοῦντα τὸν ἀσεβῆ, λογίζεται ἡ πίστις αὐτοῦ εἰς δικαιοσύνην,
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/005.yaml
  text: But to the one not working[a], but believing in the one who justifies the ungodly[d][c][b], his faith is counted as righteousness.
translation:
  language: vi
  text: '**Rô-ma 4:5** Còn đối với người không làm việc, nhưng tin[a] vào Đấng xưng công chính[b] cho kẻ không tin kính, thì đức tin của người ấy được kể[c] là sự công chính[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “tin cậy.”'
    reason: lexical_alternative
  - marker: b
    text: 'Hoặc: “tuyên bố là công chính.”'
    reason: lexical_alternative
  - marker: c
    text: 'Hoặc: “được ghi nhận” hay “được quy là.”'
    reason: lexical_alternative
  - marker: d
    text: 'Hoặc: “công lý”; trong một số ngữ cảnh của Phao-lô, từ Hy Lạp này cũng có thể được dịch như vậy.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τῷ ... μὴ ἐργαζομένῳ
  choice: đối với người không làm việc
  rationale: Giữ cấu trúc phân từ được dùng như danh từ và sự tương phản trực tiếp với hành động tin, mà không diễn giải thêm rằng mọi việc làm đều bị lên án.
- source_word: πιστεύοντι δὲ ἐπὶ
  choice: nhưng tin vào
  rationale: “Tin vào” là cách diễn đạt tự nhiên trong tiếng Việt hiện đại, giữ được ý hướng lòng tin vào một đối tượng; sắc thái “tin cậy” được nêu ở chú thích.
- source_word: τὸν δικαιοῦντα
  choice: Đấng xưng công chính
  rationale: Giữ thuật ngữ thần học trọng yếu của lập luận Phao-lô và mối liên hệ từ vựng với δικαιοσύνη, nhưng không xác định cơ chế thần học vượt quá câu Hy Lạp.
- source_word: τὸν ἀσεβῆ
  choice: kẻ không tin kính
  rationale: Diễn đạt ngắn gọn tình trạng thiếu lòng tôn kính đối với Đức Chúa Trời, không nghiêng quá mức sang nghĩa gian ác nói chung.
- source_word: λογίζεται
  choice: được kể
  rationale: Giữ hình ảnh xem hoặc tính một điều là điều khác trong ngữ cảnh; các khả năng “ghi nhận” và “quy” được bảo lưu ở chú thích.
- source_word: ἡ πίστις αὐτοῦ
  choice: đức tin của người ấy
  rationale: Ngữ cảnh đối lập việc làm với hành động tin, nên “đức tin” phù hợp hơn “sự trung tín”; cách nói này cũng tránh đại từ có thể gây mơ hồ trong tiếng Việt.
- source_word: εἰς δικαιοσύνην
  choice: là sự công chính
  rationale: Trong kết cấu với λογίζεται, “được kể là” diễn đạt rõ quan hệ quy chiếu mà không thêm một hệ thống giải thích thần học.
- source_word: δικαιοσύνην
  choice: sự công chính
  rationale: Giữ thuật ngữ chủ đạo trong lập luận của Phao-lô và liên hệ với “xưng công chính”; nghĩa khả dĩ “công lý” được ghi ở chú thích.
theological_decisions:
- issue: Cách dịch δικαιοῦντα trong ngữ cảnh thần học của Phao-lô
  choice: Đấng xưng công chính
  alternative: Đấng tuyên bố là công chính
  rationale: “Xưng công chính” giữ được thuật ngữ cô đọng và mối liên hệ với “sự công chính”, đồng thời không thêm vào câu một học thuyết hệ phái cụ thể. Chú thích bảo lưu sắc thái tuyên bố của động từ.
- issue: Cách dịch nhóm từ πίστις/πιστεύω
  choice: tin / đức tin
  alternative: tin cậy / lòng tin cậy
  rationale: Sự tương phản ngay trong câu giữa không làm việc và tin ủng hộ nghĩa hành động hoặc thái độ tin hơn là “sự trung tín”. Sắc thái nương cậy vẫn được giữ trong chú thích.
- issue: Quan hệ giữa λογίζεται và δικαιοσύνην
  choice: được kể là sự công chính
  alternative: được ghi nhận hoặc được quy là công chính
  rationale: Bản dịch giữ nguyên sức căng của ngôn ngữ tính/kể trong câu mà không quyết định cụ thể bản chất hay cơ chế của việc xưng công chính.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại, với câu cú gần cấu trúc Hy Lạp mà vẫn tự nhiên trong tiếng Việt. Dùng “người ấy” thay cho đại từ giới tính để chỉ rõ chủ thể sở hữu đức tin. Các thuật ngữ “xưng công chính”, “đức tin” và “sự công chính” được giữ nhất quán, còn những sắc thái từ vựng quan trọng được bảo lưu trong chú thích.
