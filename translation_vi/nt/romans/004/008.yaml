revisions:
- from: Phước cho người mà Chúa quyết không kể tội người ấy[a].
  to: Phước cho người mà Chúa quyết không tính tội cho người ấy[a].
  rationale: Thay “kể tội người ấy” bằng “tính tội cho người ấy” để phản ánh chính xác hơn động từ λογίζομαι trong cấu trúc này và duy trì ẩn dụ tính sổ của Rô-ma 4, mà vẫn giữ nguyên sắc thái phủ định nhấn mạnh, giọng chúc phước, và phạm vi quy chiếu của câu.
