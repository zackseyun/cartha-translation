base_translation:
  language: en
  yaml_path: translation/nt/romans/004/008.yaml
  text: Blessed is the man against whom the Lord will never count sin[a][b].
translation:
  language: vi
  text: Phước cho người mà Chúa quyết không tính tội cho người ấy[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Chúa chắc chắn sẽ không tính tội cho người ấy” hoặc “Chúa sẽ không bao giờ tính tội cho người ấy.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: μακάριος
  choice: Phước cho
  rationale: Cách diễn đạt quen thuộc, trang trọng trong ngôn ngữ chúc phước Kinh Thánh; tránh sắc thái chủ quan quá nhẹ của “hạnh phúc”.
- source_word: ἀνήρ
  choice: người
  rationale: Trong câu trích dẫn này, danh từ giống đực số ít mang ý nghĩa đại diện, không giới hạn ở nam giới; “người” diễn đạt tự nhiên và chính xác phạm vi quy chiếu trong tiếng Việt.
- source_word: οὗ
  choice: mà ... người ấy
  rationale: Kết cấu này chuyển quan hệ sở thuộc của đại từ Hy Lạp sang câu tiếng Việt tự nhiên, đồng thời làm rõ tội không bị kể cho người được nói đến.
- source_word: οὐ μὴ
  choice: quyết không
  rationale: Truyền đạt sự phủ định nhấn mạnh của οὐ μή với động từ giả định mà không buộc câu phải mang nghĩa thời gian tuyệt đối như “không bao giờ”.
- source_word: λογίσηται
  choice: kể
  rationale: Giữ được hình ảnh tính toán, ghi vào sổ vốn là trọng tâm của Rô-ma 4, đồng thời là từ phổ thông trong tiếng Việt.
- source_word: κύριος
  choice: Chúa
  rationale: Cách dịch chuẩn, tự nhiên trong bối cảnh trích dẫn Kinh Thánh và chỉ về Đức Chúa Trời.
- source_word: ἁμαρτίαν
  choice: tội
  rationale: Giữ danh từ số ít không có mạo từ như một khái niệm chung, phù hợp cách nói tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Ngôn ngữ giống đực mang tính đại diện
  choice: Dịch ἀνήρ là “người” trong chính văn.
  alternative: “người đàn ông” hoặc “người nam”
  rationale: Dù ἀνήρ có hình thức giống đực, trong lời chúc phước này nó chỉ một con người theo nghĩa đại diện, không loại trừ nữ giới. Tiếng Việt không cần dùng từ chỉ giới tính để bảo toàn ý nghĩa ấy.
- issue: Mức độ nhấn mạnh của οὐ μή
  choice: “quyết không”
  alternative: “không bao giờ” hoặc “chắc chắn sẽ không”
  rationale: “Quyết không” bảo toàn sức phủ định mạnh mà không giải quyết quá mức sắc thái thể và thời vốn không được đánh dấu đơn giản như thì tương lai trong tiếng Anh.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Cấu trúc “Phước cho...” duy trì giọng văn chúc phước; “kể tội” bảo toàn ẩn dụ ghi sổ trong văn mạch Rô-ma 4. Đại từ “người ấy” giúp câu rõ nghĩa mà không thêm nội dung thần học.
