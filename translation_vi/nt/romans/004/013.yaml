id: ROM.4.13
reference: Romans 4:13
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Οὐ γὰρ διὰ νόμου ἡ ἐπαγγελία τῷ Ἀβραὰμ ἢ τῷ σπέρματι αὐτοῦ, τὸ κληρονόμον αὐτὸν ⸀εἶναι κόσμου, ἀλλὰ διὰ δικαιοσύνης πίστεως·
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/013.yaml
  text: For the promise to Abraham or to his offspring that he would be heir of the world was not through the law[d][c][b][a], but through the righteousness of faith.
translation:
  language: vi
  text: Vì lời hứa dành cho Áp-ra-ham hoặc dòng dõi[a] ông—rằng ông sẽ là người thừa kế thế gian—đã không đến qua luật pháp, nhưng qua sự công chính[c] của đức tin[b][d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn là “hạt giống”. Từ Hy Lạp ở số ít nhưng có thể dùng theo nghĩa tập thể, tức “dòng dõi” hoặc “các hậu duệ”.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “sự công chính bởi đức tin” hoặc “sự công chính đến qua đức tin”.
    reason: alternative_reading
  - marker: c
    text: “Sự công chính” trong một số ngữ cảnh của Phao-lô cũng có thể được dịch là “công lý”.
    reason: lexical_alternative
  - marker: d
    text: Tùy ngữ cảnh, từ được dịch là “đức tin” cũng có thể mang nghĩa “lòng tin” hoặc “sự thành tín”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπαγγελία
  choice: lời hứa
  rationale: Đây là cách diễn đạt tự nhiên cho lời hứa của Đức Chúa Trời và giữ được sức nặng giao ước trong lập luận của Phao-lô.
- source_word: σπέρματι
  choice: dòng dõi
  rationale: Danh từ Hy Lạp ở số ít nhưng có thể mang nghĩa tập thể. “Dòng dõi” vừa tự nhiên trong tiếng Việt vừa không buộc phải hiểu là chỉ một hay nhiều hậu duệ.
- source_word: κληρονόμον ... κόσμου
  choice: người thừa kế thế gian
  rationale: Giữ rõ hình ảnh thừa kế và phạm vi rộng của κόσμος mà không thu hẹp thành đất đai hay một dân tộc.
- source_word: διὰ νόμου
  choice: nhờ luật pháp
  rationale: “Nhờ” diễn đạt phương tiện một cách tự nhiên. Trong mạch lập luận của Rô-ma, νόμος được hiểu hợp lý là luật pháp, đặc biệt là luật pháp Môi-se.
- source_word: δικαιοσύνης
  choice: sự công chính
  rationale: Giữ thuật ngữ chủ chốt của Phao-lô cùng sắc thái pháp lý và quan hệ giao ước; “công lý” được nêu như một khả năng từ vựng trong chú thích.
- source_word: πίστεως
  choice: đức tin
  rationale: “Đức tin” là cách dịch chuẩn và phù hợp nhất trong sự tương phản với luật pháp tại đây; các sắc thái “lòng tin” và “sự thành tín” được bảo lưu trong chú thích.
- source_word: διὰ δικαιοσύνης πίστεως
  choice: nhờ sự công chính của đức tin
  rationale: Giữ cấu trúc sở hữu cô đọng của nguyên văn, không quyết định dứt khoát sự công chính phát xuất từ, dựa trên hay gắn với đức tin.
theological_decisions:
- issue: Quan hệ trong cụm δικαιοσύνης πίστεως
  choice: sự công chính của đức tin
  alternative: sự công chính bởi đức tin; sự công chính đến qua đức tin
  rationale: Cấu trúc sở hữu trong tiếng Hy Lạp cô đọng và cho phép nhiều cách hiểu gần nhau. Bản dịch chính giữ sự căng thẳng thần học thay vì giải thích rõ hơn điều nguyên văn chưa nói rõ.
- issue: Đối tượng làm người thừa kế trong αὐτὸν εἶναι
  choice: ông sẽ là người thừa kế thế gian
  alternative: người ấy sẽ là người thừa kế thế gian
  rationale: Đại từ số ít giống đực tự nhiên nhất quy chiếu về Áp-ra-ham, nhưng câu vẫn đặt lời hứa trong mối liên hệ với cả Áp-ra-ham lẫn dòng dõi ông.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dấu gạch ngang làm rõ nội dung của lời hứa mà không biến cấu trúc câu thành một lời giải thích diễn ý. Các thuật ngữ “luật pháp”, “sự công chính”, “đức tin” được giữ nhất quán với ngôn ngữ thần học quen thuộc nhưng không thêm nét nghĩa hệ phái.
