revisions:
- from: 'Dù trái với mọi hy vọng[a], Áp-ra-ham vẫn tin trong niềm hy vọng, để trở thành cha của nhiều dân tộc, đúng như lời đã phán: “Dòng dõi ngươi sẽ như thế.”[b][c]'
  to: 'Dù trái với hy vọng[a], Áp-ra-ham vẫn tin trong niềm hy vọng, để trở thành cha của nhiều dân tộc, theo như điều đã được nói: “Dòng dõi ngươi sẽ như thế.”[b][c]'
  rationale: Bản sửa loại bỏ sự tăng cường không có trong nguyên văn (“mọi”) và thay “lời đã phán” bằng “điều đã được nói” để phản ánh chính xác thể bị động εἰρημένον mà không xác định thêm chủ thể. Các lựa chọn còn lại được giữ vì trung thành với tiếng Hy Lạp, phù hợp văn phong tiếng Việt hiện đại, và không áp đặt diễn giải thần học.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T10:24:42Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch giữ đúng các thành tố chính của câu: sự đối nghịch giữa παρ’ ἐλπίδα và ἐπ’ ἐλπίδι, hành vi tin của Áp-ra-ham, mục đích/kết quả trở thành cha của nhiều dân tộc, và lời trích dẫn. Tuy nhiên, “mọi” không có trong παρ’ ἐλπίδα và làm mạnh nghĩa hơn nguyên văn. “Lời đã phán” cũng xác định chủ thể phát ngôn rõ hơn điều κατὰ τὸ εἰρημένον tự nó nêu.'
  naturalness: Câu văn trang trọng, dễ hiểu. “Dù trái với hy vọng, Áp-ra-ham vẫn tin trong niềm hy vọng” tự nhiên hơn khi không thêm “mọi”; cách lặp “hy vọng” vẫn cần thiết để phản ánh lối đối xứng nghịch lý của tiếng Hy Lạp.
  terminology: “Áp-ra-ham,” “cha của nhiều dân tộc,” và “dòng dõi ngươi” đều phù hợp với cách dùng Kinh Thánh tiếng Việt hiện đại và bối cảnh lời hứa Áp-ra-ham. “Dòng dõi” diễn đạt tốt danh từ số ít tập thể σπέρμα.
  issues:
  - severity: medium
    issue: Thêm từ “mọi” trong “trái với mọi hy vọng.”
    rationale: παρ’ ἐλπίδα có nghĩa “trái/vượt ngoài hy vọng,” nhưng nguyên văn không có từ hạn định tương đương “mọi.” Sự thêm này tăng cường mức độ không cần thiết.
  - severity: low
    issue: “Đúng như lời đã phán” nêu rõ người phán hơn nguyên văn.
    rationale: κατὰ τὸ εἰρημένον nghĩa là “theo như điều đã được nói.” Dạng bị động không chỉ đích danh chủ thể; “điều đã được nói” bảo toàn cách diễn đạt này.
