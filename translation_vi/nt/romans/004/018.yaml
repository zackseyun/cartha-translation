id: ROM.4.18
reference: Romans 4:18
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὃς παρ’ ἐλπίδα ἐπ’ ἐλπίδι ἐπίστευσεν εἰς τὸ γενέσθαι αὐτὸν πατέρα πολλῶν ἐθνῶν κατὰ τὸ εἰρημένον· Οὕτως ἔσται τὸ σπέρμα σου·
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/018.yaml
  text: 'who[a], against hope, believed in hope, so that he might become the father of many nations[c][b], according to what had been spoken: “So shall your offspring be.”'
translation:
  language: vi
  text: 'Dù trái với hy vọng[a], Áp-ra-ham vẫn tin trong niềm hy vọng, để trở thành cha của nhiều dân tộc, theo như điều đã được nói: “Dòng dõi ngươi sẽ như thế.”[b][c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “vượt quá hy vọng” hoặc “ngược với hy vọng.”'
    reason: lexical_alternative
  - marker: b
    text: Nguyên văn là một danh từ số ít mang nghĩa tập thể; cũng có thể dịch sát hình ảnh là “hạt giống của ngươi.”
    reason: lexical_alternative
  - marker: c
    text: Trích Sáng Thế Ký 15:5; so sánh Sáng Thế Ký 17:5.
    reason: cross_reference
lexical_decisions:
- source_word: παρ’ ἐλπίδα
  choice: trái với mọi hy vọng
  rationale: Cụm παρά với đối cách diễn tả điều trái với hoặc vượt quá hy vọng thông thường. Thêm “mọi” giúp câu tiếng Việt tự nhiên mà vẫn giữ nghịch lý của nguyên văn.
- source_word: ἐπ’ ἐλπίδι
  choice: trong niềm hy vọng
  rationale: Giữ sự đối xứng tu từ với “trái với mọi hy vọng” và diễn tả phạm vi hoặc nền tảng của hành động tin.
- source_word: ἐπίστευσεν
  choice: vẫn tin
  rationale: “Tin” tương ứng trực tiếp với πιστεύω; “vẫn” làm rõ sự tương phản do hai cụm về hy vọng tạo nên mà không thêm một nội dung thần học mới.
- source_word: εἰς τὸ γενέσθαι αὐτὸν
  choice: để trở thành
  rationale: Giữ được sắc thái mục đích hoặc kết quả hướng tới của cấu trúc εἰς τό + động từ nguyên mẫu, không buộc phải phân xử dứt khoát giữa hai khả năng.
- source_word: πατέρα πολλῶν ἐθνῶν
  choice: cha của nhiều dân tộc
  rationale: “Dân tộc” phù hợp với bối cảnh lời hứa dành cho Áp-ra-ham hơn “dân ngoại,” vốn có thể đưa sự đối lập Do Thái–dân ngoại vào câu quá sớm.
- source_word: κατὰ τὸ εἰρημένον
  choice: đúng như lời đã phán
  rationale: Cách diễn đạt này tự nhiên, trang trọng và thể hiện lời đã được nói trước đó vẫn có giá trị; “phán” phù hợp vì lời trích dẫn là lời của Đức Chúa Trời.
- source_word: Οὕτως ἔσται
  choice: sẽ như thế
  rationale: Giữ đại từ chỉ cách thức hoặc mức độ Οὕτως và sự liên hệ của nó với hình ảnh các ngôi sao trong ngữ cảnh Sáng Thế Ký 15:5.
- source_word: τὸ σπέρμα σου
  choice: dòng dõi ngươi
  rationale: “Dòng dõi” là cách nói tiếng Việt tự nhiên, trang trọng và giữ được nghĩa tập thể số ít của σπέρμα tốt hơn cách diễn giải thành “các hậu duệ.”
theological_decisions:
- issue: Phạm vi của “nhiều ἔθνη” trong lời hứa dành cho Áp-ra-ham
  choice: nhiều dân tộc
  alternative: nhiều dân ngoại; nhiều dân
  rationale: Ở đây Phao-lô nhắc lại lời hứa trong Sáng Thế Ký về Áp-ra-ham. “Dân tộc” bảo toàn phạm vi giao ước rộng mà không thu hẹp câu thành sự đối lập giữa người Do Thái và dân ngoại.
- issue: Quan hệ giữa đức tin của Áp-ra-ham và việc ông trở thành cha của nhiều dân tộc
  choice: để trở thành
  alternative: và kết quả là ông trở thành
  rationale: Cấu trúc Hy Lạp có thể mang sắc thái mục đích hoặc kết quả. “Để trở thành” giữ hướng quy chiếu về lời hứa mà không khẳng định quá mức một cách hiểu nhân quả duy nhất.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “Áp-ra-ham” để xác định rõ chủ thể của đại từ quan hệ Hy Lạp khi câu được trình bày riêng lẻ; dùng “ngươi” trong lời trích dẫn để duy trì sắc thái trang trọng của lời phán trong Kinh Thánh.
