id: ROM.4.12
reference: Romans 4:12
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ πατέρα περιτομῆς τοῖς οὐκ ἐκ περιτομῆς μόνον ἀλλὰ καὶ τοῖς στοιχοῦσιν τοῖς ἴχνεσιν τῆς ⸂ἐν ἀκροβυστίᾳ πίστεως⸃ τοῦ πατρὸς ἡμῶν Ἀβραάμ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/012.yaml
  text: and the father of circumcision to those who are not merely circumcised[d][c][b][a], but who also walk in the footsteps of the faith that our father Abraham had while uncircumcised.
translation:
  language: vi
  text: và là cha của những người chịu cắt bì, tức là những người không chỉ chịu cắt bì mà còn bước theo dấu chân đức tin của cha chúng ta là Áp-ra-ham, trong khi ông chưa chịu cắt bì.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πατέρα περιτομῆς
  choice: cha của những người chịu cắt bì
  rationale: Danh từ trừu tượng περιτομή ở đây chỉ cộng đồng chịu cắt bì. Cách diễn đạt này tự nhiên trong tiếng Việt và tránh khiến người đọc hiểu Áp-ra-ham là cha của chính nghi lễ.
- source_word: οὐκ ἐκ περιτομῆς μόνον
  choice: không phải chỉ chịu cắt bì mà thôi
  rationale: Diễn đạt thành ngữ Hy Lạp theo tiếng Việt tự nhiên, đồng thời giữ sự tương phản giữa việc chịu cắt bì đơn thuần và việc bước theo đức tin của Áp-ra-ham.
- source_word: στοιχοῦσιν τοῖς ἴχνεσιν
  choice: bước theo dấu chân
  rationale: Giữ hình ảnh bước đi theo những dấu chân, diễn tả việc noi theo một khuôn mẫu sống.
- source_word: πίστεως
  choice: đức tin
  rationale: Trong mạch lập luận, từ này nói đến hành động tin của Áp-ra-ham; “đức tin” là cách gọi rõ ràng, quen thuộc và phù hợp hơn “lòng trung tín” ở đây.
- source_word: ἐν ἀκροβυστίᾳ
  choice: khi chưa chịu cắt bì
  rationale: Chuyển trạng thái được diễn tả theo nghĩa đen là “trong tình trạng không cắt bì” thành cách nói thời gian tự nhiên trong tiếng Việt.
- source_word: τοῦ πατρὸς ἡμῶν Ἀβραάμ
  choice: mà tổ phụ chúng ta là Áp-ra-ham đã có
  rationale: Làm rõ quan hệ sở hữu của đức tin và dùng “tổ phụ” để diễn đạt tự nhiên danh xưng cộng đồng dành cho Áp-ra-ham trong tiếng Việt.
theological_decisions:
- issue: Áp-ra-ham là cha của mọi người chịu cắt bì hay chỉ của những người chịu cắt bì đồng thời noi theo đức tin của ông
  choice: Mệnh đề giới hạn vai trò tổ phụ của Áp-ra-ham đối với những người không chỉ chịu cắt bì mà còn bước theo dấu chân đức tin của ông.
  alternative: Áp-ra-ham là cha của tất cả những người chịu cắt bì, không kèm điều kiện.
  rationale: 'Cấu trúc οὐκ ... μόνον ἀλλὰ καί gắn cả hai đặc điểm với cùng một nhóm: họ không chỉ thuộc về sự cắt bì mà còn bước theo dấu chân đức tin của Áp-ra-ham.'
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “chịu cắt bì” thay vì danh từ trừu tượng ở đầu câu để chỉ rõ nhóm người; giữ nguyên hình ảnh “bước theo dấu chân”. Câu này nối tiếp cú pháp của câu trước nên mở đầu bằng “và cũng”.
