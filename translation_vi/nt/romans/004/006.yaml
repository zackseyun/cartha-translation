  source_fidelity: 'Bản nháp truyền đạt đúng ý chính, nhưng «Cũng vậy» chưa biểu đạt rõ cả καθάπερ (so sánh: “cũng như”) lẫn καί (Đa-vít “cũng” là chứng nhân bổ sung). «Không bởi việc làm» diễn giải quan hệ nguyên nhân/cơ sở mạnh hơn cách nói χωρὶς ἔργων (“không dựa trên/tách khỏi việc làm”), dù phù hợp văn mạch.'
