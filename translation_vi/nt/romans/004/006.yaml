id: ROM.4.6
reference: Romans 4:6
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καθάπερ καὶ Δαυὶδ λέγει τὸν μακαρισμὸν τοῦ ἀνθρώπου ᾧ ὁ θεὸς λογίζεται δικαιοσύνην χωρὶς ἔργων·
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/006.yaml
  text: Just as David also speaks of the blessedness of the man to whom God credits righteousness apart from works:[a][b][c]
translation:
  language: vi
  text: Cũng như vậy, Đa-vít cũng nói về phước hạnh của người mà Đức Chúa Trời kể là công chính, không dựa trên việc làm:[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “phước lành.”'
    reason: lexical_alternative
  - marker: b
    text: 'Hoặc: “Đức Chúa Trời kể sự công chính cho người ấy, tách biệt khỏi việc làm.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: καθάπερ
  choice: Cũng vậy
  rationale: Mở đầu sự so sánh với lập luận ngay trước đó bằng cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: καὶ
  choice: cũng
  rationale: Hàm ý Đa-vít được nêu thêm như một nhân chứng cho lập luận.
- source_word: λέγει
  choice: nói về
  rationale: Thì hiện tại của công thức trích dẫn được giữ lại; kết hợp tự nhiên với tân ngữ μακαρισμόν.
- source_word: μακαρισμός
  choice: phước lành
  rationale: Diễn đạt tự nhiên trạng thái hoặc lời tuyên bố một người có phước; tiếng Việt khó dùng một danh từ trừu tượng tương ứng trực tiếp với 'blessedness'.
- source_word: ἀνθρώπου
  choice: người
  rationale: Danh từ số ít mang nghĩa đại diện cho một con người nói chung, không giới hạn ở nam giới trong ngữ cảnh này.
- source_word: λογίζεται
  choice: kể là
  rationale: Giữ ý niệm quy tính hoặc kể vào tài khoản bằng lối nói hiện đại, đồng thời tránh thuật ngữ thần học nặng nề.
- source_word: δικαιοσύνην
  choice: công chính
  rationale: Trong cấu trúc λογίζεται δικαιοσύνην, 'kể là công chính' là lối diễn đạt Việt ngữ rõ ràng, bảo toàn ý niệm được Đức Chúa Trời quy nhận sự công chính.
- source_word: χωρὶς ἔργων
  choice: không bởi việc làm
  rationale: Thể hiện sự tách biệt giữa việc Đức Chúa Trời kể là công chính và việc làm như cơ sở của điều ấy.
theological_decisions:
- issue: Nghĩa đại diện của ἀνθρώπου
  choice: người
  alternative: người nam
  rationale: Tuy dạng Hy Lạp là số ít giống đực, ἄνθρωπος ở đây chỉ con người theo nghĩa đại diện; 'người' vừa chính xác vừa tự nhiên trong tiếng Việt.
- issue: Cách diễn đạt δικαιοσύνην với λογίζεται
  choice: kể là công chính
  alternative: kể sự công chính cho
  rationale: Bản chính chọn cấu trúc Việt ngữ tự nhiên mà không xác định quá mức cơ chế thần học; cách dịch sát cấu trúc danh từ được giữ trong chú thích.
- issue: Quan hệ của χωρὶς ἔργων
  choice: không bởi việc làm
  alternative: ngoài việc làm
  rationale: Cách chọn nhấn mạnh việc làm không phải là cơ sở của sự quy nhận, phù hợp tương phản trong văn mạch mà không thêm 'việc lành' vốn không có trong nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Chúa Trời” theo truyền thống Tin Lành Việt ngữ; “Đa-vít” được phiên âm quen thuộc. Không thêm “việc lành,” vì nguyên văn chỉ có ἔργων (“việc làm”).
