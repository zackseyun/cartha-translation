revisions:
- from: Cũng vậy, Đa-vít nói về phước lành của người được Đức Chúa Trời kể là công chính không bởi việc làm:[a][b]
  to: Cũng như vậy, Đa-vít cũng nói về phước hạnh của người mà Đức Chúa Trời kể là công chính, không dựa trên việc làm:[a][b]
  rationale: Bản sửa khôi phục lực so sánh và bổ sung của καθάπερ καὶ, dùng «phước hạnh» cho danh từ trừu tượng μακαρισμός, và diễn đạt χωρὶς ἔργων là sự không dựa trên việc làm. Chú thích b bảo lưu cách dịch sát cấu trúc λογίζεται δικαιοσύνην cùng phương án trực tiếp cho cụm cuối.
