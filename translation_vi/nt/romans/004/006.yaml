  terminology: Giữ «Đa-vít», «Đức Chúa Trời», «công chính» và «việc làm». «Người» phản ánh chính xác nghĩa đại diện của ἀνθρώπου. Cấu trúc «kể người ấy là công chính» là Việt ngữ tự nhiên, đồng thời chú thích phương án sát hơn với  δικαιοσύνην như một danh từ.
  issues:
