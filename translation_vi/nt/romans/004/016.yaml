  terminology: Giữ nhất quán các thuật ngữ “đức tin”, “ân điển”, “luật pháp”, “lời hứa”, và “dòng dõi”. “Những người thuộc luật pháp” gọn và sát hơn “thuộc về luật pháp”. Cách diễn đạt “có đức tin như Áp-ra-ham” là một diễn giải rõ nghĩa hợp lý của cụm Hy Lạp cô đọng; chú thích bảo lưu cách đọc sát chữ.
