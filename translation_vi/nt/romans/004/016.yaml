  source_fidelity: 'Cần chỉnh câu mở đầu. Nguyên văn không nêu rõ “lời hứa” làm chủ ngữ của ἐκ πίστεως; việc đưa “lời hứa” vào đó vừa thêm một chủ ngữ không được nêu, vừa dẫn đến lặp “lời hứa” ngay sau đó. Cần giữ tính tỉnh lược của câu Hy Lạp bằng “điều ấy”. Cấu trúc mục đích được giữ: bởi/dựa trên đức tin, để theo ân điển, hầu cho lời hứa được bảo đảm cho toàn thể dòng dõi.'
