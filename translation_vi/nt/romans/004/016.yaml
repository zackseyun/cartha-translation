source:
  edition: SBLGNT
  text: Διὰ τοῦτο ἐκ πίστεως, ἵνα κατὰ χάριν, εἰς τὸ εἶναι βεβαίαν τὴν ἐπαγγελίαν παντὶ τῷ σπέρματι, οὐ τῷ ἐκ τοῦ νόμου μόνον ἀλλὰ καὶ τῷ ἐκ πίστεως Ἀβραάμ (ὅς ἐστιν πατὴρ πάντων ἡμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/016.yaml
  text: For this reason it is by faith[a], so that it may be according to grace, in order that the promise may be certain to all the offspring—not only to those from the law, but also to those of the faith of Abraham, who is the father of us all[c][b],
translation:
  language: vi
  text: Vì vậy, điều ấy là bởi đức tin, để theo ân điển, hầu cho lời hứa được bảo đảm cho toàn thể dòng dõi[a]—không chỉ cho những người thuộc luật pháp, mà còn cho những người có đức tin như Áp-ra-ham[b], là cha của tất cả chúng ta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn là “hạt giống”; ở đây được dùng theo nghĩa tập hợp để chỉ dòng dõi hoặc hậu duệ của Áp-ra-ham.
    reason: lexical_alternative
  - marker: b
    text: 'Sát chữ: “người thuộc về đức tin của Áp-ra-ham.” “Đức tin” cũng có thể hiểu là “lòng tin”; nghĩa “sự thành tín” ít có khả năng hơn trong văn mạch này.'
    reason: alternative_reading
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: Vì vậy
  rationale: Diễn đạt tự nhiên sức suy luận của cụm từ, nối câu này với lập luận ngay trước đó.
- source_word: ἐκ πίστεως
  choice: dựa trên đức tin
  rationale: Cụm giới từ chỉ cơ sở của lời hứa; cách dịch này rõ nghĩa trong tiếng Việt và không biến đức tin thành công trạng.
- source_word: ἵνα κατὰ χάριν
  choice: để được theo ân điển
  rationale: Giữ rõ mệnh đề mục đích và mối tương quan giữa đức tin với ân điển, đồng thời không thêm ý 'hoàn toàn' vốn không có trong nguyên văn.
- source_word: βεβαίαν
  choice: bảo đảm
  rationale: Truyền đạt ý lời hứa chắc chắn, vững chắc và đáng tin cậy; dùng cấu trúc động từ tự nhiên trong tiếng Việt.
- source_word: ἐπαγγελίαν
  choice: lời hứa
  rationale: Cách dịch thông dụng, chính xác trong văn mạch lập luận của Phao-lô.
- source_word: σπέρματι
  choice: dòng dõi
  rationale: Danh từ số ít có nghĩa tập hợp, chỉ những người thuộc dòng dõi Áp-ra-ham; 'dòng dõi' vừa tự nhiên vừa giữ sắc thái Kinh Thánh.
- source_word: οὐ τῷ ἐκ τοῦ νόμου μόνον
  choice: không chỉ cho những người thuộc về luật pháp
  rationale: Số ít trong tiếng Hy Lạp mang nghĩa tập hợp; số nhiều tiếng Việt giúp nêu rõ đối tượng mà không thay đổi ý nghĩa.
- source_word: τῷ ἐκ πίστεως Ἀβραάμ
  choice: cho những người có đức tin như Áp-ra-ham
  rationale: Làm rõ cấu trúc Hy Lạp cô đọng theo cách tự nhiên, hiểu là những người được đặc trưng bởi cùng loại đức tin của Áp-ra-ham; chú thích bảo lưu cách dịch sát chữ hơn.
- source_word: πατὴρ πάντων ἡμῶν
  choice: cha của tất cả chúng ta
  rationale: Theo sát nguyên văn và giữ nguyên hình ảnh gia đình–giao ước.
theological_decisions:
- issue: Chủ ngữ hàm ẩn của ἐκ πίστεως và quan hệ giữa lời hứa, đức tin và ân điển
  choice: lời hứa dựa trên đức tin, để được theo ân điển
  alternative: điều ấy là bởi đức tin, để theo ân điển
  rationale: Văn mạch cho phép bổ sung 'lời hứa' làm chủ ngữ để câu tiếng Việt hoàn chỉnh, nhưng không khẳng định đức tin là nguồn của ân điển; đức tin là cơ sở/phương thức để lời hứa phù hợp với ân điển.
- issue: Cách hiểu τῷ ἐκ πίστεως Ἀβραάμ
  choice: những người có đức tin như Áp-ra-ham
  alternative: người thuộc về đức tin của Áp-ra-ham
  rationale: Cách chọn tự nhiên và cho thấy đối tượng là một nhóm người được đặc trưng bởi đức tin giống Áp-ra-ham, trong khi chú thích giữ lại hình thức sát nguyên văn và sự cô đọng của cụm từ Hy Lạp.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Giữ các thuật ngữ quen thuộc “đức tin”, “ân điển”, “luật pháp”, “lời hứa” và “dòng dõi”; dùng dấu gạch ngang để phản ánh sự đối chiếu trong câu Hy Lạp dài.
