  to: Vì vậy, điều ấy là bởi đức tin, để theo ân điển, hầu cho lời hứa được bảo đảm cho toàn thể dòng dõi[a]—không chỉ cho những người thuộc luật pháp, mà còn cho những người có đức tin như Áp-ra-ham[b], là cha của tất cả chúng ta.
