source:
  edition: SBLGNT
  text: ἀλλὰ καὶ δι’ ἡμᾶς οἷς μέλλει λογίζεσθαι, τοῖς πιστεύουσιν ἐπὶ τὸν ἐγείραντα Ἰησοῦν τὸν κύριον ἡμῶν ἐκ νεκρῶν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/024.yaml
  text: but also for us[a], to whom it will be credited—to us who believe in the one who raised Jesus our Lord from the dead[b],
translation:
  language: vi
  text: nhưng cũng vì chúng ta—những người sẽ được kể là công chính[a], tức là những người tin nơi[b] Đấng đã làm cho Đức Giê-su, Chúa chúng ta, sống lại từ cõi chết,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “được tính là công chính” hoặc “được quy kể là công chính.”
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “tin cậy nơi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ καὶ
  choice: nhưng cũng
  rationale: Giữ cả sắc thái đối lập của ἀλλά và sắc thái bổ sung của καί, nối câu này với lập luận trước đồng thời mở rộng điều đó đến chúng ta.
- source_word: δι’ ἡμᾶς
  choice: vì chúng ta
  rationale: διά với đối cách ở đây diễn tả rằng lời chép ấy cũng nhắm đến và có liên quan đến chúng ta; cách nói này tự nhiên trong tiếng Việt.
- source_word: οἷς μέλλει λογίζεσθαι
  choice: là những người sẽ được kể điều ấy là công chính
  rationale: Diễn đạt hướng tương lai của μέλλει và nghĩa quy kể của λογίζεσθαι. “Điều ấy” giữ đối tượng ở dạng hàm ẩn như nguyên văn, còn “là công chính” làm rõ kết quả được chuyển tiếp từ ngữ cảnh trước.
- source_word: τοῖς πιστεύουσιν ἐπὶ
  choice: tức là những người tin nơi
  rationale: Cụm mạo từ-phân từ xác định lại những người đang được nói đến; “tin nơi” diễn tả đức tin hướng về một thân vị và giữ được sắc thái tin cậy.
- source_word: τὸν ἐγείραντα
  choice: Đấng đã khiến ... sống lại
  rationale: Giữ cấu trúc phân từ dùng như danh từ để chỉ Đức Chúa Trời qua hành động của Ngài; “khiến ... sống lại” là cách diễn đạt tự nhiên về sự phục sinh.
- source_word: Ἰησοῦν τὸν κύριον ἡμῶν
  choice: Đức Giê-su, Chúa chúng ta
  rationale: Dùng tên gọi tiếng Việt thông dụng và giữ κύριος là “Chúa”; cấu trúc đồng vị phản ánh sát nguyên văn.
- source_word: ἐκ νεκρῶν
  choice: từ cõi chết
  rationale: Cách diễn đạt trang trọng, dễ hiểu cho thành ngữ phục sinh, không hàm ý rằng chính “cõi chết” là tác nhân.
theological_decisions:
- issue: Đối tượng hàm ẩn của λογίζεσθαι
  choice: “điều ấy” trong cụm “sẽ được kể điều ấy là công chính”
  alternative: “sự công chính sẽ được kể cho” hoặc chỉ “sẽ được kể”
  rationale: Tiếng Hy Lạp để đối tượng hàm ẩn và dựa vào ngữ cảnh trước, nơi sự công chính được nói đến. “Điều ấy” bảo tồn phần nào phép tỉnh lược, còn “là công chính” giúp câu tiếng Việt rõ nghĩa mà không biến câu này thành một phát biểu cụ thể hơn nguyên văn.
- issue: Sắc thái của πιστεύω ἐπί
  choice: “tin nơi”
  alternative: “tin cậy nơi”
  rationale: “Tin nơi” vừa tự nhiên trong văn phong Kinh Thánh tiếng Việt vừa không thu hẹp động từ chỉ còn cảm xúc tin cậy; chú thích bảo tồn cách hiểu “tin cậy nơi”.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Dấu gạch ngang làm rõ rằng “những người tin” đồng vị với “chúng ta.” Các dấu chú thích [a], [b] đều xuất hiện trong chính văn; [a] đặt sau cụm nói về chúng ta để chú thích cách hiểu của động từ quy kể, còn [b] đặt cuối mệnh đề đức tin.
