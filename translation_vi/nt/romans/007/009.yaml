id: ROM.7.9
reference: Romans 7:9
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐγὼ δὲ ἔζων χωρὶς νόμου ποτέ· ἐλθούσης δὲ τῆς ἐντολῆς ἡ ἁμαρτία ἀνέζησεν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/009.yaml
  text: I was once alive apart from the law[a], but when the commandment came, sin came to life,
translation:
  language: vi
  text: Trước kia tôi sống không có luật pháp; nhưng khi điều răn đến, tội lỗi sống dậy[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “lại sống” hoặc “hồi sinh.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔζων
  choice: tôi sống
  rationale: Diễn đạt tự nhiên động từ ở thì chưa hoàn thành, đồng thời trong ngữ cảnh vẫn giữ được sự đối lập giữa sống và chết.
- source_word: χωρὶς νόμου
  choice: không có luật pháp
  rationale: Giữ ý tách biệt hoặc thiếu vắng của χωρίς; “luật pháp” phù hợp với cách dùng của Phao-lô mà không thêm lời giải thích vào câu.
- source_word: ποτέ
  choice: trước kia
  rationale: Chuyển tải tự nhiên ý chỉ một thời điểm hoặc giai đoạn trước đây.
- source_word: ἐλθούσης ... τῆς ἐντολῆς
  choice: khi điều răn đến
  rationale: Chuyển cấu trúc sở hữu cách tuyệt đối thành mệnh đề thời gian tự nhiên trong tiếng Việt, vẫn giữ tính biến cố của động từ “đến”.
- source_word: ἐντολῆς
  choice: điều răn
  rationale: Thuật ngữ Kinh Thánh quen thuộc, phân biệt phù hợp với νόμος là “luật pháp”.
- source_word: ἁμαρτία
  choice: tội lỗi
  rationale: Giữ danh từ số ít được nhân cách hóa trong lập luận của Phao-lô.
- source_word: ἀνέζησεν
  choice: sống dậy
  rationale: Giữ hình ảnh tội lỗi được nhân cách hóa trở nên sống động; cách dịch này cũng bảo tồn khả năng hiểu là “hồi sinh” hoặc “lại sống”.
theological_decisions:
- issue: Lời xưng “tôi” là tự truyện, đại diện hay mang ý nghĩa lịch sử cứu chuộc
  choice: Giữ nguyên ngôi thứ nhất đơn giản, không diễn giải thêm.
  alternative: Giải thích rõ đây là kinh nghiệm riêng của Phao-lô, hoặc lời đại diện cho Israel hay nhân loại dưới luật pháp.
  rationale: Riêng câu Hy Lạp này không quyết định dứt khoát vấn đề giải nghĩa rộng hơn, nên bản dịch bảo tồn sự mơ hồ.
- issue: ἀνέζησεν hàm ý tội lỗi bắt đầu sống hay sống lại
  choice: Dùng “sống dậy” trong câu chính.
  alternative: “lại sống” hoặc “hồi sinh”.
  rationale: “Sống dậy” tự nhiên và giữ được hình ảnh nhân cách hóa, nhưng không loại bỏ sắc thái tái hiện; chú thích nêu phương án rõ hơn.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Giữ dấu chấm phẩy và dấu phẩy cuối câu theo cấu trúc câu liên tục của Rô-ma 7:9–10; không thêm từ nối tương đương “nay” vì nguyên văn không có.
