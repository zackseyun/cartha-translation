revisions:
- from: Vậy, điều tốt lành đã trở thành sự chết cho tôi sao? Hoàn toàn không! Trái lại, chính tội lỗi đã dùng điều tốt lành mà gây ra sự chết trong tôi, để nó được bày tỏ là tội lỗi[a], và để qua điều răn, tội lỗi trở nên tội lỗi đến tột độ[b].
  to: Vậy, điều tốt lành đã trở thành sự chết cho tôi sao? Hoàn toàn không! Trái lại, chính tội lỗi đã qua điều tốt lành gây ra sự chết cho tôi, để tội lỗi lộ ra là tội lỗi[a], và để, qua điều răn, tội lỗi trở nên tội lỗi đến tột độ[b].
  rationale: Sửa “trong tôi” thành “cho tôi” để phản ánh μοι chính xác hơn. Lặp lại “tội lỗi” thay cho “nó” để loại mơ hồ và duy trì phép lặp của câu Hy Lạp. Đặt “qua điều răn” trong mệnh đề thứ hai với dấu phẩy để người đọc thấy rõ đây là phương tiện của mệnh đề ấy; không thay đổi quan hệ mục đích của hai mệnh đề ἵνα.
