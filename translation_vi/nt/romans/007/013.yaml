  source_fidelity: 'Bản dịch giữ đúng lập luận đối lập: điều tốt lành không phải là sự chết, nhưng tội lỗi hành động qua điều tốt lành. Tuy nhiên, μοι trong μοι κατεργαζομένη θάνατον là cách chỉ người chịu tác động/lợi-hại; “gây ra sự chết cho tôi” sát hơn “gây ra sự chết trong tôi.”'
  naturalness: Văn phong nhìn chung tự nhiên, trang trọng. Thay đại từ “nó” bằng việc lặp “tội lỗi” tránh mơ hồ quy chiếu và bảo tồn lối lặp nhấn mạnh của nguyên văn.
  terminology: “Điều tốt lành,” “sự chết,” “tội lỗi,” và “điều răn” phù hợp văn mạch Rô-ma 7. “Tội lỗi đến tột độ” bảo toàn cấu trúc nhấn mạnh καθ’ ὑπερβολὴν ἁμαρτωλός mà vẫn tự nhiên trong tiếng Việt hiện đại.
  issues:
