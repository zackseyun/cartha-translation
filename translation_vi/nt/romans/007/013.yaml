id: ROM.7.13
reference: Romans 7:13
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Τὸ οὖν ἀγαθὸν ἐμοὶ ⸀ἐγένετο θάνατος; μὴ γένοιτο· ἀλλὰ ἡ ἁμαρτία, ἵνα φανῇ ἁμαρτία διὰ τοῦ ἀγαθοῦ μοι κατεργαζομένη θάνατον· ἵνα γένηται καθ’ ὑπερβολὴν ἁμαρτωλὸς ἡ ἁμαρτία διὰ τῆς ἐντολῆς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/013.yaml
  text: So then[a], did what is good become death to me? May it never be! Rather, it was sin, so that it might be shown to be sin by producing death in me through what is good[b], in order that through the commandment sin might become exceedingly sinful.
translation:
  language: vi
  text: Vậy, điều tốt lành đã trở thành sự chết cho tôi sao? Hoàn toàn không! Trái lại, chính tội lỗi đã qua điều tốt lành gây ra sự chết cho tôi, để tội lỗi lộ ra là tội lỗi[a], và để, qua điều răn, tội lỗi trở nên tội lỗi đến tột độ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “để tội lỗi được bày tỏ là tội lỗi.”'
    reason: lexical_alternative
  - marker: b
    text: 'Hay: “để, qua điều răn, tội lỗi trở nên tội lỗi vượt quá mọi mức độ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τὸ ... ἀγαθὸν
  choice: điều tốt lành
  rationale: Tính từ trung tính được dùng như danh từ; cách dịch này tự nhiên trong tiếng Việt và giữ được ý chỉ điều vốn là tốt.
- source_word: ἐμοὶ ἐγένετο θάνατος
  choice: đã trở thành sự chết cho tôi
  rationale: Giữ cấu trúc vị ngữ của γίνομαι và sắc thái quy chiếu cá nhân của đại từ ở cách dữ liệu.
- source_word: μὴ γένοιτο
  choice: Hoàn toàn không!
  rationale: Diễn đạt lời bác bỏ mạnh mẽ, dứt khoát của Phao-lô bằng tiếng Việt hiện đại, trang trọng.
- source_word: ἡ ἁμαρτία
  choice: chính tội lỗi
  rationale: 'Từ “chính” làm rõ thế tương phản sau lời bác bỏ: tác nhân gây chết là tội lỗi, không phải điều tốt lành; đồng thời vẫn giữ sự nhân cách hóa của danh từ.'
- source_word: ἵνα φανῇ ἁμαρτία
  choice: để nó được bày tỏ là tội lỗi
  rationale: Giữ mệnh đề mục đích và lực vị ngữ của lần xuất hiện thứ hai của ἁμαρτία, không giải thích vượt quá nguyên văn.
- source_word: διὰ τοῦ ἀγαθοῦ
  choice: dùng điều tốt lành
  rationale: Diễn đạt nghĩa phương tiện của διά một cách tự nhiên, đồng thời lặp lại cách gọi ở đầu câu.
- source_word: μοι κατεργαζομένη θάνατον
  choice: gây ra sự chết trong tôi
  rationale: κατεργάζομαι chỉ việc tạo nên một kết quả; “trong tôi” thể hiện tự nhiên đối tượng chịu tác động trong ngữ cảnh.
- source_word: διὰ τῆς ἐντολῆς
  choice: qua điều răn
  rationale: Giữ nghĩa phương tiện của διά và thuật ngữ ἐντολή trong lập luận về luật pháp.
- source_word: καθ’ ὑπερβολὴν ἁμαρτωλὸς
  choice: tội lỗi đến tột độ
  rationale: Tái hiện phép nhấn mạnh mạnh của thành ngữ Hy Lạp bằng một cách nói tự nhiên, dễ hiểu trong tiếng Việt.
theological_decisions:
- issue: Trách nhiệm về sự chết và sự tốt lành của điều răn
  choice: Câu dịch phủ nhận rằng điều tốt lành tự nó trở thành sự chết và quy hành động gây chết cho tội lỗi, vốn lợi dụng điều tốt lành.
  alternative: Diễn đạt lỏng hơn có thể khiến người đọc hiểu rằng chính điều răn tốt lành là tác nhân có lỗi gây ra sự chết.
  rationale: Thế tương phản giữa μὴ γένοιτο và ἀλλὰ ἡ ἁμαρτία đặt trách nhiệm lên tội lỗi. Bản dịch giữ nguyên cấu trúc tác nhân ấy mà không xóa bỏ sự căng thẳng rằng tội lỗi hành động qua điều răn tốt lành.
- issue: Hai mệnh đề ἵνα
  choice: 'Giữ cả hai mệnh đề như những mục đích: tội lỗi bị phơi bày đúng bản chất và trở nên tội lỗi đến tột độ qua điều răn.'
  alternative: 'Có thể hiểu một hoặc cả hai mệnh đề theo sắc thái kết quả: “đến nỗi”.'
  rationale: ἵνα thường giới thiệu mục đích nhưng trong văn cảnh cũng có thể hàm ý kết quả. “Để” bảo toàn hình thức lập luận của nguyên văn mà không giải quyết dứt khoát quan hệ mục đích–kết quả.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Câu được điều chỉnh nhẹ về trật tự để làm rõ chủ thể “tội lỗi” trong tiếng Việt, nhưng vẫn giữ hai mệnh đề mục đích, sự lặp từ có chủ ý và thế tương phản thần học của nguyên văn.
