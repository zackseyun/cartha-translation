    issue: “trong tôi” cho μοι
    rationale: Nguyên văn dùng μοι, không dùng ἐν ἐμοί. Cách dịch “cho tôi” giữ sát cách dữ liệu chỉ người mà tội lỗi gây sự chết cho; “trong tôi” thêm một sắc thái nội tại không được nêu rõ trong câu này.
  - severity: low
    issue: Đại từ “nó” trong “để nó được bày tỏ là tội lỗi”
    rationale: Dù có thể hiểu là “tội lỗi,” đại từ này có thể gây mơ hồ với “điều tốt lành” hoặc “sự chết” trong câu tiếng Việt. Lặp lại “tội lỗi” vừa rõ nghĩa vừa phản ánh sự lặp có chủ ý của ἁμαρτία.
