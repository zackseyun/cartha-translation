  terminology: “Không hiểu,” “muốn,” “thực hành,” “ghét,” và “làm” đều phù hợp ngữ cảnh, trang trọng vừa phải và dễ hiểu. Cách dùng “lại” ở vế cuối truyền đạt tốt sắc thái tương phản/nhấn mạnh của τοῦτο mà không khiến câu nặng nề.
