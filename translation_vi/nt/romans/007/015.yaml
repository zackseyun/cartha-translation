id: ROM.7.15
reference: Romans 7:15
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὃ γὰρ κατεργάζομαι οὐ γινώσκω· οὐ γὰρ ὃ θέλω τοῦτο πράσσω, ἀλλ’ ὃ μισῶ τοῦτο ποιῶ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/015.yaml
  text: For I do not understand what I am doing, because I do not practice what I want; instead, I do the very thing I hate.
translation:
  language: vi
  text: 'Vì tôi không hiểu điều mình đang làm: điều tôi muốn thì tôi không thực hành, nhưng điều tôi ghét thì tôi lại làm.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατεργάζομαι
  choice: đang làm
  rationale: Diễn đạt tự nhiên hành động mà người nói thực hiện; trong ngữ cảnh này không cần đưa sắc thái kết quả của động từ vào bản văn.
- source_word: οὐ γινώσκω
  choice: không hiểu
  rationale: Trong ngữ cảnh tự nhận thức về hành vi, γινώσκω mang nghĩa không hiểu hoặc không nhận ra ý nghĩa của điều mình làm, hơn là đơn thuần không biết sự việc.
- source_word: θέλω
  choice: muốn
  rationale: Giữ trực tiếp ý chí hoặc mong muốn của người nói mà không bổ sung đánh giá đạo đức.
- source_word: πράσσω
  choice: thực hành
  rationale: Phân biệt phần nào với ποιῶ ở vế sau và diễn tả điều người nói muốn làm như một nếp hành động.
- source_word: μισῶ
  choice: ghét
  rationale: Tương ứng trực tiếp với sắc thái mạnh của μισέω.
- source_word: ποιῶ
  choice: làm
  rationale: Cách diễn đạt tiếng Việt tự nhiên cho hành động thực tế, đồng thời giữ sự đối lập với điều người nói muốn.
theological_decisions:
- issue: Danh tính hoặc tình trạng thuộc linh của người nói ở ngôi thứ nhất
  choice: Không xác định trong câu dịch
  alternative: Diễn giải rõ đây là kinh nghiệm trước hoặc sau khi tin
  rationale: Câu Hy Lạp không tự giải quyết tranh luận thần học này; bản dịch giữ nguyên căng thẳng của lời tự thuật.
- issue: Quan hệ của γάρ thứ hai với lời mở đầu
  choice: Dùng dấu hai chấm để thể hiện phần giải thích
  alternative: Dịch γάρ là “vì/bởi vì” lần thứ hai
  rationale: γάρ thứ hai đưa ra lý do hoặc sự giải thích cho việc “không hiểu”; dấu hai chấm truyền đạt quan hệ đó tự nhiên, tránh lặp “vì” nhưng không biến nó thành quan hệ khác.
- issue: Sắc thái nhấn mạnh của τοῦτο
  choice: Thể hiện bằng cấu trúc đối xứng và từ “lại” ở vế cuối
  alternative: Dịch rõ “chính điều ấy”
  rationale: Tiếng Việt tự nhiên có thể truyền sự tương phản nhấn mạnh qua cấu trúc “điều... thì...” và “thì tôi lại làm”, không cần lặp một cụm nặng nề.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Giữ cấu trúc đối lập giữa ý muốn và hành động, không thêm lời giải thích về bản chất của cái tôi hoặc luật pháp.
