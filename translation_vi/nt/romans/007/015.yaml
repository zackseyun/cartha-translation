  source_fidelity: 'Bản dịch truyền đạt đúng cấu trúc và ý nghĩa của câu Hy Lạp: người nói không hiểu điều mình làm, vì không thực hành điều mình muốn nhưng lại làm điều mình ghét. Cặp πράσσω/ποιῶ được phản ánh bằng “thực hành/làm” mà không gán thêm ý nghĩa thần học.'
