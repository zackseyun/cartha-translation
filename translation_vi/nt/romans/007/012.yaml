id: ROM.7.12
reference: Romans 7:12
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὥστε ὁ μὲν νόμος ἅγιος, καὶ ἡ ἐντολὴ ἁγία καὶ δικαία καὶ ἀγαθή.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/012.yaml
  text: So then, the law is holy, and the commandment is holy and righteous and good.
translation:
  language: vi
  text: Vậy, luật pháp là thánh, và điều răn là thánh, công chính và tốt lành.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὥστε
  choice: Vậy
  rationale: Diễn tả kết luận được rút ra từ lập luận trước đó, tự nhiên và rõ ràng trong tiếng Việt.
- source_word: νόμος
  choice: luật pháp
  rationale: Giữ cách nói khái quát của Phao-lô; trong ngữ cảnh có thể chỉ luật Môi-se nhưng câu này không cần diễn giải thêm.
- source_word: ἅγιος
  choice: thánh
  rationale: Truyền đạt cả tính biệt riêng cho Đức Chúa Trời lẫn sự thanh sạch về đạo đức, đồng thời giữ sự lặp lại của nguyên văn.
- source_word: ἐντολή
  choice: điều răn
  rationale: Chỉ một mệnh lệnh cụ thể thuộc luật pháp và phù hợp với văn phong Kinh Thánh hiện đại.
- source_word: δικαία
  choice: công chính
  rationale: Phản ánh sự đánh giá về phẩm chất đúng đắn về mặt đạo đức của điều răn và giữ liên hệ với từ vựng thần học của Phao-lô.
- source_word: ἀγαθή
  choice: tốt lành
  rationale: Diễn đạt phẩm chất thiện hảo, đồng thời có thể bao hàm tính hữu ích mà không thêm lời giải thích.
- source_word: μὲν
  choice: không dịch riêng
  rationale: Tiểu từ tạo nhấn nhẹ; do không có vế đối lập với δέ trong câu, tiếng Việt tự nhiên không cần biểu đạt bằng một từ riêng.
theological_decisions:
- issue: Phạm vi nghĩa của νόμος
  choice: Không viết hoa và không thêm “Môi-se”
  alternative: Luật pháp Môi-se
  rationale: Ngữ cảnh hướng đến luật Môi-se, nhưng bản dịch giữ nguyên mức độ xác định của câu Hy Lạp, tránh diễn giải quá mức.
- issue: Sắc thái của δικαία
  choice: công chính
  alternative: đúng đắn; công bằng
  rationale: “Công chính” giữ sắc thái đạo đức và sự liên tục với cách dùng từ của Phao-lô, nhưng không biến điều răn thành một chủ thể được xưng công chính.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Giữ cấu trúc song song cùng sự lặp lại từ “thánh” của nguyên văn.
