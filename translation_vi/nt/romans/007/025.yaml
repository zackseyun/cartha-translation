  to: Tạ ơn Đức Chúa Trời, nhờ Đức Giê-su, Đấng Mê-si-a, là Chúa chúng ta! Vậy thì, chính tôi lấy tâm trí phục vụ luật của Đức Chúa Trời, nhưng lấy xác thịt phục vụ luật của tội lỗi.[a][b]
