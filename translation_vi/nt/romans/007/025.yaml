language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸀χάρις τῷ θεῷ διὰ Ἰησοῦ Χριστοῦ τοῦ κυρίου ἡμῶν. Ἄρα οὖν αὐτὸς ἐγὼ τῷ μὲν νοῒ δουλεύω νόμῳ θεοῦ, τῇ δὲ σαρκὶ νόμῳ ἁμαρτίας.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/025.yaml
  text: Thanks be to God through Jesus the Messiah our Lord! So then[a], I myself serve the law of God with my mind[c][b], but with my flesh the law of sin.
translation:
  language: vi
  text: Tạ ơn Đức Chúa Trời, nhờ Đức Giê-su, Đấng Mê-si-a, là Chúa chúng ta! Vậy thì, chính tôi lấy tâm trí phục vụ luật của Đức Chúa Trời, nhưng lấy xác thịt phục vụ luật của tội lỗi.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Xác thịt” cũng có thể được diễn giải là “bản tính tội lỗi”; tuy nhiên, nguyên văn dùng từ “xác thịt”.
    reason: lexical_alternative
  - marker: b
    text: “Luật của tội lỗi” cũng có thể hiểu là “nguyên lý của tội lỗi”.
    reason: alternative_reading
lexical_decisions:
- source_word: χάρις τῷ θεῷ
  choice: Tạ ơn Đức Chúa Trời
  rationale: Trong cấu trúc cảm thán với tặng cách, χάρις diễn đạt lời cảm tạ; cách dịch này tự nhiên và trang trọng trong tiếng Việt.
- source_word: διὰ Ἰησοῦ Χριστοῦ τοῦ κυρίου ἡμῶν
  choice: nhờ Đức Giê-su, Đấng Mê-si-a, Chúa chúng ta
  rationale: διά với sở hữu cách chỉ trung gian, được diễn đạt tự nhiên bằng “nhờ”. Χριστός được giữ như tước hiệu “Đấng Mê-si-a”, còn κύριος là “Chúa”.
- source_word: Ἄρα οὖν
  choice: Vậy thì
  rationale: Cặp tiểu từ mang ý suy kết và tổng kết; “Vậy thì” giữ được cả chức năng chuyển tiếp lẫn kết luận.
- source_word: αὐτὸς ἐγώ
  choice: chính tôi
  rationale: Giữ sắc thái nhấn mạnh vào bản thân người nói mà không thêm ý “tự sức mình” vốn không được nói rõ trong nguyên văn.
- source_word: τῷ μὲν νοῒ ... τῇ δὲ σαρκὶ
  choice: lấy tâm trí ... nhưng lấy xác thịt
  rationale: Cách diễn đạt bằng “lấy” thể hiện phương diện hay năng lực mà người nói dùng để phục vụ, đồng thời bảo toàn thế đối lập giữa νοῦς và σάρξ.
- source_word: δουλεύω
  choice: phục vụ
  rationale: Động từ mang sắc thái phục dịch hoặc làm nô lệ; “phục vụ” phù hợp với cấu trúc song hành và dễ hiểu, dù sắc thái lệ thuộc mạnh hơn vẫn hiện diện trong tiếng Hy Lạp.
- source_word: νόμῳ θεοῦ
  choice: luật pháp của Đức Chúa Trời
  rationale: Giữ νόμος là “luật pháp” trong mạch lập luận Rô-ma 7 và xác định rõ luật ấy thuộc về Đức Chúa Trời.
- source_word: σαρκὶ
  choice: xác thịt
  rationale: Giữ hình ảnh và sự căng thẳng nhân học của Phao-lô, thay vì diễn giải trực tiếp thành “bản tính tội lỗi”.
- source_word: νόμῳ ἁμαρτίας
  choice: luật của tội lỗi
  rationale: Giữ sự lặp lại νόμος và thế song hành với “luật pháp của Đức Chúa Trời”; không diễn giải νόμος thành “nguyên lý” ngay trong chính văn.
theological_decisions:
- issue: Ý nghĩa của σάρξ trong văn cảnh mang tính đạo đức
  choice: xác thịt
  alternative: bản tính tội lỗi
  rationale: Nguyên văn dùng σάρξ chứ không dùng một thuật ngữ nói rõ “bản tính tội lỗi”. “Xác thịt” bảo toàn sự căng thẳng thần học và tránh áp đặt một hệ thống nhân học cụ thể.
- issue: Tước hiệu Χριστός
  choice: Đấng Mê-si-a
  alternative: Đấng Christ
  rationale: 'Dịch ý nghĩa tước hiệu thay vì chỉ phiên âm, đồng thời đặt trong cấu trúc tiếng Việt tự nhiên: “Đức Giê-su, Đấng Mê-si-a”.'
- issue: νόμος trong cụm νόμῳ ἁμαρτίας
  choice: luật của tội lỗi
  alternative: nguyên lý của tội lỗi
  rationale: “Luật” giữ phép đối xứng có chủ ý với luật pháp của Đức Chúa Trời, dù trong ngữ cảnh từ này cũng có thể được hiểu theo nghĩa một nguyên lý chi phối.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Giữ nhịp cảm thán ở mệnh đề đầu, thế tương phản cân xứng ở mệnh đề sau, cùng các thuật ngữ “tâm trí”, “xác thịt” và “luật” để bảo toàn lập luận của nguyên văn.
