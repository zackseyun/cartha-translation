  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀφορμὴν δὲ λαβοῦσα ἡ ἁμαρτία διὰ τῆς ἐντολῆς κατειργάσατο ἐν ἐμοὶ πᾶσαν ἐπιθυμίαν, χωρὶς γὰρ νόμου ἁμαρτία νεκρά.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/008.yaml
  text: But sin[a], seizing an opportunity through the commandment, produced in me every kind of coveting. For apart from the law[b], sin is dead.
translation:
  language: vi
  text: Nhưng tội lỗi đã lợi dụng điều răn làm cơ hội[a], gây ra trong tôi mọi sự tham muốn[b]; vì không có luật pháp thì tội lỗi chết.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “nắm lấy cơ hội qua điều răn.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “mọi ham muốn”; trong văn cảnh này, từ này mang nghĩa cụ thể là sự tham muốn điều không thuộc về mình.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀφορμὴν ... λαβοῦσα
  choice: đã nhân ... làm cơ hội
  rationale: Cụm này diễn tả tội lỗi chủ động nắm lấy điều răn như một dịp thuận lợi. Cách nói này tự nhiên trong tiếng Việt và giữ được nét nhân cách hóa.
- source_word: ἡ ἁμαρτία
  choice: tội lỗi
  rationale: Giữ tội lỗi làm chủ thể hành động như trong tiếng Hy Lạp, không làm nhẹ đi phép nhân cách hóa của Phao-lô.
- source_word: διὰ τῆς ἐντολῆς
  choice: nhân điều răn
  rationale: Giữ số ít của ἐντολή, hướng về điều răn vừa được trích dẫn trong văn cảnh, đồng thời diễn đạt điều răn là phương tiện mà tội lỗi lợi dụng.
- source_word: κατειργάσατο
  choice: gây ra
  rationale: Động từ chỉ việc tạo nên hoặc làm phát sinh một kết quả; “gây ra” rõ ràng và tự nhiên trong tiếng Việt hiện đại.
- source_word: πᾶσαν ἐπιθυμίαν
  choice: đủ mọi thứ tham muốn
  rationale: “Tham muốn” phù hợp với điều răn cấm tham muốn trong văn cảnh; “đủ mọi thứ” truyền đạt sắc thái bao quát của πᾶσαν một cách tự nhiên.
- source_word: χωρὶς ... νόμου
  choice: khi không có luật pháp
  rationale: Diễn đạt tự nhiên ý “ngoài/không có luật pháp” mà không xác định quá mức luật pháp đang được nói đến theo phương diện nào.
- source_word: νεκρά
  choice: là chết
  rationale: Giữ nguyên hình ảnh mạnh “chết” thay vì giải thích thành “không hoạt động,” dù cách diễn đạt này cố ý mang sắc thái nghịch lý.
theological_decisions:
- issue: Có nên làm nhẹ phép nhân cách hóa tội lỗi hoặc giải nghĩa hình ảnh “chết” hay không
  choice: Giữ tội lỗi là chủ thể hành động và giữ nguyên từ “chết.”
  alternative: Diễn đạt tội lỗi như một khái niệm trừu tượng hoặc dịch “chết” thành “không hoạt động.”
  rationale: Bản Hy Lạp trình bày tội lỗi như một quyền lực hành động và dùng một ẩn dụ mạnh. Bản dịch giữ nguyên sự căng thẳng thần học ấy thay vì giải quyết bằng cách diễn giải.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cấu trúc “nhân điều răn làm cơ hội” giữ hình ảnh tội lỗi lợi dụng điều răn; cụm “tội lỗi là chết” cố ý giữ ẩn dụ nghịch lý của nguyên văn.
