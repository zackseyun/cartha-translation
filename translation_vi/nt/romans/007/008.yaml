review_pass:
  verdict: revise
  source_fidelity: 'Bản nháp truyền đạt đúng các yếu tố chính: tội lỗi được nhân cách hóa, lợi dụng điều răn làm dịp thuận tiện, gây nên sự tham muốn, và được mô tả là «chết» khi không có luật pháp. Tuy nhiên, «đủ mọi thứ tham muốn» không tự nhiên và làm mờ cấu trúc «mọi sự tham muốn» của πᾶσαν ἐπιθυμίαν. «là chết» cũng không phải cách nói vị ngữ tự nhiên trong tiếng Việt hiện đại.'
  naturalness: «Tội lỗi đã lợi dụng điều răn làm cơ hội» là cách diễn đạt tự nhiên hơn «nhân điều răn làm cơ hội», đồng thời vẫn giữ ý điều răn là phương tiện/dịp mà tội lỗi khai thác. «Mọi sự tham muốn» là cụm trang trọng, rõ nghĩa và phù hợp văn phong thư tín.
  terminology: Giữ «tội lỗi», «điều răn», «luật pháp», và «tham muốn» là nhất quán với văn cảnh trực tiếp về điều răn cấm tham muốn. «Tội lỗi chết» giữ nguyên ẩn dụ mạnh của νεκρά mà không diễn giải thành «không hoạt động».
  issues:
  - severity: medium
    issue: Cụm «đủ mọi thứ tham muốn» thiếu tự nhiên.
    rationale: Trong tiếng Việt, «mọi sự tham muốn» diễn đạt trực tiếp và tự nhiên hơn ý πᾶσαν ἐπιθυμίαν, không biến danh từ trừu tượng thành một tập hợp «thứ».
  - severity: low
    issue: Cụm «tội lỗi là chết» không tự nhiên.
    rationale: Tiếng Việt thường dùng vị ngữ trực tiếp «tội lỗi chết» cho hình ảnh trạng thái trong nguyên văn; thêm «là» khiến câu gượng mà không tăng độ chính xác.
  - severity: low
    issue: «nhân điều răn làm cơ hội» hơi nặng tính thành ngữ và có thể khó hiểu.
    rationale: «lợi dụng điều răn làm cơ hội» làm rõ quan hệ công cụ của διὰ τῆς ἐντολῆς và sắc thái khai thác của ἀφορμήν λαβοῦσα, không thêm diễn giải thần học.
