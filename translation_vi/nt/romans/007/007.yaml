id: ROM.7.7
reference: Romans 7:7
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Τί οὖν ἐροῦμεν; ὁ νόμος ἁμαρτία; μὴ γένοιτο· ἀλλὰ τὴν ἁμαρτίαν οὐκ ἔγνων εἰ μὴ διὰ νόμου, τήν τε γὰρ ἐπιθυμίαν οὐκ ᾔδειν εἰ μὴ ὁ νόμος ἔλεγεν· Οὐκ ἐπιθυμήσεις·
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/007.yaml
  text: What then shall we say? Is the law sin? May it never be! On the contrary[a], I would not have known sin except through the law. For I would not have known coveting if the law had not said, "You shall not covet."
translation:
  language: vi
  text: 'Vậy, chúng ta sẽ nói gì? Luật pháp là tội lỗi sao? Tuyệt đối không! Trái lại, nếu không nhờ luật pháp, tôi hẳn đã không biết tội lỗi. Vì tôi hẳn đã không biết sự tham muốn[a] nếu luật pháp không nói: “Ngươi chớ tham muốn.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “ham muốn.” Tuy nhiên, vì ngay sau đó Phao-lô trích điều răn “Ngươi chớ tham muốn,” bản dịch dùng nghĩa cụ thể hơn là “sự tham muốn.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί οὖν ἐροῦμεν
  choice: Vậy, chúng ta sẽ nói gì?
  rationale: Giữ công thức chuyển ý mang tính tu từ của Phao-lô, đồng thời diễn đạt tự nhiên trong tiếng Việt hiện đại.
- source_word: ὁ νόμος
  choice: luật pháp
  rationale: Dạng xác định trong ngữ cảnh chỉ luật pháp Môi-se; “luật pháp” là cách gọi quen thuộc, trang trọng và rõ nghĩa.
- source_word: ἁμαρτία
  choice: tội lỗi
  rationale: Giữ danh từ vị ngữ của tiếng Hy Lạp, qua đó bảo toàn câu hỏi sắc bén về việc đồng nhất luật pháp với tội lỗi, thay vì làm nhẹ thành “có tội”.
- source_word: μὴ γένοιτο
  choice: Tuyệt đối không!
  rationale: Truyền đạt lời bác bỏ mạnh mẽ của thành ngữ Hy Lạp bằng tiếng Việt tự nhiên.
- source_word: ἀλλὰ
  choice: Trái lại
  rationale: Thể hiện sự tương phản và điều chỉnh mạnh sau lời bác bỏ.
- source_word: τὴν ἁμαρτίαν οὐκ ἔγνων εἰ μὴ διὰ νόμου
  choice: nếu không nhờ luật pháp, tôi đã không biết tội lỗi
  rationale: Cấu trúc điều kiện phản thực diễn đạt tự nhiên bằng “nếu không… đã không”; “nhờ” biểu thị phương tiện διὰ mà không ngụ ý luật pháp gây ra tội lỗi.
- source_word: ἐπιθυμίαν
  choice: lòng tham muốn
  rationale: Câu trích dẫn ngay sau đó hướng nghĩa rộng “ham muốn” đến sự tham muốn bị điều răn cấm; “lòng tham muốn” tự nhiên hơn danh từ trừu tượng đơn lẻ trong tiếng Việt.
- source_word: οὐκ ᾔδειν
  choice: tôi đã không biết
  rationale: Duy trì sự song song với mệnh đề trước, dù nguyên văn dùng một động từ Hy Lạp khác, và tránh diễn giải quá mức thành “hiểu” hay “nhận thức”.
- source_word: Οὐκ ἐπιθυμήσεις
  choice: Ngươi chớ tham muốn
  rationale: Giữ hình thức điều răn trực tiếp và sắc thái trang trọng của lời trích dẫn; “chớ” truyền đạt rõ lực cấm đoán.
theological_decisions:
- issue: Mối quan hệ giữa luật pháp và tội lỗi
  choice: Luật pháp là tội lỗi sao? Tuyệt đối không!
  alternative: Luật pháp có tội sao?
  rationale: Danh từ vị ngữ ἁμαρτία đặt vấn đề luật pháp có phải chính là tội lỗi hay không, chứ không chỉ hỏi luật pháp có tính tội lỗi; bản dịch giữ nguyên độ căng thần học của câu hỏi.
- issue: Vai trò của luật pháp trong việc biết tội lỗi
  choice: nếu không nhờ luật pháp, tôi đã không biết tội lỗi
  alternative: tôi chỉ biết tội lỗi qua luật pháp
  rationale: Cách chọn giữ cấu trúc phản thực và trình bày luật pháp như phương tiện làm cho người nói biết tội lỗi, không biến luật pháp thành nguồn gây ra tội lỗi.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “chúng ta” trong câu hỏi tu từ, “tôi” trong lời tự thuật, và giữ “Ngươi chớ…” để phân biệt lời trích dẫn điều răn với văn kể thông thường.
