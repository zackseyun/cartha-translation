id: ROM.7.23
reference: Romans 7:23
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: βλέπω δὲ ἕτερον νόμον ἐν τοῖς μέλεσίν μου ἀντιστρατευόμενον τῷ νόμῳ τοῦ νοός μου καὶ αἰχμαλωτίζοντά με ⸀ἐν τῷ νόμῳ τῆς ἁμαρτίας τῷ ὄντι ἐν τοῖς μέλεσίν μου.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/023.yaml
  text: But I see another law in my members[b][a], waging war against the law of my mind and taking me captive to the law of sin that is in my members.
translation:
  language: vi
  text: Nhưng tôi thấy một luật[a] khác trong các phần thân thể tôi, đang giao chiến chống lại luật của tâm trí tôi và bắt tôi làm tù binh cho luật của tội lỗi[b], tức luật ở trong các phần thân thể tôi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hy Lạp được dịch là “luật” ở những chỗ lặp lại trong câu này cũng có thể được hiểu theo nghĩa “nguyên tắc” hoặc “quyền lực”.
    reason: lexical_alternative
  - marker: b
    text: 'Sát chữ: “bắt tôi làm tù binh trong luật của tội lỗi”; cách dịch “cho luật của tội lỗi” diễn đạt tự nhiên hơn ý bị đặt dưới quyền chi phối của luật ấy.'
    reason: lexical_alternative
lexical_decisions:
- source_word: βλέπω
  choice: tôi thấy
  rationale: Giữ thì hiện tại và sắc thái nhận biết trực tiếp, sống động trong lời tự thuật của Phao-lô.
- source_word: ἕτερον νόμον
  choice: một luật khác
  rationale: Diễn đạt tự nhiên sự tương phản với “luật” vừa được nhắc đến, mà không giải thích quá mức.
- source_word: νόμον / νόμῳ (lặp lại)
  choice: luật
  rationale: Giữ nguyên sự lặp từ có chủ ý và sức căng trong lập luận, thay vì diễn giải thành “nguyên tắc” hay “quyền lực” ngay trong chính văn.
- source_word: ἐν τοῖς μέλεσίν μου
  choice: trong các phần thân thể mình/tôi
  rationale: μέλη chỉ các bộ phận của thân thể. Cách dịch này giữ hình ảnh cụ thể, đồng thời dễ hiểu hơn “các chi thể” đối với độc giả hiện đại.
- source_word: ἀντιστρατευόμενον
  choice: đang giao chiến chống lại
  rationale: Bảo toàn hình ảnh quân sự và sắc thái hành động đang diễn ra.
- source_word: τῷ νόμῳ τοῦ νοός μου
  choice: luật của tâm trí tôi
  rationale: “Tâm trí” diễn đạt trực tiếp νοῦς như năng lực nhận thức và ý chí bên trong, không đồng nhất nó với toàn bộ “con người bề trong”.
- source_word: αἰχμαλωτίζοντά με
  choice: bắt tôi làm tù binh
  rationale: Giữ mạnh hình ảnh chiến tranh và sự khuất phục trong động từ Hy Lạp.
- source_word: ἐν τῷ νόμῳ τῆς ἁμαρτίας
  choice: cho luật của tội lỗi
  rationale: Trong tiếng Việt, “bắt làm tù binh cho” diễn đạt tự nhiên kết quả bị đặt dưới quyền chi phối; chú thích bảo lưu cấu trúc sát chữ với ἐν.
- source_word: ἁμαρτίας
  choice: tội lỗi
  rationale: Cách dịch thông dụng, rõ nghĩa của ἁμαρτία trong văn cảnh này.
theological_decisions:
- issue: Nên dịch νόμος là “luật” hay diễn giải thành “nguyên tắc/quyền lực”.
  choice: Giữ “luật” ở tất cả các lần xuất hiện.
  alternative: Dịch một hay nhiều lần là “nguyên tắc” hoặc “quyền lực”.
  rationale: Việc lặp lại νόμος tạo nên sức căng có chủ ý giữa luật của tâm trí và luật của tội lỗi. Giữ cùng một từ tránh áp đặt trước một cách giải thích thần học.
- issue: Phạm vi ý nghĩa của μέλη.
  choice: Dịch là “các phần thân thể”.
  alternative: “Các chi thể”, “các chi” hoặc khái quát thành “thân thể”.
  rationale: Cách chọn giữ chiều kích thân thể cụ thể mà không biến câu thành một khẳng định rằng thân thể tự nó đồng nhất với tội lỗi.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “các phần thân thể” thay cho “các chi thể” để tránh sắc thái cổ hoặc thuật ngữ hội thánh, nhưng vẫn giữ hình ảnh thân thể. Hình ảnh quân sự được duy trì nhất quán qua “giao chiến” và “làm tù binh”.
