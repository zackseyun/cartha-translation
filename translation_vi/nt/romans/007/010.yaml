  to: Còn tôi thì đã chết; và điều răn vốn hướng đến sự sống ấy lại hóa ra là điều dẫn đến sự chết cho tôi.
  rationale: Giữ nguyên nghĩa quá khứ của ἀπέθανον, thuật ngữ "điều răn," và tương phản sự sống/sự chết; chỉ thay cách nối vế cuối để tiếng Việt tự nhiên hơn và phản ánh chính xác hơn kết quả được nhận ra trong εὑρέθη μοι.
