source:
  edition: SBLGNT
  text: ἐγὼ δὲ ἀπέθανον, καὶ εὑρέθη μοι ἡ ἐντολὴ ἡ εἰς ζωὴν αὕτη εἰς θάνατον·
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/010.yaml
  text: and I died[b][a], and the commandment that was for life proved to be for death to me.
translation:
  language: vi
  text: Còn tôi thì đã chết; và điều răn vốn hướng đến sự sống ấy lại hóa ra là điều dẫn đến sự chết cho tôi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπέθανον
  choice: đã chết
  rationale: Động từ aorist chủ động, ngôi thứ nhất số ít, được diễn đạt như một sự việc trong quá khứ, không biến nó thành một tiến trình hay trạng thái kéo dài.
- source_word: εὑρέθη μοι
  choice: hóa ra ... cho tôi
  rationale: Cách nói tự nhiên trong tiếng Việt, thể hiện kết quả được nhận ra trong kinh nghiệm của người nói mà không dịch thô động thái bị động của tiếng Hy Lạp.
- source_word: ἐντολή
  choice: điều răn
  rationale: Đây là thuật ngữ quen thuộc, trang trọng và chính xác trong ngữ cảnh luật pháp của Phao-lô; không thêm cụm “của luật pháp” vốn không có trong câu.
- source_word: ἡ εἰς ζωὴν
  choice: vốn hướng đến sự sống
  rationale: Giữ ý hướng tới hoặc kết quả tiềm tại của εἰς mà không khẳng định quá mức rằng điều răn được ban với một ý định cụ thể.
- source_word: αὕτη
  choice: ấy
  rationale: Đại từ chỉ định được giữ rõ bằng “ấy”, liên kết trực tiếp với chính điều răn vừa được mô tả.
- source_word: εἰς θάνατον
  choice: hướng đến sự chết
  rationale: Lặp cấu trúc “hướng đến” để bảo toàn thế đối xứng đầy dụng ý giữa εἰς ζωὴν và εἰς θάνατον.
theological_decisions:
- issue: Có nên diễn giải điều răn là tác nhân trực tiếp “mang lại” sự chết hay không
  choice: hóa ra hướng đến sự chết cho tôi
  alternative: đem sự chết đến cho tôi
  rationale: 'Bản dịch giữ nguyên sức căng thần học trong lời Phao-lô: câu nói về kết quả được nhận ra đối với ông, nhưng không giải thích quá mức quan hệ nhân quả.'
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cặp “hướng đến sự sống / hướng đến sự chết” cố ý giữ sự song hành của nguyên văn Hy Lạp; “còn tôi thì” bảo toàn sắc thái tương phản của ἐγὼ δέ.
