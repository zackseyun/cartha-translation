id: ROM.7.14
reference: Romans 7:14
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Οἴδαμεν γὰρ ὅτι ὁ νόμος πνευματικός ἐστιν· ἐγὼ δὲ ⸀σάρκινός εἰμι, πεπραμένος ὑπὸ τὴν ἁμαρτίαν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/014.yaml
  text: For we know that the law is spiritual[a], but I am fleshly[b], sold under sin.
translation:
  language: vi
  text: Vì chúng ta biết rằng luật pháp là thuộc linh, còn tôi thì thuộc về xác thịt[a], đã bị bán làm nô lệ dưới quyền tội lỗi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “thuộc xác thịt” hoặc “bằng xác thịt.”'
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn: “đã bị bán dưới tội lỗi”; nghĩa là bị đặt dưới quyền lực của tội lỗi như một nô lệ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἴδαμεν
  choice: chúng ta biết
  rationale: Diễn đạt tự nhiên một sự hiểu biết chắc chắn mà Phao-lô xem là điều ông và độc giả cùng biết.
- source_word: ὁ νόμος
  choice: luật pháp
  rationale: Giữ cách gọi khái quát của tiếng Hy Lạp; trong văn mạch Rô-ma từ này thường chỉ luật Môi-se, nhưng không cần diễn giải thêm ngay trong câu.
- source_word: πνευματικός
  choice: thuộc linh
  rationale: Giữ sự đối lập trực tiếp với σάρκινος và diễn tả điều thuộc về hoặc phù hợp với lĩnh vực của Thần Khí mà không diễn giải quá mức thành một mệnh đề riêng.
- source_word: σάρκινός
  choice: thuộc về xác thịt
  rationale: Bảo tồn ngôn ngữ 'xác thịt' và sự đối lập với 'thuộc linh', đồng thời tránh đưa khái niệm diễn giải 'bản tính tội lỗi' vào bản văn.
- source_word: πεπραμένος
  choice: đã bị bán làm nô lệ
  rationale: Thể hoàn thành bị động chỉ tình trạng phát sinh từ việc bị bán; thêm 'làm nô lệ' làm rõ ẩn dụ mua bán người vốn có trong văn cảnh mà vẫn trung thành với ý nghĩa.
- source_word: ὑπὸ τὴν ἁμαρτίαν
  choice: dưới quyền tội lỗi
  rationale: Diễn đạt tự nhiên trong tiếng Việt ý bị đặt dưới sự thống trị của tội lỗi, đồng thời giữ hình ảnh lệ thuộc của giới từ ὑπό với đối cách.
theological_decisions:
- issue: Mức độ diễn giải ngôn ngữ 'xác thịt' của Phao-lô
  choice: Dùng 'thuộc về xác thịt' thay vì 'có bản tính tội lỗi'.
  alternative: '''xác thịt''; ''có bản tính tội lỗi''; ''không thuộc linh'''
  rationale: Lựa chọn này giữ sự căng thẳng giữa 'thuộc linh' và 'xác thịt', không đồng nhất σάρκινος với một công thức thần học về bản tính con người.
- issue: Sắc thái nô lệ trong πεπραμένος ὑπὸ τὴν ἁμαρτίαν
  choice: Dịch 'đã bị bán làm nô lệ dưới quyền tội lỗi'.
  alternative: '''đã bị bán cho tội lỗi''; ''đã bị bán dưới tội lỗi'''
  rationale: Cách dịch làm rõ ẩn dụ nô lệ và tình trạng bị tội lỗi thống trị nhưng không xác định thay bản văn ai là tác nhân bán.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng 'luật pháp', 'thuộc linh', 'xác thịt' để duy trì thuật ngữ và thế đối lập của câu; cụm 'dưới quyền tội lỗi' giúp hình ảnh lệ thuộc rõ ràng trong tiếng Việt.
