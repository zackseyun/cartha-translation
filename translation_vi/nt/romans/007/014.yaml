  terminology: Thuật ngữ được giữ nhất quán và thận trọng. «Thuộc về xác thịt» tránh diễn giải σάρκινός thành «bản tính tội lỗi»; «thuộc linh» giữ được đối lập của πνευματικός. Các chú thích đặt đúng tại «xác thịt» và cụm diễn tả tình trạng bị bán/lệ thuộc tội lỗi.
