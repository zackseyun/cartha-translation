  source_fidelity: 'Bản dịch truyền đạt đúng các yếu tố chính của câu Hy Lạp: γνώ thức chung trong «chúng ta biết», sự đối lập giữa «thuộc linh» và σάρκινός («thuộc về xác thịt»), cùng tình trạng bị động kết quả của πεπραμένος và sự lệ thuộc «dưới quyền tội lỗi». «Làm nô lệ» và «dưới quyền» là những diễn đạt làm rõ hợp lý hình ảnh bị bán và sự lệ thuộc, không thêm tác nhân đã bán hay một hệ thống giải thích thần học.'
