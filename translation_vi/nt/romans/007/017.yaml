  text: νυνὶ δὲ οὐκέτι ἐγὼ κατεργάζομαι αὐτὸ ἀλλὰ ἡ ⸀οἰκοῦσα ἐν ἐμοὶ ἁμαρτία.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/017.yaml
  text: But now I am no longer the one doing it[a], but sin dwelling in me.
translation:
  language: vi
  text: Nhưng bây giờ, không còn chính tôi là người làm điều đó, mà là tội lỗi cư ngụ trong tôi[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “Không còn tôi làm điều đó nữa, nhưng là tội lỗi cư ngụ trong tôi.”'
    reason: Cách sắp xếp sát hơn với trật tự mệnh đề Hy Lạp; chính văn dùng cấu trúc “là người” để diễn tả tự nhiên sự nhấn mạnh của ἐγώ.
lexical_decisions:
- source_word: νυνὶ δὲ
  choice: Nhưng bây giờ
  rationale: Giữ cả sắc thái tương phản của δὲ và nét chuyển tiếp mang tính thời điểm/lập luận của νυνί bằng cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: οὐκέτι ἐγὼ κατεργάζομαι αὐτὸ
  choice: không còn phải chính tôi làm điều đó
  rationale: “Không còn” chuyển tải οὐκέτι; “chính tôi” thể hiện sự nhấn mạnh của đại từ ἐγώ; “làm điều đó” diễn đạt tự nhiên hành động đã được nhắc tới mà αὐτό quy chiếu.
- source_word: κατεργάζομαι
  choice: làm
  rationale: Trong văn cảnh này, động từ chỉ việc thực hiện hành động đang được bàn đến; “làm” rõ ràng và tự nhiên hơn các cách diễn đạt nặng như “thực hiện cho trọn”.
- source_word: ἡ οἰκοῦσα ἐν ἐμοὶ ἁμαρτία
  choice: tội lỗi đang ngự trong tôi
  rationale: Giữ hình ảnh tội lỗi được nhân cách hóa như một quyền lực cư ngụ bên trong; “ngự” trang trọng và có sức nặng hơn “sống”, đồng thời vẫn dễ hiểu.
theological_decisions:
- issue: Sự phân biệt gay gắt giữa “tôi” và “tội lỗi đang ngự trong tôi” có thể bị hiểu là chối bỏ trách nhiệm.
  choice: Giữ nguyên sự phân biệt sắc nét của câu, không thêm lời giải thích vào chính văn.
  alternative: Diễn ý thành cuộc xung đột nội tâm hoặc bổ sung ngôn từ để nhấn mạnh trách nhiệm cá nhân.
  rationale: Nguyên văn chủ ý đặt “không còn phải chính tôi” đối lập với “tội lỗi đang ngự trong tôi”; bản dịch cần bảo tồn sự căng thẳng thần học ấy thay vì âm thầm giải quyết.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. “Chính tôi” giữ sự nhấn mạnh của đại từ Hy Lạp; “đang ngự” bảo tồn hình ảnh cư ngụ và sắc thái nhân cách hóa của tội lỗi.
