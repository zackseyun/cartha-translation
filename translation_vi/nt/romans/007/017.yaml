    issue: “không còn phải chính tôi làm điều đó” thêm ý bắt buộc
    rationale: Từ “phải” biểu thị nghĩa vụ/cần thiết, không có trong οὐκέτι ἐγὼ κατεργάζομαι αὐτό, và làm đổi ý câu từ phủ định tác nhân sang phủ định nghĩa vụ.
  - severity: low
    issue: “ngự” có sắc thái tôn kính không phù hợp rõ ràng
    rationale: Dù có thể nhấn mạnh sự hiện diện có quyền lực, “ngự” trong tiếng Việt thường là cách nói tôn kính; “cư ngụ” truyền đạt οἰκοῦσα chính xác hơn mà không thêm sắc thái ấy.
