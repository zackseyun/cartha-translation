  yaml_path: translation/nt/romans/007/022.yaml
  text: For I delight in the law of God in my inner man,[a]
translation:
  language: vi
  text: Vì theo con người bên trong, tôi vui thích luật pháp của Đức Chúa Trời.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “xét theo con người nội tâm” hoặc “trong con người bên trong.”
    reason: Nêu các cách dịch khả dĩ của κατὰ τὸν ἔσω ἄνθρωπον mà vẫn giữ hình ảnh “con người” và không đưa vào sắc thái tâm lý hiện đại của “bản ngã.”
lexical_decisions:
- source_word: συνήδομαι
  choice: vui thích
  rationale: Diễn đạt sự đồng tình đầy vui mừng, chứ không chỉ là sự tán thành về mặt lý trí; cách nói tự nhiên và trang trọng trong tiếng Việt.
- source_word: τῷ νόμῳ τοῦ θεοῦ
  choice: luật pháp của Đức Chúa Trời
  rationale: Giữ nghĩa mạnh và cách dùng quen thuộc của νόμος trong thư Rô-ma; kết cấu sở hữu phản ánh rõ τοῦ θεοῦ.
- source_word: κατὰ τὸν ἔσω ἄνθρωπον
  choice: theo con người bên trong
  rationale: Bám sát κατὰ và giữ nguyên hình ảnh nhân học đặc trưng của Phao-lô, đồng thời không thêm đại từ sở hữu vốn không có trực tiếp trong Hy Lạp.
theological_decisions:
- issue: Sắc thái nhân học của τὸν ἔσω ἄνθρωπον
  choice: con người bên trong
  alternative: bản ngã bên trong; con người nội tâm
  rationale: Giữ phép ẩn dụ của Phao-lô mà không áp đặt một mô hình giáo lý kỹ thuật về cấu tạo con người. Cụm từ cũng không bị diễn giải thành một khái niệm tâm lý hiện đại.
- issue: Quan hệ do κατὰ biểu thị
  choice: theo
  alternative: trong; xét về
  rationale: “Theo” phản ánh hình thức nguồn và để ngỏ sắc thái chuẩn cứ hoặc phương diện; “trong” tự nhiên hơn nhưng có thể thu hẹp nghĩa thành vị trí hay phạm vi nội tại.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “Đức Chúa Trời” nhất quán với văn phong Kinh Thánh Tin Lành tiếng Việt; giữ “con người bên trong” để bảo toàn hình ảnh nguồn và sự căng thẳng thần học.
