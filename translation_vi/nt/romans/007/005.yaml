id: ROM.7.5
reference: Romans 7:5
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὅτε γὰρ ἦμεν ἐν τῇ σαρκί, τὰ παθήματα τῶν ἁμαρτιῶν τὰ διὰ τοῦ νόμου ἐνηργεῖτο ἐν τοῖς μέλεσιν ἡμῶν εἰς τὸ καρποφορῆσαι τῷ θανάτῳ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/005.yaml
  text: For when we were in the flesh[a], the sinful passions that came through the law[c][b], were at work in our members to bear fruit for death.
translation:
  language: vi
  text: Vì khi chúng ta còn ở trong xác thịt[a], những dục vọng tội lỗi[b] do luật pháp mà có đã hoạt động trong các chi thể[c] của chúng ta, để kết trái cho sự chết.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể hiểu là “ở trong bản tính tội lỗi” hoặc “ở trong tình trạng con người sa ngã”.
    reason: alternative_reading
  - marker: b
    text: 'Sát nghĩa: “những dục vọng của các tội lỗi”.'
    reason: lexical_alternative
  - marker: c
    text: “Các chi thể” ở đây là những phần hoặc năng lực của thân thể được dùng làm công cụ hành động.
    reason: cultural_note
lexical_decisions:
- source_word: σάρξ
  choice: xác thịt
  rationale: Giữ hình ảnh và sức nặng thần học trong cách dùng của Phao-lô, thay vì giải nghĩa ngay thành “bản tính tội lỗi”; chú thích nêu nghĩa ẩn dụ có thể có.
- source_word: παθήματα τῶν ἁμαρτιῶν
  choice: những dục vọng tội lỗi
  rationale: Trong ngữ cảnh này, παθήματα chỉ những thôi thúc hay ham muốn có tính tội lỗi, không phải “sự chịu khổ”; cách dịch tính từ diễn đạt tự nhiên quan hệ sở hữu/định tính của τῶν ἁμαρτιῶν.
- source_word: διὰ τοῦ νόμου
  choice: do luật pháp mà có
  rationale: Diễn đạt tự nhiên lực phương tiện hoặc nguyên nhân của διά mà không thêm ý “bị khơi dậy”, vốn có thể đúng theo văn mạch nhưng không được nói rõ trong chính cụm từ này.
- source_word: ἐνηργεῖτο
  choice: đã hoạt động
  rationale: Thể chưa hoàn thành diễn tả hoạt động đang tiếp diễn trong quá khứ; “đã hoạt động” là cách nói tự nhiên và vẫn giữ ý những dục vọng đang phát huy tác lực.
- source_word: μέλεσιν
  choice: các chi thể
  rationale: Giữ cách nói của Phao-lô về các phần của thân thể được dùng như công cụ hành động; chú thích giúp độc giả hiện đại hiểu rõ hơn.
- source_word: καρποφορῆσαι
  choice: kết trái
  rationale: Giữ nguyên ẩn dụ hữu cơ của động từ và mối liên hệ với hình ảnh sinh hoa kết trái trong ngữ cảnh gần.
- source_word: τῷ θανάτῳ
  choice: cho sự chết
  rationale: Giữ sắc thái hướng đến hoặc dẫn đến kết quả là sự chết, đồng thời bảo toàn lối diễn đạt tương phản mạnh của Phao-lô.
theological_decisions:
- issue: Nghĩa của ἐν τῇ σαρκί trong nhân học của Phao-lô
  choice: ở trong xác thịt
  alternative: ở trong bản tính tội lỗi / ở trong tình trạng con người sa ngã
  rationale: Bản văn chính giữ thuật ngữ cụ thể và sự căng thẳng giữa nghĩa thân thể với nghĩa tình trạng con người dưới quyền tội lỗi, không áp đặt một công thức thần học duy nhất.
- issue: Quan hệ giữa luật pháp và các dục vọng tội lỗi trong διὰ τοῦ νόμου
  choice: do luật pháp mà có
  alternative: bị luật pháp khơi dậy
  rationale: Bản dịch giữ quan hệ phương tiện/nguyên nhân được nêu trong câu nhưng không giải quyết quá mức cơ chế thần học bằng cách thêm động từ “khơi dậy”.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Giữ các thuật ngữ giàu hình ảnh “xác thịt”, “chi thể” và “kết trái” để bảo toàn mạng lưới ẩn dụ của Phao-lô; dùng chú thích để làm rõ mà không diễn giải quá mức trong chính văn.
