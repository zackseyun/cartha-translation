  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εἰ δὲ ὃ οὐ θέλω τοῦτο ποιῶ, σύμφημι τῷ νόμῳ ὅτι καλός.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/016.yaml
  text: But if I do what I do not want, I agree with the law that it is good.
translation:
  language: vi
  text: Nhưng nếu tôi làm điều mình không muốn, thì tôi công nhận luật pháp là tốt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰ δὲ
  choice: Nhưng nếu
  rationale: Giữ lực điều kiện của εἰ và sắc thái đối chiếu nhẹ của δέ bằng cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: ὃ … τοῦτο
  choice: điều mình không muốn
  rationale: Chuyển cấu trúc tương liên theo lối tiếng Việt tự nhiên; đại từ phản thân “mình” quy chiếu rõ về chủ ngữ “tôi”.
- source_word: θέλω
  choice: muốn
  rationale: Diễn đạt trực tiếp ý muốn hay mong muốn bên trong đang tương phản với hành động thực tế.
- source_word: ποιῶ
  choice: làm
  rationale: Phản ánh động từ hiện tại đơn giản và trực tiếp của nguyên văn.
- source_word: σύμφημι
  choice: tôi đồng ý với
  rationale: Thể hiện sự tán thành phán quyết của luật pháp, đồng thời phản ánh cách dùng với bổ ngữ gián tiếp τῷ νόμῳ.
- source_word: νόμῳ
  choice: luật pháp
  rationale: Cách gọi tự nhiên và quen thuộc trong tiếng Việt cho luật đã được xác định trong ngữ cảnh; không viết hoa để tránh biến nó thành một nhan đề diễn giải.
- source_word: καλός
  choice: tốt
  rationale: Giữ nghĩa đánh giá tích cực trực tiếp của từ Hy Lạp mà không thu hẹp thành “đúng” hoặc nâng sắc thái thành “cao quý”.
theological_decisions:
- issue: Mệnh đề ὅτι καλός đánh giá chính luật pháp hay chỉ nói nội dung luật pháp là đúng
  choice: “rằng luật pháp là tốt”
  alternative: “thừa nhận điều luật pháp dạy là đúng”
  rationale: Cách chọn này giữ lời khẳng định rõ ràng về phẩm chất tốt của luật pháp trong nguyên văn, không giải tỏa căng thẳng thần học bằng một lời diễn giải.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Lặp lại “luật pháp” ở mệnh đề cuối để tránh đại từ “nó” có thể mơ hồ giữa luật pháp và hành động vừa nêu.
