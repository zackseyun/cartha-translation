  source_fidelity: 'Bản dịch truyền đạt đúng mệnh đề đầu và giữ được phép giải thích đồng vị “trong tôi, tức là trong xác thịt tôi.” Tuy nhiên, “tôi có ý muốn” làm mờ sắc thái của παράκειταί μοι, là ý muốn đang ở sẵn/gần bên người nói. Cần diễn đạt rõ sự đối lập: ý muốn có sẵn, còn việc thực hiện điều tốt thì không.'
