source:
  edition: SBLGNT
  text: οἶδα γὰρ ὅτι οὐκ οἰκεῖ ἐν ἐμοί, τοῦτ’ ἔστιν ἐν τῇ σαρκί μου, ἀγαθόν· τὸ γὰρ θέλειν παράκειταί μοι, τὸ δὲ κατεργάζεσθαι τὸ καλὸν ⸀οὔ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/018.yaml
  text: For I know that nothing good dwells in me—that is[a], in my flesh. For the willing is present with me, but the doing of the good is not.
translation:
  language: vi
  text: Vì tôi biết rằng không có điều tốt lành nào ở trong tôi—tức là, trong xác thịt tôi.[a] Vì ý muốn thì có sẵn nơi tôi, còn việc làm điều tốt thì không.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “bản tính tội lỗi” thay cho “xác thịt”.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἶδα
  choice: tôi biết
  rationale: Thể hoàn thành mang nghĩa hiện tại; “tôi biết” là cách diễn đạt tự nhiên và trực tiếp trong tiếng Việt.
- source_word: οἰκεῖ
  choice: ở trong
  rationale: Diễn đạt tự nhiên ý cư ngụ/nội tại trong tiếng Việt, đồng thời giữ được hình ảnh điều gì đó hiện diện bên trong con người.
- source_word: ἀγαθόν
  choice: điều gì tốt lành
  rationale: Tính từ trung tính số ít được dùng như danh từ và bị phủ định; cả mệnh đề được diễn đạt tự nhiên là “không có điều gì tốt lành”.
- source_word: σάρξ
  choice: xác thịt
  rationale: Giữ thuật ngữ cụ thể của Phao-lô và sự căng thẳng thần học, thay vì giải nghĩa ngay thành “bản tính tội lỗi”.
- source_word: θέλειν
  choice: có ý muốn
  rationale: Chuyển động từ nguyên mẫu có mạo từ thành cách nói tiếng Việt tự nhiên, vẫn nêu rõ năng lực hoặc hành vi muốn làm điều tốt.
- source_word: παράκειταί μοι
  choice: tôi có
  rationale: Trong ngữ cảnh, cụm từ chỉ ý muốn đang sẵn có nơi người nói; “tôi có ý muốn” tự nhiên hơn cách dịch sát hình thức như “ở bên tôi”.
- source_word: κατεργάζεσθαι
  choice: làm
  rationale: Truyền đạt trực tiếp ý thực hiện hay hoàn thành, phù hợp với sự đối lập giữa muốn và làm.
- source_word: τὸ καλόν
  choice: điều tốt
  rationale: Giữ tính chất danh từ hóa của cụm từ và phạm trù đạo đức mà Phao-lô nêu ra.
- source_word: οὔ
  choice: thì không
  rationale: Giữ phép tỉnh lược ngắn gọn ở cuối câu; tiếng Việt hiểu động tác “làm” bị phủ định mà không cần bổ sung một động từ dài hơn.
theological_decisions:
- issue: Cách dịch σάρξ trong văn cảnh luân lý của Phao-lô
  choice: xác thịt
  alternative: bản tính tội lỗi
  rationale: “Xác thịt” giữ nguyên cách Phao-lô giới hạn lời khẳng định “ở trong tôi” và không đồng nhất toàn bộ con người với điều ác. Phương án “bản tính tội lỗi” là một lối giải nghĩa có thể có nhưng thu hẹp độ mở của thuật ngữ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cấu trúc “tôi có ý muốn, nhưng làm điều tốt thì không” giữ sự đối xứng và nét tỉnh lược ngắn gọn của nguyên văn Hy Lạp.
