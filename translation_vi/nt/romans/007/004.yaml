id: ROM.7.4
reference: Romans 7:4
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ὥστε, ἀδελφοί μου, καὶ ὑμεῖς ἐθανατώθητε τῷ νόμῳ διὰ τοῦ σώματος τοῦ Χριστοῦ, εἰς τὸ γενέσθαι ὑμᾶς ἑτέρῳ, τῷ ἐκ νεκρῶν ἐγερθέντι ἵνα καρποφορήσωμεν τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/004.yaml
  text: So then[a], my brothers, you also were put to death to the law through the body of the Messiah[c][b], so that you might belong to another—to him who was raised from the dead—in order that we might bear fruit for God.
translation:
  language: vi
  text: Vậy thì, thưa anh chị em tôi[a], anh chị em cũng đã bị làm cho chết đối với luật pháp qua thân thể của Đấng Mê-si[b], để anh chị em thuộc về một Đấng khác[c], tức là Đấng đã được làm cho sống lại từ cõi chết, hầu cho chúng ta sinh hoa trái cho Đức Chúa Trời.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tiếng Hy Lạp dùng từ “anh em” ở dạng nam số nhiều, nhưng trong lời xưng hô từ này có thể chỉ cả một nhóm gồm nam và nữ.
    reason: lexical_alternative
  - marker: b
    text: Tiếng Hy Lạp là Christou; cũng có thể dịch là “Đấng Christ”. “Đấng Mê-si” làm rõ ý nghĩa tước hiệu.
    reason: lexical_alternative
  - marker: c
    text: 'Theo sát nguyên văn: “để anh chị em trở thành của một người khác”; cách nói này tiếp nối hình ảnh hôn nhân trong phần trước.'
    reason: cultural_note
lexical_decisions:
- source_word: Ὥστε
  choice: Vậy
  rationale: Diễn đạt tự nhiên sức suy luận từ hình ảnh hôn nhân ở phần trước.
- source_word: ἀδελφοί μου
  choice: thưa anh chị em của tôi
  rationale: Trong lời xưng hô với cộng đồng, dạng nam số nhiều Hy Lạp có thể bao gồm cả nam lẫn nữ; cách dịch này truyền đạt đúng phạm vi người nghe trong tiếng Việt hiện đại.
- source_word: ἐθανατώθητε τῷ νόμῳ
  choice: đã bị làm cho chết đối với luật pháp
  rationale: Giữ thể bị động của động từ và quan hệ dative với luật pháp, thay vì diễn giải thành được giải thoát khỏi luật pháp.
- source_word: διὰ τοῦ σώματος τοῦ Χριστοῦ
  choice: qua thân thể của Đấng Mê-si
  rationale: διά với sở hữu cách chỉ phương tiện; thân thể của Đấng Mê-si là phương tiện qua đó sự chết đối với luật pháp xảy ra.
- source_word: Χριστοῦ
  choice: Đấng Mê-si
  rationale: Ở đây Χριστός mang nghĩa tước hiệu; Mê-si giữ được ý nghĩa Đấng được xức dầu.
- source_word: εἰς τὸ γενέσθαι ὑμᾶς ἑτέρῳ
  choice: để anh chị em thuộc về một Đấng khác
  rationale: Diễn đạt quan hệ chuyển sang thuộc về người khác, đồng thời tiếp nối hình ảnh hôn nhân trong văn cảnh.
- source_word: τῷ ἐκ νεκρῶν ἐγερθέντι
  choice: tức là Đấng đã được khiến sống lại từ cõi chết
  rationale: Giữ thể bị động của ἐγερθέντι và xác định Đấng khác là Đấng đã sống lại.
- source_word: ἵνα καρποφορήσωμεν τῷ θεῷ
  choice: hầu cho chúng ta kết quả cho Đức Chúa Trời
  rationale: Giữ ẩn dụ mang quả và sự chuyển ngôi nguyên văn từ anh chị em sang chúng ta; dative được diễn đạt tự nhiên bằng cho.
theological_decisions:
- issue: Cách dịch Χριστοῦ
  choice: Đấng Mê-si
  alternative: Đấng Christ
  rationale: Tước hiệu và ý nghĩa cứu thế nổi bật trong câu; không coi Χριστός đơn thuần là tên riêng.
- issue: Quan hệ với luật pháp trong ἐθανατώθητε τῷ νόμῳ
  choice: bị làm cho chết đối với luật pháp
  alternative: chết khỏi luật pháp
  rationale: Giữ hình ảnh và cấu trúc của nguyên văn, không giải quyết thêm bản chất thần học của việc chấm dứt mối ràng buộc với luật pháp.
- issue: Ẩn dụ hôn nhân trong γενέσθαι ὑμᾶς ἑτέρῳ
  choice: thuộc về một Đấng khác
  alternative: kết hợp với một Đấng khác
  rationale: Giữ ý chuyển quyền thuộc về trong phép so sánh hôn nhân mà không thêm một thuật ngữ liên hiệp mang tính giải thích.
- issue: Thể bị động của sự sống lại
  choice: đã được khiến sống lại
  alternative: đã sống lại
  rationale: Giữ thể bị động thần học của nguyên văn mà không nêu rõ tác nhân vốn không được nói ra trong mệnh đề.
translation_notes:
  register: Văn phong trang trọng, rõ ràng và hiện đại. Dùng “anh chị em” để xưng hô cộng đồng hỗn hợp; “bị làm cho chết đối với luật pháp” hơi lạ tai nhưng có chủ ý nhằm giữ thể bị động và sự căng thẳng của nguyên văn. Giữ sự chuyển ngôi từ “anh chị em” sang “chúng ta”.
