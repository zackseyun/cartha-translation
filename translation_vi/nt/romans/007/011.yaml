reference: Romans 7:11
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἡ γὰρ ἁμαρτία ἀφορμὴν λαβοῦσα διὰ τῆς ἐντολῆς ἐξηπάτησέν με καὶ δι’ αὐτῆς ἀπέκτεινεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/011.yaml
  text: For sin[a], having taken an opportunity through the commandment[b], deceived me and through it killed me.
translation:
  language: vi
  text: Vì tội lỗi đã lợi dụng điều răn để lừa dối tôi và cũng qua điều răn ấy giết tôi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γὰρ
  choice: Vì
  rationale: Giữ chức năng giải thích và nối kết với lời phát biểu ngay trước đó một cách tự nhiên trong tiếng Việt.
- source_word: ἡ ἁμαρτία
  choice: tội lỗi
  rationale: Cách dịch quen thuộc, đồng thời bảo toàn việc Phao-lô nhân cách hóa tội lỗi như chủ thể hành động.
- source_word: ἀφορμὴν λαβοῦσα
  choice: nhân cơ hội
  rationale: Diễn đạt tự nhiên ý nắm lấy hoặc lợi dụng một dịp thuận lợi, không thêm sắc thái quá mức.
- source_word: διὰ τῆς ἐντολῆς
  choice: qua điều răn
  rationale: Giữ nghĩa phương tiện của διά và số ít của ἐντολή.
- source_word: ἐξηπάτησέν με
  choice: đã lừa dối tôi
  rationale: Truyền đạt rõ hành động lừa dối hướng đến người nói; không cường điệu hóa sắc thái tăng cường của động từ.
- source_word: δι’ αὐτῆς
  choice: dùng chính điều răn ấy
  rationale: Làm rõ đại từ giống cái số ít quy chiếu về điều răn, đồng thời giữ nghĩa phương tiện và tránh sự mơ hồ do đại từ tiếng Việt.
- source_word: ἀπέκτεινεν
  choice: giết tôi
  rationale: Cách diễn đạt trực tiếp, tự nhiên, bảo toàn hình ảnh mạnh về tác động gây chết của tội lỗi.
theological_decisions:
- issue: Mức độ nhân cách hóa tội lỗi
  choice: Giữ tội lỗi làm chủ thể chủ động của các hành vi nhân cơ hội, lừa dối và giết.
  alternative: Làm nhẹ tính chủ động bằng cách diễn đạt tội lỗi như một ảnh hưởng trừu tượng.
  rationale: Cấu trúc Hy Lạp đặt tội lỗi làm chủ thể của chuỗi hành động; bản dịch giữ nguyên sức căng tu từ và thần học mà không thêm lời giải thích.
- issue: Vai trò của điều răn trong cái chết
  choice: Dịch điều răn là phương tiện mà tội lỗi lợi dụng, không biến điều răn thành chủ thể giết người.
  alternative: Diễn đạt theo cách có thể khiến người đọc hiểu chính điều răn trực tiếp gây chết.
  rationale: Trong câu Hy Lạp, tội lỗi là chủ thể của ἀπέκτεινεν, còn δι’ αὐτῆς biểu thị phương tiện và quy chiếu về điều răn.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. “Nhân cơ hội” tự nhiên hơn lối dịch sát chữ “lấy một cơ hội”; “dùng chính điều răn ấy” làm rõ sở chỉ của đại từ mà vẫn giữ quan hệ phương tiện.
