id: ROM.7.19
reference: Romans 7:19
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οὐ γὰρ ὃ θέλω ποιῶ ἀγαθόν, ἀλλὰ ὃ οὐ θέλω κακὸν τοῦτο πράσσω.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/019.yaml
  text: For I do not do the good that I want[b][a], but the evil that I do not want—this I practice.
translation:
  language: vi
  text: Vì điều lành tôi muốn thì tôi không làm[a], nhưng điều ác tôi không muốn thì chính điều ấy tôi lại thực hành[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch “thực hiện”; nguyên văn dùng một động từ khác với động từ ở cuối câu.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch “làm”. Hai động từ Hy Lạp trong câu có nghĩa chồng lấn đáng kể.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ γὰρ
  choice: Vì ... không
  rationale: “Vì” giữ chức năng giải thích của γάρ và nối câu này với lập luận trước đó.
- source_word: θέλω
  choice: muốn
  rationale: “Muốn” là cách diễn đạt tự nhiên, hiện đại, truyền đạt rõ ý chí hay ước muốn trong ngữ cảnh.
- source_word: ποιῶ
  choice: làm
  rationale: “Làm” là từ thông dụng và sát nghĩa; được phân biệt với πράσσω ở vế sau mà không cường điệu khác biệt giữa hai động từ.
- source_word: ἀγαθόν
  choice: điều lành
  rationale: “Điều lành” giữ sắc thái đạo đức rõ ràng và tạo thế đối xứng tự nhiên với “điều ác”.
- source_word: κακὸν
  choice: điều ác
  rationale: “Điều ác” bảo toàn sức nặng luân lý của từ Hy Lạp, thay vì làm nhẹ thành điều chỉ đơn thuần là không tốt.
- source_word: τοῦτο
  choice: chính điều ấy
  rationale: Cách dịch này thể hiện sự nhấn mạnh của đại từ chỉ định và làm nổi bật nghịch lý trong lời Phao-lô.
- source_word: πράσσω
  choice: thực hành
  rationale: “Thực hành” phân biệt hợp lý với ποιῶ (“làm”) và gợi hành vi được thực hiện, nhưng không khẳng định quá mức rằng động từ nhất thiết nói đến một thói quen lâu dài.
theological_decisions:
- issue: Có nên làm nhẹ sự tương phản luân lý giữa ἀγαθόν và κακὸν hay không
  choice: Giữ “điều lành” và “điều ác” như những phạm trù luân lý trực tiếp.
  alternative: “điều đúng” và “điều sai”, hoặc “điều tốt” và “điều xấu”
  rationale: Câu Hy Lạp diễn tả một sự đối lập đạo đức mạnh. Bản dịch không nên biến nó thành sự khác biệt chỉ mang tính thực dụng hay tùy hoàn cảnh.
- issue: Sắc thái của πράσσω so với ποιῶ
  choice: Dùng “thực hành” ở vế sau nhưng kèm chú thích về sự chồng lấn nghĩa.
  alternative: Dịch cả hai động từ là “làm”
  rationale: Hai động từ có phạm vi nghĩa chồng lấn đáng kể. Việc dùng hai từ Việt khác nhau giúp người đọc nhận ra sự thay đổi từ ngữ trong nguyên bản nhưng không biến nó thành một phân biệt thần học cứng nhắc.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Cấu trúc đối xứng của nguyên văn được giữ lại; “lại” làm câu tiếng Việt tự nhiên hơn và nêu bật sự trái ngược, còn “chính điều ấy” bảo toàn nét nhấn mạnh của τοῦτο.
