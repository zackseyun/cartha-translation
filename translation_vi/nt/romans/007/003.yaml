id: ROM.7.3
reference: Romans 7:3
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἄρα οὖν ζῶντος τοῦ ἀνδρὸς μοιχαλὶς χρηματίσει ἐὰν γένηται ἀνδρὶ ἑτέρῳ· ἐὰν δὲ ἀποθάνῃ ὁ ἀνήρ, ἐλευθέρα ἐστὶν ἀπὸ τοῦ νόμου, τοῦ μὴ εἶναι αὐτὴν μοιχαλίδα γενομένην ἀνδρὶ ἑτέρῳ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/003.yaml
  text: So then[a], while her husband is living, she will be called an adulteress if she belongs to another man. But if the husband dies, she is free from the law[b], so that she is not an adulteress if she belongs to another man.
translation:
  language: vi
  text: Vậy nên, khi chồng còn sống, người phụ nữ ấy sẽ bị coi là người ngoại tình nếu lấy một người đàn ông khác.[a] Nhưng nếu chồng chết, người ấy không còn bị luật ấy ràng buộc,[b] nên nếu lấy một người đàn ông khác, người ấy không phải là người ngoại tình.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “trở thành vợ của một người đàn ông khác” hoặc “kết hợp với một người đàn ông khác.”'
    reason: lexical_alternative
  - marker: b
    text: “Luật ấy” ở đây trước hết chỉ luật ràng buộc quan hệ hôn nhân.
    reason: cultural_note
lexical_decisions:
- source_word: ἄρα οὖν
  choice: Vậy nên
  rationale: Cụm từ này diễn tả kết luận rút ra từ điều vừa nói; “Vậy nên” tự nhiên trong tiếng Việt và giữ rõ mối liên kết suy luận.
- source_word: ζῶντος τοῦ ἀνδρός
  choice: khi chồng còn sống
  rationale: Diễn đạt rõ hoàn cảnh đồng thời của cấu trúc sở hữu cách tuyệt đối; đại từ sở hữu được hiểu từ ngữ cảnh hôn nhân.
- source_word: μοιχαλὶς
  choice: người phụ nữ ngoại tình
  rationale: Danh từ chỉ riêng người nữ phạm tội ngoại tình; cách dịch này chính xác và tự nhiên hơn từ Hán-Việt ít thông dụng “dâm phụ”.
- source_word: χρηματίσει
  choice: sẽ bị gọi là
  rationale: Giữ ý được gọi hoặc được xác định là, đồng thời phản ánh sắc thái tương lai của động từ.
- source_word: ἐὰν γένηται ἀνδρὶ ἑτέρῳ / γενομένην ἀνδρὶ ἑτέρῳ
  choice: nếu/khi thuộc về một người đàn ông khác
  rationale: Giữ cách nói quan hệ trong nguyên văn mà không âm thầm xác định quá mức là một lễ cưới hợp pháp; ngữ cảnh cho thấy đây là quan hệ mang tính hôn nhân.
- source_word: ἐλευθέρα ἐστὶν ἀπὸ τοῦ νόμου
  choice: không còn bị luật ấy ràng buộc
  rationale: Diễn đạt tự nhiên ý được tự do khỏi nghĩa vụ ràng buộc của luật, trong khi “luật ấy” vẫn bảo toàn từ νόμος và hướng về luật vừa được nói đến.
- source_word: τοῦ μὴ εἶναι αὐτὴν μοιχαλίδα
  choice: nên chị ấy không phải là người phụ nữ ngoại tình
  rationale: “Nên” thể hiện quan hệ kết quả của cấu trúc nguyên mẫu có mạo từ mà không làm câu tiếng Việt nặng nề.
theological_decisions:
- issue: Phạm vi của νόμος trong phép minh họa
  choice: Dịch là “luật ấy” và chú thích rằng trước hết đó là luật ràng buộc quan hệ hôn nhân.
  alternative: “luật hôn nhân” hoặc hiểu trực tiếp là toàn bộ Luật Môi-se
  rationale: Ngữ cảnh trực tiếp nói đến địa vị pháp lý của người vợ khi chồng còn sống hay đã chết. Cách dịch này giữ từ “luật” của Phao-lô nhưng không biến câu thành một khẳng định rộng hơn về toàn bộ Luật Môi-se.
- issue: Bản chất của quan hệ với ἀνδρὶ ἑτέρῳ
  choice: “thuộc về một người đàn ông khác”
  alternative: “lấy một người đàn ông khác” hoặc “kết duyên với một người đàn ông khác”
  rationale: Nguyên văn mô tả việc trở thành người của một người đàn ông khác trong bối cảnh hôn nhân nhưng không dùng trực tiếp động từ “cưới”; bản dịch giữ được độ mở ấy và chú thích các cách hiểu tự nhiên hơn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “chị ấy” để tiếp nối người phụ nữ đang được nói đến trong ngữ cảnh, tránh lối gọi cổ “người đàn bà ấy.” Cụm “thuộc về” giữ sắc thái quan hệ của nguyên văn; chú thích làm rõ các khả năng dịch khác.
