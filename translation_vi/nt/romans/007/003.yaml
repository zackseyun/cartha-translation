revisions:
- from: Vậy nên, khi chồng còn sống, chị ấy sẽ bị gọi là người phụ nữ ngoại tình nếu thuộc về một người đàn ông khác.[a] Nhưng nếu người chồng chết, chị ấy không còn bị luật ấy ràng buộc,[b] nên chị ấy không phải là người phụ nữ ngoại tình khi thuộc về một người đàn ông khác.
  to: Vậy nên, khi chồng còn sống, người phụ nữ ấy sẽ bị coi là người ngoại tình nếu lấy một người đàn ông khác.[a] Nhưng nếu chồng chết, người ấy không còn bị luật ấy ràng buộc,[b] nên nếu lấy một người đàn ông khác, người ấy không phải là người ngoại tình.
  rationale: Bản sửa thay cách nói “thuộc về” bằng thành ngữ tiếng Việt tự nhiên “lấy một người đàn ông khác,” vốn phù hợp với ngữ cảnh hôn nhân của γίνομαι + cách tặng. Đồng thời thay đại từ hội thoại “chị ấy” bằng cách quy chiếu trang trọng, trung tính. Cấu trúc điều kiện ở vế cuối được giữ rõ để phản ánh hệ quả pháp lý mà nguyên văn nêu ra.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T10:25:13Z'
review_pass:
  verdict: revise
  source_fidelity: Bản nháp giữ đúng lập luận điều kiện và hệ quả của câu, cũng như phạm vi trực tiếp của νόμος là sự ràng buộc pháp lý trong hôn nhân. Tuy nhiên, “thuộc về một người đàn ông khác” không phải là cách nói tự nhiên trong tiếng Việt và có thể tạo sắc thái sở hữu không cần thiết. Cụm γίνομαι + ἀνδρί trong ngữ cảnh này là thành ngữ chỉ việc người phụ nữ trở thành vợ/người phối ngẫu của người đàn ông khác; “lấy một người đàn ông khác” chuyển tải điều đó rõ và tự nhiên.
  naturalness: “Chị ấy” có sắc thái hội thoại và không hợp với một phát biểu khái quát, trang trọng của Phao-lô. “Người phụ nữ ấy/người ấy” phù hợp hơn. “Sẽ bị coi là người ngoại tình” cũng tự nhiên hơn “sẽ bị gọi là người phụ nữ ngoại tình.”
  terminology: Giữ “luật ấy” để phản ánh νόμος mà không định nghĩa quá rộng là Luật Môi-se. Chú thích giải thích phạm vi trực tiếp của từ này. Dùng “người ngoại tình” cho μοιχαλίς, vẫn chỉ địa vị của người nữ trong tình huống được nêu.
  issues:
