    rationale: γένηται/γενομένην ἀνδρὶ ἑτέρῳ là thành ngữ trong ngữ cảnh hôn nhân; tiếng Việt hiện đại diễn đạt tự nhiên nhất là “lấy một người đàn ông khác.”
  - severity: low
    issue: “chị ấy” không phù hợp với văn phong khái quát, trang trọng của câu.
    rationale: Câu đang nói về người phụ nữ trong phép minh họa pháp lý, không phải một nhân vật được xưng hô thân mật; “người phụ nữ ấy/người ấy” trung tính hơn.
  revised_text: Vậy nên, khi chồng còn sống, người phụ nữ ấy sẽ bị coi là người ngoại tình nếu lấy một người đàn ông khác.[a] Nhưng nếu chồng chết, người ấy không còn bị luật ấy ràng buộc,[b] nên nếu lấy một người đàn ông khác, người ấy không phải là người ngoại tình.
