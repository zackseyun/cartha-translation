id: ROM.7.1
reference: Romans 7:1
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἢ ἀγνοεῖτε, ἀδελφοί, γινώσκουσιν γὰρ νόμον λαλῶ, ὅτι ὁ νόμος κυριεύει τοῦ ἀνθρώπου ἐφ’ ὅσον χρόνον ζῇ;
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/001.yaml
  text: Or do you not know[b][a], brothers—for I am speaking to those who know the law—that the law has authority over a person for as long as he lives?
translation:
  language: vi
  text: Hay anh em[a] không biết sao—vì tôi đang nói với những người hiểu biết luật pháp—rằng luật pháp có thẩm quyền đối với[b] một người bao lâu người ấy còn sống?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Anh em” dịch danh từ số nhiều giống đực adelphoi; trong ngữ cảnh này, cách gọi có lẽ bao gồm cả những phụ nữ trong số người nghe Phao-lô.
    reason: cultural_note
  - marker: b
    text: 'Cũng có thể dịch: “có quyền làm chủ đối với”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἢ
  choice: Hay
  rationale: Giữ nguyên sự chuyển ý mang tính lập luận, nối câu hỏi này với phần bàn luận ngay trước đó.
- source_word: ἀγνοεῖτε
  choice: không biết sao
  rationale: Diễn đạt tự nhiên câu hỏi tu từ ở hiện tại và giữ lời kêu gọi dựa trên sự hiểu biết chung của người nghe.
- source_word: ἀδελφοί
  choice: anh em
  rationale: Giữ hình thức số nhiều giống đực của nguyên ngữ; chú thích nêu rõ trong ngữ cảnh, cách gọi này có thể bao gồm cả phụ nữ.
- source_word: γινώσκουσιν γὰρ νόμον λαλῶ
  choice: vì tôi đang nói với những người hiểu biết luật pháp
  rationale: Giữ chức năng giải thích của γάρ và ý nghĩa của phân từ γινώσκουσιν bằng lối diễn đạt tiếng Việt rõ ràng.
- source_word: νόμον / ὁ νόμος
  choice: luật pháp
  rationale: Không thu hẹp nghĩa thành Luật Môi-se hay một nguyên tắc pháp lý nói chung, nhờ đó bảo toàn độ rộng của nguyên văn.
- source_word: κυριεύει
  choice: cai trị
  rationale: Thể hiện quyền thống trị hoặc quyền làm chủ của động từ, đồng thời ngắn gọn và tự nhiên trong tiếng Việt.
- source_word: τοῦ ἀνθρώπου
  choice: một người
  rationale: ἀνθρώπου được dùng theo nghĩa chỉ con người nói chung, không riêng nam giới.
- source_word: ἐφ’ ὅσον χρόνον ζῇ
  choice: bao lâu người ấy còn sống
  rationale: Giữ đầy đủ ý nghĩa thời gian của thành ngữ và liên kết tự nhiên với danh từ số ít “một người”.
theological_decisions:
- issue: Phạm vi ý nghĩa của νόμος
  choice: Dịch đơn giản là “luật pháp”, không xác định hẹp hơn trong chính văn.
  alternative: “Luật Môi-se” cụ thể, hoặc luật như một nguyên tắc pháp lý nói chung.
  rationale: Nguyên văn không giải quyết dứt khoát toàn bộ phạm vi nghĩa ở đây. Mạch văn hướng tới Luật Môi-se, nhưng cách nói vẫn đủ khái quát để bản dịch giữ nguyên sự rộng nghĩa ấy.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dấu gạch ngang giữ phần giải thích chen giữa của Phao-lô; cách lặp “luật pháp” bảo toàn trọng tâm của nguyên văn.
