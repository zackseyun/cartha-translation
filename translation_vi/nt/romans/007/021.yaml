source:
  edition: SBLGNT
  text: Εὑρίσκω ἄρα τὸν νόμον τῷ θέλοντι ἐμοὶ ποιεῖν τὸ καλὸν ὅτι ἐμοὶ τὸ κακὸν παράκειται·
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/021.yaml
  text: 'So I find this law: when I want to do what is good[a], evil lies close at hand.'
translation:
  language: vi
  text: 'Vậy, tôi nhận thấy luật này[a]: khi tôi muốn làm điều tốt, điều ác ở ngay bên tôi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “nguyên tắc này” hoặc “quy luật này”.
    reason: Giữ khả năng νόμος ở đây chỉ một nguyên tắc hay quy luật chi phối, chứ không nhất thiết trực tiếp chỉ Luật Môi-se.
lexical_decisions:
- source_word: Εὑρίσκω
  choice: tôi nhận thấy
  rationale: Thì hiện tại diễn tả sự nhận biết đang có; “nhận thấy” tự nhiên trong tiếng Việt và phù hợp với một kết luận rút ra từ kinh nghiệm được trình bày.
- source_word: ἄρα
  choice: Vậy
  rationale: Đánh dấu kết luận suy ra từ lập luận trước đó; “Vậy” ngắn gọn và tự nhiên.
- source_word: τὸν νόμον
  choice: luật này
  rationale: Giữ từ “luật” để bảo toàn cách dùng νόμος và sự liên hệ với mạch văn, đồng thời “này” giới thiệu nội dung của luật được nêu ngay sau đó. Nghĩa “nguyên tắc/quy luật” được ghi ở chú thích để không giải quyết dứt khoát sự mơ hồ.
- source_word: τῷ θέλοντι ἐμοὶ ποιεῖν τὸ καλὸν
  choice: khi tôi muốn làm điều tốt
  rationale: Chuyển cấu trúc tặng cách khó dịch sát thành mệnh đề thời gian tự nhiên, vẫn giữ rõ ý muốn và hành động làm điều tốt.
- source_word: τὸ καλὸν
  choice: điều tốt
  rationale: Diễn đạt tự nhiên danh từ hóa của tính từ trong tiếng Việt mà vẫn giữ ý nghĩa đạo đức chung.
- source_word: τὸ κακὸν
  choice: điều ác
  rationale: Giữ hình thức đối xứng với “điều tốt” và diễn đạt rõ danh từ hóa của tính từ Hy Lạp.
- source_word: παράκειται
  choice: lại ở ngay bên tôi
  rationale: Diễn tả điều ác hiện diện sát bên, sẵn đó; “lại” làm rõ sự tương phản trong câu mà không biến động từ thành một hành động chủ động.
theological_decisions:
- issue: νόμον chỉ Luật Môi-se hay một nguyên tắc/quy luật chi phối
  choice: Dịch “luật” trong chính văn và nêu “nguyên tắc” hoặc “quy luật” trong chú thích.
  alternative: Dịch thẳng là “nguyên tắc” hoặc “quy luật”.
  rationale: Từ Hy Lạp νόμος vẫn là từ Phao-lô dùng cho “luật”, nên chính văn bảo toàn tiếng vọng và sức căng thần học ấy. Tuy nhiên, trong ngữ cảnh này từ đó có thể chỉ một quy luật hay khuôn mẫu đang vận hành, vì vậy chú thích giữ các khả năng này.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Cấu trúc câu giữ gần nguyên văn nhưng tránh lối dịch gượng; sự đối xứng giữa “điều tốt” và “điều ác” được bảo toàn.
