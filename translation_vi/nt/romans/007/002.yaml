id: ROM.7.2
reference: Romans 7:2
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἡ γὰρ ὕπανδρος γυνὴ τῷ ζῶντι ἀνδρὶ δέδεται νόμῳ· ἐὰν δὲ ἀποθάνῃ ὁ ἀνήρ, κατήργηται ἀπὸ τοῦ νόμου τοῦ ἀνδρός.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/002.yaml
  text: For a married woman is bound by law to her husband while he lives; but if the husband dies[a], she is released from the law of her husband.
translation:
  language: vi
  text: Vì người phụ nữ có chồng bị luật ràng buộc với chồng mình khi người ấy còn sống; nhưng nếu người chồng chết, bà được giải thoát khỏi luật ràng buộc bà với chồng.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch sát hơn: “bà được giải thoát khỏi luật của người chồng.” Cụm từ Hy Lạp có lẽ chỉ sự ràng buộc pháp lý gắn bà với chồng.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὕπανδρος γυνή
  choice: người phụ nữ đã có chồng
  rationale: Diễn đạt tự nhiên tình trạng người phụ nữ đang ở trong mối ràng buộc hôn nhân, đồng thời giữ sắc thái pháp lý của cụm Hy Lạp.
- source_word: τῷ ζῶντι ἀνδρί
  choice: với chồng khi ông còn sống
  rationale: Thể hiện rõ người chồng là người đang sống và quan hệ thuộc về ngữ cảnh, theo cách nói tự nhiên trong tiếng Việt.
- source_word: δέδεται
  choice: bị ... ràng buộc
  rationale: Thì hoàn thành bị động chỉ tình trạng ràng buộc đang tiếp diễn do một hành động đã có hiệu lực; cách dịch này giữ cả sắc thái bị động lẫn kết quả hiện tại.
- source_word: νόμῳ
  choice: bị luật ràng buộc
  rationale: Không thêm mạo từ hay xác định đây là Luật Môi-se; cụm từ được hiểu theo nghĩa nguyên tắc pháp lý chi phối hôn nhân.
- source_word: κατήργηται
  choice: được giải thoát
  rationale: Trong văn cảnh pháp lý, động từ nói đến việc không còn chịu hiệu lực hay nghĩa vụ ràng buộc, chứ không phải bản thân người phụ nữ bị hủy bỏ.
- source_word: ἀπὸ τοῦ νόμου τοῦ ἀνδρός
  choice: khỏi luật ràng buộc nàng với chồng
  rationale: Làm rõ cấu trúc sở hữu cô đọng trong tiếng Hy Lạp như luật chi phối mối quan hệ với người chồng, tránh hàm ý người chồng là người ban hành luật.
theological_decisions:
- issue: νόμῳ / τοῦ νόμου có chỉ riêng Luật Môi-se hay nguyên tắc pháp lý của hôn nhân hay không
  choice: luật hay sự ràng buộc pháp lý trong hôn nhân
  alternative: Luật Môi-se áp dụng cho hôn nhân
  rationale: Văn cảnh trực tiếp là quan hệ hôn nhân được dùng làm phép loại suy về việc cái chết chấm dứt quyền chi phối của luật; νόμῳ không có mạo từ ở lần xuất hiện đầu, nên không nên xác định rõ là Luật Môi-se.
- issue: Cách hiểu τοῦ νόμου τοῦ ἀνδρός
  choice: luật ràng buộc người phụ nữ với chồng
  alternative: luật của người chồng
  rationale: Cách chọn này truyền đạt quan hệ pháp lý được nói đến mà không biến người chồng thành nguồn ban hành luật, đồng thời chú thích giữ lại cách dịch sát cấu trúc Hy Lạp.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “nàng” ở mệnh đề sau để tránh lặp nặng “người phụ nữ”, còn “ông” chỉ người chồng. Không viết hoa “luật” vì câu này trước hết nói đến sự ràng buộc pháp lý của hôn nhân, dù mối liên hệ rộng hơn với Luật vẫn được để ngỏ trong văn cảnh.
