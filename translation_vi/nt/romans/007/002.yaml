revisions:
- from: Vì người phụ nữ đã có chồng bị luật ràng buộc với chồng khi ông còn sống; nhưng nếu người chồng chết, nàng được giải thoát khỏi luật ràng buộc nàng với chồng.[a]
  to: Vì người phụ nữ có chồng bị luật ràng buộc với chồng mình khi người ấy còn sống; nhưng nếu người chồng chết, bà được giải thoát khỏi luật ràng buộc bà với chồng.[a]
  rationale: Chỉnh cách diễn đạt để tự nhiên và nhất quán hơn trong tiếng Việt hiện đại, đồng thời chuyển mốc chú thích đến đúng cụm Hy Lạp mà chú thích giải thích. Ý nghĩa pháp lý và sự dè dặt trước tính cô đọng của «luật của người chồng» được giữ nguyên.
