review_pass:
  verdict: revise
  source_fidelity: Bản dịch truyền đạt đúng quan hệ pháp lý-hôn nhân trong ὕπανδρος γυνή, δέδεται νόμῳ và ý nghĩa giải trừ hiệu lực ràng buộc của κατήργηται. Tuy nhiên, chú thích về cụm ἀπὸ τοῦ νόμου τοῦ ἀνδρός đang được gắn sau «chết», không đúng vị trí của từ/cụm được chú thích. Cách xưng hô «ông»/«nàng» cũng thêm sắc thái ngôi thứ và hơi cổ không có trong nguyên văn.
  naturalness: «Người phụ nữ có chồng» là cách nói hiện đại, tự nhiên hơn «người phụ nữ đã có chồng», vốn có thể gợi nghĩa đã từng có chồng. Dùng nhất quán «bà» ở mệnh đề sau tránh sự pha trộn đại từ «ông» và «nàng», đồng thời giữ văn phong trang trọng, hiện đại.
  terminology: Giữ «luật» không viết hoa, vì văn cảnh trực tiếp nói đến nguyên tắc/ràng buộc pháp lý về hôn nhân. «Luật ràng buộc bà với chồng» diễn đạt rõ genitive cô đọng «luật của người chồng» mà không khẳng định người chồng là nhà lập pháp; chú thích vẫn nêu phương án sát chữ.
  issues:
  - severity: medium
    issue: Mốc chú thích [a] đặt sau «người chồng chết».
    rationale: Nội dung chú thích giải thích ἀπὸ τοῦ νόμου τοῦ ἀνδρός («khỏi luật ... chồng»), không phải ἀποθάνῃ ὁ ἀνήρ («người chồng chết»). Mốc cần đặt sau cụm cuối câu.
  - severity: low
    issue: «Đã có chồng» và cặp đại từ «ông»/«nàng» chưa tối ưu cho tiếng Việt hiện đại.
    rationale: «Đã có chồng» có thể bị hiểu là tình trạng quá khứ; «nàng» mang sắc thái văn chương/cổ hơn văn phong hiện đại và không cần thiết trong câu pháp lý.
  revised_text: Vì người phụ nữ có chồng bị luật ràng buộc với chồng mình khi người ấy còn sống; nhưng nếu người chồng chết, bà được giải thoát khỏi luật ràng buộc bà với chồng.[a]
