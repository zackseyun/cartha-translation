id: ROM.7.6
reference: Romans 7:6
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: νυνὶ δὲ κατηργήθημεν ἀπὸ τοῦ νόμου, ἀποθανόντες ἐν ᾧ κατειχόμεθα, ὥστε δουλεύειν ἡμᾶς ἐν καινότητι πνεύματος καὶ οὐ παλαιότητι γράμματος.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/006.yaml
  text: But now we have been released from the law[a], having died to what held us[c][b], so that we serve in newness of the Spirit and not in oldness of the letter.
translation:
  language: vi
  text: Nhưng nay, chúng ta đã được giải thoát khỏi luật pháp, vì đã chết đối với điều từng giam giữ chúng ta,[a] để chúng ta phục vụ trong sự mới mẻ của Thánh Linh,[b] chứ không trong sự cũ kỹ của văn tự.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “vì đã chết đối với điều từng trói buộc chúng ta.”'
    reason: lexical_alternative
  - marker: b
    text: 'Hoặc: “trong sự mới mẻ của tinh thần.”'
    reason: alternative_reading
  - marker: c
    text: 'Hoặc: “trong lối cũ của điều luật thành văn.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατηργήθημεν ἀπὸ τοῦ νόμου
  choice: đã được giải thoát khỏi luật pháp
  rationale: 'Diễn đạt thể bị động và quan hệ với luật pháp: người tin được thoát khỏi sự ràng buộc của luật pháp, chứ không hàm ý luật pháp không còn tồn tại.'
- source_word: ἀποθανόντες
  choice: vì đã chết
  rationale: Giữ chủ thể là “chúng ta” theo phân từ số nhiều của tiếng Hy Lạp, đồng thời diễn đạt tự nhiên quan hệ hoàn tất dẫn đến việc được giải thoát.
- source_word: ἐν ᾧ κατειχόμεθα
  choice: đối với điều từng giam giữ mình
  rationale: Phản ánh ý bị giữ chặt hoặc ràng buộc của κατέχω mà không xác định quá mức cấu trúc đại từ tương đối vốn hơi cô đọng trong tiếng Hy Lạp.
- source_word: δουλεύειν
  choice: phục vụ
  rationale: Phù hợp với trọng tâm của mệnh đề là cách thức phụng sự mới, đồng thời vẫn giữ sắc thái phục vụ dưới quyền một chủ.
- source_word: καινότητι
  choice: trong sự mới mẻ
  rationale: Giữ danh từ trừu tượng và sự đối xứng tu từ với “sự cũ kỹ” trong nguyên văn.
- source_word: πνεύματος
  choice: của Thánh Linh
  rationale: Trong thế đối lập theo cách dùng của Phao-lô giữa πνεῦμα và γράμμα, đây nhiều khả năng chỉ Đức Thánh Linh; khả năng hiểu là “tinh thần” được giữ trong chú thích.
- source_word: παλαιότητι γράμματος
  choice: trong sự cũ kỹ của văn tự
  rationale: Bám sát hai danh từ của nguyên văn và giữ thành ngữ đối lập “Thánh Linh/văn tự,” thay vì giải nghĩa trực tiếp thành một bộ luật thành văn.
theological_decisions:
- issue: Luật pháp chết hay người tin chết trong quan hệ với điều từng giam giữ họ
  choice: 'Người tin là những người đã chết: “vì đã chết đối với điều từng giam giữ mình.”'
  alternative: Luật pháp đã chết trong quan hệ với chúng ta.
  rationale: ἀποθανόντες là phân từ chủ cách số nhiều, quy về chủ thể hàm ẩn “chúng ta”; bản dịch giữ cấu trúc này.
- issue: πνεύματος chỉ Đức Thánh Linh hay tinh thần con người
  choice: “Thánh Linh”
  alternative: “tinh thần”
  rationale: Bối cảnh giao ước mới và thế đối lập của Phao-lô giữa Thánh Linh với văn tự khiến cách hiểu chỉ Đức Thánh Linh có khả năng cao hơn, nhưng ngữ pháp tự thân vẫn cho phép cách hiểu không viết hoa.
- issue: γράμματος là “văn tự” hay “bộ luật thành văn”
  choice: “văn tự”
  alternative: “điều luật thành văn”
  rationale: “Văn tự” trực tiếp hơn và bảo tồn cách diễn đạt cô đọng cùng sức căng thần học của Phao-lô; cách kia làm rõ hơn nhưng mang tính giải nghĩa.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “luật pháp” theo cách quen thuộc trong văn mạch Kinh Thánh; “sự mới mẻ/sự cũ kỹ” giữ tính đối xứng của nguyên văn. “Thánh Linh” được chọn ở chính văn nhưng không xóa bỏ cách hiểu “tinh thần”.
