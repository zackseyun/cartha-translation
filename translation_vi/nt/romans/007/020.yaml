id: ROM.7.20
reference: Romans 7:20
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εἰ δὲ ὃ οὐ ⸀θέλω τοῦτο ποιῶ, οὐκέτι ἐγὼ κατεργάζομαι αὐτὸ ἀλλὰ ἡ οἰκοῦσα ἐν ἐμοὶ ἁμαρτία.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/020.yaml
  text: But if I do what I do not want[a], I am no longer the one doing it, but sin dwelling in me.
translation:
  language: vi
  text: Nhưng nếu tôi làm điều tôi không muốn, thì không còn chính tôi thực hiện điều đó, mà là tội lỗi đang cư ngụ trong tôi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰ δὲ
  choice: Nhưng nếu
  rationale: Giữ quan hệ điều kiện cùng sắc thái tương phản nhẹ, đồng thời nối tiếp lập luận của Phao-lô một cách tự nhiên.
- source_word: ὃ οὐ θέλω τοῦτο ποιῶ
  choice: tôi làm điều mình không muốn
  rationale: 'Diễn đạt tự nhiên trong tiếng Việt hiện đại và vẫn giữ cấu trúc ý nghĩa: chính điều không muốn lại là điều tôi làm.'
- source_word: οὐκέτι ἐγὼ κατεργάζομαι αὐτό
  choice: không còn là tôi thực hiện điều ấy nữa
  rationale: “Không còn… nữa” chuyển tải οὐκέτι; “thực hiện” giúp phân biệt phần nào κατεργάζομαι với ποιῶ đã dịch là “làm”, mà không thêm ý giải thích.
- source_word: ἡ οἰκοῦσα ἐν ἐμοὶ ἁμαρτία
  choice: tội lỗi đang cư ngụ trong tôi
  rationale: Giữ nguyên danh từ “tội lỗi” và hình ảnh nhân cách hóa về việc nó cư ngụ trong con người; không đổi thành “bản tính tội lỗi” vì nguyên văn không dùng σάρξ.
theological_decisions:
- issue: Mối quan hệ giữa chủ thể “tôi” và “tội lỗi đang cư ngụ trong tôi”
  choice: 'Giữ nguyên sự phân biệt đầy căng thẳng trong lời Phao-lô: “không còn là tôi… mà là tội lỗi”.'
  alternative: Diễn giải theo hướng giảm nhẹ trách nhiệm cá nhân hoặc đồng nhất “tội lỗi” với “bản tính tội lỗi”.
  rationale: Nguyên văn trình bày trực tiếp cả “tôi” lẫn “tội lỗi đang cư ngụ trong tôi”; bản dịch không nên tự giải quyết cuộc tranh luận thần học về ý chí, trách nhiệm và tội lỗi nội tại.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Cư ngụ” giữ được hình ảnh οἰκέω mà vẫn quen thuộc trong văn cảnh Kinh Thánh; câu không thêm chủ ngữ hay lời giải thích thần học ngoài nguyên văn.
