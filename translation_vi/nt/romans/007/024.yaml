  to: Khốn khổ thay cho tôi! Ai sẽ giải cứu tôi khỏi thân thể của sự chết này?[a][b]
  rationale: Chỉ sửa câu cảm thán để thành tiếng Việt tự nhiên, vẫn giữ sắc thái thống thiết và sự tự quy chiếu được nhấn mạnh trong nguyên văn. Giữ “thân thể của sự chết này” trong bản chính để bảo tồn cấu trúc và tính mơ hồ của tiếng Hy Lạp; chỉnh nhẹ chú thích a để nhận diện đúng đây là lối diễn đạt tự nhiên hơn, có tính diễn giải.
  reviewer_model: gpt-5.6-terra
