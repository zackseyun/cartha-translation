  text: ταλαίπωρος ἐγὼ ἄνθρωπος· τίς με ῥύσεται ἐκ τοῦ σώματος τοῦ θανάτου τούτου;
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/024.yaml
  text: What a wretched man I am! Who will rescue me from this body of death?[a][b]
translation:
  language: vi
  text: Khốn khổ thay cho tôi! Ai sẽ giải cứu tôi khỏi thân thể của sự chết này?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể diễn đạt tự nhiên hơn: “khỏi thân thể chết chóc này.”'
    reason: lexical_alternative
  - marker: b
    text: “Giải cứu” cũng có thể dịch là “giải thoát.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ταλαίπωρος
  choice: khốn khổ
  rationale: Diễn tả tình trạng đau khổ, bi đát và giữ được sức nặng cảm xúc trong tiếng kêu của Phao-lô.
- source_word: ἐγὼ ἄνθρωπος
  choice: con người tôi
  rationale: Giữ sự nhấn mạnh vào chính người nói và danh từ ἄνθρωπος, đồng thời diễn đạt tự nhiên, trang trọng trong tiếng Việt.
- source_word: τίς
  choice: ai
  rationale: Đại từ nghi vấn chỉ người, hướng tới một đấng hoặc người giải cứu.
- source_word: ῥύσεται
  choice: sẽ giải cứu
  rationale: Diễn tả việc đưa ra khỏi hiểm nguy hoặc cảnh bị trói buộc; vừa rõ nghĩa vừa giữ sắc thái mạnh của động từ Hy Lạp.
- source_word: ἐκ
  choice: khỏi
  rationale: Diễn đạt tự nhiên ý tách ra và thoát khỏi trong ngữ cảnh này.
- source_word: σώματος
  choice: thân thể
  rationale: Giữ hình ảnh cụ thể của σώμα, không diễn giải thành một khái niệm thần học khác.
- source_word: τοῦ θανάτου τούτου
  choice: của sự chết này
  rationale: Bám sát cấu trúc Hy Lạp và bảo tồn khả năng τούτου bổ nghĩa cho θανάτου; tuy hơi khác lối nói thông thường nhưng vẫn rõ và trang trọng trong tiếng Việt.
theological_decisions:
- issue: Quan hệ cú pháp trong cụm τοῦ σώματος τοῦ θανάτου τούτου
  choice: thân thể của sự chết này
  alternative: thân thể chết chóc này
  rationale: Bản chính giữ cấu trúc gần nguyên văn và không âm thầm chuyển lực chỉ định của τούτου từ 'sự chết' sang 'thân thể'. Bản thay thế tự nhiên hơn nhưng mang tính diễn giải hơn.
- issue: Hình ảnh 'thân thể' và 'sự chết'
  choice: giữ nguyên hình ảnh cụ thể mà không xác định đây chỉ là thân thể vật chất hay một thành ngữ thần học
  alternative: đời sống bị sự chết chi phối
  rationale: Nguyên văn chứa sức căng và tính đa nghĩa; diễn giải trừu tượng sẽ giải quyết điều bản văn chưa nói rõ.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Câu cảm thán đảo “Khốn khổ thay con người tôi!” giữ nhịp dồn nén và sắc thái thống thiết của nguyên văn; các chú thích bảo tồn những phương án dịch chính đáng.
