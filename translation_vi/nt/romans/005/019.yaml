id: ROM.5.19
reference: Romans 5:19
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὥσπερ γὰρ διὰ τῆς παρακοῆς τοῦ ἑνὸς ἀνθρώπου ἁμαρτωλοὶ κατεστάθησαν οἱ πολλοί, οὕτως καὶ διὰ τῆς ὑπακοῆς τοῦ ἑνὸς δίκαιοι κατασταθήσονται οἱ πολλοί.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/019.yaml
  text: For just as through the disobedience of the one man the many were made sinners[c][b][a], so also through the obedience of the one man the many will be made righteous.
translation:
  language: vi
  text: Vì cũng như do sự không vâng lời của một người mà nhiều người đã trở thành tội nhân[a], thì cũng vậy, do sự vâng lời của một người[b] mà nhiều người sẽ trở thành người công chính[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đã được xác lập là tội nhân.”'
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn Hy Lạp: “qua sự vâng lời của người ấy”; từ “người” được hiểu theo vế trước.'
    reason: source_clarification
  - marker: c
    text: 'Cũng có thể dịch: “sẽ được xác lập là người công chính.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρακοῆς
  choice: sự không vâng lời
  rationale: Diễn đạt trực tiếp việc không tuân phục, đồng thời giữ thế đối lập với ὑπακοή.
- source_word: τοῦ ἑνὸς ἀνθρώπου
  choice: của một người
  rationale: Tự nhiên trong tiếng Việt và giữ nguyên sự quy chiếu theo ngữ cảnh đến A-đam mà không thêm tên vào câu.
- source_word: ἁμαρτωλοὶ
  choice: tội nhân
  rationale: Tính từ được dùng như danh từ/vị ngữ; “tội nhân” là cách diễn đạt rõ và trang trọng.
- source_word: κατεστάθησαν
  choice: đã bị đặt vào hàng
  rationale: Thể hiện việc được đặt hoặc xác lập trong một địa vị, rõ hơn nghĩa kỹ thuật nhưng không thu hẹp thành một công thức tín lý.
- source_word: οἱ πολλοί
  choice: nhiều người
  rationale: Tiếng Việt không có mạo từ tương ứng tự nhiên với οἱ; “nhiều người” giữ phạm vi mở của cụm từ mà không diễn giải thành “mọi người”.
- source_word: ὑπακοῆς
  choice: sự vâng lời
  rationale: Là từ tương ứng tự nhiên với παρακοή và duy trì phép đối chiếu A-đam/Đấng Christ.
- source_word: τοῦ ἑνὸς
  choice: của một người
  rationale: Dù ἀνθρώπου không lặp lại trong vế sau, “người” được hiểu từ vế trước; bổ sung trong tiếng Việt giúp phép song song rõ ràng.
- source_word: δίκαιοι
  choice: người công chính
  rationale: Giữ trường nghĩa δικ- và diễn đạt tự nhiên địa vị/phẩm chất được nói đến mà không chuyển thành động từ “tuyên xưng công chính”.
- source_word: κατασταθήσονται
  choice: sẽ được đặt vào hàng
  rationale: Giữ sự song song với κατεστάθησαν và sắc thái được xác lập trong một địa vị, không đồng nhất từ này với δικαιόω.
theological_decisions:
- issue: Phạm vi của οἱ πολλοί
  choice: nhiều người
  alternative: mọi người
  rationale: Nguyên văn nói οἱ πολλοί chứ không phải πάντες; bản dịch không giải quyết phạm vi theo lối diễn giải thần học.
- issue: Cách hiểu κατασταθήσονται δίκαιοι
  choice: sẽ được đặt vào hàng người công chính
  alternative: sẽ được tuyên bố là công chính
  rationale: Động từ là καθίστημι, không phải δικαιόω. Cách chọn giữ ngôn ngữ về việc được đặt/xác lập trong một địa vị và bảo toàn độ mở thần học.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cấu trúc “như… thì cũng vậy” giữ phép song song của câu Hy Lạp; “đặt vào hàng” truyền đạt sắc thái địa vị của καθίστημι mà tránh thuật ngữ giáo phái.
