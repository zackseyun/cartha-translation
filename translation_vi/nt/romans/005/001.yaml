id: ROM.5.1
reference: Romans 5:1
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Δικαιωθέντες οὖν ἐκ πίστεως εἰρήνην ⸀ἔχομεν πρὸς τὸν θεὸν διὰ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/001.yaml
  text: Therefore[a], since we have been justified by faith, we have peace with God through our Lord Jesus the Messiah[c][b],
translation:
  language: vi
  text: Vậy, vì đã được xưng công chính bởi đức tin[b], chúng ta có sự bình an với Đức Chúa Trời[a] nhờ Đức Giê-su, Đấng Mê-si[c], là Chúa chúng ta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Một số bản chép tay đọc: “chúng ta hãy có sự bình an với Đức Chúa Trời.”'
    reason: textual_variant
  - marker: b
    text: 'Cũng có thể dịch: “trên cơ sở đức tin.”'
    reason: lexical_alternative
  - marker: c
    text: Tiếng Hy Lạp Christos, nghĩa là “Đấng Mê-si”; theo cách dịch truyền thống là “Đấng Christ” hoặc “Ki-tô.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Δικαιωθέντες
  choice: đã được xưng công chính
  rationale: Phân từ bất định quá khứ thể thụ động của δικαιόω. Cách dịch này giữ sắc thái pháp lý của động từ trong lập luận của Phao-lô mà không diễn giải quá mức thành một công thức thần học đầy đủ.
- source_word: οὖν
  choice: Vậy
  rationale: Diễn tả kết luận rút ra từ lập luận trước đó; “Vậy” tự nhiên và rõ ràng trong tiếng Việt hiện đại.
- source_word: ἐκ πίστεως
  choice: bởi đức tin
  rationale: ἐκ theo nghĩa đen là “từ”, nhưng trong cấu trúc này diễn tả cơ sở hoặc phương diện liên quan đến sự xưng công chính. “Bởi đức tin” vừa quen thuộc vừa sát nghĩa; phương án “trên cơ sở đức tin” được ghi ở chú thích.
- source_word: εἰρήνην
  choice: sự bình an
  rationale: Giữ nghĩa rộng của εἰρήνη là “bình an/hòa bình”, bao gồm mối quan hệ bình an với Đức Chúa Trời, thay vì thu hẹp thành “sự hòa giải” hoặc chỉ cảm giác yên ổn nội tâm.
- source_word: ἔχομεν
  choice: chúng ta có
  rationale: Theo bản văn SBLGNT với động từ ở lối chỉ định, nghĩa là “chúng ta có”. Dị bản ở lối khuyến dụ được bảo lưu trong chú thích.
- source_word: πρὸς τὸν θεὸν
  choice: với Đức Chúa Trời
  rationale: Khi đi với “sự bình an”, πρὸς diễn tả quan hệ giữa con người với Đức Chúa Trời; “với” là cách nói tự nhiên nhất trong tiếng Việt.
- source_word: κυρίου
  choice: Chúa
  rationale: Danh xưng trang trọng và thông dụng tương ứng với κύριος trong ngữ cảnh nói về Đức Giê-su.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Đức Giê-su, Đấng Mê-si
  rationale: Giữ tên Giê-su cùng ý nghĩa tước hiệu của Χριστός. Dấu phẩy và “Đấng” giúp câu tiếng Việt tự nhiên, đồng thời tránh biến tước hiệu thành một tên riêng không còn rõ nghĩa.
theological_decisions:
- issue: Ý nghĩa của Δικαιωθέντες trong thần học Phao-lô
  choice: đã được xưng công chính
  alternative: đã được tuyên là công chính; đã được làm nên công chính
  rationale: Câu này khẳng định hành động xưng công chính đã xảy ra nhưng không tự giải thích đầy đủ bản chất hay cơ chế thần học của hành động ấy. Bản dịch giữ nguyên độ căng giữa các cách hiểu thay vì quyết định thay cho bản văn.
- issue: Ý nghĩa của “bình an với Đức Chúa Trời”
  choice: có sự bình an với Đức Chúa Trời
  alternative: được hòa thuận với Đức Chúa Trời; có sự bình an từ Đức Chúa Trời
  rationale: Cụm từ chủ yếu nói đến mối quan hệ bình an với Đức Chúa Trời. Tuy nhiên, εἰρήνη là “bình an”, không phải trực tiếp là “hòa giải”, nên bản dịch không thu hẹp ý nghĩa của từ.
- issue: Dị bản ἔχομεν / ἔχωμεν
  choice: 'Theo lối chỉ định: “chúng ta có”'
  alternative: 'Theo lối khuyến dụ: “chúng ta hãy có/giữ sự bình an”'
  rationale: Bản văn SBLGNT được cung cấp đọc ἔχομεν. Dị bản ἔχωμεν có chứng cứ bản thảo đáng kể và tạo khác biệt thật về nghĩa, nên được nêu rõ trong chú thích.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “được xưng công chính” để giữ thuật ngữ pháp lý quen thuộc mà không mở rộng thành một hệ thống giáo lý. Dùng “có sự bình an với” thay vì “được hòa giải với” nhằm bảo toàn nghĩa rộng của εἰρήνη. Các dấu chú thích được đặt ngay sau cụm từ liên quan, nên thứ tự xuất hiện là [b], [a], [c].
