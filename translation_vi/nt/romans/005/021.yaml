id: ROM.5.21
reference: Romans 5:21
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἵνα ὥσπερ ἐβασίλευσεν ἡ ἁμαρτία ἐν τῷ θανάτῳ, οὕτως καὶ ἡ χάρις βασιλεύσῃ διὰ δικαιοσύνης εἰς ζωὴν αἰώνιον διὰ Ἰησοῦ Χριστοῦ τοῦ κυρίου ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/021.yaml
  text: so that[a], just as sin reigned in death[c][b], so also grace might reign through righteousness to eternal life through Jesus the Messiah our Lord.
translation:
  language: vi
  text: để, như tội lỗi đã cai trị trong sự chết, thì ân điển cũng cai trị qua sự công chính, dẫn đến sự sống đời đời, qua Giê-su, Đấng Mê-si-a, Chúa chúng ta.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Qua sự công chính” cũng có thể dịch là “qua công lý”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: để
  rationale: Diễn đạt tự nhiên quan hệ mục đích/kết quả của ἵνα với động từ giả định theo sau.
- source_word: ἐβασίλευσεν / βασιλεύσῃ
  choice: đã cai trị / cũng cai trị
  rationale: Giữ nguyên hình ảnh nhân cách hóa mang tính vương quyền; tiếng Việt không cần đánh dấu riêng thức giả định sau cấu trúc “để… thì…”.
- source_word: ἐν τῷ θανάτῳ
  choice: trong sự chết
  rationale: Giữ nghĩa phạm vi của ἐν và cách diễn đạt cô đọng của nguyên văn, không tự ý đổi thành phương tiện “qua sự chết”.
- source_word: ἡ χάρις
  choice: ân điển
  rationale: Thuật ngữ tiếng Việt quen thuộc, trang trọng, đồng thời bảo toàn sự nhân cách hóa đối lập với tội lỗi.
- source_word: διὰ δικαιοσύνης
  choice: qua sự công chính
  rationale: διά với sở hữu cách chỉ phương tiện; “sự công chính” giữ được chiều kích đạo đức và thần học của δικαιοσύνη. Nghĩa gần “công lý” được ghi chú.
- source_word: εἰς ζωὴν αἰώνιον
  choice: dẫn đến sự sống đời đời
  rationale: “Dẫn đến” thể hiện rõ hướng đích của εἰς trong tiếng Việt tự nhiên.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Chúa Giê-su, Đấng Mê-si-a
  rationale: Giữ Χριστός như một tước hiệu có nghĩa; thêm “Chúa” trước tên theo lối xưng hô Cơ Đốc giáo Việt ngữ, còn τοῦ κυρίου ἡμῶν được dịch riêng ở cuối.
- source_word: τοῦ κυρίου ἡμῶν
  choice: Chúa chúng ta
  rationale: Dịch trực tiếp danh hiệu κύριος và đại từ sở hữu, gắn đồng vị với Chúa Giê-su.
theological_decisions:
- issue: Nghĩa của δικαιοσύνη trong văn mạch Phao-lô
  choice: qua sự công chính
  alternative: qua công lý
  rationale: “Sự công chính” là cách dịch chính quen thuộc và bao quát trong văn mạch cứu chuộc; chú thích bảo tồn chiều kích công lý của từ Hy Lạp.
- issue: Χριστός là tước hiệu hay thành tố tên gọi
  choice: Đấng Mê-si-a
  alternative: Đấng Christ / Ki-tô
  rationale: Dùng tước hiệu có nội dung nghĩa thay vì xử lý như một tên riêng; cách chuyển tự “Mê-si-a” dễ hiểu và không nghiêng về truyền thống hệ phái cụ thể.
- issue: Quan hệ của ἵνα với βασιλεύσῃ
  choice: để… thì ân điển cũng cai trị
  alternative: hầu cho… ân điển cũng có thể cai trị
  rationale: Cấu trúc này giữ sắc thái mục đích/kết quả mà không khiến “có thể” bị hiểu sai là ân điển chỉ có khả năng cai trị nhưng chưa chắc thực hiện.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Cặp “như… thể nào, thì… thể ấy” bảo toàn phép so sánh ὥσπερ… οὕτως; các danh từ trừu tượng được giữ để duy trì sự nhân cách hóa của Phao-lô.
