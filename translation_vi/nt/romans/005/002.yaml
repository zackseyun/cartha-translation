source:
  edition: SBLGNT
  text: δι’ οὗ καὶ τὴν προσαγωγὴν ἐσχήκαμεν τῇ πίστει εἰς τὴν χάριν ταύτην ἐν ᾗ ἑστήκαμεν, καὶ καυχώμεθα ἐπ’ ἐλπίδι τῆς δόξης τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/002.yaml
  text: through whom we also have obtained access by faith into this grace in which we stand[a], and we boast in the hope of the glory of God.
translation:
  language: vi
  text: Nhờ Ngài, bởi đức tin, chúng ta cũng đã có được lối vào ân điển này, là ân điển trong đó chúng ta đang đứng; và chúng ta tự hào[a] trong niềm hy vọng về vinh quang của Đức Chúa Trời.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: «vui mừng» hoặc «hân hoan».'
    reason: lexical_alternative
lexical_decisions:
- source_word: δι’ οὗ
  choice: Nhờ Ngài
  rationale: Diễn đạt tự nhiên phương tiện trung gian được chỉ bởi đại từ quan hệ, đồng thời giữ mối liên hệ với Chúa Giê-su Christ ở câu trước.
- source_word: προσαγωγή
  choice: được bước vào
  rationale: Trong cấu trúc εἰς τὴν χάριν, cách dịch này truyền đạt việc được đưa vào hay được tiếp cận một địa vị ân điển, tự nhiên hơn «sự tiếp cận» trong tiếng Việt.
- source_word: τῇ πίστει
  choice: bởi đức tin
  rationale: Giữ cách hiểu công cụ của cách dữ cách và dùng cách diễn đạt quen thuộc, rõ ràng trong tiếng Việt.
- source_word: χάριν
  choice: ân điển
  rationale: Đây là thuật ngữ tiếng Việt đã được xác lập cho χάρις trong văn cảnh thần học của Phao-lô, chỉ ơn lành nhưng không của Đức Chúa Trời.
- source_word: ἑστήκαμεν
  choice: chúng ta đang đứng
  rationale: Thể hoàn thành Hy Lạp nói đến một trạng thái hiện tại phát sinh từ hành động trước đó; «đang đứng» thể hiện rõ trạng thái tiếp diễn ấy.
- source_word: καυχώμεθα
  choice: chúng ta hãnh diện
  rationale: «Hãnh diện» giữ ý nghĩa tích cực của việc tự hào hay khoe mình trong văn cảnh này mà vẫn tự nhiên trong tiếng Việt; chú thích bảo lưu các sắc thái «vui mừng» và «hân hoan».
- source_word: ἐπ’ ἐλπίδι
  choice: trong niềm hy vọng
  rationale: Diễn đạt hy vọng như phạm vi hoặc nền tảng của sự hãnh diện mà không quyết định quá mức quan hệ ngữ nghĩa của giới từ.
- source_word: δόξης τοῦ θεοῦ
  choice: vinh quang của Đức Chúa Trời
  rationale: Phản ánh trực tiếp cấu trúc sở hữu của nguyên văn và giữ giọng văn trang trọng.
theological_decisions:
- issue: Cách dịch καυχώμεθα sao cho giữ được sức căng thần học trong lời Phao-lô
  choice: chúng ta hãnh diện
  alternative: chúng ta vui mừng; chúng ta hân hoan; chúng ta tự hào
  rationale: Động từ này có thể chỉ việc khoe mình hay tự hào theo nghĩa tích cực, nhưng cũng có thể được hiểu là vui mừng hoặc hân hoan. «Hãnh diện» giữ nét tự hào có chủ đích mà không biến câu thành lời khoe khoang tiêu cực; chú thích bảo lưu các khả năng khác.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. «Nhờ Ngài» tránh lặp danh xưng từ câu trước nhưng vẫn rõ quan hệ; dấu chấm phẩy giúp tách hai mệnh đề chính. Dấu chú thích được đặt ngay sau từ «hãnh diện», là từ mà chú thích giải thích.
