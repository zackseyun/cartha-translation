  terminology: “Đức Chúa Trời”, “Con Ngài”, “hòa giải”, và “được cứu” là các thuật ngữ thích hợp, nhất quán và không áp đặt cách diễn giải hệ phái. Chú thích bảo tồn sự mơ hồ có thật của ἐν.
  issues:
