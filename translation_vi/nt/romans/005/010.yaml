  source_fidelity: 'Bản dịch giữ đúng cấu trúc lập luận của câu: εἰ γὰρ là “Vì nếu”, ἐχθροὶ ὄντες là trạng thái trước kia “khi còn là kẻ thù”, hai hình thức bị động của καταλλάσσω được phản ánh bằng “được hòa giải”, và σωθησόμεθα là “sẽ được cứu”. “Nhờ” diễn đạt phù hợp διά với sở hữu cách. Cách hiểu công cụ của ἐν τῇ ζωῇ αὐτοῦ được giữ, đồng thời cách hiểu “trong” được nêu ở chú thích.'
