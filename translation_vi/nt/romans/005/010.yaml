id: ROM.5.10
reference: Romans 5:10
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εἰ γὰρ ἐχθροὶ ὄντες κατηλλάγημεν τῷ θεῷ διὰ τοῦ θανάτου τοῦ υἱοῦ αὐτοῦ, πολλῷ μᾶλλον καταλλαγέντες σωθησόμεθα ἐν τῇ ζωῇ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/010.yaml
  text: For if[a], while we were enemies, we were reconciled to God through the death of his Son, much more, having been reconciled, will we be saved by his life.
translation:
  language: vi
  text: Vì nếu khi còn là kẻ thù, chúng ta đã được hòa giải với Đức Chúa Trời nhờ sự chết của Con Ngài, thì huống chi, khi đã được hòa giải, chúng ta sẽ được cứu nhờ sự sống của Con Ngài.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “chúng ta sẽ được cứu trong sự sống của Con Ngài.”'
    reason: Giới từ ἐν có thể được hiểu theo nghĩa phương tiện (“nhờ”) hoặc theo nghĩa phạm vi/liên kết (“trong”).
lexical_decisions:
- source_word: εἰ γὰρ
  choice: Vì nếu
  rationale: Giữ cả liên từ giải thích γάρ và sắc thái điều kiện của εἰ trong mạch lập luận của Phao-lô.
- source_word: ἐχθροὶ ὄντες
  choice: khi còn là kẻ thù
  rationale: Diễn đạt tự nhiên trạng thái đối nghịch có tính quan hệ trước khi được hòa giải.
- source_word: κατηλλάγημεν τῷ θεῷ
  choice: chúng ta đã được hòa giải với Đức Chúa Trời
  rationale: Thể bị động và phương diện quá khứ được giữ rõ; “với Đức Chúa Trời” là cách nói tự nhiên trong tiếng Việt về sự phục hồi quan hệ.
- source_word: διὰ τοῦ θανάτου τοῦ υἱοῦ αὐτοῦ
  choice: nhờ sự chết của Con Ngài
  rationale: “Nhờ” thể hiện διά với sở hữu cách theo nghĩa phương tiện; “Con Ngài” giữ nguyên danh xưng quan hệ của bản Hy Lạp.
- source_word: πολλῷ μᾶλλον
  choice: thì huống chi
  rationale: Cách nói tiếng Việt tự nhiên, giữ sức mạnh của lập luận từ điều lớn hơn đến điều càng chắc chắn hơn.
- source_word: καταλλαγέντες
  choice: một khi đã được hòa giải
  rationale: Cho thấy hành động hòa giải xảy ra trước động từ tương lai “sẽ được cứu” mà không làm câu nặng nề.
- source_word: σωθησόμεθα
  choice: chúng ta sẽ được cứu
  rationale: Giữ nguyên thể bị động và hướng tương lai của σωθησόμεθα.
- source_word: ἐν τῇ ζωῇ αὐτοῦ
  choice: nhờ sự sống của Con ấy
  rationale: “Nhờ” thể hiện cách hiểu phương tiện/nguyên nhân phù hợp với thế đối xứng giữa sự chết và sự sống; “Con ấy” làm rõ đại từ quy chiếu về Người Con mà không thêm danh xưng ngoài nguyên văn.
theological_decisions:
- issue: Ý nghĩa của ἐν τῇ ζωῇ αὐτοῦ
  choice: 'theo nghĩa phương tiện: “nhờ sự sống của Con ấy”'
  alternative: 'theo nghĩa phạm vi/liên kết: “trong sự sống của Con ấy”'
  rationale: Sự tương phản trực tiếp với “nhờ sự chết của Con Ngài” ủng hộ nghĩa phương tiện, nhưng giới từ ἐν vẫn có thể giữ nghĩa “trong”; vì vậy phương án kia được ghi ở chú thích để bảo tồn độ mở của nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Chúa Trời” và đại từ tôn kính “Ngài”; giữ các thuật ngữ thần học cốt lõi “hòa giải” và “được cứu” mà không diễn giải theo hệ phái.
