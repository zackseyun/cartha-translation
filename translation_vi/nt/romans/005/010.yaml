revisions:
- from: Vì nếu khi còn là kẻ thù, chúng ta đã được hòa giải với Đức Chúa Trời nhờ sự chết của Con Ngài, thì huống chi, một khi đã được hòa giải, chúng ta sẽ được cứu nhờ sự sống của Con ấy.[a]
  to: Vì nếu khi còn là kẻ thù, chúng ta đã được hòa giải với Đức Chúa Trời nhờ sự chết của Con Ngài, thì huống chi, khi đã được hòa giải, chúng ta sẽ được cứu nhờ sự sống của Con Ngài.[a]
  rationale: Thay “một khi đã được hòa giải” bằng “khi đã được hòa giải” để diễn đạt gọn hơn chức năng của phân từ aorist καταλλαγέντες, và thay “Con ấy” bằng “Con Ngài” để câu tự nhiên, rõ quy chiếu và nhất quán với danh xưng đã dùng. Nghĩa, thể bị động, trình tự hòa giải trước sự cứu rỗi tương lai, và độ mở diễn giải của ἐν đều được giữ nguyên.
