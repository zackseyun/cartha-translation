id: ROM.5.9
reference: Romans 5:9
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: πολλῷ οὖν μᾶλλον δικαιωθέντες νῦν ἐν τῷ αἵματι αὐτοῦ σωθησόμεθα δι’ αὐτοῦ ἀπὸ τῆς ὀργῆς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/009.yaml
  text: Much more then[a], having now been justified by his blood[c][b], we shall be saved through him from the wrath.
translation:
  language: vi
  text: Vậy, huống chi nay chúng ta đã được xưng công chính[a] nhờ máu của ngài[b], thì chúng ta sẽ nhờ ngài mà được cứu khỏi cơn thịnh nộ[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “được tuyên bố là công chính.”'
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn cũng có thể dịch sát hơn: “trong máu của ngài” hoặc “bởi máu của ngài.”'
    reason: lexical_alternative
  - marker: c
    text: Tức là cơn thịnh nộ của Đức Chúa Trời được hàm ý trong ngữ cảnh.
    reason: cross_reference
lexical_decisions:
- source_word: πολλῷ οὖν μᾶλλον
  choice: Vậy, huống chi
  rationale: “Vậy” giữ quan hệ suy luận của οὖν với câu trước; “huống chi” diễn đạt tự nhiên lập luận tăng tiến của πολλῷ ... μᾶλλον trong tiếng Việt.
- source_word: δικαιωθέντες
  choice: đã được xưng công chính
  rationale: Thể phân từ aorist bị động chỉ hành động đã xảy ra trước động từ chính ở tương lai. “Được xưng công chính” giữ sắc thái pháp lý của δικαιόω và tính nhất quán của thuật ngữ Phao-lô.
- source_word: νῦν
  choice: nay
  rationale: Giữ ý nghĩa thời gian hiện tại và tạo văn phong trang trọng, gọn, tự nhiên.
- source_word: ἐν τῷ αἵματι αὐτοῦ
  choice: nhờ máu của ngài
  rationale: ἐν ở đây có thể biểu thị phương tiện hoặc cơ sở. “Nhờ máu của ngài” tự nhiên trong tiếng Việt, không diễn giải thêm ý nghĩa hy sinh hay chuộc tội vốn không được nói rõ trong cụm từ.
- source_word: σωθησόμεθα
  choice: chúng ta sẽ ... được cứu
  rationale: Giữ nguyên thì tương lai và thể bị động, qua đó bảo toàn phương diện cứu rỗi còn ở phía trước trong câu này.
- source_word: δι’ αὐτοῦ
  choice: nhờ ngài
  rationale: διά với sở hữu cách diễn tả trung gian hoặc tác nhân; “nhờ ngài” là cách nói tự nhiên và phân biệt được với cụm từ nói về máu.
- source_word: ἀπὸ τῆς ὀργῆς
  choice: khỏi cơn thịnh nộ
  rationale: “Khỏi” diễn đạt sự giải cứu ra khỏi điều được nói đến; “cơn thịnh nộ” giữ tính xác định và sức nặng của cụm Hy Lạp mà không tự ý thêm “của Đức Chúa Trời” vào chính văn.
theological_decisions:
- issue: Ý nghĩa của ngôn ngữ xưng công chính trong δικαιωθέντες
  choice: Giữ “được xưng công chính” trong chính văn
  alternative: được tuyên bố là công chính
  rationale: Cách dịch này bảo toàn thuật ngữ pháp lý quen thuộc của Phao-lô nhưng không giải quyết thay cho bản văn cách thức sự xưng công chính vận hành.
- issue: Đối tượng sở hữu của τῆς ὀργῆς
  choice: Dịch “cơn thịnh nộ” mà không thêm chủ sở hữu trong chính văn
  alternative: cơn thịnh nộ của Đức Chúa Trời
  rationale: Ngữ cảnh hàm ý đây là cơn thịnh nộ của Đức Chúa Trời, nhưng bản Hy Lạp không nêu danh xưng ấy; chú thích làm rõ hàm ý mà không thêm từ vào chính văn.
- issue: Giá trị của ἐν trong cụm nói về máu
  choice: Dịch theo phương tiện/cơ sở là “nhờ máu của ngài”
  alternative: trong máu của ngài; bởi máu của ngài
  rationale: Giữ khả năng công cụ của giới từ trong ngữ cảnh này, đồng thời ghi nhận cách dịch sát hình thức hơn trong chú thích thay vì áp đặt một lý thuyết chuộc tội cụ thể.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “ngài” để quy chiếu về Chúa Cứu Thế mà không thêm danh xưng không có trong câu Hy Lạp. Cấu trúc “Vậy, huống chi ... thì ...” tái hiện rõ lập luận tăng tiến của Phao-lô.
