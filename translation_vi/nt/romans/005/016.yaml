revisions:
- from: Món quà cũng không giống như điều đến qua một người đã phạm tội. Vì sự phán xét từ một lần phạm tội[a] đã dẫn đến sự kết án, còn ân tặng từ nhiều lần phạm tội lại dẫn đến sự tuyên công chính.[b]
  to: Và món quà không giống với điều đã đến qua một người đã phạm tội. Vì sự phán xét từ một lần phạm tội[a] đã dẫn đến sự kết án, còn ân tặng từ nhiều lần phạm tội lại dẫn đến sự tuyên công chính[b].
  rationale: Chỉnh rất nhẹ để tăng độ tự nhiên và chuẩn hóa vị trí ký hiệu chú thích. Không thay đổi ý nghĩa, tính đối chiếu pháp lý, hay các điểm đa nghĩa đã được bảo lưu trong chú thích.
