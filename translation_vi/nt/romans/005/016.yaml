id: ROM.5.16
reference: Romans 5:16
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ οὐχ ὡς δι’ ἑνὸς ἁμαρτήσαντος τὸ δώρημα· τὸ μὲν γὰρ κρίμα ἐξ ἑνὸς εἰς κατάκριμα, τὸ δὲ χάρισμα ἐκ πολλῶν παραπτωμάτων εἰς δικαίωμα.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/016.yaml
  text: And the gift is not like what came through the one who sinned[a]. For the judgment from one trespass led to condemnation[c][b], but the gracious gift from many trespasses led to justification.
translation:
  language: vi
  text: Và món quà không giống với điều đã đến qua một người đã phạm tội. Vì sự phán xét từ một lần phạm tội[a] đã dẫn đến sự kết án, còn ân tặng từ nhiều lần phạm tội lại dẫn đến sự tuyên công chính[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “từ một người.”'
    reason: lexical_alternative
  - marker: b
    text: 'Hoặc: “một phán quyết công chính” hay “sự tha bổng.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: δώρημα
  choice: món quà
  rationale: Danh từ này chỉ một vật được ban tặng. “Món quà” tự nhiên, rõ nghĩa và không thêm sắc thái ngoài văn bản.
- source_word: δι’ ἑνὸς ἁμαρτήσαντος
  choice: qua một người đã phạm tội
  rationale: Giữ tham chiếu cá nhân và cấu trúc cô đọng của tiếng Hy Lạp, không tự ý thay bằng “tội lỗi của một người” hay nêu đích danh A-đam.
- source_word: κρίμα
  choice: sự phán xét
  rationale: Chỉ quyết định mang tính tư pháp và tạo vế đối lập với sự kết án cùng sự tuyên công chính.
- source_word: ἐξ ἑνὸς
  choice: từ một lần phạm tội
  rationale: Giống trung của ἑνός và sự đối chiếu với “nhiều lần phạm tội” ở vế sau ủng hộ việc hiểu đây là một hành vi phạm tội; chú thích giữ lại khả năng hiểu là một người.
- source_word: κατάκριμα
  choice: sự kết án
  rationale: Diễn đạt tự nhiên sắc thái tư pháp của một phán quyết lên án.
- source_word: χάρισμα
  choice: ân tặng
  rationale: “Ân tặng” giữ mối liên hệ của χάρισμα với ân điển và phân biệt từ này với δώρημα ở đầu câu.
- source_word: παραπτωμάτων
  choice: những lần phạm tội
  rationale: Diễn đạt rõ các hành vi vi phạm trong số nhiều, phù hợp với đối chiếu “một” và “nhiều”.
- source_word: δικαίωμα
  choice: sự tuyên công chính
  rationale: Trong thế đối lập tư pháp với κατάκριμα, cụm này diễn tả kết quả được tuyên là công chính mà không làm mất sắc thái phán quyết.
theological_decisions:
- issue: Ý nghĩa tư pháp của δικαίωμα đối lập với κατάκριμα
  choice: sự tuyên công chính
  alternative: phán quyết công chính; sự tha bổng
  rationale: Cấu trúc câu đối chiếu sự phán xét dẫn đến kết án với ân tặng dẫn đến δικαίωμα. “Sự tuyên công chính” giữ được tính tư pháp và thuật ngữ Phao-lô, còn chú thích bảo lưu các cách diễn đạt cụ thể hơn.
- issue: Tham chiếu của ἐξ ἑνὸς
  choice: một lần phạm tội
  alternative: một người
  rationale: Sự tương phản trực tiếp với “nhiều lần phạm tội” khiến cách hiểu chỉ một hành vi phạm tội có sức nặng hơn, nhưng hình thức Hy Lạp vẫn cô đọng nên khả năng chỉ một người được ghi trong chú thích.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Bản dịch giữ cấu trúc đối lập tư pháp của câu và phân biệt δώρημα (“món quà”) với χάρισμα (“ân tặng”), đồng thời dùng chú thích để bảo lưu những điểm cô đọng hoặc đa nghĩa trong nguyên văn.
