source:
  edition: SBLGNT
  text: νόμος δὲ παρεισῆλθεν ἵνα πλεονάσῃ τὸ παράπτωμα· οὗ δὲ ἐπλεόνασεν ἡ ἁμαρτία, ὑπερεπερίσσευσεν ἡ χάρις,
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/020.yaml
  text: The law came in alongside so that the trespass might increase; but where sin increased, grace overflowed all the more,
translation:
  language: vi
  text: Luật pháp đã được thêm vào[a] để sự vi phạm[b] gia tăng; nhưng nơi nào tội lỗi gia tăng, ân điển lại càng dư dật hơn bội phần.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đã đi vào bên cạnh” hoặc “đã đi vào như một điều thêm vào”; động từ Hy Lạp gợi ý việc đi vào bên cạnh hay được bổ sung.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “sự phạm tội” hoặc “lỗi phạm”.'
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể dịch: “ân điển càng tràn đầy hơn nữa” hoặc “ân điển càng dư dật hơn nhiều”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: νόμος
  choice: Luật pháp
  rationale: Trong văn mạch Phao-lô và với mạo từ, từ này tự nhiên chỉ về luật pháp Môi-se; “Luật pháp” là cách gọi quen thuộc, trang trọng và dễ hiểu.
- source_word: παρεισῆλθεν
  choice: đã vào thêm
  rationale: Giữ sắc thái đi vào bên cạnh hoặc được thêm vào của tiền tố παρα-, đồng thời diễn đạt tự nhiên trong tiếng Việt.
- source_word: ἵνα πλεονάσῃ
  choice: để ... gia tăng
  rationale: Giữ lực mục đích của ἵνα với động từ giả định, không làm nhẹ thành một kết quả đơn thuần và cũng không giải quyết thay người đọc sự căng thẳng thần học.
- source_word: τὸ παράπτωμα
  choice: sự vi phạm
  rationale: Diễn đạt một hành vi vượt quá giới hạn hay phạm lỗi cụ thể; phù hợp với văn mạch về sự vi phạm của A-đam và tự nhiên hơn “sự xâm phạm” trong tiếng Việt.
- source_word: οὗ
  choice: nơi nào
  rationale: Chuyển tải tự nhiên ý trạng từ quan hệ “ở nơi đâu” trong cấu trúc tương phản.
- source_word: ἁμαρτία
  choice: tội lỗi
  rationale: Thuật ngữ tiếng Việt tiêu chuẩn cho ἁμαρτία trong văn mạch Phao-lô.
- source_word: ὑπερεπερίσσευσεν
  choice: càng tràn đầy hơn nữa
  rationale: Động từ ghép có sắc thái tăng cường vượt quá sự gia tăng thông thường; cách dịch này giữ hình ảnh dư dật và cường độ mạnh.
- source_word: ἡ χάρις
  choice: ân điển
  rationale: Thuật ngữ Kinh Thánh tiếng Việt quen thuộc, diễn đạt sự ban ơn nhưng không hàm ý công trạng của người nhận.
theological_decisions:
- issue: Lực của ἵνα trong lời khẳng định rằng luật pháp vào thêm để sự vi phạm gia tăng.
  choice: 'Dịch theo mục đích: “để sự vi phạm gia tăng”.'
  alternative: “khiến sự vi phạm gia tăng” hoặc “và kết quả là sự vi phạm gia tăng”.
  rationale: Cấu trúc Hy Lạp dùng ἵνα với động từ giả định, nên bản dịch giữ lực mục đích và sự căng thẳng thần học của câu, không tự ý biến nó thành kết quả thuần túy hay hàm ý Đức Chúa Trời tán thành tội lỗi.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dấu chấm phẩy giữ thế đối lập cân xứng của câu Hy Lạp; các từ “gia tăng” được lặp lại có chủ ý, còn động từ chỉ ân điển được diễn đạt mạnh hơn để phản ánh ὑπερεπερίσσευσεν.
