id: ROM.5.5
reference: Romans 5:5
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἡ δὲ ἐλπὶς οὐ καταισχύνει· ὅτι ἡ ἀγάπη τοῦ θεοῦ ἐκκέχυται ἐν ταῖς καρδίαις ἡμῶν διὰ πνεύματος ἁγίου τοῦ δοθέντος ἡμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/005.yaml
  text: And hope does not put to shame[a], because the love of God has been poured out in our hearts through the Holy Spirit[b], who was given to us.
translation:
  language: vi
  text: Niềm hy vọng không làm chúng ta phải hổ thẹn[a], vì tình yêu của Đức Chúa Trời[b] đã được tuôn đổ vào lòng chúng ta qua Đức Thánh Linh, Đấng đã được ban cho chúng ta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “không làm chúng ta thất vọng.”'
    reason: lexical_alternative
  - marker: b
    text: Cụm từ này chủ yếu có nghĩa là tình yêu Đức Chúa Trời dành cho chúng ta; cách hiểu ít khả dĩ hơn là tình yêu của chúng ta dành cho Đức Chúa Trời.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐλπίς
  choice: niềm hy vọng
  rationale: Cách diễn đạt tự nhiên trong tiếng Việt, giữ nghĩa danh từ trừu tượng và sắc thái khái quát của mạo từ Hy Lạp.
- source_word: δέ
  choice: không dịch thành từ nối riêng
  rationale: δέ là liên từ nhẹ; trong tiếng Việt, mạch văn tự nhiên không nhất thiết cần thêm “và” hay “nhưng”, vốn có thể nhấn mạnh quá mức.
- source_word: καταισχύνει
  choice: không làm chúng ta phải hổ thẹn
  rationale: Giữ sắc thái cốt lõi về sự hổ thẹn của động từ, đồng thời bổ sung tân ngữ “chúng ta” theo nghĩa hàm ẩn để câu tiếng Việt tự nhiên.
- source_word: ἀγάπη
  choice: tình yêu
  rationale: Tương đương thông dụng, trang trọng và dễ hiểu của ἀγάπη.
- source_word: τοῦ θεοῦ
  choice: của Đức Chúa Trời
  rationale: Giữ cấu trúc sở hữu có phần mơ hồ của nguyên văn thay vì giải nghĩa hoàn toàn ngay trong chính văn.
- source_word: ἐκκέχυται
  choice: đã được tuôn đổ
  rationale: 'Diễn đạt thể hoàn thành: hành động đã xảy ra và kết quả vẫn còn; “tuôn đổ” giữ hình ảnh mạnh của động từ Hy Lạp.'
- source_word: ἐν ταῖς καρδίαις ἡμῶν
  choice: vào lòng chúng ta
  rationale: “Lòng” là cách nói tự nhiên trong tiếng Việt về trung tâm đời sống nội tâm; “vào” phù hợp với hình ảnh tuôn đổ, dù giới từ Hy Lạp theo hình thức là “trong”.
- source_word: διὰ πνεύματος ἁγίου
  choice: qua Đức Thánh Linh
  rationale: διά với sở hữu cách chỉ phương tiện hoặc trung gian; danh xưng được viết hoa theo ngữ cảnh chỉ về Thánh Linh của Đức Chúa Trời.
- source_word: τοῦ δοθέντος ἡμῖν
  choice: Đấng đã được ban cho chúng ta
  rationale: Phân từ bổ nghĩa cho Đức Thánh Linh; “Đấng” diễn đạt tự nhiên một chủ thể có ngôi vị và giữ thể bị động của nguyên văn.
theological_decisions:
- issue: Ý nghĩa của sở hữu cách trong ἡ ἀγάπη τοῦ θεοῦ
  choice: tình yêu của Đức Chúa Trời, được hiểu chủ yếu là tình yêu Đức Chúa Trời dành cho chúng ta
  alternative: tình yêu của chúng ta dành cho Đức Chúa Trời
  rationale: Cấu trúc Hy Lạp có thể mang cả hai hướng nghĩa, nhưng việc tình yêu ấy được tuôn đổ vào lòng chúng ta qua Đức Thánh Linh trong mệnh đề nguyên nhân nghiêng mạnh về tình yêu xuất phát từ Đức Chúa Trời. Chính văn giữ cấu trúc tương đối mở, còn chú thích nêu cách hiểu kém khả dĩ hơn.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “Đức Chúa Trời” và “Đức Thánh Linh” nhất quán; giữ hình ảnh “tuôn đổ” và sự mơ hồ chân thực của cụm sở hữu cách, đồng thời làm rõ các phương án trong chú thích.
