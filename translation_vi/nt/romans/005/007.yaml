id: ROM.5.7
reference: Romans 5:7
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: μόλις γὰρ ὑπὲρ δικαίου τις ἀποθανεῖται· ὑπὲρ γὰρ τοῦ ἀγαθοῦ τάχα τις καὶ τολμᾷ ἀποθανεῖν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/007.yaml
  text: For hardly will anyone die for a righteous person[b][a]; though perhaps for a good person someone might even dare to die.
translation:
  language: vi
  text: Vì hiếm khi có ai chịu chết vì một người công chính; có lẽ vì một người tốt thì có người còn dám chết.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μόλις
  choice: hiếm có
  rationale: Diễn đạt tự nhiên ý một việc hầu như không xảy ra trong lời khái quát này, đồng thời giữ sức nhấn của nguyên văn.
- source_word: ὑπὲρ
  choice: thay cho / vì
  rationale: Trong vế đầu, “chết thay cho” làm rõ sắc thái chết vì lợi ích hoặc đại diện cho người khác; ở vế sau, “vì” tránh lặp nặng nề mà vẫn giữ cùng quan hệ cơ bản.
- source_word: δικαίου
  choice: một người công chính
  rationale: Tính từ được dùng như danh từ, chỉ người có đặc tính công chính. “Người” thể hiện nghĩa khái quát; “công chính” giữ thuật ngữ luân lý-thần học của Phao-lô.
- source_word: ἀποθανεῖται
  choice: chịu chết
  rationale: Thì tương lai Hy Lạp nằm trong một mệnh đề khái quát. “Chịu chết” là cách nói tự nhiên trong tiếng Việt và nhấn mạnh sự tự nguyện được hàm ý bởi việc chết cho người khác.
- source_word: τοῦ ἀγαθοῦ
  choice: một người tốt
  rationale: Giữ phân biệt từ vựng với “người công chính”, không tự ý đồng nhất hai phạm trù.
- source_word: τάχα
  choice: có lẽ
  rationale: Biểu thị khả năng dè dặt, phù hợp với giọng cân nhắc của câu.
- source_word: καὶ
  choice: còn
  rationale: 'Trong cấu trúc tiếng Việt, “còn dám” mang sắc thái tăng tiến tương ứng với καί: thậm chí có thể dám làm điều ấy.'
- source_word: τολμᾷ
  choice: dám
  rationale: Chuyển trực tiếp ý can đảm hoặc sẵn lòng làm một việc khác thường; kết hợp tự nhiên với “có lẽ” và động từ “chết”.
- source_word: ἀποθανεῖν
  choice: chết
  rationale: Giữ sự lặp lại chủ đề chết ở cả hai vế, như nguyên văn.
theological_decisions:
- issue: Có nên giữ sự phân biệt giữa δικαίου và ἀγαθοῦ hay không
  choice: Dịch phân biệt là “người công chính” và “người tốt”.
  alternative: Xem hai từ gần như đồng nghĩa và dùng cùng một cách diễn đạt.
  rationale: Nguyên văn dùng hai từ khác nhau, và sự chuyển đổi có thể có chủ ý. Bản dịch giữ nguyên độ căng và không quyết định thay tác giả rằng khác biệt chỉ là văn phong.
- issue: Sắc thái của ὑπέρ trong cái chết vì người khác
  choice: Dùng “thay cho” ở vế đầu và “vì” ở vế sau.
  alternative: Dùng “vì” ở cả hai vế hoặc “thay cho” ở cả hai vế.
  rationale: “Thay cho” giúp người đọc nhận ra chiều kích chết cho lợi ích hoặc đại diện cho người khác, nhưng không biến câu thành một công thức giáo lý kỹ thuật; “vì” ở vế sau giữ câu tự nhiên.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Câu giữ hai vế tương phản của Hy Lạp; dùng “tuy vậy” để diễn đạt chuyển ý mà không làm mất tính dè dặt của “có lẽ”. Đại từ chỉ người mang nghĩa khái quát, không giới hạn giới tính.
