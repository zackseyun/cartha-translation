  text: ἄχρι γὰρ νόμου ἁμαρτία ἦν ἐν κόσμῳ, ἁμαρτία δὲ οὐκ ἐλλογεῖται μὴ ὄντος νόμου,
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/013.yaml
  text: For until the law[a], sin was in the world; but sin is not counted where there is no law.
translation:
  language: vi
  text: Vì cho đến khi có luật pháp, tội lỗi đã có trong thế gian; nhưng khi không có luật pháp thì tội lỗi không bị kể vào sổ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “không bị tính vào”, “không bị quy vào”, hoặc “không bị ghi vào tài khoản.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄχρι γὰρ νόμου
  choice: Vì trước khi có Luật pháp
  rationale: Trong mạch lập luận từ A-đam đến Môi-se, cụm này chỉ thời kỳ trước khi Luật pháp Môi-se được ban. “Trước khi có” diễn đạt tự nhiên giá trị thời gian của ἄχρι mà không hàm ý tội lỗi chấm dứt khi Luật pháp xuất hiện.
- source_word: νόμου
  choice: Luật pháp / luật pháp
  rationale: Lần đầu viết hoa để biểu thị Luật pháp Môi-se theo văn cảnh; lần sau giữ chữ thường vì câu nói có dạng nguyên tắc khái quát, đồng thời không loại trừ mối liên hệ với Luật pháp vừa nhắc đến.
- source_word: ἁμαρτία
  choice: tội lỗi
  rationale: Giữ danh từ số ít mang tính khái quát của Phao-lô, vừa chỉ thực tại tội lỗi vừa không làm mất sắc thái có thể được nhân cách hóa.
- source_word: ἐν κόσμῳ
  choice: ở trong thế gian
  rationale: Cách nói rõ ràng, trang trọng và tự nhiên trong tiếng Việt, chỉ thế giới loài người nơi tội lỗi hiện diện.
- source_word: ἐλλογεῖται
  choice: bị kể vào tài khoản
  rationale: Giữ hình ảnh kế toán của động từ, tức một khoản được ghi hay tính vào tài khoản của ai đó, mà không dùng thuật ngữ thần học nặng tính hệ phái.
- source_word: μὴ ὄντος νόμου
  choice: khi không có luật pháp
  rationale: Diễn đạt phân từ sở hữu cách tuyệt đối như một hoàn cảnh hoặc điều kiện; “khi” giữ sắc thái thời gian phù hợp với lập luận của câu.
theological_decisions:
- issue: Đối tượng được chỉ bởi νόμος
  choice: Dùng “Luật pháp” ở lần đầu, ngầm chỉ Luật pháp Môi-se theo văn cảnh
  alternative: Dùng “luật” hoàn toàn theo nghĩa khái quát
  rationale: Phần văn mạch đối chiếu thời kỳ từ A-đam đến Môi-se với thời kỳ Luật pháp được ban. Bản dịch để văn cảnh xác định đối tượng mà không thêm “Môi-se” vào chính văn.
- issue: Phạm vi của lần xuất hiện thứ hai của νόμος
  choice: Dùng “luật pháp” chữ thường để bảo toàn khả năng câu cuối mang tính nguyên tắc khái quát
  alternative: Dùng “Luật pháp” chữ hoa để đồng nhất hoàn toàn với Luật pháp Môi-se
  rationale: Tiếng Hy Lạp không có mạo từ ở cả hai lần. Việc phân biệt kiểu chữ trong tiếng Việt giúp phản ánh cả mối liên hệ văn cảnh lẫn độ mở của phát biểu.
- issue: Ý nghĩa thần học của ἐλλογεῖται
  choice: Dịch bằng hình ảnh kế toán “bị kể vào tài khoản”
  alternative: “bị quy tội”, “bị kể là tội” hoặc “bị quy vào”
  rationale: Cách dịch này tránh quyết định thay người đọc rằng câu phủ nhận mọi trách nhiệm đạo đức hay chỉ nói đến việc hạch toán tội theo luật thành văn; đồng thời bảo tồn sức căng của lập luận.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Tài khoản” được dùng theo nghĩa ẩn dụ kế toán; chú thích cung cấp các cách nói gọn hơn. Dấu [a] xuất hiện ngay sau cụm từ liên quan trong chính văn.
