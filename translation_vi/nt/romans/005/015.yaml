id: ROM.5.15
reference: Romans 5:15
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἀλλ’ οὐχ ὡς τὸ παράπτωμα, οὕτως καὶ τὸ χάρισμα· εἰ γὰρ τῷ τοῦ ἑνὸς παραπτώματι οἱ πολλοὶ ἀπέθανον, πολλῷ μᾶλλον ἡ χάρις τοῦ θεοῦ καὶ ἡ δωρεὰ ἐν χάριτι τῇ τοῦ ἑνὸς ἀνθρώπου Ἰησοῦ Χριστοῦ εἰς τοὺς πολλοὺς ἐπερίσσευσεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/015.yaml
  text: But the gift is not like the trespass[a]. For if by the trespass of the one man the many died, much more the grace of God and the gift by the grace of the one man, Jesus the Messiah[b], overflowed to the many.
translation:
  language: vi
  text: Nhưng ân ban không giống như sự vi phạm. Vì nếu do sự vi phạm của một người mà nhiều người đã chết, thì ân điển của Đức Chúa Trời và tặng phẩm trong ân điển của một người là Đức Giê-su, Đấng Mê-si-a,[a] đã tuôn tràn đến nhiều người hơn biết bao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “Đức Giê-su Christ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: παράπτωμα
  choice: sự sa phạm
  rationale: Chỉ hành vi sai phạm của A-đam, giữ được sắc thái đạo đức và ý niệm sa ngã mà không quá chuyên môn.
- source_word: χάρισμα
  choice: ân tứ
  rationale: Diễn đạt món quà được ban bởi ân điển, đồng thời tạo thế đối lập gọn với 'sự sa phạm'.
- source_word: οἱ πολλοί / τοὺς πολλούς
  choice: số đông
  rationale: Giữ thế đối chiếu mang tính đại diện giữa 'một người' và 'số đông', không tự ý giải thành 'tất cả'.
- source_word: ἡ χάρις τοῦ θεοῦ
  choice: ân điển của Đức Chúa Trời
  rationale: Giữ cấu trúc sở hữu của tiếng Hy Lạp và dùng thuật ngữ trang trọng, quen thuộc trong tiếng Việt Cơ Đốc.
- source_word: ἡ δωρεὰ ἐν χάριτι
  choice: tặng phẩm trong ân điển
  rationale: Giữ tương đối trực tiếp giới từ ἐν cùng mối liên hệ giữa tặng phẩm và ân điển, không thu hẹp dứt khoát thành phương tiện hay nguyên nhân.
- source_word: τοῦ ἑνὸς ἀνθρώπου
  choice: của một người
  rationale: Duy trì phép đối chiếu 'một người/số đông'; ngữ cảnh đã xác định rõ nhân vật nên tiếng Việt không cần thêm từ chỉ định.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Đức Giê-su, Đấng Mê-si-a
  rationale: Thể hiện Χριστός như tước hiệu Mê-si-a, đồng thời dùng hình thức tiếng Việt tự nhiên và tôn kính.
- source_word: ἐπερίσσευσεν
  choice: tuôn tràn
  rationale: Truyền đạt sinh động ý nghĩa dư dật, vượt mức của động từ περισσεύω và phù hợp với lập luận 'lại càng... biết bao'.
theological_decisions:
- issue: Phạm vi của οἱ πολλοί / τοὺς πολλούς trong phép đối chiếu A-đam–Đấng Mê-si-a
  choice: Dịch là 'số đông', không giải thành 'tất cả'.
  alternative: Dịch là 'mọi người' để làm rõ phạm vi đại diện.
  rationale: Câu này chủ ý dùng cấu trúc một người/số đông; giữ nguyên sức căng của lối diễn đạt tránh đưa kết luận thần học rộng hơn vào riêng câu này.
- issue: Quan hệ ngữ nghĩa trong ἡ δωρεὰ ἐν χάριτι
  choice: Giữ cách nói 'tặng phẩm trong ân điển'.
  alternative: Dịch 'tặng phẩm bởi ân điển' hoặc 'tặng phẩm đến nhờ ân điển'.
  rationale: ἐν có thể mang sắc thái phạm vi, liên hệ hoặc phương tiện; cách dịch đã chọn bảo tồn độ mở thay vì buộc câu theo một quan hệ duy nhất.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Cấu trúc một người/số đông được giữ rõ; câu cuối đảo 'lại càng... biết bao' theo cú pháp tự nhiên của tiếng Việt. Dấu chú thích [a] đặt ngay sau tước hiệu tương ứng.
