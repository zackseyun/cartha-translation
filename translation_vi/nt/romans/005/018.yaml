revisions:
- from: Vậy nên, cũng như bởi một sự vi phạm mà sự kết án đến với mọi người, thì cũng vậy, bởi một hành động công chính mà sự tuyên công chính đem lại sự sống đến với mọi người.[a]
  to: Vậy nên, cũng như qua một sự vi phạm, sự kết án đã đến trên mọi người, thì cũng vậy, qua một hành động công chính, sự xưng công chính dẫn đến sự sống đã đến trên mọi người.[a]
  rationale: Bản sửa giữ nguyên phạm vi “mọi người” ở cả hai vế và không giải quyết thay văn bản căng thẳng thần học của câu. “Qua” phản ánh διὰ cách tự nhiên; “đến trên” phản ánh hướng đến/kết cục của εἰς trong cấu trúc đối xứng. “Sự xưng công chính dẫn đến sự sống” diễn đạt rõ quan hệ có thể có của ζωῆς, trong khi chú thích bảo lưu cách đọc sát chữ hơn mà không khẳng định một phân tích thần học duy nhất.
  reviewer_model: gpt-5.6-terra
