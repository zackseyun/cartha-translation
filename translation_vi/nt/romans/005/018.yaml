    issue: “Sự tuyên công chính” hơi gượng trong tiếng Việt Kinh Thánh hiện đại.
    rationale: “Sự xưng công chính” là cách gọi tự nhiên hơn cho δικαίωσις và vẫn phân biệt với sự biến đổi phẩm chất đạo đức.
