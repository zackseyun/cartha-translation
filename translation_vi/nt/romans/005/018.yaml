    rationale: 'Nguyên văn đặt song song εἰς πάντας ἀνθρώπους εἰς δικαίωσιν ζωῆς: “đến trên/cho mọi người, dẫn đến sự xưng công chính của sự sống.” Chú thích nháp chuyển thành “đến với mọi người, dẫn đến ...”, làm mờ việc cả hai cụm εἰς cùng lệ thuộc vào vế được lược động từ.'
