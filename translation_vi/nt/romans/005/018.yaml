language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἄρα οὖν ὡς δι’ ἑνὸς παραπτώματος εἰς πάντας ἀνθρώπους εἰς κατάκριμα, οὕτως καὶ δι’ ἑνὸς δικαιώματος εἰς πάντας ἀνθρώπους εἰς δικαίωσιν ζωῆς·
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/018.yaml
  text: So then[a], as through one trespass condemnation came to all people, so also through one righteous act justification that brings life came to all people.
translation:
  language: vi
  text: Vậy nên, cũng như qua một sự vi phạm, sự kết án đã đến trên mọi người, thì cũng vậy, qua một hành động công chính, sự xưng công chính dẫn đến sự sống đã đến trên mọi người.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát hơn: “... qua một hành động công chính, đến trên mọi người, dẫn đến sự xưng công chính của sự sống.”'
    reason: Bảo lưu cấu trúc lược động từ và quan hệ hàm súc của cụm εἰς δικαίωσιν ζωῆς trong nguyên văn.
lexical_decisions:
- source_word: Ἄρα οὖν
  choice: Vậy nên
  rationale: Diễn đạt tự nhiên sức suy luận của cụm liên từ kép, đồng thời nối câu này với lập luận trước đó.
- source_word: παραπτώματος
  choice: sự vi phạm
  rationale: Chỉ một hành vi sai phạm cụ thể, phù hợp với số ít và giữ được sự đối xứng với hành động công chính.
- source_word: κατάκριμα
  choice: sự kết án
  rationale: Giữ sắc thái pháp lý của từ Hy Lạp và sự tương phản với δικαίωσις.
- source_word: δικαιώματος
  choice: một hành động công chính
  rationale: Trong thế đối chiếu với một sự vi phạm, danh từ số ít chỉ một hành động đúng đắn mang tính quyết định; cách dịch này không đưa danh tính hay nội dung của hành động vào ngay trong câu.
- source_word: δικαίωσιν ζωῆς
  choice: sự tuyên công chính đem lại sự sống
  rationale: Giữ sắc thái pháp đình của δικαίωσις, đồng thời diễn đạt tự nhiên quan hệ hàm súc của sở hữu cách ζωῆς mà không đồng nhất hai khái niệm.
- source_word: πάντας ἀνθρώπους
  choice: mọi người
  rationale: Diễn đạt phạm vi bao quát và bao gồm cả nam lẫn nữ; đồng thời giữ nguyên cùng một cách dịch ở cả hai vế.
theological_decisions:
- issue: Có nên thu hẹp cụm πάντας ἀνθρώπους lần thứ hai để tránh hàm ý phạm vi phổ quát hay không
  choice: Giữ “mọi người” ở cả hai vế, không thêm điều kiện giải thích.
  alternative: “mọi người tin” hoặc “mọi người được tuyên công chính”
  rationale: Bản Hy Lạp cố ý lặp đúng cùng một cụm từ trong hai vế. Việc thu hẹp vế thứ hai sẽ giải quyết thay cho văn bản một căng thẳng thần học cần được giữ lại.
- issue: Quan hệ của ζωῆς với δικαίωσιν
  choice: Diễn đạt là “sự tuyên công chính đem lại sự sống” trong chính văn.
  alternative: “sự tuyên công chính của sự sống”
  rationale: Sở hữu cách Hy Lạp ngắn gọn và có thể được hiểu theo hơn một quan hệ. Cách dịch chính văn rõ nghĩa trong tiếng Việt, còn chú thích bảo lưu dạng sát chữ và sự hàm súc của nguyên văn.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Câu giữ cấu trúc đối xứng “cũng như… thì cũng vậy…” của nguyên văn. Dùng “tuyên công chính” để thể hiện sắc thái pháp lý, tránh cách nói có thể bị hiểu là làm cho một người trở nên công chính về phẩm chất.
