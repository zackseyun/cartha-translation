reference: Romans 5:12
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Διὰ τοῦτο ὥσπερ δι’ ἑνὸς ἀνθρώπου ἡ ἁμαρτία εἰς τὸν κόσμον εἰσῆλθεν καὶ διὰ τῆς ἁμαρτίας ὁ θάνατος, καὶ οὕτως εἰς πάντας ἀνθρώπους ὁ θάνατος διῆλθεν ἐφ’ ᾧ πάντες ἥμαρτον—
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/012.yaml
  text: Therefore[a], just as sin entered into the world through one man, and death through sin, so also death spread to all people, because all sinned—
translation:
  language: vi
  text: Vì thế, cũng như tội lỗi đã vào thế gian qua một người, và sự chết qua tội lỗi, thì sự chết cũng lan đến mọi người, bởi vì mọi người đều đã phạm tội[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc theo cách hiểu truyền thống hơn: “trong người ấy, mọi người đều đã phạm tội.”'
    reason: Bảo lưu cách hiểu đại diện/hợp nhất của cụm ἐφ’ ᾧ πάντες ἥμαρτον, vốn có lịch sử giải thích lâu đời và ý nghĩa thần học quan trọng.
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: Vì thế
  rationale: Đánh dấu sự chuyển tiếp mang tính suy luận từ lập luận trước đó; cách diễn đạt ngắn gọn và tự nhiên trong tiếng Việt.
- source_word: δι’ ἑνὸς ἀνθρώπου
  choice: qua một người
  rationale: διά với sở hữu cách chỉ phương tiện trung gian; trong ngữ cảnh, người này là A-đam. “Một người” vừa tự nhiên vừa giữ được sự đối chiếu đại diện trong đoạn văn.
- source_word: ἡ ἁμαρτία
  choice: tội lỗi
  rationale: Giữ danh từ thần học quen thuộc, không diễn giải thêm điều nguyên văn không nói.
- source_word: εἰς τὸν κόσμον εἰσῆλθεν
  choice: đã vào thế gian
  rationale: Diễn đạt tự nhiên trong tiếng Việt và giữ hướng chuyển động của εἰς.
- source_word: διὰ τῆς ἁμαρτίας ὁ θάνατος
  choice: và sự chết qua tội lỗi
  rationale: 'Giữ cấu trúc song song: tội lỗi vào qua một người, còn sự chết đến qua tội lỗi.'
- source_word: οὕτως
  choice: thì ... cũng
  rationale: Thể hiện vế tương ứng trong phép so sánh chưa hoàn tất của Phao-lô và phù hợp cú pháp tiếng Việt.
- source_word: εἰς πάντας ἀνθρώπους
  choice: đến mọi người
  rationale: Chỉ toàn thể nhân loại, không chỉ nam giới; “mọi người” là cách nói bao quát và hiện đại.
- source_word: ὁ θάνατος διῆλθεν
  choice: sự chết ... lan
  rationale: Truyền đạt chuyển động mở rộng đến toàn thể loài người của διέρχομαι, đồng thời tự nhiên trong tiếng Việt.
- source_word: ἐφ’ ᾧ
  choice: bởi vì
  rationale: 'Cách hiểu nguyên nhân phù hợp tự nhiên với ngữ cảnh: sự chết lan đến mọi người vì mọi người đều phạm tội. Cách hiểu truyền thống khác được giữ trong chú thích.'
- source_word: πάντες ἥμαρτον
  choice: mọi người đều đã phạm tội
  rationale: Thì quá khứ với “đã” phản ánh động từ aorist và tránh đổi câu thành một nhận định hoàn thành theo cách diễn giải.
theological_decisions:
- issue: Ý nghĩa của ἐφ’ ᾧ πάντες ἥμαρτον
  choice: 'Cách hiểu nguyên nhân: “bởi vì mọi người đều đã phạm tội”'
  alternative: 'Cách hiểu đại diện/hợp nhất: “trong người ấy, mọi người đều đã phạm tội”'
  rationale: Cách hiểu nguyên nhân phù hợp tự nhiên với cấu trúc Hy Lạp và không áp đặt một công thức giáo lý cụ thể hơn điều câu văn nói. Vì cách hiểu truyền thống có ý nghĩa thần học lớn đối với mối liên hệ giữa A-đam và nhân loại, bản dịch bảo lưu nó trong chú thích.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dấu gạch ngang cuối câu được giữ vì câu so sánh của Phao-lô còn tiếp tục ở các câu sau. Dấu chú thích được đặt ngay sau cụm từ có cách hiểu đang được chú giải.
