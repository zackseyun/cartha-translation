id: ROM.5.17
reference: Romans 5:17
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εἰ γὰρ τῷ τοῦ ἑνὸς παραπτώματι ὁ θάνατος ἐβασίλευσεν διὰ τοῦ ἑνός, πολλῷ μᾶλλον οἱ τὴν περισσείαν τῆς χάριτος καὶ τῆς δωρεᾶς τῆς δικαιοσύνης λαμβάνοντες ἐν ζωῇ βασιλεύσουσιν διὰ τοῦ ἑνὸς Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/017.yaml
  text: For if[a], by the trespass of the one, death reigned through the one, much more will those who receive the abundance of grace and the gift of righteousness reign in life through the one[b], Jesus the Messiah.
translation:
  language: vi
  text: Vì nếu do sự vi phạm của một người mà sự chết đã cai trị qua người ấy, thì huống chi những người nhận được sự dư dật của ân điển và tặng phẩm là sự công chính[a] sẽ cai trị trong sự sống qua một người, là Giê-su, Đấng Mê-si-a[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “tặng phẩm là sự công lý.”'
    reason: lexical_alternative
  - marker: b
    text: 'Hay: “Giê-su Christ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: παραπτώματι
  choice: sự sa phạm
  rationale: Giữ hình ảnh một bước sa ngã dẫn đến hành vi vi phạm, đồng thời phù hợp với sự đối chiếu A-đam/Đấng Christ trong ngữ cảnh.
- source_word: ἐβασίλευσεν / βασιλεύσουσιν
  choice: đã cai trị / sẽ cai trị
  rationale: Bảo toàn ẩn dụ vương quyền và thế đối xứng giữa sự chết cai trị với những người nhận ân điển sẽ cai trị.
- source_word: περισσείαν τῆς χάριτος
  choice: ân điển dư dật
  rationale: Diễn đạt tự nhiên ý nghĩa phong phú, tràn đầy của ân điển mà không thêm ý ngoài nguyên văn.
- source_word: δωρεᾶς τῆς δικαιοσύνης
  choice: món quà là sự công chính
  rationale: Cấu trúc đồng vị làm rõ rằng sự công chính chính là món quà, đồng thời không quyết định sâu hơn về cơ chế thần học.
- source_word: λαμβάνοντες
  choice: những người nhận được
  rationale: Diễn đạt phân từ hiện tại như đặc điểm nhận diện nhóm người, theo cách tự nhiên trong tiếng Việt.
- source_word: ἐν ζωῇ
  choice: trong sự sống
  rationale: Giữ cách nói cô đọng và sự tương phản trực tiếp với sự chết ở đầu câu.
- source_word: διὰ τοῦ ἑνὸς
  choice: qua một người
  rationale: Giữ sự nhấn mạnh lặp lại vào 'một người' trong phép đối chiếu của Phao-lô.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Đức Chúa Jêsus, Đấng Mê-si-a
  rationale: Diễn đạt Χριστός theo nghĩa danh hiệu Mê-si-a và dùng hình thức tên gọi trang trọng, quen thuộc trong văn phong Kinh Thánh tiếng Việt.
theological_decisions:
- issue: Ý nghĩa của δικαιοσύνη trong cụm δωρεᾶς τῆς δικαιοσύνης
  choice: món quà là sự công chính
  alternative: món quà là sự công lý
  rationale: “Sự công chính” phù hợp nhất với ngữ cảnh xưng công chính A-đam/Đấng Mê-si-a, nhưng sắc thái công lý hay trật tự đúng đắn vẫn được bảo lưu trong chú thích.
- issue: Tước hiệu Χριστός trong Ἰησοῦ Χριστοῦ
  choice: Đức Chúa Jêsus, Đấng Mê-si-a
  alternative: Đức Chúa Jêsus Christ
  rationale: Dịch rõ nội dung tước hiệu thay vì chỉ phiên âm, nhưng ghi nhận cách hiểu tên gọi quen thuộc trong chú thích.
- issue: Chủ thể cai trị trong sự sống
  choice: những người nhận được ... sẽ cai trị
  alternative: không diễn giải thành chỉ một mình Đấng Mê-si-a cai trị
  rationale: Nguyên văn đặt οἱ ... λαμβάνοντες làm chủ ngữ của βασιλεύσουσιν; bản dịch giữ nguyên điểm nhấn thần học này.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ đọc; giữ các phép lặp “một người,” “cai trị,” cùng thế đối lập giữa sự chết và sự sống. Dùng “huống chi” để chuyển tải tự nhiên cấu trúc πολλῷ μᾶλλον.
