id: ROM.5.6
reference: Romans 5:6
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸂Ἔτι γὰρ⸃ Χριστὸς ὄντων ἡμῶν ἀσθενῶν ⸀ἔτι κατὰ καιρὸν ὑπὲρ ἀσεβῶν ἀπέθανεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/006.yaml
  text: For while we were still weak[a], at the right time Messiah died for the ungodly.
translation:
  language: vi
  text: Vì khi chúng ta vẫn còn yếu đuối, Đấng Mê-si đã chết cho[a] những người không tin kính vào đúng thời điểm.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “vì lợi ích của những người không tin kính.”'
    reason: Giới từ ὑπέρ có thể diễn tả hành động vì lợi ích của ai đó; bản dịch “cho” giữ sắc thái này mà không ấn định thêm cách giải thích.
lexical_decisions:
- source_word: Χριστὸς
  choice: Đấng Mê-si
  rationale: Dịch tước hiệu Χριστός theo nghĩa gốc, đồng thời dùng cách gọi tự nhiên và trang trọng trong tiếng Việt.
- source_word: ὄντων ἡμῶν ἀσθενῶν
  choice: khi chúng ta vẫn còn yếu đuối
  rationale: Chuyển kết cấu sở hữu cách tuyệt đối thành mệnh đề thời gian tự nhiên; “yếu đuối” giữ được nghĩa rộng về tình trạng thiếu sức lực hay khả năng mà không thu hẹp vào sự yếu đuối thể chất.
- source_word: ἔτι
  choice: vẫn còn
  rationale: Diễn đạt tình trạng đang tiếp diễn; tiếng Việt không cần lặp lại trạng từ này để truyền đạt tự nhiên ý của câu.
- source_word: κατὰ καιρὸν
  choice: đúng thời điểm
  rationale: Thể hiện thời điểm thích hợp hay đã định mà không diễn giải quá mức về cách thời điểm ấy được ấn định.
- source_word: ὑπὲρ
  choice: cho
  rationale: “Cho” là cách diễn đạt ngắn gọn, tự nhiên, và vẫn để ngỏ sắc thái vì lợi ích, đại diện hoặc thay thế vốn có thể được gợi lên bởi giới từ này trong ngữ cảnh.
- source_word: ἀσεβῶν
  choice: những người không tin kính
  rationale: 'Diễn đạt rõ khía cạnh đạo đức và tôn giáo của từ Hy Lạp: những người không có lòng tôn kính đối với Đức Chúa Trời.'
- source_word: ἀπέθανεν
  choice: đã chết
  rationale: Phản ánh trực tiếp động từ aorist, không thêm ý ngoài bản văn.
theological_decisions:
- issue: Sắc thái của ὑπὲρ trong cái chết của Đấng Mê-si
  choice: chết cho những người không tin kính
  alternative: chết vì lợi ích của / thay cho những người không tin kính
  rationale: “Cho” giữ nguyên sức nặng thần học của câu nhưng không buộc giới từ Hy Lạp vào duy nhất một cách giải thích về sự đại diện hay thay thế.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ “yếu đuối” ở nghĩa rộng, dùng “Đấng Mê-si” như một tước hiệu, và đặt “đúng thời điểm” theo cách tự nhiên trong tiếng Việt.
