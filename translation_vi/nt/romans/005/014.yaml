revisions:
- from: Nhưng sự chết đã thống trị từ A-đam cho đến Môi-se, ngay cả trên những người không phạm tội giống như sự vi phạm của A-đam. A-đam là hình bóng[a] của Đấng sẽ đến[b].
  to: Nhưng sự chết đã thống trị từ A-đam cho đến Môi-se, ngay cả những người không phạm tội theo cách giống với sự vi phạm của A-đam; A-đam là hình mẫu[a] của người sẽ đến[b].
  rationale: Bản sửa làm rõ cách thức so sánh trong ἐπὶ τῷ ὁμοιώματι, dùng cú pháp Việt tự nhiên hơn cho phạm vi sự thống trị của sự chết, và nối trực tiếp A-đam với mệnh đề quan hệ. “Hình mẫu” giữ tính loại hình của τύπος mà không diễn giải quá mức; việc quy chiếu về Đấng Christ được giữ trong chú thích, không đưa vào chính văn.
  reviewer_model: gpt-5.6-terra
