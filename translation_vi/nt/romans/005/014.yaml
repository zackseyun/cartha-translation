id: ROM.5.14
reference: Romans 5:14
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀλλὰ ἐβασίλευσεν ὁ θάνατος ἀπὸ Ἀδὰμ μέχρι Μωϋσέως καὶ ἐπὶ τοὺς μὴ ἁμαρτήσαντας ἐπὶ τῷ ὁμοιώματι τῆς παραβάσεως Ἀδάμ, ὅς ἐστιν τύπος τοῦ μέλλοντος.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/014.yaml
  text: Yet death reigned from Adam until Moses[a], even over those who did not sin in the likeness of Adam’s transgression[b], who is a type of the coming one.
translation:
  language: vi
  text: Nhưng sự chết đã thống trị từ A-đam cho đến Môi-se, ngay cả những người không phạm tội theo cách giống với sự vi phạm của A-đam; A-đam là hình mẫu[a] của người sẽ đến[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “hình bóng” hoặc “mẫu hình”.
    reason: lexical_alternative
  - marker: b
    text: Theo ngữ cảnh, người sẽ đến là Đấng Christ.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀλλὰ
  choice: Nhưng
  rationale: Diễn tả sự tương phản mạnh với câu trước một cách tự nhiên trong tiếng Việt hiện đại.
- source_word: ἐβασίλευσεν ὁ θάνατος
  choice: sự chết đã thống trị
  rationale: Giữ nguyên phép nhân cách hóa sự chết như một quyền lực cai trị; “thống trị” tự nhiên hơn “làm vua” trong ngữ cảnh này.
- source_word: ἀπὸ Ἀδὰμ μέχρι Μωϋσέως
  choice: từ A-đam cho đến Môi-se
  rationale: Truyền đạt rõ khoảng thời gian được nguyên văn xác định.
- source_word: καὶ ἐπὶ τοὺς μὴ ἁμαρτήσαντας
  choice: ngay cả trên những người không phạm tội
  rationale: “Ngay cả” nêu bật phạm vi đáng chú ý của quyền thống trị ấy, còn “trên” duy trì hình ảnh quyền lực bao trùm.
- source_word: ἐπὶ τῷ ὁμοιώματι τῆς παραβάσεως Ἀδάμ
  choice: giống như sự vi phạm của A-đam
  rationale: Diễn đạt tự nhiên sự tương đồng về cách thức, đồng thời không giải thích thêm bản chất của sự tương đồng.
- source_word: τύπος
  choice: hình bóng
  rationale: “Hình bóng” là cách nói dễ hiểu, trang trọng, diễn tả một nhân vật báo trước và tương ứng với nhân vật sẽ đến mà không đồng nhất hai người.
- source_word: τοῦ μέλλοντος
  choice: Đấng sẽ đến
  rationale: Giữ cách gọi gián tiếp của phân từ được dùng như danh từ; “Đấng” phù hợp với nhân vật được nhắc đến và không chèn thẳng danh xưng “Đấng Christ” vào chính văn.
theological_decisions:
- issue: Đối tượng của cụm “τοῦ μέλλοντος”
  choice: Dịch “Đấng sẽ đến” và giải thích trong chú thích rằng theo ngữ cảnh đó là Đấng Christ.
  alternative: Dịch thẳng “Đấng Christ” hoặc chỉ dịch “người sẽ đến”.
  rationale: Rô-ma 5:12–21 xác định Đấng Christ là nhân vật tương ứng với A-đam, nhưng chính câu này không nêu danh xưng ấy; bản dịch giữ cách diễn đạt của nguyên văn và đưa sự xác định theo ngữ cảnh vào chú thích.
- issue: Quan hệ giữa A-đam và Đấng sẽ đến
  choice: Dịch τύπος là “hình bóng”.
  alternative: “kiểu mẫu”, “mẫu hình” hoặc “hình ảnh báo trước”.
  rationale: “Hình bóng” bảo tồn quan hệ loại hình học và tính báo trước mà không làm mất sự khác biệt và tương phản được triển khai trong các câu tiếp theo.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “sự chết” để duy trì phép nhân cách hóa, và tách mệnh đề cuối thành câu riêng nhằm tránh đại từ quan hệ mơ hồ trong tiếng Việt. Mọi chú thích đều có ký hiệu tương ứng trong chính văn.
