id: ROM.5.8
reference: Romans 5:8
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: συνίστησιν δὲ τὴν ἑαυτοῦ ἀγάπην εἰς ἡμᾶς ὁ θεὸς ὅτι ἔτι ἁμαρτωλῶν ὄντων ἡμῶν Χριστὸς ὑπὲρ ἡμῶν ἀπέθανεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/008.yaml
  text: But God demonstrates his own love for us in that while we were still sinners[c][b][a], Messiah died for us.
translation:
  language: vi
  text: 'Nhưng Đức Chúa Trời chứng tỏ tình yêu của chính Ngài đối với chúng ta[a] ở chỗ: khi chúng ta vẫn còn là những người có tội, Đấng Mê-si-a[b] đã chết vì chúng ta[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “hướng về chúng ta.”'
    reason: lexical_alternative
  - marker: b
    text: Hy Lạp Christos, nghĩa là “Đấng được xức dầu”; theo truyền thống cũng được gọi là “Đấng Christ” hoặc “Đức Kitô.” Ở đây được dịch như một tước hiệu.
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể hiểu: “vì lợi ích của chúng ta” hoặc “thay mặt chúng ta.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: συνίστησιν
  choice: chứng tỏ
  rationale: Diễn đạt hành động bày tỏ bằng bằng chứng một cách rõ ràng, tự nhiên, đồng thời giữ sắc thái hiện tại của động từ Hy Lạp.
- source_word: δὲ
  choice: Nhưng
  rationale: Thể hiện bước chuyển mang tính tương phản nhẹ với lập luận trước đó.
- source_word: τὴν ἑαυτοῦ ἀγάπην
  choice: tình yêu của chính Ngài
  rationale: “Chính Ngài” giữ được sự nhấn mạnh của đại từ phản thân ἑαυτοῦ; “tình yêu” là cách dịch trực tiếp và tự nhiên của ἀγάπη.
- source_word: εἰς ἡμᾶς
  choice: đối với chúng ta
  rationale: Diễn đạt tự nhiên hướng tình yêu của Đức Chúa Trời đến con người, trong khi chú thích giữ lại cách dịch sát hơn là “hướng về chúng ta”.
- source_word: ὅτι
  choice: 'ở chỗ:'
  rationale: Giới thiệu nội dung giải thích Đức Chúa Trời chứng tỏ tình yêu bằng cách nào; dấu hai chấm giúp câu tiếng Việt rõ ràng.
- source_word: ἔτι ἁμαρτωλῶν ὄντων ἡμῶν
  choice: khi chúng ta vẫn còn là những người có tội
  rationale: Chuyển cấu trúc sở hữu cách tuyệt đối thành mệnh đề thời gian tự nhiên, đồng thời giữ đầy đủ sức nặng của ἔτι, “vẫn còn”.
- source_word: Χριστὸς
  choice: Đấng Mê-si
  rationale: Ở đây Χριστός mang chức năng tước hiệu; “Đấng Mê-si” giữ ý nghĩa về Đấng được xức dầu thay vì biến tước hiệu thành tên riêng.
- source_word: ὑπὲρ ἡμῶν
  choice: vì chúng ta
  rationale: Giữ nghĩa rộng là cái chết nhằm lợi ích hoặc vì cớ chúng ta, không buộc giới từ phải mang riêng một cách giải thích thần học về sự chuộc tội.
- source_word: ἀπέθανεν
  choice: đã chết
  rationale: Cách dịch trực tiếp của động từ aorist; “đã” phù hợp với hành động quá khứ đã xảy ra trong văn cảnh.
theological_decisions:
- issue: Cách dịch Χριστός trong diễn ngôn của Phao-lô
  choice: Đấng Mê-si
  alternative: Đấng Christ; Đức Kitô
  rationale: Từ này ở đây vẫn có sức nặng của một tước hiệu chỉ Đấng được xức dầu. Chú thích ghi nhận những cách gọi truyền thống mà không ưu tiên truyền thống giáo phái nào.
- issue: Sắc thái của ὑπὲρ ἡμῶν
  choice: vì chúng ta
  alternative: vì lợi ích của chúng ta; thay mặt chúng ta
  rationale: Câu khẳng định cái chết của Đấng Mê-si có liên hệ cứu ích đến chúng ta, nhưng riêng giới từ ὑπέρ ở đây không nên bị diễn giải hẹp thành một mô hình chuộc tội duy nhất.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu giữ thế tương phản bằng “Nhưng,” nhấn mạnh “của chính Ngài,” và dùng “vẫn còn” để bảo toàn sức nặng của ἔτι. Các thuật ngữ thần học được diễn đạt rộng vừa đủ để không áp đặt cách hiểu giáo phái.
