id: ROM.5.3
reference: Romans 5:3
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οὐ μόνον δέ, ἀλλὰ καὶ ⸀καυχώμεθα ἐν ταῖς θλίψεσιν, εἰδότες ὅτι ἡ θλῖψις ὑπομονὴν κατεργάζεται,
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/003.yaml
  text: And not only that[a], but we also rejoice in afflictions, knowing that affliction produces endurance[c][b],
translation:
  language: vi
  text: Không những thế, chúng ta còn vui mừng giữa những hoạn nạn[a], vì biết rằng hoạn nạn sinh ra lòng kiên trì[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Vui mừng” cũng có thể dịch là “hãnh diện” hoặc “hân hoan”; “hoạn nạn” cũng có thể dịch là “đau khổ” hay “gian truân.”
    reason: lexical_alternative
  - marker: b
    text: Hay “sự bền lòng” hoặc “lòng nhẫn nại.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καυχώμεθα
  choice: vui mừng
  rationale: Trong văn cảnh này, động từ diễn tả niềm hân hoan và tự hào đầy tin cậy, chứ không phải sự khoe khoang kiêu ngạo. “Vui mừng” tự nhiên trong tiếng Việt hiện đại và phù hợp với mạch lập luận.
- source_word: θλίψεσιν / θλῖψις
  choice: những hoạn nạn / hoạn nạn
  rationale: “Hoạn nạn” diễn đạt áp lực, khốn khó và đau khổ do θλῖψις hàm chứa. Bản dịch giữ sự chuyển đổi từ số nhiều trong trải nghiệm cụ thể sang số ít mang tính nguyên lý.
- source_word: ὑπομονήν
  choice: lòng kiên trì
  rationale: Cụm từ này diễn đạt khả năng bền lòng đứng vững dưới áp lực; “lòng kiên trì” rõ ràng, tự nhiên và tránh giới hạn nghĩa vào sự chịu đựng thụ động.
- source_word: κατεργάζεται
  choice: sinh ra
  rationale: “Sinh ra” truyền đạt tự nhiên ý nghĩa tạo nên hoặc đem lại một kết quả.
- source_word: εἰδότες
  choice: vì biết rằng
  rationale: Phân từ chỉ nền tảng nhận thức cho sự vui mừng. “Vì biết rằng” làm rõ quan hệ hợp lý trong tiếng Việt mà không thay đổi nội dung.
theological_decisions:
- issue: Sắc thái của καυχώμεθα trong bối cảnh thuộc linh tích cực
  choice: vui mừng
  alternative: hãnh diện; tự hào; hân hoan
  rationale: “Vui mừng” tránh sắc thái tự tôn của “khoe mình” nhưng vẫn giữ niềm hân hoan đầy tin cậy. Bản dịch không nói rằng hoạn nạn tự nó là điều tốt, mà giữ nguyên khẳng định của Phao-lô rằng người tin vui mừng giữa hoạn nạn vì biết kết quả nó tạo nên.
- issue: Quan hệ của εἰδότες với mệnh đề chính
  choice: vì biết rằng
  alternative: biết rằng
  rationale: Tiếng Hy Lạp dùng phân từ, có thể được hiểu là nêu hoàn cảnh hoặc lý do. Cách dịch này diễn đạt tự nhiên nền tảng của sự vui mừng nhưng không bổ sung một lập luận thần học ngoài câu.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “Không những thế” và “còn” để tái hiện cấu trúc tăng tiến οὐ μόνον δέ, ἀλλὰ καί. Không thêm đại từ sở hữu trước “những hoạn nạn,” vì nguyên văn không có.
