  source_fidelity: 'Bản dịch truyền đạt đúng cấu trúc và ý chính của câu: sự vui mừng/tự hào nơi Đức Chúa Trời, qua Chúa Giê-su là Đấng Mê-si, Đấng nhờ đó họ đã nhận được sự hòa giải. Tuy nhiên, vị trí của “của chúng ta” trong bản nháp tách rời khỏi “Chúa” và khiến cụm danh xưng tiếng Việt bị gãy, mơ hồ về quan hệ cú pháp.'
  naturalness: Cần sắp xếp lại danh xưng thành “Chúa chúng ta là Giê-su, Đấng Mê-si” để câu tiếng Việt hiện đại tự nhiên, rõ nghĩa và vẫn trang trọng. Các phần còn lại đọc trôi chảy.
  terminology: “Đức Chúa Trời,” “Chúa,” “Đấng Mê-si,” và “sự hòa giải” đều nhất quán với các quyết định thuật ngữ đã nêu. “Tự hào về Đức Chúa Trời” là một cách diễn đạt có thể chấp nhận cho καυχώμενοι ἐν τῷ θεῷ; chú thích đã nêu các sắc thái thay thế. “Ấy” có thể biểu thị tính xác định và liên kết ngữ cảnh của τὴν καταλλαγήν.
  issues:
