  to: Không những thế, chúng ta còn tự hào[a] về Đức Chúa Trời nhờ Chúa[b] chúng ta là Giê-su, Đấng Mê-si[c]; chính nhờ Ngài mà giờ đây chúng ta đã nhận được sự hòa giải ấy[d].
  rationale: Chỉ điều chỉnh trật tự từ trong danh xưng để “của chúng ta” bổ nghĩa rõ ràng cho κυρίου (“Chúa”), đồng thời giữ Giê-su và Đấng Mê-si ở quan hệ đồng vị tự nhiên trong tiếng Việt. Không thay đổi ý nghĩa, thuật ngữ chủ chốt, hay hệ thống chú thích.
