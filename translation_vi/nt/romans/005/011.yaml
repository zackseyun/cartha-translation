    rationale: Trong tiếng Việt, “của chúng ta” phải bổ nghĩa trực tiếp cho “Chúa” hoặc được diễn đạt qua cấu trúc “Chúa chúng ta là...”. Vị trí hiện tại gây ngắt nhịp không tự nhiên và có thể khiến người đọc hiểu “của chúng ta” gắn với “Đấng Mê-si” một cách vụng về.
