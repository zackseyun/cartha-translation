id: ROM.5.11
reference: Romans 5:11
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οὐ μόνον δέ, ἀλλὰ καὶ καυχώμενοι ἐν τῷ θεῷ διὰ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ, δι’ οὗ νῦν τὴν καταλλαγὴν ἐλάβομεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/011.yaml
  text: And not only that[a], but we also boast in God through our Lord Jesus the Messiah[d][c][b], through whom we have now received the reconciliation.
translation:
  language: vi
  text: Không những thế, chúng ta còn tự hào[a] về Đức Chúa Trời nhờ Chúa[b] chúng ta là Giê-su, Đấng Mê-si[c]; chính nhờ Ngài mà giờ đây chúng ta đã nhận được sự hòa giải ấy[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “hãnh diện” hoặc “hân hoan”.'
    reason: lexical_alternative
  - marker: b
    text: Từ Hy Lạp cũng có thể mang nghĩa “chủ”; trong một số văn cảnh khác, từ này tương ứng với danh xưng “CHÚA”.
    reason: lexical_alternative
  - marker: c
    text: Hy Lạp Christos, nghĩa là “Đấng được xức dầu”; theo truyền thống thường dịch là “Đấng Ki-tô”.
    reason: alternative_reading
  - marker: d
    text: 'Cũng có thể dịch đơn giản: “đã nhận được sự hòa giải”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καυχώμενοι
  choice: tự hào
  rationale: Diễn đạt trực tiếp ý khoe mình/hãnh diện nhưng trong ngữ cảnh này đối tượng là Đức Chúa Trời, không phải thành tựu của bản thân. Chú thích giữ lại các sắc thái ‘hãnh diện’ và ‘hân hoan’.
- source_word: ἐν τῷ θεῷ
  choice: về Đức Chúa Trời
  rationale: Với động từ ‘tự hào’, giới từ ‘về’ là cách nói tự nhiên trong tiếng Việt để chỉ đối tượng hay nền tảng của niềm tự hào; không hiểu là tự tôn mình trước mặt Đức Chúa Trời.
- source_word: κυρίου
  choice: Chúa
  rationale: Cách dịch quen thuộc, trang trọng và phù hợp với κύριος khi dùng làm tước hiệu của Giê-su trong Tân Ước.
- source_word: Χριστοῦ
  choice: Đấng Mê-si
  rationale: Giữ rõ nghĩa tước hiệu ‘Đấng được xức dầu’ thay vì để từ này chỉ mang dáng dấp một phần của tên riêng.
- source_word: καταλλαγὴν
  choice: sự hòa giải ấy
  rationale: ‘Sự hòa giải’ diễn đạt việc mối quan hệ được phục hồi; ‘ấy’ thể hiện tính xác định của mạo từ và quy chiếu đến sự hòa giải vừa được trình bày trong văn cảnh.
- source_word: ἐλάβομεν
  choice: giờ đây chúng ta đã nhận được
  rationale: 'Kết hợp νῦν với động từ aorist: sự hòa giải đã được tiếp nhận và hiện là thực tại của người tin.'
theological_decisions:
- issue: Sắc thái của καυχάομαι khi Đức Chúa Trời là đối tượng
  choice: tự hào về Đức Chúa Trời
  alternative: hân hoan trong Đức Chúa Trời
  rationale: ‘Tự hào’ bám sát động từ Hy Lạp hơn và vẫn có nghĩa tích cực nhờ đối tượng được nêu rõ; chú thích tránh xóa đi sắc thái hân hoan của ngữ cảnh.
- issue: Cách dịch Χριστός như một tước hiệu
  choice: Đấng Mê-si
  alternative: Đấng Ki-tô
  rationale: Bản văn dùng tước hiệu chỉ Đấng được xức dầu. ‘Đấng Mê-si’ làm sáng nghĩa chức danh mà không biến nó thành một tên riêng thuần túy.
- issue: Tính xác định của τὴν καταλλαγήν
  choice: sự hòa giải ấy
  alternative: sự hòa giải
  rationale: ‘Ấy’ cho thấy Phao-lô đang nói đến thực tại hòa giải cụ thể đã được mô tả ngay trước đó, nhưng không thêm nội dung thần học ngoài văn cảnh.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Câu giữ cấu trúc tăng tiến “không những thế… còn…”, đồng thời dùng dấu chấm phẩy để làm rõ mệnh đề quan hệ cuối. Cách đặt “của chúng ta” sau cụm đồng vị nhằm để κυρίου mang nghĩa ‘Chúa của chúng ta’ mà vẫn giữ cụm ‘Giê-su, Đấng Mê-si’ tự nhiên.
