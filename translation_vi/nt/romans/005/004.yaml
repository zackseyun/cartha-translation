id: ROM.5.4
reference: Romans 5:4
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἡ δὲ ὑπομονὴ δοκιμήν, ἡ δὲ δοκιμὴ ἐλπίδα.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/004.yaml
  text: and endurance produces proven character[a], and proven character produces hope.
translation:
  language: vi
  text: còn sự kiên trì sinh ra phẩm chất đã được tôi luyện[a], và phẩm chất đã được tôi luyện sinh ra niềm hy vọng.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “phẩm chất đã được thử nghiệm” hoặc “sự được chấp thuận.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπομονή
  choice: sự kiên trì
  rationale: Diễn đạt tự nhiên khả năng bền lòng chịu đựng giữa gian nan; trong chuỗi lập luận, từ này nhấn mạnh sự tiếp tục đứng vững hơn là chỉ thụ động chờ đợi.
- source_word: δοκιμή
  choice: phẩm chất đã được tôi luyện
  rationale: Giữ được ý về phẩm chất đã trải qua thử thách và được chứng thực, thay vì chỉ nói đến tính cách hay chính quá trình thử nghiệm.
- source_word: ἐλπίς
  choice: niềm hy vọng
  rationale: Là cách diễn đạt tiếng Việt thông dụng, tự nhiên; ngữ cảnh thư Rô-ma cho thấy đây là sự trông đợi đặt nơi Đức Chúa Trời mà không cần thêm ý giải thích vào chính câu.
- source_word: δὲ
  choice: còn ... và
  rationale: Thể hiện sự nối tiếp giữa các mắt xích trong chuỗi, không tạo ra sắc thái tương phản mạnh.
- source_word: ellipsis of κατεργάζεται
  choice: sinh ra
  rationale: Bổ sung động từ được tỉnh lược từ câu trước để chuỗi nhân quả rõ ràng và tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Ý nghĩa của δοκιμή trong tiến trình được mô tả
  choice: Phẩm chất đã qua thử thách và được chứng thực (“phẩm chất đã được tôi luyện”)
  alternative: Sự thử nghiệm; sự được chấp thuận
  rationale: Trong chuỗi này, δοκιμή là kết quả của sự kiên trì chứ không đơn thuần là chính quá trình thử thách. Cách dịch giữ sắc thái phẩm chất được chứng minh là chân thật mà không thêm một kết luận giáo lý ngoài văn bản.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Tôi luyện” gợi quá trình chịu thử thách nhưng không dùng thành ngữ quá khẩu ngữ; cấu trúc lặp giữ nhịp lập luận dây chuyền của nguyên văn.
