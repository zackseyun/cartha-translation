id: ROM.2.5
reference: Romans 2:5
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: κατὰ δὲ τὴν σκληρότητά σου καὶ ἀμετανόητον καρδίαν θησαυρίζεις σεαυτῷ ὀργὴν ἐν ἡμέρᾳ ὀργῆς καὶ ⸀ἀποκαλύψεως δικαιοκρισίας τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/005.yaml
  text: But because of your hardness and unrepentant heart, you are storing up wrath for yourself on the day of wrath and the revelation of God’s righteous judgment,
translation:
  language: vi
  text: Nhưng vì lòng cứng cỏi và tấm lòng không chịu ăn năn, bạn đang tích chứa cơn thịnh nộ cho chính mình trong ngày thịnh nộ, khi sự phán xét công chính của Đức Chúa Trời được bày tỏ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sát nguyên văn: “trong ngày thịnh nộ và sự bày tỏ sự phán xét công chính của Đức Chúa Trời.”'
    reason: Bảo lưu cấu trúc danh từ phối hợp và sự mơ hồ cú pháp của nguyên văn Hy Lạp.
lexical_decisions:
- source_word: κατὰ δὲ
  choice: Nhưng vì
  rationale: δέ mang sắc thái đối lập nhẹ; κατά với đối cách ở đây diễn tả cơ sở tương ứng với tình trạng của người được nói đến, nên “vì” là cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: σκληρότητά
  choice: lòng cứng cỏi
  rationale: Giữ ý về sự chai cứng đạo đức, đồng thời kết hợp tự nhiên với “lòng” trong tiếng Việt.
- source_word: ἀμετανόητον καρδίαν
  choice: không chịu ăn năn
  rationale: Diễn đạt rõ tình trạng tấm lòng không ăn năn; “không chịu” truyền đạt sắc thái cố chấp trong ngữ cảnh mà không dùng từ cổ khó hiểu.
- source_word: θησαυρίζεις
  choice: đang tích chứa
  rationale: Giữ hình ảnh tích lũy của động từ θησαυρίζω và sắc thái hành động đang tiếp diễn.
- source_word: σεαυτῷ
  choice: cho chính mình
  rationale: Thể hiện rõ đại từ phản thân và hậu quả người ấy tự chuốc lấy.
- source_word: ὀργή
  choice: cơn thịnh nộ
  rationale: Giữ sức nặng của cơn giận thần thượng trong bối cảnh phán xét, mạnh và trang trọng hơn “cơn giận”.
- source_word: ἐν ἡμέρᾳ ὀργῆς καὶ ἀποκαλύψεως
  choice: trong ngày thịnh nộ, khi ... được bày tỏ
  rationale: “Trong ngày” phản ánh ἐν ἡμέρᾳ; mệnh đề “khi ... được bày tỏ” làm rõ quan hệ tự nhiên trong tiếng Việt, trong khi chú thích bảo lưu cấu trúc danh từ sát nguyên văn.
- source_word: δικαιοκρισίας τοῦ θεοῦ
  choice: sự phán xét công chính của Đức Chúa Trời
  rationale: δικαιοκρισία nói đến sự phán xét đúng đắn, công minh; cách dịch này giữ được cả tính chất công chính và hành vi phán xét.
theological_decisions:
- issue: Nên giữ nguyên cấu trúc danh từ “ngày thịnh nộ và sự bày tỏ” hay chuyển thành mệnh đề thời gian.
  choice: 'Dùng cách diễn đạt tự nhiên: “trong ngày thịnh nộ, khi sự phán xét công chính của Đức Chúa Trời được bày tỏ.”'
  alternative: “trong ngày thịnh nộ và sự bày tỏ cuộc phán xét công chính của Đức Chúa Trời.”
  rationale: Bản Hy Lạp dùng các danh từ phối hợp, nhưng cách giữ nguyên hoàn toàn khá gượng trong tiếng Việt. Mệnh đề thời gian truyền đạt quan hệ theo ngữ cảnh mà không xác định thêm nội dung thần học; cấu trúc sát nguyên văn được nêu trong chú thích.
- issue: δικαιοκρισία nhấn mạnh sự công chính hay công minh của phán xét.
  choice: sự phán xét công chính
  alternative: sự phán xét công minh
  rationale: “Công chính” phản ánh trực tiếp thành tố δικαιο- và phù hợp văn mạch Rô-ma; “công minh” là một khả năng tự nhiên nhưng hơi thiên về phẩm chất xét xử.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “bạn” cho đại từ số ít ngôi thứ hai trong câu nhằm giữ lời chất vấn trực tiếp; “Đức Chúa Trời” là cách gọi trang trọng, phổ biến trong truyền thống Kinh Thánh tiếng Việt.
