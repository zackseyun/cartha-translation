revisions:
- from: Và người vốn không chịu cắt bì[a], nếu làm trọn luật pháp, sẽ xét đoán bạn là người dù có văn tự và phép cắt bì[b] mà vẫn vi phạm luật pháp.
  to: Và người vốn không cắt bì[a], nếu làm trọn luật pháp, sẽ xét đoán bạn, là người dù có luật pháp thành văn và phép cắt bì[b] mà vẫn vi phạm luật pháp.
  rationale: Sửa “không chịu cắt bì” thành “không cắt bì” để không thêm hàm ý ý chí cá nhân và để “vốn” mang được nét ἐκ φύσεως. Thay “văn tự” trong chính văn bằng “luật pháp thành văn” nhằm rõ nghĩa tiếng Việt; chú thích vẫn bảo lưu cách dịch sát và tính đa nghĩa của cụm giới từ. Không thay đổi ý nghĩa điều kiện của phân từ, sự tương phản về cắt bì, hay sắc thái xét đoán.
  reviewer_model: gpt-5.6-terra
