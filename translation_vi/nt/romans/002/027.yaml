id: ROM.2.27
reference: Romans 2:27
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ κρινεῖ ἡ ἐκ φύσεως ἀκροβυστία τὸν νόμον τελοῦσα σὲ τὸν διὰ γράμματος καὶ περιτομῆς παραβάτην νόμου.
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/027.yaml
  text: And the uncircumcised person by nature[a], if he fulfills the law, will judge you who, with the letter and circumcision[b], are a transgressor of the law.
translation:
  language: vi
  text: Và người vốn không cắt bì[a], nếu làm trọn luật pháp, sẽ xét đoán bạn, là người dù có luật pháp thành văn và phép cắt bì[b] mà vẫn vi phạm luật pháp.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Theo nghĩa đen, “sự không cắt bì”; ở đây chỉ một người không cắt bì.
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “qua văn tự và phép cắt bì”. “Văn tự” ở đây chỉ luật pháp thành văn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκροβυστία
  choice: người không chịu cắt bì
  rationale: Danh từ theo nghĩa đen là “tình trạng không cắt bì”, nhưng ở đây được dùng hoán dụ để chỉ một người không chịu cắt bì. Cách dịch này giữ rõ đối tượng là người mà không diễn giải rộng thành “người ngoại bang”.
- source_word: ἐκ φύσεως
  choice: vốn
  rationale: Diễn đạt tự nhiên tình trạng không cắt bì theo bản tính/tự nhiên, đối lập với người có phép cắt bì; “vốn” gọn và phù hợp văn cảnh tiếng Việt.
- source_word: τελοῦσα
  choice: nếu làm trọn
  rationale: Phân từ diễn tả việc thực hành trọn vẹn luật pháp và trong mạch lập luận mang sắc thái điều kiện; “nếu làm trọn” truyền đạt rõ quan hệ ấy mà vẫn giữ lực của τελέω.
- source_word: νόμον
  choice: luật pháp
  rationale: Chỉ luật pháp đã được xác định trong văn cảnh, tức Luật Môi-se; “luật pháp” là cách gọi quen thuộc, trang trọng và dễ hiểu.
- source_word: διὰ γράμματος
  choice: dù có văn tự
  rationale: γράμμα chỉ dạng thành văn của luật pháp. Trong cấu trúc này, διὰ nêu điều người bị chất vấn có trong tay; “dù có” làm rõ thế tương phản mà không biến văn tự thành nguyên nhân khiến người ấy phạm luật.
- source_word: περιτομῆς
  choice: phép cắt bì
  rationale: Chuyển trực tiếp tên dấu hiệu giao ước bằng thuật ngữ tiếng Việt quen dùng.
- source_word: παραβάτην νόμου
  choice: người vi phạm luật pháp
  rationale: Giữ quan hệ minh nhiên với νόμος, đồng thời tự nhiên hơn cách nói danh hóa nặng nề trong tiếng Việt.
theological_decisions:
- issue: Có nên dịch ἀκροβυστία thành một nhãn sắc tộc là “người ngoại bang” hay không
  choice: Giữ cách nói hẹp hơn là “người không chịu cắt bì”.
  alternative: người ngoại bang
  rationale: Lập luận trong ngữ cảnh liên quan đến người Do Thái và dân ngoại, nhưng từ ngữ cụ thể của câu này đặt phép cắt bì đối lập với tình trạng không cắt bì. Bản dịch không thay sự tương phản ấy bằng một nhãn sắc tộc rộng hơn.
- issue: Quan hệ của phân từ τελοῦσα với động từ chính
  choice: 'Dịch theo sắc thái điều kiện: “nếu làm trọn luật pháp”.'
  alternative: trong khi làm trọn luật pháp
  rationale: Phân từ có thể được giữ gần hình thức là “trong khi”, nhưng trong mạch đối chiếu của Rô-ma 2:26–27, ý điều kiện là tự nhiên và rõ hơn; điều này không khẳng định thêm rằng một nhóm người cụ thể đã thực sự làm trọn luật pháp.
- issue: Ý nghĩa của διὰ trong cụm διὰ γράμματος καὶ περιτομῆς
  choice: Diễn đạt là “dù có văn tự và phép cắt bì”.
  alternative: nhờ/qua văn tự và phép cắt bì
  rationale: 'Cụm từ có thể được hiểu sát hình thức là “qua/nhờ”, nhưng trong tiếng Việt cách ấy dễ hàm ý rằng văn tự và phép cắt bì gây ra sự vi phạm. “Dù có” bảo toàn nét nghịch lý: người sở hữu cả hai vẫn là người vi phạm luật pháp.'
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng đại từ số ít “bạn” để giữ lời chất vấn trực tiếp σέ; dùng “xét đoán” để giữ sắc thái tư pháp của κρίνω. Các dấu chú thích [a], [b] đều được đặt ngay sau cụm từ liên quan trong chính văn.
