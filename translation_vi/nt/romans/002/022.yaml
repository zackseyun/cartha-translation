revisions:
- from: 'Bạn là người nói: “Đừng ngoại tình,” thế mà lại ngoại tình sao? Bạn là người ghê tởm các thần tượng, thế mà lại cướp bóc đền thờ sao?[a]'
  to: 'Bạn nói: “Đừng ngoại tình,” thế mà lại ngoại tình sao? Bạn ghê tởm các hình tượng, thế mà lại cướp bóc đền thờ sao?[a]'
  rationale: Bản sửa làm câu văn gọn và tự nhiên hơn trong tiếng Việt hiện đại, đồng thời dùng “hình tượng” để chuyển đạt chính xác εἴδωλα trong bối cảnh thờ cúng. Nghĩa cụ thể của ἱεροσυλεῖς được giữ trong chính văn và nghĩa rộng được nêu ở chú thích, không quyết định thay cho sự mơ hồ từ vựng của nguyên văn.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T10:24:18Z'
review_pass:
  verdict: revise
  source_fidelity: Bản dịch giữ đúng hai câu hỏi tu từ song hành và truyền đạt đúng nghĩa cụ thể chủ yếu của ἱεροσυλεῖς là cướp bóc/chiếm đoạt liên quan đến đền thờ. Tuy nhiên, “các thần tượng” trong tiếng Việt hiện đại thường gợi người nổi tiếng được hâm mộ, không diễn đạt rõ εἴδωλα là các đối tượng/hình tượng thờ cúng.
  naturalness: “Bạn là người nói” và “Bạn là người ghê tởm” là lối diễn đạt nặng, chưa tự nhiên trong văn xuôi tiếng Việt hiện đại. Rút thành “Bạn nói” và “Bạn ghê tởm” vẫn giữ lối chất vấn trực tiếp cùng giá trị đại diện của phân từ danh từ hóa.
  terminology: Đổi “các thần tượng” thành “các hình tượng” để chỉ rõ các tượng/hình tượng thờ cúng trong ngữ cảnh Kinh Thánh. Giữ “cướp bóc đền thờ” là nghĩa cụ thể có cơ sở của ἱεροσυλεῖς; chú thích bảo lưu nghĩa rộng “phạm thánh”.
