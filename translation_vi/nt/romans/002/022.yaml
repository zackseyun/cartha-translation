base_translation:
  language: en
  yaml_path: translation/nt/romans/002/022.yaml
  text: You who say[a], “Do not commit adultery,” do you commit adultery? You who detest idols, do you rob temples?
translation:
  language: vi
  text: 'Bạn nói: “Đừng ngoại tình,” thế mà lại ngoại tình sao? Bạn ghê tởm các hình tượng, thế mà lại cướp bóc đền thờ sao?[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc hiểu rộng hơn: “phạm thánh”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ λέγων
  choice: Bạn là người nói
  rationale: Mạo từ đi với phân từ hiện tại được dùng như danh từ để trực tiếp chất vấn một người đại diện; cách dịch này tự nhiên trong tiếng Việt và giữ lối xưng hô trực diện của Phao-lô.
- source_word: μὴ μοιχεύειν
  choice: Đừng ngoại tình
  rationale: μή với động từ nguyên mẫu nêu nội dung của lời cấm. “Đừng ngoại tình” là cách diễn đạt hiện đại, rõ ràng và chính xác.
- source_word: μοιχεύεις
  choice: lại ngoại tình sao
  rationale: Động từ hiện tại nằm trong câu hỏi tu từ mang sức tố cáo. Từ “lại” làm nổi bật sự mâu thuẫn giữa lời dạy và hành vi mà không thêm một kết luận ngoài bản văn.
- source_word: ὁ βδελυσσόμενος
  choice: Bạn là người ghê tởm
  rationale: βδελύσσομαι diễn tả sự kinh tởm mạnh mẽ. “Ghê tởm” vừa thông dụng vừa giữ được cường độ của từ Hy Lạp.
- source_word: τὰ εἴδωλα
  choice: các thần tượng
  rationale: Trong ngữ cảnh này, εἴδωλα chỉ những hình tượng được thờ làm thần; “thần tượng” là thuật ngữ Kinh Thánh quen thuộc và phù hợp.
- source_word: ἱεροσυλεῖς
  choice: lại cướp bóc đền thờ sao
  rationale: ἱεροσυλέω trước hết có nghĩa cụ thể là cướp đền thờ hoặc tài sản thuộc đền thờ. “Cướp bóc đền thờ” giữ được hình ảnh cụ thể và sắc thái mỉa mai trong ngữ cảnh; nghĩa rộng hơn được ghi ở chú thích.
theological_decisions:
- issue: Phạm vi nghĩa của ἱεροσυλεῖς
  choice: Dịch nghĩa cụ thể là “cướp bóc đền thờ” trong chính văn.
  alternative: “phạm thánh”
  rationale: Nghĩa cụ thể phù hợp với sự nhắc đến các thần tượng ngay trước đó và giữ nguyên bối cảnh lịch sử, nhưng bản văn Hy Lạp cũng có thể mang nghĩa rộng hơn nên phương án ấy được bảo lưu trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và trực tiếp. Dùng “bạn” để tránh đại từ “ngươi” mang sắc thái cổ, đồng thời giữ lời chất vấn ở ngôi thứ hai số ít. Hai vế được cấu trúc song song để tái hiện nhịp điệu tu từ của nguyên văn.
