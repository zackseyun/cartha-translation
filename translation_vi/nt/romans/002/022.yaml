    rationale: Cụm này thường chỉ người nổi tiếng được ngưỡng mộ; τὰ εἴδωλα ở đây chỉ các hình tượng được thờ cúng. “Các hình tượng” tránh đổi nghĩa và phù hợp ngữ cảnh.
  - severity: low
    issue: Cấu trúc “Bạn là người nói/ghê tởm” thiếu tự nhiên.
    rationale: Tiếng Hy Lạp dùng phân từ với mạo từ để nêu người đại diện đang bị chất vấn. Tiếng Việt tự nhiên có thể dùng động từ hữu hạn trực tiếp mà không mất chức năng tu từ.
  - severity: low
    issue: Chú thích diễn đạt phương án từ vựng như một câu hỏi đầy đủ.
    rationale: Chú thích nên nêu rõ đây là cách hiểu rộng hơn của động từ, thay vì lặp lại các hư từ tu từ không thuộc riêng nghĩa từ vựng.
