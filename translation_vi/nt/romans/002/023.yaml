  text: ὃς ἐν νόμῳ καυχᾶσαι, διὰ τῆς παραβάσεως τοῦ νόμου τὸν θεὸν ἀτιμάζεις;
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/023.yaml
  text: You who boast in the law[a], do you dishonor God through your transgression of the law?
translation:
  language: vi
  text: Bạn là người khoe khoang về luật pháp, lại làm nhục Đức Chúa Trời bằng việc vi phạm luật pháp sao?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν νόμῳ
  choice: về luật pháp
  rationale: Trong tiếng Việt, “khoe mình về luật pháp” diễn đạt tự nhiên điều làm nền tảng hoặc đối tượng cho sự khoe mình, đồng thời không thu hẹp ý thành chỉ nói về luật pháp.
- source_word: καυχᾶσαι
  choice: khoe mình
  rationale: Giữ sắc thái phê phán của lời chất vấn và phù hợp với cách dùng của động từ καυχάομαι trong văn mạch.
- source_word: διὰ τῆς παραβάσεως τοῦ νόμου
  choice: bởi sự vi phạm luật pháp
  rationale: Giữ hình thức danh từ của παράβασις và quan hệ với νόμος, đồng thời diễn đạt rõ phương tiện hoặc nguyên cớ dẫn đến việc làm ô danh Đức Chúa Trời.
- source_word: τὸν θεὸν
  choice: Đức Chúa Trời
  rationale: Cách gọi trang trọng, rõ nghĩa và quen thuộc trong tiếng Việt dành cho vị Đức Chúa Trời xác định trong văn mạch.
- source_word: ἀτιμάζεις
  choice: làm ô danh
  rationale: Diễn đạt tự nhiên hành động khiến Đức Chúa Trời bị xúc phạm hoặc mất danh dự, và giữ đối lập tu từ với việc khoe mình.
theological_decisions:
- issue: νόμος trong lập luận của Phao-lô
  choice: luật pháp
  alternative: Luật Pháp; luật Môi-se
  rationale: “Luật pháp” giữ được nghĩa xác định theo văn mạch Do Thái mà không thêm tên Môi-se vốn không hiện diện trong câu Hy Lạp, cũng không dựa vào quy ước viết hoa để biến từ này thành một nhãn kỹ thuật.
- issue: Sắc thái của câu hỏi tu từ
  choice: lại làm ô danh Đức Chúa Trời ... sao?
  alternative: bạn có làm ô danh Đức Chúa Trời ... không?
  rationale: Cấu trúc với “lại ... sao?” bảo toàn lực tố cáo và sự tương phản giữa khoe mình về luật pháp với vi phạm luật pháp, trong khi vẫn giữ hình thức câu hỏi của nguyên bản.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng đại từ số ít “bạn” theo các động từ ngôi hai số ít trong tiếng Hy Lạp; thêm “Còn” để chuyển tự nhiên sang đối tượng đang bị chất vấn, và “người” để làm rõ cấu trúc quan hệ. Không đặt chú thích vì bản tiếng Hy Lạp không có dị bản hoặc độ mơ hồ nào tại đây cần giải thích bằng chú thích; chú thích tiếng Anh được cung cấp dường như không khớp với vị trí dấu [a] trong câu.
