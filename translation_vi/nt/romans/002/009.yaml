source:
  edition: SBLGNT
  text: θλῖψις καὶ στενοχωρία, ἐπὶ πᾶσαν ψυχὴν ἀνθρώπου τοῦ κατεργαζομένου τὸ κακόν, Ἰουδαίου τε πρῶτον καὶ Ἕλληνος·
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/009.yaml
  text: There will be affliction and distress upon every human soul that does evil[b][a], to the Jew first and also to the Greek.
translation:
  language: vi
  text: Hoạn nạn và khốn khổ sẽ giáng trên mọi người làm điều ác—trước hết là người Do Thái, rồi cũng là người Hy Lạp.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Trong cặp đối chiếu “người Do Thái/người Hy Lạp” ở đây, “người Hy Lạp” chỉ người không phải Do Thái.
    reason: lexical_alternative
lexical_decisions:
- source_word: θλῖψις
  choice: hoạn nạn
  rationale: Diễn tả tình cảnh đau khổ nghiêm trọng, phù hợp với văn cảnh phán xét và giữ sắc thái trang trọng.
- source_word: στενοχωρία
  choice: khốn khổ
  rationale: Kết hợp tự nhiên với “hoạn nạn” nhưng vẫn giữ ý niệm bị dồn ép, lâm vào cảnh ngặt nghèo.
- source_word: ἐπὶ πᾶσαν ψυχὴν ἀνθρώπου
  choice: trên mọi người
  rationale: Trong cách dùng này, ψυχή chỉ chính con người; dịch “mọi người” tự nhiên trong tiếng Việt và tránh khiến độc giả hiểu rằng chỉ một bộ phận phi vật chất chịu phán xét.
- source_word: τοῦ κατεργαζομένου τὸ κακόν
  choice: làm điều ác
  rationale: Truyền đạt trực tiếp hành động được phân từ κατεργαζομένου diễn tả và nghĩa khái quát của τὸ κακόν.
- source_word: Ἰουδαίου
  choice: người Do Thái
  rationale: Chỉ dân Do Thái trong cặp đối chiếu dân tộc–tôn giáo quen thuộc của thư Rô-ma.
- source_word: Ἕλληνος
  choice: người Hy Lạp
  rationale: Giữ nguyên cách gọi của Phao-lô thay vì diễn giải ngay thành “dân ngoại”; trong cặp đối chiếu này, từ này đại diện cho người không phải Do Thái.
- source_word: πρῶτον
  choice: trước là
  rationale: Giữ ý thứ tự hoặc ưu tiên của πρῶτον bằng cách diễn đạt tự nhiên, gọn rõ trong tiếng Việt.
theological_decisions:
- issue: Có nên bổ sung một động từ vị ngữ cho mệnh đề danh từ cô đọng trong tiếng Hy Lạp hay không
  choice: “sẽ giáng trên”
  alternative: “Hoạn nạn và khốn khổ trên...”
  rationale: Tiếng Việt cần một vị ngữ để câu được tự nhiên và rõ nghĩa. “Sẽ giáng trên” phù hợp với văn cảnh phán xét trong tương lai mà không xác định thêm tác nhân hay cơ chế.
- issue: Cách hiểu “người Hy Lạp” trong cặp “người Do Thái/người Hy Lạp”
  choice: Giữ “người Hy Lạp” trong chính văn và giải thích bằng chú thích
  alternative: Dịch trực tiếp là “người ngoại” hoặc “dân ngoại”
  rationale: Giữ sát từ ngữ nguồn và sự căng thẳng lịch sử của cặp đối chiếu, đồng thời chú thích giúp độc giả hiểu phạm vi dụng ý ở đây.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cặp “hoạn nạn và khốn khổ” giữ nhịp điệu tăng cường của hai danh từ Hy Lạp; dấu gạch ngang làm rõ phần xác định thứ tự mà không thêm nội dung.
