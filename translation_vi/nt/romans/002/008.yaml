id: ROM.2.8
reference: Romans 2:8
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: τοῖς δὲ ἐξ ἐριθείας καὶ ⸀ἀπειθοῦσι τῇ ἀληθείᾳ πειθομένοις δὲ τῇ ἀδικίᾳ ⸂ὀργὴ καὶ θυμός⸃,
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/008.yaml
  text: 'But for those who are self-seeking and disobey the truth[b][a], but obey unrighteousness: wrath and fury.'
translation:
  language: vi
  text: Nhưng đối với những người hành động vì tham vọng ích kỷ[a], không vâng phục chân lý mà lại vâng theo sự bất chính[b], thì sẽ có cơn thịnh nộ và giận dữ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “hành động vì tư lợi” hoặc “vì lòng tranh cạnh”.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “sự bất công”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξ ἐριθείας
  choice: hành động vì tham vọng ích kỷ
  rationale: Cụm từ chỉ động cơ hoặc nguồn thúc đẩy là lòng vị kỷ, đồng thời có thể hàm ý tranh cạnh. Cách dịch này tự nhiên trong tiếng Việt và giữ được ý hành động do tham vọng tư lợi thúc đẩy.
- source_word: ἀπειθοῦσι τῇ ἀληθείᾳ
  choice: không vâng phục chân lý
  rationale: Động từ ἀπειθέω tại đây diễn tả sự không chịu vâng phục, chứ không chỉ đơn thuần là không tin; cách dịch giữ được sắc thái đạo đức và ý chí.
- source_word: πειθομένοις δὲ τῇ ἀδικίᾳ
  choice: mà lại vâng theo sự bất chính
  rationale: Cách diễn đạt duy trì thế đối lập với việc không vâng phục chân lý và cho thấy họ thuận theo điều trái nghịch với chân lý.
- source_word: ἀδικίᾳ
  choice: sự bất chính
  rationale: “Sự bất chính” giữ được phạm vi đạo đức và sắc thái liên hệ với sự công chính trong ngôn ngữ của Phao-lô; “sự bất công” vẫn là một khả năng hẹp hơn.
- source_word: ὀργὴ
  choice: cơn thịnh nộ
  rationale: “Cơn thịnh nộ” truyền đạt sắc thái nghiêm trọng và phán xét của từ này trong văn cảnh.
- source_word: θυμός
  choice: giận dữ
  rationale: Đặt bên cạnh “cơn thịnh nộ”, từ này tăng cường mức độ của sự giận; “giận dữ” là cách nói rõ ràng và tự nhiên trong tiếng Việt hiện đại.
- source_word: implicit verbal ellipsis
  choice: thì sẽ có
  rationale: Nguyên văn Hy Lạp lược bỏ động từ trong mệnh đề kết quả. Tiếng Việt cần bổ sung tối thiểu “thì sẽ có” để câu hoàn chỉnh và tự nhiên, không xác định thêm cách thức cơn thịnh nộ giáng xuống.
theological_decisions:
- issue: Cách dịch ἀδικία trong văn cảnh phán xét của Phao-lô
  choice: sự bất chính
  alternative: sự bất công
  rationale: “Sự bất chính” bảo toàn sắc thái thần học và đạo đức rộng hơn của nhóm từ δικ- trong văn cảnh chống nghịch chân lý; “sự bất công” là cách hiểu khả dĩ nhưng dễ bị giới hạn vào hành vi xã hội bất công.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cấu trúc “không… mà lại…” làm rõ sự tương phản giữa hai phân từ Hy Lạp; “thì sẽ có” bổ sung động từ tối thiểu cần thiết trong tiếng Việt cho mệnh đề vốn được lược động từ trong nguyên văn.
