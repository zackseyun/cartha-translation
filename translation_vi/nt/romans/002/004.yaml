revisions:
- from: Hay bạn khinh thường sự phong phú của lòng nhân từ, khoan dung và kiên nhẫn của Ngài[a], mà không biết rằng lòng nhân từ của Đức Chúa Trời đang dẫn bạn đến sự ăn năn sao?
  to: Hay bạn khinh thường sự phong phú của lòng nhân từ, khoan nhẫn và kiên nhẫn của Ngài[a], mà không biết rằng lòng nhân từ của Đức Chúa Trời đang dẫn bạn đến sự ăn năn sao?
  rationale: Chỉ điều chỉnh cách dịch ἀνοχή từ “khoan dung” sang “khoan nhẫn” để diễn đạt rõ hơn ý kiềm chế phán xét trong nguyên văn và tránh sắc thái hiện đại dễ gây hiểu lầm. Chú thích được chỉnh nhẹ để chính xác về mặt từ vựng. Các lựa chọn còn lại được giữ nguyên vì phù hợp với tiếng Hy Lạp và văn phong tiếng Việt hiện đại.
