id: ROM.2.4
reference: Romans 2:4
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἢ τοῦ πλούτου τῆς χρηστότητος αὐτοῦ καὶ τῆς ἀνοχῆς καὶ τῆς μακροθυμίας καταφρονεῖς, ἀγνοῶν ὅτι τὸ χρηστὸν τοῦ θεοῦ εἰς μετάνοιάν σε ἄγει;
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/004.yaml
  text: Or do you despise the riches of his kindness and forbearance and patience[a], not knowing that God's kindness is leading you to repentance?
translation:
  language: vi
  text: Hay bạn khinh thường sự phong phú của lòng nhân từ, khoan nhẫn và kiên nhẫn của Ngài[a], mà không biết rằng lòng nhân từ của Đức Chúa Trời đang dẫn bạn đến sự ăn năn sao?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “sự tốt lành” ở cả hai chỗ dịch “lòng nhân từ”.
    reason: lexical_alternative
lexical_decisions:
- source_word: πλούτου
  choice: sự phong phú
  rationale: Diễn đạt tự nhiên ẩn dụ về mức độ dồi dào của các phẩm tính, đồng thời giữ sắc thái của danh từ số ít Hy Lạp.
- source_word: χρηστότητος / τὸ χρηστόν
  choice: lòng nhân từ
  rationale: Giữ nhất quán ở cả hai lần xuất hiện và truyền đạt sắc thái tốt lành được bày tỏ cách nhân hậu đối với con người.
- source_word: ἀνοχῆς
  choice: khoan dung
  rationale: Chỉ sự tự kiềm chế, tạm chưa thi hành phán xét; trong chuỗi ba danh từ, cách dịch này tự nhiên và không hàm ý chấp nhận điều sai trái.
- source_word: μακροθυμίας
  choice: kiên nhẫn
  rationale: Diễn đạt rõ ràng sự nhẫn nại lâu dài bằng tiếng Việt hiện đại.
- source_word: καταφρονεῖς
  choice: khinh thường
  rationale: Giữ sức nặng quở trách của động từ, nghĩa là coi nhẹ hoặc tỏ thái độ khinh miệt.
- source_word: ἀγνοῶν
  choice: mà không biết
  rationale: Phản ánh phân từ chỉ tình trạng không nhận biết, không tự ý diễn giải thành sự cố tình phớt lờ.
- source_word: εἰς μετάνοιάν
  choice: đến sự ăn năn
  rationale: Giữ hướng đích của εἰς và dùng thuật ngữ tiếng Việt quen thuộc cho sự quay đổi trong tương quan với Đức Chúa Trời.
- source_word: ἄγει
  choice: đang dẫn
  rationale: Thể hiện tự nhiên thì hiện tại và hành động đang hướng người được nói đến về sự ăn năn.
theological_decisions:
- issue: 'Sắc thái của χρηστότης / χρηστόν: lòng nhân từ hay sự tốt lành'
  choice: Dịch nhất quán là “lòng nhân từ”.
  alternative: Có thể dịch là “sự tốt lành” ở một hoặc cả hai chỗ.
  rationale: Ngữ cảnh nhấn mạnh cách Đức Chúa Trời đối xử nhân hậu và trì hoãn phán xét; “lòng nhân từ” giữ được sắc thái quan hệ mà không phủ nhận nghĩa rộng hơn là sự tốt lành.
- issue: Mối liên hệ giữa lòng nhân từ của Đức Chúa Trời và sự ăn năn
  choice: Giữ cách nói “đang dẫn bạn đến sự ăn năn”.
  alternative: Có thể dịch “dẫn bạn tới chỗ ăn năn”.
  rationale: Bản dịch giữ nguyên chuyển động hướng đích của câu Hy Lạp, không suy diễn rằng việc dẫn dắt tất yếu đồng nghĩa với người nghe đã thực sự ăn năn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và trực tiếp. Dùng “bạn” để giữ ngôi thứ hai số ít của σε và καταφρονεῖς; “Ngài” quy chiếu về Đức Chúa Trời. Chuỗi “lòng nhân từ, khoan dung và kiên nhẫn” giữ ba phẩm tính riêng biệt của nguyên văn.
