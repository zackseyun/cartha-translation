    issue: “Khoan dung” cho ἀνοχή
    rationale: Trong cách dùng hiện đại, “khoan dung” có thể hàm ý bao dung/chấp nhận điều sai khác. ἀνοχή trong câu này nói đến việc Đức Chúa Trời kiềm chế, chưa thi hành phán xét; “khoan nhẫn” truyền đạt sát hơn.
  - severity: low
    issue: Diễn đạt chú thích “cụm từ ‘lòng nhân từ’”
    rationale: Nguyên văn có hai hình thức của cùng một từ gốc χρηστός, không phải một cụm từ được lặp lại nguyên dạng. Chú thích nên gọi là “hai chỗ dịch ‘lòng nhân từ’”.
