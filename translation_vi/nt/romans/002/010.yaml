id: ROM.2.10
reference: Romans 2:10
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: δόξα δὲ καὶ τιμὴ καὶ εἰρήνη παντὶ τῷ ἐργαζομένῳ τὸ ἀγαθόν, Ἰουδαίῳ τε πρῶτον καὶ Ἕλληνι·
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/010.yaml
  text: but glory and honor and peace to everyone who does good[b][a], to the Jew first and also to the Greek.
translation:
  language: vi
  text: 'Nhưng vinh quang, danh dự và bình an sẽ dành cho mọi người làm điều thiện[a]: trước hết cho người Do Thái, và cũng cho người Hy Lạp[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “làm điều tốt.”'
    reason: lexical_alternative
  - marker: b
    text: “Người Hy Lạp” ở đây có lẽ được dùng theo nghĩa rộng để chỉ người không phải Do Thái, tức dân ngoại.
    reason: cultural_note
lexical_decisions:
- source_word: δόξα
  choice: vinh quang
  rationale: Cách dịch quen thuộc, giữ được sắc thái tôn quý và ý nghĩa phần thưởng trong ngữ cảnh.
- source_word: τιμή
  choice: danh dự
  rationale: Diễn đạt tự nhiên sự quý trọng được ban cho, đồng thời phân biệt rõ với “vinh quang” trong cụm song đôi.
- source_word: εἰρήνη
  choice: bình an
  rationale: Giữ được phạm vi ý nghĩa rộng của từ ngữ Kinh Thánh mà không giới hạn vào cảm xúc nội tâm hay quan hệ xã hội.
- source_word: παντὶ τῷ ἐργαζομένῳ
  choice: cho mọi người làm
  rationale: Diễn đạt tự nhiên người có đặc điểm là thực hành điều được nói đến; dạng hiện tại của phân từ gợi hành động mang tính liên tục hoặc đặc trưng.
- source_word: τὸ ἀγαθόν
  choice: điều thiện
  rationale: Danh hóa tính từ có nghĩa là “điều tốt/điều thiện”; “điều thiện” tự nhiên, trang trọng và phù hợp ngữ cảnh đạo đức.
- source_word: Ἰουδαίῳ
  choice: người Do Thái
  rationale: Cách gọi hiện đại, tự nhiên, tương ứng với danh từ số ít mang tính đại diện trong nguyên văn.
- source_word: πρῶτον
  choice: trước hết
  rationale: Giữ nguyên thứ tự ưu tiên được Phao-lô nêu mà không giải thích thêm bản chất của sự ưu tiên ấy.
- source_word: Ἕλληνι
  choice: người Hy Lạp
  rationale: Giữ cách diễn đạt trực tiếp của nguyên văn và cụm đối ứng “người Do Thái—người Hy Lạp”; nghĩa rộng hơn được nêu trong chú thích.
- source_word: δὲ
  choice: nhưng
  rationale: Thể hiện sự tương phản với cơn thịnh nộ và hoạn nạn ở câu trước.
- source_word: τε ... καὶ
  choice: trước hết ... rồi cũng
  rationale: Thể hiện mối liên kết giữa hai nhóm, đồng thời giữ thứ tự do πρῶτον xác định.
theological_decisions:
- issue: Phạm vi nghĩa của Ἕλληνι trong cặp đối ứng Do Thái/Hy Lạp
  choice: Dịch “người Hy Lạp” trong chính văn và chú thích rằng từ này ở đây có thể chỉ người ngoài Do Thái nói chung.
  alternative: người ngoại bang
  rationale: “Người Hy Lạp” bám sát từ ngữ nguồn, còn chú thích bảo toàn nghĩa rộng có khả năng được hàm ý trong cách dùng của Phao-lô mà không áp đặt nghĩa ấy vào chính văn.
- issue: Bản chất của vị trí “trước hết” dành cho người Do Thái
  choice: Giữ nguyên “trước hết” mà không giải thích đó là ưu tiên về thời gian, lịch sử cứu chuộc hay trách nhiệm.
  alternative: diễn giải rõ loại ưu tiên
  rationale: Nguyên văn chỉ nêu thứ tự; giữ cách nói ngắn gọn bảo toàn sức căng thần học và tránh thêm một cách giải nghĩa riêng.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Cụm “sẽ dành cho” được bổ sung để hoàn chỉnh câu tiếng Việt; động từ được hiểu từ mạch văn về sự báo trả của Đức Chúa Trời. Dấu gạch ngang làm rõ hai nhóm đều thuộc phạm vi “mọi người” mà không thay đổi quan hệ cú pháp.
