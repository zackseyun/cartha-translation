revisions:
- from: Nhưng vinh quang, danh dự và bình an sẽ dành cho mọi người làm điều thiện[a]—trước hết là người Do Thái, rồi cũng đến người Hy Lạp[b].
  to: 'Nhưng vinh quang, danh dự và bình an sẽ dành cho mọi người làm điều thiện[a]: trước hết cho người Do Thái, và cũng cho người Hy Lạp[b].'
  rationale: Thay dấu gạch ngang và “rồi cũng đến” bằng dấu hai chấm cùng cấu trúc song song “trước hết cho... và cũng cho...” để làm rõ rằng vinh quang, danh dự và bình an được nói là dành cho cả hai nhóm, trong khi vẫn giữ thứ tự “trước hết” của nguyên văn. Không thay đổi nội dung hay diễn giải thần học.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T10:24:12Z'
review_pass:
  verdict: revise
  source_fidelity: Bản dịch chuyển đạt đúng ba điều được ban (δόξα, τιμή, εἰρήνη), đối tượng là mọi người thực hành điều thiện, và thứ tự “người Do Thái trước hết, cũng người Hy Lạp.” Tuy nhiên, “rồi cũng đến” có thể gợi một diễn tiến thời gian mạnh hơn điều nguyên văn nêu; cấu trúc lặp lại giới từ “cho” phản ánh rõ hơn các cụm Dative song song của tiếng Hy Lạp.
  naturalness: Câu hiện tại nhìn chung tự nhiên và trang trọng. Sửa thành cấu trúc “trước hết cho..., và cũng cho...” sẽ sáng rõ hơn về quan hệ cú pháp, tránh để phần sau dấu gạch ngang bị đọc như một sự giải thích lỏng cho “mọi người.”
  terminology: “Vinh quang, danh dự và bình an,” “điều thiện,” “người Do Thái,” và “người Hy Lạp” đều phù hợp với văn phong Kinh Thánh tiếng Việt hiện đại. Chú thích về “người Hy Lạp” bảo lưu đúng nghĩa rộng có thể có trong cặp Do Thái/Hy Lạp, mà không thay thế từ ngữ chính văn.
  issues:
  - severity: low
    issue: Cụm “rồi cũng đến người Hy Lạp” có sắc thái tuần tự thời gian.
    rationale: πρῶτον xác định người Do Thái là “trước hết”; τε ... καὶ nối thêm người Hy Lạp (“và/cũng”), chứ không tự nó diễn tả một giai đoạn tiếp theo. “Và cũng cho người Hy Lạp” giữ liên kết sát hơn.
  revised_text: 'Nhưng vinh quang, danh dự và bình an sẽ dành cho mọi người làm điều thiện[a]: trước hết cho người Do Thái, và cũng cho người Hy Lạp[b].'
