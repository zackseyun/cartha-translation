revisions:
- from: 'Vậy, bạn là người dạy người khác mà lại không dạy chính mình sao? Bạn là người rao rằng: “Đừng trộm cắp,” mà lại trộm cắp sao?'
  to: 'Vậy, người dạy người khác mà không dạy chính mình sao? Người rao bảo: “Đừng trộm cắp,” mà lại trộm cắp sao?'
  rationale: Chỉnh đại từ và cách diễn đạt để bản dịch tự nhiên, có đăng ký phù hợp, và phản ánh chủ ngữ khái quát trong nguyên văn. Giữ nguyên câu hỏi tu từ, tính suy luận của “Vậy,” và sự lặp lại nhấn mạnh của “trộm cắp.”
  reviewer_model: gpt-5.6-terra
