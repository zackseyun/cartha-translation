review_pass:
  verdict: revise
  source_fidelity: Bản nháp truyền đạt đúng cấu trúc chất vấn tu từ, quan hệ suy luận của οὖν, sự đối lập giữa dạy người khác và không dạy mình, cùng nội dung cấm trộm cắp. Tuy nhiên, cách xưng hô “bạn” cá thể hóa người bị chất vấn và tạo sắc thái hội thoại thân mật không được đánh dấu trong tiếng Hy Lạp; chủ ngữ khái quát “người” phù hợp hơn với lối lập luận của Phao-lô.
  naturalness: “Bạn là người dạy...” lặp cấu trúc và “rao rằng” nghe gượng trong văn tiếng Việt hiện đại có sắc thái trang trọng vừa phải. “Người dạy... / Người rao bảo...” tự nhiên, cô đọng, và giữ nhịp song hành của nguyên văn.
  terminology: “Dạy,” “chính mình,” và “trộm cắp” đều phù hợp. “Rao bảo” diễn đạt κηρύσσων như việc công bố/loan báo công khai mà không thu hẹp thành thuật ngữ nội bộ hội thánh.
  issues:
  - severity: medium
    issue: Đại từ “bạn” không phù hợp với chủ ngữ khái quát trong lời chất vấn.
    rationale: Các phân từ có mạo từ ὁ διδάσκων và ὁ κηρύσσων nêu hạng người được chất vấn, không xác định một quan hệ thân mật hay cá nhân hóa như “bạn”. Trong văn Kinh Thánh tiếng Việt hiện đại, “người” giữ tính khái quát và trang trọng hơn.
  - severity: low
    issue: Cụm “rao rằng” chưa tự nhiên.
    rationale: “Rao bảo” là kết hợp từ tự nhiên hơn để diễn tả công bố một mệnh lệnh, đồng thời giữ nghĩa của κηρύσσω.
  revised_text: 'Vậy, người dạy người khác mà không dạy chính mình sao? Người rao bảo: “Đừng trộm cắp,” mà lại trộm cắp sao?'
