  text: ὁ οὖν διδάσκων ἕτερον σεαυτὸν οὐ διδάσκεις; ὁ κηρύσσων μὴ κλέπτειν κλέπτεις;
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/021.yaml
  text: You, therefore, who teach another, do you not teach yourself? You who proclaim, “Do not steal,” do you steal?
translation:
  language: vi
  text: 'Vậy, người dạy người khác mà không dạy chính mình sao? Người rao bảo: “Đừng trộm cắp,” mà lại trộm cắp sao?'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὖν
  choice: Vậy
  rationale: Đánh dấu kết luận suy ra từ phần lập luận trước; “Vậy” tự nhiên trong tiếng Việt và vẫn giữ rõ quan hệ suy luận.
- source_word: διδάσκων
  choice: là người dạy
  rationale: Diễn đạt phân từ dùng như danh từ bằng một mệnh đề tự nhiên trong tiếng Việt, đồng thời giữ sắc thái chỉ đặc điểm hay hành động của người được nói đến.
- source_word: ἕτερον
  choice: người khác
  rationale: Giữ đối tượng số ít theo nguyên văn; trong tiếng Việt, “người khác” tự nhiên hơn “một người khác” trong cấu trúc này.
- source_word: σεαυτὸν
  choice: chính mình
  rationale: Giữ sự tương phản nhấn mạnh giữa việc dạy người khác và việc không dạy bản thân.
- source_word: οὐ διδάσκεις;
  choice: mà lại không dạy ... sao?
  rationale: Giữ hình thức câu hỏi tu từ có tính khiển trách; “mà lại” làm nổi bật nghịch lý vốn có trong câu Hy Lạp.
- source_word: κηρύσσων
  choice: là người rao
  rationale: “Rao” diễn tả việc công khai công bố, tránh thu hẹp nghĩa vào hoạt động giảng đạo trong hội thánh.
- source_word: μὴ κλέπτειν
  choice: Đừng trộm cắp
  rationale: Chuyển nội dung của động từ nguyên mẫu thành lời cấm trực tiếp, tự nhiên trong tiếng Việt và phù hợp với chức năng của cụm từ trong câu.
- source_word: κλέπτεις;
  choice: mà lại trộm cắp sao?
  rationale: Giữ câu hỏi tu từ trực diện và sắc thái tố cáo; lặp lại “trộm cắp” bảo toàn sự đối xứng của nguyên văn.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “bạn” cho đại từ ngôi hai số ít để phản ánh lời chất vấn trực tiếp σεαυτόν/διδάσκεις/κλέπτεις; cấu trúc lặp giữ nhịp điệu và sức nặng tu từ của nguyên văn.
