id: ROM.2.7
reference: Romans 2:7
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: τοῖς μὲν καθ’ ὑπομονὴν ἔργου ἀγαθοῦ δόξαν καὶ τιμὴν καὶ ἀφθαρσίαν ζητοῦσιν ζωὴν αἰώνιον·
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/007.yaml
  text: eternal life to those who by perseverance in doing good seek glory and honor and immortality.
translation:
  language: vi
  text: còn những ai bền lòng làm điều lành, tìm kiếm vinh quang, danh dự và sự bất tử, thì Ngài sẽ ban sự sống đời đời.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθ’ ὑπομονὴν ἔργου ἀγαθοῦ
  choice: bền lòng làm điều lành
  rationale: Diễn đạt tự nhiên ý kiên trì trong việc làm tốt; tránh cách hiểu cứng rằng chỉ một ‘công việc tốt’ đơn lẻ được nói đến.
- source_word: δόξαν καὶ τιμὴν καὶ ἀφθαρσίαν
  choice: vinh quang, danh dự và sự bất tử
  rationale: Giữ nguyên ba đối tượng song song của động từ ‘tìm kiếm’; ‘sự bất tử’ chuyển tải ἀφθαρσία trong ngữ cảnh sự sống đời đời.
- source_word: ζωὴν αἰώνιον
  choice: sự sống đời đời
  rationale: Cách nói quen thuộc, trang trọng và chính xác trong tiếng Việt cho sự sống thuộc thời đại đời đời.
theological_decisions:
- issue: Quan hệ giữa việc bền lòng làm điều lành và sự sống đời đời
  choice: Giữ nguyên cấu trúc phát biểu rằng Đức Chúa Trời ban sự sống đời đời cho những người được mô tả như vậy.
  alternative: Giải thích câu theo một hệ thống thần học cụ thể về công đức, đức tin hoặc bằng chứng của đức tin.
  rationale: Câu nguồn không tự giải thích quan hệ thần học rộng hơn; bản dịch cần bảo toàn sức căng của phát biểu trong văn mạch thay vì chèn lời giải mang tính giáo phái.
- issue: Chủ ngữ hàm ẩn của ‘ban’
  choice: Dùng ‘Ngài sẽ ban’ để câu tiếng Việt trọn nghĩa theo động từ chi phối từ câu 6.
  alternative: 'Dịch như một mảnh câu: ‘sự sống đời đời cho những ai...’'
  rationale: Hy Lạp câu 7 phụ thuộc vào ἀποδώσει ở câu 6. Bổ sung ‘Ngài sẽ ban’ làm rõ cú pháp liên câu mà không thay đổi nội dung.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng ‘bền lòng’ để diễn đạt sự kiên trì lâu dài; giữ nhịp liệt kê ba danh từ của nguyên văn.
