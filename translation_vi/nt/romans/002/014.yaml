id: ROM.2.14
reference: Romans 2:14
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὅταν γὰρ ἔθνη τὰ μὴ νόμον ἔχοντα φύσει τὰ τοῦ νόμου ⸀ποιῶσιν, οὗτοι νόμον μὴ ἔχοντες ἑαυτοῖς εἰσιν νόμος·
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/014.yaml
  text: For whenever Gentiles[a], who do not have the law, do by nature the things of the law, these, though not having the law[c][b], are a law to themselves.
translation:
  language: vi
  text: Vì khi các dân ngoại[a], là những người không có luật pháp, theo bản tính mà làm những điều thuộc về luật pháp[b], thì họ, dù không có luật pháp, cũng là luật pháp cho chính họ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “các dân.”
    reason: lexical_alternative
  - marker: b
    text: Hay “theo lẽ tự nhiên” hoặc “một cách tự nhiên.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔθνη
  choice: các dân ngoại
  rationale: Trong lập luận của Phao-lô, cụm từ này chỉ những người không thuộc dân Do Thái, được đặt trong thế tương phản với những người có luật pháp Môi-se; “các dân ngoại” truyền đạt đúng sắc thái dân tộc–tôn giáo, còn “các dân” rộng nghĩa hơn.
- source_word: νόμον / νόμου / νόμος
  choice: luật pháp
  rationale: 'Dùng nhất quán “luật pháp” để giữ sự lặp từ và lối chơi ý niệm của câu Hy Lạp. Trong hai lần đầu, từ này hướng đến luật pháp Môi-se theo văn cảnh; ở mệnh đề cuối, nó mang nghĩa vị ngữ, ví von: “là luật pháp cho chính mình.”'
- source_word: φύσει
  choice: tự nhiên
  rationale: “Tự nhiên” là cách diễn đạt ngắn gọn, tự nhiên trong tiếng Việt và vẫn giữ độ mở của nguyên văn, không quyết định rằng hành động ấy là do bản năng, tri thức đạo đức bẩm sinh hay tập quán.
- source_word: τὰ τοῦ νόμου ποιῶσιν
  choice: làm những điều thuộc về luật pháp
  rationale: Cách dịch này giữ cấu trúc và độ rộng của nguyên văn rõ hơn “làm điều luật pháp đòi hỏi,” đồng thời vẫn dễ hiểu trong tiếng Việt hiện đại.
- source_word: ἑαυτοῖς εἰσιν νόμος
  choice: là luật pháp cho chính mình
  rationale: Cách diễn đạt này chuyển tải tự nhiên sở cách ἑαυτοῖς và giữ hình ảnh tu từ của Phao-lô, nhưng không hàm ý quá mức rằng họ tự đặt ra luật pháp một cách tự trị.
theological_decisions:
- issue: Cách hiểu φύσει liên quan đến tri thức đạo đức và lương tâm
  choice: Giữ cách nói rộng “tự nhiên” trong chính văn.
  alternative: Dịch theo hướng giải thích là “theo bản năng” hoặc “do ý thức tự nhiên.”
  rationale: Riêng φύσει không buộc phải hiểu theo một học thuyết cụ thể về tri thức đạo đức bẩm sinh. Giữ cách diễn đạt rộng giúp bảo toàn sự căng thẳng thần học trong lập luận của Phao-lô.
- issue: Phạm vi nghĩa của νόμος trong câu
  choice: Giữ cùng một từ “luật pháp” ở cả ba vị trí.
  alternative: Viết rõ “luật pháp Môi-se” ở các lần đầu hoặc đổi mệnh đề cuối thành “tự có chuẩn mực.”
  rationale: Văn cảnh gợi đến luật pháp Môi-se, nhưng nguyên văn không nêu tên Môi-se; đồng thời sự lặp lại νόμος nối kết luật pháp mà dân ngoại không có với hình ảnh họ “là luật pháp cho chính mình.”
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ “luật pháp” nhất quán để bảo toàn sự lặp từ của nguyên bản. Dấu phẩy làm rõ mệnh đề phụ mà không phá nhịp lập luận.
