id: ROM.2.11
reference: Romans 2:11
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οὐ γάρ ἐστιν προσωπολημψία παρὰ τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/011.yaml
  text: For there is no partiality with God[a].
translation:
  language: vi
  text: Vì Đức Chúa Trời không thiên vị.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “không thiên tư.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: γάρ
  choice: Vì
  rationale: Liên từ này nêu cơ sở giải thích cho lời khẳng định ở câu trước; “Vì” truyền đạt tự nhiên quan hệ lập luận ấy.
- source_word: προσωπολημψία
  choice: thiên vị
  rationale: Danh từ chỉ sự đối xử ưu ái dựa trên địa vị hoặc những yếu tố bề ngoài. “Thiên vị” là cách nói hiện đại, rõ nghĩa và phù hợp với sắc thái đạo đức–phán xét trong ngữ cảnh.
- source_word: παρὰ τῷ θεῷ
  choice: Đức Chúa Trời không…
  rationale: Cụm παρά với sở cách diễn tả điều tồn tại nơi hoặc trước mặt Đức Chúa Trời. Tiếng Việt tự nhiên hơn khi chuyển cấu trúc tồn tại của tiếng Hy Lạp thành lời khẳng định trực tiếp về Đức Chúa Trời, mà không thay đổi nội dung.
- source_word: οὐ γάρ ἐστιν προσωπολημψία παρὰ τῷ θεῷ
  choice: Vì Đức Chúa Trời không thiên vị.
  rationale: Bản dịch chuyển cấu trúc “không có sự thiên vị nơi Đức Chúa Trời” sang cấu trúc động từ tự nhiên trong tiếng Việt. Cách này giữ nguyên ý nghĩa và sắc thái khái quát, đồng thời tránh lối diễn đạt gượng gạo.
theological_decisions:
- issue: Cách diễn đạt sự công minh của Đức Chúa Trời
  choice: 'Dịch trực tiếp: “Đức Chúa Trời không thiên vị.”'
  alternative: “Nơi Đức Chúa Trời không có sự thiên vị.”
  rationale: Cả hai đều khẳng định cùng một chân lý. Cách được chọn tự nhiên và dễ hiểu hơn trong tiếng Việt hiện đại, không thêm một nét thần học nào ngoài nội dung của nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Đức Chúa Trời” được dùng cho θεός; “thiên vị” là từ thông dụng, phù hợp cả ngữ cảnh đạo đức lẫn xét xử.
