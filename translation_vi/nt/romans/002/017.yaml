source:
  edition: SBLGNT
  text: ⸂Εἰ δὲ⸃ σὺ Ἰουδαῖος ἐπονομάζῃ καὶ ἐπαναπαύῃ ⸀νόμῳ καὶ καυχᾶσαι ἐν θεῷ
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/017.yaml
  text: But if you call yourself a Jew and rely on the law and boast in God[b][a],
translation:
  language: vi
  text: Nhưng nếu bạn tự xưng là người Do Thái[a], dựa vào luật pháp[b] và tự hào về Đức Chúa Trời,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “mang danh người Do Thái” hoặc “được gọi là người Do Thái.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “nương cậy vào luật pháp.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰ δὲ
  choice: Nhưng nếu
  rationale: Giữ lực điều kiện của εἰ và sắc thái chuyển ý, hơi tương phản của δέ trong lập luận đang tiếp diễn.
- source_word: Ἰουδαῖος
  choice: người Do Thái
  rationale: Trong thư Rô-ma, từ này chủ yếu chỉ căn tính dân tộc–tôn giáo chứ không đơn thuần là địa lý.
- source_word: ἐπονομάζῃ
  choice: tự xưng là
  rationale: 'Thể trung gian thích hợp với nghĩa phản thân: tự nhận hoặc mang danh xưng ấy; cách diễn đạt này tự nhiên và giữ được sắc thái chất vấn.'
- source_word: ἐπαναπαύῃ
  choice: dựa vào
  rationale: Diễn đạt sự nương cậy, tin tưởng chứ không phải sự nghỉ ngơi theo nghĩa thể lý.
- source_word: νόμῳ
  choice: luật pháp
  rationale: Trong ngữ cảnh, từ này nhiều khả năng chỉ Luật Môi-se như một phạm trù giao ước quen thuộc; tiếng Việt không cần thêm mạo từ.
- source_word: καυχᾶσαι
  choice: tự hào
  rationale: Giữ ý khoe hoặc lấy làm hãnh diện, đồng thời tự nhiên trong tiếng Việt; giá trị tích cực hay tiêu cực vẫn do ngữ cảnh quyết định.
- source_word: ἐν θεῷ
  choice: về Đức Chúa Trời
  rationale: Trong cấu trúc với καυχάομαι, ἐν đánh dấu đối tượng hoặc nền tảng của sự tự hào. Cách nói này tự nhiên trong tiếng Việt mà không quyết định quá mức sắc thái 'nhờ', 'trong' hay 'về'.
theological_decisions:
- issue: Sắc thái của việc καυχᾶσαι ἐν θεῷ
  choice: tự hào về Đức Chúa Trời
  alternative: hãnh diện trong Đức Chúa Trời; khoe mình về Đức Chúa Trời
  rationale: Bản dịch giữ đối tượng của niềm tự hào là Đức Chúa Trời và để văn cảnh xác định lời này là lời xác nhận căn tính hay lời phê phán sự cậy mình; không thêm hàm ý giáo phái.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “bạn” cho đại từ số ít σὺ để giữ lời chất vấn trực tiếp; câu kết bằng dấu phẩy vì đây là phần mở đầu của một cấu trúc điều kiện kéo dài sang các câu tiếp theo.
