revisions:
- from: Vì tất cả những người đã phạm tội mà không có luật pháp[a] cũng sẽ bị diệt vong mà không có luật pháp; còn tất cả những người đã phạm tội dưới luật pháp[b] sẽ bị xét xử qua luật pháp.[c]
  to: Vì tất cả những ai phạm tội ngoài luật pháp[a] thì cũng sẽ hư mất ngoài luật pháp; còn tất cả những ai phạm tội dưới luật pháp[b] sẽ bị xét xử bởi luật pháp.[c]
  rationale: Bản sửa thay cách diễn đạt bị động không tự nhiên «bị diệt vong» bằng «hư mất», điều chỉnh ἀνόμως thành «ngoài luật pháp» để nêu rõ tương quan với luật pháp, và dùng «bởi luật pháp» cho διά. Cấu trúc phân phối, sự tương phản giữa hai nhóm, tính trung tính của phán xét, và sự không xác định về cơ chế của sự hư mất đều được bảo toàn.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T10:24:17Z'
review_pass:
  verdict: revise
  source_fidelity: Bản nháp giữ đúng cấu trúc đối chiếu, liên từ «Vì», nghĩa trung tính của «sẽ bị xét xử», và không áp đặt cách hiểu giáo phái về sự hư mất. Tuy nhiên, «sẽ bị diệt vong» không phải cách diễn đạt tự nhiên cho động từ trung động ἀπολοῦνται; «sẽ hư mất» vừa sát nghĩa vừa tránh tạo một bị động không có trong nguyên ngữ. «Ngoài luật pháp» diễn đạt gọn và rõ tình trạng không thuộc phạm vi Luật pháp của ἀνόμως.
  naturalness: «Tất cả những ai» tự nhiên và gọn hơn «tất cả những người». «Ngoài luật pháp ... hư mất ngoài luật pháp» giữ phép song hành của nguyên văn mà không cần liên kết «mà» hơi nặng. «Bởi luật pháp» là cách tiếng Việt tự nhiên hơn «qua luật pháp» trong ngữ cảnh luật pháp là phương tiện/chuẩn mực xét xử.
  terminology: Dùng nhất quán «luật pháp» trong chính văn, không viết hoa để tránh biến cách viết hoa thành một khẳng định diễn giải trong khi vẫn giữ quy chiếu Môi-se theo văn mạch. Các chú thích phân biệt «ngoài», «dưới/trong», và «bởi» một cách minh bạch. Chú thích a của bản nháp cần sửa vì đã nêu lại chính cách dịch đang dùng là một phương án thay thế.
  issues:
  - severity: medium
    issue: «sẽ bị diệt vong» dịch ἀπολοῦνται bằng một cấu trúc bị động gượng.
    rationale: ἀπολοῦνται là hình thức trung động tương lai; tiếng Việt tự nhiên dùng «sẽ hư mất». Cách này vẫn không xác định bản chất của sự hư mất.
  - severity: low
    issue: Chú thích a trùng với cách dịch chính «mà không có luật pháp».
    rationale: Chú thích về phương án từ vựng phải nêu các phương án thực sự khác với bản văn chính; nếu chọn «ngoài luật pháp», có thể ghi «không có luật pháp» và «vô luật pháp».
  - severity: low
    issue: «qua luật pháp» kém tự nhiên trong ngữ cảnh xét xử.
    rationale: «Bởi luật pháp» diễn đạt rõ luật pháp là phương tiện hoặc chuẩn mực xét xử, đồng thời vẫn phân biệt với «dưới luật pháp».
