id: ROM.2.12
reference: Romans 2:12
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ὅσοι γὰρ ἀνόμως ἥμαρτον, ἀνόμως καὶ ἀπολοῦνται· καὶ ὅσοι ἐν νόμῳ ἥμαρτον, διὰ νόμου κριθήσονται·
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/012.yaml
  text: For all who sinned apart from the law will also perish apart from the law[c][b][a], and all who sinned under the law will be judged through the law.
translation:
  language: vi
  text: Vì tất cả những ai phạm tội ngoài luật pháp[a] thì cũng sẽ hư mất ngoài luật pháp; còn tất cả những ai phạm tội dưới luật pháp[b] sẽ bị xét xử bởi luật pháp.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “không có luật pháp” hoặc “vô luật pháp” ở cả hai chỗ.
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn: “trong luật pháp”; “dưới luật pháp” diễn đạt ý ở trong phạm vi chi phối của luật pháp.'
    reason: lexical_alternative
  - marker: c
    text: Cũng có thể dịch là “qua luật pháp” hoặc “theo luật pháp”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνόμως
  choice: mà không có luật pháp
  rationale: Diễn đạt tình trạng ở ngoài phạm vi có Luật pháp, phù hợp với sự tương phản cùng ἐν νόμῳ; tránh thu hẹp nghĩa thành chỉ hành vi 'vô luật pháp'.
- source_word: ἥμαρτον
  choice: đã phạm tội
  rationale: Thể hiện tự nhiên thì quá khứ của động từ aorist mà không diễn giải quá mức sắc thái thể.
- source_word: ἀπολοῦνται
  choice: sẽ bị diệt vong
  rationale: Giữ ý về kết cục hủy mất nhưng không xác định cơ chế hay bản chất của hình phạt cuối cùng.
- source_word: ἐν νόμῳ
  choice: dưới luật pháp
  rationale: Diễn đạt việc ở trong phạm vi chi phối và xét xử của Luật pháp, thay vì dịch cứng là 'trong luật pháp'.
- source_word: διὰ νόμου
  choice: qua luật pháp
  rationale: Giữ nét riêng của διά, trình bày Luật pháp như phương tiện hoặc chuẩn mực trong sự xét xử, đồng thời phân biệt với ἐν νόμῳ.
- source_word: κριθήσονται
  choice: sẽ bị xét xử
  rationale: Giữ nghĩa tư pháp trung tính của κρίνω, không tự động chuyển thành 'bị kết án'.
- source_word: Ὅσοι ... καὶ ὅσοι
  choice: tất cả những người ... còn tất cả những người
  rationale: Bảo toàn sức phân phối và cấu trúc song song của hai nhóm, với cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: γὰρ
  choice: Vì
  rationale: Giữ liên từ giải thích, cho thấy câu này nêu cơ sở cho lập luận ngay trước đó.
theological_decisions:
- issue: Nghĩa quy chiếu của νόμος
  choice: Luật pháp Môi-se nói riêng, nhưng trong chính văn chỉ ghi 'luật pháp'
  alternative: Luật đạo đức theo nghĩa tổng quát
  rationale: Sự đối chiếu giữa người không có Luật pháp và người ở dưới Luật pháp trong Rô-ma 2 chủ yếu liên quan đến dân ngoại và người Do Thái; cách dịch không chèn lời giải thích mang tính diễn giải vào chính văn.
- issue: Ý nghĩa của ἀπολοῦνται đối với sự phán xét cuối cùng
  choice: Dịch là 'sẽ bị diệt vong' mà không xác định đó là sự tiêu diệt hoàn toàn hay hình phạt đời đời
  alternative: Dịch là 'sẽ bị kết án' hoặc giải thích cụ thể bản chất hình phạt
  rationale: Câu này nêu kết cục tư pháp nhưng không tự định nghĩa cách thức của sự phán xét cuối cùng; bản dịch giữ nguyên sức căng thần học.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng 'luật pháp' để phù hợp ngữ cảnh Kinh Thánh và giữ cấu trúc đối chiếu của câu; dùng thể bị động trong 'bị diệt vong' và 'bị xét xử' nhằm truyền đạt tự nhiên hai động từ tương lai thụ động/trung động trong tiếng Việt.
