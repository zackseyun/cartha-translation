id: ROM.2.24
reference: Romans 2:24
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: τὸ γὰρ ὄνομα τοῦ θεοῦ δι’ ὑμᾶς βλασφημεῖται ἐν τοῖς ἔθνεσιν, καθὼς γέγραπται.
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/024.yaml
  text: For the name of God is blasphemed among the Gentiles because of you[b][a], just as it is written.
translation:
  language: vi
  text: Vì do anh em mà danh Đức Chúa Trời bị phỉ báng giữa các dân ngoại,[a][b] như có lời chép.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “giữa các dân.”'
    reason: lexical_alternative
  - marker: b
    text: Phao-lô đang gợi lại lời Kinh Thánh, đặc biệt là Ê-sai 52:5, cùng chủ đề cũng được phản ánh trong Ê-xê-chi-ên 36:20–23.
    reason: cross_reference
lexical_decisions:
- source_word: γὰρ
  choice: Vì
  rationale: Giữ quan hệ giải thích với lời quở trách ngay trước đó và phù hợp với cách nối câu tự nhiên trong tiếng Việt.
- source_word: τὸ ὄνομα τοῦ θεοῦ
  choice: danh Đức Chúa Trời
  rationale: Dịch trực tiếp cấu trúc “danh của Đức Chúa Trời”; “danh” vừa trang trọng vừa giữ được sắc thái về uy danh mà không diễn giải quá mức.
- source_word: δι’ ὑμᾶς
  choice: do anh em
  rationale: διά với đối cách ở đây diễn tả nguyên nhân; “do anh em” truyền đạt rõ lời cáo buộc của Phao-lô.
- source_word: βλασφημεῖται
  choice: bị xúc phạm
  rationale: Thể bị động hiện tại chỉ việc danh Đức Chúa Trời bị nói phạm hoặc phỉ báng. “Bị xúc phạm” tự nhiên trong tiếng Việt hiện đại và vẫn giữ sức nặng tôn giáo của động từ.
- source_word: ἐν τοῖς ἔθνεσιν
  choice: giữa các dân ngoại
  rationale: Trong ngữ cảnh đối chiếu người Do Thái với các ἔθνη, cụm này chủ yếu chỉ những người không thuộc dân Do Thái; cách hiểu “các dân” được giữ trong chú thích.
- source_word: καθὼς γέγραπται
  choice: như có lời chép
  rationale: Công thức quen thuộc để dẫn Kinh Thánh, phản ánh καθώς và thể hoàn thành γέγραπται bằng tiếng Việt tự nhiên, trang trọng.
theological_decisions:
- issue: Sắc thái của βλασφημεῖται
  choice: bị xúc phạm
  alternative: bị phạm thượng; bị phỉ báng
  rationale: Không thu hẹp hành động chỉ vào một thuật ngữ giáo lý chuyên biệt, nhưng vẫn diễn đạt việc người ta nói điều bất kính chống lại danh Đức Chúa Trời.
- issue: Đối tượng của ἐν τοῖς ἔθνεσιν
  choice: các dân ngoại
  alternative: các dân
  rationale: Ngữ cảnh Rô-ma 2 nghiêng về người ngoài Do Thái, nhưng nghĩa rộng hơn về “các dân” vẫn có thật và được nêu trong chú thích.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “anh em” cho đại từ số nhiều ὑμᾶς theo lối xưng hô cộng đồng; giữ “danh Đức Chúa Trời” và công thức “như có lời chép” để bảo tồn sắc thái Kinh Thánh. Các dấu chú thích [a], [b] đều xuất hiện trong chính văn.
