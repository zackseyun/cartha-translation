id: ROM.2.15
reference: Romans 2:15
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οἵτινες ἐνδείκνυνται τὸ ἔργον τοῦ νόμου γραπτὸν ἐν ταῖς καρδίαις αὐτῶν, συμμαρτυρούσης αὐτῶν τῆς συνειδήσεως καὶ μεταξὺ ἀλλήλων τῶν λογισμῶν κατηγορούντων ἢ καὶ ἀπολογουμένων,
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/015.yaml
  text: They show that the work of the law is written on their hearts[b][a], while their conscience also bears witness and their thoughts accuse or even defend them.
translation:
  language: vi
  text: Họ cho thấy công việc của luật pháp[a] được viết trong lòng họ; lương tâm họ cũng làm chứng, và những suy nghĩ của họ buộc tội hoặc thậm chí bênh vực họ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “điều luật pháp đòi hỏi” hoặc “những gì luật pháp đòi hỏi.”'
    reason: lexical_alternative
  - marker: b
    text: Cụm Hy Lạp sát chữ có ý “giữa nhau” hoặc “lẫn nhau.” Cụm này có thể gợi ý rằng các suy nghĩ buộc tội hay biện hộ lẫn nhau; cách dịch chính văn hiểu các suy nghĩ là buộc tội hoặc bênh vực những người đang được nói đến.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐνδείκνυνται
  choice: cho thấy
  rationale: Cách diễn đạt tự nhiên, hiện đại, giữ được ý nghĩa đưa ra bằng chứng mà không nhấn quá mức thành “chứng minh”.
- source_word: τὸ ἔργον τοῦ νόμου
  choice: công việc của luật pháp
  rationale: Giữ danh từ số ít “công việc” của nguyên văn và tránh mặc nhiên diễn giải thành “những điều luật pháp đòi hỏi”; cách hiểu thông dụng ấy được nêu trong chú thích.
- source_word: γραπτὸν ἐν ταῖς καρδίαις αὐτῶν
  choice: được viết trong lòng mình
  rationale: “Trong lòng” là cách nói tự nhiên trong tiếng Việt cho hình ảnh một điều được ghi khắc ở nội tâm; “mình” quy chiếu rõ về chủ thể số nhiều “họ”.
- source_word: συμμαρτυρούσης αὐτῶν τῆς συνειδήσεως
  choice: lương tâm họ cũng cùng làm chứng
  rationale: Giữ yếu tố “cùng” trong động từ ghép συμμαρτυρέω, diễn tả lời chứng xác nhận đi kèm, đồng thời chuyển cấu trúc thuộc cách tuyệt đối sang tiếng Việt dễ hiểu.
- source_word: μεταξὺ ἀλλήλων τῶν λογισμῶν
  choice: những suy nghĩ của họ, khi đối chiếu với nhau
  rationale: Phản ánh ý tương hỗ của ἀλλήλων theo lối nói tự nhiên hơn trong tiếng Việt, nhưng không khẳng định quá mức rằng các suy nghĩ nhất thiết “xung đột” nhau.
- source_word: κατηγορούντων ἢ καὶ ἀπολογουμένων
  choice: buộc tội hoặc thậm chí bênh vực
  rationale: “Bênh vực” phản ánh nghĩa biện hộ của ἀπολογέομαι chính xác hơn “bào chữa cho lỗi”; “thậm chí” thể hiện sắc thái nhấn mạnh của καὶ sau ἢ.
theological_decisions:
- issue: Phao-lô nói chung về nhận thức đạo đức nội tâm hay cụ thể về những điều luật pháp đòi hỏi.
  choice: Giữ cách nói ít diễn giải hơn là “công việc của luật pháp” trong chính văn.
  alternative: “điều luật pháp đòi hỏi” hoặc “những gì luật pháp đòi hỏi”.
  rationale: Nguyên văn Hy Lạp dùng danh từ số ít ἔργον và cô đọng hơn cách diễn giải quen thuộc; giữ nguyên độ cô đọng giúp bảo toàn sự căng thẳng thần học của câu.
- issue: Các suy nghĩ buộc tội hoặc bênh vực lẫn nhau, hay buộc tội hoặc bênh vực chính những người đang được nói đến.
  choice: Hiểu đối tượng được lược bỏ là “họ”, còn μεταξὺ ἀλλήλων mô tả việc các suy nghĩ được đặt cạnh nhau để đối chiếu.
  alternative: Hiểu các suy nghĩ là đối tượng của hành động và dịch “buộc tội hoặc bênh vực lẫn nhau”.
  rationale: Cấu trúc Hy Lạp cô đọng và có thể tạo cảm giác tương hỗ, nhưng về ngữ cảnh, các suy nghĩ đóng vai trò buộc tội hay biện hộ cho con người. Chú thích vẫn ghi nhận độ sát chữ và khả năng diễn đạt khác.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại, dùng “luật pháp” và “lương tâm” là các từ phổ thông trong ngữ cảnh Kinh Thánh. Cấu trúc câu giữ sự liên kết chặt của nguyên văn nhưng dùng dấu chấm phẩy và cụm “khi đối chiếu với nhau” để người đọc phổ thông dễ theo dõi.
