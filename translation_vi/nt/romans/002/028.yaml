source:
  edition: SBLGNT
  text: οὐ γὰρ ὁ ἐν τῷ φανερῷ Ἰουδαῖός ἐστιν, οὐδὲ ἡ ἐν τῷ φανερῷ ἐν σαρκὶ περιτομή·
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/028.yaml
  text: For a Jew is not one outwardly[a], nor is circumcision outward in the flesh[c][b];
translation:
  language: vi
  text: Vì người Do Thái chỉ ở bề ngoài không phải là người Do Thái, và phép cắt bì chỉ ở bề ngoài, nơi thân xác, cũng không phải là phép cắt bì.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Chỉ ở bề ngoài” đối lập với thực tại “bên trong” được nêu ở câu 29. “Nơi thân xác” nói đến phép cắt bì theo thể chất.
    reason: translation_clarity
lexical_decisions:
- source_word: Ἰουδαῖος
  choice: người Do Thái
  rationale: Trong mạch lập luận của Rô-ma, từ này chỉ căn tính giao ước của người thuộc dân Israel hơn là nguồn gốc địa lý đơn thuần; cách dịch này tự nhiên và chính xác trong tiếng Việt hiện đại.
- source_word: ἐν τῷ φανερῷ
  choice: chỉ có vẻ bề ngoài / chỉ thể hiện ra bên ngoài
  rationale: Cụm từ chỉ điều hiển lộ, có thể thấy được, đối lập với chiều kích bên trong ở câu 29. Hai cách diễn đạt tương ứng với danh ngữ mà chúng bổ nghĩa và giữ nét nghĩa bên ngoài-hữu hình.
- source_word: περιτομή
  choice: phép cắt bì
  rationale: Đây là thuật ngữ tiếng Việt thông dụng và chính xác cho dấu hiệu giao ước đang được bàn đến.
- source_word: ἐν σαρκί
  choice: nơi thân xác
  rationale: Ở đây σάρξ mang nghĩa thân thể theo nghĩa đen, nói đến thủ thuật thể chất; “nơi thân xác” tự nhiên hơn “trong xác thịt” trong tiếng Việt mà vẫn giữ đối lập với thực tại bên trong ở câu kế tiếp.
- source_word: οὐ ... ἐστιν, οὐδὲ ... περιτομή
  choice: thì không thật là ...; ... cũng không thật là ...
  rationale: Tiếng Hy Lạp có cấu trúc tỉnh lược ở vế hai. Việc bổ sung “thật là” làm rõ sự phủ định về căn tính theo văn cảnh, đồng thời tránh câu tiếng Việt tối nghĩa; không hàm ý phủ nhận sự tồn tại lịch sử hay thể chất của người Do Thái hoặc phép cắt bì.
- source_word: γὰρ
  choice: Vì
  rationale: Giữ quan hệ giải thích với lập luận ngay trước đó.
theological_decisions:
- issue: Căn tính giao ước trong “người Do Thái” và “phép cắt bì”
  choice: Câu văn phủ nhận rằng biểu hiện hữu hình bên ngoài, tự nó, cấu thành thực tại giao ước mà Phao-lô đang nói đến.
  alternative: Hiểu câu này là phủ nhận hoàn toàn căn tính Do Thái hoặc thay thế nó bằng một phạm trù thuần túy thuộc linh.
  rationale: Cấu trúc đối lập giữa bên ngoài ở câu 28 và bên trong ở câu 29 không xóa bỏ các phạm trù “người Do Thái” và “phép cắt bì,” nhưng đặt vấn đề về điều làm nên thực chất của chúng. Bản dịch giữ sự căng thẳng ấy mà không áp đặt một hệ thống thần học.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “người Do Thái” thay vì “người Giu-đa”; dùng “thân xác” để diễn đạt nghĩa thể chất của σάρξ mà tránh sắc thái đạo đức tiêu cực không có trong câu này. Dấu chú thích [a] xuất hiện trong chính văn.
