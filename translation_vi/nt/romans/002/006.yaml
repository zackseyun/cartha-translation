  source_fidelity: 'Bản nháp truyền đạt đúng cấu trúc và ý nghĩa cốt lõi: Đấng được nhắc đến trong ngữ cảnh trước sẽ báo trả từng cá nhân theo các ἔργα của người đó. Tuy nhiên, «việc họ đã làm» thêm sắc thái quá khứ («đã») không được biểu thị riêng trong nguyên ngữ và dùng «họ» có thể được đọc là số nhiều trong tiếng Việt. «Các việc làm của người ấy» phản ánh rõ hơn số nhiều τὰ ἔργα và lực phân phối/sở hữu đại diện của ἑκάστῳ ... αὐτοῦ.'
  naturalness: «Đấng sẽ báo trả mỗi người tùy theo các việc làm của người ấy» là văn phong hiện đại, trang trọng, rõ nghĩa và thích hợp với văn mạch phán xét. «Báo trả» giữ được ý hoàn trả/đền đáp có thể bao gồm cả hậu quả tích cực lẫn tiêu cực.
