  text: who will repay each one according to his works[a][b].
translation:
  language: vi
  text: Đấng sẽ báo trả mỗi người tùy theo các việc làm của người ấy.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὃς
  choice: Đấng
  rationale: Đại từ quan hệ nối lại với Đức Chúa Trời trong ngữ cảnh trước; “Đấng” tự nhiên, trang trọng và cho thấy đối tượng chỉ về Đức Chúa Trời mà không thêm cách giải nghĩa ngoài ngữ cảnh.
- source_word: ἀποδώσει
  choice: sẽ báo trả
  rationale: Giữ sắc thái hoàn trả hay đền đáp trong bối cảnh phán xét, thay vì làm nhẹ thành “đối xử” hoặc thu hẹp thành phần thưởng tích cực.
- source_word: ἑκάστῳ
  choice: mỗi người
  rationale: Giữ lực phân phối của dạng số ít, nhấn mạnh từng cá nhân, đồng thời tự nhiên trong tiếng Việt hiện đại.
- source_word: κατὰ
  choice: tùy theo
  rationale: Diễn đạt tiêu chuẩn hay căn cứ của sự báo trả một cách tự nhiên; không hàm ý chỉ căn cứ vào số lượng.
- source_word: τὰ ἔργα
  choice: việc họ đã làm
  rationale: Chuyển nghĩa ἔργα thành một cụm từ tiếng Việt thông dụng, bao quát các hành vi hay việc làm; thì hoàn thành trong tiếng Việt giúp cụm này tự nhiên trong ngữ cảnh phán xét mà không thay đổi nội dung nguồn.
- source_word: αὐτοῦ
  choice: họ
  rationale: Đại từ số ít giống đực của Hy Lạp có lực đại diện, quy về “mỗi người”. Tiếng Việt hiện đại dùng “họ” tự nhiên và bao hàm hơn trong cấu trúc này; ý sở hữu được thể hiện qua cụm “họ đã làm”.
theological_decisions:
- issue: Sự phán xét tùy theo việc làm
  choice: 'Giữ nguyên lời khẳng định mang tính báo trả: Đức Chúa Trời sẽ báo trả từng người tùy theo việc người ấy đã làm.'
  alternative: Làm nhẹ thành “đối xử với”, hoặc thu hẹp thành “ban thưởng cho”.
  rationale: Câu Hy Lạp nêu rõ sự báo trả theo ἔργα. Bản dịch không hòa giải trước phát biểu này với các phần khác trong thư Rô-ma về sự xưng công chính, nhưng bảo tồn nguyên vẹn sức căng thần học của câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Báo trả” giữ sắc thái tư pháp của ἀποδώσει; “việc họ đã làm” tự nhiên hơn “công việc của họ” trong câu này và tránh khiến ἔργα bị hiểu chủ yếu là nghề nghiệp. Đại từ “họ” được dùng theo nghĩa số ít đại diện trong tiếng Việt hiện đại.
