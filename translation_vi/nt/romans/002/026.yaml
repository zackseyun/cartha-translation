source:
  edition: SBLGNT
  text: ἐὰν οὖν ἡ ἀκροβυστία τὰ δικαιώματα τοῦ νόμου φυλάσσῃ, ⸀οὐχ ἡ ἀκροβυστία αὐτοῦ εἰς περιτομὴν λογισθήσεται;
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/026.yaml
  text: So then[a], if the uncircumcised man keeps the requirements of the law, will not his uncircumcision be counted as circumcision?
translation:
  language: vi
  text: Vậy, nếu người không cắt bì tuân giữ các điều luật pháp đòi hỏi, thì tình trạng không cắt bì của người ấy chẳng phải sẽ được kể như cắt bì sao?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Theo sát chữ: “nếu tình trạng không cắt bì tuân giữ… thì chẳng phải tình trạng không cắt bì của người ấy sẽ được kể như cắt bì sao?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκροβυστία
  choice: người không chịu cắt bì / tình trạng không cắt bì
  rationale: Danh từ theo nghĩa đen là “tình trạng không cắt bì”, nhưng lần xuất hiện thứ nhất chỉ người mang tình trạng ấy; αὐτοῦ (“của người ấy”) củng cố cách hiểu mang tính cá nhân. Bản dịch dùng cách diễn đạt tự nhiên ở lần đầu và giữ nghĩa danh từ ở lần sau.
- source_word: δικαιώματα
  choice: những điều luật pháp đòi hỏi
  rationale: Diễn đạt rõ nghĩa số nhiều về các yêu cầu hay quy định của luật pháp, không thêm sắc thái thần học ngoài văn bản.
- source_word: νόμου
  choice: luật pháp
  rationale: Trong mạch lập luận của Rô-ma, từ này chỉ luật pháp Môi-se; “luật pháp” là cách gọi quen thuộc, trang trọng và dễ hiểu trong tiếng Việt.
- source_word: φυλάσσῃ
  choice: tuân giữ
  rationale: Thể hiện việc vâng theo và thực hành các yêu cầu của luật pháp, phù hợp văn cảnh hơn nghĩa đen “canh giữ”.
- source_word: λογισθήσεται
  choice: sẽ được kể
  rationale: Giữ được hình ảnh quy kể/hạch toán trong λογίζομαι, đồng thời tự nhiên trong tiếng Việt.
- source_word: εἰς περιτομήν
  choice: như là cắt bì
  rationale: Trong cấu trúc này, εἰς nói đến địa vị hoặc kết quả được quy kể; “như là” chuyển đạt ý ấy rõ ràng.
- source_word: οὐχ
  choice: chẳng phải ... sao?
  rationale: Câu hỏi phủ định chờ đợi câu trả lời khẳng định; cấu trúc này giữ đúng lực tu từ trong tiếng Việt.
theological_decisions:
- issue: Quan hệ giữa việc tuân giữ luật pháp và địa vị cắt bì
  choice: Giữ nguyên câu điều kiện và câu hỏi tu từ, không giải thích đây là tình huống thực tế hay giả định.
  alternative: Diễn giải rằng người ngoại bang thực sự hoàn thành luật pháp, hoặc rằng đây chỉ là giả thuyết.
  rationale: Câu Hy Lạp không tự quyết định tranh luận thần học này; bản dịch cần bảo tồn độ mở và sức căng trong lập luận của Phao-lô.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “người không chịu cắt bì” để chỉ người ở vế đầu, nhưng giữ “tình trạng không cắt bì” ở vế sau nhằm phản ánh sự lặp lại của ἀκροβυστία và tương phản với περιτομή.
