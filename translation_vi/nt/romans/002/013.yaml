id: ROM.2.13
reference: Romans 2:13
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οὐ γὰρ οἱ ἀκροαταὶ ⸀νόμου δίκαιοι παρὰ ⸀τῷ θεῷ, ἀλλ’ οἱ ποιηταὶ ⸁νόμου δικαιωθήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/013.yaml
  text: For it is not the hearers of the law who are righteous before God[a], but the doers of the law who will be justified.
translation:
  language: vi
  text: Vì không phải những người nghe luật pháp là công chính trước mặt Đức Chúa Trời, nhưng những người làm theo luật pháp sẽ được xưng công chính.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “được tuyên là công chính”; cũng có thể là: “được minh chứng là công chính.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκροαταὶ
  choice: những người nghe
  rationale: Giữ rõ sự đối lập trực tiếp với “những người làm theo” và nhấn mạnh rằng chỉ nghe luật pháp thì chưa đủ.
- source_word: νόμου
  choice: luật pháp
  rationale: Dù danh từ không có mạo từ trong tiếng Hy Lạp, ngữ cảnh cho thấy đây là luật pháp đang được Phao-lô bàn đến; cách dịch này tự nhiên trong tiếng Việt và không cần thêm từ xác định.
- source_word: δίκαιοι
  choice: công chính
  rationale: Diễn đạt địa vị đúng đắn trước sự phán xét của Đức Chúa Trời, đồng thời giữ nhất quán với thuật ngữ thần học của thư Rô-ma.
- source_word: παρὰ τῷ θεῷ
  choice: trước mặt Đức Chúa Trời
  rationale: Truyền đạt tự nhiên ý nghĩa về địa vị của con người dưới sự đánh giá hoặc phán xét của Đức Chúa Trời.
- source_word: ποιηταὶ
  choice: những người làm theo
  rationale: Tái hiện sự tương phản với “những người nghe”; “làm theo” tự nhiên hơn “những người làm” và cho thấy ý tuân hành luật pháp.
- source_word: δικαιωθήσονται
  choice: sẽ được xưng công chính
  rationale: Giữ thể tương lai bị động và thuật ngữ quan trọng của Phao-lô, đồng thời tránh thu hẹp động từ thành một cách giải thích duy nhất.
theological_decisions:
- issue: Cách dịch δικαιωθήσονται sao cho giữ được thuật ngữ thần học của Phao-lô mà không diễn giải quá mức
  choice: sẽ được xưng công chính
  alternative: sẽ được tuyên là công chính; sẽ được minh chứng là công chính
  rationale: “Được xưng công chính” bảo toàn sắc thái pháp đình và mối liên hệ thuật ngữ trong thư Rô-ma. Các cách hiểu gần nghĩa được nêu ở chú thích để giữ tính minh bạch và không âm thầm giải quyết phạm vi nghĩa của động từ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cấu trúc “không phải… nhưng…” giữ sát phép đối lập của nguyên văn; “những người nghe” và “những người làm theo” tạo thế cân xứng tự nhiên trong tiếng Việt.
source_grounding:
  english_pob_role: consult_only
