  text: πέποιθάς τε σεαυτὸν ὁδηγὸν εἶναι τυφλῶν, φῶς τῶν ἐν σκότει,
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/019.yaml
  text: And you are convinced that you yourself are a guide to the blind, a light to those in darkness,
translation:
  language: vi
  text: và tin chắc rằng chính mình là người dẫn đường cho người mù, là ánh sáng cho những người ở trong bóng tối,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πέποιθάς
  choice: tin chắc
  rationale: Thể hoàn thành diễn tả một trạng thái tin tưởng đã xác lập; “tin chắc” tự nhiên trong tiếng Việt và giữ được sắc thái tự tin của lời chất vấn.
- source_word: τε
  choice: và
  rationale: Tiểu từ nối mệnh đề này với chuỗi ý ở trước; “và” truyền đạt quan hệ liên kết mà không diễn giải quá mức.
- source_word: σεαυτὸν
  choice: chính mình
  rationale: Giữ sắc thái nhấn mạnh của đại từ phản thân, đồng thời phù hợp tự nhiên với cấu trúc “tin chắc rằng”.
- source_word: ὁδηγὸν
  choice: người dẫn đường
  rationale: Diễn đạt rõ và tự nhiên hình ảnh một người hướng dẫn người khác.
- source_word: τυφλῶν
  choice: người mù
  rationale: Danh từ hóa tính từ số nhiều chỉ những người mù; cách dịch này gọn, rõ và tôn trọng nhân vị.
- source_word: φῶς
  choice: ánh sáng
  rationale: Giữ nguyên ẩn dụ về sự soi sáng và hướng dẫn; tiếng Việt không cần thêm mạo từ.
- source_word: τῶν ἐν σκότει
  choice: những người ở trong bóng tối
  rationale: Thể hiện rõ cụm từ chỉ người và giữ nguyên hình ảnh ẩn dụ “ở trong bóng tối”.
theological_decisions: []
