id: ROM.2.16
reference: Romans 2:16
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐν ⸂ἡμέρᾳ ὅτε⸃ ⸀κρίνει ὁ θεὸς τὰ κρυπτὰ τῶν ἀνθρώπων κατὰ τὸ εὐαγγέλιόν μου διὰ ⸂Χριστοῦ Ἰησοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/016.yaml
  text: on the day when God judges the secrets of people through Messiah Jesus[a], according to my gospel.
translation:
  language: vi
  text: vào ngày Đức Chúa Trời phán xét những điều kín giấu của con người qua Đấng Mê-si-a là Đức Giê-su[a], theo Tin Mừng của tôi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “qua Đấng Christ Giê-su.”'
    reason: Giữ cách chuyển tự và cách gọi truyền thống của Χριστοῦ Ἰησοῦ như một phương án dịch.
lexical_decisions:
- source_word: ἐν ἡμέρᾳ ὅτε
  choice: vào ngày
  rationale: Cách diễn đạt tự nhiên trong tiếng Việt, vẫn giữ rõ ý về một ngày phán xét xác định; mệnh đề theo sau cho thấy nghĩa “vào ngày mà/khi”.
- source_word: κρίνει
  choice: phán xét
  rationale: Thì hiện tại Hy Lạp nằm trong mệnh đề thời gian hướng về tương lai. “Phán xét” phù hợp ngữ cảnh xét xử của Đức Chúa Trời mà không cần thêm từ “sẽ” vốn không có trực tiếp trong bản nguồn.
- source_word: τὰ κρυπτὰ
  choice: những điều kín giấu
  rationale: Giữ số nhiều và ý nghĩa những gì bị che khuất, đồng thời tự nhiên hơn lối dịch quá sát như “các vật bí mật”.
- source_word: τῶν ἀνθρώπων
  choice: của con người
  rationale: ἄνθρωποι chỉ loài người nói chung, không riêng nam giới; “con người” là cách gọi bao quát và trang trọng trong tiếng Việt hiện đại.
- source_word: κατὰ τὸ εὐαγγέλιόν μου
  choice: theo Tin Mừng của tôi
  rationale: Giữ nguyên giới từ κατὰ và đại từ sở hữu của Phao-lô, không diễn giải thêm rằng đây là Tin Mừng ông rao giảng.
- source_word: διὰ Χριστοῦ Ἰησοῦ
  choice: qua Đấng Mê-si-a là Đức Giê-su
  rationale: διά với sở hữu cách diễn tả trung gian hoặc tác nhân nên dịch là “qua”. Χριστός được giữ với nghĩa tước hiệu “Đấng Mê-si-a”; từ “là” giúp cấu trúc đồng vị trở nên rõ và tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Χριστοῦ mang nghĩa tước hiệu hay dạng tên gọi quen dùng
  choice: Đấng Mê-si-a là Đức Giê-su
  alternative: Đấng Christ Giê-su
  rationale: Trong ngữ cảnh này, Χριστός vẫn có sức nặng của tước hiệu. Bản chính giữ “Đấng Mê-si-a”, còn cách gọi truyền thống “Đấng Christ” được nêu trong chú thích để không che khuất phương án dịch quen thuộc.
- issue: Vai trò của διὰ Χριστοῦ Ἰησοῦ trong sự phán xét
  choice: Đức Chúa Trời phán xét ... qua Đấng Mê-si-a là Đức Giê-su
  alternative: Đấng Mê-si-a là Đức Giê-su phán xét thay mặt Đức Chúa Trời
  rationale: Bản nguồn nêu Đức Chúa Trời là chủ thể của κρίνει và Đấng Mê-si-a Giê-su là trung gian hoặc tác nhân qua διά; bản dịch giữ nguyên quan hệ này mà không mở rộng thành một giải thích thần học.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại. “Đức Chúa Trời”, “phán xét” và “Tin Mừng” phù hợp ngữ vực Kinh Thánh phổ thông; câu giữ cấu trúc cô đọng của bản Hy Lạp mà vẫn đọc tự nhiên trong tiếng Việt.
