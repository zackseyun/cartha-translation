id: ROM.2.29
reference: Romans 2:29
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀλλ’ ὁ ἐν τῷ κρυπτῷ Ἰουδαῖος, καὶ περιτομὴ καρδίας ἐν πνεύματι οὐ γράμματι, οὗ ὁ ἔπαινος οὐκ ἐξ ἀνθρώπων ἀλλ’ ἐκ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/029.yaml
  text: But the Jew is one inwardly[a], and circumcision is of the heart—by the Spirit, not by the letter—whose praise is not from people but from God.
translation:
  language: vi
  text: Nhưng người ở bên trong mới là người Do Thái, và phép cắt bì là phép cắt bì trong lòng, trong tinh thần chứ không theo văn tự.[a] Người đó được khen ngợi không phải từ loài người, mà từ Đức Chúa Trời.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể hiểu: “trong Thánh Linh, chứ không theo văn tự.” Cụm tiếng Hy Lạp có thể chỉ Thánh Linh hoặc thực tại/tính chất thuộc linh bên trong.'
    reason: Bảo lưu sự mơ hồ của ἐν πνεύματι οὐ γράμματι, không quyết định dứt khoát giữa cách hiểu Thánh Linh và cách hiểu thuộc linh/nội tâm.
lexical_decisions:
- source_word: ἐν τῷ κρυπτῷ
  choice: ở bên trong
  rationale: Diễn đạt tự nhiên sự tương phản giữa thực tại kín giấu bên trong và dấu hiệu bề ngoài; không mang nghĩa đơn thuần là làm điều gì đó bí mật.
- source_word: Ἰουδαῖος
  choice: người Do Thái
  rationale: Ngữ cảnh nói về căn tính giao ước và tôn giáo, không chủ yếu chỉ địa vực Giu-đê.
- source_word: περιτομὴ καρδίας
  choice: phép cắt bì trong lòng
  rationale: Giữ nguyên ẩn dụ của nguyên văn và diễn đạt rõ rằng điều Phao-lô nói đến thuộc về con người bên trong.
- source_word: ἐν πνεύματι
  choice: bởi Thánh Linh
  rationale: Cách hiểu công cụ phù hợp với sự đối lập thường thấy trong Phao-lô giữa Thánh Linh và văn tự; viết hoa thể hiện cách hiểu có khả năng hơn, còn cách hiểu khác được giữ trong chú thích.
- source_word: οὐ γράμματι
  choice: chứ không bởi văn tự
  rationale: Giữ sát γράμμα và sự đối lập với πνεῦμα, đồng thời tránh diễn giải quá mức thành toàn bộ luật thành văn.
- source_word: οὗ ὁ ἔπαινος
  choice: Người ấy được khen ngợi
  rationale: Đổi cấu trúc sở hữu của tiếng Hy Lạp sang câu chủ động ý nghĩa tự nhiên trong tiếng Việt, với đại từ quy chiếu về người Do Thái ở bên trong.
- source_word: ἐξ ἀνθρώπων
  choice: bởi loài người
  rationale: Truyền đạt nguồn gốc con người nói chung, không giới hạn ở nam giới.
- source_word: ἐκ τοῦ θεοῦ
  choice: bởi Đức Chúa Trời
  rationale: Cách dịch trực tiếp, trang trọng và quen thuộc của cụm từ chỉ nguồn của sự khen ngợi.
theological_decisions:
- issue: πνεύματι chỉ Thánh Linh hay tinh thần/con người bên trong
  choice: bởi Thánh Linh
  alternative: trong tâm linh, tức trong thực tại thuộc linh bên trong
  rationale: Trong lối lập luận của Phao-lô, sự đối lập giữa πνεῦμα và γράμμα nhiều khả năng nói đến công việc của Thánh Linh; tuy nhiên, dạng ngữ pháp không loại trừ hoàn toàn nghĩa về tâm linh hay thực tại nội tâm, nên chú thích bảo lưu khả năng ấy.
- issue: Tính chất của căn tính Do Thái và phép cắt bì được mô tả
  choice: thêm “đích thực” để làm rõ vị ngữ hàm ẩn và sự tương phản trong mạch văn
  alternative: 'dịch sát hình thức: “nhưng người ở bên trong là người Do Thái, và phép cắt bì là phép cắt bì trong lòng”'
  rationale: Câu Hy Lạp lược bỏ vị ngữ theo thế đối xứng với câu 28; “đích thực” làm rõ ý tương phản mà không phủ nhận căn tính sắc tộc của người Do Thái hay biến câu thành một định nghĩa hệ phái.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “phép cắt bì” theo thuật ngữ Kinh Thánh phổ thông; “văn tự” giữ sự đối ứng thần học-ngữ nghĩa với “Thánh Linh”. Dấu chú thích [a] được đặt ngay sau mệnh đề có cách hiểu gây tranh luận.
