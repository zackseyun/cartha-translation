id: ROM.2.3
reference: Romans 2:3
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: λογίζῃ δὲ τοῦτο, ὦ ἄνθρωπε ὁ κρίνων τοὺς τὰ τοιαῦτα πράσσοντας καὶ ποιῶν αὐτά, ὅτι σὺ ἐκφεύξῃ τὸ κρίμα τοῦ θεοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/003.yaml
  text: But do you suppose this[a], O man—you who judge those who practice such things and yet do them yourself—that you will escape the judgment of God?
translation:
  language: vi
  text: Nhưng hỡi con người[a], bạn xét đoán những kẻ làm những điều như thế mà chính mình cũng làm những điều ấy, bạn lại tưởng rằng mình sẽ thoát khỏi sự phán xét của Đức Chúa Trời sao?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cụm từ Hy Lạp ở số ít, trực tiếp nói với một con người đại diện cho bất cứ ai xét đoán người khác trong khi cũng làm những điều tương tự.
    reason: cultural_note
lexical_decisions:
- source_word: λογίζῃ
  choice: lại cho rằng
  rationale: Diễn tả sự suy tính hay giả định trong lòng; đặt trong câu hỏi tu từ để chất vấn niềm tin sai lầm của người đang xét đoán kẻ khác.
- source_word: ἄνθρωπε
  choice: hỡi con người
  rationale: Giữ lối xưng hô trực tiếp ở số ít và sắc thái tranh biện của Phao-lô, đồng thời chỉ một con người đại diện chứ không nhất thiết nhấn mạnh giới tính nam.
- source_word: κρίνων
  choice: xét đoán
  rationale: Diễn đạt hành vi đánh giá người khác về mặt đạo đức; không dùng từ mạnh hơn là “kết án” vì phân từ Hy Lạp tự nó không nhất thiết mang nghĩa ấy.
- source_word: πράσσοντας
  choice: làm
  rationale: Cách nói tự nhiên trong tiếng Việt cho hành vi được thực hiện; ngữ cảnh đủ cho thấy đây là cách sống hay việc làm lặp lại mà không cần gượng ép phân biệt với ποιῶν.
- source_word: ποιῶν αὐτά
  choice: mà chính mình cũng làm
  rationale: “Chính mình” làm nổi bật sự tương phản giữa việc xét đoán người khác và việc bản thân cũng thực hiện những điều ấy.
- source_word: ἐκφεύξῃ
  choice: sẽ thoát khỏi
  rationale: Giữ ý trốn thoát hoặc tránh được một sự phán xét sắp đến và phù hợp với sức nặng của câu hỏi tu từ.
- source_word: κρίμα
  choice: sự phán xét
  rationale: Giữ nghĩa tư pháp rộng của hành động hay kết quả xét xử từ Đức Chúa Trời, không thu hẹp thành riêng “bản án” hoặc “phán quyết”.
theological_decisions:
- issue: Phạm vi của κρίμα τοῦ θεοῦ
  choice: sự phán xét của Đức Chúa Trời
  alternative: bản án của Đức Chúa Trời
  rationale: Bản văn không buộc phải giới hạn κρίμα vào bản án đã tuyên; “sự phán xét” giữ được phạm vi nghĩa rộng và sự căng thẳng của lời cảnh báo.
translation_notes:
  register: Văn phong hiện đại, trang trọng và trực tiếp. Cách lặp “người” giữ cấu trúc chất vấn đích danh của nguyên văn; “hỡi con người” duy trì sắc thái tranh biện mà không biến đối tượng thành riêng nam giới.
