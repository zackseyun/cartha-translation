revisions:
- from: Thật vậy, phép cắt bì có ích nếu bạn thực hành luật pháp[a]; nhưng nếu bạn là người vi phạm luật pháp[b], thì sự cắt bì của bạn đã trở thành không cắt bì[c].
  to: Vì phép cắt bì thật có ích nếu bạn thực hành luật pháp[a]; nhưng nếu bạn là người vi phạm luật pháp[b], thì sự cắt bì của bạn đã trở thành sự không cắt bì[c].
  rationale: Chỉnh “Thật vậy” thành “Vì ... thật” để phản ánh cả γὰρ lẫn sắc thái khẳng định của μὲν, đồng thời thêm “sự” trước “không cắt bì” để giữ phép đối lập danh từ trừu tượng của nguyên văn. Chú thích c được diễn đạt lại theo hướng giải thích chức năng của nghịch lý mà không thay thế câu chính bằng một cách dịch diễn giải.
