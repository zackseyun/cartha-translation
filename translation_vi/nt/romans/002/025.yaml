id: ROM.2.25
reference: Romans 2:25
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Περιτομὴ μὲν γὰρ ὠφελεῖ ἐὰν νόμον πράσσῃς· ἐὰν δὲ παραβάτης νόμου ᾖς, ἡ περιτομή σου ἀκροβυστία γέγονεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/025.yaml
  text: Circumcision indeed is beneficial if you practice the law[a]; but if you are a transgressor of the law[d][c][b], your circumcision has become uncircumcision.
translation:
  language: vi
  text: Vì phép cắt bì thật có ích nếu bạn thực hành luật pháp[a]; nhưng nếu bạn là người vi phạm luật pháp[b], thì sự cắt bì của bạn đã trở thành sự không cắt bì[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “nếu bạn tuân giữ luật pháp.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “kẻ phạm luật.”'
    reason: lexical_alternative
  - marker: c
    text: 'Nguyên văn: “sự cắt bì của bạn đã trở thành sự không cắt bì”; đây là lối nói nghịch lý: phép cắt bì không đem lại lợi ích giao ước cho người vi phạm luật pháp.'
    reason: cultural_note
lexical_decisions:
- source_word: Περιτομὴ
  choice: phép cắt bì
  rationale: Cách gọi tự nhiên và quen thuộc trong tiếng Việt, đồng thời giữ nguyên phạm trù giao ước và sự đối lập với ἀκροβυστία.
- source_word: μὲν γὰρ
  choice: Thật vậy
  rationale: Diễn đạt lời khẳng định mở đầu để chuẩn bị cho vế tương phản, không chất chồng các liên từ.
- source_word: ὠφελεῖ
  choice: có ích
  rationale: Diễn đạt lợi ích hoặc giá trị thực sự nhưng có điều kiện; ngắn gọn và tự nhiên trong tiếng Việt hiện đại.
- source_word: ἐὰν νόμον πράσσῃς
  choice: nếu bạn thực hành luật pháp
  rationale: Giữ sắc thái làm hoặc thực hành của πράσσω, thay vì diễn giải hẹp hơn là chỉ tuân giữ.
- source_word: παραβάτης νόμου
  choice: người vi phạm luật pháp
  rationale: Giữ rõ quan hệ với luật pháp và sắc thái pháp lý–giao ước, đồng thời dễ hiểu hơn lối nói Hán-Việt nặng nề.
- source_word: ἡ περιτομή σου
  choice: sự cắt bì của bạn
  rationale: Giữ đại từ sở hữu và lời nói trực tiếp của Phao-lô; danh hóa giúp câu tiếng Việt rõ nghĩa.
- source_word: ἀκροβυστία
  choice: không cắt bì
  rationale: Trong ngữ cảnh này, từ chỉ tình trạng đối lập về mặt giao ước với cắt bì, không đơn thuần chỉ bộ phận thân thể.
- source_word: γέγονεν
  choice: đã trở thành
  rationale: Giữ ý chuyển sang một tình trạng có kết quả còn hiệu lực của thì hoàn thành Hy Lạp.
theological_decisions:
- issue: Mệnh đề cuối nói về tình trạng thể lý hay địa vị giao ước
  choice: 'Giữ cách nói mạnh và cụ thể: “sự cắt bì của bạn đã trở thành không cắt bì.”'
  alternative: “sự cắt bì của bạn bị kể như không cắt bì” hoặc “không còn giá trị.”
  rationale: γέγονεν diễn tả một sự đảo ngược đầy tính tu từ, mạnh hơn ngôn ngữ chỉ sự đánh giá. Không nên âm thầm làm nhẹ câu bằng một lời giải thích về giá trị hay cách được kể.
translation_notes:
  register: Văn phong tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “bạn” để giữ lời xưng hô trực tiếp ở số ít; giữ “luật pháp” nhất quán cho νόμος và giữ nghịch lý mạnh trong mệnh đề cuối.
