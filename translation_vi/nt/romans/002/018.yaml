id: ROM.2.18
reference: Romans 2:18
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ γινώσκεις τὸ θέλημα καὶ δοκιμάζεις τὰ διαφέροντα κατηχούμενος ἐκ τοῦ νόμου,
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/018.yaml
  text: and know his will and approve the things that differ[a], being instructed from the law[b],
translation:
  language: vi
  text: và biết ý muốn của Ngài[a], biết phân định những điều tốt hơn[b], vì được Luật pháp dạy dỗ,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn là “ý muốn”, không có từ “của Ngài”; theo ngữ cảnh, đây là ý muốn của Đức Chúa Trời.
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “những điều khác biệt”; sát hơn: “thử nghiệm những điều khác biệt.”'
    reason: alternative_reading
lexical_decisions:
- source_word: γινώσκεις
  choice: biết
  rationale: Động từ hiện tại chỉ sự hiểu biết thực sự; “biết” là cách diễn đạt trực tiếp và tự nhiên trong tiếng Việt.
- source_word: τὸ θέλημα
  choice: ý muốn của Ngài
  rationale: Nguyên văn chỉ có “ý muốn”, không nêu đại từ sở hữu; tuy nhiên, mạch văn cho thấy Đức Chúa Trời là chủ thể được ngầm hiểu. Cách dịch này làm rõ ý quy chiếu trong tiếng Việt, còn chú thích giữ lại hình thức không tường minh của tiếng Hy Lạp.
- source_word: δοκιμάζεις
  choice: biết phân định
  rationale: Trong ngữ cảnh này, động từ nói đến việc xem xét để nhận ra điều đáng chọn hoặc ưu việt, chứ không chỉ thử nghiệm một cách trung lập.
- source_word: τὰ διαφέροντα
  choice: những điều tốt hơn
  rationale: Cụm từ có thể chỉ “những điều khác biệt” theo nghĩa sát chữ, hoặc theo lối dùng thành ngữ là những điều vượt trội, đáng coi trọng hơn. “Những điều tốt hơn” diễn đạt nghĩa khả dĩ nhất trong ngữ cảnh luân lý, đồng thời chú thích bảo lưu cách hiểu sát chữ.
- source_word: κατηχούμενος
  choice: vì được … dạy dỗ
  rationale: Phân từ bị động mô tả việc được chỉ dạy và có thể mang sắc thái nguyên nhân, giải thích cơ sở khiến người được nói đến biết và phân định.
- source_word: ἐκ τοῦ νόμου
  choice: được Luật pháp dạy dỗ
  rationale: Giới từ ἐκ nêu nguồn của sự dạy dỗ. Trong tiếng Việt, đưa “Luật pháp” vào cấu trúc bị động tạo câu tự nhiên mà vẫn giữ Luật pháp là nguồn giáo huấn.
theological_decisions:
- issue: Chủ thể của “ý muốn” không được nêu rõ trong tiếng Hy Lạp
  choice: Dịch “ý muốn của Ngài” vì Đức Chúa Trời là đối tượng quy chiếu được ngầm hiểu từ ngữ cảnh
  alternative: “ý muốn”
  rationale: Cách dịch chính tự nhiên và rõ nghĩa trong tiếng Việt, nhưng chú thích tránh biến điều ngầm hiểu thành một chi tiết tưởng như được nêu minh nhiên trong nguyên văn.
- issue: τὰ διαφέροντα có thể mang nghĩa so sánh hoặc nghĩa sát chữ
  choice: Dịch “những điều tốt hơn”
  alternative: “những điều khác biệt”
  rationale: Ngữ cảnh nghiêng về khả năng nhận biết điều ưu việt, nhưng cấu trúc Hy Lạp vẫn cho phép cách hiểu sát chữ; chú thích bảo lưu sự đa nghĩa này.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ liên từ mở đầu “và” cùng dấu phẩy cuối câu vì đây là một phần của câu dài trong Rô-ma 2:17–20. “Luật pháp” được viết hoa theo cách dùng quen thuộc khi chỉ Luật Môi-se, nhưng không thêm định danh ngoài nguyên văn.
