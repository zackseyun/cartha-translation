  text: οἴδαμεν δὲ ὅτι τὸ κρίμα τοῦ θεοῦ ἐστιν κατὰ ἀλήθειαν ἐπὶ τοὺς τὰ τοιαῦτα πράσσοντας.
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/002.yaml
  text: And we know that the judgment of God is according to truth against those who practice such things[a].
translation:
  language: vi
  text: Và chúng ta biết rằng sự phán xét của Đức Chúa Trời chống lại những người làm những việc như thế là phù hợp với sự thật[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “theo sự thật”; nghĩa là sự phán xét của Đức Chúa Trời phù hợp với điều là thật.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἴδαμεν
  choice: chúng ta biết
  rationale: Dạng hoàn thành οἶδα mang nghĩa hiện tại; “chúng ta biết” là cách diễn đạt trực tiếp và tự nhiên.
- source_word: δέ
  choice: Và
  rationale: Ở đây δέ tiếp nối mạch lập luận hơn là biểu thị sự tương phản mạnh; “Và” giữ được chức năng liên kết.
- source_word: κρίμα
  choice: sự phán xét
  rationale: κρίμα chỉ hành động hoặc phán quyết xét xử của Đức Chúa Trời; “sự phán xét” giữ nghĩa rộng, không thu hẹp thành riêng kết quả kết án.
- source_word: κατὰ ἀλήθειαν
  choice: đúng theo sự thật
  rationale: Cụm từ diễn tả sự phù hợp với chân lý hay thực tại. “Đúng theo sự thật” vừa tự nhiên trong tiếng Việt vừa giữ rõ yếu tố ἀλήθεια.
- source_word: ἐπὶ
  choice: đối với
  rationale: Trong cấu trúc nói về sự phán xét hướng đến con người, “đối với” là cách diễn đạt tự nhiên và không cường điệu sắc thái bất lợi hơn mức văn bản đòi hỏi.
- source_word: τὰ τοιαῦτα
  choice: những việc như thế
  rationale: Cách dịch tự nhiên cho cụm trung tính số nhiều, quy chiếu về những hành vi vừa được nêu trong ngữ cảnh.
- source_word: πράσσοντας
  choice: những người làm
  rationale: Phân từ hiện tại mô tả những người thực hiện các hành vi ấy; trong câu này “những người làm” tự nhiên, còn ngữ cảnh vẫn cho phép hiểu là hành vi đang diễn ra hoặc có tính đặc trưng.
theological_decisions:
- issue: Nên diễn đạt κατὰ ἀλήθειαν theo hướng giải nghĩa là “công minh/chính xác” hay giữ rõ mối liên hệ với “sự thật”.
  choice: đúng theo sự thật
  alternative: công minh; phù hợp với sự thật
  rationale: Cách chọn này giữ nguyên nền tảng của sự phán xét thần thượng nơi sự thật hoặc thực tại, thay vì rút gọn thành một phẩm chất chung như “công minh”.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Đức Chúa Trời” theo lối gọi phổ biến trong bản dịch Kinh Thánh tiếng Việt; cấu trúc danh từ “sự phán xét” được giữ để phản ánh κρίμα, còn “đúng theo sự thật” bảo tồn nét thần học và từ vựng của nguyên văn.
