  rationale: Thay “khuôn mẫu” bằng “hình thức” để phản ánh trực tiếp hơn phạm vi nghĩa của μόρφωσις và tránh gợi ý không cần thiết về một chuẩn mực để bắt chước. Viết hoa “Luật pháp” để phản ánh quy chiếu đến Torah trong ngữ cảnh. Các phần còn lại giữ nguyên vì trung thành với nguyên ngữ và tự nhiên trong tiếng Việt hiện đại.
