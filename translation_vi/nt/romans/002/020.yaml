  text: παιδευτὴν ἀφρόνων, διδάσκαλον νηπίων, ἔχοντα τὴν μόρφωσιν τῆς γνώσεως καὶ τῆς ἀληθείας ἐν τῷ νόμῳ—
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/020.yaml
  text: an instructor of the foolish[a], a teacher of infants, having in the law the embodiment of knowledge and truth—
translation:
  language: vi
  text: là người dạy dỗ kẻ dại, là thầy của trẻ thơ, có trong Luật pháp hình thức[a] của tri thức và chân lý—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “sự thể hiện cụ thể của tri thức và chân lý.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: παιδευτὴν
  choice: người dạy dỗ
  rationale: Diễn đạt vai trò huấn luyện và uốn nắn mà không nhấn quá mức sắc thái trừng phạt; phù hợp với chuỗi lời tự nhận về việc chỉ dẫn người khác.
- source_word: ἀφρόνων
  choice: kẻ dại
  rationale: Giữ sắc thái chê trách của từ Hy Lạp, đồng thời tự nhiên và trang trọng trong tiếng Việt.
- source_word: διδάσκαλον
  choice: thầy
  rationale: Cách gọi tự nhiên cho người giảng dạy, tránh lặp nặng nề với “người dạy dỗ” ở vế trước.
- source_word: νηπίων
  choice: trẻ thơ
  rationale: Giữ hình ảnh chỉ trẻ rất nhỏ và không tự ý quyết định đây chỉ là nghĩa bóng về người non nớt.
- source_word: ἔχοντα
  choice: có
  rationale: Phản ánh trực tiếp phân từ ἔχοντα và nối với chuỗi mô tả ở các câu trước.
- source_word: μόρφωσιν
  choice: khuôn mẫu
  rationale: Từ này có thể chỉ hình thức, khuôn mẫu hoặc sự thể hiện cụ thể. “Khuôn mẫu” giữ được độ mở của nguyên văn hơn một cách dịch diễn giải như “hiện thân”.
- source_word: γνώσεως
  choice: tri thức
  rationale: “Tri thức” tự nhiên trong cặp “tri thức và chân lý” và chỉ nội dung hiểu biết được tìm thấy trong luật pháp.
- source_word: ἀληθείας
  choice: chân lý
  rationale: Giữ ý niệm về điều chân thật trong lối diễn đạt trang trọng, quen thuộc của văn bản tôn giáo.
- source_word: ἐν τῷ νόμῳ
  choice: trong luật pháp
  rationale: Giữ quan hệ giới từ và không thêm cách giải thích vượt quá nguyên văn; ngữ cảnh cho thấy đây là luật pháp Do Thái.
theological_decisions:
- issue: Ý nghĩa của μόρφωσις và quan hệ với luật pháp
  choice: khuôn mẫu của tri thức và chân lý
  alternative: sự thể hiện cụ thể/hiện thân của tri thức và chân lý
  rationale: Nguyên ngữ có thể nhấn mạnh hình thức, sự trình bày, hoặc biểu hiện cụ thể. Bản chính giữ “khuôn mẫu” để không khẳng định quá mức rằng luật pháp là “hiện thân,” còn chú thích nêu khả năng mạnh hơn.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Giữ cấu trúc song song và dấu gạch ngang cuối câu vì câu Hy Lạp tiếp nối mạch cú pháp của ngữ cảnh. Marker [a] được đặt ngay sau từ có phương án dịch khác.
