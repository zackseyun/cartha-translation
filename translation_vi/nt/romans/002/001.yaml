id: ROM.2.1
reference: Romans 2:1
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Διὸ ἀναπολόγητος εἶ, ὦ ἄνθρωπε πᾶς ὁ κρίνων· ἐν ᾧ γὰρ κρίνεις τὸν ἕτερον, σεαυτὸν κατακρίνεις, τὰ γὰρ αὐτὰ πράσσεις ὁ κρίνων·
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/001.yaml
  text: Therefore you are without excuse[a], O man, every one who judges. For in passing judgment on another, you condemn yourself, because you who judge practice the same things.
translation:
  language: vi
  text: Vì thế, hỡi người, bất cứ ai xét đoán, bạn không thể bào chữa cho mình. Vì khi xét đoán người khác, bạn tự kết án chính mình, bởi bạn là người xét đoán mà cũng làm những điều ấy.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διὸ
  choice: Vì thế
  rationale: Diễn đạt tự nhiên quan hệ suy luận từ lập luận ngay trước đó.
- source_word: ἀναπολόγητος
  choice: không thể bào chữa cho mình
  rationale: 'Giữ sắc thái pháp lý: người bị chất vấn không có lời biện hộ chính đáng; cách nói này rõ ràng hơn “không thể chối cãi” trong ngữ cảnh.'
- source_word: ὦ ἄνθρωπε
  choice: hỡi người[a]
  rationale: Giữ lời gọi trực tiếp ở số ít và giọng quở trách trang trọng, đồng thời “người” truyền đạt phạm vi đại diện chung của ἄνθρωπος mà không giới hạn ở nam giới.
- source_word: πᾶς ὁ κρίνων
  choice: bạn—bất cứ ai xét đoán—
  rationale: Giữ cả lời nói trực tiếp với người nghe và sức khái quát của πᾶς; dấu gạch ngang thể hiện cụm đồng vị trong tiếng Hy Lạp.
- source_word: ἐν ᾧ κρίνεις τὸν ἕτερον
  choice: khi xét đoán người khác
  rationale: Cách diễn đạt tự nhiên trong tiếng Việt, giữ trọng tâm rằng ngay trong hành vi xét đoán người khác, người ấy tự kết án mình. Sắc thái phương tiện của ἐν ᾧ vẫn được hàm chứa trong mạch câu nhưng không bị diễn giải quá mức.
- source_word: κατακρίνεις
  choice: tự kết án chính mình
  rationale: “Kết án” mạnh hơn “xét đoán” và bảo tồn sắc thái tư pháp của κατακρίνω; “tự” và “chính mình” nhấn mạnh đối tượng phản hồi là bản thân.
- source_word: τὰ γὰρ αὐτὰ πράσσεις
  choice: cũng làm chính những điều ấy
  rationale: Giữ sự đồng nhất được nhấn mạnh bởi αὐτά và hành vi đang diễn ra của πράσσεις; “cũng” làm rõ nghịch lý giữa xét đoán và thực hành.
- source_word: ὁ κρίνων
  choice: bạn là người xét đoán
  rationale: Bảo tồn phân từ định danh người được trực tiếp quở trách, đồng thời tạo câu tiếng Việt trôi chảy.
theological_decisions:
- issue: Lời gọi giống đực số ít nhưng có hiệu lực đại diện trong lời quở trách của Phao-lô
  choice: Dùng “hỡi người” trong chính văn và giải thích phạm vi đại diện trong chú thích.
  alternative: “hỡi người đàn ông” hoặc “hỡi con người”
  rationale: ἄνθρωπε ở đây là số ít về ngữ pháp nhưng chỉ bất cứ người nào xét đoán. “Người đàn ông” thu hẹp sai phạm vi, còn “con người” trong lời gọi trực tiếp kém tự nhiên hơn trong tiếng Việt hiện đại.
- issue: Quan hệ giữa việc xét đoán và tự kết án trong ἐν ᾧ
  choice: Dịch “khi xét đoán” để giữ hành vi xét đoán là hoàn cảnh trực tiếp của việc tự kết án.
  alternative: “dựa vào điều bạn dùng để xét đoán”
  rationale: Cấu trúc Hy Lạp có thể gợi cả sắc thái thời gian và phương tiện. Bản dịch chính không ấn định một tiêu chuẩn xét xử riêng biệt mà nguyên văn không nêu rõ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và trực tiếp. “Hỡi” giữ lực tu từ của lời gọi ὦ mà vẫn quen thuộc trong văn chương tôn giáo; đại từ “bạn” tránh sắc thái miệt thị hoặc quá cổ của “ngươi”. Dấu gạch ngang giúp người đọc nhận ra “bất cứ ai xét đoán” là cụm đồng vị xác định người đang được nói với.
