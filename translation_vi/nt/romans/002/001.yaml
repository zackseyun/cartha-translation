  naturalness: “Hỡi người, bất cứ ai xét đoán” tự nhiên và trang trọng hơn, không cần gạch ngang. Giữ đại từ “bạn” là cách hiện đại, trực tiếp và không mang sắc thái miệt thị.
  terminology: “Không thể bào chữa cho mình” giữ được sắc thái pháp đình của ἀναπολόγητος; “xét đoán” và “kết án” phân biệt hợp lý hai động từ Hy Lạp; “làm những điều ấy” truyền đạt τὰ αὐτὰ πράσσεις một cách tự nhiên.
