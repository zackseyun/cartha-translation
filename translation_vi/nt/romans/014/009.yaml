id: ROM.14.9
reference: Romans 14:9
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εἰς τοῦτο γὰρ ⸀Χριστὸς ⸀ἀπέθανεν καὶ ἔζησεν ἵνα καὶ νεκρῶν καὶ ζώντων κυριεύσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/009.yaml
  text: For to this end Messiah died and lived again[a], so that he might rule over both the dead and the living.
translation:
  language: vi
  text: Vì chính nhằm mục đích này mà Đấng Mê-si đã chết và sống lại[a], để Ngài cai trị cả người chết lẫn người sống.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “đã sống.” Nguyên văn Hy Lạp nói “đã chết và đã sống”; trong văn cảnh này, sự sống sau cái chết được hàm ý.
    reason: Bảo lưu nghĩa sát mặt chữ của ἔζησεν và cho thấy “sống lại” là cách diễn đạt hàm ý phục sinh từ văn cảnh.
lexical_decisions:
- source_word: εἰς τοῦτο
  choice: chính là để
  rationale: Diễn đạt tự nhiên mục đích hay đích hướng tới; đặt cùng mệnh đề ἵνα để tránh lối nói tiếng Việt nặng nề mà vẫn giữ lực mục đích.
- source_word: γὰρ
  choice: vì
  rationale: Giữ chức năng giải thích của γάρ và nối câu này với lập luận ngay trước đó.
- source_word: Χριστὸς
  choice: Đấng Mê-si
  rationale: Diễn đạt Χριστός như tước hiệu chỉ Đấng được xức dầu, thay vì xem đây đơn thuần là một tên riêng.
- source_word: ἀπέθανεν
  choice: đã chết
  rationale: Phản ánh trực tiếp động từ aorist chỉ biến cố đã xảy ra.
- source_word: ἔζησεν
  choice: sống lại
  rationale: Cặp từ “đã chết và đã sống” trong văn cảnh nói đến sự sống sau cái chết. “Sống lại” truyền đạt hàm ý ấy tự nhiên trong tiếng Việt; chú thích bảo lưu cách dịch sát mặt chữ “đã sống.”
- source_word: ἵνα
  choice: để
  rationale: Đánh dấu mệnh đề mục đích một cách gọn và tự nhiên.
- source_word: νεκρῶν
  choice: người chết
  rationale: Danh từ hóa tự nhiên, giữ thế đối xứng với “người sống.”
- source_word: ζώντων
  choice: người sống
  rationale: Diễn đạt phân từ được dùng như danh từ và giữ sự tương phản với “người chết.”
- source_word: κυριεύσῃ
  choice: cai trị
  rationale: Giữ nghĩa động từ là thực thi quyền thống trị trên ai đó, không chuyển nó thành một danh hiệu rõ hơn mức hình thức Hy Lạp đòi hỏi.
theological_decisions:
- issue: Cách dịch ἔζησεν liên quan đến sự phục sinh
  choice: sống lại, kèm chú thích “đã sống”
  alternative: đã sống; trỗi dậy để sống
  rationale: Văn cảnh mạnh mẽ hàm ý sự sống sau cái chết, nhưng bản thân động từ có nghĩa cơ bản là “sống.” Bản dịch chính truyền đạt ý trong văn cảnh, còn chú thích bảo lưu hình thức và độ căng của nguyên văn.
- issue: Sắc thái quyền làm Chúa trong κυριεύσῃ
  choice: cai trị
  alternative: làm Chúa trên; làm chủ
  rationale: “Cai trị” phản ánh trực tiếp hành động thống trị của động từ và tránh biến động từ thành tước hiệu, trong khi vẫn giữ nguyên khẳng định về quyền của Đấng Mê-si trên cả người chết lẫn người sống.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Cấu trúc “chính là để” gom εἰς τοῦτο và ἵνα thành một cách nói tự nhiên, vẫn làm nổi bật mục đích. Dùng “cả… lẫn…” để tái hiện cặp đối xứng người chết/người sống.
