revisions:
- from: 'Vì Đấng Mê-si đã chết và sống lại[a] chính là để cai trị cả người chết lẫn người sống.


    [a] Hay “đã sống.” Nguyên văn Hy Lạp nói “đã chết và đã sống”; trong văn cảnh này, sự sống sau cái chết được hàm ý.'
  to: Vì chính nhằm mục đích này mà Đấng Mê-si đã chết và sống lại[a], để Ngài cai trị cả người chết lẫn người sống.
  rationale: Sửa cấu trúc mở đầu để biểu đạt minh bạch εἰς τοῦτο γάρ (“vì chính nhằm mục đích này”) đồng thời vẫn giữ mệnh đề mục đích do ἵνα mở đầu (“để”). Không thay đổi nội dung thần học hay sắc thái của động từ κυριεύσῃ; chú thích hiện hữu được giữ nguyên vì cân bằng tốt giữa nghĩa mặt chữ và hàm ý ngữ cảnh của ἔζησεν.
