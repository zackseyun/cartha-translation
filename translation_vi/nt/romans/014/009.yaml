  source_fidelity: 'Bản dịch truyền đạt đúng các ý chính: Χριστός là tước hiệu, ἀπέθανεν/ἔζησεν nói đến đã chết và sự sống sau đó, còn κυριεύσῃ là sự cai trị trên cả người chết lẫn người sống. Tuy nhiên, cụm “chính là để” gộp εἰς τοῦτο với ἵνα, khiến yếu tố chỉ đích hướng “vì/nhằm mục đích này” của εἰς τοῦτο không còn được thể hiện riêng rõ ràng.'
