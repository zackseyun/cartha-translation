review_pass:
  verdict: revise
  source_fidelity: 'Cần sửa “có quyền”: δυνατεῖ diễn tả khả năng/năng lực, không chủ yếu là thẩm quyền. “Có thể” phản ánh sát hơn lý do cho việc người ấy được làm cho đứng vững. οἰκέτης chỉ người thuộc gia hộ; trong bối cảnh này, “người nô lệ trong nhà” bảo tồn rõ hơn quan hệ lệ thuộc xã hội so với “đầy tớ trong nhà”.'
  naturalness: Bản sửa dùng tiếng Việt hiện đại, vẫn giữ giọng chất vấn trực tiếp. “Đứng hay ngã trước chủ của mình” tự nhiên hơn cấu trúc có “là”, đồng thời duy trì hình ảnh nguyên văn.
  terminology: Dùng “chủ” trong hình ảnh gia hộ và “Chúa” ở mệnh đề cuối là tự nhiên trong tiếng Việt, nhưng che khuất sự lặp lại của κύριος. Chú thích nêu cách đọc thay thế “chủ của người ấy” để không xóa mơ hồ diễn giải.
  issues:
  - severity: medium
    issue: “Chúa có quyền” dịch δυνατεῖ không chính xác trọng tâm.
    rationale: δυνατεῖ có nghĩa là “có thể/có khả năng,” và mệnh đề giải thích năng lực của Chúa để làm người ấy đứng vững, không phải quyền hạn của Chúa.
  - severity: low
    issue: “Đầy tớ trong nhà” làm yếu quan hệ nô lệ/gia hộ của οἰκέτης.
    rationale: οἰκέτης là người thuộc gia hộ, thường là nô lệ hoặc tôi tớ. Trong phép loại suy này, “người nô lệ trong nhà” giữ rõ quan hệ lệ thuộc mà không thêm chi tiết ngoài nguyên văn.
  - severity: low
    issue: Mơ hồ về quy chiếu của ὁ κύριος ở mệnh đề cuối chưa được ghi chú.
    rationale: “Chúa” là cách đọc có xác suất cao trong mạch văn Phao-lô, nhưng “chủ của người ấy” vẫn là một cách hiểu có thể có trong phép loại suy; nên đánh dấu chú thích.
