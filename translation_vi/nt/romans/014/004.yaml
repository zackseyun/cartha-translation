id: ROM.14.4
reference: Romans 14:4
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: σὺ τίς εἶ ὁ κρίνων ἀλλότριον οἰκέτην; τῷ ἰδίῳ κυρίῳ στήκει ἢ πίπτει· σταθήσεται δέ, ⸂δυνατεῖ γὰρ⸃ ὁ ⸀κύριος στῆσαι αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/004.yaml
  text: Who are you to judge another's household servant? He stands or falls before his own lord[a], and he will be made to stand[c][b], for the Lord is able to make him stand.
translation:
  language: vi
  text: Bạn là ai mà xét đoán người nô lệ trong nhà của người khác? Người ấy đứng hay ngã trước chủ của mình; nhưng người ấy sẽ được làm cho đứng vững, vì Chúa[a] có thể làm cho người ấy đứng vững.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hoặc hiểu là “chủ của người ấy,” tiếp tục hình ảnh chủ–nô lệ trong câu. Tuy nhiên, trong mạch văn này, “Chúa” theo nghĩa thần học có khả năng cao hơn.
    reason: alternative_reading
lexical_decisions:
- source_word: σὺ τίς εἶ ὁ κρίνων
  choice: Bạn là ai mà xét đoán
  rationale: Giữ sắc thái chất vấn và quở trách của đại từ nhấn mạnh σὺ cùng cấu trúc τίς εἶ; cách nói này tự nhiên trong tiếng Việt hiện đại.
- source_word: ἀλλότριον οἰκέτην
  choice: đầy tớ trong nhà của người khác
  rationale: οἰκέτης chỉ người phục vụ thuộc một gia đình, trong bối cảnh cổ đại có thể là đầy tớ hoặc nô lệ. Cách dịch này giữ nét thuộc về gia nhân mà không quyết định quá mức địa vị pháp lý vốn không được câu này xác định riêng.
- source_word: τῷ ἰδίῳ κυρίῳ
  choice: trước chủ mình
  rationale: Dịch cách dữ cách theo quan hệ chịu trách nhiệm trước người chủ; “chủ” phù hợp với hình ảnh gia nhân, đồng thời vẫn để κύριος ở vế cuối chuyển sang “Chúa” theo nghĩa thần học.
- source_word: στήκει ἢ πίπτει
  choice: đứng hay ngã
  rationale: Giữ nguyên phép đối lập và hình ảnh của hai động từ Hy Lạp, thay vì diễn giải thành được chấp nhận hay bị kết án.
- source_word: σταθήσεται
  choice: sẽ được làm cho đứng vững
  rationale: Thể tương lai bị động được thể hiện rõ, giữ hàm ý tác nhân là Chúa; “đứng vững” tự nhiên hơn trong tiếng Việt và diễn đạt sắc thái ổn định của hình ảnh.
- source_word: δυνατεῖ γὰρ ὁ κύριος
  choice: vì Chúa có quyền
  rationale: γάρ nêu lý do; δυνατέω nói đến khả năng hoặc quyền năng. “Có quyền” ở đây diễn đạt năng lực hữu hiệu của Chúa mà không thêm ý ngoài nguyên văn.
- source_word: στῆσαι αὐτόν
  choice: làm cho người ấy đứng vững
  rationale: Giữ cấu trúc gây khiến và liên kết từ vựng với σταθήσεται, đồng thời tránh đại từ có thể gây cảm giác chỉ định giới tính không cần thiết trong tiếng Việt.
theological_decisions:
- issue: Đối tượng được gọi là ὁ κύριος trong mệnh đề cuối
  choice: “Chúa”, theo nghĩa thần học
  alternative: “chủ của người ấy”, tiếp tục hoàn toàn hình ảnh chủ–đầy tớ
  rationale: Cách dùng có mạo từ, mạch lập luận của Phao-lô và việc quyền năng của κύριος bảo đảm người tin đứng vững khiến nghĩa thần học có khả năng cao hơn. Tuy nhiên, sự lặp lại κύριος vẫn duy trì tiếng vang của hình ảnh người chủ ở mệnh đề trước.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại, dùng “bạn” cho lời chất vấn trực tiếp và “người ấy” để diễn đạt đại từ giống đực Hy Lạp một cách tự nhiên, không nhấn mạnh giới tính. Giữ sự lặp lại của hình ảnh “đứng/đứng vững” và không diễn giải nó thành một phán quyết thần học cụ thể.
