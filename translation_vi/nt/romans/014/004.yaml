revisions:
- from: Bạn là ai mà xét đoán đầy tớ trong nhà của người khác? Người ấy đứng hay ngã là trước chủ mình; nhưng người ấy sẽ được làm cho đứng vững, vì Chúa có quyền làm cho người ấy đứng vững.
  to: Bạn là ai mà xét đoán người nô lệ trong nhà của người khác? Người ấy đứng hay ngã trước chủ của mình; nhưng người ấy sẽ được làm cho đứng vững, vì Chúa[a] có thể làm cho người ấy đứng vững.
  rationale: Sửa δυνατεῖ thành “có thể” để phản ánh năng lực được nêu trong nguyên văn; làm rõ οἰκέτης là người thuộc gia hộ trong quan hệ nô lệ; và thêm chú thích cho quy chiếu có thể tranh luận của ὁ κύριος. Giữ phép đối lập “đứng hay ngã” và sự lặp lại “làm cho ... đứng vững.”
