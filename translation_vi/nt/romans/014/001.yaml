  text: Τὸν δὲ ἀσθενοῦντα τῇ πίστει προσλαμβάνεσθε, μὴ εἰς διακρίσεις διαλογισμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/001.yaml
  text: Receive the one who is weak in faith[b][a], not for disputes over opinions.
translation:
  language: vi
  text: Hãy tiếp nhận[a] người yếu đuối trong đức tin, không phải để tranh cãi về các ý kiến[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: «hãy đón nhận». Động từ Hy Lạp có thể nói đến việc nhận một người vào sự giao hảo hoặc cộng đồng của mình.'
    reason: lexical_alternative
  - marker: b
    text: 'Cụm cuối cũng có thể dịch: «không phải để phân xét những ý kiến còn tranh luận» hoặc «không phải để cãi vã về các suy luận».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀσθενοῦντα
  choice: người yếu
  rationale: Phân từ hiện tại có mạo từ được dùng như danh từ; cách dịch này giữ được ý người đang ở tình trạng yếu mà không tự ý thêm «lương tâm».
- source_word: τῇ πίστει
  choice: đức tin
  rationale: Dative chỉ phương diện mà người ấy yếu. «Đức tin» là cách diễn đạt tự nhiên trong tiếng Việt và không biến cụm này thành một hệ thống giáo lý khách quan.
- source_word: προσλαμβάνεσθε
  choice: hãy tiếp nhận
  rationale: Động từ mệnh lệnh trung cách diễn tả việc nhận một người đến với mình, vào sự giao hảo hay cộng đồng; «tiếp nhận» giữ được độ rộng ấy.
- source_word: μὴ εἰς
  choice: nhưng đừng để
  rationale: Cụm này nêu mục đích hoặc kết quả cần tránh. Cách diễn đạt tiếng Việt này vừa tự nhiên vừa giữ lệnh cấm dùng việc tiếp nhận làm dịp tranh cãi.
- source_word: διακρίσεις
  choice: tranh cãi
  rationale: Trong văn cảnh, từ này chỉ sự phân xét gây bất đồng hoặc tranh luận, chứ không chỉ là phân biệt trung tính.
- source_word: διαλογισμῶν
  choice: những điều người ấy suy nghĩ
  rationale: Từ này có thể chỉ những suy luận, ý nghĩ hay quan điểm. Cách dịch không thu hẹp nghĩa thành «ý kiến» và giữ được sắc thái nội tâm của danh từ.
- source_word: δὲ
  choice: nhưng
  rationale: δέ có thể đánh dấu chuyển ý hoặc tương phản nhẹ. Ở đây «nhưng» nối tự nhiên mệnh lệnh tiếp nhận với giới hạn tiêu cực theo sau, không thêm trạng từ thời gian.
theological_decisions:
- issue: Cách hiểu πίστις
  choice: đức tin
  alternative: lòng tin; sự trung tín
  rationale: Văn cảnh nói về sự yếu đuối liên quan đến niềm tin hoặc xác tín trong các thực hành đang bị tranh luận. «Đức tin» giữ thuật ngữ thần học quen thuộc mà không giải nghĩa quá mức thành lương tâm hay xác tín.
- issue: Quan hệ của διακρίσεις διαλογισμῶν
  choice: tranh cãi về những điều người ấy suy nghĩ
  alternative: phân xét các ý kiến còn tranh luận; cãi vã về các suy luận
  rationale: Cụm Hy Lạp cô đọng và có thể được hiểu theo nhiều quan hệ ngữ nghĩa. Bản chính chọn cách diễn đạt dễ hiểu, còn chú thích bảo lưu các khả năng «phân xét» và «cãi vã».
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Dùng «hãy» để thể hiện mệnh lệnh số nhiều hướng đến cộng đồng; tránh thêm «bây giờ» vì δέ không phải là một từ chỉ thời gian. Các chú thích được đặt ngay sau những cụm liên quan.
