id: ROM.14.10
reference: Romans 14:10
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Σὺ δὲ τί κρίνεις τὸν ἀδελφόν σου; ἢ καὶ σὺ τί ἐξουθενεῖς τὸν ἀδελφόν σου; πάντες γὰρ παραστησόμεθα τῷ βήματι τοῦ ⸀θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/010.yaml
  text: But you[a], why do you judge your brother? Or you also, why do you despise your brother? For we will all stand before the judgment seat of God[b],
translation:
  language: vi
  text: Nhưng còn bạn, tại sao bạn xét đoán người anh em của mình?[a] Hay bạn nữa, tại sao bạn khinh thường người anh em của mình? Vì tất cả chúng ta sẽ đứng trước tòa phán xét của Đức Chúa Trời.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “người anh/chị/em của bạn”; tiếng Hy Lạp: “người anh em của bạn.”'
    reason: lexical_alternative
  - marker: b
    text: 'Một số thủ bản chép: “tòa phán xét của Đấng Christ.”'
    reason: textual_variant
lexical_decisions:
- source_word: Σὺ δὲ
  choice: Nhưng còn bạn
  rationale: Giữ sắc thái tương phản của δέ và sự nhấn mạnh do đại từ σύ được đặt đầu câu, đồng thời diễn đạt tự nhiên trong tiếng Việt hiện đại.
- source_word: τί κρίνεις
  choice: sao bạn xét đoán
  rationale: Trong câu hỏi tu từ này, τί mang nghĩa “tại sao/sao.” “Xét đoán” giữ được nghĩa của κρίνω mà không thu hẹp thành “kết án.”
- source_word: τὸν ἀδελφόν σου
  choice: anh em mình
  rationale: ἀδελφός ở số ít giống đực, nhưng trong ngữ cảnh cộng đồng đức tin có thể chỉ một người cùng đức tin, không nhất thiết là nam giới. “Anh em mình” là cách nói quen thuộc, bao quát trong tiếng Việt và tránh cách diễn đạt nặng nề.
- source_word: ἢ καὶ σὺ
  choice: Hay chính bạn
  rationale: “Chính bạn” thể hiện sự nhấn mạnh của σύ và lực bổ sung của καί, đồng thời tạo thế đối xứng với vế trước.
- source_word: τί ἐξουθενεῖς
  choice: sao bạn khinh thường
  rationale: '“Khinh thường” diễn đạt rõ ἐξουθενέω: coi người khác là không đáng kể hoặc không có giá trị.'
- source_word: πάντες γὰρ
  choice: Vì tất cả chúng ta
  rationale: “Vì” giữ chức năng giải thích-nguyên nhân của γάρ; “tất cả chúng ta” biểu đạt rõ rằng πάντες bao gồm cả Phao-lô và người nghe.
- source_word: παραστησόμεθα
  choice: sẽ đứng trước
  rationale: Giữ hình ảnh một người phải ra đứng trước thẩm quyền xét xử, phù hợp với ngữ cảnh pháp đình.
- source_word: τῷ βήματι
  choice: tòa phán xét
  rationale: βῆμα ở đây là ghế hoặc tòa của thẩm phán. “Tòa phán xét” rõ nghĩa, tự nhiên và bảo tồn sắc thái pháp lý.
- source_word: τοῦ θεοῦ
  choice: của Đức Chúa Trời
  rationale: Dịch trực tiếp sở hữu cách theo bản SBLGNT; danh xưng này phù hợp với văn phong Kinh Thánh Tin Lành Việt ngữ mà không thêm diễn giải.
theological_decisions:
- issue: Đấng có tòa phán xét mà mọi người sẽ phải đứng trước
  choice: Đức Chúa Trời
  alternative: Đấng Christ
  rationale: Bản SBLGNT được cung cấp đọc τοῦ θεοῦ, nên bản chính dịch “của Đức Chúa Trời.” Dị bản “của Đấng Christ” được ghi chú thay vì đưa vào bản chính hoặc dung hòa với 2 Cô-rinh-tô 5:10.
translation_notes:
  register: Văn phong hiện đại, trang trọng nhưng trực tiếp. Dùng “bạn” để giữ lời chất vấn ở ngôi thứ hai số ít; “anh em mình” diễn đạt quan hệ trong cộng đồng đức tin một cách tự nhiên và có tính bao quát trong tiếng Việt. Dấu câu kết thúc câu đầy đủ thay cho dấu phẩy của đoạn trích.
