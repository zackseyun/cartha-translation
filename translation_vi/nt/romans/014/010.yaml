revisions:
- from: Nhưng còn bạn, sao bạn xét đoán anh em mình? Hay chính bạn, sao bạn khinh thường anh em mình? Vì tất cả chúng ta sẽ đứng trước tòa phán xét của Đức Chúa Trời.[a]
  to: Nhưng còn bạn, tại sao bạn xét đoán người anh em của mình?[a] Hay bạn nữa, tại sao bạn khinh thường người anh em của mình? Vì tất cả chúng ta sẽ đứng trước tòa phán xét của Đức Chúa Trời.[b]
  rationale: 'Bản sửa giữ sát văn bản SBLGNT, nhất là số ít của ἀδελφόν và lực bổ sung của καί. Các chú thích được neo tại đúng cụm từ liên quan: chú thích từ vựng ở lần xuất hiện đầu của “người anh em,” và dị bản ở “tòa phán xét của Đức Chúa Trời.” Không có sự dung hòa thần học giữa cách đọc “của Đức Chúa Trời” và dị bản “của Đấng Christ.”'
