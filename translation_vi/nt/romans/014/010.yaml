    rationale: Trong tiếng Việt hiện đại, “anh em” thông thường có thể được hiểu là số nhiều hoặc một nhóm quan hệ; “người anh em của bạn” giữ số ít và quan hệ sở hữu trong tiếng Hy Lạp rõ hơn.
  - severity: low
    issue: “chính bạn” không thể hiện đầy đủ lực bổ sung của καί trong ἢ καὶ σὺ.
    rationale: “Hay bạn nữa” giữ được cả sự hướng sang người được chất vấn thứ hai lẫn ý “bạn cũng vậy/you too,” mà vẫn tự nhiên.
  - severity: low
    issue: Bản thảo chưa có chú thích về cách hiểu bao quát của “anh em” được nêu trong audit trail.
    rationale: Một chú thích tùy chọn về “người anh/chị/em” giúp người đọc nhận biết khả năng diễn đạt trong ngữ cảnh cộng đồng mà không làm thay đổi danh từ giống đực số ít trong văn bản chính.
