  text: ἄρα οὖν τὰ τῆς εἰρήνης διώκωμεν καὶ τὰ τῆς οἰκοδομῆς τῆς εἰς ἀλλήλους.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/019.yaml
  text: So then[a], let us pursue what makes for peace and what builds up one another.
translation:
  language: vi
  text: Vậy nên, chúng ta hãy theo đuổi những điều đem lại hòa bình và những điều giúp chúng ta gây dựng lẫn nhau.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát hình thức hơn: “những điều thuộc về hòa bình và những điều thuộc về sự gây dựng cho nhau.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄρα οὖν
  choice: Vậy nên
  rationale: Cặp tiểu từ suy luận rút ra kết luận từ lập luận trước đó. “Vậy nên” tự nhiên trong tiếng Việt hiện đại và giữ được sức suy luận cộng dồn.
- source_word: τὰ τῆς εἰρήνης
  choice: những điều đem lại hòa bình
  rationale: Cụm danh từ trung tính số nhiều với sở hữu cách chỉ những điều thuộc về hoặc thúc đẩy hòa bình. Cách dịch này rõ nghĩa và tự nhiên hơn lối dịch sát chữ.
- source_word: διώκωμεν
  choice: chúng ta hãy theo đuổi
  rationale: Động từ ở thể giả định dùng để khích lệ cả cộng đồng hành động liên tục. “Theo đuổi” giữ được sắc thái tích cực, mạnh mẽ của διώκω.
- source_word: τὰ τῆς οἰκοδομῆς
  choice: những điều giúp xây dựng
  rationale: οἰκοδομή có nghĩa đen là việc xây dựng nhưng ở đây được dùng theo nghĩa ẩn dụ về sự gây dựng con người và cộng đồng. “Giúp xây dựng” giữ hình ảnh ấy mà vẫn dễ hiểu.
- source_word: τῆς εἰς ἀλλήλους
  choice: lẫn nhau
  rationale: Cụm này diễn tả chiều hướng hỗ tương của việc xây dựng trong cộng đồng. “Lẫn nhau” bảo toàn tính tương hỗ và phù hợp với cú pháp tiếng Việt.
theological_decisions:
- issue: Phạm vi của việc xây dựng cộng đồng
  choice: Câu này khuyên các tín hữu cùng theo đuổi hòa bình và việc xây dựng lẫn nhau trong cộng đồng.
  alternative: Hiểu câu này chỉ nói đến sự tiến bộ đạo đức cá nhân.
  rationale: Thể khích lệ ngôi thứ nhất số nhiều và đại từ hỗ tương ἀλλήλους nhấn mạnh đời sống chung, nhất là trong bối cảnh những bất đồng về lương tâm ở Rô-ma 14. Bản dịch giữ trọng tâm cộng đồng mà không thêm nét riêng của hệ phái nào.
translation_notes:
  register: Tiếng Việt phổ thông hiện đại, trang trọng nhưng dễ hiểu. Cấu trúc song song “những điều… và những điều…” phản ánh sự lặp lại trong tiếng Hy Lạp; “giúp xây dựng lẫn nhau” giữ ẩn dụ cộng đồng mà tránh thuật ngữ tôn giáo khó hiểu.
