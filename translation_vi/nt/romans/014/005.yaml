id: ROM.14.5
reference: Romans 14:5
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ὃς ⸀μὲν κρίνει ἡμέραν παρ’ ἡμέραν, ὃς δὲ κρίνει πᾶσαν ἡμέραν· ἕκαστος ἐν τῷ ἰδίῳ νοῒ πληροφορείσθω·
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/005.yaml
  text: One person judges one day above another day[a], while another judges every day alike[c][b]. Let each one be fully convinced in his own mind.
translation:
  language: vi
  text: Người thì coi ngày này trọng hơn ngày kia[a], còn người khác coi mọi ngày đều như nhau[b]. Mỗi người hãy hoàn toàn tin chắc[c] trong tâm trí mình.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Người thì phân biệt ngày này với ngày kia.”'
    reason: lexical_alternative
  - marker: b
    text: 'Sát chữ: “mọi ngày”; trong văn cảnh, ý là mọi ngày đều như nhau.'
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể dịch: “hãy hoàn toàn xác tín”, “hãy hoàn toàn được thuyết phục” hoặc “hãy được bảo đảm đầy đủ”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κρίνει
  choice: cho rằng
  rationale: Trong văn cảnh này, κρίνω chỉ sự đánh giá và phân biệt, không hàm ý kết án. “Cho rằng” tự nhiên trong tiếng Việt và phù hợp với cả hai vế đối chiếu.
- source_word: ἡμέραν παρ’ ἡμέραν
  choice: ngày này quan trọng hơn ngày kia
  rationale: Cụm với παρά có ý so sánh giữa các ngày. Cách dịch này làm rõ sự đánh giá cao hơn mà không xác định đó là ngày Sa-bát, lễ hội hay ngày kiêng ăn.
- source_word: πᾶσαν ἡμέραν
  choice: mọi ngày đều như nhau
  rationale: Nguyên văn sát chữ là “mọi ngày”; “đều như nhau” diễn đạt ý hàm ẩn từ sự đối lập với vế trước, rằng người này không phân biệt ngày nào hơn ngày nào.
- source_word: ἕκαστος
  choice: mỗi người
  rationale: Giữ sắc thái phân phối ở số ít, đồng thời tự nhiên và bao quát trong tiếng Việt.
- source_word: ἐν τῷ ἰδίῳ νοῒ
  choice: trong tâm trí mình
  rationale: νοῦς chỉ tâm trí hay khả năng suy xét; “tâm trí mình” giữ được trọng tâm về sự xác tín cá nhân mà không phải dùng đại từ mang giới tính.
- source_word: πληροφορείσθω
  choice: hãy hoàn toàn xác tín
  rationale: Mệnh lệnh hiện tại thụ động diễn tả trạng thái tin chắc hoặc được thuyết phục đầy đủ. “Hoàn toàn xác tín” trang trọng, rõ nghĩa và phù hợp văn cảnh.
theological_decisions:
- issue: Bản chất của những “ngày” được nói đến
  choice: Giữ cách gọi chung là “ngày”, không xác định loại ngày nào.
  alternative: Diễn giải là ngày Sa-bát, ngày lễ Do Thái hoặc ngày kiêng ăn.
  rationale: Phao-lô không nói rõ những ngày nào; bản dịch không nên giải quyết một vấn đề diễn giải mà câu này để ngỏ.
- issue: Ý của πᾶσαν ἡμέραν trong cấu trúc đối chiếu
  choice: Dịch “mọi ngày đều như nhau”.
  alternative: Dịch sát chữ “mọi ngày”.
  rationale: “Đều như nhau” không có từ tương ứng riêng trong tiếng Hy Lạp nhưng là ý được hàm chứa bởi sự đối lập; chú thích bảo tồn dạng sát chữ.
- issue: Hình thức số ít giống đực đại diện
  choice: Dùng “mỗi người” và “mình”, có giá trị bao quát tự nhiên trong tiếng Việt.
  alternative: Dùng đại từ giống đực như “người ấy” hoặc “tâm trí của ông ấy”.
  rationale: Tiếng Việt không buộc phải đánh dấu giống ở đây; cách diễn đạt này vẫn giữ số ít và tính cá nhân mà không thu hẹp đối tượng.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Cấu trúc đối chiếu “người thì… còn người khác…” phản ánh μὲν… δὲ. Không thêm loại ngày cụ thể; dùng “xác tín” để truyền đạt sự tin chắc đã được cân nhắc.
