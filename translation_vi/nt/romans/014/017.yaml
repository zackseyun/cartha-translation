id: ROM.14.17
reference: Romans 14:17
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οὐ γάρ ἐστιν ἡ βασιλεία τοῦ θεοῦ βρῶσις καὶ πόσις, ἀλλὰ δικαιοσύνη καὶ εἰρήνη καὶ χαρὰ ἐν πνεύματι ἁγίῳ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/017.yaml
  text: For the kingdom of God is not eating and drinking[a], but righteousness and peace and joy in the Holy Spirit.
translation:
  language: vi
  text: Vì vương quốc Đức Chúa Trời không phải là việc ăn uống, nhưng là sự công chính[a], bình an và vui mừng trong Đức Thánh Linh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “công lý”. Từ Hy Lạp δικαιοσύνη có thể chỉ sự công chính hoặc công lý.
    reason: lexical_alternative
lexical_decisions:
- source_word: βασιλεία
  choice: vương quốc
  rationale: Cách dịch quen thuộc và tự nhiên của βασιλεία trong ngữ cảnh thần học; vẫn giữ được ý nghĩa bao quát về lãnh vực và quyền trị vì của Đức Chúa Trời.
- source_word: βρῶσις καὶ πόσις
  choice: việc ăn uống
  rationale: Hai danh từ chỉ hoạt động được diễn đạt cân xứng và tự nhiên trong tiếng Việt, phù hợp với ngữ cảnh về các tập tục đang gây tranh luận.
- source_word: δικαιοσύνη
  choice: sự công chính
  rationale: Cách dịch chuẩn và phù hợp với cách dùng của Phao-lô, diễn tả tình trạng và lối sống ngay thẳng; nghĩa khả dĩ “công lý” được giữ trong chú thích.
- source_word: εἰρήνη
  choice: bình an
  rationale: Diễn đạt tự nhiên cả sự bình an lẫn hòa thuận trong quan hệ cộng đồng ở ngữ cảnh này.
- source_word: χαρά
  choice: vui mừng
  rationale: Cách diễn đạt thông dụng, trang trọng vừa phải và phù hợp với danh từ chỉ niềm vui trong tiếng Hy Lạp.
- source_word: ἐν πνεύματι ἁγίῳ
  choice: trong Đức Thánh Linh
  rationale: Giữ giới từ ἐν để bảo toàn sắc thái về phạm vi hoặc tác động, đồng thời nhận diện πνεῦμα ἅγιον là Đức Thánh Linh theo cách dùng của Phao-lô.
- source_word: γάρ
  choice: Vì
  rationale: Giữ mối liên hệ giải thích với lập luận ngay trước câu này.
theological_decisions:
- issue: Cách dịch δικαιοσύνη trong văn mạch của Phao-lô
  choice: sự công chính
  alternative: công lý
  rationale: “Sự công chính” duy trì cách dùng nhất quán trong các thư Phao-lô, còn “công lý” là một nghĩa thực sự thuộc phạm vi ngữ nghĩa nên được nêu trong chú thích mà không áp đặt nó vào chính văn.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Cấu trúc đối lập “không phải… nhưng là…” bám sát câu Hy Lạp; cụm “việc ăn uống” tự nhiên hơn việc danh từ hóa riêng từng hoạt động. Dấu chú thích được đặt ngay sau “sự công chính”, là từ mà chú thích giải nghĩa.
source_grounding:
  english_pob_role: consult_only
