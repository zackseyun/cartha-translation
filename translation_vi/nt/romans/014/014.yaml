  verdict: revise
  source_fidelity: Bản dịch truyền đạt đúng xác tín của Phao-lô rằng không có gì ô uế tự bản chất, và rằng điều bị một người coi là ô uế thì là ô uế đối với người đó. Tuy nhiên, liên từ “nhưng” chưa biểu đạt rõ sắc thái ngoại lệ/giới hạn của εἰ μὴ; cách diễn đạt lại dưới đây phản ánh quan hệ ấy rõ hơn mà vẫn tự nhiên.
  naturalness: Câu dự thảo nhìn chung tự nhiên, nhưng việc lặp “đối với” khiến vế sau hơi nặng. Cấu trúc “chỉ đối với... mới...” gọn, hiện đại, và vẫn giữ được tính áp dụng cá nhân của mệnh đề cuối.
  terminology: “Ô uế” phù hợp trong ngữ cảnh thanh sạch theo nghi lễ của κοινός. Chú thích nên nêu “chung” là lựa chọn sát chữ chính, rồi giải thích nghĩa theo ngữ cảnh; “tục” không nên đứng như một tương đương không giải thích vì trong tiếng Việt hiện đại dễ gợi sắc thái đạo đức hoặc thô tục.
