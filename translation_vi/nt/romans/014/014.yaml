id: ROM.14.14
reference: Romans 14:14
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οἶδα καὶ πέπεισμαι ἐν κυρίῳ Ἰησοῦ ὅτι οὐδὲν κοινὸν δι’ ⸀ἑαυτοῦ· εἰ μὴ τῷ λογιζομένῳ τι κοινὸν εἶναι, ἐκείνῳ κοινόν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/014.yaml
  text: I know and am persuaded in the Lord Jesus that nothing is unclean in itself; except that to the one who considers anything to be unclean[a], to that person it is unclean.
translation:
  language: vi
  text: Tôi biết và tin chắc trong Chúa Giê-su rằng không có gì tự nó là ô uế; chỉ đối với người coi điều gì là ô uế[a], điều đó mới là ô uế.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “chung” (hoặc “tục”). Trong ngữ cảnh này, từ Hy Lạp thường chỉ điều bị coi là không thanh sạch hoặc phàm tục theo nghi lễ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἶδα
  choice: Tôi biết
  rationale: Diễn đạt trực tiếp động từ chỉ nhận thức, tự nhiên và trang trọng trong tiếng Việt hiện đại.
- source_word: πέπεισμαι
  choice: tin chắc
  rationale: Thể hoàn thành diễn tả một niềm xác tín đã được hình thành và còn vững bền; “tin chắc” tự nhiên hơn “được thuyết phục” trong tiếng Việt.
- source_word: ἐν κυρίῳ Ἰησοῦ
  choice: trong Chúa Giê-su
  rationale: Giữ nguyên giới từ ἐν và không quyết định quá mức rằng sự xác tín này đến “bởi” Chúa hay do sự hiệp nhất với Chúa.
- source_word: κοινόν
  choice: ô uế
  rationale: Trong ngữ cảnh thức ăn và sự thanh sạch, từ này chỉ điều bị xem là không thanh sạch hoặc bị tục hóa, chứ không đơn thuần có nghĩa là “chung”; nghĩa sát chữ được ghi ở chú thích.
- source_word: δι’ ἑαυτοῦ
  choice: tự nó
  rationale: 'Cách nói tự nhiên, diễn đạt địa vị nội tại của sự vật: không vật gì vốn mang tính ô uế.'
- source_word: τῷ λογιζομένῳ
  choice: đối với người cho rằng
  rationale: λογίζομαι ở đây có nghĩa là xem, coi hoặc nhận định một vật theo cách nào đó; “cho rằng” giữ rõ khía cạnh nhận thức.
- source_word: τι
  choice: vật gì
  rationale: Trong ngữ cảnh đang bàn về đồ ăn và sự vật được xem là ô uế, “vật gì” vừa tự nhiên vừa giữ tính bất định.
- source_word: ἐκείνῳ κοινόν
  choice: thì đối với người ấy, nó là ô uế
  rationale: Giữ lực cá nhân của đại từ sở chỉ và cho thấy sự ô uế áp dụng đối với người có nhận định ấy, không khẳng định đó là thuộc tính nội tại của vật.
theological_decisions:
- issue: Ý nghĩa của κοινός trong mối liên hệ với thức ăn và sự thanh sạch
  choice: Dịch là “ô uế” để truyền đạt ngôn ngữ thanh sạch trong ngữ cảnh, đồng thời câu đầu phủ nhận rằng sự vật tự bản chất là ô uế.
  alternative: “tầm thường”, “chung” hoặc “tục”
  rationale: “Ô uế” là cách diễn đạt dễ hiểu nhất đối với độc giả hiện đại trong ngữ cảnh này. Tuy nhiên, nghĩa sát chữ liên quan đến điều “chung/tục”, đối lập với điều thánh biệt, được bảo lưu trong chú thích để tránh che mất sắc thái Hy Lạp.
- issue: Quan hệ được diễn tả bởi ἐν trong ἐν κυρίῳ Ἰησοῦ
  choice: Giữ là “trong Chúa Giê-su”.
  alternative: “nhờ Chúa Giê-su” hoặc “bởi Chúa Giê-su”
  rationale: Bản Hy Lạp cho phép sắc thái xác tín trong mối liên hệ với Chúa, nhưng không buộc phải xác định đây chỉ là nguồn mặc khải hay phương tiện; bản dịch giữ sự hàm nghĩa mở.
- issue: Tác dụng của lương tâm hay nhận định cá nhân
  choice: Diễn đạt rằng vật ấy là ô uế “đối với người ấy”.
  alternative: Diễn giải rằng chính suy nghĩ làm cho vật trở nên ô uế về bản thể
  rationale: Cú pháp nhấn mạnh sự áp dụng đối với người xem vật ấy là ô uế, trong khi mệnh đề trước phủ nhận tính ô uế nội tại. Bản dịch không giải quyết thêm câu hỏi thần học về cách lương tâm tạo nên trách nhiệm.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “tin chắc” thay cho lối dịch thụ động cứng; giữ cụm “trong Chúa Giê-su” để bảo toàn độ mở của nguyên văn. Cấu trúc lặp “đối với” phản ánh trọng tâm cá nhân của hai cách ở tặng cách trong câu Hy Lạp.
