id: ROM.14.13
reference: Romans 14:13
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Μηκέτι οὖν ἀλλήλους κρίνωμεν· ἀλλὰ τοῦτο κρίνατε μᾶλλον, τὸ μὴ τιθέναι πρόσκομμα τῷ ἀδελφῷ ἢ σκάνδαλον.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/013.yaml
  text: 'Therefore, let us no longer judge one another, but rather decide this: not to put a stumbling block or an offense before a brother.'
translation:
  language: vi
  text: 'Vậy, chúng ta đừng xét đoán nhau nữa; nhưng thà hãy quyết định điều này: đừng đặt trên đường của một người anh em[a] chướng ngại gây vấp ngã hay cạm bẫy[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “một anh chị em cùng đức tin”; tiếng Hy Lạp dùng “anh em” ở số ít, tại đây chỉ một người cùng đức tin, dù là nam hay nữ.
    reason: alternative_reading
  - marker: b
    text: “Cạm bẫy” ở đây là điều khiến người khác sa vào tội lỗi hoặc sa ngã, chứ không chỉ là điều làm họ khó chịu hay tổn thương cảm xúc.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μηκέτι οὖν
  choice: Vậy, ... đừng ... nữa
  rationale: “Vậy” diễn đạt quan hệ suy luận của οὖν với phần trước; kết cấu “đừng ... nữa” tự nhiên diễn đạt việc chấm dứt hành động đang diễn ra trong Μηκέτι cùng lối khuyên nhủ.
- source_word: ἀλλήλους κρίνωμεν
  choice: chúng ta đừng xét đoán nhau
  rationale: Dùng lời khuyên ở ngôi thứ nhất số nhiều và giữ nghĩa rộng của κρίνω là xét đoán, không thu hẹp thành kết án.
- source_word: ἀλλὰ τοῦτο κρίνατε μᾶλλον
  choice: Nhưng đúng hơn, hãy quyết định điều này
  rationale: '“Quyết định” thể hiện nghĩa khác của cùng động từ κρίνω trong ngữ cảnh này: đưa ra một quyết định về cách hành xử của chính mình. “Đúng hơn” phản ánh μᾶλλον.'
- source_word: τὸ μὴ τιθέναι
  choice: không đặt
  rationale: Diễn đạt trực tiếp nội dung của điều phải quyết định và giữ hình ảnh đặt một vật trên đường người khác.
- source_word: πρόσκομμα
  choice: chướng ngại gây vấp ngã
  rationale: Giữ hình ảnh một vật cản khiến người khác vấp, đồng thời làm rõ ý nghĩa đạo đức trong văn cảnh.
- source_word: τῷ ἀδελφῷ
  choice: trước mặt một người anh em
  rationale: Giữ danh từ giống đực số ít của bản Hy Lạp. Trong văn cảnh, đây là cách gọi một người cùng đức tin; chú thích nêu rõ phạm vi đại diện.
- source_word: ἢ σκάνδαλον
  choice: hay cạm bẫy khiến người ấy sa ngã
  rationale: “Hay” giữ liên từ phân cách ἢ. “Cạm bẫy” bảo tồn hình ảnh của σκάνδαλον, còn mệnh đề theo sau làm rõ rằng đây là nguyên nhân dẫn đến sa ngã chứ không chỉ là điều làm tổn thương cảm xúc.
theological_decisions:
- issue: Phạm vi đại diện của ἀδελφῷ ở dạng giống đực số ít
  choice: một người anh em
  alternative: một anh chị em cùng đức tin; một người cùng đức tin
  rationale: Bản chính giữ hình thức số ít và cách xưng hô của nguyên văn, trong khi chú thích cho biết từ này chỉ người cùng đức tin nói chung, có thể là nam hoặc nữ.
- issue: Sắc thái đạo đức của σκάνδαλον
  choice: cạm bẫy khiến người ấy sa ngã
  alternative: cớ sa ngã; nguyên nhân khiến sa ngã
  rationale: Cách dịch giữ hình ảnh cụ thể của từ Hy Lạp và làm rõ hậu quả thuộc phương diện đạo đức hoặc tâm linh, không hiểu theo nghĩa hiện đại là chỉ gây khó chịu hay xúc phạm.
- issue: Sự lặp lại của κρίνω
  choice: xét đoán ... quyết định
  alternative: xét ... xét định
  rationale: Nguyên văn dùng cùng một động từ với hai đối tượng và sắc thái khác nhau. Tiếng Việt dùng hai từ phù hợp ngữ cảnh để câu tự nhiên, nhưng vẫn giữ sự tương phản giữa xét đoán người khác và quyết định cách hành xử của mình.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Xét đoán” phù hợp lời khuyên đạo đức; “chướng ngại gây vấp ngã” và “cạm bẫy khiến ... sa ngã” bảo tồn hai hình ảnh gần nghĩa nhưng không hoàn toàn đồng nhất trong nguyên văn.
