revisions:
- from: Đừng vì thức ăn mà phá đổ công việc của Đức Chúa Trời. Thật vậy, mọi thứ đều thanh sạch[a], nhưng ăn theo cách khiến người khác vấp ngã thì là điều xấu[b].
  to: Đừng vì thức ăn mà phá hủy công việc của Đức Chúa Trời. Quả thật, mọi thứ đều thanh sạch[a], nhưng đối với người ăn theo cách gây vấp ngã cho người khác, điều đó là xấu[b].
  rationale: Bản sửa bảo toàn mệnh đề đánh giá với người ăn trong nguyên văn, dùng tiếng Việt hiện đại tự nhiên hơn, và thay chú thích diễn giải về lương tâm bằng một chú thích nêu đúng tính mơ hồ của cụm διὰ προσκόμματος. Cách hiểu chính theo hướng gây vấp ngã phù hợp mạch văn gần, nhưng chú thích không loại trừ cách phân tích khác.
