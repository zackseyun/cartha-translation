id: ROM.14.20
reference: Romans 14:20
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: μὴ ἕνεκεν βρώματος κατάλυε τὸ ἔργον τοῦ θεοῦ. πάντα μὲν καθαρά, ἀλλὰ κακὸν τῷ ἀνθρώπῳ τῷ διὰ προσκόμματος ἐσθίοντι.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/020.yaml
  text: Do not[a], for the sake of food, tear down the work of God. All things are indeed clean[b], but it is evil for the person who eats in a way that causes stumbling.
translation:
  language: vi
  text: Đừng vì thức ăn mà phá hủy công việc của Đức Chúa Trời. Quả thật, mọi thứ đều thanh sạch[a], nhưng đối với người ăn theo cách gây vấp ngã cho người khác, điều đó là xấu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Theo ngữ cảnh, “mọi thứ” chủ yếu nói đến thức ăn; cũng có thể dịch: “Mọi thức ăn đều thanh sạch.”'
    reason: lexical_alternative
  - marker: b
    text: 'Hoặc: “nhưng điều đó là xấu đối với người ăn vì cớ vấp phạm.” Cụm Hy Lạp có thể được hiểu theo hướng việc ăn gây vấp ngã, hoặc theo hướng người ăn trong hoàn cảnh có cớ vấp phạm.'
    reason: ambiguity
lexical_decisions:
- source_word: ἕνεκεν βρώματος
  choice: vì thức ăn
  rationale: ἕνεκεν với sở hữu cách diễn tả nguyên nhân hoặc động cơ; cách dịch này tự nhiên trong tiếng Việt và giữ rõ ý không nên gây tổn hại chỉ vì chuyện ăn uống.
- source_word: κατάλυε
  choice: phá đổ
  rationale: Giữ hình ảnh tháo dỡ hoặc phá sập điều Đức Chúa Trời đang xây dựng, đồng thời phù hợp với mệnh lệnh phủ định ở hiện tại.
- source_word: τὸ ἔργον τοῦ θεοῦ
  choice: công việc của Đức Chúa Trời
  rationale: Giữ nguyên độ rộng và sức nặng thần học của cụm sở hữu cách, không thu hẹp công việc ấy chỉ vào cá nhân hay cộng đồng.
- source_word: πάντα μὲν καθαρά
  choice: Thật vậy, mọi thứ đều thanh sạch
  rationale: πάντα có phạm vi rộng dù ngữ cảnh là thức ăn; μέν được thể hiện nhẹ bằng 'thật vậy', còn καθαρά giữ ngôn ngữ thanh sạch thay vì diễn giải thành 'được phép'.
- source_word: κακὸν
  choice: là điều xấu
  rationale: Diễn đạt phán đoán đạo đức của κακόν bằng tiếng Việt tự nhiên, mạnh hơn một cách nói chỉ về sự bất tiện hay thiếu khôn ngoan.
- source_word: τῷ ἀνθρώπῳ
  choice: người
  rationale: ἄνθρωπος ở đây chỉ con người theo nghĩa đại diện; 'người' vừa chính xác vừa tự nhiên trong tiếng Việt và không thêm giới tính mà ngữ cảnh không nhấn mạnh.
- source_word: διὰ προσκόμματος ἐσθίοντι
  choice: ăn theo cách khiến người khác vấp ngã
  rationale: Diễn đạt tự nhiên cách thức ăn uống gắn với πρόσκομμα, đồng thời giữ hình ảnh 'vấp ngã' và hàm ý tác động đến người khác.
theological_decisions:
- issue: Phạm vi của lời khẳng định 'mọi thứ đều thanh sạch'
  choice: Giữ cách nói rộng 'mọi thứ đều thanh sạch', để ngữ cảnh ăn uống xác định phạm vi áp dụng.
  alternative: Dịch rõ thành 'mọi thức ăn đều thanh sạch' hoặc diễn giải là 'đều được phép'.
  rationale: Bản Hy Lạp dùng πάντα chứ không nêu danh từ 'thức ăn'; giữ cách nói rộng bảo toàn hình thức và ngôn ngữ thanh sạch mà không áp đặt một diễn giải giáo phái.
- issue: Quan hệ cú pháp và đạo đức của διὰ προσκόμματος
  choice: Hiểu là ăn theo cách gây vấp ngã cho người khác.
  alternative: Hiểu là người ăn trong khi chính mình bị cớ vấp phạm hoặc trái với lương tâm.
  rationale: Cụm Hy Lạp có thể hàm chứa độ căng về người gây hoặc chịu vấp ngã; bản chính chọn cách đọc phù hợp mạch văn về tác động đến anh chị em, còn chú thích bảo lưu khả năng hiểu khác.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng 'Đức Chúa Trời' cho θεός; giữ hình ảnh 'phá đổ' và 'vấp ngã' vì chúng nối kết lập luận của đoạn văn.
