  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸀ἄρα ἕκαστος ἡμῶν περὶ ἑαυτοῦ λόγον ⸀δώσει.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/012.yaml
  text: So then[a], each of us will give an account of himself.
translation:
  language: vi
  text: Vậy thì, mỗi người trong chúng ta sẽ khai trình về chính mình.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “về bản thân mình” hoặc, theo lối diễn ý, “cho chính mình”. Tiếng Hy Lạp sát nghĩa là “liên quan đến chính mình”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄρα
  choice: Vậy thì
  rationale: Diễn đạt tự nhiên sức suy luận kết luận của ἄρα từ lập luận ngay trước đó.
- source_word: ἕκαστος ἡμῶν
  choice: mỗi người trong chúng ta
  rationale: Giữ rõ ý phân phối của ἕκαστος cùng sở hữu cách bộ phận ἡμῶν.
- source_word: περὶ ἑαυτοῦ
  choice: về chính mình
  rationale: Phản ánh nghĩa thông thường của περί với sở hữu cách là “về/liên quan đến”; “chính mình” giữ tính phản thân và áp dụng riêng cho từng người.
- source_word: λόγον δώσει
  choice: sẽ khai trình
  rationale: Chuyển đạt thành ngữ mang nghĩa trình bày, chịu trách nhiệm hoặc giải trình trong bối cảnh phán xét; “khai trình” trang trọng nhưng vẫn dễ hiểu.
theological_decisions:
- issue: Đại từ phản thân số ít trong lời khẳng định áp dụng chung
  choice: về chính mình
  alternative: về bản thân mình; cho chính mình
  rationale: Tiếng Việt không buộc phải đánh dấu giống. Cách dịch số ít theo từng cá nhân giữ sức phân phối của câu mà không thêm phân biệt giới tính vốn không cần thiết trong tiếng Việt.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Khai trình” giữ sắc thái chịu trách nhiệm trước sự phán xét; chú thích bảo tồn phạm vi nghĩa của περὶ ἑαυτοῦ.
