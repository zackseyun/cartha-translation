id: ROM.14.22
reference: Romans 14:22
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: σὺ πίστιν ⸀ἣν ἔχεις κατὰ σεαυτὸν ἔχε ἐνώπιον τοῦ θεοῦ. μακάριος ὁ μὴ κρίνων ἑαυτὸν ἐν ᾧ δοκιμάζει·
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/022.yaml
  text: The faith that you have[a], keep to yourself before God[b]. Blessed is the one who does not judge himself by what he approves.
translation:
  language: vi
  text: Đức tin mà bạn có[a], hãy giữ cho riêng mình trước mặt Đức Chúa Trời. Phước cho người không tự xét đoán mình bởi điều mình chấp nhận[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Niềm xác tín mà bạn có.” Trong văn cảnh này, “đức tin” có thể chỉ niềm xác tín cá nhân về những vấn đề đang được tranh luận.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “không tự kết án mình bởi điều mình chấp nhận.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: πίστιν
  choice: đức tin
  rationale: Giữ cách dịch mặc định của πίστις, đồng thời văn cảnh cho thấy từ này chỉ niềm xác tín cá nhân về những vấn đề đang được tranh luận; phương án ấy được ghi ở chú thích.
- source_word: κατὰ σεαυτὸν
  choice: giữ cho riêng mình
  rationale: Diễn đạt tự nhiên ý người đọc nên giữ niềm xác tín ấy cho mình, không áp đặt lên người khác; cụm ἐνώπιον τοῦ θεοῦ vẫn được dịch riêng.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: trước mặt Đức Chúa Trời
  rationale: Bảo toàn ý thức về sự hiện diện và trách nhiệm trước Đức Chúa Trời.
- source_word: μακάριος
  choice: Phước cho
  rationale: Cách nói Kinh Thánh trang trọng, tự nhiên, giữ được sức nặng đạo đức và thần học hơn từ chỉ cảm xúc chủ quan như 'hạnh phúc'.
- source_word: κρίνων ἑαυτὸν
  choice: tự xét đoán mình
  rationale: Bám sát nghĩa cơ bản của κρίνω và không loại bỏ sắc thái kết án vốn có thể được hàm ý trong văn cảnh.
- source_word: ἐν ᾧ δοκιμάζει
  choice: bởi điều mình chấp nhận
  rationale: δοκιμάζω ở đây nói đến điều một người đã xem xét và chấp nhận; 'bởi' thể hiện sắc thái phương tiện/căn cứ có thể có của ἐν.
theological_decisions:
- issue: Ý nghĩa của πίστις trong văn cảnh các vấn đề có thể tranh luận
  choice: đức tin, được hiểu theo văn cảnh là niềm xác tín cá nhân trước Đức Chúa Trời về vấn đề đang bàn
  alternative: niềm xác tín; lòng tin cậy Đức Chúa Trời nói chung; sự trung tín
  rationale: Văn cảnh trực tiếp bàn về thực hành và lương tâm. Giữ 'đức tin' bảo toàn thuật ngữ chủ chốt, còn chú thích nêu rõ sắc thái ngữ cảnh mà không đồng nhất nó một cách chuyên biệt với đức tin cứu rỗi.
- issue: Sắc thái của κρίνων ἑαυτὸν
  choice: tự xét đoán mình
  alternative: tự kết án mình
  rationale: Bản văn có thể mang sắc thái kết án, nhưng cách dịch rộng hơn bảo toàn độ mở từ vựng của κρίνω; phương án mạnh hơn được ghi trong chú thích.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng đại từ số ít trung tính 'bạn' để phản ánh σὺ; chuyển sang 'người' trong mệnh đề châm ngôn để diễn đạt tự nhiên. Hai cụm κατὰ σεαυτὸν và ἐνώπιον τοῦ θεοῦ được giữ phân biệt.
