id: ROM.14.23
reference: Romans 14:23
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὁ δὲ διακρινόμενος ἐὰν φάγῃ κατακέκριται, ὅτι οὐκ ἐκ πίστεως· πᾶν δὲ ὃ οὐκ ἐκ πίστεως ἁμαρτία ⸀ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/023.yaml
  text: But the one who doubts is condemned if he eats[a], because it is not from faith; and everything that is not from faith is sin.
translation:
  language: vi
  text: Nhưng người nào còn nghi ngại mà vẫn ăn thì bị kết án, vì việc ấy không xuất phát từ đức tin; và mọi điều không xuất phát từ đức tin đều là tội lỗi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể hiểu: “vì việc ấy không phát xuất từ sự xác tín.” Tiếng Hy Lạp nói “từ đức tin,” và trong ngữ cảnh này có thể bao hàm ý hành động với sự xác tín vững vàng trước mặt Đức Chúa Trời.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διακρινόμενος
  choice: người nào còn nghi ngại
  rationale: Trong ngữ cảnh các băn khoăn về việc ăn uống, từ này nói đến sự do dự, phân vân trong lòng hơn là tranh luận với người khác. “Còn nghi ngại” tự nhiên trong tiếng Việt và giữ được trạng thái chưa xác quyết.
- source_word: ἐὰν φάγῃ
  choice: mà vẫn ăn
  rationale: Cấu trúc điều kiện chỉ trường hợp người đang nghi ngại nhưng lại ăn. “Mà vẫn ăn” diễn đạt tự nhiên sự tương phản hàm ẩn trong ngữ cảnh.
- source_word: κατακέκριται
  choice: thì bị kết án
  rationale: Thể hoàn thành bị động diễn tả tình trạng bị kết án phát sinh từ hành động ấy. Cách dịch bị động không xác định tác nhân, đúng với sự không xác định của nguyên văn.
- source_word: ὅτι οὐκ ἐκ πίστεως
  choice: vì việc ấy không xuất phát từ đức tin
  rationale: ὅτι nêu lý do, còn ἐκ chỉ nguồn gốc hoặc nền tảng của hành động. Thêm “việc ấy” để câu tiếng Việt rõ nghĩa mà không thu hẹp πίστις thành cảm nhận chủ quan.
- source_word: πᾶν δὲ ὃ οὐκ ἐκ πίστεως
  choice: và mọi điều không xuất phát từ đức tin
  rationale: Giữ phạm vi bao quát của πᾶν ... ὃ và lặp lại cụm “xuất phát từ đức tin” để bảo toàn sự liên kết và nhấn mạnh trong nguyên văn.
- source_word: ἁμαρτία ἐστίν
  choice: đều là tội lỗi
  rationale: Dịch bằng danh từ “tội lỗi” để giữ tính khẳng định dứt khoát của cấu trúc vị ngữ danh từ; “đều” giúp câu tiếng Việt ăn khớp tự nhiên với “mọi điều”.
theological_decisions:
- issue: Cách dịch πίστις trong ngữ cảnh luân lý của Phao-lô
  choice: đức tin
  alternative: sự xác tín; lòng tin; sự trung tín
  rationale: “Đức tin” giữ thuật ngữ thần học rộng hơn của Phao-lô và sát cụm ἐκ πίστεως, trong khi ngữ cảnh cũng có thể bao hàm việc hành động với sự xác tín vững vàng trước mặt Đức Chúa Trời. Chú thích bảo tồn sắc thái này mà không đồng nhất đức tin với sở thích chủ quan.
- issue: Phạm vi của sự kết án trong κατακέκριται
  choice: bị kết án
  alternative: tự kết án mình; bị Đức Chúa Trời kết án
  rationale: Nguyên văn dùng thể bị động nhưng không nêu tác nhân. Bản dịch không xác định đó chỉ là sự lên án của lương tâm hay trực tiếp là phán xét của Đức Chúa Trời, nhờ vậy giữ nguyên sự căng thẳng thần học.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Còn nghi ngại mà vẫn ăn” làm rõ mối tương phản trong ngữ cảnh; “không xuất phát từ đức tin” giữ hình ảnh nguồn gốc của ἐκ πίστεως. Dấu chú thích [a] được đặt sau toàn câu vì chú thích giải thích cả hai lần xuất hiện của cụm này.
