- from: Người này tin rằng mình có thể ăn mọi thứ[a], còn người yếu thì ăn rau.[b]
  to: Một người tin rằng mình có thể ăn mọi thứ[a], còn người yếu thì ăn rau.[b]
  rationale: Thay “Người này” bằng “Một người” để tránh sắc thái chỉ định và phản ánh tốt hơn số ít đại diện trong kết cấu Hy Lạp. Điều chỉnh nhẹ chú thích a cho nhất quán với phương án “tin chắc/is convinced” và chú thích b để diễn đạt liên hệ ngữ cảnh mạch lạc hơn. Không thay đổi ý nghĩa câu, không thêm tính độc quyền vào “ăn rau”, và không xác định quá mức bản chất của sự “yếu” trong chính văn.
