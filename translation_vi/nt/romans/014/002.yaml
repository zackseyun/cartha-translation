id: ROM.14.2
reference: Romans 14:2
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὃς μὲν πιστεύει φαγεῖν πάντα, ὁ δὲ ἀσθενῶν λάχανα ἐσθίει.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/002.yaml
  text: One person believes he may eat anything[b][a], but the one who is weak eats vegetables.
translation:
  language: vi
  text: Một người tin rằng mình có thể ăn mọi thứ[a], còn người yếu thì ăn rau.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “tin chắc rằng mình có thể ăn mọi thứ.”'
    reason: lexical_alternative
  - marker: b
    text: Trong ngữ cảnh, “người yếu” chỉ người yếu về đức tin hoặc lương tâm liên quan đến các tập tục ăn uống; xem Rô-ma 14:1.
    reason: cross_reference
lexical_decisions:
- source_word: ὃς μὲν
  choice: Người này
  rationale: Diễn đạt tự nhiên vế thứ nhất của kết cấu đối chiếu μὲν...δέ, đồng thời giữ số ít đại diện mà không nhấn mạnh giới tính.
- source_word: πιστεύει
  choice: tin rằng
  rationale: Động từ đi với động từ nguyên mẫu, chỉ sự tin chắc hay xác tín cá nhân về việc ăn uống; “tin rằng” vừa trực tiếp vừa giữ liên hệ từ vựng với ý niệm đức tin.
- source_word: φαγεῖν πάντα
  choice: mình có thể ăn mọi thứ
  rationale: “Mọi thứ” thể hiện phạm vi không hạn chế của πάντα; “có thể” truyền đạt sắc thái được phép trong bối cảnh tranh luận về thức ăn, dù không được nêu riêng bằng một từ Hy Lạp.
- source_word: ὁ δὲ
  choice: còn người
  rationale: “Còn” đánh dấu vế đối chiếu thứ hai một cách tự nhiên trong tiếng Việt mà không làm tương phản mạnh hơn nguyên văn.
- source_word: ἀσθενῶν
  choice: yếu
  rationale: Giữ nguyên cách đánh giá ngắn gọn của Phao-lô, không tự thêm “trong đức tin” vào câu này; ngữ cảnh câu 1 xác định phương diện của sự yếu đuối.
- source_word: λάχανα
  choice: rau
  rationale: Chỉ các loại rau hoặc sản vật vườn; “rau” là cách gọi thông dụng, rõ nghĩa trong tiếng Việt hiện đại.
- source_word: ἐσθίει
  choice: ăn
  rationale: Nguyên văn chỉ nói người ấy ăn rau, không có từ tương đương với “chỉ”; vì vậy không thêm ý độc quyền vào chính văn.
theological_decisions:
- issue: Bản chất của sự “yếu” trong ἀσθενῶν
  choice: Dịch đơn giản là “người yếu” và giải thích bằng chú thích rằng ngữ cảnh nói đến sự yếu trong đức tin hoặc lương tâm về thức ăn.
  alternative: “người yếu đức tin”
  rationale: Rô-ma 14:1 cung cấp ngữ cảnh, nhưng câu 2 tự nó chỉ nói “người yếu”. Cách dịch này giữ độ cô đọng và không giải quyết thay cho nguyên văn điều được ngữ cảnh bổ nghĩa.
- issue: Sắc thái cho phép trong φαγεῖν πάντα
  choice: “có thể ăn mọi thứ”
  alternative: “ăn mọi thứ” hoặc “tin là ăn được mọi thứ”
  rationale: Trong văn cảnh các thực hành ăn uống đang bị tranh luận, niềm tin liên quan đến quyền tự do ăn; “có thể” diễn đạt tự nhiên sắc thái ấy mà chú thích vẫn ghi nhận cách dịch sát hình thức hơn.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Kết cấu “người này... còn người...” tái hiện đối chiếu μὲν...δέ tự nhiên. Không thêm “chỉ” trước “ăn rau”, vì ý độc quyền không được nói rõ trong nguyên văn.
