  text: μὴ βλασφημείσθω οὖν ὑμῶν τὸ ἀγαθόν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/016.yaml
  text: Therefore[a], do not let your good be spoken of as evil.
translation:
  language: vi
  text: Vậy, đừng để điều tốt của anh chị em bị nói xấu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “bị phỉ báng” hoặc “bị bôi nhọ”. Động từ Hy Lạp có thể chỉ lời nói xúc phạm hoặc phỉ báng; dịch sát hơn là “bị báng bổ”, nhưng trong tiếng Việt hiện đại cách này có thể gợi sắc thái tôn giáo quá chuyên biệt trong ngữ cảnh này.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ
  choice: đừng để
  rationale: Kết hợp với mệnh lệnh hiện tại thể bị động βλασφημείσθω, từ này tạo thành lời ngăn cấm; “đừng để” diễn đạt tự nhiên sắc thái ấy trong tiếng Việt.
- source_word: βλασφημείσθω
  choice: bị nói xấu
  rationale: Động từ có thể chỉ việc nói xúc phạm, phỉ báng hoặc bôi nhọ. Vì đối tượng ở đây là “điều tốt” chứ không phải Đức Chúa Trời, “bị nói xấu” truyền đạt đúng ý trong tiếng Việt hiện đại mà không tạo sắc thái tôn giáo quá chuyên biệt.
- source_word: οὖν
  choice: Vậy
  rationale: Đánh dấu kết luận suy ra từ lập luận trước đó; “Vậy” rõ ràng, tự nhiên và trang trọng vừa phải.
- source_word: ὑμῶν
  choice: của anh chị em
  rationale: Đại từ sở hữu số nhiều bổ nghĩa cho τὸ ἀγαθόν. “Anh chị em” diễn đạt cộng đồng tín hữu được ngỏ lời một cách tự nhiên, không hàm ý giới tính nam בלבד.
- source_word: τὸ ἀγαθόν
  choice: điều tốt
  rationale: Tính từ trung tính có mạo từ được dùng như danh từ, nghĩa đen là “điều tốt/cái tốt”. Cách dịch này giữ phạm vi chỉ vật rộng, không tự ý thu hẹp thành “sự tự do” hay “đặc quyền”.
theological_decisions:
- issue: Đối tượng được gọi là “điều tốt” (τὸ ἀγαθόν)
  choice: Giữ cách nói rộng là “điều tốt của anh chị em”.
  alternative: “sự tự do của anh chị em”, “đặc quyền của anh chị em” hoặc “lời chứng tốt của anh chị em”
  rationale: Câu Hy Lạp không xác định cụ thể đối tượng. Giữ cách diễn đạt rộng bảo tồn sự cô đọng và sức căng mục vụ của lời Phao-lô, thay vì đưa một cách giải thích riêng vào bản văn.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh chị em” để chỉ số nhiều và giữ giọng mục vụ. Câu ngắn gọn theo cấu trúc Hy Lạp, đồng thời đặt dấu chú thích ngay sau mệnh đề liên quan.
