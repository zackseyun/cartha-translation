  verdict: revise
  source_fidelity: Cấu trúc tổng thể phản ánh đúng ba hành động kiêng cữ và ba hệ quả được liệt kê trong tiếng Hy Lạp. Tuy nhiên, “sa vào cạm bẫy” diễn giải σκανδαλίζεται theo hình ảnh cái bẫy, vốn không được nói rõ trong câu và làm chuyển trọng tâm khỏi ý bị làm cho vấp ngã/vấp phạm. Cần thay bằng một cách diễn đạt giữ được thể bị động và sự gần nghĩa, nhưng không đồng nhất hoàn toàn, với προσκόπτει.
  naturalness: Câu liệt kê và kết câu “ấy là điều tốt” tự nhiên trong văn phong Kinh Thánh tiếng Việt hiện đại. “Người anh em của bạn” rõ hơn “anh em mình”, vì nguyên văn là danh từ số ít với sở hữu ngôi thứ hai; cách cũ có thể bị hiểu là số nhiều hoặc mang sắc thái phản thân không cần thiết.
  terminology: “Thịt,” “rượu,” “vấp ngã,” và “suy yếu” phù hợp ngữ cảnh. Dùng “bị làm cho vấp ngã” cho σκανδαλίζεται giữ nét bị động và không thêm cách hiểu “cạm bẫy.” Chú thích nên diễn đạt phạm vi đại diện của “người anh em” một cách tự nhiên hơn.
