revisions:
- from: Không ăn thịt, không uống rượu, cũng không làm bất cứ điều gì khiến anh em mình vấp ngã, sa vào cạm bẫy hoặc suy yếu, ấy là điều tốt.[a]
  to: Không ăn thịt, không uống rượu, cũng không làm bất cứ điều gì khiến người anh em của bạn vấp ngã, bị làm cho vấp ngã hoặc suy yếu, ấy là điều tốt.[a]
  rationale: Bản sửa thay cách diễn giải “sa vào cạm bẫy” bằng “bị làm cho vấp ngã” để phản ánh σκανδαλίζεται ở thể bị động mà không thêm hình ảnh không có trong nguồn. Đồng thời, “người anh em của bạn” bảo toàn rõ hơn số ít và sở hữu ngôi thứ hai của ὁ ἀδελφός σου. Sự lặp lại gần nghĩa giữa hai động từ “vấp ngã” là có chủ ý, vì nguyên văn cũng đặt hai động từ liên hệ sát nhau nhưng khác thể và không cần bị hòa lẫn.
