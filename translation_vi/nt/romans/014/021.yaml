language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καλὸν τὸ μὴ φαγεῖν κρέα μηδὲ πιεῖν οἶνον μηδὲ ἐν ᾧ ὁ ἀδελφός σου προσκόπτει ⸂ἢ σκανδαλίζεται ἢ ἀσθενεῖ⸃·
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/021.yaml
  text: It is good not to eat meat or drink wine or do anything by which your brother stumbles or is offended or is weakened[a].
translation:
  language: vi
  text: Không ăn thịt, không uống rượu, cũng không làm bất cứ điều gì khiến người anh em của bạn vấp ngã, bị làm cho vấp ngã hoặc suy yếu, ấy là điều tốt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Người anh em” ở đây có thể được hiểu theo nghĩa rộng là người anh em hoặc chị em cùng đức tin.
    reason: Làm rõ rằng danh từ giống đực số ít trong nguyên văn có thể mang ý nghĩa đại diện trong ngữ cảnh.
lexical_decisions:
- source_word: καλὸν
  choice: ấy là điều tốt
  rationale: Diễn đạt sự đánh giá về một cách hành xử là tốt đẹp, thích hợp về mặt đạo đức; đặt cuối câu tự nhiên trong tiếng Việt.
- source_word: τὸ μὴ φαγεῖν κρέα
  choice: không ăn thịt
  rationale: Giữ trực tiếp nội dung của động từ nguyên mẫu có quán từ; κρέα trong ngữ cảnh chỉ thịt dùng làm thức ăn.
- source_word: μηδὲ πιεῖν οἶνον
  choice: không uống rượu
  rationale: μηδέ liên kết hành động kiêng cữ thứ hai; οἶνος được dịch theo nghĩa thông thường là rượu.
- source_word: μηδὲ ἐν ᾧ
  choice: cũng không làm bất cứ điều gì khiến
  rationale: Cụm Hy Lạp có tính tỉnh lược; bổ sung động từ “làm” để câu tiếng Việt hoàn chỉnh, đồng thời giữ phạm vi khái quát của điều có thể gây hại.
- source_word: ὁ ἀδελφός σου
  choice: anh em mình
  rationale: “Anh em” là cách gọi tự nhiên, trang trọng đối với người cùng đức tin trong tiếng Việt; “mình” chuyển tải quan hệ sở hữu ngôi thứ hai theo lối diễn đạt tự nhiên trong mệnh đề khái quát.
- source_word: προσκόπτει
  choice: vấp ngã
  rationale: Giữ hình ảnh ẩn dụ về việc gặp chướng ngại và bị cản trở về phương diện đạo đức hoặc thuộc linh.
- source_word: σκανδαλίζεται
  choice: sa vào cạm bẫy
  rationale: Phân biệt với προσκόπτει và phản ánh sắc thái bị mắc bẫy hay bị dẫn đến chỗ phạm tội của động từ bị động.
- source_word: ἀσθενεῖ
  choice: suy yếu
  rationale: Giữ nét nghĩa trở nên yếu trong bối cảnh lương tâm và đời sống đức tin mà không thêm từ giải thích vào chính văn.
theological_decisions:
- issue: Phạm vi của ὁ ἀδελφός σου
  choice: anh em mình
  alternative: anh chị em cùng đức tin
  rationale: Danh từ Hy Lạp ở giống đực số ít, nhưng trong ngữ cảnh có thể đại diện cho bất cứ người đồng đạo nào. Chính văn dùng cách gọi truyền thống, tự nhiên “anh em”; chú thích nêu rõ phạm vi bao gồm cả nam lẫn nữ.
- issue: Quan hệ giữa προσκόπτει, σκανδαλίζεται và ἀσθενεῖ
  choice: vấp ngã, sa vào cạm bẫy hoặc suy yếu
  alternative: vấp phạm, bị xúc phạm hoặc trở nên yếu đuối
  rationale: Giữ ba vị từ riêng biệt và sự chồng lấn ý nghĩa của chúng, không đồng nhất hóa hai động từ đầu hoặc giới hạn ἀσθενεῖ bằng cách thêm một phạm vi thần học không được nói rõ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cấu trúc liệt kê được giữ gần nguyên văn, còn mệnh đề đánh giá được đặt cuối câu để tiếng Việt tự nhiên. Dùng “sa vào cạm bẫy” nhằm phân biệt σκανδαλίζεται với προσκόπτει mà vẫn bảo tồn hình ảnh đạo đức-thuộc linh.
