  text: Οὐδεὶς γὰρ ἡμῶν ἑαυτῷ ζῇ, καὶ οὐδεὶς ἑαυτῷ ἀποθνῄσκει·
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/007.yaml
  text: For none of us lives for himself[a], and none dies for himself.
translation:
  language: vi
  text: Vì không ai trong chúng ta sống cho chính mình[a], và cũng không ai chết cho chính mình.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đối với chính mình.” Đại từ phản thân ở dữ cách trong tiếng Hy Lạp có thể được dịch sát hơn như vậy; nhưng ở đây có lẽ nói đến việc lấy chính mình làm mục đích sau cùng khi sống hoặc chết.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐδεὶς
  choice: không ai
  rationale: Cách diễn đạt tự nhiên trong tiếng Việt, giữ nguyên sự phủ định phổ quát và làm chủ ngữ cho cả hai vế song song.
- source_word: γὰρ
  choice: Vì
  rationale: Biểu thị quan hệ giải thích với câu trước mà không diễn giải quá mức.
- source_word: ἡμῶν
  choice: trong chúng ta
  rationale: Diễn đạt tự nhiên cấu trúc sở thuộc bộ phận οὐδεὶς ἡμῶν, nghĩa là không một người nào thuộc số chúng ta.
- source_word: ἑαυτῷ
  choice: cho chính mình
  rationale: Truyền đạt hướng quy chiếu hoặc mục đích của việc sống và chết, đồng thời giữ đại từ phản thân và không thêm ý ngoài văn cảnh.
- source_word: ζῇ
  choice: sống
  rationale: Thì hiện tại mang tính khái quát được diễn đạt tự nhiên bằng động từ không đánh dấu thì trong tiếng Việt.
- source_word: καὶ
  choice: và cũng
  rationale: Nối hai mệnh đề song song; “cũng” làm rõ sự tương ứng phủ định tự nhiên trong tiếng Việt.
- source_word: ἀποθνῄσκει
  choice: chết
  rationale: Diễn đạt chân lý khái quát và duy trì thế song song với “sống”.
theological_decisions:
- issue: Ý nghĩa của sở cách phản thân ἑαυτῷ trong cả hai mệnh đề
  choice: cho chính mình
  alternative: đối với chính mình; vì lợi ích riêng của mình
  rationale: Văn cảnh câu 8 đối chiếu việc sống và chết hướng về chính mình với hướng về Chúa. “Cho chính mình” giữ được sắc thái mục đích hoặc quy hướng mà không áp đặt một cách giải nghĩa giáo lý cụ thể.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Cấu trúc hai vế được giữ cân đối; “chính mình” tự nhiên hơn việc ép hình thức giống đực số ít của tiếng Hy Lạp vào tiếng Việt, vốn không đánh dấu giống trong đại từ phản thân này.
