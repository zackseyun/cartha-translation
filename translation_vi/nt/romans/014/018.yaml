id: ROM.14.18
reference: Romans 14:18
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὁ γὰρ ἐν ⸀τούτῳ δουλεύων τῷ Χριστῷ εὐάρεστος τῷ θεῷ καὶ δόκιμος τοῖς ἀνθρώποις.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/018.yaml
  text: For the one who serves the Messiah in this way is pleasing to God and approved by men.
translation:
  language: vi
  text: Vì người nào phục vụ Đấng Christ theo cách ấy thì đẹp lòng Đức Chúa Trời và được người ta công nhận.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: theo cách ấy
  rationale: Cụm từ có thể chỉ cách sống vừa được mô tả trong câu trước; cách dịch này tự nhiên và giữ liên hệ hồi chỉ mà không xác định quá mức τούτῳ là một đức tính riêng lẻ.
- source_word: δουλεύων τῷ Χριστῷ
  choice: phục vụ Đấng Christ
  rationale: δουλεύω diễn tả sự phục vụ với tư cách người thuộc quyền một chủ; trong tiếng Việt hiện đại, “phục vụ” truyền đạt ý chính tự nhiên, còn “Đấng Christ” giữ danh hiệu Χριστός.
- source_word: εὐάρεστος τῷ θεῷ
  choice: đẹp lòng Đức Chúa Trời
  rationale: Thành ngữ tiếng Việt tự nhiên, sát nghĩa về việc được Đức Chúa Trời hài lòng/chấp nhận.
- source_word: δόκιμος τοῖς ἀνθρώποις
  choice: được người ta công nhận
  rationale: δόκιμος mang nghĩa đã được thử nghiệm và được nhìn nhận là đáng chấp nhận; “được người ta công nhận” rõ ràng hơn “được loài người chấp thuận” và τοῖς ἀνθρώποις ở đây chỉ con người nói chung.
theological_decisions:
- issue: Phạm vi của ἐν τούτῳ
  choice: theo cách ấy
  alternative: trong điều này
  rationale: Giữ sự quy chiếu mở về nội dung câu 17—công chính, bình an và vui mừng trong Đức Thánh Linh—thay vì âm thầm giới hạn vào một yếu tố.
- issue: Sắc thái của δόκιμος trước con người
  choice: được người ta công nhận
  alternative: được người ta chấp thuận
  rationale: Không hàm ý rằng sự phán xét của con người là nền tảng cứu rỗi; câu chỉ nói người phục vụ Đấng Christ như vậy được người khác nhìn nhận là đáng tin hoặc đáng chấp nhận.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “người ta” cho τοῖς ἀνθρώποις để bao quát mọi người, không thu hẹp theo giới tính; giữ “Đấng Christ” theo lối gọi quen thuộc trong bản dịch Kinh Thánh tiếng Việt.
