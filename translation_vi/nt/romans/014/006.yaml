reference: Romans 14:6
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὁ φρονῶν τὴν ἡμέραν κυρίῳ ⸀φρονεῖ. καὶ ὁ ἐσθίων κυρίῳ ἐσθίει, εὐχαριστεῖ γὰρ τῷ θεῷ· καὶ ὁ μὴ ἐσθίων κυρίῳ οὐκ ἐσθίει, καὶ εὐχαριστεῖ τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/006.yaml
  text: The one who observes the day[a], observes it for the Lord. And the one who eats, eats for the Lord, for he gives thanks to God; and the one who does not eat, does not eat for the Lord, and he gives thanks to God.
translation:
  language: vi
  text: Ai coi trọng ngày ấy[a] thì làm như vậy vì Chúa. Người ăn thì ăn vì Chúa, vì người ấy tạ ơn Đức Chúa Trời; còn người không ăn thì vì Chúa mà không ăn, và người ấy tạ ơn Đức Chúa Trời.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “để tâm đến ngày ấy” hoặc “xem ngày ấy là quan trọng”; động từ Hy Lạp có thể chỉ việc hướng tâm trí đến hay dành sự coi trọng cho điều gì. Trong văn cảnh này, từ ấy có lẽ nói đến việc tuân giữ một ngày.
    reason: lexical_alternative
lexical_decisions:
- source_word: φρονῶν / φρονεῖ
  choice: coi trọng / coi trọng
  rationale: Động từ φρονέω ở đây nói đến việc dành sự quan tâm và coi một ngày là đáng lưu ý trong thực hành, chứ không chỉ đơn thuần nghĩ về ngày đó. “Coi trọng” tự nhiên trong tiếng Việt và vẫn giữ được độ rộng nghĩa của từ Hy Lạp.
- source_word: τὴν ἡμέραν
  choice: ngày ấy
  rationale: Mạo từ xác định cho thấy đây là ngày đang được bàn đến trong văn cảnh. “Ngày ấy” thể hiện tính xác định mà không tự ý đồng nhất với ngày Sa-bát, ngày lễ hay ngày kiêng ăn.
- source_word: κυρίῳ
  choice: vì Chúa
  rationale: Tặng cách diễn tả sự quy hướng hoặc mục đích của hành động. “Vì Chúa” là cách nói tự nhiên, cho thấy hành động được thực hiện hướng về và vì lợi ích hay sự tôn kính Chúa.
- source_word: ἐσθίων / ἐσθίει
  choice: người ăn / ăn
  rationale: Thì hiện tại diễn tả một thực hành thường lệ trong vấn đề thức ăn đang được tranh luận. Cách dịch đơn giản giữ nguyên tính khái quát và sự song song của câu.
- source_word: εὐχαριστεῖ
  choice: tạ ơn
  rationale: “Tạ ơn” diễn đạt rõ hành động cảm tạ hướng đến Đức Chúa Trời, đồng thời phù hợp với văn phong Kinh Thánh trang trọng nhưng dễ hiểu.
- source_word: τῷ θεῷ
  choice: Đức Chúa Trời
  rationale: Sau động từ “tạ ơn”, tiếng Việt không cần thêm giới từ; đối tượng nhận lời tạ ơn vẫn hoàn toàn rõ ràng. Danh xưng này phân biệt θεός với κύριος trong cùng câu.
- source_word: ὁ μὴ ἐσθίων
  choice: người không ăn
  rationale: Cách dịch trực tiếp cấu trúc phân từ phủ định, giữ thế song song với “người ăn” và không bổ sung lý do hay loại thức ăn mà bản văn không nêu.
theological_decisions:
- issue: Ý nghĩa của việc coi trọng “ngày ấy”
  choice: Giữ cách nói chung về việc coi trọng hoặc tuân giữ một ngày đang được tranh luận trong Rô-ma 14.
  alternative: Xác định cụ thể đó là ngày Sa-bát, ngày lễ Do Thái hoặc ngày kiêng ăn.
  rationale: Phao-lô không xác định ngày nào trong câu này. Bản dịch vì thế không thu hẹp câu theo một cách giải thích lịch sử hay hệ phái.
- issue: Đối tượng được gọi là κύριος
  choice: Chúa
  alternative: Đức Chúa Trời
  rationale: Trong văn cảnh thư Phao-lô, κύριος rất có thể chỉ về Chúa Giê-su, trong khi θεός ở vế kế tiếp được nêu riêng. Giữ hai danh xưng bảo toàn sự phân biệt của bản văn.
- issue: Quan hệ của hành động với Chúa
  choice: Dịch κυρίῳ là “vì Chúa” ở cả các vế, kể cả đảo thành “vì Chúa mà không ăn” để câu tự nhiên.
  alternative: “cho Chúa” hoặc “đối với Chúa”
  rationale: “Vì Chúa” diễn đạt tự nhiên sự quy hướng và động cơ mà không xác quyết quá mức một sắc thái duy nhất của tặng cách.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng và dễ hiểu. Giữ cấu trúc song song giữa người ăn và người không ăn; không xác định ngày hoặc loại thức ăn ngoài điều bản văn nói.
