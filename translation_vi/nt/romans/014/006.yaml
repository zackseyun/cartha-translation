  terminology: Giữ “Chúa” cho κυρίῳ và “Đức Chúa Trời” cho τῷ θεῷ bảo toàn sự phân biệt danh xưng có trong câu. “Coi trọng” là lựa chọn có thể chấp nhận được cho φρονέω; chú thích nêu đúng các khả năng nghĩa và không thu hẹp ngày được nói đến thành Sa-bát, ngày lễ, hay ngày kiêng ăn.
