  verdict: revise
  source_fidelity: 'Bản dịch phản ánh đúng cấu trúc và ý chính của bản Hy Lạp: người coi trọng ngày, người ăn, và người không ăn đều hành động quy hướng về Chúa; cả hai người ăn và không ăn đều tạ ơn Đức Chúa Trời. “Ngày ấy” giữ được tính xác định theo văn cảnh mà không gán đó là một ngày cụ thể. Tuy nhiên, từ “cũng” ở mệnh đề cuối không có đối ứng trực tiếp cần thiết với καί và có thể bỏ để giữ phép lặp song song sát hơn.'
