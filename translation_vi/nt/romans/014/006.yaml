revisions:
- from: Người coi trọng ngày ấy[a] là coi trọng vì Chúa. Người ăn thì ăn vì Chúa, bởi người ấy tạ ơn Đức Chúa Trời; còn người không ăn thì vì Chúa mà không ăn, và người ấy cũng tạ ơn Đức Chúa Trời.
  to: Ai coi trọng ngày ấy[a] thì làm như vậy vì Chúa. Người ăn thì ăn vì Chúa, vì người ấy tạ ơn Đức Chúa Trời; còn người không ăn thì vì Chúa mà không ăn, và người ấy tạ ơn Đức Chúa Trời.
  rationale: Bản sửa chỉ cải thiện độ tự nhiên của câu đầu và loại bỏ “cũng” không cần thiết ở câu cuối. Bản sửa giữ nguyên tính khái quát của “ngày ấy,” sự song song giữa ăn và không ăn, và sự phân biệt giữa Chúa (κυρίῳ) với Đức Chúa Trời (τῷ θεῷ).
