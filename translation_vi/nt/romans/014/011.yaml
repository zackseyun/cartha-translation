id: ROM.14.11
reference: Romans 14:11
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: γέγραπται γάρ· Ζῶ ἐγώ, λέγει κύριος, ὅτι ἐμοὶ κάμψει πᾶν γόνυ, καὶ ⸂πᾶσα γλῶσσα ἐξομολογήσεται⸃ τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/011.yaml
  text: 'For it is written: “As I live[a], says the Lord, every knee will bow to me, and every tongue will confess to God.”'
translation:
  language: vi
  text: 'Vì có lời chép rằng: “Chúa phán: ‘Thật như ta hằng sống, mọi đầu gối sẽ quỳ xuống trước ta, và mọi lưỡi sẽ xưng nhận Đức Chúa Trời[a].’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “nhìn nhận Đức Chúa Trời” hoặc “xưng tụng Đức Chúa Trời.” Động từ Hy Lạp có thể mang sắc thái xưng nhận, nhìn nhận hoặc ca ngợi, tùy ngữ cảnh.
    reason: lexical_alternative
lexical_decisions:
- source_word: γέγραπται
  choice: có lời chép rằng
  rationale: Cách diễn đạt tự nhiên và trang trọng trong tiếng Việt để giới thiệu lời Kinh Thánh đã được ghi chép, đồng thời giữ hiệu lực hiện tại của thể hoàn thành bị động.
- source_word: Ζῶ ἐγώ
  choice: thật như ta hằng sống
  rationale: Diễn đạt sắc thái tuyên thệ long trọng của thành ngữ Hy Lạp, thay vì chỉ phát biểu đơn thuần rằng ‘ta sống’.
- source_word: κύριος
  choice: Chúa
  rationale: Phản ánh trực tiếp κύριος trong bản Hy Lạp, không thay bằng danh xưng dựa trên nguyên bản Hê-bơ-rơ của câu trích dẫn.
- source_word: ἐμοὶ κάμψει πᾶν γόνυ
  choice: mọi đầu gối sẽ quỳ xuống trước ta
  rationale: Giữ hình ảnh cụ thể ‘mọi đầu gối’ và diễn đạt hành động quy phục bằng tiếng Việt tự nhiên; ‘trước ta’ là cách nói phù hợp với động tác quỳ hướng về một đối tượng.
- source_word: πᾶσα γλῶσσα
  choice: mọi lưỡi
  rationale: Giữ nguyên hình ảnh hoán dụ và âm hưởng Kinh Thánh, không diễn giải thành ‘mọi người’.
- source_word: ἐξομολογήσεται
  choice: sẽ xưng nhận
  rationale: Giữ nghĩa công khai tuyên nhận hoặc thừa nhận; chú thích bảo tồn các sắc thái có thể có là nhìn nhận và xưng tụng.
- source_word: τῷ θεῷ
  choice: Đức Chúa Trời
  rationale: Diễn đạt đối tượng của hành động xưng nhận một cách tự nhiên trong tiếng Việt, đồng thời giữ nguyên sự chuyển từ ‘trước ta’ sang ‘Đức Chúa Trời’ trong câu Hy Lạp.
theological_decisions:
- issue: Mối liên hệ giữa ‘Chúa’, ‘ta’ và ‘Đức Chúa Trời’ trong lời trích dẫn
  choice: 'Giữ nguyên sự chuyển đổi trong văn bản: ‘Chúa phán ... trước ta ... xưng nhận Đức Chúa Trời’.'
  alternative: Đổi vế cuối thành ‘xưng nhận ta’, hoặc diễn giải ngay trong bản dịch rằng Chúa ở đây chính là Đức Chúa Trời.
  rationale: Bản Hy Lạp duy trì sự chuyển từ lời phán ngôi thứ nhất sang τῷ θεῷ. Bản dịch không nên làm phẳng cấu trúc ấy hoặc đưa một kết luận thần học tường minh vào câu chữ.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Đại từ ‘ta’ giữ giọng phán uy nghiêm trong lời trích dẫn. Dấu chú thích được đặt ngay sau cụm từ mà chú thích giải thích.
