id: ROM.14.8
reference: Romans 14:8
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐάν τε γὰρ ζῶμεν, τῷ κυρίῳ ζῶμεν, ἐάν τε ἀποθνῄσκωμεν, τῷ κυρίῳ ἀποθνῄσκομεν. ἐάν τε οὖν ζῶμεν ἐάν τε ἀποθνῄσκωμεν, τοῦ κυρίου ἐσμέν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/008.yaml
  text: For if we live[a], we live to the Lord, and if we die, we die to the Lord. So then, whether we live or whether we die[b], we are the Lord’s.
translation:
  language: vi
  text: Vì nếu chúng ta sống, chúng ta sống cho Chúa[a]; nếu chúng ta chết, chúng ta chết cho Chúa. Vậy nên, dù sống hay chết, chúng ta là của Chúa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể hiểu là “chúng ta sống hướng về Chúa”; tương tự với cụm “chúng ta chết cho Chúa”. Dạng diễn đạt Hy Lạp có thể chỉ mối liên hệ, sự quy hướng hoặc lợi ích; “cho Chúa” giữ ý nghĩa tương đối rộng.
    reason: lexical_alternative
  - marker: b
    text: Hay “chúng ta thuộc về Chúa”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐάν τε γὰρ
  choice: Vì nếu
  rationale: “Vì” giữ chức năng giải thích của γάρ và nối câu này với lập luận trước đó; “nếu” diễn đạt tự nhiên cấu trúc điều kiện do ἐάν τε mở đầu.
- source_word: ζῶμεν / ζῶμεν
  choice: chúng ta sống / chúng ta sống
  rationale: Dịch nhất quán động từ ζάω; tiếng Việt không cần biểu thị bằng hình thức khác nhau sự khác biệt giữa thái giả định và thái trình bày trong hai lần xuất hiện.
- source_word: τῷ κυρίῳ
  choice: cho Chúa
  rationale: “Cho Chúa” là cách nói tự nhiên trong tiếng Việt, diễn đạt đời sống và sự chết quy hướng về Chúa, đồng thời không giới hạn ý nghĩa chỉ vào việc phục vụ. Chú thích ghi nhận sắc thái quan hệ rộng của dạng tặng cách Hy Lạp.
- source_word: κύριος
  choice: Chúa
  rationale: Giữ tước hiệu κύριος với sức nặng thần học của nó, không thay bằng một từ nhấn riêng vào quyền làm chủ.
- source_word: ἀποθνῄσκωμεν / ἀποθνῄσκομεν
  choice: chúng ta chết / chúng ta chết
  rationale: Động từ ἀποθνῄσκω ở đây nói khái quát về cái chết; “chết” là cách dịch trực tiếp và tự nhiên.
- source_word: οὖν
  choice: Vậy nên
  rationale: Diễn đạt rõ kết luận được rút ra từ hai vế cân xứng ở trước.
- source_word: τοῦ κυρίου ἐσμέν
  choice: chúng ta vẫn là của Chúa
  rationale: “Là của Chúa” giữ sát cấu trúc sở hữu của nguyên văn. “Vẫn” làm rõ bằng tiếng Việt rằng chân lý ấy không thay đổi trong cả sự sống lẫn sự chết, nhưng không thêm một quan niệm thần học mới.
theological_decisions:
- issue: Đối tượng được gọi là κύριος
  choice: Giữ tước hiệu “Chúa” mà không giải thích thêm ngay trong câu.
  alternative: Nêu đích danh “Chúa Giê-su” hoặc dịch là “Chủ”.
  rationale: Ngữ cảnh gần, đặc biệt câu 9, hướng đến Đấng Christ, nhưng chính câu này chỉ dùng κύριος. “Chúa” bảo toàn cả quy chiếu theo ngữ cảnh lẫn âm hưởng thần học rộng hơn của tước hiệu.
- issue: Sắc thái của việc sống và chết τῷ κυρίῳ
  choice: Dịch “cho Chúa” và chú thích rằng nguyên văn có thể bao hàm sự quy hướng hay mối liên hệ với Chúa.
  alternative: Dịch hẹp thành “để phục vụ Chúa”, “dưới quyền Chúa” hoặc chỉ “hướng về Chúa”.
  rationale: Dạng tặng cách Hy Lạp có thể diễn đạt quan hệ, sự quy hướng hoặc lợi ích; mệnh đề kết “là của Chúa” nhấn mạnh sự thuộc về. Bản dịch không nên thu hẹp toàn bộ ý nghĩa vào một sắc thái duy nhất.
- issue: Ý nghĩa sở hữu trong τοῦ κυρίου ἐσμέν
  choice: “Chúng ta vẫn là của Chúa.”
  alternative: “Chúng ta vẫn thuộc về Chúa.”
  rationale: Cả hai cách đều diễn đạt sự thuộc về; lựa chọn chính giữ gần cấu trúc sở hữu cô đọng của tiếng Hy Lạp, còn cách diễn ý tự nhiên hơn được ghi trong chú thích.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Hai vế sống–chết được giữ cân xứng; “Vậy nên” thể hiện bước suy luận. Đại từ “chúng ta” phù hợp lối diễn đạt cộng đồng của ngôi thứ nhất số nhiều.
