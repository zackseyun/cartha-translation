id: ROM.14.3
reference: Romans 14:3
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὁ ἐσθίων τὸν μὴ ἐσθίοντα μὴ ἐξουθενείτω, ⸂ὁ δὲ⸃ μὴ ἐσθίων τὸν ἐσθίοντα μὴ κρινέτω, ὁ θεὸς γὰρ αὐτὸν προσελάβετο.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/003.yaml
  text: The one who eats must not despise the one who does not eat[a], and the one who does not eat must not judge the one who eats[c][b], for God has welcomed him.
translation:
  language: vi
  text: Người ăn đừng khinh thường[a] người không ăn; còn người không ăn đừng xét đoán[b] người ăn, vì Đức Chúa Trời đã tiếp nhận[c] người ấy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “coi thường” hoặc “xem là không đáng kể”.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “phán xét”. Từ này không nhất thiết mang nghĩa hẹp là “kết án”.'
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể dịch: “đón nhận”. Động từ có thể bao hàm ý đón nhận vào mối thông công. “Người ấy” gần nhất chỉ về người ăn, nhưng trong lập luận đối ứng cũng có thể được hiểu là người cùng đức tin đang bị bên kia xét đoán hoặc khinh thường.'
    reason: lexical_and_referential_ambiguity
lexical_decisions:
- source_word: ὁ ἐσθίων
  choice: người ăn
  rationale: Cụm phân từ hiện tại có mạo từ chỉ một hạng người được nhận diện qua việc ăn; cách dịch ngắn gọn này tự nhiên và giữ nguyên tính khái quát của câu.
- source_word: τὸν μὴ ἐσθίοντα
  choice: người không ăn
  rationale: Giữ sự đối xứng với “người ăn” và không tự thêm rằng người ấy kiêng một số thức ăn hay chỉ ăn rau.
- source_word: ἐξουθενείτω
  choice: đừng khinh thường
  rationale: Động từ diễn tả việc xem người khác là không đáng kể hoặc đối xử với họ bằng thái độ khinh miệt; “khinh thường” truyền đạt rõ sức nặng đạo đức của mệnh lệnh.
- source_word: ὁ δὲ μὴ ἐσθίων
  choice: còn người không ăn
  rationale: “Còn” biểu đạt tự nhiên sắc thái tương phản của δέ và làm nổi bật cấu trúc đối ứng giữa hai nhóm.
- source_word: κρινέτω
  choice: đừng xét đoán
  rationale: Trong ngữ cảnh này, κρίνω nói đến việc phán xét một tín hữu khác. “Xét đoán” giữ nghĩa rộng hơn “kết án” và phù hợp văn phong Kinh Thánh hiện đại.
- source_word: γὰρ
  choice: vì
  rationale: Nêu lý do cho cả hai mệnh lệnh đứng trước một cách tự nhiên trong tiếng Việt.
- source_word: ὁ θεὸς
  choice: Đức Chúa Trời
  rationale: Danh xưng tiếng Việt trang trọng, quen thuộc, tương ứng trực tiếp với chủ ngữ ὁ θεὸς.
- source_word: αὐτὸν
  choice: người ấy
  rationale: Đại từ số ít được diễn đạt tự nhiên và trung tính về giới trong tiếng Việt, đồng thời không buộc câu phải xác định rõ hơn điều bản Hy Lạp để ngỏ.
- source_word: προσελάβετο
  choice: đã tiếp nhận
  rationale: Động từ mang nghĩa đón nhận một người, kể cả vào mối thông công. “Tiếp nhận” vừa giữ chiều kích quan hệ vừa không thu hẹp thành sự chấp thuận đơn thuần.
theological_decisions:
- issue: Phạm vi của sự tương phản giữa ăn và không ăn
  choice: Dịch khái quát là “người ăn” và “người không ăn”.
  alternative: Giải thích trực tiếp là người ăn mọi thứ và người kiêng một số thức ăn.
  rationale: Dù văn cảnh rộng hơn liên quan đến những bất đồng về thức ăn, chính câu này chỉ nói đến ăn và không ăn. Bản dịch không đưa phần giải thích từ văn cảnh vào chính câu.
- issue: Đối tượng của αὐτὸν trong mệnh đề cuối
  choice: Giữ đại từ số ít “người ấy” mà không giải quyết dứt khoát đối tượng quy chiếu.
  alternative: Xác định riêng là người ăn, hoặc diễn đạt bao quát rõ ràng là bất cứ người nào trong hai bên.
  rationale: Tiền ngữ gần nhất là “người ăn”, nhưng lập luận đối ứng có thể được hiểu là áp dụng cho người cùng đức tin mà Đức Chúa Trời đã tiếp nhận. Giữ đại từ số ít bảo tồn sức căng và độ mở của nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cấu trúc đối ứng “người ăn… còn người không ăn…” giữ nhịp lập luận của nguyên văn. Dùng “đừng” thay cho “chớ” để tự nhiên hơn trong tiếng Việt hiện nay, nhưng vẫn giữ lực mệnh lệnh.
