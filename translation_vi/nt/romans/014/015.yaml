id: ROM.14.15
reference: Romans 14:15
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εἰ ⸀γὰρ διὰ βρῶμα ὁ ἀδελφός σου λυπεῖται, οὐκέτι κατὰ ἀγάπην περιπατεῖς. μὴ τῷ βρώματί σου ἐκεῖνον ἀπόλλυε ὑπὲρ οὗ Χριστὸς ἀπέθανεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/015.yaml
  text: For if your brother is grieved because of food[a], you are no longer walking according to love[c][b]. Do not destroy that one with your food—the one for whom Messiah died.
translation:
  language: vi
  text: Vì nếu người anh em của bạn buồn lòng vì thức ăn[a], thì bạn không còn bước đi theo tình yêu thương nữa. Đừng vì thức ăn của bạn mà hủy hoại người ấy[b]—người mà Đấng Mê-si đã chết vì[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hy Lạp được dịch là “người anh em” ở giống đực số ít, nhưng trong ngữ cảnh có thể chỉ một người cùng đức tin, nam hoặc nữ.
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “làm hư hại” hoặc “làm cho hư mất.” Động từ Hy Lạp rất mạnh và có thể chỉ sự tổn hại thuộc linh nghiêm trọng; câu này không nói rõ hệ quả giáo lý chính xác.'
    reason: alternative_reading
  - marker: c
    text: Tiếng Hy Lạp là Christos, một tước hiệu có nghĩa là “Đấng Mê-si” hay “Đấng Được Xức Dầu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: βρῶμα / βρώματι
  choice: thức ăn / vì thức ăn của bạn
  rationale: Danh từ chỉ thức ăn nói chung, không riêng thịt. Ở mệnh đề cấm, cách dịch “vì thức ăn của bạn” diễn đạt tự nhiên phương tiện hoặc nguyên cớ gây hại.
- source_word: ἀδελφός
  choice: anh em của bạn
  rationale: Giữ hình ảnh quan hệ gia đình trong cộng đồng đức tin; tiếng Việt dùng “anh em” tự nhiên hơn “người anh em” trong lời khuyên trực tiếp, dù từ Hy Lạp ở số ít giống đực.
- source_word: λυπεῖται
  choice: buồn lòng
  rationale: Diễn đạt trạng thái đau buồn hoặc khổ tâm do thức ăn gây ra mà không xác định quá mức bản chất của sự tổn thương.
- source_word: κατὰ ἀγάπην
  choice: theo tình yêu thương
  rationale: Phản ánh sát giới từ κατὰ và giữ tình yêu thương làm chuẩn mực đạo đức cho cách sống.
- source_word: περιπατεῖς
  choice: bước đi
  rationale: Giữ nguyên ẩn dụ đạo đức quen thuộc của Phao-lô thay vì làm phẳng thành “sống” hay “cư xử”.
- source_word: ἀπόλλυε
  choice: hủy hoại
  rationale: Giữ sức nặng của lời cảnh báo, đồng thời không buộc động từ phải chỉ riêng sự hư mất đời đời.
- source_word: ἐκεῖνον
  choice: người ấy
  rationale: Diễn đạt tự nhiên trong tiếng Việt và vẫn làm nổi bật chính người đang bị tác động.
- source_word: ὑπὲρ οὗ
  choice: đã chết thay cho
  rationale: ὑπέρ với sở hữu cách có nghĩa “vì, cho, thay cho”; cách dịch này truyền đạt sắc thái đại diện hoặc hy sinh trong ngữ cảnh.
- source_word: Χριστός
  choice: Đấng Mê-si
  rationale: Ở đây Χριστός mang chức năng tước hiệu; “Đấng Mê-si” làm rõ nghĩa tước hiệu trong tiếng Việt.
- source_word: εἰ γὰρ
  choice: Vì nếu
  rationale: Giữ cả quan hệ giải thích của γάρ với lập luận trước và cấu trúc điều kiện của εἰ.
theological_decisions:
- issue: Sức nặng của ἀπόλλυε đối với người có đức tin yếu
  choice: “hủy hoại”, như một lời cảnh báo nghiêm trọng nhưng không xác định hệ quả giáo lý cuối cùng
  alternative: “làm hư hại”, “làm cho hư mất”
  rationale: Câu này không tự nó phân định giữa tổn hại thuộc linh nghiêm trọng và sự hư mất cuối cùng; bản dịch cần giữ nguyên sức nặng và căng thẳng thần học.
- issue: Phạm vi quy chiếu của ἀδελφός
  choice: “anh em của bạn” trong chính văn
  alternative: “anh chị em cùng đức tin”, “người cùng đức tin”
  rationale: Nguyên ngữ là danh từ giống đực số ít nhưng có thể đại diện cho một thành viên trong cộng đồng đức tin; chú thích nêu rõ phạm vi có thể bao gồm cả nam lẫn nữ.
- issue: Cách dịch Χριστός
  choice: Đấng Mê-si
  alternative: Đấng Christ
  rationale: Từ này hoạt động như một tước hiệu trong câu; dịch nghĩa làm rõ tư cách Mê-si mà không biến tước hiệu thành tên riêng.
- issue: Sắc thái của ὑπὲρ οὗ
  choice: “người mà Đấng Mê-si đã chết thay cho”
  alternative: “người mà Đấng Mê-si đã chết vì”
  rationale: “Thay cho” truyền đạt sắc thái đại diện hoặc vì lợi ích của người ấy, nhưng không triển khai thêm một mô hình chuộc tội vượt quá câu văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ ẩn dụ “bước đi”, dùng “tình yêu thương” theo cách nói Kinh Thánh quen thuộc, và đặt các chú thích ngay sau nội dung liên quan.
