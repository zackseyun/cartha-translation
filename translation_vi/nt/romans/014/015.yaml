revisions:
- from: Vì nếu bởi thức ăn mà anh em của bạn buồn lòng[a], thì bạn không còn bước đi theo tình yêu thương nữa. Đừng vì thức ăn của bạn mà hủy hoại người ấy[b]—người mà Đấng Mê-si đã chết thay cho[c].
  to: Vì nếu người anh em của bạn buồn lòng vì thức ăn[a], thì bạn không còn bước đi theo tình yêu thương nữa. Đừng vì thức ăn của bạn mà hủy hoại người ấy[b]—người mà Đấng Mê-si đã chết vì[c].
  rationale: Sửa “anh em của bạn” thành “người anh em của bạn” để phản ánh rõ số ít và tăng độ tự nhiên. Sửa “đã chết thay cho” thành “đã chết vì” để dịch ὑπέρ một cách chính xác, vẫn giữ sắc thái chết vì lợi ích của người ấy nhưng không áp đặt một cách hiểu thay thế cụ thể. Các chú thích được cập nhật đầy đủ để khớp với chính văn.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T18:09:27Z'
review_pass:
  verdict: revise
  source_fidelity: Bản dịch truyền đạt đúng cấu trúc điều kiện, sự đau buồn vì thức ăn, chuẩn mực yêu thương, và mệnh lệnh mạnh mẽ của ἀπόλλυε. Tuy nhiên, “đã chết thay cho” diễn giải ὑπὲρ οὗ theo hướng thay thế cụ thể hơn điều câu này buộc phải nói. “Đã chết vì” bảo toàn nghĩa ‘vì/lợi ích của’ mà không quyết định mô hình thần học.
  naturalness: “Anh em của bạn” trong tiếng Việt thường gợi một tập hợp hoặc quan hệ xưng hô; với số ít ὁ ἀδελφός σου, “người anh em của bạn” rõ và tự nhiên hơn. Các phần còn lại có văn phong hiện đại, trang trọng, và dễ hiểu.
  terminology: “Đấng Mê-si,” “tình yêu thương,” “bước đi,” và “hủy hoại” phù hợp với thuật ngữ và giữ được sắc thái của nguyên ngữ. Chú thích về ‘anh em’ và động từ ‘hủy hoại’ hữu ích; chú thích về Χριστός phù hợp với cách dịch tước hiệu.
  issues:
  - severity: medium
    issue: “đã chết thay cho” đối với ὑπὲρ οὗ
    rationale: Ὑπέρ với sở hữu cách có thể diễn tả ‘vì, vì lợi ích của, cho’; trong câu này không cần phải xác định riêng nghĩa thay thế. “Thay cho” có thể áp đặt một diễn giải chuộc tội hẹp hơn nguyên văn.
  - severity: low
