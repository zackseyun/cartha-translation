revisions:
- from: 'Hãy làm điều ấy, vì anh em biết thời điểm này: đã đến giờ anh em[a] thức dậy khỏi giấc ngủ, bởi hiện nay sự cứu rỗi của chúng ta đã gần hơn so với khi chúng ta tin[b].'
  to: 'Hãy làm điều ấy, vì anh em biết thời điểm: đã đến giờ anh em[a] thức dậy khỏi giấc ngủ; vì hiện nay sự cứu rỗi của chúng ta đã gần hơn so với khi chúng ta tin[b].'
  rationale: Sửa “thời điểm này” thành “thời điểm” để tránh thêm ý, và chuyển neo chú thích b đến đúng cụm “khi chúng ta tin”. Các lựa chọn còn lại được giữ vì trung thành với SBLGNT và tự nhiên trong tiếng Việt hiện đại.
