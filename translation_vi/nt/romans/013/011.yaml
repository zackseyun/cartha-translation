id: ROM.13.11
reference: Romans 13:11
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Καὶ τοῦτο εἰδότες τὸν καιρόν, ὅτι ὥρα ⸂ἤδη ὑμᾶς⸃ ἐξ ὕπνου ἐγερθῆναι, νῦν γὰρ ἐγγύτερον ἡμῶν ἡ σωτηρία ἢ ὅτε ἐπιστεύσαμεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/011.yaml
  text: And do this[a], knowing the time, that it is already the hour for you to awaken from sleep[b], for now our salvation is nearer than when we believed.
translation:
  language: vi
  text: 'Hãy làm điều ấy, vì anh em biết thời điểm: đã đến giờ anh em[a] thức dậy khỏi giấc ngủ; vì hiện nay sự cứu rỗi của chúng ta đã gần hơn so với khi chúng ta tin[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Một số thủ bản chép “chúng ta” thay cho “anh em”.
    reason: textual_variant
  - marker: b
    text: 'Cũng có thể dịch: “so với khi chúng ta bắt đầu tin.” Tiếng Hy Lạp chỉ nói “khi chúng ta tin”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ τοῦτο
  choice: Hãy làm điều ấy
  rationale: Trong ngữ cảnh, τοῦτο chỉ về những lời khuyên đạo đức ở các câu trước; thêm động từ mệnh lệnh hàm ẩn giúp câu tiếng Việt tự nhiên mà không thêm ý mới.
- source_word: εἰδότες τὸν καιρόν
  choice: vì anh em biết thời điểm này
  rationale: Phân từ εἰδότες có sắc thái nguyên nhân trong ngữ cảnh. καιρός chỉ thời điểm có ý nghĩa quyết định, không đơn thuần là thời gian theo niên biểu.
- source_word: ὅτι ὥρα ἤδη
  choice: đã đến giờ
  rationale: Cách nói tự nhiên này giữ được tính cấp bách của ὥρα và ý nghĩa hiện tại, đã xảy đến, của ἤδη.
- source_word: ὑμᾶς
  choice: anh em
  rationale: Bản văn SBLGNT dùng đại từ ngôi thứ hai số nhiều; “anh em” biểu đạt rõ số nhiều và phù hợp lối xưng hô của thư tín.
- source_word: ἐξ ὕπνου ἐγερθῆναι
  choice: thức dậy khỏi giấc ngủ
  rationale: Giữ nguyên hình ảnh ẩn dụ về việc ra khỏi trạng thái ngủ bằng lối diễn đạt hiện đại, dễ hiểu.
- source_word: νῦν γὰρ
  choice: bởi hiện nay
  rationale: “Bởi” thể hiện chức năng nêu lý do của γάρ, còn “hiện nay” thể hiện νῦν.
- source_word: ἐγγύτερον ἡμῶν ἡ σωτηρία
  choice: sự cứu rỗi của chúng ta đã gần hơn
  rationale: Giữ ý so sánh của ἐγγύτερον và không thu hẹp σωτηρία vào một giai đoạn thần học cụ thể.
- source_word: ἢ ὅτε ἐπιστεύσαμεν
  choice: so với khi chúng ta tin
  rationale: Bám sát động từ ἐπιστεύσαμεν; không thêm “ban đầu” hay “lần đầu”, vì những ý ấy không được nói rõ trong tiếng Hy Lạp.
theological_decisions:
- issue: Sự cứu rỗi được nói là đang đến gần hơn dù thuộc về những người đã tin
  choice: sự cứu rỗi của chúng ta
  alternative: sự cứu rỗi cuối cùng của chúng ta; sự giải cứu khi Chúa trở lại
  rationale: Giữ nguyên sự căng thẳng cánh chung giữa phương diện đã thuộc về tín hữu và phương diện vẫn đang đến gần, không tự ý quy định một giai đoạn giáo lý riêng biệt.
translation_notes:
  register: Văn phong tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. “Anh em” giữ lối xưng hô cộng đồng của thư tín; cấu trúc câu được điều chỉnh vừa đủ để tự nhiên trong tiếng Việt.
