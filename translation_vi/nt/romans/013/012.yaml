id: ROM.13.12
reference: Romans 13:12
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἡ νὺξ προέκοψεν, ἡ δὲ ἡμέρα ἤγγικεν. ⸀ἀποβαλώμεθα οὖν τὰ ἔργα τοῦ σκότους, ⸂ἐνδυσώμεθα δὲ⸃ τὰ ὅπλα τοῦ φωτός.
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/012.yaml
  text: The night is far gone[a]; the day has drawn near[b]. Therefore let us cast off the works of darkness and put on the armor of light.
translation:
  language: vi
  text: Đêm đã gần tàn[a], ngày đã đến gần. Vậy, chúng ta hãy vứt bỏ những việc làm của bóng tối và mặc lấy khí giới của ánh sáng.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Đêm đã tiến xa”, nghĩa là đêm đã trôi qua phần lớn.'
    reason: lexical_alternative
  - marker: b
    text: “Khí giới” cũng có thể dịch là “vũ khí”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡ νὺξ
  choice: đêm
  rationale: Giữ nguyên hình ảnh thời gian đối lập với “ngày”, không diễn giải trực tiếp thành thời đại gian ác hay bóng tối đạo đức.
- source_word: προέκοψεν
  choice: đã gần tàn
  rationale: Động từ theo nghĩa đen chỉ sự tiến tới. Trong cách nói tự nhiên của tiếng Việt về đêm, “đã gần tàn” truyền đạt rằng đêm đã trôi qua phần lớn, đồng thời giữ hướng vận động của ẩn dụ.
- source_word: ἡ ἡμέρα
  choice: ngày
  rationale: Dịch sát để bảo toàn sự đối lập vừa mang tính thời gian vừa mang ý nghĩa đạo đức và cánh chung với “đêm”.
- source_word: ἤγγικεν
  choice: đã đến gần
  rationale: Thể hoàn thành diễn tả một sự tiến đến dẫn tới trạng thái hiện tại; “đã đến gần” thể hiện được cả chuyển động lẫn kết quả hiện thời.
- source_word: ἀποβαλώμεθα
  choice: chúng ta hãy vứt bỏ
  rationale: Lối khuyến giục ở ngôi thứ nhất số nhiều. “Vứt bỏ” sống động, tự nhiên và phù hợp với hình ảnh cởi bỏ đối xứng với “mặc lấy”.
- source_word: τὰ ἔργα
  choice: những việc làm
  rationale: “Việc làm” là cách diễn đạt tự nhiên trong tiếng Việt và giữ nghĩa đạo đức của ἔργα mà không thêm sự diễn giải.
- source_word: τοῦ σκότους
  choice: của bóng tối
  rationale: Giữ nguyên sở hữu cách và hình ảnh đạo đức, không thu hẹp thành “điều ác”.
- source_word: ἐνδυσώμεθα
  choice: mặc lấy
  rationale: Giữ hình ảnh mặc trang phục và tạo thế đối xứng rõ với “vứt bỏ”.
- source_word: τὰ ὅπλα
  choice: khí giới
  rationale: Ὅπλα có thể chỉ vũ khí hoặc trang bị chiến đấu. “Khí giới” giữ được sắc thái quân sự và đủ rộng để phù hợp với động từ “mặc lấy”, trong khi chú thích nêu cách hiểu “vũ khí”.
- source_word: τοῦ φωτός
  choice: của ánh sáng
  rationale: Dịch sát để bảo toàn sự đối lập với bóng tối và không giải thích quá mức ý nghĩa đạo đức hay cánh chung.
theological_decisions:
- issue: Ẩn dụ cánh chung về đêm và ngày
  choice: Giữ nguyên các hình ảnh “đêm” và “ngày”, với cách nói tự nhiên “đêm đã gần tàn”.
  alternative: Diễn giải thành “thời đại tối tăm sắp qua” và “thời đại mới sắp đến”.
  rationale: Bản Hy Lạp để cho hình ảnh đồng thời mang chiều kích thời gian, đạo đức và lịch sử cứu rỗi. Dịch theo lối diễn giải sẽ giải quyết sự đa nghĩa thay vì bảo toàn nó.
- issue: Ý nghĩa của ὅπλα τοῦ φωτός
  choice: “khí giới của ánh sáng” trong chính văn.
  alternative: “vũ khí của ánh sáng” hoặc “áo giáp của ánh sáng”.
  rationale: “Khí giới” là từ bao quát cho trang bị chiến đấu, phù hợp với “mặc lấy” mà không giới hạn vào vũ khí tấn công hay chỉ riêng áo giáp. Chú thích bảo lưu cách hiểu thông dụng là “vũ khí”.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Nhịp câu ngắn và đối xứng giúp giữ sức mạnh khuyến giục của nguyên văn. Dùng “chúng ta hãy” để thể hiện rõ lời khuyến giục bao gồm cả người viết lẫn người đọc.
