  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἡ ἀγάπη τῷ πλησίον κακὸν οὐκ ἐργάζεται· πλήρωμα οὖν νόμου ἡ ἀγάπη.
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/010.yaml
  text: Love does no harm to a neighbor[b][a]; therefore love is the fulfillment of the law.
translation:
  language: vi
  text: Tình yêu thương không gây hại cho người lân cận[a]; vì thế, tình yêu thương là sự làm trọn luật pháp[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “không làm điều ác cho người lân cận.”'
    reason: lexical_alternative
  - marker: b
    text: 'Hoặc: “là sự trọn vẹn của luật pháp.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγάπη
  choice: tình yêu thương
  rationale: Cách diễn đạt tự nhiên, trang trọng trong tiếng Việt, chỉ tình yêu được thể hiện trong cách đối xử với người khác; được lặp lại để giữ sự nhấn mạnh của nguyên văn.
- source_word: τῷ πλησίον
  choice: cho người lân cận
  rationale: Diễn đạt người chịu tác động của hành vi và giữ nghĩa khái quát về người ở bên cạnh mình, không giới hạn vào người sống gần nhà.
- source_word: κακὸν οὐκ ἐργάζεται
  choice: không gây hại
  rationale: Trong ngữ cảnh đạo đức này, cụm từ nói đến việc không làm hay tạo ra điều xấu gây tổn hại cho người khác. Cách dịch này tự nhiên trong tiếng Việt, còn nghĩa sát chữ được ghi ở chú thích.
- source_word: οὖν
  choice: vì thế
  rationale: Thể hiện rõ kết luận được rút ra từ mệnh đề trước bằng cách nối câu tự nhiên trong tiếng Việt.
- source_word: πλήρωμα
  choice: sự làm trọn
  rationale: Danh từ này chỉ điều đưa luật pháp đến chỗ trọn vẹn hay hoàn tất. “Sự làm trọn” giữ cấu trúc danh từ của câu Hy Lạp và mối liên hệ thần học mà không chuyển thành câu mệnh lệnh.
- source_word: νόμου
  choice: luật pháp
  rationale: Trong văn cảnh, từ này chỉ luật pháp đã được nhắc đến như một thực tại xác định; “luật pháp” là cách gọi quen thuộc và trang trọng trong tiếng Việt.
theological_decisions:
- issue: Mối liên hệ giữa tình yêu thương và luật pháp
  choice: tình yêu thương là sự làm trọn luật pháp
  alternative: tình yêu thương làm trọn luật pháp; tình yêu thương là sự trọn vẹn của luật pháp
  rationale: Nguyên văn là một mệnh đề danh từ, khẳng định tình yêu thương chính là πλήρωμα của luật pháp. Cách dịch giữ hình thức và sức nặng của lời khẳng định, đồng thời không giải thích thêm tình yêu thương hoàn tất từng điều răn như thế nào.
translation_notes:
  register: Tiếng Việt hiện đại, rõ ràng và trang trọng. “Tình yêu thương” được dùng nhất quán ở cả hai vị trí; “người lân cận” giữ sắc thái đạo đức rộng hơn nghĩa chỉ người hàng xóm. Các dấu chú thích xuất hiện ngay sau những cụm từ liên quan.
