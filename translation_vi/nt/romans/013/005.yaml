lexical_decisions:
- source_word: διὸ
  choice: Vì vậy
  rationale: Liên từ suy luận, rút ra kết luận từ lập luận ngay trước đó về các nhà cầm quyền.
- source_word: ἀνάγκη
  choice: cần phải
  rationale: Diễn đạt tự nhiên cấu trúc vô nhân xưng chỉ sự cần thiết, đồng thời giữ nguyên sức nặng bắt buộc của câu Hy Lạp.
- source_word: ὑποτάσσεσθαι
  choice: thuận phục
  rationale: Động từ nguyên mẫu hiện tại dạng trung động/thụ động nói về tư thế đặt mình dưới thẩm quyền; “thuận phục” trang trọng, dễ hiểu và không đồng nhất khái niệm này với sự vâng lời tuyệt đối.
- source_word: οὐ μόνον … ἀλλὰ καὶ
  choice: không chỉ … mà còn
  rationale: Cặp liên từ tương ứng tự nhiên trong tiếng Việt, giữ rõ quan hệ bổ sung và nhấn mạnh.
- source_word: διὰ τὴν ὀργὴν
  choice: vì cơn thịnh nộ
  rationale: διά với đối cách chỉ nguyên nhân hoặc động cơ. Cách dịch sát “cơn thịnh nộ” giữ mở việc từ này nói đến hành động trừng phạt của nhà cầm quyền hay cơn thịnh nộ của Đức Chúa Trời được thi hành qua thẩm quyền dân sự.
- source_word: διὰ τὴν συνείδησιν
  choice: vì lương tâm
  rationale: Giữ cấu trúc song song với vế trước và diễn đạt lương tâm như một động cơ nội tại cho sự thuận phục.
theological_decisions:
- issue: Chủ thể của ὀργή (cơn thịnh nộ)
  choice: Giữ nguyên “cơn thịnh nộ” mà không xác định chủ thể
  alternative: sự trừng phạt của nhà cầm quyền; cơn thịnh nộ của Đức Chúa Trời
  rationale: Ngữ cảnh nói cả về sự sắp đặt của Đức Chúa Trời lẫn nhà cầm quyền cầm gươm để thi hành hình phạt; bản Hy Lạp tại câu này không nêu rõ chủ thể, nên bản dịch bảo toàn sự mơ hồ thật sự.
- issue: Sắc thái của ὑποτάσσεσθαι đối với nhà cầm quyền
  choice: thuận phục
  alternative: chịu phục; ở dưới quyền
  rationale: “Thuận phục” diễn đạt tư thế được đòi hỏi đối với thẩm quyền mà không tự ý mở rộng thành giáo lý về sự vâng lời tuyệt đối.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “thuận phục” để giữ sắc thái quan hệ với thẩm quyền; dùng “cơn thịnh nộ” thay vì diễn giải ngay thành “hình phạt” nhằm bảo toàn tính đa nghĩa của nguyên văn.
