    rationale: Neo chú thích phải gắn trực tiếp với từ/cụm từ mà chú thích giải thích. Nội dung về phương án “ở dưới quyền” cần được gắn với ὑποτάσσεσθαι/“thuận phục”; phương án “sự trừng phạt” cần được gắn với ὀργή/“cơn thịnh nộ”.
  - severity: low
