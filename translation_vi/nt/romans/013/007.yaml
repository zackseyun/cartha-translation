source:
  edition: SBLGNT
  text: ⸀ἀπόδοτε πᾶσι τὰς ὀφειλάς, τῷ τὸν φόρον τὸν φόρον, τῷ τὸ τέλος τὸ τέλος, τῷ τὸν φόβον τὸν φόβον, τῷ τὴν τιμὴν τὴν τιμήν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/007.yaml
  text: 'Pay to all what is owed: to the one due tax, tax; to the one due revenue, revenue; to the one due fear, fear; to the one due honor, honor.'
translation:
  language: vi
  text: 'Hãy trả cho mọi người những gì mình mắc nợ: ai được nộp thuế thì nộp thuế cho người ấy; ai được nộp thuế phí thì nộp thuế phí cho người ấy; ai đáng kính sợ thì kính sợ; ai đáng kính trọng thì kính trọng.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπόδοτε
  choice: Hãy trả
  rationale: Động từ mang nghĩa trao trả hoặc thực hiện điều đang mắc nợ; cách dịch này giữ sắc thái mệnh lệnh và liên kết trực tiếp với τὰς ὀφειλάς.
- source_word: φόρον
  choice: thuế
  rationale: Chỉ loại thuế trực tiếp hoặc cống nộp cho chính quyền; “thuế” là từ hiện đại, tự nhiên và đủ rộng.
- source_word: τέλος
  choice: lệ phí
  rationale: Phân biệt với φόρος; từ này có thể chỉ thuế gián tiếp, thuế quan hoặc khoản thu phải nộp. “Lệ phí” giữ được sự phân biệt trong tiếng Việt, dù không bao quát hết mọi sắc thái.
- source_word: φόβον
  choice: kính sợ
  rationale: Giữ yếu tố “sợ” thật sự của φόβος nhưng diễn đạt tự nhiên trong ngữ cảnh thái độ đúng mực đối với người có thẩm quyền; không làm nhẹ thành chỉ “tôn trọng”.
- source_word: τιμήν
  choice: kính trọng
  rationale: Diễn đạt sự tôn kính, coi trọng dành cho người đáng nhận; phân biệt với φόβος.
theological_decisions:
- issue: Sắc thái của φόβος đối với nhà cầm quyền
  choice: kính sợ
  alternative: tôn trọng
  rationale: Bản Hy Lạp dùng φόβος, mạnh hơn sự tôn trọng đơn thuần. “Kính sợ” bảo toàn sức nặng và sự căng thẳng của câu mà không nhất thiết hàm ý khiếp đảm.
- issue: Phạm vi của πᾶσι
  choice: mọi người
  alternative: mọi người có thẩm quyền
  rationale: Giữ cách nói rộng của nguyên văn. Văn cảnh xác định các nghĩa vụ cụ thể, nhưng câu không minh nhiên giới hạn πᾶσι chỉ vào giới cầm quyền.
translation_notes:
  register: Văn phong mệnh lệnh trang trọng nhưng dễ hiểu. Cấu trúc lặp được giữ để tái hiện nhịp điệu nhấn mạnh của nguyên văn; “thuế” và “lệ phí” được dùng nhằm bảo tồn sự phân biệt giữa φόρος và τέλος.
