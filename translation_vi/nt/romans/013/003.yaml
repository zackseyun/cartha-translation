id: ROM.13.3
reference: Romans 13:3
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οἱ γὰρ ἄρχοντες οὐκ εἰσὶν φόβος ⸂τῷ ἀγαθῷ ἔργῳ⸃ ἀλλὰ ⸂τῷ κακῷ⸃. θέλεις δὲ μὴ φοβεῖσθαι τὴν ἐξουσίαν; τὸ ἀγαθὸν ποίει, καὶ ἕξεις ἔπαινον ἐξ αὐτῆς·
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/003.yaml
  text: For rulers are not a terror to good conduct[a], but to bad. But if you do not want to fear the authority, do what is good[c][b], and you will have praise from it.
translation:
  language: vi
  text: Vì người cầm quyền không gây sợ hãi cho người làm điều lành, nhưng cho người làm điều ác.[a] Nhưng bạn có muốn không sợ chính quyền không? Hãy làm điều lành, rồi bạn sẽ được chính quyền khen ngợi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “không phải là điều đáng sợ đối với việc lành, nhưng đối với việc ác.” Tiếng Hy Lạp đối lập việc lành với việc ác theo nghĩa đạo đức tổng quát.'
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn: “bạn sẽ có lời khen từ chính quyền ấy.”'
    reason: translation_clarity
lexical_decisions:
- source_word: ἄρχοντες
  choice: những người cầm quyền
  rationale: Chỉ những người cai trị hoặc giữ chức vụ quản trị; cách dịch này giữ số nhiều và không xác định quá mức một chức danh cụ thể.
- source_word: φόβος
  choice: nỗi kinh sợ
  rationale: Danh từ làm vị ngữ, chỉ điều hoặc nguyên nhân gây sợ hãi; “nỗi kinh sợ” giữ được hình ảnh cụ thể của câu Hy Lạp.
- source_word: τῷ ἀγαθῷ ἔργῳ … τῷ κακῷ
  choice: đối với việc lành … đối với việc ác
  rationale: Giữ sự đối lập đạo đức tổng quát giữa điều tốt và điều xấu, đồng thời phản ánh ἔργῳ số ít mà không giới hạn vào một hành vi riêng lẻ.
- source_word: θέλεις δὲ μὴ φοβεῖσθαι
  choice: Vậy, bạn có muốn khỏi phải sợ … không?
  rationale: Giữ nguyên cấu trúc câu hỏi tu từ của bản Hy Lạp; “khỏi phải sợ” diễn đạt tự nhiên ý muốn không sợ.
- source_word: τὴν ἐξουσίαν
  choice: nhà chức trách
  rationale: Trong ngữ cảnh chính quyền dân sự, từ này chỉ cơ quan hoặc người thực thi thẩm quyền cai trị; “nhà chức trách” tự nhiên trong tiếng Việt và giữ nghĩa thể chế.
- source_word: τὸ ἀγαθὸν ποίει
  choice: Hãy làm điều lành
  rationale: Tính từ có mạo từ được dùng như danh từ, chỉ điều tốt về mặt đạo đức; cách dịch này ngắn gọn và tự nhiên.
- source_word: ἕξεις ἔπαινον ἐξ αὐτῆς
  choice: bạn sẽ được nhà chức trách ấy khen ngợi
  rationale: Chuyển cấu trúc sát chữ “sẽ có lời khen từ đó” thành câu bị động tự nhiên trong tiếng Việt, đồng thời nói rõ đại từ giống cái αὐτῆς quy chiếu về ἐξουσία.
theological_decisions:
- issue: Phạm vi lời khẳng định về người cầm quyền và sự khen ngợi
  choice: Dịch như lời mô tả chức năng thông thường của nhà cầm quyền, không thêm từ ngữ biến câu này thành sự bảo chứng tuyệt đối cho mọi hành động của mọi chính quyền.
  alternative: Hiểu như lời khẳng định tuyệt đối rằng mọi người cầm quyền luôn trừng phạt điều ác và khen thưởng điều lành; hoặc thêm sắc thái mỉa mai hay chống đối.
  rationale: Bản văn trực tiếp nêu sự tương phản giữa việc lành và việc ác cùng phản ứng của thẩm quyền. Bản dịch giữ nguyên sức căng của lời khẳng định mà không đưa vào sự tuyệt đối hóa hay sắc thái mỉa mai không có dấu hiệu rõ trong câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “bạn” để phản ánh ngôi thứ hai số ít mang tính khái quát, tránh “ngươi” cổ kính và không thêm “anh em” vốn không có trong câu Hy Lạp. “Nhà chức trách” giúp phân biệt ἐξουσία với số nhiều ἄρχοντες nhưng vẫn phù hợp ngữ cảnh chính quyền.
