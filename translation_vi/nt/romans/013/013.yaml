id: ROM.13.13
reference: Romans 13:13
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὡς ἐν ἡμέρᾳ εὐσχημόνως περιπατήσωμεν, μὴ κώμοις καὶ μέθαις, μὴ κοίταις καὶ ἀσελγείαις, μὴ ἔριδι καὶ ζήλῳ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/013.yaml
  text: Let us walk properly as in the daytime[a], not in revelries and drunkenness, not in sexual immorality and sensuality[b], not in strife and jealousy.
translation:
  language: vi
  text: Hãy sống[a] đoan chính như giữa ban ngày, không chè chén và say sưa, không gian dâm và phóng túng, không tranh chấp và ghen ghét[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “Hãy bước đi,” một cách nói chỉ nếp sống hay cách ăn ở.'
    reason: idiom
  - marker: b
    text: Hay “đố kỵ”; từ Hy Lạp có thể chỉ sự ghen tuông hoặc lòng đố kỵ, và tại đây mang nghĩa tiêu cực.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς ἐν ἡμέρᾳ
  choice: như giữa ban ngày
  rationale: Giữ nguyên hình ảnh ngày/đêm trong văn cảnh, đồng thời diễn đạt tự nhiên bằng tiếng Việt.
- source_word: εὐσχημόνως
  choice: đoan chính
  rationale: Diễn tả cách cư xử đứng đắn, đáng trọng; phù hợp văn phong trang trọng nhưng vẫn dễ hiểu.
- source_word: περιπατήσωμεν
  choice: Hãy sống
  rationale: Động từ nghĩa đen là “bước đi” nhưng thường được Phao-lô dùng như ẩn dụ chỉ nếp sống; dịch theo nghĩa giúp câu tiếng Việt tự nhiên. Chú thích giữ lại hình ảnh nguyên văn.
- source_word: κώμοις
  choice: chè chén
  rationale: Chỉ những cuộc vui náo loạn, thường gắn với ăn uống quá độ; “chè chén” tự nhiên và không thu hẹp từ này vào hành vi tình dục.
- source_word: μέθαις
  choice: say sưa
  rationale: Chỉ tình trạng hoặc những dịp uống đến say; kết hợp tự nhiên với “chè chén”.
- source_word: κοίταις
  choice: gian dâm
  rationale: Nghĩa đen là “giường chiếu,” nhưng trong ngữ cảnh này là lối nói chỉ quan hệ tình dục bất chính; dịch theo nghĩa để tránh tối nghĩa.
- source_word: ἀσελγείαις
  choice: phóng túng
  rationale: Chỉ hành vi buông thả, trơ trẽn và không kiềm chế, thường mang sắc thái tình dục nhưng không chỉ giới hạn ở đó.
- source_word: ἔριδι
  choice: tranh chấp
  rationale: Diễn tả sự bất hòa và đối đầu do tinh thần hiếu tranh.
- source_word: ζήλῳ
  choice: ghen ghét
  rationale: Trong danh sách thói xấu, từ này mang nghĩa tiêu cực là ghen tuông hoặc đố kỵ; “ghen ghét” tự nhiên và đủ rộng trong tiếng Việt.
theological_decisions:
- issue: Hình ảnh ẩn dụ về ban ngày trong lời khuyên đạo đức
  choice: Giữ hình ảnh “như giữa ban ngày” mà không diễn giải thêm.
  alternative: Sống như thể đang ở ban ngày; sống trong ánh sáng ban ngày.
  rationale: Câu này thuộc phép tương phản ngày/đêm của văn cảnh. Bản dịch giữ sức gợi của hình ảnh mà không biến nó thành một khẳng định giáo lý chi tiết hơn nguyên văn.
- issue: Lối nói tình dục trong κοίταις
  choice: Dịch theo nghĩa là “gian dâm.”
  alternative: Giường chiếu; quan hệ tình dục bất chính.
  rationale: Nghĩa đen “giường chiếu” sẽ mơ hồ trong tiếng Việt, còn ngữ cảnh cho thấy rõ từ này nói đến hành vi tình dục bất chính.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Nhịp ba cặp “không...” của nguyên văn được giữ lại; các thuật ngữ chỉ thói xấu được chọn sao cho rõ nghĩa mà không thô tục hoặc thu hẹp quá mức.
