id: ROM.13.6
reference: Romans 13:6
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: διὰ τοῦτο γὰρ καὶ φόρους τελεῖτε, λειτουργοὶ γὰρ θεοῦ εἰσιν εἰς αὐτὸ τοῦτο προσκαρτεροῦντες.
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/006.yaml
  text: For because of this you also pay taxes, for they are God’s ministers, devoting themselves to this very thing.
translation:
  language: vi
  text: Cũng vì lý do đó mà anh chị em nộp thuế, vì họ là những người phục vụ Đức Chúa Trời, chuyên tâm làm chính việc này.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φόρους τελεῖτε
  choice: nộp thuế
  rationale: Diễn đạt tự nhiên hành động thực hiện nghĩa vụ thuế; φόρος trong ngữ cảnh chỉ sắc thuế nộp cho nhà cầm quyền.
- source_word: λειτουργοὶ θεοῦ
  choice: những người phục vụ Đức Chúa Trời
  rationale: Giữ nghĩa rộng của λειτουργοί là người thi hành công vụ hoặc phục vụ, tránh khiến độc giả mặc nhiên hiểu đây là chức vụ giáo hội.
- source_word: προσκαρτεροῦντες
  choice: chuyên tâm làm
  rationale: Thể hiện ý kiên trì, tận tụy dành mình cho một nhiệm vụ đang được nói đến.
- source_word: εἰς αὐτὸ τοῦτο
  choice: chính việc này
  rationale: Giữ sự nhấn mạnh của αὐτό và quy chiếu có chủ ý khá rộng theo nguyên văn.
theological_decisions:
- issue: Nhà cầm quyền được gọi là λειτουργοὶ θεοῦ
  choice: những người phục vụ Đức Chúa Trời
  alternative: các tôi tớ của Đức Chúa Trời
  rationale: Bản dịch giữ nguyên mối liên hệ với Đức Chúa Trời nhưng không làm từ ngữ mang sắc thái chức sắc tôn giáo hay hàm ý sự công chính cá nhân của họ.
- issue: Đối tượng của động từ ngôi thứ hai số nhiều
  choice: anh chị em
  alternative: các bạn
  rationale: Dùng cách xưng hô cộng đồng tự nhiên, trang trọng và bao quát trong thư tín, không thêm phân biệt giới tính mà nguyên văn không nhấn mạnh.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cấu trúc nhân quả lặp lại của γάρ được thể hiện bằng “vì… vì…”, còn trật tự câu được điều chỉnh vừa đủ cho tiếng Việt tự nhiên.
