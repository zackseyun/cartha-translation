id: ROM.13.1
reference: Romans 13:1
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Πᾶσα ψυχὴ ἐξουσίαις ὑπερεχούσαις ὑποτασσέσθω, οὐ γὰρ ἔστιν ἐξουσία εἰ μὴ ὑπὸ θεοῦ, αἱ δὲ ⸀οὖσαι ⸀ὑπὸ θεοῦ τεταγμέναι εἰσίν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/001.yaml
  text: Let every person be subject to the governing authorities[a], for there is no authority except from God[b], and those that exist have been appointed by God.
translation:
  language: vi
  text: Mỗi người phải thuận phục các nhà cầm quyền[a], vì không có quyền cai trị nào mà không do Đức Chúa Trời; còn những nhà cầm quyền hiện có đều đã được Đức Chúa Trời sắp đặt[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “các thẩm quyền cao hơn” hoặc “các thẩm quyền cấp trên.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “đã được Đức Chúa Trời chỉ định”, “đã được Đức Chúa Trời thiết lập” hoặc “đã được Đức Chúa Trời đặt vào trật tự.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πᾶσα ψυχὴ
  choice: Mỗi người
  rationale: Cụm này theo nghĩa đen là “mỗi linh hồn”, nhưng trong cách dùng Hy Lạp Koine ở đây chỉ từng con người. “Mỗi người” tự nhiên trong tiếng Việt và giữ được ý phân phối của πᾶσα.
- source_word: ἐξουσίαις ὑπερεχούσαις
  choice: các nhà cầm quyền
  rationale: ἐξουσίαις chỉ những người hay cơ cấu thực thi thẩm quyền, còn ὑπερεχούσαις mô tả vị thế ở trên hoặc cai quản. Trong ngữ cảnh dân sự, “các nhà cầm quyền” diễn đạt tự nhiên chức năng ấy mà không biến câu thành một thuật ngữ phẩm trật.
- source_word: ὑποτασσέσθω
  choice: phải thuận phục
  rationale: Mệnh lệnh hiện tại này đòi hỏi một tư thế đặt mình dưới trật tự có thẩm quyền. “Thuận phục” giữ được sắc thái phục tùng có trật tự, nhưng tự nó không thêm ý tán thành mọi hành động của nhà cầm quyền.
- source_word: οὐ γὰρ ἔστιν ἐξουσία εἰ μὴ ὑπὸ θεοῦ
  choice: vì không có quyền cai trị nào mà không do Đức Chúa Trời
  rationale: Cách dịch này giữ lời khẳng định rằng thẩm quyền có nguồn gốc hoặc căn nguyên nơi Đức Chúa Trời. “Do” phù hợp với ὑπό trong cấu trúc này mà không thêm động từ như “ban cho” vốn không có trực tiếp trong nguyên văn.
- source_word: αἱ δὲ οὖσαι
  choice: còn những nhà cầm quyền hiện có
  rationale: Phân từ giống cái số nhiều quay lại chỉ các ἐξουσίαι. Nêu lại “nhà cầm quyền” giúp tiếng Việt rõ nghĩa hơn đại từ trống “những cái hiện có”.
- source_word: τεταγμέναι
  choice: đã được Đức Chúa Trời sắp đặt
  rationale: Phân từ hoàn thành bị động của τάσσω diễn tả tình trạng hiện tại do hành động xếp đặt trước đó. “Đã được… sắp đặt” giữ cả ý trật tự và kết quả kéo dài, đồng thời không mặc nhiên nói rằng mọi việc làm của người cai trị đều được Đức Chúa Trời chuẩn thuận.
theological_decisions:
- issue: Phạm vi lời khẳng định về nhà cầm quyền và Đức Chúa Trời
  choice: Khẳng định các quyền cai trị thực tế hiện có nằm trong sự sắp đặt của Đức Chúa Trời, nhưng không mở rộng câu thành lời chuẩn thuận vô điều kiện đối với mọi chế độ hay mọi hành động của người cai trị.
  alternative: Hiểu rằng từng chế độ và mọi hành động của nó đều được Đức Chúa Trời tích cực chuẩn thuận; hoặc thu hẹp câu thành lời nói chỉ về nguyên tắc thẩm quyền trừu tượng.
  rationale: Nguyên văn vừa nói cụ thể đến các ἐξουσίαι hiện có, vừa dùng τεταγμέναι để nói chúng ở trong một trật tự do Đức Chúa Trời sắp đặt. Bản dịch cần giữ sức nặng ấy nhưng không giải quyết thay cho văn bản những vấn đề đạo đức mà câu này không trực tiếp bàn đến.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại. “Đức Chúa Trời” theo lối gọi quen thuộc của tiếng Việt Tin Lành; cấu trúc câu tránh cổ ngữ. “Thuận phục” được chọn để giữ sắc thái của ὑποτάσσω mà vẫn dễ hiểu. Dấu chấm phẩy giúp thể hiện rõ hai mệnh đề giải thích có liên hệ chặt chẽ.
