revisions:
- from: Vì nhà cầm quyền là người phục vụ của Đức Chúa Trời để đem lại điều tốt cho bạn. Nhưng nếu bạn làm điều ác thì hãy sợ, vì nhà cầm quyền mang gươm không phải vô cớ. Nhà cầm quyền là người phục vụ của Đức Chúa Trời, là người thi hành công lý để giáng cơn thịnh nộ trên kẻ làm điều ác.[a]
  to: Vì nhà cầm quyền là người phục vụ của Đức Chúa Trời để đem lại điều tốt cho bạn. Nhưng nếu bạn làm điều ác thì hãy sợ, vì nhà cầm quyền mang gươm không phải vô cớ. Nhà cầm quyền là người phục vụ của Đức Chúa Trời, là người báo ứng để thi hành cơn thịnh nộ đối với người làm điều ác.
  rationale: 'Bản sửa giữ nguyên ý nghĩa, cấu trúc và sự dè dặt thần học của nguyên văn: cơn thịnh nộ không bị gọi minh thị là của Đức Chúa Trời. «Người báo ứng» phản ánh ἔκδικος sát hơn «người thi hành công lý», còn «để thi hành cơn thịnh nộ» diễn đạt tự nhiên εἰς ὀργήν trong tiếng Việt mà vẫn cho thấy vai trò trừng phạt của nhà cầm quyền.'
