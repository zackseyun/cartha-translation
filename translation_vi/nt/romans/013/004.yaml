id: ROM.13.4
reference: Romans 13:4
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: θεοῦ γὰρ διάκονός ἐστιν σοὶ εἰς τὸ ἀγαθόν. ἐὰν δὲ τὸ κακὸν ποιῇς, φοβοῦ· οὐ γὰρ εἰκῇ τὴν μάχαιραν φορεῖ· θεοῦ γὰρ διάκονός ἐστιν, ἔκδικος εἰς ὀργὴν τῷ τὸ κακὸν πράσσοντι.
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/004.yaml
  text: For it is God’s servant for your good[a]. But if you do what is evil, be afraid, for it does not bear the sword for nothing. For it is God’s servant[b], an avenger for wrath against the one who practices evil.
translation:
  language: vi
  text: Vì nhà cầm quyền là người phục vụ của Đức Chúa Trời để đem lại điều tốt cho bạn. Nhưng nếu bạn làm điều ác thì hãy sợ, vì nhà cầm quyền mang gươm không phải vô cớ. Nhà cầm quyền là người phục vụ của Đức Chúa Trời, là người báo ứng để thi hành cơn thịnh nộ đối với người làm điều ác.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διάκονός
  choice: người phục vụ
  rationale: Chỉ người thực hiện một nhiệm vụ được giao; trong ngữ cảnh này là nhà cầm quyền hành động với tư cách người phục vụ của Đức Chúa Trời, không mang nghĩa chức vụ trong hội thánh.
- source_word: σοὶ εἰς τὸ ἀγαθόν
  choice: để đem lại điều tốt cho bạn
  rationale: Diễn đạt tự nhiên ý nghĩa mục đích hoặc lợi ích của cụm Hy Lạp, đồng thời giữ rõ quan hệ với đại từ 'bạn'.
- source_word: τὸ κακὸν ποιῇς
  choice: bạn làm điều ác
  rationale: Giữ sắc thái luân lý của κακόν và diễn đạt gọn, tự nhiên trong tiếng Việt.
- source_word: φοβοῦ
  choice: hãy sợ
  rationale: Giữ nguyên lực mệnh lệnh của động từ và chỉ nỗi sợ trước vai trò trừng phạt của nhà cầm quyền.
- source_word: εἰκῇ
  choice: không phải vô cớ
  rationale: Trong câu phủ định, cách nói này tự nhiên và bao hàm ý không vô ích, không vô mục đích.
- source_word: μάχαιραν φορεῖ
  choice: mang gươm
  rationale: Giữ hình ảnh cụ thể của μάχαιρα và ý φορέω là thường xuyên mang theo như dấu hiệu của quyền trừng phạt.
- source_word: ἔκδικος
  choice: người thi hành công lý
  rationale: Thể hiện vai trò thực thi sự báo trả hoặc công lý mà không gợi ý hành vi báo thù cá nhân.
- source_word: εἰς ὀργὴν
  choice: để giáng cơn thịnh nộ
  rationale: Diễn đạt mục đích hoặc kết quả của vai trò ἔκδικος nhưng không thêm rõ đó là cơn thịnh nộ của ai, vì nguyên văn không nói trực tiếp.
- source_word: τῷ τὸ κακὸν πράσσοντι
  choice: trên kẻ làm điều ác
  rationale: Chuyển danh hóa phân từ thành cách nói tiếng Việt tự nhiên; 'làm điều ác' vẫn có thể chỉ hành vi mang tính đặc trưng hoặc tiếp diễn.
theological_decisions:
- issue: Quan hệ giữa vai trò trừng phạt của nhà cầm quyền và cơn thịnh nộ
  choice: Giữ 'cơn thịnh nộ' mà không thêm 'của Đức Chúa Trời'.
  alternative: để giáng cơn thịnh nộ của Đức Chúa Trời; để trừng phạt
  rationale: Ngữ cảnh cho thấy nhà cầm quyền là người phục vụ của Đức Chúa Trời, nhưng εἰς ὀργὴν không nêu trực tiếp chủ thể sở hữu cơn thịnh nộ; bản dịch vì thế giữ sự hàm ẩn và căng thẳng thần học của nguyên văn.
- issue: Sắc thái của ἔκδικος
  choice: người thi hành công lý
  alternative: người báo trả; người báo thù
  rationale: Cách chọn này giữ chức năng trừng trị chính đáng trong ngữ cảnh quyền cai trị, đồng thời tránh sắc thái báo thù cá nhân có thể gây hiểu sai.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Lặp lại 'nhà cầm quyền' thay cho đại từ vô nhân xưng để tiếng Việt rõ chủ thể. 'Đức Chúa Trời' phù hợp văn phong Kinh Thánh Tin Lành phổ thông; không thêm diễn giải hệ phái.
