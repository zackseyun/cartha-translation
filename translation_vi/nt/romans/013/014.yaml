id: ROM.13.14
reference: Romans 13:14
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀλλὰ ἐνδύσασθε τὸν κύριον Ἰησοῦν Χριστόν, καὶ τῆς σαρκὸς πρόνοιαν μὴ ποιεῖσθε εἰς ἐπιθυμίας.
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/014.yaml
  text: But put on the Lord Jesus the Messiah[a], and make no provision for the flesh, for its desires.
translation:
  language: vi
  text: Nhưng hãy mặc lấy Chúa Giê-su, Đấng Mê-si, và đừng lo liệu cho xác thịt[a] để thỏa mãn những ham muốn của nó.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể hiểu là “bản tính tội lỗi.” Tiếng Hy Lạp dùng từ “xác thịt”; Phao-lô thường dùng từ này để chỉ những khuynh hướng của con người sa ngã, đối lập với đời sống được Đức Chúa Trời hướng dẫn.
    reason: Nêu cách dịch giải nghĩa thường gặp nhưng vẫn giữ thuật ngữ Hy Lạp và sự căng thẳng thần học trong bản chính.
lexical_decisions:
- source_word: ἐνδύσασθε
  choice: hãy mặc lấy
  rationale: Giữ nguyên hình ảnh mặc áo của động từ mệnh lệnh trung gian, đồng thời diễn đạt tự nhiên ý tiếp nhận và thể hiện một căn tính, lối sống.
- source_word: κύριον
  choice: Chúa
  rationale: Giữ trọng lượng thần học của tước hiệu κύριος dành cho Giê-su trong ngữ cảnh này.
- source_word: Χριστόν
  choice: Đấng Mê-si
  rationale: Diễn đạt Χριστός như một tước hiệu có nghĩa là Đấng được xức dầu, thay vì làm nó giống một phần họ tên; cấu trúc đồng vị sau “Giê-su” tự nhiên trong tiếng Việt.
- source_word: πρόνοιαν μὴ ποιεῖσθε
  choice: đừng lo liệu cho
  rationale: Thể hiện ý suy tính và chuẩn bị trước để đáp ứng điều gì đó, đồng thời tạo câu tiếng Việt rõ ràng, tự nhiên.
- source_word: σαρκὸς
  choice: xác thịt
  rationale: Giữ thuật ngữ và ẩn dụ của Phao-lô, không thu hẹp ngay thành một cách giải thích nhân học như “bản tính tội lỗi”.
- source_word: εἰς ἐπιθυμίας
  choice: để thỏa mãn những ham muốn của nó
  rationale: Diễn đạt quan hệ hướng tới mục đích hoặc kết quả giữa sự lo liệu cho xác thịt và các ham muốn; đại từ “nó” quy chiếu về “xác thịt”.
theological_decisions:
- issue: Cách dịch σάρξ trong ngữ cảnh luân lý của Phao-lô
  choice: xác thịt
  alternative: bản tính tội lỗi
  rationale: Ngữ cảnh nói đến những ham muốn sai lệch, nhưng “bản tính tội lỗi” sẽ giải nghĩa ẩn dụ theo một hệ thống nhân học hẹp hơn. Bản chính giữ “xác thịt”, còn chú thích nêu cách hiểu thay thế.
- issue: Cách thể hiện Χριστός
  choice: Đấng Mê-si
  alternative: Đấng Christ
  rationale: Ở đây Χριστός đi sau tên Giê-su như một tước hiệu. “Đấng Mê-si” truyền đạt ý nghĩa của tước hiệu và tránh khiến từ này bị hiểu đơn thuần như tên riêng.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Mặc lấy” giữ hình ảnh nổi bật của nguyên văn; “lo liệu cho” truyền đạt việc tính toán, chuẩn bị trước. Cách viết tên riêng dùng “Giê-su” và tước hiệu “Đấng Mê-si”.
