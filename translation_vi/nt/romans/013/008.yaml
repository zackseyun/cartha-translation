id: ROM.13.8
reference: Romans 13:8
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Μηδενὶ μηδὲν ὀφείλετε, εἰ μὴ τὸ ⸂ἀλλήλους ἀγαπᾶν⸃· ὁ γὰρ ἀγαπῶν τὸν ἕτερον νόμον πεπλήρωκεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/008.yaml
  text: Owe no one anything[a], except to love one another; for the one who loves another has fulfilled the law.
translation:
  language: vi
  text: Đừng mắc nợ ai điều gì, ngoại trừ việc yêu thương nhau; vì người yêu thương người khác[a] đã làm trọn luật pháp.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “người kia.” Tiếng Hy Lạp viết: “người khác/người kia.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μηδενὶ μηδὲν ὀφείλετε
  choice: Đừng mắc nợ ai điều gì
  rationale: Cách dịch này giữ cấu trúc bao quát “không ai—không điều gì” và nghĩa trực tiếp về nợ hay nghĩa vụ, đồng thời tự nhiên trong tiếng Việt hiện đại.
- source_word: εἰ μὴ τὸ ἀλλήλους ἀγαπᾶν
  choice: ngoại trừ việc yêu thương nhau
  rationale: “Ngoại trừ” thể hiện rõ ngoại lệ duy nhất, còn “việc yêu thương nhau” diễn đạt tự nhiên động từ nguyên mẫu có mạo từ và giữ tính hỗ tương của ἀλλήλους.
- source_word: ὁ γὰρ ἀγαπῶν
  choice: vì người yêu thương
  rationale: Giữ lực khái quát của phân từ được dùng như danh từ mà không thêm đại từ mang dấu ấn giới tính.
- source_word: τὸν ἕτερον
  choice: người khác
  rationale: Diễn đạt tự nhiên “người kia/người khác” trong tiếng Việt và không nhập từ “người lân cận” vốn không xuất hiện trong mệnh đề này; chú thích bảo lưu cách hiểu sát chữ hơn.
- source_word: νόμον πεπλήρωκεν
  choice: đã làm trọn luật pháp
  rationale: “Làm trọn” phù hợp với πληρόω trong văn mạch Phao-lô; “đã” thể hiện kết quả hoàn thành của thì hoàn thành mà không diễn giải quá mức.
theological_decisions:
- issue: Phạm vi của lời cấm mắc nợ
  choice: Dịch thẳng như một lời cấm mắc nợ, đồng thời giữ nguyên ngoại lệ là yêu thương nhau.
  alternative: Hiểu đây là lệnh cấm tuyệt đối mọi hình thức vay mượn, hoặc chỉ là ẩn dụ về nghĩa vụ đạo đức.
  rationale: Câu Hy Lạp nói trực tiếp về việc mắc nợ rồi nêu tình yêu như ngoại lệ; bản dịch không nên tự giải quyết cuộc tranh luận đạo đức rộng hơn điều văn bản khẳng định.
- issue: Đối tượng của tình yêu trong τὸν ἕτερον
  choice: người khác
  alternative: người kia; người lân cận
  rationale: “Người khác” giữ phạm vi rộng và tự nhiên của cụm từ Hy Lạp; “người lân cận” sẽ đưa vào câu này một thuật ngữ chỉ xuất hiện rõ trong phần trích dẫn tiếp theo.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Câu giữ nhịp đối xứng giữa món nợ thông thường và nghĩa vụ yêu thương, không diễn giải thành lập trường riêng về vay mượn.
