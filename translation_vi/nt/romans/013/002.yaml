id: ROM.13.2
reference: Romans 13:2
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὥστε ὁ ἀντιτασσόμενος τῇ ἐξουσίᾳ τῇ τοῦ θεοῦ διαταγῇ ἀνθέστηκεν, οἱ δὲ ἀνθεστηκότες ἑαυτοῖς κρίμα λήμψονται.
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/002.yaml
  text: Therefore[a], the one who resists the authority has opposed the ordinance of God[b], and those who have opposed it will receive judgment on themselves.
translation:
  language: vi
  text: Vì vậy, ai chống lại thẩm quyền thì đã chống lại sự sắp đặt của Đức Chúa Trời[a]; còn những người đã chống lại sẽ tự chuốc lấy sự phán xét[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “quy định của Đức Chúa Trời” hoặc “trật tự Đức Chúa Trời đã thiết lập.”
    reason: lexical_alternative
  - marker: b
    text: “Sự phán xét” cũng có thể dịch là “án phạt” hoặc “bản án”; từ Hy Lạp ở đây không nhất thiết mang nghĩa mạnh hơn là sự kết án đời đời.
    reason: alternative_reading
lexical_decisions:
- source_word: ὥστε
  choice: Vì thế
  rationale: Diễn tả kết luận suy ra từ câu trước bằng cách nói tự nhiên trong tiếng Việt hiện đại.
- source_word: ὁ ἀντιτασσόμενος
  choice: ai chống lại
  rationale: Phân từ có mạo từ chỉ chung bất cứ người nào có hành động chống đối; “ai chống lại” vừa gọn vừa tự nhiên.
- source_word: τῇ ἐξουσίᾳ
  choice: quyền cai trị
  rationale: Giữ danh từ số ít và làm rõ theo văn cảnh Rô-ma 13:1 rằng đây là thẩm quyền quản trị, nhưng không đồng nhất nó với một cá nhân cụ thể.
- source_word: τῇ τοῦ θεοῦ διαταγῇ
  choice: điều Đức Chúa Trời sắp đặt
  rationale: διαταγή có thể chỉ sự sắp đặt, quy định hoặc mệnh lệnh. Cách dịch này tự nhiên và giữ ý rằng cơ cấu thẩm quyền nằm trong sự định liệu của Đức Chúa Trời.
- source_word: ἀνθέστηκεν
  choice: đã chống lại
  rationale: 'Giữ sắc thái thể hoàn thành: hành động chống đối đã được thực hiện và vẫn có hệ quả ở hiện tại.'
- source_word: οἱ δὲ ἀνθεστηκότες
  choice: và những người chống lại
  rationale: Giữ sự liên kết từ vựng với mệnh đề trước; tiếng Việt không cần lặp “đã” vì văn cảnh đã biểu đạt rõ nhóm người chọn lập trường chống đối.
- source_word: ἑαυτοῖς
  choice: tự chuốc lấy
  rationale: 'Diễn đạt tự nhiên ý phản thân: hậu quả quay lại trên chính những người chống đối.'
- source_word: κρίμα
  choice: sự phán xét
  rationale: Giữ nghĩa rộng của κρίμα, không mặc nhiên nâng thành sự kết án đời đời.
- source_word: λήμψονται
  choice: sẽ ... chuốc lấy
  rationale: Truyền đạt thì tương lai và ý nhận/lãnh hậu quả; kết hợp với đại từ phản thân thành cách nói tiếng Việt tự nhiên.
theological_decisions:
- issue: Phạm vi nghĩa của κρίμα
  choice: sự phán xét
  alternative: án phạt; bản án; sự kết án
  rationale: Câu này cảnh báo về phán xét đối với người chống lại, nhưng không tự xác định đó là sự kết án đời đời. Bản dịch giữ nguyên độ rộng và sức căng thần học của từ.
- issue: Đối tượng của ἐξουσία
  choice: quyền cai trị
  alternative: thẩm quyền; chính quyền; nhà chức trách
  rationale: Văn cảnh trực tiếp nói đến các thẩm quyền quản trị, nhưng bản văn dùng danh từ chỉ thẩm quyền chứ không gọi đích danh một chế độ hay quan chức cụ thể.
- issue: Quan hệ giữa thẩm quyền và sự sắp đặt của Đức Chúa Trời
  choice: điều Đức Chúa Trời sắp đặt
  alternative: mệnh lệnh của Đức Chúa Trời; trật tự Đức Chúa Trời đã thiết lập
  rationale: Cách dịch khẳng định mối liên hệ mà câu văn nêu ra nhưng không mở rộng thành một học thuyết tuyệt đối về mọi hành động của người cầm quyền.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “quyền cai trị” để nối với văn cảnh chính quyền mà không diễn giải quá mức; dùng “tự chuốc lấy” để thể hiện rõ đại từ phản thân theo lối nói tự nhiên.
