- from: 'Vì thế, ai chống lại quyền cai trị thì đã chống lại điều Đức Chúa Trời sắp đặt[a]; và những người chống lại sẽ tự chuốc lấy sự phán xét[b].


    [a] Cũng có thể dịch là “mệnh lệnh của Đức Chúa Trời” hoặc “trật tự Đức Chúa Trời đã thiết lập.”

