  source_fidelity: Cần sửa cụm mở đầu. τὸ γάρ không có danh từ “những điều răn”; cách “Vì những điều răn:” thêm nội dung và làm quan hệ cú pháp kém sát. “Vì điều này:” giữ được lực giải thích và dẫn tự nhiên vào các điều răn được trích. Trong mệnh đề sau, chủ thể số ít là “bất cứ điều răn nào khác”, nên “điều đó được tóm lại” sát hơn “tất cả đều được tóm lại.”
