  terminology: “Ngoại tình,” “giết người,” “trộm cắp,” “tham muốn,” và “người lân cận” đều thích hợp. “Giết người” phản ánh chính xác φονεύσεις trong ngữ cảnh này. “Lời này” là lựa chọn có thể chấp nhận cho λόγος, với chú thích nêu các khả năng gần nghĩa.
