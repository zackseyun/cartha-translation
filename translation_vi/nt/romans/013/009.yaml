id: ROM.13.9
reference: Romans 13:9
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: τὸ γάρ· Οὐ μοιχεύσεις, Οὐ φονεύσεις, Οὐ κλέψεις, Οὐκ ἐπιθυμήσεις, καὶ εἴ τις ἑτέρα ἐντολή, ἐν ⸂τῷ λόγῳ τούτῳ⸃ ἀνακεφαλαιοῦται, ⸂ἐν τῷ⸃· Ἀγαπήσεις τὸν πλησίον σου ὡς σεαυτόν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/009.yaml
  text: 'For this: “You shall not commit adultery[a], you shall not murder, you shall not steal, you shall not covet,” and if there is any other commandment[b], it is summed up in this word: “You shall love your neighbor as yourself.”'
translation:
  language: vi
  text: 'Vì điều này: “Ngươi không được ngoại tình; ngươi không được giết người[a]; ngươi không được trộm cắp; ngươi không được tham muốn,” và nếu còn điều răn nào khác, thì điều đó được tóm lại trong lời này[b]: “Ngươi phải yêu người lân cận như chính mình.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Động từ Hy Lạp ở đây chỉ hành vi giết người trái phép, không nói đến mọi trường hợp làm chết.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “câu này” hoặc “lời phát biểu này.” Từ Hy Lạp có thể mang các nghĩa ấy trong văn cảnh.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ γάρ
  choice: Vì những điều răn
  rationale: Cụm từ mở đầu nêu nội dung các điều răn làm căn cứ cho lời giải thích trước đó. Tiếng Việt cần nói rõ danh từ được hàm ý để câu tự nhiên.
- source_word: μοιχεύσεις
  choice: ngươi không được ngoại tình
  rationale: Thì tương lai trong lời trích Mười Điều Răn mang chức năng mệnh lệnh. “Không được” giữ sắc thái quy phạm mà vẫn là tiếng Việt hiện đại.
- source_word: φονεύσεις
  choice: ngươi không được giết người
  rationale: φονεύω chỉ hành vi giết người trái phép, không phải mọi trường hợp làm chết; “giết người” là cách diễn đạt chính xác và tự nhiên trong tiếng Việt.
- source_word: κλέψεις
  choice: ngươi không được trộm cắp
  rationale: Giữ hình thức cấm đoán của điều răn và dùng cách nói phổ thông, trang trọng.
- source_word: ἐπιθυμήσεις
  choice: ngươi không được tham muốn
  rationale: Trong bối cảnh Mười Điều Răn, động từ nói đến lòng ham muốn chiếm hữu điều không thuộc về mình; “tham muốn” giữ được sắc thái tiêu cực mà không thu hẹp vào một loại tài sản cụ thể.
- source_word: εἴ τις ἑτέρα ἐντολή
  choice: nếu còn điều răn nào khác
  rationale: “Còn” diễn đạt tự nhiên phạm vi mở rộng ra ngoài các điều vừa liệt kê, còn “nào” giữ tính bất định của τις.
- source_word: ἀνακεφαλαιοῦται
  choice: tất cả đều được tóm lại
  rationale: Động từ có nghĩa quy tụ hoặc tóm các điều dưới một đầu mối. Thêm “tất cả” làm rõ chủ thể số nhiều được hàm ý trong tiếng Việt mà không thay đổi ý.
- source_word: ἐν τῷ λόγῳ τούτῳ
  choice: trong lời này
  rationale: λόγος ở đây là một lời phát biểu hoặc công thức Kinh Thánh. “Lời” vừa gọn, vừa giữ được độ rộng nghĩa của từ Hy Lạp.
- source_word: Ἀγαπήσεις
  choice: Ngươi phải yêu
  rationale: Thì tương lai trong lời trích Lê-vi Ký có lực mệnh lệnh; “phải” chuyển tải rõ chức năng ấy và song hành với các điều cấm phía trước.
- source_word: τὸν πλησίον σου
  choice: người lân cận
  rationale: Cách dịch này giữ liên hệ với lời trích Lê-vi Ký và chỉ người ở trong quan hệ gần gũi với chủ thể, không tự ý giới hạn hoặc mở rộng phạm vi.
- source_word: ὡς σεαυτόν
  choice: như chính mình
  rationale: Giữ nguyên phép so sánh cô đọng của nguyên văn, không thêm động từ hay lời giải thích.
theological_decisions:
- issue: Hình thức các mệnh lệnh được trích từ luật pháp
  choice: Dùng dạng quy phạm “Ngươi không được…” và “Ngươi phải…”
  alternative: Dùng mệnh lệnh trực tiếp “Đừng…” và “Hãy…”
  rationale: Nguyên văn dùng thì tương lai theo lối trích dẫn luật pháp. Dạng “không được/phải” bảo tồn sắc thái giao ước và quy phạm, đồng thời tự nhiên hơn trong tiếng Việt hiện đại.
- issue: Phạm vi nghĩa của λόγος trong cụm ἐν τῷ λόγῳ τούτῳ
  choice: “lời” theo nghĩa lời phát biểu tóm lược
  alternative: “câu này” hoặc “lời tuyên bố này”
  rationale: Phao-lô nói đến toàn bộ công thức Kinh Thánh theo sau chứ không chỉ một từ đơn lẻ. “Lời” giữ được tính cô đọng và độ mở nghĩa; chú thích nêu khả năng dịch khác.
translation_notes:
  register: Bản dịch dùng tiếng Việt hiện đại, trang trọng và dễ hiểu. Đại từ “ngươi” được giữ trong các lời trích luật pháp để bảo tồn giọng trực tiếp, long trọng của Kinh Thánh; cấu trúc câu được làm tự nhiên bằng cách nêu rõ “những điều răn” và “tất cả” vốn được hàm ý trong nguyên văn.
