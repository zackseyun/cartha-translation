id: ROM.16.18
reference: Romans 16:18
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οἱ γὰρ τοιοῦτοι τῷ κυρίῳ ⸀ἡμῶν Χριστῷ οὐ δουλεύουσιν ἀλλὰ τῇ ἑαυτῶν κοιλίᾳ, καὶ διὰ τῆς χρηστολογίας καὶ εὐλογίας ἐξαπατῶσι τὰς καρδίας τῶν ἀκάκων.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/018.yaml
  text: For such people do not serve our Lord Messiah[a], but their own belly[c][b], and by smooth talk and flattery they deceive the hearts of the unsuspecting.
translation:
  language: vi
  text: Vì những kẻ như thế không phục vụ Chúa chúng ta là Đấng Mê-si[a], mà phục vụ bụng mình[b]; bằng lời lẽ ngon ngọt và nịnh hót, họ lừa dối lòng dạ của những người không đề phòng[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Đấng Christ.”'
    reason: alternative_reading
  - marker: b
    text: 'Nguyên văn: “bụng của chính họ”, một hình ảnh sống động chỉ những ham muốn vị kỷ và sự nuông chiều bản thân.'
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể dịch: “những người vô tội”, “những người thật thà” hoặc “những người chất phác”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοιοῦτοι
  choice: những kẻ như thế
  rationale: Chỉ về những người gây chia rẽ đã được nhắc đến ở câu trước; cách diễn đạt này giữ sắc thái quy chiếu và hàm ý phê phán của văn cảnh.
- source_word: κυρίῳ ἡμῶν Χριστῷ
  choice: Chúa chúng ta, Đấng Mê-si
  rationale: Giữ κύριος là “Chúa” và dịch Χριστός theo nghĩa tước hiệu là “Đấng Mê-si”; không thêm “Giê-su” vì từ này không có trong bản Hy Lạp.
- source_word: δουλεύουσιν
  choice: phục vụ
  rationale: Động từ có nghĩa phục vụ như một đầy tớ hoặc làm tôi cho ai; “phục vụ” tự nhiên trong tiếng Việt và duy trì thế tương phản giữa Chúa với bụng của họ.
- source_word: κοιλίᾳ
  choice: bụng
  rationale: Giữ nguyên hình ảnh cụ thể và mạnh của Phao-lô, thay vì diễn giải hẹp thành “dục vọng” hay “ham muốn”.
- source_word: χρηστολογίας
  choice: lời lẽ ngon ngọt
  rationale: Diễn tả lời nói dễ nghe, khéo lấy lòng trong một văn cảnh lừa dối.
- source_word: εὐλογίας
  choice: nịnh hót
  rationale: Trong cặp từ này, εὐλογία chỉ lời tâng bốc nhằm thao túng, chứ không phải hành động ban phước thật sự.
- source_word: ἐξαπατῶσι
  choice: lừa dối
  rationale: Truyền đạt rõ hành động đánh lừa; sắc thái tăng cường của động từ ghép không cần được diễn đạt bằng một trạng từ gượng ép.
- source_word: καρδίας
  choice: lòng
  rationale: “Lòng” là cách diễn đạt tự nhiên trong tiếng Việt cho con người bên trong, không giới hạn ý nghĩa vào lý trí.
- source_word: ἀκάκων
  choice: những người không chút nghi ngờ
  rationale: Trong lời cảnh báo này, cụm từ nhấn mạnh sự không đề phòng khiến họ dễ bị lừa, đồng thời không gán cho họ sự ngu dốt hay tội lỗi.
theological_decisions:
- issue: Cách dịch Χριστός trong tước hiệu của Phao-lô
  choice: Đấng Mê-si
  alternative: Đấng Christ
  rationale: Χριστός mang nghĩa tước hiệu “Đấng được xức dầu”; bản chính làm rõ nghĩa ấy, còn cách gọi truyền thống “Đấng Christ” được giữ trong chú thích.
- issue: Hình ảnh phục vụ “bụng”
  choice: Giữ hình ảnh “bụng” trong bản chính
  alternative: ham muốn ích kỷ của chính mình
  rationale: Nguyên văn dùng hình ảnh cụ thể, có thể bao gồm sự nuông chiều bản thân theo nghĩa rộng; diễn giải thành một loại ham muốn cụ thể sẽ thu hẹp độ mở của câu.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Cấu trúc được tách thành hai câu để rõ nghĩa; thế tương phản “không… mà…” và hình ảnh “bụng” của nguyên văn được bảo toàn.
