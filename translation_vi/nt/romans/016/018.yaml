  to: Vì những kẻ như thế không phục vụ Chúa chúng ta là Đấng Mê-si[a], mà phục vụ bụng mình[b]; bằng lời lẽ ngon ngọt và nịnh hót, họ lừa dối lòng dạ của những người không đề phòng[c].
