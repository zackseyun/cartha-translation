  terminology: Các tên riêng phiên âm nhất quán; “Đấng Mê-si-a” phản ánh Χριστός như một tước hiệu. Cách gọi “sứ đồ” phù hợp với văn phong Kinh Thánh tiếng Việt. Cần bỏ “quý trọng” trong chú thích b vì từ ἐπίσημοι không tự nó diễn đạt sự quý trọng.
