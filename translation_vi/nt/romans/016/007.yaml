id: ROM.16.7
reference: Romans 16:7
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀσπάσασθε Ἀνδρόνικον καὶ ⸀Ἰουνίαν τοὺς συγγενεῖς μου καὶ συναιχμαλώτους μου, οἵτινές εἰσιν ἐπίσημοι ἐν τοῖς ἀποστόλοις, οἳ καὶ πρὸ ἐμοῦ ⸀γέγοναν ἐν Χριστῷ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/007.yaml
  text: Greet Andronicus and Junia[a], my kinsmen and my fellow prisoners. They are notable among the apostles[b], and they were in Messiah before me.
translation:
  language: vi
  text: Hãy gửi lời chào đến An-rô-ni-cơ và Giu-ni-a[a], là những người bà con và bạn tù của tôi. Họ là những người nổi bật trong số các sứ đồ[b], và họ đã ở trong Đấng Mê-si-a trước tôi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Giu-ni-a: cũng có thể phiên là “Giu-ni-át” và hiểu là tên nam; tuy nhiên, dạng Hy Lạp và cách dùng tên trong lịch sử nghiêng nhiều hơn về tên nữ Giu-ni-a.'
    reason: alternative_reading
  - marker: b
    text: Cụm này cũng có thể hiểu là “được các sứ đồ biết đến.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: Hãy gửi lời chào đến
  rationale: Giữ lực mệnh lệnh của lời chào thư tín, đồng thời diễn đạt tự nhiên trong tiếng Việt hiện đại.
- source_word: Ἀνδρόνικον
  choice: An-rô-ni-cơ
  rationale: Phiên âm tên riêng Hy Lạp theo lối đọc rõ ràng, quen thuộc trong văn phong Kinh Thánh tiếng Việt.
- source_word: Ἰουνίαν
  choice: Giu-ni-a
  rationale: Dạng Hy Lạp phù hợp nhất với tên nữ Junia; khả năng là tên nam được ghi ở chú thích để phản ánh cuộc tranh luận lịch sử.
- source_word: συγγενεῖς μου
  choice: những người bà con ... của tôi
  rationale: Diễn đạt nghĩa thân tộc mà không xác định mức độ quan hệ; trong cách dùng của Phao-lô, từ này cũng có thể chỉ đồng bào cùng dân tộc, nên sắc thái ấy được giữ trong chú thích.
- source_word: συναιχμαλώτους μου
  choice: bạn tù của tôi
  rationale: Cách nói tự nhiên, gọn và cụ thể, chỉ những người cùng chịu cảnh tù đày với Phao-lô.
- source_word: ἐπίσημοι ἐν τοῖς ἀποστόλοις
  choice: nổi bật trong số các sứ đồ
  rationale: Phản ánh trực tiếp nghĩa nổi tiếng hoặc đáng chú ý của ἐπίσημοι và cách hiểu bao hàm tự nhiên của ἐν; cách hiểu khác, 'được các sứ đồ biết đến và quý trọng', được bảo lưu trong chú thích.
- source_word: πρὸ ἐμοῦ γέγοναν ἐν Χριστῷ
  choice: đã ở trong Đấng Mê-si-a trước tôi
  rationale: Giữ thành ngữ thần học 'ở trong Đấng Mê-si-a', thì hoàn thành và ý nghĩa thời gian trước Phao-lô, không diễn giải thành một công thức cải đạo.
theological_decisions:
- issue: Giới tính và dạng tên Ἰουνίαν
  choice: Giu-ni-a, một tên nữ
  alternative: Giu-ni-át, được hiểu là tên nam
  rationale: Dạng đối cách Ἰουνίαν và chứng cứ về cách dùng tên trong lịch sử ủng hộ mạnh hơn cho tên nữ Junia; phương án tên nam vẫn được ghi chú vì ảnh hưởng lâu dài trong lịch sử giải nghĩa.
- issue: Ý nghĩa của ἐπίσημοι ἐν τοῖς ἀποστόλοις
  choice: nổi bật trong số các sứ đồ
  alternative: được các sứ đồ biết đến và quý trọng
  rationale: Cụm Hy Lạp có thể được hiểu theo nghĩa bao hàm họ trong nhóm sứ đồ, hoặc theo nghĩa họ nổi tiếng đối với các sứ đồ. Bản chính theo cách đọc trực tiếp hơn, còn chú thích bảo lưu sự mơ hồ thực sự.
- issue: Cách dịch Χριστός
  choice: Đấng Mê-si-a
  alternative: Đấng Christ
  rationale: Dịch Χριστός như một tước hiệu, làm rõ nghĩa 'Đấng được xức dầu' mà không biến thành tên riêng.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại, dùng mệnh lệnh tự nhiên “Hãy gửi lời chào đến”. “Bạn tù” dễ hiểu hơn một cấu trúc Hán-Việt nặng nề. Tên riêng được phiên âm có dấu và gạch nối. Các chú thích bảo lưu hai điểm mơ hồ có ý nghĩa giải nghĩa mà không áp đặt kết luận hệ phái.
