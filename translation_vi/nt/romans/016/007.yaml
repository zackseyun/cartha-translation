  source_fidelity: Bản dịch truyền đạt đúng mệnh lệnh chào thăm, quan hệ thân tộc, tình trạng cùng bị tù, thứ tự thời gian “trước tôi”, và thành ngữ “ở trong Đấng Mê-si-a”. “Nổi bật trong số các sứ đồ” là cách hiểu trực tiếp, khả dĩ của ἐπίσημοι ἐν τοῖς ἀποστόλοις; chú thích cần giữ phương án còn lại mà không thêm sắc thái không có trong nguyên ngữ.
