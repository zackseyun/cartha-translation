  to: Hãy gửi lời chào đến An-rô-ni-cơ và Giu-ni-a[a], là những người bà con và bạn tù của tôi. Họ là những người nổi bật trong số các sứ đồ[b], và họ đã ở trong Đấng Mê-si-a trước tôi.
