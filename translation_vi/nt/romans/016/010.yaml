  text: ἀσπάσασθε Ἀπελλῆν τὸν δόκιμον ἐν Χριστῷ. ἀσπάσασθε τοὺς ἐκ τῶν Ἀριστοβούλου.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/010.yaml
  text: Greet Apelles[a], the approved one in Messiah. Greet those of the household of Aristobulus.
translation:
  language: vi
  text: Hãy chào A-bên, người đã được chứng nghiệm trong Đấng Mê-si-a. Hãy chào những người thuộc nhà A-ri-tạc-bu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: Hãy chào
  rationale: Động từ mệnh lệnh số nhiều yêu cầu chuyển lời chào; cách diễn đạt này ngắn gọn, tự nhiên và giữ được lối khuyên bảo lặp lại trong Rô-ma 16.
- source_word: Ἀπελλῆν
  choice: A-be-lơ
  rationale: Phiên âm tên riêng Apelles theo dạng quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
- source_word: τὸν δόκιμον
  choice: người đã được thử luyện và chứng tỏ là đáng tin
  rationale: δόκιμος chỉ người đã trải qua thử thách và được xác nhận là chân thật, đáng tin. Cách dịch này giữ cả ý được thử nghiệm lẫn kết quả tích cực, thay vì chỉ nói chung chung là ‘được chấp thuận’.
- source_word: ἐν Χριστῷ
  choice: trong Đấng Mê-si-a
  rationale: Giữ nguyên giới từ ‘trong’ trong thành ngữ thần học của Phao-lô về phạm vi hoặc sự liên hiệp với Đấng được xức dầu; Χριστός được dịch theo nghĩa danh hiệu.
- source_word: τοὺς ἐκ τῶν Ἀριστοβούλου
  choice: những người thuộc nhà A-ri-tô-bu
  rationale: Cụm Hy Lạp nói đến những người gắn với gia hộ hoặc điền trang của A-ri-tô-bu, không nhất thiết bao gồm chính ông. ‘Thuộc nhà’ vừa tự nhiên vừa đủ rộng để bao gồm gia nhân.
theological_decisions:
- issue: Cách dịch Χριστῷ trong công thức ἐν Χριστῷ của Phao-lô
  choice: trong Đấng Mê-si-a
  alternative: trong Đấng Christ
  rationale: Χριστός mang nghĩa danh hiệu ‘Đấng được xức dầu’. Giữ ‘trong’ bảo toàn sức căng của thành ngữ Phao-lô mà không diễn giải thành ‘là tín hữu’ hay một cách hiểu giáo phái cụ thể.
- issue: Ý nghĩa của δόκιμον trong lời khen A-be-lơ
  choice: đã được thử luyện và chứng tỏ là đáng tin
  alternative: được chấp thuận
  rationale: Bản dịch nêu cả tiến trình thử nghiệm và kết quả được công nhận, nhưng không xác định loại thử thách hoặc cơ quan chấp thuận mà nguyên văn không nói rõ.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Dùng ‘Đấng Mê-si-a’ như một danh hiệu; ‘nhà A-ri-tô-bu’ được hiểu theo nghĩa gia hộ, rộng hơn gia đình huyết thống.
