revisions:
- from: Hãy chào A-be-lơ, người đã được thử luyện và chứng tỏ là đáng tin trong Đấng Mê-si-a. Hãy chào những người thuộc nhà A-ri-tô-bu.
  to: Hãy chào A-bên, người đã được chứng nghiệm trong Đấng Mê-si-a. Hãy chào những người thuộc nhà A-ri-tạc-bu.
  rationale: Sửa dạng tên riêng theo cách dùng Kinh Thánh tiếng Việt thông dụng; thay phần diễn giải dài về δόκιμος bằng “đã được chứng nghiệm” để sát nghĩa và không thêm phẩm chất “đáng tin”; giữ “trong Đấng Mê-si-a” theo giá trị danh hiệu của Χριστός. Thêm chú thích cho cách dịch thành ngữ liên hệ với Aristobulus và cho phương án truyền thống “Đấng Christ”.
  reviewer_model: gpt-5.6-terra
