revisions:
- from: Hãy chào Hê-rô-đi-ôn, người bà con của tôi.[a] Hãy chào những người thuộc về Nạt-xít[b] đang ở trong Chúa.
  to: Hãy chào Hê-rô-đi-ôn, bà con của tôi.[a] Hãy chào những người thuộc nhóm Nạt-xít[b] là những người ở trong Chúa.
  rationale: Bản sửa tránh thêm sắc thái thời gian vào phân từ «ở trong Chúa», làm quan hệ với Nạt-xít tự nhiên hơn mà không xác định là gia hộ trong câu chính, và dùng «bà con» để phần nào duy trì độ rộng nghĩa của συγγενής. Các chú thích giữ nguyên những khả năng diễn giải cần thiết và các neo chú thích vẫn đặt đúng sau đơn vị từ vựng liên quan.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T18:10:06Z'
review_pass:
  verdict: revise
  source_fidelity: Bản dịch phản ánh đúng hai mệnh lệnh ἀσπάσασθε, giữ tên Hê-rô-đi-ôn, và không thêm «gia hộ» vào câu chính. Tuy nhiên, «đang ở trong Chúa» dễ gán sắc thái thời gian/diễn tiến không có trong phân từ dùng để nhận diện nhóm người; «là những người ở trong Chúa» phản ánh chức năng này chính xác hơn. «Thuộc về Nạt-xít» có thể gợi quan hệ sở hữu quá trực tiếp; «thuộc nhóm Nạt-xít» diễn đạt tự nhiên hơn quan hệ liên thuộc còn mơ hồ của τοὺς ἐκ τῶν Ναρκίσσου.
  naturalness: «Bà con của tôi» tự nhiên, trang trọng vừa phải, và trong tiếng Việt vẫn có độ rộng thích hợp hơn «người bà con của tôi». Việc bỏ «đang» cũng làm câu gọn và tự nhiên hơn.
  terminology: Giữ «ở trong Chúa» cho ἐν κυρίῳ và «Chúa» cho κύριος. Giữ dạng tên Nạt-xít nhất quán với bản thảo; chú thích giải thích khả năng liên hệ với gia hộ hoặc điền trang, không biến điều đó thành nội dung câu chính.
  issues:
  - severity: medium
    issue: «đang ở trong Chúa» thêm sắc thái diễn tiến/thời gian
    rationale: τοὺς ὄντας ἐν κυρίῳ là phân từ hiện tại có chức năng xác định những người nào trong nhóm liên hệ với Nạt-xít được chào; câu không nhấn diễn tiến «đang». «là những người ở trong Chúa» giữ chức năng nhận diện này.
  - severity: low
    issue: «những người thuộc về Nạt-xít» hơi thiếu tự nhiên và có thể gợi sở hữu trực tiếp
    rationale: Cấu trúc τοὺς ἐκ τῶν Ναρκίσσου chỉ sự liên hệ/xuất thân, có lẽ là người trong gia hộ hay điền trang, nhưng không nêu rõ. «những người thuộc nhóm Nạt-xít» giữ được sự dè dặt đó trong tiếng Việt.
  - severity: low
    issue: «người bà con» thu hẹp phần nào độ mở của συγγενής
    rationale: Trong ngữ cảnh Phao-lô, συγγενής có thể chỉ họ hàng hoặc người cùng dân tộc. «bà con của tôi», cùng chú thích, là cách diễn đạt tiếng Việt có phạm vi gợi rộng hơn mà vẫn không khẳng định cách hiểu nào.
