id: ROM.16.11
reference: Romans 16:11
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀσπάσασθε Ἡρῳδίωνα τὸν ⸀συγγενῆ μου. ἀσπάσασθε τοὺς ἐκ τῶν Ναρκίσσου τοὺς ὄντας ἐν κυρίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/011.yaml
  text: Greet Herodion[a], my kinsman[b]. Greet those of Narcissus who are in the Lord.
translation:
  language: vi
  text: Hãy chào Hê-rô-đi-ôn, bà con của tôi.[a] Hãy chào những người thuộc nhóm Nạt-xít[b] là những người ở trong Chúa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể hiểu là “người đồng tộc với tôi” hoặc “người đồng bào Do Thái của tôi”; từ Hy Lạp có thể chỉ một người bà con theo huyết thống hoặc một người cùng dân tộc với Phao-lô.
    reason: lexical_alternative
  - marker: b
    text: Có lẽ chỉ những người thuộc gia hộ hoặc điền trang của Nạt-xít và là những người tin Chúa; nguyên văn chỉ nói họ là những người có liên hệ với Nạt-xít.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: Hãy chào
  rationale: Động từ mệnh lệnh số nhiều trong văn cảnh lời chào thư tín được diễn đạt tự nhiên và chính xác bằng “Hãy chào”.
- source_word: Ἡρῳδίωνα
  choice: Hê-rô-đi-ôn
  rationale: Phiên âm tên riêng Hy Lạp theo lối viết dễ đọc và quen thuộc trong tiếng Việt.
- source_word: συγγενῆ μου
  choice: người bà con của tôi
  rationale: “Người bà con” là cách nói tự nhiên, trang trọng vừa phải trong tiếng Việt. Vì συγγενής cũng có thể chỉ người đồng tộc hay đồng bào Do Thái, chú thích giữ lại phạm vi nghĩa rộng hơn thay vì buộc câu chính theo một cách hiểu.
- source_word: τοὺς ἐκ τῶν Ναρκίσσου
  choice: những người thuộc về Nạt-xít
  rationale: Cách dịch này giữ quan hệ liên kết với Nạt-xít mà không tự ý thêm danh từ “nhà” hay “gia nhân”, vốn không xuất hiện trực tiếp trong nguyên văn. Khả năng chỉ người trong gia hộ hoặc điền trang được nêu ở chú thích.
- source_word: τοὺς ὄντας ἐν κυρίῳ
  choice: đang ở trong Chúa
  rationale: Giữ nguyên thành ngữ thần học đặc trưng của Phao-lô “ở trong Chúa”, đồng thời “đang” thể hiện phân từ hiện tại dùng để xác định nhóm người được chào.
- source_word: κυρίῳ
  choice: Chúa
  rationale: “Chúa” là cách dịch chuẩn và tự nhiên của κύριος trong thành ngữ Cơ Đốc giáo của Phao-lô ở đây.
theological_decisions:
- issue: Phạm vi nghĩa của συγγενής trong lời chào của Phao-lô
  choice: người bà con của tôi
  alternative: người đồng tộc với tôi; người đồng bào Do Thái của tôi
  rationale: Từ Hy Lạp có thể chỉ quan hệ huyết thống hoặc, rộng hơn, một người cùng dân tộc với Phao-lô. Câu chính dùng cách nói tự nhiên nhất trong văn cảnh, còn chú thích công khai giữ lại nghĩa dân tộc có thể có.
- issue: Những người có liên hệ với Nạt-xít là ai
  choice: những người thuộc về Nạt-xít
  alternative: những người trong gia hộ của Nạt-xít; những người thuộc điền trang của Nạt-xít
  rationale: Nguyên văn biểu thị sự liên hệ với Nạt-xít nhưng không nêu rõ “gia hộ”. Vì vậy, bản dịch chính không thêm chi tiết ấy, còn chú thích cho biết cách hiểu có khả năng cao.
- issue: Ý nghĩa của thành ngữ ἐν κυρίῳ
  choice: ở trong Chúa
  alternative: thuộc về Chúa; là những người tin Chúa
  rationale: Cách dịch sát giữ được hình ảnh về mối liên hiệp hoặc sự thuộc về Đấng Christ mà không thu hẹp thành ngữ thành một lời giải thích duy nhất.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Giữ thành ngữ “ở trong Chúa” vì giá trị thần học đặc trưng của Phao-lô; tránh thêm “gia hộ” vào câu chính để bảo toàn độ hàm hồ của nguyên văn.
