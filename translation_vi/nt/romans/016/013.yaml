  source_fidelity: Bản dịch phản ánh đúng mệnh lệnh số nhiều ἀσπάσασθε, tên riêng Ῥοῦφον, mô tả τὸν ἐκλεκτὸν ἐν κυρίῳ, và lối nói tỉnh lược «mẹ người và tôi». Tuy nhiên, cách dùng đại từ «anh ấy» làm hạ văn phong và kém phù hợp với lối chào trang trọng của thư tín; «mẹ người» giữ đúng tính tỉnh lược của tiếng Hy Lạp hơn.
