  rationale: Chỉnh nhẹ cách diễn đạt để nâng tính tự nhiên và trang trọng của tiếng Việt, không thay đổi nghĩa hay giải quyết theo một hướng thần học nào sự mơ hồ của ἐκλεκτός. «mẹ người, cũng là mẹ tôi» bảo tồn lời xác nhận thân tình trong nguyên văn mà không khẳng định quan hệ sinh học.
