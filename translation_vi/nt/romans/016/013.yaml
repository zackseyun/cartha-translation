source:
  edition: SBLGNT
  text: ἀσπάσασθε Ῥοῦφον τὸν ἐκλεκτὸν ἐν κυρίῳ καὶ τὴν μητέρα αὐτοῦ καὶ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/013.yaml
  text: Greet Rufus[a], the chosen one in the Lord, and his mother and mine.
translation:
  language: vi
  text: Hãy chào Ru-phu[a], người được chọn trong Chúa, và mẹ người, cũng là mẹ tôi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “người ưu tú trong Chúa” hoặc “người nổi bật trong Chúa.” Tính từ Hy Lạp cũng có thể mang nghĩa “ưu tú, xuất sắc.”'
    reason: Nêu khả năng từ vựng của ἐκλεκτός ngoài nghĩa “được chọn”, qua đó bảo tồn sự mơ hồ chân thực của nguyên văn.
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: Hãy gửi lời chào
  rationale: Động từ mệnh lệnh số nhiều chỉ việc chào thăm; cách diễn đạt này tự nhiên trong phần lời chào cuối thư và vẫn giữ sắc thái mệnh lệnh.
- source_word: Ῥοῦφον
  choice: Ru-phu
  rationale: Phiên âm tên riêng Hy Lạp theo cách đọc rõ ràng, quen thuộc trong tiếng Việt.
- source_word: ἐκλεκτὸν
  choice: người được chọn
  rationale: Giữ nghĩa căn bản là được chọn, đồng thời danh từ hóa tự nhiên để phản ánh cấu trúc có mạo từ τὸν; không thu hẹp thành một hệ thống thần học cụ thể.
- source_word: ἐν κυρίῳ
  choice: trong Chúa
  rationale: Giữ quan hệ hoặc phạm vi được diễn tả bởi ἐν, không đổi thành 'bởi Chúa', vốn sẽ xác định tác nhân rõ hơn nguyên văn.
- source_word: μητέρα αὐτοῦ καὶ ἐμοῦ
  choice: mẹ của anh ấy, cũng là mẹ của tôi
  rationale: Diễn đạt tự nhiên cấu trúc tỉnh lược 'mẹ của anh ấy và của tôi', bảo tồn lời xác nhận thân tình của Phao-lô mà không thêm lời giải thích vào chính văn.
theological_decisions:
- issue: Ý nghĩa của ἐκλεκτὸν ἐν κυρίῳ
  choice: người được chọn trong Chúa
  alternative: người ưu tú/nổi bật trong Chúa
  rationale: Cụm từ có thể nói đến sự tuyển chọn hoặc phẩm chất đáng quý, nổi bật. Chính văn giữ cách hiểu 'được chọn' nhưng chú thích nêu khả năng từ vựng khác, tránh áp đặt một hệ thống giáo lý hẹp.
- issue: Ý nghĩa của 'mẹ của anh ấy, cũng là mẹ của tôi'
  choice: Giữ ngôn ngữ thân thuộc rằng mẹ Ru-phu cũng là mẹ của Phao-lô
  alternative: Diễn giải rõ là bà đã chăm sóc Phao-lô như con
  rationale: Ngữ cảnh phù hợp với quan hệ thân tình hơn là quan hệ sinh học, nhưng nguyên văn không giải thích cụ thể; vì vậy bản dịch không thêm chi tiết về cách bà chăm sóc ông.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh ấy” để chỉ Ru-phu cho tự nhiên; cụm “cũng là mẹ của tôi” giữ sự ấm áp trong lời chào mà không giải nghĩa quá mức.
