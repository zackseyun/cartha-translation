  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Συνίστημι δὲ ὑμῖν Φοίβην τὴν ἀδελφὴν ἡμῶν, οὖσαν ⸀καὶ διάκονον τῆς ἐκκλησίας τῆς ἐν Κεγχρεαῖς,
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/001.yaml
  text: I commend to you Phoebe[a], our sister, who is also a deacon of the church in Cenchreae,
translation:
  language: vi
  text: Tôi xin giới thiệu với anh chị em Phê-bê[a], người chị em của chúng ta, cũng là một chấp sự của Hội Thánh tại Ken-khơ-rê,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “một người phục vụ” hoặc “một người thi hành chức vụ” của Hội Thánh tại Ken-khơ-rê. Từ Hy Lạp diakonos có thể chỉ một vai trò phục vụ được công nhận hoặc, theo nghĩa rộng hơn, một người phục vụ.'
    reason: alternative_reading
lexical_decisions:
- source_word: Συνίστημι
  choice: Tôi xin giới thiệu
  rationale: Trong văn cảnh thư tín, động từ này dùng để trân trọng giới thiệu và tiến cử một người với người nhận. “Xin giới thiệu” tự nhiên trong tiếng Việt và giữ được sắc thái đề cử thiện ý.
- source_word: δὲ
  choice: không dịch thành một từ riêng
  rationale: Ở đây δέ chỉ đánh dấu sự chuyển ý nhẹ. Dòng văn tiếng Việt đã thể hiện sự chuyển đoạn tự nhiên; thêm “bây giờ” sẽ dễ tạo sắc thái thời gian không có trong nguyên văn.
- source_word: Φοίβην
  choice: Phê-bê
  rationale: Phiên âm tên riêng Hy Lạp theo cách đọc rõ ràng, quen thuộc trong tiếng Việt.
- source_word: τὴν ἀδελφὴν ἡμῶν
  choice: chị em của chúng ta
  rationale: Giữ nguyên ngôn ngữ gia đình thuộc linh của Phao-lô mà không thêm cụm giải thích “trong đức tin” vào chính văn.
- source_word: οὖσαν καὶ
  choice: cũng là
  rationale: Diễn đạt tự nhiên kết cấu phân từ và giữ lực bổ sung của καί.
- source_word: διάκονον
  choice: một chấp sự
  rationale: Cụm từ gắn với một hội thánh cụ thể có thể chỉ một vai trò phục vụ được công nhận. Tuy nhiên, từ Hy Lạp cũng có nghĩa rộng hơn là người phục vụ, nên giữ các khả năng ấy trong chú thích.
- source_word: τῆς ἐκκλησίας
  choice: của Hội Thánh
  rationale: Trong thư Phao-lô, ἐκκλησία ở đây chỉ cộng đồng tín hữu địa phương. “Hội Thánh” là cách diễn đạt rõ ràng và trang trọng.
- source_word: τῆς ἐν Κεγχρεαῖς
  choice: tại Ken-khơ-rê
  rationale: Dùng giới từ “tại” tự nhiên cho địa điểm của một hội thánh và phiên âm địa danh Κεγχρεαί sang tiếng Việt.
theological_decisions:
- issue: διάκονον chỉ sự phục vụ nói chung hay một vai trò trong hội thánh
  choice: một chấp sự
  alternative: một người phục vụ; một người thi hành chức vụ
  rationale: Quan hệ được nêu rõ với Hội Thánh tại Ken-khơ-rê nghiêng về một vai trò phục vụ có thể được công nhận, nhưng từ ngữ không tự nó xác định cơ cấu chức vụ của các hệ phái về sau. Chú thích bảo tồn độ mở ngữ nghĩa.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh chị em” để diễn đạt đối tượng số nhiều ὑμῖν một cách bao quát; “chị em của chúng ta” bảo tồn hình ảnh gia đình trong cộng đồng đức tin. Giữ dấu phẩy cuối câu vì câu Hy Lạp tiếp tục sang câu kế tiếp.
