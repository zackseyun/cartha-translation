  source_fidelity: Bản dịch truyền đạt đúng động từ giới thiệu/tiến cử (συνίστημι), đối tượng số nhiều, tên Phê-bê, và cụm chỉ bà là διάκονον của hội thánh tại Ken-khơ-rê. Tuy nhiên, “chị em của chúng ta” trong tiếng Việt có thể được hiểu là số nhiều (“our sisters”), trong khi ἀδελφήν là số ít, chỉ riêng Phê-bê.
