  text: Ἀσπάσασθε ἀλλήλους ἐν φιλήματι ἁγίῳ. Ἀσπάζονται ὑμᾶς αἱ ἐκκλησίαι ⸀πᾶσαι τοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/016.yaml
  text: Greet one another with a holy kiss[b][a]. All the churches of Messiah greet you.
translation:
  language: vi
  text: Hãy chào nhau bằng nụ hôn thánh[a]. Tất cả các hội thánh của Đấng Mê-si[b] đều gửi lời chào đến anh chị em.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Nụ hôn thánh” là một cách chào hỏi được thừa nhận trong văn hóa thời bấy giờ, bày tỏ tình cảm thánh khiết và sự thông công giữa các tín hữu.
    reason: cultural_note
  - marker: b
    text: 'Cũng có thể dịch: “Đấng Christ.”'
    reason: alternative_rendering
lexical_decisions:
- source_word: Ἀσπάσασθε ἀλλήλους
  choice: Hãy chào nhau
  rationale: Mệnh lệnh Ἀσπάσασθε mang nghĩa chào hỏi; ἀλλήλους diễn tả hành động tương hỗ. “Hãy chào nhau” tự nhiên, rõ ràng và giữ được sắc thái mệnh lệnh.
- source_word: ἐν φιλήματι ἁγίῳ
  choice: bằng một nụ hôn thánh
  rationale: ἐν với cách cho ở đây chỉ phương cách; φίλημα là “nụ hôn”, còn ἁγίῳ mô tả nụ hôn thuộc về sự thánh khiết và tình thân trong cộng đồng đức tin.
- source_word: Ἀσπάζονται ὑμᾶς
  choice: gửi lời chào anh chị em
  rationale: Trong văn thư, ἀσπάζονται có thể diễn đạt tự nhiên là “gửi lời chào”. ὑμᾶς là số nhiều; “anh chị em” làm rõ cộng đồng người nhận và phù hợp văn phong thư tín.
- source_word: αἱ ἐκκλησίαι πᾶσαι
  choice: Tất cả các hội thánh
  rationale: Giữ đầy đủ ý nghĩa của πᾶσαι và cấu trúc xác định của cụm danh từ; “hội thánh” là cách gọi quen thuộc, trang trọng đối với các cộng đồng tín hữu.
- source_word: τοῦ Χριστοῦ
  choice: của Đấng Mê-si
  rationale: Χριστός là tước hiệu tương ứng với “Đấng Mê-si”; cách dịch này giữ rõ nghĩa nguyên thủy của tước hiệu, còn sở hữu cách diễn tả sự thuộc về hoặc gắn bó với Ngài.
theological_decisions:
- issue: Cách dịch Χριστοῦ
  choice: Đấng Mê-si
  alternative: Đấng Christ
  rationale: Trong cụm “các hội thánh của…”, Χριστός vẫn có thể được hiểu như tước hiệu. “Đấng Mê-si” truyền đạt nghĩa của tước hiệu; chú thích giữ lại cách gọi truyền thống “Đấng Christ” mà không biến khác biệt thuật ngữ thành khác biệt về nhân vật.
- issue: Ý nghĩa của “nụ hôn thánh”
  choice: Giữ nguyên hình ảnh cụ thể của bản Hy Lạp
  alternative: lời chào thân ái thánh khiết
  rationale: Bản văn nêu đích danh φίλημα, tức “nụ hôn”; không nên thay hành vi cụ thể bằng một nguyên tắc khái quát. Chú thích cung cấp bối cảnh văn hóa mà không quyết định thay người đọc cách áp dụng.
translation_notes:
  register: Văn phong hiện đại, trang trọng nhưng dễ hiểu. “Hãy chào nhau” ngắn gọn và tự nhiên; “anh chị em” thể hiện rõ đại từ số nhiều trong ngữ cảnh cộng đồng. Giữ “nụ hôn thánh” để bảo toàn hình ảnh văn hóa cụ thể của nguyên văn.
