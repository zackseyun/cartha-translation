revisions:
- from: nhưng nay đã được bày tỏ[a] và, qua các sách tiên tri, được làm cho mọi dân tộc biết đến theo mệnh lệnh của Đức Chúa Trời hằng hữu, nhằm đưa họ đến sự vâng phục của đức tin,
  to: nhưng nay đã được bày tỏ[a], và qua các sách tiên tri, theo mệnh lệnh của Đức Chúa Trời hằng hữu, được tỏ cho mọi dân tộc biết, để dẫn đến sự vâng phục của đức tin,
  rationale: Thay cách diễn đạt có thể hiểu là “được biết đến” bằng «được tỏ cho mọi dân tộc biết» để phản ánh chính xác hơn động từ γνωρίζω ở thể bị động. Bỏ «họ» để không bổ sung một tham chiếu không được nêu rõ, và dùng «để dẫn đến» để chuyển tải εἰς theo chức năng mục đích mà vẫn giữ sự mơ hồ của «sự vâng phục của đức tin». Chú thích và vị trí ký hiệu chú thích được giữ nguyên.
