id: ROM.16.26
reference: Romans 16:26
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: robinson-pierpont-2005-byzantine
  text: φανερωθέντος δὲ νῦν, διά τε γραφῶν προφητικῶν, κατ' ἐπιταγὴν τοῦ αἰωνίου θεοῦ, εἰς ὑπακοὴν πίστεως εἰς πάντα τὰ ἔθνη γνωρισθέντος,
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/026.yaml
  text: but[a] has now been revealed, and through the prophetic Scriptures made known to all nations, according to the command of the eternal God, to bring about the obedience of faith,
translation:
  language: vi
  text: nhưng nay đã được bày tỏ[a], và qua các sách tiên tri, theo mệnh lệnh của Đức Chúa Trời hằng hữu, được tỏ cho mọi dân tộc biết, để dẫn đến sự vâng phục của đức tin,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Câu này tiếp nối lời tôn vinh kết thúc thư (Rô-ma 16:25–27). Xem chú thích ở Rô-ma 16:25 về vị trí của đoạn này và chứng cứ thủ bản.
    reason: textual_critical
lexical_decisions:
- source_word: φανερωθέντος
  choice: đã được bày tỏ
  rationale: Phân từ bị động này quy chiếu về “mầu nhiệm” ở câu 25 và diễn tả điều từng kín giấu nay được đưa ra ánh sáng; “bày tỏ” tự nhiên và trang trọng trong tiếng Việt.
- source_word: γραϕῶν προφητικῶν
  choice: các sách tiên tri
  rationale: Cụm số nhiều chỉ các trước tác thánh mang tính tiên tri; “các sách tiên tri” dễ hiểu hơn “các văn phẩm tiên tri” mà vẫn giữ nghĩa nguồn.
- source_word: ἐπιταγήν
  choice: mệnh lệnh
  rationale: Từ này chỉ chỉ thị có thẩm quyền, nhấn mạnh việc làm cho các dân biết là theo lệnh trực tiếp của Đức Chúa Trời.
- source_word: ὑπακοὴν πίστεως
  choice: sự vâng phục của đức tin
  rationale: 'Giữ cấu trúc sở hữu và sự mơ hồ có chủ ý của tiếng Hy Lạp: có thể là sự vâng phục phát sinh từ đức tin hoặc sự vâng phục chính là đức tin; đồng thời bảo toàn liên hệ với Rô-ma 1:5.'
- source_word: πάντα τὰ ἔθνη
  choice: mọi dân tộc
  rationale: Chuyển tải phạm vi phổ quát của πάντα và ἔθνη, không thu hẹp thành riêng “dân ngoại”.
- source_word: γνωρισθέντος
  choice: được làm cho ... biết đến
  rationale: Phân từ bị động diễn tả mầu nhiệm được truyền đạt để mọi dân tộc nhận biết; cách dịch này phân biệt với φανερωθέντος nhưng vẫn tự nhiên.
theological_decisions:
- issue: Ý nghĩa của ὑπακοὴ πίστεως
  choice: sự vâng phục của đức tin
  alternative: sự vâng phục phát xuất từ đức tin / sự vâng phục là tin
  rationale: Không giải quyết thay cho nguyên văn mối quan hệ ngữ pháp-thần học giữa “vâng phục” và “đức tin”.
- issue: Phạm vi của πάντα τὰ ἔθνη
  choice: mọi dân tộc
  alternative: mọi dân ngoại
  rationale: Giữ phạm vi bao quát của cụm Hy Lạp và tránh mặc nhiên loại người Do Thái khỏi đối tượng được biết đến.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ câu ở dạng tiếp nối câu 25, mở đầu bằng “nhưng” và kết thúc bằng dấu phẩy để phản ánh cấu trúc của lời tôn vinh. Đại từ “họ” được bổ sung trong cụm chỉ mục đích để tiếng Việt tự nhiên; đối tượng là “mọi dân tộc” ngay trước đó.
