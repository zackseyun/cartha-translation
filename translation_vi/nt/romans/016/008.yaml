  text: ἀσπάσασθε ⸀Ἀμπλιᾶτον τὸν ἀγαπητόν μου ἐν κυρίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/008.yaml
  text: Greet Ampliatus[a], my beloved in the Lord.
translation:
  language: vi
  text: Hãy chào Ampliatus[a], người tôi yêu mến trong Chúa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tên Hy Lạp này cũng có thể được ghi là “Amplias”; cách đọc của SBLGNT tại đây ủng hộ dạng “Ampliatus”.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: Hãy chào
  rationale: Động từ mệnh lệnh aorist trung cách, ngôi thứ hai số nhiều, là cách truyền đạt lời chào quen thuộc trong thư tín. “Hãy chào” ngắn gọn, tự nhiên và giữ được lực mệnh lệnh.
- source_word: Ἀμπλιᾶτον
  choice: Ampliatus
  rationale: Dạng đối cách trong câu được quy về dạng tên riêng Ampliatus. Giữ cách viết này phù hợp với chứng cứ văn bản SBLGNT và giúp phân biệt với dạng ngắn Amplias được phản ánh trong một số truyền thống.
- source_word: τὸν ἀγαπητόν μου
  choice: người tôi yêu mến
  rationale: Cách diễn đạt này truyền tải tình cảm ấm áp của ἀγαπητός cùng đại từ sở hữu μου, đồng thời tự nhiên hơn trong tiếng Việt hiện đại và tránh sắc thái tình cảm đôi lứa mà “người yêu dấu của tôi” có thể gợi ra.
- source_word: ἐν κυρίῳ
  choice: trong Chúa
  rationale: Giữ nguyên thành ngữ thần học quen thuộc của Phao-lô, diễn tả mối liên hệ hoặc phạm vi đời sống thuộc về Chúa; không thêm “Giê-su” vì nguyên văn không có.
theological_decisions:
- issue: Mối liên hệ cú pháp và thần học của ἐν κυρίῳ
  choice: 'Hiểu “trong Chúa” là bổ nghĩa cho Ampliatus trong tư cách người được Phao-lô yêu mến: “người tôi yêu mến trong Chúa.”'
  alternative: Hiểu cụm từ này là bổ nghĩa cho hành động chào hỏi, hoặc làm nhẹ thành tình bạn thuần túy.
  rationale: Trật tự từ Hy Lạp tự nhiên nhất gắn ἐν κυρίῳ với τὸν ἀγαπητόν μου. Bản dịch giữ được chiều kích thông công Cơ Đốc mà không giải thích quá mức bản văn.
translation_notes:
  register: Văn phong trang trọng vừa phải, rõ ràng và tự nhiên trong tiếng Việt hiện đại. “Hãy chào” giữ sắc thái mệnh lệnh thư tín; “người tôi yêu mến” diễn đạt tình cảm thân thiết mà không gây hiểu lầm. Dấu chú thích [a] được đặt ngay sau tên riêng.
