id: ROM.16.2
reference: Romans 16:2
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἵνα ⸂αὐτὴν προσδέξησθε⸃ ἐν κυρίῳ ἀξίως τῶν ἁγίων, καὶ παραστῆτε αὐτῇ ἐν ᾧ ἂν ὑμῶν χρῄζῃ πράγματι, καὶ γὰρ αὐτὴ προστάτις πολλῶν ἐγενήθη καὶ ⸂ἐμοῦ αὐτοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/002.yaml
  text: so that you may welcome her in the Lord in a manner worthy of the saints[a], and assist her in whatever matter she may need from you, for she herself has become a patron of many[b], and of myself as well.
translation:
  language: vi
  text: để anh chị em tiếp đón chị ấy trong Chúa, theo cách xứng đáng với các thánh đồ, và giúp đỡ chị ấy trong bất cứ việc gì chị ấy cần anh chị em giúp đỡ; vì chính chị ấy đã trở thành người bảo trợ cho nhiều người[a], kể cả tôi nữa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “ân nhân”, “người giúp đỡ” hoặc “người che chở”. Từ Hy Lạp gợi ý một phụ nữ đã nâng đỡ hoặc bảo trợ người khác.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσδέξησθε
  choice: tiếp đón
  rationale: Diễn tả việc cộng đồng đón nhận Phê-bê cách thiện chí và hiếu khách; tự nhiên hơn lối dịch đơn thuần là “tiếp nhận”.
- source_word: ἐν κυρίῳ
  choice: trong Chúa
  rationale: Giữ nguyên cách nói đặc trưng của Phao-lô về mối liên hệ và phạm vi thông công thuộc về Chúa.
- source_word: ἀξίως τῶν ἁγίων
  choice: theo cách xứng đáng với các thánh đồ
  rationale: Giữ ý chỉ cách thức của ἀξίως và thuật ngữ quen thuộc của Phao-lô dành cho dân thánh của Đức Chúa Trời.
- source_word: παραστῆτε αὐτῇ
  choice: giúp đỡ chị ấy
  rationale: Trong ngữ cảnh này, động từ mang nghĩa đứng ra hỗ trợ hoặc trợ giúp; “giúp đỡ” rõ ràng và tự nhiên trong tiếng Việt hiện đại.
- source_word: ἐν ᾧ ἂν ὑμῶν χρῄζῃ πράγματι
  choice: trong bất cứ việc gì chị ấy cần nơi anh chị em
  rationale: πρᾶγμα có nghĩa rộng là việc hay sự vụ, còn χρῄζῃ với sở hữu cách chỉ điều chị cần từ phía họ.
- source_word: προστάτις
  choice: người bảo trợ
  rationale: Từ này có thể chỉ một phụ nữ nâng đỡ người khác bằng nguồn lực, vị thế hoặc sự che chở; “người bảo trợ” giữ được sắc thái xã hội mạnh hơn “người giúp đỡ” chung chung.
- source_word: ἐγενήθη
  choice: đã là
  rationale: Diễn đạt tự nhiên vai trò mà Phê-bê đã đảm nhận, không buộc tiếng Việt phải dùng cấu trúc thiếu tự nhiên “đã trở thành”.
- source_word: ἐμοῦ αὐτοῦ
  choice: kể cả tôi nữa
  rationale: Truyền đạt cả sắc thái nhấn mạnh của αὐτοῦ lẫn ý bổ sung của καί bằng tiếng Việt tự nhiên.
theological_decisions:
- issue: Cách dịch προστάτις nói về Phê-bê
  choice: người bảo trợ
  alternative: ân nhân; người giúp đỡ; người che chở
  rationale: “Người bảo trợ” phản ánh khả năng đây là một vai trò nâng đỡ có ý nghĩa về xã hội và vật chất, đồng thời không biến từ này thành một chức vụ giáo hội về sau. Chú thích bảo lưu các nghĩa gần khác vì phạm vi chính xác của từ Hy Lạp không hoàn toàn chắc chắn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh chị em” cho đối tượng số nhiều và “chị ấy” cho Phê-bê để thể hiện rõ giới tính trong ngữ cảnh. Giữ cụm thần học “trong Chúa” và thuật ngữ Phao-lô “các thánh đồ”.
