id: ROM.16.24
reference: Romans 16:24
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸂Ἡ χάρις τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ μετὰ πάντων ὑμῶν.⸃ ⸀Ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/024.yaml
  text: The grace of our Lord Jesus Christ be with all of you[b][a]. Amen.
translation:
  language: vi
  text: Nguyện ân điển của Chúa chúng ta là Đức Giê-su, Đấng Mê-si-a[a], ở cùng tất cả anh chị em.[b] A-men.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Đấng Ki-tô.” Từ Hy Lạp Χριστός là danh hiệu có nghĩa là “Đấng được xức dầu”; “Ki-tô” là cách phiên âm truyền thống, còn ở đây danh hiệu ấy được dịch là “Đấng Mê-si-a”.'
    reason: alternative_reading
  - marker: b
    text: Một số thủ bản có câu này, trong khi các thủ bản khác không có; nhiều ấn bản hiện đại đặt câu này trong ngoặc để cho biết đây là một dị bản ở phần kết thư Rô-ma.
    reason: textual_variant
lexical_decisions:
- source_word: χάρις
  choice: ân điển
  rationale: “Ân điển” là cách diễn đạt quen thuộc trong văn cảnh Phao-lô, vừa chỉ lòng ưu ái nhưng không vừa chỉ ân huệ được ban nhưng không; từ này giữ được sức nặng thần học của χάρις.
- source_word: κυρίου
  choice: Chúa
  rationale: Trong danh hiệu chỉ Đức Giê-su, “Chúa” diễn đạt tự nhiên quyền chủ tể hàm chứa trong κύριος và phù hợp với lối xưng hô Cơ Đốc giáo bằng tiếng Việt.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Đức Giê-su, Đấng Mê-si-a
  rationale: “Giê-su” được phiên âm như tên riêng; Χριστός được dịch theo nghĩa danh hiệu là “Đấng Mê-si-a”. Từ “Đức” tạo sắc thái tôn kính tự nhiên trong tiếng Việt, còn dấu phẩy làm rõ quan hệ đồng vị.
- source_word: μετὰ πάντων ὑμῶν
  choice: ở cùng tất cả anh chị em
  rationale: μετά với sở hữu cách có nghĩa là “ở cùng”; πάντων ὑμῶν bao gồm toàn thể cộng đồng. “Anh chị em” diễn đạt tự nhiên một hội chúng gồm cả nam lẫn nữ.
- source_word: Ἀμήν
  choice: A-men
  rationale: Giữ hình thức phiên âm quen thuộc của lời xác nhận phụng vụ, thay vì thu hẹp nghĩa thành “thật vậy”.
theological_decisions:
- issue: Cách dịch Χριστός trong cụm Ἰησοῦ Χριστοῦ
  choice: Đấng Mê-si-a
  alternative: Đấng Ki-tô
  rationale: Ở đây Χριστός vẫn mang ý nghĩa danh hiệu của Đấng được xức dầu. Dịch là “Đấng Mê-si-a” giúp người đọc nhận ra ý nghĩa ấy, trong khi chú thích giữ lại cách gọi truyền thống “Đấng Ki-tô”.
- issue: Tình trạng văn bản của cả câu
  choice: Giữ câu trong bản dịch và đánh dấu bằng chú thích dị bản
  alternative: Lược bỏ câu khỏi chính văn
  rationale: Nguồn được cung cấp đặt câu trong dấu ngoặc chỉ dị bản; truyền thống thủ bản vừa có chứng cứ ủng hộ vừa có chứng cứ lược bỏ. Giữ câu kèm chú thích bảo toàn dữ liệu nguồn mà không che giấu sự bất định văn bản.
translation_notes:
  register: Văn phong trang trọng, sáng rõ và phù hợp với lời chúc phước kết thư. Cấu trúc “Nguyện… ở cùng…” tự nhiên trong tiếng Việt hiện đại. “Tất cả anh chị em” thể hiện rõ phạm vi bao quát của πάντων ὑμῶν mà không dùng đại từ chỉ có vẻ hướng riêng đến nam giới.
