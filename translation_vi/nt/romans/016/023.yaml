id: ROM.16.23
reference: Romans 16:23
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀσπάζεται ὑμᾶς Γάϊος ὁ ξένος μου καὶ ⸂ὅλης τῆς ἐκκλησίας⸃. ἀσπάζεται ὑμᾶς Ἔραστος ὁ οἰκονόμος τῆς πόλεως καὶ Κούαρτος ὁ ἀδελφός.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/023.yaml
  text: Gaius[a], my host and the host of the whole church, greets you. Erastus, the city treasurer, greets you, and Quartus, the brother.
translation:
  language: vi
  text: Gai-út, người tiếp đãi tôi và toàn thể hội thánh, gửi lời chào anh chị em. Ê-rát, thủ quỹ của thành phố,[a] và Qua-tút, người anh em, cũng gửi lời chào anh chị em.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “viên quản lý của thành phố.” Từ Hy Lạp có thể chỉ một viên chức hành chính nói chung, dù “thủ quỹ” có thể phù hợp với chức vụ đô thị tại đây.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσπάζεται
  choice: gửi lời chào
  rationale: Trong phần kết thư, động từ này diễn tả việc chuyển lời chào; cách nói này tự nhiên trong tiếng Việt và giữ được sắc thái trực tiếp.
- source_word: ξένος
  choice: người tiếp đãi
  rationale: Trong cấu trúc “người tiếp đãi tôi và toàn thể hội thánh,” từ này chỉ người đón tiếp, cho ở nhờ và bày tỏ lòng hiếu khách, chứ không mang nghĩa “người lạ” hay “khách”.
- source_word: ὅλης τῆς ἐκκλησίας
  choice: toàn thể hội thánh
  rationale: “Hội thánh” chỉ cộng đồng tín hữu tại đây; “toàn thể” giữ nguyên phạm vi rộng của ὅλης.
- source_word: οἰκονόμος τῆς πόλεως
  choice: thủ quỹ của thành phố
  rationale: οἰκονόμος chỉ người quản lý hoặc quản gia; trong bối cảnh chức vụ đô thị, “thủ quỹ” là nghĩa có khả năng cao, còn nghĩa rộng hơn được ghi ở chú thích.
- source_word: ἀδελφός
  choice: người anh em
  rationale: Giữ danh từ thân tộc giống đực số ít của nguyên văn và cho thấy Quạt-tút là một người nam thuộc cộng đồng đức tin, không tự ý thêm đại từ sở hữu.
- source_word: ὑμᾶς
  choice: anh chị em
  rationale: Đại từ số nhiều chỉ những người nhận thư; “anh chị em” là lối xưng hô tự nhiên, bao quát cộng đồng tín hữu trong tiếng Việt hiện đại.
theological_decisions:
- issue: Cách dịch ἐκκλησία trong lời chào
  choice: hội thánh
  alternative: cộng đoàn; hội chúng
  rationale: Trong cách dùng của Phao-lô, từ này tại đây chỉ cộng đồng tín hữu. “Hội thánh” là cách dịch quen thuộc, không buộc văn bản vào một mô hình tổ chức giáo hội cụ thể.
- issue: Danh từ thân tộc giống đực ἀδελφός
  choice: người anh em
  alternative: anh em chúng ta; người đồng đạo
  rationale: Nguyên văn nói về một cá nhân nam và không có đại từ sở hữu. Cách dịch đã chọn giữ cả giới tính lẫn hình ảnh gia đình thuộc linh mà không thêm “chúng ta”.
- issue: Chức vụ của Ê-rát
  choice: thủ quỹ của thành phố
  alternative: viên quản lý của thành phố
  rationale: Bối cảnh hành chính đô thị cho phép hiểu đây là chức vụ tài chính, nhưng phạm vi nghĩa của οἰκονόμος rộng hơn; sự không chắc chắn được bảo lưu bằng chú thích.
translation_notes:
  register: Văn phong trang trọng vừa phải, tự nhiên đối với độc giả Việt Nam hiện đại. Dùng “gửi lời chào anh chị em” cho công thức kết thư; các tên riêng được phiên âm để dễ đọc. Dấu chú thích [a] được đặt ngay sau cụm từ mà chú thích giải nghĩa.
