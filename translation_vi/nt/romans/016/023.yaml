    issue: Phiên âm tên Κούαρτος là “Quạt-tút”
    rationale: Dạng này phân bố phụ âm /t/ không phù hợp với Κούαρτος (Kou-ar-tos). “Qua-tút” giữ phần Qua- trước -tút sát hơn, đồng thời vẫn theo lối phiên âm Việt hóa có gạch nối.
