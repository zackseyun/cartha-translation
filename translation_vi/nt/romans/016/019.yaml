revisions:
- from: Vì sự vâng phục của anh chị em đã được mọi người biết đến.[a] Bởi vậy, tôi vui mừng về anh chị em; nhưng tôi muốn anh chị em khôn ngoan đối với điều thiện và trong sạch đối với điều ác.[b]
  to: Vì sự vâng phục của anh chị em đã được mọi người biết đến.[a] Bởi vậy, tôi vui mừng vì anh chị em; nhưng tôi muốn anh chị em khôn ngoan trong điều thiện và trong sạch đối với điều ác.[b]
  rationale: 'Chỉ chỉnh những chỗ diễn đạt để tiếng Việt hiện đại tự nhiên hơn: đổi “vui mừng về” thành “vui mừng vì,” và “khôn ngoan đối với” thành “khôn ngoan trong.” Không thay đổi nghĩa, cấu trúc đối chiếu đạo đức, hay phạm vi tu từ của nguyên văn. Các neo chú thích vẫn gắn đúng với cụm được giải thích.'
