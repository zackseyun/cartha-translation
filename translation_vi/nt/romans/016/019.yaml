id: ROM.16.19
reference: Romans 16:19
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἡ γὰρ ὑμῶν ὑπακοὴ εἰς πάντας ἀφίκετο· ⸂ἐφ’ ὑμῖν οὖν χαίρω⸃, θέλω δὲ ὑμᾶς ⸀σοφοὺς εἶναι εἰς τὸ ἀγαθόν, ἀκεραίους δὲ εἰς τὸ κακόν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/019.yaml
  text: For your obedience has reached everyone[a]. Therefore I rejoice over you, but I want you to be wise in what is good[c][b], and innocent in what is evil.
translation:
  language: vi
  text: Vì sự vâng phục của anh chị em đã được mọi người biết đến.[a] Bởi vậy, tôi vui mừng vì anh chị em; nhưng tôi muốn anh chị em khôn ngoan trong điều thiện và trong sạch đối với điều ác.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “sự vâng phục của anh chị em đã đến với mọi người.”'
    reason: lexical_alternative
  - marker: b
    text: “Trong sạch” cũng có thể dịch là “ngây thơ”, “không pha tạp” hoặc “không vương nhiễm”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπακοή
  choice: sự vâng phục
  rationale: Trong cách dùng của Phao-lô, từ này chỉ sự đáp ứng bằng việc vâng theo, chứ không chỉ là nghe.
- source_word: εἰς πάντας ἀφίκετο
  choice: đã được mọi người biết đến
  rationale: Nguyên văn là “đã đến với mọi người”; trong ngữ cảnh, ý nói tiếng về sự vâng phục của họ đã lan truyền rộng rãi. Cách diễn đạt này tự nhiên trong tiếng Việt mà vẫn giữ sắc thái tu từ của πάντας.
- source_word: ἐφ’ ὑμῖν χαίρω
  choice: tôi vui mừng về anh chị em
  rationale: ἐπί với tặng cách có thể nêu đối tượng hoặc nguyên do của niềm vui; “về anh chị em” giữ được độ mở ấy.
- source_word: σοφοὺς ... εἰς τὸ ἀγαθόν
  choice: khôn ngoan đối với điều thiện
  rationale: Diễn tả sự khôn ngoan và khả năng phân định hướng đến điều thiện, đồng thời giữ cấu trúc song song với vế sau.
- source_word: ἀκεραίους ... εἰς τὸ κακόν
  choice: trong sạch đối với điều ác
  rationale: ἀκέραιος có nghĩa căn bản là không pha trộn, nguyên tuyền, do đó có thể mang nghĩa trong sạch, không vương nhiễm; cách dịch này tránh hàm ý ngây thơ hay thiếu hiểu biết.
theological_decisions:
- issue: Phạm vi của πάντας
  choice: “mọi người” theo nghĩa tu từ, chỉ sự nổi tiếng rộng khắp
  alternative: “tất cả các hội thánh” hoặc một khẳng định phổ quát tuyệt đối
  rationale: Bản văn không xác định một nhóm hẹp, nhưng ngữ cảnh cũng không đòi hiểu là từng người không ngoại lệ; giữ “mọi người” bảo toàn cách nói rộng của Phao-lô.
- issue: Sự tương phản giữa σοφούς và ἀκεραίους
  choice: khôn ngoan đối với điều thiện và trong sạch đối với điều ác
  alternative: khôn ngoan về điều thiện và ngây thơ về điều ác
  rationale: Cách dịch bảo toàn sự căng thẳng giữa khả năng phân định tích cực và tình trạng không bị điều ác pha nhiễm, không biến lời khuyên thành yêu cầu thiếu hiểu biết về điều ác.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng vừa phải. Dùng “anh chị em” để diễn đạt số nhiều ὑμῶν/ὑμᾶς một cách tự nhiên và bao quát; giữ liên từ đối lập cùng cấu trúc song song của hai vế đạo đức.
