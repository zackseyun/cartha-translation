id: ROM.16.17
reference: Romans 16:17
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Παρακαλῶ δὲ ὑμᾶς, ἀδελφοί, σκοπεῖν τοὺς τὰς διχοστασίας καὶ τὰ σκάνδαλα παρὰ τὴν διδαχὴν ἣν ὑμεῖς ἐμάθετε ποιοῦντας, καὶ ⸀ἐκκλίνετε ἀπ’ αὐτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/017.yaml
  text: I urge you[a], brothers, to watch out for those who cause divisions and stumbling blocks contrary to the teaching that you learned, and turn away from them.
translation:
  language: vi
  text: Thưa anh em[a], tôi khuyên anh em hãy coi chừng những kẻ gây chia rẽ và tạo cớ vấp ngã, trái với sự dạy dỗ mà anh em đã học; hãy tránh xa họ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể hiểu là “anh chị em”; tiếng Hy Lạp viết “anh em” và rất có thể đang nói với toàn thể hội chúng.
    reason: lexical_alternative
lexical_decisions:
- source_word: Παρακαλῶ
  choice: tôi khuyên
  rationale: Diễn đạt lời kêu gọi mục vụ tha thiết và mạnh mẽ bằng tiếng Việt tự nhiên, không thêm ý thời gian không có trong nguyên văn.
- source_word: ἀδελφοί
  choice: anh em
  rationale: Giữ hình thức xưng hô số nhiều giống đực của tiếng Hy Lạp; trong văn cảnh Phao-lô, cách gọi này rất có thể hướng đến toàn thể hội chúng, điều được giải thích trong chú thích.
- source_word: σκοπεῖν
  choice: hãy coi chừng
  rationale: Thể hiện việc chú ý nhận diện đi kèm sự cảnh giác; tự nhiên hơn cách dịch máy móc như “đánh dấu”.
- source_word: διχοστασίας
  choice: chia rẽ
  rationale: Diễn đạt rõ các sự phân rẽ hoặc phe phái làm rạn nứt cộng đồng.
- source_word: σκάνδαλα
  choice: tạo cớ vấp ngã
  rationale: Giữ hình ảnh ẩn dụ về điều khiến người khác vấp ngã, thay vì thu hẹp nghĩa thành sự xúc phạm.
- source_word: παρὰ τὴν διδαχὴν
  choice: trái với sự dạy dỗ
  rationale: παρά với đối cách ở đây chỉ sự lệch khỏi hoặc chống lại chuẩn mực giáo huấn đã tiếp nhận.
- source_word: ἐμάθετε
  choice: mà anh em đã học
  rationale: Phản ánh trực tiếp động từ chủ động và hành động học hỏi đã diễn ra.
- source_word: ποιοῦντας
  choice: những kẻ gây ... và tạo
  rationale: Chuyển phân từ thành mệnh đề quan hệ tự nhiên trong tiếng Việt, với nghĩa tạo ra các sự chia rẽ và cớ vấp ngã.
- source_word: ἐκκλίνετε ἀπ’ αὐτῶν
  choice: hãy tránh xa họ
  rationale: Truyền đạt mệnh lệnh quay khỏi và không giao kết với những người ấy; giữ sắc thái định hướng của động từ trong lối nói Việt tự nhiên.
theological_decisions:
- issue: Phạm vi đại diện của ἀδελφοί khi nói với hội chúng Rô-ma
  choice: Dùng “anh em” trong chính văn và chú thích rằng lời gọi rất có thể bao gồm cả nam lẫn nữ.
  alternative: Dịch ngay trong chính văn là “anh chị em”.
  rationale: Giữ hình thức giống đực của từ Hy Lạp mà không che khuất phạm vi quy chiếu có khả năng bao gồm toàn thể hội chúng.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Đảo lời xưng hô “Thưa anh em” lên đầu để câu tiếng Việt tự nhiên, đồng thời giữ quan hệ cú pháp và sức nặng của lời khuyên. Dấu chấm phẩy giúp phân biệt mệnh lệnh cảnh giác với mệnh lệnh tránh xa.
