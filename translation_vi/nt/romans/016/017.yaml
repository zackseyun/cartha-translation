  source_fidelity: 'Bản dịch truyền đạt đầy đủ cấu trúc và ý chính của nguyên văn: lời nài khuyên, sự cảnh giác đối với những người gây chia rẽ và cớ vấp ngã trái với giáo huấn đã tiếp nhận, cùng mệnh lệnh tránh họ. “Coi chừng” diễn đạt phù hợp σκοπεῖν; “tránh xa họ” chuyển đạt rõ mệnh lệnh ἐκκλίνετε ἀπ’ αὐτῶν.'
  naturalness: Câu văn tự nhiên trong tiếng Việt hiện đại, trang trọng vừa phải. Cách đưa hô ngữ “Thưa anh em” lên đầu, dùng “tôi khuyên anh em hãy...”, và ngăn hai mệnh lệnh bằng dấu chấm phẩy đều mạch lạc.
  terminology: “Chia rẽ,” “cớ vấp ngã,” và “sự dạy dỗ” là các lựa chọn dễ hiểu, trung thành với trường nghĩa của διχοστασίας, σκάνδαλα và διδαχή. Chú thích cho “anh em” bảo toàn hình thức từ vựng chính văn đồng thời thông tin đúng về phạm vi quy chiếu có khả năng bao gồm cả hội chúng.
