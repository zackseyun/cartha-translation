review_pass:
  verdict: revise
  source_fidelity: Bản dịch giữ đúng mệnh lệnh số nhiều ἀσπάσασθε, năm tên riêng theo thứ tự nguyên văn, và nhóm τοὺς σὺν αὐτοῖς ἀδελφούς. Tuy nhiên, “ở cùng họ” dễ thêm sắc thái cư trú/địa điểm mà σύν chỉ sự cùng/đồng hành; “cùng với họ” sát và trung tính hơn.
  naturalness: “Hãy chào” phù hợp văn phong thư tín hiện đại. Các tên phiên âm nhất quán, và “các anh em cùng với họ” tự nhiên trong một chuỗi lời chào.
  terminology: Giữ “các anh em” là phù hợp với ἀδελφούς giống đực số nhiều và không mở rộng diễn giải thành “anh chị em” hoặc “tín hữu.” Chú thích được chỉnh để nêu rõ cách hiểu quy chiếu cộng đồng thay vì lặp lại gần như nguyên văn cụm chính.
  issues:
