    rationale: σὺν αὐτοῖς nghĩa cơ bản là “cùng với họ”; nguyên văn không khẳng định những người này đang ở hay sống cùng các nhân vật được nêu tên.
  - severity: low
    issue: Chú thích hiện tại đưa ra một phương án gần như đồng nghĩa với bản chính.
    rationale: “đang ở với họ” không tạo một lựa chọn dịch thuật thực chất so với “ở cùng họ”; nên dùng chú thích để làm rõ cách hiểu khả dĩ của cụm từ mà không biến nó thành lời khẳng định.
