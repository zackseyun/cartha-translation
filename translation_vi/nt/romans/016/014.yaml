id: ROM.16.14
reference: Romans 16:14
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀσπάσασθε Ἀσύγκριτον, Φλέγοντα, ⸂Ἑρμῆν, Πατροβᾶν, Ἑρμᾶν⸃ καὶ τοὺς σὺν αὐτοῖς ἀδελφούς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/014.yaml
  text: Greet Asyncritus[a], Phlegon, Hermes, Patrobas, Hermas, and the brothers with them.
translation:
  language: vi
  text: Hãy chào A-syn-cơ-rít, Phơ-lê-gôn, Hẹt-mê, Pát-rô-ba, Hẹt-ma và các anh em cùng với họ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể hiểu: “các anh em thuộc nhóm của họ.” Cụm từ này có lẽ chỉ những người cùng đức tin liên hệ với các nhân vật vừa được nêu tên.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: Hãy chào
  rationale: Mệnh lệnh số nhiều trong danh sách lời chào cuối thư; cách diễn đạt này tự nhiên, ngắn gọn và giữ được lực mệnh lệnh của nguyên văn.
- source_word: Ἀσύγκριτον
  choice: A-syn-cơ-rít
  rationale: Tên riêng được phiên âm sang tiếng Việt, không dịch nghĩa.
- source_word: Φλέγοντα
  choice: Phơ-lê-gôn
  rationale: Tên riêng được phiên âm theo âm Hy Lạp sang tiếng Việt.
- source_word: Ἑρμῆν
  choice: Hẹt-mê
  rationale: Tên riêng được phiên âm và được phân biệt với Ἑρμᾶν ở ngay sau.
- source_word: Πατροβᾶν
  choice: Pát-rô-ba
  rationale: Tên riêng được phiên âm sang tiếng Việt.
- source_word: Ἑρμᾶν
  choice: Hẹt-ma
  rationale: Tên riêng được phiên âm, giữ sự phân biệt với Hẹt-mê.
- source_word: τοὺς σὺν αὐτοῖς ἀδελφούς
  choice: các anh em ở cùng họ
  rationale: Giữ danh từ giống đực số nhiều của nguyên văn và diễn đạt σὺν αὐτοῖς một cách tự nhiên; trong ngữ cảnh này, 'anh em' chỉ những người cùng đức tin gắn với các nhân vật vừa nêu.
theological_decisions:
- issue: Cách dịch ἀδελφούς trong lời chào dành cho một nhóm tín hữu
  choice: các anh em
  alternative: các anh chị em; các tín hữu
  rationale: Nguyên văn dùng danh từ giống đực số nhiều và ngữ cảnh không buộc phải mở rộng thành một nhóm gồm cả nam lẫn nữ. 'Các anh em' vừa giữ hình thức của tiếng Hy Lạp vừa có thể mang nghĩa cộng đồng đức tin trong văn phong thư tín.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng lối phiên âm có gạch nối để người đọc tiếng Việt dễ nhận diện và phát âm các tên Hy Lạp; giữ câu ngắn gọn phù hợp với chuỗi lời chào cuối thư.
