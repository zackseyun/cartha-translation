source:
  edition: robinson-pierpont-2005-byzantine
  text: Τῷ δὲ δυναμένῳ ὑμᾶς στηρίξαι κατὰ τὸ εὐαγγέλιόν μου καὶ τὸ κήρυγμα Ἰησοῦ Χριστοῦ, κατὰ ἀποκάλυψιν μυστηρίου χρόνοις αἰωνίοις σεσιγημένου,
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/025.yaml
  text: '[A] to him who is able to strengthen you according to my gospel and the preaching of Jesus the Messiah, according to the revelation of the mystery kept secret for long ages,'
translation:
  language: vi
  text: '[a] Còn Đấng có thể làm cho anh chị em vững mạnh theo Tin Mừng của tôi và lời công bố về Giê-su, Đấng Mê-si, theo sự mặc khải về mầu nhiệm đã được giữ kín từ bao thời đại,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Các câu 25–27 tạo thành lời chúc tụng kết thư, nhưng xuất hiện ở những vị trí khác nhau trong các bản chép tay cổ. Truyền thống đa số Byzantine đặt đoạn này ở cuối chương 14; bản giấy cói cổ nhất còn tồn tại đặt nó sau chương 15; còn các bản chép tay quan trọng thuộc thế kỷ IV và truyền thống La-tinh đặt nó tại đây, ở cuối chương 16. Một số bản chép tay có đoạn này ở nhiều vị trí, trong khi một vài bản hoàn toàn không có. Phần lớn các bản dịch hiện đại giữ đoạn này tại đây như lời kết thư của Phao-lô.
    reason: textual_critical
lexical_decisions:
- source_word: στηρίξαι
  choice: làm cho anh chị em vững mạnh
  rationale: Diễn đạt hành động củng cố, khiến các tín hữu đứng vững trong đức tin; dạng gây khiến phản ánh ngoại động từ Hy Lạp.
- source_word: τὸ εὐαγγέλιόν μου
  choice: Tin Mừng tôi rao giảng
  rationale: “Tin Mừng của tôi” có thể bị hiểu là một tin mừng do Phao-lô sở hữu hoặc sáng tạo; cách dịch này tự nhiên hơn và nói rõ đây là Tin Mừng ông rao truyền.
- source_word: τὸ κήρυγμα Ἰησοῦ Χριστοῦ
  choice: lời công bố về Chúa Giê-su, Đấng Mê-si
  rationale: Trong văn cảnh, lời công bố có Chúa Giê-su là nội dung. Χριστός được chuyển tải như tước hiệu “Đấng Mê-si”, không như tên riêng.
- source_word: μυστηρίου
  choice: mầu nhiệm
  rationale: Chỉ chân lý từng được che giấu nhưng nay được Đức Chúa Trời bày tỏ, chứ không phải điều bí hiểm mà con người không thể biết.
- source_word: χρόνοις αἰωνίοις σεσιγημένου
  choice: đã được giữ kín suốt những thời đại xa xưa
  rationale: σεσιγημένου theo nghĩa đen là “được giữ im lặng”, nhưng với “mầu nhiệm” thì “giữ kín” là tiếng Việt tự nhiên; χρόνοις αἰωνίοις ở đây chỉ những thời kỳ lâu dài trong quá khứ.
theological_decisions:
- issue: Cách trình bày Χριστός
  choice: Đấng Mê-si
  alternative: Đấng Christ / Ki-tô
  rationale: Giữ rõ nghĩa tước hiệu của từ Hy Lạp, tức Đấng được xức dầu, thay vì khiến độc giả dễ xem đây chỉ là một phần của tên riêng.
- issue: Bổ sung lời dẫn cho thể chúc tụng
  choice: Kính dâng lên Đấng
  alternative: Còn Đấng / Đấng
  rationale: Câu 25–27 là một thể chúc tụng với động từ chính hoàn tất ở câu 27. “Kính dâng lên” giúp tiếng Việt nhận ra cấu trúc ấy mà không khép lại câu tại đây.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại. “Anh chị em” chuyển tải số nhiều ὑμᾶς theo lối bao hàm tự nhiên. Câu được giữ ở dạng chưa hoàn tất và kết thúc bằng dấu phẩy vì thể chúc tụng tiếp tục qua các câu 26–27.
