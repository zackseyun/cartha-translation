revisions:
- from: '[a] Kính dâng lên Đấng có thể làm cho anh chị em vững mạnh theo Tin Mừng tôi rao giảng và lời công bố về Chúa Giê-su, Đấng Mê-si, theo sự mặc khải về mầu nhiệm đã được giữ kín suốt những thời đại xa xưa,'
  to: '[a] Còn Đấng có thể làm cho anh chị em vững mạnh theo Tin Mừng của tôi và lời công bố về Giê-su, Đấng Mê-si, theo sự mặc khải về mầu nhiệm đã được giữ kín từ bao thời đại,'
  rationale: Bản sửa loại bỏ hai yếu tố không được nêu trong câu nguồn («Kính dâng» và «Chúa»), phục hồi sắc thái sở hữu của «Tin Mừng của tôi», và dùng «từ bao thời đại» để diễn đạt tự nhiên χρόνοις αἰωνίοις. Cách hiểu «lời công bố về Giê-su» được giữ vì phù hợp văn cảnh, nhưng không thêm tước hiệu «Chúa».
