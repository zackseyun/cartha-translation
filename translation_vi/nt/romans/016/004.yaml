  text: οἵτινες ὑπὲρ τῆς ψυχῆς μου τὸν ἑαυτῶν τράχηλον ὑπέθηκαν, οἷς οὐκ ἐγὼ μόνος εὐχαριστῶ ἀλλὰ καὶ πᾶσαι αἱ ἐκκλησίαι τῶν ἐθνῶν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/004.yaml
  text: who laid down their own necks for my life[a], to whom not only I give thanks, but also all the churches of the Gentiles[b],
translation:
  language: vi
  text: là những người đã liều cả mạng sống của mình vì mạng sống của tôi; không chỉ riêng tôi biết ơn họ, mà tất cả các hội thánh của dân ngoại cũng vậy.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn có hình ảnh “đã đưa cổ của mình ra,” một thành ngữ chỉ việc tự đặt mình vào nguy hiểm chết người. “Dân ngoại” cũng có thể dịch là “các dân tộc”.
    reason: Giữ lại hình ảnh thành ngữ Hy Lạp và nêu phương án dịch sát chữ của τῶν ἐθνῶν.
lexical_decisions:
- source_word: οἵτινες
  choice: là những người
  rationale: Nối tự nhiên với Prít-ca và A-qui-la ở câu trước, đồng thời giữ chức năng mô tả của mệnh đề quan hệ.
- source_word: ὑπὲρ τῆς ψυχῆς μου
  choice: vì mạng sống của tôi
  rationale: Trong ngữ cảnh nguy hiểm đến tính mạng, ψυχή chỉ sự sống của Phao-lô, không phải riêng phương diện phi vật chất của con người.
- source_word: τὸν ἑαυτῶν τράχηλον ὑπέθηκαν
  choice: đã liều mạng sống mình
  rationale: Nguyên văn có hình ảnh thành ngữ đặt cổ mình dưới hiểm nguy; tiếng Việt tự nhiên diễn đạt ý phơi mình trước nguy cơ chết chóc bằng ‘liều mạng sống mình’, còn hình ảnh nguyên ngữ được ghi chú.
- source_word: οἷς ... εὐχαριστῶ
  choice: tôi biết ơn họ
  rationale: Đây là cách diễn đạt tự nhiên trong tiếng Việt cho động từ εὐχαριστέω đi với đối tượng ở cách dữ.
- source_word: οὐκ ἐγὼ μόνος ... ἀλλὰ καὶ
  choice: không chỉ riêng tôi ... mà ... cũng vậy
  rationale: Giữ sự nhấn mạnh rằng Phao-lô không phải người duy nhất biết ơn họ.
- source_word: πᾶσαι αἱ ἐκκλησίαι
  choice: tất cả các hội thánh
  rationale: Phản ánh danh từ số nhiều có mạo từ và chỉ toàn thể các cộng đoàn được nói đến.
- source_word: τῶν ἐθνῶν
  choice: của dân ngoại
  rationale: Trong cách dùng của Phao-lô, cụm này thường chỉ những người không thuộc dân Do Thái; ‘dân ngoại’ giữ rõ chiều kích Do Thái–dân ngoại trong thư Rô-ma.
theological_decisions:
- issue: Ý nghĩa của ψυχή trong lời Phao-lô
  choice: mạng sống
  alternative: linh hồn
  rationale: Ngữ cảnh nói đến việc tự đặt mình trước nguy hiểm chết người để bảo toàn sự sống của Phao-lô, nên ‘mạng sống’ là nghĩa phù hợp.
- issue: Cách hiểu ἐθνῶν
  choice: dân ngoại
  alternative: các dân tộc
  rationale: Cụm từ tự nhiên nhất chỉ các cộng đồng tín hữu không phải người Do Thái, nhưng nghĩa sát chữ ‘các dân tộc’ vẫn là một khả năng từ vựng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng ‘liều mạng sống mình’ thay cho lối dịch sát chữ khó tự nhiên trong tiếng Việt; giữ ‘hội thánh’ và ‘dân ngoại’ là các thuật ngữ Kinh Thánh thông dụng.
