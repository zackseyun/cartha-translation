  source_fidelity: 'Bản dịch truyền đạt đúng ý chính: Prít-ca và A-qui-la đã tự đặt mình trước nguy hiểm chết người vì sự sống của Phao-lô; không chỉ ông mà mọi hội thánh thuộc dân ngoại đều biết ơn họ. Tuy nhiên, “liều mạng sống mình” thiếu yếu tố phản thân nhấn mạnh của ἑαυτῶν và diễn đạt chưa thật tự nhiên; “liều cả mạng sống của mình” phản ánh rõ hơn việc họ mạo hiểm chính sự sống của mình.'
