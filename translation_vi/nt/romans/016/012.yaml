  to: Hãy chào Try-phê-na và Try-phô-sa, là những người đã lao nhọc trong Chúa.[a] Hãy chào Pẹt-si, người được yêu mến, người đã lao nhọc nhiều trong Chúa.[b]
  rationale: 'Chỉnh sửa chỉ nhằm làm câu tiếng Việt tự nhiên hơn: thay “người được yêu quý” bằng “người được yêu mến” và bỏ sự lặp lại không cần thiết của “là người.” Ý nghĩa, sắc thái không sở hữu của nguyên ngữ, thuật ngữ “trong Chúa,” sự lặp lại của “lao nhọc,” và các ký hiệu chú thích đều được giữ nguyên.'
