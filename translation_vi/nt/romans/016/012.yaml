id: ROM.16.12
reference: Romans 16:12
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀσπάσασθε Τρύφαιναν καὶ Τρυφῶσαν τὰς κοπιώσας ἐν κυρίῳ. ἀσπάσασθε Περσίδα τὴν ἀγαπητήν, ἥτις πολλὰ ἐκοπίασεν ἐν κυρίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/012.yaml
  text: Greet Tryphaena and Tryphosa[a], who have labored in the Lord. Greet Persis, the beloved[b], who has labored much in the Lord.
translation:
  language: vi
  text: Hãy chào Try-phê-na và Try-phô-sa, là những người đã lao nhọc trong Chúa.[a] Hãy chào Pẹt-si, người được yêu mến, người đã lao nhọc nhiều trong Chúa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “là những người làm việc vất vả trong Chúa” hoặc “là những người đã tận lực trong Chúa.”'
    reason: lexical_alternative
  - marker: b
    text: Một số bản dịch diễn đạt là “người yêu quý của tôi”; nhưng tiếng Hy Lạp chỉ viết “người được yêu mến,” không có từ “của tôi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: Hãy chào
  rationale: Động từ mệnh lệnh số nhiều trong danh sách lời chào thư tín được diễn đạt tự nhiên và gọn bằng “Hãy chào”.
- source_word: Τρύφαιναν καὶ Τρυφῶσαν
  choice: Try-phê-na và Try-phô-sa
  rationale: Phiên âm hai tên riêng theo âm dạng Hy Lạp, dùng cách viết có gạch nối để độc giả Việt dễ đọc.
- source_word: τὰς κοπιώσας
  choice: là những người đã lao nhọc
  rationale: Phân từ có mạo từ mô tả hai phụ nữ; “lao nhọc” giữ được ý làm việc khó nhọc, tận lực, đồng thời duy trì sự lặp từ với ἐκοπίασεν ở vế sau.
- source_word: ἐν κυρίῳ
  choice: trong Chúa
  rationale: Giữ nguyên cách diễn đạt giàu ý nghĩa của Phao-lô, bao hàm công việc được thực hiện trong mối liên hệ và phạm vi thuộc về Chúa, thay vì thu hẹp thành chỉ “cho Chúa”.
- source_word: Περσίδα
  choice: Pẹt-si
  rationale: Phiên âm tên riêng từ dạng từ điển Περσίς; dạng Περσίδα trong câu là đối cách.
- source_word: τὴν ἀγαπητήν
  choice: người được yêu quý
  rationale: Diễn đạt ý của tính từ ở thể thụ động mà không thêm đại từ sở hữu “của tôi”, vốn không có trong tiếng Hy Lạp.
- source_word: ἥτις
  choice: là người
  rationale: Nối mệnh đề quan hệ một cách tự nhiên trong tiếng Việt; không cường điệu sắc thái mô tả của đại từ quan hệ.
- source_word: πολλὰ ἐκοπίασεν
  choice: đã lao nhọc nhiều
  rationale: πολλὰ bổ nghĩa về mức độ cho động từ; cách dịch này vừa tự nhiên vừa giữ sự nhấn mạnh rằng Pẹt-si đã tận lực rất nhiều.
theological_decisions:
- issue: Ý nghĩa của ἐν κυρίῳ trong công thức nói về sự phục vụ của Phao-lô
  choice: trong Chúa
  alternative: cho Chúa; trong việc phục vụ Chúa
  rationale: “Trong Chúa” bảo tồn sắc thái về mối liên hệ và phạm vi thuộc linh, không giới hạn cụm từ vào mục đích hay đối tượng phục vụ.
- issue: Có nên thêm ý sở hữu vào τὴν ἀγαπητήν hay không
  choice: người được yêu quý
  alternative: người yêu quý của tôi
  rationale: Bản Hy Lạp không có μου (“của tôi”); vì vậy bản dịch không thêm sắc thái sở hữu hoặc thân mật riêng tư mà câu không nói rõ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Lao nhọc” được dùng ở cả hai vế để bảo tồn sự lặp lại của cùng một động từ Hy Lạp. Các tên riêng được phiên âm nhất quán, không dịch nghĩa.
