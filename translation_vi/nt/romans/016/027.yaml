  text: to the only wise God, through Jesus the Messiah, to whom be the glory forever. Amen.
translation:
  language: vi
  text: thuộc về Đức Chúa Trời, Đấng duy nhất khôn ngoan, qua Đức Giê-su, Đấng Mê-si-a—nguyện vinh quang thuộc về Ngài đời đời. A-men.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Câu này kết thúc lời tôn vinh ở Rô-ma 16:25–27. Như đã ghi chú tại Rô-ma 16:25, vị trí và việc có hay không có lời tôn vinh này khác nhau đáng kể giữa các thủ bản cổ; bản văn này theo truyền thống đa số Byzantine, vốn bảo tồn lời ấy.
    reason: textual_critical
lexical_decisions:
- source_word: μόνῳ
  choice: duy nhất
  rationale: Đi với “Đức Chúa Trời khôn ngoan,” nhấn mạnh rằng chỉ một mình Đức Chúa Trời có sự khôn ngoan tối hậu.
- source_word: σοφῷ
  choice: khôn ngoan
  rationale: Cách diễn đạt tự nhiên và sát nghĩa trong tiếng Việt, mô tả Đức Chúa Trời là Đấng khôn ngoan.
- source_word: διὰ
  choice: qua
  rationale: 'Với sở hữu cách, từ này biểu thị trung gian: lời tôn vinh được dâng qua Đức Giê-su, Đấng Mê-si-a.'
- source_word: Χριστοῦ
  choice: Đấng Mê-si-a
  rationale: Giữ ý nghĩa tước hiệu của Χριστός (“Đấng được xức dầu”) thay vì chỉ phiên âm thành một tên riêng.
- source_word: ᾧ
  choice: Ngài
  rationale: Đại từ quan hệ số ít ở cách dữ liệu được diễn đạt tự nhiên trong mệnh đề chúc tụng; chữ “Ngài” vẫn không buộc phải xác định tiền ngữ là Đức Chúa Trời hay Đức Giê-su.
- source_word: εἰς τοὺς αἰῶνας
  choice: cho đến đời đời
  rationale: Thành ngữ Hy Lạp, nghĩa đen là “đến các thời đại,” thường diễn đạt thời gian vô tận.
theological_decisions:
- issue: Tiền ngữ của ᾧ (“Ngài”)
  choice: Giữ đại từ “Ngài” mà không nêu rõ là Đức Chúa Trời hay Đức Giê-su
  alternative: Diễn giải thành “Đức Chúa Trời, nguyện vinh quang thuộc về Ngài” hoặc “Đức Giê-su, nguyện vinh quang thuộc về Ngài”
  rationale: 'Cú pháp Hy Lạp có độ mơ hồ thực sự: tiền ngữ gần nhất là Đức Giê-su Christ, nhưng cấu trúc lời tôn vinh hướng đến Đức Chúa Trời. Bản dịch không nên âm thầm giải quyết sự căng thẳng này.'
- issue: Cấu trúc câu phụ thuộc vào Rô-ma 16:25–26
  choice: Dùng “thuộc về” để giữ sự nối tiếp của lời tôn vinh bắt đầu ở câu 25
  alternative: 'Biến câu 27 thành một câu độc lập: “Nguyện vinh quang thuộc về Đức Chúa Trời...”'
  rationale: Bản Hy Lạp là phần kết của một câu dài, trong đó “thuộc về Đức Chúa Trời...” hoàn tất cấu trúc tán tụng; giữ nét phụ thuộc này phản ánh nguồn văn sát hơn.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. “Đức Chúa Trời” là cách gọi quen thuộc trong tiếng Việt; “Đấng Mê-si-a” giữ Χριστός như một tước hiệu. Dấu gạch ngang giúp người đọc nhận ra mệnh đề tôn vinh tiếp theo mà không xóa độ mơ hồ của ᾧ.
