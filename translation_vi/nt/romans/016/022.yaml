  text: ἀσπάζομαι ὑμᾶς ἐγὼ Τέρτιος ὁ γράψας τὴν ἐπιστολὴν ἐν κυρίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/022.yaml
  text: I[a], Tertius, who wrote the letter, greet you in the Lord.
translation:
  language: vi
  text: Tôi, Tẹt-ti-út, người đã viết bức thư, xin gửi đến anh chị em lời chào trong Chúa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch, tuy ít khả năng hơn: “Tôi, Tẹt-ti-út, người đã viết bức thư trong Chúa, xin gửi lời chào đến anh chị em.” Cụm từ Hy Lạp “trong Chúa” có thể gắn với “đã viết”, dù tự nhiên hơn khi bổ nghĩa cho lời chào.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀσπάζομαι
  choice: xin gửi lời chào đến
  rationale: Diễn đạt tự nhiên trong phần kết thư tiếng Việt, giữ đúng nghĩa chào thăm mà không thêm mức độ tình cảm không có trong nguyên văn.
- source_word: ὑμᾶς
  choice: anh chị em
  rationale: Đại từ ngôi thứ hai số nhiều chỉ cộng đồng tín hữu. “Anh chị em” tự nhiên trong ngữ cảnh hội thánh và tránh cách xưng hô “các bạn” kém trang trọng.
- source_word: ἐγὼ Τέρτιος
  choice: Tôi là Tẹt-ti-út
  rationale: Giữ sự tự giới thiệu nổi bật do đại từ ἐγώ đi cùng tên riêng, đồng thời diễn đạt tự nhiên trong tiếng Việt.
- source_word: ὁ γράψας
  choice: người đã viết
  rationale: Phản ánh phân từ aorist có mạo từ, xác định Tẹt-ti-út là người thực hiện việc chép thư.
- source_word: τὴν ἐπιστολήν
  choice: thư này
  rationale: “Thư” là từ hiện đại và tự nhiên; “này” làm rõ bức thư đang được nói đến trong tiếng Việt, dù tiếng Hy Lạp dùng mạo từ xác định chứ không có đại từ chỉ định.
- source_word: ἐν κυρίῳ
  choice: trong Chúa
  rationale: Giữ nguyên cách diễn đạt đặc trưng của Phao-lô về mối liên hệ hoặc phạm vi hiệp thông nơi Chúa, không giải thích quá mức.
theological_decisions:
- issue: Phạm vi bổ nghĩa của ἐν κυρίῳ
  choice: 'Gắn “trong Chúa” với lời chào: “xin gửi lời chào đến anh chị em trong Chúa.”'
  alternative: 'Gắn với việc viết thư: “Tôi là Tẹt-ti-út, người đã viết thư này trong Chúa, xin gửi lời chào đến anh chị em.”'
  rationale: Trong ngữ cảnh kết thư, cụm này tự nhiên hơn khi bổ nghĩa cho hành động chào thăm và diễn tả sự hiệp thông trong Chúa. Tuy nhiên, vị trí của cụm từ Hy Lạp cho phép cách gắn với “đã viết,” nên ghi nhận trong chú thích thay vì loại bỏ sự mơ hồ.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “anh chị em” cho đối tượng số nhiều trong cộng đồng tín hữu; phiên âm tên Τέρτιος là “Tẹt-ti-út.”
