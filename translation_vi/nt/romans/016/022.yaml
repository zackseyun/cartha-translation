    issue: “thư này” thêm đại từ chỉ định không có trong nguyên văn.
    rationale: τὴν ἐπιστολήν là “bức thư/thư” có mạo từ xác định, không phải “bức thư này”. Dù ý nghĩa ngữ cảnh không thay đổi đáng kể, bỏ “này” sẽ sát nguồn hơn.
  - severity: low
    issue: Vị trí của “trong Chúa” dễ gợi nghĩa “anh chị em [là những người] trong Chúa”.
    rationale: Theo cách đọc ưu tiên trong hồ sơ tiếng Anh, ἐν κυρίῳ bổ nghĩa cho hành vi/lời chào. Đặt cụm này trực tiếp sau “lời chào” làm rõ quan hệ này hơn trong tiếng Việt.
