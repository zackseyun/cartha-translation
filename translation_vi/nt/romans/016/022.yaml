  to: Tôi, Tẹt-ti-út, người đã viết bức thư, xin gửi đến anh chị em lời chào trong Chúa.[a]
  rationale: Sửa “thư này” thành “bức thư” để không thêm yếu tố chỉ định. Điều chỉnh trật tự câu để “trong Chúa” liên hệ tự nhiên hơn với “lời chào”, theo cách đọc ưu tiên, đồng thời giữ chú thích về cách gắn thay thế có thể có trong tiếng Hy Lạp.
