id: ROM.16.15
reference: Romans 16:15
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀσπάσασθε Φιλόλογον καὶ Ἰουλίαν, Νηρέα καὶ τὴν ἀδελφὴν αὐτοῦ, καὶ Ὀλυμπᾶν καὶ τοὺς σὺν αὐτοῖς πάντας ἁγίους.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/015.yaml
  text: Greet Philologus and Julia[a], Nereus and his sister, and Olympas and all the saints with them.
translation:
  language: vi
  text: Hãy gửi lời chào đến Phi-lô-lô-gơ và Giu-li-a[a], Nê-rê và người chị hoặc em gái của ông ấy, Ô-lim-pa, cùng tất cả các thánh ở với họ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hoặc có thể là “Giu-li-át” nếu hiểu đây là tên nam; dạng Hy Lạp thường được hiểu là tên nữ “Giu-li-a.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: Hãy gửi lời chào đến
  rationale: Mệnh lệnh aorist ngôi thứ hai số nhiều, trong văn thư mang nghĩa truyền đạt lời chào; cách diễn đạt này tự nhiên và rõ nghĩa trong tiếng Việt.
- source_word: Φιλόλογον
  choice: Phi-lô-lô-gơ
  rationale: Tên riêng được phiên âm sang tiếng Việt theo âm dạng Hy Lạp.
- source_word: Ἰουλίαν
  choice: Giu-li-a
  rationale: Dạng đối cách này tự nhiên nhất được hiểu là tên nữ Julia; khả năng coi đây là tên nam được ghi ở chú thích.
- source_word: Νηρέα
  choice: Nê-rê
  rationale: Tên riêng được phiên âm sang tiếng Việt theo âm dạng Hy Lạp.
- source_word: τὴν ἀδελφὴν αὐτοῦ
  choice: chị em gái của ông
  rationale: ἀδελφή nghĩa là chị hoặc em gái; tiếng Hy Lạp không cho biết người này lớn hay nhỏ tuổi hơn Nê-rê, nên dùng cụm từ giữ nguyên sự không xác định ấy.
- source_word: Ὀλυμπᾶν
  choice: Ô-lim-pa
  rationale: Tên riêng được phiên âm từ dạng Hy Lạp Ὀλυμπᾶς.
- source_word: τοὺς σὺν αὐτοῖς
  choice: ở với họ
  rationale: σύν với tặng cách chỉ sự liên kết hoặc đồng hành; cách dịch ngắn gọn này phù hợp ngữ cảnh nhóm tín hữu liên hệ với những người vừa được nêu tên.
- source_word: πάντας ἁγίους
  choice: tất cả các thánh đồ
  rationale: Trong thư Phao-lô, ἅγιοι là cách gọi các tín hữu thuộc về Đức Chúa Trời; “thánh đồ” giữ được thuật ngữ quen thuộc mà không thêm ý niệm phong thánh về sau.
theological_decisions:
- issue: Cách dịch ἅγιοι trong danh sách chào thăm của Phao-lô
  choice: các thánh đồ
  alternative: những người thánh; dân thánh của Đức Chúa Trời
  rationale: Cụm từ chỉ các tín hữu ở cùng những người được nêu tên. “Các thánh đồ” giữ cách gọi cộng đồng tín hữu quen thuộc trong Phao-lô và không cần diễn giải thêm.
- issue: Giới tính của tên Ἰουλίαν
  choice: Giu-li-a
  alternative: Giu-li-át, nếu hiểu là tên nam
  rationale: Theo hình thái và cách dùng tên riêng thông thường, đây rất có thể là tên nữ Julia. Tuy vậy, truyền thống dịch thuật từng nêu khả năng tên nam, nên phương án ấy được bảo lưu trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Các tên riêng được phiên âm nhất quán; “chị em gái” được dùng để tránh xác định tuổi tác mà nguyên văn không cho biết.
