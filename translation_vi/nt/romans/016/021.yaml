source:
  edition: SBLGNT
  text: ⸀Ἀσπάζεται ὑμᾶς Τιμόθεος ὁ συνεργός μου, καὶ Λούκιος καὶ Ἰάσων καὶ Σωσίπατρος οἱ συγγενεῖς μου.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/021.yaml
  text: Timothy[a], my fellow worker, greets you, and so do Lucius and Jason and Sosipater, my kinsmen.
translation:
  language: vi
  text: Ti-mô-thê, người cộng tác với tôi, gửi lời chào anh chị em; Lu-xi-út, Gia-sôn và Sô-xi-pa-tơ, những người bà con của tôi[a], cũng gửi lời chào anh chị em.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “những người họ hàng của tôi” hoặc “những người đồng bào Do Thái với tôi.” Từ Hy Lạp có thể chỉ quan hệ gia đình hoặc mối liên hệ bà con, đồng tộc rộng hơn.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀσπάζεται
  choice: gửi lời chào
  rationale: Trong văn thư, ἀσπάζομαι thường có nghĩa là chào hoặc gửi lời chào. Cách diễn đạt này tự nhiên trong tiếng Việt và phù hợp với lời chào được chuyển đến từ xa.
- source_word: ὑμᾶς
  choice: anh chị em
  rationale: Đại từ ngôi thứ hai số nhiều chỉ toàn thể các tín hữu nhận thư. “Anh chị em” diễn đạt rõ số nhiều và thích hợp với lối xưng hô cộng đồng Cơ Đốc trong tiếng Việt hiện đại.
- source_word: συνεργός
  choice: người cùng làm việc
  rationale: Từ này chỉ người cộng tác trong một công việc chung. Cách dịch tránh sắc thái công sở của “đồng nghiệp” và giữ được nghĩa rộng về sự cộng tác trong chức vụ.
- source_word: Λούκιος
  choice: Lu-xi-út
  rationale: Phiên âm tên riêng Hy Lạp theo cách đọc rõ ràng, quen thuộc trong tiếng Việt.
- source_word: Ἰάσων
  choice: Gia-sôn
  rationale: Phiên âm tên riêng theo hình thức quen dùng trong tiếng Việt.
- source_word: Σωσίπατρος
  choice: Sô-xi-pa-tơ
  rationale: Phiên âm trực tiếp dạng tên Σωσίπατρος trong câu này, không thay bằng dạng rút gọn Sopater.
- source_word: συγγενεῖς
  choice: những người bà con
  rationale: “Bà con” có thể chỉ người có quan hệ họ hàng hoặc, trong một số ngữ cảnh, quan hệ đồng tộc rộng hơn, nên phần nào bảo tồn độ mở của từ Hy Lạp; chú thích nêu rõ các khả năng.
theological_decisions:
- issue: Ý nghĩa của συγγενεῖς μου trong cách dùng của Phao-lô
  choice: những người bà con của tôi
  alternative: những người họ hàng của tôi; những người đồng bào Do Thái với tôi
  rationale: Từ Hy Lạp có thể nói đến quan hệ gia đình hoặc mối liên hệ bà con/đồng tộc rộng hơn. Câu này không xác định rõ, vì vậy bản dịch chính dùng cách nói tương đối rộng và chú thích các cách hiểu thay thế.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “anh chị em” để biểu thị rõ đối tượng số nhiều; cấu trúc “cũng vậy” phản ánh καί mà không lặp lại cụm “gửi lời chào” một cách nặng nề.
