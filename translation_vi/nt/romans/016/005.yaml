    rationale: αὐτῶν nghĩa là “của họ”. Trong tiếng Việt chuẩn, “nhà họ” có thể bị hiểu là nhà của một dòng họ hoặc cách nói rút gọn không phù hợp ở đây. “Nhà của họ” vừa rõ vừa sát nghĩa.
