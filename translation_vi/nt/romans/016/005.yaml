id: ROM.16.5
reference: Romans 16:5
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ τὴν κατ’ οἶκον αὐτῶν ἐκκλησίαν. ἀσπάσασθε Ἐπαίνετον τὸν ἀγαπητόν μου, ὅς ἐστιν ἀπαρχὴ τῆς ⸀Ἀσίας εἰς Χριστόν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/005.yaml
  text: Also greet the church in their house[a]. Greet Epaenetus, my beloved[c][b], who is the firstfruits of Asia for Messiah.
translation:
  language: vi
  text: Cũng hãy chào hội thánh nhóm tại nhà của họ.[a] Hãy chào Ê-bai-nết, người yêu dấu của tôi, là trái đầu mùa của A-si-a[b] dành cho Đấng Mê-si-a.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “hội thánh tại nhà của họ.”'
    reason: lexical_alternative
  - marker: b
    text: Tức là tỉnh A-si-a thuộc Đế quốc La Mã, không phải châu Á ngày nay.
    reason: cultural_note
  - marker: c
    text: 'Ý của cả cụm từ có thể là: “người đầu tiên ở A-si-a tin Đấng Mê-si-a.”'
    reason: alternative_reading
lexical_decisions:
- source_word: κατ’ οἶκον αὐτῶν ἐκκλησίαν
  choice: hội thánh tại nhà họ
  rationale: Giữ sát cấu trúc Hy Lạp, chỉ hội chúng gắn với và nhóm tại nhà của họ, đồng thời diễn đạt tự nhiên trong tiếng Việt.
- source_word: ἀσπάσασθε
  choice: hãy chào
  rationale: Trong danh sách lời chào của thư tín, động từ này có nghĩa tự nhiên và trực tiếp là gửi lời chào đến một người hay một hội chúng.
- source_word: Ἐπαίνετον
  choice: Ê-bai-nết
  rationale: Phiên âm tên riêng Hy Lạp theo lối quen thuộc, dễ đọc đối với độc giả tiếng Việt.
- source_word: ἀγαπητόν μου
  choice: người yêu dấu của tôi
  rationale: Truyền đạt tình cảm cá nhân ấm áp của Phao-lô, với văn phong trang trọng nhưng vẫn dễ hiểu.
- source_word: ἀπαρχὴ
  choice: trái đầu mùa
  rationale: Giữ hình ảnh nông nghiệp và sắc thái dâng hiến của từ Hy Lạp, thay vì giải nghĩa thẳng thành người tin đầu tiên.
- source_word: τῆς Ἀσίας
  choice: của A-si-a
  rationale: Giữ quan hệ sở thuộc của cách Hy Lạp; chú thích làm rõ đây là tỉnh A-si-a thuộc La Mã, không phải châu Á hiện đại.
- source_word: εἰς Χριστόν
  choice: dành cho Đấng Mê-si-a
  rationale: Trong kết cấu với 'trái đầu mùa', εἰς có thể diễn tả hướng đến hoặc mối liên hệ; 'dành cho' vừa tự nhiên vừa giữ được hình ảnh phần đầu mùa được biệt riêng.
theological_decisions:
- issue: Cách dịch Χριστόν
  choice: Đấng Mê-si-a
  alternative: Đấng Christ
  rationale: Χριστός ở đây vẫn mang chức năng tước hiệu. 'Đấng Mê-si-a' nêu rõ ý nghĩa của tước hiệu mà không thêm sắc thái giáo phái.
- issue: Ý nghĩa của ἀπαρχὴ τῆς Ἀσίας εἰς Χριστόν
  choice: là trái đầu mùa của A-si-a dành cho Đấng Mê-si-a
  alternative: là người đầu tiên tại A-si-a tin Đấng Mê-si-a
  rationale: Bản chính giữ nguyên ẩn dụ 'trái đầu mùa' và sự linh hoạt của εἰς, không âm thầm thu hẹp câu thành một lời khẳng định đơn thuần về người cải đạo đầu tiên; cách hiểu giải nghĩa được ghi ở chú thích.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “hội thánh” cho ἐκκλησία, giữ ẩn dụ “trái đầu mùa,” và dùng tước hiệu “Đấng Mê-si-a.” Các dấu chú thích [a], [b], [c] đều được đặt ngay trong bản văn.
