revisions:
- from: Cũng hãy chào hội thánh tại nhà họ.[a] Hãy chào Ê-bai-nết, người yêu dấu của tôi, là trái đầu mùa của A-si-a[b] dành cho Đấng Mê-si-a.[c]
  to: Cũng hãy chào hội thánh nhóm tại nhà của họ.[a] Hãy chào Ê-bai-nết, người yêu dấu của tôi, là trái đầu mùa của A-si-a[b] dành cho Đấng Mê-si-a.[c]
  rationale: Sửa “tại nhà họ” thành “nhóm tại nhà của họ” để bản văn chính tự nhiên, rõ nghĩa và vẫn phù hợp với cách hiểu thông thường của cụm κατ’ οἶκον αὐτῶν ἐκκλησίαν. Chú thích [a] bảo tồn phương án sát chữ “hội thánh tại nhà của họ”. Điều chỉnh nhẹ chú thích [c] cho tiếng Việt tự nhiên hơn, không thay đổi mức độ dè dặt cần có đối với cách giải nghĩa cụm ἀπαρχὴ τῆς Ἀσίας εἰς Χριστόν.
