  text: ἀσπάσασθε Οὐρβανὸν τὸν συνεργὸν ἡμῶν ἐν Χριστῷ καὶ Στάχυν τὸν ἀγαπητόν μου.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/009.yaml
  text: Greet Urbanus[a], our fellow worker in Messiah, and Stachys, my beloved.
translation:
  language: vi
  text: Hãy chào thăm U-rơ-ban, người cùng làm việc với chúng tôi trong Đấng Christ, và Sta-chít, người yêu dấu của tôi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: Hãy gửi lời chào đến
  rationale: Động từ mệnh lệnh số nhiều trong danh sách chào thăm được diễn đạt tự nhiên và trang trọng bằng “Hãy gửi lời chào đến”.
- source_word: Οὐρβανὸν
  choice: U-rơ-ban
  rationale: Phiên âm tên riêng theo cách đọc dễ tiếp cận đối với độc giả Việt hiện đại.
- source_word: συνεργὸν ἡμῶν
  choice: người cùng làm việc với chúng tôi
  rationale: Diễn đạt rõ ý người cộng tác chung với Phao-lô và các bạn đồng hành, đồng thời giữ đại từ số nhiều ἡμῶν.
- source_word: ἐν Χριστῷ
  choice: trong Đấng Christ
  rationale: Cụm từ chỉ phạm vi hoặc sự liên kết với Χριστός; “Đấng Christ” vừa giữ sắc thái tước hiệu vừa quen thuộc trong tiếng Việt.
- source_word: Στάχυν
  choice: Sta-chít
  rationale: Phiên âm tên riêng Hy Lạp theo hình thức dễ đọc trong tiếng Việt.
- source_word: ἀγαπητόν μου
  choice: người yêu dấu của tôi
  rationale: Giữ được tình cảm nồng ấm và mối liên hệ từ vựng với nhóm từ chỉ tình yêu, không diễn giải quá mức.
theological_decisions:
- issue: Cách dịch Χριστῷ trong ἐν Χριστῷ
  choice: Đấng Christ
  alternative: Đấng Mê-si-a
  rationale: Trong cụm cố định “trong Đấng Christ”, cách dịch này tự nhiên trong tiếng Việt và vẫn thể hiện Χριστός là tước hiệu, không làm mất sắc thái về phạm vi hay sự hiệp nhất.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu; giữ cấu trúc lời chào của nguyên văn, không thêm diễn giải thần học.
