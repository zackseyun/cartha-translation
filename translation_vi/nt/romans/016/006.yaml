  to: Hãy gửi lời chào đến Ma-ri[a], người đã làm việc rất vất vả cho anh chị em.
  rationale: Chỉ thay giới từ để tránh sắc thái nguyên nhân không chủ ý của “vì” và phản ánh rõ hơn εἰς ὑμᾶς là công việc hướng đến người nhận. Chú thích được điều chỉnh tương ứng, vẫn nêu các dị bản “cho chúng tôi” và “giữa anh chị em.”
