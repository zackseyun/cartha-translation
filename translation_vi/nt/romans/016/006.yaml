  text: ἀσπάσασθε ⸀Μαριάμ, ἥτις πολλὰ ἐκοπίασεν εἰς ⸀ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/006.yaml
  text: Greet Mary[a], who has worked very hard for you.
translation:
  language: vi
  text: Hãy gửi lời chào đến Ma-ri[a], người đã làm việc rất vất vả cho anh chị em.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Một số thủ bản chép “cho chúng tôi” hoặc “giữa anh chị em” thay cho “cho anh chị em.”
    reason: textual_variant
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: Hãy gửi lời chào đến
  rationale: Mệnh lệnh số nhiều dùng trong thư tín để chuyển lời chào; cách diễn đạt này tự nhiên, rõ ràng trong tiếng Việt hiện đại.
- source_word: Μαριάμ
  choice: Ma-ri
  rationale: Dùng dạng tên quen thuộc trong truyền thống Kinh Thánh tiếng Việt, đồng thời phản ánh tên riêng Hy Lạp Μαριάμ.
- source_word: ἥτις
  choice: người
  rationale: Đại từ quan hệ mở đầu mệnh đề mô tả Ma-ri; “người” nối câu tự nhiên mà không cường điệu sắc thái định tính vốn không cần biểu đạt riêng.
- source_word: πολλὰ ἐκοπίασεν
  choice: đã làm việc rất vất vả
  rationale: κοπιάω chỉ sự lao nhọc, còn πολλὰ bổ nghĩa về mức độ; cụm này vừa tự nhiên vừa giữ được ý làm việc nhiều và nhọc nhằn.
- source_word: εἰς ὑμᾶς
  choice: vì anh chị em
  rationale: εἰς với đại từ chỉ người ở đây hợp lý nhất là diễn đạt hướng đến lợi ích của người nhận. “Vì anh chị em” tự nhiên hơn “cho anh chị em” trong ngữ cảnh lao nhọc phục vụ.
theological_decisions:
- issue: Dị bản ở cụm cuối câu
  choice: vì anh chị em
  alternative: vì chúng tôi; giữa anh chị em
  rationale: Bản SBLGNT được cung cấp đọc εἰς ὑμᾶς, chỉ sự lao nhọc vì lợi ích của người nhận. Các dị bản εἰς ἡμᾶς và ἐν ὑμῖν được giữ trong chú thích thay vì hòa lẫn vào chính văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Anh chị em” biểu đạt đại từ số nhiều ὑμᾶς theo cách bao quát, tự nhiên trong cộng đồng tín hữu; chính văn giữ câu ngắn gọn của lời chào trong thư tín.
