review_pass:
  verdict: revise
  source_fidelity: Bản dịch theo đúng mệnh lệnh số nhiều ἀσπάσασθε, tên Μαριάμ, mệnh đề quan hệ mô tả, và ý lao nhọc mạnh của πολλὰ ἐκοπίασεν. Tuy nhiên, “vì anh chị em” có thể được hiểu là nguyên nhân (“do anh chị em gây ra”) thay vì công việc hướng đến/lợi ích của họ, trong khi εἰς ὑμᾶς ở bản SBLGNT cần được diễn đạt rõ là “cho anh chị em.”
  naturalness: “Hãy gửi lời chào đến Ma-ri” và “người đã làm việc rất vất vả” là tự nhiên, trang trọng vừa phải trong tiếng Việt hiện đại. Thay “vì anh chị em” bằng “cho anh chị em” giúp câu rõ nghĩa hơn mà vẫn ngắn gọn.
  terminology: “Ma-ri” là dạng tên Kinh Thánh Việt ngữ quen thuộc. “Anh chị em” là cách xưng hô cộng đồng phù hợp cho đại từ số nhiều ὑμᾶς. Không có thuật ngữ thần học chuyên biệt cần điều chỉnh.
  issues:
  - severity: medium
    issue: Cụm “vì anh chị em” không biểu đạt đủ rõ εἰς ὑμᾶς.
    rationale: Trong tiếng Việt, “làm việc vất vả vì anh chị em” có thể hàm ý anh chị em là nguyên nhân của sự vất vả. Bản Hy Lạp được cung cấp diễn tả lao nhọc hướng đến hoặc vì lợi ích của người nhận; “cho anh chị em” giữ hướng nghĩa này rõ hơn.
  revised_text: Hãy gửi lời chào đến Ma-ri[a], người đã làm việc rất vất vả cho anh chị em.
