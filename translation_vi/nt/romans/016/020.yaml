id: ROM.16.20
reference: Romans 16:20
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὁ δὲ θεὸς τῆς εἰρήνης συντρίψει τὸν Σατανᾶν ὑπὸ τοὺς πόδας ὑμῶν ἐν τάχει. ἡ χάρις τοῦ κυρίου ἡμῶν Ἰησοῦ ⸀Χριστοῦ μεθ’ ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/020.yaml
  text: And the God of peace will soon crush Satan under your feet[a]. The grace of our Lord Jesus Christ be with you.
translation:
  language: vi
  text: Còn Đức Chúa Trời của sự bình an sẽ sớm nghiền nát Sa-tan dưới chân anh chị em. Nguyện ân điển của Chúa chúng ta, Giê-su Đấng Mê-si-a, ở cùng anh chị em.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δὲ θεὸς τῆς εἰρήνης
  choice: Nhưng Đức Chúa Trời bình an
  rationale: Giữ danh xưng theo cấu trúc thuộc cách của nguyên văn và cách diễn đạt quen thuộc trong văn phong Kinh Thánh tiếng Việt; δὲ được thể hiện bằng “Nhưng” để nối ý tương phản với lời cảnh báo trước đó.
- source_word: συντρίψει
  choice: sẽ ... nghiền nát
  rationale: Thì tương lai diễn tả hành động chắc chắn sẽ xảy ra; “nghiền nát” truyền đạt mạnh sắc thái đập tan hoàn toàn và phù hợp với hình ảnh chiến thắng dưới chân.
- source_word: τὸν Σατανᾶν
  choice: Sa-tan
  rationale: Giữ dưới dạng tên riêng phiên âm theo cách dùng Tân Ước phổ biến, thay vì dịch diễn giải là “Kẻ Đối Nghịch”.
- source_word: ὑπὸ τοὺς πόδας ὑμῶν
  choice: dưới chân anh chị em
  rationale: Giữ nguyên hình ảnh khuất phục và chiến thắng. “Anh chị em” biểu đạt đại từ số nhiều, hướng đến toàn thể cộng đồng tín hữu.
- source_word: ἐν τάχει
  choice: sớm
  rationale: Trong ngữ cảnh này, cụm từ chủ yếu chỉ sự gần kề về thời gian; “sớm” tự nhiên hơn cách hiểu chỉ tốc độ hành động.
- source_word: ἡ χάρις
  choice: Ân điển
  rationale: Giữ thuật ngữ thần học chủ chốt của Phao-lô trong công thức chúc phước, không diễn giải thành một ý nghĩa hẹp hơn.
- source_word: τοῦ κυρίου ἡμῶν
  choice: của Chúa chúng ta
  rationale: Phản ánh thuộc cách chỉ sự liên hệ sở hữu trong công thức “ân điển của Chúa chúng ta”.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Chúa Giê-su, Đấng Mê-si-a
  rationale: Diễn đạt Χριστός theo nghĩa tước hiệu “Đấng Mê-si-a”, đồng thời dùng dấu phẩy để câu tiếng Việt rõ và tự nhiên; thêm “Chúa” trước Giê-su theo lối xưng kính phù hợp với κύριος đứng trước toàn cụm.
- source_word: μεθ’ ὑμῶν
  choice: ở cùng anh chị em
  rationale: Bổ sung động từ “ở” vốn được hàm ý trong câu chúc phước tiếng Hy Lạp, tạo câu tiếng Việt tự nhiên mà không thay đổi nội dung.
theological_decisions:
- issue: Cách dịch Χριστοῦ trong lời chúc phước kết thúc
  choice: Đấng Mê-si-a
  alternative: Christ
  rationale: Trong cụm này, Χριστός vẫn có thể được nghe như một tước hiệu gắn với Giê-su. Bản chính vì thế nêu rõ nghĩa “Đấng Mê-si-a”, còn cách gọi truyền thống “Christ” được giữ trong chú thích để không che khuất truyền thống dịch thuật và sắc thái có thể đã trở nên gần với tên riêng.
- issue: Chủ thể thực hiện chiến thắng và sự tham dự của cộng đồng
  choice: Đức Chúa Trời nghiền nát Sa-tan dưới chân anh chị em
  alternative: Đức Chúa Trời ban năng lực để anh chị em tự nghiền nát Sa-tan
  rationale: Ngữ pháp đặt Đức Chúa Trời làm chủ thể của động từ, còn “dưới chân anh chị em” nói đến vị trí chiến thắng của cộng đồng. Bản dịch không biến cộng đồng thành chủ thể độc lập, cũng không xóa bỏ việc họ được dự phần trong chiến thắng ấy.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại, dùng “anh chị em” để thể hiện rõ đối tượng số nhiều và tính cộng đồng. Câu giữ hình ảnh mạnh “nghiền nát ... dưới chân” của nguyên văn. Danh xưng “Đức Chúa Trời bình an” được giữ ngắn gọn theo lối nói Kinh Thánh quen thuộc; “Đấng Mê-si-a” giúp độc giả hiện đại nhận ra Χριστός là tước hiệu.
