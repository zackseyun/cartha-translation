id: ROM.16.3
reference: Romans 16:3
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἀσπάσασθε Πρίσκαν καὶ Ἀκύλαν τοὺς συνεργούς μου ἐν Χριστῷ Ἰησοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/003.yaml
  text: Greet Prisca and Aquila[a], my fellow workers in Messiah Jesus[b],
translation:
  language: vi
  text: Hãy gửi lời chào đến Prisca và Aquila[a], những người cùng làm việc với tôi trong Đấng Mê-si-a Jesus[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Prisca là dạng tên trong câu Hy Lạp này; Priscilla là dạng quen thuộc hơn, được dùng ở những chỗ khác để chỉ cùng một người.
    reason: alternative_reading
  - marker: b
    text: 'Cũng có thể dịch: “trong Đấng Christ Jesus.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀσπάσασθε
  choice: Hãy gửi lời chào đến
  rationale: Mệnh lệnh số nhiều trong lối thư tín, yêu cầu cộng đồng chuyển lời chào; cách diễn đạt này tự nhiên và rõ nghĩa trong tiếng Việt hiện đại.
- source_word: Πρίσκαν
  choice: Prisca
  rationale: Giữ đúng dạng tên Πρίσκα trong bản Hy Lạp thay vì đổi sang dạng quen thuộc hơn là Priscilla.
- source_word: Ἀκύλαν
  choice: Aquila
  rationale: Phiên âm theo dạng tên riêng Hy Lạp Ἀκύλας.
- source_word: τοὺς συνεργούς μου
  choice: những người cùng làm việc với tôi
  rationale: Diễn đạt quan hệ cộng tác trong công việc chung, đồng thời cho thấy cả Prisca lẫn Aquila đều được Phao-lô gọi như vậy.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: trong Đấng Mê-si-a Jesus
  rationale: Giữ giới từ chỉ phạm vi hay sự liên hiệp “trong” và chuyển Χριστός theo nghĩa tước hiệu Mê-si-a; không giải quyết quá mức sắc thái hàm chứa của ἐν.
theological_decisions:
- issue: Cách chuyển Χριστῷ trong công thức ἐν Χριστῷ Ἰησοῦ
  choice: Đấng Mê-si-a
  alternative: Đấng Christ
  rationale: Χριστός vẫn mang nội dung tước hiệu của Jesus trong cụm này. “Đấng Mê-si-a” làm rõ nghĩa tước hiệu; dạng truyền thống “Đấng Christ” được ghi ở chú thích.
- issue: Ý nghĩa của ἐν trong ἐν Χριστῷ Ἰησοῦ
  choice: trong
  alternative: thuộc về / phục vụ trong sự hiệp nhất với
  rationale: Bản dịch sát “trong” bảo toàn độ rộng thần học của cụm từ, có thể chỉ phạm vi, mối liên hệ hoặc sự hiệp nhất, thay vì thu hẹp vào một cách giải thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Hãy gửi lời chào đến” theo lối thư tín tự nhiên; giữ các tên Prisca, Aquila và Jesus theo định hướng phiên chuyển tên riêng, đồng thời dùng “Đấng Mê-si-a” cho tước hiệu Χριστός.
