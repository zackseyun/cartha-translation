reference: Romans 15:30
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Παρακαλῶ δὲ ὑμᾶς, ἀδελφοί, διὰ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ καὶ διὰ τῆς ἀγάπης τοῦ πνεύματος συναγωνίσασθαί μοι ἐν ταῖς προσευχαῖς ὑπὲρ ἐμοῦ πρὸς τὸν θεόν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/030.yaml
  text: I urge you[a], brothers, through our Lord Jesus the Messiah and through the love of the Spirit, to strive together with me in prayers to God for me[c][b],
translation:
  language: vi
  text: Thưa anh em[a], tôi tha thiết kêu gọi anh em, vì Chúa chúng ta là Đức Giê-su, Đấng Mê-si-a[b], và vì tình yêu của Thánh Linh[c], hãy cùng tôi hết sức chiến đấu trong những lời cầu nguyện dâng lên Đức Chúa Trời cho tôi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Anh em” có hình thức giống đực số nhiều trong tiếng Hy Lạp và có thể ngỏ với toàn thể cộng đồng tín hữu, tức cả anh em và chị em.
    reason: lexical_alternative
  - marker: b
    text: Hay “Đấng Christ”. Từ Hy Lạp Christos là một tước hiệu có nghĩa là “Đấng được xức dầu” hay “Đấng Mê-si-a”.
    reason: alternative_reading
  - marker: c
    text: “Tình yêu của Thánh Linh” cũng có thể được hiểu là tình yêu Thánh Linh dành cho người khác hoặc tình yêu do Thánh Linh tạo nên; cấu trúc sở hữu cách trong tiếng Hy Lạp không xác định duy nhất một nghĩa.
    reason: alternative_reading
lexical_decisions:
- source_word: Παρακαλῶ
  choice: tôi khẩn khoản nài xin
  rationale: Diễn đạt lời kêu gọi tha thiết và mạnh mẽ trong ngữ cảnh, tự nhiên hơn lối dịch quá nhẹ là “tôi xin”.
- source_word: δὲ
  choice: không dịch thành một từ riêng
  rationale: δέ đánh dấu bước chuyển nhẹ trong diễn ngôn; tiếng Việt không cần thêm “bây giờ” hay một liên từ đối lập, vì như vậy dễ tạo sắc thái không có trong nguyên văn.
- source_word: ἀδελφοί
  choice: anh em
  rationale: Giữ hình thức hô cách giống đực số nhiều của Hy Lạp; trong cách dùng cộng đồng, từ này có thể bao gồm cả nam lẫn nữ, được ghi rõ ở chú thích.
- source_word: διὰ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ
  choice: bởi Chúa chúng ta là Đức Giê-su, Đấng Mê-si-a
  rationale: “Bởi” diễn đạt cơ sở hoặc phương tiện của lời kêu gọi và giữ được sự lặp lại của διά; Χριστός được dịch theo nghĩa tước hiệu là “Đấng Mê-si-a”.
- source_word: ἀγάπης τοῦ πνεύματος
  choice: tình yêu của Thánh Linh
  rationale: Giữ nguyên cấu trúc sở hữu cách, không quyết định thay độc giả rằng đó là tình yêu Thánh Linh dành cho người khác hay tình yêu do Thánh Linh tạo nên.
- source_word: συναγωνίσασθαί μοι
  choice: hãy cùng tôi hết sức chiến đấu
  rationale: Truyền đạt cả tiền tố chỉ sự cùng tham gia và sắc thái nỗ lực quyết liệt của động từ.
- source_word: ἐν ταῖς προσευχαῖς
  choice: trong những lời cầu nguyện
  rationale: Giữ số nhiều và không thêm đại từ sở hữu “của anh em”, vốn không xuất hiện trong nguyên văn.
- source_word: ὑπὲρ ἐμοῦ πρὸς τὸν θεόν
  choice: dâng lên Đức Chúa Trời cho tôi
  rationale: Diễn đạt hướng của lời cầu nguyện về Đức Chúa Trời và tính chất cầu thay cho Phao-lô bằng tiếng Việt tự nhiên.
theological_decisions:
- issue: Chủ thể được nói đến trong τοῦ πνεύματος
  choice: Thánh Linh
  alternative: tâm linh con người hoặc “linh” theo nghĩa phi nhân vị
  rationale: Trong cách dùng của Phao-lô và trong cấu trúc này, từ này nhiều khả năng chỉ Thánh Linh; viết hoa thể hiện nhận định ấy.
- issue: Quan hệ sở hữu cách trong ἀγάπης τοῦ πνεύματος
  choice: tình yêu của Thánh Linh
  alternative: tình yêu Thánh Linh dành cho người khác; tình yêu do Thánh Linh tạo nên
  rationale: Nguyên văn cho phép nhiều cách hiểu; bản dịch chính giữ sự mơ hồ thay vì giải quyết nó theo một hướng thần học riêng.
- issue: Cách dịch Χριστοῦ
  choice: Đấng Mê-si-a
  alternative: Đấng Christ
  rationale: Χριστός tại đây là tước hiệu “Đấng được xức dầu”; “Đấng Mê-si-a” làm rõ chức năng tước hiệu, còn cách gọi truyền thống được nêu trong chú thích.
- issue: Phạm vi của ἀδελφοί
  choice: anh em
  alternative: anh chị em
  rationale: Giữ hình thức giống đực của nguyên văn trong câu chính, đồng thời chú thích rằng lời gọi có thể hướng đến toàn thể cộng đồng tín hữu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Dùng “Thưa anh em” để thể hiện hô cách tự nhiên; đặt dấu chú thích [d] ngay sau “anh em”. Giữ sức nặng của động từ συναγωνίζομαι bằng “hết sức chiến đấu”, đồng thời tránh ngôn ngữ giáo phái.
