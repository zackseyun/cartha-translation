    rationale: ἀδελφοί có hình thức giống đực số nhiều, nhưng trong lời xưng hô cộng đồng có thể bao gồm toàn thể tín hữu. Cần một chú thích được neo trực tiếp tại “anh em”; không nên dùng chú thích về Đấng Mê-si-a thay cho thông tin này.
