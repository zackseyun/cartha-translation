  to: Vì tôi sẽ không dám nói điều gì ngoài những điều Đấng Christ đã thực hiện qua tôi nhằm đem các dân ngoại[a] đến sự vâng phục, bằng lời nói và việc làm[b].
  rationale: Đổi “những việc” thành “những điều” để giữ phạm vi rộng của ὧν và tránh trùng/lẫn với “việc làm” (ἔργῳ). Điều chỉnh nhẹ cụm chỉ mục đích cho tự nhiên. Thay chú thích b sai về biến thể thủ bản bằng chú thích nêu cách diễn đạt thay thế, phù hợp loại chú thích trong hồ sơ tiếng Anh và không tạo ra một khẳng định phê bình văn bản vô căn cứ.
