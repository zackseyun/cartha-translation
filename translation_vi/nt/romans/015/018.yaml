id: ROM.15.18
reference: Romans 15:18
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οὐ γὰρ τολμήσω ⸂τι λαλεῖν⸃ ὧν οὐ κατειργάσατο Χριστὸς δι’ ἐμοῦ εἰς ὑπακοὴν ἐθνῶν, λόγῳ καὶ ἔργῳ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/018.yaml
  text: For I will not dare to speak of anything except what Messiah has accomplished through me for the obedience of the Gentiles[a], by word and deed[b],
translation:
  language: vi
  text: Vì tôi sẽ không dám nói điều gì ngoài những điều Đấng Christ đã thực hiện qua tôi nhằm đem các dân ngoại[a] đến sự vâng phục, bằng lời nói và việc làm[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “các dân tộc.”
    reason: lexical_alternative
  - marker: b
    text: 'Hoặc, đối với mệnh đề đầu: “Tôi không dám nói điều gì ngoài những điều Đấng Christ đã thực hiện qua tôi.”'
    reason: alternative_reading
lexical_decisions:
- source_word: τολμήσω
  choice: tôi sẽ không dám
  rationale: Thì tương lai với οὐ diễn tả sự tự hạn chế mà Phao-lô tuyên bố; cách dịch này tự nhiên và giữ sắc thái dám hay mạo muội làm điều gì.
- source_word: τι λαλεῖν … ὧν οὐ
  choice: nói điều gì ngoài những việc
  rationale: 'Cấu trúc Hy Lạp mang ý hạn định: Phao-lô không nói đến điều gì khác ngoài những gì Đấng Christ đã làm qua ông.'
- source_word: κατειργάσατο
  choice: đã thực hiện
  rationale: Động từ chỉ việc làm nên hoặc hoàn thành một cách hữu hiệu; “đã thực hiện” phù hợp với tác động của Đấng Christ trong chức vụ Phao-lô.
- source_word: Χριστὸς
  choice: Đấng Christ
  rationale: Giữ ý nghĩa tước hiệu của Χριστός trong văn cảnh, đồng thời dùng cách gọi trang trọng và quen thuộc trong tiếng Việt.
- source_word: δι’ ἐμοῦ
  choice: qua tôi
  rationale: διά với sở hữu cách biểu thị phương tiện hay tác nhân trung gian, nhấn mạnh Đấng Christ là chủ thể hành động còn Phao-lô là người được Ngài dùng.
- source_word: εἰς ὑπακοὴν ἐθνῶν
  choice: để đưa các dân ngoại đến sự vâng phục
  rationale: Cách diễn đạt tự nhiên trong tiếng Việt, thể hiện mục đích hoặc kết quả hướng đến sự vâng phục giữa những người không thuộc dân Do Thái.
- source_word: λόγῳ καὶ ἔργῳ
  choice: bằng lời nói và việc làm
  rationale: Hai danh từ ở cách dữ liệu có thể chỉ phương tiện; cách dịch giữ sự song hành giữa điều được nói và điều được làm.
theological_decisions:
- issue: Cách dịch Χριστός
  choice: Đấng Christ
  alternative: Đấng Mê-si-a
  rationale: Ở đây từ này vẫn mang sắc thái tước hiệu, nhưng “Đấng Christ” là cách diễn đạt trang trọng, tự nhiên và quen thuộc trong tiếng Việt; không biến từ này thành một tên riêng thuần túy.
- issue: Ý nghĩa của ἐθνῶν
  choice: các dân ngoại
  alternative: các dân tộc
  rationale: Trong lập luận của thư Rô-ma, từ này thường chỉ những người ngoài dân Do Thái; “các dân ngoại” làm rõ nét đối chiếu ấy, trong khi “các dân tộc” vẫn là một khả năng từ vựng.
- issue: Quan hệ của εἰς ὑπακοὴν
  choice: để đưa … đến sự vâng phục
  alternative: nhằm có sự vâng phục của …
  rationale: Bản dịch chính diễn đạt tự nhiên ý mục đích hoặc kết quả nhưng không xác định thêm đối tượng của sự vâng phục, nhờ đó giữ nguyên độ mở thần học của nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu giữ Đấng Christ là chủ thể chính, Phao-lô là phương tiện, đồng thời bảo toàn cặp cân xứng “lời nói và việc làm.”
