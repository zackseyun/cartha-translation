id: ROM.15.14
reference: Romans 15:14
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Πέπεισμαι δέ, ἀδελφοί μου, καὶ αὐτὸς ἐγὼ περὶ ὑμῶν, ὅτι καὶ αὐτοὶ μεστοί ἐστε ἀγαθωσύνης, πεπληρωμένοι ⸀πάσης γνώσεως, δυνάμενοι καὶ ⸀ἀλλήλους νουθετεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/014.yaml
  text: And I myself am convinced about you[a], my brothers, that you yourselves also are full of goodness, filled with all knowledge[b], and able also to instruct one another.
translation:
  language: vi
  text: Thưa anh chị em của tôi[a], chính tôi cũng tin chắc về anh chị em rằng chính anh chị em cũng đầy lòng tốt lành, được đầy dẫy mọi sự hiểu biết và có khả năng khuyên bảo lẫn nhau.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tiếng Hy Lạp dùng adelphoi, dạng số nhiều giống đực của adelphos, nghĩa là “anh em trai”; nhưng trong ngữ cảnh này, từ ấy chỉ chung các tín hữu, gồm cả nam lẫn nữ.
    reason: lexical_alternative
  - marker: b
    text: “Khuyên bảo” cũng có thể dịch là “răn bảo”, “cảnh tỉnh” hoặc “chỉ dạy”; từ Hy Lạp bao hàm sự hướng dẫn nhằm sửa đổi.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πέπεισμαι
  choice: tin chắc
  rationale: Thể hoàn thành diễn tả trạng thái xác tín vững vàng hiện tại; “tin chắc” tự nhiên và giữ được sự quả quyết của Phao-lô.
- source_word: δέ
  choice: không dịch thành một liên từ riêng
  rationale: δέ ở đây chỉ sự chuyển ý nhẹ; lời xưng hô “Thưa anh chị em” đã tạo nhịp chuyển tự nhiên trong tiếng Việt, nên thêm “và/nhưng” sẽ nặng hoặc dễ gợi tương phản quá mức.
- source_word: ἀδελφοί μου
  choice: anh chị em
  rationale: Trong ngữ cảnh cộng đồng tín hữu gồm cả nam lẫn nữ, cách xưng hô tiếng Việt “anh chị em” truyền đạt tự nhiên phạm vi tập thể của ἀδελφοί; sắc thái sở hữu thân tình của μου được tiếng Việt hàm chứa tự nhiên trong lời gọi trực tiếp.
- source_word: καὶ αὐτὸς ἐγὼ περὶ ὑμῶν
  choice: chính tôi cũng tin chắc về anh chị em
  rationale: “Chính tôi” giữ lực nhấn của αὐτὸς ἐγώ, “cũng” phản ánh καί, còn “về anh chị em” dịch trực tiếp περὶ ὑμῶν.
- source_word: καὶ αὐτοὶ
  choice: chính anh chị em cũng
  rationale: Giữ cả ý bổ sung của καί lẫn sự nhấn mạnh của αὐτοί.
- source_word: μεστοί ἐστε ἀγαθωσύνης
  choice: đầy lòng nhân hậu
  rationale: ἀγαθωσύνη chỉ phẩm chất tốt lành về đạo đức; “lòng nhân hậu” là cách nói tự nhiên, trang trọng và không biến câu thành nhận định trừu tượng khó hiểu.
- source_word: πεπληρωμένοι πάσης γνώσεως
  choice: được đầy dẫy mọi sự hiểu biết
  rationale: Giữ hình ảnh “được làm cho đầy” của phân từ hoàn thành bị động và phạm vi rộng của πάσης γνώσεως mà không giải thích quá mức.
- source_word: δυνάμενοι
  choice: có khả năng
  rationale: Diễn đạt trực tiếp năng lực phát sinh từ những phẩm chất vừa nêu.
- source_word: ἀλλήλους
  choice: lẫn nhau
  rationale: Cách diễn đạt tương hỗ tự nhiên trong tiếng Việt.
- source_word: νουθετεῖν
  choice: khuyên bảo
  rationale: “Khuyên bảo” bao quát việc hướng dẫn có yếu tố sửa sai của νουθετέω, trong khi chú thích giữ lại các sắc thái mạnh hơn.
theological_decisions:
- issue: Lời gọi ἀδελφοί dành cho hội chúng gồm cả nam và nữ
  choice: anh chị em
  alternative: anh em
  rationale: Tiếng Việt hiện đại thường dùng “anh chị em” để gọi toàn thể cộng đồng gồm cả hai giới. Lựa chọn này làm rõ phạm vi quy chiếu mà không thêm một phân biệt thần học.
- issue: Sắc thái của νουθετεῖν
  choice: khuyên bảo lẫn nhau
  alternative: răn bảo lẫn nhau; cảnh tỉnh lẫn nhau; chỉ dạy lẫn nhau
  rationale: Động từ có thể chỉ sự chỉ dẫn nhằm điều chỉnh, khuyên răn hoặc cảnh báo. “Khuyên bảo” giữ được cả tính xây dựng lẫn yếu tố sửa sai, còn chú thích bảo tồn độ rộng ngữ nghĩa.
- issue: Phạm vi của πάσης γνώσεως
  choice: mọi sự hiểu biết
  alternative: mọi loại hiểu biết; đầy đủ sự hiểu biết
  rationale: Giữ cách diễn đạt rộng của nguyên văn, không biến lời khen thành một tuyên bố hệ thống rằng các tín hữu biết mọi điều theo nghĩa tuyệt đối.
translation_notes:
  register: Văn phong hiện đại, trang trọng và thân tình. Cấu trúc nhấn mạnh lặp lại “chính tôi… chính anh chị em” phản ánh αὐτὸς ἐγώ và αὐτοί. Hai dấu chú thích đều xuất hiện trong chính văn.
