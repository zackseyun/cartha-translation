  text: καὶ πάλιν Ἠσαΐας λέγει· Ἔσται ἡ ῥίζα τοῦ Ἰεσσαί, καὶ ὁ ἀνιστάμενος ἄρχειν ἐθνῶν· ἐπ’ αὐτῷ ἔθνη ἐλπιοῦσιν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/012.yaml
  text: And again Isaiah says, “The root of Jesse will be, and the one who rises to rule the Gentiles; in him the Gentiles will hope.”
translation:
  language: vi
  text: 'Và Ê-sai lại nói:


    “Gốc của Gie-sê sẽ xuất hiện,


    và Đấng đứng lên để cai trị các dân;


    các dân sẽ đặt hy vọng nơi Ngài.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡ ῥίζα τοῦ Ἰεσσαί
  choice: Gốc của Gie-sê
  rationale: Giữ nguyên hình ảnh ẩn dụ của lời tiên tri và tên riêng quen thuộc trong tiếng Việt.
- source_word: Ἔσται
  choice: sẽ xuất hiện
  rationale: Động từ 'sẽ có/sẽ hiện hữu' trong văn cảnh lời tiên tri nói về nhân vật được gọi là 'Gốc'; 'sẽ xuất hiện' tự nhiên hơn tiếng Việt mà không thêm ý 'đến' vốn không có trực tiếp trong Hy Lạp.
- source_word: ὁ ἀνιστάμενος
  choice: Đấng đứng lên
  rationale: Bảo tồn hình ảnh và sắc thái chủ động của động từ ἀνίστημι; tránh giải thích riêng thành sự phục sinh dù cụm từ có thể gợi liên tưởng ấy.
- source_word: ἄρχειν ἐθνῶν
  choice: để cai trị các dân
  rationale: ἄρχειν diễn đạt việc cai trị; ἐθνῶν ở đây chỉ các dân ngoài Israel, nhưng 'các dân' vừa tự nhiên vừa giữ liên hệ với bối cảnh trích dẫn.
- source_word: ἐπ’ αὐτῷ ἔθνη ἐλπιοῦσιν
  choice: các dân sẽ đặt hy vọng nơi Ngài
  rationale: '''Đặt hy vọng nơi'' truyền đạt tự nhiên sự hướng lòng trông cậy vào một người; viết hoa đại từ theo văn phong tôn kính thông dụng.'
theological_decisions:
- issue: Quan hệ giữa “Gốc của Gie-sê” và “Đấng đứng lên”
  choice: Trình bày như hai cách gọi cùng một nhân vật trong cùng lời trích dẫn
  alternative: Dịch sát cấu trúc bằng “và người đứng lên”
  rationale: Cấu trúc Hy Lạp có καὶ, nhưng trong văn cảnh hai cụm đồng quy về nhân vật Mê-si-a. Cách viết thành các dòng liên tiếp không chèn từ giải nghĩa như 'tức là', nhờ đó vẫn giữ được độ mở của cú pháp.
- issue: Khả năng ἀνιστάμενος hàm ý phục sinh
  choice: Dịch “đứng lên”
  alternative: Dịch “sống lại” hoặc “trỗi dậy”
  rationale: Không áp đặt nghĩa phục sinh khi mục đích được nêu trực tiếp là cai trị các dân; 'đứng lên' bảo tồn được sự căng thẳng và đa nghĩa của nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc; ngắt dòng theo thể thơ/lời tiên tri. Dùng “các dân” thay vì thuật ngữ giáo hội chuyên biệt như “dân ngoại”, nhằm phản ánh ἔθνη nhất quán và tự nhiên trong ngữ cảnh.
