id: ROM.15.6
reference: Romans 15:6
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἵνα ὁμοθυμαδὸν ἐν ἑνὶ στόματι δοξάζητε τὸν θεὸν καὶ πατέρα τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/006.yaml
  text: so that with one accord and with one mouth you may glorify the God and Father of our Lord Jesus the Messiah[a][b].
translation:
  language: vi
  text: để anh chị em đồng lòng, đồng thanh[a] tôn vinh Đức Chúa Trời, là Cha của Chúa chúng ta, Chúa Giê-su, Đấng Mê-si-a[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hy Lạp: “bằng một miệng”, nhấn mạnh lời tôn vinh hiệp nhất.'
    reason: lexical_alternative
  - marker: b
    text: 'Theo cách gọi truyền thống: “Chúa Giê-su Ki-tô”. Tước hiệu Hy Lạp Χριστός có nghĩa là “Đấng Mê-si-a”, tức Đấng được xức dầu.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἵνα
  choice: để
  rationale: Giữ sắc thái mục đích hoặc kết quả nối tiếp lời khuyên ở câu trước, đồng thời tự nhiên trong tiếng Việt.
- source_word: ὁμοθυμαδόν
  choice: đồng lòng
  rationale: Diễn đạt sự hiệp nhất trong tâm ý và mục đích của cả cộng đồng.
- source_word: ἐν ἑνὶ στόματι
  choice: đồng thanh
  rationale: Là cách nói tự nhiên trong tiếng Việt về lời ca ngợi hợp nhất; chú thích giữ lại hình ảnh nguyên văn “bằng một miệng”.
- source_word: δοξάζητε
  choice: tôn vinh
  rationale: Diễn đạt hành động quy vinh quang cho Đức Chúa Trời trong văn cảnh thờ phượng.
- source_word: τὸν θεὸν καὶ πατέρα
  choice: Đức Chúa Trời và là Cha
  rationale: 'Giữ cả liên từ καί lẫn quan hệ đồng quy chiếu: chính Đức Chúa Trời được tôn vinh cũng là Cha của Chúa chúng ta.'
- source_word: τοῦ κυρίου ἡμῶν
  choice: của Chúa chúng ta
  rationale: Chuyển tải trực tiếp κύριος cùng đại từ sở hữu ngôi thứ nhất số nhiều.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Chúa Giê-su, Đấng Mê-si
  rationale: Giê-su được phiên âm như tên riêng; Χριστός được dịch theo nghĩa tước hiệu là “Đấng Mê-si”, không chỉ phiên âm theo truyền thống.
theological_decisions:
- issue: Mối quan hệ trong cụm τὸν θεὸν καὶ πατέρα
  choice: Đức Chúa Trời và là Cha
  alternative: Đức Chúa Trời, là Cha
  rationale: Cách chọn giữ liên từ καί và cho thấy hai danh xưng cùng chỉ một Đấng, nhưng không biến cụm này thành hai đối tượng riêng biệt.
- issue: Cách dịch Χριστοῦ trong Ἰησοῦ Χριστοῦ
  choice: Đấng Mê-si
  alternative: Đấng Ki-tô
  rationale: Dịch ý nghĩa tước hiệu Χριστός và làm rõ chức vị được xức dầu của Giê-su, thay vì để tước hiệu chỉ như một thành phần của tên riêng.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại. “Anh chị em” làm rõ chủ thể số nhiều hàm ẩn trong động từ Hy Lạp và phù hợp lời nói với cộng đồng. “Đồng lòng, đồng thanh” có nhịp tự nhiên trong tiếng Việt; hình ảnh thân thể của nguyên văn được bảo tồn trong chú thích.
