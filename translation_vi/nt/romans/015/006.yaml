  source_fidelity: Bản dịch truyền đạt đúng quan hệ mục đích của ἵνα, sự hiệp nhất kép của ὁμοθυμαδόν và ἐν ἑνὶ στόματι, hành động δοξάζητε, và cụm quy chiếu một Đấng τὸν θεὸν καὶ πατέρα. “Đồng lòng, đồng thanh” là một cách chuyển ngữ tự nhiên; chú thích a bảo tồn hình ảnh “một miệng”.
