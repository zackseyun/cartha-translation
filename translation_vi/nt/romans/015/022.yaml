  text: Διὸ καὶ ἐνεκοπτόμην τὰ πολλὰ τοῦ ἐλθεῖν πρὸς ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/022.yaml
  text: Therefore I also was often hindered from coming to you[a].
translation:
  language: vi
  text: Vì vậy, tôi cũng nhiều lần bị ngăn trở, không thể đến với anh chị em.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “thường xuyên”; cụm Hy Lạp τὰ πολλὰ là một thành ngữ diễn tả sự việc lặp lại nhiều lần.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὸ
  choice: Vì vậy
  rationale: Diễn tả kết luận rút ra từ điều Phao-lô vừa trình bày và giữ rõ mối liên kết với văn cảnh trước.
- source_word: καὶ
  choice: cũng
  rationale: 'Giữ sắc thái bổ sung: hoàn cảnh cá nhân của Phao-lô được thêm vào điều vừa nói.'
- source_word: ἐνεκοπτόμην
  choice: bị ngăn trở
  rationale: Thể chưa hoàn thành cho thấy sự cản trở lặp lại hoặc kéo dài trong quá khứ; cách dịch này không xác định tác nhân khi nguyên văn không nêu.
- source_word: τὰ πολλὰ
  choice: nhiều lần
  rationale: Cụm này được dùng như trạng từ, chỉ sự lặp lại thường xuyên. “Nhiều lần” tự nhiên trong tiếng Việt và phản ánh sát ý hơn một cách hiểu là “phần lớn” trong văn cảnh này.
- source_word: τοῦ ἐλθεῖν
  choice: không thể đến
  rationale: Sau động từ chỉ sự ngăn trở, cấu trúc τοῦ với động từ nguyên mẫu nêu hành động bị cản trở. Tiếng Việt tự nhiên thường diễn đạt là “bị ngăn trở, không thể đến”.
- source_word: πρὸς ὑμᾶς
  choice: đến với anh chị em
  rationale: πρός với đối cách chỉ hướng chuyển động về phía những tín hữu tại Rô-ma. “Anh chị em” diễn đạt số nhiều và quan hệ cộng đồng, không hàm ý chỉ giới tính nam.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “tôi” cho người nói và “anh chị em” cho ὑμᾶς số nhiều. Dấu phẩy trước “không thể đến” giúp diễn đạt tự nhiên quan hệ giữa sự cản trở và hành động bị cản trở.
