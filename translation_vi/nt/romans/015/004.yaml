id: ROM.15.4
reference: Romans 15:4
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὅσα γὰρ προεγράφη, ⸀εἰς τὴν ἡμετέραν διδασκαλίαν ⸀ἐγράφη, ἵνα διὰ τῆς ὑπομονῆς καὶ διὰ τῆς παρακλήσεως τῶν γραφῶν τὴν ἐλπίδα ἔχωμεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/004.yaml
  text: For whatever was written beforehand was written for our instruction[b][a], so that through the endurance and through the encouragement of the Scriptures we might have hope.
translation:
  language: vi
  text: Vì mọi điều đã được viết từ trước đều được viết để dạy dỗ chúng ta, để nhờ sự kiên trì và nhờ sự khích lệ của Kinh Thánh[a], chúng ta có niềm hy vọng[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “sự an ủi của Kinh Thánh” hoặc “sự khuyên nhủ của Kinh Thánh”; παράκλησις có thể mang các nghĩa khích lệ, an ủi hoặc khuyên nhủ.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “để chúng ta có được niềm hy vọng.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅσα
  choice: mọi điều
  rationale: Đại từ quan hệ số nhiều trung tính có ý bao quát; “mọi điều” tự nhiên trong tiếng Việt và giữ được phạm vi rộng của câu.
- source_word: προεγράφη
  choice: đã được viết từ trước
  rationale: Giữ rõ ý thời gian của tiền tố προ- và dạng bị động, chỉ những điều đã được ghi chép trước đó.
- source_word: εἰς τὴν ἡμετέραν διδασκαλίαν
  choice: để dạy dỗ chúng ta
  rationale: εἰς với đối cách diễn tả mục đích; cách nói này tự nhiên, dễ hiểu và truyền đạt chức năng giáo huấn, đào luyện của điều đã chép.
- source_word: ἐγράφη
  choice: đều được viết
  rationale: Giữ dạng bị động và sự lặp lại có chủ ý của động từ γράφω trong nguyên văn.
- source_word: ἵνα
  choice: hầu cho
  rationale: Diễn tả mục đích, đồng thời giữ văn phong trang trọng nhưng vẫn quen thuộc trong tiếng Việt Kinh Thánh.
- source_word: διὰ τῆς ὑπομονῆς
  choice: nhờ sự kiên trì
  rationale: ὑπομονή nói đến sự bền lòng chịu đựng trong hoàn cảnh khó khăn; “sự kiên trì” tự nhiên và không giới hạn nghĩa vào chịu khổ thụ động.
- source_word: διὰ τῆς παρακλήσεως τῶν γραφῶν
  choice: nhờ sự khích lệ từ Kinh Thánh
  rationale: παράκλησις ở đây có thể là khích lệ, an ủi hoặc khuyên nhủ. “Sự khích lệ” phù hợp với hướng đến hy vọng; “từ Kinh Thánh” diễn đạt tự nhiên quan hệ nguồn/phương tiện mà không giải thích quá mức.
- source_word: τῶν γραφῶν
  choice: Kinh Thánh
  rationale: Trong cách dùng của Phao-lô, γραφαί thường chỉ các trước tác thánh; “Kinh Thánh” là cách gọi hiện đại, rõ nghĩa và trang trọng.
- source_word: τὴν ἐλπίδα
  choice: niềm hy vọng
  rationale: Danh từ trừu tượng có mạo từ được diễn đạt tự nhiên bằng “niềm hy vọng”, không nhất thiết biến nó thành một thuật ngữ kỹ thuật riêng biệt.
- source_word: ἔχωμεν
  choice: chúng ta có
  rationale: Động từ giả định hiện tại sau ἵνα nằm trong mệnh đề mục đích; tiếng Việt không cần đánh dấu thức bằng một từ chỉ sự bất định. Chú thích ghi nhận khả năng dịch “có thể có”.
theological_decisions:
- issue: Vai trò của Kinh Thánh đối với sự kiên trì, khích lệ và hy vọng
  choice: Giữ sự kiên trì và sự khích lệ như những phương tiện dẫn đến hy vọng, đồng thời gắn “từ Kinh Thánh” trực tiếp với sự khích lệ theo trật tự cú pháp Hy Lạp.
  alternative: Có thể hiểu cả sự kiên trì lẫn sự khích lệ đều do Kinh Thánh ban hoặc được nuôi dưỡng qua Kinh Thánh.
  rationale: Cấu trúc Hy Lạp đặt τῶν γραφῶν ngay sau παρακλήσεως, nhưng không buộc bản dịch phải xác định hoàn toàn quan hệ thần học rộng hơn. Bản dịch giữ cách diễn đạt đủ mở để không âm thầm giải quyết điều nguyên văn còn có sắc thái.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Giữ phép lặp “được viết… được viết” của nguyên văn; dùng “hầu cho” để thể hiện mệnh đề mục đích. Các dấu chú thích [a], [b] đều xuất hiện trong chính văn.
