  terminology: “Ân điển,” “Đức Chúa Trời,” và “anh chị em” phù hợp với bản văn và thanh ghi Cơ Đốc giáo tiếng Việt hiện đại. Chú thích về ân điển như sự ủy nhiệm/chức vụ vẫn hữu ích nhưng không thu hẹp nghĩa trong chính văn.
