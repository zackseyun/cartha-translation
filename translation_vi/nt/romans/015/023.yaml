  text: νυνὶ δὲ μηκέτι τόπον ἔχων ἐν τοῖς κλίμασι τούτοις, ἐπιποθίαν δὲ ἔχων τοῦ ἐλθεῖν πρὸς ὑμᾶς ἀπὸ ⸀ἱκανῶν ἐτῶν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/023.yaml
  text: But now[a], no longer having any place in these regions, but having had a longing for many years to come to you,
translation:
  language: vi
  text: Nhưng giờ đây, tôi không còn chỗ trong các vùng này[a], nhưng đã nhiều năm nay tôi khao khát đến với anh chị em,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể hiểu là “không còn phạm vi hay cơ hội trong các vùng này”; cách nói Hy Lạp có thể chỉ rằng ở đó không còn phạm vi cho hoạt động hoặc sự phục vụ, chứ không chỉ nói đến một địa điểm theo nghĩa vật lý.
    reason: lexical_alternative
lexical_decisions:
- source_word: νυνὶ δὲ
  choice: Nhưng giờ đây
  rationale: Diễn đạt tự nhiên cả ý chuyển tiếp của δέ lẫn thời điểm hiện tại được νυνί nhấn mạnh.
- source_word: μηκέτι τόπον ἔχων
  choice: tôi không còn chỗ nào
  rationale: Giữ hình ảnh rộng của τόπος và ý chấm dứt trong μηκέτι; ngôi thứ nhất được nêu rõ theo chủ thể hàm ẩn của phân từ, còn khả năng chỉ phạm vi hoặc cơ hội phục vụ được ghi ở chú thích.
- source_word: ἐν τοῖς κλίμασι τούτοις
  choice: trong những vùng này
  rationale: κλίμασι chỉ các khu vực địa lý; “những vùng này” là cách nói hiện đại, rõ nghĩa và không thu hẹp quá mức.
- source_word: ἐπιποθίαν ... ἔχων
  choice: khao khát
  rationale: Diễn đạt cường độ của ἐπιποθία bằng một động từ tự nhiên và trang trọng trong tiếng Việt.
- source_word: τοῦ ἐλθεῖν πρὸς ὑμᾶς
  choice: đến với anh chị em
  rationale: Theo sát nội dung của cấu trúc nguyên mẫu, không thêm sắc thái “thăm viếng” vốn không được nói rõ.
- source_word: ἀπὸ ἱκανῶν ἐτῶν
  choice: đã nhiều năm
  rationale: Diễn đạt tự nhiên khoảng thời gian bắt đầu trong quá khứ và kéo dài đến hiện tại.
theological_decisions:
- issue: Ý nghĩa của τόπον trong bối cảnh sứ vụ
  choice: Giữ cách nói “chỗ nào” trong chính văn và giải thích khả năng chỉ phạm vi hoặc cơ hội phục vụ ở chú thích.
  alternative: Dịch trực tiếp là “không còn cơ hội phục vụ” hoặc “không còn địa bàn hoạt động”.
  rationale: Nguyên văn có thể hàm ý không còn phạm vi cho công việc của Phao-lô, nhưng không nói rõ danh từ “phục vụ”; giữ thành ngữ giúp tránh giải quyết dứt khoát một hàm ý còn mở.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Anh chị em” diễn đạt đại từ số nhiều ὑμᾶς theo lối bao quát tự nhiên. Dấu phẩy cuối câu được giữ vì câu 23 tiếp tục về mặt cú pháp sang câu kế tiếp.
