  source_fidelity: 'Bản dịch truyền đạt đúng các yếu tố chính: chuyển ý thời hiện tại (νυνὶ δέ), sự chấm dứt (μηκέτι), các vùng địa lý, lòng khao khát kéo dài nhiều năm, và việc đến với độc giả. Tuy nhiên, bản văn Hy Lạp có δέ ở cả mệnh đề δεύτε hai; liên từ “và” trong bản nháp làm yếu thế đối chiếu/tiếp nối này. “Nhưng” ở mệnh đề sau phản ánh cấu trúc nguồn sát hơn mà vẫn tự nhiên.'
  naturalness: “Không còn chỗ nào trong những vùng này” có thể hiểu được, nhưng “không còn chỗ trong các vùng này” tự nhiên hơn trong văn phong trang trọng và vẫn giữ độ mở của τόπον. Lặp lại chủ ngữ “tôi” ở mệnh đề sau giúp câu tiếng Việt rõ nhịp và rõ quan hệ với trạng ngữ “đã nhiều năm nay”.
  terminology: “Anh chị em” là cách xưng hô bao quát, hiện đại và phù hợp với số nhiều ὑμᾶς. Chú thích nên giữ khả năng “phạm vi/cơ hội”, nhưng không cần xác định quá mức đó là công việc phục vụ của Phao-lô; “hoạt động/phục vụ” là hàm ý ngữ cảnh chứ không phải danh từ được nêu trong câu.
