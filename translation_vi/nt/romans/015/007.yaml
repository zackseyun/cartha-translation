  rationale: Chỉ sửa cách diễn đạt cụm εἰς δόξαν τοῦ θεοῦ để phản ánh tự nhiên và chính xác hơn ý hướng đích/kết quả, đồng thời vẫn giữ cụm ở cuối câu và chú thích về phạm vi liên kết có thể có. Các lựa chọn còn lại được giữ nguyên vì trung thành với nguyên văn và tự nhiên trong tiếng Việt hiện đại.
