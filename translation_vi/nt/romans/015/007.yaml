id: ROM.15.7
reference: Romans 15:7
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Διὸ προσλαμβάνεσθε ἀλλήλους, καθὼς καὶ ὁ Χριστὸς προσελάβετο ⸀ὑμᾶς, εἰς δόξαν ⸀τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/007.yaml
  text: Therefore welcome one another[a], just as the Messiah also welcomed you[c][b], for the glory of God.
translation:
  language: vi
  text: Vì vậy, hãy đón nhận nhau[a], như Đấng Mê-si-a[b] cũng đã đón nhận anh chị em, để tôn vinh Đức Chúa Trời.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “tiếp nhận nhau” hoặc “chấp nhận nhau”.
    reason: lexical_alternative
  - marker: b
    text: Hay “Đấng Christ” hoặc “Đấng Kitô”.
    reason: alternative_rendering
  - marker: c
    text: Hoặc “vì vinh quang của Đức Chúa Trời”. Cụm từ này có thể diễn tả mục đích hoặc kết quả, và có thể liên hệ với việc Đấng Mê-si-a đón nhận anh chị em hoặc với toàn bộ lời kêu gọi trong câu.
    reason: ambiguity
lexical_decisions:
- source_word: Διὸ
  choice: Vì vậy
  rationale: Diễn tả kết luận được rút ra từ lập luận ngay trước đó, đồng thời tự nhiên trong tiếng Việt hiện đại.
- source_word: προσλαμβάνεσθε ... προσελάβετο
  choice: hãy đón nhận ... đã đón nhận
  rationale: Giữ nguyên sự lặp lại có chủ ý của cùng một động từ Hy Lạp và truyền đạt sự tiếp nhận tích cực trong cộng đồng, chứ không chỉ là miễn cưỡng dung thứ.
- source_word: ἀλλήλους
  choice: nhau
  rationale: Đại từ tương hỗ tự nhiên, giữ rõ ý mỗi bên đón nhận bên kia.
- source_word: καθὼς καὶ
  choice: như ... cũng
  rationale: Bảo toàn cả ý so sánh của καθὼς và sắc thái bổ sung của καί.
- source_word: ὁ Χριστὸς
  choice: Đấng Mê-si-a
  rationale: Mạo từ và ngữ cảnh cho thấy Χριστός mang sắc thái tước hiệu; cách dịch này làm rõ nghĩa 'Đấng được xức dầu' mà không biến tước hiệu thành tên riêng.
- source_word: ὑμᾶς
  choice: anh chị em
  rationale: Diễn đạt ngôi thứ hai số nhiều trong lời khuyên dành cho cộng đồng bằng cách xưng hô trang trọng, bao quát và tự nhiên.
- source_word: εἰς δόξαν τοῦ θεοῦ
  choice: đem lại vinh quang cho Đức Chúa Trời
  rationale: Diễn đạt hướng đích hoặc kết quả của εἰς δόξαν, đồng thời để ngỏ phạm vi liên kết của cụm từ ở cuối câu.
theological_decisions:
- issue: Cách dịch Χριστός
  choice: Đấng Mê-si-a
  alternative: Đấng Christ; Đấng Kitô
  rationale: Ở đây từ này có chức năng tước hiệu. 'Đấng Mê-si-a' nêu rõ nội dung tước hiệu và tránh thiên về truyền thống thuật ngữ riêng của một hệ phái.
- issue: Sắc thái của προσλαμβάνομαι trong cộng đồng đức tin
  choice: đón nhận nhau
  alternative: tiếp nhận nhau; chấp nhận nhau
  rationale: '''Đón nhận'' thể hiện sự tiếp nhận chủ động và có tính quan hệ, phù hợp mạch văn Rô-ma 14–15, nhưng không thêm một khẳng định giáo lý hẹp hơn.'
- issue: Phạm vi và sắc thái của εἰς δόξαν τοῦ θεοῦ
  choice: đem lại vinh quang cho Đức Chúa Trời
  alternative: để Đức Chúa Trời được tôn vinh; nhằm làm vinh hiển Đức Chúa Trời
  rationale: Cụm cuối có thể nêu mục đích hoặc kết quả và về mặt cú pháp có thể được hiểu gắn trực tiếp với việc Đấng Mê-si-a đón nhận hoặc với toàn bộ lời kêu gọi. Bản dịch đặt cụm này ở cuối để không âm thầm khóa nghĩa.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh chị em” cho số nhiều của ὑμᾶς nhằm bao quát toàn cộng đồng; giữ cấu trúc song hành “đón nhận ... đã đón nhận” và đặt cụm chỉ vinh quang ở cuối để bảo tồn độ mở cú pháp của nguyên văn.
