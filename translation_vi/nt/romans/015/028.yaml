source:
  edition: SBLGNT
  text: τοῦτο οὖν ἐπιτελέσας, καὶ σφραγισάμενος αὐτοῖς τὸν καρπὸν τοῦτον, ἀπελεύσομαι δι’ ὑμῶν ⸀εἰς Σπανίαν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/028.yaml
  text: Therefore[a], when I have completed this and have sealed this fruit to them[c][b], I will go on by way of you to Spain.
translation:
  language: vi
  text: Vậy, sau khi đã hoàn tất việc này và đã xác nhận việc trao thành quả này cho họ[a], tôi sẽ đi qua chỗ anh chị em[b] để đến Tây Ban Nha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “đã đóng ấn thành quả này cho họ.” Cách nói này có thể chỉ việc xác nhận hoặc bảo đảm việc chuyển giao. “Thành quả này” là khoản đóng góp do các tín hữu dân ngoại quyên góp cho các thánh đồ tại Giê-ru-sa-lem.'
    reason: lexical_alternative_and_cultural_note
  - marker: b
    text: 'Cũng có thể dịch: “qua anh chị em” hoặc “theo đường qua anh chị em.” Phao-lô dự định đến Tây Ban Nha theo đường qua Rô-ma.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο οὖν ἐπιτελέσας
  choice: Vậy, sau khi hoàn tất việc này
  rationale: Giữ quan hệ chuyển tiếp/suy luận của οὖν và diễn đạt phân từ chỉ hành động hoàn tất trước động từ chính bằng cấu trúc thời gian tự nhiên trong tiếng Việt.
- source_word: σφραγισάμενος αὐτοῖς
  choice: trao tận tay họ
  rationale: Trong bối cảnh chuyển khoản quyên góp đến Giê-ru-sa-lem, σφραγίζω có sắc thái xác nhận, bảo đảm và giao nhận chắc chắn. Cách dịch này truyền đạt ý theo ngữ cảnh mà không dùng hình ảnh 'đóng ấn' khó hiểu trong tiếng Việt; chú thích ghi nhận nghĩa đen.
- source_word: τὸν καρπὸν τοῦτον
  choice: thành quả ấy
  rationale: καρπός ở đây là kết quả hữu hình từ lòng rộng rãi của các tín hữu dân ngoại, tức khoản đóng góp. 'Thành quả' giữ được nét ẩn dụ về kết quả mà vẫn tự nhiên.
- source_word: ἀπελεύσομαι δι’ ὑμῶν
  choice: tôi sẽ đi qua chỗ anh chị em
  rationale: διά với sở hữu cách diễn tả hành trình qua hoặc theo đường có người nhận thư ở đó; câu không nói rõ mức độ hỗ trợ nên không thêm ý.
- source_word: εἰς Σπανίαν
  choice: để đến Tây Ban Nha
  rationale: Diễn đạt tự nhiên đích đến của hành trình.
theological_decisions:
- issue: Ý nghĩa của hình ảnh σφραγίζω đối với khoản quyên góp cho các thánh đồ tại Giê-ru-sa-lem
  choice: Dịch theo chức năng là 'trao tận tay họ', đồng thời ghi nghĩa đen trong chú thích.
  alternative: đóng ấn thành quả ấy cho họ; bảo đảm thành quả ấy cho họ
  rationale: Động từ có thể gợi việc xác nhận hoặc bảo đảm giao nhận, nhưng cách thức cụ thể không chắc chắn. Bản dịch chính tránh tạo ấn tượng về nghi thức đóng ấn theo nghĩa vật chất, còn chú thích bảo tồn hình ảnh nguyên ngữ.
- issue: Đối tượng được gọi là 'thành quả ấy'
  choice: Giữ cách nói ẩn dụ trong chính văn và giải thích đó là khoản đóng góp trong chú thích.
  alternative: khoản đóng góp ấy; lễ vật ấy
  rationale: Giữ ẩn dụ καρπός và không biến phần giải nghĩa theo ngữ cảnh thành chính văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “anh chị em” cho đại từ số nhiều chỉ cộng đồng tín hữu; giữ ẩn dụ καρπός dưới dạng “thành quả”, còn thành ngữ σφραγίζω được diễn đạt theo chức năng và có chú thích nghĩa đen.
