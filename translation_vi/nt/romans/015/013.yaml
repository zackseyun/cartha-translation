  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὁ δὲ θεὸς τῆς ἐλπίδος πληρώσαι ὑμᾶς πάσης χαρᾶς καὶ εἰρήνης ἐν τῷ πιστεύειν, εἰς τὸ περισσεύειν ὑμᾶς ἐν τῇ ἐλπίδι ἐν δυνάμει πνεύματος ἁγίου.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/013.yaml
  text: May the God of hope fill you with all joy and peace in believing, so that you may abound in hope by the power of the Holy Spirit.
translation:
  language: vi
  text: Nguyện Đức Chúa Trời của niềm hy vọng làm cho anh chị em tràn đầy mọi niềm vui và bình an khi anh chị em tin, để anh chị em dồi dào trong niềm hy vọng bởi quyền năng của Đức Thánh Linh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δὲ θεὸς τῆς ἐλπίδος
  choice: Nguyện Đức Chúa Trời của niềm hy vọng
  rationale: δὲ chỉ nối ý nhẹ nên không cần dịch thành một từ chuyển ý riêng trong câu chúc nguyện này. Cụm sở hữu cách τῆς ἐλπίδος được giữ là “của niềm hy vọng”, vừa tự nhiên vừa không giới hạn ý nghĩa vào riêng nguồn gốc hay đối tượng của hy vọng.
- source_word: πληρώσαι ὑμᾶς πάσης χαρᾶς καὶ εἰρήνης
  choice: ban cho anh chị em tràn đầy mọi niềm vui và bình an
  rationale: Động từ optative πληρώσαι diễn tả lời cầu chúc, được thể hiện bằng “Nguyện...”. “Tràn đầy” giữ hình ảnh đầy trọn; “ban cho” giúp cấu trúc tiếng Việt tự nhiên. πάσης được thể hiện bằng “mọi” với phạm vi bao quát cả niềm vui và bình an.
- source_word: ἐν τῷ πιστεύειν
  choice: trong khi tin
  rationale: Giữ sắc thái hoàn cảnh hoặc phạm vi của ἐν cùng động từ nguyên mẫu có mạo từ, đồng thời phản ánh hành động tin chứ không thay bằng danh từ “đức tin”.
- source_word: εἰς τὸ περισσεύειν ὑμᾶς ἐν τῇ ἐλπίδι
  choice: để anh chị em được chan chứa niềm hy vọng
  rationale: εἰς τὸ với động từ nguyên mẫu có thể chỉ mục đích hoặc kết quả; “để” bảo tồn độ mở đó trong ngữ cảnh cầu chúc. “Chan chứa” diễn đạt περισσεύειν là dư dật, dồi dào, đồng thời tạo tiếng Việt tự nhiên.
- source_word: ἐν δυνάμει πνεύματος ἁγίου
  choice: bởi quyền năng của Đức Thánh Linh
  rationale: ἐν δυνάμει ở đây có sắc thái phương tiện rõ, nên dịch “bởi quyền năng”. πνεύματος ἁγίου trong văn cảnh Phao-lô chỉ Đức Thánh Linh.
theological_decisions:
- issue: Quan hệ sở hữu trong θεὸς τῆς ἐλπίδος
  choice: Đức Chúa Trời của niềm hy vọng
  alternative: Đức Chúa Trời, nguồn hy vọng
  rationale: Bản dịch “của niềm hy vọng” giữ được tính hàm súc của sở hữu cách Hy Lạp, không giải nghĩa độc nhất rằng Đức Chúa Trời chỉ là nguồn phát sinh hy vọng, dù ý đó có thể được hàm chứa.
- issue: Cách hiểu πνεύματος ἁγίου
  choice: Đức Thánh Linh
  alternative: thánh linh
  rationale: Trong ngữ cảnh thư Rô-ma, cụm từ nói đến Thánh Linh của Đức Chúa Trời; cách viết danh xưng “Đức Thánh Linh” truyền đạt đối tượng quy chiếu này mà không thêm một mệnh đề tín lý vào câu.
- issue: Sắc thái của εἰς τὸ περισσεύειν
  choice: để anh chị em được chan chứa
  alternative: kết quả là anh chị em chan chứa
  rationale: Cấu trúc Hy Lạp cho phép sắc thái mục đích hoặc kết quả. “Để” tự nhiên trong lời cầu chúc và không buộc phải phân định cứng giữa hai sắc thái.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh chị em” cho đại từ số nhiều ὑμᾶς nhằm diễn đạt cộng đồng tín hữu bao gồm cả nam lẫn nữ. Tránh thêm từ chuyển ý ở đầu câu vì δὲ chỉ có lực nối nhẹ. Không cần chú thích trong câu này.
