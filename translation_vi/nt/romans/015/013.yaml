revisions:
- from: Nguyện Đức Chúa Trời của niềm hy vọng ban cho anh chị em tràn đầy mọi niềm vui và bình an trong khi tin, để anh chị em được chan chứa niềm hy vọng bởi quyền năng của Đức Thánh Linh.
  to: Nguyện Đức Chúa Trời của niềm hy vọng làm cho anh chị em tràn đầy mọi niềm vui và bình an khi anh chị em tin, để anh chị em dồi dào trong niềm hy vọng bởi quyền năng của Đức Thánh Linh.
