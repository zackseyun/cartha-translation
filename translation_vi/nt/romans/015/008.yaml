id: ROM.15.8
reference: Romans 15:8
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: λέγω ⸀γὰρ ⸀Χριστὸν διάκονον ⸀γεγενῆσθαι περιτομῆς ὑπὲρ ἀληθείας θεοῦ, εἰς τὸ βεβαιῶσαι τὰς ἐπαγγελίας τῶν πατέρων,
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/008.yaml
  text: For I say that the Messiah has become a servant to the circumcised for the sake of God's truth[a], in order to confirm the promises to the fathers,
translation:
  language: vi
  text: Vì tôi nói rằng Đấng Mê-si đã trở nên người phục vụ cho những người chịu cắt bì vì sự chân thật của Đức Chúa Trời,[a] để xác nhận những lời hứa của các tổ phụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “vì sự thành tín của Đức Chúa Trời,” nhấn mạnh rằng Ngài thành tín thực hiện các lời hứa giao ước.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω γὰρ
  choice: Vì tôi nói rằng
  rationale: γάρ nối câu này với lập luận trước theo nghĩa giải thích; λέγω được giữ sát và tự nhiên là “tôi nói rằng”.
- source_word: Χριστόν
  choice: Đấng Mê-si
  rationale: Trong ngữ cảnh về dân chịu cắt bì và các lời hứa cho tổ phụ, Χριστός mang tính tước hiệu; “Đấng Mê-si” diễn đạt rõ chức năng ấy.
- source_word: διάκονον γεγενῆσθαι
  choice: đã trở nên người phục vụ
  rationale: διάκονος ở đây chỉ người đảm nhiệm việc phục vụ, không nhất thiết là chức vụ hội thánh; thì hoàn thành của γίνομαι được thể hiện bằng “đã trở nên”.
- source_word: περιτομῆς
  choice: những người chịu cắt bì
  rationale: Danh từ trừu tượng được dùng hoán dụ cho dân chịu cắt bì, tức người Do Thái; cách diễn đạt này rõ nghĩa trong tiếng Việt hiện đại.
- source_word: ὑπὲρ ἀληθείας θεοῦ
  choice: vì sự chân thật của Đức Chúa Trời
  rationale: ὑπέρ nêu lý do hoặc mục đích, còn ἀλήθεια θεοῦ có thể chỉ chân lý của Đức Chúa Trời hoặc sự thành tín/chân thật của Ngài. Bản chính giữ cách diễn đạt tương đối rộng và chú thích bảo lưu sắc thái giao ước.
- source_word: εἰς τὸ βεβαιῶσαι
  choice: để xác nhận
  rationale: Cấu trúc εἰς τό với động từ nguyên mẫu diễn tả mục đích; βεβαιόω là làm cho vững chắc hoặc chứng thực.
- source_word: τὰς ἐπαγγελίας τῶν πατέρων
  choice: những lời hứa đã ban cho các tổ phụ
  rationale: Sở hữu cách τῶν πατέρων trong ngữ cảnh được hiểu là các lời hứa liên hệ đến và đã được ban cho tổ phụ Israel; thêm “đã ban” giúp tiếng Việt tự nhiên mà không thay đổi quan hệ ý nghĩa.
theological_decisions:
- issue: Cách dịch Χριστός
  choice: Đấng Mê-si
  alternative: Đấng Christ
  rationale: Ngữ cảnh lịch sử cứu chuộc về Israel, phép cắt bì và các tổ phụ làm nổi bật nghĩa tước hiệu của từ này.
- issue: Sắc thái của ἀλήθεια θεοῦ
  choice: sự chân thật của Đức Chúa Trời
  alternative: sự thành tín của Đức Chúa Trời
  rationale: Cụm từ có thể nhấn mạnh chân lý/chân thật nói chung hoặc sự thành tín của Đức Chúa Trời đối với lời hứa giao ước. Bản chính không thu hẹp nghĩa; chú thích nêu sắc thái “thành tín” rất phù hợp với văn cảnh.
- issue: Quan hệ của διάκονον với περιτομῆς
  choice: người phục vụ những người chịu cắt bì
  alternative: người phục vụ của những người chịu cắt bì
  rationale: Sở hữu cách có thể được giữ theo hình thức, nhưng tiếng Việt tự nhiên cần biểu đạt đối tượng được phục vụ; cách chọn không hàm ý Đấng Mê-si thuộc quyền sở hữu của nhóm này.
translation_notes:
  register: Văn phong trang trọng, sáng rõ và hiện đại. Dùng “Đấng Mê-si” như một tước hiệu, “người phục vụ” thay vì thuật ngữ chức vụ hội thánh, và “các tổ phụ” để giữ sắc thái lịch sử cứu chuộc của câu.
