  source_fidelity: 'Bản nháp giữ được các yếu tố chính: chức vụ đối với các dân ngoại, ngôn ngữ tư tế, lễ vật được chấp nhận và sự thánh hóa bởi/trong Đức Thánh Linh. Tuy nhiên, cụm “trong việc rao truyền” thêm cụ thể hành vi rao giảng, vốn không có trực tiếp trong ἱερουργοῦντα τὸ εὐαγγέλιον; nên giữ cách nói rộng hơn về việc phục vụ/thi hành công tác tư tế liên hệ đến Tin Mừng. “Cho các dân ngoại” cũng có thể hiểu là hướng đến họ, nhưng “giữa các dân ngoại” diễn tả tự nhiên hơn phạm vi sứ vụ trong câu này.'
