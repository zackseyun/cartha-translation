id: ROM.15.16
reference: Romans 15:16
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εἰς τὸ εἶναί με λειτουργὸν ⸂Χριστοῦ Ἰησοῦ⸃ εἰς τὰ ἔθνη, ἱερουργοῦντα τὸ εὐαγγέλιον τοῦ θεοῦ, ἵνα γένηται ἡ προσφορὰ τῶν ἐθνῶν εὐπρόσδεκτος, ἡγιασμένη ἐν πνεύματι ἁγίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/016.yaml
  text: to be a minister of Messiah Jesus to the Gentiles[a], serving as a priest in the gospel of God, so that the offering of the Gentiles may become acceptable[d][c][b], sanctified by the Holy Spirit.
translation:
  language: vi
  text: để tôi làm người phục vụ của Đấng Mê-si-a Giê-su giữa các dân ngoại[a], thi hành công việc tư tế trong sự phục vụ Tin Mừng của Đức Chúa Trời[b], hầu cho lễ vật của các dân ngoại[c] được chấp nhận, được Đức Thánh Linh thánh hóa[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “giữa các dân.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “phục vụ Tin Mừng của Đức Chúa Trời như một tư tế” hoặc “thi hành sự phục vụ tư tế đối với Tin Mừng của Đức Chúa Trời.”'
    reason: lexical_alternative
  - marker: c
    text: Có lẽ chính các dân ngoại là lễ vật được dâng lên Đức Chúa Trời; cũng có thể hiểu là “lễ vật do các dân ngoại dâng.”
    reason: alternative_reading
  - marker: d
    text: 'Hoặc: “được thánh hóa trong Đức Thánh Linh.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: λειτουργὸν
  choice: người phục vụ
  rationale: Từ này chỉ người đảm trách công việc phục vụ, có thể mang sắc thái công vụ hoặc thánh vụ. “Người phục vụ” tự nhiên trong tiếng Việt và không biến ẩn dụ của Phao-lô thành một chức phẩm giáo hội về sau.
- source_word: Χριστοῦ Ἰησοῦ
  choice: Đấng Mê-si-a Giê-su
  rationale: Χριστός ở đây vẫn mang ý nghĩa tước hiệu; “Đấng Mê-si-a” truyền đạt nghĩa “Đấng được xức dầu” thay vì chỉ phiên âm theo truyền thống.
- source_word: εἰς τὰ ἔθνη
  choice: cho các dân ngoại
  rationale: Trong bối cảnh sứ mạng của Phao-lô và sự phân biệt với người Do Thái trong thư Rô-ma, ἔθνη chủ yếu chỉ những người không thuộc dân Do Thái. Nghĩa sát chữ “các dân” được giữ trong chú thích.
- source_word: ἱερουργοῦντα
  choice: thi hành chức vụ tư tế
  rationale: Động từ mang hình ảnh tế tự rõ rệt. Cách dịch này giữ được ẩn dụ tư tế mà không nói rằng Phao-lô dâng một sinh tế chuộc tội hay nắm giữ một chức phẩm theo cơ cấu giáo hội về sau.
- source_word: τὸ εὐαγγέλιον τοῦ θεοῦ
  choice: Tin Mừng của Đức Chúa Trời
  rationale: “Tin Mừng” là cách diễn đạt trang trọng nhưng dễ hiểu cho εὐαγγέλιον, còn cấu trúc “của Đức Chúa Trời” giữ nguyên quan hệ sở hữu hoặc nguồn gốc trong tiếng Hy Lạp.
- source_word: προσφορὰ τῶν ἐθνῶν
  choice: lễ vật của các dân ngoại
  rationale: 'Cách dịch giữ cấu trúc sở hữu cách và sự mơ hồ thật có trong nguyên văn: nhiều khả năng chính các dân ngoại là lễ vật, nhưng cũng có thể hiểu là lễ vật do họ dâng.'
- source_word: εὐπρόσδεκτος
  choice: được vui nhận
  rationale: Cụm này tự nhiên trong ngữ cảnh dâng lễ và diễn đạt việc lễ vật được tiếp nhận cách thuận ý, không cần thêm rõ chủ thể vốn chỉ được hàm ý trong nguyên văn.
- source_word: ἡγιασμένη
  choice: được thánh hóa
  rationale: Thể hoàn thành bị động nói đến tình trạng đã phát sinh từ hành động làm nên thánh; “được thánh hóa” giữ được cả sắc thái thần học lẫn hình thái bị động.
- source_word: ἐν πνεύματι ἁγίῳ
  choice: được Đức Thánh Linh thánh hóa
  rationale: 'ἐν được hiểu theo nghĩa phương tiện hoặc tác nhân: Đức Thánh Linh là Đấng thánh hóa. Khả năng hiểu theo nghĩa phạm vi, “trong Đức Thánh Linh,” được nêu trong chú thích.'
theological_decisions:
- issue: Phao-lô tự mô tả công tác của mình bằng ngôn ngữ tư tế
  choice: Giữ rõ hình ảnh Phao-lô thi hành chức vụ tư tế trong công tác Tin Mừng giữa các dân ngoại.
  alternative: Hiểu đây là lời khẳng định về một chức tư tế chính thức, hoặc làm phẳng hình ảnh thành sự phục vụ nói chung.
  rationale: Sự kết hợp của λειτουργός, ἱερουργέω và προσφορά tạo nên một ẩn dụ tế tự có chủ ý. Tuy nhiên, câu này nói về công tác Tin Mừng và lễ vật là hoặc thuộc về các dân ngoại, chứ không nói Phao-lô dâng sinh tế chuộc tội.
- issue: Đối tượng được gọi là “lễ vật của các dân ngoại”
  choice: Giữ cấu trúc có thể hiểu theo nhiều cách trong câu chính; theo văn cảnh, cách hiểu có khả năng hơn là chính các dân ngoại được dâng lên Đức Chúa Trời như một lễ vật.
  alternative: Lễ vật do các dân ngoại dâng.
  rationale: Bối cảnh sứ mạng và chuỗi hình ảnh tư tế ủng hộ cách hiểu các dân ngoại là lễ vật, nhưng sở hữu cách Hy Lạp không loại trừ hoàn toàn cách hiểu họ là người dâng lễ.
- issue: Ý nghĩa của ἐν trong cụm ἐν πνεύματι ἁγίῳ
  choice: 'Dịch theo nghĩa tác nhân hoặc phương tiện: “được Đức Thánh Linh thánh hóa.”'
  alternative: “Được thánh hóa trong Đức Thánh Linh,” nhấn mạnh phạm vi hoặc sự hiệp thông.
  rationale: Cả hai quan hệ đều có thể được ἐν diễn đạt. Văn cảnh phù hợp với tác động thánh hóa của Đức Thánh Linh, nhưng không nên loại bỏ cách hiểu theo nghĩa phạm vi.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu giữ nguyên chuỗi hình ảnh phụng sự–tư tế–lễ vật của nguyên văn, đồng thời dùng chú thích để bảo tồn các khả năng từ vựng và cú pháp thực sự còn bỏ ngỏ.
