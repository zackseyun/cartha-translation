id: ROM.15.1
reference: Romans 15:1
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ὀφείλομεν δὲ ἡμεῖς οἱ δυνατοὶ τὰ ἀσθενήματα τῶν ἀδυνάτων βαστάζειν, καὶ μὴ ἑαυτοῖς ἀρέσκειν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/001.yaml
  text: We who are strong ought to bear the weaknesses of the weak[a], and not please ourselves.
translation:
  language: vi
  text: Chúng ta là những người mạnh phải mang lấy những yếu đuối của người yếu[a], chứ không chiều theo ý mình.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “những thiếu sót của người yếu.” Từ Hy Lạp có thể chỉ những yếu đuối, giới hạn hoặc thiếu sót; ở đây rất có thể nói đến những dè dặt hoặc giới hạn của lương tâm đã được bàn đến trong chương trước.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὀφείλομεν
  choice: phải
  rationale: Diễn đạt nghĩa vụ đạo đức rõ ràng và tự nhiên trong tiếng Việt; ở đây không nhất thiết mang sắc thái mệnh lệnh tuyệt đối tách khỏi lời khuyên nhủ của Phao-lô.
- source_word: δὲ
  choice: không diễn đạt bằng một từ riêng
  rationale: Đây là liên từ chuyển ý nhẹ. Trong tiếng Việt, quan hệ với đoạn trước đã rõ, nên thêm “nhưng” hoặc “nay” dễ làm câu mang sắc thái đối lập hay thời gian quá mức.
- source_word: ἡμεῖς οἱ δυνατοὶ
  choice: chúng ta là những người mạnh
  rationale: Giữ đại từ nhấn mạnh và sự đối lập “mạnh–yếu” trong ngữ cảnh Rô-ma 14–15; “mạnh” nói chủ yếu về lương tâm và sự tự do trong đức tin.
- source_word: τὰ ἀσθενήματα
  choice: những yếu đuối
  rationale: Cách dịch rộng, không mặc nhiên quy các giới hạn hay sự dè dặt về lương tâm thành tội lỗi hoặc sai phạm đạo đức.
- source_word: τῶν ἀδυνάτων
  choice: của người yếu
  rationale: Duy trì trực tiếp cặp tương phản “người mạnh–người yếu” và phù hợp với cách gọi theo nhóm trong ngữ cảnh.
- source_word: βαστάζειν
  choice: mang lấy
  rationale: Giữ hình ảnh gánh mang và hàm ý chủ động nâng đỡ, mạnh hơn ý chỉ chịu đựng hoặc dung thứ.
- source_word: καὶ μὴ ἑαυτοῖς ἀρέσκειν
  choice: chứ không chiều theo ý mình
  rationale: Diễn đạt tự nhiên ý không tìm điều làm chính mình hài lòng; “chứ không” làm rõ sự tương phản đạo đức mà không thêm nội dung mới.
theological_decisions:
- issue: Ý nghĩa của “người mạnh” và “người yếu”
  choice: Chủ yếu chỉ các tín hữu có mức độ tự do hoặc vững vàng về lương tâm khác nhau trong bối cảnh Rô-ma 14.
  alternative: Chỉ người có quyền lực xã hội đối lập với người yếu thế, hoặc người khỏe mạnh đối lập với người đau yếu.
  rationale: Ngữ cảnh gần nói về thức ăn, ngày tháng và các dè dặt của lương tâm. Bản dịch vẫn giữ từ ngữ rộng “mạnh–yếu”, không chèn cách giải thích vào chính câu.
- issue: Sắc thái của τὰ ἀσθενήματα
  choice: “những yếu đuối” như một thuật ngữ rộng, bao gồm giới hạn hoặc sự dè dặt của lương tâm.
  alternative: “những sai phạm” hoặc “những thất bại” với sắc thái quy lỗi đạo đức rõ hơn.
  rationale: Từ Hy Lạp có thể bao hàm điểm yếu, giới hạn hoặc thiếu sót; ngữ cảnh không buộc phải hiểu theo nghĩa tội lỗi.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Mang lấy” giữ hình ảnh gánh mang; “chiều theo ý mình” tự nhiên hơn lối dịch sát chữ “làm đẹp lòng chính mình” nhưng vẫn giữ trọng tâm đạo đức của câu.
