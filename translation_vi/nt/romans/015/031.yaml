id: ROM.15.31
reference: Romans 15:31
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἵνα ῥυσθῶ ἀπὸ τῶν ἀπειθούντων ἐν τῇ Ἰουδαίᾳ ⸀καὶ ἡ διακονία μου ἡ εἰς Ἰερουσαλὴμ εὐπρόσδεκτος ⸂τοῖς ἁγίοις γένηται⸃,
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/031.yaml
  text: so that I may be rescued from those who are disobedient in Judea[a], and that my service for Jerusalem may become acceptable to the saints,
translation:
  language: vi
  text: để tôi được giải cứu khỏi những người không vâng phục tại Giu-đê[a], và để việc phục vụ của tôi dành cho Giê-ru-sa-lem được các thánh đón nhận,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “khỏi những người không tin tại Giu-đê.” Phân từ Hy Lạp có thể mang nghĩa không chịu tin và vì thế không vâng phục.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἵνα
  choice: để ... và để
  rationale: Dẫn vào hai mục đích song song trong lời Phao-lô xin cầu nguyện; cách lặp lại “để” tự nhiên trong tiếng Việt và phản ánh hai mệnh đề giả định được phối hợp.
- source_word: ῥυσθῶ
  choice: tôi được giải cứu
  rationale: Thể bị động giả định của ῥύομαι chỉ việc thoát khỏi nguy hiểm; “được giải cứu” rõ nghĩa và không thêm sắc thái ngoài văn bản.
- source_word: ἀπὸ τῶν ἀπειθούντων
  choice: khỏi những kẻ không vâng phục
  rationale: ἀπειθέω có thể bao hàm cả không tin lẫn không vâng phục. Bản chính giữ nét bất tuân, còn nghĩa “không tin” được ghi ở chú thích để bảo toàn độ rộng ngữ nghĩa.
- source_word: ἐν τῇ Ἰουδαίᾳ
  choice: tại Giu-đê
  rationale: Cách gọi địa danh quen thuộc trong tiếng Việt; “tại” diễn đạt tự nhiên vị trí của nhóm người được nhắc đến.
- source_word: διακονία
  choice: việc phục vụ
  rationale: Giữ nghĩa rộng của διακονία, đồng thời phù hợp với hành động cụ thể là đem khoản quyên góp đến Giê-ru-sa-lem; tránh sắc thái quá định chế của “chức vụ”.
- source_word: ἡ εἰς Ἰερουσαλήμ
  choice: dành cho Giê-ru-sa-lem
  rationale: Diễn đạt hướng đến và đối tượng thụ hưởng của việc phục vụ một cách tự nhiên, không thu hẹp thành việc di chuyển đơn thuần.
- source_word: εὐπρόσδεκτος
  choice: vui lòng tiếp nhận
  rationale: Truyền đạt ý được đón nhận thuận tình, phù hợp với ngữ cảnh các tín hữu tại Giê-ru-sa-lem tiếp nhận sự phục vụ của Phao-lô.
- source_word: τοῖς ἁγίοις
  choice: các thánh đồ
  rationale: Giữ thuật ngữ quen thuộc của Phao-lô dành cho cộng đồng tín hữu và sắc thái thần học về những người được biệt riêng cho Đức Chúa Trời.
- source_word: γένηται
  choice: được ... tiếp nhận
  rationale: Trong tiếng Việt, cấu trúc này diễn đạt tự nhiên kết quả Phao-lô mong việc phục vụ của mình sẽ được đón nhận, dù không sao chép máy móc sắc thái “trở nên” của γίνομαι.
theological_decisions:
- issue: Ý nghĩa của ἀπειθούντων đối với những người chống đối Phao-lô tại Giu-đê
  choice: “những kẻ không vâng phục” trong bản chính
  alternative: “những người không tin”
  rationale: Phân từ Hy Lạp có thể chỉ việc khước từ tin và do đó không vâng phục. Bản chính giữ nét bất tuân, còn chú thích bảo tồn cách hiểu theo nghĩa không tin, tránh âm thầm giải quyết sự căng thẳng ngữ nghĩa.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Giu-đê,” “Giê-ru-sa-lem” và “các thánh đồ” theo lối thuật ngữ Kinh Thánh tiếng Việt quen thuộc; giữ dấu phẩy cuối câu vì đây là phần tiếp nối của câu văn.
