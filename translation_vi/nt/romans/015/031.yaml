  verdict: revise
  source_fidelity: Bản dịch phản ánh đúng cấu trúc mục đích kép của ἵνα, ý bị động của ῥυσθῶ, và hai đối tượng lời cầu nguyện. Tuy nhiên, “vui lòng tiếp nhận” thêm sắc thái lịch sự/tự nguyện không có trong εὐπρόσδεκτος; từ này nói việc phục vụ được đón nhận một cách thuận tình, chấp nhận được. “Những kẻ” cũng có sắc thái miệt thị mạnh hơn phân từ danh từ hóa trong tiếng Hy Lạp.
  naturalness: Câu văn nhìn chung tự nhiên, trang trọng và giữ được dấu phẩy kết câu theo ngữ cảnh. “Những người không vâng phục” trung tính và hiện đại hơn “những kẻ không vâng phục.” “Được các thánh đón nhận” tự nhiên hơn và sát nghĩa hơn “được các thánh đồ vui lòng tiếp nhận.”
  terminology: “Các thánh đồ” là thuật ngữ quen thuộc trong một số truyền thống, nhưng không phải cách gọi trung tính nhất trong tiếng Việt hiện đại và có thể gợi hệ thuật ngữ giáo phái. “Các thánh” bám sát τοῖς ἁγίοις, vẫn giữ thuật ngữ Phao-lô, và không diễn giải thêm. Giữ “Giu-đê” và “Giê-ru-sa-lem.”
  issues:
