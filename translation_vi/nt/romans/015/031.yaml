    issue: “vui lòng tiếp nhận” đối với εὐπρόσδεκτος
    rationale: Cụm này có thể hàm ý một hành vi lịch sự hay sự tự nguyện, trong khi nguyên ngữ chủ yếu diễn tả việc phục vụ được chấp nhận/đón nhận thuận tình. “Được ... đón nhận” giữ sắc thái đó mà không thêm ý.
  - severity: low
    issue: “những kẻ không vâng phục”
    rationale: “Kẻ” có thể mang tính miệt thị trong tiếng Việt hiện đại. Phân từ ἀπειθούντων xác định nhóm người chống đối nhưng tự nó không đòi hỏi sắc thái miệt thị; “những người” trung tính hơn.
  - severity: low
    issue: “các thánh đồ” đối với τοῖς ἁγίοις
    rationale: Đây là cách dùng có màu sắc truyền thống/giáo phái hơn cần thiết. “Các thánh” là tương ứng trực tiếp, quen thuộc trong ngữ cảnh Kinh Thánh, và trung tính hơn.
