revisions:
- from: Nguyện Đức Chúa Trời, Đấng ban sự kiên nhẫn và khích lệ, cho anh chị em có cùng một tâm ý đối với nhau[a], theo Đấng Mê-si-a là Đức Chúa Jêsus[b],
  to: Nguyện Đức Chúa Trời của sự bền chí và sự khích lệ ban cho anh chị em có cùng một tâm ý với nhau[a], theo Đấng Mê-si-a Giê-su[b],
  rationale: Bản sửa bảo toàn lực cầu chúc của δῴη qua “Nguyện ... ban cho,” giữ sở hữu cách mô tả Đức Chúa Trời là nguồn của sự bền chí và khích lệ, và tránh thêm tước hiệu “Chúa” không có trong nguyên văn. Dấu phẩy cuối câu được giữ vì câu tiếp tục sang câu 6.
