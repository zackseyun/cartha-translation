id: ROM.15.5
reference: Romans 15:5
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὁ δὲ θεὸς τῆς ὑπομονῆς καὶ τῆς παρακλήσεως δῴη ὑμῖν τὸ αὐτὸ φρονεῖν ἐν ἀλλήλοις κατὰ ⸂Χριστὸν Ἰησοῦν⸃,
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/005.yaml
  text: May the God of endurance and encouragement grant you to think the same way toward one another[a], in accordance with Messiah Jesus[b],
translation:
  language: vi
  text: Nguyện Đức Chúa Trời của sự bền chí và sự khích lệ ban cho anh chị em có cùng một tâm ý với nhau[a], theo Đấng Mê-si-a Giê-su[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “suy nghĩ cùng một điều” hoặc “đồng tâm với nhau.”'
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn: “theo Đấng Mê-si-a Giê-su.” Cũng có thể dịch: “theo Đấng Christ Giê-su.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ δὲ θεὸς
  choice: Nguyện Đức Chúa Trời
  rationale: δέ chỉ sự chuyển ý nhẹ trong mạch văn và không cần dịch thành một từ nối riêng; dạng mong ước δῴη được thể hiện tự nhiên bằng “Nguyện ... cho”.
- source_word: τῆς ὑπομονῆς
  choice: Đấng ban sự kiên nhẫn
  rationale: ὑπομονή nói đến khả năng bền lòng, chịu đựng trước khó khăn; “sự kiên nhẫn” là cách nói tự nhiên, còn cấu trúc “Đấng ban” làm rõ quan hệ nguồn ban hàm chứa trong sở hữu cách.
- source_word: τῆς παρακλήσεως
  choice: và khích lệ
  rationale: παράκλησις có thể là sự khích lệ, an ủi hoặc khuyên nhủ; “khích lệ” giữ được nghĩa nâng đỡ rộng trong ngữ cảnh 15:4.
- source_word: δῴη
  choice: cho
  rationale: Dạng optative trong lời cầu chúc được chuyển bằng “Nguyện ... cho”, vừa tự nhiên vừa giữ lực mong ước/cầu nguyện.
- source_word: τὸ αὐτὸ φρονεῖν
  choice: có cùng một tâm ý
  rationale: φρονέω chỉ cách suy nghĩ, thái độ hoặc định hướng nội tâm; “cùng một tâm ý” trang trọng, dễ hiểu và không buộc nghĩa thành đồng nhất mọi ý kiến.
- source_word: ἐν ἀλλήλοις
  choice: đối với nhau
  rationale: Cụm từ diễn tả chiều kích tương giao của tâm ý chung; “đối với nhau” tự nhiên trong tiếng Việt và giữ tính hỗ tương.
- source_word: κατὰ Χριστὸν Ἰησοῦν
  choice: theo Đấng Mê-si-a là Đức Chúa Jêsus
  rationale: κατά chỉ sự phù hợp với khuôn mẫu hay chuẩn mực. Χριστός được dịch theo nghĩa tước hiệu là “Đấng Mê-si-a”; từ “là” giúp cụm tước hiệu–tên riêng rõ và tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Cách dịch Χριστός
  choice: Đấng Mê-si-a là Đức Chúa Jêsus
  alternative: Đức Chúa Jêsus Christ
  rationale: Giữ nghĩa tước hiệu của Χριστός thay vì chỉ phiên âm; cách diễn đạt không áp đặt một cách giải thích hệ phái.
- issue: Ý nghĩa của τὸ αὐτὸ φρονεῖν
  choice: có cùng một tâm ý
  alternative: suy nghĩ hoàn toàn giống nhau về mọi việc
  rationale: Bản dịch giữ lời kêu gọi đồng tâm trong quan hệ cộng đồng nhưng không mở rộng thành yêu cầu đồng nhất tuyệt đối về mọi quan điểm.
- issue: Quan hệ sở hữu cách trong θεὸς τῆς ὑπομονῆς καὶ τῆς παρακλήσεως
  choice: Đấng ban sự kiên nhẫn và khích lệ
  alternative: Đức Chúa Trời của sự kiên nhẫn và khích lệ
  rationale: Sở hữu cách có thể mô tả Đức Chúa Trời là nguồn của những điều này. “Đấng ban” là tiếng Việt tự nhiên, nhưng chú thích bảo lưu cách dịch hình thức hơn.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ đọc. Dùng “anh chị em” cho số nhiều ὑμῖν, “Đức Chúa Trời” và “Đức Chúa Jêsus” theo lối gọi kính trọng quen thuộc. Dấu phẩy cuối câu được giữ vì câu Hy Lạp tiếp tục sang câu kế.
