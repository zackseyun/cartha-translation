id: ROM.15.33
reference: Romans 15:33
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὁ δὲ θεὸς τῆς εἰρήνης μετὰ πάντων ὑμῶν· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/033.yaml
  text: May the God of peace be with all of you. Amen.
translation:
  language: vi
  text: Nguyện Đức Chúa Trời của sự bình an ở cùng tất cả anh chị em. A-men.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: không dịch thành một từ riêng
  rationale: δέ ở đây chỉ có chức năng nối hoặc chuyển ý nhẹ trong lời chúc phước kết đoạn, không mang ý đối lập mạnh và cũng không phải trạng từ chỉ thời gian. Tiếng Việt tự nhiên không cần thêm “nay” hay “nhưng”.
- source_word: θεὸς τῆς εἰρήνης
  choice: Đức Chúa Trời của sự bình an
  rationale: Giữ nguyên cấu trúc danh xưng thuộc cách của nguyên văn và cách gọi quen thuộc của Phao-lô, không diễn giải quá mức.
- source_word: εἰρήνης
  choice: sự bình an
  rationale: Chuyển tải ý hòa bình, sự nguyên vẹn và phúc lành trong danh xưng này bằng cách diễn đạt trang trọng, tự nhiên trong tiếng Việt.
- source_word: μετὰ πάντων ὑμῶν
  choice: ở cùng tất cả anh chị em
  rationale: Bổ sung “ở” theo cú pháp tiếng Việt để diễn đạt lời cầu chúc; “tất cả” bảo toàn phạm vi của πάντων, còn “anh chị em” diễn đạt đại từ số nhiều ὑμῶν một cách tự nhiên trong lời gửi cộng đồng tín hữu.
- source_word: ἀμήν
  choice: A-men
  rationale: Giữ từ phụng vụ quen thuộc dưới dạng phiên âm tiếng Việt, phù hợp với lời kết trang trọng.
theological_decisions:
- issue: Hiểu mệnh đề không có động từ là lời khẳng định hay lời cầu chúc
  choice: 'Dịch như lời cầu chúc: “Nguyện ... ở cùng ...”'
  alternative: “Đức Chúa Trời của sự bình an ở cùng tất cả anh chị em.”
  rationale: Dù nguyên văn không có động từ ở thức cầu chúc hay mệnh lệnh, công thức kết thư này có chức năng là lời nguyện chúc. “Nguyện” thể hiện chức năng ấy mà không biến câu thành một lời khẳng định chỉ định.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Anh chị em” phù hợp lời gửi một cộng đồng gồm nhiều người; không thêm dấu nối diễn ngôn không cần thiết cho δέ.
