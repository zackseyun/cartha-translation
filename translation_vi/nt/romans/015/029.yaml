id: ROM.15.29
reference: Romans 15:29
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οἶδα δὲ ὅτι ἐρχόμενος πρὸς ὑμᾶς ἐν πληρώματι ⸀εὐλογίας Χριστοῦ ἐλεύσομαι.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/029.yaml
  text: And I know that when I come to you[a], I will come in the fullness of the blessing of Messiah.
translation:
  language: vi
  text: Và tôi biết rằng khi đến với anh chị em, tôi sẽ đến với đầy đủ phước lành của Đấng Mê-si-a.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “Đấng Christ.”'
    reason: Bảo lưu cách dịch truyền thống khác của tước hiệu Χριστός.
lexical_decisions:
- source_word: οἶδα
  choice: tôi biết
  rationale: Diễn đạt trực tiếp sự biết chắc của Phao-lô, không làm nhẹ thành một ý kiến hay hy vọng.
- source_word: δὲ
  choice: Và
  rationale: Ở đây δέ là từ nối nhẹ, tiếp tục mạch văn hơn là nêu một sự tương phản mạnh.
- source_word: ἐρχόμενος πρὸς ὑμᾶς
  choice: khi đến với anh chị em
  rationale: Phân từ mang ý nghĩa thời gian so với động từ tương lai; cách diễn đạt này tự nhiên trong tiếng Việt và giữ rõ đối tượng số nhiều.
- source_word: ἐλεύσομαι
  choice: tôi sẽ đến
  rationale: Giữ nguyên ý tương lai trực tiếp của động từ ἔρχομαι.
- source_word: ἐν πληρώματι
  choice: với … trọn vẹn
  rationale: ἐν với tặng cách có thể chỉ hoàn cảnh đi kèm hoặc cách thức. Cách dịch này tự nhiên trong tiếng Việt, đồng thời giữ ý đầy đủ, dồi dào của πλήρωμα.
- source_word: εὐλογίας
  choice: phước lành
  rationale: Đây là cách diễn đạt quen thuộc, trang trọng và dễ hiểu cho εὐλογία trong ngữ cảnh này.
- source_word: Χριστοῦ
  choice: của Đấng Mê-si
  rationale: Χριστός ở đây là tước hiệu; “Đấng Mê-si” truyền đạt ý nghĩa của tước hiệu thay vì xử lý nó như một tên riêng.
theological_decisions:
- issue: Cách dịch Χριστοῦ
  choice: Đấng Mê-si
  alternative: Đấng Christ
  rationale: Giữ rõ nghĩa tước hiệu của Χριστός, trong khi chú thích bảo lưu cách gọi truyền thống quen thuộc.
- issue: Quan hệ của sở hữu cách Χριστοῦ với εὐλογίας
  choice: phước lành của Đấng Mê-si
  alternative: phước lành đến từ Đấng Mê-si
  rationale: Cấu trúc “của” bảo lưu độ mở của sở hữu cách Hy Lạp, có thể gợi nguồn gốc, sự thuộc về hoặc đặc tính, thay vì chỉ quyết định theo nghĩa nguồn gốc.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. “Anh chị em” diễn đạt đại từ số nhiều ὑμᾶς một cách tự nhiên và bao quát; “phước lành trọn vẹn” tránh danh hóa nặng nề mà vẫn giữ ý của πληρώμα.
