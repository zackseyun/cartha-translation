  text: ἵνα ἐν χαρᾷ ⸀ἐλθὼν πρὸς ὑμᾶς διὰ θελήματος ⸀θεοῦ συναναπαύσωμαι ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/032.yaml
  text: so that by God's will I may come to you with joy and be refreshed together with you[a].
translation:
  language: vi
  text: để nhờ ý muốn của Đức Chúa Trời, tôi có thể vui mừng đến với anh chị em và được nghỉ ngơi cùng anh chị em[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “được tươi mới cùng anh chị em” hoặc “tìm được sự nghỉ ngơi cùng anh chị em.” Động từ Hy Lạp diễn tả sự nghỉ ngơi hay tươi mới được cùng nhau chia sẻ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: để
  rationale: Giới thiệu mệnh đề chỉ mục đích tiếp nối lời cầu xin ở câu trước; cách diễn đạt tự nhiên và vẫn giữ lực mục đích.
- source_word: ἐν χαρᾷ
  choice: vui mừng
  rationale: Diễn tả tâm thế đi kèm việc Phao-lô đến; tiếng Việt tự nhiên dùng trạng thái 'vui mừng' mà không làm suy giảm ý nghĩa của danh từ χαρά.
- source_word: ἐλθὼν πρὸς ὑμᾶς
  choice: tôi có thể ... đến với anh chị em
  rationale: Phân từ bất định quá khứ phụ thuộc vào động từ chính được diễn đạt trôi chảy trong cấu trúc mục đích, chỉ việc Phao-lô mong đến gặp các tín hữu tại Rô-ma.
- source_word: διὰ θελήματος θεοῦ
  choice: nhờ ý muốn của Đức Chúa Trời
  rationale: διά với sở hữu cách nêu phương tiện hoặc tác động của ý muốn Đức Chúa Trời; 'nhờ' giữ sắc thái ấy mà không biến câu thành lời khẳng định tất định.
- source_word: συναναπαύσωμαι
  choice: cùng anh chị em được nghỉ ngơi
  rationale: Động từ trung cách, giả định cách mang ý cùng chia sẻ sự nghỉ ngơi hoặc thư thái; 'cùng ... được nghỉ ngơi' giữ rõ sắc thái đồng hưởng của tiền tố συν-.
theological_decisions:
- issue: Tính tương hỗ trong sự nghỉ ngơi Phao-lô mong được chia sẻ với các tín hữu Rô-ma
  choice: cùng anh chị em được nghỉ ngơi
  alternative: được anh chị em làm cho tươi mới; cùng anh chị em được khích lệ
  rationale: Bản dịch giữ ý cùng dự phần trong sự nghỉ ngơi, không mô tả Phao-lô chỉ là người ban cho hay chỉ là người nhận, đồng thời không đưa thêm khái niệm thần học ngoài văn bản.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh chị em” để chỉ cộng đồng tín hữu gồm cả nam lẫn nữ; giữ “Đức Chúa Trời” theo lối gọi phổ biến trong tiếng Việt Cơ Đốc. Cấu trúc câu bảo toàn quan hệ mục đích và sắc thái cùng chia sẻ của động từ Hy Lạp.
