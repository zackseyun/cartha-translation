    rationale: Οἷς οὐκ ἀνηγγέλη περὶ αὐτοῦ có nghĩa sát là “những người mà không điều gì liên quan đến người ấy đã được công bố cho [họ].” Cách sửa giữ ý bị động và quan hệ “về người ấy” rõ ràng hơn.
