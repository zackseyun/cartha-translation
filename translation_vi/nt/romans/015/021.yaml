  text: ἀλλὰ καθὼς γέγραπται· ⸂Οἷς οὐκ ἀνηγγέλη περὶ αὐτοῦ ὄψονται⸃, καὶ οἳ οὐκ ἀκηκόασιν συνήσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/021.yaml
  text: 'but as it is written: Those who were not told about him will see[b][a], and those who have not heard will understand.'
translation:
  language: vi
  text: 'nhưng như có chép:


    “Những người chưa được loan báo gì về người ấy sẽ thấy[a][b],


    và những người chưa nghe sẽ hiểu.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Phao-lô trích Ê-sai 52:15. Trong văn cảnh sách Ê-sai, đại từ “người ấy” chỉ nhân vật người tôi tớ; ở đây, Phao-lô áp dụng lời trích này cho việc ông rao truyền Tin Lành.
    reason: cross_reference
  - marker: b
    text: 'Hoặc, sát cấu trúc Hy Lạp hơn: “Những người mà không có điều gì về người ấy được loan báo cho họ sẽ thấy ...; những người chưa nghe sẽ hiểu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: nhưng
  rationale: Nêu sự tương phản với điều Phao-lô vừa nói về mục tiêu chức vụ của mình; đây là liên từ đối lập tự nhiên trong tiếng Việt.
- source_word: καθὼς γέγραπται
  choice: như có lời chép
  rationale: Công thức dẫn Kinh Thánh quen thuộc, diễn đạt tự nhiên giá trị của thể hoàn thành bị động mà không làm câu nặng nề.
- source_word: Οἷς οὐκ ἀνηγγέλη περὶ αὐτοῦ
  choice: Những người chưa được báo tin về người
  rationale: Chuyển đại từ quan hệ cách dữ liệu sang cấu trúc tiếng Việt tự nhiên; “được báo tin” giữ sắc thái công bố của ἀναγγέλλω, còn “về người” giữ nguyên đại từ αὐτοῦ.
- source_word: ὄψονται
  choice: sẽ thấy
  rationale: Giữ nghĩa trực tiếp của ὁράω và không diễn giải trước thành “nhận biết,” vì vế song song đã dùng động từ chỉ sự hiểu biết.
- source_word: οἳ οὐκ ἀκηκόασιν
  choice: những người chưa nghe
  rationale: “Chưa nghe” diễn đạt tự nhiên trạng thái đến nay vẫn chưa được nghe, phù hợp với thể hoàn thành Hy Lạp.
- source_word: συνήσουσιν
  choice: sẽ hiểu
  rationale: Diễn đạt rõ ràng nghĩa của συνίημι và giữ nguyên lời hứa ở thì tương lai.
theological_decisions:
- issue: Đối tượng của đại từ αὐτοῦ trong lời trích Ê-sai khi Phao-lô sử dụng
  choice: Giữ đại từ “người,” không mở rộng thành “Đấng Mê-si-a” hay “Đấng Christ.”
  alternative: Dịch là “về Đấng Mê-si-a” hoặc “về Đấng Christ.”
  rationale: Bản Hy Lạp chỉ dùng đại từ αὐτοῦ. Giữ đại từ bảo tồn cách diễn đạt của lời trích và tránh đưa phần giải thích thần học vào chính văn.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “người” viết thường để giữ đại từ nguyên văn và không áp đặt cách viết hoa mang tính diễn giải. Nhịp hai vế được giữ để phản ánh tính chất lời trích dẫn.
