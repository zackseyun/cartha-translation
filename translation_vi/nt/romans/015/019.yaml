id: ROM.15.19
reference: Romans 15:19
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐν δυνάμει σημείων καὶ τεράτων, ἐν δυνάμει ⸀πνεύματος· ὥστε με ἀπὸ Ἰερουσαλὴμ καὶ κύκλῳ μέχρι τοῦ Ἰλλυρικοῦ πεπληρωκέναι τὸ εὐαγγέλιον τοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/019.yaml
  text: by the power of signs and wonders[a], by the power of the Spirit, so that from Jerusalem and all around as far as Illyricum I have fully proclaimed the gospel of the Messiah[b],
translation:
  language: vi
  text: bởi quyền năng của các dấu lạ và phép lạ, bởi quyền năng của Thánh Linh,[a] đến nỗi từ Giê-ru-sa-lem và khắp các vùng chung quanh cho đến tận I-ly-ri-cum, tôi đã rao truyền trọn vẹn Tin Mừng của Đấng Mê-si.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sát chữ: “Linh”; trong văn cảnh này rất có thể chỉ Thánh Linh.'
    reason: alternative_reading
  - marker: b
    text: 'Hoặc: “tôi đã hoàn tất việc rao truyền Tin Mừng của Đấng Mê-si.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν δυνάμει
  choice: bởi quyền năng của
  rationale: Cụm giới từ lặp lại diễn tả phương tiện hoặc tác nhân hữu hiệu; cách dịch này tự nhiên và giữ được sự nhấn mạnh của Phao-lô vào quyền năng hành động.
- source_word: σημείων καὶ τεράτων
  choice: các dấu lạ và việc kỳ diệu
  rationale: Giữ hai thành tố của cặp từ Kinh Thánh chỉ những việc phi thường chứng thực hoạt động của Đức Chúa Trời, đồng thời tránh cách diễn đạt dư thừa.
- source_word: πνεύματος
  choice: Thánh Linh
  rationale: Trong văn cảnh chức vụ của Phao-lô được quyền năng thần linh hỗ trợ, từ này rất có khả năng chỉ Thánh Linh; tiếng Việt cần cách gọi xác định, tự nhiên.
- source_word: ὥστε
  choice: đến nỗi
  rationale: Diễn tả kết quả thực tế của quyền năng được nói đến trước đó, phù hợp với cấu trúc ὥστε + đối cách + nguyên mẫu hoàn thành.
- source_word: ἀπὸ Ἰερουσαλὴμ καὶ κύκλῳ
  choice: từ Giê-ru-sa-lem và khắp các vùng chung quanh
  rationale: κύκλῳ được hiểu theo nghĩa trạng từ, bao quát các khu vực chung quanh trên hành trình truyền giáo.
- source_word: μέχρι τοῦ Ἰλλυρικοῦ
  choice: cho đến tận I-ly-ri-cum
  rationale: μέχρι đánh dấu giới hạn địa lý mà chức vụ của Phao-lô đã vươn tới.
- source_word: πεπληρωκέναι
  choice: đã rao truyền trọn vẹn
  rationale: Với tân ngữ là 'Tin Mừng', πληρόω trong văn cảnh này nói đến việc đưa sự công bố Tin Mừng đến mức đầy đủ trên phạm vi được nêu; bản dịch sát chữ 'làm đầy/hoàn tất Tin Mừng' không tự nhiên và dễ gây hiểu sai trong tiếng Việt.
- source_word: τὸ εὐαγγέλιον
  choice: Tin Mừng
  rationale: Cách gọi quen thuộc, ngắn gọn và dễ hiểu trong tiếng Việt hiện đại.
- source_word: τοῦ Χριστοῦ
  choice: của Đấng Mê-si
  rationale: Ở đây Χριστός trong cụm sở thuộc vẫn mang ý nghĩa tước hiệu; 'Đấng Mê-si' làm rõ nghĩa nguyên ngữ mà không biến nó thành tên riêng thuần túy.
theological_decisions:
- issue: Đối tượng được πνεύματος chỉ đến
  choice: Thánh Linh
  alternative: thần linh; Linh
  rationale: Văn cảnh về các dấu lạ, việc kỳ diệu và quyền năng trong chức vụ sứ đồ ủng hộ mạnh mẽ việc hiểu đây là Thánh Linh. Tuy nhiên, nguyên ngữ không có tính từ 'thánh', nên ghi chú bảo tồn độ sát chữ.
- issue: Ý nghĩa của πεπληρωκέναι τὸ εὐαγγέλιον
  choice: đã rao truyền trọn vẹn Tin Mừng
  alternative: đã hoàn tất/làm cho đầy trọn Tin Mừng
  rationale: Cách dịch chính truyền đạt tự nhiên ý rằng Phao-lô đã thực hiện đầy đủ việc công bố Tin Mừng khắp phạm vi địa lý nói trên, nhưng ghi chú giữ lại hình thức sát chữ và sự căng thẳng ngữ nghĩa của πληρόω.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại, dùng các địa danh phiên âm quen thuộc. Câu giữ sự lặp lại của “bởi quyền năng” để bảo toàn nhấn mạnh tu từ trong nguyên ngữ; dấu phẩy được dùng để làm rõ phạm vi địa lý và mệnh đề kết quả.
