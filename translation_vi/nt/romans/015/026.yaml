  text: εὐδόκησαν γὰρ Μακεδονία καὶ Ἀχαΐα κοινωνίαν τινὰ ποιήσασθαι εἰς τοὺς πτωχοὺς τῶν ἁγίων τῶν ἐν Ἰερουσαλήμ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/026.yaml
  text: For Macedonia and Achaia were pleased to make a certain contribution for the poor among the saints in Jerusalem[a].
translation:
  language: vi
  text: Vì các tín hữu ở Ma-xê-đô-ni-a và A-chai đã vui lòng đóng góp một khoản cho những người nghèo trong số các thánh đồ ở Giê-ru-sa-lem[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “thực hiện một sự chia sẻ”; cách nói Hy Lạp nhấn mạnh sự thông công được thể hiện qua việc hỗ trợ vật chất.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐδόκησαν
  choice: đã vui lòng
  rationale: Diễn đạt cả sự tự nguyện lẫn thái độ tích cực của động từ, thay vì chỉ nói họ đã quyết định.
- source_word: γὰρ
  choice: Vì
  rationale: Giữ chức năng giải thích nguyên do của mệnh đề này trong mạch văn trước đó.
- source_word: Μακεδονία καὶ Ἀχαΐα
  choice: người Ma-xê-đô-ni-a và A-chai
  rationale: Hai địa danh được dùng hoán dụ để chỉ các cộng đồng tại đó; thêm “người” giúp câu tiếng Việt tự nhiên mà không xác định hẹp thành các hội thánh.
- source_word: κοινωνίαν τινὰ ποιήσασθαι
  choice: quyên góp một khoản
  rationale: Trong bối cảnh cuộc lạc quyên, cụm từ chỉ sự chia sẻ được thể hiện qua hỗ trợ vật chất; “một khoản” phản ánh tính bất định của τινά mà không hàm ý một số tiền cụ thể.
- source_word: εἰς τοὺς πτωχοὺς
  choice: để giúp những người nghèo
  rationale: εἰς biểu thị mục đích hoặc đối tượng thụ hưởng; cách diễn đạt này rõ ràng và tự nhiên trong tiếng Việt.
- source_word: τῶν ἁγίων
  choice: trong số các thánh đồ
  rationale: 'Bảo tồn quan hệ sở thuộc: những người nghèo là một bộ phận trong cộng đồng các thánh đồ.'
- source_word: τῶν ἐν Ἰερουσαλήμ
  choice: tại Giê-ru-sa-lem
  rationale: Cụm giới từ xác định nơi các thánh đồ ấy đang ở.
theological_decisions:
- issue: Cách dịch ἅγιοι trong văn cảnh Phao-lô
  choice: các thánh đồ
  alternative: những người thánh; dân thánh của Đức Chúa Trời
  rationale: “Thánh đồ” là danh xưng quen thuộc dành cho các tín hữu trong thư Phao-lô và giữ được ý niệm họ được biệt riêng cho Đức Chúa Trời, không ngụ ý việc phong thánh về sau.
translation_notes:
  register: Văn phong trang trọng vừa phải, hiện đại và dễ hiểu. Dùng cách phiên âm quen thuộc cho các địa danh; “vui lòng” bảo tồn sắc thái tự nguyện tích cực, còn “quyên góp một khoản” diễn đạt rõ nghĩa vật chất trong văn cảnh.
