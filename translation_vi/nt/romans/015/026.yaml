  to: Vì các tín hữu ở Ma-xê-đô-ni-a và A-chai đã vui lòng đóng góp một khoản cho những người nghèo trong số các thánh đồ ở Giê-ru-sa-lem[a].
  rationale: Sửa chủ ngữ để biểu đạt rõ phép hoán dụ hai địa danh chỉ các cộng đồng tín hữu mà không giới hạn họ thành một cơ cấu hội thánh cụ thể. Đổi “quyên góp” thành “đóng góp” để phản ánh chính xác hơn hành vi chia sẻ vật chất. Chú thích được chỉnh để “một sự chia sẻ” phản ánh κοινωνία tốt hơn “chia sẻ một phần”, trong khi vẫn giữ tính bất định của τινά trong bản văn chính.
