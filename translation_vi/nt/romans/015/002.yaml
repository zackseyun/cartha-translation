  yaml_path: translation/nt/romans/015/002.yaml
  text: Let each of us please his neighbor for his good[b][a], for building him up.
translation:
  language: vi
  text: Mỗi người chúng ta hãy làm vừa lòng người lân cận mình, để đem lại ích lợi cho người ấy, nhằm gây dựng người ấy.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “nhằm điều tốt lành, để xây dựng.” Cụm từ Hy Lạp nhấn mạnh điều có ích hoặc tốt lành, chứ không phải chỉ làm người khác vừa ý. Từ được dịch là “gây dựng” vốn có nghĩa là “xây dựng” và ở đây được dùng theo nghĩa ẩn dụ về việc củng cố một người.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕκαστος ἡμῶν
  choice: Mỗi người trong chúng ta
  rationale: Diễn đạt tự nhiên cấu trúc số ít phân phối đi với sở hữu cách chỉ bộ phận, đồng thời giữ lời khuyên dành cho từng cá nhân trong cả cộng đồng.
- source_word: τῷ πλησίον
  choice: người lân cận mình
  rationale: Chỉ người ở bên cạnh hay người đồng loại trong nghĩa luân lý; “mình” liên kết tự nhiên với chủ thể phân phối “mỗi người” mà không thêm ý phân biệt giới tính.
- source_word: ἀρεσκέτω
  choice: hãy làm vui lòng
  rationale: Giữ lực mệnh lệnh của động từ hiện tại chủ động ngôi ba số ít, đồng thời dùng cách nói hiện đại và dễ hiểu.
- source_word: εἰς τὸ ἀγαθὸν
  choice: vì điều tốt cho họ
  rationale: Thể hiện mục đích và lợi ích hướng đến người lân cận, làm rõ đây không phải là chiều lòng đơn thuần nhưng không thu hẹp “điều tốt” thành một loại lợi ích riêng biệt.
- source_word: πρὸς οἰκοδομήν
  choice: để xây dựng họ
  rationale: Giữ ẩn dụ xây dựng của οἰκοδομή và diễn đạt mục đích củng cố, gây dựng người kia bằng tiếng Việt phổ thông.
theological_decisions:
- issue: Phạm vi đạo đức của việc làm vui lòng người lân cận
  choice: Mệnh lệnh được giới hạn bởi điều tốt cho người lân cận và mục đích xây dựng họ.
  alternative: Hiểu như lời kêu gọi chiều lòng người khác một cách không giới hạn.
  rationale: Hai cụm từ chỉ mục đích trong nguyên văn xác định việc làm vui lòng là nhằm lợi ích và sự gây dựng của người kia, chứ không đề cao sự lấy lòng như một giá trị tuyệt đối.
translation_notes:
  register: Văn phong tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Bản dịch giữ hai cụm chỉ mục đích và ẩn dụ “xây dựng”; đại từ “họ” được dùng theo nghĩa số ít trung tính trong tiếng Việt hiện đại để quy chiếu “người lân cận” mà không áp đặt giới tính.
