revisions:
- from: Mỗi người trong chúng ta hãy làm vui lòng người lân cận mình vì điều tốt cho họ[a], để xây dựng họ[b].
  to: Mỗi người chúng ta hãy làm vừa lòng người lân cận mình, để đem lại ích lợi cho người ấy, nhằm gây dựng người ấy.[a]
  rationale: Sửa động từ chính thành «làm vừa lòng» để phản ánh sát hơn ἀρεσκέτω. Thay cụm «vì điều tốt cho họ» bằng một cấu trúc chỉ mục đích tự nhiên trong tiếng Việt và dùng «người ấy» để quy chiếu nhất quán đến «người lân cận» số ít. Dùng «gây dựng» trong câu chính để chuyển tải nghĩa ẩn dụ của οἰκοδομή; chú thích hợp nhất bảo lưu các lựa chọn sát chữ và giải thích cả hai cụm từ then chốt.
  reviewer_model: gpt-5.6-terra
