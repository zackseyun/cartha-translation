id: ROM.15.9
reference: Romans 15:9
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: τὰ δὲ ἔθνη ὑπὲρ ἐλέους δοξάσαι τὸν θεόν· καθὼς γέγραπται· Διὰ τοῦτο ἐξομολογήσομαί σοι ἐν ἔθνεσι, καὶ τῷ ὀνόματί σου ψαλῶ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/009.yaml
  text: and the Gentiles might glorify God for his mercy[a], as it is written, “Therefore I will praise you among the Gentiles, and sing praise to your name.”
translation:
  language: vi
  text: 'còn các dân ngoại[a] thì tôn vinh Đức Chúa Trời vì lòng thương xót của Ngài, như có lời chép: “Vì thế, tôi sẽ ca ngợi Ngài giữa các dân ngoại, và hát ca tụng danh Ngài.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch “các dân” và “giữa các dân” (ở cả hai chỗ có ἔθνη/ἔθνεσι). Lập luận của Phao-lô áp dụng lời trích dẫn cách cụ thể cho các dân ngoại, nhưng bản văn được trích cũng mang nghĩa rộng hơn là “các dân”.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ δὲ ἔθνη
  choice: còn các dân ngoại
  rationale: Trong lập luận của Rô-ma, ἔθνη chỉ các dân không thuộc dân Do Thái; “các dân ngoại” diễn đạt rõ sự tương phản ngầm với người Do Thái. δέ được chuyển là “còn” để nối và đối chiếu với câu trước.
- source_word: ὑπὲρ ἐλέους
  choice: vì lòng thương xót của Ngài
  rationale: ὑπέρ với sở hữu cách ở đây nêu lý do hay cơ sở. Thêm “của Ngài” làm rõ lòng thương xót đến từ Đức Chúa Trời, đúng theo ngữ cảnh.
- source_word: δοξάσαι
  choice: tôn vinh
  rationale: Động từ nguyên mẫu aorist phụ thuộc cú pháp vào câu 8. Tiếng Việt không cần thêm một trợ động từ tương ứng với “might”; cấu trúc nối bằng “thì” truyền đạt tự nhiên kết quả/mục đích trong mạch câu.
- source_word: καθὼς γέγραπται
  choice: như có lời chép
  rationale: Công thức dẫn Kinh Thánh quen thuộc, trang trọng và tự nhiên trong tiếng Việt.
- source_word: ἐξομολογήσομαί
  choice: con sẽ ca ngợi Ngài
  rationale: Trong văn cảnh trích dẫn thờ phượng, động từ mang nghĩa công khai ngợi khen hoặc cảm tạ, không phải xưng tội. Đại từ “con” phù hợp lời một người hướng trực tiếp đến Đức Chúa Trời.
- source_word: ἐν ἔθνεσι
  choice: giữa các dân ngoại
  rationale: ἐν với tặng cách có nghĩa vị trí “giữa/ở giữa”. “Các dân ngoại” giữ sự liên kết từ vựng với cách Phao-lô áp dụng lời trích dẫn, còn nghĩa rộng “các dân” được ghi ở chú thích.
- source_word: ψαλῶ
  choice: hát ca tụng
  rationale: ψάλλω ở đây có nghĩa hát lời ngợi khen. “Hát ca tụng” tự nhiên, thể hiện rõ hành động thờ phượng mà không thu hẹp vào việc hát riêng các Thi Thiên.
- source_word: τῷ ὀνόματί σου
  choice: danh Ngài
  rationale: Tặng cách chỉ đối tượng sau ψαλῶ được diễn đạt tự nhiên bằng “ca tụng danh Ngài”, đồng thời giữ thành ngữ Kinh Thánh về danh Đức Chúa Trời.
theological_decisions:
- issue: Quan hệ cú pháp và ý nghĩa của mệnh đề nguyên mẫu mở đầu
  choice: 'Dịch như phần tiếp nối lập luận từ câu 8: còn các dân ngoại thì tôn vinh Đức Chúa Trời vì lòng thương xót của Ngài.'
  alternative: 'Dịch sát hình thức thành mảnh câu: “còn các dân ngoại tôn vinh Đức Chúa Trời vì lòng thương xót”.'
  rationale: 'Bản Hy Lạp phụ thuộc cú pháp vào câu trước. Cấu trúc tiếng Việt với “còn ... thì” cho thấy sự tiếp nối và đối chiếu mà không thêm một cách hiểu thần học ngoài văn bản. Cách dịch cũng giữ nét khác biệt trong lập luận: lời hứa được xác nhận đối với Israel, còn các dân ngoại tôn vinh Đức Chúa Trời vì lòng thương xót.'
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Chúa Trời” và đại từ tôn kính “Ngài”. Giữ nhịp văn dẫn Kinh Thánh bằng “như có lời chép”; dấu chú thích [a] được đặt ngay sau cụm từ liên quan và trước dấu phẩy.
