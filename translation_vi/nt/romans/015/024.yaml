reference: Romans 15:24
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὡς ⸀ἂν πορεύωμαι εἰς τὴν ⸀Σπανίαν, ἐλπίζω γὰρ διαπορευόμενος θεάσασθαι ὑμᾶς καὶ ὑφ’ ὑμῶν προπεμφθῆναι ἐκεῖ ἐὰν ὑμῶν πρῶτον ἀπὸ μέρους ἐμπλησθῶ—
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/024.yaml
  text: whenever I go to Spain—for I hope[a], as I pass through, to see you and to be sent on my way there by you[c][b], if first I may be satisfied in part with your company—
translation:
  language: vi
  text: khi tôi đi Tây Ban Nha[a]—vì tôi hy vọng rằng trên đường đi, tôi sẽ gặp anh chị em và được anh chị em giúp tiếp tục hành trình đến đó[b], nếu trước hết tôi được thỏa lòng phần nào khi ở cùng anh chị em[c]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “khi nào tôi đi Tây Ban Nha.” Cấu trúc Hy Lạp chỉ một thời điểm tương lai chưa xác định.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “được anh chị em tiễn đưa đến đó.” Động từ Hy Lạp có thể hàm ý được hỗ trợ hoặc được đồng hành để tiếp tục chuyến đi.'
    reason: lexical_alternative
  - marker: c
    text: Nguyên văn gần nghĩa là “được đầy phần nào bởi anh chị em”; có lẽ nói đến việc được thỏa lòng nhờ ở với họ trong một thời gian giới hạn.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς ἂν πορεύωμαι
  choice: khi tôi đi
  rationale: Cấu trúc ὡς ἄν với thể giả định chỉ một thời điểm tương lai chưa xác định. “Khi tôi đi” tự nhiên trong tiếng Việt, còn chú thích giữ rõ sắc thái bất định.
- source_word: Σπανίαν
  choice: Tây Ban Nha
  rationale: Tên địa lý chuẩn trong tiếng Việt hiện đại.
- source_word: ἐλπίζω γὰρ
  choice: vì tôi hy vọng rằng
  rationale: “Vì” giữ chức năng giải thích của γάρ; “hy vọng” diễn đạt kỳ vọng đi kèm mong muốn của ἐλπίζω.
- source_word: διαπορευόμενος
  choice: trên đường đi
  rationale: Diễn đạt tự nhiên hoàn cảnh Phao-lô đi ngang qua Rô-ma trên hành trình tới một nơi khác.
- source_word: θεάσασθαι ὑμᾶς
  choice: tôi sẽ gặp anh chị em
  rationale: Trong bối cảnh một chuyến thăm, “gặp” truyền đạt cuộc tiếp xúc trực tiếp tự nhiên hơn cách dịch cứng là “nhìn thấy”.
- source_word: ὑφ’ ὑμῶν προπεμφθῆναι ἐκεῖ
  choice: được anh chị em giúp tiếp tục hành trình đến đó
  rationale: προπέμπω có thể bao gồm việc tiễn đưa, đồng hành hoặc hỗ trợ thiết thực cho chặng đường kế tiếp. Cách dịch này giữ ý hỗ trợ lên đường mà không xác định hình thức hỗ trợ.
- source_word: ἐὰν ... ἐμπλησθῶ
  choice: sau khi ... tôi được thỏa lòng
  rationale: Trong ngữ cảnh này, điều kiện ἐάν trình bày điều Phao-lô mong sẽ xảy ra trước khi ông được giúp đi tiếp. “Được thỏa lòng” diễn đạt ẩn dụ về sự đầy đủ theo lối Việt tự nhiên.
- source_word: ἀπὸ μέρους
  choice: phần nào
  rationale: Giữ ý giới hạn của thành ngữ Hy Lạp mà không quyết định rằng nó chỉ thời lượng hay mức độ thỏa lòng.
- source_word: ὑμῶν
  choice: khi ở cùng anh chị em
  rationale: Làm rõ ý nghĩa quan hệ của sở hữu cách đi với ἐμπλησθῶ trong tiếng Việt tự nhiên, phù hợp với bối cảnh Phao-lô mong được gặp và ở với họ.
theological_decisions:
- issue: Tính chất của sự hỗ trợ Phao-lô mong nhận từ các tín hữu Rô-ma
  choice: được anh chị em giúp tiếp tục hành trình đến đó
  alternative: được anh chị em tiễn đưa đến đó
  rationale: Động từ có thể bao hàm tiễn đưa, đồng hành hoặc cung cấp sự trợ giúp, nhưng câu không nói rõ là tài chính, hậu cần hay hình thức nào khác. Bản dịch không áp đặt một mô hình hỗ trợ truyền giáo cụ thể.
- issue: Ý nghĩa của việc Phao-lô được thỏa lòng nơi các tín hữu Rô-ma
  choice: được thỏa lòng phần nào khi ở cùng anh chị em
  alternative: được đầy trọn phần nào bởi anh chị em
  rationale: Cụm từ nói đến sự thỏa lòng trong mối tương giao, nhưng ἀπὸ μέρους có thể nhấn mạnh mức độ giới hạn hoặc khoảng thời gian hữu hạn. Cách dịch giữ sắc thái giới hạn mà không giải quyết quá mức sự mơ hồ ấy.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh chị em” cho đại từ số nhiều ὑμᾶς/ὑμῶν; giữ dấu gạch ngang cuối câu vì ý văn tiếp tục sang câu kế tiếp.
