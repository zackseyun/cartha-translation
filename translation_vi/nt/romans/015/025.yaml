revisions:
- from: Nhưng bây giờ, tôi đi đến Giê-ru-sa-lem để phục vụ các thánh đồ.[a]
  to: Nhưng hiện nay, tôi đang đi đến Giê-ru-sa-lem để phục vụ các thánh đồ.[a]
  rationale: Chỉ sửa sắc thái thì của động từ chính bằng cách thêm «đang» và thay «bây giờ» bằng «hiện nay» cho mạch văn tự nhiên. Giữ «để phục vụ» như một cách diễn đạt Việt ngữ tự nhiên của phân từ διακονῶν trong bối cảnh, đồng thời chú thích bảo lưu các cách chuyển nghĩa gần, kể cả ý đem trợ giúp. Không đưa chi tiết khoản quyên góp hay địa điểm của các thánh đồ vào câu chính vì nguyên văn câu này không nói rõ các chi tiết đó.
