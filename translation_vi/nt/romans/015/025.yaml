  verdict: revise
  source_fidelity: 'Bản nháp chuyển đạt đúng các thành phần chính của câu: νυνὶ δέ («Nhưng bây giờ»), chuyến đi tới Giê-ru-sa-lem, và việc phục vụ các thánh đồ. Tuy nhiên, «tôi đi» trong tiếng Việt thường có thể được hiểu là một thói quen hay một hành động đơn lẻ không mang sắc thái hiện tại đang diễn tiến/dự định gần như πορεύομαι trong ngữ cảnh này. «Tôi đang đi đến» phản ánh sát hơn thì hiện tại và tình huống chuyến đi.'
