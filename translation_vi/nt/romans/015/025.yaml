  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: νυνὶ δὲ πορεύομαι εἰς Ἰερουσαλὴμ διακονῶν τοῖς ἁγίοις.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/025.yaml
  text: But now I am going to Jerusalem[a], ministering to the saints.
translation:
  language: vi
  text: Nhưng hiện nay, tôi đang đi đến Giê-ru-sa-lem để phục vụ các thánh đồ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “hầu việc các thánh đồ” hoặc “đem sự trợ giúp cho các thánh đồ”. Từ Hy Lạp διακονῶν chỉ việc phục vụ; trong ngữ cảnh này, rất có thể từ này nói đến việc Phao-lô đem khoản quyên góp đến cho các tín hữu tại Giê-ru-sa-lem (xem Rô-ma 15:26).'
    reason: lexical_alternative
lexical_decisions:
- source_word: νυνὶ δὲ
  choice: Nhưng bây giờ
  rationale: νυνί nhấn mạnh thời điểm hiện tại, còn δέ đánh dấu sự chuyển ý có sắc thái tương phản nhẹ; “Nhưng bây giờ” truyền đạt tự nhiên cả hai yếu tố.
- source_word: πορεύομαι
  choice: tôi đi
  rationale: Động từ hiện tại diễn tả việc Phao-lô đang hướng đến hoặc sắp thực hiện chuyến đi; “tôi đi” trực tiếp và không thêm sắc thái ngoài nguyên文.
- source_word: εἰς Ἰερουσαλὴμ
  choice: đến Giê-ru-sa-lem
  rationale: εἰς với tên thành phố chỉ đích đến; “đến” là cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: διακονῶν
  choice: để phục vụ
  rationale: Phân từ hiện tại bổ nghĩa cho chủ ngữ và trong ngữ cảnh có thể diễn tả mục đích hoặc hoàn cảnh của chuyến đi. “Để phục vụ” tự nhiên trong tiếng Việt và giữ nghĩa phục vụ thực tiễn, không biến từ này thành một chức vụ giáo hội.
- source_word: τοῖς ἁγίοις
  choice: các thánh đồ
  rationale: Trong cách dùng của Phao-lô, cụm từ này thường chỉ những người tin Chúa được biệt riêng cho Đức Chúa Trời. “Các thánh đồ” giữ thuật ngữ quen thuộc và sát với hình thức Hy Lạp hơn cách diễn giải “dân của Đức Chúa Trời”.
theological_decisions:
- issue: Đối tượng của cụm từ “các thánh đồ”
  choice: Giữ nguyên thuật ngữ “các thánh đồ” trong câu chính; theo ngữ cảnh, đó là các tín hữu tại Giê-ru-sa-lem, đặc biệt những người nghèo giữa họ.
  alternative: Diễn giải trực tiếp là “các tín hữu tại Giê-ru-sa-lem” hoặc hiểu chung là những người thánh.
  rationale: Câu Hy Lạp chỉ nói “các thánh đồ”, trong khi câu kế tiếp làm rõ bối cảnh của khoản quyên góp dành cho những người nghèo trong số các thánh đồ tại Giê-ru-sa-lem. Giữ cách gọi của nguyên文 tránh đưa phần xác định theo ngữ cảnh vào câu chính.
- issue: Quan hệ của phân từ διακονῶν với động từ chính
  choice: 'Dịch theo sắc thái mục đích: “để phục vụ”.'
  alternative: 'Dịch theo hoàn cảnh đồng thời: “trong khi phục vụ” hoặc “và đang phục vụ”.'
  rationale: Phân từ Hy Lạp có thể diễn tả hoàn cảnh hoặc mục đích. Trong ngữ cảnh chuyến đi đem khoản cứu trợ, sắc thái mục đích là tự nhiên, nhưng chú thích vẫn bảo tồn các cách hiểu từ vựng gần gũi.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Giê-ru-sa-lem” theo lối phiên âm Kinh Thánh quen thuộc; dùng “các thánh đồ” để giữ thuật ngữ thần học truyền thống nhưng không gán địa vị đặc biệt ngoài nghĩa chỉ cộng đồng tín hữu.
