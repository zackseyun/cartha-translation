id: ROM.15.11
reference: Romans 15:11
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ πάλιν· Αἰνεῖτε, ⸂πάντα τὰ ἔθνη, τὸν κύριον⸃, καὶ ⸀ἐπαινεσάτωσαν αὐτὸν πάντες οἱ λαοί.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/011.yaml
  text: 'And again: “Praise the Lord[a], all the nations[b], and let all the peoples praise him.”'
translation:
  language: vi
  text: 'Và lại có lời rằng: “Hỡi muôn dân[b], hãy ca ngợi Chúa[a]; mọi dân tộc hãy ngợi khen Ngài.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “ĐỨC GIÊ-HÔ-VA”, theo nguồn Hê-bơ-rơ của lời trích dẫn; trong bản Hy Lạp, danh riêng của Đức Chúa Trời được biểu thị bằng κύριος (“Chúa”).
    reason: alternative_reading
  - marker: b
    text: Cũng có thể dịch là “tất cả dân ngoại”. Từ Hy Lạp ἔθνη có thể chỉ “các dân” hoặc “dân ngoại”; ở đây lời trích dẫn mang ý nghĩa phổ quát, đồng thời phù hợp với lập luận của Phao-lô về dân ngoại.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ πάλιν
  choice: Và lại có lời rằng
  rationale: Diễn đạt tự nhiên chức năng nối tiếp của καὶ πάλιν khi Phao-lô dẫn thêm một câu Kinh Thánh.
- source_word: Αἰνεῖτε
  choice: hãy ca ngợi
  rationale: Giữ nguyên lực mệnh lệnh ngôi thứ hai số nhiều, đồng thời là cách nói trang trọng và tự nhiên trong tiếng Việt.
- source_word: πάντα τὰ ἔθνη
  choice: muôn dân
  rationale: ἔθνη có thể chỉ các dân, các nước hoặc dân ngoại. “Muôn dân” giữ sắc thái phổ quát của lời trích dẫn mà không loại bỏ mối liên hệ với lập luận của Phao-lô về dân ngoại.
- source_word: τὸν κύριον
  choice: Chúa
  rationale: Dịch trực tiếp κύριος bằng danh xưng quen thuộc “Chúa”; viết hoa vì ở đây danh xưng chỉ Đức Chúa Trời.
- source_word: ἐπαινεσάτωσαν
  choice: hãy tôn vinh
  rationale: Giữ lực mệnh lệnh ngôi thứ ba của động từ, đồng thời dùng từ khác với αἰνεῖτε để phản ánh sự thay đổi từ ngữ trong nguyên văn.
- source_word: αὐτὸν
  choice: Ngài
  rationale: Đại từ quy chiếu về Chúa; “Ngài” là cách xưng hô trang trọng, tự nhiên trong văn phong Kinh Thánh tiếng Việt.
- source_word: πάντες οἱ λαοί
  choice: mọi dân tộc
  rationale: Phân biệt λαοί với ἔθνη ở vế trước và giữ phép song song của câu trích dẫn.
theological_decisions:
- issue: Cách dịch κύριος trong câu trích Cựu Ước nói về Đức Chúa Trời của Israel
  choice: Chúa
  alternative: ĐỨC GIÊ-HÔ-VA
  rationale: Bản Hy Lạp của Rô-ma dùng κύριος, nên bản văn chính dịch là “Chúa”. Tuy nhiên, nguồn Hê-bơ-rơ của lời trích dẫn có danh riêng YHWH; thông tin này được giữ trong chú thích mà không thay thế từ ngữ của bản Hy Lạp.
- issue: Cách hiểu ἔθνη trong bối cảnh Rô-ma 15
  choice: muôn dân
  alternative: tất cả dân ngoại
  rationale: Lời trích dẫn có ý nghĩa phổ quát, kêu gọi mọi dân ca ngợi Chúa. Đồng thời, “dân ngoại” phù hợp với lập luận gần đó của Phao-lô, nên được bảo lưu như một khả năng dịch trong chú thích.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Cấu trúc xưng gọi “Hỡi muôn dân” giúp câu mệnh lệnh tự nhiên; cặp “muôn dân / mọi dân tộc” phần nào duy trì sự phân biệt giữa ἔθνη và λαοί. Các dấu chú thích được đặt ngay sau từ ngữ liên quan.
