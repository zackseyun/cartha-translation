  to: 'Và lại có lời rằng: “Hỡi muôn dân[b], hãy ca ngợi Chúa[a]; mọi dân tộc hãy ngợi khen Ngài.”'
  rationale: 'Chỉnh sửa tối thiểu: thay “tôn vinh” bằng “ngợi khen” để sát nghĩa ἐπαινεσάτωσαν hơn, và làm rõ cách mô tả danh YHWH trong chú thích. Giữ nguyên “muôn dân / mọi dân tộc” để phản ánh sự phân biệt và tính song song giữa ἔθνη và λαοί, cũng như giữ các vị trí neo chú thích hiện có.'
