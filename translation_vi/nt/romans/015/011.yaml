  source_fidelity: 'Bản dịch truyền đạt đúng cấu trúc lời trích dẫn: lời kêu gọi mọi ἔθνη ca ngợi Chúa, rồi mọi λαοί ngợi khen Ngài. Tuy nhiên, “tôn vinh” có sắc thái mạnh và rộng hơn ἐπαινεσάτωσαν (“ngợi khen/ca ngợi”); thay bằng “ngợi khen” sát hơn, đồng thời vẫn giữ sự khác biệt từ vựng với “ca ngợi” ở vế đầu.'
