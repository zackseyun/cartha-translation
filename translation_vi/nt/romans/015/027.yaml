id: ROM.15.27
reference: Romans 15:27
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εὐδόκησαν γάρ, καὶ ὀφειλέται ⸂εἰσὶν αὐτῶν⸃· εἰ γὰρ τοῖς πνευματικοῖς αὐτῶν ἐκοινώνησαν τὰ ἔθνη, ὀφείλουσιν καὶ ἐν τοῖς σαρκικοῖς λειτουργῆσαι αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/027.yaml
  text: For they were pleased to do it[a], and they are indebted to them. For if the Gentiles have shared in their spiritual things[c][b], they also owe it to minister to them in material things.
translation:
  language: vi
  text: Vì họ vui lòng làm điều đó, và họ cũng mắc nợ những người ấy. Thật vậy, nếu các dân ngoại[a] đã dự phần vào những điều thuộc linh của họ[b], thì các dân ngoại cũng có nghĩa vụ phục vụ họ bằng những điều vật chất[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “các dân tộc”; ở đây chỉ những người không phải Do Thái.
    reason: lexical_alternative
  - marker: b
    text: Hay “những phước lành thuộc linh của họ”. Nguyên văn Hy Lạp nói “những điều thuộc linh của họ”.
    reason: lexical_alternative
  - marker: c
    text: Sát nghĩa là “trong những điều thuộc về xác thịt”; ở đây chỉ sự hỗ trợ vật chất hoặc nhu cầu thân thể, đối lập với những điều thuộc linh.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐδόκησαν
  choice: họ vui lòng làm điều đó
  rationale: Diễn đạt sự tự nguyện và tán thành hàm chứa trong động từ, còn “làm điều đó” dựa vào khoản quyên góp được nhắc ở câu trước.
- source_word: ὀφειλέται εἰσὶν αὐτῶν
  choice: họ cũng mắc nợ những người ấy
  rationale: Giữ hình ảnh về món nợ và nghĩa vụ đạo đức, đồng thời dùng cách nói tự nhiên trong tiếng Việt.
- source_word: τὰ ἔθνη
  choice: các dân ngoại
  rationale: Trong mạch văn của Phao-lô, cụm từ chỉ những người không phải Do Thái, đối chiếu với các tín hữu Do Thái tại Giê-ru-sa-lem.
- source_word: τοῖς πνευματικοῖς αὐτῶν
  choice: những điều thuộc linh của họ
  rationale: Giữ dạng tính từ được danh từ hóa của nguyên văn, không tự ý giới hạn thành “phước lành”.
- source_word: ἐκοινώνησαν
  choice: đã được dự phần vào
  rationale: Diễn đạt sự tham dự và nhận phần trong những điều thuộc linh; thể bị động tiếng Việt tự nhiên làm rõ họ được hưởng phần mà không thay đổi quan hệ ý nghĩa.
- source_word: ἐν τοῖς σαρκικοῖς
  choice: bằng những điều vật chất
  rationale: Trong bối cảnh khoản cứu trợ, σαρκικός nói đến phương diện vật chất hoặc thân thể, không mang nghĩa đạo đức là xác thịt tội lỗi.
- source_word: λειτουργῆσαι
  choice: phục vụ
  rationale: Từ này chỉ việc thi hành sự phục vụ, có sắc thái trang trọng; “phục vụ” tự nhiên hơn “thi hành chức vụ” và không gợi rằng chỉ hàng giáo phẩm mới thực hiện.
theological_decisions:
- issue: Ý nghĩa của σαρκικοῖς khi đối chiếu với πνευματικοῖς
  choice: những điều vật chất
  alternative: những điều thuộc về xác thịt
  rationale: Khoản quyên góp cho các thánh đồ tại Giê-ru-sa-lem cho thấy đây là sự hỗ trợ vật chất, không phải điều mang bản chất tội lỗi.
- issue: Đối tượng của αὐτῶν / αὐτοῖς
  choice: những người được nhận sự phục vụ, trước hết là các tín hữu tại Giê-ru-sa-lem trong mạch văn
  alternative: dân Y-sơ-ra-ên theo nghĩa rộng
  rationale: Rô-ma 15:25–26 trực tiếp nói đến khoản cứu trợ cho các thánh đồ tại Giê-ru-sa-lem, dù lập luận của Phao-lô cũng có nền tảng lịch sử cứu chuộc rộng hơn liên quan đến người Do Thái.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “các dân ngoại” theo cách gọi quen thuộc trong ngữ cảnh Kinh Thánh; dùng “những điều thuộc linh” để giữ độ mở của nguyên văn, và “những điều vật chất” để tránh hiểu σαρκικός theo nghĩa tội lỗi.
