  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἔχω οὖν ⸀τὴν καύχησιν ἐν Χριστῷ Ἰησοῦ τὰ πρὸς τὸν θεόν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/017.yaml
  text: Therefore I have reason for boasting in Messiah Jesus in the things pertaining to God[a][b][c].
translation:
  language: vi
  text: Vậy, trong Đấng Mê-si-a Giê-su[b], tôi có lý do để tự hào[a] về những việc liên quan đến Đức Chúa Trời[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “tôi có điều để tự hào” hoặc “tôi có cơ sở để tự hào.”'
    reason: lexical_alternative
  - marker: b
    text: 'Trong tiếng Hy Lạp: “trong Đấng Christ Giê-su”; Χριστός là tước hiệu, nghĩa là “Đấng Mê-si-a.”'
    reason: alternative_reading
  - marker: c
    text: 'Cũng có thể dịch: “về những việc thuộc về Đức Chúa Trời” hoặc “về những vấn đề liên quan đến Đức Chúa Trời.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔχω
  choice: tôi có
  rationale: Diễn đạt trực tiếp động từ hiện tại ngôi thứ nhất số ít, tự nhiên trong tiếng Việt.
- source_word: οὖν
  choice: Vậy
  rationale: Cho thấy đây là kết luận rút ra từ lập luận trước đó; “Vậy” rõ ràng và tự nhiên hơn cách diễn đạt nặng tính văn viết.
- source_word: τὴν καύχησιν
  choice: có lý do để tự hào
  rationale: Trong ngữ cảnh này, danh từ καύχησις có thể chỉ sự tự hào hoặc cơ sở để tự hào. Cách dịch này truyền đạt ý thành ngữ mà không biến lời Phao-lô thành sự khoe khoang độc lập với Đấng Mê-si-a.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: trong Đấng Mê-si-a Giê-su
  rationale: Giữ giới từ “trong”, qua đó bảo toàn ý về phạm vi hoặc sự hiệp nhất thay vì thu hẹp thành phương tiện; Χριστός được dịch như một tước hiệu.
- source_word: τὰ πρὸς τὸν θεόν
  choice: về những việc liên quan đến Đức Chúa Trời
  rationale: Cụm từ bao quát những việc hướng đến hoặc có liên hệ với Đức Chúa Trời. Cách dịch này tự nhiên, đồng thời không thu hẹp nghĩa chỉ còn công tác tế lễ hay chức vụ.
- source_word: θεόν
  choice: Đức Chúa Trời
  rationale: Cách gọi trang trọng, thông dụng trong văn phong Kinh Thánh tiếng Việt.
theological_decisions:
- issue: Cách dịch Χριστός
  choice: Đấng Mê-si-a
  alternative: Đấng Christ; Christ
  rationale: Ở đây Χριστός vẫn mang chức năng tước hiệu gắn với tên Giê-su, nên dịch nghĩa thay vì chỉ phiên âm.
- issue: Ý nghĩa của καύχησις nơi Phao-lô
  choice: có lý do để tự hào, nhưng sự tự hào được đặt trong Đấng Mê-si-a và giới hạn vào những việc liên quan đến Đức Chúa Trời
  alternative: một sự tự tin cá nhân nói chung; chỉ là niềm vui chủ quan
  rationale: Hai cụm “trong Đấng Mê-si-a Giê-su” và “về những việc liên quan đến Đức Chúa Trời” định rõ phạm vi lời tự hào, nhưng bản dịch không thêm lời giải thích thần học vào chính câu.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Trật tự đưa “trong Đấng Mê-si-a Giê-su” lên đầu giúp câu tự nhiên và giữ rõ phạm vi của lời tự hào. Dùng “tự hào” thay vì “khoe khoang” để phù hợp sắc thái tích cực nhưng có giới hạn trong ngữ cảnh.
