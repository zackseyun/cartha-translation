id: ROM.15.10
reference: Romans 15:10
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ πάλιν λέγει· Εὐφράνθητε, ἔθνη, μετὰ τοῦ λαοῦ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/010.yaml
  text: And again he says[a], “Rejoice, Gentiles, with his people.”
translation:
  language: vi
  text: 'Lại có lời phán: “Hỡi các dân ngoại[a], hãy vui mừng cùng dân của Ngài.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “các dân tộc”.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν
  choice: lại
  rationale: Trong công thức dẫn Kinh Thánh, từ này giới thiệu thêm một lời trích dẫn; “lại” là cách diễn đạt tự nhiên và sát nghĩa trong tiếng Việt.
- source_word: λέγει
  choice: có lời phán
  rationale: Cách diễn đạt này giữ sắc thái lời Kinh Thánh đang cất tiếng trong hiện tại, đồng thời tránh xác định quá mức chủ ngữ vốn chỉ được hiểu ngầm trong tiếng Hy Lạp.
- source_word: Εὐφράνθητε
  choice: hãy vui mừng
  rationale: Diễn đạt rõ lực mệnh lệnh và ý nghĩa ‘vui mừng, hân hoan’, với văn phong trang trọng nhưng dễ hiểu.
- source_word: ἔθνη
  choice: các dân ngoại
  rationale: Trong lập luận của Rô-ma 15 về việc người ngoài dân Do Thái cùng ngợi khen Đức Chúa Trời, “các dân ngoại” truyền đạt rõ chiều kích Do Thái–dân ngoại. Nghĩa rộng hơn là “các dân tộc” được giữ trong chú thích.
- source_word: μετὰ τοῦ λαοῦ αὐτοῦ
  choice: cùng dân của Ngài
  rationale: “Cùng” diễn đạt sự liên kết của μετά với sở hữu ngữ; “dân của Ngài” giữ nguyên ý nghĩa giao ước mà không diễn giải λαός thành ‘dân Y-sơ-ra-ên’.
theological_decisions:
- issue: Cách dịch ἔθνη trong lời trích dẫn về sự hiệp nhất giữa dân Do Thái và các dân khác
  choice: các dân ngoại
  alternative: các dân tộc
  rationale: Ngữ cảnh trực tiếp nhấn mạnh việc các dân ngoài Do Thái cùng dân giao ước ngợi khen Đức Chúa Trời. “Các dân ngoại” làm rõ điểm này, còn chú thích bảo lưu nghĩa rộng của từ và âm hưởng của nguồn Cựu Ước.
- issue: Chủ ngữ được hiểu ngầm của λέγει
  choice: có lời phán
  alternative: Ngài phán; Kinh Thánh nói
  rationale: Bản Hy Lạp không nêu chủ ngữ ngay trong câu. Cách dịch vô nhân xưng tự nhiên trong tiếng Việt giữ được tính chất lời phán mà không buộc người đọc chọn giữa Đức Chúa Trời, tác giả Kinh Thánh hay Kinh Thánh được nhân cách hóa.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ đọc. Dùng lời gọi “Hỡi” để thể hiện rõ đối tượng của mệnh lệnh; giữ “dân của Ngài” thay vì diễn giải thành “dân Y-sơ-ra-ên” nhằm bảo toàn mức độ minh thị của nguyên văn.
