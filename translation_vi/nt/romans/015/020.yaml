    rationale: δὲ ở đây là liên từ tiếp nối nhẹ, không đòi hỏi một đối lập mạnh. Cú pháp “làm hoài bão, nhưng không rao truyền tại nơi...” cũng kém gọn và làm lỏng sự gắn kết trực tiếp giữa φιλοτιμούμενον với εὐαγγελίζεσθαι οὐχ ὅπου.
