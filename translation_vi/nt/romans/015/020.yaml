id: ROM.15.20
reference: Romans 15:20
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οὕτως δὲ ⸀φιλοτιμούμενον εὐαγγελίζεσθαι οὐχ ὅπου ὠνομάσθη Χριστός, ἵνα μὴ ἐπ’ ἀλλότριον θεμέλιον οἰκοδομῶ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/020.yaml
  text: And in this way I make it my ambition to proclaim the good news[a], not where Messiah has already been named[b], so that I might not build on another's foundation.
translation:
  language: vi
  text: Như vậy, tôi lấy việc rao truyền Tin Mừng làm hoài bão của mình, không phải ở những nơi Đấng Mê-si[a] đã được xưng danh, để tôi không xây trên nền móng của người khác[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “Đấng Christ.” Từ Hy Lạp Χριστός ở đây được hiểu theo chức năng tước hiệu.
    reason: alternative_reading
  - marker: b
    text: Nguyên văn là “nền móng thuộc về người khác,” một ẩn dụ xây dựng chỉ công việc truyền giáo đã được người khác khởi lập.
    reason: lexical_clarification
lexical_decisions:
- source_word: οὕτως δὲ
  choice: Như vậy
  rationale: Nối câu này với phần mô tả trước đó về chức vụ của Phao-lô; cách diễn đạt tự nhiên, đồng thời giữ sắc thái tiếp nối nhẹ của δὲ.
- source_word: φιλοτιμούμενον
  choice: tôi lấy ... làm hoài bão
  rationale: Diễn đạt sự chuyên tâm và khát vọng có chủ ý, mạnh hơn một mong muốn thoáng qua nhưng không thêm ý về mệnh lệnh.
- source_word: εὐαγγελίζεσθαι
  choice: rao truyền Tin Mừng
  rationale: Giữ nghĩa động từ là công bố tin mừng, bằng lối nói hiện đại, trang trọng và dễ hiểu.
- source_word: οὐχ ὅπου ὠνομάσθη Χριστός
  choice: không rao truyền tại nơi Đấng Mê-si đã được xưng danh
  rationale: Giữ cấu trúc địa điểm, thể bị động và hình ảnh 'được xưng danh'; động từ 'rao truyền' được lặp lại để câu tiếng Việt rõ nghĩa.
- source_word: Χριστός
  choice: Đấng Mê-si
  rationale: Trong ngữ cảnh này, từ Hy Lạp hoạt động như một tước hiệu của Đấng được rao truyền, thay vì chỉ như một tên riêng.
- source_word: ἵνα μὴ ... οἰκοδομῶ
  choice: để tôi không xây
  rationale: Giữ rõ quan hệ mục đích và ngôi thứ nhất của lời phát biểu.
- source_word: ἐπ’ ἀλλότριον θεμέλιον
  choice: trên nền móng của người khác
  rationale: Giữ nguyên ẩn dụ xây dựng và ý nền móng thuộc về một người khác, không thêm từ chỉ giới tính vốn không có trong tiếng Hy Lạp.
theological_decisions:
- issue: Cách dịch Χριστός
  choice: Đấng Mê-si
  alternative: Đấng Christ
  rationale: Tước hiệu này chỉ Đấng đang được công bố; 'Đấng Mê-si' làm rõ chức năng tước hiệu mà vẫn ghi nhận cách dịch truyền thống trong chú thích.
- issue: Phạm vi nguyên tắc truyền giáo của Phao-lô
  choice: Trình bày đây là hoài bão riêng của Phao-lô
  alternative: Diễn đạt như lệnh cấm phổ quát đối với việc phục vụ tại nơi Đấng Mê-si đã được biết đến
  rationale: Dạng ngôi thứ nhất và động từ chỉ hoài bão mô tả định hướng chức vụ của Phao-lô, không tự nó thiết lập một lệnh cấm cho mọi người.
- issue: Ý nghĩa của ὠνομάσθη
  choice: đã được xưng danh
  alternative: đã được biết đến hoặc đã được rao giảng
  rationale: Giữ hình thức và độ mở nghĩa của nguyên văn, không đồng nhất việc 'xưng danh' hoàn toàn với một cách giải thích cụ thể.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Cụm “lấy ... làm hoài bão” giữ sức nặng của φιλοτιμούμενον; “xưng danh” bảo tồn cách nói và độ mở nghĩa của nguyên văn, còn “nền móng” duy trì nhất quán ẩn dụ xây dựng.
