  to: Như vậy, tôi lấy việc rao truyền Tin Mừng làm hoài bão của mình, không phải ở những nơi Đấng Mê-si[a] đã được xưng danh, để tôi không xây trên nền móng của người khác[b].
  rationale: Bỏ liên từ đối lập và không lặp động từ “rao truyền” để mệnh đề “không phải ở những nơi...” bổ nghĩa trực tiếp, tự nhiên cho hoài bão rao truyền của Phao-lô. Việc thêm “của mình” làm rõ sở hữu ngôi thứ nhất vốn đã hàm trong ngữ cảnh mà không thay đổi ý nghĩa.
