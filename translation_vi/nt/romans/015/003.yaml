revisions:
- from: 'Vì ngay cả Đấng Mê-si cũng không làm đẹp lòng chính mình,[a] nhưng như có lời chép: “Những lời sỉ nhục của những kẻ sỉ nhục Ngài đã đổ xuống trên con.”'
  to: 'Vì ngay cả Đấng Mê-si cũng không làm đẹp lòng chính mình,[a] nhưng như có lời chép: “Những lời sỉ nhục của những kẻ sỉ nhục Ngài đã đổ xuống trên tôi.”'
  rationale: Chỉ sửa đại từ ngôi thứ nhất trong lời trích từ «con» thành «tôi». Bản sửa giữ phép xưng hô tôn kính ngôi thứ hai của bản dịch nhưng không thêm quan hệ con cái hoặc xác định căn tính người nói ngoài điều nguyên văn cho biết.
