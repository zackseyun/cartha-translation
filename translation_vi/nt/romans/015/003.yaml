    issue: «con» trong lời trích
    rationale: ἐμέ chỉ đơn giản là «tôi/me». «Con» không chỉ là một lựa chọn lịch sự mà còn mặc nhiên xác định người nói là con đối với người được gọi là «Ngài». Điều này thêm một quan hệ mà câu trích Hy Lạp không phát biểu, trái với mục tiêu giữ nguyên sự không xác định về căn tính tiếng nói.
