id: ROM.15.3
reference: Romans 15:3
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ γὰρ ὁ Χριστὸς οὐχ ἑαυτῷ ἤρεσεν· ἀλλὰ καθὼς γέγραπται· Οἱ ὀνειδισμοὶ τῶν ὀνειδιζόντων σε ἐπέπεσαν ἐπ’ ἐμέ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/003.yaml
  text: For even the Messiah did not please himself[a], but as it is written, “The reproaches of those who reproached you fell on me.”
translation:
  language: vi
  text: 'Vì ngay cả Đấng Mê-si cũng không làm đẹp lòng chính mình,[a] nhưng như có lời chép: “Những lời sỉ nhục của những kẻ sỉ nhục Ngài đã đổ xuống trên tôi.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “Đấng Christ” thay cho “Đấng Mê-si.”
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ γὰρ
  choice: Vì ngay cả
  rationale: “Vì” nối câu này với lời khuyên ở câu trước theo quan hệ giải thích, còn “ngay cả” giữ sắc thái nhấn mạnh của καί.
- source_word: ὁ Χριστός
  choice: Đấng Mê-si
  rationale: Mạo từ và vai trò nêu gương trong ngữ cảnh cho thấy Χριστός được dùng như một tước hiệu; “Đấng Mê-si” diễn đạt rõ ý nghĩa ấy trong tiếng Việt hiện đại.
- source_word: οὐχ ἑαυτῷ ἤρεσεν
  choice: cũng không làm đẹp lòng chính mình
  rationale: Cách dịch sát giữ động từ “làm đẹp lòng” và đại từ phản thân, không diễn giải thêm thành tìm lợi ích hay thú vui riêng.
- source_word: ἀλλὰ καθὼς γέγραπται
  choice: nhưng như có lời chép
  rationale: Đây là công thức dẫn Kinh Thánh quen thuộc; cách diễn đạt này tự nhiên, trang trọng và truyền đạt hiệu lực hiện tại của thể hoàn thành γέγραπται.
- source_word: ὀνειδισμοί
  choice: những lời sỉ nhục
  rationale: Danh từ chỉ lời lăng mạ gắn với sự làm nhục; “những lời sỉ nhục” rõ nghĩa hơn “những sự sỉ nhục” trong tiếng Việt mà vẫn giữ giọng trang trọng.
- source_word: τῶν ὀνειδιζόντων σε
  choice: của những kẻ sỉ nhục Ngài
  rationale: Giữ sự lặp từ cùng gốc với ὀνειδισμοί, đồng thời chuyển phân từ thành cụm danh từ tự nhiên trong tiếng Việt.
- source_word: ἐπέπεσαν ἐπ’ ἐμέ
  choice: đã đổ xuống trên con
  rationale: Diễn đạt hình ảnh những lời sỉ nhục giáng xuống người nói; “đã” phản ánh động từ aorist và “trên con” giữ cấu trúc của nguyên văn.
theological_decisions:
- issue: Cách dịch Χριστός
  choice: Đấng Mê-si
  alternative: Đấng Christ
  rationale: Trong câu này, Χριστός nổi bật như tước hiệu của Đấng được nêu làm gương. Chú thích giữ cách gọi “Đấng Christ” vốn quen thuộc với nhiều độc giả Việt Nam.
- issue: Ngôi xưng hô trong lời trích Thi Thiên
  choice: “Ngài” cho σε và “con” cho ἐμέ
  alternative: “Chúa” cho σε và “tôi” cho ἐμέ
  rationale: Nguyên văn chỉ có đại từ ngôi thứ hai và ngôi thứ nhất, không nêu danh tính người nói hay người được nói với. “Ngài/con” phù hợp lời hướng về Đức Chúa Trời nhưng không thêm danh xưng “Chúa”, qua đó tránh giải quyết quá mức căn tính của tiếng nói trong câu trích.
- issue: Căn tính của người nói trong lời trích
  choice: Không nêu rõ người nói là Đấng Mê-si trong bản văn
  alternative: Thêm lời giải thích xác định “con” là Đấng Mê-si
  rationale: Phao-lô áp dụng Thi Thiên 69:9 cho Đấng Mê-si, nhưng bản thân lời trích vẫn được giữ nguyên mà không chèn phần giải nghĩa vào lời nói.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Bản dịch giữ cấu trúc lập luận và công thức trích dẫn Kinh Thánh, đồng thời dùng cách xưng hô tôn kính trong lời trích mà không thêm danh tính ngoài nguyên văn.
