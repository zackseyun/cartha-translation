id: ROM.9.17
reference: Romans 9:17
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: λέγει γὰρ ἡ γραφὴ τῷ Φαραὼ ὅτι Εἰς αὐτὸ τοῦτο ἐξήγειρά σε ὅπως ἐνδείξωμαι ἐν σοὶ τὴν δύναμίν μου, καὶ ὅπως διαγγελῇ τὸ ὄνομά μου ἐν πάσῃ τῇ γῇ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/017.yaml
  text: 'For the Scripture says to Pharaoh[a], “For this very purpose I raised you up: that I might display my power in you[b], and that my name might be proclaimed in all the earth.”'
translation:
  language: vi
  text: 'Vì Kinh Thánh nói với Pha-ra-ôn rằng: “Chính vì mục đích này, Ta đã dấy ngươi lên[a], để Ta bày tỏ quyền năng của Ta nơi ngươi, và để danh Ta được rao truyền trên khắp đất[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Ta đã bảo tồn ngươi” hoặc “Ta đã khiến ngươi đứng vững.” Động từ Hy Lạp có nghĩa rộng trong bối cảnh lời trích từ sách Xuất Hành.'
    reason: lexical_alternative
  - marker: b
    text: “Danh Ta” chỉ uy danh và danh tiếng của Đức Chúa Trời được bày tỏ, chứ không chỉ là một tên gọi được phát âm.
    reason: cultural_note
lexical_decisions:
- source_word: ἡ γραφή
  choice: Kinh Thánh
  rationale: 'Giữ danh từ số ít xác định và lối nhân cách hóa: văn bản Kinh Thánh nói với Pha-ra-ôn.'
- source_word: λέγει ... τῷ Φαραώ
  choice: nói với Pha-ra-ôn
  rationale: Giữ thì hiện tại văn chương của lời trích dẫn; cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: γὰρ
  choice: Vì
  rationale: Giữ quan hệ giải thích với lập luận ngay trước đó.
- source_word: Εἰς αὐτὸ τοῦτο
  choice: Chính vì mục đích này
  rationale: Diễn đạt cả ý mục đích lẫn sắc thái nhấn mạnh của αὐτὸ τοῦτο.
- source_word: ἐξήγειρά σε
  choice: Ta đã khiến ngươi đứng lên
  rationale: 'Giữ nghĩa rộng của động từ: khiến xuất hiện, đưa lên vị trí, hoặc khiến tiếp tục đứng vững; không thu hẹp thành được tạo dựng hay chỉ được bảo tồn.'
- source_word: ὅπως
  choice: để
  rationale: Thể hiện rõ ý mục đích trong cả hai mệnh đề.
- source_word: ἐνδείξωμαι
  choice: Ta bày tỏ
  rationale: Truyền đạt ý công khai biểu lộ hay chứng tỏ quyền năng.
- source_word: ἐν σοὶ
  choice: nơi ngươi
  rationale: Giữ độ rộng của ἐν, nói về quyền năng được biểu lộ trong trường hợp hoặc nơi chính Pha-ra-ôn, thay vì diễn giải thành chỉ 'qua ngươi'.
- source_word: τὴν δύναμίν μου
  choice: quyền năng của Ta
  rationale: Cách dịch trang trọng, rõ nghĩa và quen thuộc của δύναμις trong ngữ cảnh nói về Đức Chúa Trời.
- source_word: καὶ ὅπως διαγγελῇ
  choice: và để ... được rao truyền
  rationale: Giữ cấu trúc mục đích song song và sắc thái loan báo rộng rãi của thể bị động.
- source_word: τὸ ὄνομά μου
  choice: danh Ta
  rationale: Giữ hình ảnh nguyên bản; 'danh' ở đây bao hàm tiếng tăm và sự tự bày tỏ của Đức Chúa Trời.
- source_word: ἐν πάσῃ τῇ γῇ
  choice: khắp đất
  rationale: Diễn đạt tự nhiên phạm vi toàn thể của câu, không thu hẹp γῆ thành một vùng đất riêng.
theological_decisions:
- issue: Ý nghĩa của ἐξήγειρά σε đối với Pha-ra-ôn và quyền tể trị của Đức Chúa Trời
  choice: Ta đã khiến ngươi đứng lên
  alternative: Ta đã bảo tồn ngươi / Ta đã khiến ngươi tiếp tục đứng vững / Ta đã đưa ngươi lên
  rationale: Cách dịch giữ lời khẳng định rằng Đức Chúa Trời đặt Pha-ra-ôn vào vị trí này hoặc duy trì ông cho mục đích ấy, nhưng không quyết định thay văn bản rằng động từ chỉ nói về việc tạo dựng, đưa lên cầm quyền hay đơn thuần giữ cho sống.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Đại từ “Ta/ngươi” được dùng trong lời Đức Chúa Trời phán với Pha-ra-ôn để giữ sắc thái uy nghiêm và quan hệ quyền bính; cấu trúc hai mệnh đề “để” bảo toàn tính song song của nguyên văn.
