reference: Romans 9:16
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἄρα οὖν οὐ τοῦ θέλοντος οὐδὲ τοῦ τρέχοντος ἀλλὰ τοῦ ἐλεῶντος θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/016.yaml
  text: So then[a], it does not depend on the one who wills or the one who runs[b], but on God who shows mercy.
translation:
  language: vi
  text: Vậy nên[a], điều ấy không tùy thuộc vào người muốn, cũng không tùy thuộc vào người chạy[b], nhưng tùy thuộc vào Đức Chúa Trời, Đấng bày tỏ lòng thương xót.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch sát hình thức hơn: “Vậy nên, không phải bởi người muốn, cũng không phải bởi người chạy, nhưng bởi Đức Chúa Trời, Đấng bày tỏ lòng thương xót.” Tiếng Hy Lạp dùng lối nói tỉnh lược; điều được nói đến phải được hiểu từ văn mạch về mục đích và lòng thương xót của Đức Chúa Trời.'
    reason: lexical_alternative
  - marker: b
    text: “Chạy” có lẽ là hình ảnh chỉ nỗ lực hay sự phấn đấu của con người, nhưng động từ Hy Lạp theo nghĩa đen là “chạy”.
    reason: cultural_note
lexical_decisions:
- source_word: ἄρα οὖν
  choice: Vậy nên
  rationale: Cặp tiểu từ suy luận nhấn mạnh kết luận của Phao-lô từ lập luận trước đó; “Vậy nên” tự nhiên trong tiếng Việt hiện đại và giữ rõ quan hệ logic.
- source_word: οὐ τοῦ θέλοντος οὐδὲ τοῦ τρέχοντος
  choice: không tùy thuộc vào người muốn, cũng không tùy thuộc vào người chạy
  rationale: Cấu trúc sở hữu cách có mạo từ và phân từ được hiểu theo lối tỉnh lược. “Tùy thuộc vào” bổ sung quan hệ ngầm một cách sáng rõ, trong khi “người muốn” và “người chạy” giữ dạng động từ và hình ảnh cụ thể của nguyên văn.
- source_word: τοῦ θέλοντος
  choice: người muốn
  rationale: θέλω diễn tả ý muốn hay ý chí. “Người muốn” tự nhiên hơn “người có ý chí” và không làm sắc thái thần học trở nên chuyên biệt hơn nguyên văn.
- source_word: τοῦ τρέχοντος
  choice: người chạy
  rationale: τρέχω có nghĩa trực tiếp là “chạy”. Bản dịch giữ nguyên hình ảnh, còn nghĩa bóng về nỗ lực hay phấn đấu được giải thích trong chú thích.
- source_word: ἀλλὰ
  choice: nhưng
  rationale: Giữ sự tương phản mạnh giữa ý muốn hoặc nỗ lực của con người với hành động thương xót của Đức Chúa Trời.
- source_word: τοῦ ἐλεῶντος θεοῦ
  choice: Đức Chúa Trời, Đấng thương xót
  rationale: Cách diễn đạt này giữ lực chủ động của phân từ ἐλεῶντος và xác định Đức Chúa Trời bằng hành động thương xót của Ngài.
- source_word: implied predicate/expression
  choice: điều ấy không tùy thuộc vào
  rationale: Tiếng Hy Lạp tỉnh lược chủ thể và vị ngữ chi phối. “Điều ấy” hướng về nội dung trong văn mạch mà không tự ý xác định đó riêng là sự cứu rỗi, sự lựa chọn hay mục đích của Đức Chúa Trời.
theological_decisions:
- issue: Chủ thể tỉnh lược và phạm vi của sự tùy thuộc
  choice: Dùng “điều ấy không tùy thuộc vào” mà không nêu đích danh sự cứu rỗi, sự tuyển chọn hay sự lựa chọn trong chính văn.
  alternative: “Vì thế, sự cứu rỗi không tùy thuộc vào ý muốn hay nỗ lực của con người” hoặc “Vì thế, sự lựa chọn của Đức Chúa Trời không tùy thuộc vào người muốn hay người chạy.”
  rationale: Nguyên văn Hy Lạp có tính tỉnh lược, còn văn mạch gần nói đến mục đích và lòng thương xót của Đức Chúa Trời. Cách dịch tổng quát bảo tồn độ mở và căng thẳng thần học của câu thay vì khóa nó vào một cách giải thích hệ phái.
translation_notes:
  register: Văn phong trang trọng, tự nhiên và dễ hiểu trong tiếng Việt hiện đại. Giữ hình ảnh “chạy” của nguyên văn và dùng “điều ấy” để phản ánh cấu trúc tỉnh lược mà không giải quyết thay cho độc giả phạm vi thần học của câu.
