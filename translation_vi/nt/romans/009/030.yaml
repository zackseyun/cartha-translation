  to: Vậy, chúng ta sẽ nói gì? Các dân ngoại[b], vốn không theo đuổi sự công chính[a], đã đạt được sự công chính—tức là sự công chính đến từ đức tin[c].
  rationale: Chỉ thay “dù không theo đuổi …, lại đạt được” bằng “vốn không theo đuổi …, đã đạt được” để bám sát quan hệ cú pháp của phân từ Hy Lạp và thì quá khứ của κατέλαβεν. Giữ dấu gạch ngang và “tức là” vì cụm lặp với mạo từ xác định loại sự công chính được nói đến; không cần buộc δέ thành một liên từ đối lập mạnh.
