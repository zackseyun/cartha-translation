id: ROM.9.30
reference: Romans 9:30
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Τί οὖν ἐροῦμεν; ὅτι ἔθνη τὰ μὴ διώκοντα δικαιοσύνην κατέλαβεν δικαιοσύνην, δικαιοσύνην δὲ τὴν ἐκ πίστεως·
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/030.yaml
  text: What then shall we say? That the Gentiles, who were not pursuing righteousness, attained righteousness—but the righteousness that is from faith.
translation:
  language: vi
  text: Vậy, chúng ta sẽ nói gì? Các dân ngoại[b], vốn không theo đuổi sự công chính[a], đã đạt được sự công chính—tức là sự công chính đến từ đức tin[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “sự công bằng”; từ Hy Lạp δικαιοσύνη có thể bao gồm sự ngay chính về đạo đức hoặc pháp lý và sự công bằng trong giao ước.
    reason: lexical_alternative
  - marker: b
    text: Hay “các dân”.
    reason: lexical_alternative
  - marker: c
    text: 'Hay “sự công chính bởi đức tin”; ít có khả năng hơn trong câu này: “sự công chính đến từ sự thành tín”.'
    reason: alternative_reading
lexical_decisions:
- source_word: Τί οὖν ἐροῦμεν
  choice: Vậy, chúng ta sẽ nói gì?
  rationale: Giữ sắc thái tương lai mang tính nghị luận của công thức chuyển ý quen thuộc nơi Phao-lô, đồng thời tự nhiên trong tiếng Việt.
- source_word: ἔθνη
  choice: các dân ngoại
  rationale: Trong mạch văn đối chiếu với Israel, từ này chỉ những dân không thuộc dân Do Thái; cách dịch này rõ nghĩa hơn nghĩa đen “các dân”.
- source_word: τὰ μὴ διώκοντα
  choice: dù không theo đuổi
  rationale: Diễn đạt hành động hoặc khuynh hướng đang tiếp diễn của phân từ hiện tại, đồng thời làm nổi bật nghịch lý của câu.
- source_word: δικαιοσύνην
  choice: sự công chính
  rationale: Thuật ngữ quen thuộc và đủ rộng trong văn mạch Phao-lô, không thu hẹp thành riêng địa vị pháp lý, phẩm hạnh đạo đức hay sự công bằng.
- source_word: κατέλαβεν
  choice: đạt được
  rationale: Trong văn mạch, động từ chỉ việc đạt tới hay nhận được điều trước đó không theo đuổi; “đạt được” tự nhiên và giữ được sự tương phản.
- source_word: δικαιοσύνην δὲ τὴν ἐκ πίστεως
  choice: sự công chính—tức là sự công chính đến từ đức tin
  rationale: Hiểu δέ cùng cụm có mạo từ theo chức năng giải thích, xác định loại công chính vừa nói đến; “tức là” thể hiện quan hệ đồng vị rõ hơn một từ nối tương phản.
- source_word: πίστεως
  choice: đức tin
  rationale: Phù hợp nhất trong cấu trúc ἐκ πίστεως tại đây, nhưng không mở rộng thành công thức thần học không có trong nguyên văn.
theological_decisions:
- issue: Ý nghĩa của δικαιοσύνη trong lập luận của Phao-lô
  choice: Dịch là “sự công chính” mà không định nghĩa hẹp hơn trong chính câu.
  alternative: “sự công bằng”, “địa vị đúng đắn trước mặt Đức Chúa Trời” hoặc “địa vị trong giao ước”
  rationale: Nguyên văn giữ khái niệm có bề rộng thần học; bản dịch không nên tự quyết định cơ chế hay phương diện duy nhất của sự công chính.
- issue: Quan hệ của δικαιοσύνην δὲ τὴν ἐκ πίστεως
  choice: Dùng “tức là” để trình bày cụm sau như sự xác định loại công chính đã đạt được.
  alternative: Dùng “nhưng” để giữ sắc thái đối lập có thể có của δέ.
  rationale: Cấu trúc lặp danh từ rồi thêm mạo từ và cụm giới từ chủ yếu giải thích, xác định sự công chính đang được nói đến; dấu gạch ngang vẫn giữ lực chuyển ý.
- issue: Ý nghĩa của ἐκ πίστεως
  choice: “đến từ đức tin”
  alternative: “bởi đức tin” hoặc, ít có khả năng hơn ở đây, “đến từ sự thành tín”
  rationale: Giữ ý nguồn gốc của ἐκ và tránh thêm các công thức tín lý vượt quá lời văn.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại, dễ hiểu. Dùng “các dân ngoại” theo cách gọi Kinh Thánh quen thuộc; “dù… lại…” làm rõ nghịch lý cú pháp mà không thêm nội dung thần học. Mọi ký hiệu chú thích đều được đặt ngay sau từ hoặc cụm từ liên quan.
