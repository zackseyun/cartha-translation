id: ROM.9.4
reference: Romans 9:4
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οἵτινές εἰσιν Ἰσραηλῖται, ὧν ἡ υἱοθεσία καὶ ἡ δόξα καὶ αἱ διαθῆκαι καὶ ἡ νομοθεσία καὶ ἡ λατρεία καὶ αἱ ἐπαγγελίαι,
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/004.yaml
  text: who are Israelites[a], to whom belong the adoption, the glory, the covenants, the giving of the law, the worship, and the promises[d][c][b],
translation:
  language: vi
  text: Họ là người Israel, là những người có địa vị làm con[a], vinh quang[b], các giao ước, việc ban luật pháp, sự thờ phượng[c] và các lời hứa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “sự nhận làm con nuôi” hoặc “địa vị con cái.” Ở đây từ này nói về địa vị của Israel trong mối quan hệ giao ước với Đức Chúa Trời.'
    reason: lexical_alternative
  - marker: b
    text: “Vinh quang” có lẽ chỉ sự hiện diện vinh hiển mà Đức Chúa Trời đã bày tỏ giữa Israel.
    reason: cross_reference
  - marker: c
    text: Tức là sự thờ phượng và phụng sự Đức Chúa Trời theo giao ước đã được quy định cho Israel.
    reason: cultural_note
lexical_decisions:
- source_word: οἵτινές εἰσιν Ἰσραηλῖται
  choice: Họ là người Israel
  rationale: Diễn đạt tự nhiên mệnh đề quan hệ giải thích về những người đồng bào của Phao-lô ở câu trước, đồng thời giữ nguyên căn tính dân tộc và giao ước được nêu trong nguyên văn.
- source_word: ὧν
  choice: là những người có
  rationale: Đại từ quan hệ sở hữu được chuyển sang một cấu trúc tiếng Việt tự nhiên, cho biết các đặc ân được liệt kê thuộc về dân Israel.
- source_word: υἱοθεσία
  choice: địa vị làm con
  rationale: Giữ hình ảnh về địa vị làm con trong mối quan hệ giao ước, nhưng không mặc nhiên đồng nhất điều này với mọi sắc thái cứu rỗi cá nhân của từ ngữ ở các văn cảnh khác.
- source_word: δόξα
  choice: vinh quang
  rationale: Dịch sát danh từ Hy Lạp và giữ nguyên chiều sâu thần học; văn cảnh có thể chỉ sự hiện diện vinh hiển được Đức Chúa Trời bày tỏ giữa Israel.
- source_word: διαθῆκαι
  choice: các giao ước
  rationale: Giữ nguyên dạng số nhiều của nguyên văn và dùng thuật ngữ Kinh Thánh quen thuộc, chính xác.
- source_word: νομοθεσία
  choice: việc ban luật pháp
  rationale: Danh từ này nói đến hành động ban hoặc thiết lập luật pháp, chứ không chỉ bản thân luật pháp.
- source_word: λατρεία
  choice: sự thờ phượng
  rationale: Diễn đạt việc phụng sự Đức Chúa Trời theo nghi lễ được quy định cho Israel mà không thu hẹp từ này chỉ vào đền thờ hay chức vụ tế lễ.
- source_word: ἐπαγγελίαι
  choice: các lời hứa
  rationale: Giữ nguyên dạng số nhiều và chỉ các lời hứa Đức Chúa Trời đã ban cho Israel.
theological_decisions:
- issue: Ý nghĩa của υἱοθεσία đối với Israel
  choice: địa vị làm con
  alternative: sự nhận làm con nuôi; quyền làm con
  rationale: Danh sách này nói về các đặc ân lịch sử và giao ước của Israel với tư cách một dân. Cách dịch được chọn giữ ẩn dụ quan hệ cha-con mà không áp đặt một hệ thống thần học về sự cứu rỗi cá nhân lên câu này.
- issue: Đối tượng quy chiếu của ἡ δόξα
  choice: vinh quang
  alternative: vinh quang của Đức Chúa Trời; sự hiện diện vinh hiển
  rationale: Nguyên văn chỉ nói “vinh quang”. Có khả năng từ này chỉ sự hiện diện hữu hình của Đức Chúa Trời giữa Israel, nhưng bản dịch chính không giải nghĩa thay cho nguyên văn.
- issue: Phạm vi nghĩa của λατρεία
  choice: sự thờ phượng
  alternative: việc phụng sự; nghi lễ thờ phượng
  rationale: Cách dịch này bao quát sự thờ phượng theo giao ước của Israel nhưng không giới hạn nó quá mức vào riêng nghi thức đền thờ hoặc công việc tư tế.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Cấu trúc “là những người có” tránh lối dịch cứng “thuộc về họ là” nhưng vẫn giữ rõ quan hệ sở hữu của ὧν. Dùng “Israel” theo cách viết tên quốc gia và dân tộc phổ biến trong tiếng Việt hiện nay.
