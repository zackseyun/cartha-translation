id: ROM.9.7
reference: Romans 9:7
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οὐδ’ ὅτι εἰσὶν σπέρμα Ἀβραάμ, πάντες τέκνα, ἀλλ’· Ἐν Ἰσαὰκ κληθήσεταί σοι σπέρμα.
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/007.yaml
  text: Nor is it the case that because they are Abraham’s offspring[a], they are all children. Rather[c][b], “In Isaac your offspring will be called.”
translation:
  language: vi
  text: 'Cũng không phải vì là dòng dõi của Áp-ra-ham[a] mà tất cả họ đều là con cái. Trái lại: “Qua Y-sác, dòng dõi của con sẽ được gọi.”[b][c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn dùng một danh từ số ít có nghĩa đen là “hạt giống”, nhưng ở đây mang nghĩa tập hợp: con cháu hay dòng dõi.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch sát hình thức hơn: “Trong Y-sác, dòng dõi của con sẽ được gọi.” Đây là lời trích từ Sáng Thế Ký 21:12.'
    reason: cross_reference
  - marker: c
    text: “Được gọi” cũng có thể được hiểu là “được mang tên”, “được chỉ định” hoặc, theo văn mạch, “được kể là”.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδ’ ὅτι
  choice: Cũng không phải vì ... mà
  rationale: Cách diễn đạt tự nhiên trong tiếng Việt, giữ được ý phủ định bổ sung của οὐδέ và quan hệ lý do của ὅτι.
- source_word: σπέρμα Ἀβραάμ
  choice: dòng dõi của Áp-ra-ham
  rationale: “Dòng dõi” diễn đạt nghĩa tập hợp của danh từ số ít σπέρμα và phù hợp văn phong Kinh Thánh hiện đại hơn cách dịch sát là “hạt giống”.
- source_word: πάντες τέκνα
  choice: tất cả họ đều là con cái
  rationale: Giữ nghĩa bao gồm cả nam lẫn nữ của τέκνα và bổ sung đại từ, động từ theo yêu cầu tự nhiên của tiếng Việt.
- source_word: ἀλλ’
  choice: Trái lại
  rationale: Thể hiện rõ bước chuyển tương phản và đính chính trong lập luận của Phao-lô.
- source_word: Ἐν Ἰσαὰκ
  choice: Qua Y-sác
  rationale: Diễn đạt tự nhiên ý nghĩa dòng dõi phát xuất qua Y-sác, đồng thời tránh lối dịch từng chữ thiếu tự nhiên “trong Y-sác”.
- source_word: κληθήσεταί
  choice: sẽ được gọi
  rationale: Giữ sát thể bị động và trường nghĩa gọi/đặt tên của καλέω, không thay ngay bằng cách giải nghĩa thần học như “được kể là”.
- source_word: σοι σπέρμα
  choice: dòng dõi của con
  rationale: Chuyển đại từ dữ cách σοι thành quan hệ sở hữu tự nhiên trong tiếng Việt, theo ý của lời phán với Áp-ra-ham.
theological_decisions:
- issue: Quan hệ giữa huyết thống tự nhiên và địa vị con cái
  choice: Câu dịch phân biệt việc thuộc dòng dõi Áp-ra-ham với việc tất cả đều là con cái, nhưng không thêm lời xác định cơ chế tuyển chọn.
  alternative: Diễn giải rõ thành “con cái của lời hứa” hoặc đưa một hệ thống tiền định vào ngay câu này.
  rationale: Nguyên văn chỉ nêu sự tương phản và viện dẫn lời hứa liên quan đến Y-sác; phần giải thích đầy đủ hơn thuộc về văn mạch tiếp theo.
- issue: Ý nghĩa của κληθήσεταί trong lời trích Sáng Thế Ký 21:12
  choice: Giữ cách nói “sẽ được gọi”.
  alternative: “sẽ được kể là”, “sẽ được xác định” hoặc “sẽ phát xuất”.
  rationale: “Được gọi” bảo tồn sự căng nghĩa giữa gọi tên, chỉ định và kể nhận, thay vì quyết định thay người đọc một sắc thái duy nhất.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “Áp-ra-ham” và “Y-sác” theo dạng tên quen thuộc trong truyền thống Kinh Thánh tiếng Việt. Cấu trúc “không phải vì… mà…” làm rõ logic Hy Lạp mà không diễn giải quá mức.
