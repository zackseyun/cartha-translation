    rationale: Cách diễn đạt này có thể chấp nhận về văn phong, nhưng thêm sắc thái chủ động mang vác/gánh chịu. “Tôi có” phản ánh trực tiếp hơn cấu trúc ‘có đối với tôi’ của tiếng Hy Lạp.
  - severity: low
    issue: Đại từ “mình”
    rationale: “Trong lòng tôi” tự nhiên và xác định chủ thể rõ hơn trong một câu trích độc lập.
