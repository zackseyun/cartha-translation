  yaml_path: translation/nt/romans/009/002.yaml
  text: that I have great sorrow and unceasing pain in my heart[a][b][c].
translation:
  language: vi
  text: rằng tôi có nỗi buồn lớn lao và nỗi đau không dứt trong lòng tôi.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Nỗi buồn” cũng có thể dịch là “nỗi sầu muộn”.
    reason: lexical_alternative
  - marker: b
    text: “Nỗi đau” cũng có thể dịch là “nỗi thống khổ”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: rằng
  rationale: Mở đầu nội dung lời khẳng định long trọng ở câu trước; “rằng” giữ đúng quan hệ cú pháp hơn cách hiểu nguyên nhân “vì”.
- source_word: λύπη μοί ἐστιν μεγάλη
  choice: tôi mang nỗi buồn lớn
  rationale: Cấu trúc sở hữu/trải nghiệm với μοί ἐστιν được diễn đạt tự nhiên là “tôi mang”; “nỗi buồn lớn” giữ cường độ của μεγάλη và sắc thái đau buồn của λύπη.
- source_word: καὶ
  choice: và
  rationale: Giữ quan hệ phối hợp đơn giản giữa hai cách diễn tả nỗi đau.
- source_word: ἀδιάλειπτος ὀδύνη
  choice: nỗi đau không dứt
  rationale: “Không dứt” diễn tả tính liên tục của ἀδιάλειπτος, còn “nỗi đau” truyền đạt sự đau đớn nội tâm của ὀδύνη mà không tăng mức diễn giải.
- source_word: τῇ καρδίᾳ μου
  choice: trong lòng mình
  rationale: Cách nói tự nhiên trong tiếng Việt cho nghĩa địa điểm nội tâm của thành ngữ Hy Lạp, theo sát nghĩa đen “đối với/trong tim tôi” nhưng tránh lối diễn đạt gượng.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “mang” để diễn tả một gánh nặng nội tâm kéo dài; giữ hai danh từ song song và tránh nhập chúng thành một cảm xúc duy nhất. “Trong lòng mình” là thành ngữ tiếng Việt tự nhiên, đồng thời bảo tồn hình ảnh ‘lòng/tim’ trong nguyên văn.
