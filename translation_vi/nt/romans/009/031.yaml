id: ROM.9.31
reference: Romans 9:31
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἰσραὴλ δὲ διώκων νόμον δικαιοσύνης εἰς ⸀νόμον οὐκ ἔφθασεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/031.yaml
  text: But Israel[a], pursuing a law of righteousness[b], did not attain to that law.
translation:
  language: vi
  text: Nhưng Israel, theo đuổi một luật về sự công chính[a], đã không đạt tới luật ấy.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc “công lý”: “một luật về công lý.”'
    reason: lexical_alternative
  - marker: b
    text: Hoặc “đã không đến được đó” hay “đã không đạt tới luật.” Cụm từ Hy Lạp cô đọng và khó hiểu.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰσραήλ
  choice: Israel
  rationale: Dùng dạng tên riêng quen thuộc trong tiếng Việt; trong lập luận ở đây, tên này chỉ dân Israel.
- source_word: δέ
  choice: Nhưng
  rationale: Diễn tả sự tương phản với câu trước về các dân ngoại.
- source_word: διώκων
  choice: theo đuổi
  rationale: Giữ hình ảnh chủ động và bền bỉ hướng đến một mục tiêu, đồng thời không thêm sắc thái nhượng bộ vốn không được nêu rõ bằng từ ngữ riêng trong nguyên văn.
- source_word: νόμον δικαιοσύνης
  choice: một luật về sự công chính
  rationale: Danh từ νόμον không có mạo từ; cách dịch này giữ quan hệ bổ nghĩa khá mở của δικαιοσύνης, không diễn giải quá mức thành luật đem lại sự công chính hay luật công chính.
- source_word: δικαιοσύνης
  choice: sự công chính
  rationale: Đây là cách diễn đạt tự nhiên, quen thuộc cho δικαιοσύνη trong mạch lập luận của Phao-lô; khả năng dịch là “công lý” được giữ trong chú thích.
- source_word: εἰς νόμον
  choice: tới luật ấy
  rationale: Hiểu νόμον được lặp lại theo nghĩa hồi chỉ về luật vừa nói đến, nhưng vẫn ghi nhận trong chú thích rằng cấu trúc Hy Lạp cô đọng và khó xác định.
- source_word: οὐκ ἔφθασεν
  choice: đã không đạt tới
  rationale: Diễn tả việc không đến được hay không đạt được mục tiêu; “đạt tới” phối hợp tự nhiên với εἰς trong tiếng Việt.
theological_decisions:
- issue: Cách dịch δικαιοσύνη trong văn cảnh của Phao-lô
  choice: sự công chính
  alternative: công lý
  rationale: “Sự công chính” phù hợp hơn với mạch lập luận về địa vị đúng đắn trước mặt Đức Chúa Trời, nhưng “công lý” vẫn là một khả năng từ vựng nên được nêu trong chú thích.
- issue: Quan hệ giữa luật và sự công chính trong νόμον δικαιοσύνης
  choice: một luật về sự công chính
  alternative: một luật dẫn đến sự công chính
  rationale: Giữ nguyên độ mở của sở hữu cách Hy Lạp, tránh quyết định rằng luật tạo ra, dẫn đến hay được đặc trưng bởi sự công chính.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Theo đuổi” giữ sức mạnh của động từ Hy Lạp; “luật ấy” giúp câu tiếng Việt rõ hơn mà không khai triển thành một cách giải nghĩa thần học cụ thể.
