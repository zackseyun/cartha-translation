id: ROM.9.15
reference: Romans 9:15
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: τῷ ⸂Μωϋσεῖ γὰρ⸃ λέγει· Ἐλεήσω ὃν ἂν ἐλεῶ, καὶ οἰκτιρήσω ὃν ἂν οἰκτίρω.
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/015.yaml
  text: For he says to Moses[a], “I will have mercy on whomever I have mercy[b], and I will have compassion on whomever I have compassion.”
translation:
  language: vi
  text: 'Vì Ngài phán với Môi-se: “Ta sẽ thương xót người nào Ta thương xót, và Ta sẽ động lòng thương người nào Ta động lòng thương.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Trích Xuất Ai Cập 33:19.
    reason: cross_reference
lexical_decisions:
- source_word: τῷ Μωϋσεῖ
  choice: với Môi-se
  rationale: Dạng tặng cách chỉ người tiếp nhận lời nói sau λέγει; tiếng Việt tự nhiên dùng “phán với Môi-se”. Tên riêng theo cách viết Kinh Thánh quen thuộc trong tiếng Việt.
- source_word: γὰρ
  choice: Vì
  rationale: Giữ liên kết giải thích/lập luận với câu trước một cách tự nhiên và súc tích.
- source_word: λέγει
  choice: Ngài phán
  rationale: Giữ thì hiện tại trong công thức trích dẫn và nhận diện chủ thể ngầm là Đức Chúa Trời theo ngữ cảnh Xuất Ai Cập 33:19. “Phán” phù hợp với lời trực tiếp của Đức Chúa Trời, còn “Ngài” duy trì tính ngôi vị mà không thêm tên gọi vào nguyên văn.
- source_word: Ἐλεήσω … ἐλεῶ
  choice: Ta sẽ thương xót … Ta thương xót
  rationale: Giữ cùng một cách dịch cho hai dạng của ἐλεέω, đồng thời bảo tồn cấu trúc lặp nhấn mạnh và sự tự do trong lòng thương xót của Đức Chúa Trời.
- source_word: ὃν ἂν
  choice: người nào
  rationale: Diễn đạt đối tượng bất định một cách tự nhiên trong tiếng Việt; trong cấu trúc “người nào Ta…”, quan hệ ngữ pháp vẫn rõ mà không cần lối văn cổ.
- source_word: οἰκτιρήσω … οἰκτίρω
  choice: Ta sẽ động lòng thương … Ta động lòng thương
  rationale: Phân biệt οἰκτίρω với ἐλεέω, giữ sắc thái trắc ẩn sâu xa và bảo tồn phép song hành lặp lại của nguyên văn.
theological_decisions:
- issue: Chủ thể trong công thức trích dẫn
  choice: Dịch theo ngôi vị là “Ngài phán”, chỉ Đức Chúa Trời đang nói với Môi-se.
  alternative: Dịch vô nhân xưng là “Kinh Thánh nói với Môi-se” hoặc chỉ “có lời phán với Môi-se”.
  rationale: Động từ Hy Lạp không nêu chủ thể, nhưng lời trích dẫn là lời trực tiếp của Đức Chúa Trời trong Xuất Ai Cập 33:19. Cách dịch theo ngôi vị phù hợp ngữ cảnh mà không áp đặt thêm giáo lý.
- issue: Sự tự do của Đức Chúa Trời trong việc thương xót
  choice: 'Giữ nguyên công thức lặp: “Ta sẽ thương xót người nào Ta thương xót, và Ta sẽ động lòng thương người nào Ta động lòng thương.”'
  alternative: Diễn giải thành “Ta sẽ thương xót bất cứ ai Ta chọn”.
  rationale: Nguyên văn không có động từ “chọn”. Giữ cấu trúc lặp bảo tồn sự căng thẳng thần học của câu và không giải quyết trước các tranh luận về sự tuyển chọn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “Ngài” và “Ta” được viết hoa theo quy ước tiếng Việt khi chỉ Đức Chúa Trời. Cặp “thương xót / động lòng thương” vừa giữ sự phân biệt giữa ἐλεέω và οἰκτίρω vừa tránh lối diễn đạt quá cổ. Dấu chú thích [a] đặt ngay sau câu trích dẫn.
