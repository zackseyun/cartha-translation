- from: Nghĩa là, không phải con cái theo xác thịt[a] là con cái của Đức Chúa Trời, nhưng con cái của lời hứa mới được kể là dòng dõi[b].
  to: Nghĩa là, không phải con cái theo xác thịt[a] là con cái của Đức Chúa Trời, nhưng con cái của lời hứa được kể là dòng dõi[b].
  rationale: Chỉ bỏ “mới” để không thêm sắc thái nhấn mạnh vào mệnh đề δεύτερο của cấu trúc οὐ...ἀλλά. Giữ nguyên các lựa chọn thuật ngữ và các điểm neo chú thích; chuẩn hóa σπέρμα bằng chữ Hy Lạp trong chú thích.
