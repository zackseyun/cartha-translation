id: ROM.9.8
reference: Romans 9:8
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: τοῦτ’ ἔστιν, οὐ τὰ τέκνα τῆς σαρκὸς ταῦτα τέκνα τοῦ θεοῦ, ἀλλὰ τὰ τέκνα τῆς ἐπαγγελίας λογίζεται εἰς σπέρμα·
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/008.yaml
  text: That is[a], it is not the children of the flesh who are the children of God[b], but the children of the promise are counted as offspring.
translation:
  language: vi
  text: Nghĩa là, không phải con cái theo xác thịt[a] là con cái của Đức Chúa Trời, nhưng con cái của lời hứa được kể là dòng dõi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay “con cái theo dòng dõi tự nhiên.” Nguyên văn Hy Lạp: “con cái của xác thịt.”'
    reason: lexical_alternative
  - marker: b
    text: Hay “được kể là hạt giống.” Trong ngữ cảnh này, từ Hy Lạp σπέρμα có nghĩa là hậu duệ hay dòng dõi.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτ’ ἔστιν
  choice: Nghĩa là
  rationale: Giới thiệu lời giải thích của Phao-lô về câu trước; cách diễn đạt tự nhiên và giữ đúng chức năng giải nghĩa.
- source_word: τὰ τέκνα τῆς σαρκὸς
  choice: con cái theo xác thịt
  rationale: Giữ hình ảnh 'xác thịt' của Phao-lô, đồng thời dùng 'theo' để làm rõ ý chỉ dòng dõi tự nhiên trong ngữ cảnh gia phả.
- source_word: τέκνα τοῦ θεοῦ
  choice: con cái của Đức Chúa Trời
  rationale: Phản ánh trực tiếp cấu trúc sở hữu và giữ sự đối lập với 'con cái của lời hứa'.
- source_word: τὰ τέκνα τῆς ἐπαγγελίας
  choice: con cái của lời hứa
  rationale: Giữ nguyên quan hệ giữa con cái và lời hứa, không giải thích vượt quá điều bản văn nói.
- source_word: λογίζεται
  choice: được kể
  rationale: Diễn đạt thể bị động theo nghĩa được tính hay được nhìn nhận là, phù hợp với ngữ cảnh.
- source_word: εἰς σπέρμα
  choice: là dòng dõi
  rationale: Trong ngữ cảnh Áp-ra-ham, σπέρμα chỉ hậu duệ hay dòng dõi; 'dòng dõi' tự nhiên trong tiếng Việt và vẫn giữ sắc thái gia phả.
theological_decisions:
- issue: Sự đối lập giữa hậu duệ theo xác thịt và con cái được xác định bởi lời hứa
  choice: 'Giữ nguyên sự đối lập của câu: con cái theo xác thịt không đồng nhất với con cái của Đức Chúa Trời, còn con cái của lời hứa được kể là dòng dõi.'
  alternative: Diễn giải rõ theo một hệ thống thần học về sự tuyển chọn cá nhân hoặc chỉ theo cách hiểu tập thể-lịch sử.
  rationale: Bản Hy Lạp nêu sự đối lập nhưng không tự nó giải quyết toàn bộ tranh luận thần học trong Rô-ma 9; bản dịch không áp đặt một lập trường hệ phái.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng 'Đức Chúa Trời' nhất quán; giữ thuật ngữ Phao-lô 'xác thịt' trong chính văn và giải thích nghĩa gia phả ở chú thích. Tiểu từ 'mới' làm nổi bật cấu trúc đối lập οὐ…ἀλλά mà không thêm điều kiện thần học.
