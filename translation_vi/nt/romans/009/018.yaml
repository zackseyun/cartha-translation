id: ROM.9.18
reference: Romans 9:18
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἄρα οὖν ὃν θέλει ἐλεεῖ, ὃν δὲ θέλει σκληρύνει.
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/018.yaml
  text: So then[a], he shows mercy to whom he wills[b], and he hardens whom he wills.
translation:
  language: vi
  text: Vậy nên, Ngài thương xót[a] người nào Ngài muốn, còn người nào Ngài muốn thì Ngài làm cho cứng lòng[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “bày tỏ lòng thương xót với.”'
    reason: lexical_alternative
  - marker: b
    text: “Làm cho cứng lòng” cũng có thể dịch là “làm cho ngoan cố.” Động từ Hy Lạp ở thể chủ động, không chỉ có nghĩa là cho phép một người trở nên cứng lòng.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄρα οὖν
  choice: Vậy nên
  rationale: Cặp tiểu từ suy luận nhấn mạnh kết luận rút ra từ lập luận trước đó; “Vậy nên” tự nhiên trong tiếng Việt hiện đại và giữ được lực suy luận.
- source_word: ὃν θέλει
  choice: người nào Ngài muốn
  rationale: Cách diễn đạt này tự nhiên, rõ nghĩa, đồng thời giữ nguyên ý về ý muốn trực tiếp của Đức Chúa Trời và sự song hành giữa hai mệnh đề.
- source_word: ἐλεεῖ
  choice: thương xót
  rationale: Động từ chỉ việc bày tỏ lòng thương xót hoặc trắc ẩn; “thương xót” ngắn gọn, trang trọng và quen thuộc trong tiếng Việt.
- source_word: ὃν δὲ θέλει
  choice: còn người nào Ngài muốn
  rationale: “Còn” thể hiện sự tương phản do δέ đánh dấu, trong khi việc lặp lại “người nào Ngài muốn” duy trì cấu trúc cân xứng có chủ ý của nguyên văn.
- source_word: σκληρύνει
  choice: làm cho cứng lòng
  rationale: Cách dịch chủ động phản ánh đúng hình thái động từ Hy Lạp, giữ liên hệ với trình thuật Pha-ra-ôn và không giảm nhẹ hành động thành sự cho phép đơn thuần.
theological_decisions:
- issue: Ý muốn của Đức Chúa Trời trong θέλει
  choice: Giữ lời khẳng định trực tiếp rằng Ngài muốn, ở cả hai mệnh đề.
  alternative: Diễn giải thành Ngài chỉ cho phép hoặc tránh nói đến ý muốn chủ động.
  rationale: Nguyên văn trực tiếp nói đến ý muốn của chủ thể; bản dịch không giải quyết thay cho độc giả sự căng thẳng giữa quyền tể trị của Đức Chúa Trời và trách nhiệm của con người.
- issue: Tác nhân trong σκληρύνει
  choice: Dịch chủ động là “Ngài làm cho cứng lòng”.
  alternative: “Ngài để cho trở nên cứng lòng” hoặc “Ngài cho mặc lấy sự cứng lòng”.
  rationale: Động từ Hy Lạp ở thể chủ động và trực tiếp quy hành động cho chủ thể; chuyển thành sự cho phép đơn thuần sẽ làm nhẹ đi phát biểu của nguyên văn.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Cấu trúc đối xứng và từ “còn” làm rõ sự tương phản giữa hai hành động; đại từ “Ngài” dựa vào chủ thể là Đức Chúa Trời trong ngữ cảnh.
