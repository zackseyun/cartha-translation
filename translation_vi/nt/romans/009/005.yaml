id: ROM.9.5
reference: Romans 9:5
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὧν οἱ πατέρες, καὶ ἐξ ὧν ὁ χριστὸς τὸ κατὰ σάρκα, ὁ ὢν ἐπὶ πάντων, θεὸς εὐλογητὸς εἰς τοὺς αἰῶνας· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/005.yaml
  text: theirs are the fathers[a], and from them, according to the flesh, is the Messiah, who is over all, God blessed forever[b]. Amen.
translation:
  language: vi
  text: Họ có các tổ phụ, và Đấng Mê-si-a cũng xuất thân từ họ theo xác thịt[a]—Đấng ở trên muôn vật, là Đức Chúa Trời, đáng được chúc tụng đời đời.[b] A-men.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “xét về dòng dõi nhân loại.” Nghĩa đen: “theo xác thịt.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể ngắt câu để hiểu phần cuối là một lời chúc tụng riêng: “Nguyện Đức Chúa Trời, Đấng ở trên muôn vật, được chúc tụng đời đời. A-men,” thay vì là lời mô tả Đấng Mê-si-a.'
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ πατέρες
  choice: các tổ phụ
  rationale: Chỉ những vị tiền nhân được tôn kính của Y-sơ-ra-ên; “các tổ phụ” tự nhiên trong văn phong Kinh Thánh tiếng Việt và giữ sắc thái lịch sử giao ước.
- source_word: ἐξ ὧν
  choice: từ họ
  rationale: Đại từ quan hệ chỉ lại người Y-sơ-ra-ên; cách diễn đạt này gọn, tự nhiên và giữ ý nguồn gốc dân tộc.
- source_word: ὁ χριστός
  choice: Đấng Mê-si-a
  rationale: Ở đây Χριστός là tước hiệu gắn với các đặc ân của Y-sơ-ra-ên, nên dịch là “Đấng Mê-si-a” thay vì dùng như tên riêng.
- source_word: τὸ κατὰ σάρκα
  choice: xét theo phần xác
  rationale: Giữ cách nói đặc trưng của Phao-lô, đồng thời trong ngữ cảnh diễn tả dòng dõi nhân loại chứ không nói về bản tính tội lỗi.
- source_word: ὁ ὢν ἐπὶ πάντων
  choice: Đấng ở trên muôn vật
  rationale: Phân từ có mạo từ tiếp tục mô tả Đấng Mê-si-a; “muôn vật” diễn đạt tự nhiên phạm vi toàn thể của πάντων.
- source_word: θεὸς εὐλογητὸς
  choice: là Đức Chúa Trời đáng chúc tụng
  rationale: Diễn đạt cấu trúc đồng vị/vị ngữ một cách rõ ràng trong tiếng Việt mà không làm mất nhận định thần học mạnh của câu.
- source_word: εἰς τοὺς αἰῶνας
  choice: đời đời
  rationale: Tương đương tiếng Việt tự nhiên của thành ngữ chỉ thời gian vô tận trong lời chúc tụng.
- source_word: ἀμήν
  choice: A-men
  rationale: Giữ từ xác nhận phụng vụ quen thuộc bằng hình thức phiên âm phổ biến trong tiếng Việt.
theological_decisions:
- issue: Mệnh đề ὁ ὢν ἐπὶ πάντων, θεὸς εὐλογητὸς εἰς τοὺς αἰῶνας mô tả Đấng Mê-si-a hay mở đầu một lời chúc tụng riêng hướng về Đức Chúa Trời
  choice: 'Hiểu mệnh đề là phần tiếp tục mô tả Đấng Mê-si-a: “Đấng ở trên muôn vật, là Đức Chúa Trời đáng chúc tụng đời đời.”'
  alternative: 'Tách thành lời chúc tụng riêng: “Nguyện Đức Chúa Trời, Đấng ở trên muôn vật, được chúc tụng đời đời. A-men.”'
  rationale: Dòng cú pháp tự nhiên nhất nối phân từ có mạo từ ὁ ὢν với ὁ χριστός như một thành phần đồng vị. Tuy nhiên, các thủ bản cổ không có hệ thống dấu câu hiện đại và cách hiểu này đã được tranh luận lâu dài, nên phương án lời chúc tụng riêng được ghi nhận trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ “xét theo phần xác” để bảo toàn thành ngữ và chiều sâu nhân học của Phao-lô; dùng dấu gạch ngang để làm rõ phần đồng vị dài. Dùng “Đấng Mê-si-a” theo chức năng tước hiệu và “A-men” theo lối phiên âm quen thuộc.
