  text: οὐ μόνον δέ, ἀλλὰ καὶ Ῥεβέκκα ἐξ ἑνὸς κοίτην ἔχουσα, Ἰσαὰκ τοῦ πατρὸς ἡμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/010.yaml
  text: And not only that[a], but Rebekah also had conceived by one man, our father Isaac.
translation:
  language: vi
  text: Không những thế, Rê-bê-ca cũng đã thụ thai bởi một người[a], là Y-sác, tổ phụ chúng ta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sát chữ: “có chăn gối từ một người, là Y-sác, tổ phụ chúng ta.” Đây là một lối nói uyển ngữ về việc thụ thai bởi một người nam.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ μόνον δέ, ἀλλὰ καί
  choice: Không những thế, ... cũng
  rationale: Diễn đạt tự nhiên cấu trúc tương liên trong tiếng Việt, đồng thời giữ mạch lập luận bổ sung của Phao-lô.
- source_word: Ῥεβέκκα
  choice: Rê-bê-ca
  rationale: Dùng dạng tên Kinh Thánh quen thuộc và dễ nhận biết trong tiếng Việt.
- source_word: ἐξ ἑνός
  choice: bởi một người
  rationale: Giữ ý một người duy nhất và làm rõ đối tượng nam được hàm ý trong ngữ cảnh, nhưng không thêm từ 'con cái' vốn không có trực tiếp trong câu Hy Lạp.
- source_word: κοίτην ἔχουσα
  choice: thụ thai
  rationale: Thành ngữ gắn với việc chung chăn gối và sự thụ thai; lựa chọn này truyền đạt kết quả được nhắm đến một cách trang trọng, tự nhiên.
- source_word: Ἰσαὰκ τοῦ πατρὸς ἡμῶν
  choice: là Y-sác, tổ phụ chúng ta
  rationale: Làm rõ Y-sác là người được nói đến trong cụm 'bởi một người'; 'tổ phụ' chuyển tải quan hệ tổ tiên tự nhiên hơn 'cha' trong tiếng Việt hiện đại.
theological_decisions:
- issue: Mức độ minh thị khi chuyển thành ngữ về quan hệ vợ chồng và thụ thai trong lập luận về sự tuyển chọn
  choice: Rê-bê-ca thụ thai bởi một người, là Y-sác
  alternative: Rê-bê-ca chung chăn gối với một người, Y-sác, tổ phụ chúng ta
  rationale: Cách chọn giữ trọng tâm rằng hai người con có cùng cha mẹ, nhưng không thô vụng và không thêm 'các con' vào chính văn. Chú thích bảo tồn nghĩa sát chữ và sắc thái thành ngữ.
- issue: Cách dịch πατήρ đối với Y-sác
  choice: tổ phụ chúng ta
  alternative: cha chúng ta
  rationale: Trong ngữ cảnh nói về nhân vật tổ tiên của dân giao ước, 'tổ phụ' là tiếng Việt tự nhiên và tránh khiến độc giả hiểu là cha ruột trực tiếp, dù nghĩa sát chữ là 'cha'.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu giữ cấu trúc bổ sung trong lập luận của Phao-lô; tên riêng theo dạng quen dùng trong Kinh Thánh tiếng Việt.
