id: ROM.9.29
reference: Romans 9:29
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ καθὼς προείρηκεν Ἠσαΐας· Εἰ μὴ κύριος Σαβαὼθ ἐγκατέλιπεν ἡμῖν σπέρμα, ὡς Σόδομα ἂν ἐγενήθημεν καὶ ὡς Γόμορρα ἂν ὡμοιώθημεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/029.yaml
  text: And just as Isaiah said before[a], “If the Lord of Hosts had not left us offspring[c][b], we would have become like Sodom and been made like Gomorrah.”
translation:
  language: vi
  text: 'Và đúng như Ê-sai đã nói trước: “Nếu Chúa của các đạo quân[a] không chừa lại cho chúng ta dòng dõi[b], thì chúng ta đã trở nên như Sô-đôm và bị làm cho giống như Gô-mô-rơ.”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể phiên âm là “Chúa Sa-ba-ốt.” Từ Hy Lạp Σαβαώθ phiên âm một tước hiệu Hy-bá-lai thường được dịch là “các đạo quân” hoặc “muôn quân.”
    reason: lexical_alternative
  - marker: b
    text: Nghĩa đen là “hạt giống”; ở đây chỉ dòng dõi hoặc con cháu còn sống sót.
    reason: lexical_alternative
  - marker: c
    text: Trích Ê-sai 1:9.
    reason: cross_reference
lexical_decisions:
- source_word: καὶ καθὼς
  choice: Và đúng như
  rationale: Giữ liên từ nối mạch lập luận và sắc thái tương ứng của καθὼς bằng cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: προείρηκεν
  choice: đã nói trước
  rationale: Diễn đạt lời đã được nói từ trước và vẫn có giá trị trong lập luận hiện tại, nhưng không biến động từ thành ý nghĩa tiên báo.
- source_word: κύριος Σαβαὼθ
  choice: Chúa các đạo quân
  rationale: Dịch tước hiệu Hy-bá-lai được tiếng Hy Lạp phiên âm, giữ ý nghĩa về Chúa cai quản các đạo quân thay vì chỉ phiên âm Sabaoth.
- source_word: ἐγκατέλιπεν
  choice: chừa lại
  rationale: Truyền đạt nghĩa để lại một phần còn sống sót; tự nhiên trong ngữ cảnh giả định trái thực tế.
- source_word: σπέρμα
  choice: dòng dõi
  rationale: Trong ngữ cảnh này từ nghĩa đen là 'hạt giống' chỉ hậu duệ còn lại; 'dòng dõi' vừa rõ vừa không thay bằng thuật ngữ thần học 'số sót'.
- source_word: ὡς Σόδομα ἂν ἐγενήθημεν
  choice: thì chúng ta đã trở nên như Sô-đôm
  rationale: Cấu trúc 'nếu... thì đã...' diễn đạt điều kiện trái thực tế, còn 'trở nên' giữ nghĩa của γίνομαι.
- source_word: ὡς Γόμορρα ἂν ὡμοιώθημεν
  choice: và bị làm cho giống như Gô-mô-rơ
  rationale: Giữ thể bị động và phân biệt động từ ὁμοιόω với γίνομαι ở vế trước.
theological_decisions:
- issue: Cách dịch tước hiệu κύριος Σαβαώθ trong lời trích Cựu Ước
  choice: Chúa các đạo quân
  alternative: Chúa Sa-ba-ốt; Đức Giê-hô-va vạn quân; Chúa muôn quân
  rationale: Bản Hy Lạp dùng κύριος cùng một tước hiệu Hy-bá-lai được phiên âm. Dịch nghĩa tước hiệu vừa bám nguồn Hy Lạp vừa tránh đưa danh xưng giao ước từ văn bản Hy-bá-lai vào chính văn khi Phao-lô viết κύριος.
- issue: Có nên dịch σπέρμα là 'số sót' hay không
  choice: dòng dõi
  alternative: hạt giống; con cháu; số sót
  rationale: Mạch văn có ý niệm một số người còn sót lại, nhưng từ cụ thể là σπέρμα, nghĩa là hạt giống hoặc dòng dõi. 'Dòng dõi' bảo toàn từ ngữ của câu mà không giải quyết ngầm sức căng thần học bằng thuật ngữ 'số sót'.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ cấu trúc điều kiện trái thực tế, sự song hành giữa 'trở nên' và 'bị làm cho giống', đồng thời dùng các địa danh theo dạng phiên âm Kinh Thánh quen thuộc trong tiếng Việt.
