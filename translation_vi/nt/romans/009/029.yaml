revisions:
- from: 'Và đúng như Ê-sai đã nói trước: “Nếu Chúa các đạo quân[a] không chừa lại cho chúng ta dòng dõi[b], thì chúng ta đã trở nên như Sô-đôm và bị làm cho giống như Gô-mô-rơ.”[c]'
  to: 'Và đúng như Ê-sai đã nói trước: “Nếu Chúa của các đạo quân[a] không chừa lại cho chúng ta dòng dõi[b], thì chúng ta đã trở nên như Sô-đôm và bị làm cho giống như Gô-mô-rơ.”[c]'
  rationale: Chỉ sửa «Chúa các đạo quân» thành «Chúa của các đạo quân» để bảo đảm ngữ pháp và cách dùng tự nhiên của tiếng Việt hiện đại. Các lựa chọn khác giữ nguyên vì phản ánh đúng văn bản Hy Lạp và không giải quyết quá mức các sắc thái của lời trích.
  reviewer_model: gpt-5.6-terra
