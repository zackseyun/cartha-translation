  to: 'Và ngay tại nơi đã có lời phán với họ[b]: “Các ngươi không phải là dân Ta,” thì tại đó họ sẽ được gọi là các con trai của Đức Chúa Trời hằng sống.[a]'
  rationale: Chỉ sửa cách diễn đạt ἐρρέθη αὐτοῖς để không thêm một tác nhân bất định (“người ta”) vào thể bị động của tiếng Hy Lạp. Những lựa chọn còn lại truyền đạt trung thành ý nghĩa, sắc thái và độ nhấn của bản nguồn.
  reviewer_model: gpt-5.6-terra
