id: ROM.9.26
reference: Romans 9:26
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἔσται ἐν τῷ τόπῳ οὗ ἐρρέθη ⸀αὐτοῖς· Οὐ λαός μου ὑμεῖς, ἐκεῖ κληθήσονται υἱοὶ θεοῦ ζῶντος.
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/026.yaml
  text: And in the very place where it was said to them[b][a], ‘You are not my people,’ there they will be called sons of the living God.
translation:
  language: vi
  text: 'Và ngay tại nơi đã có lời phán với họ[b]: “Các ngươi không phải là dân Ta,” thì tại đó họ sẽ được gọi là các con trai của Đức Chúa Trời hằng sống.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “các con của Đức Chúa Trời hằng sống.” Tiếng Hy Lạp viết “các con trai”; bản chính giữ cách nói này để bảo tồn âm hưởng về địa vị làm con và quyền thừa kế.
    reason: lexical_alternative
  - marker: b
    text: Trích dẫn hoặc gợi nhắc Ô-sê 1:10 (2:1 trong Bản Bảy Mươi), dùng ngôn ngữ về sự phục hồi giao ước.
    reason: cross_reference
lexical_decisions:
- source_word: καὶ
  choice: Và
  rationale: Giữ liên từ đơn giản, nối câu trích dẫn này với mạch văn trước mà không thêm sắc thái suy luận.
- source_word: ἔσται ἐν τῷ τόπῳ οὗ
  choice: ngay tại nơi
  rationale: Diễn đạt tự nhiên cấu trúc chỉ địa điểm và làm nổi bật sự tương ứng chính tại nơi lời phủ nhận từng được phán.
- source_word: ἐρρέθη αὐτοῖς
  choice: người ta đã nói với họ
  rationale: Bảo toàn ý bị động không nêu tác nhân bằng một cấu trúc vô nhân xưng tự nhiên trong tiếng Việt.
- source_word: Οὐ λαός μου ὑμεῖς
  choice: Các ngươi không phải là dân Ta
  rationale: Giữ nguyên công thức giao ước “dân Ta”; “các ngươi” phù hợp lời phán trực tiếp trang trọng với số nhiều.
- source_word: ἐκεῖ
  choice: thì tại đó
  rationale: Giữ sự đảo ngược nhấn mạnh xảy ra ngay tại cùng địa điểm.
- source_word: κληθήσονται
  choice: họ sẽ được gọi là
  rationale: Giữ thể bị động và không nói rõ tác nhân thần linh vốn chỉ được ngầm hiểu trong nguyên văn.
- source_word: υἱοὶ
  choice: các con trai
  rationale: Phản ánh danh từ giống đực số nhiều của Hy Lạp và giữ âm hưởng địa vị làm con cùng quyền thừa kế; nghĩa bao quát được ghi chú.
- source_word: θεοῦ ζῶντος
  choice: của Đức Chúa Trời hằng sống
  rationale: Cách diễn đạt Kinh Thánh tự nhiên, giữ sự tương phản thần học giữa Đức Chúa Trời sống và các thần tượng vô tri.
theological_decisions:
- issue: Cách dịch υἱοὶ với đối tượng mang nghĩa bao quát
  choice: các con trai
  alternative: các con
  rationale: Nguyên văn dùng υἱοὶ chứ không dùng τέκνα. Bản chính giữ dạng từ và âm hưởng địa vị làm con/quyền thừa kế, đồng thời chú thích rằng đối tượng không chỉ giới hạn ở nam giới.
- issue: Căn tính giao ước trong λαός μου
  choice: dân Ta
  alternative: dân riêng của Ta
  rationale: “Dân Ta” giữ công thức giao ước cô đọng trong nền Cựu Ước và tránh thêm từ “riêng” không có trong nguyên văn.
- issue: Tác nhân của κληθήσονται
  choice: 'không nêu tác nhân: “sẽ được gọi là”'
  alternative: Đức Chúa Trời sẽ gọi họ là
  rationale: Thể bị động có thể ngầm chỉ hành động của Đức Chúa Trời, nhưng nguyên văn không nêu tác nhân; bản dịch giữ nguyên độ hàm ẩn này.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Đại từ “các ngươi” và “Ta” được dùng trong lời trích dẫn để giữ sắc thái lời phán giao ước; câu văn duy trì sự nhấn mạnh địa điểm và thể bị động của nguyên văn.
