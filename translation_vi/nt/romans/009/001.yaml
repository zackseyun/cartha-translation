reference: Romans 9:1
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἀλήθειαν λέγω ἐν Χριστῷ, οὐ ψεύδομαι, συμμαρτυρούσης μοι τῆς συνειδήσεώς μου ἐν πνεύματι ἁγίῳ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/001.yaml
  text: I am telling the truth in Messiah[a]; I am not lying, as my conscience bears witness with me in the Holy Spirit[c][b],
translation:
  language: vi
  text: Tôi nói sự thật trong Đấng Mê-si; tôi không nói dối, và lương tâm tôi làm chứng cùng với tôi trong Đức Thánh Linh[c][b][a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “trong Đấng Christ”. Từ Hy Lạp Χριστός có thể được dùng như một tước hiệu (“Đấng Mê-si”) hoặc gần như một tên gọi (“Christ”); ở đây bản văn chính dịch theo nghĩa tước hiệu.
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể diễn đạt: “với lương tâm tôi đang cùng làm chứng” hoặc “lương tâm tôi làm chứng cùng với tôi”.'
    reason: lexical_alternative
  - marker: c
    text: Cũng có khả năng hiểu là “trong một tinh thần thánh khiết”, nhưng trong văn Phao-lô, cách hiểu tự nhiên nhất là chỉ Đức Thánh Linh.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀλήθειαν λέγω
  choice: Tôi nói sự thật
  rationale: Diễn đạt trực tiếp thành ngữ Hy Lạp, tự nhiên trong tiếng Việt hiện đại và giữ sắc thái quả quyết trang trọng.
- source_word: ἐν Χριστῷ
  choice: trong Đấng Mê-si
  rationale: Χριστός mang nghĩa tước hiệu “Đấng được xức dầu”; “Đấng Mê-si” giữ rõ chức năng tước hiệu, còn giới từ “trong” bảo toàn ἐν.
- source_word: οὐ ψεύδομαι
  choice: tôi không nói dối
  rationale: Cách nói trực tiếp, tự nhiên, giữ nguyên lời phủ nhận nhấn mạnh của Phao-lô.
- source_word: συμμαρτυρούσης
  choice: cùng làm chứng với tôi
  rationale: Giữ nghĩa đồng chứng của tiền tố συμ- và thể hiện phân từ chỉ hoàn cảnh đi kèm, dù cấu trúc này có chủ ý hơi khác cách nói thông thường.
- source_word: τῆς συνειδήσεώς μου
  choice: lương tâm tôi
  rationale: “Lương tâm” là từ tương đương thông dụng và chính xác với συνείδησις trong văn mạch Phao-lô.
- source_word: ἐν πνεύματι ἁγίῳ
  choice: trong Đức Thánh Linh
  rationale: Giữ giới từ ἐν bằng “trong” và hiểu cụm không có mạo từ này theo cách dùng tự nhiên nhất của Phao-lô là chỉ Đức Thánh Linh.
theological_decisions:
- issue: Ý nghĩa của Χριστῷ
  choice: Đấng Mê-si
  alternative: Đấng Christ
  rationale: Bản dịch chính làm nổi bật nghĩa tước hiệu của Χριστός mà không biến nó thành tên riêng; chú thích bảo lưu cách gọi quen thuộc khác.
- issue: Đối tượng được πνεύματι ἁγίῳ chỉ đến
  choice: Đức Thánh Linh
  alternative: một tâm linh thánh khiết hoặc tâm linh đã được thánh hóa của Phao-lô
  rationale: Trong cách dùng của Phao-lô, đây tự nhiên nhất là lời chỉ Đức Thánh Linh. Tuy vậy, vì tiếng Hy Lạp không có mạo từ, khả năng ngữ pháp khác được ghi nhận trong chú thích thay vì bị xóa bỏ.
- issue: Quan hệ của ἐν trong ἐν πνεύματι ἁγίῳ
  choice: trong Đức Thánh Linh
  alternative: bởi Đức Thánh Linh
  rationale: “Trong” giữ nguyên quan hệ rộng và phần nào mơ hồ của giới từ Hy Lạp, không thu hẹp nó thành phương tiện tác động.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu giữ nhịp quả quyết lặp lại của nguyên văn. Cụm “cùng làm chứng với tôi” được giữ để phản ánh thành tố συμ- thay vì làm trơn thành “làm chứng cho tôi”, vốn có thể thay đổi quan hệ nghĩa.
