    issue: Liên kết cú pháp của mệnh đề “lương tâm tôi ... làm chứng”
    rationale: συμμαρτυρούσης là phân từ trong một cấu trúc sở hữu cách tuyệt đối, diễn tả lời chứng đi kèm. Dấu chấm phẩy trước mệnh đề này tách nó quá mạnh; dùng liên từ “và” cho phép tiếng Việt diễn đạt quan hệ đi kèm cách tự nhiên mà không biến nó thành nguyên nhân (“vì”).
  - severity: low
