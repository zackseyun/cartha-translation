reference: Romans 9:21
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἢ οὐκ ἔχει ἐξουσίαν ὁ κεραμεὺς τοῦ πηλοῦ ἐκ τοῦ αὐτοῦ φυράματος ποιῆσαι ὃ μὲν εἰς τιμὴν σκεῦος ὃ δὲ εἰς ἀτιμίαν;
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/021.yaml
  text: Or does the potter not have authority over the clay[d][c][b][a], to make from the same lump one vessel for honor and another for dishonor?
translation:
  language: vi
  text: Hay người thợ gốm không có quyền đối với đất sét sao, để từ cùng một khối đất làm ra một chiếc bình dành cho sự tôn trọng và một chiếc khác dành cho sự khinh thường?[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “người thợ gốm không có thẩm quyền đối với đất sét sao?”'
    reason: lexical_alternative
  - marker: b
    text: “Khối đất” cũng có thể dịch là “mẻ đất” hoặc “khối vật liệu đã nhào trộn.”
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể dịch: “một chiếc bình dùng vào việc cao quý, còn chiếc kia dùng vào việc thông thường.”'
    reason: alternative_reading
  - marker: d
    text: Hình ảnh này gợi lại những phân đoạn trong Cựu Ước về người thợ gốm và đất sét, như Ê-sai 29:16; 45:9; Giê-rê-mi 18:1–6.
    reason: cross_reference
lexical_decisions:
- source_word: ἢ
  choice: Hay
  rationale: Mở đầu câu hỏi tu từ tiếp nối lập luận; “Hay” tự nhiên trong tiếng Việt và không thêm sắc thái nhấn mạnh.
- source_word: οὐκ ἔχει ἐξουσίαν
  choice: không có quyền ... sao
  rationale: Diễn đạt thẩm quyền hay quyền chính đáng, không chỉ là khả năng; cấu trúc hỏi tu từ giữ nguyên lực của câu Hy Lạp.
- source_word: ὁ κεραμεὺς
  choice: người thợ gốm
  rationale: Cách gọi chuẩn, rõ nghĩa đối với người làm và tạo hình đồ gốm.
- source_word: τοῦ πηλοῦ
  choice: trên đất sét
  rationale: Sau “có quyền”, cách diễn đạt này thể hiện quan hệ chi phối hàm chứa trong sở hữu cách Hy Lạp.
- source_word: ἐκ τοῦ αὐτοῦ φυράματος
  choice: từ cùng một khối đất
  rationale: φύραμα chỉ khối vật liệu đã được nhào trộn; trong hình ảnh nghề gốm, “khối đất” rõ và tự nhiên hơn “mẻ” hay “khối” đứng riêng.
- source_word: ποιῆσαι
  choice: làm ra
  rationale: Tương đương trực tiếp, tự nhiên với động từ chỉ việc làm hoặc tạo ra.
- source_word: ὃ μὲν ... ὃ δὲ
  choice: một ... và một ... khác
  rationale: Thể hiện rõ hai sản phẩm tương phản mà không dịch máy móc cặp μέν...δέ.
- source_word: εἰς τιμὴν
  choice: để được tôn trọng
  rationale: Giữ phạm trù danh dự của τιμή, đồng thời diễn đạt tự nhiên vai trò hay địa vị hướng đến của chiếc bình.
- source_word: σκεῦος
  choice: chiếc bình
  rationale: Trong hình ảnh người thợ gốm và đất sét, “chiếc bình” là từ cụ thể, dễ hiểu và phù hợp hơn “vật chứa”.
- source_word: εἰς ἀτιμίαν
  choice: để chịu khinh thường
  rationale: Giữ sự đối lập trực tiếp giữa τιμή và ἀτιμία, không thu hẹp nghĩa thành công dụng thông thường.
theological_decisions:
- issue: Diễn đạt ἐξουσία là thẩm quyền, quyền hay năng lực trong phân đoạn thường được dùng khi bàn về quyền tể trị của Đức Chúa Trời và trách nhiệm con người
  choice: quyền
  alternative: thẩm quyền; quyền năng
  rationale: “Quyền” vừa tự nhiên vừa nói đến đặc quyền chính đáng, không biến từ này thành khả năng thuần túy hoặc đưa thêm một kết luận giáo lý vào câu.
- issue: Hiểu εἰς τιμὴν / εἰς ἀτιμίαν là địa vị danh dự–khinh thường hay là công dụng sang trọng–thông thường
  choice: để được tôn trọng ... để chịu khinh thường
  alternative: dùng vào việc cao quý ... dùng vào việc thông thường
  rationale: Bản Hy Lạp trực tiếp dùng ngôn ngữ danh dự và nhục nhã. Giữ sự đối lập ấy tránh giới hạn ẩn dụ vào công dụng gia dụng và bảo tồn độ mở thần học của câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu hỏi tu từ được giữ lại; hình ảnh nghề gốm được diễn đạt cụ thể. Các chú thích nêu những khả năng dịch chính mà không áp đặt một hệ phái hay giải quyết thay người đọc sự căng thẳng thần học của lập luận.
