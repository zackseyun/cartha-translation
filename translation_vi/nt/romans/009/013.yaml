  text: ⸀καθὼς γέγραπται· Τὸν Ἰακὼβ ἠγάπησα, τὸν δὲ Ἠσαῦ ἐμίσησα.
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/013.yaml
  text: 'as it is written: “Jacob I loved[b][a], but Esau I hated.”'
translation:
  language: vi
  text: 'Như có chép rằng: “Ta đã yêu Gia-cốp, nhưng đã ghét Ê-sau.”[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Trích Ma-la-chi 1:2–3.
    reason: cross_reference
  - marker: b
    text: Cũng có thể được hiểu là “Ta đã khước từ” hoặc “Ta đã yêu ít hơn”. Trong ngữ cảnh giao ước, một số người hiểu “ghét” là sự khước từ hoặc sự ưu tiên có tính so sánh, thay vì sự thù ghét về cảm xúc.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς
  choice: như
  rationale: Dẫn vào lời trích Kinh Thánh theo cách ngắn gọn, tự nhiên, tương ứng với ý so sánh của từ Hy Lạp.
- source_word: γέγραπται
  choice: có lời chép
  rationale: Thể hoàn thành bị động được dùng như công thức trích dẫn Kinh Thánh; cách diễn đạt này tự nhiên, trang trọng và quen thuộc trong tiếng Việt.
- source_word: Ἰακώβ
  choice: Gia-cốp
  rationale: Dùng dạng tên riêng Kinh Thánh quen thuộc trong tiếng Việt.
- source_word: ἠγάπησα
  choice: Ta đã yêu
  rationale: Giữ nghĩa trực tiếp của động từ ἀγαπάω và diễn đạt thì aorist bằng cấu trúc quá khứ tự nhiên trong tiếng Việt.
- source_word: δὲ
  choice: nhưng
  rationale: Nêu rõ sự tương phản giữa Gia-cốp và Ê-sau.
- source_word: Ἠσαῦ
  choice: Ê-sau
  rationale: Dùng dạng tên riêng Kinh Thánh quen thuộc trong tiếng Việt.
- source_word: ἐμίσησα
  choice: ghét
  rationale: Giữ nghĩa từ vựng trực tiếp và mạnh của μισέω, không làm nhẹ sự căng thẳng thần học ngay trong chính văn; các cách hiểu khác được ghi ở chú thích.
theological_decisions:
- issue: Có nên làm nhẹ câu “ghét Ê-sau” vì những tranh luận về sự tuyển chọn của Đức Chúa Trời và lối nói so sánh hay không
  choice: Giữ “ghét” trong chính văn
  alternative: “khước từ” hoặc “yêu ít hơn”
  rationale: Bản Hy Lạp trích Ma-la-chi dùng động từ thông thường mang nghĩa “ghét”. Giữ cách dịch trực tiếp bảo tồn sức nặng và sự căng thẳng của câu, thay vì đưa một cách giải thích thần học vào chính văn.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Đại từ “Ta” phù hợp với lời Đức Chúa Trời trong câu trích dẫn. Chính văn giữ cách nói mạnh của nguyên ngữ; chú thích trình bày các khả năng ngữ nghĩa mà không áp đặt một cách giải thích.
