source:
  edition: SBLGNT
  text: λόγον γὰρ συντελῶν καὶ ⸀συντέμνων ποιήσει κύριος ἐπὶ τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/028.yaml
  text: For the Lord will carry out his word on the earth[c][b][a], finishing it and cutting it short.
translation:
  language: vi
  text: Vì Chúa sẽ thực hiện lời Ngài[a] trên đất[c], hoàn tất và rút ngắn lời ấy[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '“Lời” cũng có thể được hiểu là “sự việc” hoặc “bản án”; câu có thể dịch: “Chúa sẽ thi hành sự việc/bản án trên đất.”'
    reason: lexical_alternative
  - marker: b
    text: “Rút ngắn” cũng có thể được hiểu là “làm ngắn lại” hoặc, theo hàm ý, là việc ấy sẽ được thi hành nhanh chóng.
    reason: lexical_alternative
  - marker: c
    text: Một số bản dịch dùng “trong xứ”, phản ánh cách diễn đạt của Ê-sai trong bối cảnh ban đầu; tại đây, bản văn Hy Lạp của thư Rô-ma dùng cách nói “trên đất”.
    reason: cross_reference
lexical_decisions:
- source_word: λόγον
  choice: lời Ngài
  rationale: “Lời” giữ được sắc thái phát ngôn/tuyên bố của λόγος trong lời trích dẫn Ê-sai; “Ngài” được bổ sung tự nhiên theo chủ thể “Chúa”, cho thấy đây là điều Chúa đã phán mà Ngài sẽ thực hiện.
- source_word: γὰρ
  choice: Vì
  rationale: γάρ nêu lý do giải thích cho câu trước; “Vì” diễn đạt ngắn gọn và phù hợp với mạch lập luận của Phao-lô.
- source_word: συντελῶν
  choice: hoàn tất
  rationale: Diễn đạt việc đưa điều đã phán đến chỗ hoàn thành, đồng thời giữ quan hệ bổ nghĩa với hành động chính của Chúa.
- source_word: καὶ συντέμνων
  choice: và rút ngắn
  rationale: Giữ hình ảnh mạnh và phần nào khó hiểu của συντέμνω, không tự ý giải nghĩa thành “nhanh chóng”, dù hàm ý ấy có thể có trong ngữ cảnh.
- source_word: ποιήσει
  choice: sẽ thực hiện
  rationale: Với λόγον làm tân ngữ, “thực hiện” truyền đạt ý Chúa làm thành điều Ngài đã phán; tự nhiên hơn cách dịch sát “sẽ làm”.
- source_word: κύριος
  choice: Chúa
  rationale: Cách gọi trang trọng, quen thuộc và phù hợp cho κύριος khi chỉ Đức Chúa Trời trong lời trích dẫn.
- source_word: ἐπὶ τῆς γῆς
  choice: trên đất
  rationale: Giữ nghĩa rộng của cách diễn đạt Hy Lạp trong Rô-ma, đồng thời để chú thích nêu khả năng hiểu hẹp hơn là “trong xứ” theo bối cảnh Ê-sai.
theological_decisions:
- issue: Bản chất hành động của Chúa trong lời trích dẫn Ê-sai
  choice: Câu này nói Chúa dứt khoát làm thành lời Ngài trong lịch sử và sự phán xét, nhưng không xác định thêm một hệ thống giáo lý riêng biệt.
  alternative: Hiểu cụ thể là Chúa nhanh chóng thi hành một bản án tư pháp, hoặc hoàn tất và thu ngắn công việc cứu rỗi/phán xét.
  rationale: Hai phân từ mang sắc thái hoàn tất và rút ngắn, có thể hàm ý hành động phán xét mau lẹ; bản dịch giữ nguyên sức nặng và độ căng của câu Hy Lạp thay vì áp đặt một cách giải nghĩa thần học hẹp.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cấu trúc giữ gần nguyên văn để bảo tồn sự cô đọng cùng nét khó hiểu có chủ ý của cụm “hoàn tất và rút ngắn”, thay vì diễn giải quá mức.
