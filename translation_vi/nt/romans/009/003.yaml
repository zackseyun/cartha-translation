    issue: “Vì anh em tôi” có thể được hiểu là nguyên nhân.
    rationale: Ὑπέρ trong ngữ cảnh này là “vì lợi ích của/on behalf of”; cần diễn đạt rõ hướng lợi ích hy sinh của lời ước.
  - severity: low
    issue: “Chính mình bị” không biểu thị rõ đại từ chủ ngữ được nhấn mạnh.
    rationale: αὐτὸς ἐγώ nhấn mạnh “chính tôi”; cách sửa giữ trọng âm này tự nhiên hơn.
  - severity: low
    issue: “Những người cùng huyết thống với tôi theo phần xác” trùng lặp và nặng.
    rationale: συγγενῶν ... κατὰ σάρκα có thể dịch gọn là “những người bà con của tôi theo phần xác”; chú thích làm rõ đây là đồng bào cùng dòng dõi.
