id: ROM.9.3
reference: Romans 9:3
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ηὐχόμην γὰρ ⸂ἀνάθεμα εἶναι αὐτὸς ἐγὼ⸃ ἀπὸ τοῦ Χριστοῦ ὑπὲρ τῶν ἀδελφῶν μου τῶν συγγενῶν μου κατὰ σάρκα,
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/003.yaml
  text: For I could wish that I myself were accursed and cut off from the Messiah for the sake of my brothers[a], my kinsmen according to the flesh[c][b],
translation:
  language: vi
  text: Vì tôi có thể ước rằng chính tôi bị nguyền rủa và bị phân cách khỏi Đấng Mê-si vì lợi ích của anh em tôi[a], tức những người bà con của tôi theo phần xác[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Anh em tôi” ở đây chỉ những người Y-sơ-ra-ên đồng bào của Phao-lô, tức những người cùng dân tộc với ông.
    reason: cultural_note
  - marker: b
    text: “Theo phần xác” ở đây nghĩa là theo dòng dõi thể chất hoặc huyết thống dân tộc, không phải “theo bản tính tội lỗi.” Cụm “bị nguyền rủa và bị phân cách khỏi Đấng Mê-si” cũng có thể được hiểu sát hơn là “bị nguyền rủa khỏi Đấng Mê-si” hoặc “ở dưới lời nguyền, bị phân cách khỏi Đấng Mê-si.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ηὐχόμην
  choice: tôi có thể ước
  rationale: Thể chưa hoàn thành của εὔχομαι trong ngữ cảnh này diễn tả một ước nguyện giả định hoặc khó có thể thành hiện thực, chứ không đơn thuần là hành động trong quá khứ.
- source_word: ἀνάθεμα
  choice: bị nguyền rủa
  rationale: Diễn đạt tình trạng ở dưới lời nguyền, với sắc thái mạnh nhưng vẫn rõ nghĩa đối với độc giả hiện đại.
- source_word: αὐτὸς ἐγὼ
  choice: chính mình
  rationale: Giữ được sự nhấn mạnh đặc biệt vào bản thân Phao-lô.
- source_word: ἀπὸ τοῦ Χριστοῦ
  choice: lìa khỏi Đấng Mê-si
  rationale: ἀπό biểu thị sự phân cách; cách dịch này giữ mối liên hệ chặt chẽ giữa tình trạng bị nguyền rủa và sự lìa khỏi Đấng Mê-si mà không biến chúng thành hai ý hoàn toàn độc lập.
- source_word: ὑπὲρ
  choice: vì
  rationale: Diễn đạt tự nhiên ý nghĩa vì lợi ích của hoặc vì cớ những người được nhắc đến.
- source_word: τῶν ἀδελφῶν μου
  choice: anh em tôi
  rationale: Giữ hình ảnh thân tộc của ἀδελφοί; ngữ cảnh cho thấy đây là đồng bào Y-sơ-ra-ên của Phao-lô.
- source_word: τῶν συγγενῶν μου
  choice: những người cùng huyết thống với tôi
  rationale: Diễn đạt rõ quan hệ thân tộc theo dòng dõi và tránh làm người đọc hiểu hẹp là họ hàng gần trong gia đình.
- source_word: κατὰ σάρκα
  choice: theo phần xác
  rationale: Giữ thành ngữ đặc trưng của Phao-lô, đồng thời chú thích rằng ở đây nó chỉ dòng dõi thể chất hay sắc tộc, không phải bản tính tội lỗi.
theological_decisions:
- issue: Lời của Phao-lô là lời cầu xin thực tế hay ước nguyện giả định
  choice: Ước nguyện giả định, được diễn đạt bằng “tôi có thể ước”
  alternative: “tôi đã ước” hoặc “tôi cầu xin”
  rationale: Cách dịch không khẳng định quá mức rằng Phao-lô thực sự cầu xin bị phân cách khỏi Đấng Mê-si, nhưng vẫn giữ cường độ cảm xúc của câu.
- issue: Quan hệ giữa ἀνάθεμα và ἀπὸ τοῦ Χριστοῦ
  choice: “bị nguyền rủa và lìa khỏi Đấng Mê-si”
  alternative: “bị nguyền rủa khỏi Đấng Mê-si” hoặc “ở dưới lời nguyền, bị phân cách khỏi Đấng Mê-si”
  rationale: Bản dịch chính diễn đạt tự nhiên trong tiếng Việt, còn chú thích bảo lưu khả năng cụm Hy Lạp gắn ý bị nguyền rủa trực tiếp với sự phân cách khỏi Đấng Mê-si.
- issue: Ý nghĩa của σάρξ trong κατὰ σάρκα
  choice: Dòng dõi thể chất hoặc sắc tộc
  alternative: Bản tính tội lỗi
  rationale: Ngữ cảnh xác định người Y-sơ-ra-ên là bà con cùng dân tộc của Phao-lô, không bàn về khuynh hướng tội lỗi.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. “Đấng Mê-si” giữ chức danh của Χριστός; “theo phần xác” bảo tồn thành ngữ Phao-lô nhưng được giải thích bằng chú thích.
