id: ROM.9.22
reference: Romans 9:22
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εἰ δὲ θέλων ὁ θεὸς ἐνδείξασθαι τὴν ὀργὴν καὶ γνωρίσαι τὸ δυνατὸν αὐτοῦ ἤνεγκεν ἐν πολλῇ μακροθυμίᾳ σκεύη ὀργῆς κατηρτισμένα εἰς ἀπώλειαν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/022.yaml
  text: But what if God[a], wanting to display his wrath and make known his power, endured with great patience vessels of wrath prepared for destruction[c][b],
translation:
  language: vi
  text: Nhưng nếu Đức Chúa Trời[a] muốn bày tỏ cơn thịnh nộ và cho biết quyền năng[b] của Ngài, đã với lòng rất kiên nhẫn chịu đựng những bình của cơn thịnh nộ, vốn đã được chuẩn bị cho sự hủy diệt[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Nhưng giả như”. Tiếng Hy Lạp mở đầu một câu điều kiện mang tính tu từ và câu này còn tiếp tục sang câu 23.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “sức mạnh của Ngài”. Cụm từ Hy Lạp theo nghĩa đen nói đến điều có sức mạnh hoặc điều Ngài có thể làm; tại đây chỉ quyền năng của Đức Chúa Trời.'
    reason: lexical_alternative
  - marker: c
    text: 'Thể bị động “đã được chuẩn bị cho sự hủy diệt” không cho biết ai đã chuẩn bị những bình này. Có những cách hiểu khác nhau: đó là hành động của Đức Chúa Trời, kết quả của việc con người tự làm mình chai cứng, hoặc chỉ là tình trạng sẵn sàng chịu phán xét.'
    reason: alternative_reading
lexical_decisions:
- source_word: εἰ δὲ
  choice: Nhưng nếu
  rationale: Giữ nguyên cấu trúc điều kiện mang tính tu từ; mệnh đề còn tiếp tục sang câu 23, nên bản dịch không khép kín câu tại đây.
- source_word: θέλων
  choice: muốn
  rationale: Phản ánh phân từ chỉ ý muốn hay ý định của Đức Chúa Trời mà không quyết định nó mang sắc thái nguyên nhân hay nhượng bộ.
- source_word: ἐνδείξασθαι τὴν ὀργὴν
  choice: bày tỏ cơn thịnh nộ
  rationale: Diễn đạt hành động cho thấy rõ một cách có chủ đích; “cơn thịnh nộ” giữ được sắc thái xét xử của ὀργή trong văn mạch.
- source_word: γνωρίσαι τὸ δυνατὸν αὐτοῦ
  choice: làm cho quyền năng của Ngài được biết đến
  rationale: Giữ ý khiến người khác nhận biết; “quyền năng” là cách diễn đạt tự nhiên theo văn cảnh cho τὸ δυνατὸν αὐτοῦ.
- source_word: ἤνεγκεν ἐν πολλῇ μακροθυμίᾳ
  choice: đã lấy lòng hết sức kiên nhẫn mà chịu đựng
  rationale: Diễn tả cách thức Đức Chúa Trời chịu đựng trong sự nhẫn nại lớn lao, bằng ngôn ngữ hiện đại nhưng trang trọng.
- source_word: σκεύη ὀργῆς
  choice: những bình của cơn thịnh nộ
  rationale: Giữ hình ảnh đồ gốm trong văn mạch gần và cấu trúc sở hữu cô đọng, không diễn giải trước quan hệ chính xác giữa các bình và cơn thịnh nộ.
- source_word: κατηρτισμένα εἰς ἀπώλειαν
  choice: vốn đã được chuẩn bị cho sự hủy diệt
  rationale: Thể hoàn thành bị động mô tả tình trạng đã được chuẩn bị nhưng không nêu tác nhân; “sự hủy diệt” diễn đạt trực tiếp đích đến hay kết quả.
theological_decisions:
- issue: Tác nhân của κατηρτισμένα (“đã được chuẩn bị”)
  choice: Dùng thể bị động “đã được chuẩn bị” mà không nêu ai là người chuẩn bị.
  alternative: Được Đức Chúa Trời chuẩn bị; tự làm cho mình sẵn sàng; hoặc đơn giản là ở trong tình trạng thích hợp cho sự hủy diệt.
  rationale: Nguyên văn không chỉ rõ tác nhân. Việc để ngỏ bảo tồn sự căng thẳng thần học thay vì ngầm giải quyết một vấn đề đang được tranh luận.
- issue: Cấu trúc điều kiện chưa hoàn tất bắt đầu bằng εἰ
  choice: Mở đầu bằng “Nhưng nếu” và kết câu 22 bằng dấu phẩy để nối sang câu 23.
  alternative: Chuyển thành một lời khẳng định độc lập hoặc hoàn chỉnh câu ngay trong câu 22.
  rationale: Cú pháp Hy Lạp tiếp tục sang câu kế tiếp; giữ cấu trúc này tránh làm cho lời của Phao-lô quả quyết hơn nguyên văn.
- issue: Quan hệ của phân từ θέλων với động từ chính
  choice: Dịch trung tính là “muốn”.
  alternative: “Vì muốn” theo nghĩa nguyên nhân hoặc “mặc dù muốn” theo nghĩa nhượng bộ.
  rationale: Bản thân phân từ cho phép quan hệ hoàn cảnh được hiểu theo hơn một cách; không thêm liên từ giúp tránh ấn định một cách hiểu.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng và dễ hiểu. Dùng “Đức Chúa Trời” và đại từ tôn kính “Ngài”. Giữ hình ảnh “những bình” để liên kết với hình ảnh người thợ gốm trong văn mạch, đồng thời giữ nguyên câu điều kiện chưa hoàn tất bằng dấu phẩy cuối câu.
