source:
  edition: SBLGNT
  text: ἐπαγγελίας γὰρ ὁ λόγος οὗτος· Κατὰ τὸν καιρὸν τοῦτον ἐλεύσομαι καὶ ἔσται τῇ Σάρρᾳ υἱός.
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/009.yaml
  text: 'For this is the word of promise: “At this time I will come[a], and Sarah will have a son.”'
translation:
  language: vi
  text: 'Vì lời hứa là thế này: “Vào thời điểm này, Ta sẽ đến[a], và Sa-ra sẽ có một con trai.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “Ta sẽ trở lại.” Bản Hy Lạp ở đây chép “Ta sẽ đến,” nhưng một số bản dịch theo cách diễn đạt trong bối cảnh Sáng Thế Ký là “trở lại.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπαγγελίας
  choice: lời hứa
  rationale: Cụm ὁ λόγος ἐπαγγελίας chỉ lời tuyên bố mang nội dung hứa; “lời hứa” tự nhiên trong tiếng Việt và giữ trọng tâm của Phao-lô về lời hứa của Đức Chúa Trời.
- source_word: λόγος
  choice: lời
  rationale: Ở đây λόγος chỉ chính lời được trích dẫn; “lời” vừa ngắn gọn vừa phù hợp văn phong Kinh Thánh tiếng Việt.
- source_word: γὰρ
  choice: Vì
  rationale: Từ này nối câu với lập luận trước đó bằng cách đưa ra lời giải thích.
- source_word: Κατὰ τὸν καιρὸν τοῦτον
  choice: Đến thời điểm này
  rationale: Cụm này chỉ thời điểm đã định mà lời hứa sẽ được thực hiện; cách diễn đạt này tự nhiên và không thêm ý ngoài bản Hy Lạp.
- source_word: ἐλεύσομαι
  choice: ta sẽ đến
  rationale: Động từ ἔρχομαι có nghĩa trực tiếp là “đến”; đại từ “ta” phù hợp với lời phán trực tiếp trang trọng của Đức Chúa Trời.
- source_word: ἔσται τῇ Σάρρᾳ υἱός
  choice: Sa-ra sẽ có một con trai
  rationale: Cấu trúc sở hữu theo nghĩa đen là “một con trai sẽ thuộc về Sa-ra,” được diễn đạt tự nhiên trong tiếng Việt bằng “Sa-ra sẽ có một con trai.”
- source_word: Σάρρᾳ
  choice: Sa-ra
  rationale: Dùng dạng tên riêng quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
- source_word: υἱός
  choice: con trai
  rationale: Danh từ chỉ rõ một người con thuộc giới tính nam, điều có ý nghĩa trong lời hứa về Y-sác.
theological_decisions:
- issue: Lời hứa dành cho Áp-ra-ham và tác nhân thần linh
  choice: Trình bày lời hứa như lời phán trực tiếp của Đức Chúa Trời, dùng “ta sẽ đến.”
  alternative: Dùng “ta sẽ trở lại” theo cách diễn đạt của một số bản dịch phần Sáng Thế Ký.
  rationale: Lập luận của Phao-lô đặt nền tảng nơi lời hứa thần linh, nhưng bản Hy Lạp tại Rô-ma dùng động từ “đến”; vì vậy bản dịch giữ nguyên lời văn tại đây mà không hòa đồng ngầm với truyền thống dịch khác.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Câu dẫn giữ mạch lập luận bằng “Vì”; lời trích dùng “ta” để thể hiện lời phán thần linh mà không thêm danh xưng không có trong nguyên bản.
