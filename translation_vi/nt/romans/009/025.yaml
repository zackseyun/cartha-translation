id: ROM.9.25
reference: Romans 9:25
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὡς καὶ ἐν τῷ Ὡσηὲ λέγει· Καλέσω τὸν οὐ λαόν μου λαόν μου καὶ τὴν οὐκ ἠγαπημένην ἠγαπημένην·
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/025.yaml
  text: as he also says in Hosea[a], “I will call those who were not my people, ‘my people,’ and her who was not loved[c][b], ‘loved.’”
translation:
  language: vi
  text: 'Như Ngài cũng phán trong sách Ô-sê: “Ta sẽ gọi người không phải là dân Ta là ‘dân Ta,’ và người nữ không được yêu thương là ‘người được yêu thương.’”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Trích Ô-sê 2:23 theo bản văn Hê-bơ-rơ; Bản Bảy Mươi (LXX) đánh số câu này là 2:25. Vế cuối cũng có thể dịch là “người được yêu.”
    reason: Nêu chính xác nguồn trích dẫn và sự khác biệt đánh số MT/LXX, đồng thời ghi nhận phương án từ vựng hợp lệ cho ἠγαπημένην.
lexical_decisions:
- source_word: ὡς καὶ
  choice: Như ... cũng
  rationale: Giữ sắc thái so sánh và bổ sung, đồng thời tạo lời dẫn trích dẫn tự nhiên trong tiếng Việt.
- source_word: ἐν τῷ Ὡσηὲ
  choice: trong sách Ô-sê
  rationale: Đây là công thức dẫn Kinh Thánh, chỉ sách mang tên Ô-sê; thêm “sách” giúp câu tiếng Việt rõ và tự nhiên.
- source_word: λέγει
  choice: Ngài ... phán
  rationale: Chủ thể hàm ẩn là Đức Chúa Trời đang phán trong Kinh Thánh. “Phán” phù hợp văn phong trang trọng mà không biến câu thành lối nói vô nhân xưng.
- source_word: Καλέσω
  choice: Ta sẽ gọi
  rationale: Diễn đạt trực tiếp hành động đặt tên hay công nhận căn tính giao ước, đồng thời giữ sự tương ứng với lời Ô-sê.
- source_word: τὸν οὐ λαόν μου
  choice: kẻ không phải dân Ta
  rationale: Giữ hình thức số ít có ý nghĩa tập thể của tiếng Hy Lạp; “dân Ta” vẫn biểu đạt rõ chiều kích cộng đồng.
- source_word: λαόν μου
  choice: dân Ta
  rationale: Cách diễn đạt ngắn gọn, quen thuộc cho công thức giao ước “dân của Ta.”
- source_word: τὴν οὐκ ἠγαπημένην
  choice: người nữ không được yêu
  rationale: Giữ giống cái số ít trong bản Hy Lạp và nền văn cảnh Ô-sê, đồng thời thể hiện ý bị động của phân từ.
- source_word: ἠγαπημένην
  choice: người được yêu
  rationale: Giữ ý bị động của cùng một từ gốc với vế trước; cách nói hiện đại và rõ nghĩa hơn một danh xưng cổ.
theological_decisions:
- issue: Sắc thái tập thể hay cá nhân trong lời trích Ô-sê
  choice: Giữ hình thức số ít “kẻ không phải dân Ta” nhưng hiểu “dân” theo nghĩa tập thể; giữ rõ giống cái ở vế thứ hai bằng “người nữ.”
  alternative: Dịch vế đầu thành số nhiều “những người không phải dân Ta,” hoặc chuyển cả hai vế thành các danh hiệu “Không Phải Dân Ta” và “Không Được Yêu.”
  rationale: Tiếng Hy Lạp dùng hình thức số ít, trong khi λαός tự nó mang ý nghĩa cộng đồng. Bản dịch này tránh làm mất hình thức nguyên văn và vẫn bảo toàn nền văn cảnh nữ tính của lời Ô-sê.
- issue: Chủ thể của λέγει
  choice: Dùng “Ngài ... phán,” hiểu Đức Chúa Trời là Đấng nói trong Kinh Thánh.
  alternative: Dùng công thức vô nhân xưng “có chép trong sách Ô-sê.”
  rationale: Động từ Hy Lạp ở ngôi thứ ba số ít và văn cảnh trình bày lời trích như lời Đức Chúa Trời; cách dịch này giữ tính nhân xưng mà không thêm một danh xưng thần học không có trong câu.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Đại từ “Ngài/Ta” phản ánh Đức Chúa Trời là chủ thể hàm ẩn. Cấu trúc lời trích giữ tính song song và giữ giống cái rõ ràng ở vế thứ hai.
