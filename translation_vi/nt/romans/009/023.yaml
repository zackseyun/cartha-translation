source:
  edition: SBLGNT
  text: ⸀καὶ ἵνα γνωρίσῃ τὸν πλοῦτον τῆς δόξης αὐτοῦ ἐπὶ σκεύη ἐλέους, ἃ προητοίμασεν εἰς δόξαν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/023.yaml
  text: and in order to make known the riches of his glory upon vessels of mercy, which he prepared beforehand for glory,
translation:
  language: vi
  text: và để bày tỏ sự phong phú của vinh quang Ngài trên những bình của lòng thương xót, mà Ngài đã chuẩn bị từ trước cho vinh quang,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸν πλοῦτον τῆς δόξης αὐτοῦ
  choice: sự phong phú của vinh quang Ngài
  rationale: Giữ hình ảnh về mức độ dồi dào, vô tận của vinh quang, đồng thời dùng cách diễn đạt tự nhiên trong tiếng Việt hiện đại.
- source_word: ἐπὶ σκεύη ἐλέους
  choice: trên những bình chứa lòng thương xót
  rationale: Giữ giá trị cơ bản của ἐπί là “trên/đối với” theo mạch câu, đồng thời bảo tồn ẩn dụ σκεύη và cấu trúc Semit kiểu “bình chứa lòng thương xót” thay vì diễn giải thành người nhận lòng thương xót.
- source_word: ἃ προητοίμασεν
  choice: là những bình Ngài đã chuẩn bị từ trước
  rationale: Đại từ trung tính số nhiều ἃ quy chiếu về σκεύη; lặp lại “những bình” giúp tiếng Việt rõ nghĩa. “Ngài” là chủ thể được hiểu từ động từ và ngữ cảnh.
- source_word: εἰς δόξαν
  choice: cho vinh quang
  rationale: Giữ nét hướng đích của εἰς và không xác định thêm đây là vinh quang của ai hoặc theo nghĩa nào.
theological_decisions:
- issue: Chủ thể của προητοίμασεν không được nêu trực tiếp trong câu Hy Lạp
  choice: Ngài đã chuẩn bị từ trước
  alternative: đã được chuẩn bị từ trước
  rationale: Động từ ở chủ động ngôi ba số ít và chủ thể tự nhiên theo ngữ cảnh là Đức Chúa Trời; tránh đổi sang thể bị động vốn không có trong nguyên văn.
- issue: Quan hệ của ἐπί với “những bình chứa lòng thương xót”
  choice: trên
  alternative: cho / đối với
  rationale: Giữ cách diễn đạt gần nguyên văn và phù hợp với bản tiếng Anh đã được thẩm định, không âm thầm chuyển quan hệ này thành ý ban phát hay thụ hưởng.
translation_notes:
  register: Văn phong trang trọng, hiện đại, giữ cấu trúc nối tiếp của câu Hy Lạp vì câu này phụ thuộc cú pháp vào câu trước. “Bình” được dùng theo ẩn dụ vật chứa; cụm “lòng thương xót” giữ sắc thái thần học mà không thêm diễn giải hệ phái.
