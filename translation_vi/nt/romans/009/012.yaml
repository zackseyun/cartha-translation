revisions:
- from: 'không bởi việc làm, nhưng bởi Đấng kêu gọi[a], thì bà được phán rằng: “Người lớn hơn sẽ phục vụ người nhỏ hơn.”[b][c]'
  to: 'Bà được phán rằng điều ấy không phải do việc làm, nhưng do Đấng kêu gọi[a]: “Người anh sẽ phục vụ người em.”[b][c]'
  rationale: Sửa cách diễn đạt của lời trích dẫn để tránh sự mơ hồ và thiếu tự nhiên của “người lớn hơn/người nhỏ hơn” trong tiếng Việt hiện đại. Cấu trúc câu được sắp xếp lại để “điều ấy không phải do việc làm, nhưng do Đấng kêu gọi” làm rõ cơ sở của lời phán, không thêm kết luận thần học hoặc chủ thể ngoài nguyên văn. Chú thích bảo lưu phương án sát chữ nhằm duy trì độ rộng từ vựng của tiếng Hy Lạp.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T10:25:44Z'
review_pass:
  verdict: revise
  source_fidelity: Bản nháp truyền đạt đúng thế đối lập giữa “việc làm” và “Đấng kêu gọi,” đồng thời giữ thể bị động vô nhân xưng của ἐρρέθη. Tuy nhiên, “Người lớn hơn/người nhỏ hơn” trong tiếng Việt hiện đại dễ gợi kích thước hay tuổi đã trưởng thành, không diễn đạt tự nhiên cặp đối ứng trong ngữ cảnh Gia-cốp–Ê-sau. “Người anh/người em” phản ánh chính xác ý theo ngữ cảnh của trích dẫn Sáng Thế Ký, còn chú thích có thể bảo lưu cách dịch sát mặt chữ “lớn hơn/nhỏ hơn.”
  naturalness: “Bà được phán rằng” là lối văn Kinh Thánh trang trọng, có thể dùng được, nhưng mệnh đề mở đầu trong bản nháp bị rời và câu bắt đầu bằng chữ thường. Sắp xếp lại thành “Bà được phán rằng điều ấy không phải do...” làm câu tiếng Việt hoàn chỉnh, tự nhiên, mà vẫn giữ nguyên quan hệ cú pháp và trọng tâm lập luận.
  terminology: “Đấng kêu gọi” phù hợp cho τοῦ καλοῦντος và giữ sắc thái tôn kính mà không cần thêm danh xưng không có trong bản gốc. “Việc làm” phù hợp cho ἔργων. Dùng “người anh/người em” trong lời trích dẫn là cách dùng chuẩn, rõ nghĩa trong tiếng Việt hiện đại; chú thích nêu lựa chọn sát chữ “người lớn hơn/người nhỏ hơn.”
  issues:
  - severity: medium
    issue: “Người lớn hơn/người nhỏ hơn” không tự nhiên và có thể hiểu là lớn/nhỏ về thể chất hoặc độ trưởng thành.
    rationale: Mặc dù μείζων/ἐλάσσων có độ rộng nghĩa, trong lời sấm về hai con của Rê-bê-ca, đối ứng theo thứ tự anh/em là ý phù hợp ngữ cảnh và cách diễn đạt tiếng Việt rõ ràng hơn.
  - severity: low
    issue: Câu chính văn mở đầu bằng chữ thường và cấu trúc “..., thì bà được phán rằng” thiếu mạch lạc trong tiếng Việt.
    rationale: Đây là một câu độc lập trong bản trình bày hiện tại; nên viết hoa và đặt mệnh đề về cơ sở của lời phán sau công thức bị động để câu hoàn chỉnh hơn.
