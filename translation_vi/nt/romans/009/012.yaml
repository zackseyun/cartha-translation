base_translation:
  language: en
  yaml_path: translation/nt/romans/009/012.yaml
  text: not from works but from the One who calls[a], it was said to her[c][b], “The older will serve the younger.”
translation:
  language: vi
  text: 'Bà được phán rằng điều ấy không phải do việc làm, nhưng do Đấng kêu gọi[a]: “Người anh sẽ phục vụ người em.”[b][c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “không dựa trên việc làm, nhưng dựa trên Đấng kêu gọi.”'
    reason: lexical_alternative
  - marker: b
    text: Trích Sáng Thế Ký 25:23.
    reason: cross_reference
  - marker: c
    text: 'Cũng có thể dịch sát mặt chữ: “Người lớn hơn sẽ phục vụ người nhỏ hơn.” Trong bối cảnh Gia-cốp và Ê-sau, cách dịch “người anh/người em” làm rõ quan hệ theo tuổi tác.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὐκ ἐξ ἔργων
  choice: không bởi việc làm
  rationale: ἐκ với sở hữu cách có thể chỉ nguồn gốc hoặc cơ sở. “Không bởi việc làm” giữ được sự cô đọng và thế đối lập trong lập luận của Phao-lô.
- source_word: ἀλλ’ ἐκ τοῦ καλοῦντος
  choice: nhưng bởi Đấng kêu gọi
  rationale: Phân từ hiện tại có mạo từ τοῦ καλοῦντος được dùng như danh từ và chỉ về Đức Chúa Trời. “Đấng kêu gọi” vừa trang trọng, tự nhiên, vừa giữ sắc thái hiện tại của phân từ.
- source_word: ἐρρέθη αὐτῇ
  choice: thì bà được phán rằng
  rationale: Cách dịch bị động giữ công thức dẫn lời của nguyên văn mà không thêm chủ thể; “bà” chỉ Rê-bê-ca theo ngữ cảnh.
- source_word: ὅτι
  choice: 'rằng: “…”'
  rationale: ὅτι dẫn lời nói trực tiếp; tiếng Việt tự nhiên dùng “rằng” cùng dấu hai chấm và ngoặc kép.
- source_word: Ὁ μείζων
  choice: Người lớn hơn
  rationale: Cách dịch này giữ nghĩa so sánh rộng của μείζων, đồng thời trong bối cảnh Ê-sau và Gia-cốp có thể được hiểu là người anh.
- source_word: δουλεύσει
  choice: sẽ phục vụ
  rationale: δουλεύω có thể mang nghĩa làm nô lệ hoặc phục dịch; “phục vụ” diễn đạt quan hệ lệ thuộc mà không nhấn quá mức sắc thái nô lệ.
- source_word: τῷ ἐλάσσονι
  choice: người nhỏ hơn
  rationale: “Người nhỏ hơn” giữ sự đối xứng với “người lớn hơn” và bảo tồn khả năng chỉ tuổi tác hoặc địa vị của ἐλάσσων.
theological_decisions:
- issue: Có nên diễn giải sự tương phản giữa việc làm và Đấng kêu gọi thành một mệnh đề giáo lý rõ hơn hay không
  choice: 'Giữ cách nói cô đọng: “không bởi việc làm, nhưng bởi Đấng kêu gọi.”'
  alternative: “không dựa trên việc làm, nhưng dựa trên Đức Chúa Trời là Đấng kêu gọi”
  rationale: Nguyên văn đối lập việc làm với Đấng kêu gọi nhưng không trình bày đầy đủ kết luận thần học ngay trong mệnh đề này. Bản dịch không thêm một cách diễn giải mang tính hệ phái.
- issue: Nên hiểu μείζων và ἐλάσσων theo tuổi tác hay địa vị
  choice: Dùng “người lớn hơn” và “người nhỏ hơn” trong chính văn.
  alternative: “người anh” và “người em”
  rationale: Bối cảnh Sáng Thế Ký nói đến hai anh em, nhưng từ Hy Lạp cũng có nghĩa “lớn hơn/nhỏ hơn” hoặc “cao hơn/thấp hơn”. Chính văn giữ độ rộng của nguyên ngữ, còn chú thích nêu cách hiểu theo bối cảnh.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “Đấng” để chỉ Đức Chúa Trời mà không đưa danh xưng vắng mặt trong nguyên văn. Trật tự các dấu chú thích theo vị trí liên quan trong câu; mọi dấu [a], [b], [c] đều xuất hiện trong chính văn.
