id: ROM.9.33
reference: Romans 9:33
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καθὼς γέγραπται· Ἰδοὺ τίθημι ἐν Σιὼν λίθον προσκόμματος καὶ πέτραν σκανδάλου, ⸀καὶ ὁ πιστεύων ἐπ’ αὐτῷ οὐ καταισχυνθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/033.yaml
  text: As it is written[a], “Look, I am laying in Zion a stone of stumbling and a rock of offense[d][c][b], and the one who believes in him will not be put to shame.”
translation:
  language: vi
  text: 'Như có chép rằng: “Kìa, Ta đặt tại Si-ôn một hòn đá làm người ta vấp, một tảng đá khiến người ta sa ngã[a]; và người tin nơi Người[b] sẽ không bị hổ thẹn[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tại đây, Phao-lô kết hợp Ê-sai 8:14 với Ê-sai 28:16.
    reason: cross_reference
  - marker: b
    text: Nguyên văn có nghĩa sát là “tin trên Người”. Cũng có thể hiểu đại từ này là “nó”, chỉ về hòn đá; trong văn mạch, Phao-lô áp dụng hình ảnh ấy cho Đấng Mê-si-a.
    reason: lexical_alternative
  - marker: c
    text: Cũng có thể dịch là “sẽ không phải thất vọng” hoặc “sẽ không bị bẽ mặt”.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς γέγραπται
  choice: Như có lời chép
  rationale: Công thức quen thuộc để dẫn lời Kinh Thánh, vừa tự nhiên trong tiếng Việt hiện đại vừa giữ ý nghĩa của thể hoàn thành bị động.
- source_word: Ἰδοὺ
  choice: Kìa
  rationale: Giữ sắc thái chỉ dẫn và gây chú ý của nguyên văn mà không dùng lối nói quá cổ.
- source_word: τίθημι
  choice: Ta đặt
  rationale: Giữ thì hiện tại của lời trích và phù hợp với hình ảnh đặt đá trong công trình xây dựng.
- source_word: ἐν Σιὼν
  choice: tại Si-ôn
  rationale: Diễn đạt địa điểm tự nhiên trong tiếng Việt; không áp đặt nghĩa ở trên núi Si-ôn.
- source_word: λίθον προσκόμματος
  choice: một hòn đá làm người ta vấp
  rationale: Truyền đạt trực tiếp quan hệ gây vấp của cụm danh từ Hy Lạp bằng cách nói rõ ràng, dễ hiểu.
- source_word: πέτραν σκανδάλου
  choice: một tảng đá khiến người ta sa ngã
  rationale: Phân biệt πέτρα là tảng đá với λίθος là hòn đá, đồng thời chuyển tải σκάνδαλον như nguyên nhân khiến người ta sa ngã.
- source_word: ὁ πιστεύων
  choice: người tin
  rationale: Giữ tính khái quát và số ít của phân từ được dùng như danh từ, không thêm đặc điểm giới tính.
- source_word: ἐπ’ αὐτῷ
  choice: tin nơi Người
  rationale: “Tin nơi” là cách diễn đạt tự nhiên trong tiếng Việt cho niềm tin hướng đến một đối tượng; “Người” thể hiện cách Phao-lô áp dụng hình ảnh hòn đá cho Đấng Mê-si-a, còn cách hiểu phi nhân xưng được ghi ở chú thích.
- source_word: οὐ καταισχυνθήσεται
  choice: sẽ không bị hổ thẹn
  rationale: Giữ thì tương lai, thể bị động và sắc thái danh dự–hổ thẹn của động từ, thay vì thu hẹp nghĩa thành chỉ không thất vọng.
theological_decisions:
- issue: Đối tượng của αὐτῷ trong lời trích ghép từ Ê-sai
  choice: Dùng đại từ nhân xưng “Người”, theo cách Phao-lô áp dụng hình ảnh hòn đá cho Đấng Mê-si-a trong văn mạch.
  alternative: Có thể hiểu là “nó”, quy chiếu theo hình ảnh đến hòn đá.
  rationale: Đại từ Hy Lạp ở giống đực và văn mạch Rô-ma 9:32–33; 10:11 hỗ trợ cách hiểu mang tính nhân xưng, nhưng chú thích vẫn giữ lại khả năng quy chiếu trực tiếp đến hình ảnh hòn đá.
- issue: Quan hệ giữa hai mệnh đề của lời trích
  choice: Dịch καὶ là “và”.
  alternative: Có thể diễn đạt theo quan hệ đối lập là “nhưng” để làm nổi bật kết quả khác nhau giữa người vấp ngã và người tin.
  rationale: Nguyên văn dùng liên từ καὶ; giữ “và” tránh giải thích quá mức quan hệ tu từ.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại, dễ hiểu. “Kìa” giữ sức gợi của lời tiên tri; “Si-ôn” giữ địa danh truyền thống. Đại từ “Ta” và “Người” được viết hoa để giúp nhận diện các đối tượng trong lời trích, nhưng không bổ sung danh xưng thần học không có trong câu Hy Lạp.
