  source_fidelity: 'Bản dịch truyền đạt đúng cấu trúc và ý chính của câu: công thức dẫn trích dẫn, động từ hiện tại «Ta đặt», địa điểm Si-ôn, hai hình ảnh gây vấp ngã, lời hứa cho người tin, và thể bị động tương lai «sẽ không bị hổ thẹn». Cách dịch «Người» cho αὐτῷ là khả dĩ theo văn mạch Phao-lô áp dụng hình ảnh cho Đấng Mê-si-a; chú thích đã bảo lưu cách hiểu quy chiếu về hòn đá.'
