  terminology: “Đức Chúa Trời,” “ý định,” và “sự tuyển chọn” thích hợp với văn mạch Phao-lô. “Thiện hay xấu” có sắc thái trang trọng nhưng vẫn rõ; không cần thay đổi. Chú thích về μένω cần tránh trình bày “được duy trì” như một nghĩa tương đương trực tiếp của động từ chủ động trong câu này.
