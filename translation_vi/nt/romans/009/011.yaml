id: ROM.9.11
reference: Romans 9:11
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: μήπω γὰρ γεννηθέντων μηδὲ πραξάντων τι ἀγαθὸν ἢ ⸀φαῦλον, ἵνα ἡ κατ’ ἐκλογὴν πρόθεσις τοῦ θεοῦ μένῃ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/011.yaml
  text: For before they had yet been born or had done anything good or bad[a], so that God’s purpose according to election might remain[c][b],
translation:
  language: vi
  text: Vì khi hai người con chưa được sinh ra và chưa làm điều gì thiện hay xấu[a]—để ý định của Đức Chúa Trời theo sự tuyển chọn vẫn tồn tại[b][c]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “điều gì tốt hay ác.” Từ Hy Lạp φαῦλον có thể chỉ điều xấu, thấp hèn hoặc ác về mặt đạo đức.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “ý định tuyển chọn của Đức Chúa Trời” hoặc “ý định của Đức Chúa Trời theo sự tuyển chọn.”'
    reason: lexical_alternative
  - marker: c
    text: 'Hay: “vẫn còn,” “tiếp tục tồn tại,” hoặc, theo ngữ cảnh, “đứng vững.” Động từ Hy Lạp μένω có nghĩa cơ bản là còn lại hoặc tiếp tục.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μήπω γὰρ γεννηθέντων
  choice: Vì khi hai người con chưa được sinh ra
  rationale: Diễn đạt tự nhiên cấu trúc sở hữu tuyệt đối và quan hệ thời gian; “Vì” giữ liên kết giải thích của γάρ với câu trước. Chủ thể số nhiều được làm rõ theo ngữ cảnh gần là hai người con.
- source_word: μηδὲ πραξάντων τι ἀγαθὸν ἢ φαῦλον
  choice: và chưa làm điều gì thiện hay xấu
  rationale: Giữ sự phủ định phối hợp của μηδέ. Cặp “thiện hay xấu” trang trọng, dễ hiểu và không đẩy φαῦλον sang mức độ đạo đức mạnh hơn mức từ ngữ bắt buộc.
- source_word: ἵνα
  choice: để
  rationale: Giữ chức năng chỉ mục đích tự nhiên của mệnh đề, nhưng không diễn giải thêm về quan hệ nhân quả thần học.
- source_word: ἡ κατ’ ἐκλογὴν πρόθεσις τοῦ θεοῦ
  choice: ý định của Đức Chúa Trời theo sự tuyển chọn
  rationale: Bảo tồn cấu trúc κατ’ ἐκλογήν thay vì nhập nó vào một cách diễn giải thần học. “Ý định” truyền đạt πρόθεσις như mục đích đã đặt ra; “sự tuyển chọn” là thuật ngữ rõ và quen thuộc cho ἐκλογή.
- source_word: μένῃ
  choice: được vững bền
  rationale: Trong ngữ cảnh, diễn đạt ý tiếp tục tồn tại và đứng vững của μένω bằng tiếng Việt tự nhiên; các nghĩa sát hơn được ghi ở chú thích.
theological_decisions:
- issue: Sắc thái của ἵνα trong ngữ cảnh về sự tuyển chọn
  choice: để ý định của Đức Chúa Trời theo sự tuyển chọn được vững bền
  alternative: với kết quả là ý định...; nhằm thiết lập ý định tuyển chọn...
  rationale: Dịch như mệnh đề mục đích theo cú pháp tự nhiên, nhưng không thêm khẳng định hệ thống về tiền định hay công trạng vượt quá văn bản.
- issue: Cách dịch ἐκλογή
  choice: sự tuyển chọn
  alternative: sự lựa chọn; việc chọn lựa
  rationale: Giữ trọng lượng thần học trong cách dùng của Phao-lô nhưng vẫn đủ trong sáng, không quyết định thay độc giả đối tượng, cơ sở hay cơ chế của sự tuyển chọn.
- issue: Chủ thể số nhiều trong cấu trúc sở hữu tuyệt đối
  choice: hai người con
  alternative: họ; hai đứa trẻ
  rationale: Ngữ cảnh câu 10 nói đến hai con của Rê-bê-ca. Cách gọi này làm tiếng Việt rõ nghĩa mà không thêm tên hoặc diễn giải thần học.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dấu gạch ngang cho thấy câu 11 tiếp tục sang câu 12, tránh biến mệnh đề phụ thành một câu độc lập. Các dấu chú thích đều xuất hiện trong chính văn.
