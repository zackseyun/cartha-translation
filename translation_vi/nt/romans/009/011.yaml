  verdict: revise
  source_fidelity: 'Bản nháp truyền đạt đúng cấu trúc chính: γάρ là liên từ giải thích, hai phân từ phủ định diễn tả việc chưa sinh và chưa làm điều thiện hay xấu, và ἵνα mở mệnh đề mục đích. Tuy nhiên, “được vững bền” chuyển μένῃ (chủ động: ‘vẫn còn/tồn tại’) sang cách diễn đạt bị động và nghiêng về ý ‘được làm cho vững’; nên dùng cách diễn đạt trực tiếp hơn.'
