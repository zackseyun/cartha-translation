source:
  edition: SBLGNT
  text: Οὐχ οἷον δὲ ὅτι ἐκπέπτωκεν ὁ λόγος τοῦ θεοῦ. οὐ γὰρ πάντες οἱ ἐξ Ἰσραήλ, οὗτοι Ἰσραήλ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/006.yaml
  text: But it is not as though the word of God has failed[b][a]. For not all those from Israel are Israel.
translation:
  language: vi
  text: Tuy nhiên, không phải vì thế mà lời Đức Chúa Trời đã thất bại. Vì không phải tất cả những người xuất thân từ Israel[a] đều là Israel[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “những người thuộc dòng dõi Israel.” Cụm từ Hy Lạp biểu thị nguồn gốc hoặc dòng dõi.
    reason: lexical_alternative
  - marker: b
    text: Tên “Israel” ở lần thứ hai có phạm vi quy chiếu khác với lần thứ nhất. Câu này đối chiếu người có nguồn gốc hoặc dòng dõi Israel với “Israel” ở vế sau, nhưng không xác định rõ hơn phạm vi chính xác của cách dùng thứ hai.
    reason: cross_reference
lexical_decisions:
- source_word: Οὐχ οἷον δὲ ὅτι
  choice: Nhưng không phải là
  rationale: Diễn đạt tự nhiên cấu trúc phủ định dùng để bác bỏ một suy luận có thể nảy sinh từ phần trước.
- source_word: ἐκπέπτωκεν
  choice: đã thất bại
  rationale: Thì hoàn thành chỉ tình trạng hiện tại do điều đã xảy ra; với lời Đức Chúa Trời, cách dịch này truyền đạt ý lời ấy không mất hiệu lực hay không đạt mục đích.
- source_word: ὁ λόγος τοῦ θεοῦ
  choice: lời Đức Chúa Trời
  rationale: Giữ nghĩa rộng của λόγος, không thu hẹp thành riêng 'lời hứa', dù trong ngữ cảnh lời mang chiều kích giao ước và lời hứa.
- source_word: οὐ γὰρ πάντες
  choice: Vì không phải tất cả
  rationale: γάρ đưa ra lời giải thích cho mệnh đề trước; 'Vì' giữ rõ quan hệ lập luận.
- source_word: οἱ ἐξ Ἰσραήλ
  choice: những người ra từ Israel
  rationale: ἐξ biểu thị nguồn gốc hoặc dòng dõi. Cách dịch sát này giữ phép chơi nghĩa với hai lần xuất hiện của 'Israel'; chú thích cung cấp cách nói tự nhiên hơn.
- source_word: οὗτοι Ἰσραήλ
  choice: đều là Israel
  rationale: Bổ sung hệ từ theo cú pháp tiếng Việt và dùng 'đều' tương ứng với phạm vi của πάντες, đồng thời giữ nguyên sự phân biệt cô đọng của Phao-lô.
theological_decisions:
- issue: Ý nghĩa của lần thứ hai xuất hiện tên 'Israel'
  choice: Giữ nguyên 'Israel' trong chính văn và giải thích rằng lần thứ hai được dùng theo nghĩa hẹp hơn, thuộc bình diện giao ước/thần học.
  alternative: Diễn giải trực tiếp là 'những người được chọn trong Israel' hoặc 'dân thật của Đức Chúa Trời'.
  rationale: Mạch văn phân biệt nguồn gốc thể lý với ý nghĩa đầy đủ hơn của Israel trong mục đích Đức Chúa Trời, nhưng câu này chưa xác định hết phạm vi thần học; giữ nguyên cách gọi tránh áp đặt một kết luận hệ phái.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Giữ 'Đức Chúa Trời' theo cách dùng Tin Lành phổ biến trong tiếng Việt; giữ nguyên tên Israel để bảo toàn phép đối chiếu trong nguyên văn. Các dấu chú thích [a], [b] đều xuất hiện trong chính văn.
