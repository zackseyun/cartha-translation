id: ROM.9.20
reference: Romans 9:20
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸂ὦ ἄνθρωπε, μενοῦνγε⸃ σὺ τίς εἶ ὁ ἀνταποκρινόμενος τῷ θεῷ; μὴ ἐρεῖ τὸ πλάσμα τῷ πλάσαντι Τί με ἐποίησας οὕτως;
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/020.yaml
  text: But who are you[a], O man, to answer back to God? Will what is formed say to the one who formed it[d][c][b], “Why did you make me like this?”
translation:
  language: vi
  text: 'Trái lại, hỡi con người, ngươi là ai mà cãi lại Đức Chúa Trời? Vật được nắn nên há lại nói với Đấng đã nắn nên nó rằng: “Tại sao ngài làm tôi như thế?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μενοῦνγε
  choice: Nhưng
  rationale: Tiểu từ này vừa nhấn mạnh vừa chuyển sang lời bác lại; “Nhưng” tự nhiên trong tiếng Việt và giữ được sắc thái đối nghịch mà không quá nặng nề.
- source_word: ὦ ἄνθρωπε
  choice: hỡi con người
  rationale: Lối xưng hô trực tiếp số ít, mang nghĩa đại diện cho một con người trước Đức Chúa Trời; “hỡi con người” giữ được sức nặng tu từ và không giới hạn về giới tính.
- source_word: σὺ τίς εἶ
  choice: bạn là ai
  rationale: Đây là câu hỏi chất vấn về tư cách, không phải câu hỏi nhận diện; cách diễn đạt này tự nhiên và trực diện trong tiếng Việt hiện đại.
- source_word: ὁ ἀνταποκρινόμενος τῷ θεῷ
  choice: mà dám cãi lại Đức Chúa Trời
  rationale: Động từ mang nghĩa đáp trả theo hướng chống đối hoặc cãi lại, chứ không phải chỉ trả lời trung tính. Thêm “dám” diễn đạt tự nhiên hàm ý về sự không đúng tư cách trong câu hỏi tu từ.
- source_word: μὴ ἐρεῖ
  choice: há sẽ nói
  rationale: μή với tương lai chỉ câu hỏi tu từ chờ đợi câu trả lời phủ định. “Há sẽ” thể hiện rõ lực tu từ ấy trong văn phong trang trọng nhưng vẫn dễ hiểu.
- source_word: τὸ πλάσμα
  choice: vật được nắn nên
  rationale: πλάσμα là vật được tạo hình hoặc nắn nên. Cách dịch này giữ hình ảnh người thợ và sự tương ứng từ vựng với động từ πλάσσω.
- source_word: τῷ πλάσαντι
  choice: Đấng đã nắn nên mình
  rationale: Phân từ chỉ người đã tạo hình vật ấy. “Đấng” phù hợp vì trong ngữ cảnh người tạo dựng tương ứng với Đức Chúa Trời; “mình” quy chiếu tự nhiên về vật được nắn nên.
- source_word: Τί με ἐποίησας οὕτως;
  choice: Tại sao ngài làm tôi ra thế này?
  rationale: Diễn đạt tự nhiên nghĩa sát chữ “Tại sao ngài làm tôi như thế?” và giữ nguyên lời chất vấn của vật được tạo thành.
theological_decisions:
- issue: Phạm vi đại diện của ἄνθρωπε
  choice: Dịch là “hỡi con người”
  alternative: “hỡi người” hoặc “hỡi người nam”
  rationale: Lời gọi ở số ít hướng đến một cá nhân nhưng đại diện cho loài người trước Đức Chúa Trời; “con người” giữ đúng phạm vi ấy mà không biến giống ngữ pháp thành giới tính sinh học.
- issue: Sức nặng của lời quở trách
  choice: Dùng “dám cãi lại Đức Chúa Trời”
  alternative: “trả lời Đức Chúa Trời”
  rationale: ἀνταποκρίνομαι ở đây có sắc thái chống đối. Bản dịch không làm nhẹ sự bất cân xứng giữa thụ tạo và Đấng Tạo Hóa, nhưng cũng không bổ sung một kết luận thần học vượt quá câu văn.
- issue: Câu hỏi tu từ với μή
  choice: Dùng “há sẽ nói” để biểu thị câu trả lời được chờ đợi là không
  alternative: “sẽ nói” và để ngữ cảnh hàm ý câu trả lời phủ định
  rationale: Tiếng Việt cần một dấu hiệu tu từ rõ hơn để bảo toàn lực của μή; “há” truyền đạt kỳ vọng phủ định mà không chuyển câu hỏi thành lời khẳng định.
translation_notes:
  register: Văn phong hiện đại, trang trọng và trực diện. “Hỡi” và “há” tạo sắc thái tu từ phù hợp với lời chất vấn mạnh; các từ còn lại thông dụng, dễ hiểu. Giữ hình ảnh nắn tạo xuyên suốt giữa πλάσμα và πλάσαντι.
