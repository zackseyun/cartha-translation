  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: διὰ τί; ὅτι οὐκ ἐκ πίστεως ἀλλ’ ὡς ἐξ ⸀ἔργων· ⸀προσέκοψαν τῷ λίθῳ τοῦ προσκόμματος,
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/032.yaml
  text: Why? Because it was not from faith[a], but as if from works. They stumbled over the stone of stumbling[d][c][b],
translation:
  language: vi
  text: Tại sao? Vì họ không dựa trên đức tin[a], nhưng như thể dựa trên việc làm[b]. Họ đã vấp phải hòn đá gây vấp ngã[c][d],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “không bởi đức tin” hoặc “không trên cơ sở đức tin”. Nguyên văn Hy Lạp sát nghĩa là “không từ đức tin”.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “nhưng như thể bởi việc làm”. Cách diễn đạt này giữ sắc thái “như thể” trong nguyên văn.'
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể dịch: “hòn đá gây xúc phạm”.'
    reason: lexical_alternative
  - marker: d
    text: Đây là lời gợi nhắc đến Ê-sai 8:14; cũng xem Ê-sai 28:16 trong câu kế tiếp.
    reason: cross_reference
lexical_decisions:
- source_word: διὰ τί
  choice: Tại sao?
  rationale: Cách hỏi tự nhiên, ngắn gọn trong tiếng Việt, giữ nguyên sức mạnh tu từ của câu hỏi.
- source_word: ὅτι
  choice: Vì
  rationale: Liên từ chỉ nguyên nhân, trực tiếp giải thích câu hỏi đứng trước.
- source_word: οὐκ ἐκ πίστεως
  choice: không dựa trên đức tin
  rationale: ἐκ diễn tả nguồn gốc hoặc cơ sở; “dựa trên” tự nhiên hơn “từ đức tin” trong tiếng Việt và vẫn giữ ý về nền tảng.
- source_word: πίστεως
  choice: đức tin
  rationale: Thuật ngữ quen thuộc, phù hợp với sự đối lập của Phao-lô giữa đức tin và việc làm; không buộc từ này mang nghĩa hẹp hơn là lòng tin cậy hay sự trung tín.
- source_word: ἀλλ’ ὡς ἐξ ἔργων
  choice: nhưng làm như thể dựa trên việc làm
  rationale: Giữ sắc thái ὡς, nghĩa là “như thể”, thay vì giản lược thành lời khẳng định dứt khoát “bởi việc làm”.
- source_word: ἔργων
  choice: việc làm
  rationale: Cách dịch quen thuộc của thuật ngữ Phao-lô dùng trong sự đối lập với đức tin, đồng thời dễ hiểu trong tiếng Việt hiện đại.
- source_word: προσέκοψαν
  choice: Họ đã vấp phải
  rationale: Giữ hình ảnh cụ thể của động từ προσκόπτω là va vào chướng ngại rồi vấp.
- source_word: τῷ λίθῳ τοῦ προσκόμματος
  choice: hòn đá gây vấp ngã
  rationale: Diễn đạt tự nhiên trong tiếng Việt, đồng thời duy trì liên hệ từ vựng và hình ảnh giữa động từ “vấp” với danh từ προσκόμμα.
theological_decisions:
- issue: Ý nghĩa của πίστις trong sự đối lập giữa đức tin và việc làm
  choice: đức tin
  alternative: lòng tin cậy; sự trung tín
  rationale: Trong ngữ cảnh này, Phao-lô đối lập cơ sở là đức tin với việc theo đuổi như thể dựa trên việc làm. “Đức tin” giữ phạm vi thần học của thuật ngữ mà không áp đặt nghĩa “sự trung tín” vốn không được ngữ cảnh này đòi hỏi.
- issue: Sắc thái của ὡς trước ἐξ ἔργων
  choice: như thể dựa trên việc làm
  alternative: dựa trên việc làm
  rationale: 'Giữ sự dè dặt thực sự trong nguyên văn: Phao-lô nói “như thể” chứ không trình bày cụm này đơn giản như một cơ sở thực tế.'
- issue: Hình ảnh λίθος τοῦ προσκόμματος
  choice: hòn đá gây vấp ngã
  alternative: hòn đá gây xúc phạm
  rationale: Nghĩa cụ thể về sự vấp ngã phù hợp với động từ προσέκοψαν và với hình ảnh từ Ê-sai; phương án “gây xúc phạm” có thể nêu trong chú thích nhưng dễ làm mờ ẩn dụ vật lý.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “dựa trên” để chuyển tải ἐκ theo nghĩa cơ sở một cách tự nhiên; giữ “như thể” nhằm bảo toàn sắc thái và căng thẳng của nguyên văn. Dấu phẩy cuối câu được giữ vì câu 32 nối trực tiếp sang phần trích dẫn ở câu 33.
