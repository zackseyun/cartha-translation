source:
  edition: SBLGNT
  text: οὓς καὶ ἐκάλεσεν ἡμᾶς οὐ μόνον ἐξ Ἰουδαίων ἀλλὰ καὶ ἐξ ἐθνῶν;—
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/024.yaml
  text: even us[a], whom he also called[b], not only from the Jews but also from the Gentiles—
translation:
  language: vi
  text: tức là chúng ta, những người Ngài cũng đã kêu gọi, không chỉ từ người Do Thái mà còn từ các dân ngoại—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὓς ... ἡμᾶς
  choice: tức là chúng ta, những người
  rationale: Đại từ quan hệ số nhiều οὓς được làm rõ bằng ἡμᾶς ở thế đồng vị. Cách diễn đạt này giữ mối liên kết với những người đã được nói đến ở câu trước, đồng thời chuyển cấu trúc Hy Lạp sang tiếng Việt tự nhiên.
- source_word: καὶ ἐκάλεσεν
  choice: cũng đã kêu gọi
  rationale: καί có sắc thái bổ sung, còn động từ aorist ἐκάλεσεν nói đến hành động kêu gọi đã xảy ra. “Kêu gọi” giữ được cách dùng thần học quen thuộc của Phao-lô mà không diễn giải thêm nội dung của sự kêu gọi.
- source_word: οὐ μόνον ... ἀλλὰ καὶ
  choice: không chỉ ... mà còn
  rationale: Đây là kết cấu tương liên tự nhiên trong tiếng Việt, bảo toàn sự cân xứng và tương phản của nguyên văn.
- source_word: ἐξ Ἰουδαίων
  choice: từ người Do Thái
  rationale: ἐξ chỉ nguồn gốc hoặc nhóm người mà những người được gọi xuất thân từ đó. Cách nói này rõ nghĩa và phù hợp với vế song song.
- source_word: ἐξ ἐθνῶν
  choice: từ các dân ngoại
  rationale: Trong thế đối lập trực tiếp với người Do Thái, ἔθνη chỉ các dân không thuộc dân Do Thái. “Các dân ngoại” vừa rõ đối tượng vừa gần với hình thức số nhiều của nguyên văn.
theological_decisions:
- issue: Mối liên hệ của οὓς ... ἡμᾶς với những đối tượng được thương xót ở câu trước
  choice: tức là chúng ta, những người Ngài cũng đã kêu gọi
  alternative: những người Ngài cũng đã kêu gọi, là chúng ta
  rationale: Bản dịch cho thấy Phao-lô đồng nhất “chúng ta” với những người vừa được nhắc đến, nhưng không thêm một kết luận thần học vượt quá cấu trúc của câu.
- issue: Nghĩa của ἐθνῶν trong sự đối chiếu Do Thái/không Do Thái
  choice: các dân ngoại
  alternative: các dân
  rationale: Ngữ cảnh đối chiếu với Ἰουδαίων xác định đây là các dân không thuộc dân Do Thái; cách dịch vẫn giữ chiều kích nhiều dân tộc của danh từ số nhiều.
- issue: Chủ thể hàm ẩn của ἐκάλεσεν
  choice: Ngài
  alternative: Đức Chúa Trời
  rationale: Chủ thể được hiểu từ mạch văn trước là Đức Chúa Trời. Dùng đại từ “Ngài” giữ câu gọn và tránh lặp lại danh xưng không có trong chính câu này.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dấu gạch ngang cuối câu được giữ vì câu tiếp tục sang phần trích dẫn ở câu kế tiếp. Không thêm chú thích vì các lựa chọn dịch đã đủ rõ trong tiếng Việt.
