reference: Romans 9:27
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἠσαΐας δὲ κράζει ὑπὲρ τοῦ Ἰσραήλ· Ἐὰν ᾖ ὁ ἀριθμὸς τῶν υἱῶν Ἰσραὴλ ὡς ἡ ἄμμος τῆς θαλάσσης, τὸ ⸀ὑπόλειμμα σωθήσεται·
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/027.yaml
  text: But Isaiah cries out concerning Israel[a], “Though the number of the sons of Israel is like the sand of the sea[c][b], only the remnant will be saved.”
translation:
  language: vi
  text: 'Nhưng Ê-sai lớn tiếng nói về Israel rằng: “Dù số con cái Israel đông như cát biển,[a] phần còn sót lại sẽ được cứu.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch sát hơn: “Nếu số con cái Israel đông như cát biển.” Trong ngữ cảnh, mệnh đề điều kiện này mang sắc thái nhượng bộ.'
    reason: alternative_reading
  - marker: b
    text: “Được cứu” cũng có thể mang nghĩa “được giải cứu”; cách nói này vọng lại lời tiên tri về phần dân còn sót lại.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Nhưng
  rationale: Diễn tả sự chuyển ý có sắc thái tương phản nhẹ trong lập luận của Phao-lô.
- source_word: κράζει
  choice: kêu lớn
  rationale: Giữ nét sống động của thì hiện tại và cường độ phát ngôn của κράζω, đồng thời tự nhiên trong tiếng Việt.
- source_word: ὑπὲρ τοῦ Ἰσραήλ
  choice: về dân Israel
  rationale: Trong ngữ cảnh trích dẫn lời tiên tri, ὑπέρ mang nghĩa ‘về/liên quan đến’, không nhất thiết là ‘thay mặt cho’.
- source_word: Ἐὰν ᾖ
  choice: Dù ... đông
  rationale: Điều kiện ở đây có tác dụng nhượng bộ trong ngữ cảnh; ‘dù’ làm rõ sự tương phản mà không xóa cách hiểu sát chữ ‘nếu’.
- source_word: ὁ ἀριθμὸς τῶν υἱῶν Ἰσραήλ
  choice: số con cái Israel
  rationale: ‘Con cái Israel’ là cách gọi giao ước mang tính tập thể, tự nhiên hơn ‘các con trai Israel’ trong tiếng Việt mà vẫn gần với nguyên văn.
- source_word: ὡς ἡ ἄμμος τῆς θαλάσσης
  choice: như cát biển
  rationale: Cách nói gọn, tự nhiên và quen thuộc trong văn phong Kinh Thánh tiếng Việt.
- source_word: τὸ ὑπόλειμμα
  choice: chỉ phần còn sót lại
  rationale: ‘Phần còn sót lại’ giữ khái niệm về một bộ phận sống sót; thêm ‘chỉ’ làm hiển lộ sự tương phản vốn được cấu trúc câu hàm ý.
- source_word: σωθήσεται
  choice: sẽ được cứu
  rationale: Giữ trọng lượng cứu rỗi trong ngữ cảnh thư Rô-ma, đồng thời không loại bỏ nền nghĩa giải cứu của lời Ê-sai.
theological_decisions:
- issue: Sắc thái của mệnh đề Ἐὰν ᾖ trong lời tiên tri được trích dẫn
  choice: 'Nhượng bộ: “Dù số ... đông ...”'
  alternative: 'Điều kiện sát chữ: “Nếu số ... đông ...” hoặc “Cho dù số ... đông ...”'
  rationale: Trọng tâm là sự tương phản giữa số đông của Israel và phần còn sót lại được cứu. ‘Dù’ truyền đạt tự nhiên sắc thái ấy; chú thích bảo lưu cấu trúc điều kiện của tiếng Hy Lạp.
- issue: Nghĩa của σωθήσεται
  choice: “sẽ được cứu”
  alternative: “sẽ được giải cứu” hoặc “sẽ được bảo toàn”
  rationale: ‘Được cứu’ phù hợp nhất với ngữ cảnh cứu rỗi trong Rô-ma 9–11 nhưng vẫn để ngỏ âm hưởng giải cứu của lời tiên tri qua chú thích.
- issue: Phạm vi của τὸ ὑπόλειμμα
  choice: “chỉ phần còn sót lại”
  alternative: “phần còn sót lại” không có từ “chỉ”
  rationale: Mạo từ và cấu trúc tương phản xác định bộ phận còn lại; ‘chỉ’ diễn đạt rõ hàm ý giới hạn nhưng không xác định ai thuộc bộ phận ấy hay cơ chế họ được cứu.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Dùng “dân Israel” khi nói về cộng đồng, nhưng giữ cách gọi giao ước “con cái Israel” trong lời trích dẫn. Không Việt hóa tên riêng theo một truyền thống hệ phái cụ thể ngoài dạng Ê-sai đã phổ biến.
