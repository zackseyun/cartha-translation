  text: Τί οὖν ἐροῦμεν; μὴ ἀδικία παρὰ τῷ θεῷ; μὴ γένοιτο·
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/014.yaml
  text: What then shall we say? Is there injustice with God? Certainly not![a][b]
translation:
  language: vi
  text: Vậy chúng ta sẽ nói gì? Chẳng lẽ Đức Chúa Trời bất công sao?[a] Tuyệt đối không![b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “Có sự bất công nơi Đức Chúa Trời sao?” Cũng có thể dịch “Có sự bất chính nơi Đức Chúa Trời sao?”'
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn Hy Lạp: “Mong sao điều ấy đừng xảy ra!” Đây là lời phủ định hết sức mạnh mẽ; cũng có thể dịch “Hoàn toàn không!”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί οὖν ἐροῦμεν
  choice: Vậy chúng ta sẽ nói gì?
  rationale: Giữ công thức chuyển ý quen thuộc của Phao-lô và sắc thái tương lai mang tính cân nhắc, đồng thời tự nhiên trong tiếng Việt hiện đại.
- source_word: μὴ ἀδικία παρὰ τῷ θεῷ
  choice: Chẳng lẽ Đức Chúa Trời bất công sao?
  rationale: Cấu trúc «chẳng lẽ ... sao?» diễn đạt câu hỏi tu từ với câu trả lời phủ định được mong đợi. Cách chuyển thành tính từ «bất công» tự nhiên hơn trong tiếng Việt nhưng vẫn giữ ý nghĩa đạo đức–pháp lý của ἀδικία và quy điều ấy về phía Đức Chúa Trời.
- source_word: μὴ γένοιτο
  choice: Tuyệt đối không!
  rationale: Diễn đạt lời bác bỏ hết sức mạnh mẽ của Phao-lô bằng tiếng Việt hiện đại, trang trọng và rõ ràng, tránh lối dịch từng chữ kém tự nhiên.
theological_decisions:
- issue: Cách giữ nguyên lời chất vấn về sự bất công nơi Đức Chúa Trời mà không áp đặt một hệ thống thần học cụ thể lên Rô-ma 9.
  choice: Trình bày câu hỏi như một lời phản bác tu từ và giữ nguyên lời phủ định dứt khoát, không bổ sung giải thích về sự tuyển chọn, loại bỏ hay công bằng của Đức Chúa Trời.
  alternative: 'Có thể dịch sát hình thức hơn: «Có sự bất chính nơi Đức Chúa Trời chăng? Mong sao điều ấy đừng xảy ra!»'
  rationale: Bản Hy Lạp nêu lời chất vấn và bác bỏ nó một cách cô đọng. Bản dịch giữ sức căng thần học ấy mà không giải quyết thay cho văn mạch tiếp theo.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. «Đức Chúa Trời» được dùng cho θεός; cấu trúc câu hỏi tu từ và lời bác bỏ ngắn gọn giữ nhịp tranh luận của Phao-lô.
