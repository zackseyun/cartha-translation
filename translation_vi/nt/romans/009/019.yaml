id: ROM.9.19
reference: Romans 9:19
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἐρεῖς ⸂μοι οὖν⸃· Τί ⸀οὖν ἔτι μέμφεται; τῷ γὰρ βουλήματι αὐτοῦ τίς ἀνθέστηκεν;
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/019.yaml
  text: You will say to me then[a], “Why then does he still find fault? For who has resisted his purpose?”
translation:
  language: vi
  text: 'Vậy bạn sẽ nói với tôi: “Thế thì tại sao Ngài vẫn còn trách cứ? Vì ai đã chống lại ý định[a] của Ngài?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “ý muốn” hoặc “mục đích.” Từ Hy Lạp βούλημα có thể mang nghĩa ý muốn, ý định hoặc mục đích.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐρεῖς
  choice: bạn sẽ nói
  rationale: Thì tương lai được dùng theo lối tu từ để nêu lời phản đối mà Phao-lô dự liệu; “nói” sát với động từ Hy Lạp hơn “hỏi”.
- source_word: μοι
  choice: với tôi
  rationale: Diễn đạt rõ bổ ngữ gián tiếp, tự nhiên trong tiếng Việt.
- source_word: οὖν ... οὖν
  choice: Vậy ... Thế thì
  rationale: Giữ cả hai tiểu từ suy luận và nhịp lập luận nhấn mạnh của câu Hy Lạp mà vẫn tự nhiên trong tiếng Việt.
- source_word: Τί οὖν ἔτι
  choice: Thế thì tại sao ... vẫn còn
  rationale: Trong ngữ cảnh trách cứ, τί mang nghĩa “tại sao”; ἔτι được thể hiện bằng “vẫn còn”.
- source_word: μέμφεται
  choice: trách cứ
  rationale: Diễn đạt ý đổ lỗi hoặc tìm thấy lỗi một cách gọn, trang trọng và tự nhiên.
- source_word: τῷ ... βουλήματι αὐτοῦ
  choice: ý định của Ngài
  rationale: βούλημα có thể chỉ ý muốn, ý định hoặc mục đích đã định; “ý định” giữ được sắc thái chủ ý mà không áp đặt một thuật ngữ thần học hệ thống.
- source_word: τίς ἀνθέστηκεν
  choice: ai đã chống lại
  rationale: Giữ câu hỏi tu từ và thể hoàn thành của động từ, với hành động chống đối có liên hệ đến hiện tại.
theological_decisions:
- issue: Cách dịch βούλημα trong bối cảnh quyền tể trị của Đức Chúa Trời và trách nhiệm con người
  choice: ý định của Ngài
  alternative: ý muốn của Ngài; mục đích của Ngài
  rationale: “Ý định” phản ánh một chủ ý đã định nhưng không tự động giải quyết căng thẳng thần học của câu. Chú thích nêu các nghĩa hợp lệ khác để bảo tồn độ rộng nghĩa của từ Hy Lạp.
- issue: Chủ thể hàm ẩn của μέμφεται và đại từ αὐτοῦ
  choice: Ngài
  alternative: ông ấy/người ấy
  rationale: Ngữ cảnh trước đó xác định Đức Chúa Trời là chủ thể; viết hoa đại từ giúp người đọc theo dõi quy chiếu nhưng không thêm một danh xưng không có trong câu Hy Lạp.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng cặp “Vậy ... Thế thì” để giữ hai lần οὖν; “trách cứ” và “chống lại” truyền đạt trực tiếp sức nặng của lời phản đối.
