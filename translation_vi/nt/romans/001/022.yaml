  text: φάσκοντες εἶναι σοφοὶ ἐμωράνθησαν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/022.yaml
  text: Claiming to be wise[a], they became fools[b],
translation:
  language: vi
  text: Tự cho mình là khôn ngoan[a], họ đã trở nên ngu dại[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “Tuyên bố mình là khôn ngoan.”'
    reason: lexical_alternative
  - marker: b
    text: 'Hoặc: “họ đã trở thành những kẻ ngu dại”; cũng có thể hiểu: “họ đã bị làm cho ngu dại.”'
    reason: lexical_and_voice_alternative
lexical_decisions:
- source_word: φάσκοντες
  choice: Tự cho mình là
  rationale: Phân từ hiện tại diễn tả lời tự nhận hoặc sự quả quyết của họ. Cách nói này tự nhiên trong tiếng Việt hiện đại và giữ được sắc thái mỉa mai của câu.
- source_word: εἶναι
  choice: là
  rationale: Động từ nguyên mẫu bổ sung nội dung cho φάσκοντες; tiếng Việt diễn đạt tự nhiên bằng cấu trúc “cho mình là”.
- source_word: σοφοὶ
  choice: khôn ngoan
  rationale: Giữ nguyên ý đánh giá của tính từ vị ngữ và sự cô đọng trong lời của Phao-lô.
- source_word: ἐμωράνθησαν
  choice: họ đã trở nên ngu dại
  rationale: 'Dạng động từ có thể mang sắc thái bị động hoặc nội động, nhưng trong ngữ cảnh này nhấn mạnh kết quả phát sinh: họ trở thành ngu dại. “Trở nên ngu dại” vừa tự nhiên trong tiếng Việt vừa không xác định thêm tác nhân.'
theological_decisions:
- issue: Nên hiểu ἐμωράνθησαν là sự biến đổi về phẩm chất (“trở nên ngu dại”), một danh xưng mạnh (“trở thành những kẻ ngu dại”), hay một thể bị động (“bị làm cho ngu dại”).
  choice: họ đã trở nên ngu dại
  alternative: họ đã trở thành những kẻ ngu dại; họ đã bị làm cho ngu dại
  rationale: Cách dịch đã chọn giữ phép đối chọi sắc bén giữa lời tự nhận khôn ngoan và kết quả ngu dại, đồng thời bảo toàn tính không xác định về tác nhân trong tiếng Hy Lạp, không áp đặt một kết luận thần học vượt quá câu văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Tự cho mình là” chuyển tải lời tự nhận cùng sắc thái mỉa mai; “ngu dại” phù hợp văn cảnh đạo đức-thần học hơn từ khẩu ngữ “ngu”, nhưng vẫn rõ nghĩa với độc giả phổ thông.
