  rationale: Chỉ chỉnh cách diễn đạt ἐν οἷς để làm rõ nhóm người được nhắc đến và cho câu tiếng Việt trôi chảy hơn. Giữ “thuộc về” ở bản chính cùng chú thích để bảo tồn tính mơ hồ của sở hữu cách Hy Lạp.
