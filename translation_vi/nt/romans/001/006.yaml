  text: ἐν οἷς ἐστε καὶ ὑμεῖς κλητοὶ Ἰησοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/006.yaml
  text: among whom you also are[a], called of Jesus the Messiah,
translation:
  language: vi
  text: Trong số những người ấy, anh chị em cũng là những người được kêu gọi thuộc về Đức Giê-su, Đấng Mê-si[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “được Đức Giê-su, Đấng Mê-si kêu gọi”; sát chữ hơn: “những người được gọi của Đức Giê-su, Đấng Mê-si.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν οἷς
  choice: ở trong số đó
  rationale: Đại từ quan hệ số nhiều chỉ lại các dân ngoại ở câu trước; cách diễn đạt này thể hiện tự nhiên việc các tín hữu tại Rô-ma thuộc nhóm ấy.
- source_word: καὶ ὑμεῖς
  choice: anh chị em cũng
  rationale: Giữ sắc thái nhấn mạnh rằng chính người nhận thư cũng được kể vào nhóm vừa nói đến; “anh chị em” là cách xưng hô cộng đồng tự nhiên và trang trọng trong tiếng Việt hiện đại.
- source_word: κλητοὶ
  choice: những người được kêu gọi
  rationale: Diễn đạt tính từ danh hóa κλητοί mà không thu hẹp ý nghĩa thành một lời mời thông thường.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Đức Giê-su, Đấng Mê-si
  rationale: Giữ tên riêng Giê-su và chuyển Χριστός theo nghĩa tước hiệu “Đấng Mê-si”, thay vì coi đó chỉ là một phần của tên riêng.
- source_word: κλητοὶ Ἰησοῦ Χριστοῦ
  choice: những người được kêu gọi thuộc về Đức Giê-su, Đấng Mê-si
  rationale: Cách dịch này thể hiện tự nhiên quan hệ sở thuộc hoặc liên hệ trong kết cấu sở hữu cách cô đọng, đồng thời ghi nhận các khả năng khác ở chú thích.
theological_decisions:
- issue: Quan hệ sở hữu cách trong κλητοὶ Ἰησοῦ Χριστοῦ
  choice: được kêu gọi thuộc về Đức Giê-su, Đấng Mê-si
  alternative: 'được Đức Giê-su, Đấng Mê-si kêu gọi; sát chữ: những người được gọi của Đức Giê-su, Đấng Mê-si'
  rationale: Bản văn Hy Lạp không nêu rõ sở hữu cách chỉ sự thuộc về hay tác nhân. Bản chính dùng cách hiểu quan hệ thuộc về vì phù hợp ngữ cảnh và tự nhiên trong tiếng Việt, nhưng chú thích bảo tồn sự mơ hồ thật của nguyên văn.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh chị em” để chỉ cộng đồng người nhận thư; dùng tước hiệu “Đấng Mê-si” cho Χριστός và tránh bổ sung nội dung giáo phái.
