    rationale: ἐν οἷς quy chiếu về nhóm dân ngoại ở câu trước. “Trong số những người ấy” biểu đạt quy chiếu này rõ và tự nhiên hơn, không thêm nghĩa.
  revised_text: Trong số những người ấy, anh chị em cũng là những người được kêu gọi thuộc về Đức Giê-su, Đấng Mê-si[a].
