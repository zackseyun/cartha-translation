id: ROM.1.11
reference: Romans 1:11
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐπιποθῶ γὰρ ἰδεῖν ὑμᾶς, ἵνα τι μεταδῶ χάρισμα ὑμῖν πνευματικὸν εἰς τὸ στηριχθῆναι ὑμᾶς,
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/011.yaml
  text: For I long to see you[a], so that I may impart some spiritual gift to you to strengthen you[b],
translation:
  language: vi
  text: Vì tôi mong mỏi được gặp anh chị em, để chia sẻ với anh chị em một ân tứ thuộc linh nào đó[a], hầu cho anh chị em được vững mạnh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Thuộc linh” cũng có thể được hiểu là “đến từ Thánh Linh”; nguyên văn không nhất thiết nói đến một loại ân tứ siêu nhiên cụ thể.
    reason: preserved_ambiguity
lexical_decisions:
- source_word: ἐπιποθῶ
  choice: mong mỏi
  rationale: Diễn tả lòng khao khát mạnh mẽ và chân thành bằng cách nói tự nhiên, trang trọng trong tiếng Việt hiện đại.
- source_word: γὰρ
  choice: Vì
  rationale: Giữ mối liên hệ giải thích với ý ở câu trước.
- source_word: ἰδεῖν ὑμᾶς
  choice: được gặp anh chị em
  rationale: Động từ có nghĩa đen là “thấy”, nhưng trong ngữ cảnh quan hệ cá nhân, “gặp” là cách diễn đạt tự nhiên hơn trong tiếng Việt mà không thêm ý vượt quá nguyên văn.
- source_word: ἵνα
  choice: để
  rationale: Biểu thị mục đích rõ ràng và tự nhiên.
- source_word: τι
  choice: nào đó
  rationale: Giữ tính bất định của đại từ Hy Lạp, không xác định đây là một ân tứ cụ thể.
- source_word: μεταδῶ
  choice: chia sẻ
  rationale: Diễn đạt việc cho người khác cùng nhận phần, đồng thời tránh hàm ý quá mạnh rằng Phao-lô tự mình ban phát ân tứ.
- source_word: χάρισμα
  choice: ân tứ
  rationale: Giữ sắc thái một điều được ban bởi ân điển; trong ngữ cảnh này từ không nhất thiết chỉ một năng lực lạ lùng cụ thể.
- source_word: πνευματικὸν
  choice: thuộc linh
  rationale: Giữ cách diễn đạt rộng và sự không xác định của nguyên văn về việc đây là lợi ích thiêng liêng nói chung hay điều liên hệ trực tiếp đến Thánh Linh.
- source_word: εἰς τὸ στηριχθῆναι ὑμᾶς
  choice: hầu cho anh chị em được vững mạnh
  rationale: Giữ thể bị động của στηριχθῆναι và diễn đạt mục đích hoặc kết quả dự kiến mà không xác định quá mức tác nhân làm họ vững mạnh.
theological_decisions:
- issue: “Ân tứ thuộc linh” có chỉ một ân tứ siêu nhiên cụ thể hay một lợi ích thiêng liêng rộng hơn hay không
  choice: một ân tứ thuộc linh nào đó
  alternative: một ân tứ đến từ Thánh Linh; một ân huệ thiêng liêng nào đó
  rationale: Cụm từ Hy Lạp không buộc người đọc hiểu theo nghĩa kỹ thuật hẹp. Bản dịch giữ phạm vi nghĩa rộng và không đưa vào một lập trường hệ phái.
- issue: Ai là tác nhân làm các tín hữu được vững mạnh
  choice: anh chị em được vững mạnh
  alternative: để tôi làm cho anh chị em vững mạnh
  rationale: Nguyên văn dùng thể bị động, nên bản dịch không mặc nhiên xác định Phao-lô là tác nhân duy nhất; điều này cũng giữ được sự chuyển ý sang sự khích lệ lẫn nhau ở câu kế tiếp.
translation_notes:
  register: Dùng văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. “Anh chị em” truyền đạt số nhiều ὑμᾶς và phù hợp với cách xưng hô cộng đồng; “hầu cho” giữ sắc thái trang trọng vừa phải của câu thư tín. Dấu phẩy và trật tự mệnh đề theo sát tiến trình lập luận của nguyên văn.
