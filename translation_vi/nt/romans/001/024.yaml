id: ROM.1.24
reference: Romans 1:24
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸀Διὸ παρέδωκεν αὐτοὺς ὁ θεὸς ἐν ταῖς ἐπιθυμίαις τῶν καρδιῶν αὐτῶν εἰς ἀκαθαρσίαν τοῦ ἀτιμάζεσθαι τὰ σώματα αὐτῶν ἐν ⸀αὐτοῖς,
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/024.yaml
  text: Therefore God gave them over in the desires of their hearts to impurity[a], for the dishonoring of their bodies among themselves.
translation:
  language: vi
  text: Vì thế, Đức Chúa Trời đã phó mặc họ vào sự ô uế theo những ham muốn của lòng họ, dẫn đến việc thân thể họ bị làm nhục giữa chính họ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “giữa họ”; hoặc có lẽ: “trong chính họ.”'
    reason: Cụm ἐν αὐτοῖς ngắn gọn và có thể được hiểu theo sắc thái tương hỗ, chỉ phạm vi trong nhóm, hoặc phản thân.
lexical_decisions:
- source_word: Διὸ
  choice: Vì vậy
  rationale: Diễn tả kết luận phát xuất từ lập luận ngay trước đó, tự nhiên và rõ ràng trong tiếng Việt hiện đại.
- source_word: παρέδωκεν
  choice: đã phó họ cho
  rationale: Giữ ý trao một người vào quyền chi phối của một tình trạng, đồng thời bảo tồn sức nặng về hành động của Đức Chúa Trời mà không diễn giải thêm thành ‘ruồng bỏ’ hay một công thức giáo lý.
- source_word: ἐν ταῖς ἐπιθυμίαις τῶν καρδιῶν αὐτῶν
  choice: trong những ham muốn của lòng họ
  rationale: Giữ giới từ và hình ảnh ‘lòng’ của nguyên văn; cụm này chỉ phạm vi hoặc bối cảnh tác động của việc phó họ.
- source_word: ἐπιθυμίαις
  choice: những ham muốn
  rationale: Từ ngữ đủ rộng để phản ánh ἐπιθυμία, không thu hẹp trước thành dục vọng tình dục dù văn mạch tiếp theo đi theo hướng đó.
- source_word: ἀκαθαρσίαν
  choice: sự ô uế
  rationale: Diễn đạt sự không thanh sạch về luân lý bằng cách nói quen thuộc, trang trọng và dễ hiểu.
- source_word: τοῦ ἀτιμάζεσθαι
  choice: để ... bị làm nhục
  rationale: Giữ thể bị động và diễn đạt cấu trúc nguyên mẫu có mạo từ bằng một mệnh đề tiếng Việt có thể mang sắc thái mục đích hoặc kết quả, không xác quyết quá mức một phía.
- source_word: τὰ σώματα αὐτῶν
  choice: thân thể họ
  rationale: Phản ánh trực tiếp danh từ cụ thể ‘thân thể’ và giữ sự nhấn mạnh của Phao-lô về phương diện thân xác.
- source_word: ἐν αὐτοῖς
  choice: giữa họ với nhau
  rationale: Cách dịch chính thể hiện sắc thái tương hỗ/xã hội phù hợp văn mạch, trong khi chú thích giữ các khả năng cú pháp khác.
theological_decisions:
- issue: Có nên tăng cường παρέδωκεν thành một lời diễn giải như ‘ruồng bỏ họ trong sự phán xét’ hay không
  choice: đã phó họ cho
  alternative: đã ruồng bỏ họ; đã phán xét họ bằng cách phó mặc họ
  rationale: Nguyên văn khẳng định hành động Đức Chúa Trời phó họ, nhưng không tự diễn giải đầy đủ bản chất hệ thống của hành động ấy. Bản dịch giữ sức nặng thần học mà không thêm kết luận giáo phái.
- issue: Quan hệ của τοῦ ἀτιμάζεσθαι với mệnh đề chính
  choice: để thân thể họ bị làm nhục
  alternative: dẫn đến việc thân thể họ bị làm nhục; nhằm làm nhục thân thể họ
  rationale: ‘Để’ trong tiếng Việt có thể chuyển tải hướng đến kết quả mà không buộc câu chỉ mang nghĩa chủ đích; đồng thời thể bị động của nguyên văn được giữ lại.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng ‘Đức Chúa Trời’ và ‘lòng’ theo lối diễn đạt Kinh Thánh quen thuộc; tránh từ cổ và tránh giải thích giáo lý vượt quá nguyên văn.
