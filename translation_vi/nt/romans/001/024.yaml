revisions:
- from: Vì vậy, Đức Chúa Trời đã phó họ cho sự ô uế trong những ham muốn của lòng họ, để thân thể họ bị làm nhục giữa họ với nhau.[a]
  to: Vì thế, Đức Chúa Trời đã phó mặc họ vào sự ô uế theo những ham muốn của lòng họ, dẫn đến việc thân thể họ bị làm nhục giữa chính họ.[a]
  rationale: 'Bản sửa làm rõ trật tự và quan hệ của các cụm trong câu mà vẫn giữ nội dung: Đức Chúa Trời phó mặc họ vào sự ô uế trong sự vận hành của những ham muốn lòng họ; hậu quả là thân thể họ bị làm nhục. “Phó mặc” tự nhiên hơn “phó ... cho” trong ngữ cảnh này; “dẫn đến việc” phù hợp hơn với sắc thái kết quả; và chú thích tiếp tục bảo lưu tính bất định cú pháp của ἐν αὐτοῖς.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T10:24:25Z'
review_pass:
  verdict: revise
  source_fidelity: Bản nháp truyền đạt đúng mạch suy luận (Διὸ), hành động Đức Chúa Trời “phó” con người vào một tình trạng, sự ô uế, và việc thân thể bị hạ nhục. Tuy nhiên, trật tự trong câu “phó họ cho sự ô uế trong những ham muốn” dễ khiến “trong những ham muốn” bổ nghĩa cho “sự ô uế”, thay vì diễn tả phạm vi/cơ chế gắn với hành động phó mặc như trong ἐν ταῖς ἐπιθυμίαις. “Để” cũng nghiêng về mục đích hơn là hệ quả được diễn đạt bởi cấu trúc εἰς ... τοῦ + nguyên mẫu trong văn mạch này.
  naturalness: “Đã phó họ cho” và nhất là “giữa họ với nhau” chưa tự nhiên trong tiếng Việt hiện đại. “Phó mặc họ vào” rõ hơn về sắc thái giao phó/để cho rơi vào một tình trạng; “giữa chính họ” là cách nói gọn và tự nhiên cho cách hiểu tương hỗ của ἐν αὐτοῖς.
  terminology: Giữ “Đức Chúa Trời,” “ham muốn,” “lòng,” “ô uế,” và “thân thể” là phù hợp với văn phong Kinh Thánh tiếng Việt và không áp đặt diễn giải giáo phái. Không nên thay ἐν αὐτοῖς bằng “tự làm nhục” hoặc “tự thân,” vì các cách ấy loại bỏ những khả năng cú pháp khác mà chú thích cần giữ lại.
  issues:
  - severity: medium
    issue: Quan hệ của “trong những ham muốn của lòng họ” với mệnh đề chính không rõ trong bản nháp.
    rationale: Vị trí sau “sự ô uế” khiến độc giả có thể hiểu là “sự ô uế trong các ham muốn,” trong khi tiếng Hy Lạp đặt cụm ἐν ταῖς ἐπιθυμίαις... trước εἰς ἀκαθαρσίαν và gắn với hành động παρέδωκεν. Bản sửa dùng “theo những ham muốn...” để diễn đạt tự nhiên chức năng vận hành của cụm này, không thu hẹp nó riêng vào dục vọng tình dục.
  - severity: medium
    issue: “Để thân thể họ bị làm nhục” có thể gợi mục đích trực tiếp.
    rationale: Cấu trúc εἰς ἀκαθαρσίαν τοῦ ἀτιμάζεσθαι thích hợp hơn với hệ quả/đích dẫn tới trong ngữ cảnh. “Dẫn đến việc” tránh gán một mục đích đạo đức cho Đức Chúa Trời, đồng thời vẫn giữ thể bị động của ἀτιμάζεσθαι.
  - severity: low
    issue: “Giữa họ với nhau” thừa và kém tự nhiên.
    rationale: “Giữa chính họ” diễn đạt tự nhiên sắc thái tương hỗ của cách hiểu chính, còn chú thích bảo lưu các cách hiểu “giữa họ” và “trong chính họ.”
  revised_text: Vì thế, Đức Chúa Trời đã phó mặc họ vào sự ô uế theo những ham muốn của lòng họ, dẫn đến việc thân thể họ bị làm nhục giữa chính họ.[a]
