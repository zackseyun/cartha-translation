translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dấu chấm phẩy giữ các nhóm trong danh sách; cấu trúc kết thúc bằng dấu phẩy vì câu Hy Lạp tiếp tục sang câu kế tiếp. Các từ gần nghĩa được phân biệt trong mức tiếng Việt tự nhiên cho phép.
