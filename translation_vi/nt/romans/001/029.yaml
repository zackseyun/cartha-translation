    issue: “đầy lòng ganh tị, giết người...”
    rationale: Cụm “đầy lòng” đặc biệt khi đi với “giết người” có thể khiến người đọc hiểu là ý định hoặc sự thù hằn trong lòng, thay vì mục từ φόνου trong danh sách tật xấu. Dùng “đầy rẫy” tránh việc nội tâm hóa nghĩa này.
  - severity: low
    issue: “mọi thứ bất chính”
