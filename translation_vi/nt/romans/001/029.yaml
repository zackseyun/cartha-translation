  text: πεπληρωμένους πάσῃ ⸀ἀδικίᾳ πονηρίᾳ πλεονεξίᾳ κακίᾳ, μεστοὺς φθόνου φόνου ἔριδος δόλου κακοηθείας, ψιθυριστάς,
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/029.yaml
  text: filled with every kind of unrighteousness[a], evil, greed, and malice; full of envy, murder, strife, deceit, and maliciousness; whisperers[b],
translation:
  language: vi
  text: họ đầy dẫy mọi điều bất chính[a], gian ác, tham lam và hiểm độc; đầy rẫy ganh tị, giết người, tranh chấp, lừa dối và ác ý; họ là những kẻ rỉ tai nói xấu[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “đầy dẫy mọi sự bất chính”; cụm từ Hy Lạp diễn tả phạm vi bao quát.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “những kẻ ngồi lê đôi mách” hoặc “những kẻ bí mật gièm pha”.
    reason: lexical_alternative
lexical_decisions:
- source_word: πεπληρωμένους
  choice: đầy dẫy
  rationale: Diễn tả tự nhiên trạng thái đã trở nên đầy và hiện vẫn còn như vậy, phù hợp với sắc thái hoàn thành bị động của phân từ.
- source_word: πάσῃ ἀδικίᾳ
  choice: mọi thứ bất chính
  rationale: Truyền đạt phạm vi bao quát của πάσῃ với danh từ trừu tượng số ít, đồng thời giữ nghĩa đạo đức rộng của ἀδικία.
- source_word: πονηρίᾳ
  choice: gian ác
  rationale: Một cách diễn đạt hiện đại, gọn và đủ rộng cho sự xấu xa về đạo đức.
- source_word: πλεονεξίᾳ
  choice: tham lam
  rationale: Diễn đạt rõ lòng ham muốn chiếm hữu ngày càng nhiều.
- source_word: κακίᾳ
  choice: hiểm độc
  rationale: Nhấn mạnh khuynh hướng muốn gây hại cho người khác và phân biệt phần nào với πονηρία rộng hơn.
- source_word: μεστοὺς
  choice: đầy lòng
  rationale: Tự nhiên trong tiếng Việt khi liệt kê các thói xấu nội tâm, đồng thời phản ánh biến thể diễn đạt so với πεπληρωμένους.
- source_word: φθόνου
  choice: ganh tị
  rationale: Từ thông dụng và chính xác cho thái độ khó chịu trước điều tốt người khác có.
- source_word: φόνου
  choice: giết người
  rationale: Giữ sức nặng đạo đức của danh từ chỉ hành vi sát nhân trong danh sách thói xấu.
- source_word: ἔριδος
  choice: tranh chấp
  rationale: Bao quát sự bất hòa và đối đầu gây chia rẽ, với ngôn ngữ hiện đại.
- source_word: δόλου
  choice: lừa dối
  rationale: Diễn đạt rõ hành vi cố ý gian trá.
- source_word: κακοηθείας
  choice: ác ý
  rationale: Phản ánh tâm địa xấu, khuynh hướng nghĩ và hành xử tệ với người khác, nhưng không đồng nhất hoàn toàn với κακία.
- source_word: ψιθυριστάς
  choice: những kẻ rỉ tai nói xấu
  rationale: Giữ hình ảnh nói nhỏ, kín đáo của từ Hy Lạp và làm rõ nội dung là lời gièm pha sau lưng.
