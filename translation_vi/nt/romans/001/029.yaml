  verdict: revise
  source_fidelity: Bản dịch theo sát danh sách các tật xấu trong tiếng Hy Lạp và giữ đúng cấu trúc câu tiếp diễn. Tuy nhiên, “đầy lòng ... giết người” dễ chuyển nghĩa của φόνου từ hành vi bạo lực/giết người trong danh sách sang một khuynh hướng chỉ ở nội tâm. “Đầy rẫy” giữ nghĩa μεστοὺς mà không tạo sắc thái này.
  naturalness: “Mọi điều bất chính” tự nhiên và rõ hơn “mọi thứ bất chính”. “Đầy rẫy ganh tị, giết người...” là cách liệt kê tự nhiên trong tiếng Việt hiện đại.
  terminology: 'Các tương đương chính được giữ: bất chính (ἀδικία), gian ác (πονηρία), tham lam (πλεονεξία), hiểm độc (κακία), ganh tị, giết người, tranh chấp, lừa dối, ác ý, và những kẻ rỉ tai nói xấu (ψιθυριστάς). Không có vấn đề thần học hay tên riêng.'
