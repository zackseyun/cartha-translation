source:
  edition: SBLGNT
  text: τοῦτο δέ ἐστιν συμπαρακληθῆναι ἐν ὑμῖν διὰ τῆς ἐν ἀλλήλοις πίστεως ὑμῶν τε καὶ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/012.yaml
  text: that is[a], that I may be mutually encouraged among you through each other’s faith[c][b], both yours and mine.
translation:
  language: vi
  text: nghĩa là để giữa anh chị em, tôi được khích lệ cùng với anh chị em nhờ đức tin chung của chúng ta—đức tin của anh chị em và của tôi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “nghĩa là để chúng ta cùng được khích lệ giữa anh chị em, nhờ đức tin chung của chúng ta—đức tin của anh chị em và của tôi.”'
    reason: Cách diễn đạt số nhiều làm nổi bật tính cùng nhau của động từ Hy Lạp; bản chính giữ Phao-lô làm chủ thể được hiểu từ văn cảnh trước.
lexical_decisions:
- source_word: τοῦτο δέ ἐστιν
  choice: nghĩa là
  rationale: Dẫn vào lời giải thích cho ý ở câu trước một cách tự nhiên, đồng thời giữ sắc thái giải thích của nguyên ngữ.
- source_word: συμπαρακληθῆναι
  choice: để tôi được cùng anh chị em khích lệ
  rationale: Động từ nguyên mẫu thụ động có tiền tố συν- diễn tả sự khích lệ chung, có tính tương hỗ. Chủ thể ngầm là Phao-lô theo văn cảnh, nhưng hành động không chỉ diễn ra một chiều.
- source_word: ἐν ὑμῖν
  choice: khi ở giữa anh chị em
  rationale: 'Diễn đạt khung cảnh xã hội và địa điểm của sự khích lệ: giữa cộng đồng tín hữu tại Rô-ma.'
- source_word: διὰ τῆς ἐν ἀλλήλοις πίστεως
  choice: nhờ đức tin của nhau
  rationale: Giữ phương tiện được biểu thị bởi διά và tính tương hỗ của ἐν ἀλλήλοις, không giản lược thành một đức tin chung trừu tượng.
- source_word: πίστεως
  choice: đức tin
  rationale: Trong văn cảnh, πίστις chỉ lòng tin của Phao-lô và các tín hữu, chứ không chủ yếu mang nghĩa sự trung tín.
- source_word: ὑμῶν τε καὶ ἐμοῦ
  choice: cả đức tin của anh chị em lẫn của tôi
  rationale: Nói rõ danh từ được sở hữu và giữ thế cân bằng giữa đức tin của các tín hữu Rô-ma với đức tin của Phao-lô.
theological_decisions:
- issue: Sự khích lệ mang tính một chiều hay tương hỗ
  choice: Phao-lô và các tín hữu khích lệ lẫn nhau
  alternative: Phao-lô chủ yếu khích lệ các tín hữu
  rationale: Tiền tố συν- trong συμπαρακληθῆναι, cụm ἐν ἀλλήλοις và phần kết “cả của anh chị em lẫn của tôi” cùng nhấn mạnh tính tương hỗ.
- issue: Chủ thể ngầm của động từ nguyên mẫu
  choice: Giữ góc nhìn ngôi thứ nhất số ít của Phao-lô nhưng diễn đạt hành động chung
  alternative: Dùng trực tiếp chủ thể số nhiều “chúng ta”
  rationale: Nguyên mẫu Hy Lạp không tự đánh dấu số; văn cảnh trước đó hướng về Phao-lô, còn tiền tố συν- diễn tả ông cùng được khích lệ với cộng đồng. Bản dịch chính giữ cả hai nét, và chú thích nêu cách diễn đạt số nhiều.
translation_notes:
  register: Văn phong hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh chị em” để gọi cộng đồng tín hữu; dùng “khích lệ” vì phù hợp ngữ cảnh hơn “an ủi”. Dấu gạch ngang giúp phần giải thích “cả... lẫn...” rõ ràng.
