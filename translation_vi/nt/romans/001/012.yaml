revisions:
- from: nghĩa là để tôi được cùng anh chị em khích lệ khi ở giữa anh chị em, nhờ đức tin của nhau—cả đức tin của anh chị em lẫn của tôi.[a]
  to: nghĩa là để giữa anh chị em, tôi được khích lệ cùng với anh chị em nhờ đức tin chung của chúng ta—đức tin của anh chị em và của tôi.[a]
  rationale: Bản sửa làm rõ rằng Phao-lô là người được khích lệ cùng với các tín hữu, đồng thời thay cách nói dễ hiểu sai “đức tin của nhau” bằng một diễn đạt nêu rõ đức tin chung được xác định là của anh chị em và của Phao-lô. Cách này bảo tồn tính tương hỗ của câu mà không biến nó thành sự khích lệ một chiều.
