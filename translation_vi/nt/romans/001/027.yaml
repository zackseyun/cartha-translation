language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὁμοίως τε καὶ οἱ ἄρσενες ἀφέντες τὴν φυσικὴν χρῆσιν τῆς θηλείας ἐξεκαύθησαν ἐν τῇ ὀρέξει αὐτῶν εἰς ἀλλήλους, ἄρσενες ἐν ἄρσεσιν τὴν ἀσχημοσύνην κατεργαζόμενοι καὶ τὴν ἀντιμισθίαν ἣν ἔδει τῆς πλάνης αὐτῶν ἐν ⸀ἑαυτοῖς ἀπολαμβάνοντες.
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/027.yaml
  text: And likewise the males[a], having abandoned the natural use of the female, were inflamed in their desire for one another[d][c][b], males with males committing indecency and receiving in themselves the due penalty for their error.
translation:
  language: vi
  text: 'Cũng vậy, những người nam đã từ bỏ quan hệ tự nhiên với người nữ, lại bừng cháy trong dục vọng của mình đối với nhau: nam với nam làm điều ô nhục và nhận lấy trong chính mình sự báo trả thích đáng vì sự lầm lạc của mình.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “hình phạt xứng đáng”; nguyên ngữ cũng có thể được hiểu là “sự báo trả tương xứng”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄρσενες / θηλείας
  choice: những người nam / người nữ
  rationale: Giữ sự phân biệt giới tính được đánh dấu rõ trong tiếng Hy Lạp, thay vì chuyển thành cách nói thuần quan hệ như “đàn ông/đàn bà”; thêm “người” để câu tiếng Việt tự nhiên và trang trọng.
- source_word: ἀφέντες
  choice: đã từ bỏ
  rationale: Diễn đạt hành động xảy ra trước động từ chính và giữ sắc thái chủ động rời bỏ.
- source_word: φυσικὴν χρῆσιν
  choice: cách giao hợp tự nhiên
  rationale: Trong ngữ cảnh, χρῆσις chỉ việc sử dụng hay quan hệ về phương diện tính dục. “Cách giao hợp” làm rõ nghĩa theo văn cảnh mà không thêm một phạm trù hiện đại vào bản văn.
- source_word: ἐξεκαύθησαν ἐν τῇ ὀρέξει αὐτῶν
  choice: bừng cháy dục vọng
  rationale: Giữ hình ảnh lửa mạnh của động từ ἐκκαίω và sắc thái ham muốn mãnh liệt của ὄρεξις; cấu trúc chủ động tự nhiên hơn trong tiếng Việt.
- source_word: εἰς ἀλλήλους
  choice: đối với nhau
  rationale: Diễn đạt tự nhiên hướng tương hỗ của ham muốn.
- source_word: ἄρσενες ἐν ἄρσεσιν
  choice: nam với nam
  rationale: Giữ nguyên sự lặp lại có chủ ý và ngôn ngữ đánh dấu giới tính của bản Hy Lạp.
- source_word: τὴν ἀσχημοσύνην κατεργαζόμενοι
  choice: làm điều ô nhục
  rationale: Giữ sự đánh giá đạo đức của danh từ ἀσχημοσύνη nhưng không xác định hành vi chi tiết hơn bản văn.
- source_word: τὴν ἀντιμισθίαν ἣν ἔδει
  choice: sự báo trả thích đáng
  rationale: ἀντιμισθία nói đến sự đáp trả hay hậu quả tương xứng; ἣν ἔδει được thể hiện bằng “thích đáng”, không nhất thiết áp đặt sắc thái hình phạt pháp lý.
- source_word: τῆς πλάνης αὐτῶν
  choice: cho sự lầm lạc của mình
  rationale: “Lầm lạc” giữ được cả ý sai lầm lẫn đi chệch hướng của πλάνη.
- source_word: ἐν ἑαυτοῖς ἀπολαμβάνοντες
  choice: nhận lấy ngay nơi bản thân
  rationale: Giữ lực phản thân của ἑαυτοῖς và không xác định cụ thể hình thức của điều họ nhận.
theological_decisions:
- issue: Có nên làm mềm các từ chỉ giới tính sinh học thành ngôn ngữ thuần quan hệ hay không
  choice: những người nam … người nữ … nam với nam
  alternative: đàn ông … đàn bà … đàn ông với đàn ông
  rationale: Bản Hy Lạp dùng các từ ἄρσην và θῆλυ được đánh dấu theo giới tính; bản dịch giữ nét này mà không suy rộng thành một tuyên bố khác.
- issue: Có nên gọi ἀντιμισθία cụ thể là “hình phạt” hay không
  choice: sự báo trả thích đáng
  alternative: hình phạt xứng đáng
  rationale: “Báo trả” bảo tồn ý hậu quả tương xứng nhưng không quyết định quá mức rằng từ này ở đây phải mang nghĩa pháp lý-hình phạt.
- issue: Có nên nêu đích danh hành vi bằng một thuật ngữ hiện đại hay không
  choice: làm điều ô nhục
  alternative: thực hiện hành vi đồng tính
  rationale: Bản văn có sự phán định đạo đức qua ἀσχημοσύνη nhưng không dùng thuật ngữ phân loại hiện đại; bản dịch không thêm điều bản nguồn không nói.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dấu hai chấm làm rõ mệnh đề giải thích tiếp theo mà không thay đổi quan hệ cú pháp. Tránh uyển ngữ mơ hồ, đồng thời không dùng nhãn phân loại hiện đại không có trong nguyên ngữ.
