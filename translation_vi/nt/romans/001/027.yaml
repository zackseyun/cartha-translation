revisions:
- from: 'Cũng vậy, những người nam đã từ bỏ cách giao hợp tự nhiên với người nữ, lại bừng cháy dục vọng đối với nhau: nam với nam làm điều ô nhục và nhận lấy ngay nơi bản thân sự báo trả thích đáng cho sự lầm lạc của mình.[a]'
  to: 'Cũng vậy, những người nam đã từ bỏ quan hệ tự nhiên với người nữ, lại bừng cháy trong dục vọng của mình đối với nhau: nam với nam làm điều ô nhục và nhận lấy trong chính mình sự báo trả thích đáng vì sự lầm lạc của mình.[a]'
  rationale: Sửa tối thiểu để loại bỏ «ngay», một sắc thái không có trong bản Hy Lạp, và thay «cách giao hợp» bằng «quan hệ» cho tự nhiên hơn mà vẫn giữ nghĩa tính dục theo văn cảnh. Các cách diễn đạt còn lại được giữ để bảo tồn ngôn ngữ giới tính, lực đánh giá đạo đức và tính không xác định của sự báo trả trong nguyên ngữ.
