revisions:
- from: Vì dù đã biết Đức Chúa Trời, họ không tôn vinh Ngài là Đức Chúa Trời, cũng không tạ ơn Ngài; trái lại, những suy tưởng của họ trở nên hư không[a], và lòng thiếu hiểu biết của họ[b] bị tối tăm.
  to: Vì, dù đã biết Đức Chúa Trời, họ không tôn vinh Ngài như Đức Chúa Trời, cũng không tạ ơn Ngài; nhưng họ trở nên hư không trong những suy tưởng[a] của mình, và lòng không hiểu biết của họ[b] trở nên u tối.
  rationale: Bản sửa khôi phục “họ” làm chủ thể của ἐματαιώθησαν, đặt chú thích từ vựng đúng sau cụm dịch διαλογισμοῖς, và dùng lối diễn đạt Việt tự nhiên hơn cho ἐσκοτίσθη. Không bổ sung tác nhân cho các động từ bị động và không áp đặt diễn giải thần học.
  reviewer_model: gpt-5.6-terra
