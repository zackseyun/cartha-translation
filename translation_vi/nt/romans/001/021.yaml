id: ROM.1.21
reference: Romans 1:21
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: διότι γνόντες τὸν θεὸν οὐχ ὡς θεὸν ἐδόξασαν ἢ ηὐχαρίστησαν, ἀλλὰ ἐματαιώθησαν ἐν τοῖς διαλογισμοῖς αὐτῶν καὶ ἐσκοτίσθη ἡ ἀσύνετος αὐτῶν καρδία·
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/021.yaml
  text: For although they knew God[a], they did not glorify him as God or give thanks, but they became futile in their thinking[b], and their senseless heart was darkened.
translation:
  language: vi
  text: Vì, dù đã biết Đức Chúa Trời, họ không tôn vinh Ngài như Đức Chúa Trời, cũng không tạ ơn Ngài; nhưng họ trở nên hư không trong những suy tưởng[a] của mình, và lòng không hiểu biết của họ[b] trở nên u tối.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “những lý luận,” “những ý nghĩ,” hoặc “những suy đoán.”'
    reason: lexical_alternative
  - marker: b
    text: Trong tiếng Hy Lạp, “lòng” ở số ít và được dùng theo nghĩa tập thể.
    reason: lexical_alternative
lexical_decisions:
- source_word: διότι
  choice: Vì
  rationale: Mở đầu lời giải thích cho ý trước đó và giữ rõ mối liên hệ lập luận.
- source_word: γνόντες τὸν θεὸν
  choice: dù đã biết Đức Chúa Trời
  rationale: Diễn đạt phân từ aorist theo sắc thái nhượng bộ trong ngữ cảnh, đồng thời không xác định thêm bản chất hay mức độ của sự nhận biết.
- source_word: οὐχ ὡς θεὸν ἐδόξασαν
  choice: họ không tôn vinh Ngài là Đức Chúa Trời
  rationale: Giữ ý rằng họ không dành cho Đức Chúa Trời sự tôn vinh tương xứng với chính địa vị Đức Chúa Trời của Ngài.
- source_word: ἢ ηὐχαρίστησαν
  choice: cũng không tạ ơn Ngài
  rationale: Cách nói tự nhiên trong tiếng Việt; đại từ tân ngữ được bổ sung theo đối tượng đã nêu rõ trong mệnh đề trước.
- source_word: ἐματαιώθησαν
  choice: trở nên hư không
  rationale: Giữ sắc thái trở thành vô ích, trống rỗng của động từ bị động mà không áp đặt một tác nhân không được nêu trong câu.
- source_word: ἐν τοῖς διαλογισμοῖς αὐτῶν
  choice: những suy tưởng của họ
  rationale: Bao quát phạm vi nghĩa của διαλογισμοί gồm suy nghĩ, lý luận và suy đoán, với lối diễn đạt trang trọng nhưng dễ hiểu.
- source_word: ἐσκοτίσθη
  choice: bị tối tăm
  rationale: Bảo toàn thể bị động và hình ảnh bóng tối thuộc bình diện nhận thức–đạo đức.
- source_word: ἡ ἀσύνετος αὐτῶν καρδία
  choice: lòng thiếu hiểu biết của họ
  rationale: ἀσύνετος nói đến sự thiếu nhận thức hoặc phân discernment, không đơn thuần là trí thông minh thấp; καρδία được dịch theo nghĩa con người nội tâm.
theological_decisions:
- issue: Sắc thái nhượng bộ của γνόντες
  choice: dù đã biết Đức Chúa Trời
  alternative: sau khi biết Đức Chúa Trời; khi biết Đức Chúa Trời
  rationale: Ngữ cảnh nhấn mạnh sự tương phản giữa việc nhận biết Đức Chúa Trời và việc không đáp ứng cách thích đáng; bản dịch giữ sự căng thẳng này mà không giải thích thêm theo một hệ thần học.
- issue: Tác nhân của ἐματαιώθησαν và ἐσκοτίσθη
  choice: không nêu tác nhân
  alternative: Đức Chúa Trời khiến họ trở nên hư không và làm lòng họ tối tăm; họ tự trở nên hư không
  rationale: Nguyên văn dùng thể bị động nhưng không nêu tác nhân; không bổ sung tác nhân giúp bảo toàn tính mơ hồ thật sự của câu.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “Đức Chúa Trời” và đại từ kính trọng “Ngài”; giữ cấu trúc đối lập của câu Hy Lạp và tránh giải nghĩa quá mức.
