  text: δι’ οὗ ἐλάβομεν χάριν καὶ ἀποστολὴν εἰς ὑπακοὴν πίστεως ἐν πᾶσιν τοῖς ἔθνεσιν ὑπὲρ τοῦ ὀνόματος αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/005.yaml
  text: Through whom we received grace and apostleship for the obedience of faith among all the nations for the sake of his name[b][a],
translation:
  language: vi
  text: Nhờ Đấng ấy, chúng tôi đã nhận được ân điển và chức vụ sứ đồ, nhằm hướng đến sự vâng phục của đức tin[a] giữa mọi dân tộc[b], vì danh Ngài.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “sự vâng phục phát sinh từ đức tin” hoặc “sự vâng phục chính là đức tin.”'
    reason: alternative_reading
  - marker: b
    text: 'Cũng có thể dịch: “giữa mọi dân ngoại.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: δι’ οὗ
  choice: Nhờ Đấng ấy
  rationale: διά với sở hữu cách diễn tả phương tiện hoặc trung gian. Cách dịch này nối tự nhiên với Chúa Giê-su Christ ở câu trước và giữ đại từ quan hệ ở sắc thái tôn kính.
- source_word: ἐλάβομεν
  choice: chúng tôi đã nhận được
  rationale: Giữ nguyên ngôi thứ nhất số nhiều của động từ Hy Lạp, không tự ý giải thích đây là số nhiều tu từ hay đại diện.
- source_word: χάριν καὶ ἀποστολήν
  choice: ân điển và chức vụ sứ đồ
  rationale: Giữ hai danh từ được liên kết bằng καί. “Chức vụ sứ đồ” tự nhiên hơn “sứ đồ chức” trong tiếng Việt và diễn đạt vai trò được sai phái.
- source_word: εἰς ὑπακοὴν πίστεως
  choice: nhằm đem ... đến sự vâng phục của đức tin
  rationale: εἰς chỉ mục đích hoặc kết quả hướng đến; “sự vâng phục của đức tin” giữ tính cô đọng và sự mơ hồ thật của cấu trúc sở hữu cách.
- source_word: ἐν πᾶσιν τοῖς ἔθνεσιν
  choice: mọi dân tộc
  rationale: ἔθνη có thể chỉ các dân tộc nói chung hoặc dân ngoại. Bản chính dùng nghĩa rộng, còn nghĩa “dân ngoại” được ghi ở chú thích.
- source_word: ὑπὲρ τοῦ ὀνόματος αὐτοῦ
  choice: vì danh Ngài
  rationale: ὑπέρ ở đây diễn tả mục đích, lợi ích hoặc động cơ. Cách nói ngắn gọn này tự nhiên trong tiếng Việt và giữ sức nặng Kinh Thánh của “danh”.
theological_decisions:
- issue: Ý nghĩa của ὑπακοὴν πίστεως
  choice: sự vâng phục của đức tin
  alternative: sự vâng phục phát sinh từ đức tin; sự vâng phục chính là đức tin
  rationale: Cấu trúc sở hữu cách có thể chỉ nguồn gốc, đặc tính hoặc sự đồng nhất. Bản chính không chọn dứt khoát một cách giải thích thần học, còn các khả năng chính được nêu trong chú thích.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “ân điển,” “đức tin,” “sứ đồ” là các thuật ngữ Kinh Thánh quen thuộc; đại từ “Ngài” thể hiện sắc thái tôn kính. Các dấu chú thích đều xuất hiện trong bản văn chính.
