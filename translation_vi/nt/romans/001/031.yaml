  text: senseless[a], faithless, heartless[b], merciless.
translation:
  language: vi
  text: thiếu hiểu biết, không giữ cam kết[a], không có tình yêu thương tự nhiên[b], không thương xót.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “không đáng tin” hoặc “bội ước”.
    reason: lexical_alternative
  - marker: b
    text: Cụm từ này đặc biệt chỉ sự thiếu tình yêu thương tự nhiên giữa những người trong gia đình.
    reason: cultural_note
lexical_decisions:
- source_word: ἀσυνέτους
  choice: không hiểu biết
  rationale: Diễn đạt sự thiếu hiểu biết và nhận thức đúng về mặt đạo đức, chứ không đơn thuần chỉ trí thông minh thấp.
- source_word: ἀσυνθέτους
  choice: không giữ lời
  rationale: Từ này chỉ người không tuân giữ điều đã thỏa thuận hoặc cam kết; cách dịch này tự nhiên, rõ nghĩa trong tiếng Việt hiện đại.
- source_word: ἀστόργους
  choice: không có tình thân
  rationale: Từ Hy Lạp phủ định tình yêu thương tự nhiên, nhất là tình cảm giữa những người trong gia đình; cách dịch này giữ được sắc thái gia đình vốn có.
- source_word: ἀνελεήμονας
  choice: không thương xót
  rationale: Truyền đạt trực tiếp tình trạng thiếu lòng thương xót hoặc trắc ẩn, đồng thời phù hợp nhịp liệt kê của câu.
theological_decisions:
- issue: Phạm vi nghĩa của ἀσυνθέτους
  choice: không giữ lời
  alternative: bất tín; phá vỡ giao ước
  rationale: Không giới hạn từ này vào một giao ước thần học cụ thể khi ngữ cảnh trực tiếp chỉ nêu danh sách các thói xấu; chú thích bảo lưu các sắc thái đáng chú ý.
translation_notes:
  register: Văn phong ngắn gọn, trang trọng và dễ hiểu, giữ cấu trúc liệt kê dồn dập của nguyên văn. Các vế đều dùng dạng phủ định song song; “tình thân” làm rõ sắc thái gia đình của ἀστόργους.
