  to: Tôi luôn khẩn xin trong các lời cầu nguyện của mình rằng biết đâu, cuối cùng, theo ý muốn của Đức Chúa Trời, tôi có thể được thuận lợi[a] để đến với anh chị em.
  rationale: Bản sửa chuyển “sẽ” thành “có thể” để giữ đúng sắc thái bất định của lời cầu xin sau εἴ πως, đặt “luôn” ở vị trí tự nhiên hơn, và neo chú thích ngay sau từ ngữ dịch εὐοδωθήσομαι. “Được thuận lợi” duy trì phần nào sắc thái bị động của động từ Hy Lạp, còn chú thích nêu các cách hiểu khả dĩ về việc được mở đường hay có chuyến đi thuận lợi.
