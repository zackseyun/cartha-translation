  text: πάντοτε ἐπὶ τῶν προσευχῶν μου, δεόμενος εἴ πως ἤδη ποτὲ εὐοδωθήσομαι ἐν τῷ θελήματι τοῦ θεοῦ ἐλθεῖν πρὸς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/010.yaml
  text: always in my prayers[a], asking whether somehow, at last, by the will of God I may succeed in coming to you.
translation:
  language: vi
  text: Tôi luôn khẩn xin trong các lời cầu nguyện của mình rằng biết đâu, cuối cùng, theo ý muốn của Đức Chúa Trời, tôi có thể được thuận lợi[a] để đến với anh chị em.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “tôi có thể được mở đường thuận lợi” hoặc “tôi có thể có một chuyến đi thuận lợi” để đến với anh chị em.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντοτε ἐπὶ τῶν προσευχῶν μου
  choice: trong mọi lời cầu nguyện của tôi, tôi luôn
  rationale: Cách diễn đạt này giữ sự nhấn mạnh của πάντοτε về thói quen liên tục, đồng thời chuyển cụm giới từ sang tiếng Việt tự nhiên.
- source_word: δεόμενος
  choice: khẩn xin
  rationale: Động từ phân từ diễn tả lời cầu xin tha thiết; “khẩn xin” rõ hơn “xin” nhưng không quá cường điệu.
- source_word: εἴ πως
  choice: rằng biết đâu
  rationale: Giữ cả niềm mong mỏi lẫn tính chưa chắc chắn của lời thỉnh cầu.
- source_word: ἤδη ποτὲ
  choice: cuối cùng
  rationale: Diễn tả hy vọng đã kéo dài rằng nay rốt cuộc cơ hội có thể đến, mà không làm câu tiếng Việt nặng nề.
- source_word: εὐοδωθήσομαι
  choice: tôi sẽ được thuận lợi
  rationale: Giữ sắc thái thể bị động và ý được mở đường hoặc đạt kết quả thuận lợi, tránh nghĩa tài chính dễ liên tưởng từ “thịnh vượng”.
- source_word: ἐν τῷ θελήματι τοῦ θεοῦ
  choice: theo ý muốn của Đức Chúa Trời
  rationale: Diễn tả ý muốn của Đức Chúa Trời là điều chi phối chuyến đi, bằng cách nói tự nhiên trong tiếng Việt.
- source_word: ἐλθεῖν πρὸς ὑμᾶς
  choice: đến với anh chị em
  rationale: Bám sát động từ “đến” mà không thêm hàm ý của “thăm”; “anh chị em” phù hợp cách xưng hô cộng đồng trong thư tín và dễ hiểu hiện nay.
theological_decisions:
- issue: Quan hệ giữa ý muốn của Đức Chúa Trời và việc chuyến đi thành công
  choice: theo ý muốn của Đức Chúa Trời, tôi sẽ được thuận lợi
  alternative: nhờ ý muốn của Đức Chúa Trời, tôi sẽ thành công
  rationale: Bản dịch giữ ý muốn của Đức Chúa Trời như khuôn khổ hoặc điều kiện chi phối, không khẳng định một cơ chế thần học cụ thể; thể bị động cũng bảo tồn khả năng hàm ý Đức Chúa Trời mở đường.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu giữ cấu trúc của một lời cầu xin liên tục, đồng thời tránh cách nói cổ hoặc hàm ý rằng sự “thịnh vượng” ở đây liên quan đến tiền bạc.
