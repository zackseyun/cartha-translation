revisions:
- from: 'Gửi đến tất cả những người ở Rô-ma, là những người được Đức Chúa Trời yêu thương và được gọi là những người thánh[a]: Nguyện ân điển và bình an đến với anh chị em từ Đức Chúa Trời, Cha chúng ta, và từ Chúa Giê-xu, Đấng Mê-si-a[b].'
  to: 'Gửi đến tất cả những người ở Rô-ma, được Đức Chúa Trời yêu thương và được gọi là dân thánh[a]: Nguyện ân điển và bình an đến với anh chị em từ Đức Chúa Trời, Cha chúng ta, và Chúa Giê-xu, Đấng Mê-si-a[b].'
  rationale: Sửa duy nhất cách diễn đạt κλητοῖς ἁγίοις để câu tiếng Việt bớt lặp, tự nhiên hơn, và vẫn giữ cấu trúc mô tả căn tính của nguyên văn thay vì diễn giải thành một tiến trình phải đạt tới. Các phần còn lại trung thành với nguyên văn và phù hợp văn phong hiện đại, trang trọng.
