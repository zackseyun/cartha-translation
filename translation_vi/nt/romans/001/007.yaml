    rationale: κλητοῖς ἁγίοις gồm hai tính từ mô tả những người nhận như những người được gọi và thánh. “Được gọi là dân thánh” giữ ý mô tả này, đồng thời diễn đạt ἅγιοι theo cách tập thể, tự nhiên hơn trong tiếng Việt.
  - severity: low
    issue: Cấu trúc “là những người ... và được gọi là những người ...” lặp từ và làm câu nặng.
    rationale: Bỏ “là những người” không làm mất quan hệ bổ nghĩa của hai tính từ Hy Lạp đối với “tất cả những người ở Rô-ma”.
