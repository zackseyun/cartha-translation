id: ROM.1.7
reference: Romans 1:7
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: πᾶσιν τοῖς οὖσιν ἐν Ῥώμῃ ἀγαπητοῖς θεοῦ, κλητοῖς ἁγίοις· χάρις ὑμῖν καὶ εἰρήνη ἀπὸ θεοῦ πατρὸς ἡμῶν καὶ κυρίου Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/007.yaml
  text: 'To all those in Rome who are beloved by God and called to be saints: Grace to you and peace from God our Father and the Lord Jesus the Messiah[a][b][c].'
translation:
  language: vi
  text: 'Gửi đến tất cả những người ở Rô-ma, được Đức Chúa Trời yêu thương và được gọi là dân thánh[a]: Nguyện ân điển và bình an đến với anh chị em từ Đức Chúa Trời, Cha chúng ta, và Chúa Giê-xu, Đấng Mê-si-a[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “được gọi là thánh”; theo cách dịch truyền thống: “được gọi để làm thánh đồ.”'
    reason: lexical_alternative
  - marker: b
    text: Hay “Đấng Christ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶσιν τοῖς οὖσιν ἐν Ῥώμῃ
  choice: Gửi đến tất cả những người ở Rô-ma
  rationale: Diễn đạt tự nhiên chức năng của cụm tặng cách trong lời đề gửi, đồng thời giữ ý toàn thể và địa điểm.
- source_word: ἀγαπητοῖς θεοῦ
  choice: là những người được Đức Chúa Trời yêu thương
  rationale: Giữ sắc thái tính từ chỉ căn tính của người nhận, đồng thời rõ ràng và tự nhiên trong tiếng Việt hiện đại.
- source_word: κλητοῖς ἁγίοις
  choice: được gọi là những người thánh
  rationale: Phản ánh hai tính từ Hy Lạp mà không thêm ý 'được gọi để trở nên'; 'những người thánh' giữ nghĩa căn bản của ἅγιοι và tránh để 'thánh' bị hiểu như danh hiệu phong thánh.
- source_word: χάρις
  choice: ân điển
  rationale: Thuật ngữ quen thuộc, trang trọng, giữ được chiều sâu thần học và chức năng lời chào của Phao-lô.
- source_word: εἰρήνη
  choice: bình an
  rationale: Tương đương tự nhiên trong ngôn ngữ Kinh Thánh tiếng Việt, bao hàm cả lời chúc và ý nghĩa thần học.
- source_word: θεοῦ πατρὸς ἡμῶν
  choice: Đức Chúa Trời, Cha chúng ta
  rationale: Dấu phẩy làm rõ 'Cha chúng ta' đồng vị với 'Đức Chúa Trời' và tạo câu tiếng Việt tự nhiên.
- source_word: κυρίου
  choice: Chúa
  rationale: Cách dịch chuẩn, tự nhiên, giữ sức nặng tôn xưng của κύριος.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Giê-xu, Đấng Mê-si-a
  rationale: Dịch Χριστός theo nghĩa tước hiệu 'Đấng Mê-si-a' thay vì chỉ phiên âm; dấu phẩy giúp người đọc nhận ra đây là tước hiệu của Giê-xu.
theological_decisions:
- issue: Cách hiểu κλητοῖς ἁγίοις
  choice: được gọi là những người thánh
  alternative: được gọi để làm thánh đồ
  rationale: Nguyên văn không có động từ nguyên mẫu tương đương với 'để làm/trở nên'. Bản dịch giữ cấu trúc mô tả căn tính mà không quyết định thay văn bản rằng đây là mục tiêu tương lai của sự kêu gọi.
- issue: Cách dịch Χριστοῦ
  choice: Đấng Mê-si-a
  alternative: Đấng Christ
  rationale: Χριστός ở đây mang tước hiệu và tương ứng với 'Đấng được xức dầu'; 'Đấng Mê-si-a' truyền đạt chức năng tước hiệu rõ hơn cho độc giả hiện đại, còn phương án truyền thống được ghi chú.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh chị em” cho đại từ số nhiều ὑμῖν nhằm nói trực tiếp với toàn thể cộng đồng mà không mặc định chỉ nam giới; giữ “Rô-ma”, “Giê-xu”, “Đức Chúa Trời” theo lối gọi quen thuộc trong tiếng Việt Cơ Đốc.
