id: ROM.1.13
reference: Romans 1:13
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οὐ θέλω δὲ ὑμᾶς ἀγνοεῖν, ἀδελφοί, ὅτι πολλάκις προεθέμην ἐλθεῖν πρὸς ὑμᾶς, καὶ ἐκωλύθην ἄχρι τοῦ δεῦρο, ἵνα τινὰ καρπὸν σχῶ καὶ ἐν ὑμῖν καθὼς καὶ ἐν τοῖς λοιποῖς ἔθνεσιν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/013.yaml
  text: I do not want you to be unaware[a], brothers, that I have often planned to come to you—but have been prevented until now—so that I might have some fruit among you also[c][b], just as among the rest of the Gentiles.
translation:
  language: vi
  text: Thưa anh chị em[a], tôi không muốn anh chị em không biết rằng nhiều lần tôi đã định đến với anh chị em, nhưng cho đến nay vẫn bị ngăn trở, để tôi cũng có được một ít kết quả[b] giữa anh chị em, như giữa các dân ngoại còn lại[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn dùng danh từ số nhiều giống đực “anh em”, nhưng trong ngữ cảnh có thể bao gồm cả nam lẫn nữ.
    reason: lexical_alternative
  - marker: b
    text: Nguyên văn dùng hình ảnh “hoa trái”; đây là cách nói về kết quả từ công việc phục vụ của Phao-lô.
    reason: metaphor_note
  - marker: c
    text: Cũng có thể dịch là “các dân tộc còn lại.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ θέλω δὲ ὑμᾶς ἀγνοεῖν
  choice: tôi không muốn anh chị em không biết
  rationale: Giữ cấu trúc phủ định của công thức Phao-lô dùng, đồng thời diễn đạt tự nhiên trong tiếng Việt; δὲ được thể hiện qua mạch chuyển ý thay vì thêm một từ nối nặng nề.
- source_word: ἀδελφοί
  choice: anh chị em
  rationale: Dạng Hy Lạp là số nhiều giống đực nhưng trong lời xưng hô với cả cộng đồng có thể bao gồm tín hữu nam và nữ; “anh chị em” là cách gọi tự nhiên, trang trọng trong tiếng Việt.
- source_word: πολλάκις προεθέμην ἐλθεῖν πρὸς ὑμᾶς
  choice: nhiều lần tôi đã định đến thăm anh chị em
  rationale: “Đã định” truyền đạt ý định được lập đi lập lại; thêm “thăm” làm rõ sắc thái đến với cộng đồng mà không thay đổi nội dung.
- source_word: ἐκωλύθην ἄχρι τοῦ δεῦρο
  choice: cho đến nay vẫn bị ngăn trở
  rationale: Giữ thể bị động và diễn đạt sự cản trở kéo dài đến hiện tại, nhưng không xác định tác nhân vì nguyên văn không nêu.
- source_word: ἵνα τινὰ καρπὸν σχῶ
  choice: để tôi cũng có được chút kết quả
  rationale: καρπός theo nghĩa đen là “trái”; ở đây là ẩn dụ về thành quả từ công việc phục vụ. Bản chính dùng nghĩa ngữ cảnh dễ hiểu và ghi lại hình ảnh nguyên văn trong chú thích.
- source_word: ἐν ὑμῖν
  choice: giữa anh chị em
  rationale: Diễn đạt tự nhiên ý kết quả phát sinh trong phạm vi cộng đồng tín hữu tại Rô-ma.
- source_word: ἐν τοῖς λοιποῖς ἔθνεσιν
  choice: giữa những dân ngoại khác
  rationale: Trong ngữ cảnh sứ vụ của Phao-lô, ἔθνη chỉ các dân không phải Do Thái; λοιποί cho thấy người Rô-ma được đặt trong phạm vi rộng hơn ấy.
theological_decisions:
- issue: Phạm vi của ἀδελφοί
  choice: anh chị em
  alternative: các anh em
  rationale: Lời xưng hô hướng đến toàn thể cộng đồng tín hữu, vì vậy chọn cách diễn đạt bao hàm tự nhiên trong tiếng Việt nhưng chú thích dạng từ nguyên.
- issue: Ý nghĩa của καρπός
  choice: kết quả
  alternative: trái / hoa trái
  rationale: Ngữ cảnh nói về kết quả trong sứ vụ của Phao-lô, nhưng không xác định cụ thể đó là người cải đạo, sự gây dựng tín hữu hay sự hỗ trợ; bản dịch không thu hẹp ý nghĩa hơn nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh chị em” nhất quán cho đối tượng số nhiều; giữ thể bị động ở chỗ nguyên văn không nêu tác nhân gây cản trở; tránh thêm từ “nay” ở đầu câu vì nguyên văn không có trạng từ thời gian tại đó.
