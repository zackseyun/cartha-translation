  source_fidelity: 'Bản dịch truyền đạt đúng mạch chính: Phao-lô nhiều lần dự định đến, đã bị ngăn trở cho đến hiện tại, và mong có ‘kết quả’ nơi người nhận như nơi các dân ngoại còn lại. Tuy nhiên, “đến thăm” thêm sắc thái thăm viếng không được diễn đạt riêng trong πρὸς ὑμᾶς, và “khác” chưa phản ánh rõ sắc thái ‘còn lại’ của λοιποί.'
