  terminology: “Anh chị em” phù hợp với cách xưng hô bao hàm trong ngữ cảnh cộng đồng, với chú thích về dạng giống đực số nhiều của ἀδελφοί. “Kết quả” giữ nghĩa ẩn dụ mở của καρπός, không áp đặt cách hiểu cụ thể. “Dân ngoại” phù hợp ngữ cảnh Phao-lô dùng ἔθνη.
