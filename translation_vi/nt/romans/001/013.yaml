  to: Thưa anh chị em[a], tôi không muốn anh chị em không biết rằng nhiều lần tôi đã định đến với anh chị em, nhưng cho đến nay vẫn bị ngăn trở, để tôi cũng có được một ít kết quả[b] giữa anh chị em, như giữa các dân ngoại còn lại[c].
