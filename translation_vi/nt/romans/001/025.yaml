id: ROM.1.25
reference: Romans 1:25
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οἵτινες μετήλλαξαν τὴν ἀλήθειαν τοῦ θεοῦ ἐν τῷ ψεύδει, καὶ ἐσεβάσθησαν καὶ ἐλάτρευσαν τῇ κτίσει παρὰ τὸν κτίσαντα, ὅς ἐστιν εὐλογητὸς εἰς τοὺς αἰῶνας· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/025.yaml
  text: who exchanged the truth of God for the lie, and revered and served the creation rather than the Creator, who is blessed forever. Amen.
translation:
  language: vi
  text: Họ đã đổi chân lý của Đức Chúa Trời lấy sự giả dối, tôn kính và phụng sự tạo vật thay vì Đấng Tạo Hóa, là Đấng đáng chúc tụng đời đời. A-men.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μετήλλαξαν
  choice: đã đổi ... lấy
  rationale: Diễn đạt tự nhiên trong tiếng Việt ý trao đổi, thay thế điều này bằng điều kia.
- source_word: τὴν ἀλήθειαν τοῦ θεοῦ
  choice: chân lý của Đức Chúa Trời
  rationale: Giữ nguyên khả năng hiểu là chân lý thuộc về Đức Chúa Trời hoặc chân lý về Ngài, không tự ý thu hẹp nghĩa.
- source_word: ἐν τῷ ψεύδει
  choice: lấy sự giả dối
  rationale: Mạo từ Hy Lạp có thể được hiểu theo nghĩa xác định hoặc khái quát; 'sự giả dối' giữ cách diễn đạt tự nhiên mà không áp đặt một đối tượng cụ thể.
- source_word: ἐσεβάσθησαν
  choice: tôn kính
  rationale: Phản ánh sắc thái kính sợ, sùng kính của động từ mà không đồng nhất hoàn toàn với động từ 'phụng sự' theo sau.
- source_word: ἐλάτρευσαν
  choice: phụng sự
  rationale: Truyền đạt hành vi phục vụ mang tính tôn giáo, đồng thời giữ sự phân biệt với 'tôn kính'.
- source_word: τῇ κτίσει
  choice: tạo vật
  rationale: Trong thế đối lập với 'Đấng Tạo Hóa', từ này chỉ những gì được tạo dựng; 'tạo vật' gọn và rõ.
- source_word: παρὰ τὸν κτίσαντα
  choice: thay vì Đấng Tạo Hóa
  rationale: παρά trong cấu trúc đối chiếu ở đây mang nghĩa ưu tiên tạo vật hơn, tức thay thế Đấng dựng nên bằng tạo vật.
- source_word: εὐλογητὸς εἰς τοὺς αἰῶνας
  choice: đáng chúc tụng đời đời
  rationale: Công thức tôn vinh được chuyển sang lối nói trang trọng, tự nhiên và quen thuộc trong tiếng Việt.
theological_decisions:
- issue: Đối tượng của hai hành động ἐσεβάσθησαν và ἐλάτρευσαν
  choice: Cả 'tôn kính' và 'phụng sự' đều hướng đến tạo vật
  alternative: Hiểu một trong hai động từ theo nghĩa rộng hoặc dịch cả hai là 'thờ phượng'
  rationale: Cấu trúc Hy Lạp phối hợp hai động từ cùng với bổ ngữ ở dữ cách; giữ hai sắc thái khác nhau tránh làm mất tính song đôi của nguyên văn.
- issue: Quan hệ giữa tạo vật và Đấng Tạo Hóa trong παρά
  choice: thay vì Đấng Tạo Hóa
  alternative: hơn Đấng Tạo Hóa
  rationale: Ngữ cảnh nói về sự hoán đổi trong thờ kính; 'thay vì' diễn tả rõ sự chuyển đối tượng mà không hàm ý họ vẫn phụng sự cả hai nhưng ở mức độ khác nhau.
- issue: Mệnh đề ὅς ἐστιν εὐλογητὸς
  choice: quy chiếu về Đấng Tạo Hóa
  alternative: quy chiếu xa hơn hoặc xem như lời tôn vinh độc lập
  rationale: Đại từ giống đực số ít liên hệ trực tiếp với 'Đấng đã tạo dựng'; bản dịch giữ quan hệ ngữ pháp này.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng 'Đức Chúa Trời' và 'Đấng Tạo Hóa' theo cách gọi phổ thông trong văn bản Kinh Thánh tiếng Việt; giữ 'A-men' là lời xác nhận phụng vụ quen thuộc.
