id: ROM.1.20
reference: Romans 1:20
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: τὰ γὰρ ἀόρατα αὐτοῦ ἀπὸ κτίσεως κόσμου τοῖς ποιήμασιν νοούμενα καθορᾶται, ἥ τε ἀΐδιος αὐτοῦ δύναμις καὶ θειότης, εἰς τὸ εἶναι αὐτοὺς ἀναπολογήτους,
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/020.yaml
  text: For his invisible attributes[a], that is, his eternal power and divinity, have been clearly seen since the creation of the world, being understood through what has been made[b], so that they are without excuse.
translation:
  language: vi
  text: Thật vậy, từ khi thế giới được tạo dựng, nhờ suy xét những gì đã được tạo nên, người ta nhận thấy rõ những điều không thấy được về Ngài[a]—tức là quyền năng đời đời và thần tính[b] của Ngài—đến nỗi họ không thể bào chữa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “những phẩm tính vô hình của Ngài.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “bản tính thần linh.” Từ Hy Lạp ở đây là θειότης, không phải từ mạnh hơn là θεότης.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ ἀόρατα αὐτοῦ
  choice: những điều không thấy được về Ngài
  rationale: 'Giữ phạm vi rộng của dạng trung tính số nhiều: những thực tại hay phẩm tính vô hình thuộc về Đức Chúa Trời, không thu hẹp thành các vật vô hình.'
- source_word: ἀπὸ κτίσεως κόσμου
  choice: từ khi thế giới được tạo dựng
  rationale: 'Diễn đạt tự nhiên ý nghĩa thời gian của ἀπό: sự nhận biết này đã có từ thời điểm thế giới được tạo dựng.'
- source_word: τοῖς ποιήμασιν
  choice: qua những gì đã được tạo nên
  rationale: 'Dịch cách tặng theo nghĩa phương tiện và giữ sắc thái thụ động của danh từ: các tạo vật là phương tiện giúp con người nhận biết.'
- source_word: νοούμενα
  choice: vì người ta nhận biết những điều ấy
  rationale: Thể hiện khía cạnh nhận thức bằng trí óc của phân từ, đồng thời chuyển cấu trúc sang tiếng Việt tự nhiên mà không đồng nhất việc nhận biết với thị giác thể lý.
- source_word: καθορᾶται
  choice: đã được thấy rõ
  rationale: Giữ cường độ của động từ là “thấy rõ”; dạng hoàn thành trong tiếng Việt kết hợp với “từ khi” diễn tả thực tại bắt đầu từ thuở tạo dựng và vẫn còn hiệu lực.
- source_word: ἥ τε ἀΐδιος αὐτοῦ δύναμις
  choice: tức là quyền năng đời đời ... của Ngài
  rationale: Cụm này đồng vị và giải thích “những điều không thấy được”; “đời đời” diễn đạt ἀΐδιος một cách trang trọng, quen thuộc.
- source_word: θειότης
  choice: thần tính
  rationale: “Thần tính” chỉ phẩm chất hay bản tính thuộc về thần linh, tránh làm mạnh hơn từ Hy Lạp này như thể đó là θεότης.
- source_word: εἰς τὸ εἶναι αὐτοὺς ἀναπολογήτους
  choice: Vì thế, họ không thể bào chữa
  rationale: Diễn đạt kết quả của sự mặc khải qua tạo vật bằng tiếng Việt rõ ràng, không thêm nội dung về bản chất của lời bào chữa.
theological_decisions:
- issue: Cách dịch θειότης mà không làm mạnh hơn lời của Phao-lô
  choice: thần tính
  alternative: bản tính thần linh; thần vị
  rationale: “Thần tính” khẳng định tạo vật thật sự bày tỏ điều thuộc về Đức Chúa Trời, nhưng vẫn bảo toàn khác biệt từ vựng giữa θειότης và từ mạnh hơn là θεότης.
- issue: Quan hệ ý nghĩa của εἰς τὸ εἶναι αὐτοὺς ἀναπολογήτους
  choice: 'kết quả: “Vì thế, họ không thể bào chữa”'
  alternative: 'mục đích: “để họ không thể bào chữa”'
  rationale: Trong ngữ cảnh, cấu trúc này được hiểu tự nhiên là kết quả của việc quyền năng và thần tính của Đức Chúa Trời được nhận biết qua tạo vật; cách dịch không quy kết thêm một mục đích thần học ngoài câu.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại. “Ngài” duy trì cách xưng hô kính trọng dành cho Đức Chúa Trời; cấu trúc được chia thành hai câu để mối quan hệ kết quả rõ ràng và dễ đọc. Dấu gạch ngang làm nổi bật cụm đồng vị mà không biến nó thành một nhận định tách biệt.
