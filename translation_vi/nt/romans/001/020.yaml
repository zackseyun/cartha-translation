revisions:
- from: Thật vậy, từ khi thế giới được tạo dựng, những điều không thấy được về Ngài[a]—tức là quyền năng đời đời và thần tính[b] của Ngài—đã được thấy rõ, vì người ta nhận biết những điều ấy qua những gì đã được tạo nên. Vì thế, họ không thể bào chữa.
  to: Thật vậy, từ khi thế giới được tạo dựng, nhờ suy xét những gì đã được tạo nên, người ta nhận thấy rõ những điều không thấy được về Ngài[a]—tức là quyền năng đời đời và thần tính[b] của Ngài—đến nỗi họ không thể bào chữa.
  rationale: Sửa cấu trúc để “nhờ suy xét những gì đã được tạo nên” biểu đạt rõ việc các thực tại vô hình được nhận biết bằng trí óc qua tạo vật. Đổi liên kết kết quả thành “đến nỗi” để phản ánh εἰς τὸ εἶναι αὐτοὺς ἀναπολογήτους. Không thay đổi nghĩa, thuật ngữ chủ đạo, hoặc các neo chú thích.
