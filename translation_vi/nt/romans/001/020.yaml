    issue: “vì người ta nhận biết những điều ấy qua những gì đã được tạo nên” làm mờ quan hệ của νοούμενα với καθορᾶται.
    rationale: 'νοούμενα là phân từ nêu cách thức: các thực tại vô hình được nhận thấy rõ khi/nhờ được hiểu bằng trí óc qua các tạo vật. Liên từ “vì” trong tiếng Việt chủ yếu biểu thị nguyên nhân và có thể khiến mệnh đề trở thành lời giải thích nhân quả độc lập.'
  - severity: low
    issue: “Vì thế” nối kết quả bằng một câu tách riêng hơi yếu so với εἰς τὸ εἶναι.
    rationale: “Đến nỗi” gắn trực tiếp sự nhận biết qua tạo vật với hệ quả “không thể bào chữa,” sát và tự nhiên hơn, không áp đặt cách hiểu mục đích thay cho kết quả.
