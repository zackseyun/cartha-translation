source:
  edition: SBLGNT
  text: καὶ ἤλλαξαν τὴν δόξαν τοῦ ἀφθάρτου θεοῦ ἐν ὁμοιώματι εἰκόνος φθαρτοῦ ἀνθρώπου καὶ πετεινῶν καὶ τετραπόδων καὶ ἑρπετῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/023.yaml
  text: and exchanged the glory of the imperishable God for the likeness of an image of perishable man and birds and four-footed animals and reptiles[a][b][c][d].
translation:
  language: vi
  text: và họ đã đổi vinh quang của Đức Chúa Trời không hư nát lấy hình dáng của một hình tượng về con người phải hư nát, chim chóc, thú bốn chân và loài bò sát.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Đức Chúa Trời không thể hư nát.”'
    reason: lexical_alternative
  - marker: b
    text: 'Sát nghĩa: “lấy hình dáng của một hình tượng về con người phải hư nát, chim chóc, thú bốn chân và loài bò sát.”'
    reason: lexical_alternative
  - marker: c
    text: Từ Hy Lạp cũng có thể chỉ rộng hơn đến các sinh vật bò hay trườn trên mặt đất.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤλλαξαν
  choice: đã đổi ... lấy
  rationale: Diễn đạt rõ hành vi chủ ý thay thế đối tượng này bằng đối tượng khác, đúng với cấu trúc và văn cảnh.
- source_word: δόξαν
  choice: vinh quang
  rationale: Cách dịch quen thuộc, trang trọng và phù hợp với sự tương phản giữa sự uy nghi của Đức Chúa Trời với hình tượng.
- source_word: ἀφθάρτου
  choice: không hề hư nát
  rationale: Giữ trực tiếp ý không chịu sự mục nát hay tiêu hoại, đồng thời đối xứng với φθαρτοῦ.
- source_word: ἐν ὁμοιώματι εἰκόνος
  choice: lấy hình tượng mang hình dáng của
  rationale: Bảo tồn cả hai lớp từ ngữ về hình ảnh trong nguyên văn—ὁμοίωμα và εἰκών—mà vẫn tương đối tự nhiên trong tiếng Việt.
- source_word: φθαρτοῦ ἀνθρώπου
  choice: loài người hay hư nát
  rationale: Giữ sự đối lập từ vựng với Đức Chúa Trời 'không hề hư nát'; ἄνθρωπος ở đây chỉ con người nói chung.
- source_word: πετεινῶν
  choice: chim chóc
  rationale: Tương đương tự nhiên, phổ thông cho các loài chim.
- source_word: τετραπόδων
  choice: thú bốn chân
  rationale: Giữ nét nghĩa hình thái của từ Hy Lạp mà vẫn dễ hiểu trong tiếng Việt hiện đại.
- source_word: ἑρπετῶν
  choice: loài bò sát
  rationale: Cách gọi ngắn gọn, tự nhiên; chú thích ghi nhận phạm vi nghĩa có thể rộng hơn phân loại động vật học hiện đại.
theological_decisions:
- issue: Sự đối lập ἀφθάρτου/φθαρτοῦ
  choice: không hề hư nát / hay hư nát
  alternative: bất tử / phải chết
  rationale: Giữ cùng một trường từ vựng ở hai vế và không thu hẹp ý nghĩa chỉ vào sự chết.
- issue: Cấu trúc ἐν ὁμοιώματι εἰκόνος
  choice: hình tượng mang hình dáng của
  alternative: những hình tượng giống như
  rationale: Giữ số ít và sự chồng lớp có chủ ý của ngôn ngữ về hình tượng, tránh giải thích quá mức bản chất của việc thờ hình tượng.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại. Giữ nhịp liệt kê của nguyên văn và sự đối lập nổi bật giữa Đấng Tạo Hóa không hư nát với các thụ tạo hay hư nát; tránh thuật ngữ động vật học quá chuyên môn.
