revisions:
- from: và họ đã đổi vinh quang của Đức Chúa Trời không hề hư nát lấy hình tượng mang hình dáng của loài người hay hư nát, của chim chóc, thú bốn chân và loài bò sát.[a][b][c]
  to: và họ đã đổi vinh quang của Đức Chúa Trời không hư nát lấy hình dáng của một hình tượng về con người phải hư nát, chim chóc, thú bốn chân và loài bò sát.[a][b][c]
  rationale: Bản sửa giữ cách dịch «đổi ... lấy» và đối ứng từ vựng «không hư nát/phải hư nát», đồng thời đặt lại «hình dáng» làm danh từ chính trước «một hình tượng» để phản ánh ὁμοιώματι εἰκόνος. Danh sách chim, thú bốn chân và loài bò sát được nối trực tiếp với «hình tượng về», phù hợp với chuỗi sở hữu cách trong nguyên văn.
