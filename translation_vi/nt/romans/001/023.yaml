review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch giữ đúng hành động hoán đổi, «vinh quang», và thế đối lập giữa ἀφθάρτου/φθαρτοῦ. Tuy nhiên, «hình tượng mang hình dáng của» đảo nhẹ quan hệ chồng lớp trong ἐν ὁμοιώματι εἰκόνος: nguyên văn nói đến «hình dáng/sự giống như của một hình tượng», rồi mới đến các đối tượng được mô tả. Cần diễn đạt lại để giữ cấu trúc này mà vẫn tự nhiên.'
  naturalness: Câu hiện tại dễ hiểu nhưng cụm «hình tượng mang hình dáng của loài người hay hư nát» không tự nhiên và làm phạm vi của danh sách tiếp theo hơi lỏng. «Con người phải hư nát» tự nhiên hơn «loài người hay hư nát» trong đối ứng với Đức Chúa Trời không hư nát.
  terminology: «Đức Chúa Trời», «vinh quang», «thú bốn chân» và «loài bò sát» đều phù hợp với văn phong Kinh Thánh trang trọng, hiện đại. «Loài bò sát» được chú thích đúng mức vì ἑρπετά có thể rộng hơn phạm trù động vật học hiện đại.
  issues:
  - severity: medium
    issue: Quan hệ giữa «hình dáng/sự giống như» và «hình tượng» bị đảo trong bản văn.
    rationale: ἐν ὁμοιώματι εἰκόνος có hai lớp danh từ liên tiếp, theo nghĩa đen là «trong/lấy sự giống như của một hình tượng». «Hình tượng mang hình dáng» chuyển trọng tâm sang bản thân hình tượng và không phản ánh cấu trúc sát bằng.
  - severity: low
    issue: «Loài người hay hư nát» kém tự nhiên và không giữ tốt số ít tổng quát của ἀνθρώπου.
    rationale: «Con người phải hư nát» diễn đạt tự nhiên hơn, vẫn chỉ con người theo nghĩa loại thể và làm rõ sự tương phản với Đấng không hư nát.
  revised_text: và họ đã đổi vinh quang của Đức Chúa Trời không hư nát lấy hình dáng của một hình tượng về con người phải hư nát, chim chóc, thú bốn chân và loài bò sát.[a][b][c]
