id: ROM.1.4
reference: Romans 1:4
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: τοῦ ὁρισθέντος υἱοῦ θεοῦ ἐν δυνάμει κατὰ πνεῦμα ἁγιωσύνης ἐξ ἀναστάσεως νεκρῶν, Ἰησοῦ Χριστοῦ τοῦ κυρίου ἡμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/004.yaml
  text: and who was declared to be the Son of God in power according to the Spirit of holiness by the resurrection from the dead—Jesus the Messiah our Lord[b][a],
translation:
  language: vi
  text: và được công bố là Con Đức Chúa Trời trong quyền năng, theo Thần Khí thánh khiết, bởi sự sống lại từ cõi chết—Đức Giê-su, Đấng Mê-si, Chúa chúng ta.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “được xác định là” hoặc “được chỉ định làm Con Đức Chúa Trời trong quyền năng.”'
    reason: lexical_alternative
  - marker: b
    text: 'Hoặc: “theo Đức Thánh Linh.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ὁρισθέντος
  choice: được xác định là
  rationale: ὁρίζω có thể mang nghĩa xác định, chỉ định hoặc công bố. “Được xác định là” giữ được độ mở của từ Hy Lạp, không hàm ý rằng Đức Giê-su chỉ bắt đầu làm Con Đức Chúa Trời sau khi sống lại; các cách hiểu lớn khác được ghi ở chú thích.
- source_word: υἱοῦ θεοῦ
  choice: Con Đức Chúa Trời
  rationale: Cách dịch trực tiếp, tự nhiên và giữ nguyên tước hiệu Kitô học của cụm từ Hy Lạp.
- source_word: ἐν δυνάμει
  choice: đầy quyền năng
  rationale: Trong tiếng Việt, “Con Đức Chúa Trời đầy quyền năng” tự nhiên hơn cách dịch sát chữ “trong quyền năng”, đồng thời vẫn gắn quyền năng với địa vị hoặc sự biểu lộ tư cách Con.
- source_word: κατὰ πνεῦμα ἁγιωσύνης
  choice: theo Thần khí thánh khiết
  rationale: Giữ cấu trúc khác thường của nguyên văn và sự tương ứng với “theo xác thịt” ở câu 3, không vội quyết định rằng cụm này nhất thiết chỉ trực tiếp Đức Thánh Linh.
- source_word: ἐξ ἀναστάσεως νεκρῶν
  choice: bởi sự sống lại từ cõi chết
  rationale: “Bởi” diễn đạt căn cứ hoặc phương tiện của việc xác định; “sự sống lại từ cõi chết” là cách nói rõ ràng, tự nhiên trong ngữ cảnh.
- source_word: Χριστοῦ
  choice: Đấng Mê-si
  rationale: Ở đây Χριστός mang giá trị tước hiệu; “Đấng Mê-si” truyền đạt ý nghĩa ấy rõ ràng trong tiếng Việt hiện đại.
- source_word: κυρίου
  choice: Chúa
  rationale: “Chúa” là cách dịch chuẩn, trang trọng và giữ được âm hưởng Kitô học của κύριος trong thư Phao-lô.
theological_decisions:
- issue: ὁρισθέντος có hàm ý Đức Giê-su chỉ trở thành Con Đức Chúa Trời khi sống lại hay không
  choice: Dịch “được xác định là Con Đức Chúa Trời đầy quyền năng”, không nói rằng Ngài bắt đầu trở thành Con vào lúc sống lại.
  alternative: “được công bố là” hoặc “được chỉ định làm Con Đức Chúa Trời đầy quyền năng”
  rationale: Nguyên văn có thể nhấn mạnh việc được xác lập, chỉ định hoặc công khai biểu lộ trong quyền năng. Bản dịch giữ sự căng thẳng của câu mà không áp đặt cách hiểu cho rằng tư cách Con chỉ bắt đầu sau sự sống lại.
- issue: πνεῦμα ἁγιωσύνης có chỉ đích danh Đức Thánh Linh hay không
  choice: Dùng “Thần khí thánh khiết” để giữ nguyên tính khác thường và độ mở của cụm từ.
  alternative: “Đức Thánh Linh” hoặc “thần linh thánh khiết của Ngài”
  rationale: Cụm Hy Lạp không phải cách gọi thông thường πνεῦμα ἅγιον và có thể tạo thế đối ứng với “theo xác thịt” ở câu 3; chú thích bảo lưu cách hiểu trực tiếp về Đức Thánh Linh.
translation_notes:
  register: Văn phong tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. “Thần khí thánh khiết” được dùng có chủ ý để phản ánh cụm Hy Lạp khác thường; “Đấng Mê-si” giữ Χριστός như một tước hiệu. Dấu gạch ngang làm rõ rằng “Chúa Giê-su, Đấng Mê-si, Chúa chúng ta” là đối tượng được mô tả.
