  source_fidelity: Bản nháp truyền đạt các thành phần chính của câu Hy Lạp, kể cả tính dè dặt của πνεῦμα ἁγιωσύνης. Tuy nhiên, “Con Đức Chúa Trời đầy quyền năng” chuyển ἐν δυνάμει thành đặc tính cố hữu của “Con”, trong khi cụm này trong nguyên văn bổ nghĩa cho sự được chỉ định/xác định là Con trong một phương diện hay tình trạng quyền năng. “Tức là” cũng thêm một quan hệ giải thích không được nêu rõ trong nguyên văn.
  naturalness: “Được xác định là” có thể hiểu được, nhưng “được công bố là” tự nhiên hơn trong văn xuôi tiếng Việt hiện đại và phản ánh hợp lý ὁρισθέντος mà không giải quyết quá mức tranh luận về sắc thái của từ. “Trong quyền năng” giữ liên hệ cú pháp với động từ tốt hơn “đầy quyền năng”.
  terminology: Giữ “Con Đức Chúa Trời”, “Thần Khí thánh khiết”, “Đấng Mê-si”, và “Chúa chúng ta”. “Thần Khí thánh khiết” bảo toàn tính khác thường của πνεῦμα ἁγιωσύνης; chú thích nêu “Đức Thánh Linh” là cách hiểu thay thế. Dùng “Đức Giê-su” là hình thức tôn kính, chuẩn mực trong văn cảnh Kinh Thánh tiếng Việt.
