  text: concerning his Son[a], who was descended from the offspring of David according to the flesh[b],
translation:
  language: vi
  text: về Con Ngài, là Đấng đến từ dòng dõi Đa-vít theo xác thịt,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Theo xác thịt” ở đây chỉ phương diện dòng dõi loài người hay nguồn gốc trần thế, không chỉ bản tính tội lỗi.
    reason: cultural_note
lexical_decisions:
- source_word: περὶ
  choice: về
  rationale: Giới từ này nối với câu trước và giới thiệu nội dung của Tin Mừng; “về” tự nhiên và chính xác trong tiếng Việt.
- source_word: τοῦ υἱοῦ αὐτοῦ
  choice: Con Ngài
  rationale: Chỉ Con của Đức Chúa Trời trong văn cảnh; viết hoa “Con” để làm rõ đối tượng quy chiếu, không thêm một nghĩa từ vựng mới.
- source_word: τοῦ γενομένου ἐκ σπέρματος Δαυὶδ
  choice: Đấng ... là hậu duệ của Đa-vít
  rationale: Trong ngữ cảnh gia phả, γενομένου ἐκ σπέρματος diễn tả nguồn gốc thuộc dòng dõi. “Là hậu duệ của Đa-vít” truyền đạt tự nhiên ý “đến từ dòng giống Đa-vít” mà không gợi rằng Đấng ấy bắt đầu hiện hữu tại đây.
- source_word: κατὰ σάρκα
  choice: theo xác thịt
  rationale: Giữ lại cách nói có sức nặng thần học của nguyên văn, đồng thời chú thích rằng ở đây nó nói về phương diện dòng dõi nhân loại, không phải bản tính tội lỗi.
theological_decisions:
- issue: Mối liên hệ giữa tư cách Con của Đức Chúa Trời và dòng dõi Đa-vít
  choice: 'Giữ cả hai yếu tố: “Con Ngài” và “theo xác thịt là hậu duệ của Đa-vít”'
  alternative: Diễn giải thành “về phương diện bản tính loài người”
  rationale: Nguyên văn đặt tư cách làm Con và nguồn gốc Đa-vít theo xác thịt cạnh nhau mà không giải thích siêu hình; bản dịch giữ nguyên sự căng thẳng thần học ấy.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” theo lối văn Kinh Thánh tiếng Việt phổ biến; giữ cụm “theo xác thịt” để bảo toàn thuật ngữ và sự hàm súc của nguyên văn.
