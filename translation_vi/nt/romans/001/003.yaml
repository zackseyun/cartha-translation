  source_fidelity: 'Bản nháp truyền đạt đúng các yếu tố chính: nội dung nói về Con của Đức Chúa Trời, liên hệ với Đa-vít, và giới hạn “theo xác thịt”. Tuy nhiên, “là hậu duệ” làm mờ sắc thái động từ của τοῦ γενομένου (“đến từ/có nguồn gốc từ”) và chuyển cách diễn đạt “từ dòng giống” thành một nhãn phân loại tĩnh.'
  naturalness: “Đấng theo xác thịt là hậu duệ của Đa-vít” có thể hiểu được, nhưng vị trí của “theo xác thịt” chen giữa chủ ngữ và vị ngữ khá gượng trong tiếng Việt hiện đại. Đặt cụm này sau “dòng dõi Đa-vít” tự nhiên hơn và gần với phạm vi bổ nghĩa trong nguyên văn.
  terminology: Giữ “Con Ngài,” “Đa-vít,” và “theo xác thịt” là phù hợp với văn phong Kinh Thánh tiếng Việt và bảo toàn thuật ngữ có ý nghĩa thần học. Chú thích nên giải thích cụm “theo xác thịt” mà không khẳng định quá mức hoặc gọi một lối diễn đạt là “dịch sát hơn.”
  issues:
