    rationale: 'Trong tiếng Việt, “theo xác thịt” tự nhiên hơn khi đặt sau mệnh đề về nguồn gốc/dòng dõi mà nó xác định: “đến từ dòng dõi Đa-vít theo xác thịt.”'
