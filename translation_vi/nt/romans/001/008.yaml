id: ROM.1.8
reference: Romans 1:8
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Πρῶτον μὲν εὐχαριστῶ τῷ θεῷ μου διὰ Ἰησοῦ Χριστοῦ ⸀περὶ πάντων ὑμῶν, ὅτι ἡ πίστις ὑμῶν καταγγέλλεται ἐν ὅλῳ τῷ κόσμῳ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/008.yaml
  text: First[a], I thank my God through Jesus the Messiah for all of you[b], because your faith is being proclaimed throughout the whole world.
translation:
  language: vi
  text: Trước hết, tôi cảm tạ Đức Chúa Trời của tôi nhờ Giê-su, Đấng Mê-si-a[a], vì tất cả anh chị em, vì đức tin[b] của anh chị em đang được rao truyền khắp thế giới.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: Đấng Christ.'
    reason: alternative_reading
  - marker: b
    text: 'Hay: lòng trung tín; cũng có thể là sự tin cậy.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πρῶτον μὲν
  choice: Trước hết
  rationale: Đánh dấu điểm mở đầu trong diễn ngôn của Phao-lô; tiểu từ μὲν được diễn đạt tự nhiên trong cụm tiếng Việt.
- source_word: εὐχαριστῶ τῷ θεῷ μου
  choice: cảm tạ Đức Chúa Trời của tôi
  rationale: Giữ ý cảm tạ trực tiếp và sắc thái sùng kính cá nhân của cấu trúc sở hữu.
- source_word: διὰ Ἰησοῦ Χριστοῦ
  choice: nhờ Đức Chúa Giê-su, Đấng Mê-si-a, mà
  rationale: διά với sở hữu cách chỉ phương tiện hoặc sự trung gian; “nhờ... mà” tự nhiên trong tiếng Việt, còn Χριστός được chuyển nghĩa như một tước hiệu.
- source_word: περὶ πάντων ὑμῶν
  choice: về tất cả anh chị em
  rationale: Trong ngữ cảnh cảm tạ, περί chỉ đối tượng mà Phao-lô cảm tạ; “về” vừa sát nghĩa vừa tự nhiên.
- source_word: ἡ πίστις ὑμῶν
  choice: đức tin của anh chị em
  rationale: “Đức tin” là cách dịch thông dụng và phù hợp nhất trong ngữ cảnh, nhưng các sắc thái “lòng trung tín” và “sự tin cậy” vẫn được ghi chú.
- source_word: καταγγέλλεται
  choice: đang được rao truyền
  rationale: Giữ thể bị động và sắc thái tiếp diễn của động từ hiện tại, đồng thời thể hiện tính công khai của việc loan báo.
- source_word: ἐν ὅλῳ τῷ κόσμῳ
  choice: khắp thế giới
  rationale: Diễn đạt tự nhiên phạm vi rộng mang tính tu từ của κόσμος mà không làm câu tiếng Việt nặng nề.
theological_decisions:
- issue: Cách dịch Χριστοῦ trong διὰ Ἰησοῦ Χριστοῦ
  choice: Đức Chúa Giê-su, Đấng Mê-si-a
  alternative: Đức Chúa Giê-su Christ
  rationale: Χριστός là tước hiệu có nghĩa “Đấng Mê-si-a/Đấng được xức dầu”; dịch nghĩa giúp độc giả hiện đại nhận ra tước hiệu thay vì chỉ gặp một dạng phiên âm truyền thống.
- issue: Cách dịch πίστις trong ἡ πίστις ὑμῶν
  choice: đức tin
  alternative: lòng trung tín; sự tin cậy
  rationale: Trong văn cảnh này, “đức tin” phù hợp nhất với việc niềm tin của các tín hữu Rô-ma được biết đến rộng rãi, nhưng πίστις vẫn có thể mang những sắc thái khác nên không loại bỏ chúng.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh chị em” để diễn đạt số nhiều ὑμῶν theo lối bao quát và tự nhiên; giữ cấu trúc trung gian “nhờ... mà” cùng thể bị động của động từ chính.
