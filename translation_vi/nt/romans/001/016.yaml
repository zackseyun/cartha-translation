id: ROM.1.16
reference: Romans 1:16
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Οὐ γὰρ ἐπαισχύνομαι τὸ ⸀εὐαγγέλιον, δύναμις γὰρ θεοῦ ἐστιν εἰς σωτηρίαν παντὶ τῷ πιστεύοντι, Ἰουδαίῳ τε πρῶτον καὶ Ἕλληνι·
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/016.yaml
  text: For I am not ashamed of the good news[a], for it is the power of God for salvation to everyone who believes[b], to the Jew first and also to the Greek.
translation:
  language: vi
  text: Vì tôi không hổ thẹn về tin mừng[a], bởi đó là quyền năng của Đức Chúa Trời đem lại sự cứu rỗi cho mọi người tin, trước hết cho người Do Thái, rồi cũng cho người Hy Lạp[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “phúc âm.”
    reason: lexical_alternative
  - marker: b
    text: “Người Hy Lạp” ở đây có thể được hiểu rộng hơn là dân ngoại, tức người không phải Do Thái.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπαισχύνομαι
  choice: không hổ thẹn
  rationale: Diễn đạt tự nhiên trạng thái không cảm thấy xấu hổ và không thoái lui vì sợ nhục, phù hợp với lời tuyên bố công khai, mạnh mẽ của Phao-lô.
- source_word: εὐαγγέλιον
  choice: tin mừng
  rationale: Truyền đạt trực tiếp nghĩa là tin tốt lành bằng cách nói quen thuộc, trang trọng trong tiếng Việt hiện đại.
- source_word: δύναμις
  choice: quyền năng
  rationale: Trong ngữ cảnh nói về Đức Chúa Trời, “quyền năng” vừa tự nhiên vừa diễn tả năng lực hữu hiệu của Ngài trong việc cứu người.
- source_word: εἰς σωτηρίαν
  choice: để cứu
  rationale: Diễn đạt rõ hướng đích của εἰς σωτηρίαν bằng tiếng Việt tự nhiên; ý niệm cứu rỗi được thể hiện bằng động từ dễ hiểu mà không làm thay đổi quan hệ cú pháp chính.
- source_word: παντὶ τῷ πιστεύοντι
  choice: mọi người tin
  rationale: Giữ cả ý phân phối của παντί lẫn sắc thái của phân từ πιστεύοντι, không biến cụm từ thành một nhãn gọi cố định như “tín đồ”.
- source_word: Ἰουδαίῳ
  choice: người Do Thái
  rationale: Trong sự đối chiếu lịch sử-cứu rỗi với Ἕλληνι, nghĩa dân tộc-tôn giáo “người Do Thái” phù hợp hơn một cách gọi thuần địa lý.
- source_word: πρῶτον
  choice: trước là
  rationale: Giữ thứ tự ưu tiên súc tích trong nguyên văn, nhưng không giải thích thêm bản chất của sự ưu tiên ấy.
- source_word: Ἕλληνι
  choice: người Hy Lạp
  rationale: Giữ danh xưng cụ thể của nguyên văn; nghĩa rộng hơn chỉ người ngoài Do Thái được nêu trong chú thích.
- source_word: τε ... καί
  choice: rồi cũng đến
  rationale: Diễn đạt tự nhiên sự bổ sung sau thứ tự “trước”, đồng thời giữ việc người Hy Lạp cũng thuộc phạm vi của quyền năng cứu rỗi.
theological_decisions:
- issue: Phạm vi nghĩa của Ἕλληνι trong cụm đối chiếu với người Do Thái
  choice: Giữ “người Hy Lạp” trong chính văn và chú thích nghĩa rộng hơn
  alternative: Dịch thẳng là “dân ngoại” trong chính văn
  rationale: Cách dịch này trung thành với từ ngữ cụ thể của bản Hy Lạp, đồng thời không che khuất việc Phao-lô có thể dùng từ ấy theo nghĩa đại diện cho những người không phải Do Thái.
- issue: Ý nghĩa của πρῶτον đối với thứ tự cứu rỗi
  choice: Giữ đơn giản là “trước là”, không giải thích loại ưu tiên
  alternative: Diễn giải là ưu tiên về thời gian, đặc quyền, hoặc trình tự sứ mạng
  rationale: Nguyên văn khẳng định thứ tự nhưng không trực tiếp xác định đầy đủ bản chất thần học của thứ tự ấy; bản dịch giữ nguyên sự căng thẳng này.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “Đức Chúa Trời” nhất quán cho θεός; giữ nhịp lập luận với hai mệnh đề nguyên nhân nối tiếp nhau và tránh diễn giải quá mức các hàm ý thần học.
