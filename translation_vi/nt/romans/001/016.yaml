revisions:
- from: Vì tôi không hổ thẹn về tin mừng[a], bởi đó là quyền năng của Đức Chúa Trời để cứu mọi người tin, trước là người Do Thái, rồi cũng đến người Hy Lạp[b].
  to: Vì tôi không hổ thẹn về tin mừng[a], bởi đó là quyền năng của Đức Chúa Trời đem lại sự cứu rỗi cho mọi người tin, trước hết cho người Do Thái, rồi cũng cho người Hy Lạp[b].
  rationale: Bản sửa làm rõ quan hệ “quyền năng của Đức Chúa Trời” với “sự cứu rỗi” và với “mọi người tin,” đồng thời sửa cấu trúc liệt kê để hai nhóm người được đặt song hành. Không thêm diễn giải về bản chất của sự ưu tiên dành cho người Do Thái; “trước hết” chỉ bảo toàn πρῶτον.
