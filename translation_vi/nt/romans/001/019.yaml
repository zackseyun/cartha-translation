lexical_decisions:
- source_word: διότι
  choice: vì
  rationale: Diễn đạt tự nhiên quan hệ nguyên nhân với mệnh đề trước.
- source_word: τὸ γνωστὸν τοῦ θεοῦ
  choice: những gì có thể biết về Đức Chúa Trời
  rationale: Tính từ trung tính có mạo từ được dùng như danh từ; cách dịch này giữ sắc thái điều có thể được nhận biết về Đức Chúa Trời.
- source_word: φανερόν
  choice: đã rõ ràng
  rationale: Truyền đạt ý hiển nhiên, được phơi bày để người ta nhận biết; dùng “đã” phù hợp với hành động bày tỏ được nêu tiếp theo.
- source_word: ἐν αὐτοῖς
  choice: giữa họ
  rationale: Giữ nghĩa tập thể hoặc công khai phù hợp với văn cảnh, đồng thời ghi nhận nghĩa nội tại trong chú thích.
- source_word: ὁ θεὸς γὰρ αὐτοῖς ἐφανέρωσεν
  choice: bởi chính Đức Chúa Trời đã bày tỏ điều ấy cho họ
  rationale: “Bày tỏ” chuyển tải hành động làm cho điều gì trở nên rõ ràng; “chính” nhấn mạnh chủ thể được nêu rõ trong tiếng Hy Lạp mà không thêm nội dung thần học.
theological_decisions:
- issue: Ý nghĩa của ἐν αὐτοῖς
  choice: giữa họ
  alternative: trong họ; bên trong họ
  rationale: Cụm từ có thể chỉ phạm vi tập thể/công khai hoặc vị trí nội tại. Bản văn chính chọn nghĩa tập thể, còn chú thích bảo tồn sự mơ hồ chân thực.
