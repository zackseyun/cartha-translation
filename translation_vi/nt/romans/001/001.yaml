id: ROM.1.1
reference: Romans 1:1
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Παῦλος δοῦλος ⸂Χριστοῦ Ἰησοῦ⸃, κλητὸς ἀπόστολος, ἀφωρισμένος εἰς εὐαγγέλιον θεοῦ
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/001.yaml
  text: Paul[a], a servant of Messiah Jesus, called as an apostle, set apart for the gospel of God[d][c][b],
translation:
  language: vi
  text: Phao-lô, một nô lệ[a] của Đấng Mê-si-a Giê-su[b], được kêu gọi làm sứ đồ[c], được biệt riêng cho Tin Lành của Đức Chúa Trời,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “tôi tớ”; theo truyền thống còn có cách nói “tôi tớ thuộc trọn về chủ”.'
    reason: lexical_alternative
  - marker: b
    text: 'Hay: “Đấng Christ Giê-su”.'
    reason: lexical_alternative
  - marker: c
    text: 'Sát cấu trúc Hy Lạp hơn: “một sứ đồ được kêu gọi”; cũng có thể hiểu là “được gọi để làm sứ đồ”.'
    reason: alternative_reading
lexical_decisions:
- source_word: Παῦλος
  choice: Phao-lô
  rationale: Dùng dạng phiên âm đã quen thuộc trong tiếng Việt cho tên riêng Hy Lạp Παῦλος.
- source_word: δοῦλος
  choice: nô lệ
  rationale: Từ này chỉ người thuộc quyền sở hữu và phục vụ chủ; “nô lệ” giữ được sức nặng của quan hệ lệ thuộc trong lời tự giới thiệu của Phao-lô, dù “tôi tớ” là cách dịch trang trọng và quen thuộc hơn.
- source_word: Χριστοῦ Ἰησοῦ
  choice: của Đấng Mê-si-a Giê-su
  rationale: Giữ nguyên trật tự danh hiệu rồi đến tên trong tiếng Hy Lạp và chuyển nghĩa Χριστός như một danh hiệu, thay vì chỉ phiên âm.
- source_word: κλητὸς ἀπόστολος
  choice: được kêu gọi làm sứ đồ
  rationale: Diễn đạt tự nhiên quan hệ giữa tính từ κλητός và danh từ ἀπόστολος, không hiểu κλητός theo nghĩa đơn thuần là người ta gọi ông bằng danh xưng ấy.
- source_word: ἀφωρισμένος
  choice: được biệt riêng
  rationale: Giữ thể bị động và ý nghĩa được tách riêng, dành riêng cho một mục đích.
- source_word: εἰς εὐαγγέλιον θεοῦ
  choice: cho Tin Lành của Đức Chúa Trời
  rationale: “Cho” diễn đạt hướng đích hoặc mục đích của εἰς; “Tin Lành” là thuật ngữ tiếng Việt quen thuộc cho εὐαγγέλιον và vẫn mang nghĩa tin mừng.
theological_decisions:
- issue: Sắc thái của δοῦλος trong lời tự giới thiệu của Phao-lô
  choice: nô lệ
  alternative: tôi tớ
  rationale: “Nô lệ” thể hiện rõ sự thuộc về và lệ thuộc vào chủ vốn có trong δοῦλος; chú thích bảo lưu cách dịch truyền thống, trang trọng hơn là “tôi tớ”.
- issue: Cách thể hiện Χριστός như danh hiệu
  choice: Đấng Mê-si-a Giê-su
  alternative: Đấng Christ Giê-su
  rationale: Trong cụm này Χριστός đứng trước tên Ἰησοῦ và có thể được nghe như một danh hiệu; dịch “Đấng Mê-si-a” làm rõ ý nghĩa ấy mà không thêm một khẳng định thần học ngoài nguyên văn.
- issue: Quan hệ ngữ pháp trong κλητὸς ἀπόστολος
  choice: được kêu gọi làm sứ đồ
  alternative: một sứ đồ được kêu gọi
  rationale: Cách chính tự nhiên trong tiếng Việt và diễn đạt việc Phao-lô được gọi vào chức vụ sứ đồ; cách thay thế bám sát hơn cấu trúc tính từ cộng danh từ và được bảo lưu trong chú thích.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại. Câu giữ dạng mở đầu thư và dấu phẩy cuối câu vì Rô-ma 1:1 tiếp tục sang các câu sau. “Nô lệ” được giữ vì độ mạnh của nguyên ngữ; các cách nói quen thuộc hơn được nêu ở chú thích. Mọi dấu chú thích đều xuất hiện ngay sau đơn vị từ ngữ liên quan.
