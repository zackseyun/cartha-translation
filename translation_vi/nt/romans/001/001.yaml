  terminology: «Nô lệ» là lựa chọn phù hợp cho δοῦλος trong ngữ cảnh này và chú thích bảo lưu phương án truyền thống «tôi tớ». «Sứ đồ», «Tin Lành», và «Đức Chúa Trời» nhất quán với văn phong Kinh Thánh tiếng Việt. Các chú thích a–c được gắn đúng đơn vị tương ứng và bảo lưu các lựa chọn dịch thuật thích đáng.
