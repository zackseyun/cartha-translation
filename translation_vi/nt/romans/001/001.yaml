  source_fidelity: 'Bản dịch phản ánh chính xác các thành tố của SBLGNT: «Phao-lô» cho Παῦλος; «một nô lệ» giữ lực nghĩa của δοῦλος; «của Đấng Mê-si-a Giê-su» phản ánh trật tự Χριστοῦ Ἰησοῦ và dịch Χριστός như danh hiệu; «được kêu gọi làm sứ đồ» diễn đạt tự nhiên κλητὸς ἀπόστολος; và «được biệt riêng cho Tin Lành của Đức Chúa Trời» giữ được thể bị động của ἀφωρισμένος cùng hướng đích của εἰς. Dấu phẩy cuối câu thích hợp vì câu tiếp tục ở các câu sau.'
