  to: Vì vậy, Đức Chúa Trời đã phó mặc họ cho những dục vọng đáng hổ thẹn; vì ngay cả phụ nữ của họ cũng đổi quan hệ tự nhiên lấy quan hệ trái với tự nhiên.[a]
  rationale: Bản chỉnh sửa chỉ bổ sung “vì” để phản ánh γὰρ và điều chỉnh chú thích để phân biệt χρῆσις (“sự sử dụng”) ở vế đầu với cụm τὴν παρὰ φύσιν (“điều trái với tự nhiên”) ở vế sau. Nghĩa của bản văn không thay đổi.
