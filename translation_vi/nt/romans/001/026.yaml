  - severity: low
    issue: Chú thích dịch sát thêm “sự sử dụng” vào vế thứ hai.
    rationale: Nguyên văn εἰς τὴν παρὰ φύσιν là cụm được danh từ hóa, nghĩa là “điều [có tính] trái với tự nhiên”; không lặp lại χρῆσις một cách minh nhiên. Chú thích nên phản ánh sự lược bỏ này.
