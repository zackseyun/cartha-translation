source:
  edition: SBLGNT
  text: Διὰ τοῦτο παρέδωκεν αὐτοὺς ὁ θεὸς εἰς πάθη ἀτιμίας· αἵ τε γὰρ θήλειαι αὐτῶν μετήλλαξαν τὴν φυσικὴν χρῆσιν εἰς τὴν παρὰ φύσιν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/026.yaml
  text: For this reason God gave them over to dishonorable passions[a], for even their women exchanged natural relations for what is contrary to nature[c][b],
translation:
  language: vi
  text: Vì vậy, Đức Chúa Trời đã phó mặc họ cho những dục vọng đáng hổ thẹn; vì ngay cả phụ nữ của họ cũng đổi quan hệ tự nhiên lấy quan hệ trái với tự nhiên.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát hơn: “đổi sự sử dụng tự nhiên lấy điều trái với tự nhiên.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: Vì vậy
  rationale: Diễn đạt tự nhiên quan hệ nguyên nhân–kết quả và nối câu này với lập luận ngay trước đó.
- source_word: παρέδωκεν αὐτοὺς ὁ θεὸς
  choice: Đức Chúa Trời đã phó mặc họ
  rationale: “Phó mặc” giữ được ý Đức Chúa Trời trao họ cho hậu quả của sự phản nghịch, đồng thời phù hợp văn phong tiếng Việt hiện đại.
- source_word: πάθη ἀτιμίας
  choice: những dục vọng đáng hổ thẹn
  rationale: Giữ nguyên sắc thái đánh giá của ἀτιμία mà không tăng nặng hoặc làm nhẹ lời văn.
- source_word: αἵ τε γὰρ θήλειαι αὐτῶν
  choice: ngay cả phụ nữ của họ cũng
  rationale: “Phụ nữ” tự nhiên hơn “giống cái” khi nói về con người; “ngay cả… cũng” thể hiện lực nhấn mạnh của τε γὰρ trong ngữ cảnh.
- source_word: μετήλλαξαν
  choice: đổi
  rationale: Diễn đạt trực tiếp hành động thay cái này bằng cái khác.
- source_word: τὴν φυσικὴν χρῆσιν
  choice: quan hệ tự nhiên
  rationale: χρῆσις theo nghĩa đen là “sự sử dụng”, nhưng trong ngữ cảnh chỉ quan hệ tính dục; cách dịch này rõ nghĩa và tránh lối nói gượng gạo.
- source_word: εἰς τὴν παρὰ φύσιν
  choice: lấy quan hệ trái với tự nhiên
  rationale: Giữ cấu trúc trao đổi và ý đối lập với φύσις, không gắn thêm các phạm trù hiện đại mà câu Hy Lạp không nêu.
theological_decisions:
- issue: Mức độ giữ lại lời đánh giá đạo đức của câu
  choice: Giữ các cụm “đáng hổ thẹn” và “trái với tự nhiên” mà không diễn giải thêm.
  alternative: Làm nhẹ thành “không thích hợp”, hoặc tăng mức diễn giải bằng cách nêu đích danh những phạm trù tính dục hiện đại.
  rationale: Nguyên văn có lời đánh giá rõ ràng, nên bản dịch phải giữ lực ấy nhưng không được đưa thêm kết luận giáo lý hay văn hóa ngoài lời của Phao-lô.
- issue: Phạm vi nghĩa của χρῆσις
  choice: Dịch theo nghĩa ngữ cảnh là “quan hệ”.
  alternative: Dịch sát hình thức là “sự sử dụng” hoặc “cách dùng”.
  rationale: Nghĩa đen trong tiếng Việt dễ gây tối nghĩa hoặc vật hóa; “quan hệ” chuyển tải hàm ý tính dục trong ngữ cảnh mà không xác định chi tiết hơn nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Chúa Trời” theo lối gọi phổ biến trong Kinh Thánh tiếng Việt; giữ tính trực diện và căng thẳng thần học của nguyên văn, không thêm lời giải thích mang tính hệ phái.
