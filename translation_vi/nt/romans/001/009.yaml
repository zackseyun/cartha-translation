revisions:
- from: Vì Đức Chúa Trời, Đấng tôi phụng sự trong tâm linh mình qua Tin Mừng về Con Ngài, làm chứng cho tôi rằng tôi không ngừng nhắc đến anh chị em.[a]
  to: Vì Đức Chúa Trời, Đấng tôi phụng sự trong tâm linh mình trong Tin Mừng của Con Ngài, làm chứng cho tôi rằng tôi không ngừng nhắc đến anh chị em.[a]
  rationale: Sửa bản dịch để không ấn định trước chức năng của ἐν là “qua” hoặc nghĩa của sở hữu cách là “về.” Cấu trúc và nội dung còn lại giữ nguyên, gồm sắc thái lời Phao-lô viện Đức Chúa Trời làm chứng và thành ngữ “không ngừng nhắc đến anh chị em.”
  reviewer_model: gpt-5.6-terra
