id: ROM.1.9
reference: Romans 1:9
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: μάρτυς γάρ μού ἐστιν ὁ θεός, ᾧ λατρεύω ἐν τῷ πνεύματί μου ἐν τῷ εὐαγγελίῳ τοῦ υἱοῦ αὐτοῦ, ὡς ἀδιαλείπτως μνείαν ὑμῶν ποιοῦμαι
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/009.yaml
  text: For God[a], whom I serve in my spirit in the good news of his Son[d][c][b], is my witness that I continually mention you.
translation:
  language: vi
  text: Vì Đức Chúa Trời, Đấng tôi phụng sự trong tâm linh mình trong Tin Mừng của Con Ngài, làm chứng cho tôi rằng tôi không ngừng nhắc đến anh chị em.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Tin Mừng về Con Ngài.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: μάρτυς γάρ μού ἐστιν ὁ θεός
  choice: Vì Đức Chúa Trời ... làm chứng cho tôi
  rationale: Diễn đạt tự nhiên cấu trúc khẳng định Đức Chúa Trời là nhân chứng xác nhận lời Phao-lô; “làm chứng cho tôi” giữ được tính chất long trọng của lời viện dẫn.
- source_word: λατρεύω
  choice: phụng sự
  rationale: “Phụng sự” diễn tả sự phục vụ dành cho Đức Chúa Trời và vẫn hàm chứa sắc thái tôn giáo của động từ Hy Lạp, mà không thu hẹp nghĩa chỉ còn hành vi thờ phượng.
- source_word: ἐν τῷ πνεύματί μου
  choice: trong tâm linh mình
  rationale: Giữ sát giới từ ἐν và chiều kích nội tâm, cá nhân trong sự phụng sự của Phao-lô; cách nói này cũng không quyết định quá mức giữa nghĩa phạm vi và phương cách.
- source_word: ἐν τῷ εὐαγγελίῳ τοῦ υἱοῦ αὐτοῦ
  choice: qua Tin Mừng về Con Ngài
  rationale: ἐν có thể chỉ phạm vi hoặc phương tiện phục vụ; “qua” tạo câu tiếng Việt tự nhiên. Sở hữu cách τοῦ υἱοῦ αὐτοῦ có thể chỉ Tin Mừng thuộc về Con hoặc nói về Con; “về Con Ngài” làm rõ cách hiểu phù hợp ngữ cảnh nhưng được ghi nhận là một lựa chọn diễn giải.
- source_word: ἀδιαλείπτως
  choice: không ngừng
  rationale: Truyền đạt sự liên tục, đều đặn bằng cách nói hiện đại và tự nhiên.
- source_word: μνείαν ὑμῶν ποιοῦμαι
  choice: nhắc đến anh chị em
  rationale: Phản ánh thành ngữ Hy Lạp “làm sự nhắc đến” mà không diễn giải thành “nhớ đến”; “anh chị em” thể hiện số nhiều, bao gồm cộng đồng tín hữu.
theological_decisions:
- issue: Cách hiểu “trong tâm linh mình” (ἐν τῷ πνεύματί μου)
  choice: trong tâm linh mình
  alternative: bằng cả tâm linh mình
  rationale: Bản dịch chính giữ gần hình thức Hy Lạp và để ngỏ việc cụm từ chỉ phạm vi nội tâm hay phương cách Phao-lô phụng sự.
- issue: Quan hệ sở hữu cách trong “Tin Mừng của/về Con Ngài”
  choice: Tin Mừng về Con Ngài
  alternative: Tin Mừng của Con Ngài
  rationale: “Về Con Ngài” phù hợp với nội dung Tin Mừng trong văn mạch Rô-ma, nhưng vì sở hữu cách Hy Lạp có thể rộng hơn, phương án sát hình thức được bảo tồn trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Chúa Trời”, “Tin Mừng”, “Con Ngài” theo lối diễn đạt Kitô giáo phổ thông; tránh thuật ngữ giáo phái. Đại từ số nhiều ὑμῶν được dịch bao hàm là “anh chị em”.
