- from: Tôi mắc nợ cả người Hy Lạp lẫn người man di[a], cả người khôn ngoan lẫn người ngu dại.
  to: Tôi có nghĩa vụ đối với cả người Hy Lạp lẫn người man di[a], cả người khôn ngoan lẫn người ngu dại.
  rationale: Thay “mắc nợ” bằng “có nghĩa vụ đối với” để diễn đạt đúng nghĩa của ὀφειλέτης trong văn mạch mà vẫn giữ sắc thái bổn phận. Chỉnh chú thích để giải thích nhãn lịch sử βαρβάροις chính xác hơn và tránh thu hẹp nghĩa của từ.
