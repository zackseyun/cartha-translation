  text: Ἕλλησίν τε καὶ βαρβάροις, σοφοῖς τε καὶ ἀνοήτοις ὀφειλέτης εἰμί·
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/014.yaml
  text: I am under obligation both to Greeks and to barbarians[a], both to the wise and to the foolish.
translation:
  language: vi
  text: Tôi có nghĩa vụ đối với cả người Hy Lạp lẫn người man di[a], cả người khôn ngoan lẫn người ngu dại.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “người ngoại quốc” hoặc “người không phải Hy Lạp.” Ở đây, “người man di” phản ánh cách phân biệt văn hóa-xã hội thông thường giữa người Hy Lạp và những người không phải Hy Lạp, chứ không nhất thiết nói rằng họ man rợ về đạo đức.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἕλλησίν
  choice: người Hy Lạp
  rationale: Chỉ người Hy Lạp như một phạm trù dân tộc-văn hóa và giữ nguyên vế đầu trong cặp đối chiếu của Phao-lô.
- source_word: βαρβάροις
  choice: người man di
  rationale: Giữ sắc thái lịch sử của thuật ngữ Hy Lạp dùng để đối lập theo quy ước với “người Hy Lạp”; chú thích làm rõ rằng ở đây từ này không nhất thiết hàm ý dã man về đạo đức.
- source_word: σοφοῖς
  choice: người khôn ngoan
  rationale: Cách dịch trực tiếp, tự nhiên, giữ đối xứng với ἀνοήτοις.
- source_word: ἀνοήτοις
  choice: người ngu dại
  rationale: Giữ nghĩa rộng và sự tương phản súc tích với “người khôn ngoan”; “ít học” sẽ thu hẹp nghĩa quá mức.
- source_word: ὀφειλέτης
  choice: mắc nợ
  rationale: Giữ hình ảnh danh từ “con nợ/người mắc nợ” của nguyên văn; trong ngữ cảnh, đây là món nợ nghĩa vụ chứ không phải nợ tiền bạc.
- source_word: τε ... καὶ / τε ... καὶ
  choice: cả ... lẫn ... / cả ... lẫn ...
  rationale: Tái hiện hai cặp song hành cân đối trong cấu trúc Hy Lạp bằng lối diễn đạt tự nhiên của tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và súc tích. Dùng “mắc nợ” để bảo toàn ẩn dụ của nguyên văn, đồng thời chú thích thuật ngữ lịch sử “người man di” nhằm tránh cách hiểu miệt thị theo nghĩa hiện đại.
