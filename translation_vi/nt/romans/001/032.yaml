id: ROM.1.32
reference: Romans 1:32
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οἵτινες τὸ δικαίωμα τοῦ θεοῦ ἐπιγνόντες, ὅτι οἱ τὰ τοιαῦτα πράσσοντες ἄξιοι θανάτου εἰσίν, οὐ μόνον αὐτὰ ποιοῦσιν ἀλλὰ καὶ συνευδοκοῦσιν τοῖς πράσσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/032.yaml
  text: who[a], although they know God's righteous decree—that those who practice such things are worthy of death—not only do them but also approve of those who practice them.
translation:
  language: vi
  text: Dù biết phán quyết công chính của Đức Chúa Trời[a], tức là những người làm những điều như thế đáng phải chết, họ không những vẫn làm những điều ấy mà còn tán thành những người làm như vậy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “quy định công chính”, “đòi hỏi công chính” hoặc “án quyết công chính”.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἵτινες
  choice: họ
  rationale: Đại từ quan hệ này tiếp nối và mô tả những người đã được nói đến trong ngữ cảnh trước. Trong tiếng Việt, dùng “họ” để mở đầu câu độc lập tự nhiên hơn mà vẫn giữ rõ đối tượng.
- source_word: τὸ δικαίωμα τοῦ θεοῦ
  choice: phán quyết công chính của Đức Chúa Trời
  rationale: δικαίωμα ở đây mang sắc thái pháp lý và đạo đức, được giải thích bằng mệnh đề theo sau về việc đáng phải chết. “Phán quyết công chính” giữ được cả tính xét xử lẫn sự chính đáng của phán quyết.
- source_word: ἐπιγνόντες
  choice: dù biết
  rationale: 'Phân từ được hiểu theo sắc thái nhượng bộ trong ngữ cảnh: mặc dù biết phán quyết của Đức Chúa Trời, họ vẫn hành động như vậy. Không thêm ý “biết đầy đủ” vốn có thể diễn giải quá mức.'
- source_word: οἱ τὰ τοιαῦτα πράσσοντες
  choice: những người làm những điều như thế
  rationale: Cách diễn đạt tự nhiên, rõ ràng trong tiếng Việt; ngữ cảnh cho thấy đây là lối sống hay hành vi được thực hiện, chứ không nhất thiết chỉ một hành động đơn lẻ.
- source_word: ἄξιοι θανάτου
  choice: đáng phải chết
  rationale: Diễn đạt trực tiếp và tự nhiên sức nặng xét xử của cụm Hy Lạp mà không xác định thêm bản chất hay phạm vi của sự chết.
- source_word: ποιοῦσιν
  choice: vẫn làm
  rationale: “Làm” dịch trực tiếp động từ; “vẫn” làm nổi bật quan hệ nhượng bộ đã có trong “dù biết” mà không thay đổi nội dung.
- source_word: συνευδοκοῦσιν
  choice: tán thành
  rationale: Động từ chỉ sự đồng tình, chấp thuận hoặc ủng hộ hành vi của người khác; “tán thành” rõ và mạnh hơn việc chỉ đồng ý về mặt nhận thức.
- source_word: τοῖς πράσσουσιν
  choice: những người làm như vậy
  rationale: Giữ sự liên hệ với các hành vi vừa nhắc đến, đồng thời tránh lặp lại dài dòng trong tiếng Việt.
theological_decisions:
- issue: Ý nghĩa của “đáng phải chết”
  choice: Giữ nguyên như một phán quyết xét xử của Đức Chúa Trời, không xác định thêm sự chết thuộc loại nào.
  alternative: Hiểu riêng là án tử hình dân sự, hoặc hiểu rộng hơn là bao gồm sự chết cánh chung.
  rationale: Câu này khẳng định họ đáng phải chết nhưng không tự xác định toàn bộ phạm vi của “sự chết”; bản dịch giữ nguyên sức nặng thần học và sự rộng mở của nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cấu trúc “Dù biết… họ không những… mà còn…” tái hiện quan hệ nhượng bộ và phép đối xứng của nguyên văn. Dấu chú thích [a] được đặt ngay sau cụm từ có phương án dịch khác.
