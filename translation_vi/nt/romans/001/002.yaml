  text: là điều Ngài đã hứa từ trước qua các nhà tiên tri của Ngài trong các sách thánh[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “trong Kinh Thánh.”'
