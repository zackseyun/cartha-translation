lexical_decisions:
- source_word: ὃ
  choice: là điều
  rationale: Đại từ quan hệ giống trung số ít nối trực tiếp với “Tin Mừng” ở Rô-ma 1:1; “là điều” tạo liên kết tự nhiên trong tiếng Việt khi câu được đọc tiếp từ câu trước.
- source_word: προεπηγγείλατο
  choice: đã hứa từ trước
  rationale: Giữ cả ý nghĩa lời hứa của động từ và sắc thái thời gian đi trước của tiền tố προ-.
- source_word: διὰ τῶν προφητῶν αὐτοῦ
  choice: qua các nhà tiên tri của Ngài
  rationale: διά với sở hữu cách diễn tả phương tiện hoặc trung gian; cách dịch này cũng giữ rõ các nhà tiên tri thuộc về Đức Chúa Trời.
- source_word: ἐν γραφαῖς ἁγίαις
  choice: trong Kinh Thánh thánh
  rationale: “Trong” giữ sắc thái định vị của ἐν; “Kinh Thánh” diễn đạt nghĩa chuyên biệt của γραφαί trong ngữ cảnh, còn tính từ “thánh” được giữ lại thay vì để nghĩa ấy chỉ nằm trong danh xưng.
theological_decisions:
- issue: Nên hiểu γραφαῖς ἁγίαις là “Kinh Thánh thánh” hay “các sách thánh”
  choice: Kinh Thánh thánh
  alternative: các sách thánh
  rationale: Trong cách dùng của Phao-lô, γραφαί thường chỉ các văn bản được nhìn nhận là Kinh Thánh. Tuy nhiên, nguyên ngữ không có mạo từ và về mặt từ vựng vẫn có thể được hiểu là “các sách thánh”, nên ghi nhận phương án này trong chú thích.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. “Ngài” được dùng theo tiền cảnh của câu 1 để chỉ Đức Chúa Trời. Dấu phẩy cuối câu phản ánh việc câu 2 vẫn nằm trong cấu trúc cú pháp tiếp nối của Rô-ma 1:1–4.
