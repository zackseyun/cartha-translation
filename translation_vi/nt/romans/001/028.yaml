id: ROM.1.28
reference: Romans 1:28
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Καὶ καθὼς οὐκ ἐδοκίμασαν τὸν θεὸν ἔχειν ἐν ἐπιγνώσει, παρέδωκεν αὐτοὺς ὁ θεὸς εἰς ἀδόκιμον νοῦν, ποιεῖν τὰ μὴ καθήκοντα,
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/028.yaml
  text: And just as they did not see fit to have God in their knowledge[a], God gave them over to a debased mind, to do what is not fitting[b],
translation:
  language: vi
  text: Và cũng như họ không cho là đáng để có Đức Chúa Trời trong sự nhận biết của mình[a], Đức Chúa Trời đã phó mặc họ cho một tâm trí hư hoại[b], để làm những điều không thích hợp.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “để duy trì sự nhận biết về Đức Chúa Trời.”'
    reason: Cụm Hy Lạp ἔχειν ἐν ἐπιγνώσει có thể diễn tả việc có Đức Chúa Trời trong sự nhận biết hoặc duy trì sự nhận biết về Ngài.
  - marker: b
    text: 'Từ Hy Lạp được dịch là “hư hoại” có liên hệ với từ được dịch là “cho là đáng” ở phần đầu câu, tạo nên lối chơi chữ: họ không cho là đáng có Đức Chúa Trời trong sự nhận biết của mình, nên Đức Chúa Trời phó mặc họ cho một tâm trí “không đạt chuẩn.” Cũng có thể dịch: “một tâm trí không thích đáng.”'
    reason: Giải thích lối chơi chữ giữa ἐδοκίμασαν và ἀδόκιμον, đồng thời cung cấp một cách dịch gần hơn với nghĩa “không được chấp nhận/không đạt chuẩn” của ἀδόκιμον.
lexical_decisions:
- source_word: καθὼς
  choice: cũng như
  rationale: Giữ sắc thái so sánh/tương ứng của καθὼς giữa sự khước từ của con người và việc Đức Chúa Trời phó mặc họ, thay vì chỉ diễn giải thành quan hệ nguyên nhân.
- source_word: οὐκ ἐδοκίμασαν
  choice: không thấy đáng
  rationale: Diễn đạt hành vi đánh giá rồi không chấp thuận hoặc không coi là đáng; cách nói này tự nhiên trong tiếng Việt và phần nào giữ được sắc thái của δοκιμάζω.
- source_word: ἔχειν ἐν ἐπιγνώσει
  choice: giữ sự nhận biết về Đức Chúa Trời
  rationale: Phản ánh động từ ἔχειν và ý niệm duy trì Đức Chúa Trời trong sự nhận biết, đồng thời tránh lối diễn đạt quá cứng như 'có Đức Chúa Trời trong tri thức'.
- source_word: παρέδωκεν
  choice: đã phó mặc
  rationale: Diễn đạt rõ hành động Đức Chúa Trời để họ chịu hệ quả của lựa chọn mình, phù hợp sắc thái phán xét trong văn mạch và với động từ lặp lại ở Rô-ma 1.
- source_word: ἀδόκιμον νοῦν
  choice: một tâm trí hư hoại
  rationale: Là cách nói tự nhiên, dễ hiểu cho một tâm trí không vượt qua sự thử nghiệm, không còn thích hợp hay lành mạnh; tránh thuật ngữ giáo lý nặng hơn như 'tâm trí bị ruồng bỏ'.
- source_word: ποιεῖν τὰ μὴ καθήκοντα
  choice: để làm những điều không thích hợp
  rationale: Giữ cấu trúc nguyên mẫu chỉ mục đích/kết quả và chuyển tải trực tiếp ý nghĩa về những việc không phù hợp, không nên làm.
theological_decisions:
- issue: Mức độ mạnh của ἀδόκιμον νοῦν
  choice: một tâm trí hư hoại
  alternative: một tâm trí không thích đáng; một tâm trí suy đồi; một tâm trí bị loại bỏ
  rationale: '''Hư hoại'' truyền đạt tình trạng sai lệch nghiêm trọng trong văn mạch phán xét nhưng không nhập vào câu một thuật ngữ thần học hệ thống như ''bị ruồng bỏ''.'
- issue: Quan hệ giữa sự khước từ của con người và việc Đức Chúa Trời phó mặc
  choice: giữ 'cũng như' cho καθὼς
  alternative: bởi vì; vì
  rationale: Bản dịch không thu hẹp καθὼς thành quan hệ nhân quả thuần túy, nhờ đó giữ sự tương ứng có tính phán xét mà câu Hy Lạp biểu đạt.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Chúa Trời” nhất quán cho θεός; “phó mặc” giữ sắc thái phán xét mà không diễn giải quá mức. Dấu [a], [b] đều xuất hiện trong chính văn.
