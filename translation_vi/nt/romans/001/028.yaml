- from: Và cũng như họ không thấy đáng để giữ sự nhận biết về Đức Chúa Trời[a], Đức Chúa Trời đã phó mặc họ cho một tâm trí hư hoại[b], để làm những điều không thích hợp.
  to: Và cũng như họ không cho là đáng để có Đức Chúa Trời trong sự nhận biết của mình[a], Đức Chúa Trời đã phó mặc họ cho một tâm trí hư hoại[b], để làm những điều không thích hợp.
  rationale: Chỉnh tối thiểu cụm diễn đạt ἔχειν τὸν θεὸν ἐν ἐπιγνώσει để chính văn phản ánh trực tiếp hơn quan hệ cú pháp và ý nghĩa của nguyên ngữ, đồng thời sửa chú thích [a] cho nhất quán. Giữ nguyên lựa chọn “cũng như,” “phó mặc,” và “tâm trí hư hoại,” vì chúng có thể chuyển tải văn mạch và sắc thái phán xét mà không thêm diễn giải giáo phái.
