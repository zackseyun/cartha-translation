  terminology: «Đức Chúa Trời» phù hợp với đăng ký trang trọng của bản thảo. «Ngạo ngược, kiêu căng, khoác lác» phân biệt hợp lý các nét nghĩa của ὑβριστάς, ὑπερηφάνους, và ἀλαζόνας. Chú thích về θεοστυγεῖς cần gắn trực tiếp với cụm từ được chú thích, đồng thời bảo tồn nghĩa bị động còn tranh luận.
