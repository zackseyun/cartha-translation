  text: καταλάλους, θεοστυγεῖς, ὑβριστάς, ὑπερηφάνους, ἀλαζόνας, ἐφευρετὰς κακῶν, γονεῦσιν ἀπειθεῖς,
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/030.yaml
  text: slanderers[a], hateful to God, insolent, arrogant, boastful, inventors of evil, disobedient to parents,
translation:
  language: vi
  text: những kẻ vu khống, những kẻ ghét Đức Chúa Trời[a], ngạo ngược, kiêu căng, khoác lác, nghĩ ra những điều ác, không vâng lời cha mẹ,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “những kẻ bị Đức Chúa Trời ghét.”'
    reason: Bảo tồn cách hiểu bị động khả hữu của θεοστυγεῖς.
lexical_decisions:
- source_word: καταλάλους
  choice: những kẻ nói xấu người khác
  rationale: Từ này chỉ những người nói điều phương hại hoặc phỉ báng sau lưng người khác. Cách dịch này tự nhiên, dễ hiểu và giữ được sức nặng đạo đức của nguyên ngữ.
- source_word: θεοστυγεῖς
  choice: những kẻ ghét Đức Chúa Trời
  rationale: Hiểu theo nghĩa chủ động, từ này mô tả thái độ thù ghét Đức Chúa Trời và phù hợp với chuỗi các thói xấu của con người; nghĩa bị động khả hữu được giữ trong chú thích.
- source_word: ὑβριστάς
  choice: ngạo ngược
  rationale: Diễn tả thái độ xấc xược, lấn át và xúc phạm người khác; từ này phân biệt tương đối rõ với các ý niệm kiêu căng và khoác lác ngay sau đó.
- source_word: ὑπερηφάνους
  choice: kiêu căng
  rationale: Diễn tả sự tự tôn và coi mình cao hơn người khác bằng một từ thông dụng, trang trọng vừa phải trong tiếng Việt hiện đại.
- source_word: ἀλαζόνας
  choice: khoác lác
  rationale: Nêu bật lối phô trương, huênh hoang và tự đề cao của người hay khoe khoang, đồng thời đọc tự nhiên trong danh sách.
- source_word: ἐφευρετὰς κακῶν
  choice: bày ra điều ác
  rationale: Giữ ý những người nghĩ ra, devising các cách làm ác mới; cách nói này tự nhiên hơn lối dịch sát chữ “những kẻ phát minh điều ác” trong tiếng Việt.
- source_word: γονεῦσιν ἀπειθεῖς
  choice: không vâng lời cha mẹ
  rationale: Chuyển đạt trực tiếp quan hệ của tính từ ἀπειθεῖς với danh từ ở cách dữ cách, rõ ràng và tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Nghĩa của θεοστυγεῖς
  choice: 'nghĩa chủ động: “những kẻ ghét Đức Chúa Trời”'
  alternative: 'nghĩa bị động: “những kẻ bị Đức Chúa Trời ghét”'
  rationale: Nghĩa chủ động phù hợp hơn với mạch liệt kê các thái độ và hành vi của con người. Tuy nhiên, vì hình thái từ đã được hiểu theo nghĩa bị động trong lịch sử giải nghĩa, phương án ấy được bảo tồn trong chú thích thay vì bị loại bỏ.
translation_notes:
  register: Bản dịch dùng tiếng Việt hiện đại, trang nghiêm nhưng dễ hiểu. Chuỗi danh từ và tính từ được giữ ngắn gọn để phản ánh nhịp dồn dập của danh sách nguyên ngữ; thêm “những kẻ” ở hai mục đầu để câu tiếng Việt rõ nghĩa, rồi lược đi ở các mục sau nhằm tránh nặng nề.
