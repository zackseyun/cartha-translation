  source_fidelity: 'Cần chỉnh hai điểm để sát nguyên ngữ hơn: καταλάλους là những người phỉ báng/vu khống, mạnh hơn cách nói rộng «nói xấu người khác»; và ἐφευρετὰς κακῶν nhấn mạnh việc nghĩ ra hoặc sáng chế điều ác, trong khi «bày ra điều ác» có thể được hiểu là phô bày điều ác.'
