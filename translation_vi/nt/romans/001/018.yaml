    rationale: Cụm này dễ được hiểu là thiếu lòng kính sợ theo nghĩa tâm lý/đạo đức cá nhân. “Bất kính đối với Đức Chúa Trời” tự nhiên hơn và bao quát thái độ/hành vi không tôn kính Đức Chúa Trời.
