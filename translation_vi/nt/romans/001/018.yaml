id: ROM.1.18
reference: Romans 1:18
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἀποκαλύπτεται γὰρ ὀργὴ θεοῦ ἀπ’ οὐρανοῦ ἐπὶ πᾶσαν ἀσέβειαν καὶ ἀδικίαν ἀνθρώπων τῶν τὴν ἀλήθειαν ἐν ἀδικίᾳ κατεχόντων,
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/018.yaml
  text: For the wrath of God is being revealed from heaven against all ungodliness and unrighteousness of people who suppress the truth in unrighteousness[a][b][c][d][e].
translation:
  language: vi
  text: Vì cơn thịnh nộ của Đức Chúa Trời đang được bày tỏ từ trời chống lại mọi sự bất kính đối với Đức Chúa Trời và bất chính của những người lấy sự bất chính mà đè nén chân lý.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “được bày tỏ.”'
    reason: lexical_alternative
  - marker: b
    text: “Đè nén” cũng có thể được dịch là “kìm giữ” hoặc “ngăn cản” trong ngữ cảnh này.
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể dịch: “những người đè nén chân lý trong sự bất chính.”'
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: Ἀποκαλύπτεται
  choice: đang được bày tỏ
  rationale: Thì hiện tại, thể bị động; cách dịch này diễn đạt hành động đang diễn ra mà không loại trừ sắc thái khái quát “được bày tỏ”.
- source_word: γὰρ
  choice: Vì
  rationale: Giữ chức năng giải thích hoặc nêu cơ sở cho mạch lập luận ngay trước đó của Phao-lô.
- source_word: ὀργὴ θεοῦ
  choice: cơn thịnh nộ của Đức Chúa Trời
  rationale: Giữ sức nặng về phản ứng phán xét mang tính cá vị của Đức Chúa Trời; “cơn thịnh nộ” trang trọng và tự nhiên trong văn phong Kinh Thánh tiếng Việt.
- source_word: ἀπ’ οὐρανοῦ
  choice: từ trời
  rationale: Diễn đạt trực tiếp nguồn phát xuất từ cõi trời.
- source_word: πᾶσαν ἀσέβειαν
  choice: mọi sự không kính sợ Đức Chúa Trời
  rationale: Làm rõ chiều hướng của ἀσέβεια là thái độ thiếu tôn kính đối với Đức Chúa Trời, thay vì một từ Hán-Việt khó hiểu.
- source_word: ἀδικίαν
  choice: sự bất chính
  rationale: Giữ phạm vi đạo đức và quan hệ rộng của ἀδικία, đồng thời phù hợp với cách dùng của Phao-lô.
- source_word: ἀνθρώπων
  choice: những người
  rationale: Chỉ con người nói chung, không giới hạn ở nam giới.
- source_word: τῶν ... κατεχόντων
  choice: những người ... đè nén
  rationale: Trong ngữ cảnh, κατέχω mang nghĩa kìm giữ, cản trở hay áp chế chân lý; “đè nén” giữ được hình ảnh và sức mạnh của động từ.
- source_word: τὴν ἀλήθειαν
  choice: chân lý
  rationale: Bản dịch trực tiếp, tự nhiên và trang trọng; ngữ cảnh không đòi hỏi thu hẹp nội hàm.
- source_word: ἐν ἀδικίᾳ
  choice: lấy sự bất chính mà
  rationale: 'Diễn đạt tự nhiên cách hiểu phương tiện hoặc cách thức: họ dùng sự bất chính để đè nén chân lý; cách hiểu theo phạm vi vẫn được ghi chú.'
theological_decisions:
- issue: Có nên làm nhẹ ὀργὴ θεοῦ thành một hậu quả đạo đức phi cá vị hay không
  choice: Giữ là “cơn thịnh nộ của Đức Chúa Trời”, tức phản ứng phán xét của chính Ngài
  alternative: Một tiến trình hậu quả đạo đức mang tính phi cá vị
  rationale: Cấu trúc sở hữu và lập luận của Phao-lô trình bày phản ứng của Đức Chúa Trời, không chỉ một quy luật hậu quả trừu tượng.
- issue: Quan hệ của ἐν ἀδικίᾳ với hành động đè nén chân lý
  choice: 'Phương tiện hoặc cách thức: “lấy sự bất chính mà đè nén”'
  alternative: 'Phạm vi hoặc trạng thái: “đè nén chân lý trong sự bất chính”'
  rationale: ἐν có thể chỉ phương tiện, cách thức hoặc phạm vi. Bản chính chọn cách diễn đạt tự nhiên hơn trong tiếng Việt nhưng giữ cách hiểu kia trong chú thích để không xóa bỏ tính mơ hồ thật của nguyên văn.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “Đức Chúa Trời” nhất quán cho θεός; tránh từ ngữ giáo phái. Giữ sự lặp lại của ἀδικία bằng “sự bất chính” ở cả hai vị trí vì sự lặp này có ý nghĩa tu từ và thần học.
