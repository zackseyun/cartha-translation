    rationale: Chú thích a liên quan đến δικαιοσύνη θεοῦ, còn b liên quan đến ἐκ πίστεως εἰς πίστιν. Đặt từng ký hiệu ngay sau cụm tương ứng sẽ rõ hơn mà không thay đổi nghĩa.
