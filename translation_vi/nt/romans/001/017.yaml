- from: 'Vì trong Tin Mừng ấy, sự công chính của Đức Chúa Trời được bày tỏ, từ đức tin đến đức tin,[a][b] như có lời chép: “Người công chính sẽ sống bởi đức tin.”[c][d]'
  to: 'Vì trong Tin Mừng ấy, sự công chính của Đức Chúa Trời[a] được bày tỏ từ đức tin đến đức tin[b], như có lời chép: “Người công chính[c] sẽ sống bởi đức tin.”[d]'
  rationale: 'Sửa chú thích c để bảo lưu đúng độ mơ hồ cú pháp của ἐκ πίστεως: cụm này có thể bổ nghĩa cho “người công chính,” nhưng nguyên văn không nói rõ người ấy “được xưng là” công chính. Đồng thời dời các ký hiệu a và b đến ngay sau những cụm từ mà chúng giải thích, giúp các neo chú thích minh bạch hơn.'
