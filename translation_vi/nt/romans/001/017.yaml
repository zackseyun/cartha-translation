id: ROM.1.17
reference: Romans 1:17
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: δικαιοσύνη γὰρ θεοῦ ἐν αὐτῷ ἀποκαλύπτεται ἐκ πίστεως εἰς πίστιν, καθὼς γέγραπται· Ὁ δὲ δίκαιος ἐκ πίστεως ζήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/017.yaml
  text: 'For in it the righteousness of God is revealed from faith to faith[d][c][b][a], just as it is written: “The righteous one shall live by faith.”'
translation:
  language: vi
  text: 'Vì trong Tin Mừng ấy, sự công chính của Đức Chúa Trời[a] được bày tỏ từ đức tin đến đức tin[b], như có lời chép: “Người công chính[c] sẽ sống bởi đức tin.”[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch “sự công lý của Đức Chúa Trời” hoặc “sự công chính đến từ Đức Chúa Trời.”
    reason: lexical_alternative
  - marker: b
    text: Cụm Hy Lạp “từ đức tin đến đức tin” rất khó xác định nghĩa. Cách dịch này giữ nguyên hai giới từ và phép lặp; những cách hiểu khác gồm “từ đức tin nhằm dẫn đến đức tin,” “hoàn toàn bởi đức tin,” hoặc “qua đức tin, hướng đến đức tin.”
    reason: alternative_reading
  - marker: c
    text: 'Cũng có thể hiểu: “Người công chính bởi đức tin sẽ sống.”'
    reason: alternative_reading
  - marker: d
    text: 'Nguyên văn cũng có thể được dịch: “Nhưng người công chính sẽ sống bởi đức tin.”'
    reason: previous_rendering
lexical_decisions:
- source_word: δικαιοσύνη θεοῦ
  choice: sự công chính của Đức Chúa Trời
  rationale: Giữ cấu trúc sở hữu cách của Hy Lạp và cách diễn đạt thần học quen thuộc, nhưng không quyết định đó là phẩm tính của Đức Chúa Trời hay sự công chính đến từ Ngài.
- source_word: ἐν αὐτῷ
  choice: trong Tin Mừng ấy
  rationale: Đại từ trung tính αὐτῷ quy chiếu tự nhiên nhất về εὐαγγέλιον ở câu 16; lặp lại danh từ giúp tiếng Việt rõ nghĩa hơn đại từ “trong đó” khi câu được đọc riêng.
- source_word: ἀποκαλύπτεται
  choice: được bày tỏ
  rationale: Diễn đạt tự nhiên thể bị động hiện tại, không thêm cách hiểu đặc thù về tiến trình hay thời điểm.
- source_word: ἐκ πίστεως εἰς πίστιν
  choice: từ đức tin đến đức tin
  rationale: Bảo toàn cả hai giới từ và phép lặp của nguyên văn, không đóng khung cụm từ khó này vào một cách giải thích duy nhất.
- source_word: δίκαιος
  choice: người công chính
  rationale: Chuyển tính từ dùng như danh từ sang lối nói tự nhiên, trang trọng và không nhất thiết giới hạn giới tính trong tiếng Việt.
- source_word: ἐκ πίστεως
  choice: bởi đức tin
  rationale: Lối dịch cô đọng, quen thuộc và phù hợp ngữ cảnh trích dẫn, đồng thời vẫn để ngỏ quan hệ cú pháp với “công chính” hoặc “sẽ sống”.
- source_word: ζήσεται
  choice: sẽ sống
  rationale: Giữ rõ ý tương lai của động từ bằng cách diễn đạt tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Ý nghĩa của δικαιοσύνη θεοῦ
  choice: sự công chính của Đức Chúa Trời
  alternative: sự công lý của Đức Chúa Trời; sự công chính đến từ Đức Chúa Trời
  rationale: Cấu trúc sở hữu cách có nhiều cách hiểu thần học hợp lý; bản văn chính giữ cách dịch minh bạch và truyền thống, còn chú thích nêu các khả năng quan trọng.
- issue: Ý nghĩa của ἐκ πίστεως εἰς πίστιν
  choice: từ đức tin đến đức tin
  alternative: từ đức tin nhằm dẫn đến đức tin; hoàn toàn bởi đức tin; qua đức tin, hướng đến đức tin
  rationale: Đây là một nan đề nổi tiếng. Cách dịch sát cấu trúc giữ nguyên sự mơ hồ thật của nguyên văn thay vì chọn trước một cách giải thích.
- issue: Vị trí gắn kết của ἐκ πίστεως trong lời trích Ha-ba-cúc
  choice: người công chính sẽ sống bởi đức tin
  alternative: người được xưng là công chính bởi đức tin sẽ sống
  rationale: Nguyên văn có thể cho phép cụm giới từ bổ nghĩa cho “công chính” hoặc “sẽ sống”; bản chính theo cách hiểu tự nhiên và quen thuộc, còn chú thích bảo lưu cách gắn kết khác.
- issue: Chức năng của δὲ trong lời trích
  choice: không dịch thành một liên từ riêng
  alternative: Nhưng người công chính sẽ sống bởi đức tin
  rationale: Trong ngữ cảnh này, δὲ không nhất thiết biểu thị sự tương phản mạnh; bỏ liên từ tránh tạo một quan hệ đối lập gây hiểu lầm, đồng thời chú thích lưu lại cách dịch sát hình thức.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “Đức Chúa Trời” theo cách gọi nhất quán của bản thảo; “Tin Mừng ấy” làm rõ đại từ hồi chỉ. Các dấu chú thích đều xuất hiện trong câu chính và được đặt sát phần văn bản liên quan.
