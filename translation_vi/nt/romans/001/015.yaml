id: ROM.1.15
reference: Romans 1:15
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οὕτως τὸ κατ’ ἐμὲ πρόθυμον καὶ ὑμῖν τοῖς ἐν Ῥώμῃ εὐαγγελίσασθαι.
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/015.yaml
  text: So[a], for my part, I am eager to proclaim the good news also to you who are in Rome.
translation:
  language: vi
  text: Vì thế, về phần tôi, tôi tha thiết muốn công bố Tin Mừng cho anh chị em ở Rô-ma nữa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “rao giảng Tin Mừng cho anh chị em ở Rô-ma nữa.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως
  choice: Vì thế
  rationale: Trong ngữ cảnh, từ này nối kết theo nghĩa suy luận/kết luận với phần giải thích trước đó; “Vì thế” tự nhiên và rõ nghĩa trong tiếng Việt hiện đại.
- source_word: τὸ κατ’ ἐμὲ πρόθυμον
  choice: về phần tôi, tôi rất sẵn lòng
  rationale: Cụm Hy Lạp mang tính tỉnh lược và thành ngữ. Cách dịch này giữ cả ý thuộc về lập trường của Phao-lô lẫn sự nhiệt thành, tự nguyện của πρόθυμον, thay vì chỉ diễn đạt khả năng hay sự chuẩn bị.
- source_word: καὶ ὑμῖν
  choice: cho cả anh chị em
  rationale: '“Cả” thể hiện ý bao gồm của καὶ: những người tại Rô-ma cũng nằm trong số những người Phao-lô mong muốn rao truyền Tin Mừng.'
- source_word: τοῖς ἐν Ῥώμῃ
  choice: là những người đang ở Rô-ma
  rationale: Cách diễn đạt xác định rõ người nhận và chuyển tải tự nhiên cấu trúc mạo từ cộng cụm giới từ trong tiếng Hy Lạp.
- source_word: εὐαγγελίσασθαι
  choice: công bố Tin Mừng
  rationale: Động từ có nghĩa loan báo tin mừng/Tin Mừng. “Công bố” không giới hạn hành động vào một hình thức giảng thuyết chính thức, còn “Tin Mừng” là cách gọi quen thuộc, trang trọng trong tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh chị em” để diễn đạt đại từ số nhiều ὑμῖν một cách tự nhiên và bao hàm; giữ “Rô-ma” theo lối phiên âm quen thuộc. Dấu chú thích [a] được đặt sau toàn câu vì chú thích nêu phương án dịch cho cụm động từ và phần bổ ngữ đi kèm.
