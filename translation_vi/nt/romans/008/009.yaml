id: ROM.8.9
reference: Romans 8:9
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ὑμεῖς δὲ οὐκ ἐστὲ ἐν σαρκὶ ἀλλὰ ἐν πνεύματι, εἴπερ πνεῦμα θεοῦ οἰκεῖ ἐν ὑμῖν. εἰ δέ τις πνεῦμα Χριστοῦ οὐκ ἔχει, οὗτος οὐκ ἔστιν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/009.yaml
  text: But you are not in the flesh but in the Spirit[a], if indeed the Spirit of God dwells in you. But if anyone does not have the Spirit of Messiah[c][b], he does not belong to him.
translation:
  language: vi
  text: Nhưng anh em không ở trong xác thịt[a], mà ở trong Thánh Linh, nếu quả thật Thánh Linh của Đức Chúa Trời ngự trong anh em. Còn nếu ai không có Thánh Linh của Đấng Mê-si-a[b], người ấy không thuộc về Ngài.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “bản tính tội lỗi.” Tiếng Hy Lạp sát nghĩa là “xác thịt.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “Đấng Christ.”'
    reason: lexical_alternative
  - marker: c
    text: 'Sát nghĩa: “người ấy không phải là của Ngài.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: σάρξ
  choice: xác thịt
  rationale: Giữ thuật ngữ đặc trưng của Phao-lô và hình ảnh về lĩnh vực hay trạng thái hiện hữu; không thu hẹp nghĩa thành thân thể vật chất hoặc diễn giải thẳng là bản tính tội lỗi.
- source_word: πνεῦμα
  choice: Thánh Linh
  rationale: Ngữ cảnh đồng nhất πνεῦμα với Thánh Linh của Đức Chúa Trời và của Đấng Mê-si-a; cách viết hoa và cách gọi này làm rõ đây không phải tâm linh hay tâm trí con người.
- source_word: οἰκεῖ
  choice: ngự
  rationale: Diễn đạt sự hiện diện cư ngụ bền vững, tự nhiên trong văn phong Kinh Thánh tiếng Việt và trang trọng hơn nghĩa đơn thuần là sống.
- source_word: Χριστοῦ
  choice: Đấng Mê-si-a
  rationale: Χριστός được dùng như tước hiệu; “Đấng Mê-si-a” bảo tồn ý nghĩa tước hiệu thay vì làm nó giống tên riêng.
- source_word: οὐκ ἔστιν αὐτοῦ
  choice: không thuộc về Ngài
  rationale: Chuyển thành ngữ sở hữu Hy Lạp sang cách nói tự nhiên trong tiếng Việt mà vẫn giữ quan hệ thuộc về.
- source_word: εἴπερ
  choice: nếu quả thật
  rationale: Giữ hình thức điều kiện đồng thời thể hiện sắc thái giả định được người viết xem là có cơ sở.
- source_word: Ὑμεῖς
  choice: anh em
  rationale: Đại từ số nhiều được nêu rõ và mang tính nhấn mạnh; “anh em” phù hợp cách Phao-lô trực tiếp nói với cộng đồng tín hữu.
- source_word: οὗτος
  choice: người ấy
  rationale: Diễn đạt tự nhiên lực chỉ định của đại từ Hy Lạp và vẫn áp dụng cho bất cứ người nào.
theological_decisions:
- issue: Sự đối lập giữa “ở trong xác thịt” và “ở trong Thánh Linh”
  choice: Giữ nguyên ngôn ngữ về lĩnh vực hay trạng thái hiện hữu gắn với sự ngự trị của Thánh Linh.
  alternative: Diễn giải thành sự đối lập giữa bản tính tội lỗi và đời sống do Thánh Linh điều khiển.
  rationale: Bản dịch giữ các phạm trù thần học và sự căng thẳng trong cách diễn đạt của Phao-lô, không thu hẹp chúng thành một cách giải thích tâm lý hay hệ phái.
- issue: Từ quy chiếu của “Ngài” trong mệnh đề cuối
  choice: Không nêu đích danh; theo mạch ngữ pháp gần nhất, đại từ có thể quy về Đấng Mê-si-a.
  alternative: Thay “Ngài” bằng “Đức Chúa Trời” dựa trên mạch văn rộng hơn.
  rationale: Nguyên văn chỉ dùng đại từ; giữ đại từ tránh xác định quá mức điều câu Hy Lạp không nói rõ tuyệt đối.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Giữ “ở trong xác thịt” và “ở trong Thánh Linh” để bảo tồn hình ảnh không gian–hiện hữu của nguyên văn. Dùng “Đức Chúa Trời,” “Thánh Linh” và “Đấng Mê-si-a” nhất quán; viết hoa “Ngài” theo quy ước kính ngữ phổ biến trong văn bản Kinh Thánh tiếng Việt.
