  to: Nhưng anh em không ở trong xác thịt[a], mà ở trong Thánh Linh, nếu quả thật Thánh Linh của Đức Chúa Trời ngự trong anh em. Còn nếu ai không có Thánh Linh của Đấng Mê-si-a[b], người ấy không thuộc về Ngài.[c]
