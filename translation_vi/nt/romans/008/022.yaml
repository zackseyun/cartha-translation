  text: οἴδαμεν γὰρ ὅτι πᾶσα ἡ κτίσις συστενάζει καὶ συνωδίνει ἄχρι τοῦ νῦν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/022.yaml
  text: For we know that the whole creation groans together and suffers labor pains together until now[a][b].
translation:
  language: vi
  text: Vì chúng ta biết rằng toàn thể thọ tạo cùng rên xiết và cùng quằn quại trong cơn đau sinh nở cho đến bây giờ[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “cả cõi thọ tạo” hoặc “muôn vật”; tuy nhiên, trong văn cảnh này, nghĩa rộng chỉ toàn bộ cõi sáng tạo có lẽ phù hợp hơn.
    reason: lexical_alternative
  - marker: b
    text: 'Cụm từ “quằn quại trong cơn đau sinh nở” gợi hình ảnh đau đẻ: không chỉ là đau khổ, mà là đau khổ hướng tới sự sống mới.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἴδαμεν
  choice: chúng ta biết
  rationale: οἶδα tuy có hình thức hoàn thành nhưng thường mang nghĩa hiện tại; cách dịch này diễn đạt một nhận thức chung, vững chắc và tự nhiên trong tiếng Việt.
- source_word: γὰρ
  choice: Vì
  rationale: Giữ chức năng giải thích và liên kết câu này với lập luận ngay trước đó.
- source_word: πᾶσα ἡ κτίσις
  choice: toàn thể tạo vật
  rationale: 'Mạo từ đi với πᾶσα thiên về nghĩa tập hợp: toàn bộ cõi được tạo dựng. “Tạo vật” tự nhiên, trang trọng và giữ được phạm vi rộng trong văn cảnh, không thu hẹp vào từng sinh vật riêng lẻ.'
- source_word: συστενάζει
  choice: cùng nhau rên xiết
  rationale: Giữ sắc thái than rên và ý nghĩa đồng chịu, đồng rên của tiền tố συν-.
- source_word: συνωδίνει
  choice: cùng nhau chịu cơn đau sinh nở
  rationale: Diễn đạt cụ thể hình ảnh đau đẻ của ὠδίνω, đồng thời giữ chiều kích cộng đồng của tiền tố συν-; không làm thành đau khổ chung chung.
- source_word: ἄχρι τοῦ νῦν
  choice: cho đến bây giờ
  rationale: Cách nói hiện đại, rõ ràng, giữ ý tình trạng vẫn tiếp diễn tới thời điểm hiện tại.
theological_decisions:
- issue: 'Phạm vi của κτίσις: toàn thể công trình sáng tạo hay từng tạo vật riêng lẻ'
  choice: toàn thể tạo vật
  alternative: mọi tạo vật; mỗi vật được tạo dựng
  rationale: Trong Rô-ma 8:19–23, κτίσις được nhân cách hóa và có phạm vi vũ trụ, chịu cảnh hư không rồi trông chờ được giải thoát. Cách dịch tập hợp giữ phạm vi ấy mà không xác định quá mức chính xác những thành phần được bao gồm.
- issue: Ý nghĩa của hình ảnh συνωδίνει
  choice: giữ rõ hình ảnh cơn đau sinh nở
  alternative: cùng nhau chịu đau khổ
  rationale: Động từ không chỉ nói đến đau đớn nói chung mà gợi cơn đau sinh nở. Giữ hình ảnh này bảo toàn sức căng giữa đau khổ hiện tại và viễn cảnh sự sống mới, nhưng không diễn giải thêm kết quả ngay trong chính văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Rên xiết” giữ sắc thái mạnh của động từ Hy Lạp; việc lặp “cùng nhau” là có chủ ý để phản ánh hai động từ đều mang tiền tố συν-, dù câu tiếng Việt vì thế có nhịp nhấn mạnh hơn.
