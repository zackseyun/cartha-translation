source:
  edition: SBLGNT
  text: ὁ δὲ ἐραυνῶν τὰς καρδίας οἶδεν τί τὸ φρόνημα τοῦ πνεύματος, ὅτι κατὰ θεὸν ἐντυγχάνει ὑπὲρ ἁγίων.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/027.yaml
  text: And he who searches hearts knows what the mindset of the Spirit is, because he intercedes for the saints according to God.
translation:
  language: vi
  text: Đấng dò xét lòng người biết tâm trí của Thánh Linh là gì, vì Thánh Linh cầu thay cho các thánh theo ý Đức Chúa Trời.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát: “theo Đức Chúa Trời”; cũng có thể hiểu là “phù hợp với ý muốn của Đức Chúa Trời.”'
    reason: Bảo lưu cách diễn đạt ngắn gọn và mức độ hàm ẩn của κατὰ θεὸν trong nguyên văn.
lexical_decisions:
- source_word: ἐραυνῶν
  choice: dò xét
  rationale: Diễn đạt sắc thái chủ động, thấu suốt của động từ ἐραυνάω và phù hợp với đối tượng là lòng người.
- source_word: καρδίας
  choice: lòng người
  rationale: Giữ hình ảnh nhân học Kinh Thánh của καρδία, đồng thời dùng cách nói tự nhiên trong tiếng Việt và cho thấy dạng số nhiều.
- source_word: τί τὸ φρόνημα
  choice: tâm trí ... là gì
  rationale: φρόνημα chỉ khuynh hướng tư tưởng, ý hướng hay cách suy nghĩ; “tâm trí” tự nhiên, trang trọng và không thu hẹp nghĩa thành một ý định đơn lẻ.
- source_word: τοῦ πνεύματος
  choice: của Thánh Linh
  rationale: Ngữ cảnh Rô-ma 8 nói về Thánh Linh; cách viết hoa và danh xưng này làm rõ sở chỉ mà không thêm nội dung giáo phái.
- source_word: ἐντυγχάνει
  choice: cầu thay
  rationale: Thể hiện đúng nghĩa chuyển cầu trong ngữ cảnh cầu nguyện của câu trước.
- source_word: ὑπὲρ ἁγίων
  choice: cho các thánh đồ
  rationale: “Cho” diễn đạt tự nhiên ὑπέρ với nghĩa vì lợi ích/thay mặt; “các thánh đồ” giữ thuật ngữ quen thuộc của Phao-lô dành cho những người thuộc về Đức Chúa Trời.
- source_word: κατὰ θεὸν
  choice: theo ý Đức Chúa Trời
  rationale: Trong cấu trúc này, κατά + đối cách diễn tả sự phù hợp với Đức Chúa Trời; tiếng Việt cần bổ sung “ý” để câu tự nhiên, nhưng ghi chú bảo lưu cách dịch sát mặt chữ.
theological_decisions:
- issue: Có nên làm rõ κατὰ θεὸν là sự phù hợp với ý muốn của Đức Chúa Trời hay không
  choice: theo ý Đức Chúa Trời
  alternative: theo Đức Chúa Trời
  rationale: Bản chính dùng lối diễn đạt tự nhiên và đúng nghĩa trong tiếng Việt; chú thích bảo tồn cấu trúc cô đọng của tiếng Hy Lạp, vốn không có danh từ “ý”.
- issue: Sở chỉ của πνεῦμα
  choice: Thánh Linh
  alternative: linh
  rationale: Ngữ cảnh trực tiếp Rô-ma 8:26–27 trình bày chính Thánh Linh cầu thay, nên hiểu là Thánh Linh chứ không phải linh của con người.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Đại từ được thay bằng danh xưng “Đấng” và “Thánh Linh” để tránh sự mơ hồ không tự nhiên trong tiếng Việt; nhịp câu vẫn giữ gần cấu trúc Hy Lạp.
