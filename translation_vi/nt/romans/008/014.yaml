  source_fidelity: 'Bản dịch chuyển tải đúng cấu trúc và ý nghĩa của ὅσοι γὰρ πνεύματι θεοῦ ἄγονται, οὗτοι υἱοί εἰσιν θεοῦ: mệnh đề giải thích “Vì”, phạm vi bao quát “tất cả những ai”, thể bị động của ἄγονται qua “được ... dẫn dắt”, và quan hệ “... đều là ... của Đức Chúa Trời”. “Những người con” diễn đạt phạm vi quy chiếu bao gồm của câu trong tiếng Việt; chú thích minh bạch rằng υἱοί có hình thức “các con trai” và giữ sắc thái nhận làm con/thừa kế của văn cảnh.'
  naturalness: Câu tiếng Việt hiện đại, trang trọng, trôi chảy. Kết cấu “tất cả những ai ... đều là ...” tự nhiên và truyền đạt thích hợp tính tương liên, nhấn mạnh của ὅσοι ... οὗτοι. “Được Thánh Linh của Đức Chúa Trời dẫn dắt” là cách nói rõ ràng, phù hợp văn phong Kinh Thánh tiếng Việt.
  terminology: “Thánh Linh của Đức Chúa Trời” và “những người con của Đức Chúa Trời” nhất quán, dễ hiểu trong đăng ký Cơ Đốc giáo Việt ngữ. Chú thích không áp đặt diễn giải giáo phái mà chỉ giải thích hình thức giống đực của υἱοί và sắc thái ngữ cảnh liên quan đến việc nhận làm con, quyền thừa kế.
