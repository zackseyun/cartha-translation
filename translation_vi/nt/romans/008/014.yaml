id: ROM.8.14
reference: Romans 8:14
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὅσοι γὰρ πνεύματι θεοῦ ἄγονται, οὗτοι ⸂υἱοί εἰσιν θεοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/014.yaml
  text: For all who are led by the Spirit of God[a], these are sons of God.
translation:
  language: vi
  text: Vì tất cả những ai được Thánh Linh của Đức Chúa Trời dẫn dắt đều là những người con[a] của Đức Chúa Trời.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hy Lạp: “các con trai”. Trong văn cảnh này, cách gọi ấy gợi đến địa vị được nhận làm con và quyền thừa kế; ý nghĩa bao gồm cả nam lẫn nữ.'
    reason: Giải thích hình thức giống đực của υἱοί và sắc thái nhận làm con, thừa kế mà cách dịch tự nhiên “những người con” có thể không thể hiện đầy đủ.
lexical_decisions:
- source_word: ὅσοι
  choice: tất cả những ai
  rationale: Diễn đạt tự nhiên cấu trúc tương liên số nhiều, đồng thời giữ ý bao quát về toàn bộ nhóm người được nói đến.
- source_word: γὰρ
  choice: vì
  rationale: Giữ chức năng giải thích, nối câu này với lập luận ngay trước đó.
- source_word: πνεύματι θεοῦ
  choice: được Thánh Linh của Đức Chúa Trời
  rationale: Kết hợp với động từ bị động “dẫn dắt” để thể hiện cách dùng công cụ của cách dữ; “Thánh Linh của Đức Chúa Trời” là cách gọi trang trọng, rõ nghĩa và quen thuộc trong tiếng Việt.
- source_word: ἄγονται
  choice: dẫn dắt
  rationale: Trong cấu trúc “được… dẫn dắt”, cách dịch này giữ thể bị động và sắc thái hiện tại đang tiếp diễn mà không diễn giải quá mức.
- source_word: οὗτοι
  choice: đều là
  rationale: Cấu trúc “tất cả những ai… đều là…” chuyển tải tự nhiên sức nhấn của đại từ chỉ định οὗτοι trong tiếng Việt.
- source_word: υἱοί
  choice: những người con
  rationale: Đây là cách diễn đạt tự nhiên và bao hàm trong tiếng Việt; chú thích ghi rõ nguyên văn Hy Lạp là danh từ giống đực “các con trai”, qua đó bảo tồn sắc thái nhận làm con và quyền thừa kế trong văn cảnh.
- source_word: θεοῦ
  choice: của Đức Chúa Trời
  rationale: Dịch trực tiếp sở hữu cách và giữ sự lặp lại “của Đức Chúa Trời” ở cả hai vị trí trong câu.
theological_decisions:
- issue: Nên chuyển υἱοί θεοῦ là “các con trai của Đức Chúa Trời” hay bằng cách diễn đạt bao hàm, tự nhiên hơn trong tiếng Việt.
  choice: những người con của Đức Chúa Trời
  alternative: các con trai của Đức Chúa Trời
  rationale: υἱοί là danh từ giống đực số nhiều và trong Rô-ma 8 gắn với việc được nhận làm con cùng quyền thừa kế. Tuy nhiên, “các con trai của Đức Chúa Trời” trong tiếng Việt hiện đại dễ bị hiểu là chỉ nam giới hoặc quan hệ sinh học, trong khi Phao-lô nói đến toàn thể những người được Thánh Linh dẫn dắt. Bản chính dùng “những người con” cho đúng phạm vi quy chiếu, còn chú thích bảo tồn hình thức và sắc thái thần học của từ Hy Lạp.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cấu trúc tương liên “tất cả những ai… đều…” vừa tự nhiên trong tiếng Việt vừa giữ sức nhấn của ὅσοι… οὗτοι. Dùng “Thánh Linh” theo cách gọi Cơ Đốc giáo phổ thông; không thêm ý chỉ sự hướng dẫn đơn thuần hay giải quyết quá mức bản chất của việc được Thánh Linh dẫn dắt.
