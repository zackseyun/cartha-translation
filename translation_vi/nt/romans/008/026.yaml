id: ROM.8.26
reference: Romans 8:26
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ὡσαύτως δὲ καὶ τὸ πνεῦμα συναντιλαμβάνεται ⸂τῇ ἀσθενείᾳ⸃ ἡμῶν· τὸ γὰρ τί ⸀προσευξώμεθα καθὸ δεῖ οὐκ οἴδαμεν, ἀλλὰ αὐτὸ τὸ πνεῦμα ⸀ὑπερεντυγχάνει στεναγμοῖς ἀλαλήτοις,
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/026.yaml
  text: Likewise[a], the Spirit also helps in our weakness. For we do not know what we should pray for as we ought, but the Spirit himself intercedes with inexpressible groanings[b],
translation:
  language: vi
  text: Cũng vậy, Thánh Linh trợ giúp chúng ta trong sự yếu đuối của chúng ta. Vì chúng ta không biết phải cầu nguyện điều gì cho thích hợp, nhưng chính Thánh Linh cầu thay bằng những tiếng rên xiết không thể diễn tả bằng lời.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “bằng những tiếng rên xiết không thành lời.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὡσαύτως δὲ καὶ
  choice: Cũng vậy
  rationale: Nối ý với bối cảnh ngay trước đó một cách tự nhiên; không cần dịch riêng mọi liên từ khi tiếng Việt đã diễn đạt đầy đủ quan hệ tiếp nối.
- source_word: τὸ πνεῦμα
  choice: Thánh Linh
  rationale: Trong ngữ cảnh Rô-ma 8, từ này chỉ Thánh Linh; cách gọi trang trọng, quen thuộc và thể hiện tác nhân có ngôi vị mà không dựa vào giống ngữ pháp.
- source_word: συναντιλαμβάνεται τῇ ἀσθενείᾳ ἡμῶν
  choice: giúp đỡ chúng ta trong sự yếu đuối
  rationale: Động từ mang ý cùng gánh lấy để trợ giúp; cách dịch này tự nhiên trong tiếng Việt và giữ ἀσθενείᾳ ở số ít với nghĩa bao quát.
- source_word: τὸ γὰρ τί προσευξώμεθα καθὸ δεῖ
  choice: Vì chúng ta không biết phải cầu nguyện điều gì cho đúng
  rationale: Giữ cả nội dung cầu nguyện (τί) lẫn chuẩn mực thích đáng (καθὸ δεῖ), đồng thời tránh câu tiếng Việt gượng như 'cầu nguyện điều gì như phải lẽ'.
- source_word: αὐτὸ τὸ πνεῦμα
  choice: chính Thánh Linh
  rationale: Từ 'chính' bảo toàn sắc thái nhấn mạnh của αὐτό; tiếng Việt không cần thêm đại từ mang giống.
- source_word: ὑπερεντυγχάνει
  choice: cầu thay
  rationale: Diễn đạt ngắn gọn hành động khẩn cầu vì người khác trong ngữ cảnh, nhưng không thêm tân ngữ không có trong văn bản.
- source_word: στεναγμοῖς ἀλαλήτοις
  choice: bằng những tiếng rên xiết không thể diễn tả bằng lời
  rationale: στεναγμοί là những tiếng rên than/rên xiết; ἀλάλητος có thể chỉ điều không thành lời hoặc không thể nói ra. Bản chính dùng cách diễn đạt tự nhiên nhưng ghi nhận độ mở trong chú thích.
theological_decisions:
- issue: Tính ngôi vị của τὸ πνεῦμα dù danh từ πνεῦμα thuộc giống trung trong tiếng Hy Lạp
  choice: chính Thánh Linh
  alternative: chính thần linh ấy / tự Thánh Linh
  rationale: Tiếng Việt không mã hóa giống ngữ pháp. Cấu trúc nhấn mạnh và các hành động giúp đỡ, cầu thay được giữ nguyên, nên tính tác nhân có ngôi vị hiện rõ mà không cần nhập thêm đại từ theo giống.
- issue: Những tiếng rên xiết thuộc về ai
  choice: Giữ câu không xác định tường minh chủ thể sở hữu những tiếng rên xiết
  alternative: những tiếng rên xiết của Thánh Linh / qua những tiếng rên xiết của chúng ta
  rationale: Cách dùng phương tiện στεναγμοῖς gắn với động từ cầu thay nhưng không có đại từ sở hữu; không nên giải quyết thay văn bản câu hỏi những tiếng rên ấy là của Thánh Linh hay được Thánh Linh sử dụng qua người tin.
- issue: Phạm vi nghĩa của ἀλαλήτοις
  choice: không thể diễn tả bằng lời
  alternative: không thành lời
  rationale: Tính từ có thể được hiểu là không thể nói ra hoặc không được phát thành lời. Bản chính chọn cách đọc thông dụng, còn chú thích bảo tồn phương án kia.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Thánh Linh” nhất quán với lối gọi phổ biến trong một bộ phận lớn cộng đồng Cơ Đốc Việt ngữ; câu văn tránh giải thích giáo lý vượt quá những gì bản Hy Lạp trực tiếp nói.
