id: ROM.8.15
reference: Romans 8:15
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οὐ γὰρ ἐλάβετε πνεῦμα δουλείας πάλιν εἰς φόβον, ἀλλὰ ἐλάβετε πνεῦμα υἱοθεσίας ἐν ᾧ κράζομεν· Αββα ὁ πατήρ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/015.yaml
  text: For you did not receive a spirit of slavery leading back into fear[a], but you received the Spirit of adoption as sons, by whom we cry[c][b], “Abba! Father!”
translation:
  language: vi
  text: 'Vì anh chị em đã không nhận lấy một tinh thần của cảnh nô lệ để lại rơi vào sợ hãi, nhưng đã nhận lấy Thần Khí ban tư cách làm con[a]; nhờ Ngài[b], chúng ta kêu lên: “A-ba! Cha!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “một tinh thần của sự được nhận làm con.” Từ Hy Lạp mang sắc thái được đặt vào tư cách pháp lý của người con, gắn với quyền thừa kế.'
    reason: Bảo lưu khả năng hiểu πνεῦμα theo lối song song với “tinh thần của cảnh nô lệ” và giải thích sắc thái của υἱοθεσία.
  - marker: b
    text: 'Dịch sát hơn: “trong Ngài”; đại từ Hy Lạp ở giống trung để hòa hợp ngữ pháp với từ “thần khí/Thần Khí.”'
    reason: Ghi nhận hình thức nguyên văn và khả năng hiểu giới từ ἐν theo nghĩa vị trí hay phạm vi, thay vì chỉ theo nghĩa phương tiện.
lexical_decisions:
- source_word: πνεῦμα δουλείας
  choice: một tinh thần nô lệ
  rationale: “Tinh thần” diễn đạt tự nhiên một trạng thái hay khuynh hướng bị nô lệ chi phối, đồng thời giữ hình ảnh nô lệ và sự tương phản với Thần Khí ở vế sau.
- source_word: πάλιν εἰς φόβον
  choice: để lại rơi vào sợ hãi
  rationale: Cách nói này giữ cả ý πάλιν (“lại”) lẫn hướng/kết quả của εἰς φόβον (“vào sợ hãi”), mà vẫn tự nhiên trong tiếng Việt.
- source_word: πνεῦμα υἱοθεσίας
  choice: Thần Khí ban địa vị làm con
  rationale: Ngữ cảnh Rô-ma 8 chỉ về Thánh Linh; “ban địa vị làm con” chuyển tải sắc thái pháp lý và thừa kế của υἱοθεσία rõ hơn cách nói chung chung “sự nhận nuôi”.
- source_word: ἐν ᾧ
  choice: nhờ Ngài
  rationale: Giới từ ἐν ở đây có thể mang nghĩa phương tiện; “nhờ Ngài” tự nhiên trong tiếng Việt và phù hợp với việc πνεῦμα chỉ về Thần Khí, trong khi cách dịch sát hơn được ghi ở chú thích.
- source_word: κράζομεν
  choice: chúng ta kêu lên
  rationale: Giữ được sắc thái mạnh mẽ, trực tiếp của động từ κράζω.
- source_word: Αββα ὁ πατήρ
  choice: A-ba! Cha!
  rationale: Phiên âm từ A-ram “A-ba” và dịch danh xưng Hy Lạp đi kèm là “Cha”, giữ hình thức lời khẩn gọi trong nguyên văn.
theological_decisions:
- issue: πνεῦμα υἱοθεσίας chỉ trực tiếp Thánh Linh hay một tinh thần/trạng thái làm con
  choice: Thần Khí ban địa vị làm con
  alternative: một tinh thần của sự được nhận làm con
  rationale: Mạch văn gần (Rô-ma 8:14,16) nghiêng mạnh về Thánh Linh có ngôi vị. Tuy vậy, chú thích vẫn bảo lưu khả năng hiểu cấu trúc song song với “một tinh thần nô lệ” mà không tuyệt đối hóa cách giải nghĩa.
- issue: Sắc thái giới tính và pháp lý của υἱοθεσία
  choice: địa vị làm con
  alternative: sự nhận làm con nuôi
  rationale: “Địa vị làm con” giữ trọng tâm về tư cách pháp lý và quyền thừa kế trong cách dùng của Phao-lô, nhưng không tạo hàm ý hiện đại rằng người con nuôi có địa vị kém hơn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Dùng “anh em” cho đối tượng được Phao-lô trực tiếp nói đến và “chúng ta” theo đúng sự chuyển đổi đại từ trong nguyên văn. Viết hoa “Thần Khí” và “Ngài” ở vế sau vì ngữ cảnh chỉ về Thánh Linh, nhưng chú thích bảo lưu độ mở cú pháp. Các dấu chú thích [a], [b] đều được đặt trong chính văn.
