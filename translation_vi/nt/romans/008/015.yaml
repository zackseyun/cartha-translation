  to: 'Vì anh chị em đã không nhận lấy một tinh thần của cảnh nô lệ để lại rơi vào sợ hãi, nhưng đã nhận lấy Thần Khí ban tư cách làm con[a]; nhờ Ngài[b], chúng ta kêu lên: “A-ba! Cha!”'
