id: ROM.8.4
reference: Romans 8:4
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἵνα τὸ δικαίωμα τοῦ νόμου πληρωθῇ ἐν ἡμῖν τοῖς μὴ κατὰ σάρκα περιπατοῦσιν ἀλλὰ κατὰ πνεῦμα·
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/004.yaml
  text: so that the righteous requirement of the law might be fulfilled in us[c][b][a], who do not walk according to the flesh but according to the Spirit.
translation:
  language: vi
  text: để đòi hỏi công chính của luật pháp được làm trọn trong chúng ta, là những người không bước đi theo xác thịt[a], nhưng theo Thánh Linh[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Xác thịt” ở đây không chỉ thân thể vật chất, nhưng chỉ bản tính con người sa ngã hoặc lối sống hướng xa khỏi Đức Chúa Trời; cũng có thể dịch là “bản tính tội lỗi”.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “linh”; trong ngữ cảnh Rô-ma 8, từ này có lẽ chỉ Thánh Linh.
    reason: alternative_reading
lexical_decisions:
- source_word: ἵνα
  choice: để
  rationale: Diễn đạt tự nhiên sắc thái mục đích hoặc kết quả của liên từ ἵνα.
- source_word: τὸ δικαίωμα τοῦ νόμου
  choice: đòi hỏi công chính của luật pháp
  rationale: Giữ cả sắc thái pháp lý lẫn đạo đức của δικαίωμα trong ngữ cảnh này, thay vì thu hẹp thành một điều lệ riêng lẻ.
- source_word: πληρωθῇ
  choice: được làm trọn
  rationale: Giữ thể bị động và ý nghĩa hoàn tất của động từ trong mệnh đề mục đích.
- source_word: ἐν ἡμῖν
  choice: trong chúng ta
  rationale: Dịch trực tiếp giới từ ἐν, không biến thành 'bởi chúng ta' và do đó không áp đặt tác nhân mà nguyên văn không nêu rõ.
- source_word: περιπατοῦσιν
  choice: bước đi
  rationale: Giữ hình ảnh ẩn dụ quen thuộc của Phao-lô về nếp sống và cách cư xử.
- source_word: σάρκα
  choice: xác thịt
  rationale: Bảo tồn thuật ngữ giàu ý nghĩa của Phao-lô; chú thích giải thích rằng ở đây không chỉ nói về thân thể vật chất.
- source_word: πνεῦμα
  choice: Thánh Linh
  rationale: Ngữ cảnh Rô-ma 8 thiên về sự quy chiếu đến Thánh Linh, dù chú thích vẫn ghi nhận khả năng dịch tổng quát là 'linh'.
- source_word: κατὰ σάρκα ... κατὰ πνεῦμα
  choice: theo xác thịt ... theo Thánh Linh
  rationale: Cách dịch sát và tự nhiên cho κατά, duy trì cấu trúc đối xứng của nguyên văn.
theological_decisions:
- issue: πνεῦμα chỉ Thánh Linh hay linh
  choice: Thánh Linh
  alternative: linh
  rationale: Mạch văn Rô-ma 8 nhấn mạnh hoạt động và phạm vi cai quản của Thánh Linh; tuy nhiên, bản thân hình thức Hy Lạp không viết hoa và có thể được hiểu tổng quát nếu đứng riêng.
- issue: ἐν ἡμῖν hàm ý được làm trọn bởi, trong, hay giữa chúng ta
  choice: trong chúng ta
  alternative: bởi chúng ta; giữa chúng ta
  rationale: Giữ nghĩa trực tiếp của ἐν và tránh khẳng định mạnh hơn về tác nhân con người so với điều câu Hy Lạp thực sự nói.
- issue: δικαίωμα là đòi hỏi công chính hay chỉ là đòi hỏi
  choice: đòi hỏi công chính
  alternative: đòi hỏi
  rationale: Cách chọn chính giữ được sắc thái về điều luật pháp xác định là đúng/công chính, nhưng chú thích ghi nhận cách dịch ngắn hơn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ hình ảnh 'bước đi' cùng các thuật ngữ thần học 'xác thịt' và 'Thánh Linh' để bảo tồn cách diễn đạt của Phao-lô; dùng chú thích cho những chỗ dễ bị hiểu hẹp hoặc còn mơ hồ.
