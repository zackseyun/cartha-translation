  source_fidelity: 'Bản dịch giữ đúng cấu trúc đối lập của nguyên văn: Đấng Mê-si-a ở trong người nghe; thân thể chết vì tội lỗi; πνεῦμα là sự sống vì δικαιοσύνη. Tuy nhiên, πνεῦμα trong đối lập với “thân thể” nên cần được diễn đạt tự nhiên hơn trong tiếng Việt mà vẫn để mở khả năng chỉ Thánh Linh.'
  naturalness: “Tâm linh là sự sống” có thể hiểu được trong văn cảnh Kinh Thánh, nhưng “tâm linh” trong tiếng Việt hiện đại thường chỉ lĩnh vực/tính chất thuộc linh hơn là thành phần đối lập trực tiếp với “thân thể”. “Tinh thần có sự sống” tự nhiên hơn ở đây, dù chú thích cần nêu rõ đây không phải là sự giải quyết dứt khoát về quy chiếu của πνεῦμα.
