id: ROM.8.10
reference: Romans 8:10
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εἰ δὲ Χριστὸς ἐν ὑμῖν, τὸ μὲν σῶμα νεκρὸν διὰ ἁμαρτίαν, τὸ δὲ πνεῦμα ζωὴ διὰ δικαιοσύνην.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/010.yaml
  text: But if the Messiah is in you[a], the body is dead because of sin[c][b], but the spirit is life because of righteousness.
translation:
  language: vi
  text: Nhưng nếu Đấng Mê-si-a ở trong anh chị em, thì thân thể chết vì tội lỗi,[a] còn tinh thần có sự sống vì sự công chính.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể hiểu: “thân thể phải chết” hoặc “thân thể là hữu hạn và sẽ chết.”'
    reason: lexical_alternative
  - marker: b
    text: Hoặc “Thánh Linh”. Từ Hy Lạp có thể chỉ tinh thần con người được Đức Chúa Trời ban sự sống hoặc chỉ Đức Thánh Linh.
    reason: alternative_reading
  - marker: c
    text: Hoặc “công lý.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Χριστὸς
  choice: Đấng Mê-si-a
  rationale: Giữ sắc thái tước hiệu của Χριστός và dùng cách gọi rõ nghĩa, quen thuộc trong tiếng Việt hiện đại.
- source_word: σῶμα
  choice: thân thể
  rationale: Diễn đạt nghĩa thông thường của σῶμα và giữ sự đối lập cụ thể với πνεῦμα, không đồng nhất với σάρξ (‘xác thịt’).
- source_word: νεκρὸν
  choice: chết
  rationale: Bám sát tính từ Hy Lạp, đồng thời ghi nhận trong chú thích khả năng câu nói nhấn mạnh tình trạng phải chết.
- source_word: διὰ ἁμαρτίαν
  choice: vì tội lỗi
  rationale: διά với đối cách mang nghĩa nguyên nhân; cách dịch này tự nhiên và giữ mạch nhân quả.
- source_word: πνεῦμα
  choice: tâm linh
  rationale: Giữ sự đối lập với thân thể và không viết hoa để tránh quyết định dứt khoát rằng từ này trực tiếp chỉ Đức Thánh Linh; chú thích bảo lưu khả năng ấy.
- source_word: ζωὴ
  choice: là sự sống
  rationale: Giữ cấu trúc danh từ của ζωή và cách diễn đạt cô đọng của Phao-lô, thay vì chuyển thành ‘được sống’ hoặc ‘sống’.
- source_word: διὰ δικαιοσύνην
  choice: vì sự công chính
  rationale: Giữ nghĩa nguyên nhân của διά và cách dùng thần học rộng của δικαιοσύνη mà không thu hẹp thành một cách giải thích riêng.
theological_decisions:
- issue: Đối tượng được πνεῦμα chỉ đến
  choice: tâm linh
  alternative: Thánh Linh
  rationale: Ngữ pháp cho phép hiểu là tâm linh con người được ban sự sống hoặc là Đức Thánh Linh. Bản chính giữ sự tương phản thân thể–tâm linh, còn chú thích bảo tồn cách hiểu kia.
- issue: Sắc thái của νεκρὸν khi nói về σῶμα
  choice: thân thể chết
  alternative: thân thể phải chết / thân thể là hữu hạn và sẽ chết
  rationale: Bản chính giữ từ ngữ mạnh và trực tiếp của nguyên bản; chú thích nêu sắc thái về tình trạng phải chết mà không thay thế cách diễn đạt Hy Lạp.
- issue: Phạm vi nghĩa của δικαιοσύνη
  choice: sự công chính
  alternative: công lý
  rationale: ‘Sự công chính’ phù hợp hơn với ngữ cảnh Phao-lô, nhưng ‘công lý’ vẫn là một khả năng từ vựng nên được ghi nhận.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh chị em” để chuyển đại từ số nhiều ὑμῖν; giữ cấu trúc đối xứng ‘thân thể… còn tâm linh…’ và sự cô đọng thần học của nguyên văn.
