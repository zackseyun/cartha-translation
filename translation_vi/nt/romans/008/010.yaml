  to: Nhưng nếu Đấng Mê-si-a ở trong anh chị em, thì thân thể chết vì tội lỗi,[a] còn tinh thần có sự sống vì sự công chính.[b][c]
  rationale: Bản sửa thay “tâm linh” bằng “tinh thần” để câu tiếng Việt tự nhiên hơn trong thế đối lập với “thân thể”, nhưng không viết hoa và giữ chú thích để không quyết định trước quy chiếu đang được tranh luận của πνεῦμα. “Có sự sống” diễn đạt trôi chảy hơn mệnh đề danh từ ζωὴ mà vẫn giữ nội dung là sự sống. Các chú thích được tách theo đúng từ được chú giải; không thay đổi ý nghĩa của câu.
