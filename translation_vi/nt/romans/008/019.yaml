source:
  edition: SBLGNT
  text: ἡ γὰρ ἀποκαραδοκία τῆς κτίσεως τὴν ἀποκάλυψιν τῶν υἱῶν τοῦ θεοῦ ἀπεκδέχεται·
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/019.yaml
  text: For the creation waits with eager expectation for the revealing of the sons of God[a].
translation:
  language: vi
  text: Vì toàn thể tạo vật đang tha thiết trông đợi sự tỏ lộ của các con trai Đức Chúa Trời[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “con cái Đức Chúa Trời.” Tiếng Hy Lạp dùng từ “các con trai,” có thể đồng thời nhấn mạnh địa vị làm con và quyền thừa kế.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: Vì
  rationale: Giữ quan hệ giải thích với ý trước đó, đồng thời tự nhiên trong tiếng Việt.
- source_word: ἀποκαραδοκία
  choice: tha thiết trông đợi
  rationale: Diễn đạt sự mong ngóng mãnh liệt, hướng về điều sắp được bày tỏ; chuyển danh từ Hy Lạp thành trạng thái bổ nghĩa cho động từ để câu tiếng Việt tự nhiên.
- source_word: κτίσεως
  choice: muôn loài thọ tạo
  rationale: Thể hiện nghĩa tập thể và tầm vóc toàn thể của trật tự được dựng nên trong văn cảnh, thay vì chỉ một cá thể.
- source_word: ἀποκάλυψιν
  choice: sự tỏ lộ
  rationale: Giữ ý một thực tại hiện còn khuất sẽ được bày tỏ công khai.
- source_word: υἱῶν
  choice: các con trai
  rationale: Giữ hình thức giống đực của nguyên văn và sắc thái địa vị làm con, quyền thừa kế trong lập luận của Phao-lô; chú thích nêu cách dịch bao quát hơn.
- source_word: θεοῦ
  choice: Đức Chúa Trời
  rationale: Cách gọi trang trọng, quen thuộc trong văn phong Kinh Thánh tiếng Việt, diễn đạt quan hệ thuộc về với 'các con trai'.
- source_word: ἀπεκδέχεται
  choice: đang ... trông đợi
  rationale: Diễn đạt sự chờ mong hướng tới tương lai; 'tha thiết' chuyển tải cường độ vốn cũng được nhấn mạnh bởi ἀποκαραδοκία.
theological_decisions:
- issue: Nên dịch υἱῶν θεοῦ theo hình thức giống đực là “các con trai Đức Chúa Trời” hay theo nghĩa bao quát là “con cái Đức Chúa Trời.”
  choice: các con trai Đức Chúa Trời
  alternative: con cái Đức Chúa Trời
  rationale: Nguyên văn dùng danh từ giống đực số nhiều “các con trai”; cách dịch này cũng bảo toàn khả năng gợi đến địa vị làm con và quyền thừa kế. Tuy vậy, trong văn cảnh, nhóm người được nói đến không nhất thiết chỉ gồm nam giới, nên cách dịch bao quát được ghi ở chú thích.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. “Muôn loài thọ tạo” giữ phạm vi mang tính toàn thể; “tha thiết trông đợi” tránh lối danh hóa nặng nề nhưng vẫn bảo toàn sức mạnh của ἀποκαραδοκία.
