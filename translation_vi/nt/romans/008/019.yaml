  to: Vì toàn thể tạo vật đang tha thiết trông đợi sự tỏ lộ của các con trai Đức Chúa Trời[a].
  rationale: Chỉ thay “muôn loài thọ tạo” bằng “toàn thể tạo vật” để phản ánh κτίσις theo nghĩa tập thể rộng, tránh gợi ý không cần thiết rằng đối tượng chỉ là các loài sinh vật. Các thành phần khác đều chuyển tải trung thành nguyên văn và phù hợp với tiếng Việt hiện đại trang trọng.
