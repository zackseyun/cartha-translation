id: ROM.8.37
reference: Romans 8:37
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀλλ’ ἐν τούτοις πᾶσιν ὑπερνικῶμεν διὰ τοῦ ἀγαπήσαντος ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/037.yaml
  text: But in all these things we overwhelmingly conquer through the one who loved us[a][b].
translation:
  language: vi
  text: Nhưng trong tất cả những điều ấy, chúng ta chiến thắng vượt bậc nhờ Đấng đã yêu thương chúng ta.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Theo văn cảnh gần, “Đấng đã yêu thương chúng ta” rất có thể là Đấng Christ.
    reason: cross_reference
lexical_decisions:
- source_word: ἀλλ’
  choice: Nhưng
  rationale: Giữ sức tương phản mạnh với những hoạn nạn và hiểm nguy vừa nêu, đồng thời tự nhiên trong tiếng Việt hiện đại.
- source_word: ἐν τούτοις πᾶσιν
  choice: trong mọi điều ấy
  rationale: Bám sát cấu trúc Hy Lạp và liên kết trực tiếp với danh sách gian khổ ở câu trước; không buộc giới từ mang nghĩa phương tiện.
- source_word: ὑπερνικῶμεν
  choice: chúng ta hoàn toàn chiến thắng
  rationale: Động từ ở ngôi thứ nhất số nhiều diễn tả hành động chiến thắng với tiền tố nhấn mạnh ὑπερ-; cách dịch này giữ dạng động từ và sắc thái thắng lợi vượt trội, dứt khoát.
- source_word: διὰ
  choice: nhờ
  rationale: Với sở hữu cách, διά ở đây tự nhiên chỉ phương tiện hoặc tác nhân; “nhờ” diễn đạt rõ rằng thắng lợi có được qua Đấng khác.
- source_word: τοῦ ἀγαπήσαντος ἡμᾶς
  choice: Đấng đã yêu thương chúng ta
  rationale: Phân từ aorist có mạo từ được dùng như danh từ. “Đấng” phù hợp văn phong Kinh Thánh trang trọng mà không đưa tên riêng vốn không có trong câu; “đã yêu thương” phản ánh hành động quá khứ.
theological_decisions:
- issue: Danh tính của τοῦ ἀγαπήσαντος ἡμᾶς (“Đấng đã yêu thương chúng ta”)
  choice: Không nêu đích danh trong chính văn
  alternative: Hiểu là Đấng Christ theo văn cảnh gần
  rationale: Văn cảnh gần, nhất là Rô-ma 8:35, rất có thể chỉ về Đấng Christ, nhưng câu Hy Lạp không nêu tên. Chính văn giữ nguyên độ hàm ẩn, còn chú thích cung cấp nhận diện theo văn cảnh.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “Đấng” để chỉ nhân vật thần linh không nêu tên; tránh thêm hệ phái hoặc giải nghĩa thần học vào chính văn.
