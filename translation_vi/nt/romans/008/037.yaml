- from: Nhưng trong mọi điều ấy, chúng ta hoàn toàn chiến thắng nhờ Đấng đã yêu thương chúng ta.[a]
  to: Nhưng trong tất cả những điều ấy, chúng ta chiến thắng vượt bậc nhờ Đấng đã yêu thương chúng ta.[a]
  rationale: Điều chỉnh cách dịch ὑπερνικῶμεν để giữ sắc thái chiến thắng được tăng cường, đồng thời làm rõ sự quy chiếu của cụm “trong tất cả những điều ấy.” Giữ nguyên sự hàm ẩn về danh tính của Đấng yêu thương trong chính văn và chỉ nêu nhận diện có khả năng cao ở chú thích.
