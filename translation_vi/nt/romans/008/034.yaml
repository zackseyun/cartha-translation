id: ROM.8.34
reference: Romans 8:34
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: τίς ὁ ⸀κατακρινῶν; ⸀Χριστὸς ὁ ἀποθανών, μᾶλλον ⸀δὲ ⸀ἐγερθείς, ὅς ⸀καί ἐστιν ἐν δεξιᾷ τοῦ θεοῦ, ὃς καὶ ἐντυγχάνει ὑπὲρ ἡμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/034.yaml
  text: Who is the one condemning? Messiah Jesus is the one who died—more than that[a], who was raised—who is also at the right hand of God[d][c][b], who also intercedes for us.
translation:
  language: vi
  text: Ai là người kết án? Đấng Mê-si-a[a] là Đấng đã chết—hơn thế nữa, đã được làm cho sống lại[b]—Đấng cũng đang ở bên phải Đức Chúa Trời[c] và cũng cầu thay cho chúng ta[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “Đấng Christ.”
    reason: lexical_alternative
  - marker: b
    text: 'Hay “đã sống lại.” Động từ Hy Lạp ở thể bị động: “đã được làm cho sống lại.”'
    reason: alternative_reading
  - marker: c
    text: “Ở bên phải Đức Chúa Trời” là cách diễn đạt trong Kinh Thánh chỉ địa vị cao quý và thẩm quyền tối cao.
    reason: cultural_note
  - marker: d
    text: Cũng có thể hiểu là “cầu thay vì lợi ích của chúng ta” hoặc “cầu thay thay mặt chúng ta.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κατακρινῶν
  choice: người kết án
  rationale: Phân từ hiện tại có mạo từ được diễn đạt như một danh ngữ, giữ nguyên sức mạnh của câu hỏi tu từ mà không thêm ý ngoài bản văn.
- source_word: Χριστός
  choice: Đấng Mê-si-a
  rationale: Ở đây từ này mang chức năng tước hiệu; cách dịch này làm rõ nghĩa “Đấng được xức dầu” và không thêm tên “Giê-su,” vốn không có trong văn bản SBLGNT được cung cấp.
- source_word: ἀποθανών
  choice: Đấng đã chết
  rationale: Phân từ aorist được chuyển thành mệnh đề quan hệ ở thì quá khứ, tự nhiên trong tiếng Việt và giữ sự kiện lịch sử được nêu.
- source_word: μᾶλλον δὲ
  choice: hơn thế nữa
  rationale: Cụm từ tạo bước tăng tiến từ cái chết đến sự sống lại; “hơn thế nữa” tự nhiên và không biến nó thành một sự đối lập tuyệt đối.
- source_word: ἐγερθείς
  choice: đã được làm cho sống lại
  rationale: Giữ thể bị động của tiếng Hy Lạp, thay vì đổi thành cách chủ động “đã sống lại”; không nêu đích danh tác nhân vì câu Hy Lạp cũng không nêu.
- source_word: ἐν δεξιᾷ τοῦ θεοῦ
  choice: ở bên phải Đức Chúa Trời
  rationale: Giữ hình ảnh Kinh Thánh quen thuộc và động từ tồn tại đơn giản của nguyên văn; chú thích giải thích hàm ý về địa vị và thẩm quyền.
- source_word: ἐντυγχάνει
  choice: cầu thay
  rationale: “Cầu thay” diễn đạt tự nhiên hành động khẩn cầu vì lợi ích của người khác, đồng thời giữ trọng lượng thần học của từ trong ngữ cảnh.
- source_word: ὑπὲρ ἡμῶν
  choice: cho chúng ta
  rationale: Cách diễn đạt ngắn gọn, tự nhiên, bao hàm ý hành động vì lợi ích và thay mặt chúng ta.
theological_decisions:
- issue: Cách dịch Χριστός như một tước hiệu về Đấng được xức dầu
  choice: Đấng Mê-si-a
  alternative: Đấng Christ
  rationale: Ngữ cảnh dùng Χριστός như một tước hiệu có nội dung, nên bản dịch chính làm rõ nghĩa tước hiệu; phương án truyền thống được ghi ở chú thích.
- issue: Thể của ἐγερθείς
  choice: đã được làm cho sống lại
  alternative: đã sống lại
  rationale: Giữ thể bị động của nguyên văn và không âm thầm chuyển cách trình bày sự sống lại sang chủ động.
- issue: Tên Giê-su trong lớp tham khảo tiếng Anh
  choice: không thêm “Giê-su”
  alternative: Đấng Mê-si-a Giê-su
  rationale: Văn bản chính SBLGNT được cung cấp chỉ có Χριστός; bản dịch ưu tiên chứng cứ nguồn nguyên ngữ thay vì bổ sung từ có trong lớp tham khảo tiếng Anh.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dấu gạch ngang giữ nhịp tăng tiến của lập luận. Việc lặp lại “Đấng” phản ánh các cấu trúc phân từ và đại từ quan hệ quy về cùng một chủ thể, đồng thời giúp câu dài vẫn rõ nghĩa.
