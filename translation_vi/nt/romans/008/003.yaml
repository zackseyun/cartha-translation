id: ROM.8.3
reference: Romans 8:3
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: τὸ γὰρ ἀδύνατον τοῦ νόμου, ἐν ᾧ ἠσθένει διὰ τῆς σαρκός, ὁ θεὸς τὸν ἑαυτοῦ υἱὸν πέμψας ἐν ὁμοιώματι σαρκὸς ἁμαρτίας καὶ περὶ ἁμαρτίας κατέκρινε τὴν ἁμαρτίαν ἐν τῇ σαρκί,
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/003.yaml
  text: For what the law could not do[a], in that it was weak through the flesh, God did by sending his own Son in the likeness of sinful flesh and for sin; he condemned sin in the flesh[d][c][b],
translation:
  language: vi
  text: 'Vì điều mà luật pháp không thể làm được—vì luật pháp đã bất lực do xác thịt—Đức Chúa Trời đã làm điều đó bằng cách sai chính Con mình đến trong hình dạng giống như xác thịt tội lỗi[d] và vì tội lỗi[c]: Ngài đã kết án tội lỗi trong xác thịt[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: “Xác thịt” ở đây có thể chỉ thân phận con người trong sự yếu đuối sa ngã; một số bản dịch diễn giải từ này là “bản tính tội lỗi” trong một số văn cảnh.
    reason: lexical_alternative
  - marker: c
    text: Cũng có thể hiểu là “như một tế lễ chuộc tội”; cụm từ Hy Lạp này có thể mang sắc thái tế lễ.
    reason: alternative_reading
  - marker: d
    text: Cụm từ “trong hình dạng giống như xác thịt tội lỗi” khẳng định Con thật sự làm người, đồng thời phân biệt Ngài với chính tội lỗi.
    reason: cultural_note
lexical_decisions:
- source_word: τὸ ἀδύνατον τοῦ νόμου
  choice: điều luật pháp không thể làm được
  rationale: Diễn đạt tự nhiên cấu trúc trung tính chỉ sự bất lực của luật pháp, đồng thời giữ ý về điều luật pháp không thể hoàn thành.
- source_word: νόμος
  choice: luật pháp
  rationale: Cách gọi quen thuộc, trang trọng trong tiếng Việt; ngữ cảnh cho thấy luật pháp Môi-se mà không cần thêm lời giải thích.
- source_word: ἐν ᾧ ἠσθένει διὰ τῆς σαρκός
  choice: bởi luật pháp suy yếu do xác thịt
  rationale: Giữ quan hệ giải thích và không diễn giải σάρξ thành một khái niệm giáo lý cụ thể như “bản tính tội lỗi”.
- source_word: πέμψας
  choice: Ngài sai
  rationale: Trong văn mạch, phân từ chỉ phương cách Đức Chúa Trời thực hiện điều luật pháp không thể làm; tiếng Việt diễn đạt tự nhiên bằng một mệnh đề động từ.
- source_word: τὸν ἑαυτοῦ υἱόν
  choice: chính Con mình
  rationale: “Chính” bảo toàn sắc thái nhấn mạnh của ἑαυτοῦ, còn “mình” chỉ quan hệ trở lại với Đức Chúa Trời.
- source_word: ἐν ὁμοιώματι σαρκὸς ἁμαρτίας
  choice: trong hình dạng giống như xác thịt tội lỗi
  rationale: Giữ cả yếu tố ὁμοίωμα và cụm từ khó σαρκὸς ἁμαρτίας, không quy tội cho người Con cũng không làm nhạt tính nhân loại thật của Ngài.
- source_word: περὶ ἁμαρτίας
  choice: vì tội lỗi
  rationale: Giữ cách diễn đạt rộng và gần nguyên văn trong chính văn; sắc thái tế lễ khả dĩ được bảo lưu trong chú thích.
- source_word: κατέκρινε τὴν ἁμαρτίαν
  choice: đã kết án tội lỗi
  rationale: Bảo toàn sắc thái pháp đình rõ ràng của động từ κατακρίνω.
- source_word: ἐν τῇ σαρκί
  choice: trong xác thịt
  rationale: Không tự ý thêm đại từ “Ngài”; giữ sự cô đọng và độ mở quy chiếu của tiếng Hy Lạp.
theological_decisions:
- issue: Ý nghĩa của σάρξ trong câu này
  choice: Dịch nhất quán là “xác thịt”.
  alternative: “bản tính tội lỗi” hoặc “thân xác con người”
  rationale: “Xác thịt” bảo toàn hình ảnh và sự căng thẳng trong lập luận của Phao-lô, không đồng nhất thân thể với tội lỗi và không áp đặt một cách giải nghĩa hệ phái.
- issue: Ý nghĩa của περὶ ἁμαρτίας
  choice: Dịch chính văn là “vì tội lỗi”.
  alternative: “làm tế lễ chuộc tội”
  rationale: Cụm từ có thể mang sắc thái tế lễ theo cách dùng Kinh Thánh Hy Lạp, nhưng cũng có nghĩa rộng hơn; chính văn giữ độ mơ hồ, còn chú thích nêu khả năng tế lễ.
- issue: Sắc thái Cơ Đốc học của ἐν ὁμοιώματι σαρκὸς ἁμαρτίας
  choice: Giữ “trong hình dạng giống như xác thịt tội lỗi”.
  alternative: Diễn giải rằng Con mang bản tính tội lỗi hoặc chỉ có vẻ ngoài là con người
  rationale: 'Cách dịch giữ nguyên sự phân biệt tinh tế của bản văn: Con thật sự bước vào thân phận xác thịt của loài người nhưng bản văn không nói chính Ngài có tội.'
- issue: Chủ thể và phạm vi của ἐν τῇ σαρκί
  choice: Giữ “trong xác thịt” mà không thêm “của Ngài”.
  alternative: “trong xác thịt của Con Ngài”
  rationale: Cách hiểu quy chiếu đến xác thịt của Con là hợp lý, nhưng đại từ sở hữu không có trong tiếng Hy Lạp; không nên giải quyết hoàn toàn độ cô đọng của bản văn trong chính văn.
translation_notes:
  register: 'Văn phong tiếng Việt hiện đại, trang trọng và dễ đọc. Dấu hai chấm và dấu chấm phẩy làm rõ cấu trúc: điều luật pháp không thể làm thì Đức Chúa Trời đã làm bằng việc sai Con mình, và kết quả là tội lỗi bị kết án. Các thuật ngữ “luật pháp”, “xác thịt”, “kết án” được giữ để phản ánh trường từ vựng và sức nặng thần học của nguyên bản.'
