  source_fidelity: 'Bản dịch giữ đúng các yếu tố chính: sự bất lực của luật pháp do xác thịt, việc Đức Chúa Trời sai chính Con mình, “trong hình dạng giống như xác thịt tội lỗi,” “vì tội lỗi,” và sự kết án tội lỗi trong xác thịt. Tuy nhiên, “điều luật pháp không thể làm được” dễ được hiểu là một điều khoản của luật pháp, không phải điều luật pháp không thể thực hiện. Cấu trúc cần được chỉnh để biểu thị rõ đối lập ngầm: điều luật pháp không thể làm thì Đức Chúa Trời đã làm.'
  naturalness: Cần sửa để tiếng Việt hiện đại tự nhiên hơn và mạch cú pháp rõ hơn. “Điều mà luật pháp không thể làm được” là cách nói thông dụng và chính xác hơn “điều luật pháp không thể làm được.” Việc lặp “điều đó” giúp hoàn chỉnh quan hệ tân ngữ được hàm ý trong tiếng Hy Lạp mà vẫn không thêm nội dung thần học.
