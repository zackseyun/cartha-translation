  to: 'Vì điều mà luật pháp không thể làm được—vì luật pháp đã bất lực do xác thịt—Đức Chúa Trời đã làm điều đó bằng cách sai chính Con mình đến trong hình dạng giống như xác thịt tội lỗi[d] và vì tội lỗi[c]: Ngài đã kết án tội lỗi trong xác thịt[b].'
  rationale: 'Bản sửa thay cách ghép từ mơ hồ bằng “điều mà luật pháp không thể làm được,” đồng thời làm rõ quan hệ đối lập mà nguyên ngữ diễn đạt: Đức Chúa Trời đã thực hiện điều luật pháp không thể thực hiện, bằng việc sai Con mình; kết quả được nêu là Ngài kết án tội lỗi trong xác thịt. Các thuật ngữ chủ chốt và tính cô đọng của “trong xác thịt” được giữ nguyên. Chú thích c được chỉnh cho chính xác về nghĩa tế lễ khả dĩ mà không áp đặt nghĩa ấy vào chính văn.'
