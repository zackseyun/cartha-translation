  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὅτι καὶ αὐτὴ ἡ κτίσις ἐλευθερωθήσεται ἀπὸ τῆς δουλείας τῆς φθορᾶς εἰς τὴν ἐλευθερίαν τῆς δόξης τῶν τέκνων τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/021.yaml
  text: because creation itself also will be set free from slavery to decay into the freedom of the glory of the children of God[a].
translation:
  language: vi
  text: vì chính cõi thọ tạo cũng sẽ được giải thoát khỏi ách nô lệ của sự hư nát, để được hưởng sự tự do trong vinh quang của con cái Đức Chúa Trời.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sát nguyên văn hơn: “sự tự do của vinh quang của con cái Đức Chúa Trời.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: vì
  rationale: Hiểu theo nghĩa nguyên nhân, giải thích nền tảng của niềm hy vọng được nói đến trước đó.
- source_word: καὶ αὐτὴ ἡ κτίσις
  choice: chính cõi thọ tạo cũng
  rationale: “Cũng” giữ sắc thái bổ sung của καί, còn “chính” thể hiện sự nhấn mạnh của αὐτή. “Cõi thọ tạo” chỉ toàn thể trật tự được dựng nên trong văn cảnh.
- source_word: ἐλευθερωθήσεται
  choice: sẽ được giải thoát
  rationale: Giữ thì tương lai và thể bị động, cho thấy cõi thọ tạo sẽ nhận được hành động giải phóng.
- source_word: ἀπὸ τῆς δουλείας τῆς φθορᾶς
  choice: khỏi ách nô lệ của sự hư nát
  rationale: “Ách nô lệ” giữ sức nặng của ẩn dụ δουλεία; “sự hư nát” bao quát tình trạng suy tàn, tiêu hoại và tính phải hư mất của tạo vật.
- source_word: εἰς τὴν ἐλευθερίαν
  choice: để bước vào sự tự do
  rationale: Diễn đạt tự nhiên chuyển động vào một trạng thái mới do εἰς biểu thị, mà không làm mất ý hướng đích.
- source_word: τῆς δόξης
  choice: trong vinh quang
  rationale: Diễn đạt mối liên hệ giữa tự do và vinh quang bằng tiếng Việt tự nhiên nhưng vẫn tránh đồng nhất hoàn toàn δόξα với một tính từ đơn thuần.
- source_word: τῶν τέκνων τοῦ θεοῦ
  choice: của con cái Đức Chúa Trời
  rationale: “Con cái” giữ nghĩa gia đình và tính bao gồm của τέκνα; cách gọi “Đức Chúa Trời” phù hợp văn phong Kinh Thánh trang trọng, quen thuộc.
theological_decisions:
- issue: Cách diễn đạt chuỗi sở hữu cách τὴν ἐλευθερίαν τῆς δόξης τῶν τέκνων τοῦ θεοῦ
  choice: sự tự do trong vinh quang của con cái Đức Chúa Trời
  alternative: sự tự do thuộc về vinh quang của con cái Đức Chúa Trời
  rationale: Cách dịch chính tự nhiên hơn trong tiếng Việt và vẫn giữ vinh quang gắn với sự tự do của con cái Đức Chúa Trời. Chú thích bảo lưu cấu trúc sát nguyên văn vì chuỗi sở hữu cách có thể nhấn mạnh mối liên hệ theo cách không nên giải quyết dứt khoát.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Giữ hình ảnh mạnh “ách nô lệ,” dùng “cõi thọ tạo” để nói đến toàn thể tạo giới, và tránh giải thích quá mức quan hệ thần học giữa sự tự do, vinh quang và con cái Đức Chúa Trời.
