revisions:
- from: Đấng đã không tiếc chính Con mình, nhưng phó Con ấy vì tất cả chúng ta[a], lẽ nào Ngài lại chẳng cùng với Con ấy ban cho chúng ta mọi sự bởi ân điển sao?[b]
  to: Ngài là Đấng đã không tiếc chính Con mình, nhưng đã trao nộp Con ấy vì tất cả chúng ta[a]; lẽ nào Ngài lại không cũng sẽ, cùng với Con ấy, ân ban mọi sự cho chúng ta sao?[b]
  rationale: Bản sửa hoàn chỉnh hóa mệnh đề hồi chiếu, thay cách nói ít tự nhiên “phó Con ấy” bằng “trao nộp Con ấy,” và dùng “ân ban” để chuyển tải trực tiếp sắc thái ban cho cách ân huệ của χαρίσεται. Vị trí “cùng với Con ấy” được giữ gần động từ ban cho để phản ánh σὺν αὐτῷ, còn “mọi sự” vẫn để ngỏ phạm vi như nguyên ngữ.
  reviewer_model: gpt-5.6-terra
