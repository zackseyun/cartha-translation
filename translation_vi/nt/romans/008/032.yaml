id: ROM.8.32
reference: Romans 8:32
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὅς γε τοῦ ἰδίου υἱοῦ οὐκ ἐφείσατο, ἀλλὰ ὑπὲρ ἡμῶν πάντων παρέδωκεν αὐτόν, πῶς οὐχὶ καὶ σὺν αὐτῷ τὰ πάντα ἡμῖν χαρίσεται;
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/032.yaml
  text: He indeed did not spare his own Son[c][b][a], but gave him over for us all—how will he not also with him graciously give us all things?
translation:
  language: vi
  text: Ngài là Đấng đã không tiếc chính Con mình, nhưng đã trao nộp Con ấy vì tất cả chúng ta[a]; lẽ nào Ngài lại không cũng sẽ, cùng với Con ấy, ân ban mọi sự cho chúng ta sao?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “thay mặt cho tất cả chúng ta” hoặc “vì lợi ích của tất cả chúng ta.”'
    reason: alternative_reading
  - marker: b
    text: 'Cũng có thể dịch: “rộng ban mọi sự cho chúng ta.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅς γε
  choice: Đấng đã
  rationale: Đại từ quan hệ quy chiếu về Đức Chúa Trời trong ngữ cảnh trước. Cấu trúc “Đấng đã” nối tự nhiên với mạch lập luận; lực nhấn của γε được truyền tải qua toàn bộ câu hỏi tu từ thay vì thêm một trạng từ dễ gây nặng câu.
- source_word: τοῦ ἰδίου υἱοῦ
  choice: chính Con mình
  rationale: “Chính” giữ lực nhấn của ἰδίου về mối quan hệ sở hữu thân thiết; “Con” viết hoa vì chỉ về Chúa Giê-su.
- source_word: οὐκ ἐφείσατο
  choice: không tiếc
  rationale: Cách nói tự nhiên, trang trọng, giữ ý không giữ lại hay miễn cho khỏi sự chịu khổ mà không diễn giải quá mức.
- source_word: ὑπὲρ ἡμῶν πάντων
  choice: vì tất cả chúng ta
  rationale: “Vì” diễn đạt hành động vì lợi ích hoặc thay mặt cho chúng ta mà không ép ὑπέρ thành một công thức thần học kỹ thuật; “tất cả chúng ta” giữ phạm vi của πάντων.
- source_word: παρέδωκεν αὐτόν
  choice: phó Con ấy
  rationale: “Phó” giữ sắc thái trao nộp vào sự chịu khổ và sự chết, đồng thời phù hợp với văn phong Kinh Thánh trang trọng mà vẫn dễ hiểu.
- source_word: πῶς οὐχὶ καὶ
  choice: lẽ nào Ngài lại chẳng ... sao?
  rationale: 'Cấu trúc câu hỏi tu từ tiếng Việt giữ sức mạnh suy luận: nếu Đức Chúa Trời đã ban điều lớn hơn, chắc chắn Ngài cũng sẽ ban những điều còn lại.'
- source_word: σὺν αὐτῷ
  choice: cùng với Con ấy
  rationale: Diễn đạt rõ quan hệ với chính người Con vừa được nhắc đến, tránh đại từ tiếng Việt có thể mơ hồ.
- source_word: τὰ πάντα
  choice: mọi sự
  rationale: Giữ độ rộng và tính khái quát của cụm từ Hy Lạp, không tự ý giới hạn nội dung.
- source_word: ἡμῖν
  choice: cho chúng ta
  rationale: Diễn đạt tự nhiên chức năng tặng cách trong tiếng Việt.
- source_word: χαρίσεται
  choice: ban cho ... bởi ân điển
  rationale: Giữ sắc thái ban tặng cách nhưng không của χαρίζομαι và mối liên hệ từ vựng với ân điển, thay vì chỉ dịch trung tính là “cho”.
theological_decisions:
- issue: Có nên dịch ὑπὲρ ἡμῶν πάντων theo cách xác định rõ ý thay thế hay không
  choice: vì tất cả chúng ta
  alternative: thay cho tất cả chúng ta; vì lợi ích của tất cả chúng ta
  rationale: ὑπέρ xác nhận hành động hướng đến lợi ích của chúng ta và có thể mang âm hưởng hy sinh, nhưng câu này không cần bị thu hẹp thành một công thức chuộc tội kỹ thuật.
- issue: Phạm vi của τὰ πάντα
  choice: mọi sự
  alternative: mọi điều cần thiết; mọi phước lành
  rationale: Giữ nguyên cách diễn đạt rộng của Phao-lô và để ngữ cảnh xác định phạm vi, thay vì bổ sung một giới hạn không có trong câu Hy Lạp.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “Ngài” để quy chiếu về Đức Chúa Trời và “Con ấy” để làm rõ đại từ Hy Lạp; giữ nguyên hình thức câu hỏi tu từ và sự căng mở về phạm vi của “mọi sự”.
