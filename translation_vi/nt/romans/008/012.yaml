base_translation:
  language: en
  yaml_path: translation/nt/romans/008/012.yaml
  text: So then[a], brothers, we are debtors—not to the flesh[b], to live according to the flesh.
translation:
  language: vi
  text: Vậy nên, thưa anh chị em[a], chúng ta là những người mắc nợ, không phải mắc nợ xác thịt[b] để phải sống theo xác thịt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn là “anh em”, một cách xưng hô có thể chỉ toàn thể cộng đồng tín hữu, gồm cả nam lẫn nữ.
    reason: lexical_alternative
  - marker: b
    text: “Xác thịt” trong ngữ cảnh này không chỉ thân thể vật chất, nhưng nói đến con người trong sự yếu đuối và khuynh hướng tội lỗi; cũng có thể dịch theo nghĩa diễn giải là “bản tính tội lỗi”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄρα οὖν
  choice: Vậy nên
  rationale: Cụm từ này diễn tả kết luận rút ra từ lập luận trước đó; “Vậy nên” vừa tự nhiên vừa giữ được sức chuyển ý và suy luận.
- source_word: ἀδελφοί
  choice: thưa anh chị em
  rationale: Dù hình thức Hy Lạp là giống đực số nhiều, đây là cách xưng hô với toàn thể cộng đồng tín hữu; “anh chị em” truyền đạt tự nhiên phạm vi bao hàm ấy trong tiếng Việt.
- source_word: ὀφειλέται ἐσμέν
  choice: chúng ta là những người mắc nợ
  rationale: Giữ hình ảnh cụ thể của ὀφειλέται là “người mắc nợ”, đồng thời ngữ cảnh cho thấy đây là nghĩa vụ chứ không phải khoản nợ tài chính.
- source_word: σάρξ / σαρκί
  choice: xác thịt
  rationale: Giữ thuật ngữ thần học lặp lại của Phao-lô và sự đối lập giữa xác thịt với Thánh Linh, thay vì giải nghĩa hoàn toàn thành “bản tính tội lỗi” ngay trong chính văn.
- source_word: τοῦ κατὰ σάρκα ζῆν
  choice: để sống theo xác thịt
  rationale: Phản ánh sát cấu trúc nguyên ngữ và thành ngữ κατὰ σάρκα, trong đó “theo” diễn tả chuẩn mực hay sự chi phối của xác thịt.
theological_decisions:
- issue: Cách hiểu σάρξ trong sự đối lập của Phao-lô
  choice: xác thịt
  alternative: bản tính tội lỗi
  rationale: “Xác thịt” bảo tồn từ ngữ và sức căng thần học của Phao-lô, không đồng nhất thân thể vật chất với tội lỗi cũng không âm thầm thu hẹp thuật ngữ vào một cách diễn giải duy nhất.
- issue: Phạm vi của ἀδελφοί
  choice: anh chị em
  alternative: anh em
  rationale: Trong ngữ cảnh thư gửi cộng đồng tín hữu, cách xưng hô này bao gồm cả nam lẫn nữ; tiếng Việt hiện đại diễn đạt điều đó tự nhiên bằng “anh chị em”.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dấu gạch ngang làm nổi bật sự phủ định tương phản. Cụm “những người mắc nợ” giữ ẩn dụ của nguyên ngữ, còn các chú thích giải thích hai thuật ngữ dễ gây hiểu lầm.
