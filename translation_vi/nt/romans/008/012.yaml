    rationale: τοῦ κατὰ σάρκα ζῆν diễn tả điều người đọc không có nghĩa vụ phải làm. Trong tiếng Việt, đặt trực tiếp sau “không mắc nợ xác thịt” có thể gợi mục đích. “để phải sống” làm rõ quan hệ nghĩa vụ mà không thêm nội dung.
  - severity: medium
    issue: Chú thích b diễn giải σάρξ quá dứt khoát
    rationale: Nguyên ngữ và ngữ cảnh Rô-ma 8 quả thực không đơn thuần nói về thân thể, nhưng diễn đạt “chỉ con người trong tình trạng sa ngã và chống nghịch...” đóng kín một thuật ngữ có phạm vi ngữ nghĩa còn được tranh luận. Chú thích nên nêu đây là cách dùng trong ngữ cảnh và giữ lựa chọn thay thế là diễn giải.
