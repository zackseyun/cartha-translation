id: ROM.8.2
reference: Romans 8:2
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὁ γὰρ νόμος τοῦ πνεύματος τῆς ζωῆς ἐν Χριστῷ Ἰησοῦ ἠλευθέρωσέν ⸀σε ἀπὸ τοῦ νόμου τῆς ἁμαρτίας καὶ τοῦ θανάτου.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/002.yaml
  text: For the law of the Spirit of life in Messiah Jesus has set you free from the law of sin and death[a][b][c].
translation:
  language: vi
  text: Vì luật[a] của Thánh Linh ban sự sống trong Đấng Mê-si-a Giê-su[c] đã giải thoát bạn[b] khỏi luật của tội lỗi và sự chết.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch là “nguyên lý”: “nguyên lý của Thánh Linh ban sự sống.”'
    reason: lexical_alternative
  - marker: b
    text: Một số thủ bản chép “tôi” thay vì “bạn.”
    reason: textual_variant
  - marker: c
    text: 'Cách dịch truyền thống: “trong Đấng Christ Giê-su.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: νόμος
  choice: luật
  rationale: Giữ cùng một danh từ “luật” ở cả hai lần xuất hiện, qua đó bảo tồn phép đối chiếu và sức căng trong cách diễn đạt của Phao-lô; “nguyên lý” là một cách hiểu có thể có nhưng hẹp nghĩa hơn.
- source_word: πνεύματος τῆς ζωῆς
  choice: Thánh Linh ban sự sống
  rationale: Ngữ cảnh Rô-ma 8 hướng đến Thánh Linh của Đức Chúa Trời. Cách diễn đạt này chuyển cấu trúc sở hữu cách Hy Lạp sang tiếng Việt tự nhiên, trong khi vẫn giữ ý Thánh Linh gắn liền với và đem lại sự sống.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: trong Đấng Mê-si-a Giê-su
  rationale: Giữ giới từ “trong” để bảo tồn ngôn ngữ của Phao-lô về sự liên hiệp với Đấng Mê-si-a; dịch Χριστός theo nghĩa tước hiệu là “Đấng Mê-si-a.”
- source_word: ἠλευθέρωσέν
  choice: đã giải thoát
  rationale: Diễn đạt một hành động đã hoàn tất và đưa người nhận ra khỏi quyền lực của luật tội lỗi và sự chết, bằng lối nói tự nhiên trong tiếng Việt.
- source_word: σε
  choice: bạn
  rationale: Theo bản văn SBLGNT với đại từ ngôi thứ hai số ít; biến thể “tôi” được ghi ở chú thích.
- source_word: ἁμαρτίας
  choice: tội lỗi
  rationale: Cách dịch thông dụng, có thể bao hàm cả thực tại trừu tượng lẫn tội lỗi như một quyền lực thống trị trong lập luận của Phao-lô.
- source_word: θανάτου
  choice: sự chết
  rationale: Cách dịch chuẩn, giữ sự song hành cô đọng với “tội lỗi.”
theological_decisions:
- issue: πνεύματος chỉ Thánh Linh hay thần linh/nguyên lý thiêng liêng
  choice: Thánh Linh
  alternative: thần linh của con người hoặc một nguyên lý thiêng liêng
  rationale: Trong Rô-ma 8, sự tương phản giữa xác thịt, tội lỗi, sự chết và Thánh Linh ban sự sống nghiêng mạnh về việc hiểu đây là Thánh Linh của Đức Chúa Trời.
- issue: Cách hiểu νόμος trong hai vế
  choice: Giữ “luật” ở cả hai lần
  alternative: “nguyên lý” hoặc “quyền lực”
  rationale: Không giải quyết quá sớm phép ẩn dụ có chủ ý của Phao-lô; việc lặp lại cùng một từ giúp độc giả thấy rõ sự đối chiếu giữa luật của Thánh Linh và luật của tội lỗi cùng sự chết.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Cụm “Thánh Linh ban sự sống” ưu tiên sự tự nhiên hơn cách dịch sát nhưng gượng “Thánh Linh của sự sống”; “Đấng Mê-si-a” giữ rõ Χριστός là một tước hiệu, còn cách gọi truyền thống được bảo tồn trong chú thích.
