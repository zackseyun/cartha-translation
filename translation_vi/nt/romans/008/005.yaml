id: ROM.8.5
reference: Romans 8:5
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οἱ γὰρ κατὰ σάρκα ὄντες τὰ τῆς σαρκὸς φρονοῦσιν, οἱ δὲ κατὰ πνεῦμα τὰ τοῦ πνεύματος.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/005.yaml
  text: For those who live according to the flesh set their minds on the things of the flesh, but those who live according to the Spirit, on the things of the Spirit.
translation:
  language: vi
  text: Vì những người sống theo xác thịt thì hướng tâm trí vào những điều thuộc về xác thịt; còn những người sống theo Thánh Linh thì hướng tâm trí vào những điều thuộc về Thánh Linh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατὰ σάρκα ὄντες
  choice: sống theo xác thịt
  rationale: Cụm Hy Lạp nói về những người hiện hữu theo phương diện hoặc chuẩn mực của σάρξ. “Sống theo xác thịt” tự nhiên trong tiếng Việt và phù hợp với ngữ cảnh đạo đức-thần học, nhưng không giản lược “xác thịt” thành thân thể vật chất.
- source_word: φρονοῦσιν
  choice: hướng tâm trí vào
  rationale: Động từ φρονέω bao hàm khuynh hướng suy nghĩ, quan tâm và định hướng nội tâm; “hướng tâm trí vào” truyền đạt sắc thái này rõ hơn chỉ “nghĩ về”.
- source_word: τὰ τῆς σαρκὸς
  choice: những điều thuộc về xác thịt
  rationale: Giữ cấu trúc sở thuộc rộng và không tự ý xác định cụ thể những điều ấy.
- source_word: κατὰ πνεῦμα
  choice: sống theo Thánh Linh
  rationale: Trong đối lập của Rô-ma 8 và ngữ cảnh gần, πνεῦμα chỉ Thánh Linh; thêm “sống” theo phép tỉnh lược từ vế đầu để câu tiếng Việt rõ và cân đối.
- source_word: τὰ τοῦ πνεύματος
  choice: những điều thuộc về Thánh Linh
  rationale: Bảo toàn thế đối xứng với “những điều thuộc về xác thịt” và ý nghĩa sở thuộc của nguyên văn.
theological_decisions:
- issue: Ý nghĩa của σάρξ
  choice: xác thịt
  alternative: bản tính xác thịt / bản tính tội lỗi
  rationale: “Xác thịt” giữ được thuật ngữ và độ rộng thần học của Phao-lô; các cách dùng “bản tính” có thể diễn giải quá mức và làm mất sự căng thẳng của văn cảnh.
- issue: Đối tượng của πνεῦμα
  choice: Thánh Linh
  alternative: tinh thần
  rationale: Ngữ cảnh Rô-ma 8 nói đến Thánh Linh của Đức Chúa Trời; viết hoa làm rõ tham chiếu mà không thêm một lập luận giáo phái.
- issue: Giá trị của ὄντες
  choice: sống theo
  alternative: thuộc về / hiện hữu theo
  rationale: “Sống theo” diễn đạt tự nhiên tình trạng và định hướng hiện sinh trong tiếng Việt, đồng thời tránh lối dịch cứng khó hiểu.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Hai vế được giữ cân xứng; vế sau lặp lại “hướng tâm trí vào” để tránh phép tỉnh lược gây gượng hoặc mơ hồ trong tiếng Việt.
