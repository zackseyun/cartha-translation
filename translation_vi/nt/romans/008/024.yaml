id: ROM.8.24
reference: Romans 8:24
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: τῇ γὰρ ἐλπίδι ἐσώθημεν· ἐλπὶς δὲ βλεπομένη οὐκ ἔστιν ἐλπίς, ὃ γὰρ βλέπει ⸀τίς ἐλπίζει;
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/024.yaml
  text: For in hope we were saved[a]. But hope that is seen is not hope[b], for who hopes for what he sees?
translation:
  language: vi
  text: Vì trong niềm hy vọng, chúng ta đã được cứu[a]. Nhưng niềm hy vọng được thấy thì không phải là niềm hy vọng[b], vì ai lại hy vọng điều mình thấy?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Chúng ta đã được cứu bởi niềm hy vọng.”'
    reason: alternative_reading
  - marker: b
    text: Nghĩa là niềm hy vọng hướng đến điều chưa thấy.
    reason: cross_reference
lexical_decisions:
- source_word: τῇ γὰρ ἐλπίδι
  choice: Vì ... trong niềm hy vọng
  rationale: 'Giữ cách hiểu sở thuộc/phạm vi của cách ba: sự cứu rỗi hiện được sở hữu trong niềm hy vọng, chứ chưa ở trong sự thấy; tránh làm cho hy vọng có vẻ là tác nhân đem lại sự cứu rỗi.'
- source_word: ἐσώθημεν
  choice: chúng ta đã được cứu
  rationale: Bảo toàn thể bị động và diễn đạt thì aorist bằng một hành động đã xảy ra, tự nhiên trong tiếng Việt, mà không xóa bỏ chiều kích chưa hoàn tất được ngữ cảnh nêu rõ.
- source_word: ἐλπὶς ... βλεπομένη
  choice: niềm hy vọng thấy được
  rationale: Diễn đạt phân từ bị động bằng cấu trúc bổ nghĩa gọn, tự nhiên, đồng thời giữ nguyên sự đối lập giữa hy vọng và thấy.
- source_word: οὐκ ἔστιν ἐλπίς
  choice: không còn là niềm hy vọng
  rationale: Trong tiếng Việt, “không còn là” diễn đạt tự nhiên ý rằng khi đối tượng đã hiện ra trước mắt thì nó không còn thuộc phạm vi của hy vọng; không hàm ý niềm hy vọng trước đó là sai.
- source_word: ὃ γὰρ βλέπει
  choice: điều mình đã thấy
  rationale: Đại từ trung tính ὃ được chuyển thành “điều”; “mình” mang nghĩa khái quát, không quy định giới tính. “Đã thấy” làm rõ trạng thái đối tượng hiện đã ở trong tầm thấy.
- source_word: τίς ἐλπίζει
  choice: ai lại hy vọng
  rationale: Câu hỏi tu từ được diễn đạt tự nhiên bằng “ai lại”, giữ sức nhấn mạnh của nguyên văn mà không thêm một câu trả lời minh nhiên.
theological_decisions:
- issue: Mối quan hệ giữa sự cứu rỗi và niềm hy vọng trong τῇ ἐλπίδι ἐσώθημεν
  choice: “đã được cứu trong niềm hy vọng”
  alternative: “đã được cứu bởi niềm hy vọng”
  rationale: 'Cách dịch chính giữ sự căng thẳng cánh chung của Phao-lô: sự cứu rỗi là thực tại đã nhận nhưng sự hoàn tất hữu hình vẫn còn được trông đợi. Nó cũng tránh xác định hy vọng là nguyên nhân hay phương tiện hữu hiệu của sự cứu rỗi khi cách ba Hy Lạp cho phép hiểu theo phạm vi hoặc cách thức.'
- issue: Ý nghĩa của “niềm hy vọng thấy được”
  choice: Giữ cách nói nghịch lý trong câu chính và giải thích ngắn ở chú thích
  alternative: Diễn giải ngay thành “hy vọng hướng đến điều chưa thấy”
  rationale: Giữ hình thức lập luận và sự đối lập giữa thấy với hy vọng của nguyên văn, không thay câu của Phao-lô bằng lời giải thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng nhưng dễ hiểu. Dùng “chúng ta” để bao gồm người viết và người đọc; dùng “niềm hy vọng” nhất quán để chỉ ἐλπίς. Các dấu chú thích [a], [b] đều xuất hiện ngay sau mệnh đề liên quan.
