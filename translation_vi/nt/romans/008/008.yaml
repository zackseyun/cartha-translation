  text: Those who are in the flesh cannot please God[a].
translation:
  language: vi
  text: Những người ở trong xác thịt không thể làm đẹp lòng Đức Chúa Trời.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể hiểu: “ở trong bản tính tội lỗi.” Tiếng Hy Lạp nói “trong xác thịt,” một thuật ngữ then chốt của Phao-lô trong văn cảnh này.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ ... ὄντες
  choice: Những người sống
  rationale: Cấu trúc mạo từ với phân từ chỉ một nhóm người đang ở trong một tình trạng. “Những người sống” tự nhiên trong tiếng Việt và, khi đi với “theo xác thịt,” diễn đạt trạng thái hay định hướng sống mà văn cảnh nói đến.
- source_word: δὲ
  choice: —
  rationale: δέ nối tiếp và tạo sắc thái tương phản với câu trước, nhưng không cần dịch thành một liên từ riêng trong tiếng Việt vì sự tương phản đã rõ từ văn cảnh.
- source_word: ἐν σαρκὶ
  choice: theo xác thịt
  rationale: σάρξ là thuật ngữ quan trọng của Phao-lô trong Rô-ma 8. “Xác thịt” giữ được hình ảnh và mối liên hệ từ vựng trong đoạn; giới từ “theo” tạo câu tiếng Việt tự nhiên nhưng vẫn không đồng nhất thuật ngữ này một cách dứt khoát với “bản tính tội lỗi.”
- source_word: θεῷ ἀρέσαι
  choice: làm đẹp lòng Đức Chúa Trời
  rationale: Đây là cách diễn đạt tự nhiên, trang trọng trong tiếng Việt cho động từ ἀρέσκω với bổ ngữ ở cách dữ dữ liệu, mang nghĩa khiến Đức Chúa Trời hài lòng.
- source_word: οὐ δύνανται
  choice: không thể
  rationale: Diễn đạt ngắn gọn và chính xác sự phủ định khả năng.
theological_decisions:
- issue: Cách dịch σάρξ trong văn cảnh thần học gây tranh luận của Phao-lô
  choice: theo xác thịt
  alternative: theo bản tính tội lỗi; ở trong xác thịt
  rationale: Bản dịch chính giữ thuật ngữ “xác thịt” để bảo toàn sức nặng và sự căng thẳng thần học trong nguyên văn, thay vì giải nghĩa dứt khoát thành “bản tính tội lỗi.” Cách nói “theo xác thịt” phù hợp với mạch văn Rô-ma 8 và tự nhiên hơn “ở trong xác thịt” trong tiếng Việt, còn phương án diễn giải được ghi ở chú thích.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. “Đức Chúa Trời” được dùng nhất quán làm danh xưng chỉ θεός; cấu trúc câu ngắn, trực tiếp, phù hợp văn phong thư tín.
