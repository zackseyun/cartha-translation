id: ROM.8.6
reference: Romans 8:6
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: τὸ γὰρ φρόνημα τῆς σαρκὸς θάνατος, τὸ δὲ φρόνημα τοῦ πνεύματος ζωὴ καὶ εἰρήνη·
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/006.yaml
  text: For the mindset of the flesh is death[b][a], but the mindset of the Spirit is life and peace.
translation:
  language: vi
  text: Vì tâm trí hướng về xác thịt[a] là sự chết, còn tâm trí hướng về Thánh Linh[b] là sự sống và bình an.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “bản tính tội lỗi”.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “tinh thần”.
    reason: alternative_reading
lexical_decisions:
- source_word: γὰρ
  choice: Vì
  rationale: Giữ chức năng giải thích và nối câu này với lập luận ngay trước đó.
- source_word: φρόνημα
  choice: tâm trí hướng về
  rationale: Diễn đạt một định hướng hay khuynh hướng tư tưởng bền vững, chứ không chỉ riêng hoạt động trí tuệ; đồng thời tạo câu tiếng Việt tự nhiên.
- source_word: σάρξ
  choice: xác thịt
  rationale: Giữ thuật ngữ chủ chốt và tính căng thẳng thần học trong lập luận của Phao-lô, thay vì diễn giải ngay thành “bản tính tội lỗi”.
- source_word: θάνατος
  choice: sự chết
  rationale: Bản dịch trực tiếp, giữ được sức nặng cả theo nghĩa thông thường lẫn thần học và đối xứng với “sự sống”.
- source_word: πνεῦμα
  choice: Thánh Linh
  rationale: Ngữ cảnh Rô-ma 8 nhiều lần nói đến Thánh Linh như tác nhân ban sự sống; cách dịch này làm rõ nhận định theo ngữ cảnh, còn khả năng hiểu là “tinh thần” được ghi ở chú thích.
- source_word: ζωή
  choice: sự sống
  rationale: Cách dịch trực tiếp, giữ phép đối lập cô đọng với “sự chết”.
- source_word: εἰρήνη
  choice: bình an
  rationale: Cách nói tự nhiên và trang trọng trong tiếng Việt, đồng thời giữ nguyên chiều rộng ý nghĩa của từ nguồn.
theological_decisions:
- issue: πνεῦμα chỉ Thánh Linh hay tinh thần con người
  choice: Thánh Linh
  alternative: tinh thần
  rationale: Trong ngữ cảnh gần của Rô-ma 8, Phao-lô liên tục đối chiếu xác thịt với Thánh Linh là Đấng ban sự sống. Tuy vậy, hình thức Hy Lạp tự nó không viết hoa để phân biệt, nên giữ cách hiểu khác trong chú thích.
- issue: σάρξ nên được giữ theo nghĩa đen hay diễn giải
  choice: xác thịt
  alternative: bản tính tội lỗi
  rationale: “Xác thịt” bảo tồn từ ngữ và sự đa nghĩa trong thần học của Phao-lô; “bản tính tội lỗi” là một cách diễn giải hợp ngữ cảnh nhưng có thể thu hẹp nghĩa.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Cấu trúc đối xứng “là sự chết ... là sự sống và bình an” được giữ để phản ánh sự cô đọng của nguyên văn; “tâm trí hướng về” diễn đạt tự nhiên sắc thái định hướng của φρόνημα.
