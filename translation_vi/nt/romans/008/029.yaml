id: ROM.8.29
reference: Romans 8:29
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὅτι οὓς προέγνω, καὶ προώρισεν συμμόρφους τῆς εἰκόνος τοῦ υἱοῦ αὐτοῦ, εἰς τὸ εἶναι αὐτὸν πρωτότοκον ἐν πολλοῖς ἀδελφοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/029.yaml
  text: For those whom he foreknew[a], he also predestined to be conformed to the image of his Son[b], so that he might be the firstborn among many brothers.
translation:
  language: vi
  text: Vì những người Ngài đã biết trước[a], Ngài cũng đã định trước cho họ trở nên đồng dạng với hình ảnh của Con Ngài, để Con Ngài là con đầu lòng giữa nhiều anh em[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “đã biết từ trước”; một số người hiểu “biết trước” ở đây theo nghĩa quan hệ, tức là “đã đoái đến từ trước”.
    reason: alternative_reading
  - marker: b
    text: Từ Hy Lạp được dùng ở giống đực, nhưng trong gia đình của Đức Chúa Trời, nhóm người được nói đến có thể bao gồm cả nam lẫn nữ.
    reason: cultural_note
lexical_decisions:
- source_word: ὅτι
  choice: Vì
  rationale: Diễn đạt chức năng giải thích nguyên nhân hoặc cơ sở của mệnh đề này trong văn mạch trước đó.
- source_word: προέγνω
  choice: đã biết trước
  rationale: Giữ nghĩa trực tiếp và độ hàm súc của động từ Hy Lạp mà không quyết định thay người đọc rằng đây chỉ là sự biết trước về nhận thức hay sự đoái đến trong quan hệ.
- source_word: προώρισεν
  choice: đã định trước
  rationale: Thể hiện cả yếu tố có trước và hành động ấn định, đồng thời tránh thêm một cơ chế thần học mà câu không giải thích.
- source_word: συμμόρφους
  choice: trở nên đồng dạng
  rationale: Diễn đạt sự tương hợp về hình dạng hay khuôn mẫu; thêm “cho họ” để câu tiếng Việt rõ đối tượng nhưng không thêm nội dung mới.
- source_word: εἰκόνος
  choice: hình ảnh
  rationale: Giữ thuật ngữ giàu âm hưởng Kinh Thánh về hình ảnh, thay vì giản lược thành sự giống nhau nói chung.
- source_word: υἱοῦ
  choice: Con
  rationale: Giữ nguyên danh xưng chỉ quan hệ làm Con và ý nghĩa Cơ Đốc học của từ Hy Lạp.
- source_word: εἰς τὸ εἶναι
  choice: để ... là
  rationale: Giữ sắc thái mục đích hoặc kết quả của cấu trúc giới từ đi với động từ nguyên mẫu có mạo từ.
- source_word: πρωτότοκον
  choice: con đầu lòng
  rationale: Giữ nguyên hình ảnh thân tộc và hàm ý địa vị ưu tiên của từ Hy Lạp, thay vì thay bằng một cách diễn giải như “Đấng cao trọng nhất”.
- source_word: ἀδελφοῖς
  choice: anh em
  rationale: Phản ánh danh từ số nhiều giống đực trong tiếng Hy Lạp; chú thích làm rõ rằng nhóm được nói đến có thể bao gồm cả nam lẫn nữ.
theological_decisions:
- issue: Có nên dịch προέγνω theo cách giải quyết tranh luận về sự biết trước và sự tiền định hay không.
  choice: Dịch là “đã biết trước” và để ngỏ nội hàm chính xác.
  alternative: Diễn giải là “đã yêu thương từ trước” hoặc “đã chọn từ trước”.
  rationale: Nguyên văn không giải thích tại đây sự biết trước vận hành theo cơ chế nào; bản dịch vì thế không áp đặt một lập trường hệ phái.
- issue: Có nên diễn giải πρωτότοκον chỉ thành địa vị tối cao hay không.
  choice: Giữ hình ảnh “con đầu lòng”.
  alternative: Dịch diễn giải là “Đấng đứng đầu” hoặc “Đấng cao trọng nhất”.
  rationale: Từ Hy Lạp mang hình ảnh con đầu lòng cùng ý niệm ưu tiên; giữ ẩn dụ bảo toàn chiều sâu Kinh Thánh và sự căng thẳng thần học.
- issue: Có nên đưa cả nam lẫn nữ vào ngay trong cách dịch ἀδελφοῖς hay không.
  choice: Dùng “anh em” trong chính văn và giải thích phạm vi có thể bao gồm cả hai giới trong chú thích.
  alternative: Dịch là “anh chị em”.
  rationale: Cách này phản ánh hình thức giống đực của nguyên văn mà vẫn cho người đọc biết phạm vi quy chiếu có thể mang tính bao gồm.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” cho Đức Chúa Trời và lặp lại “Con Ngài” để tránh đại từ mơ hồ. Cụm “đồng dạng với hình ảnh” được giữ vì gần cấu trúc và hình tượng của nguyên văn, dù trang trọng hơn lời nói thường ngày.
