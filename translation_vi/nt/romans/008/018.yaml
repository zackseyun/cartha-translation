id: ROM.8.18
reference: Romans 8:18
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Λογίζομαι γὰρ ὅτι οὐκ ἄξια τὰ παθήματα τοῦ νῦν καιροῦ πρὸς τὴν μέλλουσαν δόξαν ἀποκαλυφθῆναι εἰς ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/018.yaml
  text: For I consider that the sufferings of the present time are not worthy to be compared with the coming glory that is to be revealed to us[a].
translation:
  language: vi
  text: Vì tôi nhận định rằng những đau khổ trong thời hiện tại không đáng để so sánh với vinh quang sắp được bày tỏ cho chúng ta[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “trong chúng ta.”'
    reason: alternative_reading
lexical_decisions:
- source_word: Λογίζομαι
  choice: tôi nhận định
  rationale: Diễn tả một sự đánh giá có suy xét, không chỉ là cảm nghĩ; cách nói tự nhiên và trang trọng trong tiếng Việt hiện đại.
- source_word: γὰρ
  choice: Vì
  rationale: Giữ chức năng giải thích hoặc làm cơ sở cho lời nói trước đó.
- source_word: οὐκ ἄξια ... πρὸς
  choice: không đáng gì khi so với
  rationale: Thể hiện sự chênh lệch không thể cân xứng trong phép so sánh, đồng thời tự nhiên trong tiếng Việt.
- source_word: τὰ παθήματα
  choice: những đau khổ
  rationale: Chỉ những đau khổ người ta trải qua, phù hợp với ngữ cảnh của Phao-lô.
- source_word: τοῦ νῦν καιροῦ
  choice: trong thời hiện tại
  rationale: Giữ nghĩa về thời kỳ hiện nay mà không tự ý thêm sắc thái thần học của từ “thời đại”.
- source_word: τὴν μέλλουσαν δόξαν
  choice: vinh quang sắp
  rationale: Giữ riêng sắc thái hướng tới tương lai của μέλλουσαν mà tránh diễn đạt rườm rà.
- source_word: ἀποκαλυφθῆναι
  choice: được bày tỏ
  rationale: Giữ thể bị động và ý nghĩa vinh quang sẽ được làm cho hiển lộ.
- source_word: εἰς ἡμᾶς
  choice: cho chúng ta
  rationale: Diễn đạt tự nhiên hướng quy chiếu của vinh quang đối với các tín hữu, đồng thời giữ phương án “trong chúng ta” ở chú thích.
theological_decisions:
- issue: Ý nghĩa của εἰς ἡμᾶς khi vinh quang được bày tỏ
  choice: cho chúng ta
  alternative: trong chúng ta
  rationale: Cụm từ có thể chỉ sự bày tỏ hướng đến chúng ta hoặc diễn ra nơi chúng ta. Bản chính chọn cách nói tự nhiên hơn trong tiếng Việt, còn chú thích bảo tồn sắc thái tham dự nội tại mà không giải quyết dứt khoát sự mơ hồ.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. “Không đáng gì khi so với” truyền đạt sự bất cân xứng mạnh mẽ; “sắp được bày tỏ” bảo toàn cả ý tương lai của μέλλουσαν lẫn ý hiển lộ của ἀποκαλυφθῆναι.
