  - severity: low
    issue: Chú thích b thêm diễn giải về phạm vi mọi người tin vượt quá thông tin từ vựng trực tiếp của chú thích.
    rationale: Có thể giữ nét nghĩa “con trai” và khả năng dịch ngắn hơn mà không cần giải thích thần học mở rộng; điều này giúp chú thích trung tính và tập trung vào văn bản.
