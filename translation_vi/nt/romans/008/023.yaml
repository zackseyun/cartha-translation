revisions:
- from: Không những thế, mà chính chúng ta, là những người có hoa lợi đầu mùa của Thánh Linh[a], chính chúng ta cũng than thở trong lòng, thiết tha trông đợi việc được nhận làm con trai[b]—tức là sự cứu chuộc thân thể chúng ta[c].
  to: Không chỉ vậy, nhưng chính chúng ta—những người có trái đầu mùa của Thánh Linh[a]—cũng chính chúng ta than thở trong lòng, thiết tha trông đợi việc được nhận làm con trai[b]—tức là sự cứu chuộc thân thể chúng ta[c].
  rationale: Bản sửa thay một cách dùng ít tự nhiên bằng “trái đầu mùa,” đồng thời làm rõ nhịp nhấn mạnh của hai lần αὐτοί bằng cấu trúc xen gạch ngang. Các thuật ngữ thần học, tính mơ hồ của sở hữu cách trong “của Thánh Linh,” và quan hệ đồng vị cuối câu được giữ nguyên. Chú thích b được thu gọn để chỉ nêu dữ liệu từ vựng cần thiết.
