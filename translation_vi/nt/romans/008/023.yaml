id: ROM.8.23
reference: Romans 8:23
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οὐ μόνον δέ, ἀλλὰ ⸂καὶ αὐτοὶ⸃ τὴν ἀπαρχὴν τοῦ πνεύματος ἔχοντες ⸂ἡμεῖς καὶ⸃ αὐτοὶ ἐν ἑαυτοῖς στενάζομεν, υἱοθεσίαν ἀπεκδεχόμενοι τὴν ἀπολύτρωσιν τοῦ σώματος ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/023.yaml
  text: And not only that[a], but we ourselves also, who have the firstfruits of the Spirit, even we ourselves groan within ourselves[c][b], eagerly awaiting adoption as sons—the redemption of our bodies.
translation:
  language: vi
  text: Không chỉ vậy, nhưng chính chúng ta—những người có trái đầu mùa của Thánh Linh[a]—cũng chính chúng ta than thở trong lòng, thiết tha trông đợi việc được nhận làm con trai[b]—tức là sự cứu chuộc thân thể chúng ta[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể hiểu: “có Thánh Linh là trái đầu mùa.”'
    reason: alternative_reading
  - marker: b
    text: Cũng có thể dịch đơn giản là “việc được nhận làm con.” Từ Hy Lạp sát nghĩa hơn có yếu tố “con trai.”
    reason: lexical_alternative
  - marker: c
    text: Tiếng Hy Lạp viết “thân thể của chúng ta” ở số ít, được dùng theo nghĩa phân phối để nói về thân thể của mỗi người.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ μόνον δέ, ἀλλὰ
  choice: Không những thế, mà
  rationale: Nối tiếp ý tương phản từ câu trước và giữ cấu trúc nhấn mạnh của tiếng Hy Lạp bằng lối diễn đạt tự nhiên trong tiếng Việt.
- source_word: καὶ αὐτοὶ / ἡμεῖς καὶ αὐτοὶ
  choice: chính chúng ta ... chính chúng ta cũng
  rationale: Giữ sự lặp lại có chủ ý và sắc thái nhấn mạnh rằng ngay cả những người tin cũng cùng than thở.
- source_word: τὴν ἀπαρχὴν τοῦ πνεύματος
  choice: hoa lợi đầu mùa của Thánh Linh
  rationale: '“Hoa lợi đầu mùa” diễn đạt phần đầu tiên của mùa thu hoạch và vẫn để ngỏ quan hệ của sở hữu cách: điều Thánh Linh ban hoặc chính Thánh Linh như phần đầu mùa.'
- source_word: ἔχοντες
  choice: là những người có
  rationale: Chuyển phân từ thành mệnh đề quan hệ để câu tiếng Việt sáng rõ mà không thêm ý.
- source_word: ἐν ἑαυτοῖς
  choice: trong lòng
  rationale: Diễn đạt tự nhiên địa điểm nội tâm của tiếng than thở; không hàm ý tiếng than ấy nhất thiết không phát ra thành lời.
- source_word: στενάζομεν
  choice: than thở
  rationale: Giữ liên hệ từ vựng với tiếng than thở của tạo vật trong văn cảnh, đồng thời là cách nói hiện đại, dễ hiểu.
- source_word: υἱοθεσίαν
  choice: việc được nhận làm con trai
  rationale: Giữ hình ảnh pháp lý về địa vị người con trai và quyền thừa kế trong từ Hy Lạp, trong khi chú thích làm rõ phạm vi bao gồm mọi người tin.
- source_word: ἀπεκδεχόμενοι
  choice: thiết tha trông đợi
  rationale: Thể hiện sự chờ đợi đầy mong mỏi và hướng về điều sẽ đến.
- source_word: τὴν ἀπολύτρωσιν
  choice: sự cứu chuộc
  rationale: Giữ thuật ngữ thần học nhất quán và sắc thái giải thoát trọn vẹn trong tương lai.
- source_word: τοῦ σώματος ἡμῶν
  choice: thân thể chúng ta
  rationale: Tiếng Hy Lạp dùng danh từ số ít theo nghĩa phân phối; tiếng Việt có thể giữ số ít tự nhiên mà vẫn chỉ thân thể của mỗi người trong cộng đồng.
theological_decisions:
- issue: Cách dịch υἱοθεσίαν để giữ hình ảnh địa vị con trai và quyền thừa kế mà không loại phụ nữ khỏi đối tượng được nói đến
  choice: việc được nhận làm con trai
  alternative: việc được nhận làm con; địa vị làm con
  rationale: Từ Hy Lạp mang yếu tố “con trai” trong bối cảnh pháp lý-thừa kế. Bản chính giữ yếu tố ấy, còn chú thích nói rõ rằng lời hứa áp dụng cho mọi người tin, cả nam lẫn nữ.
- issue: “Hoa lợi đầu mùa của Thánh Linh” là ân ban đến từ Thánh Linh hay chính Thánh Linh là hoa lợi đầu mùa
  choice: hoa lợi đầu mùa của Thánh Linh
  alternative: Thánh Linh là hoa lợi đầu mùa
  rationale: Cấu trúc sở hữu cách trong tiếng Hy Lạp cho phép cả hai cách hiểu. Bản chính không quyết định thay cho độc giả, và chú thích bảo tồn cách hiểu đồng vị.
- issue: Quan hệ giữa việc được nhận làm con trai và sự cứu chuộc thân thể
  choice: dùng dấu gạch ngang và “tức là”
  alternative: dùng dấu phẩy đơn thuần
  rationale: 'Cách trình bày này phản ánh quan hệ đồng vị trong câu: sự cứu chuộc thân thể là phương diện hoàn tất trong tương lai của việc được nhận làm con, chứ không phải một điều hoàn toàn tách biệt.'
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại, dùng “Thánh Linh” nhất quán như danh xưng. Cấu trúc lặp “chính chúng ta” được giữ để phản ánh sự nhấn mạnh của nguyên văn. “Hoa lợi đầu mùa” dễ hiểu hơn lối nói cổ, còn “sự cứu chuộc” bảo tồn trọng lượng thần học của thuật ngữ Phao-lô.
