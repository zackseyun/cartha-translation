revisions:
- from: vì tâm trí hướng theo xác thịt là sự thù nghịch với Đức Chúa Trời[a]; bởi tâm trí ấy không thuận phục luật pháp của Đức Chúa Trời, mà thật ra cũng không thể thuận phục.[b]
  to: vì tâm trí hướng theo xác thịt là sự thù nghịch với Đức Chúa Trời[a]; vì nó không phục tùng luật của Đức Chúa Trời, vì nó cũng không thể phục tùng.[b]
  rationale: Sửa liên từ và cách diễn đạt mệnh đề cuối để phản ánh γάρ và οὐδέ mà không thêm sắc thái đối lập. Đổi “luật pháp” thành “luật” và “thuận phục” thành “phục tùng” cho tự nhiên, trực tiếp hơn, đồng thời vẫn giữ ý đặt mình dưới thẩm quyền. Chú thích a giữ nguyên cách hiểu thay thế của σάρξ; chú thích b được chỉnh để khớp với bản văn đã sửa.
