id: ROM.8.7
reference: Romans 8:7
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: διότι τὸ φρόνημα τῆς σαρκὸς ἔχθρα εἰς θεόν, τῷ γὰρ νόμῳ τοῦ θεοῦ οὐχ ὑποτάσσεται, οὐδὲ γὰρ δύναται·
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/007.yaml
  text: because the mindset of the flesh is hostility toward God[a], for it does not submit to the law of God[b], for it is not even able.
translation:
  language: vi
  text: vì tâm trí hướng theo xác thịt là sự thù nghịch với Đức Chúa Trời[a]; vì nó không phục tùng luật của Đức Chúa Trời, vì nó cũng không thể phục tùng.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “tâm trí hướng theo bản tính tội lỗi là sự thù nghịch với Đức Chúa Trời.”
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn: “vì cũng không thể.” Động từ “phục tùng” được hiểu từ mệnh đề trước.'
    reason: ellipsis_clarification
lexical_decisions:
- source_word: διότι
  choice: vì
  rationale: Giữ rõ quan hệ nguyên nhân với mệnh đề trước và tự nhiên trong tiếng Việt hiện đại.
- source_word: τὸ φρόνημα τῆς σαρκὸς
  choice: tâm trí hướng theo xác thịt
  rationale: φρόνημα chỉ khuynh hướng hay định hướng của tâm trí, không chỉ hoạt động trí tuệ; cách dịch này cũng giữ σάρξ là “xác thịt” mà không đồng nhất nó với thân thể vật chất.
- source_word: ἔχθρα εἰς θεόν
  choice: sự thù nghịch với Đức Chúa Trời
  rationale: Giữ cấu trúc danh từ và diễn tả tình trạng đối nghịch hướng về Đức Chúa Trời.
- source_word: τῷ νόμῳ τοῦ θεοῦ οὐχ ὑποτάσσεται
  choice: không thuận phục luật pháp của Đức Chúa Trời
  rationale: “Thuận phục” diễn tả sự đặt mình dưới thẩm quyền; thì hiện tại nêu một thực trạng đang có.
- source_word: οὐδὲ γὰρ δύναται
  choice: mà thật ra cũng không thể thuận phục
  rationale: Nêu rõ sự bất lực và bổ sung động từ theo ngữ cảnh để câu tiếng Việt đầy đủ, đồng thời giữ sức nhấn của οὐδέ và γάρ.
theological_decisions:
- issue: Cách hiểu σάρξ theo nghĩa đen hay nghĩa ẩn dụ
  choice: Dùng “xác thịt” trong chính văn và chú thích cách hiểu “bản tính tội lỗi”.
  alternative: bản tính tội lỗi
  rationale: Ngữ cảnh nói đến định hướng con người chống nghịch Đức Chúa Trời chứ không đơn thuần nói về cơ thể, nhưng giữ thuật ngữ nguồn giúp tránh giải nghĩa quá mức.
- issue: Tính chất của ἔχθρα
  choice: Giữ danh từ “sự thù nghịch”, thay vì làm nhẹ thành tính từ.
  alternative: thù nghịch với Đức Chúa Trời
  rationale: 'Bảo tồn cách phát biểu mạnh của nguyên văn: định hướng của xác thịt không chỉ có thái độ không thân thiện mà chính là sự thù nghịch.'
- issue: Ý nghĩa của mệnh đề cuối về khả năng thuận phục
  choice: Khẳng định rõ “cũng không thể thuận phục”.
  alternative: không muốn thuận phục
  rationale: δύναται trực tiếp nói đến khả năng. Bản dịch giữ nguyên sự căng thẳng thần học về bất lực mà không bổ sung một hệ thống giáo lý để giải thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Tâm trí hướng theo” truyền đạt sắc thái định hướng của φρόνημα; “thuận phục” giữ sắc thái đặt mình dưới thẩm quyền. Dấu chấm phẩy làm rõ hai vế lý do liên kết chặt chẽ.
