  to: Ai sẽ phân rẽ chúng ta khỏi tình yêu của Đấng Mê-si? Phải chăng hoạn nạn, khốn quẫn, bắt bớ, đói kém, trần truồng, hiểm nguy hay thanh gươm?[a]
