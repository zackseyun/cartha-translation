    issue: “gươm giáo” dịch μάχαιρα
    rationale: μάχαιρα là một “gươm/thanh gươm” số ít. “Gươm giáo” mở rộng hình ảnh sang nhiều loại vũ khí, đặc biệt thêm “giáo,” nên không sát nguyên văn.
  - severity: low
    issue: “khốn khổ” cho στενοχωρία
    rationale: “Khốn khổ” khá rộng và có thể trùng lấn với hoạn nạn. “Khốn quẫn” giữ rõ hơn sắc thái bị dồn ép, quẫn bách của στενοχωρία.
