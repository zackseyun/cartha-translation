id: ROM.8.35
reference: Romans 8:35
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: τίς ἡμᾶς χωρίσει ἀπὸ τῆς ἀγάπης τοῦ Χριστοῦ; θλῖψις ἢ στενοχωρία ἢ διωγμὸς ἢ λιμὸς ἢ γυμνότης ἢ κίνδυνος ἢ μάχαιρα;
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/035.yaml
  text: Who will separate us from the Messiah’s love? Will trouble or distress or persecution or famine or nakedness or danger or sword?[a]
translation:
  language: vi
  text: Ai sẽ phân rẽ chúng ta khỏi tình yêu của Đấng Mê-si? Phải chăng hoạn nạn, khốn quẫn, bắt bớ, đói kém, trần truồng, hiểm nguy hay thanh gươm?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể hiểu là “khỏi tình yêu của chúng ta dành cho Đấng Mê-si.” Cấu trúc sở hữu trong tiếng Hy Lạp có thể được hiểu theo cách ấy, dù văn cảnh thiên về nghĩa “tình yêu của Đấng Mê-si dành cho chúng ta.”
    reason: alternative_reading
lexical_decisions:
- source_word: τίς
  choice: Ai
  rationale: Đại từ nghi vấn chỉ người được dịch tự nhiên là “Ai”, giữ nguyên câu hỏi tu từ của Phao-lô; dù các danh từ theo sau chỉ hoàn cảnh, cách mở đầu bằng τίς nhân cách hóa những thế lực có thể bị cho là gây chia lìa.
- source_word: χωρίσει
  choice: sẽ phân rẽ
  rationale: Động từ tương lai diễn tả hành động chia lìa có thể xảy ra; “phân rẽ” trực tiếp, trang trọng và tự nhiên trong văn cảnh.
- source_word: ἀγάπης
  choice: tình yêu
  rationale: “Tình yêu” là cách tương đương tự nhiên và rõ nghĩa của ἀγάπη trong tiếng Việt hiện đại.
- source_word: τοῦ Χριστοῦ
  choice: của Đấng Mê-si
  rationale: Χριστός là tước hiệu; “Đấng Mê-si” giữ đặc tính tước hiệu. Cấu trúc sở hữu “tình yêu của Đấng Mê-si” sát với ngữ pháp Hy Lạp và trong văn cảnh chủ yếu chỉ tình yêu Đấng Mê-si dành cho chúng ta.
- source_word: θλῖψις
  choice: hoạn nạn
  rationale: “Hoạn nạn” diễn đạt nghịch cảnh và áp lực nặng nề, đồng thời giữ sắc thái nghiêm trang quen thuộc trong văn Kinh Thánh.
- source_word: στενοχωρία
  choice: khốn khổ
  rationale: Từ này gợi tình cảnh bị dồn ép, ngặt nghèo; “khốn khổ” phân biệt tương đối với “hoạn nạn” và dễ hiểu trong tiếng Việt hiện đại.
- source_word: διωγμός
  choice: bắt bớ
  rationale: “Bắt bớ” là cách dịch chuẩn, rõ ràng cho sự ngược đãi vì đức tin.
- source_word: λιμός
  choice: đói kém
  rationale: “Đói kém” chỉ tình trạng thiếu lương thực nghiêm trọng, phù hợp hơn cảm giác đói cá nhân.
- source_word: γυμνότης
  choice: trần truồng
  rationale: Cách dịch trực tiếp giữ hình ảnh cụ thể về tình trạng không có quần áo, đồng thời có thể gợi cảnh thiếu thốn cùng cực.
- source_word: κίνδυνος
  choice: nguy hiểm
  rationale: Đây là từ hiện đại, tự nhiên và chính xác cho tình trạng hiểm nguy.
- source_word: μάχαιρα
  choice: gươm giáo
  rationale: “Gươm giáo” giữ hình ảnh vũ khí và mối đe dọa chết chóc; cách nói này tự nhiên hơn “thanh gươm” khi liệt kê một hiểm họa khái quát.
theological_decisions:
- issue: Ý nghĩa sở hữu của τοῦ Χριστοῦ
  choice: tình yêu của Đấng Mê-si, hiểu chủ yếu là tình yêu Đấng Mê-si dành cho chúng ta
  alternative: tình yêu của chúng ta dành cho Đấng Mê-si
  rationale: Danh cách sở hữu Hy Lạp có thể được hiểu theo hướng chủ thể hoặc đối tượng. Mạch văn Rô-ma 8:31–39 nghiêng mạnh về tình yêu của Đấng Mê-si dành cho người tin, nên cách này được dùng trong chính văn; cách hiểu còn lại được bảo lưu trong chú thích.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Câu thứ hai thêm “Phải chăng là” để chuyển tự nhiên từ đại từ nghi vấn chỉ người τίς sang chuỗi hoàn cảnh được nhân cách hóa, đồng thời giữ lực của câu hỏi tu từ. Dùng “Đấng Mê-si” như một tước hiệu thay vì phiên âm “Christ”.
