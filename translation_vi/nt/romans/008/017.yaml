id: ROM.8.17
reference: Romans 8:17
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εἰ δὲ τέκνα, καὶ κληρονόμοι· κληρονόμοι μὲν θεοῦ, συγκληρονόμοι δὲ Χριστοῦ, εἴπερ συμπάσχομεν ἵνα καὶ συνδοξασθῶμεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/017.yaml
  text: and if children[a], then heirs also—heirs of God and fellow heirs with Messiah, if indeed we suffer with him so that we may also be glorified with him.
translation:
  language: vi
  text: Nếu đã là con cái, thì cũng là những người thừa kế—những người thừa kế của Đức Chúa Trời và đồng thừa kế với Đấng Mê-si—nếu quả thật chúng ta cùng chịu khổ với Ngài, để chúng ta cũng được tôn vinh cùng Ngài.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τέκνα
  choice: con cái
  rationale: Danh từ số nhiều trung tính chỉ địa vị làm con mà không xác định giới tính; “con cái” vừa chính xác vừa tự nhiên trong tiếng Việt.
- source_word: κληρονόμοι
  choice: những người thừa kế
  rationale: Giữ rõ hình ảnh pháp lý-gia đình về những người nhận cơ nghiệp.
- source_word: θεοῦ
  choice: của Đức Chúa Trời
  rationale: Dịch trực tiếp sở hữu cách, không thu hẹp sự mơ hồ về quan hệ giữa Đức Chúa Trời và cơ nghiệp.
- source_word: συγκληρονόμοι
  choice: đồng thừa kế
  rationale: Tiền tố συν- diễn tả việc cùng chung địa vị và cơ nghiệp; “đồng thừa kế” ngắn gọn, rõ nghĩa trong tiếng Việt hiện đại.
- source_word: Χριστοῦ
  choice: Đấng Mê-si
  rationale: Giữ ý nghĩa tước hiệu của Χριστός, tức Đấng được xức dầu, đồng thời dùng cách gọi dễ nhận biết trong tiếng Việt.
- source_word: εἴπερ
  choice: nếu quả thật
  rationale: Bảo toàn cả tính điều kiện thực sự lẫn sắc thái nhấn mạnh, mong đợi của câu Hy Lạp.
- source_word: συμπάσχομεν
  choice: chúng ta cùng chịu khổ với Ngài
  rationale: Nêu rõ ý cùng tham dự được biểu đạt bởi tiền tố συν- và đối tượng ngầm hiểu theo ngữ cảnh là Đấng Mê-si.
- source_word: ἵνα
  choice: thì
  rationale: Trong cấu trúc điều kiện-mục đích của cả mệnh đề, “thì” nối kết hệ quả hướng đến mà không làm câu tiếng Việt nặng nề; ý hướng đến kết quả vẫn được giữ trong toàn câu.
- source_word: συνδοξασθῶμεν
  choice: chúng ta cũng sẽ được tôn vinh cùng Ngài
  rationale: “Được tôn vinh” giữ thể bị động, còn “cùng Ngài” giữ ý đồng tham dự của tiền tố συν-; “cũng” phản ánh καί.
theological_decisions:
- issue: Mệnh đề εἴπερ συμπάσχομεν là điều kiện có tính công trạng hay khuôn mẫu dự phần với Đấng Mê-si
  choice: Giữ điều kiện thực sự bằng “nếu quả thật chúng ta cùng chịu khổ với Ngài”.
  alternative: Làm yếu điều kiện thành “vì chúng ta cùng chịu khổ với Ngài”, hoặc diễn giải rằng chịu khổ tạo công trạng để được tôn vinh.
  rationale: Bản Hy Lạp có lực điều kiện rõ ràng, nhưng câu không nói sự chịu khổ là công trạng mua lấy vinh quang; bản dịch vì thế giữ nguyên sức căng thần học thay vì giải quyết theo một hệ phái.
- issue: Quan hệ thời thái trong συνδοξασθῶμεν
  choice: Dùng “sẽ được tôn vinh” để diễn đạt tự nhiên viễn cảnh được tôn vinh gắn với điều kiện ở mệnh đề trước.
  alternative: Dùng “có thể được tôn vinh” để phản ánh sát hơn hình thái giả định cách.
  rationale: Giả định cách ở đây do ἵνα chi phối, không nhất thiết biểu thị sự bất định; “sẽ được” là tiếng Việt tự nhiên mà không biến sự tôn vinh thành thành quả do con người tự tạo.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại. Dùng “Đức Chúa Trời” và đại từ tôn kính “Ngài”; giữ nhịp lập luận bằng dấu gạch ngang và dấu chấm phẩy. Không tiếp nhận chú thích [a] của lớp tham khảo tiếng Anh vì nội dung chú thích không tương ứng với vị trí ký hiệu sau “children” và không phản ánh một dị bản trong nguồn Hy Lạp.
