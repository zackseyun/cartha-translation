  to: Nếu đã là con cái, thì cũng là những người thừa kế—những người thừa kế của Đức Chúa Trời và đồng thừa kế với Đấng Mê-si—nếu quả thật chúng ta cùng chịu khổ với Ngài, để chúng ta cũng được tôn vinh cùng Ngài.
  rationale: Chỉ điều chỉnh cách diễn đạt ἵνα từ “thì” sang “để” và dùng dấu gạch ngang để phân định mệnh đề điều kiện bổ nghĩa cho toàn khẳng định về địa vị đồng thừa kế. Bản sửa giữ nguyên tính điều kiện của εἴπερ, không hàm ý chịu khổ có công trạng, và bảo toàn thể bị động cùng ý đồng tham dự trong συνδοξασθῶμεν.
