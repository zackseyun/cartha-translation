    issue: «Còn» ở đầu câu
    rationale: δέ trong câu này là liên từ nối nhẹ, không biểu thị sự đối lập rõ. «Và» tái hiện mạch nối trung tính hơn và phù hợp với quyết định từ vựng đã nêu.
  revised_text: Và những người Ngài đã định trước[a], Ngài cũng kêu gọi; những người Ngài đã kêu gọi, Ngài cũng xưng công chính; và những người Ngài đã xưng công chính, Ngài cũng làm cho vinh hiển.[b]
