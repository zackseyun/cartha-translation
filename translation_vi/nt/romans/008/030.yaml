revisions:
- from: Còn những người Ngài đã định trước[a], Ngài cũng kêu gọi; những người Ngài đã kêu gọi, Ngài cũng xưng công chính; và những người Ngài đã xưng công chính, Ngài cũng làm cho vinh hiển.[b]
  to: Và những người Ngài đã định trước[a], Ngài cũng kêu gọi; những người Ngài đã kêu gọi, Ngài cũng xưng công chính; và những người Ngài đã xưng công chính, Ngài cũng làm cho vinh hiển.[b]
  rationale: Chỉ thay «Còn» bằng «Và» để phản ánh chính xác hơn chức năng nối nhẹ của δέ. Giữ nguyên các thuật ngữ then chốt, cấu trúc lặp, thì quá khứ của ἐδόξασεν và các chú thích, nhờ đó không thay đổi ý nghĩa hay giải quyết các tranh luận thần học vượt quá câu văn.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T10:25:25Z'
