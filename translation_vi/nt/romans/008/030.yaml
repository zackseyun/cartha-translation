  verdict: revise
  source_fidelity: 'Bản dịch giữ đúng chuỗi tương quan οὓς ... τούτους và các động từ quá khứ: định trước, kêu gọi, xưng công chính, làm cho vinh hiển. Tuy nhiên, từ mở đầu «Còn» khiến δέ nghe như một đối lập hoặc chuyển hướng rõ hơn mức liên từ nhẹ trong nguyên văn; nên dùng «Và».'
  naturalness: Câu rõ ràng, trang trọng và phù hợp tiếng Việt hiện đại. Việc lặp «những người» bảo toàn nhịp điệu lập luận. «Và» ở đầu câu tự nhiên hơn «Còn» trong mạch liền kề này.
  terminology: «Đã định trước», «đã kêu gọi», và «đã xưng công chính» là những tương đương nhất quán, không áp đặt cách giải thích hệ phái. «Đã làm cho vinh hiển» phản ánh aorist; chú thích nêu hợp lý khả năng cách dùng quá khứ nói về tương lai chắc chắn.
  issues:
