id: ROM.8.30
reference: Romans 8:30
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οὓς δὲ προώρισεν, τούτους καὶ ἐκάλεσεν· καὶ οὓς ἐκάλεσεν, τούτους καὶ ἐδικαίωσεν· οὓς δὲ ἐδικαίωσεν, τούτους καὶ ἐδόξασεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/030.yaml
  text: And those whom he predestined[a], he also called; and those whom he called, he also justified; and those whom he justified[b], he also glorified.
translation:
  language: vi
  text: Và những người Ngài đã định trước[a], Ngài cũng kêu gọi; những người Ngài đã kêu gọi, Ngài cũng xưng công chính; và những người Ngài đã xưng công chính, Ngài cũng làm cho vinh hiển.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đã tiền định” hoặc “đã ấn định từ trước.”'
    reason: lexical_alternative
  - marker: b
    text: 'Tiếng Hy Lạp dùng dạng quá khứ: “đã làm cho vinh hiển”; một số người hiểu đây là vinh quang trong tương lai, chắc chắn đến mức được nói như thể đã hoàn tất.'
    reason: alternative_reading
lexical_decisions:
- source_word: προώρισεν
  choice: đã định trước
  rationale: Diễn đạt trực tiếp ý quyết định hay ấn định từ trước, đồng thời tránh tự động gắn câu với một hệ thống thần học riêng biệt.
- source_word: ἐκάλεσεν
  choice: đã kêu gọi
  rationale: Cách dịch quen thuộc, tự nhiên, và giữ nguyên mối liên kết thần học trong chuỗi lập luận của Phao-lô.
- source_word: ἐδικαίωσεν
  choice: đã xưng công chính
  rationale: Giữ sắc thái pháp lý thường thấy của δικαιόω trong thư Phao-lô; súc tích hơn cách diễn giải “tuyên bố là công chính”.
- source_word: ἐδόξασεν
  choice: đã làm cho vinh hiển
  rationale: Phản ánh thể bất định quá khứ của động từ Hy Lạp và giữ nguyên nhịp chuỗi hành động, không đổi thành thì tương lai trong chính văn.
- source_word: οὓς ... τούτους
  choice: những người ... Ngài
  rationale: Cấu trúc tiếng Việt tự nhiên nhưng vẫn cho thấy cùng một nhóm người xuyên suốt từng mệnh đề.
- source_word: καὶ
  choice: cũng
  rationale: Thể hiện lực bổ sung và sự tiến triển nối tiếp giữa các hành động.
- source_word: δὲ
  choice: còn / và
  rationale: Đây là liên từ chuyển ý nhẹ; “còn” phù hợp ở đầu câu, trong khi “và” nối mệnh đề cuối một cách tự nhiên.
theological_decisions:
- issue: Có nên làm nhẹ nghĩa của προώρισεν để tránh hàm ý hệ phái hay không
  choice: đã định trước
  alternative: đã tiền định; đã ấn định từ trước
  rationale: Nguyên văn nói rõ một hành động định đoạt từ trước. Bản dịch giữ nội dung ấy nhưng không thêm lời giải thích nhằm phân xử các tranh luận thần học về cách thức hay nền tảng của việc định trước.
- issue: Nên dịch ἐδόξασεν ở quá khứ hay chuyển thành tương lai
  choice: đã làm cho vinh hiển
  alternative: sẽ làm cho vinh hiển
  rationale: Nguyên văn dùng động từ bất định chỉ định, nên chính văn giữ dạng quá khứ. Cách hiểu rằng đây là vinh quang tương lai chắc chắn đến mức được nói như đã hoàn tất được ghi ở chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ sự lặp lại có chủ ý của nguyên văn để bảo toàn chuỗi lập luận. Dùng “Ngài” cho chủ thể được hiểu là Đức Chúa Trời theo ngữ cảnh; không thêm danh xưng vào câu.
