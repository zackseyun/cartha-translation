- from: Ai sẽ đưa lời buộc tội chống lại những người được Đức Chúa Trời chọn[a][b]? Chính Đức Chúa Trời là Đấng tuyên xưng họ là công chính[c].
  to: Ai sẽ đưa ra lời buộc tội chống lại những người được Đức Chúa Trời chọn[a][b]? Chính Đức Chúa Trời là Đấng xưng họ là công chính[c].
  rationale: Sửa “tuyên xưng” thành “xưng” để phản ánh chính xác và tự nhiên hơn động từ δικαιόω trong văn mạch pháp lý, đồng thời điều chỉnh chú thích tương ứng. Thêm “ra” trong “đưa ra lời buộc tội” chỉ nhằm làm câu tiếng Việt trôi chảy hơn, không thay đổi nghĩa.
  reviewer_model: gpt-5.6-terra
