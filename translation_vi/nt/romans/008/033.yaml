  text: τίς ἐγκαλέσει κατὰ ἐκλεκτῶν θεοῦ; θεὸς ὁ δικαιῶν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/033.yaml
  text: Who will bring a charge against God's chosen ones? It is God who justifies[a][b][c].
translation:
  language: vi
  text: Ai sẽ đưa ra lời buộc tội chống lại những người được Đức Chúa Trời chọn[a][b]? Chính Đức Chúa Trời là Đấng xưng họ là công chính[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “những người được tuyển chọn của Đức Chúa Trời.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “Ai sẽ cáo buộc những người được Đức Chúa Trời chọn?”'
    reason: lexical_alternative
  - marker: c
    text: 'Cụm từ “xưng họ là công chính” mang sắc thái pháp lý: Đức Chúa Trời là Đấng tuyên bố họ là công chính.'
    reason: cultural_note
lexical_decisions:
- source_word: τίς
  choice: Ai
  rationale: Đại từ nghi vấn mở đầu câu hỏi tu từ; “Ai” trực tiếp và tự nhiên trong tiếng Việt.
- source_word: ἐγκαλέσει
  choice: sẽ đưa lời buộc tội
  rationale: Động từ mang sắc thái pháp lý là đưa ra cáo buộc; cách dịch này giữ được bối cảnh pháp đình.
- source_word: κατὰ
  choice: chống lại
  rationale: Đi với động từ chỉ sự cáo buộc, giới từ này diễn tả đối tượng bị buộc tội.
- source_word: ἐκλεκτῶν θεοῦ
  choice: những người được Đức Chúa Trời chọn
  rationale: Tính từ được dùng như danh từ và kết hợp với sở hữu cách; cách diễn đạt này rõ nghĩa, tự nhiên và không áp đặt một thuật ngữ thần học kỹ thuật.
- source_word: θεὸς ὁ δικαιῶν
  choice: Chính Đức Chúa Trời là Đấng tuyên xưng họ là công chính
  rationale: “Chính” thể hiện sự nhấn mạnh; “tuyên xưng ... là công chính” làm rõ nghĩa pháp lý của δικαιόω trong văn cảnh mà vẫn giữ Đức Chúa Trời là chủ thể hành động.
theological_decisions:
- issue: Cách dịch ἐκλεκτῶν mà không nhập vào văn bản một hệ thống giáo lý hậu kỳ
  choice: những người được Đức Chúa Trời chọn
  alternative: những người được tuyển chọn của Đức Chúa Trời
  rationale: Bản dịch diễn đạt minh bạch hành động chọn của Đức Chúa Trời nhưng không biến từ này thành một nhãn thần học chuyên biệt.
- issue: Cấu trúc nhấn mạnh và cô đọng θεὸς ὁ δικαιῶν
  choice: Chính Đức Chúa Trời là Đấng tuyên xưng họ là công chính
  alternative: Đức Chúa Trời là Đấng làm cho họ nên công chính
  rationale: Cách chọn giữ sự nhấn mạnh vào Đức Chúa Trời và sắc thái pháp đình của động từ, nhưng không giải quyết thay cho độc giả mọi chiều kích thần học của việc xưng công chính.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Câu hỏi tu từ cùng ngôn ngữ pháp đình được giữ rõ; “Đức Chúa Trời” phù hợp văn phong Kinh Thánh Tin Lành phổ thông, còn cấu trúc “Chính ... là Đấng” truyền đạt sự nhấn mạnh của tiếng Hy Lạp.
