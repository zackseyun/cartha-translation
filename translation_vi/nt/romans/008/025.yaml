  text: εἰ δὲ ὃ οὐ βλέπομεν ἐλπίζομεν, δι’ ὑπομονῆς ἀπεκδεχόμεθα.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/025.yaml
  text: But if we hope for what we do not see[b][a], we wait for it with patient endurance.
translation:
  language: vi
  text: Nhưng nếu chúng ta hy vọng về điều chúng ta không thấy, thì chúng ta kiên trì trông đợi điều ấy.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “thì chúng ta nhẫn nại trông đợi điều ấy” hoặc “thì chúng ta bền lòng chờ đợi điều ấy.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δὲ
  choice: Nhưng nếu
  rationale: Giữ nguyên lực điều kiện của εἰ và sắc thái chuyển ý hơi tương phản của δέ, đồng thời tự nhiên trong mạch văn tiếng Việt.
- source_word: ὃ οὐ βλέπομεν
  choice: điều mình không thấy
  rationale: Dịch đại từ quan hệ giống trung ὃ bằng “điều” theo lối nói tự nhiên; “không thấy” giữ nghĩa trực tiếp và thì hiện tại của βλέπομεν, không thêm ý “không thể thấy”.
- source_word: ἐλπίζομεν
  choice: chúng ta hy vọng
  rationale: Diễn đạt hành động hy vọng đang tiếp diễn; tân ngữ đã được nêu trước nên không cần thêm từ ngữ giải thích.
- source_word: δι’ ὑπομονῆς
  choice: kiên trì
  rationale: ὑπομονή nói đến sự bền lòng chịu đựng trong khi chờ đợi, không chỉ là thái độ thụ động. Trạng từ “kiên trì” chuyển tải tự nhiên cách thức trông đợi.
- source_word: ἀπεκδεχόμεθα
  choice: trông đợi điều ấy
  rationale: “Trông đợi” diễn tả việc chờ đợi với kỳ vọng hướng về tương lai; “điều ấy” làm rõ tân ngữ ngầm mà không xác định thêm đó là sự cứu rỗi, cứu chuộc hay sống lại.
theological_decisions:
- issue: Sắc thái của niềm hy vọng Cơ Đốc đối với sự thành toàn tương lai chưa thấy
  choice: Giữ đối tượng ở dạng khái quát là “điều mình không thấy” và “điều ấy”.
  alternative: Giải thích đối tượng là sự cứu rỗi, sự cứu chuộc hoặc sự sống lại.
  rationale: Ngữ cảnh gần giúp nhận diện phạm vi thần học, nhưng chính câu này không gọi đích danh đối tượng. Bản dịch giữ sự dè dặt của nguyên văn và không đưa phần giải nghĩa giáo lý vào chính văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “chúng ta” cho ngôi thứ nhất số nhiều; trong mệnh đề quan hệ dùng “mình” để tránh lặp nặng mà vẫn giữ chủ thể bao hàm. Dấu chú thích [a] được đặt sau toàn mệnh đề vì ghi chú liên quan đến cách diễn đạt kết hợp δι’ ὑπομονῆς và ἀπεκδεχόμεθα.
