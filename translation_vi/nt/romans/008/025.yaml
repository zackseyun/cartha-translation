    rationale: Với danh ngữ “điều...”, tiếng Việt hiện đại tự nhiên hơn khi nói “hy vọng về điều...”. Thay “mình” bằng “chúng ta” duy trì nhất quán với chủ ngữ số nhiều của cả câu.
