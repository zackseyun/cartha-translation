  yaml_path: translation/nt/romans/008/001.yaml
  text: Therefore[b][a], there is now no condemnation for those in Messiah Jesus.
translation:
  language: vi
  text: Vì vậy, hiện nay không có sự kết án nào cho những người ở trong Đấng Mê-si-a Giê-su[b].[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Một số thủ bản muộn hơn thêm: “là những người không bước đi theo xác thịt.” Các chứng tích Hy Lạp sớm nhất ủng hộ bản văn ngắn hơn tại đây.'
    reason: textual_variant
  - marker: b
    text: 'Cũng có thể dịch: “Đấng Christ Giê-su.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐδὲν
  choice: không còn ... nào
  rationale: Kết hợp với κατάκριμα thành cách diễn đạt tự nhiên trong tiếng Việt, đồng thời giữ sự phủ định dứt khoát của câu Hy Lạp.
- source_word: ἄρα
  choice: Vì vậy
  rationale: Diễn tả kết luận được rút ra từ lập luận trước đó.
- source_word: νῦν
  choice: hiện nay
  rationale: Giữ rõ yếu tố thời gian mà Phao-lô nhấn mạnh.
- source_word: κατάκριμα
  choice: sự kết án
  rationale: Giữ sắc thái pháp lý của một phán quyết bất lợi, thay vì chỉ cảm giác có tội chủ quan.
- source_word: τοῖς ἐν Χριστῷ Ἰησοῦ
  choice: dành cho những người ở trong Đấng Mê-si-a Jêsus
  rationale: Dùng “dành cho” để thể hiện cách tự nhiên quan hệ của cách dữ cách trong câu, nhưng giữ nguyên “ở trong” nhằm bảo tồn ngôn ngữ tham dự và hiệp nhất với Đấng Mê-si-a.
- source_word: Χριστῷ
  choice: Đấng Mê-si-a
  rationale: Dịch ý nghĩa tước hiệu Χριστός thay vì chỉ phiên âm, vì ý nghĩa cứu thế của tước hiệu vẫn có tác dụng trong ngữ cảnh.
- source_word: Ἰησοῦ
  choice: Jêsus
  rationale: Dùng dạng tên riêng quen thuộc trong văn phong Kinh Thánh tiếng Việt.
theological_decisions:
- issue: Ý nghĩa của cụm từ “ở trong Đấng Mê-si-a Jêsus”
  choice: Giữ nguyên cách nói “ở trong”, chỉ những người thuộc về và được liên kết với Đấng Mê-si-a Jêsus.
  alternative: Diễn giải lỏng hơn là “nhờ Đấng Mê-si-a Jêsus”.
  rationale: ἐν trong cách dùng của Phao-lô ở đây hàm chứa ngôn ngữ hiệp nhất và tham dự; dịch sát là “ở trong” bảo tồn chiều sâu và sự căng thẳng thần học thay vì thu hẹp thành một quan hệ nguyên nhân.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Cấu trúc “không còn sự kết án nào” tự nhiên hơn lối dịch từng chữ, còn “ở trong” được chủ ý giữ lại để không làm phẳng cách diễn đạt đặc trưng của Phao-lô.
