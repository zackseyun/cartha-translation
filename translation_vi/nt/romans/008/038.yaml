  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: πέπεισμαι γὰρ ὅτι οὔτε θάνατος οὔτε ζωὴ οὔτε ἄγγελοι οὔτε ἀρχαὶ οὔτε ⸂ἐνεστῶτα οὔτε μέλλοντα οὔτε δυνάμεις⸃
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/038.yaml
  text: For I am convinced that neither death nor life[a], nor angels nor rulers, nor things present nor things to come, nor powers,
translation:
  language: vi
  text: 'Vì tôi tin chắc rằng: chẳng sự chết, chẳng sự sống, chẳng các thiên sứ, chẳng các thế lực thống trị[a], chẳng những điều hiện tại, chẳng những điều sắp đến, chẳng các quyền năng,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “các quyền bính”; có thể chỉ các thế lực cai trị thuộc cõi vũ trụ hoặc thuộc linh.
    reason: lexical_alternative
lexical_decisions:
- source_word: πέπεισμαι
  choice: tôi tin chắc
  rationale: Thể hoàn thành mang hiệu lực hiện tại diễn tả một niềm xác tín đã được hình thành và vẫn bền vững; “tin chắc” tự nhiên và rõ nghĩa trong tiếng Việt hiện đại.
- source_word: γὰρ
  choice: Vì
  rationale: Giữ chức năng giải thích và củng cố cho lời khẳng định ngay trước đó.
- source_word: οὔτε ... οὔτε
  choice: dù ... hay ...
  rationale: Trong câu liệt kê kéo dài sang câu tiếp theo, cấu trúc này tái hiện tự nhiên nhịp điệu phủ định bao quát của tiếng Hy Lạp mà không tạo một câu tiếng Việt gượng gạo.
- source_word: θάνατος
  choice: sự chết
  rationale: Cách dịch trực tiếp, trang trọng và tạo thế đối xứng với “sự sống”.
- source_word: ζωὴ
  choice: sự sống
  rationale: Cách dịch trực tiếp, tương ứng với vế đối lập “sự chết”.
- source_word: ἄγγελοι
  choice: các thiên sứ
  rationale: Ngữ cảnh liệt kê các thực tại siêu phàm hoặc vũ trụ ủng hộ nghĩa “thiên sứ” hơn nghĩa chung “sứ giả”.
- source_word: ἀρχαὶ
  choice: các thế lực thống trị
  rationale: Diễn đạt được ý về quyền lực cai trị và vẫn để ngỏ việc đây là những quyền lực thuộc linh hay vũ trụ, thay vì áp đặt một thuật ngữ thần học chuyên biệt.
- source_word: ἐνεστῶτα
  choice: những điều hiện tại
  rationale: Chuyển phân từ được danh từ hóa thành một cụm từ tự nhiên, chỉ toàn bộ các thực tại đang hiện hữu.
- source_word: μέλλοντα
  choice: những điều sắp đến
  rationale: Giữ sự song song với “những điều hiện tại” và diễn đạt tự nhiên phạm vi tương lai.
- source_word: δυνάμεις
  choice: các quyền năng
  rationale: Giữ được tính khái quát của từ Hy Lạp, có thể bao gồm các quyền lực có ngôi vị hoặc những sức mạnh không mang tính ngôi vị.
theological_decisions:
- issue: Có nên hiểu ἀρχαὶ và δυνάμεις là các tên gọi kỹ thuật dành riêng cho những hữu thể thuộc linh hay không
  choice: Dùng các cách gọi rộng là “các thế lực thống trị” và “các quyền năng”
  alternative: “các quyền bính và các quyền lực” hoặc những tên gọi kỹ thuật chỉ các cấp bậc thuộc linh
  rationale: Ngữ cảnh có thể hướng đến các quyền lực vũ trụ hoặc thuộc linh, nhưng chính các từ Hy Lạp vẫn có phạm vi rộng. Bản dịch không thu hẹp chúng theo một hệ thống thần học cụ thể.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cấu trúc lặp “dù ... hay ...” giữ nhịp liệt kê mạnh mẽ của nguyên văn và nối tự nhiên với phần kết của câu ở Rô-ma 8:39. Dấu phẩy cuối câu được giữ vì đơn vị được cung cấp là phần đầu của một câu tiếp tục sang câu sau.
