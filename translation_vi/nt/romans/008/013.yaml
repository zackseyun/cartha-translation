id: ROM.8.13
reference: Romans 8:13
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εἰ γὰρ κατὰ σάρκα ζῆτε μέλλετε ἀποθνῄσκειν, εἰ δὲ πνεύματι τὰς πράξεις τοῦ σώματος θανατοῦτε, ζήσεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/013.yaml
  text: For if you live according to the flesh[a], you are about to die; but if by the Spirit you put to death the deeds of the body, you will live.
translation:
  language: vi
  text: Vì nếu anh chị em sống theo xác thịt[a], anh chị em sẽ chết; nhưng nếu nhờ Thánh Linh, anh chị em giết chết những việc làm của thân thể, thì anh chị em sẽ sống.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Trong ngữ cảnh này, “xác thịt” không chỉ thân thể vật chất, mà chỉ đời sống con người bị tội lỗi chi phối; sát nghĩa: “theo xác thịt.”'
    reason: Giải thích nghĩa ẩn dụ của σάρξ trong sự tương phản đạo đức của Phao-lô, đồng thời giữ cách dịch sát nguyên ngữ trong chính văn.
lexical_decisions:
- source_word: γὰρ
  choice: Vì
  rationale: Giữ chức năng giải thích và nối kết câu này với lập luận ngay trước đó.
- source_word: κατὰ σάρκα
  choice: theo xác thịt
  rationale: Giữ hình ảnh và thuật ngữ thần học của Phao-lô thay vì diễn giải thành “bản tính tội lỗi”; cách nói này cũng bảo toàn sự phân biệt giữa σάρξ và σῶμα trong cùng câu.
- source_word: ζῆτε
  choice: anh chị em sống
  rationale: Thì hiện tại trong mệnh đề điều kiện được diễn đạt tự nhiên bằng hiện tại đơn tiếng Việt; “anh chị em” thể hiện đại từ số nhiều.
- source_word: μέλλετε ἀποθνῄσκειν
  choice: anh chị em sẽ chết
  rationale: Diễn đạt hậu quả sắp tới/chắc chắn một cách tự nhiên; “sắp chết” có thể gây ấn tượng sai về tính cận kề theo thời gian.
- source_word: πνεύματι
  choice: nhờ Thánh Linh
  rationale: Hiểu cách dữ cách công cụ; văn mạch Rô-ma 8 nghiêng rõ về Thánh Linh là tác nhân ban năng lực.
- source_word: τὰς πράξεις τοῦ σώματος
  choice: các việc của thân thể
  rationale: Giữ rõ danh từ πράξεις và sở hữu cách τοῦ σώματος, đồng thời tránh thêm từ “xấu” vốn không có trực tiếp trong nguyên văn.
- source_word: θανατοῦτε
  choice: anh chị em làm chết
  rationale: Bảo toàn ẩn dụ mạnh về việc khiến các hành vi ấy chết, không làm nhẹ thành “từ bỏ” hay “dẹp bỏ”.
- source_word: ζήσεσθε
  choice: anh chị em sẽ sống
  rationale: Tương ứng trực tiếp và tự nhiên với thì tương lai Hy Lạp.
theological_decisions:
- issue: πνεύματι chỉ Thánh Linh hay tâm linh con người
  choice: Thánh Linh
  alternative: tâm linh; hoặc để mơ hồ là “thần linh”
  rationale: Các lần dùng πνεῦμα xuyên suốt Rô-ma 8 và sự tương phản trong văn mạch cho thấy Thánh Linh là cách hiểu có cơ sở mạnh nhất.
- issue: σάρξ nên được dịch theo hình ảnh hay diễn giải về đạo đức
  choice: xác thịt
  alternative: bản tính tội lỗi
  rationale: “Xác thịt” giữ được từ ngữ và sự căng thẳng trong cách lập luận của Phao-lô, không đồng nhất hoàn toàn σάρξ với một khái niệm thần học đã được diễn giải; chú thích giúp người đọc tránh hiểu đơn thuần là mô thịt.
- issue: μέλλετε ἀποθνῄσκειν có nhấn mạnh cái chết cận kề hay kết cuộc chắc chắn
  choice: sẽ chết
  alternative: sắp chết
  rationale: μέλλω có thể chỉ điều sắp xảy ra hoặc điều chắc chắn sẽ xảy đến; trong mệnh đề điều kiện này, “sẽ chết” bảo toàn hậu quả tương lai mà không quyết định quá mức về thời điểm.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh chị em” để thể hiện ngôi thứ hai số nhiều và giọng mục vụ; giữ cặp “xác thịt/thân thể” để phản ánh hai từ Hy Lạp khác nhau là σάρξ và σῶμα.
