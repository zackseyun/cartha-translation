  rationale: Chỉnh một cụm diễn đạt để tiếng Việt tự nhiên hơn mà vẫn giữ lực của động từ “put to death,” và chỉnh chú thích cho sáng rõ. Không thay đổi ý nghĩa, cấu trúc điều kiện, hay các thuật ngữ thần học chủ yếu.
