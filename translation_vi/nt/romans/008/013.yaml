    rationale: Động từ “làm chết” ít dùng với “việc”; “giết chết những việc làm” diễn đạt rõ hành động quyết liệt và sát với θανατοῦτε hơn trong tiếng Việt.
  - severity: low
    issue: Câu mở đầu của chú thích thiếu tự nhiên về cú pháp.
    rationale: “Không chỉ thân thể vật chất, nhưng chỉ...” không xác định rõ chủ ngữ và có thể bị hiểu là phủ nhận mọi nghĩa vật chất của từ. Cần giới hạn lời giải thích vào ngữ cảnh câu này.
