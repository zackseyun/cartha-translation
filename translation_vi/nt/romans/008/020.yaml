revisions:
- from: Vì muôn loài thọ tạo đã bị đặt dưới cảnh hư không[a], không phải do tự nguyện, nhưng vì Đấng đã đặt chúng dưới cảnh ấy[b], trong niềm hy vọng[c].
  to: Vì muôn loài thọ tạo đã bị đặt dưới sự hư không[a], không phải tự nguyện, nhưng do người đã đặt chúng dưới sự hư không ấy[b], trong niềm hy vọng[c].
  rationale: Sửa “cảnh hư không” thành “sự hư không” để diễn đạt chính xác hơn tình trạng mà tạo vật bị đặt dưới, đồng thời giữ một cách nói quen thuộc trong tiếng Việt Kinh Thánh. Thay “Đấng” bằng “người” để không ngầm định danh tác nhân mà nguyên văn cố ý không nêu. Các dấu chú thích và nghĩa cơ bản của câu được giữ nguyên.
  reviewer_model: gpt-5.6-terra
