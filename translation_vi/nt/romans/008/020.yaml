id: ROM.8.20
reference: Romans 8:20
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: τῇ γὰρ ματαιότητι ἡ κτίσις ὑπετάγη, οὐχ ἑκοῦσα ἀλλὰ διὰ τὸν ὑποτάξαντα, ⸀ἐφ’ ἑλπίδι
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/020.yaml
  text: For the creation was subjected to futility[a], not willingly, but because of the one who subjected it[c][b], in hope
translation:
  language: vi
  text: Vì muôn loài thọ tạo đã bị đặt dưới sự hư không[a], không phải tự nguyện, nhưng do người đã đặt chúng dưới sự hư không ấy[b], trong niềm hy vọng[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “sự hư ảo”, “sự trống rỗng” hoặc “tình trạng không đạt được mục đích”.
    reason: lexical_alternative
  - marker: b
    text: Nguyên văn Hy Lạp không nói rõ người đã đặt muôn loài thọ tạo dưới sự hư không là ai.
    reason: alternative_reading
  - marker: c
    text: Cũng có thể dịch là “với hy vọng”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ματαιότητι
  choice: cảnh hư không
  rationale: Diễn tả tình trạng không đạt được mục đích vốn có, bất thành và trống rỗng; “cảnh hư không” giữ được sắc thái thần học của từ mà không biến nó thành sự gian ác về đạo đức.
- source_word: κτίσις
  choice: muôn loài thọ tạo
  rationale: Trong Rô-ma 8:19–22, từ này chỉ toàn thể trật tự thọ tạo theo nghĩa tập thể, chứ không phải một cá thể riêng lẻ. “Muôn loài thọ tạo” tự nhiên và rõ nghĩa trong tiếng Việt.
- source_word: ὑπετάγη
  choice: đã bị đặt dưới
  rationale: Giữ thể bị động của động từ Hy Lạp và cho thấy đây là tình trạng bị áp đặt.
- source_word: οὐχ ἑκοῦσα
  choice: không phải do tự nguyện
  rationale: Nêu rõ muôn loài thọ tạo không tự lựa chọn tình trạng này, đồng thời giữ sự đối lập với hành động của Đấng đã đặt chúng dưới cảnh ấy.
- source_word: διὰ τὸν ὑποτάξαντα
  choice: vì Đấng đã đặt chúng dưới cảnh ấy
  rationale: Hiểu διά với đối cách theo nghĩa nguyên nhân. “Đấng” phản ánh một tác nhân hữu ngôi nhưng không xác định danh tính vốn không được nói rõ trong câu Hy Lạp.
- source_word: ἐφ’ ἑλπίδι
  choice: trong niềm hy vọng
  rationale: Giữ cách diễn đạt cô đọng và hướng tới tương lai của cụm từ Hy Lạp; “niềm” giúp câu tiếng Việt tự nhiên hơn.
theological_decisions:
- issue: Danh tính của τὸν ὑποτάξαντα, “Đấng đã đặt” muôn loài thọ tạo dưới cảnh hư không
  choice: Không xác định danh tính trong chính văn; dùng “Đấng đã đặt chúng dưới cảnh ấy”.
  alternative: Có thể hiểu là Đức Chúa Trời đặt thọ tạo dưới sự phán xét nhưng vẫn kèm hy vọng; một số cách giải thích liên hệ việc này với sự sa ngã của A-đam, còn ý kiến cho rằng đó là Sa-tan ít phù hợp hơn với văn cảnh.
  rationale: Nguyên văn Hy Lạp không nêu đích danh tác nhân. Bản dịch cần giữ sự dè dặt và căng thẳng giải nghĩa ấy, thay vì quyết định thay cho độc giả.
- issue: Quan hệ của ἐφ’ ἑλπίδι với mệnh đề trước
  choice: Đặt “trong niềm hy vọng” ở cuối câu, phù hợp với trật tự và độ mở của nguyên văn.
  alternative: Có thể dịch “với hy vọng” hoặc hiểu cụm này gắn chặt với hành động đặt muôn loài thọ tạo dưới cảnh hư không.
  rationale: Cách đặt ở cuối câu giữ được khả năng liên kết của cụm từ mà không giải thích quá mức cú pháp cô đọng của Hy Lạp.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Muôn loài thọ tạo” phù hợp với nghĩa tập thể trong văn cảnh; “cảnh hư không” giữ sắc thái Kinh Thánh nhưng được chú thích bằng các cách diễn đạt thông dụng hơn. Các dấu chú thích [a], [b], [c] đều hiện diện trong chính văn.
