review_pass:
  verdict: revise
  source_fidelity: Bản dịch phản ánh đúng cấu trúc điều kiện, hai lần nói về Đấng khiến Chúa Giê-su/Đấng Ki-tô Giê-su sống lại, thì tương lai của ζῳοποιήσει, và sắc thái nguyên nhân của διά + đối cách trong bản SBLGNT. Cụm “vì Thánh Linh của Ngài ngự trong anh chị em” là cách dịch có cơ sở cho mệnh đề cuối; chú thích bảo lưu hợp lý cách hiểu công cụ.
  naturalness: Văn phong trang trọng, hiện đại và dễ hiểu. Tuy nhiên, “thân thể phải chết của anh chị em” dùng danh từ số ít trong khi σώματα là số nhiều; thêm “những” giúp phản ánh nguyên văn và tự nhiên hơn trong tiếng Việt.
  terminology: “Thánh Linh,” “ngự trong,” “Đấng Ki-tô Giê-su,” và “ban sự sống” nhất quán, phù hợp ngữ vực Kinh Thánh tiếng Việt. Cách viết “Đức Giê-su” và “Ki-tô” cũng nhất quán trong câu.
  issues:
  - severity: low
