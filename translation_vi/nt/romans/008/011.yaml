id: ROM.8.11
reference: Romans 8:11
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εἰ δὲ τὸ πνεῦμα τοῦ ἐγείραντος ⸀τὸν Ἰησοῦν ἐκ νεκρῶν οἰκεῖ ἐν ὑμῖν, ὁ ἐγείρας ⸂ἐκ νεκρῶν Χριστὸν Ἰησοῦν⸃ ζῳοποιήσει καὶ τὰ θνητὰ σώματα ὑμῶν διὰ ⸂τὸ ἐνοικοῦν αὐτοῦ πνεῦμα⸃ ἐν ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/011.yaml
  text: And if the Spirit of the one who raised Jesus from the dead dwells in you[b][a], the one who raised Messiah Jesus from the dead will also give life to your mortal bodies through his Spirit dwelling in you.
translation:
  language: vi
  text: Nếu Thánh Linh của Đấng đã khiến Đức Giê-su sống lại từ cõi chết ngự trong anh chị em, thì Đấng đã khiến Đấng Ki-tô Giê-su sống lại từ cõi chết cũng sẽ ban sự sống cho những thân thể phải chết của anh chị em, vì Thánh Linh của Ngài ngự trong anh chị em.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “nhờ Thánh Linh của Ngài đang ngự trong anh chị em.”'
    reason: Bảo lưu cách hiểu διά theo nghĩa công cụ, một cách đọc quen thuộc, bên cạnh nghĩa nguyên nhân của cấu trúc trong bản SBLGNT.
lexical_decisions:
- source_word: πνεῦμα
  choice: Thánh Linh
  rationale: Trong lập luận của Phao-lô, từ này chỉ Thánh Linh của Đức Chúa Trời; cách dịch này rõ nghĩa và tự nhiên trong tiếng Việt hiện đại.
- source_word: ἐγείραντος / ἐγείρας
  choice: đã khiến ... sống lại
  rationale: Diễn đạt rõ hành động phục sinh và giữ chủ thể là Đấng làm cho Đức Giê-su sống lại.
- source_word: ἐκ νεκρῶν
  choice: từ cõi chết
  rationale: Cách nói tự nhiên, trang trọng, diễn tả việc sống lại khỏi tình trạng và phạm vi của sự chết.
- source_word: οἰκεῖ / ἐνοικοῦν
  choice: ngự trong
  rationale: Giữ sự liên kết từ vựng giữa hai lần xuất hiện, đồng thời phù hợp với ngữ cảnh nói về sự hiện diện nội tại của Thánh Linh.
- source_word: Χριστὸν Ἰησοῦν
  choice: Đấng Ki-tô Giê-su
  rationale: Giữ Χριστός như một tước hiệu chứ không biến thành họ riêng; trật tự tên gọi bám sát nguyên văn.
- source_word: ζῳοποιήσει
  choice: sẽ ban sự sống
  rationale: Giữ thì tương lai và ý nghĩa làm cho sống, với lối diễn đạt tự nhiên, trang trọng.
- source_word: θνητὰ σώματα
  choice: thân thể phải chết
  rationale: Diễn đạt cụ thể tính hữu tử của thân thể, tránh cách nói Hán-Việt kém phổ thông.
- source_word: διὰ τὸ ἐνοικοῦν αὐτοῦ πνεῦμα
  choice: vì Thánh Linh của Ngài ngự trong anh chị em
  rationale: διά đi với đối cách trong bản SBLGNT tự nhiên mang nghĩa nguyên nhân; bản chính ưu tiên cấu trúc Hy Lạp được cung cấp.
theological_decisions:
- issue: Giá trị của διά với đối cách trong mệnh đề cuối
  choice: vì Thánh Linh của Ngài ngự trong anh chị em
  alternative: qua Thánh Linh của Ngài, Đấng ngự trong anh chị em
  rationale: Bản chính giữ nghĩa nguyên nhân phù hợp nhất với διά cùng đối cách, nhưng chú thích bảo lưu cách hiểu công cụ vốn quen thuộc trong truyền thống dịch.
- issue: Sự phục sinh của “thân thể phải chết”
  choice: ban sự sống cho thân thể phải chết của anh chị em
  alternative: làm cho thân thể hay chết của anh chị em được sống
  rationale: Giữ tính cụ thể về thân thể và lời hứa tương lai, không thu hẹp câu này thành sự đổi mới tinh thần hiện tại.
- issue: Tước hiệu Χριστός
  choice: Đấng Ki-tô Giê-su
  alternative: Chúa Cứu Thế Giê-su
  rationale: Giữ tước hiệu Mê-si-a mà không thêm sắc thái giải thích vượt quá từ Hy Lạp.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh chị em” cho ὑμῖν số nhiều; viết hoa các danh xưng thần linh và dùng “Đức Giê-su”, “Đấng Ki-tô Giê-su” theo văn phong Kinh Thánh tiếng Việt.
