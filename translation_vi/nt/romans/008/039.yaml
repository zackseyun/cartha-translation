id: ROM.8.39
reference: Romans 8:39
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οὔτε ὕψωμα οὔτε βάθος οὔτε τις κτίσις ἑτέρα δυνήσεται ἡμᾶς χωρίσαι ἀπὸ τῆς ἀγάπης τοῦ θεοῦ τῆς ἐν Χριστῷ Ἰησοῦ τῷ κυρίῳ ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/039.yaml
  text: nor height nor depth nor any other created thing will be able to separate us from the love of God that is in Messiah Jesus our Lord[a][b][c].
translation:
  language: vi
  text: cũng chẳng có chiều cao hay chiều sâu, cũng chẳng có bất cứ tạo vật nào khác sẽ có thể phân rẽ chúng ta khỏi tình yêu của Đức Chúa Trời trong Đấng Mê-si-a[a] Giê-su, Chúa chúng ta.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Đấng Mê-si-a” theo truyền thống thường được dịch là “Đấng Christ” hoặc “Chúa Kitô.”
    reason: lexical_alternative
  - marker: b
    text: 'Hoặc: “bất cứ điều gì khác trong tạo vật” hay “bất cứ loài thọ tạo nào khác.”'
    reason: lexical_alternative
  - marker: c
    text: Trong ngữ cảnh này, “tình yêu của Đức Chúa Trời” nhiều khả năng có nghĩa là tình yêu Đức Chúa Trời dành cho chúng ta.
    reason: alternative_reading
lexical_decisions:
- source_word: ὕψωμα
  choice: chiều cao
  rationale: Trong cặp đối ứng với βάθος, nghĩa không gian là tự nhiên nhất; “chiều cao” giữ được thế tương phản tu từ.
- source_word: βάθος
  choice: chiều sâu
  rationale: Đi đôi với ὕψωμα để chỉ hai cực; “chiều sâu” là cách dịch trực tiếp và tự nhiên.
- source_word: κτίσις ἑτέρα
  choice: bất cứ loài thọ tạo nào khác
  rationale: κτίσις có thể chỉ vật hay loài được tạo dựng. Cách diễn đạt này nhấn mạnh rằng không một thực thể nào thuộc trật tự thọ tạo có thể phân rẽ tín hữu khỏi tình yêu của Đức Chúa Trời; “nào” chuyển tải sắc thái bất định của τις và “khác” phản ánh ἑτέρα.
- source_word: δυνήσεται
  choice: có thể
  rationale: Tiếng Việt thường dùng “có thể” tự nhiên cho khả năng cả hiện tại lẫn tương lai; trong mạch văn bảo đảm hướng tới tương lai, ý nghĩa thời tương lai vẫn rõ.
- source_word: χωρίσαι
  choice: phân rẽ
  rationale: “Phân rẽ” diễn đạt việc khiến hai bên bị lìa khỏi nhau và phù hợp với văn phong trang trọng của đoạn văn.
- source_word: ἀγάπης
  choice: tình yêu
  rationale: Đây là cách dịch thông dụng, sáng rõ của ἀγάπη trong tiếng Việt hiện đại.
- source_word: τοῦ θεοῦ
  choice: của Đức Chúa Trời
  rationale: Giữ nguyên hình thức sở hữu của nguyên văn, không giải quyết ngay trong chính văn câu hỏi đây là tình yêu Đức Chúa Trời dành cho chúng ta hay tình yêu hướng về Ngài.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: trong Đấng Mê-si-a Giê-su
  rationale: Χριστός là tước hiệu tương ứng với “Đấng Mê-si-a”; “trong” chuyển tải trực tiếp ἐν và giữ nguyên công thức thần học của Phao-lô.
- source_word: κυρίῳ
  choice: Chúa
  rationale: “Chúa” là cách dịch chuẩn, tự nhiên và phù hợp với nghĩa Kitô học của κύριος trong câu này.
theological_decisions:
- issue: Ý nghĩa của sở hữu cách trong cụm “tình yêu của Đức Chúa Trời”
  choice: Giữ nguyên cụm từ có tính mơ hồ trong chính văn; theo ngữ cảnh, nhiều khả năng là tình yêu Đức Chúa Trời dành cho chúng ta
  alternative: Tình yêu của chúng ta dành cho Đức Chúa Trời, hoặc cách hiểu bao gồm cả hai chiều
  rationale: Rô-ma 8:31–39 nhấn mạnh hành động và sự bảo đảm của Đức Chúa Trời đối với dân Ngài, nên nghĩa chủ thể là khả dĩ nhất. Tuy vậy, cấu trúc sở hữu cách tự nó không nói rõ hoàn toàn, vì thế chính văn không diễn giải thêm và chú thích nêu cách hiểu theo ngữ cảnh.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ cấu trúc lặp “cũng chẳng” để nối với danh sách ở câu trước. Dùng “loài thọ tạo” để bao quát κτίσις mà vẫn tự nhiên trong văn cảnh Kinh Thánh; tránh thêm từ giải thích không có trong nguyên văn.
