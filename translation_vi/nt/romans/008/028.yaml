revisions:
- from: Chúng ta biết rằng mọi sự cùng hiệp lại vì điều tốt lành cho những người yêu mến Đức Chúa Trời[a], tức là những người được kêu gọi theo mục đích[b].
  to: Chúng ta biết rằng mọi sự cùng góp phần[a] vào điều tốt lành cho những người yêu mến Đức Chúa Trời, là những người được kêu gọi theo mục đích[b].
  rationale: Sửa nhẹ để câu tiếng Việt tự nhiên hơn, giữ nguyên sự mơ hồ có chủ ý của bản văn SBLGNT về chủ ngữ của συνεργεῖ, và đặt lại neo chú thích dị bản đúng tại mệnh đề bị ảnh hưởng. Chú thích b tiếp tục bảo tồn cách hiểu theo văn cảnh mà không thêm “của Ngài” vào bản dịch chính.
  reviewer_model: gpt-5.6-terra
