id: ROM.8.28
reference: Romans 8:28
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Οἴδαμεν δὲ ὅτι τοῖς ἀγαπῶσι τὸν θεὸν πάντα ⸀συνεργεῖ εἰς ἀγαθόν, τοῖς κατὰ πρόθεσιν κλητοῖς οὖσιν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/028.yaml
  text: And we know that for those who love God, all things work together for good—for those who are called according to purpose.
translation:
  language: vi
  text: Chúng ta biết rằng mọi sự cùng góp phần[a] vào điều tốt lành cho những người yêu mến Đức Chúa Trời, là những người được kêu gọi theo mục đích[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Một số thủ bản chép: “Đức Chúa Trời khiến mọi sự cùng góp phần vào điều tốt lành cho những người yêu mến Ngài.”'
    reason: textual_variant
  - marker: b
    text: 'Cũng có thể dịch: “theo mục đích của Ngài.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἴδαμεν
  choice: Chúng ta biết
  rationale: Thì hiện tại diễn tả một nhận thức vững chắc; cách dịch này tự nhiên và trực tiếp trong tiếng Việt.
- source_word: δὲ
  choice: không dịch thành một từ riêng
  rationale: Đây là liên từ nhẹ để tiếp nối lập luận. Trong tiếng Việt, sự tiếp nối đã tự nhiên nhờ văn cảnh; thêm “và” ở đầu câu không cần thiết.
- source_word: τοῖς ἀγαπῶσι τὸν θεόν
  choice: cho những người yêu mến Đức Chúa Trời
  rationale: “Cho” thể hiện chức năng của cách dữ cách tự nhiên, còn “yêu mến” giữ sắc thái trang trọng nhưng thông dụng của ἀγαπάω.
- source_word: πάντα
  choice: mọi sự
  rationale: Giữ phạm vi rộng của dạng trung tính số nhiều mà không thu hẹp vào hoàn cảnh hay biến cố cụ thể.
- source_word: συνεργεῖ
  choice: cùng hiệp lại
  rationale: Giữ ý các sự việc cùng tác động/hợp lại, đồng thời không đưa “Đức Chúa Trời” vào làm chủ ngữ khi bản văn SBLGNT không nêu rõ chủ ngữ ấy.
- source_word: εἰς ἀγαθόν
  choice: vì điều tốt lành
  rationale: Diễn đạt hướng đến kết quả tốt lành một cách tự nhiên, đồng thời không giải thích quá mức điều “tốt lành” ấy.
- source_word: τοῖς κατὰ πρόθεσιν κλητοῖς οὖσιν
  choice: tức là những người được kêu gọi theo mục đích
  rationale: “Tức là” cho thấy nhóm này đồng quy chiếu với “những người yêu mến Đức Chúa Trời”; thể bị động “được kêu gọi” giữ cấu trúc thần học của κλητοῖς.
- source_word: πρόθεσιν
  choice: mục đích
  rationale: Phản ánh ý định hay chủ đích trong văn cảnh mà không tự động chuyển thành “kế hoạch” hoặc thêm một sở hữu từ không có trong bản văn.
- source_word: κλητοῖς
  choice: được kêu gọi
  rationale: Là cách diễn đạt quen thuộc, chính xác trong văn mạch Phao-lô và không xác định thêm cơ chế của sự kêu gọi.
theological_decisions:
- issue: Chủ ngữ hàm ẩn của συνεργεῖ
  choice: 'Giữ “mọi sự” làm chủ thể ngữ pháp trong câu chính: “mọi sự cùng hiệp lại”.'
  alternative: “Đức Chúa Trời khiến mọi sự cùng hiệp lại vì điều tốt lành.”
  rationale: Bản văn SBLGNT được cung cấp không có θεός làm chủ ngữ rõ ràng trong mệnh đề này. Cách đọc nêu đích danh Đức Chúa Trời được bảo tồn trong chú thích như một dị bản.
- issue: Có thêm sở hữu từ vào κατὰ πρόθεσιν hay không
  choice: “theo mục đích”
  alternative: “theo mục đích của Ngài”
  rationale: Văn cảnh có thể hiểu đó là mục đích của Đức Chúa Trời, nhưng tiếng Hy Lạp không có sở hữu từ rõ ràng; bản dịch chính giữ sự cô đọng và chú thích cách hiểu tự nhiên theo văn cảnh.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. “Đức Chúa Trời” được dùng nhất quán cho θεός; “mọi sự cùng hiệp lại” giữ cấu trúc của bản văn nguồn và tránh giải quyết ngầm vấn đề chủ ngữ. Mọi dấu chú thích đều xuất hiện trong câu chính.
