source:
  edition: SBLGNT
  text: καθὼς γέγραπται ὅτι Ἕνεκεν σοῦ θανατούμεθα ὅλην τὴν ἡμέραν, ἐλογίσθημεν ὡς πρόβατα σφαγῆς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/036.yaml
  text: 'Just as it is written: “For your sake we are being put to death all day long[a]; we were counted as sheep for slaughter.”'
translation:
  language: vi
  text: 'Như có chép rằng:


    “Vì Ngài, chúng con bị giết suốt ngày;

    chúng con bị coi là như chiên để làm thịt.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθὼς γέγραπται
  choice: Như có lời chép
  rationale: Cách diễn đạt tự nhiên và trang trọng để giới thiệu lời Kinh Thánh được trích dẫn; giữ lực so sánh của καθὼς và ý nghĩa hiện hành của công thức γέγραπται.
- source_word: Ἕνεκεν σοῦ
  choice: Vì Ngài
  rationale: Diễn đạt gọn, tự nhiên ý ‘vì cớ Ngài’ và giữ lời trực tiếp thưa với Đức Chúa Trời.
- source_word: θανατούμεθα
  choice: chúng con bị giết
  rationale: Thể hiện thể bị động và hành động đang tiếp diễn trong hiện tại; ‘chúng con’ phù hợp với lời tập thể đang thưa trực tiếp với Đức Chúa Trời.
- source_word: ὅλην τὴν ἡμέραν
  choice: suốt ngày
  rationale: Thành ngữ tiếng Việt tự nhiên, giữ ý liên tục trong toàn bộ khoảng thời gian.
- source_word: ἐλογίσθημεν
  choice: chúng con bị kể
  rationale: Giữ sắc thái ‘được/bị tính, kể, coi là’ của λογίζομαι và thể bị động của động từ, không giải thích quá mức.
- source_word: ὡς πρόβατα σφαγῆς
  choice: như chiên để làm thịt
  rationale: Giữ nguyên phép so sánh và hình ảnh chiên bị dành cho sự giết thịt, bằng cách diễn đạt dễ hiểu trong tiếng Việt hiện đại.
theological_decisions:
- issue: Lời trích Thi Thiên 44:22 nói về sự chịu khổ của cộng đồng
  choice: Giữ ngôi số nhiều tập thể và ý họ liên tục bị đối xử như những người phải chết.
  alternative: Diễn giải cụ thể là sự tử đạo của các tín hữu.
  rationale: Bản Hy Lạp trình bày lời than tập thể nhưng không giới hạn lời ấy vào một ứng dụng giáo lý duy nhất; bản dịch vì thế giữ nguyên sức nặng và độ căng của hình ảnh.
translation_notes:
  register: Văn phong tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “Ngài” cho đại từ số ít chỉ Đức Chúa Trời trong lời trích và “chúng con” để giữ quan hệ thưa gửi trực tiếp. Xuống dòng theo hai vế thi ca của lời trích.
