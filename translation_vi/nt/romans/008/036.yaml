revisions:
- from: 'Như có lời chép:


    “Vì Ngài, chúng con bị giết suốt ngày;

    chúng con bị kể[a] như chiên để làm thịt.”'
  to: 'Như có chép rằng:


    “Vì Ngài, chúng con bị giết suốt ngày;

    chúng con bị coi là như chiên để làm thịt.”'
  rationale: Thay «Như có lời chép» bằng «Như có chép rằng» để phản ánh đầy đủ công thức dẫn trích của tiếng Hy Lạp. Thay «bị kể» bằng «bị coi là» để dịch tự nhiên và chính xác ἐλογίσθημεν. Giữ «như chiên để làm thịt» nhằm bảo toàn phép so sánh và hình ảnh nguyên văn.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T10:25:31Z'
review_pass:
  verdict: revise
  source_fidelity: Bản nháp giữ đúng cấu trúc lời trích, ngôi số nhiều tập thể, lời thưa trực tiếp với Đức Chúa Trời, ý bị động của θανατούμεθα, và hình ảnh πρόβατα σφαγῆς. Tuy nhiên, «bị kể» không tự nhiên trong nghĩa thụ động của ἐλογίσθημεν; «bị coi là» truyền đạt chính xác hơn ý bị xem/được kể là.
  naturalness: «Như có chép rằng» là công thức giới thiệu trích dẫn Kinh Thánh tự nhiên, trang trọng và đầy đủ hơn «Như có lời chép». «Bị coi là» là cách dùng tiếng Việt hiện đại thông dụng; «chiên để làm thịt» vẫn giữ hình ảnh súc vật dành cho việc giết mổ mà không diễn giải thêm.
  terminology: Giữ «Ngài», «chúng con», và «chiên» phù hợp văn phong Kinh Thánh tiếng Việt trang trọng. Không cần áp đặt cách giải thích giáo phái về sự chịu khổ hay tử đạo.
  issues:
  - severity: medium
    issue: Cụm «chúng con bị kể» không tự nhiên và chưa diễn đạt rõ nghĩa của ἐλογίσθημεν.
    rationale: λεγίζομαι ở thể bị động tại đây có nghĩa là «được/bị coi là, xem là». Trong tiếng Việt, «bị kể» thường cần bổ ngữ kiểu «bị kể vào số...» và kém tự nhiên trong phép so sánh này.
  - severity: low
    issue: «Như có lời chép» thiếu từ nối tương ứng với ὅτι và kém chuẩn hơn công thức trích dẫn thông dụng.
    rationale: «Như có chép rằng» giữ rõ cấu trúc καθὼς γέγραπται ὅτι, đồng thời tự nhiên trong văn phong Kinh Thánh hiện đại.
  revised_text: 'Như có chép rằng:


