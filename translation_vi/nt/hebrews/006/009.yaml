  text: Πεπείσμεθα δὲ περὶ ὑμῶν, ἀγαπητοί, τὰ κρείσσονα καὶ ἐχόμενα σωτηρίας, εἰ καὶ οὕτως λαλοῦμεν·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/009.yaml
  text: But we are convinced of better things concerning you[a], beloved—things that belong to salvation—even though we speak in this way.
translation:
  language: vi
  text: Nhưng, anh chị em yêu dấu, chúng tôi tin chắc rằng anh chị em có những điều tốt hơn—những điều liên quan đến sự cứu rỗi[a]—dù chúng tôi nói như vậy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “những điều đi cùng với sự cứu rỗi.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πεπείσμεθα
  choice: chúng tôi tin chắc
  rationale: Thì hoàn thành diễn tả một sự xác tín đã được hình thành và đang vững bền; “tin chắc” tự nhiên trong tiếng Việt và giữ được mức độ quả quyết.
- source_word: δὲ
  choice: Nhưng
  rationale: Đánh dấu bước chuyển tương phản với lời cảnh báo nghiêm khắc ở các câu trước.
- source_word: περὶ ὑμῶν
  choice: rằng anh chị em có
  rationale: Chuyển cấu trúc “về anh chị em, [chúng tôi tin chắc] những điều tốt hơn” sang cú pháp tiếng Việt tự nhiên, nhưng vẫn giữ đối tượng của sự xác tín là tình trạng của người nghe.
- source_word: ἀγαπητοί
  choice: thưa anh chị em yêu dấu
  rationale: Giữ sắc thái xưng hô trìu mến và trang trọng; “anh chị em” phù hợp với một cộng đồng gồm cả nam lẫn nữ.
- source_word: τὰ κρείσσονα
  choice: những điều tốt hơn
  rationale: Giữ nguyên lực so sánh của tính từ trung tính số nhiều được dùng như danh từ.
- source_word: ἐχόμενα σωτηρίας
  choice: những điều gắn liền với sự cứu rỗi
  rationale: Diễn đạt mối liên hệ mật thiết với sự cứu rỗi mà không xác định đó là bằng chứng, kết quả hay nguyên nhân; chú thích bảo lưu cách hiểu “đi cùng với sự cứu rỗi”.
- source_word: εἰ καὶ
  choice: dù
  rationale: Thể hiện rõ ý nhượng bộ trong ngữ cảnh.
- source_word: οὕτως
  choice: như vậy
  rationale: Quy chiếu tự nhiên về cách thức và nội dung cảnh báo nghiêm khắc vừa nêu.
- source_word: λαλοῦμεν
  choice: chúng tôi nói
  rationale: Cách dịch trực tiếp, tự nhiên của động từ hiện tại trong ngữ cảnh phát ngôn.
theological_decisions:
- issue: Mối quan hệ giữa ἐχόμενα và σωτηρίας trong đoạn cảnh báo
  choice: những điều gắn liền với sự cứu rỗi
  alternative: những điều đi cùng với sự cứu rỗi
  rationale: Bản dịch khẳng định rằng người nghe có những thực tại liên hệ đúng đắn với sự cứu rỗi, nhưng không quyết định chúng là dấu hiệu, hệ quả hay điều kiện dẫn đến sự cứu rỗi; nhờ đó bảo lưu độ mở thần học của nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và giàu tình cảm. Dùng “anh chị em” để chỉ toàn thể cộng đồng; giữ nhịp tương phản bằng “Nhưng” và dùng dấu gạch ngang để làm rõ phần giải thích cho “những điều tốt hơn”.
