reference: Hebrews 6:6
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ παραπεσόντας, πάλιν ἀνακαινίζειν εἰς μετάνοιαν, ἀνασταυροῦντας ἑαυτοῖς τὸν υἱὸν τοῦ θεοῦ καὶ παραδειγματίζοντας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/006.yaml
  text: and having fallen away[a], to renew them again to repentance[b], since they are crucifying again for themselves the Son of God and exposing him to public shame.
translation:
  language: vi
  text: và đã sa ngã[a], thì không thể lại phục hồi họ để họ ăn năn[b], vì họ đang lại đóng đinh Con Đức Chúa Trời cho chính mình và công khai làm nhục Ngài.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đã bội đạo.” Động từ Hy Lạp có thể chỉ một sự lìa bỏ nghiêm trọng.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “trong khi họ đang lại đóng đinh Con Đức Chúa Trời cho chính mình và công khai làm nhục Ngài.” Các phân từ Hy Lạp có thể được hiểu là diễn tả hành động đồng thời, cũng như giải thích nguyên nhân.'
    reason: alternative_reading
lexical_decisions:
- source_word: παραπεσόντας
  choice: đã sa ngã
  rationale: Diễn đạt một sự lìa bỏ nghiêm trọng, đồng thời tránh đưa thuật ngữ thần học kỹ thuật vào chính văn.
- source_word: πάλιν ἀνακαινίζειν
  choice: lại đổi mới
  rationale: Giữ ý lặp lại của πάλιν và nghĩa phục hồi, làm mới của ἀνακαινίζω.
- source_word: εἰς μετάνοιαν
  choice: để họ ăn năn
  rationale: Diễn đạt tự nhiên hướng đích của εἰς; “ăn năn” là cách nói hiện đại, quen thuộc và phù hợp với μετάνοια.
- source_word: ἀνασταυροῦντας ἑαυτοῖς
  choice: họ đang tự mình đóng đinh ... một lần nữa
  rationale: Giữ sắc thái đang diễn ra của phân từ hiện tại và trách nhiệm của chính chủ thể được biểu thị bởi ἑαυτοῖς.
- source_word: τὸν υἱὸν τοῦ θεοῦ
  choice: Con Đức Chúa Trời
  rationale: Cách dịch trực tiếp, trang trọng và quen thuộc của tước hiệu Cơ Đốc học.
- source_word: παραδειγματίζοντας
  choice: công khai làm nhục Ngài
  rationale: Thể hiện việc phơi bày một người trước công chúng để chịu ô nhục.
theological_decisions:
- issue: Quan hệ cú pháp với Hê-bơ-rơ 6:4–5
  choice: Giữ câu phụ thuộc bằng cách mở đầu với “và”, không tự ý lặp lại mệnh đề “không thể”.
  alternative: “thì không thể lại đổi mới...”
  rationale: Bản Hy Lạp của câu 6 tiếp tục cấu trúc bắt đầu ở câu 4; giữ sự phụ thuộc này tránh bổ sung điều không có ngay trong câu.
- issue: Bản chất của việc sa ngã
  choice: “đã sa ngã”
  alternative: “đã bội đạo”
  rationale: Giữ nguyên sức nặng của lời cảnh báo nhưng không quyết định các tranh luận giáo phái về sự cứu rỗi hay sự bội đạo.
- issue: Chức năng của các phân từ ἀνασταυροῦντας và παραδειγματίζοντας
  choice: Dịch theo sắc thái giải thích/nguyên nhân bằng “vì”.
  alternative: Dịch theo sắc thái đồng thời bằng “trong khi”.
  rationale: Các phân từ có thể giải thích lý do của việc không thể đổi mới, nhưng cũng có thể chỉ hoàn cảnh đồng thời; ghi chú bảo tồn khả năng thứ hai.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Đại từ “Ngài” dùng cho Con Đức Chúa Trời; cấu trúc được giữ phụ thuộc vào văn cảnh trước, phù hợp cú pháp Hy Lạp.
