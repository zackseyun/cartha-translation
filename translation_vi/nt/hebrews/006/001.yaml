- from: Vì vậy, hãy rời khỏi lời dạy sơ khởi về Đấng Christ để chúng ta được đưa tới sự trưởng thành,[a] không đặt lại nền móng về sự ăn năn khỏi những việc chết và về đức tin hướng về Đức Chúa Trời.[b]
  to: Vì vậy, chúng ta hãy để lại lời dạy sơ khởi về Đấng Christ để được đưa tới sự trưởng thành,[a] không đặt lại nền móng về sự ăn năn khỏi những việc chết và về đức tin hướng về Đức Chúa Trời.[b]
