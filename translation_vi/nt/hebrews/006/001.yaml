  source_fidelity: 'Bản dịch nhìn chung phản ánh tốt cấu trúc và các thuật ngữ chính: «lời dạy sơ khởi», «sự trưởng thành», hình ảnh «nền móng», «ăn năn khỏi những việc chết», và sắc thái định hướng của πίστεως ἐπὶ θεόν. Tuy nhiên, «hãy rời khỏi ... để chúng ta được đưa tới» đổi đột ngột từ mệnh lệnh không nêu chủ thể sang «chúng ta», khiến quan hệ giữa ἀφέντες và φερώμεθα chưa được chuyển tải mạch lạc.'
  naturalness: Cần chỉnh nhẹ để chủ thể số nhiều của lời khuyên được nhất quán và câu tiếng Việt trôi chảy hơn. «Chúng ta hãy để lại ... để được đưa tới ...» vừa tự nhiên hơn vừa vẫn cho phép giữ thể bị động của φερώμεθα.
  terminology: «Đấng Christ», «Đức Chúa Trời», «sự ăn năn», «những việc chết», và «đức tin hướng về» đều phù hợp với văn phong Kinh Thánh tiếng Việt hiện đại. Không cần thay đổi thuật ngữ thần học.
  issues:
