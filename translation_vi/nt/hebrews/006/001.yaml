    issue: Không nhất quán về chủ thể và cấu trúc mệnh lệnh trong «hãy rời khỏi ... để chúng ta được đưa tới».
    rationale: ἀφέντες và φερώμεθα cùng có chủ thể số nhiều ngầm («chúng ta»). Cách dịch hiện tại mở đầu bằng «hãy» nhưng chuyển sang «chúng ta» ở mệnh đề sau, tạo cảm giác chủ thể không ổn định. Sửa thành «chúng ta hãy để lại ... để được đưa tới» giải quyết điểm này mà không đổi nghĩa.
