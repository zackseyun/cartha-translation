id: HEB.6.1
reference: Hebrews 6:1
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Διὸ ἀφέντες τὸν τῆς ἀρχῆς τοῦ Χριστοῦ λόγον ἐπὶ τὴν τελειότητα φερώμεθα, μὴ πάλιν θεμέλιον καταβαλλόμενοι μετανοίας ἀπὸ νεκρῶν ἔργων, καὶ πίστεως ἐπὶ θεόν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/001.yaml
  text: Therefore[a], leaving the elementary message about the Messiah, let us be carried on to maturity, not laying again a foundation of repentance from dead works and of faith toward God[d][c][b],
translation:
  language: vi
  text: Vì vậy, chúng ta hãy để lại lời dạy sơ khởi về Đấng Christ để được đưa tới sự trưởng thành,[a] không đặt lại nền móng về sự ăn năn khỏi những việc chết và về đức tin hướng về Đức Chúa Trời.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “được đưa tới sự trọn vẹn.” Cũng có thể dịch thể chủ động tự nhiên hơn là “hãy tiến tới sự trưởng thành.”
    reason: lexical_alternative
  - marker: b
    text: Hay “đức tin nơi Đức Chúa Trời.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὸ
  choice: Vì vậy
  rationale: Liên từ suy luận nối lời khuyên này với phần lập luận ngay trước đó; cách dịch tự nhiên và trang trọng trong tiếng Việt hiện đại.
- source_word: ἀφέντες
  choice: hãy rời khỏi
  rationale: Giữ ý chuyển khỏi trọng tâm hiện tại để tiến xa hơn, chứ không hàm ý phủ nhận hay vứt bỏ giáo huấn nền tảng.
- source_word: τὸν τῆς ἀρχῆς τοῦ Χριστοῦ λόγον
  choice: lời dạy sơ khởi về Đấng Christ
  rationale: λόγος trong ngữ cảnh là lời dạy/sứ điệp; chuỗi sở hữu cách chỉ giáo huấn ban đầu liên quan đến Đấng Christ. Cách diễn đạt này tự nhiên mà vẫn giữ được phạm vi ý nghĩa của nguyên văn.
- source_word: Χριστοῦ
  choice: Đấng Christ
  rationale: Giữ tước hiệu quen thuộc trong tiếng Việt, tương ứng với Χριστός, không biến nó thành một tên riêng thuần túy.
- source_word: ἐπὶ τὴν τελειότητα
  choice: tới sự trưởng thành
  rationale: Trong thế đối lập với giáo huấn sơ khởi, τελειότης chỉ tình trạng trưởng thành hoặc trọn vẹn; 'sự trưởng thành' tránh gợi ý vô tội tuyệt đối.
- source_word: φερώμεθα
  choice: để chúng ta được đưa tới
  rationale: Giữ thể bị động của động từ Hy Lạp thay vì làm phẳng thành 'chúng ta hãy tiến tới', đồng thời vẫn tự nhiên trong tiếng Việt.
- source_word: θεμέλιον καταβαλλόμενοι
  choice: không đặt lại nền móng
  rationale: Bảo tồn hình ảnh xây dựng và ý không thiết lập lại những điều căn bản.
- source_word: μετανοίας ἀπὸ νεκρῶν ἔργων
  choice: sự ăn năn khỏi những việc chết
  rationale: '''Ăn năn'' là cách diễn đạt tiếng Việt rõ và quen thuộc cho μετάνοια; ''những việc chết'' giữ nguyên ẩn dụ và không thu hẹp thành một cách giải thích như ''việc dẫn đến sự chết''.'
- source_word: πίστεως ἐπὶ θεόν
  choice: đức tin hướng về Đức Chúa Trời
  rationale: Giữ sắc thái hướng đến của ἐπί với đối cách; 'đức tin nơi Đức Chúa Trời' cũng là một cách dịch tự nhiên có thể có.
theological_decisions:
- issue: Việc 'rời khỏi' lời dạy sơ khởi có hàm ý từ bỏ giáo huấn về Đấng Christ hay không
  choice: Di chuyển khỏi giáo huấn căn bản như trọng tâm hiện tại để tiến tới trưởng thành, không phủ nhận giáo huấn ấy.
  alternative: Hiểu là từ bỏ sứ điệp về Đấng Christ hoặc tạo ra sự đứt đoạn mạnh với giáo lý ban đầu.
  rationale: Mệnh đề kế tiếp nói đến việc không đặt lại nền móng, cho thấy tác giả kêu gọi xây tiếp trên nền có sẵn chứ không phá bỏ nền ấy.
- issue: Ý nghĩa của τελειότης
  choice: sự trưởng thành
  alternative: sự hoàn hảo; sự trọn vẹn
  rationale: Ngữ cảnh đối chiếu nền móng ban đầu với sự phát triển đầy đủ hơn; 'trưởng thành' truyền đạt điều này mà không quyết định quá mức rằng câu nói đến sự hoàn hảo tuyệt đối.
- issue: Có nên giữ thể bị động của φερώμεθα hay chuyển thành chủ động
  choice: 'Giữ thể bị động: ''để chúng ta được đưa tới''.'
  alternative: chúng ta hãy tiến tới; chúng ta hãy tiến lên
  rationale: Nguyên văn dùng thể bị động. Giữ thể này bảo tồn sắc thái rằng tiến trình không được trình bày đơn thuần như nỗ lực tự thân, nhưng không xác định rõ tác nhân.
translation_notes:
  register: Văn phong tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng 'Đấng Christ' và 'Đức Chúa Trời' theo lối gọi quen thuộc trong Kinh Thánh tiếng Việt. Giữ hình ảnh 'nền móng', 'những việc chết' và thể bị động của φερώμεθα để bảo tồn cấu trúc cùng độ căng thần học của nguyên văn.
