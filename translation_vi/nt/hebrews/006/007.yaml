id: HEB.6.7
reference: Hebrews 6:7
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: γῆ γὰρ ἡ πιοῦσα τὸν ἐπ’ αὐτῆς ⸂ἐρχόμενον πολλάκις⸃ ὑετόν, καὶ τίκτουσα βοτάνην εὔθετον ἐκείνοις δι’ οὓς καὶ γεωργεῖται, μεταλαμβάνει εὐλογίας ἀπὸ τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/007.yaml
  text: For land that drinks the rain that often comes upon it and produces vegetation useful to those for whose sake it is also cultivated receives blessing from God[a][b].
translation:
  language: vi
  text: Vì đất uống mưa thường xuyên rơi xuống và sinh ra cây cỏ[a] hữu ích cho những người vì họ mà đất ấy cũng được canh tác[b], nhận được phước lành từ Đức Chúa Trời.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch “thực vật,” “rau cỏ” hoặc “hoa màu” thay cho “cây cỏ.”
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể hiểu là “cho những người canh tác nó,” dù “cho những người vì họ mà đất ấy được canh tác” phản ánh sát hơn διά đi với đối cách tại đây.
    reason: alternative_reading
lexical_decisions:
- source_word: γῆ
  choice: đất
  rationale: Trong ẩn dụ nông nghiệp này, “đất” chỉ phần đất được canh tác, tự nhiên và đủ rộng hơn “đất trồng” hay “đất đai”.
- source_word: πιοῦσα
  choice: uống
  rationale: Giữ nguyên hình ảnh nhân hóa sinh động về đất tiếp nhận nước mưa, thay vì làm phẳng thành “thấm hút”.
- source_word: τὸν ἐπ’ αὐτῆς ἐρχόμενον πολλάκις ὑετόν
  choice: nước mưa thường xuyên rơi xuống trên nó
  rationale: Diễn đạt tự nhiên cấu trúc phân từ có mạo từ, đồng thời giữ πολλάκις và ý ἐπ’ αὐτῆς.
- source_word: τίκτουσα
  choice: sinh ra
  rationale: Giữ sắc thái phát sinh, kết quả của đất sau khi uống nước mưa, và phù hợp với hình ảnh nhân hóa.
- source_word: βοτάνην
  choice: cây cỏ
  rationale: Bao quát sự sinh trưởng của thực vật mà không thu hẹp thành một loại hoa màu cụ thể.
- source_word: εὔθετον
  choice: hữu ích
  rationale: Truyền đạt rõ ý thích hợp hoặc có ích trong bối cảnh nông nghiệp.
- source_word: ἐκείνοις δι’ οὓς καὶ γεωργεῖται
  choice: cho những người mà vì họ đất ấy cũng được canh tác
  rationale: Giữ διά với đối cách theo nghĩa nguyên nhân/mục đích “vì, vì lợi ích của”, đồng thời phản ánh καί bằng “cũng”.
- source_word: γεωργεῖται
  choice: được canh tác
  rationale: Diễn đạt tự nhiên thể bị động và bao quát hoạt động làm nông trên đất.
- source_word: μεταλαμβάνει
  choice: nhận được
  rationale: Trong ngữ cảnh, đất được ban phước; “nhận được” rõ ràng và tự nhiên hơn cách dịch sát kiểu “dự phần”.
- source_word: εὐλογίας ἀπὸ τοῦ θεοῦ
  choice: phước lành từ Đức Chúa Trời
  rationale: Giữ nguồn gốc của phước lành và lối diễn đạt trang trọng, quen thuộc trong tiếng Việt Kinh Thánh.
theological_decisions:
- issue: Ẩn dụ nông nghiệp trong mạch văn cảnh báo
  choice: Giữ nguyên ẩn dụ một cách trực tiếp, không thêm kết luận giáo lý về sự bền đỗ hay bội đạo.
  alternative: Diễn giải để xác định đất hoặc hoa lợi là những nhóm tín hữu cụ thể hay để nói rõ một hệ thống thần học.
  rationale: Câu này trình bày mặt tích cực của phép so sánh nông nghiệp; nguyên văn không tự giải thích chi tiết từng yếu tố, nên bản dịch cần giữ nguyên độ mở và sức căng thần học.
- issue: διά với đối cách trong δι’ οὓς
  choice: “vì họ,” chỉ những người vì lợi ích của họ mà đất được canh tác
  alternative: “bởi họ,” hiểu là những người trực tiếp canh tác đất
  rationale: διά đi với đối cách thường biểu thị lý do hoặc mục đích hơn là tác nhân; tuy vậy, cách hiểu về tác nhân đã từng được đề xuất nên được ghi chú.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Giữ hình ảnh đất “uống” nước mưa; dùng “Đức Chúa Trời” theo văn phong Kinh Thánh Tin Lành phổ biến, không thêm cách giải thích mang tính hệ phái.
