revisions:
- from: Vì đất uống nước mưa thường xuyên rơi xuống trên nó và sinh ra cây cỏ hữu ích cho những người mà vì họ đất ấy cũng được canh tác, thì nhận được phước lành từ Đức Chúa Trời.[a][b]
  to: Vì đất uống mưa thường xuyên rơi xuống và sinh ra cây cỏ[a] hữu ích cho những người vì họ mà đất ấy cũng được canh tác[b], nhận được phước lành từ Đức Chúa Trời.
  rationale: Bản sửa chỉ điều chỉnh trật tự từ, nhịp câu và vị trí neo chú thích. Bản sửa vẫn giữ hình ảnh đất ‘uống’ mưa, ý πολλάκις (‘thường xuyên’), nghĩa rộng của βοτάνη, thể bị động của γεωργεῖται, và tính mở của ẩn dụ; không đưa thêm kết luận giáo lý.
  reviewer_model: gpt-5.6-terra
