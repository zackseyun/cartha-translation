reference: Hebrews 6:18
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἵνα διὰ δύο πραγμάτων ἀμεταθέτων, ἐν οἷς ἀδύνατον ψεύσασθαι ⸀θεόν, ἰσχυρὰν παράκλησιν ἔχωμεν οἱ καταφυγόντες κρατῆσαι τῆς προκειμένης ἐλπίδος·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/018.yaml
  text: so that through two unchangeable things[a], in which it is impossible for God to lie[b], we who have fled for refuge might have strong encouragement to take hold of the hope set before us.
translation:
  language: vi
  text: hầu cho chúng ta, là những người đã chạy đến nương náu[b], nhờ hai điều không thể thay đổi, mà trong đó Đức Chúa Trời không thể nói dối, có được sự khích lệ mạnh mẽ để nắm lấy[a] niềm hy vọng đặt trước mặt chúng ta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “giữ chặt lấy” hoặc “giữ vững”. Động từ Hy Lạp có thể mang nghĩa nắm lấy, nắm chắc hoặc giữ chặt.'
    reason: lexical_alternative
  - marker: b
    text: Cụm từ “chạy đến nương náu” gợi hình ảnh chạy đến một nơi an toàn và có thể khiến người đọc liên tưởng đến các thành trú ẩn trong Cựu Ước.
    reason: cross_reference
lexical_decisions:
- source_word: ἵνα
  choice: để
  rationale: Diễn đạt tự nhiên ý mục đích hoặc kết quả phát xuất từ câu trước.
- source_word: διὰ δύο πραγμάτων ἀμεταθέτων
  choice: nhờ hai điều không thể thay đổi
  rationale: “Điều” giữ được nghĩa rộng của πράγματα; “không thể thay đổi” truyền đạt sức mạnh của ἀμεταθέτων mà vẫn rõ ràng với độc giả hiện đại.
- source_word: ἐν οἷς
  choice: mà trong đó
  rationale: Giữ mối liên hệ ngữ pháp với “hai điều” vừa nêu, không diễn giải thêm hai điều ấy là gì ngay trong câu.
- source_word: ἀδύνατον ψεύσασθαι θεόν
  choice: Đức Chúa Trời không thể nói dối
  rationale: Diễn đạt trực tiếp và trang nghiêm sự bất khả được khẳng định trong nguyên văn, không mở rộng thành một công thức thần học ngoài câu.
- source_word: ἰσχυρὰν παράκλησιν
  choice: sự khích lệ mạnh mẽ
  rationale: παράκλησις trong ngữ cảnh này chỉ sự nâng đỡ, khích lệ phát sinh từ lời hứa và lời thề; cách dịch này tránh sắc thái cổ của “an ủi lớn lao”.
- source_word: ἔχωμεν
  choice: có được
  rationale: Phù hợp với thể giả định sau ἵνα và truyền đạt kết quả được nhắm đến.
- source_word: οἱ καταφυγόντες
  choice: chúng ta là những người đã chạy đến nương náu
  rationale: Giữ cả chuyển động “chạy đến” lẫn mục đích tìm nơi an toàn trong hình ảnh καταφεύγω.
- source_word: κρατῆσαι
  choice: để nắm lấy
  rationale: “Nắm lấy” giữ hình ảnh hành động chủ động của κρατέω, đồng thời có thể bao hàm ý nắm chắc hoặc giữ chặt mà không buộc chọn một sắc thái duy nhất.
- source_word: τῆς προκειμένης ἐλπίδος
  choice: niềm hy vọng đặt trước mặt mình
  rationale: Giữ hình ảnh niềm hy vọng được đặt ra phía trước để người tin hướng tới và nắm lấy.
theological_decisions:
- issue: Hình ảnh nương náu và nắm lấy niềm hy vọng
  choice: Giữ hình ảnh cụ thể “chạy đến nương náu” và “nắm lấy” thay vì chuyển hoàn toàn thành ngôn ngữ trừu tượng về sự bảo đảm.
  alternative: “đã tìm nơi nương náu… giữ vững niềm hy vọng”
  rationale: Nguyên văn kết hợp hình ảnh chạy đến chỗ an toàn với hành động chủ động nắm lấy hy vọng; bản dịch bảo tồn sự kết hợp ấy và không xác quyết rằng đây nhất thiết là một ám chỉ trực tiếp đến các thành trú ẩn.
- issue: Lời khẳng định về sự chân thật của Đức Chúa Trời
  choice: “Đức Chúa Trời không thể nói dối”
  alternative: “Đức Chúa Trời tuyệt đối không nói dối”
  rationale: Bản dịch giữ đúng lời khẳng định mạnh của cấu trúc ἀδύνατον mà không thêm lời giải thích triết học hay tín điều ngoài nguyên văn.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang nghiêm và dễ hiểu. Trật tự câu giữ quan hệ giữa “hai điều không thể thay đổi” và việc Đức Chúa Trời không thể nói dối. Các dấu chú thích được đặt ngay sau cụm từ thực sự được chú giải.
