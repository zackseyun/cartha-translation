revisions:
- from: Vì khi Đức Chúa Trời ban lời hứa cho Áp-ra-ham, bởi không thể lấy ai lớn hơn mà thề, Ngài đã lấy chính mình mà thề,
  to: Vì khi Đức Chúa Trời ban lời hứa cho Áp-ra-ham, bởi không có ai lớn hơn để Ngài có thể nhân danh mà thề, Ngài đã nhân danh chính mình mà thề,
  rationale: Chỉ sửa cách diễn đạt thành ngữ về lời thề để làm rõ rằng Đức Chúa Trời thề nhân danh một đấng cao hơn—nhưng không có ai như vậy—rồi thề nhân danh chính mình. Giữ nguyên liên từ giải thích, trật tự lập luận, tên riêng, sắc thái tôn kính, và dấu phẩy cuối câu vì mệnh đề tiếp tục ở câu 14.
