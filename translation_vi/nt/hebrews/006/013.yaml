source:
  edition: SBLGNT
  text: Τῷ γὰρ Ἀβραὰμ ἐπαγγειλάμενος ὁ θεός, ἐπεὶ κατ’ οὐδενὸς εἶχεν μείζονος ὀμόσαι, ὤμοσεν καθ’ ἑαυτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/013.yaml
  text: For when God made the promise to Abraham[a], since he could swear by no one greater, he swore by himself[b],
translation:
  language: vi
  text: Vì khi Đức Chúa Trời ban lời hứa cho Áp-ra-ham, bởi không có ai lớn hơn để Ngài có thể nhân danh mà thề, Ngài đã nhân danh chính mình mà thề,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γὰρ
  choice: Vì
  rationale: Giữ quan hệ giải thích với lập luận ngay trước đó.
- source_word: ἐπαγγειλάμενος
  choice: khi ... ban lời hứa
  rationale: Diễn đạt tự nhiên phân từ bất định quá khứ của ἐπαγγέλλομαι và làm rõ nội dung ngầm là lời hứa, đồng thời không thêm nội dung của lời hứa.
- source_word: Τῷ ... Ἀβραὰμ
  choice: cho Áp-ra-ham
  rationale: Cách nói tự nhiên trong tiếng Việt để chỉ người nhận lời hứa.
- source_word: ἐπεὶ
  choice: bởi
  rationale: 'Thể hiện nghĩa nguyên nhân ở đây: lý do Đức Chúa Trời lấy chính mình mà thề.'
- source_word: κατ’ οὐδενὸς ... μείζονος
  choice: không thể lấy ai lớn hơn mà thề
  rationale: Trong ngữ cảnh lời thề, οὐδενός chỉ một đối tượng được viện dẫn làm bảo chứng; “ai” tự nhiên hơn “điều gì” và vẫn giữ ý không có ai lớn hơn.
- source_word: ὀμόσαι / ὤμοσεν
  choice: thề / đã ... thề
  rationale: Giữ sự lặp từ của nguyên văn và dùng cách diễn đạt thông dụng, trang trọng trong tiếng Việt.
- source_word: καθ’ ἑαυτοῦ
  choice: lấy chính mình mà thề
  rationale: 'Truyền đạt thành ngữ tuyên thệ với κατά: Đức Chúa Trời viện dẫn chính mình làm bảo chứng, chứ không chỉ hành động một mình.'
theological_decisions:
- issue: Bản chất lời thề của Đức Chúa Trời
  choice: Đức Chúa Trời lấy chính mình mà thề vì không thể lấy ai lớn hơn mà thề.
  alternative: Đức Chúa Trời nhân danh chính mình mà thề vì không có ai lớn hơn để Ngài có thể nhân danh mà thề.
  rationale: Bản dịch giữ nguyên lập luận về địa vị tối cao độc nhất của Đức Chúa Trời, nhưng không khai triển thành một công thức tín lý vượt quá câu văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Chúa Trời” và đại từ tôn kính “Ngài”; giữ dấu phẩy cuối câu vì câu Hy Lạp tiếp tục sang lời trích dẫn ở câu kế tiếp.
