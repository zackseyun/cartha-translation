id: HEB.6.2
reference: Hebrews 6:2
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: βαπτισμῶν ⸀διδαχὴν ἐπιθέσεώς τε χειρῶν, ἀναστάσεώς ⸀τε νεκρῶν καὶ κρίματος αἰωνίου.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/002.yaml
  text: instruction about washings[a], the laying on of hands, the resurrection of the dead, and eternal judgment.
translation:
  language: vi
  text: sự dạy dỗ về các phép thanh tẩy[a], việc đặt tay, sự sống lại của người chết và sự phán xét đời đời.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hoặc “các phép báp-têm.” Danh từ Hy Lạp ở số nhiều có thể chỉ các nghi thức thanh tẩy theo nghĩa rộng hơn, không nhất thiết chỉ riêng phép báp-têm Cơ Đốc.
    reason: lexical_alternative
lexical_decisions:
- source_word: βαπτισμῶν
  choice: các phép thanh tẩy
  rationale: Danh từ số nhiều có thể chỉ những nghi thức tẩy rửa nói chung; cách dịch này giữ được số nhiều và tránh mặc nhiên giới hạn vào phép báp-têm Cơ Đốc.
- source_word: διδαχὴν
  choice: sự dạy dỗ
  rationale: Danh từ này tiếp nối danh sách các điều nền tảng ở câu trước và có thể được hiểu là sự dạy dỗ về các mục theo sau.
- source_word: ἐπιθέσεώς τε χειρῶν
  choice: việc đặt tay
  rationale: Đây là cách diễn đạt tự nhiên, quen thuộc trong tiếng Việt cho hành động hay nghi thức được nêu trong cụm Hy Lạp.
- source_word: ἀναστάσεώς τε νεκρῶν
  choice: sự sống lại của người chết
  rationale: Cách dịch tự nhiên, giữ nghĩa tập thể của νεκρῶν mà không bổ sung chi tiết thần học ngoài bản văn.
- source_word: κρίματος αἰωνίου
  choice: sự phán xét đời đời
  rationale: Giữ đúng nghĩa 'phán xét' thay vì thu hẹp thành 'kết án'; 'đời đời' diễn đạt αἰωνίου tự nhiên trong văn phong Kinh Thánh tiếng Việt.
- source_word: τε ... τε καὶ
  choice: dấu phẩy và liên từ “và”
  rationale: Các tiểu từ liên kết cấu trúc danh sách; cách phối hợp thông thường trong tiếng Việt truyền đạt quan hệ ấy rõ ràng và tự nhiên.
theological_decisions:
- issue: Ý nghĩa của βαπτισμῶν trong danh sách các giáo huấn sơ đẳng
  choice: Dịch là “các phép thanh tẩy”.
  alternative: “các phép báp-têm”
  rationale: Dạng số nhiều và phạm vi ngữ nghĩa cho phép hiểu là các nghi thức tẩy rửa rộng hơn, không nhất thiết chỉ phép báp-têm Cơ Đốc; chú thích bảo lưu cách hiểu còn lại.
- issue: Phạm vi của κρίματος αἰωνίου
  choice: Dịch là “sự phán xét đời đời” mà không xác định chỉ là sự kết án.
  alternative: “sự kết án đời đời”
  rationale: Bản văn dùng từ 'phán xét', không nói riêng 'kết án'; cách dịch này không thu hẹp kết quả thần học quá mức lời văn.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. “Sự dạy dỗ” nối tự nhiên với danh sách từ câu trước; “các phép thanh tẩy” giữ sắc thái nghi lễ và số nhiều của nguyên ngữ.
