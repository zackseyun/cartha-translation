id: HEB.6.17
reference: Hebrews 6:17
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐν ᾧ περισσότερον βουλόμενος ὁ θεὸς ἐπιδεῖξαι τοῖς κληρονόμοις τῆς ἐπαγγελίας τὸ ἀμετάθετον τῆς βουλῆς αὐτοῦ ἐμεσίτευσεν ὅρκῳ,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/017.yaml
  text: So when God desired to show more clearly to the heirs of the promise the unchangeable character of his purpose[a], he guaranteed it with an oath[b],
translation:
  language: vi
  text: Vì thế, Đức Chúa Trời muốn bày tỏ rõ ràng hơn cho những người thừa hưởng lời hứa rằng ý định của Ngài không thể thay đổi, nên Ngài đã lấy lời thề làm bảo chứng cho điều ấy.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc dịch sát hơn: “Ngài đã can thiệp bằng một lời thề.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ᾧ
  choice: Vì thế
  rationale: Cụm từ nối kết câu này với việc dùng lời thề ở câu trước; “Vì thế” diễn đạt tự nhiên quan hệ suy luận trong tiếng Việt mà không dùng lối dịch sát khó hiểu như “trong đó”.
- source_word: περισσότερον
  choice: rõ ràng hơn
  rationale: Trạng từ so sánh bổ nghĩa về ý nghĩa cho hành động “bày tỏ”, nhấn mạnh mức độ xác chứng rõ ràng hơn dành cho người nhận lời hứa.
- source_word: βουλόμενος
  choice: muốn
  rationale: Diễn tả ý muốn có chủ đích của Đức Chúa Trời; trong ngữ cảnh này, “muốn” không hàm ý một ước muốn bất định mà dẫn trực tiếp đến hành động xác chứng.
- source_word: ἐπιδεῖξαι
  choice: bày tỏ
  rationale: Truyền đạt ý nghĩa cho thấy hoặc chứng tỏ, đồng thời giữ giọng văn trang trọng và tự nhiên.
- source_word: τοῖς κληρονόμοις τῆς ἐπαγγελίας
  choice: cho những người thừa hưởng lời hứa
  rationale: Giữ hình ảnh thừa kế của κληρονόμοις và cấu trúc sở hữu của nguyên văn, không tự ý giới hạn danh tính những người này.
- source_word: τὸ ἀμετάθετον τῆς βουλῆς αὐτοῦ
  choice: rằng ý định của Ngài không thể thay đổi
  rationale: Chuyển danh hóa Hy Lạp thành mệnh đề tự nhiên trong tiếng Việt, vẫn giữ trọng tâm rằng ý định có chủ đích của Đức Chúa Trời là bất biến.
- source_word: ἐμεσίτευσεν ὅρκῳ
  choice: đã lấy lời thề làm bảo chứng cho điều ấy
  rationale: 'Diễn đạt chức năng của động từ trong ngữ cảnh: Đức Chúa Trời dùng lời thề để ban sự xác nhận chắc chắn. Chú thích giữ lại cách hiểu sát chữ hơn của động từ.'
theological_decisions:
- issue: Tính không thể thay đổi của βουλή Đức Chúa Trời
  choice: ý định của Ngài không thể thay đổi
  alternative: tính bất biến của sự định liệu của Ngài
  rationale: Cách chọn giữ nguyên khẳng định mạnh của câu về ý định không thể bị thay đổi, nhưng tránh đưa vào thuật ngữ siêu hình hoặc thần học kỹ thuật không cần thiết.
- issue: Ý nghĩa của ἐμεσίτευσεν khi đi với lời thề
  choice: lấy lời thề làm bảo chứng cho điều ấy
  alternative: đứng ra làm trung gian bằng một lời thề
  rationale: Trong văn cảnh, động từ nói đến việc dùng lời thề để xác chứng; cách dịch chính truyền đạt chức năng này rõ ràng, còn chú thích bảo tồn sắc thái từ nguyên và sự mơ hồ chính đáng.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Câu giữ mạch lập luận với phần trước, duy trì hình ảnh “thừa hưởng” và “lời hứa”, đồng thời tránh thuật ngữ thần học chuyên môn.
