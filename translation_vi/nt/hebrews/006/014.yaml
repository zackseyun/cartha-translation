translation:
  language: vi
  text: 'Ngài phán rằng: “Chắc chắn Ta sẽ ban phước cho con và chắc chắn sẽ làm cho con sinh sôi đông đúc.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hy Lạp: “Quả thật, ban phước Ta sẽ ban phước cho con, và làm cho sinh sôi Ta sẽ làm cho con sinh sôi”; đây là cấu trúc nhấn mạnh, gợi lại Sáng Thế Ký 22:17.'
    reason: Giải thích công thức quả quyết và cấu trúc lặp nhấn mạnh của nguyên ngữ, cũng như liên hệ liên văn bản.
lexical_decisions:
- source_word: λέγων
  choice: Ngài phán rằng
  rationale: Phân từ hiện tại giới thiệu nội dung lời thề của Đức Chúa Trời. “Phán” phù hợp với lời nói trang trọng của Đức Chúa Trời, còn “rằng” dẫn trực tiếp vào lời trích.
- source_word: Εἰ μὴν
  choice: Chắc chắn
  rationale: Cụm này là công thức quả quyết mạnh trong ngôn ngữ thề hứa, không phải một câu điều kiện theo nghĩa đen.
- source_word: εὐλογῶν εὐλογήσω
  choice: Ta sẽ ban phước cho con
  rationale: Lối lặp phân từ và động từ hữu hạn mang sắc thái nhấn mạnh kiểu Hê-bơ-rơ. Tiếng Việt tự nhiên diễn đạt bằng lời quả quyết “chắc chắn” đứng trước toàn lời hứa, đồng thời chú thích giữ lại cấu trúc nguyên ngữ.
- source_word: σε
  choice: con
  rationale: Đại từ ngôi thứ hai số ít chỉ Áp-ra-ham. Trong lời Đức Chúa Trời trực tiếp phán với Áp-ra-ham, “con” là cách xưng hô tự nhiên, trang trọng và dễ hiểu trong tiếng Việt.
- source_word: καὶ
  choice: và
  rationale: Liên từ nối hai hành động được hứa.
- source_word: πληθύνων πληθυνῶ σε
  choice: chắc chắn sẽ làm cho con sinh sôi đông đúc
  rationale: Diễn đạt sự gia tăng mạnh mẽ về dòng dõi theo lời hứa với Áp-ra-ham; lần lặp “chắc chắn” bảo toàn tính song song và sức nhấn của cấu trúc Hy Lạp.
theological_decisions:
- issue: Cách chuyển dịch công thức thề hứa nhấn mạnh trích từ lời hứa dành cho Áp-ra-ham
  choice: Dùng tiếng Việt tự nhiên với “chắc chắn” cho cả hai vế, đồng thời ghi cấu trúc lặp của nguyên ngữ trong chú thích.
  alternative: 'Dịch sát hình thức: “quả thật, ban phước, Ta sẽ ban phước cho con; làm cho sinh sôi, Ta sẽ làm cho con sinh sôi.”'
  rationale: Cách chọn giữ được sức quả quyết và sự song song của cả hai động từ mà không tạo câu tiếng Việt gượng ép; chú thích bảo toàn liên hệ hình thức với Sáng Thế Ký 22:17.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Viết hoa “Ngài” và “Ta” theo ngữ cảnh chỉ Đức Chúa Trời; dùng “con” cho Áp-ra-ham trong lời phán trực tiếp. Dấu chú thích [a] được đặt ngay sau mệnh đề dẫn nhập mà nó giải thích.
