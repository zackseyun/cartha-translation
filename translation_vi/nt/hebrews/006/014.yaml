    issue: Chú thích [a] không phản ánh đầy đủ công thức Hy Lạp được trích dẫn.
    rationale: Nguyên văn có εἰ μὴν ở đầu câu, một công thức quả quyết mạnh, nhưng câu trích trong chú thích bắt đầu ngay với “ban phước”. Vì chú thích được giới thiệu là “Nguyên văn Hy Lạp”, cần bao gồm hoặc ghi nhận rõ thành tố này.
  - severity: low
