review_pass:
  verdict: revise
  source_fidelity: Bản nháp thêm cấu trúc điều kiện rõ rệt “nếu”, trong khi nguyên văn dùng phân từ tiếp nối hình ảnh về đất ở câu trước. “Không đạt yêu cầu” quá mang sắc thái hành chính và không diễn đạt tự nhiên sự vô dụng/không được chấp nhận của ἀδόκιμος trong ẩn dụ nông nghiệp. “Gần kề lời nguyền rủa” giữ sát κατάρας ἐγγύς hơn “gần bị nguyền rủa”, vốn chuyển sang một hành động bị động sắp xảy ra.
  naturalness: “Còn đất nào sinh ra gai và tật lê” là tiếng Việt hiện đại, rõ chủ thể và giữ tính khái quát của hình ảnh. “Vô dụng” phù hợp trực tiếp với đất không sinh sản hữu ích; “kết cục là bị đốt cháy” tự nhiên và vẫn bảo toàn hình ảnh εἰς καῦσιν.
  terminology: Giữ “tật lê” cho τρίβολοι, một tên cây có gai quen thuộc trong văn liệu Kinh Thánh. Dùng “lời nguyền rủa” cho κατάρα mà không giải thích thành hỏa ngục hay phán xét cuối cùng. Chú thích duy trì phương án “bị loại bỏ” cho ἀδόκιμος.
  issues:
  - severity: medium
    issue: “Nếu” diễn đạt phân từ ἐκφέρουσα như một điều kiện độc lập.
    rationale: Nguyên văn đối lập loại đất sinh gai với đất sinh cây có ích ở câu trước; tiếng Việt nên diễn đạt là “đất nào ... thì” thay vì thêm một mệnh đề điều kiện với đại từ quy chiếu không cần thiết.
  - severity: medium
    issue: “Không đạt yêu cầu” không tự nhiên trong ngữ cảnh đất canh tác.
    rationale: Cụm này mang sắc thái đánh giá hành chính hiện đại, trong khi ἀδόκιμος ở đây nói về đất không hữu dụng/không được chấp nhận. “Vô dụng” truyền đạt trực tiếp hơn, với chú thích bảo lưu phương án mạnh hơn.
  - severity: low
    issue: “Gần bị nguyền rủa” chuyển “gần một lời nguyền rủa” thành nguy cơ sắp chịu một hành động.
    rationale: “Gần kề lời nguyền rủa” duy trì danh từ κατάρας và sự dè dặt của nguyên văn.
  revised_text: Còn đất nào sinh ra gai và tật lê thì vô dụng[a], gần kề lời nguyền rủa, và kết cục là bị đốt cháy.
