reference: Hebrews 6:8
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐκφέρουσα δὲ ἀκάνθας καὶ τριβόλους ἀδόκιμος καὶ κατάρας ἐγγύς, ἧς τὸ τέλος εἰς καῦσιν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/008.yaml
  text: But if it bears thorns and thistles[a], it is worthless and near to being cursed, and its end is for burning.
translation:
  language: vi
  text: Còn đất nào sinh ra gai và tật lê thì vô dụng[a], gần kề lời nguyền rủa, và kết cục là bị đốt cháy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “bị loại bỏ”.
    reason: Giữ lại phương án từ vựng quan trọng cho ἀδόκιμος, có thể chỉ điều không được chấp nhận sau khi thử nghiệm.
lexical_decisions:
- source_word: ἐκφέρουσα
  choice: sinh ra
  rationale: Phân từ hiện tại giống cái số ít tiếp nối chủ thể là đất ở câu trước; “sinh ra” tự nhiên trong hình ảnh canh tác và giữ được ý đất sản sinh hoa màu hoặc cỏ dại.
- source_word: δὲ
  choice: Nhưng
  rationale: Biểu thị sự tương phản với mảnh đất sinh cây hữu ích trong câu 7.
- source_word: ἀκάνθας καὶ τριβόλους
  choice: gai góc và cây tật lê
  rationale: Hai danh từ chỉ các loại cây có gai, vô ích đối với canh tác; cách dịch giữ hai thành phần riêng biệt của nguyên văn.
- source_word: ἀδόκιμος
  choice: không đạt yêu cầu
  rationale: Từ này chỉ điều không vượt qua sự thử nghiệm hay không được chấp nhận. Trong ngữ cảnh đất canh tác, cách dịch này giữ ý đánh giá mà không thu hẹp thành “vô dụng” hay mặc nhiên xác định một phán quyết thần học cuối cùng.
- source_word: κατάρας ἐγγύς
  choice: gần bị nguyền rủa
  rationale: Diễn đạt tự nhiên trong tiếng Việt ý ở gần sự nguyền rủa, đồng thời không nói rằng lời nguyền đã xảy ra.
- source_word: ἧς τὸ τέλος
  choice: kết cục của nó
  rationale: Đại từ giống cái quy chiếu về mảnh đất; “kết cục” giữ được cả ý kết thúc lẫn kết quả.
- source_word: εἰς καῦσιν
  choice: là bị thiêu đốt
  rationale: Giữ nguyên hình ảnh đốt cháy và không giải thích thêm đó là hỏa ngục hay một hình thức phán xét cụ thể.
theological_decisions:
- issue: Có nên lặp lại danh từ “đất” từ câu trước hay chỉ dùng đại từ
  choice: Dùng “đất ấy” để chủ thể rõ ràng trong tiếng Việt
  alternative: Dùng “nó” ngay từ đầu câu
  rationale: Tiếng Hy Lạp dùng phân từ giống cái để nối với “đất” ở câu 7. Tiếng Việt không có dấu hiệu giống ngữ pháp, nên nhắc lại “đất ấy” giúp bảo toàn sự liên kết của ẩn dụ mà không thay đổi đối tượng.
- issue: Sắc thái của ἀδόκιμος
  choice: Dịch “không đạt yêu cầu” và ghi chú phương án “bị loại bỏ”
  alternative: vô dụng; bị loại bỏ; không được chấp nhận
  rationale: Cách dịch chính phản ánh ý không vượt qua thử nghiệm trong bối cảnh nông nghiệp; chú thích giữ lại sắc thái bị bác bỏ có thể có của từ này mà không giải quyết thay cho độc giả mức độ thần học của lời cảnh báo.
- issue: Có nên giải thích εἰς καῦσιν là sự phán xét cuối cùng hay hỏa ngục
  choice: Giữ hình ảnh “bị thiêu đốt”
  alternative: bị lửa phán xét thiêu hủy
  rationale: Câu này vẫn dùng hình ảnh nông nghiệp và không tự xác định đầy đủ đối tượng giáo lý của lửa; bản dịch không nên bổ sung điều nguyên văn không nói rõ.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. “Cây tật lê” là tên gọi tương đối quen thuộc trong văn liệu Kinh Thánh; “không đạt yêu cầu” giữ sắc thái thử nghiệm của ἀδόκιμος. Mọi dấu chú thích đều xuất hiện trong câu chính.
