revisions:
- from: Nhưng nếu đất ấy sinh ra gai góc và cây tật lê, thì nó không đạt yêu cầu[a], gần bị nguyền rủa, và kết cục của nó là bị thiêu đốt.
  to: Còn đất nào sinh ra gai và tật lê thì vô dụng[a], gần kề lời nguyền rủa, và kết cục là bị đốt cháy.
  rationale: Bản sửa giữ ẩn dụ nông nghiệp, sự đối lập với câu trước, và tính không xác định về ý nghĩa thần học đầy đủ của việc đốt cháy. Nó tránh thêm điều kiện không được nêu tường minh, thay cách nói hành chính bằng tiếng Việt tự nhiên hơn, và bảo toàn lựa chọn “bị loại bỏ” trong chú thích.
