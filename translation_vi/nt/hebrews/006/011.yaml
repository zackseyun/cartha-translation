source:
  edition: SBLGNT
  text: ἐπιθυμοῦμεν δὲ ἕκαστον ὑμῶν τὴν αὐτὴν ἐνδείκνυσθαι σπουδὴν πρὸς τὴν πληροφορίαν τῆς ἐλπίδος ἄχρι τέλους,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/011.yaml
  text: And we desire each one of you to show the same diligence for the full assurance of hope until the end[b][a],
translation:
  language: vi
  text: Và chúng tôi mong mỗi người trong anh em đều bày tỏ cùng một sự chuyên cần, để có sự xác tín trọn vẹn về niềm hy vọng cho đến cuối cùng.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “sự chắc chắn đầy trọn về niềm hy vọng” hoặc “sự tin chắc hoàn toàn về niềm hy vọng.” Từ Hy Lạp có thể chỉ sự chắc chắn hoặc sự xác tín đầy trọn.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “tới cùng.” Cụm từ nhấn mạnh sự kiên trì cho đến khi hoàn tất.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιθυμοῦμεν
  choice: chúng tôi mong
  rationale: Diễn tả ước muốn tha thiết mang tính mục vụ, tự nhiên hơn “khao khát” trong ngữ cảnh khuyên nhủ này.
- source_word: δὲ
  choice: Nhưng
  rationale: Đánh dấu sự chuyển ý nhẹ từ lời xác nhận ở câu trước sang lời khuyên nhủ; “nhưng” làm rõ sắc thái chuyển hướng mà không tạo đối lập gay gắt.
- source_word: ἕκαστον ὑμῶν
  choice: mỗi người trong anh em
  rationale: Giữ rõ lực phân phối của cụm từ, nhấn mạnh lời khuyên áp dụng cho từng cá nhân trong cộng đồng.
- source_word: τὴν αὐτὴν
  choice: cùng một ... như vậy
  rationale: Quy chiếu về lòng sốt sắng đã được bày tỏ trong tình yêu và sự phục vụ ở văn cảnh trước.
- source_word: ἐνδείκνυσθαι
  choice: bày tỏ
  rationale: Truyền đạt ý biểu lộ hoặc chứng tỏ một phẩm chất bằng hành động, với văn phong trang trọng nhưng hiện đại.
- source_word: σπουδὴν
  choice: lòng sốt sắng
  rationale: Bao hàm sự chuyên cần, thiết tha và nghiêm túc trong hành động; phù hợp với σπουδή trong lời khuyên nhủ.
- source_word: πρὸς τὴν πληροφορίαν τῆς ἐλπίδος
  choice: để niềm hy vọng được hoàn toàn vững chắc
  rationale: Diễn đạt πρός theo hướng mục đích và πληροφορία như sự đầy trọn của xác tín, đồng thời giữ mối liên hệ cú pháp với “niềm hy vọng”.
- source_word: ἐλπίδος
  choice: niềm hy vọng
  rationale: Là tương đương trực tiếp, chỉ sự trông đợi đặt nơi lời hứa của Đức Chúa Trời chứ không chỉ là mong ước.
- source_word: ἄχρι τέλους
  choice: cho đến cuối cùng
  rationale: Giữ lực thời gian của ἄχρι và ý kiên trì xuyên suốt cho tới điểm hoàn tất.
theological_decisions:
- issue: Ý nghĩa của πληροφορία τῆς ἐλπίδος trong mối liên hệ với sự bền đỗ
  choice: “niềm hy vọng được hoàn toàn vững chắc” giữ cả sắc thái xác tín đầy trọn lẫn sự vững vàng của niềm hy vọng.
  alternative: “hoàn toàn xác tín về niềm hy vọng” có thể nhấn mạnh mạnh hơn trạng thái chắc chắn chủ quan; “niềm hy vọng được thành tựu trọn vẹn” có thể nhấn mạnh sự ứng nghiệm khách quan.
  rationale: Cấu trúc Hy Lạp cho phép có sự chồng lấn giữa sự xác tín chủ quan và tính chắc chắn gắn với niềm hy vọng. Bản dịch không giới hạn câu vào một hệ thống tín lý về sự cứu rỗi hay sự bền đỗ.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng và dễ hiểu. Dùng “anh em” để xưng hô với cộng đồng tín hữu theo văn phong Kinh Thánh tự nhiên; câu giữ giọng tha thiết của lời khuyên mục vụ. Các dấu chú thích đều xuất hiện trong chính văn.
