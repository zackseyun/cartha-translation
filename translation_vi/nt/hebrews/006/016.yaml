source:
  edition: SBLGNT
  text: ⸀ἄνθρωποι γὰρ κατὰ τοῦ μείζονος ὀμνύουσιν, καὶ πάσης αὐτοῖς ἀντιλογίας πέρας εἰς βεβαίωσιν ὁ ὅρκος·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/016.yaml
  text: For people swear by one greater than themselves[b][a], and for them an oath is the end of every dispute for confirmation.
translation:
  language: vi
  text: Vì người ta thề nhân danh một người cao trọng hơn mình, và đối với họ, lời thề là sự xác nhận cuối cùng, chấm dứt mọi tranh chấp[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “mọi sự phản bác” hoặc “mọi cuộc tranh luận.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄνθρωποι
  choice: người ta
  rationale: Danh từ số nhiều mang nghĩa khái quát về loài người; “người ta” diễn đạt tự nhiên một tập quán chung và không giới hạn ở nam giới.
- source_word: κατὰ τοῦ μείζονος
  choice: nhân danh một người cao trọng hơn mình
  rationale: Trong công thức thề, κατά với sở hữu cách chỉ người có thẩm quyền cao hơn được viện dẫn; “cao trọng hơn mình” giữ lực so sánh mà không xác định một đối tượng cụ thể ngoài bản văn.
- source_word: ὀμνύουσιν
  choice: thề
  rationale: Cách dịch trực tiếp, gọn và tự nhiên; danh từ “lời thề” xuất hiện ở vế sau nên không cần lặp đối tượng tại đây.
- source_word: πάσης ... ἀντιλογίας
  choice: mọi tranh chấp
  rationale: Trong ngữ cảnh lời thề xác nhận một vấn đề đang bị tranh cãi, ἀντιλογία nói đến sự bất đồng hoặc tranh chấp, không chỉ là mâu thuẫn lô-gích.
- source_word: πέρας
  choice: điều chấm dứt
  rationale: Giữ nghĩa căn bản “điểm cuối, sự kết thúc” đồng thời diễn đạt rõ chức năng của lời thề trong câu.
- source_word: εἰς βεβαίωσιν
  choice: để xác nhận sự việc
  rationale: εἰς với đối cách diễn tả mục đích hoặc kết quả; “sự việc” được bổ sung tối thiểu để cụm từ tự nhiên và rõ nghĩa trong tiếng Việt.
- source_word: ὁ ὅρκος
  choice: lời thề
  rationale: Mạo từ Hy Lạp nêu lời thề như một phạm trù chung; tiếng Việt không cần thêm từ chỉ định.
theological_decisions:
- issue: Câu châm ngôn nói khái quát về con người
  choice: người ta
  alternative: những người nam / loài người
  rationale: ἄνθρωποι ở đây chỉ con người nói chung chứ không riêng nam giới; “người ta” vừa chính xác vừa tự nhiên trong tiếng Việt.
- issue: Đối tượng được viện dẫn khi thề
  choice: một người cao trọng hơn mình
  alternative: Đấng cao trọng hơn mình
  rationale: Bản văn trình bày tập quán chung và không trực tiếp xác định đối tượng là Đức Chúa Trời; không viết hoa hoặc thần học hóa danh xưng giúp giữ nguyên mức độ xác định của tiếng Hy Lạp.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “người ta” cho phát biểu khái quát, “nhân danh” cho công thức viện dẫn thẩm quyền khi thề, và giữ cấu trúc mục đích “để xác nhận” của nguyên văn.
