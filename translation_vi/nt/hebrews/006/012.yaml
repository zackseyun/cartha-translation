  source_fidelity: Bản dịch truyền đạt đúng cấu trúc đối lập của câu, sắc thái biến đổi trạng thái của γένησθε, và số nhiều của “các lời hứa”. Tuy nhiên, νωθροί ở đây nói đến sự trì trệ/biếng nhác trong việc đáp ứng và chuyên cần, không chỉ là sự “chậm chạp” nói chung; “trì trệ” phản ánh sát hơn trong tiếng Việt hiện đại.
  naturalness: Câu nhìn chung tự nhiên. Thay “chậm chạp” bằng “trì trệ” giúp tránh liên tưởng đến tốc độ thể lý và giữ được giọng khuyên nhủ trang trọng, hiện đại. Cấu trúc “noi gương những người…” vẫn tự nhiên và diễn đạt đúng μιμηταί.
  terminology: “Đức tin,” “lòng kiên nhẫn,” “thừa hưởng,” và “các lời hứa” đều phù hợp. Chú thích nên trình bày phương án thay thế cho toàn cụm διὰ πίστεως một cách trực tiếp hơn; “sự trung tín” là khả năng từ vựng cần được giữ ở chú thích mà không áp đặt vào chính văn.
  issues:
