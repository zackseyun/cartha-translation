id: HEB.6.12
reference: Hebrews 6:12
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἵνα μὴ νωθροὶ γένησθε, μιμηταὶ δὲ τῶν διὰ πίστεως καὶ μακροθυμίας κληρονομούντων τὰς ἐπαγγελίας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/012.yaml
  text: so that you may not become sluggish[a], but imitators of those who through faith and patience inherit the promises.
translation:
  language: vi
  text: để anh chị em không trở nên trì trệ, nhưng noi gương những người nhờ đức tin[a] và lòng kiên nhẫn mà thừa hưởng các lời hứa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “nhờ sự trung tín và lòng kiên nhẫn.” Từ Hy Lạp được dịch là “đức tin” trong một số ngữ cảnh cũng có thể mang sắc thái tin cậy hoặc trung tín.'
    reason: lexical_alternative
lexical_decisions:
- source_word: νωθροὶ
  choice: chậm chạp
  rationale: Diễn đạt trạng thái trì trệ, chậm đáp ứng hoặc thiếu chuyên cần trong mạch văn Hê-bơ-rơ 5:11–6:12, mà không mang sắc thái kết tội quá mạnh như “lười biếng”.
- source_word: γένησθε
  choice: trở nên
  rationale: Giữ sắc thái chuyển sang một trạng thái của γίνομαι, phù hợp với lời cảnh báo đừng rơi vào tình trạng chậm chạp.
- source_word: μιμηταὶ
  choice: noi gương
  rationale: Truyền đạt tự nhiên lời kêu gọi lấy người khác làm mẫu để bắt chước; dễ hiểu hơn danh từ trừu tượng “những người bắt chước” trong tiếng Việt.
- source_word: διὰ πίστεως
  choice: nhờ đức tin
  rationale: διά với sở hữu cách chỉ phương tiện hoặc cách thức; “đức tin” giữ nghĩa rộng của πίστις và cách dùng quen thuộc trong văn phong Kinh Thánh tiếng Việt.
- source_word: μακροθυμίας
  choice: lòng kiên nhẫn
  rationale: Chỉ sự kiên nhẫn bền lâu trong khi chờ đợi; cách diễn đạt hiện đại và không đồng nhất hoàn toàn với thuật ngữ ὑπομονή.
- source_word: κληρονομούντων
  choice: thừa hưởng
  rationale: Giữ hình ảnh nhận phần thừa kế của κληρονομέω; cấu trúc “những người… mà thừa hưởng” diễn đạt tự nhiên lực đặc trưng của phân từ hiện tại.
- source_word: τὰς ἐπαγγελίας
  choice: các lời hứa
  rationale: Giữ rõ dạng số nhiều của nguyên văn và sự liên hệ với các lời hứa của Đức Chúa Trời trong thư Hê-bơ-rơ.
- source_word: ἵνα μὴ
  choice: để… không
  rationale: Giữ quan hệ mục đích hoặc kết quả với lời khuyên ở câu trước bằng cấu trúc tiếng Việt tự nhiên.
theological_decisions:
- issue: Sắc thái của πίστις trong lời khuyên này
  choice: đức tin
  alternative: lòng tin; sự trung tín
  rationale: “Đức tin” bảo toàn phạm vi nghĩa thần học và tính nhất quán của πίστις. Trong ngữ cảnh, từ này có thể nhấn mạnh lòng tin cậy nơi Đức Chúa Trời, còn “sự trung tín” là một sắc thái từ vựng có thể có nhưng không nên được áp đặt vào chính văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Anh chị em” làm rõ đối tượng số nhiều hàm ẩn trong động từ Hy Lạp và phù hợp lối xưng hô cộng đồng; “noi gương” tự nhiên hơn cách dịch danh từ sát chữ. Dấu chú thích [a] được đặt ngay sau cụm từ có phương án dịch khác.
