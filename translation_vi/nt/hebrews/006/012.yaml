  - severity: low
    issue: Chú thích hiện tại nêu các từ rời thay vì phương án dịch trực tiếp cho cụm từ.
    rationale: 'Việc nêu “Hoặc: ‘nhờ sự trung tín và lòng kiên nhẫn’” cho người đọc thấy rõ phương án thay thế của cụm διὰ πίστεως καὶ μακροθυμίας, đồng thời vẫn bảo toàn tính không chắc chắn về sắc thái của πίστις.'
