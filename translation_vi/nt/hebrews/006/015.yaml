  yaml_path: translation/nt/hebrews/006/015.yaml
  text: And so[a], after waiting patiently, he obtained the promise.
translation:
  language: vi
  text: Và như thế, sau khi kiên nhẫn chờ đợi, ông đã nhận được lời hứa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “đã nhận được điều đã hứa.” Động từ Hy Lạp có thể mang nghĩa “đạt được” hoặc “nhận được”; cách nói sát chữ là “đạt được lời hứa.”'
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ οὕτως
  choice: Và như thế
  rationale: Giữ liên từ nối với phần nói về Áp-ra-ham ngay trước đó, đồng thời diễn đạt sắc thái cách thức/kết quả của οὕτως bằng tiếng Việt tự nhiên.
- source_word: μακροθυμήσας
  choice: sau khi kiên nhẫn chờ đợi
  rationale: Phân từ aorist chỉ sự nhẫn nại kéo dài trong lúc trông đợi; cấu trúc thời gian “sau khi” phù hợp với mạch kể và dễ hiểu trong tiếng Việt hiện đại.
- source_word: ἐπέτυχεν
  choice: đã nhận được
  rationale: Diễn đạt việc đạt tới hoặc có được điều được nói đến. “Nhận được” tự nhiên trong ngữ cảnh lời hứa, nhưng không tự nó khẳng định rằng mọi phương diện của lời hứa đã hoàn toàn ứng nghiệm.
- source_word: τῆς ἐπαγγελίας
  choice: lời hứa
  rationale: Giữ danh từ số ít và mối liên hệ từ vựng với lời Đức Chúa Trời hứa trong văn cảnh, thay vì diễn giải ngay thành nội dung đã được hứa.
theological_decisions:
- issue: Cụm ἐπέτυχεν τῆς ἐπαγγελίας có nói Áp-ra-ham nhận sự ứng nghiệm trọn vẹn hay nhận được lời hứa hay không.
  choice: “đã nhận được lời hứa,” không xác định là sự ứng nghiệm trọn vẹn
  alternative: “đã nhận được điều được hứa” hoặc “đã đạt được lời hứa”
  rationale: Nguyên văn dùng danh từ “lời hứa,” có thể hướng đến chính lời hứa hoặc nội dung được hứa tùy văn cảnh. Bản dịch giữ cách nói này để không giải quyết thay cho bản văn sự căng thẳng thần học trong thư Hê-bơ-rơ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “ông” tiếp nối Áp-ra-ham trong văn cảnh. “Kiên nhẫn chờ đợi” làm rõ sự nhẫn nại kéo dài mà không thêm một kết luận giáo lý.
