source:
  edition: SBLGNT
  text: καὶ καλὸν γευσαμένους θεοῦ ῥῆμα δυνάμεις τε μέλλοντος αἰῶνος,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/005.yaml
  text: and have tasted the good word of God and the powers of the coming age[b][a],
translation:
  language: vi
  text: và đã nếm biết lời tốt lành của Đức Chúa Trời cùng các quyền năng của thời đại sắp đến[a][b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “thời đại sẽ đến.”
    reason: lexical_alternative
  - marker: b
    text: “Các quyền năng” cũng có thể được hiểu là “các phép lạ” hoặc “những việc quyền năng.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καλὸν
  choice: tốt lành
  rationale: Bổ nghĩa cho ῥῆμα, từ này diễn tả lời của Đức Chúa Trời là tốt và đem lại ích lợi; “tốt lành” tự nhiên, trang trọng và giữ được sắc thái đánh giá.
- source_word: γευσαμένους
  choice: đã nếm biết
  rationale: Giữ hình ảnh ẩn dụ “nếm” đồng thời dùng cách nói tiếng Việt tự nhiên cho việc trực tiếp trải nghiệm; không xác định mức độ trải nghiệm.
- source_word: θεοῦ ῥῆμα
  choice: lời ... của Đức Chúa Trời
  rationale: ῥῆμα có thể chỉ lời nói hoặc điều được phán; cách dịch này rõ ràng, quen thuộc và giữ θεοῦ theo nghĩa nguồn gốc hoặc sở hữu.
- source_word: δυνάμεις
  choice: các quyền năng
  rationale: Dạng số nhiều có thể chỉ quyền năng hoặc những biểu hiện đầy quyền năng, kể cả phép lạ; “các quyền năng” giữ phạm vi nghĩa rộng và sự mơ hồ của nguyên văn.
- source_word: τε
  choice: cùng
  rationale: Nối δυνάμεις với đối tượng đứng trước một cách tự nhiên trong tiếng Việt.
- source_word: μέλλοντος αἰῶνος
  choice: của thời đại sắp đến
  rationale: Giữ quan hệ sở hữu/bổ nghĩa với “các quyền năng” và ý hướng về thời đại tương lai mang tính cánh chung.
theological_decisions:
- issue: Ý nghĩa của γευσαμένους trong phân đoạn cảnh báo
  choice: Dịch “đã nếm biết” mà không thêm ý trải nghiệm trọn vẹn hoặc chỉ nếm sơ qua.
  alternative: “đã trải nghiệm”; “chỉ mới nếm thử”
  rationale: Cách dịch giữ ẩn dụ của nguyên văn và không tự giải quyết tranh luận thần học về mức độ dự phần của những người được nói đến.
- issue: Phạm vi nghĩa của δυνάμεις trong bối cảnh cánh chung
  choice: Dịch “các quyền năng”.
  alternative: “các phép lạ”; “những việc quyền năng”
  rationale: Cụm từ có thể nói đến các biểu hiện kỳ diệu của quyền năng thuộc thời đại sắp đến, nhưng cũng có thể rộng hơn; cách dịch này bảo tồn sự mở nghĩa.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Câu là phần tiếp nối cú pháp của Hê-bơ-rơ 6:4–6 nên giữ chữ đầu thường và dấu phẩy cuối. Các chú thích được đặt ngay sau cụm từ liên quan.
