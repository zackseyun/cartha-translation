  source_fidelity: 'Bản dịch giữ đúng cấu trúc tham chiếu của câu: người được nói đến “đã nếm biết” (γευσαμένους) “lời tốt lành của Đức Chúa Trời” (καλὸν ... θεοῦ ῥῆμα) và “các quyền năng của thời đại sắp đến” (δυνάμεις ... μέλλοντος αἰῶνος). “Nếm biết” bảo tồn hình ảnh nếm/trải nghiệm mà không quyết định mức độ dự phần. “Các quyền năng” không thu hẹp δυνάμεις thành phép lạ.'
  naturalness: Câu văn tự nhiên trong văn phong Kinh Thánh tiếng Việt hiện đại, trang trọng mà dễ hiểu. “Lời tốt lành của Đức Chúa Trời” và “thời đại sắp đến” là các kết hợp từ ngữ rõ ràng. Chữ thường đầu câu và dấu phẩy cuối phù hợp vì đây là thành phần tiếp nối câu dài ở Hê-bơ-rơ 6:4–6.
  terminology: “Đức Chúa Trời” nhất quán với thuật ngữ Kitô giáo tiếng Việt phổ biến. “Lời,” “quyền năng,” và “thời đại sắp đến” phản ánh thuật ngữ nguồn mà không áp đặt cách giải thích giáo phái. Các chú thích nêu đúng những khả năng từ vựng thay thế, và các ký hiệu [a], [b] có mặt đầy đủ.
