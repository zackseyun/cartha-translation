  rationale: Bản sửa chỉ bỏ danh xưng không có trong nguyên văn và điều chỉnh lại thứ tự dấu chú thích để [a] gắn với “vì chúng ta”, còn [b] gắn với cụm “theo ban Mên-chi-xê-đéc”. “Sau khi đã trở nên” phản ánh phân từ γενόμενος như tình trạng/chức vụ có trước hoặc đi kèm việc vào, không diễn giải thành một tuyên bố về bản tính của Giê-su.
