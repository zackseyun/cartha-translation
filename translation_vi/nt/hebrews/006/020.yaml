  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὅπου πρόδρομος ὑπὲρ ἡμῶν εἰσῆλθεν Ἰησοῦς, κατὰ τὴν τάξιν Μελχισέδεκ ἀρχιερεὺς γενόμενος εἰς τὸν αἰῶνα.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/020.yaml
  text: where Jesus has entered as a forerunner on our behalf[b][a], having become a high priest forever according to the order of Melchizedek.
translation:
  language: vi
  text: nơi Giê-su đã vào vì chúng ta với tư cách là Đấng đi trước, sau khi đã trở nên thầy tế lễ thượng phẩm đời đời theo ban Mên-chi-xê-đéc.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “thay mặt chúng ta.” Cụm từ Hy Lạp chỉ hành động vì lợi ích của người khác; tại đây, cụm từ nhấn mạnh việc Giê-su vào đó với tư cách đại diện cho chúng ta.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “theo trật tự Mên-chi-xê-đéc.” Cụm từ này vọng lại Thi Thiên 110:4.'
    reason: cross_reference
lexical_decisions:
- source_word: ὅπου
  choice: nơi
  rationale: Liên kết tự nhiên với nơi ở phía trong bức màn trong câu trước, giữ nguyên nghĩa chỉ địa điểm.
- source_word: πρόδρομος
  choice: Đấng đi trước
  rationale: Diễn đạt tự nhiên hình ảnh một người vào trước để mở đường cho những người khác; cách viết hoa phù hợp vì từ này chỉ Đức Chúa Giê-su trong ngữ cảnh.
- source_word: ὑπὲρ ἡμῶν
  choice: vì chúng ta
  rationale: Giữ được nghĩa hành động vì lợi ích và với tư cách đại diện cho chúng ta, nhưng không áp đặt sắc thái thay thế mạnh hơn điều câu này nói rõ.
- source_word: εἰσῆλθεν
  choice: đã vào
  rationale: Phản ánh động từ aorist như một hành động đã xảy ra; ngữ cảnh tự nó cho thấy kết quả vẫn còn hiệu lực.
- source_word: Ἰησοῦς
  choice: Đức Chúa Giê-su
  rationale: Danh xưng quen thuộc, trang trọng và dễ hiểu trong tiếng Việt hiện đại.
- source_word: κατὰ τὴν τάξιν Μελχισέδεκ
  choice: theo ban Mên-chi-xê-đéc
  rationale: “Ban” là thuật ngữ Kinh Thánh tiếng Việt quen thuộc cho τάξις trong công thức trích dẫn Thi Thiên 110:4, diễn tả một trật tự hay kiểu chức tế lễ tương ứng.
- source_word: ἀρχιερεὺς
  choice: thầy tế lễ thượng phẩm
  rationale: Thuật ngữ tiếng Việt quen thuộc và chính xác cho chức vụ tư tế trung tâm trong lập luận của sách Hê-bơ-rơ.
- source_word: γενόμενος
  choice: sau khi trở nên
  rationale: Giữ rõ giá trị của phân từ và quan hệ đi trước về mặt logic với hành động vào, nói về việc đảm nhận địa vị thầy tế lễ thượng phẩm chứ không nói về nguồn gốc hiện hữu của Đức Chúa Giê-su.
- source_word: εἰς τὸν αἰῶνα
  choice: đời đời
  rationale: Cách diễn đạt trang trọng, tự nhiên và quen thuộc cho tính vĩnh viễn của chức tế lễ.
theological_decisions:
- issue: Quan hệ của γενόμενος với địa vị và bản tính của Đấng Christ
  choice: Giữ cách nói “sau khi trở nên thầy tế lễ thượng phẩm” như lời nói về việc đảm nhận chức vụ.
  alternative: “sau khi được lập làm thầy tế lễ thượng phẩm”
  rationale: Bản Hy Lạp dùng γενόμενος, không trực tiếp dùng động từ “bổ nhiệm”. Bản dịch giữ dạng diễn đạt ấy mà không khiến câu nói thành lời về sự khởi đầu hiện hữu hay biến đổi bản tính của Đức Chúa Giê-su.
- issue: Sắc thái của ὑπὲρ ἡμῶν
  choice: Dịch “vì chúng ta”, với chú thích nêu rõ sắc thái đại diện và vì lợi ích.
  alternative: “thay mặt chúng ta” hoặc “thay cho chúng ta”
  rationale: Ngữ cảnh nhấn mạnh Đức Chúa Giê-su vào trước vì lợi ích của các tín hữu. “Vì chúng ta” giữ được độ rộng của ὑπέρ và không thu hẹp câu thành một công thức chuộc tội cụ thể.
- issue: Ý nghĩa của πρόδρομος
  choice: “Đấng đi trước” hàm ý Đức Chúa Giê-su vào trước và mở đường.
  alternative: “người tiền phong”
  rationale: “Đấng đi trước” tự nhiên và trang trọng hơn, đồng thời tránh sắc thái chính trị hoặc quân sự hiện đại của “tiền phong”.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Dùng các thuật ngữ Kinh Thánh tiếng Việt quen thuộc “thầy tế lễ thượng phẩm” và “theo ban”; cấu trúc câu giữ liên hệ với câu trước. Các dấu chú thích [a], [b] đều xuất hiện trong chính văn.
