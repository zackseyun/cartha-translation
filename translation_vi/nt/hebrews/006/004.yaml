reference: Hebrews 6:4
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἀδύνατον γὰρ τοὺς ἅπαξ φωτισθέντας γευσαμένους τε τῆς δωρεᾶς τῆς ἐπουρανίου καὶ μετόχους γενηθέντας πνεύματος ἁγίου
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/004.yaml
  text: For it is impossible[a], in the case of those who were once enlightened, and who tasted the heavenly gift, and became partakers of the Holy Spirit[c][b],
translation:
  language: vi
  text: Vì đối với những người đã một lần được soi sáng[c], đã nếm ân tứ từ trời[a], và đã trở nên những người dự phần Đức Thánh Linh[b], thì không thể nào...
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “đã trải nghiệm ân tứ từ trời”; động từ theo nghĩa đen là “nếm” và có thể chỉ một trải nghiệm có thật, chứ không nhất thiết chỉ là nếm thử.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “những người chia sẻ Đức Thánh Linh” hoặc “những người tham dự vào Đức Thánh Linh.”
    reason: lexical_alternative
  - marker: c
    text: “Được soi sáng” có thể nói chung về việc nhận được ánh sáng hoặc sự dạy dỗ thuộc linh; một số người hiểu cụ thể hơn là sự hoán cải hoặc sự soi sáng gắn với phép báp-têm.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀδύνατον γὰρ
  choice: Vì không thể nào
  rationale: Giữ lực nhấn mạnh của tính từ vị ngữ Ἀδύνατον ở đầu câu và chức năng giải thích của γάρ. Câu còn tiếp sang các câu sau, nên bản dịch giữ cấu trúc chưa hoàn tất.
- source_word: ἅπαξ φωτισθέντας
  choice: đã một lần được soi sáng
  rationale: Diễn đạt phân từ thụ động quá khứ và giữ nguyên ẩn dụ về ánh sáng, không thu hẹp thành sự quy đạo hay phép báp-têm.
- source_word: γευσαμένους
  choice: đã nếm biết
  rationale: “Nếm biết” vừa giữ hình ảnh cụ thể của γεύομαι vừa tự nhiên trong tiếng Việt khi nói đến việc thực sự trải nghiệm; không hàm ý chỉ nếm thử hời hợt.
- source_word: τῆς δωρεᾶς τῆς ἐπουρανίου
  choice: ân tứ từ trời
  rationale: “Ân tứ” diễn đạt món quà được ban nhưng không xác định món quà ấy là gì; “từ trời” tự nhiên và chuyển tải phẩm tính hoặc nguồn gốc thiên thượng mà không giải thích quá mức.
- source_word: μετόχους γενηθέντας πνεύματος ἁγίου
  choice: đã trở nên những người cùng dự phần trong Đức Thánh Linh
  rationale: Giữ ý bước vào tình trạng tham dự/chia sẻ của γενηθέντας và sức nặng của μέτοχοι, đồng thời tránh quyết định trước bản chất cứu rỗi của sự dự phần ấy.
theological_decisions:
- issue: “Được soi sáng” có chỉ đích danh sự quy đạo hoặc phép báp-têm hay không
  choice: Giữ cách nói rộng “được soi sáng”
  alternative: “đã quy đạo” hoặc “đã được soi sáng qua phép báp-têm”
  rationale: Nguyên văn dùng ẩn dụ φωτίζω nhưng không xác định rõ biến cố nào; bản dịch không áp đặt một cách hiểu giáo phái.
- issue: “Nếm” có nghĩa là trải nghiệm thật hay chỉ thử qua loa
  choice: Dùng “nếm biết” và để ngỏ mức độ trải nghiệm
  alternative: “đã trải nghiệm trọn vẹn” hoặc “chỉ nếm thử”
  rationale: Trong ngữ cảnh này, γεύομαι có thể chỉ một trải nghiệm có thật, nhưng tự nó không giải quyết cuộc tranh luận về sự bội đạo và sự bền đỗ.
- issue: Mức độ tham dự được hàm ý trong μετόχους ... πνεύματος ἁγίου
  choice: “những người cùng dự phần trong Đức Thánh Linh”
  alternative: “những người được Đức Thánh Linh ngự trong lòng” hoặc cách nói nhẹ hơn như “có liên hệ với Đức Thánh Linh”
  rationale: Cách dịch trực tiếp bảo toàn sức mạnh và sự mơ hồ thần học của câu, không đồng nhất hóa cụm từ với một mô hình tín lý riêng.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại. “Nếm biết” dễ hiểu hơn lối nói thuần chữ “nếm” trong ngữ cảnh trừu tượng; “cùng dự phần” giữ sắc thái cộng hưởng và thần học của μέτοχοι. Dấu phẩy cuối câu cho thấy Hê-bơ-rơ 6:4 là phần mở đầu của một câu cú tiếp tục ở các câu sau.
