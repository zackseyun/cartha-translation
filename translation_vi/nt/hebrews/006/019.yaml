source:
  edition: SBLGNT
  text: ἣν ὡς ἄγκυραν ἔχομεν τῆς ψυχῆς, ⸀ἀσφαλῆ τε καὶ βεβαίαν καὶ εἰσερχομένην εἰς τὸ ἐσώτερον τοῦ καταπετάσματος,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/019.yaml
  text: We have this as an anchor of the soul[a], both secure and firm, and entering into the inner place behind the curtain,
translation:
  language: vi
  text: Chúng ta có niềm hy vọng ấy như chiếc neo của linh hồn, vừa bảo đảm vừa vững chắc, đi vào nơi phía sau bức màn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “đi vào nơi phía trong của bức màn” hoặc “đi vào phía trong màn che.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἣν
  choice: niềm hy vọng ấy
  rationale: Đại từ quan hệ giống cái quy chiếu về ἐλπίς (“niềm hy vọng”) ở câu trước. Tiếng Việt tự nhiên hơn khi nhắc lại danh từ, đồng thời làm rõ mối liên hệ mà không thay đổi đối tượng quy chiếu.
- source_word: ὡς ἄγκυραν
  choice: như chiếc neo
  rationale: Giữ nguyên phép so sánh và hình ảnh hàng hải bằng cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: ἔχομεν
  choice: chúng ta có
  rationale: Phản ánh trực tiếp động từ hiện tại, với cách nói phổ thông và trang trọng vừa phải.
- source_word: τῆς ψυχῆς
  choice: của linh hồn
  rationale: Giữ cấu trúc sở thuộc và giá trị từ vựng của ψυχή, không thu hẹp thành tâm trí hay diễn giải thành đời sống.
- source_word: ἀσφαλῆ
  choice: an toàn
  rationale: Diễn tả khả năng giữ cho khỏi nguy hiểm trong hình ảnh chiếc neo, đồng thời vẫn phân biệt với βεβαίαν.
- source_word: τε καὶ
  choice: vừa ... vừa
  rationale: Thể hiện rõ quan hệ tương liên giữa hai phẩm chất được phối hợp.
- source_word: βεβαίαν
  choice: vững chắc
  rationale: Diễn tả tính kiên cố, đáng tin của chiếc neo và không đồng nhất với ý ‘an toàn’ của ἀσφαλῆ.
- source_word: εἰσερχομένην
  choice: đi vào
  rationale: Phân từ giống cái quy chiếu về ‘chiếc neo’; cách diễn đạt này giữ chuyển động của hình ảnh mà vẫn tự nhiên trong tiếng Việt.
- source_word: εἰς τὸ ἐσώτερον
  choice: vào nơi phía trong
  rationale: Giữ tính từ so sánh được dùng như danh từ, chỉ khu vực ở phía trong mà không tự ý xác định là ‘nơi chí thánh’.
- source_word: τοῦ καταπετάσματος
  choice: bức màn
  rationale: Trong ngữ cảnh nơi thánh, từ này chỉ tấm màn ngăn cách. ‘Bức màn’ dễ hiểu trong tiếng Việt hiện đại và vẫn giữ hình ảnh phụng tự.
theological_decisions:
- issue: Hình ảnh phụng tự về nơi thánh trên trời
  choice: “nơi phía trong bức màn”
  alternative: “nơi phía sau bức màn” hoặc “phía trong màn che”
  rationale: Cách dịch giữ hình ảnh đền tạm/đền thờ và sắc thái không gian của cụm Hy Lạp, nhưng không giải thích vượt quá câu rằng đó chính là một khu vực cụ thể nào. Chú thích ghi nhận cách hiểu không gian tự nhiên khác.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “niềm hy vọng ấy” để nối rõ với câu trước; giữ nguyên ẩn dụ chiếc neo và hình ảnh bức màn của nơi thánh. Cấu trúc “vừa ... vừa” bảo toàn hai phẩm chất song song trong nguyên文.
