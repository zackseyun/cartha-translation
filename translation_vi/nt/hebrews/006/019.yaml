revisions:
- from: Chúng ta có niềm hy vọng ấy như chiếc neo của linh hồn, vừa an toàn vừa vững chắc, đi vào nơi phía trong bức màn.[a]
  to: Chúng ta có niềm hy vọng ấy như chiếc neo của linh hồn, vừa bảo đảm vừa vững chắc, đi vào nơi phía sau bức màn.[a]
  rationale: Sửa cách diễn đạt không gian để làm rõ, theo ngữ cảnh phụng tự, rằng nơi được nói đến ở phía trong/đằng sau bức màn, đồng thời vẫn bảo toàn tính không xác định của nguyên ngữ. Đổi “an toàn” thành “bảo đảm” để diễn đạt tự nhiên hơn tính đáng tin cậy của ἀσφαλής trong phép ẩn dụ chiếc neo. Các thành phần còn lại giữ nguyên ý nghĩa và cấu trúc của câu Hy Lạp.
