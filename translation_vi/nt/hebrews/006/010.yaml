revisions:
- from: Vì Đức Chúa Trời không bất công mà quên công việc của anh chị em và tình yêu anh chị em đã bày tỏ đối với danh Ngài[a], qua việc phục vụ những người thánh[b] trước đây và vẫn đang tiếp tục phục vụ họ[c].
  to: Vì Đức Chúa Trời không bất công đến nỗi quên công việc của anh chị em và tình yêu mà anh chị em đã bày tỏ đối với danh Ngài[a] qua việc đã phục vụ các thánh đồ[b] và vẫn đang phục vụ họ[c].
  rationale: Sửa “mà” thành “đến nỗi” để phản ánh chính xác quan hệ giữa ἄδικος và ἐπιλαθέσθαι. Thay “những người thánh” bằng “các thánh đồ” vì tự nhiên hơn trong tiếng Việt Kinh Thánh hiện đại, đồng thời giữ chú thích định nghĩa. “Đã phục vụ ... và vẫn đang phục vụ” tiếp tục phản ánh tương phản giữa phân từ aorist và hiện tại.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T21:28:04Z'
review_pass:
  verdict: revise
  source_fidelity: Bản thảo truyền đạt đúng hầu hết các yếu tố của câu Hy Lạp, gồm sự công chính của Đức Chúa Trời, công việc, tình yêu được thể hiện, và sự phục vụ đã diễn ra lẫn đang tiếp diễn. Tuy nhiên, cấu trúc “không bất công mà quên” trong tiếng Việt dễ được hiểu là đối lập “không bất công nhưng quên”, trong khi οὐ ... ἄδικος ... ἐπιλαθέσθαι có nghĩa “không bất công đến nỗi quên.”
  naturalness: Cần sửa cấu trúc phủ định để câu rõ nghĩa. “Các thánh đồ” là thuật ngữ Kinh Thánh tiếng Việt tự nhiên và chính xác hơn “những người thánh”; chú thích sẽ ngăn cách nghĩa này với khái niệm phong thánh về sau. Cụm cuối được làm gọn nhưng vẫn giữ sự phân biệt giữa hành động đã hoàn tất và hành động tiếp diễn.
  terminology: Giữ “Đức Chúa Trời,” “danh Ngài,” “công việc,” và “tình yêu.” Dùng “các thánh đồ” cho τοῖς ἁγίοις theo cách dùng Kinh Thánh Việt ngữ, với chú thích giải thích phạm vi từ này trong ngữ cảnh.
  issues:
  - severity: medium
    issue: Liên kết “không bất công mà quên” có thể đảo hoặc làm mờ quan hệ cú pháp của nguyên ngữ.
    rationale: Nguyên ngữ khẳng định Đức Chúa Trời không bất công đến mức quên, chứ không đặt “không bất công” và “quên” trong một tương phản phối hợp. Thêm “đến nỗi” giải quyết rõ nghĩa mà không thêm ý.
  - severity: low
    issue: “Những người thánh” không phải cách gọi tự nhiên nhất trong văn phong Kinh Thánh Việt ngữ hiện đại.
    rationale: “Các thánh đồ” diễn đạt tự nhiên τοῖς ἁγίοις như tên gọi cộng đồng người tin; chú thích làm rõ đây không phải một giai cấp được phong thánh.
