reference: Hebrews 6:10
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οὐ γὰρ ἄδικος ὁ θεὸς ἐπιλαθέσθαι τοῦ ἔργου ὑμῶν ⸀καὶ τῆς ἀγάπης ἧς ἐνεδείξασθε εἰς τὸ ὄνομα αὐτοῦ, διακονήσαντες τοῖς ἁγίοις καὶ διακονοῦντες.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/010.yaml
  text: For God is not unjust so as to forget your work and the love that you showed for his name in having served the saints and in continuing to serve them[a][b][c].
translation:
  language: vi
  text: Vì Đức Chúa Trời không bất công đến nỗi quên công việc của anh chị em và tình yêu mà anh chị em đã bày tỏ đối với danh Ngài[a] qua việc đã phục vụ các thánh đồ[b] và vẫn đang phục vụ họ[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “vì danh Ngài.”'
    reason: lexical_alternative
  - marker: b
    text: Tức là những người cùng tin Chúa; “các thánh đồ” ở đây chỉ dân thánh của Đức Chúa Trời, không phải một tầng lớp được phong thánh về sau.
    reason: cultural_note
  - marker: c
    text: 'Cũng có thể dịch: “bằng cách đã phục vụ các thánh đồ và vẫn tiếp tục phục vụ họ.”'
    reason: previous_rendering
lexical_decisions:
- source_word: ἄδικος
  choice: bất công
  rationale: Trong ngữ cảnh này, từ này nói rằng Đức Chúa Trời không hành động trái với công lý khi ghi nhận việc làm và tình yêu của người tin; “bất công” tự nhiên hơn “không công chính” trong tiếng Việt hiện đại.
- source_word: ἐπιλαθέσθαι
  choice: quên
  rationale: Giữ nghĩa trực tiếp của động từ, đồng thời ngữ cảnh cho thấy việc quên hàm ý không ghi nhận bằng hành động.
- source_word: τοῦ ἔργου ὑμῶν
  choice: công việc của anh chị em
  rationale: ἔργον ở số ít có nghĩa tập hợp, chỉ những việc họ đã làm; “công việc” vừa sát nghĩa vừa tự nhiên.
- source_word: τῆς ἀγάπης
  choice: tình yêu
  rationale: Cách dịch thông thường và trực tiếp của ἀγάπη; ở đây tình yêu được thể hiện cụ thể qua sự phục vụ.
- source_word: ἐνεδείξασθε
  choice: đã bày tỏ
  rationale: Diễn đạt rõ hành động làm cho tình yêu được thấy hoặc được chứng tỏ.
- source_word: εἰς τὸ ὄνομα αὐτοῦ
  choice: đối với danh Ngài
  rationale: Giữ cấu trúc hướng đến của εἰς và bảo tồn ý nghĩa Kinh Thánh của “danh”; cụm từ cũng có thể được hiểu theo nghĩa “vì danh Ngài”.
- source_word: διακονήσαντες
  choice: qua việc phục vụ ... trước đây
  rationale: Diễn đạt phân từ bất định như hành động phục vụ đã thực hiện, đồng thời làm rõ sự tương phản về thể với phân từ hiện tại tiếp theo.
- source_word: τοῖς ἁγίοις
  choice: những người thánh
  rationale: Giữ nghĩa căn bản là những người thuộc về Đức Chúa Trời và được biệt riêng cho Ngài, không gợi đến một tầng lớp được phong thánh về sau.
- source_word: διακονοῦντες
  choice: vẫn đang tiếp tục phục vụ họ
  rationale: Làm rõ tính tiếp diễn của phân từ hiện tại và bổ sung đại từ “họ” từ đối tượng đã nêu để câu tiếng Việt sáng nghĩa.
theological_decisions:
- issue: Câu này có dạy rằng con người lập công trước Đức Chúa Trời hay nói đến việc Ngài công chính ghi nhận việc làm của người tin
  choice: Giữ nguyên lời khẳng định rằng Đức Chúa Trời không bất công đến mức quên công việc và tình yêu của họ, nhưng không thêm ý rằng những việc ấy kiếm được sự cứu rỗi.
  alternative: Hiểu theo hướng công trạng mạnh hơn, như thể Đức Chúa Trời mắc nợ phần thưởng vì việc làm của con người.
  rationale: Bản Hy Lạp khẳng định công lý của Đức Chúa Trời trong việc không quên, nhưng không nói rõ rằng các việc làm tạo nên công trạng để được cứu.
translation_notes:
  register: Văn phong trang trọng, rõ ràng và hiện đại. Dùng “anh chị em” cho ὑμῶν để chỉ cộng đồng độc giả gồm cả nam lẫn nữ; dùng “Đức Chúa Trời” và đại từ kính trọng “Ngài”. Cấu trúc cuối câu làm nổi bật sự khác nhau giữa việc phục vụ đã diễn ra và việc phục vụ vẫn đang tiếp tục.
