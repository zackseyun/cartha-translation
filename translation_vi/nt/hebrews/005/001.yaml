id: HEB.5.1
reference: Hebrews 5:1
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Πᾶς γὰρ ἀρχιερεὺς ἐξ ἀνθρώπων λαμβανόμενος ὑπὲρ ἀνθρώπων καθίσταται τὰ πρὸς τὸν θεόν, ἵνα προσφέρῃ δῶρά τε καὶ θυσίας ὑπὲρ ἁμαρτιῶν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/001.yaml
  text: For every high priest[a], being taken from among men, is appointed on behalf of men in the things pertaining to God, so that he may offer both gifts and sacrifices for sins,
translation:
  language: vi
  text: Vì mỗi thượng tế, được chọn từ giữa loài người, được bổ nhiệm thay mặt loài người trong những việc liên quan đến Đức Chúa Trời, để dâng cả lễ vật lẫn sinh tế vì tội lỗi,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πᾶς
  choice: mỗi
  rationale: Danh từ số ít mang nghĩa phân phối; “mỗi thượng tế” diễn đạt tự nhiên và chính xác nhận định khái quát về chức vụ.
- source_word: γὰρ
  choice: Vì
  rationale: Liên từ nêu lý do hoặc lời giải thích hỗ trợ cho lập luận trước đó.
- source_word: ἀρχιερεὺς
  choice: thượng tế
  rationale: Thuật ngữ tiếng Việt quen thuộc và chính xác cho chức vụ tư tế tối cao của Do Thái giáo.
- source_word: ἐξ ἀνθρώπων λαμβανόμενος
  choice: được chọn từ giữa loài người
  rationale: Giữ thể bị động của phân từ; trong ngữ cảnh một người được đưa vào chức vụ, “được chọn” tự nhiên hơn cách dịch sát chữ “được lấy.” “Loài người” cũng giữ rõ ý vị thượng tế thuộc về nhân loại.
- source_word: ὑπὲρ ἀνθρώπων
  choice: thay mặt loài người
  rationale: ὑπέρ tại đây biểu thị sự đại diện và lợi ích; “thay mặt” làm rõ vai trò trung gian mà không thêm ý ngoài văn bản.
- source_word: καθίσταται
  choice: được lập lên
  rationale: Diễn đạt việc đặt một người vào chức vụ, đồng thời giữ sắc thái bị động của động từ.
- source_word: τὰ πρὸς τὸν θεόν
  choice: trong những việc liên quan đến Đức Chúa Trời
  rationale: Chuyển tải thành ngữ chỉ các công việc thờ phượng và phục vụ hướng về Đức Chúa Trời, theo lối nói tự nhiên trong tiếng Việt.
- source_word: ἵνα προσφέρῃ
  choice: hầu dâng
  rationale: “Hầu” diễn đạt ngắn gọn, trang trọng sắc thái mục đích của ἵνα với động từ giả định.
- source_word: δῶρά τε καὶ θυσίας
  choice: cả lễ vật lẫn sinh tế
  rationale: Cấu trúc “cả… lẫn…” phản ánh τε καὶ; phân biệt δῶρα là lễ vật với θυσίαι là những lễ hiến sinh.
- source_word: ὑπὲρ ἁμαρτιῶν
  choice: vì tội lỗi
  rationale: Trong bối cảnh tế lễ, cụm từ chỉ mục đích hoặc đối tượng liên hệ của việc dâng tế lễ; “vì tội lỗi” giữ được độ rộng của nguyên văn.
theological_decisions:
- issue: Ngôn ngữ đại diện trong hai lần dùng ἀνθρώπων
  choice: Dịch là “loài người” ở cả hai vị trí
  alternative: “những người nam” hoặc “người ta”
  rationale: ἄνθρωπος ở số nhiều có thể chỉ nhân loại nói chung, và trọng tâm của câu là thượng tế được chọn từ nhân loại để đại diện cho nhân loại. Tiếng Việt “loài người” giữ sự tương ứng giữa hai lần xuất hiện mà không phủ nhận thực tế lịch sử rằng chức thượng tế được người nam đảm nhiệm.
- issue: Phạm vi của ὑπὲρ ἁμαρτιῶν
  choice: “vì tội lỗi”
  alternative: “để chuộc tội”
  rationale: Nguyên văn chỉ nói các lễ được dâng ὑπέρ tội lỗi, chưa dùng chính thuật ngữ “chuộc tội.” Bản dịch tránh diễn giải cụ thể hơn mức câu Hy Lạp khẳng định.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Chúa Trời,” “thượng tế,” “lễ vật,” và “sinh tế” để bảo toàn sắc thái thờ phượng. Cấu trúc câu bám sát tiến trình lập luận của nguyên văn nhưng tránh lối diễn đạt gượng ép.
