  - severity: low
    issue: “mỗi ... đều”
    rationale: “Mỗi thượng tế” đã diễn đạt đầy đủ sắc thái phân phối của πᾶς. Thêm “đều” không sai nghĩa, nhưng không cần thiết và làm câu nặng hơn.
  revised_text: Vì mỗi thượng tế, được chọn từ giữa loài người, được bổ nhiệm thay mặt loài người trong những việc liên quan đến Đức Chúa Trời, để dâng cả lễ vật lẫn sinh tế vì tội lỗi,
