id: HEB.5.5
reference: Hebrews 5:5
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Οὕτως καὶ ὁ Χριστὸς οὐχ ἑαυτὸν ἐδόξασεν γενηθῆναι ἀρχιερέα, ἀλλ’ ὁ λαλήσας πρὸς αὐτόν· Υἱός μου εἶ σύ, ἐγὼ σήμερον γεγέννηκά σε·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/005.yaml
  text: 'So also the Messiah did not glorify himself to become high priest[a], but the one who spoke to him: “You are my Son[c][b]; today I have begotten you.”'
translation:
  language: vi
  text: 'Cũng vậy, Đấng Mê-si-a không tự tôn vinh mình để trở thành thầy tế lễ thượng phẩm, nhưng Đấng đã phán với Người đã tôn vinh Người:


    “Con là Con của Ta;


    hôm nay Ta đã sinh ra Con.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Trích Thi Thiên 2:7.
    reason: cross_reference
lexical_decisions:
- source_word: Οὕτως καὶ
  choice: Cũng vậy
  rationale: Diễn tả tự nhiên sự đối chiếu với nguyên tắc bổ nhiệm thầy tế lễ trong câu trước, đồng thời giữ sắc thái suy luận của nguyên văn.
- source_word: ὁ Χριστὸς
  choice: Đấng Mê-si
  rationale: Χριστός ở đây mang tính tước hiệu trong lập luận về chức vụ được Đức Chúa Trời bổ nhiệm; “Đấng Mê-si” truyền đạt rõ nghĩa tước hiệu cho độc giả hiện đại.
- source_word: οὐχ ἑαυτὸν ἐδόξασεν
  choice: không tự tôn vinh mình
  rationale: Giữ cấu trúc phản thân và nghĩa chính của δοξάζω là làm cho vinh hiển hoặc tôn vinh; cụm từ phù hợp với sự tương phản giữa tự đề cao và được Đức Chúa Trời chỉ định.
- source_word: γενηθῆναι ἀρχιερέα
  choice: để trở thành thầy tế lễ thượng phẩm
  rationale: Diễn đạt việc bước vào một chức vụ; “thầy tế lễ thượng phẩm” là cách gọi rõ ràng, trang trọng và quen thuộc trong văn cảnh Kinh Thánh.
- source_word: ἀλλ’ ὁ λαλήσας πρὸς αὐτόν
  choice: nhưng chính Đấng đã phán với Người
  rationale: Nguyên văn để chủ thể ở dạng hàm ẩn qua phân từ danh từ hóa. “Chính Đấng” làm rõ thế đối lập mà không thêm tên Đức Chúa Trời vào câu; “Người” chỉ Đấng Mê-si một cách trang trọng.
- source_word: Υἱός μου εἶ σύ
  choice: Con là Con của Ta
  rationale: Giữ lối xưng hô trực tiếp và sự phân biệt giữa đại từ chỉ người được phán với danh xưng “Con”; trật tự tiếng Việt tự nhiên.
- source_word: ἐγὼ σήμερον γεγέννηκά σε
  choice: ngày hôm nay Ta đã sinh ra Con
  rationale: “Sinh ra” giữ hình ảnh của γεννάω và sự căng thẳng thần học trong trích dẫn Thi Thiên 2:7, không diễn giải thành đăng quang, phục sinh hay một quan niệm thần học cụ thể.
theological_decisions:
- issue: Cách dịch Χριστός
  choice: Đấng Mê-si
  alternative: Đấng Christ
  rationale: Trong mạch văn này, từ ngữ hoạt động như một tước hiệu gắn với việc được bổ nhiệm vào chức vụ, nên “Đấng Mê-si” biểu đạt nghĩa tước hiệu trực tiếp hơn.
- issue: Ý nghĩa của câu “ngày hôm nay Ta đã sinh ra Con”
  choice: Giữ nguyên hình ảnh sinh ra của lời trích dẫn
  alternative: Diễn giải là được đăng quang, được phục sinh, hoặc được xác lập làm Con
  rationale: Nguyên văn trích Thi Thiên 2:7 nhưng tại đây không giải thích “hôm nay” hay “sinh ra” theo một hệ thống thần học cụ thể; bản dịch vì thế không nên âm thầm giải quyết sự căng thẳng ấy.
- issue: Tác nhân tôn vinh và bổ nhiệm
  choice: Giữ chủ thể là “Đấng đã phán với Người”
  alternative: Bổ sung trực tiếp “Đức Chúa Trời đã tôn vinh Người”
  rationale: Cấu trúc Hy Lạp lược bỏ động từ ở vế tương phản và nhận diện tác nhân bằng lời phán. Bản dịch giữ cách diễn đạt này để không thêm quá mức điều nguyên văn chỉ hàm ý.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đấng Mê-si” theo nghĩa tước hiệu; “thầy tế lễ thượng phẩm” duy trì thuật ngữ Kinh Thánh quen thuộc. Đại từ “Ta/Con/Người” trong lời trích và lời dẫn được viết hoa để giúp theo dõi các nhân vật, không nhằm bổ sung một kết luận thần học ngoài nguyên văn.
