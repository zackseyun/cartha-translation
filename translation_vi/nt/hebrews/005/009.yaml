  text: καὶ τελειωθεὶς ἐγένετο ⸂πᾶσιν τοῖς ὑπακούουσιν αὐτῷ⸃ αἴτιος σωτηρίας αἰωνίου,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/009.yaml
  text: and[a], having been made perfect, he became the source of eternal salvation to all who obey him[b],
translation:
  language: vi
  text: và khi đã được làm cho trọn vẹn[a], Ngài trở nên nguồn[b] của sự cứu rỗi đời đời cho tất cả những ai vâng phục Ngài,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “được làm cho hoàn hảo” hoặc “được đưa đến chỗ hoàn tất.” Từ Hy Lạp ở đây có lẽ nói đến việc Ngài được đưa tới sự hoàn tất đầy đủ trong vai trò tư tế và công cuộc cứu chuộc, chứ không phải sự cải thiện về đạo đức.'
    reason: lexical_alternative
  - marker: b
    text: “Nguồn” cũng có thể dịch là “Đấng đem lại” hoặc “nguyên nhân của” sự cứu rỗi đời đời.
    reason: lexical_alternative
lexical_decisions:
- source_word: τελειωθεὶς
  choice: khi đã được làm cho trọn vẹn
  rationale: Phân từ thụ động bất định của τελειόω chỉ việc được đưa đến mục tiêu hay sự hoàn tất. Trong ngữ cảnh Hê-bơ-rơ, cách dịch này diễn đạt sự hoàn thành vai trò tư tế và công cuộc cứu chuộc, không hàm ý Ngài từng có khiếm khuyết đạo đức.
- source_word: ἐγένετο
  choice: Ngài trở nên
  rationale: Diễn tả vai trò hoặc trạng thái kết quả sau khi được làm cho trọn vẹn; “trở nên” vừa trực tiếp vừa tự nhiên trong tiếng Việt.
- source_word: πᾶσιν τοῖς ὑπακούουσιν αὐτῷ
  choice: cho tất cả những ai vâng phục Ngài
  rationale: Giữ rõ đối tượng thụ hưởng và ý nghĩa vâng lời, thuận phục của ὑπακούω, đồng thời bảo toàn sắc thái đặc trưng hoặc tiếp diễn của phân từ hiện tại.
- source_word: αἴτιος
  choice: nguồn
  rationale: Trong câu này, αἴτιος nói đến Đấng chịu trách nhiệm tạo nên hay đem lại sự cứu rỗi. “Nguồn” diễn đạt rõ quan hệ nhân quả mà không tạo liên tưởng văn chương như “tác giả”.
- source_word: σωτηρίας
  choice: cứu rỗi
  rationale: Giữ sắc thái thần học đã được xác lập của σωτηρία trong Hê-bơ-rơ; “giải cứu” tuy khả dĩ nhưng hẹp hơn trong ngữ cảnh này.
- source_word: αἰωνίου
  choice: đời đời
  rationale: Cách diễn đạt tự nhiên, trang trọng trong tiếng Việt cho αἰώνιος khi bổ nghĩa cho sự cứu rỗi.
- source_word: καὶ
  choice: và
  rationale: Giữ liên kết đơn giản với mệnh đề trước mà không diễn giải quá mức quan hệ diễn ngôn.
theological_decisions:
- issue: Ý nghĩa của τελειωθεὶς khi nói về Chúa Giê-su
  choice: Dịch là “được làm cho trọn vẹn” để nói đến việc đạt tới sự hoàn tất về sứ mạng và vai trò.
  alternative: được làm cho hoàn hảo; được đưa đến chỗ hoàn tất
  rationale: Cách dịch bám sát hướng đích của động từ trong Hê-bơ-rơ và không ngụ ý Chúa Giê-su chuyển từ bất toàn đạo đức sang hoàn hảo.
- issue: Phạm vi và điều kiện trong πᾶσιν τοῖς ὑπακούουσιν αὐτῷ
  choice: Giữ nguyên là “cho tất cả những ai vâng phục Ngài”.
  alternative: cho tất cả những ai nghe theo Ngài
  rationale: Bản Hy Lạp nêu rõ sự vâng phục; không làm nhẹ thành chỉ “tin” cũng không mở rộng thành một hệ thống giáo lý riêng.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “Ngài” theo văn phong Kinh Thánh phổ thông; cấu trúc giữ quan hệ với ngữ cảnh trước bằng “và”. Mọi dấu chú thích đều được đặt ngay sau cụm từ liên quan.
