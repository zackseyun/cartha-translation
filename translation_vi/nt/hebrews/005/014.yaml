id: HEB.5.14
reference: Hebrews 5:14
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: τελείων δέ ἐστιν ἡ στερεὰ τροφή, τῶν διὰ τὴν ἕξιν τὰ αἰσθητήρια γεγυμνασμένα ἐχόντων πρὸς διάκρισιν καλοῦ τε καὶ κακοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/014.yaml
  text: But solid food is for the mature[b][a], who because of practice have their powers of discernment trained to distinguish both good and evil.
translation:
  language: vi
  text: Nhưng thức ăn đặc dành cho những người trưởng thành, là những người có các năng lực nhận biết[b] đã được rèn luyện nhờ thực hành thường xuyên[a] để phân biệt điều tốt và điều xấu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “nhờ thói quen” hoặc “nhờ sử dụng thường xuyên”.
    reason: lexical_alternative
  - marker: b
    text: Nguyên văn là “các giác quan”; tại đây từ này được dùng theo nghĩa ẩn dụ về các năng lực nhận biết của một người.
    reason: lexical_alternative
lexical_decisions:
- source_word: τελείων
  choice: những người trưởng thành
  rationale: Ngữ cảnh đối lập họ với trẻ thơ ở câu trước. Cách dịch này diễn đạt sự trưởng thành thuộc linh mà không hàm ý họ hoàn hảo, không còn tội lỗi.
- source_word: στερεὰ τροφή
  choice: thức ăn đặc
  rationale: Giữ nguyên hình ảnh đối lập với sữa và là cách nói tự nhiên trong tiếng Việt hiện đại.
- source_word: διὰ τὴν ἕξιν
  choice: nhờ thực hành thường xuyên
  rationale: ἕξις có thể chỉ thói quen, sự thực hành hoặc trạng thái có được nhờ sử dụng lặp đi lặp lại. Cách dịch này nêu rõ quá trình rèn luyện nhưng vẫn ghi nhận các khả năng khác trong chú thích.
- source_word: τὰ αἰσθητήρια
  choice: các năng lực nhận biết
  rationale: Từ này theo nghĩa đen chỉ các giác quan hoặc cơ quan cảm giác, nhưng tại đây được dùng theo nghĩa ẩn dụ về năng lực tri nhận để phân biệt tốt xấu.
- source_word: γεγυμνασμένα ἐχόντων
  choice: có ... đã được rèn luyện
  rationale: 'Diễn đạt trạng thái kết quả của phân từ hoàn thành bị động: họ sở hữu những năng lực đã trải qua sự rèn luyện.'
- source_word: πρὸς διάκρισιν
  choice: để phân biệt
  rationale: Diễn đạt tự nhiên ý mục đích hoặc kết quả của πρός đi với διάκρισις.
- source_word: καλοῦ τε καὶ κακοῦ
  choice: điều tốt và điều xấu
  rationale: Truyền đạt cặp đối lập về đạo đức mà không thêm nội dung diễn giải.
- source_word: δέ
  choice: Nhưng
  rationale: Thể hiện rõ sự tương phản với sữa dành cho trẻ thơ trong câu trước.
theological_decisions:
- issue: Ý nghĩa của τελείων trong bối cảnh tăng trưởng thuộc linh
  choice: những người trưởng thành
  alternative: những người hoàn hảo; những người đã lớn
  rationale: Mạch văn nói về sự trưởng thành và khả năng phân biệt đã phát triển, chứ không nhất thiết khẳng định tình trạng hoàn hảo về đạo đức. Cách dịch này tránh áp đặt quan niệm thần học về sự vô tội mà bản văn không đòi hỏi.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu giữ hình ảnh “sữa/thức ăn đặc” của ngữ cảnh, đồng thời dùng “các năng lực nhận biết” để làm sáng nghĩa ẩn dụ mà không xóa dấu vết nghĩa đen, vốn được ghi trong chú thích.
