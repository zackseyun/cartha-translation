revisions:
- from: Nhưng thức ăn đặc dành cho những người trưởng thành, là những người nhờ thực hành thường xuyên[a] mà có các năng lực nhận biết[b] đã được rèn luyện để phân biệt điều tốt và điều xấu.
  to: Nhưng thức ăn đặc dành cho những người trưởng thành, là những người có các năng lực nhận biết[b] đã được rèn luyện nhờ thực hành thường xuyên[a] để phân biệt điều tốt và điều xấu.
  rationale: Bản sửa chỉ điều chỉnh trật tự cú pháp để cụm “nhờ thực hành thường xuyên” bổ nghĩa rõ ràng cho “đã được rèn luyện”, tương ứng với cấu trúc Hy Lạp, đồng thời giữ nguyên mọi lựa chọn thuật ngữ, hình ảnh ẩn dụ, mức độ trang trọng và các chú thích từ vựng.
