revisions:
- from: Vì bất cứ ai còn dùng sữa thì chưa thông thạo lời về sự công chính[a], bởi người ấy vẫn là trẻ thơ.
  to: Vì bất cứ ai dùng sữa thì chưa có kinh nghiệm về lời về sự công chính[a], vì người ấy là trẻ thơ.
  rationale: Bỏ “còn” để không thêm sắc thái không được biểu đạt trong nguyên văn câu này; đổi “chưa thông thạo” thành “chưa có kinh nghiệm” để phản ánh sát hơn ἄπειρος. Giữ hai mệnh đề giải thích với “vì”, hình ảnh “sữa/trẻ thơ”, và chú thích về các khả năng của λόγου δικαιοσύνης.
