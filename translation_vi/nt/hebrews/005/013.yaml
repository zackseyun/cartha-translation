  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: πᾶς γὰρ ὁ μετέχων γάλακτος ἄπειρος λόγου δικαιοσύνης, νήπιος γάρ ἐστιν·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/013.yaml
  text: For everyone who partakes of milk is unskilled in the word of righteousness[b][a], for he is an infant.
translation:
  language: vi
  text: Vì bất cứ ai dùng sữa thì chưa có kinh nghiệm về lời về sự công chính[a], vì người ấy là trẻ thơ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “lời của sự công chính”, “sứ điệp về sự công chính”, hoặc hiểu “sự công chính” là “công lý”.'
    reason: Bảo lưu độ mở của cụm λόγου δικαιοσύνης và phạm vi nghĩa của δικαιοσύνη.
lexical_decisions:
- source_word: πᾶς ... ὁ μετέχων
  choice: bất cứ ai còn dùng
  rationale: Diễn đạt tự nhiên cấu trúc chỉ từng người thuộc nhóm đang dùng sữa; “còn” làm rõ nét tương phản về mức trưởng thành trong ngữ cảnh mà không biến hình ảnh thành sự lệ thuộc hoàn toàn.
- source_word: γάλακτος
  choice: sữa
  rationale: Giữ nguyên hình ảnh sữa trong phép ẩn dụ về sự non nớt.
- source_word: ἄπειρος
  choice: chưa thông thạo
  rationale: Chỉ sự thiếu kinh nghiệm hoặc năng lực thực hành, không hàm ý hoàn toàn không biết; cách nói này tự nhiên trong tiếng Việt.
- source_word: λόγου δικαιοσύνης
  choice: lời về sự công chính
  rationale: “Lời” giữ mối liên hệ với λόγος, còn “về” thể hiện cách hiểu khách thể của sở hữu cách nhưng vẫn để chú thích bảo lưu cách dịch sát và khả năng hiểu là sứ điệp.
- source_word: δικαιοσύνης
  choice: sự công chính
  rationale: Là cách dịch thần học quen thuộc và phù hợp ngữ cảnh giáo huấn, đồng thời không loại trừ sắc thái công lý được ghi ở chú thích.
- source_word: νήπιος
  choice: trẻ thơ
  rationale: Diễn tả rõ sự non nớt trong hình ảnh đối lập với người trưởng thành; trang trọng và tự nhiên hơn “em bé” trong văn cảnh này.
- source_word: γάρ ... γάρ
  choice: vì ... bởi
  rationale: Cả hai từ nối đều mang chức năng giải thích; dùng hai từ khác nhau giúp câu tiếng Việt trôi chảy mà vẫn giữ cấu trúc lập luận.
theological_decisions:
- issue: Ý nghĩa của λόγου δικαιοσύνης
  choice: lời về sự công chính
  alternative: lời của sự công chính; sứ điệp về sự công chính
  rationale: Sở hữu cách Hy Lạp có thể chỉ nội dung, tính chất hoặc mối liên hệ rộng hơn. Bản chính dùng cách diễn đạt tự nhiên nhưng chú thích bảo lưu độ mở của nguyên văn.
- issue: Cách dịch δικαιοσύνη
  choice: sự công chính
  alternative: công lý
  rationale: “Sự công chính” hợp với ngữ cảnh trưởng thành thuộc linh và giáo huấn; “công lý” là một khả năng từ vựng chính đáng nên được nêu trong chú thích.
- issue: Giống ngữ pháp trong νήπιος ... ἐστιν
  choice: người ấy vẫn là trẻ thơ
  alternative: người đó là trẻ thơ; người ấy vẫn còn non nớt
  rationale: Tiếng Việt không cần đại từ mang giống để phản ánh danh từ giống đực dùng theo nghĩa khái quát trong tiếng Hy Lạp. “Người ấy” quy chiếu rõ đến bất cứ ai mà không thêm giới tính sinh học.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Câu giữ hình ảnh sữa/trẻ thơ và quan hệ giải thích hai lớp của nguyên văn; tránh cách nói quá cổ hoặc thuật ngữ giáo phái.
