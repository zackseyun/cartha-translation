    rationale: ὁ μετέχων γάλακτος chỉ nói người dự phần/dùng sữa. Ngữ cảnh rộng có đối lập sữa và thức ăn đặc, nhưng câu này không có từ tương ứng với “còn”; nên không đưa sắc thái ấy vào bản chính.
  - severity: low
