reference: Hebrews 5:2
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: μετριοπαθεῖν δυνάμενος τοῖς ἀγνοοῦσι καὶ πλανωμένοις ἐπεὶ καὶ αὐτὸς περίκειται ἀσθένειαν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/002.yaml
  text: being able to deal gently with those who are ignorant and going astray[a], since he himself also is beset with weakness[b],
translation:
  language: vi
  text: có thể đối xử ôn hòa với những người thiếu hiểu biết và lầm lạc[a], vì chính ông cũng bị yếu đuối vây quanh[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “bị dẫn đi lầm lạc.” Phân từ Hy Lạp có thể mang sắc thái bị động.'
    reason: lexical_alternative
  - marker: b
    text: 'Dịch sát: “được sự yếu đuối bao quanh” hoặc “mặc lấy sự yếu đuối.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: μετριοπαθεῖν
  choice: đối xử ôn hòa
  rationale: Diễn tả thái độ chừng mực, kiềm chế, không khắc nghiệt cũng không thờ ơ; cách nói này tự nhiên và trang trọng trong tiếng Việt hiện đại.
- source_word: δυνάμενος
  choice: có thể
  rationale: Giữ ý về khả năng của vị thượng tế và kết nối tự nhiên với mạch mô tả đang tiếp diễn trong văn cảnh.
- source_word: τοῖς ἀγνοοῦσι
  choice: với những người thiếu hiểu biết
  rationale: Giữ lực của phân từ chỉ những người hành động trong tình trạng không biết, đồng thời tránh biến họ thành một tầng lớp cố định mang nhãn miệt thị.
- source_word: πλανωμένοις
  choice: lầm lạc
  rationale: Truyền đạt sự đi chệch đường về phương diện đạo đức hoặc thuộc linh mà không xác định quá mức tác nhân; sắc thái bị dẫn lạc được ghi ở chú thích.
- source_word: ἐπεὶ
  choice: vì
  rationale: Nêu rõ lý do vị thượng tế có thể cư xử ôn hòa, ngắn gọn và tự nhiên trong tiếng Việt.
- source_word: καὶ αὐτὸς
  choice: chính ông cũng
  rationale: Giữ cả sắc thái nhấn mạnh vào bản thân vị thượng tế lẫn ý ông cùng chung thân phận yếu đuối với những người mình phục vụ.
- source_word: περίκειται ἀσθένειαν
  choice: bị sự yếu đuối bao quanh
  rationale: Giữ khá sát hình ảnh nguồn về tình trạng yếu đuối vây bọc con người, đồng thời không thu hẹp ἀσθένεια thành riêng sự yếu đuối thể chất hay đạo đức.
theological_decisions:
- issue: Bản chất sai phạm của những người được gọi là ἀγνοοῦσι καὶ πλανωμένοις
  choice: những người thiếu hiểu biết và lầm lạc
  alternative: những người phạm tội không cố ý theo một phạm trù tế lễ chuyên biệt
  rationale: Cụm từ gợi bối cảnh chức tế lễ và có thể vang vọng các phạm trù Cựu Ước, nhưng tự thân lời Hy Lạp rộng hơn một thuật ngữ kỹ thuật. Bản dịch giữ ngôn ngữ khái quát, không áp đặt giới hạn giáo lý hẹp hơn.
- issue: Phạm vi nghĩa của ἀσθένεια nơi vị thượng tế
  choice: sự yếu đuối theo nghĩa rộng của thân phận con người
  alternative: chỉ sự yếu đuối thể chất hoặc chỉ sự yếu đuối đạo đức
  rationale: Từ này có thể bao gồm toàn bộ sự mỏng giòn và giới hạn của con người. Giữ 'sự yếu đuối' bảo toàn độ rộng và sự căng thẳng thần học của nguyên văn.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “ông” vì câu này tiếp tục nói về vị thượng tế loài người trong văn cảnh. Giữ hình ảnh “bao quanh” để phản ánh περίκειται; dấu phẩy cuối câu cho thấy đây là một phần của câu dài hơn.
