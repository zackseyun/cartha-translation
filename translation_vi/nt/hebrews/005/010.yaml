  text: having been designated by God as a high priest according to the order of Melchizedek[a][b].
translation:
  language: vi
  text: được Đức Chúa Trời gọi là thầy tế lễ thượng phẩm theo ban Mên-chi-xê-đéc.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “được Đức Chúa Trời chỉ định là thầy tế lễ thượng phẩm” hoặc “được Đức Chúa Trời tuyên xưng là thầy tế lễ thượng phẩm.”'
    reason: lexical_alternative
  - marker: b
    text: Câu này vọng lại Thi Thiên 110:4, nơi chức tế lễ được nói là “theo ban Mên-chi-xê-đéc.”
    reason: cross_reference
lexical_decisions:
- source_word: προσαγορευθεὶς
  choice: được… tuyên xưng
  rationale: Phân từ thụ động aorist của προσαγορεύω diễn tả việc Đức Chúa Trời gọi, nêu danh hoặc công bố địa vị của Chúa Giê-su. “Tuyên xưng” giữ sắc thái trang trọng và công khai mà không mặc nhiên nhấn mạnh hành vi tấn phong như “bổ nhiệm”.
- source_word: ὑπὸ τοῦ θεοῦ
  choice: được Đức Chúa Trời
  rationale: Ὑπό với sở hữu cách chỉ tác nhân trong cấu trúc thụ động. Bản văn chỉ nói “Đức Chúa Trời”, nên không thêm “Đức Chúa Cha”.
- source_word: ἀρχιερεὺς
  choice: thầy tế lễ thượng phẩm
  rationale: Cách gọi trang trọng, quen thuộc trong tiếng Việt cho chức vụ ἀρχιερεύς; tiếng Việt không cần thêm mạo từ tương ứng.
- source_word: κατὰ τὴν τάξιν
  choice: theo ban
  rationale: Trong công thức trích dẫn Thi Thiên 110:4, τάξις chỉ ban hay loại hình chức tế lễ, chứ không đơn thuần là thứ tự. “Theo ban” tự nhiên trong văn phong Kinh Thánh tiếng Việt và giữ mối liên hệ với lập luận của thư Hê-bơ-rơ.
- source_word: Μελχισέδεκ
  choice: Mên-chi-xê-đéc
  rationale: Phiên âm tên riêng theo cách dùng Kinh Thánh tiếng Việt phổ biến.
theological_decisions:
- issue: Phân từ có hàm ý thay đổi bản thể, bổ nhiệm vào chức vụ, hay sự công bố địa vị
  choice: được Đức Chúa Trời tuyên xưng là thầy tế lễ thượng phẩm
  alternative: được Đức Chúa Trời gọi là thầy tế lễ thượng phẩm; được Đức Chúa Trời bổ nhiệm làm thầy tế lễ thượng phẩm
  rationale: “Tuyên xưng” thể hiện hành động thần thượng công khai nêu danh hoặc xác nhận địa vị của Chúa Giê-su, nhưng không giải quyết quá mức câu hỏi liệu động từ tự nó có chỉ sự bổ nhiệm hay không. Chú thích bảo tồn các khả năng từ vựng.
- issue: Ý nghĩa của τάξις trong mối liên hệ với Mên-chi-xê-đéc
  choice: theo ban Mên-chi-xê-đéc
  alternative: theo phẩm trật Mên-chi-xê-đéc; theo kiểu Mên-chi-xê-đéc
  rationale: “Ban” giữ được khái niệm về một loại hình hoặc trật tự chức tế lễ và tiếng vọng của Thi Thiên 110:4, không khẳng định chi tiết về cơ cấu hay sự kế nhiệm mà bản văn không nêu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng thuật ngữ Kinh Thánh quen thuộc “thầy tế lễ thượng phẩm” và “ban Mên-chi-xê-đéc”; giữ cấu trúc phân từ thụ động để câu tiếp nối ngữ cảnh của câu trước.
