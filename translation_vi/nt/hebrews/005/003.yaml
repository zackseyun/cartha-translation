revisions:
- from: Vì sự yếu đuối ấy[a], vị ấy có bổn phận dâng lễ vật vì tội lỗi cho chính mình cũng như cho dân chúng.
  to: Vì điều đó[a], vị ấy có bổn phận dâng lễ vật vì các tội lỗi cho chính mình cũng như cho dân.
  rationale: Sửa “Vì sự yếu đuối ấy” thành “Vì điều đó” để không đưa một cách quy chiếu có khả năng cao nhưng không được nêu minh thị trong nguyên văn vào bản văn chính; chú thích bảo lưu và giải thích quy chiếu về sự yếu đuối. Điều chỉnh “dân chúng” thành “dân” cho phù hợp ngữ cảnh giao ước, và “tội lỗi” thành “các tội lỗi” để phản ánh số nhiều Hy Lạp. Không thay đổi ý nghĩa tế lễ hay cấu trúc so sánh của câu.
