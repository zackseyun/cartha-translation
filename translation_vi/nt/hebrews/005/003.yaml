source:
  edition: SBLGNT
  text: καὶ ⸂δι’ αὐτὴν⸃ ὀφείλει, καθὼς περὶ τοῦ λαοῦ, οὕτως καὶ περὶ ⸀αὑτοῦ προσφέρειν ⸀περὶ ἁμαρτιῶν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/003.yaml
  text: And because of this he is obligated[a], just as for the people, so also for himself, to offer for sins.
translation:
  language: vi
  text: Vì điều đó[a], vị ấy có bổn phận dâng lễ vật vì các tội lỗi cho chính mình cũng như cho dân.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “vì điều đó” hoặc “vì nó”; rất có thể quy chiếu về sự yếu đuối của vị thượng tế được nói ở câu trước.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δι’ αὐτὴν
  choice: Vì sự yếu đuối ấy
  rationale: Đại từ giống cái αὐτήν tự nhiên quy chiếu về ἀσθένεια, “sự yếu đuối”, ở câu trước. Tiếng Việt cần nêu lại danh từ để mối liên hệ được rõ và tự nhiên.
- source_word: ὀφείλει
  choice: có bổn phận
  rationale: Diễn đạt nghĩa vụ bắt buộc trong chức vụ tế lễ, mạnh hơn một lời khuyên nhưng vẫn trang trọng và tự nhiên.
- source_word: καθὼς ... οὕτως καὶ
  choice: cũng như
  rationale: Giữ quan hệ so sánh song song giữa việc dâng cho dân chúng và cho chính vị thượng tế, đồng thời tránh cấu trúc tiếng Việt gượng ép.
- source_word: τοῦ λαοῦ
  choice: dân chúng
  rationale: Chỉ cộng đồng giao ước trong bối cảnh chức tế lễ, nhưng không thêm cụm giải thích “Israel” vốn không có trong câu.
- source_word: περὶ αὑτοῦ
  choice: cho chính mình
  rationale: Giữ rõ nghĩa phản thân và sự tương phản với “cho dân chúng”.
- source_word: προσφέρειν
  choice: dâng lễ vật
  rationale: Động từ đứng trong ngữ cảnh tế lễ nên hàm ý hành động dâng lễ. “Lễ vật” làm câu tiếng Việt trọn nghĩa mà không giới hạn cách hiểu thành riêng một loại sinh tế.
- source_word: περὶ ἁμαρτιῶν
  choice: vì tội lỗi
  rationale: Giữ cách nói khái quát của cụm περί với sở hữu cách trong ngữ cảnh hiến tế, không diễn giải hẹp thành “lễ chuộc tội”.
theological_decisions:
- issue: Sở chỉ của δι’ αὐτὴν
  choice: Nêu rõ là “sự yếu đuối ấy”, quy chiếu về sự yếu đuối của vị thượng tế trong câu 2.
  alternative: Giữ mơ hồ hơn là “vì điều ấy” hoặc hiểu chung về chức vụ hay hoàn cảnh.
  rationale: Sự hòa hợp giống cái và tiền ngữ gần nhất ἀσθένεια hỗ trợ mạnh cho quy chiếu này; chú thích vẫn cho biết nguyên văn dùng đại từ.
- issue: Tân ngữ được hiểu ngầm của προσφέρειν
  choice: Dùng “dâng lễ vật” để thể hiện hành động tế lễ.
  alternative: Chỉ dịch “dâng” mà không nêu tân ngữ, hoặc dịch cụ thể hơn là “dâng sinh tế”.
  rationale: Bối cảnh xác định đây là việc dâng tế lễ, còn “lễ vật” đủ rộng để không áp đặt một loại của lễ cụ thể mà nguyên văn không nêu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “vị ấy” để tiếp nối vị thượng tế trong ngữ cảnh, “có bổn phận” cho nghĩa vụ tế lễ, và giữ sự song song giữa dân chúng với chính vị ấy.
