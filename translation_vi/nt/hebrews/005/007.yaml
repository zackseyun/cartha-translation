id: HEB.5.7
reference: Hebrews 5:7
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὃς ἐν ταῖς ἡμέραις τῆς σαρκὸς αὐτοῦ δεήσεις τε καὶ ἱκετηρίας πρὸς τὸν δυνάμενον σῴζειν αὐτὸν ἐκ θανάτου μετὰ κραυγῆς ἰσχυρᾶς καὶ δακρύων προσενέγκας καὶ εἰσακουσθεὶς ἀπὸ τῆς εὐλαβείας,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/007.yaml
  text: who[a], in the days of his flesh, having offered up both prayers and petitions with loud cries and tears to the one able to save him from death, and having been heard because of his reverence[b],
translation:
  language: vi
  text: Trong những ngày Ngài còn sống trong thân xác, Ngài đã dâng những lời cầu nguyện và lời khẩn xin, với tiếng kêu lớn và nước mắt, lên Đấng có thể cứu Ngài khỏi sự chết[a]; và Ngài đã được nhậm lời vì lòng thành kính của mình.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Cứu Ngài khỏi sự chết” cũng có thể được hiểu là “cứu Ngài ra khỏi sự chết,” tức là giải thoát Ngài qua sự sống lại.
    reason: alternative_reading
  - marker: b
    text: Cũng có thể dịch là “vì lòng kính sợ Đức Chúa Trời của mình.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ταῖς ἡμέραις τῆς σαρκὸς αὐτοῦ
  choice: trong những ngày sống trong xác thịt
  rationale: Giữ hình ảnh cụ thể của σάρξ và sắc thái về đời sống nhập thể, hữu hình của Chúa Giê-su, đồng thời diễn đạt tự nhiên trong tiếng Việt hiện đại.
- source_word: δεήσεις τε καὶ ἱκετηρίας
  choice: những lời cầu nguyện và khẩn xin
  rationale: Phân biệt lời cầu nguyện với lời nài xin tha thiết mà không dùng từ cổ hoặc quá chuyên môn.
- source_word: πρὸς τὸν δυνάμενον σῴζειν αὐτὸν ἐκ θανάτου
  choice: lên Đấng có thể cứu Ngài khỏi sự chết
  rationale: Phản ánh phân từ dùng như danh từ và giữ cách nói đủ rộng để có thể chỉ việc tránh khỏi cái chết hoặc được giải thoát ra khỏi sự chết.
- source_word: μετὰ κραυγῆς ἰσχυρᾶς καὶ δακρύων
  choice: với tiếng kêu lớn và nước mắt
  rationale: Truyền đạt cường độ của κραυγῆς ἰσχυρᾶς, đồng thời giữ dạng số ít của danh từ Hy Lạp.
- source_word: προσενέγκας
  choice: đã dâng
  rationale: Giữ sắc thái dâng trình, phù hợp với bối cảnh chức tế lễ trong thư Hê-bơ-rơ nhưng không cường điệu thành một thuật ngữ nghi lễ riêng biệt.
- source_word: εἰσακουσθεὶς
  choice: đã được nhậm lời
  rationale: Diễn tả việc lời khẩn cầu được nghe với sự chấp nhận, tự nhiên hơn trong văn phong Kinh Thánh tiếng Việt so với chỉ nói 'được nghe'.
- source_word: ἀπὸ τῆς εὐλαβείας
  choice: vì lòng thành kính của mình
  rationale: Thể hiện sự tôn kính và thái độ kính cẩn của Chúa Giê-su mà không thêm ý 'vâng phục' vốn không được nói trực tiếp trong từ Hy Lạp.
theological_decisions:
- issue: Phạm vi ý nghĩa của ἐκ θανάτου
  choice: cứu Ngài khỏi sự chết
  alternative: cứu Ngài ra khỏi sự chết, tức là giải thoát Ngài qua sự sống lại
  rationale: Cụm Hy Lạp có thể nói đến việc được gìn giữ khỏi chết hoặc được giải thoát từ trong sự chết; bản dịch chính không thu hẹp cách hiểu, còn chú thích nêu rõ khả năng thứ hai.
- issue: Ý nghĩa của ἀπὸ τῆς εὐλαβείας
  choice: vì lòng thành kính của mình
  alternative: vì lòng kính sợ Đức Chúa Trời của mình
  rationale: εὐλάβεια có thể chỉ lòng thành kính, sự kính sợ hoặc thái độ đạo hạnh. 'Lòng thành kính' gần nghĩa và ít diễn giải hơn, trong khi phương án truyền thống được giữ ở chú thích.
translation_notes:
  register: Tiếng Việt phổ thông hiện đại, trang trọng nhưng dễ hiểu. Dùng “Ngài” cho Chúa Giê-su và “Đấng” cho Đức Chúa Trời; giữ cấu trúc và hình ảnh của nguyên văn nhưng tránh lối diễn đạt cổ hoặc quá sát chữ.
