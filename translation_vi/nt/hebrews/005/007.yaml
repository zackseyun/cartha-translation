  source_fidelity: 'Bản dịch phản ánh đúng các thành phần chính của câu Hy Lạp: thời kỳ đời sống xác thể của Chúa Giê-su, việc dâng lời cầu nguyện và khẩn cầu, tiếng kêu lớn cùng nước mắt, Đấng có thể cứu khỏi sự chết, và việc được nhậm lời vì εὐλάβεια. Cụm “cứu Ngài khỏi sự chết” giữ được sự mơ hồ của ἐκ θανάτου; chú thích nêu khả năng được cứu ra khỏi sự chết qua sự sống lại mà không biến đó thành nghĩa duy nhất.'
  naturalness: 'Cần chỉnh nhẹ để tiếng Việt song song và tự nhiên hơn: “những lời cầu nguyện và khẩn xin” không cân xứng về mặt danh ngữ. “Những lời cầu nguyện và lời khẩn xin” rõ ràng, trang trọng và vẫn hiện đại. “Trong những ngày Ngài còn sống trong thân xác” diễn đạt tự nhiên hơn “trong những ngày sống trong xác thịt,” đồng thời tránh sắc thái không chủ ý mà “sống trong xác thịt” có thể gợi ra trong tiếng Việt tôn giáo.'
  terminology: Giữ “Ngài” cho Chúa Giê-su và “Đấng” cho Đức Chúa Trời là nhất quán. “Lòng thành kính” là cách dịch phù hợp, không thêm ý “vâng phục”; chú thích “lòng kính sợ Đức Chúa Trời” bảo tồn một khả năng từ vựng quan trọng của εὐλάβεια. “Được nhậm lời” truyền đạt tốt ý được lắng nghe thuận nhận của εἰσακουσθείς.
