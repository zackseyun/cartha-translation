id: HEB.5.6
reference: Hebrews 5:6
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καθὼς καὶ ἐν ἑτέρῳ λέγει· Σὺ ἱερεὺς εἰς τὸν αἰῶνα κατὰ τὴν τάξιν Μελχισέδεκ,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/006.yaml
  text: just as he also says in another place[b][a], “You are a priest forever according to the order of Melchizedek,”
translation:
  language: vi
  text: 'cũng như ở một chỗ khác, Ngài phán: “Con là thầy tế lễ đời đời, theo phẩm trật Mên-chi-xê-đéc.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “theo hàng Mên-chi-xê-đéc.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς καὶ
  choice: cũng như
  rationale: Diễn đạt tự nhiên công thức so sánh và liên kết câu trích dẫn này với câu trước, đồng thời giữ sắc thái của καθώς và καί.
- source_word: ἐν ἑτέρῳ
  choice: ở một chỗ khác
  rationale: Tiếng Hy Lạp nói lược là ‘trong một [chỗ] khác’; bản dịch bổ sung danh từ được hiểu ngầm để câu văn rõ và tự nhiên.
- source_word: λέγει
  choice: Ngài phán
  rationale: Giữ chủ thể ngôi thứ ba số ít và sắc thái lời Kinh Thánh như lời Đức Chúa Trời đang phán; viết hoa đại từ theo lối văn Kinh Thánh Việt ngữ trang trọng mà không thêm danh xưng không có trong nguyên văn.
- source_word: Σὺ
  choice: Con
  rationale: Giữ lời trực tiếp ở ngôi thứ hai số ít; trong ngữ cảnh Đức Chúa Trời phán với Đấng được lập làm thầy tế lễ, ‘Con’ là cách xưng hô tự nhiên và trang trọng trong tiếng Việt.
- source_word: ἱερεὺς
  choice: thầy tế lễ
  rationale: Thuật ngữ Kinh Thánh Việt ngữ quen thuộc và dễ hiểu cho chức vụ ἱερεύς.
- source_word: εἰς τὸν αἰῶνα
  choice: đời đời
  rationale: Diễn đạt thành ngữ Hy Lạp chỉ sự kéo dài vĩnh viễn bằng cách nói trang trọng, quen thuộc trong tiếng Việt.
- source_word: κατὰ τὴν τάξιν
  choice: theo phẩm ban
  rationale: ‘Phẩm ban’ biểu đạt một hàng ngũ hay thể chế tế lễ, tránh khiến ‘trật tự’ bị hiểu đơn thuần là cách sắp xếp, đồng thời bảo toàn sự phân loại thần học trong lập luận của Hê-bơ-rơ.
- source_word: Μελχισέδεκ
  choice: Mên-chi-xê-đéc
  rationale: Phiên âm tên riêng theo dạng quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
theological_decisions:
- issue: Chủ thể của công thức dẫn lời
  choice: Dịch λέγει là ‘Ngài phán’, để Đức Chúa Trời được hiểu là Đấng đang phán qua Kinh Thánh.
  alternative: ‘Kinh Thánh chép’ hoặc ‘có lời phán’
  rationale: Hê-bơ-rơ thường trình bày Kinh Thánh như lời hiện tại của Đức Chúa Trời. Cách dịch này giữ lực tu từ và thần học của động từ số ít mà không nêu đích danh chủ thể.
- issue: Ý nghĩa của τάξις trong lời trích về Mên-chi-xê-đéc
  choice: Dùng ‘phẩm ban’ để chỉ hàng ngũ hay thể chế tế lễ gắn với Mên-chi-xê-đéc.
  alternative: ‘trật tự’, ‘khuôn mẫu’ hoặc ‘cách thức’
  rationale: Trong lập luận của Hê-bơ-rơ, Thi Thiên 110:4 làm nền cho một chức tế lễ khác biệt gắn với Mên-chi-xê-đéc. ‘Phẩm ban’ giữ mối liên hệ này mà không thu hẹp τάξις thành sự giống nhau về cách thức.
- issue: Đại từ trong lời Đức Chúa Trời phán với nhân vật được xức dầu
  choice: Dùng ‘Con’.
  alternative: ‘Ngươi’ hoặc ‘Bạn’
  rationale: ‘Con’ phù hợp ngữ cảnh liền trước về lời ‘Con là Con Ta’, tự nhiên trong quan hệ người phán-người được phán với, và không làm mất việc nguyên văn chỉ dùng đại từ ngôi thứ hai.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Dùng ‘Ngài phán’ cho công thức dẫn Kinh Thánh và ‘thầy tế lễ’ theo thuật ngữ Kinh Thánh Việt ngữ quen thuộc. Dấu chú thích [a] được đặt ngay sau câu trích và giải thích phương án khác cho κατὰ τὴν τάξιν.
