id: HEB.5.12
reference: Hebrews 5:12
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ γὰρ ὀφείλοντες εἶναι διδάσκαλοι διὰ τὸν χρόνον, πάλιν χρείαν ἔχετε τοῦ διδάσκειν ὑμᾶς ⸀τινὰ τὰ στοιχεῖα τῆς ἀρχῆς τῶν λογίων τοῦ θεοῦ, καὶ γεγόνατε χρείαν ἔχοντες γάλακτος, ⸀οὐ στερεᾶς τροφῆς.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/012.yaml
  text: For although by this time you ought to be teachers[a], you again need someone to teach you the basic elements of the beginning of the oracles of God, and you have come to need milk[b], not solid food.
translation:
  language: vi
  text: Vì theo thời gian đã trôi qua, đáng lẽ anh em phải là những người dạy; thế mà anh em lại cần có người dạy mình những điều sơ đẳng đầu tiên về các lời phán của Đức Chúa Trời[a]. Anh em đã trở nên cần sữa, chứ không phải thức ăn đặc[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “những nguyên lý sơ đẳng đầu tiên của các lời phán của Đức Chúa Trời.” “Các lời phán của Đức Chúa Trời” chỉ những lời hoặc sự mặc khải đến từ Đức Chúa Trời, không phải lời sấm của ngoại giáo.'
    reason: lexical_alternative_and_cultural_note
  - marker: b
    text: “Sữa” và “thức ăn đặc” là hình ảnh chỉ sự dạy dỗ phù hợp với các mức độ trưởng thành khác nhau.
    reason: metaphor_note
lexical_decisions:
- source_word: ὀφείλοντες εἶναι
  choice: đáng lẽ anh em đã phải là
  rationale: Diễn đạt nghĩa vụ và sự trưởng thành đáng được mong đợi vào lúc này, đồng thời giữ sắc thái khiển trách mà không quá nặng tính pháp lý.
- source_word: διδάσκαλοι
  choice: người dạy dỗ
  rationale: Tự nhiên trong tiếng Việt hiện đại và chỉ những người có khả năng hướng dẫn người khác.
- source_word: διὰ τὸν χρόνον
  choice: xét theo thời gian
  rationale: Thể hiện thời gian đã trôi qua làm cơ sở cho kỳ vọng họ phải trưởng thành, thay vì chỉ nói đến một thời điểm.
- source_word: πάλιν
  choice: lại
  rationale: 'Giữ ý lặp lại hoặc thụt lùi: họ một lần nữa cần được dạy những điều nhập môn.'
- source_word: χρείαν ἔχετε τοῦ διδάσκειν ὑμᾶς
  choice: anh em lại cần có người dạy mình
  rationale: Diễn đạt tự nhiên cấu trúc động từ nguyên mẫu có mạo từ sau χρείαν ἔχετε; chủ thể không xác định được nêu là “người” để câu rõ nghĩa.
- source_word: τινὰ τὰ στοιχεῖα τῆς ἀρχῆς
  choice: những điều sơ đẳng ban đầu
  rationale: Truyền đạt các yếu tố căn bản thuộc giai đoạn khởi đầu, tránh lối dịch cứng và trùng lặp khó hiểu trong tiếng Việt.
- source_word: τῶν λογίων τοῦ θεοῦ
  choice: trong các lời phán của Đức Chúa Trời
  rationale: λόγια chỉ những lời được Đức Chúa Trời phán hoặc mặc khải, không đơn thuần là lời nói thông thường; “lời phán” vừa trang trọng vừa dễ hiểu.
- source_word: γεγόνατε χρείαν ἔχοντες
  choice: Anh em đã trở thành những người cần
  rationale: 'Giữ sắc thái hoàn thành của γεγόνατε: họ đã đi đến và hiện đang ở trong tình trạng ấy.'
- source_word: γάλακτος, οὐ στερεᾶς τροφῆς
  choice: sữa, chứ không phải thức ăn đặc
  rationale: Giữ nguyên hình ảnh tương phản của tác giả giữa thức ăn dành cho người chưa trưởng thành và thức ăn dành cho người trưởng thành.
theological_decisions:
- issue: Hình ảnh tương phản giữa sữa và thức ăn đặc
  choice: Giữ nguyên ẩn dụ mà không giải thích thành một chương trình giáo lý cụ thể.
  alternative: Diễn giải trực tiếp là “sự dạy dỗ sơ cấp” đối lập với “sự dạy dỗ cao hơn”.
  rationale: Câu Kinh Thánh dùng hình ảnh nhưng không xác định một hệ thống môn đồ hóa hay giáo lý riêng; giữ ẩn dụ bảo toàn sức tu từ và sự mở của văn bản.
- issue: Phạm vi của “các lời phán của Đức Chúa Trời”
  choice: Dịch là “các lời phán của Đức Chúa Trời” và không giới hạn vào một tập hợp văn bản cụ thể.
  alternative: Diễn giải riêng là Cựu Ước, Tin Lành, hoặc toàn bộ Kinh Thánh.
  rationale: λόγια τοῦ θεοῦ nói đến những lời phát xuất từ Đức Chúa Trời, nhưng chính câu này không xác định chính xác phạm vi quy điển hay nội dung.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh em” cho đại từ số nhiều ὑμᾶς theo lối xưng hô quen thuộc của thư tín Tân Ước. Cấu trúc được điều chỉnh để tiếng Việt tự nhiên nhưng vẫn giữ lời khiển trách, trạng thái sa sút và ẩn dụ nguyên bản.
