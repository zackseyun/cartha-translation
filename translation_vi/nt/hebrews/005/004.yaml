  terminology: “Đức Chúa Trời,” “vinh dự,” và “A-rôn” phù hợp với văn phong Kinh Thánh tiếng Việt hiện đại. Chú thích nên phản ánh mạo từ xác định τὴν, thay vì nói tiếng Hy Lạp chỉ có “vinh dự.”
  issues:
