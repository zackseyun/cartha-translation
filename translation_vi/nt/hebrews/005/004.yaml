source:
  edition: SBLGNT
  text: καὶ οὐχ ἑαυτῷ τις λαμβάνει τὴν τιμήν, ἀλλὰ καλούμενος ὑπὸ τοῦ θεοῦ, ⸀καθώσπερ καὶ Ἀαρών.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/004.yaml
  text: And no one takes this honor for himself[a], but is called by God, just as Aaron also was.
translation:
  language: vi
  text: Không ai tự nhận lấy vinh dự này[a], nhưng phải được Đức Chúa Trời kêu gọi, như A-rôn đã được kêu gọi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay “vinh dự ấy.” Tiếng Hy Lạp có mạo từ xác định: “vinh dự,” chỉ phẩm vị hoặc chức vụ tư tế được nói đến trong văn cảnh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐχ ... τις
  choice: Không ai
  rationale: 'Kết hợp phủ định với đại từ bất định được diễn đạt tự nhiên trong tiếng Việt bằng một phủ định phổ quát: “Không ai”.'
- source_word: ἑαυτῷ ... λαμβάνει
  choice: tự nhận lấy
  rationale: Diễn đạt hành vi tự mình chiếm nhận hoặc đảm nhận vinh dự, đồng thời giữ sự tương phản với việc được Đức Chúa Trời kêu gọi.
- source_word: τὴν τιμήν
  choice: vinh dự này
  rationale: τιμή trực tiếp có nghĩa là “vinh dự”; từ “này” nối với phẩm vị tư tế thượng phẩm trong văn cảnh mà không thay danh từ bằng một cách giải nghĩa hẹp hơn.
- source_word: καλούμενος ὑπὸ τοῦ θεοῦ
  choice: được Đức Chúa Trời kêu gọi
  rationale: Giữ thể bị động và xác định Đức Chúa Trời là tác nhân của sự kêu gọi; cấu trúc tiếng Việt tự nhiên và không thêm ý điều kiện “chỉ khi” vốn không được nói rõ trong tiếng Hy Lạp.
- source_word: καθώσπερ καὶ Ἀαρών
  choice: cũng như A-rôn vậy
  rationale: Giữ sắc thái so sánh và ý “cũng”; động từ được hiểu theo mệnh đề trước, đúng với lối tỉnh lược của nguyên văn.
theological_decisions:
- issue: Bản chất của việc nhận phẩm vị tư tế
  choice: Vinh dự không do một người tự nhận lấy, nhưng gắn với sự kêu gọi của Đức Chúa Trời, như trường hợp A-rôn.
  alternative: Hiểu câu này như một nguyên tắc chung về mọi loại vinh dự, không riêng phẩm vị tư tế.
  rationale: Văn cảnh Hê-bơ-rơ 5:1–5 nói về chức thượng tế. Tuy vậy, bản dịch vẫn giữ danh từ rộng “vinh dự” thay vì giải nghĩa thành “chức vụ”, nhờ đó không thu hẹp quá mức từ ngữ nguyên bản.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “Đức Chúa Trời” cho θεός và dạng tên quen thuộc “A-rôn”. Câu giữ sự đối lập cô đọng của nguyên văn, không thêm “chỉ khi”.
