    issue: Quan hệ cú pháp của mệnh đề đối lập chưa rõ
    rationale: “Không ai ... nhưng được ... kêu gọi” có thể khiến “được kêu gọi” vẫn mang chủ ngữ “không ai,” thay vì diễn đạt điều kiện/thể cách đối lập của việc nhận vinh dự. Cụm phân từ καλούμενος trong ngữ cảnh hàm ý người nhận vinh dự phải là người được Đức Chúa Trời kêu gọi.
  - severity: low
    issue: Chú thích chưa nêu tính xác định của danh từ Hy Lạp
    rationale: τὴν τιμήν có mạo từ xác định. Chú thích về phương án “vinh dự ấy” nên ghi rõ điều này.
  revised_text: Không ai tự nhận lấy vinh dự này[a], nhưng phải được Đức Chúa Trời kêu gọi, như A-rôn đã được kêu gọi.
