  verdict: revise
  source_fidelity: 'Bản dịch giữ đúng các yếu tố chính: phủ định phổ quát, hành vi tự chiếm nhận vinh dự, sự kêu gọi bởi Đức Chúa Trời, và A-rôn làm mẫu mực. Tuy nhiên, cụm “nhưng được Đức Chúa Trời kêu gọi” phối hợp trực tiếp với chủ ngữ “Không ai” dễ tạo quan hệ cú pháp không rõ trong tiếng Việt. Cần diễn đạt rõ rằng việc được Chúa kêu gọi là điều kiện đối lập với việc tự nhận lấy vinh dự. Việc nói rõ A-rôn “đã được kêu gọi” chỉ cung cấp động từ được hàm ý trong καθώσπερ καὶ Ἀαρών.'
