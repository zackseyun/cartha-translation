reference: Hebrews 5:8
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καίπερ ὢν υἱός, ἔμαθεν ἀφ’ ὧν ἔπαθεν τὴν ὑπακοήν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/008.yaml
  text: Although he was a Son[a], he learned obedience from what he suffered[b],
translation:
  language: vi
  text: Dù là Con[a], ngài vẫn học sự vâng phục từ những điều ngài đã chịu khổ[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Dù là Người Con.” Tiếng Hy Lạp chỉ ghi “Con”, không có mạo từ; tiếng Việt không buộc phải phân biệt như tiếng Anh giữa “một người con” và “Người Con”.'
    reason: alternative_reading
  - marker: b
    text: “Học sự vâng phục” nhấn mạnh việc học biết qua những đau khổ ngài đã trải qua. Câu này không giải thích thêm bản chất của sự học ấy.
    reason: lexical_alternative
lexical_decisions:
- source_word: καίπερ
  choice: Dù… vẫn
  rationale: 'Diễn đạt tự nhiên sắc thái nhượng bộ: mặc dù có địa vị là Con, ngài vẫn học sự vâng phục qua đau khổ.'
- source_word: ὢν υἱός
  choice: là Con
  rationale: Phân từ của εἰμί kết hợp với υἱός được chuyển thành mệnh đề tự nhiên trong tiếng Việt. Tiếng Việt không có mạo từ bất định tương ứng với tiếng Anh “a”; viết hoa “Con” cho thấy danh xưng chỉ về Chúa Giê-su trong ngữ cảnh.
- source_word: ἔμαθεν
  choice: học
  rationale: Giữ nghĩa trực tiếp của μανθάνω và không làm nhẹ đi lời khẳng định về việc học qua trải nghiệm.
- source_word: ἀφ’ ὧν
  choice: qua những điều
  rationale: Trong ngữ cảnh, ἀπό chỉ nguồn hoặc phương diện trải nghiệm dẫn đến việc học; “qua những điều” tự nhiên trong tiếng Việt và vẫn gắn việc học với những đau khổ đã trải qua.
- source_word: ἔπαθεν
  choice: mình đã chịu
  rationale: πάσχω nói đến những đau khổ thực sự phải chịu. Đại từ phản thân “mình” quy chiếu tự nhiên về chủ ngữ “ngài” mà không lặp nặng.
- source_word: τὴν ὑπακοήν
  choice: sự vâng phục
  rationale: Danh từ trừu tượng ὑπακοή chỉ sự đáp ứng và thuận phục ý muốn của Đức Chúa Trời; “sự vâng phục” là cách nói rõ ràng, trang trọng và tự nhiên.
theological_decisions:
- issue: Địa vị làm Con của Đấng Christ trong tương quan với việc ngài học
  choice: Dù là Con
  alternative: Dù là Người Con; Dù là Con Đức Chúa Trời
  rationale: Bản Hy Lạp chỉ có υἱός, không có mạo từ và cũng không thêm bổ ngữ “của Đức Chúa Trời”. “Con” viết hoa giữ được quy chiếu về Đấng Christ mà không bổ sung điều nguyên văn không nói rõ.
- issue: Việc “học sự vâng phục” có hàm ý trước đó bất tuân hay thiếu sót đạo đức hay không
  choice: Giữ nguyên cách nói trực tiếp “học sự vâng phục”
  alternative: học biết cái giá của sự vâng phục; trải nghiệm sự vâng phục
  rationale: Nguyên văn khẳng định ngài học sự vâng phục và không giải thích thêm. Bản dịch giữ nguyên sức căng thần học; chú thích làm rõ đây là sự học biết qua trải nghiệm đau khổ, không nhất thiết là sửa đổi một tình trạng bất tuân trước đó.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “ngài” để chỉ Chúa Giê-su và viết hoa “Con” theo quy chiếu Kitô học; giữ cấu trúc nhượng bộ cô đọng và sức căng của nguyên văn.
