  - severity: low
    issue: Chú thích b nói “chứ không hàm ý” theo cách quá loại trừ.
    rationale: Bản văn trực tiếp nói Đấng Christ “học sự vâng phục” từ điều ngài chịu; giải thích học qua trải nghiệm là hợp lý, nhưng nên trình bày là điều câu này nhấn mạnh thay vì giải quyết dứt khoát mọi suy luận thần học.
