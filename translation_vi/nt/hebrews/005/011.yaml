    issue: “phải nói” thêm sắc thái tình thái
    rationale: Cấu trúc πολὺς ἡμῖν ὁ λόγος diễn tả rằng tác giả ‘có nhiều điều để nói’, chứ không nói rằng họ bị buộc ‘phải nói’.
  - severity: medium
    issue: “chậm hiểu khi nghe” thu hẹp/chuyển nghĩa của νωθροὶ ... ταῖς ἀκοαῖς
    rationale: Nguyên ngữ mô tả tình trạng trì trệ, thiếu đáp ứng trong việc nghe/tiếp nhận sự dạy dỗ. “Chậm hiểu” dễ được hiểu là năng lực trí tuệ nói chung; “chậm chạp trong việc nghe” giữ được ẩn dụ và phạm vi của câu.
  - severity: low
    issue: Chú thích c dùng cụm “trì chậm” không tự nhiên
    rationale: Trong tiếng Việt hiện đại, “chậm chạp” hoặc “trì trệ” là cách diễn đạt chuẩn hơn.
