source:
  edition: SBLGNT
  text: Περὶ οὗ πολὺς ἡμῖν ὁ λόγος καὶ δυσερμήνευτος λέγειν, ἐπεὶ νωθροὶ γεγόνατε ταῖς ἀκοαῖς·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/011.yaml
  text: About this we have much to say[a], and it is hard to explain[c][b], since you have become dull in hearing.
translation:
  language: vi
  text: Về điều này, chúng tôi có nhiều điều để nói[a], và điều ấy khó giải thích[b], vì anh chị em đã trở nên chậm chạp trong việc nghe[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Về người này, chúng tôi có nhiều điều để nói”; đại từ Hy Lạp có thể chỉ Mên-chi-xê-đéc, dù cũng có thể chỉ rộng hơn đến vấn đề đang được bàn luận.'
    reason: alternative_reading
  - marker: b
    text: 'Cũng có thể dịch: “khó diễn giải” hoặc “khó trình bày.”'
    reason: lexical_alternative
  - marker: c
    text: Nguyên văn có ý “đã trở nên chậm chạp trong việc nghe,” tức là chậm hoặc thiếu đáp ứng khi tiếp nhận sự dạy dỗ.
    reason: lexical_alternative
lexical_decisions:
- source_word: Περὶ οὗ
  choice: Về điều này
  rationale: Đại từ quan hệ có thể chỉ Mên-chi-xê-đéc hoặc rộng hơn là vấn đề vừa được bàn đến. “Về điều này” tự nhiên trong tiếng Việt và giữ trọng tâm vào chủ đề, còn khả năng chỉ người được ghi ở chú thích.
- source_word: πολὺς ἡμῖν ὁ λόγος
  choice: chúng tôi có nhiều điều phải nói
  rationale: Diễn đạt thành ngữ cấu trúc Hy Lạp, cho thấy tác giả còn nhiều nội dung cần trình bày.
- source_word: δυσερμήνευτος λέγειν
  choice: khó giải thích
  rationale: Cụm từ nói đến sự khó khăn trong việc trình bày hoặc giảng giải cho người nghe; cách dịch này rõ ràng và tự nhiên.
- source_word: ἐπεὶ
  choice: vì
  rationale: Liên từ nêu nguyên nhân khiến chủ đề khó được giải thích.
- source_word: νωθροὶ γεγόνατε
  choice: đã trở nên chậm hiểu
  rationale: “Đã trở nên” giữ sắc thái của thể hoàn thành, cho thấy một tình trạng đã hình thành; “chậm hiểu” chuyển tải sự trì chậm, thiếu đáp ứng trong việc tiếp nhận sự dạy dỗ.
- source_word: ταῖς ἀκοαῖς
  choice: khi nghe
  rationale: Giữ hình ảnh nghe nhưng diễn đạt tự nhiên trong tiếng Việt; trong ngữ cảnh, đây là việc tiếp nhận lời dạy chứ không phải khả năng thính giác.
theological_decisions:
- issue: Đối tượng quy chiếu của Περὶ οὗ
  choice: 'Chủ yếu chỉ vấn đề đang được bàn đến: “Về điều này”'
  alternative: 'Chỉ đích thân Mên-chi-xê-đéc: “Về người này”'
  rationale: Ngữ pháp cho phép đại từ chỉ Mên-chi-xê-đéc vừa được nhắc đến, nhưng mạch văn cũng tự nhiên khi hiểu là toàn bộ chủ đề về chức tế lễ đang được triển khai. Bản dịch chính dùng cách chỉ chủ đề và chú thích bảo lưu khả năng chỉ người.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Anh chị em” diễn đạt số nhiều của đối tượng được nói đến mà không áp đặt giới tính; “chậm hiểu khi nghe” làm rõ nghĩa bóng về sự tiếp nhận lời dạy, đồng thời chú thích giữ gần hình ảnh nguyên ngữ.
