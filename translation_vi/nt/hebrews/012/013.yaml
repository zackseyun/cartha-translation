reference: Hebrews 12:13
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ τροχιὰς ὀρθὰς ⸀ποιεῖτε τοῖς ποσὶν ὑμῶν, ἵνα μὴ τὸ χωλὸν ἐκτραπῇ, ἰαθῇ δὲ μᾶλλον.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/013.yaml
  text: and make straight paths for your feet[a], so that the lame may not be turned aside[b], but rather be healed.
translation:
  language: vi
  text: Và hãy tạo những lối đi thẳng[a] cho chân anh chị em, để người què không bị lệch đi,[b] nhưng trái lại được chữa lành.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cách diễn đạt này gợi lại Châm Ngôn 4:26 và tiếp tục hình ảnh bước đi có kỷ luật trong phân đoạn.
    reason: cross_reference
  - marker: b
    text: 'Cũng có thể dịch: “không bị trẹo” hoặc “không bị trật khớp”; động từ Hy Lạp có thể mang sắc thái y khoa trong hình ảnh về thân thể ở đây.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τροχιὰς ὀρθὰς
  choice: những lối đi thẳng
  rationale: “Lối đi” diễn đạt tự nhiên hình ảnh đường mòn hay vệt đường của τροχιά, còn “thẳng” giữ ý về một hướng đi ngay thẳng, đúng hướng và tiếng vọng từ Châm Ngôn 4:26.
- source_word: ποιεῖτε
  choice: hãy làm
  rationale: Động từ mệnh lệnh hiện tại kêu gọi hành động liên tục; “hãy làm” là cách chuyển trực tiếp, rõ ràng mà không thêm ý giải thích.
- source_word: τοῖς ποσὶν ὑμῶν
  choice: cho chân anh chị em
  rationale: 'Cách dịch này hiểu cách dữ cách là chỉ lợi ích hoặc quy chiếu: những lối đi được làm thẳng cho chân của cộng đồng. “Anh chị em” diễn đạt số nhiều ὑμῶν trong lời khuyên dành cho toàn thể độc giả.'
- source_word: τὸ χωλὸν
  choice: người què yếu
  rationale: Tính từ trung tính dùng như danh từ có thể mang nghĩa khái quát hoặc tập thể. “Người què yếu” giữ hình ảnh thân thể và tính dễ tổn thương mà không xác định đó chỉ là tình trạng thể chất hay thuộc linh.
- source_word: ἐκτραπῇ
  choice: bị trệch khỏi đường
  rationale: Động từ có thể chỉ việc lệch sang bên hoặc, theo sắc thái y khoa, bị trật khớp. Bản văn chính giữ nghĩa lệch khỏi đường vì phù hợp với hình ảnh bước đi; sắc thái y khoa được nêu trong chú thích.
- source_word: ἰαθῇ
  choice: được chữa lành
  rationale: Cách dịch này giữ nghĩa thông thường của ἰάομαι và tiếp tục hình ảnh phục hồi thân thể.
- source_word: μᾶλλον
  choice: nhưng trái lại
  rationale: Cụm từ thể hiện rõ sự tương phản giữa kết quả cần tránh và kết quả chữa lành được mong muốn.
theological_decisions:
- issue: Hình ảnh què yếu mang nghĩa thể chất hay ẩn dụ
  choice: Giữ nguyên ngôn ngữ thân thể trong bản văn mà không xác định “người què yếu” chỉ là người yếu đuối thuộc linh hay người khuyết tật thể chất.
  alternative: Có thể hiểu đây là hình ảnh dành riêng cho các tín hữu yếu đuối về thuộc linh, hoặc như một hình ảnh châm ngôn khái quát về người dễ bị tổn thương.
  rationale: Nguyên văn dùng hình ảnh thân thể trong một lời khuyên đạo đức và không tự giới hạn đối tượng quy chiếu; giữ độ mở này tránh áp đặt một cách giải nghĩa thần học hẹp.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Anh chị em” làm rõ ngôi thứ hai số nhiều và giọng khuyên nhủ cộng đồng. Các hình ảnh “lối đi,” “chân,” “què yếu” và “chữa lành” được giữ nhất quán; dấu chú thích được đặt ngay sau cụm từ mà mỗi chú thích giải thích.
