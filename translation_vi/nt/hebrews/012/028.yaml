id: HEB.12.28
reference: Hebrews 12:28
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: διὸ βασιλείαν ἀσάλευτον παραλαμβάνοντες ἔχωμεν χάριν, δι’ ἧς ⸀λατρεύωμεν εὐαρέστως τῷ θεῷ μετὰ ⸂εὐλαβείας καὶ δέους⸃,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/028.yaml
  text: Therefore[a], since we are receiving an unshakable kingdom, let us have grace, through which we may serve God acceptably with reverence and awe,
translation:
  language: vi
  text: Bởi vậy, vì chúng ta đang nhận lãnh một vương quốc không thể lay chuyển, chúng ta hãy có ân điển[a], để nhờ ân điển ấy, chúng ta có thể phụng sự Đức Chúa Trời cách đẹp lòng Đức Chúa Trời, với sự tôn kính và kính sợ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “chúng ta hãy biết ơn.” Cụm Hy Lạp ἔχωμεν χάριν có thể được hiểu là “chúng ta hãy có ân điển” hoặc, theo nghĩa thành ngữ, “chúng ta hãy có lòng biết ơn” / “chúng ta hãy biết ơn.”'
    reason: alternative_reading
lexical_decisions:
- source_word: διὸ
  choice: Vì thế
  rationale: Diễn tả kết luận suy ra từ lập luận ngay trước đó về việc những gì có thể bị lay chuyển sẽ bị loại bỏ.
- source_word: βασιλείαν ἀσάλευτον
  choice: một vương quốc không thể lay chuyển
  rationale: Giữ hình ảnh đối lập với sự lay chuyển trong ngữ cảnh, đồng thời tự nhiên và rõ nghĩa trong tiếng Việt hiện đại.
- source_word: παραλαμβάνοντες
  choice: vì đang nhận lãnh
  rationale: Phân từ hiện tại nêu hoàn cảnh làm nền cho lời khuyên; “đang nhận lãnh” bảo toàn sắc thái tiến triển thay vì biến thành hành động đã hoàn tất.
- source_word: ἔχωμεν χάριν
  choice: chúng ta hãy có ân điển
  rationale: Giữ nghĩa từ vựng trực tiếp của χάρις và cho phép đại từ quan hệ theo sau chỉ về ân điển như phương tiện để phụng sự Đức Chúa Trời. Cách hiểu thành ngữ “hãy biết ơn” được ghi ở chú thích.
- source_word: δι’ ἧς
  choice: nhờ đó
  rationale: Thể hiện nghĩa phương tiện của διά với sở hữu cách và liên kết tự nhiên với “ân điển” trong tiếng Việt.
- source_word: λατρεύωμεν
  choice: chúng ta có thể phụng sự
  rationale: “Phụng sự” diễn đạt sự phục vụ mang tính tôn giáo dành cho Đức Chúa Trời mà không thu hẹp chỉ vào hành vi thờ phượng; “có thể” phù hợp với quan hệ phương tiện trong câu.
- source_word: εὐαρέστως τῷ θεῷ
  choice: phụng sự Đức Chúa Trời cách đẹp lòng Ngài
  rationale: Diễn đạt tự nhiên ý phục vụ theo cách được Đức Chúa Trời chấp nhận và hài lòng.
- source_word: μετὰ εὐλαβείας καὶ δέους
  choice: với lòng tôn kính và kính sợ
  rationale: 'Phân biệt hai sắc thái: εὐλάβεια là thái độ cung kính, thận trọng trước điều thánh; δέος là sự kính sợ trước sự uy nghiêm đáng kinh khiếp của Đức Chúa Trời.'
theological_decisions:
- issue: Nghĩa của χάριν trong ἔχωμεν χάριν
  choice: ân điển
  alternative: lòng biết ơn; hãy biết ơn
  rationale: Cú pháp kế tiếp, δι’ ἧς (“nhờ đó”), tự nhiên cho phép hiểu ân điển là phương tiện giúp cộng đồng phụng sự Đức Chúa Trời cách đẹp lòng Ngài. Tuy nhiên, cách hiểu thành ngữ là “hãy biết ơn” vẫn hợp lý và có truyền thống lâu đời, nên được bảo tồn trong chú thích thay vì bị loại bỏ.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại. “Nhận lãnh” và “phụng sự” phù hợp ngữ vực Kinh Thánh mà vẫn dễ hiểu. Bản dịch giữ cấu trúc lập luận, sắc thái hiện tại của phân từ và sự mơ hồ thật sự của χάριν; dấu chú thích [a] xuất hiện ngay sau cụm liên quan.
