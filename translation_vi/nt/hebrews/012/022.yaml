source:
  edition: SBLGNT
  text: ἀλλὰ προσεληλύθατε Σιὼν ὄρει καὶ πόλει θεοῦ ζῶντος, Ἰερουσαλὴμ ἐπουρανίῳ, καὶ μυριάσιν ἀγγέλων, πανηγύρει
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/022.yaml
  text: But you have come to Mount Zion and to the city of the living God[a], the heavenly Jerusalem, and to myriads of angels in festal gathering[b],
translation:
  language: vi
  text: Nhưng anh chị em đã đến núi Si-ôn, đến thành của Đức Chúa Trời hằng sống, tức Giê-ru-sa-lem trên trời, và đến muôn vàn thiên sứ trong đại hội mừng[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “và đến muôn vàn thiên sứ, đến đại hội mừng.” Cú pháp Hy Lạp có thể liên kết “đại hội mừng” với “thiên sứ” hoặc xem đó là một thành phần riêng trong chuỗi.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀλλὰ
  choice: Nhưng
  rationale: Diễn tả sự tương phản mạnh với việc đến gần núi Si-nai trong phần trước, đồng thời tự nhiên trong tiếng Việt.
- source_word: προσεληλύθατε
  choice: anh chị em đã đến
  rationale: Thì hoàn thành Hy Lạp chỉ một sự đến gần đã xảy ra với kết quả còn hiện hữu; “đã đến” truyền đạt tự nhiên sắc thái ấy. “Anh chị em” diễn đạt số nhiều và bao gồm toàn thể độc giả.
- source_word: Σιὼν ὄρει
  choice: đến núi Si-ôn
  rationale: Giữ nguyên hình ảnh ngọn núi và tên riêng, với giới từ “đến” phù hợp động từ προσέρχομαι.
- source_word: πόλει θεοῦ ζῶντος
  choice: đến thành của Đức Chúa Trời hằng sống
  rationale: Giữ quan hệ sở hữu của θεοῦ và danh hiệu ζῶντος; “hằng sống” là cách nói trang trọng, quen thuộc và dễ hiểu.
- source_word: Ἰερουσαλὴμ ἐπουρανίῳ
  choice: tức Giê-ru-sa-lem trên trời
  rationale: Cụm này đồng vị với “thành của Đức Chúa Trời hằng sống”; “tức” làm rõ quan hệ đồng vị, còn “trên trời” tự nhiên hơn một tính từ ghép trong tiếng Việt.
- source_word: μυριάσιν ἀγγέλων
  choice: đến muôn vàn thiên sứ
  rationale: “Muôn vàn” diễn đạt một số lượng vô cùng lớn mà không ấn định con số chính xác, phù hợp phạm vi nghĩa của μυριάς.
- source_word: πανηγύρει
  choice: đang dự hội vui
  rationale: Diễn tả một cuộc hội họp mang tính lễ hội, vui mừng; gắn với đoàn thiên sứ theo cách hiểu chính nhưng vẫn ghi nhận khả năng cú pháp khác trong chú thích.
theological_decisions:
- issue: Quan hệ cú pháp của πανηγύρει
  choice: 'Gắn với đoàn thiên sứ: “muôn vàn thiên sứ đang dự hội vui.”'
  alternative: 'Xem “hội vui” là một thành phần riêng trong chuỗi: “muôn vàn thiên sứ, đến hội vui”; hoặc gắn với “hội chúng của các con trưởng” ở câu 23.'
  rationale: Chuỗi cách dữ cho phép nhiều cách phân đoạn. Gắn πανηγύρει với cụm đứng ngay trước tạo nghĩa mạch lạc và tự nhiên, nhưng chú thích bảo tồn sự mơ hồ thực sự của nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Dùng “anh chị em” cho đại từ số nhiều nhằm tránh hiểu là số ít; dùng các tên riêng Si-ôn và Giê-ru-sa-lem theo dạng phiên âm quen thuộc. Chỉ đặt một chú thích tại điểm có sự mơ hồ cú pháp thật sự.
