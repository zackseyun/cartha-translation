  source_fidelity: Bản dịch truyền đạt đúng sự đối lập của ἀλλὰ, thì hoàn thành của προσεληλύθατε, các địa danh, và chuỗi các thực tại thiên thượng. Tuy nhiên, “đang dự hội vui” biến πανηγύρει (một danh từ cách dữ) thành một hành động đang diễn ra của các thiên sứ. Cách này diễn giải nhiều hơn nguyên văn và làm giảm tính mở của quan hệ cú pháp.
  naturalness: Văn phong nhìn chung hiện đại, trang trọng, và dễ đọc. “Muôn vàn thiên sứ trong đại hội mừng” tự nhiên và sát cấu trúc danh từ của tiếng Hy Lạp hơn “đang dự hội vui.”
  terminology: “Đức Chúa Trời hằng sống,” “Si-ôn,” “Giê-ru-sa-lem trên trời,” và “thiên sứ” nhất quán với văn phong Kinh Thánh Việt ngữ trang trọng. “Đại hội mừng” diễn đạt πανήγυρις là một cuộc hội họp/lễ hội công cộng mang tính vui mừng, không biến nó thành một nghi thức cụ thể.
  issues:
