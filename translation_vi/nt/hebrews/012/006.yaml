  yaml_path: translation/nt/hebrews/012/006.yaml
  text: For the Lord disciplines the one he loves[b][a], and he scourges every son whom he receives.
translation:
  language: vi
  text: 'Vì Chúa sửa dạy người mà Ngài yêu,

    và Ngài đánh roi mọi người con mà Ngài tiếp nhận.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὃν
  choice: người ... mà
  rationale: Cặp đại từ quan hệ chỉ một người theo nghĩa khái quát. Cách diễn đạt “người ... mà” tự nhiên trong tiếng Việt và vẫn giữ nét quy chiếu cá nhân ở số ít.
- source_word: γὰρ
  choice: Vì
  rationale: Liên từ nêu lý do cho lời khuyên ở câu trước; “Vì” giữ rõ quan hệ lập luận.
- source_word: ἀγαπᾷ
  choice: yêu
  rationale: Đây là cách dịch trực tiếp, tự nhiên của động từ ἀγαπάω.
- source_word: κύριος
  choice: Chúa
  rationale: Giữ nguyên tước hiệu thần học κύριος bằng cách gọi quen thuộc và trang trọng trong tiếng Việt.
- source_word: παιδεύει
  choice: sửa dạy
  rationale: “Sửa dạy” bao hàm cả uốn nắn và giáo huấn, phù hợp với sắc thái đào luyện có tính sửa trị của παιδεύω, thay vì chỉ diễn đạt sự trừng phạt.
- source_word: μαστιγοῖ
  choice: đánh roi
  rationale: Động từ này chỉ hành động quất hoặc đánh bằng roi. “Đánh roi” rõ nghĩa, mạnh và không làm nhẹ đi hình ảnh nghiêm khắc của nguyên văn.
- source_word: δὲ
  choice: và
  rationale: Ở đây δέ tiếp nối vế trước hơn là tạo sự tương phản mạnh; “và” phù hợp với quan hệ liên kết ấy.
- source_word: πάντα υἱὸν
  choice: mỗi người con
  rationale: Giữ danh từ chỉ quan hệ con trai/con thừa tự của υἱός bằng “người con”, đồng thời “mỗi” diễn đạt lực phân phối của πάντα. Chú thích làm rõ tính đại diện trong văn cảnh.
- source_word: παραδέχεται
  choice: tiếp nhận
  rationale: “Tiếp nhận” giữ được ý nhận lấy và thừa nhận trong mối quan hệ, phù hợp với văn cảnh về địa vị làm con.
theological_decisions:
- issue: Cách diễn đạt υἱός trong văn cảnh Chúa sửa dạy những người thuộc về Ngài
  choice: mỗi người con
  alternative: mọi con cái
  rationale: Nguyên văn dùng υἱός ở số ít và văn cảnh Hê-bơ-rơ 12 triển khai hình ảnh địa vị làm con. Bản chính giữ “người con” để bảo toàn hình ảnh ấy; chú thích nêu rõ cách nói này đại diện cho tất cả những người được Đức Chúa Trời nhìn nhận là con.
- issue: Mức độ mạnh của μαστιγοῖ khi nói về sự sửa dạy của Chúa
  choice: đánh roi
  alternative: sửa phạt nghiêm khắc
  rationale: Nguyên văn chủ ý dùng một động từ mạnh. “Đánh roi” bảo toàn hình ảnh đau đớn và giữ nguyên sự căng thẳng giữa tình yêu của Chúa với sự sửa dạy nghiêm khắc, thay vì giải thích hoặc làm nhẹ hình ảnh đó.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cấu trúc hai vế được giữ để phản ánh nhịp song song của nguyên văn; đại từ “Ngài” được thêm ở vế hai cho tự nhiên và rõ chủ thể trong tiếng Việt.
