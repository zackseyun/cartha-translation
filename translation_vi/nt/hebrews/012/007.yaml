source:
  edition: SBLGNT
  text: εἰς παιδείαν ὑπομένετε· ὡς υἱοῖς ὑμῖν προσφέρεται ὁ θεός· τίς ⸀γὰρ υἱὸς ὃν οὐ παιδεύει πατήρ;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/007.yaml
  text: Endure for discipline[a]; God is dealing with you as with sons[b]. For what son is there whom a father does not discipline?
translation:
  language: vi
  text: Hãy chịu đựng để được sửa dạy[a]. Đức Chúa Trời đối xử với anh chị em như với các con trai[b]. Vì có con trai nào mà cha không sửa dạy?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể hiểu: “Hãy xem điều anh chị em chịu đựng là sự sửa dạy,” hoặc “Anh chị em đang chịu đựng để được sửa dạy.” Cách diễn đạt Hy Lạp cho phép hiểu đây là lời khuyên nhủ hoặc lời xác nhận, và mối liên hệ với “sự sửa dạy” cũng có thể được hiểu theo hơn một cách.'
    reason: alternative_reading
  - marker: b
    text: Nguyên văn Hy Lạp là “các con trai.” Từ này phù hợp với phép loại suy cha–con trai trong lập luận; lời áp dụng không chỉ giới hạn ở nam giới.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς παιδείαν
  choice: để được sửa dạy
  rationale: Cụm này diễn đạt mục đích hoặc kết quả của việc chịu đựng, đồng thời giữ mối liên hệ với động từ παιδεύει ở cuối câu. “Sửa dạy” bao hàm cả uốn nắn và đào luyện, phù hợp ngữ cảnh cha-con.
- source_word: ὑπομένετε
  choice: Hãy chịu đựng
  rationale: Hình thức Hy Lạp có thể được hiểu là mệnh lệnh hoặc trần thuật; trong mạch văn, lời khuyên nhủ là cách hiểu tự nhiên. Không thêm một tân ngữ vốn không có trong nguyên văn.
- source_word: ὡς υἱοῖς
  choice: như với những người con trai
  rationale: Giữ phép so sánh và hình ảnh cha–con trai rõ ràng trong lập luận, thay vì trung hòa thành “con cái.”
- source_word: προσφέρεται
  choice: đối xử với
  rationale: Trong ngữ cảnh này, động từ mang nghĩa thành ngữ về cách Đức Chúa Trời cư xử với họ; “đối xử với” là tự nhiên và chính xác trong tiếng Việt hiện đại.
- source_word: τίς γὰρ υἱὸς
  choice: Vì có người con trai nào
  rationale: Diễn đạt tự nhiên câu hỏi tu từ, đồng thời bảo toàn danh từ giống đực và phép loại suy cha–con trai.
- source_word: ὃν οὐ παιδεύει πατήρ
  choice: mà cha không sửa dạy
  rationale: “Sửa dạy” giữ liên kết từ vựng với παιδεία ở đầu câu. Mạo từ sở hữu “cha mình” không được thêm vì nguyên văn chỉ nói πατήρ, “cha.”
theological_decisions:
- issue: Ngôn ngữ gia đình có giới tính trong phép loại suy cha–con trai
  choice: Giữ “những người con trai” và “người con trai” trong chính văn
  alternative: “con cái” hoặc “người con”
  rationale: Lập luận dùng hình ảnh cụ thể về người cha và con trai. Giữ hình ảnh ấy phản ánh chính xác nguyên văn; chú thích làm rõ rằng lời áp dụng không chỉ dành cho nam giới.
- issue: Tính chất của παιδεία
  choice: Dịch là “sửa dạy”
  alternative: “kỷ luật” hoặc “rèn luyện”
  rationale: “Sửa dạy” giữ được cả sắc thái uốn nắn lẫn giáo dưỡng mà không thu hẹp hành động của Đức Chúa Trời thành hình phạt đơn thuần.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại, dùng “anh chị em” để chỉ cộng đồng độc giả. “Chịu đựng” giữ sắc thái bền lòng dưới nghịch cảnh; “sửa dạy” tự nhiên hơn “thi hành kỷ luật” và bảo toàn ý nghĩa giáo dưỡng. Câu hỏi cuối được diễn đạt gọn theo cú pháp tiếng Việt.
