id: HEB.12.29
reference: Hebrews 12:29
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ γὰρ ὁ θεὸς ἡμῶν πῦρ καταναλίσκον.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/029.yaml
  text: For our God is a consuming fire[a][b].
translation:
  language: vi
  text: Vì Đức Chúa Trời của chúng ta là ngọn lửa thiêu nuốt.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Câu này gợi lại Phục Truyền Luật Lệ Ký 4:24, nơi Đức Chúa Trời được mô tả là “ngọn lửa thiêu nuốt.”
    reason: cross_reference
  - marker: b
    text: 'Cũng có thể dịch: “ngọn lửa thiêu hủy.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ γὰρ
  choice: Vì
  rationale: γὰρ nối câu này với lời cảnh báo và khuyên nhủ ngay trước đó bằng ý giải thích hoặc nêu lý do; καὶ được hòa vào mạch văn thay vì dịch riêng, để tiếng Việt tự nhiên.
- source_word: ὁ θεὸς ἡμῶν
  choice: Đức Chúa Trời của chúng ta
  rationale: Giữ rõ ý sở hữu và tính cộng đồng của cụm Hy Lạp, đồng thời dùng cách gọi trang trọng, quen thuộc trong văn phong Kinh Thánh tiếng Việt.
- source_word: πῦρ
  choice: ngọn lửa
  rationale: Dịch trực tiếp danh từ chỉ lửa và giữ nguyên hình ảnh ẩn dụ cùng âm vang từ Phục Truyền Luật Lệ Ký 4:24.
- source_word: καταναλίσκον
  choice: thiêu nuốt
  rationale: Phân từ hiện tại diễn tả ngọn lửa có tác dụng tiêu hủy hoàn toàn. “Thiêu nuốt” vừa tự nhiên trong tiếng Việt vừa giữ sức mạnh của hình ảnh; chú thích nêu cách diễn đạt thay thế sát cấu trúc động từ hơn.
theological_decisions:
- issue: Cách mô tả Đức Chúa Trời bằng hình ảnh lửa
  choice: 'Giữ phép ẩn dụ trực tiếp: “Đức Chúa Trời của chúng ta là ngọn lửa thiêu nuốt”'
  alternative: “Đức Chúa Trời của chúng ta giống như ngọn lửa thiêu nuốt” hoặc “là ngọn lửa thiêu hủy”
  rationale: Câu Hy Lạp dùng cấu trúc đồng nhất, không có dấu hiệu so sánh. Giữ phép ẩn dụ trực tiếp bảo toàn sức nặng cảnh báo và mối liên hệ với Phục Truyền Luật Lệ Ký 4:24, không làm nhẹ câu thành phép so sánh.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Câu ngắn giữ nguyên tính súc tích, mạnh mẽ của nguyên văn; “Vì” thể hiện quan hệ giải thích với câu trước.
