base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/021.yaml
  text: And so terrifying was the sight that Moses said[b][a], “I am fearful and trembling.”
translation:
  language: vi
  text: 'Cảnh tượng ấy[a] kinh khiếp đến nỗi Môi-se nói: “Tôi vô cùng sợ hãi và run rẩy.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “điều hiện ra” hoặc “quang cảnh ấy.” Cụm từ Hy Lạp chỉ điều được thấy hoặc hiện ra trong cảnh tượng tại Si-nai.
    reason: lexical_alternative
  - marker: b
    text: Câu này không phải là lời trích nguyên văn từ Cựu Ước, nhưng phản ánh phản ứng sợ hãi của Môi-se gắn với biến cố Si-nai; so sánh Phục Truyền Luật Lệ Ký 9:19.
    reason: cross_reference
lexical_decisions:
- source_word: καί, οὕτω
  choice: đến nỗi
  rationale: Trong mạch câu tiếp nối từ câu trước, kết cấu này diễn tả mức độ dẫn đến lời phản ứng của Môi-se; tiếng Việt tự nhiên không cần dịch καί bằng một liên từ riêng.
- source_word: φοβερὸν
  choice: kinh khiếp
  rationale: Diễn tả tính chất gây nỗi sợ hãi dữ dội của sự hiện ra tại Si-nai, bằng từ ngữ hiện đại và trang trọng.
- source_word: τὸ φανταζόμενον
  choice: cảnh tượng ấy
  rationale: Danh hóa điều đang hiện ra trước mắt; “cảnh tượng” giữ trọng tâm thị giác và phù hợp ngữ cảnh, nhưng các khả năng sát chữ hơn được ghi ở chú thích.
- source_word: Μωϋσῆς εἶπεν
  choice: Môi-se nói
  rationale: Dùng dạng tên quen thuộc trong tiếng Việt và dịch trực tiếp động từ tường thuật.
- source_word: Ἔκφοβός εἰμι
  choice: Tôi vô cùng sợ hãi
  rationale: ἔκφοβος chỉ trạng thái hết sức kinh sợ; “vô cùng” truyền đạt cường độ của từ.
- source_word: καὶ ἔντρομος
  choice: và run rẩy
  rationale: Giữ riêng nét nghĩa về phản ứng run rẩy, không gộp hai tính từ Hy Lạp thành một cách diễn đạt duy nhất.
theological_decisions:
- issue: Mối liên hệ của lời Môi-se với trình thuật Si-nai trong Cựu Ước
  choice: Trình bày thẳng lời này như phản ứng của Môi-se trước cảnh tượng kinh khiếp, đồng thời chú thích vấn đề liên văn bản.
  alternative: Xem đây chỉ là lời tóm lược tự do về nỗi sợ của Môi-se dựa trên truyền thống Si-nai.
  rationale: Bản văn gán trực tiếp lời nói cho Môi-se, nhưng câu chữ không phải là trích dẫn nguyên văn từ Cựu Ước còn tồn tại; bản dịch giữ cả khẳng định của câu và sự căng thẳng liên văn bản mà không cưỡng ép dung hòa.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Cấu trúc “kinh khiếp đến nỗi” tự nhiên hơn lối đảo cú pháp của tiếng Hy Lạp; “vô cùng sợ hãi và run rẩy” bảo toàn hai ý song song trong lời Môi-se.
