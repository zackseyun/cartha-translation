id: HEB.12.27
reference: Hebrews 12:27
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: τὸ δὲ Ἔτι ἅπαξ δηλοῖ ⸂τῶν σαλευομένων⸃ μετάθεσιν ὡς πεποιημένων, ἵνα μείνῃ τὰ μὴ σαλευόμενα.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/027.yaml
  text: This phrase, “Yet once more,” indicates the removal of the things being shaken—as things that have been made—so that the things not being shaken may remain.
translation:
  language: vi
  text: 'Cụm từ “Còn một lần nữa” cho thấy việc loại bỏ những gì đang bị lay chuyển—như những thứ đã được tạo nên[a]—để những gì không bị lay chuyển[b] còn lại.


    [a] Cũng có thể dịch: “vì chúng là những thứ đã được tạo nên.” Tiếng Hy Lạp nói sát nghĩa là “như những thứ đã được làm nên.”


    [b] Cũng có thể dịch: “những gì không thể bị lay chuyển” hoặc “những gì không lay chuyển được.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “vì chúng là những thứ đã được tạo nên.” Tiếng Hy Lạp nói sát nghĩa là “như những thứ đã được làm nên.”'
    reason: Nêu khả năng ὡς mang sắc thái nguyên nhân, đồng thời cho biết cách diễn đạt sát chữ của phân từ hoàn thành bị động πεποιημένων mà không thu hẹp đối tượng thành các vật thể cụ thể.
  - marker: b
    text: 'Cũng có thể dịch: “những gì không thể bị lay chuyển” hoặc “những gì không lay chuyển được.”'
    reason: Ghi nhận cách hiểu theo khả năng được ngữ cảnh hỗ trợ, trong khi thân văn duy trì hình thức “không bị lay chuyển” của τὰ μὴ σαλευόμενα.
lexical_decisions:
- source_word: τὸ δὲ Ἔτι ἅπαξ
  choice: Cụm từ “Còn một lần nữa”
  rationale: Mạo từ giống trung τὸ danh từ hóa lời trích dẫn, nên “cụm từ” diễn đạt rõ rằng tác giả đang giải thích chính lời ấy. δέ chỉ có lực nối nhẹ và không cần chuyển thành một từ mở đầu riêng trong tiếng Việt.
- source_word: δηλοῖ
  choice: cho thấy
  rationale: Cách dịch tự nhiên, hiện đại, phù hợp với việc tác giả rút ra ý nghĩa từ cụm từ vừa trích.
- source_word: τῶν σαλευομένων
  choice: những gì đang bị lay chuyển
  rationale: Giữ thể bị động và sắc thái đang diễn ra của phân từ hiện tại, đồng thời tạo thế đối xứng với τὰ μὴ σαλευόμενα.
- source_word: μετάθεσιν
  choice: việc loại bỏ
  rationale: Trong ngữ cảnh, từ này chỉ sự dời bỏ hay cất đi, không chỉ một sự thay đổi chung chung.
- source_word: ὡς πεποιημένων
  choice: là những vật đã được tạo nên
  rationale: Giữ ý các sự vật ấy thuộc phạm trù những gì đã được làm nên. Dấu gạch ngang giúp thể hiện quan hệ giải thích mà không biến nó quá dứt khoát thành quan hệ nguyên nhân.
- source_word: ἵνα μείνῃ
  choice: để ... còn lại
  rationale: Diễn đạt tự nhiên mục đích hoặc kết quả được nêu bởi ἵνα với thể giả định.
- source_word: τὰ μὴ σαλευόμενα
  choice: những gì không bị lay chuyển
  rationale: Bám sát cấu trúc phủ định của phân từ và duy trì sự đối xứng với “những gì đang bị lay chuyển,” thay vì thêm rõ ý khả năng vốn không được phát biểu trực tiếp trong câu này.
theological_decisions:
- issue: Có nên dịch τὰ μὴ σαλευόμενα theo nghĩa diễn giải là “những gì không thể bị lay chuyển” hay sát cấu trúc hơn là “những gì không bị lay chuyển”
  choice: những gì không bị lay chuyển
  alternative: những gì không thể bị lay chuyển
  rationale: Bản dịch được chọn giữ nguyên sự tương phản giữa hai phân từ trong câu và không vội đồng nhất cách nói này với “vương quốc không thể lay chuyển” ở câu kế tiếp. Cách hiểu theo khả năng vẫn được ghi ở chú thích.
- issue: Quan hệ của ὡς πεποιημένων với “những gì đang bị lay chuyển”
  choice: là những vật đã được tạo nên
  alternative: vì chúng là những vật đã được tạo nên
  rationale: Cách dịch chính giữ sắc thái mô tả/phân loại của ὡς và tránh quyết định hoàn toàn rằng đây là mệnh đề nguyên nhân; cách hiểu nguyên nhân được nêu trong chú thích.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại, dùng “cụm từ” để người đọc phổ thông theo dõi lập luận giải kinh của tác giả. “Lay chuyển” duy trì hình ảnh xuyên suốt ngữ cảnh. Cấu trúc gạch ngang bảo tồn quan hệ hơi cô đọng và có phần mơ hồ của ὡς πεποιημένων.
