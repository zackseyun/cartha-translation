  text: ἐπισκοποῦντες μή τις ὑστερῶν ἀπὸ τῆς χάριτος τοῦ θεοῦ, μή τις ῥίζα πικρίας ἄνω φύουσα ἐνοχλῇ καὶ ⸂δι’ αὐτῆς⸃ μιανθῶσιν ⸀πολλοί,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/015.yaml
  text: watching carefully lest anyone fall short of the grace of God[a], lest any root of bitterness springing up cause trouble, and through it many be defiled[b],
translation:
  language: vi
  text: Hãy coi chừng, kẻo có ai hụt mất ân điển của Đức Chúa Trời[a]; kẻo một rễ đắng nào mọc lên gây rối, và qua rễ ấy nhiều người bị ô uế[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “không nhận được ân điển của Đức Chúa Trời.” Cụm từ Hy Lạp có thể chỉ việc không đạt tới điều được ban, cũng như bị hụt mất điều ấy.'
    reason: lexical_alternative
  - marker: b
    text: “Rễ đắng” có lẽ gợi lại Phục Truyền Luật Lệ Ký 29:18, nơi hình ảnh rễ độc và đắng tượng trưng cho sự bất trung với giao ước có thể lan ra trong cộng đồng.
    reason: cross_reference
lexical_decisions:
- source_word: ἐπισκοποῦντες
  choice: Hãy cẩn thận coi sóc
  rationale: Phân từ hiện tại mang ý giám sát và quan tâm chủ động; cách dịch này giữ được lời kêu gọi cộng đồng luôn tỉnh thức, đồng thời tự nhiên trong tiếng Việt.
- source_word: μή τις ὑστερῶν ἀπὸ τῆς χάριτος τοῦ θεοῦ
  choice: kẻo có ai hụt mất ân điển của Đức Chúa Trời
  rationale: ὑστερέω với ἀπό có thể chỉ việc không đạt tới hoặc bị hụt mất điều được ban. “Hụt mất” giữ tính cảnh báo và không quyết định tranh luận thần học về sự cứu rỗi.
- source_word: χάριτος
  choice: ân điển
  rationale: “Ân điển” là thuật ngữ Kinh Thánh quen thuộc, truyền đạt ân huệ nhưng không của Đức Chúa Trời và giữ chiều sâu thần học của χάρις.
- source_word: ῥίζα πικρίας
  choice: rễ đắng
  rationale: Cách nói cô đọng và tự nhiên, đồng thời giữ hình ảnh chiếc rễ sinh ra điều đắng độc cùng âm vang có thể có từ Phục Truyền Luật Lệ Ký 29:18.
- source_word: ἄνω φύουσα
  choice: mọc lên
  rationale: Diễn tả tự nhiên hình ảnh rễ hoặc mầm trồi lên và phát triển.
- source_word: ἐνοχλῇ
  choice: gây rối
  rationale: Truyền đạt tác động gây phiền nhiễu, xáo trộn trong cộng đồng.
- source_word: δι’ αὐτῆς
  choice: bởi đó
  rationale: Giữ nghĩa phương tiện của διά và quy chiếu tự nhiên về “rễ đắng”.
- source_word: μιανθῶσιν πολλοί
  choice: nhiều người bị ô uế
  rationale: “Bị ô uế” giữ sắc thái đạo đức và nghi lễ mạnh của μιαίνω, thay vì làm nhẹ thành ảnh hưởng xã hội đơn thuần.
theological_decisions:
- issue: Lời cảnh báo về việc ὑστερῶν ἀπὸ ân điển có hàm ý đánh mất sự cứu rỗi, không nhận được ân điển, hay bị loại khỏi cộng đồng hay không
  choice: Dịch trung tính là “hụt mất ân điển của Đức Chúa Trời”
  alternative: “không nhận được ân điển của Đức Chúa Trời” hoặc “thiếu ân điển của Đức Chúa Trời”
  rationale: Cụm Hy Lạp cho phép hiểu là không đạt tới điều được ban hoặc hụt mất điều ấy; câu này không tự giải quyết các tranh luận giáo lý về sự bội đạo hay bền đỗ, nên bản dịch giữ nguyên sức căng.
- issue: Có nên làm nhẹ μιαίνω thành sự xáo trộn xã hội hay không
  choice: Giữ “bị ô uế”
  alternative: “bị làm hư hỏng” hoặc “bị nhiễm độc”
  rationale: Động từ có sức nặng đạo đức hoặc nghi lễ rõ hơn sự phiền nhiễu thông thường, nên “ô uế” bảo toàn mức độ nghiêm trọng của ảnh hưởng lan rộng.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “Đức Chúa Trời” và “ân điển” theo ngữ vực Kinh Thánh phổ thông; giữ phép ẩn dụ về rễ cùng ngôn ngữ “ô uế” để bảo toàn âm vang Cựu Ước và sức nặng thần học.
