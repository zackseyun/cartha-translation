- from: Hãy cẩn thận coi sóc, kẻo có ai hụt mất ân điển của Đức Chúa Trời[a]; kẻo có rễ đắng nào mọc lên gây rối, và bởi đó nhiều người bị ô uế[b].
  to: Hãy coi chừng, kẻo có ai hụt mất ân điển của Đức Chúa Trời[a]; kẻo một rễ đắng nào mọc lên gây rối, và qua rễ ấy nhiều người bị ô uế[b].
  rationale: Bản sửa thay cách diễn đạt mở đầu bằng tiếng Việt tự nhiên hơn, làm rõ đại từ “qua rễ ấy” theo tiền ngữ ῥίζα, và sửa chú thích điển tích để phản ánh chính xác, thận trọng hình ảnh trong Phục Truyền Luật Lệ Ký 29:18. Các thuật ngữ chủ chốt “ân điển,” “rễ đắng,” và “bị ô uế” được giữ nguyên.
