id: HEB.12.2
reference: Hebrews 12:2
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀφορῶντες εἰς τὸν τῆς πίστεως ἀρχηγὸν καὶ τελειωτὴν Ἰησοῦν, ὃς ἀντὶ τῆς προκειμένης αὐτῷ χαρᾶς ὑπέμεινεν σταυρὸν αἰσχύνης καταφρονήσας, ἐν δεξιᾷ τε τοῦ θρόνου τοῦ θεοῦ κεκάθικεν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/002.yaml
  text: fixing our eyes on Jesus[a], the pioneer and perfecter of faith, who for the joy set before him endured the cross, despising the shame[b], and has sat down at the right hand of the throne of God.
translation:
  language: vi
  text: hãy chăm chú hướng mắt về Đức Chúa Giê-su, Đấng mở đường và làm cho đức tin được trọn vẹn[a]. Vì niềm vui đặt trước mặt mình, Ngài đã chịu đựng thập tự giá, không màng đến nỗi ô nhục[b], và đã ngồi xuống bên phải ngai của Đức Chúa Trời.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Đấng mở đường và làm cho lòng trung tín được trọn vẹn,” hoặc “Đấng mở đường và làm cho đức tin của chúng ta được trọn vẹn.” Cụm từ Hy Lạp rất cô đọng; πίστις cũng có thể mang nghĩa “lòng trung tín” hoặc nói riêng đến đức tin của những người tin.'
    reason: alternative_reading
  - marker: b
    text: 'Cũng có thể dịch: “coi thường nỗi ô nhục” hoặc “không coi nỗi ô nhục là đáng kể.” Nghĩa là Ngài xem nỗi ô nhục của việc bị đóng đinh không phải là điều có thể quyết định hay ngăn cản mình.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀφορῶντες
  choice: hãy chăm chú nhìn
  rationale: Diễn đạt việc hướng sự chú ý tập trung vào một đối tượng, đồng thời phù hợp với lời khuyên đang tiếp diễn từ câu trước.
- source_word: ἀρχηγὸν
  choice: Đấng mở đường
  rationale: Giữ được sắc thái người khởi đầu và đi trước dẫn đường trong hình ảnh cuộc đua; tự nhiên hơn cách dịch mang sắc thái văn chương như “tác giả”.
- source_word: τελειωτὴν
  choice: làm trọn
  rationale: Chỉ việc đưa điều gì đến mục tiêu và sự hoàn tất; kết hợp tự nhiên với “Đấng mở đường” mà không hàm ý đơn thuần chấm dứt.
- source_word: τῆς πίστεως
  choice: đức tin
  rationale: Không thêm đại từ sở hữu vốn không có trong tiếng Hy Lạp, đồng thời bảo tồn sự cô đọng và khả năng hiểu theo nhiều hướng của cụm từ.
- source_word: ἀντὶ
  choice: vì
  rationale: Trong văn cảnh, giới từ trình bày niềm vui ở phía trước như triển vọng thúc đẩy Đức Chúa Jêsus chịu đựng; cách dịch này tự nhiên trong tiếng Việt.
- source_word: προκειμένης αὐτῷ χαρᾶς
  choice: niềm vui đặt trước mặt mình
  rationale: Bảo tồn hình ảnh một mục tiêu ở phía trước, phù hợp với hình ảnh cuộc đua trong văn cảnh.
- source_word: ὑπέμεινεν
  choice: đã chịu đựng
  rationale: Diễn đạt sự bền lòng đứng vững dưới đau khổ và nối với chủ đề kiên trì của chương.
- source_word: σταυρὸν
  choice: thập tự giá
  rationale: Ngữ cảnh xác định đây là thập tự giá Đức Chúa Jêsus đã chịu; danh từ tiếng Việt tự nhiên không cần mạo từ.
- source_word: αἰσχύνης καταφρονήσας
  choice: coi thường sự sỉ nhục
  rationale: Diễn đạt việc xem nỗi ô nhục là không đáng kể và không để nó chi phối, không ngụ ý rằng sự sỉ nhục tự nó là điều tốt.
- source_word: ἐν δεξιᾷ ... τοῦ θρόνου τοῦ θεοῦ
  choice: bên phải ngai Đức Chúa Trời
  rationale: Giữ hình ảnh về địa vị danh dự và thẩm quyền tối cao, bằng lối diễn đạt rõ ràng, tự nhiên trong tiếng Việt.
- source_word: τε
  choice: và
  rationale: Nối mệnh đề cuối với chuỗi hành động trước đó một cách gọn và tự nhiên.
- source_word: κεκάθικεν
  choice: đã ngồi
  rationale: Thể hoàn thành Hy Lạp chỉ một hành động đã hoàn tất với kết quả còn hiệu lực; trong tiếng Việt, “đã ngồi” chuyển tải hành động hoàn tất mà không tạo lối nói gượng.
theological_decisions:
- issue: Ý nghĩa của τῆς πίστεως trong cụm ἀρχηγὸν καὶ τελειωτὴν
  choice: Đức Chúa Jêsus được trình bày là Đấng mở đường và làm trọn đức tin, không tự ý thêm “của chúng ta”.
  alternative: Đấng mở đường và làm trọn lòng trung tín; hoặc Đấng mở đường và làm trọn đức tin của chúng ta.
  rationale: Cụm Hy Lạp cô đọng và có thể quy chiếu đến đức tin của người tin hoặc sự trung tín được Đức Chúa Jêsus thể hiện. Bản chính giữ “đức tin”, còn các khả năng khác được nêu trong chú thích.
- issue: Sức nghĩa của ἀντὶ τῆς προκειμένης αὐτῷ χαρᾶς
  choice: Đức Chúa Jêsus chịu thập tự giá vì niềm vui đặt trước mặt Ngài như triển vọng thúc đẩy.
  alternative: Đức Chúa Jêsus chịu thập tự giá thay vì nhận lấy niềm vui đặt trước mặt Ngài.
  rationale: Dù ἀντί có thể mang nghĩa “thay vì”, văn cảnh về sự bền lòng hướng đến mục tiêu đã hứa nghiêng về niềm vui tương lai làm động lực; không cần áp đặt một sự đối lập suy đoán.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Chúa Jêsus” và “Đức Chúa Trời” theo lối gọi Tin Lành Việt ngữ quen thuộc; cấu trúc câu giữ liên hệ với lời khuyên ở câu trước. Các động từ rõ, gọn; tránh thuật ngữ thần học chuyên biệt không có trong nguyên văn.
