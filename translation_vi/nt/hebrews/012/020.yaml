- from: 'Vì họ không thể chịu nổi điều được truyền: “Ngay cả nếu một con vật chạm vào núi[a], nó sẽ bị ném đá.”'
  to: 'Vì họ không thể chịu nổi điều được truyền: “Dù chỉ một con vật chạm vào núi[a], nó sẽ bị ném đá.”'
  rationale: Chỉnh sửa giới hạn ở việc làm câu điều kiện tự nhiên hơn trong tiếng Việt và làm rõ từ ngữ của chú thích. Chính văn vẫn bám sát SBLGNT, giữ nguyên tính khái quát của “núi” và không đưa biến thể vào chính văn.
