base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/020.yaml
  text: 'For they could not endure what was being commanded: “If even an animal touches the mountain[a], it will be stoned.”'
translation:
  language: vi
  text: 'Vì họ không thể chịu nổi điều được truyền: “Dù chỉ một con vật chạm vào núi[a], nó sẽ bị ném đá.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Một số thủ bản thêm: “hoặc bị bắn bằng mũi tên,” vang vọng Xuất Hành 19:12–13.'
    reason: textual_variant
lexical_decisions:
- source_word: οὐκ ἔφερον
  choice: họ không thể chịu nổi
  rationale: Trong ngữ cảnh này, φέρω đi với phủ định mang nghĩa không thể chịu đựng hay chịu nổi. Cách diễn đạt này tự nhiên trong tiếng Việt hiện đại và thể hiện việc họ không kham nổi mệnh lệnh đáng kinh sợ.
- source_word: γὰρ
  choice: Vì
  rationale: γάρ nêu lý do giải thích cho câu trước; “Vì” giữ rõ quan hệ lập luận.
- source_word: τὸ διαστελλόμενον
  choice: điều được truyền
  rationale: Phân từ bị động chỉ một chỉ thị hay mệnh lệnh có thẩm quyền. “Điều được truyền” bảo toàn dạng khái quát và sắc thái bị động, không thêm chủ thể ban lệnh vốn không được nêu trực tiếp.
- source_word: Κἂν
  choice: Ngay cả nếu
  rationale: κἄν mở đầu mệnh đề điều kiện với sắc thái nhấn mạnh; “ngay cả nếu” cho thấy đến một con vật cũng không được miễn trừ.
- source_word: θηρίον
  choice: một con vật
  rationale: θηρίον có thể chỉ thú hoặc động vật. Trong lời dẫn liên quan đến Xuất Hành, từ ngữ khái quát “con vật” phù hợp hơn “thú hoang” và dễ hiểu trong tiếng Việt hiện đại.
- source_word: θίγῃ
  choice: chạm vào
  rationale: Động từ ở thể giả định trong mệnh đề điều kiện được diễn đạt tự nhiên bằng hiện tại “chạm vào” trong tiếng Việt.
- source_word: τοῦ ὄρους
  choice: núi
  rationale: Bản Hy Lạp nói đến ngọn núi đã xác định trong ngữ cảnh, tức núi Si-nai, nhưng không nêu tên tại đây; tiếng Việt không bắt buộc dùng từ chỉ định, nên “núi” vừa tự nhiên vừa không nói rõ hơn nguyên bản.
- source_word: λιθοβοληθήσεται
  choice: nó sẽ bị ném đá
  rationale: Cách dịch này giữ nguyên thì tương lai và thể bị động, đồng thời dùng lối diễn đạt tiếng Việt hiện đại, rõ nghĩa.
theological_decisions:
- issue: Quan hệ với mệnh lệnh tại núi Si-nai trong lời trích dẫn
  choice: 'Chỉ dịch nội dung có trong bản SBLGNT: con vật chạm vào núi sẽ bị ném đá.'
  alternative: Bổ sung “hoặc bị bắn bằng tên” theo một số thủ bản và theo âm hưởng của Xuất Hành 19:12–13.
  rationale: Văn bản Hy Lạp được cung cấp kết thúc ở λιθοβοληθήσεται. Không hòa hợp hóa lời trích bằng cách đưa phần mở rộng của truyền thống thủ bản khác vào chính văn; biến thể được ghi ở chú thích.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại, dùng “chịu nổi,” “điều được truyền” và “bị ném đá” để người đọc phổ thông dễ hiểu. Giữ cấu trúc giải thích mở đầu bằng “Vì” và không tự ý nêu tên núi Si-nai trong chính văn.
