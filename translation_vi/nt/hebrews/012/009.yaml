id: HEB.12.9
reference: Hebrews 12:9
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εἶτα τοὺς μὲν τῆς σαρκὸς ἡμῶν πατέρας εἴχομεν παιδευτὰς καὶ ἐνετρεπόμεθα· οὐ ⸀πολὺ μᾶλλον ὑποταγησόμεθα τῷ πατρὶ τῶν πνευμάτων καὶ ζήσομεν;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/009.yaml
  text: Furthermore[a], we had our earthly fathers as disciplinarians, and we respected them[c][b]. Shall we not much more submit to the Father of spirits and live?
translation:
  language: vi
  text: Hơn nữa, chúng ta từng có những người cha trần thế[a] là những người sửa dạy chúng ta[b], và chúng ta kính trọng họ. Há chúng ta lại không càng phải thuận phục Cha của các linh[c] hơn biết bao, và sẽ sống sao?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “những người cha của xác thịt chúng ta.”'
    reason: lexical_alternative
  - marker: b
    text: 'Hay: “những người kỷ luật chúng ta.”'
    reason: lexical_alternative
  - marker: c
    text: “Cha của các linh” có thể đặc biệt chỉ Cha của linh chúng ta, đối lập với những người cha trần thế; nhưng cách nói Hy Lạp rộng hơn và không có từ “chúng ta”.
    reason: alternative_reading
lexical_decisions:
- source_word: εἶτα
  choice: Hơn nữa
  rationale: Trong mạch lập luận từ điều nhẹ đến điều trọng, từ này bổ sung một luận cứ chứ không chủ yếu chỉ trình tự thời gian.
- source_word: τῆς σαρκὸς ἡμῶν πατέρας
  choice: những người cha về phần xác
  rationale: Giữ rõ hình ảnh về nguồn gốc thể xác và sự đối lập với “Cha của các linh”, đồng thời không khiến σάρξ mang nghĩa “bản tính tội lỗi” vốn không phù hợp ở đây.
- source_word: παιδευτὰς
  choice: người sửa dạy mình
  rationale: Diễn đạt vai trò giáo huấn và kỷ luật của cha mẹ, đồng thời nối tự nhiên với chủ đề sửa dạy trong đoạn văn.
- source_word: ἐνετρεπόμεθα
  choice: chúng ta kính trọng họ
  rationale: Trong ngữ cảnh, động từ chỉ thái độ kính nể, tôn trọng đối với những người cha sửa dạy mình.
- source_word: οὐ πολὺ μᾶλλον
  choice: Chẳng phải chúng ta càng nên
  rationale: Giữ hình thức câu hỏi tu từ và sức nặng của phép lập luận “huống chi” trong tiếng Hy Lạp.
- source_word: ὑποταγησόμεθα
  choice: thuận phục
  rationale: Truyền đạt việc đặt mình dưới thẩm quyền; “thuận phục” vừa trang trọng vừa tự nhiên trong ngữ cảnh quan hệ với Đức Chúa Trời.
- source_word: τῷ πατρὶ τῶν πνευμάτων
  choice: Cha của các linh
  rationale: Giữ nguyên cấu trúc sở hữu và số nhiều của nguyên văn, không thu hẹp cụm từ thành riêng “Cha của linh chúng ta”.
- source_word: ζήσομεν
  choice: và sống
  rationale: Giữ liên từ καί và ý nghĩa sống như kết quả gắn với sự thuận phục, không giải thích thêm bản chất của sự sống này.
theological_decisions:
- issue: Ý nghĩa của “Cha của các linh”
  choice: Giữ cách nói rộng “Cha của các linh”
  alternative: “Cha của linh chúng ta” hoặc “Cha của các hữu thể thuộc linh”
  rationale: Ngữ cảnh đối chiếu cha về phần xác với Đức Chúa Trời, nhưng nguyên văn không có đại từ “chúng ta” và cũng không xác định rõ chỉ các linh nào; bản dịch vì thế giữ nguyên độ rộng thần học của cụm từ.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. “Về phần xác” được giữ để làm nổi bật phép đối chiếu trong câu; “các linh” bảo toàn số nhiều và sự hàm hồ của nguyên văn.
