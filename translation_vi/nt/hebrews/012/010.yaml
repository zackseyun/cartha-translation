id: HEB.12.10
reference: Hebrews 12:10
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οἱ μὲν γὰρ πρὸς ὀλίγας ἡμέρας κατὰ τὸ δοκοῦν αὐτοῖς ἐπαίδευον, ὁ δὲ ἐπὶ τὸ συμφέρον εἰς τὸ μεταλαβεῖν τῆς ἁγιότητος αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/010.yaml
  text: For they disciplined us for a few days as seemed best to them[a], but he does so for our benefit[b], so that we may share in his holiness.
translation:
  language: vi
  text: Vì những người cha ấy sửa dạy chúng ta trong một thời gian ngắn, theo điều họ cho là tốt; còn Ngài sửa dạy vì lợi ích của chúng ta, để chúng ta dự phần vào sự thánh khiết của Ngài.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πρὸς ὀλίγας ἡμέρας
  choice: trong một thời gian ngắn
  rationale: Đây là thành ngữ chỉ khoảng thời gian hữu hạn; cách dịch này tự nhiên trong tiếng Việt và không buộc người đọc hiểu theo nghĩa đen là chỉ vài ngày.
- source_word: κατὰ τὸ δοκοῦν αὐτοῖς
  choice: theo điều họ cho là phải
  rationale: Diễn đạt sự phán đoán chủ quan của các người cha trần thế, nhưng không khẳng định rằng phán đoán ấy luôn đúng hoặc tốt nhất.
- source_word: ἐπαίδευον
  choice: sửa dạy
  rationale: Trong ngữ cảnh Hê-bơ-rơ 12, từ này bao gồm việc giáo dưỡng, uốn nắn và kỷ luật của cha mẹ, chứ không chỉ là trừng phạt.
- source_word: ὁ δὲ
  choice: còn Ngài sửa dạy
  rationale: Chủ thể tương phản được ngữ cảnh xác định là Đức Chúa Trời. Dùng đại từ tôn kính và bổ sung động từ tỉnh lược để câu tiếng Việt rõ, tự nhiên.
- source_word: ἐπὶ τὸ συμφέρον
  choice: vì lợi ích của chúng ta
  rationale: Nêu rõ mục đích hướng đến điều có ích cho người chịu sửa dạy.
- source_word: εἰς τὸ μεταλαβεῖν
  choice: để chúng ta được dự phần vào
  rationale: Giữ sắc thái mục đích của cấu trúc Hy Lạp và ý nghĩa tham dự/chia sẻ của μεταλαμβάνω.
- source_word: ἁγιότητος αὐτοῦ
  choice: sự thánh khiết của Ngài
  rationale: Giữ nguyên phẩm tính thuộc về Đức Chúa Trời và ý niệm người tin được dự phần, không quy định một mô hình giáo lý riêng về sự thánh hóa.
theological_decisions:
- issue: Chủ thể của ὁ δὲ
  choice: Hiểu là Đức Chúa Trời nhưng dịch bằng đại từ “Ngài”.
  alternative: Nêu trực tiếp “Đức Chúa Trời”.
  rationale: Ngữ cảnh Hê-bơ-rơ 12:5–11 cho thấy rõ sự tương phản giữa các người cha trần thế và Đức Chúa Trời là Cha; đại từ giữ gần hình thức ngầm định của bản Hy Lạp.
- issue: Ý nghĩa của việc dự phần vào sự thánh khiết của Ngài
  choice: Giữ ngôn ngữ dự phần mà không xác định cơ chế thần học.
  alternative: Giải thích riêng là địa vị thánh khiết hoặc tiến trình thánh hóa.
  rationale: Câu văn nêu mục đích của sự sửa dạy từ Đức Chúa Trời nhưng không định nghĩa hẹp bản chất hay tiến trình của sự dự phần ấy.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Các người cha ấy” nối với đối tượng trong ngữ cảnh trước; “sửa dạy” được lặp lại ở vế sau để làm rõ động từ tỉnh lược. Không dùng chú thích vì bản dịch chính đã diễn đạt tự nhiên các khả năng từ vựng cần thiết.
