  to: Vì những người cha ấy sửa dạy chúng ta trong một thời gian ngắn, theo điều họ cho là tốt; còn Ngài sửa dạy vì lợi ích của chúng ta, để chúng ta dự phần vào sự thánh khiết của Ngài.
  rationale: Chỉnh nhẹ để câu Việt tự nhiên hơn và diễn đạt chính xác hơn sắc thái chủ quan của κατὰ τὸ δοκοῦν αὐτοῖς. Giữ “trong một thời gian ngắn” như một cách chuyển ngữ thành ngữ cho πρὸς ὀλίγας ἡμέρας; không cần chú thích vì không có vấn đề văn bản hay nhập nhằng đáng kể cần neo chú thích.
