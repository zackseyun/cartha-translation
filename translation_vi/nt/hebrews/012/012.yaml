  text: Διὸ τὰς παρειμένας χεῖρας καὶ τὰ παραλελυμένα γόνατα ἀνορθώσατε,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/012.yaml
  text: Therefore[a], strengthen your drooping hands and your weakened knees,
translation:
  language: vi
  text: Vì vậy[a], hãy nâng đôi tay rũ xuống và đầu gối yếu mỏi lên,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch sát hình thức hơn: “Vì vậy, hãy dựng thẳng đôi tay rũ xuống và đầu gối yếu mỏi.” Cách nói này vọng lại Ê-sai 35:3 trong truyền thống Hy Lạp và dùng hình ảnh thân thể để nói về lòng can đảm cùng sức bền được phục hồi.'
    reason: cross_reference
lexical_decisions:
- source_word: Διὸ
  choice: Vì vậy
  rationale: Liên từ suy luận nối lời khuyên này với phần bàn trước đó về sự chịu đựng và kỷ luật; cách diễn đạt tự nhiên, ngắn gọn và giữ rõ quan hệ lập luận.
- source_word: τὰς παρειμένας χεῖρας
  choice: đôi tay rũ xuống
  rationale: Phân từ παρειμένας diễn tả tay buông thõng, rã rời. “Đôi tay rũ xuống” giữ hình ảnh thân thể và gợi sự nản lòng, kiệt sức mà không giải nghĩa quá mức.
- source_word: τὰ παραλελυμένα γόνατα
  choice: đầu gối yếu mỏi
  rationale: Phân từ hoàn thành παραλελυμένα chỉ đầu gối đã trở nên suy yếu hoặc mất sức. “Yếu mỏi” tự nhiên trong tiếng Việt và tránh sắc thái chẩn đoán y khoa của “tê liệt” trong ngữ cảnh ẩn dụ.
- source_word: ἀνορθώσατε
  choice: hãy làm cho ... được vững mạnh
  rationale: Động từ mệnh lệnh ἀνορθόω có thể mang nghĩa dựng thẳng, nâng lên hoặc phục hồi. Cách dịch này truyền đạt lời kêu gọi phục hồi sức lực và lòng bền chí, đồng thời vẫn gắn với hình ảnh đôi tay và đầu gối.
theological_decisions:
- issue: Lời khuyên bằng ẩn dụ về sự suy yếu của thân thể
  choice: Giữ nguyên hình ảnh đôi tay rũ xuống và đầu gối yếu mỏi, nhưng diễn đạt mệnh lệnh theo hướng phục hồi sức mạnh.
  alternative: 'Dịch sát hình thức hơn: “hãy nâng đôi tay rũ xuống và đầu gối yếu mỏi lên.”'
  rationale: Ngữ cảnh Hê-bơ-rơ 12 nói về sự chịu đựng, sửa dạy và bền chí. Câu này dùng hình ảnh thân thể để kêu gọi đổi mới lòng can đảm và sức chịu đựng, có khả năng vọng lại Ê-sai 35:3; bản dịch không thu hẹp câu thành chỉ dẫn về tư thế thể chất.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. “Đôi tay rũ xuống” và “đầu gối yếu mỏi” duy trì hình ảnh giàu sức gợi; “được vững mạnh” diễn đạt tự nhiên ý phục hồi mà không áp đặt cách giải thích giáo phái.
