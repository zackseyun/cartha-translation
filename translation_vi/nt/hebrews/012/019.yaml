source:
  edition: SBLGNT
  text: καὶ σάλπιγγος ἤχῳ καὶ φωνῇ ῥημάτων, ἧς οἱ ἀκούσαντες παρῃτήσαντο ⸀μὴ προστεθῆναι αὐτοῖς λόγον·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/019.yaml
  text: and to the sound of a trumpet and to a voice of words[b][a], whose hearers begged that no further word be spoken to them.
translation:
  language: vi
  text: cũng không đến với tiếng kèn vang và tiếng nói thành lời[a][b]; những người đã nghe tiếng nói ấy khẩn xin đừng phán thêm lời nào với họ nữa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể hiểu: “toàn bộ hiện tượng ấy, mà những người nghe đã khẩn xin đừng phán thêm lời nào với họ nữa,” nếu đại từ quan hệ chỉ rộng hơn đến toàn bộ sự hiển hiện tại Si-nai, chứ không riêng “tiếng nói thành lời”.'
    reason: alternative_reading
  - marker: b
    text: Xem Xuất Ê-díp-tô Ký 20:18–19 và Phục Truyền Luật Lệ Ký 5:23–27 về lời dân Y-sơ-ra-ên xin không phải trực tiếp nghe tiếng Đức Chúa Trời nữa.
    reason: cross_reference
lexical_decisions:
- source_word: σάλπιγγος ἤχῳ
  choice: tiếng kèn vang
  rationale: Diễn đạt tự nhiên hiện tượng âm thanh tại núi Si-nai, giữ hình ảnh cụ thể của tiếng kèn và sắc thái của ἦχος.
- source_word: φωνῇ ῥημάτων
  choice: tiếng nói thành lời
  rationale: Giữ sự phân biệt giữa âm thanh thuần túy và lời nói có nội dung, đồng thời tự nhiên hơn trong tiếng Việt hiện đại so với lối dịch sát chữ “tiếng nói của những lời”.
- source_word: ἧς
  choice: tiếng ấy
  rationale: Đại từ quan hệ giống cái số ít gần nhất quy chiếu đến φωνῇ; tiếng Việt cần nêu lại danh từ để câu rõ và tự nhiên. Khả năng quy chiếu rộng hơn được giữ trong chú thích.
- source_word: οἱ ἀκούσαντες
  choice: những người nghe tiếng ấy
  rationale: Thể hiện trực tiếp phân từ được danh từ hóa và xác định rõ họ đã nghe tiếng nói vừa nhắc đến.
- source_word: παρῃτήσαντο
  choice: đã khẩn xin
  rationale: Trong bối cảnh này, động từ diễn tả lời cầu xin tha thiết để khỏi phải tiếp tục nghe Đức Chúa Trời phán trực tiếp, mạnh hơn “xin” nhưng không mang nghĩa đơn thuần là từ chối.
- source_word: μὴ προστεθῆναι αὐτοῖς λόγον
  choice: đừng phán thêm lời nào với họ nữa
  rationale: Truyền đạt thành ngữ “không thêm lời” bằng tiếng Việt rõ ràng, giữ ý bị động về lời được nói với họ; “phán” phù hợp với ngữ cảnh lời của Đức Chúa Trời mà không cần thêm chủ thể vào câu.
theological_decisions:
- issue: Sở chỉ của đại từ quan hệ ἧς
  choice: Trong chính văn, mệnh đề được hiểu gần nhất là quy chiếu đến “tiếng nói thành lời”.
  alternative: Đại từ có thể quy chiếu rộng hơn đến toàn bộ sự hiển hiện đáng sợ tại Si-nai, gồm cả tiếng kèn và tiếng phán.
  rationale: Sự hòa hợp giống cái số ít và danh từ đứng gần nhất ủng hộ φωνῇ làm tiền ngữ; tuy nhiên, văn cảnh cho phép hiểu rộng hơn, nên phương án ấy được ghi ở chú thích thay vì bị loại bỏ.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại, nối tiếp cú pháp liệt kê của câu trước bằng “cũng không đến với”. “Tiếng nói thành lời” giữ nét diễn đạt khác thường của nguyên văn mà vẫn dễ hiểu. Các dấu chú thích đều xuất hiện trong chính văn.
