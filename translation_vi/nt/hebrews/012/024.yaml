source:
  edition: SBLGNT
  text: καὶ διαθήκης νέας μεσίτῃ Ἰησοῦ, καὶ αἵματι ῥαντισμοῦ κρεῖττον λαλοῦντι παρὰ τὸν Ἅβελ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/024.yaml
  text: and to Jesus[a], the mediator of a new covenant[b], and to the sprinkled blood that speaks better than Abel.
translation:
  language: vi
  text: và đến với Đức Giê-su, Đấng trung gian của một giao ước mới, và với huyết được rảy[b], đang nói tốt hơn A-bên[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể hiểu là: «huyết được rảy nói tốt hơn huyết của A-bên». Tiếng Hy Lạp chỉ viết «hơn A-bên», có lẽ ám chỉ huyết A-bên kêu từ đất (Sáng Thế Ký 4:10).'
    reason: alternative_reading
  - marker: b
    text: «Huyết được rảy» nói đến huyết tế lễ được áp dụng bằng cách rảy, gợi lại nghi thức xác lập giao ước và sự thanh tẩy.
    reason: cultural_note
lexical_decisions:
- source_word: διαθήκης νέας
  choice: một giao ước mới
  rationale: “Giao ước” diễn đạt đúng nghĩa Kinh Thánh của διαθήκη trong thư Hê-bơ-rơ. Cấu trúc không có mạo từ được giữ tự nhiên là “một giao ước mới”, dù ngữ cảnh cũng có thể khiến người đọc liên tưởng đến giao ước mới đã được hứa.
- source_word: μεσίτῃ
  choice: Đấng trung gian
  rationale: Cách gọi này vừa tự nhiên vừa giữ được sắc thái pháp lý và thần học của người đứng giữa các bên để thiết lập quan hệ giao ước.
- source_word: Ἰησοῦ
  choice: Đức Giê-su
  rationale: Dùng dạng tên riêng quen thuộc trong tiếng Việt hiện đại và cách xưng gọi trang trọng phù hợp với văn mạch.
- source_word: αἵματι ῥαντισμοῦ
  choice: huyết được rảy
  rationale: Diễn đạt hình ảnh huyết được áp dụng bằng nghi thức rảy, đồng thời tránh lối nói cổ hoặc khó hiểu như “huyết của sự rảy”.
- source_word: κρεῖττον
  choice: tốt hơn
  rationale: Giữ từ ngữ so sánh chủ đạo của thư Hê-bơ-rơ bằng cách diễn đạt thông dụng, không cường điệu thành “ưu việt hơn”.
- source_word: λαλοῦντι
  choice: lên tiếng
  rationale: Động từ hiện tại bổ nghĩa cho “huyết”; “lên tiếng” tự nhiên trong tiếng Việt và gợi đúng hình ảnh huyết cất tiếng trong Sáng Thế Ký 4:10.
- source_word: παρὰ τὸν Ἅβελ
  choice: hơn A-bên
  rationale: Bản Hy Lạp chỉ nêu A-bên, không nói rõ “huyết của A-bên”. Cách dịch ngắn này bảo toàn lối so sánh tỉnh lược và sự hàm nghĩa của nguyên văn.
theological_decisions:
- issue: Đối tượng được đem ra so sánh với huyết được rảy
  choice: Giữ cách nói ngắn “tốt hơn A-bên” trong chính văn.
  alternative: “tốt hơn huyết của A-bên” hoặc “nói những điều tốt hơn điều huyết A-bên kêu cầu”
  rationale: Ngữ cảnh gợi mạnh đến huyết A-bên kêu từ đất (Sáng Thế Ký 4:10), nhưng nguyên văn chỉ ghi tên A-bên. Không khai triển trong chính văn giúp bảo toàn sự cô đọng và không ấn định một cách giải thích duy nhất.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu giữ liên từ mở đầu vì đây là một phần trong chuỗi “đến với” của văn cảnh trước. Dùng “huyết” thay vì “máu” để duy trì sắc thái tế lễ trang trọng; cách nói “lên tiếng tốt hơn A-bên” cố ý giữ sự tỉnh lược và căng thẳng diễn giải của nguyên văn.
