revisions:
- from: Nhưng nếu anh chị em không được sửa dạy—điều mà mọi người đều đã cùng nhận—thì anh chị em là con ngoài giá thú, chứ không phải con chính thức.
  to: Nhưng nếu anh chị em không được sửa dạy—điều mà mọi người đều đã dự phần—thì anh chị em là con ngoài giá thú, chứ không phải con chính thức.
  rationale: Thay “đều đã cùng nhận” bằng “mọi người đều đã dự phần” để phản ánh trực tiếp hơn μέτοχοι γεγόνασι, đồng thời giữ nguyên sự hàm súc của πάντες và đối lập νόθοι/υἱοί trong bản gốc.
