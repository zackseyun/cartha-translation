id: HEB.12.8
reference: Hebrews 12:8
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εἰ δὲ χωρίς ἐστε παιδείας ἧς μέτοχοι γεγόνασι πάντες, ἄρα νόθοι ⸂καὶ οὐχ υἱοί ἐστε⸃.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/008.yaml
  text: But if you are without discipline, of which all have become sharers, then you are illegitimate children and not sons.
translation:
  language: vi
  text: Nhưng nếu anh chị em không được sửa dạy—điều mà mọi người đều đã dự phần—thì anh chị em là con ngoài giá thú, chứ không phải con chính thức.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παιδείας
  choice: sự sửa dạy / được sửa dạy
  rationale: Trong ngữ cảnh Hê-bơ-rơ 12, từ này chỉ sự giáo dục và uốn nắn của cha đối với con, bao gồm kỷ luật nhưng không chỉ là hình phạt. Cấu trúc tiếng Việt “không được sửa dạy” diễn đạt tự nhiên ý χωρίς ἐστε παιδείας.
- source_word: μέτοχοι γεγόνασι
  choice: đều đã cùng nhận
  rationale: Diễn đạt việc mọi người đã trở thành những người cùng dự phần vào sự sửa dạy; tránh lối nói nặng tính kỹ thuật mà vẫn giữ sắc thái chia sẻ chung.
- source_word: νόθοι
  choice: con ngoài giá thú
  rationale: Phản ánh địa vị người con không được nhìn nhận là hợp pháp trong bối cảnh cổ đại, tương phản trực tiếp với υἱοί; không dùng từ miệt thị.
- source_word: υἱοί
  choice: con chính thức
  rationale: Trong thế đối lập với νόθοι, từ này nhấn mạnh những người con được công nhận đầy đủ, không nhằm phân biệt giới tính; “con chính thức” làm rõ sự tương phản về địa vị.
theological_decisions:
- issue: Phạm vi của πάντες (“mọi người”)
  choice: mọi người
  alternative: tất cả con cái Đức Chúa Trời
  rationale: Giữ nguyên cách nói khái quát và sự hàm súc của bản Hy Lạp, không tự ý xác định rõ nhóm người hơn văn bản.
- issue: Ẩn dụ về tư cách làm con
  choice: giữ đối lập giữa “con ngoài giá thú” và “con chính thức”
  alternative: không phải con thật
  rationale: Bảo tồn lập luận pháp lý-gia đình của câu và tránh biến nó thành nhận định về bản chất sinh học hoặc giá trị con người.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh chị em” để chuyển số nhiều ngôi thứ hai theo lối bao hàm giới; dấu gạch ngang giúp giữ mệnh đề giải thích của nguyên văn.
