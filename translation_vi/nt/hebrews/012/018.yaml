    rationale: Các cụm cách trong tiếng Hy Lạp đều phụ thuộc vào προσεληλύθατε dưới một phủ định. Tiếng Việt tự nhiên cần lặp động từ/phủ định hoặc dùng một cấu trúc liệt kê khác; lặp “cũng không đến gần” là rõ ràng và không thay đổi nghĩa.
