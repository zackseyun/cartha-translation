source:
  edition: SBLGNT
  text: Οὐ γὰρ προσεληλύθατε ⸀ψηλαφωμένῳ καὶ κεκαυμένῳ πυρὶ καὶ γνόφῳ καὶ ⸀ζόφῳ καὶ θυέλλῃ
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/018.yaml
  text: For you have not come to what can be touched[a], and to a blazing fire, and to darkness and gloom and storm[b],
translation:
  language: vi
  text: Vì anh chị em không đến gần điều có thể sờ chạm được[a], cũng không đến gần lửa cháy bừng, bóng tối dày đặc, sự u ám và bão tố[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “một ngọn núi có thể sờ chạm được.” Ngữ cảnh cho thấy núi Si-nai là đối tượng được ngầm nói đến, nhưng câu Hy Lạp này không nêu rõ từ “núi”.'
    reason: alternative_reading
  - marker: b
    text: 'Hoặc dịch: “Vì anh chị em không đến gần điều có thể sờ chạm được, lửa cháy bừng, bóng tối dày đặc, sự u ám và bão tố.”'
    reason: previous_rendering
lexical_decisions:
- source_word: Οὐ γὰρ
  choice: Vì ... không
  rationale: Giữ sắc thái giải thích của γάρ, nối câu này với lập luận trước đó; οὐ phủ định động từ.
- source_word: προσεληλύθατε
  choice: anh chị em không đến gần
  rationale: Thì hoàn thành diễn tả việc đến gần với kết quả còn hiệu lực; “đến gần” tự nhiên và giữ hình ảnh tiếp cận hiện diện trong động từ.
- source_word: ψηλαφωμένῳ
  choice: một điều có thể sờ chạm được
  rationale: Phân từ mang nghĩa có thể sờ/chạm, trong khi câu Hy Lạp không nêu danh từ “núi”; cách dịch này giữ nguyên đối tượng chưa được nói rõ.
- source_word: κεκαυμένῳ πυρί
  choice: lửa cháy bừng
  rationale: Phân từ hoàn thành mô tả ngọn lửa đang ở trạng thái cháy; “cháy bừng” rõ ràng, sống động và tự nhiên.
- source_word: γνόφῳ
  choice: bóng tối
  rationale: Từ này chỉ bóng tối dày đặc; dịch là “bóng tối” để phân biệt tương đối với ζόφος kế tiếp.
- source_word: ζόφῳ
  choice: sự âm u
  rationale: Diễn tả cảnh tối tăm, u ám; “sự âm u” duy trì sự chồng lớp tu từ với γνόφος mà không đồng nhất hai từ.
- source_word: θυέλλῃ
  choice: bão tố
  rationale: Chỉ một cơn bão dữ dội; “bão tố” trang trọng vừa phải và quen thuộc trong tiếng Việt hiện đại.
theological_decisions:
- issue: Có bổ sung “núi” làm đối tượng được đến gần hay không
  choice: Không thêm “núi” trong chính văn; dịch là một thực tại có thể sờ chạm được.
  alternative: “một ngọn núi có thể sờ chạm được”
  rationale: Ngữ cảnh ám chỉ núi Si-nai, nhưng câu Hy Lạp này không có danh từ ὄρος (“núi”). Chính văn giữ sự không xác định của nguyên bản, còn chú thích nêu đối tượng được ngầm hiểu.
- issue: Phạm vi của chuỗi καί sau lời phủ định
  choice: Dùng “cùng” rồi liệt kê các hiện tượng dưới cùng một lời phủ định mở đầu.
  alternative: Lặp lại “cũng không đến gần” trước từng thành phần
  rationale: Chuỗi Hy Lạp dùng các liên từ καί, không lặp lại οὐ; cách dịch giữ một lời phủ định chi phối cả danh sách mà vẫn tự nhiên trong tiếng Việt.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh chị em” cho ngôi thứ hai số nhiều nhằm diễn đạt cộng đồng độc giả; dấu phẩy cuối câu cho thấy câu văn tiếp tục sang câu kế tiếp. Cả hai dấu chú thích [a], [b] đều xuất hiện trong chính văn.
