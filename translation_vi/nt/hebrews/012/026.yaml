source:
  edition: SBLGNT
  text: οὗ ἡ φωνὴ τὴν γῆν ἐσάλευσεν τότε, νῦν δὲ ἐπήγγελται λέγων· Ἔτι ἅπαξ ἐγὼ ⸀σείσω οὐ μόνον τὴν γῆν ἀλλὰ καὶ τὸν οὐρανόν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/026.yaml
  text: whose voice shook the earth then[a], but now he has promised, saying[b], “Yet once more I will shake not only the earth but also the heaven.”
translation:
  language: vi
  text: 'Khi ấy, tiếng Ngài đã làm rung chuyển đất; nhưng nay Ngài đã hứa, phán rằng[b]: “Còn một lần nữa, Ta sẽ làm rung chuyển không chỉ đất mà cả trời[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “cõi trời”. Tiếng Hy Lạp dùng danh từ số ít có mạo từ, sát nghĩa là “trời”.
    reason: lexical_alternative
  - marker: b
    text: Trích A-ghê 2:6.
    reason: cross_reference
lexical_decisions:
- source_word: οὗ ἡ φωνὴ
  choice: tiếng Ngài
  rationale: Đại từ quan hệ sở hữu chỉ về Đức Chúa Trời trong ngữ cảnh trước. Cách diễn đạt này tự nhiên trong tiếng Việt và vẫn gắn tiếng phán với chính Ngài.
- source_word: ἐσάλευσεν
  choice: đã làm rung chuyển
  rationale: Diễn đạt rõ tác động gây chấn động của động từ σαλεύω và phù hợp với biến cố tại Si-nai được gợi nhắc.
- source_word: τὴν γῆν
  choice: đất
  rationale: Trong thế đối lập với trời, γῆ chỉ cõi đất theo nghĩa rộng; “đất” vừa tự nhiên vừa giữ được cặp đất–trời.
- source_word: τότε
  choice: khi ấy
  rationale: Giữ sự đối chiếu thời gian trực tiếp với νῦν và phù hợp văn phong kể lại một biến cố trước kia.
- source_word: νῦν δὲ
  choice: nhưng nay
  rationale: Thể hiện rõ nét tương phản giữa lần rung chuyển trước kia và lời hứa hiện vẫn có hiệu lực.
- source_word: ἐπήγγελται
  choice: đã hứa
  rationale: Thì hoàn thành của ἐπαγγέλλομαι cho thấy lời hứa đã được ban và vẫn còn hiệu lực.
- source_word: λέγων
  choice: phán rằng
  rationale: Vì chủ thể là Đức Chúa Trời và ngay sau đó là lời trích trực tiếp, “phán rằng” tự nhiên, trang trọng và diễn đạt đúng chức năng dẫn lời.
- source_word: Ἔτι ἅπαξ
  choice: Còn một lần nữa
  rationale: Giữ cả ý của ἔτι và sắc thái nhấn mạnh rằng sẽ có thêm một lần rung chuyển nữa.
- source_word: σείσω
  choice: Ta sẽ làm rung chuyển
  rationale: Giữ hình ảnh chấn động mang tính tiên tri và làm rõ chủ thể ngôi thứ nhất trong lời trích.
- source_word: οὐ μόνον ... ἀλλὰ καὶ
  choice: không chỉ ... mà cả
  rationale: Đây là cấu trúc tương liên tự nhiên trong tiếng Việt, giữ nguyên sự mở rộng từ đất đến trời.
- source_word: τὸν οὐρανόν
  choice: trời
  rationale: Danh từ Hy Lạp ở số ít và có mạo từ, đối ứng với “đất”. “Trời” là cách diễn đạt tiếng Việt tự nhiên, rộng hơn “bầu trời” và không thu hẹp ý nghĩa vào khí quyển.
theological_decisions:
- issue: Đối tượng mà đại từ quan hệ chỉ đến và chủ thể của lời hứa
  choice: Dùng “Ngài” để chỉ Đức Chúa Trời, Đấng đã làm rung chuyển đất bằng tiếng phán và nay đã hứa về lần rung chuyển tương lai.
  alternative: Dịch bằng một kết cấu phiếm chỉ, không nêu rõ chủ thể có ngôi vị.
  rationale: Ngữ cảnh liền trước cùng lời trích từ A-ghê xác định Đức Chúa Trời là Đấng phán. Cách dịch làm rõ liên kết ngữ pháp mà không thêm nội dung giáo lý.
- issue: Phạm vi của hình ảnh đất và trời
  choice: Giữ cặp “đất” và “trời” theo nghĩa bao quát về trật tự thọ tạo.
  alternative: Dịch là “xứ” và “bầu trời”, khiến phạm vi mang tính địa phương hoặc vật lý hẹp hơn.
  rationale: Thế đối lập γῆ–οὐρανός mang tầm vóc vũ trụ trong lập luận của đoạn văn; bản dịch giữ phạm vi rộng nhưng không giải thích quá mức bản chất của biến cố.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” và “Ta” trong lời Đức Chúa Trời phán; dùng dấu chấm phẩy để làm rõ sự tương phản giữa “khi ấy” và “nay”. Dấu chú thích [a] được đặt ngay sau từ “trời”, là từ mà chú thích giải thích.
