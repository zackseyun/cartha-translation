id: HEB.12.25
reference: Hebrews 12:25
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Βλέπετε μὴ παραιτήσησθε τὸν λαλοῦντα· εἰ γὰρ ἐκεῖνοι οὐκ ⸀ἐξέφυγον ⸂ἐπὶ γῆς παραιτησάμενοι τὸν⸃ χρηματίζοντα, ⸀πολὺ μᾶλλον ἡμεῖς οἱ τὸν ἀπ’ οὐρανῶν ἀποστρεφόμενοι·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/025.yaml
  text: See to it that you do not refuse the one who is speaking[a]. For if those did not escape when they refused the one who warned them on earth[b], much less will we if we turn away from the one who warns from heaven.
translation:
  language: vi
  text: Hãy cẩn thận, đừng khước từ Đấng đang phán. Vì nếu những người kia đã không thoát được khi khước từ Đấng ban lời cảnh báo trên đất[a], thì chúng ta càng không thể thoát được nếu quay lưng lại với Đấng phán từ trời[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Đấng ban lời chỉ dẫn có thẩm quyền trên đất.” Động từ Hy Lạp có thể chỉ việc truyền đạt lời chỉ dẫn hoặc cảnh báo có thẩm quyền thiêng liêng.'
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn nói gọn: “Đấng từ trời”; đồng thời động từ “thoát được” ở vế này được hiểu từ vế trước.'
    reason: source_ellipsis
lexical_decisions:
- source_word: Βλέπετε
  choice: Hãy cẩn thận
  rationale: Động từ mệnh lệnh số nhiều mang sắc thái cảnh tỉnh và khuyên nhủ; cách dịch này tự nhiên trong tiếng Việt hiện đại mà vẫn giữ sức nặng của lời cảnh báo.
- source_word: μὴ παραιτήσησθε / παραιτησάμενοι
  choice: đừng khước từ / khi khước từ
  rationale: “Khước từ” diễn đạt hành vi từ chối nghe và vâng theo, đồng thời giữ được sự lặp lại có chủ ý của cùng một động từ Hy Lạp trong hai vế.
- source_word: τὸν λαλοῦντα
  choice: Đấng đang phán
  rationale: Phân từ hiện tại nhấn mạnh hành động đang diễn ra. “Đang phán” giữ tính trực tiếp của lời nói trong ngữ cảnh; “Đấng” là cách xưng hô trang trọng, không chỉ rõ đó là Đức Chúa Trời hay Đấng Christ.
- source_word: ἐξέφυγον
  choice: đã không thoát được
  rationale: Động từ chỉ việc không tránh khỏi hậu quả hoặc sự phán xét. Không thêm “hình phạt” để tránh diễn giải quá mức điều nguyên văn chỉ hàm ý.
- source_word: ἐπὶ γῆς
  choice: trên đất
  rationale: Giữ trực tiếp sự tương phản không gian với ἀπ’ οὐρανῶν, “từ trời”, mà không tự ý xác định địa điểm là núi Si-nai.
- source_word: χρηματίζοντα
  choice: Đấng ban lời cảnh báo
  rationale: Động từ có thể chỉ việc ban lời chỉ dẫn hay cảnh báo có thẩm quyền thần thượng. Trong mạch văn cảnh tỉnh này, “ban lời cảnh báo” truyền đạt phù hợp sắc thái mà vẫn để chú thích ghi nhận phạm vi nghĩa rộng hơn.
- source_word: πολὺ μᾶλλον
  choice: thì chúng ta càng không thể
  rationale: Đây là lập luận từ điều nhẹ hơn đến điều nghiêm trọng hơn. Cách diễn đạt phủ định này tự nhiên trong tiếng Việt và làm rõ hệ quả vốn được lược trong tiếng Hy Lạp.
- source_word: ἀποστρεφόμενοι
  choice: nếu quay lưng lại với
  rationale: Phân từ mô tả chúng ta trong trường hợp quay khỏi Đấng từ trời. Dùng “nếu” giúp câu tiếng Việt rõ mạch điều kiện mà không biến lời cảnh báo thành lời khẳng định rằng việc quay lưng chắc chắn đã xảy ra.
- source_word: τὸν ἀπ’ οὐρανῶν
  choice: Đấng phán từ trời
  rationale: Nguyên văn nói gọn là “Đấng từ trời”; bổ sung “phán” từ vế đầu để câu tiếng Việt tự nhiên và làm rõ sự đối chiếu, nhưng không xác định danh tính cụ thể của Đấng ấy.
theological_decisions:
- issue: Danh tính của Đấng đang phán và cảnh báo
  choice: Giữ cách gọi mô tả là “Đấng đang phán”, “Đấng ban lời cảnh báo” và “Đấng phán từ trời”.
  alternative: Nêu rõ là Đức Chúa Trời hoặc Đấng Christ.
  rationale: Ngữ cảnh cho thấy đây là lời phán có thẩm quyền thần thượng, nhưng chính câu này không dùng danh riêng hay tước hiệu cụ thể. Bản dịch vì thế không giải quyết thay độc giả sự căng thẳng về danh tính.
- issue: Động từ được lược trong vế sau
  choice: Bổ sung “không thể thoát được” trong vế tiếng Việt.
  alternative: 'Dịch sát hình thức: “thì chúng ta càng hơn nữa, là những người quay lưng...”'
  rationale: Tiếng Hy Lạp để người đọc tự hiểu lại động từ “thoát được” từ vế trước. Bổ sung động từ này là cần thiết để câu tiếng Việt trọn nghĩa, không thêm nội dung thần học.
- issue: Sắc thái điều kiện của ἀποστρεφόμενοι
  choice: Dịch là “nếu quay lưng lại với”.
  alternative: 'Dịch như một khẳng định: “chúng ta là những người quay lưng lại với”.'
  rationale: Cách dịch điều kiện phù hợp chức năng cảnh báo của câu và tránh khẳng định quá mức rằng mọi người nhận thư đã quay lưng, trong khi vẫn bảo toàn hậu quả nghiêm trọng được nêu.
translation_notes:
  register: Văn phong trang trọng, trực tiếp và dễ hiểu đối với độc giả tiếng Việt hiện đại. Dùng “khước từ” lặp lại để bảo toàn liên kết từ vựng của nguyên văn; dùng “Đấng” nhằm diễn đạt tôn kính mà không chốt danh tính là Đức Chúa Trời hay Đấng Christ. Mọi chú thích đều có ký hiệu tương ứng trong câu chính.
