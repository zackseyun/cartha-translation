  source_fidelity: 'Bản dịch chính truyền đạt đúng các thành tố chính của câu: phủ định thời gian «chưa», sự chống cự, giới hạn «đến mức đổ máu», và cuộc tranh đấu chống lại tội lỗi. Tuy nhiên, chú thích hiện nói là dịch sát nhưng câu trích «chống cự đến đổ máu» không phải cách tiếng Việt tự nhiên, còn phần diễn giải trật tự Hy Lạp «chưa đến máu mà chống cự» thiếu chính xác về cấu trúc và không cần thiết.'
