translation:
  language: vi
  text: Anh chị em chưa chống cự đến mức đổ máu trong cuộc chiến chống lại tội lỗi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Theo sát chữ Hy Lạp: “Anh chị em chưa chống cự cho đến máu.” Đây là một thành ngữ chỉ sự chống cự đến mức đổ máu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὔπω
  choice: chưa
  rationale: Trạng từ chỉ thời gian cho biết giới hạn được nói đến vẫn chưa đạt tới; “chưa” là cách diễn đạt tự nhiên và chính xác trong tiếng Việt.
- source_word: μέχρις αἵματος
  choice: đến mức đổ máu
  rationale: Cụm từ theo nghĩa sát là “đến máu”, diễn tả mức độ chống cự dẫn tới đổ máu; cách dịch này tự nhiên mà không xác định quá mức đó là tử đạo hay chỉ bị thương.
- source_word: ἀντικατέστητε
  choice: chống cự
  rationale: Động từ aorist, ngôi thứ hai số nhiều, chỉ việc đứng lên chống lại hoặc kháng cự; “chống cự” giữ được sắc thái xung đột của ngữ cảnh.
- source_word: πρὸς τὴν ἁμαρτίαν
  choice: chống lại tội lỗi
  rationale: Giới từ πρός với đối cách ở đây biểu thị sự đối nghịch. Không thêm diễn giải về loại tội lỗi để giữ nguyên độ rộng của nguyên văn.
- source_word: ἀνταγωνιζόμενοι
  choice: trong cuộc chiến
  rationale: Phân từ hiện tại mang hình ảnh thi đấu hoặc giao chiến, diễn tả hoàn cảnh và cách thức của sự chống cự; “trong cuộc chiến” truyền đạt tính liên tục và quyết liệt một cách tự nhiên.
theological_decisions:
- issue: Đối tượng được gọi là “tội lỗi” trong ngữ cảnh
  choice: Dịch khái quát là “tội lỗi”, không xác định hẹp hơn.
  alternative: Sự chống đối đầy tội lỗi của những kẻ bách hại; tội lỗi nói chung; cám dỗ từ bỏ đức tin.
  rationale: Ngữ cảnh nói cả về sự thù nghịch phải chịu đựng lẫn lời kêu gọi chống lại tội lỗi, nhưng chính câu này không thu hẹp đối tượng. Bản dịch giữ nguyên sự rộng nghĩa và căng thẳng thần học của nguyên văn.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “anh chị em” để biểu đạt ngôi thứ hai số nhiều một cách tự nhiên; giữ hình ảnh xung đột của nguyên văn và không giải thích quá mức nghĩa của “tội lỗi”.
