id: HEB.12.5
reference: Hebrews 12:5
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἐκλέλησθε τῆς παρακλήσεως, ἥτις ὑμῖν ὡς υἱοῖς διαλέγεται, Υἱέ μου, μὴ ὀλιγώρει παιδείας κυρίου, μηδὲ ἐκλύου ὑπ’ αὐτοῦ ἐλεγχόμενος·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/005.yaml
  text: 'And you have forgotten the exhortation that addresses you as sons: “My son[a], do not regard lightly the Lord’s discipline[c][b], nor lose heart when you are reproved by him.”'
translation:
  language: vi
  text: 'Anh chị em đã quên lời khuyên nhủ ngỏ cùng anh chị em như với các con trai rằng: “Con trai Ta[a], đừng xem nhẹ sự sửa dạy[b] của Chúa,[c] cũng đừng nản lòng khi được Ngài khiển trách.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn dùng “con trai” (số ít ở đây; số nhiều trong phần thân câu). Cách xưng hô từ Châm Ngôn này được áp dụng cho toàn cộng đồng những người con.
    reason: lexical_alternative
  - marker: b
    text: “Sự sửa dạy” cũng bao gồm ý huấn luyện, giáo dưỡng và uốn nắn, chứ không chỉ là hình phạt.
    reason: lexical_alternative
  - marker: c
    text: Trích dẫn Châm Ngôn 3:11.
    reason: cross_reference
lexical_decisions:
- source_word: ἐκλέλησθε
  choice: đã quên
  rationale: Thì hoàn thành diễn tả tình trạng hiện tại do việc quên gây nên; “đã quên” tự nhiên trong tiếng Việt và giữ được sắc thái quở trách.
- source_word: παρακλήσεως
  choice: lời khuyên nhủ
  rationale: Trong ngữ cảnh dẫn vào lời cảnh tỉnh từ Châm Ngôn, cách dịch này bao hàm sự khích lệ nhưng vẫn giữ trọng tâm khuyên bảo.
- source_word: ἥτις ὑμῖν ὡς υἱοῖς διαλέγεται
  choice: nói với anh chị em như với những người con
  rationale: Diễn đạt tự nhiên việc Kinh Thánh trực tiếp ngỏ lời với cộng đồng; “những người con” truyền đạt số nhiều và quan hệ con cái mà không giới hạn đối tượng vào nam giới.
- source_word: Υἱέ μου
  choice: Con của Ta
  rationale: Giữ lời gọi trực tiếp ở số ít trong câu trích dẫn và mối liên hệ cha-con, đồng thời là lối gọi tự nhiên, trang trọng trong tiếng Việt.
- source_word: ὀλιγώρει
  choice: đừng xem nhẹ
  rationale: Diễn tả việc coi là không đáng kể hoặc không nghiêm túc, không đẩy nghĩa sang thái độ mạnh hơn là khinh ghét.
- source_word: παιδείας
  choice: sự sửa dạy
  rationale: Bao gồm cả uốn nắn, huấn luyện và sửa trị; phù hợp với hình ảnh cha-con và không thu hẹp nghĩa vào hình phạt.
- source_word: κυρίου
  choice: của Chúa
  rationale: Giữ quan hệ sở hữu của nguyên văn và cách gọi κύριος theo lối dùng quen thuộc, trang trọng.
- source_word: ἐκλύου
  choice: đừng nản lòng
  rationale: Truyền đạt sự suy sụp tinh thần hoặc muốn buông xuôi dưới sự sửa dạy.
- source_word: ἐλεγχόμενος
  choice: khi được Ngài khiển trách
  rationale: Giữ sắc thái vạch rõ điều sai và quở trách trong bối cảnh sửa dạy, mạnh hơn “nhắc nhở” nhưng không chỉ hàm ý trừng phạt.
theological_decisions:
- issue: Ngôn ngữ quan hệ con cái có giống ngữ pháp nam trong υἱοῖς / Υἱέ
  choice: Dịch số nhiều là “những người con” và lời gọi số ít là “Con của Ta,” kèm chú thích về nguyên văn
  alternative: “các con trai” / “con trai của ta”
  rationale: υἱοῖς mang hình thức giống đực và liên kết với chủ đề địa vị làm con trong Hê-bơ-rơ, nhưng ở số nhiều nó ngỏ lời với toàn thể cộng đồng. “Những người con” giữ quan hệ con cái và phạm vi đại diện; chú thích bảo tồn đặc điểm nguyên văn và liên văn bản.
- issue: Phạm vi nghĩa của παιδεία trong mối quan hệ giữa Chúa và con người
  choice: sự sửa dạy
  alternative: sự kỷ luật; sự huấn luyện; sự sửa phạt
  rationale: “Sửa dạy” giữ cả chiều kích đào luyện lẫn uốn nắn có thể gây đau đớn, tránh thu hẹp thuật ngữ thành hình phạt hoặc chỉ thành giáo huấn.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “anh chị em” để làm rõ đối tượng số nhiều của lời khuyên; dùng “Ngài” cho đại từ chỉ Chúa. Cấu trúc câu giữ nhịp khuyên bảo và sự song song của hai mệnh lệnh phủ định trong câu trích.
