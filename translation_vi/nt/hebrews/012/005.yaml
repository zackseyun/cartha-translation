  source_fidelity: Bản dịch truyền đạt đúng cấu trúc khuyên bảo, thì hoàn thành của «đã quên», hai mệnh lệnh phủ định, và ý nghĩa của παιδεία. Tuy nhiên, «những người con» ở ὡς υἱοῖς đã trung hòa danh từ giống đực số nhiều của nguyên văn, trong khi câu trích vẫn dùng «Con trai Ta». Để bảo toàn liên kết từ vựng và lập luận về υἱός trong câu, nên dịch nhất quán là «các con trai» và giải thích phạm vi đại diện trong chú thích.
  naturalness: «Lời khuyên nhủ ... ngỏ cùng anh chị em» và «đừng nản lòng khi được Ngài khiển trách» là tiếng Việt hiện đại, trang trọng và tự nhiên. «Như với các con trai» hơi sát mặt chữ nhưng vẫn rõ nghĩa trong văn cảnh Kinh Thánh; chú thích giúp tránh hiểu sai là chỉ nhắm đến nam giới.
