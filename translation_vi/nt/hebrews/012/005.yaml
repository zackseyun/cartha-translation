- from: 'Anh chị em đã quên lời khuyên nhủ nói với anh chị em như với những người con rằng: “Con của Ta[a], đừng xem nhẹ sự sửa dạy[b] của Chúa,[c] cũng đừng nản lòng khi được Ngài khiển trách.”'
  to: 'Anh chị em đã quên lời khuyên nhủ ngỏ cùng anh chị em như với các con trai rằng: “Con trai Ta[a], đừng xem nhẹ sự sửa dạy[b] của Chúa,[c] cũng đừng nản lòng khi được Ngài khiển trách.”'
  rationale: Sửa «những người con» thành «các con trai» để phản ánh υἱοῖς và để liên kết nhất quán với «Con trai Ta» (Υἱέ μου). Chú thích a giải thích tính đại diện của cách xưng hô, không áp đặt một cách hiểu giáo phái. Các phần còn lại của bản dịch và chú thích giữ nguyên ý nghĩa.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T21:29:18Z'
