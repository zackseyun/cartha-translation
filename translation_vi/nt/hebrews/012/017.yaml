id: HEB.12.17
reference: Hebrews 12:17
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἴστε γὰρ ὅτι καὶ μετέπειτα θέλων κληρονομῆσαι τὴν εὐλογίαν ἀπεδοκιμάσθη, μετανοίας γὰρ τόπον οὐχ εὗρεν, καίπερ μετὰ δακρύων ἐκζητήσας αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/017.yaml
  text: For you know that afterward[a], when he wanted to inherit the blessing, he was rejected, for he found no opportunity for repentance[b], though he sought it with tears.
translation:
  language: vi
  text: Vì anh chị em biết rằng về sau, khi Ê-sau muốn thừa hưởng phước lành ấy, ông đã bị khước từ, vì ông không tìm được cơ hội để ăn năn[a], dù đã tìm kiếm điều ấy trong nước mắt[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “ông không tìm được chỗ cho sự ăn năn.” Câu này có thể nói đến việc ông không còn cơ hội đảo ngược kết quả, hoặc không thể khiến Y-sác đổi ý.'
    reason: alternative_reading
  - marker: b
    text: “Điều ấy” có thể chỉ “phước lành”, hoặc, ít có khả năng hơn, chỉ sự ăn năn/cơ hội vừa nói đến; tiếng Hy Lạp không xác định rõ đối tượng.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἴστε
  choice: anh chị em biết
  rationale: οἶδα ở dạng hoàn thành nhưng mang nghĩa hiện tại; cách xưng hô này diễn đạt tự nhiên lời tác giả trực tiếp nhắc cộng đồng độc giả.
- source_word: μετέπειτα
  choice: về sau
  rationale: Trạng từ chỉ thời gian tiếp theo, được chuyển sang tiếng Việt ngắn gọn và tự nhiên.
- source_word: θέλων κληρονομῆσαι τὴν εὐλογίαν
  choice: khi Ê-sau muốn thừa hưởng phước lành ấy
  rationale: Chuyển phân từ thành mệnh đề thời gian cho rõ nghĩa; thêm tên Ê-sau theo chủ thể hiển nhiên từ câu trước để tiếng Việt tránh đại từ mơ hồ, còn “thừa hưởng” giữ sắc thái κληρονομέω.
- source_word: ἀπεδοκιμάσθη
  choice: ông đã bị khước từ
  rationale: Giữ thể bị động và ý bị từ chối sau khi yêu cầu được xem xét, không gán nghĩa cứu rỗi mang tính kỹ thuật.
- source_word: μετανοίας ... τόπον οὐχ εὗρεν
  choice: ông không tìm được cơ hội để thay đổi điều đã xảy ra
  rationale: τόπον trong thành ngữ này chỉ chỗ hoặc cơ hội; μετανοία có nghĩa căn bản là thay đổi tâm trí. Cách diễn đạt theo ngữ cảnh tránh khiến độc giả mặc nhiên hiểu đây chỉ là sự ăn năn đạo đức của Ê-sau, đồng thời vẫn để mở việc kết quả không thể đảo ngược.
- source_word: μετὰ δακρύων
  choice: đã khóc lóc
  rationale: Diễn đạt tự nhiên phương cách và cảm xúc được cụm giới từ “với nước mắt” biểu thị.
- source_word: ἐκζητήσας αὐτήν
  choice: tìm kiếm điều ấy
  rationale: “Điều ấy” duy trì ở mức có thể sự mơ hồ của đại từ giống cái αὐτήν, vốn có thể quy về phước lành hoặc sự thay đổi/cơ hội.
theological_decisions:
- issue: Đối tượng của αὐτήν và ý nghĩa của μετανοίας τόπον
  choice: Bản văn chính dùng “điều ấy” và diễn đạt việc không tìm được cơ hội thay đổi điều đã xảy ra; chú thích nêu rõ các khả năng quy chiếu.
  alternative: Hiểu αὐτήν là phước lành; hoặc hiểu μετανοία là sự đổi ý của Y-sác; hoặc hiểu là cơ hội để chính Ê-sau ăn năn.
  rationale: Cú pháp Hy Lạp cho phép αὐτήν quy về εὐλογίαν hoặc μετάνοιαν; câu chuyện Sáng Thế Ký cũng cho phép hiểu trọng tâm là không thể đảo ngược kết quả hay không thể khiến Y-sác đổi ý. Không nên biến câu này thành một khẳng định giáo lý rằng Ê-sau không còn khả năng ăn năn.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại. Dùng “anh chị em” cho số nhiều ἴστε và “ông” cho Ê-sau; “phước lành” là từ ngữ Kinh Thánh quen thuộc. Hai chú thích bảo toàn sự mơ hồ cú pháp và căng thẳng thần học của nguyên văn.
