    rationale: Cụm này giải nghĩa kết quả của sự việc hơn là dịch cụm “chỗ/cơ hội cho sự ăn năn”, đồng thời loại bỏ từ ngữ then chốt μετανοία. Việc không thể đảo ngược kết quả nên được giữ trong chú thích như một khả năng diễn giải.
  - severity: low
