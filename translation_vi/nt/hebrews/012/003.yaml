id: HEB.12.3
reference: Hebrews 12:3
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἀναλογίσασθε γὰρ τὸν τοιαύτην ὑπομεμενηκότα ὑπὸ τῶν ἁμαρτωλῶν εἰς ⸀ἑαυτοὺς ἀντιλογίαν, ἵνα μὴ κάμητε ταῖς ψυχαῖς ὑμῶν ἐκλυόμενοι.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/003.yaml
  text: For consider the one who endured such opposition from sinners against himself[a], so that you may not grow weary[b], becoming discouraged in your souls.
translation:
  language: vi
  text: Vì vậy, hãy suy xét Đấng đã chịu đựng sự chống đối như thế của những người tội lỗi đối với chính họ, để anh chị em khỏi mệt mỏi, nản lòng trong tâm hồn[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Một số thủ bản chép: “đối với chính Ngài”; bản SBLGNT chép: “đối với chính họ.” Cách đọc số nhiều trong bản SBLGNT là một chỗ khó trong văn cảnh.'
    reason: textual_variant
lexical_decisions:
- source_word: Ἀναλογίσασθε
  choice: hãy suy ngẫm về
  rationale: Diễn đạt mệnh lệnh phải cân nhắc kỹ và có chủ ý; tự nhiên trong tiếng Việt hiện đại mà vẫn giữ sắc thái khuyên nhủ.
- source_word: τὸν ... ὑπομεμενηκότα
  choice: Đấng đã chịu đựng
  rationale: Danh hóa phân từ để chỉ Chúa Giê-su theo văn cảnh câu trước mà không thêm tên vào câu; thì hoàn thành nhấn mạnh sự chịu đựng đã diễn ra và còn có ý nghĩa.
- source_word: τοιαύτην ... ἀντιλογίαν
  choice: sự chống đối như thế
  rationale: Giữ phạm vi nghĩa rộng của τοιαύτην và diễn đạt ἀντιλογίαν là sự chống đối, không thu hẹp thành lời cãi lại.
- source_word: ὑπὸ τῶν ἁμαρτωλῶν
  choice: từ những người tội lỗi
  rationale: Giữ cách gọi trực tiếp và sự tương phản đạo đức của danh từ hóa ἁμαρτωλῶν.
- source_word: εἰς ἑαυτοὺς
  choice: nghịch lại chính họ
  rationale: Theo nguyên văn SBLGNT với đại từ phản thân số nhiều, dù cách đọc này khó và có thể hàm ý những người chống đối đã hành động gây hại cho chính mình; ghi chú bảo tồn dị bản số ít.
- source_word: κάμητε
  choice: mệt mỏi
  rationale: Truyền đạt nghĩa trở nên kiệt sức hoặc mỏi mệt trong lời khuyên phải bền chí.
- source_word: ταῖς ψυχαῖς ὑμῶν ἐκλυόμενοι
  choice: nản lòng trong tâm hồn
  rationale: Diễn đạt tự nhiên tình trạng suy sụp nội tâm, đồng thời giữ ngôn ngữ về ψυχή bằng 'tâm hồn'.
theological_decisions:
- issue: Đối tượng được gọi là τὸν τοιοῦτον
  choice: Dùng “Đấng” để chỉ Chúa Giê-su mà không lặp lại tên Ngài
  alternative: “người ấy” hoặc thêm rõ “Chúa Giê-su”
  rationale: Văn cảnh ngay trước đó xác định Chúa Giê-su là Đấng đang được nói đến. “Đấng” giúp tham chiếu rõ và trang trọng nhưng không thêm tên riêng vốn không có trong câu.
- issue: Đối tượng của sự chống đối trong εἰς ἑαυτούς
  choice: 'Theo SBLGNT: “nghịch lại chính họ”'
  alternative: 'Theo dị bản ἑαυτόν: “nghịch lại chính Ngài”'
  rationale: Bản chính phải phản ánh nguồn SBLGNT được cung cấp và bảo tồn sức căng của cách đọc số nhiều, thay vì âm thầm thay bằng dị bản dễ hiểu hơn. Dị bản và ý nghĩa theo văn cảnh được nêu trong chú thích.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh chị em” cho ngôi thứ hai số nhiều nhằm diễn đạt cộng đồng người nghe; cấu trúc câu giữ hai ý liên hệ là mệt mỏi và nản lòng, đồng thời tránh biến ψυχή thành một tuyên bố kỹ thuật về cấu tạo con người.
