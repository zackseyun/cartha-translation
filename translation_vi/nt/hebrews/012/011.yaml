id: HEB.12.11
reference: Hebrews 12:11
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: πᾶσα ⸀δὲ παιδεία πρὸς μὲν τὸ παρὸν οὐ δοκεῖ χαρᾶς εἶναι ἀλλὰ λύπης, ὕστερον δὲ καρπὸν εἰρηνικὸν τοῖς δι’ αὐτῆς γεγυμνασμένοις ἀποδίδωσιν δικαιοσύνης.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/011.yaml
  text: All discipline seems for the present to be not joy but sorrow[a]; yet later it yields the peaceful fruit of righteousness to those who have been trained by it.
translation:
  language: vi
  text: Mọi sự sửa dạy lúc này dường như không phải là niềm vui mà là nỗi buồn; nhưng về sau, nó sinh ra hoa trái bình an của sự công chính[a] cho những người đã nhờ đó mà được rèn luyện.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “công lý.” Từ Hy Lạp có thể chỉ sự công chính hoặc công lý; tại đây, từ này có lẽ nói đến đời sống ngay thẳng được sự sửa dạy của Đức Chúa Trời tạo nên.
    reason: lexical_alternative
lexical_decisions:
- source_word: παιδεία
  choice: sự sửa dạy
  rationale: Trong Hê-bơ-rơ 12, từ này chỉ sự uốn nắn mang tính cha con của Đức Chúa Trời, bao gồm cả sửa sai lẫn huấn luyện. “Sự sửa dạy” giữ được phạm vi ấy mà không thu hẹp thành hình phạt.
- source_word: πρὸς μὲν τὸ παρόν
  choice: lúc đang diễn ra
  rationale: Cụm này nêu trải nghiệm trong thời điểm hiện tại, đối lập với ὕστερον (“về sau”). Cách diễn đạt này tự nhiên trong tiếng Việt và tránh thêm một từ chỉ diễn tiến không có trong nguyên văn.
- source_word: οὐ δοκεῖ
  choice: dường như không phải
  rationale: Giữ sắc thái về điều con người cảm nhận hoặc thấy vào lúc ấy, thay vì biến câu thành một khẳng định tuyệt đối.
- source_word: χαρᾶς ... ἀλλὰ λύπης
  choice: không phải là niềm vui mà là nỗi buồn
  rationale: Giữ dạng danh từ và sự tương phản trực tiếp của nguyên văn, không diễn giải λύπη hẹp hơn thành đau đớn thể xác.
- source_word: ὕστερον
  choice: về sau
  rationale: Diễn đạt rõ kết quả xuất hiện sau thời gian sửa dạy và tạo thế đối lập tự nhiên với “lúc đang diễn ra”.
- source_word: καρπὸν εἰρηνικὸν
  choice: hoa trái bình an
  rationale: Giữ hình ảnh hoa trái và để tính từ “bình an” trực tiếp mô tả hoa trái, thay vì diễn giải thành hoa trái đem lại bình an.
- source_word: γεγυμνασμένοις
  choice: đã ... được rèn luyện
  rationale: Thể hoàn thành bị động mô tả những người đã được uốn luyện qua một quá trình. “Rèn luyện” cũng giữ được sắc thái luyện tập hàm chứa trong động từ Hy Lạp.
- source_word: ἀποδίδωσιν
  choice: sinh ra
  rationale: Đi với “hoa trái” một cách tự nhiên và thể hiện sự sửa dạy đem lại kết quả.
- source_word: δικαιοσύνης
  choice: sự công chính
  rationale: Trong ngữ cảnh này, từ chỉ phẩm chất ngay thẳng được sự sửa dạy tạo nên. “Sự công chính” giữ thuật ngữ thần học rộng hơn, còn khả năng “công lý” được ghi ở chú thích.
theological_decisions:
- issue: Ý nghĩa của παιδεία khi nói về hành động của Đức Chúa Trời đối với con cái Ngài
  choice: sự uốn nắn mang tính đào luyện, gồm sửa sai và huấn luyện
  alternative: hình phạt; hoặc chỉ sự dạy bảo
  rationale: Ngữ cảnh Hê-bơ-rơ 12:5–10 đặt παιδεία trong quan hệ cha con và hướng đến sự thánh khiết. “Sửa dạy” duy trì sức căng giữa tình yêu, việc sửa sai và sự đào luyện mà không biến hành động ấy thành sự trừng phạt thuần túy.
- issue: Cách hiểu δικαιοσύνης
  choice: sự công chính
  alternative: công lý
  rationale: Trong câu này, nghĩa chỉ đời sống ngay thẳng phù hợp nhất với hoa trái do sự sửa dạy sinh ra. Tuy vậy, phạm vi từ vựng có thể bao gồm “công lý”, nên phương án đó được bảo tồn trong chú thích.
- issue: Quan hệ của δικαιοσύνης với καρπὸν εἰρηνικὸν
  choice: hoa trái bình an của sự công chính
  alternative: hoa trái bình an, tức là sự công chính
  rationale: Giữ cấu trúc sở hữu của nguyên văn và không quyết định dứt khoát rằng sở hữu cách là giải thích đồng vị.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Câu giữ hình ảnh “hoa trái”, sắc thái cảm nhận của “dường như”, và sự tương phản giữa trải nghiệm hiện tại với kết quả về sau. Dấu chú thích được đặt ngay sau “sự công chính”, là từ mà chú thích giải thích.
