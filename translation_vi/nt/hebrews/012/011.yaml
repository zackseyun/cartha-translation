    rationale: Cụm Hy Lạp chỉ góc nhìn/thời điểm hiện tại, đối lập trực tiếp với ὕστερον (‘về sau’), chứ không nhấn mạnh việc kỷ luật đang diễn tiến. ‘Lúc này’ diễn đạt tự nhiên hơn mà không thêm ý.
