id: HEB.12.16
reference: Hebrews 12:16
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: μή τις πόρνος ἢ βέβηλος ὡς Ἠσαῦ, ὃς ἀντὶ βρώσεως μιᾶς ἀπέδετο τὰ πρωτοτόκια ⸀ἑαυτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/016.yaml
  text: that no one be sexually immoral or godless like Esau, who sold his own birthright for a single meal.
translation:
  language: vi
  text: đừng để ai gian dâm hoặc bất kính như Ê-sau, là người đã bán quyền trưởng nam của mình chỉ để đổi lấy một bữa ăn.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πόρνος
  choice: gian dâm
  rationale: Diễn đạt trực tiếp người sống vô luân về tình dục, phù hợp với nghĩa của danh từ Hy Lạp và văn phong Kinh Thánh hiện đại.
- source_word: βέβηλος
  choice: bất kính
  rationale: Từ này chỉ người coi thường điều thiêng liêng; “bất kính” tự nhiên hơn “phàm tục” khi dùng để mô tả một người, đồng thời không khẳng định quá mức rằng người ấy hoàn toàn vô thần.
- source_word: τὰ πρωτοτόκια
  choice: quyền trưởng nam
  rationale: Chỉ địa vị cùng các đặc quyền thuộc về con trưởng trong bối cảnh câu chuyện Ê-sau.
- source_word: ἀντὶ βρώσεως μιᾶς
  choice: chỉ để đổi lấy một bữa ăn
  rationale: 'Giữ nét tương phản nhấn mạnh của ἀντί và μιᾶς: đem quyền trưởng nam đổi lấy chỉ một bữa ăn.'
- source_word: ἀπέδετο
  choice: đã bán
  rationale: Động từ có nghĩa bán hoặc chuyển nhượng để nhận lại một vật khác; “đã bán” ngắn gọn và phù hợp với Sáng Thế Ký 25.
theological_decisions:
- issue: Phạm vi của cụm “như Ê-sau” đối với hai tính từ mô tả
  choice: Giữ cấu trúc “gian dâm hoặc bất kính như Ê-sau”
  alternative: Tách riêng để chỉ gọi Ê-sau là bất kính
  rationale: Cú pháp Hy Lạp cho phép người đọc liên hệ phép so sánh với cả cụm hoặc gần hơn với “bất kính”. Bản dịch không thêm dấu câu hay lời giải thích nhằm tránh giải quyết dứt khoát điều nguyên văn còn có thể hiểu theo hơn một cách.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu được giữ như một mệnh đề khuyên răn tiếp nối văn cảnh trước đó; dùng tên quen thuộc “Ê-sau” và thuật ngữ phổ thông “quyền trưởng nam”.
