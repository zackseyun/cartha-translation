id: HEB.12.23
reference: Hebrews 12:23
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἐκκλησίᾳ πρωτοτόκων ⸂ἀπογεγραμμένων ἐν οὐρανοῖς⸃, καὶ κριτῇ θεῷ πάντων, καὶ πνεύμασι δικαίων τετελειωμένων,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/023.yaml
  text: and to the assembly of the firstborn who are enrolled in the heavens[a], and to God, the judge of all, and to the spirits of righteous people made perfect,
translation:
  language: vi
  text: và đến hội chúng của những người con đầu lòng đã được ghi danh trên trời[a], đến Đức Chúa Trời, Đấng phán xét tất cả, và đến linh hồn của những người công chính đã được làm cho trọn vẹn,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “trong các cõi trời.” Tiếng Hy Lạp dùng dạng số nhiều: “trong các trời.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκκλησίᾳ
  choice: hội chúng
  rationale: Diễn đạt một cộng đồng được quy tụ trong bối cảnh Si-ôn trên trời, đồng thời tránh thu hẹp từ này vào nghĩa cơ cấu, tổ chức.
- source_word: πρωτοτόκων
  choice: những người con đầu lòng
  rationale: Giữ dạng số nhiều và ý niệm địa vị, đặc quyền thừa kế của con đầu lòng; không hiểu thành một danh xưng số ít chỉ về Đấng Christ.
- source_word: ἀπογεγραμμένων
  choice: đã được ghi danh
  rationale: Thể hoàn thành bị động chỉ việc tên đã được ghi vào sổ và tình trạng ấy vẫn còn hiệu lực.
- source_word: ἐν οὐρανοῖς
  choice: trên các tầng trời
  rationale: Giữ số nhiều của οὐρανοῖς bằng cách diễn đạt tự nhiên và trang trọng trong tiếng Việt.
- source_word: κριτῇ θεῷ πάντων
  choice: Đức Chúa Trời, Đấng phán xét mọi người
  rationale: Thể hiện quan hệ đồng vị giữa Đức Chúa Trời và Đấng phán xét; πάντων được hiểu là toàn thể mọi người trong ngữ cảnh xét xử.
- source_word: πνεύμασι
  choice: linh hồn
  rationale: Trong cụm nói về những người công chính, 'linh hồn' là cách nói tự nhiên trong tiếng Việt về phần phi thể chất của con người, thay vì gợi đến các linh thể nói chung.
- source_word: δικαίων
  choice: những người công chính
  rationale: Diễn đạt rõ đối tượng là con người và không hàm ý chỉ nam giới.
- source_word: τετελειωμένων
  choice: đã được làm cho trọn vẹn
  rationale: Giữ thể hoàn thành bị động và chủ đề τελειόω trong thư Hê-bơ-rơ về việc được đưa đến tình trạng trọn vẹn.
theological_decisions:
- issue: Danh tính của 'những người con đầu lòng'
  choice: Một danh xưng tập thể dành cho những người cùng hưởng địa vị và cơ nghiệp của con đầu lòng.
  alternative: Đấng Christ là Con Đầu Lòng, còn hội chúng thuộc về Ngài.
  rationale: Dạng số nhiều πρωτοτόκων nghiêng rõ về một tập thể; bản dịch không biến cụm này thành danh xưng số ít.
- issue: Đối tượng của 'linh hồn những người công chính đã được làm cho trọn vẹn'
  choice: Những người công chính trong trạng thái thuộc linh, đã được đưa đến sự trọn vẹn.
  alternative: Toàn thể những người công chính nói chung, bất kể đang có thân thể hay không.
  rationale: Cách diễn đạt tự nhiên nhất của πνεύμασι δικαίων là phần thuộc linh của những người công chính; bản dịch không thêm chi tiết về trạng thái trung gian mà câu không nói rõ.
- issue: Phạm vi của πάντων
  choice: '''mọi người'' trong cụm ''Đấng phán xét mọi người''.'
  alternative: '''muôn vật'' hoặc ''tất cả''.'
  rationale: Trong vai trò phán xét, 'mọi người' tự nhiên và rõ nghĩa trong tiếng Việt, dù từ Hy Lạp tự nó có thể mang phạm vi rộng hơn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ chuỗi các thành phần nối tiếp từ động từ 'đến' ở câu trước; lặp lại 'đến' để câu tiếng Việt rõ cấu trúc. Dùng 'các tầng trời' nhằm bảo toàn số nhiều Hy Lạp, kèm chú thích về cách nói số ít tự nhiên hơn.
