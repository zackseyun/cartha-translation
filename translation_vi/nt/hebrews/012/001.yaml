id: HEB.12.1
reference: Hebrews 12:1
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Τοιγαροῦν καὶ ἡμεῖς, τοσοῦτον ἔχοντες περικείμενον ἡμῖν νέφος μαρτύρων, ὄγκον ἀποθέμενοι πάντα καὶ τὴν εὐπερίστατον ἁμαρτίαν, δι’ ὑπομονῆς τρέχωμεν τὸν προκείμενον ἡμῖν ἀγῶνα,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/001.yaml
  text: Therefore[a], since we also have so great a cloud of witnesses surrounding us, laying aside every weight and the sin that so easily entangles, let us run with endurance the race set before us,
translation:
  language: vi
  text: Vì thế, vì chúng ta cũng có một đám mây nhân chứng đông đảo đến thế bao quanh chúng ta, hãy gạt bỏ mọi gánh nặng và tội lỗi dễ làm vướng víu[a], rồi kiên trì chạy cuộc đua được đặt trước mặt chúng ta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “tội lỗi bám quá sát” hoặc “tội lỗi dễ giăng bẫy.” Tính từ Hy Lạp này hiếm gặp và có thể nhấn mạnh việc gây vướng víu, giăng bẫy, hoặc bám chặt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοιγαροῦν καὶ ἡμεῖς
  choice: Vì thế, chúng ta cũng vậy
  rationale: Giữ lực suy luận nối với chương 11 và sắc thái καὶ ἡμεῖς, đưa các tín hữu hiện tại vào cùng mạch đức tin.
- source_word: τοσοῦτον ... νέφος μαρτύρων
  choice: một đám mây nhân chứng đông đảo
  rationale: Giữ hình ảnh ẩn dụ 'đám mây' và diễn đạt tự nhiên mức độ lớn lao của τοσοῦτον trong tiếng Việt hiện đại.
- source_word: περικείμενον ἡμῖν
  choice: bao quanh mình
  rationale: Diễn đạt vị trí ở khắp chung quanh; 'mình' quy chiếu tự nhiên về chủ thể 'chúng ta' trong câu.
- source_word: μαρτύρων
  choice: nhân chứng
  rationale: Giữ nghĩa những người làm chứng, trước hết liên hệ với các gương đức tin ở chương 11, mà không khẳng định họ chỉ là khán giả đang quan sát.
- source_word: ὄγκον ... πάντα
  choice: mọi gánh nặng
  rationale: ὄγκος chỉ khối nặng hoặc vật gây vướng víu; 'gánh nặng' vừa dễ hiểu vừa phù hợp hình ảnh người chạy loại bỏ điều cản trở.
- source_word: ἀποθέμενοι
  choice: hãy gạt bỏ
  rationale: Chuyển phân từ thành một mệnh lệnh phối hợp để câu tiếng Việt rõ và tự nhiên, đồng thời giữ ý loại bỏ dứt khoát.
- source_word: τὴν εὐπερίστατον ἁμαρτίαν
  choice: tội lỗi dễ vướng mắc
  rationale: Giữ 'tội lỗi' như một thực tại được xác định trong ngữ cảnh và chọn nghĩa phù hợp hình ảnh chạy đua; vì εὐπερίστατος hiếm và đa nghĩa, các khả năng khác được ghi ở chú thích.
- source_word: δι’ ὑπομονῆς
  choice: kiên trì
  rationale: Diễn đạt ὑπομονή là sự bền lòng chịu đựng và tiếp tục dưới khó khăn, bằng một trạng từ tự nhiên bổ nghĩa cho 'chạy'.
- source_word: τρέχωμεν
  choice: hãy ... chạy
  rationale: Thể giả định ngôi thứ nhất số nhiều mang ý khích lệ được chuyển bằng cấu trúc 'hãy' bao gồm cả người nói lẫn người nghe.
- source_word: τὸν προκείμενον ἡμῖν ἀγῶνα
  choice: cuộc đua đã được đặt ra trước mặt chúng ta
  rationale: Trong ngữ cảnh có động từ 'chạy', 'cuộc đua' là nghĩa thích hợp của ἀγών; cách diễn đạt này cũng giữ ý về một chặng đường được đặt sẵn phía trước.
theological_decisions:
- issue: Ý nghĩa của 'nhân chứng' trong quan hệ với Hê-bơ-rơ 11
  choice: Giữ 'nhân chứng', để trước hết chỉ những người mà đời sống làm chứng cho đức tin, đồng thời giữ nguyên hình ảnh họ bao quanh chúng ta
  alternative: Diễn giải họ chủ yếu là các khán giả trên trời đang quan sát tín hữu chạy đua
  rationale: Mạch văn nhìn lại các nhân vật của chương 11, nhưng chính câu này không giải thích rõ họ có đang quan sát hay không. Bản dịch không áp đặt cách hiểu ấy.
- issue: Tội lỗi được nói đến có phải một tội cụ thể hay không
  choice: Dịch là 'tội lỗi' mà không nêu tên một tội cụ thể
  alternative: Đồng nhất với tội vô tín hoặc một tội riêng biệt khác
  rationale: Mạo từ Hy Lạp trình bày tội lỗi như một thực tại xác định trong lời khuyên, nhưng câu không gọi tên một tội riêng; bản dịch giữ sự căng thẳng này.
translation_notes:
  register: Văn phong trang trọng vừa phải, hiện đại và dễ hiểu. Cấu trúc câu được điều chỉnh nhẹ sang tiếng Việt tự nhiên, nhưng vẫn giữ hình ảnh đám mây, gánh nặng và cuộc đua, cùng lời khích lệ ở ngôi thứ nhất số nhiều.
