source:
  edition: SBLGNT
  text: Εἰρήνην διώκετε μετὰ πάντων, καὶ τὸν ἁγιασμόν, οὗ χωρὶς οὐδεὶς ὄψεται τὸν κύριον,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/014.yaml
  text: Pursue peace with everyone[a], and the holiness without which no one will see the Lord.
translation:
  language: vi
  text: Hãy theo đuổi sự hòa thuận với mọi người và sự thánh khiết[a]; không có sự thánh khiết ấy thì không ai sẽ thấy Chúa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “sự nên thánh”. Từ Hy Lạp này có thể chỉ sự thánh khiết như một phẩm chất trong đời sống, hoặc tiến trình được làm cho nên thánh.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰρήνην
  choice: sự hòa thuận
  rationale: Trong cụm đi với “mọi người”, εἰρήνη nói đến quan hệ hòa bình, hòa thuận với người khác hơn là chỉ một cảm giác bình an nội tâm.
- source_word: διώκετε
  choice: Hãy theo đuổi
  rationale: Giữ được sắc thái chủ động, bền bỉ và khẩn thiết của động từ διώκω trong lời khuyên bảo.
- source_word: μετὰ πάντων
  choice: với mọi người
  rationale: Diễn đạt tự nhiên và giữ nguyên phạm vi bao quát của πάντων.
- source_word: τὸν ἁγιασμόν
  choice: sự thánh khiết
  rationale: ἁγιασμός có thể chỉ phẩm chất/trạng thái thánh khiết hoặc tiến trình được nên thánh. “Sự thánh khiết” rõ ràng, tự nhiên trong lời khuyên về đời sống, còn nghĩa kia được ghi ở chú thích.
- source_word: οὗ χωρὶς
  choice: nếu không có sự thánh khiết ấy
  rationale: Đại từ quan hệ giống đực số ít quy chiếu tự nhiên về ἁγιασμός. Cách diễn đạt này làm rõ mối liên hệ trong tiếng Việt mà không thay đổi điều kiện nghiêm trọng của câu.
- source_word: οὐδεὶς ὄψεται
  choice: không ai sẽ thấy
  rationale: Chuyển tải trực tiếp phủ định tuyệt đối οὐδείς và thì tương lai của ὁράω.
- source_word: τὸν κύριον
  choice: Chúa
  rationale: Giữ nguyên tước hiệu κύριος, không tự ý xác định là Đức Chúa Trời hay Chúa Giê-su; “Chúa” là cách gọi tự nhiên và trang trọng trong tiếng Việt.
theological_decisions:
- issue: Ý nghĩa của ἁγιασμός trong lời khuyên bảo
  choice: Dịch là “sự thánh khiết”.
  alternative: sự nên thánh
  rationale: Ngữ cảnh kêu gọi người đọc tích cực theo đuổi một đời sống có phẩm chất thánh khiết. “Sự nên thánh” cũng hợp lệ nhưng dễ được hiểu như một thuật ngữ chỉ tiến trình thần học; chú thích bảo tồn khả năng ấy.
- issue: Đối tượng được gọi là τὸν κύριον
  choice: Giữ là “Chúa”, không xác định thêm.
  alternative: Đức Chúa Trời; Chúa Giê-su
  rationale: Bản Hy Lạp chỉ dùng tước hiệu “Chúa”. Bản dịch giữ sự không xác định của nguyên văn, tránh thu hẹp đối tượng quy chiếu theo một cách giải thích riêng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Sự hòa thuận với mọi người” làm nổi bật chiều kích quan hệ của εἰρήνη; “theo đuổi” giữ sức nặng của mệnh lệnh. Lặp lại “sự thánh khiết ấy” để quy chiếu rõ ràng trong tiếng Việt.
