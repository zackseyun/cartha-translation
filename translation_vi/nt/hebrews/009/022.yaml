language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ σχεδὸν ἐν αἵματι πάντα καθαρίζεται κατὰ τὸν νόμον, καὶ χωρὶς αἱματεκχυσίας οὐ γίνεται ἄφεσις.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/022.yaml
  text: And according to the law[a], almost everything is cleansed with blood, and without the shedding of blood there is no forgiveness.
translation:
  language: vi
  text: Theo Luật pháp, hầu như mọi thứ đều được thanh tẩy bằng máu, và không có sự tha thứ nếu không có sự đổ máu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “sự xá miễn”; từ Hy Lạp này cũng có thể chỉ sự giải thoát hoặc sự tha miễn, nhưng ở đây nói đến sự tha thứ tội lỗi.
    reason: lexical_alternative
lexical_decisions:
- source_word: σχεδόν
  choice: hầu như
  rationale: Trạng từ này giới hạn phạm vi của πάντα, cho thấy lời khẳng định không áp dụng tuyệt đối cho mọi trường hợp thanh tẩy theo luật pháp.
- source_word: ἐν αἵματι
  choice: bằng huyết
  rationale: ἐν mang nghĩa phương tiện trong ngữ cảnh nghi lễ; “bằng huyết” vừa tự nhiên trong tiếng Việt vừa giữ được sắc thái tế lễ.
- source_word: πάντα
  choice: mọi vật
  rationale: Dạng trung tính số nhiều chỉ rộng đến các vật hoặc các điều thuộc nghi lễ đang được bàn đến; “mọi vật” tránh biến câu thành lời khẳng định về mọi sự nói chung.
- source_word: καθαρίζεται
  choice: đều được thanh tẩy
  rationale: Thể bị động hiện tại diễn tả thông lệ theo luật pháp. “Thanh tẩy” giữ rõ sắc thái nghi lễ hơn “làm sạch” trong văn cảnh này.
- source_word: κατὰ τὸν νόμον
  choice: theo luật pháp
  rationale: κατά diễn tả sự phù hợp với hệ thống luật pháp Môi-se; cách dịch này chính xác và không diễn giải quá mức.
- source_word: χωρὶς
  choice: nếu không có
  rationale: Trong mệnh đề châm ngôn này, cách diễn đạt có điều kiện là tự nhiên trong tiếng Việt và vẫn truyền đạt ý nghĩa thiếu vắng của χωρὶς.
- source_word: αἱματεκχυσίας
  choice: sự đổ huyết
  rationale: Danh từ chỉ việc huyết bị đổ ra, đặc biệt trong bối cảnh sinh tế; “sự đổ huyết” ngắn gọn và giữ được âm hưởng tế lễ.
- source_word: οὐ γίνεται
  choice: không có
  rationale: Kết hợp với danh từ trừu tượng ἄφεσις, động từ mang nghĩa một thực tại không xảy ra hay không hiện hữu; “không có” là cách nói tự nhiên.
- source_word: ἄφεσις
  choice: sự tha thứ
  rationale: Trong lập luận về tế lễ và tội lỗi, từ này chỉ sự tha thứ hay xóa bỏ tội; “sự tha thứ” rõ ràng với độc giả hiện đại, đồng thời chú thích bảo lưu nghĩa gần là “sự miễn xá”.
theological_decisions:
- issue: Cách hiểu ἄφεσις trong bối cảnh tế lễ
  choice: sự tha thứ
  alternative: sự miễn xá
  rationale: “Sự tha thứ” truyền đạt tự nhiên ý nghĩa liên quan đến tội lỗi trong mạch lập luận của thư Hê-bơ-rơ mà không áp đặt một hệ thống giáo lý hẹp; “sự miễn xá” được giữ trong chú thích như một khả năng từ vựng.
- issue: Phạm vi của nguyên tắc về huyết
  choice: giữ từ hạn định “hầu như”
  alternative: lược bỏ từ hạn định để tạo lời khẳng định tuyệt đối
  rationale: σχεδόν là thành phần rõ ràng của bản Hy Lạp và phải được giữ lại, vì tác giả thừa nhận rằng không phải tuyệt đối mọi nghi thức thanh tẩy theo luật pháp đều dùng huyết.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “luật pháp,” “thanh tẩy” và “huyết” để giữ sắc thái nghi lễ của văn cảnh; cấu trúc câu cân đối, gần với lập luận nguyên bản mà vẫn tự nhiên trong tiếng Việt.
