  rationale: Bản sửa chỉ hiện đại hóa từ ngữ và làm chú thích từ vựng rõ, tự nhiên hơn. Trật tự và các yếu tố ngữ nghĩa của nguyên văn—đặc biệt “hầu như”, phương tiện bằng máu, và sự cần thiết của việc đổ máu đối với sự tha thứ—đều được giữ nguyên.
