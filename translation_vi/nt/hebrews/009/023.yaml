source:
  edition: SBLGNT
  text: Ἀνάγκη οὖν τὰ μὲν ὑποδείγματα τῶν ἐν τοῖς οὐρανοῖς τούτοις καθαρίζεσθαι, αὐτὰ δὲ τὰ ἐπουράνια κρείττοσι θυσίαις παρὰ ταύτας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/023.yaml
  text: Therefore it was necessary for the copies of the things in the heavens to be cleansed with these[c][b][a], but the heavenly things themselves with better sacrifices than these.
translation:
  language: vi
  text: Vì vậy, những bản sao[a] của các sự vật ở trên trời cần được thanh tẩy[b] bằng những điều này; còn chính các sự vật trên trời thì cần được thanh tẩy bằng những sinh tế tốt hơn những sinh tế ấy.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “các khuôn mẫu” hoặc “các hình ảnh tượng trưng”.
    reason: lexical_alternative
  - marker: b
    text: Động từ này là ngôn ngữ nghi lễ, cũng có thể dịch là “được làm cho tinh sạch”.
    reason: lexical_alternative
  - marker: c
    text: Tiếng Hy Lạp dùng “những sinh tế” ở số nhiều, dù mạch văn của thư Hê-bơ-rơ tập trung vào lễ dâng một lần đủ cả của Đấng Mê-si-a.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀνάγκη οὖν
  choice: Vì vậy, ... cần phải
  rationale: “Vì vậy” diễn đạt quan hệ suy luận của οὖν; “cần phải” chuyển tự nhiên cấu trúc vô nhân xưng Ἀνάγκη trong tiếng Việt và phù hợp với lời giải thích về nghi lễ đã nêu.
- source_word: ὑποδείγματα
  choice: các bản sao
  rationale: Từ này chỉ những vật dưới đất tương ứng với những gì trên trời. “Bản sao” làm rõ sự tương phản với chính những điều trên trời mà không diễn giải quá mức.
- source_word: τῶν ἐν τοῖς οὐρανοῖς
  choice: của những gì trong các tầng trời
  rationale: Cách dịch này giữ ý nghĩa khái quát của danh hóa trung tính và phản ánh dạng số nhiều οὐρανοῖς, đồng thời vẫn dễ hiểu trong văn phong Kinh Thánh tiếng Việt.
- source_word: καθαρίζεσθαι
  choice: được thanh tẩy
  rationale: “Thanh tẩy” giữ sắc thái nghi lễ của động từ, thích hợp với ngữ cảnh huyết và sinh tế hơn cách nói thuần vệ sinh như “làm sạch”.
- source_word: τούτοις
  choice: bằng những thứ này
  rationale: Giữ nguyên tính chỉ định nhưng không xác định rõ hơn điều bản văn Hy Lạp không gọi tên tại đây; ngữ cảnh trước đó cung cấp phương tiện thanh tẩy.
- source_word: αὐτὰ δὲ τὰ ἐπουράνια
  choice: còn chính những điều trên trời
  rationale: “Chính” thể hiện sự nhấn mạnh của αὐτά; “những điều trên trời” giữ cách nói rộng và không tự ý đồng nhất với đền thánh hay con người.
- source_word: κρείττοσι θυσίαις
  choice: bằng những sinh tế tốt hơn
  rationale: “Tốt hơn” phản ánh từ khóa κρείττων trong thư Hê-bơ-rơ; “những sinh tế” giữ nguyên số nhiều của θυσίαις.
- source_word: παρὰ ταύτας
  choice: tốt hơn những thứ ấy
  rationale: παρά đi với dạng so sánh mang nghĩa “hơn”; đại từ chỉ định được giữ khái quát như trong nguyên văn.
theological_decisions:
- issue: Việc những điều trên trời cần được thanh tẩy
  choice: Giữ nguyên lời khẳng định rằng chính những điều trên trời phải được thanh tẩy.
  alternative: Diễn giải “những điều trên trời” thành đền thánh trên trời, dân thuộc về trời, hoặc viết lại để tránh ý niệm trời cần thanh tẩy.
  rationale: Nguyên văn cố ý đặt các bản sao dưới đất đối lập với chính những điều trên trời và dùng ngôn ngữ thanh tẩy cho cả hai. Bản dịch giữ nguyên sức căng thần học thay vì giải quyết bằng một cách diễn giải riêng.
- issue: Dạng số nhiều của “sinh tế” trong mối liên hệ với lễ dâng một lần đủ cả
  choice: Giữ “những sinh tế” ở số nhiều.
  alternative: Đổi thành số ít “sinh tế” để hài hòa với sự dâng mình một lần của Đấng Mê-si-a.
  rationale: θυσίαις là số nhiều. Giữ số nhiều tôn trọng chứng cứ nguyên ngữ và không âm thầm hài hòa câu này với những câu khác trong thư.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. “Thanh tẩy” cùng “sinh tế” giữ sắc thái nghi lễ cần thiết; “các tầng trời” phản ánh số nhiều của nguyên ngữ. Dấu chấm phẩy giúp người đọc nhận rõ hai vế tương phản.
