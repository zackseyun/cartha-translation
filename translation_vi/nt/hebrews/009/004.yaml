id: HEB.9.4
reference: Hebrews 9:4
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: χρυσοῦν ἔχουσα θυμιατήριον καὶ τὴν κιβωτὸν τῆς διαθήκης περικεκαλυμμένην πάντοθεν χρυσίῳ, ἐν ᾗ στάμνος χρυσῆ ἔχουσα τὸ μάννα καὶ ἡ ῥάβδος Ἀαρὼν ἡ βλαστήσασα καὶ αἱ πλάκες τῆς διαθήκης,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/004.yaml
  text: having the golden censer[a], and the ark of the covenant covered on all sides with gold, in which were a golden jar holding the manna, Aaron’s staff that budded, and the tablets of the covenant,
translation:
  language: vi
  text: có bàn thờ dâng hương bằng vàng[a] và Hòm Giao Ước được dát vàng mọi phía. Trong hòm có một bình bằng vàng đựng ma-na, cây gậy của A-rôn đã nảy chồi, và các bảng Giao Ước.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “lư hương bằng vàng.” Từ Hy Lạp ở đây có thể chỉ một dụng cụ đốt hương hoặc bàn thờ dâng hương, nên cách hiểu còn được tranh luận.'
    reason: alternative_reading
lexical_decisions:
- source_word: θυμιατήριον
  choice: bàn thờ dâng hương
  rationale: Từ Hy Lạp có thể chỉ bàn thờ dâng hương hoặc lư hương. Trong phần mô tả Đền Tạm, “bàn thờ dâng hương” là cách hiểu tự nhiên, nhưng dị nghĩa thật sự được giữ trong chú thích.
- source_word: χρυσοῦν
  choice: bằng vàng
  rationale: Diễn đạt tự nhiên và chính xác vật liệu bằng tiếng Việt hiện đại.
- source_word: κιβωτὸν τῆς διαθήκης
  choice: Hòm Giao Ước
  rationale: Cách gọi quen thuộc, rõ nghĩa đối với chiếc hòm thánh; viết hoa như danh xưng riêng đã ổn định.
- source_word: περικεκαλυμμένην πάντοθεν χρυσίῳ
  choice: được dát vàng mọi phía
  rationale: Thể hiện việc vàng bao phủ toàn bộ các phía, đồng thời dùng cách nói tự nhiên cho một vật được bọc phủ bằng vàng.
- source_word: ἐν ᾗ
  choice: Trong hòm có
  rationale: Đại từ quan hệ giống cái số ít quy chiếu về chiếc hòm; lặp lại “hòm” giúp câu tiếng Việt rõ ràng.
- source_word: στάμνος χρυσῆ ἔχουσα τὸ μάννα
  choice: một bình bằng vàng đựng ma-na
  rationale: “Bình” là từ thông dụng cho στάμνος; “đựng” chuyển tải ἔχουσα tự nhiên.
- source_word: μάννα
  choice: ma-na
  rationale: Dùng dạng phiên âm quen thuộc trong tiếng Việt.
- source_word: ῥάβδος Ἀαρὼν ἡ βλαστήσασα
  choice: cây gậy của A-rôn đã nảy chồi
  rationale: “Cây gậy” là cách nói hiện đại; “đã nảy chồi” giữ sắc thái sự kiện đã xảy ra của phân từ aorist.
- source_word: πλάκες τῆς διαθήκης
  choice: các bảng Giao Ước
  rationale: Giữ đúng “các bảng” và “giao ước”; không thêm “bằng đá” vì câu Hy Lạp không nói rõ chất liệu.
- source_word: διαθήκης
  choice: Giao Ước
  rationale: Phù hợp ngữ cảnh thờ phượng và thần học Kinh Thánh hơn “di chúc”; viết hoa trong danh xưng Hòm Giao Ước và các bảng Giao Ước.
theological_decisions:
- issue: Nghĩa của θυμιατήριον trong phần mô tả nơi thánh
  choice: bàn thờ dâng hương
  alternative: lư hương bằng vàng
  rationale: Từ này có thể chỉ dụng cụ đốt hương hoặc bàn thờ dâng hương, và cách bố trí các vật dụng Đền Tạm khiến cách hiểu tại đây từ lâu còn tranh luận. Bản chính chọn vật dụng thờ phượng có vẻ phù hợp hơn với ngữ cảnh mô tả, nhưng không xóa bỏ cách hiểu kia.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Câu tiếp nối cú pháp của Hê-bơ-rơ 9:2–3, nên mở đầu bằng “có”. Dùng “dát vàng” cho đồ thánh được phủ vàng và giữ dấu chú thích [a] ngay sau cụm từ có dị nghĩa.
