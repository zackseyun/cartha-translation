  yaml_path: translation/nt/hebrews/009/016.yaml
  text: For where there is a covenant[a], it is necessary for the death of the one who made it to be brought forward.
translation:
  language: vi
  text: Vì nơi nào có giao ước[a], ở đó cần phải xác nhận cái chết của người lập giao ước ấy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Vì nơi nào có di chúc, ở đó cần phải xác nhận cái chết của người lập di chúc.” Từ Hy Lạp diathēkē có thể có nghĩa là “giao ước” hoặc “di chúc”; nhiều người hiểu câu 16–17 theo nghĩa pháp lý ở đây.'
    reason: alternative_reading
lexical_decisions:
- source_word: διαθήκη
  choice: giao ước
  rationale: Mạch văn Hê-bơ-rơ 8–10 chủ yếu bàn về giao ước, đặc biệt dựa trên Giê-rê-mi 31 và việc thiết lập giao ước bằng huyết. Tuy nhiên, từ Hy Lạp này cũng có thể mang nghĩa pháp lý là “di chúc”, nên nghĩa ấy được giữ trong chú thích.
- source_word: θάνατον
  choice: cái chết
  rationale: Cách dịch trực tiếp của θάνατος, chỉ sự chết thực sự đang được nói đến như điều cần thiết.
- source_word: ἀνάγκη
  choice: phải
  rationale: Diễn đạt tự nhiên trong tiếng Việt ý nghĩa về sự cần thiết, không làm tăng mức độ khẳng định của nguyên văn.
- source_word: φέρεσθαι
  choice: được đưa ra
  rationale: Giữ hình ảnh cơ bản của thể bị động φέρω là “được mang/đưa ra”, đồng thời phù hợp với sắc thái đưa một sự kiện ra làm căn cứ; tránh diễn giải quá mức thành “được xác lập”.
- source_word: τοῦ διαθεμένου
  choice: người lập giao ước ấy
  rationale: Phân từ của διατίθεμαι chỉ người lập hoặc thiết lập διαθήκη. Cách dịch này tự nhiên, làm rõ đối tượng trong câu và không ép nghĩa hẹp thành “người lập di chúc”.
- source_word: ὅπου γὰρ
  choice: Vì ở đâu
  rationale: Giữ cả chức năng giải thích của γάρ và cấu trúc chỉ hoàn cảnh của ὅπου.
theological_decisions:
- issue: Nên hiểu διαθήκη trong Hê-bơ-rơ 9:16 là “giao ước” hay “di chúc”
  choice: Dùng “giao ước” trong chính văn và ghi “di chúc” ở chú thích
  alternative: Dùng “di chúc” trong chính văn
  rationale: Toàn bộ lập luận rộng hơn của Hê-bơ-rơ 8–10 tập trung vào giao ước, nhưng 9:16–17 có thể được hiểu theo nghĩa pháp lý của di chúc. Chính văn giữ tính liên tục của mạch giao ước, còn chú thích bảo tồn cách hiểu hợp lý khác.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Cấu trúc hơi cô đọng nhằm giữ nét lập luận của nguyên văn; chú thích bảo tồn sự nhập nhằng có thật của διαθήκη.
