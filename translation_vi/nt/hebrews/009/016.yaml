review_pass:
  verdict: revise
  source_fidelity: Bản thảo giữ được liên kết giải thích của γάρ, tính tất yếu của ἀνάγκη và cách hiểu “giao ước” cho διαθήκη. Tuy nhiên, “cái chết ... phải được đưa ra” là cách chuyển quá sát hình ảnh của φέρεσθαι nhưng không diễn đạt được chức năng pháp lý/chứng cứ của cụm từ trong tiếng Việt. Trong ngữ cảnh đang tranh luận này, cách nói “cần phải xác nhận cái chết” diễn đạt tự nhiên hơn yêu cầu rằng cái chết của người lập phải được đặt làm sự kiện được xác lập, mà không quyết định dứt khoát giữa “giao ước” và “di chúc.”
  naturalness: “Vì ở đâu có ... thì ... phải được đưa ra” gượng và có thể khiến người đọc hiểu rằng thi thể hoặc cái chết được đem trình bày theo nghĩa đen. “Vì nơi nào có ..., ở đó cần phải xác nhận ...” là cấu trúc Việt ngữ hiện đại, trang trọng và mạch lạc hơn.
  terminology: Giữ “giao ước” trong chính văn là có thể chấp nhận được vì mạch văn Hê-bơ-rơ 8–10; chú thích cần tiếp tục nêu rõ phương án “di chúc” và tính tranh luận của câu 16–17. “Người lập giao ước/di chúc” phù hợp, không áp đặt thuật ngữ thần học hoặc pháp lý hẹp hơn cần thiết.
  issues:
  - severity: medium
    issue: “cái chết của người lập giao ước ấy phải được đưa ra” không tự nhiên và mơ hồ sai hướng trong tiếng Việt.
    rationale: Thể bị động φέρεσθαι có thể mang sắc thái một sự việc được đưa ra/xuất trình làm căn cứ trong văn cảnh pháp lý. Dịch chữ “được đưa ra” với “cái chết” không chuyển tải được sắc thái này cho độc giả Việt và dễ bị hiểu theo nghĩa vật lý.
  - severity: low
    issue: Chú thích dùng “được chứng minh” trong khi chính văn dùng “được đưa ra,” tạo chênh lệch không được giải thích về cùng cụm θάνατον ... φέρεσθαι.
    rationale: Dùng nhất quán “cần phải xác nhận” trong cả chính văn và phương án di chúc sẽ rõ hơn, đồng thời vẫn không khẳng định quá mức một nghĩa duy nhất của φέρεσθαι.
