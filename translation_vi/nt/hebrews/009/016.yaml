  rationale: Sửa cách diễn đạt φέρεσθαι để câu tiếng Việt tự nhiên và thể hiện sắc thái xác nhận/xuất trình làm căn cứ vốn có thể có trong ngữ cảnh pháp lý. Giữ “giao ước” ở chính văn theo mạch lập luận rộng hơn, đồng thời bảo tồn đầy đủ cách hiểu “di chúc” trong chú thích.
