source:
  edition: SBLGNT
  text: ὑπεράνω δὲ αὐτῆς Χερουβὶν δόξης κατασκιάζοντα τὸ ἱλαστήριον· περὶ ὧν οὐκ ἔστιν νῦν λέγειν κατὰ μέρος.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/005.yaml
  text: And above it were the cherubim of glory overshadowing the atoning sacrifice[a]; about these things it is not now possible to speak in detail.
translation:
  language: vi
  text: Phía trên hòm ấy có các chê-ru-bim vinh hiển rủ bóng trên nắp Hòm Giao Ước[a]. Về những điều đó, bây giờ không thể nói từng điều một.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “ngai thương xót”, tức nắp của Hòm Giao Ước; từ Hy Lạp này cũng có thể được hiểu là “phương tiện chuộc tội” hoặc “lễ vật chuộc tội”.
    reason: Giữ các cách hiểu của ἱλαστήριον, đồng thời làm rõ rằng trong ngữ cảnh Đền Tạm từ này chỉ nắp của Hòm Giao Ước.
lexical_decisions:
- source_word: ὑπεράνω δὲ αὐτῆς
  choice: Phía trên hòm ấy
  rationale: Cụm từ chỉ vị trí ở bên trên; đại từ giống cái αὐτῆς quy chiếu về Hòm Giao Ước trong ngữ cảnh trước. Nêu rõ “hòm ấy” giúp câu tiếng Việt tự nhiên và tránh đại từ mơ hồ.
- source_word: Χερουβὶν δόξης
  choice: các chê-ru-bim vinh hiển
  rationale: “Chê-ru-bim” giữ thuật ngữ Kinh Thánh chỉ các hữu thể thiên giới; “vinh hiển” diễn đạt ngắn gọn sở hữu cách δόξης mà không xác định quá mức quan hệ giữa họ với vinh quang thần thượng.
- source_word: κατασκιάζοντα
  choice: tỏa bóng che phủ
  rationale: Phân từ mô tả các chê-ru-bim ở phía trên và che phủ vật bên dưới; cách diễn đạt này giữ được cả ý tạo bóng và bao phủ.
- source_word: τὸ ἱλαστήριον
  choice: nắp chuộc tội
  rationale: Trong ngữ cảnh nói về đồ vật của Đền Tạm, từ này trực tiếp chỉ nắp Hòm Giao Ước, nơi gắn với nghi thức chuộc tội. “Nắp chuộc tội” vừa xác định vật thể vừa giữ sắc thái thần học của từ Hy Lạp; các cách hiểu khác được ghi ở chú thích.
- source_word: περὶ ὧν
  choice: Về những điều này
  rationale: Cụm đại từ quan hệ quy chiếu chung về các vật dụng và chi tiết vừa được kể đến.
- source_word: οὐκ ἔστιν νῦν λέγειν κατὰ μέρος
  choice: hiện giờ không thể nói chi tiết từng điều một
  rationale: κατὰ μέρος mang ý trình bày từng phần hay từng mục; bản dịch giữ cả ý chi tiết lẫn ý lần lượt từng điều.
theological_decisions:
- issue: Nghĩa của ἱλαστήριον trong bối cảnh Hòm Giao Ước
  choice: nắp chuộc tội
  alternative: ngai thương xót; phương tiện hoặc lễ vật chuộc tội
  rationale: Ở Hê-bơ-rơ 9:5, các chê-ru-bim che phủ một vật cụ thể là nắp Hòm Giao Ước, nên bản chính không nên biến vật ấy thành một lễ vật trừu tượng. Tuy nhiên, ἱλαστήριον mang liên hệ rõ ràng với việc chuộc tội và cũng có phạm vi nghĩa rộng hơn ở nơi khác; chú thích bảo tồn độ căng nghĩa này.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “chê-ru-bim” theo lối phiên âm quen thuộc trong tiếng Việt; tránh thêm chi tiết “dang cánh” vì câu Hy Lạp không nói trực tiếp. Cấu trúc câu giữ lời chuyển ý ngắn gọn của tác giả.
