id: HEB.9.24
reference: Hebrews 9:24
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οὐ γὰρ εἰς χειροποίητα ⸂εἰσῆλθεν ἅγια⸃ Χριστός, ἀντίτυπα τῶν ἀληθινῶν, ἀλλ’ εἰς αὐτὸν τὸν οὐρανόν, νῦν ἐμφανισθῆναι τῷ προσώπῳ τοῦ θεοῦ ὑπὲρ ἡμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/024.yaml
  text: For Messiah did not enter into holy places made by hands[a], copies of the true things, but into heaven itself[c][b], now to appear in the presence of God on our behalf.
translation:
  language: vi
  text: Vì Đấng Mê-si không vào nơi thánh do tay người làm ra—là những hình ảnh tương ứng của các thực tại chân thật[a]—nhưng vào chính cõi trời, để giờ đây ra trước mặt Đức Chúa Trời[b] vì chúng ta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “bản sao”, “hình ảnh phản chiếu” hoặc “những vật tương ứng”. Từ Hy Lạp chỉ những điều dưới đất tương ứng với các thực tại chân thật trên trời.
    reason: lexical_alternative
  - marker: b
    text: 'Theo nghĩa đen: “trước mặt Đức Chúa Trời”.'
    reason: literal_rendering
lexical_decisions:
- source_word: Χριστός
  choice: Đấng Mê-si
  rationale: Giữ nghĩa danh hiệu của Χριστός trong lập luận về chức vụ và sự ứng nghiệm của Đấng được xức dầu.
- source_word: χειροποίητα ἅγια
  choice: nơi thánh do tay người làm ra
  rationale: Diễn đạt tự nhiên trong tiếng Việt, đồng thời giữ sự đối lập giữa nơi thánh do con người dựng nên và thực tại trên trời.
- source_word: ἀντίτυπα
  choice: hình ảnh tương ứng
  rationale: Từ này chỉ những vật tương ứng với thực tại trên trời; cách dịch này tránh hàm ý chúng chỉ là bản sao giống hệt.
- source_word: τῶν ἀληθινῶν
  choice: những thực tại chân thật
  rationale: Dùng danh từ hóa để giữ số nhiều và nêu rõ sự tương phản giữa biểu tượng dưới đất với thực tại tối hậu trên trời.
- source_word: αὐτὸν τὸν οὐρανόν
  choice: chính cõi trời
  rationale: Từ “chính” truyền đạt sắc thái nhấn mạnh của αὐτόν; “cõi trời” tự nhiên và rõ nghĩa trong văn cảnh.
- source_word: νῦν ἐμφανισθῆναι
  choice: để giờ đây hiện diện
  rationale: Giữ trạng từ thời gian νῦν và diễn đạt mục đích của việc đi vào trời; “hiện diện” phù hợp với ý xuất hiện trước Đức Chúa Trời.
- source_word: τῷ προσώπῳ τοῦ θεοῦ
  choice: trước mặt Đức Chúa Trời
  rationale: Cách nói tự nhiên, gần với nghĩa đen “trước mặt Đức Chúa Trời” và giữ tính trực tiếp của sự hiện diện.
- source_word: ὑπὲρ ἡμῶν
  choice: vì chúng ta
  rationale: Truyền đạt hành động vì lợi ích và thay mặt chúng ta mà không giới hạn cụm từ vào một lý thuyết chuộc tội cụ thể.
theological_decisions:
- issue: Danh hiệu Χριστός
  choice: Đấng Mê-si
  alternative: Đấng Christ
  rationale: Ở đây danh hiệu và chức vụ của Đấng được xức dầu đang nổi bật; “Đấng Mê-si” làm rõ ý nghĩa ấy.
- issue: Phạm vi nghĩa của ἅγια
  choice: nơi thánh
  alternative: đền thánh; Nơi Chí Thánh; các nơi thánh
  rationale: Dạng Hy Lạp là số nhiều nhưng có thể dùng theo nghĩa khu vực thánh nói chung. “Nơi thánh” không thu hẹp thành một gian cụ thể và tự nhiên hơn trong tiếng Việt.
- issue: Quan hệ của ἀντίτυπα với thực tại trên trời
  choice: hình ảnh tương ứng
  alternative: bản sao; hình bóng
  rationale: Giữ ý tương ứng và đại diện, không xác quyết quá mức rằng nơi thánh dưới đất là bản sao chính xác hay chỉ là bóng mờ.
- issue: Sắc thái của ὑπὲρ ἡμῶν
  choice: vì chúng ta
  alternative: thay mặt chúng ta
  rationale: “Vì chúng ta” giữ được độ rộng của giới từ ὑπέρ; văn cảnh tư tế vẫn gợi ý sắc thái đại diện mà không cần giải quyết dứt khoát ngay trong chính văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ hình ảnh nơi thánh và cõi trời của lập luận tư tế trong Hê-bơ-rơ; dùng “Đấng Mê-si” như một danh hiệu, không như tên riêng. Tất cả dấu chú thích đều xuất hiện trong chính văn.
