  - severity: low
    issue: Chú thích a nêu “biểu tượng” như một phương án dịch trực tiếp.
    rationale: “Biểu tượng” có thể gợi một quan hệ nghĩa rộng hơn và kém chính xác hơn ἀντίτυπα. Nên giới hạn các phương án ở “bản sao,” “hình ảnh/phản ảnh,” hoặc “vật tương ứng.”
  revised_text: Vì Đấng Mê-si không vào nơi thánh do tay người làm ra—là những hình ảnh tương ứng của các thực tại chân thật[a]—nhưng vào chính cõi trời, để giờ đây ra trước mặt Đức Chúa Trời[b] vì chúng ta.
