review_pass:
  verdict: revise
  source_fidelity: Bản nháp phản ánh đúng đối chiếu của διά («nhờ ... nhưng nhờ»), sự nhấn mạnh «chính máu mình», tính một lần của ἐφάπαξ, và tránh đồng nhất τὰ ἅγια với «Nơi Chí Thánh». Tuy nhiên, οὐδέ tiếp nối câu trước được thể hiện đầy đủ hơn bằng «cũng không», và μόσχοι được dịch tự nhiên, chính xác hơn là «bê».
  naturalness: «Cũng không», «bê», và «một lần là đủ» là những cách nói hiện đại, rõ nghĩa trong văn xuôi trang trọng. Cấu trúc với phân từ được giữ bằng «sau khi đã đạt được», phản ánh trực tiếp εὑράμενος mà không thêm cơ chế hiến tế nào.
  terminology: «Các nơi thánh» bảo lưu số nhiều và sắc thái nghi lễ của τὰ ἅγια; chú thích giữ lựa chọn «nơi thánh/thánh điện» mở hơn «Nơi Chí Thánh». «Sự cứu chuộc đời đời» là thuật ngữ thần học chuẩn và phù hợp αἰωνίαν λύτρωσιν.
