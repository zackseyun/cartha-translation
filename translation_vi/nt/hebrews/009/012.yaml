revisions:
- from: Ngài không nhờ máu dê đực và bò con, nhưng nhờ chính máu của mình mà đã vào các nơi thánh[a] một lần dứt khoát, và đạt được sự cứu chuộc đời đời.
  to: Ngài cũng không vào các nơi thánh[a] nhờ máu dê đực và bê, nhưng nhờ chính máu mình, một lần là đủ, sau khi đã đạt được sự cứu chuộc đời đời.
  rationale: Bản sửa tăng độ sát nguyên văn ở liên từ οὐδέ và danh từ μόσχοι, đồng thời dùng cách diễn đạt Việt ngữ tự nhiên hơn cho ἐφάπαξ. «Sau khi đã đạt được» phản ánh hình thức phân từ «having obtained»; không diễn giải thêm bản chất hoặc cơ chế của việc vào nơi thánh nhờ máu mình. Chú thích tiếp tục bảo toàn độ mở của τὰ ἅγια.
