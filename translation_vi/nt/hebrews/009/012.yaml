source:
  edition: SBLGNT
  text: οὐδὲ δι’ αἵματος τράγων καὶ μόσχων διὰ δὲ τοῦ ἰδίου αἵματος, εἰσῆλθεν ἐφάπαξ εἰς τὰ ἅγια, αἰωνίαν λύτρωσιν εὑράμενος.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/012.yaml
  text: and not through the blood of goats and calves[a], but through his own blood, he entered once for all into the holy places, having obtained eternal redemption.
translation:
  language: vi
  text: Ngài cũng không vào các nơi thánh[a] nhờ máu dê đực và bê, nhưng nhờ chính máu mình, một lần là đủ, sau khi đã đạt được sự cứu chuộc đời đời.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “vào nơi thánh” hoặc “vào thánh điện.” Tiếng Hy Lạp dùng dạng số nhiều, nghĩa đen là “các nơi thánh”; trong ngữ cảnh nghi lễ, cụm này cũng có thể chỉ toàn bộ nơi thánh. Dịch là “Nơi Chí Thánh” sẽ cụ thể hơn điều câu Hy Lạp nói rõ.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὐδὲ
  choice: không
  rationale: Trong mạch văn, từ này tiếp nối ý đối chiếu của câu trước. Cấu trúc “không... nhưng...” thể hiện tự nhiên lực liên kết và tương phản trong tiếng Việt.
- source_word: δι’ αἵματος τράγων καὶ μόσχων
  choice: nhờ máu dê đực và bò con
  rationale: διά với sở hữu cách diễn tả phương tiện. “Nhờ” phù hợp với tiếng Việt và được lặp lại ở vế sau để giữ nguyên thế đối chiếu; τράγων là dê đực và μόσχων là bò con.
- source_word: διὰ δὲ τοῦ ἰδίου αἵματος
  choice: nhưng nhờ chính máu của mình
  rationale: Lặp lại “nhờ” để phản ánh διά ở cả hai vế. “Chính... của mình” giữ sắc thái nhấn mạnh quyền sở hữu của ἰδίου mà vẫn tự nhiên trong tiếng Việt.
- source_word: εἰσῆλθεν
  choice: đã vào
  rationale: Thì aorist trình bày hành động đã hoàn tất; “đã vào” là cách diễn đạt tự nhiên và phù hợp với hình ảnh nơi thánh.
- source_word: ἐφάπαξ
  choice: một lần dứt khoát
  rationale: Cụm này diễn tả một hành động duy nhất, có tính quyết định và không lặp lại. “Một lần dứt khoát” truyền đạt lực ấy rõ ràng bằng tiếng Việt hiện đại.
- source_word: εἰς τὰ ἅγια
  choice: vào các nơi thánh
  rationale: Giữ dạng số nhiều của τὰ ἅγια và sắc thái nghi lễ của cụm từ, thay vì thu hẹp nghĩa thành “Nơi Chí Thánh.” Chú thích nêu cách dịch tự nhiên hơn là “nơi thánh.”
- source_word: αἰωνίαν λύτρωσιν
  choice: sự cứu chuộc đời đời
  rationale: Diễn tả sự cứu chuộc có hiệu lực bền vững, không chấm dứt; đây là cách nói chính xác và quen thuộc trong tiếng Việt.
- source_word: εὑράμενος
  choice: và đạt được
  rationale: Nghĩa đen là “tìm thấy,” nhưng trong ngữ cảnh này phân từ mang nghĩa đạt được. Dùng “và đạt được” tránh tạo quan hệ thời gian quá cứng như “sau khi,” đồng thời diễn đạt tự nhiên mối liên hệ với hành động đi vào.
theological_decisions:
- issue: Ý nghĩa việc Đấng Christ vào nơi thánh nhờ chính máu mình
  choice: Bản dịch nói Ngài vào nhờ chính máu mình, đối lập với máu động vật, nhưng không mô tả thêm cách thức máu được mang vào hay trình dâng trong cõi trời.
  alternative: Hiểu rằng Ngài mang hoặc trình máu theo nghĩa không gian hoàn toàn sát chữ; hoặc chỉ hiểu rằng Ngài vào sau khi đổ máu.
  rationale: Việc dịch nhất quán διά với sở hữu cách là “nhờ” bảo toàn ý phương tiện và sự đối chiếu kiểu hình với các sinh tế Lê-vi, nhưng không áp đặt một cơ chế hiến tế chi tiết mà câu Hy Lạp không nói rõ.
- issue: Phạm vi nghĩa của τὰ ἅγια
  choice: Dịch là “các nơi thánh,” không phải “Nơi Chí Thánh.”
  alternative: “nơi thánh” hoặc “Nơi Chí Thánh.”
  rationale: Cụm Hy Lạp ở số nhiều và có thể được dùng như tên gọi mang tính nghi lễ cho nơi thánh. “Nơi Chí Thánh” sẽ giải quyết quá mức một câu hỏi diễn giải; cách dịch chính giữ hình thức và độ mở của nguyên văn.
- issue: Quan hệ của εὑράμενος với hành động đi vào
  choice: Dùng “và đạt được” để nối hai ý mà không ấn định cứng rằng sự cứu chuộc đã đạt được trước khi Ngài đi vào.
  alternative: “sau khi đã đạt được” hoặc “nhờ đó đạt được.”
  rationale: Phân từ aorist có thể được hiểu theo nhiều sắc thái ngữ cảnh. Cách dịch đã chọn bảo toàn mối liên hệ chặt chẽ nhưng không âm thầm quyết định thứ tự thời gian hay quan hệ kết quả.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “máu” thay cho “huyết” để tự nhiên với độc giả phổ thông, trong khi các từ “nơi thánh,” “cứu chuộc” vẫn giữ sắc thái nghi lễ và thần học cần thiết. Đại từ “Ngài” phù hợp với quy chiếu về Đấng Christ trong ngữ cảnh.
