- from: Phía sau bức màn thứ hai là phần lều được gọi là Nơi Chí Thánh,[a]
  to: Phía sau bức màn thứ hai là một gian lều, được gọi là Nơi Chí Thánh.[a]
  rationale: Sửa “phần lều” thành “một gian lều” để phản ánh tự nhiên hơn σκηνή trong ngữ cảnh mô tả các gian của Lều Tạm. Giữ “Nơi Chí Thánh” là thuật ngữ Việt ngữ quen thuộc cho Ἅγια Ἁγίων, đồng thời chỉnh chú thích để nêu đúng đặc điểm thành ngữ siêu cấp của cụm Hy Lạp mà không áp đặt diễn giải.
