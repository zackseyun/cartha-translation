  yaml_path: translation/nt/hebrews/009/003.yaml
  text: And behind the second curtain was a tabernacle called the Most Holy Place,[a]
translation:
  language: vi
  text: Phía sau bức màn thứ hai là một gian lều, được gọi là Nơi Chí Thánh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Thành ngữ này chỉ nơi thánh nhất; hoặc: “Nơi Thánh Nhất.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ ... τὸ δεύτερον καταπέτασμα
  choice: Phía sau bức màn thứ hai
  rationale: μετά với đối cách ở đây diễn tả vị trí trong cấu trúc nơi thánh, nên “phía sau” tự nhiên và chính xác hơn cách hiểu thời gian “sau đó.” καταπέτασμα là bức màn bên trong ngăn cách các phần của nơi thánh.
- source_word: δὲ
  choice: lược dịch trong mạch câu
  rationale: δέ là liên từ nhẹ tiếp nối phần mô tả. Tiếng Việt không cần thêm “và” ở đây vì cụm mở đầu “Phía sau...” đã nối ý tự nhiên.
- source_word: σκηνὴ
  choice: phần lều
  rationale: σκηνή vốn là “lều”, nhưng trong ngữ cảnh chỉ phần bên trong của Lều Hội Kiến. “Phần lều” vừa giữ hình ảnh nguyên ngữ vừa tránh khiến người đọc hiểu rằng có một lều hoàn toàn riêng biệt.
- source_word: ἡ λεγομένη
  choice: được gọi là
  rationale: Diễn đạt tự nhiên chức năng định ngữ của phân từ bị động.
- source_word: Ἅγια Ἁγίων
  choice: Nơi Chí Thánh
  rationale: Cụm sở hữu dùng theo nghĩa tuyệt đối bậc nhất, sát nghĩa là “Thánh của các nơi thánh.” “Nơi Chí Thánh” là cách nói trang trọng, dễ hiểu và xác định rõ đây là phần trong cùng của nơi thánh.
theological_decisions:
- issue: Cách dịch danh xưng nơi thánh Ἅγια Ἁγίων
  choice: Nơi Chí Thánh
  alternative: Nơi Thánh của các nơi thánh
  rationale: “Nơi Chí Thánh” truyền đạt tự nhiên ý nghĩa tuyệt đối bậc nhất và giữ đúng đối tượng là gian thánh bên trong; cách dịch sát cấu trúc hơn được giữ trong chú thích để minh bạch hình thức nguyên ngữ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “bức màn” thay cho từ cổ hơn như “màn che”; “Nơi Chí Thánh” giữ sắc thái thờ phượng quen thuộc mà vẫn rõ nghĩa. Dấu phẩy trước chú thích phản ánh câu còn tiếp nối trong văn mạch.
