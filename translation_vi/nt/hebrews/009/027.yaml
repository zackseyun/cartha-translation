  text: καὶ καθ’ ὅσον ἀπόκειται τοῖς ἀνθρώποις ἅπαξ ἀποθανεῖν, μετὰ δὲ τοῦτο κρίσις,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/027.yaml
  text: And just as it is appointed for men to die once[a], and after this, judgment,
translation:
  language: vi
  text: Và cũng như con người được định phải chết một lần, sau đó là sự phán xét,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθ’ ὅσον
  choice: cũng như
  rationale: Cụm từ mở đầu phép so sánh sẽ được hoàn tất ở câu 28; “cũng như” diễn đạt tự nhiên chức năng này trong tiếng Việt.
- source_word: ἀπόκειται
  choice: đã được định
  rationale: Trong cấu trúc với tặng cách chỉ người và động từ nguyên mẫu, từ này nói đến điều đã được ấn định hoặc dành sẵn; “đã được định” giữ sắc thái cố định mà không nêu rõ tác nhân.
- source_word: τοῖς ἀνθρώποις
  choice: mỗi người
  rationale: Danh từ số nhiều ở đây chỉ loài người nói chung. “Mỗi người” vừa bao quát mọi giới vừa kết hợp tự nhiên với ý chết “một lần” trong tiếng Việt.
- source_word: ἅπαξ
  choice: một lần
  rationale: Diễn đạt một lần xảy ra, không thêm sắc thái mạnh hơn của “một lần đủ cả”.
- source_word: ἀποθανεῖν
  choice: phải chết
  rationale: “Chết” là nghĩa trực tiếp; từ “phải” phối hợp với “đã được định” để diễn đạt cấu trúc bổ ngữ nguyên mẫu và tính tất yếu.
- source_word: μετὰ δὲ τοῦτο
  choice: rồi sau đó
  rationale: Giữ trình tự từ sự chết đến sự phán xét; “rồi” chuyển ý tự nhiên trong tiếng Việt.
- source_word: κρίσις
  choice: chịu phán xét
  rationale: Danh từ Hy Lạp chỉ sự xét xử hay phán xét, không tự nó quy định kết quả là kết án. Cách diễn đạt bằng động từ tự nhiên trong câu tiếng Việt và vẫn để ngỏ kết quả.
theological_decisions:
- issue: Phạm vi của τοῖς ἀνθρώποις
  choice: Dịch là “mỗi người” để chỉ toàn thể nhân loại
  alternative: loài người; người ta; con người
  rationale: Từ Hy Lạp có hình thức giống đực số nhiều nhưng mang nghĩa khái quát, không chỉ riêng nam giới. “Mỗi người” truyền đạt đúng phạm vi phổ quát trong tiếng Việt hiện đại.
- issue: Ý nghĩa của κρίσις sau sự chết
  choice: Chỉ dịch là “phán xét”
  alternative: sự kết án; sự phán xét cuối cùng
  rationale: Câu này khẳng định sự phán xét theo sau cái chết nhưng không nói rõ kết quả hay toàn bộ khuôn khổ cánh chung; bản dịch không bổ sung điều văn bản chưa xác định.
- issue: Tác nhân của ἀπόκειται
  choice: Dùng thể bị động “đã được định” mà không nêu tác nhân
  alternative: Đức Chúa Trời đã định
  rationale: Hình thức Hy Lạp không trực tiếp nêu người ấn định. Bản dịch giữ sự hàm ẩn đó thay vì đưa tác nhân vào câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu được giữ dấu phẩy ở cuối để phản ánh rằng phép so sánh tiếp tục sang Hê-bơ-rơ 9:28. Không cần chú thích vì “mỗi người” truyền đạt trực tiếp nghĩa khái quát của ἀνθρώποις.
