  source_fidelity: Bản nháp truyền đạt đúng phép so sánh mở sang câu 28, tính phổ quát của τοῖς ἀνθρώποις, tính một lần của ἅπαξ, và trình tự chết rồi đến κρίσις. Tuy nhiên, “chịu phán xét” chuyển danh từ κρίσις thành một hành động mà từng cá nhân phải chịu; tuy không trái hẳn ý, cách “sự phán xét” bám sát danh từ nguồn và cấu trúc câu hơn.
  naturalness: “Mỗi người đã được định phải chết” có trật tự từ hơi gượng trong tiếng Việt hiện đại. “Con người được định phải chết một lần” tự nhiên hơn, vẫn giữ ý điều đã được ấn định. “Sau đó là sự phán xét” gọn, trang trọng, và phù hợp với mệnh đề danh từ Hy Lạp.
  terminology: “Phán xét” là thuật ngữ phù hợp cho κρίσις và không thu hẹp thành “kết án”. “Con người” diễn đạt bao quát τοῖς ἀνθρώποις mà không cần chú thích giới tính.
