    rationale: Cụm này dễ gây khựng vì “đã được định” chen giữa chủ ngữ và bổ ngữ. Đưa sang “con người được định phải chết” làm câu thông suốt hơn mà không đổi nghĩa.
  - severity: medium
    issue: “Chịu phán xét” diễn giải κρίσις như hành động áp trên chủ ngữ thay vì giữ danh từ “sự phán xét”.
    rationale: κρίσις là danh từ, và nguyên văn nói “sau điều này, sự phán xét”. Dùng “sự phán xét” bảo toàn cách diễn đạt cũng như không thêm sắc thái tố tụng cá nhân.
