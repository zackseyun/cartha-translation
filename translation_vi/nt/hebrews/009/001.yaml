id: HEB.9.1
reference: Hebrews 9:1
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Εἶχε μὲν ⸀οὖν ἡ πρώτη δικαιώματα λατρείας τό τε ἅγιον κοσμικόν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/001.yaml
  text: Even the first covenant had regulations for worship and an earthly sanctuary[a][b].
translation:
  language: vi
  text: Ngay cả giao ước thứ nhất cũng có những quy định về việc thờ phượng và một nơi thánh trên đất[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “điều thứ nhất”—trong văn cảnh có lẽ là giao ước thứ nhất; một số người hiểu rộng hơn là “sự sắp đặt thứ nhất.”
    reason: alternative_reading
  - marker: b
    text: Hoặc “một nơi thánh thuộc về thế gian/trần thế”; ở đây ý nghĩa có lẽ là “trên đất,” đối lập với những thực tại trên trời được nói đến về sau trong chương này.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἶχε
  choice: có
  rationale: Thì chưa hoàn thành giới thiệu những điều thuộc về व्यवस्था trước; trong tiếng Việt, “có” diễn đạt tự nhiên quan hệ sở hữu mà không cần đánh dấu thì bằng hình thái.
- source_word: μὲν οὖν
  choice: Ngay cả … cũng
  rationale: Cụm từ có chức năng chuyển tiếp và nhấn nhẹ. Cách diễn đạt này giữ sắc thái nhấn mạnh trong văn cảnh mà không thêm một trạng từ thời gian như “bây giờ”.
- source_word: ἡ πρώτη
  choice: giao ước thứ nhất
  rationale: Danh từ được tỉnh lược trong tiếng Hy Lạp; giống cái của cụm từ và văn cảnh ngay trước đó ở 8:13 hướng đến giao ước thứ nhất. Bổ sung “giao ước” giúp câu tiếng Việt rõ nghĩa, đồng thời ghi chú bảo lưu độ hàm hồ.
- source_word: δικαιώματα
  choice: những quy định
  rationale: Trong ngữ cảnh nghi lễ, từ này chỉ các điều lệ hay quy định chi phối việc thờ phượng; “những quy định” là cách nói hiện đại, rõ ràng.
- source_word: λατρείας
  choice: về việc thờ phượng
  rationale: Diễn đạt phạm vi của các quy định và giữ nghĩa phụng tự của danh từ Hy Lạp bằng tiếng Việt tự nhiên.
- source_word: τό τε ἅγιον
  choice: một nơi thánh
  rationale: Cụm từ chỉ địa điểm thánh nói chung; các câu kế tiếp mới trình bày những phần cụ thể. “Nơi thánh” tránh đồng nhất quá sớm với một gian riêng biệt.
- source_word: κοσμικόν
  choice: thuộc về trần thế
  rationale: Trong văn cảnh, từ này đối lập nơi thánh của trật tự hiện tại với những thực tại trên trời; cách dịch này tránh sắc thái đạo đức tiêu cực mà “thế tục” có thể gợi ra.
theological_decisions:
- issue: Danh từ được hàm ý trong ἡ πρώτη
  choice: giao ước thứ nhất
  alternative: “điều thứ nhất” hoặc “sự sắp đặt thứ nhất”; một số cách hiểu khác liên hệ với đền tạm thứ nhất
  rationale: Văn cảnh gần nhất ở Hê-bơ-rơ 8 đối chiếu giao ước thứ nhất với giao ước mới. Tuy vậy, vì bản Hy Lạp chỉ viết “thứ nhất”, ghi chú bảo lưu tính tỉnh lược và những khả năng hiểu rộng hơn.
- issue: Ý nghĩa của κοσμικόν
  choice: thuộc về trần thế
  alternative: thuộc về thế gian
  rationale: Sự đối lập chính trong chương là giữa nơi thánh dưới đất và các thực tại trên trời, chứ không phải giữa điều xấu xa và điều thiêng liêng. Cách dịch được chọn không gán ý nghĩa suy đồi đạo đức cho nơi thánh.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “thờ phượng” thay cho thuật ngữ nghi lễ cổ hơn; dùng “nơi thánh” theo nghĩa rộng để các câu sau tự triển khai cấu trúc của đền tạm. Cả hai dấu chú thích [a], [b] đều được đặt trong chính văn.
