id: HEB.9.28
reference: Hebrews 9:28
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οὕτως καὶ ὁ Χριστός, ἅπαξ προσενεχθεὶς εἰς τὸ πολλῶν ἀνενεγκεῖν ἁμαρτίας, ἐκ δευτέρου χωρὶς ἁμαρτίας ὀφθήσεται τοῖς αὐτὸν ἀπεκδεχομένοις εἰς σωτηρίαν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/028.yaml
  text: so also the Messiah[a], having been offered once to bear the sins of many, will appear a second time, apart from sin, to those who eagerly await him, for salvation.
translation:
  language: vi
  text: Cũng vậy, Đấng Christ đã được dâng lên một lần để mang lấy tội lỗi của nhiều người; Ngài sẽ hiện ra lần thứ hai, không vì tội lỗi[a], cho những người tha thiết trông đợi Ngài, để đem lại sự cứu rỗi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hoặc “không phải để mang tội”; tức không như lần Ngài được dâng lên để mang tội lỗi.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως καὶ
  choice: Cũng vậy
  rationale: Giữ lực so sánh với điều vừa nêu ở câu 27, đồng thời tự nhiên trong tiếng Việt hiện đại.
- source_word: ὁ Χριστός
  choice: Đấng Christ
  rationale: Thể hiện Χριστός như một tước hiệu cứu thế, không chỉ như tên riêng; đây cũng là cách gọi trang trọng và quen thuộc với độc giả Kinh Thánh tiếng Việt.
- source_word: ἅπαξ
  choice: một lần
  rationale: Dịch đúng nghĩa trực tiếp của trạng từ, không thêm ý “một lần đủ cả” tuy ý ấy phù hợp với lập luận rộng hơn của thư Hê-bơ-rơ.
- source_word: προσενεχθεὶς
  choice: đã được dâng lên
  rationale: Giữ thể bị động và quan hệ thời gian của phân từ aorist đối với động từ tương lai; không thêm đại từ phản thân “tự dâng mình” vốn không có trong mệnh đề này.
- source_word: εἰς τὸ πολλῶν ἀνενεγκεῖν ἁμαρτίας
  choice: để mang lấy tội lỗi của nhiều người
  rationale: “Để” thể hiện mục đích; “mang lấy tội lỗi” giữ sắc thái tế lễ và âm vang Ê-sai 53 mà không giải thích quá mức.
- source_word: ἐκ δευτέρου
  choice: lần thứ hai
  rationale: Diễn đạt tự nhiên lần xuất hiện thứ hai và giữ sự tương phản với lần Ngài được dâng lên trước đó.
- source_word: χωρὶς ἁμαρτίας
  choice: không liên quan đến tội lỗi
  rationale: Giữ cách nói ngắn gọn và phần nào để ngỏ của nguyên văn; không diễn giải ngay trong chính văn rằng lần hiện ra này không nhằm mang tội lỗi.
- source_word: ὀφθήσεται
  choice: sẽ hiện ra
  rationale: Phù hợp với cách dùng mang nghĩa xuất hiện của thể bị động ὁράω trong ngữ cảnh cánh chung, tự nhiên hơn lối dịch máy móc “sẽ được nhìn thấy”.
- source_word: τοῖς αὐτὸν ἀπεκδεχομένοις
  choice: cho những người tha thiết trông đợi Ngài
  rationale: “Tha thiết trông đợi” truyền đạt sắc thái mong chờ đầy kỳ vọng của ἀπεκδέχομαι.
- source_word: εἰς σωτηρίαν
  choice: nhằm đem lại sự cứu rỗi
  rationale: Diễn đạt đích hướng đến của εἰς σωτηρίαν bằng tiếng Việt tự nhiên, đồng thời gắn sự cứu rỗi với lần hiện ra thứ hai.
theological_decisions:
- issue: Ý nghĩa của χωρὶς ἁμαρτίας trong lần hiện ra thứ hai
  choice: Giữ trong chính văn là “không liên quan đến tội lỗi.”
  alternative: “Không nhằm xử lý tội lỗi,” tức không phải để mang lấy tội lỗi như trong lần được dâng lên đầu tiên.
  rationale: Cách dịch chính giữ sự cô đọng và căng thẳng thần học của nguyên văn. Chú thích nêu cách hiểu theo ngữ cảnh mà không biến phần giải thích thành chính văn.
translation_notes:
  register: Văn phong trang trọng, sáng rõ và hiện đại. Dùng thuật ngữ Kinh Thánh quen thuộc như “Đấng Christ,” “mang lấy tội lỗi” và “sự cứu rỗi,” nhưng tránh lối diễn đạt cổ như “hầu cho” hoặc “đặng.” Dấu chấm phẩy giúp làm rõ sự chuyển từ việc Ngài đã được dâng lên một lần sang lần hiện ra thứ hai.
