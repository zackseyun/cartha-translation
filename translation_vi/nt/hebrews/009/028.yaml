revisions:
- from: 'Cũng vậy, Đấng Christ đã được dâng lên một lần để mang lấy tội lỗi của nhiều người; Ngài sẽ hiện ra lần thứ hai, không liên quan đến tội lỗi[a], cho những người tha thiết trông đợi Ngài, nhằm đem lại sự cứu rỗi.


    [a] Hay “không nhằm xử lý tội lỗi,” nghĩa là lần này không phải để mang lấy tội lỗi như khi Ngài được dâng lên lần đầu.'
  to: Cũng vậy, Đấng Christ đã được dâng lên một lần để mang lấy tội lỗi của nhiều người; Ngài sẽ hiện ra lần thứ hai, không vì tội lỗi[a], cho những người tha thiết trông đợi Ngài, để đem lại sự cứu rỗi.
  rationale: Sửa riêng cụm χωρὶς ἁμαρτίας và chú thích để diễn đạt tự nhiên hơn trong tiếng Việt, phản ánh sự đối lập ngữ cảnh với việc mang tội ở vế trước, đồng thời vẫn giữ tính cô đọng và không biến lời giải thích thần học thành chính văn. “Để đem lại sự cứu rỗi” được giữ như một cách diễn đạt tự nhiên cho εἰς σωτηρίαν.
