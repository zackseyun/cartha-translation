id: HEB.9.7
reference: Hebrews 9:7
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εἰς δὲ τὴν δευτέραν ἅπαξ τοῦ ἐνιαυτοῦ μόνος ὁ ἀρχιερεύς, οὐ χωρὶς αἵματος, ὃ προσφέρει ὑπὲρ ἑαυτοῦ καὶ τῶν τοῦ λαοῦ ἀγνοημάτων,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/007.yaml
  text: But into the second room only the high priest enters once a year[a], and not without blood[b], which he offers for himself and for the people's sins committed in ignorance.
translation:
  language: vi
  text: Nhưng vào gian thứ hai thì chỉ thầy tế lễ thượng phẩm mới vào, mỗi năm một lần[a], không phải không có huyết; ông dâng huyết ấy cho chính mình và cho những tội dân chúng phạm vì không biết[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “phần thứ hai” hoặc “lều thứ hai”, tức phần bên trong của Đền Tạm.
    reason: lexical_alternative
  - marker: b
    text: Hay “những tội vô ý của dân chúng”.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς δὲ τὴν δευτέραν
  choice: Nhưng ... vào gian thứ hai
  rationale: Cụm Hy Lạp tỉnh lược danh từ và chỉ phần bên trong thứ hai của Đền Tạm trong ngữ cảnh 9:2–3. Thêm “gian” giúp câu tiếng Việt tự nhiên mà vẫn giữ sự đối chiếu không gian.
- source_word: ἅπαξ τοῦ ἐνιαυτοῦ
  choice: mỗi năm một lần
  rationale: Cách diễn đạt tự nhiên trong tiếng Việt, truyền đạt chính xác tần suất hằng năm.
- source_word: μόνος ὁ ἀρχιερεύς
  choice: chỉ thầy tế lễ thượng phẩm mới
  rationale: Cấu trúc “chỉ ... mới” diễn đạt rõ tính độc quyền của μόνος bằng tiếng Việt hiện đại.
- source_word: οὐ χωρὶς αἵματος
  choice: không bao giờ vào mà không có huyết
  rationale: Giữ lối phủ định của nguyên văn và từ “huyết” vốn quan trọng đối với hình ảnh tế lễ; thêm lại động từ “vào” để câu tiếng Việt sáng rõ.
- source_word: ὃ προσφέρει
  choice: ông dâng huyết ấy
  rationale: “Dâng” truyền đạt nghĩa tế lễ của προσφέρει; lặp “huyết ấy” tự nhiên và làm rõ đại từ quan hệ chỉ về huyết.
- source_word: ὑπὲρ ἑαυτοῦ
  choice: cho chính mình
  rationale: Diễn đạt tự nhiên ý nghĩa đại diện hoặc vì lợi ích trong bối cảnh hiến tế mà không giải thích quá mức.
- source_word: τῶν τοῦ λαοῦ ἀγνοημάτων
  choice: những tội dân chúng phạm vì không biết
  rationale: Giữ cả ý nghĩa đạo đức của “tội” lẫn sắc thái thiếu hiểu biết của ἀγνοήματα, đồng thời tránh mặc nhiên thu hẹp nghĩa chỉ còn các hành vi hoàn toàn vô ý.
theological_decisions:
- issue: Bản chất của ἀγνοήματα trong bối cảnh tế lễ
  choice: những tội dân chúng phạm vì không biết
  alternative: những tội vô ý của dân chúng
  rationale: Cách dịch này giữ sắc thái những vi phạm gắn với sự không biết nhưng vẫn là tội có trách nhiệm, không biến từ này thành sự thiếu thông tin đơn thuần hoặc áp đặt một phân loại giáo lý về mức độ cố ý.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “thầy tế lễ thượng phẩm” theo văn phong Kinh Thánh quen thuộc; dùng “huyết” để giữ sắc thái tế lễ và mối liên hệ thuật ngữ trong lập luận của thư Hê-bơ-rơ.
