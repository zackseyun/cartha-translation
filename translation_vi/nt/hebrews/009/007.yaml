revisions:
- from: Nhưng chỉ thầy tế lễ thượng phẩm mới vào gian thứ hai, mỗi năm một lần[a], và không bao giờ vào mà không có huyết; ông dâng huyết ấy cho chính mình và cho những tội dân chúng phạm vì không biết[b].
  to: Nhưng vào gian thứ hai thì chỉ thầy tế lễ thượng phẩm mới vào, mỗi năm một lần[a], không phải không có huyết; ông dâng huyết ấy cho chính mình và cho những tội dân chúng phạm vì không biết[b].
  rationale: Chỉ thay “không bao giờ vào mà không có huyết” bằng “không phải không có huyết” để loại bỏ sắc thái tuyệt đối không được nêu rõ trong nguyên văn, đồng thời bảo toàn lối phủ định và thuật ngữ “huyết” của câu Hy Lạp. Các phần khác trung thành với nguồn và tự nhiên trong tiếng Việt hiện đại.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T21:28:29Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch giữ đúng các yếu tố chính: sự đối lập với gian thứ nhất, tính độc quyền của thầy tế lễ thượng phẩm, tần suất hằng năm, huyết tế, và việc dâng cho chính mình cùng các lỗi phạm do không biết của dân chúng. Tuy nhiên, “không bao giờ vào mà không có huyết” thêm ý tuyệt đối/thói quen “không bao giờ”, trong khi οὐ χωρὶς αἵματος chỉ nói “không phải không có huyết” (tức không có lần vào nào thiếu huyết trong hành vi được mô tả), không dùng từ ποτέ (“bao giờ”).'
  naturalness: Câu sửa dùng trật tự “vào gian thứ hai thì...” để phản ánh rõ sự đối chiếu không gian của nguyên văn và đọc tự nhiên trong tiếng Việt hiện đại. “Không phải không có huyết” là lối nói phủ định kép trang trọng, sát với lối nói μειωτικός (litotes) của tiếng Hy Lạp; có thể hiểu rõ theo ngữ cảnh tế lễ.
  terminology: “Thầy tế lễ thượng phẩm,” “huyết,” và “dâng” phù hợp văn cảnh phụng tự và cách dùng Kinh Thánh tiếng Việt. “Những tội dân chúng phạm vì không biết” chuyển đúng ἀγνοημάτων mà không thu hẹp thành chỉ các hành vi hoàn toàn vô ý.
  issues:
  - severity: medium
    issue: “không bao giờ vào mà không có huyết”
    rationale: “Không bao giờ” không có từ tương ứng trong câu Hy Lạp và dễ làm câu khẳng định mạnh hơn lối litotes οὐ χωρὶς αἵματος. Cần giữ ý “không phải không có huyết”/“không có huyết thì không vào.”
  revised_text: Nhưng vào gian thứ hai thì chỉ thầy tế lễ thượng phẩm mới vào, mỗi năm một lần[a], không phải không có huyết; ông dâng huyết ấy cho chính mình và cho những tội dân chúng phạm vì không biết[b].
