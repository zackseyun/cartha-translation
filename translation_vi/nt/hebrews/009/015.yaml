id: HEB.9.15
reference: Hebrews 9:15
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Καὶ διὰ τοῦτο διαθήκης καινῆς μεσίτης ἐστίν, ὅπως θανάτου γενομένου εἰς ἀπολύτρωσιν τῶν ἐπὶ τῇ πρώτῃ διαθήκῃ παραβάσεων τὴν ἐπαγγελίαν λάβωσιν οἱ κεκλημένοι τῆς αἰωνίου κληρονομίας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/015.yaml
  text: And for this reason he is the mediator of a new covenant[a], so that, since a death has occurred for the redemption of the transgressions committed under the first covenant, those who have been called may receive the promise of the eternal inheritance.
translation:
  language: vi
  text: Vì lý do đó, Ngài là Đấng Trung Gian của một giao ước mới[a], để những người đã được kêu gọi có thể nhận lãnh lời hứa về cơ nghiệp đời đời, nhờ sự chết đã xảy ra để cứu chuộc họ khỏi những vi phạm dưới giao ước thứ nhất.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “di chúc”. Từ Hy Lạp διαθήκη có thể mang cả hai nghĩa; Hê-bơ-rơ 9:16–17 khai triển sự chồng lấp nghĩa này, dù “giao ước” phù hợp nhất với sự đối chiếu với giao ước thứ nhất trong câu này.
    reason: alternative_reading
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Vì vậy
  rationale: Diễn đạt tự nhiên mối liên hệ nhân quả với lập luận ngay trước đó, đồng thời giữ sắc thái suy luận–giải thích.
- source_word: διαθήκης καινῆς
  choice: của một giao ước mới
  rationale: “Giao ước” phù hợp nhất với sự đối chiếu cùng giao ước thứ nhất trong câu này; khả năng mang nghĩa “di chúc” được giữ trong chú thích vì phần tiếp theo khai triển sự giao thoa nghĩa.
- source_word: μεσίτης
  choice: Đấng Trung Gian
  rationale: Thuật ngữ trang trọng, rõ nghĩa, chỉ người đứng giữa để thiết lập hoặc thực hiện quan hệ giao ước.
- source_word: ὅπως
  choice: để
  rationale: Giữ được sắc thái mục đích hoặc kết quả mà không khiến câu tiếng Việt nặng nề.
- source_word: θανάτου γενομένου
  choice: nhờ sự chết đã xảy ra
  rationale: Phản ánh biến cố chết đã xảy ra và là cơ sở để sự cứu chuộc có hiệu lực; “nhờ” làm rõ quan hệ phương tiện/căn cứ trong mạch câu tiếng Việt mà không xác định quá mức chủ thể ngay trong cụm từ.
- source_word: ἀπολύτρωσιν
  choice: chuộc khỏi
  rationale: Diễn đạt sự giải thoát có giá phải trả trong bối cảnh hiến tế; kết cấu động từ tự nhiên hơn danh từ trừu tượng “sự cứu chuộc” tại đây.
- source_word: τῶν ἐπὶ τῇ πρώτῃ διαθήκῃ παραβάσεων
  choice: những vi phạm dưới giao ước thứ nhất
  rationale: “Dưới” giữ được ý nghĩa thuộc phạm vi hoặc thời kỳ của giao ước thứ nhất; không thêm động từ ngoài điều cần thiết.
- source_word: τὴν ἐπαγγελίαν
  choice: lời hứa
  rationale: Giữ danh từ số ít của nguyên văn và mối liên hệ với cơ nghiệp được hứa.
- source_word: λάβωσιν
  choice: có thể nhận được
  rationale: Diễn đạt tự nhiên thể giả định sau ὅπως, thể hiện kết quả được nhắm đến.
- source_word: οἱ κεκλημένοι
  choice: những người đã được kêu gọi
  rationale: 'Giữ ý nghĩa hoàn thành và bị động của phân từ: họ hiện ở trong tình trạng đã được kêu gọi.'
- source_word: τῆς αἰωνίου κληρονομίας
  choice: về cơ nghiệp đời đời
  rationale: “Cơ nghiệp” là cách nói trang trọng nhưng quen thuộc trong ngữ cảnh Kinh Thánh; “đời đời” giữ sự tương phản với những thực tại tạm thời.
theological_decisions:
- issue: Chủ thể hàm ẩn của ἐστίν
  choice: Dùng “Ngài là”, quy chiếu về Đấng Christ trong ngữ cảnh trước đó.
  alternative: Lặp rõ “Đấng Christ là” hoặc cố để chủ thể hàm ẩn.
  rationale: Tiếng Việt cần chủ thể rõ ràng; “Ngài” nối tự nhiên với tiền ngữ cảnh mà không thêm một danh xưng không có trong chính câu.
- issue: Nghĩa của διαθήκη
  choice: Dịch là “giao ước” trong chính văn.
  alternative: “Di chúc”.
  rationale: Sự đối chiếu giữa giao ước mới và giao ước thứ nhất chi phối câu 15, nhưng nghĩa “di chúc” vẫn là khả năng từ vựng có liên quan đến lập luận ở 9:16–17 nên được ghi ở chú thích.
- issue: Quan hệ của θανάτου γενομένου với sự cứu chuộc
  choice: Dịch “nhờ sự chết đã xảy ra nhằm chuộc khỏi...”
  alternative: “sau khi một cái chết đã xảy ra để cứu chuộc...” hoặc “vì đã có sự chết để cứu chuộc...”.
  rationale: Cách dịch giữ biến cố chết như nền tảng hữu hiệu của sự cứu chuộc, nhưng không làm mất tính cô đọng và độ mở cú pháp của kết cấu sở hữu tuyệt đối.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Viết hoa “Đấng Trung Gian” như một danh xưng theo chức năng trong ngữ cảnh; dùng “Ngài” để nối với Đấng Christ đã được nhắc đến trước đó. Giữ câu dài tương ứng với cấu trúc lập luận của nguyên văn nhưng sắp xếp các cụm từ theo trật tự tự nhiên của tiếng Việt.
