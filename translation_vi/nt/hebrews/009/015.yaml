revisions:
- from: Vì vậy, Ngài là Đấng Trung Gian của một giao ước mới[a], để nhờ sự chết đã xảy ra nhằm chuộc khỏi những vi phạm dưới giao ước thứ nhất, những người đã được kêu gọi có thể nhận được lời hứa về cơ nghiệp đời đời.
  to: Vì lý do đó, Ngài là Đấng Trung Gian của một giao ước mới[a], để những người đã được kêu gọi có thể nhận lãnh lời hứa về cơ nghiệp đời đời, nhờ sự chết đã xảy ra để cứu chuộc họ khỏi những vi phạm dưới giao ước thứ nhất.
  rationale: Sửa cấu trúc “nhờ sự chết đã xảy ra nhằm chuộc khỏi...” thành “nhờ sự chết đã xảy ra để cứu chuộc họ khỏi...”. Cách này giữ chức năng mục đích của ὅπως, giữ cái chết như cơ sở của sự cứu chuộc trong sở hữu tuyệt đối θανάτου γενομένου, và làm rõ rằng những người được kêu gọi là những người được cứu chuộc khỏi các vi phạm. Chú thích được hiệu đính nhẹ cho tự nhiên hơn, vẫn bảo toàn khả năng nghĩa “di chúc” mà không thay thế nghĩa chính “giao ước”.
  reviewer_model: gpt-5.6-terra
