id: HEB.9.19
reference: Hebrews 9:19
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: λαληθείσης γὰρ πάσης ἐντολῆς κατὰ ⸀τὸν νόμον ὑπὸ Μωϋσέως παντὶ τῷ λαῷ, λαβὼν τὸ αἷμα τῶν ⸀μόσχων μετὰ ὕδατος καὶ ἐρίου κοκκίνου καὶ ὑσσώπου αὐτό τε τὸ βιβλίον καὶ πάντα τὸν λαὸν ἐράντισεν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/019.yaml
  text: For when every commandment according to the law had been spoken by Moses to all the people[a], he took the blood of the calves with water and scarlet wool and hyssop, and sprinkled both the scroll itself and all the people,
translation:
  language: vi
  text: Vì sau khi Môi-se đã công bố mọi điều răn theo luật pháp cho toàn dân, ông lấy máu của các con bê[a], cùng với nước, len đỏ thắm và bài hương, rồi rảy lên chính cuộn sách và toàn dân,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “các bò đực non.” Từ Hy Lạp μόσχων có thể chỉ bê hoặc bò đực non trong bối cảnh tế lễ.
    reason: lexical_alternative
lexical_decisions:
- source_word: λαληθείσης γὰρ πάσης ἐντολῆς
  choice: Vì sau khi ... đã truyền lại ... mọi điều răn
  rationale: Cấu trúc sở hữu cách tuyệt đối mang ý nghĩa thời gian; “sau khi” diễn đạt tự nhiên trình tự hành động. “Mọi điều răn” giữ được sức phân bố của πάσης, còn “truyền lại” phù hợp với việc Môi-se công bố các mệnh lệnh cho dân.
- source_word: κατὰ τὸν νόμον
  choice: theo luật pháp
  rationale: Diễn đạt trực tiếp ý nghĩa phù hợp hoặc căn cứ theo luật; cách nói tự nhiên, trang trọng trong tiếng Việt hiện đại.
- source_word: ὑπὸ Μωϋσέως παντὶ τῷ λαῷ
  choice: Môi-se ... cho toàn dân
  rationale: Giữ Môi-se là tác nhân của hành động nói và thể hiện tính toàn thể của đối tượng nghe.
- source_word: λαβὼν
  choice: ông lấy
  rationale: Chuyển phân từ aorist thành động từ hữu hạn để câu kể tự nhiên, đồng thời giữ đúng trình tự hành động.
- source_word: τὸ αἷμα τῶν μόσχων
  choice: máu của các con bê
  rationale: μόσχος có thể chỉ bê hoặc bò đực non. “Con bê” là tương đương trực tiếp; nghĩa “bò đực non” được giữ trong chú thích.
- source_word: μετὰ ὕδατος καὶ ἐρίου κοκκίνου καὶ ὑσσώπου
  choice: cùng với nước, len đỏ thắm và nhánh bài hương
  rationale: “Cùng với” bảo toàn quan hệ đi kèm mà không xác định quá mức cách pha hay sử dụng. “Len đỏ thắm” diễn đạt ἐρίου κοκκίνου; “nhánh bài hương” là cách gọi tự nhiên cho cây dùng trong nghi thức rảy.
- source_word: αὐτό τε τὸ βιβλίον καὶ πάντα τὸν λαὸν
  choice: cả chính cuộn sách lẫn toàn dân
  rationale: “Cuộn sách” phản ánh hình thức văn bản cổ phù hợp hơn “quyển sách”; “chính” giữ sắc thái nhấn mạnh của αὐτό, còn “cả ... lẫn ...” thể hiện cặp τε ... καί.
- source_word: ἐράντισεν
  choice: rảy lên
  rationale: “Rảy” là động từ tiếng Việt rõ ràng và quen dùng cho hành động nghi lễ này; “lên” làm sáng tỏ các đối tượng tiếp nhận mà không thêm nội dung giải thích.
theological_decisions:
- issue: Mối liên hệ với trình thuật Xuất Hành 24 và cách hiểu μόσχων
  choice: Dịch nguyên văn Hy Lạp là “các con bê” và không điều hòa với trình thuật Cựu Ước.
  alternative: Dịch “các bò đực non” hoặc thêm chi tiết giải thích nghi lễ.
  rationale: Câu Hê-bơ-rơ cần được giữ theo cách trình bày cô đọng riêng của tác giả. Chú thích bảo tồn khả năng từ vựng khác mà không áp đặt sự điều hòa vào chính văn.
- issue: Quan hệ của nước, len đỏ thắm và bài hương với máu
  choice: Dùng “cùng với” để giữ quan hệ đi kèm rộng của μετά.
  alternative: Diễn giải rằng máu được pha với nước hoặc xác định cụ thể cách len và bài hương được sử dụng.
  rationale: Nguyên văn liệt kê các yếu tố nhưng không giải thích đầy đủ quan hệ thao tác giữa chúng; bản dịch không nên âm thầm giải quyết sự cô đọng ấy.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Môi-se,” “luật pháp,” “cuộn sách,” “rảy” theo lối diễn đạt Kinh Thánh quen thuộc nhưng tránh thuật ngữ quá chuyên môn. Dấu phẩy cuối câu được giữ vì câu tiếp tục sang câu 20.
