revisions:
- from: Vì sau khi Môi-se đã truyền lại cho toàn dân mọi điều răn theo luật pháp, ông lấy máu của các con bê[a], cùng với nước, len đỏ thắm và nhánh bài hương, rồi rảy lên cả chính cuộn sách lẫn toàn dân,
  to: Vì sau khi Môi-se đã công bố mọi điều răn theo luật pháp cho toàn dân, ông lấy máu của các con bê[a], cùng với nước, len đỏ thắm và bài hương, rồi rảy lên chính cuộn sách và toàn dân,
  rationale: Thay “truyền lại” bằng “công bố” để phản ánh chính xác hơn λαληθείσης, và bỏ “nhánh” để không thêm chi tiết ngoài ὑσσώπου. Các yếu tố còn lại, kể cả “sau khi,” giữ được trình tự của phân từ aorist và không áp đặt cách thực hiện nghi thức.
