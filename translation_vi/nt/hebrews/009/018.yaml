id: HEB.9.18
reference: Hebrews 9:18
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὅθεν οὐδὲ ἡ πρώτη χωρὶς αἵματος ἐγκεκαίνισται·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/018.yaml
  text: Therefore not even the first covenant was inaugurated without blood[a].
translation:
  language: vi
  text: Vì thế, ngay cả giao ước thứ nhất cũng không được thiết lập mà không có huyết[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn chỉ nói “điều thứ nhất”, với danh từ được hiểu ngầm; trong ngữ cảnh, đó là giao ước thứ nhất. Cũng có thể dịch theo nghĩa “di chúc thứ nhất”.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅθεν
  choice: Vì thế
  rationale: Diễn đạt tự nhiên quan hệ suy luận từ lập luận ngay trước đó về giao ước, sự chết và huyết.
- source_word: οὐδὲ
  choice: ngay cả ... cũng không
  rationale: Giữ sắc thái phủ định nhấn mạnh “không ngay cả/đến cả ... cũng không” trong tiếng Hy Lạp.
- source_word: ἡ πρώτη
  choice: giao ước thứ nhất
  rationale: Tính từ giống cái được dùng như danh từ và hồi chỉ đến giao ước đang được bàn luận; thêm “giao ước” để câu tiếng Việt rõ nghĩa mà không đưa nội dung mới vào.
- source_word: χωρὶς αἵματος
  choice: mà không có huyết
  rationale: Giữ ý vắng thiếu huyết và sắc thái nghi lễ, giao ước; “huyết” phù hợp văn phong Kinh Thánh trang trọng.
- source_word: ἐγκεκαίνισται
  choice: được thiết lập
  rationale: Truyền đạt hành động khai lập và đưa giao ước vào hiệu lực. Cách dịch này tự nhiên hơn “được khánh thành” đối với giao ước, đồng thời không thu hẹp nghĩa chỉ còn sự phê chuẩn pháp lý.
theological_decisions:
- issue: Sở chỉ của “thứ nhất”
  choice: giao ước thứ nhất
  alternative: “điều thứ nhất”; hoặc “di chúc thứ nhất”
  rationale: Ngữ cảnh gần và rộng hơn của Hê-bơ-rơ 9 nói về giao ước thứ nhất và việc giao ước ấy được khai lập bằng huyết theo Xuất Ê-díp-tô Ký 24. Tuy nhiên, vì danh từ không xuất hiện trực tiếp trong câu Hy Lạp, ghi chú bảo lưu hình thức hàm ẩn của nguyên văn.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “giao ước” theo ngữ cảnh và “huyết” để giữ sắc thái nghi lễ Kinh Thánh; cấu trúc “ngay cả ... cũng không” bảo toàn điểm nhấn của nguyên văn.
