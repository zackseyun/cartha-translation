id: HEB.9.13
reference: Hebrews 9:13
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εἰ γὰρ τὸ αἷμα ⸂τράγων καὶ ταύρων⸃ καὶ σποδὸς δαμάλεως ῥαντίζουσα τοὺς κεκοινωμένους ἁγιάζει πρὸς τὴν τῆς σαρκὸς καθαρότητα,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/013.yaml
  text: For if the blood of goats and bulls[a], and the ashes of a heifer that sprinkle those who have been defiled, sanctify for the purification of the flesh[d][c][b],
translation:
  language: vi
  text: Vì nếu máu của dê đực và bò đực, cùng tro của bò cái tơ dùng để rảy trên những người đã bị ô uế,[a] thánh hóa họ để thân thể được thanh sạch,[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tức là những người đã trở nên không thanh sạch theo nghi lễ. Việc rảy tro bò cái tơ nhắc đến nghi thức thanh tẩy trong Dân Số 19.
    reason: lexical_alternative_and_cross_reference
  - marker: b
    text: Nghĩa là sự thanh sạch bên ngoài, thuộc thân thể, theo các nghi thức của giao ước cũ; câu 14 sẽ đối chiếu điều này với việc thanh tẩy lương tâm.
    reason: cultural_and_contextual_note
lexical_decisions:
- source_word: εἰ γὰρ
  choice: Vì nếu
  rationale: Giữ cả quan hệ lập luận của γάρ và cấu trúc điều kiện của εἰ; mệnh đề so sánh được tiếp nối ở câu 14.
- source_word: τὸ αἷμα τράγων καὶ ταύρων
  choice: máu của dê đực và bò đực
  rationale: Diễn đạt trực tiếp ngôn ngữ tế lễ; nêu rõ giới tính của các con vật theo nghĩa của τράγος và ταῦρος.
- source_word: σποδὸς δαμάλεως
  choice: tro của bò cái tơ
  rationale: Chỉ tro từ nghi thức bò cái tơ trong Dân Số 19; “bò cái tơ” vừa chính xác vừa dễ hiểu trong tiếng Việt hiện đại.
- source_word: ῥαντίζουσα
  choice: dùng để rảy trên
  rationale: Chuyển phân từ chủ động sang cách diễn đạt tự nhiên trong tiếng Việt, vẫn gắn hành động rảy với tro và không khiến người đọc hiểu bò cái tơ là tác nhân rảy.
- source_word: τοὺς κεκοινωμένους
  choice: những người đã bị ô uế
  rationale: Thể hoàn thành được phản ánh bằng “đã”; trong văn cảnh, κοινόω nói đến tình trạng ô uế theo nghi lễ.
- source_word: ἁγιάζει
  choice: thánh hóa họ
  rationale: Giữ sắc thái thờ phượng và thần học của động từ; “họ” làm rõ đối tượng vốn được hiểu từ cụm “những người đã bị ô uế”.
- source_word: πρὸς τὴν τῆς σαρκὸς καθαρότητα
  choice: để thân thể được thanh sạch
  rationale: Diễn đạt tự nhiên mục đích/kết quả của πρὸς; “thân thể” thể hiện nghĩa bên ngoài, thuộc thể chất của σάρξ trong nghi thức, tránh gợi sai nghĩa “bản tính tội lỗi”.
theological_decisions:
- issue: Ý nghĩa của “thánh hóa” trong hiệu lực của các nghi thức giao ước cũ
  choice: Sự thánh hóa theo nghi lễ, làm cho người ô uế đủ điều kiện thanh sạch trong phạm vi thờ phượng
  alternative: Sự biến đổi đạo đức hoặc thanh tẩy nội tâm toàn diện
  rationale: Cụm “để thân thể được thanh sạch” và sự đối chiếu với việc thanh tẩy lương tâm ở câu 14 giới hạn ý nghĩa tại đây vào phạm vi nghi lễ, nhưng bản dịch vẫn giữ từ “thánh hóa” của nguyên văn.
- issue: Nghĩa của σάρξ
  choice: Thân thể, tức phương diện bên ngoài thuộc nghi lễ
  alternative: Bản tính tội lỗi
  rationale: Văn cảnh nói về việc rảy máu và tro để xử lý tình trạng ô uế theo nghi lễ; vì vậy σάρξ không mang nghĩa đạo đức tiêu cực.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại. “Dê đực”, “bò đực”, “bò cái tơ” giữ độ chính xác của ngôn ngữ tế lễ; “dùng để rảy trên” tránh sự mơ hồ về tác nhân; “thân thể được thanh sạch” tự nhiên hơn “sự thanh sạch của xác thịt” và phù hợp nghĩa nghi lễ trong văn cảnh.
