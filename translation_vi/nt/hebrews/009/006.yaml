  verdict: revise
  source_fidelity: 'Bản dịch phản ánh đúng cấu trúc tổng quát: cụm sở hữu cách tuyệt đối nêu hoàn cảnh, sự đi vào theo thông lệ của các thầy tế lễ, gian thứ nhất của Đền Tạm, và việc thực hiện các phận sự phụng tự. Tuy nhiên, “mọi thứ” có thể mở rộng τούτων (“những điều này/các điều này”) thành toàn bộ mọi sự; nên giữ chỉ xuất rõ hơn. Cụm “để thực hiện” có thể được hiểu mạnh như mục đích, trong khi phân từ ἐπιτελοῦντες trực tiếp mô tả hoạt động đi kèm của các thầy tế lễ; dù cách diễn đạt này vẫn chấp nhận được trong tiếng Việt, có thể làm câu tự nhiên và sát chức năng hơn.'
  naturalness: Văn phong hiện đại, rõ ràng và phù hợp ngữ cảnh lịch sử-tôn giáo. “Phần thứ nhất của Đền Tạm” tránh cách hiểu có hai Đền Tạm riêng. “Cử hành các nghi lễ thờ phượng” tự nhiên hơn “thực hiện các nghi lễ thờ phượng” trong văn cảnh tế tự.
  terminology: “Đền Tạm” và “các thầy tế lễ” nhất quán, dễ hiểu và giữ bối cảnh Kinh Thánh. “Nghi lễ thờ phượng” chuyển tải τὰς λατρείας mà không áp đặt diễn giải giáo phái. Chú thích về σκηνή cần tránh gợi ý rằng “Đền Tạm thứ nhất” là cách hiểu ngữ cảnh chính; các lựa chọn “lều” và “gian/phần” nên được trình bày như thay thế từ vựng.
