revisions:
- from: Khi mọi thứ đã được sắp đặt như vậy, các thầy tế lễ thường xuyên đi vào phần thứ nhất của Đền Tạm[a] để thực hiện các nghi lễ thờ phượng[b].
  to: Khi những điều này đã được sắp đặt như vậy, các thầy tế lễ thường xuyên đi vào phần thứ nhất của Đền Tạm[a] và cử hành các nghi lễ thờ phượng[b].
