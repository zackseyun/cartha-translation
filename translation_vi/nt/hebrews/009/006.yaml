  - severity: low
    issue: “Để thực hiện” có sắc thái mục đích.
    rationale: ἐπιτελοῦντες là phân từ mô tả việc các thầy tế lễ đang làm khi vào; “và cử hành” giữ quan hệ đi kèm rõ hơn trong tiếng Việt.
  - severity: low
