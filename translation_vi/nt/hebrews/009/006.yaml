    rationale: Trong ngữ cảnh, σκηνή là gian/phần thứ nhất của cùng một Đền Tạm, không phải một Đền Tạm riêng thứ nhất. Chú thích nên ưu tiên giải thích này và chỉ ghi nhận các cách dịch từ vựng.
