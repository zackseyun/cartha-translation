reference: Hebrews 9:6
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Τούτων δὲ οὕτως κατεσκευασμένων, εἰς μὲν τὴν πρώτην σκηνὴν διὰ παντὸς εἰσίασιν οἱ ἱερεῖς τὰς λατρείας ἐπιτελοῦντες,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/006.yaml
  text: With these things prepared in this way[a], the priests continually enter the first tabernacle, performing the services[b],
translation:
  language: vi
  text: Khi những điều này đã được sắp đặt như vậy, các thầy tế lễ thường xuyên đi vào phần thứ nhất của Đền Tạm[a] và cử hành các nghi lễ thờ phượng[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “lều thứ nhất” hoặc “gian thứ nhất.” Từ Hy Lạp σκηνή có thể chỉ Đền Tạm hoặc, trong ngữ cảnh này, phần thứ nhất của Đền Tạm.
    reason: lexical_alternative
  - marker: b
    text: Hay “thi hành các phận sự phụng tự” hoặc “thực hiện các việc thờ phượng.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τούτων δὲ οὕτως κατεσκευασμένων
  choice: Khi mọi thứ đã được sắp đặt như vậy
  rationale: Cụm sở hữu cách tuyệt đối nêu hoàn cảnh cho mệnh đề tiếp theo. “Được sắp đặt” phù hợp với ngữ cảnh các vật dụng vừa được mô tả, không thu hẹp nghĩa thành việc xây dựng.
- source_word: εἰς μὲν τὴν πρώτην σκηνὴν
  choice: đi vào phần thứ nhất của Đền Tạm
  rationale: σκηνή có thể chỉ toàn bộ Đền Tạm hoặc một phần của nó; trong thế đối chiếu với phần thứ hai ở câu kế tiếp, cách diễn đạt này làm rõ đây là gian thứ nhất mà vẫn giữ bối cảnh thờ phượng của Đền Tạm.
- source_word: διὰ παντὸς
  choice: thường xuyên
  rationale: Chỉ hoạt động được lặp lại theo thông lệ, không nhất thiết diễn ra không ngừng từng giây phút.
- source_word: εἰσίασιν
  choice: đi vào
  rationale: Thì hiện tại Hy Lạp diễn tả hành động theo lệ thường; tiếng Việt dùng “đi vào” tự nhiên trong ngữ cảnh.
- source_word: οἱ ἱερεῖς
  choice: các thầy tế lễ
  rationale: Chỉ những thầy tế lễ thông thường, đối lập với thầy tế lễ thượng phẩm trong câu 7.
- source_word: τὰς λατρείας ἐπιτελοῦντες
  choice: để thực hiện các nghi lễ thờ phượng
  rationale: Diễn đạt các phận sự phụng tự được quy định trong nơi thánh; “nghi lễ thờ phượng” giữ cả sắc thái nghi lễ lẫn hướng quy về sự thờ phượng.
theological_decisions:
- issue: Nghĩa của σκηνή trong cấu trúc nơi thánh
  choice: phần thứ nhất của Đền Tạm
  alternative: Đền Tạm thứ nhất; lều thứ nhất; gian thứ nhất
  rationale: Ngữ cảnh mô tả hai phần của Đền Tạm. Cách chọn này giữ bối cảnh Môi-se và tránh khiến độc giả hiểu rằng có hai Đền Tạm riêng biệt, đồng thời ghi nhận trong chú thích rằng từ Hy Lạp có thể được diễn đạt theo những cách khác.
- issue: Sức nghĩa của διὰ παντός trong chức vụ tế lễ
  choice: thường xuyên
  alternative: liên tục; mọi lúc
  rationale: Cách dịch này giữ sự tương phản giữa việc các thầy tế lễ thường xuyên vào phần thứ nhất và việc thầy tế lễ thượng phẩm chỉ vào phần thứ hai mỗi năm một lần, mà không hàm ý họ hiện diện ở đó không gián đoạn.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. “Đền Tạm” giữ sắc thái lịch sử-thờ phượng; “phần thứ nhất” giúp độc giả nhận ra cấu trúc hai gian. Cấu trúc câu được điều chỉnh tự nhiên trong tiếng Việt nhưng vẫn giữ quan hệ hoàn cảnh và hành động của nguyên văn.
