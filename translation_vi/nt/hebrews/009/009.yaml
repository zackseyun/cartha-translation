id: HEB.9.9
reference: Hebrews 9:9
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἥτις παραβολὴ εἰς τὸν καιρὸν τὸν ἐνεστηκότα, καθ’ ⸀ἣν δῶρά τε καὶ θυσίαι προσφέρονται μὴ δυνάμεναι κατὰ συνείδησιν τελειῶσαι τὸν λατρεύοντα,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/009.yaml
  text: which is a parable for the present time[a], according to which both gifts and sacrifices are offered that are not able to perfect the worshiper with respect to conscience,
translation:
  language: vi
  text: Đó là một hình ảnh tượng trưng cho thời hiện tại[a], theo đó các lễ vật và sinh tế được dâng lên nhưng không thể làm cho người thờ phượng trở nên trọn vẹn về lương tâm.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “một biểu tượng” hoặc “một dụ ngôn” cho thời hiện tại.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἥτις
  choice: Điều ấy
  rationale: Đại từ quan hệ quy chiếu về sự sắp đặt của Đền Tạm ở câu trước; cách diễn đạt này tự nhiên trong tiếng Việt mà không xác định quá mức tiền ngữ.
- source_word: παραβολὴ
  choice: ẩn dụ
  rationale: Giữ ý về một sự trình bày mang tính hình tượng hoặc tương ứng; chú thích bảo lưu các cách hiểu khả dĩ khác trong ngữ cảnh nghi lễ.
- source_word: εἰς τὸν καιρὸν τὸν ἐνεστηκότα
  choice: về thời hiện tại
  rationale: Diễn đạt tự nhiên ý thời kỳ đang hiện hữu trong lập luận, không tự ý đồng nhất nó với một thời đại thần học cụ thể.
- source_word: καθ’ ἣν
  choice: theo đó
  rationale: Giữ mối liên hệ chi phối giữa hình ảnh/sự sắp đặt vừa nói đến và việc dâng lễ vật, sinh tế.
- source_word: δῶρά τε καὶ θυσίαι
  choice: các lễ vật và sinh tế
  rationale: Phân biệt hai thuật ngữ nghi lễ; 'sinh tế' thể hiện rõ θυσίαι là những vật hiến tế, thường có sự sát sinh.
- source_word: προσφέρονται
  choice: được dâng lên
  rationale: Thể bị động hiện tại, diễn tả hành vi dâng hiến trong nghi lễ mà không cần nêu tác nhân.
- source_word: μὴ δυνάμεναι
  choice: không thể
  rationale: Diễn đạt gọn và tự nhiên sự bất lực của các lễ vật và sinh tế.
- source_word: κατὰ συνείδησιν
  choice: về lương tâm
  rationale: Giới hạn phương diện mà sự làm nên trọn vẹn không đạt được, không biến câu thành nhận xét về lòng thành chủ quan.
- source_word: τελειῶσαι
  choice: làm cho ... trở nên trọn vẹn
  rationale: 'Bảo lưu sức nặng của τελειόω trong thư Hê-bơ-rơ: đưa đến tình trạng hoàn tất hoặc thích hợp trước Đức Chúa Trời.'
- source_word: τὸν λατρεύοντα
  choice: người thờ phượng
  rationale: Diễn đạt tự nhiên danh từ hóa của phân từ số ít, chỉ người đang thực hiện việc phụng thờ.
theological_decisions:
- issue: Cách dịch παραβολή trong ngữ cảnh nghi lễ và hình bóng
  choice: ẩn dụ
  alternative: biểu tượng; hình ảnh tượng trưng
  rationale: ‘Ẩn dụ’ giữ đặc tính biểu trưng và sự tương ứng của Đền Tạm với thực tại được bàn đến, nhưng không thu hẹp từ này thành một biểu tượng trừu tượng; các cách dịch thông dụng khác được giữ trong chú thích.
- issue: Phạm vi của κατὰ συνείδησιν
  choice: trở nên trọn vẹn về lương tâm
  alternative: làm cho lương tâm trở nên trọn vẹn
  rationale: Gắn cụm giới từ với việc làm cho người thờ phượng nên trọn vẹn trong phương diện lương tâm, thay vì biến chính lương tâm thành tân ngữ trực tiếp; như vậy bảo lưu cấu trúc và độ căng thần học của nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng ‘sinh tế’ để giữ sắc thái nghi lễ, ‘trọn vẹn’ để duy trì thuật ngữ thần học xuyên suốt thư Hê-bơ-rơ, và đặt dấu [a] ngay sau cụm được chú thích.
