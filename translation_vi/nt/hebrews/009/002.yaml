source:
  edition: SBLGNT
  text: σκηνὴ γὰρ κατεσκευάσθη ἡ πρώτη ἐν ᾗ ἥ τε λυχνία καὶ ἡ τράπεζα καὶ ἡ πρόθεσις τῶν ἄρτων, ἥτις λέγεται Ἅγια·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/002.yaml
  text: For a first tabernacle was prepared[a], in which were the lampstand and the table and the bread of the Presence[b], which is called the Holy Place.
translation:
  language: vi
  text: Vì phần thứ nhất của Lều Thánh đã được dựng lên; trong đó có chân đèn, bàn và bánh được bày ra[a]. Phần ấy được gọi là Nơi Thánh[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “sự bày ra của các bánh”; cũng thường được gọi là “bánh hiện diện” hoặc “bánh trưng bày.”'
    reason: lexical_alternative
  - marker: b
    text: Từ Hy Lạp ở đây có hình thức số nhiều, sát nghĩa là “Các Nơi Thánh”, nhưng trong câu này chỉ gian thứ nhất của Lều Thánh, tức Nơi Thánh.
    reason: lexical_alternative
lexical_decisions:
- source_word: σκηνὴ … ἡ πρώτη
  choice: phần thứ nhất của Lều Thánh
  rationale: Trong mạch văn, cụm này chỉ gian đầu của Lều Thánh, đối lập với gian phía sau bức màn ở câu kế tiếp. Cách dịch này tự nhiên trong tiếng Việt và tránh khiến người đọc hiểu là có hai Lều Thánh tách biệt.
- source_word: κατεσκευάσθη
  choice: đã được chuẩn bị
  rationale: Giữ sắc thái bị động và nghĩa rộng của động từ, có thể bao gồm việc dựng và sắp đặt không gian thờ phượng, thay vì thu hẹp thành việc xây dựng.
- source_word: λυχνία
  choice: chân đèn
  rationale: Chỉ giá đỡ các đèn dầu trong Lều Thánh; tránh từ ngữ gợi đến nến.
- source_word: τράπεζα
  choice: bàn
  rationale: Tương đương trực tiếp, tự nhiên cho vật dụng thánh được nói đến.
- source_word: ἡ πρόθεσις τῶν ἄρτων
  choice: bánh được bày ra
  rationale: Diễn đạt tự nhiên hành động đặt, bày các ổ bánh theo nghi thức, đồng thời bám sát cấu trúc Hy Lạp hơn cách gọi truyền thống.
- source_word: Ἅγια
  choice: Nơi Thánh
  rationale: Dù hình thức Hy Lạp là số nhiều, trong ngữ cảnh từ này gọi gian thứ nhất của Lều Thánh, đối lập với Nơi Chí Thánh ở câu sau.
theological_decisions:
- issue: Cách hiểu σκηνὴ ἡ πρώτη trong bố cục Lều Thánh
  choice: phần thứ nhất của Lều Thánh
  alternative: Lều thứ nhất
  rationale: Ngữ cảnh mô tả hai gian được ngăn bởi màn, không phải hai lều độc lập. Thêm “phần” làm rõ quan hệ không gian mà không đưa vào một khẳng định giáo lý.
- issue: Cách dịch danh xưng Ἅγια
  choice: Nơi Thánh
  alternative: các nơi thánh
  rationale: Bản dịch số ít thể hiện đúng đối tượng cụ thể trong ngữ cảnh, còn chú thích giữ lại hình thức số nhiều của nguyên văn để không che khuất sự mơ hồ ngữ pháp.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Lều Thánh”, “chân đèn” và “Nơi Thánh” duy trì liên hệ với thuật ngữ thờ phượng trong Cựu Ước; câu được tách làm hai để tránh một chuỗi mệnh đề nặng nề trong tiếng Việt.
