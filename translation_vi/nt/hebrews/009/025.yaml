review_pass:
  verdict: revise
  source_fidelity: Bản nháp truyền đạt đúng mạch phủ định mục đích của οὐδ’ ἵνα, sự dâng chính mình lặp lại (πολλάκις προσφέρῃ ἑαυτόν), sự so sánh với thượng tế, tính thường niên của κατ’ ἐνιαυτόν, và sự tương phản của αἵματι ἀλλοτρίῳ. Việc giữ cách nói “vào đó” dựa trên động từ “đi vào” ở câu trước là phù hợp với phép tỉnh lược của nguyên văn trong mạch câu.
  naturalness: Câu nhìn chung tự nhiên, trang trọng và phù hợp văn phong Kinh Thánh tiếng Việt hiện đại. Tuy nhiên, “bằng huyết” diễn đạt quan hệ phương tiện của ἐν tự nhiên và chính xác hơn “với huyết” trong ngữ cảnh nghi lễ. Bỏ “vị” trước “thượng tế” cũng giúp cách nói khái quát, quen thuộc hơn.
  terminology: “Ngài,” “dâng chính mình,” “thượng tế,” và “huyết” phù hợp register và thuật ngữ tế lễ. “Nơi thánh” là lựa chọn tiếng Việt tự nhiên, trong khi chú thích bảo lưu số nhiều của τὰ ἅγια và khả năng cách hiểu hẹp hơn; không nên xác định thẳng là “Nơi Chí Thánh” trong bản văn.
  issues:
  - severity: low
    issue: “với huyết” có thể gợi quan hệ đồng hành hơn là phương tiện.
    rationale: ἐν αἵματι ở đây chỉ phương tiện/huyết được dùng khi thượng tế đi vào; “bằng huyết” phản ánh rõ hơn chức năng này trong tiếng Việt.
  - severity: low
    issue: “vị thượng tế” hơi cụ thể hóa một nhân vật thay vì chức năng khái quát trong phép so sánh.
    rationale: Mạo từ số ít của tiếng Hy Lạp có thể mang nghĩa loại biệt/generic. “Thượng tế” tự nhiên hơn trong văn cảnh nghi lễ.
