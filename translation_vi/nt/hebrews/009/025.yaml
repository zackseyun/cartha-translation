id: HEB.9.25
reference: Hebrews 9:25
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οὐδ’ ἵνα πολλάκις προσφέρῃ ἑαυτόν, ὥσπερ ὁ ἀρχιερεὺς εἰσέρχεται εἰς τὰ ἅγια κατ’ ἐνιαυτὸν ἐν αἵματι ἀλλοτρίῳ,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/025.yaml
  text: Nor was it so that he might offer himself many times[a], just as the high priest enters the holy places year by year with blood not his own,
translation:
  language: vi
  text: Ngài cũng không vào đó để dâng chính mình nhiều lần, như thượng tế mỗi năm vào nơi thánh[a] bằng huyết không phải của mình.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn Hy Lạp là “các nơi thánh”; trong bối cảnh nghi lễ này, một số người hiểu cụm từ ấy cụ thể hơn là “Nơi Chí Thánh”.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδ’ ἵνα
  choice: cũng không vào đó để
  rationale: Cụm từ tiếp nối ý của câu trước, phủ định mục đích của việc Đấng Christ đi vào nơi thánh. “Vào đó” được bổ sung từ ngữ cảnh trực tiếp để câu tiếng Việt tự nhiên và rõ nghĩa.
- source_word: πολλάκις
  choice: nhiều lần
  rationale: Diễn đạt trực tiếp sự lặp lại, tương phản với tính không lặp lại của việc Đấng Christ dâng chính mình trong mạch văn.
- source_word: προσφέρῃ ἑαυτόν
  choice: dâng chính mình
  rationale: Giữ nghĩa tế lễ của προσφέρω và lực phản thân của ἑαυτόν, không diễn giải thêm bản chất của lễ dâng.
- source_word: ὥσπερ
  choice: như
  rationale: Từ nối so sánh tự nhiên trong tiếng Việt, đặt việc Đấng Christ dâng mình bên cạnh nghi thức hằng năm của thượng tế.
- source_word: ὁ ἀρχιερεὺς
  choice: vị thượng tế
  rationale: “Thượng tế” là cách gọi chính xác và quen thuộc cho chức vụ tư tế cao nhất trong bối cảnh Do Thái; “vị” tạo sắc thái trang trọng, tự nhiên.
- source_word: εἰσέρχεται
  choice: vào
  rationale: 'Giữ thì hiện tại mang ý nghĩa tập quán: vị thượng tế thực hiện việc này theo lệ thường.'
- source_word: εἰς τὰ ἅγια
  choice: vào nơi thánh
  rationale: “Nơi thánh” là cách diễn đạt tự nhiên cho danh từ số nhiều trung tính trong ngữ cảnh đền thánh, đồng thời không xác quyết quá mức rằng cụm từ chỉ riêng Nơi Chí Thánh; chú thích bảo lưu dạng số nhiều và khả năng hiểu hẹp hơn.
- source_word: κατ’ ἐνιαυτὸν
  choice: mỗi năm
  rationale: Diễn đạt tự nhiên chu kỳ hằng năm và làm nổi bật tính lặp lại của nghi lễ.
- source_word: ἐν αἵματι ἀλλοτρίῳ
  choice: với huyết không phải của chính mình
  rationale: “Với” truyền đạt phương tiện được dùng khi đi vào; “không phải của chính mình” giữ sự tương phản với việc Đấng Christ dâng chính mình. “Huyết” duy trì văn phong trang trọng và sắc thái tế lễ.
theological_decisions:
- issue: Ý nghĩa của sự so sánh giữa Đấng Christ và thượng tế Lê-vi
  choice: Câu này đối chiếu việc Đấng Christ không dâng chính mình nhiều lần với việc thượng tế mỗi năm đi vào nơi thánh bằng huyết không phải của mình.
  alternative: Có thể hiểu τὰ ἅγια theo nghĩa hẹp là Nơi Chí Thánh, thay vì nơi thánh nói chung.
  rationale: Mạch văn nhấn mạnh sự tương phản giữa sự dâng mình của Đấng Christ và nghi lễ lặp lại hằng năm của thượng tế. Bản dịch giữ nguyên sự tương phản này nhưng không thêm kết luận thần học vượt quá nội dung câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cấu trúc “cũng không vào đó để” nối tự nhiên với câu trước; “huyết” được dùng thay cho “máu” nhằm giữ sắc thái thờ phượng và tế lễ của phân đoạn.
