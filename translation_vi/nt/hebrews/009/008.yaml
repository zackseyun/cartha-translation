id: HEB.9.8
reference: Hebrews 9:8
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: τοῦτο δηλοῦντος τοῦ πνεύματος τοῦ ἁγίου, μήπω πεφανερῶσθαι τὴν τῶν ἁγίων ὁδὸν ἔτι τῆς πρώτης σκηνῆς ἐχούσης στάσιν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/008.yaml
  text: By this the Holy Spirit is indicating that the way into the holy places has not yet been revealed while the first tabernacle still has standing,
translation:
  language: vi
  text: Qua điều này, Đức Thánh Linh cho thấy rằng đường vào các nơi thánh[a] vẫn chưa được bày tỏ, bao lâu gian thứ nhất của Đền Tạm còn tồn tại.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “đường vào nơi thánh”; một số người hiểu cụ thể là “đường vào Nơi Chí Thánh.”
    reason: Giữ các khả năng diễn giải của cụm số nhiều τῶν ἁγίων trong ngữ cảnh nơi thánh.
  - marker: b
    text: Cũng có thể dịch là “bao lâu gian thứ nhất của Đền Tạm vẫn còn đứng đó” hoặc “vẫn còn hiệu lực.”
    reason: στάσις có thể nhấn mạnh sự hiện hữu liên tục hoặc địa vị còn được duy trì.
lexical_decisions:
- source_word: δηλοῦντος
  choice: cho thấy
  rationale: Diễn đạt tự nhiên sức giải thích của phân từ hiện tại trong kết cấu sở hữu cách tuyệt đối, đồng thời giữ ý Đức Thánh Linh đang làm rõ ý nghĩa của nghi lễ vừa nêu.
- source_word: πνεύματος τοῦ ἁγίου
  choice: Đức Thánh Linh
  rationale: Cách gọi tiêu chuẩn, trang trọng và quen thuộc trong tiếng Việt hiện đại.
- source_word: μήπω πεφανερῶσθαι
  choice: vẫn chưa được bày tỏ
  rationale: Thể hoàn thành bị động diễn tả tình trạng con đường ấy chưa được làm cho hiển lộ; “vẫn chưa” giữ sắc thái kéo dài đến thời điểm đang nói.
- source_word: τὴν τῶν ἁγίων ὁδὸν
  choice: lối vào các nơi thánh
  rationale: Trong ngữ cảnh Đền Tạm, cụm này chỉ sự tiếp cận không gian thánh. “Các nơi thánh” giữ số nhiều của tiếng Hy Lạp và không thu hẹp quá mức vào riêng Nơi Chí Thánh.
- source_word: πρώτης σκηνῆς
  choice: gian lều thứ nhất
  rationale: Ngữ cảnh ngay trước đó phân biệt hai gian của Lều Hội Kiến. “Gian lều” giúp người đọc hiểu đây là sự phân chia không gian, đồng thời vẫn phản ánh σκηνή là lều.
- source_word: ἐχούσης στάσιν
  choice: còn tồn tại
  rationale: Cụm này có thể nói đến tình trạng tiếp tục hiện hữu hoặc còn hiệu lực, không nhất thiết chỉ tư thế đứng theo nghĩa vật lý; “còn tồn tại” giữ được độ rộng ấy.
- source_word: ἔτι
  choice: còn
  rationale: Diễn tả sự tiếp diễn trong mệnh đề thời gian một cách gọn và tự nhiên.
theological_decisions:
- issue: Đối tượng quy chiếu của τῶν ἁγίων
  choice: các nơi thánh, tức không gian thánh của Đền Tạm
  alternative: con đường của các thánh đồ
  rationale: Bố cục Đền Tạm và việc các thầy tế lễ ra vào chi phối toàn bộ ngữ cảnh, nên đây là nghĩa không gian-nghi lễ chứ không phải chỉ những người thánh.
- issue: Mức độ cụ thể của không gian thánh
  choice: giữ nghĩa rộng bằng “các nơi thánh”
  alternative: chỉ riêng Nơi Chí Thánh
  rationale: Ngữ cảnh có thể đặc biệt hướng đến gian trong cùng, nhưng dạng số nhiều của tiếng Hy Lạp không buộc phải thu hẹp như vậy; bản dịch chính giữ nguyên độ mơ hồ chính đáng.
- issue: Ý nghĩa của việc gian lều thứ nhất còn có στάσις
  choice: còn tồn tại
  alternative: vẫn còn đứng đó; vẫn còn hiệu lực
  rationale: Câu có thể nhấn mạnh sự tiếp tục hiện hữu của trật tự thờ phượng gắn với gian thứ nhất, nhưng không nên biến hàm ý ấy thành một kết luận thần học quá cụ thể trong chính văn.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại. “Qua điều này” nối trực tiếp với mô tả nghi lễ ở câu trước; “bao lâu” giữ quan hệ thời gian của mệnh đề cuối. Dùng “gian lều” để tránh khiến “lều thứ nhất” bị hiểu thuần túy là một Đền Tạm có trước theo trình tự lịch sử.
