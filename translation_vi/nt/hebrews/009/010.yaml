source:
  edition: SBLGNT
  text: μόνον ἐπὶ βρώμασιν καὶ πόμασιν καὶ διαφόροις βαπτισμοῖς, ⸀δικαιώματα σαρκὸς μέχρι καιροῦ διορθώσεως ἐπικείμενα.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/010.yaml
  text: concerned only with foods and drinks and various washings, fleshly regulations imposed until the time of reformation.
translation:
  language: vi
  text: chỉ liên quan đến thức ăn, thức uống và các sự tẩy rửa khác nhau, là những quy định thuộc phạm vi thân thể, được áp đặt cho đến thời kỳ chỉnh đốn.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βαπτισμοῖς
  choice: nghi thức tẩy rửa
  rationale: Trong ngữ cảnh các quy định nghi lễ của giao ước cũ, từ số nhiều này chỉ những việc rửa thanh tẩy khác nhau, không nên dịch thành “báp-têm”.
- source_word: δικαιώματα σαρκὸς
  choice: những quy định về thân thể
  rationale: Giữ ý các quy định thuộc phạm vi thể chất, bên ngoài; tránh “xác thịt”, vốn trong tiếng Việt dễ bị hiểu là bản tính tội lỗi.
- source_word: ἐπικείμενα
  choice: có hiệu lực
  rationale: Diễn đạt tự nhiên ý các quy định được đặt lên và ràng buộc trong một khoảng thời gian, đồng thời không nhấn quá mức sắc thái cưỡng ép.
- source_word: καιροῦ διορθώσεως
  choice: thời kỳ chấn chỉnh
  rationale: διορθώσεως mang ý chỉnh lại, đặt lại cho đúng. “Chấn chỉnh” giữ được ý đó mà tránh “Cải Cách”, vốn có thể bị hiểu là cuộc Cải Chánh Tin Lành trong lịch sử.
theological_decisions:
- issue: Phạm vi của “σαρκός”
  choice: Hiểu là phạm vi thân thể/bên ngoài của các quy định nghi lễ.
  alternative: Dịch “thuộc về xác thịt”, có thể gợi ý rằng chính các quy định mang tính tội lỗi.
  rationale: Ngữ cảnh đối chiếu nghi lễ bên ngoài với sự thanh tẩy lương tâm; câu không tuyên bố các quy định ấy là tội lỗi.
- issue: Bản chất của “thời kỳ chấn chỉnh”
  choice: Giữ cách nói khái quát, không xác định ngay đó là một biến cố lịch sử hay hệ thống thần học cụ thể.
  alternative: Giải nghĩa trực tiếp là thời giao ước mới, thời Đấng Christ, hoặc cuộc cải cách.
  rationale: Bản văn nêu một thời kỳ sắp đặt lại nhưng trong chính câu này không triển khai đầy đủ cách định danh thần học.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dấu gạch ngang làm rõ rằng “những quy định về thân thể” đồng vị với các điều vừa kể, đồng thời giữ cấu trúc của câu Hy Lạp vốn là một mảnh cú pháp nối với câu trước.
