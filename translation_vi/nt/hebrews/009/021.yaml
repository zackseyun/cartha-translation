reference: Hebrews 9:21
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ τὴν σκηνὴν δὲ καὶ πάντα τὰ σκεύη τῆς λειτουργίας τῷ αἵματι ὁμοίως ἐράντισεν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/021.yaml
  text: And likewise he sprinkled with the blood both the tabernacle and all the vessels of the ministry[a][b].
translation:
  language: vi
  text: Cũng vậy, ông lấy huyết rảy trên cả Đền Tạm[a] lẫn mọi vật dụng dùng trong việc phụng sự[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “lều.” Từ Hy Lạp có thể có nghĩa là “lều”, nhưng trong ngữ cảnh này chỉ Đền Tạm.
    reason: lexical_alternative
  - marker: b
    text: Hay “mọi vật dụng của nghi lễ phụng sự.”
    reason: lexical_alternative
lexical_decisions:
- source_word: σκηνή
  choice: Đền Tạm
  rationale: Trong ngữ cảnh Hê-bơ-rơ 9, từ này chỉ nơi thánh dạng lều trong thời Môi-se, chứ không phải một chiếc lều thông thường. “Đền Tạm” vừa quen thuộc vừa giữ được ý nghĩa thánh sở.
- source_word: σκεύη
  choice: vật dụng
  rationale: Từ này chỉ các đồ vật hoặc dụng cụ được dùng trong nghi lễ. “Vật dụng” tự nhiên trong tiếng Việt hiện đại và đủ rộng để bao quát các loại đồ dùng trong Đền Tạm.
- source_word: λειτουργία
  choice: việc phụng sự
  rationale: Ở đây từ này nói đến sự phục vụ mang tính tư tế và nghi lễ. “Việc phụng sự” giữ sắc thái tôn giáo mà vẫn dễ hiểu; “nghi lễ” là một cách diễn đạt khác có thể có.
- source_word: αἷμα
  choice: huyết
  rationale: Chỉ huyết của sinh tế trong bối cảnh nghi lễ. “Huyết” phù hợp với văn phong Kinh Thánh trang trọng và cách nói về tế lễ.
- source_word: ὁμοίως
  choice: Cũng vậy
  rationale: Liên kết hành động này với việc rảy huyết được nói đến ở câu trước và giữ nguyên ý so sánh.
- source_word: ἐράντισεν
  choice: lấy huyết rảy trên
  rationale: “Rảy” là cách diễn đạt rõ ràng, quen thuộc cho hành động dùng huyết trong nghi lễ; thêm “lấy huyết” thể hiện phương tiện ở dạng τῷ αἵματι một cách tự nhiên trong tiếng Việt.
- source_word: δὲ
  choice: không dịch riêng
  rationale: Tiểu từ này chỉ tạo liên kết nhẹ; “Cũng vậy” đã chuyển tải mạch nối của câu, nên thêm “và” sẽ nặng và kém tự nhiên.
- source_word: πάντα τὰ σκεύη
  choice: mọi vật dụng
  rationale: “Mọi” thể hiện tính bao quát của πάντα, còn “vật dụng” chuyển tải số nhiều theo lối tự nhiên của tiếng Việt.
- source_word: καὶ ... καὶ
  choice: cả ... lẫn
  rationale: 'Cấu trúc tương liên này làm rõ hai đối tượng đều được rảy huyết: Đền Tạm và toàn bộ các vật dụng phục vụ.'
theological_decisions:
- issue: Quan hệ giữa câu này với nghi lễ thời Môi-se được thuật lại trong sách Xuất Hành
  choice: Dịch như lời tóm lược trực tiếp của tác giả về việc rảy huyết trên Đền Tạm và các vật dụng phục vụ, không thêm lời giải thích hay điều hòa các chi tiết.
  alternative: Mở rộng bản văn để giải thích bối cảnh lịch sử hoặc xử lý những khác biệt được nhận thấy khi đối chiếu với Xuất Hành.
  rationale: Nguyên văn chỉ đưa ra lời tóm lược nghi lễ. Bản dịch cần giữ nguyên phát biểu và sự căng thẳng liên văn bản nếu có, thay vì giải quyết chúng ngay trong chính văn.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “Đền Tạm” theo ngữ cảnh thánh sở thời Môi-se; “phụng sự” giữ sắc thái tư tế và nghi lễ. Trật tự câu được điều chỉnh tự nhiên cho tiếng Việt nhưng vẫn giữ cấu trúc bao quát “cả ... lẫn” của nguyên văn.
