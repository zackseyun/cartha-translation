id: HEB.9.14
reference: Hebrews 9:14
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: πόσῳ μᾶλλον τὸ αἷμα τοῦ Χριστοῦ, ὃς διὰ πνεύματος αἰωνίου ἑαυτὸν προσήνεγκεν ἄμωμον τῷ θεῷ, καθαριεῖ τὴν συνείδησιν ⸀ἡμῶν ἀπὸ νεκρῶν ἔργων εἰς τὸ λατρεύειν θεῷ ζῶντι.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/014.yaml
  text: how much more will the blood of Messiah—who through the eternal Spirit offered himself without blemish to God—cleanse our conscience from dead works to serve the living God[a].
translation:
  language: vi
  text: thì huyết của Đấng Mê-si—Đấng nhờ Thần Linh đời đời[a] đã dâng chính mình không tì vết lên Đức Chúa Trời—sẽ thanh tẩy lương tâm chúng ta khỏi những việc chết biết bao, để chúng ta phụng sự Đức Chúa Trời hằng sống!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “nhờ một thần linh đời đời.” Cụm từ Hy Lạp có thể được hiểu theo nghĩa rộng hơn, dù bản dịch chính hiểu “Thần Linh đời đời” là Thánh Linh.'
    reason: alternative_reading
lexical_decisions:
- source_word: πόσῳ μᾶλλον
  choice: lại càng… biết bao
  rationale: Giữ sức mạnh tu từ của lập luận từ điều nhỏ đến điều lớn, đồng thời nối tự nhiên với câu trước.
- source_word: τὸ αἷμα τοῦ Χριστοῦ
  choice: huyết của Đấng Mê-si
  rationale: “Huyết” bảo tồn sắc thái hiến tế; Χριστός được hiểu theo nghĩa tước hiệu nên dịch là “Đấng Mê-si”.
- source_word: διὰ πνεύματος αἰωνίου
  choice: nhờ Thần Linh đời đời
  rationale: “Nhờ” diễn đạt phương tiện/tác nhân của διά; viết hoa “Thần Linh” thể hiện cách hiểu quy chiếu đến Thánh Linh, nhưng ghi chú vẫn bảo tồn khả năng đọc rộng hơn.
- source_word: ἑαυτὸν προσήνεγκεν
  choice: đã dâng chính mình lên
  rationale: Giữ lực phản thân và ngôn ngữ dâng tế của προσφέρω trong văn mạch tư tế.
- source_word: ἄμωμον
  choice: như một lễ vật không tì vết
  rationale: “Không tì vết” giữ sắc thái thuật ngữ hiến tế; phần “như một lễ vật” làm rõ ý hàm chứa trong văn mạch mà không thay đổi đối tượng được dâng.
- source_word: καθαριεῖ τὴν συνείδησιν ἡμῶν
  choice: thanh tẩy lương tâm chúng ta
  rationale: “Thanh tẩy” phù hợp trường nghĩa nghi lễ của đoạn văn; thì tương lai Hy Lạp được thể hiện trong cấu trúc kết quả chắc chắn của câu hỏi tu từ tiếng Việt.
- source_word: ἀπὸ νεκρῶν ἔργων
  choice: khỏi những việc chết
  rationale: Giữ cách diễn đạt cô đọng và sự căng nghĩa thần học của nguyên văn, không diễn giải thành “việc dẫn đến sự chết”.
- source_word: εἰς τὸ λατρεύειν
  choice: để phụng sự
  rationale: Diễn đạt mục đích và bảo tồn cả sắc thái thờ phượng lẫn phục vụ mang tính tôn giáo của λατρεύω.
- source_word: θεῷ ζῶντι
  choice: Đức Chúa Trời hằng sống
  rationale: Cách nói tự nhiên, trang trọng và quen thuộc trong tiếng Việt Kinh Thánh, thể hiện tính xác định theo văn cảnh.
theological_decisions:
- issue: Đối tượng quy chiếu của πνεύματος αἰωνίου
  choice: Hiểu là Thánh Linh, dịch “Thần Linh đời đời”
  alternative: “nhờ một thần linh đời đời” hoặc thần linh/tinh thần đời đời của chính Đấng Mê-si
  rationale: Cụm không có mạo từ cho phép nhiều cách hiểu; văn mạch và cách đọc Cơ Đốc lâu đời ủng hộ quy chiếu đến Thánh Linh, nhưng sự mơ hồ thật được giữ trong chú thích.
- issue: Cách dịch Χριστός
  choice: Đấng Mê-si
  alternative: Đấng Christ
  rationale: Tại đây từ này mang giá trị tước hiệu trong lời trình bày về công việc hiến tế của Đấng được xức dầu; “Đấng Mê-si” chuyển tải nghĩa của tước hiệu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Dùng “huyết”, “thanh tẩy”, “phụng sự” để duy trì trường nghĩa hiến tế–thờ phượng của Hê-bơ-rơ; dấu gạch ngang giúp người đọc theo dõi mệnh đề quan hệ dài.
