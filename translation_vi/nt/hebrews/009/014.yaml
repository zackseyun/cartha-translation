- from: thì huyết của Đấng Mê-si—Đấng nhờ Thần Linh đời đời đã dâng chính mình lên Đức Chúa Trời như một lễ vật không tì vết—lại càng thanh tẩy lương tâm chúng ta khỏi những việc chết để phụng sự Đức Chúa Trời hằng sống biết bao![a]
  to: thì huyết của Đấng Mê-si—Đấng nhờ Thần Linh đời đời[a] đã dâng chính mình không tì vết lên Đức Chúa Trời—sẽ thanh tẩy lương tâm chúng ta khỏi những việc chết biết bao, để chúng ta phụng sự Đức Chúa Trời hằng sống!
