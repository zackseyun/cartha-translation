review_pass:
  verdict: revise
  source_fidelity: Cần biểu thị rõ thì tương lai của καθαριεῖ bằng “sẽ”. Bản nháp cũng thêm “như một lễ vật”, vốn không được nói trực tiếp trong nguyên văn; nên bỏ phần bổ sung này, trong khi vẫn giữ sắc thái hiến tế bằng “dâng chính mình không tì vết”.
  naturalness: Cấu trúc “thì … sẽ … biết bao!” là câu hỏi tu từ tự nhiên trong tiếng Việt, nối đúng với lập luận so sánh ở câu trước. “Để chúng ta phụng sự” làm rõ chủ thể ngầm của mệnh đề mục đích mà không đổi nghĩa.
  terminology: Giữ “Đấng Mê-si”, “huyết”, “lương tâm”, “việc chết”, “phụng sự”, và “Đức Chúa Trời hằng sống”. “Thần Linh đời đời” bảo lưu cách hiểu chính về πνεύματος αἰωνίου; chú thích vẫn nêu cách đọc thay thế không viết hoa.
  issues:
  - severity: medium
    issue: Thì tương lai của καθαριεῖ chưa được biểu thị minh nhiên.
    rationale: “Lại càng thanh tẩy … biết bao” có thể được hiểu như một khẳng định hiện tại. Động từ Hy Lạp là chỉ thị tương lai, nên cần “sẽ thanh tẩy”.
  - severity: low
    issue: Cụm “như một lễ vật” thêm nội dung diễn giải.
    rationale: ἄμωμον bổ nghĩa cho Đấng tự dâng mình, không nói rõ “như một lễ vật”. Bối cảnh hiến tế cho phép sắc thái này, nhưng bản dịch tối ưu-tương-đương không nên thêm nó vào thân văn.
  revised_text: thì huyết của Đấng Mê-si—Đấng nhờ Thần Linh đời đời[a] đã dâng chính mình không tì vết lên Đức Chúa Trời—sẽ thanh tẩy lương tâm chúng ta khỏi những việc chết biết bao, để chúng ta phụng sự Đức Chúa Trời hằng sống!
