id: HEB.9.11
reference: Hebrews 9:11
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Χριστὸς δὲ παραγενόμενος ἀρχιερεὺς τῶν ⸀γενομένων ἀγαθῶν διὰ τῆς μείζονος καὶ τελειοτέρας σκηνῆς οὐ χειροποιήτου, τοῦτ’ ἔστιν οὐ ταύτης τῆς κτίσεως,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/011.yaml
  text: But the Messiah came as high priest of the good things that have come[a], through the greater and more perfect tabernacle not made by hands—that is[b], not of this creation—
translation:
  language: vi
  text: Nhưng Đấng Mê-si đã đến với tư cách thầy tế lễ thượng phẩm của những điều tốt lành đã đến[a]; và qua đền tạm lớn hơn và hoàn hảo hơn, không do tay người dựng nên—nghĩa là, không thuộc cõi được tạo dựng này—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Một số thủ bản chép: “những điều tốt lành sẽ đến.”'
    reason: textual_variant
lexical_decisions:
- source_word: Χριστὸς
  choice: Đấng Mê-si
  rationale: Giữ nghĩa tước hiệu của Χριστός trong ngữ cảnh nói về chức vụ thầy tế lễ của Đấng được xức dầu.
- source_word: παραγενόμενος
  choice: đã đến
  rationale: Phản ánh trực tiếp phân từ aorist với ý Đấng Mê-si đã hiện diện và đảm nhận vai trò này, không thêm cách giải thích vượt quá nguyên văn.
- source_word: ἀρχιερεὺς
  choice: thầy tế lễ thượng phẩm
  rationale: Thuật ngữ tiếng Việt quen thuộc và chính xác cho chức vụ tư tế tối cao trong thư Hê-bơ-rơ.
- source_word: τῶν γενομένων ἀγαθῶν
  choice: của những điều tốt lành đã đến
  rationale: Theo bản văn SBLGNT với γενομένων, giữ sắc thái các điều tốt lành đã xuất hiện, đồng thời tránh diễn giải cụ thể chúng thành một loại phước lành riêng.
- source_word: διὰ τῆς ... σκηνῆς
  choice: qua đền tạm
  rationale: ‘Đền tạm’ bảo tồn hình ảnh nơi thánh trong hoang mạc; ‘qua’ cũng để ngỏ mối liên hệ cú pháp với động từ ‘đã vào’ ở câu kế tiếp.
- source_word: μείζονος καὶ τελειοτέρας
  choice: lớn hơn và hoàn hảo hơn
  rationale: Diễn đạt cả tính ưu việt và mối liên hệ thần học của τελειόω/τέλειος với sự hoàn hảo trong Hê-bơ-rơ.
- source_word: οὐ χειροποιήτου
  choice: không do tay người dựng nên
  rationale: Giữ thành ngữ Kinh Thánh chỉ điều không phải sản phẩm do con người chế tạo, với động từ tự nhiên cho đền tạm.
- source_word: τοῦτ’ ἔστιν
  choice: nghĩa là
  rationale: Dẫn vào lời giải thích trực tiếp theo nguyên văn.
- source_word: οὐ ταύτης τῆς κτίσεως
  choice: không thuộc cõi được tạo dựng này
  rationale: Diễn đạt κτίσις như trật tự thọ tạo hiện tại bằng ngôn ngữ hiện đại, dễ hiểu, không đồng nhất nó với một tạo vật riêng lẻ.
theological_decisions:
- issue: Dị bản và ý nghĩa của τῶν γενομένων ἀγαθῶν
  choice: những điều tốt lành đã đến
  alternative: những điều tốt lành sẽ đến
  rationale: Bản chính theo γενομένων của SBLGNT, chỉ những điều tốt lành đã đến; dị bản μελλόντων quen thuộc được ghi chú để bảo tồn sự minh bạch văn bản và căng thẳng cánh chung.
- issue: Quan hệ cú pháp của διὰ τῆς ... σκηνῆς
  choice: Giữ cụm ‘qua đền tạm...’ ở cuối câu với dấu gạch ngang mở sang câu kế tiếp
  alternative: Gắn cụm này trực tiếp với việc Đấng Mê-si ‘đã đến’
  rationale: Cấu trúc Hy Lạp có thể khiến người đọc tạm thời liên hệ cụm giới từ với phần trước, nhưng trong mạch câu 11–12, cụm này nhiều khả năng bổ nghĩa cho ‘đã vào’ ở câu 12. Bản dịch không âm thầm giải quyết hoàn toàn sự căng thẳng cú pháp đó.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại. Dùng ‘Đấng Mê-si’, ‘thầy tế lễ thượng phẩm’ và ‘đền tạm’ để giữ âm hưởng phụng tự của Hê-bơ-rơ. Dấu gạch ngang cuối câu được giữ vì câu Hy Lạp tiếp tục sang Hê-bơ-rơ 9:12.
