id: HEB.9.26
reference: Hebrews 9:26
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐπεὶ ἔδει αὐτὸν πολλάκις παθεῖν ἀπὸ καταβολῆς κόσμου· ⸀νυνὶ δὲ ἅπαξ ἐπὶ συντελείᾳ τῶν αἰώνων εἰς ἀθέτησιν ⸀ἁμαρτίας διὰ τῆς θυσίας αὐτοῦ πεφανέρωται.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/026.yaml
  text: Otherwise[a], he would have had to suffer many times since the foundation of the world. But as it is[c][b], he has appeared once for all at the consummation of the ages to put away sin through the sacrifice of himself.
translation:
  language: vi
  text: Nếu không, Ngài đã phải chịu khổ nhiều lần kể từ khi thế gian được dựng nên. Nhưng nay, vào lúc hoàn tất các thời đại[a], Ngài đã xuất hiện một lần đủ cả để xóa bỏ tội lỗi[b] qua sự hy sinh của chính Ngài[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “vào lúc kết thúc các thời đại.”'
    reason: lexical_alternative
  - marker: b
    text: “Xóa bỏ” cũng có thể hiểu là “loại bỏ” hoặc “làm cho tội lỗi mất hiệu lực.”
    reason: lexical_alternative
  - marker: c
    text: 'Nguyên văn: “qua sự hy sinh của chính Ngài”; cũng có thể dịch: “qua sự hy sinh của Ngài.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπεὶ
  choice: Nếu không
  rationale: Trong mạch lập luận, từ này nêu hệ quả giả định nếu Đấng Christ phải tự dâng nhiều lần; “Nếu không” diễn đạt tự nhiên quan hệ ấy trong tiếng Việt.
- source_word: ἔδει
  choice: đã phải
  rationale: Thì vị quá khứ của δεῖ trong lập luận mang tính giả định chỉ một sự tất yếu đáng lẽ đã xảy ra.
- source_word: πολλάκις
  choice: nhiều lần
  rationale: Giữ rõ sự đối lập với ἅπαξ, “một lần đủ cả,” ở vế sau.
- source_word: παθεῖν
  choice: chịu khổ
  rationale: Diễn đạt trực tiếp sự chịu khổ của Đấng Christ gắn với cái chết hiến tế.
- source_word: ἀπὸ καταβολῆς κόσμου
  choice: kể từ khi thế gian được dựng nên
  rationale: Truyền đạt thành ngữ thời gian bắt đầu từ lúc thế gian được thiết lập theo cách tự nhiên trong tiếng Việt.
- source_word: νυνὶ δὲ
  choice: Nhưng nay
  rationale: Giữ cả sắc thái tương phản với tình huống giả định lẫn yếu tố thời gian của νυνί.
- source_word: ἅπαξ
  choice: một lần đủ cả
  rationale: Thể hiện một lần duy nhất và có hiệu lực dứt khoát, đối lập với “nhiều lần,” mà không thêm một hệ thống giáo lý vào câu.
- source_word: ἐπὶ συντελείᾳ τῶν αἰώνων
  choice: vào thời kỳ viên mãn của các thời đại
  rationale: Giữ số nhiều của αἰῶνες và ý nghĩa đạt đến chỗ hoàn tất, cao điểm của συντέλεια.
- source_word: εἰς ἀθέτησιν ἁμαρτίας
  choice: để xóa bỏ tội lỗi
  rationale: “Xóa bỏ” diễn đạt tác động quyết liệt của ἀθέτησις—gạt bỏ, làm mất hiệu lực—bằng ngôn ngữ phổ thông; giữ ἁμαρτίας ở nghĩa tập thể/số ít.
- source_word: διὰ τῆς θυσίας αὐτοῦ
  choice: bằng cách dâng chính mình làm sinh tế
  rationale: Làm rõ ý sinh tế chính là bản thân Ngài, phù hợp văn cảnh tự hiến, đồng thời tự nhiên hơn lối dịch sát chữ “qua sinh tế của chính mình.”
- source_word: πεφανέρωται
  choice: Ngài đã xuất hiện
  rationale: Thì hoàn thành chỉ sự xuất hiện đã xảy ra và còn ý nghĩa hiện tại; “đã xuất hiện” là cách nói tự nhiên, trang trọng.
theological_decisions:
- issue: Sức nhấn của ἅπαξ đối với sự hiến tế của Đấng Christ
  choice: một lần đủ cả
  alternative: một lần
  rationale: Sự đối lập trực tiếp với πολλάκις (“nhiều lần”) cho thấy tính duy nhất và dứt khoát; cách dịch không khẳng định điều gì vượt quá lập luận của câu.
- issue: Phạm vi của danh từ số ít ἁμαρτίας
  choice: tội lỗi
  alternative: các tội lỗi
  rationale: Giữ ý niệm tập thể/trừu tượng về tội lỗi như thực tại bị xóa bỏ, thay vì giới hạn vào một danh sách hành vi riêng lẻ.
- issue: Quan hệ của αὐτοῦ trong διὰ τῆς θυσίας αὐτοῦ
  choice: dâng chính mình làm sinh tế
  alternative: qua sinh tế của Ngài
  rationale: Văn cảnh về việc Đấng Christ tự dâng mình hỗ trợ cách hiểu sinh tế là chính Ngài; chú thích bảo lưu lối dịch hình thức có thể hiểu rộng hơn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” cho đại từ chỉ Đấng Christ để tránh lặp tên trong một câu trích riêng lẻ. “Sinh tế” giữ trường nghĩa hiến tế của θυσία; các chú thích bảo lưu những cách hiểu có thật mà không áp đặt diễn giải hệ phái.
