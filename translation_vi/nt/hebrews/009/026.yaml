  terminology: «Một lần đủ cả», «tội lỗi», và «sự hy sinh» phù hợp ngữ cảnh thư Hê-bơ-rơ. «Sự hy sinh của chính Ngài» giữ trường nghĩa của θυσία mà không buộc cấu trúc «làm sinh tế» vào bản văn.
