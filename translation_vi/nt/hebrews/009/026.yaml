  source_fidelity: Bản dịch truyền đạt đúng lập luận phản thực của ἐπεὶ/ἔδει, sự đối lập giữa «nhiều lần» và ἅπαξ, cùng thì hoàn thành của πεφανέρωται. Tuy nhiên, «bằng cách dâng chính mình làm sinh tế» chuyển phương tiện διὰ τῆς θυσίας αὐτοῦ thành một cách thức diễn giải và mạnh hơn câu Hy Lạp. Cần giữ trực tiếp hơn ý «qua/nhờ sự hy sinh của chính Ngài».
