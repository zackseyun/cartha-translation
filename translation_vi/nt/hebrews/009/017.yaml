  rationale: Sửa cụm chính để không biến ἐπὶ νεκροῖς thành một mệnh đề thời gian rõ nghĩa hơn nguyên văn, đồng thời sửa cách gọi người lập để bảo toàn tính mở của ὁ διαθέμενος. Các chú thích tiếp tục nêu cả hai hướng đọc mà không áp đặt một cách giải thích giáo phái.
