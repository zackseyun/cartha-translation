    rationale: ἐπί với νεκροῖς là cụm cô đọng, gây tranh luận; cách dịch “khi có” làm câu xác định rằng hiệu lực bắt đầu lúc các cái chết xảy ra. Cần một cách nói mở hơn, cho phép cách hiểu về các sự chết trong việc xác lập giao ước mà không loại trừ cách đọc theo di chúc.
  - severity: low
    issue: “người lập giao ước” thu hẹp nghĩa của ὁ διαθέμενος.
    rationale: Phân từ này có thể chỉ người lập giao ước hoặc người lập di chúc. Vì chính văn đã chọn “giao ước”, “người lập nó” là cách quy chiếu tự nhiên hơn và ít diễn giải hơn.
