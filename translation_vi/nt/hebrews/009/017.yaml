id: HEB.9.17
reference: Hebrews 9:17
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: διαθήκη γὰρ ἐπὶ νεκροῖς βεβαία, ἐπεὶ ⸀μήποτε ἰσχύει ὅτε ζῇ ὁ διαθέμενος.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/017.yaml
  text: For a covenant is valid over dead ones[b][a], since it is never in force while the one who made it is living.
translation:
  language: vi
  text: Vì giao ước chỉ có hiệu lực trên cơ sở những cái chết,[a] bởi nó không bao giờ có hiệu lực khi người lập nó còn sống.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn là một cụm cô đọng, có thể hiểu gần nghĩa là “trên/đối với những người đã chết”. Cụm này có thể chỉ những người chết theo cách hiểu về di chúc, hoặc những sự chết liên quan đến việc xác lập giao ước.
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “Vì di chúc chỉ có hiệu lực sau khi người lập di chúc chết, bởi nó không bao giờ có hiệu lực khi người lập còn sống.” Từ Hy Lạp được dịch là “giao ước” cũng có thể có nghĩa là “di chúc”.'
    reason: alternative_reading
lexical_decisions:
- source_word: διαθήκη
  choice: giao ước
  rationale: Ngữ cảnh Hê-bơ-rơ 8–10 chủ yếu nói về giao ước và sự thiết lập giao ước bằng huyết. Tuy nhiên, từ Hy Lạp cũng có thể mang nghĩa “di chúc”; nghĩa này được giữ trong chú thích.
- source_word: ἐπὶ νεκροῖς
  choice: khi có những cái chết
  rationale: Cụm Hy Lạp cô đọng, theo sát mặt chữ là “trên/đối với những người hoặc vật đã chết”. Cách dịch này giữ dạng số nhiều và không xác định đó là cái chết của người lập di chúc hay những sinh mạng chết trong nghi thức xác lập giao ước.
- source_word: βεβαία
  choice: có hiệu lực
  rationale: Trong câu này, từ chỉ giá trị ràng buộc hoặc hiệu lực pháp lý/giao ước, không chỉ sự chắc chắn trừu tượng.
- source_word: ἐπεὶ
  choice: bởi
  rationale: Diễn đạt quan hệ giải thích-nguyên nhân tự nhiên trong tiếng Việt.
- source_word: μήποτε
  choice: không bao giờ
  rationale: 'Trong kết cấu này, từ mang nghĩa thời gian phủ định: không khi nào.'
- source_word: ἰσχύει
  choice: có hiệu lực
  rationale: Diễn đạt hiệu lực thực tế hoặc pháp lý của giao ước hay di chúc.
- source_word: ὅτε ζῇ
  choice: khi ... còn sống
  rationale: Giữ sự tương phản trực tiếp giữa cái chết và tình trạng vẫn sống.
- source_word: ὁ διαθέμενος
  choice: người lập giao ước
  rationale: Phù hợp với cách dịch chính “giao ước”; chú thích nêu cách hiểu “người lập di chúc” để bảo toàn khả năng nghĩa khác của nguyên ngữ.
theological_decisions:
- issue: Nên hiểu διαθήκη là “giao ước” hay “di chúc”.
  choice: Dùng “giao ước” trong chính văn.
  alternative: 'Có thể dịch cả câu theo nghĩa di chúc: “Vì di chúc chỉ có hiệu lực sau khi người lập di chúc chết, bởi nó không bao giờ có hiệu lực khi người lập còn sống.”'
  rationale: Mạch văn rộng của Hê-bơ-rơ 8–10 mang tính giao ước, nhưng ngôn ngữ trong 9:16–17 cũng cho phép cách hiểu pháp lý về di chúc. Chú thích giữ lại sự căng thẳng thực sự này.
- issue: Mức độ xác định nghĩa của ἐπὶ νεκροῖς.
  choice: Dịch mở là “khi có những cái chết”.
  alternative: “sau khi chết”, “trong trường hợp người đã chết”, hoặc hiểu về những sinh mạng chết trong nghi thức xác lập giao ước.
  rationale: Nguyên ngữ ngắn gọn và gây tranh luận; chính văn không nên tự ý quyết định rằng cụm từ chỉ nói về người lập di chúc hay các sinh tế chết để xác lập giao ước.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. “Có hiệu lực” truyền đạt sắc thái ràng buộc của βεβαία và ἰσχύει. Cách nói “khi có những cái chết” hơi khác lối nói thông thường nhưng cần thiết để giữ sự cô đọng và tính mơ hồ của nguyên ngữ; các chú thích giải thích hai hướng hiểu chính.
