review_pass:
  verdict: revise
  source_fidelity: Bản nháp giữ đúng cấu trúc nhân quả, sắc thái pháp lý của βεβαία/ἰσχύει, và không quyết định dứt khoát cuộc tranh luận về διαθήκη. Tuy nhiên, “khi có những cái chết” biến ἐπὶ νεκροῖς thành một mệnh đề điều kiện-thời gian và không phản ánh rõ quan hệ nền tảng/phạm vi được nêu bằng ἐπί. “Người lập giao ước” cũng thu hẹp ὁ διαθέμενος hơn mức cần thiết.
  naturalness: “Khi có những cái chết” không tự nhiên trong tiếng Việt hiện đại. “Trên cơ sở những cái chết” vẫn giữ tính cô đọng và số nhiều khó của nguyên văn, đồng thời diễn đạt tự nhiên hơn trong văn phong trang trọng.
  terminology: Giữ “giao ước” trong chính văn là phù hợp mạch văn Hê-bơ-rơ 8–10; chú thích phải tiếp tục nêu khả năng “di chúc”. “Người lập nó” phản ánh συμμετοχή ὁ διαθέμενος mà không thêm nhãn giải thích “người lập giao ước”.
  issues:
