  text: λέγων· Τοῦτο τὸ αἷμα τῆς διαθήκης ἧς ἐνετείλατο πρὸς ὑμᾶς ὁ θεός·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/020.yaml
  text: saying[a], “This is the blood of the covenant that God commanded for you.”
translation:
  language: vi
  text: 'mà nói: “Đây là huyết của giao ước mà Đức Chúa Trời đã truyền cho anh em.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγων
  choice: mà nói
  rationale: Phân từ hiện tại nối trực tiếp với hành động ở câu trước; “mà nói” giữ được sự liên kết ấy và tự nhiên trong tiếng Việt.
- source_word: Τοῦτο
  choice: Đây là
  rationale: Tiếng Hy Lạp lược bỏ hệ từ; tiếng Việt tự nhiên cần “là” để nối với vị ngữ danh từ.
- source_word: αἷμα
  choice: huyết
  rationale: Giữ hình ảnh cụ thể về máu tế lễ; “huyết” là từ trang trọng, quen thuộc trong văn cảnh Kinh Thánh và giao ước.
- source_word: διαθήκης
  choice: giao ước
  rationale: Văn cảnh nhắc đến Xuất Hành 24 và việc xác lập giao ước Môi-se, không phải di chúc.
- source_word: ἧς
  choice: mà
  rationale: Đại từ quan hệ sở hữu quy chiếu về “giao ước”; “mà” tạo câu tiếng Việt tự nhiên mà không giải thích quá mức quan hệ cú pháp.
- source_word: ἐνετείλατο
  choice: đã truyền
  rationale: Diễn đạt mệnh lệnh hoặc chỉ thị do Đức Chúa Trời ban; “truyền” trang trọng và phù hợp với văn cảnh giao ước.
- source_word: πρὸς ὑμᾶς
  choice: cho anh em
  rationale: Giữ hướng quy chiếu của πρός đến cộng đồng nhận giao ước. “Cho anh em” tự nhiên hơn “đến anh em” trong tiếng Việt, đồng thời không mở rộng thành “vì anh em”.
- source_word: ὁ θεός
  choice: Đức Chúa Trời
  rationale: Cách gọi trang trọng, rõ nghĩa và phổ biến trong tiếng Việt dành cho θεός trong văn cảnh này.
theological_decisions:
- issue: Nghĩa của διαθήκη trong bối cảnh nghi thức xác lập bằng huyết
  choice: giao ước
  alternative: di chúc
  rationale: Câu này vang vọng Xuất Hành 24:8 và nói về giao ước Môi-se; “di chúc” không phù hợp với bối cảnh trực tiếp.
- issue: Bổ sung hệ từ được hàm ý sau Τοῦτο
  choice: Đây là huyết của giao ước
  alternative: Đây, huyết của giao ước
  rationale: “Là” cần thiết để câu trích dẫn rõ ràng, tự nhiên trong tiếng Việt và không thêm nội dung thần học ngoài phép xác định vốn được hàm ý trong tiếng Hy Lạp.
- issue: Quan hệ của πρὸς ὑμᾶς với mệnh lệnh giao ước
  choice: đã truyền cho anh em
  alternative: đã truyền đến anh em / đã truyền về anh em
  rationale: “Cho anh em” diễn đạt tự nhiên việc mệnh lệnh được hướng đến dân chúng, nhưng tránh diễn giải thành lợi ích cứu chuộc bằng cách dùng “vì anh em”.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh em” cho số nhiều ὑμᾶς. Không thêm chú thích vì bản dịch chính có thể diễn đạt đầy đủ mà không che khuất một phương án nghĩa quan trọng.
