  source_fidelity: 'Bản dịch giữ đúng liên kết phân từ của λέγων bằng “mà nói”, diễn đạt đúng mệnh đề trích dẫn, và bảo toàn các từ trọng yếu: “huyết”, “giao ước”, “Đức Chúa Trời”. “Đã truyền cho anh em” là cách chuyển đạt có thể chấp nhận được cho ἐνετείλατο πρὸς ὑμᾶς, dù cấu trúc này vốn hơi bất thường cả trong tiếng Hy Lạp lẫn khi chuyển sang tiếng Việt.'
