id: HEB.1.1
reference: Hebrews 1:1
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Πολυμερῶς καὶ πολυτρόπως πάλαι ὁ θεὸς λαλήσας τοῖς πατράσιν ἐν τοῖς προφήταις
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/001.yaml
  text: Long ago[c][b][a], God spoke to the fathers in many parts and in many ways by the prophets.
translation:
  language: vi
  text: Thuở xưa, Đức Chúa Trời đã phán với các tổ phụ[a] từng phần[b] và bằng nhiều cách, qua các nhà tiên tri.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “các bậc tiền nhân”; nguyên văn là “các cha”.
    reason: lexical_alternative
  - marker: b
    text: Hay “nhiều lần”. Từ Hy Lạp có thể nhấn mạnh lời mặc khải được ban theo nhiều phần, trong khi cụm kế tiếp nhấn mạnh nhiều phương cách.
    reason: lexical_alternative
  - marker: c
    text: Hay “nhờ các nhà tiên tri”; sát chữ là “trong các nhà tiên tri”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πολυμερῶς
  choice: từng phần
  rationale: Cách dịch này giữ ý sự mặc khải trước kia được ban theo nhiều phần, đồng thời phân biệt rõ với πολυτρόπως là “bằng nhiều cách”. Cụm từ cũng có thể được hiểu theo chiều thời gian là “nhiều lần”, nên phương án ấy được ghi trong chú thích.
- source_word: πολυτρόπως
  choice: bằng nhiều cách
  rationale: Diễn đạt tự nhiên trong tiếng Việt hiện đại và truyền đạt sự đa dạng về phương thức, không nhập làm một với ý “từng phần” của trạng từ đứng trước.
- source_word: πάλαι
  choice: Thuở xưa
  rationale: Diễn đạt khoảng cách thời gian một cách trang trọng, tự nhiên, không quá cổ kính.
- source_word: ὁ θεὸς
  choice: Đức Chúa Trời
  rationale: Danh xưng tiếng Việt trang trọng và quen thuộc, thể hiện đúng chủ thể xác định của động từ.
- source_word: λαλήσας
  choice: đã phán
  rationale: Động từ “phán” phù hợp ngữ cảnh Đức Chúa Trời truyền lời. Dù nguyên văn dùng phân từ quá khứ gắn cú pháp với động từ chính ở câu 2, cách dùng động từ hữu hạn giúp câu 1 đọc tự nhiên khi đứng riêng mà vẫn giữ được bối cảnh thời gian quá khứ.
- source_word: τοῖς πατράσιν
  choice: với các tổ phụ
  rationale: “Các tổ phụ” giữ sắc thái lịch sử giao ước và từ ngữ chỉ những người đi trước trong nguyên văn, đồng thời tự nhiên hơn cách dịch sát chữ “các cha” trong tiếng Việt.
- source_word: ἐν τοῖς προφήταις
  choice: qua các nhà tiên tri
  rationale: Giới từ ἐν ở đây có thể mang nghĩa phương tiện hoặc môi giới; “qua” làm rõ Đức Chúa Trời là Đấng phán và các nhà tiên tri là những người truyền lời, mà không loại bỏ nghĩa sát chữ được nêu trong chú thích.
theological_decisions:
- issue: Quan hệ của phân từ λαλήσας trong câu 1 với động từ chính ở Hê-bơ-rơ 1:2
  choice: Dùng động từ hữu hạn “đã phán” trong câu 1, nhưng không thêm kết luận thần học vào câu.
  alternative: 'Dịch sát cấu trúc hơn: “Đức Chúa Trời, sau khi đã phán…” và để câu chưa hoàn tất cho đến câu 2.'
  rationale: Nguyên văn Hy Lạp nối phân từ của câu 1 với mệnh đề chính trong câu 2. Tuy nhiên, bản dịch theo từng câu cần dễ đọc; “đã phán” giữ hành động quá khứ và vẫn chuẩn bị cho sự đối chiếu thời gian ở câu kế tiếp mà không giải quyết thay độc giả ý nghĩa thần học của sự đối chiếu ấy.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. “Thuở xưa” tạo sắc thái mở đầu thích hợp; “các tổ phụ” giữ chiều kích lịch sử của nguyên văn. Trật tự câu được điều chỉnh nhẹ cho tự nhiên nhưng vẫn duy trì sự phân biệt giữa “từng phần” và “bằng nhiều cách”.
