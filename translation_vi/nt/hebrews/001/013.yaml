id: HEB.1.13
reference: Hebrews 1:13
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: πρὸς τίνα δὲ τῶν ἀγγέλων εἴρηκέν ποτε· Κάθου ἐκ δεξιῶν μου ἕως ἂν θῶ τοὺς ἐχθρούς σου ὑποπόδιον τῶν ποδῶν σου;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/013.yaml
  text: But to which of the angels has he ever said[a], ‘Sit at my right hand until I make your enemies a footstool for your feet’?”
translation:
  language: vi
  text: 'Nhưng Đức Chúa Trời đã bao giờ phán với thiên sứ nào rằng: “Hãy ngồi bên phải Ta, cho đến khi Ta đặt các kẻ thù của Con làm bệ dưới chân Con”[a]?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “cho đến khi Ta đặt các kẻ thù của Con dưới chân Con.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸς τίνα δὲ τῶν ἀγγέλων
  choice: Nhưng Đức Chúa Trời đã từng phán với thiên sứ nào
  rationale: πρός với τίνα sau động từ nói năng mang nghĩa “với ai”; δέ biểu thị sự tương phản với phần trước. Chủ ngữ hàm ẩn được diễn đạt là “Đức Chúa Trời” theo ngữ cảnh gần để câu tiếng Việt rõ và tự nhiên.
- source_word: εἴρηκέν ποτε
  choice: đã từng phán
  rationale: “Đã từng” chuyển tải ποτέ (“bao giờ/từng”), còn “phán” phù hợp với lời trực tiếp của Đức Chúa Trời. Thì hoàn thành Hy Lạp hàm ý lời đã phán vẫn có hiệu lực, nhưng tiếng Việt không cần đánh dấu riêng bằng hình thái thì.
- source_word: Κάθου
  choice: Hãy ngồi
  rationale: Mệnh lệnh của κάθημαι được chuyển tự nhiên và trang trọng là “Hãy ngồi”, không thêm sắc thái thụ động.
- source_word: ἐκ δεξιῶν μου
  choice: bên phải Ta
  rationale: Trong công thức đăng quang này, cụm từ có nghĩa chỉ vị trí danh dự ở phía hữu. “Bên phải Ta” là cách nói tự nhiên trong tiếng Việt và bảo tồn hình ảnh nguyên văn.
- source_word: ἕως ἂν θῶ
  choice: cho đến khi Ta đặt
  rationale: ἕως ἂν với động từ giả định hướng đến một biến cố tương lai. “Đặt” giữ gần nghĩa τίθημι và kết hợp tự nhiên với bổ ngữ “làm bệ chân”.
- source_word: τοὺς ἐχθρούς σου
  choice: các kẻ thù của Con
  rationale: Cụm danh từ số nhiều được dịch trực tiếp. Đại từ “Con” trong lời Đức Chúa Trời phán với Đấng được xức dầu vừa rõ quan hệ ngôi xưng trong tiếng Việt, vừa không thêm phần giải nghĩa ngoài bản văn.
- source_word: ὑποπόδιον τῶν ποδῶν σου
  choice: làm bệ chân Con
  rationale: “Bệ chân” bảo tồn hình ảnh Kinh Thánh về sự khuất phục. Cách nói này gọn và tự nhiên hơn lối lặp “bệ cho đôi chân”, trong khi chú thích nêu cách diễn đạt trực tiếp hơn.
theological_decisions:
- issue: Bảo tồn ý nghĩa Cơ Đốc học của lời trích Thi Thiên 110:1 mà không diễn giải quá mức
  choice: 'Giữ nguyên lời phán trực tiếp và hình ảnh đăng quang: “Hãy ngồi bên phải Ta… làm bệ chân Con.”'
  alternative: Diễn ý thành “cho đến khi Ta hoàn toàn đánh bại các kẻ thù của Con.”
  rationale: Lập luận của Hê-bơ-rơ dựa trên chính lời Kinh Thánh phán riêng với Con, tương phản với các thiên sứ. Vì vậy, bản dịch giữ hình ảnh ngai vị và sự khuất phục thay vì thay nó bằng lời giải thích.
- issue: Chủ ngữ hàm ẩn của εἴρηκέν
  choice: Nêu rõ “Đức Chúa Trời”
  alternative: Giữ chủ ngữ bằng đại từ “Ngài” hoặc lược bỏ chủ ngữ theo sát hình thức Hy Lạp
  rationale: Ngữ cảnh xác định Đức Chúa Trời là Đấng phán. Nêu danh xưng giúp câu hỏi tiếng Việt đứng độc lập, rõ nghĩa, mà không thay đổi đối tượng hay nội dung thần học.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu; dùng “phán” cho lời Đức Chúa Trời, “thiên sứ” theo cách dùng phổ thông, và đại từ Ta–Con trong lời trích để phân biệt rõ người phán với người được phán cùng. Dấu chú thích [a] đặt ngay sau lời trích.
