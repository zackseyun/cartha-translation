- from: 'Nhưng Đức Chúa Trời đã từng phán với thiên sứ nào rằng: “Hãy ngồi bên phải Ta, cho đến khi Ta đặt các kẻ thù của Con làm bệ chân Con”[a]?'
  to: 'Nhưng Đức Chúa Trời đã bao giờ phán với thiên sứ nào rằng: “Hãy ngồi bên phải Ta, cho đến khi Ta đặt các kẻ thù của Con làm bệ dưới chân Con”[a]?'
  rationale: Sửa “đã từng” thành “đã bao giờ” để phản ánh chính xác hơn ποτέ trong câu hỏi tu từ. Sửa “bệ chân Con” thành “bệ dưới chân Con” để diễn đạt minh bạch hơn cấu trúc “bệ cho/dưới chân”, đồng thời bảo toàn hình ảnh đăng quang và khuất phục của nguyên văn.
  reviewer_model: gpt-5.6-terra
