source:
  edition: SBLGNT
  text: οὐχὶ πάντες εἰσὶν λειτουργικὰ πνεύματα εἰς διακονίαν ἀποστελλόμενα διὰ τοὺς μέλλοντας κληρονομεῖν σωτηρίαν;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/014.yaml
  text: Are they not all ministering spirits, being sent out for service for the sake of those who are about to inherit salvation?[a]
translation:
  language: vi
  text: Chẳng phải tất cả họ đều là các thần linh phục vụ, được sai đi để thi hành công việc phục vụ vì ích lợi của những người sắp thừa hưởng sự cứu rỗi sao?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “những người sẽ thừa hưởng sự cứu rỗi.” Cụm từ Hy Lạp có sắc thái hướng về tương lai.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐχὶ πάντες
  choice: Chẳng phải tất cả họ đều... sao?
  rationale: Diễn đạt tự nhiên câu hỏi tu từ mong đợi câu trả lời khẳng định, đồng thời giữ phạm vi toàn thể của πάντες; đại từ “họ” nối với các thiên sứ trong văn cảnh.
- source_word: λειτουργικὰ πνεύματα
  choice: những thần linh phục vụ
  rationale: “Thần linh” chỉ các hữu thể thuộc thế giới thần linh, tức các thiên sứ trong văn cảnh; “phục vụ” giữ ý nghĩa phụng sự của λειτουργικός mà không biến nó thành một chức vụ giáo hội.
- source_word: εἰς διακονίαν
  choice: để phục vụ
  rationale: Diễn đạt rõ mục đích của giới từ εἰς và tự nhiên hơn trong tiếng Việt hiện đại.
- source_word: ἀποστελλόμενα
  choice: được sai đi
  rationale: Giữ thể bị động và ý được phái đi của phân từ hiện tại, đồng thời kết hợp trôi chảy với mệnh đề tiếng Việt.
- source_word: διὰ τοὺς
  choice: vì những người
  rationale: Trong ngữ cảnh, διά với đối cách nêu đối tượng thụ hưởng; “vì” diễn đạt ngắn gọn quan hệ vì lợi ích của họ.
- source_word: τοὺς μέλλοντας
  choice: những người sắp
  rationale: Giữ sắc thái hướng đến tương lai và tính dự liệu của μέλλω, không mở rộng thành ý tiền định.
- source_word: κληρονομεῖν
  choice: thừa hưởng
  rationale: Bảo tồn hình ảnh nhận phần gia nghiệp, đồng thời là cách nói tự nhiên trong tiếng Việt.
- source_word: σωτηρίαν
  choice: sự cứu rỗi
  rationale: Thuật ngữ thần học quen thuộc, phù hợp với chiều kích cứu thoát và cánh chung trong thư Hê-bơ-rơ.
theological_decisions:
- issue: Sắc thái của μέλλοντας κληρονομεῖν σωτηρίαν
  choice: những người sắp thừa hưởng sự cứu rỗi
  alternative: những người sẽ thừa hưởng sự cứu rỗi
  rationale: Bản dịch chính giữ sắc thái hướng đến tương lai, có phần cận kề hoặc dự liệu của μέλλω, nhưng không khẳng định thêm một lập trường về tiền định hay sự bảo đảm cứu rỗi.
- issue: Căn tính của πνεύματα
  choice: thần linh
  alternative: các linh
  rationale: Văn cảnh xác định các hữu thể này là thiên sứ, nhưng câu này gọi họ là πνεύματα. “Thần linh” giữ cách mô tả của nguyên văn mà không thay trực tiếp bằng “thiên sứ”.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại và dễ hiểu. Câu hỏi tu từ được giữ nguyên; cấu trúc được điều chỉnh theo cú pháp tiếng Việt. Cụm “để phục vụ” lặp lại gốc ý phục vụ của hai từ Hy Lạp khác nhau, phản ánh sự nhấn mạnh của nguyên văn.
