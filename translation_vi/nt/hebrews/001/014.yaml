  verdict: revise
  source_fidelity: Bản nháp giữ đúng câu hỏi tu từ khẳng định, phạm vi «tất cả», thể bị động của «được sai đi», và hình ảnh «thừa hưởng sự cứu rỗi». Tuy nhiên, «để phục vụ những người» dễ làm cho những người thừa hưởng trở thành đối tượng trực tiếp của διακονία, trong khi διὰ τοὺς μέλλοντας nêu những người được hưởng ích lợi. Bản sửa phân biệt hai quan hệ này.
  naturalness: 'Cấu trúc sửa vẫn trang trọng, hiện đại và tự nhiên hơn về quan hệ nghĩa: các thần linh được sai đi thực hiện việc phục vụ vì ích lợi của những người ấy. «Sắp thừa hưởng» giữ sắc thái hướng đến tương lai của μέλλω mà không khẳng định thời điểm cận kề một cách tuyệt đối.'
  terminology: «Các thần linh phục vụ» bảo tồn cách gọi πνεύματα trong nguyên văn và, nhờ văn cảnh trực tiếp nói về thiên sứ, không nên bị hiểu là một khẳng định về các thần linh độc lập. «Sự cứu rỗi» và «thừa hưởng» là các thuật ngữ phù hợp với thư Hê-bơ-rơ.
