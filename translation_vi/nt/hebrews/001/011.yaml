    reason: cross_reference
lexical_decisions:
- source_word: αὐτοὶ
  choice: Chúng
  rationale: Đại từ này chỉ trời và đất ở câu trước. “Chúng” tự nhiên trong tiếng Việt; sự tương phản với “Ngài” được thể hiện rõ qua cấu trúc câu.
- source_word: ἀπολοῦνται
  choice: sẽ tiêu vong
  rationale: Diễn tả việc đi đến chỗ chấm dứt hoặc không còn tồn tại. “Tiêu vong” giữ được sắc thái mạnh mà không hàm ý rõ một tác nhân hủy diệt.
- source_word: σὺ δὲ
  choice: nhưng Ngài
  rationale: Giữ sự tương phản mạnh giữa trật tự thọ tạo và Đấng đang được trực tiếp thưa với. “Ngài” là cách xưng hô tôn kính, tự nhiên trong văn phong Kinh Thánh tiếng Việt.
- source_word: διαμένεις
  choice: vẫn còn mãi
  rationale: Diễn tả sự tiếp tục tồn tại bền vững. Từ “vẫn” làm rõ thế tương phản, còn “mãi” chuyển tải sắc thái trường tồn trong ngữ cảnh mà không thêm một mệnh đề giải thích.
- source_word: πάντες
  choice: tất cả chúng
  rationale: Chỉ toàn thể các vật thọ tạo vừa được nhắc đến, đồng thời giữ lực bao quát của πάντες.
- source_word: ὡς ἱμάτιον
  choice: như áo
  rationale: ἱμάτιον chỉ y phục hoặc áo choàng. “Áo” là hình ảnh cụ thể, phổ thông và tự nhiên trong tiếng Việt.
- source_word: παλαιωθήσονται
  choice: sẽ cũ mòn
  rationale: Động từ có nghĩa trở nên cũ hoặc hao mòn theo thời gian. “Cũ mòn” vừa giữ ý già cũ vừa phù hợp với hình ảnh chiếc áo.
theological_decisions:
- issue: Đối tượng được thưa trực tiếp và hàm ý Kitô học
  choice: Giữ lời thưa trực tiếp với Đức Con bằng “Ngài vẫn còn mãi”.
  alternative: Diễn giải rõ chủ thể là Đức Con ngay trong câu.
  rationale: Trong mạch văn Hê-bơ-rơ 1, lời Thi Thiên 102 được áp dụng cho Đức Con. Bản dịch giữ nguyên ngôi thứ hai và sức nặng của sự tương phản nhưng không chèn thêm danh xưng hay lời giải thích thần học ngoài nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” trong lời thưa trực tiếp để biểu thị sự tôn kính; “tiêu vong” và “cũ mòn” giữ được sức mạnh cùng hình ảnh của nguyên văn.
