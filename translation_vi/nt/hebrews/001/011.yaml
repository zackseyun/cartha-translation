  verdict: revise
  source_fidelity: 'Bản nháp truyền đạt đúng tương phản chính: trời đất sẽ tiêu vong, còn Đấng được trực tiếp ngỏ lời thì tiếp tục tồn tại; toàn thể chúng sẽ cũ mòn như áo. Tuy nhiên, “mãi” trong “vẫn còn mãi” nhấn mạnh tính vĩnh cửu mạnh hơn động từ διαμένεις (“còn lại/tiếp tục tồn tại”) cần thiết trong chính câu này. Bỏ “mãi” giữ sát nguyên văn hơn, trong khi ngữ cảnh vẫn cho thấy tính bền vững của Đấng được thưa với.'
  naturalness: “Tất cả chúng sẽ” có thể hiểu được nhưng nặng và kém tự nhiên trong tiếng Việt hiện đại. “Tất cả sẽ” tự nhiên hơn vì quy chiếu đã rõ. Cụm “Đấng đang được thưa với” trong chú thích không tự nhiên; “Đấng được ngỏ lời” phù hợp hơn.
  terminology: “Tiêu vong,” “Ngài,” “cũ mòn,” và “áo” đều phù hợp với văn phong Kinh Thánh hiện đại và với các từ ἀπολοῦνται, διαμένεις, παλαιωθήσονται, ἱμάτιον. Không cần thêm danh xưng Kitô học vào thân câu; ngôi thứ hai tôn kính được giữ bằng “Ngài.”
  issues:
