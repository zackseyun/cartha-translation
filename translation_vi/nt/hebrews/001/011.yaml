    rationale: διαμένεις có nghĩa là “còn lại/tiếp tục tồn tại.” Tính tương phản bền vững được bảo toàn bằng “vẫn còn”; “mãi” không cần thiết và dễ khiến câu diễn giải hơn.
  - severity: low
    issue: “tất cả chúng sẽ” hơi nặng trong tiếng Việt hiện đại.
    rationale: Sau “Chúng” ở mệnh đề đầu, “tất cả sẽ” đã giữ được lực bao quát của πάντες mà tự nhiên hơn.
  - severity: low
    issue: Cách diễn đạt trong chú thích “Đấng đang được thưa với” không tự nhiên.
    rationale: “Đấng được ngỏ lời” diễn đạt cùng ý rõ ràng và idiomatic hơn.
