- from: Ngài[a] là ánh rạng ngời của vinh quang Đức Chúa Trời và là dấu in chính xác của thực thể Ngài[b], nâng đỡ muôn vật bằng lời quyền năng của mình. Sau khi nhờ chính mình[c] thực hiện sự thanh tẩy tội lỗi, Ngài ngồi bên phải Đấng Uy Nghi trên chốn cao[d].
  to: Ngài[a] là sự chói sáng của vinh quang Đức Chúa Trời và là dấu in chính xác của thực thể Ngài[b], nâng đỡ muôn vật bằng lời quyền năng của Ngài. Sau khi nhờ chính mình[c] thực hiện sự thanh tẩy tội lỗi, Ngài ngồi bên phải Đấng Uy Nghi trên chốn cao[d].
  rationale: 'Chỉ thực hiện các chỉnh sửa phong cách an toàn: thay “ánh rạng ngời” bằng “sự chói sáng” để tiếng Việt tự nhiên hơn, và thay “của mình” bằng “của Ngài” để giữ nhất quán đại từ kính trọng. Không thay đổi nghĩa, phạm vi, trật tự hành động, hay cách xử lý dị bản của bản văn nguồn.'
