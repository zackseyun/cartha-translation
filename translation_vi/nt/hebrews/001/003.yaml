    rationale: Không sai nghĩa, vì “mình” quy chiếu về chủ ngữ là Người Con; tuy nhiên “lời quyền năng của Ngài” trang trọng, nhất quán và rõ ràng hơn trong bản dịch Kinh Thánh.
