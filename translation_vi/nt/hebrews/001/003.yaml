id: HEB.1.3
reference: Hebrews 1:3
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὃς ὢν ἀπαύγασμα τῆς δόξης καὶ χαρακτὴρ τῆς ὑποστάσεως αὐτοῦ, φέρων τε τὰ πάντα τῷ ῥήματι τῆς δυνάμεως, ⸂δι’ αὑτοῦ⸃ καθαρισμὸν ⸂τῶν ἁμαρτιῶν ποιησάμενος⸃ ἐκάθισεν ἐν δεξιᾷ τῆς μεγαλωσύνης ἐν ὑψηλοῖς,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/003.yaml
  text: He[a], being the radiance of his glory and the exact imprint of his being, and sustaining all things by the word of his power, after making purification for sins through himself[b], sat down at the right hand of the Majesty on high[c],
translation:
  language: vi
  text: Ngài[a] là sự chói sáng của vinh quang Đức Chúa Trời và là dấu in chính xác của thực thể Ngài[b], nâng đỡ muôn vật bằng lời quyền năng của Ngài. Sau khi nhờ chính mình[c] thực hiện sự thanh tẩy tội lỗi, Ngài ngồi bên phải Đấng Uy Nghi trên chốn cao[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ngài” chỉ Người Con được nói đến ở câu 2.
    reason: referent_clarification
  - marker: b
    text: 'Cũng có thể dịch: “hình dấu chính xác của bản thể/bản tính Ngài.”'
    reason: lexical_alternative
  - marker: c
    text: Một số thủ bản không có cụm “nhờ chính mình”; cụm này được giữ theo bản văn SBLGNT. Cũng có thể dịch là “bởi chính mình.”
    reason: textual_variant
  - marker: d
    text: Nguyên văn cũng có thể hiểu là “ở nơi cao.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπαύγασμα
  choice: ánh rạng ngời
  rationale: Diễn đạt tự nhiên hình ảnh ánh huy hoàng phát ra, tránh sắc thái chỉ phản chiếu thụ động.
- source_word: δόξα
  choice: vinh quang
  rationale: Cách dịch chuẩn, giữ đầy đủ sức nặng thần học về vẻ huy hoàng và uy nghi của Đức Chúa Trời.
- source_word: χαρακτήρ
  choice: dấu in chính xác
  rationale: Giữ hình ảnh cụ thể của dấu được đóng từ khuôn và nhấn mạnh sự tương ứng chính xác.
- source_word: ὑπόστασις
  choice: thực thể
  rationale: Chỉ thực tại nền tảng của Đức Chúa Trời mà không đồng nhất hoàn toàn với thuật ngữ tín điều phát triển về sau; các khả năng 'bản thể' và 'bản tính' được ghi chú.
- source_word: φέρων
  choice: nâng đỡ
  rationale: Diễn tả hành động liên tục duy trì và mang đỡ muôn vật.
- source_word: τὰ πάντα
  choice: muôn vật
  rationale: Tự nhiên, trang trọng và giữ phạm vi bao quát của nguyên ngữ.
- source_word: τῷ ῥήματι τῆς δυνάμεως
  choice: bằng lời quyền năng của mình
  rationale: Chuyển cấu trúc sở hữu Hy Lạp sang tiếng Việt tự nhiên, diễn đạt lời mang quyền năng thuộc về Ngài mà không thu hẹp thành 'mệnh lệnh'.
- source_word: δι’ αὑτοῦ
  choice: nhờ chính mình
  rationale: Giữ nghĩa phương tiện/trung gian của διά với đại từ phản thân theo bản văn SBLGNT.
- source_word: καθαρισμὸν τῶν ἁμαρτιῶν
  choice: sự thanh tẩy tội lỗi
  rationale: Giữ sắc thái nghi lễ và tế lễ của καθαρισμός, đồng thời dùng kết cấu tiếng Việt tự nhiên.
- source_word: ποιησάμενος
  choice: sau khi ... thực hiện
  rationale: Biểu thị hành động hoàn tất trước động từ chính 'ngồi'.
- source_word: ἐν δεξιᾷ
  choice: bên phải
  rationale: Thành ngữ tiếng Việt tự nhiên chỉ vị trí danh dự và quyền uy.
- source_word: ἐν ὑψηλοῖς
  choice: trên chốn cao
  rationale: Giữ hình ảnh không gian và sắc thái trang trọng; không tự ý xác định thành 'trên trời'.
theological_decisions:
- issue: Đại từ sở hữu αὐτοῦ trong 'vinh quang' và 'thực thể' có thể khó xác định nếu tách câu khỏi văn cảnh
  choice: Nêu rõ Đức Chúa Trời ở lần đầu, rồi dùng 'Ngài'
  alternative: Giữ cả hai lần là 'Ngài'
  rationale: Tiền văn Hê-bơ-rơ 1:1–2 xác định đối tượng là Đức Chúa Trời; cách diễn đạt này làm câu tiếng Việt rõ mà không thay đổi quan hệ giữa Con và Đức Chúa Trời.
- issue: Ý nghĩa của ὑπόστασις trong câu có ảnh hưởng lớn đến Kitô học về sau
  choice: thực thể
  alternative: bản thể; bản tính; hữu thể
  rationale: Giữ lực bản thể học của từ nhưng không ép câu vào một công thức tín điều hậu kỳ; các lựa chọn hợp lý khác được bảo tồn trong chú thích.
- issue: Sức nặng Kitô học của ἀπαύγασμα và χαρακτήρ
  choice: ánh rạng ngời; dấu in chính xác
  alternative: sự phản chiếu; hình ảnh đại diện
  rationale: Giữ ngôn ngữ mạnh và hình tượng của nguyên văn, không làm yếu thành sự đại diện đơn thuần cũng không diễn giải vượt quá câu.
- issue: Dị bản δι’ αὑτοῦ
  choice: Đưa 'nhờ chính mình' vào chính văn
  alternative: Lược bỏ cụm từ; dịch 'bởi chính mình'
  rationale: SBLGNT được cung cấp có δι’ αὑτοῦ; chú thích minh bạch về dị bản mà không che giấu dữ liệu văn bản.
- issue: Danh hiệu τῆς μεγαλωσύνης
  choice: Đấng Uy Nghi
  alternative: Đấng Tôn Nghiêm; sự uy nghi
  rationale: Giữ lối hoán dụ kính cẩn của nguyên văn, trong đó 'Uy Nghi' được dùng như danh hiệu chỉ Đức Chúa Trời.
translation_notes:
  register: 'Văn phong hiện đại, trang trọng và dễ đọc; dùng “Ngài” cho Người Con và Đức Chúa Trời theo ngữ cảnh, “Đấng Uy Nghi” như danh hiệu kính cẩn. Nhịp câu được chia thành hai câu để tránh cấu trúc phân từ Hy Lạp quá nặng trong tiếng Việt, nhưng vẫn giữ quan hệ thời gian: thanh tẩy tội lỗi rồi ngồi bên phải.'
