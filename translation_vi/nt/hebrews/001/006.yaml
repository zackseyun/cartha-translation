id: HEB.1.6
reference: Hebrews 1:6
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὅταν δὲ πάλιν εἰσαγάγῃ τὸν πρωτότοκον εἰς τὴν οἰκουμένην, λέγει· Καὶ προσκυνησάτωσαν αὐτῷ πάντες ἄγγελοι θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/006.yaml
  text: And when he again brings the Firstborn into the world[a], he says[b], “And let all God’s angels worship him.”
translation:
  language: vi
  text: 'Và khi Ngài lại đưa Con Đầu Lòng vào thế gian[a], Ngài phán: “Mọi thiên sứ của Đức Chúa Trời phải thờ lạy Con.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Và lại nữa, khi đưa Con Đầu Lòng vào thế gian, Ngài phán: ‘Mọi thiên sứ của Đức Chúa Trời phải thờ lạy Con.’” Trạng từ Hy Lạp được dịch là “lại” có thể bổ nghĩa cho “đưa” hoặc nối với “Ngài phán”.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὅταν
  choice: khi
  rationale: Dẫn vào một mệnh đề thời gian gắn với một sự kiện cụ thể; “khi” tự nhiên hơn “mỗi khi” trong ngữ cảnh này.
- source_word: δὲ
  choice: Và
  rationale: Liên từ chuyển ý nhẹ, tiếp nối lập luận mà không nhấn mạnh sự tương phản.
- source_word: πάλιν
  choice: lại
  rationale: Trong chính văn, từ này được hiểu là bổ nghĩa cho “đưa”; cách hiểu khác, theo đó nó liên kết với “Ngài phán”, được giữ trong chú thích vì cú pháp Hy Lạp thực sự có thể hiểu theo cả hai cách.
- source_word: εἰσαγάγῃ
  choice: đưa ... vào
  rationale: Diễn đạt tự nhiên hành động đưa một người vào một phạm vi; giữ được cấu trúc εἰς đi kèm.
- source_word: τὸν πρωτότοκον
  choice: Con Đầu Lòng
  rationale: Trong ngữ cảnh, đây là danh xưng chỉ Con; “Con Đầu Lòng” vừa tự nhiên trong tiếng Việt vừa giữ sắc thái về địa vị và quan hệ làm con của πρωτότοκος.
- source_word: εἰς τὴν οἰκουμένην
  choice: vào thế gian
  rationale: οἰκουμένη chỉ thế giới có người ở; “thế gian” là cách diễn đạt trang trọng, dễ hiểu và phù hợp phạm vi rộng ở đây.
- source_word: λέγει
  choice: Ngài phán
  rationale: Chủ thể ngầm trong chuỗi trích dẫn là Đức Chúa Trời. “Phán” phù hợp khi lời nói thuộc về Đức Chúa Trời, nhưng không thêm cụm giải thích như “trong Kinh Thánh”.
- source_word: προσκυνησάτωσαν
  choice: phải thờ lạy
  rationale: Mệnh lệnh ngôi thứ ba được diễn đạt tự nhiên bằng “phải”; “thờ lạy” phản ánh lực nghĩa của προσκυνέω trong ngữ cảnh các thiên sứ hướng sự tôn kính đến Con.
- source_word: αὐτῷ
  choice: Con
  rationale: Dùng “Con” thay đại từ “Ngài” để tránh mơ hồ với chủ thể đang phán, đồng thời không thêm một đối tượng mới vì tiền ngữ là “Con Đầu Lòng”.
- source_word: πάντες ἄγγελοι θεοῦ
  choice: mọi thiên sứ của Đức Chúa Trời
  rationale: Giữ trực tiếp cấu trúc sở hữu của tiếng Hy Lạp và diễn đạt đầy đủ ý toàn thể.
theological_decisions:
- issue: Phạm vi cú pháp của πάλιν
  choice: 'Hiểu πάλιν bổ nghĩa cho “đưa”: “khi Ngài lại đưa Con Đầu Lòng vào thế gian”'
  alternative: 'Hiểu πάλιν nối với “Ngài phán”: “Lại nữa, khi đưa Con Đầu Lòng vào thế gian, Ngài phán”'
  rationale: Cả hai cách phân tích đều có thể có theo cú pháp Hy Lạp. Chính văn theo cách đọc thuận với vị trí của πάλιν trước εἰσαγάγῃ, còn cách đọc kia được ghi chú để không xóa bỏ sự mơ hồ nguyên bản.
- issue: Sắc thái của προσκυνέω đối với Con
  choice: thờ lạy
  alternative: sấp mình trước; bày tỏ lòng tôn kính với
  rationale: Trong lập luận Hê-bơ-rơ 1 về địa vị vượt trội của Con và với tất cả thiên sứ là chủ thể của mệnh lệnh, “thờ lạy” truyền đạt phù hợp nhất lực nghĩa của động từ mà không giảm nhẹ thành sự kính trọng thông thường.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “Ngài phán” cho lời của Đức Chúa Trời và lặp “Con” ở cuối câu để tránh sự mơ hồ đại từ. Không cần chú thích riêng cho “mọi thiên sứ của Đức Chúa Trời”, vì đây là cách chuyển trực tiếp và tự nhiên của πάντες ἄγγελοι θεοῦ; ghi chú b trong lớp tham khảo tiếng Anh không tương ứng với một khác biệt nghĩa thực chất trong tiếng Việt.
