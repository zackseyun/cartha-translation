revisions:
- from: 'Nhưng về Con thì Ngài phán[a]: “Ngai của Ngài, lạy Đức Chúa Trời, còn đến đời đời[b]; vương trượng chính trực là vương trượng của vương quốc Ngài.”'
  to: 'Nhưng về Con thì Ngài phán[a]: “Ngai của Ngài, lạy Đức Chúa Trời[b], tồn tại đến đời đời; và vương trượng chính trực[c] là vương trượng của vương quốc Ngài.”'
  rationale: Bản sửa giữ cách dịch hô cách được ngữ cảnh và lời trích dẫn ủng hộ, đồng thời bảo tồn phương án cú pháp ít khả năng hơn trong chú thích. Bổ sung “và” để phản ánh καὶ của bài đọc SBLGNT, làm tự nhiên hóa cách diễn đạt về sự trường tồn của ngai, và tách các chú thích để mỗi chú thích được neo đúng vào đơn vị văn bản liên quan.
  reviewer_model: gpt-5.6-terra
