  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: πρὸς δὲ τὸν υἱόν· Ὁ θρόνος σου ὁ θεὸς εἰς τὸν αἰῶνα τοῦ αἰῶνος, ⸂καὶ ἡ ῥάβδος τῆς εὐθύτητος⸃ ῥάβδος τῆς βασιλείας ⸀σου.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/008.yaml
  text: But of the Son he says[a], “Your throne, O God, is forever and ever[b], and the scepter of uprightness is the scepter of your kingdom.”
translation:
  language: vi
  text: 'Nhưng về Con thì Ngài phán[a]: “Ngai của Ngài, lạy Đức Chúa Trời[b], tồn tại đến đời đời; và vương trượng chính trực[c] là vương trượng của vương quốc Ngài.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Nhưng với Con thì Ngài phán.” Nguyên văn không có động từ “phán”, nhưng động từ này được hàm ý từ chuỗi lời trích dẫn trong ngữ cảnh.'
    reason: implicit_verb_and_syntactic_alternative
  - marker: b
    text: 'Cú pháp Hy Lạp cũng có thể được hiểu, dù ít khả năng hơn: “Đức Chúa Trời là ngai của Ngài đến đời đời.”'
    reason: alternative_reading
  - marker: c
    text: Từ được dịch là “chính trực” cũng có thể dịch là “công chính” hoặc “ngay thẳng”.
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸς δὲ τὸν υἱόν
  choice: Nhưng về Con thì Ngài phán
  rationale: πρός với đối cách trong chuỗi lời trích dẫn có thể mang nghĩa hướng đến hoặc nói về một đối tượng. Cách dịch này diễn đạt tự nhiên sự tương phản với các thiên sứ, đồng thời bổ sung động từ nói vốn được hàm ý trong nguyên văn.
- source_word: υἱόν
  choice: Con
  rationale: Danh từ có mạo từ được dùng như tước hiệu xác định. Viết hoa “Con” giữ rõ danh xưng chỉ về Đức Chúa Con trong ngữ cảnh.
- source_word: Ὁ θρόνος σου ὁ θεὸς
  choice: Ngai của Ngài, lạy Đức Chúa Trời
  rationale: 'Đọc ὁ θεός với chức năng hô cách là phù hợp nhất với ngữ cảnh và sức nặng của lời trích dẫn: người Con được trực tiếp xưng là Đức Chúa Trời. Đại từ kính ngữ “Ngài” tạo văn phong trang trọng, tự nhiên trong tiếng Việt.'
- source_word: εἰς τὸν αἰῶνα τοῦ αἰῶνος
  choice: còn đến đời đời
  rationale: Đây là thành ngữ chỉ thời gian không cùng. “Còn đến đời đời” vừa tự nhiên vừa giữ sắc thái bền vững của ngai vua.
- source_word: ῥάβδος
  choice: vương trượng
  rationale: Trong bối cảnh vương quyền, ῥάβδος là cây trượng biểu trưng quyền cai trị; “vương trượng” chính xác hơn “gậy” hay “trượng” đơn thuần.
- source_word: τῆς εὐθύτητος
  choice: chính trực
  rationale: εὐθύτης chỉ sự ngay thẳng, chính trực. “Chính trực” giữ nghĩa từ vựng trực tiếp và phù hợp với phẩm chất của quyền cai trị.
- source_word: ῥάβδος τῆς βασιλείας σου
  choice: vương trượng của vương quốc Ngài
  rationale: Cách dịch này giữ hình ảnh vương quyền và cấu trúc lặp của nguyên văn; βασιλεία ở đây được hiểu là vương quốc, dù cũng có thể chỉ quyền trị vì.
theological_decisions:
- issue: ὁ θεός là lời trực tiếp gọi Con là Đức Chúa Trời hay là vị ngữ trong câu “Đức Chúa Trời là ngai của Ngài”.
  choice: 'Lời gọi trực tiếp: “Ngai của Ngài, lạy Đức Chúa Trời”.'
  alternative: “Đức Chúa Trời là ngai của Ngài đến đời đời.”
  rationale: Cách hiểu theo hô cách phù hợp hơn với mạch lập luận trong Hê-bơ-rơ 1, nơi các lời Kinh Thánh nêu địa vị độc nhất của Con, và với lực ngôn từ của câu trích dẫn. Tuy vậy, vì cú pháp Hy Lạp có thể được phân tích theo cách khác, phương án vị ngữ được giữ trong chú thích thay vì bị loại bỏ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Dùng “Ngài” cho đại từ hướng đến Con trong lời trích dẫn; giữ hình ảnh cung đình “ngai”, “vương trượng”, “vương quốc”. Hai điểm có tính tranh luận—chức năng cú pháp của ὁ θεός và nghĩa của εὐθύτης—được bảo tồn trong chú thích.
