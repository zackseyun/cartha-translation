  text: τοσούτῳ κρείττων γενόμενος τῶν ἀγγέλων ὅσῳ διαφορώτερον παρ’ αὐτοὺς κεκληρονόμηκεν ὄνομα.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/004.yaml
  text: having become as much superior to the angels as the name he has inherited is more excellent than theirs.
translation:
  language: vi
  text: Ngài đã trở nên vượt trội hơn các thiên sứ bao nhiêu, thì danh Ngài đã thừa hưởng cũng vượt trội hơn danh của họ bấy nhiêu.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “tốt hơn các thiên sứ ... danh Ngài đã thừa hưởng nổi bật hơn danh của họ.”'
    reason: lexical_alternative
  - marker: b
    text: Trong phần tiếp theo, “danh” này được làm sáng tỏ là tước hiệu Con và địa vị gắn với tư cách Con của Ngài.
    reason: cross_reference
lexical_decisions:
- source_word: τοσούτῳ ... ὅσῳ
  choice: bao nhiêu ... bấy nhiêu
  rationale: Cặp từ tương liên này diễn đạt sự so sánh theo mức độ, giữ được mối tương quan giữa địa vị vượt hơn của Con và danh Ngài thừa hưởng.
- source_word: κρείττων
  choice: cao trọng hơn
  rationale: Trong ngữ cảnh so sánh Con với các thiên sứ, cụm từ này diễn đạt địa vị và phẩm trật vượt trội, không gợi ý rằng Ngài tốt hơn về phương diện đạo đức.
- source_word: γενόμενος
  choice: đã trở nên
  rationale: Giữ trực tiếp ý nghĩa của phân từ bất định quá khứ và trạng thái đạt đến, đồng thời không thêm ý 'được tạo nên' vốn không có trong hình thức động từ Hy Lạp.
- source_word: τῶν ἀγγέλων
  choice: các thiên sứ
  rationale: Đây là cách gọi tự nhiên, trang trọng và quen thuộc trong tiếng Việt hiện đại đối với các sứ giả thiên giới.
- source_word: διαφορώτερον
  choice: cao quý hơn
  rationale: Từ so sánh này chỉ sự nổi bật và ưu việt hơn; 'cao quý hơn' phù hợp với 'danh' và giữ văn phong trang trọng.
- source_word: παρ’ αὐτούς
  choice: hơn danh của họ
  rationale: Tiếng Việt cần nói rõ điểm được so sánh; bổ sung 'danh của' theo ngữ cảnh để tránh cách hiểu rằng danh được so trực tiếp với chính các thiên sứ.
- source_word: κεκληρονόμηκεν
  choice: đã thừa hưởng
  rationale: Thể hoàn thành diễn tả một hành động đã xảy ra với kết quả còn hiệu lực; 'đã thừa hưởng' tự nhiên và không làm mất sắc thái sở hữu hiện tại.
- source_word: ὄνομα
  choice: danh
  rationale: '''Danh'' giữ được nghĩa đen đồng thời có thể bao hàm tước vị, địa vị và căn tính; ngữ cảnh tiếp theo sẽ làm sáng tỏ danh ấy.'
theological_decisions:
- issue: Hàm ý Kitô học của γενόμενος ('đã trở nên')
  choice: Dịch thẳng là 'đã trở nên', để câu nói về địa vị được tôn cao của Con trong tương quan với các thiên sứ.
  alternative: Dịch là 'đã được làm nên' hoặc diễn giải rằng Con bắt đầu hiện hữu hay về sau mới trở thành thần linh.
  rationale: Nguyên văn diễn tả sự chuyển sang một địa vị hay trạng thái, nhưng không nói Con được tạo dựng. Bản dịch giữ nguyên sức căng của cách nói mà không áp đặt một kết luận bản thể học lên câu.
- issue: Ý nghĩa của 'danh'
  choice: Giữ từ 'danh', để các câu tiếp theo xác định danh ấy gắn với địa vị làm Con.
  alternative: Dịch giải ngay thành 'tước hiệu Con' hoặc chỉ hiểu chung là danh dự và phẩm trật.
  rationale: Câu này chỉ nói ὄνομα; việc giữ 'danh' bảo toàn tiến trình lập luận và không giải thích trước điều phần tiếp theo sẽ làm rõ.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “Ngài” cho chủ thể là Con và “thiên sứ” cho ἄγγελοι. Cấu trúc “bao nhiêu ... bấy nhiêu” bảo toàn phép so sánh tương liên của nguyên văn.
