id: HEB.1.9
reference: Hebrews 1:9
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἠγάπησας δικαιοσύνην καὶ ἐμίσησας ἀνομίαν· διὰ τοῦτο ἔχρισέν σε ὁ θεός, ὁ θεός σου, ἔλαιον ἀγαλλιάσεως παρὰ τοὺς μετόχους σου·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/009.yaml
  text: You have loved righteousness and hated lawlessness; therefore God[a], your God, has anointed you with the oil of gladness beyond your companions.
translation:
  language: vi
  text: Ngài đã yêu sự công chính[a] và ghét sự bất pháp; vì thế, Đức Chúa Trời, Đức Chúa Trời của Ngài, đã xức cho Ngài bằng dầu vui mừng hơn các bạn đồng hành của Ngài.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “công lý”. Từ Hy Lạp có thể chỉ sự công chính hoặc công lý; bản văn chính dùng “sự công chính” theo nghĩa đạo đức nổi bật trong ngữ cảnh.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠγάπησας
  choice: đã yêu
  rationale: Thì aorist chỉ một hành động được nhìn như trọn vẹn; tiếng Việt tự nhiên dùng “đã yêu”, đồng thời giữ thế song song với “đã ghét”.
- source_word: δικαιοσύνην
  choice: sự công chính
  rationale: Giữ nghĩa về phẩm chất ngay thẳng, phù hợp với sự tương phản đạo đức trong câu; “công lý” là một sắc thái khả dĩ và được ghi ở chú thích.
- source_word: ἐμίσησας
  choice: đã ghét
  rationale: Giữ nguyên sức mạnh của động từ và sự đối lập trực tiếp với “đã yêu”.
- source_word: ἀνομίαν
  choice: sự vô luật pháp
  rationale: Phản ánh trực tiếp ý niệm không tuân theo hoặc chống lại luật pháp, thay vì làm rộng nghĩa thành “gian ác”.
- source_word: διὰ τοῦτο
  choice: vì thế
  rationale: Diễn đạt gọn và tự nhiên mối liên hệ nguyên nhân–kết quả trong nguyên văn.
- source_word: ἔχρισέν σε
  choice: đã xức cho Ngài
  rationale: Giữ hình ảnh xức dầu mang tính vương quyền và Đấng Mê-si; “đã” thể hiện hành động trọn vẹn.
- source_word: ὁ θεός, ὁ θεός σου
  choice: Đức Chúa Trời, Đức Chúa Trời của Ngài
  rationale: Giữ nguyên sự lặp lại và quan hệ được nêu trong tiếng Hy Lạp, không thêm lời giải thích thần học.
- source_word: ἔλαιον ἀγαλλιάσεως
  choice: dầu vui mừng
  rationale: Giữ thành ngữ Kinh Thánh cùng hình ảnh lễ nghi và niềm hân hoan, bằng cách diễn đạt dễ hiểu trong tiếng Việt.
- source_word: παρὰ τοὺς μετόχους σου
  choice: hơn các bạn đồng hành của Ngài
  rationale: παρά với đối cách mang nghĩa so sánh; “bạn đồng hành” giữ được sắc thái quan hệ của μέτοχος mà không mang nghĩa thương mại.
theological_decisions:
- issue: Nghĩa của δικαιοσύνη trong lời trích dẫn có trọng lượng thần học
  choice: sự công chính
  alternative: công lý
  rationale: “Sự công chính” làm nổi bật phẩm chất đạo đức trong sự tương phản với ἀνομία, còn nghĩa “công lý” vẫn được bảo lưu trong chú thích để không xóa bỏ phạm vi nghĩa của từ Hy Lạp.
- issue: Ý nghĩa Cơ Đốc học của cụm ὁ θεός, ὁ θεός σου khi nói về Con
  choice: Giữ nguyên “Đức Chúa Trời, Đức Chúa Trời của Ngài”
  alternative: Diễn giải thêm để làm rõ quan hệ giữa Cha và Con
  rationale: Nguyên văn vừa đặt Con trong bối cảnh tôn cao vừa nói đến “Đức Chúa Trời của Ngài”. Bản dịch giữ nguyên sức căng thần học này, không làm nhẹ đi cũng không chèn thêm cách giải thích giáo lý.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại, giữ nhịp biền ngẫu “đã yêu… và đã ghét…”. Đại từ “Ngài” được dùng cho đối tượng được xức dầu; cụm lặp “Đức Chúa Trời, Đức Chúa Trời của Ngài” được bảo tồn để phản ánh sát cấu trúc và sức căng của nguyên văn.
