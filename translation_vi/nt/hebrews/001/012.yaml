  terminology: “Áo choàng,” “áo,” “năm tháng,” và đại từ kính trọng “Ngài” đều phù hợp. “Vẫn y nguyên” bảo toàn đối lập giữa tạo vật bị biến đổi và sự hằng hữu, không áp đặt thuật ngữ thần học kỹ thuật.
  issues:
