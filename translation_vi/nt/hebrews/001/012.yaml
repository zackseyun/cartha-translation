id: HEB.1.12
reference: Hebrews 1:12
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ὡσεὶ περιβόλαιον ἑλίξεις αὐτούς, ⸂ὡς ἱμάτιον⸃ καὶ ἀλλαγήσονται· σὺ δὲ ὁ αὐτὸς εἶ, καὶ τὰ ἔτη σου οὐκ ἐκλείψουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/012.yaml
  text: and like a cloak you will roll them up[a]; like a garment they will be changed. But you are the same[b], and your years will not fail.
translation:
  language: vi
  text: Ngài sẽ cuộn chúng lại như một chiếc áo choàng[a]; như một chiếc áo, chúng sẽ được thay đổi. Nhưng Ngài vẫn y nguyên, và năm tháng của Ngài sẽ không chấm dứt.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “gấp chúng lại”.'
    reason: lexical_alternative
  - marker: b
    text: 'Hay: “năm tháng của Ngài sẽ không bao giờ chấm dứt” hoặc “năm tháng của Ngài sẽ không ngừng”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡσεὶ περιβόλαιον
  choice: như một chiếc áo choàng
  rationale: Giữ phép so sánh và hình ảnh một loại áo khoác ngoài dùng để choàng quanh người; cách nói tự nhiên, trang trọng trong tiếng Việt hiện đại.
- source_word: ἑλίξεις
  choice: Ngài sẽ cuộn ... lại
  rationale: Động từ có thể chỉ việc cuộn hoặc gấp. “Cuộn ... lại” diễn đạt rõ hình ảnh các tầng trời bị thu lại như áo choàng, đồng thời giữ thì tương lai và thể chủ động.
- source_word: αὐτούς
  choice: chúng
  rationale: Đại từ số nhiều quy chiếu về các tầng trời trong văn cảnh trước; “chúng” là cách quy chiếu tự nhiên trong tiếng Việt.
- source_word: ὡς ἱμάτιον
  choice: như một chiếc áo
  rationale: Giữ nguyên phép so sánh thứ hai và danh từ số ít, đồng thời phân biệt từ này với “áo choàng” ở vế trước.
- source_word: ἀλλαγήσονται
  choice: chúng cũng sẽ được thay đổi
  rationale: Giữ ý tương lai và thể bị động của động từ Hy Lạp. “Cũng” chuyển tải liên từ καί một cách tự nhiên trong cấu trúc song song.
- source_word: σὺ δὲ ὁ αὐτὸς εἶ
  choice: Nhưng Ngài vẫn là Ngài
  rationale: Diễn đạt trực tiếp sự tương phản giữa tạo vật đổi thay và căn tính bền vững của Đấng được nói đến, mà không thay biểu thức Hy Lạp bằng một thuật ngữ thần học kỹ thuật.
- source_word: τὰ ἔτη σου
  choice: năm tháng của Ngài
  rationale: “Năm tháng” tự nhiên hơn lối dịch máy móc “các năm”, nhưng vẫn giữ ẩn dụ thời gian chỉ sự tồn tại lâu bền.
- source_word: οὐκ ἐκλείψουσιν
  choice: sẽ không chấm dứt
  rationale: ἐκλείπω ở đây mang nghĩa hết, ngừng hoặc đi đến tận cùng. “Không chấm dứt” truyền đạt rõ sự tiếp diễn vô tận mà không gợi ý sai về sự thiếu hụt.
theological_decisions:
- issue: Ngôn ngữ về sự bất biến của Đấng được nói đến trong trích dẫn có tính Kitô học
  choice: Nhưng Ngài vẫn là Ngài
  alternative: Nhưng Ngài vẫn không thay đổi
  rationale: Bản dịch chính bám sát thành ngữ Hy Lạp ὁ αὐτός, nhấn mạnh Đấng ấy vẫn là chính Ngài giữa khi tạo vật đổi thay. Cách này bảo tồn hàm ý về sự bất biến nhưng không diễn giải thành một mệnh đề thần học kỹ thuật vượt quá lời văn.
translation_notes:
  register: Văn phong thơ trang trọng nhưng hiện đại. Đại từ “Ngài” phù hợp khi nói trực tiếp với Đấng được tôn kính. Nhịp hai vế giữ sự tương phản giữa tạo vật có thể bị cuộn lại, thay đổi và Đấng vẫn bền vững đời đời.
