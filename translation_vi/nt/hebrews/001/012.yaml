  verdict: revise
  source_fidelity: 'Bản nháp giữ đúng cấu trúc chính: Đấng được ngỏ lời sẽ cuộn các tạo vật ấy lại như áo choàng; chúng sẽ được thay đổi như áo; trái lại, Ngài không đổi và năm tháng Ngài không chấm dứt. Tuy nhiên, “Ngài vẫn là Ngài” là lối diễn đạt tự quy chiếu, không chuyển đạt rõ thành ngữ ὁ αὐτός (“vẫn y nguyên/cùng một Đấng”) và có thể gây mơ hồ. “Cũng” trong vế thứ hai không cần thiết cho καί và làm câu kém gọn.'
