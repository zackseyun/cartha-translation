source:
  edition: SBLGNT
  text: ἐπ’ ἐσχάτου τῶν ἡμερῶν τούτων ἐλάλησεν ἡμῖν ἐν υἱῷ, ὃν ἔθηκεν κληρονόμον πάντων, δι’ οὗ καὶ ⸂ἐποίησεν τοὺς αἰῶνας⸃·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/002.yaml
  text: in these last days he has spoken to us in a Son[a], whom he appointed heir of all things[b], through whom he also made the ages.
translation:
  language: vi
  text: trong những ngày cuối cùng này, Ngài đã phán với chúng ta trong Con[a], là Đấng Ngài đã lập làm người thừa kế muôn vật, và qua Đấng ấy Ngài cũng đã dựng nên các thời đại[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “qua một Người Con.” Tiếng Hy Lạp dịch sát là “trong một người con,” không có mạo từ trước từ “con,” nhấn mạnh cách thức và tính chất đỉnh cao của lời Đức Chúa Trời phán.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “dựng nên vũ trụ” hoặc “dựng nên các thế giới.” Từ Hy Lạp dịch sát là “các thời đại,” có thể chỉ chính các thời đại và, theo nghĩa mở rộng, toàn bộ trật tự thọ tạo.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπ’ ἐσχάτου τῶν ἡμερῶν τούτων
  choice: trong những ngày cuối cùng này
  rationale: Cách diễn đạt tự nhiên trong tiếng Việt, giữ sắc thái thời kỳ chung cuộc của cụm Hy Lạp.
- source_word: ἐλάλησεν ἡμῖν
  choice: Ngài đã phán với chúng ta
  rationale: “Đã phán” diễn tả hành động trong quá khứ và phù hợp với lời phán của Đức Chúa Trời; “với chúng ta” giữ đối tượng tiếp nhận của ἡμῖν.
- source_word: ἐν υἱῷ
  choice: nơi một Người Con
  rationale: “Nơi” giữ được sắc thái của ἐν thay vì thu hẹp thành phương tiện đơn thuần; “một Người Con” phản ánh danh từ không có mạo từ và làm rõ đây là một ngôi vị, dù cách nói này có chủ ý khác với lối quen thuộc “qua Con”.
- source_word: ὃν ἔθηκεν κληρονόμον πάντων
  choice: là Đấng Ngài đã lập làm người thừa kế muôn vật
  rationale: τίθημι trong cấu trúc này mang nghĩa bổ nhiệm hoặc đặt vào địa vị; “muôn vật” diễn đạt tự nhiên phạm vi bao quát của πάντων.
- source_word: δι’ οὗ
  choice: qua Đấng ấy
  rationale: διά với sở hữu cách chỉ trung gian tác động; đại từ tôn xưng giúp câu tiếng Việt rõ ràng và trang trọng.
- source_word: ἐποίησεν τοὺς αἰῶνας
  choice: dựng nên các thời đại
  rationale: “Dựng nên” giữ nghĩa rộng của ποιέω trong văn cảnh sáng tạo; “các thời đại” bảo tồn nghĩa trực tiếp và chiều kích thời gian-vũ trụ của αἰῶνας.
theological_decisions:
- issue: Sức nặng Kitô học của ἐν υἱῷ
  choice: “nơi một Người Con,” giữ giới từ ἐν và tình trạng không có mạo từ
  alternative: “qua một Người Con,” “qua Con Ngài,” hoặc “nơi Người Con”
  rationale: Bản dịch không tự động thêm đại từ sở hữu hay mạo từ xác định, đồng thời vẫn cho thấy lời mặc khải cao điểm của Đức Chúa Trời được ban nơi Người Con. Chú thích nêu cách dịch tự nhiên hơn theo nghĩa phương tiện.
- issue: Phạm vi của τοὺς αἰῶνας
  choice: “các thời đại” trong chính văn
  alternative: “vũ trụ,” “các thế giới,” hoặc “thế gian”
  rationale: αἰῶνας có thể chỉ các thời đại và, theo nghĩa mở rộng, toàn bộ trật tự thọ tạo. Giữ nghĩa trực tiếp trong chính văn giúp bảo tồn độ rộng thời gian-vũ trụ, còn chú thích trình bày cách hiểu phổ biến về vũ trụ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” cho Đức Chúa Trời theo ngữ cảnh nối tiếp câu 1; “Đấng ấy” tránh nhập nhằng về tiền ngữ. “Nơi một Người Con” có độ lạ có chủ ý nhằm bảo tồn cấu trúc Hy Lạp, với chú thích hỗ trợ độc giả.
