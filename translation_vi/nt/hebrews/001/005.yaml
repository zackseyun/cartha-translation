id: HEB.1.5
reference: Hebrews 1:5
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Τίνι γὰρ εἶπέν ποτε τῶν ἀγγέλων· Υἱός μου εἶ σύ, ἐγὼ σήμερον γεγέννηκά σε, καὶ πάλιν· Ἐγὼ ἔσομαι αὐτῷ εἰς πατέρα, καὶ αὐτὸς ἔσται μοι εἰς υἱόν;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/005.yaml
  text: For to which of the angels did he ever say[a], “You are my Son; today I have begotten you”? And again, “I will be to him a father[c][b], and he will be to me a son”?
translation:
  language: vi
  text: 'Vì Đức Chúa Trời đã từng phán với thiên sứ nào rằng:


    “Con là Con của Ta;

    ngày nay Ta đã sinh ra Con”[a]?


    Và Ngài lại phán:


    “Ta sẽ là Cha của người,

    và người sẽ là con của Ta”[b]?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Lời này trích Thi Thiên 2:7. Cụm từ “Ta đã sinh ra Con” đã được hiểu liên quan đến việc lập vua, sự phục sinh hoặc mối quan hệ đời đời của Người Con với Đức Chúa Cha; bản dịch giữ nguyên cách nói mà không quyết định giữa các cách hiểu ấy.
    reason: cross_reference
  - marker: b
    text: 'Lời này trích 2 Sa-mu-ên 7:14. Cách diễn đạt sát cấu trúc hơn: “Ta sẽ là Cha đối với người, và người sẽ là con đối với Ta.”'
    reason: alternative_reading
lexical_decisions:
- source_word: Τίνι γὰρ εἶπέν ποτε τῶν ἀγγέλων
  choice: Vì Đức Chúa Trời đã từng phán với thiên sứ nào
  rationale: Câu hỏi tu từ giữ quan hệ giải thích của γάρ và lực của ποτέ. Chủ ngữ hàm ẩn được làm rõ là Đức Chúa Trời theo ngữ cảnh, còn τῶν ἀγγέλων được diễn đạt tự nhiên bằng “thiên sứ nào”.
- source_word: Υἱός μου εἶ σύ
  choice: Con là Con của Ta
  rationale: Giữ lời xưng hô trực tiếp và tước hiệu Con trong ngữ cảnh Kitô học; việc lặp “Con” là tự nhiên trong tiếng Việt và phản ánh phân biệt giữa đại từ xưng hô với danh xưng.
- source_word: σήμερον γεγέννηκά σε
  choice: ngày nay Ta đã sinh ra Con
  rationale: “Ngày nay” giữ sắc thái trang trọng của trích dẫn; “đã sinh ra” chuyển tải γεννάω mà không ấn định câu này nói về đăng quang, phục sinh hay mối quan hệ đời đời.
- source_word: καὶ πάλιν
  choice: Và Ngài lại phán
  rationale: Diễn đạt rõ công thức dẫn vào một trích dẫn Kinh Thánh khác; bổ sung “Ngài phán” từ động từ chi phối để câu tiếng Việt sáng nghĩa.
- source_word: Ἐγὼ ἔσομαι αὐτῷ εἰς πατέρα
  choice: Ta sẽ làm Cha người
  rationale: Chuyển cấu trúc εἰς + đối cách sang cách nói trang trọng, cân đối trong tiếng Việt, gần nghĩa “Ta sẽ là Cha đối với người” nhưng tự nhiên hơn.
- source_word: καὶ αὐτὸς ἔσται μοι εἰς υἱόν
  choice: và người sẽ làm con Ta
  rationale: Giữ phép song hành với vế trước và công thức giao ước của trích dẫn; “con” viết thường để không áp đặt một phân biệt chữ hoa vốn không được mã hóa trong bản Hy Lạp.
theological_decisions:
- issue: Ý nghĩa của “ngày nay Ta đã sinh ra Con”
  choice: Giữ nguyên hình ảnh sinh ra và không giải nghĩa ngay trong câu
  alternative: Diễn giải là việc lập làm vua, sự phục sinh hoặc sự sinh ra đời đời
  rationale: Lời trích Thi Thiên 2:7 có thể được bàn luận theo nhiều chiều thần học. Bản dịch giữ độ mở của văn bản thay vì quyết định thay cho người đọc.
- issue: Ngôn ngữ về Cha và con trong trích dẫn thứ hai
  choice: Giữ “Cha” viết hoa và “con” viết thường
  alternative: Viết hoa cả “Con” để nêu rõ sự áp dụng cho Đấng Christ
  rationale: Toàn bộ câu được tác giả Hê-bơ-rơ áp dụng cho Người Con, nhưng lời trích 2 Sa-mu-ên 7:14 vốn là công thức giao ước. Cách trình bày này bảo toàn lực Kitô học của ngữ cảnh mà không xóa nền tảng văn chương của trích dẫn.
translation_notes:
  register: Văn phong hiện đại nhưng trang trọng, phù hợp lời lập luận và các câu trích Kinh Thánh. Dùng “Đức Chúa Trời” để làm rõ chủ ngữ hàm ẩn, “Ngài” trong lời dẫn, và cặp “Ta/Con, người” trong các lời phán. Các dấu [a], [b] đều xuất hiện trong chính văn.
