  text: καί· Σὺ κατ’ ἀρχάς, κύριε, τὴν γῆν ἐθεμελίωσας, καὶ ἔργα τῶν χειρῶν σού εἰσιν οἱ οὐρανοί·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/010.yaml
  text: And[a], “You, Lord, in the beginning laid the foundation of the earth, and the heavens are the works of your hands.”
translation:
  language: vi
  text: 'Và: “Lạy Chúa, lúc ban đầu[a], chính Ngài đã đặt nền cho trái đất, và các tầng trời là những công trình do tay Ngài làm nên.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “từ ban đầu.”'
    reason: Phương án diễn đạt khác cho cụm κατ’ ἀρχάς; “lúc ban đầu” được chọn vì nhấn mạnh thời điểm khởi đầu trong bối cảnh sáng tạo.
lexical_decisions:
- source_word: καί
  choice: Và
  rationale: Mở đầu một trích dẫn bổ sung trong chuỗi trích dẫn; giữ nguyên lực nối đơn giản của tiếng Hy Lạp.
- source_word: Σὺ
  choice: chính Ngài
  rationale: Đại từ được nêu rõ mang sắc thái nhấn mạnh; “chính Ngài” diễn đạt sự nhấn mạnh ấy tự nhiên trong tiếng Việt.
- source_word: κατ’ ἀρχάς
  choice: từ ban đầu
  rationale: Diễn tả thời điểm khởi nguyên trong bối cảnh sáng tạo, đồng thời giữ được khả năng hiểu là ngay từ lúc ban đầu.
- source_word: κύριε
  choice: Lạy Chúa
  rationale: Dạng hô cách của κύριος; “Lạy Chúa” là cách xưng hô trực tiếp trang trọng và tự nhiên.
- source_word: τὴν γῆν
  choice: trái đất
  rationale: Trong cặp tương ứng với “các tầng trời” và trong bối cảnh sáng tạo, γῆ chỉ trái đất chứ không phải một vùng đất riêng biệt.
- source_word: ἐθεμελίωσας
  choice: đã đặt nền
  rationale: Giữ hình ảnh kiến trúc cụ thể của động từ θεμελιόω.
- source_word: ἔργα τῶν χειρῶν σού
  choice: công việc của tay Ngài
  rationale: Bảo tồn hình ảnh nhân hình và cấu trúc của lời trích dẫn, thay vì diễn giải thành “do Ngài làm nên”.
- source_word: οἱ οὐρανοί
  choice: các tầng trời
  rationale: Phản ánh dạng số nhiều của οὐρανοί và phù hợp với ngôn ngữ sáng tạo trang trọng trong tiếng Việt.
theological_decisions:
- issue: Lời Thi Thiên nói trực tiếp với Chúa được Hê-bơ-rơ 1 áp dụng cho Con
  choice: Giữ nguyên lời xưng hô trực tiếp “Lạy Chúa” và đại từ nhấn mạnh “chính Ngài”.
  alternative: Làm yếu sắc thái trực tiếp hoặc dịch trung tính để giảm hàm ý Cơ Đốc học.
  rationale: Bản Hy Lạp minh nhiên có κύριε ở hô cách và Σὺ mang tính nhấn mạnh. Bản dịch cần giữ cách tác giả áp dụng lời này cho Con mà không thêm lời giải thích giáo lý ngoài văn bản.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu; dùng “Ngài” trong lời thưa trực tiếp với Chúa. Giữ hình ảnh “đặt nền” và “tay Ngài” của nguyên văn, cùng số nhiều “các tầng trời”.
