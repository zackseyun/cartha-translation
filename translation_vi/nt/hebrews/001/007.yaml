source:
  edition: SBLGNT
  text: καὶ πρὸς μὲν τοὺς ἀγγέλους λέγει· Ὁ ποιῶν τοὺς ἀγγέλους αὐτοῦ πνεύματα, καὶ τοὺς λειτουργοὺς αὐτοῦ πυρὸς φλόγα·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/007.yaml
  text: And about the angels he says[a], “He makes his angels winds, and his ministers a flame of fire.”
translation:
  language: vi
  text: 'Còn về các thiên sứ, Ngài phán: “Ngài làm cho các thiên sứ của Ngài thành những luồng gió[a], và các người phục dịch của Ngài thành một ngọn lửa.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “các thần linh”; từ Hy Lạp này có thể mang nghĩa “gió” hoặc “thần linh”.
    reason: alternative_reading
lexical_decisions:
- source_word: πρὸς μὲν τοὺς ἀγγέλους
  choice: Còn về các thiên sứ
  rationale: Dịch πρός theo nghĩa chủ đề là “về”; câu trích dẫn nói về các thiên sứ chứ không trực tiếp nói với họ. “Còn” giúp thể hiện thế đối chiếu μὲν với phần nói về Người Con ở câu kế tiếp.
- source_word: λέγει
  choice: Ngài phán
  rationale: Giữ thì hiện tại của công thức dẫn Kinh Thánh; “phán” phù hợp với chủ thể là Đức Chúa Trời và văn phong trang trọng.
- source_word: Ὁ ποιῶν
  choice: Ngài làm cho ... thành
  rationale: Diễn đạt tự nhiên cấu trúc phân từ có mạo từ và giữ nghĩa tác động, biến đổi của ποιῶν trong câu thơ.
- source_word: ἀγγέλους
  choice: các thiên sứ
  rationale: Ngữ cảnh Hê-bơ-rơ 1 đối chiếu các hữu thể trên trời với Người Con, nên “thiên sứ” chính xác hơn nghĩa rộng “sứ giả”.
- source_word: πνεύματα
  choice: những luồng gió
  rationale: πνεύματα có thể là “gió” hoặc “các linh”. “Những luồng gió” phù hợp hơn với nền tảng Thi Thiên 104:4 và hình ảnh song song “một ngọn lửa”; nghĩa thay thế được giữ trong chú thích.
- source_word: λειτουργοὺς
  choice: các tôi tớ phục vụ Ngài
  rationale: λειτουργός chỉ người thi hành sự phục vụ, có thể mang sắc thái chính thức hoặc thánh vụ. Cách dịch này tự nhiên trong tiếng Việt, không khiến người đọc hiểu thành một chức vụ giáo hội về sau.
- source_word: πυρὸς φλόγα
  choice: một ngọn lửa
  rationale: Giữ số ít và hình ảnh thi ca của cụm Hy Lạp; trong tiếng Việt, “ngọn lửa” đã bao hàm ý lửa nên tự nhiên hơn cách lặp “ngọn lửa của lửa”.
- source_word: αὐτοῦ
  choice: của mình / Ngài
  rationale: Đại từ sở hữu quy chiếu về Đức Chúa Trời; dùng “của mình” ở vế đầu và “Ngài” ở vế sau để câu tiếng Việt rõ nghĩa, tự nhiên.
theological_decisions:
- issue: Nghĩa của πνεύματα trong câu trích Thi Thiên 104:4
  choice: những luồng gió
  alternative: các linh
  rationale: Từ Hy Lạp có cả hai nghĩa. “Gió” hợp với hậu cảnh Hê-bơ-rơ và hình ảnh thiên nhiên song song “một ngọn lửa”, nhưng chú thích bảo lưu nghĩa “các linh” để không xóa bỏ sự mơ hồ có thật.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “Ngài phán” cho lời Đức Chúa Trời; giữ nhịp thơ và thế đối chiếu của văn mạch, đồng thời tránh thuật ngữ chức sắc giáo hội.
