  source_fidelity: Bản dịch phản ánh đúng cấu trúc chủ đề của πρὸς μὲν τοὺς ἀγγέλους, thì hiện tại của công thức trích dẫn, và đối chiếu thi ca giữa gió với ngọn lửa. Tuy nhiên, “các tôi tớ phục vụ Ngài” diễn giải λειτουργούς hơi vòng và làm mờ tính sở thuộc trực tiếp của αὐτοῦ.
  naturalness: Câu nhìn chung tự nhiên, trang trọng. “Các người phục dịch của Ngài” gọn, hiện đại và phù hợp hơn “các tôi tớ phục vụ Ngài”. Chú thích “các linh” không phải là cách gọi tự nhiên trong tiếng Việt hiện đại; “các thần linh” truyền đạt rõ nghĩa thay thế ‘spirits’ hơn.
