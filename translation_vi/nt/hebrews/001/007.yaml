  - severity: low
    issue: Từ ngữ trong chú thích thay thế
    rationale: “Các linh” không tự nhiên trong tiếng Việt hiện đại. “Các thần linh” là cách diễn đạt rõ và thông dụng hơn cho nghĩa thay thế ‘spirits’, trong khi chú thích vẫn nêu đúng sự đa nghĩa của πνεύματα.
