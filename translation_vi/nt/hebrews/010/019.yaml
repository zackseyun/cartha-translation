source:
  edition: SBLGNT
  text: Ἔχοντες οὖν, ἀδελφοί, παρρησίαν εἰς τὴν εἴσοδον τῶν ἁγίων ἐν τῷ αἵματι Ἰησοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/019.yaml
  text: Therefore, brothers, since we have boldness to enter the holy places by the blood of Jesus,
translation:
  language: vi
  text: Vậy nên, thưa anh em[a], vì chúng ta có sự mạnh dạn để vào nơi thánh nhờ huyết của Chúa Giê-su[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “anh chị em”; từ Hy Lạp viết là “anh em” và có thể dùng để xưng gọi toàn thể hội chúng, gồm cả nam lẫn nữ.
    reason: lexical_alternative
  - marker: b
    text: Hay “các nơi thánh” hoặc “thánh điện”; trong hình ảnh đền tạm của thư Hê-bơ-rơ, cụm từ này chỉ nơi thánh thuộc sự hiện diện của Đức Chúa Trời.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔχοντες οὖν
  choice: Vậy ... vì ... chúng ta được
  rationale: οὖν nối câu này với lập luận trước bằng một kết luận; phân từ ἔχοντες nêu cơ sở cho lời khuyên theo sau. Cách diễn đạt này tự nhiên trong tiếng Việt và giữ được lực suy luận của nguyên văn.
- source_word: ἀδελφοί
  choice: thưa anh em
  rationale: Giữ hình thức xưng hô số nhiều giống đực của tiếng Hy Lạp; trong ngữ cảnh, từ này có thể đại diện cho toàn thể hội chúng, điều được làm rõ trong chú thích.
- source_word: παρρησίαν
  choice: được mạnh dạn
  rationale: Diễn tả sự tự do và lòng tin vững vàng để đến gần Đức Chúa Trời. Từ “mạnh dạn” giữ sắc thái mạnh của nguyên ngữ, còn “được” làm rõ rằng người tin có đặc quyền này.
- source_word: εἰς τὴν εἴσοδον
  choice: bước vào
  rationale: Chuyển danh từ “lối vào/sự đi vào” thành động từ tự nhiên trong tiếng Việt mà vẫn giữ ý về quyền tiếp cận.
- source_word: τῶν ἁγίων
  choice: nơi thánh
  rationale: Trong hình ảnh đền tạm xuyên suốt thư Hê-bơ-rơ, cụm từ chỉ nơi thánh thuộc sự hiện diện của Đức Chúa Trời. “Nơi thánh” không thu hẹp quá mức thành riêng “Nơi Chí Thánh” và cũng không hiểu thành “các thánh đồ”.
- source_word: ἐν τῷ αἵματι Ἰησοῦ
  choice: nhờ huyết của Đức Chúa Jêsus
  rationale: ἐν ở đây biểu thị phương tiện hoặc nền tảng của việc bước vào. “Nhờ” tự nhiên trong tiếng Việt và giữ nguyên sức nặng tế lễ của “huyết”.
theological_decisions:
- issue: Phạm vi nghĩa của τῶν ἁγίων
  choice: nơi thánh, tức phạm vi thánh thuộc sự hiện diện của Đức Chúa Trời
  alternative: Nơi Chí Thánh; nơi thánh; các thánh đồ
  rationale: Ngữ cảnh về đền tạm và tế lễ cho thấy đây là một địa điểm thiêng liêng chứ không phải những người thánh. Không dùng “Nơi Chí Thánh” trong chính văn để tránh xác định phạm vi hẹp hơn cách nói số nhiều của Hy Lạp.
- issue: Phạm vi đại diện của ἀδελφοί
  choice: giữ “anh em” trong chính văn và giải thích trong chú thích
  alternative: anh chị em; các anh chị em trong Chúa
  rationale: “Anh em” phản ánh hình thức giống đực số nhiều của nguyên văn, đồng thời chú thích bảo tồn khả năng từ này xưng gọi toàn thể hội chúng, gồm cả nam và nữ.
- issue: Quan hệ của huyết Đức Chúa Jêsus với việc bước vào
  choice: 'phương tiện hoặc nền tảng: “nhờ huyết”'
  alternative: trong huyết; qua huyết
  rationale: Cách dịch này không quyết định cứng nhắc giữa sắc thái phương tiện và nền tảng, nhưng diễn đạt rõ rằng quyền bước vào tùy thuộc vào sự hy sinh của Đức Chúa Jêsus.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “thưa anh em” như lời xưng gọi tự nhiên; “huyết” giữ sắc thái Kinh Thánh và tế lễ, còn “bước vào” diễn đạt εἰς τὴν εἴσοδον bằng tiếng Việt lưu loát. Dấu phẩy cuối câu được giữ vì Hê-bơ-rơ 10:19 tiếp tục sang mệnh đề sau.
