source:
  edition: SBLGNT
  text: Αὕτη ἡ διαθήκη ἣν διαθήσομαι πρὸς αὐτοὺς μετὰ τὰς ἡμέρας ἐκείνας, λέγει κύριος, διδοὺς νόμους μου ἐπὶ καρδίας αὐτῶν, καὶ ἐπὶ ⸂τὴν διάνοιαν⸃ αὐτῶν ἐπιγράψω αὐτούς,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/016.yaml
  text: 'This is the covenant that I will make with them after those days[a], says the Lord: putting my laws upon their hearts, and I will write them on their minds,'
translation:
  language: vi
  text: '“Đây là giao ước mà Ta sẽ lập với họ sau những ngày ấy,” Chúa phán: “Ta sẽ đặt những luật lệ của Ta trên lòng họ và sẽ viết chúng vào tâm trí họ.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διαθήκη
  choice: giao ước
  rationale: “Giao ước” giữ đúng ý nghĩa giao ước trong lời trích dẫn từ Giê-rê-mi và tránh nghĩa hiện đại của “di chúc”.
- source_word: διαθήσομαι
  choice: Ta sẽ lập
  rationale: Trong ngữ cảnh giao ước, động từ chỉ việc lập hoặc thiết lập giao ước; “lập” là cách nói tự nhiên và trang trọng trong tiếng Việt.
- source_word: πρὸς αὐτούς
  choice: với họ
  rationale: Trong công thức lập giao ước, πρὸς diễn tả các bên liên hệ và được chuyển tự nhiên là “với”.
- source_word: μετὰ τὰς ἡμέρας ἐκείνας
  choice: sau những ngày ấy
  rationale: Giữ nguyên ý nghĩa thời gian và sắc thái chỉ định của nguyên văn mà không diễn giải thêm.
- source_word: κύριος
  choice: Chúa
  rationale: Phản ánh trực tiếp κύριος trong bản Hy Lạp và phù hợp với lối xưng hô trang trọng trong lời phán của Đức Chúa Trời.
- source_word: διδοὺς
  choice: bằng việc đặt
  rationale: Dạng phân từ được giữ như một cụm chỉ cách thức, thay vì âm thầm đổi thành một động từ hữu hạn; “đặt” phù hợp với hình ảnh các luật lệ ở trên lòng.
- source_word: νόμους
  choice: các luật lệ
  rationale: Giữ số nhiều rõ ràng của nguyên văn; “luật lệ” dễ hiểu trong tiếng Việt hiện đại mà vẫn duy trì liên hệ với ý niệm luật pháp.
- source_word: ἐπὶ καρδίας αὐτῶν
  choice: trên lòng họ
  rationale: Giữ hình ảnh của ἐπί là viết hoặc đặt “trên” lòng, dù cách nói “vào lòng” có thể trôi chảy hơn trong tiếng Việt.
- source_word: διάνοιαν
  choice: tâm trí
  rationale: Chỉ năng lực suy nghĩ và hiểu biết; “tâm trí” là cách diễn đạt tự nhiên, đủ rộng trong tiếng Việt.
- source_word: ἐπιγράψω
  choice: Ta sẽ viết
  rationale: Truyền đạt rõ hành động viết lên hoặc khắc ghi; cụm chỉ vị trí theo sau cung cấp hình ảnh cần thiết.
- source_word: αὐτούς
  choice: chúng
  rationale: Đại từ hồi chỉ về “các luật lệ”, giữ cấu trúc liên kết của nguyên văn mà không lặp lại danh từ.
theological_decisions:
- issue: Cú pháp nội tại của lời trích dẫn từ Giê-rê-mi
  choice: Giữ dạng phân từ bằng cụm “bằng việc đặt...” rồi mới dùng động từ tương lai hữu hạn “Ta cũng sẽ viết...”
  alternative: 'Làm trôi chảy thành hai động từ tương lai song song: “Ta sẽ đặt... và Ta sẽ viết...”'
  rationale: Bản Hy Lạp của Hê-bơ-rơ dùng phân từ διδοὺς rồi mới đến động từ hữu hạn ἐπιγράψω. Cách dịch chính giữ nét khác biệt này thay vì hòa đồng câu văn với một bản dịch quen thuộc của Giê-rê-mi, đồng thời chú thích cách hiểu tự nhiên hơn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “Ta” được dùng trong lời Chúa phán. Dấu ngoặc kép làm rõ ranh giới lời trích dẫn; “các luật lệ” giữ số nhiều, còn “trên lòng” cố ý bảo toàn hình ảnh của nguyên văn.
