  source_fidelity: 'Bản dịch truyền đạt đúng các yếu tố chính: διαθήκη là “giao ước,” động từ tương lai “sẽ lập,” đối tượng “với họ,” và số nhiều của νόμους. Tuy nhiên, “bằng việc đặt” dễ hiểu là phương tiện dùng để lập giao ước, trong khi phân từ διδοὺς nêu nội dung/hành động của lời hứa. Cần chỉnh để tránh quan hệ nghĩa không có trong tiếng Hy Lạp.'
