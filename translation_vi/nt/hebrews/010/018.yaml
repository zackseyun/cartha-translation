  yaml_path: translation/nt/hebrews/010/018.yaml
  text: Where there is forgiveness of these[a], there is no longer any offering for sin.
translation:
  language: vi
  text: Ở đâu có sự tha thứ cho những điều ấy[a], thì không còn lễ dâng vì tội lỗi nữa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “sự xá miễn những điều ấy”; “những điều ấy” chỉ về các tội lỗi và việc gian ác được nhắc đến trong câu trước.
    reason: Nêu phương án từ vựng cho ἄφεσις và làm rõ từ quy chiếu của τούτων mà không đưa phần giải thích vào chính văn.
lexical_decisions:
- source_word: ὅπου
  choice: Nơi nào
  rationale: Diễn tả phạm vi hoặc hoàn cảnh mà kết luận theo sau có hiệu lực; cách nói này tự nhiên và giữ được tính khái quát của tiếng Hy Lạp.
- source_word: δὲ
  choice: thì
  rationale: δέ có lực chuyển ý hoặc suy luận nhẹ. Trong tiếng Việt, cấu trúc tương ứng “nơi nào… thì…” truyền đạt mạch lập luận tự nhiên mà không tạo nét tương phản quá mạnh.
- source_word: ἄφεσις
  choice: được tha
  rationale: Trong ngữ cảnh tội lỗi và tế lễ, từ này chỉ sự tha thứ. Dùng thể “được tha” tạo câu tiếng Việt sáng rõ mà vẫn giữ ý thụ động hàm chứa trong việc tội lỗi được xóa bỏ.
- source_word: τούτων
  choice: những điều ấy
  rationale: Giữ nguyên tính hồi chỉ và sự không xác định rõ ngay trong câu; cụm này hướng về các tội lỗi và việc gian ác ở câu trước mà không tự ý chèn danh từ vào chính văn.
- source_word: οὐκέτι
  choice: không còn… nữa
  rationale: Diễn đạt rõ sự chấm dứt, phù hợp với kết luận của lập luận.
- source_word: προσφορὰ
  choice: lễ vật dâng
  rationale: Giữ nghĩa rộng của thuật ngữ tế tự là vật/lễ dâng, không thu hẹp thành một loại hy sinh cụ thể.
- source_word: περὶ ἁμαρτίας
  choice: vì tội lỗi
  rationale: Diễn đạt tự nhiên chức năng tế tự liên quan đến việc xử lý tội lỗi, nhưng không diễn giải quá mức thành thuật ngữ chuyên biệt “lễ chuộc tội”.
theological_decisions:
- issue: Hàm ý về tính chung cuộc của sự hy sinh của Đấng Christ
  choice: Câu này khẳng định rằng nơi có sự tha thứ thì không còn lễ vật dâng vì tội lỗi nữa.
  alternative: Hiểu câu này là xóa bỏ mọi hình thức dâng hiến, hoặc chỉ nói đến nghi thức Lê-vi theo nghĩa hoàn toàn hạn hẹp.
  rationale: Ngữ cảnh đối chiếu các sinh tế lặp đi lặp lại với hiệu lực của sự hy sinh một lần đủ cả. Bản dịch giữ nguyên mệnh đề về lễ vật dâng vì tội lỗi, không mở rộng thành lời phủ định mọi loại dâng hiến.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cấu trúc “Nơi nào… thì…” phản ánh quan hệ logic của câu Hy Lạp; giữ đại từ hồi chỉ trong chính văn để bảo toàn sự liên kết với câu trước.
