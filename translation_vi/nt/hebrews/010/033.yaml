review_pass:
  verdict: revise
  source_fidelity: Bản nháp phản ánh đúng cấu trúc đối ứng τοῦτο μὲν ... τοῦτο δὲ và cách hiểu theo văn cảnh của ἀναστρεφομένων là những người bị đối xử/bách hại tương tự. Tuy nhiên, “bị công khai phơi ra trước” không tự nhiên và chưa truyền đạt rõ hình ảnh θεατριζόμενοι là bị đem ra làm cảnh tượng trước công chúng. “Cảnh khốn khó” cũng dễ gợi thiếu thốn vật chất hơn là các hoạn nạn, áp bức được θλίψεσιν chỉ đến trong ngữ cảnh này.
  naturalness: Cần thay cụm diễn đạt gượng “bị công khai phơi ra trước” bằng một cách nói tiếng Việt hiện đại, rõ ràng. “Một mặt ... mặt khác” phản ánh cấu trúc tương quan Hy Lạp mà không thêm sắc thái luân phiên theo thời gian quá mạnh như “khi thì ... khi khác.”
  terminology: Dùng “lời sỉ nhục và hoạn nạn” cho ὀνειδισμοῖς τε καὶ θλίψεσιν. “Đồng cảnh với” diễn đạt sự liên đới/dự phần của κοινωνοὶ trong hoàn cảnh bách hại mà không biến nó thành quan hệ đối tác theo nghĩa hiện đại. Chú thích giữ khả năng ἀναστρεφομένων nói về cách sống/cư xử.
  issues:
