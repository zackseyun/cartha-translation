  to: một mặt, anh chị em bị đưa ra làm trò trước công chúng, phải chịu những lời sỉ nhục và hoạn nạn;[a] mặt khác, anh chị em trở thành người đồng cảnh với những ai bị đối xử như thế.[b]
  rationale: Bản sửa dùng cách diễn đạt tự nhiên hơn cho hình ảnh công khai làm nhục trong θεατριζόμενοι, dùng “hoạn nạn” cho θλίψεις, và điều chỉnh cặp đối ứng để không áp đặt nghĩa luân phiên thời gian. Chú thích tiếp tục bảo tồn cách đọc thay thế hợp lý của ἀναστρεφομένων.
