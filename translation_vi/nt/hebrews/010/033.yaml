    rationale: Cụm này thiếu đối tượng hoặc bối cảnh của hành động “phơi ra”; đồng thời làm mờ sắc thái bị đưa ra trước công chúng như một cảnh tượng của θεατριζόμενοι.
  - severity: low
    issue: “Cảnh khốn khó” có thể thu hẹp hoặc lệch trọng tâm của θλίψεσιν.
    rationale: Trong mạch văn bách hại, “hoạn nạn” bao quát hơn các áp lực, đau khổ và khổ nạn phải chịu, không chủ yếu gợi hoàn cảnh nghèo khó.
  - severity: low
    issue: “Khi thì ... khi khác lại” có thể gợi các thời điểm luân phiên.
    rationale: Cấu trúc τοῦτο μὲν ... τοῦτο δὲ trước hết đối chiếu hai phương diện; “một mặt ... mặt khác” giữ chức năng này trung tính hơn.
