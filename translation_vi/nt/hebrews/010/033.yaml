  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: τοῦτο μὲν ὀνειδισμοῖς τε καὶ θλίψεσιν θεατριζόμενοι, τοῦτο δὲ κοινωνοὶ τῶν οὕτως ἀναστρεφομένων γενηθέντες·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/033.yaml
  text: sometimes being publicly exposed to insults and afflictions[b][a], and at other times becoming partners with those who were treated that way.
translation:
  language: vi
  text: một mặt, anh chị em bị đưa ra làm trò trước công chúng, phải chịu những lời sỉ nhục và hoạn nạn;[a] mặt khác, anh chị em trở thành người đồng cảnh với những ai bị đối xử như thế.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “bị công khai bêu ra” hoặc “bị phô bày trước công chúng.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể hiểu: “đồng cảnh với những người sống hoặc cư xử như thế”; phân từ Hy Lạp có thể chỉ cách sống, dù văn cảnh bách hại ở đây nghiêng về nghĩa “bị đối xử như thế.”'
    reason: alternative_reading
lexical_decisions:
- source_word: τοῦτο μὲν ... τοῦτο δὲ
  choice: khi thì ... khi khác lại
  rationale: Diễn đạt tự nhiên hai phương diện trong kinh nghiệm chịu đựng trước đây của độc giả, tương ứng với cấu trúc đối ứng của tiếng Hy Lạp.
- source_word: ὀνειδισμοῖς
  choice: những lời sỉ nhục
  rationale: Danh từ chỉ sự lăng mạ, làm nhục bằng lời nói; cách dịch này rõ nghĩa và phù hợp văn cảnh bách hại.
- source_word: θλίψεσιν
  choice: cảnh khốn khó
  rationale: Từ này chỉ áp lực, hoạn nạn hoặc nỗi khổ người ta phải chịu; cách dịch giữ phạm vi nghĩa khá rộng mà vẫn tự nhiên trong tiếng Việt.
- source_word: θεατριζόμενοι
  choice: bị công khai phơi ra trước
  rationale: Động từ gợi hình ảnh bị đưa ra trước công chúng như một cảnh tượng để chịu nhục; bản dịch chính nhấn mạnh tính công khai, còn sắc thái sống động hơn được giữ trong chú thích.
- source_word: κοινωνοὶ
  choice: những người cùng chia sẻ
  rationale: Diễn tả sự liên đới và dự phần vào hoàn cảnh của người khác, chứ không chỉ là quan hệ đồng hành thông thường.
- source_word: τῶν οὕτως ἀναστρεφομένων
  choice: với những ai bị đối xử như vậy
  rationale: Trong văn cảnh về sỉ nhục và hoạn nạn, cách hiểu thụ động này phù hợp nhất với ý liên đới cùng những người bị bách hại; khả năng nói về lối sống hoặc cách cư xử được ghi ở chú thích.
- source_word: γενηθέντες
  choice: trở thành
  rationale: Truyền đạt tự nhiên việc họ bước vào vị thế liên đới và cùng chia sẻ với những người đang chịu cảnh ấy.
theological_decisions:
- issue: Ý nghĩa của ἀναστρεφομένων trong văn cảnh
  choice: Hiểu là những người bị đối xử theo cách ấy
  alternative: Những người sống hoặc cư xử theo cách ấy
  rationale: Văn cảnh trực tiếp tập trung vào sự sỉ nhục, khốn khó và việc liên đới với người bị bách hại. Tuy vậy, vì động từ này thường có thể chỉ cách sống hoặc cách cư xử, bản dịch không loại bỏ khả năng đó mà ghi nhận trong chú thích.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh chị em” để xưng hô bao hàm cộng đồng độc giả; giữ nhịp đối ứng “khi thì ... khi khác lại” và bảo tồn sự mơ hồ thực sự của ἀναστρεφομένων bằng chú thích.
