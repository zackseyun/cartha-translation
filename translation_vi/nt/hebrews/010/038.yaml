  source_fidelity: 'Bản dịch truyền đạt đúng cấu trúc và các ý chính của câu Hy Lạp: “người công chính của Ta,” đời sống “bởi đức tin,” điều kiện lùi bước, và sự không đẹp lòng của Đức Chúa Trời. Tuy nhiên, “linh hồn Ta chẳng vui thích nơi người ấy” là cách kết hợp từ ngữ không tự nhiên trong tiếng Việt hiện đại; đặc biệt, “vui thích nơi” không diễn đạt thông dụng đối tượng của sự hài lòng. Cách thành ngữ “Ta không đẹp lòng về người ấy” chuyển cách nói ψυχή μου một cách tự nhiên mà vẫn giữ lực nghĩa của nguyên văn.'
