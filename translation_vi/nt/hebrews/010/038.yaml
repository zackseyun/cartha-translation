id: HEB.10.38
reference: Hebrews 10:38
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὁ δὲ δίκαιός ⸀μου ἐκ πίστεως ζήσεται, καὶ ἐὰν ὑποστείληται, οὐκ εὐδοκεῖ ἡ ψυχή μου ἐν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/038.yaml
  text: But my righteous one will live by faith[a], and if he shrinks back[c][b], my soul takes no pleasure in him.
translation:
  language: vi
  text: Nhưng người công chính của Ta[b] sẽ sống bởi đức tin[a]; và nếu người ấy lùi bước, Ta không đẹp lòng về người ấy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “bởi lòng trung tín” hoặc “bởi sự tin cậy.” Từ Hy Lạp pistis có thể mang các nghĩa này.'
    reason: lexical_alternative
  - marker: b
    text: Một số bản chép tay chỉ ghi “người công chính,” không có từ “của Ta.”
    reason: textual_variant
lexical_decisions:
- source_word: ὁ δὲ δίκαιός μου
  choice: Nhưng người công chính của Ta
  rationale: Tính từ có mạo từ được dùng như danh từ, chỉ một người mang đặc tính công chính. Đại từ sở hữu μου được giữ theo SBLGNT; “người công chính” tự nhiên trong tiếng Việt và không thêm ý ngoài nguyên văn.
- source_word: ἐκ πίστεως
  choice: bởi đức tin
  rationale: ἐκ diễn tả nền tảng hoặc nguồn, còn πίστις trong ngữ cảnh này có thể mang nghĩa đức tin, lòng trung tín hoặc sự tin cậy. Bản chính dùng cách dịch quen thuộc “đức tin,” đồng thời ghi các khả năng khác trong chú thích.
- source_word: ζήσεται
  choice: sẽ sống
  rationale: Giữ rõ ý tương lai của động từ ζάω.
- source_word: ὑποστείληται
  choice: lùi bước
  rationale: Diễn đạt hành động rút lui hoặc chùn lại trước áp lực, phù hợp với mạch cảnh báo của đoạn văn mà vẫn tự nhiên trong tiếng Việt hiện đại.
- source_word: οὐκ εὐδοκεῖ
  choice: chẳng vui thích
  rationale: Phản ánh nghĩa “không hài lòng, không lấy làm vui thích” của εὐδοκέω; “chẳng” tạo sắc thái trang trọng nhưng vẫn dễ hiểu.
- source_word: ἡ ψυχή μου
  choice: linh hồn Ta
  rationale: Giữ hình thức diễn đạt trực tiếp của nguyên văn và tiếng vọng từ lời Kinh Thánh được trích dẫn, thay vì giản lược thành “Ta.”
- source_word: ἐν αὐτῷ
  choice: nơi người ấy
  rationale: Trong kết cấu với εὐδοκέω, “nơi người ấy” truyền đạt tự nhiên đối tượng mà chủ thể không vui thích; đồng thời lặp lại rõ người được nhắc đến.
theological_decisions:
- issue: Nghĩa của πίστις trong ἐκ πίστεως
  choice: đức tin
  alternative: lòng trung tín; sự tin cậy
  rationale: πίστις có phạm vi nghĩa bao gồm đức tin, sự tin cậy và lòng trung tín. Bản chính không khép lại tranh luận thần học; các nghĩa khả hữu được bảo lưu trong chú thích.
- issue: Chủ thể của mệnh đề “nếu người ấy lùi bước”
  choice: giữ mạch quy chiếu đến cùng một người số ít vừa được gọi là “người công chính của Ta”
  alternative: hiểu là một người bất định khác
  rationale: Các hình thức Hy Lạp tiếp tục ở số ít và không đánh dấu rõ sự đổi chủ thể. Bản dịch giữ sự căng thẳng của lời cảnh báo, không tách hai mệnh đề vì lý do giáo lý.
- issue: Cách thể hiện giống ngữ pháp
  choice: người ấy
  alternative: ông ấy; người đó
  rationale: Tiếng Việt không buộc phải đánh dấu giống trong đại từ quy chiếu. “Người ấy” giữ nguyên số ít và tính đại diện của cách nói Hy Lạp mà không hàm ý nguyên văn chỉ áp dụng cho nam giới.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Ta” được viết hoa vì đây là lời Đức Chúa Trời trong câu trích dẫn. Dấu chấm phẩy giữ mối liên hệ chặt chẽ nhưng có tính đối chiếu giữa lời hứa và lời cảnh báo.
