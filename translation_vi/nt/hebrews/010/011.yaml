revisions:
- from: Mỗi thầy tế lễ đều đứng phục vụ ngày này qua ngày khác và cứ dâng đi dâng lại những sinh tế giống nhau, là những sinh tế không bao giờ có thể cất bỏ tội lỗi.[a]
  to: Mỗi thầy tế lễ ngày nào cũng đứng phục vụ và hết lần này đến lần khác dâng những sinh tế giống nhau, những sinh tế ấy không bao giờ có thể cất bỏ tội lỗi.[a]
  rationale: Bỏ “đều” để diễn đạt tự nhiên nghĩa phân phối của πᾶς ἱερεύς. “Ngày nào cũng” giữ nghĩa καθ’ ἡμέραν; “hết lần này đến lần khác” giữ sắc thái lặp lại của πολλάκις. Lặp lại “những sinh tế ấy” làm rõ αἵτινες quy chiếu đến các sinh tế và giữ tính giải thích của mệnh đề, không thêm diễn giải thần học.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T21:28:46Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch giữ đúng các yếu tố chính của nguyên văn: tính phân phối của πᾶς ἱερεύς, tư thế “đứng,” sự lặp lại hằng ngày và nhiều lần, cùng sự bất lực tuyệt đối của các sinh tế trong việc cất bỏ tội lỗi. Tuy nhiên, cụm “Mỗi ... đều” không phù hợp với lực phân phối của tiếng Việt và cần được chỉnh.'
  naturalness: “Mỗi thầy tế lễ đều đứng” có sự chồng lấp giữa “mỗi” và “đều”; trong tiếng Việt hiện đại, “mỗi thầy tế lễ ...” là tự nhiên và chính xác hơn. Câu chỉnh sửa cũng làm mệnh đề quan hệ quy chiếu về các sinh tế rõ và mượt hơn.
  terminology: “Thầy tế lễ,” “phục vụ,” “sinh tế,” và “cất bỏ tội lỗi” phù hợp ngữ cảnh tế tự và văn phong trang trọng hiện đại. Chú thích lexical alternative được neo đúng vào “cất bỏ tội lỗi.”
  issues:
