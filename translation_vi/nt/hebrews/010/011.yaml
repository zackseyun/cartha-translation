id: HEB.10.11
reference: Hebrews 10:11
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Καὶ πᾶς μὲν ἱερεὺς ἕστηκεν καθ’ ἡμέραν λειτουργῶν καὶ τὰς αὐτὰς πολλάκις προσφέρων θυσίας, αἵτινες οὐδέποτε δύνανται περιελεῖν ἁμαρτίας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/011.yaml
  text: And every priest stands day after day ministering and offering the same sacrifices again and again[a], which can never take away sins.
translation:
  language: vi
  text: Mỗi thầy tế lễ ngày nào cũng đứng phục vụ và hết lần này đến lần khác dâng những sinh tế giống nhau, những sinh tế ấy không bao giờ có thể cất bỏ tội lỗi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “loại bỏ tội lỗi.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς ... ἱερεὺς
  choice: mỗi thầy tế lễ
  rationale: πᾶς đi với danh từ số ít mang nghĩa phân phối, chỉ từng thầy tế lễ trong hàng ngũ Lê-vi; “mỗi thầy tế lễ” tự nhiên và không biến ἱερεύς thành “thầy tế lễ thượng phẩm”.
- source_word: ἕστηκεν
  choice: đều đứng
  rationale: Thể hoàn thành của ἵστημι diễn tả tư thế hay trạng thái đứng. Cách dịch này giữ hình ảnh sống động và sự tương phản với tư thế ngồi của Đấng Mê-si-a ở câu 12.
- source_word: καθ’ ἡμέραν
  choice: ngày này qua ngày khác
  rationale: Diễn tả công việc hằng ngày cứ tiếp diễn và nhấn mạnh tính lặp lại trong lập luận của phân đoạn.
- source_word: λειτουργῶν
  choice: phục vụ
  rationale: Ở đây từ này chỉ việc phụng sự trong nghi lễ tế tự. “Phục vụ” sáng rõ trong tiếng Việt hiện đại, còn ngữ cảnh thầy tế lễ và sinh tế xác định sắc thái thánh vụ.
- source_word: τὰς αὐτὰς ... θυσίας
  choice: những sinh tế giống nhau
  rationale: 'Giữ trọng tâm của αὐτάς: các sinh tế cùng loại được lặp lại, thay vì những lễ vật đem lại kết quả mới hay dứt khoát.'
- source_word: πολλάκις
  choice: cứ ... đi ... lại
  rationale: Kết cấu “cứ dâng đi dâng lại” diễn đạt tự nhiên và mạnh tính tái diễn của πολλάκις.
- source_word: προσφέρων
  choice: dâng
  rationale: Trong ngữ cảnh tế lễ, προσφέρω có nghĩa thông dụng và chính xác là dâng sinh tế.
- source_word: αἵτινες
  choice: là những sinh tế
  rationale: Dịch theo sắc thái giải thích và quy chiếu lại của đại từ, giúp câu tiếng Việt rõ chủ thể của mệnh đề sau mà không thêm ý.
- source_word: οὐδέποτε δύνανται
  choice: không bao giờ có thể
  rationale: Giữ nguyên tính tuyệt đối của sự bất lực được diễn tả bởi οὐδέποτε kết hợp với δύνανται.
- source_word: περιελεῖν ἁμαρτίας
  choice: cất bỏ tội lỗi
  rationale: περιαιρέω ở đây có nghĩa loại bỏ hay lấy đi. “Cất bỏ” trang trọng, dễ hiểu và giữ hình ảnh loại trừ tội lỗi mà không giải thích quá mức.
theological_decisions:
- issue: Mối liên hệ giữa tư thế của thầy tế lễ và lập luận trong Hê-bơ-rơ 10
  choice: Giữ động từ “đứng” để bảo toàn sự tương phản với việc Đấng Mê-si-a ngồi xuống ở câu kế tiếp.
  alternative: Dịch trung tính hơn là “đang đứng” hoặc chỉ nói “phục vụ” mà không nêu tư thế.
  rationale: Tư thế đứng là chi tiết minh nhiên trong tiếng Hy Lạp và góp phần vào sự tương phản văn chương-thần học của ngữ cảnh; bản dịch không nên lược bỏ.
- issue: Phạm vi sự bất lực của các sinh tế
  choice: 'Dịch tuyệt đối: “không bao giờ có thể cất bỏ tội lỗi.”'
  alternative: Làm nhẹ thành “không thể giải quyết tội lỗi cách trọn vẹn.”
  rationale: Nguyên văn khẳng định οὐδέποτε δύνανται, tức sự bất lực tuyệt đối trong lập luận của tác giả. Không nên thêm từ “trọn vẹn” để làm yếu hoặc diễn giải lời khẳng định.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. “Thầy tế lễ,” “sinh tế” giữ trường nghĩa tế tự; nhịp “ngày này qua ngày khác” và “dâng đi dâng lại” làm nổi bật tính liên tục, lặp lại. Dấu chú thích [a] được đặt ngay sau cụm từ liên quan.
