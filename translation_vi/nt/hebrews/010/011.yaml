    issue: Cụm “Mỗi thầy tế lễ đều đứng” dùng đồng thời “mỗi” và “đều.”
    rationale: “Mỗi” đã diễn đạt nghĩa phân phối của πᾶς với danh từ số ít. “Đều” ở đây thừa và làm câu kém tự nhiên; bỏ “đều” không thay đổi nghĩa.
  revised_text: Mỗi thầy tế lễ ngày nào cũng đứng phục vụ và hết lần này đến lần khác dâng những sinh tế giống nhau, những sinh tế ấy không bao giờ có thể cất bỏ tội lỗi.[a]
