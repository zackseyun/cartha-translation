id: HEB.10.25
reference: Hebrews 10:25
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: μὴ ἐγκαταλείποντες τὴν ἐπισυναγωγὴν ἑαυτῶν, καθὼς ἔθος τισίν, ἀλλὰ παρακαλοῦντες, καὶ τοσούτῳ μᾶλλον ὅσῳ βλέπετε ἐγγίζουσαν τὴν ἡμέραν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/025.yaml
  text: not neglecting our own gathering together[a], as is the habit of some[b], but encouraging one another—and all the more as you see the Day drawing near.
translation:
  language: vi
  text: đừng bỏ việc tụ họp của chúng ta[a], như một số người vẫn quen làm, nhưng hãy khích lệ nhau; và càng phải khích lệ nhau hơn nữa khi anh chị em thấy Ngày ấy đang đến gần.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đừng xao lãng” hoặc “đừng từ bỏ việc tụ họp của chúng ta.”'
    reason: lexical_alternative
  - marker: b
    text: “Ngày ấy” rất có thể chỉ ngày của Chúa hoặc ngày phán xét cuối cùng.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐγκαταλείποντες
  choice: bỏ
  rationale: Từ này có thể chỉ việc lơ là, từ bỏ hoặc bỏ mặc. Trong lời khuyên này, “bỏ việc” vừa tự nhiên trong tiếng Việt vừa giữ được mức độ rộng của nguyên ngữ, không mặc nhiên quy thành sự bội đạo hoàn toàn.
- source_word: ἐπισυναγωγὴν ἑαυτῶν
  choice: việc nhóm lại với nhau
  rationale: Cụm này nói đến việc các tín hữu tụ họp. “Nhóm lại với nhau” rõ nghĩa, có sắc thái cộng đồng và tránh đưa vào văn bản một hình thức cơ cấu hay nghi lễ không được nguyên ngữ nêu rõ.
- source_word: καθὼς ἔθος τισίν
  choice: như một số người vẫn quen làm
  rationale: Diễn đạt tự nhiên ý về thói quen hay thông lệ của một số người, đồng thời giữ lời nhắc nhở nhẹ nhưng rõ.
- source_word: παρακαλοῦντες
  choice: khích lệ nhau
  rationale: Động từ có thể mang nghĩa khuyên nhủ, thúc giục, an ủi hoặc khích lệ. Trong bối cảnh cộng đồng cần bền lòng, “khích lệ nhau” chuyển tải tốt ý nâng đỡ lẫn nhau; đối tượng tương hỗ được hiểu từ ngữ cảnh.
- source_word: τοσούτῳ μᾶλλον ὅσῳ
  choice: càng phải làm như vậy hơn khi
  rationale: 'Giữ quan hệ tăng tiến: mức độ khích lệ phải gia tăng tương ứng với việc Ngày ấy đến gần.'
- source_word: βλέπετε
  choice: anh chị em thấy
  rationale: Giữ nghĩa trực tiếp của động từ “thấy” và thể số nhiều; “anh chị em” giúp tiếng Việt hiện đại biểu thị rõ cộng đồng được nói với mà không dùng đại từ xa cách.
- source_word: ἐγγίζουσαν
  choice: đang đến gần
  rationale: Thể hiện sinh động tiến trình Ngày ấy đang tiến lại gần, đồng thời phù hợp với phân từ hiện tại.
- source_word: τὴν ἡμέραν
  choice: Ngày ấy
  rationale: “Ngày ấy” cho thấy đây là một ngày đã được cộng đồng nhận biết trong ngữ cảnh cánh chung, nhưng không tự ý mở rộng thành “Ngày của Chúa” hay “ngày phán xét” trong chính câu.
theological_decisions:
- issue: Ý nghĩa cánh chung của τὴν ἡμέραν
  choice: Ngày ấy
  alternative: ngày đó; Ngày của Chúa; ngày phán xét
  rationale: Ngữ cảnh về sự bền đỗ và thời điểm đến gần cho thấy một ngày cánh chung đã được biết đến. “Ngày ấy” giữ tính xác định và sức gợi của nguyên văn mà không quyết định vượt quá điều câu này nói rõ.
- issue: Đối tượng tương hỗ của παρακαλοῦντες
  choice: khích lệ nhau
  alternative: khích lệ; khuyên nhủ nhau
  rationale: Dù nguyên ngữ không ghi một đại từ làm tân ngữ tại đây, bối cảnh tụ họp cộng đồng hàm ý rõ hành động tương hỗ. Thêm “nhau” là minh thị hóa cần thiết để câu tiếng Việt tự nhiên, không thêm một giáo lý.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “anh chị em” để biểu thị ngôi thứ hai số nhiều trong cộng đồng; tránh thuật ngữ cơ cấu như “buổi lễ nhà thờ.” Mọi dấu chú thích đều xuất hiện trong chính văn.
