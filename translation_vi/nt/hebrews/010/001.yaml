  source_fidelity: 'Bản nháp truyền đạt đúng lập luận chính của câu: Luật pháp là “bóng” của các điều tốt lành sắp đến, không phải “chính hình ảnh” của các thực tại; các sinh tế lặp lại không thể làm cho người đến gần được hoàn thiện. Tuy nhiên, cụm “nhờ cùng những sinh tế” không tự nhiên trong tiếng Việt hiện đại và làm mờ sắc thái “cùng/chính những sinh tế ấy” (ταῖς αὐταῖς θυσίαις). Cần chỉnh cú pháp để phương tiện và sự lặp lại liên tục được rõ hơn.'
  naturalness: Câu khá trang trọng và dễ hiểu, nhưng “nhờ cùng những sinh tế” là kết hợp từ không tự nhiên. Đưa cụm phương tiện vào giữa hai dấu phẩy và dùng “bằng chính những sinh tế ấy” tạo câu tiếng Việt rõ, mạch lạc hơn. “Người ta dâng” vẫn giữ được chủ thể số nhiều không nêu đích danh của nguyên ngữ.
  terminology: Các thuật ngữ “luật pháp”, “bóng”, “hình ảnh”, “thực tại”, “sinh tế”, và “được hoàn thiện” phù hợp với văn mạch thư Hê-bơ-rơ. “Đến gần” nên được giữ, cùng chú thích về sắc thái đến gần Đức Chúa Trời trong thờ phượng. Chú thích cho τελειόω bảo toàn ý hướng tới sự trọn vẹn/mục đích mà không thu hẹp vào hoàn hảo đạo đức.
