id: HEB.10.1
reference: Hebrews 10:1
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Σκιὰν γὰρ ἔχων ὁ νόμος τῶν μελλόντων ἀγαθῶν, οὐκ αὐτὴν τὴν εἰκόνα τῶν πραγμάτων, κατ’ ἐνιαυτὸν ταῖς αὐταῖς θυσίαις ἃς προσφέρουσιν εἰς τὸ διηνεκὲς οὐδέποτε ⸀δύναται τοὺς προσερχομένους τελειῶσαι·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/001.yaml
  text: For since the law has only a shadow of the good things to come[a], not the very form of the realities, it can never, by the same sacrifices that they continually offer year after year[c][b], perfect those who draw near.
translation:
  language: vi
  text: Vì luật pháp chỉ có bóng của những điều tốt lành sắp đến, chứ không phải chính hình ảnh của các thực tại ấy, nên luật pháp không bao giờ có thể, bằng chính những sinh tế ấy mà người ta dâng liên tục năm này qua năm khác[a], làm cho những người đến gần[b] được hoàn thiện[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “mỗi năm, cứ liên tục dâng chính những sinh tế ấy.”'
    reason: Trật tự các cụm từ Hy Lạp cho phép gắn ý “liên tục” với việc dâng sinh tế, trong khi “năm này qua năm khác” nhấn mạnh chu kỳ hằng năm.
  - marker: b
    text: “Đến gần” ở đây mang ý đến gần Đức Chúa Trời trong sự thờ phượng.
    reason: Chú thích văn hóa và ngữ cảnh giúp người đọc nhận ra sắc thái phụng tự của προσέρχομαι trong Hê-bơ-rơ.
  - marker: c
    text: 'Hay: “đưa ... đến chỗ trọn vẹn.”'
    reason: τελειόω có thể chỉ việc làm cho hoàn thiện hoặc đưa đến mục đích đã định, không nhất thiết chỉ sự hoàn hảo đạo đức.
lexical_decisions:
- source_word: Σκιὰν
  choice: bóng
  rationale: Giữ nguyên ẩn dụ “bóng” và sự tương phản với εἰκών, diễn tả nét báo trước nhưng chưa phải thực tại trọn vẹn.
- source_word: τῶν μελλόντων ἀγαθῶν
  choice: của những điều tốt lành sắp đến
  rationale: Diễn đạt tự nhiên ý nghĩa hướng tới tương lai của phân từ μέλλω mà không ấn định quá mức thời điểm cánh chung.
- source_word: οὐκ αὐτὴν τὴν εἰκόνα τῶν πραγμάτων
  choice: chứ không phải chính hình ảnh của các thực tại ấy
  rationale: “Chính hình ảnh” bảo toàn εἰκών và sức nhấn mạnh của αὐτήν; “các thực tại ấy” làm rõ sự tương phản với “bóng” mà không đồng nhất hình ảnh với thực tại.
- source_word: κατ’ ἐνιαυτὸν
  choice: năm này qua năm khác
  rationale: Làm nổi bật sự lặp lại hằng năm trong lập luận về tính bất lực của các sinh tế lặp đi lặp lại.
- source_word: ταῖς αὐταῖς θυσίαις
  choice: nhờ cùng những sinh tế
  rationale: “Nhờ” biểu thị phương tiện của cách dữ liệu; “cùng những” giữ sự nhấn mạnh vào các sinh tế giống nhau được lặp lại.
- source_word: ἃς προσφέρουσιν εἰς τὸ διηνεκές
  choice: mà người ta cứ dâng
  rationale: Giữ chủ thể bất định của động từ số nhiều và diễn đạt hành động tiếp diễn, lặp lại của εἰς τὸ διηνεκές bằng tiếng Việt tự nhiên.
- source_word: οὐδέποτε δύναται
  choice: không bao giờ có thể
  rationale: Bảo toàn cả khả năng được nói đến bởi δύναται lẫn phủ định tuyệt đối của οὐδέποτε.
- source_word: τοὺς προσερχομένους
  choice: những người đến gần
  rationale: Giữ ngôn ngữ tiếp cận của προσέρχομαι; trong văn mạch Hê-bơ-rơ, đây là việc đến gần Đức Chúa Trời trong sự thờ phượng, được giải thích ở chú thích.
- source_word: τελειῶσαι
  choice: làm cho ... được hoàn thiện
  rationale: “Được hoàn thiện” giữ thuật ngữ thần học chủ chốt của Hê-bơ-rơ và ý đạt tới mục đích, đồng thời tránh khiến câu nghe như chỉ nói về sự hoàn hảo đạo đức.
theological_decisions:
- issue: Sự tương phản giữa “bóng” và “hình ảnh” trong thần học về luật pháp và sinh tế
  choice: Luật pháp có bóng của những điều tốt lành sắp đến, nhưng không phải chính hình ảnh của các thực tại ấy.
  alternative: Diễn giải εἰκών trực tiếp là “thực thể” hoặc “thực tại đích thực”.
  rationale: Bản Hy Lạp phân biệt σκιά, εἰκών và πράγματα. Bản dịch giữ cả ba lớp từ ngữ và không âm thầm giải quyết sự căng thẳng bằng cách đồng nhất “hình ảnh” với chính “thực tại”.
- issue: Ý nghĩa của τελειῶσαι trong bối cảnh sinh tế
  choice: làm cho những người đến gần được hoàn thiện
  alternative: làm cho hoàn toàn vô tội về mặt đạo đức; hoặc đưa đến chỗ trọn vẹn
  rationale: Trong Hê-bơ-rơ, động từ này liên quan đến việc đạt mục đích và có quyền đến gần Đức Chúa Trời. “Được hoàn thiện” giữ sự cộng hưởng thần học mà không áp đặt ý niệm hoàn toàn không còn khuyết điểm đạo đức.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “luật pháp”, “sinh tế” và “đến gần” để duy trì từ vựng nhất quán với văn mạch thờ phượng của Hê-bơ-rơ; cấu trúc câu được sắp xếp tự nhiên trong tiếng Việt nhưng vẫn giữ chuỗi lập luận nguyên nhân–kết quả của nguyên bản.
