id: HEB.10.10
reference: Hebrews 10:10
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐν ᾧ θελήματι ἡγιασμένοι ⸀ἐσμὲν διὰ τῆς προσφορᾶς τοῦ σώματος Ἰησοῦ Χριστοῦ ἐφάπαξ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/010.yaml
  text: By that will we have been sanctified through the offering of the body of Jesus the Messiah once for all[a][b].
translation:
  language: vi
  text: Theo ý muốn ấy[a], chúng ta đã được thánh hóa nhờ sự dâng hiến thân thể của Đức Giê-su, Đấng Mê-si-a[b], một lần đủ cả.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sát chữ hơn: “trong ý muốn ấy.” Văn cảnh cho thấy đây là ý muốn của Đức Chúa Trời vừa được nhắc đến.'
    reason: lexical_alternative
  - marker: b
    text: 'Hoặc: “Đức Giê-su Cơ Đốc.” Từ Hy Lạp Χριστός có nghĩa là “Đấng Mê-si-a” và ở đây có thể được hiểu như một tước hiệu.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν ᾧ θελήματι
  choice: Theo ý muốn ấy
  rationale: Cụm từ quy chiếu về ý muốn của Đức Chúa Trời vừa được nhắc đến; “theo ý muốn ấy” tự nhiên trong tiếng Việt và giữ được quan hệ phương tiện/nền tảng mà văn cảnh biểu đạt. Nghĩa sát chữ hơn được ghi ở chú thích.
- source_word: ἡγιασμένοι ἐσμὲν
  choice: chúng ta đã được thánh hóa
  rationale: Kết cấu phân từ hoàn thành đi với động từ “là” diễn tả hành động đã hoàn tất và kết quả còn tồn tại. “Đã được thánh hóa” giữ được thể bị động và sắc thái này mà không biến nó thành một tiến trình đang tiếp diễn.
- source_word: διὰ τῆς προσφορᾶς
  choice: nhờ sự dâng hiến
  rationale: διά với sở hữu cách chỉ phương tiện; “nhờ” là cách diễn đạt tự nhiên. “Sự dâng hiến” phản ánh προσφορά mà không giải thích quá mức thành một thuật ngữ tế lễ cụ thể hơn.
- source_word: τοῦ σώματος
  choice: thân thể
  rationale: Giữ danh từ cụ thể của nguyên văn, nhấn mạnh chính thân thể của Đức Giê-su được dâng hiến.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Đức Giê-su, Đấng Mê-si-a
  rationale: Χριστός mang ý nghĩa tước hiệu; “Đấng Mê-si-a” bảo tồn nội dung tước hiệu trong tiếng Việt. “Đức” tạo sắc thái tôn kính, trang trọng và tự nhiên.
- source_word: ἐφάπαξ
  choice: một lần đủ cả
  rationale: Diễn đạt tính duy nhất, dứt khoát và không cần lặp lại của việc dâng hiến, đồng thời không thêm đối tượng cho từ “cả” ngoài điều nguyên văn hàm ý.
theological_decisions:
- issue: Thể và ý nghĩa thần học của sự thánh hóa
  choice: “đã được thánh hóa” — hành động hoàn tất với kết quả còn hiệu lực
  alternative: “được thánh hóa” hoặc “đang được thánh hóa”
  rationale: Kết cấu hoàn thành ngoại vi trong tiếng Hy Lạp không phải hiện tại tiếp diễn. Bản dịch giữ sức căng giữa hành động đã hoàn tất và tình trạng hiện còn, không áp đặt một hệ thống giáo lý riêng.
- issue: Tước hiệu Χριστοῦ
  choice: “Đấng Mê-si-a”
  alternative: “Cơ Đốc”
  rationale: Trong cụm này, Χριστός có thể được nghe như tước hiệu. Dịch nghĩa là “Đấng Mê-si-a” làm rõ chức năng ấy; cách dịch quen thuộc “Cơ Đốc” được nêu trong chú thích.
- issue: Tính dứt khoát của ἐφάπαξ
  choice: “một lần đủ cả”
  alternative: “một lần”
  rationale: Cách chọn giữ được sự nhấn mạnh rằng sự dâng hiến là duy nhất và không lặp lại, nhưng không bổ sung một lý thuyết cứu chuộc vượt quá câu văn.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “thánh hóa,” “dâng hiến” và “Đấng Mê-si-a” để giữ sắc thái thần học của nguyên văn; tránh diễn giải theo một truyền thống giáo phái cụ thể.
