  verdict: revise
  source_fidelity: Bản nháp giữ được cấu trúc cảnh báo tu từ, ba hành vi khinh miệt, và ý nghĩa chính của các từ Hy Lạp. Tuy nhiên, “huyết đã thánh hóa mình” có thể khiến “mình” bị hiểu là chỉ “huyết” hoặc gây mơ hồ không chủ ý; nguyên văn nói người phạm tội đã được thánh hóa nhờ/bởi huyết ấy. “Thánh Linh ban ân điển” cũng diễn giải quan hệ thuộc cách περισσότερο hơn nguyên văn, vốn chỉ nói “Thần/Thánh Linh của ân điển.”
  naturalness: Câu hỏi tu từ sẽ tự nhiên và rõ hơn nếu kết bằng dấu hỏi, với động từ tương lai “sẽ đáng chịu.” Mệnh đề chen giữa nên nêu rõ “người ấy” để tránh quy chiếu phản thân mơ hồ.
  terminology: Giữ “Con Đức Chúa Trời,” “huyết của giao ước,” và “thánh hóa.” Chọn “phàm tục” trong chính văn để phản ánh κοινόν như điều không thánh, đồng thời chú thích các khả năng “tầm thường” và “ô uế.” Dùng “Thánh Linh của ân điển” để không thêm rõ ý “ban” vốn không được phát biểu trực tiếp.
