id: HEB.10.29
reference: Hebrews 10:29
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: πόσῳ δοκεῖτε χείρονος ἀξιωθήσεται τιμωρίας ὁ τὸν υἱὸν τοῦ θεοῦ καταπατήσας, καὶ τὸ αἷμα τῆς διαθήκης κοινὸν ἡγησάμενος ἐν ᾧ ἡγιάσθη, καὶ τὸ πνεῦμα τῆς χάριτος ἐνυβρίσας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/029.yaml
  text: How much worse punishment do you think will be deserved by the one who has trampled underfoot the Son of God[a], and has regarded the blood of the covenant by which he was sanctified as common[c][b], and has insulted the Spirit of grace?
translation:
  language: vi
  text: Anh chị em nghĩ người đã chà đạp Con Đức Chúa Trời, coi huyết của giao ước—nhờ huyết ấy người ấy đã được thánh hóa[b]—là phàm tục[a], và xúc phạm Thánh Linh của ân điển[c], sẽ đáng chịu hình phạt nặng hơn biết bao?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “là thứ tầm thường” hoặc “là ô uế.”'
    reason: lexical_alternative
  - marker: b
    text: Trong tiếng Hy Lạp, mệnh đề “nhờ huyết ấy người ấy đã được thánh hóa” về mặt cú pháp gắn tự nhiên với người đang bị mô tả; tuy nhiên, có người hiểu sở chỉ theo cách khác. Bản dịch giữ nguyên sự căng thẳng này thay vì giải quyết thay cho nguyên văn.
    reason: alternative_reading
  - marker: c
    text: 'Sát chữ: “Thánh Linh của ân điển”; động từ cũng có thể dịch là “sỉ nhục” hoặc “lăng nhục.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: πόσῳ ... χείρονος
  choice: nặng hơn biết bao
  rationale: Diễn đạt tự nhiên câu hỏi tu từ với dạng so sánh, nhấn mạnh mức hình phạt nghiêm trọng hơn.
- source_word: ἀξιωθήσεται τιμωρίας
  choice: đáng chịu hình phạt
  rationale: Giữ sắc thái phán xét của thể bị động 'bị kể là xứng đáng với hình phạt' nhưng dùng lối nói Việt ngữ gọn và tự nhiên.
- source_word: καταπατήσας
  choice: đã chà đạp
  rationale: Giữ hình ảnh mạnh về hành vi khinh miệt, thay vì chuyển thành một ý trừu tượng.
- source_word: τὸν υἱὸν τοῦ θεοῦ
  choice: Con Đức Chúa Trời
  rationale: Cách dịch chính xác, trang trọng và quen thuộc của danh hiệu này.
- source_word: τὸ αἷμα τῆς διαθήκης
  choice: huyết của giao ước
  rationale: Giữ nguyên cụm từ giao ước và âm hưởng hiến tế; 'huyết' phù hợp văn phong Kinh Thánh trang trọng.
- source_word: κοινὸν
  choice: thứ tầm thường
  rationale: Diễn đạt sự đối lập với điều thánh theo cách dễ hiểu; chú thích giữ các nghĩa gần hơn về nghi lễ là 'phàm tục' và 'ô uế'.
- source_word: ἐν ᾧ ἡγιάσθη
  choice: huyết đã thánh hóa mình
  rationale: Hiểu ἐν ᾧ theo nghĩa phương tiện và giữ chủ thể ngầm của ἡγιάσθη gắn với người phạm tội theo cú pháp gần nhất, nhưng chú thích ghi nhận tranh luận về sở chỉ.
- source_word: τὸ πνεῦμα τῆς χάριτος
  choice: Thánh Linh ban ân điển
  rationale: Genitive có thể là mô tả phẩm tính hoặc nguồn ban; cách diễn đạt này tự nhiên trong tiếng Việt và chú thích bảo lưu cách dịch sát hơn.
- source_word: ἐνυβρίσας
  choice: xúc phạm
  rationale: Truyền đạt hành vi lăng nhục, khinh miệt; chú thích nêu sắc thái mạnh hơn là 'sỉ nhục'.
theological_decisions:
- issue: Sở chỉ của chủ thể trong ἡγιάσθη ('đã được thánh hóa')
  choice: Dịch là 'huyết đã thánh hóa mình', để chủ thể ngầm tự nhiên chỉ về người đang bị mô tả.
  alternative: Có người hiểu sở chỉ là Đấng Christ hoặc cộng đồng giao ước, hay cấu trúc theo hướng phi nhân xưng.
  rationale: Chuỗi phân từ và động từ số ít về mặt cú pháp gần nhất đều mô tả cùng một người. Bản dịch không giải quyết xa hơn cuộc tranh luận thần học về sự bội đạo và bền đỗ, còn chú thích nói rõ có cách hiểu khác.
- issue: Quan hệ trong cụm πνεῦμα τῆς χάριτος
  choice: Thánh Linh ban ân điển
  alternative: Thần Linh của ân điển
  rationale: Cách chọn chính văn rõ nghĩa và tự nhiên trong tiếng Việt, trong khi chú thích giữ cấu trúc sở hữu sát chữ để không loại bỏ sắc thái mô tả.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh chị em” để biểu đạt số nhiều của δοκεῖτε mà không áp đặt giới tính; câu hỏi tu từ kết bằng dấu chấm than để truyền sức cảnh báo. Dấu gạch ngang giúp làm rõ mệnh đề quan hệ mà vẫn giữ liên hệ cú pháp với người phạm tội.
