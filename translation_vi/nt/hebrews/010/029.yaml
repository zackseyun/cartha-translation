    rationale: Cách này khả dĩ về ý nghĩa, nhưng nguyên văn không trực tiếp nêu chức năng “ban.” “Thánh Linh của ân điển” bảo toàn cấu trúc và độ mở của thuộc cách.
  - severity: low
    issue: Dấu chấm than làm yếu dạng câu hỏi trực tiếp của δοκεῖτε.
    rationale: Câu Hy Lạp là câu hỏi tu từ; dấu hỏi phản ánh hình thức này rõ hơn.
