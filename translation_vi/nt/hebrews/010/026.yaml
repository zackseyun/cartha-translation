id: HEB.10.26
reference: Hebrews 10:26
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἑκουσίως γὰρ ἁμαρτανόντων ἡμῶν μετὰ τὸ λαβεῖν τὴν ἐπίγνωσιν τῆς ἀληθείας, οὐκέτι περὶ ἁμαρτιῶν ἀπολείπεται θυσία,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/026.yaml
  text: For if we go on sinning deliberately after receiving the knowledge of the truth[a], there no longer remains a sacrifice for sins,
translation:
  language: vi
  text: Vì nếu chúng ta cứ cố ý phạm tội sau khi đã nhận biết chân lý[a], thì không còn sinh tế nào dành cho tội lỗi nữa,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đã nhận biết đầy đủ chân lý.” Từ Hy Lạp có thể mang sắc thái nhận biết đầy đủ hoặc dứt khoát hơn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἑκουσίως
  choice: cố ý
  rationale: Diễn đạt rõ tính chủ ý, tự nguyện của hành động bằng tiếng Việt hiện đại, không mang sắc thái pháp lý quá nặng.
- source_word: γὰρ
  choice: Vì
  rationale: Giữ quan hệ giải thích với lập luận ngay trước đó.
- source_word: ἁμαρτανόντων ἡμῶν
  choice: nếu chúng ta cứ ... phạm tội
  rationale: Cấu trúc điều kiện giúp chuyển ngữ cụm tuyệt đối sở hữu cách tự nhiên; từ “cứ” thể hiện phương diện tiếp diễn của phân từ hiện tại, thay vì một hành vi đơn lẻ.
- source_word: μετὰ τὸ λαβεῖν
  choice: sau khi đã nhận biết
  rationale: “Sau khi đã” giữ rõ trình tự thời gian và tính có trước của việc tiếp nhận sự nhận biết; trong tiếng Việt, “nhận biết” kết hợp tự nhiên với đối tượng “chân lý”.
- source_word: ἐπίγνωσιν
  choice: nhận biết
  rationale: Truyền đạt ý có được sự hiểu biết/nhận thức về chân lý mà không tự động xác định đó là kinh nghiệm tái sinh; sắc thái hiểu biết đầy đủ hơn được giữ trong chú thích.
- source_word: τῆς ἀληθείας
  choice: chân lý
  rationale: Cách nói trang trọng, tự nhiên trong văn cảnh tôn giáo, giữ nguyên phạm vi quy chiếu mà không thêm từ “Tin Lành” vốn không hiện diện trong câu.
- source_word: οὐκέτι
  choice: không còn ... nữa
  rationale: Diễn đạt tự nhiên sự chấm dứt hoặc không còn tồn tại kể từ thời điểm ấy.
- source_word: περὶ ἁμαρτιῶν
  choice: dành cho tội lỗi
  rationale: Trong văn cảnh tế lễ, cụm này chỉ sinh tế liên quan đến hoặc nhằm xử lý tội lỗi; “dành cho” tự nhiên và tránh hàm ý sinh tế được dâng cho tội lỗi.
- source_word: ἀπολείπεται
  choice: còn
  rationale: Cấu trúc “không còn ... nào ... nữa” chuyển tải tự nhiên ý ‘còn lại’ trong tiếng Việt.
- source_word: θυσία
  choice: sinh tế
  rationale: Thuật ngữ trang trọng, chính xác cho lễ vật hiến tế và phù hợp với lập luận tế lễ xuyên suốt thư Hê-bơ-rơ.
theological_decisions:
- issue: Phương diện và sức nặng mục vụ-thần học của ἁμαρτανόντων
  choice: 'Dịch là hành động tiếp diễn: “nếu chúng ta cứ cố ý phạm tội”, không phải một lần phạm tội có chủ ý.'
  alternative: “nếu chúng ta cố ý phạm tội” hoặc “nếu chúng ta phạm tội cách cố tình”
  rationale: Phân từ hiện tại tự nhiên gợi hành động tiếp tục hoặc dai dẳng. Cách dịch giữ nguyên tính nghiêm trọng của lời cảnh báo nhưng không biến nó thành lời khẳng định về bất kỳ một tội đơn lẻ nào sau khi biết chân lý.
- issue: Hàm ý thần học của ἐπίγνωσις
  choice: Dùng “nhận biết chân lý” trong chính văn, không xác định đây nhất thiết là sự tái sinh hay sự cứu rỗi.
  alternative: “nhận biết đầy đủ chân lý” hoặc “có sự nhận biết cứu rỗi về chân lý”
  rationale: Bản văn nói họ đã tiếp nhận sự nhận biết chân lý nhưng không định nghĩa rõ chiều sâu kinh nghiệm thần học ấy. Cách dịch không phân xử tranh luận về căn tính cứu rỗi của đối tượng được cảnh báo.
- issue: Ý nghĩa của việc “không còn sinh tế”
  choice: Giữ lời tuyên bố tuyệt đối của câu mà không chú giải ngay trong chính văn vì sao không còn sinh tế.
  alternative: Diễn giải thành “không còn một sinh tế nào khác có thể chuộc tội”
  rationale: Cách diễn giải thay thế có thể phù hợp với mạch thư nhưng thêm các ý “khác” và “có thể chuộc” không được phát biểu trực tiếp trong câu này; bản dịch giữ sức căng của nguyên văn.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. “Cứ cố ý phạm tội” làm rõ tính tiếp diễn và chủ ý; “sinh tế” duy trì ngôn ngữ tế lễ đặc trưng của thư Hê-bơ-rơ. Dấu phẩy cuối câu được giữ vì câu Hy Lạp và bản tham chiếu tiếp tục sang câu kế.
