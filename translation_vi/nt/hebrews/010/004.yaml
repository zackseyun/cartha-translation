id: HEB.10.4
reference: Hebrews 10:4
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀδύνατον γὰρ αἷμα ταύρων καὶ τράγων ἀφαιρεῖν ἁμαρτίας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/004.yaml
  text: For it is impossible for the blood of bulls and goats to take away sins[a].
translation:
  language: vi
  text: Vì huyết của bò đực và dê đực không thể cất bỏ tội lỗi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “loại bỏ tội lỗi.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀδύνατον
  choice: không thể
  rationale: Tính từ vị ngữ đi với động từ nguyên mẫu; cách diễn đạt “không thể cất bỏ” tự nhiên trong tiếng Việt và giữ nguyên sức khẳng định tuyệt đối.
- source_word: γὰρ
  choice: Vì
  rationale: Liên từ nêu lý do, nối câu này với lập luận ngay trước đó.
- source_word: αἷμα
  choice: huyết
  rationale: Giữ hình ảnh máu hiến tế vốn là trọng tâm của lập luận. “Huyết” là từ trang trọng, quen thuộc trong văn cảnh Kinh Thánh.
- source_word: ταύρων
  choice: của bò đực
  rationale: Giữ rõ nghĩa giống đực của danh từ Hy Lạp và quan hệ sở hữu với “huyết”.
- source_word: τράγων
  choice: và dê đực
  rationale: τράγος chỉ dê đực; dịch rõ giới tính phù hợp với ngôn ngữ tế lễ mà vẫn tự nhiên.
- source_word: ἀφαιρεῖν
  choice: cất bỏ
  rationale: Diễn đạt hành động lấy đi hoặc loại bỏ, giữ sắc thái cụ thể của động từ Hy Lạp mà không thêm một cơ chế thần học.
- source_word: ἁμαρτίας
  choice: tội lỗi
  rationale: Trong tiếng Việt, “tội lỗi” có thể chỉ các tội nói chung và truyền đạt tự nhiên danh từ số nhiều của nguyên văn.
theological_decisions:
- issue: Hiệu lực của huyết sinh tế trong lập luận của thư Hê-bơ-rơ
  choice: Chỉ khẳng định rằng huyết bò đực và dê đực không thể cất bỏ tội lỗi.
  alternative: Giải thích rằng các sinh tế chỉ che phủ tội lỗi tạm thời hoặc chỉ đem lại sự thanh sạch về nghi lễ.
  rationale: Nguyên văn không nêu các cách giải thích ấy trong câu này. Bản dịch giữ lời khẳng định trực tiếp và để nguyên sự căng thẳng thần học trong mạch văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “huyết” để giữ sắc thái tế lễ; dùng “bò đực và dê đực” để phản ánh chính xác các danh từ Hy Lạp.
