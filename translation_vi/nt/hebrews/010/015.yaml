  text: μαρτυρεῖ δὲ ἡμῖν καὶ τὸ πνεῦμα τὸ ἅγιον, μετὰ γὰρ τὸ ⸀εἰρηκέναι·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/015.yaml
  text: And the Holy Spirit also testifies to us[a]; for after saying,
translation:
  language: vi
  text: 'Đức Thánh Linh cũng làm chứng cho chúng ta; vì sau khi phán:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μαρτυρεῖ
  choice: làm chứng
  rationale: Diễn đạt tự nhiên trong tiếng Việt hiện đại, đồng thời giữ sắc thái chứng nhân/chứng thực của động từ μαρτυρέω.
- source_word: δὲ
  choice: (không dịch riêng)
  rationale: δέ là từ nối nhẹ, tiếp nối lập luận; trong tiếng Việt, mạch văn tự nhiên không nhất thiết cần một liên từ riêng ở đây.
- source_word: ἡμῖν
  choice: cho chúng ta
  rationale: Giữ đối tượng tiếp nhận lời chứng theo cách kết hợp tự nhiên với “làm chứng” trong tiếng Việt.
- source_word: καὶ
  choice: cũng
  rationale: 'Thể hiện rõ ý bổ sung: Đức Thánh Linh là một chứng nhân thêm vào lập luận đang được trình bày.'
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: Đức Thánh Linh
  rationale: Danh xưng chuẩn, trang trọng và phổ biến trong tiếng Việt hiện đại, chỉ đích danh Thánh Linh.
- source_word: μετὰ γὰρ τὸ εἰρηκέναι
  choice: vì sau khi phán rằng
  rationale: Giữ quan hệ nguyên nhân do γάρ và trình tự thời gian của cấu trúc μετά với động từ nguyên mẫu có mạo từ. “Phán” phù hợp với lời được Đức Thánh Linh tuyên bố trong phần trích dẫn tiếp theo; không thêm đại từ chủ ngữ để giữ sự cô đọng và độ hàm ẩn của tiếng Hy Lạp.
theological_decisions:
- issue: Tác nhân mang tính ngôi vị của Đức Thánh Linh trong hành động làm chứng
  choice: Đức Thánh Linh cũng làm chứng cho chúng ta
  alternative: Đức Thánh Linh cũng chứng thực cho chúng ta
  rationale: Câu Hy Lạp trình bày Đức Thánh Linh là chủ thể chủ động làm chứng. Bản dịch giữ nguyên tác nhân ngữ pháp này mà không giải thích thêm theo một hệ phái.
- issue: Chủ thể hàm ẩn của εἰρηκέναι
  choice: sau khi phán rằng
  alternative: sau khi Ngài đã phán
  rationale: Tiếng Hy Lạp không nêu lại chủ thể của động từ nguyên mẫu; ngữ cảnh hướng về Đức Thánh Linh. Không thêm “Ngài” giúp bảo toàn sự cô đọng và phần nào tính hàm ẩn của nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Thánh Linh” theo cách gọi phổ biến; “phán” duy trì sắc thái lời tuyên bố có thẩm quyền. Dấu hai chấm báo trước phần trích dẫn tiếp nối ở câu sau.
