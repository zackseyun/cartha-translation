  source_fidelity: 'Bản chính truyền đạt đúng ý của SBLGNT: người nhận thư đã liên đới trong đau khổ với những người bị giam cầm, vui lòng chịu việc tài sản bị cưỡng đoạt, vì biết mình có một tài sản tốt hơn và bền vững. Không thêm cụm “trên trời” vào bản văn chính.'
