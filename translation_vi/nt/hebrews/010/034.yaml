reference: Hebrews 10:34
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ γὰρ τοῖς ⸀δεσμίοις συνεπαθήσατε, καὶ τὴν ἁρπαγὴν τῶν ὑπαρχόντων ὑμῶν μετὰ χαρᾶς προσεδέξασθε, γινώσκοντες ἔχειν ⸀ἑαυτοὺς κρείττονα ⸀ὕπαρξιν καὶ μένουσαν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/034.yaml
  text: For you also suffered together with the prisoners[a], and you accepted with joy the plundering of your possessions[b], knowing that you yourselves have a better and lasting possession.
translation:
  language: vi
  text: Vì anh chị em đã cùng chịu khổ với những người bị giam cầm[a], và đã vui mừng chấp nhận việc tài sản của mình bị cướp đoạt, vì biết rằng chính anh chị em có một tài sản tốt hơn và còn mãi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Một số thủ bản chép “đã cảm thông với cảnh xiềng xích của tôi” thay cho “đã cùng chịu khổ với những người bị giam cầm”. Động từ Hy Lạp cũng có thể dịch là “đã cảm thông với”.
    reason: textual_variant_and_lexical_alternative
  - marker: b
    text: 'Một số thủ bản có cách đọc dài hơn: “biết rằng mình có trên trời một tài sản tốt hơn và còn mãi”.'
    reason: textual_variant
lexical_decisions:
- source_word: δεσμίοις
  choice: những người bị giam cầm
  rationale: Danh từ chỉ những người đang bị xiềng xích hoặc cầm tù. Cách diễn đạt này tự nhiên trong tiếng Việt và không hàm ý họ là tội phạm theo nghĩa đạo đức.
- source_word: συνεπαθήσατε
  choice: đã cùng chịu khổ với
  rationale: Động từ có thể chỉ sự cảm thông, nhưng tiền tố σύν- và ngữ cảnh bách hại nhấn mạnh sự liên đới có trả giá, chứ không chỉ là cảm xúc thương xót từ xa.
- source_word: ἁρπαγήν
  choice: việc ... bị cướp đoạt
  rationale: Từ này diễn tả hành động chiếm lấy bằng sức mạnh hoặc bất công. “Bị cướp đoạt” giữ được sắc thái mạnh hơn “bị tịch thu”.
- source_word: τῶν ὑπαρχόντων ὑμῶν
  choice: tài sản của mình
  rationale: Cụm phân từ được dùng như danh từ để chỉ của cải, những gì thuộc về người đọc. Đại từ “mình” quy chiếu tự nhiên về chủ ngữ “anh chị em”.
- source_word: μετὰ χαρᾶς προσεδέξασθε
  choice: đã vui mừng chấp nhận
  rationale: Cách dịch giữ cả thái độ vui mừng lẫn hành động chấp nhận biến cố, nhưng không gợi rằng họ tán thành sự bất công.
- source_word: γινώσκοντες
  choice: vì biết rằng
  rationale: 'Phân từ mang sắc thái nguyên nhân trong ngữ cảnh: họ có thể vui mừng chấp nhận mất mát vì biết mình có tài sản tốt hơn.'
- source_word: ἑαυτοὺς ἔχειν
  choice: chính anh chị em có
  rationale: “Chính” thể hiện sắc thái nhấn mạnh của đại từ phản thân ἑαυτούς mà vẫn tự nhiên trong tiếng Việt.
- source_word: κρείττονα
  choice: tốt hơn
  rationale: Giữ cách so sánh đơn giản và phù hợp với mô-típ “tốt hơn” lặp lại trong thư Hê-bơ-rơ.
- source_word: ὕπαρξιν
  choice: một tài sản
  rationale: Danh từ số ít chỉ điều thuộc quyền sở hữu, ở đây tương phản với tài sản trần thế vừa bị cướp đoạt. “Tài sản” giữ liên hệ từ vựng với τῶν ὑπαρχόντων mà không tự ý giải nghĩa thành phần thưởng hay cơ nghiệp.
- source_word: μένουσαν
  choice: còn mãi
  rationale: Diễn đạt tính bền vững, không mất đi của tài sản ấy bằng tiếng Việt hiện đại, tự nhiên.
theological_decisions:
- issue: Mức độ liên đới với những người bị giam cầm
  choice: Dịch là “đã cùng chịu khổ với” để thể hiện sự dự phần có trả giá vào nỗi khổ của họ.
  alternative: “đã cảm thông với” hoặc “đã thương xót” những người bị giam cầm.
  rationale: συμπαθέω có thể nói đến sự cảm thông, nhưng cấu tạo của từ và bối cảnh Hê-bơ-rơ 10:32–34 phù hợp với sự liên đới thực tế. Bản dịch không giới hạn hành động này ở một cảm xúc nội tâm.
- issue: Bản chất của “tài sản tốt hơn và còn mãi”
  choice: Giữ cách nói khái quát của bản văn, không xác định đó là thiên đàng, sự cứu rỗi, phần thưởng hay cơ nghiệp.
  alternative: “một tài sản tốt hơn trên trời” hoặc “một cơ nghiệp tốt hơn”.
  rationale: Bản văn SBLGNT không có cụm “trên trời” tại đây. Dù ý nghĩa cánh chung có thể được suy ra và một số chứng cứ thủ bản làm rõ theo hướng ấy, bản dịch chính không thêm điều văn bản đang dùng không nói rõ.
translation_notes:
  register: Dùng văn phong trang trọng nhưng hiện đại. “Anh chị em” diễn đạt số nhiều và tính cộng đồng của ὑμεῖς; “cùng chịu khổ”, “bị cướp đoạt” và “còn mãi” là những cách nói phổ thông, rõ nghĩa. Câu giữ sự tương phản giữa tài sản trần thế bị mất và tài sản tốt hơn, bền vững, nhưng không giải quyết thay cho độc giả bản chất chính xác của tài sản ấy.
