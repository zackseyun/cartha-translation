  text: μιᾷ γὰρ προσφορᾷ τετελείωκεν εἰς τὸ διηνεκὲς τοὺς ἁγιαζομένους.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/014.yaml
  text: For by one offering he has perfected for all time those who are being sanctified[a].
translation:
  language: vi
  text: Vì nhờ một lễ vật, Ngài đã làm cho những người đang được thánh hóa trở nên trọn vẹn mãi mãi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “những người đang được nên thánh.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: μιᾷ
  choice: chỉ bằng một
  rationale: Dạng số ít bổ nghĩa cho προσφορᾷ; cách dịch này nhấn mạnh tính duy nhất của lễ vật trong mạch lập luận.
- source_word: γὰρ
  choice: Vì
  rationale: Giữ chức năng giải thích, nêu cơ sở cho lập luận ngay trước đó.
- source_word: προσφορᾷ
  choice: lễ vật
  rationale: Diễn đạt vật được dâng lên Đức Chúa Trời mà không thu hẹp nghĩa thành một loại sinh tế cụ thể; bối cảnh hiến tế vẫn rõ.
- source_word: τετελείωκεν
  choice: đã làm ... trở nên trọn vẹn
  rationale: Thể hoàn thành chỉ hành động đã hoàn tất với kết quả còn hiệu lực; cách diễn đạt tự nhiên này giữ được ý nghĩa của τελειόω.
- source_word: εἰς τὸ διηνεκές
  choice: mãi mãi
  rationale: Thành ngữ chỉ hiệu lực bền vững, không chấm dứt; đặt sau bổ ngữ để câu tiếng Việt tự nhiên.
- source_word: τοὺς ἁγιαζομένους
  choice: những người đang được thánh hóa
  rationale: Phân từ hiện tại bị động được giữ bằng “đang được,” qua đó bảo toàn sắc thái tiến triển và tác động thụ động.
theological_decisions:
- issue: Mối liên hệ giữa sự làm cho trọn vẹn đã hoàn tất và sự thánh hóa đang diễn ra
  choice: Giữ đồng thời “đã làm ... trở nên trọn vẹn” và “đang được thánh hóa.”
  alternative: Diễn giải toàn bộ theo nghĩa địa vị đã hoàn tất, hoặc làm yếu đi kết quả đã hoàn tất để nhấn mạnh riêng tiến trình.
  rationale: Câu Hy Lạp chủ ý đặt cạnh nhau động từ hoàn thành τετελείωκεν và phân từ hiện tại bị động ἁγιαζομένους; bản dịch không hóa giải sức căng thần học này.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại. Dùng “Ngài” vì chủ thể được suy ra từ văn cảnh chứ không được nêu trực tiếp trong câu Hy Lạp; tránh thêm danh xưng thần học không có trong câu. “Trọn vẹn” phù hợp văn mạch thư Hê-bơ-rơ và dễ hiểu hơn cách nói quá chuyên môn.
