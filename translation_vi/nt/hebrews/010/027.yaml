  source_fidelity: Bản thảo giữ được tương phản của δέ, sự phán xét, tính sắp xảy ra của μέλλοντος, và hình ảnh lửa thiêu nuốt các kẻ đối nghịch. Tuy nhiên, “chỉ còn phải” thêm ý ‘chỉ còn’ và chuyển φοβερὰ ἐκδοχὴ từ một viễn cảnh/sự chờ đợi đáng kinh khiếp thành tâm trạng chủ thể ‘phải kinh hãi chờ đợi’. Ý thứ nhất có thể được gợi bởi văn mạch câu trước, nhưng không nằm trong mệnh đề Hy Lạp này; ý thứ hai không giữ đúng phạm vi bổ nghĩa của φοβερὰ.
  naturalness: “Một sự chờ đợi đáng kinh khiếp về sự phán xét” là cách danh từ hóa trang trọng, tự nhiên và đủ rõ trong văn phong Kinh Thánh hiện đại. “Ngọn lửa hừng hực sắp thiêu nuốt” vẫn là một hình ảnh mạnh, tự nhiên.
  terminology: “Sự phán xét,” “ngọn lửa hừng hực,” “thiêu nuốt,” và “những kẻ chống nghịch” phù hợp với sắc thái tư pháp, cảnh báo, và đối nghịch của bản văn. Không cần áp đặt giải thích về bản chất hoặc thời hạn của sự phán xét.
