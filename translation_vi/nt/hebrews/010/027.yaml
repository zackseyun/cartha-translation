source:
  edition: SBLGNT
  text: φοβερὰ δέ τις ἐκδοχὴ κρίσεως καὶ πυρὸς ζῆλος ἐσθίειν μέλλοντος τοὺς ὑπεναντίους.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/027.yaml
  text: but a fearful expectation of judgment[a], and a fury of fire about to consume the adversaries.
translation:
  language: vi
  text: nhưng là một sự chờ đợi đáng kinh khiếp về sự phán xét[a], cùng ngọn lửa hừng hực sắp thiêu nuốt những kẻ chống nghịch.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc dịch: “một viễn cảnh đáng kinh khiếp về sự phán xét, và ngọn lửa hừng hực sắp thiêu nuốt những kẻ chống nghịch.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: φοβερὰ … ἐκδοχὴ
  choice: phải kinh hãi chờ đợi
  rationale: Diễn đạt tự nhiên trong tiếng Việt ý ‘một sự chờ đợi đáng kinh khiếp’, đồng thời giữ nguyên sức nặng của lời cảnh báo.
- source_word: δέ
  choice: nhưng
  rationale: Thể hiện sự tương phản với mệnh đề phủ định ở câu trước.
- source_word: τις
  choice: chỉ còn
  rationale: Trong ngữ cảnh, đại từ bất định góp phần nêu lên viễn cảnh duy nhất còn lại; tiếng Việt không cần dịch máy móc là ‘một sự nào đó’.
- source_word: κρίσεως
  choice: sự phán xét
  rationale: Giữ nghĩa tư pháp rộng của κρίσις, không thu hẹp thành một kết luận thần học cụ thể hơn câu văn.
- source_word: πυρὸς ζῆλος
  choice: ngọn lửa hừng hực
  rationale: Chuyển hình ảnh cô đọng về sức nóng dữ dội, đầy mãnh lực của lửa sang cách nói tự nhiên mà vẫn sống động trong tiếng Việt.
- source_word: ἐσθίειν
  choice: thiêu nuốt
  rationale: Kết hợp hình ảnh lửa với nghĩa ‘ăn nuốt, tiêu diệt’ của động từ, mạnh hơn ‘thiêu cháy’ nhưng vẫn trang trọng.
- source_word: μέλλοντος
  choice: sắp
  rationale: Giữ sắc thái điều đang đến gần của μέλλω.
- source_word: τοὺς ὑπεναντίους
  choice: những kẻ chống nghịch
  rationale: Diễn tả những người đứng ở thế đối nghịch, giữ sắc thái trang trọng và mạnh của từ Hy Lạp.
theological_decisions:
- issue: Bản chất của hình ảnh phán xét bằng lửa
  choice: Giữ nguyên hình ảnh ngọn lửa sắp thiêu nuốt những kẻ chống nghịch.
  alternative: Giải thích rõ đây là hình phạt đời đời hoặc làm nhẹ thành một ẩn dụ chung về hậu quả.
  rationale: Câu này khẳng định nghiêm khắc về sự phán xét nhưng không tự giải thích mọi chi tiết về bản chất hay thời hạn của hình phạt; bản dịch không bổ sung một hệ thống giáo lý vượt quá câu văn.
- issue: Sắc thái của πυρὸς ζῆλος
  choice: ngọn lửa hừng hực
  alternative: lòng sốt sắng của lửa; cơn thịnh nộ của lửa
  rationale: ‘Lòng sốt sắng’ quá khó hiểu trong tiếng Việt, còn ‘cơn thịnh nộ’ xác định cảm xúc rõ hơn cấu trúc Hy Lạp. ‘Ngọn lửa hừng hực’ giữ được cường độ và hình ảnh mà không quyết định quá mức.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cụm “phải kinh hãi chờ đợi” ưu tiên cú pháp tiếng Việt tự nhiên hơn lối danh từ hóa sát chữ; “thiêu nuốt” giữ hình ảnh mạnh của động từ Hy Lạp.
