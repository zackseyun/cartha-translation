    rationale: Nguyên văn mở đầu bằng καὶ và câu này tiếp nối lời hứa được trích dẫn. Thêm “Và” là an toàn, trung thành với nguồn, và vẫn tự nhiên trong văn cảnh Kinh Thánh.
  - severity: medium
    issue: “Những việc trái luật” có thể gợi chủ yếu việc trái một bộ luật cụ thể và chưa diễn đạt đầy đủ sắc thái ἀνομίαι.
    rationale: ἀνομίαι nói đến các hành vi/vấn đề trái luật pháp, tức lawless deeds. “Những việc làm trái luật pháp” rõ nghĩa hơn trong tiếng Việt hiện đại.
