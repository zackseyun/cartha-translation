  rationale: Bản sửa khôi phục liên từ καὶ, diễn đạt rõ hơn lực nhấn của οὐ μή mà vẫn giữ cấu trúc “không còn ... nữa” cho ἔτι, và thay “những việc trái luật” bằng cách nói tự nhiên, chính xác hơn cho ἀνομίαι. Đại từ “Ta” và động từ “nhớ” được giữ nguyên để bảo toàn giọng lời hứa giao ước và thành ngữ thần học của nguyên văn.
