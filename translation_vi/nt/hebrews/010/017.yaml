base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/017.yaml
  text: and I will no longer remember their sins and their lawless deeds[a][b].
translation:
  language: vi
  text: Và Ta nhất định sẽ không còn nhớ đến tội lỗi và những việc làm trái luật pháp của họ nữa.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát hơn: “Và Ta chắc chắn sẽ không nhớ đến tội lỗi và những việc làm trái luật pháp của họ nữa.”'
    reason: lexical_alternative
  - marker: b
    text: “Những việc làm trái luật pháp” dịch từ ἀνομίαι, cũng có thể dịch là “những hành vi vô luật pháp” hoặc, theo cách dịch truyền thống, là “những điều bất chính.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Lược trong câu tiếng Việt
  rationale: Liên từ này nối tiếp lời trích dẫn ở câu trước. Khi câu được trình bày độc lập theo tham chiếu từng câu, mở đầu bằng “Và” kém tự nhiên trong tiếng Việt; quan hệ tiếp nối vẫn rõ từ văn cảnh.
- source_word: τῶν ἁμαρτιῶν αὐτῶν
  choice: tội lỗi ... của họ
  rationale: Diễn đạt trực tiếp danh từ số nhiều ἁμαρτίαι theo cách dùng phổ thông, trang trọng và quen thuộc trong tiếng Việt.
- source_word: καὶ τῶν ἀνομιῶν αὐτῶν
  choice: và những việc trái luật của họ
  rationale: ἀνομία chỉ sự vô luật pháp hoặc hành vi vi phạm luật. “Những việc trái luật” truyền đạt nghĩa cụ thể của dạng số nhiều mà không dùng từ cổ hoặc khó hiểu như “gian ác” hay “bất pháp”.
- source_word: οὐ μὴ μνησθήσομαι ... ἔτι
  choice: Ta sẽ không còn nhớ đến ... nữa
  rationale: Cấu trúc “không còn ... nữa” diễn đạt tự nhiên ἔτι đi với phủ định; “sẽ” và toàn mệnh đề phủ định truyền đạt lời cam kết dứt khoát của οὐ μή. Giữ động từ “nhớ” thay vì diễn giải thần học.
theological_decisions:
- issue: Đức Chúa Trời không nhớ đến tội lỗi
  choice: Giữ nguyên cách nói “Ta sẽ không còn nhớ đến” như lời hứa giao ước.
  alternative: “Ta chắc chắn sẽ không nhớ đến ... nữa” hoặc diễn giải là “Ta sẽ không kể tội họ nữa.”
  rationale: Nguyên văn dùng thành ngữ về sự ghi nhớ của Đức Chúa Trời. Bản dịch giữ nguyên sức căng thần học, không biến câu này thành khẳng định rằng Đức Chúa Trời mất tri thức, cũng không thu hẹp ý nghĩa thành một cách giải thích giáo lý riêng.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng đại từ “Ta” phù hợp với lời Đức Chúa Trời đang phán trong lời trích dẫn. Cấu trúc gộp sở hữu “tội lỗi và những việc trái luật của họ” tự nhiên hơn việc lặp lại “của họ” sau mỗi danh từ.
