  text: φοβερὸν τὸ ἐμπεσεῖν εἰς χεῖρας θεοῦ ζῶντος.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/031.yaml
  text: It is a fearful thing to fall into the hands of the living God[a].
translation:
  language: vi
  text: Thật đáng sợ khi rơi vào tay Đức Chúa Trời hằng sống.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Thật kinh khiếp khi rơi vào tay Đức Chúa Trời hằng sống.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: φοβερὸν
  choice: thật đáng kinh
  rationale: Tính từ vị ngữ diễn tả điều gây sợ hãi, kinh khiếp. Cách nói này giữ được sức nặng trang nghiêm của lời cảnh báo và tự nhiên trong tiếng Việt; “thật kinh khủng” là phương án mạnh, trực tiếp hơn.
- source_word: τὸ ἐμπεσεῖν
  choice: khi rơi
  rationale: Mạo từ đi với động từ nguyên mẫu aorist khiến hành động được danh từ hóa. Tiếng Việt diễn đạt tự nhiên bằng “khi rơi”, không làm yếu sắc thái rơi vào quyền lực của người khác.
- source_word: εἰς χεῖρας
  choice: vào tay
  rationale: Giữ nguyên hình ảnh Kinh Thánh chỉ việc rơi vào quyền lực hoặc sự phán xét của một người. “Vào tay” là thành ngữ tự nhiên trong tiếng Việt và không cần thêm từ “phán xét” vốn không hiện diện trực tiếp trong câu Hy Lạp.
- source_word: θεοῦ
  choice: Đức Chúa Trời
  rationale: Danh từ sở hữu phụ thuộc vào “tay”. “Đức Chúa Trời” là cách gọi trang trọng, rõ nghĩa và quen thuộc trong văn phong Kinh Thánh tiếng Việt.
- source_word: ζῶντος
  choice: hằng sống
  rationale: Phân từ hiện tại bổ nghĩa cho θεοῦ, tạo thành danh xưng “Đức Chúa Trời hằng sống”. Cách dịch này giữ ý Ngài thực sự sống và đang hành động, đồng thời tự nhiên trong ngữ vực Kinh Thánh tiếng Việt.
theological_decisions:
- issue: Sức nặng của lời cảnh báo
  choice: Một lời tuyên bố tổng quát, nghiêm trọng về nỗi kinh khiếp khi rơi vào quyền xét xử của Đức Chúa Trời hằng sống
  alternative: Chỉ nói về sự sửa phạt tạm thời, hoặc là một phát biểu hiện sinh không mang hàm ý phán xét
  rationale: Trong văn cảnh, câu này kết thúc một phân đoạn cảnh báo; thành ngữ “rơi vào tay” thường hàm ý bị đặt dưới quyền xét xử. Bản dịch giữ nguyên sức nặng ấy nhưng không chèn trực tiếp “sự phán xét”, vì tiếng Hy Lạp truyền đạt điều đó qua thành ngữ chứ không dùng một danh từ minh nhiên.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và dễ hiểu. Giữ hình ảnh “vào tay” cùng danh xưng Kinh Thánh “Đức Chúa Trời hằng sống”; dùng “thật đáng kinh” để bảo toàn sắc thái sợ hãi sâu sắc mà không diễn giải quá mức.
