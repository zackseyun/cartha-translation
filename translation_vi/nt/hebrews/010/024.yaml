  text: καὶ κατανοῶμεν ἀλλήλους εἰς παροξυσμὸν ἀγάπης καὶ καλῶν ἔργων,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/024.yaml
  text: and let us consider one another[a], to stir up love and good works,
translation:
  language: vi
  text: Và chúng ta hãy lưu tâm đến nhau, để thúc giục nhau[a] yêu thương và làm những việc tốt lành.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “khơi dậy lòng yêu thương và những việc tốt lành” hoặc “kích động nhau yêu thương và làm việc lành”. Danh từ Hy Lạp παροξυσμός có thể chỉ một sự thúc đẩy hay kích động mạnh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατανοῶμεν
  choice: chúng ta hãy quan tâm đến
  rationale: 'Động từ ở thể giả định hiện tại, ngôi thứ nhất số nhiều, mang sắc thái khích lệ: cùng nhau chú tâm và suy xét kỹ. “Hãy quan tâm đến” tự nhiên trong tiếng Việt hiện đại và giữ hướng chú ý đến người khác.'
- source_word: ἀλλήλους
  choice: nhau
  rationale: Đại từ tương hỗ được dịch trực tiếp là “nhau”, phù hợp với lời khuyên dành cho cộng đồng.
- source_word: εἰς
  choice: để
  rationale: Trong cấu trúc này, giới từ diễn tả mục đích hoặc kết quả; “để” thể hiện tự nhiên quan hệ ấy trong tiếng Việt.
- source_word: παροξυσμὸν
  choice: thúc giục
  rationale: Danh từ này chỉ sự kích thích hoặc tác động mạnh khiến người khác hành động. “Thúc giục” giữ được sức mạnh của từ mà không tạo sắc thái thù địch không phù hợp với các mục tiêu tích cực theo sau.
- source_word: ἀγάπης
  choice: yêu thương
  rationale: Dịch ἀγάπη bằng động từ “yêu thương” trong cấu trúc tiếng Việt tự nhiên “thúc giục nhau yêu thương”, vẫn giữ nội dung về tình yêu được bày tỏ trong cộng đồng.
- source_word: καλῶν ἔργων
  choice: làm những việc tốt lành
  rationale: Cách diễn đạt bằng động từ tự nhiên trong tiếng Việt và phản ánh cả hành động lẫn phẩm chất tốt đẹp của καλῶν ἔργων, không hàm ý một hệ thống công đức riêng biệt.
- source_word: καὶ
  choice: và
  rationale: Giữ quan hệ nối kết với lời khuyên ở phần trước, đồng thời liên kết việc yêu thương với những việc tốt lành.
theological_decisions:
- issue: Sắc thái có thể tiêu cực của παροξυσμός
  choice: thúc giục nhau yêu thương và làm những việc tốt lành
  alternative: khơi dậy lòng yêu thương và những việc tốt lành; hoặc kích động nhau yêu thương và làm việc lành
  rationale: παροξυσμός có thể chỉ sự khiêu khích hoặc kích động mạnh, nhưng ở đây mục tiêu là tình yêu thương và việc lành. “Thúc giục” giữ sắc thái mạnh và tích cực theo ngữ cảnh, còn chú thích bảo lưu phạm vi nghĩa sắc hơn của từ Hy Lạp.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Câu được chuyển từ cấu trúc danh từ của tiếng Hy Lạp sang cấu trúc động từ tự nhiên trong tiếng Việt; từ “nhau” thứ hai làm rõ rằng sự thúc giục diễn ra giữa các thành viên trong cộng đồng.
