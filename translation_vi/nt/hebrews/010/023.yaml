id: HEB.10.23
reference: Hebrews 10:23
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: κατέχωμεν τὴν ὁμολογίαν τῆς ἐλπίδος ἀκλινῆ, πιστὸς γὰρ ὁ ἐπαγγειλάμενος·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/023.yaml
  text: Let us hold fast the confession of our hope without wavering[a], for the one who promised is faithful.
translation:
  language: vi
  text: Chúng ta hãy giữ vững lời tuyên xưng về niềm hy vọng[a], không dao động, vì Đấng đã hứa là thành tín.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “lời tuyên xưng về niềm hy vọng của chúng ta.” Tiếng Hy Lạp không nói rõ “của chúng ta.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατέχωμεν
  choice: Chúng ta hãy giữ vững
  rationale: Thể giả định hiện tại ngôi thứ nhất số nhiều mang ý khích lệ; cách dịch này tự nhiên trong tiếng Việt và diễn đạt việc tiếp tục nắm giữ cách kiên định.
- source_word: ὁμολογίαν
  choice: lời tuyên xưng
  rationale: Diễn đạt sự công khai xác nhận đức tin hay lòng trung thành, phù hợp với lời kêu gọi bền đỗ trong thư Hê-bơ-rơ.
- source_word: τῆς ἐλπίδος
  choice: về niềm hy vọng
  rationale: Cấu trúc sở hữu có thể chỉ nội dung của lời tuyên xưng. Bản dịch không thêm đại từ sở hữu vì nguyên văn không có từ tương đương với “của chúng ta”; chú thích nêu cách hiểu tự nhiên khác.
- source_word: ἀκλινῆ
  choice: không dao động
  rationale: Tính từ này mang nghĩa không nghiêng lệch hay lay chuyển; cụm trạng thái đặt sau đối tượng vừa tự nhiên vừa giữ sức mạnh của lời khuyên.
- source_word: πιστὸς
  choice: thành tín
  rationale: Giữ được cả nghĩa đáng tin cậy lẫn sắc thái thần học quen thuộc về sự trung tín của Đức Chúa Trời.
- source_word: ὁ ἐπαγγειλάμενος
  choice: Đấng đã hứa
  rationale: Phân từ có mạo từ được dùng như danh từ. “Đấng” phù hợp với ngữ vực trang trọng và ngầm chỉ Đức Chúa Trời mà không thêm danh xưng vốn không có trong nguyên văn.
theological_decisions:
- issue: Chủ thể ngầm của ὁ ἐπαγγειλάμενος
  choice: Dịch là “Đấng đã hứa”, để danh tính Đức Chúa Trời vẫn được hiểu ngầm như nguyên văn.
  alternative: “Đức Chúa Trời, Đấng đã hứa”
  rationale: Văn cảnh chỉ rõ Đức Chúa Trời, nhưng nguyên văn không nêu danh xưng; không thêm vào giúp tránh giải thích quá mức.
- issue: Đại từ sở hữu với “niềm hy vọng”
  choice: Không thêm “của chúng ta” trong chính văn.
  alternative: “lời tuyên xưng về niềm hy vọng của chúng ta”
  rationale: Tiếng Hy Lạp không có đại từ sở hữu. Tiếng Việt vẫn tự nhiên và dễ hiểu khi không thêm đại từ, đồng thời bảo toàn sự mơ hồ thực có của cấu trúc.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. “Giữ vững”, “không dao động” tạo lời khích lệ mạnh mẽ; “thành tín” duy trì sắc thái Kinh Thánh mà vẫn quen thuộc với độc giả phổ thông.
