  text: and a great priest over the house of God[b][a],
translation:
  language: vi
  text: và chúng ta có một vị tư tế cao trọng[a] cai quản nhà của Đức Chúa Trời[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “một thầy tế lễ thượng phẩm.” Thư Hê-bơ-rơ thường trình bày Chúa Giê-su là thầy tế lễ thượng phẩm, nhưng nguyên văn câu này nói “một vị tư tế cao trọng.”
    reason: alternative_reading
  - marker: b
    text: “Nhà của Đức Chúa Trời” cũng có thể mang nghĩa gia đình của Ngài, tức là dân của Ngài.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: và
  rationale: Liên từ nối cụm này với cấu trúc của các câu 19–21.
- source_word: ἱερέα
  choice: một vị tư tế
  rationale: ἱερεύς có nghĩa là “tư tế”; thêm “vị” để diễn đạt tự nhiên và trang trọng trong tiếng Việt, nhưng không biến từ này thành tước hiệu kỹ thuật “thầy tế lễ thượng phẩm”.
- source_word: μέγαν
  choice: cao trọng
  rationale: Diễn đạt sự lớn lao và địa vị nổi bật của vị tư tế, đồng thời giữ sự phân biệt với danh từ kỹ thuật ἀρχιερεύς.
- source_word: ἐπὶ
  choice: cai quản
  rationale: Trong kết cấu với đối cách ở đây, ἐπί biểu thị quyền quản trị hoặc trông coi; “cai quản” tự nhiên hơn cách dịch sát chữ “ở trên”.
- source_word: τὸν οἶκον
  choice: nhà
  rationale: Giữ hình ảnh Kinh Thánh của οἶκος, đồng thời chú thích nghĩa có thể bao gồm gia đình hay cộng đồng dân Chúa.
- source_word: τοῦ θεοῦ
  choice: của Đức Chúa Trời
  rationale: Sở hữu cách xác định ngôi nhà thuộc về Đức Chúa Trời.
theological_decisions:
- issue: Có nên dịch ἱερέα μέγαν thành tước hiệu kỹ thuật “thầy tế lễ thượng phẩm” hay không
  choice: một vị tư tế cao trọng
  alternative: một thầy tế lễ thượng phẩm
  rationale: Thư Hê-bơ-rơ thường trình bày Chúa Giê-su là thầy tế lễ thượng phẩm, nhưng câu này dùng ἱερεύς + μέγας, không dùng danh từ kỹ thuật ἀρχιερεύς. Bản dịch giữ nét chữ của nguyên ngữ và không lặng lẽ nhập tước hiệu từ ngữ cảnh rộng hơn.
- issue: Phạm vi nghĩa của “nhà Đức Chúa Trời”
  choice: giữ hình ảnh “nhà” trong chính văn
  alternative: gia đình hoặc dân của Đức Chúa Trời
  rationale: οἶκος có thể chỉ ngôi nhà hoặc hộ gia đình/cộng đồng. Giữ hình ảnh trong chính văn bảo tồn tính đa nghĩa và âm hưởng giao ước; chú thích nêu nghĩa cộng đồng.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. “Tư tế” giúp giữ trực tiếp danh từ ἱερεύς, còn “cao trọng” diễn đạt μέγαν mà không đồng nhất cụm này với tước hiệu kỹ thuật “thầy tế lễ thượng phẩm.”
