  source_fidelity: 'Bản nháp chuyển đạt đúng các thành tố chính: καὶ là liên từ nối tiếp; ἱερέα μέγαν được giữ khác với tước hiệu kỹ thuật ἀρχιερεύς; và ἐπὶ τὸν οἶκον τοῦ θεοῦ được diễn đạt là quyền trông coi/cai quản nhà Đức Chúa Trời. Việc thêm chủ ngữ “chúng ta” là phù hợp với cấu trúc tham chiếu từ câu trước và làm câu tiếng Việt hoàn chỉnh, tự nhiên hơn.'
