  terminology: Giữ “vị tư tế cao trọng” là thận trọng và trung thành với ἱερέα μέγαν. Giữ “nhà của Đức Chúa Trời” bảo tồn hình ảnh và độ mở nghĩa của οἶκος. Chú thích a nêu “thầy tế lễ thượng phẩm” như phương án thay thế là phù hợp, miễn không trình bày đó là nghĩa chữ của câu.
