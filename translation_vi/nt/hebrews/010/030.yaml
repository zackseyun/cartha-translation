revisions:
- from: 'Vì chúng ta biết Đấng đã phán: “Sự báo trả thuộc về Ta; chính Ta sẽ báo ứng,” và lại phán[a]: “Chúa sẽ xét xử dân Ngài.”'
  to: 'Vì chúng ta biết Đấng đã phán: “Sự báo trả thuộc về Ta; chính Ta sẽ báo ứng,” và lại[a]: “Chúa sẽ xét xử dân Ngài.”'
  rationale: Chỉ bỏ động từ “phán” được bổ sung ở công thức καὶ πάλιν và dời dấu neo chú thích để gắn trực tiếp với lời dẫn trích dẫn. Các lựa chọn còn lại đều trung thành với tiếng Hy Lạp, tự nhiên, và giữ sự mơ hồ có chủ ý của κρίνω.
  reviewer_model: gpt-5.6-terra
