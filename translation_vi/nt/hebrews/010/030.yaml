  - severity: low
    issue: Vị trí dấu neo chú thích.
    rationale: Chú thích giải thích lời trích dẫn Phục Truyền Luật Lệ Ký, đặc biệt công thức trích dẫn thứ hai; nên đặt ngay sau “và lại” thay vì sau động từ được thêm vào.
