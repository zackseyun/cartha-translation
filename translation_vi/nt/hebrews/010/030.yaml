language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οἴδαμεν γὰρ τὸν εἰπόντα· Ἐμοὶ ἐκδίκησις, ἐγὼ ⸀ἀνταποδώσω· καὶ πάλιν· ⸂Κρινεῖ κύριος⸃ τὸν λαὸν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/030.yaml
  text: For we know the one who said[a], “Vengeance is mine; I will repay,” and again[b], “The Lord will judge his people.”
translation:
  language: vi
  text: 'Vì chúng ta biết Đấng đã phán: “Sự báo trả thuộc về Ta; chính Ta sẽ báo ứng,” và lại[a]: “Chúa sẽ xét xử dân Ngài.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Lời trích dẫn gợi lại Phục Truyền Luật Lệ Ký 32:35–36. Trong văn cảnh nguyên thủy, “xét xử” có thể bao gồm cả trừng phạt lẫn minh oan; tại đây, văn cảnh cảnh báo nhấn mạnh sự phán xét của Đức Chúa Trời.
    reason: cross_reference
lexical_decisions:
- source_word: οἴδαμεν γὰρ
  choice: Vì chúng ta biết
  rationale: οἶδα mang nghĩa hiện tại trong tiếng Hy Lạp Koine; γάρ giữ quan hệ giải thích với lời cảnh báo ngay trước đó.
- source_word: τὸν εἰπόντα
  choice: Đấng đã phán
  rationale: Phân từ quá khứ dùng như danh từ, chỉ Đức Chúa Trời là Đấng phán lời Kinh Thánh; “Đấng” và “phán” giữ sắc thái trang trọng tự nhiên trong tiếng Việt.
- source_word: Ἐμοὶ ἐκδίκησις
  choice: Sự báo trả thuộc về Ta
  rationale: Cụm Hy Lạp tỉnh lược, sát nghĩa là “về Ta, sự báo trả”; cách dịch này biểu đạt quyền thi hành công lý thuộc về Đức Chúa Trời mà không giới hạn vào cảm xúc trả thù cá nhân.
- source_word: ἐγὼ ἀνταποδώσω
  choice: chính Ta sẽ báo ứng
  rationale: Đại từ ἐγώ được nêu rõ để nhấn mạnh chủ thể; “chính Ta” giữ sự nhấn mạnh ấy, còn “báo ứng” truyền đạt hành động đáp trả theo công lý.
- source_word: καὶ πάλιν
  choice: và lại phán
  rationale: “Và lại” giới thiệu trích dẫn thứ hai; bổ sung “phán” theo ngữ cảnh để câu tiếng Việt tự nhiên mà không đổi chủ thể.
- source_word: Κρινεῖ κύριος
  choice: Chúa sẽ xét xử
  rationale: κρίνω có thể bao gồm phán xét, phân xử hoặc minh oan; trong ngữ cảnh cảnh báo của Hê-bơ-rơ, “xét xử” giữ nghĩa tư pháp rộng mà không thu hẹp thành chỉ trừng phạt.
- source_word: τὸν λαὸν αὐτοῦ
  choice: dân Ngài
  rationale: Cách diễn đạt tự nhiên, trang trọng, giữ sắc thái dân thuộc giao ước của Đức Chúa Trời.
theological_decisions:
- issue: Phạm vi ý nghĩa của κρίνω trong lời trích Phục Truyền Luật Lệ Ký
  choice: “Chúa sẽ xét xử dân Ngài”
  alternative: “Chúa sẽ minh oan cho dân Ngài”
  rationale: Nguyên ngữ có thể bao hàm cả trừng phạt lẫn bênh vực hoặc minh oan. Ngữ cảnh cảnh báo trong Hê-bơ-rơ nhấn mạnh sự phán xét của Đức Chúa Trời, nhưng “xét xử” vẫn bảo tồn phạm vi nghĩa và sự căng thẳng vốn có.
- issue: Quyền báo trả của Đức Chúa Trời
  choice: “Sự báo trả thuộc về Ta; chính Ta sẽ báo ứng”
  alternative: “Sự trả thù là của Ta; Ta sẽ hoàn trả”
  rationale: Bản dịch giữ rõ quyền đáp trả công minh thuộc riêng về Đức Chúa Trời, đồng thời tránh để “trả thù” trong tiếng Việt hiện đại gợi chủ yếu đến ác cảm cá nhân.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Viết hoa “Ta” và “Ngài” khi chỉ Đức Chúa Trời theo quy ước tôn kính phổ biến trong tiếng Việt; dùng “Đấng đã phán” để giữ tính nhân vị và sắc thái Kinh Thánh mà không quá cổ.
