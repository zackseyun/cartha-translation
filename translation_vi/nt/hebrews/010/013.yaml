base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/013.yaml
  text: from then on waiting until his enemies are made a footstool for his feet[b][a],
translation:
  language: vi
  text: Từ đó trở đi, Ngài chờ đợi[a] cho đến khi các kẻ thù của Ngài bị đặt làm bệ dưới chân Ngài[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “mong đợi” hoặc “đợi chờ”. Phân từ Hy Lạp có thể hàm ý chờ đợi với niềm trông mong.'
    reason: lexical_alternative
  - marker: b
    text: 'Cách nói này nhắc lại Thi Thiên 110:1, một phân đoạn quan trọng về sự đăng quang: “Hãy ngồi bên phải Ta cho đến khi Ta đặt các kẻ thù của Con làm bệ dưới chân Con.”'
    reason: cross_reference
lexical_decisions:
- source_word: τὸ λοιπὸν
  choice: từ đó
  rationale: Cụm trung tính có mạo từ được dùng như trạng từ, chỉ thời gian tiếp diễn sau khi Đấng Christ đã dâng lễ vật và ngồi xuống trong văn cảnh trước.
- source_word: ἐκδεχόμενος
  choice: chờ đợi
  rationale: Phân từ diễn tả tư thế tiếp diễn của Đấng Christ; cách dịch này tự nhiên, đồng thời chú thích giữ lại sắc thái mong đợi có thể có.
- source_word: ἕως
  choice: cho đến khi
  rationale: Giữ rõ giới hạn thời gian hoặc điểm kết thúc của sự chờ đợi.
- source_word: τεθῶσιν
  choice: bị đặt làm
  rationale: Giữ thể bị động của động từ τίθημι và kết cấu vị ngữ với hình ảnh cái bệ.
- source_word: οἱ ἐχθροὶ αὐτοῦ
  choice: các kẻ thù của Ngài
  rationale: Diễn đạt tự nhiên cấu trúc sở hữu, không làm mờ đối tượng đối nghịch.
- source_word: ὑποπόδιον τῶν ποδῶν αὐτοῦ
  choice: bệ dưới chân Ngài
  rationale: Cách nói tiếng Việt tự nhiên nhưng vẫn giữ nguyên hình ảnh cụ thể của Thi Thiên 110:1.
theological_decisions:
- issue: Hình ảnh đăng quang của Đấng Mê-si từ Thi Thiên 110:1
  choice: Giữ hình ảnh các kẻ thù bị đặt làm bệ dưới chân Ngài.
  alternative: Diễn giải thành “bị đánh bại” hoặc “bị khuất phục”.
  rationale: Nguyên văn cố ý nhắc lại Thi Thiên 110:1. Giữ hình ảnh cái bệ bảo toàn liên hệ liên văn bản và ý nghĩa đăng quang mà không giải nghĩa quá mức.
- issue: Tác nhân đặt các kẻ thù làm bệ
  choice: Giữ thể bị động “bị đặt làm”, không bổ sung tác nhân.
  alternative: Thêm “Đức Chúa Trời đặt” dựa theo Thi Thiên 110:1.
  rationale: Câu Hy Lạp ở đây không nêu tác nhân; giữ thể bị động bảo toàn cách diễn đạt và không đưa thông tin ngầm vào chính văn.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Đại từ “Ngài” phù hợp với quy chiếu về Đấng Christ trong văn cảnh. Dấu chú thích được đặt ngay sau từ hoặc mệnh đề liên quan.
