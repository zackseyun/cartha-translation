source:
  edition: SBLGNT
  text: τότε εἴρηκεν· Ἰδοὺ ἥκω τοῦ ⸀ποιῆσαι τὸ θέλημά σου· ἀναιρεῖ τὸ πρῶτον ἵνα τὸ δεύτερον στήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/009.yaml
  text: Then he said[a], ‘Behold, I have come to do your will.’ He takes away the first so that he may establish the second.
translation:
  language: vi
  text: 'Rồi Ngài phán: “Này, tôi đã đến để thực hiện ý muốn của Ngài.” Ngài loại bỏ điều thứ nhất để thiết lập điều thứ hai.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τότε
  choice: Bấy giờ
  rationale: Diễn tả trình tự trong lập luận và nối lời này với phần trích dẫn ngay trước đó; tự nhiên và trang trọng trong tiếng Việt.
- source_word: εἴρηκεν
  choice: Ngài phán
  rationale: Thì hoàn thành Hy Lạp chỉ lời đã được nói nhưng vẫn có hiệu lực trong lập luận. Tiếng Việt không bắt buộc đánh dấu thể; “phán” phù hợp với lời của Đấng Christ thưa với Đức Chúa Trời trong văn cảnh.
- source_word: Ἰδοὺ
  choice: Kìa
  rationale: Giữ sắc thái chỉ xuất và trang trọng của lời trích Kinh Thánh mà vẫn dễ hiểu trong tiếng Việt hiện đại.
- source_word: ἥκω
  choice: con đến
  rationale: ἥκω diễn tả việc đã đến và đang hiện diện. Trong lời trực tiếp hướng về Đức Chúa Trời, đại từ “con” tự nhiên hơn lối dịch máy móc “tôi” và không thêm danh xưng ngoài nguyên văn.
- source_word: τοῦ ποιῆσαι
  choice: để thực hiện
  rationale: Cấu trúc động từ nguyên mẫu có mạo từ biểu thị mục đích; “để thực hiện” truyền đạt rõ mục đích và kết hợp tự nhiên với “ý muốn”.
- source_word: τὸ θέλημά σου
  choice: ý muốn của Ngài
  rationale: Giữ thuật ngữ thần học θέλημα và ngôi thứ hai của nguyên văn; “Ngài” thể hiện cách xưng hô tôn kính với Đức Chúa Trời.
- source_word: ἀναιρεῖ
  choice: loại bỏ
  rationale: Diễn tả việc gạt bỏ hoặc làm cho điều thứ nhất không còn hiệu lực, nhưng tránh giải thích quá mức thành một thuật ngữ pháp lý như “bãi bỏ”.
- source_word: τὸ πρῶτον
  choice: điều thứ nhất
  rationale: Tính từ được dùng như danh từ. Thêm “điều” là cần thiết cho tiếng Việt tự nhiên nhưng vẫn giữ nguyên sự cô đọng và mơ hồ về đối tượng quy chiếu.
- source_word: ἵνα
  choice: để
  rationale: Truyền đạt quan hệ mục đích giữa việc loại bỏ điều thứ nhất và thiết lập điều thứ hai.
- source_word: τὸ δεύτερον
  choice: điều thứ hai
  rationale: Giữ cấu trúc song song với “điều thứ nhất” và không đưa cách giải nghĩa cụ thể vào chính văn.
- source_word: στήσῃ
  choice: thiết lập
  rationale: Trong ngữ cảnh, ἵστημι mang nghĩa đặt vững hoặc làm cho có hiệu lực; “thiết lập” thể hiện rõ sự tương phản với “loại bỏ”.
theological_decisions:
- issue: Đối tượng của động từ ἀναιρεῖ và chủ thể của câu
  choice: Giữ chủ thể là Đấng Christ được nhắc đến trong lời trích và dịch “Ngài loại bỏ”.
  alternative: Hiểu hành động này theo nghĩa rộng là Đức Chúa Trời loại bỏ điều thứ nhất qua sự vâng phục của Con.
  rationale: Chủ thể ngữ pháp gần nhất của εἴρηκεν và ἀναιρεῖ là nhân vật đang nói trong lời trích. Bản dịch không thêm tên riêng, nhờ đó giữ được cách diễn đạt của nguyên văn.
- issue: Điều thứ nhất và điều thứ hai chỉ về điều gì
  choice: Giữ cách nói cô đọng “điều thứ nhất” và “điều thứ hai”.
  alternative: Giải nghĩa trực tiếp là hệ thống tế lễ thứ nhất và thực tại thứ hai là ý muốn Đức Chúa Trời được hoàn thành qua lễ dâng của Đấng Christ; hoặc hiểu là hai lời trong phần trích dẫn; hoặc rộng hơn là giao ước cũ và giao ước mới.
  rationale: Hê-bơ-rơ 10:8–10 đặt các sinh tế và lễ vật đối lập với việc thi hành ý muốn Đức Chúa Trời, nhưng câu Hy Lạp không gọi đích danh hai điều ấy. Giữ lối nói nguyên văn bảo toàn độ căng và phạm vi giải thích của thần học.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Dùng “Kìa” để giữ âm hưởng trích dẫn Kinh Thánh; dùng “con… Ngài” trong lời hướng về Đức Chúa Trời và “Ngài” cho chủ thể ở câu sau. Không thêm chú thích vì bản tiếng Anh cung cấp có dấu [a] nhưng nội dung chú thích lại không phải một cách đọc khác của mệnh đề được đánh dấu và chủ yếu là giải nghĩa; đưa chú thích ấy vào sẽ gây lệch điểm quy chiếu.
