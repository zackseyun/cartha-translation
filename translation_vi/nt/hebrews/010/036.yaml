source:
  edition: SBLGNT
  text: ὑπομονῆς γὰρ ἔχετε χρείαν ἵνα τὸ θέλημα τοῦ θεοῦ ποιήσαντες κομίσησθε τὴν ἐπαγγελίαν·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/036.yaml
  text: For you have need of endurance[a], so that after doing the will of God you may receive the promise.
translation:
  language: vi
  text: Vì anh chị em cần sự kiên trì, để sau khi làm theo ý muốn của Đức Chúa Trời, anh chị em nhận được lời hứa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “nhận được điều đã được hứa.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ὑπομονῆς
  choice: kiên trì
  rationale: Danh từ ὑπομονή chỉ sự bền lòng đứng vững dưới áp lực hoặc thử thách. “Kiên trì” tự nhiên trong tiếng Việt hiện đại và giữ được ý nghĩa tiếp tục bền bỉ mà không diễn giải quá mức.
- source_word: χρείαν ἔχετε
  choice: anh chị em cần phải
  rationale: Thành ngữ χρείαν ἔχειν có nghĩa là “cần”. Cách dịch này tự nhiên, đồng thời “phải” truyền đạt mức độ cần thiết được nhấn mạnh trong câu.
- source_word: ἵνα
  choice: để
  rationale: ἵνα giới thiệu mục đích hoặc kết quả hướng đến; “để” diễn đạt ngắn gọn và tự nhiên mối quan hệ ấy.
- source_word: τὸ θέλημα τοῦ θεοῦ
  choice: ý muốn của Đức Chúa Trời
  rationale: Cách dịch trực tiếp cấu trúc sở hữu, giữ sắc thái trang trọng quen thuộc trong văn phong Kinh Thánh tiếng Việt.
- source_word: ποιήσαντες
  choice: sau khi làm theo
  rationale: Phân từ bất định quá khứ diễn tả hành động xảy ra trước động từ chính. “Sau khi” làm rõ quan hệ thời gian; “làm theo” là cách nói tự nhiên đối với việc thực hiện ý muốn của Đức Chúa Trời.
- source_word: κομίσησθε
  choice: anh chị em có thể nhận được
  rationale: Trong ngữ cảnh này, κομίζω có nghĩa là nhận hoặc đạt được điều đã hứa. “Nhận được” là cách diễn đạt rõ ràng và tự nhiên.
- source_word: τὴν ἐπαγγελίαν
  choice: lời hứa
  rationale: ἐπαγγελία có thể chỉ chính lời hứa hoặc điều được hứa. Bản văn chính giữ cách diễn đạt sát nguyên ngữ “lời hứa”, còn nghĩa hoán dụ được nêu trong chú thích.
theological_decisions:
- issue: ἐπαγγελίαν chỉ chính lời hứa hay điều đã được hứa
  choice: lời hứa
  alternative: điều đã được hứa
  rationale: Nguyên ngữ dùng danh từ ἐπαγγελίαν, nghĩa đen là “lời hứa”, nhưng khi đi với κομίσησθε có thể chỉ việc nhận điều lời hứa ấy bảo đảm. Giữ “lời hứa” trong chính văn bảo tồn độ căng và tính hàm nghĩa của nguyên bản; phương án diễn giải hơn được đưa vào chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ số nhiều “anh chị em” thể hiện đối tượng được nói trực tiếp mà không giả định chỉ có nam giới; cấu trúc câu giữ quan hệ lý do, mục đích và trình tự hành động của nguyên bản.
