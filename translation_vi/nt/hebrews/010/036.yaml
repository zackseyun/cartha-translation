review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch giữ đúng các thành tố chính của câu Hy Lạp: quan hệ nguyên nhân (γὰρ), nhu cầu về ὑπομονή, mệnh đề mục đích/kết quả với ἵνα, hành động làm ý muốn Đức Chúa Trời đi trước việc nhận lời hứa, và tính hàm nghĩa của τὴν ἐπαγγελίαν. Tuy nhiên, “cần phải kiên trì” chuyển danh từ ὑπομονῆς (“sự kiên trì/sự bền chí”) thành một mệnh lệnh ngầm “phải kiên trì”, mạnh hơn và kém sát cấu trúc nguyên ngữ. “Có thể nhận được” cũng có thể gợi khả năng hơn là kết quả được hướng tới trong mệnh đề ἵνα.'
  naturalness: Câu sửa với “cần sự kiên trì” tự nhiên, trang trọng vừa phải, và trực tiếp phản ánh thành ngữ χρείαν ἔχετε. Trong cấu trúc sau “để”, “anh chị em nhận được” diễn đạt kết quả hướng tới tự nhiên hơn “anh chị em có thể nhận được”.
  terminology: “Đức Chúa Trời,” “ý muốn,” và “lời hứa” phù hợp văn phong Kinh Thánh tiếng Việt hiện đại. “Lời hứa” bảo tồn cách diễn đạt của ἐπαγγελία; chú thích nêu “điều đã được hứa” thích hợp để giữ khả năng nghĩa hoán dụ mà không quyết định thay bản văn.
  issues:
  - severity: medium
    issue: “cần phải kiên trì” thay đổi danh từ nguồn thành mệnh lệnh ngầm.
    rationale: 'ὑπομονῆς là danh từ, thuộc bổ ngữ của χρείαν ἔχετε: “cần sự kiên trì/bền chí.” Thêm “phải” và chuyển sang cụm động từ làm sắc thái quy phạm rõ hơn nguyên ngữ.'
  - severity: low
    issue: “có thể nhận được” có thể nhấn khả năng.
    rationale: κομίσησθε là động từ trong mệnh đề ἵνα, diễn đạt kết quả/mục đích được hướng tới. Sau “để”, dạng “nhận được” truyền đạt quan hệ này trực tiếp hơn mà không thêm sắc thái khả năng.
  revised_text: Vì anh chị em cần sự kiên trì, để sau khi làm theo ý muốn của Đức Chúa Trời, anh chị em nhận được lời hứa.[a]
