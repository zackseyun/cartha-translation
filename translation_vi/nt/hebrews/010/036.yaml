revisions:
- from: Vì anh chị em cần phải kiên trì, để sau khi làm theo ý muốn của Đức Chúa Trời, anh chị em có thể nhận được lời hứa.[a]
  to: Vì anh chị em cần sự kiên trì, để sau khi làm theo ý muốn của Đức Chúa Trời, anh chị em nhận được lời hứa.[a]
  rationale: Bản sửa khôi phục hình thức danh từ của ὑπομονῆς bằng “sự kiên trì” và tránh sắc thái khả năng không cần thiết của “có thể.” Các quan hệ cú pháp, trình tự hành động, thuật ngữ thần học, và sự mơ hồ có chủ ý của “lời hứa” đều được giữ nguyên.
