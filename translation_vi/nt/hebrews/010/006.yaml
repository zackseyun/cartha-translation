  text: In whole burnt offerings and sin offerings you took no pleasure[a].
translation:
  language: vi
  text: Ngài chẳng vui lòng về các lễ thiêu toàn phần và các lễ vật dâng vì tội lỗi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “các lễ thiêu và các lễ vật vì tội lỗi.” Cụm từ Hy Lạp περὶ ἁμαρτίας là một cách nói tế tự chỉ lễ vật được dâng vì tội lỗi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁλοκαυτώματα
  choice: các lễ vật thiêu toàn phần
  rationale: Danh từ chỉ những lễ vật được thiêu trọn vẹn. Cách dịch này làm rõ ý nghĩa của từ Hy Lạp và phân biệt với các loại lễ vật khác.
- source_word: καὶ
  choice: và
  rationale: Liên từ đơn giản nối hai loại lễ vật.
- source_word: περὶ ἁμαρτίας
  choice: lễ vật chuộc tội
  rationale: Trong ngữ cảnh tế tự, cụm từ này là một cách nói chuyên biệt về lễ vật được dâng vì tội lỗi; “lễ vật chuộc tội” là thuật ngữ tự nhiên, dễ hiểu trong tiếng Việt.
- source_word: οὐκ εὐδόκησας
  choice: Chúa chẳng vui lòng
  rationale: Giữ nguyên ngôi thứ hai số ít hướng về Đức Chúa Trời và diễn đạt tự nhiên ý nghĩa đánh giá, ưng thuận của εὐδοκέω cùng sự phủ định.
theological_decisions:
- issue: Thuật ngữ tế tự trong lời trích Thi Thiên 40:6 theo Bản Bảy Mươi và lập luận của Hê-bơ-rơ 10
  choice: 'Giữ hai loại lễ vật cụ thể: “lễ vật thiêu toàn phần” và “lễ vật chuộc tội”.'
  alternative: “lễ thiêu và lễ vật dâng vì tội lỗi”
  rationale: Việc giữ tính cụ thể của hai thuật ngữ giúp người đọc theo dõi sự tương phản trong lập luận của Hê-bơ-rơ mà không giản lược thành “các sinh tế” nói chung hay thêm một cách giải thích giáo lý.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “Chúa” làm chủ ngữ xưng hô được hàm chứa trong động từ ngôi thứ hai để câu tiếng Việt tự nhiên; giữ thuật ngữ tế tự cụ thể và đặt dấu chú thích trong câu chính.
