  rationale: 'Chỉ thực hiện các chỉnh sửa về sự tự nhiên và độ rõ của tiếng Việt: thay cách nói bị động hơi gượng bằng một cách nói thông dụng hơn, và làm rõ hệ quả giả định. Ý nghĩa, các thuật ngữ chủ yếu, tính mơ hồ hợp lệ của ἅπαξ, cùng các điểm neo chú thích đều được giữ nguyên.'
