language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐπεὶ οὐκ ἂν ἐπαύσαντο προσφερόμεναι, διὰ τὸ μηδεμίαν ἔχειν ἔτι συνείδησιν ἁμαρτιῶν τοὺς λατρεύοντας ἅπαξ ⸀κεκαθαρισμένους;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/002.yaml
  text: Otherwise[a], would they not have stopped being offered, because those who worship, having once been cleansed[b], would no longer have any consciousness of sins?
translation:
  language: vi
  text: Nếu không, chẳng phải các lễ tế ấy đã không còn được dâng nữa sao? Vì những người thờ phượng, một khi đã được thanh tẩy[b], sẽ không còn ý thức nào về tội lỗi[a] nữa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “lương tâm liên quan đến tội lỗi” hoặc “nhận thức về tội lỗi.” Từ Hy Lạp có thể chỉ lương tâm, sự nhận biết hoặc ý thức về tội lỗi; tại đây, nó nói đến cảm thức tội lỗi vẫn còn trước Đức Chúa Trời.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “đã được thanh tẩy một lần đủ cả.” Trong ngữ cảnh này, từ “một lần” có thể mang ý nghĩa dứt khoát, không cần lặp lại.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπεὶ
  choice: Nếu không
  rationale: 'Trong lập luận phản thực nối với câu trước, cụm này diễn đạt tự nhiên hệ quả: nếu các lễ tế có thể làm cho người thờ phượng được trọn vẹn thì chúng đã ngừng được dâng.'
- source_word: οὐκ ἂν ἐπαύσαντο προσφερόμεναι
  choice: chẳng phải các lễ tế ấy đã ngừng được dâng rồi sao?
  rationale: Giữ dạng câu hỏi tu từ và sắc thái phản thực của οὐκ ἂν với động từ quá khứ; thể bị động của προσφερόμεναι được thể hiện bằng “được dâng”.
- source_word: τοὺς λατρεύοντας
  choice: những người thờ phượng
  rationale: Diễn đạt rõ nhóm người đang tham gia việc phụng thờ mà không thu hẹp họ vào một chức vụ tôn giáo riêng.
- source_word: διὰ τὸ μηδεμίαν ἔχειν ἔτι
  choice: Vì ... thì không còn ... nữa
  rationale: διά với động từ nguyên mẫu có mạo từ nêu lý do; “không còn ... nữa” truyền đạt đầy đủ μηδεμίαν ... ἔτι.
- source_word: συνείδησιν ἁμαρτιῶν
  choice: ý thức về tội lỗi
  rationale: συνείδησις ở đây có thể chỉ lương tâm, nhận thức hoặc ý thức; “ý thức về tội lỗi” phù hợp với mạch lập luận về cảm thức tội lỗi còn tồn tại, mà không hàm ý người được thanh tẩy mất khả năng phân biệt đạo đức.
- source_word: ἅπαξ κεκαθαρισμένους
  choice: một khi đã được thanh tẩy
  rationale: “Một khi” giữ nghĩa “một lần” của ἅπαξ một cách tự nhiên, còn “đã được thanh tẩy” phản ánh phân từ hoàn thành bị động, tức hành động đã hoàn tất với kết quả còn hiệu lực.
theological_decisions:
- issue: Ý nghĩa của συνείδησιν ἁμαρτιῶν sau khi người thờ phượng được thanh tẩy
  choice: “ý thức về tội lỗi,” chỉ cảm thức hoặc nhận thức về tình trạng mắc tội trước Đức Chúa Trời
  alternative: “lương tâm về tội lỗi” hoặc “nhận thức về tội lỗi”
  rationale: Mạch văn nói rằng một sự thanh tẩy hữu hiệu sẽ chấm dứt nhu cầu dâng lễ lặp lại vì người thờ phượng không còn mang ý thức tội lỗi; cách dịch này không biến câu thành lời khẳng định rằng họ không còn nhận biết hành vi sai trái.
- issue: Sắc thái của ἅπαξ
  choice: Giữ “một khi” trong chính văn
  alternative: “một lần đủ cả” hoặc “một lần dứt khoát”
  rationale: ἅπαξ có thể mang sắc thái dứt khoát, không lặp lại trong ngữ cảnh này, nhưng riêng từ này vẫn cho phép cách hiểu đơn giản là “một lần”; chú thích bảo tồn khả năng mạnh hơn mà không áp đặt nó vào chính văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Lễ tế” nối tự nhiên với các sinh tế được nói đến ở câu trước. Dùng câu hỏi tu từ để bảo toàn cấu trúc lập luận Hy Lạp. Các dấu chú thích được đặt ngay tại những cụm từ thực sự cần giải thích.
