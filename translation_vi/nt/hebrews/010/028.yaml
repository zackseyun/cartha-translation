  text: ἀθετήσας τις νόμον Μωϋσέως χωρὶς οἰκτιρμῶν ἐπὶ δυσὶν ἢ τρισὶν μάρτυσιν ἀποθνῄσκει·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/028.yaml
  text: Anyone who has set aside the law of Moses dies without mercy on the testimony of two or three witnesses[a].
translation:
  language: vi
  text: Ai bác bỏ luật pháp Môi-se thì, dựa trên lời chứng của hai hoặc ba nhân chứng, phải chết không được thương xót.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “bị xử tử.” Tiếng Hy Lạp nói theo nghĩa đen là “chết,” nhưng văn cảnh nói đến việc thi hành án tử hình theo luật pháp Môi-se.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀθετήσας
  choice: bác bỏ
  rationale: Động từ ἀθετέω diễn tả việc gạt bỏ hoặc khước từ điều có thẩm quyền. “Bác bỏ” tự nhiên trong tiếng Việt và giữ được sắc thái khước từ thẩm quyền của luật, thay vì chỉ nói đến một hành vi vi phạm riêng lẻ.
- source_word: τις
  choice: Ai
  rationale: Đại từ bất định được dùng theo nghĩa khái quát. Cấu trúc “Ai... thì...” là cách diễn đạt tự nhiên, rõ ràng trong tiếng Việt.
- source_word: νόμον Μωϋσέως
  choice: luật pháp Môi-se
  rationale: Giữ rõ quan hệ sở hữu/xuất xứ của cụm Hy Lạp, đồng thời dùng cách gọi quen thuộc, trang trọng và dễ hiểu.
- source_word: χωρὶς οἰκτιρμῶν
  choice: không được thương xót
  rationale: Cụm này diễn tả việc không có lòng thương xót trong thi hành phán quyết. Cách dịch này phù hợp văn cảnh pháp lý và tự nhiên hơn lối dịch sát hình thức số nhiều của οἰκτιρμῶν.
- source_word: ἐπὶ δυσὶν ἢ τρισὶν μάρτυσιν
  choice: dựa trên lời chứng của hai hoặc ba nhân chứng
  rationale: ἐπί với cách dữ ở đây chỉ cơ sở của phán quyết. Thêm “lời chứng” làm rõ ý pháp lý vốn hàm chứa trong nguyên văn mà không thay đổi nội dung.
- source_word: ἀποθνῄσκει
  choice: phải chết
  rationale: Động từ hiện tại nêu hậu quả pháp lý mang tính quy định chung. “Phải chết” giữ động từ “chết” của nguyên văn, đồng thời truyền đạt tự nhiên lực quy định trong tiếng Việt; chú thích nêu cách hiểu rõ hơn về việc xử tử.
theological_decisions:
- issue: Có nên diễn đạt rõ ἀποθνῄσκει là hành quyết theo luật hay không
  choice: Giữ “phải chết” trong chính văn
  alternative: bị xử tử
  rationale: Bối cảnh luật Môi-se và thủ tục có nhân chứng cho thấy đây là án tử hình, nhưng chính động từ Hy Lạp chỉ nói “chết”. Chính văn giữ mức độ diễn đạt của nguồn, còn chú thích nêu nghĩa pháp lý theo văn cảnh.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cấu trúc “Ai... thì...” thể hiện mệnh đề pháp lý khái quát; “luật pháp Môi-se,” “lời chứng” và “nhân chứng” duy trì sắc thái tư pháp của câu.
