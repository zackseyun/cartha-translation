source:
  edition: SBLGNT
  text: ἣν ἐνεκαίνισεν ἡμῖν ὁδὸν πρόσφατον καὶ ζῶσαν διὰ τοῦ καταπετάσματος, τοῦτ’ ἔστιν τῆς σαρκὸς αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/020.yaml
  text: which he inaugurated for us as a new and living way through the curtain—that is[a], his flesh[b],
translation:
  language: vi
  text: là con đường mới và sống mà Ngài đã khai mở cho chúng ta qua bức màn, tức là xác thịt Ngài,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἣν
  choice: mà
  rationale: Đại từ quan hệ nối với “con đường”; tiếng Việt tự nhiên dùng “mà” và không xác định quá mức tiền ngữ.
- source_word: ἐνεκαίνισεν
  choice: đã khai mở
  rationale: Diễn đạt việc thiết lập và mở ra một con đường mới để sử dụng; tự nhiên hơn “khánh thành” trong ngữ cảnh này mà vẫn giữ sắc thái khởi lập.
- source_word: ἡμῖν
  choice: cho chúng ta
  rationale: 'Thể hiện cách ba lợi ích: con đường được khai mở vì lợi ích của cộng đồng người tin.'
- source_word: ὁδὸν πρόσφατον καὶ ζῶσαν
  choice: con đường mới và sống
  rationale: Giữ nguyên hai tính chất của con đường, không diễn giải ζῶσαν thành “ban sự sống” dù đó có thể là một hàm ý.
- source_word: διὰ τοῦ καταπετάσματος
  choice: xuyên qua bức màn
  rationale: καταπέτασμα là bức màn trong Đền Tạm/Đền Thờ; “xuyên qua” thể hiện chuyển động và phương tiện tiếp cận.
- source_word: τοῦτ’ ἔστιν
  choice: tức là
  rationale: Công thức giải thích trực tiếp, tự nhiên trong tiếng Việt hiện đại.
- source_word: τῆς σαρκὸς αὐτοῦ
  choice: thân thể bằng xương thịt của Ngài
  rationale: Trong tiếng Việt, chỉ nói “thịt của Ngài” dễ gây hiểu sai hoặc thiếu trang nghiêm. Cụm này chuyển tải σάρξ theo nghĩa thân thể hữu hình, phàm nhân, mà không đồng nhất với “bản tính tội lỗi”.
theological_decisions:
- issue: Mối liên hệ ẩn dụ giữa bức màn và σάρξ của Chúa Giê-su
  choice: “tức là thân thể bằng xương thịt của Ngài”
  alternative: “tức là qua thân thể bằng xương thịt của Ngài”
  rationale: Cấu trúc sở hữu cách đồng vị trong tiếng Hy Lạp nhận diện hoặc giải thích “bức màn” bằng “thân thể bằng xương thịt của Ngài”. Không lặp “qua” để giữ sự mơ hồ cú pháp và tránh quyết định thay tác giả rằng cụm cuối chỉ nói về phương tiện.
- issue: Cách dịch σάρξ
  choice: thân thể bằng xương thịt
  alternative: xác thịt
  rationale: Ở đây σάρξ chỉ thân thể thật của Chúa Giê-su, không phải bản tính tội lỗi. Cách dịch đã chọn rõ nghĩa, trang nghiêm và dễ hiểu, đồng thời vẫn giữ nhấn mạnh về hiện thân hữu hình.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và dễ đọc. Vì câu 20 tiếp nối câu 19 trong nguyên văn, bản dịch giữ dạng mệnh đề chưa kết thúc bằng dấu gạch ngang ở cuối. Đại từ “Ngài” theo lối tôn kính phổ biến trong tiếng Việt Cơ Đốc, không thêm danh xưng ngoài văn bản.
