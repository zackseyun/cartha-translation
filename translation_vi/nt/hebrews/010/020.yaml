  - severity: low
    issue: “xuyên qua bức màn” hơi quá cụ thể về chuyển động vật lý.
    rationale: διὰ trong ẩn dụ tiếp cận có thể dịch tự nhiên là “qua”; cách này vẫn bảo toàn nghĩa “through” mà không tăng cường hình ảnh.
  - severity: low
