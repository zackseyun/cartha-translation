id: HEB.10.22
reference: Hebrews 10:22
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: προσερχώμεθα μετὰ ἀληθινῆς καρδίας ἐν πληροφορίᾳ πίστεως, ῥεραντισμένοι τὰς καρδίας ἀπὸ συνειδήσεως πονηρᾶς καὶ λελουσμένοι τὸ σῶμα ὕδατι καθαρῷ·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/022.yaml
  text: let us draw near with a true heart in full assurance of faith[d][c][b][a], with our hearts sprinkled clean from an evil conscience and our bodies washed with pure water.
translation:
  language: vi
  text: chúng ta hãy đến gần với tấm lòng chân thật, trong sự xác tín trọn vẹn của đức tin, lòng đã được rảy sạch khỏi lương tâm xấu xa[a], và thân thể đã được rửa bằng nước tinh sạch[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “lương tâm tội lỗi.”'
    reason: lexical_alternative
  - marker: b
    text: Hình ảnh này có thể gợi đến ngôn ngữ thanh tẩy theo nghi lễ và cũng có thể khiến một số độc giả liên tưởng đến phép báp-têm; tuy nhiên, câu này không xác định rõ việc rửa ấy là gì.
    reason: cultural_note
lexical_decisions:
- source_word: προσερχώμεθα
  choice: hãy đến gần
  rationale: Thể giả định hiện tại ngôi thứ nhất số nhiều mang lực khuyên nhủ. Cách dịch này tự nhiên, đồng thời giữ bối cảnh đến gần Đức Chúa Trời trong Hê-bơ-rơ.
- source_word: μετὰ ἀληθινῆς καρδίας
  choice: với tấm lòng chân thật
  rationale: Giữ được nét nghĩa thật, chân thành và chân chính của ἀληθινός mà không thu hẹp thành cảm xúc chủ quan.
- source_word: ἐν πληροφορίᾳ πίστεως
  choice: trong sự bảo đảm trọn vẹn của đức tin
  rationale: πληροφορία chỉ sự xác tín hoặc bảo đảm đầy trọn; cách dịch giữ cấu trúc ἐν và dịch πίστις theo nghĩa đức tin của người đến gần.
- source_word: ῥεραντισμένοι τὰς καρδίας
  choice: lòng đã được rảy sạch
  rationale: Phân từ hoàn thành bị động diễn tả tình trạng đã được thanh tẩy. “Rảy” giữ hình ảnh nghi lễ, còn “sạch” làm rõ kết quả thanh tẩy hàm chứa trong ngữ cảnh.
- source_word: ἀπὸ συνειδήσεως πονηρᾶς
  choice: khỏi lương tâm xấu xa
  rationale: Dịch πονηρός theo nghĩa rộng là xấu xa, không thu hẹp thành cảm giác có tội.
- source_word: λελουσμένοι τὸ σῶμα ὕδατι καθαρῷ
  choice: thân thể đã được rửa bằng nước tinh sạch
  rationale: Giữ sự song song của phân từ hoàn thành với mệnh đề trước và bảo tồn hình ảnh thanh tẩy hữu hình; số ít “thân thể” phản ánh sát cấu trúc Hy Lạp.
theological_decisions:
- issue: Có nên xác định việc rửa bằng nước là phép báp-têm hay không
  choice: Giữ nguyên hình ảnh rửa và thanh tẩy, không gọi đích danh là phép báp-têm
  alternative: Diễn giải trực tiếp là phép báp-têm, hoặc chỉ xem đó là sự thanh tẩy nội tâm mang tính ẩn dụ
  rationale: Câu này có thể gợi đến nghi thức thanh tẩy và cũng có thể được nghe như tiếng vọng của phép báp-têm, nhưng bản văn không xác định minh nhiên; vì vậy cần giữ độ mở thần học.
- issue: Cách hiểu συνειδήσεως πονηρᾶς
  choice: lương tâm xấu xa
  alternative: lương tâm tội lỗi hoặc lương tâm cắn rứt
  rationale: Bản văn dùng πονηρός, có phạm vi rộng hơn cảm giác phạm tội; cách dịch chính tránh áp đặt một cách hiểu tâm lý hẹp.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại. “Tấm lòng chân thật,” “lương tâm xấu xa” và “nước tinh sạch” giữ sắc thái Kinh Thánh mà vẫn dễ hiểu; cấu trúc phân từ được chuyển thành các mệnh đề chỉ trạng thái đã hoàn tất.
