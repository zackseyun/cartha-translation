  to: 'Trước đó, khi nói rằng: “Chúa đã không muốn các sinh tế, lễ vật, lễ thiêu toàn phần và lễ vật vì tội lỗi, cũng chẳng vui thích những lễ ấy”—vốn được dâng theo luật pháp—'
