reference: Hebrews 10:8
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀνώτερον λέγων ὅτι ⸂Θυσίας καὶ προσφορὰς⸃ καὶ ὁλοκαυτώματα καὶ περὶ ἁμαρτίας οὐκ ἠθέλησας οὐδὲ εὐδόκησας, αἵτινες κατὰ ⸀νόμον προσφέρονται,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/008.yaml
  text: After saying above[a], “Sacrifices and offerings and whole burnt offerings and sin offerings you did not desire[c][b], nor did you delight in”—which are offered according to the law—
translation:
  language: vi
  text: 'Trước đó, khi nói rằng: “Chúa đã không muốn các sinh tế, lễ vật, lễ thiêu toàn phần và lễ vật vì tội lỗi, cũng chẳng vui thích những lễ ấy”—vốn được dâng theo luật pháp—'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνώτερον λέγων
  choice: Trước đó, Ngài phán
  rationale: Diễn đạt tự nhiên chức năng hồi chỉ của ἀνώτερον và phân từ λέγων, trỏ về lời trích dẫn ngay trước đó. “Ngài” chỉ Đấng đang nói trong lời trích dẫn, phù hợp mạch văn.
- source_word: Θυσίας καὶ προσφορὰς
  choice: các sinh tế, lễ vật
  rationale: Giữ hai thuật ngữ tế tự riêng biệt; “sinh tế” và “lễ vật” là cách nói trang trọng nhưng vẫn dễ hiểu trong tiếng Việt hiện đại.
- source_word: ὁλοκαυτώματα
  choice: lễ thiêu toàn phần
  rationale: Phản ánh nghĩa lễ vật bị thiêu trọn vẹn trên bàn thờ, thay vì chỉ nói chung là “lễ thiêu”.
- source_word: περὶ ἁμαρτίας
  choice: lễ vật vì tội lỗi
  rationale: Giữ cấu trúc và độ mở của cụm Hy Lạp, đồng thời cho thấy đây là một loại lễ tế liên quan đến tội lỗi mà không áp đặt một thuật ngữ hệ phái.
- source_word: οὐκ ἠθέλησας οὐδὲ εὐδόκησας
  choice: Chúa đã không muốn … cũng chẳng vui thích
  rationale: 'Bảo tồn hai động từ song song nhưng khác sắc thái: không muốn và không lấy làm vui thích.'
- source_word: αἵτινες κατὰ νόμον προσφέρονται
  choice: là những lễ được dâng theo luật pháp
  rationale: Giữ mệnh đề giải thích rằng các lễ vừa kể được dâng phù hợp với luật pháp; không diễn giải thêm ngoài bản văn.
theological_decisions:
- issue: Lời phủ định về các lễ tế có thể bị hiểu là luật pháp vốn bất hợp pháp
  choice: Giữ nguyên lời phủ định mạnh, đồng thời giữ mệnh đề “được dâng theo luật pháp”
  alternative: Diễn giải rằng Đức Chúa Trời chỉ không muốn các lễ được dâng sai cách
  rationale: Bản văn tạo ra một căng thẳng có chủ ý giữa việc Đức Chúa Trời không muốn/vui thích các lễ ấy và việc chúng được dâng theo luật pháp. Bản dịch không nên tự giải quyết căng thẳng này.
- issue: Xác định περὶ ἁμαρτίας là thuật ngữ tế tự
  choice: lễ vật vì tội lỗi
  alternative: lễ chuộc tội
  rationale: Cách chọn giữ rõ mối liên hệ với tội lỗi nhưng tránh thu hẹp cụm từ vào một cách hệ thống hóa thần học cụ thể hơn mức câu Hy Lạp đòi hỏi.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ đọc. Dùng “luật pháp” cho νόμος trong ngữ cảnh luật Môi-se, nhưng không thêm “Môi-se” vì điều đó không được nói trực tiếp trong câu. Không dùng chú thích vì bản dịch chính đã truyền đạt đủ các sắc thái cần thiết.
