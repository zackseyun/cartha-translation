  source_fidelity: 'Cần tránh thêm một chủ thể xác định vào phân từ λέγων: nguyên văn chỉ nói “sau khi/ở trên đã nói rằng,” không nêu rõ “Ngài phán.” Bản sửa cũng giữ cấu trúc lời trích dẫn, bốn hạng mục tế tự, hai động từ phủ định, và mệnh đề quan hệ về các lễ được dâng theo luật pháp.'
  naturalness: “Trước đó, khi nói rằng” tự nhiên trong văn cảnh lập luận và không tạo sự lẫn lộn giữa “Ngài phán” và “Chúa” trong lời trích. “là những lễ được dâng” được thay bằng mệnh đề quan hệ trực tiếp “vốn được dâng,” gọn và rõ hơn.
  terminology: Giữ “sinh tế,” “lễ vật,” “lễ thiêu toàn phần,” và “lễ vật vì tội lỗi” để phản ánh các thuật ngữ tế tự phân biệt. “luật pháp” phù hợp với νόμον trong ngữ cảnh này mà không thêm diễn giải “luật Môi-se.”
  issues:
