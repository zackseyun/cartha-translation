  - severity: low
    issue: “là điều có phần thưởng lớn” là cấu trúc quan hệ nặng và gượng.
    rationale: “vốn có phần thưởng lớn” diễn đạt trực tiếp mệnh đề ἥτις ἔχει và đọc tự nhiên hơn.
