  text: μὴ ἀποβάλητε οὖν τὴν παρρησίαν ὑμῶν, ἥτις ἔχει ⸂μεγάλην μισθαποδοσίαν⸃,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/035.yaml
  text: Therefore[a], do not throw away your boldness, which has a great reward,
translation:
  language: vi
  text: Vậy, anh chị em đừng vứt bỏ sự mạnh dạn[a] của mình, vốn có phần thưởng lớn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “sự tự tin.” Từ Hy Lạp này có thể chỉ sự tự do và mạnh dạn đầy tin tưởng, đặc biệt khi đến gần Đức Chúa Trời.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ ἀποβάλητε
  choice: đừng vứt bỏ
  rationale: Mệnh lệnh cấm với μή và động từ ở thể giả định aorist diễn tả việc chủ ý loại bỏ hay từ bỏ; “vứt bỏ” giữ được sắc thái mạnh hơn “đánh mất”.
- source_word: οὖν
  choice: Vậy
  rationale: Nêu kết luận suy ra từ lời khuyên và các gương đã nói trước đó; “Vậy” tự nhiên trong tiếng Việt mà vẫn giữ liên kết lập luận.
- source_word: τὴν παρρησίαν ὑμῶν
  choice: lòng dạn dĩ của anh chị em
  rationale: παρρησία chỉ sự tự do đầy tin tưởng và mạnh dạn, nhất là khi đến gần Đức Chúa Trời, đồng thời phù hợp với việc công khai bền lòng trong đức tin. “Anh chị em” diễn đạt đại từ số nhiều ὑμῶν theo lối bao hàm, tự nhiên.
- source_word: ἥτις ἔχει
  choice: là điều có
  rationale: Giữ quan hệ giải thích của đại từ quan hệ ἥτις và nghĩa trực tiếp của ἔχει, không chuyển sang cách diễn giải nhân quả như “đem lại”.
- source_word: μεγάλην μισθαποδοσίαν
  choice: phần thưởng lớn
  rationale: μισθαποδοσία chỉ sự báo đáp hay phần thưởng; trong ngữ cảnh tích cực này, “phần thưởng” rõ ràng, tự nhiên và không áp đặt sắc thái giao dịch quá mức.
theological_decisions:
- issue: Ý nghĩa của παρρησία trong Hê-bơ-rơ 10:35
  choice: “lòng dạn dĩ,” bao gồm sự tự do đầy tin tưởng trước Đức Chúa Trời và sự bền lòng công khai trong đức tin
  alternative: “lòng tin chắc” hoặc “sự tự tin”
  rationale: Cách dịch này giữ sắc thái can đảm và tự do của từ Hy Lạp mà không thu hẹp nó thành một cảm giác chắc chắn nội tâm.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Đừng vứt bỏ” giữ hình ảnh mạnh của nguyên văn; “lòng dạn dĩ” tự nhiên hơn danh từ trừu tượng “sự dạn dĩ” trong câu khuyên bảo.
