id: HEB.10.7
reference: Hebrews 10:7
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: τότε εἶπον· Ἰδοὺ ἥκω, ἐν κεφαλίδι βιβλίου γέγραπται περὶ ἐμοῦ, τοῦ ποιῆσαι, ὁ θεός, τὸ θέλημά σου.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/007.yaml
  text: Then I said[a], ‘Behold, I have come—in the scroll of the book it is written about me—to do your will, O God.’
translation:
  language: vi
  text: 'Bấy giờ tôi nói: “Này, tôi đã đến—trong cuộn sách[a] có chép về tôi—để thực hiện ý muốn của Ngài, lạy Đức Chúa Trời.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cụm từ này nói đến sách ở dạng cuộn thời cổ, không phải sách đóng thành quyển theo kiểu hiện đại.
    reason: Làm rõ hình ảnh và nghĩa lịch sử của κεφαλίς trong cụm ἐν κεφαλίδι βιβλίου.
lexical_decisions:
- source_word: τότε
  choice: Bấy giờ
  rationale: Diễn đạt tự nhiên trạng từ chỉ thời gian mở đầu lời đáp được trích dẫn.
- source_word: εἶπον
  choice: tôi nói
  rationale: Thể bất định của λέγω trong công thức dẫn lời được chuyển trực tiếp và tự nhiên là “tôi nói”.
- source_word: Ἰδοὺ
  choice: Này
  rationale: Giữ sắc thái chỉ dẫn nhấn mạnh và trang trọng của lời trích Kinh Thánh mà vẫn tự nhiên trong tiếng Việt hiện đại.
- source_word: ἥκω
  choice: tôi đã đến
  rationale: 'Dù có hình thức hiện tại, ἥκω thường mang ý nghĩa hoàn thành: người nói đã đến và hiện đang có mặt.'
- source_word: ἐν κεφαλίδι βιβλίου
  choice: trong cuộn sách
  rationale: Trong thành ngữ này, κεφαλίς chỉ cuộn sách chứ không phải đề mục hay tiêu đề; cách dịch này giữ đúng hình ảnh vật mang văn bản thời cổ.
- source_word: γέγραπται
  choice: có chép
  rationale: Diễn đạt thành ngữ tiếng Việt tự nhiên cho thể hoàn thành bị động, hàm ý điều ấy vẫn còn được ghi trong văn bản.
- source_word: περὶ ἐμοῦ
  choice: về tôi
  rationale: Tương đương trực tiếp, tự nhiên với περί cùng sở hữu cách.
- source_word: τοῦ ποιῆσαι
  choice: để thực hiện
  rationale: Diễn đạt mục đích của việc đến; “thực hiện” kết hợp tự nhiên với “ý muốn” và vẫn giữ nghĩa căn bản của ποιέω.
- source_word: ὁ θεός
  choice: lạy Đức Chúa Trời
  rationale: Danh cách được dùng với chức năng hô cách; “lạy” đánh dấu lời thưa trực tiếp và giữ sắc thái trang trọng.
- source_word: τὸ θέλημά σου
  choice: ý muốn của Ngài
  rationale: Giữ ý nghĩa ý chí hay điều Đức Chúa Trời muốn, đồng thời dùng đại từ tôn kính tự nhiên trong ngữ cảnh cầu thưa.
theological_decisions:
- issue: Lời tự xưng mang ý nghĩa Đấng Mê-si trong câu Thi Thiên được thư Hê-bơ-rơ áp dụng
  choice: Giữ nguyên lời nói ở ngôi thứ nhất, không thêm danh xưng “Đấng Mê-si” hay “Đấng Christ” vào câu.
  alternative: Nêu rõ người nói là Đấng Mê-si hoặc Đấng Christ ngay trong bản văn chính.
  rationale: Ngữ cảnh thư Hê-bơ-rơ áp dụng lời này cho Con/Đấng Christ, nhưng chính câu chỉ trình bày lời tuyên bố ở ngôi thứ nhất. Bản dịch để ngữ cảnh xác định người nói, tránh giải nghĩa thêm vào nguyên văn.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại, dễ hiểu. “Này” và “lạy Đức Chúa Trời” giữ âm hưởng long trọng của lời trích; dấu gạch ngang bảo tồn cấu trúc xen giữa của câu Hy Lạp mà không làm mờ mục đích “để thực hiện ý muốn của Ngài”.
