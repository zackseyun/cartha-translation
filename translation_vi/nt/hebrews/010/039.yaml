id: HEB.10.39
reference: Hebrews 10:39
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἡμεῖς δὲ οὐκ ἐσμὲν ὑποστολῆς εἰς ἀπώλειαν, ἀλλὰ πίστεως εἰς περιποίησιν ψυχῆς.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/039.yaml
  text: But we are not of shrinking back to destruction[d][c][b][a], but of faith to the preservation of the soul.
translation:
  language: vi
  text: Nhưng chúng ta không phải là những người thối lui[a] để đi đến chỗ hư mất, mà là những người có đức tin[b] để bảo toàn sự sống mình.[c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “rút lui” hoặc “lùi bước.” Từ Hy Lạp có thể chỉ sự thoái lui hay rút lui; một số người hiểu mạnh hơn là sự bội đạo trong câu này.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể hiểu: “sự trung tín.” Từ Hy Lạp pistis có thể bao hàm lòng tin bền vững và sự trung tín.'
    reason: alternative_reading
  - marker: c
    text: 'Cụm này cũng có thể dịch: “để giữ được linh hồn,” “để đạt được sự sống,” hoặc “để giữ được chính mình.” Từ được dịch là “sự sống” có thể chỉ mạng sống, bản thân hay toàn thể con người, không chỉ “linh hồn” theo nghĩa hẹp hiện nay.'
    reason: lexical_alternative
  - marker: d
    text: 'Một cách dịch truyền thống hơn là: “để linh hồn được bảo tồn.”'
    reason: previous_rendering
lexical_decisions:
- source_word: ἡμεῖς δὲ
  choice: Nhưng chúng ta
  rationale: Giữ đại từ ngôi thứ nhất số nhiều được nêu rõ để nhấn mạnh, đồng thời dùng “nhưng” để thể hiện sự tương phản với lời cảnh báo ngay trước đó.
- source_word: οὐκ ἐσμὲν ὑποστολῆς
  choice: không phải là những người thối lui
  rationale: Các sở hữu cách nêu hạng người hay đặc tính. Cách diễn đạt này tự nhiên trong tiếng Việt và giữ ý rút lui, không quy định quá mức rằng đó nhất thiết là sự bội đạo hoàn toàn.
- source_word: εἰς ἀπώλειαν
  choice: để đi đến chỗ hư mất
  rationale: Diễn đạt đích đến hoặc kết quả nghiêm trọng của sự thối lui. “Hư mất” phù hợp văn cảnh cứu chuộc và vẫn dễ hiểu trong tiếng Việt hiện đại.
- source_word: πίστεως
  choice: những người có đức tin
  rationale: Duy trì sự đối xứng giữa hai hạng người và dịch πίστις theo nghĩa chính là đức tin, trong khi sắc thái trung tín, bền lòng được ghi ở chú thích.
- source_word: εἰς περιποίησιν
  choice: để bảo toàn
  rationale: Trong thế đối lập với ἀπώλεια, nghĩa bảo tồn hoặc giữ được là phù hợp nhất; động từ hóa giúp câu tiếng Việt tự nhiên mà không hàm ý con người tự lập công để đạt cứu rỗi.
- source_word: ψυχῆς
  choice: sự sống mình
  rationale: Trong ngữ cảnh này ψυχή có thể chỉ mạng sống, bản thân hay toàn thể con người, chứ không nhất thiết chỉ một “linh hồn” tách khỏi thân thể. “Sự sống mình” truyền đạt phạm vi ấy tự nhiên hơn.
theological_decisions:
- issue: Sắc thái của πίστις khi đối lập với ὑποστολή
  choice: đức tin
  alternative: sự trung tín; lòng tin bền vững
  rationale: Từ này trước hết có thể chỉ đức tin, nhưng trong lời khuyên phải bền đỗ nó cũng có thể bao hàm sự trung tín. Bản chính không loại bỏ sắc thái đó; chú thích bảo lưu khả năng này.
- issue: Ý nghĩa của περιποίησις ψυχῆς
  choice: bảo toàn sự sống mình
  alternative: giữ được linh hồn; đạt được sự sống; giữ được chính mình
  rationale: Sự đối lập trực tiếp với “hư mất” nghiêng về nghĩa bảo toàn, nhưng danh từ περιποίησις cũng có thể mang nghĩa đạt được hoặc sở hữu. Cách dịch chính không biến câu thành tuyên bố về việc tự kiếm được ơn cứu rỗi, còn chú thích giữ lại độ mở của nguyên ngữ.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ đọc. Cấu trúc “những người… mà là những người…” làm rõ hai hạng người hàm chứa trong các sở hữu cách Hy Lạp, còn “bảo toàn sự sống mình” tránh thu hẹp ψυχή thành một phần phi vật chất của con người.
