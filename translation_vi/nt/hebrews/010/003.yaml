reference: Hebrews 10:3
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀλλ’ ἐν αὐταῖς ἀνάμνησις ἁμαρτιῶν κατ’ ἐνιαυτόν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/003.yaml
  text: But in these sacrifices there is a reminder of sins year after year,[a]
translation:
  language: vi
  text: Nhưng trong những tế lễ ấy có sự nhắc nhở về tội lỗi, năm này qua năm khác.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “mỗi năm.”'
    reason: Nêu cách dịch ngắn gọn khác của κατ’ ἐνιαυτόν; cả hai đều diễn tả sự tái diễn hằng năm.
lexical_decisions:
- source_word: ἀλλ’
  choice: Nhưng
  rationale: 'Liên từ mang ý tương phản với câu trước: các tế lễ không thể làm cho người thờ phượng được trọn vẹn; trái lại, chúng gợi nhắc tội lỗi.'
- source_word: ἐν αὐταῖς
  choice: trong những tế lễ ấy
  rationale: Đại từ giống cái số nhiều αὐταῖς quay lại chỉ các tế lễ trong ngữ cảnh trước. Nêu rõ danh từ “tế lễ” giúp câu tiếng Việt sáng nghĩa mà không thêm nội dung.
- source_word: ἀνάμνησις
  choice: sự nhắc nhớ
  rationale: Danh từ này chỉ việc làm cho điều gì được nhớ lại. “Sự nhắc nhớ” giữ cấu trúc danh từ và không xác định thêm chủ thể thực hiện việc nhắc nhớ.
- source_word: ἁμαρτιῶν
  choice: về tội lỗi
  rationale: 'Diễn đạt tự nhiên quan hệ sở thuộc/nội dung của danh từ ἀνάμνησις: tội lỗi là điều được nhắc nhớ.'
- source_word: κατ’ ἐνιαυτόν
  choice: năm này qua năm khác
  rationale: Thành ngữ κατά với từ chỉ năm diễn tả sự tái diễn hằng năm. Cách dịch này làm nổi bật tính lặp lại liên tục trong lập luận của thư Hê-bơ-rơ.
theological_decisions:
- issue: Đối tượng quy chiếu của αὐταῖς
  choice: Hiểu đại từ là chỉ các tế lễ được dâng lặp đi lặp lại trong ngữ cảnh trước, và dịch rõ là “những tế lễ ấy”.
  alternative: Giữ đại từ chung chung là “trong đó” hoặc “trong chúng”.
  rationale: Các câu 1–2 đang nói về những tế lễ được dâng liên tục. Nêu rõ đối tượng quy chiếu làm sáng nghĩa mà vẫn giữ nguyên sự tương phản giữa việc dâng tế lễ lặp lại và sự thanh tẩy hữu hiệu.
- issue: Sắc thái của κατ’ ἐνιαυτόν
  choice: Dịch “năm này qua năm khác” để thể hiện sự tái diễn hằng năm.
  alternative: “mỗi năm” hoặc “hằng năm”.
  rationale: Cả hai cách đều phù hợp về nghĩa thời gian, nhưng “năm này qua năm khác” truyền đạt rõ hơn tính lặp lại vốn giữ vai trò quan trọng trong lập luận của đoạn văn, mà không buộc phải xác định nghi lễ cụ thể.
- issue: Chủ thể của việc nhắc nhớ
  choice: Giữ cấu trúc vô nhân xưng “có sự nhắc nhớ”, không nêu ai là người nhắc hay được nhắc.
  alternative: “Những tế lễ ấy nhắc người ta nhớ” hoặc “người ta được nhắc nhớ”.
  rationale: Bản Hy Lạp dùng danh từ ἀνάμνησις và không chỉ rõ tác nhân hay người tiếp nhận. Cách dịch đã chọn bảo tồn độ mở này, tránh giải quyết ngầm một điểm mà nguyên văn không xác định.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cụm “có sự nhắc nhớ” hơi trang trọng nhưng giữ sát cấu trúc nguyên văn và tránh thêm chủ thể không được nêu. Dấu chú thích [a] xuất hiện ngay sau câu chính.
