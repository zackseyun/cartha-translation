source:
  edition: SBLGNT
  text: Ἀναμιμνῄσκεσθε δὲ τὰς πρότερον ἡμέρας, ἐν αἷς φωτισθέντες πολλὴν ἄθλησιν ὑπεμείνατε παθημάτων,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/032.yaml
  text: But remember the former days[a], when, after you were enlightened, you endured a great struggle of sufferings[c][b],
translation:
  language: vi
  text: Nhưng hãy nhớ lại những ngày trước kia, khi đã được soi sáng[a][b], anh chị em đã chịu đựng một cuộc tranh đấu lớn đầy đau khổ[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “sau khi được soi sáng” hoặc “khi được soi sáng.” Phân từ Hy Lạp có thể nhấn mạnh hành động xảy ra trước hoặc gắn với thời điểm của sự việc chính.'
    reason: lexical_alternative
  - marker: b
    text: “Được soi sáng” có thể nói rộng về việc nhận ánh sáng thuộc linh; có người liên hệ cách nói này với sự quy đạo, phép báp-têm hoặc việc được dạy dỗ trong đức tin.
    reason: alternative_reading
  - marker: c
    text: 'Cũng có thể dịch: “một cuộc thi đấu cam go trong đau khổ.” Từ Hy Lạp mang hình ảnh một cuộc thi đấu hoặc tranh đấu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀναμιμνῄσκεσθε
  choice: hãy nhớ lại
  rationale: Thể mệnh lệnh hiện tại số nhiều kêu gọi độc giả chủ động nhớ lại; cách diễn đạt này tự nhiên trong tiếng Việt và giữ rõ sắc thái mệnh lệnh.
- source_word: δὲ
  choice: Nhưng
  rationale: Đánh dấu bước chuyển có sắc thái tương phản nhẹ với lời cảnh báo và khích lệ trước đó.
- source_word: τὰς πρότερον ἡμέρας
  choice: những ngày trước kia
  rationale: Diễn đạt tự nhiên ý nghĩa thời gian của cụm từ, chỉ giai đoạn trước đây trong kinh nghiệm của độc giả.
- source_word: ἐν αἷς
  choice: khi
  rationale: Cụm từ có nghĩa đen là “trong những ngày ấy,” nhưng ở đây mang chức năng thời gian; “khi” gọn và tự nhiên.
- source_word: φωτισθέντες
  choice: đã được soi sáng
  rationale: Giữ hình ảnh ánh sáng và thể bị động của phân từ aorist, không thu hẹp ý nghĩa thành một biến cố giáo lý cụ thể.
- source_word: πολλὴν ἄθλησιν
  choice: một cuộc tranh đấu lớn
  rationale: ἄθλησις gợi một cuộc thi đấu hay tranh đấu đòi hỏi sức bền; “cuộc tranh đấu lớn” vừa tự nhiên vừa giữ cường độ của πολλήν.
- source_word: ὑπεμείνατε
  choice: anh chị em đã chịu đựng
  rationale: Động từ aorist chỉ việc họ đã bền lòng chịu qua thử thách; “chịu đựng” là cách diễn đạt trực tiếp và phù hợp ngữ cảnh đau khổ.
- source_word: παθημάτων
  choice: đầy đau khổ
  rationale: Danh từ sở hữu cách số nhiều xác định tính chất của cuộc tranh đấu. Cách diễn đạt này tự nhiên trong tiếng Việt và cho thấy cuộc tranh đấu bao gồm nhiều nỗi đau khổ.
theological_decisions:
- issue: Ý nghĩa của φωτισθέντες trong bối cảnh cảnh báo và khích lệ
  choice: Giữ cách nói ẩn dụ “được soi sáng.”
  alternative: Diễn giải là “tin Chúa,” “chịu phép báp-têm” hoặc “được dạy dỗ trong đức tin.”
  rationale: Câu này nói đến việc trước đó độc giả đã nhận sự soi sáng thuộc linh, nhưng không xác định chính xác đó là sự quy đạo, phép báp-têm hay sự giáo huấn. Giữ nguyên hình ảnh giúp bảo toàn độ mở thần học của nguyên văn.
- issue: Quan hệ thời gian của phân từ φωτισθέντες
  choice: Dùng “khi đã được soi sáng,” cho thấy sự soi sáng có trước hoặc đã xảy ra khi giai đoạn chịu khổ bắt đầu.
  alternative: “sau khi được soi sáng” hoặc “khi được soi sáng.”
  rationale: Phân từ aorist thường chỉ hành động có trước động từ chính, nhưng trong kết cấu thời gian này có thể nhấn mạnh giai đoạn gắn với biến cố ấy. Bản dịch chính giữ được cả ý hoàn tất lẫn sự liên hệ thời gian mà không tuyệt đối hóa một cách hiểu.
translation_notes:
  register: Văn phong hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh chị em” để thể hiện đại từ số nhiều hàm ẩn trong động từ Hy Lạp và trực tiếp hướng đến cộng đồng độc giả. Giữ hình ảnh “được soi sáng” và “cuộc tranh đấu” thay vì giải nghĩa theo một truyền thống giáo phái cụ thể.
