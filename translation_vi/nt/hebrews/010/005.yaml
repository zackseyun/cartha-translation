revisions:
- from: 'Vì vậy, khi vào thế gian, Đấng ấy phán:

    “Chúa không muốn sinh tế và lễ vật,

    nhưng đã chuẩn bị cho con một thân thể.”[a]'
  to: 'Vì vậy, khi vào thế gian, Đấng ấy nói:


    “Ngài không muốn sinh tế và lễ vật,


    nhưng đã chuẩn bị cho tôi một thân thể.”[a]'
  rationale: Bản sửa đổi bảo toàn sát bản Hy Lạp của Hê-bơ-rơ 10:5, đặc biệt là “một thân thể ... cho tôi”, đồng thời thay cặp xưng hô diễn giải “Chúa—con” bằng đại từ tôn kính trung tính hơn về mặt diễn giải. Chú thích vẫn nêu rõ khác biệt quan trọng với văn bản Hê-bơ-rơ của Thi Thiên 40:6 mà không hòa hợp hóa câu trích.
  reviewer_model: gpt-5.6-terra
