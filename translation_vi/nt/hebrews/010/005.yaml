  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: διὸ εἰσερχόμενος εἰς τὸν κόσμον λέγει· Θυσίαν καὶ προσφορὰν οὐκ ἠθέλησας, σῶμα δὲ κατηρτίσω μοι·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/005.yaml
  text: 'Therefore[a], when he comes into the world, he says: “Sacrifice and offering you did not desire, but a body you prepared for me.”'
translation:
  language: vi
  text: 'Vì vậy, khi vào thế gian, Đấng ấy nói:


    “Ngài không muốn sinh tế và lễ vật,


    nhưng đã chuẩn bị cho tôi một thân thể.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ở đây, thư Hê-bơ-rơ sử dụng cách diễn đạt Hy Lạp của Thi Thiên 40:6: “đã chuẩn bị cho tôi một thân thể.” Văn bản Hê-bơ-rơ của Thi Thiên 40:6 chép: “Ngài đã mở tai cho tôi.”'
    reason: alternative_reading
lexical_decisions:
- source_word: διὸ
  choice: Vì vậy
  rationale: Giữ rõ quan hệ suy luận với lập luận ngay trước đó, đồng thời tự nhiên trong tiếng Việt hiện đại.
- source_word: εἰσερχόμενος εἰς τὸν κόσμον
  choice: khi vào thế gian
  rationale: Diễn đạt tự nhiên phân từ hiện tại trong khung trích dẫn sống động, không ấn định quá mức thời điểm; “thế gian” chỉ thế giới loài người.
- source_word: λέγει
  choice: Đấng ấy phán
  rationale: Giữ thì hiện tại dùng để dẫn lời Kinh Thánh. “Phán” phù hợp với lời của Đấng Christ hướng đến Đức Chúa Trời; “Đấng ấy” làm rõ chủ thể tôn kính mà không thêm danh xưng không có trong câu Hy Lạp.
- source_word: Θυσίαν καὶ προσφορὰν
  choice: sinh tế và lễ vật
  rationale: 'Duy trì hai thuật ngữ thờ phượng riêng biệt: θυσία là vật được dâng làm sinh tế, còn προσφορά là lễ vật nói chung.'
- source_word: οὐκ ἠθέλησας
  choice: Chúa không muốn
  rationale: “Muốn” truyền đạt tự nhiên ý muốn hay sự ưa thích của θέλω. Đại từ “Chúa” là cách xưng hô tiếng Việt tự nhiên trong lời cầu nguyện, dù chủ ngữ Hy Lạp chỉ được hàm chứa trong động từ ngôi thứ hai.
- source_word: σῶμα
  choice: một thân thể
  rationale: Giữ danh từ cụ thể số ít và ý nghĩa thân thể trong cách tác giả Hê-bơ-rơ sử dụng lời trích dẫn.
- source_word: δὲ
  choice: nhưng
  rationale: Thể hiện rõ sự tương phản giữa những sinh tế không được muốn và thân thể được chuẩn bị.
- source_word: κατηρτίσω μοι
  choice: đã chuẩn bị cho con
  rationale: καταρτίζω ở đây mang nghĩa chuẩn bị hay làm sẵn; μοι là đối tượng hưởng lợi. Cặp xưng hô “Chúa—con” tự nhiên trong lời nói hướng đến Đức Chúa Trời.
theological_decisions:
- issue: Lời trích Thi Thiên 40:6 trong Hê-bơ-rơ khác với văn bản Hê-bơ-rơ của Thi Thiên.
  choice: 'Dịch theo bản Hy Lạp của Hê-bơ-rơ: “đã chuẩn bị cho con một thân thể.”'
  alternative: “đã mở tai con” hoặc “đã đào tai cho con,” theo văn bản Hê-bơ-rơ của Thi Thiên 40:6.
  rationale: Câu đang dịch có σῶμα, “thân thể,” nên phải ưu tiên chứng cứ nguyên ngữ của Hê-bơ-rơ, không hòa hợp hóa với Thi Thiên. Dị bản nền quan trọng được nêu trong chú thích để bảo tồn sự căng thẳng văn bản.
- issue: Chủ thể của λέγει không được nêu danh trong câu này.
  choice: Dùng “Đấng ấy” thay vì thêm trực tiếp “Đấng Christ” hay “Chúa Giê-su.”
  alternative: “Ngài” hoặc nêu rõ “Đấng Christ.”
  rationale: Ngữ cảnh xác định chủ thể là Đấng Christ, nhưng nguyên văn câu này chỉ hàm ý đại từ “người ấy.” “Đấng ấy” vừa tôn kính vừa tránh đưa danh xưng giải nghĩa vào chính văn.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại, dùng thuật ngữ thờ phượng quen thuộc. Câu thơ được xuống dòng để thể hiện lời trích dẫn. Cặp xưng hô “Chúa—con” giúp lời nói trực tiếp tự nhiên trong tiếng Việt mà không xác quyết thêm một danh xưng thần học trong nguyên văn.
