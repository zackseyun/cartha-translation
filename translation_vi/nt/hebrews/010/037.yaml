id: HEB.10.37
reference: Hebrews 10:37
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἔτι γὰρ μικρὸν ὅσον ὅσον, ὁ ἐρχόμενος ἥξει καὶ οὐ χρονίσει·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/037.yaml
  text: For yet a very little while[b][a], the one who is coming will come and will not delay.
translation:
  language: vi
  text: Vì chỉ còn một thời gian rất ngắn nữa[a], Đấng đang đến[b] sẽ đến và không trì hoãn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn có lối nói nhấn mạnh, sát nghĩa là “một ít, chừng nào chừng ấy,” mang nghĩa “một thời gian rất ngắn.”
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “người đang đến.” Cụm Hy Lạp có thể được hiểu theo nghĩa thông thường, nhưng “Đấng đang đến” giữ được sắc thái danh xưng có khả năng chỉ Đấng Mê-si-a trong ngữ cảnh.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἔτι γὰρ
  choice: Vì ... còn ... nữa
  rationale: “Vì” giữ chức năng giải thích của γάρ và nối câu này với lời khích lệ trước đó; “còn ... nữa” diễn đạt tự nhiên sắc thái thời gian của ἔτι trong tiếng Việt.
- source_word: μικρὸν ὅσον ὅσον
  choice: một thời gian rất ngắn
  rationale: Cụm lặp ὅσον ὅσον nhấn mạnh mức độ ngắn của khoảng thời gian. Cách dịch này truyền đạt thành ngữ nhấn mạnh bằng tiếng Việt tự nhiên, thay vì mô phỏng sự lặp lại khó hiểu.
- source_word: ὁ ἐρχόμενος
  choice: Đấng đang đến
  rationale: Phân từ hiện tại có mạo từ được dùng như danh từ. “Đấng đang đến” giữ được cả ý nghĩa đang đến của phân từ lẫn khả năng đây là một danh xưng chỉ Đấng Mê-si-a trong ngữ cảnh.
- source_word: ἥξει
  choice: sẽ đến
  rationale: Động từ tương lai mang nghĩa dự báo trực tiếp; “sẽ đến” rõ ràng và giữ sự lặp từ có chủ ý với “Đấng đang đến”.
- source_word: οὐ χρονίσει
  choice: không trì hoãn
  rationale: χρονίζω ở đây có nghĩa là chậm trễ hoặc trì hoãn. “Không trì hoãn” là cách diễn đạt hiện đại, rõ nghĩa và trang trọng vừa phải.
theological_decisions:
- issue: ὁ ἐρχόμενος là một danh xưng mang ý nghĩa Mê-si-a hay chỉ là một cụm phân từ thông thường
  choice: Dịch “Đấng đang đến” trong chính văn
  alternative: người đang đến; người sẽ đến
  rationale: Trong ngữ cảnh trích dẫn Kinh Thánh được áp dụng theo hướng Cơ Đốc học, cụm có mạo từ này có thể mang sắc thái danh xưng. Tuy nhiên, vì tiếng Hy Lạp cũng có thể được hiểu theo nghĩa mô tả thông thường, chú thích giữ lại cách hiểu thay thế.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Cấu trúc “chỉ còn ... nữa” truyền đạt tự nhiên ý thời gian rất ngắn; “Đấng đang đến” giữ sắc thái tôn kính và khả năng là danh xưng mà không diễn giải thêm ngoài nguyên văn.
