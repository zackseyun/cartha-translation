id: HEB.10.12
reference: Hebrews 10:12
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸀οὗτος δὲ μίαν ὑπὲρ ἁμαρτιῶν προσενέγκας θυσίαν εἰς τὸ διηνεκὲς ἐκάθισεν ἐν δεξιᾷ τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/012.yaml
  text: But this one[a], after offering one sacrifice for sins for all time, sat down at the right hand of God[b],
translation:
  language: vi
  text: Nhưng Đấng này, sau khi dâng một sinh tế vì tội lỗi có hiệu lực mãi mãi[a], đã ngồi xuống bên phải Đức Chúa Trời[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cụm từ Hy Lạp được dịch là “có hiệu lực mãi mãi” cũng có thể được hiểu theo cách gắn gần hơn với việc dâng: “sau khi dâng một sinh tế vì tội lỗi có giá trị mãi mãi”; hoặc gắn với động từ chính: “đã ngồi xuống mãi mãi bên phải Đức Chúa Trời.” Cách dịch trong chính văn nhấn mạnh hiệu lực vĩnh viễn của sinh tế duy nhất.'
    reason: alternative_reading
  - marker: b
    text: “Bên phải Đức Chúa Trời” gợi nhắc Thi Thiên 110:1, một phân đoạn then chốt trong sách Hê-bơ-rơ nói về sự tôn cao của Đấng Mê-si-a.
    reason: cross_reference
lexical_decisions:
- source_word: οὗτος
  choice: Đấng này
  rationale: Giữ sắc thái chỉ định và sự tương phản với các thầy tế lễ trong câu trước, đồng thời dùng cách gọi trang trọng, tự nhiên khi nói về Đấng Christ.
- source_word: δὲ
  choice: Nhưng
  rationale: Thể hiện sự tương phản với các thầy tế lễ cứ đứng phục vụ và nhiều lần dâng cùng một loại sinh tế.
- source_word: μίαν ... θυσίαν
  choice: một sinh tế
  rationale: Giữ trọng tâm vào tính duy nhất của sinh tế, đối lập với những sinh tế được dâng lặp đi lặp lại.
- source_word: ὑπὲρ ἁμαρτιῶν
  choice: vì tội lỗi
  rationale: Cách nói tự nhiên trong tiếng Việt, diễn đạt mục đích và phương diện chuộc tội của sinh tế, đồng thời giữ ý số nhiều của ἁμαρτιῶν theo nghĩa tổng quát.
- source_word: προσενέγκας
  choice: sau khi dâng
  rationale: Diễn đạt rõ hành động của phân từ aorist xảy ra trước động từ chính ἐκάθισεν.
- source_word: εἰς τὸ διηνεκές
  choice: có hiệu lực mãi mãi
  rationale: Truyền đạt tự nhiên ý về giá trị bền vững của sinh tế duy nhất trong lập luận của Hê-bơ-rơ, nhưng ghi chú vẫn bảo lưu khả năng gắn cụm từ này với hành động dâng hoặc với việc ngồi.
- source_word: ἐκάθισεν
  choice: đã ngồi xuống
  rationale: Giữ hành động hoàn tất và sự đối lập với việc các thầy tế lễ vẫn đứng hằng ngày trong câu trước.
- source_word: ἐν δεξιᾷ τοῦ θεοῦ
  choice: bên phải Đức Chúa Trời
  rationale: Cách diễn đạt rõ ràng, trang trọng, đồng thời bảo tồn liên hệ với Thi Thiên 110:1.
theological_decisions:
- issue: Phạm vi bổ nghĩa của εἰς τὸ διηνεκές
  choice: 'Gắn về nghĩa với hiệu lực lâu dài của sinh tế duy nhất: “một sinh tế ... có hiệu lực mãi mãi”.'
  alternative: 'Có thể hiểu là “sau khi dâng mãi mãi một sinh tế vì tội lỗi”, hoặc gắn với động từ chính: “đã ngồi mãi mãi bên phải Đức Chúa Trời”.'
  rationale: Ngữ cảnh gần nhấn mạnh sinh tế duy nhất của Đấng Christ có giá trị vĩnh viễn, trái với các sinh tế lặp lại. Tuy vậy, vị trí của cụm từ Hy Lạp cho phép hơn một cách liên kết cú pháp, nên ghi chú bảo lưu sự mơ hồ.
- issue: Hàm ý của việc ngồi bên phải Đức Chúa Trời
  choice: Giữ nguyên hình ảnh đăng quang và tôn cao mà không diễn giải thêm trong chính văn.
  alternative: Có thể diễn giải rõ là công việc tế lễ đã hoàn tất hoặc Đấng Christ được tôn cao.
  rationale: Các hàm ý ấy phù hợp với văn mạch, nhưng chính câu dùng ngôn ngữ gợi nhắc Thi Thiên 110:1; bản dịch không nên đưa toàn bộ phần giải nghĩa vào chính văn.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. “Sinh tế” giữ sắc thái thờ phượng, tế lễ của văn mạch; “Đấng này” bảo tồn lực tương phản của đại từ chỉ định Hy Lạp mà không dùng cách gọi thiếu trang trọng.
