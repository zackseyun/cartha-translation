  text: Ἰησοῦς Χριστὸς ἐχθὲς καὶ σήμερον ὁ αὐτός, καὶ εἰς τοὺς αἰῶνας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/008.yaml
  text: Jesus the Messiah is the same yesterday and today and forever[a].
translation:
  language: vi
  text: Đức Giê-su, Đấng Mê-si-a, hôm qua, hôm nay và mãi mãi vẫn không thay đổi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Đức Giê-su Christ hôm qua, hôm nay và mãi mãi vẫn không thay đổi.” Tước hiệu Χριστός trong tiếng Hy Lạp có thể được dịch là “Đấng Mê-si-a” hoặc phiên âm là “Christ.”'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἰησοῦς
  choice: Đức Giê-su
  rationale: Dùng dạng tên gọi quen thuộc, trang trọng trong tiếng Việt hiện đại.
- source_word: Χριστὸς
  choice: Đấng Mê-si-a
  rationale: Chuyển dịch tước hiệu Hy Lạp thay vì chỉ phiên âm là “Christ”; cách diễn đạt có dấu phẩy làm rõ đây là tước hiệu của Đức Giê-su.
- source_word: ἐχθὲς
  choice: hôm qua
  rationale: Chuyển dịch trực tiếp trạng từ chỉ thời gian, đồng thời giữ nhịp ba thời điểm của nguyên văn.
- source_word: σήμερον
  choice: hôm nay
  rationale: Chuyển dịch trực tiếp và tự nhiên trong tiếng Việt.
- source_word: ὁ αὐτός
  choice: vẫn là một
  rationale: Diễn đạt sự đồng nhất, không thay đổi qua thời gian; “vẫn” được thêm theo lối nói tự nhiên của tiếng Việt, còn “là” là hệ từ được ngữ pháp tiếng Việt đòi hỏi.
- source_word: εἰς τοὺς αἰῶνας
  choice: cho đến đời đời
  rationale: Thành ngữ trang trọng, dễ hiểu, diễn đạt sự kéo dài vĩnh viễn của cụm từ Hy Lạp.
- source_word: καὶ ... καὶ ... καὶ
  choice: '..., ... và ...'
  rationale: Điều chỉnh chuỗi liên từ theo cú pháp tiếng Việt tự nhiên, nhưng vẫn bảo toàn ba mốc thời gian và sự nhấn mạnh của câu.
theological_decisions:
- issue: Ý nghĩa thần học của lời khẳng định Đức Giê-su không thay đổi
  choice: Dịch thẳng rằng Đức Giê-su, Đấng Mê-si-a, qua mọi thời vẫn là một.
  alternative: Diễn giải rộng thành một lời khẳng định minh nhiên về thần tính hoặc thuộc tính bất biến của Đấng Christ.
  rationale: Nguyên văn khẳng định sự đồng nhất bền vững của Đức Giê-su qua thời gian; bản dịch không thêm những kết luận tín lý vượt quá lời văn.
- issue: Cách thể hiện Χριστός
  choice: Đấng Mê-si-a
  alternative: Đấng Christ
  rationale: Giữ rõ lực nghĩa của tước hiệu; chú thích ghi nhận cách phiên âm truyền thống mà không biến lựa chọn đó thành một lập trường hệ phái.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Câu giữ cấu trúc cô đọng của nguyên văn, không giải thích thêm đối tượng hay phương diện của cụm từ “vẫn là một,” nhờ đó bảo toàn độ hàm súc thần học.
