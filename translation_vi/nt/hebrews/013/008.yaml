  naturalness: Cần thay “vẫn là một” bằng “vẫn không thay đổi,” là cách diễn đạt hiện đại, tự nhiên và trang trọng cho ý nghĩa của toàn mệnh đề.
  terminology: “Đức Giê-su, Đấng Mê-si-a” thể hiện tự nhiên tên riêng kèm tước hiệu Χριστός; chú thích về phương án “Christ” là phù hợp. “Mãi mãi” diễn đạt gọn và tự nhiên εἰς τοὺς αἰῶνας.
