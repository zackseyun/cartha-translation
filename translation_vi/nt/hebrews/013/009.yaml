source:
  edition: SBLGNT
  text: διδαχαῖς ποικίλαις καὶ ξέναις μὴ παραφέρεσθε· καλὸν γὰρ χάριτι βεβαιοῦσθαι τὴν καρδίαν, οὐ βρώμασιν, ἐν οἷς οὐκ ὠφελήθησαν οἱ ⸀περιπατοῦντες.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/009.yaml
  text: Do not be carried away by various and strange teachings[a], for it is good for the heart to be strengthened by grace, not by foods[c][b], by which those who occupied themselves with them were not benefited.
translation:
  language: vi
  text: Đừng để mình bị cuốn theo những giáo huấn đa dạng và xa lạ; vì điều tốt là lòng được vững mạnh nhờ ân điển, chứ không nhờ các thức ăn,[a] mà những người chuyên tâm vào chúng chẳng nhận được ích lợi gì.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Các thức ăn” có lẽ chỉ những tập tục hoặc quy định liên quan đến thức ăn; tiếng Hy Lạp chỉ nói đơn giản là “các thức ăn”.
    reason: cultural_note
  - marker: b
    text: 'Cũng có thể dịch: “những người bước đi trong các điều ấy” hoặc “những người sống theo các điều ấy”. Tiếng Hy Lạp nói theo nghĩa đen là “những người bước đi trong chúng”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διδαχαῖς ποικίλαις καὶ ξέναις
  choice: những giáo huấn đa dạng và xa lạ
  rationale: “Giáo huấn” diễn đạt tự nhiên nội dung được truyền dạy mà không hàm ý một hệ thống giáo lý đã định hình; “đa dạng và xa lạ” giữ cả ý về nhiều loại và tính không thuộc về sứ điệp quen nhận.
- source_word: μὴ παραφέρεσθε
  choice: Đừng để mình bị cuốn theo
  rationale: Giữ sắc thái bị động và hình ảnh bị cuốn lệch hướng của động từ, đồng thời diễn đạt tự nhiên bằng tiếng Việt hiện đại.
- source_word: χάριτι βεβαιοῦσθαι τὴν καρδίαν
  choice: lòng được vững mạnh nhờ ân điển
  rationale: “Nhờ” thể hiện cách hiểu công cụ của cách Dative; “được vững mạnh” giữ dạng bị động và trường nghĩa làm cho chắc vững; “lòng” bảo tồn hình ảnh Kinh Thánh về trung tâm con người bên trong.
- source_word: οὐ βρώμασιν
  choice: chứ không nhờ các thức ăn
  rationale: Dịch trực tiếp danh từ “thức ăn”, không tự ý thu hẹp thành luật ăn kiêng, lễ nghi thực phẩm hay bữa ăn tế lễ.
- source_word: οἱ περιπατοῦντες
  choice: những người sống theo các điều ấy
  rationale: περιπατέω theo nghĩa bóng chỉ lối sống hay cách hành xử. Cách dịch này tự nhiên hơn lối dịch từng chữ “đi trong chúng” và vẫn giữ ý người ta định hướng đời sống theo những thực hành liên quan đến thức ăn.
- source_word: οὐκ ὠφελήθησαν
  choice: chẳng nhận được ích lợi gì
  rationale: 'Diễn đạt tự nhiên kết quả phủ định của dạng bị động: họ không được những điều ấy làm cho có ích.'
theological_decisions:
- issue: Đối tượng được gọi là “các thức ăn” và sự tương phản với ân điển
  choice: Giữ nguyên “các thức ăn” trong chính văn, đồng thời chú thích rằng từ này có thể chỉ các tập tục hoặc quy định liên quan đến thức ăn.
  alternative: Xác định cụ thể là thức ăn tế lễ hoặc toàn bộ luật lệ ăn uống Do Thái.
  rationale: Nguyên văn chỉ nói βρώμασιν, nên bản dịch không thu hẹp hoặc mở rộng đối tượng vượt quá chứng cứ; sự tương phản giữa ân điển và việc dựa vào các thực hành về thức ăn vẫn được bảo tồn.
- issue: Ý nghĩa của “lòng”
  choice: Giữ “lòng” như trung tâm đời sống bên trong.
  alternative: Dịch thành “tâm trí” hoặc “con người bên trong”.
  rationale: καρδία mang sức nặng nhân học và thần học trong ngôn ngữ Kinh Thánh; giữ hình ảnh này tránh làm phẳng nghĩa.
- issue: Sắc thái của βεβαιοῦσθαι
  choice: được vững mạnh
  alternative: được xác lập; được làm cho vững chắc
  rationale: Động từ có thể mang các sắc thái làm vững mạnh, xác lập hoặc làm cho chắc chắn. “Được vững mạnh” tự nhiên trong tiếng Việt mà không loại bỏ hoàn toàn các sắc thái gần kề.
translation_notes:
  register: Văn phong trang trọng, rõ ràng và hiện đại. Câu được tái cấu trúc nhẹ để tiếng Việt tự nhiên, nhưng vẫn giữ quan hệ lập luận “vì”, sự tương phản “nhờ ân điển/chứ không nhờ các thức ăn”, dạng bị động và tính khái quát có chủ ý của nguyên văn.
