id: HEB.13.7
reference: Hebrews 13:7
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Μνημονεύετε τῶν ἡγουμένων ὑμῶν, οἵτινες ἐλάλησαν ὑμῖν τὸν λόγον τοῦ θεοῦ, ὧν ἀναθεωροῦντες τὴν ἔκβασιν τῆς ἀναστροφῆς μιμεῖσθε τὴν πίστιν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/007.yaml
  text: Remember your leaders[a], who spoke the word of God to you. As you consider the outcome of their way of life[b], imitate their faith.
translation:
  language: vi
  text: Hãy nhớ đến những người lãnh đạo anh chị em, những người đã truyền lời Đức Chúa Trời cho anh chị em. Khi suy xét kết quả của nếp sống họ,[a] hãy noi theo đức tin của họ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Kết quả” cũng có thể dịch là “kết cuộc”; theo một số cách hiểu, từ này đặc biệt chỉ cách họ qua đời.
    reason: lexical_alternative
  - marker: b
    text: Hoặc “lòng trung tín của họ.” Từ Hy Lạp có thể mang nghĩa “đức tin” hoặc “lòng trung tín.”
    reason: alternative_reading
lexical_decisions:
- source_word: Μνημονεύετε
  choice: Hãy nhớ
  rationale: Mệnh lệnh hiện tại kêu gọi sự ghi nhớ liên tục; “hãy nhớ” tự nhiên trong tiếng Việt và có thể mang sắc thái duy trì trong ngữ cảnh.
- source_word: τῶν ἡγουμένων ὑμῶν
  choice: những người lãnh đạo anh chị em
  rationale: Chỉ những người lãnh đạo được cộng đồng nhìn nhận; cách dịch này giữ thẩm quyền thực sự nhưng tránh sắc thái chính trị hoặc chuyên quyền của “người cai trị”.
- source_word: οἵτινες ἐλάλησαν ὑμῖν τὸν λόγον τοῦ θεοῦ
  choice: là những người đã nói lời Đức Chúa Trời cho anh chị em
  rationale: Giữ nghĩa trực tiếp của λαλέω là “nói” và cách diễn đạt Kinh Thánh quen thuộc “lời Đức Chúa Trời”.
- source_word: ἀναθεωροῦντες
  choice: Khi suy xét
  rationale: Diễn tả việc quan sát và suy ngẫm kỹ lưỡng, chứ không chỉ thoáng nhìn.
- source_word: τὴν ἔκβασιν τῆς ἀναστροφῆς
  choice: kết quả cuộc đời của họ
  rationale: “Kết quả” giữ phạm vi nghĩa rộng của ἔκβασις, còn “cuộc đời” diễn đạt tự nhiên ý niệm về cách sống/hạnh kiểm của ἀναστροφή trong cấu trúc tiếng Việt.
- source_word: μιμεῖσθε
  choice: hãy noi theo
  rationale: Là mệnh lệnh trực tiếp; “noi theo” tự nhiên, trang trọng và truyền đạt ý bắt chước tấm gương.
- source_word: τὴν πίστιν
  choice: đức tin của họ
  rationale: Giữ cách dịch mặc định của πίστις là “đức tin”; khả năng mang nghĩa “lòng trung tín” được bảo tồn trong chú thích.
theological_decisions:
- issue: Nghĩa của πίστις khi nói về phẩm chất có thể noi theo của con người
  choice: đức tin
  alternative: lòng trung tín
  rationale: Cả “đức tin” lẫn “lòng trung tín” đều phù hợp với ngữ cảnh. Bản văn chính dùng “đức tin” nhưng chú thích giữ lại khả năng thứ hai, không xóa bỏ độ căng giải nghĩa.
- issue: ἔκβασις có chỉ riêng cái chết hoặc sự tử đạo của những người lãnh đạo hay không
  choice: kết quả
  alternative: kết cuộc; hoặc, theo một số cách hiểu, cách họ qua đời
  rationale: Từ Hy Lạp có thể chỉ kết quả hoặc kết cuộc nói chung. Không nên đưa sự tử đạo hay cái chết vào bản văn chính khi câu này không nói rõ như vậy.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh chị em” để chỉ cộng đồng độc giả và “noi theo” thay cho cách nói cứng hơn là “bắt chước”. Các dấu chú thích [a], [b] đều xuất hiện trong bản văn chính ngay tại cụm từ liên quan.
