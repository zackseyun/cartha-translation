id: HEB.13.22
reference: Hebrews 13:22
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Παρακαλῶ δὲ ὑμᾶς, ἀδελφοί, ἀνέχεσθε τοῦ λόγου τῆς παρακλήσεως, καὶ γὰρ διὰ βραχέων ἐπέστειλα ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/022.yaml
  text: I urge you[a], brothers, bear with this word of exhortation[b], for I have written to you briefly.
translation:
  language: vi
  text: Thưa anh em[a], tôi khuyên anh em hãy kiên nhẫn đón nhận lời khuyên nhủ này[b], vì tôi đã viết vắn tắt cho anh em.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “anh chị em”; tiếng Hy Lạp dùng từ “anh em”, nhưng từ này có thể được dùng để gọi toàn thể hội chúng, gồm cả nam lẫn nữ.
    reason: lexical_alternative
  - marker: b
    text: “Lời khuyên nhủ” cũng có thể dịch là “thông điệp khích lệ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Παρακαλῶ
  choice: tôi khuyên
  rationale: Diễn đạt tự nhiên lời kêu gọi tha thiết mang tính cá nhân; trong ngữ cảnh này phù hợp hơn cách trang trọng như “tôi khẩn nài”.
- source_word: δὲ
  choice: không dịch thành một từ riêng
  rationale: Tiểu từ đánh dấu sự chuyển ý nhẹ sang lời kết; trật tự và cách mở đầu bằng lời xưng hô trong tiếng Việt đã thể hiện sự chuyển ý tự nhiên, nên không cần thêm “nhưng” hoặc “bây giờ”.
- source_word: ἀδελφοί
  choice: anh em
  rationale: Giữ hình thức giống đực của lời xưng hô Hy Lạp; trong cách dùng cộng đồng, từ này có thể bao gồm cả nam lẫn nữ, được ghi chú để tránh thu hẹp đối tượng.
- source_word: ἀνέχεσθε
  choice: hãy kiên nhẫn đón nhận
  rationale: Trong lời yêu cầu về một thông điệp, cụm này truyền đạt ý chịu khó tiếp nhận và chấp nhận, tự nhiên hơn “chịu đựng” vốn dễ gợi sắc thái quá tiêu cực.
- source_word: τοῦ λόγου τῆς παρακλήσεως
  choice: lời khuyên nhủ này
  rationale: λόγος chỉ thông điệp được truyền đạt, còn παράκλησις có dải nghĩa khuyên nhủ, thúc giục và khích lệ. “Lời khuyên nhủ” giữ được trọng tâm mà vẫn tự nhiên; “này” làm rõ tác giả đang nói đến chính thông điệp hiện tại, dù tính chỉ định chỉ hàm ẩn trong nguyên văn.
- source_word: καὶ γὰρ
  choice: vì
  rationale: Kết hợp từ này đưa ra lý do hỗ trợ cho lời yêu cầu trước đó; “vì” diễn đạt gọn và đúng quan hệ giải thích trong tiếng Việt.
- source_word: διὰ βραχέων
  choice: chỉ viết vắn tắt
  rationale: Thành ngữ có nghĩa “vắn tắt” hoặc “bằng ít lời”; thêm “chỉ” truyền đạt sắc thái hỗ trợ của καὶ trong lập luận rằng tác phẩm tương đối ngắn.
- source_word: ἐπέστειλα ὑμῖν
  choice: tôi ... viết ... cho anh em
  rationale: Động từ aorist chỉ việc viết hoặc gửi thông điệp; tiếng Việt không bắt buộc đánh dấu thì, và “viết cho anh em” phù hợp với bức thư đang ở trước người nhận.
theological_decisions:
- issue: Phạm vi của lời xưng hô ἀδελφοί
  choice: anh em
  alternative: anh chị em
  rationale: Bản văn chính giữ hình thức giống đực của tiếng Hy Lạp và cách xưng hô quen thuộc trong tiếng Việt, đồng thời chú thích rằng lời gọi có thể hướng đến toàn thể hội chúng, gồm cả nam lẫn nữ.
- issue: Sắc thái của παράκλησις
  choice: khuyên nhủ
  alternative: khích lệ
  rationale: Từ Hy Lạp có thể chỉ cả sự thúc giục lẫn an ủi, khích lệ. Ngữ cảnh là lời tác giả yêu cầu độc giả tiếp nhận nội dung thư, nên “khuyên nhủ” thích hợp nhưng không loại trừ sắc thái khích lệ, được bảo lưu trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và phù hợp lời kết thư. Lặp “anh em” để lời xưng hô và tân ngữ rõ ràng trong tiếng Việt; tránh lối diễn đạt cổ hoặc sắc thái tiêu cực quá mức của “chịu đựng”.
