  rationale: Đổi «để chuộc tội» thành «vì tội» để phản ánh sát hơn περὶ ἁμαρτίας mà không áp đặt một cách diễn giải hẹp hơn. Di chuyển các ký hiệu chú thích đến ngay sau những từ/cụm từ được chú giải. Những yếu tố còn lại của bản dịch được giữ nguyên vì trung thành với nguyên văn và phù hợp tiếng Việt hiện đại.
