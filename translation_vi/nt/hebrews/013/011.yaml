reference: Hebrews 13:11
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὧν γὰρ εἰσφέρεται ζῴων τὸ αἷμα περὶ ἁμαρτίας εἰς τὰ ἅγια διὰ τοῦ ἀρχιερέως, τούτων τὰ σώματα κατακαίεται ἔξω τῆς παρεμβολῆς·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/011.yaml
  text: For the bodies of those animals whose blood is brought into the holy places for sin by the high priest are burned outside the camp[a][b].
translation:
  language: vi
  text: Vì xác của những con vật có máu được thượng tế đem vào khu thánh[a] vì tội thì bị thiêu[b] ngoài trại.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “vào nơi thánh.” Tiếng Hy Lạp dùng dạng số nhiều, theo lối nói nghi lễ để chỉ phạm vi thánh của đền tạm.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “bị thiêu rụi.” Động từ Hy Lạp có thể nhấn mạnh việc đốt hoàn toàn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὧν ... ζῴων / τούτων τὰ σώματα
  choice: xác của những con vật
  rationale: Cấu trúc quan hệ rồi được nối lại bằng đại từ chỉ định nói về các con vật dùng làm sinh tế. “Xác” tự nhiên và chính xác trong ngữ cảnh thân thể động vật đã bị giết để dâng tế.
- source_word: γὰρ
  choice: Vì
  rationale: Từ này đưa ra lời giải thích làm cơ sở cho ý trước đó; “Vì” giữ rõ mối liên hệ lập luận.
- source_word: εἰσφέρεται
  choice: được ... đem vào
  rationale: Giữ thể bị động và diễn đạt tự nhiên hành động đưa máu vào khu vực thánh.
- source_word: τὸ αἷμα
  choice: máu
  rationale: Dịch trực tiếp thuật ngữ chỉ máu sinh tế.
- source_word: περὶ ἁμαρτίας
  choice: để chuộc tội
  rationale: Trong ngữ cảnh tế lễ, cụm từ chỉ mục đích liên quan đến việc xử lý tội lỗi. Cách dịch này tự nhiên trong tiếng Việt nhưng không thu hẹp thành tên gọi kỹ thuật “lễ vật chuộc tội”.
- source_word: εἰς τὰ ἅγια
  choice: vào nơi thánh
  rationale: Cụm số nhiều theo lối dùng nghi lễ chỉ phạm vi thánh của đền tạm; “nơi thánh” là cách diễn đạt trang trọng, dễ hiểu và không xác định quá hẹp là Nơi Chí Thánh.
- source_word: διὰ τοῦ ἀρχιερέως
  choice: được thượng tế đem
  rationale: διά với sở hữu cách biểu thị tác nhân. Lồng tác nhân vào động từ tạo câu tiếng Việt tự nhiên mà vẫn giữ vai trò của thượng tế.
- source_word: κατακαίεται
  choice: bị thiêu
  rationale: “Bị thiêu” diễn đạt hành động đốt xác theo nghi lễ; sắc thái đốt hoàn toàn được ghi ở chú thích.
- source_word: ἔξω τῆς παρεμβολῆς
  choice: ngoài trại
  rationale: Đây là cách diễn đạt quen thuộc, chính xác cho trại của dân Israel trong bối cảnh đền tạm và đồng vắng.
theological_decisions:
- issue: Phạm vi nghi lễ của εἰς τὰ ἅγια
  choice: nơi thánh
  alternative: Nơi Chí Thánh; khu thánh
  rationale: Cách dùng τὰ ἅγια trong thư Hê-bơ-rơ có thể chỉ phạm vi thánh nói chung. Câu này gợi đến nghi thức chuộc tội, nhưng bản Hy Lạp không buộc phải xác định riêng Nơi Chí Thánh; vì vậy bản dịch giữ độ rộng của cụm từ.
- issue: Ý nghĩa của περὶ ἁμαρτίας
  choice: để chuộc tội
  alternative: vì tội lỗi; làm lễ vật chuộc tội
  rationale: Ngữ cảnh hiến tế cho thấy máu được đem vào nhằm xử lý tội lỗi. Không dùng “làm lễ vật chuộc tội” để tránh biến cụm giới từ thành một tên lễ vật cụ thể hơn điều văn bản trực tiếp nói.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “thượng tế” cho ἀρχιερεύς, “nơi thánh” cho τὰ ἅγια và “ngoài trại” để giữ hình ảnh nghi lễ của Israel. Hai dấu chú thích [a], [b] được đặt ngay sau mệnh đề liên quan.
