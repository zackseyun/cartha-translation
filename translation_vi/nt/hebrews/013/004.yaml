revisions:
- from: Mọi người phải tôn trọng hôn nhân[a], và giữ cho chốn gối chăn không bị ô uế[b], vì Đức Chúa Trời sẽ xét xử những kẻ gian dâm và ngoại tình.
  to: Hôn nhân phải được mọi người tôn trọng[a], và quan hệ vợ chồng phải trong sạch, vì Đức Chúa Trời sẽ xét xử những người phạm tội vô luân về tình dục và những kẻ ngoại tình.
  rationale: Bản sửa giữ cách hiểu khuyên bảo phù hợp với mạch khuyến huấn của Hê-bơ-rơ 13, đồng thời chú thích bảo tồn cả sự mơ hồ về động từ không được nêu và các khả năng chính của ἐν πᾶσιν. “Quan hệ vợ chồng” diễn đạt hoán dụ κοίτη một cách hiện đại và đúng ngữ cảnh hơn “chốn gối chăn.” Cụm “phạm tội vô luân về tình dục” bảo toàn tính bao quát của πόρνους, không đồng nhất nó với μοιχούς.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T00:27:04Z'
review_pass:
  verdict: revise
  source_fidelity: Bản nháp truyền đạt đúng cấu trúc khuyên bảo có thể có của mệnh đề đầu, giữ được sự phân biệt giữa πόρνους (vô luân tình dục theo nghĩa rộng) và μοιχούς (ngoại tình), và dịch κρινεῖ là “sẽ xét xử” một cách không diễn giải quá mức. Tuy nhiên, “chốn gối chăn” dễ chỉ một địa điểm, trong khi κοίτη ở đây là hoán dụ chỉ sinh hoạt/quan hệ tình dục; cần dùng cách nói hiện đại, chính xác hơn.
  naturalness: “Mọi người phải tôn trọng hôn nhân” tự nhiên, nhưng làm chủ thể “mọi người” quá nổi bật so với trọng tâm là hôn nhân được tôn trọng. “Hôn nhân phải được mọi người tôn trọng” rõ và sát hơn. “Quan hệ vợ chồng phải trong sạch” là cách diễn đạt hiện đại, trang trọng, làm rõ hoán dụ mà không giữ hình ảnh “chốn” thiếu tự nhiên.
  terminology: Giữ “hôn nhân,” “Đức Chúa Trời,” “sẽ xét xử,” và “ngoại tình.” Thay “những kẻ gian dâm” bằng “những người phạm tội vô luân về tình dục” để phản ánh phạm vi rộng của πόρνους trong tiếng Việt hiện đại và tránh để “gian dâm” bị hiểu hẹp hoặc lẫn với ngoại tình.
  issues:
