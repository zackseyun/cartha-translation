source:
  edition: SBLGNT
  text: τίμιος ὁ γάμος ἐν πᾶσιν καὶ ἡ κοίτη ἀμίαντος, πόρνους ⸀γὰρ καὶ μοιχοὺς κρινεῖ ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/004.yaml
  text: Let marriage be held in honor among all[a], and the marriage bed be undefiled[b], for God will judge the sexually immoral and adulterers.
translation:
  language: vi
  text: Hôn nhân phải được mọi người tôn trọng[a], và quan hệ vợ chồng phải trong sạch, vì Đức Chúa Trời sẽ xét xử những người phạm tội vô luân về tình dục và những kẻ ngoại tình.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Hôn nhân là điều đáng tôn trọng giữa mọi người” hoặc “Hôn nhân là điều đáng tôn trọng bởi mọi người.” Tiếng Hy Lạp không nêu động từ trong mệnh đề đầu, nên câu này có thể được hiểu là lời khuyên hoặc lời trần thuật.'
    reason: alternative_reading
lexical_decisions:
- source_word: τίμιος
  choice: phải tôn trọng
  rationale: Diễn đạt sắc thái quý trọng và tôn kính của τίμιος; dạng khuyên bảo phù hợp với chuỗi lời khuyên trong Hê-bơ-rơ 13, nhưng cách hiểu trần thuật vẫn được giữ trong chú thích.
- source_word: γάμος
  choice: hôn nhân
  rationale: Trong ngữ cảnh này, γάμος chỉ quan hệ hay thể chế hôn nhân, không phải lễ cưới.
- source_word: ἐν πᾶσιν
  choice: mọi người
  rationale: Cụm số nhiều này nhiều khả năng chỉ người. Cấu trúc tiếng Việt “Mọi người phải...” truyền đạt tự nhiên ý hôn nhân phải được tất cả mọi người tôn trọng; khả năng hiểu là “giữa mọi người” được ghi nhận trong chú thích.
- source_word: κοίτη
  choice: chốn gối chăn
  rationale: κοίτη có nghĩa đen là giường và ở đây hoán dụ cho quan hệ tình dục trong hôn nhân. “Chốn gối chăn” là cách nói trang trọng, dễ hiểu và giữ được hình ảnh của nguyên văn.
- source_word: ἀμίαντος
  choice: không bị ô uế
  rationale: Giữ sắc thái đạo đức và thanh sạch của ἀμίαντος, mạnh hơn cách nói chung chung “trong sạch” nhưng vẫn tự nhiên.
- source_word: πόρνους
  choice: những kẻ gian dâm
  rationale: πόρνοι chỉ những người phạm tội vô luân về tình dục theo nghĩa rộng. “Gian dâm” là cách diễn đạt Kinh Thánh quen thuộc, phân biệt được với hành vi ngoại tình cụ thể ở vế sau.
- source_word: μοιχούς
  choice: những kẻ ngoại tình
  rationale: μοιχοί chỉ cụ thể những người phạm tội ngoại tình; bản dịch bảo toàn sự phân biệt với πόρνοι.
- source_word: κρινεῖ
  choice: sẽ xét xử
  rationale: Thì tương lai nói đến sự phán xét của Đức Chúa Trời. “Xét xử” không diễn giải quá mức thành “kết án”.
- source_word: γάρ
  choice: vì
  rationale: Biểu thị lý do làm nền cho lời khuyên và lời cảnh báo, tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Mệnh đề đầu là lời khuyên hay lời trần thuật
  choice: 'Lời khuyên: “Mọi người phải tôn trọng hôn nhân”'
  alternative: 'Lời trần thuật: “Hôn nhân là điều đáng tôn trọng giữa mọi người”'
  rationale: Nguyên văn Hy Lạp không có động từ hữu hạn nên cả hai cách đều khả dĩ. Mạch các lời khuyên đạo đức ngắn trong Hê-bơ-rơ 13 nghiêng về cách hiểu khuyên bảo; chú thích bảo tồn cách hiểu trần thuật.
- issue: Phạm vi của ἐν πᾶσιν
  choice: “mọi người” theo nghĩa hôn nhân phải được mọi người tôn trọng
  alternative: “giữa mọi người” hoặc, ít có khả năng hơn trong ngữ cảnh này, “về mọi phương diện”
  rationale: Hình thái Hy Lạp cho phép sắc thái “giữa mọi người” hay “bởi mọi người” mà không xác định hoàn toàn quan hệ cú pháp. Bản chính dùng câu tiếng Việt tự nhiên, còn chú thích nêu cách diễn đạt gần hình thức nguyên văn hơn.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. “Chốn gối chăn” giữ hình ảnh kín đáo của κοίτη mà vẫn chỉ rõ bối cảnh hôn nhân; “Đức Chúa Trời” phù hợp văn phong Kinh Thánh Tin Lành phổ thông. Các dấu chú thích [a], [b] đều xuất hiện trong bản văn.
