    rationale: Không cần chú thích riêng cho một hoán dụ khi bản dịch chính đã dùng cách diễn đạt rõ ràng, tự nhiên. Chú thích cần giữ sự mơ hồ thực sự của mệnh đề đầu và phạm vi ἐν πᾶσιν.
