  - severity: low
    issue: “Là nơi” làm yếu quan hệ trực tiếp “từ đó.”
    rationale: Cấu trúc này có thể hiểu được, nhưng “từ đó” phản ánh rõ hơn ἐξ οὗ và bảo toàn hình ảnh nguyên ngữ.
