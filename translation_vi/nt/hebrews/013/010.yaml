  text: ἔχομεν θυσιαστήριον ἐξ οὗ φαγεῖν οὐκ ἔχουσιν ἐξουσίαν οἱ τῇ σκηνῇ λατρεύοντες.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/010.yaml
  text: We have an altar from which those who serve at the tabernacle have no right to eat[a][b].
translation:
  language: vi
  text: Chúng ta có một bàn thờ mà những người phụng sự nơi Đền Tạm không có quyền ăn từ đó[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch sát hơn: “những người phụng sự trong Lều Tạm.” Cụm từ này chỉ những người thi hành việc phụng sự tại nơi thánh theo giao ước cũ.'
    reason: lexical_alternative
  - marker: b
    text: '“Bàn thờ” được hiểu theo nhiều cách: chính Đấng Christ, thập tự giá, bàn thờ trên trời, hoặc những phước ích từ lễ dâng của Đấng Christ. Tiếng Hy Lạp ở đây chỉ nêu hình ảnh này mà không nói rõ nó ám chỉ điều nào.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἔχομεν
  choice: Chúng ta có
  rationale: Giữ thì hiện tại và sắc thái bao gồm cả tác giả lẫn độc giả.
- source_word: θυσιαστήριον
  choice: một bàn thờ
  rationale: Dịch trực tiếp danh từ chỉ bàn thờ, không diễn giải thành thập tự giá, sinh tế hay chính Đấng Christ.
- source_word: ἐξ οὗ φαγεῖν
  choice: là nơi ... ăn lễ vật
  rationale: Diễn đạt tự nhiên trong tiếng Việt ý ăn từ những gì thuộc về bàn thờ; thêm “lễ vật” để tránh hình ảnh khó hiểu là ăn chính bàn thờ, nhưng không xác định cụ thể vật hiến tế nào.
- source_word: οὐκ ἔχουσιν ἐξουσίαν
  choice: không có quyền
  rationale: Truyền đạt sự thiếu quyền hay đặc ân được phép dự phần trong bối cảnh nghi lễ.
- source_word: οἱ τῇ σκηνῇ λατρεύοντες
  choice: những người phục vụ tại Đền Tạm
  rationale: λατρεύω ở đây chỉ việc phụng sự trong nghi lễ; σκηνή trong mạch văn Hê-bơ-rơ gợi đến nơi thánh của giao ước cũ, nên “Đền Tạm” vừa rõ nghĩa vừa quen thuộc.
theological_decisions:
- issue: Đối tượng cụ thể mà “bàn thờ” trong Hê-bơ-rơ 13:10 ám chỉ
  choice: Giữ nguyên hình ảnh “bàn thờ” mà không xác định đối tượng trong chính văn.
  alternative: Chính Đấng Christ; thập tự giá; bàn thờ trên trời; hoặc những phước ích từ lễ hiến dâng của Đấng Christ.
  rationale: Nguyên văn không giải thích cụ thể hình ảnh này, và các cách hiểu khác nhau đều tồn tại; bản dịch không nên âm thầm thu hẹp ý nghĩa thần học.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “Đền Tạm” là thuật ngữ Kinh Thánh quen thuộc; cấu trúc câu được điều chỉnh cho tự nhiên mà vẫn giữ hình ảnh nghi lễ và sự mơ hồ thần học của nguyên văn.
