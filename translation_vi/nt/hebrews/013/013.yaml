source:
  edition: SBLGNT
  text: τοίνυν ἐξερχώμεθα πρὸς αὐτὸν ἔξω τῆς παρεμβολῆς, τὸν ὀνειδισμὸν αὐτοῦ φέροντες.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/013.yaml
  text: Therefore[a], let us go out to him outside the camp, bearing his reproach.
translation:
  language: vi
  text: Vậy, chúng ta hãy đến với Ngài ở ngoài trại, mang sự sỉ nhục của Ngài.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “bên ngoài nơi đóng trại.” Cụm “sự sỉ nhục của Ngài” chỉ sự nhục nhã gắn với Ngài; trong văn mạch, người tin được kêu gọi cùng mang sự nhục nhã ấy. Hình ảnh “ngoài trại” gợi các câu 11–12, về tế lễ và việc Chúa Giê-su chịu khổ ngoài cổng thành.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοίνυν
  choice: Vậy
  rationale: Tiểu từ suy luận nối lời khuyên này với lập luận ngay trước đó, nhất là câu 11–12; “Vậy” tự nhiên và giữ rõ quan hệ kết luận.
- source_word: ἐξερχώμεθα
  choice: chúng ta hãy ra ngoài
  rationale: Động từ giả định cách ngôi thứ nhất số nhiều mang ý khích lệ; cấu trúc “chúng ta hãy” diễn đạt lời kêu gọi chung bằng tiếng Việt hiện đại.
- source_word: πρὸς αὐτὸν
  choice: mà đến với Ngài
  rationale: πρός với đối cách chỉ sự chuyển động hướng đến một người. “Đến với Ngài” tự nhiên trong tiếng Việt, còn đại từ giữ nguyên cách diễn đạt của Hy Lạp và quy chiếu theo văn cảnh.
- source_word: ἔξω τῆς παρεμβολῆς
  choice: ngoài trại
  rationale: παρεμβολή chỉ trại hoặc nơi đóng trại. “Ngoài trại” ngắn gọn, dễ hiểu và giữ hình ảnh tế lễ cùng bối cảnh hoang mạc.
- source_word: τὸν ὀνειδισμὸν αὐτοῦ
  choice: sự sỉ nhục Ngài đã chịu
  rationale: ὀνειδισμός bao hàm lời nhục mạ, sự ô nhục và nỗi hổ thẹn do người khác gây ra. Cách dịch này làm rõ nghĩa khách thể tự nhiên của đại từ sở hữu trong tiếng Việt mà không đổi đối tượng của sự sỉ nhục.
- source_word: φέροντες
  choice: mang lấy
  rationale: Phân từ hiện tại diễn tả hành động đi kèm lời kêu gọi. “Mang lấy” giữ hình ảnh gánh chịu và sắc thái chủ động chấp nhận, thay vì chỉ diễn giải là “chịu đựng”.
theological_decisions:
- issue: Đối tượng của đại từ αὐτόν
  choice: Giữ đại từ “Ngài”, quy chiếu đến Chúa Giê-su theo câu 12
  alternative: Thay trực tiếp bằng “Chúa Giê-su”
  rationale: Bản Hy Lạp dùng đại từ và văn cảnh xác định rõ đối tượng; giữ đại từ tránh bổ sung danh xưng không có trong câu.
- issue: Ý nghĩa của “ngoài trại”
  choice: Giữ nguyên hình ảnh trại
  alternative: Diễn giải thành “bên ngoài cơ cấu tôn giáo” hoặc “bên ngoài cộng đồng”
  rationale: Hình ảnh liên hệ với việc đem xác sinh tế ra ngoài trại trong câu 11 và với việc Chúa Giê-su chịu khổ ngoài cổng thành trong câu 12. Diễn giải trừu tượng sẽ thu hẹp sức gợi liên văn bản.
- issue: Quan hệ trong cụm τὸν ὀνειδισμὸν αὐτοῦ
  choice: “sự sỉ nhục Ngài đã chịu”
  alternative: “sự sỉ nhục vì Ngài” hoặc “sự sỉ nhục của Ngài”
  rationale: Đại từ sở hữu có thể diễn tả sự sỉ nhục gắn với Ngài; trong văn cảnh, đó là sự nhục nhã hướng vào Chúa Giê-su mà người tin cùng mang. Cách dịch được chọn tự nhiên hơn tiếng Việt nhưng chú thích vẫn bảo lưu khả năng dịch sát cấu trúc.
translation_notes:
  register: Văn phong hiện đại, trang trọng và khích lệ. Dùng “Ngài” cho đại từ chỉ Chúa Giê-su theo văn cảnh; giữ hình ảnh “ngoài trại” thay vì giải nghĩa theo một lập trường giáo phái.
