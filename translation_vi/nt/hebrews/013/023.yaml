  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh chị em” cho đại từ số nhiều chỉ cộng đồng người nhận, nhưng giữ “anh em chúng ta” ở danh xưng số ít dành cho Ti-mô-thê.
