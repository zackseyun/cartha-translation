  text: γινώσκετε τὸν ἀδελφὸν ⸀ἡμῶν Τιμόθεον ἀπολελυμένον, μεθ’ οὗ ἐὰν τάχιον ἔρχηται ὄψομαι ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/023.yaml
  text: Know that our brother Timothy has been released[a], with whom I will see you if he comes soon.
translation:
  language: vi
  text: Anh chị em hãy biết rằng Ti-mô-thê, người anh em của chúng ta, đã được trả tự do[a]. Nếu anh ấy đến sớm, tôi sẽ cùng anh ấy gặp anh chị em.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “đã được phóng thích,” có lẽ là khỏi cảnh tù đày; động từ này cũng có thể mang nghĩa “đã được sai đi” hoặc “đã được cho về.” Tuy nhiên, “đã được trả tự do” phù hợp nhất với ngữ cảnh.
    reason: lexical_alternative
lexical_decisions:
- source_word: γινώσκετε
  choice: Hãy biết rằng
  rationale: Giữ lực mệnh lệnh của động từ hiện tại, đồng thời diễn đạt tự nhiên như một lời thông báo trong thư.
- source_word: τὸν ἀδελφὸν ἡμῶν
  choice: anh em chúng ta
  rationale: Giữ cách gọi thân thuộc trong cộng đồng đức tin; ở đây danh từ số ít giống đực chỉ Ti-mô-thê.
- source_word: Τιμόθεον
  choice: Ti-mô-thê
  rationale: Phiên âm tên riêng theo cách dùng quen thuộc trong tiếng Việt.
- source_word: ἀπολελυμένον
  choice: đã được trả tự do
  rationale: Phân từ hoàn thành bị động diễn tả một hành động đã hoàn tất và còn liên hệ đến hiện tại. Cách dịch này phù hợp nhất với khả năng được thả khỏi sự giam giữ, nhưng chú thích vẫn bảo lưu các nghĩa khác có thể có.
- source_word: μεθ’ οὗ
  choice: cùng anh ấy
  rationale: Diễn đạt tự nhiên quan hệ đồng hành với Ti-mô-thê trong chuyến gặp người nhận thư.
- source_word: ἐὰν τάχιον ἔρχηται
  choice: Nếu anh ấy sớm đến
  rationale: Giữ tính điều kiện của ἐάν với động từ giả định; τάχιον có hình thức so sánh nhưng trong ngữ cảnh được hiểu tự nhiên là “sớm”.
- source_word: ὄψομαι ὑμᾶς
  choice: tôi sẽ ... gặp anh chị em
  rationale: “Gặp” truyền đạt trực tiếp ý của ὁράω trong ngữ cảnh dự định đến với người nhận thư, mà không diễn giải mạnh thành “thăm viếng”.
