revisions:
- from: Hãy nghe theo những người lãnh đạo anh em và thuận phục họ,[a] vì họ đang tỉnh thức canh giữ linh hồn anh em, như những người sẽ phải khai trình. Hãy để họ làm việc ấy với niềm vui, chứ không phải than thở, vì điều đó chẳng ích lợi gì cho anh em.
  to: Hãy nghe theo những người lãnh đạo anh em và thuận phục họ,[a] vì họ đang canh thức chăm nom linh hồn anh em, như những người sẽ phải khai trình. Để họ có thể làm việc ấy với niềm vui, chứ không phải than thở, vì như vậy sẽ chẳng ích lợi gì cho anh em.
  rationale: Bản sửa chỉ điều chỉnh quan hệ cú pháp của mệnh đề ἵνα và làm tự nhiên hơn cách diễn đạt ἀγρυπνοῦσιν. “Như vậy” trong câu cuối nối với việc những người lãnh đạo phải làm công việc này trong than thở, đồng thời không giải quyết quá mức phạm vi tham chiếu vốn được diễn đạt ngắn gọn trong nguyên ngữ.
