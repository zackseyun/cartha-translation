id: HEB.13.17
reference: Hebrews 13:17
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Πείθεσθε τοῖς ἡγουμένοις ὑμῶν καὶ ὑπείκετε, αὐτοὶ γὰρ ἀγρυπνοῦσιν ὑπὲρ τῶν ψυχῶν ὑμῶν ὡς λόγον ἀποδώσοντες, ἵνα μετὰ χαρᾶς τοῦτο ποιῶσιν καὶ μὴ στενάζοντες, ἀλυσιτελὲς γὰρ ὑμῖν τοῦτο.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/017.yaml
  text: Be persuaded by your leaders and yield to them[a], for they are keeping watch over your souls as those who will give an account, so that they may do this with joy and not with groaning, for this would be unprofitable for you.
translation:
  language: vi
  text: Hãy nghe theo những người lãnh đạo anh em và thuận phục họ,[a] vì họ đang canh thức chăm nom linh hồn anh em, như những người sẽ phải khai trình. Để họ có thể làm việc ấy với niềm vui, chứ không phải than thở, vì như vậy sẽ chẳng ích lợi gì cho anh em.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Hãy vâng lời những người lãnh đạo anh em và thuận phục họ.” Từ Hy Lạp Πείθεσθε có thể mang nghĩa “vâng lời”, nhưng theo nghĩa sát hơn gợi ý việc được thuyết phục hoặc nghe theo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πείθεσθε
  choice: Hãy nghe theo
  rationale: Thể mệnh lệnh trung động/bị động có thể mang nghĩa được thuyết phục, tin theo, và theo nghĩa mở rộng là vâng lời. “Nghe theo” tự nhiên trong tiếng Việt, giữ sắc thái đáp ứng lời dẫn dắt hơn là chỉ tuân lệnh cách máy móc; phương án mạnh hơn được ghi ở chú thích.
- source_word: τοῖς ἡγουμένοις ὑμῶν
  choice: những người lãnh đạo anh em
  rationale: Chỉ những người đang đảm nhiệm vai trò dẫn dắt cộng đồng; cách dịch này rõ ràng, hiện đại và không tăng thêm sắc thái cai trị chuyên quyền.
- source_word: ὑπείκετε
  choice: thuận phục họ
  rationale: Động từ mang nghĩa nhường, thuận theo hoặc phục tùng. “Thuận phục” phân biệt được với Πείθεσθε, đồng thời giữ sức nặng của lời khuyên.
- source_word: ἀγρυπνοῦσιν
  choice: đang tỉnh thức canh giữ
  rationale: Giữ hình ảnh nguyên ngữ về sự thức canh, đồng thời diễn đạt tự nhiên trách nhiệm chăm nom đầy cảnh giác.
- source_word: τῶν ψυχῶν ὑμῶν
  choice: linh hồn anh em
  rationale: ψυχή có thể chỉ linh hồn, sự sống hoặc con người. “Linh hồn” giữ được sức nặng thuộc linh của ngữ cảnh mà không nhất thiết phủ nhận ý nghĩa toàn diện về con người.
- source_word: ὡς λόγον ἀποδώσοντες
  choice: như những người sẽ phải khai trình
  rationale: Diễn đạt trách nhiệm tương lai của các lãnh đạo phải báo cáo và chịu trách nhiệm; “khai trình” trang trọng nhưng vẫn dễ hiểu.
- source_word: μετὰ χαρᾶς
  choice: với niềm vui
  rationale: Dịch sát cấu trúc giới từ và tự nhiên trong tiếng Việt.
- source_word: στενάζοντες
  choice: than thở
  rationale: Giữ hình ảnh cụ thể của στενάζω là rên siết hoặc thở than, thay vì làm mờ thành nỗi buồn chung chung.
- source_word: ἀλυσιτελὲς
  choice: chẳng ích lợi gì
  rationale: Diễn đạt rõ nghĩa không có lợi, không hữu ích; tránh từ “có hại,” vốn có thể mạnh hơn nguyên ngữ.
theological_decisions:
- issue: Bản chất của lời khuyên đối với những người lãnh đạo cộng đồng
  choice: Lời này kêu gọi tín hữu nghe theo và thuận phục những người lãnh đạo có trách nhiệm, dựa trên sự chăm nom và việc họ phải khai trình.
  alternative: Dịch thành một mệnh lệnh vâng phục tuyệt đối đối với lãnh đạo.
  rationale: Hai động từ Πείθεσθε và ὑπείκετε diễn tả sự nghe theo cùng thái độ nhường thuận, nhưng không tự chúng xác lập quyền lực vô điều kiện. Mệnh đề giải thích đặt trọng tâm vào sự tỉnh thức chăm nom và trách nhiệm của các lãnh đạo.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và phù hợp lời khuyên dành cho cộng đồng. Dùng “anh em” theo cách xưng hô số nhiều quen thuộc trong văn Kinh Thánh; tránh thuật ngữ hệ phái và tránh tăng sắc thái chuyên quyền.
