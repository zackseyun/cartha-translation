id: HEB.13.6
reference: Hebrews 13:6
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὥστε θαρροῦντας ἡμᾶς λέγειν· Κύριος ἐμοὶ βοηθός, ⸀οὐ φοβηθήσομαι· τί ποιήσει μοι ἄνθρωπος;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/006.yaml
  text: so that we confidently say[a], “The Lord is my helper; I will not be afraid[b]. What can man do to me?”
translation:
  language: vi
  text: 'Vì vậy, chúng ta có thể mạnh dạn nói: “Chúa là Đấng giúp đỡ tôi; tôi sẽ không sợ. Người ta có thể làm gì được tôi?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát hơn: “Người ta sẽ làm gì tôi?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: Vì thế
  rationale: Diễn đạt tự nhiên sắc thái kết quả/suy luận nối với lời khẳng định ngay trước đó.
- source_word: θαρροῦντας ἡμᾶς λέγειν
  choice: chúng ta có thể vững lòng nói
  rationale: Giữ ý can đảm, tin tưởng của θαρροῦντας trong một cấu trúc tiếng Việt tự nhiên; “có thể” thể hiện kết quả được tạo nên bởi lời hứa trước đó, không biến câu thành mệnh lệnh.
- source_word: Κύριος
  choice: Chúa
  rationale: Cách gọi trang trọng, quen thuộc và tự nhiên trong tiếng Việt đối với κύριος ở đây.
- source_word: ἐμοὶ βοηθός
  choice: Đấng giúp đỡ tôi
  rationale: Giữ tính ngôi vị của danh từ βοηθός và quan hệ “giúp đỡ cho tôi” của sở cách; “Đấng” phù hợp khi chỉ Chúa.
- source_word: οὐ φοβηθήσομαι
  choice: tôi sẽ không sợ
  rationale: Phản ánh trực tiếp hình thái tương lai và vẫn tự nhiên trong tiếng Việt hiện đại.
- source_word: τί ποιήσει μοι ἄνθρωπος
  choice: Người ta có thể làm gì tôi?
  rationale: Câu hỏi tu từ được diễn đạt tự nhiên bằng “có thể”; “người ta” truyền đạt nghĩa khái quát của ἄνθρωπος mà không giới hạn vào nam giới.
theological_decisions:
- issue: Nghĩa khái quát của ἄνθρωπος
  choice: người ta
  alternative: một con người; loài người
  rationale: ἄνθρωπος số ít có nghĩa đại diện, chỉ con người nói chung chứ không riêng nam giới. “Người ta” giữ được tính khái quát trong tiếng Việt tự nhiên.
- issue: Sắc thái tương lai trong ποιήσει ở câu hỏi tu từ
  choice: có thể làm gì tôi?
  alternative: sẽ làm gì tôi?
  rationale: Nguyên văn dùng tương lai “sẽ làm”, nhưng trong ngữ cảnh câu hỏi tu từ, “có thể” diễn đạt tự nhiên ý rằng sự đe dọa của con người không đáng khiến người nói sợ; chú thích bảo tồn cách dịch sát hình thức.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “vững lòng” để chuyển tải sự tự tin/can đảm mà không mang sắc thái phô trương; dùng “Đấng” để giữ tính ngôi vị của Đấng trợ giúp.
