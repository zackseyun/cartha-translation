  text: Let brotherly love continue[a].
translation:
  language: vi
  text: Hãy tiếp tục yêu thương nhau như anh chị em.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Hãy duy trì tình yêu thương giữa những người cùng đức tin.” Từ Hy Lạp chỉ tình thân giữa anh chị em trong cộng đồng đức tin, không chỉ nói về nam giới.'
    reason: lexical_alternative
lexical_decisions:
- source_word: φιλαδελφία
  choice: yêu thương nhau như anh chị em trong một gia đình
  rationale: Danh từ này chỉ tình thân giữa anh chị em và, trong cách dùng Cơ Đốc giáo ban đầu, chỉ tình yêu giữa những người cùng thuộc cộng đồng đức tin. Cách diễn đạt này giữ hình ảnh gia đình của nguyên ngữ, bao gồm cả nam lẫn nữ và tự nhiên trong tiếng Việt hiện đại.
- source_word: μενέτω
  choice: Hãy tiếp tục
  rationale: Thể mệnh lệnh hiện tại diễn tả lời khuyên phải duy trì một tình trạng đang có; “hãy tiếp tục” truyền đạt cả lực mệnh lệnh lẫn sắc thái kéo dài.
- source_word: Ἡ
  choice: không dịch riêng
  rationale: Mạo từ xác định đức tính quen thuộc đang được nói đến; tiếng Việt không cần biểu đạt bằng một từ riêng trong câu khuyên bảo này.
theological_decisions:
- issue: Phạm vi của φιλαδελφία và hình ảnh gia đình
  choice: yêu thương nhau như anh chị em trong một gia đình
  alternative: tình yêu thương anh em; tình yêu thương giữa các tín hữu
  rationale: Lựa chọn chính giữ phép ẩn dụ gia đình nhưng tránh khiến độc giả hiểu rằng lời dạy chỉ áp dụng cho nam giới. Cụm “trong một gia đình” nêu rõ tính chất tình thân của từ Hy Lạp mà không giới hạn một hệ phái hay cách giải thích riêng.
translation_notes:
  register: Văn phong khuyên bảo ngắn gọn, trang trọng nhưng hiện đại. “Anh chị em trong một gia đình” bảo tồn hình ảnh thân tộc của nguyên ngữ và truyền đạt tự nhiên phạm vi bao gồm mọi người trong cộng đồng đức tin.
