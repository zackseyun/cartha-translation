  source_fidelity: Bản dịch phản ánh tốt cấu trúc cầu chúc, mục đích “để làm theo ý muốn Ngài”, hoạt động của Đức Chúa Trời “trong chúng ta”, và giữ đúng sự mơ hồ của đại từ quan hệ trong lời tôn vinh. Tuy nhiên, “Chúa” trong “qua Chúa Giê-su” thêm một tước hiệu không có trong διὰ Ἰησοῦ Χριστοῦ; Χριστός đã được dịch bằng “Đấng Mê-si”.
  naturalness: Văn phong nhìn chung tự nhiên, trang trọng và phù hợp tiếng Việt hiện đại. Cấu trúc “xin Ngài …, và thực hiện …” rõ chủ thể xuyên suốt. “Điều đẹp lòng Ngài” là cách diễn đạt tự nhiên cho điều đẹp lòng trước mặt Ngài.
  terminology: “Trang bị”, “ý muốn Ngài”, “Đấng Mê-si”, “vinh quang”, “đời đời”, và “A-men” đều phù hợp. Cần bỏ “Chúa” trước “Giê-su” để không bổ sung κύριος vào bản văn nguồn.
