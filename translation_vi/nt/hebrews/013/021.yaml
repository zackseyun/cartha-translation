id: HEB.13.21
reference: Hebrews 13:21
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καταρτίσαι ὑμᾶς ἐν ⸀παντὶ ἀγαθῷ εἰς τὸ ποιῆσαι τὸ θέλημα αὐτοῦ, ποιῶν ἐν ⸀ἡμῖν τὸ εὐάρεστον ἐνώπιον αὐτοῦ διὰ Ἰησοῦ Χριστοῦ, ᾧ ἡ δόξα εἰς τοὺς ⸀αἰῶνας· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/021.yaml
  text: may he equip you in every good thing to do his will[a], working in us what is pleasing before him through Jesus the Messiah, to whom be the glory forever and ever. Amen.
translation:
  language: vi
  text: xin Ngài trang bị cho anh chị em mọi điều tốt lành để làm theo ý muốn Ngài, và thực hiện trong chúng ta điều đẹp lòng Ngài qua Giê-su, Đấng Mê-si. Nguyện vinh quang thuộc về Ngài[a] đời đời. A-men.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ngài” có thể chỉ riêng Giê-su, Đấng Mê-si; một số người hiểu đại từ này chỉ Đức Chúa Trời bình an, là chủ thể của lời cầu nguyện.
    reason: alternative_reading
lexical_decisions:
- source_word: καταρτίσαι
  choice: xin Ngài trang bị
  rationale: Động từ ở thể cầu chúc mở đầu lời nguyện xin; “trang bị” diễn đạt việc Đức Chúa Trời ban những gì cần thiết để tín hữu vâng theo ý Ngài.
- source_word: ἐν παντὶ ἀγαθῷ
  choice: cho anh chị em mọi điều tốt lành
  rationale: Cách diễn đạt tự nhiên trong tiếng Việt sau “trang bị”, hiểu cụm giới từ theo nghĩa phương tiện hoặc điều được cung ứng, đồng thời không thêm danh từ “việc làm” vốn không có trong bản văn được chọn.
- source_word: εἰς τὸ ποιῆσαι τὸ θέλημα αὐτοῦ
  choice: để làm theo ý muốn Ngài
  rationale: “Để” giữ rõ ý nghĩa mục đích của cấu trúc nguyên mẫu có mạo từ; “làm theo” là cách nói tiếng Việt tự nhiên về sự vâng phục ý muốn của Đức Chúa Trời.
- source_word: ποιῶν ἐν ἡμῖν
  choice: và thực hiện trong chúng ta
  rationale: Phân từ mô tả hoạt động của chính Đức Chúa Trời. “Trong chúng ta” ưu tiên nghĩa nội tại của ἐν, còn “thực hiện” tránh lặp từ “làm” quá gần nhau.
- source_word: τὸ εὐάρεστον ἐνώπιον αὐτοῦ
  choice: điều đẹp lòng Ngài
  rationale: Diễn đạt gọn và tự nhiên ý nghĩa điều được Đức Chúa Trời xem là đáng hài lòng; quan điểm đánh giá hàm chứa trong ἐνώπιον αὐτοῦ được bảo toàn bằng “đẹp lòng Ngài”.
- source_word: διὰ Ἰησοῦ Χριστοῦ
  choice: qua Chúa Giê-su, Đấng Mê-si
  rationale: “Qua” thể hiện vai trò trung gian; Χριστός được chuyển theo nghĩa tước hiệu là “Đấng Mê-si”, không chỉ phiên âm như một phần tên riêng.
- source_word: ᾧ ἡ δόξα
  choice: Nguyện vinh quang thuộc về Ngài
  rationale: Công thức tôn vinh trang trọng, tự nhiên trong tiếng Việt. Đại từ “Ngài” không nêu đích danh tiền ngữ, nhờ đó giữ được mức độ mơ hồ của đại từ quan hệ Hy Lạp.
- source_word: εἰς τοὺς αἰῶνας
  choice: đời đời
  rationale: Thành ngữ tiếng Việt quen thuộc và trang trọng để chỉ thời gian không dứt.
- source_word: ἀμήν
  choice: A-men
  rationale: Phiên âm quen dùng trong tiếng Việt, giữ chức năng xác nhận lời cầu chúc.
theological_decisions:
- issue: Tiền ngữ của đại từ quan hệ ᾧ trong lời tôn vinh
  choice: Dùng “Ngài” mà không nêu tên đối tượng nhận vinh quang
  alternative: Nêu rõ vinh quang thuộc về Chúa Giê-su, Đấng Mê-si; hoặc nêu rõ thuộc về Đức Chúa Trời bình an, chủ thể của lời cầu nguyện
  rationale: Về ngữ pháp, ᾧ có thể quy chiếu gần nhất đến Chúa Giê-su, Đấng Mê-si, nhưng cũng có thể trở lại Đức Chúa Trời là chủ thể chính của lời chúc phước. Bản dịch không tự ý giải quyết sự căng thẳng này và ghi chú cả hai khả năng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. “Anh chị em” truyền đạt số nhiều ὑμᾶς theo lối xưng hô bao quát, tự nhiên. Câu được tách trước lời tôn vinh để tránh cấu trúc quá dài trong tiếng Việt, nhưng quan hệ ý nghĩa của bản Hy Lạp vẫn được giữ.
