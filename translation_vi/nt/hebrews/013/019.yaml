  text: περισσοτέρως δὲ παρακαλῶ τοῦτο ποιῆσαι ἵνα τάχιον ἀποκατασταθῶ ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/019.yaml
  text: And I urge you all the more to do this[a], so that I may be restored to you sooner.
translation:
  language: vi
  text: Tôi lại càng tha thiết khuyên anh chị em làm điều này[a], để tôi được trở lại với anh chị em sớm hơn[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “làm như vậy.” “Điều này” nói đến lời yêu cầu cầu nguyện ở câu trước.'
    reason: Làm rõ từ hồi chỉ τοῦτο mà không đưa phần giải thích vào chính văn.
  - marker: b
    text: 'Cũng có thể dịch: “được phục hồi cho anh chị em” hoặc “được trở về với anh chị em.” Câu Hy Lạp không cho biết hoàn cảnh cụ thể của sự trở lại này.'
    reason: Phản ánh phạm vi nghĩa của ἀποκατασταθῶ ὑμῖν và bảo tồn tính không xác định về hoàn cảnh.
lexical_decisions:
- source_word: περισσοτέρως
  choice: lại càng tha thiết
  rationale: 'Giữ sắc thái so sánh tăng cường của trạng từ: lời thỉnh cầu này được nhấn mạnh hơn nữa; cách diễn đạt tự nhiên trong tiếng Việt.'
- source_word: δὲ
  choice: lại
  rationale: Ở đây δέ có chức năng nối nhẹ với lời kêu gọi cầu nguyện ở câu trước, không biểu thị sự tương phản mạnh.
- source_word: παρακαλῶ
  choice: tôi ... tha thiết khuyên
  rationale: Diễn đạt một lời yêu cầu hoặc thúc giục chân thành, mạnh hơn cách nói đơn thuần là “xin” nhưng không mang giọng ra lệnh.
- source_word: τοῦτο ποιῆσαι
  choice: làm điều này
  rationale: Giữ nguyên tính hồi chỉ của τοῦτο, hướng về lời yêu cầu cầu nguyện ngay trước đó mà không diễn giải thêm trong chính câu.
- source_word: ἵνα
  choice: để
  rationale: Thể hiện tự nhiên ý nghĩa mục đích của liên từ Hy Lạp.
- source_word: τάχιον
  choice: sớm
  rationale: Trong ngữ cảnh trở lại với độc giả, “sớm” là cách diễn đạt tự nhiên của ý so sánh “sớm hơn/nhanh hơn”; không cần nêu rõ mốc so sánh vốn cũng không được nói ra trong nguyên văn.
- source_word: ἀποκατασταθῶ
  choice: được trở lại
  rationale: Giữ sắc thái bị động và ý được phục hồi/trở về với cộng đồng, đồng thời không xác định nguyên nhân chia cách hay hoàn cảnh khiến tác giả chưa thể đến với họ.
- source_word: ὑμῖν
  choice: với anh chị em
  rationale: Đại từ số nhiều chỉ các độc giả; “với anh chị em” diễn đạt tự nhiên quan hệ đoàn tụ trong tiếng Việt hiện đại.
theological_decisions:
- issue: Hoàn cảnh của việc tác giả mong được trở lại với các độc giả
  choice: Diễn đạt chung là “được trở lại với anh chị em”, không xác định hoàn cảnh cụ thể.
  alternative: Được thả khỏi tù, hồi phục sau bệnh tật, trở về sau chuyến đi, hoặc được phục hồi chức vụ giữa họ.
  rationale: ἀποκατασταθῶ ὑμῖν nói đến việc tác giả được phục hồi/trở lại với các độc giả nhưng không cho biết điều gì đang ngăn cách họ. Bản dịch vì thế không bổ sung một bối cảnh lịch sử hay thần học mà câu Hy Lạp không xác định.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Anh chị em” thể hiện số nhiều của ὑμῖν và phù hợp lời nói với cộng đồng tín hữu; “lại càng tha thiết khuyên” giữ cường độ của lời thỉnh cầu mà không tạo giọng quyền uy quá mức.
