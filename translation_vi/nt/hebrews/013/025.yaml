  text: Grace be with all of you.
translation:
  language: vi
  text: Nguyện ân điển ở cùng tất cả anh chị em.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡ χάρις
  choice: ân điển
  rationale: Trong lời chúc phước kết thư, χάρις chỉ ân huệ nhưng không của Đức Chúa Trời. “Ân điển” là cách diễn đạt ngắn gọn, trang trọng và quen thuộc trong ngôn ngữ Kinh Thánh tiếng Việt; mạo từ Hy Lạp không cần được dịch riêng trong cấu trúc tự nhiên này.
- source_word: μετὰ
  choice: Nguyện ... ở cùng
  rationale: μετά với sở hữu cách có nghĩa là “cùng, với”. Câu Hy Lạp tỉnh lược động từ trong công thức chúc phước; tiếng Việt tự nhiên cần bổ sung “Nguyện ... ở cùng” để biểu đạt đúng sắc thái cầu chúc mà không thêm một khẳng định thần học mới.
- source_word: πάντων ὑμῶν
  choice: tất cả anh chị em
  rationale: πάντων làm rõ rằng lời chúc dành cho toàn thể người nhận. “Tất cả anh chị em” vừa giữ tính bao quát vừa tự nhiên, trang trọng trong lời gửi đến một cộng đồng.
theological_decisions: []
translation_notes:
  register: Bản dịch dùng văn phong chúc phước trang trọng nhưng hiện đại. “Anh chị em” diễn đạt đại từ số nhiều ὑμῶν theo cách bao quát và tự nhiên trong cộng đồng đức tin; không có dấu chú thích vì câu này không đòi hỏi giải thích dị bản hay điểm mơ hồ đáng kể.
