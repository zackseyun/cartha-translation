  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: μιμνῄσκεσθε τῶν δεσμίων ὡς συνδεδεμένοι, τῶν κακουχουμένων ὡς καὶ αὐτοὶ ὄντες ἐν σώματι.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/003.yaml
  text: Remember those in prison[a], as though imprisoned with them; those who are mistreated[b], since you yourselves also are in the body.
translation:
  language: vi
  text: Hãy nhớ đến những người bị giam cầm[a] như thể chính anh chị em cũng bị giam cùng họ; hãy nhớ đến những người bị ngược đãi[b], vì chính anh chị em cũng đang ở trong thân thể.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “như những người cùng bị trói buộc với họ.” Tiếng Hy Lạp gợi trực tiếp hình ảnh bị trói chung với các tù nhân.'
    reason: lexical_alternative
  - marker: b
    text: Cụm “ở trong thân thể” có thể được hiểu là thuộc về thân thể Đấng Christ; nhưng nhiều khả năng hơn, cụm này nói đến thân phận con người trong thân xác, cùng dễ bị đau khổ và tổn thương.
    reason: alternative_reading
lexical_decisions:
- source_word: μιμνῄσκεσθε
  choice: Hãy nhớ đến
  rationale: Mệnh lệnh hiện tại số nhiều kêu gọi sự quan tâm và ghi nhớ liên tục; cách diễn đạt này tự nhiên trong tiếng Việt và phù hợp cho cả hai đối tượng của câu.
- source_word: τῶν δεσμίων
  choice: những người bị giam cầm
  rationale: δέσμιος chỉ người bị trói buộc, thường là tù nhân. “Bị giam cầm” tự nhiên, rõ nghĩa và vẫn gợi tình trạng bị mất tự do.
- source_word: ὡς συνδεδεμένοι
  choice: như thể chính anh chị em cũng bị giam cùng họ
  rationale: Phân từ συνδεδεμένοι gợi hình ảnh bị trói buộc cùng nhau. Bản dịch diễn đạt sự đồng cảm sâu sắc bằng tiếng Việt tự nhiên, đồng thời giữ ý cùng chịu cảnh giam cầm.
- source_word: τῶν κακουχουμένων
  choice: những người bị ngược đãi
  rationale: κακουχουμένων chỉ những người đang phải chịu cách đối xử tồi tệ hoặc áp bức do người khác gây ra; “bị ngược đãi” rõ ràng và giữ thể bị động.
- source_word: ὡς καὶ αὐτοὶ ὄντες ἐν σώματι
  choice: vì chính anh chị em cũng đang ở trong thân thể
  rationale: Giữ gần nguyên văn ἐν σώματι (“ở trong thân thể”), không thu hẹp câu thành “cũng có thân thể”; “vì” thể hiện chức năng nêu lý do của mệnh đề trong ngữ cảnh.
theological_decisions:
- issue: Ý nghĩa của ἐν σώματι (“ở trong thân thể”)
  choice: Giữ nguyên cách nói “ở trong thân thể”, với nghĩa chính là cùng chung thân phận con người hữu thể và dễ bị tổn thương
  alternative: Thuộc về thân thể Đấng Christ
  rationale: Ngữ cảnh khuyên người đọc đồng cảm với người bị giam cầm và ngược đãi, nên sự dễ tổn thương chung trong thân xác là nghĩa tự nhiên hơn. Tuy vậy, bản dịch không diễn giải thành “có thân thể”, nhờ đó không loại bỏ hoàn toàn âm hưởng về thân thể cộng đồng.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “anh chị em” để chuyển tải ngôi thứ hai số nhiều theo lối xưng hô bao quát, phù hợp với lời khuyên dành cho cộng đồng. Lặp “hãy nhớ đến” trước đối tượng thứ hai để câu tiếng Việt rõ và tự nhiên hơn.
