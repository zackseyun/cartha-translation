id: HEB.13.12
reference: Hebrews 13:12
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: διὸ καὶ Ἰησοῦς, ἵνα ἁγιάσῃ διὰ τοῦ ἰδίου αἵματος τὸν λαόν, ἔξω τῆς πύλης ἔπαθεν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/012.yaml
  text: Therefore Jesus also suffered outside the gate[b][a], so that he might sanctify the people through his own blood.
translation:
  language: vi
  text: Vì thế, Đức Giê-su cũng đã chịu khổ bên ngoài cổng thành[b], để thánh hóa dân bằng chính huyết của mình.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Thánh hóa” cũng có thể dịch là “làm cho nên thánh” hoặc “thánh hiến.”
    reason: lexical_alternative
  - marker: b
    text: “Bên ngoài cổng thành” có lẽ chỉ nơi bên ngoài Giê-ru-sa-lem, nơi Đức Giê-su chịu khổ; cụm từ này cũng gợi lại việc xác các sinh tế được đem ra ngoài trại để thiêu trong ngữ cảnh ngay trước đó.
    reason: cross_reference
lexical_decisions:
- source_word: διὸ
  choice: Vì thế
  rationale: Liên từ suy luận nối câu này với lập luận ngay trước đó; cách dịch tự nhiên và giữ rõ quan hệ kết luận.
- source_word: καὶ
  choice: cũng
  rationale: Đặt Đức Giê-su trong sự tương ứng với khuôn mẫu tế lễ ở ngữ cảnh trước.
- source_word: Ἰησοῦς
  choice: Đức Giê-su
  rationale: Cách gọi trang trọng, quen thuộc trong tiếng Việt hiện đại đối với tên riêng Giê-su.
- source_word: ἵνα ἁγιάσῃ
  choice: để thánh hóa
  rationale: Diễn đạt mục đích của ἵνα với động từ giả định, đồng thời giữ sắc thái thờ phượng và giao ước của ἁγιάζω.
- source_word: διὰ τοῦ ἰδίου αἵματος
  choice: bằng chính huyết của mình
  rationale: “Bằng” thể hiện phương tiện; “chính” giữ tính nhấn mạnh của ἰδίου, còn “huyết” duy trì sắc thái tế lễ trang trọng trong thư Hê-bơ-rơ.
- source_word: τὸν λαόν
  choice: dân chúng
  rationale: Giữ danh từ xác định mà không thêm “của Đức Chúa Trời,” vốn không được nói rõ trong nguyên văn.
- source_word: ἔξω τῆς πύλης
  choice: bên ngoài cổng thành
  rationale: “Cổng thành” là cách diễn đạt tự nhiên trong tiếng Việt cho πύλη ở bối cảnh này; “thành” được hàm ý bởi loại cổng và không xác định đích danh Giê-ru-sa-lem.
- source_word: ἔπαθεν
  choice: đã chịu khổ
  rationale: Thể hiện động từ aorist như một biến cố đã xảy ra và giữ nghĩa khái quát “chịu khổ” của πάσχω.
theological_decisions:
- issue: Cách dịch ἁγιάζω trong bối cảnh tế lễ
  choice: thánh hóa
  alternative: làm nên thánh; biệt riêng ra thánh
  rationale: “Thánh hóa” giữ được sắc thái thần học, tế lễ và giao ước mà không giới hạn từ này vào sự biến đổi đạo đức hay một hệ giáo lý riêng.
- issue: Phạm vi của τὸν λαόν
  choice: dân chúng
  alternative: dân của Đức Chúa Trời
  rationale: Ngữ cảnh hướng đến dân giao ước, nhưng nguyên văn chỉ nói “dân”; bản dịch không thêm thành phần giải nghĩa vào chính văn.
- issue: Ý nghĩa của “bên ngoài cổng thành”
  choice: giữ hình ảnh địa điểm mà không nêu đích danh Giê-ru-sa-lem
  alternative: bên ngoài cổng Giê-ru-sa-lem
  rationale: Cụm từ gợi nơi Đức Giê-su chịu khổ và tương ứng với vật tế lễ được đem ra ngoài trại trong câu trước, nhưng nguyên văn không nêu tên thành.
translation_notes:
  register: Văn phong trang trọng nhưng dễ hiểu. Dùng “Đức Giê-su” và “huyết” để phù hợp sắc thái Kinh Thánh và hình ảnh tế lễ; cấu trúc câu vẫn tự nhiên trong tiếng Việt hiện đại. Các dấu chú thích [a], [b] đều xuất hiện trong chính văn.
