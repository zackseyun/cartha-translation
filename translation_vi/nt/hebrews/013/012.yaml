revisions:
- from: Vì thế, Đức Giê-su cũng đã chịu khổ bên ngoài cổng thành[b], để thánh hóa dân chúng bằng chính huyết của mình.[a]
  to: Vì thế, Đức Giê-su cũng đã chịu khổ bên ngoài cổng thành[b], để thánh hóa dân bằng chính huyết của mình.[a]
  rationale: 'Chỉ thực hiện các chỉnh sửa an toàn về từ vựng và độ tự nhiên: “dân” sát hơn với τὸν λαόν so với “dân chúng”; chú thích a được làm cho tự nhiên hơn. Chính văn vẫn giữ nguyên quan hệ mục đích, phương tiện bằng huyết của chính Đức Giê-su, và hình ảnh “bên ngoài cổng thành” không nêu thêm tên thành vào chính văn.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T00:27:11Z'
review_pass:
  verdict: revise
  source_fidelity: Bản dịch phản ánh đúng quan hệ suy luận của διὸ, sắc thái tương ứng của καὶ, mệnh đề mục đích ἵνα ἁγιάσῃ, phương tiện διὰ với sở hữu nhấn mạnh ἰδίου, và địa điểm ἔξω τῆς πύλης. “Cổng thành” là diễn đạt chấp nhận được cho πύλη trong ngữ cảnh này, dù nguyên văn chỉ nói số ít “cổng”.
  naturalness: Câu văn trang trọng, rõ ràng và tự nhiên trong tiếng Việt hiện đại. Tuy nhiên, “dân chúng” thường gợi toàn thể dân cư/quần chúng nói chung; “dân” tự nhiên hơn và sát với sắc thái dân giao ước của τὸν λαόν mà không thêm diễn giải.
  terminology: “Đức Giê-su,” “thánh hóa,” và “huyết” phù hợp với văn phong Kinh Thánh trang trọng và bối cảnh tế lễ của Hê-bơ-rơ. Cần thay “dân chúng” bằng “dân”. Chú thích từ vựng nên dùng các phương án tiếng Việt tự nhiên hơn cho ἁγιάζω.
  issues:
  - severity: low
    issue: “Dân chúng” cho τὸν λαόν
    rationale: Từ này có thể chỉ dân cư hoặc đám đông nói chung. “Dân” vừa sát nguyên văn hơn vừa giữ được độ xác định và cộng hưởng giao ước của ngữ cảnh, không cần thêm “của Đức Chúa Trời”.
  - severity: low
    issue: Phương án “biệt riêng ra thánh” trong chú thích a hơi gượng
    rationale: Có thể thay bằng “thánh hiến,” một phương án ngắn gọn, tự nhiên hơn và vẫn bảo toàn sắc thái nghi lễ của ἁγιάζω.
