source:
  edition: SBLGNT
  text: οὐ γὰρ ἔχομεν ὧδε μένουσαν πόλιν, ἀλλὰ τὴν μέλλουσαν ἐπιζητοῦμεν·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/014.yaml
  text: For we do not have a lasting city here[a], but we seek the one that is to come.
translation:
  language: vi
  text: Vì chúng ta không có một thành tồn tại lâu dài ở đây, nhưng đang tìm kiếm thành sẽ đến.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc, sát nghĩa hơn: “thành đang đến” hoặc “thành tương lai.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ γὰρ
  choice: Vì ... không
  rationale: “Vì” nối câu này với lời khuyên trước đó như một lý do hoặc lời giải thích; “không” trực tiếp phủ định mệnh đề.
- source_word: ἔχομεν
  choice: chúng ta ... có
  rationale: Thì hiện tại được diễn đạt tự nhiên bằng “có”; không cần dùng từ trang trọng hơn như “sở hữu”.
- source_word: ὧδε
  choice: tại đây
  rationale: Giữ nguyên ý chỉ nơi chốn “ở đây/tại đây”, không diễn giải rộng thành “trên đất”.
- source_word: μένουσαν
  choice: bền vững
  rationale: Phân từ hiện tại bổ nghĩa cho “thành”, chỉ một thành còn lại, tồn tại lâu bền; “bền vững” tự nhiên và làm rõ sự tương phản với thành sẽ đến.
- source_word: πόλιν
  choice: thành
  rationale: Giữ danh từ cụ thể πόλις; “thành” có sắc thái Kinh Thánh trang nghiêm nhưng vẫn dễ hiểu, đồng thời tránh diễn giải thành “quê hương”.
- source_word: ἀλλὰ
  choice: nhưng
  rationale: Diễn đạt trực tiếp sự tương phản mạnh giữa việc không có thành bền vững ở đây và việc tìm kiếm thành tương lai.
- source_word: τὴν μέλλουσαν
  choice: thành sẽ đến
  rationale: Phân từ giống cái quy chiếu về πόλιν; lặp lại “thành” giúp câu tiếng Việt rõ ràng và giữ định hướng tương lai của μέλλω.
- source_word: ἐπιζητοῦμεν
  choice: đang tìm kiếm
  rationale: Dạng hiện tại và động từ ἐπιζητέω gợi một sự tìm kiếm hướng tới mục tiêu; “đang tìm kiếm” tự nhiên và truyền đạt tính tiếp diễn mà không thêm mức độ như “tha thiết”.
theological_decisions:
- issue: Bản chất của hình ảnh “thành”
  choice: Giữ nguyên “thành” như hình ảnh của bản văn về thực tại hoặc nơi cư ngụ tương lai của người tin.
  alternative: “thiên đàng”, “thành trên trời” hoặc “Giê-ru-sa-lem trên trời”
  rationale: Câu này không trực tiếp gọi thành ấy là thiên đàng hay Giê-ru-sa-lem. Giữ cách gọi của nguyên văn tránh đưa phần khai triển thần học từ những chỗ khác vào câu.
- issue: Sắc thái của τὴν μέλλουσαν
  choice: “thành sẽ đến”
  alternative: “thành tương lai” hoặc “thành đang đến”
  rationale: Cách dịch này bảo tồn định hướng cánh chung mà không quyết định chi tiết thành ấy đến với con người hay con người đi đến thành ấy.
translation_notes:
  register: Tiếng Việt hiện đại, trang nghiêm và dễ hiểu. Dùng “thành” thay vì “thành phố” để giữ sắc thái văn chương–Kinh Thánh và tính biểu tượng của πόλις; không diễn giải “tại đây” thành “trên đất”.
