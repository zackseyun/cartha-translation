  rationale: Chỉ thay “bền vững” bằng “tồn tại lâu dài” để chuyển đạt sát hơn ý của μένουσαν là điều còn lại hoặc kéo dài. Giữ “ở đây,” “thành,” và “thành sẽ đến” để không mở rộng hình ảnh của bản văn sang một diễn giải thần học cụ thể. Điều chỉnh chú thích để nêu các cách diễn đạt tiếng Việt khả dĩ cho τὴν μέλλουσαν mà không hàm ý thời điểm cận kề.
