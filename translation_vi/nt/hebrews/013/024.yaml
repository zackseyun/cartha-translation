revisions:
- from: Hãy gửi lời chào đến tất cả những người lãnh đạo anh em và tất cả các thánh đồ. Những người từ Ý[a] gửi lời chào anh em.
  to: Hãy gửi lời chào đến tất cả những người lãnh đạo của anh em và tất cả các thánh đồ. Những người từ Ý[a] gửi lời chào đến anh em.
  rationale: Điều chỉnh hai điểm diễn đạt nhỏ để tiếng Việt hiện đại rõ ràng và tự nhiên hơn. Bản văn vẫn giữ nguyên lực mệnh lệnh, tính bao quát của «tất cả», thuật ngữ cộng đồng, và sự mơ hồ có chủ ý của οἱ ἀπὸ τῆς Ἰταλίας trong chú thích.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T00:27:13Z'
review_pass:
  verdict: revise
  source_fidelity: Bản nháp truyền đạt đúng mệnh lệnh chào thăm, hai nhóm đối tượng («tất cả» những người lãnh đạo và các thánh đồ), và lời chào từ những người liên hệ với Ý. Cách hiểu chính «từ Ý» phản ánh nghĩa thông thường của ἀπό, trong khi chú thích bảo lưu đúng sự bất định về quy chiếu/địa điểm.
  naturalness: «Những người lãnh đạo của anh em» tự nhiên và rõ quan hệ sở hữu hơn «những người lãnh đạo anh em». Thêm «đến» sau «gửi lời chào» làm cấu trúc tiếng Việt trôi chảy hơn.
  terminology: «Thánh đồ» là thuật ngữ quen thuộc trong ngữ cảnh Kinh Thánh tiếng Việt và diễn đạt τοὺς ἁγίους mà không đồng nhất nhóm này với các cá nhân được phong thánh. «Những người lãnh đạo» phù hợp với ἡγούμενοι và tránh sắc thái chính trị của «người cai trị».
  issues:
  - severity: low
    issue: Cụm «những người lãnh đạo anh em» thiếu từ nối sở hữu.
    rationale: Trong tiếng Việt hiện đại, «những người lãnh đạo của anh em» rõ nghĩa hơn và tránh khả năng đọc «anh em» như thành phần đồng vị của những người lãnh đạo.
  - severity: low
    issue: Cụm «gửi lời chào anh em» thiếu giới từ trong lối diễn đạt trang trọng.
    rationale: «Gửi lời chào đến anh em» là cách kết hợp tự nhiên, đồng thời không thay đổi nghĩa của ἀσπάζονται.
  revised_text: Hãy gửi lời chào đến tất cả những người lãnh đạo của anh em và tất cả các thánh đồ. Những người từ Ý[a] gửi lời chào đến anh em.
