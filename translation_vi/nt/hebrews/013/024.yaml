source:
  edition: SBLGNT
  text: ἀσπάσασθε πάντας τοὺς ἡγουμένους ὑμῶν καὶ πάντας τοὺς ἁγίους. ἀσπάζονται ὑμᾶς οἱ ἀπὸ τῆς Ἰταλίας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/024.yaml
  text: Greet all your leaders and all the saints[a]. Those from Italy greet you.
translation:
  language: vi
  text: Hãy gửi lời chào đến tất cả những người lãnh đạo của anh em và tất cả các thánh đồ. Những người từ Ý[a] gửi lời chào đến anh em.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Những người ở Ý gửi lời chào anh em.” Cụm từ Hy Lạp này có thể chỉ những người xuất thân từ Ý hoặc những người đang ở đó.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: Hãy gửi lời chào đến
  rationale: Diễn đạt tự nhiên trong văn thư tiếng Việt, đồng thời giữ rõ lực mệnh lệnh của động từ aorist.
- source_word: πάντας
  choice: tất cả
  rationale: Chuyển tải trực tiếp ý nghĩa bao quát toàn bộ nhóm người được nói đến.
- source_word: τοὺς ἡγουμένους ὑμῶν
  choice: những người lãnh đạo anh em
  rationale: Phản ánh nghĩa 'những người đang dẫn dắt' trong cộng đồng, tránh sắc thái chính trị hoặc áp chế của các cách dịch như 'những người cai trị'.
- source_word: τοὺς ἁγίους
  choice: các thánh đồ
  rationale: Giữ thuật ngữ Tân Ước chỉ những người thuộc cộng đồng tín hữu được biệt riêng là thánh, mà không diễn giải rộng thành 'dân của Đức Chúa Trời'.
- source_word: ἀσπάζονται
  choice: gửi lời chào
  rationale: Phù hợp ngữ cảnh kết thư và tự nhiên trong tiếng Việt hiện đại.
- source_word: οἱ ἀπὸ τῆς Ἰταλίας
  choice: Những người từ Ý
  rationale: Giữ nghĩa trực tiếp nhất của ἀπό với sở hữu cách là nguồn gốc hoặc nơi xuất phát; cách hiểu theo vị trí hiện tại được bảo lưu trong chú thích.
theological_decisions:
- issue: Đối tượng được chỉ bởi οἱ ἀπὸ τῆς Ἰταλίας
  choice: Những người từ Ý
  alternative: Những người ở Ý
  rationale: Giới từ ἀπό thường chỉ nguồn gốc, nên bản văn chính giữ nghĩa 'từ Ý'. Tuy nhiên, cụm từ cũng có thể được hiểu là những người hiện đang ở Ý; chú thích bảo lưu sự mơ hồ này mà không quyết đoán về địa điểm viết thư.
translation_notes:
  register: Văn phong trang trọng, sáng rõ và tự nhiên. Đại từ “anh em” giữ lối xưng hô cộng đồng quen thuộc trong thư tín Tân Ước; “những người lãnh đạo” dễ hiểu hơn cách gọi mang sắc thái chính trị. Dấu chú thích được đặt ngay sau “Ý”, là vị trí gắn trực tiếp với điểm mơ hồ.
