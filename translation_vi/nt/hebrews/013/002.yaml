  rationale: 'Bản sửa giữ nguyên ý nghĩa và mức độ khẳng định của nguyên văn: lời khuyên về φιλοξενία, kết quả “mà không hay biết”, và cách dịch chính văn “thiên sứ”. Sửa đổi chỉ làm rõ số nhiều của τινες, tăng độ tự nhiên, và đặt lại mỏ neo chú thích đúng tại ἀγγέλους.'
