  text: τῆς φιλοξενίας μὴ ἐπιλανθάνεσθε, διὰ ταύτης γὰρ ἔλαθόν τινες ξενίσαντες ἀγγέλους.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/002.yaml
  text: Do not neglect hospitality[a], for through it some have entertained angels without knowing it.
translation:
  language: vi
  text: Đừng quên tiếp đãi khách lạ, vì nhờ đó, một số người đã tiếp đãi các thiên sứ[a] mà không hay biết.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hy Lạp được dịch là “thiên sứ” cũng có thể có nghĩa là “sứ giả”. Tuy nhiên, “thiên sứ” phù hợp hơn với sự gợi nhắc có khả năng nằm sau câu này.
    reason: lexical_alternative
lexical_decisions:
- source_word: φιλοξενίας
  choice: việc tiếp đón người lạ
  rationale: Danh từ này chỉ lòng yêu mến và sự đón tiếp dành cho người xa lạ. Cách dịch này tự nhiên trong tiếng Việt, đồng thời giữ rõ nét nghĩa về người lạ hơn từ khái quát “lòng hiếu khách”.
- source_word: μὴ ἐπιλανθάνεσθε
  choice: Đừng xao nhãng
  rationale: Động từ có thể mang nghĩa quên hoặc sao nhãng. Trong lời khuyên thực hành này, “đừng xao nhãng” diễn đạt việc không được bỏ bê bổn phận, chứ không chỉ nói đến một sự quên lãng trong trí nhớ.
- source_word: διὰ ταύτης
  choice: nhờ đó
  rationale: Đại từ giống cái quy chiếu về việc tiếp đón người lạ; “nhờ đó” truyền đạt tự nhiên ý nghĩa phương tiện của διά.
- source_word: ἔλαθόν
  choice: mà không hay biết
  rationale: Cấu trúc λανθάνω đi với phân từ diễn tả hành động xảy ra ngoài sự nhận biết của chủ thể. “Mà không hay biết” giữ đúng ý này bằng tiếng Việt tự nhiên.
- source_word: τινες
  choice: có người
  rationale: Đại từ bất định số nhiều chỉ một số người không xác định; tiếng Việt thường diễn đạt tự nhiên là “có người”.
- source_word: ξενίσαντες
  choice: đã tiếp đón
  rationale: Phân từ này chỉ việc tiếp nhận và cho khách trú ngụ. “Tiếp đón” ngắn gọn, tự nhiên và duy trì liên hệ từ vựng với lời khuyên ở đầu câu.
- source_word: ἀγγέλους
  choice: các thiên sứ
  rationale: Từ này có thể chỉ sứ giả hoặc thiên sứ. Sự gợi nhắc có khả năng cao đến những câu chuyện tiếp đón các vị khách từ trời trong Sáng Thế Ký 18–19 khiến “các thiên sứ” phù hợp nhất trong chính văn; nghĩa thay thế được giữ trong chú thích.
theological_decisions:
- issue: Nghĩa quy chiếu của ἀγγέλους
  choice: các thiên sứ theo nghĩa những hữu thể từ trời
  alternative: các sứ giả, có thể là con người
  rationale: Bối cảnh và sự gợi nhắc có khả năng cao đến Áp-ra-ham và Lót tiếp đón những vị khách từ trời ủng hộ nghĩa “thiên sứ”. Tuy vậy, vì từ Hy Lạp tự nó cũng có thể mang nghĩa “sứ giả”, phương án ấy được nêu trong chú thích thay vì bị loại bỏ.
translation_notes:
  register: Văn phong khuyên nhủ trang trọng nhưng hiện đại. “Tiếp đón người lạ” rõ nghĩa đối với độc giả phổ thông và phản ánh trực tiếp hơn sắc thái của φιλοξενία; “xao nhãng” thể hiện lực khuyên răn thực hành.
