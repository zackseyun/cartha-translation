source:
  edition: SBLGNT
  text: τῆς δὲ εὐποιΐας καὶ κοινωνίας μὴ ἐπιλανθάνεσθε, τοιαύταις γὰρ θυσίαις εὐαρεστεῖται ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/016.yaml
  text: And do not neglect doing good and sharing[b][a], for with such sacrifices God is pleased.
translation:
  language: vi
  text: Và đừng quên[a] làm điều lành và chia sẻ[b], vì Đức Chúa Trời hài lòng với những lễ tế như thế.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “đừng lơ là” hoặc “đừng xao nhãng”. Động từ Hy Lạp có nghĩa đen là “quên”, nhưng trong lời khuyên này hàm ý không được lơ là thực hiện những việc ấy.
    reason: lexical_alternative
  - marker: b
    text: “Chia sẻ” cũng có thể dịch là “sự tương giao” hoặc “lòng rộng rãi”; trong văn cảnh này, từ này có lẽ nhấn mạnh việc thực tế san sẻ những gì mình có với người khác.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐποιΐας
  choice: làm điều lành
  rationale: Danh từ chỉ việc chủ động làm điều tốt, đem lợi ích cho người khác. Cách diễn đạt này tự nhiên, trang trọng vừa phải và giữ được sắc thái hành động.
- source_word: κοινωνίας
  choice: chia sẻ
  rationale: Trong sự kết hợp với εὐποιΐας và trước hình ảnh 'lễ tế', từ này nhiều khả năng nói đến việc thực tế san sẻ những gì mình có; 'chia sẻ' vẫn đủ rộng để không giới hạn vào tiền bạc.
- source_word: μὴ ἐπιλανθάνεσθε
  choice: đừng quên
  rationale: Giữ sát nghĩa cơ bản của động từ Hy Lạp, đồng thời trong lời khuyên này vẫn tự nhiên và hàm ý không được lơ là thực hành.
- source_word: τοιαύταις ... θυσίαις
  choice: những lễ tế như thế
  rationale: Giữ nguyên ẩn dụ tế lễ, quy chiếu đến việc làm điều lành và chia sẻ vừa nêu.
- source_word: εὐαρεστεῖται
  choice: vui lòng về
  rationale: Diễn đạt tự nhiên việc Đức Chúa Trời hài lòng, với cụm ở cách dữ cách chỉ điều khiến Ngài vui lòng.
- source_word: ὁ θεός
  choice: Đức Chúa Trời
  rationale: Danh xưng chuẩn, trang trọng và phổ biến trong tiếng Việt Kinh Thánh.
- source_word: δὲ
  choice: Và
  rationale: Thể hiện quan hệ nối tiếp với lời khuyên trước đó mà không tạo sắc thái tương phản quá mạnh.
theological_decisions:
- issue: Bản chất của 'lễ tế' trong câu
  choice: 'Giữ hình ảnh ẩn dụ: việc làm điều lành và chia sẻ là những lễ tế khiến Đức Chúa Trời vui lòng'
  alternative: Diễn giải riêng là bố thí thay cho nghi lễ, hoặc làm phẳng thành hành vi đạo đức nói chung
  rationale: θυσίαις là ngôn ngữ tế lễ rõ ràng. Bản dịch giữ sức căng thần học giữa sự thờ phượng và hành động thực tế, không thu hẹp thành bố thí cũng không xóa bỏ ẩn dụ.
translation_notes:
  register: Tiếng Việt hiện đại, rõ ràng và trang nghiêm. Dùng 'đừng quên' để bám sát nguyên ngữ, còn chú thích nêu sắc thái thực hành; dùng 'lễ tế' để bảo toàn hình ảnh tế lễ mà người đọc phổ thông vẫn hiểu được.
