  source_fidelity: 'Bản nháp truyền đạt đúng các thành tố chính: mệnh lệnh phủ định, làm điều lành, chia sẻ, và ẩn dụ “lễ tế” khiến Đức Chúa Trời hài lòng. Tuy nhiên, chú thích a hiện được đặt sau “chia sẻ” dù nó giải thích động từ “đừng quên”; đồng thời nội dung chú thích chưa nhất quán với cách dịch chính vốn đã là nghĩa đen “đừng quên”.'
