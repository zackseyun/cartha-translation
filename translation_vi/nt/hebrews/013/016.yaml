  rationale: Bản sửa đặt lại neo chú thích theo đúng từ được giải thích, điều chỉnh chú thích a để nó thực sự là một lựa chọn dịch thay thế cho bản chính “đừng quên”, và thay “vui lòng về” bằng “hài lòng với” cho tự nhiên hơn. Không thay đổi ý nghĩa, phạm vi của “chia sẻ”, hay hình ảnh tế lễ trong nguyên ngữ.
