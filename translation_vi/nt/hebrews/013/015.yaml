source:
  edition: SBLGNT
  text: δι’ αὐτοῦ ⸀οὖν ἀναφέρωμεν θυσίαν αἰνέσεως διὰ παντὸς τῷ θεῷ, τοῦτ’ ἔστιν καρπὸν χειλέων ὁμολογούντων τῷ ὀνόματι αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/015.yaml
  text: Therefore[a], through him let us continually offer up to God a sacrifice of praise—that is[c][b], the fruit of lips confessing his name.
translation:
  language: vi
  text: Vậy, nhờ Ngài, chúng ta hãy không ngừng[a] dâng lên Đức Chúa Trời tế lễ ngợi khen, tức là hoa trái của những môi miệng[b] xưng nhận[c] danh Đức Chúa Trời.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “luôn luôn” hoặc “mọi lúc”.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “hoa trái của môi miệng chúng ta”; từ “chúng ta” không được nói rõ trong tiếng Hy Lạp.'
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể dịch: “công khai nhìn nhận”. Động từ Hy Lạp có thể chỉ việc tuyên xưng hoặc thừa nhận công khai.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δι’ αὐτοῦ
  choice: nhờ Ngài
  rationale: διά với sở hữu cách chỉ phương tiện hoặc trung gian. “Nhờ Ngài” tự nhiên trong tiếng Việt và giữ được ý rằng việc dâng tế lễ được thực hiện qua Đấng được nhắc đến trong văn mạch.
- source_word: οὖν
  choice: Vậy
  rationale: Từ này nêu kết luận hoặc lời khuyên rút ra từ phần lập luận trước; “Vậy” gọn và tự nhiên.
- source_word: ἀναφέρωμεν
  choice: chúng ta hãy ... dâng lên
  rationale: Thể giả định ngôi thứ nhất số nhiều có chức năng khích lệ. “Chúng ta hãy” giữ lực khuyên giục, còn “dâng lên” giữ sắc thái tế lễ.
- source_word: θυσίαν αἰνέσεως
  choice: tế lễ ngợi khen
  rationale: Giữ nguyên hình ảnh hiến tế và diễn đạt tự nhiên, đồng thời bảo tồn mối liên hệ với ngôn ngữ thờ phượng trong Kinh Thánh trước đó.
- source_word: διὰ παντός
  choice: không ngừng
  rationale: Cụm từ chỉ sự tiếp diễn thường xuyên hoặc liên tục. “Không ngừng” phù hợp với lời kêu gọi trong câu.
- source_word: τῷ θεῷ
  choice: lên Đức Chúa Trời
  rationale: Đối cách gián tiếp chỉ Đấng tiếp nhận lễ vật; kết hợp “dâng lên Đức Chúa Trời” là cách nói tự nhiên trong tiếng Việt.
- source_word: τοῦτ’ ἔστιν
  choice: tức là
  rationale: Dẫn vào phần giải thích tế lễ ngợi khen gồm điều gì.
- source_word: καρπὸν χειλέων
  choice: hoa trái của môi miệng
  rationale: Giữ phép ẩn dụ và âm hưởng Kinh Thánh. Không thêm “chúng ta” vì đại từ sở hữu không có trong tiếng Hy Lạp.
- source_word: ὁμολογούντων
  choice: xưng nhận
  rationale: Động từ diễn tả việc công khai thừa nhận hoặc tuyên xưng. “Xưng nhận” giữ được cả sắc thái lời nói lẫn sự nhìn nhận.
- source_word: τῷ ὀνόματι αὐτοῦ
  choice: danh Ngài
  rationale: Sau ὁμολογέω, tiếng Việt tự nhiên dùng “xưng nhận danh Ngài”; “danh” cũng giữ được ý nghĩa Kinh Thánh rộng hơn tên gọi đơn thuần.
theological_decisions:
- issue: Đối tượng được chỉ bằng αὐτοῦ trong cụm δι’ αὐτοῦ
  choice: Giữ đại từ “Ngài”; theo văn mạch, đại từ chỉ về Đức Giê-su và mang ý nghĩa trung gian.
  alternative: Nói rõ “nhờ Đức Giê-su” hoặc dùng đại từ ít hàm ý hơn như “người”.
  rationale: Văn mạch ngay trước đó tập trung vào Đức Giê-su và sự chịu khổ của Ngài. Tuy nhiên, bản dịch không thay đại từ bằng tên riêng, nhờ đó vừa bảo toàn liên kết văn mạch vừa không diễn giải quá mức.
- issue: Sức nặng của hình ảnh tế lễ
  choice: Giữ cả “dâng lên” và “tế lễ ngợi khen”.
  alternative: Diễn ý đơn giản thành “ngợi khen Đức Chúa Trời”.
  rationale: Câu Hy Lạp cố ý trình bày sự ngợi khen bằng ngôn ngữ hiến tế. Giữ hình ảnh này bảo toàn mối căng thẳng và tính liên tục thần học của đoạn văn mà không thêm kết luận giáo phái.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Dùng “Đức Chúa Trời” theo lối gọi quen thuộc trong tiếng Việt Cơ Đốc, “Ngài” để duy trì sự tôn kính, và giữ các hình ảnh “tế lễ” cùng “hoa trái của môi miệng” vì chúng có chức năng quan trọng trong câu gốc.
