id: HEB.13.5
reference: Hebrews 13:5
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀφιλάργυρος ὁ τρόπος· ἀρκούμενοι τοῖς παροῦσιν· αὐτὸς γὰρ εἴρηκεν· Οὐ μή σε ἀνῶ οὐδ’ οὐ μή σε ⸀ἐγκαταλίπω·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/005.yaml
  text: Let your way of life be free from the love of money[a], being content with what you have, for he himself has said, “I will never leave you[b], nor will I ever forsake you.”
translation:
  language: vi
  text: 'Nếp sống của anh chị em phải không ham tiền bạc; hãy thỏa lòng với những gì mình đang có[a], vì chính Ngài đã phán: “Ta quyết không lìa con, cũng chẳng bao giờ bỏ con.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sát nghĩa: “với những điều hiện có.”'
    reason: lexical_alternative
  - marker: b
    text: Lời này vang vọng những lời bảo đảm giao ước trong Cựu Ước, đặc biệt là Phục Truyền Luật Lệ Ký 31:6, 8 và Giô-suê 1:5.
    reason: cross_reference
lexical_decisions:
- source_word: ἀφιλάργυρος
  choice: không ham tiền bạc
  rationale: Diễn đạt tự nhiên đặc tính không bị chi phối bởi lòng yêu tiền, đồng thời giữ trọng tâm cụ thể về tiền bạc thay vì mở rộng thành mọi dạng tham lam.
- source_word: ὁ τρόπος
  choice: nếp sống của anh chị em
  rationale: Trong ngữ cảnh này, τρόπος chỉ cách sống hay cách cư xử. Thêm “của anh chị em” làm rõ đối tượng được khuyên bảo, vốn hàm ý trong cấu trúc Hy Lạp.
- source_word: ἀρκούμενοι
  choice: hãy thỏa lòng
  rationale: Phân từ mang lực khuyên bảo, diễn tả thái độ bằng lòng liên tục; câu mệnh lệnh tiếng Việt tự nhiên hơn mà vẫn giữ quan hệ với mệnh đề đầu.
- source_word: τοῖς παροῦσιν
  choice: với những gì mình đang có
  rationale: Cụm từ theo sát nghĩa là “với những điều hiện có”; cách dịch này tự nhiên trong tiếng Việt và bao quát những sở hữu hoặc hoàn cảnh hiện tại.
- source_word: αὐτὸς γὰρ εἴρηκεν
  choice: vì chính Ngài đã phán
  rationale: “Chính” bảo toàn sắc thái nhấn mạnh của αὐτός; thì hoàn thành được diễn đạt bằng “đã phán”, với lời phán vẫn có hiệu lực trong lập luận. “Ngài” giữ hình thức đại từ, không chèn danh từ “Đức Chúa Trời” vốn không có trong câu Hy Lạp.
- source_word: Οὐ μή σε ἀνῶ
  choice: Ta quyết không lìa con
  rationale: “Quyết không” truyền đạt sức mạnh của phủ định οὐ μή; “lìa” trang trọng nhưng vẫn dễ hiểu và phù hợp với lời bảo đảm giao ước.
- source_word: οὐδ’ οὐ μή σε ἐγκαταλίπω
  choice: cũng chẳng bao giờ bỏ con
  rationale: Cách diễn đạt này bảo toàn phủ định nhấn mạnh và ý nghĩa bỏ rơi của ἐγκαταλείπω, đồng thời tránh lặp lại quá cứng trong tiếng Việt.
theological_decisions:
- issue: Danh tính của Đấng phán trong lời trích dẫn
  choice: Giữ đại từ “chính Ngài” thay vì đưa “Đức Chúa Trời” vào chính văn.
  alternative: vì chính Đức Chúa Trời đã phán
  rationale: Ngữ cảnh cho thấy Đấng phán là Đức Chúa Trời, nhưng bản Hy Lạp dùng αὐτός chứ không có θεός. Giữ đại từ vừa bảo toàn văn bản nguồn vừa truyền đạt sự tôn kính tự nhiên trong tiếng Việt.
- issue: Cách thể hiện các phủ định nhấn mạnh trong lời trích
  choice: Dùng “quyết không ... cũng chẳng bao giờ ...”.
  alternative: Ta sẽ không bao giờ lìa con, cũng không bao giờ bỏ con
  rationale: Hai cấu trúc οὐ μή đều là lời phủ định đặc biệt mạnh. Cách dịch đã chọn truyền tải mức nhấn mạnh mà không mô phỏng máy móc cấu trúc Hy Lạp.
- issue: Sắc thái giao ước của lời bảo đảm
  choice: Giữ lời hứa trực tiếp, trang trọng bằng cặp “lìa ... bỏ”.
  alternative: để con ra đi ... bỏ rơi con
  rationale: “Lìa” và “bỏ” duy trì âm hưởng trang trọng của lời Kinh Thánh mà không biến lời hứa thành thuật ngữ giáo phái hay giải nghĩa quá mức.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. “Anh chị em” thể hiện số nhiều của đối tượng được khuyên bảo; trong lời trích, “Ta ... con” giữ giọng phán trực tiếp và trang nghiêm. Các dấu chú thích [a], [b] đều xuất hiện trong chính văn.
