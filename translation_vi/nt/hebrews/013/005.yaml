  source_fidelity: 'Bản dịch phản ánh đúng cấu trúc khuyên bảo của câu Hy Lạp: τρόπος là “nếp sống,” ἀφιλάργυρος giữ trọng tâm cụ thể là không ham/yêu tiền bạc, và ἀρκούμενοι τοῖς παροῦσιν được diễn đạt tự nhiên là “hãy thỏa lòng với những gì mình đang có.” “Vì chính Ngài đã phán” chuyển tải được αὐτὸς γὰρ εἴρηκεν, gồm cả sự nhấn mạnh của αὐτός. Hai phủ định mạnh οὐ μή được truyền đạt thích đáng qua “quyết không” và “chẳng bao giờ.”'
