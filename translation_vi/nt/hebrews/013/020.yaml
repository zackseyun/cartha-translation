id: HEB.13.20
reference: Hebrews 13:20
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ὁ δὲ θεὸς τῆς εἰρήνης, ὁ ἀναγαγὼν ἐκ νεκρῶν τὸν ποιμένα τῶν προβάτων τὸν μέγαν ἐν αἵματι διαθήκης αἰωνίου, τὸν κύριον ἡμῶν Ἰησοῦν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/020.yaml
  text: May the God of peace[a], who brought up from the dead our Lord Jesus, the great shepherd of the sheep, by the blood of an eternal covenant,
translation:
  language: vi
  text: Nguyện Đức Chúa Trời của sự bình an, Đấng đã đem Chúa Giê-su, Chúa chúng ta, từ cõi chết lên—Đấng chăn chiên vĩ đại của bầy chiên—nhờ huyết của một giao ước đời đời,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc có thể sắp xếp ý: “Đấng đã đem Chúa Giê-su, Chúa chúng ta, từ cõi chết lên nhờ huyết của giao ước đời đời—Đấng chăn chiên vĩ đại của bầy chiên.” Cụm Hy Lạp được dịch là “nhờ huyết của một giao ước đời đời” có thể được liên kết với các phần lân cận theo những cách hơi khác nhau.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ὁ δὲ
  choice: Nguyện
  rationale: δέ đánh dấu sự chuyển sang lời cầu chúc; tiếng Việt không cần dịch bằng một từ nối riêng. Thể cầu chúc của toàn câu được diễn đạt tự nhiên bằng “Nguyện”.
- source_word: θεὸς τῆς εἰρήνης
  choice: Đức Chúa Trời bình an
  rationale: Cách nói tự nhiên, trang trọng, diễn đạt Đức Chúa Trời là nguồn và Đấng gắn liền với bình an, không biến cụm sở hữu cách thành một nhận định đơn thuần rằng Ngài có tính khí ôn hòa.
- source_word: ὁ ἀναγαγὼν ἐκ νεκρῶν
  choice: Đấng đã đem ... từ cõi chết trở lên
  rationale: Giữ hình ảnh hướng lên của ἀνάγω và công thức phục sinh ἐκ νεκρῶν, đồng thời dùng tiếng Việt dễ hiểu.
- source_word: τὸν ποιμένα τῶν προβάτων τὸν μέγαν
  choice: Đấng Chăn Chiên vĩ đại của bầy chiên
  rationale: Giữ ẩn dụ chăn chiên và sắc thái nhấn mạnh của μέγαν; “bầy chiên” tự nhiên hơn “những con chiên” trong tiếng Việt.
- source_word: ἐν αἵματι
  choice: nhờ huyết
  rationale: Diễn đạt khả năng công cụ/phương tiện của ἐν mà không giải thích quá mức mối liên hệ thần học.
- source_word: διαθήκης αἰωνίου
  choice: của một giao ước đời đời
  rationale: “Giao ước” phù hợp lập luận của thư Hê-bơ-rơ; “một” phản ánh cụm Hy Lạp không có mạo từ nhưng không phủ nhận việc tác giả có thể nói đến giao ước đã biết.
- source_word: τὸν κύριον ἡμῶν Ἰησοῦν
  choice: Chúa chúng ta là Đức Chúa Jêsus
  rationale: Giữ danh xưng κύριος và quan hệ sở hữu; cấu trúc “là” làm rõ đồng vị ngữ trong tiếng Việt.
theological_decisions:
- issue: Quan hệ của ἐν αἵματι διαθήκης αἰωνίου với các thành phần trước đó
  choice: 'Gắn chủ yếu với hành động Đức Chúa Trời đem Đức Chúa Jêsus từ cõi chết trở lên: “nhờ huyết của một giao ước đời đời”'
  alternative: Có thể gắn gần hơn với “Đấng Chăn Chiên vĩ đại của bầy chiên”, hoặc hiểu ἐν theo nghĩa “trong/qua huyết”
  rationale: Vị trí của cụm từ Hy Lạp cho phép hơn một cách liên kết. Bản chính chọn cách hiểu công cụ gắn với hành động phục sinh nhưng dùng chú thích để giữ lại sự mơ hồ thực sự của nguyên văn.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “Đức Chúa Jêsus” và “Đấng Chăn Chiên” theo văn phong Kinh Thánh quen thuộc; dấu gạch ngang giúp nhận rõ cụm đồng vị mà không làm mất dòng chảy của lời cầu chúc. Câu này tiếp tục sang câu 21 nên kết thúc bằng dấu phẩy.
