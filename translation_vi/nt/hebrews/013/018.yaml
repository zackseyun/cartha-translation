- from: Hãy cầu nguyện cho chúng tôi, vì chúng tôi tin chắc[a] rằng chúng tôi có một lương tâm tốt[b], bởi chúng tôi muốn cư xử đúng đắn trong mọi việc.[c]
  to: Hãy cầu nguyện cho chúng tôi, vì chúng tôi tin chắc[a] rằng chúng tôi có một lương tâm tốt[b], bởi lẽ chúng tôi muốn cư xử tốt trong mọi việc[c].
