id: HEB.13.18
reference: Hebrews 13:18
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Προσεύχεσθε περὶ ἡμῶν, ⸀πειθόμεθα γὰρ ὅτι καλὴν συνείδησιν ἔχομεν, ἐν πᾶσιν καλῶς θέλοντες ἀναστρέφεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/018.yaml
  text: Pray for us[a], for we are convinced that we have a good conscience[c][b], since we want to conduct ourselves well in everything.
translation:
  language: vi
  text: Hãy cầu nguyện cho chúng tôi, vì chúng tôi tin chắc[a] rằng chúng tôi có một lương tâm tốt[b], bởi lẽ chúng tôi muốn cư xử tốt trong mọi việc[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “chúng tôi xác tín” hoặc “chúng tôi được thuyết phục.”'
    reason: lexical_alternative
  - marker: b
    text: 'Hay: “một lương tâm trong sạch.”'
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể dịch sát cấu trúc phân từ hơn: “với mong muốn cư xử tốt trong mọi việc.”'
    reason: lexical_and_syntactic_alternative
lexical_decisions:
- source_word: Προσεύχεσθε
  choice: Hãy cầu nguyện
  rationale: Thể mệnh lệnh hiện tại, ngôi thứ hai số nhiều. “Hãy cầu nguyện” tự nhiên trong tiếng Việt; không thêm “không ngừng” vì như vậy sẽ diễn giải quá mức sắc thái thể của động từ.
- source_word: περὶ ἡμῶν
  choice: cho chúng tôi
  rationale: Trong ngữ cảnh cầu nguyện, περί với sở hữu cách mang nghĩa tự nhiên là cầu nguyện “cho” ai.
- source_word: πειθόμεθα
  choice: chúng tôi tin chắc
  rationale: Diễn đạt sự xác tín vững vàng của người viết, đồng thời giữ được trọng tâm nhận thức của πείθω.
- source_word: καλὴν συνείδησιν
  choice: một lương tâm tốt
  rationale: Bám sát cả tính từ καλὴν và danh từ συνείδησιν, không thu hẹp nghĩa thành riêng ý “không thấy áy náy” hay “trong sạch”.
- source_word: ἔχομεν
  choice: chúng tôi có
  rationale: Chuyển ngữ trực tiếp động từ hiện tại, không cần diễn ý.
- source_word: ἐν πᾶσιν
  choice: trong mọi việc
  rationale: Hiểu cụm trung tính số nhiều theo nghĩa trạng ngữ bao quát; cách nói này rõ ràng và tự nhiên trong tiếng Việt hiện đại.
- source_word: καλῶς
  choice: đúng đắn
  rationale: Trong ngữ cảnh đạo đức và cách sống, “đúng đắn” truyền đạt tự nhiên ý sống hoặc cư xử tốt mà không giới hạn vào một phẩm chất cụ thể.
- source_word: θέλοντες
  choice: bởi chúng tôi muốn
  rationale: Phân từ hiện tại diễn tả ý muốn đang có. Dùng mệnh đề nguyên nhân giúp câu tiếng Việt sáng rõ nhưng vẫn ghi nhận cách hiểu gần với cấu trúc phân từ trong chú thích.
- source_word: ἀναστρέφεσθαι
  choice: cư xử
  rationale: Động từ nói đến cách sống hay cách hành xử; “cư xử” giữ được sắc thái đạo đức và dễ hiểu đối với độc giả hiện đại.
theological_decisions:
- issue: Quan hệ của cụm phân từ cuối câu với lời khẳng định về lương tâm tốt
  choice: 'Diễn đạt theo quan hệ giải thích/nguyên nhân: “bởi chúng tôi muốn cư xử đúng đắn trong mọi việc”'
  alternative: 'Giữ quan hệ lỏng hơn: “với mong muốn cư xử đúng đắn trong mọi việc”'
  rationale: Phân từ θέλοντες có thể gắn vào mệnh đề trước mà không xác định minh nhiên quan hệ logic. Bản chính dùng quan hệ nguyên nhân để câu tiếng Việt tự nhiên, nhưng chú thích bảo lưu cách hiểu ít xác định hơn; câu không hàm ý người viết tự nhận là hoàn toàn vô tội.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng vừa phải và dễ hiểu. Câu giữ đại từ số nhiều “chúng tôi,” tránh thuật ngữ giáo phái, đồng thời dùng chú thích để bảo lưu các khả năng từ vựng và cú pháp thực sự của nguyên văn.
