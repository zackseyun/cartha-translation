id: HEB.4.2
reference: Hebrews 4:2
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ γάρ ἐσμεν εὐηγγελισμένοι καθάπερ κἀκεῖνοι, ἀλλ’ οὐκ ὠφέλησεν ὁ λόγος τῆς ἀκοῆς ἐκείνους, μὴ ⸀συγκεκερασμένους τῇ πίστει τοῖς ἀκούσασιν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/002.yaml
  text: For indeed[a], we also have had good news proclaimed to us, just as they did; but the message they heard did not benefit them[b], because it was not united by faith with those who heard.
translation:
  language: vi
  text: Vì thật vậy, chúng ta cũng đã được loan báo tin mừng như họ; nhưng lời họ nghe không đem lại ích lợi gì cho họ, vì họ đã không được liên kết với những người đã nghe nhờ đức tin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Một dị bản và cách dịch truyền thống: “vì lời ấy không hòa với đức tin nơi những người nghe.”'
    reason: textual_variant
lexical_decisions:
- source_word: εὐηγγελισμένοι
  choice: đã được loan báo tin mừng
  rationale: 'Diễn đạt thể hoàn thành bị động đi với ἐσμεν: việc loan báo đã xảy ra và vẫn còn liên hệ ở hiện tại; đồng thời giữ nghĩa động từ mà không biến câu này thành một thuật ngữ kỹ thuật về việc ''được truyền giáo''.'
- source_word: καθάπερ κἀκεῖνοι
  choice: như họ
  rationale: Cách nói tự nhiên, chỉ thế hệ trong hoang mạc và nhấn mạnh rằng cả hai nhóm đều đã nhận lời loan báo từ Đức Chúa Trời.
- source_word: ὁ λόγος τῆς ἀκοῆς
  choice: lời họ nghe
  rationale: Chuyển ngữ tự nhiên cấu trúc sở hữu cách, giữ λόγος là lời/sứ điệp và ἀκοή là điều được nghe.
- source_word: ὠφέλησεν
  choice: không đem lại ích lợi gì
  rationale: Diễn đạt rõ việc lời đã nghe không tạo nên kết quả có ích cho họ.
- source_word: συγκεκερασμένους
  choice: được ... kết hợp
  rationale: Giữ hình ảnh hòa trộn/kết hợp của động từ, đồng thời phù hợp với dạng đối cách số nhiều trong bản SBLGNT, vốn quy chiếu tự nhiên về ἐκείνους ('họ').
- source_word: πίστει
  choice: đức tin
  rationale: Trong ngữ cảnh đối lập giữa nghe và đáp ứng bằng lòng tin, 'đức tin' là cách dịch chuẩn và thích hợp; cách hiểu 'lòng tin' cũng có thể có.
- source_word: τοῖς ἀκούσασιν
  choice: với những người đã nghe
  rationale: Bám sát phân từ quá khứ của ἀκούω và tránh diễn giải quá mức rằng việc nghe nhất thiết đã mang nghĩa vâng phục.
theological_decisions:
- issue: Ý nghĩa của πίστις
  choice: đức tin
  alternative: lòng tin
  rationale: Ngữ cảnh nhấn mạnh sự đáp ứng đối với lời đã nghe. 'Đức tin' giữ thuật ngữ thần học quen thuộc nhưng không xác định thêm một hệ thống giáo lý riêng.
- issue: Chủ thể của mệnh đề cuối
  choice: họ không được đức tin kết hợp với những người đã nghe
  alternative: lời ấy không hòa với đức tin nơi những người nghe
  rationale: Bản SBLGNT có συγκεκερασμένους ở đối cách giống đực số nhiều, phù hợp nhất với ἐκείνους ('họ'). Dị bản giống đực số ít hỗ trợ cách dịch truyền thống và được bảo lưu trong chú thích để không che khuất vấn đề văn bản và cú pháp.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại, dùng 'loan báo tin mừng' thay cho lối nói kỹ thuật hơn. Mệnh đề cuối cố ý giữ sự khác thường của bản văn SBLGNT; chú thích trình bày cách đọc truyền thống.
