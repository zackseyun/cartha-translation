id: HEB.4.9
reference: Hebrews 4:9
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἄρα ἀπολείπεται σαββατισμὸς τῷ λαῷ τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/009.yaml
  text: So then[a], a Sabbath rest remains for the people of God.
translation:
  language: vi
  text: Vậy, vẫn còn một sự an nghỉ Sa-bát[a] dành cho dân của Đức Chúa Trời.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “việc giữ ngày Sa-bát.” Từ Hy Lạp σαββατισμός hiếm gặp và trực tiếp gợi đến Sa-bát; ở đây, từ này có lẽ chỉ một sự an nghỉ mang tính Sa-bát vẫn còn dành cho dân Đức Chúa Trời.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄρα
  choice: Vậy
  rationale: Tiểu từ suy luận kết luận từ lập luận ngay trước đó; “Vậy” tự nhiên, rõ nghĩa và giữ được quan hệ logic.
- source_word: ἀπολείπεται
  choice: vẫn còn
  rationale: Diễn tả điều tiếp tục tồn tại hoặc được để dành; “vẫn còn” làm rõ sắc thái tiếp diễn của dạng hiện tại.
- source_word: σαββατισμός
  choice: một sự an nghỉ Sa-bát
  rationale: Danh từ hiếm này gợi trực tiếp đến Sa-bát và trong văn cảnh chỉ sự nghỉ ngơi mang tính Sa-bát; cách dịch giữ cả liên hệ từ vựng lẫn độ mở giữa sự nghỉ ngơi và việc giữ Sa-bát.
- source_word: τῷ λαῷ
  choice: dành cho dân
  rationale: Dữ cách ở đây tự nhiên được hiểu theo nghĩa lợi ích hoặc đối tượng thụ hưởng; “dành cho” phù hợp với điều vẫn còn sẵn cho họ.
- source_word: τοῦ θεοῦ
  choice: của Đức Chúa Trời
  rationale: Giữ quan hệ sở hữu và thuộc về trong nguyên ngữ, đồng thời dùng cách gọi trang trọng, quen thuộc trong văn phong Kinh Thánh tiếng Việt.
theological_decisions:
- issue: Ý nghĩa của σαββατισμός trong Hê-bơ-rơ 4:9
  choice: Một sự an nghỉ mang tính Sa-bát vẫn còn dành cho dân Đức Chúa Trời.
  alternative: Việc giữ ngày Sa-bát theo nghĩa nghi lễ; hoặc một sự nghỉ ngơi hoàn toàn ẩn dụ, không còn âm hưởng Sa-bát.
  rationale: Từ ngữ hiếm này trực tiếp gợi đến Sa-bát, còn văn cảnh nối kết sự an nghỉ của Đức Chúa Trời, ngày thứ bảy và sự an nghỉ được hứa cho dân Ngài. “Sự an nghỉ Sa-bát” giữ nguyên căng thẳng thần học ấy mà không thu hẹp thành nghi lễ hằng tuần hay làm mất liên hệ với Sa-bát.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Giữ thuật ngữ “Sa-bát” để bảo toàn liên hệ rõ ràng với ngày thứ bảy trong lập luận của phân đoạn; dùng “sự an nghỉ” thay vì chỉ “sự nghỉ ngơi” để phù hợp sắc thái thần học mà không áp đặt một cách giải nghĩa hệ phái.
