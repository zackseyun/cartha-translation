  source_fidelity: Bản nháp truyền đạt đúng cấu trúc suy luận, chức danh thượng tế, lời khuyên giữ vững sự tuyên xưng, và danh hiệu «Con Đức Chúa Trời». Tuy nhiên, «đi xuyên qua» hơi mạnh hơn διέρχομαι trong ngữ cảnh này, còn «các tầng trời» có thể gợi một mô hình các tầng trời rõ hơn điều số nhiều οὐρανούς tự nó đòi hỏi.
  naturalness: Câu nhìn chung dễ hiểu, nhưng «vĩ đại» ít tự nhiên hơn «cao cả» khi bổ nghĩa cho «thượng tế» trong văn phong Kinh Thánh hiện đại. «Đi qua các tầng trời» vừa tự nhiên vừa sát nguyên ngữ hơn.
  terminology: Dùng «vị thượng tế» là cách gọi trang trọng, hiện đại và ngắn gọn cho ἀρχιερεύς. Giữ «Giê-su, Con Đức Chúa Trời» để không thêm tước hiệu không có trong câu nguồn; chính tả «Giê-su» phù hợp tiếng Việt hiện đại. «Lời tuyên xưng của chúng ta» diễn đạt rõ chủ thể số nhiều của lời khuyên và tự nhiên hơn «của mình».
