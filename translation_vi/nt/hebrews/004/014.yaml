id: HEB.4.14
reference: Hebrews 4:14
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἔχοντες οὖν ἀρχιερέα μέγαν διεληλυθότα τοὺς οὐρανούς, Ἰησοῦν τὸν υἱὸν τοῦ θεοῦ, κρατῶμεν τῆς ὁμολογίας·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/014.yaml
  text: Therefore[a], since we have a great high priest who has passed through the heavens—Jesus the Son of God—let us hold fast to our confession.
translation:
  language: vi
  text: Vậy, vì chúng ta có một vị thượng tế cao cả đã đi qua các tầng trời[a]—Giê-su, Con Đức Chúa Trời—nên hãy giữ vững lời tuyên xưng của chúng ta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đã đi qua các tầng trời.” Tiếng Hy Lạp dùng danh từ “trời” ở số nhiều.'
    reason: Nêu phương án dịch gần với động từ Hy Lạp và giải thích rằng danh từ chỉ “trời” ở dạng số nhiều.
lexical_decisions:
- source_word: Ἔχοντες οὖν
  choice: Vậy, vì chúng ta có
  rationale: Phân từ ἔχοντες nêu cơ sở cho lời khuyên, còn οὖν nối kết suy luận với phần trước. Cách diễn đạt này tự nhiên trong tiếng Việt và giữ cả quan hệ nguyên nhân lẫn kết luận.
- source_word: ἀρχιερέα μέγαν
  choice: một thầy tế lễ thượng phẩm vĩ đại
  rationale: Giữ danh xưng chức vụ và nhấn mạnh phẩm chất μέγαν. Mạo từ bất định “một” phù hợp với cấu trúc không có mạo từ trong tiếng Hy Lạp và ngữ pháp tiếng Việt.
- source_word: διεληλυθότα τοὺς οὐρανούς
  choice: đã đi xuyên qua các tầng trời
  rationale: “Đã đi xuyên qua” phản ánh động từ διέρχομαι ở thì hoàn thành, diễn tả hành động đã hoàn tất với ý nghĩa còn tiếp diễn; “các tầng trời” giữ dạng số nhiều của οὐρανούς mà không xác định một hệ thống vũ trụ học cụ thể.
- source_word: Ἰησοῦν τὸν υἱὸν τοῦ θεοῦ
  choice: Đức Chúa Jêsus, Con Đức Chúa Trời
  rationale: Dùng dạng tên quen thuộc trong văn phong Kinh Thánh tiếng Việt và giữ nguyên danh hiệu Kitô học “Con Đức Chúa Trời”, không diễn giải thêm.
- source_word: κρατῶμεν
  choice: chúng ta hãy giữ vững
  rationale: Thể giả định dùng để khuyên giục được diễn đạt bằng “hãy”; “giữ vững” truyền tải lời kêu gọi tiếp tục kiên trì.
- source_word: τῆς ὁμολογίας
  choice: lời tuyên xưng của mình
  rationale: ὁμολογία chỉ điều cộng đồng công khai tuyên xưng. “Của mình” làm rõ quan hệ sở hữu được ngữ cảnh hàm ý, đồng thời tự nhiên hơn trong tiếng Việt.
theological_decisions:
- issue: Cách dịch danh hiệu υἱὸς τοῦ θεοῦ
  choice: Con Đức Chúa Trời
  alternative: Con của Đức Chúa Trời
  rationale: Giữ dạng danh hiệu trang trọng và quen thuộc, không làm giảm nội dung Kitô học cũng không thêm cách giải thích thần học ngoài văn bản.
- issue: Giữ hình ảnh số nhiều τοὺς οὐρανούς
  choice: các tầng trời
  alternative: trời
  rationale: Bảo tồn số nhiều và hình ảnh về việc Đức Chúa Jêsus đi xuyên qua các cõi trời, nhưng không áp đặt số lượng hay một mô hình vũ trụ học cụ thể.
- issue: Quan hệ giữa phân từ Ἔχοντες và lời khuyên κρατῶμεν
  choice: vì… nên… hãy
  alternative: có… vậy hãy
  rationale: Diễn đạt rõ rằng chức tế lễ thượng phẩm của Đức Chúa Jêsus là nền tảng cho lời kêu gọi giữ vững lời tuyên xưng, đúng với lực lập luận của câu.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Giữ thuật ngữ Kinh Thánh quen thuộc “thầy tế lễ thượng phẩm” và “Con Đức Chúa Trời”; dùng dấu gạch ngang để làm nổi bật phần đồng vị xác định vị thầy tế lễ thượng phẩm là Đức Chúa Jêsus.
