revisions:
- from: Vậy, vì chúng ta có một thầy tế lễ thượng phẩm vĩ đại đã đi xuyên qua các tầng trời—Đức Chúa Jêsus, Con Đức Chúa Trời—nên chúng ta hãy giữ vững lời tuyên xưng của mình.[a]
  to: Vậy, vì chúng ta có một vị thượng tế cao cả đã đi qua các tầng trời[a]—Giê-su, Con Đức Chúa Trời—nên hãy giữ vững lời tuyên xưng của chúng ta.
