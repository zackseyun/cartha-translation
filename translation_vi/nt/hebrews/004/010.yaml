source:
  edition: SBLGNT
  text: ὁ γὰρ εἰσελθὼν εἰς τὴν κατάπαυσιν αὐτοῦ καὶ αὐτὸς κατέπαυσεν ἀπὸ τῶν ἔργων αὐτοῦ ὥσπερ ἀπὸ τῶν ἰδίων ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/010.yaml
  text: For the one who has entered his rest has himself also rested from his works[b][a], just as God did from his own.
translation:
  language: vi
  text: Vì người đã vào sự an nghỉ của Ngài[a] cũng đã tự mình nghỉ khỏi các công việc của mình[b], như Đức Chúa Trời đã nghỉ khỏi các công việc của chính Ngài.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “sự an nghỉ của người ấy.” Trong văn mạch Hê-bơ-rơ 3–4, đại từ này nhiều khả năng chỉ Đức Chúa Trời và sự an nghỉ của Ngài.'
    reason: alternative_reading
  - marker: b
    text: Cũng có thể dịch là “đã ngưng các công việc của mình.” Động từ Hy Lạp này cùng gốc với từ được dịch là “sự an nghỉ” trong câu này, nên bản dịch giữ cách dùng lặp lại của từ “nghỉ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ... εἰσελθὼν
  choice: người đã vào
  rationale: Mạo từ đi với phân từ bất định quá khứ tạo thành danh từ chỉ một người nói chung và hàm ý việc đi vào đã xảy ra.
- source_word: γὰρ
  choice: Vì
  rationale: Giới từ liên kết này nêu lý do giải thích cho lời khẳng định ngay trước đó.
- source_word: κατάπαυσιν
  choice: sự an nghỉ
  rationale: Giữ thuật ngữ chủ đạo của Hê-bơ-rơ 3–4 và mối liên hệ với sự an nghỉ của Đức Chúa Trời; “an nghỉ” tự nhiên và trang trọng hơn “nghỉ ngơi” trong văn cảnh này.
- source_word: αὐτοῦ (sau κατάπαυσιν)
  choice: của Ngài
  rationale: Đại từ Hy Lạp tự nó có thể quy chiếu khác nhau, nhưng văn cảnh gần nhất cho thấy sự an nghỉ thuộc về Đức Chúa Trời. Cách viết “Ngài” diễn đạt quy chiếu ấy mà không thay đại từ bằng danh xưng.
- source_word: καὶ αὐτὸς
  choice: thì chính người ấy cũng
  rationale: Thể hiện cả sắc thái nhấn mạnh của αὐτός lẫn ý bổ sung của καί bằng tiếng Việt tự nhiên.
- source_word: κατέπαυσεν
  choice: đã nghỉ
  rationale: Giữ sự lặp lại có chủ ý giữa κατάπαυσις và động từ cùng gốc καταπαύω; ý “ngưng” được ghi ở chú thích như một khả năng từ vựng.
- source_word: ἀπὸ τῶν ἔργων αὐτοῦ
  choice: khỏi các công việc mình
  rationale: “Công việc” là nghĩa rộng, trung tính của ἔργα; đại từ phản thân “mình” làm rõ đây là công việc của người đã bước vào sự an nghỉ mà không gán cho chúng một ý nghĩa giáo lý hẹp.
- source_word: ὥσπερ
  choice: cũng như
  rationale: Diễn đạt tự nhiên sự so sánh trực tiếp với việc Đức Chúa Trời nghỉ khỏi công việc Ngài.
- source_word: ἀπὸ τῶν ἰδίων
  choice: khỏi các công việc của chính Ngài
  rationale: Tiếng Hy Lạp tỉnh lược danh từ “công việc,” nhưng tiếng Việt cần nhắc lại để câu rõ nghĩa; “chính” bảo toàn sắc thái nhấn mạnh của ἰδίων.
- source_word: ὁ θεός
  choice: Đức Chúa Trời
  rationale: Danh xưng tiếng Việt phổ thông, trang trọng dành cho θεός khi chỉ Đức Chúa Trời trong văn cảnh Kinh Thánh.
theological_decisions:
- issue: Đối tượng quy chiếu của αὐτοῦ trong cụm “sự an nghỉ của Ngài”
  choice: Hiểu là sự an nghỉ của Đức Chúa Trời mà người tin bước vào.
  alternative: Hiểu là sự an nghỉ của chính người đã bước vào.
  rationale: Mạch lập luận Hê-bơ-rơ 3–4 nhiều lần nói về sự an nghỉ của Đức Chúa Trời và đặt nền trên việc chính Ngài nghỉ. Tuy vậy, bản dịch giữ hình thức đại từ thay vì đổi thành “sự an nghỉ của Đức Chúa Trời,” nhằm không xóa sạch độ mở ngữ pháp của nguyên văn.
- issue: Ý nghĩa của việc nghỉ khỏi “các công việc”
  choice: Giữ nghĩa rộng, không xác định đó là công đức, lao nhọc hay một loại hành động cụ thể.
  alternative: Diễn giải là thôi nỗ lực để được cứu hoặc chấm dứt mọi lao nhọc.
  rationale: Câu Hy Lạp không tự giới hạn ἔργα vào một phạm trù giáo lý cụ thể; bản dịch tránh nhập thêm một cách giải nghĩa hệ phái.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “sự an nghỉ” để duy trì thuật ngữ xuyên suốt phân đoạn; cấu trúc “chính người ấy cũng” bảo toàn điểm nhấn của nguyên văn mà vẫn tự nhiên trong tiếng Việt.
