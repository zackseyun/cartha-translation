revisions:
- from: 'Vì chúng ta là những người đã tin thì bước vào sự an nghỉ, như Ngài đã phán: “Như Ta đã thề trong cơn thịnh nộ của Ta: ‘Chắc chắn chúng sẽ không được bước vào sự an nghỉ của Ta,’”[a] mặc dù các công việc của Ngài đã hoàn tất từ khi sáng tạo thế giới.[b]'
  to: 'Vì chúng ta, những người đã tin, bước vào sự an nghỉ, như Ngài đã phán: “Như Ta đã thề trong cơn thịnh nộ của Ta rằng: ‘Họ sẽ không bao giờ bước vào sự an nghỉ của Ta.’”[a] mặc dù các công việc của Ngài đã hoàn tất từ khi thế giới được dựng nên.[b]'
  rationale: Sửa cú pháp mở đầu cho tự nhiên, thay dạng bị động không có trong nguyên ngữ bằng động từ chủ động, và làm nhất quán đại từ trong lời trích cùng chú thích. Bản văn vẫn giữ nghĩa phủ định dứt khoát của công thức thề, trong khi chú thích bảo tồn hình thức điều kiện sát chữ của tiếng Hy Lạp.
  reviewer_model: gpt-5.6-terra
