id: HEB.4.3
reference: Hebrews 4:3
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εἰσερχόμεθα γὰρ ⸀εἰς κατάπαυσιν οἱ πιστεύσαντες, καθὼς εἴρηκεν· Ὡς ὤμοσα ἐν τῇ ὀργῇ μου, Εἰ εἰσελεύσονται εἰς τὴν κατάπαυσίν μου, καίτοι τῶν ἔργων ἀπὸ καταβολῆς κόσμου γενηθέντων,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/003.yaml
  text: For we who have believed enter the rest[a], just as he has said, “As I swore in my wrath[b], ‘If they shall enter my rest,’” although his works were finished from the foundation of the world.
translation:
  language: vi
  text: 'Vì chúng ta, những người đã tin, bước vào sự an nghỉ, như Ngài đã phán: “Như Ta đã thề trong cơn thịnh nộ của Ta rằng: ‘Họ sẽ không bao giờ bước vào sự an nghỉ của Ta.’”[a] mặc dù các công việc của Ngài đã hoàn tất từ khi thế giới được dựng nên.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hy Lạp sát chữ là: “Nếu họ sẽ bước vào sự an nghỉ của Ta”; đây là công thức thề mang nghĩa: “Chắc chắn họ sẽ không bước vào sự an nghỉ của Ta” hoặc “Họ sẽ không bao giờ bước vào sự an nghỉ của Ta.”'
    reason: alternative_reading
  - marker: b
    text: 'Cũng có thể dịch: “dù các công việc của Ngài đã được hoàn tất từ khi thế giới được dựng nên.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσερχόμεθα
  choice: bước vào
  rationale: 'Thì hiện tại được giữ với nghĩa hiện thời/khái quát: những người tin bước vào sự an nghỉ; không thu hẹp ý thành thuần túy tương lai.'
- source_word: κατάπαυσιν
  choice: sự an nghỉ
  rationale: Chỉ sự nghỉ ngơi của Đức Chúa Trời đang được bàn đến; “sự an nghỉ” tự nhiên, trang trọng và giữ được mối liên hệ với văn cảnh.
- source_word: οἱ πιστεύσαντες
  choice: chúng ta là những người đã tin
  rationale: Giữ động tính từ bất định quá khứ và sự tự bao gồm của ngôi thứ nhất số nhiều.
- source_word: καθὼς εἴρηκεν
  choice: như Ngài đã phán
  rationale: Thì hoàn thành cho thấy lời đã phán vẫn còn hiệu lực; “đã phán” phù hợp văn phong trích dẫn Kinh Thánh.
- source_word: Ὡς ὤμοσα ἐν τῇ ὀργῇ μου
  choice: Như Ta đã thề trong cơn thịnh nộ của Ta
  rationale: “Thịnh nộ” giữ sắc thái nghiêm trọng và phán xét của ὀργή.
- source_word: Εἰ εἰσελεύσονται εἰς τὴν κατάπαυσίν μου
  choice: Chắc chắn chúng sẽ không được bước vào sự an nghỉ của Ta
  rationale: Diễn đạt lực phủ định mạnh của công thức thề Semit, đồng thời chú thích hình thức điều kiện sát chữ của tiếng Hy Lạp.
- source_word: καίτοι
  choice: mặc dù
  rationale: Thể hiện rõ quan hệ nhượng bộ.
- source_word: τῶν ἔργων ... γενηθέντων
  choice: các công việc của Ngài đã hoàn tất
  rationale: Cấu trúc sở hữu cách tuyệt đối nói các công việc đã được làm xong; thêm “của Ngài” theo chủ thể rõ ràng trong văn cảnh.
- source_word: ἀπὸ καταβολῆς κόσμου
  choice: từ khi sáng tạo thế giới
  rationale: Diễn đạt tự nhiên thành ngữ chỉ lúc thế giới được dựng nên, tránh cách nói khó hiểu “đặt nền thế giới”.
theological_decisions:
- issue: Lực của lời thề trích từ Thi Thiên 95
  choice: 'Dịch công thức thề thành lời phủ định mạnh: “Chắc chắn chúng sẽ không được bước vào sự an nghỉ của Ta.”'
  alternative: 'Giữ bề mặt điều kiện: “Nếu chúng sẽ bước vào sự an nghỉ của Ta.”'
  rationale: Trong công thức thề Semit được tiếng Hy Lạp mô phỏng, εἰ với thì tương lai hàm ý một lời phủ định dứt khoát. Bản chính truyền đạt ý nghĩa, còn chú thích bảo tồn hình thức nguyên văn.
- issue: Thời tính của việc người tin bước vào sự an nghỉ
  choice: Dùng hiện tại “bước vào”.
  alternative: “sẽ bước vào” hoặc “đang bước vào”
  rationale: 'Giữ sức căng đã-có/chưa-trọn-vẹn trong lập luận: người tin hiện bước vào sự an nghỉ mà không phủ nhận sự hoàn tất trong tương lai.'
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “Ngài/Ta” trong lời nói về và của Đức Chúa Trời; giữ thuật ngữ “sự an nghỉ” xuyên suốt lập luận thần học của thư Hê-bơ-rơ.
