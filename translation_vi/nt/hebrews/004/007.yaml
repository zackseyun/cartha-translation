id: HEB.4.7
reference: Hebrews 4:7
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: πάλιν τινὰ ὁρίζει ἡμέραν, Σήμερον, ἐν Δαυὶδ λέγων μετὰ τοσοῦτον χρόνον, καθὼς ⸀προείρηται, Σήμερον ἐὰν τῆς φωνῆς αὐτοῦ ἀκούσητε, μὴ σκληρύνητε τὰς καρδίας ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/007.yaml
  text: 'Again he appoints a certain day[a], “Today,” saying through David after so long a time, just as has been said before: “Today, if you hear his voice, do not harden your hearts.”'
translation:
  language: vi
  text: 'Ngài lại ấn định một ngày—“Hôm nay”—Ngài phán qua Đa-vít[a] sau một thời gian dài như thế, đúng như đã nói trước đây:


    “Hôm nay, nếu anh em nghe tiếng Ngài,

    đừng làm cứng lòng mình.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “trong Đa-vít,” tức là trong Thi Thiên gắn với Đa-vít.'
    reason: Giữ lại cách hiểu sát chữ của ἐν Δαυὶδ và sự mơ hồ về việc cụm từ chỉ người trung gian hay thi thiên mang danh Đa-vít.
lexical_decisions:
- source_word: πάλιν
  choice: lại
  rationale: 'Đánh dấu sự lặp lại và tiếp nối lập luận: Đức Chúa Trời lại xác lập một ngày.'
- source_word: τινὰ ἡμέραν
  choice: một ngày nhất định
  rationale: Giữ sắc thái một ngày cụ thể nhưng chưa được gọi tên cho đến từ “Hôm nay” ngay sau đó.
- source_word: ὁρίζει
  choice: ấn định
  rationale: Diễn đạt hành động có thẩm quyền xác lập hay chỉ định ngày ấy, phù hợp với văn cảnh.
- source_word: Σήμερον
  choice: Hôm nay
  rationale: Giữ nguyên tên gọi có sức nhấn mạnh của ngày được chỉ định trong lời trích Thi Thiên 95.
- source_word: ἐν Δαυὶδ λέγων
  choice: khi phán qua Đa-vít
  rationale: Diễn đạt tự nhiên ý Đức Chúa Trời phán qua Đa-vít, đồng thời chú thích cách hiểu sát chữ khác.
- source_word: μετὰ τοσοῦτον χρόνον
  choice: sau một thời gian dài như thế
  rationale: Giữ sự nhấn mạnh vào khoảng thời gian rất dài kể từ thế hệ trong hoang mạc.
- source_word: καθὼς προείρηται
  choice: đúng như đã nói trước đây
  rationale: Thể hiện lời đã được nói trước đó và vẫn có giá trị trong lập luận hiện tại.
- source_word: ἐὰν τῆς φωνῆς αὐτοῦ ἀκούσητε
  choice: nếu anh em nghe tiếng Ngài
  rationale: Giữ thành ngữ Kinh Thánh “nghe tiếng” và không diễn giải quá mức thành “vâng phục,” dù sự nghe có hàm ý đáp ứng.
- source_word: μὴ σκληρύνητε τὰς καρδίας ὑμῶν
  choice: đừng làm lòng mình chai cứng
  rationale: “Chai cứng” là cách nói tự nhiên, trang trọng trong tiếng Việt về sự cố chấp nội tâm; “lòng mình” truyền đạt quan hệ sở hữu số nhiều theo lối Việt.
theological_decisions:
- issue: Ý nghĩa của “Hôm nay” trong lập luận về sự an nghỉ của Đức Chúa Trời
  choice: Giữ “Hôm nay” như cơ hội hiện tại do Đức Chúa Trời ấn định để con người đáp ứng.
  alternative: Chỉ hiểu đó là ngày lịch sử khi tác giả Thi Thiên nói, hoặc chỉ hiểu là một ngày cánh chung.
  rationale: Câu này cho thấy Đức Chúa Trời vẫn chỉ định một ngày để đáp ứng rất lâu sau thời kỳ hoang mạc, nhưng bản dịch không thu hẹp ngày ấy vào một hệ thống thần học về thời gian.
- issue: Ý nghĩa của ἐν Δαυὶδ
  choice: phán qua Đa-vít
  alternative: phán “trong Đa-vít,” nghĩa là trong thi thiên gắn với Đa-vít
  rationale: Cách dịch chính truyền đạt rõ sự trung gian của Đa-vít mà không khẳng định chi tiết về cơ chế trước tác; chú thích giữ lại khả năng hiểu cụm từ theo nghĩa chỉ vị trí trong thi thiên.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “anh em” cho đối tượng số nhiều trong lời trích, tránh đại từ cổ “các ngươi”; dùng “Ngài” để chỉ Đức Chúa Trời theo quy ước văn phong Cơ Đốc tiếng Việt.
