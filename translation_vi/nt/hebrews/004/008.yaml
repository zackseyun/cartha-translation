  text: εἰ γὰρ αὐτοὺς Ἰησοῦς κατέπαυσεν, οὐκ ἂν περὶ ἄλλης ἐλάλει μετὰ ταῦτα ἡμέρας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/008.yaml
  text: For if Joshua had given them rest[a], he would not have spoken later about another day.
translation:
  language: vi
  text: Vì nếu Giô-suê[a] đã ban cho họ sự an nghỉ, thì sau đó Đức Chúa Trời đã không nói về một ngày khác.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hy Lạp: “Giê-su”. Dạng tên Ἰησοῦς có thể chỉ Giê-su hoặc Giô-suê; ở đây ngữ cảnh chỉ Giô-suê, con trai của Nun.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἰησοῦς
  choice: Giô-suê
  rationale: Dạng tên Hy Lạp Ἰησοῦς có thể chỉ Chúa Giê-su hoặc Giô-suê. Mạch văn nói về dân Y-sơ-ra-ên vào đất dưới sự lãnh đạo của Giô-suê, nên đây là người được nhắc đến.
- source_word: κατέπαυσεν
  choice: đã cho họ được an nghỉ
  rationale: Cách dịch này thể hiện nghĩa tác động của động từ καταπαύω—làm cho ai nghỉ hoặc ban sự an nghỉ—đồng thời giữ liên hệ với chủ đề “sự an nghỉ” xuyên suốt phân đoạn.
- source_word: οὐκ ἂν ... ἐλάλει
  choice: đã không nói
  rationale: Trong mệnh đề điều kiện phản thực, οὐκ ἂν đi với thì chưa hoàn thành diễn tả kết quả trái với thực tế trong quá khứ. Cấu trúc tiếng Việt được đặt sau “nếu” và “thì” để truyền đạt lực phản thực mà không thêm chủ ngữ vốn không được nêu rõ trong câu Hy Lạp.
- source_word: περὶ ἄλλης ... ἡμέρας
  choice: đến một ngày khác
  rationale: Cụm từ chỉ một ngày khác được nói đến về sau, cho thấy lời hứa về sự an nghỉ chưa được hoàn tất trong thời Giô-suê.
- source_word: μετὰ ταῦτα
  choice: về sau
  rationale: Cách nói tự nhiên, gọn rõ, diễn đạt trình tự thời gian sau thời Giô-suê.
- source_word: γὰρ
  choice: Vì
  rationale: Từ nối này giới thiệu lý do giải thích và củng cố lập luận ngay trước đó.
theological_decisions:
- issue: Đối tượng được tên Ἰησοῦς chỉ đến trong Hê-bơ-rơ 4:8
  choice: Giô-suê
  alternative: Chúa Giê-su
  rationale: Lập luận trong ngữ cảnh liên quan đến việc dân Y-sơ-ra-ên vào đất dưới thời Giô-suê và đối chiếu điều đó với lời hứa về sự an nghỉ được nói đến sau này trong Thi Thiên 95. Tuy vậy, vì tiếng Hy Lạp dùng cùng một dạng tên cho Giê-su và Giô-suê, dữ kiện này được giữ trong chú thích.
- issue: Chủ ngữ ngầm của ἐλάλει
  choice: Không thêm chủ ngữ trong bản dịch chính
  alternative: Đức Chúa Trời đã không nói
  rationale: Động từ Hy Lạp không nêu chủ ngữ tường minh. Ngữ cảnh cho thấy người phán là Đức Chúa Trời, nhưng việc lược chủ ngữ trong tiếng Việt vừa tự nhiên trong cấu trúc này vừa tránh thêm một danh xưng không có trực tiếp trong câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Giô-suê” theo dạng tên quen thuộc trong tiếng Việt; giữ cụm “được an nghỉ” để nối kết rõ với chủ đề thần học của toàn phân đoạn. Câu sau lược chủ ngữ theo khả năng tự nhiên của tiếng Việt nhằm phản ánh việc bản Hy Lạp không nêu chủ ngữ tường minh.
