id: HEB.4.1
reference: Hebrews 4:1
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Φοβηθῶμεν οὖν μήποτε καταλειπομένης ἐπαγγελίας εἰσελθεῖν εἰς τὴν κατάπαυσιν αὐτοῦ δοκῇ τις ἐξ ὑμῶν ὑστερηκέναι·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/001.yaml
  text: Therefore[a], let us fear lest, while the promise of entering his rest still remains[c][b], any one of you should seem to have fallen short.
translation:
  language: vi
  text: Vậy, chúng ta hãy sợ[a], kẻo trong khi lời hứa về việc vào sự an nghỉ của Ngài vẫn còn[b], có ai trong anh em dường như đã không đạt được[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “chúng ta hãy kinh sợ.” Động từ Hy Lạp mạnh hơn lời khuyên đơn thuần là “hãy cẩn thận.”'
    reason: lexical_alternative
  - marker: b
    text: 'Có thể dịch sát cấu trúc hơn: “trong khi vẫn còn một lời hứa về việc vào sự an nghỉ của Ngài.”'
    reason: alternative_reading
  - marker: c
    text: 'Cũng có thể dịch: “dường như đã không đến được [đó]” hoặc “có vẻ đã hụt mất mục tiêu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Φοβηθῶμεν
  choice: chúng ta hãy sợ
  rationale: Giữ nguyên sức nặng của lời kêu gọi trực tiếp ở thể giả định mang nghĩa khích lệ; không làm nhẹ thành “hãy cẩn thận”.
- source_word: οὖν
  choice: Vậy
  rationale: Nối câu này như một kết luận rút ra từ lời cảnh báo về việc thế hệ trước không được vào sự an nghỉ.
- source_word: μήποτε
  choice: kẻo
  rationale: Diễn đạt tự nhiên sắc thái cảnh báo về một nguy cơ cần tránh.
- source_word: καταλειπομένης ἐπαγγελίας
  choice: khi lời hứa ... vẫn còn đó
  rationale: Phản ánh kết cấu sở hữu cách tuyệt đối và nhấn mạnh rằng lời hứa vẫn còn, chưa bị thu hồi hay cạn hết.
- source_word: ἐπαγγελίας εἰσελθεῖν
  choice: lời hứa được vào
  rationale: Diễn đạt gọn và tự nhiên quan hệ giữa “lời hứa” với động từ nguyên mẫu “vào”.
- source_word: κατάπαυσιν
  choice: sự an nghỉ
  rationale: Thuật ngữ phù hợp với mạch lập luận Hê-bơ-rơ 3–4, rộng hơn ý chỉ ngừng làm việc.
- source_word: αὐτοῦ
  choice: của Ngài
  rationale: Giữ đại từ của nguyên văn; cách viết hoa thể hiện quy ước tiếng Việt về đại từ chỉ Đức Chúa Trời mà không thêm danh xưng vào câu.
- source_word: δοκῇ
  choice: xem ra
  rationale: Giữ sắc thái “dường như/được thấy là” mà không quyết định liệu đây chỉ là vẻ bề ngoài hay là kết luận thực tế.
- source_word: τις ἐξ ὑμῶν
  choice: có người nào trong anh em
  rationale: Giữ nét cá thể hóa của đại từ bất định số ít cùng thành phần chỉ toàn thể mà người ấy thuộc về.
- source_word: ὑστερηκέναι
  choice: đã không đạt tới
  rationale: Diễn đạt thể hoàn thành và ý không đạt được mục tiêu đã hứa, đồng thời tránh bổ sung đối tượng không được nêu rõ trong nguyên văn.
theological_decisions:
- issue: Có nên làm nhẹ lời cảnh báo thành một lời khuyên chỉ cần thận trọng hay không
  choice: 'Giữ lời kêu gọi mạnh: “chúng ta hãy sợ”'
  alternative: “chúng ta hãy cẩn thận” hoặc “hãy đề phòng”
  rationale: φοβηθῶμεν trực tiếp nói đến sự sợ hãi. Bản dịch giữ nguyên mức độ nghiêm trọng mà không áp đặt một cách giải quyết giáo lý về sự bền đỗ hay sa ngã.
- issue: Có nên giải thích “sự an nghỉ của Ngài” ngay trong chính văn là sự an nghỉ cánh chung của Đức Chúa Trời hay không
  choice: Giữ “sự an nghỉ của Ngài”
  alternative: “sự an nghỉ của Đức Chúa Trời” hoặc “sự an nghỉ ngày Sa-bát của Ngài”
  rationale: Nguyên văn dùng đại từ; giữ đại từ tránh đưa phần giải nghĩa từ văn mạch rộng hơn vào chính câu này.
- issue: δοκῇ có hàm ý chỉ là vẻ bề ngoài hay xác nhận một thất bại thực sự
  choice: Dùng “xem ra” để giữ độ mở của nguyên văn
  alternative: “bị xem là” hoặc bỏ sắc thái biểu kiến và dịch thẳng “đã không đạt tới”
  rationale: Cách dịch không âm thầm quyết định căng thẳng giữa sự biểu hiện và thực trạng trong lời cảnh báo.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Hãy sợ” được giữ có chủ ý để bảo toàn sức nặng của lời cảnh báo; “xem ra” duy trì sự mơ hồ chân thực của δοκῇ. Cách xưng hô “anh em” phù hợp với lời nói hướng đến cộng đồng tín hữu và không làm mất nét cá thể của “có người nào”.
