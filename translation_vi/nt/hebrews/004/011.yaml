id: HEB.4.11
reference: Hebrews 4:11
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: σπουδάσωμεν οὖν εἰσελθεῖν εἰς ἐκείνην τὴν κατάπαυσιν, ἵνα μὴ ἐν τῷ αὐτῷ τις ὑποδείγματι πέσῃ τῆς ἀπειθείας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/011.yaml
  text: Therefore[a], let us make every effort to enter that rest, so that no one may fall by the same pattern of disobedience.
translation:
  language: vi
  text: Vậy, chúng ta hãy hết sức cố gắng đi vào sự an nghỉ ấy, để không ai sa ngã theo cùng một khuôn mẫu của sự bất tuân.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể hiểu là “theo cùng một gương về sự không tin”. Danh từ này có thể được hiểu dưới ánh sáng của việc thế hệ trong hoang mạc từ chối tin cậy Đức Chúa Trời, dù từ Hy Lạp ở đây trực tiếp hơn có nghĩa là “sự bất tuân”.
    reason: lexical_alternative
lexical_decisions:
- source_word: σπουδάσωμεν
  choice: chúng ta hãy hết sức cố gắng
  rationale: Thể giả định aorist được dùng như lời khích lệ chung; cách diễn đạt này truyền tải sự sốt sắng, chuyên tâm và nỗ lực nghiêm túc bằng tiếng Việt tự nhiên.
- source_word: οὖν
  choice: Vậy
  rationale: Đánh dấu kết luận suy ra từ lập luận trước đó về sự an nghỉ của Đức Chúa Trời và thất bại của thế hệ trong hoang mạc.
- source_word: εἰσελθεῖν
  choice: bước vào
  rationale: Diễn đạt tự nhiên động từ chỉ việc đi vào; ở đây làm bổ ngữ cho lời kêu gọi cố gắng.
- source_word: ἐκείνην τὴν κατάπαυσιν
  choice: sự an nghỉ ấy
  rationale: Giữ sắc thái chỉ định của ἐκείνην và liên kết với sự an nghỉ đã được bàn đến, nhưng không xác định quá mức bản chất của sự an nghỉ.
- source_word: ἵνα μὴ ... τις
  choice: để không một ai
  rationale: Giữ ý mục đích hoặc kết quả phủ định cùng sức nặng cảnh báo của câu Hy Lạp.
- source_word: ἐν τῷ αὐτῷ ... ὑποδείγματι
  choice: theo cùng một khuôn mẫu
  rationale: ὑπόδειγμα có thể là mẫu, gương hoặc tiền lệ mang tính cảnh báo; “khuôn mẫu” diễn tả việc lặp lại tiền lệ của thế hệ trong hoang mạc, còn “theo” chuyển tải tự nhiên sắc thái của ἐν trong ngữ cảnh.
- source_word: πέσῃ
  choice: sa ngã
  rationale: Giữ hình ảnh “ngã” và giọng cảnh báo nghiêm trọng; “sa ngã” tự nhiên hơn “ngã xuống” trong ngữ cảnh thất bại thuộc linh.
- source_word: τῆς ἀπειθείας
  choice: bất tuân
  rationale: ἀπείθεια trực tiếp chỉ sự không vâng phục, dù trong mạch văn Hê-bơ-rơ nó gắn chặt với sự không tin.
theological_decisions:
- issue: Mối liên hệ giữa ἀπείθεια và thất bại của thế hệ trong hoang mạc
  choice: Dùng “bất tuân” trong chính văn và ghi chú khả năng hiểu là “không tin”.
  alternative: không tin
  rationale: Hê-bơ-rơ liên kết chặt chẽ sự không tin với sự bất tuân khi giải nghĩa Thi Thiên 95, nhưng nghĩa từ vựng trực tiếp hơn của ἀπείθεια ở đây là “bất tuân”; cách dịch này giữ nguyên sức căng thần học thay vì đồng nhất hai khái niệm.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Sự an nghỉ ấy” duy trì thuật ngữ chủ chốt của mạch văn; “hết sức cố gắng” giữ sức mạnh của lời khích lệ mà không quá cổ kính. Dấu chú thích [a] xuất hiện ngay sau mệnh đề liên quan.
