revisions:
- from: Vậy, chúng ta hãy hết sức cố gắng bước vào sự an nghỉ ấy, để không một ai sa ngã theo cùng một khuôn mẫu bất tuân đó.[a]
  to: Vậy, chúng ta hãy hết sức cố gắng đi vào sự an nghỉ ấy, để không ai sa ngã theo cùng một khuôn mẫu của sự bất tuân.[a]
  rationale: Bản sửa làm rõ τῆς ἀπειθείας là “của sự bất tuân,” loại bỏ chỉ định từ không có trong mệnh đề nguồn, và chỉnh ghi chú cho tiếng Việt chuẩn. Ý nghĩa, tính mơ hồ có chủ ý giữa bất tuân và không tin, cùng vị trí neo chú thích đều được giữ nguyên.
  reviewer_model: gpt-5.6-terra
