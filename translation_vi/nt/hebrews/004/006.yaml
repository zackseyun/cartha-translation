  source_fidelity: Bản dịch phản ánh đúng mạch suy luận của ἐπεὶ οὖν, tính tiếp diễn của ἀπολείπεται, ý nghĩa “không vâng lời” của ἀπείθεια, và chú thích bảo lưu cách hiểu “không tin.” Tuy nhiên, “đã được nghe tin mừng” làm mờ nét bị động của εὐαγγελισθέντες, tức tin mừng đã được công bố cho họ.
