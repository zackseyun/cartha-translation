id: HEB.4.6
reference: Hebrews 4:6
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐπεὶ οὖν ἀπολείπεται τινὰς εἰσελθεῖν εἰς αὐτήν, καὶ οἱ πρότερον εὐαγγελισθέντες οὐκ εἰσῆλθον δι’ ἀπείθειαν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/006.yaml
  text: Therefore[a], since it remains for some to enter it, and those who formerly had the good news proclaimed to them did not enter because of disobedience,
translation:
  language: vi
  text: Vậy, vì vẫn còn có một số người sẽ bước vào sự an nghỉ ấy, và vì những người trước kia đã được loan báo tin mừng không bước vào đó vì không vâng lời,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “vì không tin.” Từ Hy Lạp có thể chỉ sự từ chối tin, được biểu lộ qua việc không vâng lời.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπεὶ οὖν
  choice: Vậy, vì
  rationale: Giữ cả sắc thái suy luận của οὖν và chức năng nêu căn cứ của ἐπεί, đồng thời tạo câu tiếng Việt tự nhiên nối tiếp lập luận trước.
- source_word: ἀπολείπεται τινὰς εἰσελθεῖν εἰς αὐτήν
  choice: vẫn còn có những người sẽ bước vào sự an nghỉ ấy
  rationale: ἀπολείπεται diễn tả điều vẫn còn hiệu lực; τινάς giữ đối tượng bất định. Dịch αὐτήν thành “sự an nghỉ ấy” để đại từ có sở chỉ rõ ràng trong tiếng Việt, theo ngữ cảnh ngay trước đó.
- source_word: οἱ πρότερον εὐαγγελισθέντες
  choice: những người trước kia đã được nghe tin mừng
  rationale: Giữ ý tiếp nhận lời công bố trong dạng bị động mà tránh lối nói nặng tính thuật ngữ như “được truyền giảng Phúc Âm”.
- source_word: οὐκ εἰσῆλθον
  choice: không bước vào
  rationale: Phản ánh trực tiếp động từ aorist phủ định và duy trì sự lặp lại với εἰσελθεῖν.
- source_word: δι’ ἀπείθειαν
  choice: vì không vâng lời
  rationale: ἀπείθεια chủ yếu chỉ sự bất tuân, nhưng trong văn cảnh cũng gắn chặt với sự không tin; bản chính giữ nghĩa hành vi, còn chú thích nêu khả năng dịch khác.
theological_decisions:
- issue: Ý nghĩa của ἀπείθεια trong lời cảnh báo về việc bước vào sự an nghỉ
  choice: vì không vâng lời
  alternative: vì không tin
  rationale: Từ này có thể bao hàm sự từ chối tin được biểu lộ bằng bất tuân. Giữ “không vâng lời” trong bản chính để không thu hẹp sự căng thẳng giữa đức tin và sự vâng phục; chú thích bảo lưu cách hiểu “không tin”.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “tin mừng” thay cho thuật ngữ giáo hội chuyên biệt; dùng “sự an nghỉ ấy” để làm rõ sở chỉ của đại từ mà không thêm một khái niệm mới ngoài văn cảnh.
