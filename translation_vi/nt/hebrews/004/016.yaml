  terminology: “Ngai ân điển,” “lòng thương xót,” và “ân điển” là các thuật ngữ chính xác, nhất quán và quen thuộc. Chú thích a được đặt đúng sau “mạnh dạn”; chú thích b được đặt đúng ở cụm chỉ sự trợ giúp kịp thời.
