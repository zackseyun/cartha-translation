id: HEB.4.16
reference: Hebrews 4:16
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: προσερχώμεθα οὖν μετὰ παρρησίας τῷ θρόνῳ τῆς χάριτος, ἵνα λάβωμεν ἔλεος καὶ χάριν εὕρωμεν εἰς εὔκαιρον βοήθειαν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/016.yaml
  text: Therefore[a], let us approach the throne of grace with boldness[b], so that we may receive mercy and find grace for timely help.
translation:
  language: vi
  text: Vậy, chúng ta hãy mạnh dạn[a] đến gần ngai ân điển, để nhận được lòng thương xót và tìm được ân điển cho sự giúp đỡ kịp thời[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đầy lòng tin cậy.” Từ Hy Lạp có thể diễn tả cả sự tin tưởng lẫn sự mạnh dạn khi nói năng hoặc đến gần.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “để được giúp đỡ khi cần thiết.” Cụm từ Hy Lạp sát nghĩa hơn chỉ sự giúp đỡ đến vào đúng thời điểm.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσερχώμεθα
  choice: chúng ta hãy đến gần
  rationale: Thể giả định hiện tại mang ý khích lệ, kêu gọi cùng hành động. “Chúng ta hãy đến gần” tự nhiên trong tiếng Việt hiện đại và giữ được hình ảnh tiến vào sự hiện diện của Đức Chúa Trời.
- source_word: οὖν
  choice: Vậy
  rationale: Biểu thị kết luận rút ra từ phần trước về chức thượng tế của Chúa Giê-xu; “Vậy” nối lập luận rõ ràng và tự nhiên.
- source_word: μετὰ παρρησίας
  choice: mạnh dạn
  rationale: παρρησία có thể chỉ sự mạnh dạn, tự tin và tự do bày tỏ. “Mạnh dạn” giữ sắc thái mạnh về quyền tự do đến gần mà không hàm ý tự phụ.
- source_word: τῷ θρόνῳ τῆς χάριτος
  choice: ngai ân điển
  rationale: Giữ nguyên ẩn dụ về ngai và mối liên hệ trực tiếp với ân điển, không quyết định quá mức quan hệ ngữ nghĩa của sở hữu cách.
- source_word: ἵνα
  choice: để
  rationale: Diễn đạt mục đích một cách ngắn gọn, tự nhiên trong tiếng Việt.
- source_word: λάβωμεν ἔλεος
  choice: nhận được lòng thương xót
  rationale: Giữ động từ “nhận” của λαμβάνω và diễn đạt ἔλεος bằng cụm từ tiếng Việt tự nhiên, chỉ lòng thương xót của Đức Chúa Trời.
- source_word: χάριν εὕρωμεν
  choice: tìm thấy ân điển
  rationale: Duy trì sự khác biệt giữa “nhận” lòng thương xót và “tìm thấy” ân điển, đồng thời giữ thuật ngữ thần học chủ chốt χάρις là “ân điển”.
- source_word: εἰς εὔκαιρον βοήθειαν
  choice: nhờ đó được giúp đỡ đúng lúc
  rationale: “Đúng lúc” phản ánh εὔκαιρος là thích hợp, kịp thời; cách dịch này không chuyển trọng tâm hoàn toàn sang tình trạng thiếu thốn của người nhận.
theological_decisions:
- issue: Sắc thái của παρρησία khi đến gần Đức Chúa Trời
  choice: mạnh dạn
  alternative: tin tưởng; đầy lòng tin cậy
  rationale: “Mạnh dạn” giữ lực nghĩa về quyền tự do, không e dè khi đến gần Đức Chúa Trời nhờ chức vụ thượng tế của Chúa Giê-xu, nhưng không thêm ý tự phụ.
- issue: Cách dịch χάρις trong mệnh đề thứ hai
  choice: ân điển
  alternative: ơn; ân huệ
  rationale: “Ân điển” duy trì mối liên hệ từ vựng với “ngai ân điển” và giữ chiều sâu thần học của χάρις mà không thêm nội dung ngoài văn bản.
- issue: Ý nghĩa của εὔκαιρον βοήθειαν
  choice: được giúp đỡ đúng lúc
  alternative: được giúp đỡ trong lúc cần thiết
  rationale: Bản dịch chính giữ trọng tâm của tiếng Hy Lạp vào sự trợ giúp đến đúng thời điểm; phương án kia hợp ngữ cảnh nhưng diễn giải rõ hơn tình trạng của người nhận.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Giữ các thuật ngữ quen thuộc “ngai,” “lòng thương xót” và “ân điển”; cấu trúc câu thể hiện lời khích lệ chung và quan hệ mục đích của nguyên văn.
