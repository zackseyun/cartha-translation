id: HEB.4.13
reference: Hebrews 4:13
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ οὐκ ἔστιν κτίσις ἀφανὴς ἐνώπιον αὐτοῦ, πάντα δὲ γυμνὰ καὶ τετραχηλισμένα τοῖς ὀφθαλμοῖς αὐτοῦ, πρὸς ὃν ἡμῖν ὁ λόγος.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/013.yaml
  text: And no creature is hidden from his sight[a], but all things are naked and laid bare to his eyes[b], to whom we must give account.
translation:
  language: vi
  text: Không một tạo vật nào bị che khuất trước mặt Ngài; nhưng tất cả đều trần trụi và phơi bày trước mắt Ngài[b], là Đấng mà chúng ta phải khai trình trước Ngài[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch sát chữ hơn: “là Đấng mà chúng ta có việc phải đối diện”; tiếng Hy Lạp cũng có thể được hiểu là “là Đấng mà lời/vấn đề của chúng ta hướng đến.”'
    reason: alternative_reading
  - marker: b
    text: Từ được dịch là “phơi bày” bắt nguồn từ một động từ hiếm, có thể gợi hình ảnh cái cổ bị để lộ hoặc bị ngửa ra sau, nhấn mạnh sự bộc lộ hoàn toàn trước Đức Chúa Trời.
    reason: lexical_alternative
lexical_decisions:
- source_word: κτίσις
  choice: tạo vật
  rationale: Danh từ số ít được dùng theo nghĩa khái quát, chỉ bất cứ hữu thể hay vật nào được dựng nên; “tạo vật” vừa gọn vừa giữ rõ ý được sáng tạo.
- source_word: ἀφανὴς
  choice: bị che khuất
  rationale: Trong văn cảnh, từ này nói đến điều không thể giấu khỏi sự xem xét của Đức Chúa Trời, chứ không nói đến tính vô hình về bản thể.
- source_word: ἐνώπιον αὐτοῦ
  choice: trước mặt Ngài
  rationale: Giữ sát nghĩa “trước Ngài” và diễn đạt tự nhiên trong tiếng Việt, đồng thời liên kết với hình ảnh “trước mắt Ngài” ở vế sau.
- source_word: πάντα
  choice: tất cả
  rationale: Đại từ trung tính số nhiều có phạm vi bao quát; “tất cả” tự nhiên và trang trọng trong tiếng Việt.
- source_word: γυμνὰ
  choice: trần trụi
  rationale: Giữ hình ảnh mạnh về tình trạng hoàn toàn không được che đậy.
- source_word: τετραχηλισμένα
  choice: phơi bày
  rationale: Phân từ hoàn thành của một động từ hiếm, nhấn mạnh tình trạng bị bộc lộ hoàn toàn; “phơi bày” rõ nghĩa mà không ép hình ảnh cái cổ còn đang được tranh luận vào chính văn.
- source_word: τοῖς ὀφθαλμοῖς αὐτοῦ
  choice: trước mắt Ngài
  rationale: Cách nói tự nhiên trong tiếng Việt để chỉ mọi sự hoàn toàn lộ rõ đối với cái nhìn của Ngài.
- source_word: πρὸς ὃν ἡμῖν ὁ λόγος
  choice: là Đấng chúng ta phải khai trình
  rationale: Cụm Hy Lạp cô đọng và có tính thành ngữ; trong văn cảnh về sự dò xét và phán xét, “phải khai trình” truyền đạt ý con người chịu trách nhiệm trước Đức Chúa Trời, còn các khả năng sát chữ hơn được ghi ở chú thích.
theological_decisions:
- issue: Cách hiểu πρὸς ὃν ἡμῖν ὁ λόγος
  choice: 'Cụm từ diễn tả trách nhiệm của con người trước Đức Chúa Trời: “là Đấng chúng ta phải khai trình.”'
  alternative: “là Đấng mà chúng ta có việc phải đối diện”; hoặc sát chữ hơn, “là Đấng mà lời/vấn đề của chúng ta hướng đến.”
  rationale: Văn cảnh gần nhấn mạnh sự thấu suốt và phán xét của Đức Chúa Trời. Bản dịch chính giữ sức cảnh báo về trách nhiệm phải trả lời trước Ngài, nhưng chú thích bảo lưu độ cô đọng và những cách hiểu khác của tiếng Hy Lạp.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Đại từ “Ngài” duy trì cách quy chiếu tôn kính đến Đức Chúa Trời. Hình ảnh mạnh “trần trụi và phơi bày” được giữ nguyên; cấu trúc cuối câu được làm rõ vừa đủ, còn các khả năng khác của nguyên văn được bảo lưu trong chú thích.
