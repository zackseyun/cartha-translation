  to: Không một tạo vật nào bị che khuất trước mặt Ngài; nhưng tất cả đều trần trụi và phơi bày trước mắt Ngài[b], là Đấng mà chúng ta phải khai trình trước Ngài[a].
  rationale: Chỉnh sửa tối thiểu để vế cuối có cấu trúc tiếng Việt tự nhiên và xác định rõ Đức Chúa Trời là Đấng trước mặt Ngài con người phải khai trình. Chú thích về động từ hiếm được sửa nhẹ cho trọn nghĩa. Các cách hiểu thay thế của πρὸς ὃν ἡμῖν ὁ λόγος vẫn được bảo lưu, không áp đặt một cách giải thích giáo phái.
