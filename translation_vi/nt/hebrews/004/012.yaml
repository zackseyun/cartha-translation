revisions:
- from: Vì lời Đức Chúa Trời là lời sống động và đầy năng lực, sắc bén hơn mọi thanh gươm hai lưỡi, xuyên thấu đến mức phân chia hồn và linh, khớp xương và tủy, đồng thời phán xét những suy nghĩ và ý định trong lòng.[a]
  to: Vì lời Đức Chúa Trời sống động và hữu hiệu, sắc bén hơn mọi thanh gươm hai lưỡi, xuyên thấu đến chỗ phân chia hồn và linh, khớp xương và tủy[a], và có khả năng phán xét những suy nghĩ cùng ý định trong lòng.
  rationale: Sửa tối thiểu để câu tiếng Việt gọn và tự nhiên hơn, đồng thời phản ánh sát hơn các vị ngữ Ζῶν, ἐνεργής và κριτικός. Bản sửa vẫn giữ “lời Đức Chúa Trời” theo nghĩa rộng, bảo lưu hình ảnh “hồn và linh” mà không áp đặt cách hiểu giáo lý, và không quyết đoán rằng câu đang xác lập các thành phần con người có thể tách rời theo nghĩa kỹ thuật.
