  terminology: Giữ “lời Đức Chúa Trời” để không thu hẹp referent của ὁ λόγος τοῦ θεοῦ. Giữ “hồn và linh” như một cặp thuật ngữ truyền thống, không diễn giải giáo lý. Dùng “hữu hiệu” cho ἐνεργής và “có khả năng phán xét” cho κριτικός để bảo toàn ý năng lực xét định.
