id: HEB.4.12
reference: Hebrews 4:12
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ζῶν γὰρ ὁ λόγος τοῦ θεοῦ καὶ ἐνεργὴς καὶ τομώτερος ὑπὲρ πᾶσαν μάχαιραν δίστομον καὶ διϊκνούμενος ἄχρι μερισμοῦ ψυχῆς ⸀καὶ πνεύματος, ἁρμῶν τε καὶ μυελῶν, καὶ κριτικὸς ἐνθυμήσεων καὶ ἐννοιῶν καρδίας·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/012.yaml
  text: For the word of God is living and active[a], and sharper than any double-edged sword, piercing to the division of soul and spirit, of joints and marrow[c][b], and able to judge the thoughts and intentions of the heart.
translation:
  language: vi
  text: Vì lời Đức Chúa Trời sống động và hữu hiệu, sắc bén hơn mọi thanh gươm hai lưỡi, xuyên thấu đến chỗ phân chia hồn và linh, khớp xương và tủy[a], và có khả năng phán xét những suy nghĩ cùng ý định trong lòng.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cụm “hồn và linh, khớp xương và tủy” nhấn mạnh rằng lời Đức Chúa Trời xuyên thấu đến tận nơi sâu kín; câu này không nhất thiết xác định một học thuyết cụ thể về các thành phần cấu tạo con người.
    reason: alternative_reading
lexical_decisions:
- source_word: Ζῶν
  choice: sống động
  rationale: Diễn đạt tự nhiên trạng thái sống và sức sống không ngừng của lời Đức Chúa Trời.
- source_word: γὰρ
  choice: Vì
  rationale: Giữ chức năng giải thích, nêu cơ sở cho lời khuyên ở văn mạch trước.
- source_word: ὁ λόγος τοῦ θεοῦ
  choice: lời Đức Chúa Trời
  rationale: Giữ phạm vi quy chiếu rộng của cụm Hy Lạp, không thu hẹp thành riêng Kinh Thánh, lời rao giảng hay Ngôi Lời.
- source_word: ἐνεργὴς
  choice: đầy năng lực
  rationale: Nêu rõ lời ấy đang hoạt động và có hiệu lực; tự nhiên hơn cách dịch máy móc là “tích cực”.
- source_word: τομώτερος ὑπὲρ πᾶσαν μάχαιραν δίστομον
  choice: sắc bén hơn mọi thanh gươm hai lưỡi
  rationale: Bảo toàn phép so sánh và hình ảnh của nguyên văn bằng lối nói tiếng Việt rõ ràng.
- source_word: διϊκνούμενος
  choice: xuyên thấu
  rationale: Diễn tả việc đi xuyên vào tận sâu, đồng thời tiếp nối hình ảnh thanh gươm.
- source_word: ἄχρι μερισμοῦ
  choice: đến mức phân chia
  rationale: Giữ ý chỉ mức độ hoặc giới hạn đạt tới của ἄχρι, mà không khẳng định các cặp từ là những bộ phận có thể tách rời theo nghĩa kỹ thuật.
- source_word: ψυχῆς καὶ πνεύματος
  choice: hồn và linh
  rationale: Dịch trực tiếp hai thuật ngữ truyền thống, không áp đặt một học thuyết cụ thể về cấu tạo con người.
- source_word: ἁρμῶν τε καὶ μυελῶν
  choice: khớp xương và tủy
  rationale: Giữ cặp hình ảnh thân thể biểu thị khả năng xuyên đến nơi sâu kín; “tủy” là cách nói tự nhiên trong tiếng Việt.
- source_word: κριτικὸς
  choice: phán xét
  rationale: Thể hiện năng lực đánh giá, xét định của tính từ Hy Lạp trong cấu trúc vị ngữ.
- source_word: ἐνθυμήσεων
  choice: những suy nghĩ
  rationale: Cách diễn đạt phổ thông và đủ rộng cho các suy tư, cân nhắc bên trong.
- source_word: ἐννοιῶν
  choice: ý định
  rationale: Phân biệt với “suy nghĩ” và diễn đạt những dụng ý, chủ đích ở bên trong.
- source_word: καρδίας
  choice: trong lòng
  rationale: Trong ngữ cảnh này, “lòng” là trung tâm đời sống nội tâm; thêm “trong” tạo câu tiếng Việt tự nhiên mà không thay đổi ý nghĩa.
theological_decisions:
- issue: Đối tượng được chỉ bởi “lời Đức Chúa Trời”
  choice: Giữ cách gọi rộng là “lời Đức Chúa Trời”.
  alternative: Thu hẹp thành Kinh Thánh, lời hứa/phán quyết được nói ra, hoặc Ngôi Lời là Đức Con.
  rationale: Ngữ cảnh nhấn mạnh việc Đức Chúa Trời phán và hiệu lực của lời Ngài, nhưng nguyên văn không buộc phải chọn duy nhất một đối tượng quy chiếu.
- issue: Hàm ý nhân học của “hồn và linh”
  choice: Giữ nguyên cặp “hồn và linh” mà không giải thích thành các thành phần kỹ thuật riêng biệt.
  alternative: Hiểu là bằng chứng xác định con người gồm hai hoặc ba phần có thể phân tách.
  rationale: Câu dùng các cặp từ trong hình ảnh về khả năng xuyên thấu và xét định tận nơi sâu kín; bản dịch không nên giải quyết một vấn đề giáo lý mà câu không nói rõ.
- issue: Quan hệ giữa các cặp “hồn và linh, khớp xương và tủy”
  choice: Hiểu “đến mức phân chia” là diễn tả tầm xuyên thấu cực sâu, đồng thời bảo lưu cấu trúc nguyên văn.
  alternative: Diễn giải rõ thành việc phân chia hồn khỏi linh và khớp khỏi tủy.
  rationale: Cấu trúc sở hữu cách Hy Lạp cho phép cách hiểu về sự phân chia liên quan đến từng cặp, nhưng không nêu minh nhiên giới từ “khỏi”; tránh làm bản dịch quyết đoán hơn nguồn.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Dùng “Đức Chúa Trời” theo cách gọi Tin Lành quen thuộc của tiếng Việt; giữ nhịp câu giàu hình ảnh của nguyên văn. Dấu chú thích [a] đặt sau toàn câu vì chú thích giải thích cụm hình ảnh trung tâm mà không làm gián đoạn nhịp đọc.
