  source_fidelity: 'Bản nháp truyền đạt đúng mạch chính của câu: lời Đức Chúa Trời sống động, hữu hiệu, sắc bén, xuyên thấu và xét định nội tâm. Tuy nhiên, “là lời sống động” thêm một từ “lời” không có trong cấu trúc Hy Lạp và khiến câu lặp; “đầy năng lực” nghiêng về quyền năng hơn là tính hoạt động/hữu hiệu của ἐνεργής. Cụm “đến mức phân chia” có thể giữ độ mở của nguyên văn, nhưng cần diễn đạt rõ quan hệ với hai cặp sở hữu cách mà không biến chúng thành một khẳng định nhân học kỹ thuật.'
