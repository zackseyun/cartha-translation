  terminology: “Thầy tế lễ thượng phẩm,” “cảm thông,” “yếu đuối,” và “chịu thử thách” phù hợp văn phong Kinh Thánh tiếng Việt và phạm vi nghĩa của các từ Hy Lạp. “Không phạm tội” diễn đạt tự nhiên χωρὶς ἁμαρτίας trong ngữ cảnh, không áp đặt diễn giải thêm.
