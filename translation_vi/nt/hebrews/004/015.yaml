id: HEB.4.15
reference: Hebrews 4:15
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οὐ γὰρ ἔχομεν ἀρχιερέα μὴ δυνάμενον συμπαθῆσαι ταῖς ἀσθενείαις ἡμῶν, ⸀πεπειρασμένον δὲ κατὰ πάντα καθ’ ὁμοιότητα χωρὶς ἁμαρτίας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/015.yaml
  text: For we do not have a high priest unable to sympathize with our weaknesses, but one who has been tested in every way according to likeness, yet without sin.
translation:
  language: vi
  text: Vì chúng ta không có một vị thầy tế lễ thượng phẩm nào không thể cảm thông với những yếu đuối của chúng ta, nhưng có một Đấng đã chịu thử thách[a] về mọi phương diện giống như chúng ta[b], song không phạm tội.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đã chịu cám dỗ.”'
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn: “theo sự tương đồng.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀρχιερέα
  choice: thầy tế lễ thượng phẩm
  rationale: Cách gọi rõ ràng, trang trọng cho chức vụ tư tế tối cao và phù hợp với vai trò trung tâm của tước hiệu này trong thư Hê-bơ-rơ.
- source_word: μὴ δυνάμενον συμπαθῆσαι
  choice: không thể cảm thông
  rationale: 'Giữ cấu trúc phủ định mang tính nhấn mạnh của câu Hy Lạp: chúng ta không có một vị thượng phẩm ''không thể cảm thông''. ''Cảm thông'' diễn tả sự cùng cảm nhận những yếu đuối, không chỉ là thương hại từ bên ngoài.'
- source_word: ταῖς ἀσθενείαις ἡμῶν
  choice: với những yếu đuối của chúng ta
  rationale: ἀσθένεια ở đây chỉ rộng đến sự yếu đuối và mong manh của con người, chứ không chỉ bệnh tật thể chất.
- source_word: πεπειρασμένον
  choice: đã chịu thử thách
  rationale: πειράζω có thể mang nghĩa thử thách hoặc cám dỗ. 'Chịu thử thách' tự nhiên trong tiếng Việt và không loại bỏ thực tại Đấng Christ phải đối diện sự cám dỗ; nghĩa kia được giữ trong chú thích.
- source_word: κατὰ πάντα
  choice: về mọi phương diện
  rationale: Diễn đạt tự nhiên tính toàn diện của trải nghiệm được thử thách.
- source_word: καθ’ ὁμοιότητα
  choice: giống như chúng ta
  rationale: Cụm Hy Lạp có nghĩa đen là 'theo sự tương đồng'. Trong ngữ cảnh, cách diễn đạt tự nhiên này làm rõ đối tượng so sánh ngầm là con người/chúng ta nhưng không đồng nhất hóa mọi chi tiết của trải nghiệm.
- source_word: χωρὶς ἁμαρτίας
  choice: song không phạm tội
  rationale: 'Truyền đạt rõ sự tương phản quyết định: dù thật sự chịu thử thách như chúng ta, Đấng Christ không phạm tội. Nghĩa sát chữ hơn được ghi trong chú thích.'
theological_decisions:
- issue: Nghĩa của πεπειρασμένον trong mối liên hệ với sự vô tội của Đấng Christ
  choice: đã chịu thử thách
  alternative: đã chịu cám dỗ
  rationale: Động từ Hy Lạp bao hàm cả thử thách lẫn cám dỗ. Bản chính chọn cách diễn đạt rộng và tự nhiên, còn chú thích giữ nghĩa 'cám dỗ', qua đó không làm giảm thực tại của thử thách cũng không gợi rằng Ngài có khuynh hướng tội lỗi.
- issue: Mức độ minh thị của phép so sánh trong καθ’ ὁμοιότητα
  choice: giống như chúng ta
  alternative: theo sự tương đồng
  rationale: Tiếng Hy Lạp nêu sự tương đồng nhưng để đối tượng so sánh ở dạng ngầm. Trong ngữ cảnh, 'giống như chúng ta' là cách tiếng Việt tự nhiên để diễn đạt ý này; chú thích bảo tồn hình thức sát chữ và sự cô đọng của nguyên văn.
- issue: Cách thể hiện χωρὶς ἁμαρτίας
  choice: song không phạm tội
  alternative: nhưng không có tội; ngoại trừ tội lỗi
  rationale: Cách chọn nhấn mạnh kết quả đạo đức giữa những thử thách mà không giải quyết quá mức câu hỏi cụm này giới hạn phạm vi của sự tương đồng theo cách nào.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Giữ lối phủ định nhấn mạnh của nguyên văn; dùng 'thầy tế lễ thượng phẩm' theo văn phong Kinh Thánh quen thuộc. Các dấu chú thích [a], [b] đều được đặt ngay sau cụm từ liên quan trong câu chính.
