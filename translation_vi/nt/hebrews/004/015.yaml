  to: Vì chúng ta không có một vị thầy tế lễ thượng phẩm nào không thể cảm thông với những yếu đuối của chúng ta, nhưng có một Đấng đã chịu thử thách[a] về mọi phương diện giống như chúng ta[b], song không phạm tội.
