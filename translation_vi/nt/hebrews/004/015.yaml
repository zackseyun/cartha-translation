  source_fidelity: 'Bản dịch phản ánh đúng cấu trúc đối nghịch οὐ γὰρ ἔχομεν ... ἀλλά và các ý chính: vị thượng tế cảm thông với sự yếu đuối của chúng ta; đã chịu thử thách/cám dỗ cách toàn diện; và không có tội. “Giống như chúng ta” là cách giải thích ngữ cảnh có cơ sở cho καθ’ ὁμοιότητα, đồng thời chú thích vẫn bảo lưu cách nói sát chữ.'
