reference: Hebrews 4:4
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εἴρηκεν γάρ που περὶ τῆς ἑβδόμης οὕτως· Καὶ κατέπαυσεν ὁ θεὸς ἐν τῇ ἡμέρᾳ τῇ ἑβδόμῃ ἀπὸ πάντων τῶν ἔργων αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/004.yaml
  text: 'For he has spoken somewhere about the seventh day in this way: “And God rested on the seventh day from all his works,”[a][b]'
translation:
  language: vi
  text: 'Vì có chỗ đã nói về ngày thứ bảy như sau: “Và Đức Chúa Trời đã nghỉ vào ngày thứ bảy, khỏi mọi công việc của Ngài.”[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “ở đâu đó” hoặc “ở một chỗ.” Từ Hy Lạp có nghĩa đen là “đâu đó,” dùng để dẫn một đoạn Kinh Thánh mà không nêu địa điểm cụ thể, chứ không hàm ý tác giả không chắc về thẩm quyền của đoạn ấy.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “ngừng làm.” Động từ này có thể nhấn mạnh việc chấm dứt công việc; ở đây dùng “nghỉ” để giữ mối liên hệ với Sáng Thế Ký 2:2 và lập luận về sự an nghỉ của Đức Chúa Trời trong Hê-bơ-rơ 3–4.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴρηκεν
  choice: đã phán
  rationale: Thì hoàn thành diễn tả lời đã được phán và vẫn có giá trị trong lập luận hiện tại; “phán” phù hợp với lời của Đức Chúa Trời trong Kinh Thánh.
- source_word: γάρ
  choice: Vì
  rationale: Đánh dấu lời giải thích và bằng chứng hỗ trợ cho lập luận trước đó.
- source_word: που
  choice: ở một chỗ kia
  rationale: Diễn đạt tự nhiên cách dẫn một địa điểm Kinh Thánh không được nêu cụ thể, không hàm ý nghi ngờ thẩm quyền của lời trích.
- source_word: περὶ τῆς ἑβδόμης
  choice: về ngày thứ bảy
  rationale: Danh từ “ngày” được hiểu ngầm trong tiếng Hy Lạp và cần nói rõ trong tiếng Việt.
- source_word: οὕτως
  choice: như sau
  rationale: Cách dẫn lời trích dẫn tự nhiên, rõ ràng trong tiếng Việt hiện đại.
- source_word: Καὶ
  choice: Và
  rationale: Giữ liên từ thuộc về nguyên văn câu trích từ Sáng Thế Ký.
- source_word: κατέπαυσεν
  choice: nghỉ
  rationale: Giữ mối liên hệ từ vựng với sự nghỉ ngơi của Đức Chúa Trời trong Sáng Thế Ký 2 và chủ đề “sự an nghỉ” của Hê-bơ-rơ 3–4, đồng thời động từ cũng có thể mang sắc thái chấm dứt công việc.
- source_word: ὁ θεὸς
  choice: Đức Chúa Trời
  rationale: Danh xưng trang trọng, quen thuộc và rõ nghĩa trong văn phong Kinh Thánh tiếng Việt.
- source_word: ἐν τῇ ἡμέρᾳ τῇ ἑβδόμῃ
  choice: vào ngày thứ bảy
  rationale: “Vào” là giới từ tự nhiên trong tiếng Việt khi nói về một ngày xác định.
- source_word: ἀπὸ πάντων τῶν ἔργων αὐτοῦ
  choice: mọi công việc của Ngài
  rationale: Sau động từ “nghỉ,” tiếng Việt tự nhiên có thể nối trực tiếp với điều thôi làm; “mọi công việc” bảo toàn ý nghĩa tổng thể của πάντων và số nhiều ἔργων.
theological_decisions:
- issue: Cách diễn đạt việc Đức Chúa Trời ngừng công việc trong mối liên hệ với thần học về sự an nghỉ của Hê-bơ-rơ
  choice: nghỉ
  alternative: ngừng làm
  rationale: “Nghỉ” bảo toàn mối liên hệ với Sáng Thế Ký 2:2 và chủ đề xuyên suốt Hê-bơ-rơ 3–4 mà không nhất thiết hàm ý Đức Chúa Trời mệt mỏi; “ngừng làm” vẫn là một sắc thái từ vựng có thể có.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Cấu trúc dẫn lời được làm tự nhiên bằng “ở một chỗ kia” và “như sau”; thuật ngữ “nghỉ” được giữ để duy trì mạch chủ đề của phân đoạn.
