review_pass:
  verdict: revise
  source_fidelity: 'Cần sửa nhẹ động từ chính: εἰσελεύσονται có nghĩa là “sẽ vào/đi vào”, không phải “được vào”. Cách “được vào” có thể gợi ý thêm sắc thái bị động về sự cho phép, không có trong động từ Hy Lạp. Công thức εἰ + thì tương lai vẫn cần được chuyển đạt như lời phủ định thề mạnh: “chắc chắn sẽ không vào”.'
  naturalness: “Họ” tự nhiên hơn “chúng” khi chỉ nhóm người trong lời trích dẫn. “Ở một chỗ khác, Ngài lại phán” là cách diễn đạt tự nhiên cho ἐν τούτῳ πάλιν trong văn mạch các lời trích Kinh Thánh.
  terminology: Giữ “sự an nghỉ của Ta” để nhất quán với κατάπαυσις, thuật ngữ trọng tâm trong Hê-bơ-rơ 3–4. Giữ đại từ viết hoa “Ta” trong lời Đức Chúa Trời phán theo quy ước trang trọng tiếng Việt.
  issues:
  - severity: medium
    issue: “sẽ không được vào” diễn đạt εἰσελεύσονται như một bị động/được cho phép.
    rationale: Động từ εἰσελεύσονται là chủ động, nghĩa là “sẽ vào”. Bản dịch nên giữ hành động chủ động, đồng thời diễn đạt lực phủ định dứt khoát của công thức thề.
  - severity: low
    issue: “chúng” có sắc thái vật hóa hoặc xa cách không cần thiết đối với nhóm người được nói đến.
    rationale: “Họ” là đại từ chuẩn, tự nhiên hơn trong tiếng Việt hiện đại và không làm thay đổi sắc thái lời trích.
