  text: 'And in this place again: ‘They shall certainly not enter my rest.’[a]'
translation:
  language: vi
  text: 'Và ở một chỗ khác, Ngài lại phán: “Họ chắc chắn sẽ không vào sự an nghỉ của Ta.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hy Lạp: “Nếu họ sẽ vào sự an nghỉ của Ta”, một công thức thề có nghĩa là: “Họ chắc chắn sẽ không vào sự an nghỉ của Ta.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: ở một chỗ khác
  rationale: Trong mạch lập luận, cụm này chỉ một chỗ trong Kinh Thánh được dẫn lại; tiếng Việt tự nhiên dùng “ở một chỗ khác” khi giới thiệu lời trích dẫn bổ sung.
- source_word: πάλιν
  choice: lại
  rationale: Giữ ý tác giả tiếp tục đưa ra một lời chứng Kinh Thánh nữa, đồng thời diễn đạt gọn và tự nhiên.
- source_word: Εἰ εἰσελεύσονται
  choice: Chắc chắn chúng sẽ không được vào
  rationale: Đây là công thức thề mang sắc thái Hê-bơ-rơ, trong đó εἰ với động từ tương lai biểu thị lời phủ định mạnh, chứ không phải một điều kiện còn bỏ ngỏ.
- source_word: κατάπαυσίν
  choice: sự an nghỉ
  rationale: Giữ thuật ngữ then chốt xuyên suốt Hê-bơ-rơ 3–4 và diễn đạt trạng thái nghỉ thuộc về Đức Chúa Trời bằng lối nói trang trọng, quen thuộc.
- source_word: μου
  choice: của Ta
  rationale: Giữ trực tiếp ngôi sở hữu trong lời Đức Chúa Trời phán; viết hoa “Ta” theo quy ước tiếng Việt nhằm làm rõ người nói mà không thêm nội dung.
theological_decisions:
- issue: Cách dịch cấu trúc thề εἰ εἰσελεύσονται
  choice: Chắc chắn chúng sẽ không được vào sự an nghỉ của Ta
  alternative: Nếu chúng sẽ vào sự an nghỉ của Ta
  rationale: Dạng Hy Lạp bề mặt là một mệnh đề điều kiện, nhưng trong lời trích Thi Thiên 95:11, nó phản ánh công thức thề Hê-bơ-rơ có chức năng phủ định dứt khoát. Bản dịch chính truyền đạt lực ngôn trung ấy, còn chú thích bảo tồn hình thức nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngài lại phán” để làm rõ lời trích dẫn thuộc lời Đức Chúa Trời theo ngữ cảnh; “chúng” giữ sắc thái xa cách của đối tượng bị phán xét. Dấu chú thích [a] được đặt ngay sau câu trích dẫn.
