  to: 'Và ở một chỗ khác, Ngài lại phán: “Họ chắc chắn sẽ không vào sự an nghỉ của Ta.”[a]'
  rationale: Bản sửa giữ cách diễn đạt công thức thề theo nghĩa ngữ dụng, nhưng thay “được vào” bằng “vào” để phản ánh đúng thể chủ động của εἰσελεύσονται. Đồng thời thay “chúng” bằng “họ” cho tiếng Việt hiện đại tự nhiên hơn. Chú thích vẫn bảo tồn hình thức điều kiện của nguyên văn và giải thích giá trị thành ngữ của nó.
