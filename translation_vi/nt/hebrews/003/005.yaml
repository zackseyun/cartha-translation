id: HEB.3.5
reference: Hebrews 3:5
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ Μωϋσῆς μὲν πιστὸς ἐν ὅλῳ τῷ οἴκῳ αὐτοῦ ὡς θεράπων εἰς μαρτύριον τῶν λαληθησομένων,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/005.yaml
  text: And Moses indeed was faithful in all his house as a servant[a], for a testimony of the things that would be spoken later[b],
translation:
  language: vi
  text: Còn Môi-se thì trung tín trong cả nhà của Ngài, với tư cách là người phục vụ[a], để làm chứng về những điều sẽ được nói ra[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “như một người hầu cận.” Từ Hy Lạp chỉ một người phục vụ với sắc thái đáng trọng.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “về những điều sẽ được nói đến.” Cụm từ Hy Lạp hướng tới những điều sẽ được nói về sau nhưng không nêu rõ nội dung hoặc người nói ngay tại đây.'
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ
  choice: Còn
  rationale: Trong mạch văn, καὶ kết hợp với μὲν mở đầu vế thứ nhất của sự tương phản sẽ được hoàn tất bằng δέ ở câu 6; “Còn” diễn đạt tự nhiên quan hệ này trong tiếng Việt.
- source_word: Μωϋσῆς
  choice: Môi-se
  rationale: Dùng dạng tên riêng Kinh Thánh quen thuộc trong tiếng Việt hiện đại.
- source_word: μὲν
  choice: thì
  rationale: “Thì” đánh dấu vế đầu của cấu trúc tương phản μὲν…δέ mà không làm câu nặng nề.
- source_word: πιστὸς
  choice: trung tín
  rationale: Diễn đạt sự đáng tin cậy và tận tâm của Môi-se trong việc phụng sự, đồng thời phù hợp với văn phong Kinh Thánh trang trọng.
- source_word: ἐν ὅλῳ τῷ οἴκῳ αὐτοῦ
  choice: trong cả nhà của Ngài
  rationale: Giữ nguyên hình ảnh “nhà” từ Dân Số 12:7 và mạch lập luận tiếp theo của Hê-bơ-rơ; “Ngài” hiểu là Đức Chúa Trời nhưng không thay danh từ bằng lời giải thích.
- source_word: ὡς θεράπων
  choice: với tư cách một người phục vụ
  rationale: θεράπων chỉ vai trò phục vụ có phẩm giá, khác với từ thường chỉ nô lệ; cách dịch này tự nhiên và giữ được sự tương phản với địa vị Người Con ở câu sau.
- source_word: εἰς μαρτύριον
  choice: để làm chứng
  rationale: Diễn đạt tự nhiên sắc thái mục đích hoặc kết quả của εἰς mà không biến cụm danh từ Hy Lạp thành một câu tiếng Việt cứng.
- source_word: τῶν λαληθησομένων
  choice: về những điều sẽ được phán truyền
  rationale: Giữ thể tương lai và bị động của phân từ Hy Lạp. “Phán truyền” cho thấy lời được công bố có nguồn gốc thần thượng nhưng không xác định quá mức nội dung hay thời điểm.
theological_decisions:
- issue: Ý nghĩa của “nhà của Ngài”
  choice: Giữ hình ảnh “nhà” và đại từ chỉ Đức Chúa Trời.
  alternative: “toàn thể gia đình của Đức Chúa Trời” hoặc “cả nhà ấy”
  rationale: “Nhà” vừa vọng lại Dân Số 12:7 vừa chuẩn bị cho cách dùng ở các câu tiếp theo. Không đổi thành “gia đình” trong chính văn để tránh thu hẹp hay giải quyết trước ẩn dụ.
- issue: Sắc thái của θεράπων
  choice: “một người phục vụ”
  alternative: “đầy tớ” hoặc “người hầu cận”
  rationale: Từ Hy Lạp mô tả sự phục vụ đáng trọng và không nhất thiết mang sắc thái lệ thuộc của “nô lệ”; lựa chọn này vẫn giữ Môi-se ở vai trò người phục vụ, tương phản với Người Con ở câu 6.
- issue: Phạm vi của “những điều sẽ được phán truyền”
  choice: Giữ cách nói rộng, hướng về lời mặc khải sẽ được phán.
  alternative: Giải thích trực tiếp là lời về Đấng Christ hoặc lời Đức Chúa Trời phán về sau
  rationale: Bản văn không nêu rõ nội dung hay chủ thể ngay trong cụm từ; bản dịch bảo tồn độ mở và hướng tương lai của nguyên văn.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Cấu trúc “Còn… thì” chuẩn bị tự nhiên cho sự tương phản với câu 6. Viết hoa “Ngài” để làm rõ đại từ αὐτοῦ quy chiếu về Đức Chúa Trời trong ngữ cảnh, nhưng vẫn giữ nguyên ẩn dụ “nhà”.
