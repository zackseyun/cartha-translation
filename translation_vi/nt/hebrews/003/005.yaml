  - severity: low
    issue: “sẽ được phán truyền” diễn giải động từ λαλέω quá cụ thể.
    rationale: λαληθησομένων là “những điều sẽ được nói” ở thể bị động; nguyên văn không nêu chủ thể nói. “Phán truyền” gợi một hành vi công bố có thẩm quyền và do đó thu hẹp nhẹ độ mở của câu.
