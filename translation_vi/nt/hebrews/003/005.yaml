  rationale: Bản sửa loại bỏ sắc thái thời đã hoàn tất không có trong nguyên văn và dùng “sẽ được nói ra” để phản ánh sát thể tương lai bị động mà vẫn giữ tính không xác định của chủ thể và nội dung. Các lựa chọn còn lại được giữ vì vừa trung thành với nguyên văn vừa tự nhiên trong tiếng Việt hiện đại.
  reviewer_model: gpt-5.6-terra
