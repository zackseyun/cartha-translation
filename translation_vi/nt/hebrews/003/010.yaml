id: HEB.3.10
reference: Hebrews 3:10
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: τεσσεράκοντα ἔτη· διὸ προσώχθισα τῇ γενεᾷ ⸀ταύτῃ καὶ εἶπον· Ἀεὶ πλανῶνται τῇ καρδίᾳ· αὐτοὶ δὲ οὐκ ἔγνωσαν τὰς ὁδούς μου·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/010.yaml
  text: For forty years[a], therefore, I was provoked with this generation, and said, ‘They always go astray in their hearts[b], but they have not known my ways.’
translation:
  language: vi
  text: 'Suốt bốn mươi năm, vì thế, ta phẫn nộ[a] với thế hệ này và phán: “Lòng họ luôn lầm lạc[b], còn họ không biết các đường lối của ta.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “ta nổi giận với thế hệ này”; động từ Hy Lạp có thể diễn tả sự bất bình rất mạnh, thậm chí sự ghê tởm.'
    reason: lexical_alternative
  - marker: b
    text: Tiếng Hy Lạp dùng “lòng” ở số ít, có lẽ xem cả thế hệ như một tập thể.
    reason: lexical_alternative
lexical_decisions:
- source_word: τεσσεράκοντα ἔτη
  choice: Suốt bốn mươi năm
  rationale: Diễn đạt tự nhiên đối cách chỉ khoảng thời gian, đồng thời giữ mối liên hệ của cụm từ này với ngữ cảnh lời trích dẫn Thi Thiên.
- source_word: διὸ
  choice: vì thế
  rationale: Giữ ý suy luận hoặc kết quả của liên từ mà vẫn tự nhiên trong tiếng Việt hiện đại.
- source_word: προσώχθισα
  choice: ta phẫn nộ
  rationale: Diễn tả sự bất bình mạnh mẽ của Đức Chúa Trời mà không thu hẹp thành cơn giận đơn thuần hay tăng cường thành sự ghê tởm.
- source_word: τῇ γενεᾷ ταύτῃ
  choice: với thế hệ này
  rationale: Giữ rõ đối tượng của sự phẫn nộ và chuyển cấu trúc cách dữ liệu sang tiếng Việt tự nhiên.
- source_word: καὶ εἶπον
  choice: và phán
  rationale: Trong lời Đức Chúa Trời, “phán” là cách diễn đạt trang trọng, dễ hiểu; chủ ngữ ngôi thứ nhất đã rõ từ “ta” ở mệnh đề trước.
- source_word: Ἀεὶ πλανῶνται τῇ καρδίᾳ
  choice: Lòng họ luôn lầm lạc
  rationale: “Lầm lạc” chuyển tải sự đi chệch đường về phương diện đạo đức và thuộc linh; “lòng họ” giữ danh từ số ít của tiếng Hy Lạp nhưng vẫn tự nhiên trong tiếng Việt.
- source_word: αὐτοὶ δὲ οὐκ ἔγνωσαν
  choice: còn họ không biết
  rationale: “Còn” thể hiện sự tương phản của δέ; “không biết” giữ được cả chiều kích nhận thức lẫn quan hệ mà không giải thích quá mức.
- source_word: τὰς ὁδούς μου
  choice: các đường lối của ta
  rationale: Giữ hình ảnh quen thuộc về cách hành động của Đức Chúa Trời và con đường Ngài quy định.
theological_decisions:
- issue: Mức độ bất bình của Đức Chúa Trời trong προσώχθισα
  choice: ta phẫn nộ
  alternative: ta nổi giận; ta ghê tởm
  rationale: “Phẫn nộ” giữ sức nặng của sự bất bình giao ước trước tình trạng vô tín dai dẳng nhưng không áp đặt một cách giải thích riêng về cảm xúc của Đức Chúa Trời.
- issue: Danh từ số ít trong τῇ καρδίᾳ
  choice: Lòng họ
  alternative: Trong lòng mỗi người họ; lòng của thế hệ ấy
  rationale: Cách dịch giữ “lòng” ở số ít và cho phép hiểu cả thế hệ như một tập thể, nhưng không làm câu tiếng Việt trở nên gượng ép.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “ta” phù hợp với lời Đức Chúa Trời trong câu trích dẫn. Dấu chú thích [a] được đặt ngay sau từ ngữ mà chú thích giải nghĩa; [b] nêu rõ sắc thái tập thể của danh từ số ít.
