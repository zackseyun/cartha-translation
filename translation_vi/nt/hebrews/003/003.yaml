source:
  edition: SBLGNT
  text: πλείονος γὰρ ⸂οὗτος δόξης⸃ παρὰ Μωϋσῆν ἠξίωται καθ’ ὅσον πλείονα τιμὴν ἔχει τοῦ οἴκου ὁ κατασκευάσας αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/003.yaml
  text: For this one has been counted worthy of more glory than Moses, just as the one who built the house has greater honor than the house.
translation:
  language: vi
  text: Thật vậy, Đấng này đã được kể là xứng đáng với vinh quang lớn hơn Môi-se, bởi lẽ người xây dựng ngôi nhà được tôn trọng hơn ngôi nhà.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὗτος
  choice: Đấng này
  rationale: Đại từ chỉ Chúa Giê-su trong mạch văn trước; “Đấng này” vừa tự nhiên vừa giữ sắc thái tôn kính, không thay đại từ bằng tên riêng.
- source_word: δόξης
  choice: vinh quang
  rationale: Tương ứng trực tiếp với δόξα và phù hợp ngữ cảnh nói về địa vị cao trọng.
- source_word: ἠξίωται
  choice: đã được kể là xứng đáng
  rationale: Giữ hình thái hoàn thành bị động và ý nghĩa được nhìn nhận/đánh giá là xứng đáng.
- source_word: καθ’ ὅσον
  choice: cũng như
  rationale: Diễn đạt quan hệ so sánh làm cơ sở cho mệnh đề trước một cách tự nhiên trong tiếng Việt.
- source_word: τιμὴν
  choice: danh dự
  rationale: Phân biệt τιμή với δόξα ở vế trước, đồng thời giữ ý về sự tôn trọng và giá trị cao hơn.
- source_word: τοῦ οἴκου
  choice: ngôi nhà
  rationale: Giữ hình ảnh “nhà” của nguyên văn; không thu hẹp thành gia đình hay cộng đồng.
- source_word: ὁ κατασκευάσας αὐτόν
  choice: người xây nhà
  rationale: κατασκευάζω có thể bao hàm dựng nên, chuẩn bị hoặc thiết lập; trong phép so sánh với οἶκος, “xây nhà” là cách nói rõ và tự nhiên.
theological_decisions:
- issue: Chủ thể οὗτος
  choice: Đấng này
  alternative: Chúa Giê-su
  rationale: Ngữ cảnh xác định chủ thể là Chúa Giê-su, nhưng giữ cách quy chiếu của nguyên văn tránh giải thích quá mức ngay trong câu.
- issue: Quan hệ giữa người xây nhà và ngôi nhà
  choice: Giữ phép so sánh mà không xác định thêm căn nhà là gì
  alternative: Diễn giải “nhà” là dân hoặc gia đình của Đức Chúa Trời
  rationale: Câu này chưa tự mình giải nghĩa đầy đủ biểu tượng; nên để mạch văn kế tiếp phát triển sự căng thẳng thần học.
- issue: Sắc thái bị động của ἠξίωται
  choice: đã được kể là xứng đáng
  alternative: xứng đáng
  rationale: Giữ bị động thần học/không nêu tác nhân của nguyên văn, không tự ý xác định ai là người ban hay công nhận vinh quang.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Môi-se” theo cách viết tên Kinh Thánh phổ biến; lặp “ngôi nhà” ở cuối để tránh đại từ mơ hồ.
