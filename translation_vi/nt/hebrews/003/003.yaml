revisions:
- from: Vì Đấng này đã được kể là xứng đáng với vinh quang lớn hơn Môi-se, cũng như người xây nhà có danh dự lớn hơn chính ngôi nhà.
  to: Thật vậy, Đấng này đã được kể là xứng đáng với vinh quang lớn hơn Môi-se, bởi lẽ người xây dựng ngôi nhà được tôn trọng hơn ngôi nhà.
  rationale: Chỉnh liên từ để phản ánh chức năng lập luận của καθ’ ὅσον theo nguyên văn, và điều chỉnh cách dịch τιμή cho tự nhiên, trong khi vẫn giữ nguyên chủ thể quy chiếu, thể bị động hoàn thành, phép so sánh, và sự mơ hồ có chủ ý của hình ảnh “ngôi nhà”.
