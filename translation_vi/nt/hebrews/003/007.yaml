source:
  edition: SBLGNT
  text: Διό, καθὼς λέγει τὸ πνεῦμα τὸ ἅγιον· Σήμερον ἐὰν τῆς φωνῆς αὐτοῦ ἀκούσητε,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/007.yaml
  text: 'Therefore, just as the Holy Spirit says: “Today, if you hear his voice,”'
translation:
  language: vi
  text: 'Vì vậy, như Đức Thánh Linh phán:

    “Ngày nay, nếu anh em nghe tiếng Ngài,”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διό
  choice: Vì vậy
  rationale: Liên từ suy luận nối câu trích dẫn với lập luận ngay trước đó; “Vì vậy” tự nhiên và giữ rõ quan hệ kết luận.
- source_word: καθὼς
  choice: như
  rationale: Dẫn vào công thức trích dẫn. Trong tiếng Việt, “như” trang trọng và tự nhiên; thêm “đúng như” có thể tạo mức nhấn mạnh không cần thiết.
- source_word: λέγει
  choice: phán
  rationale: Giữ thì hiện tại của công thức trích dẫn và phù hợp với lời nói được quy trực tiếp cho Đức Thánh Linh. “Phán” thể hiện ngữ vực Kinh Thánh trang trọng mà vẫn thông dụng.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: Đức Thánh Linh
  rationale: Cách gọi chuẩn, trang trọng và dễ hiểu trong tiếng Việt, không thêm sự nhấn mạnh ngoài nguyên văn.
- source_word: Σήμερον
  choice: Ngày nay
  rationale: Chuyển trực tiếp trạng từ chỉ thời gian mở đầu lời trích dẫn; “Ngày nay” giữ sắc thái long trọng của Thi Thiên và lời kêu gọi có hiệu lực trong hiện tại.
- source_word: ἐὰν
  choice: nếu
  rationale: Thể hiện trực tiếp tiểu từ điều kiện, không thêm sắc thái “quả thật” hay biến thành ý chỉ thời gian.
- source_word: τῆς φωνῆς αὐτοῦ
  choice: tiếng Ngài
  rationale: Với động từ “nghe”, “tiếng Ngài” là cách diễn đạt tự nhiên cho đối tượng sở hữu cách trong tiếng Việt và vẫn giữ tính cá vị của φωνή.
- source_word: ἀκούσητε
  choice: anh em nghe
  rationale: Động từ ở ngôi thứ hai số nhiều được diễn đạt rõ bằng “anh em”; “nghe” giữ nghĩa từ vựng cốt lõi mà không diễn giải thành “vâng nghe” hay “lắng nghe”.
theological_decisions:
- issue: Chủ thể phát ngôn của lời trích Thi Thiên
  choice: 'Quy lời nói trực tiếp cho Đức Thánh Linh: “Đức Thánh Linh phán”'
  alternative: Đức Thánh Linh phán qua Kinh Thánh hoặc qua tác giả Thi Thiên
  rationale: Nguyên văn Hy Lạp nói trực tiếp rằng Đức Thánh Linh phán. Bản dịch giữ nguyên sự quy thuộc này nhưng không mở rộng thành một trình bày đầy đủ về giáo lý linh cảm.
- issue: Tính chưa hoàn tất của mệnh đề điều kiện
  choice: Giữ dấu phẩy ở cuối câu trích dẫn
  alternative: Khép câu như một phát biểu hoàn chỉnh
  rationale: Mệnh đề bắt đầu bằng “nếu” tiếp tục sang Hê-bơ-rơ 3:8; dấu phẩy bảo toàn cấu trúc và sự căng thẳng tu từ của nguyên văn.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng và dễ hiểu. Dùng “anh em” để biểu thị ngôi thứ hai số nhiều; viết hoa “Ngài” theo quy ước kính xưng tiếng Việt. Giữ công thức trích dẫn ở hiện tại bằng “phán” và để câu mở sang câu kế tiếp.
