    text: Hoặc “sự không trung tín.” Từ Hy Lạp này có thể chỉ không tin hay không tin cậy, và cũng có thể hàm ý thái độ không trung tín thể hiện qua việc khước từ tin cậy.
    reason: Giữ lại phạm vi nghĩa của ἀπιστία, gồm ý không tin/không tin cậy và sắc thái không trung tín.
  revision_rationale: Sửa “sự vô tín” thành “sự không tin” để bản văn chính rõ ràng, tự nhiên và bám sát nghĩa chủ đạo của ἀπιστία trong câu. Điều chỉnh chú thích để bảo lưu sắc thái thay thế “không trung tín” bằng cách diễn đạt hiện đại. Bỏ “đã” nhằm tăng độ tự nhiên, không làm thay đổi thời quy chiếu của biến cố.
