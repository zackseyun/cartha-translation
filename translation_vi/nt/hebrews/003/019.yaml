  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ βλέπομεν ὅτι οὐκ ἠδυνήθησαν εἰσελθεῖν δι’ ἀπιστίαν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/019.yaml
  text: And we see that they were not able to enter because of unbelief[a].
translation:
  language: vi
  text: Và chúng ta thấy rằng họ không thể vào được vì sự không tin[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hoặc “sự không trung tín.” Từ Hy Lạp này có thể chỉ không tin hay không tin cậy, và cũng có thể hàm ý thái độ không trung tín thể hiện qua việc khước từ tin cậy.
    reason: Giữ lại phạm vi nghĩa của ἀπιστία, gồm ý không tin/không tin cậy và sắc thái không trung tín.
lexical_decisions:
- source_word: καὶ
  choice: Và
  rationale: Giữ liên từ thông thường và mạch nối với lập luận ngay trước đó, không thêm sắc thái suy luận mạnh hơn nguyên văn.
- source_word: βλέπομεν
  choice: chúng ta thấy
  rationale: Phản ánh trực tiếp động từ hiện tại, chủ động, ngôi thứ nhất số nhiều, đồng thời giữ giọng kết luận sống động của tác giả.
- source_word: ὅτι
  choice: rằng
  rationale: Đánh dấu rõ nội dung được nhận thấy và tương ứng tự nhiên với cấu trúc mệnh đề Hy Lạp.
- source_word: οὐκ ἠδυνήθησαν
  choice: họ đã không thể
  rationale: Giữ ý nghĩa về khả năng hay sự bất lực của δύναμαι; từ “đã” phù hợp với biến cố quá khứ được nhắc đến.
- source_word: εἰσελθεῖν
  choice: vào được
  rationale: Diễn đạt tự nhiên sự không thể đi vào nơi đã được hứa; “được” kết hợp với “không thể” tạo câu tiếng Việt trôi chảy mà không bổ sung đối tượng vốn không được nêu trong câu.
- source_word: δι’
  choice: vì
  rationale: Với đối cách, διά biểu thị nguyên nhân; “vì” là cách diễn đạt ngắn gọn, tự nhiên trong tiếng Việt hiện đại.
- source_word: ἀπιστίαν
  choice: sự vô tín
  rationale: Diễn đạt việc không tin và không đặt lòng tin nơi lời hứa của Đức Chúa Trời, đồng thời duy trì quan hệ từ vựng với khái niệm đức tin. Chú thích giữ lại sắc thái bất trung hay khước từ tin cậy.
theological_decisions:
- issue: Cách dịch ἀπιστία trong quan hệ với πίστις
  choice: sự vô tín
  alternative: sự bất tín; không tin
  rationale: Ngữ cảnh Hê-bơ-rơ 3 nhấn mạnh việc dân Y-sơ-ra-ên không tin và không tin cậy lời Đức Chúa Trời. “Sự vô tín” giữ được thuật ngữ thần học quen thuộc nhưng vẫn khá dễ hiểu; chú thích bảo tồn sắc thái bất trung và cố ý khước từ tin cậy, tránh thu hẹp từ này thành sự thiếu đồng ý trong trí óc.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cấu trúc bám sát nguyên văn nhưng dùng “vào được” để câu tiếng Việt tự nhiên; không tự ý thêm “đất hứa” hay “sự an nghỉ,” vì đối tượng không xuất hiện trong chính câu này.
