revisions:
- from: Và chúng ta thấy rằng họ đã không thể vào được vì sự vô tín[a].
  to: Và chúng ta thấy rằng họ không thể vào được vì sự không tin[a].
  rationale: Sửa “sự vô tín” thành “sự không tin” để bản văn chính rõ ràng, tự nhiên và bám sát nghĩa chủ đạo của ἀπιστία trong câu. Điều chỉnh chú thích để bảo lưu sắc thái thay thế “không trung tín” bằng cách diễn đạt hiện đại. Bỏ “đã” nhằm tăng độ tự nhiên, không làm thay đổi thời quy chiếu của biến cố.
