  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: τίνες γὰρ ἀκούσαντες παρεπίκραναν; ἀλλ’ οὐ πάντες οἱ ἐξελθόντες ἐξ Αἰγύπτου διὰ Μωϋσέως;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/016.yaml
  text: For who[a], when they heard, rebelled? Was it not all those who came out of Egypt through Moses?
translation:
  language: vi
  text: Vì những ai đã nghe mà nổi loạn[a]? Chẳng phải là tất cả những người đã ra khỏi Ai Cập nhờ Môi-se sao?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch sát hơn: “đã nghe mà chọc giận” hoặc “gây cay đắng.” Ở đây, động từ Hy Lạp nói đến việc dân Y-sơ-ra-ên chống nghịch và chọc giận Đức Chúa Trời trong hoang mạc.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τίνες
  choice: những ai
  rationale: Diễn đạt tự nhiên đại từ nghi vấn số nhiều, hỏi về chính những người đã nổi loạn.
- source_word: γὰρ
  choice: Vì
  rationale: Giữ quan hệ giải thích với lập luận ngay trước đó.
- source_word: ἀκούσαντες
  choice: đã nghe
  rationale: Phản ánh phân từ bất định chỉ hành động xảy ra trước hoặc gắn với hành động nổi loạn, không xác định thêm đối tượng được nghe.
- source_word: παρεπίκραναν
  choice: nổi loạn
  rationale: Trong ngữ cảnh thế hệ nơi hoang mạc, từ này chỉ hành động chống nghịch khiến Đức Chúa Trời bị chọc giận; cách dịch này truyền đạt rõ ý nghĩa theo ngữ cảnh, còn nghĩa sát chữ được nêu ở chú thích.
- source_word: ἀλλ’ οὐ πάντες
  choice: Chẳng phải là tất cả ... sao?
  rationale: Tái hiện câu hỏi tu từ hướng đến câu trả lời khẳng định; ἀλλά mang chức năng chuyển sang lời đáp hiển nhiên nên không cần dịch cứng là 'nhưng'.
- source_word: οἱ ἐξελθόντες ἐξ Αἰγύπτου
  choice: những người đã ra khỏi Ai Cập
  rationale: Diễn đạt tự nhiên phân từ được dùng như danh từ và giữ nguyên hình ảnh cuộc xuất hành.
- source_word: διὰ Μωϋσέως
  choice: nhờ Môi-se
  rationale: διά với sở hữu cách chỉ vai trò trung gian hoặc tác nhân; 'nhờ Môi-se' tự nhiên trong tiếng Việt và không diễn giải quá mức thành 'dưới sự lãnh đạo của Môi-se'.
theological_decisions:
- issue: Nghĩa của παραπικραίνω trong bối cảnh thế hệ nơi hoang mạc
  choice: nổi loạn
  alternative: chọc giận; làm cay đắng
  rationale: Bản văn ám chỉ sự chống nghịch của dân Y-sơ-ra-ên sau khi nghe. 'Nổi loạn' làm rõ sức nặng tường thuật và thần học trong tiếng Việt hiện đại mà không thêm đối tượng tân ngữ vốn không được nói rõ trong câu; chú thích bảo lưu nghĩa sát chữ.
- issue: Phạm vi của πάντες trong câu hỏi tu từ
  choice: tất cả những người đã ra khỏi Ai Cập nhờ Môi-se
  alternative: diễn giải có ngoại lệ như 'hầu hết' hoặc 'chẳng phải những người...'
  rationale: Giữ nguyên lối nói tuyệt đối của câu hỏi tu từ trong nguồn Hy Lạp, không tự ý giải quyết căng thẳng với các ngoại lệ được biết đến trong trình thuật.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Dùng dạng tên quen thuộc “Môi-se”; giữ hai câu hỏi tu từ và sự căng thẳng của từ “tất cả” trong nguyên bản.
