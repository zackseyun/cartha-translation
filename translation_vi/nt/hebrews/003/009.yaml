id: HEB.3.9
reference: Hebrews 3:9
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οὗ ⸀ἐπείρασαν οἱ πατέρες ὑμῶν ⸂ἐν δοκιμασίᾳ⸃ καὶ εἶδον τὰ ἔργα μου
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/009.yaml
  text: where your fathers tested me by trial and saw my works[b][a],
translation:
  language: vi
  text: nơi tổ phụ các con đã thử thách Ta bằng sự thử nghiệm[a] và đã thấy các công việc của Ta.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đã thử thách Ta bằng cách thử nghiệm” hoặc “đã đem Ta ra thử.” Cụm ἐν δοκιμασίᾳ khó xác định và có thể diễn tả cách thức hoặc phương tiện.'
    reason: lexical_alternative
  - marker: b
    text: 'Một số bản dịch hiểu mệnh đề kế tiếp theo nghĩa nhượng bộ: “thế mà đã thấy các công việc của Ta” hoặc “dù đã thấy các công việc của Ta.” Tiếng Hy Lạp chỉ viết đơn giản là “và đã thấy.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗ
  choice: nơi
  rationale: Đại từ trạng từ quan hệ chỉ về địa điểm trong hoang mạc ở câu trước; “nơi” giữ nghĩa không gian tự nhiên.
- source_word: ἐπείρασαν
  choice: đã thử thách Ta
  rationale: Động từ diễn tả việc đem Đức Chúa Trời ra thử theo nghĩa tiêu cực, khiêu khích. Tân ngữ “Ta” được hiểu từ ngữ cảnh của lời trích Thi Thiên 95.
- source_word: οἱ πατέρες ὑμῶν
  choice: tổ phụ các con
  rationale: “Tổ phụ” giữ sắc thái lịch sử giao ước của danh từ số nhiều, còn “các con” diễn đạt đại từ sở hữu số nhiều trong lời Đức Chúa Trời phán với dân.
- source_word: ἐν δοκιμασίᾳ
  choice: bằng sự thử nghiệm
  rationale: Cách dịch giữ nét nghĩa thử nghiệm/thử xem và hiểu ἐν theo phương tiện; vì kết cấu Hy Lạp khó và cũng có thể chỉ cách thức hoặc hoàn cảnh, chú thích bảo lưu phương án khác.
- source_word: καὶ εἶδον
  choice: và đã thấy
  rationale: Giữ nguyên quan hệ liên hợp đơn giản của καί, không tự ý chuyển thành quan hệ nhượng bộ “dù đã thấy”.
- source_word: τὰ ἔργα μου
  choice: các công việc của Ta
  rationale: Giữ hình thức và âm hưởng Kinh Thánh của ἔργα, chỉ những việc Đức Chúa Trời đã làm trong hoang mạc.
theological_decisions:
- issue: Tân ngữ của hành động thử thách
  choice: thử thách Ta
  alternative: thử thách
  rationale: SBLGNT không ghi tân ngữ trực tiếp trong mệnh đề này, nhưng ngữ cảnh lời trích và ngôi thứ nhất trong “các công việc của Ta” cho thấy Đức Chúa Trời là đối tượng được hiểu ngầm; thêm “Ta” giúp câu tiếng Việt tự nhiên mà không thêm nội dung giáo lý.
- issue: Quan hệ giữa việc thử thách và việc thấy các công việc
  choice: và đã thấy
  alternative: dù đã thấy / thế mà đã thấy
  rationale: Bản Hy Lạp chỉ dùng καί; bản chính giữ phép nối trung tính, còn khả năng hiểu theo nghĩa nhượng bộ được nêu trong chú thích.
translation_notes:
  register: Văn phong trang trọng, hiện đại, phù hợp lời trích Thi Thiên. Dùng “Ta/các con” để thể hiện lời Đức Chúa Trời phán với cộng đồng; “tổ phụ” bảo tồn sắc thái lịch sử giao ước. Các dấu chú thích [a], [b] đều xuất hiện trong bản văn.
