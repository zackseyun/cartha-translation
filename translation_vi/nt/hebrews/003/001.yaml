id: HEB.3.1
reference: Hebrews 3:1
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ὅθεν, ἀδελφοὶ ἅγιοι, κλήσεως ἐπουρανίου μέτοχοι, κατανοήσατε τὸν ἀπόστολον καὶ ἀρχιερέα τῆς ὁμολογίας ἡμῶν ⸀Ἰησοῦν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/001.yaml
  text: Therefore[a], holy brothers, sharers in a heavenly calling, consider Jesus, the apostle and high priest of our confession[c][b],
translation:
  language: vi
  text: Vì vậy, thưa anh chị em thánh[a], là những người cùng dự phần trong sự kêu gọi thiên thượng[b], hãy chăm chú suy xét Đức Giê-su, vị sứ đồ và thượng tế của lời tuyên xưng chúng ta[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Anh chị em” dịch một từ Hy Lạp ở dạng giống đực số nhiều, nhưng trong ngữ cảnh này hướng đến toàn thể cộng đồng tin Chúa, gồm cả nam lẫn nữ.
    reason: cultural_note
  - marker: b
    text: 'Cũng có thể dịch: “những người dự phần trong sự kêu gọi thuộc về trời” hoặc “sự kêu gọi từ trời.”'
    reason: lexical_alternative
  - marker: c
    text: '“Sứ đồ” theo nghĩa “đấng được sai phái.” Cả cụm cũng có thể được hiểu: “hãy chăm chú suy xét Đức Giê-su, Đấng chúng ta tuyên xưng là sứ đồ và thượng tế.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅθεν
  choice: Vì thế
  rationale: Liên từ suy luận nối lời khuyên này với lập luận ngay trước đó, đặc biệt Hê-bơ-rơ 2:17–18.
- source_word: ἀδελφοὶ ἅγιοι
  choice: anh chị em thánh
  rationale: ἀδελφοί ở số nhiều giống đực nhưng trong cách xưng hô cộng đồng có thể bao gồm cả nam lẫn nữ; tiếng Việt tự nhiên diễn đạt lực bao quát ấy bằng “anh chị em”. “Thánh” giữ ý những người được biệt riêng cho Đức Chúa Trời.
- source_word: κλήσεως ἐπουρανίου
  choice: sự kêu gọi từ trời
  rationale: Giữ ý lời triệu gọi có nguồn gốc từ trời, đồng thời không loại trừ sắc thái thuộc về trời của ἐπουράνιος.
- source_word: μέτοχοι
  choice: những người cùng dự phần
  rationale: Diễn đạt rõ sự tham dự và chia sẻ trong một thực tại chung, phù hợp cách dùng quan trọng của từ này trong Hê-bơ-rơ.
- source_word: κατανοήσατε
  choice: hãy chăm chú suy ngẫm về
  rationale: Mệnh lệnh đòi hỏi sự chú tâm và xem xét kỹ, mạnh hơn việc chỉ thoáng nghĩ đến.
- source_word: ἀπόστολον
  choice: Đấng được sai đến
  rationale: Chuyển tải nghĩa căn bản của ἀπόστολος khi áp dụng độc đáo cho Đức Giê-su, tránh khiến độc giả Việt hiểu trước hết đây là chức danh “sứ đồ” theo nghĩa nhóm môn đồ.
- source_word: ἀρχιερέα
  choice: thượng tế
  rationale: Thuật ngữ tiếng Việt quen thuộc cho chức vụ tư tế cao nhất và là chủ đề trọng yếu của thư Hê-bơ-rơ.
- source_word: τῆς ὁμολογίας ἡμῶν
  choice: của lời tuyên xưng chúng ta
  rationale: Giữ danh từ ὁμολογία và tính cộng đồng của lời tuyên xưng, đồng thời để nguyên khả năng cụm sở hữu liên hệ với cả hai vai trò vừa nêu.
- source_word: Ἰησοῦν
  choice: Đức Giê-su
  rationale: Dạng tên gọi chuẩn, trang trọng và thông dụng trong tiếng Việt Cơ Đốc.
theological_decisions:
- issue: Phạm vi giới tính của ἀδελφοὶ
  choice: Dịch “anh chị em” trong chính văn.
  alternative: “anh em”, kèm chú thích rằng lời gọi bao gồm phụ nữ.
  rationale: Trong tiếng Việt hiện đại, “anh chị em” là cách xưng hô tự nhiên cho toàn thể cộng đồng và thể hiện đúng phạm vi dụng học của số nhiều giống đực Hy Lạp ở đây, không biến nó thành một danh từ trung tính trừu tượng.
- issue: Sắc thái của ἀπόστολον khi nói về Đức Giê-su
  choice: Dịch theo nghĩa “Đấng được sai đến”.
  alternative: Giữ chức danh “sứ đồ”.
  rationale: Bản dịch theo nghĩa làm rõ vai trò Đức Giê-su là Đấng được Đức Chúa Trời sai phái, trong khi không áp đặt lên Ngài nghĩa chức vụ tông đồ về sau; chú thích giữ lại khả năng dịch bằng chức danh.
- issue: Quan hệ của τῆς ὁμολογίας ἡμῶν
  choice: Giữ cấu trúc “Đấng được sai đến và là thượng tế của lời tuyên xưng chúng ta”.
  alternative: “Hãy suy ngẫm về Đấng chúng ta tuyên xưng là Đức Giê-su, Đấng được sai đến và là thượng tế.”
  rationale: Cách chính văn bám sát cấu trúc Hy Lạp và không tự ý giải quyết hoàn toàn quan hệ cú pháp vốn có thể được hiểu theo hơn một cách.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “thưa” để thể hiện hô cách; “chăm chú suy ngẫm” truyền đạt sức nặng của mệnh lệnh. Các thuật ngữ thần học chính được giữ rõ nhưng tránh lối diễn đạt cổ.
