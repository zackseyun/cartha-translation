- from: Vì thế, thưa anh chị em thánh[a], là những người cùng dự phần vào sự kêu gọi từ trời[b], hãy chăm chú suy ngẫm về Đức Giê-su, Đấng được sai đến và là thượng tế của lời tuyên xưng chúng ta[c].
  to: Vì vậy, thưa anh chị em thánh[a], là những người cùng dự phần trong sự kêu gọi thiên thượng[b], hãy chăm chú suy xét Đức Giê-su, vị sứ đồ và thượng tế của lời tuyên xưng chúng ta[c].
