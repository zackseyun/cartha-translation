  source_fidelity: 'Bản dịch phản ánh đúng cấu trúc chính của SBLGNT: Đức Chúa Jêsus trung tín với Đấng đã lập/ngài, và sự trung tín ấy được so sánh với Môi-se. «Lập» là cách chuyển ngữ theo ngữ cảnh có cơ sở cho ποιήσαντι; chú thích nêu nghĩa từ vựng «tạo nên» mà không áp đặt nghĩa ấy vào chính văn. Bản văn SBLGNT được cung cấp không có «toàn thể/tất cả», và chính văn Việt không thêm cụm này, phù hợp với nguồn. Đại từ trong «nhà của Ngài» được giữ không diễn giải quá mức.'
