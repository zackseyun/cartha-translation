  text: πιστὸν ὄντα τῷ ποιήσαντι αὐτὸν ὡς καὶ Μωϋσῆς ⸀ἐν τῷ οἴκῳ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/002.yaml
  text: who was faithful to the one who appointed him[b][a], just as Moses also was in all his house.
translation:
  language: vi
  text: Ngài trung tín với Đấng đã lập Ngài[a], cũng như Môi-se đã trung tín trong nhà của Ngài[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: «Đấng đã tạo nên Ngài». Động từ Hy Lạp có thể mang nghĩa «làm, tạo nên», nhưng trong văn cảnh này có lẽ mang nghĩa «lập» hoặc «ủy nhiệm».'
    reason: lexical_alternative
  - marker: b
    text: 'Một số thủ bản chép: «trong toàn thể nhà của Ngài», gần với Dân Số 12:7; các thủ bản khác chỉ chép: «trong nhà của Ngài». Cụm từ này có lẽ nói đến nhà của Đức Chúa Trời.'
    reason: textual_variant
lexical_decisions:
- source_word: πιστὸν ὄντα
  choice: Ngài trung tín
  rationale: Cụm phân từ ở thể đối cách tiếp tục nói về Đức Chúa Jêsus trong câu 1. Cách diễn đạt này tự nhiên trong tiếng Việt và hiểu πιστός theo nghĩa trung thành, đáng tin cậy, chứ không phải «có đức tin».
- source_word: τῷ ποιήσαντι αὐτὸν
  choice: với Đấng đã lập Ngài
  rationale: ποιέω có nghĩa cơ bản là «làm, tạo nên», nhưng trong văn cảnh về chức vụ và sự ủy thác, «lập» truyền đạt thích hợp ý bổ nhiệm mà không dùng lối nói hành chính nặng nề. Chú thích giữ lại nghĩa từ vựng khác có thể có.
- source_word: ὡς καὶ
  choice: cũng như
  rationale: Diễn đạt rõ và tự nhiên phép so sánh giữa sự trung tín của Đức Chúa Jêsus và của Môi-se.
- source_word: Μωϋσῆς
  choice: Môi-se
  rationale: Dạng tên riêng quen dùng và dễ nhận biết trong tiếng Việt.
- source_word: ἐν τῷ οἴκῳ αὐτοῦ
  choice: trong nhà của Ngài
  rationale: Giữ hình ảnh «nhà» để liên kết với lập luận ở các câu sau, thay vì giải nghĩa thành «gia đình» hay «nhà Đức Chúa Trời». Đại từ được giữ nguyên để không giải quyết dứt khoát điều bản văn chỉ nói bằng đại từ.
theological_decisions:
- issue: Nghĩa của ποιήσαντι khi nói về Đức Chúa Con
  choice: lập
  alternative: tạo nên / làm nên
  rationale: Trong văn cảnh, động từ nói đến Đấng giao cho Đức Chúa Jêsus vai trò được nhắc ở câu 1. «Lập» phản ánh ý bổ nhiệm hoặc sai phái, đồng thời chú thích thừa nhận nghĩa «tạo nên» có thể có về mặt từ vựng mà không đưa hàm ý ấy vào chính văn.
- issue: Đối tượng được αὐτοῦ trong «nhà của Ngài» chỉ đến
  choice: giữ đại từ «Ngài» trong chính văn
  alternative: nói rõ «nhà Đức Chúa Trời» hoặc hiểu là nhà của Môi-se
  rationale: Văn cảnh và tiếng vọng từ Dân Số 12:7 khiến nhà của Đức Chúa Trời là cách hiểu có khả năng nhất, nhưng việc giữ đại từ tôn trọng hình thức và độ mở của nguyên văn.
- issue: Có hay không từ «tất cả/toàn» trước «nhà»
  choice: không đưa «toàn» vào chính văn SBLGNT
  alternative: «trong toàn thể nhà của Ngài» theo một số thủ bản
  rationale: Bản SBLGNT được cung cấp đọc ἐν τῷ οἴκῳ αὐτοῦ, không có πάντι hoặc ὅλῳ. Dị bản dài hơn được ghi trong chú thích vì nó gần với Dân Số 12:7 và có chứng cứ thủ bản.
translation_notes:
  register: Văn phong hiện đại, trang trọng nhưng dễ hiểu. Dùng «lập» thay vì «bổ nhiệm» để tránh sắc thái hành chính; giữ «nhà» vì đây là hình ảnh chủ đạo trong đoạn. Viết hoa «Ngài» theo quy ước tôn kính phổ biến, dù đại từ trong nguyên văn không tự nó phân biệt bằng chữ hoa.
