source:
  edition: SBLGNT
  text: τίσιν δὲ ὤμοσεν μὴ εἰσελεύσεσθαι εἰς τὴν κατάπαυσιν αὐτοῦ εἰ μὴ τοῖς ἀπειθήσασιν;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/018.yaml
  text: And to whom did he swear that they would not enter his rest[a], if not to those who disobeyed?
translation:
  language: vi
  text: Và Ngài đã thề với ai rằng họ sẽ không vào sự an nghỉ của Ngài, nếu không phải là những người đã không vâng lời[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “những người đã khước từ vâng lời.” Từ Hy Lạp nhấn mạnh hành động không chịu vâng phục; trong ngữ cảnh, sự không vâng lời này liên hệ chặt chẽ với sự không tin (xem Hê-bơ-rơ 3:19).'
    reason: lexical_alternative
lexical_decisions:
- source_word: τίσιν
  choice: với ai
  rationale: Đại từ nghi vấn số nhiều ở cách dữ liệu chỉ người nhận lời thề; “với ai” tự nhiên trong tiếng Việt và giữ nguyên dạng câu hỏi tu từ.
- source_word: δὲ
  choice: Và
  rationale: Liên từ tiếp nối chuỗi câu hỏi trong lập luận trước đó mà không nhấn mạnh sự tương phản quá mức.
- source_word: ὤμοσεν
  choice: đã thề
  rationale: Động từ ὀμνύω ở thì aorist chỉ hành động thề hoặc lập lời thề; cách dịch này ngắn gọn và giữ sắc thái trang trọng.
- source_word: μὴ εἰσελεύσεσθαι
  choice: rằng họ sẽ không vào
  rationale: Cụm nguyên mẫu sau động từ “thề” diễn tả nội dung lời thề. Cách dịch này giữ chủ động của εἰσέρχομαι, không thêm ý “không được phép” vốn không được biểu đạt trực tiếp trong hình thức động từ.
- source_word: εἰς τὴν κατάπαυσιν αὐτοῦ
  choice: vào sự an nghỉ của Ngài
  rationale: κατάπαυσις là thuật ngữ chủ đề trong thư Hê-bơ-rơ, nói đến sự an nghỉ thuộc về Đức Chúa Trời. “Sự an nghỉ của Ngài” giữ được mối liên hệ ấy và giới từ “vào” thể hiện hướng chuyển động của εἰς.
- source_word: εἰ μὴ
  choice: nếu không phải là
  rationale: Trong câu hỏi tu từ, cụm này giới thiệu câu trả lời duy nhất được mong đợi; cách dịch giữ gần cấu trúc Hy Lạp mà vẫn rõ nghĩa trong tiếng Việt.
- source_word: τοῖς ἀπειθήσασιν
  choice: với những người đã không vâng lời
  rationale: Phân từ aorist của ἀπειθέω nhấn mạnh việc không vâng phục hoặc khước từ vâng lời. Cách dịch này bảo toàn sự phân biệt với từ chỉ “không tin” ở câu kế tiếp, đồng thời để ngữ cảnh cho thấy quan hệ giữa hai ý.
theological_decisions:
- issue: Cách dịch ἀπειθήσασιν trong lời cảnh báo
  choice: những người đã không vâng lời
  alternative: những người đã không tin; những người đã khước từ vâng lời
  rationale: Câu này dùng ἀπειθέω chứ không dùng ἀπιστέω. Vì vậy, bản dịch chính giữ ý không vâng lời, không đồng nhất nó với sự không tin, dù Hê-bơ-rơ 3:19 cho thấy hai điều có quan hệ chặt chẽ.
- issue: Chủ thể hàm ẩn của ὤμοσεν
  choice: Ngài
  alternative: Đức Chúa Trời
  rationale: Động từ Hy Lạp không nêu lại chủ thể, nhưng ngữ cảnh xác định đó là Đức Chúa Trời. “Ngài” giữ tính liên tục của diễn ngôn mà không bổ sung danh xưng vào câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ câu hỏi tu từ cùng thuật ngữ chủ đề “sự an nghỉ”; đại từ “Ngài” viết hoa theo quy ước tiếng Việt khi chỉ Đức Chúa Trời.
