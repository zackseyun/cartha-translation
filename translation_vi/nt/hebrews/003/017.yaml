id: HEB.3.17
reference: Hebrews 3:17
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: τίσιν δὲ προσώχθισεν τεσσεράκοντα ἔτη; οὐχὶ τοῖς ἁμαρτήσασιν, ὧν τὰ κῶλα ἔπεσεν ἐν τῇ ἐρήμῳ;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/017.yaml
  text: And with whom was he angry for forty years? Was it not with those who sinned[a], whose bodies fell in the wilderness?
translation:
  language: vi
  text: Vậy, Đức Chúa Trời đã giận ai trong bốn mươi năm? Chẳng phải là những người đã phạm tội, mà thi thể họ đã ngã xuống trong hoang mạc sao?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσώχθισεν
  choice: đã giận
  rationale: Diễn đạt tự nhiên trạng thái giận dữ, phẫn nộ của Đức Chúa Trời đối với dân chúng, đồng thời giữ được sắc thái của câu hỏi tu từ.
- source_word: τεσσεράκοντα ἔτη
  choice: suốt bốn mươi năm
  rationale: Cụm đối cách chỉ khoảng thời gian; “suốt” diễn đạt rõ tính kéo dài trong tiếng Việt tự nhiên.
- source_word: ἁμαρτήσασιν
  choice: những người đã phạm tội
  rationale: Phân từ bất định chỉ những người thực hiện hành vi phạm tội; cách dịch này rõ ràng và sát nghĩa.
- source_word: κῶλα
  choice: xác
  rationale: Trong bối cảnh hình phạt nơi hoang mạc, từ này chỉ thân xác của những người đã chết. “Xác” giữ được mức độ nghiêm khắc của nguyên văn hơn “thân thể”, nhưng không cần thêm từ “chết” vào động từ.
- source_word: ἔπεσεν
  choice: ngã xuống
  rationale: Giữ hình ảnh của động từ Hy Lạp; cái chết được hàm ý qua danh từ “xác” và bối cảnh, không diễn giải quá mức.
- source_word: ἐν τῇ ἐρήμῳ
  choice: trong hoang mạc
  rationale: “Hoang mạc” phù hợp với bối cảnh dân Israel lang thang trong vùng hoang vu và tự nhiên trong tiếng Việt Kinh Thánh hiện đại.
theological_decisions:
- issue: Chủ ngữ được hàm ẩn của προσώχθισεν
  choice: Đức Chúa Trời
  alternative: Ngài
  rationale: Nguyên văn lược chủ ngữ nhưng văn cảnh xác định đó là Đức Chúa Trời. Nêu danh xưng giúp câu hỏi tiếng Việt độc lập, rõ nghĩa mà không thêm một khẳng định thần học mới.
- issue: Quan hệ của mệnh đề ὧν τὰ κῶλα ἔπεσεν
  choice: những người có xác ngã xuống
  alternative: mà xác họ đã ngã xuống
  rationale: Đại từ quan hệ ὧν có thể được thể hiện tự nhiên bằng cấu trúc sở hữu “những người có xác…”, vừa giữ liên hệ trực tiếp với những người phạm tội vừa tránh biến mệnh đề thành một lời giải thích vượt quá nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Thế” để nối với chuỗi câu hỏi tu từ trong văn cảnh; “Chẳng phải… sao?” bảo toàn lực tu từ của οὐχί. Không thêm chú thích vì “xác” trực tiếp thể hiện sắc thái nghiêm khắc của κῶλα, nên phương án chú thích tiếng Anh đã được đưa vào chính văn tiếng Việt.
