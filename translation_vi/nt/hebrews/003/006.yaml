id: HEB.3.6
reference: Hebrews 3:6
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Χριστὸς δὲ ὡς υἱὸς ἐπὶ τὸν οἶκον αὐτοῦ· ⸀ὃς οἶκός ἐσμεν ἡμεῖς, ⸀ἐὰν τὴν παρρησίαν καὶ τὸ καύχημα τῆς ⸀ἐλπίδος κατάσχωμεν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/006.yaml
  text: But the Messiah was faithful as a Son over his house[a], whose house we are[c][b], if we hold fast our boldness and the boast of our hope.
translation:
  language: vi
  text: Nhưng Đấng Mê-si, với tư cách là Con, cai quản nhà của Ngài[a]. Chúng ta chính là nhà ấy, nếu giữ vững lòng dạn dĩ[b] và niềm tự hào về hy vọng của mình[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Đấng Mê-si” cũng có thể dịch là “Đấng Christ”. Từ Hy Lạp Χριστός có thể được dùng như một tước hiệu hoặc như một tên gọi.
    reason: alternative_reading
  - marker: b
    text: “Lòng dạn dĩ” cũng có thể dịch là “lòng tin chắc”. Từ Hy Lạp παρρησία có thể chỉ sự thẳng thắn, cởi mở hoặc mạnh dạn đầy tin chắc.
    reason: lexical_alternative
  - marker: c
    text: “Niềm tự hào về hy vọng” cũng có thể hiểu là “niềm tin chắc do hy vọng đem lại” hoặc “niềm hân hoan trong hy vọng”. Từ Hy Lạp καύχημα có thể chỉ niềm tự hào, lý do để tự hào hoặc sự hân hoan đầy tin tưởng.
    reason: lexical_alternative
lexical_decisions:
- source_word: Χριστὸς
  choice: Đấng Mê-si
  rationale: Dùng theo nghĩa tước hiệu trong sự đối chiếu với Môi-se; chú thích giữ lại khả năng dịch theo dạng tên gọi quen thuộc là “Đấng Christ”.
- source_word: δὲ
  choice: Nhưng
  rationale: Diễn đạt sắc thái tương phản với câu trước, nơi Môi-se được nói đến như một tôi tớ.
- source_word: ὡς υἱὸς
  choice: với tư cách là Con
  rationale: Giữ lực so sánh/vai trò của ὡς và dùng “Con” viết hoa vì đối tượng là Đấng Mê-si, không thêm nội dung vượt quá văn bản.
- source_word: ἐπὶ τὸν οἶκον αὐτοῦ
  choice: cai quản nhà của Ngài
  rationale: ἐπί với đối cách ở đây chỉ thẩm quyền trên nhà; “cai quản” tự nhiên hơn lối dịch sát chữ “ở trên” trong tiếng Việt. “Nhà” giữ nguyên ẩn dụ về cộng đồng dân của Đức Chúa Trời, còn đại từ không cố giải quyết dứt khoát mọi sắc thái quy chiếu.
- source_word: ὃς οἶκός ἐσμεν ἡμεῖς
  choice: Chúng ta chính là nhà ấy
  rationale: Lối diễn đạt tự nhiên trong tiếng Việt, vẫn giữ nguyên ẩn dụ và mối liên hệ với “nhà” vừa nhắc đến.
- source_word: ἐὰν
  choice: nếu
  rationale: Giữ đúng điều kiện có thật trong câu Hy Lạp mà không áp đặt một hệ giải thích thần học về sự bền đỗ hay sa ngã.
- source_word: παρρησίαν
  choice: lòng dạn dĩ
  rationale: Thể hiện sự mạnh dạn, thẳng thắn và tin chắc; chú thích nêu khả năng dịch là “lòng tin chắc”.
- source_word: καύχημα
  choice: niềm tự hào
  rationale: Diễn đạt tự nhiên ý điều người ta hãnh diện hoặc hân hoan dựa vào, đồng thời tránh sắc thái khoe khoang tiêu cực không nhất thiết có trong từ Hy Lạp.
- source_word: τῆς ἐλπίδος
  choice: về hy vọng của mình
  rationale: Quan hệ sở thuộc được diễn đạt tự nhiên theo ngữ cảnh ngôi thứ nhất số nhiều; “của mình” làm rõ điều tiếng Hy Lạp ngầm hiểu.
- source_word: κατάσχωμεν
  choice: giữ vững
  rationale: Truyền đạt ý tiếp tục nắm giữ cách kiên định và bảo toàn sức thúc giục của thư Hê-bơ-rơ.
theological_decisions:
- issue: Nên dịch Χριστός như một tước hiệu hay dạng tên gọi
  choice: Đấng Mê-si
  alternative: Đấng Christ
  rationale: Ngữ cảnh đối chiếu Môi-se với Con hỗ trợ nghĩa tước hiệu; chú thích bảo lưu cách hiểu và cách gọi truyền thống khác.
- issue: Mức độ nhấn mạnh của mệnh đề điều kiện ἐὰν ... κατάσχωμεν
  choice: nếu giữ vững
  alternative: miễn là chúng ta giữ vững; nếu thật sự giữ vững
  rationale: “Nếu” bảo tồn sức nặng thật sự của điều kiện mà không tự giải quyết căng thẳng thần học liên quan đến sự bền đỗ.
- issue: Đối tượng sở hữu trong αὐτοῦ
  choice: nhà của Ngài
  alternative: nhà của Đức Chúa Trời; nhà của Đấng Mê-si
  rationale: Giữ đại từ như nguyên văn để không thu hẹp quá mức khả năng quy chiếu trong mạch lập luận, dù ngữ cảnh trước đó thiên về nhà của Đức Chúa Trời.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Bản dịch giữ ẩn dụ “nhà”, diễn đạt quyền cai quản của người Con bằng động từ tự nhiên, và bảo tồn mệnh đề điều kiện mà không áp đặt một kết luận hệ phái.
