  source_fidelity: 'Bản dịch chuyển tải đúng cấu trúc trích dẫn “như Ta đã thề”, động từ tuyên thệ ở quá khứ, sắc thái phán xét của ἐν τῇ ὀργῇ μου, và nhất là hiệu lực phủ định dứt khoát của công thức thề εἰ + thì tương lai. “Chúng sẽ chẳng bao giờ được vào” diễn đạt trung thực ý nghĩa thành ngữ: họ chắc chắn không được vào sự an nghỉ của Ta.'
  naturalness: Tiếng Việt hiện đại, trang trọng và mạch lạc. “Thịnh nộ” thích hợp với lời thề phán xét; “sự an nghỉ” tự nhiên trong văn cảnh Kinh Thánh và nhất quán với thuật ngữ xuyên suốt Hê-bơ-rơ. Chữ thường đầu câu “như” có thể phù hợp vì câu này tiếp nối lời trích dẫn từ câu trước.
  terminology: “Ta” giữ đúng ngôi lời Đức Chúa Trời trong trích dẫn. “Sự an nghỉ” bảo toàn κατάπαυσις như một mô-típ thần học mà không áp đặt cách hiểu về địa điểm hay trạng thái. Chú thích giải thích chính xác hình thức bề mặt “Nếu chúng sẽ vào...” và lực nghĩa lời thề phủ định.
