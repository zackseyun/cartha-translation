id: HEB.3.11
reference: Hebrews 3:11
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὡς ὤμοσα ἐν τῇ ὀργῇ μου· Εἰ εἰσελεύσονται εἰς τὴν κατάπαυσίν μου.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/011.yaml
  text: as I swore in my wrath[a], ‘They shall never enter my rest.’
translation:
  language: vi
  text: 'như Ta đã thề trong cơn thịnh nộ của Ta rằng: “Chúng sẽ chẳng bao giờ được vào sự an nghỉ của Ta.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hy Lạp: “Nếu chúng sẽ vào sự an nghỉ của Ta”, một công thức thề có nghĩa: “Chắc chắn chúng sẽ không được vào sự an nghỉ của Ta.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς
  choice: như
  rationale: Giữ chức năng liên kết với lời trích dẫn đang tiếp diễn trong ngữ cảnh, đồng thời diễn đạt tự nhiên bằng tiếng Việt.
- source_word: ὤμοσα
  choice: Ta đã thề
  rationale: Động từ aorist của ὀμνύω chỉ hành động tuyên thệ; “đã thề” trực tiếp, trang trọng và tự nhiên.
- source_word: ἐν τῇ ὀργῇ μου
  choice: trong cơn thịnh nộ của Ta
  rationale: “Thịnh nộ” giữ được sắc thái nghiêm trọng và tính phán xét của ὀργή trong lời cảnh cáo này.
- source_word: Εἰ εἰσελεύσονται
  choice: Chúng sẽ chẳng bao giờ được vào
  rationale: Đây là công thức thề phủ định theo lối Sê-mít, dùng εἰ với thì tương lai để diễn đạt sự phủ định dứt khoát; bản dịch làm rõ hiệu lực của thành ngữ thay vì tạo ra một câu điều kiện gây hiểu lầm.
- source_word: εἰς τὴν κατάπαυσίν μου
  choice: vào sự an nghỉ của Ta
  rationale: “Sự an nghỉ” duy trì thuật ngữ chủ đạo trong lập luận của Hê-bơ-rơ và không thu hẹp ý nghĩa thành đất hứa, thiên đàng hay trạng thái bình an nội tâm.
theological_decisions:
- issue: Cách dịch công thức thề Εἰ εἰσελεύσονται
  choice: 'Diễn đạt lời thề phủ định rõ ràng: “Chúng sẽ chẳng bao giờ được vào sự an nghỉ của Ta.”'
  alternative: 'Dịch sát hình thức: “Nếu chúng sẽ vào sự an nghỉ của Ta.”'
  rationale: Cách dịch sát từng chữ sẽ che khuất thành ngữ thề trong tiếng Hy Lạp chịu ảnh hưởng Sê-mít và dễ bị hiểu thành điều kiện thông thường. Lời phủ định dứt khoát giữ đúng lực ngôn trung mà không thêm nội dung giáo lý.
- issue: Ý nghĩa của κατάπαυσις
  choice: sự an nghỉ
  alternative: nơi an nghỉ
  rationale: Hê-bơ-rơ phát triển κατάπαυσις như một chủ đề liên kết Thi Thiên 95 với sự an nghỉ của chính Đức Chúa Trời. “Sự an nghỉ” bảo toàn độ mở và mối liên văn bản, không quyết định trước nơi chốn hay bản chất cụ thể.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “Ta” phản ánh lời Đức Chúa Trời trong trích dẫn. “Thịnh nộ” giữ sắc thái tư pháp trang nghiêm; “sự an nghỉ” duy trì thuật ngữ thần học xuyên suốt phân đoạn.
