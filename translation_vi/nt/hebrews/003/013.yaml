id: HEB.3.13
reference: Hebrews 3:13
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀλλὰ παρακαλεῖτε ἑαυτοὺς καθ’ ἑκάστην ἡμέραν, ἄχρις οὗ τὸ Σήμερον καλεῖται, ἵνα μὴ σκληρυνθῇ ⸂τις ἐξ ὑμῶν⸃ ἀπάτῃ τῆς ἁμαρτίας·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/013.yaml
  text: But encourage one another every day[b][a], as long as it is called “Today,” so that none of you may be hardened by the deceitfulness of sin.
translation:
  language: vi
  text: Nhưng hãy khích lệ nhau[b] mỗi ngày, bao lâu còn được gọi là “Hôm nay”[a], để không ai trong anh chị em bị sự lừa dối của tội lỗi làm cho cứng lòng.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Hôm nay” gợi lại Thi Thiên 95 và chỉ thời điểm hiện tại, khi con người phải đáp lại tiếng gọi của Đức Chúa Trời.
    reason: cross_reference
  - marker: b
    text: Cũng có thể dịch là “khuyên bảo nhau” hoặc “thúc giục nhau.” Động từ Hy Lạp có thể mang nghĩa khích lệ, khuyên bảo, thúc giục hay an ủi, tùy ngữ cảnh.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Nhưng
  rationale: Diễn tả sự tương phản rõ rệt với lời cảnh báo ngay trước đó, đồng thời tự nhiên trong tiếng Việt hiện đại.
- source_word: παρακαλεῖτε
  choice: hãy khích lệ
  rationale: Động từ có thể bao hàm khích lệ, khuyên bảo, thúc giục hoặc an ủi. Trong bối cảnh cộng đồng giúp nhau bền lòng, “khích lệ” truyền đạt rõ chức năng nâng đỡ liên tục mà không loại bỏ sắc thái khuyên nhủ; phương án khác được ghi ở chú thích.
- source_word: ἑαυτοὺς
  choice: nhau
  rationale: 'Dù hình thức là đại từ phản thân số nhiều, trong mệnh lệnh dành cho cả cộng đồng, từ này mang nghĩa tương hỗ: người này đối với người kia.'
- source_word: καθ’ ἑκάστην ἡμέραν
  choice: mỗi ngày
  rationale: Giữ nguyên ý hành động lặp lại hằng ngày bằng cách nói ngắn gọn, tự nhiên.
- source_word: ἄχρις οὗ
  choice: bao lâu
  rationale: Nhấn mạnh toàn bộ khoảng thời gian mà lời kêu gọi vẫn còn cấp thiết, thay vì chỉ nhấn vào điểm kết thúc.
- source_word: τὸ Σήμερον καλεῖται
  choice: thời gian này còn được gọi là “Hôm nay”
  rationale: Giữ thể bị động của καλεῖται và làm rõ chức năng danh từ hóa của Σήμερον trong tiếng Việt. Dấu ngoặc kép bảo tồn tiếng vọng có chủ ý từ Thi Thiên 95.
- source_word: ἵνα μὴ
  choice: để không
  rationale: 'Diễn đạt mục đích phủ định một cách tự nhiên: sự khích lệ nhằm ngăn điều được cảnh báo xảy ra.'
- source_word: σκληρυνθῇ
  choice: bị ... làm cho cứng lòng
  rationale: Giữ sắc thái bị động và diễn đạt thành ngữ về sự chai cứng nội tâm theo lối tiếng Việt dễ hiểu.
- source_word: τις ἐξ ὑμῶν
  choice: không một ai trong anh chị em
  rationale: 'Trong mệnh đề phủ định, cách diễn đạt này truyền đạt tự nhiên phạm vi phân phối của τις: lời cảnh báo áp dụng cho từng người trong cộng đồng.'
- source_word: ἀπάτῃ τῆς ἁμαρτίας
  choice: bị sự lừa dối của tội lỗi làm cho
  rationale: 'Hiểu cách dữ liệu ἀπάτῃ theo nghĩa phương tiện hoặc nguyên nhân tác động: sự lừa dối vốn thuộc về tội lỗi là điều dẫn đến cứng lòng.'
theological_decisions:
- issue: Tính tương hỗ của lời khích lệ
  choice: khích lệ nhau
  alternative: tự khích lệ mình / khuyên bảo nhau
  rationale: Đại từ phản thân số nhiều có lực tương hỗ trong ngữ cảnh này. Bản dịch giữ trách nhiệm chung của cộng đồng, không biến câu thành lời kêu gọi thuần túy cá nhân.
- issue: Ý nghĩa của τὸ Σήμερον
  choice: “Hôm nay” là thời điểm hiện tại để đáp lại tiếng gọi của Đức Chúa Trời
  alternative: “hôm nay” chỉ là một ngày theo nghĩa thời gian thông thường
  rationale: Ngữ cảnh Hê-bơ-rơ 3 trích dẫn và triển khai Thi Thiên 95. Dấu ngoặc kép cho thấy sức nặng liên văn bản nhưng không giải quyết quá mức phạm vi hay thời hạn của “Hôm nay” trong chính câu.
- issue: Tác nhân hoặc phương tiện của sự cứng lòng
  choice: sự lừa dối của tội lỗi làm cho cứng lòng
  alternative: trở nên cứng lòng vì sự lừa dối của tội lỗi
  rationale: Cách dịch được chọn giữ thể bị động của σκληρυνθῇ và lực phương tiện của ἀπάτῃ, đồng thời không xác định thêm một tác nhân thần học ngoài điều văn bản nêu.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại và dễ hiểu. “Anh chị em” diễn đạt tự nhiên đại từ số nhiều chỉ cộng đồng mà không giới hạn giới tính. Cấu trúc “bị ... làm cho cứng lòng” hơi trang trọng nhưng bảo tồn thể bị động và quan hệ nhân quả của nguyên văn.
