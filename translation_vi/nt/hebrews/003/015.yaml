source:
  edition: SBLGNT
  text: ἐν τῷ λέγεσθαι· Σήμερον ἐὰν τῆς φωνῆς αὐτοῦ ἀκούσητε, Μὴ σκληρύνητε τὰς καρδίας ὑμῶν ὡς ἐν τῷ παραπικρασμῷ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/015.yaml
  text: while it is being said[a], “Today, if you hear his voice, do not harden your hearts as in the rebellion.”
translation:
  language: vi
  text: 'trong khi có lời phán rằng: “Ngày nay, nếu anh em nghe tiếng Ngài, thì đừng làm cho lòng anh em cứng lại như trong cuộc nổi loạn[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “sự chọc giận”, theo cách dịch truyền thống của lời trích Thi Thiên 95.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τῷ λέγεσθαι
  choice: trong khi có lời phán rằng
  rationale: Cấu trúc ἐν với động từ nguyên mẫu có mạo từ mang ý nghĩa thời gian/hoàn cảnh; dạng hiện tại bị động gợi lời trích dẫn đang tiếp tục vang lên. “Có lời phán” tự nhiên, trang trọng và phù hợp với lời Kinh Thánh được dẫn.
- source_word: Σήμερον
  choice: Ngày nay
  rationale: Giữ tính cấp bách hiện tại của lời khuyên trong Thi Thiên; đây cũng là cách diễn đạt tự nhiên trong văn phong Kinh Thánh tiếng Việt.
- source_word: ἐὰν ... ἀκούσητε
  choice: nếu anh em nghe
  rationale: Diễn đạt trực tiếp mệnh đề điều kiện với ἐὰν và động từ ở thể giả định, không thêm sắc thái không có trong nguyên văn.
- source_word: τῆς φωνῆς αὐτοῦ
  choice: tiếng Ngài
  rationale: Cách nói tự nhiên, trang trọng; đại từ “Ngài” cho thấy đối tượng là Đức Chúa Trời trong ngữ cảnh mà không đưa danh xưng vào nguyên văn.
- source_word: Μὴ σκληρύνητε τὰς καρδίας ὑμῶν
  choice: đừng làm cho lòng mình cứng lại
  rationale: Giữ lực chủ động của động từ và hình ảnh “lòng” chỉ con người bên trong. “Lòng mình” tự nhiên hơn “lòng của anh em” trong câu mệnh lệnh tiếng Việt.
- source_word: ὡς ἐν τῷ παραπικρασμῷ
  choice: như trong cuộc nổi loạn
  rationale: παραπικρασμός chỉ sự chống nghịch khiến Đức Chúa Trời bị chọc giận, đồng thời gợi biến cố trong hoang mạc. “Cuộc nổi loạn” truyền đạt rõ hành vi tập thể và bối cảnh sự kiện.
theological_decisions:
- issue: Ý nghĩa của παραπικρασμός trong lời trích Thi Thiên 95
  choice: cuộc nổi loạn
  alternative: sự chọc giận
  rationale: “Cuộc nổi loạn” làm rõ sự chống nghịch của dân trong hoang mạc và sức nặng đạo đức của từ. “Sự chọc giận” phản ánh sát hơn khía cạnh họ khiêu khích Đức Chúa Trời, nhưng kém tự nhiên và dễ nhấn vào cảm xúc hơn hành vi nổi loạn.
- issue: Chủ thể của lời được nói trong ἐν τῷ λέγεσθαι
  choice: dùng cấu trúc phiếm chỉ “có lời phán”
  alternative: “khi Ngài phán” hoặc “khi Kinh Thánh nói”
  rationale: Nguyên văn dùng bị động không nêu rõ chủ thể. Bản dịch không tự ý xác định đó là Đức Chúa Trời, Đức Thánh Linh hay Kinh Thánh, nhờ vậy giữ được độ mở của văn bản.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh em” cho số nhiều ὑμῶν và “Ngài” để chỉ Đức Chúa Trời. Không dùng chú thích vì phương án chính đã truyền đạt rõ παραπικρασμός; nếu cần bản đối chiếu truyền thống, có thể cân nhắc “sự chọc giận”, nhưng không cần thiết cho bản văn chính.
