id: HEB.3.12
reference: Hebrews 3:12
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: βλέπετε, ἀδελφοί, μήποτε ἔσται ἔν τινι ὑμῶν καρδία πονηρὰ ἀπιστίας ἐν τῷ ἀποστῆναι ἀπὸ θεοῦ ζῶντος,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/012.yaml
  text: Watch out[a], brothers[c][b], lest there be in any of you an evil heart of unbelief in turning away from the living God.
translation:
  language: vi
  text: Anh em hãy coi chừng, kẻo có ai trong anh em mang lòng xấu xa, không tin mà lìa bỏ Đức Chúa Trời hằng sống.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Anh em” dịch danh từ số nhiều giống đực ἀδελφοί; trong ngữ cảnh này, từ ấy có thể dùng để gọi chung cả cộng đồng tín hữu, gồm nam và nữ.
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “mang một tấm lòng xấu xa, bất trung” hoặc “mang một tấm lòng xấu xa, không trung tín.”'
    reason: alternative_reading
  - marker: c
    text: 'Cũng có thể dịch: “lìa xa” hoặc “quay khỏi Đức Chúa Trời hằng sống.”'
    reason: alternative_reading
lexical_decisions:
- source_word: βλέπετε
  choice: hãy cẩn thận
  rationale: Động từ mệnh lệnh hiện tại số nhiều mang sắc thái cảnh báo liên tục; cách diễn đạt này tự nhiên, nghiêm trang và giữ được ý đề phòng.
- source_word: ἀδελφοί
  choice: hỡi anh em
  rationale: Giữ hình thức xưng hô số nhiều giống đực của nguyên văn; trong ngữ cảnh, từ này có thể chỉ toàn thể cộng đồng tín hữu.
- source_word: μήποτε ἔσται ἔν τινι ὑμῶν
  choice: kẻo trong bất cứ ai trong anh em có
  rationale: Giữ cấu trúc cảnh báo về khả năng tình trạng ấy xuất hiện nơi bất kỳ thành viên nào, đồng thời dùng lối nói Việt trang trọng và dễ hiểu.
- source_word: καρδία πονηρὰ ἀπιστίας
  choice: một tấm lòng xấu xa, vô tín
  rationale: “Tấm lòng” giữ hình ảnh Kinh Thánh về trung tâm tư tưởng, ý chí và tình cảm; “vô tín” diễn đạt ἀπιστία mà vẫn để ngỏ sắc thái không tin và bất trung.
- source_word: ἐν τῷ ἀποστῆναι
  choice: mà lìa bỏ
  rationale: Diễn đạt mối liên hệ giữa tấm lòng vô tín và hành động rời xa Đức Chúa Trời, nhưng không áp đặt thuật ngữ thần học kỹ thuật như “bội đạo”.
- source_word: ἀπὸ θεοῦ ζῶντος
  choice: Đức Chúa Trời hằng sống
  rationale: Cụm từ quen thuộc, trang nghiêm, thể hiện rõ tính xác định của θεός trong ngữ cảnh và giữ sự tương phản hàm ẩn với các thần không có sự sống.
theological_decisions:
- issue: Sắc thái của ἀπιστίας
  choice: vô tín
  alternative: không tin; bất trung
  rationale: Ngữ cảnh Hê-bơ-rơ 3 nhấn mạnh việc không tin lời Đức Chúa Trời, nhưng danh từ cũng có thể gợi sự bất trung. “Vô tín” bảo tồn phần nào cả hai sắc thái; chú thích nêu rõ các khả năng.
- issue: Mức độ mạnh của ἀποστῆναι
  choice: lìa bỏ
  alternative: lìa xa; sa ngã; bội đạo
  rationale: “Lìa bỏ” truyền đạt tính nghiêm trọng của việc rời khỏi Đức Chúa Trời mà không biến động từ thành một thuật ngữ giáo lý kỹ thuật; chú thích bảo tồn các cách hiểu gần nghĩa.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang nghiêm và dễ hiểu. “Hỡi anh em” giữ giọng kêu gọi trực tiếp; “kẻo” bảo tồn sắc thái cảnh báo súc tích. Tránh dùng “bội đạo” trong chính văn vì thuật ngữ này có thể giải quyết quá mức phạm vi nghĩa của ἀποστῆναι.
