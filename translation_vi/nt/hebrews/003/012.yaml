revisions:
- from: Hỡi anh em[a], hãy cẩn thận, kẻo trong bất cứ ai trong anh em có một tấm lòng xấu xa, vô tín[b], mà lìa bỏ Đức Chúa Trời hằng sống[c].
  to: Anh em hãy coi chừng, kẻo có ai trong anh em mang lòng xấu xa, không tin mà lìa bỏ Đức Chúa Trời hằng sống.[a][b][c]
  rationale: Bản sửa giải quyết sự mơ hồ cú pháp bằng cách đưa “có ai trong anh em” làm chủ thể rõ ràng của cả việc mang lòng không tin và việc lìa bỏ Đức Chúa Trời. “Không tin” phản ánh cách hiểu chính theo mạch văn, trong khi chú thích nêu phương án nhấn mạnh sự bất trung. “Quay khỏi” là phương án sát nghĩa cho ἀποστῆναι mà không áp đặt khái niệm giáo lý kỹ thuật.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T21:27:42Z'
review_pass:
  verdict: revise
  source_fidelity: Bản nháp truyền đạt đúng lời cảnh báo, đối tượng là Đức Chúa Trời hằng sống, và phần lớn các tương đương từ vựng. Tuy nhiên, cụm “có một tấm lòng ... mà lìa bỏ” khiến về ngữ pháp tiếng Việt chính “tấm lòng” là chủ thể của động từ “lìa bỏ”. Nguyên văn nói về khả năng một người trong cộng đồng có lòng ác, không tin, trong/sự việc người ấy quay khỏi Đức Chúa Trời. Cần chỉnh để người ấy, không phải “tấm lòng”, là chủ thể của hành động.
  naturalness: “Hỡi anh em” và “hãy cẩn thận” đều có thể hiểu được, nhưng “Anh em hãy coi chừng” tự nhiên hơn trong lời cảnh báo hiện đại. “Vô tín” có sắc thái trang trọng nhưng ít tự nhiên và có thể không rõ bằng “không tin”. Cấu trúc “có ai ... mang lòng ... mà lìa bỏ” mạch lạc và giữ giọng trang nghiêm.
  terminology: Giữ “anh em” kèm chú thích bao hàm cộng đồng tín hữu là phù hợp với ἀδελφοί. “Đức Chúa Trời hằng sống” là cách gọi Kinh Thánh đã ổn định. “Không tin” phản ánh sát ἀπιστίας trong mạch văn, còn “bất trung” nên được nêu như phương án trong chú thích. Không dùng thuật ngữ kỹ thuật “bội đạo” trong chính văn.
  issues:
  - severity: medium
    issue: Chủ thể ngữ pháp của “lìa bỏ” không rõ và dễ bị gán cho “tấm lòng”.
    rationale: Trong “có một tấm lòng xấu xa, vô tín, mà lìa bỏ...”, mệnh đề sau “mà” theo cú pháp Việt thường bổ nghĩa cho “tấm lòng”. Đặt “có ai ... mang lòng ... mà lìa bỏ” bảo đảm người trong cộng đồng là chủ thể, phù hợp với ý của ἐν τινι ὑμῶν ... ἐν τῷ ἀποστῆναι.
  - severity: low
    issue: “Vô tín” kém thông dụng hơn “không tin” trong tiếng Việt hiện đại.
    rationale: “Không tin” diễn đạt trực tiếp ἀπιστία và phù hợp ngữ cảnh Hê-bơ-rơ 3; chú thích vẫn bảo tồn khả năng “bất trung/không trung tín”.
