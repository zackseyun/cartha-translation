  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: μὴ σκληρύνητε τὰς καρδίας ὑμῶν ὡς ἐν τῷ παραπικρασμῷ, κατὰ τὴν ἡμέραν τοῦ πειρασμοῦ ἐν τῇ ἐρήμῳ,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/008.yaml
  text: do not harden your hearts as in the rebellion[a], as on the day of testing in the wilderness,
translation:
  language: vi
  text: Đừng làm cho lòng anh em chai cứng như trong cuộc phản nghịch[a], như vào ngày thử thách trong hoang mạc,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc, theo các địa danh Hê-bơ-rơ làm nền cho Thi Thiên 95:8: “như tại Mê-ri-ba, như trong ngày tại Ma-sa, trong hoang mạc.”'
    reason: alternative_reading
lexical_decisions:
- source_word: μὴ σκληρύνητε
  choice: đừng làm ... chai cứng
  rationale: Mệnh đề cấm với μή và động từ chủ động truyền đạt lời ngăn cấm trực tiếp, đồng thời giữ trách nhiệm của người nghe đối với phản ứng của mình.
- source_word: τὰς καρδίας ὑμῶν
  choice: lòng anh em
  rationale: “Lòng” là cách diễn đạt Kinh Thánh tự nhiên trong tiếng Việt, chỉ con người bên trong gồm ý chí, suy nghĩ và thái độ. “Anh em” thể hiện ngôi thứ hai số nhiều và lời nói trực tiếp với cộng đồng.
- source_word: ὡς ἐν τῷ παραπικρασμῷ
  choice: như trong cuộc phản nghịch
  rationale: παραπικρασμός có thể chỉ sự chọc giận hoặc phản nghịch; trong lời trích Thi Thiên 95, “cuộc phản nghịch” diễn đạt rõ cả biến cố lịch sử lẫn tính chất đạo đức mà không thay danh từ Hy Lạp bằng địa danh Hê-bơ-rơ.
- source_word: κατὰ τὴν ἡμέραν
  choice: như vào ngày
  rationale: κατά với đối cách tại đây nối sự so sánh với biến cố trong quá khứ. “Như vào ngày” giữ sự song hành với vế trước và tự nhiên trong tiếng Việt.
- source_word: τοῦ πειρασμοῦ
  choice: thử thách
  rationale: πειρασμός có thể nói đến sự thử nghiệm, thử thách hoặc cám dỗ. “Thử thách” phù hợp với biến cố trong hoang mạc và không xác định quá mức ai thử ai.
- source_word: ἐν τῇ ἐρήμῳ
  choice: trong hoang mạc
  rationale: “Hoang mạc” là cách gọi tự nhiên, trang trọng cho vùng hoang vu nơi dân Israel lưu lạc, đồng thời giữ âm hưởng lịch sử Kinh Thánh.
theological_decisions:
- issue: Cách chuyển tải ám chỉ lịch sử trong Thi Thiên 95
  choice: Dịch các danh từ Hy Lạp theo nghĩa mô tả là “cuộc phản nghịch” và “ngày thử thách” trong chính văn.
  alternative: “như tại Mê-ri-ba, như vào ngày ở Ma-sa trong hoang mạc”
  rationale: Thư Hê-bơ-rơ dẫn cách diễn đạt Hy Lạp của Thi Thiên 94(95):8 LXX, trong đó các địa danh Hê-bơ-rơ được biểu đạt bằng những danh từ giải nghĩa. Chính văn vì thế đi theo nguồn Hy Lạp, còn nền tảng địa danh Hê-bơ-rơ được bảo lưu trong chú thích.
- issue: Chủ thể và đối tượng của sự thử thách
  choice: Giữ cách nói “ngày thử thách” không nêu rõ chủ thể.
  alternative: “ngày họ thử Đức Chúa Trời” hoặc “ngày Đức Chúa Trời thử họ”
  rationale: Cụm τοῦ πειρασμοῦ tự nó không nêu chủ thể hay đối tượng; cách dịch trung tính bảo tồn độ mở của câu Hy Lạp và mối liên hệ với truyền thống Thi Thiên.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Chai cứng” tự nhiên hơn “làm cứng” khi nói về lòng người; “phản nghịch” giữ sắc thái Kinh Thánh mà vẫn thông dụng. Dấu phẩy cuối câu được giữ vì câu trích dẫn tiếp tục sang câu kế.
