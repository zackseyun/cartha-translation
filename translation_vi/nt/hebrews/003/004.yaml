id: HEB.3.4
reference: Hebrews 3:4
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: πᾶς γὰρ οἶκος κατασκευάζεται ὑπό τινος, ὁ ⸀δὲ πάντα κατασκευάσας θεός.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/004.yaml
  text: For every house is built by someone[a], but God is the one who built all things.
translation:
  language: vi
  text: Vì mỗi ngôi nhà đều do một người xây dựng, còn Đấng xây dựng muôn vật chính là Đức Chúa Trời.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πᾶς
  choice: mỗi
  rationale: Đi với danh từ số ít οἶκος, πᾶς mang nghĩa phân phối; “mỗi ngôi nhà” tự nhiên và chính xác trong tiếng Việt.
- source_word: γὰρ
  choice: Vì
  rationale: γάρ nêu lý do giải thích cho lập luận trước đó; “Vì” giữ rõ quan hệ logic.
- source_word: οἶκος
  choice: ngôi nhà
  rationale: Giữ hình ảnh kiến trúc cụ thể và phép chơi nghĩa của οἶκος trong văn cảnh Hê-bơ-rơ 3, thay vì diễn giải thành “gia đình” hay “nhà Chúa”.
- source_word: κατασκευάζεται
  choice: được xây dựng
  rationale: Dạng bị động hiện tại nói đến một ngôi nhà được tạo dựng bởi tác nhân; cách dịch này tự nhiên và giữ hình ảnh xây cất.
- source_word: ὑπό τινος
  choice: do một người
  rationale: ὑπό với sở hữu cách chỉ tác nhân, còn τις là đại từ bất định; “do một người” diễn đạt tự nhiên chân lý khái quát rằng nhà nào cũng có người xây.
- source_word: ὁ δὲ
  choice: còn Đấng
  rationale: δέ đánh dấu sự chuyển ý có tính đối chiếu nhẹ; “còn” tự nhiên hơn “nhưng” trong tiếng Việt, và “Đấng” thể hiện phân từ được dùng như danh từ chỉ một chủ thể hữu ngôi.
- source_word: πάντα
  choice: muôn vật
  rationale: πάντα có phạm vi bao quát. “Muôn vật” là cách nói trang trọng, tự nhiên, chỉ mọi sự được tạo dựng mà không thu hẹp thành riêng “vũ trụ”.
- source_word: κατασκευάσας
  choice: xây dựng
  rationale: Giữ sự lặp lại từ vựng với κατασκευάζεται và duy trì phép loại suy về người xây nhà, dù đối tượng ở đây là muôn vật.
- source_word: θεός
  choice: Đức Chúa Trời
  rationale: θεός xác định Đấng xây dựng muôn vật là Thiên Chúa; “Đức Chúa Trời” là cách gọi trang trọng, phổ biến trong truyền thống Kinh Thánh tiếng Việt.
theological_decisions:
- issue: Cách thể hiện θεός trong mệnh đề cuối và sự đồng nhất Đấng xây dựng muôn vật với Đức Chúa Trời
  choice: Đấng xây dựng muôn vật chính là Đức Chúa Trời
  alternative: Đức Chúa Trời là Đấng xây dựng muôn vật
  rationale: Trật tự được chọn bám sát cấu trúc Hy Lạp ὁ ... κατασκευάσας θεός, làm nổi bật sự đồng nhất ở cao điểm của lập luận mà không thêm lời giải thích siêu hình.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Bản dịch giữ hình ảnh “nhà/xây dựng” xuyên suốt, dùng “còn” cho đối chiếu nhẹ của δέ và tránh diễn giải οἶκος thành “gia đình”. Không cần chú thích vì phương án tiếng Anh “everything” không phản ánh một dị bản hay sự mơ hồ cần thiết trong tiếng Việt; “muôn vật” đã truyền đạt tự nhiên phạm vi của πάντα.
