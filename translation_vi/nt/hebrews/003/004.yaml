  terminology: '“Đức Chúa Trời” là cách gọi Kinh Thánh tiếng Việt trang trọng và phù hợp để dịch θεός trong bản dịch này. “Đấng” phản ánh hợp lý phân từ có mạo từ được danh từ hóa mà không thêm diễn giải giáo lý. Không cần chú thích: không có dị bản hoặc mơ hồ ngữ nghĩa nào cần đánh dấu, và “muôn vật” đã chuyển tải đầy đủ πάντα.'
