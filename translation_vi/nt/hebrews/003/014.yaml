language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: μέτοχοι γὰρ ⸂τοῦ Χριστοῦ γεγόναμεν⸃, ἐάνπερ τὴν ἀρχὴν τῆς ὑποστάσεως μέχρι τέλους βεβαίαν κατάσχωμεν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/014.yaml
  text: For we have become sharers in the Messiah, if indeed we hold the beginning of our assurance firm to the end.
translation:
  language: vi
  text: Vì chúng ta đã trở nên những người dự phần trong Đấng Christ[a], nếu quả thật chúng ta giữ vững niềm xác tín ban đầu của mình cho đến cuối cùng[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “những người cùng chia sẻ với Đấng Christ” hoặc “những người dự phần vào Đấng Christ.”'
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn: “khởi đầu của niềm xác tín.” Từ Hy Lạp được dịch là “niềm xác tín” cũng có thể có nghĩa là “sự tin chắc”; trong một số ngữ cảnh, là “thực tại” hoặc “bản thể.”'
    reason: lexical_and_formal_alternative
lexical_decisions:
- source_word: μέτοχοι
  choice: những người được dự phần
  rationale: Diễn đạt ý cùng chia sẻ hay tham dự vào một điều gì đó; cách nói này tự nhiên, trang trọng và phù hợp với bổ ngữ sở hữu τοῦ Χριστοῦ.
- source_word: γὰρ
  choice: Vì
  rationale: Nêu lý do hoặc lời giải thích cho lời cảnh báo, khích lệ ở phần trước.
- source_word: τοῦ Χριστοῦ
  choice: trong Đấng Christ
  rationale: Sau μέτοχοι, sở hữu cách chỉ đối tượng mà người ta được dự phần; “Đấng Christ” giữ tước hiệu quen thuộc và trang trọng trong tiếng Việt.
- source_word: γεγόναμεν
  choice: đã trở nên
  rationale: Thì hoàn thành diễn tả một trạng thái hiện tại phát sinh từ việc đã xảy ra; “đã trở nên” giữ được cả sự khởi đầu lẫn kết quả đang tiếp diễn.
- source_word: ἐάνπερ
  choice: miễn là
  rationale: Thể hiện điều kiện có nhấn mạnh. “Miễn là” tự nhiên trong tiếng Việt và không tự giải quyết quan hệ thần học giữa điều kiện với việc được dự phần.
- source_word: τὴν ἀρχὴν τῆς ὑποστάσεως
  choice: niềm xác tín mình có từ ban đầu
  rationale: Cấu trúc Hy Lạp theo nghĩa đen là “sự khởi đầu của ὑπόστασις”, nhưng trong ngữ cảnh chỉ niềm xác tín đã có lúc khởi đầu. Cách diễn đạt tiếng Việt này tránh cụm danh từ gượng “khởi đầu của niềm xác tín” mà vẫn bảo toàn ý.
- source_word: ὑποστάσεως
  choice: niềm xác tín
  rationale: Trong ngữ cảnh này, từ chỉ một lập trường tin chắc hay sự bảo đảm chủ quan hơn là nghĩa bản thể học “bản thể/thực tại”; “niềm xác tín” rõ và phù hợp với lời kêu gọi kiên trì.
- source_word: μέχρι τέλους
  choice: cho đến cuối cùng
  rationale: Diễn tả sự bền đỗ xuyên suốt toàn bộ tiến trình.
- source_word: βεβαίαν κατάσχωμεν
  choice: giữ vững
  rationale: Kết hợp động từ “nắm giữ, duy trì” với tính từ “vững chắc”; “giữ vững” là cách diễn đạt tự nhiên trong tiếng Việt và truyền đạt đầy đủ ý duy trì không lay chuyển.
theological_decisions:
- issue: Mệnh đề điều kiện và sự bền đỗ
  choice: Giữ nguyên một điều kiện thực sự bằng “miễn là chúng ta giữ vững…”
  alternative: Diễn giải rằng sự bền đỗ chỉ chứng minh việc đã được dự phần trước đó, hoặc rằng việc được dự phần chỉ được duy trì nhờ tiếp tục bền đỗ
  rationale: Câu Hy Lạp khẳng định một điều kiện nhưng không tự xác định cơ chế thần học giữa sự dự phần và sự bền đỗ. Bản dịch giữ nguyên sức căng đó thay vì áp đặt một hệ phái.
- issue: Quan hệ của μέτοχοι với τοῦ Χριστοῦ
  choice: được dự phần trong Đấng Christ
  alternative: bạn hữu của Đấng Christ; người cộng tác với Đấng Christ
  rationale: Sở hữu cách có thể gợi sự liên hệ hoặc chia sẻ, nhưng ngữ cảnh cứu chuộc và cấu trúc μέτοχος + sở hữu cách phù hợp nhất với ý được dự phần trong Đấng Christ, không đơn thuần là cộng tác.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Câu được tái cấu trúc nhẹ để tránh cụm danh từ thiếu tự nhiên, đồng thời chú thích giữ lại hình thức sát nguyên văn và phạm vi nghĩa của ὑπόστασις.
