- from: Vì chúng ta đã trở nên những người được dự phần trong Đấng Christ[a], miễn là chúng ta giữ vững cho đến cuối cùng niềm xác tín mình có từ ban đầu[b].
  to: Vì chúng ta đã trở nên những người dự phần trong Đấng Christ[a], nếu quả thật chúng ta giữ vững niềm xác tín ban đầu của mình cho đến cuối cùng[b].
  rationale: Bản sửa thay lối bị động không tự nhiên bằng cách diễn đạt trực tiếp cho μέτοχοι, dùng «nếu quả thật» để phản ánh lực nhấn của ἐάνπερ, và đặt lại cụm về niềm xác tín ban đầu theo tiếng Việt tự nhiên. Mệnh đề điều kiện vẫn được giữ nguyên, không quyết định trước bất cứ cách giải thích hệ phái nào về sự bền đỗ.
