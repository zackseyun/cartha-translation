  to: Vì nếu giao ước thứ nhất ấy không có gì đáng trách[a], thì đã không tìm kiếm chỗ cho một giao ước thứ hai.[b]
  rationale: Thay “đã không cần tìm” bằng “đã không tìm kiếm” để phản ánh trực tiếp hơn động từ bị động ἐζητεῖτο, đồng thời vẫn giữ cấu trúc điều kiện phản thực tự nhiên trong tiếng Việt. Các yếu tố khác và hai chú thích được giữ, chỉ chỉnh nhẹ chú thích b cho cách nói tiếng Việt trôi chảy hơn.
