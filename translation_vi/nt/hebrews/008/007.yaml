id: HEB.8.7
reference: Hebrews 8:7
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Εἰ γὰρ ἡ πρώτη ἐκείνη ἦν ἄμεμπτος, οὐκ ἂν δευτέρας ἐζητεῖτο τόπος·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/007.yaml
  text: For if that first covenant had been faultless[b][a], no place would have been sought for a second.
translation:
  language: vi
  text: Vì nếu giao ước thứ nhất ấy không có gì đáng trách[a], thì đã không tìm kiếm chỗ cho một giao ước thứ hai.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hy Lạp: “cái thứ nhất ấy”; từ “giao ước” được bổ sung theo ngữ cảnh.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “thì đã không tìm cơ hội hoặc dịp cho một giao ước thứ hai.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰ γὰρ
  choice: Vì nếu
  rationale: “Vì” giữ chức năng giải thích của γάρ, còn “nếu” thể hiện điều kiện phản thực trong lập luận.
- source_word: ἡ πρώτη ἐκείνη
  choice: giao ước thứ nhất ấy
  rationale: Nguyên văn chỉ nói “cái thứ nhất ấy”; danh từ “giao ước” được bổ sung theo ngữ cảnh trực tiếp để câu tiếng Việt rõ và tự nhiên.
- source_word: ἦν ἄμεμπτος
  choice: không có gì đáng trách
  rationale: Diễn đạt sát ý ἄμεμπτος là không có cơ sở để chê trách, đồng thời không tự giải thích bản chất hay đối tượng của khuyết điểm.
- source_word: οὐκ ἂν ... ἐζητεῖτο
  choice: thì đã không cần tìm
  rationale: Cấu trúc “đã không” truyền đạt hệ quả phản thực; “không cần tìm” diễn đạt tự nhiên ý bị động rằng sẽ không có việc tìm kiếm.
- source_word: τόπος
  choice: chỗ
  rationale: Giữ hình ảnh và độ gần với nguyên văn; trong thành ngữ này từ này cũng có thể mang nghĩa cơ hội hoặc dịp.
- source_word: δευτέρας
  choice: một giao ước thứ hai
  rationale: Bổ sung “giao ước” để tiếng Việt rõ nghĩa; “một” thể hiện tính bất định của hình thức không có mạo từ.
theological_decisions:
- issue: Có nên nói rõ danh từ “giao ước” dù nguyên văn chỉ dùng tính từ danh từ hóa
  choice: Bổ sung “giao ước” ở cả hai vế để câu tiếng Việt rõ ràng.
  alternative: “cái thứ nhất ấy” và “cái thứ hai”
  rationale: Ngữ cảnh Hê-bơ-rơ 8:6–8 xác định rõ hai giao ước đang được đối chiếu; việc bổ sung danh từ chỉ làm sáng tỏ sở chỉ, không thêm một khẳng định thần học mới.
- issue: Hàm ý về điều đáng trách ở giao ước thứ nhất
  choice: Dịch “không có gì đáng trách” mà không giải thích thêm.
  alternative: “hoàn hảo” hoặc cách diễn giải rằng lỗi thuộc về dân chúng
  rationale: Câu này duy trì chính điều kiện trong lập luận và chưa tự xác định đầy đủ bản chất của điều đáng trách; không nên giải quyết trước sự căng thẳng mà câu kế tiếp đề cập.
- issue: Sắc thái của “τόπος”
  choice: Giữ nghĩa gần mặt chữ là “chỗ” trong chính văn.
  alternative: “cơ hội” hoặc “dịp”
  rationale: “Chỗ” bảo tồn hình ảnh Hy Lạp và vẫn hiểu được trong tiếng Việt; chú thích ghi nhận nghĩa thành ngữ khả dĩ để tránh ép câu theo chỉ một cách hiểu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cấu trúc “Vì nếu… thì đã…” giữ mạch giải thích cùng sắc thái điều kiện phản thực. Các từ bổ sung theo ngữ cảnh được minh bạch hóa bằng chú thích.
