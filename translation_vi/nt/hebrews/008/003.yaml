reference: Hebrews 8:3
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: πᾶς γὰρ ἀρχιερεὺς εἰς τὸ προσφέρειν δῶρά τε καὶ θυσίας καθίσταται· ὅθεν ἀναγκαῖον ἔχειν τι καὶ τοῦτον ὃ προσενέγκῃ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/003.yaml
  text: For every high priest is appointed to offer both gifts and sacrifices[a]; therefore it is necessary for this one also to have something that he may offer.
translation:
  language: vi
  text: Vì mỗi thượng tế được bổ nhiệm để dâng cả lễ vật lẫn sinh tế; vì thế, vị này cũng cần có điều gì đó để dâng.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “vị này cũng cần có điều gì đó mà người ấy có thể dâng.” Cách diễn đạt Hy Lạp không nêu tên người được chỉ rõ; theo văn cảnh, “vị này” chỉ Chúa Giê-su với tư cách thượng tế.'
    reason: Giữ cách quy chiếu hàm ẩn của τοῦτον và ghi nhận sắc thái khả năng/mục đích của mệnh đề quan hệ ὃ προσενέγκῃ mà không biến nó thành một lời khẳng định tương lai.
lexical_decisions:
- source_word: πᾶς γὰρ ἀρχιερεὺς
  choice: Vì mỗi thượng tế
  rationale: πᾶς với danh từ số ít mang nghĩa phân phối là “mỗi”; γάρ biểu thị sự giải thích nối với câu trước; “thượng tế” là thuật ngữ tự nhiên và chính xác cho ἀρχιερεύς trong thư Hê-bơ-rơ.
- source_word: εἰς τὸ προσφέρειν
  choice: để dâng
  rationale: Cấu trúc εἰς với động từ nguyên mẫu có mạo từ diễn tả mục đích; “để dâng” truyền đạt rõ và tự nhiên.
- source_word: δῶρά τε καὶ θυσίας
  choice: cả lễ vật lẫn sinh tế
  rationale: “Cả… lẫn…” phản ánh cặp τε καὶ và giữ hai phạm trù tế tự riêng biệt. “Sinh tế” phân biệt θυσία với δῶρον mà không gộp hai thuật ngữ.
- source_word: καθίσταται
  choice: được lập lên
  rationale: Thể bị động trong ngữ cảnh chức vụ tư tế chỉ việc được đặt vào chức vụ; “được lập lên” trang trọng, tự nhiên và không diễn giải quá mức.
- source_word: ὅθεν
  choice: do đó
  rationale: ὅθεν đưa ra hệ luận từ mệnh đề trước; “do đó” thể hiện rõ quan hệ suy luận.
- source_word: ἀναγκαῖον ἔχειν
  choice: cần phải có
  rationale: Diễn đạt trực tiếp ý nghĩa tất yếu của cấu trúc Hy Lạp bằng tiếng Việt hiện đại.
- source_word: τι
  choice: một thứ gì đó
  rationale: Giữ tính bất định của đại từ τι, chỉ một vật dâng chưa được xác định.
- source_word: καὶ τοῦτον
  choice: vị này cũng
  rationale: “Vị này” giữ lực chỉ định của τοῦτον và phù hợp với nhân vật mang chức thượng tế; “cũng” phản ánh καί, trong khi không tự ý đưa tên Chúa Giê-su vào chính văn.
- source_word: ὃ προσενέγκῃ
  choice: để dâng
  rationale: Trong quan hệ với τι, đại từ quan hệ cùng động từ aorist subjunctive chỉ điều có thể hoặc nhằm được dâng; tiếng Việt tự nhiên dùng “để dâng”, còn chú thích ghi nhận cách diễn đạt sát cấu trúc hơn.
theological_decisions:
- issue: Đối tượng được chỉ bởi τοῦτον (“vị này”)
  choice: Giữ “vị này” trong chính văn; theo văn cảnh, từ này chỉ Chúa Giê-su trong vai trò thượng tế.
  alternative: Nêu thẳng “Chúa Giê-su” hoặc “Đấng Christ” trong chính văn.
  rationale: Ngữ cảnh xác định đối tượng, nhưng nguyên văn chỉ dùng đại từ chỉ định. Giữ cách nói gián tiếp bảo toàn hình thức và sự hàm ẩn của bản Hy Lạp, tránh thêm tên riêng.
- issue: Hai thuật ngữ tế tự δῶρα và θυσίαι
  choice: Giữ riêng “lễ vật” và “sinh tế”.
  alternative: Gộp thành “các lễ vật hiến tế” hoặc dùng “lễ vật và của lễ”.
  rationale: Tác giả nêu hai phạm trù tư tế phân biệt. Không nên mở rộng câu này thành lời giải thích thần học về sự tự hiến của Đấng Christ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “thượng tế” nhất quán cho chức vụ ἀρχιερεύς; “sinh tế” giữ sắc thái tế tự và phân biệt với “lễ vật”. Dấu chú thích [a] được đặt ngay sau mệnh đề liên quan.
