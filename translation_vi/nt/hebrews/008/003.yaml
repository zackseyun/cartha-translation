revisions:
- from: Vì mỗi thượng tế được lập lên để dâng cả lễ vật lẫn sinh tế; do đó, vị này cũng cần phải có một thứ gì đó để dâng.[a]
  to: Vì mỗi thượng tế được bổ nhiệm để dâng cả lễ vật lẫn sinh tế; vì thế, vị này cũng cần có điều gì đó để dâng.[a]
  rationale: Chỉnh nhẹ để diễn đạt tự nhiên hơn trong tiếng Việt hiện đại và để chú thích không làm hẹp sắc thái của động từ nguyên văn. Ý nghĩa, tính hàm ẩn về nhân vật được chỉ, và sự phân biệt giữa hai thuật ngữ tế tự đều được giữ nguyên.
