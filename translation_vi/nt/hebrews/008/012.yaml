revisions:
- from: Vì Ta sẽ tỏ lòng thương xót đối với những việc bất chính của họ,[a] và Ta sẽ không còn nhớ đến tội lỗi của họ nữa.[b]
  to: Vì Ta sẽ khoan dung đối với những việc bất chính của họ,[a] và Ta sẽ không còn nhớ đến tội lỗi của họ nữa.[b]
  rationale: Sửa tối thiểu để giải quyết sự gượng về cách kết hợp từ trong tiếng Việt, đồng thời giữ nguyên nội dung, số nhiều của các hành vi bất chính, hình ảnh “không còn nhớ”, và lực phủ định nhấn mạnh của nguyên văn. Chú thích được điều chỉnh nhãn mô tả, không thay đổi ý nghĩa hay áp đặt một lập trường giáo phái.
  reviewer_model: gpt-5.6-terra
