  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὅτι ἵλεως ἔσομαι ταῖς ἀδικίαις αὐτῶν, καὶ τῶν ἁμαρτιῶν ⸀αὐτῶν οὐ μὴ μνησθῶ ἔτι.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/012.yaml
  text: For I will be merciful toward their unrighteousness[b][a], and I will remember their sins no more.
translation:
  language: vi
  text: Vì Ta sẽ khoan dung đối với những việc bất chính của họ,[a] và Ta sẽ không còn nhớ đến tội lỗi của họ nữa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đối với những điều bất công của họ.” Từ Hy Lạp ἀδικίαις có thể chỉ sự bất chính, những việc làm sai trái hoặc những hành vi bất công; ở đây dạng số nhiều có thể hướng đến các hành vi cụ thể.'
    reason: lexical_alternative
  - marker: b
    text: 'Diễn đạt sát ý: “Ta chắc chắn sẽ không còn nhớ đến tội lỗi của họ nữa.” Đây là cách nói trong bối cảnh giao ước về sự tha thứ trọn vẹn, không nhất thiết có nghĩa là Đức Chúa Trời không còn biết các tội ấy.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Vì
  rationale: Giữ chức năng giải thích hoặc nêu lý do của ὅτι trong lời trích dẫn giao ước, đồng thời tự nhiên trong tiếng Việt.
- source_word: ἵλεως ἔσομαι
  choice: Ta sẽ tỏ lòng thương xót
  rationale: Diễn đạt khuynh hướng nhân từ, khoan dung của ἵλεως bằng tiếng Việt hiện đại, rõ nghĩa, không dùng thuật ngữ thần học quá chuyên biệt.
- source_word: ταῖς ἀδικίαις αὐτῶν
  choice: đối với những việc bất chính của họ
  rationale: Giữ quan hệ của cách dữ sau ἵλεως bằng “đối với”; số nhiều ἀδικίαις được diễn đạt như những hành vi hay việc làm sai trái cụ thể, đồng thời vẫn giữ sắc thái đạo đức của “bất chính”.
- source_word: καὶ
  choice: và
  rationale: Liên từ phối hợp đơn giản được chuyển dịch trực tiếp.
- source_word: τῶν ἁμαρτιῶν αὐτῶν
  choice: tội lỗi của họ
  rationale: ἁμαρτίαι là số nhiều nhưng tiếng Việt thường dùng danh từ tập hợp “tội lỗi”; cách diễn đạt này tự nhiên mà không làm mất ý chỉ các tội của họ.
- source_word: οὐ μὴ μνησθῶ ἔτι
  choice: Ta sẽ không còn nhớ đến ... nữa
  rationale: Cấu trúc “không còn ... nữa” diễn đạt tự nhiên cả sự phủ định mạnh của οὐ μή lẫn ý “không còn/không tiếp tục” của ἔτι, đồng thời giữ nguyên hình ảnh Kinh Thánh về việc không ghi nhớ tội lỗi.
theological_decisions:
- issue: Ý nghĩa của việc Đức Chúa Trời không còn nhớ đến tội lỗi
  choice: Giữ nguyên thành ngữ giao ước “không còn nhớ đến ... nữa”, hàm ý tha thứ dứt khoát và không còn quy tội
  alternative: Hiểu theo nghĩa đen rằng Đức Chúa Trời không còn biết hoặc đã quên các tội ấy
  rationale: Bản dịch giữ nguyên sức căng và hình ảnh của nguyên văn trong câu chính, không thay bằng lời diễn giải giáo lý. Chú thích chỉ làm rõ rằng trong ngữ cảnh giao ước, đây là ngôn ngữ về sự tha thứ chứ không phải lời khẳng định về giới hạn nhận thức của Đức Chúa Trời.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “Ta” phù hợp với lời phán trực tiếp của Đức Chúa Trời. Cụm “tỏ lòng thương xót đối với” hơi trang trọng nhưng giữ được cấu trúc và sắc thái của nguyên văn mà không thu hẹp ἵλεως thành riêng động tác “tha thứ”.
