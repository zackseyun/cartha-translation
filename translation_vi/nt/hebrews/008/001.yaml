revisions:
- from: 'Điểm chính trong những điều đang được nói đến là thế này: chúng ta có một thượng tế như thế[a], là Đấng đã ngồi bên phải ngai của Đấng Uy Nghi trên các tầng trời[b],'
  to: 'Điểm chính trong những điều đang được nói đến là thế này: chúng ta có một thượng tế như thế[a], là Đấng đã ngồi xuống bên phải ngai của Đấng Uy Nghi trên các tầng trời[b],'
  rationale: Chỉ thay “đã ngồi” bằng “đã ngồi xuống” để phản ánh rõ hơn hành động hoàn tất của ἐκάθισεν. Các lựa chọn khác được giữ vì vừa trung thành với nguyên văn vừa phù hợp văn phong Việt ngữ trang trọng.
