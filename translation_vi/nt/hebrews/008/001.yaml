id: HEB.8.1
reference: Hebrews 8:1
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Κεφάλαιον δὲ ἐπὶ τοῖς λεγομένοις, τοιοῦτον ἔχομεν ἀρχιερέα, ὃς ἐκάθισεν ἐν δεξιᾷ τοῦ θρόνου τῆς μεγαλωσύνης ἐν τοῖς οὐρανοῖς,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/001.yaml
  text: 'The main point in what is being said is this: we have such a high priest[a], who sat down at the right hand of the throne of the Majesty in the heavens[b],'
translation:
  language: vi
  text: 'Điểm chính trong những điều đang được nói đến là thế này: chúng ta có một thượng tế như thế[a], là Đấng đã ngồi xuống bên phải ngai của Đấng Uy Nghi trên các tầng trời[b],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Điểm chính” cũng có thể dịch là “điều cốt yếu” hoặc “tóm lại”.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “trên trời”; nguyên văn Hy Lạp dùng dạng số nhiều, “trên các tầng trời”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Κεφάλαιον
  choice: Điểm chính
  rationale: Trong ngữ cảnh chuyển ý của lập luận, từ này chỉ điểm chủ yếu hay phần cốt yếu, không phải nghĩa đen là “chương”.
- source_word: δὲ
  choice: không dịch thành một từ riêng
  rationale: δέ đánh dấu sự chuyển ý nhẹ; cấu trúc “Điểm chính... là thế này” đã diễn đạt tự nhiên chức năng ấy trong tiếng Việt mà không cần thêm “bây giờ”.
- source_word: ἐπὶ τοῖς λεγομένοις
  choice: trong những điều đang được nói đến
  rationale: Giữ sắc thái hiện tại và bị động của cụm Hy Lạp, đồng thời diễn đạt tự nhiên nội dung đang được bàn luận.
- source_word: τοιοῦτον ἔχομεν ἀρχιερέα
  choice: chúng ta có một thượng tế như thế
  rationale: Giữ đại từ ngôi thứ nhất số nhiều, ý sở hữu trực tiếp và sắc thái hồi chỉ của τοιοῦτον về vị thượng tế đã được mô tả.
- source_word: ἐκάθισεν
  choice: đã ngồi
  rationale: Diễn đạt hành động đã hoàn tất mà không bổ sung cách giải thích thần học về sự hoàn tất công việc tế lễ.
- source_word: ἐν δεξιᾷ
  choice: bên phải
  rationale: Cách nói tự nhiên trong tiếng Việt, giữ hình ảnh về vị trí danh dự và thẩm quyền.
- source_word: τῆς μεγαλωσύνης
  choice: Đấng Uy Nghi
  rationale: Giữ lối gọi kính cẩn và gián tiếp về Đức Chúa Trời, thay vì thay thế bằng danh xưng trực tiếp không có trong nguyên văn.
- source_word: ἐν τοῖς οὐρανοῖς
  choice: trên các tầng trời
  rationale: Giữ dạng số nhiều của nguyên văn Hy Lạp và dùng cách diễn đạt trang trọng, dễ hiểu trong tiếng Việt.
theological_decisions:
- issue: Có nên nói rõ Đấng Uy Nghi là Đức Chúa Trời hay không
  choice: Giữ lối gọi gián tiếp “Đấng Uy Nghi”.
  alternative: ngai của Đức Chúa Trời
  rationale: Nguyên văn dùng μεγαλωσύνη chứ không dùng θεός; bản dịch không nên làm rõ hơn điều tác giả diễn đạt gián tiếp.
- issue: Có nên mở rộng ἐκάθισεν để nhấn mạnh công việc tế lễ đã hoàn tất hay không
  choice: Dịch đơn giản là “đã ngồi”.
  alternative: đã ngự vào chỗ trong chiến thắng sau khi hoàn tất công việc
  rationale: Ý nghĩa thần học rộng hơn có thể nảy sinh từ văn mạch, nhưng không nên được thêm trực tiếp vào câu dịch.
- issue: Cách hiểu κεφάλαιον là điểm chính hay bản tóm lược
  choice: Dùng “Điểm chính”.
  alternative: Điều cốt yếu; tóm lại
  rationale: Từ này có thể mang sắc thái điểm chủ yếu hoặc phần tổng kết; “Điểm chính” phù hợp nhất với chức năng chuyển sang khẳng định trọng tâm, còn phương án khác được ghi chú.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “thượng tế” cho ἀρχιερεύς và viết hoa “Đấng Uy Nghi” để thể hiện danh xưng kính cẩn. Giữ dấu phẩy cuối câu vì câu Hy Lạp tiếp tục sang đơn vị kế tiếp.
