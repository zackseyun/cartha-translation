- from: Nhưng nay, Đức Chúa Jêsus đã nhận được một chức vụ cao trọng hơn, vì Ngài cũng là Đấng Trung Gian của một giao ước tốt hơn[a], là giao ước đã được lập trên những lời hứa tốt hơn[b].
  to: Nhưng hiện nay, Chúa Giê-su đã nhận được một chức vụ cao trọng hơn bao nhiêu, thì Ngài cũng là Đấng Trung Gian của một giao ước tốt hơn bấy nhiêu, là giao ước đã được thiết lập trên những lời hứa tốt hơn[a].
  rationale: 'Sửa cấu trúc chính để tái hiện quan hệ so sánh ὅσῳ ... κρείττονος ...: chức vụ cao trọng hơn tương ứng với giao ước tốt hơn mà Chúa Giê-su làm trung gian. Đổi cách viết tên sang dạng tiếng Việt hiện đại. Gộp hai chú thích cũ vào một chú thích gắn sau “giao ước” để chú thích vừa neo đúng từ διαθήκη vừa nêu sắc thái pháp lý của νενομοθέτηται; không có thay đổi ý nghĩa.'
