id: HEB.8.6
reference: Hebrews 8:6
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸀νυνὶ δὲ διαφορωτέρας τέτυχεν λειτουργίας, ὅσῳ καὶ κρείττονός ἐστιν διαθήκης μεσίτης, ἥτις ἐπὶ κρείττοσιν ἐπαγγελίαις νενομοθέτηται.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/006.yaml
  text: But as it is[a], he has obtained a more excellent ministry, by as much as he is also the mediator of a better covenant[c][b], which has been enacted on better promises.
translation:
  language: vi
  text: Nhưng hiện nay, Chúa Giê-su đã nhận được một chức vụ cao trọng hơn bao nhiêu, thì Ngài cũng là Đấng Trung Gian của một giao ước tốt hơn bấy nhiêu, là giao ước đã được thiết lập trên những lời hứa tốt hơn[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hy Lạp cũng có thể mang nghĩa “di chúc” trong một số ngữ cảnh; tại đây, “giao ước” phù hợp với lời hứa về giao ước mới trong sách Giê-rê-mi được trích ở các câu tiếp theo. Động từ “đã được thiết lập” cũng có thể dịch là “đã được ban hành thành luật dựa trên những lời hứa tốt hơn.”
    reason: alternative_reading; lexical_alternative
lexical_decisions:
- source_word: νυνὶ δὲ
  choice: Nhưng nay
  rationale: Giữ cả sắc thái tương phản của δὲ và ý nghĩa thời điểm hiện tại của νυνί, đồng thời tự nhiên trong tiếng Việt.
- source_word: διαφορωτέρας
  choice: cao trọng hơn
  rationale: Diễn đạt sự vượt trội về phẩm chất của chức vụ trong văn phong trang trọng, dễ hiểu; không chỉ nói rằng chức vụ ấy khác biệt.
- source_word: τέτυχεν
  choice: đã nhận được
  rationale: Thể hoàn thành Hy Lạp chỉ một việc đã xảy ra với kết quả còn hiệu lực; cách dịch này tự nhiên và giữ ý Đức Chúa Jêsus hiện đang có chức vụ ấy.
- source_word: λειτουργίας
  choice: chức vụ
  rationale: Trong ngữ cảnh, từ này chỉ sự phục vụ thánh và mang tính tư tế. “Chức vụ” rõ ràng mà không thêm từ “tư tế” vốn đã được ngữ cảnh xác định.
- source_word: ὅσῳ καὶ
  choice: vì ... cũng
  rationale: Trong câu này, cấu trúc so sánh nêu nền tảng và mức độ vượt trội của chức vụ qua giao ước tốt hơn. Cách diễn đạt này tự nhiên trong tiếng Việt, dù sắc thái tỷ lệ được thể hiện hàm ẩn.
- source_word: κρείττονός ... διαθήκης
  choice: của một giao ước tốt hơn
  rationale: “Tốt hơn” duy trì từ khóa so sánh lặp lại trong thư Hê-bơ-rơ; “giao ước” phù hợp với lời hứa về giao ước mới trong Giê-rê-mi được trích ngay sau đó.
- source_word: μεσίτης
  choice: Đấng Trung Gian
  rationale: Thuật ngữ chính xác cho người đứng giữa các bên trong quan hệ giao ước. Viết hoa theo lối xưng gọi tôn kính dành cho Đức Chúa Jêsus.
- source_word: ἥτις
  choice: là giao ước
  rationale: Nhắc lại danh từ quy chiếu để mệnh đề quan hệ rõ ràng và tự nhiên trong tiếng Việt, không thêm một khẳng định thần học ngoài nguyên văn.
- source_word: ἐπὶ κρείττοσιν ἐπαγγελίαις
  choice: trên những lời hứa tốt hơn
  rationale: Giữ hình ảnh các lời hứa làm nền tảng của giao ước và bảo toàn sự lặp lại của từ “tốt hơn”.
- source_word: νενομοθέτηται
  choice: đã được lập
  rationale: Thể hoàn thành bị động cho biết giao ước đã được chính thức thiết lập và vẫn có hiệu lực. “Được lập” tự nhiên hơn “được ban hành thành luật” trong tiếng Việt, trong khi chú thích lưu giữ sắc thái pháp lý.
theological_decisions:
- issue: Cách dịch διαθήκη trong Hê-bơ-rơ 8:6
  choice: giao ước
  alternative: di chúc
  rationale: Mạch văn trực tiếp hướng đến giao ước mới trong Giê-rê-mi và vai trò trung gian của Đức Chúa Jêsus; “giao ước” phản ánh đúng bối cảnh Kinh Thánh hơn, còn “di chúc” sẽ làm mờ liên hệ ấy.
- issue: Chủ thể hàm ẩn của τέτυχεν
  choice: Đức Chúa Jêsus
  alternative: Ngài
  rationale: Động từ Hy Lạp không nêu lại chủ ngữ, nhưng chủ thể theo mạch văn là Đức Chúa Jêsus. Nêu danh xưng giúp câu đứng riêng rõ nghĩa mà không thay đổi nội dung.
- issue: Sắc thái pháp lý của νενομοθέτηται
  choice: đã được lập
  alternative: đã được ban hành thành luật
  rationale: Bản dịch chính ưu tiên cách nói tự nhiên nhưng vẫn cho thấy việc thiết lập chính thức; chú thích nêu khả năng dịch mang sắc thái pháp lý rõ hơn.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “Đức Chúa Jêsus” và “Ngài” theo văn phong Kinh Thánh Tin Lành quen thuộc; giữ hai lần “tốt hơn” để phản ánh phép lập luận so sánh của nguyên văn. Các dấu chú thích [a], [b] đều xuất hiện trong chính văn.
