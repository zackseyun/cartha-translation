  source_fidelity: 'Bản dịch truyền đạt đúng cấu trúc và nội dung chính của bản Hy Lạp: giao ước với tổ phụ, hình ảnh nắm tay khi đưa ra khỏi đất Ai Cập, sự thất tín của dân, và việc Chúa không đoái đến họ. Tuy nhiên, “không giữ lòng trung thành với” diễn giải ἐνέμειναν (tiếp tục/kiên trì ở trong) hơi xa hơn cần thiết. “Không tiếp tục giữ giao ước” giữ rõ hơn ý bền đỗ trong giao ước mà vẫn tự nhiên trong tiếng Việt.'
