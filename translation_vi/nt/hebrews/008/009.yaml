id: HEB.8.9
reference: Hebrews 8:9
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οὐ κατὰ τὴν διαθήκην ἣν ἐποίησα τοῖς πατράσιν αὐτῶν ἐν ἡμέρᾳ ἐπιλαβομένου μου τῆς χειρὸς αὐτῶν ἐξαγαγεῖν αὐτοὺς ἐκ γῆς Αἰγύπτου, ὅτι αὐτοὶ οὐκ ἐνέμειναν ἐν τῇ διαθήκῃ μου, κἀγὼ ἠμέλησα αὐτῶν, λέγει κύριος.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/009.yaml
  text: not like the covenant that I made with their fathers on the day when I took hold of their hand to bring them out of the land of Egypt[a], because they did not continue in my covenant, and I disregarded them[b], says the Lord.
translation:
  language: vi
  text: không giống như giao ước Ta đã lập với tổ phụ của họ vào ngày Ta nắm lấy tay họ để đưa họ ra khỏi đất Ai Cập[a], vì họ đã không tiếp tục giữ giao ước của Ta, còn Ta thì không đoái đến họ[b], Chúa phán.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch theo lối thành ngữ: “Ta dắt tay họ.”'
    reason: lexical_alternative
  - marker: b
    text: 'Lời trích ở đây theo cách diễn đạt Hy Lạp được phản ánh trong thư Hê-bơ-rơ: “Ta không đoái đến họ.” Bản văn Hê-bơ-rơ của Giê-rê-mi 31:32 mang một nghĩa khác, thường được dịch là “dù Ta là chồng của họ” hoặc “dù Ta là chủ của họ.”'
    reason: alternative_reading
lexical_decisions:
- source_word: διαθήκην
  choice: giao ước
  rationale: Trong thư Hê-bơ-rơ và lời trích Giê-rê-mi 31, từ này chỉ mối quan hệ giao ước do Đức Chúa Trời thiết lập; “giao ước” vừa chính xác vừa quen thuộc trong tiếng Việt.
- source_word: ἐποίησα
  choice: đã lập
  rationale: Cụm “lập giao ước” là cách diễn đạt tự nhiên, trang trọng trong tiếng Việt và tương ứng với ποιέω dùng cùng διαθήκη.
- source_word: τοῖς πατράσιν αὐτῶν
  choice: với tổ phụ của họ
  rationale: Chỉ các bậc cha ông nam giới của dân Israel; “tổ phụ” giữ được sắc thái lịch sử và giới tính của từ Hy Lạp.
- source_word: ἐν ἡμέρᾳ
  choice: vào ngày
  rationale: Giữ hình thức thời gian cụ thể của nguyên văn, đồng thời tự nhiên trong tiếng Việt.
- source_word: ἐπιλαβομένου μου τῆς χειρὸς αὐτῶν
  choice: Ta nắm lấy tay họ
  rationale: Giữ hình ảnh số ít “tay” trong nguyên văn và thể hiện hành động Đức Chúa Trời đích thân dẫn dắt dân.
- source_word: ἐξαγαγεῖν
  choice: để đưa họ ra
  rationale: Diễn đạt tự nhiên cả ý đưa ra khỏi một nơi lẫn hình ảnh dẫn dắt gắn với việc nắm tay.
- source_word: γῆς Αἰγύπτου
  choice: đất Ai Cập
  rationale: Giữ rõ γῆς, thay vì rút gọn thành chỉ “Ai Cập”.
- source_word: οὐκ ἐνέμειναν ἐν τῇ διαθήκῃ μου
  choice: đã không giữ lòng trung thành với giao ước của Ta
  rationale: ἐμμένω ở đây nói đến việc tiếp tục gắn bó và trung thành trong giao ước; cách dịch này tự nhiên hơn “không tiếp tục ở trong” nhưng không thêm ý ngoài bối cảnh.
- source_word: κἀγὼ
  choice: còn Ta thì
  rationale: Phản ánh “và Ta” trong thế đối ứng với hành động của họ, không biến liên từ thành một kết luận nhân quả mạnh hơn nguyên văn.
- source_word: ἠμέλησα αὐτῶν
  choice: Ta không đoái đến họ
  rationale: Diễn đạt ý không quan tâm, không lưu tâm đến; trang trọng và phù hợp sắc thái quan hệ, nhưng không tăng mạnh thành “ruồng bỏ”.
- source_word: λέγει κύριος
  choice: Chúa phán
  rationale: Công thức trích dẫn được chuyển sang lối diễn đạt trang trọng, tự nhiên trong văn Kinh Thánh tiếng Việt.
theological_decisions:
- issue: Ý nghĩa của ἠμέλησα αὐτῶν trong lời trích Giê-rê-mi 31:32, nơi bản Hy Lạp và bản Hê-bơ-rơ có khác biệt
  choice: Ta không đoái đến họ
  alternative: dù Ta là chồng/chủ của họ
  rationale: Bản văn Hy Lạp của Hê-bơ-rơ rõ ràng dùng ἠμέλησα αὐτῶν, mang nghĩa không quan tâm hoặc không đoái đến. Bản dịch theo chính văn Hê-bơ-rơ, còn dị biệt quan trọng trong văn bản Hê-bơ-rơ của Giê-rê-mi được giữ ở chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “Ta” giữ giọng phán trực tiếp của Đức Chúa Trời; “tổ phụ” duy trì sắc thái lịch sử. Hai chú thích bảo tồn hình ảnh nguyên văn và khác biệt liên văn bản mà không áp đặt cách giải thích giáo phái.
