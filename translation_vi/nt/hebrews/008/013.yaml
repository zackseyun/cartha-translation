  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐν τῷ λέγειν Καινὴν πεπαλαίωκεν τὴν πρώτην, τὸ δὲ παλαιούμενον καὶ γηράσκον ἐγγὺς ἀφανισμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/013.yaml
  text: By saying[a], “new,” he has made the first obsolete[c][b]. And what is becoming obsolete and growing old is near to disappearing.
translation:
  language: vi
  text: Khi nói “mới”[a], Ngài đã làm cho giao ước thứ nhất trở nên lỗi thời[b]. Còn điều đang trở nên lỗi thời và già đi thì sắp biến mất[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Bằng việc nói” hoặc “Trong khi nói”. Từ “mới” nhắc lại cụm từ “giao ước mới” trong lời trích ở Hê-bơ-rơ 8:8.'
    reason: lexical_alternative; cross_reference
  - marker: b
    text: Theo ngữ cảnh, “giao ước thứ nhất” là giao ước được đối chiếu với “giao ước mới.”
    reason: referent_clarification
  - marker: c
    text: 'Cũng có thể dịch: “gần tiêu tan” hoặc “sắp tan biến”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τῷ λέγειν
  choice: Khi nói
  rationale: Cấu trúc ἐν với động từ nguyên mẫu có mạo từ diễn tả hoàn cảnh, và cũng có thể hàm ý phương tiện. “Khi nói” tự nhiên trong tiếng Việt, vẫn giữ chủ thể hàm ẩn và nối trực tiếp với lời trích dẫn trước đó.
- source_word: Καινὴν
  choice: “mới”
  rationale: Tính từ đứng độc lập, nhắc lại cách nói “giao ước mới” trong lời trích Giê-rê-mi-a. Chỉ dịch “mới” bảo toàn lối nói tỉnh lược của tiếng Hy Lạp.
- source_word: πεπαλαίωκεν
  choice: đã làm cho ... trở nên lỗi thời
  rationale: Thì hoàn thành chỉ hành động đã xảy ra với kết quả còn hiệu lực. “Trở nên lỗi thời” truyền đạt ý không còn thích hợp trong trật tự mới rõ hơn cách dịch sát chữ “làm cũ”.
- source_word: τὴν πρώτην
  choice: điều thứ nhất
  rationale: Tính từ được dùng như danh từ và theo ngữ cảnh chỉ giao ước thứ nhất. “Điều thứ nhất” không thêm danh từ vốn không có trong câu, dù tiếng Việt cần một từ đỡ để diễn đạt tự nhiên.
- source_word: τὸ ... παλαιούμενον
  choice: điều gì đang trở nên lỗi thời
  rationale: Phân từ hiện tại nhấn mạnh một tiến trình đang diễn ra; cách dịch này giữ được sắc thái tiến triển.
- source_word: γηράσκον
  choice: già cũ
  rationale: Giữ hình ảnh lão hóa bổ sung cho ý trở nên lỗi thời, đồng thời phù hợp văn phong trang trọng, dễ hiểu.
- source_word: ἐγγὺς ἀφανισμοῦ
  choice: gần biến mất
  rationale: Cụm từ diễn tả sự gần kề với việc không còn hiện diện. “Gần biến mất” ngắn gọn, tự nhiên và không đẩy nghĩa sang “hủy diệt”.
theological_decisions:
- issue: Chủ thể hàm ẩn của λέγειν và πεπαλαίωκεν
  choice: Dùng “Ngài” nhưng không nêu rõ là Đức Chúa Trời hay Kinh Thánh
  alternative: Đức Chúa Trời phán; Kinh Thánh nói
  rationale: Ngữ cảnh lời trích dẫn cho thấy một Đấng đang phán, nhưng câu Hy Lạp không nêu danh. “Ngài” giúp câu tiếng Việt rõ chủ thể mà không xác định thêm ngoài văn bản.
- issue: Tình trạng của điều thứ nhất
  choice: đã làm cho điều thứ nhất trở nên lỗi thời
  alternative: đã làm cũ điều thứ nhất
  rationale: Cách dịch phản ánh sức nặng của sự tương phản giữa giao ước mới và điều thứ nhất, nhưng không mở rộng thành một tuyên bố giáo lý vượt quá lập luận trong câu.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Giữ lối nói tỉnh lược “mới” và “điều thứ nhất”, đồng thời dùng các dấu chú thích [a], [b], [c] ngay trong chính văn.
