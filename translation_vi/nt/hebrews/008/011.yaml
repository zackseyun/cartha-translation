revisions:
- from: 'Không ai trong họ còn phải dạy người đồng hương mình[a], cũng không ai phải dạy anh em mình rằng: ‘Hãy nhận biết Chúa,’ vì tất cả họ sẽ biết Ta, từ người nhỏ nhất đến người lớn nhất trong họ.'
  to: 'Sẽ không ai dạy người đồng bào mình[a], cũng không ai dạy anh em mình rằng: ‘Hãy nhận biết Chúa,’ vì tất cả họ sẽ biết Ta, từ người nhỏ nhất đến người lớn nhất trong số họ.'
  rationale: Bản sửa loại bỏ ý nghĩa vụ và tính ‘không còn’ không được nêu trực tiếp trong tiếng Hy Lạp, đồng thời giữ lực phủ định tương lai bằng «Sẽ không ai». «Người đồng bào» thay cho «người đồng hương» để phản ánh chính xác hơn πολίτην. Các yếu tố thần học và ngôi xưng hô của câu trích dẫn được giữ nguyên.
  reviewer_model: gpt-5.6-terra
