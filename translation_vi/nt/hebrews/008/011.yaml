review_pass:
  verdict: revise
  source_fidelity: Bản nháp giữ được cấu trúc song hành, mệnh lệnh «Hãy nhận biết Chúa», sự chuyển từ «Chúa» sang «Ta», và phạm vi «từ người nhỏ nhất đến người lớn nhất». Tuy nhiên, «còn phải dạy» chuyển lời phủ định nhấn mạnh về hành động dạy (οὐ μὴ διδάξωσιν) thành ý không còn nghĩa vụ/cần thiết phải dạy, đồng thời thêm sắc thái «còn». «Người đồng hương» thường chỉ người cùng quê/quán hơn là người cùng tư cách công dân (πολίτης).
  naturalness: Câu sửa dưới đây vẫn dùng văn phong hiện đại, trang trọng. «Sẽ không ai ... cũng không ai ...» là tự nhiên trong tiếng Việt và phản ánh hai mệnh đề phân phối song hành mà không thêm ý nghĩa vụ.
  terminology: Giữ «Chúa» cho κύριον, «anh em» cho ἀδελφόν, và «Ta» cho με trong lời phán trích dẫn. «Người đồng bào» phù hợp với ý «fellow citizen» hơn «người đồng hương»; chú thích vẫn nêu phương án «người lân cận» theo cách dịch quen thuộc của Giê-rê-mi.
  issues:
  - severity: medium
    issue: «còn phải dạy» thêm sắc thái nghĩa vụ và tính ‘không còn’.
    rationale: οὐ μή với giả định aorist là phủ định nhấn mạnh về việc dạy, không trực tiếp nói đến nghĩa vụ phải dạy. Cần dịch là phủ định tương lai mạnh mà không chèn «phải».
  - severity: medium
    issue: «người đồng hương» không chính xác nhất cho πολίτην.
    rationale: Trong tiếng Việt hiện đại, «đồng hương» chủ yếu là người cùng quê; πολίτης chỉ người cùng cộng đồng công dân. «Người đồng bào» gần nghĩa hơn trong một cách diễn đạt tự nhiên.
  revised_text: 'Sẽ không ai dạy người đồng bào mình[a], cũng không ai dạy anh em mình rằng: ‘Hãy nhận biết Chúa,’ vì tất cả họ sẽ biết Ta, từ người nhỏ nhất đến người lớn nhất trong số họ.'
