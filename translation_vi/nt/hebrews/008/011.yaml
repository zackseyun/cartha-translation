id: HEB.8.11
reference: Hebrews 8:11
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ οὐ μὴ διδάξωσιν ἕκαστος τὸν πολίτην αὐτοῦ καὶ ἕκαστος τὸν ἀδελφὸν αὐτοῦ, λέγων· Γνῶθι τὸν κύριον, ὅτι πάντες εἰδήσουσίν με ἀπὸ ⸀μικροῦ ἕως μεγάλου αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/011.yaml
  text: And they will certainly not teach[a], each one his fellow citizen and each one his brother, saying, ‘Know the Lord,’ because they will all know me, from the least of them to the greatest.
translation:
  language: vi
  text: 'Sẽ không ai dạy người đồng bào mình[a], cũng không ai dạy anh em mình rằng: ‘Hãy nhận biết Chúa,’ vì tất cả họ sẽ biết Ta, từ người nhỏ nhất đến người lớn nhất trong số họ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “người lân cận”. Bản Hy Lạp của Hê-bơ-rơ dùng từ có nghĩa là “người cùng cộng đồng công dân”, còn đoạn tương ứng trong Giê-rê-mi thường được dịch là “người lân cận”.
    reason: alternative_reading
lexical_decisions:
- source_word: οὐ μὴ διδάξωσιν
  choice: Không ai trong họ còn phải dạy... cũng không ai phải dạy
  rationale: Cấu trúc οὐ μή với động từ ở thể giả định aorist là lời phủ định mạnh. Trong tiếng Việt, “không ai... còn phải” diễn đạt tự nhiên việc điều ấy chắc chắn không còn cần xảy ra trong bối cảnh giao ước.
- source_word: ἕκαστος
  choice: không ai trong họ... cũng không ai
  rationale: Cách diễn đạt này bảo toàn sắc thái phân phối “mỗi người” nhưng tránh câu tiếng Việt nặng và thiếu tự nhiên như “mỗi người sẽ chắc chắn không dạy”.
- source_word: πολίτην
  choice: người đồng hương
  rationale: πολίτης chỉ người cùng cộng đồng công dân. “Người đồng hương” vừa dễ hiểu trong tiếng Việt hiện đại vừa giữ được nét nghĩa cộng đồng rõ hơn “người lân cận”; phương án quen thuộc từ Giê-rê-mi được ghi ở chú thích.
- source_word: ἀδελφὸν
  choice: anh em
  rationale: Giữ hình ảnh thân tộc của danh từ giống đực số ít ἀδελφός. “Anh em mình” là cách nói tự nhiên, trang trọng trong tiếng Việt và không thay thế hình ảnh ấy bằng thuật ngữ diễn giải như “người cùng đức tin”.
- source_word: Γνῶθι
  choice: Hãy nhận biết
  rationale: Mệnh lệnh aorist kêu gọi người nghe biết hay nhận biết Chúa. “Hãy nhận biết” tự nhiên và có sắc thái quan hệ thích hợp hơn câu rút gọn “Hãy biết” trong tiếng Việt.
- source_word: κύριον
  choice: Chúa
  rationale: “Chúa” là cách dịch chuẩn, trang trọng của κύριος trong ngữ cảnh giao ước và lời trích dẫn Kinh Thánh.
- source_word: πάντες εἰδήσουσίν με
  choice: tất cả họ sẽ biết Ta
  rationale: Giữ đầy đủ πάντες, động từ chỉ sự biết và đại từ ngôi thứ nhất με. Viết “Ta” để thể hiện lời Đức Chúa Trời đang phán trong phần trích dẫn.
- source_word: ἀπὸ μικροῦ ἕως μεγάλου αὐτῶν
  choice: từ người nhỏ nhất đến người lớn nhất trong họ
  rationale: Giữ hình thức đối xứng của nguyên văn và phạm vi bao quát toàn thể cộng đồng, không thu hẹp ý nghĩa chỉ vào tuổi tác hoặc địa vị.
theological_decisions:
- issue: Cách dịch πολίτην trong lời trích dẫn Giê-rê-mi 31:34
  choice: người đồng hương
  alternative: người lân cận
  rationale: Bản Hy Lạp hiện còn của Hê-bơ-rơ dùng πολίτης, nghĩa là người cùng cộng đồng công dân, nên bản chính phản ánh từ ngữ đó. “Người lân cận” quen thuộc hơn theo đoạn Giê-rê-mi và được giữ trong chú thích.
- issue: Ngôn ngữ thân tộc có giống trong ἀδελφόν
  choice: anh em mình
  alternative: anh chị em mình; người cùng đức tin
  rationale: Bản dịch giữ hình ảnh thân tộc giống đực trong nguyên văn thay vì mở rộng hoặc giải nghĩa ngay trong câu, đồng thời không phủ nhận phạm vi bao quát của lời hứa trong ngữ cảnh.
- issue: Quan hệ giữa mệnh lệnh “nhận biết Chúa” và lời hứa “sẽ biết Ta”
  choice: Giữ cả sự chuyển đổi từ ngôi thứ ba “Chúa” sang ngôi thứ nhất “Ta”
  alternative: Đồng nhất cả hai thành cùng một ngôi xưng hô
  rationale: Sự chuyển ngôi có ngay trong nguyên văn trích dẫn và mang sức nặng thần học, vì vậy không nên âm thầm làm phẳng để câu văn đều hơn.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ đọc. Cấu trúc “không ai... còn phải” chuyển tải lời phủ định mạnh theo lối tự nhiên; dấu phẩy và cặp “cũng không” làm rõ hai thành phần song song. Đại từ “Ta” được viết hoa vì đây là lời Đức Chúa Trời trực tiếp phán trong câu trích dẫn.
