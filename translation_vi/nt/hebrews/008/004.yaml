source:
  edition: SBLGNT
  text: εἰ μὲν ⸀οὖν ἦν ἐπὶ γῆς, οὐδ’ ἂν ἦν ἱερεύς, ⸀ὄντων τῶν προσφερόντων κατὰ ⸀νόμον τὰ δῶρα·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/004.yaml
  text: If he were on earth[a], he would not even be a priest, since there are those who offer the gifts according to the law.
translation:
  language: vi
  text: Nếu Ngài ở trên đất, thì Ngài thậm chí cũng không phải là thầy tế lễ, vì có những người dâng các lễ vật[a] theo Luật pháp.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “các lễ phẩm”. Tiếng Hy Lạp dùng từ có nghĩa đen là “các tặng vật”, một thuật ngữ thường chỉ vật dâng trong bối cảnh tế lễ.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ μὲν οὖν
  choice: Nếu
  rationale: Mở đầu điều kiện và tiếp nối lập luận; tiếng Việt tự nhiên không cần diễn đạt riêng mọi tiểu từ.
- source_word: ἦν ... οὐδ’ ἂν ἦν
  choice: ở ... thậm chí cũng không thể làm
  rationale: Diễn đạt điều kiện trái với thực tế và sự phủ định nhấn mạnh; “không thể làm” truyền đạt rằng trong hoàn cảnh giả định ấy, ngài không thuộc hàng tư tế.
- source_word: ἐπὶ γῆς
  choice: ở trên đất
  rationale: Giữ sự tương phản không gian giữa cõi đất và cõi trời trong văn cảnh.
- source_word: ἱερεύς
  choice: thầy tế lễ
  rationale: Thuật ngữ tiếng Việt quen thuộc chỉ chức vụ tư tế trong bối cảnh thờ phượng.
- source_word: ὄντων τῶν προσφερόντων
  choice: vì đã có những người dâng
  rationale: Phân từ tuyệt đối sở hữu mang sắc thái nguyên nhân; “đã có” nhấn mạnh hàng tư tế hiện hữu mà không biến động từ thành quá khứ.
- source_word: κατὰ νόμον
  choice: theo Luật pháp
  rationale: Chỉ hệ thống luật Môi-se quy định việc dâng lễ; viết hoa để thể hiện nghĩa xác định trong văn cảnh.
- source_word: τὰ δῶρα
  choice: các lễ vật
  rationale: Trong ngữ cảnh tế lễ, δῶρα là những vật được dâng; “lễ vật” tự nhiên và vẫn phân biệt danh từ này với động từ “dâng”.
theological_decisions:
- issue: Chủ ngữ hàm ẩn của mệnh đề điều kiện
  choice: Dùng “ngài”, quy chiếu về Chúa Giê-su/Đấng Mê-si trong văn cảnh gần.
  alternative: Lặp rõ “Chúa Giê-su” hoặc để chủ ngữ hàm ẩn.
  rationale: Tiếng Việt cần chủ ngữ để câu rõ ràng; “ngài” giữ mạch quy chiếu mà không thêm một danh xưng không có trong câu Hy Lạp.
- issue: Sắc thái của câu điều kiện
  choice: 'Diễn đạt như điều kiện trái với thực tế: “Nếu ngài ở trên đất, ngài thậm chí cũng không thể làm thầy tế lễ.”'
  alternative: “Nếu ngài ở trên đất, ngài cũng không phải là thầy tế lễ.”
  rationale: Cấu trúc εἰ + thì chưa hoàn thành và ἄν + thì chưa hoàn thành cho thấy giả định trái thực tế; bản dịch giữ sắc thái ấy mà không giải thích quá mức.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “ngài” cho chủ thể đã được xác định trong văn cảnh, “thầy tế lễ” theo cách gọi Kinh Thánh quen thuộc, và “Luật pháp” cho νόμος chỉ Luật Môi-se.
