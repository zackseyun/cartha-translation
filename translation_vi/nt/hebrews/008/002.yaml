source:
  edition: SBLGNT
  text: τῶν ἁγίων λειτουργὸς καὶ τῆς σκηνῆς τῆς ἀληθινῆς, ἣν ἔπηξεν ὁ κύριος, ⸀οὐκ ἄνθρωπος.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/002.yaml
  text: a minister of the holy places and of the true tabernacle[a], which the Lord set up[b], not man.
translation:
  language: vi
  text: là Đấng thi hành thánh vụ tại các nơi thánh[a] và tại Đền Tạm đích thực mà Chúa, không phải con người, đã dựng lên[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “nơi thánh” hoặc “thánh điện”; cụm từ Hy Lạp ở số nhiều chỉ các nơi thánh thuộc thánh điện, chứ trong văn cảnh này không chỉ những người thánh.
    reason: lexical_alternative
  - marker: b
    text: Động từ Hy Lạp cũng có thể diễn đạt là “căng dựng”, gợi hình ảnh dựng một chiếc lều.
    reason: lexical_alternative
lexical_decisions:
- source_word: τῶν ἁγίων
  choice: các nơi thánh
  rationale: Tính từ số nhiều được dùng như danh từ; trong văn cảnh tế lễ của Hê-bơ-rơ, cụm này chỉ các nơi thuộc thánh điện trên trời hơn là những người thánh. Cách dịch này giữ số nhiều và không thu hẹp nghĩa quá mức.
- source_word: λειτουργὸς
  choice: Đấng phụng sự
  rationale: Từ này chỉ người thi hành sự phục vụ công cộng hoặc thánh vụ. “Phụng sự” giữ sắc thái tế lễ, còn “Đấng” phù hợp với chủ thể là vị Thượng Tế đã được nhắc đến trong câu trước.
- source_word: σκηνῆς
  choice: Đền Tạm
  rationale: Trong Hê-bơ-rơ, từ này gợi đến Lều Hội Kiến thời Môi-se và thực tại trên trời tương ứng; “Đền Tạm” giữ được liên tưởng thờ phượng ấy rõ hơn từ “lều” thông thường.
- source_word: ἀληθινῆς
  choice: đích thực
  rationale: Từ này diễn tả điều chân thật, thuộc về thực tại tối hậu, đối lập với bản sao trên đất. “Đích thực” tự nhiên trong tiếng Việt và tránh hàm ý rằng Đền Tạm dưới đất là giả dối.
- source_word: ἔπηξεν
  choice: dựng lên
  rationale: Động từ có nghĩa cố định hoặc dựng một vật lên, đặc biệt có thể dùng về lều. “Dựng lên” vừa tự nhiên vừa giữ được hình ảnh Đền Tạm.
- source_word: ὁ κύριος
  choice: Chúa
  rationale: Danh xưng κύριος được dịch nhất quán là “Chúa”; ngữ pháp tiếng Việt không cần mạo từ.
- source_word: οὐκ ἄνθρωπος
  choice: chứ không phải con người
  rationale: Danh từ số ít không có mạo từ mang nghĩa đại diện, tạo thế đối lập giữa hành động của Chúa và hành động của con người nói chung. “Chứ không phải con người” giữ được sự ngắn gọn và tương phản của nguyên văn.
theological_decisions:
- issue: Đối tượng được chỉ bởi τῶν ἁγίων và mối liên hệ với thánh điện trên trời
  choice: Ngôn ngữ chỉ các nơi thánh thuộc thánh điện, không phải những người thánh
  alternative: các thánh đồ
  rationale: Hê-bơ-rơ 8:1–5 nói về chức vụ thượng tế của Đấng Mê-si trong thánh điện trên trời. “Các nơi thánh” giữ nguyên khung cảnh tế lễ và không chuyển ý thành phục vụ các tín hữu.
- issue: Sắc thái của ἀληθινῆς
  choice: “đích thực”, chỉ thực tại trên trời mà Đền Tạm dưới đất làm hình bóng
  alternative: “thật”, có thể bị hiểu đơn giản là đối lập với giả
  rationale: Cách dịch này giữ sự tương phản giữa thực tại trên trời và bản sao dưới đất mà không phủ nhận giá trị hay tính có thật của Đền Tạm thời Môi-se.
- issue: Nghĩa đại diện của ἄνθρωπος
  choice: “con người” theo nghĩa nhân loại nói chung
  alternative: “một người”
  rationale: Mệnh đề đối lập điều Chúa dựng với điều do con người dựng; bản văn không nhằm nói đến riêng một cá nhân nam giới.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Đấng phụng sự” nối tự nhiên với chủ thể là vị Thượng Tế ở câu trước; “Đền Tạm” viết hoa như tên gọi quen thuộc của nơi thờ phượng gắn với Lều Hội Kiến. Cấu trúc giữ nguyên tính chất là một phần tiếp nối của câu 1.
