  source_fidelity: Bản dịch nhận đúng τῶν ἁγίων là ngôn ngữ thánh điện, không phải “các thánh”; giữ được hình ảnh Đền Tạm, sắc thái “đích thực” của ἀληθινῆς, và sự đối lập giữa Chúa với con người trong οὐκ ἄνθρωπος. Tuy nhiên, λειτουργὸς đi với các bổ ngữ sở thuộc trong tiếng Hy Lạp; cách nói “phụng sự trong” có thể dùng nhưng kém sát và kém tự nhiên hơn “thi hành thánh vụ tại”.
  naturalness: “Là Đấng phụng sự trong các nơi thánh” hơi nặng và không phải cách diễn đạt hiện đại tự nhiên nhất. “Là Đấng thi hành thánh vụ tại các nơi thánh” vừa trang trọng vừa rõ chức năng tế lễ. Đặt “không phải con người” ngay sau động từ “dựng lên” làm rõ rằng cụm này đối lập chủ thể dựng Đền Tạm, không phải mô tả Đấng đang thi hành thánh vụ.
