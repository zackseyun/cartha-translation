id: HEB.8.8
reference: Hebrews 8:8
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: μεμφόμενος γὰρ ⸀αὐτοὺς λέγει· Ἰδοὺ ἡμέραι ἔρχονται, λέγει κύριος, καὶ συντελέσω ἐπὶ τὸν οἶκον Ἰσραὴλ καὶ ἐπὶ τὸν οἶκον Ἰούδα διαθήκην καινήν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/008.yaml
  text: For in finding fault with them he says, “Look, days are coming, says the Lord, when I will establish a new covenant with the house of Israel and with the house of Judah,”
translation:
  language: vi
  text: 'Vì khi khiển trách họ, Ngài phán: “Này, những ngày sắp đến, Chúa phán, khi Ta sẽ lập một giao ước mới với nhà Israel và nhà Giu-đa,”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μεμφόμενος ... αὐτοὺς
  choice: khi khiển trách họ
  rationale: Giữ đối tượng theo dị bản SBLGNT αὐτούς và diễn đạt tự nhiên ý chê trách, quy lỗi.
- source_word: Ἰδοὺ
  choice: Này
  rationale: Từ dẫn trang trọng, tự nhiên trong văn Kinh Thánh tiếng Việt và có chức năng thu hút sự chú ý.
- source_word: ἡμέραι ἔρχονται
  choice: những ngày sắp đến
  rationale: Truyền đạt thành ngữ tiên tri về thời kỳ đang đến mà không thêm mốc thời gian.
- source_word: συντελέσω
  choice: sẽ lập
  rationale: Trong kết hợp với διαθήκην, từ này mang nghĩa thực hiện hoặc thiết lập giao ước; “lập” là cách nói tự nhiên và chính xác trong tiếng Việt.
- source_word: διαθήκην καινήν
  choice: một giao ước mới
  rationale: Giữ nghĩa giao ước của διαθήκη trong ngữ cảnh Kinh Thánh và sắc thái mới của καινήν.
- source_word: οἶκον Ἰσραὴλ ... οἶκον Ἰούδα
  choice: nhà Israel ... nhà Giu-đa
  rationale: Giữ hình ảnh tập thể-gia tộc của οἶκος, không thu hẹp thành lãnh thổ hay chỉ triều đại.
theological_decisions:
- issue: Đối tượng bị khiển trách
  choice: họ
  alternative: giao ước ấy
  rationale: Bản văn SBLGNT được cung cấp đọc αὐτούς, chỉ con người; không chuyển đối tượng sang giao ước dù có dị bản và cách hiểu khác trong truyền thống bản văn.
- issue: Chủ thể của lời phán
  choice: Ngài ... Chúa ... Ta
  alternative: ông ... Đức Chúa Trời ... Ta
  rationale: Duy trì sự chuyển từ lời người viết sang lời trích dẫn của Chúa mà không giải thích thêm danh tính thần học vượt quá câu chữ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu; bảo lưu cấu trúc lời tiên tri cùng các danh xưng tập thể “nhà Israel” và “nhà Giu-đa”. Câu kết bằng dấu phẩy vì lời trích dẫn tiếp tục sang câu sau.
