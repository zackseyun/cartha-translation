  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: (οἵτινες ὑποδείγματι καὶ σκιᾷ λατρεύουσιν τῶν ἐπουρανίων, καθὼς κεχρημάτισται Μωϋσῆς μέλλων ἐπιτελεῖν τὴν σκηνήν, Ὅρα γάρ, φησίν, ποιήσεις πάντα κατὰ τὸν τύπον τὸν δειχθέντα σοι ἐν τῷ ὄρει)·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/005.yaml
  text: who serve a copy and shadow of the heavenly things[a], just as Moses was divinely instructed when he was about to erect the tabernacle; for he says[b], “See that you make everything according to the pattern shown to you on the mountain.”
translation:
  language: vi
  text: 'Những người ấy phụng sự tại một nơi là bản sao và bóng của những điều trên trời, như Môi-se đã được Đức Chúa Trời phán bảo khi ông sắp hoàn thành Đền Tạm; vì có lời phán rằng[a]: “Hãy lưu ý: ông phải làm mọi thứ theo mẫu đã được chỉ cho ông trên núi.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “được cảnh cáo”; động từ Hy Lạp có thể nhấn mạnh một lời cảnh báo hoặc khuyên răn đến từ Đức Chúa Trời.
    reason: lexical_alternative
  - marker: b
    text: Xuất Ai Cập 25:40.
    reason: cross_reference
lexical_decisions:
- source_word: οἵτινες
  choice: Những người ấy
  rationale: Nối mệnh đề quan hệ này với các thầy tế lễ được nhắc đến trước đó, đồng thời giữ được sắc thái quy chiếu của đại từ Hy Lạp.
- source_word: ὑποδείγματι καὶ σκιᾷ
  choice: nơi chỉ là bản mô phỏng và bóng
  rationale: “Bản mô phỏng” diễn đạt một vật tương ứng với nguyên mẫu, còn “bóng” giữ nguyên hình ảnh của câu Hy Lạp; từ “chỉ” làm rõ sự kém hơn vốn hàm chứa trong cặp hình ảnh mà không biến chúng thành điều hoàn toàn hư ảo.
- source_word: λατρεύουσιν
  choice: phụng sự
  rationale: Diễn đạt sự phục vụ mang tính thờ phượng của các thầy tế lễ; ngữ cảnh Đền Tạm làm rõ ý nghĩa nghi lễ.
- source_word: τῶν ἐπουρανίων
  choice: của những điều trên trời
  rationale: Giữ phạm vi quy chiếu rộng của danh từ hóa Hy Lạp, không thu hẹp thành địa điểm hay giải thích hẳn là các “thực tại” siêu hình.
- source_word: κεχρημάτισται
  choice: đã được Đức Chúa Trời phán bảo
  rationale: Động từ chỉ lời chỉ dẫn có nguồn gốc thần thượng. Cách dịch này tự nhiên trong tiếng Việt và giữ cả chiều kích mặc khải lẫn mệnh lệnh; sắc thái cảnh báo được ghi ở chú thích.
- source_word: μέλλων ἐπιτελεῖν τὴν σκηνήν
  choice: khi Môi-se sắp dựng Đền Tạm
  rationale: “Sắp” giữ nghĩa hướng tới hành động sắp xảy ra của μέλλων; “dựng” phù hợp với việc thi công Đền Tạm trong ngữ cảnh, trong khi nghĩa “hoàn tất” của ἐπιτελεῖν được bảo lưu ở chú thích.
- source_word: Ὅρα
  choice: Hãy lưu ý
  rationale: Truyền đạt tự nhiên sức mạnh mệnh lệnh và sắc thái cảnh giác của từ Hy Lạp, thay vì dùng “Hãy xem” dễ bị hiểu theo nghĩa thị giác đơn thuần.
- source_word: ποιήσεις πάντα
  choice: con phải làm mọi thứ
  rationale: Thì tương lai Hy Lạp có chức năng mệnh lệnh trong lời trích dẫn; “phải” thể hiện chức năng ấy tự nhiên trong tiếng Việt.
- source_word: κατὰ τὸν τύπον τὸν δειχθέντα σοι
  choice: đúng theo mẫu đã được chỉ cho con
  rationale: Giữ ý tuân thủ chính xác nguyên mẫu được mặc khải và thể bị động của phân từ Hy Lạp.
theological_decisions:
- issue: Mối liên hệ giữa nơi thánh dưới đất và những điều trên trời
  choice: bản mô phỏng và bóng của những điều trên trời
  alternative: hình mẫu và bóng của những thực tại trên trời
  rationale: Cách chọn giữ cả sự tương ứng lẫn sự kém hơn của việc phụng sự dưới đất, không giản lược nó thành biểu tượng thuần túy và cũng không hệ thống hóa quá mức bản chất của những điều trên trời.
- issue: Sắc thái của κεχρημάτισται
  choice: được Đức Chúa Trời phán bảo
  alternative: được cảnh cáo
  rationale: Nguồn thần thượng của lời chỉ dẫn được hàm ý rõ trong động từ và ngữ cảnh. Bản dịch chính giữ khía cạnh mặc khải và chỉ dẫn, còn khả năng mang sắc thái cảnh báo được nêu trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “phụng sự” cho hoạt động thờ phượng có tính nghi lễ, “Đền Tạm” là thuật ngữ quen thuộc cho σκηνή trong bối cảnh Môi-se. Đại từ “con” trong lời Đức Chúa Trời phán với Môi-se phù hợp quan hệ giao tiếp và tiếng Việt tự nhiên.
