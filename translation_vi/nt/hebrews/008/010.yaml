id: HEB.8.10
reference: Hebrews 8:10
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὅτι αὕτη ἡ διαθήκη ἣν διαθήσομαι τῷ οἴκῳ Ἰσραὴλ μετὰ τὰς ἡμέρας ἐκείνας, λέγει κύριος, διδοὺς νόμους μου εἰς τὴν διάνοιαν αὐτῶν, καὶ ἐπὶ καρδίας αὐτῶν ἐπιγράψω αὐτούς, καὶ ἔσομαι αὐτοῖς εἰς θεόν καὶ αὐτοὶ ἔσονταί μοι εἰς λαόν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/010.yaml
  text: 'For this is the covenant that I will make with the house of Israel after those days[a], says the Lord: putting my laws into their minds, and I will write them on their hearts; and I will be their God, and they will be my people.'
translation:
  language: vi
  text: 'Vì đây là giao ước Ta sẽ lập với nhà Y-sơ-ra-ên sau những ngày ấy, Chúa phán: Ta sẽ đặt các luật của Ta vào tâm trí họ và sẽ ghi chúng trên lòng họ; Ta sẽ là Đức Chúa Trời của họ, và họ sẽ là dân Ta.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch sát cấu trúc Hy Lạp hơn: “đặt các luật của Ta vào tâm trí họ, và Ta sẽ ghi chúng trên lòng họ.” Trong tiếng Hy Lạp, “đặt/ban” là một phân từ, tiếp theo là động từ tương lai “Ta sẽ ghi.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: διαθήκη
  choice: giao ước
  rationale: Giữ nghĩa giao ước trong bối cảnh trích dẫn Giê-rê-mi và mạch thần học của sách Hê-bơ-rơ.
- source_word: διαθήσομαι
  choice: Ta sẽ lập
  rationale: Cách nói tự nhiên trong tiếng Việt cho hành động thiết lập một giao ước, đồng thời bám sát thì tương lai của nguyên văn.
- source_word: οἴκῳ Ἰσραήλ
  choice: nhà Y-sơ-ra-ên
  rationale: Bảo tồn thành ngữ mang tính tập thể và âm hưởng giao ước của lời tiên tri.
- source_word: μετὰ τὰς ἡμέρας ἐκείνας
  choice: sau những ngày ấy
  rationale: Dịch trực tiếp thành ngữ thời gian, giữ mối liên hệ với lời tiên tri trong Giê-rê-mi.
- source_word: κύριος
  choice: Chúa
  rationale: Phản ánh κύριος trong bản Hy Lạp Tân Ước mà không thay bằng cách trình bày danh Đức Chúa Trời từ bản Hê-bơ-rơ.
- source_word: διδοὺς
  choice: đặt
  rationale: Giữ giá trị phân từ của nguyên văn và diễn đạt tự nhiên hành động đưa các luật vào tâm trí.
- source_word: νόμους
  choice: các luật
  rationale: Giữ số nhiều rõ ràng của danh từ Hy Lạp.
- source_word: διάνοιαν αὐτῶν
  choice: tâm trí họ
  rationale: Diễn đạt năng lực suy nghĩ và hiểu biết; tiếng Việt dùng danh từ tập hợp tự nhiên với đại từ số nhiều.
- source_word: ἐπὶ καρδίας αὐτῶν
  choice: trên lòng họ
  rationale: Giữ giới từ và hình ảnh ghi khắc trên bề mặt, đồng thời dùng 'lòng' theo văn phong Kinh Thánh tự nhiên.
- source_word: ἐπιγράψω
  choice: Ta sẽ ghi
  rationale: '''Ghi'' rõ ràng, trang trọng vừa phải và duy trì hình ảnh khắc ghi mà không làm câu quá nặng.'
- source_word: ἔσομαι αὐτοῖς εἰς θεόν
  choice: Ta sẽ làm Đức Chúa Trời của họ
  rationale: Công thức giao ước tự nhiên và quen thuộc trong tiếng Việt.
- source_word: αὐτοὶ ἔσονταί μοι εἰς λαόν
  choice: họ sẽ làm dân Ta
  rationale: Bảo tồn quan hệ thuộc về nhau trong công thức giao ước.
theological_decisions:
- issue: Duy trì tính liên văn bản với giao ước mới trong Giê-rê-mi
  choice: Giữ các cụm 'giao ước', 'nhà Y-sơ-ra-ên', 'các luật của Ta', 'trên lòng họ', 'Đức Chúa Trời của họ' và 'dân Ta'.
  alternative: Diễn ý hoàn toàn theo văn nói hiện đại và giản lược các công thức giao ước.
  rationale: Những công thức này tạo nên sức nặng thần học của lời trích dẫn và giúp độc giả nhận ra nền tảng Cựu Ước.
- issue: Cấu trúc pha trộn giữa phân từ διδοὺς và động từ tương lai ἐπιγράψω
  choice: Giữ cấu trúc 'đặt ... và Ta sẽ ghi'.
  alternative: Làm trơn thành 'Ta sẽ đặt ... và sẽ ghi ...'.
  rationale: Nguyên văn chuyển từ phân từ sang động từ hữu hạn. Bản chính giữ sự bất cân xứng có thật; chú thích cung cấp cách đọc tiếng Việt trôi chảy hơn.
- issue: Cách gọi θεός trong công thức giao ước
  choice: Đức Chúa Trời
  alternative: Thiên Chúa
  rationale: Dùng cách gọi phổ thông trong truyền thống Tin Lành tiếng Việt phù hợp ngữ cảnh của tên dự án, nhưng không thêm nội dung giáo phái vào câu.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Đại từ 'Ta' phù hợp lời phán trực tiếp của Chúa. Giữ nhẹ cấu trúc khác thường của nguyên văn và giải thích bằng chú thích; dấu chú thích đặt ngay sau toàn câu vì liên quan đến cấu trúc của phần lời phán.
