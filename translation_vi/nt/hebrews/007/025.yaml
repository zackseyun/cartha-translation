id: HEB.7.25
reference: Hebrews 7:25
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὅθεν καὶ σῴζειν εἰς τὸ παντελὲς δύναται τοὺς προσερχομένους δι’ αὐτοῦ τῷ θεῷ, πάντοτε ζῶν εἰς τὸ ἐντυγχάνειν ὑπὲρ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/025.yaml
  text: Therefore he is also able to save completely those who draw near to God through him[a], since he always lives to intercede for them.
translation:
  language: vi
  text: Vì thế, Ngài cũng có thể cứu cách trọn vẹn[a] những người đến gần Đức Chúa Trời qua Ngài, vì Ngài luôn sống để cầu thay cho họ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “cứu mãi mãi”; theo lối dịch truyền thống: “cứu đến tận cùng.”'
    reason: Bảo lưu các sắc thái thời gian và mức độ của εἰς τὸ παντελές.
lexical_decisions:
- source_word: ὅθεν
  choice: Vì thế
  rationale: Diễn tả kết luận rút ra từ lập luận trước đó về chức tế lễ vĩnh viễn của Chúa Giê-su, đồng thời tự nhiên trong tiếng Việt hiện đại.
- source_word: καὶ
  choice: cũng
  rationale: Giữ sắc thái bổ sung, nối hệ quả này với việc Ngài giữ chức tế lễ không bao giờ chuyển giao.
- source_word: σῴζειν
  choice: cứu
  rationale: Cách dịch quen thuộc và chính xác trong ngữ cảnh cứu rỗi, vẫn giữ được trọng lượng thần học của động từ.
- source_word: εἰς τὸ παντελές
  choice: hoàn toàn
  rationale: Diễn đạt trước hết ý nghĩa trọn vẹn, toàn diện; sắc thái thời gian 'mãi mãi' được giữ trong chú thích để không giải quyết quá mức tính đa nghĩa.
- source_word: δύναται
  choice: có thể
  rationale: Diễn tả năng lực của Ngài dựa trên chức tế lễ trường tồn; đây là cách nói tự nhiên và rõ ràng trong tiếng Việt.
- source_word: τοὺς προσερχομένους
  choice: những người ... đến gần
  rationale: Giữ hình ảnh đặc trưng trong thư Hê-bơ-rơ về việc tiến đến gần Đức Chúa Trời để thờ phượng và được tiếp cận Ngài.
- source_word: δι’ αὐτοῦ
  choice: nhờ Ngài
  rationale: Diễn tả vai trò trung gian của Chúa Giê-su một cách tự nhiên; 'qua Ngài' cũng có thể hiểu được nhưng kém tự nhiên hơn trong câu này.
- source_word: τῷ θεῷ
  choice: Đức Chúa Trời
  rationale: Đối tượng mà những người tin đến gần; cách gọi trang trọng, quen thuộc trong văn phong Kinh Thánh tiếng Việt.
- source_word: πάντοτε ζῶν
  choice: bởi Ngài hằng sống
  rationale: Biểu thị nền tảng cho khả năng cứu của Ngài và giữ sắc thái liên tục của πάντοτε; 'bởi' làm rõ quan hệ nguyên nhân.
- source_word: εἰς τὸ ἐντυγχάνειν
  choice: để cầu thay
  rationale: Giữ mục đích của sự sống không ngừng của Ngài và diễn đạt vai trò chuyển cầu bằng thuật ngữ rõ ràng, phổ thông.
- source_word: ὑπὲρ αὐτῶν
  choice: cho họ
  rationale: Diễn tả việc Ngài hành động vì lợi ích và thay mặt họ bằng lối nói gọn, tự nhiên.
theological_decisions:
- issue: Phạm vi nghĩa của εἰς τὸ παντελές
  choice: Dịch là 'hoàn toàn' trong chính văn.
  alternative: '''mãi mãi''; theo lối dịch truyền thống, ''đến tận cùng'''
  rationale: Cụm từ có thể nhấn mạnh sự cứu rỗi trọn vẹn hoặc hiệu lực kéo dài mãi mãi. Chính văn chọn nghĩa toàn diện, còn chú thích bảo lưu sắc thái thời gian và lối dịch truyền thống, tránh thu hẹp sự đa nghĩa của nguyên bản.
- issue: Quan hệ của πάντοτε ζῶν với mệnh đề chính
  choice: Dùng 'bởi' để thể hiện cơ sở cho khả năng cứu.
  alternative: 'Có thể dịch sát cấu trúc phân từ hơn: ''Ngài hằng sống để cầu thay cho họ.'''
  rationale: Trong ngữ cảnh, sự sống mãi của vị Thượng Tế là cơ sở cho năng lực cứu; cách dịch nhân quả làm sáng rõ quan hệ này mà không thêm một khẳng định thần học xa lạ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” cho Chúa Giê-su theo quy chiếu của ngữ cảnh; giữ cụm “đến gần Đức Chúa Trời” nhằm bảo tồn ngôn ngữ chủ đạo về sự tiếp cận Đức Chúa Trời trong thư Hê-bơ-rơ. Dấu chú thích [a] xuất hiện ngay sau mệnh đề có cụm từ đa nghĩa.
