  yaml_path: translation/nt/hebrews/007/023.yaml
  text: And they indeed have become many priests[a], because they are prevented by death from remaining in office[b],
translation:
  language: vi
  text: Còn về các thầy tế lễ, đã có nhiều người, vì sự chết ngăn họ tiếp tục đảm nhiệm chức vụ[b];
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'Sát nghĩa: “tiếp tục” hoặc “ở lại”; trong văn cảnh, nói đến việc tiếp tục đảm nhiệm chức tế lễ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: Lại nữa
  rationale: Diễn đạt liên từ nối tiếp lập luận một cách tự nhiên trong tiếng Việt, liên kết câu này với phần trước.
- source_word: οἱ μὲν πλείονές εἰσιν γεγονότες ἱερεῖς
  choice: số thầy tế lễ ấy đã trở nên đông đảo
  rationale: Giữ ý số lượng nhiều và sắc thái kết quả của γεγονότες, đồng thời để μὲν chuẩn bị cho vế tương phản ở câu kế tiếp. Đại từ chỉ định “ấy” quy chiếu đến các thầy tế lễ thuộc trật tự vừa được bàn đến mà không thêm từ “Lê-vi” vốn không có trong câu Hy Lạp.
- source_word: διὰ τὸ θανάτῳ κωλύεσθαι
  choice: vì cái chết ngăn họ
  rationale: Thể hiện rõ quan hệ nguyên nhân của διά với động từ nguyên mẫu có mạo từ; chuyển cấu trúc bị động Hy Lạp sang cách chủ động tự nhiên trong tiếng Việt nhưng vẫn giữ cái chết là tác nhân ngăn trở.
- source_word: παραμένειν
  choice: tiếp tục chức vụ
  rationale: Trong văn cảnh về chức tế lễ, động từ chỉ việc tiếp tục trong vai trò ấy. “Chức vụ” làm rõ điều hàm ẩn theo văn cảnh; chú thích bảo lưu nghĩa sát chữ.
theological_decisions:
- issue: Sự tương phản giữa nhiều thầy tế lễ phải chết và chức tế lễ bền vững của Đức Chúa Jêsus
  choice: Nhấn mạnh số thầy tế lễ trở nên đông đảo vì cái chết khiến từng người không thể tiếp tục chức vụ, qua đó chuẩn bị cho sự tương phản ở câu 24.
  alternative: Nêu đích danh đây là các thầy tế lễ Lê-vi ngay trong chính văn.
  rationale: Văn cảnh xác định họ thuộc trật tự tế lễ trước, nhưng câu Hy Lạp không dùng từ “Lê-vi”; vì vậy bản dịch không đưa thêm danh xưng thần học vào chính văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “thầy tế lễ” theo thuật ngữ Kinh Thánh Việt ngữ quen thuộc; cấu trúc câu giữ quan hệ nối tiếp và để dấu chấm phẩy nhằm phản ánh câu Hy Lạp còn dẫn sang sự tương phản ở câu kế tiếp.
