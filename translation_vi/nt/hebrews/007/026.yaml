id: HEB.7.26
reference: Hebrews 7:26
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Τοιοῦτος γὰρ ἡμῖν ⸀καὶ ἔπρεπεν ἀρχιερεύς, ὅσιος, ἄκακος, ἀμίαντος, κεχωρισμένος ἀπὸ τῶν ἁμαρτωλῶν, καὶ ὑψηλότερος τῶν οὐρανῶν γενόμενος·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/026.yaml
  text: 'For such a high priest was indeed fitting for us: holy[a], innocent, undefiled, separated from sinners[b], and having become higher than the heavens.'
translation:
  language: vi
  text: 'Quả vậy, một thượng tế như thế thật thích hợp cho chúng ta: thánh khiết, không chút gian ác, không ô uế, tách biệt khỏi những người tội lỗi[a], và đã trở nên cao hơn các tầng trời[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “được biệt riêng khỏi những người tội lỗi.” Cụm từ nhấn mạnh sự thanh sạch về đạo đức và địa vị được tôn cao của ngài với tư cách thượng tế.
    reason: lexical_alternative
  - marker: b
    text: Hay “đã được tôn cao vượt trên các tầng trời.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοιοῦτος
  choice: một thượng tế như thế
  rationale: Giữ lực hồi chỉ của đại từ chỉ định, hướng về mẫu thượng tế vừa được mô tả trong mạch văn trước.
- source_word: γὰρ
  choice: Quả vậy
  rationale: Diễn đạt quan hệ giải thích với lập luận trước, đồng thời tự nhiên hơn trong văn nghị luận tiếng Việt.
- source_word: ἡμῖν καὶ ἔπρεπεν
  choice: thật thích hợp cho chúng ta
  rationale: ἡμῖν chỉ sự thích hợp đối với cộng đồng người tin; καί ở đây có sắc thái nhấn mạnh, được thể hiện bằng “thật”.
- source_word: ἀρχιερεύς
  choice: thượng tế
  rationale: Thuật ngữ tiếng Việt chuẩn, ngắn gọn và chính xác cho chức vụ tư tế cao nhất trong ngữ cảnh Hê-bơ-rơ.
- source_word: ὅσιος
  choice: thánh khiết
  rationale: Diễn đạt phẩm chất thánh thiện và ngay chính trong ngữ cảnh mô tả tư cách của thượng tế.
- source_word: ἄκακος
  choice: không chút gian ác
  rationale: Nêu rõ sự vắng bóng điều ác hay ác ý; tránh để “vô hại” bị hiểu quá yếu và “vô tội” bị đồng nhất với một thuật ngữ pháp lý.
- source_word: ἀμίαντος
  choice: không ô uế
  rationale: Giữ hình ảnh về sự tinh sạch, kể cả âm hưởng nghi lễ, bằng cách diễn đạt quen thuộc và dễ hiểu.
- source_word: κεχωρισμένος ἀπὸ τῶν ἁμαρτωλῶν
  choice: tách biệt khỏi những người tội lỗi
  rationale: Phân từ hoàn thành mô tả tình trạng đã được phân cách; bản dịch trực tiếp giữ nguyên khả năng câu nói đến sự thanh sạch về đạo đức và địa vị được tôn cao.
- source_word: ὑψηλότερος τῶν οὐρανῶν
  choice: cao hơn các tầng trời
  rationale: Giữ nguyên cấu trúc so sánh của nguyên văn thay vì chuyển ngay thành lối diễn giải “được tôn cao vượt trên”.
- source_word: γενόμενος
  choice: đã trở nên
  rationale: Phản ánh phân từ aorist và kết quả là địa vị được tôn cao, nhưng không tự ý nêu tác nhân hay đổi thành một mô tả thuần túy tĩnh tại.
theological_decisions:
- issue: Quan hệ của Chúa Giê-su với những người tội lỗi trong cụm “tách biệt khỏi những người tội lỗi”
  choice: Giữ cách nói trực tiếp, có thể chỉ sự thanh sạch về đạo đức và địa vị được tôn cao của ngài.
  alternative: Hiểu hoàn toàn theo nghĩa không gian, hoặc chỉ nói đến sự phân cách sau khi thăng thiên.
  rationale: Chuỗi phẩm chất nhấn mạnh tư cách thanh sạch và cao trọng của vị thượng tế. Không thêm lời giải nghĩa vào chính câu để tránh phủ nhận việc ngài từng giao tiếp với người tội lỗi hoặc giới hạn cụm từ vào một thời điểm duy nhất.
- issue: Lực nghĩa của γενόμενος trong cụm nói về việc cao hơn các tầng trời
  choice: Dịch “đã trở nên cao hơn các tầng trời,” phản ánh chuyển biến lịch sử đến địa vị được tôn cao.
  alternative: “vốn cao hơn các tầng trời” hoặc “đã được tôn cao vượt trên các tầng trời.”
  rationale: Cách dịch giữ chuyển động và kết quả do phân từ diễn tả mà không thêm thể bị động hay tác nhân; câu nói về địa vị tư tế được tôn cao, không buộc người đọc hiểu là bản tính thần linh của Đấng Christ đã thay đổi.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại, dùng câu liệt kê cân đối và thuật ngữ “thượng tế” quen thuộc. “Không chút gian ác” được chọn để ἄκακος rõ nghĩa với độc giả phổ thông; “các tầng trời” giữ sắc thái số nhiều của οὐρανῶν. Các dấu chú thích được đặt ngay sau đúng cụm từ mà chúng giải thích.
