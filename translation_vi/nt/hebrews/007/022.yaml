    rationale: κατὰ τοσοῦτο là thành ngữ chỉ mức độ, đồng thời trong mạch câu này hoạt động như một kết luận từ lời thề ở câu trước. “Chính vì thế” diễn đạt quan hệ đó rõ và tự nhiên hơn, dù không gượng ép một cấu trúc đo lường không có tương đương idiomatic trong tiếng Việt.
  - severity: low
    issue: “Đấng bảo chứng” thêm sắc thái tước hiệu và kém thông dụng hơn cần thiết.
    rationale: ἔγγυος chỉ người bảo đảm hay người đứng ra bảo lãnh. “Người bảo lãnh” giữ nghĩa cá nhân và rõ ràng trong tiếng Việt hiện đại.
  revised_text: Chính vì thế, Giê-su đã trở thành người bảo lãnh cho một giao ước[a] tốt hơn.
