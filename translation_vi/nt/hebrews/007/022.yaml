  text: κατὰ ⸀τοσοῦτο ⸀κρείττονος διαθήκης γέγονεν ἔγγυος Ἰησοῦς.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/022.yaml
  text: By so much[a], Jesus has become the guarantor of a better covenant.
translation:
  language: vi
  text: Chính vì thế, Giê-su đã trở thành người bảo lãnh cho một giao ước[a] tốt hơn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hy Lạp được dịch là “giao ước” cũng có thể có nghĩa là “di chúc” trong một số ngữ cảnh; tại đây, “giao ước” phù hợp nhất với lập luận về chức tế lễ và lời thề.
    reason: alternative_reading
lexical_decisions:
- source_word: κατὰ τοσοῦτο
  choice: Theo mức ấy
  rationale: Cụm κατά với đại từ chỉ mức độ diễn tả phạm vi hoặc mức độ so sánh. Cách dịch này giữ mối liên hệ với lập luận ngay trước đó và không làm mất sắc thái ‘đến mức tương ứng ấy’.
- source_word: κρείττονος
  choice: tốt hơn
  rationale: Giữ rõ sắc thái so sánh của từ khóa κρείττων trong thư Hê-bơ-rơ, đồng thời tự nhiên và dễ hiểu hơn ‘ưu việt hơn’.
- source_word: διαθήκης
  choice: giao ước
  rationale: Trong ngữ cảnh về chức tế lễ và lời thề, từ này chỉ sự sắp đặt giao ước của Đức Chúa Trời hơn là một di chúc, dù nghĩa thứ hai vẫn có thể có trong một số ngữ cảnh.
- source_word: γέγονεν
  choice: đã trở thành
  rationale: Thì hoàn thành diễn tả một sự việc đã xảy ra và kết quả vẫn còn hiệu lực; ‘đã trở thành’ truyền đạt được sắc thái ấy.
- source_word: ἔγγυος
  choice: Đấng bảo chứng
  rationale: Từ này chỉ một người đứng ra bảo đảm cho một cam kết. ‘Đấng bảo chứng’ vừa chính xác, trang trọng, vừa giữ trọng tâm nơi vai trò của một nhân vật chứ không biến thành khái niệm trừu tượng.
- source_word: Ἰησοῦς
  choice: Giê-su
  rationale: Phiên âm tên riêng theo cách dùng phổ biến trong tiếng Việt hiện đại, không thêm tước hiệu vốn không có trong câu Hy Lạp.
theological_decisions:
- issue: Nghĩa của διαθήκη trong Hê-bơ-rơ 7:22
  choice: giao ước
  alternative: di chúc
  rationale: Lập luận tại đây xoay quanh chức tế lễ của Giê-su và lời thề thiết lập một trật tự tốt hơn, nên ‘giao ước’ phù hợp nhất. Chú thích vẫn bảo lưu khả năng từ Hy Lạp mang nghĩa ‘di chúc’ trong những ngữ cảnh khác.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Cấu trúc ‘Theo mức ấy’ được giữ để phản ánh thành ngữ chỉ mức độ trong nguyên văn và mối nối chặt với câu trước; ‘Đấng bảo chứng’ diễn đạt vai trò cá nhân của Giê-su một cách trang nghiêm.
