base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/009.yaml
  text: And[a], so to speak, through Abraham even Levi, who receives tithes, has paid tithes[b],
translation:
  language: vi
  text: Và có thể nói rằng, qua Áp-ra-ham, ngay cả Lê-vi, là người nhận phần mười, cũng đã nộp phần mười[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Động từ Hy Lạp ở thể bị động, theo nghĩa đen là “đã bị/được đánh phần mười” hoặc “đã bị buộc nộp phần mười”; trong lập luận này, Lê-vi được kể là đã nộp phần mười qua Áp-ra-ham.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς ἔπος εἰπεῖν
  choice: có thể nói rằng
  rationale: Đây là thành ngữ dùng để dè dặt hoặc giới hạn một cách diễn đạt. “Có thể nói rằng” tự nhiên trong tiếng Việt hiện đại và giữ được sắc thái tu từ ấy.
- source_word: δι’ Ἀβραὰμ
  choice: qua Áp-ra-ham
  rationale: διά với sở hữu cách diễn tả sự trung gian; Lê-vi được xem là tham dự vào hành động qua tổ phụ Áp-ra-ham.
- source_word: καὶ Λευὶ
  choice: ngay cả Lê-vi ... cũng
  rationale: Cấu trúc “ngay cả ... cũng” truyền đạt sức nhấn mạnh và tính bất ngờ của καί trong lập luận.
- source_word: ὁ δεκάτας λαμβάνων
  choice: là người nhận phần mười
  rationale: Phân từ hiện tại dùng như danh từ, mô tả vai trò đặc trưng của Lê-vi trong hàng tư tế; cách dịch này rõ và tự nhiên.
- source_word: δεκάτας
  choice: phần mười
  rationale: “Phần mười” là thuật ngữ tiếng Việt quen thuộc cho khoản một phần mười được dâng hoặc nộp trong bối cảnh này.
- source_word: δεδεκάτωται
  choice: đã nộp phần mười
  rationale: Động từ hoàn thành bị động có dạng nén nghĩa đen là “đã được thu phần mười”. Trong ngữ cảnh, Lê-vi được kể là người nộp phần mười qua Áp-ra-ham; cách dịch chủ động truyền đạt đúng vai trò ngữ nghĩa, còn chú thích bảo lưu hình thức bị động của tiếng Hy Lạp.
theological_decisions:
- issue: Sự tham dự mang tính đại diện của Lê-vi trong hành động của Áp-ra-ham
  choice: Giữ cách nói rằng Lê-vi đã nộp phần mười “qua Áp-ra-ham”, đồng thời giữ lời dè dặt “có thể nói rằng”.
  alternative: Giải thích rõ Lê-vi hiện hữu trong tổ phụ hoặc chỉ tham dự theo nghĩa bóng.
  rationale: Bản dịch bảo toàn lập luận về quan hệ đại diện giữa tổ phụ và hậu duệ mà không xác định một cơ chế thần học vượt quá câu văn.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại; dùng “có thể nói rằng” thay cho lối cổ, và “phần mười” là thuật ngữ Kinh Thánh phổ thông. Dấu phẩy làm rõ rằng “là người nhận phần mười” bổ nghĩa cho Lê-vi.
