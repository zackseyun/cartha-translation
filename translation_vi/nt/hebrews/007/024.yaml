base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/024.yaml
  text: But he[a], because he remains forever, holds the priesthood permanently.
translation:
  language: vi
  text: Nhưng vì Ngài còn mãi đời đời, Ngài giữ chức tế lễ vĩnh viễn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “giữ chức tế lễ không thay đổi” hoặc “có chức tế lễ không thể chuyển giao.” Tính từ Hy Lạp có thể hàm ý một trong các sắc thái này; trong mạch văn, vì Ngài còn mãi đời đời nên chức tế lễ của Ngài không chuyển sang người khác.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ
  choice: Nhưng ... ngài
  rationale: Mạo từ được dùng như danh từ, chỉ về Đức Giê-su và tương phản ngài với nhiều thầy tế lễ ở câu trước. Cách diễn đạt này tự nhiên trong tiếng Việt và giữ lực đối lập của δέ.
- source_word: διὰ τὸ μένειν αὐτὸν
  choice: vì ngài còn lại
  rationale: διά với động từ nguyên mẫu có mạo từ diễn tả nguyên nhân. μένω ở đây nói đến việc tiếp tục tồn tại, đối lập với các thầy tế lễ phải chết.
- source_word: εἰς τὸν αἰῶνα
  choice: đời đời
  rationale: Thành ngữ chỉ sự kéo dài không có điểm kết thúc; “đời đời” là cách diễn đạt Kinh Thánh trang trọng nhưng vẫn quen thuộc trong tiếng Việt hiện đại.
- source_word: ἀπαράβατον
  choice: vĩnh viễn
  rationale: Tính từ này có thể mang sắc thái không thay đổi hoặc không chuyển giao. Trong mạch văn về các thầy tế lễ chết và được thay thế, “vĩnh viễn” diễn đạt tính lâu bền mà không thu hẹp quá mức nghĩa từ.
- source_word: ἔχει τὴν ἱερωσύνην
  choice: giữ chức tế lễ
  rationale: ἔχω diễn tả việc nắm giữ hay sở hữu chức vụ; “giữ chức tế lễ” tự nhiên hơn “có chức tế lễ” và phù hợp với ý chức vụ không chuyển sang người khác.
- source_word: ἱερωσύνην
  choice: chức tế lễ
  rationale: Danh từ chỉ chức vụ hoặc địa vị của thầy tế lễ. “Chức tế lễ” rõ nghĩa trong ngữ cảnh và tránh khả năng “hàng tư tế” bị hiểu là một tập thể.
theological_decisions:
- issue: Ý nghĩa của ἀπαράβατον đối với chức tế lễ của Đức Giê-su
  choice: Dùng “vĩnh viễn” trong chính văn để nhấn mạnh rằng ngài giữ chức tế lễ mãi vì ngài còn lại đời đời.
  alternative: “không thay đổi” hoặc “không thể chuyển giao”
  rationale: Từ Hy Lạp cho phép cả sắc thái không thay đổi lẫn không chuyển sang người kế nhiệm. Mạch văn thiên về việc chức tế lễ không truyền cho người khác, nhưng chú thích giữ lại sự mơ hồ từ vựng chân thực, không áp đặt một công thức thần học hẹp hơn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “ngài” để quy chiếu Đức Giê-su theo lối tôn kính tự nhiên; cấu trúc nguyên nhân–kết quả được làm rõ bằng “vì... nên”.
