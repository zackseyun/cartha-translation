review_pass:
  verdict: revise
  source_fidelity: Bản dịch phản ánh đúng quan hệ nguyên nhân của διὰ τὸ, ý thời gian vô hạn của εἰς τὸν αἰῶνα, và ý chức vụ tư tế bền vững của ἀπαράβατον. Tuy nhiên, “còn lại” trong tiếng Việt hiện đại thường gợi nghĩa ‘phần còn sót lại’, không diễn đạt tự nhiên ý μένειν là tiếp tục tồn tại/ở lại.
  naturalness: Thay “còn lại đời đời” bằng “còn mãi đời đời” để diễn đạt tự nhiên hơn trong văn phong Kinh Thánh hiện đại. Bỏ “nên” giúp câu gần với cấu trúc nguyên ngữ mà vẫn rõ quan hệ nhân quả.
  terminology: “Chức tế lễ” là cách gọi phù hợp cho ἱερωσύνην trong ngữ cảnh này. “Vĩnh viễn” giữ được ý chính mà không quyết định thay cho sự mơ hồ giữa ‘không thay đổi’ và ‘không thể chuyển giao’; chú thích cần diễn đạt sự mơ hồ ấy chính xác hơn.
  issues:
  - severity: medium
    issue: Cụm “ngài còn lại đời đời” không tự nhiên và có thể bị hiểu sai.
    rationale: μένειν ở đây nói về việc tiếp tục tồn tại/ở mãi, đối lập với các thầy tế lễ qua đời; “còn lại” tiếng Việt thường chỉ một phần còn dư hoặc người còn sống sau biến cố.
  - severity: low
    issue: Chú thích nói tính từ ‘có thể mang một trong hai sắc thái’.
    rationale: ἀπαράβατον có phạm vi nghĩa còn tranh luận; cách nói này có thể gợi rằng chỉ được chọn độc nhất một nghĩa. Nên nói từ này ‘có thể hàm ý’ các sắc thái được nêu, trong khi giải thích mạch văn.
  revised_text: Nhưng vì Ngài còn mãi đời đời, Ngài giữ chức tế lễ vĩnh viễn.[a]
