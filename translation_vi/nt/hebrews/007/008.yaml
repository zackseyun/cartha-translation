source:
  edition: SBLGNT
  text: καὶ ὧδε μὲν δεκάτας ἀποθνῄσκοντες ἄνθρωποι λαμβάνουσιν, ἐκεῖ δὲ μαρτυρούμενος ὅτι ζῇ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/008.yaml
  text: And here mortal men receive tithes[a], but there he is testified to be living.
translation:
  language: vi
  text: Ở đây, những người phải chết nhận phần mười; còn ở kia, phần mười được nhận bởi người mà có lời chứng rằng người ấy sống.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: «ở kia, người nhận phần mười là người được làm chứng rằng người ấy sống.» Câu Hy Lạp trình bày điều này dưới hình thức lời chứng của Kinh Thánh về Mên-chi-xê-đéc, chứ không trực tiếp khẳng định ông bất tử theo nghĩa đen.'
    reason: Làm rõ sự tỉnh lược ở vế thứ hai và giữ hình thức lời chứng của nguyên văn, không quyết định vấn đề Mên-chi-xê-đéc có bất tử theo nghĩa đen hay không.
lexical_decisions:
- source_word: ὧδε
  choice: ở đây
  rationale: Giữ phép đối chiếu trực tiếp với ἐκεῖ (‘ở kia’), đồng thời chỉ hoàn cảnh của các thầy tế lễ Lê-vi.
- source_word: δεκάτας
  choice: phần mười
  rationale: Cách gọi tự nhiên và quen thuộc trong tiếng Việt đối với một phần mười được dâng theo quy định tôn giáo.
- source_word: ἀποθνῄσκοντες ἄνθρωποι
  choice: những người phải chết
  rationale: Diễn đạt rõ thân phận hữu hạn, phải chết của các thầy tế lễ, thay vì gợi rằng họ đang hấp hối.
- source_word: λαμβάνουσιν
  choice: nhận
  rationale: Phản ánh trực tiếp hành động nhận phần mười mà không thêm sắc thái cưỡng thu hay thu gom.
- source_word: ἐκεῖ
  choice: ở kia
  rationale: Duy trì cặp đối chiếu ‘ở đây… ở kia’, trong đó ‘ở kia’ hướng đến trường hợp Mên-chi-xê-đéc trong lời Kinh Thánh.
- source_word: μαρτυρούμενος
  choice: có lời chứng rằng người ấy
  rationale: Giữ sắc thái thụ động và tính chất của lời chứng, đồng thời diễn đạt tự nhiên trong tiếng Việt; ‘người ấy’ chỉ Mên-chi-xê-đéc theo văn cảnh.
- source_word: ὅτι ζῇ
  choice: vẫn sống
  rationale: Giữ thì hiện tại và làm nổi bật sự tương phản với những người phải chết; ‘vẫn’ thể hiện sức đối chiếu mà không tự biến câu thành một khẳng định trực tiếp về sự bất tử.
theological_decisions:
- issue: Bản chất của sự tương phản giữa các thầy tế lễ Lê-vi và Mên-chi-xê-đéc
  choice: Giữ câu ở dạng lời chứng rằng Mên-chi-xê-đéc vẫn sống.
  alternative: Khẳng định trực tiếp rằng Mên-chi-xê-đéc bất tử hoặc vẫn đang sống theo nghĩa bản thể.
  rationale: μαρτυρούμενος trình bày điều này như một lời chứng trong lập luận của tác giả. Bản dịch không xóa bỏ khoảng căng giữa cách Kinh Thánh trình bày Mên-chi-xê-đéc và một khẳng định về sự bất tử theo nghĩa đen.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cặp ‘ở đây… ở kia’ bảo toàn cấu trúc tu từ của nguyên văn; ‘những người phải chết’ tự nhiên hơn ‘những người đang chết’ trong tiếng Việt và diễn đạt đúng trọng tâm về thân phận hữu hạn.
