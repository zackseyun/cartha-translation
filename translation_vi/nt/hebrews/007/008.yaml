revisions:
- from: Ở đây, những người phải chết nhận phần mười; còn ở kia, có lời chứng rằng người ấy vẫn sống.[a]
  to: Ở đây, những người phải chết nhận phần mười; còn ở kia, phần mười được nhận bởi người mà có lời chứng rằng người ấy sống.[a]
  rationale: Bản sửa phục hồi ý «nhận phần mười» được tỉnh lược nhưng được hàm ý rõ bởi vế đầu và cấu trúc Hy Lạp, đồng thời giữ «có lời chứng» để phản ánh μαρτυρούμενος. Thay «vẫn sống» bằng «sống» tránh thêm một sắc thái không cần thiết. Chú thích được chỉnh để giải thích lựa chọn cú pháp và bảo toàn tính không quyết định của lập luận.
