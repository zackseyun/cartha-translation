    issue: «vẫn sống» thêm nhẹ sắc thái «still/continues to live».
    rationale: Thì hiện tại ζῇ có thể hàm ý sự tương phản trong lập luận, nhưng bản thân từ này đơn giản là «sống». Dùng «sống» giữ sự dè dặt của nguyên văn hơn.
