review_pass:
  verdict: revise
  source_fidelity: Bản nháp truyền đạt đúng đối lập chính giữa những người nhận phần mười là người phải chết và Mên-chi-xê-đéc, người được Kinh Thánh làm chứng là sống. Tuy nhiên, mệnh đề δεύτερο trong tiếng Hy Lạp có sự tỉnh lược, hàm ý việc nhận phần mười; bản nháp bỏ hẳn ý này, khiến thế đối xứng với «nhận phần mười» ở vế đầu không còn rõ. «vẫn sống» có thể chấp nhận về mặt ngữ cảnh, nhưng «sống» giữ sát ὅτι ζῇ hơn và không thêm sắc thái thời lượng.
  naturalness: «Ở đây ... còn ở kia» và «những người phải chết» đều tự nhiên, phù hợp văn phong Kinh Thánh hiện đại. Cụm «có lời chứng rằng người ấy vẫn sống» hơi rời khỏi cấu trúc đối chiếu vì không nói người ấy nhận gì. Việc phục hồi đối tượng bị tỉnh lược bằng «phần mười được nhận bởi...» làm câu đầy đủ và dễ theo dõi trong tiếng Việt.
  terminology: «phần mười» là thuật ngữ chuẩn. «Mên-chi-xê-đéc» trong chú thích nhất quán với dữ liệu dự thảo. Cách nói «có lời chứng» bảo toàn sắc thái thụ động/chứng thực của μαρτυρούμενος và không biến câu thành khẳng định giáo lý trực tiếp về sự bất tử.
  issues:
  - severity: medium
    issue: Vế «ở kia» không biểu đạt hành động nhận phần mười được tỉnh lược trong nguyên văn.
    rationale: 'Cấu trúc đối lập là: ở đây những người phải chết nhận phần mười, còn ở kia phần mười được nhận bởi người được làm chứng là sống. Dù Hy Lạp tỉnh lược động từ ở vế sau, bản dịch tiếng Việt nên phục hồi nó để giữ quan hệ cú pháp và lập luận.'
