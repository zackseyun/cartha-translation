  source_fidelity: Bản dịch giữ đúng liên từ giải thích γάρ, lối bị động/vô nhân xưng của μαρτυρεῖται, và không thêm “thượng phẩm” vào ἱερεύς. Tuy nhiên, “Con” xác định quan hệ xưng hô cha–con không được nêu trong tiếng Hy Lạp; Σὺ chỉ là đại từ ngôi hai số ít có nhấn mạnh. Cần dùng cách xưng hô ít diễn giải hơn.
  naturalness: Câu văn trang trọng, rõ ràng và phù hợp văn phong Kinh Thánh tiếng Việt. “Ngươi” mang sắc thái văn chương/Kinh Thánh hơn khẩu ngữ hiện đại, nhưng ở lời trích thánh thư nó tự nhiên hơn “bạn” và tránh sự áp đặt quan hệ của “Con”.
  terminology: “Thầy tế lễ” là thuật ngữ quen dùng và tương ứng với ἱερεύς. “Phẩm trật” diễn đạt được τάξις trong ngữ cảnh tư tế; chú thích nêu “cách thức” như một khả năng hẹp hơn là thích hợp. Tên “Mên-chi-xê-đéc” nhất quán với lối phiên âm Việt ngữ.
  issues:
