source:
  edition: SBLGNT
  text: ⸀μαρτυρεῖται γὰρ ὅτι Σὺ ἱερεὺς εἰς τὸν αἰῶνα κατὰ τὴν τάξιν Μελχισέδεκ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/017.yaml
  text: 'For it is testified: “You are a priest forever according to the order of Melchizedek.”[a][b]'
translation:
  language: vi
  text: 'Vì có lời làm chứng rằng: “Ngươi là thầy tế lễ đời đời, theo phẩm trật của Mên-chi-xê-đéc.”[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “theo cách thức của Mên-chi-xê-đéc.”'
    reason: lexical_alternative
  - marker: b
    text: Trích Thi Thiên 110:4.
    reason: cross_reference
lexical_decisions:
- source_word: μαρτυρεῖται
  choice: có lời làm chứng
  rationale: Động từ hiện tại, thể bị động, được dùng theo lối vô nhân xưng để dẫn lời chứng của Kinh Thánh. Cách dịch này giữ ý nghĩa làm chứng mà không chỉ rõ chủ thể ngoài điều nguyên văn nói.
- source_word: γὰρ
  choice: Vì
  rationale: Liên từ nêu lý do hoặc bằng chứng hỗ trợ cho lời khẳng định trước đó.
- source_word: ὅτι
  choice: 'rằng:'
  rationale: Dẫn nội dung của lời chứng; kết hợp “rằng” với dấu hai chấm tự nhiên trong tiếng Việt và vẫn thể hiện quan hệ cú pháp.
- source_word: Σὺ
  choice: Con
  rationale: Đại từ ngôi thứ hai số ít có tính nhấn mạnh. Trong lời Thi Thiên, “Con” là cách xưng hô trang trọng và tự nhiên của người trên nói với người được phong chức, nhưng không thêm danh tính vào câu.
- source_word: ἱερεὺς
  choice: thầy tế lễ
  rationale: Chỉ chức vụ tư tế nói chung. Không dịch là “thầy tế lễ thượng phẩm,” vì nguyên văn câu này không có yếu tố “thượng phẩm.”
- source_word: εἰς τὸν αἰῶνα
  choice: đời đời
  rationale: Thành ngữ chỉ thời gian kéo dài vĩnh viễn; “đời đời” trang trọng, rõ nghĩa và quen thuộc trong văn phong Kinh Thánh tiếng Việt.
- source_word: κατὰ τὴν τάξιν
  choice: theo phẩm trật của
  rationale: τάξις ở đây có thể chỉ phẩm trật, thứ bậc hoặc kiểu mẫu tương ứng. “Phẩm trật” giữ sắc thái chức vụ tư tế và sự tương ứng với Mên-chi-xê-đéc mà không diễn giải quá mức.
- source_word: Μελχισέδεκ
  choice: Mên-chi-xê-đéc
  rationale: Phiên âm tên riêng theo cách dễ đọc và quen dùng trong tiếng Việt.
theological_decisions:
- issue: Danh xưng tư tế trong lời trích Thi Thiên
  choice: thầy tế lễ
  alternative: thầy tế lễ thượng phẩm
  rationale: Nguyên văn chỉ có ἱερεύς, “thầy tế lễ.” Dù thư Hê-bơ-rơ trình bày Chúa Giê-xu là thầy tế lễ thượng phẩm, không nên đưa chữ “thượng phẩm” vào câu này.
- issue: Ý nghĩa của κατὰ τὴν τάξιν Μελχισέδεκ
  choice: theo phẩm trật của Mên-chi-xê-đéc
  alternative: theo cách thức của Mên-chi-xê-đéc
  rationale: “Phẩm trật” bảo tồn khả năng câu nói đề cập đến một trật tự hay hạng tư tế; phương án “cách thức” nhấn mạnh kiểu mẫu nhưng có thể thu hẹp nét nghĩa. Chú thích ghi nhận phương án đó.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Giữ cấu trúc dẫn lời chứng của Kinh Thánh, dùng thuật ngữ tư tế quen thuộc, đồng thời tránh thêm lời giải thích thần học không có trong nguyên văn.
