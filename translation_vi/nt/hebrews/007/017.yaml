- from: 'Vì có lời làm chứng rằng: “Con là thầy tế lễ đời đời, theo phẩm trật của Mên-chi-xê-đéc.”[a][b]'
  to: 'Vì có lời làm chứng rằng: “Ngươi là thầy tế lễ đời đời, theo phẩm trật của Mên-chi-xê-đéc.”[a][b]'
  rationale: Chỉ thay “Con” bằng “Ngươi” để phản ánh đại từ ngôi hai số ít Σὺ mà không áp đặt quan hệ xưng hô hay diễn giải danh tính người được nói đến. Giữ nguyên các lựa chọn còn lại vì chúng truyền đạt trung thành và tự nhiên nội dung câu Hy Lạp.
