  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὁ δὲ μὴ γενεαλογούμενος ἐξ αὐτῶν δεδεκάτωκεν ⸀Ἀβραάμ, καὶ τὸν ἔχοντα τὰς ἐπαγγελίας εὐλόγηκεν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/006.yaml
  text: But the one who is not traced by genealogy from them has taken a tenth from Abraham and has blessed the one who had the promises[a][b].
translation:
  language: vi
  text: Nhưng người không được ghi nhận theo gia phả từ họ đã nhận một phần mười từ Áp-ra-ham[a] và đã chúc phước cho người có các lời hứa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đã thu một phần mười từ Áp-ra-ham.” Động từ Hy Lạp có thể chỉ việc lấy hoặc nhận một phần mười.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “người đã có các lời hứa.” Tiếng Hy Lạp dùng phân từ hiện tại, nhưng tiếng Việt có thể dùng quá khứ khi kể về Áp-ra-ham.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ μὴ γενεαλογούμενος ἐξ αὐτῶν
  choice: Nhưng người không thuộc gia phả của họ
  rationale: Cụm phân từ thụ động có mạo từ chỉ Mên-chi-xê-đéc, người không được kể trong dòng gia phả của các con cháu Lê-vi. Cách dịch này giữ trọng tâm về tư cách gia phả trong lập luận, chứ không khẳng định rằng ông không có tổ tiên hay có nguồn gốc siêu nhiên.
- source_word: δεδεκάτωκεν Ἀβραάμ
  choice: đã nhận một phần mười từ Áp-ra-ham
  rationale: Động từ chỉ việc lấy hoặc nhận một phần mười. “Đã nhận một phần mười” tự nhiên trong tiếng Việt và làm rõ Áp-ra-ham là người trao; phụ chú bảo lưu cách dịch “đã thu”.
- source_word: τὸν ἔχοντα τὰς ἐπαγγελίας
  choice: người có các lời hứa
  rationale: Giữ thì hiện tại của phân từ ἔχοντα và số nhiều của ἐπαγγελίας. Cụm từ nói về Áp-ra-ham là người mang những lời hứa đã được ban cho mình; phụ chú nêu cách diễn đạt theo mạch kể quá khứ.
- source_word: εὐλόγηκεν
  choice: đã chúc phước
  rationale: Dịch thể hoàn thành bằng “đã chúc phước”, diễn tả hành động đã xảy ra và vẫn có giá trị trong lập luận hiện tại của thư.
- source_word: Ἀβραάμ
  choice: Áp-ra-ham
  rationale: Dạng tên riêng quen dùng và dễ nhận biết trong tiếng Việt.
theological_decisions:
- issue: Ý nghĩa của việc Mên-chi-xê-đéc không thuộc gia phả của họ
  choice: Hiểu đây là sự tương phản về gia phả với dòng Lê-vi.
  alternative: Hiểu rộng hơn rằng ông không phải là hậu duệ của họ, hoặc suy diễn rằng ông không có nguồn gốc con người.
  rationale: Ngữ cảnh bàn về quyền nhận phần mười của chức tế lễ Lê-vi. Bản dịch giữ ý nghĩa gia phả/pháp lý mà không đưa thêm kết luận bản thể học về Mên-chi-xê-đéc.
- issue: Thì của τὸν ἔχοντα τὰς ἐπαγγελίας
  choice: người có các lời hứa
  alternative: người đã có các lời hứa
  rationale: Phân từ Hy Lạp ở thì hiện tại; bản chính bảo lưu hình thức này, còn phụ chú ghi nhận cách diễn đạt quá khứ tự nhiên theo mạch thuật chuyện.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “một phần mười” thay vì chỉ dùng thuật ngữ “phần mười” để làm rõ nghĩa; giữ “các lời hứa” theo số nhiều của nguyên văn. Tất cả dấu phụ chú đều xuất hiện trong câu chính.
