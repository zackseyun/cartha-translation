id: HEB.7.3
reference: Hebrews 7:3
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀπάτωρ, ἀμήτωρ, ἀγενεαλόγητος, μήτε ἀρχὴν ἡμερῶν μήτε ζωῆς τέλος ἔχων, ἀφωμοιωμένος δὲ τῷ υἱῷ τοῦ θεοῦ, μένει ἱερεὺς εἰς τὸ διηνεκές.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/003.yaml
  text: without father[a], without mother, without genealogy, having neither beginning of days nor end of life, but being made like the Son of God[b], he remains a priest perpetually.
translation:
  language: vi
  text: Người không cha, không mẹ, không gia phả[a], không có ngày đầu, cũng không có ngày cuối của sự sống; nhưng được làm cho giống như Con Đức Chúa Trời, người vẫn là thầy tế lễ mãi mãi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể hiểu là “không có gia phả được ghi lại.” Sáng Thế Ký không ghi cha mẹ hay gia phả của Mên-chi-xê-đéc; thư Hê-bơ-rơ dùng sự im lặng ấy theo lối hình bóng.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “luôn luôn” hoặc “cho mọi thời.” Cụm từ nhấn mạnh tính bền vững của chức tế lễ trong cách Kinh Thánh trình bày.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπάτωρ, ἀμήτωρ, ἀγενεαλόγητος
  choice: không cha, không mẹ, không gia phả
  rationale: Giữ nguyên cấu trúc ba vế phủ định cô đọng của tiếng Hy Lạp. Cách diễn đạt không tự ý biến sự im lặng của ký thuật thành lời khẳng định siêu hình; chú thích nêu rõ khả năng hiểu theo hồ sơ gia phả.
- source_word: μήτε ἀρχὴν ἡμερῶν μήτε ζωῆς τέλος ἔχων
  choice: không có khởi đầu của những ngày đời, cũng không có kết thúc của sự sống
  rationale: Bảo tồn hai vế phủ định song song và sắc thái trang trọng của thành ngữ Hy Lạp, đồng thời dùng ‘những ngày đời’ để câu tiếng Việt dễ hiểu hơn.
- source_word: ἀφωμοιωμένος
  choice: được làm cho giống như
  rationale: Giữ thể bị động của phân từ hoàn thành và diễn đạt một sự tương đồng bền vững, không đồng nhất Mên-chi-xê-đéc với Con Đức Chúa Trời.
- source_word: τῷ υἱῷ τοῦ θεοῦ
  choice: Con Đức Chúa Trời
  rationale: Dùng danh hiệu Cơ Đốc học trang trọng, quen thuộc trong tiếng Việt, không thêm cách giải thích giáo phái.
- source_word: μένει ἱερεὺς
  choice: vẫn là thầy tế lễ
  rationale: ‘Vẫn là’ diễn tả trạng thái tiếp tục của μένει; ‘thầy tế lễ’ là cách gọi rõ ràng, phổ thông cho ἱερεύς trong bối cảnh Kinh Thánh.
- source_word: εἰς τὸ διηνεκές
  choice: mãi mãi
  rationale: Diễn tả tính liên tục, bền lâu của chức tế lễ bằng cách nói tự nhiên trong tiếng Việt; chú thích giữ các sắc thái ‘luôn luôn’ và ‘cho mọi thời’.
theological_decisions:
- issue: Câu này nói Mên-chi-xê-đéc thật sự không có cha mẹ và sống đời đời, hay mô tả ông theo cách Kinh Thánh trình bày để làm hình bóng?
  choice: Giữ nguyên các lời mô tả mạnh của bản văn, đồng thời dùng ‘được làm cho giống như’ để bảo toàn lập luận về sự tương đồng với Con Đức Chúa Trời.
  alternative: Hiểu Mên-chi-xê-đéc là sự hiện ra của Con trước khi nhập thể, hoặc là một hữu thể thật sự không cha mẹ và vĩnh cửu.
  rationale: Bản văn Hy Lạp nói ông được làm cho giống Con, chứ không nói ông chính là Con. Sự vắng mặt của gia phả, sự ra đời và cái chết trong ký thuật Sáng Thế Ký tạo nền cho hình bóng, nhưng bản dịch không nên giải quyết dứt khoát sự căng thẳng mà câu văn cố ý duy trì.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Câu giữ nhịp liệt kê cùng các cặp phủ định của nguyên bản, tránh từ ngữ quá chuyên môn; ‘những ngày đời’ duy trì sắc thái Kinh Thánh mà vẫn tự nhiên.
