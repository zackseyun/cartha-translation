  source_fidelity: Bản dịch giữ đúng chuỗi ba tính từ phủ định, cặp phủ định về khởi đầu/kết thúc, thể bị động của ἀφωμοιωμένος, và ý nghĩa tiếp diễn của μένει. Tuy nhiên, “khởi đầu của những ngày đời” thêm sắc thái “đời” không có trực tiếp trong nguyên ngữ và không tự nhiên bằng cách diễn đạt thành ngữ hơn.
  naturalness: “Những ngày đời” gượng trong tiếng Việt hiện đại. “Ngày đầu, cũng không có ngày cuối của sự sống” tự nhiên, sáng rõ, đồng thời vẫn giữ phép song đối của nguyên văn. Cấu trúc còn lại trang trọng và phù hợp.
  terminology: “Con Đức Chúa Trời” và “thầy tế lễ” phù hợp văn phong Kinh Thánh tiếng Việt. “Gia phả” truyền đạt sát ἀγενεαλόγητος. Chú thích nên diễn đạt “theo lối hình bóng” tự nhiên hơn “theo nghĩa hình bóng,” mà không biến cách đọc hình bóng thành một khẳng định siêu hình về Mên-chi-xê-đéc.
