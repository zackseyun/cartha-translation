revisions:
- from: Người không cha, không mẹ, không gia phả[a], không có khởi đầu của những ngày đời, cũng không có kết thúc của sự sống, nhưng được làm cho giống như Con Đức Chúa Trời, thì vẫn là thầy tế lễ mãi mãi.[b]
  to: Người không cha, không mẹ, không gia phả[a], không có ngày đầu, cũng không có ngày cuối của sự sống; nhưng được làm cho giống như Con Đức Chúa Trời, người vẫn là thầy tế lễ mãi mãi.[b]
  rationale: Thay “khởi đầu của những ngày đời” bằng “ngày đầu” để tiếng Việt tự nhiên hơn, không thêm sắc thái không có trong nguyên ngữ, và vẫn bảo tồn cặp đối ứng “ngày đầu/ngày cuối.” Thay đổi nhỏ trong chú thích cải thiện tính tự nhiên mà không áp đặt cách giải thích giáo phái. Các neo chú thích vẫn gắn đúng với “gia phả” và “mãi mãi.”
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T21:28:12Z'
