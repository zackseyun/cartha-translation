revisions:
- from: 'còn vị này trở nên thầy tế lễ với một lời thề, qua Đấng đã phán với Người: “Chúa đã thề và sẽ không đổi ý: ‘Con là thầy tế lễ đời đời.’”[a]'
  to: 'còn vị này trở nên thầy tế lễ với một lời thề, nhờ Đấng đã phán với Ngài: “Chúa đã thề và sẽ không đổi ý: ‘Ngài là thầy tế lễ đời đời.’”[a]'
  rationale: Thay “Con” bằng “Ngài” để không áp đặt quan hệ con cái vốn không được nêu bằng σύ, đồng thời giữ ngữ điệu tôn kính tự nhiên. Điều chỉnh cụm dẫn lời cho trôi chảy hơn và thay chú thích đại từ không thích hợp bằng chú thích về thì aorist có cơ sở ngữ pháp.
