language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὁ δὲ μετὰ ὁρκωμοσίας διὰ τοῦ λέγοντος πρὸς αὐτόν· Ὤμοσεν κύριος, καὶ οὐ μεταμεληθήσεται, Σὺ ἱερεὺς εἰς τὸν ⸀αἰῶνα),
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/021.yaml
  text: but this one became a priest with an oath through the one who said to him[a], “The Lord has sworn and will not change his mind, ‘You are a priest forever.’”
translation:
  language: vi
  text: 'còn vị này trở nên thầy tế lễ với một lời thề, nhờ Đấng đã phán với Ngài: “Chúa đã thề và sẽ không đổi ý: ‘Ngài là thầy tế lễ đời đời.’”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Chúa thề và sẽ không đổi ý.” Động từ Hy Lạp Ὤμοσεν ở thì aorist có thể được dịch là “đã thề” hoặc “thề.”'
    reason: Phản ánh phương án dịch hợp lệ của Ὤμοσεν theo bản tiếng Anh đối chiếu; không thêm sắc thái quan hệ vào đại từ ngôi thứ hai số ít.
lexical_decisions:
- source_word: ὁ δὲ
  choice: còn vị này
  rationale: Giữ sự tương phản với các thầy tế lễ trước đó trong câu 20, đồng thời diễn đạt tự nhiên cấu trúc tỉnh lược của tiếng Hy Lạp.
- source_word: μετὰ ὁρκωμοσίας
  choice: với một lời thề
  rationale: Diễn tả hoàn cảnh đi kèm và phương tiện, đồng thời giữ rõ sự tương phản với việc các thầy tế lễ Lê-vi được lập mà không có lời thề.
- source_word: διὰ τοῦ λέγοντος πρὸς αὐτόν
  choice: qua Đấng đã phán với Người
  rationale: Giữ nghĩa tác nhân của διά với sở hữu cách. Viết hoa “Đấng” chỉ Đức Chúa Trời là Đấng phán, còn “Người” chỉ vị thầy tế lễ được ngỏ lời, giúp câu tiếng Việt rõ mà không thêm nội dung thần học ngoài văn bản.
- source_word: Ὤμοσεν κύριος
  choice: Chúa đã thề
  rationale: Thì quá khứ với “đã” phản ánh trực tiếp động từ aorist ὤμοσεν và vẫn phù hợp với lời tuyên bố trang trọng có hiệu lực lâu dài.
- source_word: κύριος
  choice: Chúa
  rationale: Phản ánh κύριος trong bản Hy Lạp; không tự động chuyển thành kiểu chữ đặc thù dành cho danh YHWH từ văn bản Hê-bơ-rơ nền.
- source_word: οὐ μεταμεληθήσεται
  choice: sẽ không đổi ý
  rationale: Trong ngữ cảnh lời thề, cụm này nói đến việc không đảo ngược ý định đã tuyên bố, chứ không phải ăn năn về mặt đạo đức.
- source_word: Σὺ ἱερεὺς
  choice: Con là thầy tế lễ
  rationale: Bổ sung động từ nối “là” vốn được hiểu ngầm trong tiếng Hy Lạp. “Con” là đại từ xưng hô tự nhiên khi Chúa trực tiếp phán với Đấng được nói đến; chú thích bảo tồn phương án trung tính hơn.
- source_word: εἰς τὸν αἰῶνα
  choice: đời đời
  rationale: Đây là cách diễn đạt tự nhiên, trang trọng trong tiếng Việt cho thành ngữ chỉ thời gian kéo dài không dứt.
theological_decisions:
- issue: Lời trích Thi Thiên 110:4 về chức tế lễ của Đấng được ngỏ lời
  choice: Nhấn mạnh rằng chức tế lễ này được thiết lập kèm lời thề của Chúa và tồn tại đời đời.
  alternative: Có thể dùng đại từ trung tính “Ngươi” thay cho “Con”, hoặc diễn đạt ὤμοσεν theo sắc thái kết quả hiện tại.
  rationale: Ngữ cảnh Hê-bơ-rơ đối chiếu các thầy tế lễ được lập không bằng lời thề với vị này được lập bằng lời thề. Bản dịch giữ sự tương phản và tính vĩnh viễn ấy mà không đưa thêm công thức tín lý hậu kỳ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “thầy tế lễ” để chỉ ἱερεύς, “lời thề” cho ὁρκωμοσία, và giữ nhịp của lời trích Kinh Thánh. Dấu chú thích [a] xuất hiện ngay sau lời trích.
