    issue: “Con” dịch σύ trong lời trích
    rationale: σύ chỉ ngôi thứ hai số ít, không tự nó xác định người được gọi là “Con”. Cách dịch này đưa vào bản văn một sắc thái quan hệ không có trong câu Hy Lạp này.
  - severity: medium
    issue: Chú thích [a] nêu “Ngươi” là hình thức trung tính
    rationale: Trong tiếng Việt hiện đại, “ngươi” thường mang sắc thái cổ, hạ thấp hoặc đối đầu; không phải lựa chọn trung tính trong lời phán trang trọng. Chú thích cũng bỏ qua phương án dịch aorist Ὤμοσεν phù hợp với audit trail.
