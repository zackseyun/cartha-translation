  source_fidelity: 'Bản dịch phản ánh đúng cấu trúc chính của câu Hy Lạp: sự tăng tiến của περισσότερον ἔτι, tính điều kiện hình thức của εἰ, sự xuất hiện của một thầy tế lễ khác, và tên Mên-chi-xê-đéc. Tuy nhiên, “theo hình mẫu của” có thể gợi một khuôn mẫu/nguyên mẫu hay sự mô phỏng có chủ ý mạnh hơn ὁμοιότητα (“sự tương tự, sự giống nhau”) yêu cầu.'
