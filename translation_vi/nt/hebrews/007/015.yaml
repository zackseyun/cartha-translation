source:
  edition: SBLGNT
  text: Καὶ περισσότερον ἔτι κατάδηλόν ἐστιν, εἰ κατὰ τὴν ὁμοιότητα Μελχισέδεκ ἀνίσταται ἱερεὺς ἕτερος,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/015.yaml
  text: And it is even more evident[a], if another priest arises according to the likeness of Melchizedek[b],
translation:
  language: vi
  text: Và điều này càng rõ ràng hơn nữa, nếu một thầy tế lễ khác[a] xuất hiện theo sự tương tự với Mên-chi-xê-đéc[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “một thầy tế lễ thuộc loại khác”; từ Hy Lạp ἕτερος có thể nhấn mạnh sự khác biệt chứ không chỉ thêm một người nữa.
    reason: lexical_alternative
  - marker: b
    text: Cụm từ “theo sự tương tự với Mên-chi-xê-đéc” tiếp nối cách diễn đạt và lập luận dựa trên Thi Thiên 110:4 trong chương này.
    reason: cross_reference
lexical_decisions:
- source_word: περισσότερον ἔτι
  choice: lại càng ... hơn nữa
  rationale: Cụm từ này tăng cường mức độ của điều đã được khẳng định trong mạch lập luận; cách diễn đạt này tự nhiên trong tiếng Việt và giữ được sức nhấn mạnh gia tăng.
- source_word: κατάδηλόν
  choice: hiển nhiên
  rationale: Từ này chỉ điều rõ ràng, dễ nhận thấy. “Hiển nhiên” trang trọng vừa phải và tránh lặp thêm một từ tăng cường vốn đã được diễn đạt bởi περισσότερον ἔτι.
- source_word: εἰ
  choice: nếu
  rationale: Giữ nguyên hình thức điều kiện của tiếng Hy Lạp, dù trong mạch lập luận sắc thái có thể gần với “vì” hoặc “khi”.
- source_word: κατὰ τὴν ὁμοιότητα
  choice: theo hình mẫu của
  rationale: Diễn đạt mối tương ứng hoặc tương đồng làm nền cho chức tế lễ, đồng thời giữ sắc thái về một khuôn mẫu mà không giải thích quá mức.
- source_word: Μελχισέδεκ
  choice: Mên-chi-xê-đéc
  rationale: Phiên âm tên riêng theo cách dùng Kinh Thánh tiếng Việt quen thuộc.
- source_word: ἀνίσταται
  choice: xuất hiện
  rationale: Trong ngữ cảnh này, động từ nói đến việc một thầy tế lễ khác xuất hiện trong lịch sử hoặc bước vào vai trò ấy; “xuất hiện” tự nhiên và không gợi nghĩa phục sinh quá mạnh.
- source_word: ἱερεὺς ἕτερος
  choice: một thầy tế lễ khác
  rationale: Cách dịch tự nhiên, giữ được ý về một thầy tế lễ khác với chức tế lễ đang được bàn đến; sắc thái “khác loại” có thể có của ἕτερος được ghi ở chú thích.
theological_decisions:
- issue: Sắc thái của ἕτερος đối với chức tế lễ
  choice: một thầy tế lễ khác
  alternative: một thầy tế lễ thuộc loại khác
  rationale: Câu này nói đến một thầy tế lễ khác biệt với hàng tế lễ Lê-vi và tương ứng với Mên-chi-xê-đéc. Bản chính giữ cách nói tự nhiên và không áp đặt mức độ khác biệt mạnh hơn điều từ Hy Lạp nhất thiết đòi hỏi; khả năng nhấn mạnh sự khác loại được bảo lưu trong chú thích.
translation_notes:
  register: Ngôn ngữ hiện đại, trang trọng vừa phải và dễ hiểu. “Thầy tế lễ” được chọn thay cho thuật ngữ mang màu sắc truyền thống hệ phái rõ hơn. Dấu phẩy cuối câu được giữ vì câu Hy Lạp tiếp tục sang câu kế tiếp.
