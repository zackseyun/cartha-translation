  source_fidelity: Bản nháp truyền đạt đúng lập luận về Lê-vi hiện diện theo dòng dõi trong Áp-ra-ham và nhận diện đúng người được Mên-chi-xê-đéc gặp. Tuy nhiên, “ở trong lòng tổ phụ mình” không bảo tồn được hình ảnh ἐν τῇ ὀσφύϊ (“trong thắt lưng/loins”); trong tiếng Việt hiện đại, “lòng” trước hết gợi bụng, dạ lòng, hoặc cung lòng và có thể làm thay đổi hình ảnh sinh sản–gia hệ của nguyên văn.
  naturalness: Cấu trúc câu tự nhiên, nhưng “ông ấy” thiếu một tiền ngữ ngay trong câu và vì thế dễ gây vướng mắc khi đọc tách câu. Dùng tên Áp-ra-ham tại vị trí đại từ là một làm rõ tối thiểu, cần thiết trong tiếng Việt; danh từ “tổ phụ mình” vẫn giữ quan hệ gia hệ của τοῦ πατρός.
  terminology: Giữ “Lê-vi,” “Mên-chi-xê-đéc,” và “Áp-ra-ham” theo dạng phiên âm Kinh Thánh quen dùng. “Thắt lưng” là tương đương cụ thể nhất cho ὀσφύς; chú thích giải thích đây là thành ngữ về hậu duệ, không phải một khẳng định theo nghĩa đen.
