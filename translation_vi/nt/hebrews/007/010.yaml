  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἔτι γὰρ ἐν τῇ ὀσφύϊ τοῦ πατρὸς ἦν ὅτε συνήντησεν αὐτῷ ⸀Μελχισέδεκ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/010.yaml
  text: For he was still in the loins of his father when Melchizedek met him[a].
translation:
  language: vi
  text: Vì khi Mên-chi-xê-đéc gặp Áp-ra-ham, Lê-vi vẫn còn ở trong thắt lưng của tổ phụ mình.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “ở trong thắt lưng của cha mình.” Đây là thành ngữ chỉ nguồn gốc theo dòng dõi: khi ấy Lê-vi chưa sinh ra, còn thuộc dòng dõi của tổ phụ mình là Áp-ra-ham.'
    reason: Giải thích thành ngữ Hy Lạp và làm rõ “cha mình” trong ngữ cảnh chỉ tổ phụ Áp-ra-ham.
lexical_decisions:
- source_word: ἔτι
  choice: vẫn còn
  rationale: Diễn tả tình trạng còn tiếp diễn vào thời điểm cuộc gặp xảy ra.
- source_word: γὰρ
  choice: Vì
  rationale: Giữ chức năng giải thích của câu này đối với lập luận ở câu trước.
- source_word: ἐν τῇ ὀσφύϊ
  choice: ở trong lòng
  rationale: Giữ hình ảnh cụ thể của thành ngữ Hy Lạp về nguồn gốc sinh thành, đồng thời dùng cách diễn đạt trang trọng và tương đối tự nhiên trong tiếng Việt.
- source_word: τοῦ πατρὸς
  choice: tổ phụ mình
  rationale: Trong ngữ cảnh gia phả, πατήρ chỉ tổ tiên là Áp-ra-ham chứ không phải người cha trực tiếp; “tổ phụ” truyền đạt đúng quan hệ mà không chèn tên riêng vào chính văn.
- source_word: ἦν
  choice: còn ở
  rationale: Kết hợp tự nhiên với ἔτι trong tiếng Việt để diễn đạt thì chưa hoàn thành của động từ “là/ở”.
- source_word: ὅτε
  choice: khi
  rationale: Liên từ thời gian trực tiếp và tự nhiên.
- source_word: συνήντησεν
  choice: gặp
  rationale: Diễn đạt ngắn gọn sự gặp gỡ được nhắc lại từ trình thuật Sáng Thế Ký.
- source_word: αὐτῷ
  choice: ông ấy
  rationale: Giữ đại từ của nguyên văn; trong ngữ cảnh, đại từ chỉ Áp-ra-ham.
- source_word: Μελχισέδεκ
  choice: Mên-chi-xê-đéc
  rationale: Phiên âm tên riêng theo dạng quen dùng trong Kinh Thánh tiếng Việt.
theological_decisions:
- issue: Cách diễn đạt việc Lê-vi thuộc dòng dõi Áp-ra-ham
  choice: Giữ hình ảnh “ở trong lòng tổ phụ mình” trong chính văn
  alternative: vẫn còn ở trong thân thể tổ tiên mình; vẫn còn ở trong dòng giống của tổ phụ mình
  rationale: Cách chọn này bảo tồn lập luận mang tính đại diện và huyết thống của tác giả mà không biến nó thành một lời giải thích thần học kỹ thuật.
- issue: Chủ thể ngầm của ἦν
  choice: Nêu rõ “Lê-vi”
  alternative: ông vẫn còn
  rationale: Tiếng Hy Lạp dựa vào chủ thể ở câu trước; tiếng Việt cần nhắc lại “Lê-vi” để câu đứng riêng được rõ nghĩa.
- issue: Ý nghĩa của τοῦ πατρός
  choice: tổ phụ mình
  alternative: cha mình; tổ phụ Áp-ra-ham
  rationale: “Cha mình” dễ bị hiểu là cha trực tiếp, còn thêm “Áp-ra-ham” sẽ cụ thể hóa điều nguyên văn chỉ biểu đạt bằng danh từ quan hệ. “Tổ phụ mình” giữ đúng quan hệ gia phả trong văn cảnh.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Chính văn giữ hình ảnh huyết thống của nguyên tác nhưng dùng “lòng tổ phụ” thay cho cách dịch sát chữ khó tự nhiên là “thắt lưng”; chú thích bảo tồn nghĩa đen và làm rõ thành ngữ.
