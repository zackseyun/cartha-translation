  text: Καὶ καθ’ ὅσον οὐ χωρὶς ὁρκωμοσίας (οἱ μὲν γὰρ χωρὶς ὁρκωμοσίας εἰσὶν ἱερεῖς γεγονότες,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/020.yaml
  text: And inasmuch as this was not without an oath (for they indeed have become priests without an oath,[a]
translation:
  language: vi
  text: Và điều này đã không diễn ra mà không có lời thề (vì những người kia đã trở thành thầy tế lễ mà không có lời thề,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “không phải là không có lời thề.”'
    reason: Phương án này phản ánh phép phủ định nhấn mạnh của οὐ χωρὶς ὁρκωμοσίας bằng tiếng Việt tự nhiên.
lexical_decisions:
- source_word: Καὶ
  choice: Và
  rationale: Giữ liên từ nối câu này với lập luận ngay trước đó.
- source_word: καθ’ ὅσον
  choice: vì
  rationale: Trong cấu trúc lập luận kéo dài sang câu 22, cụm này nêu căn cứ cho kết luận tiếp theo. “Vì” diễn đạt tự nhiên trong tiếng Việt hiện đại, dù sắc thái tương quan về mức độ sẽ được hoàn tất ở phần tiếp theo.
- source_word: οὐ χωρὶς ὁρκωμοσίας
  choice: không diễn ra mà không có lời thề
  rationale: Giữ nguyên phép phủ định nhấn mạnh của οὐ χωρὶς và diễn đạt rõ rằng việc thiết lập chức tế lễ được nói đến không thiếu lời thề.
- source_word: ὁρκωμοσίας
  choice: lời thề
  rationale: Danh từ chỉ hành vi hoặc lời tuyên thệ xác nhận; “lời thề” là cách nói tự nhiên, trang trọng và phù hợp ngữ cảnh.
- source_word: οἱ μὲν γὰρ
  choice: quả thật, những người kia
  rationale: “Quả thật” chuyển tải lực giải thích của γάρ và phần nhấn mạnh, chuẩn bị cho thế đối lập μέν…δέ tiếp tục ở câu sau; “những người kia” không đưa danh tính của họ vào chính văn khi nguyên văn chỉ dùng đại từ.
- source_word: χωρὶς ὁρκωμοσίας
  choice: không có lời thề
  rationale: Diễn đạt ngắn gọn và nhất quán về ý nghĩa với lần xuất hiện trước, đồng thời tự nhiên hơn khi bổ nghĩa cho việc trở thành thầy tế lễ.
- source_word: εἰσὶν ἱερεῖς γεγονότες
  choice: đã trở thành thầy tế lễ
  rationale: Phản ánh cấu trúc chu chuyển εἰμί + phân từ hoàn thành, nhấn mạnh việc họ đã bước vào chức vụ và hiện ở trong địa vị ấy.
theological_decisions:
- issue: Đối tượng của sự tương phản giữa các thầy tế lễ trước kia và vị được lập bằng lời thề
  choice: Giữ cách gọi “những người kia”, để ngữ cảnh xác định họ là các thầy tế lễ thuộc chức tế lễ trước đó, đối lập với chức tế lễ của Chúa Giê-su được thiết lập bằng lời thề.
  alternative: Nêu thẳng “các thầy tế lễ Lê-vi” hoặc mở rộng thành toàn bộ chức tế lễ của giao ước cũ.
  rationale: Ngữ cảnh Hê-bơ-rơ 7 cho thấy sự tương phản ấy, nhưng chính câu này không gọi đích danh họ; vì vậy bản dịch không thêm kết luận thần học vượt quá lời văn.
- issue: Cấu trúc câu chưa hoàn tất trong câu 20
  choice: Giữ dấu ngoặc mở và dấu phẩy cuối câu để phản ánh rằng lập luận cùng thế đối lập μέν…δέ tiếp tục sang các câu 21–22.
  alternative: Khép câu hoặc bổ sung một mệnh đề kết luận ngay trong câu 20.
  rationale: Nguyên văn câu 20 là phần mở của một cấu trúc cú pháp kéo dài; tự ý khép hoặc bổ sung sẽ làm mất quan hệ lập luận và thêm nội dung không có trong nguồn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cụm “thầy tế lễ” được dùng theo lối gọi quen thuộc trong tiếng Việt Kinh Thánh. Câu được để mở có chủ ý vì cú pháp và lập luận tiếp tục sang câu kế tiếp.
