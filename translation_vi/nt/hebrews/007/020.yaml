  rationale: Chỉnh “không diễn ra” thành “đã không diễn ra” để phù hợp hơn với sự việc được hàm ý trong lập luận và với phân từ hoàn thành γεγονότες. Giữ cấu trúc để mở, đại từ quy chiếu không xác định quá mức, và các thuật ngữ then chốt. Chú thích được thay bằng một lựa chọn tiếng Việt tự nhiên hơn, không thay đổi nghĩa.
