source:
  edition: SBLGNT
  text: πρόδηλον γὰρ ὅτι ἐξ Ἰούδα ἀνατέταλκεν ὁ κύριος ἡμῶν, εἰς ἣν φυλὴν ⸂περὶ ἱερέων οὐδὲν⸃ Μωϋσῆς ἐλάλησεν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/014.yaml
  text: For it is evident that our Lord has arisen from Judah[a], a tribe about which Moses said nothing concerning priests.
translation:
  language: vi
  text: Vì hiển nhiên là Chúa chúng ta đã xuất thân từ Giu-đa[a], một chi phái mà Môi-se không nói gì về các thầy tế lễ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đã mọc lên từ Giu-đa.” Động từ Hy Lạp gợi hình ảnh mọc lên hoặc trỗi dậy; tại đây, từ này nói đến nguồn gốc từ chi phái Giu-đa, chứ không chủ yếu nói đến sự phục sinh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πρόδηλον
  choice: rõ ràng
  rationale: Diễn đạt tự nhiên mệnh đề tính từ vô nhân xưng, nêu một sự thật hiển nhiên trong lập luận.
- source_word: γὰρ
  choice: Vì
  rationale: Giữ quan hệ giải thích với lập luận ngay trước đó.
- source_word: ἐξ Ἰούδα
  choice: từ Giu-đa
  rationale: Biểu thị nguồn gốc hoặc dòng dõi; mệnh đề sau đã nói rõ đây là một bộ tộc.
- source_word: ἀνατέταλκεν
  choice: đã xuất thân
  rationale: Trong ngữ cảnh bàn về bộ tộc, động từ chỉ việc phát xuất từ Giu-đa. Cách dịch này tự nhiên trong tiếng Việt, còn hình ảnh 'mọc lên' được bảo tồn trong chú thích.
- source_word: ὁ κύριος ἡμῶν
  choice: Chúa chúng ta
  rationale: Giữ nguyên tước hiệu và cách sở hữu tự nhiên trong tiếng Việt, không thêm tên 'Giê-su' dù ngữ cảnh xác định Ngài.
- source_word: εἰς ἣν φυλήν
  choice: là bộ tộc mà
  rationale: Nối Giu-đa với mệnh đề quan hệ một cách tự nhiên và làm rõ φυλή chỉ bộ tộc vừa được nhắc đến.
- source_word: περὶ ἱερέων οὐδὲν
  choice: không nói gì về các thầy tế lễ
  rationale: Giữ đối tượng cụ thể là các thầy tế lễ, không chuyển thành khái niệm trừu tượng 'chức tế lễ'.
- source_word: Μωϋσῆς ἐλάλησεν
  choice: Môi-se không nói
  rationale: Cách diễn đạt hiện đại, trực tiếp, phù hợp nghĩa thông thường của λαλέω trong câu này.
theological_decisions:
- issue: Đối tượng của cụm từ 'Chúa chúng ta'
  choice: Giữ nguyên 'Chúa chúng ta', theo ngữ cảnh chỉ về Chúa Giê-su.
  alternative: Thêm rõ 'Chúa Giê-su của chúng ta'.
  rationale: Bối cảnh xác định đối tượng, nhưng nguyên văn chỉ dùng tước hiệu; không nên thêm tên vào chính văn.
- issue: Sắc thái của ἀνατέταλκεν
  choice: Dịch 'đã xuất thân' để chỉ nguồn gốc từ Giu-đa, đồng thời chú thích hình ảnh 'mọc lên'.
  alternative: Dịch trực tiếp 'đã mọc lên' hoặc 'đã trỗi dậy'.
  rationale: Ngữ cảnh trực tiếp nói về bộ tộc và tư cách tế lễ, nên trọng tâm là dòng dõi chứ không chủ yếu là sự phục sinh. Chú thích giữ lại ẩn dụ nguyên ngữ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng 'thầy tế lễ' cho ἱερεύς và 'bộ tộc' cho φυλή; giữ tên riêng theo dạng tiếng Việt quen dùng.
