  source_fidelity: 'Bản dịch truyền đạt đúng mạch lập luận: Chúa chúng ta có nguồn gốc từ Giu-đa, còn Môi-se không nói gì về các thầy tế lễ liên hệ với chi phái ấy. “Đã xuất thân” diễn đạt phù hợp ἀνατέταλκεν trong ngữ cảnh dòng dõi; chú thích bảo lưu hình ảnh từ vựng của động từ.'
  naturalness: 'Câu hiện tại có chỗ mơ hồ về cú pháp: “Giu-đa, là bộ tộc mà...” có thể khiến “Chúa chúng ta” bị đọc như đồng nhất với “bộ tộc”. Đổi sang cấu trúc đồng vị “Giu-đa, một chi phái mà...” vừa tự nhiên vừa làm rõ đối tượng của mệnh đề quan hệ.'
