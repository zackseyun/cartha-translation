    rationale: Sau mệnh đề “Chúa chúng ta đã xuất thân từ Giu-đa”, cụm “là bộ tộc mà” có thể bị hiểu ngữ pháp là vị ngữ tiếp theo nói về “Chúa chúng ta”. Cấu trúc đồng vị “Giu-đa, một chi phái mà...” xác định rõ rằng chi phái là Giu-đa.
  - severity: low
    issue: “Bộ tộc” chưa phải thuật ngữ nhất quán nhất cho φυλή trong bối cảnh Israel.
    rationale: “Chi phái” là cách gọi hiện đại, chuẩn xác và quen thuộc hơn cho các đơn vị như Giu-đa trong truyền thống Israel.
  revised_text: Vì hiển nhiên là Chúa chúng ta đã xuất thân từ Giu-đa[a], một chi phái mà Môi-se không nói gì về các thầy tế lễ.
