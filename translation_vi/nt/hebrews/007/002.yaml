id: HEB.7.2
reference: Hebrews 7:2
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ᾧ καὶ δεκάτην ἀπὸ πάντων ἐμέρισεν Ἀβραάμ, πρῶτον μὲν ἑρμηνευόμενος βασιλεὺς δικαιοσύνης ἔπειτα δὲ καὶ βασιλεὺς Σαλήμ, ὅ ἐστιν βασιλεὺς εἰρήνης,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/002.yaml
  text: to whom Abraham also apportioned a tenth of everything[a]. First, his name is translated King of Righteousness, and then also King of Salem, that is[b], King of Peace.
translation:
  language: vi
  text: Áp-ra-ham cũng chia cho ông một phần mười của mọi thứ[a]. Trước hết, tên ông được giải nghĩa là “Vua công chính”; kế đến, ông cũng là “Vua Sa-lem”, nghĩa là “Vua bình an”[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “phần mười”. Tiếng Hy Lạp nói theo nghĩa đen là “một phần mười”.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “Vua công lý”. Từ Hy Lạp có thể mang nghĩa “sự công chính” hoặc “công lý”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾧ καὶ ... ἐμέρισεν Ἀβραάμ
  choice: Áp-ra-ham cũng chia cho ông
  rationale: Đại từ quan hệ cách cho chỉ Mên-chi-xê-đéc là người nhận; đảo thành mệnh đề thuận giúp tiếng Việt tự nhiên. “Chia cho” giữ sắc thái phân chia/phân phần của ἐμέρισεν.
- source_word: δεκάτην ἀπὸ πάντων
  choice: một phần mười của mọi thứ
  rationale: Diễn đạt sát nghĩa đen “một phần mười” và giữ phạm vi khái quát của πάντων, không tự ý bổ sung “chiến lợi phẩm” từ ngữ cảnh rộng hơn.
- source_word: πρῶτον μὲν ἑρμηνευόμενος
  choice: Trước hết, tên ông được giải nghĩa là
  rationale: Phân từ nói đến ý nghĩa của tên Mên-chi-xê-đéc; thêm “tên ông” làm rõ điều vốn hàm ẩn và tạo câu tiếng Việt tự nhiên.
- source_word: βασιλεὺς δικαιοσύνης
  choice: Vua Công Chính
  rationale: “Công chính” truyền đạt δικαιοσύνη tự nhiên trong văn phong Kinh Thánh tiếng Việt, bao gồm phẩm chất ngay thẳng/chính trực mà không thu hẹp chỉ vào công lý pháp lý.
- source_word: ἔπειτα δὲ καὶ βασιλεὺς Σαλήμ
  choice: kế đến, ông cũng là “Vua Sa-lem”
  rationale: Giữ trình tự và yếu tố “cũng” của nguyên văn; phiên âm địa danh Σαλήμ theo lối Việt hóa dễ đọc.
- source_word: ὅ ἐστιν βασιλεὺς εἰρήνης
  choice: nghĩa là “Vua Bình An”
  rationale: “Nghĩa là” giới thiệu lời giải thích tên Sa-lem; “bình an” là cách diễn đạt trang trọng, quen thuộc và đủ rộng cho εἰρήνη.
theological_decisions:
- issue: Ý nghĩa của δικαιοσύνη trong tước hiệu
  choice: công chính
  alternative: công lý
  rationale: δικαιοσύνη có thể chỉ sự công chính hoặc công lý. Trong lời giải nghĩa tên Mên-chi-xê-đéc, “Vua Công Chính” giữ nghĩa rộng và âm hưởng thần học của từ; khả năng “công lý” được bảo tồn trong chú thích.
- issue: Quan hệ giữa tên Mên-chi-xê-đéc và tước hiệu
  choice: tên ông được giải nghĩa là “Vua Công Chính”
  alternative: khi được phiên dịch, ông là “Vua Công Chính”
  rationale: Nguyên văn dùng phân từ có thể dịch sát theo cấu trúc thứ hai, nhưng ý đang giải thích ý nghĩa tên. Cách chọn làm rõ tham chiếu mà không khẳng định thêm điều vượt quá văn bản.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng câu chủ động và trật tự tự nhiên; đặt các tước hiệu trong ngoặc kép để làm rõ phần giải nghĩa tên. Mọi dấu chú thích đều xuất hiện trong chính văn.
