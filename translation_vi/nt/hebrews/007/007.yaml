  text: χωρὶς δὲ πάσης ἀντιλογίας τὸ ἔλαττον ὑπὸ τοῦ κρείττονος εὐλογεῖται.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/007.yaml
  text: Beyond all dispute[a], the lesser is blessed by the greater.
translation:
  language: vi
  text: 'Không thể chối cãi được: người có địa vị thấp hơn được người có địa vị cao hơn ban phước.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “không có bất kỳ sự tranh luận nào” hoặc “không thể phủ nhận.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: χωρὶς δὲ πάσης ἀντιλογίας
  choice: Không còn gì phải bàn cãi
  rationale: Cụm này nêu một điều được xem là hiển nhiên, không thể tranh luận hay bác lại. Cách diễn đạt này tự nhiên trong tiếng Việt hiện đại và giữ được sức nhấn mạnh của χωρὶς πάσης ἀντιλογίας; δέ chỉ mang sắc thái chuyển ý nhẹ nên không cần dịch thành một từ nối riêng.
- source_word: τὸ ἔλαττον
  choice: người thấp hơn
  rationale: Tính từ so sánh trung tính được dùng như danh từ theo nghĩa khái quát. Trong ngữ cảnh Áp-ra-ham và Mên-chi-xê-đéc, tiếng Việt cần dùng “người”; “thấp hơn” diễn tả địa vị tương đối mà không hàm ý kém hơn về phẩm chất đạo đức.
- source_word: ὑπὸ τοῦ κρείττονος
  choice: được người cao hơn
  rationale: ὑπό với sở hữu cách chỉ tác nhân của động từ bị động. “Người cao hơn” giữ phép đối xứng về địa vị với “người thấp hơn” và phù hợp với lập luận của phân đoạn.
- source_word: εὐλογεῖται
  choice: ban phước
  rationale: Động từ hiện tại bị động nói đến việc nhận phước lành. Cấu trúc tiếng Việt “được… ban phước” truyền đạt trực tiếp hành động chúc phước trong bối cảnh tư tế.
theological_decisions:
- issue: Bản chất của sự so sánh giữa τὸ ἔλαττον và τοῦ κρείττονος
  choice: 'Diễn đạt một nguyên tắc chung về địa vị: người thấp hơn được người cao hơn ban phước.'
  alternative: Chỉ mô tả một tập quán xã hội, không mang sức nặng thần học.
  rationale: Trong Hê-bơ-rơ 7, nguyên tắc này hỗ trợ lập luận rằng Mên-chi-xê-đéc cao hơn Áp-ra-ham. Bản dịch giữ nguyên ngôn ngữ so sánh về địa vị, không thêm lời giải thích nhằm quyết định xa hơn điều câu văn nói.
translation_notes:
  register: Văn phong trang trọng nhưng tự nhiên, dễ hiểu đối với độc giả Việt Nam hiện đại. Dấu hai chấm làm rõ rằng mệnh đề sau là điều không còn gì phải bàn cãi; cặp “người thấp hơn/người cao hơn” bảo toàn cấu trúc so sánh của nguyên văn.
