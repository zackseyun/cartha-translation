id: HEB.7.28
reference: Hebrews 7:28
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὁ νόμος γὰρ ἀνθρώπους καθίστησιν ἀρχιερεῖς ἔχοντας ἀσθένειαν, ὁ λόγος δὲ τῆς ὁρκωμοσίας τῆς μετὰ τὸν νόμον υἱόν, εἰς τὸν αἰῶνα τετελειωμένον.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/028.yaml
  text: For the law appoints men as high priests who have weakness[a], but the word of the oath, which came after the law[b], appoints a Son who has been perfected forever.
translation:
  language: vi
  text: Vì luật pháp lập những người vốn mang sự yếu đuối làm thầy tế lễ thượng phẩm; còn lời thề, được ban sau luật pháp, thì lập Con, Đấng đã được làm cho trọn vẹn đời đời.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Được làm cho trọn vẹn” cũng có thể hiểu là “được đưa đến chỗ hoàn tất” hoặc, trong bối cảnh chức tế lễ, “được thánh hiến.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ νόμος
  choice: luật pháp
  rationale: Chỉ luật Môi-se, đặc biệt là các quy định về chức tế lễ; cách viết thường tự nhiên trong tiếng Việt và không làm mất quy chiếu.
- source_word: καθίστησιν
  choice: lập ... làm
  rationale: Diễn đạt việc chính thức đặt một người vào chức vụ, đồng thời phù hợp cú pháp tiếng Việt.
- source_word: ἀνθρώπους
  choice: những người
  rationale: Chỉ những con người giữ chức thượng tế qua các thế hệ; cụm từ tự nhiên và vẫn giữ sự tương phản với Con.
- source_word: ἀρχιερεῖς
  choice: thầy tế lễ thượng phẩm
  rationale: Thuật ngữ Kinh Thánh tiếng Việt quen thuộc cho chức vụ ἀρχιερεύς; số nhiều phản ánh nhiều người kế tiếp nhau giữ chức.
- source_word: ἔχοντας ἀσθένειαν
  choice: vốn mang sự yếu đuối
  rationale: Giữ danh từ 'sự yếu đuối' và bao hàm tình trạng hữu hạn, dễ sa ngã của con người, không thu hẹp thành bệnh tật thể chất.
- source_word: ὁ λόγος τῆς ὁρκωμοσίας
  choice: lời thề
  rationale: Diễn đạt gọn, tự nhiên ý 'lời/phán ngôn của lời thề', tức lời tuyên bố có tính thề nguyện của Đức Chúa Trời.
- source_word: τῆς μετὰ τὸν νόμον
  choice: được ban sau luật pháp
  rationale: Làm rõ lời thề được tuyên ban sau khi luật pháp đã có, phù hợp lập luận dựa trên Thi Thiên 110.
- source_word: υἱόν
  choice: Con
  rationale: Danh từ không có mạo từ nhưng trong ngữ cảnh chỉ rõ Con của Đức Chúa Trời. Tiếng Việt không có mạo từ tương ứng với 'a', nên 'Con' vừa tự nhiên vừa giữ sắc thái định tính và sự tương phản với 'những người'.
- source_word: εἰς τὸν αἰῶνα
  choice: đời đời
  rationale: Cách diễn đạt trang trọng, quen thuộc và chính xác về tính vĩnh viễn của chức tế lễ.
- source_word: τετελειωμένον
  choice: đã được làm cho trọn vẹn
  rationale: Phản ánh thể hoàn thành bị động và giữ trường nghĩa được đưa đến sự hoàn tất, đầy đủ hay thích hợp cho chức vụ, thay vì thu hẹp thành 'được biệt riêng'.
theological_decisions:
- issue: υἱόν không có mạo từ và sự tương phản với ἀνθρώπους
  choice: Con
  alternative: một Người Con; người Con ấy
  rationale: Tiếng Việt không bắt buộc biểu thị tính bất định như tiếng Anh. Viết hoa 'Con' nhận diện quy chiếu Kitô học trong ngữ cảnh, nhưng không thêm mạo từ xác định vốn không có trong nguyên văn.
- issue: Ý nghĩa của τετελειωμένον trong thần học chức tế lễ của thư Hê-bơ-rơ
  choice: đã được làm cho trọn vẹn
  alternative: đã được hoàn thiện; đã được thánh hiến
  rationale: Giữ nguyên sức căng giữa sự hoàn tất và sự thích hợp cho chức tế lễ, đồng thời phản ánh trạng thái hoàn thành còn hiệu lực của phân từ hoàn thành bị động; không giới hạn nghĩa vào nghi thức thánh hiến.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Dùng dấu chấm phẩy để làm nổi bật sự đối lập giữa luật pháp và lời thề. 'Thầy tế lễ thượng phẩm' giữ thuật ngữ Kinh Thánh quen thuộc; 'vốn mang sự yếu đuối' tránh cách nói gượng 'có sự yếu đuối'.
