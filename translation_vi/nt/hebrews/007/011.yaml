id: HEB.7.11
reference: Hebrews 7:11
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Εἰ μὲν οὖν τελείωσις διὰ τῆς Λευιτικῆς ἱερωσύνης ἦν, ὁ λαὸς γὰρ ἐπ’ ⸀αὐτῆς ⸀νενομοθέτηται, τίς ἔτι χρεία κατὰ τὴν τάξιν Μελχισέδεκ ἕτερον ἀνίστασθαι ἱερέα καὶ οὐ κατὰ τὴν τάξιν Ἀαρὼν λέγεσθαι;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/011.yaml
  text: If perfection had been through the Levitical priesthood—for on its basis the people had received the law—what further need was there for another priest to arise according to the order of Melchizedek and not be spoken of according to the order of Aaron?[a][b]
translation:
  language: vi
  text: Vậy, nếu sự hoàn thiện đạt được qua chức tế lễ Lê-vi—vì dân chúng đã được ban luật pháp trên nền tảng chức tế lễ ấy—thì còn cần gì phải có một thầy tế lễ khác xuất hiện theo ban Mên-chi-xê-đéc, mà không được gọi theo ban A-rôn?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “vì dân chúng đã được đặt dưới luật pháp trong khuôn khổ chức tế lễ ấy.” Cụm từ Hy Lạp cho thấy cơ cấu luật pháp của dân gắn với chức tế lễ Lê-vi.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “một thầy tế lễ khác trỗi dậy theo ban Mên-chi-xê-đéc và không được gọi theo ban A-rôn.”'
    reason: alternative_reading
lexical_decisions:
- source_word: τελείωσις
  choice: sự hoàn thiện
  rationale: Giữ sắc thái thần học và nghi lễ của từ trong thư Hê-bơ-rơ mà không thu hẹp thành sự cải thiện đạo đức hay chỉ là hoàn tất.
- source_word: διὰ τῆς Λευιτικῆς ἱερωσύνης
  choice: qua chức tế lễ Lê-vi
  rationale: διά với sở hữu cách chỉ phương tiện; “qua” tự nhiên và giữ đúng lập luận về phương tiện đưa đến sự hoàn thiện.
- source_word: ἐπ’ αὐτῆς
  choice: trên nền tảng chức tế lễ ấy
  rationale: Đại từ giống cái gần nhất quy chiếu về chức tế lễ Lê-vi; cách dịch làm rõ quan hệ nền tảng mà không đồng nhất chức tế lễ với luật pháp.
- source_word: νενομοθέτηται
  choice: đã được ban luật pháp
  rationale: Diễn đạt tự nhiên thể hoàn thành thụ động, chỉ việc dân đã được đặt dưới một व्यवस्था luật pháp.
- source_word: τίς ἔτι χρεία
  choice: thì còn cần gì
  rationale: Giữ sức mạnh của câu hỏi tu từ và diễn đạt tự nhiên trong tiếng Việt.
- source_word: κατὰ τὴν τάξιν Μελχισέδεκ
  choice: theo ban Mên-chi-xê-đéc
  rationale: “Ban” là cách gọi trang trọng, quen thuộc cho τάξις trong ngữ cảnh phẩm trật tế lễ, đồng thời có thể bao hàm kiểu mẫu hay trật tự được chỉ định.
- source_word: ἕτερον ... ἱερέα
  choice: một thầy tế lễ khác
  rationale: “Khác” giữ khả năng nhấn mạnh một thầy tế lễ thuộc loại hay trật tự khác, được làm rõ bởi sự đối chiếu với A-rôn.
- source_word: ἀνίστασθαι
  choice: xuất hiện
  rationale: Trong ngữ cảnh này chỉ việc một thầy tế lễ xuất hiện hoặc được thiết lập; tránh khiến độc giả mặc nhiên hiểu là sống lại.
- source_word: καὶ οὐ ... λέγεσθαι
  choice: chứ không được nói là
  rationale: Bám sát nghĩa thụ động của λέγεσθαι về cách vị tế lễ được nói đến hay xếp loại, đồng thời tự nhiên trong tiếng Việt.
- source_word: Μελχισέδεκ / Ἀαρών
  choice: Mên-chi-xê-đéc / A-rôn
  rationale: Phiên âm theo lối tên riêng Kinh Thánh quen thuộc trong tiếng Việt.
theological_decisions:
- issue: Ý nghĩa của τελείωσις trong lập luận về chức tế lễ
  choice: sự hoàn thiện
  alternative: sự hoàn tất; được đưa vào tình trạng trọn vẹn để đến gần Đức Chúa Trời
  rationale: “Sự hoàn thiện” bảo tồn sức nặng nghi lễ và cứu chuộc của thuật ngữ, để văn mạch thư Hê-bơ-rơ xác định nội hàm thay vì diễn giải quá mức ngay trong câu.
- issue: Từ mà αὐτῆς quy chiếu trong ἐπ’ αὐτῆς νενομοθέτηται
  choice: chức tế lễ Lê-vi
  alternative: luật pháp; toàn bộ cơ chế giao ước
  rationale: “Chức tế lễ” là tiền ngữ giống cái thích hợp gần nhất trong tiếng Hy Lạp, và mệnh đề xen giải thích mối quan hệ giữa luật pháp dành cho dân với hệ thống tế lễ.
- issue: Sắc thái của τάξις
  choice: ban
  alternative: trật tự; phẩm trật; kiểu mẫu
  rationale: Không xác định thuật ngữ chỉ đơn thuần là dòng kế vị hay cơ cấu tổ chức; “ban” giữ cách phân loại tế lễ và để ngỏ sắc thái kiểu mẫu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “chức tế lễ” cho ἱερωσύνη và “thầy tế lễ” cho ἱερεύς để phân biệt chức vụ với người đảm nhiệm. Giữ cấu trúc câu hỏi tu từ và mệnh đề giải thích xen giữa; “Vậy” chuyển tải οὖν theo nghĩa suy luận.
