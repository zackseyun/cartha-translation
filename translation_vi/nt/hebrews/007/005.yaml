reference: Hebrews 7:5
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ οἱ μὲν ἐκ τῶν υἱῶν Λευὶ τὴν ἱερατείαν λαμβάνοντες ἐντολὴν ἔχουσιν ἀποδεκατοῦν τὸν λαὸν κατὰ τὸν νόμον, τοῦτ’ ἔστιν τοὺς ἀδελφοὺς αὐτῶν, καίπερ ἐξεληλυθότας ἐκ τῆς ὀσφύος Ἀβραάμ·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/005.yaml
  text: And those from the sons of Levi who receive the priesthood have a commandment according to the law to collect a tenth from the people—that is[b][a], from their brothers—though they also have come from Abraham’s loins.
translation:
  language: vi
  text: Còn những người trong số các con trai Lê-vi nhận chức tế lễ thì theo luật pháp có điều răn phải thu một phần mười từ dân, tức là từ anh em của họ[a], mặc dù họ cũng xuất thân từ dòng dõi Áp-ra-ham[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “những người đồng bào Y-sơ-ra-ên của họ.” Tiếng Hy Lạp nói “anh em của họ,” dùng ngôn ngữ thân tộc giống đực để chỉ những người cùng thuộc về dân ấy.
    reason: lexical_alternative
  - marker: b
    text: 'Hay “là hậu duệ của Áp-ra-ham.” Theo sát nghĩa: “đã ra từ thắt lưng của Áp-ra-ham.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ μὲν ἐκ τῶν υἱῶν Λευὶ
  choice: những người trong số các con trai Lê-vi
  rationale: 'Giữ sắc thái phân bộ của ἐκ: không phải mọi người Lê-vi, mà là những người thuộc dòng Lê-vi được nhận chức tế lễ; đồng thời bảo lưu ngôn ngữ gia tộc của υἱῶν.'
- source_word: τὴν ἱερατείαν λαμβάνοντες
  choice: nhận chức tế lễ
  rationale: Diễn đạt tự nhiên trong tiếng Việt việc nhận lãnh địa vị/chức vụ tư tế, không hàm ý tự mình chiếm lấy chức ấy.
- source_word: ἐντολὴν ἔχουσιν
  choice: có điều răn
  rationale: Giữ cấu trúc danh từ và sắc thái quy định có thẩm quyền của ἐντολή.
- source_word: ἀποδεκατοῦν
  choice: thu một phần mười từ
  rationale: Làm rõ đây là thu phần mười từ người khác, chứ không phải chính họ dâng phần mười.
- source_word: τὸν λαὸν
  choice: dân chúng
  rationale: Dịch trực tiếp λαός; phần giải thích tiếp theo xác định đây là những người cùng thuộc dân Y-sơ-ra-ên.
- source_word: κατὰ τὸν νόμον
  choice: theo luật pháp
  rationale: Giữ ý chuẩn mực pháp lý của κατά với đối cách trong bối cảnh Luật Môi-se.
- source_word: τοῦτ’ ἔστιν
  choice: tức là
  rationale: Cách nói giải thích tự nhiên, rõ ràng trong tiếng Việt hiện đại.
- source_word: τοὺς ἀδελφοὺς αὐτῶν
  choice: chính anh em mình
  rationale: Giữ hình ảnh thân tộc nam tính của nguyên văn; “chính” làm nổi bật quan hệ cùng huyết thống được mệnh đề nhượng bộ khai triển.
- source_word: καίπερ
  choice: mặc dù
  rationale: Thể hiện rõ lực nhượng bộ của liên từ.
- source_word: ἐξεληλυθότας ἐκ τῆς ὀσφύος Ἀβραάμ
  choice: họ cũng ra từ lòng Áp-ra-ham
  rationale: Bảo lưu hình ảnh thân thể về nguồn gốc huyết thống trong nguyên văn, vốn có vai trò trong lập luận của Hê-bơ-rơ 7, nhưng dùng “lòng” để câu tiếng Việt trang trọng và dễ hiểu.
theological_decisions:
- issue: Ngôn ngữ thân tộc trong ngữ cảnh đại diện cho dân Y-sơ-ra-ên
  choice: anh em mình
  alternative: những người đồng bào Y-sơ-ra-ên của mình
  rationale: Nguyên văn dùng danh từ nam tính ἀδελφούς theo nghĩa thân tộc/giao ước. Bản văn chính giữ hình ảnh “anh em”, còn chú thích làm rõ phạm vi chỉ những người cùng thuộc dân Y-sơ-ra-ên.
- issue: Hình ảnh thân thể về sự truyền dòng từ Áp-ra-ham
  choice: ra từ lòng Áp-ra-ham
  alternative: là hậu duệ của Áp-ra-ham
  rationale: Giữ hình ảnh cụ thể về cùng một nguồn gốc huyết thống, điều quan trọng đối với phép lập luận đang được triển khai, thay vì diễn giải hoàn toàn thành một khái niệm trừu tượng.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ đọc. Giữ các thuật ngữ Kinh Thánh quen thuộc “Lê-vi,” “chức tế lễ,” “điều răn,” “luật pháp” và “Áp-ra-ham”; bảo lưu sự căng thẳng giữa quyền thu phần mười theo luật pháp và nguồn gốc chung từ Áp-ra-ham.
