  rationale: Sửa hình ảnh “lòng Áp-ra-ham” thành cách nói tự nhiên và chính xác hơn về dòng dõi trong văn chính, đồng thời giữ thành ngữ “thắt lưng” trong chú thích. Những điều chỉnh còn lại chỉ làm câu Việt gọn và trung tính hơn, không thay đổi nghĩa hay mức độ mơ hồ của nguyên văn.
