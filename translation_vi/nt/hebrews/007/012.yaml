id: HEB.7.12
reference: Hebrews 7:12
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: μετατιθεμένης γὰρ τῆς ἱερωσύνης ἐξ ἀνάγκης καὶ νόμου μετάθεσις γίνεται.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/012.yaml
  text: For when the priesthood is changed[a], of necessity there is also a change of law.
translation:
  language: vi
  text: Vì khi chức tế lễ thay đổi, thì luật pháp cũng tất yếu phải thay đổi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “thì Luật pháp ấy cũng tất yếu phải thay đổi,” qua đó chỉ rõ Luật pháp Môi-se đã thiết lập chức tế lễ Lê-vi.'
    reason: Bảo tồn cách hiểu cụ thể hơn của νόμου theo văn cảnh, dù danh từ Hy Lạp không có mạo từ.
lexical_decisions:
- source_word: μετατιθεμένης
  choice: thay đổi
  rationale: Phân từ sở hữu cách tuyệt đối diễn tả việc chuyển từ một sự sắp đặt về chức tế lễ sang sự sắp đặt khác. “Thay đổi” tự nhiên trong tiếng Việt và không thu hẹp nghĩa thành sự chuyển giao đơn thuần.
- source_word: ἱερωσύνης
  choice: chức tế lễ
  rationale: Chỉ chức vụ hay thể chế tế lễ, không chỉ một hành vi của thầy tế lễ. “Chức tế lễ” trang trọng, rõ nghĩa và phù hợp với lập luận về hai trật tự tế lễ.
- source_word: ἐξ ἀνάγκης
  choice: tất yếu phải
  rationale: 'Diễn tả sự cần thiết về mặt logic: khi chức tế lễ thay đổi, sự thay đổi tương ứng trong luật pháp buộc phải xảy ra.'
- source_word: νόμου
  choice: luật pháp
  rationale: Danh từ không có mạo từ có thể chỉ phương diện luật lệ chi phối chức tế lễ, đồng thời trong văn cảnh vẫn bao hàm Luật pháp Môi-se. Không thêm từ chỉ định để tránh thu hẹp điều nguyên văn còn để mở.
- source_word: μετάθεσις
  choice: thay đổi
  rationale: Danh từ cùng gốc với μετατιθεμένης tạo sự song song có chủ ý giữa thay đổi chức tế lễ và thay đổi luật pháp; lặp lại “thay đổi” bảo tồn liên kết ấy.
- source_word: γίνεται
  choice: phải thay đổi
  rationale: Trong kết cấu với ἐξ ἀνάγκης, cách diễn đạt này chuyển tải tự nhiên việc sự thay đổi xảy ra như một hệ quả tất yếu.
- source_word: καὶ
  choice: cũng
  rationale: Nêu sự thay đổi luật pháp là hệ quả tương ứng thêm vào sự thay đổi chức tế lễ.
- source_word: γὰρ
  choice: Vì
  rationale: Nối câu này với lập luận trước đó như một lời giải thích hay nêu lý do.
theological_decisions:
- issue: Phạm vi nghĩa của νόμος liên quan đến chức tế lễ
  choice: Dùng “luật pháp” trong chính văn, để vừa chỉ khuôn khổ luật lệ chi phối chức tế lễ vừa tự nhiên bao gồm Luật pháp Môi-se theo văn cảnh.
  alternative: “Luật pháp ấy” hoặc “Luật pháp Môi-se,” xác định trực tiếp một bộ luật cụ thể.
  rationale: Văn cảnh nói đến khuôn khổ Môi-se thiết lập chức tế lễ Lê-vi, nhưng νόμου không có mạo từ. Bản dịch chính giữ độ rộng của cách diễn đạt Hy Lạp; chú thích làm rõ cách hiểu cụ thể hơn mà không áp đặt nó vào chính văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cấu trúc “Vì khi… thì…” truyền đạt quan hệ giải thích và hệ quả; “tất yếu phải” giữ sắc thái lập luận chặt chẽ của thư Hê-bơ-rơ.
