revisions:
- from: 'Hãy suy xét xem người này cao trọng biết bao: Áp-ra-ham, vị tổ phụ, đã trao cho ông một phần mười[a] chiến lợi phẩm[b].'
  to: 'Hãy suy xét xem người này cao trọng biết bao: Áp-ra-ham, vị tổ phụ, đã trao cho ông một phần mười[a] trong số chiến lợi phẩm[b].'
  rationale: Bản sửa chỉ làm rõ giới từ ἐκ bằng “trong số,” giữ nguyên mạch lập luận và không thêm suy luận thần học. Chú thích về “phần mười” được chỉnh để nêu một phương án từ vựng Việt ngữ tự nhiên, không đưa thêm ý nghĩa tế lễ hay thể chế vào bản chính.
  reviewer_model: gpt-5.6-terra
