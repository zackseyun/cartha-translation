source:
  edition: SBLGNT
  text: Θεωρεῖτε δὲ πηλίκος οὗτος ⸀ᾧ δεκάτην Ἀβραὰμ ἔδωκεν ἐκ τῶν ἀκροθινίων ὁ πατριάρχης.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/004.yaml
  text: Consider how great this man was[b][a], to whom Abraham the patriarch gave a tenth of the spoils.
translation:
  language: vi
  text: 'Hãy suy xét xem người này cao trọng biết bao: Áp-ra-ham, vị tổ phụ, đã trao cho ông một phần mười[a] trong số chiến lợi phẩm[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “phần mười”. Tiếng Hy Lạp theo nghĩa đen là “một phần mười”.'
    reason: lexical_alternative
  - marker: b
    text: Từ Hy Lạp chỉ chiến lợi phẩm và có thể hàm ý phần tốt nhất trong số những vật thu được.
    reason: lexical_alternative
lexical_decisions:
- source_word: Θεωρεῖτε
  choice: Hãy suy xét
  rationale: Động từ mệnh lệnh số nhiều kêu gọi người nghe chú tâm cân nhắc; “hãy suy xét” giữ được sắc thái khuyên giục và tự nhiên trong tiếng Việt hiện đại.
- source_word: δὲ
  choice: ':'
  rationale: Tiểu từ đánh dấu bước chuyển nhẹ trong lập luận. Trong câu tiếng Việt, dấu hai chấm nối lời kêu gọi suy xét với bằng chứng theo sau mà không tạo sắc thái đối lập quá mạnh.
- source_word: πηλίκος
  choice: cao trọng biết bao
  rationale: Diễn đạt mức độ lớn lao hoặc địa vị đáng kể; “cao trọng biết bao” phù hợp với lập luận về địa vị của Mên-chi-xê-đéc nhưng không nói vượt quá câu nguồn.
- source_word: οὗτος
  choice: người này
  rationale: Chỉ Mên-chi-xê-đéc trong văn cảnh trước; cách nói này tự nhiên và giữ nguyên việc câu hiện tại không nhắc lại tên ông.
- source_word: ᾧ
  choice: cho ông
  rationale: Đại từ quan hệ ở cách cho được thể hiện tự nhiên trong mệnh đề tiếng Việt sau dấu hai chấm.
- source_word: δεκάτην
  choice: một phần mười
  rationale: Phản ánh trực tiếp nghĩa đen của từ Hy Lạp, đồng thời tránh áp đặt sắc thái thể chế có thể đi kèm từ “thuế phần mười” hoặc “phần mười” trong một số truyền thống.
- source_word: Ἀβραὰμ
  choice: Áp-ra-ham
  rationale: Dạng tên riêng quen dùng trong tiếng Việt Kinh Thánh.
- source_word: ἔδωκεν
  choice: đã trao
  rationale: Diễn đạt hành động cho trong quá khứ; “trao” trang trọng vừa phải và không thêm sắc thái tế lễ như “dâng” có thể gợi ra.
- source_word: ἐκ τῶν ἀκροθινίων
  choice: chiến lợi phẩm
  rationale: Chỉ những vật thu được trong chiến tranh. Bản chính giữ nghĩa chắc chắn, còn khả năng chỉ phần tốt nhất được nêu trong chú thích.
- source_word: ὁ πατριάρχης
  choice: vị tổ phụ
  rationale: Nêu địa vị tổ tiên nổi bật của Áp-ra-ham; “vị tổ phụ” tự nhiên, trang trọng và phù hợp văn cảnh.
theological_decisions:
- issue: Ý quy chiếu và sức nặng đánh giá của câu
  choice: Câu nhấn mạnh sự cao trọng của Mên-chi-xê-đéc bằng việc nêu rằng Áp-ra-ham, vị tổ phụ, đã trao cho ông một phần mười chiến lợi phẩm.
  alternative: Có thể diễn đạt rõ hơn rằng việc nhận phần mười chứng tỏ địa vị vượt trội của Mên-chi-xê-đéc so với Áp-ra-ham.
  rationale: Nguyên văn hướng người đọc đến sự cao trọng của Mên-chi-xê-đéc, nhưng không trực tiếp phát biểu toàn bộ kết luận thần học về địa vị tương đối; bản dịch để phần lập luận đầy đủ cho văn cảnh kế tiếp.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Cấu trúc dấu hai chấm tránh một mệnh đề quan hệ nặng nề trong tiếng Việt, đồng thời vẫn cho thấy hành động của Áp-ra-ham là cơ sở để suy xét sự cao trọng của Mên-chi-xê-đéc.
