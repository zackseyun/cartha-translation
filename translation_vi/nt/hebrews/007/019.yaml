  terminology: «Luật pháp», «niềm hy vọng tốt hơn», «đến gần Đức Chúa Trời» phù hợp văn cảnh Hê-bơ-rơ và văn phong Cơ Đốc Việt ngữ. «Trọn vẹn» là lựa chọn phù hợp để duy trì liên hệ từ vựng với τελειόω mà không diễn giải luật pháp là vô ích tuyệt đối.
