  source_fidelity: 'Bản dịch giữ đúng các yếu tố chính: phủ định tuyệt đối, chức năng giải thích của «Vì», sự đối lập với niềm hy vọng tốt hơn, và «nhờ đó chúng ta đến gần Đức Chúa Trời». Tuy nhiên, «và» trước «nhờ niềm hy vọng ấy» làm câu phối hợp hơn là nối trực tiếp mệnh đề quan hệ/phương tiện «δι’ ἧς».'
