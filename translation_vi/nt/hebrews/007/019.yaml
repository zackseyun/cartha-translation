language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οὐδὲν γὰρ ἐτελείωσεν ὁ νόμος, ἐπεισαγωγὴ δὲ κρείττονος ἐλπίδος, δι’ ἧς ἐγγίζομεν τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/019.yaml
  text: For the law perfected nothing[a], but there is the introduction of a better hope[b], through which we draw near to God.
translation:
  language: vi
  text: Vì luật pháp không làm cho điều gì trở nên trọn vẹn[a]; nhưng một niềm hy vọng tốt hơn được đưa vào[b], nhờ đó chúng ta đến gần Đức Chúa Trời.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “không làm cho điều gì nên hoàn hảo” hoặc “không đưa điều gì đến chỗ trọn vẹn.”'
    reason: lexical_alternative
  - marker: b
    text: 'Dịch sát cấu trúc danh từ: “nhưng có sự đưa vào một niềm hy vọng tốt hơn.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδὲν
  choice: điều gì
  rationale: 'Đi cùng từ phủ định “không” để diễn đạt tự nhiên cấu trúc phủ định tuyệt đối của tiếng Hy Lạp: “không… điều gì,” đồng thời giữ vai trò tân ngữ của ἐτελείωσεν.'
- source_word: γὰρ
  choice: Vì
  rationale: Giữ chức năng giải thích, nêu cơ sở cho lời khẳng định ngay trước đó.
- source_word: ἐτελείωσεν
  choice: làm cho… đạt đến sự hoàn hảo
  rationale: Diễn đạt ý đưa đến mục tiêu hoặc tình trạng trọn vẹn, đồng thời giữ sức nặng thần học của τελειόω trong thư Hê-bơ-rơ mà không khiến câu bị hiểu thành luật pháp hoàn toàn không làm được bất cứ việc gì.
- source_word: ὁ νόμος
  choice: luật pháp
  rationale: Trong ngữ cảnh, từ này chỉ luật Môi-se và hệ thống tư tế liên hệ; cách viết thường không áp đặt quy ước viết hoa vốn không có trong bản Hy Lạp.
- source_word: ἐπεισαγωγὴ
  choice: được đưa vào
  rationale: Chuyển danh từ hiếm mang nghĩa “sự đưa vào” thành cách diễn đạt tự nhiên bằng động từ bị động trong tiếng Việt, nhưng vẫn bảo toàn ý một niềm hy vọng tốt hơn được đem vào.
- source_word: δὲ
  choice: nhưng
  rationale: Nêu rõ sự tương phản giữa điều luật pháp không thực hiện được và niềm hy vọng tốt hơn được đưa vào.
- source_word: κρείττονος ἐλπίδος
  choice: một niềm hy vọng tốt hơn
  rationale: Giữ từ khóa so sánh “tốt hơn” lặp lại trong thư Hê-bơ-rơ và phản ánh danh ngữ không có mạo từ.
- source_word: δι’ ἧς
  choice: nhờ niềm hy vọng ấy
  rationale: Đại từ quan hệ giống cái quy chiếu tự nhiên về “niềm hy vọng”; “nhờ” diễn đạt phương tiện và việc lặp danh từ giúp câu tiếng Việt rõ nghĩa.
- source_word: ἐγγίζομεν
  choice: chúng ta đến gần
  rationale: Giữ hình ảnh đến gần Đức Chúa Trời và sắc thái tiếp cận Ngài trong bối cảnh thờ phượng của Hê-bơ-rơ.
- source_word: τῷ θεῷ
  choice: Đức Chúa Trời
  rationale: Danh xưng phổ thông, trang trọng trong tiếng Việt Cơ Đốc; quan hệ hướng đến được thể hiện bởi động từ “đến gần”.
theological_decisions:
- issue: Ý nghĩa của τελειόω liên quan đến luật pháp
  choice: Luật pháp không đưa bất cứ điều gì đến tình trạng hoàn hảo hoặc mục tiêu trọn vẹn.
  alternative: Luật pháp hoàn toàn không làm được việc gì; hoặc luật pháp chỉ không làm cho chức tư tế trưởng thành.
  rationale: Cách dịch giữ nguyên tân ngữ tuyệt đối οὐδὲν nhưng gắn nó với nghĩa cụ thể của τελειόω, tránh biến câu thành lời tuyên bố rằng luật pháp vô dụng về mọi phương diện.
- issue: Cấu trúc tỉnh lược trong vế tương phản
  choice: Diễn đạt tự nhiên là “nhưng một niềm hy vọng tốt hơn được đưa vào.”
  alternative: “Nhưng có sự đưa vào một niềm hy vọng tốt hơn.”
  rationale: Bản Hy Lạp dùng một danh ngữ không có động từ hữu hạn. Cách dịch chính làm rõ quan hệ cú pháp trong tiếng Việt mà không thêm tác nhân hay xác định quá mức thời điểm.
- issue: Tiền ngữ của δι’ ἧς
  choice: Đại từ quan hệ chỉ “niềm hy vọng.”
  alternative: Có thể hiểu rộng hơn là toàn bộ việc đưa niềm hy vọng tốt hơn vào.
  rationale: Sự hòa hợp giống trong tiếng Hy Lạp khiến ἐλπίδος là tiền ngữ tự nhiên nhất; bản dịch lặp lại “niềm hy vọng ấy” để bảo toàn cách hiểu này.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Luật pháp” giữ cách dùng quen thuộc trong ngữ cảnh Kinh Thánh; “đạt đến sự hoàn hảo” vừa tự nhiên hơn “hoàn thiện” với tân ngữ “điều gì,” vừa duy trì ý đạt mục tiêu của τελειόω. Dấu chấm phẩy làm rõ hai vế tương phản.
