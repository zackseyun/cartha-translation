- from: Vì luật pháp không làm cho điều gì đạt đến sự hoàn hảo[a]; nhưng một niềm hy vọng tốt hơn được đưa vào[b], và nhờ niềm hy vọng ấy, chúng ta đến gần Đức Chúa Trời.
  to: Vì luật pháp không làm cho điều gì trở nên trọn vẹn[a]; nhưng một niềm hy vọng tốt hơn được đưa vào[b], nhờ đó chúng ta đến gần Đức Chúa Trời.
  rationale: Sửa nhẹ để câu Việt tự nhiên hơn và để cụm «nhờ đó» phản ánh trực tiếp δι’ ἧς. Bản sửa vẫn bảo toàn tính tỉnh lược của vế đối lập trong tiếng Hy Lạp qua lối bị động không nêu tác nhân, không áp đặt cách hiểu giáo phái, và giữ các neo chú thích đúng chỗ.
