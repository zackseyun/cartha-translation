id: HEB.7.18
reference: Hebrews 7:18
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀθέτησις μὲν γὰρ γίνεται προαγούσης ἐντολῆς διὰ τὸ αὐτῆς ἀσθενὲς καὶ ἀνωφελές,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/018.yaml
  text: For there is indeed a setting aside of the former commandment because of its weakness and uselessness[b][a],
translation:
  language: vi
  text: Vì quả thật, điều răn có trước bị bãi bỏ[a] do sự yếu kém và vô ích của nó[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “điều răn đi trước” hoặc “điều răn trước đó.”'
    reason: lexical_alternative
  - marker: b
    text: Nghĩa là điều răn ấy không có hiệu lực để đem lại sự hoàn thiện đang được bàn đến trong văn mạch (xem Hê-bơ-rơ 7:19), chứ không phải sự mặc khải trước đó của Đức Chúa Trời tự nó là xấu.
    reason: cross_reference
lexical_decisions:
- source_word: ἀθέτησις
  choice: bị bãi bỏ
  rationale: Diễn đạt việc làm cho một quy định không còn hiệu lực. Cách nói này tự nhiên trong tiếng Việt hiện đại và giữ sắc thái pháp lý mạnh của danh từ Hy Lạp.
- source_word: μὲν γὰρ
  choice: Vì quả thật
  rationale: “Vì” giữ chức năng giải thích của γάρ; “quả thật” phản ánh μέν và báo trước vế tương phản ở câu 19 mà không tạo câu tiếng Việt gượng ép.
- source_word: γίνεται
  choice: bị
  rationale: Trong kết cấu này, γίνομαι nói đến việc sự bãi bỏ xảy ra. Chuyển thành cấu trúc bị động “bị bãi bỏ” là gọn và tự nhiên trong tiếng Việt.
- source_word: προαγούσης ἐντολῆς
  choice: điều răn có trước
  rationale: προαγούσης có nghĩa là đi trước hoặc có trước. Cách dịch này giữ quan hệ thời gian và không tự ý mở rộng thành toàn bộ luật pháp.
- source_word: διὰ τὸ αὐτῆς ἀσθενὲς καὶ ἀνωφελές
  choice: do sự yếu kém và vô ích của nó
  rationale: Giữ nguyên lý do được nêu bằng διά và bảo toàn hai nhận định mạnh, song song của nguyên văn.
- source_word: ἀσθενές
  choice: sự yếu kém
  rationale: Phản ánh ý thiếu sức mạnh hay hiệu lực và phù hợp với cách dùng danh hóa trong câu.
- source_word: ἀνωφελές
  choice: vô ích
  rationale: Diễn đạt trực tiếp ý không mang lại ích lợi hay không đạt được hiệu quả; chú thích làm rõ phạm vi theo văn mạch mà không làm nhẹ nguyên văn.
theological_decisions:
- issue: Phạm vi lời phê bình đối với “điều răn có trước”
  choice: Giữ nguyên lời đánh giá mạnh rằng điều răn ấy “yếu kém và vô ích”, đồng thời chú thích rằng văn mạch nói đến việc không thể đem lại sự hoàn thiện được bàn ở đây.
  alternative: Hiểu đây là lời tuyên bố rằng toàn bộ sự mặc khải trước đó của Đức Chúa Trời hoàn toàn xấu hoặc vô giá trị; hoặc làm nhẹ lời văn thành một nhận định trung tính.
  rationale: Hê-bơ-rơ 7:11 và 7:19 đặt vấn đề trong bối cảnh chức tế lễ và sự hoàn thiện. Bản dịch không xóa căng thẳng trong lời văn, nhưng cũng không mở rộng phạm vi vượt quá lập luận của tác giả.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. “Bị bãi bỏ” giữ sắc thái pháp lý; “điều răn có trước” bảo toàn sự mơ hồ về điều răn đi trước mà không đồng nhất rõ ràng với toàn bộ luật Môi-se. Dấu phẩy cuối câu được giữ vì câu Hy Lạp tiếp tục sang câu 19.
