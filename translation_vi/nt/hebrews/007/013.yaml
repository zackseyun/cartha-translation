reference: Hebrews 7:13
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐφ’ ὃν γὰρ λέγεται ταῦτα φυλῆς ἑτέρας μετέσχηκεν, ἀφ’ ἧς οὐδεὶς προσέσχηκεν τῷ θυσιαστηρίῳ·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/013.yaml
  text: For the one about whom these things are said belongs to another tribe[b][a], from which no one has served at the altar.
translation:
  language: vi
  text: Vì người mà những điều này nói đến thuộc về một chi phái khác[a], mà từ chi phái ấy chưa từng có ai phục vụ nơi bàn thờ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “dự phần vào một chi phái khác” hoặc “xuất thân từ một chi phái khác.” Động từ Hy Lạp có thể chỉ sự dự phần hay gắn kết; tại đây, nó nói đến việc thuộc một chi phái.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “chuyên lo việc nơi bàn thờ.” Cụm từ Hy Lạp nói đến việc đảm trách hay phục vụ liên quan đến bàn thờ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐφ’ ὃν
  choice: người mà ... nói đến
  rationale: Với λέγεται ταῦτα, ἐπί + đối cách diễn tả đối tượng được nhắc đến; cách dịch này tự nhiên trong tiếng Việt và giữ đúng quan hệ quy chiếu.
- source_word: γὰρ
  choice: Vì
  rationale: Dẫn vào lý do giải thích cho lập luận ngay trước đó.
- source_word: λέγεται ταῦτα
  choice: những điều này nói đến
  rationale: Diễn đạt tự nhiên cấu trúc bị động hiện tại và giữ số nhiều của ταῦτα.
- source_word: φυλῆς ἑτέρας
  choice: một chi phái khác
  rationale: Trong ngữ cảnh các chi phái Israel, φυλή là 'chi phái'; ἑτέρας nhấn mạnh đó là chi phái khác với chi phái tư tế đang được bàn đến.
- source_word: μετέσχηκεν
  choice: thuộc về
  rationale: Động từ chỉ sự dự phần hoặc gắn kết; trong ngữ cảnh này nói về tư cách thuộc một chi phái. 'Thuộc về' rõ nghĩa và chuyển tải hệ quả hiện tại của thì hoàn thành.
- source_word: ἀφ’ ἧς
  choice: là chi phái
  rationale: Đại từ quan hệ trở lại với φυλή; lặp danh từ giúp câu tiếng Việt rõ và tự nhiên hơn cách dịch sát 'từ đó'.
- source_word: οὐδεὶς
  choice: chưa từng có ai
  rationale: Kết hợp với động từ hoàn thành để diễn đạt rằng cho đến thời điểm của lập luận không một người nào trong chi phái ấy đã làm việc này.
- source_word: προσέσχηκεν τῷ θυσιαστηρίῳ
  choice: phục vụ nơi bàn thờ
  rationale: Trong ngữ cảnh tế tự, προσέχω chỉ sự chuyên tâm đảm trách hoặc phục vụ gắn với bàn thờ; cách dịch này sáng nghĩa mà không quy định quá mức các nghi thức cụ thể.
- source_word: θυσιαστηρίῳ
  choice: bàn thờ
  rationale: Thuật ngữ tiếng Việt quen thuộc và chính xác trong bối cảnh dâng tế lễ.
theological_decisions:
- issue: Mối liên hệ của Chúa Giê-xu với một chi phái ngoài Lê-vi trong lập luận về chức tư tế
  choice: Diễn đạt là 'thuộc về một chi phái khác', chỉ nêu tư cách thuộc chi phái như câu Hy Lạp.
  alternative: Dịch giải thích hơn là 'xuất thân từ một chi phái khác' hoặc 'dòng dõi của một chi phái khác'.
  rationale: Câu này hỗ trợ lập luận rằng chức tư tế của Chúa Giê-xu không phát sinh từ dòng Lê-vi, nhưng μετέσχηκεν tự nó nói đến sự dự phần hay liên hệ, không trực tiếp dùng từ ngữ về huyết thống. Bản dịch vì thế không đưa phần giải thích thần học vào chính văn.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Dùng 'chi phái' theo thuật ngữ Kinh Thánh Việt ngữ phổ biến; 'phục vụ nơi bàn thờ' vừa tự nhiên vừa giữ sắc thái tế tự mà không thêm chi tiết nghi lễ.
