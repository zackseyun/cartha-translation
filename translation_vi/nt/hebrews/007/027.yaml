  to: Ngài không cần, ngày này qua ngày khác[a], như các thầy tế lễ thượng phẩm, dâng sinh tế trước hết vì tội lỗi của chính mình, rồi vì tội lỗi của dân chúng; bởi Ngài đã làm điều này một lần là đủ cả[b] khi dâng chính mình[c].
  rationale: Chỉ điều chỉnh cách diễn đạt «một lần là đủ cả» để câu tự nhiên hơn trong tiếng Việt hiện đại. Các lựa chọn còn lại được giữ vì phản ánh trung thành nguyên văn và duy trì sắc thái tế tự của câu.
