id: HEB.7.27
reference: Hebrews 7:27
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὃς οὐκ ἔχει καθ’ ἡμέραν ἀνάγκην, ὥσπερ οἱ ἀρχιερεῖς, πρότερον ὑπὲρ τῶν ἰδίων ἁμαρτιῶν θυσίας ἀναφέρειν, ἔπειτα τῶν τοῦ λαοῦ (τοῦτο γὰρ ἐποίησεν ἐφάπαξ ἑαυτὸν ἀνενέγκας)·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/027.yaml
  text: who has no need[a], day after day, like the high priests, to offer up sacrifices first for his own sins and then for those of the people[d][c][b], for this he did once for all when he offered up himself.
translation:
  language: vi
  text: Ngài không cần, ngày này qua ngày khác[a], như các thầy tế lễ thượng phẩm, dâng sinh tế trước hết vì tội lỗi của chính mình, rồi vì tội lỗi của dân chúng; bởi Ngài đã làm điều này một lần là đủ cả[b] khi dâng chính mình[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “mỗi ngày” hoặc “hằng ngày.” Thành ngữ Hy Lạp nhấn mạnh sự lặp lại ngày này qua ngày khác.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “một lần là đủ” hoặc “một lần dứt khoát.”'
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể dịch: “bằng cách dâng chính mình” hoặc “sau khi đã dâng chính mình.”'
    reason: grammatical_alternative
lexical_decisions:
- source_word: καθ’ ἡμέραν
  choice: ngày này qua ngày khác
  rationale: Diễn đạt tự nhiên sức lặp lại hằng ngày của thành ngữ Hy Lạp, rõ hơn một trạng từ đơn lẻ.
- source_word: ἀνάγκην
  choice: cần
  rationale: Cụm “không cần” là cách nói tiếng Việt tự nhiên cho οὐκ ἔχει ... ἀνάγκην.
- source_word: ὥσπερ οἱ ἀρχιερεῖς
  choice: như các thầy tế lễ thượng phẩm
  rationale: Giữ phép so sánh và số nhiều của nguyên văn, đồng thời dùng thuật ngữ tư tế quen thuộc, trang trọng.
- source_word: πρότερον ... ἔπειτα
  choice: trước hết ... rồi
  rationale: Thể hiện rõ trình tự của hành động dâng tế lễ bằng tiếng Việt hiện đại.
- source_word: ὑπὲρ τῶν ἰδίων ἁμαρτιῶν
  choice: vì tội lỗi của chính mình
  rationale: Trong ngữ cảnh tế lễ, ὑπέρ chỉ mục đích hay đối tượng mà sinh tế được dâng vì họ.
- source_word: θυσίας ἀναφέρειν
  choice: dâng sinh tế
  rationale: Giữ sắc thái tế tự của cả danh từ θυσία và động từ ἀναφέρω mà không dùng lối diễn đạt cổ.
- source_word: τῶν τοῦ λαοῦ
  choice: vì tội lỗi của dân chúng
  rationale: Nguyên văn tỉnh lược danh từ “tội lỗi”; tiếng Việt cần lặp lại để câu rõ và tự nhiên.
- source_word: τοῦτο γὰρ ἐποίησεν
  choice: bởi Ngài đã làm điều này
  rationale: Giữ lực hồi chỉ của τοῦτο mà không xác định hẹp hơn điều nguyên văn nói.
- source_word: ἐφάπαξ
  choice: một lần đủ cả
  rationale: Diễn đạt cả tính duy nhất lẫn hiệu lực dứt khoát của hành động, phù hợp trọng tâm của thư Hê-bơ-rơ.
- source_word: ἑαυτὸν ἀνενέγκας
  choice: khi dâng chính mình
  rationale: Giữ sắc thái tế lễ và diễn đạt phân từ aorist như hoàn cảnh thời gian đi kèm động từ chính.
theological_decisions:
- issue: Phạm vi quy chiếu của “điều này”
  choice: Giữ cách nói hồi chỉ rộng “Ngài đã làm điều này”, đặt trong sự tương phản với các thầy tế lễ thượng phẩm nhưng không hàm ý Ngài dâng tế lễ vì tội của chính mình.
  alternative: Hiểu “điều này” chỉ việc dâng tế lễ vì tội lỗi của dân chúng.
  rationale: Cú pháp cho phép sức quy chiếu rộng, còn ngữ cảnh gần của Hê-bơ-rơ khẳng định sự vô tội của Ngài. Bản dịch bảo tồn độ căng của câu mà không thêm một đối tượng không có trong mệnh đề tự hiến.
- issue: Bản chất hành động tự hiến
  choice: “dâng chính mình”
  alternative: “phó chính mình” hoặc “hiến chính mình”
  rationale: '“Dâng” giữ rõ trường nghĩa tư tế và tế lễ: Ngài vừa là thầy tế lễ vừa là lễ vật, trong khi các cách khác có thể làm nhạt sắc thái tế tự.'
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Thầy tế lễ thượng phẩm” và “sinh tế” duy trì sắc thái tế tự của đoạn văn; đại từ “Ngài” phù hợp văn phong Kinh Thánh tiếng Việt mà không thêm danh xưng ngoài nguyên văn.
