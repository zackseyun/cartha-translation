language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὃς οὐ κατὰ νόμον ἐντολῆς ⸀σαρκίνης γέγονεν ἀλλὰ κατὰ δύναμιν ζωῆς ἀκαταλύτου,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/016.yaml
  text: who has become such not according to a law of a fleshly commandment[a], but according to the power of an indestructible life[c][b],
translation:
  language: vi
  text: Người đã trở thành thầy tế lễ không theo luật lệ dựa trên một điều răn thuộc thể xác[a], nhưng theo quyền năng của sự sống không thể bị hủy diệt[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “một quy định thuộc thể xác” hoặc “một điều răn liên quan đến thân xác.”'
    reason: lexical_alternative
  - marker: b
    text: 'Theo cách dịch truyền thống: “sự sống bất tận.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς
  choice: người
  rationale: Đại từ quan hệ nối với nhân vật ở câu trước; tiếng Việt tự nhiên dùng “người” trong mệnh đề quan hệ.
- source_word: γέγονεν
  choice: đã trở nên thầy tế lễ
  rationale: Thì hoàn thành diễn tả tình trạng hiện tại do một sự kiện trước đó; “thầy tế lễ” bổ sung vị ngữ được tỉnh lược nhưng đã rõ từ ngữ cảnh.
- source_word: κατὰ νόμον
  choice: theo luật
  rationale: κατά với đối cách chỉ tiêu chuẩn hoặc cơ sở. Không thêm “Luật pháp” như một danh xưng, vì νόμον không có mạo từ và trọng tâm là nguyên tắc luật định.
- source_word: ἐντολῆς σαρκίνης
  choice: về một điều răn thuộc xác thịt
  rationale: Cách diễn đạt này giữ quan hệ bổ nghĩa của sở hữu cách, đồng thời tránh cụm tiếng Việt gượng “luật của một điều răn”. “Thuộc xác thịt” duy trì hình ảnh σάρξ mà không gán nghĩa đạo đức là tội lỗi.
- source_word: ἀλλὰ κατὰ δύναμιν
  choice: nhưng theo quyền năng
  rationale: Giữ cấu trúc đối lập song song giữa hai cụm κατὰ.
- source_word: ζωῆς ἀκαταλύτου
  choice: của sự sống không thể bị hủy diệt
  rationale: ἀκατάλυτος chỉ điều không thể bị phá hủy, giải thể hoặc chấm dứt; cách dịch này rộng hơn ý chỉ kéo dài vô tận.
theological_decisions:
- issue: Ý nghĩa của σαρκίνης trong sự tương phản với ἀκαταλύτου
  choice: thuộc xác thịt
  alternative: thuộc thể xác; có tính thân xác
  rationale: Trong ngữ cảnh, từ này nói đến tiêu chuẩn bên ngoài, thân xác hoặc dòng dõi của chức tế lễ, chứ không khẳng định điều răn mang tính tội lỗi.
- issue: Cách hiểu ἀκαταλύτου
  choice: không thể bị hủy diệt
  alternative: bất tận; không bao giờ chấm dứt
  rationale: Cách chọn giữ cả ý không thể bị phá hủy lẫn không thể bị chấm dứt, thay vì chỉ nhấn mạnh thời lượng vô tận.
- issue: Vị ngữ tỉnh lược sau γέγονεν
  choice: bổ sung “thầy tế lễ” từ ngữ cảnh
  alternative: chỉ dịch “đã trở nên như vậy”
  rationale: Tiếng Việt cần một vị ngữ rõ để câu đứng tự nhiên; việc bổ sung này phản ánh trực tiếp chủ đề chức tế lễ của mạch văn mà không xác định thêm loại chức tế lễ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “thầy tế lễ” theo thuật ngữ Kinh Thánh quen thuộc; tránh hiểu “xác thịt” theo nghĩa đạo đức tiêu cực bằng cụm “thuộc xác thịt” và chú thích làm rõ.
