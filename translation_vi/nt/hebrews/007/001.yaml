id: HEB.7.1
reference: Hebrews 7:1
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Οὗτος γὰρ ὁ Μελχισέδεκ, βασιλεὺς Σαλήμ, ἱερεὺς τοῦ θεοῦ τοῦ ὑψίστου, ⸀ὁ συναντήσας Ἀβραὰμ ὑποστρέφοντι ἀπὸ τῆς κοπῆς τῶν βασιλέων καὶ εὐλογήσας αὐτόν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/001.yaml
  text: For this Melchizedek[a], king of Salem, priest of God Most High, met Abraham as he was returning from the slaughter of the kings and blessed him[b],
translation:
  language: vi
  text: Vì Mên-chi-xê-đéc này, vua Sa-lem, thầy tế lễ của Đức Chúa Trời Chí Cao, đã gặp Áp-ra-ham khi ông trở về sau cuộc chém giết các vua[a], và chúc phước cho ông,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sát chữ: “sau cuộc chém giết các vua”; cũng có thể hiểu là “sau khi đánh bại các vua.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὗτος γὰρ ὁ Μελχισέδεκ
  choice: Vì Mên-chi-xê-đéc này
  rationale: “Vì” giữ quan hệ giải thích của γάρ với lập luận trước; “này” bảo lưu sắc thái chỉ định của Οὗτος. Tên riêng được phiên âm theo lối quen thuộc trong tiếng Việt.
- source_word: βασιλεὺς Σαλήμ
  choice: vua Sa-lem
  rationale: Cách dịch trực tiếp, tự nhiên, đồng thời giữ mối liên hệ với Sáng Thế Ký 14.
- source_word: ἱερεὺς τοῦ θεοῦ τοῦ ὑψίστου
  choice: thầy tế lễ của Đức Chúa Trời Chí Cao
  rationale: Diễn đạt tự nhiên trong tiếng Việt và giữ “Chí Cao” như tôn hiệu bổ nghĩa cho Đức Chúa Trời.
- source_word: ὁ συναντήσας Ἀβραὰμ
  choice: đã gặp Áp-ra-ham
  rationale: Chuyển phân từ aorist thành động từ chính giúp câu tiếng Việt rõ ràng mà vẫn giữ hành động đã xảy ra.
- source_word: ὑποστρέφοντι
  choice: khi ông trở về
  rationale: Diễn tả hành động đang diễn ra của Áp-ra-ham vào lúc Mên-chi-xê-đéc gặp ông.
- source_word: ἀπὸ τῆς κοπῆς τῶν βασιλέων
  choice: sau cuộc đánh hạ các vua
  rationale: κοπή có nghĩa sát chữ là chém giết hoặc hạ gục; trong bối cảnh quân sự, “đánh hạ” giữ được sức mạnh của từ mà không khẳng định rằng chính các vua đều bị giết.
- source_word: καὶ εὐλογήσας αὐτόν
  choice: và chúc phước cho ông
  rationale: Giữ hành động thứ hai của Mên-chi-xê-đéc đối với Áp-ra-ham; “chúc phước” là cách nói Kinh Thánh quen thuộc và rõ nghĩa.
theological_decisions:
- issue: Cách dịch tôn hiệu τοῦ θεοῦ τοῦ ὑψίστου
  choice: Đức Chúa Trời Chí Cao
  alternative: Đức Chúa Trời Tối Cao
  rationale: “Chí Cao” giữ sắc thái tôn hiệu truyền thống và trang trọng, không thêm hàm ý thần học ngoài nguyên văn.
- issue: Mức độ bạo lực trong κοπή
  choice: đánh hạ các vua
  alternative: chém giết các vua
  rationale: Nguyên ngữ có thể chỉ sự chém giết hoặc hạ gục trong chiến trận. Bản chính tránh xác quyết rằng các vua đều bị giết, còn chú thích bảo lưu nghĩa sát chữ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu được để mở bằng dấu phẩy vì Hê-bơ-rơ 7:1 tiếp tục về mặt cú pháp sang câu 2.
