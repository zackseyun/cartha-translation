source:
  edition: SBLGNT
  text: Ἐπεὶ οὖν τὰ παιδία κεκοινώνηκεν ⸂αἵματος καὶ σαρκός⸃, καὶ αὐτὸς παραπλησίως μετέσχεν τῶν αὐτῶν, ἵνα διὰ τοῦ θανάτου καταργήσῃ τὸν τὸ κράτος ἔχοντα τοῦ θανάτου, τοῦτ’ ἔστι τὸν διάβολον,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/014.yaml
  text: Therefore[a], since the children share in flesh and blood, he himself likewise partook of the same things, so that through death he might nullify the one who has the power of death—that is, the devil[b],
translation:
  language: vi
  text: Vậy, vì con cái cùng chung huyết nhục[a], chính Ngài cũng dự phần vào những điều ấy theo cách tương tự, để qua sự chết, Ngài làm cho kẻ nắm quyền lực của sự chết—tức là ma quỷ—trở nên vô hiệu[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “máu và thịt”; nghĩa là thân phận thể chất của con người.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “làm mất quyền lực” hoặc “tiêu diệt”; động từ này thường mang nghĩa làm cho mất hiệu lực, trở nên vô dụng hoặc bị bãi bỏ, chứ không nhất thiết hàm ý hủy diệt hoàn toàn.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐπεὶ οὖν
  choice: Vậy, vì
  rationale: Giữ cả sắc thái suy luận của οὖν và quan hệ nguyên nhân của ἐπεί, đồng thời nối tự nhiên với lập luận trước đó.
- source_word: τὰ παιδία
  choice: con cái
  rationale: Chỉ những người được gọi là con cái trong văn cảnh gần; cách diễn đạt tự nhiên và không thêm diễn giải.
- source_word: κεκοινώνηκεν
  choice: cùng chung
  rationale: Diễn tả việc có phần chung và trạng thái hiện tại phát sinh từ thể hoàn thành, bằng tiếng Việt tự nhiên.
- source_word: αἵματος καὶ σαρκός
  choice: huyết nhục
  rationale: Chỉ bản tính thể chất của con người. Thành ngữ trang trọng, dễ hiểu trong văn cảnh Kinh Thánh; chú thích nêu rõ thứ tự nguyên văn là 'máu và thịt'.
- source_word: παραπλησίως
  choice: theo cách tương tự
  rationale: Giữ sắc thái giống nhau sát sao mà không biến thành lời khẳng định về sự đồng nhất tuyệt đối.
- source_word: μετέσχεν τῶν αὐτῶν
  choice: dự phần vào những điều ấy
  rationale: Giữ sự song hành với việc con cái có phần chung, nhưng phản ánh việc nguyên văn dùng một động từ khác.
- source_word: ἵνα
  choice: để
  rationale: Biểu đạt mục đích ngắn gọn và tự nhiên.
- source_word: διὰ τοῦ θανάτου
  choice: qua sự chết
  rationale: Thể hiện sự chết là phương tiện mà hành động được thực hiện.
- source_word: καταργήσῃ
  choice: làm ... trở nên vô hiệu
  rationale: Diễn đạt ý tước bỏ hiệu lực hoặc làm mất tác dụng, tránh hàm ý ma quỷ bị tiêu diệt đến mức không còn tồn tại.
- source_word: τὸ κράτος ἔχοντα τοῦ θανάτου
  choice: kẻ nắm quyền lực của sự chết
  rationale: κράτος có nghĩa là quyền lực, sức mạnh hoặc quyền thống trị; cách dịch này rõ và giữ được cấu trúc của nguyên văn.
- source_word: τοῦτ’ ἔστι
  choice: tức là
  rationale: Giới thiệu lời xác định đồng vị một cách tự nhiên trong tiếng Việt.
- source_word: τὸν διάβολον
  choice: ma quỷ
  rationale: Danh xưng đã được xác lập trong cách dùng Tân Ước, rõ hơn một cách dịch thuần từ nguyên như 'kẻ vu khống'.
theological_decisions:
- issue: Sự dự phần của Đấng Christ vào thân phận con người
  choice: chính Ngài cũng dự phần vào những điều ấy theo cách tương tự
  alternative: chính Ngài cũng cùng chung nhân tính với họ
  rationale: Bản dịch giữ sự dự phần thật sự của Ngài vào huyết nhục, đồng thời bảo toàn sắc thái của παραπλησίως và sự khác biệt giữa hai động từ Hy Lạp, không đưa công thức thần học hậu kỳ vào câu.
- issue: Ý nghĩa của καταργήσῃ đối với ma quỷ
  choice: làm ... trở nên vô hiệu
  alternative: tiêu diệt; làm mất quyền lực
  rationale: Giữ dải nghĩa tước hiệu lực, vô hiệu hóa hoặc bãi bỏ, thay vì mặc nhiên hiểu là hủy diệt sự hiện hữu. Chú thích bảo lưu các cách dịch khả dĩ khác.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ đọc. Dùng “huyết nhục” để chuyển tải thành ngữ chỉ bản tính thể chất của con người; đại từ “Ngài” phù hợp văn phong Kinh Thánh phổ thông. Dấu gạch ngang giữ phần giải thích đồng vị “tức là ma quỷ” và câu kết bằng dấu phẩy vì câu Hy Lạp tiếp tục sang câu sau.
