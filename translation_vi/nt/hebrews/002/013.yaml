  to: 'Và lại: “Ta sẽ tin cậy nơi Ngài.”[a] Và lại: “Này, ta và các con cái mà Đức Chúa Trời đã ban cho ta.”[b]'
  rationale: Bản chỉnh sửa chỉ chuẩn hóa phép lặp của καὶ πάλιν, làm cụm danh từ chỉ các παιδία trôi chảy hơn trong tiếng Việt, và điều chỉnh chú thích từ vựng để không gán sắc thái vượt quá nguyên văn. Ý nghĩa và tính không nêu đích danh người nói của bản gốc được giữ nguyên.
