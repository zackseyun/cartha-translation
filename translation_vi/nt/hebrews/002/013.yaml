  verdict: revise
  source_fidelity: Bản dịch truyền đạt đúng hai công thức dẫn trích, đại từ ngôi thứ nhất được nhấn mạnh, ý tin cậy, từ chỉ thị Ἰδού, và mệnh đề “con cái mà Đức Chúa Trời đã ban cho ta”. Tuy nhiên, καὶ πάλιν xuất hiện nguyên dạng ở cả hai lần trong tiếng Hy Lạp; nên dùng cùng một công thức tiếng Việt ở cả hai chỗ thay vì đổi “Và lại” thành “Rồi lại”.
  naturalness: Văn phong trang trọng, rõ ràng và phù hợp tiếng Việt tiêu chuẩn hiện đại. “Các con cái” tự nhiên hơn đôi chút trong cấu trúc liệt kê “ta và các con cái”, đồng thời vẫn giữ nghĩa quan hệ của τὰ παιδία.
  terminology: “Ta”, “Ngài”, “Đức Chúa Trời”, “tin cậy nơi”, và “con cái” phù hợp văn phong Kinh Thánh tiếng Việt và không thêm định danh người nói vào chính văn. Chú thích về việc Hê-bơ-rơ áp dụng lời trích cho Đấng Con là thích hợp; chỉnh nhẹ chú thích lựa chọn từ để không gọi một diễn đạt có thêm sắc thái “luôn” là bản dịch “sát hơn”.
