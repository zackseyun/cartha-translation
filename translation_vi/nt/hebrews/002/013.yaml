source:
  edition: SBLGNT
  text: καὶ πάλιν· Ἐγὼ ἔσομαι πεποιθὼς ἐπ’ αὐτῷ· καὶ πάλιν· Ἰδοὺ ἐγὼ καὶ τὰ παιδία ἅ μοι ἔδωκεν ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/013.yaml
  text: And again[a], “I will put my trust in him.” And again, “Behold[d][c][b], I and the children whom God has given me.”
translation:
  language: vi
  text: 'Và lại: “Ta sẽ tin cậy nơi Ngài.”[a] Và lại: “Này, ta và các con cái mà Đức Chúa Trời đã ban cho ta.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Ta sẽ đặt lòng tin nơi Ngài” hoặc “Ta sẽ có lòng tin cậy nơi Ngài.”'
    reason: lexical_alternative
  - marker: b
    text: Bản Hy Lạp không nêu danh tính người nói trong câu này; theo mạch văn, Thư Hê-bơ-rơ áp dụng các lời trích này cho Đấng Con.
    reason: cross_reference
lexical_decisions:
- source_word: καὶ πάλιν
  choice: Và lại / Rồi lại
  rationale: Giữ nguyên công thức dẫn trích ngắn gọn của tiếng Hy Lạp, không thêm động từ “phán” hay “nói”; lần thứ hai dùng “Rồi lại” để câu tiếng Việt tự nhiên hơn mà vẫn giữ cùng ý.
- source_word: Ἐγὼ
  choice: Ta
  rationale: Giữ đại từ ngôi thứ nhất được nêu rõ và có sắc thái nhấn mạnh trong lời trích; “Ta” phù hợp với văn phong Kinh Thánh trang trọng mà vẫn quen thuộc.
- source_word: ἔσομαι πεποιθὼς
  choice: sẽ tin cậy
  rationale: Cấu trúc tương lai περιφραστική với phân từ hoàn thành diễn tả tư thế tin cậy vững chắc; “sẽ tin cậy” tự nhiên và không giải thích quá mức sắc thái ngữ pháp.
- source_word: ἐπ’ αὐτῷ
  choice: nơi Ngài
  rationale: “Tin cậy nơi” là kết hợp từ tự nhiên, trang trọng trong tiếng Việt; viết hoa “Ngài” vì đại từ chỉ Đức Chúa Trời trong lời trích.
- source_word: Ἰδοὺ
  choice: Này
  rationale: Bảo lưu từ chỉ thị có tác dụng thu hút sự chú ý, với cách diễn đạt trang trọng và tự nhiên hơn “Hãy xem” trong ngữ cảnh lời trích.
- source_word: τὰ παιδία
  choice: những con cái
  rationale: Trong ngữ cảnh quan hệ của lời trích, “con cái” tự nhiên hơn “trẻ nhỏ” và không giới hạn độ tuổi.
- source_word: ἅ μοι ἔδωκεν ὁ θεός
  choice: mà Đức Chúa Trời đã ban cho ta
  rationale: Đại từ quan hệ “mà” phù hợp với người trong tiếng Việt; “đã ban” phản ánh động tác aorist mà không buộc phải xác định thêm quan hệ thời gian, còn “ban” hợp với chủ thể Đức Chúa Trời.
- source_word: ὁ θεός
  choice: Đức Chúa Trời
  rationale: Cách gọi phổ thông, trang trọng và rõ nghĩa trong tiếng Việt Cơ Đốc.
theological_decisions:
- issue: Người nói trong các lời trích và cách áp dụng cho Đấng Con
  choice: Giữ lời trích ở ngôi thứ nhất mà không thêm danh tính người nói trong chính văn.
  alternative: Thêm “Ngài phán” hoặc “Đấng Mê-si phán” để làm rõ người nói.
  rationale: Bản Hy Lạp chỉ có công thức “và lại”, không nêu danh tính người nói. Mạch văn thư Hê-bơ-rơ áp dụng các lời này cho Đấng Con, nhưng bản dịch không nên đưa sự giải thích ấy vào chính văn.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Giữ nhịp điệu của hai công thức dẫn trích, tránh thêm động từ nói không có trong bản Hy Lạp. Dùng “Này” thay cho lối cổ hơn “Kìa” và dùng “con cái” theo nghĩa quan hệ.
