- from: Vì vậy, chúng ta càng phải hết sức chú tâm đến những điều mình đã nghe, kẻo bị trôi dạt khỏi đó.[a]
  to: Vì thế, chúng ta càng phải chú ý kỹ hơn đến những điều đã nghe, kẻo chúng ta trôi dạt đi.[a]
  rationale: Bản sửa giữ nguyên ý nghĩa và tính cảnh báo của câu, diễn đạt rõ hơn lực so sánh trong περισσοτέρως, và dùng chủ động “chúng ta trôi dạt đi” để phản ánh παραρυῶμεν mà không thêm đối tượng hay hướng quy chiếu cụ thể. Chú thích tiếp tục bảo tồn các khả năng hiểu khác của hình ảnh động từ.
