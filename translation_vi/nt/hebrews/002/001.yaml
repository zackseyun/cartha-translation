  text: Διὰ τοῦτο δεῖ περισσοτέρως ⸂προσέχειν ἡμᾶς⸃ τοῖς ἀκουσθεῖσιν, μήποτε παραρυῶμεν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/001.yaml
  text: For this reason[a], we must pay much closer attention to what we have heard, lest we drift away.
translation:
  language: vi
  text: Vì thế, chúng ta càng phải chú ý kỹ hơn đến những điều đã nghe, kẻo chúng ta trôi dạt đi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “kẻo chúng ta trôi qua mất” hoặc “kẻo chúng ta để những điều ấy tuột mất.” Động từ Hy Lạp gợi hình ảnh trôi dạt, trôi ngang qua hoặc tuột mất.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: Vì vậy
  rationale: Diễn đạt tự nhiên quan hệ suy luận và nguyên nhân với lập luận ngay trước đó.
- source_word: δεῖ
  choice: phải
  rationale: Giữ rõ sắc thái cần thiết, bắt buộc của động từ Hy Lạp.
- source_word: περισσοτέρως
  choice: càng ... hết sức
  rationale: 'Thể hiện sức nhấn mạnh và ý so sánh gia tăng trong ngữ cảnh: vì điều vừa nêu, sự chú tâm càng cần thiết hơn.'
- source_word: προσέχειν ἡμᾶς
  choice: chúng ta ... chú tâm
  rationale: Cách nói hiện đại, trang trọng vừa phải, diễn đạt việc hướng sự chú ý và nghiêm túc lưu tâm.
- source_word: τοῖς ἀκουσθεῖσιν
  choice: đến những điều mình đã nghe
  rationale: Giữ dạng nội dung không xác định cụ thể của phân từ Hy Lạp, không tự ý thu hẹp thành một thuật ngữ như “sứ điệp”; “đã nghe” cũng giữ sự liên hệ hiện tại của điều đã được nghe.
- source_word: μήποτε
  choice: kẻo
  rationale: Tự nhiên trong tiếng Việt và truyền đạt cô đọng lời cảnh báo về một kết quả có thể xảy ra.
- source_word: παραρυῶμεν
  choice: bị trôi dạt khỏi đó
  rationale: Giữ hình ảnh chuyển động trôi lệch hoặc trôi qua trong động từ Hy Lạp, đồng thời đặt người nghe làm chủ thể gặp nguy cơ như hình thái ngôi thứ nhất số nhiều; “bị” diễn tả trạng thái bị cuốn trôi mà không xác định tác nhân.
theological_decisions:
- issue: Hình ảnh cảnh báo trong παραρυῶμεν hướng đến người nghe hay những điều đã nghe
  choice: Diễn đạt người nghe có nguy cơ “bị trôi dạt khỏi đó”
  alternative: “kẻo chúng ta trôi qua mất” hoặc “kẻo để những điều ấy tuột mất”
  rationale: Hình thái động từ đặt “chúng ta” làm chủ thể, nhưng hình ảnh có thể gợi việc trôi khỏi, trôi ngang qua, hoặc để điều đã nghe tuột mất. Bản dịch chính giữ lời cảnh báo về chuyển động của người nghe mà không giải thích nguy cơ ấy theo một hệ phái hay học thuyết về sự bội đạo.
translation_notes:
  register: Tiếng Việt hiện đại, rõ ràng và trang nghiêm. “Chú tâm” dễ hiểu hơn lối cổ “lưu tâm”; “kẻo” giữ được giọng khuyên răn cảnh báo. Dấu chú thích [a] được đặt ngay sau mệnh đề có hình ảnh đa nghĩa.
