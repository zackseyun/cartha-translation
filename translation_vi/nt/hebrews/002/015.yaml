id: HEB.2.15
reference: Hebrews 2:15
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἀπαλλάξῃ τούτους, ὅσοι φόβῳ θανάτου διὰ παντὸς τοῦ ζῆν ἔνοχοι ἦσαν δουλείας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/015.yaml
  text: and free those who[a], through fear of death, were subject to slavery all their lives.
translation:
  language: vi
  text: và giải thoát tất cả những người, vì sợ chết, đã phải chịu cảnh nô lệ suốt đời.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đã bị cầm giữ trong cảnh nô lệ” hoặc “đã ở trong vòng nô lệ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπαλλάξῃ
  choice: giải thoát
  rationale: Động từ chỉ việc giải phóng khỏi một tình trạng ràng buộc. “Giải thoát” tự nhiên, trang trọng và phù hợp với hình ảnh nô lệ trong vế sau.
- source_word: τούτους, ὅσοι
  choice: tất cả những người
  rationale: Kết hợp đại từ chỉ định với đại từ quan hệ có nghĩa bao quát một lớp người; cách diễn đạt này tự nhiên trong tiếng Việt và giữ được lực của ὅσοι.
- source_word: φόβῳ θανάτου
  choice: vì sợ chết
  rationale: Cụm cách ba có thể biểu thị nguyên nhân hoặc hoàn cảnh chi phối. “Vì sợ chết” rõ nghĩa, tự nhiên, đồng thời không xác định quá mức sắc thái ngữ pháp.
- source_word: διὰ παντὸς τοῦ ζῆν
  choice: suốt đời
  rationale: Thành ngữ này chỉ toàn bộ quãng đời; “suốt đời” là cách diễn đạt ngắn gọn và tự nhiên trong tiếng Việt hiện đại.
- source_word: ἔνοχοι ἦσαν δουλείας
  choice: đã phải chịu cảnh nô lệ
  rationale: ἔνοχος với δουλεία diễn tả tình trạng bị lệ thuộc hoặc chịu sự ràng buộc của cảnh nô lệ. Cách dịch này giữ sức nặng của hình ảnh mà không biến nó thành một khẳng định pháp lý đơn thuần.
- source_word: δουλείας
  choice: cảnh nô lệ
  rationale: Danh từ chỉ tình trạng nô lệ hoặc sự lệ thuộc. “Cảnh nô lệ” nhấn mạnh tình trạng thực tế hơn từ trừu tượng “sự nô lệ” và vẫn dễ hiểu.
- source_word: καὶ
  choice: và
  rationale: Liên từ nối mục đích này với mệnh đề trước; “và” giữ đúng sự liên kết của nguyên văn.
theological_decisions:
- issue: Bản chất của cảnh nô lệ gắn với nỗi sợ chết
  choice: 'Giữ lời văn khái quát: họ phải chịu cảnh nô lệ vì sợ chết.'
  alternative: Nô lệ cho ma quỷ; nô lệ cho tội lỗi; hoặc sự lệ thuộc hiện sinh dưới quyền lực của cái chết.
  rationale: Dù câu trước nhắc đến ma quỷ và quyền lực của sự chết, câu này không trực tiếp xác định chủ thể làm họ nô lệ. Bản dịch không thêm một cơ chế thần học cụ thể ngoài điều nguyên văn nói.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “sợ chết” thay cho “sợ sự chết” để tự nhiên hơn; giữ “cảnh nô lệ” nhằm bảo toàn sức mạnh của ἔνοχοι ἦσαν δουλείας. Dấu chú thích [a] được đặt ngay sau câu.
