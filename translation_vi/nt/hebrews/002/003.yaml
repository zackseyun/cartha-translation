  terminology: Giữ “sự cứu rỗi” cho σωτηρία và “Chúa” cho κύριος. “Công bố” dịch λαλεῖσθαι tự nhiên trong ngữ cảnh loan báo công khai, không xác định thêm nội dung hay giáo lý. Không thêm “Ngài” sau “những người đã nghe”, do tân ngữ chỉ được hàm ý trong nguyên văn.
