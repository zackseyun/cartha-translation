  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: πῶς ἡμεῖς ἐκφευξόμεθα τηλικαύτης ἀμελήσαντες σωτηρίας, ἥτις, ἀρχὴν λαβοῦσα λαλεῖσθαι διὰ τοῦ κυρίου, ὑπὸ τῶν ἀκουσάντων εἰς ἡμᾶς ἐβεβαιώθη,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/003.yaml
  text: How will we escape if we neglect so great a salvation? This salvation[a], having at first been spoken through the Lord, was confirmed to us by those who heard him,
translation:
  language: vi
  text: Làm sao chúng ta thoát khỏi được nếu sao lãng một sự cứu rỗi lớn lao dường ấy? Sự cứu rỗi này[a], ban đầu được Chúa công bố, rồi được những người đã nghe xác nhận cho chúng ta,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “là sự cứu rỗi ban đầu được Chúa công bố, rồi được những người đã nghe xác nhận cho chúng ta.”'
    reason: Bảo lưu cách nối đại từ quan hệ ἥτις trực tiếp với “sự cứu rỗi”, thay vì bắt đầu một câu giải thích mới.
lexical_decisions:
- source_word: πῶς ἡμεῖς ἐκφευξόμεθα
  choice: Làm sao chúng ta thoát khỏi được
  rationale: Giữ nguyên hình thức câu hỏi tu từ ở thì tương lai và sức nặng cảnh báo, không chuyển thành lời khẳng định rằng chắc chắn không thể thoát.
- source_word: τηλικαύτης ἀμελήσαντες σωτηρίας
  choice: nếu thờ ơ với một sự cứu rỗi lớn lao dường ấy
  rationale: Diễn đạt phân từ ἀμελήσαντες theo nghĩa điều kiện tự nhiên trong tiếng Việt; “thờ ơ với” thể hiện sự không quan tâm, sao nhãng, còn “lớn lao dường ấy” giữ sắc thái nhấn mạnh của τηλικαύτης.
- source_word: σωτηρίας
  choice: sự cứu rỗi
  rationale: Thuật ngữ quen thuộc, phù hợp ngữ cảnh cứu chuộc và giải cứu trong thư Hê-bơ-rơ.
- source_word: ἥτις
  choice: Sự cứu rỗi này
  rationale: Lặp lại danh từ để chỉ rõ tiền ngữ của đại từ quan hệ và tạo câu tiếng Việt tự nhiên; chú thích bảo lưu cách nối sát cấu trúc Hy Lạp hơn.
- source_word: ἀρχὴν λαβοῦσα λαλεῖσθαι
  choice: ban đầu được truyền phán
  rationale: Diễn đạt tự nhiên thành ngữ mang nghĩa lời cứu rỗi bắt đầu được nói ra; “truyền phán” phù hợp với lời do Chúa nói mà không thêm ý nghĩa ngoài bản văn.
- source_word: διὰ τοῦ κυρίου
  choice: qua Chúa
  rationale: Giữ sắc thái trung gian hoặc tác nhân của διά với sở hữu cách và tước hiệu κύριος; trong ngữ cảnh, “Chúa” chỉ về Đức Giê-su.
- source_word: ὑπὸ τῶν ἀκουσάντων
  choice: được những người đã nghe
  rationale: Giữ cấu trúc bị động và không thêm tân ngữ “Ngài” vốn chỉ được hàm ý trong tiếng Hy Lạp, nhờ đó bảo toàn mức độ hàm ẩn của nguyên văn.
- source_word: εἰς ἡμᾶς ἐβεβαιώθη
  choice: được ... xác nhận cho chúng ta
  rationale: “Xác nhận” thể hiện việc làm cho sứ điệp trở nên chắc chắn, đáng tin; “cho chúng ta” diễn đạt hướng đến người tiếp nhận.
theological_decisions:
- issue: Đối tượng của τοῦ κυρίου
  choice: Dịch là “Chúa”, trong ngữ cảnh được hiểu là Đức Giê-su, Đấng đầu tiên truyền phán sứ điệp cứu rỗi.
  alternative: Hiểu chung là Đức Chúa Trời với tư cách Chúa.
  rationale: Mệnh đề kế tiếp nói đến những người đã nghe rồi xác nhận cho “chúng ta”, phù hợp nhất với lời rao truyền của Đức Giê-su trong chức vụ trên đất và lời chứng của những người trực tiếp nghe Ngài.
- issue: Sức cảnh báo của câu hỏi
  choice: 'Giữ nguyên câu hỏi tu từ: “Làm sao chúng ta thoát khỏi được...?”'
  alternative: 'Chuyển thành lời khẳng định: “Chúng ta chắc chắn sẽ không thoát khỏi...”'
  rationale: Nguyên văn đặt câu hỏi ở thì tương lai. Cách dịch này giữ nguyên sức cảnh báo và sự căng thẳng thần học thay vì diễn giải thành một mệnh đề tuyệt đối.
- issue: Quan hệ của ἥτις với σωτηρίας
  choice: Mở câu mới bằng “Sự cứu rỗi này” để làm rõ sở chỉ.
  alternative: Nối bằng đại từ quan hệ “là điều ban đầu được truyền phán...”
  rationale: Cả hai đều khả dĩ; bản chính ưu tiên độ rõ ràng trong tiếng Việt, còn chú thích bảo lưu cấu trúc quan hệ sát nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “chúng ta” vì tác giả tự đặt mình cùng độc giả trong lời cảnh báo; giữ dấu phẩy cuối câu vì câu Hy Lạp tiếp tục sang Hê-bơ-rơ 2:4.
