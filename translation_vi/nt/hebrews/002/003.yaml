  verdict: revise
  source_fidelity: 'Bản dịch giữ được câu hỏi tu từ, điều kiện của phân từ ἀμελήσαντες, sự nhấn mạnh của τηλικαύτης, và trình tự: sự cứu rỗi được nói ra trước bởi Chúa rồi được các người nghe xác nhận cho chúng ta. Tuy nhiên, “thờ ơ với” có thể chỉ một thái độ lãnh đạm hơn là sự sao lãng/bỏ mặc hàm trong ἀμελέω; “truyền phán qua Chúa” vừa kém tự nhiên vừa có sắc thái tôn giáo cổ không cần thiết.'
