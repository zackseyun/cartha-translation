source:
  edition: SBLGNT
  text: συνεπιμαρτυροῦντος τοῦ θεοῦ σημείοις τε καὶ τέρασιν καὶ ποικίλαις δυνάμεσιν καὶ πνεύματος ἁγίου μερισμοῖς κατὰ τὴν αὐτοῦ θέλησιν;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/004.yaml
  text: while God also bore witness with signs and wonders and various miracles and distributions of the Holy Spirit according to his will.
translation:
  language: vi
  text: Đồng thời, Đức Chúa Trời cũng làm chứng bằng các dấu lạ, những việc kỳ diệu, các phép lạ khác nhau[a], và sự phân phát của Đức Thánh Linh[b], theo ý muốn của Ngài.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “các quyền năng khác nhau” hoặc “các việc quyền năng khác nhau.” Từ Hy Lạp có thể chỉ những biểu hiện của quyền năng và, trong ngữ cảnh này, những việc làm siêu nhiên.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “những sự phân chia” hoặc “những phần được phân chia của Đức Thánh Linh.” Nguyên văn không nói rõ là “ân tứ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: συνεπιμαρτυροῦντος τοῦ θεοῦ
  choice: Đồng thời, Đức Chúa Trời cũng làm chứng
  rationale: Phân từ sở hữu cách diễn tả hành động đi kèm với sự việc ở câu trước. “Đồng thời” làm rõ quan hệ này, còn “cũng” giữ sắc thái bổ sung của tiền tố συν- mà không tạo cách diễn đạt cứng nhắc.
- source_word: σημείοις τε καὶ τέρασιν
  choice: bằng các dấu lạ, những việc kỳ diệu
  rationale: Cách dùng “bằng” thể hiện sở cách phương tiện. “Dấu lạ” giữ chức năng làm chứng của σημεῖον, còn “việc kỳ diệu” diễn đạt những hành động gây kinh ngạc của τέρας.
- source_word: ποικίλαις δυνάμεσιν
  choice: nhiều việc quyền năng khác nhau
  rationale: δύναμις có nghĩa cơ bản là quyền năng và trong ngữ cảnh này chỉ những biểu hiện hay hành động siêu nhiên của quyền năng ấy. Cách dịch này giữ được phạm vi nghĩa rộng hơn “phép lạ”; ποικίλαις được diễn đạt bằng “nhiều… khác nhau”.
- source_word: πνεύματος ἁγίου μερισμοῖς
  choice: những phần ban của Đức Thánh Linh
  rationale: μερισμοί chỉ những phần được phân chia hay phân ban. Không thêm từ “ân tứ,” vì từ ấy không có mặt trong nguyên văn. “Những phần ban” tương đối tự nhiên nhưng vẫn giữ sự mở về quan hệ sở hữu trong cụm sở hữu cách.
- source_word: κατὰ τὴν αὐτοῦ θέλησιν
  choice: theo ý muốn của Ngài
  rationale: Diễn đạt quan hệ phù hợp với ý muốn trong κατά + đối cách. “Ngài” tự nhiên nhất quy chiếu về Đức Chúa Trời, chủ thể chi phối của mệnh đề.
theological_decisions:
- issue: Chủ thể được đại từ αὐτοῦ quy chiếu trong cụm “theo ý muốn của Ngài”
  choice: Hiểu “Ngài” là Đức Chúa Trời
  alternative: Có thể hiểu rộng hơn là Đức Thánh Linh, dù cách này kém tự nhiên hơn về cú pháp
  rationale: Đức Chúa Trời là chủ thể của phân từ “làm chứng” và chi phối toàn bộ chuỗi phương tiện làm chứng; vì vậy đại từ tự nhiên nhất trở lại với Đức Chúa Trời. Bản dịch không thêm lời giải thích thần học vượt quá cấu trúc câu.
- issue: Cách thể hiện πνεύματος ἁγίου
  choice: Đức Thánh Linh
  alternative: thánh linh
  rationale: Trong ngữ cảnh này, cụm từ hoạt động như danh xưng quen thuộc. Cách viết hoa giữ cách gọi trang trọng và không thêm diễn giải giáo phái.
- issue: Nội dung của μερισμοῖς
  choice: Không thêm “ân tứ” vào chính văn
  alternative: các ân tứ do Đức Thánh Linh phân phát
  rationale: Nguyên văn nói đến những sự phân chia hay phần ban nhưng không nêu rõ “ân tứ.” Giữ cách diễn đạt mở tránh xác định nội dung mà tác giả không nói rõ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cấu trúc liệt kê được giữ rõ ràng; dấu phẩy trước cụm cuối giúp “theo ý muốn của Ngài” bổ nghĩa cho toàn bộ việc Đức Chúa Trời làm chứng, thay vì chỉ cho thành phần đứng ngay trước.
