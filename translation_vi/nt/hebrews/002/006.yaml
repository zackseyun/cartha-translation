id: HEB.2.6
reference: Hebrews 2:6
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: διεμαρτύρατο δέ πού τις λέγων· Τί ἐστιν ἄνθρωπος ὅτι μιμνῄσκῃ αὐτοῦ, ἢ υἱὸς ἀνθρώπου ὅτι ἐπισκέπτῃ αὐτόν;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/006.yaml
  text: But someone has testified somewhere[a], saying, “What is man, that you remember him, or the son of man[c][b], that you care for him?”
translation:
  language: vi
  text: 'Nhưng có người đã làm chứng ở một nơi rằng: “Loài người là gì mà Ngài nhớ đến họ, hay con loài người là gì[a] mà Ngài đoái đến họ[b]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Con loài người” vọng lại Thi Thiên 8:4; trong ngữ cảnh Thi Thiên, đây là lối diễn đạt thi ca song song với “loài người”, chỉ nhân loại. Trong mạch văn rộng hơn của thư Hê-bơ-rơ, đoạn này cũng có ý nghĩa đối với Đức Giê-su.
    reason: cross_reference
  - marker: b
    text: 'Hoặc: “thăm viếng họ” hoặc “chăm nom họ”. Động từ Hy Lạp diễn tả sự quan tâm chú ý, có thể được biểu lộ bằng việc viếng thăm hay chăm sóc.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διεμαρτύρατο
  choice: đã làm chứng
  rationale: Diễn đạt hành động làm chứng có trọng lượng, đồng thời tự nhiên trong tiếng Việt và phù hợp với việc dẫn lời Kinh Thánh.
- source_word: δέ
  choice: Nhưng
  rationale: Đánh dấu sự chuyển ý có sắc thái tương phản nhẹ với lập luận ngay trước đó.
- source_word: πού τις
  choice: có người ... ở đâu đó
  rationale: Giữ cách dẫn nhập không nêu tên người nói và địa điểm của nguyên văn; đây không nhất thiết hàm ý tác giả không biết nguồn trích dẫn.
- source_word: Τί ἐστιν ἄνθρωπος
  choice: Loài người là gì
  rationale: ἄνθρωπος mang nghĩa đại diện cho nhân loại. “Loài người” vừa tự nhiên trong câu thơ tiếng Việt vừa tránh thu hẹp nghĩa vào một người nam.
- source_word: μιμνῄσκῃ αὐτοῦ
  choice: Ngài nhớ đến họ
  rationale: “Nhớ đến” truyền đạt việc lưu tâm chứ không chỉ hồi tưởng; đại từ “họ” chỉ loài người theo nghĩa tập thể.
- source_word: υἱὸς ἀνθρώπου
  choice: con người
  rationale: Giữ hình thức song song giàu chất thơ của Thi Thiên 8 và ý nghĩa chỉ con người trong nguồn trích, nhưng không viết hoa để tránh quyết định trước rằng đây là một danh hiệu trực tiếp.
- source_word: ἐπισκέπτῃ αὐτόν
  choice: Ngài đoái đến họ
  rationale: “Đoái đến” diễn tả sự quan tâm chủ động và chăm nom, phù hợp văn phong trang trọng của lời thơ; không giới hạn động từ vào một cuộc viếng thăm theo nghĩa đen.
theological_decisions:
- issue: Cụm υἱὸς ἀνθρώπου có nên được trình bày rõ như một danh hiệu chỉ Đấng Mê-si-a hay không
  choice: Dịch là “con người” và không viết hoa trong câu trích dẫn.
  alternative: “Con Người” hoặc diễn giải hoàn toàn theo nghĩa chung là “một người phàm”.
  rationale: Trong Thi Thiên 8, cụm từ song song với “loài người” và nói về nhân loại; mạch văn thư Hê-bơ-rơ sau đó cũng làm nổi bật ý nghĩa của đoạn này đối với Đức Chúa Jêsus. Cách dịch không viết hoa giữ nguyên sức căng giữa ý nghĩa phổ quát và sự ứng nghiệm nơi Ngài.
- issue: Số ít đại diện của ἄνθρωπος và αὐτός
  choice: Dùng “loài người” và đại từ tập thể “họ”.
  alternative: “Người là gì mà Ngài nhớ đến người” hoặc “con người là gì mà Ngài nhớ đến nó”.
  rationale: Tiếng Hy Lạp dùng số ít mang tính đại diện. Tiếng Việt hiện đại diễn đạt nghĩa nhân loại tự nhiên hơn bằng “loài người ... họ”, mà không biến đại từ thành chỉ riêng một cá nhân.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và có nhịp thơ. “Ngài” được dùng trong lời hướng về Đức Chúa Trời. Bản dịch ưu tiên nghĩa tự nhiên của số ít đại diện trong tiếng Việt, đồng thời giữ cụm “con người” để bảo toàn liên hệ văn chương và sự căng thẳng thần học của đoạn trích.
