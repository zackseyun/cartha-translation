reference: Hebrews 2:17
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὅθεν ὤφειλεν κατὰ πάντα τοῖς ἀδελφοῖς ὁμοιωθῆναι, ἵνα ἐλεήμων γένηται καὶ πιστὸς ἀρχιερεὺς τὰ πρὸς τὸν θεόν, εἰς τὸ ἱλάσκεσθαι τὰς ἁμαρτίας τοῦ λαοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/017.yaml
  text: Therefore he had to become like his brothers in every respect[a], so that he might become a merciful and faithful high priest in the things pertaining to God[b], to make atonement for the sins of the people.
translation:
  language: vi
  text: Vì vậy, Ngài phải trở nên giống anh em mình về mọi phương diện[a], để trở thành một thầy tế lễ thượng phẩm đầy lòng thương xót và trung tín trong những việc liên quan đến Đức Chúa Trời, nhằm chuộc tội cho dân.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Anh em” trong tiếng Hy Lạp là một từ thân tộc ở giống đực số nhiều; trong ngữ cảnh, từ này cũng có thể bao gồm anh chị em trong gia đình đức tin.
    reason: lexical_alternative
  - marker: b
    text: Cụm “chuộc tội cho dân” cũng có thể được hiểu với sắc thái “làm nguôi cơn giận của Đức Chúa Trời vì tội lỗi của dân” hoặc “xóa bỏ tội lỗi của dân.”
    reason: alternative_reading
lexical_decisions:
- source_word: ὅθεν
  choice: Vì vậy
  rationale: Diễn tả kết luận rút ra từ lập luận ngay trước đó một cách tự nhiên và rõ ràng.
- source_word: ὤφειλεν
  choice: phải
  rationale: Giữ ý nghĩa về sự cần thiết hay bổn phận trong chương trình cứu chuộc, nhưng không hàm ý Ngài bị cưỡng ép từ bên ngoài.
- source_word: κατὰ πάντα
  choice: về mọi phương diện
  rationale: Cách nói tự nhiên trong tiếng Việt, đồng thời giữ phạm vi toàn diện của sự tương đồng.
- source_word: τοῖς ἀδελφοῖς
  choice: anh em mình
  rationale: Giữ hình ảnh gia đình và hình thức giống đực số nhiều của nguyên văn; trong ngữ cảnh, từ này có thể bao gồm cả cộng đồng anh chị em thuộc gia đình đức tin.
- source_word: ὁμοιωθῆναι
  choice: trở nên giống
  rationale: Phản ánh dạng bị động của động từ theo lối diễn đạt tự nhiên, phù hợp với ngữ cảnh Con chia sẻ thân phận con người.
- source_word: ἵνα ... εἰς τό
  choice: để ... nhằm
  rationale: Phân biệt và thể hiện rõ hai nét mục đích liên kết trong câu mà không làm tiếng Việt nặng nề.
- source_word: ἐλεήμων
  choice: đầy lòng thương xót
  rationale: Diễn đạt tự nhiên đặc tính thương xót trong chức vụ tế lễ.
- source_word: πιστός
  choice: trung tín
  rationale: Giữ nghĩa về sự trung thành, đáng tin cậy trong việc thi hành chức vụ trước Đức Chúa Trời.
- source_word: ἀρχιερεύς
  choice: thầy tế lễ thượng phẩm
  rationale: Thuật ngữ Kinh Thánh tiếng Việt quen thuộc cho chức vụ đứng đầu hàng tế lễ.
- source_word: τὰ πρὸς τὸν θεόν
  choice: trong những việc liên quan đến Đức Chúa Trời
  rationale: Giữ nét trang trọng và phạm vi chức vụ tế lễ hướng về Đức Chúa Trời mà không diễn giải quá mức.
- source_word: ἱλάσκεσθαι
  choice: chuộc tội cho
  rationale: Cách nói dễ hiểu, phù hợp bối cảnh tế lễ và không tự ý thu hẹp nghĩa vào riêng việc làm nguôi cơn thịnh nộ hay xóa bỏ tội lỗi.
- source_word: τοῦ λαοῦ
  choice: dân chúng
  rationale: Phản ánh nghĩa tập thể của λαός, chỉ dân mà vị thầy tế lễ đại diện.
theological_decisions:
- issue: Ý nghĩa của ἱλάσκεσθαι trong bối cảnh chuộc tội
  choice: chuộc tội cho
  alternative: làm nguôi giận vì; xóa bỏ tội lỗi của
  rationale: “Chuộc tội cho” là cách diễn đạt dễ hiểu và đủ rộng trong bối cảnh tế lễ, giữ được sự căng thẳng giữa các sắc thái làm nguôi giận và xóa bỏ tội mà không quyết định thay cho nguyên văn.
- issue: Phạm vi giới tính của ἀδελφοῖς
  choice: anh em mình
  alternative: anh chị em mình
  rationale: Bản văn dùng danh từ giống đực số nhiều mang tính gia đình. Bản chính giữ hình thức ấy, còn chú thích nêu rõ khả năng bao gồm cả nam lẫn nữ trong ngữ cảnh.
- issue: Tính cần thiết được diễn tả bởi ὤφειλεν
  choice: Ngài phải
  alternative: Ngài có bổn phận phải; điều cần thiết là Ngài
  rationale: Giữ sự cần thiết trong mục đích cứu chuộc của Đức Chúa Trời mà không giải thích đó là sự cưỡng ép bên ngoài.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” để chỉ Chúa Giê-su và “Đức Chúa Trời” cho θεός. Cấu trúc câu bám sát quan hệ suy luận và mục đích của nguyên văn nhưng tránh lối diễn đạt quá hàn lâm.
