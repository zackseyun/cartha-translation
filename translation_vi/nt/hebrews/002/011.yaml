id: HEB.2.11
reference: Hebrews 2:11
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὅ τε γὰρ ἁγιάζων καὶ οἱ ἁγιαζόμενοι ἐξ ἑνὸς πάντες· δι’ ἣν αἰτίαν οὐκ ἐπαισχύνεται ἀδελφοὺς αὐτοὺς καλεῖν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/011.yaml
  text: For both the one who sanctifies and those who are being sanctified are all from one[a]; for this reason he is not ashamed to call them brothers[b],
translation:
  language: vi
  text: Vì cả Đấng thánh hóa và những người đang được thánh hóa đều từ một[a] mà ra. Vì lý do đó, Ngài không hổ thẹn gọi họ là anh em[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể hiểu là “từ một Cha”, “cùng một nguồn” hoặc “cùng một tổ tiên”. Tiếng Hy Lạp không nói rõ “một” chỉ về ai hay điều gì.
    reason: alternative_reading
  - marker: b
    text: “Anh em” dịch danh từ số nhiều giống đực ἀδελφοὺς; trong ngữ cảnh, từ này có thể chỉ cộng đồng người tin, kể cả phụ nữ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἁγιάζων
  choice: Đấng làm cho nên thánh
  rationale: Phân từ hiện tại chủ động được dùng như danh từ. Cách dịch này diễn đạt rõ hành động ἁγιάζω bằng tiếng Việt tự nhiên và giữ sắc thái tôn nghiêm của chủ thể được ngữ cảnh xác định là Con.
- source_word: οἱ ἁγιαζόμενοι
  choice: những người đang được làm nên thánh
  rationale: Phân từ hiện tại bị động trình bày họ như những người đang tiếp nhận hành động làm nên thánh; từ “đang” giữ được khía cạnh tiến triển mà không biến hành động ấy thành thành quả do chính họ tạo ra.
- source_word: ἐξ ἑνὸς
  choice: ra từ một
  rationale: Nguyên văn không nói rõ “một” là Cha, một nguồn, một tổ tiên hay một thực tại chung nào khác. Lối dịch ngắn gọn này cố ý giữ nguyên sự không xác định ấy.
- source_word: πάντες
  choice: đều
  rationale: “Đều” bao gồm cả Đấng làm cho nên thánh lẫn những người được làm nên thánh và thể hiện lực bao quát của πάντες.
- source_word: δι’ ἣν αἰτίαν
  choice: Chính vì thế
  rationale: Diễn đạt tự nhiên quan hệ hệ quả với mệnh đề trước; “chính” làm nổi bật căn cứ vừa nêu mà không bổ sung nội dung mới.
- source_word: οὐκ ἐπαισχύνεται
  choice: không hổ thẹn
  rationale: Giữ trực tiếp sắc thái danh dự–hổ thẹn của động từ, đồng thời là cách nói tự nhiên trong tiếng Việt hiện đại.
- source_word: ἀδελφοὺς
  choice: anh em
  rationale: Danh từ số nhiều giống đực được chuyển bằng cách gọi thân tộc thông dụng “anh em”; trong ngữ cảnh cộng đồng đức tin, từ này có thể bao gồm cả phụ nữ, điều được nói rõ trong chú thích.
- source_word: καλεῖν
  choice: gọi
  rationale: Diễn đạt tự nhiên động từ nguyên mẫu đi sau “không hổ thẹn” và giữ ý xưng gọi họ bằng một danh xưng gia đình.
theological_decisions:
- issue: Chủ thể hàm ẩn của “không hổ thẹn” và đối tượng quy chiếu của “một”
  choice: Dùng “Ngài” cho chủ thể mà ngữ cảnh xác định là Con, nhưng để “một” không có danh từ giải thích trong chính văn.
  alternative: Có thể diễn giải “ra từ một Cha”, “cùng một nguồn” hoặc “cùng một tổ tiên”.
  rationale: Ngữ cảnh gần cho thấy Đấng làm cho nên thánh là Con/Đức Giê-su, nên “Ngài” giúp câu tiếng Việt rõ chủ ngữ. Tuy nhiên, ἐξ ἑνὸς không nêu đối tượng quy chiếu; thêm “Cha”, “nguồn” hay “tổ tiên” sẽ giải quyết một sự mơ hồ thần học mà nguyên văn vẫn để ngỏ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. “Làm cho nên thánh” được ưu tiên hơn thuật ngữ Hán–Việt “thánh hóa” để người đọc phổ thông dễ hiểu, đồng thời hai vế chủ động–bị động được giữ song song. “Ra từ một” hơi cô đọng nhưng cần thiết để bảo toàn sự mơ hồ có thật của nguyên văn.
