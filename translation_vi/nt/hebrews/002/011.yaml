- from: Vì Đấng làm cho nên thánh và những người đang được làm nên thánh đều ra từ một[a]. Chính vì thế, Ngài không hổ thẹn gọi họ là anh em[b].
  to: Vì cả Đấng thánh hóa và những người đang được thánh hóa đều từ một[a] mà ra. Vì lý do đó, Ngài không hổ thẹn gọi họ là anh em[b].
  rationale: Bản sửa thay cách diễn đạt ít tự nhiên bằng thuật ngữ “thánh hóa,” vốn vừa thông dụng vừa giữ được liên hệ từ vựng giữa hai phân từ Hy Lạp. “Từ một mà ra” và chú thích a tiếp tục bảo tồn sự mơ hồ có chủ ý của nguyên văn. Không thay đổi chủ thể hàm ẩn được ngữ cảnh xác định là Con, cũng không giải thích giáo lý về “một” trong chính văn.
