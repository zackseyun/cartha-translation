source:
  edition: SBLGNT
  text: Οὐ γὰρ ἀγγέλοις ὑπέταξεν τὴν οἰκουμένην τὴν μέλλουσαν, περὶ ἧς λαλοῦμεν·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/005.yaml
  text: For he did not subject the world to come to angels[a], about which we are speaking.
translation:
  language: vi
  text: Vì Đức Chúa Trời không đặt thế giới tương lai[a]—thế giới mà chúng ta đang nói đến—dưới quyền các thiên sứ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “thế giới có người ở trong thời sẽ đến.”'
    reason: Giữ sắc thái từ nguyên của οἰκουμένη và ý tương lai của τὴν μέλλουσαν, đồng thời tránh sự mơ hồ của cách diễn đạt “thế giới có người ở sẽ đến”.
lexical_decisions:
- source_word: Οὐ γὰρ
  choice: Vì ... không
  rationale: “Vì” giữ chức năng giải thích và nối kết của γάρ với lập luận trước đó; “không” trực tiếp phủ định động từ.
- source_word: ἀγγέλοις
  choice: các thiên sứ
  rationale: Trong văn cảnh thư Hê-bơ-rơ, từ này chỉ các hữu thể thiên giới, không phải sứ giả loài người.
- source_word: ὑπέταξεν
  choice: đặt ... dưới quyền
  rationale: Cách diễn đạt này truyền đạt ý đặt dưới thẩm quyền hoặc sự cai trị, đồng thời tự nhiên hơn trong tiếng Việt hiện đại.
- source_word: τὴν οἰκουμένην
  choice: thế giới
  rationale: οἰκουμένη có thể chỉ thế giới có người ở; trong câu này, “thế giới” gọn và tự nhiên, còn sắc thái cụ thể hơn được ghi ở chú thích.
- source_word: τὴν μέλλουσαν
  choice: tương lai
  rationale: Phân từ μέλλουσαν biểu thị điều sẽ đến; “tương lai” giữ hướng quy chiếu cánh chung mà không xác định quá mức bản chất hay thời điểm của thế giới ấy.
- source_word: περὶ ἧς λαλοῦμεν
  choice: mà chúng ta đang nói đến
  rationale: “Đang nói đến” thể hiện lời bàn luận đang tiếp diễn và tạo quan hệ rõ ràng với “thế giới tương lai” trong tiếng Việt.
theological_decisions:
- issue: Đối tượng của cụm “thế giới tương lai”
  choice: Một thế giới hoặc trật tự sẽ đến, không ở dưới quyền các thiên sứ
  alternative: Thế giới có người ở nói chung; hoặc riêng thời đại Tin Lành
  rationale: Cụm τὴν οἰκουμένην τὴν μέλλουσαν hướng tự nhiên đến thế giới hay trật tự sẽ đến. Bản dịch không đồng nhất nó với một hệ thống thời kỳ cụ thể, nhờ đó giữ nguyên độ mở thần học của câu.
- issue: Chủ ngữ hàm ẩn của ὑπέταξεν
  choice: Đức Chúa Trời
  alternative: Giữ chủ ngữ đại từ hàm ẩn là “Ngài”
  rationale: Động từ Hy Lạp ngôi thứ ba số ít không nêu danh từ chủ ngữ; văn cảnh chỉ Đức Chúa Trời là tác nhân. Nêu “Đức Chúa Trời” giúp câu tiếng Việt đứng độc lập và tránh đại từ thiếu tiền ngữ, nhưng không thay đổi tác nhân theo văn cảnh.
translation_notes:
  register: Văn phong trang trọng, sáng rõ và hiện đại. “Đặt ... dưới quyền” tự nhiên trong tiếng Việt và bảo toàn ý cai trị; trật tự câu được điều chỉnh để cụm quan hệ “mà chúng ta đang nói đến” bổ nghĩa rõ cho “thế giới tương lai”.
