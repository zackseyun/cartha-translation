revisions:
- from: Vì Đức Chúa Trời không đặt thế giới tương lai mà chúng ta đang nói đến dưới quyền các thiên sứ.[a]
  to: Vì Đức Chúa Trời không đặt thế giới tương lai[a]—thế giới mà chúng ta đang nói đến—dưới quyền các thiên sứ.
  rationale: Chỉ điều chỉnh vị trí neo chú thích, làm rõ cách diễn đạt trong chú thích, và dùng gạch ngang để phần “thế giới mà chúng ta đang nói đến” được nhận rõ là lời giải thích cho “thế giới tương lai”. Nghĩa, mức độ mơ hồ thần học, và thuật ngữ chính của bản dịch được giữ nguyên.
