  - severity: low
    issue: Câu chú thích “thế giới có người ở sẽ đến” mơ hồ trong tiếng Việt.
    rationale: Cấu trúc này có thể bị hiểu là “một thế giới có những người sẽ đến”, thay vì “thế giới có người ở, thuộc thời tương lai”. Cần một cách diễn đạt rõ hơn mà vẫn chỉ là lựa chọn từ vựng.
