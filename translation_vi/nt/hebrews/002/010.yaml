    issue: “đã đưa Đấng mở đường ... đến sự trọn vẹn” xử lý τελειῶσαι như một động từ quá khứ độc lập.
    rationale: τελειῶσαι là nguyên mẫu đi với ἔπρεπεν. Cần diễn đạt “việc đưa/làm cho ... đạt đến sự trọn vẹn là thích hợp” hoặc cấu trúc tương đương.
  - severity: medium
