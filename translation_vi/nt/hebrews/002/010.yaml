source:
  edition: SBLGNT
  text: Ἔπρεπεν γὰρ αὐτῷ, δι’ ὃν τὰ πάντα καὶ δι’ οὗ τὰ πάντα, πολλοὺς υἱοὺς εἰς δόξαν ἀγαγόντα τὸν ἀρχηγὸν τῆς σωτηρίας αὐτῶν διὰ παθημάτων τελειῶσαι.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/010.yaml
  text: For it was fitting for him—for whom are all things and through whom are all things—in bringing many sons to glory[d][c][b][a], to perfect the pioneer of their salvation through sufferings.
translation:
  language: vi
  text: Thật vậy, đối với Ngài—Đấng mà vì Ngài muôn vật hiện hữu và nhờ Ngài muôn vật hiện hữu—thì, khi dẫn nhiều con trai đến vinh quang[d][a], việc đưa Đấng mở đường của sự cứu rỗi của họ[b] đến sự trọn vẹn qua những đau khổ[c] là thích hợp.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Nhiều con trai” dịch sát cách nói Hy Lạp và nhấn mạnh địa vị làm con cùng quyền thừa kế; trong văn mạch, cách nói này không chỉ giới hạn ở nam giới.
    reason: lexical_alternative
  - marker: b
    text: “Đấng mở đường” cũng có thể dịch là “Đấng khởi xướng”, “Đấng lãnh đạo” hoặc “Đấng sáng lập” sự cứu rỗi của họ.
    reason: lexical_alternative
  - marker: c
    text: “Đưa ... đến sự trọn vẹn” ở đây có nghĩa là đưa đến mục tiêu hoặc sự hoàn tất đã định qua những đau khổ, chứ không phải sửa chữa một khuyết điểm đạo đức.
    reason: lexical_alternative
  - marker: d
    text: 'Cấu trúc Hy Lạp cũng có thể được hiểu theo quan hệ mục đích: “việc đưa Đấng mở đường của sự cứu rỗi của họ đến sự trọn vẹn qua những đau khổ, để dẫn nhiều con trai đến vinh quang.”'
    reason: syntactic_alternative
lexical_decisions:
- source_word: Ἔπρεπεν
  choice: thật thích hợp
  rationale: Diễn đạt điều phù hợp và phải lẽ trong ý định của Đức Chúa Trời, đồng thời giữ sắc thái đánh giá của động từ πρέπω.
- source_word: αὐτῷ
  choice: Ngài
  rationale: Đại từ chỉ về Đức Chúa Trời trong văn cảnh; phần giải thích chen giữa giúp xác định đối tượng mà không thay đại từ bằng danh xưng.
- source_word: δι’ ὃν τὰ πάντα καὶ δι’ οὗ τὰ πάντα
  choice: Đấng mà muôn vật hướng về và nhờ Ngài mà muôn vật hiện hữu
  rationale: 'Phân biệt hai sắc thái của διά: Đức Chúa Trời là cùng đích của muôn vật và cũng là Đấng qua đó muôn vật hiện hữu.'
- source_word: πολλοὺς υἱοὺς
  choice: nhiều con trai
  rationale: Giữ danh từ giống đực υἱούς và sắc thái địa vị làm con, quyền thừa kế; chú thích làm rõ phạm vi không chỉ gồm nam giới.
- source_word: εἰς δόξαν
  choice: đến vinh quang
  rationale: Giữ ý chuyển động hướng tới đích của εἰς.
- source_word: ἀγαγόντα
  choice: trong khi đưa
  rationale: Giữ liên hệ phân từ với hành động chính mà không biến nó thành một mệnh đề mục đích chắc chắn hơn nguyên văn.
- source_word: ἀρχηγὸν
  choice: Đấng mở đường
  rationale: Diễn đạt cả ý khởi đầu và dẫn đường của ἀρχηγός bằng cách nói tự nhiên trong tiếng Việt hiện đại.
- source_word: τῆς σωτηρίας αὐτῶν
  choice: cứu rỗi họ
  rationale: Cấu trúc tiếng Việt gọn và tự nhiên, vẫn giữ quan hệ giữa Đấng mở đường và sự cứu rỗi thuộc về họ.
- source_word: διὰ παθημάτων
  choice: qua những đau khổ
  rationale: Giữ giới từ chỉ phương tiện hoặc tiến trình và hình thức số nhiều của παθημάτων.
- source_word: τελειῶσαι
  choice: đưa ... đến sự trọn vẹn
  rationale: Diễn đạt việc đạt tới mục tiêu hay sự hoàn tất được định, tránh gợi ý rằng Đấng ấy trước đó có khuyết điểm đạo đức.
theological_decisions:
- issue: Ý nghĩa của τελειῶσαι khi nói về Đấng Con
  choice: đưa ... đến sự trọn vẹn
  alternative: làm cho hoàn hảo; kiện toàn
  rationale: Trong Hê-bơ-rơ, từ này có thể chỉ việc đưa đến mục tiêu, hoàn tất vai trò hoặc làm nên thích hợp qua đau khổ; bản dịch không hàm ý sửa chữa một khuyết điểm đạo đức.
- issue: Cách dịch πολλοὺς υἱοὺς
  choice: nhiều con trai
  alternative: nhiều người con; nhiều con cái
  rationale: Giữ hình thức giống đực và âm hưởng địa vị làm con cùng quyền thừa kế trong nguyên văn, nhưng chú thích xác nhận phạm vi bao gồm toàn thể con cái Đức Chúa Trời.
- issue: Quan hệ của ἀγαγόντα với τελειῶσαι
  choice: trong khi đưa nhiều con trai đến vinh quang, đã đưa Đấng mở đường ... đến sự trọn vẹn
  alternative: đưa Đấng mở đường ... đến sự trọn vẹn để đưa nhiều con trai đến vinh quang
  rationale: Giữ cấu trúc phân từ của tiếng Hy Lạp và không quyết định dứt khoát rằng đây là quan hệ mục đích; chú thích nêu cách hiểu thay thế.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại. Dấu gạch ngang giữ phần mô tả mang âm hưởng tín biểu; “Đấng mở đường” dễ hiểu hơn từ Hán-Việt chuyên biệt, còn “đưa ... đến sự trọn vẹn” bảo toàn nội dung thần học mà không gợi sự bất toàn đạo đức.
