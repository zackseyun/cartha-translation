    rationale: Phân từ aorist này liên hệ với chủ thể của ἔπρεπεν và nguyên mẫu τελειῶσαι; bản dịch nên giữ quan hệ hoàn cảnh mà không tạo một chuỗi hai động từ quá khứ thiếu liên kết.
  - severity: low
    issue: Chú thích a giải thích phạm vi “nhiều con trai” quá xác quyết bằng cách nêu rõ “mọi con cái Đức Chúa Trời”.
    rationale: Ý bao hàm có cơ sở từ văn mạch, nhưng không được phát biểu trực tiếp trong cụm từ này. Cách diễn đạt thận trọng hơn bảo toàn ranh giới giữa dịch thuật và diễn giải.
