id: HEB.2.18
reference: Hebrews 2:18
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐν ᾧ γὰρ πέπονθεν αὐτὸς πειρασθείς, δύναται τοῖς πειραζομένοις βοηθῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/018.yaml
  text: For because he himself suffered when he was tempted[a], he is able to help those who are being tempted.
translation:
  language: vi
  text: Vì chính Ngài đã chịu đau khổ khi bị cám dỗ[a], nên Ngài có thể giúp đỡ những người đang bị cám dỗ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch là “bị thử thách” ở cả hai chỗ: “Vì chính Ngài đã chịu đau khổ khi bị thử thách, nên Ngài có thể giúp đỡ những người đang bị thử thách.” Động từ Hy Lạp có thể mang nghĩa “cám dỗ” hoặc “thử thách”, tùy ngữ cảnh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ᾧ γὰρ
  choice: Vì ... nên
  rationale: Cụm ἐν ᾧ mang sắc thái nguyên nhân, còn γὰρ nối câu này như lời giải thích cho câu trước. Cấu trúc “Vì ... nên” diễn đạt tự nhiên cả căn cứ lẫn kết quả trong tiếng Việt, dù không tách riêng hai từ nối.
- source_word: πέπονθεν
  choice: đã chịu đau khổ
  rationale: Động từ πάσχω ở thì hoàn thành chỉ kinh nghiệm đau khổ đã thực sự xảy ra và vẫn có ý nghĩa đối với khả năng trợ giúp hiện tại của Ngài. “Đã chịu đau khổ” tự nhiên và rõ hơn cách dịch nặng tính hình thái.
- source_word: αὐτὸς
  choice: chính Ngài
  rationale: 'Giữ sắc thái nhấn mạnh của đại từ: chính Con đã đích thân trải qua điều được nói đến.'
- source_word: πειρασθείς
  choice: khi bị cám dỗ
  rationale: Phân từ được diễn đạt bằng mệnh đề thời gian tự nhiên trong tiếng Việt. πειράζω có thể là “cám dỗ” hoặc “thử thách”; bản chính chọn “cám dỗ” theo ngữ cảnh và Hê-bơ-rơ 4:15, còn nghĩa kia được giữ trong chú thích.
- source_word: δύναται
  choice: Ngài có thể
  rationale: Diễn đạt trực tiếp năng lực thực sự của Ngài bằng tiếng Việt hiện đại, trang trọng và tự nhiên.
- source_word: τοῖς πειραζομένοις
  choice: những người đang bị cám dỗ
  rationale: “Đang bị” giữ khía cạnh tiếp diễn của phân từ hiện tại và cho thấy đây là những người hiện đang trải qua sự cám dỗ hay thử thách.
- source_word: βοηθῆσαι
  choice: giúp đỡ
  rationale: βοηθέω có nghĩa giúp hoặc đến cứu giúp. “Giúp đỡ” rõ ràng, tự nhiên, đồng thời không làm yếu đi ý Ngài trợ giúp người đang gặp cảnh khó khăn.
theological_decisions:
- issue: Nghĩa của πειράζω khi nói về Chúa Giê-su và những người tin
  choice: cám dỗ
  alternative: thử thách
  rationale: “Cám dỗ” giữ nghĩa thông dụng trong Tân Ước và mối liên hệ với Hê-bơ-rơ 4:15, nhưng không hàm ý Chúa Giê-su đã phạm tội hoặc khuất phục. Vì động từ Hy Lạp cũng có thể chỉ việc bị thử thách, phương án ấy được nêu trong chú thích để bảo toàn độ mở của nguyên văn.
- issue: Mối liên hệ giữa đau khổ của Ngài và khả năng trợ giúp
  choice: Dịch bằng cấu trúc nhân quả “Vì ... nên”
  alternative: Dịch sát hình thức hơn là “Vì trong điều chính Ngài đã chịu...”
  rationale: Nguyên văn trình bày kinh nghiệm chịu đau khổ khi bị cám dỗ/thử thách như căn cứ cho khả năng trợ giúp của Ngài. Cấu trúc tiếng Việt làm rõ quan hệ này mà không diễn giải thêm bản chất thần học của khả năng ấy.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “Ngài” để quy chiếu về Con trong văn mạch, “chính Ngài” để giữ điểm nhấn của αὐτός. Câu dùng cấu trúc nhân quả tự nhiên và giữ chú thích ngay sau lần xuất hiện đầu tiên của từ ngữ có phương án dịch khác.
