  source_fidelity: Bản dịch truyền đạt đúng quan hệ nguyên nhân/giải thích của ἐν ᾧ γὰρ, nhấn mạnh của αὐτός, kinh nghiệm chịu khổ đã xảy ra của πέπονθεν, và năng lực hiện tại của δύναται. “Đang bị cám dỗ” phản ánh thích đáng phân từ hiện tại πειραζομένοις. Phương án “cám dỗ” phù hợp với ngữ cảnh, đồng thời chú thích giữ được khả năng “thử thách.”
