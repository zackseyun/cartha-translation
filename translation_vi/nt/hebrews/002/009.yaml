review_pass:
  verdict: revise
  source_fidelity: Bản dự thảo chuyển đúng phần lớn cú pháp và hình ảnh của câu, nhưng văn bản chính theo dị bản χάριτι θεοῦ (“bởi ân điển...”) thay vì cách đọc χωρὶς θεοῦ (“lìa khỏi/ngoài Đức Chúa Trời”) trong SBLGNT được chỉ định làm nguồn. Vì yêu cầu ưu tiên nguồn nguyên ngữ, cách đọc của SBLGNT cần ở văn bản chính; dị bản χάριτι cần được đưa xuống chú thích. “Vì đã chịu đau đớn đến mức phải chết” cũng diễn giải rộng hơn τὸ πάθημα τοῦ θανάτου; nên giữ gần hơn là “vì sự chịu khổ của cái chết.”
  naturalness: '“Được đội mão triều thiên vinh quang và tôn trọng” chưa tự nhiên: “tôn trọng” thường là động từ/thái độ, không phù hợp với τιμή ở đây. “Được đội mão triều thiên là vinh quang và tôn quý” vừa tự nhiên vừa giữ hình ảnh đăng quang. Bỏ “nay”, vì từ này không có đối ứng trực tiếp trong câu Hy Lạp và thêm sắc thái thời điểm.'
  terminology: Giữ “Đức Chúa Jêsus,” “Đức Chúa Trời,” và “các thiên sứ” theo hệ thuật ngữ của bản dự thảo. Dùng “tôn quý” cho τιμή trong cặp “vinh quang và tôn quý.” “Nếm sự chết” bảo toàn thành ngữ γεύσηται θανάτου mà vẫn rõ trong tiếng Việt hiện đại.
  issues:
  - severity: high
    issue: Văn bản chính không theo cách đọc của SBLGNT được cung cấp.
    rationale: SBLGNT đọc χωρὶς θεοῦ, trong khi bản dự thảo in “bởi ân điển của Đức Chúa Trời” (χάριτι θεοῦ). Dị bản có thể được nêu, nhưng không nên thay thế im lặng cách đọc của nguồn khi nhiệm vụ yêu cầu đối chiếu nguồn trước.
  - severity: medium
    issue: Diễn giải quá mức τὸ πάθημα τοῦ θανάτου.
    rationale: “Đã chịu đau đớn đến mức phải chết” thêm quan hệ mức độ/dẫn đến không được phát biểu trong nguyên văn. “Sự chịu khổ của cái chết” giữ cấu trúc và độ mở của nguyên ngữ.
  - severity: low
    issue: Cụm từ chỉ sự đăng quang và τιμή chưa tự nhiên/chính xác.
    rationale: “Tôn trọng” không diễn đạt tốt τιμή như một phẩm giá hay vinh dự được ban. Cấu trúc sửa lại giữ rõ việc được đội mão và hai yếu tố vinh quang, tôn quý.
  revised_text: Nhưng chúng ta thấy Đức Chúa Jêsus, Đấng đã bị hạ thấp hơn các thiên sứ trong một thời gian ngắn, được đội mão triều thiên là vinh quang và tôn quý vì sự chịu khổ của cái chết, để Ngài, lìa khỏi Đức Chúa Trời[a], nếm sự chết vì mọi người.
  revised_footnotes:
  - marker: a
    text: 'Một số thủ bản chép: “bởi ân điển của Đức Chúa Trời” thay vì “lìa khỏi Đức Chúa Trời.”'
    reason: textual_variant
  revision_rationale: Sửa văn bản chính để phản ánh χωρὶς θεοῦ của SBLGNT, đồng thời ghi dị bản χάριτι θεοῦ—cũng là cách đọc được English POB theo—trong chú thích. Các sửa đổi còn lại giảm diễn giải, cải thiện tính tự nhiên hiện đại, và duy trì các hình ảnh cùng độ mơ hồ của tiếng Hy Lạp.
