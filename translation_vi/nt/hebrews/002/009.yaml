id: HEB.2.9
reference: Hebrews 2:9
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: τὸν δὲ βραχύ τι παρ’ ἀγγέλους ἠλαττωμένον βλέπομεν Ἰησοῦν διὰ τὸ πάθημα τοῦ θανάτου δόξῃ καὶ τιμῇ ἐστεφανωμένον, ὅπως ⸀χωρὶς θεοῦ ὑπὲρ παντὸς γεύσηται θανάτου.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/009.yaml
  text: But we see Jesus[a], who was made lower than the angels for a little while, crowned with glory and honor because of the suffering of death, so that by the grace of God he might taste death for everyone.
translation:
  language: vi
  text: Nhưng chúng ta thấy Đức Chúa Jêsus, Đấng đã bị hạ thấp hơn các thiên sứ trong một thời gian ngắn, nay được đội mão triều thiên vinh quang và tôn trọng vì đã chịu đau đớn đến mức phải chết, để bởi ân điển của Đức Chúa Trời[a], Ngài nếm trải sự chết vì mọi người.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Một số thủ bản chép: “lìa khỏi Đức Chúa Trời” thay vì “bởi ân điển của Đức Chúa Trời.”'
    reason: textual_variant
lexical_decisions:
- source_word: βραχύ τι
  choice: trong một thời gian ngắn
  rationale: Hiểu theo nghĩa thời gian trong mạch văn trích dẫn Thi Thiên 8, thay vì chỉ mức độ thấp hơn.
- source_word: παρ’ ἀγγέλους
  choice: hơn các thiên sứ
  rationale: Sau ἐλαττόω, παρά với đối cách mang ý so sánh.
- source_word: ἠλαττωμένον
  choice: đã bị hạ thấp
  rationale: Giữ sắc thái bị động và ý so sánh, không thu hẹp thành sự hạ mình về cảm xúc.
- source_word: διὰ τὸ πάθημα τοῦ θανάτου
  choice: vì đã chịu đau đớn đến mức phải chết
  rationale: διά với đối cách diễn tả nguyên nhân; cách diễn đạt này tự nhiên trong tiếng Việt và cho thấy sự đau đớn dẫn đến cái chết.
- source_word: δόξῃ καὶ τιμῇ ἐστεφανωμένον
  choice: được đội mão triều thiên vinh quang và tôn trọng
  rationale: Giữ hình ảnh στεφανόω và hai danh từ δόξα, τιμή bằng lối diễn đạt trang trọng, dễ hiểu.
- source_word: ὅπως
  choice: để
  rationale: Bảo toàn sắc thái mục đích hoặc kết quả mà không quyết định quá mức giữa hai khả năng.
- source_word: χάριτι θεοῦ / χωρὶς θεοῦ
  choice: bởi ân điển của Đức Chúa Trời
  rationale: Bản văn chính dùng dị bản χάριτι θεοῦ vốn được chứng thực rộng rãi; cách đọc χωρὶς θεοῦ của SBLGNT được ghi rõ trong chú thích.
- source_word: ὑπὲρ παντός
  choice: vì mọi người
  rationale: Hiểu παντός theo nghĩa phân phối và chỉ người trong ngữ cảnh; ὑπέρ diễn tả hành động vì lợi ích hoặc thay cho người khác mà không triển khai thêm một lý thuyết chuộc tội.
- source_word: γεύσηται θανάτου
  choice: nếm trải sự chết
  rationale: Vừa giữ ẩn dụ 'nếm' vừa dùng 'trải' để câu tiếng Việt rõ nghĩa và tự nhiên.
theological_decisions:
- issue: Dị bản trong mệnh đề chỉ mục đích
  choice: bởi ân điển của Đức Chúa Trời
  alternative: lìa khỏi Đức Chúa Trời
  rationale: 'Dù SBLGNT được cung cấp in χωρὶς θεοῦ, dị bản χάριτι θεοῦ có chứng cứ cổ và rộng, phù hợp mạch văn, và thường được xem là cách đọc có khả năng hơn. Không che giấu căng thẳng văn bản: cách đọc của SBLGNT được bảo tồn trong chú thích.'
- issue: Phạm vi của ὑπὲρ παντός
  choice: vì mọi người
  alternative: vì mọi vật
  rationale: Mạch văn nói đến việc Đức Chúa Jêsus chịu chết thay mặt con người; tuy nhiên, παντός ở số ít không kèm danh từ cũng có thể được hiểu rộng hơn là 'mọi vật'. Bản dịch chọn nghĩa chỉ người nhưng không thêm giới hạn thần học.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “Đức Chúa Jêsus” và “Đức Chúa Trời” theo văn phong Kinh Thánh quen thuộc; giữ hình ảnh mão triều thiên và nếm sự chết, đồng thời làm rõ cú pháp bằng các từ nối tự nhiên.
