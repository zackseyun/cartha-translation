id: HEB.2.2
reference: Hebrews 2:2
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εἰ γὰρ ὁ δι’ ἀγγέλων λαληθεὶς λόγος ἐγένετο βέβαιος, καὶ πᾶσα παράβασις καὶ παρακοὴ ἔλαβεν ἔνδικον μισθαποδοσίαν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/002.yaml
  text: For if the message spoken through angels proved firm[a], and every transgression and disobedience received a just penalty[b],
translation:
  language: vi
  text: Vì nếu sứ điệp được phán qua các thiên sứ đã tỏ ra vững chắc[a], và mọi sự vi phạm và bất tuân đều nhận lấy hình phạt công minh[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Có lẽ chỉ về luật pháp, được hiểu trong truyền thống Do Thái là đã được truyền qua các thiên sứ; xem Công Vụ 7:53 và Ga-la-ti 3:19.
    reason: cross_reference
  - marker: b
    text: 'Cũng có thể dịch: “sự báo trả công minh” hoặc “sự đền trả xứng đáng.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δι’ ἀγγέλων λαληθεὶς λόγος
  choice: sứ điệp được phán qua các thiên sứ
  rationale: “Sứ điệp” diễn đạt λόγος như một lời truyền đạt từ Đức Chúa Trời; “được phán qua” giữ sắc thái trung gian/phương tiện của διά với sở hữu cách và thể bị động của λαληθείς, mà không nói quá rằng các thiên sứ là nguồn của sứ điệp.
- source_word: ἀγγέλων
  choice: các thiên sứ
  rationale: Trong ngữ cảnh Hê-bơ-rơ 2, từ này nhiều khả năng chỉ các hữu thể thiên giới gắn với truyền thống luật pháp được ban qua trung gian thiên sứ, chứ không phải sứ giả loài người.
- source_word: ἐγένετο βέβαιος
  choice: đã tỏ ra vững chắc
  rationale: Cách dịch này giữ ý sứ điệp đã đứng vững, có hiệu lực và đáng tin, đồng thời không thu hẹp nghĩa thành chỉ “được xác nhận” hoặc diễn giải mạnh thành “có tính ràng buộc”.
- source_word: πᾶσα παράβασις
  choice: mọi sự vi phạm
  rationale: παράβασις chỉ hành vi vượt qua ranh giới hay vi phạm điều đã truyền. “Sự vi phạm” tự nhiên trong tiếng Việt hiện đại và giữ sắc thái pháp lý-đạo đức.
- source_word: παρακοὴ
  choice: bất tuân
  rationale: παρακοή hàm ý không nghe theo và vì thế không vâng phục. “Bất tuân” cô đọng, tự nhiên, và phân biệt được với “vi phạm” trong vế song song.
- source_word: ἔλαβεν
  choice: nhận lấy
  rationale: Giữ cấu trúc của nguyên văn, trong đó mỗi hành vi vi phạm và bất tuân nhận sự báo trả tương xứng.
- source_word: ἔνδικον μισθαποδοσίαν
  choice: hình phạt công minh
  rationale: μισθαποδοσία là sự báo trả hay đền đáp, còn ἔνδικος nhấn mạnh tính đúng đắn, xứng đáng theo công lý. Trong ngữ cảnh tiêu cực, “hình phạt công minh” truyền đạt rõ lực tư pháp, còn chú thích giữ các nghĩa rộng hơn.
theological_decisions:
- issue: Bản chất của “sứ điệp được phán qua các thiên sứ”
  choice: Giữ cách nói khái quát của nguyên văn, đồng thời chú thích rằng đây có lẽ là sự ám chỉ luật pháp được truyền qua các thiên sứ.
  alternative: Dịch thẳng là “luật pháp được phán qua các thiên sứ,” hoặc hiểu là một sứ điệp thần thượng nói chung do thiên sứ truyền đạt.
  rationale: Ngữ cảnh và truyền thống Do Thái hậu thuẫn mạnh cho sự ám chỉ luật pháp tại Si-nai, nhưng câu Hy Lạp chỉ nói “sứ điệp/lời được phán qua các thiên sứ.” Không đưa “luật pháp” vào chính văn giúp bảo toàn mức độ minh thị của nguyên bản.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại và dễ hiểu. “Sứ điệp” tự nhiên hơn cách dịch máy móc “lời”; “được phán” giữ sắc thái lời mặc khải. “Công minh” tạo sắc thái xét xử trang nghiêm, còn các phương án rộng hơn của μισθαποδοσία được bảo lưu trong chú thích. Câu kết bằng dấu phẩy vì đây là mệnh đề điều kiện tiếp nối sang câu 3.
