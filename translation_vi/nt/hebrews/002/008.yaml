reference: Hebrews 2:8
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: πάντα ὑπέταξας ὑποκάτω τῶν ποδῶν αὐτοῦ· ἐν ⸂τῷ γὰρ⸃ ⸀ὑποτάξαι τὰ πάντα οὐδὲν ἀφῆκεν αὐτῷ ἀνυπότακτον. νῦν δὲ οὔπω ὁρῶμεν αὐτῷ τὰ πάντα ὑποτεταγμένα·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/008.yaml
  text: You subjected all things under his feet.” For in subjecting all things to him[a], he left nothing not subjected to him[b]. But now we do not yet see all things subjected to him.
translation:
  language: vi
  text: “Ngài đã đặt muôn vật dưới chân người.” Vì khi đặt muôn vật dưới quyền người[a], Ngài không để lại điều gì không ở dưới quyền người.[b] Nhưng hiện nay, chúng ta vẫn chưa thấy muôn vật đã được đặt dưới quyền người.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Các đại từ “Ngài” và “người” ở đây vọng lại Thi Thiên 8. Trong văn mạch, chúng có thể chỉ Đức Chúa Trời và loài người theo ý nghĩa ban đầu của thi thiên, đồng thời được thư Hê-bơ-rơ áp dụng cho Đức Chúa Giê-su.
    reason: cross_reference
  - marker: b
    text: 'Cũng có thể dịch: “Vì trong việc đặt muôn vật dưới quyền người.” Kết cấu Hy Lạp có thể nhấn mạnh hoàn cảnh hay hành động, thay vì thời điểm.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα
  choice: muôn vật
  rationale: Danh từ trung tính số nhiều có phạm vi bao quát. “Muôn vật” tự nhiên, trang trọng và giữ được tính toàn diện của lời khẳng định.
- source_word: ὑπέταξας
  choice: Ngài đã đặt ... dưới
  rationale: Động từ aorist chủ động, ngôi thứ hai số ít, nằm trong lời trích Thi Thiên 8. Cách dịch này giữ hình ảnh đặt dưới chân và diễn đạt rõ ý khuất phục.
- source_word: ὑποκάτω τῶν ποδῶν αὐτοῦ
  choice: dưới chân người
  rationale: Giữ nguyên thành ngữ chỉ quyền thống trị và sự quy phục, đồng thời bảo tồn liên hệ trực tiếp với Thi Thiên 8.
- source_word: ἐν τῷ ... ὑποτάξαι
  choice: khi đặt ... dưới quyền
  rationale: Kết cấu ἐν với động từ nguyên mẫu có mạo từ có thể mang sắc thái thời gian hoặc hoàn cảnh. “Khi” tự nhiên trong tiếng Việt; phương án mang sắc thái khác được ghi ở chú thích.
- source_word: γὰρ
  choice: Vì
  rationale: Mở đầu phần giải thích hệ quả của lời trích dẫn trước đó.
- source_word: οὐδὲν ἀφῆκεν
  choice: không để bất cứ điều gì
  rationale: Diễn đạt tự nhiên ý không chừa lại hay loại trừ một điều nào.
- source_word: ἀνυπότακτον
  choice: không phục dưới quyền
  rationale: Giữ trường nghĩa của nhóm từ ὑποτάσσω và làm rõ trạng thái không ở dưới quyền.
- source_word: νῦν δὲ
  choice: Tuy nhiên, hiện nay
  rationale: Nêu rõ sự tương phản giữa lời tuyên bố của Kinh Thánh và điều đang được nhận thấy trong hiện tại.
- source_word: οὔπω ὁρῶμεν
  choice: chúng ta chưa thấy
  rationale: “Chưa thấy” thể hiện đúng trạng thái hiện tại và sắc thái “chưa” của οὔπω.
- source_word: ὑποτεταγμένα
  choice: phục dưới quyền
  rationale: Phân từ hoàn thành bị động diễn tả trạng thái kết quả. Cụm từ này tự nhiên trong tiếng Việt và duy trì sự lặp lại của cùng một trường nghĩa.
theological_decisions:
- issue: Đối tượng được chỉ bởi αὐτοῦ / αὐτῷ
  choice: Giữ đại từ “người”, không nêu đích danh đối tượng trong chính văn.
  alternative: Có thể hiểu là loài người trong ý nghĩa ban đầu của Thi Thiên 8, hoặc là Đức Chúa Jêsus trong cách áp dụng của thư Hê-bơ-rơ.
  rationale: 'Tác giả đang giải nghĩa Thi Thiên 8: trong thi thiên, đối tượng trực tiếp là con người, nhưng văn mạch Hê-bơ-rơ hướng lời ấy đến Đức Chúa Jêsus. Giữ đại từ bảo tồn sự chuyển tiếp và sức căng thần học của lập luận.'
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” cho chủ thể thần linh được hàm ẩn trong lời trích và “người” cho đại từ có đối tượng cố ý để ngỏ; tránh viết hoa đại từ này nhằm không quyết định trước rằng nó chỉ riêng Đức Chúa Jêsus. Lặp lại “dưới quyền/phục dưới quyền” để phản ánh nhóm từ ὑποτάσσω, nhưng giữ hình ảnh “dưới chân” trong lời trích.
