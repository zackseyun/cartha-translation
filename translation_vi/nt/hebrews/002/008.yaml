- from: “Ngài đã đặt muôn vật dưới chân người.” Vì khi đặt muôn vật dưới quyền người[a], Ngài không để bất cứ điều gì không phục dưới quyền người.[b] Tuy nhiên, hiện nay chúng ta chưa thấy muôn vật phục dưới quyền người.
  to: “Ngài đã đặt muôn vật dưới chân người.” Vì khi đặt muôn vật dưới quyền người[a], Ngài không để lại điều gì không ở dưới quyền người.[b] Nhưng hiện nay, chúng ta vẫn chưa thấy muôn vật đã được đặt dưới quyền người.
  rationale: Bản sửa duy trì sự để ngỏ có chủ ý của đại từ “người” (αὐτοῦ/αὐτῷ), đồng thời cải thiện cách diễn đạt tiếng Việt của các từ thuộc nhóm ὑποτάσσω. “Đã được đặt dưới quyền” phản ánh trạng thái kết quả của phân từ hoàn thành bị động, còn “không ở dưới quyền” phản ánh ἀνυπότακτον mà không thêm sắc thái chủ động. Chú thích được hiện đại hóa chính tả và làm chính xác hơn phạm vi các đại từ trong lời trích.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T21:27:27Z'
