base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/012.yaml
  text: saying[a], “I will proclaim your name to my brothers[b]; in the midst of the assembly I will sing praise to you.”
translation:
  language: vi
  text: 'Ngài nói: “Tôi sẽ công bố danh Ngài cho anh em tôi[a]; giữa hội chúng[b], tôi sẽ hát ngợi khen Ngài.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “anh chị em tôi”; tiếng Hy Lạp dùng từ “anh em”, nhưng trong ngữ cảnh, cách gọi gia đình này có thể bao gồm tất cả các tín hữu.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “cộng đoàn”.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγων
  choice: Ngài nói rằng
  rationale: Phân từ hiện tại dùng để dẫn vào lời trích dẫn. “Nói rằng” trực tiếp, tự nhiên; chủ ngữ “Ngài” được bổ sung từ mạch văn của câu trước để tiếng Việt rõ nghĩa.
- source_word: Ἀπαγγελῶ
  choice: tôi sẽ công bố
  rationale: Động từ tương lai mang nghĩa loan báo hoặc tuyên bố công khai; “công bố” giữ được sắc thái công khai mà vẫn tự nhiên trong tiếng Việt hiện đại.
- source_word: τὸ ὄνομά σου
  choice: danh Ngài
  rationale: Giữ hình ảnh “danh” của nguyên tác, vốn có thể hàm ý căn tính, phẩm tính và sự tự bày tỏ, nhưng không diễn giải thêm trong chính văn.
- source_word: τοῖς ἀδελφοῖς μου
  choice: cho anh em tôi
  rationale: “Anh em” giữ dạng nam số nhiều của nguyên tác, đồng thời trong tiếng Việt có thể được dùng theo nghĩa đại diện cho những người cùng một gia đình hay cộng đồng. Phạm vi có thể bao gồm cả nữ giới được ghi chú.
- source_word: ἐν μέσῳ
  choice: giữa
  rationale: Cách dịch ngắn gọn, tự nhiên, vẫn giữ ý ở ngay giữa cộng đồng đang tụ họp.
- source_word: ἐκκλησίας
  choice: hội chúng
  rationale: Trong lời trích dẫn từ Thánh Thi, từ này chỉ cộng đồng đang tụ họp hơn là một cơ cấu giáo hội về sau. “Hội chúng” diễn đạt đúng sắc thái ấy.
- source_word: ὑμνήσω
  choice: tôi sẽ hát ca ngợi
  rationale: Động từ nói cụ thể đến việc ca ngợi bằng bài hát; cách dịch này bảo toàn yếu tố âm nhạc.
- source_word: σε
  choice: Ngài
  rationale: Là tân ngữ của hành động hát ca ngợi. “Ngài” là đại từ tôn kính tự nhiên dành cho Đức Chúa Trời trong lời trích dẫn.
theological_decisions:
- issue: Phạm vi của ἀδελφοῖς khi chỉ gia đình đức tin
  choice: anh em
  alternative: anh chị em
  rationale: Chính văn giữ hình thức nam số nhiều của tiếng Hy Lạp và cách xưng hô mang sắc thái Kinh Thánh quen thuộc; chú thích cho biết trong ngữ cảnh, từ này có thể bao gồm toàn thể các tín hữu, cả nam lẫn nữ.
- issue: Nghĩa của ἐκκλησία trong lời trích dẫn Cựu Ước
  choice: hội chúng
  alternative: cộng đoàn; hội thánh
  rationale: “Hội chúng” nhấn mạnh đoàn người đang tụ họp và tránh mặc nhiên đưa vào câu trích dẫn ý niệm về một định chế giáo hội về sau.
- issue: Đại từ của người nói trong lời trích dẫn
  choice: tôi
  alternative: con
  rationale: Nguyên tác chỉ dùng đại từ ngôi thứ nhất, không mã hóa quan hệ cha–con trong chính lời trích dẫn. “Tôi” bảo toàn sự trung tính ngữ pháp và tránh diễn giải thêm, dù mạch văn Hebrews áp dụng lời này cho Con.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại, với nhịp câu thích hợp cho một lời trích dẫn thi ca. Dùng “danh Ngài” thay vì diễn giải nội hàm thần học của “danh”; dùng “hội chúng” để làm nổi bật cộng đồng đang tụ họp. Các dấu chú thích được đặt ngay sau những từ mà chúng giải thích.
