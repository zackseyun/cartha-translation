id: HEB.2.16
reference: Hebrews 2:16
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οὐ γὰρ δήπου ἀγγέλων ἐπιλαμβάνεται, ἀλλὰ σπέρματος Ἀβραὰμ ἐπιλαμβάνεται.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/016.yaml
  text: For surely it is not angels that he helps[a], but the offspring of Abraham.
translation:
  language: vi
  text: Vì chắc chắn Ngài không giúp các thiên sứ, nhưng giúp dòng dõi Áp-ra-ham.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “nắm lấy.” Động từ Hy Lạp có thể mang nghĩa đen là nắm hoặc giữ lấy, nhưng ở đây có lẽ có nghĩa là giúp hay đến cứu giúp.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δήπου
  choice: chắc chắn
  rationale: Từ này thêm sắc thái nhấn mạnh một điều được xem là hiển nhiên trong lập luận; “chắc chắn” diễn đạt tự nhiên sắc thái ấy trong tiếng Việt.
- source_word: ἀγγέλων
  choice: các thiên sứ
  rationale: Danh từ số nhiều chỉ lớp đối tượng được đặt tương phản với “dòng dõi Áp-ra-ham”.
- source_word: ἐπιλαμβάνεται
  choice: giúp
  rationale: Trong ngữ cảnh, động từ nhiều khả năng mang nghĩa thành ngữ là nắm lấy để trợ giúp hoặc cứu giúp. Cách dịch “giúp” rõ ràng, tự nhiên; nghĩa sát chữ “nắm lấy” được giữ trong chú thích.
- source_word: σπέρματος Ἀβραὰμ
  choice: dòng dõi Áp-ra-ham
  rationale: Cụm này có thể chỉ hạt giống, con cháu hoặc hậu duệ theo nghĩa tập thể. “Dòng dõi Áp-ra-ham” vừa tự nhiên trong tiếng Việt vừa giữ được sắc thái tập thể mà không buộc phải hiểu là từng cá nhân riêng lẻ.
- source_word: οὐ γὰρ ... ἀλλὰ
  choice: Vì ... không ... nhưng ...
  rationale: Cấu trúc này giữ quan hệ giải thích với phần trước và làm nổi bật sự tương phản mạnh giữa các thiên sứ và dòng dõi Áp-ra-ham.
theological_decisions:
- issue: Ý nghĩa của ἐπιλαμβάνεται đối với công việc cứu rỗi của Đấng Con
  choice: Câu này nói rằng Ngài giúp dòng dõi Áp-ra-ham chứ không giúp các thiên sứ.
  alternative: Câu này nói rằng Ngài nắm lấy dòng dõi Áp-ra-ham, có thể gợi đến việc mang lấy bản tính loài người.
  rationale: Ngữ cảnh gần nói về sự liên đới của Đấng Con với loài người và hành động cứu giúp của Ngài, nên nghĩa thành ngữ “giúp” phù hợp hơn. Tuy nhiên, vì nghĩa sát chữ “nắm lấy” có giá trị từ vựng và ý nghĩa trong lịch sử giải thích, chú thích bảo lưu cách hiểu ấy thay vì loại bỏ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” vì chủ thể được tiếp nối từ ngữ cảnh là Đấng Con; “dòng dõi” bảo lưu tính tập thể của σπέρμα. Chú thích giữ lại sự mơ hồ có thật giữa nghĩa sát chữ và nghĩa thành ngữ.
