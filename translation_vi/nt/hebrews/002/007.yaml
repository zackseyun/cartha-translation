  naturalness: “Ngài đội cho người mão triều thiên bằng vinh quang và danh dự” hơi gượng trong tiếng Việt hiện đại, nhất là kết hợp “đội cho” với “bằng”. “Đội mão triều thiên vinh quang và danh dự cho người” là cách nói trang trọng, tự nhiên hơn, đồng thời vẫn giữ hình ảnh nguyên ngữ.
  terminology: “Ngài”, “thiên sứ”, “vinh quang”, và “danh dự” đều phù hợp với văn phong Kinh Thánh tiếng Việt hiện đại. “Người” viết thường có thể giữ chức năng đại từ chỉ nhân vật đại diện trong trích dẫn, không áp đặt việc đồng nhất hóa nhân vật này trong riêng câu văn.
