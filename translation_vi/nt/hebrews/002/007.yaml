base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/007.yaml
  text: You made him lower than the angels for a little while[a]; you crowned him with glory and honor.
translation:
  language: vi
  text: Ngài đã khiến người thấp hơn các thiên sứ trong một thời gian ngắn[a]; Ngài đã đội mão triều thiên vinh quang và danh dự cho người.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Ngài đã khiến người thấp hơn các thiên sứ một chút.” Cụm từ Hy Lạp có thể chỉ mức độ thay vì thời gian.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἠλάττωσας
  choice: đã khiến ... thấp hơn
  rationale: Động từ aorist chủ động, ngôi hai số ít của ἐλαττόω; trong cấu trúc so sánh với παρά + đối cách, nghĩa gây khiến “làm cho thấp hơn” phù hợp hơn “làm suy giảm”.
- source_word: αὐτὸν / αὐτόν
  choice: người
  rationale: Đại từ đối cách giống đực số ít chỉ nhân vật con người trong trích dẫn Thi Thiên 8. “Người” giữ được số ít và tính đại diện mà không thêm một danh từ riêng không có trong mệnh đề.
- source_word: βραχύ τι
  choice: trong một thời gian ngắn
  rationale: Cụm từ có thể chỉ thời gian hoặc mức độ. Cách hiểu thời gian phù hợp với mạch văn Hê-bơ-rơ 2, còn cách hiểu mức độ được giữ trong chú thích.
- source_word: παρ’ ἀγγέλους
  choice: hơn các thiên sứ
  rationale: παρά + đối cách mang lực so sánh sau ἐλαττόω, nên dịch tự nhiên là “hơn các thiên sứ”.
- source_word: δόξῃ καὶ τιμῇ
  choice: bằng vinh quang và danh dự
  rationale: Hai danh từ ở tặng cách diễn tả điều dùng để đội mão triều thiên. “Vinh quang và danh dự” giữ đúng cặp ý nghĩa của nguyên văn.
- source_word: ἐστεφάνωσας
  choice: đội ... mão triều thiên
  rationale: Động từ στεφανόω có nghĩa đội hoặc trao mão triều thiên. Cách diễn đạt này tự nhiên trong tiếng Việt và bảo toàn hình ảnh tôn vinh của nguyên văn.
theological_decisions:
- issue: Ý nghĩa của βραχύ τι trong trích dẫn Thi Thiên 8 được áp dụng trong Hê-bơ-rơ
  choice: 'nghĩa thời gian: “trong một thời gian ngắn”'
  alternative: 'nghĩa mức độ: “thấp hơn các thiên sứ một chút”'
  rationale: Tiếng Hy Lạp cho phép cả hai cách hiểu. Nghĩa thời gian hòa hợp rõ với sự hạ mình tạm thời rồi được tôn cao trong ngữ cảnh Hê-bơ-rơ 2, nhưng nghĩa mức độ vẫn là khả năng thực sự và được bảo lưu trong chú thích.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” cho chủ thể được thưa trực tiếp trong lời trích dẫn; dùng “người” cho đại từ giống đực số ít mang ý nghĩa con người đại diện. Giữ hình ảnh “mão triều thiên” thay vì làm phẳng thành “ban” hoặc “trao”.
