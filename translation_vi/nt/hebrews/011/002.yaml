  text: For by this the elders received approval[a][b][c].
translation:
  language: vi
  text: Vì nhờ điều này[b], những người thời xưa[c] đã được chứng nhận[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đã được khen ngợi” hoặc “đã nhận được lời chứng thuận lợi”. Động từ Hy Lạp diễn tả việc nhận được lời chứng thuận lợi.'
    reason: lexical_alternative
  - marker: b
    text: Tức là nhờ đức tin được nói đến trong câu trước.
    reason: cross_reference
  - marker: c
    text: 'Cũng có thể dịch: “các bậc tiền nhân” hoặc “người xưa”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ταύτῃ
  choice: nhờ điều ấy
  rationale: Cụm này chỉ phương tiện hoặc phạm vi và tự nhiên liên hệ ngược về đức tin trong câu 1. “Nhờ điều ấy” giữ cách nói bằng đại từ của nguyên văn, không diễn giải quá mức ngay trong chính văn.
- source_word: γὰρ
  choice: thật vậy
  rationale: Trong mạch văn này, γάρ giải thích và xác nhận vai trò của đức tin vừa được nêu. “Thật vậy” tạo liên kết giải thích tự nhiên trong tiếng Việt.
- source_word: ἐμαρτυρήθησαν
  choice: đã nhận được lời chứng tốt
  rationale: Dạng bị động của μαρτυρέω ở đây nói đến việc được làm chứng thuận lợi hay được công nhận. Cách dịch này giữ hình ảnh “lời chứng” vốn được lặp lại trong chương và tránh xác định rõ chủ thể làm chứng khi câu Hy Lạp không nêu ra.
- source_word: οἱ πρεσβύτεροι
  choice: những người thời xưa
  rationale: Trong ngữ cảnh Hê-bơ-rơ 11, từ này chỉ những người thuộc các thế hệ trước được nêu làm gương, chứ không chủ yếu chỉ một chức vụ trưởng lão. Cách dịch này rõ nghĩa đối với độc giả hiện đại.
theological_decisions:
- issue: Sở chỉ của ταύτῃ
  choice: Giữ đại từ “điều ấy” trong chính văn và chú thích rằng từ này chỉ về đức tin ở câu trước.
  alternative: Dịch trực tiếp là “nhờ đức tin ấy”.
  rationale: Giống cái số ít của ταύτῃ liên hệ tự nhiên với πίστις, nhưng cách dùng đại từ trong nguyên văn vẫn có thể bao quát thực tại vừa được mô tả ở câu 1. Bản dịch giữ sự liên kết mà không thu hẹp quá mức.
- issue: Chủ thể ban lời chứng thuận lợi
  choice: Giữ cấu trúc không nêu chủ thể.
  alternative: Thêm rõ “được Đức Chúa Trời khen ngợi/chứng nhận”.
  rationale: Toàn chương hướng đến sự chứng nhận của Đức Chúa Trời, nhưng câu này không nêu chủ thể. Không thêm danh xưng vào chính văn giúp bảo toàn hình thức và độ mở của nguyên bản.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Những người thời xưa” tránh khả năng khiến độc giả hiểu “các trưởng lão” là một chức vụ hội thánh; “lời chứng tốt” đồng thời bảo tồn từ vựng chủ đạo của động từ μαρτυρέω.
