reference: Hebrews 11:4
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Πίστει πλείονα θυσίαν Ἅβελ παρὰ Κάϊν προσήνεγκεν τῷ θεῷ, δι’ ἧς ἐμαρτυρήθη εἶναι δίκαιος, μαρτυροῦντος ἐπὶ τοῖς δώροις αὐτοῦ ⸂τοῦ θεοῦ⸃, καὶ δι’ αὐτῆς ἀποθανὼν ἔτι ⸀λαλεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/004.yaml
  text: By faith Abel offered to God a better sacrifice than Cain[a], through which he was attested as righteous, God testifying concerning his gifts; and through it, though he died[d][c][b], he still speaks.
translation:
  language: vi
  text: Nhờ đức tin, A-bên đã dâng lên Đức Chúa Trời một sinh tế tốt hơn sinh tế của Ca-in[a]. Nhờ sinh tế ấy, ông được chứng nhận là người công chính[b], khi Đức Chúa Trời[c] làm chứng về các lễ vật của ông. Và nhờ điều ấy[d], dù đã chết, ông vẫn còn nói.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “một sinh tế lớn hơn sinh tế của Ca-in.” Từ Hy Lạp có thể nhấn mạnh phẩm chất tốt hơn hoặc mức độ lớn hơn.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “ông được làm chứng là người công chính” hoặc “ông được khen ngợi là người công chính.”
    reason: lexical_alternative
  - marker: c
    text: Một số thủ bản không có cụm “Đức Chúa Trời.”
    reason: textual_variant
  - marker: d
    text: “Điều ấy” có thể chỉ đức tin của A-bên hoặc sinh tế ông đã dâng; nguyên văn Hy Lạp không xác định hoàn toàn rõ.
    reason: alternative_reading
lexical_decisions:
- source_word: Πίστει
  choice: Nhờ đức tin
  rationale: Cách dịch này diễn đạt sở cách của danh từ ở tặng cách và phù hợp với điệp ngữ mở đầu các gương đức tin trong Hê-bơ-rơ 11.
- source_word: πλείονα θυσίαν
  choice: một sinh tế tốt hơn
  rationale: πλείων có thể chỉ phẩm chất hoặc mức độ; trong ngữ cảnh so sánh lễ dâng của A-bên với Ca-in, “tốt hơn” tự nhiên và không thêm ý “được chấp nhận” vốn không được nói rõ.
- source_word: παρὰ Κάϊν
  choice: tốt hơn sinh tế của Ca-in
  rationale: παρά đi với hình thức so sánh nêu chuẩn so sánh. Tiếng Việt cần lặp lại “sinh tế” để tránh cách nói thiếu tự nhiên hoặc khiến người đọc tưởng sinh tế được so trực tiếp với con người Ca-in.
- source_word: προσήνεγκεν τῷ θεῷ
  choice: đã dâng lên Đức Chúa Trời
  rationale: προσφέρω trong văn cảnh tế lễ mang nghĩa dâng một lễ vật hay sinh tế; “dâng lên” là cách diễn đạt tự nhiên, trang trọng.
- source_word: δι’ ἧς
  choice: Nhờ sinh tế ấy
  rationale: Đại từ quan hệ giống cái liên kết tự nhiên nhất với θυσίαν, “sinh tế”; việc nêu rõ danh từ giúp câu tiếng Việt sáng nghĩa.
- source_word: ἐμαρτυρήθη εἶναι δίκαιος
  choice: ông được chứng nhận là người công chính
  rationale: Giữ sắc thái lời chứng của μαρτυρέω mà vẫn tự nhiên trong tiếng Việt; δίκαιος được dịch là “người công chính” để chỉ tư cách của A-bên.
- source_word: μαρτυροῦντος ἐπὶ τοῖς δώροις αὐτοῦ τοῦ θεοῦ
  choice: khi Đức Chúa Trời làm chứng về các lễ vật của ông
  rationale: Diễn đạt kết cấu sở hữu cách tuyệt đối bằng mệnh đề hoàn cảnh; “làm chứng” duy trì mô-típ chứng nhận, còn δῶρα được dịch là “lễ vật” theo văn cảnh thờ phượng.
- source_word: δι’ αὐτῆς
  choice: nhờ điều ấy
  rationale: Cách nói này không xác định dứt khoát đại từ chỉ đức tin hay sinh tế, qua đó giữ lại độ mơ hồ thực sự của nguyên văn.
- source_word: ἀποθανὼν ἔτι λαλεῖ
  choice: dù đã chết, ông vẫn còn nói
  rationale: “Dù” thể hiện quan hệ tương phản tự nhiên giữa cái chết của A-bên và tiếng nói vẫn tiếp tục; “vẫn còn nói” bám sát hiện tại λαλεῖ.
theological_decisions:
- issue: Sở chỉ của δι’ αὐτῆς trong mệnh đề cuối
  choice: Giữ tương đối mở bằng “nhờ điều ấy” và giải thích trong chú thích.
  alternative: “nhờ đức tin ấy” hoặc “nhờ sinh tế ấy”
  rationale: Đại từ giống cái có thể hướng về πίστις, “đức tin”, là chủ đề chi phối cả đoạn, hoặc θυσία, “sinh tế”, là tiền ngữ giống cái gần hơn. Không nên tự ý giải quyết sự mơ hồ này.
- issue: Ý nghĩa của ἐμαρτυρήθη
  choice: “được chứng nhận”
  alternative: “được khen ngợi” hoặc “được làm chứng là”
  rationale: “Được chứng nhận” vừa tự nhiên trong tiếng Việt vừa bảo toàn trường nghĩa lời chứng xuyên suốt Hê-bơ-rơ 11, thay vì chuyển sang ý đánh giá hay khen thưởng.
translation_notes:
  register: Văn phong hiện đại, trang trọng nhưng dễ hiểu. Dùng “Đức Chúa Trời”, “đức tin”, “sinh tế”, “lễ vật” và “công chính” theo lối dùng Kinh Thánh tiếng Việt phổ thông; tên riêng được phiên âm A-bên và Ca-in.
