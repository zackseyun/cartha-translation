  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: χωρὶς δὲ πίστεως ἀδύνατον εὐαρεστῆσαι, πιστεῦσαι γὰρ δεῖ τὸν προσερχόμενον τῷ θεῷ ὅτι ἔστιν καὶ τοῖς ἐκζητοῦσιν αὐτὸν μισθαποδότης γίνεται.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/006.yaml
  text: And without faith it is impossible to please him[c][b][a], for the one who comes to God must believe that he exists and that he is a rewarder of those who diligently seek him.
translation:
  language: vi
  text: Nhưng không có đức tin thì không thể làm đẹp lòng Ngài, vì người đến gần Đức Chúa Trời phải tin rằng Ngài hiện hữu[a] và Ngài là Đấng ban thưởng cho những ai hết lòng tìm kiếm Ngài.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch sát hơn: “Ngài có” hoặc “Ngài là.” Câu Hy Lạp rất cô đọng; ở đây ý nói Đức Chúa Trời thực sự hiện hữu.'
    reason: lexical_alternative
  - marker: b
    text: Nguyên văn dùng động từ “trở thành”; trong ngữ cảnh, câu có thể mang nghĩa Ngài “tỏ ra là” Đấng ban thưởng cho những người tìm kiếm Ngài.
    reason: lexical_alternative
lexical_decisions:
- source_word: χωρὶς δὲ πίστεως
  choice: Nhưng không có đức tin
  rationale: χωρίς diễn tả sự thiếu vắng; δέ là từ nối nhẹ, ở đây dùng “nhưng” để chuyển từ gương Hê-nóc sang nguyên tắc khái quát. πίστις được dịch là “đức tin,” phù hợp với lời giải thích ngay sau đó về việc tin Đức Chúa Trời.
- source_word: ἀδύνατον εὐαρεστῆσαι
  choice: thì không thể làm đẹp lòng Ngài
  rationale: Cấu trúc tính từ vô nhân xưng kèm động từ nguyên mẫu được diễn đạt tự nhiên bằng “không thể.” Tân ngữ không được nêu trong cụm Hy Lạp nhưng rõ từ ngữ cảnh là Đức Chúa Trời, nên dùng “Ngài.”
- source_word: τὸν προσερχόμενον τῷ θεῷ
  choice: người đến gần Đức Chúa Trời
  rationale: προσέρχομαι mang nghĩa tiến đến hoặc đến gần, thường có sắc thái tiếp cận Đức Chúa Trời; “đến gần” vừa tự nhiên vừa giữ được hình ảnh chuyển động trong nguyên ngữ.
- source_word: ὅτι ἔστιν
  choice: rằng Ngài hiện hữu
  rationale: Cụm Hy Lạp ngắn gọn, sát hơn là “Ngài có/Ngài là”; trong tiếng Việt, “Ngài hiện hữu” truyền đạt rõ lời khẳng định về thực tại của Đức Chúa Trời mà không thêm nội dung.
- source_word: τοῖς ἐκζητοῦσιν αὐτὸν
  choice: cho những ai hết lòng tìm kiếm Ngài
  rationale: ἐκζητέω có sắc thái tìm kiếm chuyên tâm, mạnh hơn ζητέω đơn thuần. “Hết lòng tìm kiếm” là cách nói hiện đại, tự nhiên, thể hiện được cường độ ấy.
- source_word: μισθαποδότης γίνεται
  choice: Ngài là Đấng ban thưởng
  rationale: μισθαποδότης chỉ người ban phần thưởng hoặc hoàn trả. γίνεται theo nghĩa đen là “trở thành,” nhưng trong kết cấu vị ngữ ở đây diễn tả Đức Chúa Trời được nhận biết hoặc tỏ ra là Đấng ban thưởng đối với người tìm kiếm Ngài; dịch “là” tránh gợi ý rằng bản tính Ngài thay đổi.
theological_decisions:
- issue: Ý nghĩa của πίστις trong một câu có tầm quan trọng thần học
  choice: đức tin
  alternative: lòng tin; sự trung tín
  rationale: Mệnh đề tiếp theo dùng πιστεῦσαι, “tin,” nên ở đây trọng tâm là tin và nương cậy Đức Chúa Trời. “Đức tin” là thuật ngữ quen thuộc, không buộc câu vào một cách hiểu hệ phái; “sự trung tín” không phải nghĩa nổi bật trong ngữ cảnh này.
- issue: Sắc thái của μισθαποδότης γίνεται đối với bản tính Đức Chúa Trời
  choice: Ngài là Đấng ban thưởng
  alternative: Ngài trở thành Đấng ban thưởng; Ngài tỏ ra là Đấng ban thưởng
  rationale: Giữ “trở thành” quá sát hình thức có thể khiến độc giả Việt hiểu rằng Đức Chúa Trời thay đổi bản tính. Trong ngữ cảnh, γίνεται diễn tả điều Ngài là hoặc được người tìm kiếm nhận biết là; bản dịch chính dùng “là,” còn chú thích bảo tồn sắc thái nguyên ngữ.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại, dùng “Đức Chúa Trời” và đại từ tôn kính “Ngài.” Câu giữ cấu trúc lập luận nguyên nhân của nguyên bản, đồng thời tránh lối dịch cứng hoặc hàm ý Đức Chúa Trời thay đổi bản tính.
