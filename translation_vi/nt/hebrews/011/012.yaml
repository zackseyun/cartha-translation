    rationale: νενεκρωμένου có nghĩa đen là đã bị làm cho chết/suy kiệt, nhưng trong văn cảnh sinh con của Áp-ra-ham nó chỉ tình trạng không còn khả năng sinh sản do tuổi già. Câu chính nên truyền đạt nghĩa văn cảnh này rõ hơn.
  - severity: low
    issue: “Vô số con cháu” đặt ý ἀναρίθμητος không đúng vị trí cú pháp của nguyên văn.
    rationale: Tính từ ἀναρίθμητος bổ nghĩa cho “cát” trong phép so sánh thứ hai. Bản sửa giữ “không thể đếm được” gắn với cát.
