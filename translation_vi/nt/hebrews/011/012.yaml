id: HEB.11.12
reference: Hebrews 11:12
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: διὸ καὶ ἀφ’ ἑνὸς ἐγεννήθησαν, καὶ ταῦτα νενεκρωμένου, καθὼς τὰ ἄστρα τοῦ οὐρανοῦ τῷ πλήθει καὶ ὡς ἡ ἄμμος ἡ παρὰ τὸ χεῖλος τῆς θαλάσσης ἡ ἀναρίθμητος.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/012.yaml
  text: Therefore from one man[a], and this one as good as dead, descendants were born as numerous as the stars of heaven and as the innumerable sand by the seashore.
translation:
  language: vi
  text: Vì thế, từ một người[a]—dù người ấy gần như đã mất khả năng sinh sản—đã sinh ra con cháu đông như sao trên trời và như cát không thể đếm được bên bờ biển.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “từ một”; người được nói đến là Áp-ra-ham. Cụm “gần như đã mất khả năng sinh sản” diễn tả tình trạng ông đã quá tuổi sinh con, không phải đã chết theo nghĩa đen.'
    reason: Giữ sự nhấn mạnh của cách nói “từ một” trong nguyên văn, đồng thời giải thích sở chỉ theo ngữ cảnh và nghĩa ẩn dụ của cụm “đã bị làm cho chết/suy kiệt”.
lexical_decisions:
- source_word: διὸ
  choice: Vì thế
  rationale: Diễn tả kết luận suy ra từ lời trước về đức tin và việc nhận được khả năng sinh con.
- source_word: ἀφ’ ἑνὸς
  choice: từ một người
  rationale: Giữ cách nói nhấn mạnh 'một người' của nguyên văn; giống đực và ngữ cảnh cho thấy người ấy là Áp-ra-ham.
- source_word: ἐγεννήθησαν
  choice: đã sinh ra vô số con cháu
  rationale: Động từ thụ động số nhiều nói đến việc dòng dõi xuất hiện. Tiếng Việt tự nhiên cần nêu 'con cháu'; 'vô số' được chuyển lên đây để câu trôi chảy, đồng thời vẫn được triển khai bằng hai hình ảnh so sánh phía sau.
- source_word: καὶ ταῦτα νενεκρωμένου
  choice: mà người ấy lại gần như đã chết
  rationale: Diễn đạt thành ngữ chỉ tình trạng tuổi tác khiến khả năng sinh sản coi như không còn, chứ không nói Áp-ra-ham đã chết theo nghĩa đen.
- source_word: καθὼς τὰ ἄστρα τοῦ οὐρανοῦ τῷ πλήθει
  choice: đông như sao trên trời
  rationale: Cách diễn đạt tự nhiên, trang trọng trong tiếng Việt và giữ rõ ý đông về số lượng.
- source_word: ὡς ἡ ἄμμος ἡ παρὰ τὸ χεῖλος τῆς θαλάσσης ἡ ἀναρίθμητος
  choice: như cát không thể đếm được bên bờ biển
  rationale: χείλος được diễn đạt theo thành ngữ là 'bờ biển', còn ἀναρίθμητος là 'không thể đếm được', giữ hình ảnh và ý nghĩa của nguyên văn.
theological_decisions:
- issue: Sở chỉ của cụm 'từ một người'
  choice: Giữ 'một người' trong câu chính và giải thích đó là Áp-ra-ham trong chú thích.
  alternative: Dịch thẳng là 'từ Áp-ra-ham' hoặc chỉ 'từ một'.
  rationale: Ngữ cảnh và hình thái giống đực xác định Áp-ra-ham, nhưng cách dịch này vẫn bảo toàn sự nhấn mạnh và hình thức khái quát của nguyên văn.
- issue: Ý nghĩa của νενεκρωμένου
  choice: 'Hiểu theo nghĩa ẩn dụ: Áp-ra-ham đã quá tuổi sinh con, khả năng sinh sản gần như chết.'
  alternative: Hiểu là đã chết theo nghĩa đen hoặc bị làm cho chết.
  rationale: Mạch văn nói về việc sinh con kỳ diệu trong tuổi già; cách hiểu theo nghĩa đen sẽ mâu thuẫn với sự kiện được kể.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dấu gạch ngang giữ phần chen vào có tính nhấn mạnh của câu Hy Lạp; các hình ảnh 'sao trên trời' và 'cát bên bờ biển' được bảo toàn.
