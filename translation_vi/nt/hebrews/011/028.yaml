language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: πίστει πεποίηκεν τὸ πάσχα καὶ τὴν πρόσχυσιν τοῦ αἵματος, ἵνα μὴ ὁ ὀλοθρεύων τὰ πρωτότοκα θίγῃ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/028.yaml
  text: By faith he has kept the Passover and the sprinkling of the blood[a], so that the destroyer of the firstborn might not touch them.
translation:
  language: vi
  text: Bởi đức tin, ông đã giữ lễ Vượt Qua và rảy huyết, để kẻ hủy diệt không chạm đến các con đầu lòng của họ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “bôi huyết” hoặc “áp huyết.” Từ Hy Lạp chỉ việc đặt huyết vào nơi được quy định trong nghi lễ; “rảy huyết” là cách dịch tế tự truyền thống, còn “bôi huyết” có thể phản ánh cụ thể hơn việc bôi huyết lên khung cửa trong lễ Vượt Qua.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πίστει
  choice: Bởi đức tin
  rationale: Cách dịch tự nhiên cho sở cách chỉ phương tiện, đồng thời giữ công thức lặp lại xuyên suốt Hê-bơ-rơ 11.
- source_word: πεποίηκεν
  choice: đã giữ
  rationale: Trong ngữ cảnh nghi lễ, ποιέω chỉ việc thực hiện hoặc cử hành lễ Vượt Qua; “giữ lễ” là cách nói tiếng Việt tự nhiên và không hàm ý rằng Môi-se thiết lập lễ này.
- source_word: τὸ πάσχα
  choice: lễ Vượt Qua
  rationale: Bao quát việc cử hành lễ, không thu hẹp nghĩa thành riêng bữa ăn Vượt Qua.
- source_word: τὴν πρόσχυσιν τοῦ αἵματος
  choice: làm nghi thức rảy huyết
  rationale: Diễn đạt hành động nghi lễ đặt huyết lên nơi được chỉ định. “Rảy huyết” giữ cách dùng truyền thống trong ngữ cảnh tế tự, còn khả năng “bôi huyết” sát bối cảnh Xuất Hành hơn được ghi ở chú thích.
- source_word: ἵνα μὴ
  choice: để ... không
  rationale: Giữ rõ sắc thái mục đích của mệnh đề ἵνα với μή và thể giả định, đồng thời tự nhiên trong tiếng Việt.
- source_word: ὁ ὀλοθρεύων
  choice: kẻ hủy diệt
  rationale: Dịch phân từ dùng như danh từ mà không thêm “thiên sứ,” một sự xác định không có trực tiếp trong tiếng Hy Lạp.
- source_word: τὰ πρωτότοκα
  choice: các con đầu lòng
  rationale: Trong bối cảnh tai họa Vượt Qua, cách diễn đạt này rõ ràng, tự nhiên và phản ánh danh từ hóa số nhiều của “đầu lòng.”
- source_word: θίγῃ
  choice: không chạm đến
  rationale: Giữ nghĩa cơ bản “chạm đến,” trong khi ngữ cảnh tự cho thấy sự chạm đến ấy mang tính hủy diệt.
- source_word: αὐτῶν
  choice: họ
  rationale: Giữ đại từ ngắn gọn của nguyên văn và không tự ý thay bằng “dân Y-sơ-ra-ên.”
theological_decisions:
- issue: Chủ ngữ hàm ẩn của πεποίηκεν
  choice: Giữ đại từ “ông,” chỉ Môi-se theo văn mạch
  alternative: Nêu đích danh “Môi-se”
  rationale: Các câu 23–29 đang nói về Môi-se; tuy vậy, nguyên văn chỉ hàm ẩn chủ ngữ nên bản dịch giữ đại từ thay vì thêm tên riêng.
- issue: Nghĩa của πίστις
  choice: đức tin
  alternative: lòng tin; sự trung tín
  rationale: Chủ đề xuyên suốt Hê-bơ-rơ 11 xác định rõ nghĩa “đức tin”; “sự trung tín” không phù hợp bằng trong câu này.
- issue: Danh tính của ὁ ὀλοθρεύων
  choice: kẻ hủy diệt
  alternative: thiên sứ hủy diệt
  rationale: Nguyên văn không gọi nhân vật này là thiên sứ; giữ cách gọi khái quát tránh giải quyết một cách diễn giải mà bản văn không nói rõ.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “giữ lễ Vượt Qua” theo lối nói tự nhiên; “làm nghi thức rảy huyết” tránh cấu trúc danh hóa nặng nề. Đại từ “ông” phù hợp khi tiếp nối nhân vật Môi-se trong văn mạch.
