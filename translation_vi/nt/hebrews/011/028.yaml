review_pass:
  verdict: revise
  source_fidelity: Bản dịch truyền đạt đúng công thức “bởi đức tin,” việc giữ lễ Vượt Qua, mục đích ngăn kẻ hủy diệt chạm đến nhóm được nói tới. Tuy nhiên, “làm nghi thức rảy huyết” thêm khái niệm “nghi thức” và biến cụm danh từ Hy Lạp thành một diễn đạt nặng, trong khi nguyên văn chỉ nêu việc áp/rảy huyết. “Các con đầu lòng” cũng có thể khiến “họ” bị hiểu nhầm là chính các con đầu lòng, thay vì nhóm thuộc về Môi-se/Ít-ra-ên mà đại từ αὐτῶν chỉ đến theo văn mạch.
  naturalness: “Giữ lễ Vượt Qua” và “kẻ hủy diệt” tự nhiên, trang trọng. Cụm “việc rảy huyết” gọn và tự nhiên hơn “làm nghi thức rảy huyết.” Việc đặt “của họ” ngay sau “các con đầu lòng” làm rõ quan hệ cú pháp mà vẫn giữ đại từ không định danh của nguyên văn.
  terminology: “Đức tin,” “lễ Vượt Qua,” “kẻ hủy diệt,” và “rảy huyết” phù hợp với cách dùng Kinh Thánh tiếng Việt hiện đại. Chú thích nên giữ phương án “bôi huyết/việc bôi huyết,” vì sát hơn hành động trong Xuất Hành 12, mà không biến nó thành cách hiểu duy nhất trong thân bài.
  issues:
  - severity: medium
    issue: “làm nghi thức rảy huyết” thêm từ và có cấu trúc nặng
    rationale: τὴν πρόσχυσιν τοῦ αἵματος là “việc rảy/áp huyết,” không nêu riêng một “nghi thức.” Bỏ “làm nghi thức” sát nguyên văn và tự nhiên hơn.
  - severity: low
    issue: Vị trí của “họ” dễ mơ hồ
    rationale: Trong tiếng Việt, “họ” đứng sau “các con đầu lòng” có thể bị liên hệ với danh từ gần nhất. “Các con đầu lòng của họ” phản ánh rõ quan hệ mà văn mạch xác định, không cần thêm “dân Ít-ra-ên.”
  revised_text: Bởi đức tin, ông đã giữ lễ Vượt Qua và rảy huyết, để kẻ hủy diệt không chạm đến các con đầu lòng của họ.[a]
