revisions:
- from: Bởi đức tin, ông đã giữ lễ Vượt Qua và làm nghi thức rảy huyết[a], để kẻ hủy diệt các con đầu lòng không chạm đến họ.
  to: Bởi đức tin, ông đã giữ lễ Vượt Qua và rảy huyết, để kẻ hủy diệt không chạm đến các con đầu lòng của họ.[a]
