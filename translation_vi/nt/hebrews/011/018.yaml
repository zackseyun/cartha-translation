translation:
  language: vi
  text: 'là người mà có lời phán rằng: “Dòng dõi của con sẽ được gọi trong Y-sác.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc theo ý nghĩa trong ngữ cảnh: “Dòng dõi của con sẽ được kể qua Y-sác.” Sát mặt chữ: “Trong Y-sác, hạt giống của con sẽ được gọi.”'
    reason: Nêu cách diễn đạt dòng dõi theo Y-sác, đồng thời bảo tồn ἐν (“trong”), κληθήσεται (“sẽ được gọi”) và σπέρμα (“hạt giống/dòng dõi”) của nguyên văn.
lexical_decisions:
- source_word: πρὸς ὃν ἐλαλήθη
  choice: là người đã được phán rằng
  rationale: Diễn đạt tự nhiên cấu trúc πρὸς ὃν với động từ bị động ἐλαλήθη, đồng thời giữ sắc thái trang trọng của lời Đức Chúa Trời phán với Áp-ra-ham.
- source_word: Ἐν Ἰσαὰκ
  choice: qua Y-sác
  rationale: Trong lời trích Sáng Thế Ký 21:12, ἐν chỉ dòng huyết thống được xác định qua Y-sác, không phải vị trí ở trong ông.
- source_word: κληθήσεταί
  choice: sẽ được kể
  rationale: καλέω ở đây có nghĩa chỉ định hoặc công nhận là dòng dõi; “được kể” tự nhiên hơn “được gọi” trong tiếng Việt và không biến câu thành việc đặt tên.
- source_word: σοι σπέρμα
  choice: dòng dõi của con
  rationale: σπέρμα là danh từ số ít mang nghĩa tập hợp về hậu duệ; “dòng dõi” giữ được ý tập thể và phù hợp văn cảnh lời hứa. Đại từ σοι được chuyển thành quan hệ sở hữu tự nhiên.
theological_decisions:
- issue: Ý nghĩa của lời trích về dòng dõi được hứa cho Áp-ra-ham
  choice: Dòng dõi của con sẽ được kể qua Y-sác
  alternative: Trong Y-sác, hạt giống của con sẽ được gọi
  rationale: Bản dịch thể hiện việc dòng dõi lời hứa được xác định qua Y-sác mà không giải thích xa hơn về bản chất giao ước hoặc áp đặt một cách đọc tín lý riêng.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng và dễ hiểu. Dùng “được phán” phù hợp văn cảnh lời thần thượng; dùng các tên riêng quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
