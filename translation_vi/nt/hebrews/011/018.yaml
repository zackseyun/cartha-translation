  to: 'là người mà có lời phán rằng: “Dòng dõi của con sẽ được gọi trong Y-sác.”[a]'
  rationale: Sửa cụm mở đầu để tiếng Việt tự nhiên hơn mà vẫn giữ tính vô nhân xưng của lời nói trong tiếng Hy Lạp. Đưa “sẽ được gọi trong Y-sác” vào bản chính để bám sát Ἐν Ἰσαὰκ κληθήσεταί; giữ phương án “được kể qua Y-sác” trong chú thích vì diễn đạt tốt ý nghĩa dòng dõi được quy định qua Y-sác nhưng mang tính giải thích hơn.
