id: HEB.11.8
reference: Hebrews 11:8
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸀Πίστει καλούμενος Ἀβραὰμ ὑπήκουσεν ἐξελθεῖν εἰς ⸀τόπον ὃν ἤμελλεν λαμβάνειν εἰς κληρονομίαν, καὶ ἐξῆλθεν μὴ ἐπιστάμενος ποῦ ἔρχεται.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/008.yaml
  text: By faith Abraham[a], when called, obeyed to go out to a place that he was going to receive as an inheritance, and he went out not knowing where he was going.
translation:
  language: vi
  text: Bởi đức tin, Áp-ra-ham, khi được kêu gọi, đã vâng lời ra đi đến một nơi mình sẽ nhận làm cơ nghiệp; ông ra đi mà không biết mình đang đi đâu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πίστει
  choice: Bởi đức tin
  rationale: Dịch cách phương tiện của πίστις; “đức tin” là cách diễn đạt chuẩn, tự nhiên trong văn mạch Hê-bơ-rơ 11 và nhấn mạnh sự tin cậy đáp lại lời kêu gọi.
- source_word: καλούμενος
  choice: khi được kêu gọi
  rationale: Giữ thể bị động và sắc thái hoàn cảnh-thời gian của phân từ hiện tại mà không ấn định quá mức trình tự.
- source_word: ὑπήκουσεν ἐξελθεῖν
  choice: đã vâng lời ra đi
  rationale: Tiếng Việt tự nhiên cho động từ “vâng lời” đi với động từ chỉ hành động; đồng thời phản ánh việc sự vâng lời được thể hiện bằng việc ra đi.
- source_word: τόπον
  choice: một nơi
  rationale: Đích đến lúc ấy chưa được xác định đối với Áp-ra-ham; “một nơi” thể hiện tính bất định trong văn cảnh.
- source_word: ἤμελλεν λαμβάνειν εἰς κληρονομίαν
  choice: mình sẽ nhận làm cơ nghiệp
  rationale: μέλλω diễn tả tương lai trong văn cảnh; “làm cơ nghiệp” giữ ý nơi ấy được nhận trong tư cách phần thừa hưởng mà không thêm sắc thái tiền định.
- source_word: καὶ ἐξῆλθεν
  choice: ông ra đi
  rationale: Giữ sự lặp lại có chủ ý với ἐξελθεῖν và chuyển mạch kể chuyện rõ ràng.
- source_word: μὴ ἐπιστάμενος ποῦ ἔρχεται
  choice: mà không biết mình đang đi đâu
  rationale: Diễn đạt tự nhiên hoàn cảnh đi kèm; “đang đi đâu” phản ánh thì hiện tại của ἔρχεται theo điểm nhìn của hành trình.
theological_decisions:
- issue: Sắc thái của πίστις
  choice: đức tin
  alternative: sự tin cậy; lòng trung tín
  rationale: Văn cảnh tập trung vào sự đáp ứng tin cậy của Áp-ra-ham trước lời kêu gọi. “Đức tin” giữ thuật ngữ chủ đạo của cả chương mà không chuyển trọng tâm sang lòng trung tín như một phẩm chất.
- issue: Chủ thể ngầm của lời kêu gọi
  choice: không thêm “Đức Chúa Trời” vào câu
  alternative: khi được Đức Chúa Trời kêu gọi
  rationale: Nguồn Hy Lạp dùng thể bị động nhưng không nêu tác nhân. Dù văn cảnh cho thấy tác nhân là Đức Chúa Trời, bản dịch không cần bổ sung điều không được nói rõ trong câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Áp-ra-ham” và “cơ nghiệp” theo cách gọi Kinh Thánh quen thuộc; cấu trúc câu giữ sự lặp lại “ra đi” của nguyên bản. Đại từ phản thân “mình” quy chiếu tự nhiên về Áp-ra-ham trong cả hai vế.
