id: HEB.11.3
reference: Hebrews 11:3
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: πίστει νοοῦμεν κατηρτίσθαι τοὺς αἰῶνας ῥήματι θεοῦ, εἰς τὸ μὴ ἐκ φαινομένων ⸂τὸ βλεπόμενον⸃ γεγονέναι.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/003.yaml
  text: By faith we understand that the ages were framed by the word of God[a], so that what is seen did not come into being from things that are visible.
translation:
  language: vi
  text: Nhờ đức tin, chúng ta hiểu rằng các thời đại[a] đã được định hình bởi lời phán của Đức Chúa Trời, đến nỗi điều thấy được không phát sinh từ những điều hữu hình.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “các thế giới” hoặc “vũ trụ.” Từ Hy Lạp có nghĩa đen là “các thời đại,” nhưng có thể chỉ trật tự thế giới trải qua thời gian.
    reason: lexical_alternative
lexical_decisions:
- source_word: πίστει
  choice: Nhờ đức tin
  rationale: Dạng tặng cách chỉ phương tiện; cách dịch này tự nhiên, súc tích và giữ công thức lặp lại xuyên suốt chương 11.
- source_word: νοοῦμεν
  choice: chúng ta hiểu
  rationale: Diễn tả sự nhận biết bằng trí óc chứ không phải chỉ bằng giác quan.
- source_word: κατηρτίσθαι
  choice: đã được định hình
  rationale: Diễn đạt việc được cấu thành và sắp đặt thành một trật tự hoàn chỉnh, nhưng không quy từ này riêng về hành vi tạo vật chất.
- source_word: τοὺς αἰῶνας
  choice: các thời đại
  rationale: Giữ nghĩa trực tiếp và số nhiều của αἰῶνες, đồng thời bảo tồn chiều kích vừa thời gian vừa vũ trụ của trật tự được tạo dựng; chú thích nêu các cách hiểu rộng hơn.
- source_word: ῥήματι θεοῦ
  choice: bởi lời phán của Đức Chúa Trời
  rationale: ῥῆμα nhấn mạnh lời được nói ra; “lời phán” thể hiện sắc thái ấy, còn “bởi” cho thấy phương tiện.
- source_word: εἰς τὸ μὴ ... γεγονέναι
  choice: đến nỗi ... không phát sinh
  rationale: “Đến nỗi” thể hiện kết quả của mệnh đề trước; “phát sinh” giữ ý nghĩa đi vào hiện hữu của γίνομαι mà không thêm một công thức siêu hình.
- source_word: ἐκ φαινομένων
  choice: từ những gì hiện ra
  rationale: Giữ được sắc thái của φαινομένων là những gì xuất hiện hoặc có thể nhận thấy, thay vì thu hẹp hoàn toàn thành vật chất hữu hình.
- source_word: τὸ βλεπόμενον
  choice: điều thấy được
  rationale: Giữ dạng số ít mang nghĩa tập hợp của phân từ được danh từ hóa, chỉ toàn bộ trật tự hữu hình.
theological_decisions:
- issue: Phạm vi nghĩa của αἰῶνες trong lời khẳng định về sự sáng tạo
  choice: Dịch là “các thời đại” và giải thích nghĩa rộng trong chú thích.
  alternative: “các thế giới” hoặc “vũ trụ”
  rationale: Nguyên ngữ có thể chỉ trật tự thế giới trải qua thời gian, không chỉ riêng không gian vật chất. Cách dịch chính giữ độ rộng và sự mơ hồ chân thực của từ Hy Lạp.
- issue: Hàm ý sáng tạo từ hư vô
  choice: Chỉ khẳng định điều thấy được không phát sinh từ những gì hiện ra.
  alternative: Diễn đạt trực tiếp rằng vũ trụ được tạo nên từ hư vô.
  rationale: Câu này phù hợp với giáo lý sáng tạo từ hư vô nhưng không phát biểu trọn công thức ấy; bản dịch không nên thêm điều vượt quá lời văn Hy Lạp.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại. “Nhờ đức tin” phù hợp với công thức chủ đạo của chương; “lời phán” dễ hiểu và phản ánh sắc thái lời được nói ra của ῥῆμα. Cấu trúc câu giữ sự đối lập giữa “điều thấy được” và “những gì hiện ra” mà không giải thích quá mức.
