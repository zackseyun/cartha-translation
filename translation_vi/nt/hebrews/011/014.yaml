  text: οἱ γὰρ τοιαῦτα λέγοντες ἐμφανίζουσιν ὅτι πατρίδα ἐπιζητοῦσιν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/014.yaml
  text: For those who say such things make it clear that they are seeking a homeland[a].
translation:
  language: vi
  text: Vì những người nói những điều như thế cho thấy rõ rằng họ đang tìm kiếm một quê hương[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “xứ sở của chính mình” hoặc “xứ sở bản quán”. Các câu tiếp theo, đặc biệt câu 16, cho thấy quê hương họ trông mong rốt cuộc là quê hương trên trời.
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: Vì
  rationale: Giữ mối liên kết giải thích với câu trước và tự nhiên trong tiếng Việt.
- source_word: τοιαῦτα
  choice: những điều như thế
  rationale: Chỉ về loại lời vừa được nêu trong văn cảnh, đồng thời giữ sắc thái khái quát của đại từ trung tính số nhiều.
- source_word: λέγοντες
  choice: những người nói
  rationale: Chuyển phân từ hiện tại thành mệnh đề quan hệ tự nhiên trong tiếng Việt, vẫn giữ ý nghĩa hành động nói mang tính hiện thời hoặc khái quát.
- source_word: ἐμφανίζουσιν
  choice: cho thấy rõ
  rationale: Diễn đạt việc làm cho một điều trở nên hiển nhiên qua chính lời họ nói.
- source_word: ὅτι
  choice: rằng
  rationale: Dẫn vào nội dung được cho thấy rõ.
- source_word: πατρίδα
  choice: một quê hương
  rationale: “Quê hương” diễn đạt tự nhiên ý về xứ sở gốc hay nơi mình thuộc về; “một” phản ánh danh từ không có mạo từ và tránh xác định quá sớm đối tượng là quê hương dưới đất hay trên trời.
- source_word: ἐπιζητοῦσιν
  choice: đang tìm kiếm
  rationale: Giữ sắc thái tiếp diễn của thì hiện tại và ý chủ động theo đuổi, thay vì chỉ diễn đạt lòng mong mỏi.
theological_decisions:
- issue: Ý nghĩa của πατρίδα mà các tổ phụ tìm kiếm
  choice: một quê hương
  alternative: quê hương dưới đất; quê hương trên trời
  rationale: Câu này chỉ nói chung rằng họ tìm kiếm một quê hương; câu kế tiếp mới làm rõ quê hương họ hướng tới rốt cuộc là quê hương tốt hơn, thuộc về trời. Bản dịch không đưa kết luận ấy vào câu này quá sớm.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. “Cho thấy rõ” tự nhiên hơn “làm hiển nhiên”; “quê hương” gần gũi và ít mang sắc thái chính trị hơn các cách như “tổ quốc”, đồng thời vẫn bảo toàn độ mở của nguyên văn.
