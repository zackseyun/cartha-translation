  text: Πίστει ⸀καὶ περὶ μελλόντων εὐλόγησεν Ἰσαὰκ τὸν Ἰακὼβ καὶ τὸν Ἠσαῦ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/020.yaml
  text: By faith Isaac blessed Jacob and Esau, even concerning things to come.
translation:
  language: vi
  text: Bởi đức tin, I-sác đã chúc phước cho Gia-cốp và Ê-sau, cả về những điều sẽ xảy đến.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πίστει
  choice: Bởi đức tin
  rationale: Diễn đạt tự nhiên giá trị phương tiện/căn cứ của cách trong tiếng Hy Lạp và giữ công thức lặp lại xuyên suốt Hê-bơ-rơ 11.
- source_word: καὶ περὶ μελλόντων
  choice: cả về những điều sẽ xảy đến
  rationale: καί có sắc thái nhấn mạnh/bổ sung, gần với “cả”; περὶ chỉ nội dung mà lời chúc phước đề cập; μελλόντων là những điều còn ở tương lai, được diễn đạt tự nhiên là “sẽ xảy đến”.
- source_word: εὐλόγησεν
  choice: đã chúc phước cho
  rationale: Giữ nghĩa của hành động ban lời chúc phước, không thu hẹp thành dự báo hay chỉ nói lời tốt đẹp.
theological_decisions:
- issue: Mối liên hệ giữa đức tin và nội dung tương lai của lời chúc phước
  choice: Giữ “cả về những điều sẽ xảy đến” bổ nghĩa cho hành động chúc phước
  alternative: “đã chúc phước... về tương lai” hoặc lược sắc thái nhấn mạnh của καί
  rationale: Cách dịch bảo tồn cấu trúc và sức nhấn của câu Hy Lạp mà không xác định thêm bản chất hay thời điểm của những điều tương lai.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu; dùng cách phiên âm tên riêng quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
