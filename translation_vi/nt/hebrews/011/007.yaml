revisions:
- from: Bởi đức tin, Nô-ê, sau khi được cảnh báo[a] về những điều chưa thấy, đã kính sợ mà đóng một con tàu để cứu cả nhà mình. Nhờ con tàu ấy[b], ông lên án thế gian và trở thành người thừa kế sự công chính theo đức tin.[c]
  to: Bởi đức tin, Nô-ê, sau khi được cảnh báo[a] về những điều chưa thấy, vì lòng kính sợ, đã đóng một chiếc tàu để cứu cả nhà mình. Nhờ chiếc tàu ấy[b], ông kết án thế gian và trở thành người thừa kế sự công chính theo đức tin.[c]
  rationale: Sửa “lên án” thành “kết án” để phản ánh chính xác hơn κατέκρινεν; điều chỉnh cách diễn đạt của εὐλαβηθεὶς và từ loại của “tàu” cho tự nhiên hơn trong tiếng Việt. Chú thích về δικαιοσύνη được rút về mức từ vựng và cú pháp, tránh diễn giải vượt quá bản văn.
  reviewer_model: gpt-5.6-terra
