id: HEB.11.7
reference: Hebrews 11:7
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: πίστει χρηματισθεὶς Νῶε περὶ τῶν μηδέπω βλεπομένων εὐλαβηθεὶς κατεσκεύασεν κιβωτὸν εἰς σωτηρίαν τοῦ οἴκου αὐτοῦ, δι’ ἧς κατέκρινεν τὸν κόσμον, καὶ τῆς κατὰ πίστιν δικαιοσύνης ἐγένετο κληρονόμος.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/007.yaml
  text: By faith Noah[a], having been warned about things not yet seen, in reverent fear constructed an ark for the salvation of his household[d][c][b], through which he condemned the world and became heir of the righteousness according to faith.
translation:
  language: vi
  text: Bởi đức tin, Nô-ê, sau khi được cảnh báo[a] về những điều chưa thấy, vì lòng kính sợ, đã đóng một chiếc tàu để cứu cả nhà mình. Nhờ chiếc tàu ấy[b], ông kết án thế gian và trở thành người thừa kế sự công chính theo đức tin.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “sau khi nhận được lời chỉ dẫn từ Đức Chúa Trời” hoặc “sau khi nhận được lời cảnh báo từ Đức Chúa Trời.”'
    reason: lexical_alternative
  - marker: b
    text: “Nhờ chiếc tàu ấy” tự nhiên nhất là chỉ về chiếc tàu; một số người hiểu rộng hơn là nhờ đức tin hoặc sự đáp ứng vâng phục của Nô-ê.
    reason: alternative_reading
  - marker: c
    text: “Sự công chính” cũng có thể dịch là “sự công lý”; cụm từ này nói về sự công chính “theo đức tin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πίστει
  choice: Bởi đức tin
  rationale: Dịch cách phương tiện và giữ mô thức lặp lại của Hê-bơ-rơ 11; ở đây nhấn mạnh sự đáp ứng tin cậy của Nô-ê.
- source_word: χρηματισθεὶς
  choice: sau khi được cảnh báo
  rationale: Thể bị động chỉ việc nhận một lời truyền đạt hoặc cảnh báo có nguồn gốc thần linh; không thêm rõ chủ thể “Đức Chúa Trời” vì nguyên văn không nêu trực tiếp.
- source_word: περὶ τῶν μηδέπω βλεπομένων
  choice: về những điều chưa thấy
  rationale: Giữ sắc thái thời gian của μηδέπω và tính chưa hiện ra của các biến cố được báo trước.
- source_word: εὐλαβηθεὶς
  choice: đã kính sợ mà
  rationale: Diễn đạt sự kính sợ thành kính dẫn đến hành động, không thu hẹp thành nỗi sợ hãi đơn thuần.
- source_word: κατεσκεύασεν κιβωτὸν
  choice: đóng một con tàu
  rationale: Trong tiếng Việt, “đóng tàu” là cách nói tự nhiên cho hành động chế tạo con tàu của Nô-ê.
- source_word: εἰς σωτηρίαν τοῦ οἴκου αὐτοῦ
  choice: để cứu cả nhà mình
  rationale: Truyền đạt trực tiếp mục đích giải cứu; “cả nhà” tự nhiên và bao quát nghĩa hộ gia đình của οἶκος.
- source_word: δι’ ἧς
  choice: Nhờ con tàu ấy
  rationale: Đại từ giống cái gần nhất quy chiếu tự nhiên đến κιβωτός; lặp danh từ giúp tiếng Việt rõ nghĩa.
- source_word: κατέκρινεν τὸν κόσμον
  choice: ông lên án thế gian
  rationale: Giữ lực phán xét của động từ; sự vâng phục bởi đức tin của Nô-ê trở thành lời kết án đối với thế gian.
- source_word: τῆς κατὰ πίστιν δικαιοσύνης
  choice: sự công chính theo đức tin
  rationale: Giữ cấu trúc κατά và thuật ngữ thần học δικαιοσύνη mà không diễn giải quá mức thành “được xưng công chính bởi đức tin”.
- source_word: ἐγένετο κληρονόμος
  choice: trở thành người thừa kế
  rationale: Cách diễn đạt tiếng Việt tự nhiên về địa vị đạt được.
theological_decisions:
- issue: Nguồn của lời cảnh báo trong χρηματισθεὶς
  choice: được cảnh báo
  alternative: được Đức Chúa Trời cảnh báo; nhận lời chỉ dẫn từ Đức Chúa Trời
  rationale: Ngữ cảnh hàm ý nguồn thần linh, nhưng nguyên văn không nêu danh Đức Chúa Trời; bản chính giữ sự hàm ẩn ấy và chú thích nêu khả năng.
- issue: Sắc thái của εὐλαβηθεὶς
  choice: kính sợ
  alternative: được thúc đẩy bởi lòng kính sợ; thận trọng
  rationale: Từ này biểu thị phản ứng thành kính trước lời cảnh báo, vừa có yếu tố sợ vừa có lòng tôn kính.
- issue: Sở chỉ của δι’ ἧς
  choice: con tàu
  alternative: đức tin hoặc hành động vâng phục của Nô-ê
  rationale: Sự hòa hợp giống và tiền ngữ gần nhất nghiêng về κιβωτός, nhưng mạch văn rộng hơn cho phép cách hiểu liên quan đến đức tin hay sự đáp ứng vâng phục.
- issue: Nghĩa của δικαιοσύνη
  choice: sự công chính
  alternative: sự chính trực; sự công lý
  rationale: Trong cụm nói về thừa kế và đức tin, “sự công chính” giữ được chiều kích quan hệ và thần học mà không đồng nhất với công lý xã hội-pháp lý.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Nô-ê”, “con tàu”, “cả nhà”, “thế gian”, “sự công chính” theo lối dùng Kinh Thánh tiếng Việt quen thuộc; tránh cổ ngữ và tránh thêm tác nhân thần linh không được nêu rõ trong nguyên văn.
