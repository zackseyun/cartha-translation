  - severity: low
    issue: “đã kính sợ mà đóng”
    rationale: Cách nối này hơi gượng và có thể khiến “kính sợ” được hiểu đơn thuần là trạng thái. “Vì lòng kính sợ, ... đã đóng” diễn đạt tự nhiên và sát chức năng phân từ εὐλαβηθεὶς hơn.
