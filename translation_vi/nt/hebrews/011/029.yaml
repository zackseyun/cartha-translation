  - severity: low
    issue: “Khi thử làm như vậy” không nêu trực tiếp hành động được thử.
    rationale: Thành ngữ πεῖραν λαβόντες trong ngữ cảnh chỉ việc người Ai Cập thử thực hiện cuộc vượt qua ấy. “Khi cũng thử vượt qua như thế” làm rõ liên kết mà không thêm ý nghĩa ngoài bản văn.
  - severity: low
    issue: Chú thích gọi nền tảng là “địa danh Hê-bơ-rơ”.
    rationale: Điều được bàn luận là tên gọi bằng tiếng Hê-bơ-rơ trong trình thuật Xuất Ai Cập; diễn đạt lại giúp chú thích chính xác và sáng rõ hơn.
