  source_fidelity: 'Bản dịch truyền đạt đúng các yếu tố chính của câu: Πίστει là “Nhờ đức tin”; διέβησαν là hành động vượt qua; Ἐρυθρὰν Θάλασσαν là “Biển Đỏ”; và κατεπόθησαν giữ được thể bị động cùng hình ảnh “bị nuốt chửng”. Tuy nhiên, “khi thử làm như vậy” tuy hiểu được nhưng quy chiếu của thành ngữ ἧς πεῖραν λαβόντες sẽ rõ và sát hơn khi nói trực tiếp rằng người Ai Cập thử vượt qua như thế.'
  naturalness: “Như đi qua đất khô” hơi gượng trong tiếng Việt hiện đại. “Như qua đất khô” tự nhiên hơn, vẫn diễn đạt phép so sánh ὡς và ý vượt qua qua một vùng đất khô. Cấu trúc đối lập với “còn” và mệnh đề thời gian vẫn phù hợp văn phong trang trọng, dễ hiểu.
  terminology: “Đức tin”, “Biển Đỏ”, “người Ai Cập”, và “bị nuốt chửng” đều phù hợp thuật ngữ, tên riêng, và sắc thái của bản Hy Lạp. Chú thích cần chỉnh nhẹ để nói chính xác hơn về tên gọi tiếng Hê-bơ-rơ nền trong Xuất Ai Cập, thay vì gọi chung là “địa danh Hê-bơ-rơ”.
  issues:
  - severity: low
