language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Πίστει διέβησαν τὴν Ἐρυθρὰν Θάλασσαν ὡς διὰ ξηρᾶς ⸀γῆς, ἧς πεῖραν λαβόντες οἱ Αἰγύπτιοι κατεπόθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/029.yaml
  text: By faith they crossed the Red Sea as through dry land[a], of which the Egyptians, when they attempted it, were swallowed up.
translation:
  language: vi
  text: Nhờ đức tin, họ đã vượt qua Biển Đỏ như qua đất khô[a]; còn người Ai Cập, khi cũng thử vượt qua như thế, thì bị nuốt chửng.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể gọi là “Biển Sậy”. Bản Hy Lạp tại đây ghi “Biển Đỏ” (Ἐρυθρὰν Θάλασσαν), trong khi tên gọi bằng tiếng Hê-bơ-rơ trong sách Xuất Ai Cập đôi khi được hiểu là “Biển Sậy”.
    reason: Nêu phương án từ vựng liên quan đến tên gọi trong Xuất Ai Cập, đồng thời minh định rằng chính văn Hy Lạp của câu này ghi “Biển Đỏ”.
lexical_decisions:
- source_word: Πίστει
  choice: Nhờ đức tin
  rationale: Dạng tặng cách chỉ phương tiện; cách dịch này giữ mô-típ lặp lại của Hê-bơ-rơ 11 và diễn đạt tự nhiên trong tiếng Việt.
- source_word: διέβησαν
  choice: họ đã vượt qua
  rationale: Động từ chỉ việc đi từ bờ bên này sang bờ bên kia; “vượt qua” vừa tự nhiên vừa giữ ý của sự kiện.
- source_word: τὴν Ἐρυθρὰν Θάλασσαν
  choice: Biển Đỏ
  rationale: Cụm Hy Lạp trực tiếp ghi “Biển Đỏ”; tên gọi này được giữ trong chính văn, còn phương án gắn với địa danh Hê-bơ-rơ nền được nêu ở chú thích.
- source_word: ὡς διὰ ξηρᾶς γῆς
  choice: như đi qua đất khô
  rationale: Giữ từ so sánh ὡς và ý đi xuyên qua một lối đất khô; cách nói rõ ràng, tự nhiên và vọng lại trình thuật Xuất Ai Cập.
- source_word: ἧς πεῖραν λαβόντες
  choice: khi thử làm như vậy
  rationale: πεῖραν λαμβάνειν là thành ngữ chỉ việc thử hay toan làm; “như vậy” quy chiếu về chính cuộc vượt biển vừa nêu mà không tạo cấu trúc tiếng Việt gượng ép.
- source_word: οἱ Αἰγύπτιοι
  choice: người Ai Cập
  rationale: Danh xưng dân tộc trực tiếp, trong ngữ cảnh chỉ lực lượng Ai Cập đuổi theo dân Y-sơ-ra-ên.
- source_word: κατεπόθησαν
  choice: bị nuốt chửng
  rationale: Giữ hình ảnh mạnh của động từ καταπίνω ở thể bị động, thay vì diễn giải hẹp hơn là “bị chết đuối”.
theological_decisions:
- issue: Cách dịch πίστις trong Hê-bơ-rơ 11
  choice: đức tin
  alternative: lòng tin; sự trung tín
  rationale: Công thức Πίστει lặp lại xuyên suốt chương và ở đây nói đến phương tiện khiến họ hành động; “đức tin” giữ mô-típ thần học của đoạn mà không chuyển nghĩa sang phẩm tính “sự trung tín”.
- issue: Đối tượng mà người Ai Cập thử thực hiện trong ἧς πεῖραν λαβόντες
  choice: thử làm như vậy, tức thử vượt qua cùng lối biển ấy
  alternative: dịch sát cấu trúc là “mà người Ai Cập, sau khi thử, đã bị nuốt chửng”
  rationale: Đại từ quan hệ ἧς có liên hệ ngữ pháp với biển và thành ngữ nói đến việc thử thực hiện cuộc vượt qua; cách dịch tiếng Việt làm rõ liên kết cần thiết nhưng không thêm động cơ hay kết luận thần học.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “Nhờ đức tin” để mở đầu theo công thức của cả chương; dấu chấm phẩy làm nổi bật sự tương phản giữa dân vượt qua an toàn và người Ai Cập bị nuốt chửng.
