source:
  edition: SBLGNT
  text: λογισάμενος ὅτι καὶ ἐκ νεκρῶν ἐγείρειν δυνατὸς ὁ θεός· ὅθεν αὐτὸν καὶ ἐν παραβολῇ ἐκομίσατο.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/019.yaml
  text: having considered that God is able even to raise from the dead[a], from where, in a figure[b], he also received him back.
translation:
  language: vi
  text: vì ông suy xét rằng Đức Chúa Trời có thể khiến cả người chết sống lại. Vì thế, ông cũng đã nhận lại con mình theo nghĩa tượng trưng.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “theo cách hình tượng.” Cụm từ hàm ý rằng Áp-ra-ham nhận lại Y-sác như thể từ cõi chết, chứ không phải Y-sác thực sự đã chết rồi sống lại.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λογισάμενος
  choice: vì ông suy xét rằng
  rationale: Phân từ aorist trung cách diễn tả sự cân nhắc nội tâm của Áp-ra-ham; “suy xét” tự nhiên và giữ được sắc thái lập luận.
- source_word: καὶ ἐκ νεκρῶν ἐγείρειν
  choice: có thể khiến người chết sống lại
  rationale: Diễn đạt tự nhiên thành ngữ phục sinh trong tiếng Việt; καί mang sắc thái nhấn mạnh, vốn đã được chuyển tải bởi tính chất phi thường của mệnh đề trong ngữ cảnh.
- source_word: δυνατὸς ὁ θεός
  choice: Đức Chúa Trời có thể
  rationale: Giữ cấu trúc năng lực ở thì hiện tại của tiếng Hy Lạp, trình bày đây là khả năng vốn có của Đức Chúa Trời.
- source_word: ὅθεν
  choice: Cũng từ đó
  rationale: Giữ sắc thái nguồn gốc/liên hệ của trạng từ quan hệ, có thể quy chiếu về ý tưởng sống lại vừa nêu, thay vì thuần túy biến nó thành kết luận “vì thế”.
- source_word: ἐν παραβολῇ
  choice: theo nghĩa hình bóng
  rationale: 'παραβολή ở đây chỉ tính tương đồng hoặc hình tượng: Y-sác được nhận lại như thể từ cõi chết; cách dịch không khẳng định một sự phục sinh thật sự hay xác định cứng một mô hình tiên trưng.'
- source_word: ἐκομίσατο
  choice: ông đã nhận lại con mình
  rationale: Trung cách và ngữ cảnh cho thấy Áp-ra-ham nhận lại Y-sác sau khi đã dâng con; “con mình” làm rõ đại từ αὐτόν theo mạch văn mà không cần lặp tên.
- source_word: καὶ
  choice: Cũng
  rationale: Καί thứ hai có tính bổ sung, nối việc nhận lại Y-sác với sự suy xét vừa nêu.
theological_decisions:
- issue: Bản chất việc Áp-ra-ham nhận lại Y-sác
  choice: Dịch là “nhận lại con mình theo nghĩa hình bóng,” giữ sự tương đồng với việc sống lại nhưng không nói đó là một cuộc phục sinh thật sự.
  alternative: Có thể dịch sát hơn là “nhận lại con mình trong một ví dụ/hình ảnh,” hoặc diễn giải là “nhận lại con mình như từ cõi chết.”
  rationale: ἐν παραβολῇ cho biết sự kiện mang tính so sánh/hình tượng. Cách dịch giữ độ mở giữa ý nghĩa ví dụ và hình bóng mà không áp đặt một hệ thống tiên trưng cụ thể.
- issue: Phạm vi quy chiếu của ὅθεν
  choice: Dùng “từ đó” để giữ liên hệ nguồn gốc với ý tưởng sống lại vừa nêu.
  alternative: Có thể hiểu theo nghĩa suy luận là “vì thế” hoặc theo nghĩa không gian chặt hơn là “từ nơi ấy.”
  rationale: ὅθεν có thể mang nghĩa “từ đâu/từ đó” và đôi khi phát triển thành nghĩa “do đó.” Bản dịch giữ sự mơ hồ chân thực giữa liên hệ nguồn và hệ quả.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Đức Chúa Trời” phù hợp lối gọi quen thuộc trong bản dịch Kinh Thánh tiếng Việt; “theo nghĩa hình bóng” giữ sắc thái văn chương của παραβολή nhưng có chú thích để tránh tối nghĩa.
