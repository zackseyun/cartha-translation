- from: vì ông suy xét rằng Đức Chúa Trời có thể khiến người chết sống lại. Cũng từ đó, ông đã nhận lại con mình theo nghĩa hình bóng.[a]
  to: vì ông suy xét rằng Đức Chúa Trời có thể khiến cả người chết sống lại. Vì thế, ông cũng đã nhận lại con mình theo nghĩa tượng trưng.[a]
  rationale: 'Bản sửa giữ cấu trúc phụ thuộc của phân từ λογισάμενος bằng “vì ông suy xét”, phục hồi sắc thái nhấn mạnh trong ý Đức Chúa Trời có thể làm người chết sống lại, và thay cách nối gượng “Cũng từ đó” bằng “Vì thế”. “Theo nghĩa tượng trưng” cùng chú thích bảo toàn độ mở của ἐν παραβολῇ: việc nhận lại Y-sác tương ứng với sự sống lại, nhưng không phải một cuộc phục sinh theo nghĩa đen.'
