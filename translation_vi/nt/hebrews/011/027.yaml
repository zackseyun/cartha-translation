language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: πίστει κατέλιπεν Αἴγυπτον, μὴ φοβηθεὶς τὸν θυμὸν τοῦ βασιλέως, τὸν γὰρ ἀόρατον ὡς ὁρῶν ἐκαρτέρησεν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/027.yaml
  text: By faith he left Egypt[a], not fearing the king’s anger[b], for he endured as seeing the One who is invisible.
translation:
  language: vi
  text: Bởi đức tin, ông rời Ai Cập[a], không sợ cơn giận của vua, vì ông kiên trì như người thấy Đấng vô hình[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Câu này có thể gợi đến việc Môi-se rời Ai Cập khi chạy trốn Pha-ra-ôn (Xuất Ai Cập 2), hoặc đến cuộc xuất hành cùng dân Y-sơ-ra-ên (Xuất Ai Cập 12–14); câu chữ Hy Lạp không xác định biến cố nào.
    reason: cross_reference
  - marker: b
    text: Cũng có thể dịch là “Đấng không thể thấy được” hoặc “Đấng không thấy được”.
    reason: lexical_alternative
lexical_decisions:
- source_word: πίστει
  choice: Bởi đức tin
  rationale: Giữ cách diễn đạt nhất quán với mô-típ lặp lại trong Hê-bơ-rơ 11; cách dùng tặng cách ở đây chỉ phương tiện hoặc cách thức hành động.
- source_word: κατέλιπεν Αἴγυπτον
  choice: ông rời Ai Cập
  rationale: Diễn đạt trực tiếp, tự nhiên; καταλείπω trong ngữ cảnh này mang nghĩa rời khỏi, không nhất thiết hàm ý ruồng bỏ.
- source_word: μὴ φοβηθεὶς τὸν θυμὸν τοῦ βασιλέως
  choice: không sợ cơn giận của vua
  rationale: Giữ quan hệ của phân từ với động từ chính và chuyển θυμός bằng từ ngữ hiện đại, không cường điệu thành cơn thịnh nộ.
- source_word: τὸν ἀόρατον
  choice: Đấng vô hình
  rationale: Tính từ có mạo từ được dùng như danh từ để chỉ một thân vị; “Đấng vô hình” ngắn gọn, trang trọng và giữ nghịch lý với hành động thấy.
- source_word: ὡς ὁρῶν
  choice: như đang thấy
  rationale: Giữ lực so sánh của ὡς và thể tiếp diễn của phân từ, không làm yếu câu bằng cách biến việc thấy thành một giả định hoàn toàn không thật.
- source_word: ἐκαρτέρησεν
  choice: ông vẫn kiên trì
  rationale: καρτερέω diễn tả sự bền chí, đứng vững; “vẫn kiên trì” tự nhiên trong tiếng Việt và phù hợp với việc không khuất phục trước cơn giận của vua.
theological_decisions:
- issue: Biến cố lịch sử được nói đến trong câu “ông rời Ai Cập”
  choice: Không xác định trong chính văn đó là lần Môi-se chạy khỏi Pha-ra-ôn hay cuộc xuất hành của dân Y-sơ-ra-ên.
  alternative: Hiểu riêng là việc Môi-se chạy trốn trong Xuất Ai Cập 2, hoặc riêng là cuộc xuất hành trong Xuất Ai Cập 12–14.
  rationale: Bản Hy Lạp chỉ nói ông rời Ai Cập và không sợ cơn giận của vua; vì câu chữ không xác định biến cố nào, bản dịch giữ nguyên khoảng mở giải thích ấy.
- issue: Nghịch lý thấy Đấng vô hình
  choice: Giữ nguyên hình ảnh “như đang thấy Đấng vô hình”.
  alternative: Diễn giải thành việc nhận biết, tin cậy hoặc ý thức về sự hiện diện của Đức Chúa Trời.
  rationale: Câu Hy Lạp cố ý đặt ὁρῶν bên cạnh ἀόρατον; không nên giải nghĩa thần học thay cho hình ảnh nghịch lý của tác giả.
translation_notes:
  register: Văn phong hiện đại, trang trọng nhưng dễ hiểu. Đại từ “ông” tiếp nối chủ thể Môi-se từ ngữ cảnh, còn “Đấng” viết hoa biểu thị thân vị được nhắc đến mà không thêm danh xưng không có trong nguyên văn.
