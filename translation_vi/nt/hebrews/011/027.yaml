revisions:
- from: Bởi đức tin, ông rời Ai Cập[a], không sợ cơn giận của vua, vì ông vẫn kiên trì như đang thấy Đấng vô hình.[b]
  to: Bởi đức tin, ông rời Ai Cập[a], không sợ cơn giận của vua, vì ông kiên trì như người thấy Đấng vô hình[b].
  rationale: Bản sửa bỏ sắc thái không được đánh dấu trong nguyên ngữ, dùng cấu trúc so sánh tự nhiên hơn cho ὡς ὁρῶν, và đặt lại neo chú thích từ vựng. Chú thích lịch sử tiếp tục giữ mở hai cách xác định biến cố mà văn bản Hy Lạp không quyết định.
