id: HEB.11.31
reference: Hebrews 11:31
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: πίστει Ῥαὰβ ἡ πόρνη οὐ συναπώλετο τοῖς ἀπειθήσασιν, δεξαμένη τοὺς κατασκόπους μετ’ εἰρήνης.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/031.yaml
  text: By faith Rahab the prostitute did not perish with those who were disobedient[b][a], because she had welcomed the spies in peace.
translation:
  language: vi
  text: Nhờ đức tin, Ra-háp, một người hành nghề mại dâm, đã không bị diệt cùng với những kẻ không vâng lời, vì bà đã tiếp đón những người do thám trong hòa bình.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “sau khi bà tiếp đón những người do thám trong hòa bình.”'
    reason: Phân từ δεξαμένη có thể được hiểu theo quan hệ hoàn cảnh hoặc thời gian, thay vì chỉ quan hệ nguyên nhân.
lexical_decisions:
- source_word: πίστει
  choice: Nhờ đức tin
  rationale: Cách nói này diễn đạt tự nhiên sở dụng cách chỉ phương tiện và giữ công thức lặp lại của Hê-bơ-rơ 11.
- source_word: Ῥαὰβ
  choice: Ra-háp
  rationale: Phiên âm tên riêng theo cách dùng quen thuộc trong Kinh Thánh tiếng Việt.
- source_word: ἡ πόρνη
  choice: người làm nghề mại dâm
  rationale: Diễn đạt rõ nghĩa của πόρνη bằng ngôn ngữ hiện đại, trang nghiêm, không dùng từ cổ hoặc uyển ngữ làm nhẹ nghĩa.
- source_word: οὐ συναπώλετο
  choice: đã không bị diệt chung
  rationale: 'Giữ rõ ý của động từ ghép συναπόλλυμι: không cùng chịu chung sự hủy diệt với những người khác.'
- source_word: τοῖς ἀπειθήσασιν
  choice: với những kẻ không vâng lời
  rationale: ἀπειθέω ở đây nhấn mạnh sự không vâng phục; cách dịch này giữ sắc thái đạo đức và ý chí mà không thu hẹp thành chỉ 'không tin'.
- source_word: δεξαμένη
  choice: vì bà đã tiếp đón
  rationale: Phân từ bất định quá khứ nêu hoàn cảnh có thể hiểu theo quan hệ nguyên nhân; 'tiếp đón' tự nhiên khi nói đến việc nhận người vào và đối đãi với họ.
- source_word: τοὺς κατασκόπους
  choice: các thám tử
  rationale: κατάσκοπος chỉ những người bí mật do thám; 'thám tử' là cách gọi quen thuộc trong văn cảnh Giô-suê.
- source_word: μετ’ εἰρήνης
  choice: cách bình an
  rationale: Giữ thành tố εἰρήνη và diễn đạt phương cách tiếp đón; chú thích bảo lưu cách hiểu tự nhiên hơn là 'thân thiện'.
theological_decisions:
- issue: Ý nghĩa của πίστις trong công thức nêu gương ở Hê-bơ-rơ 11
  choice: đức tin
  alternative: lòng tin; sự trung tín
  rationale: Trong cấu trúc πίστει + tên nhân vật, 'đức tin' là thuật ngữ chuẩn, phù hợp ngữ cảnh và không chuyển nghĩa sang phẩm chất 'trung tín'.
- issue: Quan hệ ngữ nghĩa của phân từ δεξαμένη
  choice: vì bà đã tiếp đón
  alternative: sau khi tiếp đón; khi đã tiếp đón
  rationale: Ngữ cảnh thuận với ý nguyên nhân, nhưng phân từ Hy Lạp tự nó không đánh dấu quan hệ này một cách tuyệt đối; vì vậy cần ghi nhận khả năng hoàn cảnh/thời gian.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và dễ hiểu. Dùng “người làm nghề mại dâm” thay cho từ cổ “kỹ nữ”; giữ “đức tin” theo công thức xuyên suốt Hê-bơ-rơ 11. Đại từ “bà” thể hiện sự tôn trọng phù hợp trong lời kể.
