revisions:
- from: Nhờ đức tin, Ra-háp, người làm nghề mại dâm, đã không bị diệt chung với những kẻ không vâng lời, vì bà đã tiếp đón các thám tử cách bình an.[a]
  to: Nhờ đức tin, Ra-háp, một người hành nghề mại dâm, đã không bị diệt cùng với những kẻ không vâng lời, vì bà đã tiếp đón những người do thám trong hòa bình.[a]
  rationale: Sửa “thám tử” thành “những người do thám” để phản ánh chính xác κατάσκοποι và cách dùng tiếng Việt hiện đại. Sửa “cách bình an” thành “trong hòa bình” để câu tự nhiên hơn mà vẫn giữ nghĩa của μετ’ εἰρήνης. Chú thích bảo lưu tính không xác định hoàn toàn của quan hệ ngữ nghĩa nơi phân từ δεξαμένη.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T21:29:15Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch giữ đúng các thành tố chính: πίστει là “nhờ đức tin”, πόρνη được diễn đạt rõ, συναπώλετο giữ ý không bị hủy diệt cùng với, và ἀπειθήσασιν là những người không vâng lời. Tuy nhiên, “thám tử” trong tiếng Việt hiện đại thường chỉ người điều tra tư, không phải κατάσκοποι; cần đổi thành “những người do thám”. “Cách bình an” cũng không tự nhiên trong văn phong hiện đại cho μετ’ εἰρήνης.'
  naturalness: Câu nhìn chung trang trọng và dễ hiểu, nhưng “các thám tử cách bình an” gượng và dễ gây hiểu nhầm. “Tiếp đón những người do thám trong hòa bình” tự nhiên hơn, đồng thời vẫn giữ hình ảnh và tính mở của thành ngữ Hy Lạp.
  terminology: “Đức tin”, “Ra-háp”, “người hành nghề mại dâm”, và “không vâng lời” phù hợp với thuật ngữ và thanh ghi hiện đại. “Những người do thám” là từ ngữ đúng cho κατάσκοποι trong ngữ cảnh Giê-ri-cô.
  issues:
  - severity: medium
    issue: “Thám tử” không phải cách gọi chính xác, tự nhiên cho κατάσκοποι.
    rationale: Trong tiếng Việt hiện đại, “thám tử” thường là detective/người điều tra; κατάσκοποι trong câu này là các spy/scout được phái đi do thám. “Những người do thám” tránh đổi vai trò lịch sử của họ.
  - severity: low
    issue: “Cách bình an” không tự nhiên.
    rationale: Cụm này là lối diễn đạt gượng trong tiếng Việt hiện đại. “Trong hòa bình” truyền đạt sát μετ’ εἰρήνης hơn trong văn cảnh tiếp đón không thù nghịch; chú thích có thể giữ khả năng hiểu quan hệ phân từ theo thời gian.
  revised_text: Nhờ đức tin, Ra-háp, một người hành nghề mại dâm, đã không bị diệt cùng với những kẻ không vâng lời, vì bà đã tiếp đón những người do thám trong hòa bình.[a]
