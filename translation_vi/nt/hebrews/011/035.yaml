  to: Có những phụ nữ đã nhận lại những người chết của họ nhờ sự sống lại; còn những người khác chịu tra tấn[a], không chấp nhận sự phóng thích[b], để có thể đạt đến một sự sống lại tốt hơn[c].
  rationale: Sửa chính văn để không thêm ý “người thân” ngoài nguyên văn, và thay “được thả” bằng “sự phóng thích” nhằm làm rõ cú pháp của điều bị từ chối. Các chú thích được giữ đủ ba mốc, đặt đúng tại các cụm liên quan; chú thích b được điều chỉnh cho nhất quán với thuật ngữ chính văn.
