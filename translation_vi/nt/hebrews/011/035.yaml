id: HEB.11.35
reference: Hebrews 11:35
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἔλαβον γυναῖκες ἐξ ἀναστάσεως τοὺς νεκροὺς αὐτῶν· ἄλλοι δὲ ἐτυμπανίσθησαν, οὐ προσδεξάμενοι τὴν ἀπολύτρωσιν, ἵνα κρείττονος ἀναστάσεως τύχωσιν·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/035.yaml
  text: Women received back their dead by resurrection[a]; but others were tortured, not accepting release[c][b], so that they might obtain a better resurrection.
translation:
  language: vi
  text: Có những phụ nữ đã nhận lại những người chết của họ nhờ sự sống lại; còn những người khác chịu tra tấn[a], không chấp nhận sự phóng thích[b], để có thể đạt đến một sự sống lại tốt hơn[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Động từ Hy Lạp chỉ sự hành hạ thân thể dữ dội, có thể bằng cách đánh đập trên một khung hoặc dụng cụ giống mặt trống; phương thức chính xác không chắc chắn.
    reason: cultural_note
  - marker: b
    text: “Sự phóng thích” cũng có thể dịch là “sự giải thoát”; ở đây từ Hy Lạp nói đến việc được thoát khỏi tra tấn hoặc cái chết, không nhất thiết mang nghĩa cứu chuộc trong giáo lý cứu rỗi.
    reason: lexical_alternative
  - marker: c
    text: “Sự sống lại tốt hơn” tương phản với việc những người chết ở vế trước được phục hồi để trở lại đời sống hữu hạn; ở đây câu hướng đến một niềm hy vọng sống lại vượt trên cái chết.
    reason: cross_reference
lexical_decisions:
- source_word: ἔλαβον
  choice: đã nhận lại
  rationale: Trong ngữ cảnh người chết được sống lại và trở về với họ, “nhận lại” diễn đạt đúng hơn hành động được hoàn trả, thay vì chỉ “nhận”.
- source_word: γυναῖκες
  choice: những phụ nữ
  rationale: Danh từ số nhiều có nghĩa chung là “phụ nữ”; ngữ cảnh không đòi hỏi thu hẹp thành “những người vợ”.
- source_word: ἐξ ἀναστάσεως
  choice: nhờ sự sống lại
  rationale: ἐξ ở đây diễn đạt nguồn hoặc phương cách; “nhờ” tự nhiên trong tiếng Việt và cho thấy họ nhận lại người chết do sự sống lại.
- source_word: τοὺς νεκροὺς αὐτῶν
  choice: người thân đã chết của mình
  rationale: Nguyên văn là “những người chết của họ”. Thêm “người thân” làm rõ quan hệ hàm ý tự nhiên trong ngữ cảnh mà không xác định quá mức đó là con cái hay một quan hệ cụ thể khác.
- source_word: ἄλλοι δὲ
  choice: còn những người khác
  rationale: δέ đánh dấu sự tương phản giữa những người được chứng kiến sự giải cứu và những người vẫn chịu đau khổ.
- source_word: ἐτυμπανίσθησαν
  choice: chịu tra tấn
  rationale: Động từ chỉ sự hành hạ thân thể dữ dội, có thể liên quan đến đánh đập trên một dụng cụ hoặc khung; cách thức chính xác không chắc chắn nên không dịch quá cụ thể.
- source_word: οὐ προσδεξάμενοι
  choice: không chấp nhận
  rationale: Phân từ diễn tả việc họ từ chối điều được đề nghị.
- source_word: τὴν ἀπολύτρωσιν
  choice: được thả
  rationale: Trong ngữ cảnh, từ này chỉ việc được phóng thích khỏi tra tấn hoặc cái chết; “được thả” tránh áp đặt nghĩa cứu chuộc mang tính thần học.
- source_word: ἵνα
  choice: để
  rationale: Liên từ giới thiệu mục đích của việc không chấp nhận được thả.
- source_word: κρείττονος ἀναστάσεως
  choice: một sự sống lại tốt hơn
  rationale: κρείττων thường mang nghĩa “tốt hơn” trong Hê-bơ-rơ; cách dịch giữ nguyên phép so sánh của nguyên văn.
- source_word: τύχωσιν
  choice: có thể đạt đến
  rationale: τυγχάνω ở đây có nghĩa đạt được hoặc nhận được; “đạt đến” kết hợp tự nhiên với niềm hy vọng về sự sống lại.
theological_decisions:
- issue: Nghĩa của ἀπολύτρωσιν trong ngữ cảnh
  choice: sự phóng thích khỏi tra tấn hoặc cái chết trong đời này
  alternative: sự cứu chuộc theo nghĩa cứu rỗi rộng hơn
  rationale: Mạch văn nói về những người trung tín từ chối một lối thoát được đề nghị. “Được thả” giữ nghĩa tình huống và không nhập vào câu một khẳng định cứu chuộc mà ngữ cảnh không đòi hỏi.
- issue: Ý nghĩa của “sự sống lại tốt hơn”
  choice: giữ nguyên lời so sánh, đồng thời hiểu là niềm hy vọng sống lại vượt trội hơn việc tạm thời trở lại đời sống hữu hạn
  alternative: chỉ một sự sống lại thuận lợi hơn mà không liên hệ tương phản với vế trước
  rationale: Hai vế của câu tạo sự tương phản giữa người chết được sống lại để trở về đời sống hiện tại và những người chịu chết vì hướng đến một sự sống lại “tốt hơn”. Bản dịch giữ cách nói của nguyên văn, còn chú thích giải thích sự tương phản mà không định nghĩa quá mức.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “sự sống lại” để giữ thuật ngữ nhất quán ở cả hai vế; dùng “chịu tra tấn” thay vì nêu một phương thức hành hình không chắc chắn. Các dấu chú thích [a], [b], [c] đều được đặt ngay sau cụm từ liên quan trong chính văn.
