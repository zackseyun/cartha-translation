  source_fidelity: 'Bản dịch phản ánh đúng các thành tố của câu Hy Lạp: πίστει là phương tiện (“Bởi đức tin”); μέγας γενόμενος được hiểu theo ngữ cảnh là đã đến tuổi trưởng thành; ἠρνήσατο λέγεσθαι được chuyển đúng là “từ chối được gọi là”; và danh phận “con trai của con gái Pha-ra-ôn” giữ được quan hệ sở hữu trong υἱὸς θυγατρὸς Φαραώ. Đại từ “ông” chỉ nhằm làm rõ chủ ngữ trong tiếng Việt, không thêm nghĩa.'
