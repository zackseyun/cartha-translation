id: HEB.11.24
reference: Hebrews 11:24
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: πίστει Μωϋσῆς μέγας γενόμενος ἠρνήσατο λέγεσθαι υἱὸς θυγατρὸς Φαραώ,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/024.yaml
  text: By faith Moses[a], when he had grown up, refused to be called the son of Pharaoh’s daughter,
translation:
  language: vi
  text: Bởi đức tin[a], khi Môi-se đã trưởng thành, ông từ chối được gọi là con trai của con gái Pha-ra-ôn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Bởi sự thành tín” hoặc “Bởi lòng tin cậy”; tiếng Hy Lạp: πίστει. Bản văn chính theo công thức lặp lại trong chương này: “Bởi đức tin.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: πίστει
  choice: Bởi đức tin
  rationale: Dative chỉ phương tiện/căn cứ; đây là công thức lặp lại xuyên suốt Hê-bơ-rơ 11. “Bởi đức tin” tự nhiên, quen thuộc và phù hợp ngữ cảnh các hành động phát xuất từ đức tin.
- source_word: Μωϋσῆς
  choice: Môi-se
  rationale: Dạng tên riêng tiêu chuẩn, phổ biến trong tiếng Việt.
- source_word: μέγας γενόμενος
  choice: khi ... đã trưởng thành
  rationale: Cụm phân từ mang nghĩa thời gian và trong ngữ cảnh chỉ việc đạt đến tuổi trưởng thành, không phải trở nên vĩ đại về địa vị.
- source_word: ἠρνήσατο
  choice: từ chối
  rationale: Diễn tả quyết định không chấp nhận một danh phận; kết hợp tự nhiên với bổ ngữ nguyên mẫu bị động.
- source_word: λέγεσθαι
  choice: được gọi là
  rationale: Giữ đúng thể bị động và diễn đạt trực tiếp, tự nhiên trong tiếng Việt.
- source_word: υἱὸς θυγατρὸς Φαραώ
  choice: con trai của con gái Pha-ra-ôn
  rationale: Phản ánh chuỗi sở hữu của nguyên văn và danh phận cụ thể được gán cho Môi-se.
- source_word: Φαραώ
  choice: Pha-ra-ôn
  rationale: Dạng phiên âm tiêu chuẩn và dễ nhận biết trong tiếng Việt.
theological_decisions:
- issue: Cách dịch πίστις trong công thức lặp lại ở Hê-bơ-rơ 11
  choice: đức tin
  alternative: sự thành tín; lòng tin cậy
  rationale: Ngữ cảnh chương 11 nhấn mạnh những hành động được thực hiện bởi đức tin, nên “đức tin” là lựa chọn chính phù hợp nhất; các sắc thái khả hữu khác được giữ trong chú thích để không xóa bỏ độ rộng nghĩa.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “trưởng thành” thay cho cách dịch sát chữ nhưng dễ gây hiểu lầm là “trở nên vĩ đại”; thêm đại từ “ông” ở mệnh đề chính để câu tiếng Việt rõ và tự nhiên.
