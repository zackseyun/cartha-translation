  source_fidelity: 'Bản dịch phản ánh đúng cấu trúc và ý chính của nguyên văn: Πίστει được dịch “Bởi đức tin”; phân từ γεννηθείς được diễn đạt tự nhiên bằng mệnh đề thời gian; ἐκρύβη giữ được thể bị động trong “được cha mẹ giấu kín”; τρίμηνον là “trong ba tháng”; và hai lý do được nối bằng “vì ... và ...” mà không thêm diễn giải thần học. “Sắc lệnh của vua” chuyển tải chính xác τὸ διάταγμα τοῦ βασιλέως.'
