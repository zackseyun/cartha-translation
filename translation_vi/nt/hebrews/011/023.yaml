id: HEB.11.23
reference: Hebrews 11:23
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Πίστει Μωϋσῆς γεννηθεὶς ἐκρύβη τρίμηνον ὑπὸ τῶν πατέρων αὐτοῦ, διότι εἶδον ἀστεῖον τὸ παιδίον καὶ οὐκ ἐφοβήθησαν τὸ διάταγμα τοῦ βασιλέως.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/023.yaml
  text: By faith Moses[a], when he was born, was hidden for three months by his parents, because they saw that the child was beautiful, and they were not afraid of the king’s edict.
translation:
  language: vi
  text: Bởi đức tin, khi Môi-se chào đời, ông đã được cha mẹ giấu kín trong ba tháng, vì họ thấy đứa trẻ xinh đẹp[a] và không sợ sắc lệnh của vua.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “khôi ngô” hoặc “đặc biệt”; từ Hy Lạp ἀστεῖον gợi lại Xuất Ai Cập 2:2 và Công Vụ 7:20.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πίστει
  choice: Bởi đức tin
  rationale: Diễn đạt cách thức hoặc phương tiện và giữ mô-típ lặp lại xuyên suốt Hê-bơ-rơ 11.
- source_word: Μωϋσῆς
  choice: Môi-se
  rationale: Dùng dạng tên riêng quen thuộc trong tiếng Việt.
- source_word: γεννηθεὶς
  choice: khi ... chào đời
  rationale: Chuyển phân từ aorist bị động thành mệnh đề thời gian tự nhiên trong tiếng Việt.
- source_word: ἐκρύβη τρίμηνον
  choice: đã được ... giấu kín trong ba tháng
  rationale: Giữ thể bị động, đồng thời diễn đạt rõ khoảng thời gian kéo dài ba tháng.
- source_word: ὑπὸ τῶν πατέρων αὐτοῦ
  choice: được cha mẹ [ông]
  rationale: Trong ngữ cảnh này, số nhiều πατέρων chỉ cha mẹ nói chung; cách dịch này phù hợp bối cảnh Xuất Ai Cập và tiếng Việt hiện đại.
- source_word: διότι
  choice: vì
  rationale: Giới thiệu trực tiếp lý do cho hành động của cha mẹ.
- source_word: εἶδον ἀστεῖον τὸ παιδίον
  choice: họ thấy đứa trẻ xinh đẹp
  rationale: Giữ hành động quan sát cụ thể và nghĩa chính về vẻ đẹp hoặc sự tốt đẹp đáng chú ý, đồng thời không khẳng định đó là một dấu hiệu siêu nhiên.
- source_word: οὐκ ἐφοβήθησαν
  choice: không sợ
  rationale: Cách nói ngắn gọn, tự nhiên, giữ sự tương phản giữa đức tin và nỗi sợ.
- source_word: τὸ διάταγμα τοῦ βασιλέως
  choice: sắc lệnh của vua
  rationale: “Sắc lệnh” diễn tả chính xác một mệnh lệnh chính thức do nhà vua ban hành.
theological_decisions:
- issue: Động lực của cha mẹ khi giấu Môi-se
  choice: Câu dịch trình bày hành động này dưới tiêu đề “bởi đức tin”, đồng thời giữ cả việc họ thấy đứa trẻ xinh đẹp và việc họ không sợ sắc lệnh của vua.
  alternative: Có thể hiểu chỉ vẻ đẹp của đứa trẻ thúc đẩy họ, hoặc vẻ ngoài ấy là một dấu hiệu đặc biệt từ Đức Chúa Trời.
  rationale: Cấu trúc câu nêu cả sự nhận thấy về đứa trẻ lẫn việc không sợ sắc lệnh, nhưng không nói rõ vẻ đẹp ấy là dấu hiệu siêu nhiên; bản dịch không giải quyết thay sự căng thẳng này.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại, dễ hiểu. Cấu trúc bị động “đã được cha mẹ giấu kín” giữ quan hệ ngữ pháp của nguyên văn; “chào đời” tự nhiên hơn “được sinh ra” trong ngữ cảnh này.
