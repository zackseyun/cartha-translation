  text: τοῦ θεοῦ περὶ ἡμῶν κρεῖττόν τι προβλεψαμένου, ἵνα μὴ χωρὶς ἡμῶν τελειωθῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/040.yaml
  text: since God had provided something better for us[b][a], so that they would not be made perfect apart from us.
translation:
  language: vi
  text: vì Đức Chúa Trời đã dự liệu một điều tốt hơn cho chúng ta[a], để họ không được làm cho trọn vẹn nếu không có chúng ta[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đã thấy trước một điều tốt hơn cho chúng ta.” Phân từ Hy Lạp có thể gợi ý việc thấy trước hoặc dự liệu trước; ngữ cảnh thiên về ý Đức Chúa Trời đã dự liệu và sắp đặt.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “để họ không được làm cho trọn vẹn tách khỏi chúng ta” hoặc “để họ không đạt đến sự hoàn tất nếu không có chúng ta.”'
    reason: alternative_reading
lexical_decisions:
- source_word: προβλεψαμένου
  choice: đã chuẩn bị
  rationale: Trong ngữ cảnh, phân từ này không chỉ nói đến việc biết trước mà còn hàm ý Đức Chúa Trời đã dự liệu và sắp đặt trước. “Đã chuẩn bị” diễn đạt tự nhiên ý provision/design, trong khi chú thích giữ lại khả năng “đã thấy trước”.
- source_word: κρεῖττόν τι
  choice: một điều tốt hơn
  rationale: Giữ từ khóa so sánh “tốt hơn” được lặp lại trong thư Hê-bơ-rơ, đồng thời chuyển τι bằng “một điều” một cách tự nhiên.
- source_word: περὶ ἡμῶν
  choice: cho chúng ta
  rationale: Trong kết cấu với προβλεψαμένου, cụm này tự nhiên nhất khi chỉ điều Đức Chúa Trời dự liệu vì lợi ích của và có chúng ta trong tầm nhìn.
- source_word: ἵνα μὴ
  choice: để ... không
  rationale: Giữ sắc thái mục đích hoặc kết quả của mệnh đề Hy Lạp bằng một kết cấu tiếng Việt gọn và tự nhiên.
- source_word: χωρὶς ἡμῶν
  choice: nếu không có chúng ta
  rationale: Diễn đạt rõ ý những người đi trước không đạt sự trọn vẹn tách biệt khỏi cộng đồng những người đến sau; chú thích cung cấp cách dịch sát cấu trúc hơn.
- source_word: τελειωθῶσιν
  choice: được làm cho trọn vẹn
  rationale: Giữ thể bị động và trường nghĩa kép về sự hoàn tất lẫn sự hoàn hảo trong thư Hê-bơ-rơ, không thu hẹp thành sự hoàn thiện đạo đức đơn thuần.
- source_word: τοῦ θεοῦ
  choice: Đức Chúa Trời
  rationale: Chủ thể của kết cấu sở hữu cách tuyệt đối được diễn đạt thành mệnh đề nguyên nhân tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Ý nghĩa của τελειωθῶσιν trong bối cảnh lịch sử cứu chuộc của thư Hê-bơ-rơ
  choice: được làm cho trọn vẹn
  alternative: được đưa đến chỗ hoàn tất; đạt đến sự viên mãn
  rationale: Cách dịch chính giữ được sức nặng thần học liên quan đến sự hoàn tất, sự toàn vẹn và sự ứng nghiệm, thay vì chỉ quyết định theo nghĩa hoàn thiện đạo đức hay hoàn thành theo thời gian.
- issue: Mối liên hệ giữa những người tin thời trước và “chúng ta”
  choice: không có chúng ta
  alternative: tách khỏi chúng ta
  rationale: Giữ nguyên khẳng định mang tính cộng đồng rằng sự trọn vẹn của họ không diễn ra biệt lập với chúng ta, nhưng không giải thích thêm cơ chế hay hệ thống thần học cụ thể.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. “Được làm cho trọn vẹn” giữ sắc thái thần học phong phú của τελειόω; “một điều tốt hơn” duy trì chủ đề xuyên suốt của thư Hê-bơ-rơ. Các dấu chú thích đều xuất hiện trong chính văn và đặt ngay sau cụm từ liên quan.
