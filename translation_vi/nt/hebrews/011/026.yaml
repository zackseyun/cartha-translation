id: HEB.11.26
reference: Hebrews 11:26
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: μείζονα πλοῦτον ἡγησάμενος τῶν Αἰγύπτου θησαυρῶν τὸν ὀνειδισμὸν τοῦ Χριστοῦ, ἀπέβλεπεν γὰρ εἰς τὴν μισθαποδοσίαν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/026.yaml
  text: He considered the reproach of Messiah greater wealth than the treasures of Egypt[b][a], for he was looking to the reward.
translation:
  language: vi
  text: Ông coi sự sỉ nhục của Đấng Mê-si[a] quý hơn các kho báu của Ai Cập, vì ông vẫn hướng mắt về phần thưởng.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “Đấng Christ”. Cụm “sự sỉ nhục của Đấng Mê-si” có thể chỉ sự sỉ nhục phải chịu vì Đấng Mê-si, sự sỉ nhục được chia sẻ với Đấng được Đức Chúa Trời xức dầu, hoặc sự sỉ nhục mà thư Hê-bơ-rơ nhìn nhận là được ứng nghiệm nơi Đấng Mê-si; nguyên văn Hy Lạp không xác định hẹp theo một cách hiểu duy nhất.
    reason: alternative_reading
lexical_decisions:
- source_word: μείζονα πλοῦτον
  choice: của cải lớn hơn
  rationale: Giữ phép so sánh về giá trị với các kho báu của Ai Cập; cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: ἡγησάμενος
  choice: ông coi
  rationale: Diễn đạt ý đánh giá, xem là; chuyển phân từ sang động từ hữu hạn để câu tiếng Việt rõ và tự nhiên.
- source_word: τῶν Αἰγύπτου θησαυρῶν
  choice: các kho báu của Ai Cập
  rationale: Phản ánh trực tiếp kết cấu sở hữu trong tiếng Hy Lạp và giữ sự tương phản với điều Môi-se từ bỏ.
- source_word: τὸν ὀνειδισμὸν
  choice: sự sỉ nhục
  rationale: Bao hàm cả sự lăng nhục và nỗi nhục phải chịu công khai, đồng thời phù hợp với văn phong Kinh Thánh hiện đại.
- source_word: τοῦ Χριστοῦ
  choice: của Đấng Mê-si
  rationale: Χριστός ở đây mang chức năng tước hiệu. Cụm sở hữu được giữ nguyên để không thu hẹp mối liên hệ thần học còn có thể hiểu theo nhiều cách.
- source_word: ἀπέβλεπεν
  choice: ông hướng mắt về
  rationale: Thì chưa hoàn thành diễn tả sự chú tâm liên tục; cách nói này giữ hình ảnh định hướng bền bỉ mà vẫn tự nhiên.
- source_word: μισθαποδοσίαν
  choice: phần thưởng
  rationale: Truyền đạt rõ nghĩa phần báo đáp hay phần thưởng trong bối cảnh đức tin và sự bền đỗ.
theological_decisions:
- issue: Ý nghĩa của “sự sỉ nhục của Đấng Mê-si” trong mối liên hệ với Môi-se
  choice: Giữ nguyên cụm sở hữu “sự sỉ nhục của Đấng Mê-si” mà không diễn giải thêm trong chính văn.
  alternative: “sự sỉ nhục vì Đấng Mê-si”, “sự sỉ nhục cùng chịu với Đấng được xức dầu của Đức Chúa Trời”, hoặc “sự sỉ nhục báo trước Đấng Mê-si”
  rationale: Cú pháp Hy Lạp không tự xác định duy nhất mối quan hệ của sở hữu cách. Giữ cấu trúc này bảo tồn tính hàm hồ thật sự và sức căng Kitô học của thư Hê-bơ-rơ.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “Đấng Mê-si” như một tước hiệu; giữ đại từ “ông” theo mạch nói về Môi-se. “Hướng mắt về” bảo tồn sắc thái chú tâm liên tục của động từ Hy Lạp.
