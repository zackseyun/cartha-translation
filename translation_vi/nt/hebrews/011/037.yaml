  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐλιθάσθησαν, ⸀ἐπρίσθησαν, ἐν φόνῳ ⸀μαχαίρης ἀπέθανον, περιῆλθον ἐν μηλωταῖς, ἐν αἰγείοις δέρμασιν, ὑστερούμενοι, θλιβόμενοι, κακουχούμενοι,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/037.yaml
  text: They were stoned[a], they were sawn in two, they died by the sword; they went about in sheepskins, in goatskins, destitute, afflicted, mistreated—
translation:
  language: vi
  text: Họ bị ném đá, bị cưa làm đôi, bị giết bằng gươm; họ lang thang, mặc da cừu và da dê, thiếu thốn, bị áp bức, bị ngược đãi—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλιθάσθησαν
  choice: bị ném đá
  rationale: Dạng thụ động chỉ việc chịu hình phạt ném đá; không thêm ý 'đến chết' vì động từ tự nó không nói rõ kết quả.
- source_word: ἐπρίσθησαν
  choice: bị cưa làm đôi
  rationale: Diễn đạt tự nhiên trong tiếng Việt và giữ nghĩa truyền thống, phù hợp ngữ cảnh liệt kê các cực hình.
- source_word: ἐν φόνῳ μαχαίρης ἀπέθανον
  choice: bị giết bằng gươm
  rationale: Cụm tiếng Việt truyền đạt cái chết bạo lực do gươm gây ra và giữ sức nặng của φόνος tự nhiên hơn cách dịch sát chữ khó hiểu như 'chết trong sự giết chóc của gươm'.
- source_word: περιῆλθον
  choice: lang thang
  rationale: Trong ngữ cảnh khốn khó và không nơi nương tựa, từ này diễn tả việc đi hết nơi này đến nơi khác; 'lang thang' tự nhiên và phù hợp hơn 'đi đây đó'.
- source_word: ἐν μηλωταῖς, ἐν αἰγείοις δέρμασιν
  choice: trong những tấm da cừu, da dê
  rationale: Giữ hình ảnh cụ thể về những tấm da được dùng làm y phục, đồng thời bảo toàn cấu trúc song song.
- source_word: ὑστερούμενοι
  choice: thiếu thốn
  rationale: Diễn tả tình trạng thiếu các nhu yếu phẩm mà không thu hẹp quá mức thành một loại nghèo khó cụ thể.
- source_word: θλιβόμενοι
  choice: bị áp bức
  rationale: Giữ sắc thái bị dồn ép do tác động từ bên ngoài và phân biệt với từ kế tiếp chỉ sự ngược đãi.
- source_word: κακουχούμενοι
  choice: bị ngược đãi
  rationale: Cách nói hiện đại, rõ ràng cho việc bị đối xử tàn tệ.
theological_decisions:
- issue: Mức độ thể hiện sắc thái bạo lực trong ἐν φόνῳ μαχαίρης
  choice: bị giết bằng gươm
  alternative: chết vì gươm
  rationale: φόνος làm cụm từ mạnh hơn cách nói đơn thuần 'chết vì gươm'. Dịch 'bị giết' truyền đạt bạo lực và tác nhân hàm ẩn mà vẫn tự nhiên trong tiếng Việt; đây không phải là sự xác quyết thêm về một giáo lý.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Dấu chấm phẩy phân chia các kiểu hành hình với cảnh sống lưu lạc; dấu gạch ngang cuối câu giữ sự tiếp nối sang câu kế tiếp.
