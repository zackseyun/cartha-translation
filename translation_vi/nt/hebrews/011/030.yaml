  text: πίστει τὰ τείχη Ἰεριχὼ ⸀ἔπεσαν κυκλωθέντα ἐπὶ ἑπτὰ ἡμέρας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/030.yaml
  text: By faith the walls of Jericho fell after they had been encircled for seven days[a].
translation:
  language: vi
  text: Bởi đức tin, các tường thành Giê-ri-cô đã sụp đổ sau khi bị vây quanh suốt bảy ngày.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Nhờ đức tin.” Từ πίστει ở tặng cách trong tiếng Hy Lạp có thể diễn tả phương tiện hoặc cách thức; bản văn chính giữ công thức lặp lại quen thuộc trong Hê-bơ-rơ 11.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πίστει
  choice: Bởi đức tin
  rationale: Cách ngữ ở dạng tặng cách có thể chỉ phương tiện hoặc cách thức. “Bởi đức tin” giữ nhịp điệp ngữ đặc trưng của Hê-bơ-rơ 11 và không xác định quá mức sắc thái ngữ pháp.
- source_word: τὰ τείχη Ἰεριχὼ
  choice: các tường thành Giê-ri-cô
  rationale: τεῖχος chỉ tường, đặc biệt là tường bảo vệ một thành. “Tường thành” tự nhiên và chính xác trong ngữ cảnh; Ἰεριχώ được phiên âm theo cách gọi quen thuộc trong tiếng Việt.
- source_word: ἔπεσαν
  choice: đã sụp đổ
  rationale: πίπτω có nghĩa cơ bản là “ngã, đổ”. Với tường thành, “sụp đổ” là cách diễn đạt tự nhiên trong tiếng Việt mà vẫn sát hành động được mô tả.
- source_word: κυκλωθέντα
  choice: sau khi bị đi vòng quanh
  rationale: Phân từ aorist bị động của κυκλόω mô tả các tường thành là đối tượng được vây quanh hoặc đi vòng quanh, với hành động xảy ra trước động từ chính. Cách dịch này giữ thể bị động và phù hợp sự kiện được nhắc đến mà không nêu thêm chủ thể.
- source_word: ἐπὶ ἑπτὰ ἡμέρας
  choice: trong bảy ngày
  rationale: ἐπί với đối cách trong cụm thời gian diễn tả khoảng thời gian kéo dài. “Trong bảy ngày” là cách nói tự nhiên và không hàm ý rằng việc đi vòng quanh diễn ra liên tục không ngừng.
theological_decisions:
- issue: Cách dịch πίστις trong Hê-bơ-rơ 11:30
  choice: đức tin
  alternative: lòng tin; sự tin cậy; sự trung tín
  rationale: Điệp ngữ của Hê-bơ-rơ 11 và ngữ cảnh các nhân vật hành động trong sự tin cậy ủng hộ “đức tin”. Cách dịch này cũng duy trì thuật ngữ thần học quen thuộc mà không biến πίστις thành “sự trung tín”, một nghĩa kém phù hợp hơn tại đây.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Bởi đức tin” được chọn để giữ nhịp công thức của cả chương; “tường thành” và “sụp đổ” là cách kết hợp từ tự nhiên trong tiếng Việt.
