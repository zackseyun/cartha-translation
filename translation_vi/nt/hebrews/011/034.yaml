- from: dập tắt sức mạnh của lửa, thoát khỏi lưỡi gươm[a], được làm cho mạnh mẽ từ chỗ yếu đuối, trở nên dũng mãnh trong chiến trận, khiến các đạo quân ngoại bang tháo chạy[b].
  to: dập tắt uy lực của lửa, thoát khỏi lưỡi gươm[a], được làm cho mạnh mẽ từ tình trạng yếu đuối, trở nên hùng mạnh trong chiến trận, khiến các đạo quân ngoại bang[b] tháo chạy.
  rationale: Bản sửa giữ nguyên ý nghĩa và cấu trúc liệt kê của nguyên ngữ, nhưng dùng các cách diễn đạt tự nhiên hơn trong tiếng Việt. «Uy lực» diễn đạt δύναμις πυρός mà không giản lược thành chỉ «lửa»; «hùng mạnh» dịch ἰσχυροί mà không thêm sắc thái can đảm. Chú thích b được đặt đúng cụm từ mà nó giải thích.
