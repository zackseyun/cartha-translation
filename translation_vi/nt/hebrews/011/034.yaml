  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἔσβεσαν δύναμιν πυρός, ἔφυγον στόματα ⸀μαχαίρης, ⸀ἐδυναμώθησαν ἀπὸ ἀσθενείας, ἐγενήθησαν ἰσχυροὶ ἐν πολέμῳ, παρεμβολὰς ἔκλιναν ἀλλοτρίων·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/034.yaml
  text: quenched the power of fire[a], escaped the edge of the sword, were made strong out of weakness, became mighty in battle[b], put foreign armies to flight.
translation:
  language: vi
  text: dập tắt uy lực của lửa, thoát khỏi lưỡi gươm[a], được làm cho mạnh mẽ từ tình trạng yếu đuối, trở nên hùng mạnh trong chiến trận, khiến các đạo quân ngoại bang[b] tháo chạy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn là “miệng của gươm”, một thành ngữ chỉ lưỡi sắc của gươm.
    reason: lexical_alternative
  - marker: b
    text: Từ Hy Lạp cũng có thể dịch là “trại quân” hoặc “doanh trại”; tại đây nó chỉ các lực lượng quân sự đóng trại.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔσβεσαν
  choice: dập tắt
  rationale: Động từ σβέννυμι chỉ việc làm tắt hoặc dập tắt; cách dịch này giữ được hình ảnh cụ thể và mạnh mẽ của nguyên văn.
- source_word: δύναμιν πυρός
  choice: sức mạnh của lửa
  rationale: Giữ lại danh từ δύναμις thay vì giản lược thành chỉ ‘lửa’, qua đó diễn đạt sức hủy diệt hay tác động của lửa.
- source_word: ἔφυγον
  choice: thoát khỏi
  rationale: Trong kết hợp với hình ảnh lưỡi gươm, động từ nói đến việc thoát nạn thành công, không chỉ đơn thuần là bỏ chạy.
- source_word: στόματα μαχαίρης
  choice: lưỡi gươm
  rationale: Nghĩa đen là ‘miệng của gươm’, nhưng đây là thành ngữ chỉ phần sắc bén của gươm; ‘lưỡi gươm’ là cách nói tự nhiên tương ứng trong tiếng Việt.
- source_word: ἐδυναμώθησαν
  choice: được làm cho mạnh mẽ
  rationale: 'Giữ sắc thái bị động của động từ: sức mạnh được ban hoặc được nhận, chứ không nhất thiết tự phát sinh.'
- source_word: ἀπὸ ἀσθενείας
  choice: từ chỗ yếu đuối
  rationale: 'Diễn đạt ἀπό như điểm xuất phát: họ đi từ tình trạng yếu đuối đến chỗ được làm cho mạnh mẽ.'
- source_word: ἐγενήθησαν ἰσχυροὶ
  choice: trở nên dũng mãnh
  rationale: Diễn đạt sự chuyển sang trạng thái mạnh mẽ; ‘dũng mãnh’ phù hợp ngữ cảnh quân sự và tránh lặp từ với mệnh đề trước.
- source_word: ἐν πολέμῳ
  choice: trong chiến trận
  rationale: Trong chuỗi hành động cụ thể này, ‘chiến trận’ tự nhiên và trực tiếp hơn nghĩa rộng ‘chiến tranh’.
- source_word: παρεμβολὰς
  choice: các đạo quân
  rationale: Danh từ có nghĩa gốc là trại hoặc doanh trại, nhưng trong ngữ cảnh quân sự có thể hoán dụ cho lực lượng đóng trại, tức quân đội.
- source_word: ἔκλιναν
  choice: khiến ... tháo chạy
  rationale: κλίνω mang nghĩa làm cho quay đi hoặc lui lại; trong chiến trận, cụm này diễn đạt việc buộc quân địch phải tháo chạy mà không phóng đại thành tiêu diệt hoàn toàn.
- source_word: ἀλλοτρίων
  choice: ngoại bang
  rationale: Tính từ chỉ những người thuộc dân khác hay từ bên ngoài; kết hợp với ‘đạo quân’, ‘ngoại bang’ vừa rõ nghĩa vừa phù hợp văn phong trang trọng.
theological_decisions:
- issue: Mức độ cụ thể của chuỗi hình ảnh về giải cứu và chiến thắng bởi đức tin
  choice: Giữ nguyên các hình ảnh lịch sử và quân sự cụ thể
  alternative: Khái quát hóa thành sự chiến thắng hiểm nguy và kẻ thù về mặt thuộc linh
  rationale: Nguyên văn liệt kê lửa, gươm, sự yếu đuối, chiến trận và quân ngoại bang; bản dịch không thuộc linh hóa hoặc áp đặt một cách giải thích hệ phái lên các hình ảnh này.
- issue: Sắc thái bị động của ἐδυναμώθησαν
  choice: ‘được làm cho mạnh mẽ’
  alternative: ‘trở nên mạnh mẽ’
  rationale: Cách dịch được chọn bảo tồn hình thái bị động và để ngỏ tác nhân, không tự ý xác định rõ ai đã làm cho họ mạnh mẽ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Nhịp câu song song được giữ theo chuỗi động từ aorist của nguyên văn. Các dấu chú thích được đặt ngay sau cụm từ thực sự liên quan, sửa vị trí dấu chú thích bị lệch trong lớp tham khảo tiếng Anh.
