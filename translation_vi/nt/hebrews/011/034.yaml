  - severity: low
    issue: Cụm «được làm cho mạnh mẽ từ chỗ yếu đuối» chưa thật tự nhiên.
    rationale: «Từ tình trạng yếu đuối» diễn đạt rõ và tự nhiên hơn sự chuyển xuất phát từ yếu đuối, đồng thời giữ thể bị động của ἐδυναμώθησαν.
