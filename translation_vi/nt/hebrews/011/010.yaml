source:
  edition: SBLGNT
  text: ἐξεδέχετο γὰρ τὴν τοὺς θεμελίους ἔχουσαν πόλιν, ἧς τεχνίτης καὶ δημιουργὸς ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/010.yaml
  text: For he was waiting for the city that has foundations[b][a], whose architect and builder is God.
translation:
  language: vi
  text: Vì ông trông đợi thành có các nền móng[a], mà Đức Chúa Trời là kiến trúc sư và người xây dựng[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “thành có những nền móng.” Số nhiều có thể nhấn mạnh sự vững chắc và lâu bền.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “Đức Chúa Trời là người thiết kế và người kiến tạo.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξεδέχετο
  choice: trông đợi
  rationale: Thì chưa hoàn thành diễn tả sự mong đợi liên tục trong quá khứ; “trông đợi” tự nhiên trong tiếng Việt và bao hàm cả chờ đợi lẫn kỳ vọng.
- source_word: γὰρ
  choice: Vì
  rationale: Giữ chức năng giải thích, nối câu này với việc Áp-ra-ham sống tạm trú trong câu trước.
- source_word: τὴν τοὺς θεμελίους ἔχουσαν πόλιν
  choice: thành có các nền móng
  rationale: Giữ cấu trúc mô tả và số nhiều “các nền móng,” đồng thời dùng cách nói ngắn gọn, trang trọng trong tiếng Việt.
- source_word: θεμελίους
  choice: các nền móng
  rationale: Bảo toàn số nhiều của nguyên văn, có thể gợi sự vững chắc và lâu bền, đối lập với lều tạm trong văn cảnh.
- source_word: πόλιν
  choice: thành
  rationale: “Thành” là cách dùng Kinh Thánh trang trọng nhưng vẫn dễ hiểu, phù hợp với hình ảnh đô thị trong thư Hê-bơ-rơ.
- source_word: τεχνίτης
  choice: Đấng thiết kế
  rationale: Trong cặp với δημιουργός, lựa chọn này làm nổi bật vai trò hoạch định và phân biệt với vai trò xây dựng.
- source_word: δημιουργός
  choice: Đấng xây dựng
  rationale: Phù hợp trực tiếp với hình ảnh một thành và bổ sung tự nhiên cho “Đấng thiết kế.”
- source_word: ὁ θεός
  choice: Đức Chúa Trời
  rationale: Danh xưng tiếng Việt trang trọng, phổ thông cho θεός khi chỉ Đức Chúa Trời.
theological_decisions:
- issue: Bản chất của thành được trông đợi
  choice: “thành có các nền móng”
  alternative: “thành trên trời” hoặc “thành có nền móng vĩnh cửu”
  rationale: Câu này không trực tiếp gọi thành ấy là thành trên trời hay thêm tính từ “vĩnh cửu”; bản dịch giữ nguyên hình ảnh và không giải quyết thay cho độc giả sự nhận diện thần học được khai triển trong văn cảnh rộng hơn.
- issue: Quan hệ giữa τεχνίτης và δημιουργός
  choice: “Đấng thiết kế và xây dựng”
  alternative: “nghệ nhân và Đấng tạo dựng”
  rationale: Cách dịch đã chọn giữ hai vai trò phân biệt trong phép ẩn dụ xây thành mà không biến câu này thành một tuyên bố khái quát hơn về sự sáng tạo.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “thành” để phù hợp sắc thái Kinh Thánh; giữ số nhiều “các nền móng.” Các dấu chú thích [a], [b] đều xuất hiện trong chính văn và được đặt ngay sau cụm từ liên quan.
