- from: Vì ông trông đợi thành có các nền móng[a], mà Đức Chúa Trời là Đấng thiết kế và xây dựng[b].
  to: Vì ông trông đợi thành có các nền móng[a], mà Đức Chúa Trời là kiến trúc sư và người xây dựng[b].
  rationale: Chỉnh sửa chỉ nhằm làm rõ hai danh từ chỉ vai trò trong nguyên văn và giữ hình ảnh xây dựng của câu. Không thêm nhận diện thần học nào cho «thành», đồng thời vẫn bảo toàn số nhiều «các nền móng» và các neo chú thích.
