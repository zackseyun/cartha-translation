id: HEB.11.16
reference: Hebrews 11:16
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: νῦν δὲ κρείττονος ὀρέγονται, τοῦτ’ ἔστιν ἐπουρανίου. διὸ οὐκ ἐπαισχύνεται αὐτοὺς ὁ θεὸς θεὸς ἐπικαλεῖσθαι αὐτῶν, ἡτοίμασεν γὰρ αὐτοῖς πόλιν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/016.yaml
  text: But as it is[a], they long for a better country—that is, a heavenly one. Therefore God is not ashamed to be called their God, for he has prepared a city for them.
translation:
  language: vi
  text: Nhưng thực ra, họ khao khát một quê hương tốt đẹp hơn[a], tức là quê hương trên trời. Vì thế, Đức Chúa Trời không hổ thẹn khi được gọi là Đức Chúa Trời của họ, bởi Ngài đã chuẩn bị cho họ một thành.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “một xứ tốt đẹp hơn”. Trong tiếng Hy Lạp, danh từ không được viết ra nhưng được hiểu theo ý “quê hương” ở văn cảnh trước.
    reason: lexical_alternative
lexical_decisions:
- source_word: νῦν δὲ
  choice: Nhưng thực ra
  rationale: Cụm từ chuyển ý, đối lập thực trạng với giả định ở câu trước; cách dịch này tự nhiên hơn cách hiểu thuần túy theo thời gian là “nhưng bây giờ”.
- source_word: κρείττονος
  choice: tốt đẹp hơn
  rationale: Diễn đạt sắc thái so sánh “tốt hơn, ưu việt hơn” bằng tiếng Việt tự nhiên, đồng thời phù hợp với từ vựng tương phản thường gặp trong thư Hê-bơ-rơ.
- source_word: ὀρέγονται
  choice: khao khát
  rationale: Động từ chỉ lòng mong muốn tha thiết và hướng tới một điều; “khao khát” giữ được cả cường độ tình cảm lẫn ý hướng vươn tới.
- source_word: κρείττονος ... ἐπουρανίου
  choice: một quê hương tốt đẹp hơn, tức là quê hương trên trời
  rationale: Hai tính từ giống cái ở dạng sở hữu hàm ý danh từ πατρίς trong văn cảnh trước. Lặp lại “quê hương” giúp câu tiếng Việt rõ nghĩa mà không giải thích quá mức.
- source_word: διὸ
  choice: Vì thế
  rationale: Nêu kết luận phát xuất từ lòng khao khát quê hương trên trời của họ.
- source_word: οὐκ ἐπαισχύνεται
  choice: không hổ thẹn
  rationale: Giữ trực tiếp ý nghĩa về sự hổ thẹn và sắc thái danh dự trong mối quan hệ giao ước.
- source_word: θεὸς ἐπικαλεῖσθαι αὐτῶν
  choice: khi được gọi là Đức Chúa Trời của họ
  rationale: Diễn đạt tự nhiên cấu trúc chỉ việc được xưng gọi, đồng thời giữ nguyên công thức quan hệ “Đức Chúa Trời của họ”.
- source_word: ἡτοίμασεν
  choice: đã chuẩn bị
  rationale: Thể bất định chỉ hành động đã hoàn tất; “đã chuẩn bị” giữ ý về sự sắm sẵn của Đức Chúa Trời.
- source_word: πόλιν
  choice: một thành
  rationale: Giữ hình ảnh cụ thể và mang tính cánh chung của nguyên văn; danh từ không có mạo từ được diễn đạt tự nhiên bằng “một thành”.
theological_decisions:
- issue: Danh từ được hàm ý sau κρείττονος và ἐπουρανίου
  choice: Bổ sung “quê hương” theo πατρίς trong văn cảnh gần
  alternative: “một xứ tốt đẹp hơn” hoặc “điều tốt đẹp hơn, tức là điều thuộc trời”
  rationale: Giống cái của các tính từ và văn cảnh cho thấy πατρίς là ý niệm được tiếp nối. “Quê hương” vừa rõ ràng vừa giữ sắc thái nơi chốn thuộc về, nhưng chú thích ghi nhận phương án ít cảm xúc hơn là “xứ”.
- issue: Công thức quan hệ trong θεὸς ... αὐτῶν
  choice: Giữ nguyên “Đức Chúa Trời của họ”
  alternative: Diễn giải thành “nhìn nhận họ là dân Ngài”
  rationale: Nguyên văn nói cụ thể về danh xưng của Đức Chúa Trời; mở rộng thành lời xác nhận họ là dân Ngài sẽ đưa thêm ý không được phát biểu trực tiếp.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “Đức Chúa Trời” và đại từ tôn kính “Ngài”; giữ câu văn gọn, hình ảnh “quê hương trên trời” và “một thành” mà không đồng nhất hoặc giải thích thêm hai hình ảnh này.
