  source_fidelity: Bản dịch truyền đạt đúng mạch lập luận của νῦν δὲ như một sự đối chiếu với giả định ở câu trước; giữ được κρείττονος/ὀρέγονται là lòng khao khát một quê hương tốt hơn, xác định là thuộc trời. Công thức “Đức Chúa Trời của họ” phản ánh chính xác θεὸς ... αὐτῶν, và “đã chuẩn bị cho họ một thành” giữ được hành động hoàn tất cùng hình ảnh πόλις mà không đồng nhất hai hình ảnh quê hương và thành.
  naturalness: Câu văn tự nhiên, trang trọng và phù hợp tiếng Việt hiện đại. “Nhưng thực ra,”, “Vì thế,” và cách dùng đại từ “Ngài” tạo liên kết rõ ràng. “Một thành” là cách gọi Kinh Thánh đã ổn định và vẫn dễ hiểu trong văn cảnh này.
  terminology: “Đức Chúa Trời,” “quê hương trên trời,” và “một thành” nhất quán với văn phong Kinh Thánh Việt ngữ. “Tốt đẹp hơn” là một cách diễn đạt chấp nhận được cho κρείττονος, dù “tốt hơn” cũng có thể sát hơn; bản hiện tại không làm thay đổi nghĩa. Chú thích a nêu đúng tính chất hàm ý của danh từ và phương án từ vựng thay thế.
