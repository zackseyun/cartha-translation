  terminology: Các tên riêng dùng dạng phiên âm Kinh Thánh Việt ngữ quen thuộc và nhất quán. “Các nhà tiên tri” là cách gọi chuẩn, dễ hiểu cho τῶν προφητῶν. Chú thích được gắn đúng vị trí và nêu một khả năng dịch sát hợp lệ.
