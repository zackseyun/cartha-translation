  source_fidelity: 'Bản dịch giữ đúng câu hỏi tu từ Καὶ τί ἔτι λέγω; và diễn đạt tự nhiên cấu trúc giả định với ἐπιλείψει ... διηγούμενον: thời gian sẽ không đủ nếu tác giả tiếp tục thuật kể. Danh sách nhân vật, giới từ chỉ đề tài “về”, và nhóm “các nhà tiên tri” đều phản ánh nguyên văn. “Rồi cả” truyền đạt được phần nào sắc thái thêm vào của τε καὶ mà không áp đặt cách phân loại thần học.'
