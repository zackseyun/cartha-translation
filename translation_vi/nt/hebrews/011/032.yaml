id: HEB.11.32
reference: Hebrews 11:32
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Καὶ τί ἔτι λέγω; ἐπιλείψει ⸂με γὰρ⸃ διηγούμενον ὁ χρόνος περὶ Γεδεών, Βαράκ, ⸀Σαμψών, Ἰεφθάε, Δαυίδ τε καὶ Σαμουὴλ καὶ τῶν προφητῶν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/032.yaml
  text: And what more shall I say? For time would fail me if I were telling about Gideon[a], Barak, Samson, Jephthah, David, and also Samuel and the prophets,
translation:
  language: vi
  text: Tôi còn nói gì nữa đây? Vì nếu tôi cứ kể về Ghê-đê-ôn, Ba-rác, Sam-sôn, Giép-thê, Đa-vít, rồi cả Sa-mu-ên và các nhà tiên tri, thì thời gian sẽ không đủ cho tôi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát hơn: “Vì thời gian sẽ không đủ cho tôi khi kể về...”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ τί ἔτι λέγω;
  choice: Tôi còn nói gì nữa đây?
  rationale: Câu hỏi tu từ chuyển sang các ví dụ tiếp theo; cách diễn đạt này tự nhiên trong tiếng Việt hiện đại và giữ được sức thúc đẩy của lời văn.
- source_word: ἐπιλείψει με γὰρ ... ὁ χρόνος
  choice: thì thời gian sẽ không đủ cho tôi
  rationale: Giữ thì tương lai của động từ Hy Lạp nhưng diễn đạt bằng thành ngữ tiếng Việt tự nhiên, cho thấy thời gian sẽ cạn trước khi người viết kể xong.
- source_word: διηγούμενον
  choice: nếu tôi cứ kể
  rationale: Phân từ hiện tại chỉ hành động đang tiếp diễn trong hoàn cảnh giả định; từ “cứ” truyền đạt ý kể lần lượt và kéo dài.
- source_word: περὶ
  choice: về
  rationale: Giới từ giới thiệu chủ đề của việc thuật kể; “về” là tương đương tự nhiên, gọn rõ.
- source_word: Γεδεών, Βαράκ, Σαμψών, Ἰεφθάε, Δαυίδ, Σαμουὴλ
  choice: Ghê-đê-ôn, Ba-rác, Sam-sôn, Giép-thê, Đa-vít, Sa-mu-ên
  rationale: Dùng dạng phiên âm Kinh Thánh quen thuộc, dễ nhận biết trong tiếng Việt.
- source_word: τε καὶ
  choice: rồi cả
  rationale: Thể hiện sắc thái bổ sung khi chuyển từ Đa-vít sang Sa-mu-ên, mà không tạo ra một sự phân nhóm thần học quá mức.
- source_word: τῶν προφητῶν
  choice: các nhà tiên tri
  rationale: Cách gọi thông dụng, trang trọng và dễ hiểu trong tiếng Việt hiện đại.
theological_decisions:
- issue: Sức tu từ của lời nói về thời gian
  choice: Diễn đạt là thời gian sẽ không đủ nếu người viết tiếp tục kể chi tiết.
  alternative: 'Dịch sát hơn: “vì thời gian sẽ bỏ tôi lại khi tôi kể...”'
  rationale: Cấu trúc Hy Lạp là một lối nói tu từ nhằm báo hiệu sự tóm lược, chứ không khẳng định theo nghĩa đen rằng tác giả hoàn toàn không còn thời gian.
- issue: Cách nối Đa-vít, Sa-mu-ên và các nhà tiên tri
  choice: “Đa-vít, rồi cả Sa-mu-ên và các nhà tiên tri”
  alternative: “Đa-vít, Sa-mu-ên và các nhà tiên tri”
  rationale: Giữ sắc thái bổ sung của τε καὶ, đồng thời không quyết định quá mức rằng Sa-mu-ên thuộc hay không thuộc nhóm các nhà tiên tri trong cú pháp này.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ đọc. Câu được sắp xếp theo trật tự tiếng Việt tự nhiên; giữ câu hỏi tu từ, sắc thái giả định-tiếp diễn và phép nối bổ sung của nguyên văn.
