source:
  edition: SBLGNT
  text: μᾶλλον ἑλόμενος συγκακουχεῖσθαι τῷ λαῷ τοῦ θεοῦ ἢ πρόσκαιρον ἔχειν ἁμαρτίας ἀπόλαυσιν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/025.yaml
  text: choosing rather to be mistreated with the people of God than to have the temporary enjoyment of sin,[a]
translation:
  language: vi
  text: chọn cùng chịu ngược đãi với dân Đức Chúa Trời hơn là hưởng thú vui tạm thời của tội lỗi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “thú vui chóng qua của tội lỗi.”'
    reason: 'Ghi nhận sắc thái từ vựng khác của πρόσκαιρον: ngắn ngủi, chóng qua.'
lexical_decisions:
- source_word: μᾶλλον ἑλόμενος
  choice: thà chọn
  rationale: Diễn đạt tự nhiên sự lựa chọn có chủ ý và thế so sánh ưu tiên do phân từ ἑλόμενος cùng trạng từ μᾶλλον tạo nên.
- source_word: συγκακουχεῖσθαι
  choice: cùng chịu ngược đãi
  rationale: Giữ cả ý chịu sự đối xử tồi tệ và ý liên đới, cùng chung cảnh ngộ trong tiền tố συν-.
- source_word: τῷ λαῷ τοῦ θεοῦ
  choice: với dân của Đức Chúa Trời
  rationale: Giữ cấu trúc sở hữu và sắc thái cộng đồng giao ước của cụm từ Hy Lạp.
- source_word: ἢ
  choice: còn hơn
  rationale: Nối tự nhiên vế thứ hai của phép so sánh lựa chọn trong tiếng Việt.
- source_word: πρόσκαιρον
  choice: tạm thời
  rationale: Chỉ điều chỉ kéo dài một thời gian ngắn, không hàm ý rằng bản thân tội lỗi là nhỏ nhẹ.
- source_word: ἔχειν ἁμαρτίας ἀπόλαυσιν
  choice: hưởng thú vui tạm thời của tội lỗi
  rationale: Trong tiếng Việt, 'hưởng thú vui' truyền đạt tự nhiên ἔχειν ἀπόλαυσιν; 'của tội lỗi' giữ phạm vi rộng và không xác định cụ thể hành vi nào.
theological_decisions:
- issue: Bản chất của lựa chọn đối lập với việc cùng chịu ngược đãi với dân Đức Chúa Trời
  choice: Giữ sự đối lập đạo đức giữa liên đới với dân Đức Chúa Trời và thú vui ngắn hạn gắn với tội lỗi, không xác định cụ thể loại tội nào.
  alternative: Hiểu cụm từ này cụ thể là những đặc quyền và sự thỏa hiệp trong hoàng cung Pha-ra-ôn, hoặc rộng hơn là mọi thú vui tội lỗi gắn với Ai Cập.
  rationale: Bản Hy Lạp không nêu nội dung cụ thể của ἁμαρτία; vì vậy bản dịch không thu hẹp đối tượng quy chiếu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cấu trúc “thà chọn… còn hơn…” thể hiện rõ sự lựa chọn có cân nhắc; “cùng chịu ngược đãi” bảo toàn ý liên đới của động từ ghép Hy Lạp.
