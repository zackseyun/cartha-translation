  terminology: “Đức tin” phù hợp với πίστις trong Hê-bơ-rơ 11. “Sự công chính” giữ được phạm vi rộng của δικαιοσύνη hơn là giới hạn vào nghĩa pháp lý-xã hội “công lý”; chú thích nêu phương án thay thế thích hợp. Các dấu chú thích được gắn đúng vào các từ/cụm từ liên quan.
