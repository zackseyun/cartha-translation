  source_fidelity: 'Bản dịch bám sát đầy đủ chuỗi động từ aorist trong nguyên ngữ: “nhờ đức tin,” “chinh phục các vương quốc,” “thực thi sự công chính,” “nhận được những lời hứa,” và “bịt miệng sư tử.” Cách nói “nhận được những lời hứa” không giải quyết thay sự căng thẳng ngữ nghĩa của ἐπέτυχον ἐπαγγελιῶν trong văn mạch Hê-bơ-rơ.'
