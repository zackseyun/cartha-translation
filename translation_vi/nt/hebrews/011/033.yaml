id: HEB.11.33
reference: Hebrews 11:33
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οἳ διὰ πίστεως κατηγωνίσαντο βασιλείας, εἰργάσαντο δικαιοσύνην, ἐπέτυχον ἐπαγγελιῶν, ἔφραξαν στόματα λεόντων,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/033.yaml
  text: who through faith conquered kingdoms[a], worked righteousness, obtained promises, shut the mouths of lions[b],
translation:
  language: vi
  text: là những người nhờ đức tin[b] đã chinh phục các vương quốc, thực thi sự công chính[a], nhận được những lời hứa và bịt miệng sư tử.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “thực thi công lý” hoặc “làm điều ngay chính.” Từ Hy Lạp có thể chỉ sự công chính hoặc công lý tùy ngữ cảnh.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “bởi đức tin.” Cụm từ Hy Lạp trình bày đức tin như phương tiện qua đó những người này hành động.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ πίστεως
  choice: nhờ đức tin
  rationale: 'Cụm διά với sở hữu cách chỉ phương tiện: họ hành động nhờ đức tin. “Đức tin” là cách diễn đạt tự nhiên và nhất quán với chủ đề của Hê-bơ-rơ 11.'
- source_word: κατηγωνίσαντο βασιλείας
  choice: chinh phục các vương quốc
  rationale: Động từ mang nghĩa thắng thế hoặc khuất phục trong xung đột; “chinh phục” giữ được sắc thái mạnh và đối tượng chính trị cụ thể của βασιλείας.
- source_word: εἰργάσαντο δικαιοσύνην
  choice: thực thi sự công chính
  rationale: “Thực thi” diễn đạt hành động tích cực của ἐργάζομαι, còn “sự công chính” giữ phạm vi đạo đức và giao ước của δικαιοσύνη mà không thu hẹp hoàn toàn vào công lý xét xử.
- source_word: ἐπέτυχον ἐπαγγελιῶν
  choice: nhận được những lời hứa
  rationale: Cách dịch này tự nhiên trong tiếng Việt và không xác định quá mức họ nhận chính lời hứa, sự ứng nghiệm, hay điều đã được hứa, nhờ đó duy trì sự căng thẳng trong toàn thư Hê-bơ-rơ.
- source_word: ἔφραξαν στόματα λεόντων
  choice: bịt miệng sư tử
  rationale: “Bịt” thể hiện động tác ngăn hoặc khóa miệng theo φράσσω, đồng thời giữ hình ảnh cụ thể và gợi nhắc câu chuyện Đa-ni-ên mà không chú giải ngay trong câu.
theological_decisions:
- issue: Ý nghĩa của πίστις trong danh mục Hê-bơ-rơ 11
  choice: đức tin
  alternative: lòng tin; sự trung tín
  rationale: Trong ngữ cảnh này, πίστις chủ yếu nói đến sự tin cậy nơi Đức Chúa Trời làm phương tiện để hành động. “Đức tin” vừa tự nhiên trong văn phong Kinh Thánh tiếng Việt vừa không biến từ này thành phẩm chất “sự trung tín” một cách quá cụ thể.
- issue: Phạm vi nghĩa của δικαιοσύνη
  choice: sự công chính
  alternative: công lý; điều ngay chính
  rationale: “Sự công chính” giữ được nghĩa rộng về hành động đúng đắn trước mặt Đức Chúa Trời; “công lý” là sắc thái khả dĩ nhưng có thể làm nghĩa bị thu hẹp vào bình diện xã hội hoặc tư pháp.
translation_notes:
  register: Bản dịch dùng tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Nhịp liệt kê được giữ bằng các động từ song song; không thêm chủ thể ngoài đại từ quan hệ mở đầu vốn nối với văn mạch trước.
