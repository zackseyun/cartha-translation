- from: Bởi đức tin, ông sống như người ngoại kiều trong miền đất đã được hứa[a], coi đó như đất của người khác; ông ở trong lều cùng với Y-sác và Gia-cốp, là những người đồng thừa hưởng cùng một lời hứa ấy.
  to: Bởi đức tin, ông cư ngụ như một người ngoại kiều trong miền đất của lời hứa[a], như ở trên một miền đất xa lạ; ông sống trong lều cùng với Y-sác và Gia-cốp, là những người cùng thừa kế lời hứa ấy.
  rationale: Sửa cách diễn đạt ὡς ἀλλοτρίαν để không thêm ý rằng Áp-ra-ham chủ quan “coi” miền đất theo một cách nào đó. Dùng “miền đất của lời hứa” để phản ánh sát danh ngữ nguồn, và “những người cùng thừa kế” để diễn đạt rõ συγκληρονόμων. Không thay đổi nội dung hay giải quyết nghịch lý giữa lời hứa và thân phận ngoại kiều.
