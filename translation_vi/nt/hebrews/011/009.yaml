id: HEB.11.9
reference: Hebrews 11:9
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: πίστει παρῴκησεν εἰς γῆν τῆς ἐπαγγελίας ὡς ἀλλοτρίαν, ἐν σκηναῖς κατοικήσας μετὰ Ἰσαὰκ καὶ Ἰακὼβ τῶν συγκληρονόμων τῆς ἐπαγγελίας τῆς αὐτῆς·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/009.yaml
  text: By faith he lived as a foreigner in the land of promise[a], as in a foreign land, dwelling in tents with Isaac and Jacob, fellow heirs of the same promise.
translation:
  language: vi
  text: Bởi đức tin, ông cư ngụ như một người ngoại kiều trong miền đất của lời hứa[a], như ở trên một miền đất xa lạ; ông sống trong lều cùng với Y-sác và Gia-cốp, là những người cùng thừa kế lời hứa ấy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Bởi đức tin, ông cư ngụ trong miền đất của lời hứa như trên một miền đất xa lạ.”'
    reason: Cấu trúc εἰς γῆν τῆς ἐπαγγελίας ὡς ἀλλοτρίαν có thể được diễn đạt sát cấu trúc hơn; ὡς ἀλλοτρίαν trực tiếp mô tả miền đất là xa lạ hay thuộc về người khác.
lexical_decisions:
- source_word: πίστει
  choice: Bởi đức tin
  rationale: Cách dùng cách dữ liệu chỉ phương tiện; đây là cách diễn đạt tự nhiên, nhất quán với chủ đề đức tin xuyên suốt Hê-bơ-rơ 11.
- source_word: παρῴκησεν
  choice: ông sống như người ngoại kiều
  rationale: Động từ nói đến việc cư trú tại một nơi với tư cách người ngoài, không có quyền sở hữu hay địa vị bản xứ; “người ngoại kiều” giữ được sắc thái xã hội này.
- source_word: εἰς γῆν τῆς ἐπαγγελίας
  choice: trong miền đất đã được hứa
  rationale: Với động từ chỉ sự cư trú, εἰς có thể diễn tả nơi chốn. Cách dịch này tự nhiên trong tiếng Việt và làm rõ miền đất là đối tượng của lời hứa.
- source_word: ὡς ἀλλοτρίαν
  choice: coi đó như đất của người khác
  rationale: ἀλλότριος mang nghĩa thuộc về người khác, xa lạ. Cách dịch giữ hình ảnh Áp-ra-ham cư trú trên miền đất được hứa nhưng chưa sở hữu nó.
- source_word: ἐν σκηναῖς κατοικήσας
  choice: ông ở trong lều
  rationale: Phân từ mô tả hoàn cảnh hay cách thức ông cư trú; câu tiếng Việt dùng mệnh đề phối hợp để diễn đạt tự nhiên mà vẫn giữ hình ảnh đời sống tạm bợ.
- source_word: μετὰ Ἰσαὰκ καὶ Ἰακὼβ
  choice: cùng với Y-sác và Gia-cốp
  rationale: μετά với sở hữu cách mang nghĩa trực tiếp là “cùng với”; tên riêng dùng dạng quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
- source_word: τῶν συγκληρονόμων
  choice: những người đồng thừa hưởng
  rationale: Từ này chỉ những người cùng chia sẻ một cơ nghiệp. “Đồng thừa hưởng” rõ nghĩa và tự nhiên hơn một danh từ ghép mang tính kỹ thuật.
- source_word: τῆς ἐπαγγελίας τῆς αὐτῆς
  choice: cùng một lời hứa ấy
  rationale: Giữ sự nhấn mạnh rằng Y-sác và Gia-cốp cùng dự phần chính lời hứa đã ban cho Áp-ra-ham.
theological_decisions:
- issue: Chủ thể được hiểu ngầm
  choice: Dùng đại từ “ông”, chỉ Áp-ra-ham theo ngữ cảnh câu trước
  alternative: Lặp lại tên “Áp-ra-ham”
  rationale: Bản Hy Lạp chỉ có chủ ngữ hàm ẩn, tiếp nối Hê-bơ-rơ 11:8. Dùng “ông” giữ liên kết văn mạch mà không thêm tên vào câu nguồn.
- issue: Quan hệ giữa miền đất được hứa và tình trạng ngoại kiều
  choice: 'Giữ nghịch lý: đó là miền đất đã được hứa nhưng ông vẫn coi như đất thuộc về người khác'
  alternative: Diễn giải rằng ông chưa nhận được miền đất
  rationale: Bản văn đặt lời hứa bên cạnh đời sống ngoại kiều mà không giải thích hay giải quyết sự căng thẳng thần học ấy.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Ngoại kiều” diễn tả tư cách cư trú của người ngoài; “đất của người khác” bảo tồn nghĩa cụ thể của ἀλλοτρίαν. Dấu chấm phẩy giúp phân biệt hoàn cảnh cư trú với việc Y-sác và Gia-cốp cùng thừa hưởng lời hứa.
