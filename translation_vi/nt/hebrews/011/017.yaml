id: HEB.11.17
reference: Hebrews 11:17
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Πίστει προσενήνοχεν Ἀβραὰμ τὸν Ἰσαὰκ πειραζόμενος, καὶ τὸν μονογενῆ προσέφερεν ὁ τὰς ἐπαγγελίας ἀναδεξάμενος,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/017.yaml
  text: By faith Abraham[a], when he was being tested, offered up Isaac, and the one who had received the promises was offering up his one and only son,
translation:
  language: vi
  text: Bởi đức tin, Áp-ra-ham, khi đang bị thử thách, đã dâng Y-sác; và người đã tiếp nhận các lời hứa ấy đang dâng người con duy nhất[a] của mình.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “người con độc nhất” hoặc “người con có một không hai.” Từ Hy Lạp nhấn mạnh tính độc nhất của Y-sác; cách dịch truyền thống là “con độc sinh.”
    reason: Nêu các khả năng dịch của μονογενής và làm rõ rằng từ này nhấn mạnh địa vị độc nhất của Y-sác, không nhất thiết nói Áp-ra-ham không có người con nào khác về mặt sinh học.
lexical_decisions:
- source_word: Πίστει
  choice: Bởi đức tin
  rationale: Diễn đạt cách dùng công cụ/phương tiện của cách dữ cách tự nhiên, đồng thời giữ công thức lặp lại xuyên suốt Hê-bơ-rơ 11.
- source_word: προσενήνοχεν
  choice: đã dâng
  rationale: Thì hoàn thành của προσφέρω được diễn đạt bằng lối kể quá khứ tự nhiên trong tiếng Việt; “dâng” giữ sắc thái hiến tế.
- source_word: πειραζόμενος
  choice: khi đang bị thử thách
  rationale: Giữ ý nghĩa bị động, hoàn cảnh thời gian và tính đang diễn ra của phân từ hiện tại; “thử thách” phù hợp hơn “cám dỗ” trong bối cảnh Sáng Thế Ký.
- source_word: μονογενῆ
  choice: người con duy nhất
  rationale: Diễn đạt địa vị độc nhất, có một không hai của Y-sác, nhất là trong tư cách người con của lời hứa, mà không dựa vào nghĩa sinh thành của cách dịch truyền thống “con độc sinh”.
- source_word: προσέφερεν
  choice: đang dâng
  rationale: Giữ khía cạnh chưa hoàn tất của thì chưa hoàn thành và nét sống động của cảnh thuật, đồng thời phân biệt với động từ hoàn thành đứng trước.
- source_word: ἀναδεξάμενος
  choice: đã tiếp nhận
  rationale: Diễn đạt tự nhiên việc Áp-ra-ham đón nhận những lời hứa trước hành động được thuật lại.
- source_word: ἐπαγγελίας
  choice: các lời hứa
  rationale: Giữ nguyên số nhiều của tiếng Hy Lạp và chỉ toàn bộ những lời Đức Chúa Trời đã hứa với Áp-ra-ham.
- source_word: καὶ
  choice: ;
  rationale: Dùng dấu chấm phẩy để nối hai vế có quan hệ chặt chẽ trong tiếng Việt; quan hệ liên kết của καὶ vẫn được bảo toàn mà câu tránh nặng nề.
theological_decisions:
- issue: μονογενῆ được dùng cho Y-sác dù Áp-ra-ham còn có Ích-ma-ên
  choice: người con duy nhất
  alternative: con một; người con độc nhất; người con có một không hai
  rationale: Cách dịch giữ sức căng của nguyên văn và nhấn mạnh địa vị độc nhất của Y-sác trong những lời hứa, nhưng không âm thầm thêm cụm “theo lời hứa” vào chính câu. Chú thích làm rõ rằng từ này nói đến tính độc nhất, không nhất thiết phủ nhận sự tồn tại của người con sinh học khác.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ tên riêng quen dùng “Áp-ra-ham” và “Y-sác”; dùng “đã dâng/đang dâng” để phản ánh sự tương phản về thể của hai động từ Hy Lạp. Dấu chú thích [a] được đặt ngay sau cụm từ mà chú thích giải thích.
