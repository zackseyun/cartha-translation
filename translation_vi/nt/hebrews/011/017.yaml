  verdict: revise
  source_fidelity: 'Bản dịch giữ tốt các yếu tố chính: Πίστει là “Bởi đức tin,” πειραζόμενος giữ thể bị động và ý thời gian, προσενήνοχεν/προσέφερεν được phân biệt hợp lý bằng “đã dâng/đang dâng,” và ἐπαγγελίας được giữ số nhiều. Tuy nhiên, cần đặt rõ phân từ “khi đang bị thử thách” kề với Áp-ra-ham và thêm liên từ “và” để phản ánh καὶ rõ hơn. “Chính” không có đối ứng trực tiếp cần thiết trong câu Hy Lạp.'
  naturalness: Câu sửa có trật tự tự nhiên, rõ chủ ngữ của mệnh đề hoàn cảnh, đồng thời giữ được sự nối tiếp và căng thẳng tu từ của nguyên văn. “Người con duy nhất” là cách nói hiện đại, tự nhiên; chú thích cần tiếp tục giới hạn cách hiểu theo nghĩa sinh học.
  terminology: Giữ nhất quán các tên “Áp-ra-ham,” “Y-sác,” thuật ngữ “đức tin,” “lời hứa,” và động từ có sắc thái hiến tế “dâng.” “Con độc sinh” chỉ nên được nêu như một cách dịch truyền thống trong chú thích, không dùng trong thân câu vì dễ gợi nghĩa sinh thành không phải trọng tâm của μονογενής.
