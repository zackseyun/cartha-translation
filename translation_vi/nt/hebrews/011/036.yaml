  yaml_path: translation/nt/hebrews/011/036.yaml
  text: And others experienced mocking and flogging[a], and even chains and imprisonment.
translation:
  language: vi
  text: Còn những người khác phải chịu nhạo báng và roi đòn,[a] thậm chí cả xiềng xích và tù đày.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “trải qua thử thách bởi sự nhạo báng và roi đòn, thậm chí bởi xiềng xích và cảnh tù đày.” Tiếng Hy Lạp sát nghĩa hơn là “đã nhận một thử thách về…”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕτεροι
  choice: những người khác
  rationale: Chỉ một nhóm khác trong danh sách những người trung tín chịu khổ và giữ rõ sự tương phản với các trường hợp trước.
- source_word: ἐμπαιγμῶν
  choice: nhạo báng
  rationale: Diễn đạt tự nhiên hành vi chế giễu, sỉ nhục công khai; dạng danh từ phù hợp với kết cấu liệt kê trong tiếng Việt.
- source_word: μαστίγων
  choice: roi đòn
  rationale: Chỉ sự đánh bằng roi; cách nói này rõ nghĩa, trang trọng vừa phải và tự nhiên trong tiếng Việt hiện đại.
- source_word: πεῖραν ἔλαβον
  choice: phải chịu
  rationale: Thành ngữ Hy Lạp sát nghĩa là ‘đã nhận sự thử nghiệm/trải nghiệm về’; ‘phải chịu’ truyền đạt tự nhiên việc họ trải qua những khổ nạn ấy, trong khi chú thích bảo lưu cách diễn đạt sát chữ.
- source_word: ἔτι δὲ
  choice: thậm chí cả
  rationale: Thể hiện sự tăng tiến từ nhạo báng và roi đòn đến xiềng xích và tù đày.
- source_word: δεσμῶν
  choice: xiềng xích
  rationale: Từ cụ thể chỉ vật trói buộc; ‘xiềng xích’ rõ ràng và gợi đúng cảnh bị giam giữ.
- source_word: φυλακῆς
  choice: tù đày
  rationale: Trong ngữ cảnh này chỉ tình trạng bị giam cầm; ‘tù đày’ tự nhiên khi đi cùng ‘xiềng xích’ và không chỉ đơn thuần nói đến địa điểm nhà tù.
theological_decisions: []
