  source_fidelity: 'Bản dịch chính truyền đạt trung thành bốn hạng khổ nạn trong câu: nhạo báng, đánh roi, xiềng xích và giam cầm. “Còn những người khác” phản ánh đúng ἕτεροι δέ, còn “thậm chí cả” thể hiện hợp lý sắc thái tăng tiến của ἔτι δέ. “Phải chịu” là cách chuyển ngữ tự nhiên cho πεῖραν ἔλαβον trong ngữ cảnh này.'
  naturalness: Câu văn tự nhiên, trang trọng vừa phải và phù hợp tiếng Việt hiện đại. Cặp từ “xiềng xích và tù đày” rõ nghĩa; “roi đòn” diễn tả được việc bị đánh bằng roi.
