id: HEB.11.11
reference: Hebrews 11:11
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: πίστει καὶ ⸂αὐτῇ Σάρρᾳ⸃ δύναμιν εἰς καταβολὴν σπέρματος ἔλαβεν καὶ παρὰ καιρὸν ⸀ἡλικίας, ἐπεὶ πιστὸν ἡγήσατο τὸν ἐπαγγειλάμενον·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/011.yaml
  text: By faith even Sarah herself received power to conceive offspring[a], even beyond the proper time of life, because she considered the one who had promised to be faithful.
translation:
  language: vi
  text: Bởi đức tin, ngay cả chính Sa-ra cũng nhận được năng lực để sinh con[a], dù đã qua tuổi sinh nở, vì bà cho rằng Đấng đã hứa là thành tín.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát hơn: “nhận được năng lực cho việc gieo hạt giống.” Cách diễn đạt Hy Lạp này khác thường và mang tính thành ngữ; trong ngữ cảnh, nó nói đến khả năng sinh con.'
    reason: Bảo lưu cách dịch sát chữ và sự khác thường về từ vựng của εἰς καταβολὴν σπέρματος.
lexical_decisions:
- source_word: πίστει
  choice: Bởi đức tin
  rationale: Dạng tặng cách chỉ phương tiện trong công thức lặp lại của Hê-bơ-rơ 11; cách dịch này tự nhiên và giữ đúng trọng tâm của phân đoạn.
- source_word: καὶ αὐτῇ Σάρρᾳ
  choice: ngay cả chính Sa-ra cũng
  rationale: Diễn đạt cả sắc thái bổ sung của καί lẫn sự nhấn mạnh của αὐτῇ, nêu Sa-ra như một trường hợp đáng chú ý.
- source_word: δύναμιν ... ἔλαβεν
  choice: nhận được năng lực
  rationale: Giữ cấu trúc và ý nghĩa căn bản của cụm Hy Lạp, đồng thời phù hợp với văn phong tiếng Việt hiện đại.
- source_word: εἰς καταβολὴν σπέρματος
  choice: để thụ thai sinh con
  rationale: Cụm Hy Lạp khác thường và mang tính thành ngữ. Trong ngữ cảnh, khi Sa-ra là chủ thể, cách dịch này truyền đạt tự nhiên khả năng sinh con mà bà nhận được; nghĩa sát chữ được ghi ở chú thích.
- source_word: καὶ παρὰ καιρὸν ἡλικίας
  choice: dù đã quá tuổi thích hợp
  rationale: παρά với đối cách diễn tả việc vượt quá giới hạn bình thường; καιρός và ἡλικία cùng chỉ thời điểm thích hợp theo tuổi đời. “Dù” làm rõ quan hệ nhượng bộ tự nhiên trong tiếng Việt.
- source_word: ἐπεὶ
  choice: vì
  rationale: Giới thiệu lý do Sa-ra nhận được năng lực; “vì” ngắn gọn và rõ ràng.
- source_word: πιστὸν
  choice: thành tín
  rationale: Diễn tả phẩm chất đáng tin cậy của Đức Chúa Trời, đồng thời giữ sắc thái thần học và giao ước của từ Hy Lạp.
- source_word: ἡγήσατο
  choice: cho rằng
  rationale: Thể hiện sự đánh giá hay nhận định của Sa-ra bằng lối nói tự nhiên trong tiếng Việt.
- source_word: τὸν ἐπαγγειλάμενον
  choice: Đấng đã hứa
  rationale: Phân từ được danh từ hóa ám chỉ Đức Chúa Trời; “Đấng” trang trọng, rõ ràng và không thêm nội dung ngoài bản văn.
theological_decisions:
- issue: Chủ thể và ý nghĩa hành động của Sa-ra trong một mệnh đề khó về cú pháp
  choice: 'Sa-ra là chủ thể: bà nhận được năng lực để thụ thai sinh con.'
  alternative: Có thể hiểu Áp-ra-ham được ngầm bao hàm hoặc cụm từ nói đến việc thiết lập một dòng dõi.
  rationale: Trong dạng văn bản này, αὐτῇ Σάρρᾳ tự nhiên nhất được hiểu là xác định Sa-ra làm chủ thể của ἔλαβεν. Tuy cụm καταβολὴ σπέρματος có thể gợi hình ảnh nam giới khi dịch sát chữ, ngữ cảnh nhấn mạnh đức tin của Sa-ra và việc bà có thể sinh con dù tuổi đã cao. Chú thích bảo lưu cách diễn đạt sát chữ khác thường.
- issue: Cách dịch πιστός khi nói về Đức Chúa Trời
  choice: thành tín
  alternative: đáng tin cậy
  rationale: Câu này đặt nền tảng đức tin của Sa-ra nơi bản tính đáng tin cậy của Đấng hứa. “Thành tín” giữ được sức nặng thần học mà không thêm giáo lý ngoài bản văn.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “Sa-ra” theo lối phiên âm Kinh Thánh quen thuộc; giữ cấu trúc nhấn mạnh “ngay cả chính... cũng” và tránh giải thích quá mức về tuổi sinh nở trong chính văn.
