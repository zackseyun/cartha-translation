  source_fidelity: 'Bản dịch giữ đúng các thành tố chính: πάντες quy chiếu những người vừa được nêu, διὰ τῆς πίστεως là phương tiện, và τὴν ἐπαγγελίαν được giữ cô đọng là “lời hứa”. Tuy nhiên, “được chứng nhận tốt” không diễn đạt tự nhiên và rõ nghĩa sắc thái được làm chứng thuận lợi/được khen ngợi của μαρτυρηθέντες.'
