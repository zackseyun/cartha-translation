source:
  edition: SBLGNT
  text: ⸀καὶ πάντες μαρτυρηθέντες διὰ τῆς πίστεως οὐκ ἐκομίσαντο τὴν ἐπαγγελίαν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/039.yaml
  text: And all these[a], though commended through faith, did not receive the promise[b],
translation:
  language: vi
  text: Và tất cả những người ấy, dù đã được khen ngợi nhờ đức tin[a], vẫn chưa nhận được lời hứa[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “được công nhận” hoặc “được làm chứng thuận lợi.” Phân từ Hy Lạp nhấn mạnh rằng những người này đã nhận được lời chứng thuận lợi nhờ đức tin.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “chưa đạt được lời hứa.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Và
  rationale: Giữ liên từ đơn giản, nối câu tổng kết này với danh sách những người có đức tin ở phần trước mà không thêm sắc thái đối lập vốn không nằm rõ trong καί.
- source_word: πάντες
  choice: tất cả những người ấy
  rationale: Làm rõ sự quy chiếu về những nhân vật vừa được kể đến trong Hê-bơ-rơ 11, đồng thời diễn đạt tự nhiên trong tiếng Việt.
- source_word: μαρτυρηθέντες
  choice: dù đã được chứng nhận tốt
  rationale: Diễn đạt phân từ thụ động với ý được làm chứng thuận lợi hoặc được công nhận; từ “dù” thể hiện sắc thái nhượng bộ nảy sinh từ ngữ cảnh với mệnh đề “vẫn chưa nhận được”.
- source_word: διὰ τῆς πίστεως
  choice: nhờ đức tin
  rationale: διά với sở hữu cách chỉ phương tiện; “nhờ đức tin” là cách diễn đạt tự nhiên và chính xác trong tiếng Việt.
- source_word: πίστεως
  choice: đức tin
  rationale: Trong Hê-bơ-rơ 11, từ này nói đến lòng tin cậy của những người được nêu gương; “đức tin” giữ thuật ngữ thần học quen thuộc mà không thu hẹp thành một sắc thái riêng.
- source_word: οὐκ ἐκομίσαντο
  choice: vẫn chưa nhận được
  rationale: κομίζω ở trung thái có nghĩa nhận hoặc đạt được điều đã hứa. “Chưa” phù hợp với viễn cảnh hoàn tất còn ở phía trước trong câu 40; “vẫn” làm rõ quan hệ nhượng bộ mà không thay đổi nội dung cốt lõi.
- source_word: τὴν ἐπαγγελίαν
  choice: lời hứa
  rationale: Giữ nguyên cách nói cô đọng ở số ít của tiếng Hy Lạp, không tự ý mở rộng thành “sự ứng nghiệm của lời hứa” hoặc xác định cụ thể nội dung lời hứa.
theological_decisions:
- issue: Ý nghĩa của “lời hứa” trong ngữ cảnh
  choice: Giữ là “lời hứa” trong chính văn.
  alternative: điều đã được hứa; sự ứng nghiệm của lời hứa; cơ nghiệp hoặc phước lành đã hứa
  rationale: Tiếng Hy Lạp dùng cách nói cô đọng, còn câu 40 tiếp tục làm sáng tỏ viễn cảnh hoàn tất. Việc không mở rộng cụm từ giúp bảo tồn sự căng thẳng thần học và tính chưa xác định của nguyên văn.
- issue: Chủ thể làm chứng thuận lợi trong μαρτυρηθέντες
  choice: Dùng thể bị động “được chứng nhận tốt” mà không nêu rõ tác nhân.
  alternative: được Đức Chúa Trời khen ngợi; được công nhận
  rationale: Ngữ cảnh có thể hàm ý Đức Chúa Trời là Đấng làm chứng, nhưng nguyên văn câu này không nêu tác nhân; bản dịch không nên bổ sung điều ấy vào chính văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “những người ấy” để quy chiếu tự nhiên về danh sách trước đó; giữ “đức tin” và “lời hứa” là các thuật ngữ quen thuộc. Các dấu chú thích [a], [b] đều xuất hiện trong chính văn.
