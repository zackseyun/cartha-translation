id: HEB.11.13
reference: Hebrews 11:13
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Κατὰ πίστιν ἀπέθανον οὗτοι πάντες, μὴ ⸀λαβόντες τὰς ἐπαγγελίας, ἀλλὰ πόρρωθεν αὐτὰς ἰδόντες καὶ ἀσπασάμενοι, καὶ ὁμολογήσαντες ὅτι ξένοι καὶ παρεπίδημοί εἰσιν ἐπὶ τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/013.yaml
  text: All these died in faith[a], not having received the promises, but having seen them from afar and greeted them[c][b], and having confessed that they are strangers and exiles on the earth.
translation:
  language: vi
  text: Tất cả những người ấy đã chết trong đức tin, dù chưa nhận được những điều đã hứa; nhưng họ đã nhìn thấy những điều ấy từ xa và đón chào chúng, đồng thời tuyên xưng rằng họ là người xa lạ và khách tạm trú trên đất.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Κατὰ πίστιν
  choice: trong đức tin
  rationale: Diễn đạt trạng thái và lập trường đức tin khi họ qua đời, đồng thời giữ cách nói quen thuộc, trang trọng trong tiếng Việt.
- source_word: μὴ λαβόντες τὰς ἐπαγγελίας
  choice: dù chưa nhận được những điều đã hứa
  rationale: Giữ ý phủ định của phân từ và số nhiều của ἐπαγγελίας; cách diễn đạt này tự nhiên hơn việc nhân cách hóa trực tiếp “các lời hứa” trong tiếng Việt.
- source_word: πόρρωθεν αὐτὰς ἰδόντες
  choice: đã nhìn thấy ... từ xa
  rationale: Bảo toàn hình ảnh khoảng cách và trình tự nhận biết các điều được hứa trước khi chúng được hoàn tất.
- source_word: ἀσπασάμενοι
  choice: đón chào
  rationale: Động từ có nghĩa chào hỏi hoặc đón nhận; “đón chào” giữ được hình ảnh nhân cách hóa mà không diễn giải mạnh thành “ôm lấy”.
- source_word: ὁμολογήσαντες
  choice: tuyên xưng
  rationale: Thể hiện sự công khai thừa nhận hay công bố, mạnh hơn “công nhận” nhưng không thêm nội dung ngoài nguyên văn.
- source_word: ξένοι
  choice: người xa lạ
  rationale: Diễn đạt tình trạng không thuộc trọn vẹn về nơi đang sống và kết hợp tự nhiên với danh từ kế tiếp.
- source_word: παρεπίδημοί
  choice: khách tạm trú
  rationale: Chỉ người cư ngụ tại một nơi nhưng không có địa vị thuộc về ổn định; tránh thêm sắc thái bị cưỡng bức lưu đày của “người lưu vong”.
- source_word: ἐπὶ τῆς γῆς
  choice: trên đất
  rationale: γῆ có thể chỉ đất hoặc trái đất; “trên đất” giữ được độ mở của nguyên văn và tự nhiên trong ngữ cảnh kiếp lữ hành.
theological_decisions:
- issue: Sắc thái của πίστις
  choice: đức tin
  alternative: lòng tin; sự trung tín
  rationale: Trong ngữ cảnh này, từ chỉ tư thế tin cậy bền bỉ của các nhân vật đã nêu; “đức tin” là cách tương ứng rõ và không buộc từ này mang riêng nghĩa “sự trung tín”.
- issue: Các tổ phụ đã nhận được hay chưa nhận được lời hứa
  choice: chưa nhận được những điều đã hứa
  alternative: chưa nhận được các lời hứa
  rationale: 'Cách dịch giữ căng thẳng của câu: họ đã thấy từ xa và đón chào, nhưng chưa sở hữu sự ứng nghiệm trọn vẹn; không giải quyết thay bản văn phạm vi cụ thể của các lời hứa.'
- issue: Địa vị của παρεπίδημοί
  choice: khách tạm trú
  alternative: người lưu trú; kiều dân; người lưu vong
  rationale: Nguyên ngữ nhấn mạnh việc cư trú mà chưa thuộc về ổn định, không nhất thiết hàm ý bị trục xuất; vì vậy không chọn “người lưu vong”.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ chuỗi ý của các phân từ Hy Lạp nhưng dùng dấu chấm phẩy và liên từ để câu tiếng Việt sáng rõ. Không thêm chú thích vì các lựa chọn chính đã giữ được nghĩa và không có dị bản văn bản quan trọng cần nêu.
