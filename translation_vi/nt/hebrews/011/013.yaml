  verdict: revise
  source_fidelity: 'Bản dịch truyền đạt đúng mạch chính: những người đã nêu chết trong đức tin, chưa nhận được các điều hứa, thấy chúng từ xa, đón chào chúng, và tuyên xưng thân phận lữ khách. Tuy nhiên, vị trí của “từ xa” trong bản nháp dễ khiến nó bổ nghĩa đồng thời cho cả “nhìn thấy” lẫn “đón chào”, trong khi πόρρωθεν gắn trực tiếp với ἰδόντες (“đã nhìn thấy từ xa”).'
  naturalness: Câu nhìn chung hiện đại và trang trọng. Thay “mình là” bằng “họ là” tự nhiên hơn khi chủ ngữ là số nhiều và tránh sắc thái khẩu ngữ/phản thân không cần thiết. Đưa tân ngữ lên trước “từ xa” cũng làm chuỗi hành động rõ ràng hơn.
  terminology: “đức tin,” “những điều đã hứa,” “tuyên xưng,” “người xa lạ,” và “khách tạm trú” đều phù hợp với ngữ cảnh và giữ được các sắc thái chính. “Đón chào” là lựa chọn có thể chấp nhận cho ἀσπασάμενοι theo nghĩa hình tượng; không cần áp đặt nghĩa mạnh hơn như “ôm lấy” hay sắc thái “lưu vong.”
  issues:
  - severity: low
    issue: Vị trí của “từ xa”
    rationale: Trong tiếng Hy Lạp, πόρρωθεν đứng với ἰδόντες; nên đặt “từ xa” ngay sau hành động nhìn thấy để phản ánh cú pháp và tránh mơ hồ về phạm vi bổ nghĩa.
  - severity: low
    issue: Đại từ “mình”
    rationale: ὅτι ... εἰσιν nói về “họ là”; “mình là” có thể nghe khẩu ngữ và kém trực tiếp hơn trong câu thuật lại ở ngôi thứ ba số nhiều.
