  text: καὶ εἰ μὲν ἐκείνης ⸀μνημονεύουσιν ἀφ’ ἧς ⸀ἐξέβησαν, εἶχον ἂν καιρὸν ἀνακάμψαι·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/015.yaml
  text: And if they had been remembering that land from which they had gone out[a], they would have had opportunity to return.
translation:
  language: vi
  text: Và nếu họ vẫn nhớ đến quê hương[a] mà họ đã ra đi khỏi đó, thì họ đã có cơ hội trở về.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “xứ sở ấy” hoặc “miền đất ấy.” Tiếng Hy Lạp chỉ nơi trần thế mà họ đã rời khỏi.
    reason: lexical_alternative
lexical_decisions:
- source_word: μνημονεύουσιν
  choice: vẫn nhớ đến
  rationale: Thì hiện tại trong điều kiện trái với thực tế mang sắc thái tiếp diễn trong ngữ cảnh; “vẫn nhớ đến” diễn đạt việc tâm trí tiếp tục hướng về nơi cũ mà không thêm ý hoài niệm.
- source_word: ἐκείνης
  choice: quê hương
  rationale: Đại từ chỉ định giống cái quy chiếu về πατρίδα ở câu 14. “Quê hương” tự nhiên trong tiếng Việt và giữ được ý nơi chốn họ thuộc về, dù “xứ sở” cũng có thể dùng.
- source_word: ἀφ’ ἧς
  choice: mà mình ... ra đi
  rationale: Cấu trúc quan hệ chỉ nơi xuất phát được chuyển thành cách nói tự nhiên trong tiếng Việt; “mình” quy chiếu rõ về chủ ngữ “họ”.
- source_word: ἐξέβησαν
  choice: đã ra đi
  rationale: Giữ ý đi ra khỏi một nơi của ἐκβαίνω và sắc thái hành động đã xảy ra trước điều kiện được nêu.
- source_word: εἶχον ἂν
  choice: thì họ đã có
  rationale: Thể chưa hoàn thành đi với ἄν trong mệnh đề kết quả diễn tả điều trái với thực tế; cấu trúc “nếu... thì đã...” là tương đương tự nhiên trong tiếng Việt.
- source_word: καιρὸν
  choice: cơ hội
  rationale: Ở đây từ này chỉ dịp hay khả năng thuận tiện để hành động, không chỉ đơn thuần là thời gian.
- source_word: ἀνακάμψαι
  choice: trở về
  rationale: Diễn đạt ngắn gọn hành động quay lại nơi đã rời đi; “quay về” cũng là một khả năng.
- source_word: καὶ εἰ μὲν
  choice: Và nếu
  rationale: Giữ liên kết với câu trước; μέν có chức năng cấu trúc nhẹ và không cần một từ riêng trong tiếng Việt.
theological_decisions:
- issue: Bản chất của nơi họ nhớ đến
  choice: Một quê hương trần thế họ đã rời đi, đối lập ngầm với quê hương tốt hơn thuộc về trời trong văn cảnh.
  alternative: Một lối sống trước đây nói chung, chứ không phải quê hương theo nghĩa nơi chốn.
  rationale: Hê-bơ-rơ 11:13–16 dùng ngôn ngữ cụ thể về quê hương và xứ sở. Bản dịch giữ nghĩa không gian, không chuyển thành nghĩa ẩn dụ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cấu trúc “nếu... thì đã...” giữ sắc thái điều kiện trái với thực tế; “quê hương” liên kết tự nhiên với văn cảnh các câu 14–16.
