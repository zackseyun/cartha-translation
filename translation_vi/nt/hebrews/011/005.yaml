id: HEB.11.5
reference: Hebrews 11:5
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Πίστει Ἑνὼχ μετετέθη τοῦ μὴ ἰδεῖν θάνατον, καὶ οὐχ ηὑρίσκετο διότι μετέθηκεν αὐτὸν ὁ θεός· πρὸ γὰρ τῆς ⸀μεταθέσεως μεμαρτύρηται εὐαρεστηκέναι τῷ θεῷ,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/005.yaml
  text: By faith Enoch was taken away so that he should not see death[a], and he was not found because God had taken him away. For before his being taken away, he had been commended as having pleased God[c][b],
translation:
  language: vi
  text: Bởi đức tin, Hê-nóc được cất đi để không thấy sự chết[a], và người ta không tìm thấy ông, vì Đức Chúa Trời đã cất ông đi. Thật vậy, trước khi được cất đi, ông đã được chứng nhận là đã làm đẹp lòng Đức Chúa Trời.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “nếm trải cái chết.” “Thấy sự chết” là một thành ngữ Hy Lạp được giữ lại trong chính văn.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πίστει
  choice: Bởi đức tin
  rationale: Dịch cách dùng công cụ của danh từ πίστις trong Hê-bơ-rơ 11; đây là cách diễn đạt tự nhiên, quen thuộc và phù hợp với mạch văn.
- source_word: μετετέθη / μετέθηκεν / μεταθέσεως
  choice: được cất đi / đã cất ông đi / được cất đi
  rationale: Giữ nhất quán ý Đức Chúa Trời đưa Hê-nóc khỏi đời sống trần thế, đồng thời không thêm địa điểm hay cơ chế mà câu không nói rõ.
- source_word: τοῦ μὴ ἰδεῖν θάνατον
  choice: để không phải thấy sự chết
  rationale: Giữ hình ảnh nguyên ngữ “thấy sự chết”, còn “không phải” diễn đạt tự nhiên sắc thái mục đích hoặc kết quả của cấu trúc nguyên ngữ có mạo từ.
- source_word: οὐχ ηὑρίσκετο
  choice: người ta không tìm thấy ông
  rationale: Tiếng Việt thường cần nêu chủ thể phiếm chỉ để câu tự nhiên; “người ta” không xác định ai tìm kiếm, tương ứng với sự không xác định trong thể bị động Hy Lạp.
- source_word: μεμαρτύρηται
  choice: đã được chứng nhận
  rationale: Giữ ý bị động của động từ và ý rằng có lời chứng xác nhận về Hê-nóc; tránh thu hẹp thành lời khen đơn thuần.
- source_word: εὐαρεστηκέναι τῷ θεῷ
  choice: là đẹp lòng Đức Chúa Trời
  rationale: Diễn đạt tự nhiên nội dung lời chứng, đồng thời bảo toàn ý Hê-nóc đã làm đẹp lòng Đức Chúa Trời trước khi được cất đi.
theological_decisions:
- issue: Ý nghĩa của ngôn ngữ μετατίθημι về Hê-nóc
  choice: Dịch là “cất đi” mà không giải thích thêm nơi đến hoặc cách thức.
  alternative: “được đưa lên trời” hoặc cách dịch cổ “được biến hóa”
  rationale: Câu khẳng định Đức Chúa Trời cất Hê-nóc đi để ông không thấy sự chết, nhưng không trình bày chi tiết hơn; bản dịch không nên thêm điều không được nói rõ.
- issue: Sắc thái của thành ngữ “thấy sự chết”
  choice: Giữ “thấy sự chết” trong chính văn.
  alternative: “nếm trải cái chết” hoặc “chết”
  rationale: Hình ảnh nguyên ngữ vẫn dễ hiểu trong tiếng Việt và duy trì sắc thái Kinh Thánh; chú thích giải nghĩa thành ngữ.
- issue: Sắc thái của μεμαρτύρηται
  choice: “được chứng nhận”
  alternative: “được khen ngợi” hoặc “được làm chứng”
  rationale: “Được chứng nhận” giữ mở nguồn của lời chứng và không biến động từ thành một lời tán dương thuần túy.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “Hê-nóc” và “Đức Chúa Trời” theo lối gọi quen thuộc trong Kinh Thánh tiếng Việt; tránh lối cổ như “chẳng hề thấy sự chết” và tránh giải thích thần học vượt quá câu văn.
