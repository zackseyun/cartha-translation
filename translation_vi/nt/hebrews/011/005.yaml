revisions:
- from: Bởi đức tin, Hê-nóc được cất đi để không phải thấy sự chết[a], và người ta không tìm thấy ông, vì Đức Chúa Trời đã cất ông đi. Thật vậy, trước khi được cất đi, ông đã được chứng nhận là đẹp lòng Đức Chúa Trời.
  to: Bởi đức tin, Hê-nóc được cất đi để không thấy sự chết[a], và người ta không tìm thấy ông, vì Đức Chúa Trời đã cất ông đi. Thật vậy, trước khi được cất đi, ông đã được chứng nhận là đã làm đẹp lòng Đức Chúa Trời.
  rationale: Chỉ điều chỉnh “để không phải thấy” thành “để không thấy” để diễn đạt trực tiếp mục đích/kết quả của τοῦ μὴ ἰδεῖν, và thay “là đẹp lòng” bằng “là đã làm đẹp lòng” để phản ánh chính xác hơn nguyên mẫu hoàn thành εὐαρεστηκέναι. Các yếu tố còn lại được giữ nguyên vì trung thành với nguyên ngữ và tự nhiên trong tiếng Việt hiện đại.
