id: HEB.11.38
reference: Hebrews 11:38
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὧν οὐκ ἦν ἄξιος ὁ κόσμος ⸀ἐπὶ ἐρημίαις πλανώμενοι καὶ ὄρεσι καὶ σπηλαίοις καὶ ταῖς ὀπαῖς τῆς γῆς·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/038.yaml
  text: —of whom the world was not worthy—wandering in deserts and mountains[b][a], and caves and holes in the ground.
translation:
  language: vi
  text: —thế gian không xứng đáng với họ—họ lang thang trong hoang mạc[a], trên núi, trong hang động và những hốc dưới đất[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “những nơi hoang vắng.”'
    reason: lexical_alternative
  - marker: b
    text: 'Sát nghĩa: “những hốc của đất.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὧν
  choice: với họ
  rationale: Đại từ quan hệ số nhiều ở sở hữu cách chỉ những người trung tín chịu khổ đã nói ở câu trước. Trong cấu trúc tiếng Việt “không xứng đáng với họ”, “với họ” truyền đạt tự nhiên quan hệ mà tiếng Hy Lạp diễn tả bằng sở hữu cách.
- source_word: ἄξιος
  choice: xứng đáng
  rationale: Giữ nguyên sắc thái đánh giá mạnh của câu, đối lập giá trị của những người trung tín với thế gian đã khước từ họ.
- source_word: κόσμος
  choice: thế gian
  rationale: Chỉ thế giới loài người hay xã hội đã khước từ những người trung tín; “thế gian” là cách diễn đạt trang trọng, quen thuộc nhưng vẫn dễ hiểu.
- source_word: ἐπὶ ἐρημίαις
  choice: trong hoang mạc
  rationale: ἐπί với tặng cách mang nghĩa chỉ nơi chốn trong ngữ cảnh lang thang. “Hoang mạc” giữ hình ảnh cụ thể, còn nghĩa rộng hơn được ghi ở chú thích.
- source_word: πλανώμενοι
  choice: họ lang thang
  rationale: Diễn tả tình trạng di chuyển không ổn định của những người phải phiêu bạt; thêm đại từ “họ” để câu tiếng Việt rõ và tự nhiên.
- source_word: ὄρεσι
  choice: trên núi
  rationale: ὄρος chỉ núi hoặc vùng núi; “trên núi” phù hợp tự nhiên với giới từ chỉ nơi chốn trong tiếng Việt.
- source_word: σπηλαίοις
  choice: trong hang động
  rationale: Cách dịch thông dụng, rõ nghĩa cho nơi trú ẩn hoặc ẩn náu tự nhiên.
- source_word: ὀπαῖς τῆς γῆς
  choice: những hốc dưới đất
  rationale: ὀπή có thể là lỗ, hốc hay khe mở; cách diễn đạt này tự nhiên trong tiếng Việt và giữ hình ảnh những chỗ ẩn náu trong lòng đất.
theological_decisions:
- issue: Sở chỉ và sắc thái của mệnh đề “thế gian không xứng đáng với họ”
  choice: Giữ mệnh đề như lời phán xét về phẩm giá đạo đức của thế gian/xã hội khi đặt bên cạnh những người trung tín chịu khổ.
  alternative: Hiểu trung tính hơn, chỉ nói những người trung tín không tương hợp với thế gian.
  rationale: Câu Hy Lạp đưa ra một nhận định đánh giá mạnh chứ không chỉ mô tả sự không tương hợp về mặt xã hội. Bản dịch giữ sức căng này mà không mở rộng thành một khẳng định giáo lý ngoài nội dung câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dấu gạch ngang giữ mệnh đề chen có sức nhấn của nguyên văn; các giới từ được diễn đạt theo lối tự nhiên của tiếng Việt.
