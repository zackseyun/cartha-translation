revisions:
- from: Đức tin là sự bảo đảm về những điều mình hy vọng[a], là bằng chứng về những điều mình không thấy[b].
  to: Đức tin là sự bảo đảm cho những điều ta hy vọng[a], là bằng chứng của những điều ta không thấy[b].
  rationale: Chỉ thay đại từ khái quát “mình” bằng “ta” và điều chỉnh giới từ theo lối kết hợp tự nhiên hơn (“bảo đảm cho”, “bằng chứng của”). Bản sửa không thay đổi nghĩa, giữ tính khái quát của các phân từ nguyên ngữ và duy trì các neo chú thích đúng với từng từ được chú giải.
