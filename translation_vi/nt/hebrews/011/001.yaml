id: HEB.11.1
reference: Hebrews 11:1
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἔστιν δὲ πίστις ἐλπιζομένων ὑπόστασις, πραγμάτων ἔλεγχος οὐ βλεπομένων·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/001.yaml
  text: Faith is the assurance of things hoped for[b][a], the proof of things not seen.
translation:
  language: vi
  text: Đức tin là sự bảo đảm cho những điều ta hy vọng[a], là bằng chứng của những điều ta không thấy[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “thực chất”, “thực tại” hoặc “nền tảng chắc chắn của những điều ta hy vọng”.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “sự xác tín” hoặc “sự chứng minh về những điều ta không thấy”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πίστις
  choice: đức tin
  rationale: Trong ngữ cảnh này, danh từ chỉ thái độ tin cậy và vững lòng nơi lời hứa của Đức Chúa Trời; “đức tin” là thuật ngữ tự nhiên, quen thuộc trong tiếng Việt và không chuyển nghĩa sang “sự trung tín”.
- source_word: ἐλπιζομένων
  choice: về những điều mình hy vọng
  rationale: Phân từ hiện tại bị động, số nhiều, được dùng như danh từ để chỉ nội dung của niềm hy vọng. Đại từ “mình” mang nghĩa khái quát, giúp câu tự nhiên trong tiếng Việt.
- source_word: ὑπόστασις
  choice: sự bảo đảm
  rationale: Từ này có thể chỉ sự bảo đảm, nền tảng chắc chắn, thực thể hay thực tại. “Sự bảo đảm” diễn đạt rõ sức chắc chắn của đức tin trong mạch văn mà không áp đặt một khẳng định bản thể học.
- source_word: πραγμάτων
  choice: về những điều
  rationale: πρᾶγμα là từ rộng, có thể chỉ sự việc, điều hay thực tại. “Những điều” vừa tự nhiên vừa giữ được cấu trúc song song giữa hai vế.
- source_word: ἔλεγχος
  choice: bằng chứng
  rationale: Từ này có thể chỉ bằng chứng, sự chứng minh hoặc niềm xác tín do bằng chứng tạo nên. “Bằng chứng” giữ được sắc thái khách quan mà vẫn dễ hiểu.
- source_word: οὐ βλεπομένων
  choice: mình không thấy
  rationale: Cách diễn đạt này phản ánh trực tiếp những điều hiện không được nhìn thấy, đồng thời tạo câu tiếng Việt tự nhiên và song song với “mình hy vọng”.
- source_word: δὲ
  choice: không dịch thành từ riêng
  rationale: δέ là liên từ chuyển tiếp nhẹ. Trong tiếng Việt, quan hệ chuyển ý ở đây đã rõ nhờ vị trí câu; thêm “nay”, “vả” hoặc “nhưng” dễ tạo sắc thái thời gian hay tương phản mạnh hơn nguyên bản.
theological_decisions:
- issue: Ý nghĩa của ὑπόστασις trong Hê-bơ-rơ 11:1
  choice: sự bảo đảm
  alternative: thực chất; thực tại; nền tảng chắc chắn
  rationale: “Sự bảo đảm” giữ trọng tâm vào tính chắc chắn của đức tin trong mạch khích lệ của chương 11, nhưng chú thích vẫn bảo tồn khả năng từ này nhấn mạnh thực chất hoặc thực tại của điều được hy vọng.
- issue: Cách hiểu πίστις
  choice: đức tin
  alternative: lòng tin; sự tin cậy; sự trung tín
  rationale: Ở đây không có cấu trúc sở hữu gây tranh luận; ngữ cảnh mô tả thái độ tin cậy của người tin đối với những điều Đức Chúa Trời hứa, nên “đức tin” là lựa chọn phù hợp nhất.
- issue: Sắc thái của ἔλεγχος
  choice: bằng chứng
  alternative: sự xác tín; sự chứng minh
  rationale: “Bằng chứng” bảo tồn chiều kích chứng thực tương đối khách quan của từ, trong khi chú thích ghi nhận rằng từ này cũng có thể nói đến sự xác tín được tạo ra nơi người tin.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cấu trúc định nghĩa song song của nguyên văn được giữ lại. Không thêm từ chuyển tiếp ở đầu câu vì δέ chỉ đánh dấu bước chuyển nhẹ và tiếng Việt không cần biểu thị bằng một từ riêng trong câu này.
