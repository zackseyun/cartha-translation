  text: πίστει Ἰακὼβ ἀποθνῄσκων ἕκαστον τῶν υἱῶν Ἰωσὴφ εὐλόγησεν, καὶ προσεκύνησεν ἐπὶ τὸ ἄκρον τῆς ῥάβδου αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/021.yaml
  text: By faith Jacob[a], as he was dying, blessed each of the sons of Joseph[b], and worshiped while leaning on the top of his staff.
translation:
  language: vi
  text: 'Bởi đức tin, khi đang hấp hối, Gia-cốp chúc phước cho từng con trai của Giô-sép và thờ phượng trong khi tựa vào đầu gậy của mình.[a][b]


    [a] Nếu theo bản Hê-bơ-rơ của Sáng Thế Ký 47:31, có thể dịch: “rồi cúi mình thờ phượng trên đầu giường.” Bản Hy Lạp ở đây ghi là “gậy.”


    [b] Cũng có thể dịch: “rồi thờ phượng hướng về phía đầu gậy của mình.” Cụm từ này có lẽ mô tả tư thế của Gia-cốp, chứ không nói rằng cây gậy là đối tượng ông thờ phượng.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nếu theo bản Hê-bơ-rơ của Sáng Thế Ký 47:31, có thể dịch: “rồi cúi mình thờ phượng trên đầu giường.” Bản Hy Lạp ở đây ghi là “gậy.”'
    reason: textual_variant
  - marker: b
    text: 'Cũng có thể dịch: “rồi thờ phượng hướng về phía đầu gậy của mình.” Cụm từ này có lẽ mô tả tư thế của Gia-cốp, chứ không nói rằng cây gậy là đối tượng ông thờ phượng.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πίστει
  choice: Bởi đức tin
  rationale: Dịch cách dùng phương tiện hoặc thể cách của danh từ πίστις trong Hê-bơ-rơ 11, cho biết hành động được thực hiện bởi đức tin.
- source_word: ἀποθνῄσκων
  choice: khi đang hấp hối
  rationale: Phân từ hiện tại diễn tả hoàn cảnh đang diễn ra đồng thời với các động từ chính; cách dịch này tự nhiên và giữ được sắc thái Gia-cốp đang ở vào lúc cận tử.
- source_word: ἕκαστον τῶν υἱῶν Ἰωσὴφ
  choice: từng người trong các con trai của Giô-sép
  rationale: 'Giữ rõ sắc thái phân phối của ἕκαστον với sở hữu cách bộ phận: mỗi người con đều được chúc phước riêng.'
- source_word: εὐλόγησεν
  choice: chúc phước
  rationale: Cách diễn đạt quen thuộc, tự nhiên trong ngữ cảnh lời chúc phước của tổ phụ và giữ được ý nghĩa giao ước của hành động.
- source_word: προσεκύνησεν
  choice: thờ phượng
  rationale: Trong ngữ cảnh này, động từ chỉ hành vi tôn kính mang tính tôn giáo, không chỉ đơn thuần là cúi mình.
- source_word: ἐπὶ τὸ ἄκρον τῆς ῥάβδου αὐτοῦ
  choice: trong khi tựa trên đầu gậy của mình
  rationale: Diễn đạt tự nhiên cách hiểu cụm giới từ mô tả tư thế của Gia-cốp, đồng thời tránh khiến độc giả hiểu cây gậy là đối tượng được thờ phượng.
theological_decisions:
- issue: Mối liên hệ giữa hành vi thờ phượng của Gia-cốp và cây gậy trong mệnh đề cuối
  choice: Gia-cốp thờ phượng Đức Chúa Trời trong khi tựa trên đầu gậy của mình.
  alternative: Gia-cốp cúi mình thờ phượng trên đầu giường, theo bản Hê-bơ-rơ của Sáng Thế Ký 47:31; hoặc ông thờ phượng hướng về phía đầu gậy.
  rationale: Bản Hy Lạp của Hê-bơ-rơ ghi “gậy,” phù hợp với dạng văn bản Hy Lạp của Sáng Thế Ký, còn bản Hê-bơ-rơ của Sáng Thế Ký có thể được hiểu là “giường.” Bản dịch chính ưu tiên nguồn Hy Lạp của câu Hê-bơ-rơ và hiểu cụm từ theo nghĩa trạng thái/tư thế; các cách đọc khác được giữ trong chú thích để không xóa bỏ sự căng thẳng liên văn bản.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Dùng “chúc phước” theo lối dùng phổ biến trong tiếng Việt Cơ Đốc; đặt cả hai dấu chú thích ngay sau cụm “đầu gậy của mình” vì cả hai đều liên quan trực tiếp đến cách hiểu mệnh đề cuối.
