  source_fidelity: 'Bản dịch phản ánh đúng cấu trúc và ý nghĩa của nguyên văn Hy Lạp: πίστει là “Bởi đức tin”; τελευτῶν được diễn đạt phù hợp là “khi sắp qua đời”; ἐμνημόνευσεν περὶ là “đã nói đến”; ἔξοδος là “cuộc ra đi”; và ἐνετείλατο περὶ τῶν ὀστέων αὐτοῦ là “truyền dặn về hài cốt của mình.” Cụm “các con trai Y-sơ-ra-ên” giữ được cách gọi gia tộc có tính minh thị của τῶν υἱῶν Ἰσραήλ.'
  naturalness: Văn câu hiện đại, trang trọng và tự nhiên. “Bởi đức tin” phù hợp với điệp thức của Hê-bơ-rơ 11. “Truyền dặn về hài cốt của mình” là lối nói rõ ràng, thích hợp trong ngữ cảnh Giô-sép đưa ra chỉ thị về những gì sẽ diễn ra sau khi ông qua đời.
