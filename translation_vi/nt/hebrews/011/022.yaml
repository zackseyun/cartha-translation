id: HEB.11.22
reference: Hebrews 11:22
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: πίστει Ἰωσὴφ τελευτῶν περὶ τῆς ἐξόδου τῶν υἱῶν Ἰσραὴλ ἐμνημόνευσεν, καὶ περὶ τῶν ὀστέων αὐτοῦ ἐνετείλατο.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/022.yaml
  text: By faith Joseph, as he was nearing the end of his life, mentioned the exodus of the sons of Israel and gave instructions concerning his bones.
translation:
  language: vi
  text: Bởi đức tin, khi sắp qua đời[a], Giô-sép đã nói đến cuộc ra đi[b] của các con trai Y-sơ-ra-ên và truyền dặn về hài cốt của mình.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “khi đang hấp hối.”'
    reason: lexical_alternative
  - marker: b
    text: Tức là cuộc xuất hành của các con trai Y-sơ-ra-ên khỏi Ai Cập.
    reason: lexical_clarification
lexical_decisions:
- source_word: πίστει
  choice: Bởi đức tin
  rationale: Giữ công thức lặp lại trong Hê-bơ-rơ 11; cách dùng sở cách ở đây diễn tả phương tiện hoặc nền tảng của hành động.
- source_word: τελευτῶν
  choice: khi sắp qua đời
  rationale: Diễn đạt tự nhiên phân từ mang nghĩa đang đi đến cuối đời hoặc hấp hối, đồng thời tránh hàm ý rằng lời này nhất thiết được nói ngay trong giây phút chết.
- source_word: περὶ τῆς ἐξόδου
  choice: nói đến cuộc ra đi
  rationale: ἐμνημόνευσεν với περὶ có nghĩa là nhắc hoặc nói đến; ἔξοδος ở đây chỉ việc dân Y-sơ-ra-ên tương lai rời Ai Cập. 'Cuộc ra đi' giữ nghĩa từ vựng rộng hơn, còn liên hệ lịch sử vẫn rõ theo ngữ cảnh.
- source_word: τῶν υἱῶν Ἰσραήλ
  choice: của các con trai Y-sơ-ra-ên
  rationale: Giữ hình ảnh gia tộc được diễn đạt rõ trong tiếng Hy Lạp, thay vì giản lược thành 'dân Y-sơ-ra-ên'.
- source_word: ἐνετείλατο
  choice: truyền dặn
  rationale: Diễn đạt tự nhiên hành động đưa ra chỉ thị có tính ràng buộc của Giô-sép.
- source_word: περὶ τῶν ὀστέων αὐτοῦ
  choice: về hài cốt của mình
  rationale: Trong tiếng Việt, 'hài cốt' là cách nói tự nhiên và chính xác về xương của người đã chết; 'của mình' quy chiếu rõ về Giô-sép.
theological_decisions:
- issue: Cách dịch πίστις trong Hê-bơ-rơ 11
  choice: đức tin
  alternative: lòng trung tín; sự tin cậy
  rationale: Công thức xuyên suốt chương nhấn mạnh đức tin bởi đó các nhân vật hành động; không có lý do ngữ cảnh đủ mạnh để chuyển sang nghĩa 'lòng trung tín'.
- issue: Ý nghĩa của ἔξοδος
  choice: cuộc ra đi
  alternative: cuộc xuất hành
  rationale: Từ này rõ ràng ám chỉ việc Y-sơ-ra-ên rời Ai Cập, nhưng bản thân danh từ Hy Lạp cũng có nghĩa thông thường là 'sự ra đi'. Bản chính giữ sắc thái từ vựng này và chú thích cách gọi lịch sử quen thuộc.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng 'Giô-sép' và 'Y-sơ-ra-ên' theo lối phiên âm Kinh Thánh quen thuộc; giữ 'các con trai Y-sơ-ra-ên' để phản ánh cấu trúc gia tộc của nguyên văn. Các dấu chú thích đều xuất hiện trong bản chính.
