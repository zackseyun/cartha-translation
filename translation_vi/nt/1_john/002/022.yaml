id: 1JN.2.22
reference: 1 John 2:22
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: τίς ἐστιν ὁ ψεύστης εἰ μὴ ὁ ἀρνούμενος ὅτι Ἰησοῦς οὐκ ἔστιν ὁ χριστός; οὗτός ἐστιν ὁ ἀντίχριστος, ὁ ἀρνούμενος τὸν πατέρα καὶ τὸν υἱόν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/022.yaml
  text: 'Who is the liar except the one who denies that Jesus is the Messiah? This is the antichrist: the one who denies the Father and the Son[a][b].'
translation:
  language: vi
  text: Ai là kẻ nói dối, nếu không phải là kẻ phủ nhận rằng Đức Giê-su không phải là Đấng Mê-si-a?[a] Kẻ ấy là kẻ chống Đấng Mê-si-a:[b] kẻ phủ nhận Đức Chúa Cha và Đức Chúa Con.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Đấng Ki-tô.” Từ Hy Lạp ὁ χριστός ở đây được dùng như một tước hiệu và có nghĩa là “Đấng Mê-si-a.”'
    reason: alternative_reading
  - marker: b
    text: 'Cũng có thể dịch: “kẻ phản Ki-tô” hoặc phiên âm là “Antichrist.” Tiếng Hy Lạp có mạo từ xác định; trong các thư của Giăng, từ này có thể chỉ kiểu người chống nghịch được nhận diện qua việc phủ nhận Đức Chúa Cha và Đức Chúa Con, chứ câu này tự nó không buộc phải chỉ một nhân vật cánh chung duy nhất.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ψεύστης
  choice: kẻ nói dối
  rationale: Danh từ có mạo từ xác định, chỉ kẻ nói dối tiêu biểu trong ngữ cảnh tranh luận; cách diễn đạt này tự nhiên và giữ sắc thái xác định.
- source_word: ἀρνούμενος
  choice: kẻ phủ nhận
  rationale: Phân từ hiện tại dùng như danh từ, mô tả đặc tính hoặc hành động liên tục của người ấy.
- source_word: ὅτι Ἰησοῦς οὐκ ἔστιν ὁ χριστός
  choice: rằng Đức Giê-su không phải là Đấng Mê-si-a
  rationale: Giữ nguyên nội dung phủ nhận do ὅτι dẫn vào và diễn đạt Χριστός như một tước hiệu cứu thế.
- source_word: ὁ χριστός
  choice: Đấng Mê-si-a
  rationale: Ở đây từ này là tước hiệu, nên dịch theo ý nghĩa thay vì coi như một phần tên riêng.
- source_word: ἀντίχριστος
  choice: kẻ chống Đấng Ki-tô
  rationale: Cách dịch minh bạch nghĩa đối kháng của ἀντί- và dùng dạng quen thuộc Ki-tô trong thuật ngữ Việt ngữ; ghi chú nêu cách phiên âm truyền thống để tránh thu hẹp từ này vào một nhân vật cánh chung duy nhất.
- source_word: πατέρα
  choice: Đức Chúa Cha
  rationale: Trong quan hệ song song với Đức Chúa Con, từ này chỉ riêng Đức Chúa Trời là Cha.
- source_word: υἱόν
  choice: Đức Chúa Con
  rationale: Chỉ Người Con trong tương quan Cha–Con của thần học Giăng.
- source_word: οὗτός ἐστιν
  choice: Kẻ ấy là
  rationale: Đại từ chỉ định quy chiếu về người vừa được mô tả và nhấn mạnh sự đồng nhất.
theological_decisions:
- issue: Cách dịch Χριστός trong công thức phủ nhận về căn tính của Đức Giê-su
  choice: Đấng Mê-si-a
  alternative: Đấng Ki-tô
  rationale: Ngữ cảnh dùng từ như một tước hiệu; “Đấng Mê-si-a” làm rõ lời tuyên xưng cứu thế đang bị phủ nhận mà không biến tước hiệu thành tên riêng.
- issue: Phạm vi quy chiếu của ἀντίχριστος
  choice: kẻ chống Đấng Ki-tô
  alternative: kẻ phản Ki-tô; kẻ địch lại Đấng Mê-si-a
  rationale: Giữ tính xác định của mạo từ và ý nghĩa đối kháng nhưng không quyết định rằng câu này chỉ nói về một nhân vật cánh chung duy nhất; chính câu định nghĩa người ấy bằng việc phủ nhận Đức Chúa Cha và Đức Chúa Con.
translation_notes:
  register: 'Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “kẻ” để giữ giọng luận chiến của câu; dùng “Đức Giê-su,” “Đức Chúa Cha,” và “Đức Chúa Con” theo lối gọi tôn kính phổ biến. Hai lần dùng Χριστός được diễn đạt khác nhau có chủ ý: “Đấng Mê-si-a” làm rõ tước hiệu trong lời tuyên xưng, còn “kẻ chống Đấng Ki-tô” giữ thuật ngữ ἀντίχριστος tự nhiên trong tiếng Việt và được giải thích bằng chú thích.'
