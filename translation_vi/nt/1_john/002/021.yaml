id: 1JN.2.21
reference: 1 John 2:21
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οὐκ ἔγραψα ὑμῖν ὅτι οὐκ οἴδατε τὴν ἀλήθειαν, ἀλλ’ ὅτι οἴδατε αὐτήν, καὶ ὅτι πᾶν ψεῦδος ἐκ τῆς ἀληθείας οὐκ ἔστιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/021.yaml
  text: I have not written to you because you do not know the truth[a], but because you do know it[b], and because no lie is from the truth.
translation:
  language: vi
  text: Tôi viết cho anh em[a] không phải vì anh em không biết chân lý, nhưng vì anh em biết chân lý ấy, và vì không một điều giả dối nào bắt nguồn từ chân lý.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Tôi đã viết cho anh em.” Động từ Hy Lạp ở thì aorist có thể được hiểu là quá khứ đơn; “tôi viết” phù hợp với bối cảnh tác giả đang viết chính bức thư này.'
    reason: lexical_alternative
  - marker: b
    text: 'Sát hơn: “mọi điều giả dối đều không từ chân lý mà ra.”'
    reason: formal_alternative
lexical_decisions:
- source_word: ἔγραψα
  choice: Tôi viết
  rationale: Động từ ở thì aorist có thể chỉ hành động viết trong quá khứ, nhưng trong bối cảnh thư tín, tiếng Việt tự nhiên có thể dùng “tôi viết” để nói về chính bức thư người nhận đang đọc. Cách dịch này không buộc phải xác định là quá khứ đơn hay hoàn thành.
- source_word: οἴδατε
  choice: anh em biết
  rationale: οἴδατε có nghĩa là “biết”. Sự nhấn mạnh do thế tương phản giữa “không biết” và “biết” được thể hiện tự nhiên bằng cấu trúc “không phải… nhưng vì…”.
- source_word: ἡ ἀλήθεια / τῆς ἀληθείας
  choice: chân lý
  rationale: “Chân lý” là cách diễn đạt trang trọng nhưng thông dụng, phù hợp với danh từ có mạo từ và giữ được chiều sâu trong cách dùng của Giăng mà không thu hẹp thành “sứ điệp thật” hay một diễn giải giáo lý cụ thể.
- source_word: αὐτήν
  choice: chân lý ấy
  rationale: Đại từ chỉ trở lại τὴν ἀλήθειαν. Lặp lại “chân lý ấy” rõ nghĩa và tự nhiên hơn đại từ “nó” đối với một danh từ trừu tượng trong tiếng Việt.
- source_word: πᾶν ψεῦδος
  choice: không một lời dối trá nào
  rationale: Cấu trúc Hy Lạp theo nghĩa sát là “mọi điều dối trá… không”, nhưng tiếng Việt diễn đạt phép phủ định phổ quát tự nhiên bằng “không một… nào”. “Lời dối trá” phù hợp với ngữ cảnh về những tuyên bố sai trái, song không giới hạn câu vào một lời nói cụ thể.
- source_word: ἐκ τῆς ἀληθείας οὐκ ἔστιν
  choice: không… bắt nguồn từ chân lý
  rationale: ἐκ biểu thị nguồn gốc hoặc xuất xứ. “Bắt nguồn từ” truyền đạt rõ quan hệ này trong tiếng Việt hiện đại, thay vì cách nói cứng “không thuộc từ chân lý”.
theological_decisions:
- issue: Nội hàm của “chân lý” trong văn chương Giăng
  choice: Giữ nguyên cách gọi rộng là “chân lý”.
  alternative: “sứ điệp chân thật” hoặc “chân lý Phúc Âm”
  rationale: Câu này có thể hàm chứa chiều sâu thần học, nhưng bản văn không trực tiếp thu hẹp “chân lý” vào một công thức cụ thể. Không diễn giải thêm giúp bảo toàn độ rộng của nguyên văn.
- issue: Mối quan hệ giữa sự dối trá và chân lý
  choice: 'Diễn đạt như một tuyên bố về nguồn gốc: “không một lời dối trá nào bắt nguồn từ chân lý”.'
  alternative: “không một lời dối trá nào thuộc về chân lý”
  rationale: Giới từ ἐκ chủ yếu đánh dấu nguồn gốc. Bản dịch giữ sự đối lập thần học giữa chân lý và dối trá nhưng không mở rộng thành một mệnh đề siêu hình vượt quá lời văn.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “anh em” theo lối xưng hô cộng đồng quen thuộc trong thư tín Tân Ước; giữ câu cân đối để làm nổi bật sự tương phản giữa không biết, biết và dối trá.
