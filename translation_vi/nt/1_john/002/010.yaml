revisions:
- from: Người yêu thương anh em mình thì ở lại trong ánh sáng, và trong người ấy không có điều gì gây vấp ngã.[a]
  to: Người yêu thương người anh em của mình thì ở lại trong ánh sáng, và trong người ấy không có nguyên cớ gây vấp ngã.[a]
  rationale: Sửa “anh em mình” thành “người anh em của mình” để phản ánh danh từ số ít trong bản Hy Lạp. Thay “điều gì gây vấp ngã” bằng “nguyên cớ gây vấp ngã” để diễn đạt σκάνδαλον rõ và tự nhiên hơn. Chú thích được giữ nguyên để bảo tồn cách hiểu thay thế về mệnh đề cuối.
