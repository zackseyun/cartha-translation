base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/010.yaml
  text: The one who loves his brother remains in the light[a], and there is no cause for stumbling in him.
translation:
  language: vi
  text: Người yêu thương người anh em của mình thì ở lại trong ánh sáng, và trong người ấy không có nguyên cớ gây vấp ngã.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “và không có chướng ngại nào khiến người ấy vấp ngã.” Cụm từ Hy Lạp có thể được hiểu là nói về điều không có trong người ấy, hoặc điều không xuất hiện trước người ấy để khiến người ấy vấp ngã.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ ἀγαπῶν
  choice: Người yêu thương
  rationale: Phân từ hiện tại có mạo từ được dùng như danh từ, chỉ một người theo nghĩa khái quát và hàm ý hành động tiếp diễn; cách dịch này tự nhiên và giữ được sắc thái ấy.
- source_word: τὸν ἀδελφὸν αὐτοῦ
  choice: anh em mình
  rationale: ἀδελφός ở giống đực số ít, nhưng trong ngữ cảnh cộng đồng đức tin, tiếng Việt tự nhiên dùng “anh em” để chỉ người cùng cộng đồng; “mình” diễn đạt quan hệ quy chiếu về chủ thể mà không gượng ép.
- source_word: ἐν τῷ φωτὶ
  choice: trong ánh sáng
  rationale: Giữ nguyên hình ảnh ẩn dụ quan trọng trong văn chương Gio-an và là cách nói tự nhiên trong tiếng Việt.
- source_word: μένει
  choice: ở lại
  rationale: Diễn đạt nghĩa tiếp tục ở trong một tình trạng hay mối liên hệ, đồng thời duy trì sự nhất quán với động từ chủ chốt μένω trong văn chương Gio-an.
- source_word: σκάνδαλον
  choice: điều gì gây vấp ngã
  rationale: σκάνδαλον có thể chỉ vật cản, cạm bẫy hay nguyên nhân khiến vấp ngã; cách dịch này giữ hình ảnh đạo đức mà không khiến người đọc chỉ hiểu theo nghĩa vật thể.
- source_word: ἐν αὐτῷ
  choice: trong người ấy
  rationale: Đại từ giống đực số ít tự nhiên nhất quy chiếu về người yêu thương; bản dịch sát cấu trúc Hy Lạp và không quyết định người ấy làm chính mình hay người khác vấp ngã.
- source_word: οὐκ ἔστιν
  choice: không có
  rationale: Cấu trúc hiện hữu này là cách diễn đạt tự nhiên, trực tiếp trong tiếng Việt.
theological_decisions:
- issue: Ý nghĩa và quan hệ cú pháp của καὶ σκάνδαλον ἐν αὐτῷ οὐκ ἔστιν
  choice: trong người ấy không có điều gì gây vấp ngã
  alternative: không có chướng ngại nào khiến người ấy vấp ngã
  rationale: ἐν αὐτῷ có thể mô tả điều không hiện diện trong người ấy hoặc được hiểu theo hướng không có chướng ngại đối với người ấy. Bản chính giữ cách hiểu trực tiếp hơn về mặt cú pháp nhưng không xác định người bị gây vấp ngã; chú thích bảo lưu cách hiểu còn lại.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. “Ở lại trong ánh sáng” bảo tồn ngôn ngữ biểu tượng của Gio-an; “điều gì gây vấp ngã” tự nhiên hơn “cớ vấp phạm” trong lời văn hiện đại.
