    issue: “anh em mình” không giữ rõ số ít của τὸν ἀδελφὸν αὐτοῦ.
    rationale: Cụm này trong tiếng Việt thường chỉ các anh em nói chung hoặc một tập thể. Bản Hy Lạp dùng “người anh em của mình” ở số ít; sửa thành “người anh em của mình” bảo toàn chi tiết này mà không áp đặt nghĩa “đồng tín hữu.”
  - severity: low
    issue: “điều gì gây vấp ngã” hơi chung chung đối với σκάνδαλον.
    rationale: “Nguyên cớ gây vấp ngã” tự nhiên hơn trong văn cảnh đạo đức và vẫn giữ được hình ảnh về nguyên nhân/vật cản gây vấp ngã, không giải quyết dứt khoát sự mơ hồ của ἐν αὐτῷ.
  revised_text: Người yêu thương người anh em của mình thì ở lại trong ánh sáng, và trong người ấy không có nguyên cớ gây vấp ngã.[a]
