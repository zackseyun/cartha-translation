id: 1JN.2.23
reference: 1 John 2:23
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: πᾶς ὁ ἀρνούμενος τὸν υἱὸν οὐδὲ τὸν πατέρα ἔχει· ⸂ὁ ὁμολογῶν τὸν υἱὸν καὶ τὸν πατέρα ἔχει⸃.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/023.yaml
  text: Everyone who denies the Son does not have the Father either[a]; whoever confesses the Son has the Father also.
translation:
  language: vi
  text: Ai chối Con thì cũng không có Cha; ai tuyên xưng Con thì cũng có Cha.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Một số thủ bản không có mệnh đề: “ai tuyên xưng Con thì cũng có Cha.”'
    reason: textual_variant
lexical_decisions:
- source_word: πᾶς ὁ ἀρνούμενος
  choice: Ai chối bỏ
  rationale: Cụm phân từ hiện tại có mạo từ mang nghĩa khái quát. “Ai chối bỏ” tự nhiên trong tiếng Việt, giữ phạm vi phổ quát mà không dịch cứng theo cấu trúc Hy Lạp.
- source_word: ἀρνούμενος
  choice: chối bỏ
  rationale: Trong văn cảnh tuyên tín, động từ này chỉ việc phủ nhận và khước từ Con. “Chối bỏ” diễn đạt rõ hơn “phủ nhận” rằng đây không chỉ là bác bỏ một mệnh đề, đồng thời không thêm ý niệm giáo phái.
- source_word: τὸν υἱὸν
  choice: Con
  rationale: Nguyên văn chỉ dùng tước hiệu xác định “Con”, không thêm “của Đức Chúa Trời”. Trong cặp đối ứng với “Cha”, tiếng Việt có thể dùng “Con” như một tước hiệu.
- source_word: οὐδὲ
  choice: cũng không
  rationale: 'Cách diễn đạt này chuyển tự nhiên quan hệ phủ định liên kết: người chối bỏ Con thì đồng thời không có Cha.'
- source_word: τὸν πατέρα ἔχει
  choice: có Cha
  rationale: Giữ nguyên thành ngữ thần học mạnh của tác giả thay vì diễn giải thành “thông công với Cha” hay “thuộc về Cha”.
- source_word: ὁ ὁμολογῶν
  choice: ai tuyên xưng
  rationale: Phân từ có mạo từ mang nghĩa khái quát. “Tuyên xưng” giữ sắc thái công khai, rõ ràng của ὁμολογέω tốt hơn từ nhẹ hơn như “thừa nhận”.
- source_word: καὶ
  choice: cũng
  rationale: Trong cấu trúc đối xứng với οὐδὲ ở mệnh đề trước, “cũng” làm rõ rằng người tuyên xưng Con đồng thời có Cha.
theological_decisions:
- issue: Mệnh đề thứ hai được đặt trong dấu ngoặc văn bản ở SBLGNT
  choice: Giữ mệnh đề “còn ai tuyên xưng Con thì cũng có Cha” trong chính văn.
  alternative: Lược bỏ mệnh đề này vì một số thủ bản không có.
  rationale: SBLGNT vẫn in mệnh đề trong văn bản được cung cấp nhưng đánh dấu có dị bản. Vì vậy, bản dịch giữ mệnh đề trong chính văn và ghi nhận dị bản ở chú thích.
- issue: Ý nghĩa quan hệ của cách nói “có Cha”
  choice: Giữ cách nói “có Cha” mà không diễn giải.
  alternative: Dịch thành “thông công với Cha” hoặc “thuộc về Cha”.
  rationale: Nguyên văn dùng ἔχει, “có”. Giữ nguyên cách nói của Giăng bảo toàn sức nặng và độ mở thần học, không thu hẹp nó vào một loại quan hệ cụ thể.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng cặp “Con/Cha” như các tước hiệu trong văn cảnh, đồng thời dùng “chối bỏ/tuyên xưng” để giữ thế đối lập mang tính tuyên tín. Dấu chú thích [a] được đặt sau toàn mệnh đề có dị bản.
