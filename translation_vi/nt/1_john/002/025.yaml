  text: καὶ αὕτη ἐστὶν ἡ ἐπαγγελία ἣν αὐτὸς ἐπηγγείλατο ἡμῖν, τὴν ζωὴν τὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/025.yaml
  text: 'And this is the promise that he himself promised us: eternal life[a][b].'
translation:
  language: vi
  text: 'Và đây là lời hứa mà chính Ngài đã hứa với chúng ta: sự sống đời đời.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Chính Ngài” mang ý nhấn mạnh trong tiếng Hy Lạp. Câu này không nói rõ đại từ ấy chỉ Đức Chúa Cha hay Đức Chúa Con.
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ αὕτη ἐστὶν
  choice: Và đây là
  rationale: Cách diễn đạt trực tiếp, tự nhiên, vừa nối với mạch văn trước vừa giới thiệu nội dung của lời hứa.
- source_word: ἡ ἐπαγγελία ... ἐπηγγείλατο
  choice: lời hứa ... đã hứa
  rationale: Giữ mối liên hệ cùng gốc giữa danh từ và động từ trong tiếng Hy Lạp; sự lặp lại cũng phù hợp với lối nhấn mạnh của nguyên văn.
- source_word: αὐτός
  choice: chính Ngài
  rationale: “Chính” bảo toàn sắc thái nhấn mạnh của đại từ αὐτός; “Ngài” là đại từ tôn kính tự nhiên trong văn phong Kinh Thánh tiếng Việt mà không xác định thêm đó là Đức Chúa Cha hay Đức Chúa Con.
- source_word: ἡμῖν
  choice: với chúng ta
  rationale: Diễn đạt tự nhiên đối tượng tiếp nhận lời hứa trong tiếng Việt và giữ phạm vi bao gồm người viết cùng độc giả.
- source_word: τὴν ζωὴν τὴν αἰώνιον
  choice: sự sống đời đời
  rationale: Cụm từ quen thuộc, rõ nghĩa trong tiếng Việt, chỉ nội dung của lời hứa và phản ánh cấu trúc xác định của cụm danh từ Hy Lạp.
theological_decisions:
- issue: Đối tượng được đại từ nhấn mạnh αὐτός chỉ đến
  choice: chính Ngài
  alternative: chính Đức Chúa Cha; chính Đức Chúa Con
  rationale: Câu Hy Lạp không nêu lại danh tính của đối tượng. Bản dịch giữ nguyên độ mở của văn bản thay vì quyết định thay người đọc.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Giữ phép lặp “lời hứa ... đã hứa” để phản ánh nguyên văn; dùng “sự sống đời đời” theo cách nói Kinh Thánh phổ biến.
