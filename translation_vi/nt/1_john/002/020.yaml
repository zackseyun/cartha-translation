  text: καὶ ὑμεῖς χρῖσμα ἔχετε ἀπὸ τοῦ ἁγίου ⸀καὶ οἴδατε ⸀πάντες·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/020.yaml
  text: But you have an anointing from the Holy One[a], and you all know.
translation:
  language: vi
  text: Nhưng anh chị em có sự xức dầu từ Đấng Thánh[a], và tất cả đều biết.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Một dị bản có thể dịch phần cuối câu là: “và anh chị em biết mọi sự.” Cách đọc của SBLGNT hỗ trợ bản dịch: “và tất cả đều biết.”'
    reason: textual_variant
lexical_decisions:
- source_word: καὶ
  choice: Nhưng
  rationale: Ở đầu câu, καί tạo thế tương phản với những kẻ chống Đấng Christ trong câu trước; “Nhưng” diễn đạt tự nhiên chức năng diễn ngôn ấy.
- source_word: ὑμεῖς
  choice: anh chị em
  rationale: Đại từ số nhiều có tính nhấn mạnh và chỉ cộng đồng người đọc; “anh chị em” là cách xưng hô tự nhiên, trang trọng và bao quát trong tiếng Việt.
- source_word: χρῖσμα
  choice: sự xức dầu
  rationale: Giữ nguyên hình ảnh xức dầu của nguyên văn, không diễn giải hẹp thành Đức Thánh Linh hay một ân tứ cụ thể.
- source_word: ἔχετε
  choice: đã nhận
  rationale: Trong tiếng Việt, “đã nhận sự xức dầu” tự nhiên hơn “có sự xức dầu” và diễn đạt tình trạng hiện tại bắt nguồn từ việc được ban cho, phù hợp với ἀπὸ; không xác định thêm tác nhân hay bản chất của sự xức dầu.
- source_word: ἀπὸ τοῦ ἁγίου
  choice: từ Đấng Thánh
  rationale: Bảo tồn danh xưng trong tiếng Hy Lạp mà không xác định đó là Đức Chúa Cha hay Đức Chúa Con.
- source_word: καὶ
  choice: và
  rationale: Liên từ thứ hai nối hai mệnh đề một cách trực tiếp.
- source_word: οἴδατε
  choice: biết
  rationale: Tương đương trực tiếp, tự nhiên của động từ chỉ sự biết hoặc nhận biết.
- source_word: πάντες
  choice: tất cả anh chị em đều
  rationale: 'Đọc πάντες ở dạng chủ cách số nhiều: toàn thể người nhận thư đều biết, chứ không phải họ biết mọi sự.'
theological_decisions:
- issue: Đấng được gọi là “Đấng Thánh”
  choice: Giữ nguyên “Đấng Thánh”, không xác định cụ thể.
  alternative: Đức Chúa Cha; Đức Chúa Con/Chúa Giê-su Christ
  rationale: Nguyên văn không nêu rõ đối tượng, và ngữ cảnh có thể được hiểu theo hơn một hướng; bản dịch cần giữ sự mở này.
- issue: Ý nghĩa của χρῖσμα
  choice: Dịch là “sự xức dầu” và giữ nguyên tính ẩn dụ.
  alternative: Đức Thánh Linh; sự xức dầu của Đức Thánh Linh; ân tứ xức dầu
  rationale: Dù hình ảnh thường được hiểu là Đức Thánh Linh hoặc công việc của Ngài, nguyên văn dùng danh từ “sự xức dầu”; không nên đưa cách giải thích vào chính câu dịch.
- issue: Cách hiểu πάντες
  choice: “tất cả anh chị em đều biết”
  alternative: “anh chị em biết mọi sự”
  rationale: Văn bản SBLGNT đã cho đọc πάντες là chủ cách số nhiều, bổ nghĩa cho chủ thể của οἴδατε; cách đọc biến thể có thể cho nghĩa “mọi sự” và được ghi chú.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh chị em” cho đại từ số nhiều chỉ cộng đồng tín hữu; giữ các hình ảnh và danh xưng thần học của nguyên văn mà không giải nghĩa quá mức.
