revisions:
- from: Nhưng anh chị em đã nhận sự xức dầu từ Đấng Thánh[a], và tất cả anh chị em đều biết.
  to: Nhưng anh chị em có sự xức dầu từ Đấng Thánh[a], và tất cả đều biết.
  rationale: Đổi «đã nhận» thành «có» để phản ánh trực tiếp thì hiện tại ἔχετε và không thêm sắc thái về thời điểm tiếp nhận. Rút gọn vế sau để tiếng Việt tự nhiên hơn, đồng thời vẫn diễn đạt πάντες là toàn thể người nhận thư. Chú thích giữ nguyên chức năng nêu biến thể «biết mọi sự» đối lập với cách đọc SBLGNT.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T00:30:11Z'
review_pass:
  verdict: revise
  source_fidelity: Bản thảo giữ đúng tương phản của καί, danh xưng mở «Đấng Thánh», hình ảnh χρῖσμα, và cách đọc SBLGNT πάντες («tất cả ... đều biết»). Tuy nhiên, ἔχετε là thì hiện tại «có», không nói rõ hành động đã nhận trong quá khứ. «Đã nhận» thêm sắc thái thể và chuyển trọng tâm từ sự sở hữu hiện tại sang sự tiếp nhận.
  naturalness: «Nhưng anh chị em có sự xức dầu từ Đấng Thánh, và tất cả đều biết» là tiếng Việt hiện đại, trang trọng, mạch lạc. Không cần lặp lại «anh chị em» sau «tất cả», vì chủ ngữ đã rõ.
  terminology: «Sự xức dầu» bảo toàn phép ẩn dụ của χρῖσμα; «Đấng Thánh» bảo toàn sự không xác định về quy chiếu; «anh chị em» phù hợp văn cảnh thư tín gửi cộng đồng.
  issues:
  - severity: medium
    issue: «đã nhận» cho ἔχετε
    rationale: ἔχετε là hiện tại chủ động, nghĩa trực tiếp là «có». Dù việc được ban có thể được hàm ý trong bối cảnh, «đã nhận» không phải là cách biểu đạt trung tính nhất và thêm một sắc thái thời-thể không có trong câu Hy Lạp.
  revised_text: Nhưng anh chị em có sự xức dầu từ Đấng Thánh[a], và tất cả đều biết.
  revised_footnotes:
