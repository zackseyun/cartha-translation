    reason: textual_variant
  revision_rationale: Đổi «đã nhận» thành «có» để phản ánh trực tiếp thì hiện tại ἔχετε và không thêm sắc thái về thời điểm tiếp nhận. Rút gọn vế sau để tiếng Việt tự nhiên hơn, đồng thời vẫn diễn đạt πάντες là toàn thể người nhận thư. Chú thích giữ nguyên chức năng nêu biến thể «biết mọi sự» đối lập với cách đọc SBLGNT.
