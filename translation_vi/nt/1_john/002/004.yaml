id: 1JN.2.4
reference: 1 John 2:4
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὁ λέγων ⸀ὅτι Ἔγνωκα αὐτὸν καὶ τὰς ἐντολὰς αὐτοῦ μὴ τηρῶν ψεύστης ἐστίν, καὶ ἐν τούτῳ ἡ ἀλήθεια οὐκ ἔστιν·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/004.yaml
  text: The one who says[a], “I have come to know him,” and does not keep his commandments is a liar[b], and the truth is not in him.
translation:
  language: vi
  text: 'Người nào nói: “Tôi đã biết Ngài,”[a] mà không giữ các điều răn của Ngài, thì người ấy là kẻ nói dối, và lẽ thật không ở trong người ấy.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Tôi biết Ngài.” Thì hoàn thành trong tiếng Hy Lạp diễn tả một trạng thái nhận biết hiện có, phát sinh từ việc đã đi đến chỗ nhận biết trước đó.'
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn: “trong người này”; cũng có thể hiểu là “trong một người như thế.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ λέγων
  choice: Người nào nói
  rationale: Phân từ hiện tại có mạo từ được dùng như danh từ và mang nghĩa khái quát; cách dịch này tự nhiên trong tiếng Việt hiện đại.
- source_word: Ἔγνωκα
  choice: Tôi đã biết
  rationale: Thì hoàn thành diễn tả một trạng thái hiện tại phát sinh từ việc nhận biết trước đó. “Đã biết” giữ được phần nào sắc thái ấy mà vẫn tự nhiên; chú thích nêu cách dịch đơn giản hơn.
- source_word: αὐτὸν / αὐτοῦ
  choice: Ngài / của Ngài
  rationale: Đại từ chỉ về Đấng được nhắc trong văn cảnh, nhiều khả năng là Đức Chúa Trời, nhưng bản dịch không gọi đích danh để khỏi giải quyết quá mức sự gần gũi giữa Đức Chúa Trời và Đấng Christ trong văn mạch Giăng.
- source_word: τὰς ἐντολὰς αὐτοῦ
  choice: các điều răn của Ngài
  rationale: “Điều răn” giữ sắc thái trang trọng và sự liên hệ quen thuộc của ἐντολή với các mệnh lệnh của Đức Chúa Trời.
- source_word: μὴ τηρῶν
  choice: mà không giữ
  rationale: τηρέω trong văn chương Giăng thường mang nghĩa tuân giữ hoặc gìn giữ; “giữ” bảo toàn hình ảnh nguyên ngữ và hàm ý thực hành liên tục.
- source_word: ψεύστης
  choice: kẻ nói dối
  rationale: Danh từ vị ngữ trực tiếp mô tả người ấy; cách dịch này tự nhiên và giữ nguyên sức nặng đạo đức của nguyên văn.
- source_word: ἐν τούτῳ
  choice: ở trong người ấy
  rationale: Đại từ chỉ lại người vừa được mô tả. “Người ấy” tự nhiên, rõ nghĩa và không buộc dùng đại từ mang giới tính.
- source_word: ἡ ἀλήθεια οὐκ ἔστιν
  choice: lẽ thật không ở
  rationale: “Lẽ thật” giữ chiều sâu vừa nhận thức vừa đạo đức-thuộc linh trong cách dùng của Giăng; cấu trúc đơn giản phản ánh sát mệnh đề phủ định của Hy Lạp.
theological_decisions:
- issue: Đối tượng của αὐτόν / αὐτοῦ
  choice: Giữ bằng đại từ kính trọng “Ngài” thay vì nêu danh Đức Chúa Trời hay Đấng Christ
  alternative: Dịch rõ là “Đức Chúa Trời” hoặc “Đấng Christ”
  rationale: Văn cảnh gần nhất nghiêng về Đức Chúa Trời, nhưng thần học Giăng liên kết chặt chẽ Đức Chúa Trời với Con Ngài. Giữ đại từ bảo toàn cách diễn đạt và độ mở của nguyên văn.
- issue: Sắc thái của Ἔγνωκα
  choice: “Tôi đã biết Ngài” với chú thích giải thích trạng thái nhận biết còn tiếp diễn
  alternative: “Tôi biết Ngài”
  rationale: Thì hoàn thành chỉ kết quả hiện tại của việc đi đến chỗ nhận biết, nhưng tiếng Việt không nên bị ép thành một cách nói nặng nề như “đã đi đến chỗ nhận biết.”
- issue: Ý nghĩa của “biết” trong văn mạch Giăng
  choice: Giữ động từ “biết” mà không diễn giải thành “có mối quan hệ với”
  alternative: Diễn ý là “tôi có mối quan hệ với Ngài”
  rationale: “Biết” có chiều kích tương giao trong văn mạch, song việc thay bằng một diễn giải quan hệ sẽ thu hẹp và giải nghĩa thay cho nguyên văn.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Ngài” cho đại từ quy chiếu về Đức Chúa Trời hoặc Đấng Christ; dùng “người ấy” để chuyển τούτῳ tự nhiên và tránh thêm giới tính không cần thiết. Mọi dấu chú thích đều xuất hiện trong câu chính.
