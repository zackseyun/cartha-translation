  verdict: approve
  source_fidelity: 'Bản dịch truyền đạt đúng cấu trúc và ý nghĩa của câu Hy Lạp: chủ ngữ khái quát “ὁ λέγων,” lời tự nhận ở thì hoàn thành “Ἔγνωκα,” sự không tuân giữ các điều răn, lời kết án “ψεύστης,” và mệnh đề kết “ἡ ἀλήθεια οὐκ ἔστιν.” “Tôi đã biết Ngài” là cách chuyển tự nhiên, có thể chấp nhận được cho thì hoàn thành; chú thích giải thích đúng sắc thái kết quả hiện tại. “Ở trong người ấy” phản ánh hợp lý ἐν τούτῳ mà không áp đặt giới tính hay định danh quá mức đối tượng quy chiếu.'
  naturalness: Câu văn hiện đại, trang trọng vừa phải và dễ hiểu. Cấu trúc “Người nào nói ... mà không giữ ... thì người ấy...” tự nhiên trong tiếng Việt. “Các điều răn,” “kẻ nói dối,” và “lẽ thật không ở trong người ấy” phù hợp văn phong Kinh Thánh hiện đại mà vẫn rõ nghĩa.
  terminology: “Điều răn” chuyển tải tốt ἐντολή trong văn mạch Giăng. “Giữ” bảo toàn cách dùng đặc trưng của τηρέω hơn là diễn giải thành “vâng theo.” “Lẽ thật” giữ được độ dày nghĩa của ἡ ἀλήθεια. Việc duy trì “Ngài/của Ngài” giữ độ mở quy chiếu của nguyên văn, không buộc phải chọn rõ Đức Chúa Trời hay Đấng Christ.
