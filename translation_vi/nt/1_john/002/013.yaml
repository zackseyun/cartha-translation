id: 1JN.2.13
reference: 1 John 2:13
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: γράφω ὑμῖν, πατέρες, ὅτι ἐγνώκατε τὸν ἀπ’ ἀρχῆς· γράφω ὑμῖν, νεανίσκοι, ὅτι νενικήκατε τὸν πονηρόν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/013.yaml
  text: I write to you[a], fathers, because you have known him who is from the beginning; I write to you, young men, because you have overcome the evil one.
translation:
  language: vi
  text: Tôi viết cho anh em, các bậc làm cha, vì anh em đã biết Đấng từ ban đầu[a]. Tôi viết cho anh em, các thanh niên, vì anh em đã chiến thắng Kẻ Ác.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Đấng vốn có từ ban đầu”. Cụm từ này có lẽ chỉ về Con, dù một số người hiểu rộng hơn là chỉ về Đức Chúa Trời.'
    reason: Giữ khả năng diễn đạt và quy chiếu của cụm Hy Lạp mà không giải quyết dứt khoát điều nguyên văn để ngỏ.
lexical_decisions:
- source_word: γράφω
  choice: Tôi viết
  rationale: Thì hiện tại trong văn thư được chuyển tự nhiên là “Tôi viết”, vừa trực tiếp vừa giữ sự lặp lại có chủ ý của nguyên văn.
- source_word: πατέρες
  choice: những người làm cha
  rationale: Giữ nghĩa trực tiếp của danh từ số nhiều “các người cha”, nhưng diễn đạt tự nhiên hơn trong tiếng Việt; không tự ý đổi thành “người lớn tuổi” hay “người trưởng thành thuộc linh”.
- source_word: ἐγνώκατε
  choice: đã biết
  rationale: Thì hoàn thành chỉ việc đã biết với kết quả còn tiếp diễn. “Đã biết” giữ được phương diện ấy mà không thêm ý về một tiến trình đi đến nhận biết.
- source_word: τὸν ἀπ’ ἀρχῆς
  choice: Đấng hiện hữu từ ban đầu
  rationale: Cụm có mạo từ được dùng như danh từ và chỉ một thân vị. “Đấng hiện hữu từ ban đầu” giữ nét hiện tại hàm ẩn và không nêu đích danh đối tượng.
- source_word: νεανίσκοι
  choice: những người trẻ tuổi
  rationale: Chỉ nhóm nam giới trẻ tuổi trong ngữ cảnh; cách diễn đạt này tự nhiên, trang trọng và phù hợp với lối xưng hô chung “anh em”.
- source_word: νενικήκατε
  choice: đã chiến thắng
  rationale: Thì hoàn thành diễn tả chiến thắng đã đạt được và còn hiệu lực. “Đã chiến thắng” rõ nghĩa, tự nhiên hơn “đã thắng hơn” trong tiếng Việt.
- source_word: τὸν πονηρόν
  choice: Kẻ Ác
  rationale: Mạo từ giống đực cùng tính từ được danh từ hóa nghiêng mạnh về một đối thủ ác có ngôi vị, chứ không phải sự ác trừu tượng. Viết hoa giúp biểu thị danh xưng nhưng không thêm tên riêng.
theological_decisions:
- issue: Đối tượng của cụm “Đấng hiện hữu từ ban đầu”
  choice: Giữ nguyên cách gọi gián tiếp, không nêu rõ là Con hay Đức Chúa Trời trong chính văn.
  alternative: Hiểu cụm này là chỉ về Con; hoặc rộng hơn là chỉ về Đức Chúa Trời.
  rationale: Văn phong Giăng nhiều khả năng hướng đến Con, nhưng câu Hy Lạp không nêu danh tính. Bản dịch giữ nguyên sự hàm ẩn và chú thích khả năng quy chiếu.
- issue: Ý nghĩa của “Kẻ Ác”
  choice: Một đối thủ ác có ngôi vị.
  alternative: Sự ác theo nghĩa trừu tượng.
  rationale: Hình thức giống đực số ít có mạo từ ủng hộ cách hiểu về một nhân vật, thường được hiểu là Sa-tan, nhưng bản dịch không thêm tên mà nguyên văn không có.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Giữ hai vế song song “Tôi viết cho anh em... vì...” và các cách gọi trực tiếp của nguyên văn; dùng “anh em” theo quy ước xưng hô cộng đồng, trong khi “những người làm cha” và “những người trẻ tuổi” bảo toàn các nhóm được nêu.
