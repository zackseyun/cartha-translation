revisions:
- from: Tôi viết cho anh em, những người làm cha, vì anh em đã biết Đấng hiện hữu từ ban đầu[a]. Tôi viết cho anh em, những người trẻ tuổi, vì anh em đã chiến thắng Kẻ Ác.
  to: Tôi viết cho anh em, các bậc làm cha, vì anh em đã biết Đấng từ ban đầu[a]. Tôi viết cho anh em, các thanh niên, vì anh em đã chiến thắng Kẻ Ác.
  rationale: Sửa cách gọi các nhóm để tiếng Việt hiện đại trang trọng và sát hô cách hơn. Đổi “Đấng hiện hữu từ ban đầu” thành “Đấng từ ban đầu” nhằm không thêm một khẳng định diễn giải vào cụm danh từ hóa cô đọng của nguyên ngữ; phương án diễn đạt đầy đủ hơn được giữ trong chú thích.
