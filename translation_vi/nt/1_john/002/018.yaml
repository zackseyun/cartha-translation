id: 1JN.2.18
reference: 1 John 2:18
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Παιδία, ἐσχάτη ὥρα ἐστίν, καὶ καθὼς ἠκούσατε ⸀ὅτι ἀντίχριστος ἔρχεται, καὶ νῦν ἀντίχριστοι πολλοὶ γεγόνασιν· ὅθεν γινώσκομεν ὅτι ἐσχάτη ὥρα ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/018.yaml
  text: Children[a], it is the last hour, and just as you heard that antichrist is coming, even now many antichrists have arisen[b]. From this we know that it is the last hour.
translation:
  language: vi
  text: 'Hỡi các con, đây là giờ cuối cùng. Và như các con đã nghe: “Kẻ chống Đấng Christ[a] đang đến,” thì ngay bây giờ nhiều kẻ chống Đấng Christ đã xuất hiện[b]. Từ đó, chúng ta biết rằng đây là giờ cuối cùng.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể hiểu là: “Kẻ Chống Đấng Christ.” Trong tiếng Hy Lạp, danh từ này không có mạo từ; tuy nhiên, văn cảnh có thể gợi đến một nhân vật mà độc giả đã được nghe nói đến.'
    reason: alternative_reading
  - marker: b
    text: 'Cũng có thể dịch: “đã nổi lên” hoặc “đã đến.” Động từ Hy Lạp ở thể hoàn thành nhấn mạnh rằng nhiều kẻ chống Đấng Christ đã xuất hiện và hiện vẫn đang có mặt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Παιδία
  choice: Hỡi các con
  rationale: Lối xưng hô mục vụ mang sắc thái gia đình. “Các con” tự nhiên trong tiếng Việt và không nhất thiết chỉ trẻ nhỏ; “Hỡi” đánh dấu rõ lời gọi trực tiếp trong văn phong trang trọng.
- source_word: ἐσχάτη ὥρα
  choice: giờ cuối cùng
  rationale: Giữ nguyên hình ảnh thời gian mang ý nghĩa cánh chung, không diễn giải thành một khoảng thời gian chính xác hay một hệ thống tận thế cụ thể.
- source_word: καθὼς ἠκούσατε
  choice: Như các con đã nghe
  rationale: Diễn đạt tự nhiên sự tương ứng với lời dạy độc giả đã tiếp nhận trước đó; “đã nghe” phản ánh hành động trong quá khứ.
- source_word: ἀντίχριστος
  choice: kẻ chống Đấng Christ
  rationale: Thể hiện cấu tạo và ý nghĩa của thuật ngữ trong tiếng Hy Lạp bằng tiếng Việt dễ hiểu, đồng thời giữ liên hệ từ vựng với dạng số nhiều ở sau. Danh từ Hy Lạp không có mạo từ nên bản chính không thêm ý xác định tuyệt đối.
- source_word: ἔρχεται
  choice: đang đến
  rationale: Thì hiện tại có hướng quy chiếu đến sự xuất hiện được mong đợi; “đang đến” tự nhiên và bảo toàn sắc thái ấy.
- source_word: καὶ νῦν
  choice: thì ngay lúc này
  rationale: Làm nổi bật sự tương phản giữa điều độc giả đã nghe sẽ đến và thực tại hiện nay có nhiều kẻ như vậy.
- source_word: ἀντίχριστοι πολλοὶ
  choice: nhiều kẻ chống Đấng Christ
  rationale: Giữ dạng số nhiều và mối liên hệ trực tiếp với thuật ngữ số ít trước đó.
- source_word: γεγόνασιν
  choice: đã xuất hiện
  rationale: 'Diễn đạt thể hoàn thành của γίνομαι: họ đã xuất hiện và nay đang hiện diện; chú thích bảo lưu các khả năng dịch gần nghĩa.'
- source_word: ὅθεν γινώσκομεν
  choice: Do đó, chúng ta biết
  rationale: Thể hiện phép suy luận từ sự kiện vừa nêu và dịch γινώσκομεν bằng cách diễn đạt thông dụng trong tiếng Việt.
theological_decisions:
- issue: Ý nghĩa của “giờ cuối cùng”
  choice: Giữ nguyên cách nói “giờ cuối cùng” như một biểu thức cánh chung
  alternative: Diễn giải là một thời điểm sắp xảy ra theo nghĩa đen hoặc chỉ là cách nói tu từ về khủng hoảng
  rationale: Ngữ cảnh cho thấy ý nghĩa cánh chung, nhưng bản dịch không thu hẹp hình ảnh thời gian của nguyên văn thành một lịch trình tận thế cụ thể.
- issue: Quan hệ giữa “kẻ chống Đấng Christ” số ít và nhiều kẻ số nhiều
  choice: Giữ nguyên sự đối chiếu giữa nhân vật hoặc phạm trù số ít được trông đợi và nhiều kẻ hiện đã xuất hiện
  alternative: Diễn giải số ít chỉ như một phạm trù chung, hoặc xác định rõ đó là một cá nhân duy nhất
  rationale: Nguyên văn cố ý đặt số ít bên cạnh số nhiều; bản dịch bảo toàn sự căng thẳng ấy thay vì hệ thống hóa.
- issue: Tính xác định của ἀντίχριστος
  choice: Dịch “kẻ chống Đấng Christ” và ghi chú khả năng hiểu là nhân vật đã được biết đến
  alternative: Dịch rõ là “Kẻ Chống Đấng Christ” với tính xác định và danh hiệu hóa mạnh hơn
  rationale: Tiếng Hy Lạp không có mạo từ, nhưng ngữ cảnh lời dạy đã nghe có thể hướng tới một nhân vật được nhận biết; chú thích giữ cả hai khả năng.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Cách xưng hô “các con” duy trì giọng mục vụ thân tình; thuật ngữ “Đấng Christ” giữ tính quen thuộc của ngôn ngữ Kinh Thánh. Các dấu chú thích [a], [b] đều xuất hiện trong bản văn chính.
