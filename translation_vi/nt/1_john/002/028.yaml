id: 1JN.2.28
reference: 1 John 2:28
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Καὶ νῦν, τεκνία, μένετε ἐν αὐτῷ, ἵνα ⸀ἐὰν φανερωθῇ ⸀σχῶμεν παρρησίαν καὶ μὴ αἰσχυνθῶμεν ἀπ’ αὐτοῦ ἐν τῇ παρουσίᾳ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/028.yaml
  text: And now[a], little children, remain in him, so that if he is revealed[c][b], we may have confidence and not shrink away from him in shame at his coming.
translation:
  language: vi
  text: Bây giờ, hỡi các con bé nhỏ, hãy ở trong Ngài, để khi Ngài được bày tỏ[a], chúng ta có thể tự tin và không vì hổ thẹn mà lùi xa khỏi Ngài[b] khi Ngài đến[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “nếu Ngài được bày tỏ” hoặc “khi Ngài hiện ra.” Động từ Hy Lạp ở thể bị động.
    reason: lexical_alternative
  - marker: b
    text: Hay “không phải hổ thẹn trước mặt Ngài.” Cụm từ cũng có thể chỉ sự hổ thẹn trong sự hiện diện của Ngài, không nhất thiết nhấn mạnh việc lùi xa.
    reason: alternative_reading
  - marker: c
    text: Hay “khi Ngài hiện diện,” “lúc Ngài đến,” hoặc “lúc Ngài quang lâm.” Trong ngữ cảnh này, từ Hy Lạp thường chỉ sự ngự đến trong tương lai của Đấng Christ.
    reason: lexical_alternative
lexical_decisions:
- source_word: τεκνία
  choice: các con bé nhỏ
  rationale: Giữ hình ảnh con cái và sắc thái trìu mến của lối xưng hô mục vụ; “hỡi” làm rõ đây là lời gọi trực tiếp trong văn phong trang trọng, tự nhiên.
- source_word: μένετε
  choice: hãy cứ ở
  rationale: Diễn tả mệnh lệnh tiếp diễn và duy trì thuật ngữ chủ chốt của Giăng; “ở trong Ngài” tự nhiên hơn “lưu lại” khi nói về mối liên hệ.
- source_word: ἐν αὐτῷ
  choice: ở trong Ngài
  rationale: Giữ nguyên ẩn dụ quan hệ của nguyên văn, không diễn giải thêm thành “hiệp nhất với Ngài”.
- source_word: φανερωθῇ
  choice: Ngài được bày tỏ
  rationale: Giữ thể bị động của động từ Hy Lạp và ý nghĩa về sự hiển lộ của Đấng Christ, thay vì làm phẳng thành “Ngài hiện ra”.
- source_word: σχῶμεν παρρησίαν
  choice: chúng ta có thể vững lòng
  rationale: Truyền đạt sự tự tin, cởi mở không sợ hãi trước Ngài trong ngữ cảnh cánh chung; tự nhiên hơn cách nói sát chữ “có sự dạn dĩ”.
- source_word: αἰσχυνθῶμεν ἀπ’ αὐτοῦ
  choice: không vì hổ thẹn mà lùi xa Ngài
  rationale: Kết hợp ý hổ thẹn của động từ với hướng “xa khỏi” của ἀπό, đồng thời tránh diễn giải thành sự kết án chung cuộc.
- source_word: παρουσίᾳ
  choice: quang lâm
  rationale: Trong ngữ cảnh cánh chung, từ này chỉ việc Đấng Christ hiện diện bằng cách đến; “quang lâm” là cách nói tiếng Việt cô đọng và quen thuộc, còn chú thích bảo lưu nghĩa sát hơn.
theological_decisions:
- issue: Quy chiếu của các đại từ và sự hiển lộ cánh chung
  choice: Các đại từ được hiểu theo ngữ cảnh là chỉ về Con, tức Đức Chúa Jêsus Christ, và câu nói đến sự hiển lộ tương lai của Ngài.
  alternative: Hiểu đại từ là chỉ chung về Đức Chúa Trời mà không xác định là Con.
  rationale: Mạch văn gần nói đến việc ở trong Con và sự xuất hiện của Ngài. Bản dịch không thêm danh xưng vào câu nhưng giữ cách gọi “Ngài”, nhờ đó phản ánh ngữ cảnh mà không giải quyết quá mức điều nguyên văn chỉ diễn đạt bằng đại từ.
- issue: Sắc thái của sự hổ thẹn khi Ngài quang lâm
  choice: Người ta có thể vì hổ thẹn mà lùi xa Ngài.
  alternative: Chỉ đơn giản là “hổ thẹn trước mặt Ngài”.
  rationale: Sự kết hợp giữa αἰσχυνθῶμεν và ἀπ’ αὐτοῦ có thể gợi ý việc co lại hoặc lùi xa vì hổ thẹn. Chú thích giữ cách hiểu truyền thống, ít hàm ý chuyển động hơn.
- issue: Giá trị của ἐὰν với φανερωθῇ
  choice: Dịch “khi Ngài được bày tỏ” theo ý nghĩa thời điểm trong ngữ cảnh.
  alternative: Dịch sát hình thức hơn là “nếu Ngài được bày tỏ”.
  rationale: ἐὰν với thể giả định có thể mang nghĩa thời điểm bất định (“khi nào”), không nhất thiết bày tỏ nghi ngờ rằng Ngài sẽ hiện ra. Chú thích bảo lưu cách dịch “nếu” để phản ánh cấu trúc Hy Lạp.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. “Các con bé nhỏ” giữ giọng trìu mến của người chăn dắt; “hãy cứ ở trong Ngài” giữ mô-típ thần học của Giăng. “Quang lâm” được dùng theo nghĩa cánh chung, có chú thích giải nghĩa bằng các cách nói phổ thông hơn.
