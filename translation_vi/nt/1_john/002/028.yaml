revisions:
- from: Vậy giờ đây, hỡi các con bé nhỏ, hãy cứ ở trong Ngài, để khi Ngài được bày tỏ[a], chúng ta có thể vững lòng và không vì hổ thẹn mà lùi xa Ngài[b] lúc Ngài quang lâm[c].
  to: Bây giờ, hỡi các con bé nhỏ, hãy ở trong Ngài, để khi Ngài được bày tỏ[a], chúng ta có thể tự tin và không vì hổ thẹn mà lùi xa khỏi Ngài[b] khi Ngài đến[c].
  rationale: 'Bản sửa giảm các cách nói nặng hoặc chuyên biệt không cần thiết, đồng thời giữ các điểm ngữ nghĩa chính của nguyên văn: mệnh lệnh tiếp diễn, thể bị động của «được bày tỏ», sắc thái tự tin của παρρησία, và khả năng hổ thẹn dẫn đến lùi xa. Không thêm chi tiết giáo lý hay giải quyết dứt khoát sự mơ hồ của cụm αἰσχυνθῶμεν ἀπ’ αὐτοῦ; chú thích bảo lưu cách hiểu «hổ thẹn trước mặt Ngài».'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T00:30:23Z'
review_pass:
  verdict: revise
  source_fidelity: Bản nháp truyền đạt đúng mệnh lệnh tiếp diễn «μένете ἐν αὐτῷ», sự hiển lộ tương lai, sự tự tin, và nguy cơ hổ thẹn/lùi xa khi Ngài đến. Tuy nhiên, «Vậy giờ đây» hơi trùng ý, còn «quang lâm» là thuật ngữ tôn giáo chuyên biệt hơn mức cần thiết của tiếng Việt tiêu chuẩn hiện đại. «Khi Ngài được bày tỏ» là cách hiểu thời điểm có thể chấp nhận được đối với ἐὰν + thể giả định trong ngữ cảnh này; chú thích cần bảo lưu lựa chọn hình thức «nếu».
  naturalness: Nên dùng «Bây giờ» thay cho «Vậy giờ đây», «hãy ở trong Ngài» thay cho «hãy cứ ở trong Ngài», và «khi Ngài đến» thay cho «lúc Ngài quang lâm». «Có thể tự tin» rõ và tự nhiên hơn «có thể vững lòng» trong ngữ cảnh có «παρρησίαν».
  terminology: «Các con bé nhỏ» bảo lưu hình ảnh con cái và sắc thái trìu mến của τεκνία. «Ở trong Ngài» giữ mô-típ Johannine mà không diễn giải. «Ngài được bày tỏ» giữ được thể bị động của φανερωθῇ. «Khi Ngài đến» diễn đạt παρουσία theo nghĩa cánh chung bằng ngôn ngữ hiện đại; chú thích nêu các lựa chọn sát chữ và thuật ngữ truyền thống.
  issues:
  - severity: low
    issue: Cụm mở đầu «Vậy giờ đây» bị nặng và có phần lặp ý.
    rationale: Καὶ νῦν được diễn đạt tự nhiên là «Bây giờ» hoặc «Và bây giờ»; «vậy» không cần thiết.
  - severity: medium
    issue: «Quang lâm» không phải lựa chọn mặc định tự nhiên nhất cho tiếng Việt tiêu chuẩn hiện đại.
    rationale: Từ này chính xác trong truyền thống Kitô giáo nhưng có tính chuyên ngữ. «Khi Ngài đến» truyền đạt nghĩa sự đến cánh chung của παρουσία mà không giảm nghĩa; chú thích có thể giữ «quang lâm» như một lựa chọn.
  - severity: low
    issue: «Vững lòng» chỉ gần nghĩa của παρρησία.
    rationale: παρρησία ở đây nhấn mạnh sự tự tin/dạn dĩ trước Ngài. «Có thể tự tin» trực tiếp và tự nhiên hơn.
