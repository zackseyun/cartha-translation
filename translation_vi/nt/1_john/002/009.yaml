id: 1JN.2.9
reference: 1 John 2:9
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὁ λέγων ἐν τῷ φωτὶ εἶναι καὶ τὸν ἀδελφὸν αὐτοῦ μισῶν ἐν τῇ σκοτίᾳ ἐστὶν ἕως ἄρτι.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/009.yaml
  text: The one who says he is in the light and hates his brother is in the darkness until now[a].
translation:
  language: vi
  text: Người nào nói mình ở trong ánh sáng mà lại ghét anh em mình thì cho đến bây giờ vẫn còn ở trong bóng tối.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn Hy Lạp dùng danh từ số ít giống đực “người anh em”; trong lời dạy đạo đức này, từ ấy có thể đại diện cho cả anh em nam lẫn nữ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ λέγων
  choice: Người nào nói
  rationale: Mạo từ đi với phân từ hiện tại tạo thành một chủ thể đại diện. “Người nào nói” tự nhiên trong tiếng Việt và giữ được tính khái quát của câu.
- source_word: ἐν τῷ φωτὶ εἶναι
  choice: mình ở trong ánh sáng
  rationale: Dùng “mình” để quy chiếu về chủ thể của lời nói; “ở trong ánh sáng” giữ nguyên hình ảnh ẩn dụ và sắc thái về một phạm vi hay tình trạng.
- source_word: τὸν ἀδελφὸν αὐτοῦ
  choice: anh em mình
  rationale: “Anh em” là cách gọi tự nhiên, trang trọng trong văn cảnh cộng đồng đức tin và có thể bao quát người nam lẫn người nữ; đại từ “mình” diễn đạt quan hệ sở hữu đồng chủ thể.
- source_word: μισῶν
  choice: mà lại ghét
  rationale: Thì hiện tại của phân từ diễn tả thái độ đang có hoặc mang tính đặc trưng. “Mà lại” làm rõ sự tương phản giữa lời tự nhận và thực trạng mà không thêm nội dung thần học.
- source_word: ἐν τῇ σκοτίᾳ ἐστὶν
  choice: vẫn còn ở trong bóng tối
  rationale: Giữ sự đối lập trực tiếp với “ở trong ánh sáng”; “vẫn còn” phối hợp tự nhiên với cụm thời gian ἕως ἄρτι để diễn tả trạng thái tiếp diễn.
- source_word: ἕως ἄρτι
  choice: cho đến bây giờ
  rationale: Dịch trực tiếp thành ngữ chỉ sự kéo dài tới thời điểm hiện tại, bảo toàn nhấn mạnh thời gian của nguyên văn.
theological_decisions:
- issue: Phạm vi chỉ người của ἀδελφός trong lời khẳng định đạo đức mang tính đại diện
  choice: anh em
  alternative: người anh em; anh hoặc chị em; người cùng đức tin
  rationale: “Anh em” vừa gần với danh từ thân tộc giống đực trong tiếng Hy Lạp vừa là lối dùng tự nhiên trong tiếng Việt để chỉ các thành viên trong cộng đồng, có khả năng bao quát cả nam lẫn nữ. “Người cùng đức tin” xác định phạm vi theo cách diễn giải nhiều hơn nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ cặp hình ảnh đối lập “ánh sáng/bóng tối” cùng sức căng giữa lời tự nhận và tình trạng thực tế. Dấu chú thích [a] được đặt ngay sau câu.
