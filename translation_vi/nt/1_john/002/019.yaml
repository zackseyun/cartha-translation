revisions:
- from: Họ đã ra đi từ giữa chúng ta, nhưng họ không thuộc về chúng ta[a]. Vì nếu họ thuộc về chúng ta, họ đã ở lại với chúng ta. Nhưng điều ấy xảy ra để bày tỏ[b] rằng không phải tất cả đều thuộc về chúng ta.[c]
  to: Họ đã ra đi từ giữa chúng ta, nhưng họ không thuộc về chúng ta[a]. Vì nếu họ thuộc về chúng ta, thì họ đã ở lại với chúng ta. Nhưng điều ấy xảy ra để lộ rõ rằng không phải tất cả đều thuộc về chúng ta.
