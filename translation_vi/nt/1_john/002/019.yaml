source:
  edition: SBLGNT
  text: ἐξ ἡμῶν ἐξῆλθαν, ἀλλ’ οὐκ ἦσαν ἐξ ἡμῶν· εἰ γὰρ ⸂ἐξ ἡμῶν ἦσαν⸃, μεμενήκεισαν ἂν μεθ’ ἡμῶν· ἀλλ’ ἵνα φανερωθῶσιν ὅτι οὐκ εἰσὶν πάντες ἐξ ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/019.yaml
  text: They went out from us[a], but they were not of us; for if they had been of us, they would have remained with us[b]. But this happened so that it might be made clear that not all are of us.
translation:
  language: vi
  text: Họ đã ra đi từ giữa chúng ta, nhưng họ không thuộc về chúng ta[a]. Vì nếu họ thuộc về chúng ta, thì họ đã ở lại với chúng ta. Nhưng điều ấy xảy ra để lộ rõ rằng không phải tất cả đều thuộc về chúng ta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sát nghĩa hơn: “không phải là từ chúng ta.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξ ἡμῶν
  choice: từ giữa chúng ta / thuộc về chúng ta
  rationale: 'Cụm từ được lặp lại nhưng mang hai sắc thái liên hệ trong văn cảnh: lần đầu chỉ việc rời khỏi cộng đồng, còn các lần sau nói đến căn tính hay sự gắn thuộc. Cách dịch này giữ được mối liên hệ giữa các lần lặp mà vẫn tự nhiên trong tiếng Việt.'
- source_word: ἐξῆλθαν
  choice: đã ra đi
  rationale: Động từ aorist diễn tả hành động rời đi; “ra đi” giữ hình ảnh cụ thể của nguyên văn mà không tự thêm ý “bội đạo” vào chính động từ.
- source_word: οὐκ ἦσαν ἐξ ἡμῶν
  choice: họ không thuộc về chúng ta
  rationale: “Thuộc về” diễn đạt tự nhiên ý nghĩa về sự gắn thuộc/căn tính của ἐκ trong ngữ cảnh, nhưng không giải thích thêm họ có hay không có một địa vị cứu rỗi nào.
- source_word: εἰ γὰρ ἐξ ἡμῶν ἦσαν
  choice: vì nếu họ thuộc về chúng ta
  rationale: Mệnh đề điều kiện trái với thực tế được thể hiện tự nhiên qua kết quả “họ đã ở lại”; không cần dùng cấu trúc nặng nề trong tiếng Việt.
- source_word: μεμενήκεισαν ἂν μεθ’ ἡμῶν
  choice: họ đã ở lại với chúng ta
  rationale: Thể quá khứ hoàn thành kết hợp với ἄν nêu kết quả trái với thực tế. “Ở lại” vừa tự nhiên vừa duy trì nét nghĩa quan trọng của μένω trong các tác phẩm của Giăng.
- source_word: ἀλλ’ ἵνα φανερωθῶσιν
  choice: nhưng điều ấy xảy ra để bày tỏ
  rationale: Nguyên văn lược bỏ một mệnh đề chính sau ἀλλά; thêm “điều ấy xảy ra” giúp câu tiếng Việt hoàn chỉnh mà không xác định quá mức điều được bày tỏ. “Bày tỏ” truyền đạt ý được làm cho lộ rõ của thể thụ động.
- source_word: ὅτι οὐκ εἰσὶν πάντες ἐξ ἡμῶν
  choice: rằng không phải tất cả đều thuộc về chúng ta
  rationale: Cách dịch bám theo phạm vi phủ định tự nhiên của οὐκ...πάντες (“không phải tất cả”), đồng thời ghi nhận trong chú thích khả năng hiểu là toàn bộ những người ấy đều không thuộc về cộng đồng.
theological_decisions:
- issue: Cụm “thuộc về chúng ta” có nên được diễn giải thành một kết luận về tư cách Hội Thánh hữu hình hay tình trạng được cứu hay không
  choice: Giữ ngôn ngữ quan hệ “thuộc về chúng ta”.
  alternative: “Họ chưa bao giờ thật sự là tín hữu” hoặc “họ không thật sự thuộc Hội Thánh.”
  rationale: Nguyên văn phân biệt việc từng ở trong cộng đồng rồi ra đi với việc thật sự “thuộc về” cộng đồng, nhưng không dùng các phạm trù thần học hệ thống về Hội Thánh hữu hình/vô hình hay sự cứu rỗi. Giữ cách nói của câu Kinh Thánh tránh áp đặt kết luận hệ phái.
- issue: Phạm vi phủ định trong οὐκ εἰσὶν πάντες ἐξ ἡμῶν
  choice: Dịch “không phải tất cả đều thuộc về chúng ta” và nêu cách hiểu khác trong chú thích.
  alternative: “Tất cả họ đều không thuộc về chúng ta.”
  rationale: Trật tự οὐκ...πάντες có thể được hiểu theo phạm vi “không phải tất cả”, nhưng văn cảnh cũng khiến cách hiểu phủ định toàn bộ nhóm người ra đi trở nên khả dĩ. Chú thích bảo tồn sự căng thẳng thay vì âm thầm quyết định vấn đề.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Chúng ta” thích hợp với lời tác giả nói cùng độc giả; “thuộc về” tự nhiên hơn lối dịch sát chữ “là từ chúng ta”. Các câu ngắn giữ nhịp lập luận và sự lặp lại có chủ ý của nguyên văn.
