id: 1JN.2.1
reference: 1 John 2:1
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Τεκνία μου, ταῦτα γράφω ὑμῖν ἵνα μὴ ἁμάρτητε. καὶ ἐάν τις ἁμάρτῃ, παράκλητον ἔχομεν πρὸς τὸν πατέρα Ἰησοῦν Χριστὸν δίκαιον,
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/001.yaml
  text: My little children[a], I write these things to you so that you may not sin. But if anyone does sin[b], we have an advocate with the Father—Jesus the Messiah the Righteous One.
translation:
  language: vi
  text: Các con bé nhỏ của tôi, tôi viết những điều này cho các con để các con không phạm tội. Nhưng nếu có ai phạm tội, chúng ta có một Đấng Biện Hộ[a] ở bên Đức Chúa Cha, là Đức Giê-su, Đấng Mê-si-a, Đấng Công Chính.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hy Lạp παράκλητος cũng có thể được hiểu rộng hơn là “Đấng Giúp Đỡ”, “Đấng Cố Vấn” hoặc “Đấng An Ủi”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τεκνία μου
  choice: Hỡi các con bé nhỏ của tôi
  rationale: Giữ hình ảnh con cái, sắc thái trìu mến của từ giảm nghĩa τεκνία và đại từ sở hữu μου; “hỡi” tạo lời xưng gọi trang trọng nhưng vẫn dễ hiểu.
- source_word: ταῦτα γράφω ὑμῖν
  choice: tôi viết những điều này cho các con
  rationale: Bám sát thì hiện tại γράφω và giữ đại từ chỉ định ταῦτα mà không xác định quá mức nội dung được quy chiếu.
- source_word: ἵνα μὴ ἁμάρτητε
  choice: để các con không phạm tội
  rationale: Diễn đạt trực tiếp mệnh đề mục đích với ἵνα và không biến nó thành một khẳng định giáo lý về tình trạng hoàn toàn vô tội.
- source_word: καὶ ἐάν τις ἁμάρτῃ
  choice: Nhưng nếu có ai phạm tội
  rationale: “Nhưng” thể hiện sức tương phản theo văn cảnh của καί; mệnh đề điều kiện vẫn để ngỏ khả năng một người phạm tội.
- source_word: παράκλητον
  choice: Đấng Biện Hộ
  rationale: Trong bối cảnh ở bên Đức Chúa Cha, từ này chủ yếu chỉ người đứng về phía, đại diện hoặc biện hộ; cách viết hoa phản ánh việc danh xưng này chỉ về Đức Giê-su, còn chú thích bảo lưu trường nghĩa rộng hơn.
- source_word: πρὸς τὸν πατέρα
  choice: ở bên Đức Chúa Cha
  rationale: Diễn đạt sự hiện diện và hướng về Đức Chúa Cha của πρός với đối cách, tự nhiên hơn trong tiếng Việt so với cách dịch thuần không gian.
- source_word: Ἰησοῦν Χριστὸν
  choice: Đức Giê-su, Đấng Mê-si-a
  rationale: Χριστός tại đây được hiểu theo chức danh “Đấng Mê-si-a”; dấu phẩy làm rõ quan hệ đồng vị trong tiếng Việt.
- source_word: δίκαιον
  choice: Đấng Công Chính
  rationale: Diễn đạt tính từ đồng vị δίκαιον như một danh xưng quy về Đức Giê-su, đồng thời giữ nghĩa công chính/chính trực của từ Hy Lạp.
theological_decisions:
- issue: Cách dịch Χριστός trong danh xưng về Đức Giê-su
  choice: Đấng Mê-si-a
  alternative: Đấng Christ / Đức Chúa Cứu Thế
  rationale: “Đấng Mê-si-a” bảo toàn chức danh bắt nguồn từ ý niệm Đấng được xức dầu mà không đồng nhất nó với một thành tố tên riêng; chú thích nêu cách gọi truyền thống.
- issue: Hàm ý có thể có về sự hoàn toàn không phạm tội trong ἵνα μὴ ἁμάρτητε
  choice: 'Giữ nguyên mệnh đề mục đích: “để các con không phạm tội”'
  alternative: Diễn giải thành một khẳng định rằng tín hữu có thể hoặc phải đạt tình trạng tuyệt đối vô tội
  rationale: Câu sau lập tức xét trường hợp có người phạm tội; bản dịch giữ nguyên sức căng giữa mục đích không phạm tội và khả năng sa ngã, không giải quyết theo một hệ phái.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng và giàu sắc thái mục vụ. “Các con bé nhỏ” giữ sự trìu mến và ẩn dụ gia đình; “Đấng Biện Hộ” dễ hiểu trong ngữ cảnh đại diện trước Đức Chúa Cha. Mọi dấu chú thích [a], [b] đều xuất hiện trong chính văn.
