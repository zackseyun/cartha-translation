id: 1JN.2.6
reference: 1 John 2:6
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὁ λέγων ἐν αὐτῷ μένειν ὀφείλει καθὼς ἐκεῖνος περιεπάτησεν καὶ ⸀αὐτὸς περιπατεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/006.yaml
  text: The one who says he remains in him ought also to walk just as that one walked[a][b][c].
translation:
  language: vi
  text: Người nào nói mình ở lại trong Ngài thì chính người ấy cũng phải bước đi như Đấng ấy đã bước đi.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch “vẫn ở trong Ngài.” Động từ Hy Lạp μένω là một từ khóa trong các sách của Giăng, mang nghĩa ở lại, tiếp tục hoặc bền vững trong một mối liên hệ.
    reason: lexical_alternative
  - marker: b
    text: “Đấng ấy” chỉ Chúa Giê-su và giữ sắc thái nhấn mạnh của đại từ chỉ định Hy Lạp. Nguyên văn không nêu đích danh đối tượng của cụm “trong Ngài”; theo mạch văn, đại từ này có thể được hiểu là Đức Chúa Trời hoặc Chúa Giê-su.
    reason: alternative_reading
  - marker: c
    text: “Bước đi” là hình ảnh Kinh Thánh chỉ cách một người sống; nghĩa là người ấy phải sống như Chúa Giê-su đã sống.
    reason: cultural_note
lexical_decisions:
- source_word: ὁ λέγων
  choice: Người nào nói
  rationale: Phân từ có mạo từ được dùng như danh từ, chỉ một người đại diện nói chung. “Người nào nói” giữ số ít và sắc thái khái quát, đồng thời tự nhiên trong tiếng Việt.
- source_word: ἐν αὐτῷ μένειν
  choice: mình ở lại trong ngài
  rationale: “Ở lại” bảo tồn động từ μένω, một từ khóa trong văn chương Giăng, có thể diễn tả sự tiếp tục, lưu lại và bền vững trong mối liên hệ. “Mình” quy chiếu về chủ thể đang nói; “ngài” không nêu đích danh đối tượng nên giữ được cách diễn đạt bằng đại từ của nguyên văn.
- source_word: ὀφείλει
  choice: phải
  rationale: Ở đây ὀφείλω diễn tả bổn phận đạo đức. “Phải” là cách nói hiện đại, rõ ràng và tự nhiên, không nhất thiết mang sắc thái cưỡng chế pháp lý.
- source_word: καθὼς
  choice: như
  rationale: “Như” diễn đạt trực tiếp sự tương ứng về cách thức mà καθώς đánh dấu.
- source_word: ἐκεῖνος
  choice: Đấng ấy
  rationale: Đại từ chỉ định ἐκεῖνος có lực nhấn và trong ngữ cảnh quy chiếu tự nhiên đến Chúa Giê-su. “Đấng ấy” giữ sắc thái chỉ định và phù hợp với văn phong trang trọng, thay vì âm thầm thay bằng tên riêng.
- source_word: περιεπάτησεν ... περιπατεῖν
  choice: đã bước đi ... bước đi
  rationale: Giữ hình ảnh ẩn dụ Kinh Thánh về cách sống và duy trì sự lặp lại có chủ ý của nguyên văn; chú thích giải nghĩa cho độc giả hiện đại.
- source_word: καὶ αὐτὸς
  choice: chính người ấy cũng
  rationale: “Chính” thể hiện sức nhấn của αὐτός, còn “cũng” thể hiện lực bổ sung của καί, nhấn mạnh rằng người đưa ra lời tuyên bố phải có đời sống tương ứng.
theological_decisions:
- issue: Đối tượng quy chiếu của αὐτῷ và ἐκεῖνος
  choice: 'Giữ hai cách gọi bằng đại từ: “ngài” và “Đấng ấy”; chú thích xác định “Đấng ấy” là Chúa Giê-su theo ngữ cảnh.'
  alternative: Dịch thẳng cả hai là “Chúa Giê-su”, hoặc hiểu αὐτῷ là Đức Chúa Trời và ἐκεῖνος là Chúa Giê-su.
  rationale: Nguyên văn không nêu danh từ làm đối tượng ở câu này. Ngữ cảnh xác định rõ ἐκεῖνος là Chúa Giê-su, nhưng đối tượng của αὐτῷ có thể được liên kết với Đức Chúa Trời hoặc với Chúa Giê-su tùy cách lần theo các tiền ngữ trong 2:5–6. Giữ đại từ tránh giải quyết quá mức sự căng thẳng này.
- issue: Hình ảnh “bước đi”
  choice: Giữ nguyên ẩn dụ “bước đi” và giải nghĩa trong chú thích.
  alternative: Diễn giải trực tiếp là “sống” hoặc “ăn ở”.
  rationale: Động từ περιπατέω ở đây chỉ nếp sống, nhưng hình ảnh bước đi có giá trị liên văn bản và được lặp lại cân xứng trong câu; giữ hình ảnh vừa sát nguồn vừa không áp đặt một cách diễn giải thần học riêng.
- issue: Lối nói số ít mang nghĩa khái quát
  choice: Dùng “Người nào ... mình ... chính người ấy”.
  alternative: Chuyển sang số nhiều hoặc dùng một cách nói phi cá nhân.
  rationale: Nguyên văn dùng cấu trúc giống đực số ít với lực đại diện. Tiếng Việt không cần đánh dấu giới tính, nên có thể vừa giữ số ít vừa truyền đạt nghĩa áp dụng cho bất cứ người nào.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Bản dịch giữ hình ảnh “bước đi” và thuật ngữ chủ chốt “ở lại”, đồng thời dùng chú thích để làm rõ ý nghĩa. “Đấng ấy” mang sắc thái tôn kính quen thuộc trong văn phong Cơ Đốc giáo tiếng Việt nhưng không thay đại từ nguyên văn bằng tên riêng.
