id: 1JN.2.14
reference: 1 John 2:14
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸀ἔγραψα ὑμῖν, παιδία, ὅτι ἐγνώκατε τὸν πατέρα· ἔγραψα ὑμῖν, πατέρες, ὅτι ἐγνώκατε τὸν ἀπ’ ἀρχῆς· ἔγραψα ὑμῖν, νεανίσκοι, ὅτι ἰσχυροί ἐστε καὶ ὁ λόγος τοῦ θεοῦ ἐν ὑμῖν μένει καὶ νενικήκατε τὸν πονηρόν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/014.yaml
  text: I have written to you[a], children, because you have known the Father. I have written to you, fathers, because you have known him who is from the beginning. I have written to you, young men, because you are strong, and the word of God remains in you[c][b], and you have overcome the evil one.
translation:
  language: vi
  text: Hỡi các con, tôi đã viết cho các con[a], vì các con đã biết Đức Cha. Hỡi những người cha, tôi đã viết cho anh em, vì anh em đã biết Đấng có từ ban đầu[b]. Hỡi các thanh niên, tôi đã viết cho anh em, vì anh em mạnh mẽ, lời Đức Chúa Trời vẫn ở lại trong anh em[c], và anh em đã thắng Kẻ Ác.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “tôi đã viết” theo nghĩa quá khứ đơn ở cả ba lần trong câu này. Động từ Hy Lạp ở thì aorist có thể được dịch như một hành động đã xảy ra; nhưng trong văn cảnh thư tín, “tôi đã viết” cũng có thể chỉ điều tác giả viết mà vẫn có ý nghĩa cho người nhận.
    reason: lexical_alternative
  - marker: b
    text: “Đấng có từ ban đầu” rất có thể chỉ Ngôi Con vốn hiện hữu từ trước, theo cách dùng từ trong các trước tác của Giăng; tuy nhiên, câu này không nêu rõ danh tính của Đấng ấy.
    reason: alternative_reading
  - marker: c
    text: Hay “lời Đức Chúa Trời vẫn ở trong anh em”; động từ này nhấn mạnh sự tiếp tục và bền vững.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔγραψα
  choice: tôi đã viết
  rationale: Thì quá khứ trong tiếng Việt diễn đạt tự nhiên hành động viết đã hoàn tất và vẫn có ý nghĩa đối với người nhận; giữ nguyên điệp thức ba lần.
- source_word: παιδία
  choice: các con
  rationale: Lối xưng hô thân tình của một người cha tinh thần với độc giả; tự nhiên hơn cách gọi thuần tuổi tác là “trẻ em” trong văn cảnh.
- source_word: ἐγνώκατε
  choice: đã biết
  rationale: 'Diễn đạt thể hoàn thành: họ đã nhận biết và mối nhận biết ấy vẫn có hiệu lực.'
- source_word: τὸν πατέρα
  choice: Đức Cha
  rationale: Chỉ Đức Chúa Trời với tư cách Cha; “Đức Cha” là danh xưng trang trọng, dễ hiểu trong tiếng Việt.
- source_word: πατέρες
  choice: những người cha
  rationale: Giữ hình ảnh và dạng giống đực của nguyên văn, không diễn giải thành “người lớn tuổi” hay “người trưởng thành”.
- source_word: τὸν ἀπ’ ἀρχῆς
  choice: Đấng có từ ban đầu
  rationale: Giữ kín danh tính mà câu Hy Lạp không nêu rõ, đồng thời diễn đạt phẩm tính hiện hữu “từ ban đầu”.
- source_word: νεανίσκοι
  choice: những người trẻ tuổi
  rationale: Chỉ nhóm nam trẻ tuổi trong đối lập tu từ với “những người cha”; đại từ tiếp theo là “anh em” để phản ánh giới tính của danh từ Hy Lạp.
- source_word: ἰσχυροί
  choice: mạnh mẽ
  rationale: Tương đương trực tiếp và tự nhiên trong văn cảnh sức mạnh thuộc linh.
- source_word: ὁ λόγος τοῦ θεοῦ
  choice: lời Đức Chúa Trời
  rationale: Giữ phạm vi nghĩa mở giữa sứ điệp của Đức Chúa Trời nói chung và Tin Lành được công bố.
- source_word: μένει
  choice: ở trong
  rationale: Trong kết cấu “ở trong anh em”, cách này tự nhiên trong tiếng Việt và vẫn chuyển tải sự hiện diện liên tục, bền vững.
- source_word: νενικήκατε
  choice: đã thắng
  rationale: Diễn đạt chiến thắng đã đạt được và còn hiệu lực; gọn, tự nhiên hơn “đã chiến thắng trên”.
- source_word: τὸν πονηρόν
  choice: Kẻ Ác
  rationale: Mạo từ cùng hình thái giống đực cho thấy một tác nhân có ngôi vị, không chỉ điều ác trừu tượng.
theological_decisions:
- issue: Danh tính của “Đấng có từ ban đầu”
  choice: Giữ cách nói hàm ẩn “Đấng có từ ban đầu”.
  alternative: Nêu rõ là Đấng Christ/Con Đức Chúa Trời, hoặc hiểu rộng là Đức Chúa Trời.
  rationale: Văn phong Giăng khiến việc chỉ về Ngôi Con tiền hữu rất có khả năng, nhưng câu này không trực tiếp nêu danh; bản dịch không giải quyết thay cho nguyên văn.
- issue: Giới tính và tính chất của ba nhóm người được gọi
  choice: Dịch παιδία là “các con”, πατέρες là “những người cha”, và νεανίσκοι là “những người trẻ tuổi”, với “anh em” cho hai nhóm giống đực.
  alternative: Trung tính hóa toàn bộ thành những cấp độ trưởng thành thuộc linh của cả hội thánh.
  rationale: Nguyên văn dùng một cách gọi có tính gia đình rộng hơn rồi hai danh từ giống đực. Bản dịch giữ hình thức ấy mà không quyết định liệu các nhóm chỉ tuổi tác thực hay mức trưởng thành thuộc linh.
translation_notes:
  register: Văn phong hiện đại, trang trọng và gần gũi. Giữ ba lời gọi trực tiếp và cấu trúc lặp của nguyên văn. “Hỡi” giúp đánh dấu hô cách mà không quá cổ; “các con/anh em” phản ánh quan hệ và giới tính ngữ pháp của từng nhóm. Các dấu chú thích [a], [b], [c] đều xuất hiện đúng tại nội dung liên quan.
