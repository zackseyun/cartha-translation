  to: Hỡi các con, tôi đã viết cho các con[a], vì các con đã biết Đức Cha. Hỡi những người cha, tôi đã viết cho anh em, vì anh em đã biết Đấng có từ ban đầu[b]. Hỡi các thanh niên, tôi đã viết cho anh em, vì anh em mạnh mẽ, lời Đức Chúa Trời vẫn ở lại trong anh em[c], và anh em đã thắng Kẻ Ác.
  rationale: Bản sửa chỉ làm rõ sắc thái durative của μένει bằng “vẫn ở lại”, điều chỉnh cách gọi νεανίσκοι để giữ nét giống đực, và chỉnh chú thích về aorist cho chính xác. Các lựa chọn chính của bản nháp—đặc biệt tính hàm ẩn của “Đấng có từ ban đầu” và cách hiểu προσωπικό của τὸν πονηρόν—được giữ nguyên.
