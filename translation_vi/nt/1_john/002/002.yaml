  source_fidelity: 'Bản dịch phản ánh đầy đủ các thành tố chính của nguyên văn: αὐτὸς được nhấn bằng “Chính Ngài”; ἱλασμός được chuyển bằng “sinh tế chuộc tội”; περί τῶν ἁμαρτιῶν ἡμῶν được giữ rõ là liên hệ đến tội lỗi chúng ta; cấu trúc phủ định–mở rộng οὐ...μόνον ἀλλὰ καί được bảo toàn; và ὅλου τοῦ κόσμου được dịch bao quát là “cả thế gian”, không bị thu hẹp diễn giải.'
