  terminology: “Sinh tế chuộc tội” là cách diễn đạt có thể chấp nhận, giữ được bình diện hiến tế của ἱλασμός mà không buộc chọn giữa các cách giải thích “làm nguôi” và “xóa tội”. Chú thích nêu các phương án quan trọng tương ứng với vết kiểm toán tiếng Anh; “cơn thịnh nộ” được nêu như một phương án diễn giải, không áp đặt trong chính văn.
