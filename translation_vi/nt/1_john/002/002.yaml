id: 1JN.2.2
reference: 1 John 2:2
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ αὐτὸς ἱλασμός ἐστιν περὶ τῶν ἁμαρτιῶν ἡμῶν, οὐ περὶ τῶν ἡμετέρων δὲ μόνον ἀλλὰ καὶ περὶ ὅλου τοῦ κόσμου.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/002.yaml
  text: And he himself is the atoning sacrifice for our sins[a], and not for ours only but also for the whole world.
translation:
  language: vi
  text: Chính Ngài là sinh tế chuộc tội cho tội lỗi chúng ta[a], không chỉ cho tội lỗi chúng ta mà còn cho cả thế gian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “sinh tế làm nguôi cơn thịnh nộ”; một số người hiểu là “sinh tế xóa tội.”'
    reason: Bảo tồn các sắc thái từ vựng và thần học chính của ἱλασμός mà cụm từ trong chính văn không thể hiện hết.
lexical_decisions:
- source_word: αὐτὸς
  choice: Chính Ngài
  rationale: Diễn đạt sắc thái nhấn mạnh của đại từ αὐτός, làm nổi bật vai trò đích thân của Chúa Giê-xu; “Ngài” phù hợp với văn phong Kinh Thánh trang trọng mà vẫn hiện đại.
- source_word: ἱλασμός
  choice: sinh tế chuộc tội
  rationale: Cụm này truyền đạt ý niệm một sinh tế xử lý tội lỗi, dễ hiểu hơn thuật ngữ thần học chuyên môn, đồng thời không thu hẹp từ Hy Lạp vào riêng phương diện làm nguôi cơn thịnh nộ hay xóa bỏ tội lỗi.
- source_word: περὶ τῶν ἁμαρτιῶν ἡμῶν
  choice: cho tội lỗi chúng ta
  rationale: Trong kết cấu với ἱλασμός, περί được diễn đạt tự nhiên bằng “cho”, giữ mối liên hệ giữa sinh tế chuộc tội và tội lỗi.
- source_word: τῶν ἡμετέρων
  choice: tội lỗi chúng ta
  rationale: Tiếng Hy Lạp lược danh từ “tội lỗi”, nhưng lặp lại trong tiếng Việt giúp câu rõ ràng, tự nhiên và tránh cách nói mơ hồ “của chúng ta”.
- source_word: ὅλου τοῦ κόσμου
  choice: cả thế gian
  rationale: Giữ nguyên phạm vi rộng của ὅλου và κόσμου mà không thêm một giới hạn diễn giải mang tính hệ phái.
- source_word: οὐ ... μόνον ἀλλὰ καὶ
  choice: không chỉ ... mà còn
  rationale: Đây là kết cấu tương liên tự nhiên trong tiếng Việt, bảo toàn sự tương phản và mở rộng phạm vi của nguyên văn.
theological_decisions:
- issue: Phạm vi của “cả thế gian”
  choice: Giữ nguyên cách nói bao quát “cả thế gian”.
  alternative: mọi dân tộc trên thế gian; những người được chọn khắp thế gian
  rationale: Nguyên văn không trực tiếp nêu các giới hạn này; bản dịch cần bảo tồn độ rộng và sức căng thần học của lời văn.
- issue: Ý nghĩa của ἱλασμός
  choice: Dùng “sinh tế chuộc tội” trong chính văn và ghi các sắc thái quan trọng trong chú thích.
  alternative: lễ vật làm nguôi cơn thịnh nộ; sinh tế xóa tội
  rationale: “Sinh tế chuộc tội” vừa dễ tiếp nhận vừa giữ được trường nghĩa hiến tế, nhưng không âm thầm quyết định tranh luận liệu trọng tâm là làm nguôi cơn thịnh nộ hay xóa bỏ tội lỗi.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng và dễ hiểu. Dùng “Chính Ngài” để giữ sắc thái nhấn mạnh; dùng “sinh tế” thay vì thuật ngữ quá chuyên môn, và lặp “tội lỗi chúng ta” để câu rõ nghĩa trong tiếng Việt.
