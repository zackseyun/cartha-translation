  naturalness: “Dục vọng của xác thịt” và “dục vọng của mắt” là những cụm tự nhiên, trang trọng trong văn mạch Kinh Thánh hiện đại. “Sự kiêu ngạo về đời sống” tự nhiên hơn “sự khoe khoang về đời sống” và vẫn giữ được độ rộng của nguyên ngữ.
