id: 1JN.2.16
reference: 1 John 2:16
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὅτι πᾶν τὸ ἐν τῷ κόσμῳ, ἡ ἐπιθυμία τῆς σαρκὸς καὶ ἡ ἐπιθυμία τῶν ὀφθαλμῶν καὶ ἡ ἀλαζονεία τοῦ βίου, οὐκ ἔστιν ἐκ τοῦ πατρός, ἀλλὰ ἐκ τοῦ κόσμου ἐστίν·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/016.yaml
  text: For everything in the world—the desire of the flesh[a], the desire of the eyes, and the pride of life—is not from the Father[c][b], but is from the world.
translation:
  language: vi
  text: Vì mọi điều trong thế gian—dục vọng của xác thịt[a], dục vọng của mắt, và sự kiêu ngạo về đời sống[b]—đều không đến từ Cha, nhưng đến từ thế gian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “ham muốn của xác thịt.” Từ Hy Lạp có thể chỉ ham muốn mạnh, sự thèm khát hoặc dục vọng; ở đây không nhất thiết chỉ nói về ham muốn tình dục. Trong văn cảnh này, “xác thịt” cũng có thể được hiểu theo nghĩa bóng là bản tính con người sa ngã.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch “sự kiêu ngạo của đời sống,” “sự tự phụ về cuộc sống,” hoặc “sự phô trương về cuộc sống mình có.” Cụm từ này có thể bao gồm sự tự phụ về địa vị, của cải, phương tiện sinh sống hoặc lối sống.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Vì
  rationale: Giữ chức năng nêu lý do cho mệnh lệnh ở câu trước và nối ý tự nhiên trong tiếng Việt.
- source_word: πᾶν τὸ ἐν τῷ κόσμῳ
  choice: mọi điều trong thế gian
  rationale: Diễn đạt cấu trúc trung tính số ít mang nghĩa tập hợp, đồng thời giữ phạm vi bao quát.
- source_word: κόσμῳ / κόσμου
  choice: thế gian
  rationale: Giữ cách gọi quen thuộc trong văn cảnh Giăng về trật tự con người đối nghịch với Đức Chúa Trời, không diễn giải quá mức thành một hệ thống cụ thể.
- source_word: ἐπιθυμία
  choice: dục vọng
  rationale: Diễn tả ham muốn mạnh mang sắc thái tiêu cực trong văn cảnh; không giới hạn vào ham muốn tình dục.
- source_word: τῆς σαρκὸς
  choice: của xác thịt
  rationale: Giữ hình ảnh và độ mở thần học của σάρξ thay vì giải nghĩa trực tiếp thành “bản tính tội lỗi”.
- source_word: τῶν ὀφθαλμῶν
  choice: của mắt
  rationale: Cách nói tự nhiên trong tiếng Việt, chỉ những ham muốn được khơi dậy hoặc hướng dẫn bởi điều mắt thấy.
- source_word: ἀλαζονεία τοῦ βίου
  choice: sự khoe khoang về đời sống
  rationale: ἀλαζονεία nhấn mạnh thái độ tự phụ được phô bày; βίος có thể bao gồm cách sống, địa vị, phương tiện sinh sống và của cải.
- source_word: οὐκ ἔστιν ἐκ τοῦ πατρός
  choice: đều không đến từ Cha
  rationale: Diễn đạt rõ nguồn gốc được chỉ bởi ἐκ; “Cha” giữ cách xưng hô trực tiếp của nguyên văn.
- source_word: ἀλλὰ ἐκ τοῦ κόσμου ἐστίν
  choice: nhưng đến từ thế gian
  rationale: Giữ sự đối lập song song về nguồn gốc giữa Cha và thế gian.
theological_decisions:
- issue: Ý nghĩa của σάρξ trong danh sách mang sắc thái đạo đức
  choice: xác thịt
  alternative: bản tính tội lỗi
  rationale: “Xác thịt” bảo toàn hình ảnh nguyên ngữ và không áp đặt một hệ thống nhân học cụ thể; chú thích nêu cách hiểu khả dĩ trong văn cảnh.
- issue: Ý nghĩa của κόσμος
  choice: thế gian
  alternative: hệ thống thế gian sa ngã
  rationale: Nguyên văn giữ từ κόσμος với độ rộng nhất định; bản dịch không chèn phần diễn giải thần học vào chính câu.
- issue: Phạm vi của ἀλαζονεία τοῦ βίου
  choice: sự khoe khoang về đời sống
  alternative: sự kiêu ngạo của đời sống
  rationale: Cách chọn nhấn mạnh sự tự phụ, phô trương mà ἀλαζονεία biểu thị, trong khi chú thích bảo lưu phạm vi của βίος gồm địa vị, của cải và lối sống.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ nhịp ba vế của nguyên văn, dùng “thế gian” và “xác thịt” để bảo toàn sắc thái thần học của văn chương Giăng; các khả năng diễn giải được đặt trong chú thích thay vì đưa vào chính văn.
