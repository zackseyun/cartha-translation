id: 1JN.2.11
reference: 1 John 2:11
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὁ δὲ μισῶν τὸν ἀδελφὸν αὐτοῦ ἐν τῇ σκοτίᾳ ἐστὶν καὶ ἐν τῇ σκοτίᾳ περιπατεῖ, καὶ οὐκ οἶδεν ποῦ ὑπάγει, ὅτι ἡ σκοτία ἐτύφλωσεν τοὺς ὀφθαλμοὺς αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/011.yaml
  text: But the one who hates his brother is in the darkness and walks in the darkness[a], and does not know where he is going, because the darkness has blinded his eyes.
translation:
  language: vi
  text: Nhưng người nào ghét anh em mình thì ở trong bóng tối và bước đi trong bóng tối,[a] và không biết mình đang đi đâu, vì bóng tối đã làm mù mắt người ấy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể hiểu là “anh chị em mình”; từ Hy Lạp nói “anh em” và có lẽ chỉ một người cùng đức tin trong cộng đồng Cơ Đốc.
    reason: lexical_alternative
lexical_decisions:
- source_word: μισῶν
  choice: ghét
  rationale: Phân từ hiện tại có mạo từ chỉ người mang thái độ đặc trưng; “người nào ghét” tự nhiên trong tiếng Việt và không giới hạn vào một hành động nhất thời.
- source_word: ἀδελφὸν
  choice: anh em mình
  rationale: Từ Hy Lạp ở dạng giống đực số ít, nhưng trong văn mạch Giăng thường chỉ một người cùng thuộc cộng đồng đức tin. “Anh em mình” giữ sắc thái thân thuộc và cách dùng Kinh Thánh tự nhiên; phạm vi có thể bao gồm cả nam lẫn nữ được ghi chú.
- source_word: ἐν τῇ σκοτίᾳ
  choice: trong bóng tối
  rationale: Giữ nguyên hình ảnh thần học về bóng tối và sự lặp lại có chủ ý trong nguyên văn, thay vì diễn giải thành “điều ác” hay “tội lỗi”.
- source_word: περιπατεῖ
  choice: bước đi
  rationale: Giữ ẩn dụ về nếp sống và hành vi, vốn quan trọng trong văn phong của Giăng, thay vì làm phẳng thành “sống”.
- source_word: οὐκ οἶδεν ποῦ ὑπάγει
  choice: không biết mình đang đi đâu
  rationale: Cách diễn đạt tiếng Việt hiện đại, tự nhiên, đồng thời giữ hình ảnh chuyển động ở thì hiện tại.
- source_word: ἐτύφλωσεν
  choice: đã làm mù
  rationale: Diễn đạt động từ aorist như một hành động đã xảy ra với hậu quả còn hiện hữu trong văn mạch.
- source_word: τοὺς ὀφθαλμοὺς αὐτοῦ
  choice: mắt người ấy
  rationale: Giữ hình ảnh cụ thể về đôi mắt, đồng thời tránh chuỗi đại từ dễ mơ hồ trong tiếng Việt.
theological_decisions:
- issue: Ý nghĩa đạo đức–thuộc linh của “bóng tối” trong lối trình bày đối lập của Giăng
  choice: Dịch sát là “bóng tối”.
  alternative: “điều ác” hoặc “bóng tối của tội lỗi”
  rationale: Ẩn dụ của Giăng có chiều sâu thần học và đối lập với ánh sáng; không nên thu hẹp ý nghĩa bằng một lời diễn giải giáo lý trong chính văn.
- issue: Đối tượng được gọi là ἀδελφός
  choice: Dùng “anh em mình” trong chính văn và giải thích phạm vi ở chú thích.
  alternative: “anh chị em mình” hoặc “người cùng đức tin”
  rationale: Lựa chọn này giữ gần hình thức giống đực số ít của nguyên văn cùng sắc thái quan hệ trong cộng đồng, nhưng không phủ nhận khả năng từ này đại diện cho cả nam lẫn nữ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ sự lặp lại “trong bóng tối” và ẩn dụ “bước đi” của nguyên văn; dùng “người ấy” ở cuối câu để quy chiếu rõ ràng.
