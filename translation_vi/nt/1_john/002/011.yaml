  terminology: «Anh em mình» phù hợp cách dùng Kinh Thánh tiếng Việt và có thể giữ nghĩa đại diện của ἀδελφός trong cộng đồng đức tin. Chú thích nêu khả năng bao gồm cả nam lẫn nữ mà không thay thế hình thức của chính văn. «Bóng tối» bảo tồn ẩn dụ Giăng, không diễn giải quá mức.
