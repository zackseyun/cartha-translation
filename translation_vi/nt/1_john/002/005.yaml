    rationale: Tiếng Việt hiện đại thường nói «được trọn vẹn» hoặc «được làm cho trọn vẹn». «Được trọn vẹn» giữ ý tình yêu đã đạt trạng thái hoàn tất mà không thêm diễn giải.
  - severity: low
    issue: Thiếu từ nối «rằng» sau «chúng ta biết».
    rationale: ὅτι mở đầu mệnh đề nội dung; thêm «rằng» giúp tiếng Việt minh bạch hơn mà không thay đổi nghĩa.
  - severity: low
    issue: Chú thích giải thích nghĩa thứ hai của «tình yêu của Đức Chúa Trời» bằng «người tin».
    rationale: Câu chỉ nói «người ấy»; dùng lại cách gọi trung tính này tránh thêm một định danh diễn giải.
