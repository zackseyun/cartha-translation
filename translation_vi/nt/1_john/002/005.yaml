language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὃς δ’ ἂν τηρῇ αὐτοῦ τὸν λόγον, ἀληθῶς ἐν τούτῳ ἡ ἀγάπη τοῦ θεοῦ τετελείωται. ἐν τούτῳ γινώσκομεν ὅτι ἐν αὐτῷ ἐσμεν·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/005.yaml
  text: 'But whoever keeps his word[a], truly in him the love of God has been perfected[b]. By this we know that we are in him:'
translation:
  language: vi
  text: 'Nhưng ai giữ lời Ngài thì tình yêu của Đức Chúa Trời thật sự đã được trọn vẹn trong người ấy.[a] Bởi điều này, chúng ta biết rằng mình ở trong Ngài:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cụm từ Hy Lạp được dịch là “trong người ấy” cũng có thể dịch sát hơn là “trong điều này”; khi ấy, nó chỉ chính việc giữ lời Ngài như bằng chứng. “Tình yêu của Đức Chúa Trời” có thể là tình yêu Đức Chúa Trời dành cho người ấy hoặc tình yêu của người ấy dành cho Đức Chúa Trời.
    reason: alternative_reading
lexical_decisions:
- source_word: ὃς δ’ ἂν
  choice: Nhưng ai
  rationale: 'Đại từ quan hệ đi với ἄν diễn tả một điều kiện khái quát: bất cứ ai. “Nhưng” giữ sắc thái tương phản nhẹ của δέ với câu trước.'
- source_word: τηρῇ
  choice: giữ
  rationale: τηρέω có nghĩa giữ, tuân giữ hoặc vâng theo. “Giữ” tự nhiên trong văn phong Giăng và không thu hẹp ý nghĩa vào sự vâng lời bề ngoài.
- source_word: αὐτοῦ τὸν λόγον
  choice: lời Ngài
  rationale: λόγος số ít chỉ lời hoặc sứ điệp được truyền đạt. “Lời Ngài” giữ được cách diễn đạt đặc trưng của Giăng và đại từ trong nguyên văn.
- source_word: ἀληθῶς
  choice: thật sự
  rationale: Giữ chức năng nhấn mạnh của trạng từ ἀληθῶς bằng cách diễn đạt tự nhiên trong tiếng Việt hiện đại.
- source_word: ἐν τούτῳ
  choice: trong người ấy
  rationale: τούτῳ có thể quy chiếu đến người giữ lời Ngài; “trong người ấy” rõ nghĩa và không thêm giới tính vốn không có trong tiếng Hy Lạp. Khả năng hiểu là “trong điều này” được ghi ở chú thích.
- source_word: ἡ ἀγάπη τοῦ θεοῦ
  choice: tình yêu của Đức Chúa Trời
  rationale: 'Cách dịch này giữ nguyên sự mơ hồ của sở hữu cách Hy Lạp: có thể là tình yêu đến từ Đức Chúa Trời hoặc tình yêu hướng về Đức Chúa Trời.'
- source_word: τετελείωται
  choice: đã được nên trọn
  rationale: Thì hoàn thành bị động diễn tả một hành động đã đưa tình yêu đến trạng thái trọn vẹn và trạng thái ấy còn tiếp diễn. “Được nên trọn” giữ sắc thái hoàn tất hoặc đạt đến mục tiêu.
- source_word: ἐν τούτῳ γινώσκομεν
  choice: Bởi điều này, chúng ta biết
  rationale: Công thức của Giăng nêu căn cứ hoặc dấu hiệu để nhận biết; “bởi điều này” giữ rõ lực chỉ định của τούτῳ.
- source_word: ὅτι ἐν αὐτῷ ἐσμεν
  choice: mình ở trong Ngài
  rationale: “Ở trong Ngài” giữ nguyên thành ngữ thần học quan trọng của Giăng mà không diễn giải thêm thành sự hiệp nhất. “Mình” thay cho việc lặp lại “chúng ta” và vẫn rõ chủ thể.
theological_decisions:
- issue: Ý nghĩa sở hữu cách trong ἡ ἀγάπη τοῦ θεοῦ
  choice: tình yêu của Đức Chúa Trời
  alternative: tình yêu Đức Chúa Trời dành cho người tin; hoặc tình yêu của người tin dành cho Đức Chúa Trời
  rationale: Sở hữu cách Hy Lạp thực sự có thể được hiểu theo cả hướng chủ thể lẫn đối tượng. Bản văn chính giữ cách nói rộng thay vì quyết định một hướng thần học.
- issue: Sở chỉ của ἐν τούτῳ trong mệnh đề đầu
  choice: trong người ấy
  alternative: trong điều này
  rationale: Ngữ cảnh gần nhất cho phép hiểu đại từ chỉ người giữ lời Ngài, nhưng dạng trung tính của tiếng Hy Lạp cũng có thể chỉ chính sự việc này như bằng chứng. Chú thích bảo tồn khả năng thứ hai.
- issue: Chủ thể được αὐτοῦ và αὐτῷ chỉ đến
  choice: Ngài
  alternative: Đức Chúa Trời hoặc Đức Chúa Giê-su Christ theo mạch văn rộng hơn
  rationale: Nguyên văn chỉ dùng đại từ, nên bản dịch không chèn một danh xưng cụ thể để giải quyết sở chỉ vốn cần được xác định từ ngữ cảnh.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “Đức Chúa Trời” cho θεός và viết hoa “Ngài” theo quy ước tôn kính phổ biến. Giữ các cách nói đặc trưng của Giăng như “giữ lời,” “được nên trọn” và “ở trong Ngài,” đồng thời dùng chú thích để bảo tồn những điểm mơ hồ có thật trong nguyên văn.
