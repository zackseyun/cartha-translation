  naturalness: «Đã được nên trọn» không tự nhiên trong tiếng Việt tiêu chuẩn hiện đại và có sắc thái dịch sát. «Đã được trọn vẹn» vừa tự nhiên hơn vừa vẫn diễn đạt kết quả hiện tại của thể hoàn thành bị động. Thêm «rằng» sau «chúng ta biết» làm mệnh đề ὅτι rõ và trôi chảy hơn.
  terminology: «Giữ lời», «tình yêu của Đức Chúa Trời», và «ở trong Ngài» phù hợp với văn phong Giăng và giữ độ mở cần thiết. Viết hoa «Ngài» nhất quán với quy ước tôn kính đã chọn. Chú thích được chỉnh nhẹ để không gọi đích danh «người tin», một chi tiết không có trong câu.
  issues:
