  text: I have written these things to you concerning those who are leading you astray[a].
translation:
  language: vi
  text: Tôi đã viết những điều này cho anh em về những người đang dẫn anh em đi lạc[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “những người lừa dối anh em” hoặc “những người làm anh em lạc lối.” Phân từ hiện tại Hy Lạp mô tả hoạt động đang diễn ra và tự nó không nói rõ hoạt động ấy đã thành công hay chưa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταῦτα
  choice: những điều này
  rationale: Đại từ chỉ định trung tính số nhiều, quy chiếu về nội dung vừa được viết ở phần trước.
- source_word: ἔγραψα
  choice: Tôi viết
  rationale: Thì aorist chỉ hành động viết đã được thực hiện; tiếng Việt không cần đánh dấu thì hoàn thành bằng một trợ từ nếu văn cảnh đã rõ.
- source_word: ὑμῖν
  choice: cho anh em
  rationale: Dative chỉ người nhận. “Anh em” là cách xưng hô tự nhiên, trang trọng với cộng đồng tín hữu và không nhất thiết chỉ nam giới.
- source_word: περὶ
  choice: về
  rationale: Giới từ nêu chủ đề; “về” tự nhiên và rõ nghĩa trong tiếng Việt hiện đại.
- source_word: τῶν πλανώντων ὑμᾶς
  choice: những kẻ đang tìm cách dẫn anh em đi lạc
  rationale: Phân từ hiện tại chủ động mô tả hoạt động hướng vào người đọc. “Dẫn … đi lạc” giữ hình ảnh của πλανάω; “tìm cách” không khẳng định rằng họ đã thành công.
theological_decisions:
- issue: πλανώντων diễn tả sự lừa dối đã thành công hay hoạt động nhằm làm người đọc lạc hướng
  choice: những kẻ đang tìm cách dẫn anh em đi lạc
  alternative: những kẻ đang dẫn anh em đi lạc; những kẻ lừa dối anh em
  rationale: Nguyên văn nhận diện các đối thủ qua hành động của họ nhưng không buộc phải hiểu rằng người đọc đã thực sự bị lừa. Bản dịch giữ lại sự căng thẳng này, không khẳng định kết quả.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh em” theo lối xưng hô cộng đồng, bao gồm toàn thể người nhận; “những kẻ” thể hiện sắc thái cảnh báo đối với các đối thủ.
