id: 1JN.2.24
reference: 1 John 2:24
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸀ὑμεῖς ὃ ἠκούσατε ἀπ’ ἀρχῆς, ἐν ὑμῖν μενέτω· ἐὰν ἐν ὑμῖν μείνῃ ὃ ἀπ’ ἀρχῆς ἠκούσατε, καὶ ὑμεῖς ἐν τῷ υἱῷ καὶ ἐν τῷ πατρὶ μενεῖτε.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/024.yaml
  text: As for you[a], let what you heard from the beginning remain in you. If what you heard from the beginning remains in you[b], you also will remain in the Son and in the Father.
translation:
  language: vi
  text: Còn anh em, hãy để điều anh em đã nghe từ ban đầu ở lại trong anh em. Nếu điều anh em đã nghe từ ban đầu ở lại trong anh em, thì anh em cũng sẽ ở lại trong Con và trong Cha.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑμεῖς
  choice: Còn anh em
  rationale: Đại từ được đặt đầu câu mang sắc thái nhấn mạnh và đối chiếu; “Còn anh em” diễn đạt tự nhiên sự chuyển hướng khỏi những kẻ dạy sai trong văn cảnh.
- source_word: ὃ ἠκούσατε ἀπ’ ἀρχῆς
  choice: điều anh em đã nghe từ ban đầu
  rationale: Giữ đại từ quan hệ ở nghĩa rộng là “điều”, không diễn giải hẹp thành “Tin Lành” hay “sứ điệp”, đồng thời bảo toàn cách nói đặc trưng của Giăng.
- source_word: ἀπ’ ἀρχῆς
  choice: từ ban đầu
  rationale: Cách dịch trang trọng nhưng tự nhiên, giữ được âm hưởng thần học của cụm từ trong các trước tác của Giăng.
- source_word: ἐν ὑμῖν μενέτω
  choice: hãy để ... cứ ở trong anh em
  rationale: Thể mệnh lệnh hiện tại kêu gọi sự tiếp diễn; “cứ ở” truyền đạt tính bền lâu và có thể dùng nhất quán cho μένω mà không quá cổ kính.
- source_word: ἐὰν ἐν ὑμῖν μείνῃ
  choice: Nếu ... cứ ở trong anh em
  rationale: Giữ rõ cấu trúc điều kiện và lặp lại cùng cách dịch μένω để bảo toàn liên kết từ vựng trong câu.
- source_word: καὶ ὑμεῖς
  choice: thì anh em cũng
  rationale: “Cũng” thể hiện καί, còn “thì” làm rõ quan hệ điều kiện-kết quả tự nhiên trong tiếng Việt mà không thêm nội dung thần học.
- source_word: ἐν τῷ υἱῷ καὶ ἐν τῷ πατρὶ
  choice: trong Con và trong Cha
  rationale: Lặp lại “trong” theo nguyên văn, giữ thế song song về mối tương giao; “Con” và “Cha” viết hoa vì đây là các danh xưng chỉ Đức Chúa Con và Đức Chúa Cha.
- source_word: μενεῖτε
  choice: sẽ ở
  rationale: Dịch trực tiếp thì tương lai, đồng thời duy trì liên hệ với các lần xuất hiện trước của μένω qua động từ “ở”.
theological_decisions:
- issue: Bản chất của lời khẳng định có điều kiện ở mệnh đề cuối
  choice: Dịch thì tương lai trực tiếp là “anh em cũng sẽ ở trong Con và trong Cha”.
  alternative: Hiểu mệnh đề này như một lời khuyên, hoặc diễn giải theo một lập trường hệ thống về sự bền đỗ.
  rationale: Bản Hy Lạp trình bày một kết quả tương lai gắn với điều kiện điều đã nghe tiếp tục ở trong người nghe. Bản dịch giữ nguyên sức căng ấy, không giải quyết theo một hệ phái.
- issue: Sở chỉ của ὃ ἠκούσατε ἀπ’ ἀρχῆς
  choice: Giữ cách nói khái quát “điều anh em đã nghe từ ban đầu”.
  alternative: “Tin Lành” hoặc “sứ điệp của các sứ đồ”.
  rationale: Văn cảnh có thể hướng đến lời công bố ban đầu về Con, nhưng nguyên văn chỉ dùng đại từ quan hệ trung tính; không nên thu hẹp sở chỉ trong chính văn.
- issue: Ý nghĩa của việc “ở trong” Con và Cha
  choice: Giữ nguyên ngôn ngữ quan hệ “ở trong”, không giải thích thêm.
  alternative: Diễn giải thành hiệp nhất bí tích, địa vị cứu rỗi, hoặc một mô hình giáo lý riêng.
  rationale: Cách diễn đạt của Giăng giàu chiều sâu thần học nhưng câu này không tự xác định một khuôn khổ hệ thống cụ thể.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “anh em” cho số nhiều trong lời nói với cộng đồng tín hữu; nhất quán dịch μένω bằng “ở/cứ ở”, tránh từ cổ “lưu trú” hoặc cách diễn giải quá mức như “gắn bó”. Không cần chú thích vì chính văn giữ được cả tính khái quát của ὃ và sự lặp từ của μένω.
