  text: ἐὰν εἰδῆτε ὅτι δίκαιός ἐστιν, γινώσκετε ⸀ὅτι πᾶς ὁ ποιῶν τὴν δικαιοσύνην ἐξ αὐτοῦ γεγέννηται.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/029.yaml
  text: If you know that he is righteous[b][a], you know that everyone who practices righteousness has been born of him.
translation:
  language: vi
  text: Nếu anh em biết rằng Ngài là công chính[a], thì anh em biết rằng mọi người thực hành sự công chính đều đã được sinh ra từ Ngài.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ngài” trong cả hai chỗ có thể chỉ Đức Chúa Trời là Cha hoặc Đức Chúa Con; tiếng Hy Lạp ở đây không nêu rõ sở chỉ.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐὰν εἰδῆτε
  choice: Nếu anh em biết
  rationale: Giữ sắc thái điều kiện của ἐὰν và diễn đạt οἶδα tự nhiên bằng “biết”; “anh em” phù hợp với cách tác giả trực tiếp nói với cộng đồng tín hữu.
- source_word: δίκαιός
  choice: công chính
  rationale: “Công chính” diễn đạt phẩm tính ngay thẳng về đạo đức và thần học, đồng thời duy trì liên hệ với δικαιοσύνη ở vế sau.
- source_word: γινώσκετε
  choice: anh em cũng biết
  rationale: Hiểu hình thức này là chỉ định cách, không phải mệnh lệnh; thêm “cũng” làm rõ quan hệ suy luận tự nhiên giữa hai mệnh đề mà không thay đổi nội dung.
- source_word: πᾶς ὁ ποιῶν τὴν δικαιοσύνην
  choice: bất cứ ai thực hành điều công chính
  rationale: “Thực hành” thể hiện hành động có tính đặc trưng hoặc tiếp diễn của phân từ hiện tại; “điều công chính” tự nhiên hơn danh từ trừu tượng đơn lập trong tiếng Việt và vẫn giữ sự liên hệ từ vựng với “công chính”.
- source_word: ἐξ αὐτοῦ γεγέννηται
  choice: đều đã được sinh ra từ Ngài
  rationale: “Đã được sinh ra” bảo toàn thể hoàn thành và thể bị động, hàm ý một sự sinh ra đã xảy ra với kết quả còn tiếp diễn; “từ Ngài” diễn đạt nguồn gốc của ἐξ αὐτοῦ.
theological_decisions:
- issue: Sở chỉ của đại từ trong δίκαιός ἐστιν và ἐξ αὐτοῦ
  choice: Dùng “Đấng ấy/Ngài” mà không xác định là Đức Chúa Cha hay Đức Chúa Con.
  alternative: Nêu rõ Đức Chúa Trời là Cha hoặc Đức Chúa Con.
  rationale: Câu Hy Lạp không nêu danh tính sở chỉ, còn văn cảnh có thể được hiểu theo cả hai hướng. Bản dịch giữ nguyên độ mở thần học thay vì quyết định thay cho độc giả.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh em” theo lối xưng hô cộng đồng trong thư tín; viết hoa “Đấng ấy/Ngài” vì đại từ có thể quy chiếu đến Đức Chúa Trời hoặc Đức Chúa Con, nhưng chú thích vẫn giữ nguyên sự không xác định của nguyên văn.
