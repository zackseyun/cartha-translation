revisions:
- from: Nếu anh em biết rằng Đấng ấy là công chính[a], thì anh em cũng biết rằng bất cứ ai thực hành điều công chính đều đã được sinh ra từ Ngài.
  to: Nếu anh em biết rằng Ngài là công chính[a], thì anh em biết rằng mọi người thực hành sự công chính đều đã được sinh ra từ Ngài.
  rationale: Thay “Đấng ấy” bằng “Ngài” để phản ánh đại từ chủ ngữ hàm ẩn của tiếng Hy Lạp một cách tự nhiên và không thêm sắc thái chỉ định. Thay “điều công chính” bằng “sự công chính” để bảo toàn thuật ngữ δικαιοσύνη và sự liên kết với δίκαιος. Cấu trúc chỉ định của γινώσκετε được giữ theo cách hiểu của bản tiếng Anh POB; bản dịch không giải quyết sở chỉ đang được tranh luận.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T00:30:21Z'
