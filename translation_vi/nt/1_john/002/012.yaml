base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/012.yaml
  text: I am writing to you[a], little children[c][b], because your sins have been forgiven for the sake of his name.
translation:
  language: vi
  text: Hỡi các con thân yêu, tôi đang viết cho các con[a], vì[b] tội lỗi của các con đã được tha vì danh Ngài[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Tôi viết cho các con.” Thì hiện tại Hy Lạp có thể được hiểu là hiện tại đơn hoặc là hành động đang diễn ra trong bối cảnh thư tín.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “rằng tội lỗi của các con đã được tha.” Liên từ Hy Lạp có thể giới thiệu nội dung của điều được viết, dù ở đây nhiều khả năng nó nêu lý do viết.'
    reason: alternative_reading
  - marker: c
    text: Trong câu này, “Ngài” có thể được hiểu là Đức Chúa Trời hoặc Chúa Giê-su; nguyên văn Hy Lạp không nêu rõ.
    reason: alternative_reading
lexical_decisions:
- source_word: Γράφω
  choice: Tôi đang viết
  rationale: Thì hiện tại có thể diễn tả hành động viết đang diễn ra trong bối cảnh thư tín; cách dịch này tự nhiên trong tiếng Việt mà không làm thay đổi ý nghĩa.
- source_word: τεκνία
  choice: các con thân yêu
  rationale: Danh từ hô cách mang sắc thái gia đình và trìu mến, không nhất thiết chỉ tuổi nhỏ. Cách dịch này truyền đạt tình cảm ấy tự nhiên hơn “các con bé nhỏ” trong tiếng Việt hiện đại.
- source_word: ὅτι
  choice: vì
  rationale: Trong mạch văn, liên từ nhiều khả năng nêu lý do tác giả viết; “vì” thể hiện rõ quan hệ này.
- source_word: ἀφέωνται
  choice: đã được tha
  rationale: Dạng hoàn thành bị động chỉ một hành động đã hoàn tất với kết quả còn hiệu lực; “đã được tha” giữ được cả thể bị động lẫn kết quả hiện tại.
- source_word: αἱ ἁμαρτίαι ... ὑμῖν
  choice: tội lỗi của các con
  rationale: Dữ cách ὑμῖν trong cấu trúc nói về sự tha thứ tự nhiên được diễn đạt bằng sở hữu trong tiếng Việt.
- source_word: διὰ τὸ ὄνομα αὐτοῦ
  choice: vì danh Ngài
  rationale: διά với đối cách nêu nguyên do hoặc cơ sở. “Vì danh Ngài” giữ nguyên hình ảnh thần học của “danh” và tự nhiên, trang trọng trong tiếng Việt.
- source_word: ὄνομα
  choice: danh
  rationale: “Danh” giữ được ý nghĩa cá vị và thần học rộng hơn “danh tiếng”, đồng thời phù hợp với văn phong Kinh Thánh bằng tiếng Việt.
theological_decisions:
- issue: Đối tượng mà đại từ αὐτοῦ (“Ngài”) chỉ về
  choice: Giữ đại từ “Ngài” mà không xác định rõ trong chính văn
  alternative: Ghi rõ “Đức Chúa Trời” hoặc “Chúa Giê-su”
  rationale: Câu này không nêu đích danh đối tượng, còn ngữ cảnh rộng hơn có thể được hiểu theo hai hướng. Giữ đại từ bảo toàn sự hàm hồ của nguyên văn và tránh áp đặt một cách giải nghĩa.
- issue: Chức năng của ὅτι
  choice: 'Hiểu là nêu lý do: “vì”'
  alternative: 'Hiểu là giới thiệu nội dung: “rằng”'
  rationale: Mạch diễn ngôn ở đây nghiêng về lý do Giăng viết, nhưng khả năng ngữ pháp còn lại được ghi trong chú thích.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. “Các con thân yêu” truyền đạt giọng trìu mến của τεκνία mà không giới hạn người nghe vào trẻ nhỏ. Đại từ “Ngài” giữ giọng tôn kính và không giải quyết thay cho nguyên văn đối tượng được nói đến.
