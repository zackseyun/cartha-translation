revisions:
- from: Tôi đang viết cho các con[a], hỡi các con thân yêu, vì[b] tội lỗi của các con đã được tha vì danh Ngài[c].
  to: Hỡi các con thân yêu, tôi đang viết cho các con[a], vì[b] tội lỗi của các con đã được tha vì danh Ngài[c].
  rationale: Bản sửa chỉ điều chỉnh trật tự từ để tiếng Việt tự nhiên hơn và sửa một lỗi diễn đạt trong chú thích. Không thay đổi nghĩa, các lựa chọn thuật ngữ chủ yếu, hay sự mơ hồ có chủ ý về đối tượng của “Ngài.”
