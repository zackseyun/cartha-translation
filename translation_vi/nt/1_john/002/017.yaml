language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ὁ κόσμος παράγεται καὶ ἡ ἐπιθυμία αὐτοῦ, ὁ δὲ ποιῶν τὸ θέλημα τοῦ θεοῦ μένει εἰς τὸν αἰῶνα.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/017.yaml
  text: And the world is passing away[a], along with its desire[b], but the one who does the will of God remains forever.
translation:
  language: vi
  text: Thế gian đang qua đi, cùng với ham muốn của nó; nhưng người làm theo ý muốn của Đức Chúa Trời thì còn mãi[a] đời đời.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Còn mãi” dịch động từ Hy Lạp μένει, cũng có thể dịch là “ở lại” hoặc “bền vững”. Đây là một động từ quan trọng trong các văn phẩm của Giăng.
    reason: lexical_alternative
lexical_decisions:
- source_word: κόσμος
  choice: thế gian
  rationale: Trong văn mạch Giăng, từ này chỉ thế giới loài người với các giá trị chống nghịch Đức Chúa Trời, chứ không đơn thuần là cõi thọ tạo vật chất. “Thế gian” là cách dịch quen thuộc, rộng nghĩa và để văn mạch 2:15–16 xác định sắc thái.
- source_word: παράγεται
  choice: đang qua đi
  rationale: Thì hiện tại diễn tả một tiến trình đang diễn ra; cách dịch này giữ được ý về tính tạm thời và sự tiêu biến dần của thế gian.
- source_word: ἐπιθυμία
  choice: những ham muốn
  rationale: Từ này chỉ ham muốn mạnh mẽ và mang nghĩa tiêu cực trong văn mạch. “Ham muốn” tự nhiên trong tiếng Việt và không thu hẹp nghĩa vào dục vọng tình dục; dùng số nhiều để diễn đạt tự nhiên các dạng ham muốn của thế gian đã nêu ở 2:16.
- source_word: αὐτοῦ
  choice: của nó
  rationale: Đại từ quy chiếu về κόσμος; “của nó” giữ quan hệ sở thuộc mà không nhân cách hóa quá mức.
- source_word: ὁ δὲ ποιῶν
  choice: nhưng người làm theo
  rationale: Phân từ có mạo từ chỉ người được đặc trưng bởi việc thực hiện ý muốn của Đức Chúa Trời. “Người làm theo” tự nhiên và giữ sắc thái đại diện ở số ít.
- source_word: τὸ θέλημα τοῦ θεοῦ
  choice: ý muốn của Đức Chúa Trời
  rationale: Giữ cách diễn đạt thần học quen thuộc và ý về điều Đức Chúa Trời muốn, không giản lược thành sở thích.
- source_word: μένει
  choice: còn lại
  rationale: Diễn tả sự tiếp tục tồn tại, tương phản trực tiếp với thế gian đang qua đi. Đây là cách nói hiện đại, đồng thời vẫn giữ nét nghĩa của động từ chủ chốt μένω trong văn phẩm Giăng.
- source_word: εἰς τὸν αἰῶνα
  choice: đời đời
  rationale: Thành ngữ ở đây chỉ sự bền còn không chấm dứt; “đời đời” trang trọng, dễ hiểu và phù hợp văn phong Kinh Thánh tiếng Việt.
theological_decisions:
- issue: Ý nghĩa của κόσμος trong văn mạch Giăng
  choice: giữ từ rộng nghĩa “thế gian”, được văn mạch hiểu là trật tự và các giá trị của loài người chống nghịch Đức Chúa Trời
  alternative: cõi thọ tạo vật chất
  rationale: 2:15–16 mô tả thế gian bằng các ham muốn và sự kiêu ngạo. Bản dịch không thu hẹp nghĩa ngay trong câu nhưng để văn mạch bảo toàn chiều kích đạo đức-thần học.
- issue: Ý nghĩa của μένει εἰς τὸν αἰῶνα
  choice: người làm theo ý muốn Đức Chúa Trời bền còn đời đời
  alternative: diễn giải trực tiếp thành một tuyên bố kỹ thuật về sự sống đời đời
  rationale: Nguyên văn khẳng định sự bền còn nhưng không giải thích cơ chế giáo lý; bản dịch giữ nguyên sức nặng thần học mà không thêm khái niệm ngoài câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Giữ “thế gian” và “Đức Chúa Trời” theo cách dùng Kinh Thánh tiếng Việt phổ biến. Dấu chấm phẩy làm rõ thế tương phản giữa điều đang qua đi và người còn lại đời đời.
