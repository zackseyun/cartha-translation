id: 1JN.2.7
reference: 1 John 2:7
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸀Ἀγαπητοί, οὐκ ἐντολὴν καινὴν γράφω ὑμῖν, ἀλλ’ ἐντολὴν παλαιὰν ἣν εἴχετε ἀπ’ ἀρχῆς· ἡ ἐντολὴ ἡ παλαιά ἐστιν ὁ λόγος ὃν ⸀ἠκούσατε.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/007.yaml
  text: Beloved[a], I am not writing a new commandment to you, but an old commandment that you have had from the beginning. The old commandment is the message that you heard.
translation:
  language: vi
  text: Anh chị em yêu dấu, tôi viết cho anh chị em không phải một điều răn mới, nhưng là một điều răn cũ mà anh chị em đã có từ ban đầu. Điều răn cũ ấy chính là sứ điệp[a] mà anh chị em đã nghe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay “lời”: “Điều răn cũ ấy chính là lời mà anh chị em đã nghe.”'
    reason: Ghi nhận nghĩa sát mặt chữ và phương án dịch chính đáng của λόγος, trong khi chính văn dùng “sứ điệp” để truyền đạt rõ nghĩa theo ngữ cảnh.
lexical_decisions:
- source_word: Ἀγαπητοί
  choice: Anh chị em yêu dấu
  rationale: Cách xưng hô số nhiều này vừa tự nhiên trong cộng đồng tín hữu Việt ngữ, vừa giữ được sắc thái trìu mến và mối liên hệ từ vựng với ý niệm yêu thương.
- source_word: ἐντολήν
  choice: điều răn
  rationale: “Điều răn” giữ được sức nặng thần học và sự liên kết với cách dùng quen thuộc trong văn chương Giăng, rõ hơn “mệnh lệnh” trong ngữ cảnh này.
- source_word: καινήν
  choice: mới
  rationale: Cách dịch trực tiếp, tự nhiên, đồng thời bảo toàn thế đối lập với παλαιάν, “cũ”.
- source_word: γράφω
  choice: tôi viết
  rationale: Thì hiện tại Hy Lạp chỉ hành động viết thư đang diễn ra; tiếng Việt diễn đạt tự nhiên bằng “tôi viết” mà không cần thêm dấu hiệu tiếp diễn.
- source_word: παλαιάν / παλαιά
  choice: cũ
  rationale: Giữ nguyên sự tương phản trực tiếp “mới/cũ” và ý rằng điều răn này đã hiện diện từ ban đầu.
- source_word: εἴχετε
  choice: đã có
  rationale: Diễn đạt sự sở hữu bắt đầu trong quá khứ; kết hợp với “từ ban đầu” cho thấy tính kéo dài mà không làm câu tiếng Việt nặng nề.
- source_word: ἀπ’ ἀρχῆς
  choice: từ ban đầu
  rationale: Giữ nguyên độ rộng và sự mơ hồ có chủ ý của thành ngữ Giăng, không xác định đó là khởi đầu đời sống đức tin hay một khởi đầu tuyệt đối.
- source_word: λόγος
  choice: sứ điệp
  rationale: Trong ngữ cảnh, từ này nói đến nội dung đã được công bố và người đọc đã nghe. “Sứ điệp” sáng nghĩa trong tiếng Việt hiện đại; phương án sát mặt chữ “lời” được ghi ở chú thích.
- source_word: ἠκούσατε
  choice: anh chị em đã nghe
  rationale: Dạng quá khứ đơn trong nguyên văn hướng đến việc người đọc đã tiếp nhận lời công bố; “đã nghe” là cách diễn đạt tự nhiên và chính xác.
theological_decisions:
- issue: Sở chỉ của cụm “từ ban đầu”
  choice: Giữ nguyên “từ ban đầu”, không xác định cụ thể đó là lúc nào.
  alternative: “Từ khi anh chị em bắt đầu tin” hoặc “từ buổi đầu sứ điệp Tin Lành được công bố”.
  rationale: Ngữ cảnh có thể hướng đến thời điểm độc giả tiếp nhận sự dạy dỗ, nhưng nguyên văn không giới hạn rõ; bản dịch bảo toàn độ rộng thần học của cụm từ.
- issue: Mối quan hệ giữa “điều răn cũ” và “sứ điệp”
  choice: 'Dịch thẳng sự đồng nhất: “Điều răn cũ ấy chính là sứ điệp…”.'
  alternative: Giải thích thêm nội dung điều răn từ các câu lân cận hoặc thần học rộng hơn.
  rationale: Nguyên văn trực tiếp đồng nhất điều răn cũ với λόγος mà độc giả đã nghe; không nên đưa lời giải nghĩa ngoài văn bản vào câu dịch.
translation_notes:
  register: Văn phong hiện đại, trang trọng và gần gũi. “Anh chị em” thể hiện lời gọi cộng đồng số nhiều tự nhiên trong tiếng Việt; “yêu dấu” giữ giọng mục vụ trìu mến. Cấu trúc lặp “điều răn mới/điều răn cũ” được bảo toàn để phản ánh lập luận của nguyên văn.
