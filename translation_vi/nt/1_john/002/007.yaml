  terminology: “Anh chị em yêu dấu” phù hợp với Ἀγαπητοί và giọng điệu Giăng; “điều răn” bảo toàn trọng lượng của ἐντολή; “sứ điệp” là cách hiểu ngữ cảnh tự nhiên của λόγος. Chú thích “Hay ‘lời’” cung cấp phương án từ vựng sát chữ hợp lệ, được neo đúng tại “sứ điệp.”
