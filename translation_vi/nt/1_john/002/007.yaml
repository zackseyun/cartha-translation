  source_fidelity: 'Bản dịch theo sát SBLGNT: giữ đúng lời xưng hô số nhiều trìu mến, thế đối lập “mới/cũ,” mệnh đề quan hệ nói về điều răn mà độc giả “đã có từ ban đầu,” và sự đồng nhất điều răn cũ với λόγος mà họ đã nghe. “Đã có từ ban đầu” diễn đạt thỏa đáng thì chưa hoàn thành εἴχετε trong tiếng Việt mà không thu hẹp sở chỉ của ἀπ’ ἀρχῆς.'
