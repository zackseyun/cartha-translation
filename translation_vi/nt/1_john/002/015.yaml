id: 1JN.2.15
reference: 1 John 2:15
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Μὴ ἀγαπᾶτε τὸν κόσμον μηδὲ τὰ ἐν τῷ κόσμῳ. ἐάν τις ἀγαπᾷ τὸν κόσμον, οὐκ ἔστιν ἡ ἀγάπη τοῦ πατρὸς ἐν αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/015.yaml
  text: Do not love the world or the things in the world[a]. If anyone loves the world[c][b], the love of the Father is not in him.
translation:
  language: vi
  text: Đừng yêu thế gian, cũng đừng yêu những gì ở trong thế gian.[a] Nếu ai yêu thế gian, thì tình yêu của Cha không ở trong người ấy.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “cũng không yêu những gì ở trong thế gian.”'
    reason: lexical_alternative
  - marker: b
    text: “Tình yêu của Cha” có thể có nghĩa là “lòng yêu mến dành cho Cha”; ít có khả năng hơn, là “tình yêu của Cha”.
    reason: alternative_reading
lexical_decisions:
- source_word: Μὴ ἀγαπᾶτε
  choice: Đừng yêu
  rationale: Thể mệnh lệnh hiện tại với μή có thể là lời cấm chung hoặc ngăn một hành động đang tiếp diễn. “Đừng yêu” tự nhiên trong tiếng Việt và không quyết định quá mức sắc thái thể.
- source_word: τὸν κόσμον
  choice: thế gian
  rationale: Trong ngữ cảnh này, κόσμος chỉ trật tự con người chống nghịch Đức Chúa Trời, chứ không đơn thuần là cõi tạo vật. “Thế gian” là cách dịch Kinh Thánh quen thuộc, ngắn gọn và đủ rộng để ngữ cảnh xác định ý nghĩa.
- source_word: μηδὲ τὰ ἐν τῷ κόσμῳ
  choice: cũng đừng yêu những gì ở trong thế gian
  rationale: μηδέ nối thêm một điều bị cấm; tiếng Việt tự nhiên diễn đạt bằng “cũng đừng”. Việc lặp lại “yêu” làm câu rõ nghĩa mà không thêm nội dung.
- source_word: ἐάν τις ἀγαπᾷ
  choice: Nếu ai yêu
  rationale: “Ai” diễn đạt tự nhiên đại từ bất định τις và giữ phạm vi áp dụng khái quát của mệnh đề điều kiện.
- source_word: ἡ ἀγάπη τοῦ πατρὸς
  choice: tình yêu của Cha
  rationale: Cách dịch gần hình thức Hy Lạp giữ lại khả năng τοῦ πατρός có nghĩa là tình yêu hướng về Cha hoặc tình yêu phát xuất từ Cha; chú thích nêu rõ hai cách hiểu.
- source_word: τοῦ πατρὸς
  choice: của Cha
  rationale: “Cha” viết hoa giữ nguyên tước hiệu quan hệ trong văn mạch của Giăng mà không thêm danh xưng giải thích không có trong nguyên văn.
- source_word: ἐν αὐτῷ
  choice: ở trong người ấy
  rationale: “Người ấy” diễn đạt tự nhiên đại từ số ít giống đực được dùng theo nghĩa khái quát trong tiếng Hy Lạp, đồng thời tránh khiến câu tiếng Việt bị hiểu là chỉ nói về nam giới.
theological_decisions:
- issue: Ý nghĩa của “thế gian” trong đạo đức học của Giăng
  choice: Giữ cách dịch “thế gian” trong chính văn, để văn mạch chỉ trật tự sa ngã đối nghịch với Đức Chúa Trời.
  alternative: trật tự thế gian; hệ thống thế gian
  rationale: Nguyên văn không lên án cõi tạo vật hay con người nói chung. Tuy vậy, đưa phần giải nghĩa trực tiếp vào chính văn sẽ thu hẹp κόσμος quá sớm, nên ý nghĩa theo văn mạch được trình bày trong chú thích.
- issue: Quan hệ sở hữu trong cụm ἡ ἀγάπη τοῦ πατρὸς
  choice: Dịch “tình yêu của Cha” để giữ sự hàm hồ của cấu trúc Hy Lạp.
  alternative: lòng yêu mến dành cho Cha; tình yêu của Cha dành cho người ấy
  rationale: Sự đối lập với việc yêu thế gian nghiêng về nghĩa “lòng yêu mến dành cho Cha”, nhưng ngữ pháp cũng cho phép hiểu là tình yêu phát xuất từ Cha. Không nên âm thầm loại bỏ một khả năng có thật.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “thế gian” vì đây là thuật ngữ ngắn gọn, quen thuộc trong văn mạch Giăng; dùng “người ấy” để chuyển đại từ giống đực số ít mang nghĩa khái quát sang tiếng Việt một cách tự nhiên.
