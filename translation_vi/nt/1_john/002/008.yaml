revisions:
- from: Tuy nhiên, tôi đang viết cho anh chị em một điều răn mới, là điều chân thật trong Ngài và trong anh chị em,[a] vì bóng tối đang qua đi và ánh sáng thật đã chiếu sáng rồi.
  to: Lại nữa, tôi đang viết cho anh chị em một điều răn mới. Điều này là chân thật trong Ngài và trong anh chị em,[a] vì bóng tối đang qua đi và ánh sáng thật đã và đang chiếu sáng.
