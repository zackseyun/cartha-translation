language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: πάλιν ἐντολὴν καινὴν γράφω ὑμῖν, ὅ ἐστιν ἀληθὲς ἐν αὐτῷ καὶ ἐν ὑμῖν, ὅτι ἡ σκοτία παράγεται καὶ τὸ φῶς τὸ ἀληθινὸν ἤδη φαίνει.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/008.yaml
  text: Again[a], I am writing to you a new commandment, which is true in him and in you, because the darkness is passing away and the true light is already shining.
translation:
  language: vi
  text: Lại nữa, tôi đang viết cho anh chị em một điều răn mới. Điều này là chân thật trong Ngài và trong anh chị em,[a] vì bóng tối đang qua đi và ánh sáng thật đã và đang chiếu sáng.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể hiểu: “Điều này là chân thật trong điều răn ấy và trong anh chị em,” nếu đại từ được hiểu là quy chiếu đến điều răn thay vì đến chính Ngài.'
    reason: alternative_reading
lexical_decisions:
- source_word: πάλιν
  choice: Tuy nhiên
  rationale: Trong mạch đối chiếu với câu 7—không phải điều răn mới, nhưng ở một phương diện lại là điều răn mới—πάλιν có thể đánh dấu bước chuyển tương phản. “Tuy nhiên” diễn đạt quan hệ diễn ngôn tự nhiên hơn “Lại” trong tiếng Việt hiện đại.
- source_word: ἐντολὴν καινὴν
  choice: một điều răn mới
  rationale: Cách dịch chuẩn, tự nhiên; καινός nhấn mạnh tính mới về phẩm chất hay bản chất, không chỉ mới xuất hiện gần đây.
- source_word: γράφω
  choice: tôi đang viết
  rationale: Giữ sắc thái hiện tại của hành động viết thư và phù hợp tiếng Việt hiện đại.
- source_word: ὅ ἐστιν ἀληθὲς
  choice: là điều chân thật
  rationale: Đại từ trung tính quy chiếu đến toàn bộ ý niệm vừa nêu; “điều chân thật” giữ ý nghĩa đúng thật, thực hữu mà không ép nó phải hòa hợp giống ngữ pháp với “điều răn”.
- source_word: ἐν αὐτῷ
  choice: trong Ngài
  rationale: Đại từ giống đực hợp lý nhất khi quy chiếu đến Đấng Christ trong văn cảnh; viết hoa “Ngài” giúp người đọc nhận ra quy chiếu nhân xưng mà không thêm danh xưng vào bản văn.
- source_word: ἐν ὑμῖν
  choice: trong anh chị em
  rationale: Giữ nghĩa trực tiếp là điều ấy hiện thực nơi các độc giả; “anh chị em” diễn đạt số nhiều và giọng mục vụ tự nhiên.
- source_word: ἡ σκοτία παράγεται
  choice: bóng tối đang qua đi
  rationale: Diễn tả tiến trình đang tiếp diễn của bóng tối suy tàn hay biến mất, đồng thời giữ hình ảnh nguyên văn.
- source_word: τὸ φῶς τὸ ἀληθινὸν
  choice: ánh sáng thật
  rationale: Giữ thuật ngữ quan trọng của văn chương Gioan và sự đối lập với bóng tối.
- source_word: ἤδη φαίνει
  choice: đã chiếu sáng rồi
  rationale: ἤδη nhấn mạnh thực tại đã khởi sự trong hiện tại; cấu trúc “đã… rồi” là tự nhiên trong tiếng Việt và không hàm ý tiến trình đã hoàn tất.
theological_decisions:
- issue: Đối tượng quy chiếu của αὐτῷ
  choice: “trong Ngài,” hiểu là quy chiếu đến Đấng Christ
  alternative: “trong điều ấy,” hiểu là quy chiếu đến điều răn hoặc toàn bộ điều vừa nói
  rationale: Hình thái giống đực và văn cảnh Gioan nghiêng về một đối tượng nhân xưng là Đấng Christ. Tuy vậy, cấu trúc mệnh đề quan hệ có độ phức tạp và cách hiểu quy chiếu đến điều răn vẫn đáng lưu ý, nên được bảo tồn trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh chị em” cho ὑμῖν số nhiều; giữ các hình ảnh thần học “bóng tối” và “ánh sáng thật.” Dấu chú thích đặt ngay sau cụm từ có cách hiểu thay thế.
