source:
  edition: SBLGNT
  text: Καὶ ἐν τούτῳ γινώσκομεν ὅτι ἐγνώκαμεν αὐτόν, ἐὰν τὰς ἐντολὰς αὐτοῦ τηρῶμεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/003.yaml
  text: 'And by this we know that we have come to know him: if we keep his commandments[a].'
translation:
  language: vi
  text: 'Nhờ điều này, chúng ta biết rằng chúng ta đã nhận biết Ngài: nếu chúng ta vâng giữ các điều răn của Ngài.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch sát sắc thái hơn: “đã đi đến chỗ nhận biết Ngài”; thể hoàn thành trong tiếng Hy Lạp có lẽ hàm ý đã bắt đầu nhận biết và sự nhận biết ấy vẫn còn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: Qua điều này
  rationale: Diễn đạt tự nhiên phương diện bằng chứng hoặc căn cứ để nhận biết, đồng thời giữ lực chỉ định của τούτῳ.
- source_word: γινώσκομεν
  choice: chúng ta biết
  rationale: Thì hiện tại chỉ sự nhận biết hay xác tín hiện có; cách dịch này tự nhiên và trực tiếp.
- source_word: ὅτι ἐγνώκαμεν αὐτόν
  choice: rằng mình đã nhận biết Ngài
  rationale: Thì hoàn thành của ἐγνώκαμεν diễn tả việc đã đi đến chỗ nhận biết và kết quả vẫn còn. Tiếng Việt khó tái hiện trọn sắc thái này trong chính văn mà không nặng nề, nên dùng 'đã nhận biết' và ghi chú khả năng hiểu rõ hơn.
- source_word: αὐτόν
  choice: Ngài
  rationale: Giữ nguyên đại từ, không tự ý xác định là Đức Chúa Trời hay Chúa Giê-xu; 'Ngài' phù hợp văn phong Kinh Thánh trang trọng trong tiếng Việt.
- source_word: ἐὰν
  choice: ấy là nếu
  rationale: Giữ tính điều kiện của ἐὰν, đồng thời làm rõ rằng mệnh đề sau nêu dấu hiệu/căn cứ của lời khẳng định trước, chứ không đổi điều kiện thành một khẳng định tuyệt đối.
- source_word: ἐντολάς
  choice: các điều răn
  rationale: Giữ trọng lượng đạo đức và giao ước của từ này trong văn mạch Giăng, đồng thời là cách nói quen thuộc, dễ hiểu.
- source_word: τηρῶμεν
  choice: chúng ta vâng giữ
  rationale: '''Vâng giữ'' truyền đạt cả ý tuân theo lẫn gìn giữ/tuân thủ vốn có trong τηρέω, và tự nhiên hơn chỉ dùng ''giữ'' trong tiếng Việt hiện đại.'
theological_decisions:
- issue: Đối tượng của αὐτόν ('Ngài')
  choice: Giữ đại từ 'Ngài', không nêu đích danh.
  alternative: Dịch rõ là 'Đức Chúa Trời' hoặc 'Chúa Giê-xu/Đấng Christ'.
  rationale: Bản Hy Lạp dùng đại từ, còn văn mạch 1 Giăng duy trì mối liên hệ thần học chặt chẽ giữa việc nhận biết Đức Chúa Trời và mối tương quan với Con. Việc giữ đại từ tránh giải quyết quá mức điều câu này không nói rõ.
- issue: Sắc thái của thể hoàn thành ἐγνώκαμεν
  choice: Dịch 'đã nhận biết' trong chính văn và giải thích sắc thái 'đã đi đến chỗ nhận biết' trong chú thích.
  alternative: Dịch trực tiếp 'đã đi đến chỗ nhận biết Ngài' trong chính văn.
  rationale: Cách chọn giữ sắc thái hoàn thành ở mức có thể mà vẫn bảo đảm câu tiếng Việt tự nhiên, trang trọng và dễ đọc.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng 'chúng ta' cho ngôi thứ nhất số nhiều, 'Ngài' cho đại từ chỉ thần linh mà không xác định quá mức đối tượng, và 'vâng giữ các điều răn' để bảo toàn sắc thái Giăng.
