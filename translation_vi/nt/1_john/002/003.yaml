revisions:
- from: 'Qua điều này, chúng ta biết rằng mình đã nhận biết Ngài: ấy là nếu chúng ta vâng giữ các điều răn của Ngài.[a]'
  to: 'Nhờ điều này, chúng ta biết rằng chúng ta đã nhận biết Ngài: nếu chúng ta vâng giữ các điều răn của Ngài.[a]'
  rationale: Bản sửa chỉ loại bỏ thành tố «ấy là» không có trong nguyên văn và làm chủ ngữ nhất quán. Câu vẫn giữ đại từ «Ngài» không xác định, sắc thái hoàn thành được chú thích, và cách diễn đạt «vâng giữ các điều răn» bảo toàn thuật ngữ Giăng.
