id: 1JN.2.27
reference: 1 John 2:27
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ὑμεῖς τὸ χρῖσμα ὃ ἐλάβετε ἀπ’ αὐτοῦ ⸂μένει ἐν ὑμῖν⸃, καὶ οὐ χρείαν ἔχετε ἵνα τις διδάσκῃ ὑμᾶς· ἀλλ’ ὡς τὸ ⸀αὐτοῦ χρῖσμα διδάσκει ὑμᾶς περὶ πάντων, καὶ ἀληθές ἐστιν καὶ οὐκ ἔστιν ψεῦδος, καὶ καθὼς ἐδίδαξεν ὑμᾶς, ⸀μένετε ἐν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/027.yaml
  text: And as for you[a], the anointing that you received from him remains in you, and you have no need that anyone should teach you. But as his anointing teaches you about all things, and is true and is not a lie, and just as it taught you[b], remain in him.
translation:
  language: vi
  text: Còn anh em, sự xức dầu mà anh em đã nhận từ Ngài vẫn ở trong anh em[a], và anh em không cần ai dạy mình. Nhưng sự xức dầu của Ngài dạy anh em về mọi điều; sự ấy là thật, không phải là lời nói dối. Hãy ở trong Ngài như sự ấy đã dạy anh em.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cùng một động từ Hy Lạp được dùng ở cuối câu, nơi được dịch là “hãy ở trong Ngài.”
    reason: lexical_alternative
  - marker: b
    text: 'Một số thủ bản chép: “anh em vẫn ở trong Ngài.”'
    reason: textual_variant
lexical_decisions:
- source_word: χρῖσμα
  choice: sự xức dầu
  rationale: Giữ nguyên ẩn dụ của nguyên văn, không diễn giải thẳng thành “Đức Thánh Linh” hay “sứ điệp”; đây cũng là cách diễn đạt Kinh Thánh quen thuộc nhưng vẫn dễ hiểu trong tiếng Việt hiện đại.
- source_word: ἀπ’ αὐτοῦ
  choice: từ Ngài
  rationale: Giữ đại từ của nguyên văn và để văn mạch xác định đối tượng, thay vì đưa danh xưng cụ thể vào câu.
- source_word: μένει ἐν ὑμῖν / μένετε ἐν αὐτῷ
  choice: vẫn ở trong anh em / hãy cứ ở trong Ngài
  rationale: Dùng nhất quán động từ “ở” cho μένω; “vẫn” và “hãy cứ” diễn đạt tự nhiên lần lượt sắc thái tiếp diễn và mệnh lệnh, đồng thời tránh từ “ở lại” dễ gợi nghĩa di chuyển vật lý.
- source_word: οὐ χρείαν ἔχετε ἵνα τις διδάσκῃ ὑμᾶς
  choice: anh em không cần ai dạy mình
  rationale: Diễn đạt trực tiếp và tự nhiên, không làm yếu đi cũng không tuyệt đối hóa phát biểu của nguyên văn.
- source_word: διδάσκῃ / διδάσκει / ἐδίδαξεν
  choice: dạy / dạy / đã dạy
  rationale: Giữ sự lặp lại có chủ ý của cùng một động từ trong nguyên văn.
- source_word: περὶ πάντων
  choice: về mọi điều
  rationale: Giữ phạm vi rộng của πάντων mà không tự ý giới hạn nội dung.
- source_word: ἀληθές ἐστιν καὶ οὐκ ἔστιν ψεῦδος
  choice: là thật, không phải là điều dối trá
  rationale: Bảo toàn thế đối lập mạnh giữa chân thật và dối trá, với cách nói rõ ràng trong tiếng Việt.
- source_word: καθὼς ἐδίδαξεν ὑμᾶς
  choice: như sự ấy đã dạy anh em
  rationale: Giữ quan hệ so sánh/căn cứ của καθὼς và dùng “sự ấy” để quy chiếu rõ về “sự xức dầu”.
theological_decisions:
- issue: Đối tượng được chỉ bởi “sự xức dầu” (χρῖσμα)
  choice: Giữ cách nói “sự xức dầu” trong chính văn.
  alternative: Đức Thánh Linh; sứ điệp/tin mừng đã tiếp nhận
  rationale: Ẩn dụ có lẽ liên hệ đến sự hiện diện và công việc dạy dỗ của Thánh Linh, nhưng câu Hy Lạp không trực tiếp gọi tên; giữ ẩn dụ tránh áp đặt một cách giải nghĩa riêng.
- issue: Ý nghĩa của câu “anh em không cần ai dạy mình”
  choice: Giữ nguyên sức nặng của phát biểu mà không thêm lời hạn định.
  alternative: Phủ nhận tuyệt đối mọi người dạy dỗ; hoặc chỉ nói rằng không cần những người ly khai dạy
  rationale: Bản dịch không nên biến câu này thành một khẳng định giáo lý rộng hơn nguyên văn, cũng không nên làm yếu nó; văn mạch sẽ định hướng cách hiểu.
- issue: Dạng của động từ μένετε ở cuối câu
  choice: 'Hiểu là mệnh lệnh: “hãy cứ ở trong Ngài.”'
  alternative: 'Trực thuyết: “anh em vẫn ở trong Ngài”'
  rationale: Trong bản văn SBLGNT, μένετε được hiểu tự nhiên là lời khuyên truyền; dị bản trực thuyết được ghi ở chú thích để bảo toàn chứng cứ bản văn.
- issue: Đại từ αὐτῷ ở cuối câu
  choice: “Ngài”, chỉ một chủ thể có ngôi vị.
  alternative: “sự ấy”, quy chiếu về sự xức dầu
  rationale: Hình thái giống đực của đại từ và văn mạch ủng hộ đối tượng có ngôi vị; tuy vậy bản dịch không nêu đích danh là Đức Chúa Trời hay Đấng Christ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Dùng “anh em” cho đại từ số nhiều ὑμεῖς và viết hoa “Ngài” theo quy ước tiếng Việt để chỉ đối tượng thần linh. Cấu trúc được điều chỉnh nhẹ bằng “nên/nhưng vì… nên” để quan hệ ý nghĩa tự nhiên trong tiếng Việt, nhưng không thu hẹp nội dung thần học của câu.
