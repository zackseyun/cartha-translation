  verdict: revise
  source_fidelity: 'Bản thảo nhìn chung chuyển tải đúng các thành tố chính của SBLGNT: “sự xức dầu,” việc nhận “từ Ngài,” sự hiện diện trong độc giả, lời khẳng định không cần người khác dạy, phạm vi “mọi điều,” đối lập thật/dối trá, và mệnh lệnh cuối câu. Tuy nhiên, các liên từ nhân quả “nên” và nhất là “Nhưng vì ... nên” diễn giải quan hệ cú pháp mạnh hơn nguyên văn. Chú thích a hiện tại mô tả một dị bản không phù hợp với dị bản được nêu trong hồ sơ tiếng Anh; dị bản cần ghi là cách đọc trực thuyết ở mệnh đề cuối.'
  naturalness: “Anh em,” “sự xức dầu,” và “hãy ở trong Ngài” phù hợp văn phong Kinh Thánh Việt ngữ hiện đại, trang trọng. Việc đặt mệnh lệnh trước mệnh đề so sánh ở cuối câu (“hãy ở trong Ngài như...”) tự nhiên hơn mà vẫn giữ quan hệ của καθὼς. “Không phải là lời nói dối” rõ và tự nhiên hơn “không phải là điều dối trá.”
  terminology: Giữ nhất quán “sự xức dầu” cho χρῖσμα, “dạy” cho các dạng của διδάσκω, và “ở trong” cho μένω. “Ngài” ở cuối câu bảo toàn đại từ giống đực và không định danh vượt quá văn mạch. Chú thích từ vựng nên ghi nhận cùng một động từ μένω ở đầu và cuối câu; chú thích dị bản phải tách rõ khỏi ghi chú này.
  issues:
