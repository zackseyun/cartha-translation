- from: Còn anh em[a], sự xức dầu mà anh em đã nhận từ Ngài vẫn ở trong anh em, nên anh em không cần ai dạy mình. Nhưng vì sự xức dầu của Ngài dạy anh em về mọi điều, và sự ấy là thật, không phải là điều dối trá, nên như sự ấy đã dạy anh em, hãy cứ ở trong Ngài.[b]
  to: Còn anh em, sự xức dầu mà anh em đã nhận từ Ngài vẫn ở trong anh em[a], và anh em không cần ai dạy mình. Nhưng sự xức dầu của Ngài dạy anh em về mọi điều; sự ấy là thật, không phải là lời nói dối. Hãy ở trong Ngài như sự ấy đã dạy anh em.[b]
  rationale: Bản sửa loại bỏ các quan hệ nhân quả được thêm vào, giữ ẩn dụ “sự xức dầu” mà không đồng nhất nó với một cách giải thích thần học cụ thể, và diễn đạt tự nhiên quan hệ giữa lời dạy trước đó với mệnh lệnh cuối câu. Hệ chú thích được sửa để phản ánh đúng dị bản trực thuyết ở cuối câu và để ghi nhận nhất quán của μένω.
