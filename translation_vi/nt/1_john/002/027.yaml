    rationale: Nguyên văn dùng chuỗi καί và ἀλλά với ὡς/καθὼς, không đánh dấu trực tiếp quan hệ “vì... nên.” Bỏ các liên từ nhân quả sẽ sát nguồn hơn.
  - severity: low
