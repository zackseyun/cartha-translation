id: 1JN.4.12
reference: 1 John 4:12
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: θεὸν οὐδεὶς πώποτε τεθέαται· ἐὰν ἀγαπῶμεν ἀλλήλους, ὁ θεὸς ἐν ἡμῖν μένει καὶ ἡ ἀγάπη αὐτοῦ ⸂ἐν ἡμῖν τετελειωμένη ἐστιν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/012.yaml
  text: No one has ever seen God[a]; if we love one another, God remains in us[b], and his love is perfected in us.
translation:
  language: vi
  text: Không ai từng thấy Đức Chúa Trời. Nếu chúng ta yêu thương nhau, Đức Chúa Trời ở lại trong chúng ta, và tình yêu của Ngài[a] đã được làm cho trọn vẹn[b] trong chúng ta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cụm từ này cũng có thể được hiểu là “tình yêu của chúng ta dành cho Ngài”. Tiếng Hy Lạp có thể chỉ tình yêu của Đức Chúa Trời dành cho chúng ta hoặc tình yêu của chúng ta hướng về Đức Chúa Trời; văn mạch nghiêng về nghĩa thứ nhất.
    reason: alternative_reading
  - marker: b
    text: 'Hoặc: “đã được hoàn thiện”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τεθέαται
  choice: thấy
  rationale: Diễn đạt tự nhiên hành động nhìn thấy; khi kết hợp với πώποτε và thể hoàn thành, câu “chưa một ai từng thấy” truyền đạt đầy đủ ý nghĩa mà không dùng từ cổ.
- source_word: πώποτε
  choice: từng
  rationale: Đi cùng phủ định để nhấn mạnh rằng điều này chưa xảy ra vào bất cứ lúc nào.
- source_word: ἐὰν ἀγαπῶμεν
  choice: nếu chúng ta yêu thương
  rationale: Giữ nguyên tính điều kiện của ἐάν với động từ giả định hiện tại; “yêu thương” tự nhiên và phù hợp văn mạch về tình yêu thể hiện trong quan hệ với nhau.
- source_word: ἀλλήλους
  choice: nhau
  rationale: Cách diễn đạt tương hỗ tự nhiên trong tiếng Việt hiện đại.
- source_word: μένει
  choice: ở trong
  rationale: Trong kết cấu ἐν ἡμῖν, “ở trong chúng ta” diễn đạt rõ chủ đề nội tại của thư Giăng. “Ở lại trong” sát hình thức hơn nhưng kém tự nhiên trong câu này.
- source_word: ἀγάπη
  choice: tình yêu
  rationale: Cách chuyển ngữ thông dụng, rõ ràng và trang trọng cho ἀγάπη.
- source_word: ἡ ἀγάπη αὐτοῦ
  choice: tình yêu của Ngài
  rationale: Giữ cấu trúc sở hữu và sự mơ hồ có thật của αὐτοῦ, dù văn mạch gần ưu tiên nghĩa tình yêu đến từ Đức Chúa Trời.
- source_word: τετελειωμένη ἐστιν
  choice: được nên trọn vẹn
  rationale: Phản ánh trạng thái hoàn thành có kết quả tiếp diễn của kết cấu hoàn thành ngoại vi, đồng thời giữ liên hệ với ý niệm τελειόω là làm cho trọn vẹn.
- source_word: ἐν ἡμῖν
  choice: trong chúng ta
  rationale: Dịch nhất quán hai lần xuất hiện của ἐν ἡμῖν và phù hợp chủ đề Đức Chúa Trời ở trong người tin.
theological_decisions:
- issue: Ý nghĩa của ἡ ἀγάπη αὐτοῦ (“tình yêu của Ngài”)
  choice: Tình yêu của Đức Chúa Trời được nên trọn vẹn trong chúng ta
  alternative: Tình yêu của chúng ta dành cho Đức Chúa Trời được nên trọn vẹn trong chúng ta
  rationale: Văn mạch gần, nhất là các câu 10–11, nhấn mạnh tình yêu khởi nguồn từ Đức Chúa Trời, nên cách hiểu sở hữu/chủ thể có sức thuyết phục hơn. Tuy nhiên, cấu trúc sở hữu trong tiếng Việt và chú thích vẫn bảo tồn cách hiểu đối tượng vốn có thể có trong tiếng Hy Lạp.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Câu giữ nhịp văn ngắn gọn của nguyên bản, tránh thuật ngữ giáo phái. “Đức Chúa Trời” được dùng nhất quán cho θεός; “Ngài” là đại từ kính trọng thông dụng.
