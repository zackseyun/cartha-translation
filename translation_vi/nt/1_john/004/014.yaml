id: 1JN.4.14
reference: 1 John 4:14
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἡμεῖς τεθεάμεθα καὶ μαρτυροῦμεν ὅτι ὁ πατὴρ ἀπέσταλκεν τὸν υἱὸν σωτῆρα τοῦ κόσμου.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/014.yaml
  text: And we have seen and testify that the Father has sent the Son as the Savior of the world[a].
translation:
  language: vi
  text: Và chúng tôi đã thấy và làm chứng rằng Cha đã sai Con làm Đấng Cứu Thế của thế gian.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch sát cấu trúc hơn: “Cha đã sai Con, Đấng Cứu Thế của thế gian.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ἡμεῖς
  choice: Còn chúng tôi
  rationale: Giữ mạch nối của καί và sắc thái nhấn nhẹ do đại từ ἡμεῖς được nêu rõ; cách diễn đạt tự nhiên trong tiếng Việt hiện đại.
- source_word: τεθεάμεθα
  choice: đã thấy
  rationale: Thể hoàn thành diễn tả việc đã tận mắt chứng kiến với ý nghĩa còn tiếp diễn; “đã thấy” tự nhiên và giữ được sức nặng của lời chứng trực tiếp.
- source_word: μαρτυροῦμεν
  choice: đang làm chứng
  rationale: Thì hiện tại chỉ hành động làm chứng đang tiếp diễn; “làm chứng” trang trọng nhưng vẫn phổ thông.
- source_word: ὅτι
  choice: rằng
  rationale: Dẫn vào nội dung của lời chứng, không mang nghĩa nguyên nhân.
- source_word: ὁ πατήρ
  choice: Cha
  rationale: Giữ nguyên tước hiệu quan hệ trong văn mạch Giăng, không thêm từ “Đức Chúa Trời” vốn không có trong câu.
- source_word: ἀπέσταλκεν
  choice: đã sai
  rationale: Thể hoàn thành nói đến hành động sai phái đã xảy ra và vẫn còn hiệu lực; tiếng Việt diễn đạt tự nhiên bằng “đã sai”.
- source_word: τὸν υἱόν
  choice: Con
  rationale: Giữ tước hiệu quan hệ tương ứng với “Cha”, không thêm đại từ sở hữu vì nguyên văn không có.
- source_word: σωτῆρα
  choice: Đấng Cứu Thế
  rationale: Là cách gọi trang trọng, quen thuộc và dễ hiểu trong tiếng Việt cho σωτήρ, chỉ người cứu độ.
- source_word: τοῦ κόσμου
  choice: của thế gian
  rationale: Giữ cấu trúc sở thuộc và phạm vi rộng của κόσμος trong câu, không thu hẹp ý nghĩa thần học.
- source_word: σωτῆρα τοῦ κόσμου
  choice: đến làm Đấng Cứu Thế của thế gian
  rationale: “Đến làm” diễn đạt tự nhiên chức năng vị ngữ/apposition của σωτῆρα sau động từ sai phái; chú thích bảo lưu cách dịch sát cấu trúc hơn.
theological_decisions:
- issue: Phạm vi của danh xưng “Đấng Cứu Thế của thế gian”
  choice: Giữ nguyên phạm vi rộng “của thế gian”.
  alternative: Thu hẹp thành một nhóm người cụ thể hoặc thêm ý “có khả năng cứu”.
  rationale: Nguyên văn trực tiếp gọi Con là σωτῆρα τοῦ κόσμου; bản dịch không áp đặt một hệ thống cứu chuộc riêng lên câu.
- issue: Ngôn ngữ quan hệ Cha–Con
  choice: Dịch là “Cha” và “Con”.
  alternative: Mở rộng thành “Đức Chúa Trời là Cha” và “Chúa Giê-su Christ”.
  rationale: Câu Hy Lạp dùng chính các tước hiệu quan hệ này; việc mở rộng sẽ thêm nội dung không hiện diện trong câu.
- issue: Quan hệ cú pháp của σωτῆρα
  choice: Dịch tự nhiên là “đến làm Đấng Cứu Thế”.
  alternative: 'Dịch sát hơn: “đã sai Con, Đấng Cứu Thế của thế gian”.'
  rationale: Cấu trúc Hy Lạp có thể được hiểu là bổ ngữ/apposition chỉ vai trò của Con; bản chính dùng cách Việt ngữ rõ ràng nhưng chú thích giữ dạng sát chữ và sự căng thẳng cú pháp.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Viết hoa “Cha”, “Con” và “Đấng Cứu Thế” để thể hiện các tước hiệu trong văn mạch, không thêm định danh ngoài nguyên văn.
