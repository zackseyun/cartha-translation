- from: Còn chúng tôi đã thấy và đang làm chứng rằng Cha đã sai Con đến làm Đấng Cứu Thế của thế gian.[a]
  to: Và chúng tôi đã thấy và làm chứng rằng Cha đã sai Con làm Đấng Cứu Thế của thế gian.[a]
  rationale: Sửa “Còn” thành “Và” để không thêm quan hệ đối lập ngoài nguyên văn. Sửa “đến làm” thành “làm” để diễn đạt sát và tự nhiên hơn bổ ngữ đồng vị σωτῆρα, đồng thời giữ nguyên nghĩa rằng Con được sai với tư cách/vai trò Đấng Cứu Thế của thế gian. Chú thích được giữ để nêu phương án đồng vị sát cấu trúc Hy Lạp.
