revisions:
- from: Hỡi những người được yêu dấu[a], chúng ta hãy yêu thương nhau, vì tình yêu thương đến từ Đức Chúa Trời; và bất cứ ai yêu thương thì đã được Đức Chúa Trời sinh ra và nhận biết Đức Chúa Trời.
  to: Những người yêu dấu[a], chúng ta hãy yêu thương nhau, vì tình yêu thương đến từ Đức Chúa Trời, và ai yêu thương đã được sinh ra từ Đức Chúa Trời và nhận biết Đức Chúa Trời.
