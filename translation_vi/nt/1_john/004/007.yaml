id: 1JN.4.7
reference: 1 John 4:7
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἀγαπητοί, ἀγαπῶμεν ἀλλήλους, ὅτι ἡ ἀγάπη ἐκ τοῦ θεοῦ ἐστιν, καὶ πᾶς ὁ ἀγαπῶν ἐκ τοῦ θεοῦ γεγέννηται καὶ γινώσκει τὸν θεόν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/007.yaml
  text: Beloved[a], let us love one another, because love is from God, and everyone who loves has been born of God and knows God.
translation:
  language: vi
  text: Những người yêu dấu[a], chúng ta hãy yêu thương nhau, vì tình yêu thương đến từ Đức Chúa Trời, và ai yêu thương đã được sinh ra từ Đức Chúa Trời và nhận biết Đức Chúa Trời.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Các bạn thân mến.” Cách xưng hô Hy Lạp có nghĩa đen là “những người yêu dấu”, đồng thời vang lại nhóm từ “yêu thương” được lặp lại trong câu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀγαπητοί
  choice: Hỡi những người được yêu dấu
  rationale: Giữ sắc thái xưng hô trìu mến ở số nhiều và duy trì mối liên hệ từ vựng với nhóm từ ἀγαπάω/ἀγάπη được lặp lại trong câu; “Hỡi” đánh dấu rõ lời gọi trực tiếp trong văn phong Kinh Thánh trang trọng.
- source_word: ἀγαπῶμεν ἀλλήλους
  choice: chúng ta hãy yêu thương nhau
  rationale: Thể giả định hiện tại ngôi thứ nhất số nhiều có chức năng khuyên nhủ; cách dịch này tự nhiên, không diễn giải quá mức khía cạnh tiếp diễn.
- source_word: ὅτι
  choice: vì
  rationale: 'Diễn đạt rõ quan hệ nguyên nhân: nguồn gốc của tình yêu thương là cơ sở cho lời khuyên.'
- source_word: ἡ ἀγάπη
  choice: tình yêu thương
  rationale: Cách nói tự nhiên trong tiếng Việt, đồng thời giữ nhất quán nhóm từ “yêu thương” xuyên suốt câu.
- source_word: ἐκ τοῦ θεοῦ ἐστιν
  choice: đến từ Đức Chúa Trời
  rationale: ἐκ chỉ nguồn gốc; “đến từ” diễn đạt sáng rõ hơn lối nói cứng “từ Đức Chúa Trời mà ra”.
- source_word: πᾶς ὁ ἀγαπῶν
  choice: bất cứ ai yêu thương
  rationale: Chuyển tải cấu trúc chỉ một lớp người nói chung và sắc thái bao quát của πᾶς một cách tự nhiên.
- source_word: ἐκ τοῦ θεοῦ γεγέννηται
  choice: đã được Đức Chúa Trời sinh ra
  rationale: Giữ thể hoàn thành bị động của γεγέννηται và nguồn gốc thần linh được biểu thị bởi ἐκ, đồng thời dùng cú pháp tiếng Việt dễ hiểu.
- source_word: γινώσκει τὸν θεόν
  choice: nhận biết Đức Chúa Trời
  rationale: Diễn đạt sự hiểu biết mang tính quan hệ trong cách dùng của Giăng mà không thêm sắc thái khởi đầu như “đã bắt đầu nhận biết”.
theological_decisions:
- issue: Mối quan hệ giữa yêu thương, được Đức Chúa Trời sinh ra và nhận biết Ngài
  choice: Dịch trực tiếp ba ý được liên kết trong nguyên văn, không xác định thêm một trình tự cứu rỗi mang tính hệ thống.
  alternative: Diễn giải yêu thương như bằng chứng kỹ thuật tuyệt đối của sự tái sinh, hoặc chỉ như một đòi hỏi đạo đức không liên quan đến sự sinh bởi Đức Chúa Trời.
  rationale: Nguyên văn khẳng định mối liên hệ thần học nhưng không triển khai trình tự hay cơ chế; bản dịch bảo toàn khẳng định ấy mà không thêm lập trường hệ phái.
- issue: Sự lặp lại của nhóm từ ἀγαπ-
  choice: Dùng nhất quán “được yêu dấu / yêu thương / tình yêu thương”.
  alternative: Dùng những từ không cùng trường nghĩa, chẳng hạn “các bạn thân mến” ở lời xưng hô.
  rationale: Sự lặp từ là đặc điểm văn chương và thần học nổi bật của câu, nên cần được giữ ở mức tự nhiên trong tiếng Việt.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “Đức Chúa Trời” nhất quán cho θεός; giữ lời kêu gọi cộng đồng và phép lặp của nhóm từ chỉ tình yêu thương.
