id: 1JN.4.11
reference: 1 John 4:11
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀγαπητοί, εἰ οὕτως ὁ θεὸς ἠγάπησεν ἡμᾶς, καὶ ἡμεῖς ὀφείλομεν ἀλλήλους ἀγαπᾶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/011.yaml
  text: Beloved[a], if God so loved us, we also ought to love one another.
translation:
  language: vi
  text: Anh chị em yêu dấu, nếu Đức Chúa Trời đã yêu chúng ta như vậy, thì chúng ta cũng phải yêu thương nhau.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγαπητοί
  choice: Anh chị em yêu dấu
  rationale: Lối xưng hô số nhiều, thân tình và trang trọng; giữ được liên hệ từ vựng với động từ “yêu” lặp lại trong câu, đồng thời tự nhiên trong tiếng Việt hiện đại.
- source_word: εἰ
  choice: nếu
  rationale: Giữ nguyên hình thức điều kiện của tiếng Hy Lạp, dù trong văn cảnh điều kiện này được giả định là đúng.
- source_word: οὕτως
  choice: như vậy
  rationale: Có thể chỉ cách thức và đồng thời gợi mức độ yêu thương đã được trình bày trong văn cảnh trước.
- source_word: ὁ θεὸς
  choice: Đức Chúa Trời
  rationale: Cách gọi trang trọng, thông dụng trong văn phong Kinh Thánh tiếng Việt.
- source_word: ἠγάπησεν
  choice: đã yêu
  rationale: Thể bất định quá khứ được diễn đạt tự nhiên bằng “đã yêu”, hướng đến hành động yêu thương được nêu trong văn cảnh.
- source_word: ἡμᾶς
  choice: chúng ta
  rationale: Đại từ ngôi thứ nhất số nhiều bao gồm người viết và người đọc.
- source_word: καὶ ἡμεῖς
  choice: thì chúng ta cũng
  rationale: “Chúng ta cũng” giữ sự nhấn mạnh của đại từ được nêu rõ; “thì” tạo quan hệ tự nhiên giữa mệnh đề điều kiện và hệ quả trong tiếng Việt.
- source_word: ὀφείλομεν
  choice: phải
  rationale: Diễn đạt nghĩa vụ đạo đức rõ ràng và tự nhiên; trong ngữ cảnh này không chỉ là lời khuyên nhẹ.
- source_word: ἀλλήλους
  choice: nhau
  rationale: Cách diễn đạt tương hỗ tự nhiên nhất trong tiếng Việt khi đi với “yêu thương”.
- source_word: ἀγαπᾶν
  choice: yêu thương
  rationale: Diễn đạt tự nhiên động từ yêu trong lời khuyên luân lý, đồng thời duy trì sự lặp lại chủ đề yêu thương.
theological_decisions:
- issue: Sắc thái của mệnh đề điều kiện εἰ οὕτως ὁ θεὸς ἠγάπησεν ἡμᾶς
  choice: Giữ “nếu Đức Chúa Trời đã yêu chúng ta như vậy”
  alternative: “vì Đức Chúa Trời đã yêu chúng ta như vậy” hoặc “bởi Đức Chúa Trời đã yêu chúng ta theo cách ấy”
  rationale: Tác giả xem tình yêu của Đức Chúa Trời là sự thật trong văn cảnh, nhưng vẫn dùng hình thức điều kiện để tạo sức thúc giục. Bản dịch giữ “nếu” nhằm bảo toàn cấu trúc và sắc thái tu từ thay vì chuyển hẳn thành quan hệ nguyên nhân.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Anh chị em yêu dấu” chuyển lời gọi trực tiếp số nhiều một cách tự nhiên; “phải” thể hiện nghĩa vụ đạo đức của ὀφείλομεν. Không thêm chú thích vì câu chính đã giữ trực tiếp hình thức điều kiện và không có dị bản văn bản cần nêu.
