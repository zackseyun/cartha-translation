id: 1JN.4.4
reference: 1 John 4:4
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὑμεῖς ἐκ τοῦ θεοῦ ἐστε, τεκνία, καὶ νενικήκατε αὐτούς, ὅτι μείζων ἐστὶν ὁ ἐν ὑμῖν ἢ ὁ ἐν τῷ κόσμῳ·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/004.yaml
  text: You are from God[a], little children, and you have overcome them[b], because the one who is in you is greater than the one who is in the world.
translation:
  language: vi
  text: Hỡi các con bé nhỏ, chính anh em thuộc về Đức Chúa Trời và đã thắng họ[a], vì Đấng ở trong anh em lớn hơn kẻ ở trong thế gian[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tức là những người chống đối vừa được nhắc đến, đặc biệt là các tiên tri giả.
    reason: cross_reference
  - marker: b
    text: Nguyên văn không nêu danh tính của hai đối tượng. Ngữ cảnh cho thấy “Đấng ở trong anh em” là Đức Chúa Trời hoặc Thánh Linh của Ngài, còn “kẻ ở trong thế gian” là kẻ ác đứng sau thế gian.
    reason: alternative_reading
lexical_decisions:
- source_word: ὑμεῖς ἐκ τοῦ θεοῦ ἐστε
  choice: chính anh em thuộc về Đức Chúa Trời
  rationale: Đại từ ὑμεῖς được nêu rõ để tạo thế nhấn mạnh và đối lập; “chính anh em” thể hiện nét ấy tự nhiên trong tiếng Việt. ἐκ τοῦ θεοῦ diễn tả nguồn gốc hoặc sự thuộc về phát xuất từ Đức Chúa Trời; “thuộc về Đức Chúa Trời” phù hợp với cách nói Giăng dùng trong ngữ cảnh phân biệt các bên.
- source_word: τεκνία
  choice: Hỡi các con bé nhỏ
  rationale: τεκνία là lối xưng hô thân thương, mang sắc thái gia đình. “Các con bé nhỏ” giữ được cả ý con cái lẫn tình cảm trìu mến; “Hỡi” giúp lời gọi trang trọng và rõ ràng.
- source_word: νενικήκατε
  choice: đã thắng
  rationale: Thì hoàn thành Hy Lạp chỉ chiến thắng đã xảy ra và còn hiệu lực. “Đã thắng” là cách diễn đạt gọn, tự nhiên; trong mạch văn, kết quả tiếp diễn được câu giải thích phía sau hỗ trợ.
- source_word: αὐτούς
  choice: họ
  rationale: Giữ nguyên tính hồi chỉ của đại từ, không đưa sự nhận diện các đối thủ vào chính văn.
- source_word: ὅτι
  choice: vì
  rationale: ὅτι nêu lý do cho việc các tín hữu đã thắng; “vì” rõ và tự nhiên trong tiếng Việt hiện đại.
- source_word: μείζων
  choice: lớn hơn
  rationale: μείζων có nghĩa so sánh rộng hơn chỉ sức mạnh. “Lớn hơn” bảo toàn độ rộng ấy, không thu hẹp thành “mạnh hơn” hay “quyền năng hơn”.
- source_word: ὁ ἐν ὑμῖν
  choice: Đấng ở trong anh em
  rationale: Cụm có mạo từ được dùng như danh từ và nói đến một hữu thể có ngôi vị nhưng không nêu danh tính. “Đấng” tự nhiên, tôn kính và vẫn không xác định cụ thể là Đức Chúa Trời hay Thánh Linh trong chính văn.
- source_word: ὁ ἐν τῷ κόσμῳ
  choice: kẻ ở trong thế gian
  rationale: Cấu trúc song song với cụm trước nhưng không nêu danh tính. “Kẻ” phù hợp với đối tượng đối nghịch, đồng thời tránh trực tiếp thêm “Sa-tan” hoặc “ma quỷ” vào chính văn.
- source_word: κόσμῳ
  choice: thế gian
  rationale: Trong văn chương Giăng, κόσμος thường chỉ thế giới loài người trong tình trạng xa cách hoặc chống nghịch Đức Chúa Trời. “Thế gian” là cách dịch quen thuộc, tự nhiên và không diễn giải quá mức.
theological_decisions:
- issue: Danh tính của “Đấng ở trong anh em” và “kẻ ở trong thế gian”
  choice: Giữ cả hai đối tượng ở dạng hàm ẩn trong chính văn.
  alternative: Nêu rõ đối tượng thứ nhất là Đức Chúa Trời hoặc Đức Thánh Linh, và đối tượng thứ hai là Sa-tan hay kẻ ác.
  rationale: Ngữ cảnh gợi mạnh rằng đối tượng thứ nhất là Đức Chúa Trời hoặc Thánh Linh của Ngài, còn đối tượng thứ hai là kẻ ác đứng sau thế gian; tuy nhiên, nguyên văn không gọi tên. Bản dịch giữ sự hàm ẩn và thế đối xứng của câu.
- issue: Sắc thái của ἐκ τοῦ θεοῦ
  choice: Dịch là “thuộc về Đức Chúa Trời”.
  alternative: Dịch sát hình thức là “đến từ Đức Chúa Trời”.
  rationale: Cụm từ có thể bao hàm nguồn gốc và sự thuộc về. Trong lời đối chiếu với các tiên tri giả và tinh thần của thế gian, “thuộc về” tự nhiên hơn trong tiếng Việt, nhưng không loại bỏ nền ý niệm nguồn gốc từ Đức Chúa Trời.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và thân tình. “Anh em” chỉ chung cộng đồng người đọc, không giới hạn ở nam giới. Duy trì lời gọi trìu mến của τεκνία, sự nhấn mạnh của ὑμεῖς và tính hàm ẩn thần học của hai cụm có mạo từ.
