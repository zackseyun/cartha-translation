  terminology: “Đức Chúa Trời,” “thế gian,” “Đấng,” và “tiên tri giả” nhất quán với cách dùng Kinh Thánh tiếng Việt. “Thuộc về Đức Chúa Trời” là lựa chọn ngữ nghĩa hợp lệ cho ἐκ τοῦ θεοῦ trong ngữ cảnh Giăng, dù vẫn có sắc thái nguồn gốc. Đối xứng “Đấng ... kẻ ...” phản ánh đối lập ngữ cảnh mà không nêu đích danh các quy chiếu.
