revisions:
- from: Họ thuộc về thế gian[a]; vì thế, lời họ nói bắt nguồn từ thế gian, và thế gian nghe theo họ.[b]
  to: Họ thuộc về thế gian[a]; vì thế, họ nói từ thế gian, và thế gian nghe họ.[b]
  rationale: Bản sửa giữ cách dịch tự nhiên “thuộc về thế gian” ở mệnh đề đầu, nhưng phục hồi ở mệnh đề sau chủ ngữ trực tiếp “họ” và sự lặp lại “từ thế gian” của nguyên văn. “Nghe họ” tránh diễn giải “nghe theo” như sự vâng phục, trong khi chú thích bảo lưu sắc thái tiếp nhận của văn mạch.
