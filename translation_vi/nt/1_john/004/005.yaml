source:
  edition: SBLGNT
  text: αὐτοὶ ἐκ τοῦ κόσμου εἰσίν· διὰ τοῦτο ἐκ τοῦ κόσμου λαλοῦσιν καὶ ὁ κόσμος αὐτῶν ἀκούει.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/005.yaml
  text: They are from the world[a]; for this reason they speak from the world[b], and the world listens to them.
translation:
  language: vi
  text: Họ thuộc về thế gian[a]; vì thế, họ nói từ thế gian, và thế gian nghe họ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sát nghĩa: “Họ từ thế gian mà ra”; tiếng Hy Lạp lặp lại cụm “từ thế gian” ở cả hai vế, nhấn mạnh nguồn gốc hoặc căn nguyên.'
    reason: lexical_alternative
  - marker: b
    text: “Thế gian” ở đây chỉ trật tự nhân loại xa cách và chống nghịch Đức Chúa Trời, không phải thế giới được tạo dựng xét theo bản chất. “Nghe” trong văn mạch hàm ý đón nhận họ cách thuận tình.
    reason: cultural_note
lexical_decisions:
- source_word: αὐτοὶ
  choice: Họ
  rationale: Đại từ này chỉ những kẻ tiên tri giả đã được nhắc đến trong văn cảnh và tạo thế tương phản với “chúng ta” ở câu kế tiếp. Tiếng Việt không cần thêm “chính họ”, vì cách ấy dễ tạo sắc thái nhấn mạnh quá mức.
- source_word: ἐκ τοῦ κόσμου εἰσίν
  choice: thuộc về thế gian
  rationale: ἐκ diễn tả nguồn gốc hoặc căn nguyên. “Thuộc về thế gian” là cách nói tự nhiên trong tiếng Việt, diễn đạt căn tính và sự quy thuộc mà không khiến người đọc hiểu lầm là xuất xứ địa lý; chú thích giữ lại sắc thái sát chữ “từ thế gian”.
- source_word: κόσμος
  choice: thế gian
  rationale: Trong văn mạch của Giăng, từ này chỉ trật tự nhân loại xa cách và chống nghịch Đức Chúa Trời, chứ không đơn thuần là vũ trụ vật chất. “Thế gian” giữ được chiều sâu thần học quen thuộc mà không diễn giải quá mức trong chính văn.
- source_word: διὰ τοῦτο
  choice: vì thế
  rationale: Cụm từ nối nguồn gốc của họ với nội dung và nguồn phát sinh của lời họ nói. “Vì thế” rõ nghĩa nhân quả và tự nhiên trong tiếng Việt hiện đại.
- source_word: ἐκ τοῦ κόσμου λαλοῦσιν
  choice: lời họ nói bắt nguồn từ thế gian
  rationale: Cách diễn đạt này bảo toàn ý nguồn gốc của ἐκ và sự lặp lại “thế gian”, đồng thời tự nhiên hơn lối dịch máy móc “họ nói từ thế gian”.
- source_word: ὁ κόσμος αὐτῶν ἀκούει
  choice: thế gian nghe theo họ
  rationale: ἀκούω ở đây hàm ý tiếp nhận và thuận theo, không chỉ nghe thấy âm thanh. “Nghe theo” diễn đạt sự đón nhận thuận lợi ấy một cách gọn và tự nhiên.
theological_decisions:
- issue: Ý nghĩa của κόσμος trong thần học Giăng
  choice: “thế gian” chỉ trật tự nhân loại xa cách và chống nghịch Đức Chúa Trời
  alternative: vũ trụ được tạo dựng, hoặc toàn thể nhân loại theo nghĩa trung tính
  rationale: Văn cảnh đối chiếu những người “thuộc về Đức Chúa Trời” với những người “thuộc về thế gian”, nên trọng tâm là nguồn gốc và sự quy thuộc về mặt đạo đức, tâm linh. Chính văn vẫn dùng từ ngắn gọn “thế gian”, còn chú thích làm rõ nghĩa trong văn cảnh.
- issue: Sắc thái nhấn mạnh của αὐτοὶ
  choice: không thêm từ nhấn mạnh trong chính văn
  alternative: “Chính họ thuộc về thế gian”
  rationale: Đại từ Hy Lạp có sắc thái tương phản, nhưng mạch văn đã thể hiện sự tương phản đầy đủ. Thêm “chính” có thể khiến câu tiếng Việt nhấn mạnh hơn nguyên ý cần thiết.
- issue: Mối liên hệ giữa nguồn gốc và lời nói
  choice: diễn đạt cả con người họ lẫn lời họ nói là thuộc về hoặc bắt nguồn từ thế gian
  alternative: hiểu “nói về thế gian”, tức chỉ nói các đề tài trần thế
  rationale: Hai lần dùng ἐκ τοῦ κόσμου nhấn mạnh cùng một nguồn hoặc căn nguyên. Cách dịch không thu hẹp ý thành chủ đề họ bàn đến, nhưng giữ mối liên hệ giữa bản chất của họ và thông điệp họ phát ra.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Thuộc về thế gian” tránh sắc thái xuất xứ địa lý, còn “bắt nguồn từ thế gian” duy trì ý nguồn gốc và phép lặp của nguyên văn. “Nghe theo” thể hiện sự tiếp nhận thuận tình, mạnh hơn việc chỉ nghe thấy.
