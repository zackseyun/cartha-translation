  source_fidelity: Bản nháp truyền đạt đúng sự đối lập giữa những người này và Đức Chúa Trời/thế gian. Tuy nhiên, “lời họ nói bắt nguồn từ thế gian” chuyển chủ ngữ trực tiếp “họ nói” thành “lời họ nói” và làm yếu phép lặp có chủ ý của ἐκ τοῦ κόσμου. “Nghe theo” có thể gợi ý sự vâng phục, mạnh hơn ἀκούει, vốn ở đây là nghe/đón nhận họ.
  naturalness: “Họ nói từ thế gian” hơi sát cấu trúc Hy Lạp nhưng vẫn rõ nghĩa, tự nhiên trong văn phong Kinh Thánh hiện đại, và bảo toàn phép lặp. “Thế gian nghe họ” tự nhiên, đồng thời chú thích có thể giải thích sắc thái tiếp nhận thuận tình.
  terminology: “Thế gian” là thuật ngữ thích hợp cho κόσμος trong văn mạch Giăng. “Đức Chúa Trời” trong chú thích phù hợp với hệ thuật ngữ của bản dịch. Chú thích cần nói “trật tự nhân loại” thay vì khẳng định một cách quá tuyệt đối một định nghĩa hệ thống.
