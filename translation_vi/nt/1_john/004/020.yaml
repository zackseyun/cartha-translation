id: 1JN.4.20
reference: 1 John 4:20
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐάν τις εἴπῃ ὅτι Ἀγαπῶ τὸν θεόν, καὶ τὸν ἀδελφὸν αὐτοῦ μισῇ, ψεύστης ἐστίν· ὁ γὰρ μὴ ἀγαπῶν τὸν ἀδελφὸν αὐτοῦ ὃν ἑώρακεν, τὸν θεὸν ὃν οὐχ ἑώρακεν ⸀οὐ δύναται ἀγαπᾶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/020.yaml
  text: If anyone says[a], “I love God,” and hates his brother, he is a liar; for the one who does not love his brother whom he has seen cannot love God whom he has not seen.
translation:
  language: vi
  text: 'Nếu ai nói: “Tôi yêu Đức Chúa Trời,” và ghét người anh em của mình[a], thì người ấy là kẻ nói dối; vì người nào không yêu người anh em của mình, người mà người ấy đã thấy, thì không thể yêu Đức Chúa Trời, Đấng mà người ấy chưa thấy.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể hiểu là “anh chị em mình.” Tiếng Hy Lạp dùng “người anh em” (ἀδελφόν), một dạng giống đực số ít có thể được dùng theo nghĩa đại diện trong ngữ cảnh này.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐάν τις εἴπῃ
  choice: Nếu ai nói
  rationale: ἐάν cùng động từ giả định εἴπῃ mở đầu một điều kiện tổng quát; “nếu ai nói” tự nhiên và giữ được tính bất định của τις.
- source_word: Ἀγαπῶ / ἀγαπῶν / ἀγαπᾶν
  choice: yêu / không yêu / yêu
  rationale: Dùng nhất quán “yêu” để giữ mối liên hệ từ vựng của ba dạng ἀγαπάω trong câu.
- source_word: τὸν θεόν
  choice: Đức Chúa Trời
  rationale: Cách gọi trang trọng, quen thuộc trong tiếng Việt và phù hợp khi θεός chỉ Đức Chúa Trời duy nhất trong ngữ cảnh.
- source_word: τὸν ἀδελφὸν αὐτοῦ
  choice: người anh em của mình
  rationale: Giữ dạng giống đực số ít của ἀδελφός và quan hệ sở hữu, đồng thời diễn đạt tự nhiên bằng tiếng Việt; khả năng dùng theo nghĩa đại diện được ghi ở chú thích.
- source_word: μισῇ
  choice: mà lại ghét
  rationale: “Ghét” chuyển đúng nghĩa của μισέω; “mà lại” làm rõ sự tương phản gay gắt với lời tuyên bố yêu Đức Chúa Trời mà không thêm nội dung mới.
- source_word: ψεύστης ἐστίν
  choice: người ấy là kẻ nói dối
  rationale: Giữ ψεύστης như một danh từ vị ngữ và bảo toàn phán quyết dứt khoát của tác giả.
- source_word: ὁ γὰρ μὴ ἀγαπῶν
  choice: vì người nào không yêu
  rationale: “Vì” thể hiện chức năng giải thích của γάρ; “người nào không yêu” diễn đạt rõ phân từ có mạo từ dùng như danh từ.
- source_word: ὃν ἑώρακεν
  choice: mình đã thấy
  rationale: “Đã thấy” truyền đạt hành động nhận biết bằng thị giác của thể hoàn thành ἑώρακεν với sự liên hệ hiện tại, theo cách tự nhiên trong tiếng Việt.
- source_word: οὐ δύναται ἀγαπᾶν
  choice: không thể yêu
  rationale: Giữ nguyên sức mạnh của lời khẳng định về sự bất khả, thay vì làm nhẹ thành sự khó khăn thực tế.
theological_decisions:
- issue: Phạm vi chỉ người của ἀδελφός trong cộng đồng tín hữu
  choice: người anh em của mình
  alternative: anh chị em mình; người cùng đức tin
  rationale: Bản chính giữ hình thức giống đực số ít của tiếng Hy Lạp mà không thu hẹp hoặc diễn giải thành một thuật ngữ thần học; chú thích bảo lưu khả năng từ này được dùng theo nghĩa đại diện.
- issue: Sức mạnh của οὐ δύναται ἀγαπᾶν
  choice: không thể yêu Đức Chúa Trời
  alternative: không có khả năng yêu Đức Chúa Trời
  rationale: “Không thể yêu” giữ nguyên mệnh đề mạnh về sự bất khả trong lập luận của Giăng, nhưng không thêm lời giải thích về bản chất triết học hay hệ phái của sự bất khả ấy.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “người ấy” và “người nào” để theo dõi chủ thể rõ ràng; giữ cấu trúc đối lập giữa người anh em hữu hình và Đức Chúa Trời chưa được nhìn thấy. Dấu chú thích [a] xuất hiện ngay sau lần đầu của cụm từ liên quan.
