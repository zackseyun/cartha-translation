  source_fidelity: Bản dịch giữ đúng cấu trúc tương phản οὐχ ὅτι ... ἀλλ’ ὅτι, sắc thái nhấn mạnh của αὐτός qua “chính Ngài,” và ý nghĩa tế lễ hướng đến tội lỗi của ἱλασμός περὶ τῶν ἁμαρτιῶν ἡμῶν. Tuy nhiên, “ở trong điều này” và nhất là “cho tội lỗi chúng ta” chưa tự nhiên trong tiếng Việt hiện đại; “vì tội lỗi chúng ta” diễn đạt đúng chức năng của περί trong ngữ cảnh tế lễ mà không thêm nghĩa.
  naturalness: “Tình yêu là ở điều này” là cách nói hiện đại, trang trọng và rõ hơn “Tình yêu thương ở trong điều này.” Bỏ “đến” trong “sai Con Ngài đến làm” giúp câu sát với cú pháp nguyên ngữ hơn và tránh gợi một hướng chuyển động không cần thiết.
