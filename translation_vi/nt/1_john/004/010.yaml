source:
  edition: SBLGNT
  text: ἐν τούτῳ ἐστὶν ἡ ἀγάπη, οὐχ ὅτι ἡμεῖς ⸀ἠγαπήκαμεν τὸν θεόν, ἀλλ’ ὅτι αὐτὸς ἠγάπησεν ἡμᾶς καὶ ἀπέστειλεν τὸν υἱὸν αὐτοῦ ἱλασμὸν περὶ τῶν ἁμαρτιῶν ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/010.yaml
  text: 'In this is love: not that we have loved God, but that he loved us and sent his Son as an atoning sacrifice for our sins.'
translation:
  language: vi
  text: 'Tình yêu là ở điều này: không phải là chúng ta đã yêu Đức Chúa Trời, nhưng là chính Ngài đã yêu chúng ta và sai Con Ngài làm sinh tế chuộc tội[a] vì tội lỗi chúng ta.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “lễ vật làm nguôi giận” hoặc “sinh tế xóa tội.” Từ Hy Lạp ἱλασμός chỉ sự hy sinh của Con để giải quyết vấn đề tội lỗi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: ở trong điều này
  rationale: Giữ cấu trúc chỉ xuất quen thuộc của văn chương Giăng, hướng người đọc đến nội dung theo sau như biểu hiện xác định của tình yêu thương.
- source_word: ἡ ἀγάπη
  choice: tình yêu thương
  rationale: Cách diễn đạt tự nhiên, trang trọng trong tiếng Việt và phù hợp với ngữ cảnh nói về tình yêu của Đức Chúa Trời.
- source_word: οὐχ ὅτι ... ἀλλ’ ὅτι
  choice: không phải là ... nhưng là
  rationale: Bảo toàn cấu trúc tương phản của tiếng Hy Lạp, qua đó xác định tình yêu thương nằm ở hành động của Đức Chúa Trời chứ không ở hành động của chúng ta.
- source_word: ἠγαπήκαμεν
  choice: đã yêu
  rationale: Tiếng Việt không mã hóa thể hoàn thành như tiếng Hy Lạp; từ “đã” biểu đạt hành động có trước và giữ sự tương phản với hành động quyết định của Đức Chúa Trời.
- source_word: αὐτὸς
  choice: chính Ngài
  rationale: Thể hiện sắc thái nhấn mạnh của đại từ và sự tương phản rõ ràng với “chúng ta”.
- source_word: ἀπέστειλεν τὸν υἱὸν αὐτοῦ
  choice: sai Con Ngài đến
  rationale: “Sai ... đến” diễn đạt tự nhiên động từ chỉ việc phái đi, đồng thời bảo toàn ngôn ngữ sai phái và quan hệ Cha–Con.
- source_word: ἱλασμὸν
  choice: sinh tế chuộc tội
  rationale: Diễn đạt dễ hiểu tính chất hy sinh và việc Con giải quyết tội lỗi, nhưng không thu hẹp thuật ngữ vào riêng ý làm nguôi cơn thịnh nộ hay xóa bỏ tội.
- source_word: περὶ τῶν ἁμαρτιῶν ἡμῶν
  choice: cho tội lỗi chúng ta
  rationale: Trong ngữ cảnh tế lễ, περί được diễn đạt tự nhiên là “cho”, chỉ đối tượng mà sinh tế xử lý.
theological_decisions:
- issue: Cách dịch ἱλασμός trong ngữ cảnh chuộc tội
  choice: sinh tế chuộc tội
  alternative: lễ vật làm nguôi giận; sinh tế xóa tội
  rationale: “Sinh tế chuộc tội” truyền đạt ý Con được sai đến như sự hy sinh hữu hiệu để giải quyết tội lỗi, trong khi chú thích giữ lại hai sắc thái thần học thường được đề xuất mà không buộc câu chính phải chọn riêng một cách hiểu.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “Đức Chúa Trời” và đại từ tôn kính “Ngài”; giữ nhịp tương phản của nguyên văn và đặt chú thích ngay sau thuật ngữ thần học còn có nhiều cách hiểu.
