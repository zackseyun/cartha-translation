id: 1JN.4.18
reference: 1 John 4:18
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: φόβος οὐκ ἔστιν ἐν τῇ ἀγάπῃ, ἀλλ’ ἡ τελεία ἀγάπη ἔξω βάλλει τὸν φόβον, ὅτι ὁ φόβος κόλασιν ἔχει, ὁ δὲ φοβούμενος οὐ τετελείωται ἐν τῇ ἀγάπῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/018.yaml
  text: There is no fear in love[a], but perfect love drives out fear, because fear has punishment[c][b]. But the one who fears has not been perfected in love.
translation:
  language: vi
  text: Trong tình yêu thương không có sự sợ hãi; trái lại, tình yêu thương trọn vẹn xua đuổi sự sợ hãi, vì sự sợ hãi mang theo hình phạt.[a] Còn người sợ hãi thì chưa được làm cho trọn vẹn trong tình yêu thương.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sát nghĩa: “sự sợ hãi có hình phạt.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: φόβος / φοβούμενος
  choice: sự sợ hãi / người sợ hãi
  rationale: Giữ nhất quán từ khóa được lặp lại, đồng thời phù hợp với ngữ cảnh lo sợ trước hình phạt.
- source_word: ἀγάπῃ / ἀγάπη
  choice: tình yêu thương
  rationale: Cách diễn đạt tự nhiên, trang trọng và quen thuộc cho ἀγάπη, đồng thời giữ nguyên sự lặp lại trong câu.
- source_word: τελεία
  choice: trọn vẹn
  rationale: Diễn đạt tình yêu đã đạt đến sự đầy đủ theo mục đích của nó, không hàm ý một giáo thuyết riêng về sự hoàn hảo vô tội.
- source_word: ἔξω βάλλει
  choice: xua đuổi
  rationale: Giữ hình ảnh loại bỏ mạnh mẽ của nguyên ngữ và tự nhiên trong tiếng Việt hiện đại.
- source_word: κόλασιν ἔχει
  choice: mang theo hình phạt
  rationale: Bám sát cấu trúc 'có hình phạt' nhưng dùng cách nói tiếng Việt dễ hiểu; không giải nghĩa quá mức thành chỉ sự chờ đợi hay liên hệ với hình phạt.
- source_word: τετελείωται
  choice: được làm cho trọn vẹn
  rationale: Giữ sắc thái hoàn thành của thể hoàn thành bị động và mối liên hệ từ vựng với τελεία.
- source_word: ἐν τῇ ἀγάπῃ
  choice: trong tình yêu thương
  rationale: Phản ánh trực tiếp giới từ ἐν và giữ độ mở về ý nghĩa phạm vi hay tương quan.
theological_decisions:
- issue: Mối liên hệ giữa 'tình yêu thương trọn vẹn' và người 'được làm cho trọn vẹn'
  choice: Dùng cùng gốc diễn đạt 'trọn vẹn' ở cả hai vế.
  alternative: Dùng 'tình yêu thương hoàn hảo' và 'chưa trưởng thành trong tình yêu thương'.
  rationale: Giữ mối liên hệ giữa τελεία và τετελείωται cũng như sức căng của bản văn, không thu hẹp ý nghĩa thành sự trưởng thành cảm xúc hay áp đặt quan niệm hoàn hảo vô tội.
- issue: Ý nghĩa của κόλασιν ἔχει
  choice: sự sợ hãi 'mang theo hình phạt'.
  alternative: sự sợ hãi 'liên quan đến hình phạt' hoặc 'có hình phạt'.
  rationale: Cách chọn giữ lời khẳng định mạnh và hơi bất thường của nguyên ngữ, nhưng vẫn đủ tự nhiên trong tiếng Việt; chú thích ghi nhận bản dịch sát chữ.
translation_notes:
  register: Văn phong tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng 'tình yêu thương' để tránh sắc thái chủ yếu lãng mạn của 'tình yêu'; dùng 'trọn vẹn' nhằm nối hai dạng cùng gốc Hy Lạp một cách tự nhiên.
