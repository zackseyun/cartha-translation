  verdict: revise
  source_fidelity: 'Cần sửa danh xưng “Chúa Giê-su”: nguyên văn chỉ có Ἰησοῦς (“Giê-su”), không có κύριος (“Chúa”). Việc thêm “Chúa” làm tăng một tước hiệu không được nêu trong câu. Các phần còn lại truyền đạt đúng mệnh đề khái quát, hành vi tuyên xưng, danh hiệu “Con Đức Chúa Trời”, và sự ở trong nhau.'
  naturalness: Câu với cấu trúc “Ai ... thì ...” tự nhiên, rõ ràng và trang trọng theo tiếng Việt hiện đại. Việc lặp lại “ở lại” ở vế hai là tự nhiên trong tiếng Việt và làm rõ động từ được lược trong tiếng Hy Lạp.
  terminology: “Tuyên xưng”, “Con Đức Chúa Trời”, và “ở lại trong” phù hợp với cách dùng Cơ Đốc giáo tiếng Việt và bảo toàn sắc thái Giăng. Chú thích nên tránh “ngự”, vì đây là cách diễn đạt có sắc thái tôn giáo/diễn giải mạnh hơn và không phải lựa chọn tương đương trực tiếp, trung tính cho μένω trong ngữ cảnh này.
  issues:
  - severity: medium
    issue: Thêm danh xưng “Chúa” trước “Giê-su”.
    rationale: Bản Hy Lạp ghi Ἰησοῦς, không ghi “Chúa” (κύριος). Dù danh xưng này đúng trong nhiều ngữ cảnh Cơ Đốc, việc thêm vào đây vượt quá văn bản nguồn.
  - severity: low
    issue: Chú thích đề nghị “ngự trong người ấy”.
    rationale: “Ngự” có sắc thái tôn kính và diễn giải hơn “ở lại”; nên chú thích trực tiếp về lựa chọn “ở”/“ở lại” của μένω, đồng thời nêu đây là từ quan trọng trong văn Giăng.
