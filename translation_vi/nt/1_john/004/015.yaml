id: 1JN.4.15
reference: 1 John 4:15
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὃς ⸀ἐὰν ὁμολογήσῃ ὅτι ⸀Ἰησοῦς ἐστιν ὁ υἱὸς τοῦ θεοῦ, ὁ θεὸς ἐν αὐτῷ μένει καὶ αὐτὸς ἐν τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/015.yaml
  text: Whoever confesses that Jesus is the Son of God[a], God remains in him, and he in God.
translation:
  language: vi
  text: Ai tuyên xưng rằng Giê-su là Con Đức Chúa Trời thì Đức Chúa Trời ở lại[a] trong người ấy, và người ấy ở lại trong Đức Chúa Trời.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Động từ Hy Lạp menō cũng có thể dịch là “ở”. Đây là một từ quan trọng trong các tác phẩm của Giăng, thường diễn tả sự tiếp tục ở trong hay gắn bó.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς ἐὰν
  choice: Ai
  rationale: Đại từ quan hệ đi với ἐάν tạo thành mệnh đề quan hệ bất định, mang nghĩa “bất cứ ai”. Trong tiếng Việt, “Ai… thì…” diễn đạt tự nhiên và giữ được ý khái quát.
- source_word: ὁμολογήσῃ
  choice: tuyên xưng
  rationale: ὁμολογέω trong văn mạch của Giăng chỉ việc công khai thừa nhận và bày tỏ một chân lý về Chúa Giê-su. “Tuyên xưng” vừa tự nhiên, vừa giữ được sắc thái công khai và trọng lượng thần học.
- source_word: Ἰησοῦς
  choice: Chúa Giê-su
  rationale: Dùng cách phiên âm phổ biến trong tiếng Việt; danh xưng “Chúa” phù hợp với lối gọi kính trọng, tự nhiên trong văn bản Cơ Đốc tiếng Việt mà không làm thay đổi nội dung lời tuyên xưng.
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: Con Đức Chúa Trời
  rationale: Giữ nguyên danh hiệu Cơ Đốc học rõ ràng trong nguyên văn, không diễn giải thêm.
- source_word: ἐν αὐτῷ μένει
  choice: ở lại trong người ấy
  rationale: μένω là từ khóa trong các tác phẩm của Giăng, có thể mang nghĩa “ở lại”, “lưu lại” hoặc “ở”. “Ở lại” giữ được sắc thái tiếp tục, bền vững; “trong người ấy” bảo toàn hình ảnh tương giao nội tại của nguyên văn.
- source_word: καὶ αὐτὸς ἐν τῷ θεῷ
  choice: và người ấy ở lại trong Đức Chúa Trời
  rationale: Nguyên văn lược động từ ở vế thứ hai, nhưng tiếng Việt tự nhiên cần nhắc lại “ở lại” để làm rõ quan hệ song phương. Việc lặp lại không thêm ý mới mà chỉ phục hồi động từ được hiểu ngầm.
theological_decisions:
- issue: Sự ở trong nhau giữa Đức Chúa Trời và người tuyên xưng
  choice: 'Giữ cách diễn đạt song phương: “Đức Chúa Trời ở lại trong người ấy, và người ấy ở lại trong Đức Chúa Trời.”'
  alternative: “Đức Chúa Trời sống trong người ấy, và người ấy sống trong Đức Chúa Trời.”
  rationale: “Ở lại trong” bảo toàn ngôn ngữ đặc trưng của Giăng và sự căng thẳng thần học của mối tương giao song phương, không giản lược thành sự hiện diện hay liên kết thông thường.
- issue: Danh hiệu của Chúa Giê-su
  choice: “Con Đức Chúa Trời”
  alternative: “Con của Đức Chúa Trời”
  rationale: Cách dịch không có “của” tự nhiên hơn như một danh hiệu trong tiếng Việt, đồng thời giữ nguyên lời khẳng định Cơ Đốc học của câu mà không thêm lời giải thích giáo phái.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Cấu trúc “Ai… thì…” làm rõ quan hệ điều kiện khái quát. Lặp lại “ở lại” ở vế sau để câu tiếng Việt trọn nghĩa và giữ thế đối xứng, dù nguyên văn Hy Lạp lược động từ tại đó.
