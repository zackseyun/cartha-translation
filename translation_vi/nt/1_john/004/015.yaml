  to: Ai tuyên xưng rằng Giê-su là Con Đức Chúa Trời thì Đức Chúa Trời ở lại[a] trong người ấy, và người ấy ở lại trong Đức Chúa Trời.
  rationale: Bản sửa loại bỏ tước hiệu không có trong nguyên văn, nhưng giữ nguyên thuật ngữ quen thuộc và tự nhiên “Con Đức Chúa Trời” cùng ngôn ngữ tương hỗ “ở lại trong”. Chú thích được điều chỉnh để phản ánh lựa chọn từ vựng của μένω mà không đưa vào sắc thái diễn giải của “ngự”.
