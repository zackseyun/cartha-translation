id: 1JN.4.19
reference: 1 John 4:19
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἡμεῖς ⸀ἀγαπῶμεν, ὅτι αὐτὸς πρῶτος ἠγάπησεν ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/019.yaml
  text: We love because he first loved us[a].
translation:
  language: vi
  text: Chúng ta yêu thương, vì chính Ngài đã yêu thương chúng ta trước[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Một số thủ bản chép: “Chúng ta yêu Ngài, vì chính Ngài đã yêu thương chúng ta trước.”'
    reason: textual_variant
lexical_decisions:
- source_word: ἡμεῖς
  choice: Chúng ta
  rationale: Đại từ chủ ngữ được nêu rõ trong tiếng Hy Lạp, tạo sắc thái nhấn mạnh hoặc đối chiếu; “chúng ta” vừa tự nhiên vừa giữ được sắc thái ấy trong tiếng Việt.
- source_word: ἀγαπῶμεν
  choice: yêu thương
  rationale: Động từ hiện tại chủ động, ngôi thứ nhất số nhiều. “Yêu thương” là cách diễn đạt tự nhiên, trang trọng và duy trì liên hệ từ vựng với chủ đề tình yêu trong ngữ cảnh.
- source_word: ὅτι
  choice: vì
  rationale: 'Ở đây liên từ mang ý nghĩa nguyên nhân: tình yêu của chúng ta phát sinh từ việc Đức Chúa Trời đã yêu chúng ta trước.'
- source_word: αὐτὸς
  choice: chính Ngài
  rationale: Trong ngữ cảnh, đại từ chỉ Đức Chúa Trời và có sắc thái nhấn mạnh. “Chính Ngài” truyền đạt sắc thái đó mà vẫn tự nhiên.
- source_word: πρῶτος
  choice: trước
  rationale: 'Từ này diễn tả sự ưu tiên về thời gian: tình yêu của Đức Chúa Trời đi trước và là nền tảng cho tình yêu của chúng ta.'
- source_word: ἠγάπησεν
  choice: đã yêu thương
  rationale: Thì aorist chỉ hành động yêu thương có trước của Đức Chúa Trời; cấu trúc “đã yêu thương” diễn đạt rõ điều này trong tiếng Việt.
- source_word: ἡμᾶς
  choice: chúng ta
  rationale: Tân ngữ trực tiếp của ἠγάπησεν, được chuyển dịch thẳng và tự nhiên là “chúng ta”.
theological_decisions:
- issue: Có nên thêm tân ngữ cho “chúng ta yêu thương” hay không
  choice: 'Không thêm tân ngữ: “Chúng ta yêu thương”'
  alternative: “Chúng ta yêu Ngài” hoặc “Chúng ta yêu Đức Chúa Trời”
  rationale: Bản văn SBLGNT không có tân ngữ sau ἀγαπῶμεν. Việc thêm “Ngài” phản ánh một dị bản và truyền thống dịch thuật, nhưng sẽ thu hẹp sự rộng mở có chủ ý của bản văn được chọn; câu có thể nói đến tình yêu hướng về Đức Chúa Trời và tình yêu dành cho nhau phát sinh từ tình yêu đi trước của Ngài.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” để chỉ Đức Chúa Trời theo ngữ cảnh, đồng thời tránh thêm tân ngữ không có trong bản văn chính.
