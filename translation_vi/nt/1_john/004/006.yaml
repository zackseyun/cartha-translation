  source_fidelity: 'Bản dịch chuyển tải đúng cấu trúc và các đối lập chính: nguồn gốc “từ Đức Chúa Trời” (ἐκ τοῦ θεοῦ), tiêu chuẩn “nghe chúng tôi,” và sự phân biệt giữa hai πνεῦμα. “Nhờ đó, chúng tôi nhận biết” phản ánh ngôi thứ nhất số nhiều của γινώσκομεν mà không thêm ý nghĩa. Tuy nhiên, “thần sai lầm” là cách tương đương trực tiếp và thông dụng hơn cho τὸ πνεῦμα τῆς πλάνης trong thế song đối với “Thần lẽ thật.”'
  naturalness: Câu văn rõ ràng, trang trọng và tự nhiên trong tiếng Việt Kinh Thánh hiện đại. Thay “thần sai lạc” bằng “thần sai lầm” tạo một cụm từ quen dùng hơn và gần với nghĩa “error/deception” của πλάνη. Chú thích b nên dùng “dịch là” thay vì “viết là,” vì đây là một khả năng hiểu/dịch chứ không chỉ là chính tả.
  terminology: “Đức Chúa Trời,” “Thần lẽ thật,” và “thần sai lầm” phù hợp với cách dùng Kinh Thánh tiếng Việt. Viết hoa “Thần” trong cụm đầu phản ánh cách hiểu có cơ sở mạnh trong văn mạch Giăng, còn chú thích vẫn bảo lưu cách đọc chung hơn; “thần” thứ hai viết thường giữ sự đối lập mà không đồng nhất nó với Đức Thánh Linh.
