id: 1JN.4.6
reference: 1 John 4:6
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἡμεῖς ἐκ τοῦ θεοῦ ἐσμεν· ὁ γινώσκων τὸν θεὸν ἀκούει ἡμῶν, ὃς οὐκ ἔστιν ἐκ τοῦ θεοῦ οὐκ ἀκούει ἡμῶν. ἐκ τούτου γινώσκομεν τὸ πνεῦμα τῆς ἀληθείας καὶ τὸ πνεῦμα τῆς πλάνης.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/006.yaml
  text: We are from God[a]. The one who knows God listens to us; whoever is not from God does not listen to us[c][b]. By this we know the Spirit of truth and the spirit of error.
translation:
  language: vi
  text: Chúng tôi đến từ Đức Chúa Trời. Ai biết Đức Chúa Trời thì nghe chúng tôi[a]; ai không đến từ Đức Chúa Trời thì không nghe chúng tôi. Nhờ đó, chúng tôi nhận biết Thần lẽ thật[b][c] và thần sai lầm.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “lắng nghe chúng tôi” ở cả hai lần; động từ Hy Lạp có nghĩa cơ bản là nghe, nhưng trong ngữ cảnh này hàm ý tiếp nhận lời chứng của các sứ đồ.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “thần lẽ thật”. Cụm từ này có thể được hiểu theo nghĩa rộng hơn, dù trong các tác phẩm của Giăng nó thường chỉ Đức Thánh Linh.
    reason: alternative_reading
  - marker: c
    text: “Thần lẽ thật” gợi lại Giăng 14:17; 15:26; 16:13.
    reason: cross_reference
lexical_decisions:
- source_word: ἐκ τοῦ θεοῦ
  choice: đến từ Đức Chúa Trời
  rationale: Giữ ý nguồn gốc của giới từ ἐκ và duy trì sự đối lập trong câu, thay vì làm yếu thành quan hệ sở hữu đơn thuần.
- source_word: ὁ γινώσκων τὸν θεὸν
  choice: ai biết Đức Chúa Trời
  rationale: Diễn đạt tự nhiên lực khái quát, mang tính đặc trưng của phân từ hiện tại dùng như danh từ.
- source_word: ἀκούει ἡμῶν
  choice: nghe chúng tôi
  rationale: Trong ngữ cảnh, động từ chỉ việc nghe với thái độ tiếp nhận lời chứng của các sứ đồ; cách dịch này vẫn giữ được nét nghĩa cơ bản mà không tăng cường thành ‘vâng lời’.
- source_word: ὃς οὐκ ἔστιν ἐκ τοῦ θεοῦ
  choice: ai không đến từ Đức Chúa Trời
  rationale: Giữ tính khái quát của đại từ quan hệ và lặp lại ý nguồn gốc của ἐκ để bảo toàn thế đối lập.
- source_word: ἐκ τούτου
  choice: nhờ đó
  rationale: Diễn đạt gọn và tự nhiên ý nhận biết dựa trên tiêu chuẩn vừa nêu.
- source_word: γινώσκομεν
  choice: chúng tôi nhận biết
  rationale: ‘Nhận biết’ phù hợp với hành động phân định trong ngữ cảnh. Đại từ ‘chúng tôi’ được giữ nhất quán với nhóm người nói ở đầu câu, vì tiếng Hy Lạp dùng cùng ngôi thứ nhất số nhiều và không đánh dấu bao gồm hay loại trừ người nghe.
- source_word: τὸ πνεῦμα τῆς ἀληθείας
  choice: Thần lẽ thật
  rationale: Giữ kết cấu đối xứng của nguyên văn; viết hoa ‘Thần’ để thể hiện khả năng rất cao đây là danh xưng chỉ Đức Thánh Linh trong văn liệu Giăng, đồng thời ghi nhận cách hiểu rộng hơn ở chú thích.
- source_word: τὸ πνεῦμα τῆς πλάνης
  choice: thần sai lạc
  rationale: ‘Sai lạc’ diễn tả πλάνη như sự lầm lạc hoặc dẫn đi khỏi chân lý, đồng thời đối xứng tự nhiên với ‘lẽ thật’ mà không thu hẹp cụm từ thành một thái độ thuần túy của con người.
theological_decisions:
- issue: πνεῦμα trong cụm thứ nhất có trực tiếp chỉ Đức Thánh Linh hay không
  choice: Thần lẽ thật
  alternative: thần lẽ thật
  rationale: Ngữ cảnh thử nghiệm các thần và cách dùng quen thuộc trong các tác phẩm của Giăng nghiêng về Đức Thánh Linh. Viết hoa thể hiện cách hiểu có khả năng cao hơn, nhưng chú thích vẫn bảo lưu khả năng cụm từ được hiểu theo nghĩa chung.
- issue: ἀκούει ἡμῶν chỉ sự nghe âm thanh hay sự tiếp nhận lời chứng
  choice: nghe chúng tôi
  alternative: lắng nghe chúng tôi
  rationale: Mạch văn nói đến phản ứng đối với lời chứng của nhóm các sứ đồ. ‘Nghe’ đủ rộng để chứa sắc thái tiếp nhận; chú thích làm rõ mà không dịch quá mạnh thành sự vâng phục.
- issue: Ngôi thứ nhất số nhiều ở mệnh đề cuối bao gồm độc giả hay chỉ nhóm người nói
  choice: chúng tôi nhận biết
  alternative: chúng ta nhận biết
  rationale: Tiếng Hy Lạp không phân biệt ngôi ‘chúng tôi/chúng ta’. Việc giữ ‘chúng tôi’ nhất quán với ‘nghe chúng tôi’ tránh tự ý đổi nhóm quy chiếu, dù ‘chúng ta’ vẫn là một khả năng diễn giải trong tiếng Việt.
translation_notes:
  register: Văn phong hiện đại, trang trọng nhưng dễ hiểu. Dùng “Đức Chúa Trời” theo lối gọi quen thuộc của văn bản Kinh Thánh tiếng Việt; giữ thế đối xứng giữa “Thần lẽ thật” và “thần sai lạc”. Đại từ “chúng tôi” được dùng nhất quán vì nguyên ngữ không đánh dấu sự phân biệt bao gồm/loại trừ độc giả.
