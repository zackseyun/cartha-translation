- from: Chúng tôi đến từ Đức Chúa Trời. Ai biết Đức Chúa Trời thì nghe chúng tôi[a]; ai không đến từ Đức Chúa Trời thì không nghe chúng tôi. Nhờ đó, chúng tôi nhận biết Thần lẽ thật[b][c] và thần sai lạc.
