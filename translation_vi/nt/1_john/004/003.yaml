id: 1JN.4.3
reference: 1 John 4:3
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ πᾶν πνεῦμα ὃ μὴ ὁμολογεῖ ⸀τὸν ⸀Ἰησοῦν ἐκ τοῦ θεοῦ οὐκ ἔστιν· καὶ τοῦτό ἐστιν τὸ τοῦ ἀντιχρίστου, ὃ ἀκηκόατε ὅτι ἔρχεται, καὶ νῦν ἐν τῷ κόσμῳ ἐστὶν ἤδη.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/003.yaml
  text: and every spirit that does not confess Jesus is not from God[a]. And this is the spirit of the antichrist, which you have heard is coming[c][b], and now is already in the world.
translation:
  language: vi
  text: Còn mọi linh không tuyên xưng Chúa Giê-su thì không đến từ Đức Chúa Trời.[a] Đó là linh của Kẻ Chống Đấng Christ,[b] linh mà anh em đã nghe nói là đang đến, và nay đã ở trong thế gian rồi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Một số thủ bản chép: “không tuyên xưng rằng Chúa Giê-su Christ đã đến trong thân xác.”'
    reason: textual_variant
  - marker: b
    text: 'Nguyên văn tỉnh lược, sát nghĩa là: “đó là điều thuộc về Kẻ Chống Đấng Christ”; từ “linh” được hiểu từ vế trước.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶν πνεῦμα
  choice: bất cứ linh nào
  rationale: Cách diễn đạt phân phối tự nhiên trong tiếng Việt, chỉ từng linh hoặc ảnh hưởng thuộc linh đang được xem xét; không viết hoa vì ở đây không nói về Đức Thánh Linh.
- source_word: ὁμολογεῖ τὸν Ἰησοῦν
  choice: tuyên xưng Chúa Giê-su
  rationale: “Tuyên xưng” giữ được sắc thái công khai thừa nhận và bày tỏ sự gắn bó của ὁμολογέω; bản văn SBLGNT chỉ có “Chúa Giê-su”, không có mệnh đề dài hơn.
- source_word: ἐκ τοῦ θεοῦ
  choice: đến từ Đức Chúa Trời
  rationale: ἐκ diễn tả nguồn gốc; “đến từ” vừa rõ vừa tự nhiên trong tiếng Việt hiện đại.
- source_word: τοῦτό ἐστιν τὸ τοῦ ἀντιχρίστου
  choice: Đó là linh của kẻ chống Đấng Christ
  rationale: Nguyên văn tỉnh lược danh từ πνεῦμα, nhưng danh từ này được hiểu rõ từ vế trước. Bổ sung “linh” giúp câu tiếng Việt tự nhiên mà không thêm một ý niệm mới; sự tỉnh lược được ghi ở chú thích.
- source_word: ἀντιχρίστου
  choice: kẻ chống Đấng Christ
  rationale: Cách dịch này thể hiện mối liên hệ đối nghịch được hàm chứa trong ἀντίχριστος và giữ tính xác định của cụm từ Hy Lạp.
- source_word: ἀκηκόατε ὅτι ἔρχεται
  choice: anh em đã nghe là đang đến
  rationale: Giữ khía cạnh kết quả hiện tại của ἀκηκόατε và không chuyển đại từ trung tính thành một đại từ nam chỉ cá nhân.
- source_word: ἐν τῷ κόσμῳ … ἤδη
  choice: nay đã ở trong thế gian rồi
  rationale: “Thế gian” phù hợp với cách dùng κόσμος trong văn mạch Giăng; cặp “đã… rồi” diễn đạt tự nhiên sự hiện diện vốn đã thành thực tại, còn “nay” làm rõ thời điểm hiện tại.
theological_decisions:
- issue: Hình thức bản văn của lời tuyên xưng bị khước từ
  choice: 'Theo bản văn ngắn của SBLGNT: “không tuyên xưng Chúa Giê-su”.'
  alternative: “không tuyên xưng rằng Chúa Giê-su là Đấng Christ đã đến trong thân xác”.
  rationale: Bản văn phê bình ở câu 3 có dạng ngắn; nội dung đầy đủ của lời tuyên xưng đã xuất hiện ở câu 2. Dạng dài được bảo tồn trong chú thích như một dị bản.
- issue: Có nên nói rõ danh từ bị tỉnh lược trong cụm τὸ τοῦ ἀντιχρίστου hay không
  choice: Bổ sung “linh” trong chính văn.
  alternative: 'Dịch sát cấu trúc tỉnh lược: “đó là điều thuộc về kẻ chống Đấng Christ”.'
  rationale: Danh từ “linh” được hiểu từ mệnh đề ngay trước đó. Nói rõ danh từ này tạo câu tiếng Việt sáng nghĩa và tự nhiên, trong khi chú thích vẫn bảo tồn đặc điểm tỉnh lược của nguyên văn.
- issue: Đối tượng đang đến trong mệnh đề quan hệ
  choice: Cho “linh” làm tiền ngữ của “linh mà anh em đã nghe là đang đến”.
  alternative: Hiểu là chính “kẻ chống Đấng Christ” đang đến.
  rationale: Đại từ quan hệ ὃ là giống trung, phù hợp với ý niệm trung tính đứng trước hơn là danh từ ἀντίχριστος giống đực; bản dịch tránh âm thầm đổi sang một chủ thể nam mang tính cá nhân.
translation_notes:
  register: Văn phong hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh em” cho ngôi số nhiều trong cộng đồng thư tín; dùng “linh” thay vì “thần linh” để tránh gợi riêng đến các hữu thể siêu nhiên độc lập. Các tên gọi “Chúa Giê-su”, “Đức Chúa Trời” và “Đấng Christ” được trình bày theo lối quen thuộc, rõ nghĩa trong tiếng Việt Kinh Thánh hiện đại.
