  - severity: low
    issue: Danh xưng “kẻ chống Đấng Christ” chưa nhất quán về tính xác định/tước hiệu.
    rationale: Cụm Hy Lạp có mạo từ và chỉ đối tượng đã được biết đến trong văn mạch; viết “Kẻ Chống Đấng Christ” giúp tiếng Việt phản ánh điều này mà không xác định thêm bản chất của nhân vật.
  - severity: medium
    issue: Câu dị bản “Chúa Giê-su là Đấng Christ đã đến trong thân xác” có thể mơ hồ về phạm vi của “đã đến.”
    rationale: Dị bản dài nói rằng Chúa Giê-su Christ đã đến trong thân xác. Cấu trúc sửa lại đặt “đã đến” sau toàn danh xưng để truyền đạt đúng mệnh đề.
