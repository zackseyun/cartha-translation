id: 1JN.4.17
reference: 1 John 4:17
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐν τούτῳ τετελείωται ἡ ἀγάπη μεθ’ ἡμῶν, ἵνα παρρησίαν ἔχωμεν ἐν τῇ ἡμέρᾳ τῆς κρίσεως, ὅτι καθὼς ἐκεῖνός ἐστιν καὶ ἡμεῖς ἐσμεν ἐν τῷ κόσμῳ τούτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/017.yaml
  text: By this[a], love has been perfected with us, so that we may have boldness in the day of judgment, because as he is[d][c][b], so also are we in this world.
translation:
  language: vi
  text: Nhờ điều này[a], tình yêu đã được nên trọn giữa chúng ta, để chúng ta có thể vững lòng trong ngày phán xét, bởi vì Ngài thế nào, chúng ta cũng thế ấy trong thế gian này.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Trong điều này, tình yêu đã được nên trọn với chúng ta.” Cụm từ Hy Lạp có thể chỉ phương tiện, cách thức hoặc phạm vi; “giữa chúng ta” cũng có thể dịch là “với chúng ta.”'
    reason: lexical_alternative
  - marker: b
    text: “Ngài” nhiều khả năng chỉ Chúa Giê-su; một số người hiểu là chỉ Đức Chúa Trời nói chung.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: Nhờ điều này
  rationale: Giữ sắc thái chỉ phương tiện/căn cứ của cụm từ Hy Lạp và nối tự nhiên với mệnh đề giải thích phía sau; chú thích bảo lưu khả năng hiểu là “Trong điều này”.
- source_word: τετελείωται
  choice: đã được nên trọn
  rationale: Thể hoàn thành bị động diễn tả việc được đưa đến chỗ trọn vẹn với kết quả còn tiếp diễn; “nên trọn” tự nhiên và không hàm ý tình yêu của Đức Chúa Trời từng có khuyết điểm đạo đức.
- source_word: ἡ ἀγάπη μεθ’ ἡμῶν
  choice: tình yêu đã được nên trọn giữa chúng ta
  rationale: “Giữa chúng ta” diễn đạt tự nhiên quan hệ của tình yêu trong cộng đồng tín hữu, đồng thời không thu hẹp thành chỉ tình yêu của chúng ta dành cho Đức Chúa Trời hay chỉ tình yêu của Ngài dành cho chúng ta.
- source_word: παρρησίαν
  choice: vững lòng
  rationale: Trong bối cảnh ngày phán xét, từ này chỉ sự tự do, không sợ hãi và đầy tin tưởng trước mặt Đức Chúa Trời; “vững lòng” rõ nghĩa hơn “dạn dĩ” đối với độc giả hiện đại.
- source_word: ἐν τῇ ἡμέρᾳ τῆς κρίσεως
  choice: trong ngày phán xét
  rationale: Bám sát giới từ Hy Lạp và giữ cách nói cánh chung quen thuộc, trang trọng.
- source_word: καθὼς ἐκεῖνός ἐστιν καὶ ἡμεῖς ἐσμεν
  choice: Ngài thể nào thì chúng ta cũng thể ấy
  rationale: Giữ cấu trúc so sánh tương liên và thì hiện tại của nguyên văn. Đại từ kính trọng vẫn để ngỏ tiền ngữ như trong tiếng Hy Lạp.
- source_word: ἐν τῷ κόσμῳ τούτῳ
  choice: trong thế gian này
  rationale: “Thế gian” phù hợp cách dùng của Giăng về phạm vi hiện tại nơi con người sống và giữ sắc thái Kinh Thánh mà vẫn dễ hiểu.
theological_decisions:
- issue: Đối tượng của ἐκεῖνος (“Ngài”)
  choice: Bản dịch dùng “Ngài” và không đưa danh xưng vào chính văn; theo văn mạch, nhiều khả năng chỉ Chúa Giê-su/Con Đức Chúa Trời.
  alternative: Có thể hiểu là chỉ Đức Chúa Trời nói chung.
  rationale: Trong 1 Giăng, ἐκεῖνος thường chỉ Chúa Giê-su trong những lời nói về đời sống giống Ngài. Tuy nhiên, nguyên văn chỉ dùng đại từ, nên bản dịch không làm rõ quá mức.
- issue: Ý nghĩa tình yêu được nên trọn
  choice: Tình yêu được đưa đến sự trọn vẹn theo mục đích của nó giữa chúng ta, đem lại sự vững lòng trong ngày phán xét.
  alternative: Chỉ tình yêu của chúng ta dành cho Đức Chúa Trời trở nên hoàn hảo, hoặc chỉ tình yêu của Đức Chúa Trời dành cho chúng ta đạt đến sự trọn vẹn.
  rationale: Ngữ pháp Hy Lạp không buộc phải chọn duy nhất chủ thể hay đối tượng của tình yêu. Cách dịch này bảo tồn độ mở và tránh du nhập quan niệm hoàn hảo đạo đức tuyệt đối.
translation_notes:
  register: Văn phong tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “nên trọn” để giữ liên hệ thần học với ý niệm đạt đến mục đích; dùng “vững lòng” thay cho lối dịch cổ “dạn dĩ”. Mọi chú thích đều có ký hiệu tương ứng trong chính văn.
