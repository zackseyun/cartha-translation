reference: 1 John 4:9
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐν τούτῳ ἐφανερώθη ἡ ἀγάπη τοῦ θεοῦ ἐν ἡμῖν, ὅτι τὸν υἱὸν αὐτοῦ τὸν μονογενῆ ἀπέσταλκεν ὁ θεὸς εἰς τὸν κόσμον ἵνα ζήσωμεν δι’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/009.yaml
  text: 'In this the love of God was revealed among us: that God has sent his one and only Son into the world so that we might live through him[a][b].'
translation:
  language: vi
  text: 'Trong điều này, tình yêu của Đức Chúa Trời đã được bày tỏ giữa chúng ta: Đức Chúa Trời đã sai Con duy nhất của Ngài đến thế gian để chúng ta sống nhờ Ngài.[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “trong chúng ta”. Cụm từ Hy Lạp có thể chỉ sự bày tỏ bên trong các tín hữu hoặc giữa cộng đồng chúng ta.
    reason: lexical_alternative
  - marker: b
    text: 'Cách dịch truyền thống: “Con độc sinh của Ngài”. Từ Hy Lạp μονογενής nhấn mạnh tính độc nhất của Con; “độc sinh” bảo lưu cách diễn đạt lâu đời của Hội Thánh.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: trong điều này
  rationale: Giữ cấu trúc chỉ thị đặc trưng của văn phong Giăng và để mệnh đề ὅτι theo sau giải thích tình yêu được bày tỏ bằng cách nào.
- source_word: ἐφανερώθη
  choice: đã được bày tỏ
  rationale: Diễn đạt tự nhiên thể bị động của φανερόω, với nghĩa điều vốn không thấy nay trở nên rõ ràng hoặc được nhận biết.
- source_word: ἡ ἀγάπη τοῦ θεοῦ
  choice: tình yêu của Đức Chúa Trời
  rationale: Cụm sở hữu chủ yếu chỉ tình yêu thuộc về và phát xuất từ Đức Chúa Trời, được chứng tỏ qua việc Ngài sai Con.
- source_word: ἐν ἡμῖν
  choice: giữa chúng ta
  rationale: Trong ngữ cảnh, cụm này có thể chỉ tình yêu được bày tỏ giữa cộng đồng hay trong mối liên hệ với chúng ta. Cách hiểu sát chữ “trong chúng ta” được giữ ở chú thích.
- source_word: ὅτι
  choice: ':'
  rationale: Dấu hai chấm tự nhiên trong tiếng Việt để giới thiệu nội dung giải thích cho “trong điều này”, tương ứng chức năng giải thích của ὅτι.
- source_word: τὸν υἱὸν αὐτοῦ τὸν μονογενῆ
  choice: Con duy nhất của Ngài
  rationale: μονογενής nhấn mạnh địa vị độc nhất vô nhị của Con. “Con duy nhất” rõ nghĩa trong tiếng Việt hiện đại mà không đưa ý niệm sinh ra trực tiếp vào nghĩa từ vựng.
- source_word: ἀπέσταλκεν
  choice: đã sai
  rationale: Tiếng Việt không mã hóa thì hoàn thành như tiếng Hy Lạp; “đã sai” diễn tả hành động đã hoàn tất, còn ý nghĩa lâu dài được thể hiện qua mục đích cứu sống ở phần sau.
- source_word: εἰς τὸν κόσμον
  choice: đến thế gian
  rationale: Cách nói tự nhiên trong tiếng Việt cho chuyển động hướng vào thế giới loài người; “thế gian” phù hợp văn mạch của Giăng.
- source_word: ἵνα ζήσωμεν
  choice: để chúng ta ... được sống
  rationale: Diễn đạt mục đích của ἵνα với động từ giả định, đồng thời “được sống” cho thấy sự sống là điều được ban qua Con.
- source_word: δι’ αὐτοῦ
  choice: nhờ Con ấy mà
  rationale: διά với sở hữu cách chỉ phương tiện hoặc tác nhân trung gian; “nhờ ... mà” là cách diễn đạt tiếng Việt tự nhiên và rõ nghĩa.
theological_decisions:
- issue: Ý nghĩa của μονογενής khi nói về Con
  choice: Con duy nhất
  alternative: Con độc sinh
  rationale: Bản chính nhấn mạnh mối quan hệ độc nhất của Con với Cha mà không biến một công thức thần học về sau thành nghĩa từ vựng tất yếu. Cách dịch truyền thống được bảo lưu trong chú thích.
- issue: Sắc thái của ἐν ἡμῖν
  choice: giữa chúng ta
  alternative: trong chúng ta
  rationale: “Giữa chúng ta” làm nổi bật sự bày tỏ trong cộng đồng, nhưng nguyên ngữ cũng có thể được hiểu là sự bày tỏ ở bên trong các tín hữu; chú thích giữ lại sự mơ hồ chính đáng này.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Chúa Trời” và đại từ tôn kính “Ngài”; lặp lại “Đức Chúa Trời” theo nguyên văn để giữ trọng tâm thần học, đồng thời dùng “Con ấy” ở cuối câu để tránh đại từ mơ hồ.
