revisions:
- from: 'Tình yêu của Đức Chúa Trời đã được bày tỏ giữa chúng ta trong điều này: Đức Chúa Trời đã sai Con duy nhất của Ngài đến thế gian để chúng ta nhờ Con ấy mà được sống.[a][b]'
  to: 'Trong điều này, tình yêu của Đức Chúa Trời đã được bày tỏ giữa chúng ta: Đức Chúa Trời đã sai Con duy nhất của Ngài đến thế gian để chúng ta sống nhờ Ngài.[a][b]'
  rationale: Điều chỉnh duy nhất về nghĩa là thay “được sống” bằng “sống” để phản ánh động từ chủ động ζήσωμεν, và dùng “nhờ Ngài” để quy chiếu kính trọng, tự nhiên đến Con. Đưa “Trong điều này” lên đầu câu giúp tái hiện công thức ἐν τούτῳ mà không thay đổi nghĩa. Các chú thích được giữ nguyên vì chúng phản ánh đúng những khả năng từ vựng còn mở trong nguyên ngữ.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T00:30:35Z'
