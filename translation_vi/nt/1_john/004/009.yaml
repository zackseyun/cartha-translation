  terminology: “Đức Chúa Trời,” “Con duy nhất,” “thế gian,” và “nhờ Ngài” nhất quán với văn phong Kinh Thánh tiếng Việt hiện đại. Chú thích về ἐν ἡμῖν và μονογενής giữ các khả năng diễn giải hợp lệ mà không áp đặt cách đọc giáo phái.
  issues:
