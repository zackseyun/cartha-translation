  source_fidelity: 'Bản dịch chuyển tải chính xác các yếu tố chính: tình yêu của Đức Chúa Trời được bày tỏ, việc Ngài sai Con duy nhất vào thế gian, và mục đích sự sống qua Con. Tuy nhiên, “được sống” thêm sắc thái bị động/được ban mà động từ chủ động ζήσωμεν (“chúng ta sống”) không nêu trực tiếp. Có thể giữ ý thần học hàm ẩn mà dịch sát hơn là “chúng ta sống nhờ Ngài.”'
