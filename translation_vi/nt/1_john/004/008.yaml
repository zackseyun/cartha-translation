  terminology: '"Đức Chúa Trời" là danh xưng nhất quán và phù hợp trong ngữ cảnh. "Tình yêu thương" giữ dạng danh từ vị ngữ của ἀγάπη, không làm suy giảm thành "Đức Chúa Trời yêu thương" và không đảo chủ-vị. Chú thích được đặt đúng sau cụm "chưa biết Đức Chúa Trời" và nêu phương án dịch hợp lệ.'
