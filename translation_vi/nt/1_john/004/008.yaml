  source_fidelity: 'Bản dịch phản ánh đúng cấu trúc và ý chính của Hy Lạp: chủ ngữ khái quát từ phân từ hiện tại phủ định ("Người không yêu thương"), mệnh đề chính với aorist của γινώσκω ("chưa biết Đức Chúa Trời"), quan hệ nguyên nhân của ὅτι ("vì"), và mệnh đề vị ngữ "Đức Chúa Trời là tình yêu thương." "Chưa biết" là một cách diễn đạt tiếng Việt có thể chấp nhận được cho aorist trong văn cảnh này, diễn tả người ấy chưa đi đến sự nhận biết Đức Chúa Trời mà không giới hạn vào tri thức thuần lý.'
