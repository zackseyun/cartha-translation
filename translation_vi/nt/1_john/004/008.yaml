  text: ὁ μὴ ἀγαπῶν οὐκ ἔγνω τὸν θεόν, ὅτι ὁ θεὸς ἀγάπη ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/008.yaml
  text: The one who does not love has not known God[a], because God is love.
translation:
  language: vi
  text: Người không yêu thương thì chưa biết Đức Chúa Trời[a], vì Đức Chúa Trời là tình yêu thương.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “không biết Đức Chúa Trời.” Dạng aorist của động từ Hy Lạp có thể được diễn đạt đơn giản như vậy; “chưa biết” nhấn mạnh rằng người ấy chưa đi đến chỗ nhận biết Đức Chúa Trời.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ μὴ ἀγαπῶν
  choice: Người không yêu thương
  rationale: Mạo từ đi với phân từ hiện tại tạo thành một danh ngữ chỉ chung người có đặc điểm là không yêu thương; cách dịch này tự nhiên trong tiếng Việt và vẫn gợi hành vi, nếp sống đang tiếp diễn.
- source_word: ἀγαπῶν
  choice: yêu thương
  rationale: “Yêu thương” là cách diễn đạt tự nhiên, trang trọng, đồng thời giữ được mối liên hệ từ vựng với ἀγάπη ở cuối câu qua cụm “tình yêu thương”.
- source_word: οὐκ ἔγνω
  choice: chưa biết
  rationale: Động từ aorist trong văn cảnh nói đến việc người ấy chưa đi đến chỗ biết Đức Chúa Trời. “Chưa biết” diễn đạt được trạng thái hiện tại phát sinh từ điều đó mà không thu hẹp ý nghĩa thành sự hiểu biết thuần trí óc.
- source_word: τὸν θεόν
  choice: Đức Chúa Trời
  rationale: Tân ngữ trực tiếp của ἔγνω; dùng danh xưng tiếng Việt quen thuộc và trang trọng dành cho God trong ngữ cảnh Kinh Thánh.
- source_word: ὅτι
  choice: vì
  rationale: Ở đây ὅτι nêu lý do cho mệnh đề trước; “vì” thể hiện rõ quan hệ nguyên nhân trong tiếng Việt.
- source_word: ὁ θεὸς
  choice: Đức Chúa Trời
  rationale: Chủ ngữ xác định của mệnh đề; giữ nhất quán với lần xuất hiện trước.
- source_word: ἀγάπη
  choice: tình yêu thương
  rationale: Danh từ trừu tượng làm vị ngữ; “tình yêu thương” giữ nguyên sức nặng của phát biểu và mối liên hệ với động từ “yêu thương”, thay vì làm yếu thành tính từ “hay yêu thương”.
- source_word: ἐστίν
  choice: là
  rationale: Động từ nối ở thì hiện tại được dịch trực tiếp, không cần diễn giải thêm.
theological_decisions:
- issue: Ý nghĩa của câu “Đức Chúa Trời là tình yêu thương”
  choice: Giữ nguyên phát biểu vị ngữ về bản tính hoặc phẩm tính của Đức Chúa Trời.
  alternative: Đức Chúa Trời yêu thương; Tình yêu thương là Đức Chúa Trời.
  rationale: Trong tiếng Hy Lạp, ὁ θεὸς là chủ ngữ có mạo từ, còn ἀγάπη là danh từ vị ngữ. Bản dịch không đảo ngược thành “Tình yêu thương là Đức Chúa Trời”, cũng không làm nhẹ phát biểu thành việc Đức Chúa Trời chỉ thực hiện hành động yêu thương.
- issue: Sắc thái của việc biết Đức Chúa Trời
  choice: Dịch là “chưa biết Đức Chúa Trời”, hàm ý chưa đi đến mối nhận biết Ngài được bày tỏ qua đời sống.
  alternative: không hiểu Đức Chúa Trời; không biết Đức Chúa Trời.
  rationale: Trong văn chương Giăng, γινώσκω thường vượt quá nhận thức trí óc và nói đến sự nhận biết mang tính quan hệ. “Chưa biết” giữ được sắc thái của aorist trong văn cảnh mà không diễn giải quá mức.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Người … thì …” để diễn đạt chủ thể chung một cách tự nhiên; giữ cặp từ cùng gốc ý nghĩa “yêu thương / tình yêu thương”. Dấu chú thích [a] xuất hiện ngay sau cụm từ liên quan.
