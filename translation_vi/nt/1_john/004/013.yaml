source:
  edition: SBLGNT
  text: Ἐν τούτῳ γινώσκομεν ὅτι ἐν αὐτῷ μένομεν καὶ αὐτὸς ἐν ἡμῖν, ὅτι ἐκ τοῦ πνεύματος αὐτοῦ δέδωκεν ἡμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/013.yaml
  text: 'By this we know that we remain in him and he in us: because he has given us of his Spirit[a][b][c].'
translation:
  language: vi
  text: 'Nhờ điều này, chúng ta biết rằng chúng ta ở lại trong Ngài và Ngài ở trong chúng ta: vì Ngài đã ban Thánh Linh của Ngài cho chúng ta.[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Qua điều này, chúng ta biết…”'
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn: “từ Thánh Linh của Ngài.” Cách nói này nhấn mạnh nguồn ban và có thể mang sắc thái ban cho một phần từ Thánh Linh của Ngài.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν τούτῳ
  choice: Nhờ điều này
  rationale: Cụm từ Gioan dùng để nêu căn cứ hoặc dấu hiệu nhờ đó một điều được nhận biết; cách dịch này tự nhiên trong tiếng Việt và giữ sắc thái phương tiện/chứng cứ.
- source_word: γινώσκομεν
  choice: chúng ta biết
  rationale: Thì hiện tại diễn tả sự nhận biết đang có; “biết” là cách diễn đạt trực tiếp và tự nhiên.
- source_word: ἐν αὐτῷ μένομεν
  choice: mình ở lại trong Ngài
  rationale: “Ở lại” giữ được ý kéo dài và tương quan của μένω, một từ khóa trong các trước tác Gioan; “mình” tránh lặp nặng sau “chúng ta” mà vẫn rõ chủ thể.
- source_word: καὶ αὐτὸς ἐν ἡμῖν
  choice: và Ngài ở trong chúng ta
  rationale: Tiếng Hy Lạp lược động từ ở vế thứ hai; tiếng Việt cần bổ sung “ở” để câu tự nhiên, đồng thời vẫn giữ thế song song về sự ở trong nhau.
- source_word: ὅτι
  choice: ấy là vì
  rationale: ὅτι thứ hai nêu căn cứ của sự nhận biết; “ấy là vì” diễn đạt rõ quan hệ giải thích mà không làm mất cấu trúc câu.
- source_word: ἐκ τοῦ πνεύματος αὐτοῦ
  choice: từ Thánh Linh của Ngài
  rationale: “Từ” bảo toàn sắc thái nguồn gốc của ἐκ; “Thánh Linh” xác định Đấng được nói đến theo văn cảnh, còn “của Ngài” giữ đại từ sở hữu của nguyên văn.
- source_word: δέδωκεν
  choice: đã ban
  rationale: “Đã ban” diễn đạt hành động hoàn tất của thì hoàn thành; “ban” phù hợp với văn cảnh Đức Chúa Trời ban Thánh Linh.
- source_word: ἡμῖν
  choice: cho chúng ta
  rationale: Dạng gián tiếp được diễn đạt tự nhiên trong tiếng Việt bằng “cho chúng ta”.
theological_decisions:
- issue: Đối tượng của “Ngài” và căn tính của πνεῦμα
  choice: Viết hoa “Thánh Linh” để chỉ Thánh Linh của Đức Chúa Trời; giữ “Ngài” theo đại từ của nguyên văn.
  alternative: Dịch “thần linh của Ngài” hoặc “tinh thần của Ngài”.
  rationale: Văn cảnh 1 Giăng 4 nói sự Đức Chúa Trời và tín hữu ở trong nhau được chứng thực bởi việc Ngài ban Thánh Linh; cách viết hoa nhận diện đối tượng mà không thêm một danh xưng không có trong câu Hy Lạp.
- issue: Ngôn ngữ về sự ở trong nhau
  choice: “mình ở lại trong Ngài và Ngài ở trong chúng ta”
  alternative: “chúng ta sống trong Ngài và Ngài sống trong chúng ta”
  rationale: “Ở lại” bảo tồn từ khóa μένω và tính kéo dài của mối tương giao, trong khi “sống” sẽ diễn giải rộng hơn nguyên văn.
- issue: Sắc thái của ἐκ τοῦ πνεύματος αὐτοῦ
  choice: Giữ cách nói “từ Thánh Linh của Ngài”.
  alternative: “ban Thánh Linh của Ngài cho chúng ta”
  rationale: Cách chọn giữ giới từ ἐκ và sự mơ hồ chân thực giữa sắc thái nguồn gốc và sắc thái phân chia; phương án thay thế trôi chảy hơn nhưng xóa mất ἐκ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” cho đại từ chỉ Đức Chúa Trời theo lối dùng phổ biến trong tiếng Việt Cơ Đốc; giữ “ở lại” nhằm bảo toàn thuật ngữ then chốt của Gioan. Dấu hai chấm làm nổi bật căn cứ được nêu ở vế cuối.
