id: 1JN.4.1
reference: 1 John 4:1
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἀγαπητοί, μὴ παντὶ πνεύματι πιστεύετε, ἀλλὰ δοκιμάζετε τὰ πνεύματα εἰ ἐκ τοῦ θεοῦ ἐστιν, ὅτι πολλοὶ ψευδοπροφῆται ἐξεληλύθασιν εἰς τὸν κόσμον.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/001.yaml
  text: Beloved[a], do not believe every spirit, but test the spirits to see whether they are from God[b], because many false prophets have gone out into the world.
translation:
  language: vi
  text: Anh chị em yêu dấu[a], đừng tin mọi thần linh, nhưng hãy kiểm nghiệm các thần linh xem có phải từ Đức Chúa Trời mà ra không[b], vì nhiều tiên tri giả đã ra đi vào thế gian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “Các bạn thân mến.” Từ Hy Lạp theo nghĩa đen là “những người được yêu dấu.”
    reason: lexical_alternative
  - marker: b
    text: Nghĩa là phải kiểm tra nguồn thuộc linh đứng sau những lời tự nhận là sứ điệp tiên tri; vế sau nói đến “các tiên tri giả” là những người truyền đạt các lời ấy.
    reason: cultural_note
lexical_decisions:
- source_word: Ἀγαπητοί
  choice: Anh chị em yêu dấu
  rationale: Lối xưng hô số nhiều ấm áp; cách dịch này giữ được liên hệ với ý niệm yêu thương, đồng thời tự nhiên và bao quát trong tiếng Việt hiện đại.
- source_word: παντὶ πνεύματι
  choice: mọi thần linh
  rationale: Giữ nguyên cách diễn đạt về thực thể hoặc nguồn tác động thuộc linh, thay vì thu hẹp thành lời nói hay người giảng dạy.
- source_word: πιστεύετε
  choice: tin
  rationale: Diễn đạt việc chấp nhận là thật; mệnh lệnh hiện tại với μή mang ý nghĩa ngăn cấm mang tính tổng quát.
- source_word: δοκιμάζετε
  choice: thử nghiệm
  rationale: Diễn đạt việc kiểm tra để xác định tính chân thật hoặc nguồn gốc; trang trọng nhưng vẫn dễ hiểu.
- source_word: τὰ πνεύματα
  choice: các thần linh
  rationale: Giữ nguyên số nhiều và khung siêu nhiên của nguyên văn, không đồng nhất các thần linh với chính các tiên tri.
- source_word: εἰ ἐκ τοῦ θεοῦ ἐστιν
  choice: xem họ có đến từ Đức Chúa Trời hay không
  rationale: Cụm 'xem... hay không' truyền đạt tự nhiên phép kiểm tra gián tiếp; 'đến từ' thể hiện nguồn gốc do ἐκ chỉ ra.
- source_word: πολλοὶ ψευδοπροφῆται
  choice: nhiều tiên tri giả
  rationale: Cách dịch trực tiếp, quen thuộc và chính xác cho những người tự nhận hoặc hoạt động như tiên tri nhưng truyền đạt điều giả dối.
- source_word: ἐξεληλύθασιν
  choice: đã đi ra
  rationale: 'Giữ hình ảnh chuyển động và kết quả hiện còn của thì hoàn thành: họ đã đi ra và hiện đang hoạt động.'
- source_word: εἰς τὸν κόσμον
  choice: khắp thế gian
  rationale: Trong tiếng Việt, 'đi ra khắp thế gian' tự nhiên hơn 'đi vào thế gian' khi nói đến việc những người ấy xuất hiện và hoạt động rộng rãi, dù có phần làm rõ hàm ý phạm vi của εἰς.
theological_decisions:
- issue: Đối tượng được gọi là 'các thần linh'
  choice: Các thần linh hoặc nguồn thuộc linh đứng sau những lời tuyên bố tiên tri, được nhận biết qua các tiên tri là con người
  alternative: Chỉ những giáo sư là con người, hoặc các lời phát biểu tiên tri xét như những mệnh đề trừu tượng
  rationale: Nguyên văn phân biệt πνεύματα với ψευδοπροφῆται. Bản dịch giữ ngôn ngữ siêu nhiên và sự căng thẳng của câu, còn chú thích giải thích mối liên hệ thực tiễn mà không đồng nhất hai bên.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Anh chị em yêu dấu” để giữ sắc thái thân tình của lời gọi; dùng “Đức Chúa Trời” nhất quán cho θεός. Các dấu chú thích [a], [b] đều xuất hiện ngay trong chính văn.
