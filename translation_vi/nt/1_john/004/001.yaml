revisions:
- from: Anh chị em yêu dấu[a], đừng tin mọi thần linh, nhưng hãy thử nghiệm các thần linh xem họ có đến từ Đức Chúa Trời hay không[b], vì nhiều tiên tri giả đã đi ra khắp thế gian.
  to: Anh chị em yêu dấu[a], đừng tin mọi thần linh, nhưng hãy kiểm nghiệm các thần linh xem có phải từ Đức Chúa Trời mà ra không[b], vì nhiều tiên tri giả đã ra đi vào thế gian.
  rationale: Bản sửa thay «thử nghiệm» bằng «kiểm nghiệm» để phù hợp hơn với hành vi phân định, điều chỉnh mệnh đề gián tiếp cho tự nhiên hơn, và thay «khắp thế gian» bằng «vào thế gian» để không thêm ý về phạm vi. «Đã ra đi vào thế gian» giữ cả sắc thái «đi ra» của ἐξεληλύθασιν lẫn đích đến εἰς τὸν κόσμον.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T00:30:33Z'
review_pass:
  verdict: revise
  source_fidelity: Bản nháp giữ đúng mệnh lệnh phủ định, sự phân biệt giữa «các thần linh» và «các tiên tri giả», cùng nguồn gốc «từ Đức Chúa Trời». Tuy nhiên, «khắp thế gian» thêm ý phạm vi phổ quát không có trong εἰς τὸν κόσμον («vào thế gian»).
  naturalness: «Thử nghiệm» thường gợi việc làm thí nghiệm; «kiểm nghiệm» tự nhiên hơn trong ngữ cảnh phân định tính xác thực. Cấu trúc «xem có phải từ Đức Chúa Trời mà ra không» tránh đại từ «họ» cho «các thần linh» mà vẫn tự nhiên.
  terminology: «Anh chị em yêu dấu», «các thần linh», «Đức Chúa Trời», và «các tiên tri giả» phù hợp với thanh giọng trang trọng vừa phải. «Các thần linh» bảo toàn ngôn ngữ thuộc linh của πνεύματα, không đồng nhất chúng với các tiên tri.
  issues:
  - severity: medium
    issue: «khắp thế gian»
    rationale: 'Cụm này diễn đạt sự lan rộng trên toàn thế giới, trong khi εἰς τὸν κόσμον chỉ nêu hướng/đích đến: «vào thế gian». Cần tránh thêm phạm vi không được nguyên văn nêu.'
  - severity: low
    issue: «thử nghiệm»
    rationale: Từ này có thể gợi thử nghiệm khoa học. «Kiểm nghiệm» diễn đạt rõ hơn hành động khảo xét để xác định tính chân thật của δοκιμάζετε.
  - severity: low
    issue: Đại từ «họ» quy chiếu «các thần linh»
    rationale: Không sai về ngữ pháp, nhưng «xem có phải từ Đức Chúa Trời mà ra không» tự nhiên hơn và không buộc cách nhân cách hóa trong tiếng Việt.
