  source_fidelity: 'Cần sửa hai điểm để phản ánh sát hơn câu Hy Lạp: ἔχομεν là “chúng ta có,” không phải “nhận”; và ἀδελφὸν αὐτοῦ là danh từ giống đực số ít, nên bản chính nên giữ “người anh em mình.” Lực mệnh lệnh của mệnh đề ἵνα được chuyển đạt phù hợp bằng “cũng phải yêu.”'
  naturalness: “Và chúng ta có điều răn này từ Ngài” là cấu trúc rõ ràng, trang trọng và tự nhiên trong văn phong Kinh Thánh Việt ngữ hiện đại. Cấu trúc “ai… thì cũng phải…” mạch lạc và tự nhiên.
  terminology: “Điều răn,” “Đức Chúa Trời,” “Ngài,” và “yêu” đều nhất quán với thuật ngữ Cơ Đốc giáo Việt ngữ và với sự lặp lại của nhóm từ ἀγαπάω trong câu.
  issues:
  - severity: medium
    issue: “nhận từ Ngài điều răn này” thay cho ἔχομεν
    rationale: Động từ ἔχομεν có nghĩa là “chúng ta có,” không nói rõ hành động “nhận.” “Nhận” tuy không trái ý hoàn toàn nhưng thêm sắc thái tiếp nhận không được diễn đạt trong nguyên văn.
  - severity: medium
    issue: “anh chị em mình” trong bản chính thay cho ἀδελφὸν αὐτοῦ
    rationale: Cụm Hy Lạp có hình thức giống đực số ít, nghĩa đen là “người anh em của mình.” Phạm vi đại diện gồm cả nam lẫn nữ có thể được nêu ở chú thích, nhưng không nên chuyển thành cụm số nhiều bao gồm giới tính trong bản chính.
  revised_text: 'Và chúng ta có điều răn này từ Ngài: ai yêu Đức Chúa Trời thì cũng phải yêu người anh em mình.[a]'
