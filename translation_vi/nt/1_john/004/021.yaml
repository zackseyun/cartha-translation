source:
  edition: SBLGNT
  text: καὶ ταύτην τὴν ἐντολὴν ἔχομεν ἀπ’ αὐτοῦ, ἵνα ὁ ἀγαπῶν τὸν θεὸν ἀγαπᾷ καὶ τὸν ἀδελφὸν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/021.yaml
  text: 'And we have this commandment from him: that the one who loves God should also love his brother[a].'
translation:
  language: vi
  text: 'Và chúng ta có điều răn này từ Ngài: ai yêu Đức Chúa Trời thì cũng phải yêu người anh em mình.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “anh chị em mình.” Tiếng Hy Lạp là “người anh em của mình,” ở dạng giống đực số ít; trong ngữ cảnh, từ này có thể được dùng theo nghĩa đại diện cho một người cùng đức tin, nam hoặc nữ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐντολήν
  choice: điều răn
  rationale: “Điều răn” giữ được tính thẩm quyền và sắc thái đạo đức của từ này trong văn chương Giăng, đồng thời là cách nói tự nhiên, quen thuộc trong tiếng Việt.
- source_word: ἀπ’ αὐτοῦ
  choice: từ Ngài
  rationale: Giữ đại từ như bản Hy Lạp thay vì lặp lại “Đức Chúa Trời”; trong ngữ cảnh gần, đại từ này tự nhiên quy chiếu về Đức Chúa Trời.
- source_word: ἵνα
  choice: dấu hai chấm dẫn vào nội dung điều răn
  rationale: Ở đây ἵνα giới thiệu nội dung của điều răn. Cấu trúc với dấu hai chấm diễn đạt tự nhiên trong tiếng Việt mà không biến mệnh đề thành mục đích.
- source_word: ὁ ἀγαπῶν τὸν θεόν
  choice: ai yêu Đức Chúa Trời
  rationale: “Ai” diễn đạt tự nhiên giá trị khái quát của phân từ có mạo từ, không áp đặt giới tính của chủ thể và không làm mất tính đại diện của câu.
- source_word: ἀγαπᾷ
  choice: thì cũng phải yêu
  rationale: “Phải” thể hiện nghĩa vụ do điều răn truyền dạy, phù hợp với thể giả định sau ἵνα; “cũng” giữ lực bổ sung của καί.
- source_word: ἀδελφὸν αὐτοῦ
  choice: anh chị em mình
  rationale: Trong ngữ cảnh cộng đồng tín hữu, danh từ giống đực số ít có thể được dùng theo nghĩa đại diện. “Anh chị em mình” truyền đạt tự nhiên phạm vi gồm cả nam lẫn nữ trong tiếng Việt; chú thích bảo lưu hình thức sát chữ “người anh em của mình”.
- source_word: ἀγαπάω / ἀγαπῶν / ἀγαπᾷ
  choice: yêu
  rationale: Dùng nhất quán “yêu” cho cùng nhóm từ nhằm giữ sự liên kết chủ đề trong văn chương Giăng.
theological_decisions:
- issue: Phạm vi giới tính và cộng đồng của ἀδελφὸν αὐτοῦ
  choice: anh chị em mình
  alternative: người anh em của mình
  rationale: Hình thức Hy Lạp là giống đực số ít, nhưng trong ngữ cảnh có chức năng đại diện cho người cùng cộng đồng đức tin. Bản chính dùng cách diễn đạt bao quát, tự nhiên trong tiếng Việt; chú thích nêu rõ dạng sát chữ để không che khuất hình thức nguồn.
- issue: Mức độ nghĩa vụ trong ἀγαπᾷ sau ἵνα
  choice: phải yêu
  alternative: nên yêu
  rationale: Vì mệnh đề trình bày nội dung của một điều răn, “phải” truyền đạt rõ lực bắt buộc mà không thêm một mức độ tuyệt đối vượt quá văn cảnh.
- issue: Quy chiếu của αὐτοῦ trong ἀπ’ αὐτοῦ
  choice: Ngài
  alternative: Đức Chúa Trời
  rationale: Ngữ cảnh quy chiếu tự nhiên về Đức Chúa Trời, nhưng bản Hy Lạp dùng đại từ. Giữ đại từ tránh giải thích thay cho nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Chúa Trời” và đại từ tôn kính “Ngài”; cấu trúc “ai… thì…” tự nhiên trong tiếng Việt. Dấu chú thích [a] xuất hiện ngay sau cụm từ được giải thích.
