revisions:
- from: Còn chúng ta đã biết và đã tin tình yêu mà Đức Chúa Trời có ở giữa chúng ta.[a] Đức Chúa Trời là tình yêu; ai cứ ở trong tình yêu thì cứ ở trong Đức Chúa Trời, và Đức Chúa Trời cứ ở trong người ấy.
  to: Chúng ta đã biết và đã tin tình yêu mà Đức Chúa Trời có ở giữa chúng ta.[a] Đức Chúa Trời là tình yêu; ai ở trong tình yêu thì ở trong Đức Chúa Trời, và Đức Chúa Trời ở trong người ấy.
  rationale: Bỏ “Còn” để không thêm đối lập và bỏ “cứ” để câu văn tự nhiên hơn, trong khi vẫn giữ nhất quán “ở trong” cho μένω và giữ cách hiểu cộng đồng của ἐν ἡμῖν. Chú thích tiếp tục bảo tồn cách hiểu nội tại có thể có của cụm từ này.
