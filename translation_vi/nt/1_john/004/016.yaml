  source_fidelity: Bản dịch giữ đúng hai động từ hoàn thành, ý nghĩa vị trí/cộng đồng của ἐν ἡμῖν, và cấu trúc ở trong nhau. Tuy nhiên, “Còn chúng ta” gợi đối lập không được nhấn mạnh trong καὶ, còn việc lặp “cứ ở” cho cả Đức Chúa Trời tạo sắc thái khẩu ngữ/tiếp diễn hơi gượng mà không cần thiết để dịch μένω.
  naturalness: “Ai cứ ở ... thì cứ ở ... và Đức Chúa Trời cứ ở ...” lặp “cứ” thiếu tự nhiên trong tiếng Việt hiện đại, đặc biệt khi chủ ngữ là Đức Chúa Trời. “Ở trong” tự nó diễn đạt rõ quan hệ bền vững trong ngữ cảnh và giữ được tính đối xứng của μένω.
  terminology: “Đức Chúa Trời,” “tình yêu,” và “ở trong” phù hợp văn phong Kinh Thánh tiếng Việt hiện đại. “Người ấy” là cách quy chiếu tự nhiên, không thêm giới tính cho đại từ giống đực số ít mang lực đại diện trong tiếng Hy Lạp.
