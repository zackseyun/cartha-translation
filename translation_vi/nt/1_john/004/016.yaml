id: 1JN.4.16
reference: 1 John 4:16
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἡμεῖς ἐγνώκαμεν καὶ πεπιστεύκαμεν τὴν ἀγάπην ἣν ἔχει ὁ θεὸς ἐν ἡμῖν. Ὁ θεὸς ἀγάπη ἐστίν, καὶ ὁ μένων ἐν τῇ ἀγάπῃ ἐν τῷ θεῷ μένει καὶ ὁ θεὸς ἐν αὐτῷ ⸀μένει.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/016.yaml
  text: And we have come to know and have believed the love that God has for us[a]. God is love, and the one who remains in love remains in God[c][b], and God remains in him.
translation:
  language: vi
  text: Chúng ta đã biết và đã tin tình yêu mà Đức Chúa Trời có ở giữa chúng ta.[a] Đức Chúa Trời là tình yêu; ai ở trong tình yêu thì ở trong Đức Chúa Trời, và Đức Chúa Trời ở trong người ấy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “tình yêu mà Đức Chúa Trời có trong chúng ta.” Cụm từ Hy Lạp có thể chỉ tình yêu hiện diện bên trong các tín hữu hoặc được bày tỏ giữa cộng đồng.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐγνώκαμεν
  choice: đã biết
  rationale: Thì hoàn thành diễn tả sự nhận biết đã đạt đến và còn có hiệu lực; tiếng Việt tự nhiên dùng “đã biết” mà không cần diễn giải quá mức.
- source_word: πεπιστεύκαμεν
  choice: đã tin
  rationale: Giữ song song với động từ hoàn thành trước đó và diễn tả lòng tin đã hình thành, vẫn tiếp tục trong hiện tại.
- source_word: ἣν ἔχει ὁ θεὸς ἐν ἡμῖν
  choice: mà Đức Chúa Trời có ở giữa chúng ta
  rationale: “Ở giữa chúng ta” bảo toàn nghĩa vị trí/cộng đồng của ἐν ἡμῖν, không tự chuyển thành nghĩa thụ hưởng “dành cho chúng ta”; cách hiểu nội tại vẫn được ghi ở chú thích.
- source_word: Ὁ θεὸς ἀγάπη ἐστίν
  choice: Đức Chúa Trời là tình yêu
  rationale: Chuyển trực tiếp cấu trúc danh từ vị ngữ, giữ nguyên lời khẳng định cô đọng.
- source_word: ὁ μένων
  choice: ai cứ ở
  rationale: “Cứ ở” là cách nói hiện đại, tự nhiên, đồng thời truyền đạt ý tiếp tục/kiên trì của μένω; “ai” thể hiện lực đại diện của phân từ có mạo từ.
- source_word: ἐν τῇ ἀγάπῃ
  choice: ở trong tình yêu
  rationale: Giữ hình ảnh về phạm vi hay tình trạng sống trong tình yêu, thay vì làm yếu thành việc chỉ có tình cảm yêu thương.
- source_word: ἐν τῷ θεῷ μένει ... ὁ θεὸς ἐν αὐτῷ μένει
  choice: cứ ở trong Đức Chúa Trời ... Đức Chúa Trời cứ ở trong người ấy
  rationale: Dùng nhất quán “cứ ở” cho μένω và bảo toàn chủ đề ở trong nhau; “người ấy” quy chiếu tự nhiên đến “ai” mà không giới hạn giới tính ngoài dụng ý đại diện của nguyên văn.
theological_decisions:
- issue: Ý nghĩa của ἐν ἡμῖν trong mệnh đề đầu
  choice: ở giữa chúng ta, theo nghĩa vị trí/cộng đồng
  alternative: ở trong chúng ta; yêu thương chúng ta/dành cho chúng ta
  rationale: Giới từ ἐν trước hết mang nghĩa “trong/ở giữa”. Ngữ cảnh nói đến tình yêu được bày tỏ trong cộng đồng và việc ở trong nhau; bản dịch chính giữ nghĩa vị trí, còn chú thích bảo tồn khả năng hiểu là tình yêu hiện diện bên trong các tín hữu.
- issue: Cách diễn đạt αὐτῷ giống đực số ít có lực đại diện
  choice: người ấy
  alternative: người đó; người nam ấy/anh ấy
  rationale: Tiền ngữ trong tiếng Việt là “ai”, nên “người ấy” vừa quy chiếu rõ ràng vừa thể hiện đúng lực đại diện phổ quát, không áp đặt giới tính sinh học mà văn cảnh không nhấn mạnh.
- issue: Tính tương hỗ của việc μένω
  choice: giữ cùng một cách dịch “cứ ở” cho cả con người và Đức Chúa Trời
  alternative: dùng “gắn bó” cho con người và “ngự” cho Đức Chúa Trời
  rationale: Dùng cùng một từ bảo toàn sự đối xứng có chủ ý của nguyên văn và tránh đưa thêm phân biệt thần học không được câu văn nêu ra.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Cứ ở” được dùng nhất quán cho μένω để vừa tự nhiên trong tiếng Việt vừa diễn tả sự tiếp tục; dấu chấm phẩy làm rõ hai lời khẳng định liên kết chặt chẽ.
