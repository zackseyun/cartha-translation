id: 1JN.4.2
reference: 1 John 4:2
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐν τούτῳ ⸀γινώσκετε τὸ πνεῦμα τοῦ θεοῦ· πᾶν πνεῦμα ὃ ὁμολογεῖ Ἰησοῦν Χριστὸν ἐν σαρκὶ ἐληλυθότα ἐκ τοῦ θεοῦ ἐστιν,
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/002.yaml
  text: 'By this you know the Spirit of God: every spirit that confesses Jesus the Messiah having come in the flesh is from God[c][b][a],'
translation:
  language: vi
  text: 'Nhờ điều này, anh em nhận biết Thần Khí của Đức Chúa Trời: mọi thần linh tuyên xưng rằng Đức Giê-su, Đấng Mê-si[a], đã đến trong xác thịt[b] đều đến từ Đức Chúa Trời.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “Đức Giê-su Ki-tô”. Từ Hy Lạp Χριστός là tước hiệu có nghĩa “Đấng Mê-si” hay “Đấng được xức dầu”, chứ không phải một họ.
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “tuyên xưng Đức Giê-su, Đấng Mê-si, là Đấng đã đến trong xác thịt”. Tiếng Hy Lạp dùng phân từ hoàn thành, nhấn mạnh rằng việc ngài đến trong xác thịt thật vẫn có ý nghĩa lâu dài.'
    reason: lexical_and_syntactic_alternative
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: Nhờ điều này
  rationale: Cụm từ giới thiệu tiêu chí giúp người đọc phân định; “nhờ điều này” diễn đạt tự nhiên sắc thái phương tiện của ἐν trong ngữ cảnh.
- source_word: γινώσκετε
  choice: anh em nhận biết
  rationale: 'Giữ cách hiểu động từ ở thể chỉ định hiện tại số nhiều: tác giả nói cách cộng đồng nhận biết, thay vì ban một mệnh lệnh.'
- source_word: τὸ πνεῦμα τοῦ θεοῦ
  choice: Thần Khí của Đức Chúa Trời
  rationale: Danh từ có mạo từ và sự đối lập với các thần linh ở vế sau ủng hộ cách hiểu chỉ Thần Khí thuộc về Đức Chúa Trời; viết hoa giúp phân biệt với “mọi thần linh”.
- source_word: πᾶν πνεῦμα
  choice: mọi thần linh
  rationale: Diễn đạt phạm trù bao gồm từng tác nhân hay ảnh hưởng thuộc linh cần được thử nghiệm; chữ thường phân biệt với Thần Khí của Đức Chúa Trời.
- source_word: ὁμολογεῖ
  choice: tuyên xưng
  rationale: Thể hiện sự công khai nhìn nhận và xác quyết, phù hợp sắc thái của ὁμολογέω trong văn mạch Giăng.
- source_word: Ἰησοῦν Χριστόν
  choice: Đức Giê-su, Đấng Mê-si
  rationale: Χριστός được hiểu như tước hiệu mang nghĩa “Đấng Mê-si”, không như một thành tố họ tên; dấu phẩy tạo lối diễn đạt tự nhiên trong tiếng Việt.
- source_word: ἐν σαρκὶ
  choice: trong xác thịt
  rationale: Giữ hình ảnh cụ thể của σάρξ và lời khẳng định rằng Đức Giê-su thực sự đến trong thân phận có thể xác, không thay bằng thuật ngữ thần học kỹ thuật.
- source_word: ἐληλυθότα
  choice: đã đến
  rationale: Thì hoàn thành của phân từ chỉ một sự đến đã xảy ra nhưng vẫn có ý nghĩa hiện tại; tiếng Việt diễn đạt tự nhiên bằng “đã đến”, với sắc thái bền lâu được giải thích trong chú thích.
- source_word: ἐκ τοῦ θεοῦ ἐστιν
  choice: đều đến từ Đức Chúa Trời
  rationale: ἐκ chỉ nguồn gốc; “đến từ” rõ ràng trong tiếng Việt hiện đại, còn “đều” tương ứng tự nhiên với cấu trúc phân phối “mọi… đều”.
theological_decisions:
- issue: τὸ πνεῦμα τοῦ θεοῦ chỉ đích danh Thần Khí của Đức Chúa Trời hay nói chung về một thần linh đến từ Ngài
  choice: Thần Khí của Đức Chúa Trời
  alternative: thần linh đến từ Đức Chúa Trời
  rationale: Danh từ số ít có mạo từ, cùng chức năng của câu này là đưa ra tiêu chí nhận biết giữa các thần linh, nghiêng về việc chỉ Thần Khí của chính Đức Chúa Trời. Cách dịch vẫn bám sát cấu trúc sở hữu của nguyên văn.
- issue: Lực thần học của ἐν σαρκὶ ἐληλυθότα
  choice: đã đến trong xác thịt
  alternative: đã đến làm người
  rationale: Cách chọn giữ nguyên hình ảnh “xác thịt” và khẳng định sự hiện hữu thể chất thật của Đức Giê-su, nhưng không đưa vào câu chính những thuật ngữ tín điều xuất hiện về sau.
- issue: Quan hệ cú pháp giữa ὁμολογεῖ và Ἰησοῦν Χριστὸν ἐν σαρκὶ ἐληλυθότα
  choice: tuyên xưng rằng Đức Giê-su, Đấng Mê-si, đã đến trong xác thịt
  alternative: tuyên xưng Đức Giê-su, Đấng Mê-si, là Đấng đã đến trong xác thịt
  rationale: Nguyên văn dùng đối cách cộng với phân từ hoàn thành, có thể hiểu là nội dung được tuyên xưng hoặc phẩm chất của Đấng được tuyên xưng. Câu chính dùng mệnh đề “rằng” cho tự nhiên, còn chú thích bảo tồn cách diễn đạt thay thế gần cấu trúc phân từ hơn.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh em” cho ngôi thứ hai số nhiều theo văn phong thư tín; dùng “Thần Khí” viết hoa cho τὸ πνεῦμα τοῦ θεοῦ và “thần linh” viết thường cho πᾶν πνεῦμα để thể hiện sự phân biệt trong văn mạch. Tránh thuật ngữ tín điều kỹ thuật không có trực tiếp trong nguyên văn.
