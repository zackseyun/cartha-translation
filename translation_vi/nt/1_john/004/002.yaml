  source_fidelity: 'Bản dịch truyền đạt chính xác cấu trúc và ý chính của nguyên văn: tiêu chí nhận biết Thần Khí của Đức Chúa Trời là lời tuyên xưng Đức Giê-su, Đấng Mê-si, đã đến trong xác thịt; mọi thần linh có lời tuyên xưng ấy đều đến từ Đức Chúa Trời. “Nhờ điều này,” “nhận biết,” “tuyên xưng,” “đã đến trong xác thịt,” và “đến từ Đức Chúa Trời” đều phản ánh thỏa đáng các cụm Hy Lạp tương ứng. Mệnh đề với “rằng” là cách diễn đạt tiếng Việt tự nhiên cho đối cách kèm phân từ, không làm mất ý nghĩa hoàn thành của ἐληλυθότα; chú thích b nêu rõ sắc thái này.'
