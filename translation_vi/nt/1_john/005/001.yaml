id: 1JN.5.1
reference: 1 John 5:1
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Πᾶς ὁ πιστεύων ὅτι Ἰησοῦς ἐστιν ὁ χριστὸς ἐκ τοῦ θεοῦ γεγέννηται, καὶ πᾶς ὁ ἀγαπῶν τὸν γεννήσαντα ἀγαπᾷ ⸀καὶ τὸν γεγεννημένον ἐξ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/001.yaml
  text: Everyone who believes that Jesus is the Messiah has been born of God[b][a], and everyone who loves the one who fathered him also loves the one born of him.
translation:
  language: vi
  text: Ai tin rằng Đức Giê-su là Đấng Mê-si[a] thì đã được Đức Chúa Trời sinh ra; và ai yêu Đấng đã sinh ra mình thì cũng yêu người được Ngài sinh ra.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “Đấng Christ.” Từ Hy Lạp Χριστός là tước hiệu có nghĩa là “Đấng được xức dầu.”
    reason: alternative_reading
  - marker: b
    text: 'Tiếng Hy Lạp dùng các dạng của cùng một động từ “sinh ra” suốt câu này: “đã được Đức Chúa Trời sinh ra,” “Đấng đã sinh ra mình” và “người được Ngài sinh ra.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πᾶς ὁ πιστεύων
  choice: Ai tin
  rationale: Diễn đạt tự nhiên lực khái quát của phân từ hiện tại có mạo từ, áp dụng cho bất cứ người nào tin.
- source_word: ὅτι Ἰησοῦς ἐστιν ὁ χριστός
  choice: rằng Đức Giê-su là Đấng Mê-si
  rationale: Χριστός là tước hiệu chỉ Đấng được xức dầu; “Đấng Mê-si” giữ rõ ý nghĩa tước hiệu thay vì biến thành tên riêng.
- source_word: ἐκ τοῦ θεοῦ γεγέννηται
  choice: đã được sinh bởi Đức Chúa Trời
  rationale: Thể hoàn thành bị động nói đến hành động đã xảy ra với kết quả còn tồn tại; “đã được sinh” giữ hình ảnh sinh ra và “bởi Đức Chúa Trời” nêu nguồn/chủ thể.
- source_word: πᾶς ὁ ἀγαπῶν
  choice: ai yêu
  rationale: Cách nói gọn, tự nhiên và giữ lực khái quát của phân từ hiện tại có mạo từ.
- source_word: τὸν γεννήσαντα
  choice: Đấng đã sinh ra mình
  rationale: Giữ động từ sinh ra, chỉ Đức Chúa Trời là Đấng sinh; “mình” làm rõ quan hệ đã hàm chứa trong phép đối chiếu mà không dùng thẳng danh xưng “Cha” vốn không có trong câu Hy Lạp.
- source_word: ἀγαπᾷ καὶ
  choice: thì cũng yêu
  rationale: '“Cũng” thể hiện quan hệ liên kết: yêu Đấng sinh ra dẫn đến yêu người được sinh bởi Ngài.'
- source_word: τὸν γεγεννημένον ἐξ αὐτοῦ
  choice: người được sinh bởi Ngài
  rationale: Giữ sự lặp lại có chủ ý của γεννάω và để ngỏ phạm vi chỉ người được Đức Chúa Trời sinh ra, thay vì thu hẹp thành một cá nhân cụ thể.
theological_decisions:
- issue: Ngôn ngữ γεννάω về việc được Đức Chúa Trời sinh ra
  choice: Dùng nhất quán “được sinh/sinh ra” trong cả câu.
  alternative: “được tái sinh”; hoặc “sinh thành/con cái”
  rationale: Bản Hy Lạp lặp cùng một gốc động từ để nối việc người tin được sinh bởi Đức Chúa Trời với tình yêu dành cho những người cũng được Ngài sinh ra. “Tái sinh” giải nghĩa mạnh hơn văn bản tại chỗ, còn “con cái” làm mất liên kết từ vựng.
- issue: Tước hiệu ὁ χριστός
  choice: Đấng Mê-si
  alternative: Đấng Christ
  rationale: Cụm từ mang tính tuyên xưng và dùng như tước hiệu của Đấng được xức dầu; cách dịch này truyền đạt nội dung tước hiệu cho độc giả hiện đại.
- issue: Đối tượng của τὸν γεγεννημένον ἐξ αὐτοῦ
  choice: “người được sinh bởi Ngài,” không xác định là riêng Chúa Giê-su hay một tín hữu cụ thể
  alternative: “Con do Ngài sinh ra” hoặc “con cái Ngài”
  rationale: Dạng số ít có tính khái quát trong mạch lập luận có thể chỉ bất cứ người nào được Đức Chúa Trời sinh ra. Bản dịch tránh âm thầm quy cụm từ này riêng cho Chúa Giê-su hoặc chuyển hẳn sang số nhiều.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Giê-su” và “Đức Chúa Trời” theo lối gọi kính trọng; viết hoa “Đấng/Ngài” khi quy chiếu Đức Chúa Trời. Cấu trúc “Ai… thì…” tự nhiên trong tiếng Việt và giữ quan hệ khái quát của nguyên văn.
