id: 1JN.5.13
reference: 1 John 5:13
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ταῦτα ἔγραψα ⸀ὑμῖν ἵνα εἰδῆτε ὅτι ζωὴν ⸂ἔχετε αἰώνιον⸃, ⸂τοῖς πιστεύουσιν⸃ εἰς τὸ ὄνομα τοῦ υἱοῦ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/013.yaml
  text: I have written these things to you who believe in the name of the Son of God[a], so that you may know that you have eternal life.
translation:
  language: vi
  text: Tôi đã viết những điều này cho anh chị em là những người tin vào danh Con Đức Chúa Trời, để anh chị em biết rằng mình có sự sống đời đời.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ταῦτα
  choice: những điều này
  rationale: Giữ dạng số nhiều của đại từ chỉ định và tự nhiên quy chiếu đến nội dung thư hoặc phần trình bày trước đó.
- source_word: ἔγραψα
  choice: đã viết
  rationale: Thể aorist diễn tả hành động viết đã hoàn tất; trong văn cảnh thư tín, tiếng Việt tự nhiên dùng “đã viết”.
- source_word: ὑμῖν
  choice: cho anh chị em
  rationale: Dịch túc từ gián tiếp số nhiều; “anh chị em” là cách xưng hô trực tiếp, trang trọng và dễ hiểu, không mặc định giới tính của toàn thể độc giả.
- source_word: ἵνα εἰδῆτε
  choice: để anh chị em biết
  rationale: “Để” thể hiện rõ ý mục đích của ἵνα; “biết” chuyển tải sự nhận biết chắc chắn mà tác giả muốn độc giả có.
- source_word: ζωὴν αἰώνιον
  choice: sự sống đời đời
  rationale: Cách diễn đạt quen thuộc và chính xác trong tiếng Việt, giữ cả chiều kích trường tồn lẫn phẩm chất thần học của sự sống.
- source_word: ἔχετε
  choice: mình có
  rationale: Giữ ý sở hữu trong hiện tại; “mình” tránh lặp nặng “anh chị em” mà vẫn quy chiếu rõ đến người nhận.
- source_word: τοῖς πιστεύουσιν
  choice: là những người tin
  rationale: Hiểu cụm phân từ ở cách dữ như thành phần đồng vị xác định ὑμῖν; cách dịch này tự nhiên nhưng vẫn ghi nhận trật tự Hy Lạp trong chú thích.
- source_word: πιστεύουσιν εἰς
  choice: tin vào
  rationale: Giữ cấu trúc Giăng thường dùng để nói đến việc đặt đức tin nơi một đối tượng, không thu hẹp thành sự đồng ý về mặt nhận thức.
- source_word: τὸ ὄνομα
  choice: danh
  rationale: “Danh” giữ thành ngữ Kinh Thánh chỉ chính thân vị và thẩm quyền được bày tỏ, đồng thời phù hợp văn phong trang trọng.
- source_word: τοῦ υἱοῦ τοῦ θεοῦ
  choice: Con Đức Chúa Trời
  rationale: Dịch trực tiếp tước hiệu Cơ Đốc học và giữ quan hệ sở thuộc của cấu trúc Hy Lạp.
theological_decisions:
- issue: Vị trí và quan hệ cú pháp của τοῖς πιστεύουσιν
  choice: 'Gắn với ὑμῖν: “cho anh chị em là những người tin vào danh Con Đức Chúa Trời”'
  alternative: 'Giữ ở cuối theo trật tự Hy Lạp: “để anh chị em biết rằng mình có sự sống đời đời—là những người tin vào danh Con Đức Chúa Trời”'
  rationale: Cụm ở cách dữ có thể được hiểu là đồng vị với “anh chị em” dù xuất hiện cuối câu, hoặc như một phần đồng vị được nhắc lại sau mệnh đề bảo đảm. Bản chính đặt cạnh người nhận để tiếng Việt rõ và tự nhiên; chú thích bảo tồn trật tự cùng độ mơ hồ thật của nguyên văn.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh chị em” cho ngôi thứ hai số nhiều trong cộng đồng đức tin; dùng “danh” để giữ thành ngữ Kinh Thánh mà không diễn giải quá mức.
