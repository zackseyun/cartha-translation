  text: πᾶσα ἀδικία ἁμαρτία ἐστίν, καὶ ἔστιν ἁμαρτία οὐ πρὸς θάνατον.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/017.yaml
  text: All unrighteousness is sin[b][a], and there is sin not leading to death.
translation:
  language: vi
  text: Mọi sự bất chính đều là tội[a], và có tội không dẫn đến sự chết[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Mọi việc làm sai trái đều là tội” hoặc “Mọi điều bất công đều là tội.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “tội không đưa đến sự chết” hoặc, sát chữ hơn: “tội không hướng về sự chết.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶσα
  choice: Mọi
  rationale: 'Đi với danh từ số ít không có mạo từ ἀδικία, từ này mang ý bao quát: mọi điều hoặc mọi loại; “mọi” tự nhiên và giữ nguyên phạm vi phổ quát.'
- source_word: ἀδικία
  choice: điều bất chính
  rationale: Cách dịch này giữ được nghĩa luân lý–thần học rộng của từ Hy Lạp, đồng thời tự nhiên hơn trong tiếng Việt hiện đại; không thu hẹp nghĩa chỉ vào bất công xã hội hay pháp lý.
- source_word: ἁμαρτία
  choice: tội
  rationale: “Tội” là cách dịch chuẩn xác, gọn và tự nhiên cho cả hai lần xuất hiện của ἁμαρτία; việc lặp lại cùng một từ giữ rõ liên hệ trong câu.
- source_word: καὶ
  choice: và
  rationale: Giữ liên từ đơn giản của nguyên văn, nối mệnh đề khái quát với lời xác định tiếp theo mà không làm mạnh thêm sắc thái tương phản.
- source_word: οὐ πρὸς θάνατον
  choice: không dẫn đến sự chết
  rationale: Cụm πρὸς θάνατον diễn tả hướng đi hoặc kết quả; cách dịch này rõ ràng trong tiếng Việt hiện đại và phù hợp với thành ngữ trong câu trước.
- source_word: θάνατον
  choice: sự chết
  rationale: Dịch trực tiếp θάνατος và không xác định đó là cái chết thể lý, sự chết thuộc linh hay sự kết án chung cuộc.
theological_decisions:
- issue: Bản chất của “sự chết” trong cụm “tội không dẫn đến sự chết”
  choice: Chỉ dịch là “sự chết”, không thêm từ giải nghĩa
  alternative: cái chết thể lý; sự chết thuộc linh; sự kết án chung cuộc
  rationale: Nguyên văn chỉ có θάνατον và không xác định loại sự chết nào; giữ nguyên độ mở tránh giải quyết một vấn đề thần học ngay trong bản dịch.
- issue: Cách hiểu ἀδικία trong mệnh đề luân lý tổng quát
  choice: Dùng “điều bất chính” trong chính văn
  alternative: việc làm sai trái; điều bất công
  rationale: “Điều bất chính” thể hiện phạm vi luân lý–thần học rộng, không giới hạn vào hành vi riêng lẻ hoặc chỉ vào bất công giữa người với người.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “điều bất chính” để giữ chiều rộng của thuật ngữ đạo đức, và dùng “sự chết” nhằm bảo toàn tính trang trọng cũng như sự mơ hồ có chủ ý của nguyên văn.
