  terminology: «Lời chứng» giữ được trường nghĩa pháp chứng của μαρτυρία và sự lặp lại của bản gốc. «Đức Chúa Trời» và «Con Ngài» nhất quán với văn phong Kinh Thánh tiếng Việt; viết hoa «Con» phù hợp tham chiếu ngữ cảnh mà không áp đặt diễn giải vượt quá văn bản.
