  source_fidelity: 'Bản dịch phản ánh sát cấu trúc và ý nghĩa của SBLGNT: giả định «Nếu chúng ta tiếp nhận…», sự đối lập giữa lời chứng của loài người và của Đức Chúa Trời, tính so sánh của μείζων, cùng sự lặp lại nhấn mạnh của μαρτυρία. «Vì đây là lời chứng của Đức Chúa Trời: Ngài đã làm chứng về Con Ngài» diễn đạt hợp lý cách hiểu ὅτι thứ hai là mệnh đề nội dung; chú thích cũng bảo tồn cách hiểu nguyên nhân có thể có.'
