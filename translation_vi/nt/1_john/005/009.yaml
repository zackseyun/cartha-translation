id: 1JN.5.9
reference: 1 John 5:9
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εἰ τὴν μαρτυρίαν τῶν ἀνθρώπων λαμβάνομεν, ἡ μαρτυρία τοῦ θεοῦ μείζων ἐστίν, ὅτι αὕτη ἐστὶν ἡ μαρτυρία τοῦ θεοῦ ⸀ὅτι μεμαρτύρηκεν περὶ τοῦ υἱοῦ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/009.yaml
  text: 'If we receive the testimony of men[a], the testimony of God is greater[c][b], because this is the testimony of God: that he has testified concerning his Son.'
translation:
  language: vi
  text: 'Nếu chúng ta tiếp nhận lời chứng của loài người, thì lời chứng của Đức Chúa Trời còn lớn hơn, vì đây là lời chứng của Đức Chúa Trời: Ngài đã làm chứng về Con Ngài.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể hiểu vế cuối theo nghĩa nguyên nhân: “vì Ngài đã làm chứng về Con Ngài.”'
    reason: alternative_reading
lexical_decisions:
- source_word: μαρτυρίαν / μαρτυρία
  choice: lời chứng
  rationale: Giữ nguyên sự lặp lại có chủ ý trong câu và diễn đạt tự nhiên sắc thái chứng cứ/chứng nhận trong tiếng Việt.
- source_word: ἀνθρώπων
  choice: của loài người
  rationale: Danh từ số nhiều mang nghĩa khái quát, đối lập lời chứng của con người với lời chứng của Đức Chúa Trời; “loài người” vừa chính xác vừa không hàm ý chỉ nam giới.
- source_word: λαμβάνομεν
  choice: tiếp nhận
  rationale: Có thể chỉ việc nhận hoặc chấp nhận lời chứng; “tiếp nhận” giữ được độ rộng nghĩa mà không nhấn quá mức sự tin thuận.
- source_word: μείζων
  choice: còn lớn hơn
  rationale: Diễn đạt trực tiếp phép so sánh và làm rõ sự vượt trội của lời chứng Đức Chúa Trời so với lời chứng con người.
- source_word: αὕτη ἐστὶν ἡ μαρτυρία τοῦ θεοῦ
  choice: đây là lời chứng của Đức Chúa Trời
  rationale: Bảo tồn cấu trúc và sự lặp lại của nguyên văn.
- source_word: μεμαρτύρηκεν
  choice: đã làm chứng
  rationale: Thì hoàn thành Hy Lạp nói đến hành động đã xảy ra với hiệu lực còn tồn tại; tiếng Việt tự nhiên dùng “đã làm chứng”, còn ý nghĩa tiếp diễn được ngữ cảnh nâng đỡ.
- source_word: περὶ τοῦ υἱοῦ αὐτοῦ
  choice: về Con Ngài
  rationale: “Về” là cách diễn đạt hiện đại, trang trọng vừa phải cho περί với sở hữu từ chỉ về Đức Chúa Trời.
theological_decisions:
- issue: Chức năng của ὅτι thứ hai
  choice: 'Mệnh đề nêu nội dung: “Ngài đã làm chứng về Con Ngài”'
  alternative: 'Mệnh đề nguyên nhân: “vì Ngài đã làm chứng về Con Ngài”'
  rationale: Sau câu “đây là lời chứng của Đức Chúa Trời”, cách hiểu tự nhiên hơn là mệnh đề tiếp theo nêu nội dung hoặc đặc điểm của lời chứng. Tuy nhiên, ὅτι cũng có thể mang nghĩa nguyên nhân, nên ghi nhận phương án ấy trong chú thích.
- issue: Phạm vi nghĩa của ἀνθρώπων
  choice: loài người
  alternative: người ta; con người
  rationale: Từ Hy Lạp chỉ con người nói chung trong thế đối lập với Đức Chúa Trời, không riêng nam giới; “loài người” làm rõ sự đối lập tập thể này mà không thêm nét nghĩa giáo phái.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Chúa Trời” và viết hoa “Con” theo quy ước chỉ danh trong ngữ cảnh. Dấu hai chấm thể hiện cách hiểu ὅτι thứ hai là mệnh đề nêu nội dung; chú thích bảo tồn cách hiểu nguyên nhân có thể có.
