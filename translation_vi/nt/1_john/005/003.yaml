source:
  edition: SBLGNT
  text: αὕτη γάρ ἐστιν ἡ ἀγάπη τοῦ θεοῦ ἵνα τὰς ἐντολὰς αὐτοῦ τηρῶμεν, καὶ αἱ ἐντολαὶ αὐτοῦ βαρεῖαι οὐκ εἰσίν,
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/003.yaml
  text: 'For this is the love of God: that we keep his commandments[a], and his commandments are not burdensome.'
translation:
  language: vi
  text: Vì yêu kính Đức Chúa Trời là vâng giữ các điều răn của Ngài,[a] và các điều răn của Ngài không nặng nề.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cụm từ Hy Lạp cũng có thể được hiểu là “tình yêu của Đức Chúa Trời,” tức tình yêu phát xuất từ Ngài, như tình yêu Ngài dành cho con người; tuy nhiên, văn cảnh trực tiếp nghiêng về nghĩa tình yêu dành cho Đức Chúa Trời.
    reason: alternative_reading
lexical_decisions:
- source_word: αὕτη γάρ ἐστιν
  choice: Vì ... là
  rationale: Diễn đạt tự nhiên cấu trúc giải thích, trong đó γάρ nối câu này với ý trước và αὕτη hướng tới mệnh đề nêu nội dung theo sau.
- source_word: ἡ ἀγάπη τοῦ θεοῦ
  choice: yêu kính Đức Chúa Trời
  rationale: Ngữ cảnh gần, đặc biệt câu 2–3, nghiêng về tình yêu hướng đến Đức Chúa Trời. “Yêu kính” tự nhiên trong tiếng Việt khi nói về lòng yêu mến đi cùng sự tôn kính và vâng phục; chú thích vẫn ghi nhận khả năng hiểu là tình yêu đến từ Đức Chúa Trời.
- source_word: ἵνα
  choice: là
  rationale: Ở đây ἵνα giới thiệu nội dung hoặc cách biểu hiện của tình yêu, chứ không đơn thuần chỉ mục đích; tiếng Việt tự nhiên có thể dùng “là” trước cụm động từ.
- source_word: τὰς ἐντολὰς αὐτοῦ
  choice: các điều răn của Ngài
  rationale: “Điều răn” giữ được sắc thái có thẩm quyền của ἐντολή và là cách nói quen thuộc, trang trọng trong văn cảnh Kinh Thánh.
- source_word: τηρῶμεν
  choice: vâng giữ
  rationale: Kết hợp “vâng” và “giữ” truyền đạt cả việc tuân theo lẫn bền lòng gìn giữ, phù hợp cách dùng τηρέω đối với các điều răn trong văn chương Giăng.
- source_word: βαρεῖαι οὐκ εἰσίν
  choice: không nặng nề
  rationale: Giữ hình ảnh cơ bản của βαρεῖαι đồng thời diễn đạt rõ ý không gây thành gánh nặng khó mang.
theological_decisions:
- issue: Ý nghĩa sở hữu cách trong ἡ ἀγάπη τοῦ θεοῦ
  choice: 'Tình yêu của tín hữu hướng đến Đức Chúa Trời: “yêu kính Đức Chúa Trời”'
  alternative: Tình yêu đến từ Đức Chúa Trời hoặc tình yêu Đức Chúa Trời dành cho con người
  rationale: Câu trước liên kết việc yêu Đức Chúa Trời với thực hành các điều răn, còn câu này định nghĩa tình yêu ấy bằng sự vâng giữ. Vì tiếng Việt không thể giữ nguyên sự mơ hồ bằng cụm “tình yêu của Đức Chúa Trời” mà không dễ nghiêng sang nghĩa chủ thể, bản dịch chính chọn cách hiểu được ngữ cảnh gần ủng hộ và ghi cách hiểu kia trong chú thích.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “Đức Chúa Trời” và đại từ tôn kính “Ngài”; tránh lối văn cổ. Dấu chú thích [a] được đặt ngay sau mệnh đề liên quan.
