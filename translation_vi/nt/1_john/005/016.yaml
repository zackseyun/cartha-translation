id: 1JN.5.16
reference: 1 John 5:16
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐάν τις ἴδῃ τὸν ἀδελφὸν αὐτοῦ ἁμαρτάνοντα ἁμαρτίαν μὴ πρὸς θάνατον, αἰτήσει, καὶ δώσει αὐτῷ ζωήν, τοῖς ἁμαρτάνουσιν μὴ πρὸς θάνατον. ἔστιν ἁμαρτία πρὸς θάνατον· οὐ περὶ ἐκείνης λέγω ἵνα ἐρωτήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/016.yaml
  text: If anyone sees his brother committing a sin not leading to death[a], he shall ask, and God will give him life—to those committing sins not leading to death. There is sin leading to death[c][b]; I am not saying that he should ask about that.
translation:
  language: vi
  text: Nếu ai thấy người anh em của mình phạm một tội không dẫn đến sự chết[a], người ấy hãy cầu xin, và Đức Chúa Trời sẽ ban sự sống cho người đó—tức là cho những người phạm tội không dẫn đến sự chết. Có tội dẫn đến sự chết; tôi không nói rằng người ấy phải cầu xin về tội đó.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn không cho biết “sự chết” ở đây là sự chết thể xác, sự chết thuộc linh hay sự kết án cuối cùng.
    reason: Giữ lại sự mơ hồ thần học quan trọng của cụm πρὸς θάνατον.
lexical_decisions:
- source_word: ἀδελφὸν
  choice: anh em mình
  rationale: Trong văn cảnh cộng đồng tín hữu, ἀδελφός chỉ một người cùng đức tin. “Anh em mình” tự nhiên trong tiếng Việt và không buộc phải xác định người ấy là anh hay em ruột.
- source_word: ἁμαρτάνοντα ἁμαρτίαν
  choice: phạm một tội
  rationale: Cách diễn đạt này chuyển tải tự nhiên cấu trúc phân từ đi với đối cách đồng căn, đồng thời giữ tính cụ thể của hành vi phạm tội.
- source_word: μὴ πρὸς θάνατον
  choice: không dẫn đến sự chết
  rationale: “Dẫn đến” thể hiện hướng đi hoặc kết quả hàm chứa trong πρός, còn “sự chết” giữ nguyên sự mơ hồ của nguyên văn.
- source_word: αἰτήσει
  choice: người ấy hãy cầu xin
  rationale: Thì tương lai có thể mang lực mệnh lệnh trong văn cảnh. “Cầu xin” làm rõ đây là lời thỉnh cầu hướng đến Đức Chúa Trời.
- source_word: δώσει αὐτῷ ζωήν
  choice: Đức Chúa Trời sẽ ban sự sống cho người đó
  rationale: Nguyên văn không nêu chủ ngữ, nhưng văn cảnh cầu nguyện cho thấy Đức Chúa Trời là Đấng ban sự sống. “Sự sống” không bị thu hẹp thành một loại sự sống cụ thể.
- source_word: τοῖς ἁμαρτάνουσιν μὴ πρὸς θάνατον
  choice: tức là cho những người phạm tội không dẫn đến sự chết
  rationale: Cụm giải thích sau dấu gạch ngang phản ánh số nhiều của phân từ và giúp câu khó về cú pháp trở nên rõ ràng mà không tái cấu trúc quá mức.
- source_word: ἔστιν ἁμαρτία πρὸς θάνατον
  choice: Có tội dẫn đến sự chết
  rationale: Không thêm mạo từ tương đương với “một” nhằm giữ cách nói ngắn gọn, không xác định của cấu trúc vô mạo từ trong tiếng Hy Lạp.
- source_word: οὐ περὶ ἐκείνης λέγω ἵνα ἐρωτήσῃ
  choice: tôi không nói rằng người ấy phải cầu xin về tội đó
  rationale: “Cầu xin” giữ văn cảnh cầu nguyện; “về tội đó” diễn đạt rõ sở chỉ giống cái của ἐκείνης là ἁμαρτία.
theological_decisions:
- issue: Ý nghĩa của “sự chết” trong cụm “tội dẫn đến sự chết”
  choice: Giữ nguyên từ “sự chết” mà không xác định đó là sự chết thể xác, thuộc linh hay sự kết án cuối cùng.
  alternative: Diễn giải thành sự chết thể xác do phán xét, sự chết thuộc linh/đời đời, hoặc sự kết án cánh chung.
  rationale: Câu này không định nghĩa bản chất của sự chết; việc giữ nguyên sự mơ hồ bảo toàn căng thẳng thần học của nguyên văn.
- issue: Chủ thể ban sự sống
  choice: Nêu rõ Đức Chúa Trời là Đấng ban sự sống.
  alternative: Giữ đại từ “người ấy sẽ ban” hoặc hiểu người cầu xin là chủ thể.
  rationale: Dù chủ ngữ của δώσει bị lược, văn cảnh thỉnh cầu cho thấy sự sống là điều Đức Chúa Trời ban; cách dịch này tránh khiến độc giả hiểu người cầu nguyện tự mình ban sự sống.
- issue: Mức độ của lời nói về việc cầu xin cho tội dẫn đến sự chết
  choice: Dịch “tôi không nói rằng người ấy phải cầu xin”, không biến câu này thành một lệnh cấm rõ rệt.
  alternative: Dịch “tôi nói người ấy không được cầu xin” hoặc “đừng cầu xin”.
  rationale: οὐ phủ định λέγω hơn là trực tiếp đặt một mệnh lệnh cấm cầu xin; bản dịch giữ sự dè dặt của nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh em mình” theo lối xưng gọi cộng đồng đức tin; “cầu xin” duy trì văn cảnh cầu nguyện. Dấu gạch ngang giới thiệu phần giải thích của cụm số nhiều trong nguyên văn.
