  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Τεκνία, φυλάξατε ἑαυτὰ ἀπὸ τῶν ⸀εἰδώλων.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/021.yaml
  text: Little children[a], guard yourselves from idols.
translation:
  language: vi
  text: Hỡi các con bé nhỏ[a], hãy giữ mình khỏi các thần tượng.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “Các con” hoặc “Các con thân yêu.” Từ Hy Lạp là một từ giảm nhẹ mang sắc thái trìu mến, được Giăng dùng khi trực tiếp xưng hô.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τεκνία
  choice: Hỡi các con bé nhỏ
  rationale: Đây là dạng hô cách số nhiều, mang sắc thái trìu mến của τεκνίον. Cách dịch này giữ hình ảnh gia đình và sắc thái âu yếm; “hỡi” làm rõ lời gọi trực tiếp trong tiếng Việt.
- source_word: φυλάξατε
  choice: hãy giữ
  rationale: Động từ mệnh lệnh aorist, ngôi thứ hai số nhiều, kêu gọi sự cảnh giác dứt khoát. “Hãy giữ mình” là cách nói tự nhiên, gọn và thể hiện hành động chủ động đề phòng.
- source_word: ἑαυτὰ
  choice: mình
  rationale: Đại từ phản thân làm tân ngữ; trong kết cấu “giữ mình”, tiếng Việt diễn đạt tự nhiên đầy đủ ý “chính anh em” mà không cần thêm từ.
- source_word: ἀπὸ
  choice: khỏi
  rationale: Giới từ chỉ sự tách lìa hoặc tránh xa. “Khỏi” kết hợp tự nhiên với “giữ mình” và giữ đúng ý tránh xa.
- source_word: εἰδώλων
  choice: các thần tượng
  rationale: εἴδωλον chỉ tượng thần hoặc đối tượng thờ phượng sai lạc. “Thần tượng” là thuật ngữ rõ, quen thuộc trong văn cảnh Kinh Thánh; không mở rộng thành bất cứ điều gì chiếm chỗ của Đức Chúa Trời.
theological_decisions:
- issue: Phạm vi nghĩa của “các thần tượng”
  choice: Dịch cụ thể là “các thần tượng”, không diễn giải rộng.
  alternative: “bất cứ điều gì trở thành thần tượng” hoặc “sự thờ phượng sai lạc”
  rationale: Nguyên văn trực tiếp nói đến các thần tượng. Dù lời cảnh báo có thể hàm ý rộng hơn về mọi hình thức thờ hình tượng, bản dịch không nên đưa phần suy diễn ấy vào chính câu văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và có sắc thái mục vụ trìu mến. “Hỡi” được dùng vừa phải để biểu thị hô cách; “giữ mình khỏi” là cách diễn đạt tự nhiên, dễ hiểu trong tiếng Việt chuẩn.
