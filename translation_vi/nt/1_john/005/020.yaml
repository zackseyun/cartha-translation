id: 1JN.5.20
reference: 1 John 5:20
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οἴδαμεν δὲ ὅτι ὁ υἱὸς τοῦ θεοῦ ἥκει, καὶ δέδωκεν ἡμῖν διάνοιαν ἵνα ⸀γινώσκωμεν τὸν ἀληθινόν· καὶ ἐσμὲν ἐν τῷ ἀληθινῷ, ἐν τῷ υἱῷ αὐτοῦ Ἰησοῦ Χριστῷ. οὗτός ἐστιν ὁ ἀληθινὸς θεὸς καὶ ζωὴ αἰώνιος.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/020.yaml
  text: And we know that the Son of God has come and has given us understanding so that we may know the True One; and we are in the True One[a], in his Son Jesus the Messiah. This one is the true God and eternal life.
translation:
  language: vi
  text: Chúng ta biết rằng Con Đức Chúa Trời đã đến và đã ban cho chúng ta sự hiểu biết để chúng ta nhận biết Đấng Chân Thật; và chúng ta ở trong Đấng Chân Thật, trong Con Ngài là Đức Giê-su, Đấng Mê-si. Chính Đấng này là Đức Chúa Trời chân thật và là sự sống đời đời.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Đấng này” có thể chỉ Đức Giê-su, Đấng Mê-si; tuy nhiên, một số người hiểu từ này chỉ “Đấng Chân Thật,” tức Đức Chúa Cha, trong mệnh đề trước.
    reason: alternative_reading
lexical_decisions:
- source_word: οἴδαμεν
  choice: chúng ta biết
  rationale: Dạng hoàn thành οἶδα có nghĩa trạng thái ở hiện tại, diễn tả sự nhận biết chắc chắn.
- source_word: ἥκει
  choice: đã đến
  rationale: Diễn tả việc Con Đức Chúa Trời đã đến và hiện diện; cách dịch này tự nhiên và giữ được kết quả hiện tại của hành động.
- source_word: δέδωκεν
  choice: đã ban cho
  rationale: Thì hoàn thành cho thấy điều đã được ban vẫn có hiệu lực; “ban” phù hợp với văn phong nói về ân tứ từ Đức Chúa Trời.
- source_word: διάνοιαν
  choice: sự hiểu biết
  rationale: Trong ngữ cảnh, từ này chỉ năng lực hiểu và nhận ra chân lý, không chỉ đơn thuần là tâm trí.
- source_word: ἵνα γινώσκωμεν
  choice: để chúng ta nhận biết
  rationale: Giữ rõ ý mục đích của ἵνα và sắc thái nhận biết mang tính tương giao của γινώσκω.
- source_word: τὸν ἀληθινόν / τῷ ἀληθινῷ
  choice: Đấng Chân Thật
  rationale: Tính từ được dùng như danh từ để chỉ một thân vị; lặp lại cùng một cách gọi nhằm giữ phép lặp của nguyên văn.
- source_word: ἐσμὲν ἐν
  choice: chúng ta ở trong
  rationale: Dịch trực tiếp ngôn ngữ tương giao đặc trưng của Giăng, không thêm ý “ở lại” hay diễn giải thành “hiệp nhất”.
- source_word: ἐν τῷ υἱῷ αὐτοῦ
  choice: ở trong Con Ngài
  rationale: Giữ giới từ “ở trong” và quan hệ sở hữu của nguyên văn bằng cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: Ἰησοῦ Χριστῷ
  choice: Đức Giê-su, Đấng Mê-si
  rationale: Χριστός mang giá trị tước hiệu; “Đấng Mê-si” vừa làm rõ tước hiệu vừa có văn phong trang trọng, quen thuộc.
- source_word: οὗτός
  choice: Chính Đấng này
  rationale: Giữ lực chỉ định của đại từ Hy Lạp và không biến nó thành một đại từ nhân xưng vốn có thể che khuất vấn đề quy chiếu.
- source_word: ὁ ἀληθινὸς θεὸς
  choice: Đức Chúa Trời chân thật
  rationale: Cách diễn đạt chuẩn, tự nhiên, giữ nguyên ý vị ngữ của cụm từ Hy Lạp.
- source_word: ζωὴ αἰώνιος
  choice: sự sống đời đời
  rationale: Cách dịch quen thuộc và chính xác trong văn liệu Giăng, bao hàm cả tính trường tồn lẫn phẩm chất của sự sống.
theological_decisions:
- issue: Đối tượng mà οὗτός trong mệnh đề cuối chỉ đến
  choice: Dịch “Chính Đấng này” để cho phép cách hiểu gần nhất là Đức Giê-su, Đấng Mê-si, nhưng không xác quyết quá mức.
  alternative: Đại từ có thể chỉ về “Đấng Chân Thật,” tức Đức Chúa Cha, được nhắc ở mệnh đề trước.
  rationale: Theo cú pháp, đối tượng có danh xưng gần nhất là “Con Ngài, là Đức Giê-su, Đấng Mê-si,” nên cách quy chiếu về Con là tự nhiên. Tuy vậy, mạch văn cũng cho phép một số người hiểu đại từ quay lại “Đấng Chân Thật.” Bản dịch và chú thích giữ nguyên sự căng thẳng giải nghĩa này.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Duy trì lối nói “ở trong” đặc trưng của Giăng; dùng “Đấng Chân Thật” nhất quán và “Đấng Mê-si” như một tước hiệu. Dấu chú thích [a] được đặt ngay sau mệnh đề có vấn đề quy chiếu.
