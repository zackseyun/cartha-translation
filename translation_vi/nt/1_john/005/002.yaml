  source_fidelity: 'Bản dịch chuyển tải đầy đủ các thành tố chính của câu Hy Lạp: căn cứ nhận biết (ἐν τούτῳ), việc biết (γινώσκομεν), yêu con cái Đức Chúa Trời, và mệnh đề ὅταν với hai động từ giả định hiện tại. Tuy nhiên, “ấy là khi” hơi diễn giải và nặng tính giải thích hơn cấu trúc đơn giản “khi” của nguyên văn.'
