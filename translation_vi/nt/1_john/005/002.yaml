  rationale: 'Chỉnh câu cho tự nhiên hơn và sát cấu trúc Hy Lạp hơn: thay “Qua” bằng “Nhờ,” “nhận biết” bằng “biết,” lược chủ ngữ lặp lại, và thay “ấy là khi” bằng “khi”. Giữ “làm theo” vì đây là cách diễn đạt Việt ngữ thông dụng, đồng thời chú thích bảo toàn sự phân biệt từ vựng giữa ποιέω và τηρέω.'
