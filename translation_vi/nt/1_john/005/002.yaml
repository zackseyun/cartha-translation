source:
  edition: SBLGNT
  text: ἐν τούτῳ γινώσκομεν ὅτι ἀγαπῶμεν τὰ τέκνα τοῦ θεοῦ, ὅταν τὸν θεὸν ἀγαπῶμεν καὶ τὰς ἐντολὰς αὐτοῦ ⸀ποιῶμεν·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/002.yaml
  text: 'By this we know that we love the children of God: when we love God and keep his commandments[a].'
translation:
  language: vi
  text: 'Nhờ điều này, chúng ta biết rằng mình yêu con cái Đức Chúa Trời: khi chúng ta yêu Đức Chúa Trời và làm theo các điều răn của Ngài.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “thực hành các điều răn của Ngài” hoặc “vâng theo các điều răn của Ngài”. Động từ Hy Lạp ở đây có nghĩa đen là “làm” (ποιῶμεν), không phải động từ τηρέω, thường được dịch là “tuân giữ”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: Qua điều này
  rationale: Giữ lực chỉ định của cụm từ và diễn đạt tự nhiên trong tiếng Việt về dấu hiệu hoặc căn cứ để nhận biết.
- source_word: γινώσκομεν
  choice: chúng ta nhận biết
  rationale: Diễn đạt thì hiện tại và lối dùng quen thuộc của Giăng, nhấn mạnh sự nhận ra mà không thêm ý về tiến trình hay mức độ chắc chắn.
- source_word: ἀγαπῶμεν
  choice: chúng ta yêu
  rationale: Dùng động từ phổ thông, trực tiếp và nhất quán cho ἀγαπάω.
- source_word: τὰ τέκνα τοῦ θεοῦ
  choice: con cái Đức Chúa Trời
  rationale: Phản ánh nghĩa bao quát của τέκνα và giữ cách nói thuộc về Đức Chúa Trời.
- source_word: ὅταν
  choice: ấy là khi
  rationale: Giữ sắc thái thời gian–điều kiện của ὅταν với động từ giả định hiện tại, đồng thời nối tự nhiên với mệnh đề giải thích phía trước.
- source_word: τὰς ἐντολὰς αὐτοῦ ποιῶμεν
  choice: làm theo các điều răn của Ngài
  rationale: ποιῶμεν có nghĩa cơ bản là “làm”; “làm theo” vừa tự nhiên trong tiếng Việt vừa tránh đồng nhất nó hoàn toàn với động từ τηρέω thường được dịch là “tuân giữ”.
theological_decisions:
- issue: Mối liên hệ giữa việc yêu con cái Đức Chúa Trời với việc yêu Đức Chúa Trời và làm theo các điều răn
  choice: Giữ nguyên cấu trúc trong đó tình yêu đối với con cái Đức Chúa Trời được nhận biết khi chúng ta yêu Đức Chúa Trời và làm theo các điều răn của Ngài.
  alternative: Diễn giải đây riêng là bằng chứng, nguyên nhân, hoặc định nghĩa của tình yêu đối với các tín hữu.
  rationale: Câu Hy Lạp nêu một tiêu chuẩn cô đọng nhưng không xác định dứt khoát quan hệ ấy là thuần túy bằng chứng, nguyên nhân hay định nghĩa; bản dịch không giải quyết thay cho nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cụm “ấy là khi” giữ phép nối giải thích cùng độ căng hợp lý của lập luận; “làm theo” tự nhiên hơn “làm các điều răn” nhưng vẫn phản ánh ποιέω.
