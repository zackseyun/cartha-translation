  terminology: “Con cái Đức Chúa Trời,” “yêu,” và “các điều răn của Ngài” phù hợp. “Làm theo các điều răn” là cách nói tiếng Việt tự nhiên cho ποιῶμεν, đồng thời chú thích cần nêu rõ rằng động từ gốc là “làm,” không phải τηρέω.
  issues:
