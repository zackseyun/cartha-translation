id: 1JN.5.5
reference: 1 John 5:5
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: τίς ⸂δέ ἐστιν⸃ ὁ νικῶν τὸν κόσμον εἰ μὴ ὁ πιστεύων ὅτι Ἰησοῦς ἐστιν ὁ υἱὸς τοῦ θεοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/005.yaml
  text: And who is the one who overcomes the world except the one who believes that Jesus is the Son of God?[a]
translation:
  language: vi
  text: Và ai là người chiến thắng thế gian, nếu không phải là người tin rằng Giê-su là Con Đức Chúa Trời?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hy Lạp dùng hai phân từ giống đực số ít, theo nghĩa đại diện: “người chiến thắng … người tin”; lời này không chỉ nói về nam giới.'
    reason: Làm rõ hình thức ngữ pháp và lực đại diện của hai phân từ Hy Lạp.
lexical_decisions:
- source_word: τίς
  choice: ai
  rationale: Đại từ nghi vấn mở đầu một câu hỏi tu từ; “ai” tự nhiên và giữ nguyên sức hỏi của câu Hy Lạp.
- source_word: δέ
  choice: và
  rationale: Ở đây δέ nối nhẹ câu này với ý trước, không nhất thiết biểu thị sự tương phản mạnh; “và” giữ được tính liên tục.
- source_word: ὁ νικῶν
  choice: người chiến thắng
  rationale: Phân từ hiện tại có mạo từ được dùng như danh từ, chỉ người có đặc trưng chiến thắng; cách dịch này tự nhiên trong tiếng Việt và không giới hạn giới tính.
- source_word: τὸν κόσμον
  choice: thế gian
  rationale: “Thế gian” phù hợp với cách dùng κόσμος trong văn chương Giăng, nơi từ này thường chỉ thế giới loài người hoặc trật tự chống nghịch Đức Chúa Trời, nhưng không diễn giải thêm quá điều bản văn nói.
- source_word: εἰ μὴ
  choice: nếu không phải là
  rationale: Trong cấu trúc câu hỏi tu từ này, cụm từ mang nghĩa loại trừ, tương đương “ngoại trừ”; cách diễn đạt được chọn tự nhiên hơn trong câu tiếng Việt.
- source_word: ὁ πιστεύων
  choice: người tin
  rationale: Phân từ hiện tại có mạo từ được dùng như danh từ; “người tin” giữ được tính chất hành động của động từ thay vì biến thành một nhãn gọi thuần túy.
- source_word: ὅτι
  choice: rằng
  rationale: ὅτι giới thiệu nội dung của niềm tin, chứ không phải nguyên nhân.
- source_word: Ἰησοῦς
  choice: Giê-su
  rationale: Phiên âm tên riêng theo cách viết tiếng Việt hiện đại, không thêm tước hiệu vốn không có tại vị trí này trong nguyên văn.
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: Con Đức Chúa Trời
  rationale: Giữ trực tiếp tước hiệu Cơ Đốc học và nội dung tuyên xưng của nguyên văn, không mở rộng hay giản lược.
theological_decisions:
- issue: Cách chuyển hai phân từ giống đực số ít ὁ νικῶν và ὁ πιστεύων
  choice: người chiến thắng / người tin
  alternative: người nam chiến thắng / người nam tin; kẻ chiến thắng / kẻ tin
  rationale: Các dạng giống đực số ít trong tiếng Hy Lạp có lực đại diện, không giới hạn phát biểu vào nam giới. Danh từ “người” trong tiếng Việt vừa tự nhiên vừa bảo toàn phạm vi bao quát ấy.
- issue: Lời tuyên xưng ὁ υἱὸς τοῦ θεοῦ
  choice: Con Đức Chúa Trời
  alternative: Con của Đức Chúa Trời
  rationale: Cách dịch được chọn giữ sắc thái tước hiệu trang trọng và cô đọng, đồng thời không thêm nội dung thần học ngoài bản văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Thế gian” được giữ vì phù hợp với ngữ vực của các thư Giăng; “Giê-su” không kèm tước hiệu “Chúa” vì nguyên văn tại đây chỉ có tên riêng.
