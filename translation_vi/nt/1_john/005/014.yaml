id: 1JN.5.14
reference: 1 John 5:14
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ αὕτη ἐστὶν ἡ παρρησία ἣν ἔχομεν πρὸς αὐτόν, ὅτι ἐάν τι αἰτώμεθα κατὰ τὸ θέλημα αὐτοῦ ἀκούει ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/014.yaml
  text: 'And this is the confidence that we have before him: that if we ask anything according to his will[a], he hears us.'
translation:
  language: vi
  text: 'Và đây là sự vững lòng[a] chúng ta có trước Ngài: nếu chúng ta cầu xin điều gì theo ý muốn của Ngài, thì Ngài nghe chúng ta.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Sự vững lòng” cũng có thể dịch là “sự mạnh dạn” hoặc “sự tin chắc.”
    reason: lexical_alternative
lexical_decisions:
- source_word: παρρησία
  choice: sự vững lòng
  rationale: Trong văn mạch của Giăng, từ này chỉ sự tự tin và tự do đến gần Đức Chúa Trời. “Sự vững lòng” tự nhiên trong tiếng Việt và tránh hiểu đơn thuần là sự táo bạo công khai.
- source_word: πρὸς αὐτόν
  choice: trước Ngài
  rationale: Diễn đạt hướng tương quan và sự hiện diện khi cầu nguyện; tự nhiên hơn cách dịch sát chữ “hướng về Ngài”.
- source_word: ὅτι
  choice: ':'
  rationale: Ở đây ὅτι giới thiệu nội dung của sự vững lòng; dấu hai chấm chuyển tải chức năng ấy rõ ràng và tự nhiên trong tiếng Việt.
- source_word: ἐάν τι αἰτώμεθα
  choice: nếu chúng ta cầu xin điều gì
  rationale: Giữ nguyên tính điều kiện khái quát và phạm vi mở của τι.
- source_word: κατὰ τὸ θέλημα αὐτοῦ
  choice: theo ý muốn của Ngài
  rationale: Phản ánh chuẩn mực hay sự phù hợp được κατά diễn tả, đồng thời giữ sức nặng thần học của θέλημα.
- source_word: ἀκούει ἡμῶν
  choice: Ngài nghe chúng ta
  rationale: Cách nói gọn, tự nhiên trong ngữ cảnh cầu nguyện; không diễn giải quá mức thành “đáp lời” hoặc “ban điều cầu xin”.
theological_decisions:
- issue: Ý nghĩa của việc Đức Chúa Trời nghe lời cầu nguyện
  choice: “Ngài nghe chúng ta” được giữ theo nghĩa Ngài nghe và lưu tâm đến lời cầu nguyện.
  alternative: “Ngài đáp lời chúng ta” hoặc “Ngài ban điều chúng ta cầu xin”.
  rationale: Câu này khẳng định việc Ngài nghe những lời cầu xin hợp với ý muốn Ngài, nhưng không tự nó nói rằng mọi điều xin đều được ban ngay; câu tiếp theo mới triển khai hệ quả.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Đại từ “Ngài” giữ sắc thái tôn kính; cấu trúc câu bám sát lập luận Hy Lạp mà vẫn tự nhiên.
