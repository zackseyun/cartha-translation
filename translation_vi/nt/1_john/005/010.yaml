  source_fidelity: 'Bản dịch nhìn chung chuyển đạt đúng cấu trúc và ý nghĩa của bản SBLGNT: πιστεύειν εἰς được phân biệt với πιστεύειν τῷ θεῷ, ἐν αὑτῷ quy chiếu người tin, và mệnh đề ὅτι giải thích việc không tin là không tin lời chứng Đức Chúa Trời đã làm chứng về Con Ngài. Tuy nhiên, “đã coi Ngài là kẻ nói dối” phản ánh trực tiếp và tự nhiên hơn lực thành ngữ của ψεύστην πεποίηκεν αὐτόν so với “đã cho rằng.” Chú thích dị bản cần nói đúng dị bản “trong Ngài,” không phải “trong người ấy.”'
