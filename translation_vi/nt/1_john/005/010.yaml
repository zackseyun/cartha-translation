id: 1JN.5.10
reference: 1 John 5:10
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὁ πιστεύων εἰς τὸν υἱὸν τοῦ θεοῦ ἔχει τὴν μαρτυρίαν ἐν ⸀αὑτῷ· ὁ μὴ πιστεύων τῷ θεῷ ψεύστην πεποίηκεν αὐτόν, ὅτι οὐ πεπίστευκεν εἰς τὴν μαρτυρίαν ἣν μεμαρτύρηκεν ὁ θεὸς περὶ τοῦ υἱοῦ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/010.yaml
  text: The one who believes in the Son of God has the testimony in himself[a]; the one who does not believe God has made him a liar[b], because he has not believed the testimony that God has testified about his Son.
translation:
  language: vi
  text: Ai tin nơi Con Đức Chúa Trời thì có lời chứng ấy trong chính mình[a]. Còn ai không tin Đức Chúa Trời thì đã coi Ngài là kẻ nói dối[b], vì người ấy không tin lời chứng mà Đức Chúa Trời đã làm chứng về Con Ngài.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Một số thủ bản chép “trong Ngài” thay vì “trong chính mình”; cách đọc này có thể được hiểu là lời chứng ở trong Người Con.
    reason: textual_variant
  - marker: b
    text: 'Sát nghĩa hơn: “đã làm Ngài thành kẻ nói dối”; nghĩa là người bác bỏ lời chứng của Đức Chúa Trời coi Ngài như thể Ngài nói sai.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ πιστεύων
  choice: Ai tin
  rationale: Phân từ hiện tại có mạo từ được dùng như danh từ, chỉ bất cứ người nào tin; “Ai tin” tự nhiên trong tiếng Việt và giữ ý khái quát.
- source_word: εἰς τὸν υἱὸν τοῦ θεοῦ
  choice: tin Con Đức Chúa Trời
  rationale: Với πιστεύω, εἰς diễn tả đức tin hay sự tin cậy hướng đến một người. Tiếng Việt không cần thêm giới từ sau “tin”.
- source_word: τὴν μαρτυρίαν
  choice: lời chứng ấy
  rationale: “Lời chứng” giữ được sắc thái làm chứng và nội dung được xác nhận; “ấy” cho thấy đây là lời chứng đang được nói đến trong văn cảnh.
- source_word: ἐν αὑτῷ
  choice: trong chính mình
  rationale: Đại từ phản thân quy chiếu tự nhiên về người tin và nhấn mạnh rằng người ấy có lời chứng ở bên trong mình.
- source_word: ὁ μὴ πιστεύων τῷ θεῷ
  choice: ai không tin Đức Chúa Trời
  rationale: Tặng cách sau πιστεύω ở đây có nghĩa không chấp nhận điều Đức Chúa Trời phán là thật, chứ không đơn thuần là không tin Ngài hiện hữu; mệnh đề sau giải thích rõ điều này.
- source_word: ψεύστην πεποίηκεν αὐτόν
  choice: đã cho rằng Ngài là kẻ nói dối
  rationale: 'Cách nói này truyền đạt thành ngữ Hy Lạp: việc bác bỏ lời chứng của Đức Chúa Trời đồng nghĩa với việc xem Ngài là kẻ nói dối. “Đã” phản ánh kết quả hiện còn của thì hoàn thành.'
- source_word: οὐ πεπίστευκεν
  choice: không tin
  rationale: Trong tiếng Việt, hình thái hiện tại “không tin” tự nhiên hơn nhưng vẫn diễn tả tình trạng không tin đang tiếp diễn do thì hoàn thành Hy Lạp.
- source_word: ἣν μεμαρτύρηκεν ὁ θεὸς
  choice: mà Đức Chúa Trời đã làm chứng
  rationale: Giữ sự lặp từ có chủ ý giữa danh từ “lời chứng” và động từ “làm chứng” trong nguyên văn.
- source_word: περὶ τοῦ υἱοῦ αὐτοῦ
  choice: về Con Ngài
  rationale: περί với sở hữu cách mang nghĩa “về, liên quan đến”; “Con Ngài” trang trọng, gọn và giữ đúng quan hệ sở hữu.
theological_decisions:
- issue: Đối tượng quy chiếu của “trong chính mình”
  choice: Lời chứng ở trong chính người tin.
  alternative: Lời chứng ở trong Ngài, có thể hiểu là ở trong Người Con, theo một dị bản.
  rationale: Bản SBLGNT được cung cấp đọc ἐν αὑτῷ, là đại từ phản thân và quy chiếu tự nhiên về người tin vừa được nhắc đến. Bản dịch không giải thích thêm bản chất của lời chứng vượt quá câu này.
- issue: Ý nghĩa của “không tin Đức Chúa Trời”
  choice: Không chấp nhận lời chứng của Đức Chúa Trời là thật.
  alternative: Nói chung là không tin Đức Chúa Trời hiện hữu hoặc không có đức tin nơi Ngài.
  rationale: Mệnh đề bắt đầu bằng ὅτι xác định sự không tin ở đây là không tin lời chứng Đức Chúa Trời đã làm chứng về Con Ngài.
- issue: Ý nghĩa của “làm Ngài thành kẻ nói dối”
  choice: Cho rằng Đức Chúa Trời là kẻ nói dối.
  alternative: 'Theo sát mặt chữ: làm cho Đức Chúa Trời trở thành kẻ nói dối.'
  rationale: 'Cấu trúc Hy Lạp diễn tả hậu quả hàm ý của việc bác bỏ lời chứng: người ấy đối xử với Đức Chúa Trời như thể Ngài nói sai. Bản dịch tránh hàm ý rằng con người thật sự có thể biến đổi bản tính của Đức Chúa Trời.'
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Chúa Trời” và đại từ tôn kính “Ngài”; giữ cặp từ “lời chứng/làm chứng” để phản ánh lối nhấn mạnh của tác giả. Các dấu chú thích được đặt đúng tại cụm từ mà từng chú thích giải thích.
