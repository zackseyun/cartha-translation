  terminology: “Đức Chúa Trời,” “Con,” “Ngài,” và cặp “lời chứng/làm chứng” nhất quán, phù hợp văn phong Kinh Thánh tiếng Việt. “Coi Ngài là kẻ nói dối” giữ ý nghĩa mà không hàm ý con người thực sự biến đổi Đức Chúa Trời thành kẻ nói dối.
