revisions:
- from: Chúng ta biết rằng ai đã được Đức Chúa Trời sinh ra thì không tiếp tục phạm tội[a]; trái lại, Đấng được Đức Chúa Trời sinh ra gìn giữ người ấy[b], và Kẻ Ác không đụng đến người ấy[c].
  to: Chúng ta biết rằng ai đã được Đức Chúa Trời sinh ra thì không cứ phạm tội[a]; trái lại, người đã được Đức Chúa Trời sinh ra gìn giữ người ấy[b], và Kẻ Ác không đụng đến người ấy[c].
  rationale: Sửa viết hoa “Đấng” thành “người” để chính văn không quyết định trước cách hiểu đang tranh luận về chủ ngữ của gìn giữ. Đổi “không tiếp tục phạm tội” thành “không cứ phạm tội” để diễn đạt tự nhiên hơn sắc thái hành vi dai dẳng mà bản dịch lựa chọn; chú thích vẫn bảo lưu bản dịch sát và sự thận trọng cần thiết.
