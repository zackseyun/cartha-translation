  terminology: “Đức Chúa Trời,” “gìn giữ,” và “Kẻ Ác” phù hợp với văn phong Cơ Đốc tiếng Việt. Không nên viết hoa “Đấng” ở đây, vì đó là một quyết định diễn giải về từ quy chiếu hơn là một đặc điểm được xác định trong nguyên văn.
  issues:
