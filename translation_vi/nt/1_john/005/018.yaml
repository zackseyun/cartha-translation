reference: 1 John 5:18
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Οἴδαμεν ὅτι πᾶς ὁ γεγεννημένος ἐκ τοῦ θεοῦ οὐχ ἁμαρτάνει, ἀλλ’ ὁ γεννηθεὶς ἐκ τοῦ θεοῦ τηρεῖ ⸀αὐτόν, καὶ ὁ πονηρὸς οὐχ ἅπτεται αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/018.yaml
  text: We know that everyone who has been born of God does not keep sinning[a]; rather, the one who was born of God keeps him[c][b], and the evil one does not touch him.
translation:
  language: vi
  text: Chúng ta biết rằng ai đã được Đức Chúa Trời sinh ra thì không cứ phạm tội[a]; trái lại, người đã được Đức Chúa Trời sinh ra gìn giữ người ấy[b], và Kẻ Ác không đụng đến người ấy[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch sát là “không phạm tội”. Thì hiện tại trong tiếng Hy Lạp ở đây có thể nói đến việc cứ tiếp tục phạm tội hoặc lấy tội lỗi làm nếp sống, chứ không nhất thiết khẳng định rằng người tin Chúa không bao giờ phạm một tội nào; xem 1 Giăng 1:8–10; 2:1.
    reason: aspect_and_cross_reference
  - marker: b
    text: Cũng có thể hiểu là “người được Đức Chúa Trời sinh ra tự giữ mình”. Tuy nhiên, nhiều người hiểu “người đã được Đức Chúa Trời sinh ra” ở đây là Chúa Giê-xu, Con Đức Chúa Trời, Đấng gìn giữ người tin.
    reason: alternative_reading
  - marker: c
    text: “Đụng đến” cũng có thể mang nghĩa nắm lấy nhằm gây hại.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἴδαμεν
  choice: Chúng ta biết
  rationale: Dạng hoàn thành οἶδα mang nghĩa trạng thái hiện tại; cách dịch này tự nhiên và chính xác trong tiếng Việt.
- source_word: πᾶς ὁ γεγεννημένος ἐκ τοῦ θεοῦ
  choice: ai đã được Đức Chúa Trời sinh ra
  rationale: πᾶς ὁ kết hợp với phân từ có nghĩa phân phối, chỉ bất cứ người nào thuộc nhóm ấy. Phân từ hoàn thành bị động nhấn mạnh tình trạng hiện tại do hành động sinh ra đã xảy ra.
- source_word: οὐχ ἁμαρτάνει
  choice: không tiếp tục phạm tội
  rationale: Thì hiện tại Hy Lạp có thể diễn tả hành động đang tiếp diễn hoặc thành nếp sống. Cách dịch này tránh biến câu thành lời khẳng định rằng tín hữu tuyệt đối không bao giờ phạm một tội nào, đồng thời vẫn giữ sức nặng đạo đức của nguyên văn.
- source_word: ἀλλ’
  choice: trái lại
  rationale: Diễn đạt rõ quan hệ tương phản và chuyển sang vế khẳng định.
- source_word: ὁ γεννηθεὶς ἐκ τοῦ θεοῦ
  choice: Đấng được Đức Chúa Trời sinh ra
  rationale: Giữ nguyên lối diễn đạt của tiếng Hy Lạp mà không đưa thẳng danh xưng Chúa Giê-xu hay Con Đức Chúa Trời vào chính văn. Viết hoa “Đấng” phản ánh cách hiểu có khả năng cao rằng câu nói về Con, trong khi chú thích vẫn nêu cách hiểu khác.
- source_word: τηρεῖ αὐτόν
  choice: gìn giữ người ấy
  rationale: τηρέω ở đây mang sắc thái canh giữ, bảo toàn. “Gìn giữ” tự nhiên hơn cách dịch sát chữ “giữ” và phù hợp với vế sau nói Kẻ Ác không thể đụng đến người ấy.
- source_word: ὁ πονηρὸς
  choice: Kẻ Ác
  rationale: Có mạo từ và theo cách dùng của Giăng, cụm từ này tự nhiên nhất khi chỉ một nhân vật, tức Sa-tan, chứ không phải điều ác trừu tượng.
- source_word: οὐχ ἅπτεται αὐτοῦ
  choice: không đụng đến người ấy
  rationale: Giữ nghĩa cơ bản của ἅπτομαι là “đụng/chạm đến”, đồng thời chú thích nêu sắc thái nắm lấy để gây hại.
theological_decisions:
- issue: Ý nghĩa của οὐχ ἁμαρτάνει ở thì hiện tại
  choice: Dịch là “không tiếp tục phạm tội”, hiểu là không sống trong sự phạm tội dai dẳng hoặc thành nếp.
  alternative: “Không phạm tội”, có thể được hiểu là hoàn toàn không phạm bất cứ tội nào.
  rationale: Cách dịch phản ánh thể chưa hoàn thành của thì hiện tại và duy trì sự nhất quán với 1 Giăng 1:8–10; 2:1, nhưng chú thích vẫn cho người đọc thấy nguyên văn có thể được dịch sát hơn.
- issue: Đối tượng được nói đến trong ὁ γεννηθεὶς ἐκ τοῦ θεοῦ
  choice: Chính văn dùng “Đấng được Đức Chúa Trời sinh ra”, nhiều khả năng chỉ Chúa Giê-xu, Đấng gìn giữ tín hữu.
  alternative: Cụm từ chỉ chính người được Đức Chúa Trời sinh ra, người gìn giữ bản thân mình.
  rationale: Cú pháp Hy Lạp cho phép cả hai cách hiểu. Chính văn không thêm tên Chúa Giê-xu, còn chú thích bảo tồn cách hiểu phản thân để không xóa bỏ sự mơ hồ thật sự.
- issue: Đối tượng của αὐτόν và αὐτοῦ
  choice: Cả hai được hiểu là người tin, dịch là “người ấy”.
  alternative: 'Nếu chủ ngữ của τηρεῖ cũng là người tin, αὐτόν có thể mang ý nghĩa phản thân: “giữ mình”.'
  rationale: Dạng đại từ trong SBLGNT là αὐτόν, không phải đại từ phản thân. “Người ấy” bám sát văn bản được chọn, còn chú thích ghi nhận cách phân tích cú pháp khác.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Chúa Trời” theo lối gọi quen thuộc của tiếng Việt Cơ Đốc; “Kẻ Ác” được viết hoa vì chỉ một nhân vật. “Đấng” duy trì giọng trang trọng và gợi khả năng quy chiếu về Chúa Giê-xu, nhưng chú thích công khai cách hiểu khác. Các dấu chú thích được đặt ngay sau mệnh đề hoặc từ ngữ liên quan.
