source:
  edition: SBLGNT
  text: ὅτι πᾶν τὸ γεγεννημένον ἐκ τοῦ θεοῦ νικᾷ τὸν κόσμον. καὶ αὕτη ἐστὶν ἡ νίκη ἡ νικήσασα τὸν κόσμον, ἡ πίστις ἡμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/004.yaml
  text: 'For everyone who has been born of God overcomes the world[b][a]. And this is the victory that has overcome the world: our faith.'
translation:
  language: vi
  text: 'Vì mọi người đã được Đức Chúa Trời sinh ra[a] đều thắng thế gian. Và đây là chiến thắng đã thắng thế gian: đức tin của chúng ta.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch sát hơn: “mọi điều đã được sinh ra từ Đức Chúa Trời”; cách diễn đạt giống trung tính trong tiếng Hy Lạp chỉ chung cả lớp người được Đức Chúa Trời sinh ra.'
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể hiểu là “lòng trung tín của chúng ta.” Từ Hy Lạp này, tùy ngữ cảnh, có thể có nghĩa là “đức tin,” “sự tin cậy” hoặc “lòng trung tín”; chính văn dùng nghĩa thông thường ở đây là “đức tin.”
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: Vì
  rationale: Trong ngữ cảnh, từ này nêu lý do cho lời khẳng định ngay trước đó; “Vì” diễn đạt tự nhiên quan hệ nguyên nhân.
- source_word: πᾶν τὸ γεγεννημένον
  choice: ai đã được Đức Chúa Trời sinh ra
  rationale: Cụm Hy Lạp dùng dạng trung tính số ít để chỉ chung cả lớp người được Đức Chúa Trời sinh ra. “Ai” truyền đạt rõ đối tượng là con người, còn “đã được ... sinh ra” giữ sắc thái của phân từ hoàn thành bị động.
- source_word: ἐκ τοῦ θεοῦ
  choice: được Đức Chúa Trời sinh ra
  rationale: Cách diễn đạt này thể hiện nguồn gốc nơi Đức Chúa Trời và phù hợp với ngôn ngữ về sự sinh ra thuộc linh trong các trước tác của Giăng.
- source_word: νικᾷ
  choice: thắng
  rationale: “Thắng” là cách nói tự nhiên, đồng thời duy trì mối liên hệ từ vựng với danh từ νίκη và phân từ νικήσασα trong cùng câu.
- source_word: τὸν κόσμον
  choice: thế gian
  rationale: Trong 1 Giăng, κόσμος thường chỉ trật tự thế gian chống nghịch Đức Chúa Trời. “Thế gian” giữ nguyên sắc thái quen thuộc này mà không giải thích quá mức trong chính văn.
- source_word: αὕτη ἐστὶν ἡ νίκη
  choice: chiến thắng ... chính là
  rationale: Cách dịch này giữ sự nhấn mạnh của đại từ chỉ định và xác định rõ điều được gọi là chiến thắng.
- source_word: ἡ νικήσασα
  choice: đã thắng
  rationale: Thì bất định của phân từ được diễn đạt bằng “đã” để nêu tính thành tựu của chiến thắng, đồng thời giữ liên hệ với động từ “thắng” ở vế trước.
- source_word: ἡ πίστις ἡμῶν
  choice: đức tin của chúng ta
  rationale: “Đức tin” là nghĩa phù hợp nhất trong ngữ cảnh, nơi tác giả xác định điều nhờ đó những người thuộc về Đức Chúa Trời thắng thế gian; đại từ sở hữu được dịch trực tiếp là “của chúng ta”.
theological_decisions:
- issue: Đối tượng của πᾶν τὸ γεγεννημένον
  choice: 'chỉ người theo nghĩa tập thể: “ai đã được Đức Chúa Trời sinh ra”'
  alternative: “mọi điều được Đức Chúa Trời sinh ra”
  rationale: Hình thức Hy Lạp là trung tính và có thể dịch sát là “mọi điều,” nhưng ngữ cảnh nói về những người tin. Chính văn dùng cách nói chỉ người cho tự nhiên, còn chú thích bảo lưu hình thức và phạm vi diễn đạt của nguyên ngữ.
- issue: Nghĩa của πίστις
  choice: đức tin
  alternative: lòng trung tín
  rationale: “Đức tin” phù hợp nhất với lập luận của đoạn văn và là nghĩa thông thường ở đây. Tuy nhiên, vì πίστις trong một số ngữ cảnh có thể chỉ sự trung tín, khả năng ấy được ghi ở chú thích.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Bản dịch giữ chuỗi từ cùng gốc νικᾷ–νίκη–νικήσασα bằng “thắng–chiến thắng–đã thắng,” dù sự lặp lại có chủ ý tạo nhịp tu từ mạnh hơn lối diễn đạt thông thường.
