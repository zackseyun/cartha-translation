  text: τὸ πνεῦμα καὶ τὸ ὕδωρ καὶ τὸ αἷμα, καὶ οἱ τρεῖς εἰς τὸ ἕν εἰσιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/008.yaml
  text: the Spirit and the water and the blood[a], and the three are for the one.
translation:
  language: vi
  text: Thần Khí, nước và huyết; cả ba đều nhất trí[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc dịch sát: “cả ba đều là một.” Thành ngữ Hy Lạp ở đây, trong ngữ cảnh làm chứng, có lẽ muốn nói lời chứng của cả ba phù hợp với nhau.'
    reason: Nêu cách dịch hình thức khả dĩ, đồng thời giải thích nghĩa thành ngữ theo văn mạch mà không biến thành một khẳng định hợp nhất bản thể.
lexical_decisions:
- source_word: τὸ πνεῦμα
  choice: Thần Khí
  rationale: Danh từ có mạo từ và ngữ cảnh 1 Giăng 5:6–8 cho thấy đây rất có thể là Thần Khí của Đức Chúa Trời đang làm chứng. Viết hoa giữ được sở chỉ xác định mà không thêm từ “Thánh,” vốn không có mặt trong câu Hy Lạp này.
- source_word: τὸ ὕδωρ
  choice: nước
  rationale: Giữ nguyên hình ảnh cụ thể của bản Hy Lạp và không giải thích sở chỉ ngay trong chính văn.
- source_word: τὸ αἷμα
  choice: huyết
  rationale: “Huyết” là cách diễn đạt trang trọng, quen thuộc trong văn cảnh Kinh Thánh, đồng thời giữ nguyên danh từ cụ thể và không diễn giải sở chỉ.
- source_word: οἱ τρεῖς
  choice: cả ba
  rationale: Diễn đạt tự nhiên cụm danh từ chỉ tập thể, quy chiếu rõ ràng đến ba chứng nhân vừa được nêu.
- source_word: εἰς τὸ ἕν εἰσιν
  choice: đều quy về một
  rationale: Cách dịch này phản ánh hướng nghĩa của εἰς (“về/đến”) và giữ phần nào tính cô đọng, đa nghĩa của nguyên văn; trong ngữ cảnh làm chứng, cụm từ có thể nói rằng cả ba cùng hội tụ trong một lời chứng.
theological_decisions:
- issue: εἰς τὸ ἕν εἰσιν nói về sự hợp nhất bản thể hay sự hội tụ trong lời chứng
  choice: cả ba đều quy về một
  alternative: cả ba đều nhất trí; cả ba là một
  rationale: Ngữ cảnh nhấn mạnh việc làm chứng, nên sự hội tụ hay phù hợp của ba chứng nhân là cách hiểu tự nhiên. Tuy vậy, chính văn không diễn giải thành “nhất trí” hoàn toàn, cũng không dùng “là một,” vì cách ấy có thể gợi một khẳng định bản thể mạnh hơn điều cấu trúc Hy Lạp trực tiếp nói.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng dấu chấm phẩy để phân biệt danh sách ba chứng nhân với mệnh đề kết luận. “Quy về một” có sắc thái hơi trang trọng nhưng tự nhiên trong tiếng Việt và bảo toàn được sự cô đọng của nguyên văn.
