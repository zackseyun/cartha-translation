review_pass:
  verdict: revise
  source_fidelity: Cụm εἰς τὸ ἕν εἰσιν là một thành ngữ trong ngữ cảnh ba chứng nhân; nghĩa phù hợp nhất là sự đồng thuận/phù hợp trong lời chứng. “Quy về một” có thể gợi ba thực tại quy hướng về cùng một đối tượng hay mục tiêu, điều không được nêu trong câu và không truyền đạt rõ chức năng chứng thực của thành ngữ.
  naturalness: “Thần Khí, nước và huyết” và “huyết” đều phù hợp văn phong Kinh Thánh tiếng Việt hiện đại, trang trọng. Mệnh đề “cả ba đều nhất trí” tự nhiên, ngắn gọn và rõ nghĩa hơn “cả ba đều quy về một.”
  terminology: Giữ “Thần Khí” viết hoa, phù hợp với sở chỉ có khả năng cao là Thánh Linh trong ngữ cảnh gần; không thêm “Thánh” khi từ này không xuất hiện trong câu. Giữ “nước” và “huyết” không diễn giải các hình ảnh này.
  issues:
  - severity: medium
    issue: “cả ba đều quy về một” không diễn đạt rõ thành ngữ εἰς τὸ ἕν trong ngữ cảnh làm chứng.
    rationale: Cách nói này trong tiếng Việt thường hàm ý cùng quy hướng về một đối tượng, trong khi văn mạch 5:6–8 nói về sự phù hợp của các chứng nhân. “Cả ba đều nhất trí” truyền đạt chính xác hơn mà không áp đặt ý niệm hợp nhất bản thể.
  - severity: low
    issue: Chú thích hiện tại gọi “hướng về một” là sát nguyên văn nhưng chưa nêu cách dịch thông dụng, trực tiếp hơn là “cả ba là một.”
    rationale: Nên cho thấy cả cách dịch hình thức truyền thống và giải thích thành ngữ theo văn mạch, để bảo toàn tính đa nghĩa mà vẫn hỗ trợ người đọc.
