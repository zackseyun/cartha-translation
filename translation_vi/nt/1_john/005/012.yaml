id: 1JN.5.12
reference: 1 John 5:12
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὁ ἔχων τὸν υἱὸν ἔχει τὴν ζωήν· ὁ μὴ ἔχων τὸν υἱὸν τοῦ θεοῦ τὴν ζωὴν οὐκ ἔχει.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/012.yaml
  text: The one who has the Son has life[a]; the one who does not have the Son of God does not have life.
translation:
  language: vi
  text: Ai có Người Con thì có sự sống[a]; ai không có Con Đức Chúa Trời thì không có sự sống.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể hiểu là “sự sống đời đời”; trong cách dùng của Gioan, “sự sống” ở đây là sự sống có nơi Người Con.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἔχων
  choice: ai có
  rationale: Cụm mạo từ với phân từ hiện tại được dùng như danh từ, chỉ một người bất kỳ mang đặc điểm này. “Ai có” tự nhiên trong tiếng Việt hiện đại và giữ được ý nghĩa khái quát.
- source_word: τὸν υἱόν
  choice: Đức Chúa Con
  rationale: Mệnh đề đầu chỉ viết “Người Con”. “Đức Chúa Con” là cách gọi trang trọng, quen thuộc trong tiếng Việt, đồng thời giữ dạng ngắn hơn so với danh xưng đầy đủ ở mệnh đề sau.
- source_word: ἔχει
  choice: có
  rationale: Dịch trực tiếp ἔχω bằng từ thông dụng “có”, không diễn giải thêm bản chất của mối liên hệ hay sự dự phần.
- source_word: τὴν ζωήν
  choice: sự sống
  rationale: “Sự sống” chuyển tải tự nhiên danh từ ζωή trong văn phong Kinh Thánh tiếng Việt. Không thêm “đời đời” vào chính văn vì câu Hy Lạp ở đây chỉ có ζωή.
- source_word: ὁ μὴ ἔχων
  choice: ai không có
  rationale: μή phủ định phân từ được dùng như danh từ. Cách dịch này cân đối với “ai có” và giữ cấu trúc đối lập của nguyên văn.
- source_word: τὸν υἱὸν τοῦ θεοῦ
  choice: Con Đức Chúa Trời
  rationale: Giữ danh xưng đầy đủ ở mệnh đề thứ hai và diễn đạt rõ quan hệ sở thuộc của τοῦ θεοῦ, đồng thời bảo tồn sự biến đổi có chủ ý so với “Đức Chúa Con” ở mệnh đề đầu.
- source_word: οὐκ ἔχει
  choice: không có
  rationale: οὐκ phủ định động từ hữu hạn; “không có” là cách nói chuẩn, tự nhiên và song song với mệnh đề khẳng định.
theological_decisions:
- issue: Ý nghĩa của “sự sống” trong văn mạch Gioan
  choice: Giữ “sự sống” trong chính văn.
  alternative: sự sống đời đời
  rationale: Trong các trước tác Gioan, ζωή thường chỉ sự sống đời đời có nơi Đức Chúa Con; tuy nhiên, câu này chỉ viết ζωή. Bản dịch không đưa phần giải nghĩa vào chính văn, nhưng ghi nhận sắc thái ấy trong chú thích.
- issue: Chủ thể khái quát của các phân từ giống đực số ít
  choice: Dùng “ai...”
  alternative: người nào...; người có...
  rationale: Giống đực ngữ pháp ở đây có chức năng khái quát, không giới hạn phát biểu cho nam giới. “Ai” diễn đạt đúng phạm vi bao quát và tự nhiên trong tiếng Việt.
- issue: Sự khác nhau giữa “τὸν υἱόν” và “τὸν υἱὸν τοῦ θεοῦ”
  choice: Phân biệt “Đức Chúa Con” với “Con Đức Chúa Trời”.
  alternative: Dùng “Con Đức Chúa Trời” ở cả hai mệnh đề.
  rationale: Nguyên văn dùng dạng ngắn trong mệnh đề đầu và danh xưng đầy đủ trong mệnh đề sau. Giữ sự biến đổi này tránh bổ sung “của Đức Chúa Trời” vào nơi bản Hy Lạp không có.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Hai vế được giữ cân xứng để làm nổi bật phép đối lập của nguyên văn; dấu chú thích [a] xuất hiện ngay sau lần đầu nói đến “sự sống”.
