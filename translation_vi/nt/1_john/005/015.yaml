source:
  edition: SBLGNT
  text: καὶ ἐὰν οἴδαμεν ὅτι ἀκούει ἡμῶν ὃ ⸀ἐὰν αἰτώμεθα, οἴδαμεν ὅτι ἔχομεν τὰ αἰτήματα ἃ ᾐτήκαμεν ⸀ἀπ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/015.yaml
  text: And if we know that he hears us in whatever we ask, we know that we have the requests that we have asked from him.
translation:
  language: vi
  text: Và nếu chúng ta biết rằng Ngài nghe chúng ta về bất cứ điều gì chúng ta cầu xin[a], thì chúng ta biết rằng chúng ta có những điều chúng ta đã cầu xin Ngài.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “trong mọi điều chúng ta cầu xin.” Cấu trúc Hy Lạp diễn tả phạm vi không xác định: “bất cứ điều gì chúng ta cầu xin.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούει ἡμῶν
  choice: Ngài nghe chúng ta
  rationale: Giữ nghĩa trực tiếp của ἀκούω trong bối cảnh cầu nguyện. Không dịch là “đáp lời chúng ta”, vì như vậy sẽ đưa kết quả của việc nghe vào ngay trong động từ và làm mất trình tự lập luận của câu.
- source_word: ὃ ἐὰν αἰτώμεθα
  choice: dù chúng ta cầu xin điều gì
  rationale: Cấu trúc đại từ quan hệ với ἐάν diễn tả phạm vi không xác định, tức “bất cứ điều gì”. Cách diễn đạt này tự nhiên trong tiếng Việt và không biến ý nghĩa thành “bất cứ khi nào”.
- source_word: αἰτώμεθα
  choice: chúng ta cầu xin
  rationale: Trong văn cảnh này, αἰτέω chỉ hành động cầu xin trong lời cầu nguyện. “Cầu xin” rõ nghĩa và trang trọng tự nhiên hơn “yêu cầu”.
- source_word: ἔχομεν
  choice: mình có
  rationale: Giữ nghĩa hiện tại, trực tiếp của động từ “có”; không đổi thành “nhận được”, vì điều đó sẽ giải thích thêm điều bản văn không nói rõ.
- source_word: τὰ αἰτήματα
  choice: những điều đã cầu xin
  rationale: Trong tiếng Việt, cách diễn đạt này tự nhiên hơn “các lời thỉnh cầu” khi đi với động từ “có”, đồng thời vẫn chỉ những điều được xin.
- source_word: ἃ ᾐτήκαμεν
  choice: đã cầu xin
  rationale: “Đã” thể hiện hành động đã hoàn tất nhưng còn liên hệ với hiện tại, phù hợp với thể hoàn thành của ᾐτήκαμεν.
- source_word: ἀπ’ αὐτοῦ
  choice: nơi Ngài
  rationale: “Cầu xin nơi Ngài” diễn tả Ngài là nguồn và là Đấng lời cầu xin hướng đến, đồng thời tự nhiên, trang nghiêm trong tiếng Việt.
- source_word: οἴδαμεν
  choice: chúng ta biết
  rationale: Giữ nguyên động từ chủ chốt được lặp lại trong câu và trong văn phong Giăng, không diễn giải thành “chúng ta tin chắc”.
theological_decisions:
- issue: ἀκούει nói đến việc Đức Chúa Trời nghe lời cầu xin hay hàm ý Ngài đã đáp lời thuận lợi.
  choice: Ngài nghe chúng ta
  alternative: Ngài đáp lời chúng ta
  rationale: Bản Hy Lạp dùng động từ “nghe”. Dịch thành “đáp lời” sẽ nhập một kết luận thần học mạnh hơn vào động từ và làm mất sức căng giữa việc Ngài nghe với lời khẳng định rằng người cầu xin “có” những điều đã xin.
- issue: ἔχομεν có nên được diễn giải là đã nhận được điều cầu xin hay không.
  choice: mình có
  alternative: mình nhận được
  rationale: Dịch trực tiếp là “có” bảo toàn thì hiện tại và sự căng thẳng trong phát biểu; “nhận được” sẽ giải quyết theo một hướng điều bản văn để ngỏ.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và dễ hiểu. Dùng “Ngài” cho đại từ chỉ Đức Chúa Trời; dùng “mình” ở mệnh đề sau để tránh lặp nặng “chúng ta” nhưng vẫn giữ nguyên chủ thể. Cấu trúc lặp “chúng ta biết” được bảo toàn để phản ánh nhấn mạnh của nguyên văn.
