translation:
  language: vi
  text: Vì có ba điều làm chứng,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Một số thủ bản muộn thêm một cách đọc dài hơn, thường được gọi là Comma Johanneum: “trên trời: Đức Cha, Ngôi Lời và Đức Thánh Linh; và ba Đấng này là một. Cũng có ba làm chứng trên đất...” Cách diễn đạt này không có trong những thủ bản Hy Lạp sớm nhất còn lại và không được đưa vào bản văn SBLGNT.'
    reason: textual_variant
lexical_decisions:
- source_word: ὅτι
  choice: Vì
  rationale: Trong ngữ cảnh, liên từ này mở đầu lời giải thích cho khẳng định ngay trước đó; “Vì” diễn đạt tự nhiên chức năng giải thích ấy.
- source_word: τρεῖς
  choice: ba
  rationale: Số từ chỉ số lượng, được dịch trực tiếp là “ba”.
- source_word: εἰσιν
  choice: có
  rationale: Trong cấu trúc hiện hữu của câu, “có” là cách diễn đạt tự nhiên trong tiếng Việt cho εἰσιν, thay vì dịch máy móc là “là”.
- source_word: οἱ μαρτυροῦντες
  choice: Đấng làm chứng
  rationale: Phân từ hiện tại có mạo từ được dùng như danh từ, nghĩa sát là “những vị đang làm chứng”. “Đấng làm chứng” giữ sắc thái chủ thể có ngôi vị và ý nghĩa hành động, đồng thời phù hợp với ba chủ thể được nêu trong mạch văn kế tiếp.
theological_decisions:
- issue: Dạng văn bản của 1 Giăng 5:7 và Comma Johanneum
  choice: 'Chỉ dịch bản văn SBLGNT ngắn: “Vì có ba Đấng làm chứng,”'
  alternative: 'Truyền thống bản văn muộn Textus Receptus/KJV có thêm: “trên trời: Đức Cha, Ngôi Lời và Đức Thánh Linh; và ba Đấng này là một. Cũng có ba làm chứng dưới đất...”'
  rationale: Nguồn Hy Lạp được cung cấp là bản văn phê bình ngắn. Phần mở rộng mang nội dung Ba Ngôi là một dị bản muộn nổi tiếng, không thuộc câu SBLGNT ở đây; vì vậy bản chính theo nguồn được chỉ định, còn dị bản truyền thống được ghi minh bạch trong chú thích.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dấu phẩy giữ cho câu tiếp tục sang câu 8 theo cấu trúc của bản văn Hy Lạp. Viết hoa “Đấng” để diễn đạt tự nhiên ba chủ thể có ngôi vị trong mạch văn, nhưng không đưa phần dị bản Ba Ngôi vào chính văn.
