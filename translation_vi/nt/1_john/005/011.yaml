source:
  edition: SBLGNT
  text: καὶ αὕτη ἐστὶν ἡ μαρτυρία, ὅτι ζωὴν αἰώνιον ἔδωκεν ⸂ὁ θεὸς ἡμῖν⸃, καὶ αὕτη ἡ ζωὴ ἐν τῷ υἱῷ αὐτοῦ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/011.yaml
  text: 'And this is the testimony: that God has given us eternal life[c][b][a], and this life is in his Son.'
translation:
  language: vi
  text: 'Và lời chứng ấy là thế này: Đức Chúa Trời đã ban[a] cho chúng ta sự sống đời đời, và sự sống ấy ở trong Con Ngài.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đã trao cho chúng ta sự sống đời đời.”'
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn: “trong Con Ngài”; cách diễn đạt này được giữ lại thay vì diễn giải là “qua Con Ngài” hay “cùng với Con Ngài.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: μαρτυρία
  choice: lời chứng
  rationale: Diễn đạt tự nhiên nội dung được làm chứng trong văn mạch Giăng, đồng thời giữ sắc thái chứng cứ của từ Hy Lạp.
- source_word: ὅτι
  choice: 'là thế này:'
  rationale: Giới thiệu trực tiếp nội dung của lời chứng bằng cấu trúc tiếng Việt tự nhiên, không thêm phần giải nghĩa.
- source_word: ζωὴν αἰώνιον
  choice: sự sống đời đời
  rationale: Cách dịch quen thuộc, trang trọng và tự nhiên trong tiếng Việt, giữ cả ý niệm trường tồn lẫn phẩm chất của sự sống đến từ Đức Chúa Trời.
- source_word: ἔδωκεν
  choice: đã ban
  rationale: Thể bất định chỉ hành động ban đã hoàn tất; tiếng Việt dùng “đã ban” tự nhiên mà không buộc phải xác định thêm sắc thái thời thể.
- source_word: ὁ θεὸς
  choice: Đức Chúa Trời
  rationale: Danh xưng tiêu chuẩn, trang trọng và dễ hiểu trong tiếng Việt dành cho θεός khi chỉ Đức Chúa Trời.
- source_word: ἡμῖν
  choice: cho chúng ta
  rationale: Giữ nguyên ngôi thứ nhất số nhiều và chức năng đối tượng tiếp nhận, không thu hẹp phạm vi ngoài văn cảnh.
- source_word: ἐν τῷ υἱῷ αὐτοῦ
  choice: ở trong Con Ngài
  rationale: Giữ giới từ ἐν và thành ngữ thần học cô đọng của Giăng, không làm phẳng thành “qua” hoặc “cùng với”.
- source_word: υἱῷ
  choice: Con
  rationale: Viết hoa như danh xưng chỉ Con độc nhất của Đức Chúa Trời trong văn mạch.
- source_word: αὕτη ... αὕτη ἡ ζωή
  choice: ấy ... sự sống ấy
  rationale: Bảo tồn sự lặp lại của đại từ chỉ định, tạo liên kết giữa lời chứng và sự sống vừa được nhắc đến.
theological_decisions:
- issue: Sắc thái của thể bất định ἔδωκεν đối với việc hiện đang có sự sống
  choice: “đã ban cho chúng ta sự sống đời đời”
  alternative: “ban cho chúng ta sự sống đời đời” hoặc cách diễn đạt nhấn mạnh kết quả hiện tại
  rationale: “Đã ban” giữ hành động hoàn tất trong nguyên văn mà không đưa thêm một hệ thống giáo lý về thời điểm hay cơ chế nhận sự sống.
- issue: Ý nghĩa của sự sống “ở trong Con Ngài”
  choice: Giữ nguyên cách nói “ở trong Con Ngài”
  alternative: “qua Con Ngài” hoặc “cùng với Con Ngài”
  rationale: Cách dịch này bảo tồn sức gợi về vị trí, nguồn và mối liên hệ trong thành ngữ của Giăng, thay vì giải quyết sự phong phú ấy bằng một lời diễn giải hẹp hơn.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “lời chứng” thay vì từ pháp lý nặng nề hơn; giữ cấu trúc song hành và thành ngữ thần học của nguyên văn. Mọi dấu chú thích đều đặt ngay sau cụm từ liên quan.
