  - severity: low
    issue: Chú thích a thêm nhận định rằng “ban” nhấn mạnh đây là ân tứ của Đức Chúa Trời.”
    rationale: Động từ δίδωμι đơn giản có nghĩa là “ban/cho/trao”; nhận định về “ân tứ” là diễn giải thần học không cần thiết cho chú thích từ vựng.
