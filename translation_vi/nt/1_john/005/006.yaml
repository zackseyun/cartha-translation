  terminology: Giữ “Thánh Linh,” “chân lý,” và “Đấng Mê-si-a.” Chuẩn hóa cách phiên âm “Mê-si-a” thay cho “Mê-si.” Không giải thích trước ý nghĩa tranh luận của “nước và huyết.”
