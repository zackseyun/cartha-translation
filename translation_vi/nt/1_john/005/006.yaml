revisions:
- from: Đây chính là Đấng đã đến bởi nước và huyết, tức là Đức Giê-su, Đấng Mê-si[a]—không chỉ bởi nước mà còn bởi nước và huyết. Chính Thánh Linh là Đấng làm chứng, vì Thánh Linh là chân lý.[b]
  to: 'Đây chính là Đấng đã đến qua nước và huyết[a]: Đức Giê-su, Đấng Mê-si-a. Không phải chỉ trong nước, nhưng trong nước và trong huyết. Thánh Linh là Đấng làm chứng, vì Thánh Linh là chân lý.[b]'
  rationale: Bản sửa phục hồi sự phân biệt giữa διὰ và ἐν, kể cả sự lặp lại của ἐν trước “huyết,” đồng thời giữ nguyên tính mơ hồ có chủ ý của “nước và huyết.” Cấu trúc đồng vị được diễn đạt bằng dấu hai chấm, chú thích a được chuyển đến đúng cụm từ liên quan, và danh hiệu được chuẩn hóa thành “Đấng Mê-si-a.”
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T00:30:48Z'
