id: 1JN.5.6
reference: 1 John 5:6
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Οὗτός ἐστιν ὁ ἐλθὼν δι’ ὕδατος καὶ αἵματος, Ἰησοῦς Χριστός· οὐκ ἐν τῷ ὕδατι μόνον ἀλλ’ ἐν τῷ ὕδατι καὶ ⸀ἐν τῷ αἵματι· καὶ τὸ πνεῦμά ἐστιν τὸ μαρτυροῦν, ὅτι τὸ πνεῦμά ἐστιν ἡ ἀλήθεια.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/006.yaml
  text: This is the one who came by water and blood—Jesus the Messiah[a]; not by the water only, but by the water and by the blood. And the Spirit is the one testifying[c][b], because the Spirit is the truth.
translation:
  language: vi
  text: 'Đây chính là Đấng đã đến qua nước và huyết[a]: Đức Giê-su, Đấng Mê-si-a. Không phải chỉ trong nước, nhưng trong nước và trong huyết. Thánh Linh là Đấng làm chứng, vì Thánh Linh là chân lý.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cụm “qua nước và huyết” cũng có thể dịch là “bởi nước và huyết”. Ý nghĩa của cụm này còn được tranh luận; có cách hiểu là phép báp-têm và cái chết của Đức Giê-su, sự sinh ra và cái chết của Đức Giê-su, hoặc hình ảnh mang tính nghi lễ. Bản dịch giữ nguyên cách diễn đạt của tiếng Hy Lạp mà không chọn một cách giải thích.
    reason: alternative_reading
  - marker: b
    text: 'Liên từ Hy Lạp cũng có thể hiểu là: “rằng Thánh Linh là chân lý.” Trong chính văn, liên từ này được hiểu theo nghĩa nguyên nhân: “vì”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὗτός ἐστιν ὁ ἐλθὼν
  choice: Đây chính là Đấng đã đến
  rationale: Cách diễn đạt này giữ lực nhấn mạnh và nhận diện của đại từ chỉ định Οὗτός, đồng thời chuyển phân từ aorist ὁ ἐλθὼν sang tiếng Việt tự nhiên mà không diễn giải quá mức về thể.
- source_word: δι’ ὕδατος καὶ αἵματος
  choice: bởi nước và huyết
  rationale: “Bởi” có thể diễn đạt phương tiện hoặc hoàn cảnh đi kèm của διά với sở hữu cách; giữ nguyên hình ảnh “nước và huyết” để không quyết định một cách giải thích đang còn tranh luận.
- source_word: Ἰησοῦς Χριστός
  choice: Đức Giê-su, Đấng Mê-si
  rationale: Cụm đồng vị xác định Đấng vừa được nói đến là Giê-su và Χριστός mang sắc thái tước hiệu; “Đấng Mê-si” truyền đạt chức danh này rõ ràng trong tiếng Việt.
- source_word: οὐκ ἐν τῷ ὕδατι μόνον ἀλλ’ ἐν τῷ ὕδατι καὶ ἐν τῷ αἵματι
  choice: không chỉ bởi nước mà còn bởi nước và huyết
  rationale: Giữ cấu trúc tương phản và sự lặp lại của “nước”; dùng “bởi” nhất quán với vế trước, trong khi tiếng Việt không cần lặp giới từ trước “huyết” để vẫn rõ nghĩa.
- source_word: τὸ πνεῦμά
  choice: Thánh Linh
  rationale: Trong văn cảnh về lời chứng thần linh của 1 Giăng, từ này chỉ về Thánh Linh chứ không phải một linh nói chung; “Thánh Linh” là cách gọi tự nhiên, trang trọng và quen thuộc.
- source_word: τὸ μαρτυροῦν
  choice: Đấng làm chứng
  rationale: Danh hóa phân từ hiện tại theo cách tự nhiên trong tiếng Việt, giữ vai trò chủ động của Thánh Linh trong việc làm chứng.
- source_word: ὅτι
  choice: vì
  rationale: Hiểu liên từ theo nghĩa nguyên nhân, nêu cơ sở cho lời chứng của Thánh Linh; cách hiểu theo nghĩa nội dung “rằng” vẫn khả hữu và được ghi chú.
- source_word: ἡ ἀλήθεια
  choice: chân lý
  rationale: “Chân lý” diễn đạt danh từ xác định mang tính nhận diện, thay vì làm nhẹ thành tính từ “chân thật”.
theological_decisions:
- issue: Ý nghĩa của “nước và huyết”
  choice: Giữ nguyên cụm “nước và huyết” mà không giải thích trong chính văn
  alternative: Hiểu là phép báp-têm và cái chết của Đức Giê-su; sự sinh ra và cái chết của Ngài; hoặc hình ảnh bí tích
  rationale: Bản Hy Lạp chỉ nêu hai yếu tố mà không giải thích; giữ nguyên cụm từ bảo tồn sự mơ hồ và căng thẳng thần học có thật.
- issue: Đối tượng được gọi là πνεῦμα
  choice: Thánh Linh
  alternative: một linh nói chung
  rationale: Văn cảnh về lời chứng và cách dùng của Giăng ủng hộ mạnh mẽ việc hiểu đây là Thánh Linh; bản dịch không thêm một triển khai tín lý nào ngoài sự nhận diện theo văn cảnh.
- issue: Chức năng của Χριστός
  choice: Đấng Mê-si
  alternative: Đấng Christ; Ki-tô
  rationale: Trong cụm đồng vị này, Χριστός có chức năng tước hiệu rõ hơn một thành phần tên riêng, nên dịch nghĩa là “Đấng Mê-si”.
- issue: Quan hệ do ὅτι biểu thị
  choice: 'nguyên nhân: “vì Thánh Linh là chân lý”'
  alternative: 'nội dung: “rằng Thánh Linh là chân lý”'
  rationale: Nghĩa nguyên nhân phù hợp hơn với mạch lập luận, nhưng ngữ pháp Hy Lạp cũng cho phép hiểu là giới thiệu nội dung lời chứng; ghi chú bảo tồn khả năng ấy.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Giê-su” theo thói quen tiếng Việt khi nói về nhân vật thánh; dùng “Đấng” cho các cấu trúc nhận diện mang tính tôn kính. “Huyết” được giữ thay vì “máu” để duy trì sắc thái trang trọng và sự cân xứng của cụm thần học truyền thống, nhưng câu vẫn có cấu trúc hiện đại.
