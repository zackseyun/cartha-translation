base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/019.yaml
  text: We know that we are from God[b][a], and the whole world lies in the evil one.
translation:
  language: vi
  text: Chúng ta biết mình thuộc về Đức Chúa Trời, còn cả thế gian nằm dưới quyền Kẻ Ác.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch sát hơn: “cả thế gian nằm trong Kẻ Ác.” Một số người hiểu cụm này là “nằm trong điều ác.”'
    reason: Nêu cách dịch hình thức hơn của ἐν ... κεῖται và bảo tồn khả năng hiểu πονηρῷ theo nghĩa trừu tượng.
lexical_decisions:
- source_word: οἴδαμεν
  choice: Chúng ta biết
  rationale: Diễn đạt trực tiếp sự hiểu biết chắc chắn và giữ giọng xác tín của thư.
- source_word: ἐκ τοῦ θεοῦ ἐσμεν
  choice: mình thuộc về Đức Chúa Trời
  rationale: ἐκ chỉ nguồn gốc hoặc sự thuộc về. Cách dịch này tự nhiên trong tiếng Việt và không thêm ý cụ thể «được Đức Chúa Trời sinh ra», vốn không được nói rõ trong mệnh đề này.
- source_word: ὁ κόσμος ὅλος
  choice: cả thế gian
  rationale: Giữ phạm vi bao quát của ὅλος và sắc thái của κόσμος trong văn chương Giăng về thế giới xa cách Đức Chúa Trời.
- source_word: ἐν τῷ πονηρῷ
  choice: dưới quyền kẻ ác
  rationale: Trong văn mạch của Giăng, cụm tính từ được danh từ hóa này nhiều khả năng chỉ một tác nhân có ngôi vị. «Dưới quyền» truyền đạt tự nhiên trạng thái bị chi phối hàm chứa trong thành ngữ Hy Lạp.
- source_word: κεῖται
  choice: nằm
  rationale: Giữ hình ảnh căn bản của κεῖμαι, đồng thời kết hợp với «dưới quyền» để câu tiếng Việt rõ nghĩa.
theological_decisions:
- issue: τῷ πονηρῷ chỉ điều ác trừu tượng hay một kẻ ác có ngôi vị
  choice: kẻ ác
  alternative: điều ác
  rationale: Cách dùng trong 1 Giăng thường nghiêng về nghĩa có ngôi vị (x. 2:13–14; 3:12; 5:18). Tuy vậy, khả năng hiểu theo nghĩa trừu tượng được ghi nhận trong chú thích để bảo tồn độ mở của cấu trúc Hy Lạp.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng «Đức Chúa Trời» và «kẻ ác»; tránh thuật ngữ giáo phái và tránh diễn giải quá mức.
