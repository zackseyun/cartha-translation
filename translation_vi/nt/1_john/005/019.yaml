  rationale: Chỉ sửa viết hoa danh xưng “Kẻ Ác” và chỉnh chú thích cho nhất quán. Giữ “nằm dưới quyền” vì đây là cách tiếng Việt tự nhiên diễn đạt tình trạng cả thế gian bị tác nhân được nói đến chi phối, đồng thời chú thích bảo tồn cách dịch sát của cấu trúc Hy Lạp và khả năng đọc trừu tượng.
