id: 1JN.1.1
reference: 1 John 1:1
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ὃ ἦν ἀπ’ ἀρχῆς, ὃ ἀκηκόαμεν, ὃ ἑωράκαμεν τοῖς ὀφθαλμοῖς ἡμῶν, ὃ ἐθεασάμεθα καὶ αἱ χεῖρες ἡμῶν ἐψηλάφησαν, περὶ τοῦ λόγου τῆς ζωῆς—
base_translation:
  language: en
  yaml_path: translation/nt/1_john/001/001.yaml
  text: What was from the beginning[a], what we have heard, what we have seen with our eyes, what we looked upon and our hands have touched[b], concerning the word of life—
translation:
  language: vi
  text: Điều đã có từ ban đầu[a], điều chúng tôi đã nghe, điều chúng tôi đã tận mắt thấy, điều chúng tôi đã chăm chú nhìn và tay chúng tôi đã chạm đến, về lời sự sống[b]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Điều vốn có từ ban đầu.” Tiếng Hy Lạp dùng đại từ quan hệ giống trung, có thể chỉ rộng đến toàn bộ lời chứng của các sứ đồ về Con, thay vì trực tiếp gọi là “Đấng”.'
    reason: alternative_reading
  - marker: b
    text: 'Cũng có thể hiểu: “Ngôi Lời của sự sống”. Cụm từ này có thể chỉ chính Con, với âm hưởng có chủ ý từ Giăng 1:1, hoặc chỉ sứ điệp ban sự sống nói về Ngài.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὃ / ὃ
  choice: Điều
  rationale: Các đại từ quan hệ số ít giống trung được lặp lại, chỉ toàn thể điều được các sứ đồ làm chứng chứ không trực tiếp gọi một nhân vật là “Đấng”. “Điều” vừa tự nhiên trong tiếng Việt vừa giữ được phạm vi rộng ấy.
- source_word: ἦν ἀπ’ ἀρχῆς
  choice: đã có từ ban đầu
  rationale: Diễn đạt trực tiếp thể chưa hoàn thành ἦν và thành ngữ Giăng ἀπ’ ἀρχῆς, giữ chiều sâu thời gian mà không thêm ý không có trong nguyên văn.
- source_word: ἀκηκόαμεν
  choice: chúng tôi đã nghe
  rationale: Thì hoàn thành chỉ lời chứng bắt nguồn từ việc nghe trong quá khứ và vẫn có giá trị; “đã nghe” là cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: ἑωράκαμεν τοῖς ὀφθαλμοῖς ἡμῶν
  choice: chúng tôi đã tận mắt thấy
  rationale: “Tận mắt thấy” giữ sự nhấn mạnh cụ thể của “thấy bằng mắt chúng tôi” và làm nổi bật tư cách nhân chứng, đồng thời tự nhiên hơn lối dịch sát từng chữ.
- source_word: ἐθεασάμεθα
  choice: chúng tôi đã chăm chú nhìn
  rationale: Động từ nói đến việc quan sát có chủ ý, hơn là chỉ thoáng thấy. “Chăm chú nhìn” truyền đạt sắc thái ấy bằng ngôn ngữ hiện đại.
- source_word: αἱ χεῖρες ἡμῶν ἐψηλάφησαν
  choice: tay chúng tôi đã chạm đến
  rationale: Giữ chủ ngữ cụ thể “tay chúng tôi” và tính thể chất của lời chứng. “Chạm đến” không hàm ý cầm nắm kéo dài quá mức nghĩa của ψηλαφάω.
- source_word: περὶ
  choice: liên quan đến
  rationale: Giới thiệu chủ đề của toàn bộ lời chứng. Cách dịch này rõ ràng, trang trọng vừa phải và giữ cấu trúc câu đang tiếp nối sang câu sau.
- source_word: τοῦ λόγου τῆς ζωῆς
  choice: lời sự sống
  rationale: “Lời” có thể chỉ lời phán, sứ điệp hoặc mang âm hưởng nhân vị trong văn chương Giăng; không viết hoa để tránh quyết định thay cho nguyên văn. Cấu trúc “lời sự sống” giữ được độ cô đọng và sự đa nghĩa của cụm Hy Lạp.
theological_decisions:
- issue: Đối tượng được chỉ bởi các mệnh đề quan hệ giống trung và bởi λόγος
  choice: Dùng “Điều” và “lời sự sống” không viết hoa trong chính văn.
  alternative: Dịch trực tiếp theo ngôi vị là “Đấng đã có từ ban đầu” hoặc viết hoa “Lời Sự Sống”.
  rationale: Ngữ cảnh rõ ràng mang nội dung Cơ Đốc học, nhưng nguyên văn dùng đại từ quan hệ giống trung và chữ Hy Lạp không biểu thị viết hoa theo nghĩa thần học. Bản dịch vì thế giữ cả khả năng chỉ về Con Đức Chúa Trời lẫn lời chứng hay sứ điệp về sự sống được hiện thân nơi Ngài, thay vì âm thầm loại bỏ một sắc thái.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Phép lặp “điều” tái hiện nhịp điệu nhấn mạnh của nguyên văn; “tận mắt thấy” và “tay… chạm đến” làm nổi bật tính cụ thể của lời chứng. Dấu gạch ngang cuối câu được giữ vì cú pháp tiếp tục sang các câu kế tiếp.
