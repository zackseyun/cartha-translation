  text: καὶ ταῦτα γράφομεν ⸀ἡμεῖς ἵνα ἡ χαρὰ ἡμῶν ᾖ πεπληρωμένη.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/001/004.yaml
  text: And we are writing these things so that our joy may be complete[a].
translation:
  language: vi
  text: Chúng tôi viết những điều này để niềm vui của chúng tôi được trọn vẹn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Một số thủ bản chép “niềm vui của anh chị em” thay cho “niềm vui của chúng tôi”.
    reason: textual_variant
lexical_decisions:
- source_word: καὶ
  choice: (không dịch riêng)
  rationale: Liên từ nối câu này với lời chứng ngay trước đó. Trong tiếng Việt hiện đại, mở câu bằng “Và” ở đây không cần thiết; quan hệ tiếp nối vẫn rõ qua mạch văn.
- source_word: ταῦτα
  choice: những điều này
  rationale: Giữ sắc thái số nhiều của đại từ chỉ định và chỉ về nội dung đang được viết.
- source_word: γράφομεν ἡμεῖς
  choice: Chúng tôi viết
  rationale: Động từ hiện tại cùng đại từ chủ ngữ được diễn đạt tự nhiên bằng “chúng tôi viết”. “Chúng tôi” thể hiện nhóm người viết đối với độc giả và giữ sự hiện diện rõ của đại từ ἡμεῖς.
- source_word: ἵνα
  choice: để
  rationale: Diễn đạt tự nhiên ý mục đích, đồng thời không loại trừ sắc thái kết quả của mệnh đề.
- source_word: ἡ χαρά
  choice: niềm vui
  rationale: Tương đương thông dụng, tự nhiên và phù hợp với văn phong trang trọng hiện đại.
- source_word: ἡμῶν
  choice: của chúng ta
  rationale: Dịch trực tiếp ngôi thứ nhất số nhiều của bản SBLGNT; “chúng ta” trong cụm sở hữu có thể bao gồm cả người viết và độc giả, phù hợp mục đích hiệp thông của văn cảnh mà không khẳng định quá mức phạm vi bao hàm.
- source_word: ᾖ πεπληρωμένη
  choice: được trọn vẹn
  rationale: Diễn đạt trạng thái đã đạt đến mức đầy đủ do cấu trúc περιφραστική gồm ᾖ và phân từ hoàn thành bị động πεπληρωμένη; cách nói này tự nhiên hơn “được làm cho đầy” trong tiếng Việt.
theological_decisions:
- issue: Đại từ sở hữu trong cụm ἡ χαρὰ ἡμῶν
  choice: niềm vui của chúng ta
  alternative: niềm vui của anh chị em
  rationale: Nguồn Hy Lạp được cung cấp đọc ἡμῶν, nghĩa là “của chúng ta/chúng tôi”, nên bản chính giữ cách đọc này. Dị bản “của anh chị em” có ý nghĩa đáng kể và được ghi ở chú thích thay vì đưa vào chính văn.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, sáng rõ và trang trọng vừa phải. Dùng “anh chị em” trong chú thích để diễn đạt đại từ ngôi thứ hai số nhiều theo lối tự nhiên, không giả định giới tính hay quan hệ quyền bính. Dấu chú thích [a] được đặt ngay sau câu chính.
