    rationale: Nguyên văn ghi τὸ αἷμα Ἰησοῦ τοῦ υἱοῦ αὐτοῦ, không có κύριος. Dù tước hiệu này phù hợp với cách dùng Cơ Đốc phổ thông, việc thêm vào bản văn làm giảm tính tương đương tối ưu.
  - severity: low
    issue: 'Chú thích a mở đầu bằng «Cũng có thể dịch: “với nhau”» trong khi bản chính đã dịch đúng là «với nhau».'
    rationale: Cách mở đầu này không nêu một phương án khác thực sự trong tiếng Việt. Nên chuyển thẳng sang việc giải thích cách hiểu thay thế về đối tượng của sự tương giao.
  - severity: low
    issue: «thanh tẩy» có sắc thái nghi lễ/trang trọng hơn cần thiết.
    rationale: «Tẩy sạch» diễn đạt καθαρίζει rõ ràng, tự nhiên trong tiếng Việt hiện đại, mà vẫn giữ được trường nghĩa đạo đức và nghi lễ của động từ Hy Lạp.
