id: 1JN.1.7
reference: 1 John 1:7
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐὰν δὲ ἐν τῷ φωτὶ περιπατῶμεν ὡς αὐτός ἐστιν ἐν τῷ φωτί, κοινωνίαν ἔχομεν μετ’ ἀλλήλων καὶ τὸ αἷμα ⸀Ἰησοῦ τοῦ υἱοῦ αὐτοῦ καθαρίζει ἡμᾶς ἀπὸ πάσης ἁμαρτίας.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/001/007.yaml
  text: But if we walk in the light[a], as he himself is in the light, we have fellowship with one another[b], and the blood of Jesus his Son cleanses us from every sin.
translation:
  language: vi
  text: Nhưng nếu chúng ta bước đi trong ánh sáng, như chính Ngài ở trong ánh sáng, thì chúng ta có sự tương giao với nhau[a], và máu của Giê-su, Con của Ngài, tẩy sạch chúng ta khỏi mọi tội[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cụm «với nhau» có thể được hiểu là sự tương giao giữa các tín hữu với Đức Chúa Trời. Tuy nhiên, đại từ tương hỗ trong tiếng Hy Lạp tự nhiên nhất chỉ sự tương giao lẫn nhau giữa các tín hữu.
    reason: alternative_reading
  - marker: b
    text: 'Cũng có thể hiểu: «khỏi tất cả tội lỗi». Cụm từ Hy Lạp có thể được hiểu theo nghĩa phân phối («mọi tội») hoặc nghĩa tập hợp («tất cả tội lỗi»).'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν δὲ
  choice: Nhưng nếu
  rationale: δέ tạo thế tương phản với lời nói về việc bước đi trong bóng tối ở câu trước; “Nhưng nếu” diễn đạt tự nhiên sắc thái đối lập ấy.
- source_word: ἐν τῷ φωτὶ
  choice: trong ánh sáng
  rationale: Giữ nguyên hình ảnh ẩn dụ chủ đạo của đoạn văn và cách nói tự nhiên trong tiếng Việt.
- source_word: περιπατῶμεν
  choice: chúng ta bước đi
  rationale: Giữ ẩn dụ đạo đức của nguyên văn thay vì diễn giải thành “sống” hay “ăn ở,” đồng thời có thể gợi một nếp sống liên tục.
- source_word: ὡς αὐτός ἐστιν ἐν τῷ φωτί
  choice: như chính Ngài ở trong ánh sáng
  rationale: “chính Ngài” phản ánh mức nhấn nhẹ của αὐτός; “như” giữ phép so sánh mà không áp đặt sự đồng nhất tuyệt đối.
- source_word: κοινωνίαν ἔχομεν
  choice: chúng ta có sự tương giao
  rationale: “Sự tương giao” diễn đạt sự dự phần chung và mối liên hệ gần gũi, đồng thời tránh tự động gán ý nghĩa nghi lễ hoặc bí tích.
- source_word: μετ’ ἀλλήλων
  choice: với nhau
  rationale: Cách dịch tự nhiên của đại từ tương hỗ, giữ rõ tính hỗ tương giữa các bên.
- source_word: τὸ αἷμα Ἰησοῦ
  choice: máu của Chúa Giê-su
  rationale: “Máu” là từ hiện đại, trực tiếp và dễ hiểu, vẫn giữ nguyên hình ảnh cùng sức nặng thần học của nguyên văn.
- source_word: τοῦ υἱοῦ αὐτοῦ
  choice: Con Ngài
  rationale: Diễn đạt tự nhiên quan hệ sở hữu và xác định Chúa Giê-su là Con của Đấng được nhắc đến bằng đại từ ở vế trước, không thêm nội dung ngoài nguyên văn.
- source_word: καθαρίζει
  choice: thanh tẩy
  rationale: Bao quát cả ý làm sạch về phương diện đạo đức lẫn âm hưởng thanh sạch tôn giáo. Thì hiện tại được giữ bằng hiện tại đơn, không cường điệu thành “không ngừng thanh tẩy.”
- source_word: ἀπὸ πάσης ἁμαρτίας
  choice: khỏi mọi tội lỗi
  rationale: “Mọi tội lỗi” diễn đạt tự nhiên khả năng hiểu theo nghĩa phân phối của πάσης với danh từ số ít, trong khi chú thích bảo lưu khả năng hiểu theo nghĩa tập hợp.
theological_decisions:
- issue: Đối tượng của “với nhau” (μετ’ ἀλλήλων)
  choice: Sự tương giao hỗ tương giữa các tín hữu
  alternative: Sự tương giao giữa các tín hữu với Đức Chúa Trời
  rationale: Đại từ tương hỗ ἀλλήλων tự nhiên nhất chỉ mối tương giao lẫn nhau. Bối cảnh rộng hơn có nói đến sự tương giao với Đức Chúa Trời, nhưng không nên đưa cách hiểu đó vào chính cụm từ này.
- issue: Sắc thái của thì hiện tại καθαρίζει
  choice: Hành động thanh tẩy có tính hiện tại hoặc tiếp diễn, được diễn đạt bằng hiện tại đơn
  alternative: Một lần thanh tẩy; hoặc dịch tường minh là “luôn thanh tẩy”
  rationale: Hiện tại Hy Lạp có thể gợi hành động liên tục hay đặc trưng, nhưng “thanh tẩy” ở hiện tại đơn bảo lưu sắc thái ấy mà không diễn giải quá mức.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Giữ các hình ảnh “bước đi,” “ánh sáng” và “máu” của nguyên văn. Dùng “Chúa Giê-su” và đại từ tôn kính “Ngài” theo lối dùng Cơ Đốc phổ thông; tránh thuật ngữ mang dấu ấn riêng của một hệ phái.
