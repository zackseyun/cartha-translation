id: 1JN.1.9
reference: 1 John 1:9
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐὰν ὁμολογῶμεν τὰς ἁμαρτίας ἡμῶν, πιστός ἐστιν καὶ δίκαιος ἵνα ἀφῇ ἡμῖν τὰς ἁμαρτίας καὶ καθαρίσῃ ἡμᾶς ἀπὸ πάσης ἀδικίας.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/001/009.yaml
  text: If we confess our sins[a], he is faithful and righteous to forgive us our sins and to cleanse us from all unrighteousness.
translation:
  language: vi
  text: Nếu chúng ta xưng nhận tội lỗi của mình, thì Ngài là Đấng thành tín và công chính[a], để tha tội cho chúng ta và thanh tẩy chúng ta khỏi mọi sự bất chính.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch “công bằng”.
    reason: δίκαιος có thể nhấn mạnh sự công chính nói chung hoặc sự công bằng, công lý; cả hai sắc thái đều phù hợp về mặt từ vựng.
lexical_decisions:
- source_word: ἐὰν
  choice: Nếu
  rationale: Diễn đạt tự nhiên câu điều kiện loại ba trong tiếng Hy Lạp, giữ nguyên tính điều kiện mà không hàm ý quá mức về sự lặp lại.
- source_word: ὁμολογῶμεν
  choice: chúng ta xưng nhận
  rationale: “Xưng nhận” bao hàm việc thừa nhận bằng lời một cách rõ ràng, phù hợp với ngữ cảnh tội lỗi và tránh thu hẹp thành một nghi thức tôn giáo cụ thể.
- source_word: τὰς ἁμαρτίας ἡμῶν
  choice: tội lỗi của mình
  rationale: Cách nói tự nhiên trong tiếng Việt, trong đó “của mình” quy chiếu rõ về chủ ngữ “chúng ta”.
- source_word: πιστός
  choice: thành tín
  rationale: Diễn tả sự đáng tin cậy và trước sau như một của Đức Chúa Trời; đây là từ trang trọng, quen thuộc nhưng vẫn dễ hiểu.
- source_word: δίκαιος
  choice: công chính
  rationale: Giữ được nghĩa rộng về phẩm tính đúng đắn và ngay thẳng, không thu hẹp từ này chỉ còn khía cạnh xét xử hay công bằng; phương án “công bằng” được giữ trong chú thích.
- source_word: ἵνα
  choice: nên sẽ
  rationale: Trong cấu trúc này, ἵνα có thể nêu kết quả hay điều phù hợp với các phẩm tính vừa nói. “Nên sẽ” tạo câu tiếng Việt tự nhiên và cho thấy sự tha thứ, thanh tẩy phát xuất từ sự thành tín và công chính của Ngài, dù không khẳng định một cách phân loại cứng nhắc đây chỉ là mục đích hay kết quả.
- source_word: ἀφῇ ἡμῖν τὰς ἁμαρτίας
  choice: tha tội cho chúng ta
  rationale: Diễn đạt rõ nghĩa thường dùng của ἀφίημι trong ngữ cảnh tội lỗi và chuyển cấu trúc tặng cách Hy Lạp sang tiếng Việt tự nhiên.
- source_word: καθαρίσῃ
  choice: thanh tẩy
  rationale: Giữ hình ảnh loại bỏ sự ô uế về đạo đức và đứng song song tự nhiên với việc tha tội.
- source_word: ἀπὸ πάσης ἀδικίας
  choice: khỏi mọi sự bất chính
  rationale: Giữ phạm vi bao quát của πᾶς và chiều rộng đạo đức-thần học của ἀδικία, không thu hẹp thành một loại hành vi sai trái cụ thể.
theological_decisions:
- issue: Cách dịch δίκαιος khi nói về nền tảng của sự tha thứ từ Đức Chúa Trời
  choice: công chính
  alternative: công bằng
  rationale: “Công chính” giữ cả sự ngay thẳng về đạo đức lẫn việc hành động đúng đắn, không buộc câu chỉ mang nghĩa pháp lý. Vì “công bằng” cũng là một khả năng từ vựng thực sự và có thể làm nổi bật sắc thái công lý, phương án ấy được ghi ở chú thích.
- issue: Quan hệ của ἵνα với “thành tín và công chính”
  choice: nên sẽ tha… và thanh tẩy
  alternative: để tha… và thanh tẩy
  rationale: Cấu trúc Hy Lạp có thể được hiểu theo sắc thái mục đích hoặc kết quả/điều tiếp nối thích hợp. Bản dịch chọn lối diễn đạt tự nhiên trong tiếng Việt, nối hành động tha thứ và thanh tẩy với phẩm tính của Ngài mà không xây dựng thêm một cơ chế thần học không được phát biểu trong câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” theo mạch quy chiếu của đoạn văn; “xưng nhận” tránh gợi rằng câu chỉ nói đến một nghi thức giáo phái, còn “thanh tẩy” giữ nguyên hình ảnh của nguyên văn.
