id: 1JN.1.6
reference: 1 John 1:6
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐὰν εἴπωμεν ὅτι κοινωνίαν ἔχομεν μετ’ αὐτοῦ καὶ ἐν τῷ σκότει περιπατῶμεν, ψευδόμεθα καὶ οὐ ποιοῦμεν τὴν ἀλήθειαν·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/001/006.yaml
  text: If we say that we have fellowship with him and yet walk in the darkness[b][a], we are lying and are not practicing the truth.
translation:
  language: vi
  text: Nếu chúng ta nói mình có sự tương giao với Ngài mà vẫn bước đi trong bóng tối, thì chúng ta nói dối và không thực hành chân lý.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “không làm chân lý.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν εἴπωμεν
  choice: Nếu chúng ta nói
  rationale: Giữ nguyên sắc thái điều kiện của cấu trúc Hy Lạp, không thêm hàm ý mạnh hơn như “tuyên bố” hay “quả quyết”.
- source_word: κοινωνίαν ἔχομεν
  choice: mình có sự tương giao
  rationale: “Sự tương giao” diễn đạt mối quan hệ cùng chia sẻ và gắn bó của κοινωνία; “có” phản ánh trực tiếp cấu trúc Hy Lạp, còn “mình” tự nhiên khi quy chiếu lại chủ ngữ “chúng ta”.
- source_word: μετ’ αὐτοῦ
  choice: với Ngài
  rationale: Giữ đại từ như nguyên văn thay vì giải nghĩa thành “với Đức Chúa Trời”; viết hoa theo lối xưng hô tôn kính phổ biến trong tiếng Việt.
- source_word: ἐν τῷ σκότει
  choice: trong bóng tối
  rationale: Giữ hình ảnh bóng tối với ý nghĩa luân lý–thuộc linh đặc trưng trong văn chương Giăng, không thu hẹp thành một cách diễn giải như “trong tội lỗi”.
- source_word: περιπατῶμεν
  choice: bước đi
  rationale: Bảo tồn ẩn dụ chỉ nếp sống và cách cư xử; cách nói này vẫn rõ nghĩa, trang trọng và quen thuộc trong tiếng Việt Kinh Thánh.
- source_word: ψευδόμεθα
  choice: chúng ta nói dối
  rationale: Diễn đạt tự nhiên hành động hiện tại của ψευδόμεθα và tạo sự đối lập rõ với chân lý.
- source_word: οὐ ποιοῦμεν τὴν ἀλήθειαν
  choice: không thực hành chân lý
  rationale: Chuyển thành ngữ sát chữ “không làm chân lý” sang tiếng Việt tự nhiên, đồng thời giữ phương diện hành động cụ thể thay vì chỉ nói “không chân thật”.
theological_decisions:
- issue: Ẩn dụ luân lý–thuộc linh về bóng tối
  choice: Giữ nguyên “bước đi trong bóng tối”
  alternative: sống trong tội lỗi
  rationale: Trong văn chương Giăng, “bóng tối” có trường nghĩa bao gồm điều ác, sự giả dối và tình trạng xa cách Đức Chúa Trời. Giữ ẩn dụ tránh thu hẹp sự căng thẳng thần học vào một cách giải nghĩa duy nhất.
- issue: Thành ngữ “làm chân lý”
  choice: không thực hành chân lý
  alternative: không làm chân lý
  rationale: “Thực hành chân lý” cho thấy chân lý phải được thể hiện bằng đời sống, nhưng không biến câu này thành một khẳng định hệ phái về công đức hay sự cứu rỗi.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Giữ các ẩn dụ chủ đạo “bước đi” và “bóng tối”; dùng “tương giao” vì sắc thái quan hệ cùng chia sẻ của từ Hy Lạp, dù đây là thuật ngữ hơi trang trọng.
