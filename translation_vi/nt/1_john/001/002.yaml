id: 1JN.1.2
reference: 1 John 1:2
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἡ ζωὴ ἐφανερώθη, καὶ ἑωράκαμεν καὶ μαρτυροῦμεν καὶ ἀπαγγέλλομεν ὑμῖν τὴν ζωὴν τὴν αἰώνιον ἥτις ἦν πρὸς τὸν πατέρα καὶ ἐφανερώθη ἡμῖν—
base_translation:
  language: en
  yaml_path: translation/nt/1_john/001/002.yaml
  text: and the life was revealed[a], and we have seen and testify and proclaim to you the eternal life[b], which was with the Father and was revealed to us—
translation:
  language: vi
  text: và sự sống đã được bày tỏ[a]; chúng tôi đã thấy, làm chứng và công bố cho anh chị em sự sống đời đời[b], là sự sống vốn ở với Đức Cha và đã được bày tỏ cho chúng tôi—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đã hiện ra” hoặc “đã được biểu lộ” (ἐφανερώθη).'
    reason: lexical_alternative
  - marker: b
    text: Cụm từ “sự sống đời đời” được diễn đạt như một thực tại, nhưng trong ngữ cảnh quy chiếu cách cá vị đến Đức Con, Đấng vốn ở với Đức Cha và đã được bày tỏ cho chúng tôi.
    reason: cross_reference
lexical_decisions:
- source_word: ἡ ζωὴ / τὴν ζωὴν
  choice: sự sống
  rationale: Giữ nguyên danh từ lặp lại của nguyên văn. Trong tiếng Việt, không cần dịch mạo từ thành một từ riêng; tính xác định được thể hiện qua ngữ cảnh và cụm “sự sống đời đời”.
- source_word: ἐφανερώθη
  choice: đã được bày tỏ
  rationale: Phản ánh thể bị động aorist và ý nghĩa một thực tại trước kia chưa hiển lộ nay được làm cho nhận biết. Cách nói này vừa trang trọng vừa tự nhiên hơn “đã được biểu hiện”; phương án “đã hiện ra” cũng có thể.
- source_word: ἑωράκαμεν
  choice: chúng tôi đã thấy
  rationale: Diễn đạt thể hoàn thành Hy Lạp bằng lối nói tự nhiên trong tiếng Việt; lời chứng phát xuất từ kinh nghiệm tận mắt đã xảy ra và vẫn có giá trị.
- source_word: μαρτυροῦμεν
  choice: làm chứng
  rationale: Giữ rõ sắc thái nhân chứng của động từ, đồng thời là cách diễn đạt thông dụng và trang trọng trong tiếng Việt.
- source_word: ἀπαγγέλλομεν
  choice: công bố
  rationale: Phân biệt với “làm chứng” và giữ sắc thái truyền đạt công khai, có thẩm quyền; mạnh hơn “báo lại” nhưng không thêm ý ngoài nguyên văn.
- source_word: ὑμῖν
  choice: cho anh chị em
  rationale: Diễn đạt túc từ gián tiếp số nhiều. “Anh chị em” là cách xưng hô cộng đồng tự nhiên, bao quát trong tiếng Việt hiện đại.
- source_word: τὴν ζωὴν τὴν αἰώνιον
  choice: sự sống đời đời
  rationale: Giữ danh từ xác định cùng tính từ αἰώνιος mà không biến cụm từ thành đại từ hay trực tiếp thêm danh xưng “Con”.
- source_word: ἥτις
  choice: là sự sống vốn
  rationale: Tiếng Việt không thuận khi dùng “mà” với tiền ngữ phi nhân cách rồi nói “ở với Đức Cha”. Việc lặp “sự sống” giữ đúng tiền ngữ ngữ pháp và từ “vốn” diễn đạt trạng thái đã có từ trước, nhưng không chuyển thành “Ngài” hay gọi đích danh Đức Con.
- source_word: ἦν πρὸς τὸν πατέρα
  choice: vốn ở với Đức Cha
  rationale: “Ở với” là cách diễn đạt tự nhiên cho quan hệ gần gũi trong πρὸς, đồng thời liên hệ với cách dùng của văn chương Giăng mà không diễn giải quá mức.
- source_word: τὸν πατέρα
  choice: Đức Cha
  rationale: Dùng danh hiệu thần học quen thuộc, trang trọng để chỉ Đức Chúa Trời là Cha.
- source_word: ἡμῖν
  choice: cho chúng tôi
  rationale: Giữ rõ đối tượng tiếp nhận sự bày tỏ và nhấn mạnh nền tảng nhân chứng của lời công bố.
theological_decisions:
- issue: Nên diễn đạt “sự sống” theo cách phi nhân xưng hay trực tiếp nhân xưng hóa
  choice: Giữ “sự sống” và “sự sống đời đời” trong chính văn.
  alternative: Dùng “Ngài”, “Đấng ấy” hoặc thêm trực tiếp “Đức Con”.
  rationale: Ngữ cảnh hướng đến Đức Con, nhưng nguyên văn dùng danh từ ζωὴ chứ không dùng đại từ giống đực hay gọi tên Đức Con. Giữ danh từ bảo tồn tính phong phú và độ căng thần học của lời văn.
- issue: Mức độ biểu đạt sự tiền hữu trong πρὸς τὸν πατέρα
  choice: “vốn ở với Đức Cha”
  alternative: “vốn hiện diện trước mặt Đức Cha” hoặc diễn giải rõ là Đức Con đã hiện hữu từ trước.
  rationale: “Vốn ở với Đức Cha” vừa chuyển tải quan hệ và trạng thái có trước sự bày tỏ, vừa không thêm một công thức tín lý vào câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “chúng tôi” cho nhóm nhân chứng và “anh chị em” cho độc giả số nhiều. Dấu gạch ngang cuối câu được giữ vì câu 2 là phần chen giữa trong mạch cú pháp nối từ câu 1 sang câu 3.
