id: 1JN.1.5
reference: 1 John 1:5
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Καὶ ἔστιν αὕτη ἡ ἀγγελία ἣν ἀκηκόαμεν ἀπ’ αὐτοῦ καὶ ἀναγγέλλομεν ὑμῖν, ὅτι ὁ θεὸς φῶς ἐστιν καὶ σκοτία ⸂ἐν αὐτῷ οὐκ ἔστιν⸃ οὐδεμία.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/001/005.yaml
  text: 'And this is the message that we have heard from him and announce to you: that God is light[a], and there is no darkness at all in him.'
translation:
  language: vi
  text: 'Và đây là sứ điệp chúng tôi đã nghe từ Ngài và loan báo cho anh em: Đức Chúa Trời là ánh sáng, và trong Ngài hoàn toàn không có bóng tối.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγγελία
  choice: sứ điệp
  rationale: “Sứ điệp” tự nhiên trong văn cảnh thư tín và diễn đạt nội dung được tiếp nhận rồi truyền lại; trang trọng hơn “thông điệp” nhưng vẫn dễ hiểu.
- source_word: ἀκηκόαμεν
  choice: chúng tôi đã nghe
  rationale: Diễn đạt hành động nghe đã xảy ra và vẫn có giá trị ở hiện tại, phù hợp sắc thái của thì hoàn thành Hy Lạp.
- source_word: ἀπ’ αὐτοῦ
  choice: từ Ngài
  rationale: Giữ nguyên đại từ như bản Hy Lạp, không tự ý xác định rõ là Chúa Giê-su hay Đức Chúa Con; viết hoa theo quy ước tiếng Việt khi đại từ chỉ về Đấng thiêng liêng.
- source_word: ἀναγγέλλομεν
  choice: loan báo
  rationale: Diễn đạt việc công bố điều đã được nghe và phần nào duy trì liên hệ nghĩa với ἀγγελία; “loan báo” tự nhiên, trang trọng trong tiếng Việt hiện đại.
- source_word: ὅτι
  choice: ':'
  rationale: Dấu hai chấm giới thiệu trực tiếp nội dung của sứ điệp một cách tự nhiên trong tiếng Việt, tương ứng chức năng nội dung của ὅτι.
- source_word: ὁ θεὸς φῶς ἐστιν
  choice: Đức Chúa Trời là ánh sáng
  rationale: Giữ nguyên ẩn dụ định tính, không thêm “thánh khiết”, “thuần khiết” hay mạo từ xác định vốn sẽ thu hẹp hoặc diễn giải ý nghĩa.
- source_word: σκοτία
  choice: bóng tối
  rationale: “Bóng tối” giữ được cả hình ảnh vật lý lẫn sức gợi đạo đức-thần học trong văn chương Giăng.
- source_word: ἐν αὐτῷ
  choice: trong Ngài
  rationale: Bảo toàn cách diễn đạt không gian-ẩn dụ của nguyên văn mà không giải nghĩa quá mức.
- source_word: οὐδεμία
  choice: hoàn toàn không có
  rationale: Kết hợp với phủ định để chuyển tải sắc thái nhấn mạnh tuyệt đối của οὐδεμία bằng tiếng Việt tự nhiên.
theological_decisions:
- issue: Ẩn dụ vị ngữ “Đức Chúa Trời là ánh sáng”
  choice: Giữ trực tiếp ẩn dụ “Đức Chúa Trời là ánh sáng”.
  alternative: “Đức Chúa Trời là ánh sáng thánh khiết” hoặc “Đức Chúa Trời là ánh sáng thuần khiết”.
  rationale: Nguyên văn không giải thích ánh sáng theo một thuộc tính duy nhất. Giữ nguyên hình ảnh bảo toàn chiều rộng thần học và sức mạnh văn chương.
- issue: Đối tượng của đại từ αὐτοῦ
  choice: Giữ là “Ngài”.
  alternative: Nêu rõ “Chúa Giê-su” hoặc “Đức Chúa Con”.
  rationale: Dù ngữ cảnh có thể giúp nhận diện đối tượng, nguyên văn dùng đại từ; việc thay bằng danh xưng sẽ giải quyết điều bản văn để ngầm.
translation_notes:
  register: Văn phong tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh em” cho ὑμῖν theo lối xưng hô cộng đồng trong thư tín; cụm này có thể bao hàm toàn thể độc giả chứ không nhất thiết chỉ nam giới. Không đặt chú thích vì câu này không có biến thể hoặc phương án dịch nào cần thiết cho việc đọc hiểu; chú thích [a] trong lớp tham khảo tiếng Anh có vẻ gắn nhầm vị trí với “light” dù nội dung nói về “proclaim”.
