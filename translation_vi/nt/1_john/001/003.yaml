id: 1JN.1.3
reference: 1 John 1:3
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὃ ἑωράκαμεν καὶ ἀκηκόαμεν ἀπαγγέλλομεν ⸀καὶ ὑμῖν, ἵνα καὶ ὑμεῖς κοινωνίαν ἔχητε μεθ’ ἡμῶν· καὶ ἡ κοινωνία δὲ ἡ ἡμετέρα μετὰ τοῦ πατρὸς καὶ μετὰ τοῦ υἱοῦ αὐτοῦ Ἰησοῦ Χριστοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/001/003.yaml
  text: What we have seen and heard we also proclaim to you[a], so that you too may have fellowship with us; and indeed our fellowship is with the Father and with his Son[b], Jesus the Messiah.
translation:
  language: vi
  text: Điều chúng tôi đã thấy và đã nghe, chúng tôi cũng công bố cho anh chị em, để anh chị em cũng có sự thông công[a] với chúng tôi. Thật vậy, sự thông công của chúng tôi là với Đức Chúa Cha và với Con Ngài là Giê-su, Đấng Mê-si-a.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Thông công” cũng có thể dịch là “hiệp thông”, “cùng dự phần” hoặc “chia sẻ”, nhấn mạnh đời sống chung và mối quan hệ cùng nhau.
    reason: lexical_alternative
  - marker: b
    text: “Đấng Mê-si-a” cũng có thể dịch là “Đấng Ki-tô”. Từ Hy Lạp Χριστός là tước hiệu có nghĩa là “Đấng được xức dầu”.
    reason: alternative_reading
lexical_decisions:
- source_word: ὃ
  choice: Điều
  rationale: Đại từ quan hệ trung tính số ít, quy chiếu rộng đến điều đã được thấy và nghe; “Điều” tự nhiên trong tiếng Việt và không biến quy chiếu thành một nhân vật.
- source_word: ἑωράκαμεν καὶ ἀκηκόαμεν
  choice: chúng tôi đã thấy và đã nghe
  rationale: Hai động từ hoàn thành nhấn mạnh chứng nghiệm trong quá khứ vẫn có giá trị làm chứng ở hiện tại; tiếng Việt dùng “đã” để thể hiện rõ cả hai hành động.
- source_word: ἀπαγγέλλομεν καὶ ὑμῖν
  choice: chúng tôi cũng công bố cho anh chị em
  rationale: “Công bố” diễn đạt hành vi báo truyền dựa trên lời chứng; “cũng” thể hiện καί. “Anh chị em” là cách gọi tự nhiên, bao quát cộng đồng người nhận.
- source_word: ἵνα καὶ ὑμεῖς
  choice: để anh chị em cũng
  rationale: “Để” thể hiện mục đích của ἵνα, còn “cũng” giữ sắc thái của καί.
- source_word: κοινωνίαν ἔχητε μεθ’ ἡμῶν
  choice: được thông công với chúng tôi
  rationale: “Thông công” diễn đạt sự cùng dự phần và mối quan hệ chung; “được” tạo câu tiếng Việt tự nhiên trong mệnh đề chỉ mục đích mà không loại trừ ý chủ động dự phần.
- source_word: καὶ ἡ κοινωνία δὲ ἡ ἡμετέρα
  choice: Thật vậy, sự thông công của chúng tôi
  rationale: “Thật vậy” chuyển tải lực giải thích và nhấn mạnh của καὶ…δέ; cụm sở hữu được giữ rõ.
- source_word: μετὰ τοῦ πατρὸς
  choice: với Đức Chúa Cha
  rationale: Cách xưng hô trang trọng và quen thuộc trong tiếng Việt, thể hiện “Cha” là danh xưng dành cho Đức Chúa Trời.
- source_word: μετὰ τοῦ υἱοῦ αὐτοῦ
  choice: với Con Ngài
  rationale: Giữ nguyên quan hệ phụ tử và sở hữu; viết hoa “Con” vì đây là tước hiệu chỉ Chúa Giê-su.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Chúa Giê-su, Đấng Mê-si-a
  rationale: Χριστός ở đây có thể được hiểu theo chức danh; “Đấng Mê-si-a” bảo toàn nghĩa “Đấng được xức dầu”. “Chúa Giê-su” là cách gọi trang trọng, tự nhiên trong văn phong Kinh Thánh tiếng Việt.
theological_decisions:
- issue: Nghĩa của κοινωνία
  choice: sự thông công
  alternative: sự hiệp thông; sự dự phần; sự chia sẻ
  rationale: “Thông công” giữ được cả chiều kích quan hệ lẫn cùng dự phần, không thu hẹp câu vào giao tiếp xã hội hay một nghi thức bí tích.
- issue: Cách dịch Χριστοῦ
  choice: Đấng Mê-si-a
  alternative: Đấng Ki-tô; Christ
  rationale: Giữ Χριστός như một chức danh mang nghĩa “Đấng được xức dầu”, đồng thời chú thích phương án truyền thống để không che khuất khả năng cách đọc đã trở nên gần như tên riêng.
- issue: Phạm vi của sự thông công
  choice: sự thông công của chúng tôi là với Đức Chúa Cha và với Con Ngài
  alternative: chúng ta thông công với Đức Chúa Cha và Con Ngài
  rationale: Giữ đại từ ngôi thứ nhất số nhiều và cấu trúc sở hữu của nguyên văn, không đồng nhất trước “chúng tôi” với toàn bộ độc giả hay giải thích thêm bản chất thần học của mối thông công.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Dùng “anh chị em” để chỉ cộng đồng người nhận; dùng “Đức Chúa Cha”, “Con Ngài” và “Chúa Giê-su” theo lối xưng hô Kinh Thánh tiếng Việt phổ thông. Hai dấu chú thích được đặt sau cụm cuối câu để bảo đảm đều xuất hiện trong chính văn; nội dung chú thích lần lượt giải thích “Đấng Mê-si-a” và “thông công”.
