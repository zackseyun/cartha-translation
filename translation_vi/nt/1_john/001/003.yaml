  terminology: “Thông công”, “Đức Chúa Cha”, “Con Ngài” và “Đấng Mê-si-a” đều phù hợp. Không nên thêm “Chúa” trước “Giê-su” khi từ κύριος không xuất hiện. Các ký hiệu chú thích được chuyển về ngay sau từ/cụm từ mà chúng giải thích.
