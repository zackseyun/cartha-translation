  to: Điều chúng tôi đã thấy và đã nghe, chúng tôi cũng công bố cho anh chị em, để anh chị em cũng có sự thông công[a] với chúng tôi. Thật vậy, sự thông công của chúng tôi là với Đức Chúa Cha và với Con Ngài là Giê-su, Đấng Mê-si-a.[b]
