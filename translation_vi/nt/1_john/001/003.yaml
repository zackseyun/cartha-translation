    rationale: Chú thích về “thông công” và “Đấng Mê-si-a” đều được đặt cuối câu theo thứ tự đảo/ngữ cảnh xa cụm từ được chú giải. Cần đặt từng ký hiệu ngay sau thuật ngữ tương ứng.
