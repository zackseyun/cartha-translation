id: 1JN.1.10
reference: 1 John 1:10
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐὰν εἴπωμεν ὅτι οὐχ ἡμαρτήκαμεν, ψεύστην ποιοῦμεν αὐτὸν καὶ ὁ λόγος αὐτοῦ οὐκ ἔστιν ἐν ἡμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/001/010.yaml
  text: If we say that we have not sinned[a], we make him a liar[b], and his word is not in us.
translation:
  language: vi
  text: Nếu chúng ta nói rằng chúng ta đã không phạm tội[a], thì chúng ta cho Ngài là kẻ nói dối, và lời của Ngài không ở trong chúng ta.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “chúng ta không phạm tội.” Động từ Hy Lạp ở thì hoàn thành, nói đến hành động trong quá khứ có ý nghĩa đối với hiện tại; tiếng Việt không có một hình thức hoàn toàn tương đương.'
    reason: lexical_alternative
  - marker: b
    text: “Lời” cũng có thể dịch là “sứ điệp.” Từ Hy Lạp λόγος có thể mang cả hai nghĩa; ở đây giữ “lời” để duy trì cách diễn đạt của câu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν εἴπωμεν
  choice: Nếu chúng ta nói
  rationale: Giữ nguyên sắc thái điều kiện của ἐὰν với động từ giả định, đồng thời dùng cách diễn đạt tự nhiên trong tiếng Việt; không thêm sắc thái mạnh hơn như “quả quyết” hay “tuyên bố”.
- source_word: οὐχ ἡμαρτήκαμεν
  choice: mình đã không phạm tội
  rationale: Từ “đã” giúp thể hiện hành động trong quá khứ của thì hoàn thành Hy Lạp, còn “mình” tự nhiên khi quy chiếu lại chủ ngữ “chúng ta”. Tiếng Việt không có một hình thức tương đương hoàn toàn với thì hoàn thành nên giữ thêm chú thích về sắc thái.
- source_word: ψεύστην
  choice: kẻ nói dối
  rationale: Giữ ψεύστης như một danh từ chỉ người, không làm nhẹ thành tính từ “sai” hay “không chân thật”.
- source_word: ποιοῦμεν αὐτὸν
  choice: chúng ta khiến Ngài thành
  rationale: 'Phản ánh cấu trúc ποιέω với bổ ngữ vị ngữ: lời phủ nhận của con người quy Ngài thành kẻ nói dối. Cách dịch giữ sức nặng trực tiếp của nguyên văn.'
- source_word: ὁ λόγος αὐτοῦ
  choice: lời của Ngài
  rationale: “Lời” vừa tự nhiên trong văn cảnh vừa duy trì cách dùng λόγος đặc trưng của các trước tác Giăng, đồng thời không loại trừ nghĩa “sứ điệp”.
- source_word: οὐκ ἔστιν ἐν ἡμῖν
  choice: không ở trong chúng ta
  rationale: Giữ hình ảnh nội tại của ἐν ἡμῖν mà không thêm ý “ngự” hay “ở lại”, vốn không được diễn đạt trực tiếp trong câu Hy Lạp.
theological_decisions:
- issue: Đối tượng được nói đến bởi αὐτόν / αὐτοῦ
  choice: Giữ đại từ “Ngài”; theo văn cảnh, đại từ này chỉ Đức Chúa Trời.
  alternative: Thay trực tiếp bằng “Đức Chúa Trời”.
  rationale: Văn cảnh 1 Giăng 1:5–10 cho thấy lời chứng bị phủ nhận là của Đức Chúa Trời, nhưng nguyên văn dùng đại từ. Giữ đại từ bảo toàn cách diễn đạt và mạch quy chiếu của bản Hy Lạp.
- issue: Ý nghĩa của việc “khiến Ngài thành kẻ nói dối”
  choice: Giữ lời khẳng định mạnh và trực tiếp của nguyên văn.
  alternative: Diễn giải nhẹ hơn là “coi Ngài như kẻ nói dối” hoặc “cho rằng Ngài nói dối”.
  rationale: Cấu trúc Hy Lạp quy kết hậu quả của lời phủ nhận tội lỗi mà không hàm ý con người thực sự thay đổi bản tính của Đức Chúa Trời. Không làm dịu căng thẳng thần học của câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “chúng ta” để bao gồm cả người viết lẫn độc giả; dùng “mình” trong mệnh đề nội dung để tránh lặp nặng nề. Viết hoa “Ngài” theo quy ước tiếng Việt khi đại từ chỉ Đức Chúa Trời.
