source:
  edition: SBLGNT
  text: ἐὰν εἴπωμεν ὅτι ἁμαρτίαν οὐκ ἔχομεν, ἑαυτοὺς πλανῶμεν καὶ ἡ ἀλήθεια ⸂οὐκ ἔστιν ἐν ἡμῖν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/001/008.yaml
  text: If we say that we have no sin[a], we deceive ourselves, and the truth is not in us.
translation:
  language: vi
  text: Nếu chúng ta nói rằng chúng ta không có tội lỗi[a], thì chúng ta tự lừa dối mình, và sự thật không ở trong chúng ta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc, theo cách diễn giải: “không có tính tội lỗi”; tiếng Hy Lạp nói đơn giản là “tội”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν εἴπωμεν
  choice: Nếu chúng ta nói
  rationale: Diễn đạt tự nhiên cấu trúc điều kiện với ἐὰν và động từ giả định; không cần thêm sắc thái “giả sử” vốn có thể làm câu nặng hơn.
- source_word: ἁμαρτίαν οὐκ ἔχομεν
  choice: mình không có tội
  rationale: Giữ cách nói “có tội” của tiếng Hy Lạp, trong đó danh từ số ít không có mạo từ chỉ sự hiện diện của tội lỗi, chứ không riêng một hành vi phạm tội. “Mình” quy chiếu tự nhiên về chủ ngữ “chúng ta” trong mệnh đề thuật lời.
- source_word: ἑαυτοὺς πλανῶμεν
  choice: chúng ta tự lừa dối mình
  rationale: Đại từ phản thân cho thấy đối tượng bị lừa dối chính là người đưa ra lời tuyên bố; cách diễn đạt này rõ ràng và tự nhiên trong tiếng Việt.
- source_word: ἡ ἀλήθεια
  choice: sự thật
  rationale: Giữ danh từ có tính xác định và không thu hẹp nghĩa thành riêng “sự chân thật” hay mở rộng thành “chân lý của Đức Chúa Trời”.
- source_word: οὐκ ἔστιν ἐν ἡμῖν
  choice: không ở trong chúng ta
  rationale: Bám sát giới từ ἐν, đồng thời giữ chiều kích nội tại và cá nhân của phát biểu.
theological_decisions:
- issue: Ý nghĩa của “tội” trong lời nói “không có tội”
  choice: Dùng “không có tội”, chỉ sự hiện diện của tội trong con người.
  alternative: “không phạm tội” hoặc “không có bản tính tội lỗi”
  rationale: Nguyên văn dùng ἁμαρτίαν với ἔχομεν, khác với cách nói về việc đã phạm tội ở câu 10. Bản dịch không biến ý này thành một hành vi riêng lẻ hoặc thành một thuật ngữ thần học cụ thể hơn nguyên văn.
- issue: Ý nghĩa của “sự thật không ở trong chúng ta”
  choice: Giữ nguyên hình ảnh “sự thật không ở trong chúng ta”.
  alternative: “chân lý của Đức Chúa Trời không ở trong chúng ta” hoặc “chúng ta không sống theo sự thật”
  rationale: Cách nói của Giăng có thể gợi cả chân lý khách quan lẫn sự chân thật nơi con người; không nên giải nghĩa thay cho nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “chúng ta” để giữ ngôi thứ nhất số nhiều bao hàm; giữ cấu trúc ngắn, trực tiếp và tính đối xứng của câu Hy Lạp.
