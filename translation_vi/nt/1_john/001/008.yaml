revisions:
- from: Nếu chúng ta nói rằng mình không có tội[a], thì chúng ta tự lừa dối mình, và sự thật không ở trong chúng ta.
  to: Nếu chúng ta nói rằng chúng ta không có tội lỗi[a], thì chúng ta tự lừa dối mình, và sự thật không ở trong chúng ta.
  rationale: Sửa cụm chỉ lời tuyên bố phủ nhận tội để phản ánh rõ hơn danh từ số ít không mạo từ ἁμαρτίαν như danh từ khối, đồng thời tránh cách hiểu “vô tội” hoặc chỉ phủ nhận các hành vi đã phạm. Các thành phần còn lại trung thành với nguyên văn và tự nhiên trong văn phong Kinh Thánh tiếng Việt hiện đại.
