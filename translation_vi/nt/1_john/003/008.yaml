source:
  edition: SBLGNT
  text: ὁ ποιῶν τὴν ἁμαρτίαν ἐκ τοῦ διαβόλου ἐστίν, ὅτι ἀπ’ ἀρχῆς ὁ διάβολος ἁμαρτάνει. εἰς τοῦτο ἐφανερώθη ὁ υἱὸς τοῦ θεοῦ ἵνα λύσῃ τὰ ἔργα τοῦ διαβόλου.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/008.yaml
  text: 'The one who practices sin is from the devil[a], because the devil has been sinning from the beginning[d][c][b]. For this purpose the Son of God was revealed: to destroy the works of the devil.'
translation:
  language: vi
  text: 'Người nào cứ phạm tội thì thuộc về ma quỷ[a], vì ma quỷ phạm tội từ ban đầu[b]. Con Đức Chúa Trời đã được bày tỏ[c] vì mục đích này: để phá hủy các công việc của ma quỷ[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sát nghĩa hơn: “là từ ma quỷ.” Cụm từ Hy Lạp diễn tả nguồn hoặc sự liên kết về đạo đức–thuộc linh. Cũng có thể dịch phần đầu câu là: “Người phạm tội,” nhưng dạng hiện tại gợi một hành động đang tiếp diễn hoặc có tính đặc trưng.'
    reason: lexical_alternative
  - marker: b
    text: “Từ ban đầu” không xác định rõ một thời điểm cụ thể; cụm từ này có thể gợi đến khởi đầu hoạt động phạm tội của ma quỷ hoặc thuở ban đầu nói chung. Động từ ở thì hiện tại diễn tả sự phạm tội tiếp diễn từ thời điểm ấy.
    reason: preserve_ambiguity
  - marker: c
    text: 'Cũng có thể dịch: “đã xuất hiện.” Từ Hy Lạp nhấn mạnh việc được biểu lộ hoặc được làm cho nhận biết.'
    reason: lexical_alternative
  - marker: d
    text: 'Cũng có thể dịch: “tháo gỡ” hoặc “làm tan rã các công việc của ma quỷ.” Động từ Hy Lạp có nghĩa gốc là tháo, cởi, rồi mở rộng thành phá vỡ hoặc phá hủy.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ποιῶν τὴν ἁμαρτίαν
  choice: người nào cứ phạm tội
  rationale: Phân từ hiện tại ποιῶν diễn tả hành động đang tiếp diễn hoặc có tính đặc trưng. “Cứ phạm tội” tự nhiên trong tiếng Việt và tránh khiến câu bị hiểu là chỉ nói đến một hành vi đơn lẻ.
- source_word: ἐκ τοῦ διαβόλου
  choice: thuộc về ma quỷ
  rationale: ἐκ chỉ nguồn gốc hoặc sự liên kết về phương diện đạo đức–thuộc linh. “Thuộc về” truyền đạt ý này tự nhiên hơn cách dịch sát chữ “từ ma quỷ,” đồng thời không hàm ý sự sinh thành theo bản thể.
- source_word: διάβολος
  choice: ma quỷ
  rationale: Trong ngữ cảnh này, διάβολος là danh xưng đã xác lập cho đối thủ thuộc linh, không chỉ mang nghĩa từ vựng chung là “kẻ vu khống.”
- source_word: ὅτι ἀπ’ ἀρχῆς
  choice: vì ... từ ban đầu
  rationale: ὅτι nêu lý do; “từ ban đầu” giữ nguyên độ rộng và sự mơ hồ có chủ ý của cách diễn đạt Giăng mà không xác định đó là thời điểm nào.
- source_word: ἁμαρτάνει
  choice: đã phạm tội
  rationale: Kết hợp với “từ ban đầu,” dạng hiện tại Hy Lạp diễn tả hoạt động đặc trưng kéo dài. Trong tiếng Việt, “đã phạm tội từ ban đầu” diễn đạt tự nhiên điểm khởi đầu trong quá khứ, dù sắc thái tiếp diễn chủ yếu do ngữ cảnh đảm nhiệm.
- source_word: εἰς τοῦτο
  choice: vì mục đích này
  rationale: Cụm từ hướng tới mệnh đề mục đích với ἵνα; cách dịch này làm rõ quan hệ hướng đích mà không bổ sung nội dung.
- source_word: ἐφανερώθη
  choice: đã được bày tỏ
  rationale: Giữ thể bị động và ý nghĩa được biểu lộ, được làm cho nhận biết; sâu hơn “đã xuất hiện” nhưng không nặng tính cổ văn như “đã được hiển hiện.”
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: Con Đức Chúa Trời
  rationale: Cách gọi trang trọng, quen thuộc và chính xác cho tước hiệu chỉ quan hệ làm Con trong nguyên văn.
- source_word: ἵνα λύσῃ
  choice: để phá hủy
  rationale: λύω có nghĩa gốc là tháo, cởi hoặc làm tan rã; với “các công việc của ma quỷ,” “phá hủy” diễn đạt sự triệt phá dứt khoát và tự nhiên trong tiếng Việt.
- source_word: τὰ ἔργα τοῦ διαβόλου
  choice: các công việc của ma quỷ
  rationale: Giữ số nhiều và quan hệ sở hữu của nguyên văn; “công việc” đủ rộng để bao gồm hoạt động tội lỗi và những hậu quả do ma quỷ gây nên.
theological_decisions:
- issue: Sắc thái của ngôn ngữ phạm tội ở thì hiện tại trong đạo đức học của thư Giăng
  choice: Diễn tả hành động tiếp diễn hoặc có tính đặc trưng bằng “cứ phạm tội”
  alternative: Hiểu như một lời khẳng định tuyệt đối về bất kỳ hành vi phạm tội đơn lẻ nào
  rationale: Cách dịch này phản ánh phân từ hiện tại và giữ sự căng thẳng với 1 Giăng 1:8–2:2, nơi tác giả thừa nhận tín hữu vẫn có thể phạm tội, thay vì tạo ra một mâu thuẫn không có trong dụng ý ngữ pháp.
- issue: Ý nghĩa của ἐκ τοῦ διαβόλου
  choice: Sự thuộc về hoặc liên kết với ma quỷ về đạo đức–thuộc linh
  alternative: Được sinh ra từ ma quỷ theo nghĩa bản thể
  rationale: Cụm từ nói đến nguồn hay phe thuộc linh trong lối diễn đạt nhị nguyên của Giăng, chứ không khẳng định ma quỷ sinh ra con người theo nghĩa đen.
- issue: Mục đích Con Đức Chúa Trời được bày tỏ
  choice: Để phá hủy các công việc của ma quỷ
  alternative: Chỉ để phơi bày các công việc của ma quỷ
  rationale: Mệnh đề ἵνα + động từ giả định aorist nêu mục đích, còn λύσῃ trong ngữ cảnh này chỉ việc tháo gỡ, làm tan rã hoặc triệt phá, không chỉ là làm cho lộ ra.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. “Cứ phạm tội” thể hiện tính tiếp diễn/đặc trưng; “thuộc về ma quỷ” tự nhiên hơn lối dịch sát chữ. Các thuật ngữ “Con Đức Chúa Trời,” “được bày tỏ” và “phá hủy” giữ sắc thái thần học của nguyên văn mà không thêm diễn giải giáo phái.
