  source_fidelity: 'Bản dịch phản ánh đúng cấu trúc và các ý chính của nguyên văn: hành vi phạm tội có tính đặc trưng, sự thuộc về/nguồn gốc thuộc linh từ ma quỷ, sự bày tỏ của Con Đức Chúa Trời, và mục đích phá hủy các công việc của ma quỷ. Tuy nhiên, “ma quỷ đã phạm tội từ ban đầu” dễ được hiểu là một hành vi quá khứ đã hoàn tất, trong khi ἁμαρτάνει ở thì hiện tại, đi với ἀπ’ ἀρχῆς, nói về sự phạm tội liên tục từ ban đầu. Bỏ “đã” giữ được sắc thái hiện tại–kéo dài tự nhiên hơn trong tiếng Việt.'
