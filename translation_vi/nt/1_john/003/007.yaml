id: 1JN.3.7
reference: 1 John 3:7
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: τεκνία, μηδεὶς πλανάτω ὑμᾶς· ὁ ποιῶν τὴν δικαιοσύνην δίκαιός ἐστιν, καθὼς ἐκεῖνος δίκαιός ἐστιν·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/007.yaml
  text: Little children, let no one deceive you. The one who practices righteousness is righteous, just as that one is righteous.
translation:
  language: vi
  text: Hỡi các con, đừng để ai lừa dối các con.[a] Người thực hành sự công chính[c] là người công chính, cũng như Đấng ấy là công chính.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đừng để ai dẫn các con đi sai lạc.”'
    reason: lexical_alternative
  - marker: b
    text: Nguyên văn Hy Lạp là “Đấng ấy”; rất có thể chỉ Đấng Christ, dù một số người hiểu là chỉ Đức Chúa Trời.
    reason: alternative_reading
  - marker: c
    text: Cũng có thể dịch là “công lý”; tại đây, từ này nói đến cách sống ngay thẳng, phù hợp với việc là người công chính.
    reason: lexical_alternative
lexical_decisions:
- source_word: τεκνία
  choice: Hỡi các con
  rationale: Cách xưng hô này giữ sắc thái gia đình và trìu mến của dạng chỉ con nhỏ, đồng thời tự nhiên hơn trong tiếng Việt hiện đại so với cách dịch sát là “các con bé nhỏ”.
- source_word: μηδεὶς πλανάτω ὑμᾶς
  choice: đừng để ai lừa dối các con
  rationale: Diễn đạt tự nhiên cấu trúc cấm đoán; “lừa dối” phù hợp với ngữ cảnh cảnh báo về sự sai lạc trong giáo huấn và đời sống.
- source_word: ὁ ποιῶν
  choice: Người thực hành
  rationale: Phân từ hiện tại có mạo từ chỉ một lối sống hay hành vi mang tính thường xuyên; “thực hành” thể hiện điều này rõ hơn một hành động đơn lẻ.
- source_word: τὴν δικαιοσύνην
  choice: sự công chính
  rationale: Giữ mối liên hệ từ vựng với δίκαιος và diễn đạt phẩm chất, cách sống ngay thẳng trong ngữ cảnh này; “công lý” vẫn là một khả năng từ vựng nhưng không phải trọng tâm ở đây.
- source_word: δίκαιός ἐστιν
  choice: là người công chính / là công chính
  rationale: “Công chính” giữ sự tương ứng với δικαιοσύνη. Với chủ thể là con người, thêm “người” giúp câu tiếng Việt tự nhiên; ở vế nói về Đấng ấy, dùng trực tiếp “là công chính”.
- source_word: καθὼς
  choice: cũng như
  rationale: Diễn đạt rõ quan hệ so sánh và sự tương ứng với chuẩn mực được nêu ở vế sau.
- source_word: ἐκεῖνος
  choice: Đấng ấy
  rationale: Giữ yếu tố chỉ định của đại từ Hy Lạp và cho thấy đây là một nhân vật thần linh được tôn kính, nhưng không thay đại từ bằng “Đấng Christ” hay “Đức Chúa Trời”, nhờ đó không quyết định quá mức đối tượng quy chiếu.
theological_decisions:
- issue: Đối tượng quy chiếu của ἐκεῖνος
  choice: Giữ cách nói chỉ định “Đấng ấy” trong chính văn; trong ngữ cảnh, từ này rất có thể chỉ Đấng Christ.
  alternative: Có thể hiểu là Đức Chúa Trời/Đức Chúa Cha, hoặc là một cách chỉ Đấng thần linh có chủ ý để ngỏ.
  rationale: Cách dùng trong 1 Giăng và bối cảnh noi theo về đạo đức nghiêng về Đấng Christ, nhưng nguyên văn không nêu danh xưng. “Đấng ấy” giữ được sắc thái tôn kính và tính chỉ định mà không âm thầm giải quyết điểm còn có thể tranh luận.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. “Hỡi các con” giữ giọng người cha thuộc linh trìu mến mà không gợi rằng người nghe nhất thiết là trẻ nhỏ. Các thuật ngữ “sự công chính” và “công chính” được giữ song song để phản ánh liên hệ giữa δικαιοσύνη và δίκαιος trong nguyên văn.
