  to: Ai đã được Đức Chúa Trời sinh ra thì không tiếp tục phạm tội,[a] vì hạt giống của Ngài vẫn ở trong người ấy; người ấy không thể cứ phạm tội,[b] vì đã được Đức Chúa Trời sinh ra.
