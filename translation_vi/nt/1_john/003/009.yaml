id: 1JN.3.9
reference: 1 John 3:9
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: πᾶς ὁ γεγεννημένος ἐκ τοῦ θεοῦ ἁμαρτίαν οὐ ποιεῖ, ὅτι σπέρμα αὐτοῦ ἐν αὐτῷ μένει, καὶ οὐ δύναται ἁμαρτάνειν, ὅτι ἐκ τοῦ θεοῦ γεγέννηται.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/009.yaml
  text: Everyone who has been born of God does not practice sin[a], because his seed remains in him; and he is not able to keep sinning[c][b], because he has been born of God.
translation:
  language: vi
  text: Ai đã được Đức Chúa Trời sinh ra thì không tiếp tục phạm tội,[a] vì hạt giống của Ngài vẫn ở trong người ấy; người ấy không thể cứ phạm tội,[b] vì đã được Đức Chúa Trời sinh ra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát hơn: “không làm tội” hoặc “không phạm tội.” Trong ngữ cảnh, cách nói Hy Lạp có lẽ chỉ việc tiếp tục thực hành tội lỗi hơn là một hành vi riêng lẻ.'
    reason: lexical_alternative
  - marker: b
    text: 'Dịch sát hơn: “không thể phạm tội.” Động từ nguyên thể ở thì hiện tại trong ngữ cảnh có lẽ mang nghĩa “không thể cứ phạm tội” hoặc “không thể tiếp tục phạm tội.”'
    reason: alternative_reading
lexical_decisions:
- source_word: πᾶς ὁ γεγεννημένος ἐκ τοῦ θεοῦ
  choice: Ai đã được Đức Chúa Trời sinh ra
  rationale: Cách diễn đạt này giữ ý khái quát của πᾶς cùng trạng thái kéo dài do thì hoàn thành của γεγεννημένος, đồng thời diễn tả ἐκ là nguồn gốc trong ngôn ngữ về sự sinh ra bởi Đức Chúa Trời.
- source_word: ἁμαρτίαν οὐ ποιεῖ
  choice: không sống trong tội lỗi
  rationale: Cụm ποιεῖ ἁμαρτίαν trong ngữ cảnh chỉ lối sống hay hành vi tiếp diễn, không nhất thiết là một lần phạm tội riêng lẻ. Cách dịch này tự nhiên trong tiếng Việt và không làm mất sức nặng của mệnh đề.
- source_word: σπέρμα αὐτοῦ
  choice: hạt giống của Ngài
  rationale: Giữ nguyên hình ảnh cụ thể của σπέρμα vì đối tượng ẩn dụ có thể được hiểu theo nhiều cách; không diễn giải thành lời, sự sống hay bản tính của Đức Chúa Trời.
- source_word: ἐν αὐτῷ μένει
  choice: vẫn ở trong người ấy
  rationale: Diễn đạt rõ nét nghĩa tồn tại liên tục của μένει bằng tiếng Việt hiện đại; đại từ được làm rõ để tránh nhầm chủ thể.
- source_word: οὐ δύναται ἁμαρτάνειν
  choice: không thể cứ phạm tội
  rationale: “Cứ phạm tội” thể hiện hành động tiếp diễn của động từ nguyên thể hiện tại ἁμαρτάνειν, đồng thời bản dịch sát hơn “không thể phạm tội” được bảo lưu trong chú thích.
- source_word: ὅτι ἐκ τοῦ θεοῦ γεγέννηται
  choice: vì đã được Đức Chúa Trời sinh ra
  rationale: Thì hoàn thành nhấn mạnh một sự sinh ra đã xảy ra và kết quả còn tồn tại; cấu trúc bị động và nguồn gốc từ Đức Chúa Trời đều được giữ lại.
theological_decisions:
- issue: Câu này nói đến sự hoàn toàn không thể phạm bất cứ tội nào hay sự không thể tiếp tục sống trong tội lỗi
  choice: Bản chính diễn tả sự bất tương hợp giữa việc được Đức Chúa Trời sinh ra và lối sống tiếp tục phạm tội.
  alternative: Người được Đức Chúa Trời sinh ra tuyệt đối không thể phạm một tội nào.
  rationale: Các dạng hiện tại ποιεῖ và ἁμαρτάνειν trong ngữ cảnh hỗ trợ sắc thái tiếp diễn hoặc đặc trưng. Chú thích vẫn bảo lưu cách dịch sát hình thức hơn để không che khuất độ căng thần học của nguyên văn.
- issue: Ý nghĩa của “hạt giống của Ngài”
  choice: Giữ nguyên ẩn dụ “hạt giống” mà không xác định sở chỉ.
  alternative: Diễn giải là lời, sự sống hoặc bản tính của Đức Chúa Trời.
  rationale: Nguyên văn không nói rõ σπέρμα chỉ điều gì; giữ hình ảnh tránh đưa một lập trường diễn giải riêng vào bản chính.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “Đức Chúa Trời” và đại từ tôn kính “Ngài”; dùng “người ấy” để làm rõ sở chỉ của đại từ Hy Lạp. Giữ ẩn dụ “hạt giống” và dùng “vẫn ở” thay cho lối nói cổ “ở luôn” hay thuật ngữ diễn giải.
