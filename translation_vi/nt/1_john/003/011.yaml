source:
  edition: SBLGNT
  text: Ὅτι αὕτη ἐστὶν ἡ ἀγγελία ἣν ἠκούσατε ἀπ’ ἀρχῆς, ἵνα ἀγαπῶμεν ἀλλήλους·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/011.yaml
  text: 'For this is the message that you have heard from the beginning: that we should love one another[a][b].'
translation:
  language: vi
  text: 'Vì đây là sứ điệp anh chị em đã nghe từ ban đầu: chúng ta phải yêu thương nhau.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “để chúng ta yêu thương nhau” hoặc “chúng ta hãy yêu thương nhau.”'
    reason: alternative_reading
lexical_decisions:
- source_word: Ὅτι
  choice: Vì
  rationale: Liên từ này giải thích cho ý ở câu trước; “Vì” diễn đạt tự nhiên chức năng giải thích của câu.
- source_word: ἡ ἀγγελία
  choice: sứ điệp
  rationale: “Sứ điệp” diễn đạt một nội dung được truyền đạt, phù hợp với cách dùng của từ này trong văn mạch Giăng và giữ giọng văn trang trọng mà dễ hiểu.
- source_word: ἣν ἠκούσατε
  choice: anh chị em đã nghe
  rationale: Động từ ở ngôi thứ hai số nhiều. “Anh chị em” truyền đạt rõ đối tượng số nhiều, bao gồm cả cộng đồng người đọc, còn “đã nghe” phản ánh thì quá khứ của nguyên văn.
- source_word: ἀπ’ ἀρχῆς
  choice: từ ban đầu
  rationale: Giữ cách diễn đạt quen thuộc và âm hưởng đặc trưng trong các tác phẩm của Giăng, không xác định quá mức “ban đầu” là thời điểm nào.
- source_word: ἵνα ἀγαπῶμεν
  choice: chúng ta phải yêu thương
  rationale: Trong văn mạch, mệnh đề này nêu nội dung và đòi hỏi đạo đức của sứ điệp. “Phải” thể hiện sắc thái ý chí/khuyên truyền của thể giả định mà không biến câu thành một mệnh lệnh trực tiếp.
- source_word: ἀλλήλους
  choice: nhau
  rationale: Đại từ tương hỗ “nhau” là cách diễn đạt tự nhiên trong tiếng Việt và giữ trọng tâm về tình yêu thương giữa các thành viên trong cộng đồng.
theological_decisions:
- issue: Chức năng của ἵνα ἀγαπῶμεν ἀλλήλους
  choice: 'Hiểu chủ yếu là nội dung và đòi hỏi đạo đức của sứ điệp: “chúng ta phải yêu thương nhau.”'
  alternative: Có thể hiểu theo sắc thái mục đích, “để chúng ta yêu thương nhau,” hoặc như lời khích lệ trực tiếp, “chúng ta hãy yêu thương nhau.”
  rationale: ἵνα với động từ thể giả định có thể mang sắc thái nội dung, mục đích hoặc khuyên truyền. Văn mạch nghiêng về việc xác định nội dung sứ điệp, nhưng chú thích giữ lại những khả năng ngữ pháp chân thực khác.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “anh chị em” để thể hiện ngôi thứ hai số nhiều theo lối bao quát; dùng “yêu thương” thay vì chỉ “yêu” để phù hợp văn cảnh đạo đức cộng đồng.
