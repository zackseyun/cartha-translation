id: 1JN.3.20
reference: 1 John 3:20
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὅτι ἐὰν καταγινώσκῃ ἡμῶν ἡ καρδία, ὅτι μείζων ἐστὶν ὁ θεὸς τῆς καρδίας ἡμῶν καὶ γινώσκει πάντα.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/020.yaml
  text: for if our heart condemns us[a], God is greater than our heart[b], and he knows all things.
translation:
  language: vi
  text: Vì nếu lòng chúng ta lên án chúng ta[a], thì Đức Chúa Trời lớn hơn lòng chúng ta[b] và Ngài biết mọi sự.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “trách cứ chúng ta”, “bắt lỗi chúng ta” hoặc “kết tội chúng ta”.'
    reason: lexical_alternative
  - marker: b
    text: Câu “Đức Chúa Trời lớn hơn lòng chúng ta” có thể nói đến việc Ngài biết đầy đủ hơn sự thật về chúng ta, và có thể hàm ý rằng thẩm quyền của Ngài vượt trên sự lên án mà lòng chúng ta dành cho chúng ta.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: Vì
  rationale: ὅτι thứ nhất nêu lý do hoặc lời giải thích cho ý trước đó; “Vì” diễn đạt tự nhiên chức năng này trong tiếng Việt.
- source_word: ἐὰν
  choice: nếu
  rationale: Kết hợp với động từ ở thể giả định, ἐὰν giới thiệu một tình huống có điều kiện; “nếu” giữ đúng sắc thái ấy.
- source_word: καταγινώσκῃ
  choice: lên án
  rationale: Động từ có nghĩa là kết tội, chê trách hoặc thấy có lỗi nơi ai. “Lên án” giữ được sắc thái phán xét nội tâm mạnh mẽ mà không biến “lòng” thành “lương tâm” trong bản văn chính.
- source_word: ἡ καρδία ἡμῶν
  choice: lòng chúng ta
  rationale: “Lòng” là cách diễn đạt tự nhiên trong tiếng Việt về trung tâm đời sống nội tâm và vẫn bảo toàn hình ảnh καρδία, thay vì giải nghĩa hẹp thành “lương tâm”.
- source_word: ὅτι
  choice: thì
  rationale: ὅτι thứ hai mở ra nội dung hoặc cơ sở của lời xác quyết. Trong cấu trúc điều kiện tiếng Việt, “thì” nối mệnh đề một cách tự nhiên; không cần lặp một từ tương đương với “rằng” hoặc “vì” vốn có thể làm câu tối nghĩa.
- source_word: μείζων
  choice: lớn hơn
  rationale: Giữ nguyên tính rộng mở của so sánh, không thu hẹp thành chỉ “có thẩm quyền hơn”, “biết rõ hơn” hay “thương xót hơn”.
- source_word: ὁ θεὸς
  choice: Đức Chúa Trời
  rationale: Danh xưng tiếng Việt quen thuộc, trang trọng và dễ nhận biết dành cho θεός trong ngữ cảnh Kinh Thánh.
- source_word: τῆς καρδίας ἡμῶν
  choice: hơn lòng chúng ta
  rationale: Sở hữu cách theo sau tính từ so sánh được chuyển tự nhiên bằng “hơn”; việc lặp lại “lòng chúng ta” giữ rõ đối tượng được so sánh.
- source_word: γινώσκει πάντα
  choice: Ngài biết mọi sự
  rationale: Diễn đạt đầy đủ phạm vi bao quát của πάντα và giữ giọng văn trang trọng, tự nhiên.
theological_decisions:
- issue: Ý nghĩa của việc Đức Chúa Trời “lớn hơn lòng chúng ta”
  choice: Giữ nguyên lời khẳng định rộng rằng Đức Chúa Trời lớn hơn lòng chúng ta, đồng thời giữ mệnh đề Ngài biết mọi sự.
  alternative: Diễn giải cụ thể rằng Ngài nhân từ hơn lương tâm kết án, phán quyết của Ngài vượt trên sự tự kết án, hoặc Ngài biết sự thật đầy đủ hơn chúng ta.
  rationale: Bản Hy Lạp không xác định phương diện cụ thể của μείζων. Mệnh đề tiếp theo nhấn mạnh sự hiểu biết trọn vẹn của Đức Chúa Trời, nhưng không buộc phải thu hẹp sự “lớn hơn” chỉ vào tri thức, lòng thương xót hay thẩm quyền.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Bản dịch giữ hình ảnh “lòng” và sự lặp lại của nguyên văn, đồng thời dùng cấu trúc “nếu… thì…” cho mạch câu tự nhiên. Hai dấu chú thích [a], [b] đều xuất hiện trong bản văn chính.
