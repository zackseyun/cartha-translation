id: 1JN.3.23
reference: 1 John 3:23
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ αὕτη ἐστὶν ἡ ἐντολὴ αὐτοῦ, ἵνα ⸀πιστεύσωμεν τῷ ὀνόματι τοῦ υἱοῦ αὐτοῦ Ἰησοῦ Χριστοῦ καὶ ἀγαπῶμεν ἀλλήλους, καθὼς ἔδωκεν ἐντολὴν ⸀ἡμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/023.yaml
  text: 'And this is his command: that we believe in the name of his Son Jesus the Messiah and love one another[d][c][b][a], just as he gave us command.'
translation:
  language: vi
  text: 'Và đây là điều răn của Ngài: chúng ta phải tin vào danh[a] Con Ngài là Đức Giê-su, Đấng Mê-si-a,[b] và yêu thương nhau, đúng như Ngài đã ban điều răn cho chúng ta.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “tin cậy nơi danh Con Ngài.”
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “Đức Giê-su Christ.” Từ Hy Lạp Χριστός là danh hiệu “Đấng Mê-si-a.”
    reason: alternative_reading
  - marker: c
    text: Cụm từ Hy Lạp cũng có thể hiểu là “đúng như Ngài đã ban cho chúng ta một điều răn.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐντολή
  choice: điều răn
  rationale: “Điều răn” là cách diễn đạt tự nhiên, trang trọng và quen thuộc trong tiếng Việt, đồng thời giữ nguyên sắc thái thẩm quyền và số ít của từ Hy Lạp.
- source_word: ἵνα πιστεύσωμεν
  choice: chúng ta phải tin
  rationale: Sau câu “đây là điều răn,” ἵνα với động từ giả định nêu nội dung mang tính mệnh lệnh; “phải tin” thể hiện rõ lực khuyên truyền/mệnh lệnh mà vẫn tự nhiên trong tiếng Việt.
- source_word: πιστεύω τῷ ὀνόματι
  choice: tin vào danh
  rationale: Cách dịch này giữ lối diễn đạt của Giăng, trong đó “danh” đại diện cho căn tính và thẩm quyền được bày tỏ của chính Đức Giê-su; “tin cậy nơi danh” cũng là một khả năng.
- source_word: τοῦ υἱοῦ αὐτοῦ
  choice: Con Ngài
  rationale: Giữ quan hệ giữa Đức Chúa Trời và Con của Ngài; viết hoa “Con” vì từ này trực tiếp chỉ về Đức Giê-su trong ngữ cảnh.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Đức Giê-su, Đấng Mê-si-a
  rationale: Χριστός ở đây có giá trị danh hiệu, nên dịch là “Đấng Mê-si-a”; dấu phẩy và “Đấng” giúp cụm danh hiệu tự nhiên, rõ nghĩa trong tiếng Việt.
- source_word: ἀγαπῶμεν ἀλλήλους
  choice: yêu thương nhau
  rationale: Đây là cách diễn đạt hiện đại, tự nhiên cho hành động yêu thương có tính tương hỗ trong cộng đồng.
- source_word: καθὼς
  choice: đúng như
  rationale: “Đúng như” diễn tả sự tương ứng với điều Ngài đã truyền, đồng thời tự nhiên hơn cách dịch máy móc.
- source_word: ἔδωκεν ἐντολὴν ἡμῖν
  choice: Ngài đã ban điều răn cho chúng ta
  rationale: Giữ cấu trúc danh từ và sự lặp lại của ἐντολή, nhưng diễn đạt theo cú pháp tiếng Việt tự nhiên; danh từ Hy Lạp không có mạo từ nên có thể hiểu là “điều răn” hoặc “một điều răn.”
theological_decisions:
- issue: Cách dịch Χριστός
  choice: Đấng Mê-si-a
  alternative: Đấng Christ
  rationale: Trong cụm xác định Con của Đức Chúa Trời, Χριστός vẫn mang lực của một danh hiệu. “Đấng Mê-si-a” chuyển tải ý nghĩa ấy trực tiếp và không biến danh hiệu thành họ riêng.
- issue: Lực nghĩa của πιστεύω τῷ ὀνόματι
  choice: tin vào danh
  alternative: tin cậy nơi danh
  rationale: “Tin vào danh” bảo toàn cách nói thần học đặc trưng của văn phẩm Giăng và không thu hẹp πιστεύω vào riêng sắc thái cảm xúc hay tín nhiệm.
- issue: Quan hệ giữa hai hành động trong một điều răn
  choice: một điều răn gồm việc tin và yêu thương
  alternative: hai điều răn riêng biệt
  rationale: Bản Hy Lạp dùng ἐντολή ở số ít rồi nối πιστεύσωμεν và ἀγαπῶμεν bằng καί; bản dịch giữ nguyên cấu trúc này mà không giải thích thêm mối quan hệ thần học giữa hai hành động.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” để tránh lặp lại dài dòng chủ thể đã rõ từ văn cảnh; dùng “Đức Giê-su” và “Đấng Mê-si-a” theo lối gọi kính trọng, phổ thông. Tất cả dấu chú thích [a], [b], [c] đều có mặt trong chính văn.
