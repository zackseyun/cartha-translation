id: 1JN.3.3
reference: 1 John 3:3
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ πᾶς ὁ ἔχων τὴν ἐλπίδα ταύτην ἐπ’ αὐτῷ ἁγνίζει ἑαυτὸν καθὼς ἐκεῖνος ἁγνός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/003.yaml
  text: And everyone who has this hope set on him purifies himself[b][a], just as he is pure.
translation:
  language: vi
  text: Và bất cứ ai đặt niềm hy vọng này nơi Ngài[a] thì tự thanh tẩy mình, cũng như Đấng ấy[b] là thanh sạch.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “có niềm hy vọng này trong Ngài.” Cụm từ Hy Lạp có thể nói đến đối tượng hoặc nền tảng mà niềm hy vọng nương dựa.'
    reason: lexical_alternative
  - marker: b
    text: “Đấng ấy” rất có thể chỉ về Con, tức Đấng Christ, trong văn cảnh; tuy nhiên, tiếng Hy Lạp chỉ dùng một đại từ và không nêu danh xưng.
    reason: alternative_reading
lexical_decisions:
- source_word: πᾶς ὁ ἔχων
  choice: bất cứ ai đặt
  rationale: Kết cấu phân từ có mạo từ mang nghĩa khái quát, chỉ mọi người thuộc nhóm này. Trong tiếng Việt, “bất cứ ai” diễn đạt tự nhiên phạm vi phổ quát; “đặt” kết hợp với cụm ἐπ’ αὐτῷ để diễn tả niềm hy vọng hướng về và nương dựa nơi một đối tượng.
- source_word: τὴν ἐλπίδα ταύτην
  choice: niềm hy vọng này
  rationale: Giữ đại từ chỉ định hồi chỉ về niềm hy vọng được nêu trong văn cảnh trước; “niềm hy vọng” ở đây là sự trông đợi có cơ sở, không chỉ là mong ước mơ hồ.
- source_word: ἐπ’ αὐτῷ
  choice: nơi Ngài
  rationale: ἐπί với tặng cách có thể chỉ đối tượng hoặc nền tảng của niềm hy vọng. “Nơi Ngài” là cách nói tiếng Việt tự nhiên, trang trọng, đồng thời không xác định danh xưng mà bản Hy Lạp không nêu rõ.
- source_word: ἁγνίζει ἑαυτὸν
  choice: tự thanh tẩy mình
  rationale: Diễn đạt hành động chủ thể thực hiện đối với chính mình và giữ sắc thái thanh sạch về đạo đức của ἁγνίζω. “Thanh tẩy” cũng duy trì mối liên hệ ý nghĩa với ἁγνός ở cuối câu.
- source_word: καθὼς
  choice: cũng như
  rationale: Đánh dấu rõ quan hệ so sánh và phù hợp với văn phong tiếng Việt hiện đại.
- source_word: ἐκεῖνος
  choice: Đấng ấy
  rationale: Giữ lực chỉ định của đại từ Hy Lạp và sắc thái tôn kính phù hợp với văn cảnh, nhưng không thay đại từ bằng “Đấng Christ” hay “Con Đức Chúa Trời,” vốn không được nêu trực tiếp trong câu.
- source_word: ἁγνός
  choice: thanh sạch
  rationale: Phù hợp với ý nghĩa đạo đức trong văn cảnh và nối kết về nghĩa với động từ “thanh tẩy” trước đó.
theological_decisions:
- issue: Đối tượng của αὐτῷ và sở chỉ của ἐκεῖνος
  choice: Dùng “Ngài” và “Đấng ấy,” không chèn danh xưng cụ thể; văn cảnh nhiều khả năng chỉ về Con/Đấng Christ.
  alternative: Có thể hiểu αὐτῷ là Đức Chúa Cha, hoặc cho rằng các đại từ chủ ý để ngỏ một mức độ nhập nhằng giữa Cha và Con.
  rationale: Văn cảnh gần, đặc biệt ý mong được thấy Ngài như chính Ngài vốn có, nghiêng mạnh về Con/Đấng Christ. Tuy nhiên, bản Hy Lạp chỉ dùng đại từ, nên bản dịch giữ đại từ và ghi chú thay vì giải quyết dứt khoát điều bản văn chưa gọi tên.
- issue: Đại từ phản thân giống đực số ít ἑαυτὸν trong kết cấu khái quát
  choice: Dịch là “mình,” áp dụng cho “bất cứ ai.”
  alternative: Dịch dài hơn là “chính bản thân mình.”
  rationale: Tiếng Việt không đánh dấu giống ngữ pháp ở đại từ phản thân này. “Mình” vừa phản ánh đúng quan hệ phản thân vừa tự nhiên, và “bất cứ ai” giữ trọn phạm vi khái quát.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Ngài” và “Đấng ấy” giữ sắc thái tôn kính quen thuộc trong tiếng Việt Kinh Thánh mà không thêm danh xưng thần học ngoài nguyên văn. Cấu trúc câu bám sát lập luận Hy Lạp nhưng dùng trật tự tự nhiên của tiếng Việt.
