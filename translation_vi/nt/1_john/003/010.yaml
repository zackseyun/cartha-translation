id: 1JN.3.10
reference: 1 John 3:10
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐν τούτῳ φανερά ἐστιν τὰ τέκνα τοῦ θεοῦ καὶ τὰ τέκνα τοῦ διαβόλου· πᾶς ὁ μὴ ποιῶν δικαιοσύνην οὐκ ἔστιν ἐκ τοῦ θεοῦ, καὶ ὁ μὴ ἀγαπῶν τὸν ἀδελφὸν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/010.yaml
  text: 'By this the children of God and the children of the devil are evident: everyone who does not practice righteousness is not from God[c][b][a], nor is the one who does not love his brother.'
translation:
  language: vi
  text: 'Qua điều này[a], con cái Đức Chúa Trời và con cái ma quỷ được nhận biết rõ: bất cứ ai không thực hành sự công chính[b] thì không đến từ Đức Chúa Trời; người không yêu thương người anh em của mình[c] thì cũng không đến từ Đức Chúa Trời.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Trong điều này” hoặc “Từ điều này.” Cụm từ Hy Lạp có thể chỉ căn cứ hay phương diện qua đó sự phân biệt này được nhận biết.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “điều chính trực” hoặc “công lý.” Từ Hy Lạp có thể nói đến sự công chính hay công lý; trong văn mạch đạo đức ở đây, “sự công chính” phù hợp hơn.'
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể hiểu: “anh chị em mình,” tức là người cùng đức tin. Nguyên văn Hy Lạp dùng “người anh em của mình” ở dạng giống đực số ít.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: Qua điều này
  rationale: Cụm từ chỉ phương diện hoặc căn cứ qua đó sự phân biệt trở nên rõ ràng. “Qua điều này” tự nhiên trong tiếng Việt và không ấn định quá mức là “trong điều này” hay “từ điều này”.
- source_word: φανερά ἐστιν
  choice: được nhận biết rõ
  rationale: Diễn đạt trạng thái hiển nhiên, có thể phân biệt rõ, bằng lối nói tự nhiên trong tiếng Việt hiện đại.
- source_word: τὰ τέκνα τοῦ θεοῦ καὶ τὰ τέκνα τοῦ διαβόλου
  choice: con cái Đức Chúa Trời và con cái ma quỷ
  rationale: Giữ nguyên hình ảnh gia đình và sự đối lập về nguồn gốc hoặc sự thuộc về vốn có trong câu Hy Lạp.
- source_word: πᾶς ὁ μὴ ποιῶν δικαιοσύνην
  choice: bất cứ ai không thực hành sự công chính
  rationale: Phân từ hiện tại có mạo từ mô tả nếp sống hay đặc điểm thường xuyên; “thực hành” giữ được sắc thái hành động hơn cách dịch đơn thuần là “không công chính”.
- source_word: οὐκ ἔστιν ἐκ τοῦ θεοῦ
  choice: không đến từ Đức Chúa Trời
  rationale: Giữ ý nguồn gốc của ἐκ, đồng thời vẫn để ngỏ sắc thái thuộc về trong văn mạch, thay vì chuyển hẳn thành một phạm trù thần học diễn giải.
- source_word: ὁ μὴ ἀγαπῶν τὸν ἀδελφὸν αὐτοῦ
  choice: người không yêu thương người anh em của mình
  rationale: Giữ cấu trúc song song và dạng số ít giống đực của nguyên văn; “yêu thương” phù hợp với sắc thái đạo đức và quan hệ trong thư.
- source_word: καὶ
  choice: cũng vậy
  rationale: Trong vế cuối, καὶ nối với mệnh đề phủ định trước và tỉnh lược ý “không đến từ Đức Chúa Trời”; “cũng vậy” làm rõ phép tỉnh lược một cách tự nhiên mà không thêm nội dung mới.
theological_decisions:
- issue: Ngôn ngữ gia đình chỉ căn tính thuộc linh và đạo đức
  choice: con cái Đức Chúa Trời và con cái ma quỷ
  alternative: những người thuộc về Đức Chúa Trời và những người thuộc về ma quỷ
  rationale: Nguyên văn dùng τέκνα, tức “con cái”. Giữ cách gọi này bảo tồn hình ảnh và sức căng thần học của Giăng thay vì làm nhẹ thành một cách phân loại chung.
- issue: Sắc thái của ἐκ τοῦ θεοῦ
  choice: đến từ Đức Chúa Trời
  alternative: thuộc về Đức Chúa Trời
  rationale: “Đến từ” ưu tiên ý nguồn gốc của giới từ ἐκ nhưng không phủ nhận hàm ý thuộc về. Cách dịch thay thế tự nhiên hơn về quan hệ nhưng làm mờ ý nguồn gốc.
- issue: Danh từ giống đực số ít ἀδελφός
  choice: người anh em của mình
  alternative: anh chị em mình; người cùng đức tin với mình
  rationale: Bản văn dùng dạng giống đực số ít, nên phần chính giữ hình thức ấy. Phạm vi có thể bao gồm một tín hữu nam hoặc nữ được nêu trong chú thích, không đưa cách diễn giải bao quát vào thẳng câu chính.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Câu giữ phép đối xứng của nguyên văn, dùng “Đức Chúa Trời” theo cách gọi Tin Lành quen thuộc và “ma quỷ” như danh xưng xác định trong văn mạch. Dấu chấm phẩy giúp vế cuối “cũng vậy” quy chiếu rõ về lời phủ định trước đó.
