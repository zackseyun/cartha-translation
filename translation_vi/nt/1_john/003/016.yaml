source:
  edition: SBLGNT
  text: ἐν τούτῳ ἐγνώκαμεν τὴν ἀγάπην, ὅτι ἐκεῖνος ὑπὲρ ἡμῶν τὴν ψυχὴν αὐτοῦ ἔθηκεν· καὶ ἡμεῖς ὀφείλομεν ὑπὲρ τῶν ἀδελφῶν τὰς ψυχὰς ⸀θεῖναι.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/016.yaml
  text: 'By this we have come to know love: that he laid down his life for us[b][a], and we ought to lay down our lives for the brothers.'
translation:
  language: vi
  text: 'Nhờ điều này, chúng ta biết được tình yêu: Ngài đã hy sinh mạng sống mình vì chúng ta; và chúng ta cũng phải hy sinh mạng sống mình vì anh chị em cùng đức tin.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hy Lạp: “vì các anh em”; trong văn mạch, cụm từ này chỉ những người cùng đức tin nói chung, gồm cả nam lẫn nữ.'
    reason: cultural_note
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: Nhờ điều này
  rationale: Cụm từ nêu phương cách hoặc căn cứ để nhận biết tình yêu; cách dịch này tự nhiên trong tiếng Việt và vẫn giữ được lực giải thích của nguyên ngữ.
- source_word: ἐγνώκαμεν
  choice: chúng ta đã nhận biết
  rationale: Thì hoàn thành diễn tả một sự nhận biết đã xảy ra và còn có kết quả trong hiện tại; “đã nhận biết” truyền đạt điều đó rõ ràng, tự nhiên.
- source_word: τὴν ἀγάπην
  choice: tình yêu
  rationale: Cách gọi khái quát phẩm chất tình yêu được hành động của Chúa Giê-su định nghĩa trong câu này.
- source_word: ἐκεῖνος
  choice: Ngài
  rationale: Đại từ nhấn mạnh chỉ về Chúa Giê-su trong văn mạch. “Ngài” là đại từ kính trọng tự nhiên trong tiếng Việt mà không cần chèn danh xưng không có trực tiếp trong câu Hy Lạp.
- source_word: ὑπὲρ ἡμῶν
  choice: vì chúng ta
  rationale: ὑπέρ diễn tả hành động vì lợi ích hoặc thay mặt người khác; “vì chúng ta” giữ sức nặng thần học mà không áp đặt một mô hình chuộc tội cụ thể.
- source_word: τὴν ψυχὴν αὐτοῦ ἔθηκεν
  choice: đã hy sinh mạng sống mình
  rationale: Trong thành ngữ Gio-an này, ψυχή là mạng sống và τίθημι chỉ sự tự nguyện xả thân. “Hy sinh mạng sống” tự nhiên hơn lối dịch từng chữ “đặt xuống mạng sống” trong tiếng Việt.
- source_word: ὀφείλομεν
  choice: chúng ta cũng phải
  rationale: Động từ diễn tả nghĩa vụ đạo đức; “phải” truyền đạt rõ tính bắt buộc, còn “cũng” làm nổi bật sự tương ứng với gương của Ngài.
- source_word: τῶν ἀδελφῶν
  choice: anh chị em cùng đức tin
  rationale: ἀδελφῶν là hình thức giống đực số nhiều nhưng trong văn mạch hội thánh chỉ cộng đồng tín hữu nói chung. Tiếng Việt tự nhiên dùng “anh chị em”; thêm “cùng đức tin” làm rõ nghĩa quan hệ thuộc linh thay vì anh em ruột.
- source_word: τὰς ψυχὰς θεῖναι
  choice: hy sinh mạng sống mình
  rationale: Giữ cùng thành ngữ với mệnh đề trước và truyền đạt lời kêu gọi sẵn lòng xả thân vì cộng đồng tín hữu.
theological_decisions:
- issue: Đối tượng được ἐκεῖνος chỉ đến
  choice: Dịch là “Ngài”, để văn mạch xác định đó là Chúa Giê-su, Đấng đã hy sinh mạng sống vì chúng ta.
  alternative: Dịch sát hình thức hơn là “Đấng ấy” hoặc nêu rõ “Chúa Giê-su”.
  rationale: Trong 1 Giăng và thành ngữ Gio-an về việc hy sinh mạng sống, đối tượng là Chúa Giê-su. “Ngài” bảo toàn hình thức đại từ của nguyên ngữ và không thêm tên riêng vào chính văn.
- issue: Phạm vi của τῶν ἀδελφῶν
  choice: “anh chị em cùng đức tin”, bao gồm các tín hữu cả nam lẫn nữ.
  alternative: “anh em” để phản ánh hình thức giống đực số nhiều của tiếng Hy Lạp.
  rationale: Trong văn mạch cộng đồng, danh từ số nhiều này có chức năng đại diện và nói đến các tín hữu nói chung. Cách dịch bao gồm cả hai giới truyền đạt đúng đối tượng trong tiếng Việt hiện đại; chú thích ghi nhận hình thức nguyên ngữ.
- issue: Sắc thái của ὑπὲρ ἡμῶν
  choice: “vì chúng ta”.
  alternative: “thay cho chúng ta” hoặc “vì lợi ích của chúng ta”.
  rationale: Cụm Hy Lạp có thể mang sắc thái thay mặt, vì lợi ích, và trong bối cảnh tự hiến có sức nặng gần với sự thay thế. Bản dịch không thu hẹp câu vào duy nhất một cách lý giải thần học.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “hy sinh mạng sống” thay cho lối dịch từng chữ thiếu tự nhiên; lặp lại cụm này ở hai vế để giữ phép đối chiếu của nguyên văn. Dấu hai chấm và “ấy là” biểu thị rằng hành động của Ngài xác định tình yêu được nói đến.
