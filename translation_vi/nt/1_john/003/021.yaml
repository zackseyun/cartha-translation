revisions:
- from: Anh chị em yêu dấu, nếu lòng chúng ta[c] không lên án chúng ta[a], thì chúng ta có sự vững tin trước mặt Đức Chúa Trời[b].
  to: Anh chị em yêu dấu, nếu lòng chúng ta[c] không lên án chúng ta[a], thì chúng ta vững lòng trước mặt Đức Chúa Trời[b].
  rationale: 'Thay “có sự vững tin” bằng “vững lòng” để diễn đạt tự nhiên hơn ý παρρησία trong tiếng Việt hiện đại: một tư thế tự tin, mạnh dạn trước mặt Đức Chúa Trời. Bản sửa vẫn giữ tính cô đọng của nguyên văn, quan hệ điều kiện, hình ảnh “lòng,” và không áp đặt cách hiểu giáo phái.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T00:30:31Z'
review_pass:
  verdict: revise
  source_fidelity: Bản dịch giữ đúng cấu trúc điều kiện, chủ thể số nhiều và hình ảnh “lòng” (καρδία). “Lên án” phản ánh phù hợp καταγινώσκῃ. Tuy nhiên, “có sự vững tin” dễ nghiêng về niềm tin/xác tín như một nội dung đức tin hơn là παρρησία, vốn nói đến sự tự tin, mạnh dạn, và cởi mở khi đứng trước Đức Chúa Trời.
  naturalness: “Anh chị em yêu dấu” và “lòng chúng ta không lên án chúng ta” tự nhiên, đúng văn phong trang trọng hiện đại. “Chúng ta vững lòng trước mặt Đức Chúa Trời” diễn đạt παρρησία tự nhiên hơn cấu trúc danh từ hơi nặng “có sự vững tin”.
  terminology: Giữ “Đức Chúa Trời,” “lòng,” và “lên án” nhất quán với ngữ cảnh thư tín và không thu hẹp καρδία thành “lương tâm” trong thân bài. Chú thích về “lòng” và các khả năng của παρρησία được điều chỉnh để phản ánh sát hơn các sắc thái từ vựng.
  issues:
