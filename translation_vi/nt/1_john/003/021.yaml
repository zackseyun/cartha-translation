source:
  edition: SBLGNT
  text: ἀγαπητοί, ἐὰν ἡ καρδία ⸂μὴ καταγινώσκῃ ἡμῶν⸃, παρρησίαν ἔχομεν πρὸς τὸν θεόν,
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/021.yaml
  text: Beloved[a], if our heart does not condemn us, we have confidence before God[c][b],
translation:
  language: vi
  text: Anh chị em yêu dấu, nếu lòng chúng ta[c] không lên án chúng ta[a], thì chúng ta vững lòng trước mặt Đức Chúa Trời[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “không buộc tội chúng ta” hoặc “không chê trách chúng ta.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “chúng ta có sự mạnh dạn trước mặt Đức Chúa Trời” hoặc “chúng ta có sự tự tin trước mặt Đức Chúa Trời.”'
    reason: lexical_alternative
  - marker: c
    text: “Lòng” ở đây chỉ con người bên trong hoặc ý thức đạo đức, với chức năng gần với “lương tâm.”
    reason: cultural_note
lexical_decisions:
- source_word: ἀγαπητοί
  choice: Anh chị em yêu dấu
  rationale: Đây là tính từ số nhiều ở hô cách, được dùng như lời xưng hô trìu mến. Cách dịch này giữ mối liên hệ với chủ đề yêu thương trong thư, đồng thời diễn đạt rõ rằng tác giả đang nói với cả cộng đồng.
- source_word: ἐὰν
  choice: nếu
  rationale: Từ này mở đầu mệnh đề điều kiện với động từ ở thể giả định; “nếu” là cách diễn đạt tự nhiên và chính xác trong tiếng Việt.
- source_word: ἡ καρδία
  choice: lòng chúng ta
  rationale: Giữ hình ảnh “lòng” của nguyên văn thay vì thu hẹp nghĩa thành “lương tâm”; trong ngữ cảnh, từ này chỉ phần nội tâm tự đánh giá về mặt đạo đức.
- source_word: μὴ καταγινώσκῃ ἡμῶν
  choice: không lên án chúng ta
  rationale: καταγινώσκω mang sắc thái phán quyết bất lợi, trách cứ hoặc kết tội. “Lên án” giữ được sắc thái đạo đức–phán xét và nối liền tự nhiên với câu trước.
- source_word: παρρησίαν
  choice: sự vững tin
  rationale: παρρησία có thể chỉ sự mạnh dạn, cởi mở hoặc tin chắc. Trong quan hệ với Đức Chúa Trời, “sự vững tin” diễn đạt một tư thế không e sợ mà không làm câu văn mang sắc thái thách thức.
- source_word: πρὸς τὸν θεόν
  choice: trước mặt Đức Chúa Trời
  rationale: Trong kết hợp này, πρός diễn tả mối tương quan hoặc tư thế hướng về Đức Chúa Trời. “Trước mặt Đức Chúa Trời” tự nhiên trong tiếng Việt và phù hợp với ngữ cảnh tự xét mình trong sự hiện diện của Ngài.
theological_decisions:
- issue: Phạm vi ý nghĩa của καρδία
  choice: lòng
  alternative: lương tâm
  rationale: “Lòng” giữ nguyên ẩn dụ và cách dùng từ của Giăng, không đồng nhất toàn bộ con người bên trong với một phạm trù tâm lý hẹp hơn. Chú thích làm rõ chức năng gần với ý thức đạo đức.
- issue: Sắc thái của παρρησίαν trong mối tương quan với Đức Chúa Trời
  choice: sự vững tin trước mặt Đức Chúa Trời
  alternative: sự mạnh dạn trước mặt Đức Chúa Trời; sự tin chắc trước mặt Đức Chúa Trời
  rationale: Cách chọn này diễn đạt tư thế cởi mở, không hổ thẹn trong sự hiện diện của Đức Chúa Trời, nhưng không biến câu thành lời khẳng định về cảm xúc chắc chắn tuyệt đối hay thái độ táo bạo thiếu kính sợ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Anh chị em yêu dấu” là lời xưng hô bao quát cộng đồng; “lòng” giữ hình ảnh của nguyên văn; cấu trúc điều kiện và sự lặp lại “chúng ta” được duy trì để bảo toàn trọng tâm cộng đồng của câu.
