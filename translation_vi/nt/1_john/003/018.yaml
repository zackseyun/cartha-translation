  text: ⸀Τεκνία, μὴ ἀγαπῶμεν λόγῳ μηδὲ τῇ γλώσσῃ ἀλλὰ ἐν ἔργῳ καὶ ἀληθείᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/018.yaml
  text: Little children[a], let us not love in word or with the tongue[b], but in deed and truth.
translation:
  language: vi
  text: Hỡi các con bé nhỏ, chúng ta đừng yêu thương bằng lời nói hay đầu môi chót lưỡi, nhưng bằng việc làm và sự thật.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể hiểu: “bằng việc làm và trong sự chân thật.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τεκνία
  choice: Hỡi các con bé nhỏ
  rationale: Giữ cách xưng hô thân tình, trìu mến của dạng giảm nhẹ τεκνία; “hỡi” đánh dấu lời gọi trực tiếp một cách trang trọng nhưng vẫn dễ hiểu.
- source_word: μὴ ἀγαπῶμεν
  choice: chúng ta đừng yêu thương
  rationale: Phản ánh thức giả định ngôi thứ nhất số nhiều mang ý khuyên nhủ/ngăn cấm; cách nói tự nhiên trong tiếng Việt.
- source_word: λόγῳ μηδὲ τῇ γλώσσῃ
  choice: chỉ bằng lời nói hay đầu môi chót lưỡi
  rationale: “Lời nói” truyền đạt λόγῳ; thành ngữ “đầu môi chót lưỡi” giữ hình ảnh cụ thể của γλώσσῃ và diễn tả tình yêu chỉ dừng ở lời. Thêm “chỉ” làm rõ sự tương phản hàm chứa mà không phủ nhận giá trị của lời nói chân thật.
- source_word: ἀλλὰ ἐν ἔργῳ
  choice: nhưng bằng việc làm
  rationale: Giữ sự đối lập mạnh của ἀλλά và chuyển ἔργον bằng cụm từ hiện đại, tự nhiên, đối xứng với “bằng lời nói”.
- source_word: καὶ ἀληθείᾳ
  choice: và sự thật
  rationale: Giữ nghĩa từ vựng và chiều sâu của ἀλήθεια, không thu hẹp thành “chân thành” hay “thành thật”.
theological_decisions:
- issue: Ý nghĩa của ἀληθείᾳ trong cụm “bằng việc làm và sự thật”
  choice: Giữ “sự thật”
  alternative: “lòng chân thành” hoặc “cách chân thật”
  rationale: “Sự thật” bảo tồn khả năng từ này vừa nói đến tính chân thực của tình yêu vừa nói đến tình yêu phù hợp với chân lý của Đức Chúa Trời, thay vì giải quyết căng thẳng thần học theo một hướng duy nhất.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Hỡi các con bé nhỏ” giữ sắc thái mục vụ trìu mến; “đầu môi chót lưỡi” là thành ngữ Việt tự nhiên, nhưng bản dịch vẫn giữ “sự thật” để bảo tồn âm hưởng thần học của văn chương Giăng.
