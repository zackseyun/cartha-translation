revisions:
- from: Hỡi các con bé nhỏ, chúng ta đừng yêu thương chỉ bằng lời nói hay đầu môi chót lưỡi, nhưng bằng việc làm và sự thật.[a]
  to: Hỡi các con bé nhỏ, chúng ta đừng yêu thương bằng lời nói hay đầu môi chót lưỡi, nhưng bằng việc làm và sự thật.[a]
  rationale: Bản sửa bỏ phần bổ sung “chỉ” để giữ sát cấu trúc phủ định và đối lập của nguyên văn, đồng thời duy trì thành ngữ “đầu môi chót lưỡi” như một cách diễn đạt tự nhiên cho lời nói suông. “Sự thật” được giữ trong thân văn nhằm bảo tồn phạm vi và âm hưởng Giăng của ἀλήθεια; chú thích nêu phương án diễn giải mà không áp đặt nó.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T00:30:29Z'
review_pass:
  verdict: revise
  source_fidelity: Bản thảo truyền đạt đúng lời kêu gọi ngôi thứ nhất số nhiều, tương phản giữa tình yêu bằng lời và tình yêu được thể hiện bằng việc làm cùng ἀλήθεια. Tuy nhiên, “chỉ” thêm một sự giới hạn không được diễn đạt trực tiếp trong tiếng Hy Lạp; cấu trúc phủ định–đối lập của câu đã đủ truyền đạt trọng tâm này.
  naturalness: “Hỡi các con bé nhỏ” và “đầu môi chót lưỡi” đều tự nhiên trong văn phong Kinh Thánh Việt hiện đại. Bỏ “chỉ” làm câu gọn hơn và bám sát cấu trúc nguồn hơn.
  terminology: “Yêu thương,” “việc làm,” và “sự thật” phù hợp. “Sự thật” nên được giữ để không thu hẹp ἀληθείᾳ thành chỉ sự chân thành. Chú thích thay thế cần neo ngay tại cụm được chú thích và chỉ rõ đây là cách hiểu diễn giải của ἀληθείᾳ.
  issues:
  - severity: low
    issue: Từ “chỉ” trong “đừng yêu thương chỉ bằng lời nói” là phần bổ sung diễn giải.
    rationale: Nguyên văn μὴ ἀγαπῶμεν λόγῳ μηδὲ τῇ γλώσσῃ trực tiếp phủ định tình yêu “bằng lời/bằng lưỡi,” rồi đối lập với “bằng việc làm và sự thật”; không có từ tương đương riêng với “chỉ.”
  - severity: low
    issue: Dấu chú thích hiện đặt sau cả câu thay vì neo tại cụm “sự thật,” trong khi nội dung chú thích chủ yếu giải thích ἀληθείᾳ.
    rationale: Neo chú thích tại từ/cụm liên quan sẽ rõ ràng hơn; phương án “trong sự chân thật” là cách diễn giải có thể có, không nên thay thế trực tiếp “sự thật” trong thân văn.
