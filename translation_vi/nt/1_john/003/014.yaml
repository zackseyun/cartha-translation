id: 1JN.3.14
reference: 1 John 3:14
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἡμεῖς οἴδαμεν ὅτι μεταβεβήκαμεν ἐκ τοῦ θανάτου εἰς τὴν ζωήν, ὅτι ἀγαπῶμεν τοὺς ἀδελφούς· ὁ μὴ ⸀ἀγαπῶν μένει ἐν τῷ θανάτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/014.yaml
  text: We know that we have passed from death into life[a], because we love the brothers. The one who does not love remains in death.
translation:
  language: vi
  text: Chúng ta biết mình đã vượt khỏi sự chết để vào sự sống, vì chúng ta yêu thương anh chị em cùng đức tin.[a] Người nào không yêu thương thì vẫn ở trong sự chết.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn là “anh em”; trong ngữ cảnh này, từ ấy có lẽ chỉ chung các anh chị em cùng đức tin.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἴδαμεν
  choice: chúng ta biết
  rationale: Dạng hoàn thành οἶδα có chức năng như động từ chỉ trạng thái ở thì hiện tại trong tiếng Hy Lạp Koinē; “biết” là cách diễn đạt tự nhiên và chính xác.
- source_word: μεταβεβήκαμεν
  choice: đã vượt khỏi ... để vào
  rationale: Thì hoàn thành diễn tả một sự chuyển đổi đã xảy ra và kết quả vẫn còn. “Đã vượt khỏi ... để vào” giữ được hình ảnh chuyển từ lĩnh vực này sang lĩnh vực khác.
- source_word: ἐκ τοῦ θανάτου εἰς τὴν ζωήν
  choice: khỏi sự chết để vào sự sống
  rationale: Cặp giới từ ἐκ...εἰς diễn tả sự chuyển động ra khỏi một lĩnh vực và đi vào một lĩnh vực khác; cách dịch này bảo toàn hướng chuyển động ấy.
- source_word: ἀγαπῶμεν
  choice: chúng ta yêu thương
  rationale: Thì hiện tại diễn tả hành động có tính liên tục hoặc đặc trưng; “yêu thương” tự nhiên trong tiếng Việt và phù hợp với ngữ cảnh quan hệ giữa các tín hữu.
- source_word: τοὺς ἀδελφούς
  choice: anh chị em cùng đức tin
  rationale: Danh từ Hy Lạp ở giống đực số nhiều nhưng trong ngữ cảnh cộng đồng của 1 Giăng nhiều khả năng chỉ chung các tín hữu. Tiếng Việt thường dùng cặp bao quát “anh chị em”; cụm “cùng đức tin” làm rõ quan hệ cộng đồng mà không giới hạn vào anh em ruột.
- source_word: ὁ μὴ ἀγαπῶν
  choice: người nào không yêu thương
  rationale: Phân từ hiện tại có mạo từ chỉ một hạng người nói chung hoặc một đặc tính thường xuyên; cách dịch này rõ ràng và tự nhiên.
- source_word: μένει
  choice: vẫn ở
  rationale: μένω diễn tả sự tiếp tục trong một trạng thái. “Vẫn ở” dễ hiểu, đồng thời giữ ý trạng thái kéo dài.
- source_word: ἐν τῷ θανάτῳ
  choice: trong sự chết
  rationale: Cụm giới từ diễn tả việc tiếp tục ở trong phạm vi của sự chết. Bản dịch ngắn gọn, giữ nguyên ẩn dụ và không giải thích quá mức.
theological_decisions:
- issue: Phạm vi chỉ người và sắc thái giống của ἀδελφοί
  choice: Dịch “anh chị em cùng đức tin” trong chính văn và ghi chú rằng nguyên văn dùng danh từ giống đực “anh em”.
  alternative: anh em
  rationale: Trong ngữ cảnh thư 1 Giăng, từ này nhiều khả năng chỉ toàn thể các tín hữu, gồm cả nam lẫn nữ. Cách dịch chính văn truyền đạt đúng phạm vi quy chiếu tự nhiên trong tiếng Việt, còn chú thích bảo lưu hình thức giống đực của nguyên văn.
- issue: Bản chất của “sự chết” và “sự sống”
  choice: Giữ nguyên các thuật ngữ “sự chết” và “sự sống”, không thêm lời giải nghĩa.
  alternative: sự chết thuộc linh và sự sống đời đời; lĩnh vực của sự chết và lĩnh vực của sự sống
  rationale: Câu văn nói đến một sự chuyển đổi thần học sâu sắc nhưng diễn đạt bằng ẩn dụ cô đọng. Không mở rộng ý giúp bảo toàn độ hàm súc và tránh đưa vào những nét nghĩa cụ thể hơn điều câu Hy Lạp trực tiếp nói.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “chúng ta” để giữ ngôi thứ nhất số nhiều bao gồm tác giả và độc giả; dùng “yêu thương” thay vì chỉ “yêu” để phù hợp văn phong Kinh Thánh tiếng Việt mà vẫn tự nhiên. Dấu chú thích [a] được đặt ngay sau cụm từ liên quan.
