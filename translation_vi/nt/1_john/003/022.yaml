id: 1JN.3.22
reference: 1 John 3:22
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ὃ ⸀ἐὰν αἰτῶμεν λαμβάνομεν ⸀ἀπ’ αὐτοῦ, ὅτι τὰς ἐντολὰς αὐτοῦ τηροῦμεν καὶ τὰ ἀρεστὰ ἐνώπιον αὐτοῦ ποιοῦμεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/022.yaml
  text: And whatever we ask[a], we receive from him, because we keep his commandments and do what is pleasing in his sight.
translation:
  language: vi
  text: Và bất cứ điều gì chúng ta cầu xin, chúng ta đều nhận được từ Ngài, vì chúng ta giữ các điều răn của Ngài và làm những điều đẹp lòng Ngài.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sát nghĩa: “làm những điều đẹp lòng trước mặt Ngài.”'
    reason: Bảo lưu sắc thái không gian/đánh giá của ἐνώπιον αὐτοῦ, trong khi chính văn dùng cách nói tiếng Việt tự nhiên hơn.
lexical_decisions:
- source_word: ὃ ἐὰν
  choice: bất cứ điều gì
  rationale: Cấu trúc đại từ quan hệ bất định diễn tả ý “bất cứ điều gì”; cách dịch này tự nhiên và giữ nguyên phạm vi khái quát của câu Hy Lạp.
- source_word: αἰτῶμεν
  choice: chúng ta cầu xin
  rationale: Trong ngữ cảnh lời cầu nguyện hướng đến Đức Chúa Trời, “cầu xin” tự nhiên và chính xác hơn “xin” đơn thuần.
- source_word: λαμβάνομεν
  choice: chúng ta đều nhận được
  rationale: Thì hiện tại ở đây diễn tả một thực tại tổng quát. Từ “đều” giúp câu tiếng Việt lưu loát nhưng không biến động từ thành lời bảo đảm máy móc tách khỏi mệnh đề nguyên nhân theo sau.
- source_word: ἀπ’ αὐτοῦ
  choice: từ Ngài
  rationale: Giới từ ἀπό với sở hữu cách chỉ nguồn nhận. “Ngài” là đại từ trang trọng, dễ hiểu khi chỉ về Đức Chúa Trời.
- source_word: ὅτι
  choice: vì
  rationale: ὅτι nêu nguyên nhân, nên “vì” bảo toàn mối liên hệ nhân quả được phát biểu rõ trong nguyên văn.
- source_word: τὰς ἐντολὰς αὐτοῦ
  choice: các điều răn của Ngài
  rationale: “Điều răn” giữ được sắc thái đạo đức và thần học nhất quán của ἐντολή trong văn chương Giăng.
- source_word: τηροῦμεν
  choice: chúng ta giữ
  rationale: “Giữ” bảo lưu nét nghĩa tuân giữ, coi trọng và làm theo, không thu hẹp từ này chỉ còn hành vi vâng lời.
- source_word: τὰ ἀρεστὰ
  choice: những điều đẹp lòng
  rationale: Tính từ trung tính số nhiều dùng như danh từ chỉ những điều làm Đức Chúa Trời hài lòng; cách diễn đạt này tự nhiên trong tiếng Việt.
- source_word: ἐνώπιον αὐτοῦ
  choice: đẹp lòng Ngài
  rationale: Trong kết cấu τὰ ἀρεστὰ ἐνώπιον αὐτοῦ, tiếng Việt diễn đạt tự nhiên là “những điều đẹp lòng Ngài”; nét nghĩa hình thức “trước mặt Ngài” được ghi ở chú thích.
- source_word: ποιοῦμεν
  choice: làm
  rationale: “Làm” tương ứng trực tiếp với ποιέω và không thêm sắc thái thói quen mạnh hơn nguyên văn.
theological_decisions:
- issue: Mối liên hệ giữa lời cầu xin được đáp lại và sự tuân giữ các điều răn
  choice: 'Giữ nguyên quan hệ nhân quả: “nhận được… vì chúng ta giữ…”'
  alternative: Làm nhẹ ὅτι thành một mối liên hệ chung chung hoặc giải thích câu như một công thức bảo đảm mọi lời cầu xin đều được đáp ứng
  rationale: Nguyên văn dùng ὅτι để nêu lý do. Bản dịch bảo toàn sự căng thẳng thần học của câu, không làm yếu quan hệ nhân quả và cũng không thêm lời giải thích vượt quá văn bản.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “chúng ta” mang tính bao gồm theo lời khuyên mục vụ của tác giả; viết hoa “Ngài” để duy trì lối xưng hô kính trọng phổ biến, không nhằm đưa thêm một lập trường hệ phái.
