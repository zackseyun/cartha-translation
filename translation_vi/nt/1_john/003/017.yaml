id: 1JN.3.17
reference: 1 John 3:17
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὃς δ’ ἂν ἔχῃ τὸν βίον τοῦ κόσμου καὶ θεωρῇ τὸν ἀδελφὸν αὐτοῦ χρείαν ἔχοντα καὶ κλείσῃ τὰ σπλάγχνα αὐτοῦ ἀπ’ αὐτοῦ, πῶς ἡ ἀγάπη τοῦ θεοῦ μένει ἐν αὐτῷ;
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/017.yaml
  text: But whoever has the world's goods and sees his brother in need[c][b][a], yet closes his heart against him—how does the love of God remain in him?
translation:
  language: vi
  text: Nhưng ai có của cải đời này, thấy người anh em mình đang túng thiếu[a] mà lại khép lòng mình lại trước người ấy[b], thì làm sao tình yêu của Đức Chúa Trời còn ở trong người ấy được?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “anh chị em mình”; tiếng Hy Lạp dùng từ “anh em” và có thể dùng theo nghĩa đại diện để chỉ một người cùng đức tin.
    reason: lexical_alternative
  - marker: b
    text: 'Sát nghĩa: “đóng lòng dạ mình lại đối với người ấy”; đây là thành ngữ chỉ việc khước từ lòng thương xót chân thành.'
    reason: lexical_alternative
  - marker: c
    text: “Tình yêu của Đức Chúa Trời” có thể chỉ tình yêu của Đức Chúa Trời đang hiện diện trong người ấy, hoặc tình yêu người ấy dành cho Đức Chúa Trời.
    reason: alternative_reading
lexical_decisions:
- source_word: βίον τοῦ κόσμου
  choice: của cải đời này
  rationale: βίος ở đây chỉ phương tiện vật chất để sống; cách dịch này tự nhiên và phù hợp với ngữ cảnh đáp ứng nhu cầu của người thiếu thốn.
- source_word: θεωρῇ
  choice: thấy
  rationale: Diễn đạt sự trực tiếp nhận biết hoàn cảnh của người anh em mà không thêm sắc thái giải thích.
- source_word: ἀδελφὸν
  choice: anh em mình
  rationale: Giữ danh từ giống đực số ít của nguyên văn theo cách nói Kinh Thánh tự nhiên trong tiếng Việt; phạm vi đại diện rộng hơn được nêu ở chú thích.
- source_word: χρείαν ἔχοντα
  choice: đang túng thiếu
  rationale: Diễn đạt tự nhiên ý 'có nhu cầu/thiếu điều cần thiết' và làm rõ đây là sự thiếu thốn vật chất trong ngữ cảnh.
- source_word: κλείσῃ τὰ σπλάγχνα αὐτοῦ ἀπ’ αὐτοῦ
  choice: khép lòng thương xót đối với người ấy
  rationale: σπλάγχνα theo nghĩa đen là nội tạng nhưng là thành ngữ chỉ lòng trắc ẩn sâu xa; cách dịch giữ hình ảnh đóng lòng và hành động cố ý không bày tỏ thương xót.
- source_word: πῶς
  choice: thì làm sao ... được?
  rationale: Giữ sức mạnh của câu hỏi tu từ bằng một cấu trúc tiếng Việt tự nhiên.
- source_word: ἡ ἀγάπη τοῦ θεοῦ
  choice: tình yêu của Đức Chúa Trời
  rationale: Giữ cấu trúc sở hữu mơ hồ của nguyên văn, không quyết định đó là tình yêu Đức Chúa Trời dành cho con người hay tình yêu con người dành cho Ngài.
- source_word: μένει ἐν αὐτῷ
  choice: vẫn ở trong người đó
  rationale: μένω là từ then chốt trong văn chương Giăng; 'vẫn ở' chuyển tải ý tiếp tục hiện diện một cách dễ hiểu trong tiếng Việt hiện đại.
theological_decisions:
- issue: Ý nghĩa của ἡ ἀγάπη τοῦ θεοῦ
  choice: tình yêu của Đức Chúa Trời
  alternative: tình yêu Đức Chúa Trời dành cho người ấy; hoặc tình yêu người ấy dành cho Đức Chúa Trời
  rationale: Sở hữu cách Hy Lạp cho phép cả hai cách hiểu, và thần học Giăng gắn chặt tình yêu được nhận lãnh với tình yêu được bày tỏ; bản dịch chính giữ nguyên sức căng này.
- issue: Phạm vi của ἀδελφὸν
  choice: anh em mình
  alternative: anh chị em mình; người cùng đức tin
  rationale: Nguyên văn dùng danh từ giống đực số ít. Bản chính giữ hình thức ấy, còn chú thích nêu khả năng từ này được dùng đại diện cho một người cùng đức tin.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “của cải đời này” cho nguồn lực vật chất, “khép lòng thương xót” để vừa giữ ẩn dụ vừa truyền đạt thành ngữ, và giữ nguyên sự mơ hồ thần học trong “tình yêu của Đức Chúa Trời”.
