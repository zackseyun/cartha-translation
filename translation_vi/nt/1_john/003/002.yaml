id: 1JN.3.2
reference: 1 John 3:2
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀγαπητοί, νῦν τέκνα θεοῦ ἐσμεν, καὶ οὔπω ἐφανερώθη τί ἐσόμεθα. ⸀οἴδαμεν ὅτι ἐὰν φανερωθῇ ὅμοιοι αὐτῷ ἐσόμεθα, ὅτι ὀψόμεθα αὐτὸν καθώς ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/002.yaml
  text: Beloved[a], now we are children of God, and what we will be has not yet been revealed. We know that if he is revealed, we will be like him[b], because we will see him as he is.
translation:
  language: vi
  text: Anh chị em yêu dấu, hiện nay chúng ta là con cái Đức Chúa Trời, còn chúng ta sẽ ra sao thì vẫn chưa được bày tỏ. Chúng ta biết rằng nếu Ngài được bày tỏ[a], chúng ta sẽ giống như Ngài, vì chúng ta sẽ thấy Ngài đúng như Ngài vốn có.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “nếu điều đó được bày tỏ,” tức là điều chúng ta sẽ trở thành; chủ ngữ trong tiếng Hy Lạp được hàm ẩn. Mạch văn nghiêng về cách hiểu “Ngài,” chỉ về Đấng Christ. Nhiều bản dịch diễn ý là “khi Ngài hiện ra.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀγαπητοί
  choice: Anh chị em yêu dấu
  rationale: Lối xưng hô số nhiều ấm áp, tự nhiên trong cộng đồng đức tin Việt Nam, đồng thời giữ rõ sắc thái được yêu của từ Hy Lạp.
- source_word: νῦν τέκνα θεοῦ ἐσμεν
  choice: hiện nay chúng ta là con cái Đức Chúa Trời
  rationale: “Hiện nay” làm nổi bật sự tương phản giữa địa vị hiện tại và tình trạng tương lai chưa được bày tỏ; “con cái” không áp đặt giới tính.
- source_word: οὔπω ἐφανερώθη τί ἐσόμεθα
  choice: còn chúng ta sẽ ra sao thì vẫn chưa được bày tỏ
  rationale: Diễn đạt tự nhiên trong tiếng Việt, giữ thể bị động của φανερόω và ý về tình trạng tương lai chưa hiển lộ.
- source_word: ἐὰν φανερωθῇ
  choice: nếu Ngài được bày tỏ
  rationale: Giữ liên từ điều kiện và thể bị động của nguyên văn; đại từ tôn kính phù hợp văn phong Kinh Thánh tiếng Việt. Chủ ngữ Hy Lạp được hàm ẩn nên có chú thích về cách hiểu khác.
- source_word: ὅμοιοι αὐτῷ ἐσόμεθα
  choice: chúng ta sẽ giống như Ngài
  rationale: ὅμοιοι chỉ sự tương đồng chứ không phải đồng nhất; cách dịch này vừa rõ vừa tránh hàm ý cùng bản thể.
- source_word: ὀψόμεθα αὐτὸν καθώς ἐστιν
  choice: chúng ta sẽ thấy Ngài đúng như Ngài vốn có
  rationale: “Đúng như” thể hiện sức nhấn của καθώς; “vốn có” là cách nói tự nhiên, trang trọng về việc nhận thấy Ngài trong thực tại chân thật.
theological_decisions:
- issue: Chủ thể hàm ẩn của ἐὰν φανερωθῇ
  choice: 'Hiểu là Đấng Christ: “nếu Ngài được bày tỏ.”'
  alternative: “nếu điều đó được bày tỏ,” chỉ tình trạng tương lai của các tín hữu; hoặc diễn ý là “khi Ngài hiện ra.”
  rationale: Mạch văn về việc thấy Ngài và trở nên giống Ngài nghiêng về Đấng Christ, nhưng cấu trúc Hy Lạp không nêu chủ ngữ nên sự mơ hồ chân thực được ghi nhận trong chú thích.
- issue: Bản chất của sự giống Ngài trong tương lai
  choice: Một sự tương đồng có thật với Ngài, không phải đồng nhất với Ngài.
  alternative: Các cách diễn ý mạnh hơn như “chúng ta sẽ trở nên y như Ngài.”
  rationale: ὅμοιοι diễn tả sự giống nhau chứ không khẳng định đồng nhất về hữu thể; bản dịch giữ nguyên lời hứa mạnh mẽ mà không nói quá nguyên văn.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “Anh chị em yêu dấu” làm lời gọi thân tình; viết hoa “Ngài” theo quy ước tôn kính phổ biến. Giữ sự lặp lại của động từ “được bày tỏ” và sắc thái điều kiện “nếu” trong nguyên văn.
