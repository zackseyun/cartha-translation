id: 1JN.3.12
reference: 1 John 3:12
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οὐ καθὼς Κάϊν ἐκ τοῦ πονηροῦ ἦν καὶ ἔσφαξεν τὸν ἀδελφὸν αὐτοῦ· καὶ χάριν τίνος ἔσφαξεν αὐτόν; ὅτι τὰ ἔργα αὐτοῦ πονηρὰ ἦν, τὰ δὲ τοῦ ἀδελφοῦ αὐτοῦ δίκαια.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/012.yaml
  text: not like Cain[a], who was from the evil one and slaughtered his brother. And why did he slaughter him? Because his deeds were evil[b], but those of his brother were righteous.
translation:
  language: vi
  text: Đừng như Ca-in[a], kẻ vốn từ Kẻ Ác mà ra và đã sát hại[b] người anh em của mình. Vì sao ông ta sát hại người ấy? Vì những việc ông ta làm đều xấu xa, còn những việc người anh em ông ta làm thì công chính.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “từ điều ác mà ra.” Cụm từ Hy Lạp có thể được hiểu theo nghĩa trừu tượng, nhưng trong cách dùng của Giăng, cụm này thường chỉ Kẻ Ác như một nhân vật.'
    reason: alternative_reading
  - marker: b
    text: Động từ Hy Lạp mạnh và sinh động hơn từ “giết” thông thường, có thể gợi hành động giết như giết con vật.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ καθὼς Κάϊν
  choice: Đừng như Ca-in
  rationale: Trong mạch khuyên nhủ từ câu trước, lối diễn đạt này truyền đạt tự nhiên sức phủ định và so sánh của οὐ καθὼς.
- source_word: ἐκ τοῦ πονηροῦ
  choice: vốn từ Kẻ Ác mà ra
  rationale: Giữ ý nguồn gốc của ἐκ và cách hiểu τοῦ πονηροῦ là một nhân vật; cách diễn đạt này tự nhiên hơn trong tiếng Việt so với lối dịch từng chữ.
- source_word: ἔσφαξεν
  choice: sát hại
  rationale: Diễn tả hành động giết người có chủ ý và giữ phần nào sắc thái mạnh, dữ dội của σφάζω mà không dùng từ cổ hoặc gây ấn tượng rằng nhiều người bị giết.
- source_word: ἀδελφὸν αὐτοῦ
  choice: anh em mình
  rationale: ἀδελφός ở đây chỉ người anh em nhưng bản thân từ Hy Lạp không mã hóa quan hệ anh hay em; cách dịch này tránh thêm chi tiết không có trong câu.
- source_word: χάριν τίνος
  choice: Vì sao
  rationale: Cách hỏi nguyên nhân ngắn gọn, tự nhiên, tương đương với thành ngữ Hy Lạp.
- source_word: τὰ ἔργα αὐτοῦ πονηρὰ ἦν
  choice: những việc ông ta làm đều xấu xa
  rationale: Dịch ἔργα theo nghĩa các hành vi, việc làm trong ngữ cảnh đạo đức; 'xấu xa' truyền đạt rõ phẩm chất đạo đức tiêu cực của πονηρά.
- source_word: τὰ δὲ τοῦ ἀδελφοῦ αὐτοῦ δίκαια
  choice: còn những việc anh em ông ta làm thì công chính
  rationale: Làm rõ danh từ bị tỉnh lược trong tiếng Hy Lạp để câu tiếng Việt tự nhiên, đồng thời giữ sự tương phản đạo đức với các việc làm xấu xa.
theological_decisions:
- issue: τοῦ πονηροῦ chỉ một nhân vật hay điều ác nói chung
  choice: Kẻ Ác
  alternative: điều ác
  rationale: Trong văn chương Giăng, cụm có mạo từ này thường chỉ Kẻ Ác như một nhân vật. Tuy vậy, khả năng hiểu theo nghĩa trừu tượng được giữ trong chú thích thay vì bị loại bỏ.
- issue: Mức độ mạnh của động từ σφάζω
  choice: sát hại
  alternative: giết
  rationale: σφάζω sinh động và dữ dội hơn động từ chung chỉ việc giết; 'sát hại' giữ sắc thái đó mà không hàm ý một phương thức cụ thể không được câu văn nêu rõ.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “ông ta/người ấy” để tránh lặp tên nhưng không biểu thị sự kính trọng đặc biệt. Giữ “anh em” thay vì xác định “em trai” vì ἀδελφός trong chính câu này không nêu thứ bậc tuổi tác.
