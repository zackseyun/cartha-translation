  to: Đừng như Ca-in[a], kẻ vốn từ Kẻ Ác mà ra và đã sát hại[b] người anh em của mình. Vì sao ông ta sát hại người ấy? Vì những việc ông ta làm đều xấu xa, còn những việc người anh em ông ta làm thì công chính.
  rationale: Chỉ thay «anh em» bằng «người anh em» ở cả hai chỗ để phản ánh số ít của nguyên ngữ và tránh cách hiểu là nhiều anh em. Các lựa chọn còn lại giữ nguyên vì trung thành với văn bản và tự nhiên trong tiếng Việt hiện đại.
