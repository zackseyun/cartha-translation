  verdict: revise
  source_fidelity: Cần thể hiện rõ hơn μένων, phân từ hiện tại của μένω, bằng “ở lại trong Ngài”; “ở trong Ngài” không sai về ý nhưng làm mờ nét tiếp diễn/duy trì của động từ then chốt này. Chính văn vẫn giữ được sự mơ hồ hợp lý của các hiện tại ἁμαρτάνει/ἁμαρτάνων, còn chú thích nêu cách hiểu hành động tiếp diễn hay đặc trưng.
  naturalness: “Ai ở lại trong Ngài thì...” là cách nói tự nhiên, trang trọng và quen thuộc trong tiếng Việt Cơ Đốc hiện đại. Cấu trúc song song “ai ... thì” rõ ràng. “Chưa từng thấy ... cũng chưa từng biết” diễn đạt tự nhiên kinh nghiệm bị phủ định của các thì hoàn thành, dù tiếng Việt không đánh dấu thì hoàn thành tương ứng một-một.
  terminology: “Ở lại trong Ngài” bảo toàn thuật ngữ Giăng cho μένω. “Phạm tội,” “thấy,” và “biết” phù hợp với văn phong Kinh Thánh hiện đại. Giữ “Ngài” bảo toàn đại từ không nêu rõ đối tượng quy chiếu trong nguyên văn.
  issues:
