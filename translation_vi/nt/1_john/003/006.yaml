id: 1JN.3.6
reference: 1 John 3:6
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: πᾶς ὁ ἐν αὐτῷ μένων οὐχ ἁμαρτάνει· πᾶς ὁ ἁμαρτάνων οὐχ ἑώρακεν αὐτὸν οὐδὲ ἔγνωκεν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/006.yaml
  text: Everyone who remains in him does not sin[a]; everyone who sins has not seen him nor known him.
translation:
  language: vi
  text: Ai ở lại trong Ngài thì không phạm tội[a]; ai phạm tội thì chưa từng thấy Ngài, cũng chưa từng biết Ngài.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay, theo nghĩa nhấn mạnh hành động tiếp diễn hoặc mang tính đặc trưng: “không tiếp tục phạm tội ... ai tiếp tục phạm tội.” Các dạng thì hiện tại trong tiếng Hy Lạp có thể được hiểu theo nghĩa này.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς ὁ
  choice: Ai ... thì
  rationale: Cấu trúc này diễn đạt một mệnh đề khái quát áp dụng cho bất cứ người nào thuộc nhóm được nói đến; “Ai ... thì” tự nhiên trong tiếng Việt và giữ được tính phổ quát.
- source_word: ἐν αὐτῷ μένων
  choice: ở trong Ngài
  rationale: μένω mang nghĩa tiếp tục ở lại, gắn bó; trong lối diễn đạt của Giăng, “ở trong Ngài” vừa tự nhiên vừa bảo toàn ngôn ngữ về mối liên hệ hiệp nhất.
- source_word: οὐχ ἁμαρτάνει
  choice: không phạm tội
  rationale: Giữ cách diễn đạt trực tiếp của thì hiện tại Hy Lạp, không tự đưa sắc thái lặp lại vào chính văn; chú thích nêu khả năng hiểu là hành động tiếp diễn hoặc mang tính đặc trưng.
- source_word: ὁ ἁμαρτάνων
  choice: ai phạm tội
  rationale: Phân từ hiện tại được chuyển thành mệnh đề khái quát tự nhiên và song song với vế trước; khả năng chỉ việc cứ tiếp tục phạm tội được ghi trong chú thích.
- source_word: οὐχ ἑώρακεν αὐτόν
  choice: chưa từng thấy Ngài
  rationale: Thì hoàn thành diễn tả tình trạng hiện tại phát sinh từ việc không thấy Ngài; “chưa từng thấy” truyền đạt rõ ý phủ định kinh nghiệm ấy trong tiếng Việt.
- source_word: οὐδὲ ἔγνωκεν αὐτόν
  choice: cũng chưa từng biết Ngài
  rationale: οὐδέ nối thêm một phủ định, được diễn đạt tự nhiên bằng “cũng”; “biết” giữ được khả năng chỉ sự nhận biết mang tính quan hệ trong văn mạch Giăng.
- source_word: αὐτῷ / αὐτόν
  choice: Ngài
  rationale: Giữ nguyên hình thức đại từ của bản Hy Lạp, không xác định rõ hơn là Đức Chúa Trời, Đức Chúa Con hay Đấng Christ; viết hoa theo quy ước tiếng Việt dành cho đại từ chỉ Đức Chúa Trời.
theological_decisions:
- issue: Câu này có dạy rằng người tin Chúa tuyệt đối không bao giờ phạm một tội nào hay không
  choice: Chính văn giữ cách nói trực tiếp “không phạm tội ... ai phạm tội,” còn chú thích nêu rằng các dạng hiện tại có thể mô tả hành động tiếp diễn hoặc đặc trưng.
  alternative: Dịch diễn giải ngay trong chính văn là “không cứ phạm tội ... ai cứ phạm tội.”
  rationale: Thì hiện tại Hy Lạp có thể mang sắc thái tiếp diễn hoặc đặc trưng trong văn mạch, nhưng bản thân hình thái không bắt buộc phải diễn đạt bằng “cứ.” Cách trình bày này bảo toàn cả lời khẳng định mạnh của câu và sự căng thẳng với 1 Giăng 1:8–2:2.
- issue: Đối tượng được đại từ αὐτός chỉ đến
  choice: Giữ là “Ngài,” không thay bằng một danh xưng cụ thể.
  alternative: Ghi rõ “Đức Chúa Trời,” “Đức Chúa Con,” hoặc “Đấng Christ.”
  rationale: Bản Hy Lạp dùng đại từ, trong khi văn mạch gần có thể khiến độc giả cân nhắc hơn một đối tượng quy chiếu. Không xác định thêm giúp tránh giải quyết điều nguồn văn bản để ngỏ.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng cấu trúc “Ai ... thì” để diễn đạt tính khái quát, và giữ “ở trong Ngài” như một thuật ngữ then chốt trong văn chương Giăng.
