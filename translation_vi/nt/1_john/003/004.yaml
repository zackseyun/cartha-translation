  to: Ai phạm tội[a] cũng làm điều trái luật pháp, và tội lỗi là sự trái luật pháp[b].
  rationale: Bản sửa loại bỏ sự nhấn mạnh không cần thiết của “cứ”, giữ tính khái quát và độ mở của các hiện tại Hy Lạp, đồng thời chuyển chú thích a đến cụm động từ mà chú thích giải thích. Cách dịch ἀνομία và mệnh đề định nghĩa được giữ nguyên vì vừa sát nghĩa vừa phù hợp với văn phong Việt ngữ hiện đại, trang trọng.
