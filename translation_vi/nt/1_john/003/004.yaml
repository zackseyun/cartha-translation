  verdict: revise
  source_fidelity: Bản nháp truyền đạt đúng cấu trúc khái quát và mệnh đề định nghĩa của nguyên văn. Tuy nhiên, “cứ phạm” nhấn mạnh sự lặp lại/liên tục mạnh hơn mức mà các hiện tại ποιῶν/ποιεῖ tự chúng bắt buộc; trong câu này nên giữ cách diễn đạt không áp đặt cách hiểu về tính thường xuyên. “Làm điều trái luật pháp” là cách diễn đạt khả dụng cho ποιεῖ τὴν ἀνομίαν, nhưng cần neo chú thích về hiện tại vào chính cụm “phạm tội” mà nó giải thích.
  naturalness: “Ai phạm tội cũng làm điều trái luật pháp” tự nhiên, trang trọng và dễ hiểu trong tiếng Việt hiện đại. Bỏ “cứ” giúp câu bớt nặng và tránh tạo cảm giác chỉ nói về hành vi lặp đi lặp lại. “Tội lỗi là sự trái luật pháp” giữ văn phong cô đọng của câu định nghĩa.
  terminology: Giữ “tội lỗi” cho ἁμαρτία và “luật pháp” cho trường nghĩa νόμος. “Sự trái luật pháp” tuy hơi trang trọng, phù hợp văn cảnh Kinh Thánh và không thu hẹp ἀνομία vào việc vi phạm một bộ luật được xác định. Không nên diễn giải thành luật Môi-se, luật dân sự, hay một hệ thống luật cụ thể.
