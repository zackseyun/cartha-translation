source:
  edition: SBLGNT
  text: Πᾶς ὁ ποιῶν τὴν ἁμαρτίαν καὶ τὴν ἀνομίαν ποιεῖ, καὶ ἡ ἁμαρτία ἐστὶν ἡ ἀνομία.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/004.yaml
  text: Everyone who practices sin also practices lawlessness[b][a], and sin is lawlessness.
translation:
  language: vi
  text: Ai phạm tội[a] cũng làm điều trái luật pháp, và tội lỗi là sự trái luật pháp[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Ai cứ phạm tội thì cũng làm điều trái luật pháp.” Các dạng hiện tại trong tiếng Hy Lạp có thể gợi hành động đang diễn ra hoặc có tính đặc trưng trong văn cảnh; bản dịch chính không làm rõ thêm sắc thái này.'
    reason: lexical_alternative
  - marker: b
    text: “Sự trái luật pháp” dịch từ ἀνομία, cũng có thể dịch là “sự vô luật pháp” hoặc “sự vi phạm luật pháp.” Từ này không tự xác định ở đây là một bộ luật cụ thể nào.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πᾶς ὁ ποιῶν
  choice: Ai cứ phạm
  rationale: 'Cấu trúc với phân từ hiện tại có mạo từ mang nghĩa khái quát: bất cứ ai có hành vi ấy. Từ “cứ” diễn đạt hành động đang tiếp diễn hoặc có tính đặc trưng trong văn cảnh, nhưng không biến thì hiện tại thành một phạm trù kỹ thuật về thói quen.'
- source_word: τὴν ἁμαρτίαν
  choice: tội
  rationale: Trong tiếng Việt, “phạm tội” là cách diễn đạt tự nhiên cho ποιεῖν ἁμαρτίαν. Mạo từ Hy Lạp không đòi hỏi phải dịch thành một tội cụ thể, vì danh từ ở đây chỉ tội lỗi nói chung.
- source_word: καὶ τὴν ἀνομίαν ποιεῖ
  choice: thì cũng làm điều trái luật pháp
  rationale: “Làm điều” giữ được sự song song của động từ ποιέω, còn “trái luật pháp” diễn đạt ἀνομία bằng tiếng Việt hiện đại, dễ hiểu mà không tự ý xác định đó là một bộ luật cụ thể.
- source_word: ἀνομία
  choice: sự trái luật pháp
  rationale: Cách dịch này bảo toàn mối liên hệ với νόμος (luật pháp) và sắc thái không phù hợp, chống lại hoặc vi phạm luật pháp. “Sự vô luật pháp” sát hình thức hơn nhưng kém tự nhiên; “sự vi phạm luật pháp” có thể thu hẹp ý nghĩa vào từng hành vi vi phạm.
- source_word: καὶ ἡ ἁμαρτία ἐστὶν ἡ ἀνομία
  choice: và tội lỗi là sự trái luật pháp
  rationale: Mệnh đề được giữ ở dạng định nghĩa trực tiếp, không làm nhẹ thành một hệ quả hay một ví dụ. Tiếng Việt không cần biểu thị riêng hai mạo từ Hy Lạp trong cấu trúc này.
theological_decisions:
- issue: Các dạng hiện tại ποιῶν và ποιεῖ nói về một hành vi đơn lẻ hay hành vi tiếp diễn, có tính đặc trưng
  choice: Dùng “cứ phạm” để làm rõ sắc thái tiếp diễn hoặc có tính đặc trưng trong văn cảnh
  alternative: Dịch đơn giản là “phạm” hoặc sát chữ hơn là “làm tội”
  rationale: Dạng hiện tại trong văn cảnh có thể gợi hành vi đang tiếp diễn hoặc đặc trưng, nhưng bản dịch không coi đây là một “thì thói quen” mang tính kỹ thuật. Chú thích giữ lại cách hiểu ít nhấn mạnh hơn.
- issue: Phạm vi ý nghĩa của ἀνομία trong lời định nghĩa về tội lỗi
  choice: sự trái luật pháp
  alternative: sự vô luật pháp; sự vi phạm luật pháp; sự gian ác
  rationale: “Sự trái luật pháp” giữ được sức nặng của lời định nghĩa và liên hệ từ vựng với “luật pháp”, đồng thời không tự ý đồng nhất luật pháp ở đây với luật dân sự hay riêng một bộ luật cụ thể.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Phạm tội” là cách nói tự nhiên trong tiếng Việt; “làm điều trái luật pháp” tránh lối dịch cứng “làm sự vô luật pháp.” Câu thứ hai giữ nguyên tính cô đọng và sức căng thần học của lời định nghĩa trong nguyên văn.
