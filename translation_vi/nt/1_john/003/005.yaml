  source_fidelity: 'Bản dịch phản ánh đúng các thành phần chính của nguyên văn: οἴδατε là hiện tại mang nghĩa “anh em biết”; ἐφανερώθη được diễn đạt tự nhiên là “đã hiện ra”; để nêu mục đích của ἵνα; τὰς ἁμαρτίας giữ số nhiều qua “các tội lỗi”; và mệnh đề cuối giữ sự đối lập giữa số nhiều “các tội lỗi” và số ít khái quát “tội lỗi.” “Cất bỏ” truyền đạt αἴρω theo nghĩa loại bỏ mà không áp đặt cơ chế chuộc tội. Chú thích bảo lưu khả năng “mang đi.”'
  naturalness: Văn câu rõ ràng, trang trọng vừa phải và tự nhiên trong tiếng Việt Kinh Thánh hiện đại. “Anh em” phù hợp với lời ngỏ gửi cộng đồng; “Ngài” phù hợp quy chiếu đã rõ trong ngữ cảnh. Cụm “các tội lỗi” hơi trang trọng nhưng chấp nhận được và hữu ích để giữ số nhiều của tiếng Hy Lạp.
  terminology: “Tội lỗi,” “cất bỏ,” và “Ngài” nhất quán với cách dùng Cơ Đốc giáo tiếng Việt phổ thông. Bản dịch không thêm danh xưng hay diễn giải tín lý vào chính văn. Chú thích được neo đúng tại cụm dịch αἴρω.
