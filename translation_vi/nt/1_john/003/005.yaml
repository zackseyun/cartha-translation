id: 1JN.3.5
reference: 1 John 3:5
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ οἴδατε ὅτι ἐκεῖνος ἐφανερώθη ἵνα τὰς ⸀ἁμαρτίας ἄρῃ, καὶ ἁμαρτία ἐν αὐτῷ οὐκ ἔστιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/005.yaml
  text: And you know that he appeared in order to take away sins[b][a], and in him there is no sin.
translation:
  language: vi
  text: Anh em biết rằng Ngài đã hiện ra để cất bỏ các tội lỗi[a], và trong Ngài không có tội lỗi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “mang đi các tội lỗi.” Động từ Hy Lạp có thể có nghĩa là lấy đi, loại bỏ hoặc mang đi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἴδατε
  choice: anh em biết
  rationale: Dạng hoàn thành οἶδα thường mang nghĩa hiện tại trong tiếng Hy Lạp Koinē. “Anh em biết” tự nhiên và phù hợp với lời tác giả nói cùng cộng đồng độc giả.
- source_word: ἐκεῖνος
  choice: Ngài
  rationale: Đại từ nhấn mạnh này chỉ về Chúa Giê-su Christ trong ngữ cảnh. “Ngài” diễn đạt tự nhiên sự quy chiếu ấy mà không chèn thêm danh xưng không có trong câu.
- source_word: ἐφανερώθη
  choice: đã hiện ra
  rationale: Động từ bị động φανερόω ở đây nói đến việc Đấng Christ xuất hiện trong lịch sử. “Đã hiện ra” là cách nói hiện đại, rõ nghĩa; sắc thái “được bày tỏ” được ghi nhận trong chú thích.
- source_word: ἵνα
  choice: để
  rationale: “Để” diễn đạt tự nhiên và đầy đủ ý nghĩa mục đích của ἵνα trong tiếng Việt.
- source_word: τὰς ἁμαρτίας
  choice: các tội lỗi
  rationale: Giữ số nhiều và tính xác định của cụm danh từ Hy Lạp, nhấn mạnh những tội lỗi cụ thể thay vì khái niệm tội lỗi nói chung.
- source_word: ἄρῃ
  choice: cất bỏ
  rationale: αἴρω có thể chỉ việc lấy đi, loại bỏ hoặc mang đi. “Cất bỏ” vừa tự nhiên, vừa giữ trọng tâm là loại bỏ tội lỗi mà không ấn định một mô hình chuộc tội riêng biệt.
- source_word: ἁμαρτία
  choice: tội lỗi
  rationale: Danh từ số ít không có mạo từ diễn tả tội lỗi theo nghĩa tuyệt đối. “Tội lỗi” là cách diễn đạt tự nhiên trong tiếng Việt và khẳng định Đấng Christ hoàn toàn vô tội.
- source_word: ἐν αὐτῷ
  choice: trong Ngài
  rationale: Giữ thành ngữ Giăng và ý nghĩa thần học của ἐν cộng cách, thay vì diễn giải thành một phẩm chất trừu tượng.
theological_decisions:
- issue: Đối tượng được ἐκεῖνος chỉ đến
  choice: Chúa Giê-su Christ, được diễn đạt bằng “Ngài”
  alternative: dịch sát hình thức là “Đấng ấy” hoặc “người ấy”
  rationale: Trong ngữ cảnh gần, Đấng đã hiện ra để cất bỏ tội lỗi và không có tội lỗi chính là Chúa Giê-su Christ. “Ngài” giữ rõ sự quy chiếu mà không thêm tên riêng vào bản văn.
- issue: Ý nghĩa của αἴρω khi có tân ngữ là tội lỗi
  choice: cất bỏ các tội lỗi
  alternative: mang lấy hoặc mang đi các tội lỗi
  rationale: Câu nhấn mạnh mục đích Đấng Christ hiện ra là loại bỏ tội lỗi. “Cất bỏ” bảo toàn trọng tâm này mà không thu hẹp ý nghĩa vào một cách giải thích riêng về sự chuộc tội; khả năng “mang đi” được giữ trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh em” cho đại từ số nhiều ngôi thứ hai trong lời khuyên dạy cộng đồng; viết hoa “Ngài” để quy chiếu rõ đến Chúa Giê-su. Không dùng “được bày tỏ” trong chính văn vì kém tự nhiên hơn “đã hiện ra” trong tiếng Việt hiện đại.
