id: 1JN.3.1
reference: 1 John 3:1
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἴδετε ποταπὴν ἀγάπην δέδωκεν ἡμῖν ὁ πατὴρ ἵνα τέκνα θεοῦ κληθῶμεν, ⸂καὶ ἐσμέν⸃. διὰ τοῦτο ὁ κόσμος οὐ γινώσκει ⸀ἡμᾶς ὅτι οὐκ ἔγνω αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/001.yaml
  text: See what kind of love the Father has given to us[a], that we should be called children of God—and we are. For this reason the world does not know us[e][d][c][b], because it did not know him.
translation:
  language: vi
  text: Hãy xem Đức Chúa Cha đã ban cho chúng ta tình yêu dường nào[a], để chúng ta được gọi là con cái Đức Chúa Trời—và chúng ta là con cái Đức Chúa Trời.[b] Vì lý do đó, thế gian không biết chúng ta[c], bởi vì thế gian đã không biết Ngài.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “tình yêu thuộc loại nào.” Cụm từ Hy Lạp bày tỏ sự kinh ngạc trước tính chất của tình yêu Đức Chúa Cha, chứ không chỉ nói tình yêu ấy lớn lao đến mức nào.'
    reason: lexical_alternative
  - marker: b
    text: Một số thủ bản không có câu “và chúng ta là con cái Đức Chúa Trời.”
    reason: textual_variant
  - marker: c
    text: “Không biết” cũng có thể dịch là “không nhận biết”; tương tự ở vế sau.
    reason: lexical_alternative
  - marker: d
    text: “Ngài” hợp lý nhất chỉ về Đức Chúa Cha trong câu này; một số người hiểu là chỉ về Đấng Christ trong văn mạch các sách Giăng.
    reason: alternative_reading
lexical_decisions:
- source_word: ἴδετε
  choice: Hãy xem
  rationale: Mệnh lệnh số nhiều dùng để thu hút sự chú ý; “Hãy xem” tự nhiên, trực tiếp và không cổ kính.
- source_word: ποταπὴν ἀγάπην
  choice: tình yêu dường nào
  rationale: Diễn tả sự kinh ngạc trước tính chất đặc biệt của tình yêu, không chỉ riêng mức độ lớn lao; chú thích giữ phương án sát cấu trúc hơn.
- source_word: δέδωκεν
  choice: đã ban
  rationale: “Ban” hợp tự nhiên với tình yêu Đức Chúa Trời và sắc thái ân tứ; ngữ cảnh cho thấy kết quả vẫn còn, dù tiếng Việt không bắt buộc biểu thị riêng thì hoàn thành.
- source_word: ὁ πατὴρ
  choice: Đức Chúa Cha
  rationale: Danh xưng chỉ Đức Chúa Trời trong văn mạch Giăng; cách gọi trang trọng và quen thuộc trong tiếng Việt.
- source_word: τέκνα θεοῦ
  choice: con cái Đức Chúa Trời
  rationale: τέκνα bao gồm mọi giới và chỉ quan hệ con cái, không nên thu hẹp thành “các con trai”.
- source_word: κληθῶμεν
  choice: được gọi là
  rationale: Giữ thể bị động và nội dung/kết quả được giới thiệu bởi ἵνα.
- source_word: καὶ ἐσμέν
  choice: và thật vậy, chúng ta là con cái Ngài
  rationale: Làm rõ bổ ngữ được lược trong tiếng Hy Lạp và giữ sức nhấn mạnh xác nhận của câu; biến thể bản văn được ghi chú.
- source_word: διὰ τοῦτο
  choice: Vì lý do đó
  rationale: Giữ liên kết suy luận trực tiếp với điều vừa nói.
- source_word: ὁ κόσμος
  choice: thế gian
  rationale: Giữ thuật ngữ đặc trưng của văn chương Giăng mà không diễn giải ngay trong chính văn.
- source_word: οὐ γινώσκει ἡμᾶς
  choice: không biết chúng ta
  rationale: Giữ sự song hành với “đã không biết Ngài”; nghĩa “không nhận biết” được nêu trong chú thích.
theological_decisions:
- issue: Đối tượng của αὐτόν
  choice: “Ngài” được hiểu gần nhất là Đức Chúa Cha
  alternative: Có thể hiểu là Đấng Christ trong văn mạch thần học rộng hơn của các sách Giăng
  rationale: Tiền ngữ được nêu rõ gần nhất trong câu là Đức Chúa Cha. Tuy vậy, đại từ Hy Lạp tự nó không định danh, nên không giải quyết dứt khoát sự căng thẳng thần học mà ghi nhận cách hiểu khác trong chú thích.
- issue: Có hay không cụm καὶ ἐσμέν
  choice: 'Đưa vào chính văn: “và thật vậy, chúng ta là con cái Ngài”'
  alternative: Lược bỏ theo một số thủ bản
  rationale: SBLGNT đưa cụm này vào chính văn; nó nhấn mạnh rằng người tin không chỉ được gọi mà thực sự là con cái Đức Chúa Trời. Chứng cứ lược bỏ được ghi trong chú thích.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “Đức Chúa Cha,” “Đức Chúa Trời,” và đại từ kính trọng “Ngài”; giữ “thế gian” như thuật ngữ Giăng. Dấu gạch ngang làm nổi bật lời xác nhận mạnh mẽ καὶ ἐσμέν.
