  - severity: low
    issue: Chú thích biến thể b trích cả câu mở rộng của bản dịch
    rationale: Biến thể liên quan cụ thể đến καὶ ἐσμέν. Sau khi chính văn dùng lời khẳng định trực tiếp hơn, chú thích nên trích đúng phần tiếng Việt tương ứng để người đọc thấy rõ phạm vi biến thể.
