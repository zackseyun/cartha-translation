  to: Hãy xem Đức Chúa Cha đã ban cho chúng ta tình yêu dường nào[a], để chúng ta được gọi là con cái Đức Chúa Trời—và chúng ta là con cái Đức Chúa Trời.[b] Vì lý do đó, thế gian không biết chúng ta[c], bởi vì thế gian đã không biết Ngài.[d]
  rationale: Chỉnh sửa duy nhất trong chính văn loại bỏ trạng từ “thật vậy,” vốn diễn giải thêm sắc thái của καὶ ἐσμέν, và dùng lời khẳng định trực tiếp tương ứng với câu Hy Lạp. Chú thích b được điều chỉnh để khớp chính xác với phần văn bản có biến thể. Các lựa chọn còn lại giữ nguyên vì trung thành với SBLGNT, tự nhiên trong tiếng Việt hiện đại, và bảo lưu mơ hồ về tiền ngữ của αὐτόν.
