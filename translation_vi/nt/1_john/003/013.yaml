id: 1JN.3.13
reference: 1 John 3:13
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸀μὴ θαυμάζετε, ⸀ἀδελφοί, εἰ μισεῖ ὑμᾶς ὁ κόσμος.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/013.yaml
  text: Do not be surprised[a], brothers, if the world hates you.
translation:
  language: vi
  text: Thưa anh em[a], đừng ngạc nhiên nếu thế gian ghét anh em.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Anh em” dịch hình thức số nhiều giống đực trong tiếng Hy Lạp; ở đây lời gọi này nhiều khả năng hướng đến toàn thể cộng đồng tín hữu, kể cả phụ nữ.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ θαυμάζετε
  choice: đừng ngạc nhiên
  rationale: Mệnh lệnh hiện tại đi với μή tạo thành lời ngăn cấm. “Đừng ngạc nhiên” diễn đạt tự nhiên ý của θαυμάζω trong ngữ cảnh này, không mang sắc thái cổ như “đừng lấy làm lạ”.
- source_word: ἀδελφοί
  choice: thưa anh em
  rationale: Đây là danh từ số nhiều giống đực ở hô cách. “Thưa anh em” giữ được hình thức xưng gọi trực tiếp và trang trọng; chú thích cho biết lời gọi này nhiều khả năng hướng đến toàn thể cộng đồng tín hữu, kể cả phụ nữ.
- source_word: εἰ
  choice: nếu
  rationale: Giữ nghĩa điều kiện thông thường của εἰ và không diễn giải quá mức thành “khi” hay “vì rằng”, dù điều kiện được nêu có tính hiện thực.
- source_word: μισεῖ
  choice: ghét
  rationale: Động từ hiện tại chủ động được chuyển bằng “ghét”, cách diễn đạt gọn và tự nhiên cho một thực trạng có tính tiếp diễn hoặc khái quát.
- source_word: ὁ κόσμος
  choice: thế gian
  rationale: “Thế gian” là cách diễn đạt quen thuộc, tự nhiên trong văn mạch Giăng và giữ được chiều rộng thần học của κόσμος mà không thêm lời giải nghĩa như “xã hội chống nghịch Đức Chúa Trời” vào chính văn.
theological_decisions:
- issue: Lối xưng gọi giống đực đại diện trong ἀδελφοί
  choice: Giữ “anh em” trong chính văn và giải thích phạm vi bao gồm trong chú thích.
  alternative: “Anh chị em” hoặc “các anh chị em trong đức tin”
  rationale: Bản dịch bảo toàn hình thức số nhiều giống đực của nguyên ngữ, đồng thời không thu hẹp đối tượng chỉ còn nam giới; khả năng bao gồm toàn thể cộng đồng tín hữu được nêu rõ trong chú thích.
- issue: Sắc thái của κόσμος trong văn chương Giăng
  choice: Dịch là “thế gian” mà không khai triển trong chính văn.
  alternative: “Xã hội chống nghịch Đức Chúa Trời” hoặc “hệ thống thế gian”
  rationale: Trong 1 Giăng, κόσμος có thể chỉ nhân loại hay trật tự đang đối nghịch với Đức Chúa Trời. “Thế gian” duy trì độ rộng và sức căng thần học của từ, để văn mạch xác định sắc thái cụ thể.
- issue: Sắc thái điều kiện của εἰ
  choice: Dịch là “nếu”.
  alternative: “Khi”
  rationale: “Nếu” giữ nguyên hình thức điều kiện của câu Hy Lạp. Dịch thành “khi” có thể nhấn mạnh tính chắc chắn hơn mức từ ngữ trực tiếp đòi hỏi.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Trật tự câu được điều chỉnh tự nhiên trong tiếng Việt bằng cách đặt lời xưng gọi “Thưa anh em” ở đầu câu. Dùng “thế gian” để duy trì lối nói thần học quen thuộc trong văn chương Giăng mà không diễn giải quá mức.
