    rationale: πείσομεν với “lòng” trong ngữ cảnh này có thể dịch tự nhiên là “sẽ trấn an lòng mình.” Cách này truyền đạt sự trấn an/thuyết phục nội tâm mà không áp đặt một cách giải thích tín lý.
