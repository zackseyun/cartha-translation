  text: ⸀ἐν τούτῳ ⸀γνωσόμεθα ὅτι ἐκ τῆς ἀληθείας ἐσμέν, καὶ ἔμπροσθεν αὐτοῦ πείσομεν ⸂τὴν καρδίαν⸃ ἡμῶν
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/019.yaml
  text: By this we will know that we are from the truth[a], and before him we will persuade our hearts[b],
translation:
  language: vi
  text: Nhờ điều này, chúng ta sẽ biết rằng chúng ta thuộc về chân lý[a], và trước mặt Ngài, chúng ta sẽ trấn an lòng mình[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc sát chữ: “chúng ta từ chân lý mà ra.”'
    reason: lexical_alternative
  - marker: b
    text: 'Sát chữ: “chúng ta sẽ thuyết phục lòng mình”; cũng có thể dịch: “chúng ta sẽ khiến lòng mình được yên ổn trước mặt Ngài.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: Nhờ điều này
  rationale: Diễn đạt phương tiện hoặc căn cứ để nhận biết, đồng thời giữ lực chỉ định của τούτῳ và liên kết tự nhiên với văn cảnh trước.
- source_word: γνωσόμεθα
  choice: chúng ta sẽ biết
  rationale: Phản ánh trực tiếp thì tương lai của γινώσκω, không thêm sắc thái khởi đầu như “sẽ nhận ra” hay “sẽ đi đến chỗ biết”.
- source_word: ἐκ τῆς ἀληθείας ἐσμέν
  choice: mình bởi chân lý mà ra
  rationale: Giữ ý nguồn gốc hoặc xuất phát điểm của ἐκ, đồng thời dùng lối nói tiếng Việt trang trọng và dễ hiểu hơn cách dịch máy móc “đến từ chân lý”.
- source_word: ἔμπροσθεν αὐτοῦ
  choice: trước mặt Ngài
  rationale: Giữ hình ảnh không gian–tương quan của nguyên ngữ và truyền đạt tự nhiên ý ở trong sự hiện diện của Đức Chúa Trời.
- source_word: πείσομεν
  choice: sẽ làm cho … an tâm
  rationale: Trong kết hợp với “lòng” và trong văn cảnh đứng trước Đức Chúa Trời, động từ mang ý làm cho lòng được thuyết phục, trấn an hay yên ổn; cách dịch này tự nhiên trong tiếng Việt, còn nghĩa sát chữ được giữ ở chú thích.
- source_word: τὴν καρδίαν ἡμῶν
  choice: lòng mình
  rationale: Giữ danh từ số ít của Hy Lạp và dùng đại từ phản thân tự nhiên với chủ ngữ “chúng ta”, chỉ con người nội tâm chứ không thay bằng thuật ngữ hẹp hơn như “lương tâm”.
theological_decisions:
- issue: Ý nghĩa của ἐκ τῆς ἀληθείας trong thần học Giăng
  choice: Giữ cách diễn đạt nguồn gốc “bởi chân lý mà ra”
  alternative: thuộc về chân lý
  rationale: Cách dịch chính giữ được lực của ἐκ mà không giải quyết sẵn mối quan hệ này thành một khẳng định giáo hội học hoặc tín lý mạnh hơn; cách hiểu về sự thuộc về được ghi nhận trong chú thích.
- issue: Sắc thái của πείσομεν khi có “lòng” làm tân ngữ
  choice: làm cho lòng mình an tâm
  alternative: thuyết phục lòng mình
  rationale: Văn cảnh nói đến trạng thái nội tâm trước mặt Đức Chúa Trời. Cách dịch chính diễn đạt tiếng Việt tự nhiên mà không biến câu thành sự tự biện minh; chú thích giữ nghĩa sát chữ và độ mở từ vựng.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng gần gũi. “Chân lý” được chọn thay vì “sự thật” để phù hợp sắc thái rộng của ἀλήθεια trong văn chương Giăng. Dấu phẩy cuối câu được giữ vì cú pháp và ý tưởng tiếp tục trực tiếp sang câu 20.
