id: 1JN.3.24
reference: 1 John 3:24
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ὁ τηρῶν τὰς ἐντολὰς αὐτοῦ ἐν αὐτῷ μένει καὶ αὐτὸς ἐν αὐτῷ· καὶ ἐν τούτῳ γινώσκομεν ὅτι μένει ἐν ἡμῖν, ἐκ τοῦ πνεύματος οὗ ἡμῖν ἔδωκεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/024.yaml
  text: 'And the one who keeps his commandments remains in him[a], and he in him[b]. And by this we know that he remains in us: by the Spirit whom he gave to us.'
translation:
  language: vi
  text: 'Người giữ các điều răn của Ngài thì ở lại trong Ngài, và Ngài ở lại trong người ấy.[a] Qua điều này, chúng ta biết rằng Ngài ở lại trong chúng ta: nhờ Thánh Linh[b] mà Ngài đã ban cho chúng ta.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ở lại” cũng có thể dịch là “cứ ở trong”; cùng một động từ Hy Lạp được dùng ba lần trong câu này.
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “từ Thánh Linh mà Ngài đã ban cho chúng ta.” Giới từ Hy Lạp có thể nhấn mạnh nguồn gốc cũng như phương tiện hoặc căn cứ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τηρῶν
  choice: giữ
  rationale: “Giữ” diễn đạt việc tuân theo và trung thành thực hành, đồng thời bảo tồn cách nói đặc trưng của văn chương Giăng mà không thu hẹp nghĩa chỉ còn hành vi vâng lời.
- source_word: ἐντολάς
  choice: các điều răn
  rationale: “Điều răn” phù hợp với cách dùng trong văn chương Giăng và giữ được sức nặng đạo đức, giao ước của từ này.
- source_word: μένει
  choice: ở lại
  rationale: “Ở lại” là cách nói hiện đại, dễ hiểu, giữ được sắc thái liên tục và quan hệ của động từ μένω; cùng một cách dịch được dùng cho cả ba lần xuất hiện.
- source_word: ἐν αὐτῷ
  choice: trong Ngài
  rationale: Giữ đại từ như bản Hy Lạp thay vì thay bằng “trong Đức Chúa Trời”, nhờ đó không giải quyết dứt khoát điều mà nguyên văn để cho ngữ cảnh xác định.
- source_word: ἐν τούτῳ
  choice: qua điều này
  rationale: Trong ngữ cảnh, cụm từ dẫn vào căn cứ hoặc phương cách để nhận biết; “qua điều này” tự nhiên trong tiếng Việt và không buộc phải hiểu theo nghĩa vị trí.
- source_word: γινώσκομεν
  choice: chúng ta biết
  rationale: Diễn đạt tự nhiên thì hiện tại của động từ và phù hợp với ý nhận biết hiện có.
- source_word: ἐκ τοῦ πνεύματος
  choice: nhờ Thánh Linh
  rationale: “Nhờ” diễn đạt phương tiện hoặc căn cứ của sự nhận biết; chú thích bảo tồn khả năng ἐκ nhấn mạnh nguồn gốc.
- source_word: πνεύματος
  choice: Thánh Linh
  rationale: Ngữ cảnh về Đấng được Đức Chúa Trời ban cho các tín hữu chỉ về Thánh Linh, chứ không phải tinh thần con người hay một nguyên lý phi nhân cách.
- source_word: οὗ ἡμῖν ἔδωκεν
  choice: mà Ngài đã ban cho chúng ta
  rationale: Đại từ quan hệ tiếng Việt tự nhiên là “mà”; “đã ban” thể hiện hành động quá khứ của ἔδωκεν mà không thêm sắc thái vượt quá nguyên văn.
theological_decisions:
- issue: Đối tượng quy chiếu của các đại từ αὐτῷ / αὐτός và chủ thể của μένει ἐν ἡμῖν
  choice: Giữ cách gọi “Ngài” xuyên suốt, không thay bằng danh xưng cụ thể.
  alternative: Diễn giải rõ là “Đức Chúa Trời”; hoặc hiểu lần cuối rộng hơn theo sự nội trú liên hệ đến Đấng Christ.
  rationale: Ngữ cảnh gần nhất nghiêng về Đức Chúa Trời, nhưng nguyên văn dùng đại từ. Giữ đại từ bảo tồn cách diễn đạt và độ căng thần học của bản Hy Lạp.
- issue: πνεῦμα có chỉ về Thánh Linh hay không
  choice: Dịch là “Thánh Linh”.
  alternative: Dịch chữ thường là “linh” hoặc “tinh thần”.
  rationale: Mệnh đề nói Ngài ban πνεῦμα cho chúng ta và ngữ cảnh Giăng cho thấy đây là Thánh Linh của Đức Chúa Trời; cách viết này nhận diện đối tượng mà không thêm một lập trường hệ phái.
translation_notes:
  register: Văn phong tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “Ngài” để giữ chuỗi đại từ của nguyên văn; dùng “người ấy” ở vế đối ứng để tránh đại từ giới tính không có trong tiếng Hy Lạp. Cấu trúc dấu hai chấm làm rõ rằng Thánh Linh là căn cứ hoặc phương cách nhận biết, nhưng chú thích vẫn bảo tồn sắc thái nguồn gốc của ἐκ.
