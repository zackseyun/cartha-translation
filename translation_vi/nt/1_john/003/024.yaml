  source_fidelity: 'Bản dịch phản ánh sát cấu trúc và ý nghĩa của nguyên văn: τηρῶν τὰς ἐντολὰς là “giữ các điều răn”; ba lần μένει đều được dịch nhất quán là “ở lại”; các đại từ được giữ nguyên thay vì diễn giải thành một danh xưng; và ἐκ τοῦ πνεύματος được chuyển tự nhiên là “nhờ Thánh Linh”. Thì quá khứ của ἔδωκεν được thể hiện thích đáng bằng “đã ban”.'
