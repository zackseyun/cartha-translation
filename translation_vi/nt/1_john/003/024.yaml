  terminology: “Các điều răn,” “ở lại,” và “Thánh Linh” phù hợp văn phong Giăng và cách dùng Cơ Đốc giáo tiếng Việt. Việc dùng “Ngài” bảo tồn tính đại từ của bản Hy Lạp và không áp đặt diễn giải vượt quá ngữ cảnh. Chú thích b bảo tồn đúng khả năng nghĩa nguồn gốc/căn cứ của ἐκ; chú thích a hữu ích và đúng về sự lặp lại của μένω.
