  - severity: low
    issue: Vị trí neo chú thích chưa sát cụm từ được giải thích.
    rationale: Chú thích giải thích “anh em mình,” nên ký hiệu [a] cần đứng ngay sau cụm này để người đọc nhận biết phạm vi chú thích.
