id: 1JN.3.15
reference: 1 John 3:15
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: πᾶς ὁ μισῶν τὸν ἀδελφὸν αὐτοῦ ἀνθρωποκτόνος ἐστίν, καὶ οἴδατε ὅτι πᾶς ἀνθρωποκτόνος οὐκ ἔχει ζωὴν αἰώνιον ἐν ⸀αὐτῷ μένουσαν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/015.yaml
  text: Everyone who hates his brother is a murderer[b][a], and you know that every murderer does not have eternal life remaining in him.
translation:
  language: vi
  text: Ai ghét anh em mình[a] là kẻ giết người, và anh em biết rằng không một kẻ giết người nào có sự sống đời đời ở lại trong mình.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cụm “anh em mình” trong văn mạch có lẽ nói đến một người cùng đức tin.
    reason: cultural_note
lexical_decisions:
- source_word: πᾶς ὁ μισῶν
  choice: Ai ghét
  rationale: Cấu trúc mạo từ với phân từ hiện tại chỉ một hạng người nói chung; “Ai ghét” tự nhiên trong tiếng Việt và vẫn diễn tả đặc điểm hành động.
- source_word: τὸν ἀδελφὸν αὐτοῦ
  choice: anh em mình
  rationale: Trong văn mạch thư Giăng, ἀδελφός thường chỉ người cùng cộng đồng đức tin. “Anh em mình” là cách nói tự nhiên, không buộc phải hiểu là anh em ruột, còn phạm vi theo văn mạch được ghi chú.
- source_word: ἀνθρωποκτόνος
  choice: kẻ giết người
  rationale: Đây là từ tương đương thông dụng, trực tiếp và giữ nguyên sức nặng đạo đức của từ Hy Lạp.
- source_word: οἴδατε
  choice: anh em biết
  rationale: Động từ ở ngôi thứ hai số nhiều; “anh em” biểu thị rõ cộng đồng người nhận thư và phù hợp văn phong thư tín hiện đại.
- source_word: πᾶς ἀνθρωποκτόνος οὐκ ἔχει
  choice: không một kẻ giết người nào có
  rationale: Cách diễn đạt phủ định toàn thể này tự nhiên và không mơ hồ trong tiếng Việt, truyền đạt đúng ý rằng chẳng có kẻ giết người nào sở hữu sự sống đời đời ở lại trong mình.
- source_word: ζωὴν αἰώνιον
  choice: sự sống đời đời
  rationale: Cách dịch quen thuộc và chính xác trong văn phẩm Giăng, bao hàm sự sống có tính vĩnh cửu mà không thêm diễn giải giáo lý.
- source_word: ἐν αὐτῷ μένουσαν
  choice: ở lại trong mình
  rationale: “Ở lại” giữ được nghĩa tiếp tục hiện diện của μένω, một từ khóa trong văn phẩm Giăng; đại từ phản thân “mình” quy chiếu tự nhiên về “kẻ giết người” trong tiếng Việt.
theological_decisions:
- issue: Phạm vi nghĩa của ἀδελφός
  choice: Giữ cách gọi “anh em mình” trong chính văn, với ghi chú rằng theo văn mạch có lẽ là người cùng đức tin.
  alternative: người cùng đức tin với mình
  rationale: Bản văn dùng danh từ số ít giống đực, nhưng trong văn mạch cộng đồng của 1 Giăng từ này thường có nghĩa rộng hơn quan hệ huyết thống. Không đưa phần diễn giải văn mạch vào chính văn.
- issue: Cách dịch μένω trong thần học Giăng
  choice: ở lại trong mình
  alternative: cư ngụ trong mình
  rationale: “Ở lại” vừa tự nhiên vừa duy trì mối liên hệ từ vựng với chủ đề μένω lặp lại trong văn phẩm Giăng, mà không áp đặt cách hiểu về bản chất hay cơ chế của sự hiện diện ấy.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “anh em” cho đại từ ngôi thứ hai số nhiều trong thư tín; tránh lối nói quá cổ như “kẻ nào” hoặc “hằng sống”. Dấu chú thích [a] được đặt ngay sau cụm từ cần giải thích.
