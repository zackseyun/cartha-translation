- from: Tôi còn nhiều điều muốn viết cho anh chị em, nhưng tôi không muốn dùng giấy và mực. Trái lại, tôi hy vọng sẽ đến với anh chị em và nói chuyện mặt đối mặt, để niềm vui của anh chị em được trọn vẹn.[a]
  to: Tôi có nhiều điều muốn viết cho anh chị em, nhưng tôi không muốn viết bằng giấy và mực. Trái lại, tôi hy vọng sẽ đến với anh chị em và nói chuyện mặt đối mặt, để niềm vui của anh chị em được trọn vẹn.[a]
  rationale: Sửa “còn nhiều điều” thành “có nhiều điều” để không thêm sắc thái thời gian/đối chiếu ngoài nguyên văn. Sửa “không muốn dùng giấy và mực” thành “không muốn viết bằng giấy và mực” để biểu đạt rõ hành động γράφειν được hiểu trong mệnh đề và phương tiện do διά với sở hữu cách chỉ ra. Giữ nguyên cách dịch thành ngữ, thuật ngữ, dị bản, và vị trí neo chú thích.
