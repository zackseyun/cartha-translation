source:
  edition: SBLGNT
  text: Πολλὰ ἔχων ὑμῖν γράφειν οὐκ ἐβουλήθην διὰ χάρτου καὶ μέλανος, ἀλλὰ ἐλπίζω ⸀γενέσθαι πρὸς ὑμᾶς καὶ στόμα πρὸς στόμα λαλῆσαι, ἵνα ἡ χαρὰ ⸀ὑμῶν ⸂πεπληρωμένη ᾖ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/012.yaml
  text: Though I have many things to write to you[a], I did not want to do so with paper and ink. Instead, I hope to come to you and speak face to face, so that your joy may be made complete.
translation:
  language: vi
  text: Tôi có nhiều điều muốn viết cho anh chị em, nhưng tôi không muốn viết bằng giấy và mực. Trái lại, tôi hy vọng sẽ đến với anh chị em và nói chuyện mặt đối mặt, để niềm vui của anh chị em được trọn vẹn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Một số thủ bản chép “niềm vui của chúng ta” thay vì “niềm vui của anh chị em”.
    reason: textual_variant
lexical_decisions:
- source_word: Πολλὰ ἔχων ὑμῖν γράφειν
  choice: Tôi còn nhiều điều muốn viết cho anh chị em
  rationale: Diễn đạt tự nhiên trong tiếng Việt, giữ ý số nhiều của Πολλά và người nhận số nhiều của ὑμῖν; quan hệ nhượng bộ được chuyển sang bằng liên từ “nhưng” ở mệnh đề kế tiếp.
- source_word: οὐκ ἐβουλήθην διὰ χάρτου καὶ μέλανος
  choice: nhưng tôi không muốn dùng giấy và mực
  rationale: βούλομαι chỉ ý muốn; διά với sở hữu cách chỉ phương tiện. “Dùng giấy và mực” tự nhiên, rõ nghĩa và không cổ hóa χάρτου thành một thuật ngữ chuyên biệt.
- source_word: ἀλλὰ ἐλπίζω γενέσθαι πρὸς ὑμᾶς
  choice: Trái lại, tôi hy vọng sẽ đến với anh chị em
  rationale: Giữ thế đối lập của ἀλλά và hướng chuyển động trong πρός; “đến với” là cách diễn đạt tự nhiên cho việc hiện diện trực tiếp nơi người nhận.
- source_word: στόμα πρὸς στόμα λαλῆσαι
  choice: nói chuyện mặt đối mặt
  rationale: Dịch ý thành ngữ chỉ cuộc trò chuyện trực tiếp; tránh lối dịch sát “miệng đối miệng” dễ gây hiểu sai trong tiếng Việt hiện đại.
- source_word: ἵνα ἡ χαρὰ ὑμῶν πεπληρωμένη ᾖ
  choice: để niềm vui của anh chị em được trọn vẹn
  rationale: “Để” giữ giá trị mục đích của ἵνα; “được trọn vẹn” diễn đạt trạng thái đầy đủ của kết cấu phân từ hoàn thành với động từ giả định.
theological_decisions:
- issue: Dị bản đại từ xác định niềm vui của ai
  choice: niềm vui của anh chị em
  alternative: niềm vui của chúng ta
  rationale: Theo bản văn SBLGNT là ὑμῶν (“của anh chị em”); dị bản ἡμῶν (“của chúng ta”) có ý nghĩa diễn giải nên được ghi ở chú thích thay vì bị loại bỏ trong im lặng.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “anh chị em” cho đại từ số nhiều ὑμᾶς/ὑμῶν, không xác định giới tính hay địa vị của từng người nhận. Đặt dấu chú thích ngay sau câu có dị bản.
