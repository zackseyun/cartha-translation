  - severity: low
    issue: “không muốn dùng giấy và mực” chưa nói rõ hành động viết.
    rationale: Cụm διὰ χάρτου καὶ μέλανος bổ nghĩa cho ý viết trong cấu trúc câu. “Không muốn viết bằng giấy và mực” tránh khả năng hiểu là người viết không muốn dùng những vật này trong bất cứ mục đích nào.
