  text: The children of your chosen sister greet you.
translation:
  language: vi
  text: Các con của người chị em được chọn của bà gửi lời chào đến bà.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀσπάζεταί σε
  choice: gửi lời chào bà
  rationale: Diễn đạt tự nhiên hành động chào thăm; đại từ số ít giống cái được thể hiện bằng “bà”, phù hợp với người nhận được gọi là “bà được chọn” ở câu 1.
- source_word: τὰ τέκνα
  choice: các con
  rationale: Giữ nghĩa trực tiếp của τέκνα trong ngữ cảnh quan hệ gia đình, đồng thời không loại trừ khả năng đây là lối nói ẩn dụ.
- source_word: τῆς ἀδελφῆς σου
  choice: của người chị em ... của bà
  rationale: “Người chị em” giữ được nghĩa rộng của ἀδελφή hơn là buộc xác định chị hay em ruột; “của bà” thể hiện đại từ sở hữu số ít.
- source_word: τῆς ἐκλεκτῆς
  choice: được chọn
  rationale: Dịch sát phân từ/tính từ ἐκλεκτός theo thể thụ động về ý nghĩa, tránh sắc thái thần học chuyên biệt không cần thiết của “được tuyển chọn”.
theological_decisions:
- issue: “Người chị em được chọn” là một cá nhân hay một hội thánh được nhân cách hóa
  choice: Giữ cách diễn đạt có thể hiểu theo cả nghĩa đen lẫn nghĩa ẩn dụ
  alternative: Diễn giải rõ là “hội thánh chị em” hoặc một phụ nữ cụ thể
  rationale: Nguyên văn không tự giải quyết dứt khoát cách hiểu này; bản dịch không nên âm thầm chọn một cách giải nghĩa.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “bà” vì người nhận trong câu 1 được mô tả bằng danh từ giống cái; giữ “người chị em” để tránh ép ἀδελφή thành “chị” hay “em” theo tuổi tác.
