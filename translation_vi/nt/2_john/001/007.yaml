source:
  edition: SBLGNT
  text: ὅτι πολλοὶ πλάνοι ⸀ἐξῆλθον εἰς τὸν κόσμον, οἱ μὴ ὁμολογοῦντες Ἰησοῦν Χριστὸν ἐρχόμενον ἐν σαρκί· οὗτός ἐστιν ὁ πλάνος καὶ ὁ ἀντίχριστος.
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/007.yaml
  text: For many deceivers have gone out into the world[a], those who do not confess Jesus the Messiah coming in the flesh[b]. This is the deceiver and the antichrist.
translation:
  language: vi
  text: Vì nhiều kẻ lừa dối đã đi ra thế gian, là những kẻ không tuyên xưng rằng Giê-su là Đấng Mê-si đến trong thân xác.[a] Kẻ như thế chính là kẻ lừa dối và kẻ chống Đấng Mê-si.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “Giê-su là Đấng Mê-si đã đến trong thân xác.” Nguyên văn dùng cụm từ “đến trong thân xác”; cách dịch “đã đến” hiểu đây là một biến cố đã hoàn tất.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Vì
  rationale: Trong văn mạch, liên từ này nêu lý do cho lời khuyên ở câu trước; “Vì” diễn đạt tự nhiên chức năng giải thích ấy.
- source_word: πολλοὶ πλάνοι
  choice: nhiều kẻ lừa dối
  rationale: πλάνος ở đây chỉ những người dẫn người khác vào sai lầm, không chỉ những người tự mình lầm lạc; cách dịch này cũng giữ được sự liên kết với ὁ πλάνος ở cuối câu.
- source_word: ἐξῆλθον εἰς τὸν κόσμον
  choice: đã đi ra khắp thế gian
  rationale: Diễn đạt sự xuất hiện và hoạt động lan rộng giữa thế gian bằng tiếng Việt tự nhiên, không gán cho κόσμος nghĩa trừu tượng như “hệ thống thế gian”.
- source_word: οἱ μὴ ὁμολογοῦντες
  choice: là những kẻ không tuyên xưng
  rationale: Phân từ có mạo từ chỉ một nhóm người; “tuyên xưng” giữ sắc thái công khai và nội dung xác tín của ὁμολογέω.
- source_word: Ἰησοῦν Χριστόν
  choice: Đức Chúa Jêsus là Đấng Mê-si
  rationale: Χριστός mang chức năng tước hiệu trong nội dung lời tuyên xưng; thêm “là” giúp quan hệ vị ngữ rõ ràng và tự nhiên trong tiếng Việt.
- source_word: ἐρχόμενον
  choice: đến
  rationale: Giữ hình thức phân từ hiện tại và sự mơ hồ chân thực của câu Hy Lạp, không tự ý đổi thành một hành động hoàn tất trong quá khứ.
- source_word: ἐν σαρκί
  choice: trong thân xác
  rationale: Trong văn mạch Kitô học này, σάρξ nói đến nhân tính có thân thể thật, không phải “bản tính tội lỗi”; “thân xác” rõ nghĩa với độc giả hiện đại.
- source_word: οὗτός ἐστιν
  choice: Kẻ như thế chính là
  rationale: Cụm này chuyển từ số nhiều sang số ít để cá thể hóa bất cứ người nào thuộc loại vừa mô tả; “kẻ như thế” giữ được lực chỉ định ấy.
- source_word: ὁ πλάνος
  choice: kẻ lừa dối
  rationale: Giữ nhất quán từ vựng với πλάνοι ở đầu câu.
- source_word: ὁ ἀντίχριστος
  choice: kẻ chống Đấng Christ
  rationale: Diễn đạt nghĩa của thuật ngữ Johannine ἀντίχριστος bằng tiếng Việt rõ ràng, đồng thời phân biệt nó với tước hiệu “Đấng Mê-si” trong lời tuyên xưng.
theological_decisions:
- issue: Cách dịch Χριστός
  choice: Đấng Mê-si
  alternative: Đấng Christ
  rationale: Ở đây Χριστός là tước hiệu nằm trong nội dung lời tuyên xưng về Jêsus, nên “Đấng Mê-si” làm rõ chức năng ấy mà không biến nó thành một phần tên riêng.
- issue: Sức nghĩa của ἐρχόμενον ἐν σαρκί
  choice: đến trong thân xác
  alternative: đã đến trong thân xác
  rationale: Bản Hy Lạp dùng phân từ hiện tại “đến”; bản dịch giữ nguyên cách diễn đạt này thay vì thu hẹp nó thành một biến cố quá khứ hoàn tất, nhưng chú thích nêu cách hiểu quen thuộc.
- issue: Nghĩa của σάρξ
  choice: thân xác, tức nhân tính có thân thể thật
  alternative: bản tính tội lỗi
  rationale: Trong câu này, σάρξ khẳng định sự hiện thân thật của Jêsus, không nói Ngài mang bản tính tội lỗi.
- issue: Số ít trong οὗτός
  choice: Kẻ như thế
  alternative: Điều này
  rationale: Đại từ số ít quy chiếu đến bất cứ người nào thuộc nhóm vừa nêu, nên cách dịch chỉ người tránh làm mờ đối tượng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Chúa Jêsus” và “Đấng Mê-si” theo lối gọi quen thuộc trong tiếng Việt Cơ Đốc; tránh cách nói cổ như “xác thịt” vì dễ bị hiểu lầm là bản tính tội lỗi. Dấu chú thích [a] được đặt ngay sau mệnh đề liên quan.
