id: 2JN.1.9
reference: 2 John 1:9
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: πᾶς ὁ ⸀προάγων καὶ μὴ μένων ἐν τῇ διδαχῇ τοῦ Χριστοῦ θεὸν οὐκ ἔχει· ὁ μένων ἐν τῇ ⸀διδαχῇ, οὗτος καὶ τὸν πατέρα καὶ τὸν υἱὸν ἔχει.
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/009.yaml
  text: Everyone who goes on ahead and does not remain in the teaching of Messiah does not have God[a]. The one who remains in the teaching[b], this one has both the Father and the Son.
translation:
  language: vi
  text: Bất cứ ai đi quá xa và không ở lại trong lời dạy của Đấng Mê-si thì không có Đức Chúa Trời.[a] Còn người ở lại trong lời dạy ấy[b] thì có cả Đức Chúa Cha lẫn Đức Chúa Con.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “đi trước” hoặc “tiến quá xa”; một số thủ bản chép “vi phạm” thay cho “đi quá xa”.
    reason: textual_variant
  - marker: b
    text: “Lời dạy của Đấng Mê-si” có thể là lời dạy do Đấng Mê-si truyền, hoặc lời dạy nói về Đấng Mê-si.
    reason: alternative_reading
lexical_decisions:
- source_word: πᾶς ὁ προάγων
  choice: Bất cứ ai đi quá xa
  rationale: πᾶς với phân từ có mạo từ chỉ chung mọi người thuộc loại này. Trong ngữ cảnh cảnh báo, προάγων diễn tả việc tiến vượt quá giới hạn; “đi quá xa” tự nhiên trong tiếng Việt mà vẫn giữ hình ảnh chuyển động.
- source_word: μὴ μένων
  choice: không ở lại
  rationale: Giữ nét nghĩa cơ bản và mô-típ Giăng của μένω là ở lại, gắn bó, không rời khỏi.
- source_word: ἐν τῇ διδαχῇ
  choice: trong lời dạy
  rationale: “Lời dạy” dễ hiểu và tự nhiên hơn “giáo lý”, đồng thời không làm câu mang sắc thái giáo hội quá mức.
- source_word: τοῦ Χριστοῦ
  choice: của Đấng Mê-si
  rationale: Χριστός ở đây là tước hiệu. Cấu trúc “của Đấng Mê-si” giữ nguyên khả năng chỉ lời dạy do Ngài truyền hoặc lời dạy nói về Ngài.
- source_word: θεὸν οὐκ ἔχει
  choice: không có Đức Chúa Trời
  rationale: Dịch trực tiếp cách diễn đạt mạnh của bản Hy Lạp, không diễn giải thêm thành “không tương giao với Đức Chúa Trời”.
- source_word: ὁ μένων ἐν τῇ διδαχῇ
  choice: người ở lại trong lời dạy ấy
  rationale: Giữ thế đối xứng với vế đầu; “ấy” quy chiếu tự nhiên về lời dạy của Đấng Mê-si vừa nêu.
- source_word: οὗτος
  choice: thì
  rationale: Trong tiếng Việt, cấu trúc đề–thuyết với “thì” truyền đạt tự nhiên sự nhấn mạnh của οὗτος mà không cần lặp cứng “chính người ấy”.
- source_word: καὶ τὸν πατέρα καὶ τὸν υἱὸν ἔχει
  choice: có cả Đức Chúa Cha lẫn Đức Chúa Con
  rationale: “Cả... lẫn...” thể hiện cấu trúc tương liên καὶ...καὶ và giữ nguyên hai danh xưng quan hệ.
theological_decisions:
- issue: Ý nghĩa của προάγων trong bản văn này
  choice: đi quá xa
  alternative: đi trước; tiến xa; một số thủ bản chép “vi phạm”
  rationale: SBLGNT đọc προάγων chứ không phải παραβαίνων. “Đi quá xa” thể hiện hàm ý tiêu cực trong ngữ cảnh nhưng chú thích vẫn bảo lưu hình ảnh sát chữ và dị bản.
- issue: Ý nghĩa của “lời dạy của Đấng Mê-si”
  choice: Giữ cấu trúc sở hữu không phân giải
  alternative: lời dạy do Đấng Mê-si truyền; lời dạy về Đấng Mê-si
  rationale: Sở hữu cách Hy Lạp có thể mang sắc thái chủ thể hoặc đối thể; câu chính không nên loại bỏ một trong hai khả năng.
- issue: Tước hiệu Χριστοῦ
  choice: Đấng Mê-si
  alternative: Đấng Christ
  rationale: Dịch nghĩa tước hiệu Χριστός theo chức năng của nó tại đây, thay vì phiên âm theo truyền thống.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Chúa Trời”, “Đức Chúa Cha”, “Đức Chúa Con” cho các danh xưng thần học; dùng “Đấng Mê-si” cho Χριστός. Hai dấu chú thích [a], [b] đều xuất hiện trong câu chính.
