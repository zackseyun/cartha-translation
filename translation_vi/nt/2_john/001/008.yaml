review_pass:
  verdict: revise
  source_fidelity: Bản nháp phản ánh đúng cấu trúc cảnh báo của βλέπετε ἑαυτούς, mệnh đề mục đích ἵνα μὴ ἀπολέσητε, bản đọc ngôi thứ nhất số nhiều εἰργασάμεθα, và mục tiêu nhận μισθὸν πλήρη. Tuy nhiên, “chính mình” không diễn đạt rõ đối tượng số nhiều, còn “thành quả chúng tôi đã làm ra” có sắc thái sản xuất và làm mờ ý lao nhọc/gây dựng của εἰργασάμεθα.
  naturalness: “Hãy tự giữ mình” là một lời khuyên cảnh giác tự nhiên, trang trọng vừa phải trong tiếng Việt hiện đại, đồng thời tránh sự lẫn lộn số ít của “chính mình”. “Những gì chúng tôi đã lao nhọc gây dựng” tự nhiên hơn và sát ngữ cảnh hơn “thành quả chúng tôi đã làm ra”.
  terminology: Giữ “anh chị em”, “chúng tôi”, và “phần thưởng trọn vẹn”. “Phần thưởng” truyền đạt phù hợp μισθός trong văn mạch này, không áp đặt cách giải thích giáo phái.
  issues:
  - severity: medium
    issue: “chính mình” có hình thức số ít sau mệnh lệnh và chủ ngữ số nhiều.
    rationale: ἑαυτούς là phản thân cách đối số nhiều, hướng lời cảnh giác đến toàn thể người nhận. Cụm hiện tại có thể bị hiểu là từng cá nhân theo số ít và kém tự nhiên trong câu này.
  - severity: low
    issue: “thành quả chúng tôi đã làm ra” quá nghiêng về sản phẩm được chế tạo.
    rationale: εἰργασάμεθα nói đến điều những người viết đã làm/lao nhọc thực hiện; cách nói “lao nhọc gây dựng” truyền đạt tốt hơn công sức có kết quả đang được xét đến, mà không thêm nội dung thần học.
  revised_text: Hãy tự giữ mình, để anh chị em không đánh mất những gì chúng tôi đã lao nhọc gây dựng,[a] nhưng nhận được phần thưởng trọn vẹn.
