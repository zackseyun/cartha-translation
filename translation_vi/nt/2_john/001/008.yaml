source:
  edition: SBLGNT
  text: βλέπετε ἑαυτούς, ἵνα μὴ ⸀ἀπολέσητε ἃ ⸀εἰργασάμεθα, ἀλλὰ μισθὸν πλήρη ⸀ἀπολάβητε.
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/008.yaml
  text: Watch yourselves[a], so that you may not lose what we have worked for, but may receive a full reward.
translation:
  language: vi
  text: Hãy tự giữ mình, để anh chị em không đánh mất những gì chúng tôi đã lao nhọc gây dựng,[a] nhưng nhận được phần thưởng trọn vẹn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Một số thủ bản chép: “những gì anh chị em đã lao nhọc gây dựng” thay vì “những gì chúng tôi đã lao nhọc gây dựng.”'
    reason: textual_variant
lexical_decisions:
- source_word: βλέπετε ἑαυτούς
  choice: Hãy coi chừng chính mình
  rationale: Mệnh lệnh hiện tại số nhiều kêu gọi sự cảnh giác liên tục. Cách diễn đạt này tự nhiên trong tiếng Việt và giữ rõ lời cảnh báo hướng trực tiếp đến người đọc.
- source_word: ἵνα μὴ ἀπολέσητε
  choice: để anh chị em không đánh mất
  rationale: Cấu trúc ἵνα với động từ giả định diễn tả điều cần tránh; “đánh mất” phù hợp với ý để vuột mất kết quả đã đạt được hơn là “hủy diệt”.
- source_word: ἃ εἰργασάμεθα
  choice: thành quả chúng tôi đã làm ra
  rationale: Đại từ quan hệ trung tính số nhiều chỉ điều đạt được nhờ công lao trước đó. Bản SBLGNT đọc ngôi thứ nhất số nhiều; “thành quả… đã làm ra” diễn đạt tự nhiên kết quả còn được đặt trong tầm nhìn.
- source_word: μισθὸν πλήρη
  choice: phần thưởng trọn vẹn
  rationale: Trong ngữ cảnh khuyên nhủ thuộc linh, μισθός là “phần thưởng” hơn là tiền công; πλήρη nhấn mạnh tính đầy đủ, không bị suy giảm.
- source_word: ἀπολάβητε
  choice: nhận được
  rationale: Diễn đạt rõ và tự nhiên ý tiếp nhận phần thưởng; tiền tố không nhất thiết buộc phải dịch thành “nhận lại” trong ngữ cảnh này.
theological_decisions:
- issue: Chủ thể của εἰργασάμεθα
  choice: chúng tôi đã làm ra
  alternative: anh chị em đã làm ra
  rationale: Bản SBLGNT được cung cấp có động từ ngôi thứ nhất số nhiều, nên giữ ý người đọc có thể đánh mất thành quả mà những người phục vụ đã lao nhọc gây dựng nơi họ. Dị bản ngôi thứ hai số nhiều chuyển trọng tâm sang công lao của chính người đọc và được ghi ở chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “anh chị em” để biểu đạt rõ ngôi thứ hai số nhiều; “chúng tôi” giữ ngôi thứ nhất số nhiều của bản văn nguồn.
