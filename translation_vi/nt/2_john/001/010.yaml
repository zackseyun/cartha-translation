  verdict: revise
  source_fidelity: 'Chính văn truyền đạt đúng cấu trúc điều kiện và hai mệnh lệnh của tiếng Hy Lạp: người đến mà không đem “lời dạy này” thì không được tiếp vào nhà và không được chào. Đại từ số ít được giữ bằng “người ấy”; tiếng Việt không cần đánh dấu giống ngữ pháp ở đây.'
  naturalness: “Đừng nói lời chào với người ấy” quá sát hình thức Hy Lạp nhưng không tự nhiên trong tiếng Việt hiện đại. “Đừng chào người ấy” là cách diễn đạt tự nhiên, vẫn giữ đúng lực ngôn hành. Cụm “một giáo sư lưu động” trong chú thích không phù hợp vì “giáo sư” tiếng Việt hiện nay chủ yếu chỉ chức danh học thuật.
  terminology: “Lời dạy này,” “anh chị em,” và “tiếp ... vào nhà” phù hợp văn phong Kinh Thánh hiện đại. Đổi “giáo sư lưu động” thành “người dạy dỗ lưu động” để diễn đạt bối cảnh mà không gán chức danh hiện đại.
  issues:
