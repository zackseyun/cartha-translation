    rationale: χαίρειν αὐτῷ μὴ λέγετε có thể được dịch thành ngữ tự nhiên là “đừng chào người ấy”; chú thích vẫn có thể nêu cách nói sát chữ của tiếng Hy Lạp.
  - severity: medium
    issue: “Giáo sư lưu động” trong chú thích mang nghĩa chức danh học thuật hiện đại
    rationale: Ngữ cảnh có thể liên quan đến một người dạy dỗ đi lại, nhưng không có cơ sở để gọi người đó là “giáo sư” theo nghĩa hiện đại.
