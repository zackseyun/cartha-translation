source:
  edition: SBLGNT
  text: εἴ τις ἔρχεται πρὸς ὑμᾶς καὶ ταύτην τὴν διδαχὴν οὐ φέρει, μὴ λαμβάνετε αὐτὸν εἰς οἰκίαν καὶ χαίρειν αὐτῷ μὴ λέγετε·
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/010.yaml
  text: If anyone comes to you and does not bring this teaching, do not receive him into your house, and do not say a greeting to him.
translation:
  language: vi
  text: Nếu ai đến với anh chị em mà không mang theo lời dạy này, thì đừng tiếp người ấy vào nhà và cũng đừng chào người ấy.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hy Lạp nói sát nghĩa là: “đừng nói lời chào với người ấy.”'
    reason: lexical_alternative
  - marker: b
    text: Trong ngữ cảnh, lời cảnh báo nói về người đến mà không mang “lời dạy này,” có lẽ là một người dạy dỗ lưu động có thông điệp đi chệch khỏi lời tuyên xưng của các sứ đồ được nói đến trong những câu xung quanh.
    reason: cross_reference
lexical_decisions:
- source_word: εἴ τις
  choice: Nếu ai
  rationale: Diễn đạt tự nhiên một điều kiện bất định, khái quát trong tiếng Việt.
- source_word: ἔρχεται πρὸς ὑμᾶς
  choice: đến với anh chị em
  rationale: Giữ ý chuyển động hướng đến những người nhận thư; đại từ số nhiều được thể hiện bằng cách xưng hô hiện đại, trang trọng.
- source_word: ταύτην τὴν διδαχήν
  choice: lời dạy này
  rationale: διδαχή chỉ sự dạy dỗ hoặc nội dung được dạy; “lời dạy” rõ ràng, tự nhiên và giữ nguyên từ chỉ định “này”.
- source_word: οὐ φέρει
  choice: không mang theo
  rationale: Giữ hình ảnh của φέρω là mang đến hoặc mang theo một lời dạy, đồng thời tự nhiên trong tiếng Việt.
- source_word: μὴ λαμβάνετε αὐτὸν εἰς οἰκίαν
  choice: đừng tiếp người ấy vào nhà
  rationale: λαμβάνω trong ngữ cảnh tiếp đón có thể là nhận hoặc đón tiếp; “tiếp ... vào nhà” giữ cả ý hiếu khách lẫn hình ảnh cụ thể của οἰκία mà không xác định quá mức đó là nhà riêng hay nơi nhóm họp.
- source_word: χαίρειν αὐτῷ μὴ λέγετε
  choice: đừng nói lời chào với người ấy
  rationale: Phản ánh khá sát cấu trúc Hy Lạp “đừng nói [lời] chào với người ấy,” thay vì giản lược thành “đừng chào,” qua đó giữ sắc thái có thể liên quan đến lời chào đón hoặc bày tỏ thiện chí.
theological_decisions:
- issue: Phạm vi của lệnh cấm đối với người không mang lời dạy này
  choice: Giữ nguyên hai hành động cụ thể là tiếp vào nhà và nói lời chào, không mở rộng thành lệnh cấm mọi tiếp xúc.
  alternative: Hiểu là cấm tuyệt đối mọi giao tiếp xã hội; hoặc chỉ cấm chính thức tiếp nhận người ấy làm giáo sư trong hội thánh.
  rationale: Ngữ cảnh nhiều khả năng liên quan đến một giáo sư lưu động và sự hỗ trợ dành cho người ấy, nhưng câu Hy Lạp tự nó không xác định đầy đủ phạm vi áp dụng. Bản dịch giữ sự căng thẳng giải nghĩa ấy.
- issue: Cách thể hiện đại từ giống đực số ít αὐτόν/αὐτῷ
  choice: người ấy
  alternative: ông ấy; kẻ ấy
  rationale: Tiếng Việt không bắt buộc đánh dấu giống ở đại từ này. “Người ấy” giữ số ít và quy chiếu cá nhân mà không thêm sắc thái khinh miệt hoặc giả định giới tính vượt quá điều tiếng Việt tự nhiên đòi hỏi.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh chị em” cho ὑμᾶς số nhiều; dùng “người ấy” để diễn đạt đại từ số ít một cách tự nhiên. Các dấu chú thích [a], [b] đều xuất hiện trong chính văn.
