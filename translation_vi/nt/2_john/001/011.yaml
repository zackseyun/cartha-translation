source:
  edition: SBLGNT
  text: ὁ ⸂λέγων γὰρ⸃ αὐτῷ χαίρειν κοινωνεῖ τοῖς ἔργοις αὐτοῦ τοῖς πονηροῖς.
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/011.yaml
  text: For the one who says to him[a], “Greetings,” shares in his evil works.
translation:
  language: vi
  text: 'Vì người nào nói với người ấy: “Xin chào”[a], thì dự phần vào những việc ác của người ấy.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hy Lạp χαίρειν là một công thức chào hỏi thông dụng, cũng có thể dịch là “kính chào”. Trong văn cảnh này, lời chào ấy có thể hàm ý đón nhận hoặc tán đồng, chứ không chỉ là trao đổi lời xã giao; vì thế cũng có thể được hiểu theo văn cảnh là “chào mừng”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ λέγων
  choice: người nào nói
  rationale: Mạo từ đi với phân từ hiện tại được dùng như danh từ và mang ý nghĩa khái quát; “người nào nói” diễn đạt tự nhiên rằng điều này áp dụng cho bất cứ ai làm như vậy.
- source_word: γάρ
  choice: Vì
  rationale: Liên từ này nêu lý do cho lời cấm ở câu trước; “Vì” giữ nguyên chức năng giải thích.
- source_word: αὐτῷ
  choice: với kẻ ấy
  rationale: Đại từ chỉ về người được nói đến ở câu trước. “Kẻ ấy” giữ quan hệ hồi chỉ và phù hợp với sắc thái tiêu cực của văn cảnh mà không thêm lời giải thích vào chính văn.
- source_word: χαίρειν
  choice: “Xin chào”
  rationale: Sau λέγων, động từ nguyên mẫu này được dùng như một công thức chào hỏi. “Xin chào” là cách nói hiện đại, tự nhiên hơn lối dịch sát chữ “hãy vui mừng”; hàm ý đón tiếp hoặc tán đồng do văn cảnh quyết định.
- source_word: κοινωνεῖ
  choice: dự phần vào
  rationale: Động từ đi với cách dữ ở đây chỉ sự tham dự hay cùng có phần. “Dự phần vào” diễn đạt rõ sự liên đới về đạo đức mà không thu hẹp thành nghĩa giáo hội của “thông công”.
- source_word: τοῖς ἔργοις αὐτοῦ τοῖς πονηροῖς
  choice: những việc ác của người ấy
  rationale: Cụm cách dữ là đối tượng của sự dự phần; ἔργα là các việc làm và πονηρά mô tả chúng là ác. Cách dịch này rõ ràng, tự nhiên và giữ được cấu trúc sở hữu.
theological_decisions:
- issue: Lời chào này là phép lịch sự đơn thuần hay sự đón nhận/tán đồng dẫn đến đồng lõa
  choice: Giữ công thức chào hỏi trong chính văn; trong văn cảnh tiếp nhận và hỗ trợ người dạy sai, việc chào như vậy khiến người chào dự phần vào các việc ác của người ấy.
  alternative: Hiểu câu này là cấm mọi lời chào xã giao đối với người ấy trong mọi hoàn cảnh.
  rationale: χαίρειν tự nó là công thức chào hỏi, còn κοινωνεῖ cùng văn cảnh câu 10 cho thấy vấn đề là sự tham dự hoặc hỗ trợ sứ vụ sai lạc. Bản dịch không đưa phần diễn giải ấy vào chính văn, nhờ đó bảo toàn sức căng và phạm vi hàm nghĩa của nguyên ngữ.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Dự phần vào” được chọn thay cho thuật ngữ tôn giáo chuyên biệt; “kẻ ấy” giúp liên kết với nhân vật mang sắc thái tiêu cực ở câu trước. Dấu [a] được đặt ngay sau lời chào mà chú thích giải nghĩa.
