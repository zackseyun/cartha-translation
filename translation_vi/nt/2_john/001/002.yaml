  source_fidelity: 'Bản dịch bám sát SBLGNT: διὰ được dịch là “vì”; ἀλήθειαν là “chân lý”; τὴν μένουσαν ἐν ἡμῖν được chuyển tự nhiên là “vẫn ở trong chúng ta”; καὶ μεθ’ ἡμῶν ἔσται là “và sẽ ở với chúng ta”; εἰς τὸν αἰῶνα là “mãi mãi”. Bản dịch không thêm chủ thể hoặc diễn giải thần học. Dấu câu và việc viết thường đầu câu phù hợp vì đây là mệnh đề tiếp nối câu 1.'
  naturalness: “vì chân lý vẫn ở trong chúng ta và sẽ ở với chúng ta mãi mãi” là tiếng Việt hiện đại, rõ ràng, với sắc thái trang trọng vừa phải. Sự lặp lại của “ở” phản ánh hai động từ/cấu trúc Hy Lạp khác nhau mà vẫn tự nhiên trong văn phong Kinh Thánh.
  terminology: “Chân lý” là tương đương phù hợp cho ἀλήθεια trong ngữ cảnh Giăng và giữ được độ rộng nghĩa của nguyên văn. “Mãi mãi” chuyển đạt đúng thành ngữ εἰς τὸν αἰῶνα. Chú thích “[a]” được neo đúng sau “mãi mãi”, dù về nội dung nó chỉ phương án cho “vẫn ở”; cách neo này không gây mơ hồ đáng kể trong câu ngắn.
