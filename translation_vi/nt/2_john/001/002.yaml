  text: διὰ τὴν ἀλήθειαν τὴν μένουσαν ἐν ἡμῖν, καὶ μεθ’ ἡμῶν ἔσται εἰς τὸν αἰῶνα·
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/002.yaml
  text: because of the truth that remains in us and will be with us forever[a].
translation:
  language: vi
  text: vì chân lý vẫn ở trong chúng ta và sẽ ở với chúng ta mãi mãi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “vẫn ở lại trong chúng ta.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ
  choice: vì
  rationale: διά với đối cách biểu thị nguyên nhân hoặc cơ sở; “vì” tự nhiên và nối câu này với tình yêu được nói đến ở câu 1.
- source_word: ἀλήθειαν
  choice: chân lý
  rationale: “Chân lý” giữ được nội dung thần học phong phú của ἀλήθεια mà không thu hẹp thành “Phúc Âm” hay “giáo lý chân chính”.
- source_word: τὴν μένουσαν
  choice: vẫn ở
  rationale: Phân từ hiện tại của μένω diễn tả sự hiện diện liên tục. “Vẫn ở” là cách nói tự nhiên, rõ nghĩa trong tiếng Việt hiện đại; “ở lại” được ghi như một khả năng khác.
- source_word: ἐν ἡμῖν
  choice: trong chúng ta
  rationale: Giữ nghĩa trực tiếp của ἐν với đại từ số nhiều và không đổi thành nghĩa thiên về cộng đồng là “giữa chúng ta”.
- source_word: καὶ μεθ’ ἡμῶν ἔσται
  choice: và sẽ ở với chúng ta
  rationale: Dịch trực tiếp μετά là “với” và ἔσται là “sẽ ở”; không thêm ý “tiếp tục” vốn không được lặp lại trong mệnh đề này.
- source_word: εἰς τὸν αἰῶνα
  choice: mãi mãi
  rationale: Đây là thành ngữ chỉ thời gian không dứt; “mãi mãi” tự nhiên, trang trọng vừa phải và dễ hiểu.
theological_decisions:
- issue: Ý nghĩa thần học của “chân lý” trong văn chương Giăng
  choice: Giữ nguyên thuật ngữ rộng “chân lý”.
  alternative: “chân lý Phúc Âm” hoặc “giáo lý chân chính”
  rationale: Ngữ cảnh cho phép những liên hệ thần học phong phú, nhưng danh từ Hy Lạp không xác định riêng đó là sứ điệp Phúc Âm, Đấng Christ hay thực tại mặc khải của Đức Chúa Trời. Bản dịch không nên tự ý giải quyết sự rộng nghĩa này.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Câu này là phần tiếp nối cú pháp từ câu 1 nên bắt đầu bằng chữ thường “vì”. Dùng “chúng ta” để giữ sắc thái bao gồm của đại từ số nhiều; không thêm chủ thể hay lời giải nghĩa thần học.
