  terminology: “Ân điển”, “lòng thương xót”, “sự bình an”, “chân lý”, và “tình yêu thương” phù hợp. “Đấng Mê-si” thể hiện đúng ý nghĩa tước hiệu của Χριστός; chú thích nên mô tả “Đấng Christ” là cách chuyển/dịch truyền thống, thay vì khẳng định đây là cách “phiên chuyển” trực tiếp từ tiếng Hy Lạp.
