  verdict: revise
  source_fidelity: 'Bản dịch truyền đạt đúng cấu trúc chính của câu: ba ân phúc là chủ ngữ của thì tương lai chỉ định “sẽ ở với chúng ta”; hai cụm παρὰ nêu cùng một nguồn ban; và “Con của Cha” được đặt đồng vị với Đức Chúa Giê-su, Đấng Mê-si. “Trong chân lý và tình yêu thương” giữ được tính phẩm chất không mạo từ của ἐν ἀληθείᾳ καὶ ἀγάπῃ.'
