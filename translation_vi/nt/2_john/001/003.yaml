  - severity: low
    issue: Chú thích a dùng thuật ngữ “phiên chuyển” không chính xác/không tự nhiên cho “Christ”.
    rationale: “Christ” là dạng truyền thống qua lịch sử ngôn ngữ, không phải một chuyển tự trực tiếp đơn giản từ Χριστός vào tiếng Việt. Nên nói đây là cách chuyển/dịch truyền thống để chú thích chính xác và dễ hiểu.
