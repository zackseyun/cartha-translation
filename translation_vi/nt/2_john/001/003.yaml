id: 2JN.1.3
reference: 2 John 1:3
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἔσται μεθ’ ἡμῶν χάρις ἔλεος εἰρήνη παρὰ θεοῦ πατρός, καὶ ⸀παρὰ Ἰησοῦ Χριστοῦ τοῦ υἱοῦ τοῦ πατρός, ἐν ἀληθείᾳ καὶ ἀγάπῃ.
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/003.yaml
  text: Grace[a], mercy, and peace will be with us from God the Father and from Jesus the Messiah, the Father's Son[b], in truth and love.
translation:
  language: vi
  text: Ân điển, lòng thương xót và sự bình an sẽ ở với chúng ta, đến từ Đức Chúa Trời là Đức Chúa Cha và từ Đức Chúa Giê-su, Đấng Mê-si[a], Con của Đức Chúa Cha[b], trong chân lý và tình yêu thương.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “Đấng Christ”. Tước hiệu Hy Lạp Χριστός thường được chuyển theo truyền thống là “Christ”; ở đây dịch là “Đấng Mê-si” để giữ rõ ý nghĩa tước hiệu.
    reason: lexical_alternative
  - marker: b
    text: Hay “Con của Cha”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔσται
  choice: sẽ ở
  rationale: Thì tương lai chỉ định của εἰμί được chuyển trực tiếp bằng “sẽ ở”, giữ sắc thái xác quyết thay vì biến thành lời cầu chúc.
- source_word: μεθ’ ἡμῶν
  choice: ở với chúng ta
  rationale: μετά với sở hữu cách có nghĩa thông thường là “với”; “ở với chúng ta” tự nhiên trong công thức chào chúc thư tín.
- source_word: χάρις ἔλεος εἰρήνη
  choice: Ân điển, lòng thương xót và sự bình an
  rationale: Ba danh từ làm chủ ngữ của ἔσται; cách diễn đạt này vừa sát thứ tự Hy Lạp vừa rõ nghĩa trong tiếng Việt hiện đại.
- source_word: παρὰ θεοῦ πατρός
  choice: đến từ Đức Chúa Trời là Cha
  rationale: παρά với sở hữu cách chỉ nguồn gốc. “Là Cha” thể hiện quan hệ đồng vị mà không thêm đại từ sở hữu không có trong nguyên văn.
- source_word: παρὰ Ἰησοῦ Χριστοῦ
  choice: từ Đức Chúa Giê-su, Đấng Mê-si
  rationale: παρά tiếp tục chỉ nguồn gốc; Χριστός được dịch theo nghĩa tước hiệu là “Đấng Mê-si”, còn Ἰησοῦ được chuyển theo tên gọi quen thuộc trong tiếng Việt.
- source_word: τοῦ υἱοῦ τοῦ πατρός
  choice: Con của Cha
  rationale: Giữ quan hệ sở hữu/xuất phát được diễn đạt bằng hai sở hữu cách và chức năng đồng vị xác định Đức Chúa Giê-su là Con của Cha.
- source_word: ἐν ἀληθείᾳ καὶ ἀγάπῃ
  choice: trong chân lý và tình yêu thương
  rationale: Giữ giới từ ἐν bằng “trong”; hai danh từ không có mạo từ được hiểu theo phẩm tính, không tự ý thêm “chân lý ấy” hay “tình yêu ấy”.
theological_decisions:
- issue: Cách dịch Χριστοῦ
  choice: Đấng Mê-si
  alternative: Đấng Christ
  rationale: Χριστός tại đây là tước hiệu gắn với Giê-su; dịch nghĩa là “Đấng Mê-si” làm rõ chức năng tước hiệu, trong khi chú thích bảo lưu cách phiên chuyển truyền thống.
- issue: Quan hệ của τοῦ υἱοῦ τοῦ πατρός với Đức Chúa Giê-su
  choice: Cụm đồng vị “Con của Cha” xác định Đức Chúa Giê-su, Đấng Mê-si
  alternative: Một cụm mô tả lỏng hơn theo sau danh xưng
  rationale: Cấu trúc sở hữu cách có mạo từ tự nhiên nhất là đồng vị với Ἰησοῦ Χριστοῦ, nêu rõ Ngài là Con của Cha mà không thêm diễn giải tín lý ngoài văn bản.
- issue: Sắc thái của ἔσται
  choice: 'Lời xác quyết: “sẽ ở với chúng ta”'
  alternative: 'Lời cầu chúc: “nguyện ... ở với chúng ta”'
  rationale: Hình thái là tương lai chỉ định, nên giữ lời xác quyết, đồng thời không xóa sắc thái chúc phước của ngữ cảnh thư tín.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Dùng “Đức Chúa Trời” và “Đức Chúa Giê-su” theo lối gọi Kinh Thánh quen thuộc; giữ cấu trúc xác quyết của nguyên văn và tránh thêm từ “chúng ta” vào danh xưng của Cha.
