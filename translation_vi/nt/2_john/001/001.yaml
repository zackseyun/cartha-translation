  source_fidelity: Bản dịch truyền đạt đúng cấu trúc thư tín, ý nghĩa của πρεσβύτερος, tính nước đôi của ἐκλεκτῇ κυρίᾳ, và sắc thái thì hoàn thành trong “đã nhận biết”. Tuy nhiên, cụm “bà được chọn và các con của bà, là những người tôi yêu” khiến mệnh đề quan hệ tiếng Việt có thể bao gồm cả “bà”. Đại từ οὓς là giống đực số nhiều, nên trong cấu trúc bề mặt nó quy chiếu tự nhiên nhất đến “các con”; bản dịch nên làm rõ phạm vi này mà không quyết định vấn đề bà/hội thánh.
