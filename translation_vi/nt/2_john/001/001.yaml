id: 2JN.1.1
reference: 2 John 1:1
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ὁ πρεσβύτερος ἐκλεκτῇ κυρίᾳ καὶ τοῖς τέκνοις αὐτῆς, οὓς ἐγὼ ἀγαπῶ ἐν ἀληθείᾳ, καὶ οὐκ ἐγὼ μόνος ἀλλὰ καὶ πάντες οἱ ἐγνωκότες τὴν ἀλήθειαν,
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/001.yaml
  text: The elder[a], to the chosen lady and her children, whom I love in truth—and not I alone[b], but also all who have come to know the truth—
translation:
  language: vi
  text: Trưởng lão[a] kính gửi bà được chọn[b] và các con của bà—những người tôi yêu trong chân lý[c]—không chỉ mình tôi, mà còn tất cả những người đã nhận biết chân lý—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Trưởng lão” có thể chỉ tuổi tác, địa vị được kính trọng hoặc vai trò lãnh đạo được nhìn nhận.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể hiểu là “bà được tuyển chọn”. Một số người hiểu “bà” theo nghĩa ẩn dụ, chỉ một hội thánh địa phương; số khác cho rằng Kyria là tên riêng của một phụ nữ.
    reason: alternative_reading
  - marker: c
    text: 'Cũng có thể hiểu là “thật lòng”; cụm từ này đồng thời có thể mang nghĩa đặc trưng trong văn phẩm Giăng: “ở trong chân lý”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὁ πρεσβύτερος
  choice: Trưởng lão
  rationale: Trong lời mở đầu thư, từ này tự nhiên nhất là một danh xưng chỉ người có tuổi đời, địa vị hoặc vai trò lãnh đạo được nhìn nhận. “Trưởng lão” giữ được sắc thái danh xưng mà không thu hẹp thành một chức vụ giáo hội theo hệ phái cụ thể.
- source_word: ἐκλεκτῇ
  choice: được chọn
  rationale: Diễn đạt tự nhiên ý nghĩa của ἐκλεκτός, đồng thời có thể áp dụng cho một phụ nữ cụ thể hoặc cho một hội chúng được nhân cách hóa.
- source_word: κυρίᾳ
  choice: bà
  rationale: “Bà” là cách xưng gọi trang trọng, tự nhiên trong tiếng Việt đối với κυρία. Cách dịch này giữ mở khả năng chỉ một phụ nữ hoặc một hội thánh được nhân cách hóa; khả năng đây là tên riêng Kyria được nêu trong chú thích.
- source_word: τοῖς τέκνοις αὐτῆς
  choice: các con của bà
  rationale: τέκνα chỉ con cái nói chung, không riêng con trai. Cụm từ này phù hợp cả với nghĩa trực tiếp lẫn cách hiểu ẩn dụ về các thành viên của một hội chúng.
- source_word: οὓς
  choice: là những người
  rationale: Đại từ quan hệ số nhiều chỉ những người được tác giả yêu. Cách diễn đạt này tự nhiên trong tiếng Việt và không buộc phải xác định nó chỉ quy về các con hay toàn thể nhóm người nhận thư.
- source_word: ἀγαπῶ
  choice: tôi yêu
  rationale: Dịch trực tiếp động từ ἀγαπάω, không thêm sắc thái nhấn mạnh vốn không có trong nguyên văn.
- source_word: ἐν ἀληθείᾳ
  choice: trong chân lý
  rationale: Giữ cả khả năng chỉ lòng chân thật và sắc thái thần học đặc trưng của văn phẩm Giăng về việc sống, yêu trong phạm vi chân lý.
- source_word: οὐκ ἐγὼ μόνος ἀλλὰ καὶ πάντες
  choice: không chỉ mình tôi, mà còn tất cả
  rationale: Tái hiện tự nhiên thế tương phản và sự nhấn mạnh giữa tác giả với cộng đồng rộng hơn.
- source_word: οἱ ἐγνωκότες
  choice: những người đã nhận biết
  rationale: Thì hoàn thành của γινώσκω diễn tả việc đã đi đến chỗ nhận biết và hiện vẫn ở trong trạng thái ấy; “đã nhận biết” truyền đạt khía cạnh này gọn và tự nhiên.
- source_word: τὴν ἀλήθειαν
  choice: chân lý
  rationale: Giữ nguyên sự lặp lại của ἀλήθεια và sắc thái vừa thông thường vừa thần học trong văn phẩm Giăng.
theological_decisions:
- issue: Căn tính của ἐκλεκτῇ κυρίᾳ
  choice: Dịch “bà được chọn”, như lời gửi đến một phụ nữ, nhưng không loại trừ khả năng đây là cách nhân cách hóa một hội thánh địa phương.
  alternative: Một phụ nữ Cơ Đốc cụ thể và các con bà; một hội chúng cùng các thành viên; hoặc Kyria là tên riêng.
  rationale: Ngữ pháp Hy Lạp cho phép nhiều cách hiểu này. Bản dịch chính giữ nghĩa danh từ chung tự nhiên của κυρία, còn chú thích bảo tồn các khả năng khác thay vì quyết định thay cho người đọc.
- issue: Ý nghĩa của ἐν ἀληθείᾳ
  choice: Dịch “trong chân lý”.
  alternative: “thật lòng” hoặc “trong sự thật”.
  rationale: Cụm từ có thể nói về sự chân thành, nhưng trong văn phẩm Giăng cũng có thể chỉ lĩnh vực hay chuẩn mực của chân lý. “Trong chân lý” giữ được sự căng nghĩa này mà không thu hẹp thành một cách giải thích.
translation_notes:
  register: Văn phong thư tín trang trọng nhưng hiện đại. “Kính gửi” được bổ sung tự nhiên theo cấu trúc người gửi–người nhận hàm chứa trong cách Hy Lạp dùng tặng cách ở đầu thư. Dấu gạch ngang cuối câu giữ tính tiếp diễn của cú pháp sang câu kế tiếp.
