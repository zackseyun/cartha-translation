  terminology: “Trưởng lão,” “được chọn,” “các con,” “yêu,” và “chân lý” đều nhất quán, tự nhiên và không áp đặt cách hiểu hệ phái. Các chú thích giữ được khả năng “Kyria” là tên riêng, cũng như cách hiểu hội thánh được nhân cách hóa và nghĩa thay thế của ἐν ἀληθείᾳ.
