id: 2JN.1.4
reference: 2 John 1:4
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἐχάρην λίαν ὅτι εὕρηκα ἐκ τῶν τέκνων σου περιπατοῦντας ἐν ἀληθείᾳ, καθὼς ἐντολὴν ἐλάβομεν παρὰ τοῦ πατρός.
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/004.yaml
  text: I rejoiced greatly that I have found some of your children walking in the truth[b][a], just as we received a commandment from the Father.
translation:
  language: vi
  text: Tôi vô cùng vui mừng vì đã thấy một số con cái của bà[a] đang bước đi trong chân lý[b], đúng như điều răn chúng ta đã nhận từ Cha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “trong số con cái của bà.” Cách diễn đạt Hy Lạp chỉ một phần trong nhóm, không nhất thiết là tất cả.
    reason: lexical_alternative
  - marker: b
    text: Hay “trong sự thật.” Cụm từ này có lẽ không chỉ nói đến lòng thành thật, mà còn nói đến đời sống phù hợp với chân lý đã được bày tỏ.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐχάρην λίαν
  choice: Tôi vô cùng vui mừng
  rationale: Diễn đạt đầy đủ động từ chỉ niềm vui cùng trạng từ nhấn mạnh λίαν, bằng lối nói tự nhiên và trang trọng trong tiếng Việt hiện đại.
- source_word: εὕρηκα
  choice: đã thấy
  rationale: Từ “đã” thể hiện việc khám phá đã xảy ra; ngữ cảnh vẫn cho thấy kết quả của sự khám phá ấy còn có ý nghĩa ở hiện tại.
- source_word: ἐκ τῶν τέκνων σου
  choice: một số con cái của bà
  rationale: Cấu trúc ἐκ với sở hữu cách mang nghĩa phân bộ, chỉ một số người trong nhóm chứ không khẳng định tất cả. “Bà” phù hợp với cách hiểu người nhận thư là “bà được chọn” ở câu 1, nhưng vẫn không quyết định bà là một cá nhân hay hình ảnh chỉ một hội thánh.
- source_word: περιπατοῦντας
  choice: đang bước đi
  rationale: Giữ lại ẩn dụ đạo đức quan trọng trong văn chương Giăng thay vì làm phẳng thành “sống”; “đang” diễn tả hành động được quan sát nơi những người ấy.
- source_word: ἐν ἀληθείᾳ
  choice: trong chân lý
  rationale: Giữ nghĩa về phạm vi hay chuẩn mực của chân lý, đồng thời tránh thu hẹp thành sự thành thật cá nhân.
- source_word: καθὼς
  choice: đúng như
  rationale: Nêu rõ sự tương ứng giữa cách sống của họ và điều răn đã được nhận.
- source_word: ἐντολὴν
  choice: điều răn
  rationale: Đây là thuật ngữ tự nhiên trong tiếng Việt Kinh Thánh, giữ được sức nặng luân lý và giao ước của từ ἐντολή.
- source_word: ἐλάβομεν
  choice: chúng ta đã nhận
  rationale: Giữ nguyên ngôi thứ nhất số nhiều và sắc thái quá khứ của động từ aorist.
- source_word: παρὰ τοῦ πατρός
  choice: từ Cha
  rationale: Giữ nguyên tước hiệu “Cha” mà không thêm “Đức Chúa Trời” hay một danh xưng khác không có trực tiếp trong câu Hy Lạp.
theological_decisions:
- issue: Phạm vi của “con cái của bà”
  choice: một số con cái của bà
  alternative: con cái của bà
  rationale: Giới từ ἐκ tạo nghĩa phân bộ; bản dịch không nên khiến người đọc hiểu rằng tác giả nhất thiết nói về tất cả.
- issue: Ý nghĩa của “trong chân lý”
  choice: giữ nguyên hình ảnh “bước đi trong chân lý”
  alternative: sống chân thật
  rationale: Cách chọn này bảo tồn ẩn dụ của Giăng và khả năng cụm từ nói đến đời sống phù hợp với chân lý đã được mặc khải, thay vì chỉ nói về tính thành thật.
- issue: Danh xưng τοῦ πατρός
  choice: Cha
  alternative: Đức Chúa Trời là Cha; Đức Chúa Cha
  rationale: Nguyên văn chỉ dùng danh xưng “Cha”; không mở rộng bằng một cách gọi mang thêm từ ngữ ngoài văn bản.
- issue: Người nhận được gọi bằng đại từ giống cái
  choice: bà
  alternative: chị; hội thánh của bà
  rationale: Dạng sở hữu σου tự nó không biểu thị giống, nhưng văn cảnh câu 1 gọi người nhận bằng danh từ giống cái κυρία. “Bà” giữ cách xưng hô tự nhiên mà không quyết định người nhận là cá nhân hay hội thánh được nhân cách hóa.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Bản dịch giữ ẩn dụ “bước đi,” dùng “điều răn” theo văn phong Kinh Thánh quen thuộc, và đặt các dấu chú thích ngay sau những cụm từ cần giải thích.
