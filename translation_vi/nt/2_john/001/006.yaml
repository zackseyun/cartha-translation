source:
  edition: SBLGNT
  text: καὶ αὕτη ἐστὶν ἡ ἀγάπη, ἵνα περιπατῶμεν κατὰ τὰς ἐντολὰς αὐτοῦ· αὕτη ⸂ἡ ἐντολή ἐστιν⸃, καθὼς ἠκούσατε ἀπ’ ἀρχῆς, ἵνα ἐν αὐτῇ περιπατῆτε.
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/006.yaml
  text: 'And this is love: that we walk according to his commandments. This is the commandment[a], just as you heard from the beginning, that you should walk in it.'
translation:
  language: vi
  text: 'Và đây là tình yêu thương: chúng ta bước đi theo các điều răn của Ngài. Đây là điều răn[a]: như anh chị em đã nghe từ ban đầu, anh chị em phải bước đi trong điều ấy.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “... anh chị em phải bước đi trong tình yêu thương.” Đại từ “điều ấy” cũng có thể chỉ về “tình yêu thương” thay vì “điều răn”.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀγάπη
  choice: tình yêu thương
  rationale: Cách diễn đạt tự nhiên, trang trọng trong tiếng Việt hiện đại, đồng thời giữ mối liên hệ từ vựng với cách dùng của Giăng.
- source_word: ἵνα περιπατῶμεν
  choice: chúng ta bước đi
  rationale: Giữ ẩn dụ đạo đức của περιπατέω và hiểu ἵνα là phần giải thích nội dung thực tiễn của tình yêu thương.
- source_word: κατὰ τὰς ἐντολὰς αὐτοῦ
  choice: theo các điều răn của Ngài
  rationale: “Theo” diễn đạt sự phù hợp với chuẩn mực; “các điều răn” giữ nguyên số nhiều và liên kết với danh từ số ít ở mệnh đề sau.
- source_word: αὕτη ἡ ἐντολή ἐστιν
  choice: Đây là điều răn
  rationale: Không thêm sở hữu từ vốn không có trong tiếng Hy Lạp và giữ sự chuyển đổi có ý nghĩa từ số nhiều sang số ít.
- source_word: καθὼς ἠκούσατε ἀπ’ ἀρχῆς
  choice: mà anh chị em đã nghe từ ban đầu
  rationale: Mệnh đề quan hệ này tự nhiên trong tiếng Việt và giữ thành ngữ “từ ban đầu” đặc trưng trong văn chương Giăng.
- source_word: ἵνα ἐν αὐτῇ περιπατῆτε
  choice: anh chị em phải bước đi trong điều ấy
  rationale: Giữ ẩn dụ “bước đi” và đại từ quy chiếu chưa hoàn toàn minh nhiên; “phải” diễn đạt lực mệnh lệnh của mệnh đề ἵνα trong ngữ cảnh.
theological_decisions:
- issue: Đối tượng quy chiếu của αὐτῇ trong mệnh đề cuối
  choice: Trong chính văn, “điều ấy” quy chiếu gần nhất đến “điều răn”.
  alternative: Đại từ cũng có thể quy chiếu đến “tình yêu thương” ở đầu câu.
  rationale: ἐντολή và ἀγάπη đều là danh từ giống cái số ít; tiền tố gần nhất thiên về “điều răn”, nhưng quan hệ ý niệm với “tình yêu thương” đủ mạnh để cần ghi nhận cách hiểu kia trong chú thích.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Giữ lối nói ẩn dụ “bước đi” được lặp lại trong nguyên văn; dùng “anh chị em” cho ngôi thứ hai số nhiều và viết hoa “Ngài” để chỉ Đức Chúa Trời/Đấng Christ mà không xác định quá mức đối tượng của αὐτοῦ.
