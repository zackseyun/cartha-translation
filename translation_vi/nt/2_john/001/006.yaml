revisions:
- from: 'Và tình yêu thương là thế này: chúng ta bước đi theo các điều răn của Ngài. Đây là điều răn[a] mà anh chị em đã nghe từ ban đầu: anh chị em phải bước đi trong điều ấy.'
  to: 'Và đây là tình yêu thương: chúng ta bước đi theo các điều răn của Ngài. Đây là điều răn[a]: như anh chị em đã nghe từ ban đầu, anh chị em phải bước đi trong điều ấy.'
  rationale: Bản sửa giữ nguyên nội dung, phép ẩn dụ và tính mơ hồ có chủ ý của nguyên văn, đồng thời sửa quan hệ cú pháp của καθὼς ἠκούσατε ἀπ’ ἀρχῆς. «Phải» diễn đạt phù hợp lời huấn dụ trong mệnh đề ἵνα ở ngữ cảnh này mà không thêm một nội dung thần học nào.
