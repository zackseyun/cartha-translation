id: 2JN.1.5
reference: 2 John 1:5
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ νῦν ἐρωτῶ σε, κυρία, οὐχ ὡς ἐντολὴν ⸂καινὴν γράφων σοι⸃ ἀλλὰ ἣν εἴχομεν ἀπ’ ἀρχῆς, ἵνα ἀγαπῶμεν ἀλλήλους.
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/005.yaml
  text: 'And now I ask you[a], lady, not as though I were writing to you a new commandment, but the one we have had from the beginning: that we love one another.'
translation:
  language: vi
  text: 'Bây giờ, thưa bà[a], tôi xin bà điều này: không phải như thể tôi viết cho bà một điều răn mới, nhưng là điều răn chúng ta đã có từ ban đầu: đó là chúng ta yêu thương nhau.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể hiểu là “thưa hội thánh” nếu “bà” được dùng theo nghĩa bóng; một cách hiểu khác coi Kyria là tên riêng.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐρωτῶ
  choice: tôi xin
  rationale: Trong ngữ cảnh thư tín, ἐρωτῶ mang nghĩa xin hoặc đề nghị; “tôi xin” tự nhiên trong tiếng Việt và không làm sắc thái mạnh hơn thành “tôi khuyên giục”.
- source_word: κυρία
  choice: thưa bà
  rationale: κυρία là dạng hô cách số ít của “bà/nữ chủ.” “Thưa bà” thể hiện trực tiếp cách xưng hô kính trọng, đồng thời không quyết định người nhận là một phụ nữ cụ thể, một hội thánh được nhân cách hóa hay người mang tên Kyria.
- source_word: ἐντολὴν καινὴν
  choice: một điều răn mới
  rationale: Cách dịch quen thuộc, chính xác, đồng thời giữ liên hệ văn chương với cách dùng của Giăng ở những chỗ khác.
- source_word: γράφων σοι
  choice: tôi không viết cho bà
  rationale: Chuyển cấu trúc phân từ trong οὐχ ὡς ... ἀλλά thành câu tiếng Việt tự nhiên; ý “không phải như thể đang viết” được diễn đạt gọn mà không thay đổi sự đối lập.
- source_word: ἣν εἴχομεν
  choice: điều răn chúng ta đã có
  rationale: Thì chưa hoàn thành εἴχομεν diễn tả điều đã được cộng đồng sở hữu từ trước; “đã có” phù hợp với tiếng Việt và không nhất thiết ngụ ý nay không còn.
- source_word: ἀπ’ ἀρχῆς
  choice: từ ban đầu
  rationale: Giữ công thức đặc trưng trong các trước tác của Giăng và sắc thái văn chương trang trọng.
- source_word: ἵνα ἀγαπῶμεν ἀλλήλους
  choice: ấy là chúng ta phải yêu thương nhau
  rationale: ἵνα ở đây giải thích nội dung của điều răn và động từ giả định có sắc thái khuyên truyền; “ấy là ... phải” làm rõ quan hệ nội dung mà không biến câu thành một mệnh lệnh trực tiếp mới.
theological_decisions:
- issue: Đối tượng được gọi là κυρία
  choice: Dịch theo nghĩa từ vựng là “thưa bà” và để chú thích nêu các cách hiểu.
  alternative: Hiểu theo nghĩa bóng là hội thánh, hoặc coi Kyria là tên riêng.
  rationale: Bản Hy Lạp cho phép nhiều cách nhận diện người nhận. Bản dịch chính nên giữ sự mơ hồ thật sự thay vì mặc nhiên xác định đây là một cá nhân hay một hội thánh.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Cách xưng hô “thưa bà / tôi” phù hợp văn phong thư tín; “yêu thương nhau” tự nhiên và giữ sắc thái tương hỗ của ἀλλήλους.
