language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εἰς ὃ καὶ προσευχόμεθα πάντοτε περὶ ὑμῶν, ἵνα ὑμᾶς ἀξιώσῃ τῆς κλήσεως ὁ θεὸς ἡμῶν καὶ πληρώσῃ πᾶσαν εὐδοκίαν ἀγαθωσύνης καὶ ἔργον πίστεως ἐν δυνάμει,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/001/011.yaml
  text: To this end also we always pray for you[a], that our God may count you worthy of the calling and may fulfill every good resolve and work of faith with power[c][b],
translation:
  language: vi
  text: Chính vì điều đó, chúng tôi cũng luôn cầu nguyện cho anh chị em, xin Đức Chúa Trời của chúng ta kể anh chị em là xứng đáng với sự kêu gọi[a], và hoàn thành mọi ý định tốt lành[b] cùng công việc của đức tin[c] bằng quyền năng.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “làm cho anh chị em xứng đáng với sự kêu gọi.” Động từ Hy Lạp có thể mang nghĩa “kể/xem là xứng đáng” hoặc “làm cho xứng đáng.”'
    reason: alternative_reading
  - marker: b
    text: 'Cũng có thể dịch: “mọi quyết tâm làm điều thiện” hoặc “mọi ý định hướng đến điều thiện.”'
    reason: lexical_alternative
  - marker: c
    text: Cụm này theo nghĩa đen là “công việc của đức tin”; cũng có thể hiểu là công việc do đức tin sinh ra. Từ được dịch là “đức tin” trong ngữ cảnh này cũng có thể mang nghĩa “lòng trung tín.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς ὃ
  choice: Vì mục đích ấy
  rationale: Cụm từ nối lại ý trước và mang sắc thái hướng đến mục tiêu; cách dịch này tự nhiên trong tiếng Việt mà vẫn giữ lực chỉ mục đích.
- source_word: καὶ
  choice: cũng
  rationale: Giữ sắc thái bổ sung/nhấn mạnh của liên từ trong câu.
- source_word: προσευχόμεθα πάντοτε περὶ ὑμῶν
  choice: chúng tôi cũng luôn cầu nguyện cho anh chị em
  rationale: Diễn đạt hành động cầu nguyện thường xuyên đang tiếp diễn; 'cho anh chị em' là cách nói tự nhiên của περὶ ὑμῶν.
- source_word: ἵνα
  choice: xin
  rationale: Trong ngữ cảnh nội dung của lời cầu nguyện, 'xin' nối tự nhiên với hai động từ giả định mà không làm mất sắc thái mục đích/nội dung.
- source_word: ἀξιώσῃ
  choice: kể ... là xứng đáng
  rationale: Giữ nghĩa đánh giá của động từ và đồng thời để ngỏ nghĩa khả dĩ 'làm cho xứng đáng', được ghi ở chú thích.
- source_word: τῆς κλήσεως
  choice: với sự kêu gọi
  rationale: Không thêm đại từ sở hữu vì nguyên văn chỉ có mạo từ; 'với' là kết hợp tự nhiên với 'xứng đáng' trong tiếng Việt.
- source_word: ὁ θεὸς ἡμῶν
  choice: Đức Chúa Trời của chúng ta
  rationale: Giữ rõ đại từ sở hữu ἡμῶν và dùng cách gọi trang trọng, quen thuộc.
- source_word: πληρώσῃ
  choice: hoàn thành
  rationale: Diễn đạt việc thực hiện trọn vẹn; phù hợp với cả hai đối tượng theo sau.
- source_word: πᾶσαν εὐδοκίαν ἀγαθωσύνης
  choice: mọi quyết tâm hướng đến điều thiện
  rationale: εὐδοκία có thể chỉ ý định, niềm vui thích hay quyết tâm; trong cấu trúc này, cách dịch nhấn mạnh chủ đích đạo đức nhưng không đồng nhất hai danh từ.
- source_word: ἔργον πίστεως
  choice: mọi công việc phát xuất từ đức tin
  rationale: Diễn đạt rõ một cách hiểu tự nhiên của quan hệ sở hữu cách, đồng thời chú thích giữ lại khả năng hiểu cô đọng là 'công việc của đức tin' hoặc sắc thái trung tín.
- source_word: ἐν δυνάμει
  choice: dùng quyền năng mà
  rationale: Gắn cụm phương tiện/cách thức với πληρώσῃ, cho thấy Đức Chúa Trời hoàn thành những điều ấy bằng quyền năng.
theological_decisions:
- issue: Ý nghĩa của ἀξιώσῃ trong tương quan với sự kêu gọi của Đức Chúa Trời
  choice: kể anh chị em là xứng đáng với sự kêu gọi
  alternative: làm cho anh chị em xứng đáng với sự kêu gọi
  rationale: Nghĩa chính giữ sắc thái đánh giá, nhưng động từ Hy Lạp cũng có thể chỉ việc khiến ai đó trở nên xứng đáng; chú thích bảo tồn căng thẳng này mà không áp đặt một kết luận thần học.
- issue: Quan hệ sở hữu cách trong ἔργον πίστεως và nghĩa của πίστις
  choice: công việc phát xuất từ đức tin
  alternative: công việc của đức tin; công việc của lòng trung tín
  rationale: Cách dịch chính làm câu tiếng Việt sáng rõ, nhưng chú thích duy trì khả năng sở hữu cách rộng hơn và nghĩa từ vựng 'lòng trung tín' của πίστις.
- issue: Chủ thể của εὐδοκία và ἔργον
  choice: không nêu chủ thể sở hữu một cách minh thị
  alternative: mọi quyết tâm tốt lành của anh chị em và công việc đức tin của anh chị em
  rationale: Nguyên văn không có đại từ sở hữu. Tránh thêm 'của anh chị em' giúp không khép lại khả năng quy chiếu vốn cô đọng của câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh chị em” để chỉ cộng đồng tín hữu số nhiều; giữ cấu trúc một câu và sự song song của hai lời cầu xin. Các chú thích bảo tồn những điểm mơ hồ thật sự của nguyên văn.
