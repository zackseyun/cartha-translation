  source_fidelity: Bản nháp phản ánh đúng cấu trúc chính của câu và giữ được hai động từ cầu xin song song. Tuy nhiên, “mọi công việc” không có tương ứng trực tiếp với πᾶσαν, vốn ngữ pháp bổ nghĩa cho εὐδοκίαν; còn “phát xuất từ đức tin” chọn và khép hẹp một cách hiểu của sở hữu cách πίστεως ngay trong bản văn chính.
  naturalness: Câu nhìn chung tự nhiên, nhưng “Vì mục đích ấy” hơi gượng trong tiếng Việt hiện đại. “Chính vì điều đó” liên kết mạch lạc hơn với ý trước. Đặt “bằng quyền năng” ở cuối câu cũng tự nhiên và giữ được tính mở về phạm vi bổ nghĩa trong nguyên văn.
