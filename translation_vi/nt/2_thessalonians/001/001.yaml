id: 2TH.1.1
reference: 2 Thessalonians 1:1
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Παῦλος καὶ Σιλουανὸς καὶ Τιμόθεος τῇ ἐκκλησίᾳ Θεσσαλονικέων ἐν θεῷ πατρὶ ἡμῶν καὶ κυρίῳ Ἰησοῦ Χριστῷ·
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/001/001.yaml
  text: 'Paul and Silvanus and Timothy[b][a], to the church of the Thessalonians in God our Father and the Lord Jesus the Messiah:'
translation:
  language: vi
  text: Phao-lô, Si-vanh và Ti-mô-thê gửi đến hội thánh của người Tê-sa-lô-ni-ca ở trong Đức Chúa Trời, là Cha chúng ta, và Chúa Giê-su, Đấng Mê-si-a:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “Đức Giê-su, Đấng Christ.” Từ Hy Lạp Χριστός có thể được dịch là “Đấng Mê-si-a” hoặc theo cách gọi truyền thống là “Đấng Christ.”
    reason: alternative_reading
lexical_decisions:
- source_word: Παῦλος
  choice: Phao-lô
  rationale: Dùng dạng phiên âm tiếng Việt quen thuộc của tên riêng Hy Lạp Παῦλος.
- source_word: Σιλουανὸς
  choice: Si-vanh
  rationale: Phiên âm trực tiếp tên Σιλουανός, không đồng nhất hóa với dạng rút gọn Si-la trong Công vụ.
- source_word: Τιμόθεος
  choice: Ti-mô-thê
  rationale: Dùng dạng phiên âm tiếng Việt quen thuộc của tên riêng Τιμόθεος.
- source_word: ἐκκλησίᾳ
  choice: hội thánh
  rationale: Cách gọi tự nhiên và trang trọng trong tiếng Việt đối với cộng đồng tín hữu; vẫn giữ ý nghĩa cộng đồng của ἐκκλησία.
- source_word: Θεσσαλονικέων
  choice: của người Tê-sa-lô-ni-ca
  rationale: Giữ đúng hình thức sở hữu chỉ dân cư trong tiếng Hy Lạp, thay vì chuyển thành một cụm chỉ địa điểm.
- source_word: ἐν
  choice: ở trong
  rationale: Giữ cách diễn đạt cô đọng của Phao-lô về phạm vi, sự hiệp nhất hoặc nền tảng của hội thánh nơi Đức Chúa Trời và Chúa Giê-su, không giải nghĩa quá mức.
- source_word: θεῷ πατρὶ ἡμῶν
  choice: Đức Chúa Trời, Cha chúng ta
  rationale: Giữ đại từ sở hữu ἡμῶν và dùng dấu phẩy để thể hiện quan hệ đồng vị giữa Đức Chúa Trời và Cha chúng ta.
- source_word: κυρίῳ
  choice: Chúa
  rationale: Danh hiệu tự nhiên và chuẩn mực trong tiếng Việt dành cho κύριος khi nói về Giê-su.
- source_word: Ἰησοῦ Χριστῷ
  choice: Đức Giê-su, Đấng Mê-si-a
  rationale: Phiên âm tên Ἰησοῦ và dịch Χριστός theo chức danh; thêm dấu phẩy giúp người đọc nhận ra Mê-si-a là danh hiệu.
theological_decisions:
- issue: Cách dịch Χριστῷ trong chuỗi tên và danh hiệu Ἰησοῦ Χριστῷ
  choice: Đấng Mê-si-a
  alternative: Đấng Christ
  rationale: Χριστός mang nghĩa danh hiệu chỉ Đấng được xức dầu. Bản dịch chính làm rõ chức danh ấy, còn cách gọi truyền thống được ghi ở chú thích.
- issue: Quan hệ do ἐν diễn đạt trong ἐν θεῷ πατρὶ ἡμῶν καὶ κυρίῳ Ἰησοῦ Χριστῷ
  choice: ở trong Đức Chúa Trời, Cha chúng ta, và Chúa là Đức Giê-su, Đấng Mê-si-a
  alternative: thuộc về Đức Chúa Trời, Cha chúng ta, và Chúa là Đức Giê-su, Đấng Mê-si-a
  rationale: Giữ giới từ ἐν để không quyết định thay người đọc rằng cụm từ chỉ sự thuộc về, sự hiệp nhất, phạm vi hay nền tảng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Cấu trúc “gửi đến” hoàn chỉnh hóa lối mở đầu thư tín vốn không có động từ trong tiếng Hy Lạp. Cụm “là hội thánh” được lặp lại để câu tiếng Việt rõ nghĩa, nhưng không diễn giải quan hệ ἐν vượt quá nguyên văn.
