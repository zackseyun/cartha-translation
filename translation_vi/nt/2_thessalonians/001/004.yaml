id: 2TH.1.4
reference: 2 Thessalonians 1:4
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὥστε ⸂αὐτοὺς ἡμᾶς⸃ ἐν ὑμῖν ⸀ἐγκαυχᾶσθαι ἐν ταῖς ἐκκλησίαις τοῦ θεοῦ ὑπὲρ τῆς ὑπομονῆς ὑμῶν καὶ πίστεως ἐν πᾶσιν τοῖς διωγμοῖς ὑμῶν καὶ ταῖς θλίψεσιν αἷς ἀνέχεσθε,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/001/004.yaml
  text: so that we ourselves boast about you among the churches of God because of your perseverance and faith in all your persecutions and afflictions that you are enduring,[a]
translation:
  language: vi
  text: đến nỗi chính chúng tôi tự hào về anh chị em giữa các hội thánh của Đức Chúa Trời, vì lòng kiên trì và đức tin[a] của anh chị em giữa mọi cuộc bắt bớ và hoạn nạn mà anh chị em đang chịu đựng.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “lòng trung tín”; πίστις có thể chỉ đức tin hoặc sự trung tín bền vững, nhất là trong bối cảnh chịu khổ.
    reason: alternative_reading
lexical_decisions:
- source_word: ὥστε
  choice: đến nỗi
  rationale: Diễn tả kết quả phát sinh từ câu trước, tự nhiên hơn trong tiếng Việt khi câu này được đọc nối tiếp văn mạch.
- source_word: αὐτοὺς ἡμᾶς
  choice: chính chúng tôi cũng
  rationale: Giữ sắc thái nhấn mạnh vào Phao-lô và các bạn đồng hành; “cũng” giúp diễn đạt tự nhiên hàm ý đáng chú ý rằng chính họ đang tự hào.
- source_word: ἐν ὑμῖν ἐγκαυχᾶσθαι
  choice: tự hào về anh chị em
  rationale: Trong kết cấu với động từ khoe mình/tự hào, ἐν ὑμῖν chỉ đối tượng hoặc cơ sở của sự tự hào. Cách nói này rõ và tự nhiên trong tiếng Việt hiện đại.
- source_word: ἐν ταῖς ἐκκλησίαις τοῦ θεοῦ
  choice: giữa các hội thánh của Đức Chúa Trời
  rationale: “Giữa” diễn đạt phạm vi cộng đồng nơi lời tự hào được nói ra, đồng thời giữ số nhiều của ἐκκλησίαις.
- source_word: ὑπὲρ
  choice: vì
  rationale: Ở đây giới từ nêu lý do hoặc cơ sở của sự tự hào.
- source_word: ὑπομονῆς
  choice: lòng kiên trì
  rationale: Diễn đạt sự bền bỉ chịu đựng dưới áp lực, phù hợp với bối cảnh bị bắt bớ đang tiếp diễn.
- source_word: πίστεως
  choice: đức tin
  rationale: Giữ nghĩa thông dụng của πίστις, trong khi chú thích bảo lưu khả năng từ này nói đến lòng trung tín trong hoàn cảnh chịu khổ.
- source_word: διωγμοῖς
  choice: các cuộc bắt bớ
  rationale: Chỉ sự chống đối và đàn áp có chủ ý; “bắt bớ” là cách diễn đạt quen thuộc, rõ nghĩa trong văn cảnh Tân Ước.
- source_word: θλίψεσιν
  choice: hoạn nạn
  rationale: Chỉ những áp lực và khốn khó rộng hơn sự bắt bớ; từ này trang trọng nhưng vẫn dễ hiểu và giữ được sức nặng của nguyên ngữ.
- source_word: αἷς ἀνέχεσθε
  choice: mà anh chị em đang chịu đựng
  rationale: Thì hiện tại của động từ cho thấy hoàn cảnh vẫn đang tiếp diễn; “chịu đựng” truyền đạt trực tiếp ý nghĩa của ἀνέχομαι.
theological_decisions:
- issue: Nghĩa của πίστις trong bối cảnh chịu bắt bớ
  choice: đức tin
  alternative: lòng trung tín
  rationale: πίστις có thể nói đến niềm tin hoặc sự trung tín bền vững. Văn cảnh chịu khổ khiến cả hai sắc thái đều khả dĩ, nên bản văn chính dùng “đức tin” và chú thích giữ lại nghĩa thay thế thay vì giải quyết dứt khoát sự mơ hồ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh chị em” để chỉ cộng đồng tín hữu; “tự hào” tránh sắc thái tiêu cực quá mạnh của “khoe khoang” nhưng vẫn giữ sức mạnh tu từ. Câu được cấu tạo như phần tiếp nối của câu trước, đúng chức năng của ὥστε.
