  source_fidelity: 'Bản dịch chuyển tải đúng các thành tố chính: ἔνδειγμα là “bằng chứng,” δικαίας κρίσεως là “sự phán xét công chính,” và καταξιωθῆναι được diễn đạt bị động là “được kể là xứng đáng,” không hàm ý sự chịu khổ tự tạo công trạng. Tuy nhiên, “vương quốc mà ... chịu khổ vì nó” làm quan hệ của ὑπὲρ ἧς trở nên nặng và đại từ “nó” kém phù hợp với văn phong Kinh Thánh hiện đại. Chuyển thành “vì vương quốc ấy mà...” giữ chính xác sắc thái “vì cớ/vì lợi ích của.”'
  naturalness: Cần chỉnh nhẹ để câu Việt tự nhiên và mạch lạc hơn. “Bằng chứng cho” phù hợp hơn “bằng chứng về” trong quan hệ bằng chứng xác nhận một sự phán xét; việc lặp lại “vương quốc ấy” thay cho “nó” rõ nghĩa và trang trọng hơn.
  terminology: “Đức Chúa Trời,” “sự phán xét công chính,” “được kể là xứng đáng,” và “vương quốc của Đức Chúa Trời” nhất quán, chính xác và phù hợp đăng ký trang trọng. Giữ “anh chị em” là cách xưng hô số nhiều bao quát, tự nhiên trong tiếng Việt hiện đại.
