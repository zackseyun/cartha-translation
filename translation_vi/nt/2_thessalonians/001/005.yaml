- from: Đó là bằng chứng về sự phán xét công chính của Đức Chúa Trời[a], để anh chị em được kể là xứng đáng với vương quốc của Đức Chúa Trời[b]—vương quốc mà anh chị em cũng đang chịu khổ vì nó[c].
  to: Đó là bằng chứng cho sự phán xét công chính của Đức Chúa Trời[a], để anh chị em được kể là xứng đáng với vương quốc của Đức Chúa Trời[b]; vì vương quốc ấy mà anh chị em cũng đang chịu khổ[c].
  rationale: Bản sửa chỉ cải thiện tính tự nhiên và sự rõ ràng của tiếng Việt. Cấu trúc cuối câu được sắp lại để diễn đạt trực tiếp ὑπὲρ ἧς, đồng thời tránh đại từ “nó” và sự lặp cấu trúc quan hệ nặng nề. Dấu chấm phẩy liên kết mệnh đề chịu khổ với vương quốc vừa nêu mà vẫn giữ lực nhấn của nguyên văn. Chú thích c được điều chỉnh để “on behalf of” có cách diễn đạt Việt ngữ tự nhiên hơn.
