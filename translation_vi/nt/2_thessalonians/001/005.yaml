id: 2TH.1.5
reference: 2 Thessalonians 1:5
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἔνδειγμα τῆς δικαίας κρίσεως τοῦ θεοῦ, εἰς τὸ καταξιωθῆναι ὑμᾶς τῆς βασιλείας τοῦ θεοῦ, ὑπὲρ ἧς καὶ πάσχετε,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/001/005.yaml
  text: This is evidence of the righteous judgment of God[a], so that you may be counted worthy of the kingdom of God, for which you are also suffering[c][b],
translation:
  language: vi
  text: Đó là bằng chứng cho sự phán xét công chính của Đức Chúa Trời[a], để anh chị em được kể là xứng đáng với vương quốc của Đức Chúa Trời[b]; vì vương quốc ấy mà anh chị em cũng đang chịu khổ[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “dấu chứng”, “dấu hiệu” hoặc “bằng cớ” cho sự phán xét công chính của Đức Chúa Trời.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “để anh chị em được xem là xứng đáng” hoặc “với kết quả là anh chị em được kể là xứng đáng”. Cấu trúc Hy Lạp có thể diễn tả mục đích hoặc kết quả.'
    reason: alternative_reading
  - marker: c
    text: 'Cũng có thể dịch: “vì cớ vương quốc ấy” hoặc “vì lợi ích của vương quốc ấy”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔνδειγμα
  choice: bằng chứng
  rationale: Từ này chỉ điều chứng tỏ hoặc cho thấy một thực tại. “Bằng chứng” tự nhiên trong tiếng Việt và giữ được sức suy luận mà không nhất thiết hàm ý một chứng minh tuyệt đối. “Đó là” được bổ sung vì câu Hy Lạp là một mảnh câu không có động từ, phụ thuộc vào câu trước.
- source_word: δικαίας κρίσεως
  choice: sự phán xét công chính
  rationale: Cách dịch này giữ cả hành động phán xét lẫn phẩm chất công chính của sự phán xét đến từ Đức Chúa Trời.
- source_word: εἰς τὸ καταξιωθῆναι
  choice: để anh chị em được kể là xứng đáng
  rationale: Cấu trúc giới từ đi với động từ nguyên mẫu có mạo từ có thể diễn tả mục đích hoặc kết quả. Thể bị động của καταξιόω có nghĩa là được kể hoặc được xem là xứng đáng, chứ không nhất thiết là được làm cho trở nên xứng đáng về bản chất.
- source_word: βασιλείας τοῦ θεοῦ
  choice: vương quốc của Đức Chúa Trời
  rationale: Đây là cách diễn đạt minh bạch, quen thuộc, giữ nguyên cấu trúc sở hữu và sức nặng thần học của cụm từ.
- source_word: ὑπὲρ ἧς
  choice: vì nó
  rationale: ὑπέρ với sở hữu cách có thể mang nghĩa “vì”, “vì cớ” hoặc “thay mặt cho”. Đại từ “nó” quy chiếu rõ về vương quốc vừa được nhắc đến; chú thích giữ lại sắc thái rộng hơn.
- source_word: καὶ πάσχετε
  choice: cũng đang chịu khổ
  rationale: “Đang chịu khổ” thể hiện hành động tiếp diễn trong bối cảnh bị bắt bớ, còn “cũng” chuyển tải καί và nối với những hoạn nạn đã nói ở câu trước.
theological_decisions:
- issue: Mối liên hệ giữa sự chịu khổ và việc được kể là xứng đáng với vương quốc
  choice: Câu văn nói sự chịu khổ của họ là bằng chứng trong khuôn khổ sự phán xét công chính của Đức Chúa Trời, gắn với mục đích hoặc kết quả là họ được kể là xứng đáng với vương quốc.
  alternative: Sự chịu khổ tự nó kiếm được hoặc tạo nên tư cách xứng đáng để vào vương quốc.
  rationale: Thể bị động καταξιωθῆναι có nghĩa là “được kể/xem là xứng đáng”. Bản dịch không biến sự chịu khổ thành công trạng, nhưng cũng không làm suy yếu mối liên hệ chặt chẽ mà câu Hy Lạp đặt giữa sự chịu khổ, sự phán xét công chính của Đức Chúa Trời và việc được kể là xứng đáng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Anh chị em” diễn đạt số nhiều trực tiếp của ὑμᾶς một cách bao quát. Dấu gạch ngang làm rõ tiền ngữ của đại từ quan hệ mà không tháo rời cấu trúc câu.
