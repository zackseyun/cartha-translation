reference: 2 Thessalonians 1:2
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: χάρις ὑμῖν καὶ εἰρήνη ἀπὸ θεοῦ ⸀πατρὸς καὶ κυρίου Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/001/002.yaml
  text: Grace to you and peace from God our Father and the Lord Jesus the Messiah[a].
translation:
  language: vi
  text: Nguyện ân điển và bình an đến với anh chị em từ Đức Chúa Trời là Cha và từ Chúa Giê-su, Đấng Mê-si-a[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “Đấng Ki-tô.” Tước hiệu Hy Lạp Χριστός có thể được dịch là “Đấng Ki-tô” hoặc “Đấng Mê-si-a”; ở đây, “Đấng Mê-si-a” làm rõ ý nghĩa tước hiệu.
    reason: alternative_reading
lexical_decisions:
- source_word: χάρις
  choice: ân điển
  rationale: “Ân điển” vừa phù hợp với công thức chào thăm của Phao-lô, vừa giữ được chiều sâu thần học của từ χάρις; “ân huệ” tuy dễ hiểu hơn nhưng kém quen thuộc trong ngữ cảnh này.
- source_word: ὑμῖν
  choice: đến với anh chị em
  rationale: Dạng tặng cách chỉ những người nhận lời chúc phước. Cách diễn đạt này tự nhiên trong tiếng Việt và bao gồm cả nam lẫn nữ trong cộng đồng.
- source_word: εἰρήνη
  choice: bình an
  rationale: “Bình an” là cách dịch tự nhiên, giữ được ý nghĩa về hòa bình, sự an ổn và phúc lành toàn diện.
- source_word: ἀπὸ
  choice: từ
  rationale: Giới từ này chỉ nguồn của ân điển và bình an. Lặp lại “từ” trước “Chúa Giê-su” giúp câu tiếng Việt rõ ràng mà không làm thay đổi quan hệ ngữ pháp.
- source_word: θεοῦ πατρὸς
  choice: Đức Chúa Trời là Cha
  rationale: Bản Hy Lạp được cung cấp không có đại từ ἡμῶν (“chúng ta”), nên bản dịch không tự ý thêm “Cha chúng ta.” Cấu trúc “là Cha” diễn đạt tự nhiên quan hệ đồng vị/tước hiệu trong tiếng Việt.
- source_word: κυρίου
  choice: Chúa
  rationale: Giữ nguyên lực tước hiệu của κύριος và phù hợp với cách dùng Tân Ước đã quen thuộc trong tiếng Việt.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Chúa Giê-su, Đấng Mê-si
  rationale: “Đấng Mê-si” chuyển tải ý nghĩa tước hiệu của Χριστός thay vì chỉ phiên âm; dấu phẩy giúp người đọc nhận ra đây là tước hiệu của Chúa Giê-su.
theological_decisions:
- issue: Có nên thêm “chúng ta” sau “Cha” hay không
  choice: Đức Chúa Trời là Cha
  alternative: Đức Chúa Trời, Cha chúng ta
  rationale: SBLGNT trong dữ liệu được cung cấp không có ἡμῶν. Dù “Cha chúng ta” phù hợp với công thức quen thuộc của Phao-lô và bản tiếng Anh tham khảo, không thêm đại từ sẽ bám sát chứng cứ văn bản hơn mà câu tiếng Việt vẫn tự nhiên.
- issue: Cách dịch Χριστός
  choice: Đấng Mê-si
  alternative: Đấng Ki-tô
  rationale: Χριστός mang nghĩa tước hiệu “Đấng được xức dầu.” “Đấng Mê-si” giữ rõ chức năng tước hiệu; chú thích cung cấp cách gọi truyền thống khác mà không áp đặt một cách đọc giáo phái.
- issue: Quan hệ giữa Đức Chúa Trời là Cha và Chúa Giê-su
  choice: Dùng chung tư cách nguồn của ân điển và bình an, với “từ” được lặp lại cho rõ câu
  alternative: Chỉ dùng một lần “từ” trước cả hai danh xưng
  rationale: Trong tiếng Hy Lạp, ἀπό chi phối cả hai thành phần được nối bằng καί. Việc lặp giới từ trong tiếng Việt chỉ làm sáng cấu trúc, không tách hai nguồn hay thêm một khẳng định thần học mới.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại. Dùng “anh chị em” để diễn đạt số nhiều ὑμῖν một cách bao hàm và tự nhiên. Thêm “Nguyện” để thể hiện chức năng chúc phước của câu Hy Lạp không có động từ; đây là sự minh thị hóa theo ngữ dụng, không phải thêm nội dung mệnh đề.
