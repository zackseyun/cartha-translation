revisions:
- from: Nguyện ân điển và bình an đến với anh chị em từ Đức Chúa Trời là Cha và từ Chúa Giê-su, Đấng Mê-si[a].
  to: Nguyện ân điển và bình an đến với anh chị em từ Đức Chúa Trời là Cha và từ Chúa Giê-su, Đấng Mê-si-a[a].
  rationale: Chỉ điều chỉnh cách phiên âm tước hiệu từ “Mê-si” thành “Mê-si-a” trong bản văn và chú thích để tăng tính tự nhiên, dễ nhận biết trong tiếng Việt hiện đại. Các lựa chọn còn lại giữ nguyên vì bám sát văn bản Hy Lạp được cung cấp, kể cả việc không bổ sung “chúng ta” sau “Cha”.
  reviewer_model: gpt-5.6-terra
