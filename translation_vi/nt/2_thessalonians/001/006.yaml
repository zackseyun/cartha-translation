  text: since it is just before God to repay affliction to those who afflict you[a]
translation:
  language: vi
  text: vì quả thật, Đức Chúa Trời công bằng khi lấy hoạn nạn báo trả cho những kẻ gây hoạn nạn cho anh chị em[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “nếu quả thật, Đức Chúa Trời công chính khi lấy hoạn nạn báo trả cho những kẻ gây hoạn nạn cho anh chị em.”'
    reason: Giữ lại sắc thái điều kiện có thể có của εἴπερ, cùng phương án “công chính” cho δίκαιον.
lexical_decisions:
- source_word: εἴπερ
  choice: vì quả thật
  rationale: Trong ngữ cảnh này, từ này nêu một tiền đề mà Phao-lô xem là đúng để tăng sức nặng lập luận. “Vì quả thật” diễn đạt điều ấy tự nhiên, đồng thời chú thích giữ lại sắc thái điều kiện có thể có.
- source_word: δίκαιον
  choice: công bằng
  rationale: Tính từ nói đến điều phù hợp với công lý trong sự phán xét của Đức Chúa Trời; “công bằng” tự nhiên trong tiếng Việt hiện đại và hợp với ngữ cảnh báo trả.
- source_word: παρὰ θεῷ
  choice: trước mặt Đức Chúa Trời
  rationale: Cụm từ diễn tả sự đánh giá trong tương quan với Đức Chúa Trời, tức là điều công bằng theo sự phán xét của Ngài, mà không thêm một cách giải thích giáo lý hẹp hơn.
- source_word: ἀνταποδοῦναι
  choice: báo trả
  rationale: “Báo trả” truyền đạt hành động đáp lại tương xứng trong bối cảnh công lý, trang trọng nhưng vẫn dễ hiểu.
- source_word: τοῖς θλίβουσιν ὑμᾶς
  choice: những kẻ gây hoạn nạn cho anh chị em
  rationale: Cách dịch này diễn tả việc gây áp lực và đau khổ, đồng thời duy trì mối liên hệ từ vựng với θλῖψιν trong cùng câu.
- source_word: θλῖψιν
  choice: hoạn nạn
  rationale: “Hoạn nạn” diễn đạt sự khốn khó nghiêm trọng và cho phép giữ phép lặp có chủ ý với động từ θλίβουσιν.
theological_decisions:
- issue: Bản chất và thời điểm của sự báo trả từ Đức Chúa Trời
  choice: Câu này khẳng định việc báo trả những kẻ gây hoạn nạn là công bằng trước mặt Đức Chúa Trời, nhưng không xác định đầy đủ thời điểm hay phương thức của sự báo trả ấy.
  alternative: Hiểu sự báo trả chỉ thuộc thời kỳ cuối cùng, hoặc bao gồm cả các sự phán xét trong lịch sử hiện tại lẫn sự phán xét cuối cùng.
  rationale: Mệnh đề Hy Lạp khẳng định tính công bằng của sự báo trả nhưng tự nó không giải quyết trọn vẹn thời điểm và cách thức; bản dịch vì thế giữ lời khẳng định ở mức khái quát.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh chị em” cho đại từ số nhiều ὑμᾶς; giữ phép lặp “gây hoạn nạn/hoạn nạn” để phản ánh liên hệ θλίβουσιν/θλῖψιν trong nguyên văn.
