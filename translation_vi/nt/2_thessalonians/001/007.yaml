  source_fidelity: 'Bản dịch phản ánh đúng các thành phần chính: người đang chịu hoạn nạn, sự giải tỏa cùng với Phao-lô và các cộng sự, thời điểm Chúa Giê-su được mặc khải từ trời, và các thiên sứ gắn với quyền năng của Ngài. Tuy nhiên, cần chuẩn hóa tên riêng và làm rõ hơn cách diễn đạt của cụm cuối mà vẫn giữ tính mơ hồ của sở hữu cách Hy Lạp.'
  naturalness: Câu có thể tự nhiên hơn trong tiếng Việt hiện đại khi dùng “được giải thoát khỏi cảnh khốn khổ” thì quá mạnh; vì vậy giữ ý “sự nhẹ nhõm”/“được nhẹ nhõm” là thích hợp. “Chịu hoạn nạn” là lối dùng Kinh Thánh hiện đại tự nhiên và sát θλιβομένοις hơn “chịu khốn khổ”.
  terminology: Nên dùng chính tả hiện đại phổ biến “Giê-su”. “Thiên sứ quyền năng của Ngài” là một cách hiểu thành ngữ hợp lý của ἀγγέλων δυνάμεως αὐτοῦ; chú thích cần nêu sát hơn cấu trúc “các thiên sứ của quyền năng Ngài” và dùng đầy đủ giới từ sở hữu trong tiếng Việt.
