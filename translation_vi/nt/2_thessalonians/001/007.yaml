  to: Và cho anh chị em là những người đang chịu hoạn nạn được nhẹ nhõm cùng với chúng tôi, khi Chúa Giê-su từ trời được mặc khải cùng các thiên sứ quyền năng của Ngài.[a]
  rationale: Chỉnh chính tả tên riêng theo tiếng Việt hiện đại, thay “khốn khổ” bằng “hoạn nạn” để phản ánh chính xác hơn θλιβομένοις, và sửa chú thích cho tự nhiên, rõ nghĩa. Giữ “được nhẹ nhõm”, giá trị thời gian của “khi”, và cách dịch thành ngữ ở cụm các thiên sứ, vì các lựa chọn này phù hợp nguồn Hy Lạp và văn phong trang trọng hiện đại.
