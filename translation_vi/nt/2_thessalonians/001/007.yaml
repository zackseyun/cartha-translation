id: 2TH.1.7
reference: 2 Thessalonians 1:7
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ὑμῖν τοῖς θλιβομένοις ἄνεσιν μεθ’ ἡμῶν ἐν τῇ ἀποκαλύψει τοῦ κυρίου Ἰησοῦ ἀπ’ οὐρανοῦ μετ’ ἀγγέλων δυνάμεως αὐτοῦ
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/001/007.yaml
  text: and to you who are being afflicted[a], relief with us at the revelation of the Lord Jesus from heaven with his mighty angels.
translation:
  language: vi
  text: Và cho anh chị em là những người đang chịu hoạn nạn được nhẹ nhõm cùng với chúng tôi, khi Chúa Giê-su từ trời được mặc khải cùng các thiên sứ quyền năng của Ngài.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sát cấu trúc hơn: “cùng các thiên sứ của quyền năng của Ngài”; cũng có thể hiểu là “cùng các thiên sứ đầy quyền năng của Ngài.”'
    reason: Cụm sở hữu trong tiếng Hy Lạp có thể diễn tả các thiên sứ thuộc về/đi kèm quyền năng của Chúa, hoặc có tính chất quyền năng. Chú thích bảo tồn khả năng thứ nhất mà không áp đặt một cách hiểu duy nhất.
lexical_decisions:
- source_word: τοῖς θλιβομένοις
  choice: những người đang chịu khốn khổ
  rationale: Phân từ hiện tại bị động chỉ những người hiện đang phải chịu cảnh áp bức, đau khổ; cách dịch này giữ ý đang tiếp diễn và sắc thái bị tác động.
- source_word: ἄνεσιν
  choice: được nhẹ nhõm
  rationale: Danh từ chỉ sự giảm bớt hoặc thoát khỏi sức ép, đối lập trực tiếp với cảnh khốn khổ. Cấu trúc động từ trong tiếng Việt tự nhiên hơn nhưng vẫn giữ nghĩa được ban sự giải tỏa.
- source_word: μεθ’ ἡμῶν
  choice: cùng với chúng tôi
  rationale: 'Giữ quan hệ đồng hưởng: các tín hữu sẽ nhận sự nhẹ nhõm cùng Phao-lô và các cộng sự.'
- source_word: ἐν τῇ ἀποκαλύψει
  choice: khi ... được mặc khải
  rationale: ἐν mang nghĩa thời gian trong cụm chỉ biến cố; dùng mệnh đề thời gian tự nhiên trong tiếng Việt, đồng thời động từ “được mặc khải” giữ nội dung của danh từ ἀποκάλυψις.
- source_word: τοῦ κυρίου Ἰησοῦ
  choice: Chúa Jêsus
  rationale: Giữ κύριος như tước hiệu “Chúa” theo cách dùng Tân Ước quen thuộc.
- source_word: ἀπ’ οὐρανοῦ
  choice: từ trời
  rationale: ἀπό chỉ nguồn hoặc nơi xuất phát; “từ trời” ngắn gọn và tự nhiên trong ngữ cảnh cánh chung.
- source_word: μετ’ ἀγγέλων δυνάμεως αὐτοῦ
  choice: cùng các thiên sứ quyền năng của Ngài
  rationale: Cách diễn đạt tự nhiên hiểu cụm sở hữu nén chặt theo nghĩa phẩm chất, tức các thiên sứ đầy quyền năng; chú thích giữ cách hiểu sát cấu trúc hơn.
theological_decisions:
- issue: Sắc thái của cụm sở hữu ἀγγέλων δυνάμεως αὐτοῦ
  choice: cùng các thiên sứ quyền năng của Ngài
  alternative: cùng các thiên sứ của quyền năng Ngài
  rationale: Cụm Hy Lạp có thể mô tả các thiên sứ là quyền năng hoặc liên kết họ với quyền năng của Chúa. Bản chính ưu tiên tiếng Việt rõ và tự nhiên, còn chú thích bảo tồn cấu trúc và khả năng hiểu khác.
- issue: Giá trị thời gian của ἐν τῇ ἀποκαλύψει
  choice: khi Chúa Jêsus ... được mặc khải
  alternative: trong sự mặc khải của Chúa Jêsus
  rationale: Câu gắn sự nhẹ nhõm với biến cố Chúa Jêsus được bày tỏ. Mệnh đề “khi” diễn đạt rõ chức năng thời gian mà không đổi biến cố mặc khải thành một ý niệm mơ hồ.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại. Dùng “anh chị em” để diễn đạt số nhiều ὑμῖν theo lối bao hàm và dễ hiểu; dùng “được nhẹ nhõm” thay cho danh hóa nặng nề. Trật tự “từ trời được mặc khải” giữ sự gắn kết của ἀπ’ οὐρανοῦ với biến cố Chúa Jêsus được bày tỏ.
