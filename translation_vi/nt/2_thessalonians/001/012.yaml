id: 2TH.1.12
reference: 2 Thessalonians 1:12
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὅπως ἐνδοξασθῇ τὸ ὄνομα τοῦ κυρίου ἡμῶν Ἰησοῦ ἐν ὑμῖν, καὶ ὑμεῖς ἐν αὐτῷ, κατὰ τὴν χάριν τοῦ θεοῦ ἡμῶν καὶ κυρίου Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/001/012.yaml
  text: so that the name of our Lord Jesus may be glorified in you[a], and you in him[c][b], according to the grace of our God and the Lord Jesus the Messiah.
translation:
  language: vi
  text: để danh Chúa Jêsus của chúng ta được tôn vinh nơi anh chị em[a], và anh chị em cũng được tôn vinh trong Ngài, theo ân điển của Đức Chúa Trời chúng ta và Chúa Jêsus, Đấng Mê-si[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “giữa anh chị em.” Giới từ Hy Lạp có thể mang cả sắc thái “trong/nơi” lẫn “giữa” trong ngữ cảnh này.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch tước hiệu Hy Lạp Χριστός là “Đấng Christ.” Cụm cuối câu có thể được hiểu là liên kết chặt “Đức Chúa Trời chúng ta” với “Chúa Jêsus, Đấng Mê-si,” hoặc là nói riêng về “Đức Chúa Trời chúng ta” và “Chúa Jêsus, Đấng Mê-si.” Bản dịch giữ cách diễn đạt cô đọng của tiếng Hy Lạp mà không quyết định thay cho người đọc.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅπως
  choice: để
  rationale: Diễn đạt tự nhiên mục đích hoặc kết quả của lời cầu nguyện ở câu trước.
- source_word: ἐνδοξασθῇ
  choice: được tôn vinh
  rationale: Giữ thể bị động và sắc thái thần học của nhóm từ chỉ vinh quang, đồng thời tự nhiên trong tiếng Việt.
- source_word: τὸ ὄνομα
  choice: danh
  rationale: Giữ hình ảnh nguyên văn; trong ngữ cảnh Kinh Thánh, “danh” có thể đại diện cho căn tính được bày tỏ và danh tiếng của một người.
- source_word: τοῦ κυρίου ἡμῶν Ἰησοῦ
  choice: của Chúa chúng ta là Đức Chúa Jêsus
  rationale: Chuyển trật tự Hy Lạp sang cấu trúc tiếng Việt rõ ràng, vẫn giữ tước hiệu κύριος và ý sở hữu.
- source_word: ἐν ὑμῖν
  choice: nơi anh chị em
  rationale: “Nơi” bảo lưu được độ mở giữa ý “trong chính anh chị em” và “giữa cộng đồng anh chị em”; phương án còn lại được ghi chú.
- source_word: καὶ ὑμεῖς ἐν αὐτῷ
  choice: và anh chị em cũng được tôn vinh trong Ngài
  rationale: Động từ “được tôn vinh” được bổ sung theo phép tỉnh lược trong cấu trúc song song. αὐτῷ được hiểu tự nhiên nhất là chỉ Đức Chúa Jêsus.
- source_word: κατὰ τὴν χάριν
  choice: theo ân điển
  rationale: Giữ quan hệ chuẩn mực hoặc nền tảng của κατά mà không thu hẹp thành công cụ đơn thuần.
- source_word: χάριν
  choice: ân điển
  rationale: Là cách dịch trang trọng, quen thuộc và phù hợp với χάρις trong văn chương Phao-lô.
- source_word: τοῦ θεοῦ ἡμῶν καὶ κυρίου Ἰησοῦ Χριστοῦ
  choice: của Đức Chúa Trời chúng ta và Chúa là Đức Chúa Jêsus, Đấng Mê-si
  rationale: Giữ liên từ và cấu trúc gọn của tiếng Hy Lạp, không thêm từ để buộc phải chọn giữa một hay hai đối tượng quy chiếu; Χριστός được chuyển theo nghĩa tước hiệu.
theological_decisions:
- issue: Cách dịch Χριστοῦ
  choice: Đấng Mê-si
  alternative: Đấng Christ
  rationale: Tại đây Χριστός hoạt động như một tước hiệu của Đức Chúa Jêsus; “Đấng Mê-si” truyền đạt nghĩa của tước hiệu trong tiếng Việt hiện đại.
- issue: Đối tượng mà αὐτῷ quy chiếu
  choice: Ngài, tức Đức Chúa Jêsus
  alternative: danh ấy
  rationale: Dạng giống đực của đại từ và cấu trúc tôn vinh hỗ tương ủng hộ việc quy chiếu về Đức Chúa Jêsus, dù khả năng liên hệ với “danh” không hoàn toàn bất khả về mặt cú pháp.
- issue: Ý nghĩa của cụm sở hữu cách cuối câu
  choice: 'Giữ cấu trúc liên kết chặt: “Đức Chúa Trời chúng ta và Chúa là Đức Chúa Jêsus, Đấng Mê-si”'
  alternative: 'Hiểu là hai đối tượng riêng: “Đức Chúa Trời chúng ta” và “Chúa là Đức Chúa Jêsus, Đấng Mê-si”'
  rationale: Cấu trúc chỉ có một mạo từ trước θεοῦ và nối với κυρίου bằng καί tạo liên kết cú pháp chặt, nhưng cách quy chiếu vẫn được tranh luận. Bản dịch tránh thêm dấu hiệu giải nghĩa quyết định vấn đề.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh chị em” cho đại từ số nhiều chỉ cộng đồng tín hữu; dùng “Đức Chúa Jêsus,” “Đức Chúa Trời,” “ân điển” và “Đấng Mê-si” theo văn phong Kinh Thánh Việt ngữ. Đại từ “Ngài” viết hoa theo quy ước tôn kính, không nhằm giải quyết thêm vấn đề thần học.
