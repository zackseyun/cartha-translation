  terminology: Giữ “ân điển,” “Đức Chúa Trời,” “Chúa,” và “Đấng Mê-si.” Không dùng “Đức Chúa Jêsus,” vì cách này dễ làm lu mờ sự phân biệt từ vựng giữa θεός và κύριος trong câu. Chú thích tiếp tục nêu phương án “Đấng Christ” và không ép cách hiểu về cụm cuối.
