  source_fidelity: 'Bản nháp truyền đạt đúng cấu trúc chính: cụm giới từ chỉ bối cảnh lửa, phân từ chỉ việc thi hành sự báo trả, và hai nhóm người nhận phán xét. Tuy nhiên, “giữa” mạnh hơn ἐν (“trong”) và dễ gợi vị trí ‘ở giữa’ thay vì bối cảnh/phương diện đi kèm sự mặc khải ở câu trước. Cụm danh xưng cuối câu nên được sắp xếp lại để phản ánh rõ ràng hơn “Chúa Giê-su của chúng ta” mà không thêm sắc thái giải thích không cần thiết.'
