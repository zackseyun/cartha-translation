  yaml_path: translation/nt/2_thessalonians/001/008.yaml
  text: in flaming fire[a], inflicting vengeance on those who do not know God and on those who do not obey the gospel of our Lord Jesus[b],
translation:
  language: vi
  text: trong ngọn lửa rực cháy[a], thi hành sự báo trả[b] trên những người không nhận biết Đức Chúa Trời và những người không vâng theo Tin Lành của Chúa Giê-su chúng ta,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “trong lửa cháy rực.”'
    reason: lexical_alternative
  - marker: b
    text: 'Hay: “giáng sự trừng phạt.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν φλογὶ πυρός
  choice: giữa ngọn lửa cháy rực
  rationale: Diễn đạt tự nhiên hình ảnh mạnh của cụm Hy Lạp theo nghĩa đen là “trong ngọn lửa của lửa”; “giữa” phù hợp với ngữ cảnh Chúa hiện ra trong lửa ở câu trước mà không làm suy yếu hình ảnh.
- source_word: διδόντος ἐκδίκησιν
  choice: thi hành sự báo trả
  rationale: διδόντος theo nghĩa đen là “ban/trao”, nhưng khi đi với ἐκδίκησιν tạo thành thành ngữ chỉ việc thực thi sự báo trả mang tính xét xử. Cách dịch này giữ được sức nặng của nguyên văn mà không biến nó thành cảm xúc trả thù cá nhân.
- source_word: τοῖς μὴ εἰδόσι θεὸν
  choice: trên những người không nhận biết Đức Chúa Trời
  rationale: οἶδα ở đây có nghĩa hiện tại là “biết, nhận biết”; “nhận biết” là tự nhiên trong văn cảnh nói về mối liên hệ với Đức Chúa Trời.
- source_word: τοῖς μὴ ὑπακούουσιν
  choice: những người không vâng theo
  rationale: Giữ nghĩa trực tiếp của ὑπακούω là nghe theo hoặc vâng phục, không thêm ý “cố tình từ chối” vốn không được hình thái động từ nói rõ.
- source_word: τῷ εὐαγγελίῳ
  choice: Tin Lành
  rationale: Đây là thuật ngữ quen thuộc, dễ hiểu trong tiếng Việt cho εὐαγγέλιον và giữ được tính nhất quán trong văn chương Phao-lô.
- source_word: τοῦ κυρίου ἡμῶν Ἰησοῦ
  choice: của Chúa chúng ta là Giê-su
  rationale: Giữ tước hiệu κύριος và quan hệ sở hữu của cụm thuộc cách, đồng thời dùng trật tự tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Tính chất của ἐκδίκησις trong sự phán xét của Đức Chúa Trời
  choice: sự báo trả
  alternative: sự trừng phạt; sự báo thù
  rationale: “Sự báo trả” giữ được ý nghĩa nghiêm khắc của hành động đáp trả theo công lý, đồng thời tránh hàm ý nóng giận hoặc tư thù mà “báo thù” thường gợi ra trong tiếng Việt. Chú thích bảo lưu cách hiểu mang tính hình phạt.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại, dùng cấu trúc dễ hiểu. Dấu phẩy cuối câu được giữ vì câu 8 tiếp nối và chưa hoàn tất ý xét về cú pháp trong phân đoạn. Các dấu chú thích [a], [b] đều được đặt ngay sau cụm từ liên quan.
