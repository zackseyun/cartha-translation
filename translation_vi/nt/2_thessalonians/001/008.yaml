  terminology: “Đức Chúa Trời,” “Tin Lành,” “Chúa,” và “Giê-su” được dùng nhất quán theo đăng ký Kinh Thánh hiện đại của bản nháp. “Sự báo trả” bảo lưu lực pháp lý-nghiêm khắc của ἐκδίκησις mà không diễn giải thành động cơ tư thù.
