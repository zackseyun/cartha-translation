id: 2TH.1.3
reference: 2 Thessalonians 1:3
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Εὐχαριστεῖν ὀφείλομεν τῷ θεῷ πάντοτε περὶ ὑμῶν, ἀδελφοί, καθὼς ἄξιόν ἐστιν, ὅτι ὑπεραυξάνει ἡ πίστις ὑμῶν καὶ πλεονάζει ἡ ἀγάπη ἑνὸς ἑκάστου πάντων ὑμῶν εἰς ἀλλήλους,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/001/003.yaml
  text: We ought always to give thanks to God for you[a], brothers, as is fitting, because your faith is growing abundantly and the love of each and every one of you for one another is increasing[c][b],
translation:
  language: vi
  text: Thưa anh chị em[a], chúng tôi phải luôn cảm tạ Đức Chúa Trời vì anh chị em; như thế là phải lẽ, vì đức tin[b] của anh chị em đang tăng trưởng vượt bậc, và tình yêu thương mà từng người trong tất cả anh chị em dành cho nhau ngày càng gia tăng.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn là “anh em”; trong lời gọi này, từ Hy Lạp có thể bao gồm cả nam lẫn nữ trong cộng đồng tín hữu.
    reason: lexical_alternative
  - marker: b
    text: Từ Hy Lạp cũng có thể mang nghĩa “lòng tin” hoặc “sự trung tín”; ở đây dịch là “đức tin”.
    reason: alternative_reading
lexical_decisions:
- source_word: Εὐχαριστεῖν ὀφείλομεν
  choice: chúng tôi phải ... cảm tạ
  rationale: Kết hợp động từ nguyên mẫu với ὀφείλομεν để diễn đạt bổn phận thích đáng; “phải” tự nhiên trong tiếng Việt và không nhất thiết hàm ý cưỡng ép tuyệt đối.
- source_word: πάντοτε περὶ ὑμῶν
  choice: luôn ... về anh chị em
  rationale: “Luôn” giữ ý thời gian của πάντοτε; trong công thức cảm tạ, “cảm tạ ... về anh chị em” chuyển tải đối tượng/lý do được nhắc đến mà không biến người nhận thành đối tượng trực tiếp của lời cảm tạ.
- source_word: ἀδελφοί
  choice: anh chị em
  rationale: Trong lời gọi cộng đồng tín hữu, số nhiều giống đực ἀδελφοί có thể bao gồm cả nam lẫn nữ; “anh chị em” là cách xưng hô tự nhiên, trang trọng và chính xác về phạm vi dụng học trong tiếng Việt.
- source_word: καθὼς ἄξιόν ἐστιν
  choice: làm như vậy là phải lẽ
  rationale: Diễn đạt sự thích đáng về đạo lý, đồng thời nối rõ với việc cảm tạ; tránh sắc thái khó hiểu của cách dịch quá sát là “xứng đáng”.
- source_word: ὑπεραυξάνει ἡ πίστις ὑμῶν
  choice: đức tin của anh chị em đang tăng trưởng vượt bậc
  rationale: “Đức tin” là nghĩa phù hợp nhất của πίστις trong văn cảnh; “tăng trưởng vượt bậc” giữ sắc thái tăng cường của động từ ghép ὑπεραυξάνει.
- source_word: πλεονάζει ἡ ἀγάπη
  choice: tình yêu thương ... ngày càng gia tăng
  rationale: “Tình yêu thương” là cách diễn đạt tự nhiên trong văn phong Kinh Thánh hiện đại; “ngày càng gia tăng” thể hiện tiến trình hiện tại và ý tăng thêm của πλεονάζει.
- source_word: ἑνὸς ἑκάστου πάντων ὑμῶν εἰς ἀλλήλους
  choice: của mỗi người trong tất cả anh chị em dành cho nhau
  rationale: Giữ sức nhấn phân phối và tính bao quát của cụm Hy Lạp, đồng thời dùng cú pháp tiếng Việt dễ hiểu; “dành cho nhau” diễn đạt quan hệ tương hỗ của εἰς ἀλλήλους.
theological_decisions:
- issue: Phạm vi của ἀδελφοί trong lời gọi hội thánh
  choice: anh chị em
  alternative: anh em
  rationale: Dù hình thái Hy Lạp là giống đực số nhiều, trong ngữ cảnh lời gọi cả hội thánh từ này có thể chỉ toàn thể tín hữu. Tiếng Việt thường dùng “anh chị em” để biểu thị đúng phạm vi bao gồm ấy; chú thích vẫn nêu hình thức nguyên văn.
- issue: Nghĩa của πίστις
  choice: đức tin
  alternative: sự trung tín
  rationale: Văn cảnh nói về điều đang lớn lên nơi các tín hữu, và “đức tin” là cách hiểu tự nhiên nhất; tuy nhiên, trường nghĩa của πίστις có thể bao hàm lòng tin hoặc sự trung tín nên phương án đó được bảo lưu trong chú thích.
translation_notes:
  register: 'Văn phong hiện đại, trang trọng và dễ đọc. Câu giữ cấu trúc lập luận của nguyên văn: bổn phận cảm tạ, nhận định rằng điều ấy phải lẽ, rồi lý do gồm hai vế song song. Dùng “anh chị em” phù hợp lối xưng hô cộng đồng trong tiếng Việt, với chú thích về hình thức Hy Lạp.'
