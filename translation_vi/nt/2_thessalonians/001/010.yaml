  source_fidelity: 'Bản dịch chuyển tải đúng cấu trúc chính: biến cố tương lai khi Đấng Christ đến, hai nguyên mẫu thụ động song song (“được tôn vinh” / “được ... kinh ngạc”), nhóm các thánh đồ, mọi người đã tin, và lý do liên quan đến lời chứng của các sứ đồ. Tuy nhiên, “lời chứng của chúng tôi nói với anh chị em” không diễn đạt đúng quan hệ cú pháp: lời chứng không phải là chủ thể của hành động “nói.” Cần diễn đạt lời chứng được truyền/đưa đến cho độc giả mà không thêm nội dung đáng kể.'
