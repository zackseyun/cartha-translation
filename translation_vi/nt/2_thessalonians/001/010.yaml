reference: 2 Thessalonians 1:10
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὅταν ἔλθῃ ἐνδοξασθῆναι ἐν τοῖς ἁγίοις αὐτοῦ καὶ θαυμασθῆναι ἐν πᾶσιν τοῖς πιστεύσασιν, ὅτι ἐπιστεύθη τὸ μαρτύριον ἡμῶν ἐφ’ ὑμᾶς, ἐν τῇ ἡμέρᾳ ἐκείνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/001/010.yaml
  text: on that day when he comes to be glorified among his saints and to be marveled at among all who have believed[b][a], because our testimony to you was believed.
translation:
  language: vi
  text: vào ngày ấy, khi Ngài đến để được tôn vinh giữa các thánh đồ của Ngài[a] và được tất cả những người đã tin kinh ngạc thán phục, vì lời chứng của chúng tôi dành cho anh chị em đã được tin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “trong các thánh đồ của Ngài.” Giới từ Hy Lạp có thể cho biết Ngài được tôn vinh giữa dân thánh của Ngài, hoặc vinh quang Ngài được bày tỏ trong họ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν ἔλθῃ
  choice: khi Ngài đến
  rationale: ὅταν với động từ giả định bất định ἔλθῃ chỉ một biến cố xác định trong tương lai; cách dịch này tự nhiên và giữ nguyên định hướng tương lai.
- source_word: ἐνδοξασθῆναι
  choice: để được tôn vinh
  rationale: Động từ nguyên mẫu thụ động diễn tả mục đích hoặc kết quả của việc Ngài đến; “được tôn vinh” giữ được sắc thái vinh quang dành cho Đấng Christ.
- source_word: ἐν τοῖς ἁγίοις αὐτοῦ
  choice: giữa các thánh đồ của Ngài
  rationale: ἐν có thể mang nghĩa “giữa” hoặc “trong.” “Giữa” tự nhiên trong tiếng Việt và diễn tả bối cảnh cộng đồng, còn khả năng “trong” được ghi ở chú thích.
- source_word: θαυμασθῆναι
  choice: được ... chiêm ngưỡng với lòng kinh ngạc
  rationale: Cụm này diễn tả sự kinh ngạc pha lẫn thán phục hướng về Đấng Christ, mạnh hơn nghĩa đơn thuần “được ngưỡng mộ.”
- source_word: ἐν πᾶσιν τοῖς πιστεύσασιν
  choice: được mọi người đã tin chiêm ngưỡng
  rationale: “Mọi người đã tin” giữ động tính và sắc thái quá khứ của phân từ, đồng thời tránh biến nó thành một danh xưng trừu tượng.
- source_word: ὅτι
  choice: vì
  rationale: Ở đây ὅτι nêu lý do người Tê-sa-lô-ni-ca thuộc về số những người đã tin.
- source_word: ἐπιστεύθη
  choice: đã được tin nhận
  rationale: Thể thụ động có “lời chứng” làm chủ thể; “tin nhận” tự nhiên trong tiếng Việt và cho thấy họ tin nội dung được công bố.
- source_word: τὸ μαρτύριον ἡμῶν
  choice: lời chứng của chúng tôi
  rationale: Cách dịch trực tiếp, bao hàm lời làm chứng và sự công bố của các sứ đồ.
- source_word: ἐφ’ ὑμᾶς
  choice: nói với anh chị em
  rationale: Giới từ chỉ hướng của lời chứng đến những người nhận; thêm “nói” giúp câu tiếng Việt rõ và tự nhiên mà không đổi nội dung.
- source_word: ἐν τῇ ἡμέρᾳ ἐκείνῃ
  choice: vào ngày ấy
  rationale: Thành ngữ thời gian trang trọng, phù hợp với bối cảnh cánh chung; đặt đầu câu để câu tiếng Việt rõ ràng.
theological_decisions:
- issue: Ý nghĩa của ἐν trong cụm “các thánh đồ của Ngài”
  choice: “giữa các thánh đồ của Ngài,” nhấn mạnh sự tôn vinh công khai giữa dân thánh của Đấng Christ
  alternative: “trong các thánh đồ của Ngài,” nhấn mạnh vinh quang Ngài được bày tỏ nơi họ
  rationale: Văn cảnh song song với “mọi người đã tin” nghiêng về cộng đồng tín hữu, nhưng giới từ Hy Lạp vẫn cho phép sắc thái vinh quang được bày tỏ trong họ; chú thích bảo lưu sự căng thẳng này.
- issue: Mối liên hệ giữa những người đã tin và lời chứng của các sứ đồ
  choice: 'Giữ ngôn ngữ tin: “mọi người đã tin” và “lời chứng ... đã được tin nhận”'
  alternative: Dịch theo hướng “tin cậy” hoặc “tiếp nhận bằng đức tin”
  rationale: Bản văn nói trực tiếp về việc tin lời chứng; không cần thêm một sắc thái thần học chuyên biệt không được câu Hy Lạp xác định.
- issue: Vị trí của “vào ngày ấy”
  choice: Đặt ở đầu câu để đóng khung toàn bộ biến cố
  alternative: Giữ ở cuối câu theo trật tự Hy Lạp
  rationale: Cả hai cách đều khả dĩ; đặt đầu câu tự nhiên hơn trong tiếng Việt. Chú thích bảo lưu trật tự và khả năng liên kết theo nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” cho Đấng Christ, “anh chị em” cho đại từ số nhiều chỉ hội chúng, và “thánh đồ” theo cách dùng Kinh Thánh quen thuộc; không dùng từ cổ hoặc lối diễn đạt riêng của một hệ phái.
