  terminology: “Ngài,” “thánh đồ,” “tôn vinh,” “lời chứng,” và “tin” đều phù hợp văn phong Kinh Thánh Việt ngữ hiện đại. Chú thích a bảo lưu đúng sự mơ hồ có chủ ý của ἐν. Chú thích b cần cập nhật theo bản văn chỉnh sửa và nên mô tả đây là phương án theo trật tự từ, không phải một nghĩa khác.
