source:
  edition: SBLGNT
  text: οἵτινες δίκην τίσουσιν ὄλεθρον αἰώνιον ἀπὸ προσώπου τοῦ κυρίου καὶ ἀπὸ τῆς δόξης τῆς ἰσχύος αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/001/009.yaml
  text: These will pay the penalty of eternal destruction[a], away from the presence of the Lord and from the glory of his might,
translation:
  language: vi
  text: 'Những kẻ ấy sẽ chịu hình phạt: sự hủy diệt đời đời, xa cách sự hiện diện của Chúa và vinh quang của quyền năng Ngài.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “sự hủy diệt đời đời đến từ sự hiện diện của Chúa và từ vinh quang của quyền năng Ngài.” Giới từ Hy Lạp có thể chỉ sự phân cách (“xa cách”) hoặc nguồn phát sinh (“đến từ”).'
    reason: alternative_reading
lexical_decisions:
- source_word: οἵτινες
  choice: Những kẻ ấy
  rationale: Chỉ lại những người không nhận biết Đức Chúa Trời và không vâng theo Tin Lành ở câu trước; cách diễn đạt này giữ sắc thái quy chiếu rõ ràng trong tiếng Việt.
- source_word: δίκην τίσουσιν
  choice: sẽ chịu hình phạt
  rationale: Thành ngữ Hy Lạp nói đến việc gánh chịu một hình phạt theo phán quyết. Cách dịch này tự nhiên hơn lối dịch sát chữ “trả hình phạt” nhưng vẫn giữ sắc thái pháp lý.
- source_word: ὄλεθρον αἰώνιον
  choice: sự hủy diệt đời đời
  rationale: Giữ nguyên mức độ nghiêm trọng và tính trường tồn của cụm từ, nhưng không tự ý xác định bản chất của hình phạt là sự tiêu diệt hoàn toàn hay sự đau khổ có ý thức đời đời.
- source_word: ἀπὸ προσώπου τοῦ κυρίου
  choice: xa cách sự hiện diện của Chúa
  rationale: Hiểu ἀπό theo nghĩa phân cách và πρόσωπον theo nghĩa thành ngữ là “sự hiện diện”. Vì ἀπό cũng có thể chỉ nguồn phát sinh, khả năng đó được giữ trong chú thích.
- source_word: καὶ ἀπὸ τῆς δόξης τῆς ἰσχύος αὐτοῦ
  choice: và vinh quang của quyền năng Ngài
  rationale: “Vinh quang” tương ứng với δόξα, còn “quyền năng” truyền đạt tự nhiên ἰσχύς trong văn cảnh Chúa hiển hiện để phán xét. Cụm này tiếp tục phụ thuộc vào ý “xa cách” trong cách đọc chính.
theological_decisions:
- issue: Ý nghĩa của ἀπό trong lời phán xét cuối cùng
  choice: 'Hiểu là sự phân cách hoặc loại khỏi: “xa cách sự hiện diện của Chúa”'
  alternative: 'Hiểu là nguồn phát sinh: “sự hủy diệt đến từ sự hiện diện của Chúa và từ vinh quang của quyền năng Ngài”'
  rationale: Cả hai cách hiểu đều có cơ sở ngữ pháp. Bản văn chính dùng cách hiểu phân cách vốn phù hợp với văn cảnh hình phạt, còn chú thích bảo tồn cách hiểu nguồn phát sinh để không xóa bỏ sự mơ hồ thật sự của nguyên văn.
- issue: Hàm ý của cụm “sự hủy diệt đời đời”
  choice: Giữ nguyên cụm từ mà không định nghĩa thêm bản chất của hình phạt
  alternative: Giải thích theo hướng bị tiêu diệt hoàn toàn hoặc chịu hình phạt có ý thức đời đời
  rationale: Câu này nêu hình phạt là “sự hủy diệt đời đời” nhưng tự thân nó không giải quyết đầy đủ cuộc tranh luận thần học rộng hơn về phương thức của sự phán xét cuối cùng.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và dễ hiểu. Dùng “Chúa” và đại từ tôn kính “Ngài”; tránh thuật ngữ giáo phái và không diễn giải quá mức bản chất của hình phạt cuối cùng.
