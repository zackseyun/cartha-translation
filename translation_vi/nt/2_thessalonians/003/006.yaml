reference: 2 Thessalonians 3:6
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Παραγγέλλομεν δὲ ὑμῖν, ἀδελφοί, ἐν ὀνόματι τοῦ κυρίου ⸀ἡμῶν Ἰησοῦ Χριστοῦ στέλλεσθαι ὑμᾶς ἀπὸ παντὸς ἀδελφοῦ ἀτάκτως περιπατοῦντος καὶ μὴ κατὰ τὴν παράδοσιν ἣν ⸀παρελάβοσαν παρ’ ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/006.yaml
  text: We command you[a], brothers, in the name of our Lord Jesus the Messiah[e][d][c][b], to keep away from every brother who is walking disorderly and not according to the tradition that they received from us.
translation:
  language: vi
  text: Thưa anh em, nhân danh Chúa chúng ta là Chúa Giê-su, Đấng Mê-si[a], chúng tôi ra lệnh cho anh em phải tránh xa bất cứ anh em nào có nếp sống vô trật tự và không theo truyền thống mà họ đã nhận từ chúng tôi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Đấng Mê-si” cũng có thể dịch là “Đấng Christ.”
    reason: alternative_reading
  - marker: b
    text: Một số thủ bản chép “mà anh em đã nhận từ chúng tôi” hoặc “mà người ấy đã nhận từ chúng tôi,” làm cho cú pháp sau cụm “bất cứ anh em nào” trôi chảy hơn. Bản Hy Lạp được dùng ở đây chép “mà họ đã nhận từ chúng tôi.”
    reason: textual_variant
lexical_decisions:
- source_word: Παραγγέλλομεν
  choice: chúng tôi truyền
  rationale: Diễn đạt mệnh lệnh có thẩm quyền của sứ đồ, mạnh hơn một lời khuyên nhưng vẫn tự nhiên trong tiếng Việt.
- source_word: ἀδελφοί
  choice: anh em
  rationale: Giữ hình thức hô cách số nhiều giống đực và ngôn ngữ thân tộc của cộng đồng; trong tiếng Việt, “anh em” cũng có thể chỉ toàn thể hội chúng tùy ngữ cảnh.
- source_word: ἐν ὀνόματι τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ
  choice: nhân danh Chúa chúng ta là Đức Chúa Jêsus, Đấng Mê-si
  rationale: “Nhân danh” giữ thành ngữ và sắc thái thẩm quyền; Χριστός được thể hiện như tước hiệu “Đấng Mê-si” thay vì làm phẳng thành tên riêng.
- source_word: στέλλεσθαι ὑμᾶς ἀπὸ
  choice: phải tránh xa
  rationale: Diễn tả việc tự giữ khoảng cách, rút khỏi sự giao kết gần gũi, nhưng không tự động nâng nghĩa thành một thủ tục khai trừ chính thức.
- source_word: παντὸς ἀδελφοῦ
  choice: bất cứ anh em nào
  rationale: Truyền đạt ý phân phối của πᾶς với danh từ số ít, đồng thời giữ cách gọi thành viên cộng đồng là “anh em” một cách tự nhiên trong tiếng Việt.
- source_word: ἀτάκτως περιπατοῦντος
  choice: sống vô kỷ luật
  rationale: περιπατέω là ẩn dụ về nếp sống; ἀτάκτως có nghĩa rộng là không theo trật tự hay kỷ luật. Cách dịch này không giới hạn nghĩa chỉ vào sự lười biếng.
- source_word: μὴ κατὰ τὴν παράδοσιν
  choice: không theo truyền thống
  rationale: Giữ nghĩa trực tiếp của παράδοσις là điều được truyền lại; ngữ cảnh xác định đây là truyền thống được các sứ đồ truyền trao.
- source_word: ἣν παρελάβοσαν παρ’ ἡμῶν
  choice: mà họ đã nhận từ chúng tôi
  rationale: Theo sát dạng động từ ngôi thứ ba số nhiều παρελάβοσαν trong SBLGNT, dù sự chuyển đổi từ “bất cứ anh em nào” số ít sang “họ” số nhiều tạo cú pháp hơi bất thường.
theological_decisions:
- issue: Cách dịch Χριστοῦ trong tước hiệu về Chúa Jêsus
  choice: Đấng Mê-si
  alternative: Đấng Christ
  rationale: Ở đây Χριστός có chức năng tước hiệu; “Đấng Mê-si” làm rõ nghĩa ấy mà không biến nó thành một phần tên riêng.
- issue: Phạm vi của sự tách biệt được truyền bởi στέλλεσθαι ὑμᾶς ἀπὸ
  choice: phải tránh xa
  alternative: phải rút khỏi sự giao thiệp với
  rationale: Giữ sức nặng kỷ luật của câu nhưng không nhập vào bản văn khái niệm khai trừ chính thức mà câu Hy Lạp không nói rõ.
- issue: Quan hệ số giữa “bất cứ anh em nào” và động từ “họ đã nhận”
  choice: giữ cách đọc số nhiều của SBLGNT và chú thích dị bản
  alternative: “người ấy đã nhận” hoặc “anh em đã nhận”
  rationale: Không âm thầm làm trơn cú pháp bằng một dị bản khác; giữ sự căng thẳng văn bản của bản in và cung cấp các cách đọc thay thế trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Thưa anh em” để thể hiện hô cách tự nhiên; giữ “truyền thống” nhằm bảo toàn ý điều được truyền lại, không mặc nhiên gắn với truyền thống giáo phái về sau. “Sống vô kỷ luật” chuyển ẩn dụ “bước đi” sang cách nói tự nhiên của tiếng Việt nhưng vẫn giữ phạm vi nghĩa rộng.
