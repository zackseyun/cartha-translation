id: 2TH.3.1
reference: 2 Thessalonians 3:1
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Τὸ λοιπὸν προσεύχεσθε, ἀδελφοί, περὶ ἡμῶν, ἵνα ὁ λόγος τοῦ κυρίου τρέχῃ καὶ δοξάζηται καθὼς καὶ πρὸς ὑμᾶς,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/001.yaml
  text: Finally[a], brothers, pray for us, that the word of the Lord may spread rapidly and be honored, just as it was among you[b],
translation:
  language: vi
  text: Sau cùng, thưa anh em[a], hãy cầu nguyện cho chúng tôi, để lời Chúa được nhanh chóng lan truyền và được tôn vinh, như cũng đã từng diễn ra giữa anh em[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hy Lạp dịch là “anh em” cũng có thể được dùng để gọi toàn thể hội chúng, gồm cả nam lẫn nữ.
    reason: lexical_alternative
  - marker: b
    text: 'Dịch sát: “để lời Chúa chạy và được tôn vinh, cũng như giữa anh em.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τὸ λοιπὸν
  choice: Sau cùng
  rationale: Dùng như một dấu hiệu diễn ngôn mở đầu phần kết của thư; “Sau cùng” tự nhiên và trang trọng trong tiếng Việt hiện đại.
- source_word: προσεύχεσθε
  choice: hãy cầu nguyện
  rationale: Truyền đạt mệnh lệnh số nhiều; ngữ cảnh có thể hàm ý tiếp diễn, nhưng tiếng Việt không cần thêm từ chỉ thể để diễn đạt tự nhiên.
- source_word: ἀδελφοί
  choice: thưa anh em
  rationale: Giữ hình thức giống đực của từ Hy Lạp trong lời xưng hô, đồng thời dùng cách gọi tự nhiên trong tiếng Việt; chú thích nêu rõ từ này có thể đại diện cho toàn thể hội chúng.
- source_word: περὶ ἡμῶν
  choice: cho chúng tôi
  rationale: Kết hợp tự nhiên với “cầu nguyện” trong tiếng Việt.
- source_word: ἵνα
  choice: để
  rationale: Diễn đạt tự nhiên cả nội dung lẫn mục đích/kết quả được mong muốn của lời cầu nguyện.
- source_word: ὁ λόγος τοῦ κυρίου
  choice: lời Chúa
  rationale: Cách diễn đạt Kinh Thánh quen thuộc, cô đọng, giữ được ý về lời hoặc sứ điệp thuộc về và nói về Chúa.
- source_word: τρέχῃ
  choice: được nhanh chóng lan truyền
  rationale: Động từ có nghĩa đen là “chạy”, nhưng ở đây là ẩn dụ nói về sự tiến triển mau chóng của lời Chúa; bản dịch chính truyền đạt rõ nghĩa trong tiếng Việt.
- source_word: δοξάζηται
  choice: được tôn vinh
  rationale: Giữ sắc thái của δοξάζω và hình thức bị động, chỉ việc lời Chúa được tiếp nhận với sự tôn kính và được nhìn nhận đúng giá trị.
- source_word: καθὼς καὶ πρὸς ὑμᾶς
  choice: như đã xảy ra giữa anh em
  rationale: 'Bổ sung động từ hàm ẩn để câu tiếng Việt tự nhiên, đồng thời hiểu καί theo nghĩa so sánh: điều được cầu xin đã xảy ra nơi cộng đoàn Tê-sa-lô-ni-ca.'
theological_decisions:
- issue: Phạm vi chỉ người của ἀδελφοί trong lời xưng hô với hội chúng
  choice: anh em
  alternative: anh chị em
  rationale: Giữ hình thức giống đực của nguyên văn trong bản chính, nhưng không khẳng định hội chúng chỉ gồm nam giới; chú thích bảo tồn khả năng dùng theo nghĩa đại diện cho cả cộng đoàn.
- issue: Ẩn dụ τρέχῃ về sự tiến triển của lời Chúa
  choice: được nhanh chóng lan truyền
  alternative: chạy
  rationale: Theo tương đương tối ưu, diễn đạt ý nghĩa của ẩn dụ bằng tiếng Việt rõ ràng mà không biến chuyển động thành nghĩa đen; chú thích bảo tồn hình ảnh nguyên văn.
- issue: Ý nghĩa của δοξάζηται khi chủ ngữ là lời Chúa
  choice: được tôn vinh
  alternative: được tôn trọng
  rationale: “Được tôn vinh” bảo tồn liên hệ từ vựng với vinh quang và tránh thu hẹp ý nghĩa chỉ còn sự kính trọng của con người.
translation_notes:
  register: Văn phong tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. “Thưa anh em” thể hiện lời gọi trực tiếp; “lời Chúa” giữ thành ngữ Kinh Thánh quen thuộc. Cấu trúc được điều chỉnh vừa đủ để tự nhiên trong tiếng Việt, trong khi chú thích bảo tồn ẩn dụ và nét diễn đạt sát nguyên văn.
