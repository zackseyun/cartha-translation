  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: πεποίθαμεν δὲ ἐν κυρίῳ ἐφ’ ὑμᾶς, ὅτι ἃ ⸀παραγγέλλομεν καὶ ποιεῖτε καὶ ποιήσετε.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/004.yaml
  text: And we have confidence in the Lord about you, that you are doing and will do what we command.
translation:
  language: vi
  text: Nhưng trong Chúa, chúng tôi tin chắc về anh chị em rằng anh chị em đang làm và sẽ làm những điều chúng tôi truyền dặn.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πεποίθαμεν
  choice: chúng tôi tin chắc
  rationale: Diễn đạt trạng thái tin tưởng vững vàng của động từ hoàn thành mà vẫn tự nhiên trong tiếng Việt.
- source_word: ἐν κυρίῳ
  choice: trong Chúa
  rationale: Giữ nguyên phạm vi và nền tảng quy chiếu của lòng tin nơi Chúa, không giản lược thành chỉ nhờ Chúa.
- source_word: ἐφ’ ὑμᾶς
  choice: về anh chị em
  rationale: Phản ánh đối tượng mà lòng tin hướng đến; cách nói này giữ gần cấu trúc Hy Lạp và tránh hàm ý lòng tin đặt nơi con người thay vì trong Chúa.
- source_word: παραγγέλλομεν
  choice: chúng tôi truyền dặn
  rationale: Thể hiện sắc thái chỉ thị có thẩm quyền của παραγγέλλω, đồng thời tự nhiên hơn lối nói quá cứng trong tiếng Việt.
- source_word: ποιεῖτε καὶ ποιήσετε
  choice: đang làm và sẽ làm
  rationale: Giữ rõ sự tương phản thời hiện tại và tương lai của bản văn.
theological_decisions:
- issue: Mối quan hệ giữa lòng tin nơi Chúa và sự vâng lời của tín hữu
  choice: trong Chúa, chúng tôi tin chắc về anh chị em
  alternative: chúng tôi tin chắc rằng Chúa sẽ khiến anh chị em vâng lời
  rationale: Bản văn đặt lòng tin 'trong Chúa' và hướng lòng tin ấy 'về anh chị em', nhưng không nói trực tiếp rằng Chúa cưỡng khiến hành động; bản dịch giữ nguyên sự căng thẳng này.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh chị em” cho đại từ số nhiều ὑμᾶς; “truyền dặn” giữ sắc thái thẩm quyền mà không quá hành chính.
