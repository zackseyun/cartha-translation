id: 2TH.3.14
reference: 2 Thessalonians 3:14
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Εἰ δέ τις οὐχ ὑπακούει τῷ λόγῳ ἡμῶν διὰ τῆς ἐπιστολῆς, τοῦτον σημειοῦσθε, ⸀μὴ ⸀συναναμίγνυσθαι αὐτῷ, ἵνα ἐντραπῇ·
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/014.yaml
  text: And if anyone does not obey our word through this letter[a], take note of that person; do not associate with him[d][c][b], so that he may be ashamed.
translation:
  language: vi
  text: Nếu có ai không vâng theo lời chúng tôi truyền qua thư này[a], hãy ghi nhận người ấy[b] và đừng giao du với người ấy[c], để người ấy hổ thẹn[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “bởi thư này” hoặc “trong thư này.” Cụm từ Hy Lạp có thể chỉ phương tiện qua đó lời chỉ dạy được truyền đến.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “hãy đánh dấu” hoặc “hãy lưu ý người ấy.”'
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể dịch: “đừng qua lại với người ấy.”'
    reason: lexical_alternative
  - marker: d
    text: Mục đích là sửa trị; so sánh câu 15, nơi cộng đồng vẫn phải khuyên bảo người ấy “như anh em.”
    reason: cross_reference
lexical_decisions:
- source_word: ὑπακούει
  choice: vâng theo
  rationale: Động từ chỉ việc nghe theo và tuân phục lời chỉ dạy; “vâng theo” tự nhiên trong tiếng Việt và giữ được sắc thái thẩm quyền của lời khuyên bảo.
- source_word: τῷ λόγῳ ἡμῶν
  choice: lời chúng tôi
  rationale: λόγος ở đây chỉ lời dạy hay chỉ thị của các sứ đồ, không chỉ một phát ngôn riêng lẻ. Cách dịch này giữ hình ảnh của nguyên văn mà vẫn dễ hiểu.
- source_word: διὰ τῆς ἐπιστολῆς
  choice: truyền qua thư này
  rationale: 'διά với sở hữu cách diễn tả phương tiện: lời chỉ dạy được truyền đạt qua bức thư. Từ “này” được hiểu theo văn cảnh, vì Phao-lô nói đến bức thư hiện tại.'
- source_word: σημειοῦσθε
  choice: hãy ghi nhận
  rationale: Mệnh lệnh trung cách yêu cầu cộng đồng lưu ý hoặc đánh dấu người không vâng lời. “Ghi nhận” rõ ràng, không tự ý tăng mức độ thành một thủ tục khai trừ chính thức.
- source_word: τοῦτον
  choice: người ấy
  rationale: Đại từ chỉ định hướng đến chính người không vâng lời vừa được nhắc đến; “người ấy” tự nhiên và không thêm sắc thái miệt thị.
- source_word: μὴ συναναμίγνυσθαι αὐτῷ
  choice: đừng giao du với người ấy
  rationale: συναναμίγνυμι có nghĩa là hòa nhập, kết giao hay qua lại với ai. “Đừng giao du” diễn đạt sự hạn chế quan hệ xã hội trong cộng đồng mà không áp đặt một thuật ngữ giáo luật về sau.
- source_word: ἐντραπῇ
  choice: biết hổ thẹn
  rationale: Dạng thụ động giả định trong mệnh đề mục đích nói đến việc người ấy đi đến chỗ cảm thấy hổ thẹn. “Biết hổ thẹn” giữ tính luân lý và mục đích sửa trị, nhưng không biến sự làm nhục thành mục tiêu tự thân.
- source_word: τις
  choice: ai
  rationale: Đại từ bất định có phạm vi khái quát; cấu trúc “nếu có ai” là cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: αὐτῷ
  choice: với người ấy
  rationale: Đại từ số ít trở lại với người đã được nêu. “Người ấy” rõ nghĩa và tự nhiên hơn việc buộc phải dùng một đại từ mang giới tính trong tiếng Việt.
theological_decisions:
- issue: Bản chất của hành động được truyền trong μὴ συναναμίγνυσθαι αὐτῷ
  choice: Một hình thức hạn chế giao du trong cộng đồng nhằm sửa trị người tin không vâng lời, chứ câu này tự nó không tuyên bố sự kết án cuối cùng.
  alternative: Hiểu là khai trừ hoàn toàn theo nghĩa giáo luật mạnh nhất, hoặc chỉ là tránh tiếp xúc tình cờ mà không có chiều kích cộng đồng.
  rationale: Câu kế tiếp yêu cầu không xem người ấy là kẻ thù nhưng khuyên bảo như anh em. “Đừng giao du” giữ sức nặng kỷ luật và mục tiêu sửa trị mà không nhập vào văn bản một phạm trù giáo luật có sau.
- issue: Sức nghĩa của ἐντραπῇ
  choice: Mục đích là khiến người ấy nhận biết sự hổ thẹn để được sửa đổi.
  alternative: Làm nhục công khai như một mục đích tự thân.
  rationale: Mệnh đề mục đích cùng câu 15 hướng đến sự sửa trị. Bản dịch vẫn giữ sự nghiêm túc của cảm giác hổ thẹn nhưng không diễn giải nó thành sự sỉ nhục mang tính báo thù.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “vâng theo,” “ghi nhận,” và “giao du” để giữ sắc thái khuyên bảo và kỷ luật của nguyên văn mà không biến câu này thành thuật ngữ giáo luật. Đại từ “người ấy” phù hợp tự nhiên với tiếng Việt và vẫn giữ quy chiếu số ít của bản Hy Lạp.
