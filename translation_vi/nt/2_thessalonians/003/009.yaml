id: 2TH.3.9
reference: 2 Thessalonians 3:9
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οὐχ ὅτι οὐκ ἔχομεν ἐξουσίαν, ἀλλ’ ἵνα ἑαυτοὺς τύπον δῶμεν ὑμῖν εἰς τὸ μιμεῖσθαι ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/009.yaml
  text: not because we do not have the right, but in order to give ourselves to you as an example for you to imitate us.
translation:
  language: vi
  text: không phải vì chúng tôi không có quyền ấy[a], nhưng để chính chúng tôi làm gương[b] cho anh chị em noi theo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “thẩm quyền” hoặc “quyền hành”; trong ngữ cảnh này, từ này nói đến quyền chính đáng được nhận sự chu cấp.
    reason: lexical_alternative
  - marker: b
    text: Hay “khuôn mẫu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξουσίαν
  choice: quyền ấy
  rationale: Trong ngữ cảnh, từ này chỉ quyền chính đáng được nhận sự chu cấp; “quyền ấy” tự nhiên trong tiếng Việt và liên kết với quyền được nói đến trong mạch văn.
- source_word: ἑαυτοὺς
  choice: chính chúng tôi
  rationale: Giữ sắc thái phản thân và nhấn mạnh rằng Phao-lô cùng các bạn đồng hành lấy bản thân mình làm gương.
- source_word: τύπον
  choice: gương
  rationale: Ở đây τύπος là khuôn mẫu hành xử để người khác noi theo; “làm gương” là cách diễn đạt tự nhiên, rõ nghĩa trong tiếng Việt hiện đại.
- source_word: δῶμεν
  choice: làm
  rationale: Trong kết hợp ἑαυτοὺς τύπον δῶμεν, dịch theo thành ngữ tiếng Việt là “chính chúng tôi làm gương,” truyền đạt đúng ý mà không giữ máy móc động từ “trao/đưa”.
- source_word: εἰς τὸ μιμεῖσθαι ἡμᾶς
  choice: cho anh chị em noi theo
  rationale: Diễn đạt mục đích của việc làm gương và đối tượng noi theo; “noi theo” tự nhiên hơn “bắt chước” trong văn phong trang trọng tích cực.
- source_word: οὐχ ὅτι οὐκ ... ἀλλ’ ἵνα
  choice: không phải vì ... nhưng để
  rationale: Giữ cấu trúc tương phản phủ định–mục đích của nguyên văn bằng tiếng Việt gọn và tự nhiên.
theological_decisions:
- issue: Ý nghĩa quyền được nói đến qua ἐξουσίαν
  choice: Quyền chính đáng được nhận sự chu cấp
  alternative: Thẩm quyền hoặc quyền năng sứ đồ theo nghĩa rộng
  rationale: Mạch văn nói đến việc lao động để không trở thành gánh nặng, nên trọng tâm là quyền được chu cấp. “Quyền ấy” không mở rộng câu thành một tuyên bố tổng quát hơn về thẩm quyền.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh chị em” cho ὑμῖν nhằm diễn đạt cộng đồng tín hữu một cách bao quát; cấu trúc “làm gương cho ... noi theo” ưu tiên tính tự nhiên mà vẫn giữ quan hệ mục đích của nguyên văn.
