  source_fidelity: 'Bản dịch chuyển đạt chính xác cấu trúc tương phản οὐχ ὅτι οὐκ … ἀλλ’ ἵνα: không phải vì thiếu quyền, nhưng nhằm nêu bản thân Phao-lô và các cộng sự làm mẫu mực để người nhận noi theo. “Quyền ấy” phù hợp với ἐξουσίαν trong ngữ cảnh quyền chính đáng được chu cấp; “chính chúng tôi làm gương” diễn đạt tự nhiên cụm phản thân ἑαυτοὺς τύπον δῶμεν; và “cho anh chị em noi theo” bảo toàn mục đích εἰς τὸ μιμεῖσθαι ἡμᾶς.'
