revisions:
- from: Vì chúng tôi nghe rằng có một số người trong anh em sống vô kỷ luật[a], chẳng chịu làm việc gì, mà lại xen vào chuyện người khác[b].
  to: Vì chúng tôi nghe rằng có một số người trong anh em đang sống thiếu kỷ luật[a], không làm việc gì cả, mà lại xen vào chuyện người khác[b].
  rationale: Thay “chẳng chịu làm việc gì” bằng “không làm việc gì cả” để không thêm ý chí từ chối không được nêu minh thị trong nguyên văn. Thay “vô kỷ luật” bằng “thiếu kỷ luật” để có cách diễn đạt tiếng Việt hiện đại tự nhiên hơn, vẫn giữ nghĩa rộng của ἀτάκτως. Các chú thích được giữ nguyên vì phản ánh đúng các lựa chọn từ vựng và lối chơi chữ của tiếng Hy Lạp.
