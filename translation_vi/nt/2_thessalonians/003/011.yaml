  - severity: low
    issue: “Vô kỷ luật” hơi kém tự nhiên và có thể cá thể hóa nghĩa của ἀτάκτως.
    rationale: “Thiếu kỷ luật” diễn đạt hiện đại, tự nhiên hơn, đồng thời vẫn để ngỏ phạm vi “không theo trật tự/nề nếp” mà trạng từ Hy Lạp mang trong văn cảnh cộng đồng.
