  text: ἀκούομεν γάρ τινας περιπατοῦντας ἐν ὑμῖν ἀτάκτως, μηδὲν ἐργαζομένους ἀλλὰ περιεργαζομένους·
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/011.yaml
  text: For we hear that some among you are walking disorderly[a], doing no work at all[b], but meddling.
translation:
  language: vi
  text: Vì chúng tôi nghe rằng có một số người trong anh em đang sống thiếu kỷ luật[a], không làm việc gì cả, mà lại xen vào chuyện người khác[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “sống nhàn rỗi” hoặc “sống không theo khuôn phép.” Trạng từ Hy Lạp có thể chỉ cách cư xử thiếu trật tự, thiếu kỷ luật, hoặc nhàn rỗi trái với nề nếp của cộng đồng.
    reason: lexical_alternative
  - marker: b
    text: 'Tiếng Hy Lạp có lối chơi chữ: họ “không làm việc” nhưng lại “làm quanh quẩn,” tức là bận xen vào những chuyện không thuộc phần việc của mình.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούομεν
  choice: chúng tôi nghe
  rationale: Thì hiện tại diễn tả điều đang được báo lại hoặc đang được biết; cách dịch này tự nhiên và không thêm sắc thái hoàn thành.
- source_word: γάρ
  choice: Vì
  rationale: Nêu lý do hoặc lời giải thích cho lời khuyên ở trước.
- source_word: τινας
  choice: một số người
  rationale: Chỉ một nhóm không xác định trong cộng đồng.
- source_word: περιπατοῦντας
  choice: sống
  rationale: Đây là lối nói ẩn dụ quen thuộc về cách sống hay cách cư xử; tiếng Việt tự nhiên dùng “sống” hơn là dịch sát hình ảnh “bước đi”.
- source_word: ἐν ὑμῖν
  choice: trong anh em
  rationale: Diễn tả những người thuộc cộng đồng người nhận thư; “anh em” phù hợp với cách xưng hô trong văn mạch thư tín.
- source_word: ἀτάκτως
  choice: vô kỷ luật
  rationale: Giữ nghĩa rộng là sống không theo trật tự hoặc khuôn phép, thay vì thu hẹp ngay thành lười biếng; câu tiếp theo làm rõ biểu hiện không chịu làm việc.
- source_word: μηδὲν ἐργαζομένους
  choice: chẳng chịu làm việc gì
  rationale: Truyền đạt sự phủ định mạnh của μηδέν và trong văn cảnh cho thấy không chỉ thiếu việc mà là không chịu lao động.
- source_word: ἀλλὰ
  choice: mà lại
  rationale: Thể hiện rõ sự tương phản mạnh giữa không làm việc và bận can thiệp việc khác.
- source_word: περιεργαζομένους
  choice: xen vào chuyện người khác
  rationale: Diễn đạt tự nhiên ý can thiệp hoặc bận tâm không đúng chỗ. Chú thích nêu lối chơi chữ với ἐργαζομένους mà tiếng Việt khó tái hiện trọn vẹn.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng nhưng dễ hiểu. Dùng “sống” để chuyển tải thành ngữ περιπατέω tự nhiên trong tiếng Việt; dùng “vô kỷ luật” để giữ phạm vi nghĩa rộng của ἀτάκτως. Cặp “chẳng chịu làm việc gì, mà lại xen vào chuyện người khác” làm nổi bật thế tương phản, còn chú thích bảo tồn lối chơi chữ Hy Lạp.
