  terminology: Giữ “bánh” theo nghĩa đen của ἄρτος, đồng thời chú thích giải thích đây có thể là cách nói bao quát thức ăn hoặc sự chu cấp vật chất. “Trở thành gánh nặng” phù hợp với ἐπιβαρῆσαι trong ngữ cảnh.
