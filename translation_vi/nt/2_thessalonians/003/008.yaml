  text: οὐδὲ δωρεὰν ἄρτον ἐφάγομεν παρά τινος, ἀλλ’ ἐν κόπῳ καὶ μόχθῳ ⸂νυκτὸς καὶ ἡμέρας⸃ ἐργαζόμενοι πρὸς τὸ μὴ ἐπιβαρῆσαί τινα ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/008.yaml
  text: nor did we eat bread from anyone free of charge[a], but with labor and hardship, working night and day so as not to burden any of you.
translation:
  language: vi
  text: chúng tôi cũng không ăn bánh của bất cứ ai mà không trả tiền,[a] nhưng chúng tôi lao động trong cảnh nhọc nhằn vất vả, làm việc đêm ngày để không trở thành gánh nặng cho bất cứ ai trong anh em.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “chúng tôi cũng không ăn bánh của ai không công.” Tiếng Hy Lạp giữ nghĩa đen là “bánh”, nhưng từ này cũng có thể chỉ thức ăn hoặc sự chu cấp vật chất nói chung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δωρεὰν
  choice: mà không trả tiền
  rationale: Diễn đạt tự nhiên sắc thái nhận không hoặc không phải trả phí trong ngữ cảnh tự lao động để tránh tạo gánh nặng vật chất.
- source_word: ἄρτον
  choice: bánh
  rationale: Giữ hình ảnh cụ thể của nguyên văn; trong ngữ cảnh, “bánh” cũng có thể đại diện cho thức ăn hay sự chu cấp vật chất.
- source_word: παρά τινος
  choice: của ai
  rationale: Diễn đạt nguồn cung cấp một cách tự nhiên khi đi với động từ “ăn” trong tiếng Việt.
- source_word: ἐν κόπῳ καὶ μόχθῳ
  choice: lao động khó nhọc
  rationale: Hai từ gần nghĩa cùng nhấn mạnh công sức nặng nhọc; cách diễn đạt này tự nhiên và giữ được lực cộng hưởng mà không gượng ép lặp từ.
- source_word: νυκτὸς καὶ ἡμέρας
  choice: đêm ngày
  rationale: Thành ngữ tiếng Việt tự nhiên, thể hiện việc làm liên tục qua cả đêm lẫn ngày.
- source_word: ἐργαζόμενοι
  choice: làm việc
  rationale: Phản ánh rõ hoạt động lao động tự nuôi sống mình trong ngữ cảnh.
- source_word: πρὸς τὸ μὴ ἐπιβαρῆσαί
  choice: để không trở thành gánh nặng cho
  rationale: Giữ quan hệ mục đích và làm rõ nghĩa bóng về gánh nặng vật chất mà động từ Hy Lạp mang trong ngữ cảnh.
- source_word: τινα ὑμῶν
  choice: bất cứ ai trong anh em
  rationale: Giữ sắc thái phân phối của đại từ bất định và dùng cách xưng hô cộng đồng phù hợp với thư tín.
- source_word: οὐδὲ ... ἀλλ’
  choice: cũng không ... nhưng
  rationale: Giữ cấu trúc tương phản nối tiếp từ văn cảnh trước.
theological_decisions: []
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Giữ “bánh” để bảo tồn hình ảnh nguyên văn; dùng “mà không trả tiền” để truyền đạt rõ nghĩa kinh tế của δωρεὰν. Dấu chú thích [a] được đặt ngay sau cụm từ liên quan.
