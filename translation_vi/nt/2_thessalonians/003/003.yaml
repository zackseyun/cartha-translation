source:
  edition: SBLGNT
  text: πιστὸς δέ ἐστιν ὁ κύριος, ὃς στηρίξει ὑμᾶς καὶ φυλάξει ἀπὸ τοῦ πονηροῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/003.yaml
  text: But the Lord is faithful[a], who will strengthen you and guard you from the evil one.
translation:
  language: vi
  text: Nhưng Chúa là thành tín, Đấng sẽ làm cho anh chị em vững mạnh và gìn giữ anh chị em khỏi Kẻ Ác.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “khỏi điều ác.” Cụm từ Hy Lạp τοῦ πονηροῦ có thể được hiểu là giống đực (“Kẻ Ác”) hoặc giống trung (“điều ác”).'
    reason: alternative_reading
lexical_decisions:
- source_word: πιστὸς
  choice: thành tín
  rationale: Diễn tả Chúa là Đấng đáng tin cậy và luôn giữ lòng thành tín; cách dịch này giữ được sức nặng thần học và tương phản với sự thiếu đức tin ở câu trước.
- source_word: δέ
  choice: Nhưng
  rationale: Giữ rõ sắc thái tương phản với lời khẳng định ngay trước đó rằng không phải mọi người đều có đức tin.
- source_word: ὁ κύριος
  choice: Chúa
  rationale: Giữ nguyên tước hiệu κύριος mà không xác định thêm danh tính; trong văn cảnh Phao-lô, tước hiệu này nhiều khả năng chỉ Chúa Giê-su.
- source_word: στηρίξει
  choice: sẽ làm cho anh chị em vững mạnh
  rationale: Chuyển tải ý làm cho vững chắc, củng cố; cụm từ tự nhiên trong tiếng Việt và phù hợp với lời hứa nâng đỡ trong văn cảnh.
- source_word: φυλάξει
  choice: gìn giữ
  rationale: Diễn tả hành động canh giữ và bảo vệ liên tục, đồng thời kết hợp tự nhiên với giới từ “khỏi”.
- source_word: ἀπὸ
  choice: khỏi
  rationale: Diễn tả sự bảo vệ để đối tượng tránh khỏi hoặc nằm ngoài tầm gây hại của mối nguy.
- source_word: τοῦ πονηροῦ
  choice: Kẻ Ác
  rationale: Hình thái Hy Lạp có thể là giống đực, “Kẻ Ác”, hoặc giống trung, “điều ác”. Bản chính chọn cách hiểu chỉ một hữu thể có ngôi vị, thường gặp trong Tân Ước, còn cách hiểu trừu tượng được giữ trong chú thích.
theological_decisions:
- issue: Đối tượng được nói đến bởi τοῦ πονηροῦ
  choice: Kẻ Ác
  alternative: điều ác
  rationale: Cụm từ Hy Lạp thực sự mơ hồ về ngữ pháp giữa giống đực và giống trung. Bản chính dùng cách hiểu có ngôi vị nhưng chú thích giữ lại cách hiểu trừu tượng, không tuyệt đối hóa một cách giải thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh chị em” cho đại từ số nhiều ὑμᾶς nhằm nói với toàn thể cộng đồng tín hữu. Dấu chấm phẩy giúp thể hiện mạch tương phản rồi triển khai lời bảo đảm. Viết hoa “Kẻ Ác” để cho thấy cách hiểu có ngôi vị trong bản chính.
