revisions:
- from: Nhưng Chúa là thành tín; Ngài sẽ làm cho anh chị em vững mạnh và gìn giữ anh chị em khỏi Kẻ Ác.[a]
  to: Nhưng Chúa là thành tín, Đấng sẽ làm cho anh chị em vững mạnh và gìn giữ anh chị em khỏi Kẻ Ác.[a]
  rationale: Sửa nhẹ để phản ánh rõ mệnh đề quan hệ ὃς và quan hệ cú pháp của nó với “Chúa”, không thay đổi lựa chọn từ vựng hay cách xử lý sự mơ hồ thực sự của τοῦ πονηροῦ.
  reviewer_model: gpt-5.6-terra
