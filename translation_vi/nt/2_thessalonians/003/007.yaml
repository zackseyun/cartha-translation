  text: αὐτοὶ γὰρ οἴδατε πῶς δεῖ μιμεῖσθαι ἡμᾶς, ὅτι οὐκ ἠτακτήσαμεν ἐν ὑμῖν
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/007.yaml
  text: For you yourselves know how you ought to imitate us[a], because we did not behave disorderly among you.
translation:
  language: vi
  text: Vì chính anh chị em biết mình phải noi gương chúng tôi thế nào, bởi chúng tôi đã không sống vô kỷ luật giữa anh chị em.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc, hiểu cụ thể hơn theo văn cảnh: “chúng tôi đã không ăn không ngồi rồi giữa anh chị em.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτοὶ
  choice: chính anh chị em
  rationale: Đại từ nhấn mạnh được diễn đạt bằng “chính”, giữ ý rằng người Tê-sa-lô-ni-ca tự mình đã biết điều này.
- source_word: γὰρ
  choice: Vì
  rationale: Liên từ đưa ra lý do hoặc lời giải thích cho lời khuyên ở câu trước.
- source_word: οἴδατε
  choice: biết
  rationale: Dù có hình thái hoàn thành, οἶδα thường mang nghĩa hiện tại; “biết” là cách diễn đạt tự nhiên.
- source_word: πῶς δεῖ μιμεῖσθαι ἡμᾶς
  choice: mình phải noi gương chúng tôi thế nào
  rationale: “Phải” giữ sắc thái cần thiết/nghĩa vụ của δεῖ; “noi gương” chuyển đạt tự nhiên hành động bắt chước người khác theo mẫu sống của họ mà không biến tân ngữ “chúng tôi” thành danh từ trừu tượng.
- source_word: ὅτι
  choice: bởi
  rationale: Trong mạch câu này, ὅτι nêu căn cứ giải thích cho việc họ biết phải noi gương các sứ đồ thế nào.
- source_word: οὐκ ἠτακτήσαμεν
  choice: đã không sống vô kỷ luật
  rationale: ἀτακτέω chỉ lối cư xử thiếu trật tự hoặc kỷ luật; cách dịch này giữ nghĩa rộng hơn sự nhàn rỗi, đồng thời phù hợp văn cảnh về nếp sống.
- source_word: ἐν ὑμῖν
  choice: giữa anh chị em
  rationale: Diễn tả cách các sứ đồ sống và cư xử khi ở trong cộng đồng tín hữu.
theological_decisions:
- issue: Phạm vi nghĩa của ἀτακτέω trong văn cảnh
  choice: Giữ nghĩa rộng là “sống vô kỷ luật” trong chính văn.
  alternative: “Chúng tôi đã không ăn không ngồi rồi giữa anh chị em.”
  rationale: Văn cảnh chương 3 đặc biệt liên hệ lối sống vô kỷ luật với việc không chịu làm việc, nhưng nghĩa của động từ không nhất thiết chỉ giới hạn ở sự nhàn rỗi. Chính văn giữ độ rộng của từ Hy Lạp, còn chú thích nêu cách hiểu cụ thể theo văn cảnh.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh chị em” để chỉ cộng đồng tín hữu; “noi gương” tự nhiên hơn “bắt chước” trong lời khuyên đạo đức. Dấu chú thích [a] đặt ngay sau mệnh đề mà chú thích giải thích.
