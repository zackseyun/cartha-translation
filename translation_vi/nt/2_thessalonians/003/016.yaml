id: 2TH.3.16
reference: 2 Thessalonians 3:16
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Αὐτὸς δὲ ὁ κύριος τῆς εἰρήνης δῴη ὑμῖν τὴν εἰρήνην διὰ παντὸς ἐν παντὶ τρόπῳ. ὁ κύριος μετὰ πάντων ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/016.yaml
  text: May the Lord of peace himself give you peace at all times in every way[b][a]. The Lord be with all of you.
translation:
  language: vi
  text: Nguyện chính Chúa của sự bình an ban bình an cho anh chị em mọi lúc[a], bằng mọi cách[b]. Nguyện Chúa ở cùng tất cả anh chị em.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “luôn luôn”.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “trong mọi cách thức”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Αὐτὸς
  choice: chính
  rationale: Đại từ được dùng để nhấn mạnh chủ thể; “chính Chúa” truyền đạt tự nhiên rằng đích thân Chúa là Đấng ban bình an.
- source_word: δὲ
  choice: không dịch thành một từ riêng
  rationale: Ở đây δέ chỉ đánh dấu sự chuyển nhẹ sang lời chúc phước kết thúc. Tiếng Việt không cần thêm “bây giờ” hay một liên từ đối lập, vì như vậy dễ tạo sắc thái không có trong nguyên văn.
- source_word: ὁ κύριος τῆς εἰρήνης
  choice: Chúa của sự bình an
  rationale: Giữ cấu trúc quan hệ của cụm sở hữu trong tiếng Hy Lạp và không diễn giải thêm thành “Đấng ban bình an” hay “nguồn bình an”.
- source_word: δῴη
  choice: Nguyện ... ban
  rationale: Thể cầu chúc trong lời chúc phước được diễn đạt tự nhiên bằng “Nguyện”, cho thấy đây là lời cầu xin hay ước nguyện chứ không phải lời trần thuật.
- source_word: τὴν εἰρήνην
  choice: bình an
  rationale: Danh từ không cần mạo từ trong tiếng Việt; cách diễn đạt này tự nhiên và vẫn giữ nội dung của nguyên văn.
- source_word: διὰ παντὸς
  choice: mọi lúc
  rationale: Truyền đạt trực tiếp ý nghĩa thời gian liên tục của cụm từ mà không giới hạn vào một hoàn cảnh cụ thể.
- source_word: ἐν παντὶ τρόπῳ
  choice: bằng mọi cách
  rationale: Diễn đạt rộng nghĩa về phương cách hay thể thức; “bằng” tự nhiên trong tiếng Việt khi đi với hành động ban điều gì đó.
- source_word: μετὰ πάντων ὑμῶν
  choice: ở cùng tất cả anh chị em
  rationale: Giữ rõ phạm vi bao gồm toàn thể cộng đồng; “anh chị em” là cách xưng hô hiện đại, trang trọng vừa phải và bao quát cả nam lẫn nữ.
theological_decisions:
- issue: Đấng được gọi là “Chúa” trong lời chúc phước
  choice: Giữ nguyên danh xưng “Chúa” mà không bổ sung tên gọi
  alternative: Diễn giải rõ là “Chúa Giê-su” hoặc hiểu chung là Đức Chúa Trời
  rationale: Nguyên văn chỉ viết ὁ κύριος. Ngữ cảnh Phao-lô có thể hướng đến Chúa Giê-su, nhưng bản dịch không nên xác định rõ hơn điều câu này trực tiếp nói.
- issue: Lực ngữ của mệnh đề cuối không có động từ tường minh
  choice: 'Dịch như một lời cầu chúc: “Nguyện Chúa ở cùng...”'
  alternative: 'Dịch như lời khẳng định: “Chúa ở cùng...”'
  rationale: Trong ngữ cảnh kết thư, mệnh đề này có chức năng chúc phước. Thêm “Nguyện” thể hiện đúng chức năng ấy trong tiếng Việt mà không biến nó thành một phát biểu chỉ định.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và dễ hiểu. Dùng “anh chị em” để thể hiện số nhiều và tính bao quát của ὑμῖν/ὑμῶν. Hai câu đều dùng “Nguyện” nhằm làm rõ hình thức lời chúc phước trong tiếng Việt.
