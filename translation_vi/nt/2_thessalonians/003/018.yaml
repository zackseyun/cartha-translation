  terminology: “Ân sủng”, “Chúa”, và “Đức Giê-su Ki-tô” là các cách dùng ổn định, dễ hiểu và phù hợp ngữ vực Kinh Thánh tiếng Việt. “Ki-tô” là dạng danh xưng/tước hiệu đã quen thuộc; chú thích giải thích nghĩa “Đấng Mê-si-a/Đấng được xức dầu” giúp giữ nhận thức về giá trị tước hiệu của Χριστός mà không làm chính văn gượng ép.
