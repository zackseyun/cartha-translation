  source_fidelity: 'Bản dịch chuyển tải trung thực công thức chúc phước của nguyên văn: ἡ χάρις là “ân sủng”, τοῦ κυρίου ἡμῶν là “của Chúa chúng ta”, và μετὰ πάντων ὑμῶν là “ở cùng tất cả anh chị em”. Động từ cầu chúc được ngầm hiểu trong tiếng Hy Lạp được diễn đạt tự nhiên bằng “Nguyện ... ở cùng ...”. “Tất cả anh chị em” bảo toàn rõ phạm vi bao quát của πάντων.'
