  text: ἡ χάρις τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ μετὰ πάντων ⸀ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/018.yaml
  text: The grace of our Lord Jesus Christ be with all of you[a].
translation:
  language: vi
  text: Nguyện ân sủng của Chúa chúng ta là Đức Giê-su Ki-tô ở cùng tất cả anh chị em.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ki-tô” có nghĩa là “Đấng Mê-si-a” hay “Đấng được xức dầu.”
    reason: Làm rõ nghĩa tước hiệu Χριστός trong khi giữ cách gọi quen thuộc ở chính văn.
lexical_decisions:
- source_word: χάρις
  choice: ân sủng
  rationale: Thuật ngữ quen thuộc trong các lời chúc phước của Phao-lô, diễn tả sự ưu ái và ân ban nhưng không của Đức Chúa Trời; “ân sủng” vừa trang trọng vừa tự nhiên trong văn phong Kinh Thánh tiếng Việt.
- source_word: κυρίου
  choice: Chúa
  rationale: Trong tước hiệu chỉ Đức Giê-su, từ này diễn tả thẩm quyền và sự tôn kính; “Chúa” là cách dịch chuẩn và tự nhiên hơn “chủ” trong ngữ cảnh này.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Đức Giê-su Ki-tô
  rationale: “Giê-su” chuyển âm tên riêng; “Ki-tô” là dạng đã định hình trong tiếng Việt cho tước hiệu Χριστός, đồng thời cụm “Đức Giê-su Ki-tô” dễ hiểu, trang trọng và quen thuộc với độc giả phổ thông.
- source_word: μετὰ πάντων ὑμῶν
  choice: ở cùng tất cả anh chị em
  rationale: Giữ nguyên ý nghĩa “với toàn thể anh em”; thêm “ở” để lời chúc phước tự nhiên trong tiếng Việt, còn “anh chị em” biểu đạt cộng đồng người nhận mà không giới hạn theo giới tính.
theological_decisions:
- issue: Cách dịch Χριστοῦ trong lời chúc phước kết thư
  choice: Ki-tô
  alternative: Đấng Mê-si-a
  rationale: Χριστός vốn là tước hiệu “Đấng được xức dầu/Mê-si-a”, nhưng trong công thức “Đức Giê-su Ki-tô” nó cũng mang tính danh xưng đã định hình. “Ki-tô” bảo toàn truyền thống thuật ngữ tiếng Việt mà không buộc phải giải quyết dứt khoát sự căng thẳng giữa tước hiệu và danh xưng; chú thích nêu rõ nghĩa tước hiệu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Dùng cấu trúc cầu chúc “Nguyện… ở cùng…” để thể hiện động từ được hiểu ngầm trong nguyên văn Hy Lạp; dùng “anh chị em” để chuyển tải số nhiều ὑμῶν theo lối bao hàm tự nhiên trong tiếng Việt.
