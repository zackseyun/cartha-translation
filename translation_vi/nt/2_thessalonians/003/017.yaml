  text: Ὁ ἀσπασμὸς τῇ ἐμῇ χειρὶ Παύλου, ὅ ἐστιν σημεῖον ἐν πάσῃ ἐπιστολῇ· οὕτως γράφω.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/017.yaml
  text: The greeting is by my own hand—Paul's—which is a sign in every letter[a]; this is how I write.
translation:
  language: vi
  text: Lời chào này do chính tay tôi, Phao-lô, viết; đó là dấu hiệu trong mọi thư; tôi viết như vậy.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “Lời chào do chính tay tôi, Phao-lô, viết—đó là dấu hiệu trong mọi thư; tôi viết như vậy.” Mệnh đề cuối cũng có thể dịch sát hơn: “tôi viết theo cách này.”'
    reason: Giữ cách nối các mệnh đề gần nguyên văn hơn và phản ánh khả năng của οὕτως γράφω là “tôi viết như vậy/theo cách này”.
lexical_decisions:
- source_word: Ὁ ἀσπασμὸς
  choice: Lời chào này
  rationale: ἀσπασμός chỉ lời chào ở cuối thư; thêm “này” tự nhiên trong tiếng Việt và hướng đến chính lời chào do Phao-lô viết.
- source_word: τῇ ἐμῇ χειρὶ Παύλου
  choice: do chính tay tôi, Phao-lô, viết
  rationale: Cụm tặng cách diễn tả việc chính Phao-lô tự tay viết; cách diễn đạt này rõ nghĩa và giữ Παύλου như lời tự xác nhận danh tính.
- source_word: σημεῖον
  choice: dấu hiệu
  rationale: σημεῖον ở đây là dấu hiệu nhận biết hoặc xác thực thư, nên “dấu hiệu” vừa trực tiếp vừa phổ thông.
- source_word: ἐν πάσῃ ἐπιστολῇ
  choice: trong mọi thư
  rationale: Giữ phạm vi khái quát của πᾶς và dùng “thư” thay vì một thuật ngữ giáo hội trang trọng hơn.
- source_word: οὕτως γράφω
  choice: tôi viết như thế này
  rationale: Giữ sắc thái chỉ cách thức của οὕτως và mối liên hệ với nét chữ làm dấu hiệu xác thực, nhưng không giải thích quá mức.
theological_decisions:
- issue: Ý nghĩa của lời xác nhận do chính tay Phao-lô viết
  choice: Trình bày lời chào viết tay như một dấu hiệu nhận biết trong các thư của ông.
  alternative: 'Mệnh đề cuối có thể chỉ là lời xác nhận hẹp hơn về hành động đang viết: “tôi viết như vậy.”'
  rationale: Ngữ cảnh và cụm “dấu hiệu trong mọi thư” thiên về chức năng xác thực, nhưng bản dịch cùng chú thích vẫn giữ khả năng hiểu οὕτως theo nghĩa “như vậy”.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng vừa phải và dễ hiểu. Dùng câu ngắn để tránh một chuỗi mệnh đề quan hệ nặng nề, đồng thời giữ chức năng xác thực của lời viết tay.
