id: 2TH.3.10
reference: 2 Thessalonians 3:10
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ γὰρ ὅτε ἦμεν πρὸς ὑμᾶς, τοῦτο παρηγγέλλομεν ὑμῖν, ὅτι εἴ τις οὐ θέλει ἐργάζεσθαι μηδὲ ἐσθιέτω.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/010.yaml
  text: 'For even when we were with you, we kept commanding you this: if anyone is not willing to work, neither let him eat.'
translation:
  language: vi
  text: 'Vì ngay cả khi còn ở với anh em, chúng tôi vẫn truyền cho anh em điều này: nếu ai không muốn làm việc[a] thì cũng đừng ăn.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn nói “không muốn làm việc”, chỉ sự không sẵn lòng chứ không phải không có khả năng làm việc.
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “thì cũng không được ăn.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ γὰρ
  choice: Vì ngay cả
  rationale: “Vì” giữ chức năng giải thích của γάρ, còn “ngay cả” thể hiện sắc thái nhấn mạnh của καί và nối câu này với gương mẫu vừa nêu ở câu trước.
- source_word: ὅτε ἦμεν πρὸς ὑμᾶς
  choice: khi còn ở với anh em
  rationale: πρός với đại từ chỉ người ở đây diễn tả việc hiện diện và ở cùng họ; cách nói này tự nhiên trong tiếng Việt hiện đại.
- source_word: τοῦτο
  choice: điều này
  rationale: Đại từ chỉ định hướng tới nội dung mệnh lệnh theo sau; không cần thêm danh từ “mệnh lệnh” vì động từ đã biểu đạt ý truyền bảo.
- source_word: παρηγγέλλομεν
  choice: chúng tôi vẫn truyền cho anh em
  rationale: “Truyền” giữ lực mệnh lệnh của động từ, còn “vẫn” giúp thể hiện hành động đang tiếp diễn hoặc được lặp lại trong quá khứ của thì chưa hoàn thành.
- source_word: ὅτι
  choice: ':'
  rationale: ὅτι giới thiệu nội dung được truyền; dấu hai chấm diễn đạt quan hệ này tự nhiên trong tiếng Việt.
- source_word: εἴ τις
  choice: nếu ai
  rationale: Cách diễn đạt điều kiện bất định này ngắn gọn, tự nhiên và giữ phạm vi áp dụng chung.
- source_word: οὐ θέλει ἐργάζεσθαι
  choice: không muốn làm việc
  rationale: θέλει nói đến ý muốn hoặc sự sẵn lòng, không nói đến khả năng. “Không muốn” tự nhiên hơn “không sẵn lòng” và không mạnh quá mức như “từ chối” hay “không chịu”.
- source_word: μηδὲ ἐσθιέτω
  choice: thì cũng đừng ăn
  rationale: “Cũng” giữ quan hệ tiếp nối của μηδέ, còn “đừng ăn” diễn đạt tự nhiên lực mệnh lệnh ngôi thứ ba trong một nguyên tắc áp dụng chung.
theological_decisions:
- issue: Câu này nói về người không thể làm việc hay người không muốn làm việc
  choice: Dịch là “nếu ai không muốn làm việc”, xác định đối tượng là người thiếu ý muốn làm việc.
  alternative: nếu ai không thể làm việc
  rationale: θέλει chỉ ý muốn. Dịch theo nghĩa không có khả năng sẽ áp đặt lên câu một nguyên tắc khắc nghiệt hơn điều bản Hy Lạp nói và làm lu mờ trọng tâm đạo đức về sự lười biếng có chủ ý.
- issue: Cách diễn đạt chủ thể số ít mang nghĩa đại diện trong mệnh đề kết quả
  choice: 'Dùng cấu trúc tiếng Việt lược chủ ngữ: “thì cũng đừng ăn”, trong đó chủ thể được hiểu là chính “ai” ở mệnh đề điều kiện.'
  alternative: thì họ cũng đừng ăn
  rationale: Tiếng Việt tự nhiên có thể giữ cùng một chủ thể mà không lặp lại đại từ. Cách này vừa bảo toàn số ít bất định của τις vừa tránh phải gán giới tính không được biểu thị trong tiếng Việt.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Anh em” phù hợp lối xưng hô cộng đồng trong thư tín Tân Ước; “truyền” giữ thẩm quyền của lời chỉ dẫn mà không dùng cách nói quá hành chính. Cấu trúc “nếu ai… thì…” tự nhiên trong tiếng Việt và bảo toàn tính khái quát của câu.
