  source_fidelity: Chính văn phản ánh đúng lời cầu chúc qua thể nguyện ước của κατευθύναι, giữ hình ảnh «lòng», cấu trúc song hành với εἰς, và không thêm trạng từ thời gian. «Tình yêu của Đức Chúa Trời» và «sự kiên trì của Đấng Mê-si-a» bảo tồn cách diễn đạt sở hữu cách đa nghĩa trong tiếng Hy Lạp.
