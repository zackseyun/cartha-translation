  terminology: '«Chúa», «Đức Chúa Trời», và «Đấng Mê-si-a» nhất quán với sắc thái tước hiệu của κύριος và Χριστός. «Sự kiên trì» truyền đạt tốt ὑπομονή. Cần chỉnh chú thích a: nguyên văn không nói rõ đối tượng của tình yêu Đức Chúa Trời là «anh chị em», nên không nên thêm sự xác định đó.'
