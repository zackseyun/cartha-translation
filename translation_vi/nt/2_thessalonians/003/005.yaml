id: 2TH.3.5
reference: 2 Thessalonians 3:5
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὁ δὲ κύριος κατευθύναι ὑμῶν τὰς καρδίας εἰς τὴν ἀγάπην τοῦ θεοῦ καὶ εἰς τὴν ὑπομονὴν τοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/005.yaml
  text: May the Lord direct your hearts into the love of God and into the steadfastness of Messiah[a][b][c].
translation:
  language: vi
  text: Nguyện Chúa hướng lòng anh chị em vào tình yêu của Đức Chúa Trời[a] và vào sự kiên trì của Đấng Mê-si-a[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “lòng yêu mến Đức Chúa Trời.” Cụm từ Hy Lạp cũng có thể chỉ tình yêu đến từ Đức Chúa Trời.'
    reason: alternative_reading
  - marker: b
    text: 'Cũng có thể dịch: “sự kiên trì của chính Đấng Mê-si-a” hoặc “lòng kiên trì hướng về Đấng Mê-si-a.”'
    reason: alternative_reading
  - marker: c
    text: Tiếng Hy Lạp là Christos, nghĩa là “Đấng Mê-si-a” hay “Đấng Được Xức Dầu”; ở đây từ này được dùng như một tước hiệu.
    reason: lexical_alternative
lexical_decisions:
- source_word: κύριος
  choice: Chúa
  rationale: Cách gọi trang trọng, quen thuộc trong Tân Ước, giữ được sức nặng của tước hiệu thần linh/Cơ Đốc học mà không xác định quá mức đối tượng được nói đến.
- source_word: κατευθύναι
  choice: hướng
  rationale: 'Thể optative diễn tả lời cầu chúc: “Nguyện ... hướng”. “Hướng lòng” vừa tự nhiên vừa giữ ý dẫn dắt hay làm cho đi đúng hướng.'
- source_word: καρδίας
  choice: lòng
  rationale: “Lòng” là cách diễn đạt Kinh Thánh tự nhiên trong tiếng Việt cho trung tâm của tư tưởng, ý chí và tình cảm, đồng thời tránh thu hẹp nghĩa thành riêng trí óc hay cảm xúc.
- source_word: ἀγάπην
  choice: tình yêu
  rationale: Tương đương phổ thông, rõ ràng và phù hợp với văn phong trang trọng hiện đại.
- source_word: τοῦ θεοῦ
  choice: của Đức Chúa Trời
  rationale: Giữ cấu trúc sở hữu vốn có thể chỉ tình yêu Đức Chúa Trời dành cho con người, tình yêu con người dành cho Đức Chúa Trời, hoặc phạm vi/phẩm chất của tình yêu thuộc về Ngài; chú thích nêu rõ các khả năng.
- source_word: ὑπομονὴν
  choice: sự kiên trì
  rationale: Diễn tả sức bền bỉ, đứng vững dưới áp lực. “Sự kiên trì” dễ hiểu trong tiếng Việt hiện đại và phù hợp với lời cầu xin về khuynh hướng nội tâm.
- source_word: τοῦ Χριστοῦ
  choice: của Đấng Mê-si-a
  rationale: Χριστός mang chức năng tước hiệu nên được dịch là “Đấng Mê-si-a”. Cấu trúc “của” giữ phần nào tính đa nghĩa của sở hữu cách, còn chú thích trình bày các cách hiểu chính.
theological_decisions:
- issue: Sở hữu cách đa nghĩa trong τὴν ἀγάπην τοῦ θεοῦ
  choice: “tình yêu của Đức Chúa Trời”, không giải quyết dứt khoát chiều hướng của tình yêu
  alternative: “lòng yêu mến Đức Chúa Trời” hoặc “tình yêu Đức Chúa Trời dành cho anh chị em”
  rationale: Sở hữu cách Hy Lạp thực sự có thể được hiểu theo chiều chủ thể, đối thể, hoặc rộng hơn là phạm vi của tình yêu thần thượng. Bản dịch chính giữ sự căng thẳng thần học này, còn chú thích giúp độc giả nhận ra các khả năng.
- issue: Sở hữu cách đa nghĩa trong τὴν ὑπομονὴν τοῦ Χριστοῦ
  choice: “sự kiên trì của Đấng Mê-si-a”
  alternative: “lòng kiên trì hướng về Đấng Mê-si-a” hoặc “sự kiên trì như Đấng Mê-si-a”
  rationale: Cụm từ có thể chỉ chính sự kiên trì của Đấng Mê-si-a, sự kiên trì hướng về Ngài, hoặc sự kiên trì mang phẩm chất được Ngài thể hiện. Không nên chọn riêng một cách hiểu trong chính văn.
- issue: Cách dịch Χριστοῦ
  choice: Đấng Mê-si-a
  alternative: Đấng Christ
  rationale: Từ Hy Lạp ở đây là một tước hiệu, vì vậy dịch nghĩa là “Đấng Mê-si-a” thay vì chỉ phiên âm theo truyền thống.
translation_notes:
  register: Văn phong tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh chị em” cho số nhiều cộng đồng; giữ ẩn dụ “lòng” và cấu trúc song hành “vào ... và vào ...”. Không thêm từ chỉ thời gian tương ứng với “bây giờ”, vì nguyên văn không có trạng từ ấy.
