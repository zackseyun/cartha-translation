revisions:
- from: Đừng xem người ấy như kẻ thù, nhưng hãy khuyên bảo như một anh em[a].
  to: Đừng coi người ấy như kẻ thù, nhưng hãy khuyên bảo người ấy như một người anh em[a].
  rationale: 'Chỉnh nhẹ để câu tự nhiên và minh bạch hơn trong tiếng Việt hiện đại: thay «xem» bằng «coi», thay «một anh em» bằng «một người anh em», và nêu lại đối tượng ở vế thứ hai. Bản sửa vẫn giữ nguyên thế tương phản, sắc thái sửa dạy, và cách gọi giống đực số ít của nguyên ngữ.'
