review_pass:
  verdict: revise
  source_fidelity: Bản nháp truyền đạt đúng tương phản của καὶ μὴ ... ἀλλὰ, ý nghĩa của ἡγεῖσθε («coi/xem»), ἐχθρόν («kẻ thù»), và lực sửa dạy có quan tâm của νουθετεῖτε. Tuy nhiên, việc lặp lại «người ấy» ở vế sau làm rõ đối tượng ngầm định của động từ số nhiều, còn «một người anh em» diễn đạt tự nhiên và rõ hơn tư cách cộng đồng mà ὡς ἀδελφόν nêu ra.
  naturalness: «Như một anh em» không thật tự nhiên trong tiếng Việt hiện đại, vì «anh em» thường được dùng như cách xưng hô/tập hợp. «Như một người anh em» là cách nói rõ ràng, tự nhiên, vẫn giữ danh từ giống đực số ít của nguyên ngữ. «Coi» cũng tự nhiên hơn đôi chút trong kết hợp «coi ... như».
  terminology: Giữ «kẻ thù», «khuyên bảo», và «người anh em» là phù hợp với văn phong Kinh Thánh tiếng Việt hiện đại. Chú thích giải thích đúng nghĩa đại diện theo ngữ cảnh cộng đồng đức tin, không áp đặt cách hiểu giáo phái.
  issues:
  - severity: low
    issue: Cụm «như một anh em» hơi gượng và có thể mơ hồ trong tiếng Việt.
    rationale: ἀδελφόν là danh từ số ít, chỉ người đang được khuyên bảo trong tư cách thành viên cộng đồng. «Như một người anh em» rõ và tự nhiên hơn, không thay đổi nghĩa.
  - severity: low
    issue: Vế thứ hai không nêu lại đối tượng của «khuyên bảo».
    rationale: Đối tượng được hiểu từ ngữ cảnh và bản nháp không sai, nhưng thêm «người ấy» giúp câu tiếng Việt cân đối và làm rõ rằng người này phải được khuyên bảo, chứ không phải người nói khuyên bảo theo cách của một anh em.
  revised_text: Đừng coi người ấy như kẻ thù, nhưng hãy khuyên bảo người ấy như một người anh em[a].
  revised_footnotes:
