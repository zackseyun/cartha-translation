source:
  edition: SBLGNT
  text: καὶ μὴ ὡς ἐχθρὸν ἡγεῖσθε, ἀλλὰ νουθετεῖτε ὡς ἀδελφόν.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/015.yaml
  text: And do not regard him as an enemy[b][a], but admonish him as a brother.
translation:
  language: vi
  text: Đừng coi người ấy như kẻ thù, nhưng hãy khuyên bảo người ấy như một người anh em[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Người anh em” ở đây chỉ một người cùng đức tin; theo cách dùng đại diện, từ này có thể chỉ một thành viên của cộng đồng Cơ Đốc.
    reason: cultural_note
lexical_decisions:
- source_word: ἡγεῖσθε
  choice: xem
  rationale: Trong cấu trúc này, động từ chỉ việc đánh giá hay coi một người thuộc một hạng nào đó. “Xem ... như” tự nhiên trong tiếng Việt hiện đại và giữ đúng sắc thái nhận định.
- source_word: ἐχθρόν
  choice: kẻ thù
  rationale: Cụm từ chỉ người bị coi là đối địch. “Kẻ thù” là cách diễn đạt rõ ràng, thông dụng và tương ứng trực tiếp.
- source_word: νουθετεῖτε
  choice: khuyên bảo
  rationale: Động từ mang ý nhắc nhở, cảnh cáo hoặc sửa dạy nhằm điều chỉnh hành vi. “Khuyên bảo” giữ được mục đích sửa trị cùng thái độ quan tâm, không quá nhẹ như chỉ “chỉ dạy” và không quá hẹp như “cảnh cáo”.
- source_word: ἀδελφόν
  choice: một anh em
  rationale: Danh từ số ít giống đực được giữ trong chính văn; ở đây nó chỉ một người cùng thuộc cộng đồng đức tin. Chú thích giải thích phạm vi đại diện của cách gọi này.
- source_word: ὡς
  choice: như
  rationale: Ở cả hai vế, từ này xác định tư cách hoặc cách thức nhìn nhận và khuyên bảo người ấy; “như” là cách diễn đạt trực tiếp, tự nhiên.
- source_word: καὶ μὴ ... ἀλλὰ
  choice: Đừng ... nhưng hãy ...
  rationale: Cấu trúc tương phản được chuyển tự nhiên sang tiếng Việt bằng mệnh lệnh phủ định đi với mệnh lệnh tích cực. Không dịch riêng καί ở đầu câu giúp câu Việt gọn mà vẫn nối tiếp rõ với lời dạy trước đó.
theological_decisions:
- issue: Thái độ khi sửa trị người không vâng lời trong cộng đồng
  choice: 'Phân biệt việc sửa trị với thái độ thù địch: vẫn khuyên bảo người ấy như người cùng cộng đồng đức tin.'
  alternative: Có thể hiểu rộng hơn như lời khuyên về xung đột giữa các cá nhân.
  rationale: Ngữ cảnh 2 Tê-sa-lô-ni-ca 3:14–15 nói về người trong cộng đồng không vâng theo lời thư, cần được nhận diện và giữ khoảng cách để họ biết hổ thẹn. Cách gọi “anh em” cho thấy mối liên hệ cộng đồng vẫn được nhìn nhận, nhưng câu không được diễn giải quá mức thành một mô hình kỷ luật giáo hội cụ thể.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Người ấy” nối tự nhiên với đối tượng được nói đến trong câu trước; “khuyên bảo” diễn đạt sự sửa dạy có quan tâm. Không thêm chú thích cho ἡγεῖσθε vì “xem” và “coi” không tạo khác biệt ý nghĩa đáng kể trong tiếng Việt.
