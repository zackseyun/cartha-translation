  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὑμεῖς δέ, ἀδελφοί, μὴ ⸀ἐγκακήσητε καλοποιοῦντες.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/013.yaml
  text: But as for you[a], brothers, do not grow weary in doing good.
translation:
  language: vi
  text: Còn anh em[a], đừng nản lòng khi làm điều lành.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể hiểu là “anh chị em”; tiếng Hy Lạp dùng từ “anh em”, nhưng từ này có thể được dùng để gọi chung toàn thể cộng đồng tín hữu, gồm cả nam lẫn nữ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς δέ
  choice: Còn anh em
  rationale: Đại từ ὑμεῖς được đặt ở vị trí nhấn mạnh, còn δέ tạo thế tương phản với những người sống vô kỷ luật vừa được nói đến. “Còn anh em” diễn đạt tự nhiên cả sự chuyển ý lẫn nét nhấn mạnh ấy trong tiếng Việt.
- source_word: ἀδελφοί
  choice: anh em
  rationale: Danh từ hô cách số nhiều có nghĩa đen là “anh em” và trong văn cảnh có thể dùng để gọi toàn thể cộng đồng tín hữu, gồm cả nam lẫn nữ. Bản dịch giữ hình thức của nguyên ngữ, đồng thời giải thích phạm vi bao hàm trong chú thích.
- source_word: μὴ ἐγκακήσητε
  choice: đừng nản lòng
  rationale: Cấu trúc μή với động từ giả định bất định mang ý cấm đoán. ἐγκακέω có thể chỉ sự nản chí, mất lòng kiên trì hoặc mệt mỏi đến mức thôi làm; “đừng nản lòng” tự nhiên và giữ trọng tâm vào sự bền chí.
- source_word: καλοποιοῦντες
  choice: khi làm điều lành
  rationale: Phân từ hiện tại diễn tả hoạt động đang tiếp diễn mà trong đó họ không được nản lòng. “Khi làm điều lành” là cách nói rõ ràng, tự nhiên và không thu hẹp việc lành vào một loại hành động cụ thể.
theological_decisions:
- issue: Cách dịch ἀδελφοί khi Phao-lô ngỏ lời với hội chúng
  choice: anh em
  alternative: anh chị em
  rationale: Hình thức Hy Lạp là giống đực số nhiều nhưng rất có thể hướng đến toàn thể hội chúng. Bản văn chính giữ cách diễn đạt sát hình thức nguyên ngữ, còn chú thích bảo toàn khả năng bao hàm cả nam lẫn nữ mà không áp đặt cách hiểu vào câu.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. “Còn anh em” tạo nét tương phản tự nhiên; “đừng nản lòng” truyền đạt lời khuyên kiên trì mà không làm mất sắc thái của động từ Hy Lạp.
