id: 2TH.3.2
reference: 2 Thessalonians 3:2
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἵνα ῥυσθῶμεν ἀπὸ τῶν ἀτόπων καὶ πονηρῶν ἀνθρώπων, οὐ γὰρ πάντων ἡ πίστις.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/002.yaml
  text: and that we may be delivered from wicked and evil men[b][a], for not all have faith.
translation:
  language: vi
  text: và để chúng tôi được giải cứu khỏi những kẻ ngang ngược[a] và gian ác, vì không phải ai cũng có đức tin.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “vô lý” hoặc “xấu xa.” Từ Hy Lạp có thể mang nghĩa trái lẽ, không đúng mực hay lệch lạc.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “vì không phải ai cũng trung tín.” Câu Hy Lạp nói sát chữ: “vì đức tin không thuộc về tất cả.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ῥυσθῶμεν
  choice: được giải cứu
  rationale: 'Động từ ở thể thụ động, lối giả định sau ἵνα diễn tả mục đích: được cứu thoát khỏi những người chống đối.'
- source_word: ἀτόπων
  choice: ngang ngược
  rationale: Từ này có thể chỉ điều trái lẽ, không đúng mực hoặc lệch lạc. “Ngang ngược” tự nhiên trong tiếng Việt, diễn tả cách hành xử trái lẽ mà không đồng nhất hoàn toàn với πονηρῶν.
- source_word: πονηρῶν
  choice: gian ác
  rationale: 'Diễn đạt rõ ý nghĩa luân lý của từ: ác độc, xấu xa.'
- source_word: ἀνθρώπων
  choice: những kẻ
  rationale: Trong ngữ cảnh nói về một nhóm người chống đối cụ thể, “những kẻ” kết hợp tự nhiên với hai tính từ mang nghĩa tiêu cực; tiếng Hy Lạp không buộc bản dịch tiếng Việt phải xác định giới tính.
- source_word: πίστις
  choice: đức tin
  rationale: Trong ngữ cảnh sứ mạng bị những người chống đối cản trở, nghĩa “đức tin” là cách hiểu tự nhiên nhất; khả năng mang nghĩa “sự trung tín” được giữ trong chú thích.
- source_word: οὐ γὰρ πάντων ἡ πίστις
  choice: vì không phải ai cũng có đức tin
  rationale: Câu Hy Lạp nói sát chữ là “vì đức tin không thuộc về tất cả.” Bổ sung “có” tạo câu tiếng Việt tự nhiên mà không biến câu này thành một khẳng định thần học mạnh hơn nguyên văn.
theological_decisions:
- issue: Nghĩa của πίστις trong mệnh đề οὐ γὰρ πάντων ἡ πίστις
  choice: đức tin
  alternative: sự trung tín; vì không phải ai cũng trung tín
  rationale: “Đức tin” phù hợp hơn với ngữ cảnh những người chống đối sứ điệp, nhưng πίστις có thể chỉ sự trung tín; chú thích bảo tồn khả năng thực sự này.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Ngang ngược” giữ sự phân biệt sắc thái giữa ἀτόπων và πονηρῶν; “những kẻ” phù hợp với ngữ cảnh tiêu cực mà không thêm giới tính không được nguyên văn xác định.
