source:
  edition: SBLGNT
  text: τοῖς δὲ τοιούτοις παραγγέλλομεν καὶ παρακαλοῦμεν ⸂ἐν κυρίῳ Ἰησοῦ Χριστῷ⸃ ἵνα μετὰ ἡσυχίας ἐργαζόμενοι τὸν ἑαυτῶν ἄρτον ἐσθίωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/012.yaml
  text: To such people we command and urge in the Lord Jesus the Messiah that[a], working quietly[c][b], they should eat their own bread.
translation:
  language: vi
  text: Còn những người như thế, chúng tôi ra lệnh và khuyên nhủ trong Chúa Giê-su, Đấng Mê-si[a], rằng họ hãy làm việc cách yên lặng và ăn bánh của chính mình[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “trong Chúa Giê-su Christ.” Từ Hy Lạp Χριστός là một tước hiệu, nghĩa là “Đấng Mê-si.”
    reason: lexical_alternative
  - marker: b
    text: “Bánh của chính mình” chỉ sự sinh sống bằng thành quả lao động của chính họ.
    reason: idiom_clarification
lexical_decisions:
- source_word: τοῖς δὲ τοιούτοις
  choice: Còn những người như thế
  rationale: Cụm từ chỉ lại những người sống vô kỷ luật và không chịu làm việc ở câu trước; “còn” thể hiện nhẹ sắc thái chuyển ý của δέ.
- source_word: παραγγέλλομεν καὶ παρακαλοῦμεν
  choice: chúng tôi truyền bảo và khuyên nhủ
  rationale: Giữ cả thẩm quyền của παραγγέλλω lẫn lời kêu gọi tha thiết của παρακαλέω.
- source_word: ἐν κυρίῳ Ἰησοῦ Χριστῷ
  choice: trong Chúa Giê-su, Đấng Mê-si
  rationale: “Trong” giữ được ý về phạm vi, sự hiệp nhất hoặc thẩm quyền; Χριστός ở đây được giữ như một tước hiệu.
- source_word: μετὰ ἡσυχίας ἐργαζόμενοι
  choice: yên lặng làm việc
  rationale: Diễn đạt lối làm việc bình lặng, ổn định, đối lập với việc sống vô công rồi xen vào chuyện người khác trong văn cảnh.
- source_word: τὸν ἑαυτῶν ἄρτον ἐσθίωσιν
  choice: ăn bánh do chính mình làm ra
  rationale: Giữ hình ảnh cụ thể “bánh” đồng thời làm rõ ý sinh sống bằng lao động của chính mình, không phải nghĩa sở hữu thức ăn theo nghĩa đen.
theological_decisions:
- issue: Cách dịch Χριστός
  choice: Đấng Mê-si
  alternative: Đấng Christ
  rationale: Trong cụm này, Χριστός vẫn hoạt động như tước hiệu của Chúa Giê-su; “Đấng Mê-si” làm rõ chức năng ấy.
- issue: Sắc thái của lời chỉ dạy từ các sứ đồ
  choice: giữ cả “truyền bảo” và “khuyên nhủ”
  alternative: gộp thành “khuyên dạy”
  rationale: Nguyên văn cố ý kết hợp mệnh lệnh có thẩm quyền với lời thúc giục mang tính mục vụ.
- issue: Ý nghĩa của “ăn bánh của chính mình”
  choice: ăn bánh do chính mình làm ra
  alternative: ăn bánh của chính mình
  rationale: Cách chọn nêu rõ mối liên hệ với lao động trong chính câu này nhưng vẫn giữ hình ảnh “bánh”, không biến câu thành một tuyên bố tuyệt đối về quyền sở hữu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Truyền bảo” tránh sắc thái hành chính quá mạnh của “ra lệnh” nhưng vẫn giữ thẩm quyền; “yên lặng làm việc” tự nhiên hơn lối danh từ hóa “làm việc với sự yên lặng” trong tiếng Việt.
