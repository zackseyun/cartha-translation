  to: Còn những người như thế, chúng tôi ra lệnh và khuyên nhủ trong Chúa Giê-su, Đấng Mê-si[a], rằng họ hãy làm việc cách yên lặng và ăn bánh của chính mình[b].
  rationale: Sửa cụm về “bánh” để khôi phục cách nói sở hữu của nguyên văn và chỉ giải thích ý hàm ẩn trong chú thích. Điều chỉnh cách diễn đạt μετὰ ἡσυχίας để tránh nghĩa “im lặng” quá hẹp. “Ra lệnh” thay “truyền bảo” nhằm thể hiện trực tiếp và tự nhiên lực của παραγγέλλομεν, đồng thời vẫn giữ động từ “khuyên nhủ” riêng biệt.
