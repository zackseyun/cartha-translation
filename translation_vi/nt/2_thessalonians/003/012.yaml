  source_fidelity: 'Bản dịch giữ được đối tượng được nhắc lại, hai động từ mang sắc thái mệnh lệnh và khuyên nhủ, cùng cụm “trong Chúa Giê-su, Đấng Mê-si”. Tuy nhiên, “bánh do chính mình làm ra” thu hẹp và thay đổi hình ảnh nguyên văn: τὸν ἑαυτῶν ἄρτον là “bánh của chính mình”, tức sinh kế do mình có được, chứ không nói họ trực tiếp làm ra chiếc bánh.'
