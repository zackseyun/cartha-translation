  - severity: low
    issue: Sắc thái nguồn gốc bị mạo nhận cần rõ hơn
    rationale: ὡς δι’ ἡμῶν là điều được trình bày như đến qua/từ nhóm tác giả, không chỉ là điều “dường như” có thể đến từ họ. “như thể từ chúng tôi” phản ánh tốt hơn sắc thái này.
