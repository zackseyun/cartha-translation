id: 2TH.2.2
reference: 2 Thessalonians 2:2
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εἰς τὸ μὴ ταχέως σαλευθῆναι ὑμᾶς ἀπὸ τοῦ νοὸς ⸀μηδὲ θροεῖσθαι μήτε διὰ πνεύματος μήτε διὰ λόγου μήτε δι’ ἐπιστολῆς ὡς δι’ ἡμῶν, ὡς ὅτι ἐνέστηκεν ἡ ἡμέρα τοῦ ⸀κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/002.yaml
  text: that you not be quickly shaken from your mind or alarmed[a], either by a spirit or by a message or by a letter as if from us[b], to the effect that the day of the Lord has come.
translation:
  language: vi
  text: để anh chị em không nhanh chóng bị lung lay trong tâm trí hoặc hoảng hốt, dù qua một thần linh[a], một lời nói hay một thư như thể từ chúng tôi, cho rằng ngày của Chúa đã đến[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “một phát ngôn thuộc linh” hoặc “một mặc khải tiên tri.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “đang hiện diện.” Dạng hoàn thành trong tiếng Hy Lạp có thể diễn tả lời quả quyết rằng ngày của Chúa đã đến và nay đang hiện diện.'
    reason: alternative_reading
lexical_decisions:
- source_word: ταχέως
  choice: vội
  rationale: Diễn tả việc bị dao động nhanh chóng hoặc quá dễ dàng; “vội” tự nhiên trong lời khuyên răn tiếng Việt.
- source_word: σαλευθῆναι
  choice: bị lay chuyển
  rationale: Giữ hình ảnh bị rung chuyển của động từ Hy Lạp, đồng thời phù hợp với trạng thái tinh thần.
- source_word: ἀπὸ τοῦ νοὸς
  choice: khỏi sự sáng suốt
  rationale: Cụm Hy Lạp chỉ việc rời khỏi trạng thái suy xét ổn định; dịch sát từng chữ là “khỏi tâm trí” kém tự nhiên và có thể gây hiểu lầm trong tiếng Việt.
- source_word: θροεῖσθαι
  choice: hoảng hốt
  rationale: Truyền đạt sắc thái bị khuấy động và báo động mạnh, nhưng không nhất thiết đến mức kinh hãi.
- source_word: πνεύματος
  choice: một thần
  rationale: Giữ cách diễn đạt không có mạo từ và sự mơ hồ của nguyên văn; trong ngữ cảnh có thể chỉ một phát ngôn hoặc mặc khải được cho là thuộc linh, nên ghi chú nêu phương án ấy.
- source_word: λόγου
  choice: một lời truyền
  rationale: Chỉ một thông điệp được nói hoặc lưu truyền, tương phản với thư viết; tự nhiên hơn “một lời” đứng riêng.
- source_word: ἐπιστολῆς
  choice: một thư
  rationale: Cách gọi hiện đại, thông dụng cho văn bản thư tín.
- source_word: ὡς δι’ ἡμῶν
  choice: dường như đến từ chúng tôi
  rationale: Thể hiện việc nguồn tin được gán cho Phao-lô và các cộng sự mà không khẳng định thư ấy thực sự do họ gửi.
- source_word: ἐνέστηκεν
  choice: đã đến
  rationale: Thì hoàn thành diễn tả một biến cố được cho là đã xảy đến và hiện đang có hiệu lực; ghi chú bảo lưu nghĩa sát hơn là “hiện đã ở đây”.
- source_word: ἡμέρα τοῦ κυρίου
  choice: ngày của Chúa
  rationale: Cụm cánh chung quen thuộc, không phải tên một ngày thờ phượng hằng tuần.
theological_decisions:
- issue: Ý nghĩa của ἐνέστηκεν trong lời tuyên bố cánh chung
  choice: đã đến
  alternative: hiện đã ở đây
  rationale: Bản dịch chính diễn đạt tự nhiên kết quả hiện tại của hành động đã xảy đến, còn ghi chú bảo lưu sắc thái hiện diện vốn có thể ảnh hưởng đến cách hiểu cánh chung.
- issue: Ý nghĩa của πνεύματος trong ba nguồn tin được nêu
  choice: một thần
  alternative: một phát ngôn thuộc linh; một mặc khải tiên tri
  rationale: Không tự động đồng nhất danh từ không có mạo từ với Đức Thánh Linh; giữ cách dịch trực tiếp trong chính văn và nêu nghĩa theo ngữ cảnh trong ghi chú.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh chị em” để xưng hô với cộng đồng tín hữu; giữ hình ảnh “lay chuyển” nhưng chuyển thành ngữ ἀπὸ τοῦ νοὸς sang “khỏi sự sáng suốt” cho tự nhiên. Mọi phương án có ý nghĩa thần học đáng kể đều được bảo lưu bằng ghi chú.
