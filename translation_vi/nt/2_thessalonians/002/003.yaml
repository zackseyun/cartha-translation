  - severity: low
    issue: “đứa con của sự hủy diệt”
    rationale: “Đứa con” thường chỉ trẻ nhỏ trong tiếng Việt, trong khi thành ngữ Hy Lạp gọi một nhân vật trưởng thành. “Con của sự hủy diệt” vừa tự nhiên hơn vừa giữ tính mơ hồ của nguyên văn.
  - severity: low
    issue: Vị trí các chú thích
    rationale: Chú thích về nghĩa thay thế của ἀποστασία nên đặt sau “sự phản loạn”; chú thích dị bản phải đặt sau cụm chịu ảnh hưởng “kẻ vô luật pháp,” để neo chú thích rõ ràng.
