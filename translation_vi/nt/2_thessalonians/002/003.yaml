id: 2TH.2.3
reference: 2 Thessalonians 2:3
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: μή τις ὑμᾶς ἐξαπατήσῃ κατὰ μηδένα τρόπον· ὅτι ἐὰν μὴ ἔλθῃ ἡ ἀποστασία πρῶτον καὶ ἀποκαλυφθῇ ὁ ἄνθρωπος τῆς ⸀ἀνομίας, ὁ υἱὸς τῆς ἀπωλείας,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/003.yaml
  text: Let no one deceive you in any way[a], because that day will not come unless the rebellion comes first and the man of lawlessness is revealed[b], the son of destruction.
translation:
  language: vi
  text: Đừng để bất cứ ai lừa dối anh chị em bằng bất kỳ cách nào, vì ngày ấy sẽ không đến nếu sự phản loạn[a] chưa xảy ra trước và kẻ vô luật pháp[b] chưa được bày tỏ—con của sự hủy diệt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Sự phản loạn” cũng có thể dịch là “sự bội đạo” hoặc “sự sa ngã.” Từ Hy Lạp có thể chỉ một cuộc phản loạn quyết liệt, thường được hiểu là sự lìa bỏ đức tin.
    reason: alternative_reading
  - marker: b
    text: Một số thủ bản chép “kẻ tội lỗi” thay cho “kẻ vô luật pháp.”
    reason: textual_variant
lexical_decisions:
- source_word: ἐξαπατήσῃ
  choice: lừa dối
  rationale: Diễn đạt tự nhiên hành vi đánh lừa hoặc làm cho lầm lạc, không nhấn quá mức sắc thái của tiền tố.
- source_word: κατὰ μηδένα τρόπον
  choice: bằng bất kỳ cách nào
  rationale: Giữ nguyên sức nhấn mạnh rằng không được để sự lừa dối xảy ra dưới bất cứ hình thức nào.
- source_word: ἐὰν μὴ ἔλθῃ
  choice: sẽ không đến nếu ... chưa xảy ra
  rationale: Bổ sung chủ thể hàm ẩn “ngày ấy” từ câu trước và diễn đạt điều kiện tiên quyết theo cách tự nhiên trong tiếng Việt.
- source_word: ἡ ἀποστασία
  choice: sự phản loạn
  rationale: Giữ nghĩa rộng của một cuộc nổi loạn hoặc sự lìa bỏ có tính quyết định, không thu hẹp ngay thành sự bội đạo về tôn giáo.
- source_word: ἀποκαλυφθῇ
  choice: bị phơi bày
  rationale: Diễn đạt thể bị động và ý một nhân vật được đưa ra ánh sáng, đồng thời tự nhiên hơn trong ngữ cảnh tiêu cực này.
- source_word: ὁ ἄνθρωπος τῆς ἀνομίας
  choice: kẻ vô luật pháp
  rationale: Chuyển thành ngữ sở hữu Hy Lạp sang cách gọi tự nhiên trong tiếng Việt, chỉ một nhân vật nam cụ thể được đặc trưng bởi sự vô luật pháp.
- source_word: ὁ υἱὸς τῆς ἀπωλείας
  choice: đứa con của sự hủy diệt
  rationale: Giữ hình ảnh kiểu Hê-bơ-rơ của nguyên văn và sự mơ hồ giữa đặc tính hủy diệt với số phận bị hủy diệt.
theological_decisions:
- issue: Chủ thể hàm ẩn của động từ “đến”
  choice: Nêu rõ “ngày ấy” theo văn cảnh câu 2
  alternative: 'Giữ câu tỉnh lược: “vì nếu sự phản loạn chưa xảy ra trước...”'
  rationale: Tiếng Hy Lạp dựa vào “ngày của Chúa” ở câu trước; nêu lại “ngày ấy” giúp tiếng Việt rõ và tự nhiên mà không thêm một cách hiểu ngoài văn cảnh trực tiếp.
- issue: Ý nghĩa của ἀποστασία
  choice: sự phản loạn
  alternative: sự bội đạo; sự lìa bỏ
  rationale: Từ này có thể chỉ sự nổi loạn nói chung hoặc sự lìa bỏ đức tin. Cách dịch chính giữ phạm vi rộng; chú thích bảo tồn cách hiểu tôn giáo có cơ sở.
- issue: Dị bản tại τῆς ἀνομίας
  choice: 'Theo SBLGNT: “vô luật pháp”'
  alternative: “tội lỗi” theo một số thủ bản
  rationale: Bản nguồn được cung cấp đọc ἀνομίας; dị bản quen thuộc được ghi chú để bảo đảm tính minh bạch văn bản học.
- issue: Sắc thái của “đứa con của sự hủy diệt”
  choice: Giữ thành ngữ gần hình thức nguyên văn
  alternative: kẻ đã được định cho sự hủy diệt
  rationale: Không giải quyết dứt khoát thành ngữ theo hướng chỉ đặc tính hay định mệnh, nhờ đó bảo tồn sức căng của nguyên văn.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh chị em” để gọi cộng đồng tín hữu; dùng “kẻ” cho nhân vật tiêu cực cụ thể. Trật tự chú thích được đặt ngay sau nội dung tương ứng trong câu.
