  text: τὸ γὰρ μυστήριον ἤδη ἐνεργεῖται τῆς ἀνομίας· μόνον ὁ κατέχων ἄρτι ἕως ἐκ μέσου γένηται.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/007.yaml
  text: For the mystery of lawlessness is already at work[b][a]; only the one who now restrains will do so until he is out of the way.
translation:
  language: vi
  text: Vì mầu nhiệm của sự vô luật pháp đã và đang hoạt động; chỉ có điều, người hiện đang ngăn giữ[a] sẽ tiếp tục làm vậy cho đến khi người ấy không còn hiện diện nữa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “người hiện đang giữ lại.” Tiếng Hy Lạp không cho biết người ngăn giữ này là ai.'
    reason: alternative_reading
  - marker: b
    text: 'Cũng có thể dịch: “cho đến khi người ấy bị loại bỏ” hoặc “bị cất khỏi đó.” Tiếng Hy Lạp không nói rõ việc này xảy ra bằng cách nào hay do ai thực hiện.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μυστήριον
  choice: mầu nhiệm
  rationale: Giữ sắc thái Phao-lô về một thực tại kín giấu đang hoạt động, chứ không biến thành một câu đố đơn thuần.
- source_word: ἐνεργεῖται
  choice: đã hoạt động rồi
  rationale: Diễn đạt hành động đang có hiệu lực ngay trong hiện tại; “rồi” làm nổi bật ἤδη, nghĩa là “đã”.
- source_word: ἀνομίας
  choice: sự vô luật pháp
  rationale: Phản ánh trực tiếp ý niệm chống nghịch luật lệ và giữ liên hệ từ vựng với “kẻ vô luật pháp” trong văn mạch.
- source_word: μόνον
  choice: chỉ có điều
  rationale: Diễn đạt tự nhiên chức năng giới hạn và chuyển ý của μόνον trong một cấu trúc Hy Lạp tỉnh lược.
- source_word: ὁ κατέχων ἄρτι
  choice: người hiện đang ngăn giữ
  rationale: Giữ cấu trúc phân từ chỉ một nhân vật nhưng không xác định danh tính; “ngăn giữ” cũng bảo tồn khả năng hiểu là “giữ lại” hoặc “kìm hãm”.
- source_word: ἕως ἐκ μέσου γένηται
  choice: cho đến khi người ấy không còn ở giữa nữa
  rationale: Giữ hình ảnh “ra khỏi khoảng giữa” và trạng thái kết quả mà không khẳng định người ấy bị một tác nhân nào loại bỏ.
theological_decisions:
- issue: Danh tính của ὁ κατέχων, người đang ngăn giữ
  choice: Dịch chung là “người hiện đang ngăn giữ”, không xác định nhân vật này là ai.
  alternative: Có thể diễn giải là nhà nước Rô-ma, chính quyền loài người, Đức Thánh Linh, một thiên sứ, chính Phao-lô hoặc việc rao giảng của các sứ đồ.
  rationale: Câu Hy Lạp nói đến một nhân vật ngăn giữ nhưng không nêu danh tính; bản dịch cần duy trì sự không xác định này.
- issue: Tác nhân trong ἕως ἐκ μέσου γένηται
  choice: Dùng “không còn ở giữa nữa”, không nói rõ người ấy bị ai loại bỏ.
  alternative: “cho đến khi người ấy bị loại bỏ” hoặc “bị cất khỏi đó”.
  rationale: γένηται với ἐκ μέσου diễn tả việc trở nên không còn ở giữa hoặc không còn án ngữ, nhưng không nêu rõ tác nhân gây ra việc ấy.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại. “Mầu nhiệm” và “sự vô luật pháp” giữ các thuật ngữ chủ đạo của văn mạch; câu chính bổ sung “sẽ tiếp tục làm vậy” để diễn đạt tự nhiên cấu trúc Hy Lạp tỉnh lược mà không xác định thêm danh tính hay tác nhân.
