  to: Vì mầu nhiệm của sự vô luật pháp đã và đang hoạt động; chỉ có điều, người hiện đang ngăn giữ[a] sẽ tiếp tục làm vậy cho đến khi người ấy không còn hiện diện nữa.[b]
