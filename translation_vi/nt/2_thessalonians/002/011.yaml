source:
  edition: SBLGNT
  text: καὶ διὰ τοῦτο ⸀πέμπει αὐτοῖς ὁ θεὸς ἐνέργειαν πλάνης εἰς τὸ πιστεῦσαι αὐτοὺς τῷ ψεύδει,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/011.yaml
  text: And because of this[a], God sends them a working of delusion so that they may believe the lie,
translation:
  language: vi
  text: Chính vì thế, Đức Chúa Trời gửi đến họ một tác động gây mê lầm[a], để họ tin điều dối trá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “một ảnh hưởng gây mê lầm”, “một hoạt động lừa dối”, hoặc theo cách dịch truyền thống: “một sự mê lầm mạnh mẽ”.'
    reason: Các từ ἐνέργεια và πλάνη kết hợp theo cách có thể nhấn mạnh một tác động hữu hiệu, hoạt động lừa dối, hoặc trạng thái mê lầm; tiếng Việt khó giữ trọn các sắc thái ấy trong một cách diễn đạt duy nhất.
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Chính vì thế
  rationale: Cụm này diễn đạt quan hệ nguyên nhân, chỉ về việc họ khước từ yêu mến chân lý ở câu trước; “chính vì thế” tự nhiên trong tiếng Việt và giữ rõ sức nặng nhân quả.
- source_word: πέμπει
  choice: gửi đến
  rationale: Giữ thì hiện tại và hành động trực tiếp của Đức Chúa Trời như nguyên văn, không làm nhẹ thành sự cho phép thụ động.
- source_word: ἐνέργειαν πλάνης
  choice: một tác động khiến họ mê lầm
  rationale: “Tác động” thể hiện ἐνέργεια như một hoạt động có hiệu lực; “khiến họ mê lầm” diễn đạt πλάνη tự nhiên hơn cấu trúc sở hữu cứng nhắc, đồng thời vẫn để ngỏ sắc thái lừa dối, sai lạc và mê lầm.
- source_word: εἰς τὸ πιστεῦσαι
  choice: để họ tin
  rationale: Giữ được khả năng chỉ mục đích hoặc kết quả của cấu trúc Hy Lạp mà không cố phân định quá mức.
- source_word: τῷ ψεύδει
  choice: điều dối trá
  rationale: Diễn đạt danh từ số ít có mạo từ như một điều giả dối xác định trong văn cảnh, nhưng không thêm “lời” hay một đối tượng cụ thể mà nguyên văn không nêu.
theological_decisions:
- issue: Tác nhân thần thượng trong sự phán xét khiến con người cứng lòng
  choice: Đức Chúa Trời gửi đến họ
  alternative: Đức Chúa Trời cho phép sự mê lầm đến với họ
  rationale: Nguyên văn đặt Đức Chúa Trời làm chủ ngữ trực tiếp của πέμπει (“gửi”). Bản dịch không đổi hành động này thành sự cho phép, nhờ đó giữ nguyên sự căng thẳng thần học giữa sự phán xét của Đức Chúa Trời và việc con người đã khước từ chân lý.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. “Chính vì thế” nối rõ với câu trước; “một tác động khiến họ mê lầm” tránh lối dịch quá cứng “một sự vận hành của mê lầm” nhưng vẫn bảo toàn ý về một tác động có hiệu lực. Dấu chú thích được đặt ngay sau cụm từ mà chú thích giải thích.
