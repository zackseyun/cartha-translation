source:
  edition: SBLGNT
  text: εἰς ⸀ὃ ἐκάλεσεν ὑμᾶς διὰ τοῦ εὐαγγελίου ἡμῶν, εἰς περιποίησιν δόξης τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/014.yaml
  text: to which he called you through our gospel[b][a], for obtaining the glory of our Lord Jesus the Messiah.
translation:
  language: vi
  text: Để đạt đến điều ấy, Ngài đã kêu gọi anh chị em qua Tin Mừng chúng tôi rao giảng, để anh chị em đạt được vinh quang của Chúa chúng ta là Đức Chúa Giê-su, Đấng Mê-si-a.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Theo cách gọi truyền thống: “Đức Chúa Giê-su Christ.” Cụm “đạt được vinh quang” cũng có thể dịch là “nhận được vinh quang,” “sở hữu vinh quang,” hoặc “được dự phần vào vinh quang.”'
    reason: Ghi nhận cách dịch truyền thống của Χριστός và phạm vi nghĩa của περιποίησις.
lexical_decisions:
- source_word: εἰς ὃ
  choice: Chính vì điều đó
  rationale: Cụm này quy chiếu về công cuộc cứu rỗi và thánh hóa ở câu trước, đồng thời diễn tả mục đích. Cách dịch không xác định hẹp hơn điều mà đại từ quan hệ trong tiếng Hy Lạp chỉ về.
- source_word: ἐκάλεσεν
  choice: đã kêu gọi
  rationale: Giữ nguyên sức nặng cứu rỗi trong cách dùng của Phao-lô mà không thêm một hệ thống thần học về bản chất của sự kêu gọi.
- source_word: διὰ τοῦ εὐαγγελίου ἡμῶν
  choice: qua Tin Mừng chúng tôi rao giảng
  rationale: διά với sở hữu cách chỉ phương tiện. Việc thêm “rao giảng” làm rõ rằng đây là Tin Mừng do các sứ đồ công bố, chứ không phải một Tin Mừng riêng thuộc về họ.
- source_word: εἰς περιποίησιν δόξης
  choice: để anh chị em được dự phần vào vinh quang
  rationale: περιποίησις có thể chỉ việc đạt được, sở hữu hoặc nhận phần. Trong ngữ cảnh vinh quang cánh chung, “được dự phần” tự nhiên trong tiếng Việt và bảo toàn ý hướng đích mà không hàm ý con người tự giành lấy vinh quang.
- source_word: τοῦ κυρίου ἡμῶν
  choice: của Chúa chúng ta
  rationale: Dịch κύριος bằng danh hiệu quen thuộc “Chúa”, giữ ý nghĩa thần học và cách diễn đạt tự nhiên.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Đức Chúa Jêsus, Đấng Mê-si-a
  rationale: Χριστός vẫn mang nghĩa danh hiệu “Đấng Mê-si-a” trong ngữ cảnh này. Cách đặt đồng vị làm rõ danh hiệu trong tiếng Việt.
theological_decisions:
- issue: Bản chất sự kêu gọi của Đức Chúa Trời
  choice: Dịch đơn giản là “đã kêu gọi”
  alternative: “đã kêu gọi cách hữu hiệu” hoặc “đã mời gọi”
  rationale: Nguyên văn khẳng định Đức Chúa Trời kêu gọi tín hữu qua Tin Mừng nhưng không giải thích cơ chế của sự kêu gọi; bản dịch không nên áp đặt lập trường hệ phái.
- issue: Ý nghĩa của περιποίησις với δόξης
  choice: “được dự phần vào vinh quang”
  alternative: “đạt được vinh quang” hoặc “sở hữu vinh quang”
  rationale: Cụm Hy Lạp cho phép các sắc thái đạt được, sở hữu hay nhận phần. “Dự phần” phù hợp ngữ cảnh và tránh giải quyết quá mức cách tín hữu liên hệ với vinh quang của Chúa.
- issue: Cách dịch Χριστοῦ
  choice: “Đấng Mê-si-a”
  alternative: “Đấng Christ”
  rationale: Ở đây từ này hoạt động như danh hiệu. Bản dịch chính nêu rõ nghĩa của từ Hy Lạp, còn cách gọi truyền thống được ghi ở chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Dùng “anh chị em” cho số nhiều ὑμᾶς; viết hoa “Tin Mừng” theo quy ước tên gọi. Cụm “chúng tôi rao giảng” là phần làm rõ hàm ý sở hữu trong “Tin Mừng của chúng tôi”.
