revisions:
- from: Chính vì điều đó mà Ngài đã kêu gọi anh chị em qua Tin Mừng chúng tôi rao giảng, để anh chị em được dự phần vào vinh quang của Chúa chúng ta là Đức Chúa Jêsus, Đấng Mê-si-a.[a]
  to: Để đạt đến điều ấy, Ngài đã kêu gọi anh chị em qua Tin Mừng chúng tôi rao giảng, để anh chị em đạt được vinh quang của Chúa chúng ta là Đức Chúa Giê-su, Đấng Mê-si-a.[a]
  rationale: Sửa quan hệ mục đích của εἰς ὃ, dùng “đạt được” để phản ánh περιποίησις mà không áp đặt cách giải thích về cơ chế nhận phần trong vinh quang, và chuẩn hóa chính tả tên Giê-su cho tiếng Việt hiện đại.
