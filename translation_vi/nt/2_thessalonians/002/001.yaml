    rationale: Ἐρωτῶμεν ὑμᾶς mở đầu một lời thỉnh cầu mà nội dung tiếp tục ở câu 2. “Thỉnh cầu anh chị em:” diễn đạt rõ chức năng này, không làm mạnh lời thỉnh cầu thành mệnh lệnh.
  - severity: low
