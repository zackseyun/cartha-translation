reference: 2 Thessalonians 2:1
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἐρωτῶμεν δὲ ὑμᾶς, ἀδελφοί, ὑπὲρ τῆς παρουσίας τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ καὶ ἡμῶν ἐπισυναγωγῆς ἐπ’ αὐτόν,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/001.yaml
  text: We ask you[a], brothers, concerning the coming of our Lord Jesus the Messiah and our gathering together to him[b],
translation:
  language: vi
  text: 'Thưa anh chị em, về sự quang lâm của Chúa chúng ta, Đức Giê-su, Đấng Mê-si-a, và về việc chúng ta được quy tụ về với Người, chúng tôi thỉnh cầu anh chị em:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐρωτῶμεν
  choice: chúng tôi xin anh chị em rằng
  rationale: Trong ngữ cảnh này, động từ mở đầu một lời thỉnh cầu mục vụ, không phải câu hỏi. Cách dịch “xin ... rằng” tự nhiên trong tiếng Việt và nối câu này với nội dung thỉnh cầu ở câu kế tiếp.
- source_word: δὲ
  choice: không dịch thành một từ riêng
  rationale: δέ đánh dấu sự chuyển ý nhẹ. Trật tự và nhịp câu tiếng Việt đã thể hiện sự chuyển sang đề tài mới; thêm “bây giờ” sẽ dễ tạo sắc thái thời gian không có trong nguyên văn.
- source_word: ἀδελφοί
  choice: anh chị em
  rationale: Dù hình thức Hy Lạp là giống đực số nhiều, trong cách xưng hô của Phao-lô từ này hướng đến toàn thể cộng đồng tín hữu. “Anh chị em” là lối gọi tự nhiên, trang trọng và chính xác về phạm vi trong tiếng Việt.
- source_word: ὑπὲρ
  choice: về
  rationale: Ở đây giới từ nêu vấn đề làm cơ sở cho lời thỉnh cầu. “Về” rõ ràng và tự nhiên hơn “liên quan đến” trong câu tiếng Việt.
- source_word: παρουσίας
  choice: sự quang lâm
  rationale: Trong ngữ cảnh cánh chung nói về Đức Giê-su, παρουσία chỉ sự hiện đến trong tương lai. “Quang lâm” là thuật ngữ Việt ngữ đã quen thuộc, diễn đạt cuộc ngự đến long trọng mà không giản lược thành sự hiện diện thông thường.
- source_word: κυρίου
  choice: Chúa
  rationale: “Chúa” giữ được thẩm quyền và sức nặng thần học của danh hiệu κύριος, đồng thời là cách gọi tự nhiên trong Tân Ước tiếng Việt.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Đức Giê-su, Đấng Mê-si-a
  rationale: Χριστός tại đây vẫn có giá trị danh hiệu, nên dịch nghĩa là “Đấng Mê-si-a” thay vì chỉ phiên chuyển thành “Ki-tô/Cơ Đốc.” “Đức Giê-su” phù hợp văn phong Kinh Thánh tiếng Việt trang trọng, dễ hiểu.
- source_word: ἐπισυναγωγῆς
  choice: việc chúng ta được tụ họp
  rationale: Danh từ chỉ sự quy tụ lại với nhau. Dạng bị động tiếng Việt diễn đạt tự nhiên việc các tín hữu được quy tụ mà không xác định quá mức tác nhân hay cơ chế.
- source_word: ἐπ’ αὐτόν
  choice: bên Người
  rationale: Cụm từ diễn tả sự hướng đến và quy tụ nơi Đức Giê-su. “Bên Người” tự nhiên trong tiếng Việt và giữ trọng tâm quan hệ, không thêm ý nghĩa thể lý quá mức.
theological_decisions:
- issue: Cách dịch Χριστοῦ trong danh hiệu của Đức Giê-su
  choice: Đấng Mê-si-a
  alternative: Đấng Ki-tô; Chúa Cứu Thế
  rationale: Nguyên ngữ dùng danh hiệu Χριστός, tương ứng với “Mê-si-a/Đấng được xức dầu.” “Đấng Mê-si-a” bảo tồn tính chất danh hiệu và tránh đồng nhất nó chỉ như một phần tên riêng.
- issue: Phạm vi của ἀδελφοί
  choice: anh chị em
  alternative: anh em
  rationale: Trong ngữ cảnh thư gửi hội chúng, lời xưng hô có phạm vi bao gồm cả cộng đồng tín hữu. Tiếng Việt tự nhiên dùng “anh chị em” để thể hiện phạm vi ấy mà không làm thay đổi chức năng thân tộc của từ.
- issue: Quan hệ giữa sự quang lâm và việc tụ họp
  choice: giữ hai thực tại được phối hợp bằng “và”
  alternative: việc tụ họp diễn ra khi Chúa quang lâm; hoặc việc tụ họp chính là sự quang lâm
  rationale: Nguyên văn đặt hai cụm danh từ song song dưới ὑπέρ nhưng không xác định chính xác quan hệ thời gian hay đồng nhất giữa chúng. Bản dịch không áp đặt một hệ thống cánh chung cụ thể.
- issue: Hướng của ἐπ’ αὐτόν
  choice: bên Người
  alternative: đến với Người; quanh Người
  rationale: Cụm Hy Lạp cho thấy sự quy tụ hướng về Đức Giê-su, nhưng không buộc phải xác định hình ảnh không gian là “quanh” hay một tiến trình cụ thể. “Bên Người” giữ được sự gần gũi và đích quy tụ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Đảo cụm chủ đề “về...” lên trước mệnh đề “chúng tôi xin...” để câu 1 nối tự nhiên với nội dung lời xin ở câu 2. Dùng “anh chị em” theo phạm vi giao tiếp thực tế của lời xưng hô trong hội chúng; không cần chú thích. Không thêm dấu chú thích vì không có chú thích độc giả nào cần thiết trong bản tiếng Việt này.
