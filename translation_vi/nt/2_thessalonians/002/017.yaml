id: 2TH.2.17
reference: 2 Thessalonians 2:17
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: παρακαλέσαι ὑμῶν τὰς καρδίας καὶ ⸀στηρίξαι ἐν παντὶ ⸂ἔργῳ καὶ λόγῳ⸃ ἀγαθῷ.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/017.yaml
  text: encourage your hearts and strengthen them in every good work and word[a][b].
translation:
  language: vi
  text: xin khích lệ[a] lòng anh chị em và làm cho anh chị em vững mạnh[b] trong mọi việc làm và lời nói tốt lành.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “an ủi” hoặc “khuyên nhủ”.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “làm cho vững vàng” hoặc “củng cố”.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρακαλέσαι
  choice: khích lệ
  rationale: Động từ có thể mang nghĩa khích lệ, an ủi hoặc khuyên nhủ. Trong lời cầu nguyện tiếp nối ý về sự khích lệ đời đời ở câu 16, “khích lệ” giữ được nghĩa rộng mà không thu hẹp vào cảm xúc hay lời răn bảo.
- source_word: καρδίας
  choice: lòng
  rationale: “Lòng” là cách diễn đạt tự nhiên trong tiếng Việt cho hình ảnh Kinh Thánh chỉ con người bên trong, không giới hạn vào cảm xúc hoặc lý trí.
- source_word: στηρίξαι
  choice: làm cho ... vững mạnh
  rationale: Cách dịch này diễn đạt tự nhiên ý làm cho kiên định, vững chắc và phù hợp với cấu trúc lời cầu xin.
- source_word: ἐν παντὶ
  choice: trong mọi
  rationale: Giữ ý về phạm vi mà sự làm cho vững mạnh được thể hiện.
- source_word: ἔργῳ
  choice: việc làm
  rationale: Diễn đạt rõ hành động hay việc được thực hiện, đồng thời tạo cặp song song tự nhiên với “lời nói”.
- source_word: λόγῳ
  choice: lời nói
  rationale: Trong thế song song với “việc làm”, từ này tự nhiên nhất là chỉ lời nói hay phát ngôn.
- source_word: ἀγαθῷ
  choice: tốt lành
  rationale: Giữ nghĩa rộng về điều tốt, hữu ích và ngay lành; theo ngữ cảnh, phẩm chất này áp dụng cho cả việc làm lẫn lời nói.
- source_word: ὑμῶν
  choice: anh chị em
  rationale: Đại từ số nhiều được chuyển thành lối xưng hô cộng đồng tự nhiên, bao quát trong tiếng Việt hiện đại.
- source_word: καὶ
  choice: và
  rationale: Thể hiện trực tiếp quan hệ phối hợp giữa hai động từ và giữa hai danh từ.
theological_decisions:
- issue: Có nên diễn giải καρδία bằng một phạm trù tâm lý cụ thể hay không
  choice: lòng
  alternative: tâm trí; con người bên trong
  rationale: “Lòng” bảo tồn hình ảnh nhân học Kinh Thánh và không thu hẹp nghĩa vào riêng trí tuệ hay cảm xúc.
- issue: Có nên dịch στηρίξαι theo nghĩa hình thức là “thiết lập” hay không
  choice: làm cho ... vững mạnh
  alternative: làm cho vững vàng; củng cố
  rationale: Cách chọn này tự nhiên đối với độc giả hiện đại và vẫn giữ ý làm cho kiên định, vững chắc.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh chị em” để biểu đạt đại từ số nhiều hướng đến toàn thể cộng đồng; giữ “lòng” như một hình ảnh Kinh Thánh quen thuộc. Hai dấu chú thích [a], [b] đều được đặt ngay sau từ ngữ liên quan trong chính văn.
