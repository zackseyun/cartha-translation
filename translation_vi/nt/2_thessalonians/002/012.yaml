id: 2TH.2.12
reference: 2 Thessalonians 2:12
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἵνα κριθῶσιν ⸀πάντες οἱ μὴ πιστεύσαντες τῇ ἀληθείᾳ ἀλλὰ εὐδοκήσαντες ⸀τῇ ἀδικίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/012.yaml
  text: so that all may be judged who did not believe the truth but took pleasure in unrighteousness[a].
translation:
  language: vi
  text: để tất cả những người không tin chân lý nhưng lại vui thích trong sự bất chính đều bị xét xử[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “bị kết án.” Trong văn mạch, động từ Hy Lạp có thể hàm ý một phán quyết bất lợi, dù nghĩa sát hơn là “bị xét xử.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: để
  rationale: Diễn đạt tự nhiên quan hệ mục đích/kết quả với văn mạch trước mà không buộc phải phân định dứt khoát giữa hai sắc thái.
- source_word: κριθῶσιν
  choice: bị xét xử
  rationale: Giữ nghĩa tư pháp căn bản của động từ κρίνω ở thể bị động; văn mạch hàm ý phán quyết bất lợi, nhưng bản dịch chính không làm nghĩa mạnh hơn nguyên văn.
- source_word: πάντες
  choice: tất cả ... đều
  rationale: Cấu trúc tương ứng tự nhiên trong tiếng Việt, nhấn mạnh tính bao quát của πάντες.
- source_word: οἱ μὴ πιστεύσαντες
  choice: những người không tin
  rationale: Phản ánh phân từ aorist có mạo từ được dùng như danh từ; “tin” phù hợp với bổ ngữ “chân lý” và cách diễn đạt của Phao-lô.
- source_word: τῇ ἀληθείᾳ
  choice: chân lý
  rationale: Diễn đạt đối tượng xác định của hành động tin; tiếng Việt không cần từ tương đương mạo từ nhưng “chân lý” vẫn chỉ chân lý được xác định trong văn mạch.
- source_word: ἀλλὰ
  choice: nhưng lại
  rationale: Nêu bật sự tương phản mạnh giữa không tin chân lý và vui thích trong sự bất chính.
- source_word: εὐδοκήσαντες
  choice: vui thích trong
  rationale: Giữ cả sắc thái ý chí lẫn sự ưa thích, thay vì chỉ diễn đạt sự tán thành bằng lý trí.
- source_word: τῇ ἀδικίᾳ
  choice: sự bất chính
  rationale: Giữ sắc thái đạo đức-thần học rộng của ἀδικία, bao gồm điều trái với sự công chính, thay vì thu hẹp thành bất công hay hành vi sai trái cụ thể.
theological_decisions:
- issue: Nên dịch κριθῶσιν là “bị xét xử” hay diễn giải mạnh hơn thành “bị kết án”
  choice: bị xét xử
  alternative: bị kết án
  rationale: Văn mạch rõ ràng mang tính bất lợi, nhưng κρίνω tự nó có nghĩa rộng hơn là xét xử/phán xét. Bản dịch giữ nguyên độ mở của từ Hy Lạp, còn chú thích nêu cách hiểu theo kết quả trong văn mạch.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Dùng “chân lý” và “sự bất chính” để duy trì sắc thái đạo đức-thần học của câu; cấu trúc “tất cả ... đều” tạo câu tiếng Việt tự nhiên.
