  terminology: “Đức Chúa Trời,” “Chúa,” “Thánh Linh,” “sự thánh hóa,” và “đức tin nơi chân lý” nhất quán với lựa chọn thuật ngữ của bản thảo. “Hoa quả đầu mùa” bảo toàn tốt hơn hình ảnh ἀπαρχήν; chú thích dị bản được giữ nguyên nội dung và neo đúng tại cụm từ này.
