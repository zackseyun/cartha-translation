  source_fidelity: 'Bản dịch truyền đạt đúng cấu trúc và các ý chính của SBLGNT: nghĩa vụ thường xuyên cảm tạ, lời gọi “anh em” được Chúa yêu thương, sự Đức Chúa Trời chọn lựa, “hoa quả đầu mùa,” cứu rỗi, sự thánh hóa bởi Thánh Linh và đức tin nơi chân lý. Tuy nhiên, “hoa trái đầu mùa” trong tiếng Việt thường gợi trái cây theo mùa hơn là ἀπαρχή, tức phần/trái đầu mùa; cần đổi để giữ ẩn dụ “firstfruits” rõ hơn.'
