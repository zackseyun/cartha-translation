revisions:
- from: Nhưng chúng tôi phải luôn cảm tạ Đức Chúa Trời về anh em, hỡi những anh em[a] được Chúa yêu thương, vì Đức Chúa Trời đã chọn anh em làm hoa trái đầu mùa[b] để được cứu, nhờ sự thánh hóa bởi Thánh Linh và đức tin nơi chân lý.
  to: Nhưng chúng tôi luôn phải cảm tạ Đức Chúa Trời vì anh em, thưa anh em[a], là những người được Chúa yêu thương, vì Đức Chúa Trời đã chọn anh em làm những hoa quả đầu mùa[b] để được cứu, nhờ sự thánh hóa bởi Thánh Linh và đức tin nơi chân lý.
  rationale: Sửa ngữ pháp và cách dùng từ để bản dịch tự nhiên hơn trong tiếng Việt hiện đại, đặc biệt thay “hoa trái đầu mùa” bằng “những hoa quả đầu mùa” nhằm biểu đạt đúng ἀπαρχήν. Không thay đổi nghĩa cứu rỗi, tác nhân Thánh Linh, hay hàm ý về sự lựa chọn; dị bản ἀπ’ ἀρχῆς tiếp tục được ghi chú rõ ràng.
