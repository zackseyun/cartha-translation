id: 2TH.2.13
reference: 2 Thessalonians 2:13
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἡμεῖς δὲ ὀφείλομεν εὐχαριστεῖν τῷ θεῷ πάντοτε περὶ ὑμῶν, ἀδελφοὶ ἠγαπημένοι ὑπὸ κυρίου, ὅτι εἵλατο ὑμᾶς ὁ θεὸς ⸀ἀπαρχὴν εἰς σωτηρίαν ἐν ἁγιασμῷ πνεύματος καὶ πίστει ἀληθείας,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/013.yaml
  text: But we ought always to give thanks to God for you[a], brothers beloved by the Lord, because God chose you as firstfruits for salvation through sanctification by the Spirit and faith in the truth[b],
translation:
  language: vi
  text: Nhưng chúng tôi luôn phải cảm tạ Đức Chúa Trời vì anh em, thưa anh em[a], là những người được Chúa yêu thương, vì Đức Chúa Trời đã chọn anh em làm những hoa quả đầu mùa[b] để được cứu, nhờ sự thánh hóa bởi Thánh Linh và đức tin nơi chân lý.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hy Lạp được dịch là “anh em” ở đây có dạng giống đực số nhiều; cách xưng hô này có thể bao gồm toàn thể cộng đồng tín hữu, cả nam lẫn nữ.
    reason: cultural_note
  - marker: b
    text: 'Một số thủ bản chép: “vì từ ban đầu Đức Chúa Trời đã chọn anh em để được cứu.” Bản chính theo cách đọc “hoa quả đầu mùa” (ἀπαρχήν); dị bản là “từ ban đầu” (ἀπ’ ἀρχῆς).'
    reason: textual_variant
lexical_decisions:
- source_word: Ἡμεῖς δὲ
  choice: Nhưng chúng tôi
  rationale: δέ tạo nét tương phản với những người bị hư mất ở phần trước; đại từ Ἡμεῖς được diễn đạt rõ để giữ sắc thái nhấn mạnh.
- source_word: ὀφείλομεν
  choice: phải
  rationale: Diễn tả bổn phận thích đáng trong công thức tạ ơn của Phao-lô mà không hàm ý sự cưỡng ép bên ngoài.
- source_word: εὐχαριστεῖν τῷ θεῷ πάντοτε περὶ ὑμῶν
  choice: luôn cảm tạ Đức Chúa Trời về anh em
  rationale: Cách diễn đạt tự nhiên trong tiếng Việt, giữ đủ ý về sự tạ ơn liên tục và đối tượng khiến tác giả tạ ơn.
- source_word: ἀδελφοὶ ἠγαπημένοι ὑπὸ κυρίου
  choice: hỡi những anh em được Chúa yêu thương
  rationale: Giữ cách xưng hô trực tiếp và thể bị động của phân từ; “Chúa” tương ứng với κύριος. Chú thích làm rõ phạm vi cộng đồng của danh từ giống đực số nhiều.
- source_word: εἵλατο ὑμᾶς ὁ θεὸς
  choice: Đức Chúa Trời đã chọn anh em
  rationale: Diễn đạt trực tiếp nghĩa của động từ αἱρέομαι mà không thêm một hệ thống thần học về sự lựa chọn.
- source_word: ἀπαρχὴν
  choice: làm hoa trái đầu mùa
  rationale: Theo nguyên văn SBLGNT ἀπαρχήν, dùng hình ảnh phần đầu tiên của mùa gặt được dâng lên; biến thể “từ ban đầu” được ghi trong chú thích.
- source_word: εἰς σωτηρίαν
  choice: để được cứu
  rationale: Diễn đạt mục đích hoặc kết quả của εἰς σωτηρίαν bằng tiếng Việt tự nhiên.
- source_word: ἐν ἁγιασμῷ πνεύματος
  choice: nhờ sự thánh hóa bởi Thánh Linh
  rationale: “Nhờ” thể hiện phương tiện; “bởi Thánh Linh” hiểu πνεύματος là tác nhân, phù hợp nhất với văn mạch cứu rỗi của Phao-lô.
- source_word: καὶ πίστει ἀληθείας
  choice: và đức tin nơi chân lý
  rationale: 'Hiểu sở hữu cách ἀληθείας theo nghĩa khách thể: chân lý là điều người ta tin; “đức tin nơi chân lý” giữ sắc thái trang trọng và rõ nghĩa.'
theological_decisions:
- issue: Ý nghĩa của πνεύματος trong ἐν ἁγιασμῷ πνεύματος
  choice: Thánh Linh
  alternative: tâm linh của con người
  rationale: Trong văn mạch cứu rỗi này, sự thánh hóa được quy cho Thánh Linh là cách hiểu tự nhiên hơn; cách viết hoa thể hiện quyết định văn cảnh nhưng không thêm danh xưng không có trong tiếng Hy Lạp.
- issue: Hàm ý của εἵλατο ὑμᾶς ὁ θεὸς
  choice: Đức Chúa Trời đã chọn anh em
  alternative: Đức Chúa Trời đã định anh em / nhận anh em về cho Ngài
  rationale: Bản dịch giữ nguyên khẳng định về hành động lựa chọn của Đức Chúa Trời, không giải thích theo một học thuyết hệ phái cụ thể.
- issue: Dị bản ἀπαρχήν và ἀπ’ ἀρχῆς
  choice: hoa trái đầu mùa
  alternative: từ ban đầu
  rationale: Bản chính đi theo SBLGNT với ἀπαρχήν; dị bản có chứng cứ thủ bản và tạo nghĩa khác nên được bảo tồn trong chú thích.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. “Hỡi” được dùng tiết chế để đánh dấu lời gọi trực tiếp; “hoa trái đầu mùa” bảo tồn hình ảnh Kinh Thánh thay vì diễn giải thành “những người đầu tiên”.
