id: 2TH.2.15
reference: 2 Thessalonians 2:15
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἄρα οὖν, ἀδελφοί, στήκετε, καὶ κρατεῖτε τὰς παραδόσεις ἃς ἐδιδάχθητε εἴτε διὰ λόγου εἴτε δι’ ἐπιστολῆς ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/015.yaml
  text: So then[a], brothers, stand firm and hold fast to the traditions that you were taught, whether by word or by our letter.
translation:
  language: vi
  text: Vậy nên, thưa anh em[a], hãy đứng vững và giữ chặt những truyền thống anh em đã được dạy, dù bằng lời nói hay bằng thư của chúng tôi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể hiểu là “thưa anh chị em”; tiếng Hy Lạp nói “anh em”, nhưng nhiều khả năng chỉ toàn thể hội chúng.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄρα οὖν
  choice: Vậy nên
  rationale: Cặp tiểu từ suy luận nhấn mạnh kết luận rút ra từ phần trước; “Vậy nên” tự nhiên trong tiếng Việt và giữ được sức chuyển ý.
- source_word: ἀδελφοί
  choice: thưa anh em
  rationale: Danh từ hô cách số nhiều theo nghĩa trực tiếp là “anh em”; thêm “thưa” giúp lời gọi tự nhiên, trang trọng trong tiếng Việt, còn chú thích nêu rõ khả năng chỉ toàn thể hội chúng.
- source_word: στήκετε
  choice: hãy đứng vững
  rationale: Thể mệnh lệnh hiện tại kêu gọi tiếp tục kiên định; “đứng vững” vừa sát hình ảnh nguồn vừa tự nhiên.
- source_word: κρατεῖτε
  choice: giữ chặt
  rationale: Động từ diễn tả việc nắm giữ chắc chắn và tiếp tục gắn bó; “giữ chặt” bảo toàn cường độ của mệnh lệnh.
- source_word: παραδόσεις
  choice: những truyền thống
  rationale: Danh từ chỉ những điều được trao truyền; “truyền thống” giữ rõ nét nghĩa được truyền lại và không thu hẹp thành riêng “giáo huấn” hay “chỉ dẫn”.
- source_word: ἐδιδάχθητε
  choice: anh em đã được dạy
  rationale: Cách dịch bị động phản ánh vai trò tiếp nhận sự chỉ dạy của người Tê-sa-lô-ni-ca và diễn đạt rõ ràng bằng tiếng Việt.
- source_word: διὰ λόγου
  choice: bằng lời nói
  rationale: Trong thế đối lập với thư từ, λόγος chỉ sự truyền đạt bằng lời; “lời nói” làm rõ phương thức khẩu truyền hơn cách nói đơn thuần “bằng lời”.
- source_word: δι’ ἐπιστολῆς ἡμῶν
  choice: bằng thư của chúng tôi
  rationale: Cụm từ giữ sự tương phản giữa truyền đạt bằng lời nói và bằng văn bản, đồng thời bảo toàn đại từ sở hữu ἡμῶν.
theological_decisions:
- issue: Cách dịch παράδοσις trong bối cảnh thường được viện dẫn khi bàn về truyền thống sứ đồ
  choice: những truyền thống
  alternative: những giáo huấn; những chỉ dẫn
  rationale: Nguyên ngữ nói đến những điều được trao truyền và bao gồm cả hình thức nói lẫn viết. “Những truyền thống” phản ánh trực tiếp nghĩa từ vựng mà không áp đặt các kết luận hệ phái về phạm vi hay thẩm quyền của truyền thống về sau.
- issue: Phạm vi người được gọi bằng ἀδελφοί
  choice: thưa anh em
  alternative: thưa anh chị em
  rationale: Bản văn giữ hình thức giống đực của nguyên ngữ trong câu chính, đồng thời chú thích cho biết trong cách dùng của Phao-lô, từ này nhiều khả năng hướng đến toàn thể hội chúng, gồm cả nam lẫn nữ.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Hai mệnh lệnh “đứng vững” và “giữ chặt” giữ nhịp song song và sức thúc giục của nguyên văn; “truyền thống” được giữ để bảo toàn nghĩa trao truyền cùng sự căng thẳng thần học vốn có.
