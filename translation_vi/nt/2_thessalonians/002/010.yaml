id: 2TH.2.10
reference: 2 Thessalonians 2:10
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἐν πάσῃ ἀπάτῃ ⸀ἀδικίας τοῖς ἀπολλυμένοις, ἀνθ’ ὧν τὴν ἀγάπην τῆς ἀληθείας οὐκ ἐδέξαντο εἰς τὸ σωθῆναι αὐτούς·
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/010.yaml
  text: and with every deception of unrighteousness for those who are perishing[d][c][b][a], because they did not accept the love of the truth so as to be saved.
translation:
  language: vi
  text: và với mọi sự lừa dối bất chính[a] đối với những người đang hư mất[b], vì họ đã không đón nhận[c] lòng yêu mến chân lý để được cứu[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “mọi sự lừa dối của sự bất chính.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “cho những người đang hư mất” hoặc “giữa những người đang hư mất.”'
    reason: lexical_alternative
  - marker: c
    text: 'Hay: “không tiếp nhận” hoặc “không chấp nhận.”'
    reason: lexical_alternative
  - marker: d
    text: 'Hay: “hầu cho họ được cứu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπάτῃ ἀδικίας
  choice: sự lừa dối bất chính
  rationale: “Sự lừa dối” diễn đạt tự nhiên ý deceit/deception của ἀπάτη; “bất chính” giữ sắc thái đạo đức của ἀδικία và bổ nghĩa cho sự lừa dối mà không thu hẹp thành bất công xã hội.
- source_word: τοῖς ἀπολλυμένοις
  choice: đối với những người đang hư mất
  rationale: “Đối với” giữ độ linh hoạt của cách ba chỉ nhóm chịu tác động; “đang hư mất” phản ánh phân từ hiện tại, tránh biến cụm từ thành một định danh mang tính tiền định.
- source_word: ἀνθ’ ὧν
  choice: vì
  rationale: Trong ngữ cảnh, cụm này nêu nguyên nhân; “vì” truyền đạt rõ quan hệ nhân quả trong tiếng Việt hiện đại.
- source_word: τὴν ἀγάπην τῆς ἀληθείας
  choice: lòng yêu mến chân lý
  rationale: Cách nói này tự nhiên trong tiếng Việt, giữ danh từ “tình yêu/lòng yêu mến” và truyền đạt nghĩa rất có thể là yêu mến chân lý mà không giản lược thành việc chỉ chấp nhận một mệnh đề đúng.
- source_word: οὐκ ἐδέξαντο
  choice: đã không đón nhận
  rationale: δέχομαι có thể là nhận, chấp nhận hoặc đón nhận. “Đón nhận” phù hợp với tân ngữ trừu tượng và gợi sự tiếp nhận tích cực mà họ đã khước từ.
- source_word: εἰς τὸ σωθῆναι αὐτούς
  choice: để được cứu
  rationale: “Để” bảo tồn sắc thái mục đích hoặc kết quả của εἰς với động từ nguyên mẫu có mạo từ; thể bị động của σωθῆναι được giữ bằng “được cứu”.
theological_decisions:
- issue: “Những người đang hư mất” là tình trạng đang diễn tiến hay một số phận đã được ấn định?
  choice: những người đang hư mất
  alternative: những kẻ đã bị định cho sự hủy diệt
  rationale: Phân từ hiện tại ἀπολλυμένοις mô tả tình trạng đang diễn tiến. Bản dịch không đưa vào một hệ thống thần học về tiền định mà câu Hy Lạp không minh nhiên xác quyết.
- issue: “Lòng yêu mến chân lý” là lòng yêu chân lý hay tình yêu phát xuất từ chân lý?
  choice: lòng yêu mến chân lý
  alternative: tình yêu của chân lý
  rationale: Ngữ cảnh thiên về việc họ không yêu mến và đón nhận chân lý. Tuy vậy, cách dịch không thêm giới từ “dành cho”, nhờ đó không diễn giải quá mức cấu trúc sở hữu cách.
- issue: εἰς τὸ σωθῆναι αὐτούς diễn tả mục đích hay kết quả?
  choice: để được cứu
  alternative: hầu cho họ được cứu
  rationale: “Để được cứu” có thể chuyển tải quan hệ hướng đến mục đích/kết quả mà không buộc câu vào chỉ một cách phân loại ngữ pháp.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Chân lý” phù hợp văn cảnh thần học nhưng vẫn thông dụng; “đang hư mất” giữ sắc thái diễn tiến và sự căng thẳng thần học của nguyên văn. Các dấu chú thích xuất hiện theo thứ tự [a]–[d] ngay tại thành phần liên quan.
