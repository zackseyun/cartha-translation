  text: καὶ νῦν τὸ κατέχον οἴδατε, εἰς τὸ ἀποκαλυφθῆναι αὐτὸν ἐν τῷ ⸀ἑαυτοῦ καιρῷ·
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/006.yaml
  text: And now you know what is restraining him[b][a], so that he may be revealed in his own time.
translation:
  language: vi
  text: Và nay, anh em biết điều đang ngăn giữ người ấy, để người ấy được bày tỏ vào thời của người ấy.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “điều đang cầm giữ người ấy lại.” Tiếng Hy Lạp dùng cách nói giống trung và không cho biết tại đây tác nhân ngăn giữ là gì hay là ai.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “vào thời điểm đã được ấn định cho người ấy.” Từ Hy Lạp có thể chỉ một thời điểm thích hợp hoặc đã được định.'
    reason: alternative_reading
lexical_decisions:
- source_word: τὸ κατέχον
  choice: điều đang ngăn giữ người ấy
  rationale: Mạo từ giống trung đi kèm phân từ được diễn đạt bằng “điều đang…”, không biến tác nhân ngăn giữ thành một nhân vật được xác định. “Người ấy” nêu rõ đối tượng được hiểu theo văn cảnh, tức nhân vật sẽ được tỏ ra.
- source_word: οἴδατε
  choice: anh em biết
  rationale: Động từ có hình thức hoàn thành nhưng mang nghĩa hiện tại; “anh em biết” tự nhiên và giữ được ý Phao-lô nhắc đến điều độc giả đã được dạy.
- source_word: εἰς τὸ ἀποκαλυφθῆναι αὐτόν
  choice: để người ấy được tỏ ra
  rationale: Cấu trúc εἰς τό với động từ nguyên mẫu diễn tả mục đích hoặc kết quả. Cách dịch này rõ ràng trong tiếng Việt mà không xác định quá mức quan hệ giữa mục đích và kết quả.
- source_word: ἐν τῷ ἑαυτοῦ καιρῷ
  choice: vào thời của chính mình
  rationale: Giữ sắc thái của ἑαυτοῦ là “của chính mình” và không đưa ý “được ấn định” vào chính văn, dù καιρός có thể chỉ thời điểm thích hợp hay đã được định.
- source_word: νῦν
  choice: giờ đây
  rationale: Diễn đạt tự nhiên sắc thái thời gian đồng thời nối câu này với lập luận trước đó.
theological_decisions:
- issue: Danh tính của tác nhân ngăn giữ
  choice: Dùng “điều đang ngăn giữ” và không xác định tác nhân là ai.
  alternative: Chính quyền La Mã; Đức Thánh Linh; một quyền lực thiên sứ; hoặc sự định liệu của Đức Chúa Trời.
  rationale: Bản thân câu này dùng cách nói giống trung τὸ κατέχον và không nêu danh tính tác nhân. Bản dịch cần giữ nguyên sự bỏ ngỏ ấy.
- issue: Sắc thái của καιρός trong bối cảnh cánh chung
  choice: Dịch là “thời của chính mình”.
  alternative: “thời điểm đã được ấn định cho người ấy” hoặc “thời điểm thích hợp”.
  rationale: καιρός có thể hàm ý thời điểm thích hợp hay được ấn định, nhưng chính văn không cần thu hẹp vào một cách giải thích duy nhất.
- issue: Quan hệ mục đích hoặc kết quả trong εἰς τὸ ἀποκαλυφθῆναι
  choice: Dùng “để người ấy được tỏ ra”.
  alternative: “cho đến khi người ấy được tỏ ra” hoặc cách diễn đạt chỉ thuần kết quả.
  rationale: Cấu trúc Hy Lạp có thể mang sắc thái mục đích/kết quả; “để” giữ được mối liên hệ mà không biến nó thành một mốc kéo dài rõ rệt như “cho đến khi”.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Anh em” phù hợp với lời Phao-lô nói với cả cộng đồng. “Người ấy” tránh sắc thái xa cách hoặc tôn kính ngoài văn bản; “được tỏ ra” giữ thể bị động và sắc thái mặc khải của động từ Hy Lạp.
