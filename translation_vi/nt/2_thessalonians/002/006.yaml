revisions:
- from: Và giờ đây, anh em biết điều đang ngăn giữ người ấy[a], để người ấy được tỏ ra vào thời của chính mình.[b]
  to: Và nay, anh em biết điều đang ngăn giữ người ấy, để người ấy được bày tỏ vào thời của người ấy.[a][b]
  rationale: Chỉnh nhẹ để dùng “được bày tỏ” cho ἀποκαλυφθῆναι và làm rõ quy chiếu của ἑαυτοῦ. Bản sửa vẫn giữ cách nói trung tính về tác nhân ngăn giữ, không định danh nhân vật được bày tỏ, và không áp đặt cách hiểu cánh chung hay giáo phái nào. Các ký hiệu chú thích được đặt ngay sau mệnh đề liên hệ trước dấu chấm.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T20:20:07Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản nháp truyền đạt đúng các thành tố chính của câu Hy Lạp: νῦν là yếu tố thời gian; τὸ κατέχον được giữ ở giống trung, phi cá vị; οἴδατε là “anh em biết”; và mệnh đề nguyên mẫu bị động nói về việc nhân vật ấy được mặc khải vào thời của người ấy. Tuy nhiên, “được bày tỏ” phản ánh trực tiếp và nhất quán hơn sắc thái bị động-mặc khải của ἀποκαλυφθῆναι so với “được tỏ ra”.'
  naturalness: “Và nay” phù hợp hơn với văn mạch thư tín trang trọng mà vẫn là tiếng Việt hiện đại. “Vào thời của người ấy” tránh sự mơ hồ tham chiếu có thể có ở “thời của chính mình”, trong khi vẫn giữ ý ἑαυτοῦ quy về người sẽ được bày tỏ.
  terminology: “Điều đang ngăn giữ người ấy” bảo toàn tính trung lập của τὸ κατέχον và không đồng nhất tác nhân ngăn giữ. “Được bày tỏ” là thuật ngữ tự nhiên, chuẩn mực cho động từ ἀποκαλύπτω trong ngữ cảnh này. Không nên đưa nhận định “đã được ấn định” vào chính văn; có thể giữ ở chú thích như một khả năng ngữ nghĩa của καιρός.
  issues:
  - severity: low
    issue: “được tỏ ra” chưa diễn đạt tối ưu động từ ἀποκαλυφθῆναι
    rationale: Cụm này có thể tự nhiên trong một số ngữ cảnh, nhưng “được bày tỏ” biểu đạt rõ hơn thể bị động và nét nghĩa “được mặc khải/được làm lộ ra” của ἀποκαλύπτω.
  - severity: low
    issue: “thời của chính mình” có thể mơ hồ về đối tượng quy chiếu trong tiếng Việt
    rationale: Đại từ phản thân “mình” có thể bị người đọc liên hệ với chủ ngữ “anh em”. “Thời của người ấy” làm rõ rằng thời gian thuộc về nhân vật được bày tỏ, như ἑαυτοῦ trong câu Hy Lạp.
