source:
  edition: SBLGNT
  text: καὶ τότε ἀποκαλυφθήσεται ὁ ἄνομος, ὃν ὁ κύριος ⸀Ἰησοῦς ⸀ἀνελεῖ τῷ πνεύματι τοῦ στόματος αὐτοῦ καὶ καταργήσει τῇ ἐπιφανείᾳ τῆς παρουσίας αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/008.yaml
  text: And then the lawless one will be revealed[a], whom the Lord Jesus will slay with the breath of his mouth and bring to nothing by the appearance of his coming[b],
translation:
  language: vi
  text: Bấy giờ kẻ vô luật pháp sẽ bị phơi bày, kẻ mà Chúa Giê-su sẽ giết bằng hơi thở từ miệng Ngài[a] và vô hiệu hóa bằng sự tỏ hiện của sự đến của Ngài[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “bằng thần khí từ miệng Ngài.” Từ Hy Lạp có thể chỉ “hơi thở” hoặc “thần khí”; “hơi thở” hợp với thành ngữ ở đây hơn.'
    reason: lexical_alternative
  - marker: b
    text: 'Dịch sát hơn: “bởi sự tỏ hiện của sự hiện diện của Ngài.” Từ Hy Lạp παρουσία trong văn cảnh này thường chỉ sự đến của Chúa; tuy vậy, từ này cũng có thể mang nghĩa “sự hiện diện.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκαλυφθήσεται
  choice: sẽ bị phơi bày
  rationale: Giữ thể bị động tương lai và ý nghĩa một nhân vật được đưa ra ánh sáng; “phơi bày” tự nhiên trong tiếng Việt và phù hợp văn cảnh khải huyền.
- source_word: ὁ ἄνομος
  choice: kẻ vô luật pháp
  rationale: Phản ánh tính từ được dùng như danh từ, không tự ý thêm “người đàn ông”; chỉ nhân vật cánh chung đã được biết đến trong văn cảnh.
- source_word: ὁ κύριος Ἰησοῦς
  choice: Chúa Giê-su
  rationale: Cách gọi chuẩn, trang trọng và quen thuộc trong tiếng Việt đối với tước hiệu κύριος và tên riêng Ἰησοῦς.
- source_word: ἀνελεῖ
  choice: sẽ giết
  rationale: Diễn đạt trực tiếp sức mạnh của động từ ἀναιρέω trong văn cảnh này, tự nhiên hơn các cách cổ hoặc uyển chuyển.
- source_word: τῷ πνεύματι τοῦ στόματος αὐτοῦ
  choice: bằng hơi thở từ miệng Ngài
  rationale: πνεῦμα có thể là “hơi thở” hoặc “thần/linh”; trong thành ngữ này “hơi thở” hợp tự nhiên hơn và gợi âm hưởng Ê-sai 11:4. Dùng “từ miệng” để tránh cụm “hơi thở của miệng” thiếu tự nhiên trong tiếng Việt.
- source_word: καταργήσει
  choice: khiến nó ra hư không
  rationale: Giữ ý triệt tiêu hoàn toàn, làm mất hiệu lực hoặc đưa đến chỗ không còn tác dụng, mà không mặc nhiên đồng nhất động từ này với sự hủy diệt vật chất.
- source_word: τῇ ἐπιφανείᾳ τῆς παρουσίας αὐτοῦ
  choice: khi Ngài hiện đến
  rationale: Diễn đạt gọn và tự nhiên sự xuất hiện hữu hình gắn với παρουσία của Chúa; “hiện đến” giữ cả sắc thái xuất hiện và đến, trong khi chú thích bảo lưu cách dịch sát cấu trúc hơn.
theological_decisions:
- issue: Cách gọi nhân vật đối nghịch trong thời cuối cùng
  choice: kẻ vô luật pháp
  alternative: người của sự vô luật pháp
  rationale: Câu này dùng ὁ ἄνομος, một tính từ được danh từ hóa, chứ không dùng đầy đủ cụm từ ở câu lân cận; bản dịch không nhập thêm từ ngữ ngoài câu.
- issue: Phương tiện Chúa Giê-su dùng để chiến thắng
  choice: bằng hơi thở từ miệng Ngài
  alternative: bằng thần khí từ miệng Ngài
  rationale: “Hơi thở” hợp với thành ngữ và hình ảnh phán xét tiên tri hơn, nhưng “thần khí” vẫn nằm trong phạm vi nghĩa thật của πνεῦμα nên được giữ trong chú thích.
- issue: Mối quan hệ giữa sự hiện ra và sự quang lâm
  choice: khi Ngài hiện đến
  alternative: bởi sự tỏ hiện của sự hiện diện Ngài
  rationale: Cách dịch chính hiểu παρουσία theo nghĩa cánh chung thông thường là việc Chúa đến, nhưng không loại bỏ nghĩa từ vựng rộng hơn là “sự hiện diện”.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Đại từ “Ngài” quy chiếu về Chúa Giê-su; “nó” quy chiếu về kẻ vô luật pháp, giúp tránh nhầm chủ thể. Hai chú thích bảo lưu các khả năng nghĩa thực sự của πνεῦμα và παρουσία.
