id: 2TH.2.5
reference: 2 Thessalonians 2:5
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οὐ μνημονεύετε ὅτι ἔτι ὢν πρὸς ὑμᾶς ταῦτα ἔλεγον ὑμῖν;
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/005.yaml
  text: Do you not remember that while I was still with you, I was telling you these things?
translation:
  language: vi
  text: Anh chị em không nhớ rằng khi tôi còn ở với anh chị em, tôi vẫn thường nói với anh chị em những điều này sao?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μνημονεύετε
  choice: nhớ
  rationale: Động từ hiện tại trong câu hỏi tu từ hỏi liệu độc giả còn ghi nhớ lời dạy trước đó hay không; “nhớ” là cách diễn đạt tự nhiên và trực tiếp trong tiếng Việt hiện đại.
- source_word: ἔτι ὢν πρὸς ὑμᾶς
  choice: khi tôi còn ở với anh chị em
  rationale: Cụm phân từ diễn tả hoàn cảnh thời gian và sự hiện diện trực tiếp của Phao-lô giữa họ; “khi tôi còn ở với anh chị em” vừa tự nhiên vừa giữ được ý của ἔτι.
- source_word: ταῦτα
  choice: những điều này
  rationale: Cách dịch này giữ số nhiều của đại từ chỉ định và quy chiếu về các vấn đề vừa được đề cập trong ngữ cảnh.
- source_word: ἔλεγον
  choice: vẫn thường nói
  rationale: Thể chưa hoàn thành gợi hành động kéo dài hoặc lặp lại trong quá khứ. “Vẫn thường nói” thể hiện sắc thái ấy tự nhiên hơn “đã nói”.
- source_word: οὐ ... ὅτι
  choice: không nhớ rằng ... sao?
  rationale: Cấu trúc được chuyển thành câu hỏi tu từ tự nhiên trong tiếng Việt, còn “rằng” giới thiệu nội dung cần nhớ.
- source_word: ὑμᾶς / ὑμῖν
  choice: anh chị em
  rationale: Đại từ số nhiều chỉ toàn thể cộng đồng tín hữu; “anh chị em” rõ số nhiều, có sắc thái cộng đồng và phù hợp văn phong thư tín Cơ Đốc.
theological_decisions: []
