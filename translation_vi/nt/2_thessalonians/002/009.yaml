  text: οὗ ἐστιν ἡ παρουσία κατ’ ἐνέργειαν τοῦ Σατανᾶ ἐν πάσῃ δυνάμει καὶ σημείοις καὶ τέρασιν ψεύδους
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/009.yaml
  text: whose coming is according to the working of Satan[b][a], with all power and signs and wonders of falsehood.
translation:
  language: vi
  text: Kẻ ấy sẽ đến theo hoạt động của Sa-tan, với đủ mọi quyền năng, dấu lạ và việc kỳ diệu của sự dối trá.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “Sự xuất hiện của kẻ ấy diễn ra theo hoạt động của Sa-tan, với đủ mọi quyền năng, dấu lạ và việc kỳ diệu của sự dối trá.”'
    reason: Giữ khả năng dịch của παρουσία là “sự xuất hiện/sự hiện diện” và phản ánh cấu trúc sở hữu của ψεύδους; cụm này không tự nó quyết định các hiện tượng là hoàn toàn giả tạo hay là những hiện tượng được dùng cho sự dối trá.
lexical_decisions:
- source_word: οὗ ἐστιν ἡ παρουσία
  choice: Kẻ ấy sẽ đến
  rationale: Đại từ quan hệ sở hữu οὗ quy chiếu về “kẻ vô luật pháp” ở câu trước, còn παρουσία trong bối cảnh cánh chung chỉ sự xuất hiện hay việc đến. Tiếng Việt tự nhiên diễn đạt mệnh đề này bằng “Kẻ ấy sẽ đến”; chú thích giữ lại sắc thái danh từ của nguyên văn.
- source_word: κατ’ ἐνέργειαν τοῦ Σατανᾶ
  choice: theo sự vận hành của Sa-tan
  rationale: κατά diễn tả sự phù hợp về cách thức, còn ἐνέργεια nói đến hoạt động hữu hiệu hay sức đang vận hành. “Theo sự vận hành” vừa sát nghĩa vừa không xác định quá mức bản chất của tác động ấy.
- source_word: ἐν πάσῃ δυνάμει
  choice: với đủ mọi quyền năng
  rationale: ἐν ở đây giới thiệu phương tiện hoặc những gì đi kèm sự xuất hiện; πάσῃ có nghĩa bao quát. “Đủ mọi quyền năng” giữ δυνάμις là quyền năng thay vì thu hẹp thành phép lạ.
- source_word: σημείοις
  choice: dấu lạ
  rationale: “Dấu lạ” là cách diễn đạt quen thuộc, chỉ hiện tượng hoặc hành động phi thường mang ý nghĩa xác chứng.
- source_word: τέρασιν
  choice: việc kỳ diệu
  rationale: τέρατα chỉ những hiện tượng gây kinh ngạc. “Việc kỳ diệu” tự nhiên trong tiếng Việt và phân biệt được với “dấu lạ” trong cặp từ Hy Lạp.
- source_word: ψεύδους
  choice: dối trá
  rationale: Danh từ sở hữu ψεύδους có thể mô tả các dấu lạ và việc kỳ diệu là thuộc về, mang tính hoặc phục vụ sự dối trá. Cách dịch này không khẳng định chúng chỉ là trò giả mạo.
theological_decisions:
- issue: Bản chất của quyền năng, dấu lạ và việc kỳ diệu do Sa-tan vận hành
  choice: Giữ cách nói “dối trá”, để các hiện tượng có thể được hiểu là mang tính lừa dối hoặc phục vụ sự dối trá mà không quyết định chúng hoàn toàn giả tạo hay thật sự siêu nhiên.
  alternative: Dịch là “những phép lạ giả” hoặc khẳng định đó là các phép lạ siêu nhiên có thật.
  rationale: Nguyên văn mô tả sự xuất hiện ấy theo sự vận hành của Sa-tan và gắn ψεύδους với bộ ba quyền năng, dấu lạ, việc kỳ diệu, nhưng không giải thích bản thể của các hiện tượng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Sa-tan” theo cách phiên âm phổ biến; giữ nhịp ba vế “quyền năng, dấu lạ và việc kỳ diệu”, đồng thời tránh từ ngữ hàm ý các hiện tượng nhất thiết chỉ là trò giả mạo.
