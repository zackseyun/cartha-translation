  source_fidelity: Bản dịch truyền đạt đúng chủ thể quy chiếu (kẻ vô luật pháp ở câu trước), nguồn gốc thuộc hoạt động của Sa-tan, và bộ ba δύναμις–σημεῖα–τέρατα. Tuy nhiên, “việc kỳ diệu dối trá” trong tiếng Việt có xu hướng chỉ bổ nghĩa trực tiếp cho hạng mục cuối và nghiêng về nghĩa các việc ấy tự chúng giả dối. Cấu trúc ψεύδους trong nguyên văn có thể bao quát ít nhất “dấu lạ và việc kỳ diệu”, và không xác quyết bản thể các hiện tượng. “... của sự dối trá” giữ được cấu trúc và độ mở này tốt hơn.
  naturalness: “Kẻ ấy sẽ đến” rõ và tự nhiên trong mạch cánh chung. “Theo sự vận hành” có thể hiểu được, nhưng “theo hoạt động của Sa-tan” tự nhiên hơn trong tiếng Việt hiện đại mà vẫn phản ánh κατ’ ἐνέργειαν. “Việc kỳ diệu” là từ ngữ trang trọng, phù hợp; thêm “của sự dối trá” tạo liên kết ngữ pháp rõ ràng hơn.
  terminology: Giữ “Sa-tan”, “quyền năng” và “dấu lạ” là nhất quán với cách dùng Kinh Thánh Việt ngữ hiện đại. Không nên đổi ψεύδους thành “giả” hoặc “lừa đảo”, vì các từ đó giải quyết quá mức vấn đề bản chất của các dấu lạ. Cụm “dấu lạ và việc kỳ diệu của sự dối trá” bảo toàn tính mơ hồ có chủ ý của nguyên văn.
