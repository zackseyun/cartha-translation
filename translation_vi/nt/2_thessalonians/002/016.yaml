revisions:
- from: Nguyện chính Chúa Giê-su, Đấng Mê-si của chúng ta, và Đức Chúa Trời là Cha chúng ta, Đấng đã yêu thương chúng ta và bởi ân điển ban cho chúng ta sự khích lệ đời đời[a] cùng niềm hy vọng tốt đẹp,
  to: Nguyện chính Chúa chúng ta là Giê-su, Đấng Mê-si, và Đức Chúa Trời, là Cha chúng ta, Đấng đã yêu thương chúng ta và bởi ân điển ban cho chúng ta sự khích lệ đời đời[a] cùng niềm hy vọng tốt đẹp,
