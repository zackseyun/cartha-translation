id: 2TH.2.16
reference: 2 Thessalonians 2:16
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Αὐτὸς δὲ ὁ κύριος ἡμῶν Ἰησοῦς Χριστὸς καὶ ⸀θεὸς ⸀ὁ πατὴρ ἡμῶν, ὁ ἀγαπήσας ἡμᾶς καὶ δοὺς παράκλησιν αἰωνίαν καὶ ἐλπίδα ἀγαθὴν ἐν χάριτι,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/016.yaml
  text: May our Lord Jesus the Messiah himself[a], and God our Father, who loved us and gave us eternal encouragement and good hope by grace,
translation:
  language: vi
  text: Nguyện chính Chúa chúng ta là Giê-su, Đấng Mê-si, và Đức Chúa Trời, là Cha chúng ta, Đấng đã yêu thương chúng ta và bởi ân điển ban cho chúng ta sự khích lệ đời đời[a] cùng niềm hy vọng tốt đẹp,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “sự an ủi” hoặc “sự yên ủi”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Αὐτὸς
  choice: chính
  rationale: Dùng “chính” để giữ sắc thái nhấn mạnh vào chủ thể đích thân hành động.
- source_word: δὲ
  choice: Nguyện
  rationale: Câu chuyển sang lời cầu chúc; tiếng Việt diễn đạt tự nhiên bằng “Nguyện”. Sắc thái chuyển tiếp nhẹ của δέ được hòa vào cách mở đầu, không thêm một từ chỉ thời gian như “bây giờ”.
- source_word: ὁ κύριος ἡμῶν Ἰησοῦς Χριστὸς
  choice: Chúa Giê-su, Đấng Mê-si của chúng ta
  rationale: “Chúa” giữ tước hiệu κύριος; Χριστός được dịch theo nghĩa tước hiệu là “Đấng Mê-si”, không chỉ phiên âm hay coi như họ tên.
- source_word: θεὸς ὁ πατὴρ ἡμῶν
  choice: Đức Chúa Trời là Cha chúng ta
  rationale: Giữ cả θεός và πατήρ, đồng thời dùng cấu trúc tiếng Việt rõ ràng, tự nhiên.
- source_word: ὁ ἀγαπήσας
  choice: Đấng đã yêu thương
  rationale: Chuyển phân từ aorist có mạo từ thành mệnh đề quan hệ; “đã” diễn đạt hành động mà không suy diễn thêm về thời điểm.
- source_word: δοὺς
  choice: ban cho
  rationale: “Ban cho” phù hợp với hành động Đức Chúa Trời trao tặng và giữ sắc thái trang trọng vừa phải.
- source_word: παράκλησιν
  choice: sự khích lệ
  rationale: Từ này có thể chỉ sự khích lệ, an ủi hay vỗ về. “Sự khích lệ” phù hợp với ngữ cảnh củng cố lòng người tin ở câu kế tiếp; phương án khác được giữ trong chú thích.
- source_word: αἰωνίαν
  choice: đời đời
  rationale: Cách diễn đạt tự nhiên và quen thuộc trong tiếng Việt cho tính bền vững không dứt của αἰώνιος.
- source_word: ἐλπίδα ἀγαθὴν
  choice: niềm hy vọng tốt đẹp
  rationale: Giữ ý nghĩa tích cực của ἀγαθή bằng một cụm từ rõ ràng, tự nhiên trong tiếng Việt hiện đại.
- source_word: ἐν χάριτι
  choice: bởi ân điển
  rationale: 'Hiểu ἐν theo nghĩa phương tiện hoặc nguyên nhân: sự khích lệ và hy vọng được ban bởi ân điển.'
theological_decisions:
- issue: Các phân từ số ít “Đấng đã yêu thương… và ban cho…” theo sau hai chủ thể được nối bằng “và”
  choice: Giữ một mệnh đề quan hệ số ít “Đấng đã…” sau cả “Chúa Giê-su… và Đức Chúa Trời là Cha chúng ta”, theo đúng hiện tượng cú pháp Hy Lạp.
  alternative: Hiểu mệnh đề mô tả chỉ quy về Đức Chúa Trời là Cha; hoặc diễn giải để nói rõ cả hai vị đều là chủ thể.
  rationale: Nguyên văn đặt hai chủ thể phối hợp trước các phân từ số ít. Bản dịch không nên âm thầm giới hạn mệnh đề vào riêng Đức Chúa Cha, cũng không nên mở rộng để khẳng định quá mức điều cú pháp không nói tường minh. Cấu trúc tiếng Việt hiện tại duy trì được sức căng và khả năng quy chiếu của nguyên văn.
translation_notes:
  register: Văn phong tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “Giê-su”, “Đấng Mê-si”, “Đức Chúa Trời” và “ân điển” nhất quán với ngữ vực Kinh Thánh phổ thông. Dấu phẩy cuối câu được giữ vì câu 16 tiếp tục sang câu 17 trong nguyên văn.
