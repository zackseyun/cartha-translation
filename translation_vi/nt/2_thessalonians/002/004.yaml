language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὁ ἀντικείμενος καὶ ὑπεραιρόμενος ἐπὶ πάντα λεγόμενον θεὸν ἢ σέβασμα, ὥστε αὐτὸν εἰς τὸν ναὸν τοῦ ⸀θεοῦ καθίσαι ἀποδεικνύντα ἑαυτὸν ὅτι ἔστιν θεός.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/004.yaml
  text: the one who opposes and exalts himself over every so-called god or object of worship[a], so that he takes his seat in the temple of God[b], displaying himself as being God.
translation:
  language: vi
  text: kẻ chống đối và tự tôn mình lên trên mọi cái gọi là thần hoặc mọi đối tượng được thờ phượng, đến nỗi ngồi trong đền thờ của Đức Chúa Trời[a], tự tỏ mình ra là Đức Chúa Trời[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “nơi thánh của Đức Chúa Trời”.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “tự tỏ mình ra là một vị thần”.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ ἀντικείμενος
  choice: kẻ chống đối
  rationale: Phân từ hiện tại có mạo từ được dùng như danh từ, chỉ một nhân vật đang chống đối; cách dịch này không biến cụm từ thành một danh hiệu chuyên biệt ngoài điều bản Hy Lạp nói rõ.
- source_word: ὑπεραιρόμενος
  choice: tự tôn mình lên trên
  rationale: Giữ sắc thái phản thân của phân từ trung động và ý tự nâng mình lên cao hơn tất cả các đối tượng được nêu sau đó.
- source_word: ἐπὶ πάντα λεγόμενον θεὸν
  choice: lên trên mọi thứ được gọi là thần
  rationale: ἐπί với đối cách trong cấu trúc này diễn tả vị thế vượt trên; λεγόμενον cho biết đối tượng được gọi là thần mà không xác nhận nó thật sự là thần.
- source_word: σέβασμα
  choice: thứ được tôn thờ
  rationale: Danh từ chỉ rộng rãi một đối tượng được sùng kính hoặc thờ phượng, không nhất thiết chính là một vị thần.
- source_word: ὥστε
  choice: đến mức
  rationale: Diễn đạt kết quả của hành vi tự tôn, phù hợp với cấu trúc ὥστε đi với động từ nguyên mẫu.
- source_word: εἰς τὸν ναὸν τοῦ θεοῦ καθίσαι
  choice: ngồi trong đền thờ của Đức Chúa Trời
  rationale: Trong ngữ cảnh động từ ngồi, εἰς có thể diễn tả việc chiếm chỗ bên trong; ναός chỉ đền thờ, có thể cụ thể hơn là nơi thánh. Dùng “ngồi” tránh thêm ý “ngự” vốn có thể diễn giải quá mức.
- source_word: ἀποδεικνύντα ἑαυτὸν
  choice: phô bày mình
  rationale: Diễn tả việc công khai trình hiện hay cho thấy mình là ai, không mặc nhiên biến hành động này thành một lời tuyên bố bằng miệng.
- source_word: ὅτι ἔστιν θεός
  choice: là Đức Chúa Trời
  rationale: Trong cao trào của câu, nhân vật ngồi trong đền thờ của Đức Chúa Trời rồi phô bày mình với địa vị tối cao ấy. Cách dịch mô tả sự tự nhận đầy phạm thượng chứ không xác nhận bản tính của nhân vật.
theological_decisions:
- issue: Danh từ θεός không có mạo từ ở cuối câu nên dịch là “Đức Chúa Trời” hay “một vị thần”
  choice: Đức Chúa Trời
  alternative: một vị thần
  rationale: Mạch văn về đền thờ của Đức Chúa Trời và sự tự tôn trên mọi đối tượng thần thánh khiến “Đức Chúa Trời” thể hiện rõ nhất mức độ của lời tự nhận. Tuy nhiên, vì θεός không có mạo từ nên khả năng “một vị thần” vẫn được giữ trong chú thích.
- issue: ναός nên dịch là “đền thờ” hay cụ thể hơn là “nơi thánh”
  choice: đền thờ của Đức Chúa Trời
  alternative: nơi thánh của Đức Chúa Trời
  rationale: “Đền thờ” tự nhiên và dễ hiểu trong tiếng Việt, đồng thời không quyết định thay người đọc rằng hình ảnh này nhất thiết chỉ nơi thánh bên trong hay phải được hiểu theo nghĩa đen hoặc nghĩa biểu tượng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “kẻ” cho nhân vật đã được xác định là kẻ chống đối, rồi dùng “kẻ ấy” để tránh đại từ mang thêm sắc thái khinh miệt không có trực tiếp trong tiếng Hy Lạp. Giữ cấu trúc một câu và sức căng thần học của lời tự tôn.
