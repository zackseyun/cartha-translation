    rationale: Nguyên văn nêu “mọi cái gọi là thần” và “mọi đối tượng được thờ phượng”; σέβασμα không chỉ đơn thuần là bất cứ “thứ” nào được tôn thờ. Cách diễn đạt rõ hơn giúp giữ độ rộng ngữ nghĩa và văn phong trang trọng.
