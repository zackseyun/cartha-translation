  verdict: revise
  source_fidelity: 'Bản dịch chuyển tải đúng chuỗi hành động và các nét chính của câu: họ đưa đứa trẻ đến với Đức Giê-su; thần linh thấy Ngài, lập tức khiến đứa trẻ co giật; rồi đứa trẻ ngã, lăn lộn và sùi bọt. Không thêm tính từ “ô uế” vào chính văn là phù hợp với τὸ πνεῦμα trong câu này. Tuy nhiên, đại từ “Em” ở câu cuối làm gián đoạn cách gọi “đứa trẻ” và kém rõ trong mạch tường thuật.'
