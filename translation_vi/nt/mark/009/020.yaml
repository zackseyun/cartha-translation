    rationale: “Quằn quại” diễn tả tình trạng co giật nói chung, trong khi ἐκυλίετο đặc biệt nói đến hành động lăn/roll about. Nên chỉ giữ lựa chọn phản ánh rõ nét chuyển động lăn.
