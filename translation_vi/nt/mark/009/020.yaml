  text: καὶ ἤνεγκαν αὐτὸν πρὸς αὐτόν. καὶ ἰδὼν αὐτὸν ⸂τὸ πνεῦμα εὐθὺς⸃ ⸀συνεσπάραξεν αὐτόν, καὶ πεσὼν ἐπὶ τῆς γῆς ἐκυλίετο ἀφρίζων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/020.yaml
  text: And they brought him to him[a]. And when the spirit saw him, it immediately convulsed him, and he fell on the ground and rolled about[b], foaming.
translation:
  language: vi
  text: Họ đưa đứa trẻ đến với Đức Giê-su. Vừa thấy Ngài, thần linh ấy[a] lập tức làm đứa trẻ co giật dữ dội. Đứa trẻ ngã xuống đất, lăn lộn[b] và sùi bọt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn chỉ nói “thần linh”; văn cảnh rộng hơn cho biết đây là một thần linh ô uế.
    reason: Giữ nguyên mức độ xác định của câu Hy Lạp trong khi giúp người đọc liên hệ với văn cảnh.
  - marker: b
    text: 'Cũng có thể diễn đạt: “lăn qua lăn lại.”'
    reason: Nêu một cách diễn đạt tiếng Việt khả dĩ cho chuyển động tiếp diễn do ἐκυλίετο mô tả.
lexical_decisions:
- source_word: ἤνεγκαν αὐτὸν πρὸς αὐτόν
  choice: Họ đưa đứa trẻ đến với Đức Giê-su
  rationale: Dùng danh từ theo văn cảnh để phân biệt hai đại từ cùng hình thức trong tiếng Hy Lạp và tránh câu tiếng Việt tối nghĩa; động từ ἤνεγκαν ở đây chỉ việc đưa đứa trẻ đến với Đức Giê-su.
- source_word: ἰδὼν αὐτόν
  choice: Vừa thấy Ngài
  rationale: Cấu trúc phân từ được diễn đạt theo nghĩa thời gian; “vừa… lập tức” thể hiện sự tiếp nối nhanh trong câu chuyện. “Ngài” chỉ Đức Giê-su theo văn cảnh.
- source_word: τὸ πνεῦμα
  choice: thần linh ấy
  rationale: Giữ nghĩa trực tiếp là “thần linh/linh thể” mà không tự ý thêm “ô uế” hay đổi thành “quỷ”; từ “ấy” nối với thực thể đã được nói đến trong văn cảnh.
- source_word: εὐθὺς
  choice: lập tức
  rationale: Chuyển tải rõ sắc thái tức thời và phù hợp với nhịp kể đặc trưng của Mác.
- source_word: συνεσπάραξεν αὐτόν
  choice: làm đứa trẻ co giật dữ dội
  rationale: Động từ diễn tả việc gây nên những cơn co giật mạnh; cách nói này rõ nghĩa và tự nhiên trong tiếng Việt hiện đại.
- source_word: πεσὼν ἐπὶ τῆς γῆς
  choice: Em ngã xuống đất
  rationale: Diễn đạt chuỗi hành động của phân từ bằng một mệnh đề hữu hạn tự nhiên, đồng thời xác định rõ đứa trẻ là người ngã.
- source_word: ἐκυλίετο
  choice: lăn lộn
  rationale: Thì vị hoàn mô tả chuyển động đang tiếp diễn; “lăn lộn” chuyển tải tự nhiên hình ảnh lăn qua lăn lại trên mặt đất.
- source_word: ἀφρίζων
  choice: sùi bọt
  rationale: Giữ đúng nội dung của phân từ mà không thêm “ở miệng,” dù điều đó được hàm ý.
theological_decisions:
- issue: Cách xác định τὸ πνεῦμα
  choice: Dịch là “thần linh ấy” trong chính văn.
  alternative: “uế linh ấy” hoặc “quỷ ấy”
  rationale: Văn cảnh rộng hơn xác định đây là một thần linh ô uế, nhưng câu này chỉ có τὸ πνεῦμα. Bản dịch giữ cách gọi của chính câu, không đưa phần giải thích theo văn cảnh vào chính văn.
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Danh từ theo văn cảnh được dùng thay cho chuỗi đại từ Hy Lạp để tránh nhập nhằng về Đức Giê-su, đứa trẻ và thần linh; không thêm định tính thần học vào τὸ πνεῦμα.
