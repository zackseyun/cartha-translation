  text: ὁ δὲ ἀποκριθεὶς ⸀αὐτοῖς λέγει· Ὦ γενεὰ ἄπιστος, ἕως πότε πρὸς ὑμᾶς ἔσομαι; ἕως πότε ἀνέξομαι ὑμῶν; φέρετε αὐτὸν πρός με.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/019.yaml
  text: And answering them[a], he says, “O unbelieving generation[b], how long will I be with you? How long will I put up with you? Bring him to me.”
translation:
  language: vi
  text: 'Người đáp lời họ và nói: “Hỡi thế hệ không tin[a], ta sẽ còn ở với các người đến bao lâu nữa? Ta sẽ còn chịu đựng các người đến bao lâu nữa?[b] Hãy đưa cậu bé ấy đến với ta.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “thiếu lòng tin” hoặc “thiếu trung tín.” Từ Hy Lạp có thể chỉ sự không tin/thiếu lòng tin hoặc sự thiếu trung tín.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “Ta sẽ còn dung chịu các người đến bao lâu nữa?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς αὐτοῖς λέγει
  choice: Người đáp lời họ
  rationale: Diễn đạt tự nhiên công thức dẫn lời trong tiếng Hy Lạp; “Người” chỉ Chúa Giê-su theo văn cảnh. Không nhất thiết tái hiện thì hiện tại lịch sử của λέγει bằng một cấu trúc gượng trong tiếng Việt.
- source_word: γενεὰ ἄπιστος
  choice: thế hệ không tin
  rationale: “Không tin” diễn đạt trực tiếp sự thiếu lòng tin trong văn cảnh, đồng thời chú thích giữ lại nghĩa khả dĩ “bất tín/không trung tín” của ἄπιστος.
- source_word: ἕως πότε πρὸς ὑμᾶς ἔσομαι
  choice: ta sẽ còn ở với các người đến bao giờ?
  rationale: Giữ ý về sự hiện diện tiếp diễn và câu hỏi đầy trách cứ; “sẽ còn” chuyển tải tự nhiên sắc thái tương lai của ἔσομαι.
- source_word: ἀνέξομαι ὑμῶν
  choice: ta sẽ còn phải chịu đựng các người đến bao giờ?
  rationale: “Chịu đựng” giữ được sức nặng của động từ ἀνέχομαι và sự bực lòng trong lời quở trách, còn “phải” làm câu tiếng Việt tự nhiên mà không thay đổi trọng tâm.
- source_word: φέρετε αὐτὸν πρός με
  choice: Hãy đưa cậu bé ấy đến với ta
  rationale: Mệnh lệnh được diễn đạt trực tiếp. “Cậu bé ấy” làm rõ đối tượng nam trẻ tuổi đã được xác định trong văn cảnh, tránh đại từ “nó” dễ mang sắc thái coi thường trong tiếng Việt hiện đại.
theological_decisions:
- issue: Sắc thái của ἄπιστος trong lời quở trách
  choice: không tin
  alternative: bất tín; không trung tín
  rationale: Văn cảnh nhấn mạnh sự thiếu lòng tin, nhưng từ Hy Lạp cũng có thể chỉ sự thiếu trung tín. Bản dịch chính không áp đặt kết luận hẹp hơn, còn chú thích bảo tồn độ mở ngữ nghĩa.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “ta” giữ giọng uy quyền của Chúa Giê-su; “các người” tạo khoảng cách phù hợp với lời quở trách mà không dùng dạng cổ “các ngươi”.
