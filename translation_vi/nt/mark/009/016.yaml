  text: And he asked them[a], “What are you discussing with one another?”
translation:
  language: vi
  text: 'Và Ngài hỏi họ: “Các ông đang bàn luận[a] với nhau về chuyện gì?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Các ông đang tranh luận với nhau về chuyện gì?” Động từ Hy Lạp có thể mang nghĩa bàn luận, tranh luận hoặc tranh cãi, tùy theo văn cảnh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Rồi
  rationale: Trong mạch kể chuyện, καί nối hành động này với sự việc ngay trước đó. “Rồi” là cách nối tự nhiên trong tiếng Việt mà không làm thay đổi nội dung.
- source_word: ἐπηρώτησεν
  choice: hỏi
  rationale: Động từ ở đây dẫn vào lời nói trực tiếp trong một trình thuật đơn giản; “hỏi” là cách diễn đạt tự nhiên, chính xác và không thêm sắc thái trang trọng hay gay gắt.
- source_word: αὐτούς
  choice: họ
  rationale: Đại từ số nhiều không nêu rõ đối tượng ngay trong câu này. “Họ” giữ nguyên tính không xác định ấy, thay vì tự ý giới hạn là đám đông, các môn đồ hay các kinh sư.
- source_word: Τί
  choice: về chuyện gì
  rationale: τί hỏi nội dung hoặc đề tài đang được trao đổi. Cụm “về chuyện gì” phù hợp tự nhiên với cấu trúc tiếng Việt “bàn luận ... về chuyện gì”.
- source_word: συζητεῖτε
  choice: đang bàn luận
  rationale: συζητέω có thể chỉ việc trao đổi, tranh luận hoặc tranh cãi. “Đang bàn luận” giữ được nghĩa rộng và không áp đặt sắc thái đối đầu; khả năng mang nghĩa tranh cãi được ghi ở chú thích.
- source_word: πρὸς αὑτούς
  choice: với nhau
  rationale: Cụm này diễn tả hành động qua lại giữa những người trong nhóm. “Với nhau” là cách diễn đạt tiếng Việt tự nhiên và rõ nghĩa.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Ngài” cho chủ thể được nối tiếp từ văn cảnh, còn “các ông” trong lời hỏi phù hợp với một nhóm nam giới trưởng thành mà không xác định hẹp hơn. Chú thích bảo lưu sắc thái đối đầu có thể có của συζητέω.
