base_translation:
  language: en
  yaml_path: translation/nt/mark/009/023.yaml
  text: But Jesus said to him[b][a], “ ‘If you can’? All things are possible for the one who believes.”
translation:
  language: vi
  text: 'Nhưng Đức Giê-su nói với ông: “ ‘Nếu thầy có thể’ ư?[a] Mọi sự đều có thể đối với người tin.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay sát nghĩa hơn: “Cái ‘nếu thầy có thể’ ư?” Đức Giê-su nhắc lại và chất vấn cách nói của người cha ở câu trước.'
    reason: lexical_alternative
  - marker: b
    text: “Người tin” cũng có thể dịch là “người có đức tin” hoặc “người tín thác”.
    reason: alternative_reading
lexical_decisions:
- source_word: Τὸ Εἰ δύνῃ
  choice: Chuyện ‘nếu thầy có thể’ ư?
  rationale: Mạo từ trung tính Τὸ danh từ hóa lời trích dẫn và cho thấy Đức Giê-su nhắc lại đầy dụng ý lời của người cha ở câu trước. Cách diễn đạt này tự nhiên trong tiếng Việt mà vẫn giữ sắc thái chất vấn.
- source_word: δύνῃ
  choice: thầy có thể
  rationale: Động từ δύναμαι có nghĩa thông thường là ‘có thể, có khả năng’. Đại từ ‘thầy’ được dùng theo cách người cha vừa thưa với Đức Giê-su trong lời thoại, tránh lối xưng hô ‘bạn’ không tự nhiên.
- source_word: πάντα
  choice: mọi sự
  rationale: Cụm này giữ được phạm vi rộng và sức nặng tu từ của dạng số nhiều trung tính trong tiếng Hy Lạp.
- source_word: δυνατὰ
  choice: đều có thể
  rationale: Trong cấu trúc vị ngữ này, δυνατά chỉ điều có thể xảy ra hoặc thực hiện; ‘đều có thể’ là cách nói gọn, tự nhiên.
- source_word: τῷ πιστεύοντι
  choice: đối với người tin
  rationale: Phân từ hiện tại có mạo từ chỉ người đang tin theo nghĩa khái quát. ‘Người tin’ giữ được dạng động từ hơn cách gọi mang tính nhãn danh ‘tín hữu’.
- source_word: πιστεύοντι
  choice: tin
  rationale: πιστεύω có thể mang sắc thái tin, có đức tin hoặc tín thác. ‘Tin’ là tương đương trực tiếp, tự nhiên và không thu hẹp sắc thái của nguyên ngữ.
theological_decisions:
- issue: Phạm vi của lời ‘mọi sự đều có thể’
  choice: Giữ nguyên lời khẳng định có vẻ tuyệt đối, không thêm điều kiện giải thích trong chính văn.
  alternative: ‘Nhờ Đức Chúa Trời, mọi sự đều có thể đối với người tin’ hoặc diễn giải rằng khả năng này nằm trong quyền năng và ý muốn của Đức Chúa Trời.
  rationale: Bản Hy Lạp tại câu này không có cụm ‘với Đức Chúa Trời’. Việc không thêm cụm ấy bảo toàn sức mạnh tu từ và sự căng thẳng thần học của lời Đức Giê-su, thay vì giải quyết bằng diễn giải.
- issue: Sắc thái của Τὸ Εἰ δύνῃ
  choice: Hiểu là Đức Giê-su nhắc lại và chất vấn lời ‘nếu thầy có thể’.
  alternative: 'Đọc như một chủ đề không mang dạng câu hỏi: ‘Về chuyện “nếu thầy có thể”...’'
  rationale: Mạo từ Τὸ trước mệnh đề được trích có thể được chuyển sát là ‘cái “nếu thầy có thể”’. Dạng câu hỏi trong tiếng Việt truyền đạt tự nhiên sức nhấn, nhưng chú thích vẫn bảo lưu cách dịch sát hơn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng ‘Đức Giê-su’ và cách xưng hô ‘thầy’ phù hợp lời đối thoại; tránh từ ngữ giáo phái. Dấu chú thích [a], [b] đều xuất hiện trong chính văn.
