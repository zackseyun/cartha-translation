  to: Ở bất cứ nơi nào nó chộp lấy con tôi, nó quật con tôi ngã xuống; con tôi sùi bọt, nghiến răng và cứng đờ.[a] Tôi đã bảo các môn đệ của Thầy đuổi nó ra, nhưng họ không làm được.
