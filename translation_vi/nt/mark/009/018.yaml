id: MRK.9.18
reference: Mark 9:18
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ὅπου ⸀ἐὰν αὐτὸν καταλάβῃ ῥήσσει αὐτόν, καὶ ἀφρίζει καὶ τρίζει τοὺς ⸀ὀδόντας καὶ ξηραίνεται· καὶ εἶπα τοῖς μαθηταῖς σου ἵνα αὐτὸ ἐκβάλωσιν, καὶ οὐκ ἴσχυσαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/018.yaml
  text: And wherever it seizes him[a], it throws him down, and he foams and grinds his teeth and becomes rigid. And I told your disciples to cast it out, but they were not able.
translation:
  language: vi
  text: Ở bất cứ nơi nào nó chộp lấy con tôi, nó quật con tôi ngã xuống; con tôi sùi bọt, nghiến răng và cứng đờ.[a] Tôi đã bảo các môn đệ của Thầy đuổi nó ra, nhưng họ không làm được.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “khô héo”, “hao mòn”, hoặc sát chữ hơn là “khô đi”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπου ἐὰν
  choice: bất cứ nơi nào
  rationale: Giữ sắc thái quan hệ bất định của cụm từ Hy Lạp, chỉ bất cứ nơi nào sự việc xảy ra, đồng thời diễn đạt tự nhiên trong tiếng Việt.
- source_word: καταλάβῃ
  choice: bắt lấy
  rationale: Diễn tả việc tà linh bất ngờ khống chế cậu bé bằng một cách nói rõ ràng, sinh động mà không thêm ý ngoài nguyên văn.
- source_word: ῥήσσει
  choice: quật ... xuống
  rationale: Trong ngữ cảnh cơn co giật do tà linh gây ra, động từ chỉ hành động dữ dội làm cậu bé ngã xuống; “quật xuống” tự nhiên hơn cách dịch có thể bị hiểu là xé rách thân thể.
- source_word: ἀφρίζει
  choice: sùi bọt mép
  rationale: “Sùi bọt mép” là cách diễn đạt triệu chứng này tự nhiên và dễ hiểu trong tiếng Việt; “mép” làm rõ điều vốn được ngầm hiểu trong động từ Hy Lạp.
- source_word: τρίζει τοὺς ὀδόντας
  choice: nghiến răng
  rationale: Tương ứng trực tiếp với hành động nghiến hoặc ken răng và phù hợp với chuỗi triệu chứng thể chất.
- source_word: ξηραίνεται
  choice: cứng đờ
  rationale: Trong chuỗi triệu chứng của cơn co giật, “cứng đờ” là cách hiểu phù hợp và dễ hiểu; nghĩa sát chữ “khô đi” cùng các khả năng khác được giữ trong chú thích vì sắc thái chính xác còn chưa chắc chắn.
- source_word: εἶπα
  choice: đã bảo
  rationale: Diễn đạt tự nhiên việc người cha yêu cầu các môn đồ thực hiện hành động tiếp theo.
- source_word: ἐκβάλωσιν
  choice: đuổi nó ra
  rationale: Giữ nghĩa trừ tà quen thuộc của ἐκβάλλω và đại từ trung tính chỉ tà linh.
- source_word: οὐκ ἴσχυσαν
  choice: họ không làm được
  rationale: Truyền đạt sự bất lực hoặc không đủ khả năng mà không giải thích thêm nguyên nhân thất bại.
theological_decisions:
- issue: Đối tượng của αὐτό trong câu “đuổi nó ra”
  choice: Đại từ “nó” chỉ tà linh đang hành hạ cậu bé.
  alternative: Có thể hiểu khái quát hơn là tai họa hoặc chứng bệnh.
  rationale: Mạch văn trực tiếp nói đến một tà linh chiếm giữ và bắt lấy cậu bé; giữ đại từ “nó” vừa bám sát tiếng Hy Lạp vừa không thêm tên gọi không có trong câu này.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “cháu” theo lời người cha nói về con mình với Chúa Giê-su, và “Thầy” làm cách xưng hô kính trọng trong bối cảnh thầy–môn đồ. Dấu chú thích được đặt ngay sau “cứng đờ,” là từ mà chú thích giải thích.
