source:
  edition: SBLGNT
  text: καὶ πολλάκις ⸂καὶ εἰς πῦρ αὐτὸν⸃ ἔβαλεν καὶ εἰς ὕδατα ἵνα ἀπολέσῃ αὐτόν· ἀλλ’ εἴ τι ⸀δύνῃ, βοήθησον ἡμῖν σπλαγχνισθεὶς ἐφ’ ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/022.yaml
  text: And many times it has thrown him both into fire and into waters to destroy him[a]. But if you can do anything, help us[b], having compassion on us.
translation:
  language: vi
  text: Nhiều lần nó đã quăng cháu vào lửa và vào nước[a] để hủy diệt cháu. Nhưng nếu thầy có thể làm được điều gì, xin thương xót chúng tôi và giúp chúng tôi!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn Hy Lạp dùng dạng số nhiều cho “nước”; cũng có thể dịch là “vào các vùng nước.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλάκις
  choice: nhiều lần
  rationale: Diễn tả những lần tái diễn, sát nghĩa và tự nhiên trong tiếng Việt hiện đại.
- source_word: ἔβαλεν
  choice: quăng
  rationale: Động từ ở thì aorist tóm lược hành động đã xảy ra nhiều lần; kết hợp với “nhiều lần”, cách dịch này truyền đạt rõ sự tái diễn và tính bạo lực.
- source_word: εἰς πῦρ ... καὶ εἰς ὕδατα
  choice: vào lửa và xuống nước
  rationale: Giữ hai cụm giới từ song song nhưng dùng cách kết hợp từ tự nhiên trong tiếng Việt; “nước” ở số ít là cách diễn đạt thông dụng, còn số nhiều của nguyên văn được ghi chú.
- source_word: ἵνα ἀπολέσῃ αὐτόν
  choice: để hủy diệt cháu
  rationale: Giữ rõ ý chỉ mục đích của ἵνα và không thu hẹp ἀπόλλυμι thành riêng nghĩa “giết chết”.
- source_word: ἀλλ’ εἴ τι δύνῃ
  choice: Nhưng nếu thầy có thể làm được điều gì
  rationale: Thể hiện τι (“điều gì”) và giữ nguyên sự dè dặt, chưa chắc chắn trong lời cầu xin của người cha.
- source_word: βοήθησον ἡμῖν
  choice: giúp đỡ
  rationale: Mệnh lệnh aorist là lời khẩn cầu trợ giúp ngay; đối tượng số nhiều “chúng tôi” được đặt cùng cụm diễn tả lòng thương xót để câu tiếng Việt tự nhiên.
- source_word: σπλαγχνισθεὶς ἐφ’ ἡμᾶς
  choice: xin thương xót chúng tôi
  rationale: Truyền đạt lòng trắc ẩn sâu xa của σπλαγχνίζομαι bằng lời cầu xin tự nhiên, trang trọng; “chúng tôi” giữ nguyên đối tượng số nhiều ἡμᾶς.
theological_decisions:
- issue: Giọng điệu lời cầu xin và sự hoài nghi ngầm về khả năng của Chúa Giê-su
  choice: “nếu thầy có thể làm được điều gì”
  alternative: “nếu thầy làm được” hoặc cách diễn đạt làm lời xin nghe tin chắc hơn
  rationale: Nguyên văn nói thẳng sự dè dặt của người cha. Bản dịch giữ sự căng thẳng này, không làm nhẹ đi hay biến nó thành một lời tuyên xưng đầy tin chắc.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “cháu” trong lời người cha nói về con mình và “thầy” khi thưa với Chúa Giê-su, phù hợp lời thoại tiếng Việt mà không đưa thêm tước hiệu thần học vào câu.
