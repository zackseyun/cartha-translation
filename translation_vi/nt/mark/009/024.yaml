  to: 'Lập tức, cha đứa trẻ[a] kêu lên: “Tôi tin; xin giúp tôi vượt qua sự không tin của tôi[b]!”'
  rationale: Bản sửa đổi thay cụm giới từ “trong” bằng cách diễn đạt tự nhiên và đúng hướng hơn cho lời cầu xin được giúp đỡ đối với sự không tin. Cặp “Tôi tin”/“sự không tin của tôi” vẫn được giữ nguyên, không giải quyết nghịch lý thần học của nguyên văn. Đồng thời rút gọn phần dẫn truyện theo cách dùng tiếng Việt hiện đại.
  reviewer_model: gpt-5.6-terra
