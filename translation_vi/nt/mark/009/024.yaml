  text: ⸀εὐθὺς κράξας ὁ πατὴρ τοῦ ⸀παιδίου ἔλεγεν· ⸀Πιστεύω· βοήθει μου τῇ ἀπιστίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/024.yaml
  text: Immediately the father of the child cried out and said[a], “I believe[b]; help my unbelief!”
translation:
  language: vi
  text: 'Lập tức, cha đứa trẻ[a] kêu lên: “Tôi tin; xin giúp tôi vượt qua sự không tin của tôi[b]!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “cậu bé”. Từ Hy Lạp παιδίον có thể chỉ một đứa trẻ nói chung hoặc một bé trai, tùy ngữ cảnh.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “sự thiếu đức tin của tôi”. Từ Hy Lạp ἀπιστία có thể chỉ sự không tin hoặc tình trạng thiếu đức tin.
    reason: alternative_reading
lexical_decisions:
- source_word: εὐθύς
  choice: Ngay lập tức
  rationale: Diễn tả phản ứng tức thời của người cha và giữ nhịp khẩn trương đặc trưng của trình thuật.
- source_word: κράξας
  choice: kêu lên
  rationale: Truyền đạt tiếng nói lớn, đầy xúc động và khẩn thiết mà không cường điệu thành một tiếng hét.
- source_word: ὁ πατὴρ τοῦ παιδίου
  choice: cha của đứa trẻ
  rationale: Giữ rõ quan hệ sở hữu trong tiếng Hy Lạp; “đứa trẻ” không thu hẹp nghĩa của παιδίον quá mức, dù ngữ cảnh cho biết đây là một bé trai.
- source_word: ἔλεγεν
  choice: 'kêu lên:'
  rationale: Trong tiếng Việt, dấu hai chấm sau “kêu lên” giới thiệu lời nói trực tiếp một cách tự nhiên; không cần thêm “và nói”, vốn dễ nặng câu, nhưng nội dung của ἔλεγεν vẫn được thể hiện.
- source_word: Πιστεύω
  choice: Tôi tin
  rationale: Dịch trực tiếp động từ πιστεύω và duy trì mối liên hệ với chủ đề tin và không tin trong ngữ cảnh.
- source_word: βοήθει
  choice: xin giúp tôi
  rationale: Giữ lời cầu xin trực tiếp, khẩn thiết của mệnh lệnh hiện tại; thêm “xin” phù hợp với phép lịch sự tự nhiên trong tiếng Việt mà không làm yếu sức nặng của lời khẩn cầu.
- source_word: μου τῇ ἀπιστίᾳ
  choice: trong sự không tin của mình
  rationale: Cách diễn đạt này hiểu lời cầu xin là xin được trợ giúp ngay trong tình trạng không tin hoặc đức tin còn khiếm khuyết, tránh hàm ý phi lý rằng người cha xin Chúa hỗ trợ chính sự không tin, đồng thời vẫn giữ nguyên nghịch lý với “Tôi tin”.
theological_decisions:
- issue: Sự căng thẳng giữa Πιστεύω và ἀπιστίᾳ
  choice: 'Giữ nghịch lý: “Tôi tin; xin giúp tôi trong sự không tin của mình!”'
  alternative: “Tôi tin; xin giúp tôi vì tôi còn thiếu đức tin!”
  rationale: Lời người cha đồng thời bày tỏ đức tin thật và thừa nhận sự không tin vẫn còn. Bản dịch không giải quyết hoặc làm dịu sự căng thẳng thần học vốn có trong câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu nói trực tiếp giữ nhịp ngắn, dồn dập và nghịch lý cảm xúc của nguyên văn; không dùng thuật ngữ hệ phái hay cách diễn giải nhằm hóa giải sự căng thẳng giữa tin và không tin.
