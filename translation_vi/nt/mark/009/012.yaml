  text: ὁ δὲ ⸀ἔφη αὐτοῖς· Ἠλίας μὲν ἐλθὼν πρῶτον ⸀ἀποκαθιστάνει πάντα, καὶ πῶς γέγραπται ἐπὶ τὸν υἱὸν τοῦ ἀνθρώπου ἵνα πολλὰ πάθῃ καὶ ⸀ἐξουδενηθῇ;
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/012.yaml
  text: He said to them[a], “Elijah indeed, having come first, restores all things. And how is it written about the Son of Man that he should suffer many things and be treated with contempt?”
translation:
  language: vi
  text: 'Ngài nói với họ: “Ê-li quả thật đến trước và khôi phục mọi sự. Còn sao có lời chép về Con Người rằng Người phải chịu nhiều đau khổ và bị khinh rẻ[a]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “bị coi chẳng ra gì.” Động từ Hy Lạp hàm ý bị xem là không đáng kể hoặc không có giá trị.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφη αὐτοῖς
  choice: Ngài nói với họ
  rationale: Dùng động từ tường thuật tự nhiên trong tiếng Việt; “Ngài” giữ cách quy chiếu trang trọng đến Chúa Giê-su theo ngữ cảnh.
- source_word: Ἠλίας
  choice: Ê-li
  rationale: Dùng dạng tên riêng Kinh Thánh quen thuộc trong tiếng Việt.
- source_word: ἐλθὼν πρῶτον
  choice: đến trước
  rationale: Diễn đạt hành động đến trước gắn với động từ chính một cách tự nhiên, không thêm ý giải thích về thời điểm.
- source_word: ἀποκαθιστάνει πάντα
  choice: khôi phục mọi sự
  rationale: “Khôi phục” truyền đạt ý đưa trở lại tình trạng đúng đắn; “mọi sự” giữ phạm vi rộng của πάντα.
- source_word: πῶς γέγραπται ἐπὶ τὸν υἱὸν τοῦ ἀνθρώπου
  choice: sao có lời chép về Con Người
  rationale: “Có lời chép” là công thức dẫn Kinh Thánh tự nhiên; “về” thể hiện đối tượng mà lời chép đề cập, còn “Con Người” bảo toàn danh xưng quan trọng.
- source_word: ἵνα πολλὰ πάθῃ
  choice: rằng Người phải chịu nhiều đau khổ
  rationale: “Phải” diễn đạt điều lời Kinh Thánh xác định sẽ xảy ra; “nhiều đau khổ” chuyển tải tự nhiên ý nhiều sự chịu khổ.
- source_word: ἐξουδενηθῇ
  choice: bị khinh miệt
  rationale: Giữ thể bị động và ý bị xem thường, bị đối xử như kẻ không đáng kể.
theological_decisions:
- issue: Mối liên hệ giữa việc Ê-li khôi phục mọi sự và sự chịu khổ của Con Người
  choice: Giữ câu thứ hai dưới dạng câu hỏi tu từ, mở đầu bằng “Vậy sao…?”
  alternative: Diễn giải thành một lời giải thích giáo lý hoặc thêm từ ngữ làm rõ sự tương phản
  rationale: Nguyên văn đặt hai ý cạnh nhau bằng một câu hỏi và không tự giải quyết sự căng thẳng; bản dịch không nên hài hòa hóa điều đó.
- issue: Danh xưng υἱὸς τοῦ ἀνθρώπου
  choice: Con Người
  alternative: Đấng Mê-si hoặc Người Phàm
  rationale: Giữ nguyên danh xưng mang ý nghĩa thần học và liên văn bản, không thay bằng một cách giải nghĩa.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cấu trúc câu hỏi được giữ để bảo toàn sức căng của nguyên văn; thuật ngữ và danh xưng không được diễn giải theo riêng một truyền thống hệ phái.
