  to: 'Ngài nói với họ: “Loại này không thể ra được bằng bất cứ cách nào khác ngoài sự cầu nguyện.”[a]'
  rationale: 'Bản sửa duy trì đầy đủ ý nghĩa của bản Hy Lạp: loại này không thể ra bằng một phương tiện nào khác ngoài cầu nguyện. Việc dùng “ra được” giữ động từ ἐξελθεῖν mà không thêm chủ ngữ “tà linh” hoặc động từ bị động “bị đuổi”. Chú thích ghi nhận chính xác dị bản dài hơn, trong khi chính văn chỉ giữ “cầu nguyện” theo SBLGNT.'
  reviewer_model: gpt-5.6-terra
