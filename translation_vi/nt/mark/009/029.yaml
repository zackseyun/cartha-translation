  text: καὶ εἶπεν αὐτοῖς· Τοῦτο τὸ γένος ἐν οὐδενὶ δύναται ἐξελθεῖν εἰ μὴ ἐν ⸀προσευχῇ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/029.yaml
  text: And he said to them[a], “This kind cannot come out by anything except prayer.”
translation:
  language: vi
  text: 'Ngài nói với họ: “Loại này không thể ra được bằng bất cứ cách nào khác ngoài sự cầu nguyện.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Một số thủ bản muộn hơn chép thêm: “và kiêng ăn.”'
    reason: textual_variant
lexical_decisions:
- source_word: Τοῦτο τὸ γένος
  choice: Loại này
  rationale: γένος chỉ một loại hay hạng. Ngữ cảnh cho thấy đó là loại tà linh, nhưng tiếng Hy Lạp không lặp lại danh từ “thần linh”, nên “Loại này” giữ được cách nói súc tích và không thêm ý vào chính văn.
- source_word: ἐν οὐδενὶ
  choice: bằng bất cứ cách nào
  rationale: ἐν với οὐδενί diễn tả phương tiện trong cấu trúc phủ định. Cách dịch này tự nhiên trong tiếng Việt và nhấn mạnh rằng không một phương cách nào khác có hiệu lực.
- source_word: δύναται ἐξελθεῖν
  choice: không thể ra
  rationale: δύναται với động từ nguyên mẫu ἐξελθεῖν diễn tả sự bất khả. “Ra” phù hợp với ngữ cảnh tà linh rời khỏi người bị ám mà không cần thêm động từ “bị đuổi” vốn không có trực tiếp trong câu Hy Lạp.
- source_word: εἰ μὴ
  choice: ngoại trừ
  rationale: εἰ μὴ nêu ngoại lệ duy nhất sau mệnh đề phủ định. “Ngoại trừ” giữ rõ quan hệ logic này.
- source_word: ἐν προσευχῇ
  choice: cầu nguyện
  rationale: Cụm từ diễn tả phương tiện. Trong toàn câu, “ngoại trừ cầu nguyện” truyền đạt rằng chỉ sự cầu nguyện mới là phương cách hữu hiệu, đồng thời tránh danh từ hóa nặng nề.
theological_decisions:
- issue: Có đưa cụm “và kiêng ăn” vào chính văn hay không
  choice: Chỉ có “cầu nguyện” trong chính văn
  alternative: “cầu nguyện và kiêng ăn”
  rationale: Bản SBLGNT được cung cấp chỉ có προσευχῇ (“cầu nguyện”). Cách đọc dài hơn có thêm “và kiêng ăn” xuất hiện trong một số thủ bản muộn hơn; vì vậy không đưa vào chính văn nhưng ghi nhận ở chú thích để bảo tồn dị bản truyền thống.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” cho chủ thể là Đức Giê-su theo ngữ cảnh; giữ “Loại này” để không diễn giải quá mức thành “loại tà linh này”. Dấu chú thích [a] đặt ngay sau câu trích dẫn.
