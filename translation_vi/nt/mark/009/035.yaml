revisions:
- from: 'Ngồi xuống, Đức Giê-su gọi Nhóm Mười Hai đến và nói với họ: “Nếu ai muốn đứng đầu, người ấy phải đứng cuối mọi người và làm người phục vụ mọi người.”'
  to: 'Ngồi xuống, Đức Giê-su gọi Nhóm Mười Hai và nói với họ: “Nếu ai muốn đứng đầu, người ấy sẽ là người cuối cùng trong mọi người và là người phục vụ mọi người.”'
  rationale: Sửa tối thiểu để loại bỏ phần bổ sung không cần thiết (“đến”), bảo toàn giá trị tương lai của ἔσται (“sẽ là”), và làm rõ ἔσχατος là vị thế trong tương quan với mọi người chứ không phải chỉ vị trí đứng. Không cần chú thích vì không có biến thể văn bản hay thuật ngữ nào cần giải thích để hiểu câu.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T07:40:42Z'
review_pass:
  verdict: revise
  source_fidelity: Bản nháp truyền đạt đúng ý chính và giữ được phép đối “đứng đầu/đứng cuối” cùng sự lặp lại của πάντων (“mọi người”). Tuy nhiên, “gọi ... đến” thêm rõ nét chuyển động không được nói minh thị trong ἐφώνησεν, và “phải” diễn giải tương lai ἔσται thành mệnh lệnh bắt buộc mạnh hơn văn bản. Dịch bằng “sẽ là” bám sát hình thức và vẫn phù hợp ngữ cảnh nghịch lý của lời dạy.
  naturalness: Bản sửa dùng câu tiếng Việt hiện đại, rõ ràng. “Người cuối cùng trong mọi người” diễn đạt quan hệ “last of all” tự nhiên hơn “đứng cuối mọi người”, vốn có thể gợi vị trí không gian.
  terminology: “Đức Giê-su,” “Nhóm Mười Hai,” và “người phục vụ” phù hợp văn phong trang trọng vừa phải. “Người phục vụ” tránh áp đặt nghĩa chức vụ hội thánh cho διάκονος.
  issues:
  - severity: medium
    issue: “gọi Nhóm Mười Hai đến”
    rationale: ἐφώνησεν có nghĩa là gọi hoặc triệu tập; “đến” có thể được ngầm hiểu trong hành vi gọi nhưng không có từ tương ứng trong câu Hy Lạp. Bỏ “đến” giữ độ sát nguồn hơn mà câu vẫn tự nhiên.
  - severity: medium
    issue: “phải đứng cuối ... và làm...”
    rationale: ἔσται là thì tương lai (“will be”). Dù câu có hàm ý chuẩn mực, “phải” biến phát biểu tương lai của văn bản thành một mệnh lệnh rõ rệt hơn. “Sẽ là” bảo toàn sắc thái mà không loại bỏ hàm ý đạo đức của ngữ cảnh.
  - severity: low
    issue: “đứng cuối mọi người”
    rationale: ἔσχατος nói về vị thế “last,” không nhất thiết hành động đứng ở một vị trí. “Người cuối cùng trong mọi người” tránh cách hiểu không gian và phản ánh trực tiếp quan hệ với πάντων.
  revised_text: 'Ngồi xuống, Đức Giê-su gọi Nhóm Mười Hai và nói với họ: “Nếu ai muốn đứng đầu, người ấy sẽ là người cuối cùng trong mọi người và là người phục vụ mọi người.”'
