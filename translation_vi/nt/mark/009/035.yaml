  text: καὶ καθίσας ἐφώνησεν τοὺς δώδεκα καὶ λέγει αὐτοῖς· Εἴ τις θέλει πρῶτος εἶναι ἔσται πάντων ἔσχατος καὶ πάντων διάκονος.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/035.yaml
  text: And sitting down, he called the twelve and says to them, “If anyone wants to be first, he will be last of all and servant of all.”
translation:
  language: vi
  text: 'Ngồi xuống, Đức Giê-su gọi Nhóm Mười Hai và nói với họ: “Nếu ai muốn đứng đầu, người ấy sẽ là người cuối cùng trong mọi người và là người phục vụ mọi người.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθίσας
  choice: Ngồi xuống
  rationale: Giữ rõ hành động mở đầu của Đức Giê-su, tự nhiên trong tiếng Việt và phù hợp bối cảnh một thầy dạy ngồi xuống để chỉ dạy.
- source_word: ἐφώνησεν
  choice: gọi ... đến
  rationale: Diễn đạt ý gọi Nhóm Mười Hai lại gần, tự nhiên hơn chỉ dùng “gọi” trong tiếng Việt.
- source_word: λέγει
  choice: nói
  rationale: Hiện tại lịch sử Hy Lạp được chuyển sang dạng kể chuyện tự nhiên trong tiếng Việt; không làm thay đổi nội dung phát ngôn.
- source_word: πρῶτος
  choice: đứng đầu
  rationale: Thể hiện địa vị cao nhất trong quan hệ với người khác, phù hợp cuộc tranh luận về ai lớn hơn.
- source_word: ἔσχατος
  choice: đứng cuối
  rationale: Giữ sự đối xứng trực tiếp với “đứng đầu” và sắc thái đảo ngược địa vị.
- source_word: διάκονος
  choice: người phục vụ
  rationale: Ở đây từ này chỉ người phục vụ nói chung; tránh nhập nghĩa chức vụ giáo hội chuyên biệt như “chấp sự”.
theological_decisions:
- issue: Sắc thái của ἔσται trong lời tuyên bố về người muốn đứng đầu
  choice: phải đứng cuối ... và làm người phục vụ
  alternative: sẽ là người đứng cuối ... và người phục vụ
  rationale: 'Trong cấu trúc điều kiện mang tính châm ngôn, tương lai ἔσται có lực chuẩn mực: con đường để làm đầu trong cộng đồng môn đồ là tự đặt mình cuối cùng và phục vụ. Cách dịch “phải” truyền đạt lực này tự nhiên, nhưng không thêm một chức vụ hay hệ thống phẩm trật.'
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Đức Giê-su” theo lối gọi phổ biến trong tiếng Việt; “Nhóm Mười Hai” biểu thị nhóm môn đồ được xác định. Câu giữ phép đối “đứng đầu/đứng cuối” và lặp “mọi người” để bảo toàn nhấn mạnh πάντων ... πάντων.
