source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς εἶπεν· Μὴ κωλύετε αὐτόν, οὐδεὶς γάρ ἐστιν ὃς ποιήσει δύναμιν ἐπὶ τῷ ὀνόματί μου καὶ δυνήσεται ταχὺ κακολογῆσαί με·
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/039.yaml
  text: But Jesus said[a], “Do not stop him[b], for there is no one who will do a mighty work in my name and soon be able to speak evil of me.”
translation:
  language: vi
  text: 'Nhưng Đức Giê-su nói: “Đừng ngăn cản người ấy, vì không ai nhân danh tôi làm một việc quyền năng[a] mà sẽ sớm có thể nói xấu[b] tôi.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “một phép lạ” hoặc “một việc đầy quyền năng”; từ Hy Lạp δύναμις có nghĩa là “quyền năng” và cũng có thể chỉ một hành động biểu lộ quyền năng.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “lăng mạ” hoặc “phỉ báng”. Từ Hy Lạp có nghĩa đen là “nói điều xấu về”.
    reason: lexical_alternative
lexical_decisions:
- source_word: κωλύετε
  choice: ngăn cản
  rationale: Mệnh lệnh hiện tại đi với μή tạo thành lời cấm; “đừng ngăn cản” tự nhiên trong tiếng Việt và phù hợp với việc các môn đồ cố ngăn người ấy hành động.
- source_word: δύναμιν
  choice: một việc đầy quyền năng
  rationale: Danh từ δύναμις chỉ quyền năng và, trong văn cảnh các sách Phúc Âm, có thể chỉ một hành động phi thường biểu lộ quyền năng. Cách dịch này giữ được liên hệ với ý niệm “quyền năng” mà không thu hẹp nghĩa thành “phép lạ”.
- source_word: ἐπὶ τῷ ὀνόματί μου
  choice: nhân danh tôi
  rationale: Trong văn cảnh này, cụm từ diễn tả hành động dựa trên thẩm quyền hoặc sự kêu cầu danh của Đức Giê-su; “nhân danh tôi” là cách nói tự nhiên và chính xác trong tiếng Việt.
- source_word: ταχὺ
  choice: ngay sau đó
  rationale: Trạng từ diễn tả sự gần kề về thời gian; “ngay sau đó” làm rõ rằng người vừa làm việc quyền năng nhân danh Đức Giê-su khó có thể sớm quay sang nói xấu ngài.
- source_word: κακολογῆσαί
  choice: nói xấu
  rationale: Động từ có nghĩa là nói điều xấu về ai, lăng mạ hoặc phỉ báng. “Nói xấu” rõ ràng, tự nhiên và không thu hẹp nghĩa vào khái niệm pháp lý “vu khống”.
- source_word: οὐδεὶς γάρ ἐστιν ὃς
  choice: vì không ai
  rationale: Cách dịch gọn, tự nhiên, đồng thời giữ nguyên tính khái quát và quan hệ giải thích của câu Hy Lạp.
- source_word: δυνήσεται
  choice: có thể
  rationale: Diễn đạt khả năng được nêu bởi dạng tương lai của δύναμαι; ngữ cảnh và cụm “ngay sau đó” đã truyền đạt đầy đủ hướng thời gian trong tiếng Việt.
theological_decisions:
- issue: Bản chất của việc được thực hiện nhân danh Đức Giê-su
  choice: Dịch δύναμιν là “một việc đầy quyền năng”, không thu hẹp thành “phép lạ”.
  alternative: “một phép lạ” hoặc “một việc quyền năng”
  rationale: Cách dịch giữ phạm vi nghĩa của từ nguồn, cho thấy đây là một hành động biểu lộ quyền năng nhưng không áp đặt một định nghĩa hiện đại hẹp hơn về phép lạ.
- issue: Hàm ý về mối liên hệ của người ấy với Đức Giê-su
  choice: Diễn đạt lời nhận định giới hạn của Đức Giê-su mà không xác quyết thêm địa vị môn đồ hay mức độ chính thống của người ấy.
  alternative: Diễn giải mạnh hơn rằng người ấy là môn đồ thật, hoặc ngược lại chỉ là kẻ lợi dụng danh Đức Giê-su.
  rationale: Câu này chỉ nói rằng người làm một việc đầy quyền năng nhân danh Đức Giê-su sẽ không thể ngay sau đó nói xấu ngài; bản dịch không đưa vào những kết luận thần học rộng hơn điều văn bản nêu.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “Đức Giê-su” để gọi tên nhân vật một cách kính trọng mà không thêm tước hiệu không có trong nguyên văn; dùng “người ấy” thay cho đại từ có thể mang sắc thái coi thường. Các dấu chú thích được đặt ngay sau những từ ngữ mà chúng giải thích.
