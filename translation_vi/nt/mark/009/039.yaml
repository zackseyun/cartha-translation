    issue: “ngay sau đó” dịch ταχὺ quá mạnh.
    rationale: ταχὺ có nghĩa là “sớm, chẳng bao lâu” và không buộc phải hiểu là “ngay sau đó.” Bản dịch nên giữ mức độ không xác định tương đối của trạng từ Hy Lạp.
  - severity: low
    issue: Dạng tương lai của δυνήσεται chưa được biểu hiện minh thị.
    rationale: “có thể” trong câu hiện tại có thể hiểu được theo ngữ cảnh, nhưng “sẽ sớm có thể” phản ánh rõ hơn dạng tương lai mà vẫn tự nhiên trong tiếng Việt.
