id: MRK.9.13
reference: Mark 9:13
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀλλὰ λέγω ὑμῖν ὅτι καὶ Ἠλίας ἐλήλυθεν, καὶ ἐποίησαν αὐτῷ ὅσα ⸀ἤθελον, καθὼς γέγραπται ἐπ’ αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/013.yaml
  text: But I tell you that Elijah also has come[a], and they did to him whatever they wanted, just as it is written about him.
translation:
  language: vi
  text: Nhưng tôi nói với các ông rằng Ê-li cũng đã đến[a], và họ đã đối xử với ông theo ý họ, đúng như lời đã chép về ông.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Trong văn mạch này, Ê-li được hiểu là đã đến trong con người và chức vụ của Giăng Báp-tít; xem Mác 9:11–12 và đối chiếu Ma-thi-ơ 11:14; 17:12–13.
    reason: cross_reference
lexical_decisions:
- source_word: ἀλλὰ
  choice: Nhưng
  rationale: Diễn tả sự tương phản trực tiếp với điều các môn đồ đang mong đợi về Ê-li, đồng thời tự nhiên trong tiếng Việt.
- source_word: λέγω ὑμῖν
  choice: tôi nói với các ông
  rationale: Giữ công thức phát ngôn trực tiếp và đại từ số nhiều; “các ông” phù hợp với lời Đức Giê-su nói cùng nhóm môn đồ trong văn phong trang trọng, hiện đại.
- source_word: ὅτι καὶ Ἠλίας ἐλήλυθεν
  choice: rằng Ê-li cũng đã đến
  rationale: “Cũng” phản ánh καὶ; “đã đến” chuyển tải thể hoàn thành ἐλήλυθεν, chỉ một sự đến đã xảy ra và vẫn có ý nghĩa đối với cuộc trao đổi hiện tại.
- source_word: ἐποίησαν αὐτῷ
  choice: người ta đã đối xử với ông
  rationale: Cách nói tự nhiên trong tiếng Việt, giữ chủ thể không xác định của động từ số nhiều và chuẩn bị cho mệnh đề “tùy ý họ” mà không bổ sung cụ thể điều họ đã làm.
- source_word: ὅσα ἤθελον
  choice: tùy ý họ
  rationale: 'Diễn đạt tự nhiên ý nghĩa không hạn định: họ làm với ông bất cứ điều gì họ muốn.'
- source_word: καθὼς γέγραπται
  choice: đúng như lời đã chép
  rationale: Giữ công thức viện dẫn Kinh Thánh, đồng thời dùng lối diễn đạt tiếng Việt trang trọng và quen thuộc.
- source_word: ἐπ’ αὐτόν
  choice: về ông
  rationale: Trong công thức nói về điều được chép, ἐπί với đối cách hợp lý nhất là “về/liên quan đến”; không chọn nghĩa ít khả dĩ hơn là “chống lại ông”.
theological_decisions:
- issue: Danh tính của Ê-li trong lời này
  choice: Giữ nguyên “Ê-li” trong chính văn, không thêm lời đồng nhất hóa.
  alternative: Diễn giải trực tiếp Ê-li là Giăng Báp-tít.
  rationale: Bản Hy Lạp nêu đích danh Ê-li. Văn mạch dẫn người đọc đến mối liên hệ với Giăng Báp-tít, nhưng việc đưa tên Giăng vào chính văn sẽ giải quyết điều bản văn để ở cấp độ ám chỉ; vì vậy mối liên hệ này được trình bày trong chú thích.
- issue: Ý nghĩa của ἐπ’ αὐτόν
  choice: “về ông”
  alternative: “chống lại ông”
  rationale: Cấu trúc với γέγραπται tự nhiên nhất mang nghĩa điều đã được chép liên quan đến ông. Tuy có khả năng từ vựng “chống lại”, ngữ cảnh không đủ mạnh để ưu tiên nghĩa ấy.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “tôi” và “các ông” để lời thoại tự nhiên mà vẫn có phẩm cách; giữ tên phiên âm quen thuộc “Ê-li”. Chú thích giải thích mối liên hệ theo văn mạch mà không đưa cách giải nghĩa vào chính văn.
