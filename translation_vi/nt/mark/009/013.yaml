    rationale: Cụm «Tức là» biến một liên hệ diễn giải theo văn mạch thành lời giải nghĩa dứt khoát. Cần giữ chính văn không diễn giải và dùng cách diễn đạt thận trọng trong chú thích.
  - severity: low
