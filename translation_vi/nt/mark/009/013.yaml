  source_fidelity: Chính văn chuyển tải chính xác tương phản của ἀλλά, lời nói trực tiếp, sự kiện Ê-li «đã đến», hành động tùy ý đối với ông, và công thức «đã chép về ông». Tuy nhiên, chú thích mở đầu bằng «Tức là» khẳng định cách đồng nhất hóa Ê-li với Giăng Báp-tít như một diễn giải trực tiếp, trong khi chính văn chỉ nêu Ê-li và mối liên hệ này nên được trình bày như cách hiểu theo văn mạch.
  naturalness: Câu văn hiện đại, rõ ràng và có sắc thái trang trọng phù hợp. «Người ta» làm mờ chủ thể số nhiều của bản Hy Lạp hơn cần thiết; «họ» vừa tự nhiên vừa giữ được chủ thể không xác định cụ thể trong ngữ cảnh.
  terminology: «Ê-li», «Giăng Báp-tít», và các tên sách được dùng nhất quán theo lối phiên âm quen thuộc. «Đúng như lời đã chép về ông» là cách dịch tự nhiên của καθὼς γέγραπται ἐπ’ αὐτόν.
  issues:
