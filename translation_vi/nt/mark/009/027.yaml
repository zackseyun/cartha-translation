  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς κρατήσας ⸂τῆς χειρὸς αὐτοῦ⸃ ἤγειρεν αὐτόν, καὶ ἀνέστη.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/027.yaml
  text: But Jesus[a], taking hold of his hand, raised him up[b], and he stood up.
translation:
  language: vi
  text: Nhưng Đức Giê-su nắm lấy tay cậu, nâng cậu dậy[a], và cậu đứng lên[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “đỡ cậu dậy” hoặc “làm cậu trỗi dậy”; động từ Hy Lạp này cũng được dùng trong những ngữ cảnh nói đến việc đánh thức hoặc làm cho sống lại.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “cậu đứng dậy” hoặc “cậu trỗi dậy.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Nhưng
  rationale: Diễn tả sự tương phản nhẹ giữa việc mọi người tưởng cậu bé đã chết ở câu trước và hành động tiếp theo của Đức Giê-su.
- source_word: κρατήσας
  choice: nắm lấy
  rationale: Giữ được hành động tiếp xúc cụ thể và sắc thái nắm chắc của động từ, đồng thời tự nhiên trong tiếng Việt.
- source_word: τῆς χειρὸς αὐτοῦ
  choice: tay cậu
  rationale: Dịch đúng bộ phận cơ thể χείρ và dùng đại từ phù hợp với cậu bé trong ngữ cảnh.
- source_word: ἤγειρεν
  choice: nâng cậu dậy
  rationale: Diễn tả Đức Giê-su khiến cậu bé từ tư thế nằm chuyển sang dậy; cách dịch này tự nhiên mà vẫn phần nào giữ được âm hưởng của động từ có thể dùng cho việc thức dậy hoặc sống lại.
- source_word: ἀνέστη
  choice: cậu đứng lên
  rationale: 'Diễn tả kết quả trực tiếp: cậu bé đứng dậy. Cách nói hiện đại, rõ nghĩa và tránh sắc thái cổ của những từ như “trỗi dậy” trong câu chính.'
theological_decisions:
- issue: Âm hưởng phục sinh có thể có trong cặp động từ ἤγειρεν / ἀνέστη
  choice: Dùng ngôn ngữ chỉ hành động đứng dậy thông thường trong câu chính, đồng thời ghi nhận trường nghĩa rộng hơn trong chú thích.
  alternative: Dịch trang trọng hơn là “làm cậu trỗi dậy, và cậu trỗi dậy” để làm nổi bật âm hưởng phục sinh.
  rationale: Ngữ cảnh trực tiếp nói đến việc cậu bé đứng dậy sau khi được giải thoát, không khẳng định cậu đã chết và sống lại. Tuy vậy, hai động từ Hy Lạp cũng xuất hiện trong các ngữ cảnh thức dậy hoặc sống lại, nên không nên xóa hẳn âm hưởng ấy.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. “Đức Giê-su” là cách gọi tôn kính phổ thông; “cậu” làm rõ đại từ chỉ cậu bé mà không lặp danh từ. Cấu trúc hai vế giữ riêng hành động của Đức Giê-su và phản ứng của cậu bé.
