    rationale: Cấu trúc Hy Lạp καλόν ἐστιν ἡμᾶς ὧδε εἶναι có nghĩa “thật tốt khi/chúng ta ở đây thì tốt”; chỉnh lại giúp tiếng Việt tự nhiên hơn mà không thêm ý nghĩa.
  - severity: low
    issue: Câu chú thích nói “có thể gợi đến lều hoặc chòi” chưa rõ chức năng của các từ thay thế và lặp lại khái niệm chính văn.
    rationale: Chú thích nên trước hết ghi rõ các cách dịch khác của σκηνάς, rồi dè dặt nói rằng câu này không xác định các liên hệ biểu tượng hoặc lễ hội.
