revisions:
- from: 'Phê-rô đáp lời Đức Giê-su: “Ra-bi, chúng ta ở đây thật tốt. Chúng ta hãy dựng ba cái lều[a]: một cho thầy, một cho Môi-se và một cho Ê-li.”'
  to: 'Phê-rô đáp lời Đức Giê-su: “Thưa Ra-bi, thật tốt khi chúng ta ở đây. Chúng ta hãy dựng ba lều[a]: một cho thầy, một cho Môi-se và một cho Ê-li.”'
  rationale: Chỉnh câu đánh giá của Phê-rô sang một cấu trúc tiếng Việt tự nhiên hơn, thêm hô ngữ lịch sự cho lời nói trực tiếp, và làm rõ chú thích từ vựng. Không thay đổi ý nghĩa, cấu trúc phân phối “một... một... một”, hoặc tính không xác định của σκηνάς.
