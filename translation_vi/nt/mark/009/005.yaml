source:
  edition: SBLGNT
  text: καὶ ἀποκριθεὶς ὁ Πέτρος λέγει τῷ Ἰησοῦ· Ῥαββί, καλόν ἐστιν ἡμᾶς ὧδε εἶναι, καὶ ποιήσωμεν ⸂τρεῖς σκηνάς⸃, σοὶ μίαν καὶ Μωϋσεῖ μίαν καὶ Ἠλίᾳ μίαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/005.yaml
  text: 'And Peter answered and said to Jesus[a], “Rabbi, it is good for us to be here, and let us make three shelters: one for you, one for Moses, and one for Elijah.”'
translation:
  language: vi
  text: 'Phê-rô đáp lời Đức Giê-su: “Thưa Ra-bi, thật tốt khi chúng ta ở đây. Chúng ta hãy dựng ba lều[a]: một cho thầy, một cho Môi-se và một cho Ê-li.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “chòi” hoặc “lều tạm”. Từ Hy Lạp σκηνάς chỉ chỗ trú tạm thời; các cách dịch này có thể gợi những liên tưởng khác nhau về lều hoặc chòi, nhưng câu này không nói rõ các liên hệ ấy.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς
  choice: đáp lời
  rationale: Giữ thành ngữ phân từ tường thuật của tiếng Hy Lạp, dù trước đó không có câu hỏi trực tiếp; cách nói này vẫn tự nhiên và trang trọng trong tiếng Việt.
- source_word: λέγει
  choice: nói (được thể hiện trong kết cấu “đáp lời”)
  rationale: Hiện tại lịch sử của tiếng Hy Lạp được chuyển sang lối kể tiếng Việt tự nhiên; không cần lặp thêm động từ “nói” sau “đáp lời”.
- source_word: Ῥαββί
  choice: Ra-bi
  rationale: Phiên âm danh xưng Semit thay vì diễn giải thành “Thầy”, qua đó giữ bối cảnh và sắc thái xưng hô kính trọng của nguyên văn.
- source_word: καλόν ἐστιν ἡμᾶς ὧδε εἶναι
  choice: chúng ta ở đây thật tốt
  rationale: Diễn đạt tự nhiên lời đánh giá của Phê-rô, giữ nghĩa cơ bản của καλόν mà không cường điệu thành “tuyệt vời” hay giải thích thành “đúng đắn”.
- source_word: ποιήσωμεν
  choice: chúng ta hãy dựng
  rationale: “Hãy” thể hiện thể giả định ngôi thứ nhất số nhiều mang ý khích lệ/đề nghị; “dựng” phù hợp tự nhiên với lều, dù cụ thể hơn nghĩa cơ bản “làm” đôi chút.
- source_word: σκηνάς
  choice: lều
  rationale: “Lều” là từ hiện đại, dễ hiểu, chỉ chỗ trú tạm và không tự động áp đặt ý nghĩa đền thờ; các khả năng “chòi” và “lều tạm” được giữ trong chú thích.
- source_word: σοὶ μίαν καὶ Μωϋσεῖ μίαν καὶ Ἠλίᾳ μίαν
  choice: một cho thầy, một cho Môi-se và một cho Ê-li
  rationale: Giữ sự lặp lại phân phối của μίαν cùng cấu trúc song song. “Thầy” là đại từ xưng hô tự nhiên, kính trọng trong tiếng Việt khi Phê-rô nói trực tiếp với Đức Giê-su.
theological_decisions:
- issue: Hàm ý lễ hội hoặc thờ phượng của σκηνάς
  choice: Dùng từ trung tính “lều” trong chính văn
  alternative: “chòi”, “lều tạm”, hoặc cách dịch mang tính chuyên biệt như “nhà tạm”
  rationale: Câu này không nói rõ các công trình ấy liên hệ với Lễ Lều Tạm hay thần học về Đền Tạm. “Lều” truyền đạt nghĩa trực tiếp mà không quyết định hàm ý thần học; các cách hiểu gần nghĩa được nêu trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Các tên riêng được phiên âm theo lối quen dùng trong Kinh Thánh tiếng Việt. Danh xưng “Ra-bi” giữ màu sắc lịch sử Semit; “thầy” trong phần phân phối là đại từ xưng hô tự nhiên, không thay thế danh xưng ở đầu lời nói.
