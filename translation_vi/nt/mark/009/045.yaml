    issue: «sa ngã» thu hẹp phần nào hình ảnh của σκανδαλίζῃ.
    rationale: σκανδαλίζῃ mang hình ảnh làm vấp/ngã và trong ngữ cảnh có thể bao hàm việc dẫn đến tội. «Sa ngã» là cách hiểu hợp ngữ cảnh nhưng thiên về nghĩa luân lý; «làm con vấp ngã» giữ ẩn dụ của nguồn rõ hơn.
