id: MRK.9.45
reference: Mark 9:45
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἐὰν ὁ πούς σου σκανδαλίζῃ σε, ἀπόκοψον αὐτόν· καλόν ἐστίν ⸀σε εἰσελθεῖν εἰς τὴν ζωὴν χωλὸν ἢ τοὺς δύο πόδας ἔχοντα βληθῆναι εἰς τὴν ⸀γέενναν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/045.yaml
  text: And if your foot causes you to stumble[a], cut it off. It is better for you to enter into life lame than, having both feet, to be thrown into Gehenna.
translation:
  language: vi
  text: Nếu chân con làm con vấp ngã, hãy chặt nó đi. Thà con què mà bước vào sự sống còn hơn có đủ hai chân mà bị ném vào Ghê-hen-na.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “địa ngục.” Từ Hy Lạp là Ghê-hen-na, gợi đến thung lũng Hin-nôm và những liên hệ của nơi ấy với sự phán xét của Đức Chúa Trời.
    reason: alternative_reading
lexical_decisions:
- source_word: σκανδαλίζῃ
  choice: khiến con sa ngã
  rationale: Giữ hình ảnh vấp ngã của động từ Hy Lạp, đồng thời trong ngữ cảnh vẫn gợi ý việc bị dẫn vào tội lỗi mà không thu hẹp nghĩa thành riêng «phạm tội».
- source_word: ἀπόκοψον
  choice: hãy chặt nó đi
  rationale: Truyền đạt mệnh lệnh mạnh, cụ thể và hình ảnh cường điệu rõ nét của nguyên văn, không làm nhẹ thành «loại bỏ».
- source_word: καλόν ἐστίν ... ἢ
  choice: thà ... còn hơn
  rationale: Trong cấu trúc so sánh này, cách diễn đạt «thà ... còn hơn» tự nhiên trong tiếng Việt và thể hiện đúng ý «tốt hơn».
- source_word: εἰσελθεῖν εἰς τὴν ζωὴν
  choice: bước vào sự sống
  rationale: Giữ hình ảnh đi vào sự sống và không tự ý mở rộng ζωή thành «sự sống đời đời».
- source_word: χωλὸν
  choice: què
  rationale: Diễn đạt chính xác tình trạng đi lại bị khập khiễng do mất hoặc tổn thương chân; tự nhiên hơn «tàn tật» trong ngữ cảnh này.
- source_word: τοὺς δύο πόδας ἔχοντα
  choice: có đủ hai chân
  rationale: Thể hiện tự nhiên sự tương phản với tình trạng què, đồng thời giữ đầy đủ ý của cụm phân từ Hy Lạp.
- source_word: βληθῆναι
  choice: bị ném
  rationale: Phản ánh trực tiếp thể bị động và sức mạnh của động từ βάλλω.
- source_word: γέενναν
  choice: Ghê-hen-na
  rationale: Phiên âm danh từ riêng Hy Lạp để giữ tính đặc thù lịch sử và hình ảnh phán xét gắn với địa danh, thay vì trực tiếp đồng nhất với thuật ngữ khái quát «địa ngục».
theological_decisions:
- issue: Cách dịch γέεννα trong ngữ cảnh phán xét
  choice: Ghê-hen-na
  alternative: địa ngục
  rationale: Nguyên văn dùng danh từ cụ thể γέεννα, gợi thung lũng Hin-nôm và những liên hệ của nơi ấy với sự phán xét của Đức Chúa Trời. Giữ tên gọi trong chính văn bảo toàn tính đặc thù; cách hiểu quen thuộc «địa ngục» được nêu ở chú thích.
- issue: Ý nghĩa của «sự sống»
  choice: sự sống
  alternative: sự sống đời đời
  rationale: ζωή trong câu không có tính từ «đời đời». Bản dịch giữ cách nói ngắn gọn của nguyên văn, không giải thích thêm dù ngữ cảnh có sắc thái cánh chung.
translation_notes:
  register: Văn phong hiện đại, trang trọng và trực tiếp. Đại từ số ít «con» phản ánh cách Đức Chúa Jêsus trực tiếp dạy môn đồ và tránh lối xưng hô «ngươi» đã cổ; các mệnh lệnh và hình ảnh mạnh của nguyên văn được giữ nguyên. Dấu chú thích được đặt ngay sau «Ghê-hen-na», là từ mà chú thích giải thích.
