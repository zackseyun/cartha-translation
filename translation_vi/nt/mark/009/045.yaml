  verdict: revise
  source_fidelity: Bản dịch giữ đúng cấu trúc điều kiện, mệnh lệnh mạnh «hãy chặt nó đi», phép so sánh «thà ... còn hơn», thể bị động «bị ném», và giữ γέεννα là «Ghê-hen-na». Tuy nhiên, «sa ngã» diễn giải hình ảnh σκανδαλίζῃ theo hướng luân lý rõ hơn; «vấp ngã» bảo toàn hình ảnh của nguyên văn tốt hơn mà vẫn tự nhiên.
  naturalness: Văn phong nhìn chung hiện đại, rõ ràng và trang trọng. Đổi «khiến con sa ngã» thành «làm con vấp ngã» giúp câu tự nhiên hơn trong tiếng Việt và tránh lặp cấu trúc gây nặng câu.
  terminology: «Sự sống», «què», «bị ném», và «Ghê-hen-na» đều phù hợp với nguyên văn. Chú thích về «địa ngục» nêu đây là một cách dịch khả dĩ, đồng thời giải thích nền tảng địa danh và phán xét mà không đồng nhất hóa quá mức thuật ngữ Hy Lạp.
  issues:
