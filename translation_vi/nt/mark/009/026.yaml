  terminology: “Thét lên,” “làm cậu bé co giật dữ dội,” “nó ra khỏi cậu,” và “Cậu ấy chết rồi” đều phù hợp. Đại từ “nó” cho tà linh và “cậu/cậu bé” cho đứa trẻ được dùng nhất quán.
