source:
  edition: SBLGNT
  text: καὶ ⸂κράξας καὶ πολλὰ σπαράξας⸃ ἐξῆλθεν· καὶ ἐγένετο ὡσεὶ νεκρὸς ὥστε ⸀τοὺς πολλοὺς λέγειν ὅτι ἀπέθανεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/026.yaml
  text: And after crying out and convulsing him greatly[a], it came out; and he became like a dead man, so that many were saying[b], “He is dead.”
translation:
  language: vi
  text: 'Sau khi thét lên và làm cậu bé co giật dữ dội[a], nó ra khỏi cậu; cậu trở nên như người chết, đến nỗi nhiều người nói[b]: “Cậu ấy chết rồi.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “sau khi khiến cậu lên cơn co giật dữ dội.”'
    reason: lexical_alternative
  - marker: b
    text: Tiếng Hy Lạp nói cậu “trở nên như người chết”; lời kể mô tả tình trạng của cậu, còn lời “Cậu ấy chết rồi” là kết luận của nhiều người chứng kiến.
    reason: lexical_alternative
lexical_decisions:
- source_word: κράξας
  choice: sau khi thét lên
  rationale: Phân từ bất định diễn tả hành động xảy ra trước ἐξῆλθεν. “Thét lên” giữ nghĩa phát tiếng lớn mà không thêm sắc thái quá cụ thể như “rít lên”.
- source_word: πολλὰ σπαράξας
  choice: làm cậu bé co giật dữ dội
  rationale: Trong bối cảnh trừ quỷ, σπαράσσω chỉ việc gây co giật, không phải xé rách theo nghĩa đen; πολλὰ mang chức năng tăng cường. Tân ngữ “cậu bé” được bổ sung rõ từ ngữ cảnh.
- source_word: ἐξῆλθεν
  choice: nó ra khỏi cậu
  rationale: Chủ ngữ hàm ẩn là tà linh trong văn cảnh. “Ra khỏi cậu” là cách nói tự nhiên và làm rõ quan hệ mà tiếng Hy Lạp để hàm ẩn.
- source_word: ἐγένετο ὡσεὶ νεκρός
  choice: cậu nằm bất động như người chết
  rationale: ὡσεὶ giữ tính so sánh về trạng thái hoặc vẻ bề ngoài, không khẳng định cậu thật sự đã chết. “Nằm bất động” diễn đạt tự nhiên kết quả trong ngữ cảnh nhưng không biến lời kể thành xác nhận cái chết.
- source_word: ὥστε τοὺς πολλοὺς λέγειν
  choice: đến nỗi nhiều người nói
  rationale: τοὺς πολλούς được hiểu là “nhiều người”, không nhất thiết là đa số; cấu trúc ὥστε với động từ nguyên mẫu nêu kết quả là phản ứng của đám đông.
- source_word: ὅτι ἀπέθανεν
  choice: “Cậu ấy chết rồi.”
  rationale: Chuyển thành lời nói trực tiếp tự nhiên trong tiếng Việt. “Chết rồi” diễn đạt kết luận tức thời của những người chứng kiến mà không biến nó thành lời xác nhận của người kể.
theological_decisions:
- issue: Cậu bé thật sự chết hay chỉ có vẻ như đã chết
  choice: Bản văn kể rằng cậu giống người chết và ghi lại kết luận của nhiều người, chứ không xác nhận cậu đã thật sự chết.
  alternative: Cậu bé đã chết trong chốc lát, hoặc câu văn hoàn toàn bỏ ngỏ việc cậu có thật sự chết hay không.
  rationale: Từ so sánh ὡσεὶ (“như, tựa như”) cùng lời nhận xét được quy cho đám đông phân biệt vẻ bề ngoài với lời xác nhận của người kể. Bản dịch giữ sự căng thẳng ấy và không đưa ý phục sinh vào câu này.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “cậu bé/cậu” theo văn cảnh, “nó” cho tà linh; tránh thuật ngữ giáo phái và giữ phân biệt giữa lời kể với nhận định của đám đông.
