source:
  edition: SBLGNT
  text: καὶ ἐξάπινα περιβλεψάμενοι οὐκέτι οὐδένα εἶδον ⸂ἀλλὰ τὸν Ἰησοῦν μόνον μεθ’ ἑαυτῶν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/008.yaml
  text: And suddenly, looking around, they no longer saw anyone except Jesus alone with them.
translation:
  language: vi
  text: Bỗng chốc, nhìn quanh, họ không còn thấy ai nữa, chỉ thấy một mình Giê-su ở với họ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξάπινα
  choice: Bỗng nhiên
  rationale: Diễn đạt trực tiếp tính bất ngờ của trạng từ Hy Lạp bằng cách nói tự nhiên trong tiếng Việt hiện đại.
- source_word: περιβλεψάμενοι
  choice: khi nhìn quanh
  rationale: Phân từ aorist chỉ hành động nhìn khắp xung quanh, gắn với chủ thể số nhiều là các môn đồ.
- source_word: οὐκέτι οὐδένα εἶδον
  choice: họ không còn thấy ai nữa
  rationale: 'Giữ lực kết hợp của οὐκέτι và οὐδένα: từ lúc ấy họ không thấy bất kỳ người nào khác.'
- source_word: ἀλλὰ τὸν Ἰησοῦν μόνον
  choice: ngoại trừ một mình Đức Chúa Giê-su
  rationale: Giữ cả ý ngoại lệ của ἀλλά trong cấu trúc phủ định và sự nhấn mạnh của μόνον.
- source_word: μεθ’ ἑαυτῶν
  choice: đang ở với họ
  rationale: Diễn đạt quan hệ hiện diện cùng các môn đồ; thêm “đang ở” để câu tiếng Việt tự nhiên mà không bổ sung nội dung thần học.
theological_decisions:
- issue: Ý nghĩa việc chỉ còn thấy Đức Chúa Giê-su
  choice: Dịch sát lời kể, không giải thích ý nghĩa thần học của cảnh tượng.
  alternative: Diễn giải rằng Đức Chúa Giê-su thay thế hoặc vượt trên Môi-se và Ê-li.
  rationale: Câu Hy Lạp chỉ thuật lại điều các môn đồ thấy; mọi kết luận thần học rộng hơn phải đến từ văn mạch, không nên được đưa ngầm vào bản dịch.
translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng dễ hiểu. Dùng “Đức Chúa Giê-su” theo lối gọi tôn kính; cấu trúc câu giữ nhịp bất ngờ và điểm nhấn rằng chỉ còn một mình Ngài ở với các môn đồ.
