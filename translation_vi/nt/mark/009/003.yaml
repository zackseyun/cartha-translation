  text: καὶ τὰ ἱμάτια αὐτοῦ ⸀ἐγένετο στίλβοντα λευκὰ ⸀λίαν οἷα γναφεὺς ἐπὶ τῆς γῆς οὐ δύναται ⸀οὕτως λευκᾶναι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/003.yaml
  text: And his clothes became gleaming[a], very white, such as no launderer on earth is able to whiten.
translation:
  language: vi
  text: Y phục của Ngài trở nên sáng chói, trắng vô cùng, đến nỗi không một người giặt tẩy vải[a] nào trên đất có thể làm trắng y phục đến như vậy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hoặc “thợ xử lý vải”; từ này chỉ người làm nghề làm sạch, xử lý và thường làm trắng vải.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἱμάτια
  choice: y phục
  rationale: Danh từ chỉ quần áo nói chung; “y phục” tự nhiên, trang trọng vừa phải và không thu hẹp nghĩa thành một kiểu áo cụ thể.
- source_word: ἐγένετο
  choice: trở nên
  rationale: Diễn tả rõ sự thay đổi trạng thái trong cảnh biến hình.
- source_word: στίλβοντα
  choice: sáng chói
  rationale: Truyền đạt vẻ sáng rực, lấp lánh của từ Hy Lạp mà không thêm cách giải thích thần học như “rạng ngời vinh quang”.
- source_word: λευκὰ λίαν
  choice: trắng đến lạ thường
  rationale: Diễn đạt tự nhiên sức nhấn mạnh mạnh của λίαν đối với sắc trắng, hơn là cách nói cứng “rất trắng”.
- source_word: γναφεύς
  choice: người giặt tẩy vải
  rationale: Chỉ người chuyên làm sạch và làm trắng vải; cách diễn đạt này dễ hiểu trong tiếng Việt hiện đại và tránh từ nghề nghiệp cổ, khó hiểu.
- source_word: ἐπὶ τῆς γῆς
  choice: trên đất
  rationale: Giữ hình ảnh và phạm vi so sánh của nguyên văn, tức khả năng của con người nơi trần thế.
- source_word: οὐ δύναται οὕτως λευκᾶναι
  choice: không thể làm trắng được như vậy
  rationale: Diễn đạt đầy đủ khả năng bị phủ định và mức độ so sánh; đối tượng là y phục đã rõ trong văn cảnh nên không cần lặp đại từ.
theological_decisions:
- issue: Hiệu ứng hữu hình của sự biến hình
  choice: Mô tả y phục trở nên sáng chói và trắng phi thường
  alternative: “rạng ngời vinh quang” hoặc cách diễn đạt giải thích nguồn gốc thần học của ánh sáng
  rationale: Câu này mô tả hiện tượng thị giác nhưng không trực tiếp gọi đó là “vinh quang”; bản dịch không thêm kết luận thần học ngoài lời văn.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang nghiêm nhưng dễ hiểu. Cấu trúc “đến mức... như vậy” tái hiện phép so sánh về mức độ trong nguyên văn mà vẫn tự nhiên trong tiếng Việt.
