  text: Καὶ ⸀ἦλθον εἰς Καφαρναούμ. καὶ ἐν τῇ οἰκίᾳ γενόμενος ἐπηρώτα αὐτούς· Τί ἐν τῇ ⸀ὁδῷ διελογίζεσθε;
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/033.yaml
  text: And they came to Capernaum. And when he was in the house, he was asking them, “What were you discussing on the way?”
translation:
  language: vi
  text: 'Rồi họ đến Ca-phác-na-um. Khi ở trong nhà, Đức Giê-su hỏi họ: “Dọc đường, anh em đã bàn luận điều gì vậy?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Dọc đường, anh em đã tranh luận điều gì vậy?” hoặc “Dọc đường, anh em đã tranh cãi điều gì vậy?” Động từ Hy Lạp có thể chỉ sự bàn luận, tranh luận hoặc tranh cãi; câu tiếp theo cho biết họ nói về việc ai là người lớn nhất.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθον
  choice: họ đến
  rationale: Động từ aorist số nhiều kể việc cả nhóm đến Ca-phác-na-um; “đến” tự nhiên và sát nghĩa trong tiếng Việt.
- source_word: Καφαρναούμ
  choice: Ca-phác-na-um
  rationale: Dùng dạng phiên âm quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
- source_word: ἐν τῇ οἰκίᾳ γενόμενος
  choice: khi đã vào trong nhà
  rationale: Phân từ mang chức năng thời gian. Cách dịch này giữ bối cảnh cụ thể “trong nhà” và diễn đạt tự nhiên việc Đức Giê-su ở đó sau khi vào.
- source_word: ἐπηρώτα αὐτούς
  choice: Đức Giê-su hỏi các môn đồ
  rationale: Thì chưa hoàn thành có thể gợi hành động đang diễn ra, nhưng trong lời kể tiếng Việt, “hỏi” tự nhiên hơn mà không phủ nhận sắc thái ấy. Nêu rõ Đức Giê-su và các môn đồ để giải quyết sự chuyển từ chủ ngữ số nhiều sang số ít theo văn cảnh.
- source_word: ἐν τῇ ὁδῷ
  choice: dọc đường
  rationale: Thành ngữ tiếng Việt tự nhiên cho bối cảnh đang đi đường.
- source_word: διελογίζεσθε
  choice: đã bàn luận
  rationale: διαλογίζομαι có thể chỉ bàn bạc, tranh luận hoặc tranh cãi. “Bàn luận” giữ độ rộng nghĩa, không áp đặt trước sắc thái gay gắt mà câu sau mới làm rõ.
theological_decisions:
- issue: Chủ ngữ của động từ số nhiều ἦλθον và của phân từ, động từ số ít tiếp theo
  choice: Dịch việc đến nơi với chủ ngữ “họ”, rồi xác định Đức Giê-su là chủ ngữ hỏi các môn đồ.
  alternative: 'Giữ đại từ: “họ đến… khi Người ở trong nhà, Người hỏi họ.”'
  rationale: Văn cảnh xác định chủ ngữ số ít là Đức Giê-su; gọi rõ các nhân vật giúp tiếng Việt sáng nghĩa mà không thêm một lập trường thần học.
- issue: Sắc thái của διελογίζεσθε
  choice: “bàn luận”, kèm chú thích về khả năng “tranh luận/tranh cãi”.
  alternative: Dịch ngay là “tranh cãi”.
  rationale: Giữ sự mơ hồ từ vựng chân thực của câu này, đồng thời ghi nhận rằng câu kế tiếp cho thấy cuộc trao đổi có tính ganh đua về địa vị.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “anh em” trong lời Đức Giê-su nói với các môn đồ; dùng tên “Đức Giê-su” để làm rõ chủ ngữ bị lược trong nguyên văn Hy Lạp.
