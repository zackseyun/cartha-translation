  text: ὅπου ὁ σκώληξ αὐτῶν οὐ τελευτᾷ, καὶ τὸ πῦρ οὐ σβέννυται.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/046.yaml
  text: where[a] their worm does not die, and the fire is not quenched.
translation:
  language: vi
  text: là nơi[a] sâu bọ của họ không chết, và lửa không tắt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Câu này không có trong các thủ bản Hy Lạp cổ nhất, gồm Sinaiticus và Vaticanus thuộc thế kỷ IV, cũng như trong các bản dịch Copt cổ; nhưng có trong truyền thống đa số Byzantine và truyền thống La-tinh. Có lẽ đây là phần được người sao chép thêm vào về sau, lặp lại nguyên văn câu 48 (và câu 44).
    reason: textual_critical
lexical_decisions:
- source_word: σκώληξ
  choice: sâu bọ
  rationale: Chỉ loài sâu hoặc giòi ăn vật thối rữa. “Sâu bọ” tự nhiên hơn trong tiếng Việt phổ thông, đồng thời giữ được liên hệ trực tiếp với hình ảnh trong Ê-sai 66:24.
- source_word: τελευτᾷ
  choice: chết
  rationale: Động từ τελευτάω có thể nghĩa là chấm dứt hoặc chết; trong ngữ cảnh nói về sâu bọ, “chết” là cách diễn đạt trực tiếp và tự nhiên, giữ sắc thái tiếp diễn của thì hiện tại.
- source_word: σβέννυται
  choice: tắt
  rationale: Động từ σβέννυμι ở thể bị động chỉ việc lửa bị dập hoặc tắt. Tiếng Việt thường nói “lửa không tắt”, vừa gọn vừa giữ nguyên hình ảnh về sự phán xét không ngừng.
theological_decisions:
- issue: Đại từ αὐτῶν trong cụm “sâu bọ của họ”
  choice: của họ
  alternative: của chúng
  rationale: Giữ sát đại từ số nhiều trong tiếng Hy Lạp và không giải thích thêm đối tượng quy chiếu, qua đó bảo toàn sự căng thẳng và tính gợi hình của lời trích Ê-sai 66:24.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và dễ hiểu. Cấu trúc “là nơi” nối tự nhiên với câu trước; “sâu bọ” tránh sắc thái quá hẹp của “giòi”, còn “lửa không tắt” là cách nói tiếng Việt thông dụng và mạnh.
