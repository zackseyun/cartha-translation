  text: οἱ δὲ ἐσιώπων, πρὸς ἀλλήλους γὰρ διελέχθησαν ἐν τῇ ὁδῷ τίς μείζων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/034.yaml
  text: But they kept silent[a], because on the road they had argued with one another about who was greater.
translation:
  language: vi
  text: Nhưng họ cứ im lặng, vì dọc đường họ đã tranh luận với nhau xem ai lớn hơn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch theo nghĩa tự nhiên trong ngữ cảnh: “ai là người lớn nhất.” Tuy nhiên, tiếng Hy Lạp dùng dạng so sánh: “lớn hơn.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσιώπων
  choice: cứ im lặng
  rationale: Thì chưa hoàn thành diễn tả sự im lặng kéo dài trước câu hỏi của Đức Chúa Jêsus; “cứ im lặng” truyền đạt rõ sắc thái tiếp diễn.
- source_word: διελέχθησαν
  choice: đã tranh luận
  rationale: Trong ngữ cảnh ganh đua địa vị, động từ mang sắc thái bất đồng hơn là chỉ trao đổi trung tính. “Đã” cũng cho thấy cuộc tranh luận xảy ra trước sự im lặng hiện tại.
- source_word: πρὸς ἀλλήλους
  choice: với nhau
  rationale: Diễn đạt tự nhiên ý tương tác qua lại giữa các môn đồ.
- source_word: ἐν τῇ ὁδῷ
  choice: dọc đường
  rationale: Cách nói tự nhiên trong tiếng Việt cho hành động xảy ra khi đang đi đường, phù hợp bối cảnh hành trình.
- source_word: τίς μείζων
  choice: ai lớn hơn
  rationale: Giữ nguyên dạng so sánh μείζων thay vì tự chuyển thành dạng cao nhất; trong ngữ cảnh, “lớn hơn” nói về địa vị hay tầm quan trọng.
- source_word: οἱ δὲ
  choice: Nhưng họ
  rationale: δέ tạo sự tương phản nhẹ với câu hỏi trước đó; “Nhưng họ” ngắn gọn và tự nhiên.
- source_word: γὰρ
  choice: vì
  rationale: Nêu lý do họ im lặng bằng liên từ nhân quả thông dụng trong tiếng Việt.
theological_decisions:
- issue: Dạng so sánh μείζων hay cách diễn đạt theo nghĩa cao nhất
  choice: ai lớn hơn
  alternative: ai là người lớn nhất
  rationale: Bản Hy Lạp dùng tính từ so sánh. Giữ “lớn hơn” bảo toàn hình thức và sự căng thẳng về địa vị giữa các môn đồ mà không làm trơn thành dạng cao nhất.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Cứ im lặng” thể hiện hành động kéo dài; “dọc đường” phù hợp khẩu ngữ chuẩn mà vẫn có phẩm cách. Dấu chú thích [a] được đặt ngay sau cụm từ mà chú thích giải thích.
