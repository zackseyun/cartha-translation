id: MRK.9.43
reference: Mark 9:43
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Καὶ ἐὰν ⸀σκανδαλίζῃ σε ἡ χείρ σου, ἀπόκοψον αὐτήν· καλόν ⸂ἐστίν σε⸃ κυλλὸν ⸂εἰσελθεῖν εἰς τὴν ζωὴν⸃ ἢ τὰς δύο χεῖρας ἔχοντα ἀπελθεῖν εἰς τὴν γέενναν, εἰς τὸ πῦρ τὸ ⸀ἄσβεστον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/043.yaml
  text: And if your hand causes you to stumble[a], cut it off. It is better for you to enter into life crippled than, having two hands, to go away into Gehenna[b], into the unquenchable fire.
translation:
  language: vi
  text: Nếu tay con khiến con vấp ngã[a], hãy chặt nó đi. Thà cụt tay mà vào sự sống còn hơn có đủ hai tay mà đi vào Ghê-hen-na[b], vào lửa không thể dập tắt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “khiến con phạm tội.” Động từ Hy Lạp có thể chỉ việc khiến một người vấp ngã, sa ngã hoặc phạm tội.'
    reason: lexical_alternative
  - marker: b
    text: Ghê-hen-na là dạng Hy Lạp của một địa danh gắn với sự phán xét của Đức Chúa Trời; theo truyền thống thường được dịch là “địa ngục.”
    reason: alternative_reading
lexical_decisions:
- source_word: σκανδαλίζῃ
  choice: khiến con vấp ngã
  rationale: Giữ hình ảnh vấp ngã của động từ Hy Lạp và không thu hẹp nghĩa chỉ còn phạm tội; nghĩa luân lý được nêu trong chú thích.
- source_word: ἀπόκοψον
  choice: hãy chặt nó đi
  rationale: Mệnh lệnh trực tiếp, mạnh và cụ thể, bảo toàn sức nặng gây sửng sốt của lời cảnh báo.
- source_word: καλόν ... ἢ
  choice: thà ... còn hơn
  rationale: Trong cấu trúc so sánh này, cách nói tự nhiên của tiếng Việt là “thà… còn hơn,” truyền đạt đúng ý điều nào tốt hơn.
- source_word: κυλλόν
  choice: cụt tay
  rationale: Trong ngữ cảnh vừa nói chặt tay, cách diễn đạt này cụ thể, tự nhiên và chính xác hơn một từ khái quát như “tàn tật.”
- source_word: εἰσελθεῖν εἰς τὴν ζωὴν
  choice: vào sự sống
  rationale: Giữ cách diễn đạt cánh chung trang trọng của nguyên văn, không giản lược thành sự sống sinh học.
- source_word: ἀπελθεῖν
  choice: đi vào
  rationale: Tiếng Việt tự nhiên dùng “đi vào” với một đích đến; sự đối lập với “vào sự sống” vẫn rõ, dù sắc thái “đi khỏi” của tiền tố Hy Lạp không thể hiện hoàn toàn.
- source_word: γέενναν
  choice: Ghê-hen-na
  rationale: Phiên âm địa danh Hy Lạp nhằm giữ hình ảnh Do Thái cụ thể về sự phán xét, thay vì đồng nhất ngay với thuật ngữ thần học rộng hơn là “địa ngục.”
- source_word: ἄσβεστον
  choice: không thể dập tắt
  rationale: Diễn đạt rõ nghĩa ngọn lửa không thể bị làm tắt bằng tiếng Việt hiện đại và tự nhiên.
- source_word: ἡ χείρ σου
  choice: tay con
  rationale: Dịch trực tiếp hình ảnh bộ phận thân thể vốn là trọng tâm của lời cảnh báo; “con” phù hợp lời Đức Giê-su trực tiếp dạy các môn đồ trong văn cảnh.
- source_word: τὰς δύο χεῖρας ἔχοντα
  choice: có đủ hai tay
  rationale: Giữ rõ sự tương phản với tình trạng cụt một tay, đồng thời tự nhiên hơn cách dịch máy móc “có hai tay.”
theological_decisions:
- issue: Cách dịch γέεννα trong lời nói về sự phán xét
  choice: Ghê-hen-na
  alternative: địa ngục
  rationale: Giữ thuật ngữ địa danh cụ thể của nguyên văn và các liên tưởng lịch sử Do Thái, trong khi cung cấp cách dịch truyền thống ở chú thích.
- issue: Sức mạnh của hình ảnh chặt tay
  choice: Giữ nguyên ngôn ngữ thân thể cụ thể
  alternative: Diễn giải thành lời khuyên chung chung về việc tránh phạm tội
  rationale: Nguyên văn cố ý dùng hình ảnh quyết liệt để nhấn mạnh tính nghiêm trọng của sự sa ngã và phán xét; bản dịch không làm nhẹ lời ấy.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “con” theo lối Đức Giê-su trực tiếp dạy môn đồ; giữ nhịp cảnh báo ngắn, mạnh. Phiên âm “Ghê-hen-na” và giải thích trong chú thích để vừa bám sát nguyên ngữ vừa hỗ trợ độc giả phổ thông.
