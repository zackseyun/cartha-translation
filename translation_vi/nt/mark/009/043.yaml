  verdict: approve
  source_fidelity: 'Bản dịch truyền đạt chính xác các thành tố chính của SBLGNT: điều kiện với σκανδαλίζῃ, mệnh lệnh quyết liệt ἀπόκοψον, đối chiếu ''thà... còn hơn'', tình trạng κυλλός, việc vào sự sống, Ghê-hen-na, và lửa ἄσβεστον. ''Đi vào Ghê-hen-na'' là cách tiếng Việt tự nhiên cho ἀπελθεῖν εἰς τὴν γέενναν, dù không biểu lộ riêng tiền tố ''đi khỏi/đi xa'' như tiếng Hy Lạp; ngữ cảnh đích đến và thế đối lập vẫn được giữ. Không có vấn đề văn bản cần chú thích thêm.'
  naturalness: Câu văn hiện đại, trang trọng và dễ đọc. 'Nếu tay con khiến con vấp ngã... hãy chặt nó đi' bảo toàn tính trực diện của lời nói; 'Thà cụt tay mà vào sự sống còn hơn...' là cấu trúc so sánh tiếng Việt tự nhiên. Cách xưng hô 'con' phù hợp với văn cảnh lời Đức Giê-su dạy môn đồ và được dùng nhất quán trong câu.
  terminology: '''Sự sống'' giữ được sắc thái thành ngữ cánh chung mà không diễn giải. Việc phiên âm ''Ghê-hen-na'' bám sát γέεννα và chú thích nêu đúng cách dịch truyền thống ''địa ngục'' mà không đồng nhất hai thuật ngữ trong chính văn. ''Lửa không thể dập tắt'' diễn đạt đúng ἄσβεστον. Chú thích a bảo lưu dải nghĩa của σκανδαλίζω một cách cân bằng.'
