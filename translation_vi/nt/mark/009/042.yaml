id: MRK.9.42
reference: Mark 9:42
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Καὶ ὃς ⸀ἂν σκανδαλίσῃ ἕνα τῶν μικρῶν ⸀τούτων τῶν πιστευόντων ⸂εἰς ἐμέ⸃, καλόν ἐστιν αὐτῷ μᾶλλον εἰ περίκειται ⸂μύλος ὀνικὸς⸃ περὶ τὸν τράχηλον αὐτοῦ καὶ βέβληται εἰς τὴν θάλασσαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/042.yaml
  text: And whoever causes one of these little ones who believe in me to stumble[a], it is better for him if a donkey millstone is put around his neck and he is thrown into the sea.
translation:
  language: vi
  text: Còn ai làm cho một trong những người bé mọn này, là những người tin vào tôi, vấp ngã, thì thà người ấy có một cối đá lớn do lừa kéo buộc quanh cổ và bị ném xuống biển thì hơn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nghĩa đen là “cối đá của lừa”, tức cối đá lớn được lừa kéo quay.
    reason: lexical_alternative
lexical_decisions:
- source_word: σκανδαλίσῃ
  choice: làm cho ... vấp ngã
  rationale: Giữ hình ảnh ẩn dụ về sự vấp ngã trong tiếng Hy Lạp, đồng thời không thu hẹp nghĩa chỉ còn “khiến phạm tội”; trong ngữ cảnh, động từ có thể bao hàm việc khiến người khác sa ngã hoặc lìa bỏ đức tin.
- source_word: μικρῶν τούτων
  choice: những người bé mọn này
  rationale: “Người bé mọn” giữ được phạm vi rộng, có thể gồm trẻ em nhưng không giới hạn ở tuổi tác; cụm từ cũng có thể chỉ những môn đồ yếu thế hoặc bị xem là không đáng kể.
- source_word: τῶν πιστευόντων εἰς ἐμέ
  choice: là những người tin vào tôi
  rationale: Diễn đạt trực tiếp cấu trúc πιστεύω εἰς với đối tượng là một ngôi vị và xác định những “người bé mọn” là người tin nơi Chúa Giê-su.
- source_word: καλόν ἐστιν αὐτῷ μᾶλλον
  choice: thì thà ... còn hơn
  rationale: Cấu trúc tiếng Việt này chuyển tải tự nhiên sức so sánh của μᾶλλον trong một lời cảnh báo nghiêm khắc, dù vế so sánh còn lại được ngầm hiểu từ ngữ cảnh.
- source_word: μύλος ὀνικός
  choice: một thớt cối đá do lừa kéo
  rationale: Cụm từ chỉ loại đá cối xay lớn vận hành bằng sức lừa, khác với cối xay tay nhỏ; “thớt cối đá” nêu rõ vật nặng được buộc quanh cổ.
- source_word: περίκειται ... περὶ τὸν τράχηλον
  choice: bị buộc quanh cổ
  rationale: Cách diễn đạt tự nhiên trong tiếng Việt, truyền đạt việc vật nặng được đặt hoặc quàng quanh cổ trong hình ảnh của câu.
- source_word: βέβληται εἰς τὴν θάλασσαν
  choice: bị ném xuống biển
  rationale: Truyền đạt rõ hành động bị động và kết quả sống động của thể hoàn thành Hy Lạp bằng lối nói tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Đối tượng của cụm “những người bé mọn này”
  choice: Dịch đủ rộng để chỉ những người tin yếu thế hoặc bị xem là nhỏ bé, trong đó có thể bao gồm trẻ em.
  alternative: Chỉ riêng trẻ em; hoặc nói chung về mọi môn đồ khiêm nhường.
  rationale: Mệnh đề “là những người tin vào tôi” cho thấy đối tượng không nhất thiết chỉ được xác định theo tuổi tác. Bản dịch giữ nguyên độ mở của cách nói thay vì quyết định thay cho người đọc.
- issue: Ý nghĩa của σκανδαλίσῃ
  choice: Giữ ẩn dụ “làm cho ... vấp ngã”.
  alternative: Diễn giải thành “khiến ... phạm tội” hoặc “khiến ... lìa bỏ đức tin”.
  rationale: Từ Hy Lạp có thể bao hàm nhiều mức độ sa ngã. Giữ ẩn dụ tránh thu hẹp lời cảnh báo vào một cách hiểu thần học duy nhất.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “tôi” theo lời trực tiếp của Chúa Giê-su, “người bé mọn” để bảo toàn sắc thái rộng của nguyên văn, và cấu trúc “thà ... còn hơn” nhằm làm lời cảnh báo tự nhiên, mạnh mẽ trong tiếng Việt.
