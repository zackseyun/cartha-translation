source:
  edition: SBLGNT
  text: καὶ ⸀εὐθὺς πᾶς ὁ ὄχλος ⸂ἰδόντες αὐτὸν ἐξεθαμβήθησαν⸃, καὶ προστρέχοντες ἠσπάζοντο αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/015.yaml
  text: And immediately the whole crowd[a], when they saw him, were greatly amazed, and running up to him, greeted him.
translation:
  language: vi
  text: Ngay lập tức, khi cả đám đông thấy Đức Chúa Giê-su, họ vô cùng kinh ngạc và chạy đến chào Ngài.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “vô cùng sửng sốt” hoặc “hoảng sợ”. Động từ Hy Lạp có thể diễn tả sự kinh ngạc, sửng sốt hoặc hoảng hốt mãnh liệt, tùy ngữ cảnh.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθὺς
  choice: ngay lập tức
  rationale: Giữ nhịp kể khẩn trương đặc trưng của sách Mác bằng cách diễn đạt tự nhiên trong tiếng Việt hiện đại.
- source_word: πᾶς ὁ ὄχλος
  choice: cả đám đông
  rationale: Diễn đạt danh từ tập hợp cùng πᾶς một cách tự nhiên, đồng thời giữ ý bao quát toàn thể.
- source_word: ἰδόντες αὐτόν
  choice: khi thấy Đức Chúa Jêsus
  rationale: Hiểu phân từ bất định quá khứ theo nghĩa thời gian, là hoàn cảnh dẫn đến phản ứng của đám đông; nêu danh xưng để tiếng Việt rõ chủ thể quy chiếu.
- source_word: ἐξεθαμβήθησαν
  choice: vô cùng kinh ngạc
  rationale: Truyền đạt cường độ mạnh của động từ mà không xác định nguyên nhân hay thu hẹp sắc thái thành sợ hãi.
- source_word: προστρέχοντες
  choice: chạy đến
  rationale: Giữ hình ảnh đám đông nhanh chóng chuyển động về phía Ngài bằng lối nói gọn và tự nhiên.
- source_word: ἠσπάζοντο αὐτόν
  choice: chào Ngài
  rationale: ἀσπάζομαι ở đây chỉ hành động chào hỏi; cách dịch này trung tính và phù hợp ngữ cảnh.
theological_decisions:
- issue: Sắc thái phản ứng của đám đông trong ἐξεθαμβήθησαν
  choice: vô cùng kinh ngạc
  alternative: vô cùng sửng sốt; hoảng sợ
  rationale: Nguyên văn nói đến một phản ứng kinh ngạc mãnh liệt nhưng không nêu nguyên nhân. Bản dịch giữ cường độ cảm xúc, không thêm giả thuyết về ánh sáng siêu nhiên hay xác định đó là nỗi sợ.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “Đức Chúa Jêsus” và đại từ tôn kính “Ngài” để làm rõ đại từ Hy Lạp trong tiếng Việt; không thêm lời giải thích về nguyên nhân khiến đám đông kinh ngạc.
