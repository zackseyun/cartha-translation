  text: καὶ ὤφθη αὐτοῖς Ἠλίας σὺν Μωϋσεῖ, καὶ ἦσαν συλλαλοῦντες τῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/004.yaml
  text: And Elijah appeared to them with Moses[a], and they were talking with Jesus.
translation:
  language: vi
  text: Ê-li cùng với Môi-se hiện ra trước mắt họ, và hai vị đang trò chuyện[a] với Giê-su.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đang cùng nói chuyện với Giê-su.”'
    reason: συλλαλοῦντες có thể được diễn đạt là “trò chuyện” hoặc sát cấu tạo hơn là “cùng nói chuyện”; cả hai đều thể hiện sự trao đổi qua lại.
lexical_decisions:
- source_word: ὤφθη αὐτοῖς
  choice: hiện ra trước mắt họ
  rationale: Động từ aorist bị động ὤφθη trong ngữ cảnh này mang nghĩa ‘hiện ra/được nhìn thấy’; cách diễn đạt ‘hiện ra trước mắt họ’ tự nhiên trong tiếng Việt và giữ rõ những người chứng kiến.
- source_word: Ἠλίας σὺν Μωϋσεῖ
  choice: Ê-li cùng với Môi-se
  rationale: σὺν diễn tả sự đồng hành; ‘cùng với’ phản ánh rõ cấu trúc trong đó Ê-li là chủ ngữ ngữ pháp số ít của ὤφθη, còn Môi-se xuất hiện cùng ông.
- source_word: ἦσαν συλλαλοῦντες
  choice: đang trò chuyện
  rationale: Cấu trúc ngoại vi ở thì chưa hoàn thành diễn tả hành động đang tiếp diễn; συλλαλέω hàm ý nói chuyện qua lại, nên ‘đang trò chuyện’ vừa tự nhiên vừa giữ tính tương hỗ.
- source_word: τῷ Ἰησοῦ
  choice: với Jêsus
  rationale: Dữ cách đi với συλλαλέω chỉ người cùng trò chuyện; ‘với Jêsus’ diễn đạt đúng tính tương hỗ hơn cách dịch máy móc là ‘với/cho Jêsus’ theo nghĩa một chiều.
theological_decisions:
- issue: Tính thực hữu của sự xuất hiện của Ê-li và Môi-se trong cảnh hóa hình
  choice: Trình bày trực tiếp rằng Ê-li cùng với Môi-se hiện ra và trò chuyện với Jêsus.
  alternative: Diễn giải đây chỉ là một thị kiến chủ quan hoặc một biểu tượng.
  rationale: Bản Hy Lạp kể sự việc như một sự xuất hiện và cuộc trò chuyện, nhưng không giải thích bản thể hay cơ chế của sự kiện; bản dịch không làm suy yếu cũng không bổ sung kết luận giáo lý.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng ‘hai vị’ để nối tự nhiên với chủ ngữ số nhiều hàm ẩn của ἦσαν συλλαλοῦντες mà không lặp tên; không thêm tước hiệu cho Jêsus vì nguyên văn chỉ có tên riêng.
