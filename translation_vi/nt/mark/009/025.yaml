  text: ἰδὼν δὲ ὁ Ἰησοῦς ὅτι ἐπισυντρέχει ὄχλος ἐπετίμησεν τῷ πνεύματι τῷ ἀκαθάρτῳ λέγων αὐτῷ· Τὸ ⸂ἄλαλον καὶ κωφὸν πνεῦμα⸃, ἐγὼ ⸂ἐπιτάσσω σοι⸃, ἔξελθε ἐξ αὐτοῦ καὶ μηκέτι εἰσέλθῃς εἰς αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/025.yaml
  text: But when Jesus saw that a crowd was quickly gathering[a], he rebuked the unclean spirit, saying to it, “You mute and deaf spirit, I command you, come out of him and never enter him again.”
translation:
  language: vi
  text: 'Nhưng khi Đức Giê-su thấy đám đông đang ùa đến[a], Ngài quở trách thần ô uế và nói với nó: “Hỡi thần câm và điếc, Ta truyền cho ngươi: Hãy ra khỏi người ấy và đừng bao giờ trở vào người ấy nữa!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “đám đông đang chạy đến tụ lại.” Động từ Hy Lạp gợi ý nhiều người nhanh chóng cùng đổ đến.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν δὲ
  choice: Nhưng khi ... thấy
  rationale: Phân từ bất định ἰδών nêu hoàn cảnh dẫn đến hành động chính, còn δέ là từ nối nhẹ. “Nhưng khi” tạo chuyển tiếp tự nhiên trong mạch kể.
- source_word: ἐπισυντρέχει ὄχλος
  choice: đám đông đang nhanh chóng tụ lại
  rationale: Động từ ἐπισυντρέχω diễn tả nhiều người cùng đổ đến hoặc chạy tụ lại; cách dịch này giữ được tính tiếp diễn và sự khẩn trương mà vẫn tự nhiên trong tiếng Việt.
- source_word: ἐπετίμησεν
  choice: quở trách
  rationale: ἐπιτιμάω diễn tả lời quở trách đầy thẩm quyền và là cách nói quen thuộc trong các trình thuật Tin Lành khi Đức Chúa Jêsus đối diện các tà linh.
- source_word: τῷ πνεύματι τῷ ἀκαθάρτῳ
  choice: uế linh
  rationale: ἀκάθαρτος mang nghĩa ô uế, không thanh sạch. “Uế linh” ngắn gọn, trang trọng và giữ được phạm trù của nguyên văn thay vì diễn giải thành bệnh tật.
- source_word: Τὸ ἄλαλον καὶ κωφὸν πνεῦμα
  choice: Hỡi linh câm và điếc
  rationale: Cụm danh từ có mạo từ ở cách chủ ngữ nhưng được dùng để xưng hô trực tiếp. “Hỡi” thể hiện lời gọi trang trọng; “câm và điếc” giữ riêng hai đặc tính ἄλαλον và κωφόν.
- source_word: ἐγὼ ἐπιτάσσω σοι
  choice: chính Ta truyền cho ngươi
  rationale: ἐπιτάσσω chỉ một mệnh lệnh có thẩm quyền; đại từ ἐγώ được nêu rõ để nhấn mạnh nên dịch là “chính Ta.”
- source_word: ἔξελθε ἐξ αὐτοῦ
  choice: Hãy ra khỏi người này
  rationale: Mệnh lệnh ἔξελθε đòi linh phải rời khỏi người bị ám. “Người này” truyền đạt quy chiếu nam tính của αὐτοῦ một cách tự nhiên trong tiếng Việt.
- source_word: μηκέτι εἰσέλθῃς εἰς αὐτόν
  choice: đừng bao giờ nhập vào người ấy nữa
  rationale: μηκέτι cùng lối cấm đoán bằng động từ giả định bất định đặt ra lệnh cấm dứt khoát đối với việc tái nhập. “Nhập vào” tự nhiên trong ngữ cảnh một linh nhập vào người.
theological_decisions:
- issue: Thuật ngữ về tà linh và thẩm quyền của Đức Chúa Jêsus
  choice: Dịch πνεῦμα ἀκάθαρτον là “uế linh,” ἐπετίμησεν là “quở trách,” và nhấn mạnh ἐγώ trong “chính Ta truyền cho ngươi.”
  alternative: Có thể dịch “tà linh,” “linh ô uế,” hoặc giảm nhẹ thành “Ngài nghiêm giọng nói với linh.”
  rationale: Nguyên văn trình bày một thực thể linh có ngôi vị, được Đức Chúa Jêsus trực tiếp phán bảo và phải phục dưới mệnh lệnh của Ngài. Bản dịch không đồng nhất thực thể ấy với bệnh tật, cũng không thêm lời giải thích giáo lý ngoài câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Chúa Jêsus,” “Ngài,” “Ta/ngươi” theo lối xưng hô tôn nghiêm trong lời truyền lệnh; giữ câu trực tiếp mạnh và dứt khoát của nguyên văn.
