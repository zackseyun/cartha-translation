revisions:
- from: 'Nhưng khi Đức Chúa Jêsus thấy đám đông đang nhanh chóng tụ lại[a], Ngài quở trách uế linh và nói với nó: “Hỡi linh câm và điếc, chính Ta truyền cho ngươi: Hãy ra khỏi người này và đừng bao giờ nhập vào người ấy nữa!”'
  to: 'Nhưng khi Đức Giê-su thấy đám đông đang ùa đến[a], Ngài quở trách thần ô uế và nói với nó: “Hỡi thần câm và điếc, Ta truyền cho ngươi: Hãy ra khỏi người ấy và đừng bao giờ trở vào người ấy nữa!”'
  rationale: 'Bản sửa thay các từ ngữ ít tự nhiên hoặc không theo chuẩn chính tả hiện đại, đồng thời giữ nguyên các phân biệt quan trọng của nguyên văn: linh là “ô uế,” linh ấy vừa câm vừa điếc, mệnh lệnh có thẩm quyền của Chúa Giê-su, và lệnh cấm dứt khoát không được quay lại. “Đang ùa đến” chuyển tải tính đang diễn ra và sự hội tụ nhanh của ἐπισυντρέχει; chú thích bảo lưu lựa chọn sát chữ “chạy đến tụ lại.”'
  reviewer_model: gpt-5.6-terra
