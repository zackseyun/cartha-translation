    rationale: Cụm này có thể hiểu được nhưng ít dùng, trong khi “thần ô uế” là cách dịch minh bạch, tự nhiên và sát với πνεῦμα ἀκάθαρτον hơn.
  - severity: medium
    issue: Tên “Jêsus” không theo chính tả hiện đại phổ thông.
    rationale: Mục tiêu là tiếng Việt chuẩn hiện đại; “Giê-su” là dạng chính tả thông dụng hơn.
  - severity: low
    issue: “người này” và “người ấy” quy chiếu cùng một người nhưng thay đổi cách gọi.
    rationale: Duy trì “người ấy” ở cả hai vế giúp câu mạch lạc, không thay đổi nghĩa hay giới tính nam được hàm ý trong nguyên ngữ.
