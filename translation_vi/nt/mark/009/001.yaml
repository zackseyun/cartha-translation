id: MRK.9.1
reference: Mark 9:1
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἔλεγεν αὐτοῖς· Ἀμὴν λέγω ὑμῖν ὅτι εἰσίν τινες ⸂τῶν ὧδε⸃ ἑστηκότων οἵτινες οὐ μὴ γεύσωνται θανάτου ἕως ἂν ἴδωσιν τὴν βασιλείαν τοῦ θεοῦ ἐληλυθυῖαν ἐν δυνάμει.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/001.yaml
  text: And he was saying to them[a], “Truly I say to you[d][c][b], there are some standing here who will certainly not taste death until they see the kingdom of God having come in power.”
translation:
  language: vi
  text: 'Ngài nói với họ: “Tôi nói thật với anh em, trong số những người đang đứng đây có vài người chắc chắn sẽ không nếm sự chết[a] cho đến khi thấy vương quốc Đức Chúa Trời đã đến trong quyền năng.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Nếm sự chết” là thành ngữ có nghĩa là trải qua sự chết, tức là chết.
    reason: lexical_alternative
  - marker: b
    text: Cụm từ “vương quốc Đức Chúa Trời đã đến trong quyền năng” đã được hiểu theo nhiều cách, chẳng hạn liên hệ với sự biến hình, sự phục sinh, Lễ Ngũ Tuần, sự phán xét trên Giê-ru-sa-lem hoặc sự hoàn tất tương lai của vương quốc; chính câu này không xác định biến cố nào.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔλεγεν
  choice: nói
  rationale: Thì vị hoàn thành trong lời dẫn kể chuyện có thể gợi hoạt động đang diễn ra hoặc lặp lại, nhưng tiếng Việt tự nhiên thường dùng “nói” mà không đánh dấu thể; ngữ cảnh đảm nhiệm sắc thái này.
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: Tôi nói thật với anh em
  rationale: Đây là công thức trang trọng mở đầu một lời khẳng định. Cách diễn đạt này tự nhiên trong tiếng Việt hiện đại, đồng thời giữ ngôi thứ nhất và số nhiều của đại từ chỉ người nghe.
- source_word: τινες τῶν ὧδε ἑστηκότων
  choice: trong số những người đang đứng đây có vài người
  rationale: 'Giữ rõ nghĩa bộ phận: chỉ một số người trong nhóm đang hiện diện, đồng thời phản ánh trạng thái “đang đứng đây” của phân từ hoàn thành.'
- source_word: οὐ μὴ γεύσωνται θανάτου
  choice: chắc chắn sẽ không nếm sự chết
  rationale: “Chắc chắn sẽ không” chuyển tải phủ định nhấn mạnh οὐ μή; “nếm sự chết” giữ hình ảnh ẩn dụ Hy Lạp thay vì giản lược thành “chết”.
- source_word: ἕως ἂν ἴδωσιν
  choice: cho đến khi thấy
  rationale: Diễn đạt trực tiếp mệnh đề thời gian hướng tới một sự kiện tương lai mà họ sẽ chứng kiến.
- source_word: βασιλείαν τοῦ θεοῦ
  choice: vương quốc Đức Chúa Trời
  rationale: “Vương quốc” giữ được cả chiều kích quyền trị vì lẫn thực tại cánh chung; đây cũng là cách gọi rõ ràng và quen thuộc trong văn phong Kinh Thánh tiếng Việt.
- source_word: ἐληλυθυῖαν
  choice: đã đến
  rationale: '“Đã đến” diễn đạt kết quả hiện hữu của phân từ hoàn thành: khi họ thấy, vương quốc ở trong trạng thái đã đến. Cách này tự nhiên hơn việc sao chép máy móc cấu trúc phân từ Hy Lạp.'
- source_word: ἐν δυνάμει
  choice: trong quyền năng
  rationale: Giữ sát cấu trúc giới từ và ý về quyền năng được biểu lộ, không chỉ định trước hình thức hay biến cố cụ thể của sự biểu lộ ấy.
theological_decisions:
- issue: Biến cố được nói đến trong câu “vương quốc Đức Chúa Trời đã đến trong quyền năng”
  choice: Giữ nguyên cách nói không xác định biến cố cụ thể
  alternative: Giải thích đó là sự hóa hình, sự phục sinh và tôn cao, Lễ Ngũ Tuần, sự phán xét Giê-ru-sa-lem, hoặc sự hoàn tất cuối cùng của vương quốc
  rationale: Bản văn Hy Lạp không nêu rõ biến cố nào; bản dịch vì thế giữ nguyên tính mở và căng thẳng giải nghĩa thay vì quyết định thay cho người đọc.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. “Tôi… anh em” tránh lối xưng hô cổ “ta… các ngươi” và không áp đặt một quan hệ xã hội không được mã hóa trong đại từ Hy Lạp. Hai dấu chú thích đều xuất hiện ngay trong chính văn.
