revisions:
- from: Sau sáu ngày[a], Đức Giê-su đem theo Phê-rô, Gia-cơ và Giăng, rồi đưa riêng ba người lên một ngọn núi cao; chỉ có họ với ngài.[b] Tại đó, ngài biến đổi hình dạng trước mặt họ.[c]
  to: Sau sáu ngày[a], Đức Giê-su đem theo Phê-rô, Gia-cơ và Giăng, đưa họ lên một ngọn núi cao, đến một nơi riêng biệt, chỉ có họ mà thôi.[b] Ngài đã biến hình trước mặt họ.[c]
  rationale: Bản sửa giữ sát μετὰ ἡμέρας ἕξ, παραλαμβάνει, ἀναφέρει, εἰς ὄρος ὑψηλόν, và ἔμπροσθεν αὐτῶν. Cụm “đến một nơi riêng biệt, chỉ có họ mà thôi” chuyển tải cả κατ’ ἰδίαν lẫn μόνους mà không tạo thành một lời giải thích vụng về. “Biến hình” được chọn thay cho “biến đổi hình dạng” vì tự nhiên và chính xác trong văn mạch, với chú thích giữ phương án từ vựng “biến đổi.” Dạng quá khứ “đã biến hình” là điều chỉnh bình thường theo lối trần thuật tiếng Việt; không cần mô phỏng hiện tại lịch sử Hy Lạp.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T07:40:29Z'
