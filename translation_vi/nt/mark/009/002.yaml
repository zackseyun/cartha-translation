  verdict: revise
  source_fidelity: Bản dịch truyền đạt đúng trình tự thời gian, việc Đức Giê-su đem ba môn đồ lên núi cao, và biến cố xảy ra trước mặt họ. Tuy nhiên, câu thêm “chỉ có họ với ngài” làm rõ đúng ý chung nhưng diễn đạt hơi gượng và có thể bị hiểu là chỉ bốn người theo một cách ngoài văn cảnh; tiếng Việt có thể giữ lực nhấn kép của κατ’ ἰδίαν μόνους tự nhiên hơn bằng “riêng biệt, chỉ có họ mà thôi.” “Biến đổi hình dạng” khá sát từ nhưng không phải cách diễn đạt tự nhiên cho μετεμορφώθη trong ngữ cảnh này; “biến hình” là thuật ngữ Việt ngữ chuẩn, vừa tự nhiên vừa không thêm diễn giải giáo lý.
  naturalness: Cần tránh chấm phẩy rồi thêm một câu rời “chỉ có họ với ngài.” Kết cấu “đưa họ lên một ngọn núi cao, đến một nơi riêng biệt, chỉ có họ mà thôi” mạch lạc hơn và bảo toàn hai cách nhấn mạnh trong tiếng Hy Lạp. “Ngài đã biến hình trước mặt họ” là văn phong trang trọng, hiện đại và quen thuộc.
  terminology: 'Giữ “Đức Giê-su,” “Phê-rô, Gia-cơ và Giăng” nhất quán với bản thảo. Dùng “biến hình” cho μετεμορφώθη: đây là cách gọi chuẩn của biến cố, đồng thời có nghĩa từ vựng phù hợp với sự biến đổi diện mạo được các câu kế tiếp mô tả; không cần áp đặt diễn giải tín lý.'
