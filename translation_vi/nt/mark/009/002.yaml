source:
  edition: SBLGNT
  text: Καὶ μετὰ ἡμέρας ἓξ παραλαμβάνει ὁ Ἰησοῦς τὸν Πέτρον καὶ τὸν Ἰάκωβον ⸀καὶ Ἰωάννην, καὶ ἀναφέρει αὐτοὺς εἰς ὄρος ὑψηλὸν κατ’ ἰδίαν μόνους. καὶ μετεμορφώθη ἔμπροσθεν αὐτῶν,
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/002.yaml
  text: And after six days[a], Jesus takes Peter and James and John, and brings them up onto a high mountain by themselves. And he was transfigured before them[c][b],
translation:
  language: vi
  text: Sau sáu ngày[a], Đức Giê-su đem theo Phê-rô, Gia-cơ và Giăng, đưa họ lên một ngọn núi cao, đến một nơi riêng biệt, chỉ có họ mà thôi.[b] Ngài đã biến hình trước mặt họ.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Sáu ngày sau.”'
    reason: lexical_alternative
  - marker: b
    text: Tiếng Hy Lạp dùng hai cách diễn đạt sự tách riêng, nhấn mạnh rằng Đức Giê-su chỉ đem theo ba người này.
    reason: lexical_alternative
  - marker: c
    text: 'Hay: “Ngài đã biến đổi trước mặt họ.”'
    reason: alternative_reading
lexical_decisions:
- source_word: μετὰ ἡμέρας ἓξ
  choice: Sau sáu ngày
  rationale: Giữ sát cách diễn đạt thời gian của tiếng Hy Lạp; trong tiếng Việt, cụm này tự nhiên và cũng có thể hiểu là “sáu ngày sau”.
- source_word: παραλαμβάνει
  choice: đem theo
  rationale: Diễn đạt rõ ý Đức Giê-su chọn và đưa ba môn đồ đi cùng; tiếng Việt không cần giữ hiện tại lịch sử của lối kể Hy Lạp.
- source_word: ἀναφέρει αὐτοὺς εἰς ὄρος ὑψηλὸν
  choice: đưa ... lên một ngọn núi cao
  rationale: Thể hiện hướng chuyển động đi lên và đích đến là một ngọn núi cao, đồng thời tự nhiên trong tiếng Việt.
- source_word: κατ’ ἰδίαν μόνους
  choice: đưa riêng ba người ...; chỉ có họ với ngài
  rationale: 'Giữ cả hai nét nhấn mạnh của tiếng Hy Lạp: tách riêng khỏi người khác và chỉ có ba môn đồ đi với Đức Giê-su, nhưng tránh cách lặp gượng trong tiếng Việt.'
- source_word: μετεμορφώθη
  choice: biến đổi hình dạng
  rationale: Chuyển tải trực tiếp sự thay đổi hữu hình được thuật lại mà không giải thích bản chất của biến cố vượt quá câu văn.
- source_word: ἔμπροσθεν αὐτῶν
  choice: trước mặt họ
  rationale: Cách nói tự nhiên, cho biết sự việc xảy ra ngay trong tầm nhìn và sự hiện diện của ba môn đồ.
theological_decisions:
- issue: Cách dịch μετεμορφώθη trong bối cảnh về Đức Ki-tô
  choice: ngài biến đổi hình dạng
  alternative: ngài biến hình
  rationale: “Biến đổi hình dạng” minh bạch về mặt từ vựng và bảo toàn việc câu văn mô tả một sự thay đổi hữu hình, không thêm lời giải thích thần học; “biến hình” là thuật ngữ truyền thống, ngắn gọn hơn nhưng có thể ít rõ với độc giả phổ thông.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “Đức Giê-su” và tên riêng theo dạng Công giáo quen thuộc vì đây là lựa chọn ngôn ngữ phổ biến, không nhằm xác lập lập trường giáo phái. Cấu trúc được điều chỉnh để diễn đạt tự nhiên mà vẫn giữ sự nhấn mạnh của κατ’ ἰδίαν μόνους.
