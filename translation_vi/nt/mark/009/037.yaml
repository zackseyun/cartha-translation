revisions:
- from: Ai tiếp đón một em nhỏ như thế này nhân danh tôi thì tiếp đón tôi; còn ai tiếp đón tôi thì không phải tiếp đón tôi, nhưng là Đấng đã sai tôi.
  to: Ai tiếp đón một trong những em nhỏ như thế nhân danh tôi thì tiếp đón tôi; còn ai tiếp đón tôi thì không tiếp đón tôi, nhưng tiếp đón Đấng đã sai tôi.
  rationale: Bản sửa loại bỏ sắc thái chỉ định không có trong τοιούτων, khôi phục cấu trúc phân thuộc của ἓν τῶν τοιούτων παιδίων, và sửa mệnh đề cuối để δέχεται được thể hiện nhất quán với đối tượng trực tiếp “tôi.” Thế đối lập nguyên văn vẫn được giữ nguyên, không diễn giải thành “không chỉ… mà còn.”
  reviewer_model: gpt-5.6-terra
