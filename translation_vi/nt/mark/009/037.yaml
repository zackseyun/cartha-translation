review_pass:
  verdict: revise
  source_fidelity: Bản thảo giữ đúng cấu trúc điều kiện khái quát, sự lặp lại của δέχομαι, và thế đối lập οὐκ…ἀλλά. Tuy nhiên, “như thế này” thêm sắc thái chỉ định gần (“này”) không có trong τοιούτων, và “không phải tiếp đón tôi” làm lệch cú pháp/phủ định của οὐκ ἐμὲ δέχεται.
  naturalness: “Ai … thì …” và “tiếp đón” là tự nhiên trong tiếng Việt hiện đại. Cần đổi mệnh đề cuối thành “không tiếp đón tôi, nhưng tiếp đón…” để câu có cấu trúc động từ song hành, dù vẫn giữ nghịch lý tu từ của nguyên văn.
  terminology: “Em nhỏ,” “nhân danh tôi,” và “Đấng đã sai tôi” phù hợp văn phong Kinh Thánh trang trọng. “Một trong những em nhỏ như thế” bảo toàn cấu trúc phân thuộc và nghĩa phẩm chất của tiếng Hy Lạp mà không áp đặt “những em này.”
  issues:
  - severity: medium
    issue: “như thế này”
    rationale: τοιούτων có nghĩa “như thế, thuộc loại ấy”; không có yếu tố chỉ định gần tương đương “này.”
  - severity: high
    issue: “thì không phải tiếp đón tôi, nhưng là Đấng đã sai tôi”
    rationale: Cách dùng “không phải tiếp đón” trong tiếng Việt phủ định/đánh giá chính hành động tiếp đón, thay vì phủ định đối tượng “tôi” của động từ δέχεται. Cần lặp động từ ở vế sau để phản ánh rõ “không tiếp đón tôi, nhưng [tiếp đón] Đấng đã sai tôi.”
  revised_text: Ai tiếp đón một trong những em nhỏ như thế nhân danh tôi thì tiếp đón tôi; còn ai tiếp đón tôi thì không tiếp đón tôi, nhưng tiếp đón Đấng đã sai tôi.
  revised_footnotes:
  - marker: a
    text: 'Hoặc: “một em nhỏ như thế.” Nguyên văn nói sát nghĩa: “một trong những em nhỏ như thế,” nhấn mạnh loại em nhỏ ấy, không nhất thiết là “những em nhỏ này.”'
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch “tiếp nhận” hoặc “đón tiếp”; cùng một động từ Hy Lạp được lặp lại trong cả câu.
    reason: lexical_alternative
