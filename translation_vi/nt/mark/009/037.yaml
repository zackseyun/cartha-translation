source:
  edition: SBLGNT
  text: Ὃς ⸀ἂν ἓν τῶν τοιούτων παιδίων δέξηται ἐπὶ τῷ ὀνόματί μου, ἐμὲ δέχεται· καὶ ὃς ⸁ἂν ἐμὲ ⸀δέχηται, οὐκ ἐμὲ δέχεται ἀλλὰ τὸν ἀποστείλαντά με.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/037.yaml
  text: Whoever receives one of such children in my name receives me; and whoever receives me receives not me, but the one who sent me.
translation:
  language: vi
  text: Ai tiếp đón một trong những em nhỏ như thế nhân danh tôi thì tiếp đón tôi; còn ai tiếp đón tôi thì không tiếp đón tôi, nhưng tiếp đón Đấng đã sai tôi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὃς ἂν
  choice: Ai
  rationale: Đại từ quan hệ kết hợp với ἄν diễn tả một trường hợp khái quát, bất định; “Ai” là cách nói tự nhiên trong tiếng Việt.
- source_word: ἓν τῶν τοιούτων παιδίων
  choice: một em nhỏ như thế này
  rationale: Giữ ý số ít của ἓν và sắc thái chỉ loại, phẩm chất của τοιούτων (“như thế này”), đồng thời diễn đạt tự nhiên hơn cấu trúc phân thuộc nguyên văn trong tiếng Việt.
- source_word: δέξηται / δέχεται / δέχηται
  choice: tiếp đón
  rationale: δέχομαι có thể mang nghĩa tiếp nhận hoặc đón tiếp. Trong ngữ cảnh một em nhỏ và một người được sai đến, “tiếp đón” tự nhiên, rõ nghĩa; cùng một từ được lặp lại xuyên suốt để giữ chuỗi liên kết tu từ.
- source_word: ἐπὶ τῷ ὀνόματί μου
  choice: nhân danh tôi
  rationale: Cụm từ chỉ hành động vì danh, trong mối liên hệ với thân vị và thẩm quyền của Đức Giê-su; “nhân danh tôi” là cách diễn đạt ngắn gọn, quen thuộc và trang trọng.
- source_word: οὐκ ἐμὲ δέχεται ἀλλὰ
  choice: không phải tiếp đón tôi, nhưng là
  rationale: Giữ nguyên thế đối lập οὐκ…ἀλλά mà không thêm ý “không chỉ…mà còn,” nhờ đó bảo tồn sức căng thần học của câu Hy Lạp.
- source_word: τὸν ἀποστείλαντά με
  choice: Đấng đã sai tôi
  rationale: Phân từ có mạo từ được diễn đạt như một danh ngữ. “Đấng” phù hợp văn phong trang trọng và ngữ cảnh quy chiếu đến Đức Chúa Trời, còn “đã sai tôi” giữ rõ quan hệ sai phái.
theological_decisions:
- issue: 'Ý nghĩa của thế đối lập cuối câu: “không phải tôi, nhưng là Đấng đã sai tôi”'
  choice: 'Giữ thế đối lập trực tiếp: “không phải tiếp đón tôi, nhưng là Đấng đã sai tôi.”'
  alternative: Diễn giải thành “không chỉ tiếp đón tôi mà còn tiếp đón Đấng đã sai tôi.”
  rationale: 'Nguyên văn dùng οὐκ…ἀλλά, không phải cấu trúc “không chỉ…mà còn.” Bản dịch giữ sự căng thẳng có chủ ý: việc tiếp đón Đức Giê-su thực sự vươn đến Đấng sai Ngài, nhưng không giải thích thay cho câu.'
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “em nhỏ” để phù hợp ngữ cảnh và “tiếp đón” nhất quán bốn lần nhằm tái hiện phép lặp của δέχομαι trong nguyên văn.
