    rationale: Nguyên ngữ quy chiếu về “họ”; dùng “họ đã thấy” tránh khả năng người đọc hiểu “mình” như phản thân số ít hoặc một cách nói khẩu ngữ không đồng đều trong văn phong trang trọng.
  - severity: low
    issue: Trật tự từ ở mở đầu câu hơi gượng.
    rationale: Đưa động từ “đi xuống” lên trước cụm nguồn “từ trên núi” tự nhiên hơn trong tiếng Việt hiện đại mà không thay đổi sắc thái phân từ hiện tại đồng thời.
