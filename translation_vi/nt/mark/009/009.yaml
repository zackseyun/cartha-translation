  verdict: revise
  source_fidelity: 'Bản dịch truyền đạt đúng mạch chính của câu: việc đi xuống núi, mệnh lệnh không thuật lại điều đã thấy, và giới hạn kéo dài đến sau khi Con Người sống lại từ giữa những người chết. “Cho đến khi” là cách chuyển ngữ tự nhiên và đúng ý nghĩa ngữ dụng của εἰ μὴ ὅταν; chú thích có thể bảo lưu hình thức sát chữ hơn. Tuy nhiên, “mình đã thấy” có thể tạo quy chiếu phản thân không thật rõ trong câu có chủ ngữ số nhiều.'
  naturalness: Văn phong nhìn chung hiện đại, trang trọng. “Khi họ đang từ trên núi đi xuống” hơi nặng trật tự từ; “Khi họ đang đi xuống từ trên núi” tự nhiên hơn. “Đừng kể cho bất cứ ai” là cách diễn đạt trực tiếp, tự nhiên hơn “không được kể với ai.”
  terminology: “Con Người” phù hợp để giữ danh xưng ὁ υἱὸς τοῦ ἀνθρώπου. “Từ giữa những người chết sống lại” bảo toàn sắc thái ἐκ νεκρῶν và vẫn có thể hiểu được trong văn phong Kinh Thánh hiện đại. “Ngài” và “ra lệnh” duy trì đúng sắc thái trang trọng và lực mệnh lệnh của διεστείλατο.
  issues:
