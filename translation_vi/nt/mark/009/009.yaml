source:
  edition: SBLGNT
  text: ⸂Καὶ καταβαινόντων⸃ αὐτῶν ⸀ἐκ τοῦ ὄρους διεστείλατο αὐτοῖς ἵνα μηδενὶ ⸂ἃ εἶδον διηγήσωνται⸃, εἰ μὴ ὅταν ὁ υἱὸς τοῦ ἀνθρώπου ἐκ νεκρῶν ἀναστῇ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/009.yaml
  text: And as they were coming down from the mountain[a], he ordered them to tell no one what they had seen[b], except when the Son of Man had risen from among the dead.
translation:
  language: vi
  text: Khi họ đang đi xuống từ trên núi, Ngài ra lệnh cho họ đừng kể cho bất cứ ai những điều họ đã thấy, cho đến khi Con Người từ giữa những người chết sống lại.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sát chữ hơn: “ngoại trừ khi Con Người từ giữa những người chết sống lại.”'
    reason: alternative_reading
lexical_decisions:
- source_word: Καὶ καταβαινόντων αὐτῶν ἐκ τοῦ ὄρους
  choice: Khi họ đang từ trên núi đi xuống
  rationale: Kết cấu sở hữu cách tuyệt đối với phân từ hiện tại diễn tả hành động đang diễn ra đồng thời; cách dịch này tự nhiên trong tiếng Việt và giữ được sắc thái tiếp diễn.
- source_word: διεστείλατο αὐτοῖς
  choice: Ngài truyền cho họ
  rationale: Động từ diễn tả một chỉ thị có tính ràng buộc. “Truyền” giữ được sức nặng của mệnh lệnh mà vẫn trang trọng, gọn và tự nhiên.
- source_word: ἵνα μηδενὶ ἃ εἶδον διηγήσωνται
  choice: không được kể với ai những điều mình đã thấy
  rationale: Cách diễn đạt này giữ rõ lệnh cấm, đối tượng bất định phủ định “không ai,” và nội dung là những điều các môn đồ đã thấy.
- source_word: εἰ μὴ ὅταν
  choice: cho đến khi
  rationale: Cụm Hy Lạp có hình thức sát chữ là “trừ khi/khi nào,” nhưng trong ngữ cảnh nó giới hạn lệnh cấm đến một biến cố tương lai; “cho đến khi” truyền đạt quan hệ thời gian rõ ràng và tự nhiên trong tiếng Việt, còn hình thức sát chữ được ghi ở chú thích.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Con Người
  rationale: Giữ danh xưng quen thuộc của Chúa Giê-su cùng âm hưởng Kinh Thánh và khả năng liên hệ đến Đa-ni-ên, không diễn giải thành một cách gọi chung về con người.
- source_word: ἐκ νεκρῶν ἀναστῇ
  choice: từ giữa những người chết sống lại
  rationale: “Từ giữa những người chết” bảo toàn sắc thái của ἐκ νεκρῶν, tức Ngài ra khỏi số những người đã chết; “sống lại” là cách diễn đạt tiếng Việt tự nhiên cho ἀναστῇ trong ngữ cảnh phục sinh.
theological_decisions:
- issue: Cách dịch danh xưng ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Con Người
  alternative: Con của loài người
  rationale: “Con Người” là danh xưng tiếng Việt đã quen thuộc, vẫn giữ được tính danh hiệu và âm hưởng Đa-ni-ên mà không biến cụm từ thành một mô tả nhân loại học thông thường.
- issue: Quan hệ thời gian trong εἰ μὴ ὅταν
  choice: cho đến khi Con Người từ giữa những người chết sống lại
  alternative: trừ khi Con Người từ giữa những người chết sống lại
  rationale: “Cho đến khi” làm rõ ý nghĩa thực dụng của lệnh cấm kéo dài tới biến cố phục sinh. Vì hình thức Hy Lạp sát chữ hơn là “trừ khi/khi nào,” chú thích bảo lưu phương án đó thay vì che khuất độ căng giữa hình thức và ý nghĩa.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “Ngài” được dùng cho Chúa Giê-su; “mình” quy chiếu tự nhiên về nhóm môn đồ. Cụm “từ giữa những người chết” hơi khác khẩu ngữ nhưng được giữ để chuyển tải chính xác sắc thái của nguyên văn.
