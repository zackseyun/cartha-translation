  to: Khi họ đang đi xuống từ trên núi, Ngài ra lệnh cho họ đừng kể cho bất cứ ai những điều họ đã thấy, cho đến khi Con Người từ giữa những người chết sống lại.[a]
  rationale: Chỉnh sửa chỉ nhằm làm rõ quy chiếu của chủ ngữ “đã thấy” và làm câu tiếng Việt trôi chảy hơn. Cách dịch “cho đến khi” được giữ vì phản ánh đúng chức năng giới hạn thời gian của mệnh lệnh; chú thích bảo lưu cấu trúc Hy Lạp sát chữ hơn mà không áp đặt một cách hiểu giáo phái.
