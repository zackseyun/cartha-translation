revisions:
- from: Vì bất cứ ai cho anh em uống một chén nước vì anh em mang danh là người thuộc về Đấng Mê-si,[a] thì quả thật, tôi nói với anh em, người ấy chắc chắn sẽ không mất phần thưởng của mình.
  to: Vì bất cứ ai cho anh em uống một chén nước bởi vì anh em thuộc về Đấng Mê-si,[a] thì quả thật, tôi nói với anh em, người ấy chắc chắn sẽ không mất phần thưởng của mình.
  rationale: Sửa bản chính thành “bởi vì anh em thuộc về Đấng Mê-si” để diễn đạt trực tiếp quan hệ sở thuộc của χριστοῦ ἐστε và tránh biến “mang danh” thành nội dung khẳng định chính. Chú thích giữ lại khả năng hiểu có liên hệ đến ὀνόματι, nhờ đó không xóa bỏ sự cô đọng và phần nào mơ hồ của nguyên ngữ. Các phần còn lại của câu được giữ nguyên vì trung thành với bản Hy Lạp và tự nhiên trong tiếng Việt hiện đại.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T07:40:45Z'
review_pass:
  verdict: revise
  source_fidelity: Bản nháp truyền đạt đúng ý chính của câu, gồm hành vi cho uống, quan hệ với Đấng Mê-si, lời xác quyết và phủ định nhấn mạnh về phần thưởng. Tuy nhiên, “mang danh là người thuộc về” diễn giải và nối chặt hai thành tố ἐν ὀνόματι và ὅτι χριστοῦ ἐστε hơn mức bản Hy Lạp đòi hỏi; đặc biệt, “mang danh” có thể gợi việc chỉ mang nhãn hiệu thay vì thực sự thuộc về Đấng Mê-si.
  naturalness: Câu nhìn chung tự nhiên và giữ văn phong hiện đại, trang trọng. “Vì ... vì ...” là sự lặp có thể chấp nhận được trong một câu trang trọng, nhưng có thể giảm bằng “bởi vì” ở mệnh đề thứ hai.
  terminology: “Đấng Mê-si” là cách chuyển Χριστός thích hợp khi từ này được dùng như tước hiệu. “Phần thưởng” và “quả thật, tôi nói với anh em” cũng phù hợp với ngữ cảnh và sắc thái của μισθός và ἀμήν λέγω ὑμῖν.
  issues:
  - severity: medium
    issue: Cụm “mang danh là người thuộc về Đấng Mê-si” thêm một sắc thái diễn giải vào mệnh đề χριστοῦ ἐστε.
    rationale: χριστοῦ ἐστε trực tiếp nói “anh em thuộc về Đấng Mê-si.” Cấu trúc ἐν ὀνόματι ὅτι... là cô đọng và cú pháp của nó có thể được phân tích khác nhau; bản dịch chính nên dùng cách diễn đạt nhân quả rõ ràng, còn sắc thái “mang danh” nên để ở chú thích như một khả năng.
