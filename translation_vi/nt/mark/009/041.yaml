id: MRK.9.41
reference: Mark 9:41
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ὃς γὰρ ἂν ποτίσῃ ὑμᾶς ποτήριον ὕδατος ἐν ⸀ὀνόματι ὅτι χριστοῦ ἐστε, ἀμὴν λέγω ὑμῖν ⸀ὅτι οὐ μὴ ⸀ἀπολέσῃ τὸν μισθὸν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/041.yaml
  text: For whoever gives you a cup of water to drink in the name that you are Messiah's[a], truly I say to you, he will certainly not lose his reward.
translation:
  language: vi
  text: Vì bất cứ ai cho anh em uống một chén nước bởi vì anh em thuộc về Đấng Mê-si,[a] thì quả thật, tôi nói với anh em, người ấy chắc chắn sẽ không mất phần thưởng của mình.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể hiểu: “vì anh em mang danh thuộc về Đấng Mê-si.”'
    reason: Cấu trúc Hy Lạp ἐν ὀνόματι ὅτι χριστοῦ ἐστε cô đọng; cách hiểu này cố gắng phản ánh yếu tố ὀνόματι (“danh”).
lexical_decisions:
- source_word: Ὃς γὰρ ἂν
  choice: Vì bất cứ ai
  rationale: Giữ liên từ γάρ để nối với lời dạy trước đó, đồng thời diễn đạt cấu trúc quan hệ bất định bằng tiếng Việt tự nhiên.
- source_word: ποτίσῃ ὑμᾶς ποτήριον ὕδατος
  choice: cho anh em uống một chén nước
  rationale: Diễn đạt trực tiếp hành động cho uống và giữ hình ảnh đơn sơ của ποτήριον ὕδατος.
- source_word: ἐν ὀνόματι ὅτι χριστοῦ ἐστε
  choice: vì anh em mang danh là người thuộc về Đấng Mê-si
  rationale: Cách dịch này giữ yếu tố ὀνόματι (“danh”) và quan hệ sở thuộc của χριστοῦ ἐστε, đồng thời tạo thành câu tiếng Việt dễ hiểu. Cấu trúc Hy Lạp cô đọng và có thể được hiểu theo nghĩa trực tiếp hơn là “vì anh em thuộc về Đấng Mê-si”; phương án ấy được ghi ở chú thích.
- source_word: ἀμὴν λέγω ὑμῖν
  choice: quả thật, tôi nói với anh em
  rationale: Giữ sắc thái long trọng, xác quyết của công thức ἀμήν mà vẫn dùng ngôn ngữ hiện đại.
- source_word: οὐ μὴ ἀπολέσῃ
  choice: chắc chắn sẽ không mất
  rationale: Thể hiện phủ định nhấn mạnh οὐ μή đi với động từ ở thể giả định aorist.
- source_word: τὸν μισθὸν αὐτοῦ
  choice: phần thưởng của mình
  rationale: “Phần thưởng” phù hợp với nghĩa đền đáp trong ngữ cảnh đạo đức và cánh chung; “của mình” quy chiếu tự nhiên về “người ấy” trong tiếng Việt.
theological_decisions:
- issue: Cách dịch Χριστός trong cấu trúc sở thuộc
  choice: Đấng Mê-si
  alternative: Đấng Christ
  rationale: Χριστός ở đây chỉ tước hiệu của Chúa Giê-su; “Đấng Mê-si” giữ rõ ý nghĩa tước hiệu mà không biến nó thành một tên riêng.
- issue: Quan hệ giữa ἐν ὀνόματι và ὅτι χριστοῦ ἐστε
  choice: vì anh em mang danh là người thuộc về Đấng Mê-si
  alternative: vì anh em thuộc về Đấng Mê-si
  rationale: Bản chính giữ cả yếu tố “danh” lẫn mệnh đề nói về sự thuộc về Đấng Mê-si, không tự ý thêm “danh tôi” vốn không hiện diện trong bản Hy Lạp. Chú thích bảo tồn cách hiểu ὅτι theo nghĩa nguyên nhân trực tiếp.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Đại từ “tôi—anh em” phù hợp với lời Chúa Giê-su nói với các môn đồ mà không dùng lối xưng hô cổ. Dấu chú thích [a] được đặt ngay sau cụm từ liên quan.
