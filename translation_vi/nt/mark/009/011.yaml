source:
  edition: SBLGNT
  text: καὶ ἐπηρώτων αὐτὸν λέγοντες· Ὅτι λέγουσιν οἱ γραμματεῖς ὅτι Ἠλίαν δεῖ ἐλθεῖν πρῶτον;
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/011.yaml
  text: And they were asking him[a], saying, “Why do the scribes say that Elijah must come first?”
translation:
  language: vi
  text: 'Họ hỏi Ngài: “Tại sao[a] các kinh sư nói rằng Ê-li phải đến trước?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Sao lại có chuyện các kinh sư nói rằng Ê-li phải đến trước?”'
    reason: Ὅτι trong câu hỏi này có thể được diễn đạt là “tại sao” hoặc theo sắc thái “sao lại có chuyện/how is it that”.
lexical_decisions:
- source_word: ἐπηρώτων
  choice: hỏi
  rationale: Thì chưa hoàn thành cho thấy hành động đang diễn ra trong mạch kể chuyện; tiếng Việt tự nhiên thường dùng động từ “hỏi” mà không cần thêm từ chỉ sự tiếp diễn hoặc lặp lại, vốn có thể nhấn mạnh quá mức.
- source_word: λέγοντες
  choice: dấu hai chấm trước lời hỏi trực tiếp
  rationale: Phân từ này dẫn vào nội dung câu hỏi. Dùng dấu hai chấm là cách diễn đạt tự nhiên trong tiếng Việt, tránh cấu trúc nặng nề “hỏi Ngài rằng, nói rằng”.
- source_word: Ὅτι
  choice: Tại sao
  rationale: Trong ngữ cảnh nghi vấn, ὅτι có chức năng thành ngữ, nêu câu hỏi “tại sao/sao lại có chuyện”. “Tại sao” rõ ràng và tự nhiên, còn khả năng diễn đạt gần với “sao lại có chuyện” được giữ trong chú thích.
- source_word: γραμματεῖς
  choice: các kinh sư
  rationale: “Kinh sư” chỉ đúng tầng lớp chuyên sao chép, nghiên cứu và giải thích Kinh Thánh trong bối cảnh Do Thái, đồng thời tránh đồng nhất hoàn toàn họ với danh xưng khác là “thầy dạy luật”.
- source_word: Ἠλίαν
  choice: Ê-li
  rationale: Dùng dạng tên riêng quen thuộc trong tiếng Việt.
- source_word: δεῖ
  choice: phải
  rationale: “Phải” diễn đạt trực tiếp sức nặng của sự cần thiết trong δεῖ mà không giải thích thêm nguồn gốc của sự cần thiết ấy.
- source_word: ἐλθεῖν
  choice: đến
  rationale: “Đến” là cách dịch trực tiếp và tự nhiên trong ngữ cảnh lời tiên báo.
- source_word: πρῶτον
  choice: trước
  rationale: “Trước” diễn đạt thứ tự thời gian; kết hợp “đến trước” tự nhiên hơn “trước tiên phải đến” trong câu này.
theological_decisions:
- issue: Sắc thái câu hỏi được mở đầu bằng Ὅτι
  choice: Dịch thành câu hỏi trực tiếp “Tại sao”
  alternative: “Sao lại có chuyện các kinh sư nói rằng…”
  rationale: Bản chính truyền đạt rõ lực nghi vấn nhưng chú thích vẫn bảo lưu cách hiểu thiên về “sao lại có chuyện/how is it that”, không tự ý xác định các môn đồ đang hỏi lý do của giáo huấn hay bày tỏ sự khó hiểu về giáo huấn ấy.
- issue: Bản chất việc Ê-li đến
  choice: Giữ nguyên “Ê-li phải đến trước”
  alternative: “Ê-li phải trở lại trước” hoặc “Ê-li phải đến trước Đấng Mê-si”
  rationale: Nguyên văn không có “trở lại” và cũng không nêu rõ đối tượng mà Ê-li phải đến trước; không thêm lời giải thích thần học dù ngữ cảnh có thể gợi đến điều đó.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Đại từ “Ngài” phù hợp lối xưng hô tôn kính dành cho Chúa Giê-su. Câu dẫn được rút gọn tự nhiên bằng dấu hai chấm, trong khi chú thích giữ lại sắc thái từ vựng có thể khác của Ὅτι.
