  verdict: approve
  source_fidelity: 'Bản dịch truyền đạt chính xác câu hỏi của các môn đồ về lời dạy của các kinh sư: Ê-li phải đến trước. “Tại sao” phản ánh phù hợp chức năng nghi vấn thành ngữ của ὅτι; chú thích cũng bảo lưu cách diễn đạt thay thế gần với “how is it that.” “Phải đến trước” giữ nguyên sắc thái cần thiết và ưu tiên thời gian của δεῖ ἐλθεῖν πρῶτον, không thêm “trở lại” hay đối tượng mà Ê-li đến trước. Động từ quá khứ đơn “hỏi” là cách kể chuyện tự nhiên trong tiếng Việt và không làm sai ý chính của thì chưa hoàn thành ἐπηρώτων.'
  naturalness: 'Câu văn hiện đại, rõ ràng và trang trọng. Cấu trúc “Họ hỏi Ngài: …” tự nhiên hơn việc mô phỏng phân từ λέγοντες bằng một cụm từ nặng nề. “Các kinh sư” và tên “Ê-li” đều phù hợp cách dùng tiếng Việt Kinh Thánh hiện đại.'
  terminology: “Kinh sư” là thuật ngữ lịch sử thích hợp cho γραμματεῖς, tránh diễn giải quá mức thành một chức danh hiện đại. “Ngài” duy trì lối xưng hô tôn kính nhất quán; “Ê-li” là dạng tên riêng quen dùng. Không có thuật ngữ thần học nào bị áp đặt hoặc diễn giải thêm.
