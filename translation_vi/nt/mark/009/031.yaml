id: MRK.9.31
reference: Mark 9:31
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐδίδασκεν γὰρ τοὺς μαθητὰς αὐτοῦ καὶ ἔλεγεν αὐτοῖς ὅτι Ὁ υἱὸς τοῦ ἀνθρώπου παραδίδοται εἰς χεῖρας ἀνθρώπων, καὶ ἀποκτενοῦσιν αὐτόν, καὶ ἀποκτανθεὶς ⸂μετὰ τρεῖς ἡμέρας⸃ ἀναστήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/031.yaml
  text: For he was teaching his disciples and telling them[a], “The Son of Man is being handed over into the hands of men, and they will kill him, and after he is killed[b], after three days he will rise.”
translation:
  language: vi
  text: 'Vì Ngài đang dạy các môn đồ và nói với họ: “Con Người đang bị giao nộp vào tay người ta[a]. Họ sẽ giết Người; và sau khi bị giết, ba ngày sau[b] Người sẽ sống lại.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hy Lạp: “vào tay những người”; đây là thành ngữ chỉ việc rơi vào quyền kiểm soát của họ. Cũng có thể dịch: “vào tay loài người.”'
    reason: lexical_alternative
  - marker: b
    text: Nguyên văn Hy Lạp là “sau ba ngày.” Cách nói này cũng xuất hiện bên cạnh cách nói “vào ngày thứ ba” ở những chỗ khác.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐδίδασκεν
  choice: vẫn dạy
  rationale: Thì chưa hoàn thành trình bày việc dạy dỗ đang tiếp diễn trong bối cảnh câu chuyện; “vẫn dạy” tự nhiên trong tiếng Việt và giữ được sắc thái kéo dài.
- source_word: γὰρ
  choice: Vì
  rationale: Giữ chức năng giải thích của liên từ đối với văn cảnh ngay trước đó.
- source_word: τοὺς μαθητὰς αὐτοῦ
  choice: các môn đồ
  rationale: “Môn đồ” là cách gọi quen thuộc, trang trọng vừa phải, diễn tả người theo học gắn bó với thầy.
- source_word: ἔλεγεν αὐτοῖς
  choice: nói với họ
  rationale: Đi cùng động từ chưa hoàn thành “ἐδίδασκεν”, cụm từ này diễn tả lời giảng dạy được tiếp tục mà vẫn tự nhiên trong tiếng Việt.
- source_word: Ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Con Người
  rationale: Giữ danh xưng đặc thù và khả năng liên hệ với Đa-ni-ên, không diễn giải thêm.
- source_word: παραδίδοται
  choice: đang bị nộp
  rationale: Giữ thể bị động và không xác định tác nhân; không thu hẹp nghĩa thành riêng hành vi phản bội. “Đang” phản ánh dạng hiện tại của tiếng Hy Lạp, có thể chỉ tiến trình đang diễn ra hoặc biến cố cận kề.
- source_word: εἰς χεῖρας ἀνθρώπων
  choice: vào tay người ta
  rationale: Giữ hình ảnh cụ thể về việc rơi vào quyền kiểm soát của con người. “Người ta” trong tiếng Việt chỉ những người làm tác nhân mà không buộc nghĩa là chỉ nam giới.
- source_word: ἀποκτενοῦσιν αὐτόν
  choice: Họ sẽ giết Người
  rationale: Giữ thì tương lai, chủ thể số nhiều không nêu danh tính, và nghĩa trực tiếp của động từ.
- source_word: ἀποκτανθεὶς
  choice: sau khi bị giết
  rationale: Phân từ quá khứ bị động chỉ hành động xảy ra trước việc sống lại; cách diễn đạt này rõ và tự nhiên trong tiếng Việt.
- source_word: μετὰ τρεῖς ἡμέρας
  choice: ba ngày sau
  rationale: Μετά với đối cách có nghĩa thông thường là “sau”; bản dịch không hòa đồng cụm này với cách nói “vào ngày thứ ba” ở những chỗ khác.
- source_word: ἀναστήσεται
  choice: Người sẽ sống lại
  rationale: Giữ nghĩa nội động của dạng trung gian tương lai, không chuyển thành thể bị động “sẽ được làm cho sống lại”.
theological_decisions:
- issue: Sắc thái và tác nhân của παραδίδοται
  choice: đang bị nộp
  alternative: bị phản bội; bị giao nộp
  rationale: Thể bị động Hy Lạp không nói rõ tác nhân và có thể bao quát sự phản bội, việc bắt giữ cũng như sự cho phép của Đức Chúa Trời. “Đang bị nộp” giữ nguyên độ mở và căng thẳng thần học ấy.
- issue: Mối tương phản giữa Ὁ υἱὸς τοῦ ἀνθρώπου và ἀνθρώπων
  choice: Con Người ... người ta
  alternative: Con Người ... loài người; Con Người ... những người ấy
  rationale: Cách dịch giữ sự lặp lại ý niệm “người” nhưng không áp đặt rằng ἀνθρώπων chỉ nói đến nam giới. “Người ta” cũng phù hợp với các tác nhân không được xác định trong câu.
- issue: Thể của ἀναστήσεται
  choice: sẽ sống lại
  alternative: sẽ được khiến sống lại
  rationale: Dạng trung gian ở đây tự nhiên mang nghĩa nội động “đứng dậy/sống lại”; không nhập vào câu này dạng bị động xuất hiện trong những lời tuyên bố khác.
- issue: Cách diễn đạt μετὰ τρεῖς ἡμέρας
  choice: ba ngày sau
  alternative: vào ngày thứ ba
  rationale: Giữ đúng cách nói “sau ba ngày” của câu này thay vì âm thầm hòa đồng với công thức “vào ngày thứ ba” ở nơi khác.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “Ngài/Người” dùng để chỉ Chúa Giê-su theo quy ước kính trọng tiếng Việt; câu vẫn giữ nhịp giải thích của γὰρ, hai hành động giết và sống lại, cùng sự lặp có chủ ý giữa “sau khi bị giết” và “ba ngày sau.”
