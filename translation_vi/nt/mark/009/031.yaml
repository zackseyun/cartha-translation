  source_fidelity: 'Bản dịch giữ tốt các thành tố trọng yếu: danh xưng “Con Người,” thể bị động không nêu tác nhân của παραδίδοται, các tác nhân số nhiều không xác định, việc bị giết, và trình tự sống lại “sau ba ngày.” Tuy nhiên, “vẫn dạy” thêm sắc thái “continues/still” không được chính τότε chưa hoàn thành tự nó xác lập; nên dùng cách diễn đạt tiến hành trung tính hơn. Chú thích b cũng nên tránh giải thích về cách tính ngày thời xưa vượt quá điều câu Hy Lạp xác nhận.'
  naturalness: Văn phong nhìn chung tự nhiên và trang trọng. “Đang dạy ... và nói với họ” diễn đạt phù hợp hơn sắc thái đang diễn ra của hai động từ chưa hoàn thành. “Bị giao nộp vào tay người ta” là một kết hợp từ ngữ hiện đại, tự nhiên, đồng thời vẫn giữ thành ngữ quyền lực/kiểm soát của nguyên văn.
  terminology: “Con Người,” “môn đồ,” và “sống lại” phù hợp với thuật ngữ Kinh Thánh tiếng Việt. “Bị giao nộp” giữ độ mở của παραδίδοται tốt hơn “bị phản bội” và nghe tự nhiên hơn “bị nộp” trong tiếng Việt hiện đại.
  issues:
