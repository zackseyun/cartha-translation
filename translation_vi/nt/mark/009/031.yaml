- from: 'Vì Ngài vẫn dạy các môn đồ và nói với họ: “Con Người đang bị nộp vào tay người ta[a]. Họ sẽ giết Người; và sau khi bị giết, ba ngày sau[b] Người sẽ sống lại.”'
  to: 'Vì Ngài đang dạy các môn đồ và nói với họ: “Con Người đang bị giao nộp vào tay người ta[a]. Họ sẽ giết Người; và sau khi bị giết, ba ngày sau[b] Người sẽ sống lại.”'
  rationale: Thay “vẫn dạy” bằng “đang dạy” để phản ánh thì chưa hoàn thành mà không thêm hàm ý tiếp diễn do văn cảnh trước đó. Thay “bị nộp” bằng “bị giao nộp” vì tự nhiên hơn trong tiếng Việt hiện đại và vẫn duy trì thể bị động cùng tác nhân không xác định. Điều chỉnh chú thích b để nêu đúng dữ liệu ngữ văn, không dựa vào một khẳng định lịch sử-giải thích rộng hơn. Các yếu tố nghĩa còn lại, đặc biệt “sau khi bị giết, ba ngày sau,” được giữ nguyên để phản ánh cả phân từ bị động lẫn cụm μετὰ τρεῖς ἡμέρας.
