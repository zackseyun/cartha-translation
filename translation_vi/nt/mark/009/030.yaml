source:
  edition: SBLGNT
  text: Κἀκεῖθεν ἐξελθόντες ⸀παρεπορεύοντο διὰ τῆς Γαλιλαίας, καὶ οὐκ ἤθελεν ἵνα τις γνοῖ·
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/030.yaml
  text: And from there[a] they went on through Galilee[b], and he did not want anyone to know.
translation:
  language: vi
  text: Rời nơi ấy, họ đi qua miền Ga-li-lê[a], và Đức Giê-su không muốn ai biết[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “họ đang đi ngang qua miền Ga-li-lê.” Dạng động từ Hy Lạp có thể nhấn mạnh hành trình đang diễn ra.'
    reason: lexical_alternative
  - marker: b
    text: Bản Hy Lạp không nói rõ Đức Giê-su không muốn người ta biết điều gì; theo ngữ cảnh, có thể là sự hiện diện hoặc lộ trình của Ngài qua Ga-li-lê.
    reason: lexical_alternative
lexical_decisions:
- source_word: Κἀκεῖθεν ἐξελθόντες
  choice: Rời nơi ấy
  rationale: Diễn đạt tự nhiên cả ý rời khỏi địa điểm trước đó của ἐξελθόντες và ý chỉ nơi chốn của ἐκεῖθεν; quan hệ tiếp nối của καί được thể hiện qua mạch kể liên tục.
- source_word: παρεπορεύοντο
  choice: họ đi qua
  rationale: Động từ chỉ việc di chuyển qua một nơi; dạng chưa hoàn thành gợi hành trình đang diễn ra, còn tiếng Việt không cần đánh dấu phương diện ấy một cách gượng ép trong câu chính.
- source_word: διὰ τῆς Γαλιλαίας
  choice: miền Ga-li-lê
  rationale: διά với sở hữu cách chỉ chuyển động xuyên qua một vùng; thêm “miền” làm rõ Ga-li-lê là khu vực địa lý.
- source_word: οὐκ ἤθελεν
  choice: Đức Giê-su không muốn
  rationale: θέλω diễn tả ý muốn. Chủ ngữ số ít được nêu rõ là Đức Giê-su theo ngữ cảnh, vì tiếng Việt cần một chủ ngữ rõ ràng ở đây.
- source_word: ἵνα τις γνοῖ
  choice: ai biết
  rationale: Giữ nguyên bổ ngữ bị lược của động từ “biết”, đồng thời diễn đạt tự nhiên ý ngăn không cho bất cứ ai biết.
theological_decisions:
- issue: Chủ ngữ ngầm của ἤθελεν
  choice: Nêu rõ là “Đức Giê-su”
  alternative: Dùng đại từ “Ngài” hoặc để chủ ngữ ngầm
  rationale: Động từ số ít trong ngữ cảnh quy chiếu về Đức Giê-su. Nêu tên giúp câu tiếng Việt rõ nghĩa mà không thêm một khẳng định thần học mới.
- issue: Điều người khác không được biết
  choice: Để bổ ngữ của “biết” không được nói rõ
  alternative: Nói rõ là sự hiện diện hoặc lộ trình của Đức Giê-su
  rationale: Bản Hy Lạp không nói rõ điều ấy; giữ chỗ bỏ lửng bảo toàn tính hàm ẩn và tránh quyết định thay cho văn bản.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Câu giữ nhịp kể đơn giản, không thêm quan hệ đối lập vốn không có trong liên từ Hy Lạp.
