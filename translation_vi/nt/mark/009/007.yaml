revisions:
- from: 'Rồi một đám mây kéo đến, bao phủ lấy họ, và có tiếng từ trong đám mây phán rằng: “Đây là Con yêu dấu của Ta. Hãy nghe lời Người[a].”'
  to: 'Rồi một đám mây kéo đến, phủ bóng trên họ, và một tiếng từ đám mây vang ra: “Đây là Con yêu dấu của Ta; hãy lắng nghe Người[a].”'
  rationale: Bản sửa giữ cấu trúc sự kiện kép của ἐγένετο (“đám mây kéo đến” và “một tiếng ... vang ra”), diễn tả ἐπισκιάζουσα bằng hình ảnh phủ bóng, và dịch ἀκούετε αὐτοῦ là “hãy lắng nghe Người” để bảo toàn sức mạnh mệnh lệnh mà không thêm ý tuân phục vào văn bản chính. Dấu chấm phẩy trong lời phán liên kết sát lời xác nhận và mệnh lệnh như nguyên văn.
  reviewer_model: gpt-5.6-terra
