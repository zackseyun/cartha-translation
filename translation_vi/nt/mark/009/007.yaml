source:
  edition: SBLGNT
  text: καὶ ἐγένετο νεφέλη ἐπισκιάζουσα αὐτοῖς, καὶ ⸀ἐγένετο φωνὴ ἐκ τῆς νεφέλης· Οὗτός ἐστιν ὁ υἱός μου ὁ ἀγαπητός, ⸂ἀκούετε αὐτοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/007.yaml
  text: 'And a cloud came[a], overshadowing them, and a voice came out of the cloud: “This is my beloved Son; listen to him.”'
translation:
  language: vi
  text: 'Rồi một đám mây kéo đến, phủ bóng trên họ, và một tiếng từ đám mây vang ra: “Đây là Con yêu dấu của Ta; hãy lắng nghe Người[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Hãy nghe Người.” Mệnh lệnh này hàm ý lắng nghe chăm chú và lưu tâm đáp lại, chứ không chỉ tiếp nhận âm thanh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο νεφέλη
  choice: một đám mây kéo đến
  rationale: Động từ γίνομαι ở đây diễn tả sự xuất hiện hoặc kéo đến của đám mây. “Kéo đến” tự nhiên trong tiếng Việt, giữ sắc thái biến cố mà không giải thích thêm ý nghĩa biểu tượng của đám mây.
- source_word: ἐπισκιάζουσα αὐτοῖς
  choice: bao phủ lấy họ
  rationale: Phân từ ἐπισκιάζουσα có thể chỉ việc phủ bóng hoặc bao trùm. “Bao phủ lấy họ” diễn đạt tự nhiên hình ảnh đám mây trùm lên những người hiện diện, đồng thời không thêm cách giải thích thần học.
- source_word: φωνὴ ἐκ τῆς νεφέλης
  choice: có tiếng từ trong đám mây phán rằng
  rationale: φωνή trong ngữ cảnh là tiếng nói có nội dung rõ ràng. “Từ trong đám mây” giữ lực không gian của ἐκ; “phán rằng” là cách diễn đạt trang trọng, tự nhiên cho lời trực tiếp từ Đức Chúa Trời, dù động từ nói không xuất hiện riêng trong tiếng Hy Lạp.
- source_word: ὁ υἱός μου ὁ ἀγαπητός
  choice: Con yêu dấu của Ta
  rationale: Cách dịch trực tiếp, trang trọng và tự nhiên, giữ nguyên lời xác nhận về mối quan hệ Cha–Con và tình yêu dành cho Chúa Giê-su mà không khai triển thêm tín lý.
- source_word: ἀκούετε αὐτοῦ
  choice: Hãy nghe lời Người
  rationale: Mệnh lệnh hiện tại kêu gọi không chỉ nghe âm thanh mà còn chú tâm và làm theo. “Nghe lời” diễn đạt được sức nặng đáp ứng trong tiếng Việt nhưng không thu hẹp hoàn toàn thành “vâng phục”.
theological_decisions:
- issue: Lời tuyên bố từ trời về căn tính của Chúa Giê-su
  choice: “Đây là Con yêu dấu của Ta”
  alternative: “Đây là Con Ta, Đấng yêu dấu”
  rationale: Cả hai đều có thể phản ánh cấu trúc Hy Lạp, nhưng “Con yêu dấu của Ta” tự nhiên hơn trong tiếng Việt và vẫn giữ nguyên lời xác nhận Chúa Giê-su là Con của Đức Chúa Trời.
- issue: Sức nặng của ἀκούετε αὐτοῦ
  choice: “Hãy nghe lời Người”
  alternative: “Hãy lắng nghe Người” hoặc “Hãy vâng phục Người”
  rationale: “Nghe lời” giữ cả ý lắng nghe chăm chú lẫn đáp ứng, trong khi “vâng phục” dễ diễn giải quá mức và “lắng nghe” có thể không biểu đạt đầy đủ ý làm theo.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “Ta” và “Người” phù hợp với lời phán từ trời và đối tượng là Chúa Giê-su. Dấu chấm được dùng giữa hai câu trong lời phán để lời tuyên bố và mệnh lệnh rõ ràng hơn.
