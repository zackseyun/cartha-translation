  text: But they did not understand the statement[a], and they were afraid to ask him.
translation:
  language: vi
  text: Nhưng họ không hiểu lời ấy[a], và họ sợ không dám hỏi Ngài.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “lời nói ấy.” Từ Hy Lạp ῥῆμα có thể chỉ một lời nói, câu nói hoặc điều được phát biểu.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ
  choice: Nhưng họ
  rationale: δέ tạo sự tương phản nhẹ với lời Đức Chúa Giê-su vừa báo trước; chủ thể được hiểu theo ngữ cảnh là các môn đồ.
- source_word: ἠγνόουν
  choice: không hiểu
  rationale: ἀγνοέω ở đây diễn tả việc không nắm được ý nghĩa của điều vừa được nói. Thì chưa hoàn thành chỉ trạng thái kéo dài trong quá khứ, vốn được tiếng Việt diễn đạt tự nhiên bằng “không hiểu”.
- source_word: τὸ ῥῆμα
  choice: lời ấy
  rationale: ῥῆμα chỉ lời nói hay điều vừa được phát biểu, tức lời báo trước ngay trước đó. “Lời ấy” tự nhiên, trang trọng vừa phải và không thu hẹp nghĩa vào một từ đơn lẻ.
- source_word: ἐφοβοῦντο
  choice: họ sợ
  rationale: φοβέομαι diễn tả trạng thái sợ hãi; cách dịch ngắn gọn này tự nhiên trong tiếng Việt và giữ được sắc thái của thì chưa hoàn thành theo ngữ cảnh.
- source_word: αὐτὸν
  choice: Ngài
  rationale: Đại từ làm tân ngữ, chỉ Đức Chúa Giê-su. “Ngài” là cách xưng hô tiếng Việt trang trọng, rõ nghĩa trong ngữ cảnh.
- source_word: ἐπερωτῆσαι
  choice: hỏi
  rationale: ἐπερωτάω có nghĩa là hỏi hoặc chất vấn. “Hỏi” phù hợp nhất với việc các môn đồ muốn tìm hiểu lời Đức Chúa Giê-su nhưng lại sợ.
theological_decisions:
- issue: Nguyên nhân và đối tượng của nỗi sợ
  choice: Giữ cấu trúc “họ sợ hỏi Ngài” mà không giải thích vì sao họ sợ.
  alternative: Diễn giải rằng họ sợ bị quở trách hoặc sợ biết thêm về cuộc thương khó.
  rationale: Bản Hy Lạp chỉ nói họ sợ hỏi Đức Chúa Giê-su, không nêu nguyên nhân; việc thêm một lý do sẽ giải quyết sự bỏ ngỏ của câu.
translation_notes:
  register: Tiếng Việt hiện đại, rõ ràng và trang trọng vừa phải. Câu giữ sự tương phản của δέ, đồng thời không thêm nguyên nhân cho nỗi sợ của các môn đồ.
