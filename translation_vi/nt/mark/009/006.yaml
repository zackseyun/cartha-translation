  text: οὐ γὰρ ᾔδει τί ⸀ἀποκριθῇ, ⸂ἔκφοβοι γὰρ ἐγένοντο⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/006.yaml
  text: For he did not know what he should answer[b][a], for they were terrified.
translation:
  language: vi
  text: Vì ông không biết phải đáp thế nào[a], bởi họ đã trở nên vô cùng kinh hãi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “phải trả lời ra sao.”'
    reason: lexical_alternative
  - marker: b
    text: 'Nói tự nhiên hơn có thể dịch: “bởi họ vô cùng kinh hãi”; nguyên văn nhấn mạnh rằng họ đã rơi vào trạng thái kinh hãi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾔδει
  choice: biết
  rationale: οἶδα diễn tả sự biết hoặc nhận thức; với οὐ, cách dịch tự nhiên là “không biết”.
- source_word: τί ἀποκριθῇ
  choice: phải đáp thế nào
  rationale: ἀποκρίνομαι có nghĩa cụ thể là đáp lại; cấu trúc cân nhắc với τί được diễn đạt tự nhiên trong tiếng Việt bằng “phải đáp thế nào”.
- source_word: ἔκφοβοι
  choice: vô cùng kinh hãi
  rationale: ἔκφοβος chỉ mức độ sợ hãi mạnh hơn “sợ”; “vô cùng kinh hãi” giữ được sắc thái tăng cường.
- source_word: ἐγένοντο
  choice: đã trở nên
  rationale: γίνομαι ở đây diễn tả việc bước vào một trạng thái, nên “đã trở nên” giữ được lực động của động từ thay vì chỉ nói “đã” hoặc “đang” ở trong trạng thái ấy.
- source_word: γὰρ ... γὰρ
  choice: vì ... bởi
  rationale: Hai liên từ đều nêu lý do. Dùng “vì ... bởi” bảo toàn hai tầng giải thích mà tránh lặp từ thiếu tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Chủ ngữ của mệnh đề số nhiều
  choice: họ đã trở nên vô cùng kinh hãi
  alternative: ông đã trở nên vô cùng kinh hãi
  rationale: Tính từ ἔκφοβοι và động từ ἐγένοντο đều ở số nhiều, nên chủ ngữ tự nhiên là Phi-e-rơ cùng các bạn đồng hành, không phải chỉ riêng ông. Đây là quyết định dựa trên ngữ pháp, không nhằm giải quyết một vấn đề giáo lý.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Đại từ “ông” nối tự nhiên với Phi-e-rơ trong ngữ cảnh. Cặp “vì ... bởi” giữ hai lần γάρ mà không tạo cảm giác lặp máy móc.
