  text: ὅπου ὁ σκώληξ αὐτῶν οὐ τελευτᾷ, καὶ τὸ πῦρ οὐ σβέννυται.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/044.yaml
  text: where[a] their worm does not die, and the fire is not quenched.
translation:
  language: vi
  text: nơi[a] sâu bọ của họ không chết, và lửa không tắt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Câu này không có trong các thủ bản Hy Lạp sớm nhất (gồm Sinaiticus và Vaticanus thuộc thế kỷ IV) cũng như các bản dịch Copt cổ, nhưng có trong Alexandrinus thuộc thế kỷ V, truyền thống La-tinh và đa số thủ bản Byzantine về sau. Có khả năng đây là phần người sao chép thêm vào sau này, lặp lại nguyên văn câu 48.
    reason: textual_critical
lexical_decisions:
- source_word: σκώληξ
  choice: sâu bọ
  rationale: Chỉ loài sâu hoặc giòi ăn vật chất phân hủy. “Sâu bọ” tự nhiên và trang trọng trong tiếng Việt, đồng thời giữ hình ảnh trích từ Ê-sai 66:24 mà không thu hẹp quá mức thành riêng “giòi”.
- source_word: τελευτᾷ
  choice: chết
  rationale: Động từ có nghĩa là đi đến tận cùng hoặc chết; khi chủ thể là sinh vật, “chết” là cách diễn đạt trực tiếp và tự nhiên nhất.
- source_word: σβέννυται
  choice: tắt
  rationale: Dạng hiện tại bị động diễn tả việc bị dập tắt. Tiếng Việt thường nói lửa “không tắt”; cách dịch này ngắn gọn, tự nhiên và bảo toàn ý ngọn lửa không bị dập tắt.
theological_decisions:
- issue: Đại từ sở hữu αὐτῶν trong cụm “sâu bọ của họ”
  choice: giữ nguyên “của họ”
  alternative: diễn giải là “sâu bọ ăn họ” hoặc “sâu bọ nơi đó”
  rationale: Nguyên văn giữ đại từ sở hữu và hình ảnh gợi từ Ê-sai 66:24; không nên diễn giải thêm bản chất hay đối tượng của hình phạt.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ cấu trúc ngắn, giàu hình ảnh của nguyên văn; đặt dấu chú thích ngay sau “nơi” để báo cho độc giả về vấn đề dị bản của toàn câu.
