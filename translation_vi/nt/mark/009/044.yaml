  terminology: Các thuật ngữ then chốt được xử lý nhất quán và không áp đặt diễn giải giáo phái. Chú thích dị bản đặt tại “nơi” bao quát đúng toàn câu, đồng thời trình bày thận trọng tính chất có tranh luận của câu 44.
