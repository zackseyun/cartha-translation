source:
  edition: SBLGNT
  text: ⸂Ἔφη αὐτῷ ὁ Ἰωάννης⸃· Διδάσκαλε, εἴδομέν τινα ⸀ἐν τῷ ὀνόματί σου ἐκβάλλοντα δαιμόνια, ⸂καὶ ἐκωλύομεν αὐτόν, ὅτι οὐκ ἠκολούθει ἡμῖν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/038.yaml
  text: John said to him[a], “Teacher, we saw someone casting out demons in your name, and we tried to stop him because he was not following us.”
translation:
  language: vi
  text: 'Giăng thưa với Đức Chúa Giê-su: “Thưa Thầy, chúng con thấy có người nhân danh Thầy mà đuổi quỷ, và chúng con đã cố ngăn người ấy[a], vì người ấy không theo chúng con.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “chúng con đang ngăn người ấy” hoặc “chúng con cứ ngăn người ấy.” Thì vị hoàn trong tiếng Hy Lạp có thể diễn tả hành động đang tiếp diễn, lặp lại, hoặc được toan thực hiện; vì vậy, ở đây dịch là “đã cố ngăn.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔφη αὐτῷ ὁ Ἰωάννης
  choice: Giăng thưa với Đức Chúa Jêsus
  rationale: Động từ ἔφη là động từ tường thuật lời nói thông dụng. “Thưa” tự nhiên trong tiếng Việt khi môn đồ nói với thầy mình; đại từ αὐτῷ được diễn đạt rõ là “Đức Chúa Jêsus” để tránh đại từ mơ hồ trong câu đứng riêng.
- source_word: Διδάσκαλε
  choice: Thưa Thầy
  rationale: Διδάσκαλε là cách xưng hô trực tiếp, nghĩa là “Thầy/Giáo sư.” “Thưa Thầy” vừa chính xác vừa tự nhiên, trang trọng trong tiếng Việt hiện đại.
- source_word: εἴδομέν τινα
  choice: chúng con thấy có người
  rationale: τινα chỉ một người không xác định. “Có người” tự nhiên hơn “một người nào đó,” còn “chúng con” phù hợp với quan hệ giữa các môn đồ và Đức Chúa Jêsus.
- source_word: ἐν τῷ ὀνόματί σου
  choice: nhân danh Thầy
  rationale: “Nhân danh” là cách diễn đạt tiếng Việt tự nhiên của thành ngữ ἐν τῷ ὀνόματί, hàm ý hành động dựa trên danh và thẩm quyền của Đức Chúa Jêsus.
- source_word: ἐκβάλλοντα δαιμόνια
  choice: đuổi quỷ
  rationale: ἐκβάλλω cùng δαιμόνια chỉ hành động trục xuất các quỷ. “Đuổi quỷ” ngắn gọn, rõ nghĩa và quen thuộc trong văn cảnh Phúc Âm.
- source_word: καὶ ἐκωλύομεν αὐτόν
  choice: nên chúng con đã cố ngăn người ấy
  rationale: Thì vị hoàn ἐκωλύομεν có thể diễn tả hành động đang tiếp diễn, lặp lại hoặc được toan thực hiện. “Đã cố ngăn” truyền đạt sắc thái toan ngăn mà không khẳng định họ đã ngăn thành công.
- source_word: ὅτι οὐκ ἠκολούθει ἡμῖν
  choice: vì người ấy không theo chúng con
  rationale: ἡμῖν có nghĩa trực tiếp là “chúng tôi/chúng con.” Giữ nguyên “chúng con” bảo toàn điểm nhấn đáng chú ý của lời Giăng về việc người ấy không theo nhóm môn đồ.
theological_decisions:
- issue: Đối tượng mà người trừ quỷ không đi theo trong mệnh đề cuối
  choice: không theo chúng con
  alternative: không theo Thầy; không thuộc nhóm chúng con
  rationale: 'Bản Hy Lạp ghi rõ ἡμῖν, “chúng tôi/chúng con,” chứ không phải “Thầy.” Cách dịch trực tiếp bảo toàn sự căng thẳng trong trình thuật: Giăng tập trung vào ranh giới của nhóm môn đồ, là điều lời đáp tiếp theo của Đức Chúa Jêsus sẽ điều chỉnh.'
- issue: Ý nghĩa của hành động nhân danh Đức Chúa Jêsus
  choice: nhân danh Thầy
  alternative: dùng danh Thầy; nhờ danh Thầy
  rationale: “Nhân danh” giữ được thành ngữ nguồn và không xác định quá mức cơ chế hay địa vị thuộc linh của người thực hiện.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “chúng con—Thầy” để thể hiện tự nhiên quan hệ môn đồ với thầy. Tên “Giăng” và danh xưng “Đức Chúa Jêsus” theo lối gọi Tin Lành Việt ngữ quen thuộc; câu dịch giữ nguyên “chúng con” ở cuối thay vì diễn giải thành “không thuộc nhóm chúng con.”
