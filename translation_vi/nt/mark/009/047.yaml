  verdict: revise
  source_fidelity: 'Bản nháp truyền đạt đúng cấu trúc chính: điều kiện, mệnh lệnh mạnh, phép so sánh, thể bị động của βληθῆναι, và thuật ngữ συγκεκρι thể γέεννα. Tuy nhiên, “có đủ hai mắt” thêm nét nghĩa “đủ” không có trong nguyên văn; μονόφθαλμον chỉ nêu tình trạng một mắt. Đại từ “con” cũng diễn giải quan hệ người nói-người nghe mà tiếng Hy Lạp chỉ dùng ngôi thứ hai số ít.'
