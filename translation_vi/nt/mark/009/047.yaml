revisions:
- from: Nếu mắt con khiến con vấp ngã, hãy ném nó đi. Thà con chỉ còn một mắt mà vào vương quốc Đức Chúa Trời còn hơn có đủ hai mắt mà bị ném vào Ghê-hen-na[a],
  to: Nếu mắt bạn khiến bạn vấp ngã, hãy ném nó đi. Thà bạn vào Nước Đức Chúa Trời với một mắt còn hơn có hai mắt mà bị ném vào Ghê-hen-na[a],
  rationale: Bản sửa giữ hình ảnh “vấp ngã” của σκανδαλίζῃ, lực mệnh lệnh của ἔκβαλε, thể bị động của βληθῆναι, và thuật ngữ Ghê-hen-na. Đồng thời, bản sửa loại bỏ ý thêm “đủ”, không áp đặt đại từ “con”, và dùng cấu trúc so sánh tiếng Việt tự nhiên, sát nguyên văn. Dấu phẩy cuối câu được giữ vì câu tiếp tục ở câu 48.
