source:
  edition: SBLGNT
  text: καὶ ἐὰν ὁ ὀφθαλμός σου σκανδαλίζῃ σε, ἔκβαλε αὐτόν· καλόν ⸀σέ ἐστιν μονόφθαλμον εἰσελθεῖν εἰς τὴν βασιλείαν τοῦ θεοῦ ἢ δύο ὀφθαλμοὺς ἔχοντα βληθῆναι εἰς ⸀τὴν ⸀γέενναν,
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/047.yaml
  text: And if your eye causes you to stumble[a], throw it out. It is better for you to enter the kingdom of God with one eye than, having two eyes, to be thrown into Gehenna,
translation:
  language: vi
  text: Nếu mắt bạn khiến bạn vấp ngã, hãy ném nó đi. Thà bạn vào Nước Đức Chúa Trời với một mắt còn hơn có hai mắt mà bị ném vào Ghê-hen-na[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “địa ngục.” Từ Hy Lạp là “Ghê-hen-na,” bắt nguồn từ tên Thung lũng Hin-nôm và được dùng để chỉ sự phán xét thời cuối cùng.
    reason: alternative_reading
lexical_decisions:
- source_word: σκανδαλίζῃ
  choice: khiến con vấp ngã
  rationale: Giữ hình ảnh ẩn dụ về sự vấp ngã trong động từ Hy Lạp, đồng thời không thu hẹp nghĩa chỉ còn việc phạm tội.
- source_word: ἔκβαλε
  choice: hãy ném nó đi
  rationale: Phản ánh trực tiếp sắc thái mạnh của mệnh lệnh ἐκβάλλω mà không thêm ý cụ thể như “móc” hay “móc bỏ”, vốn không nằm trong chính động từ.
- source_word: καλόν ... ἢ
  choice: thà ... còn hơn
  rationale: Diễn đạt tự nhiên cấu trúc so sánh của câu trong tiếng Việt, dù καλόν theo nghĩa đen là “tốt”.
- source_word: μονόφθαλμον
  choice: chỉ còn một mắt
  rationale: Truyền đạt hình ảnh “một mắt/chột mắt” bằng cách nói tự nhiên, rõ ràng và trang trọng trong tiếng Việt hiện đại.
- source_word: βασιλείαν τοῦ θεοῦ
  choice: vương quốc Đức Chúa Trời
  rationale: Cách dịch minh bạch, quen thuộc, giữ nguyên nội dung thần học và cấu trúc sở hữu của cụm từ Hy Lạp.
- source_word: βληθῆναι
  choice: bị ném
  rationale: Giữ thể bị động và lực của động từ βάλλω, đồng thời tạo sự tương ứng với mệnh lệnh “ném nó đi” ở đầu câu.
- source_word: γέενναν
  choice: Ghê-hen-na
  rationale: Phiên âm thuật ngữ địa danh-thần học cụ thể của tiếng Hy Lạp thay vì đồng nhất ngay với khái niệm khái quát “địa ngục”; chú thích cung cấp cách hiểu quen thuộc hơn.
theological_decisions:
- issue: Cách dịch γέεννα trong bối cảnh phán xét
  choice: Ghê-hen-na
  alternative: địa ngục
  rationale: Nguyên văn dùng thuật ngữ γέεννα, bắt nguồn từ Thung lũng Hin-nôm và mang ý nghĩa phán xét cánh chung. Giữ tên gọi này tránh hòa lẫn các từ vựng Kinh Thánh khác nhau về sự phán xét; cách dịch quen thuộc “địa ngục” được nêu trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “con” phù hợp với lời Đức Chúa Jêsus trực tiếp dạy môn đồ. Cấu trúc “thà… còn hơn…” chuyển tải tự nhiên phép so sánh; dấu phẩy cuối câu được giữ vì lời nói tiếp tục sang câu kế.
