  yaml_path: translation/nt/mark/009/036.yaml
  text: 'And taking a child[a], he set him in their midst, and taking him in his arms[b], he said to them:'
translation:
  language: vi
  text: 'Ngài đem một đứa trẻ đến, đặt nó đứng giữa các môn đồ[a], rồi ôm nó vào lòng[b] và nói với họ:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đặt nó ở giữa các môn đồ.” Động từ Hy Lạp có nghĩa là “làm cho đứng” và, trong văn cảnh này, cũng có thể được diễn đạt tự nhiên là “đặt”.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “ôm lấy nó.” Động từ Hy Lạp có thể chỉ việc ôm ai vào vòng tay hoặc ôm lấy người ấy.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λαβὼν
  choice: đem ... đến
  rationale: Phân từ bất định quá khứ của λαμβάνω mở đầu chuỗi hành động. Trong ngữ cảnh Chúa Giê-su đưa một đứa trẻ vào giữa nhóm, “đem ... đến” tự nhiên hơn “cầm/lấy” mà vẫn giữ ý tiếp nhận và đưa đến.
- source_word: παιδίον
  choice: một đứa trẻ
  rationale: Danh từ chỉ trẻ em, có thể là trẻ nhỏ, nhưng không nhất thiết phải nhấn mạnh sắc thái nhỏ tuổi hơn bằng “đứa trẻ nhỏ”.
- source_word: ἔστησεν
  choice: cho nó đứng
  rationale: Dạng gây khiến của ἵστημι ở đây có nghĩa cụ thể là làm cho hoặc bảo đứng. Cách dịch này giữ được tư thế đứng trong nguyên văn, thay vì khái quát hóa thành “đặt”.
- source_word: ἐν μέσῳ αὐτῶν
  choice: giữa các môn đồ
  rationale: Thành ngữ chỉ vị trí ở giữa một nhóm. “Các môn đồ” nêu rõ đối tượng của đại từ αὐτῶν theo văn cảnh tiếng Việt, tránh cách nói khó hiểu “giữa họ”.
- source_word: ἐναγκαλισάμενος
  choice: ôm nó vào lòng
  rationale: Động từ có thể chỉ ôm vào vòng tay hoặc ôm lấy. “Ôm ... vào lòng” diễn đạt tự nhiên, cụ thể cử chỉ trìu mến mà không thêm ý ngoài nguyên văn.
- source_word: εἶπεν αὐτοῖς
  choice: nói với họ
  rationale: Cách dịch trực tiếp và trung tính của λέγω với đối tượng gián tiếp.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Ngài” cho chủ thể Chúa Giê-su theo văn cảnh; dùng “nó” cho đứa trẻ phù hợp tiếng Việt tự nhiên, không suy định giới tính từ danh từ trung tính παιδίον. Cấu trúc chuỗi động tác được làm gọn bằng “rồi ... và” để câu trôi chảy.
