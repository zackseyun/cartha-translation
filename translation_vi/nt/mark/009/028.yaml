  text: καὶ ⸂εἰσελθόντος αὐτοῦ⸃ εἰς οἶκον οἱ μαθηταὶ αὐτοῦ ⸂κατ’ ἰδίαν ἐπηρώτων αὐτόν⸃· Ὅτι ἡμεῖς οὐκ ἠδυνήθημεν ἐκβαλεῖν αὐτό;
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/028.yaml
  text: And when he had entered the house[a], his disciples were asking him privately, “Why were we not able to cast it out?”
translation:
  language: vi
  text: 'Khi Đức Giê-su vào nhà, các môn đồ hỏi riêng Ngài: “Tại sao chúng con không thể đuổi nó ra?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể hiểu đại từ này chỉ cậu bé (“cậu ấy”); tuy nhiên, đại từ Hy Lạp ở giống trung nên tự nhiên hơn khi chỉ về thần ô uế.
    reason: alternative_reading
lexical_decisions:
- source_word: εἰσελθόντος αὐτοῦ
  choice: Khi Đức Giê-su vào
  rationale: Phân từ bất định trong kết cấu sở hữu cách tuyệt đối tạo bối cảnh thời gian. Tiếng Việt dùng “khi ... vào” tự nhiên và vẫn cho thấy hành động này xảy ra trước việc các môn đồ hỏi.
- source_word: εἰς οἶκον
  choice: vào nhà
  rationale: Danh từ không có mạo từ nhưng trong mạch truyện chỉ một địa điểm đã được xác định theo tình huống; tiếng Việt tự nhiên không cần thêm từ chỉ định.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: các môn đồ
  rationale: “Môn đồ” là cách dịch quen thuộc và chính xác trong văn cảnh Phúc Âm; quan hệ sở hữu đã rõ từ việc họ thưa với Đức Giê-su là “Ngài” và tự xưng “chúng con”.
- source_word: κατ’ ἰδίαν
  choice: hỏi riêng
  rationale: Diễn đạt việc hỏi tách khỏi người khác, ngắn gọn và tự nhiên trong tiếng Việt.
- source_word: ἐπηρώτων
  choice: hỏi
  rationale: Thể chưa hoàn thành có thể gợi hành động đang diễn ra, nhưng trong tiếng Việt kể chuyện, “hỏi” là tự nhiên; thêm “đang” hoặc “cứ” sẽ dễ nhấn mạnh quá mức.
- source_word: Ὅτι
  choice: Tại sao
  rationale: Trong câu nghi vấn này, ὅτι mang nghĩa hỏi nguyên nhân; “Tại sao” rõ ràng và thông dụng.
- source_word: ἡμεῖς οὐκ ἠδυνήθημεν
  choice: chúng con không thể
  rationale: Đại từ được nêu rõ trong tiếng Hy Lạp tạo sắc thái nhấn vào các môn đồ. “Chúng con” thể hiện đúng quan hệ khi thưa với Đức Giê-su, còn “không thể” diễn đạt khả năng bất thành.
- source_word: ἐκβαλεῖν
  choice: đuổi ... ra
  rationale: Trong văn cảnh trừ quỷ, “đuổi ra” chính xác, tự nhiên và ít cổ hơn “trục xuất” hay “đuổi quỷ” khi tân ngữ đã là đại từ.
- source_word: αὐτό
  choice: nó
  rationale: Đại từ giống trung, số ít tự nhiên quy chiếu đến thần ô uế/quỷ chứ không phải cậu bé giống đực. “Nó” giữ được đại từ mà không bổ sung danh từ không có trong câu.
theological_decisions:
- issue: Đối tượng quy chiếu của đại từ cuối câu αὐτό
  choice: Hiểu là thần ô uế/quỷ và dịch “nó”.
  alternative: Hiểu là cậu bé và dịch theo nghĩa “cậu ấy/em ấy”.
  rationale: Đại từ Hy Lạp ở giống trung phù hợp tự nhiên hơn với πνεῦμα (thần/linh, giống trung) hoặc δαιμόνιον (quỷ, giống trung), trong khi cậu bé là giống đực. Tuy vậy, vì tiếng Việt “nó” có thể theo ngữ cảnh quy chiếu đến cả người lẫn linh thể, chú thích nêu rõ điểm mơ hồ có thể được độc giả quan tâm mà không áp đặt thêm một kết luận thần học.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Đức Giê-su”, “Ngài”, “chúng con” để thể hiện quan hệ đối thoại kính trọng; dùng “môn đồ” theo thuật ngữ Kinh Thánh quen thuộc. Dấu chú thích [a] được đặt ngay sau câu có đại từ cần giải thích.
