source:
  edition: SBLGNT
  text: καὶ τὸν λόγον ἐκράτησαν πρὸς ἑαυτοὺς συζητοῦντες τί ἐστιν τὸ ἐκ νεκρῶν ἀναστῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/010.yaml
  text: And they kept the matter to themselves[b][a], discussing what it meant to rise from the dead.
translation:
  language: vi
  text: Họ giữ kín lời ấy[a], bàn luận với nhau xem “sống lại từ cõi chết”[b] nghĩa là gì.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “lời phán ấy” hoặc “điều ấy”.
    reason: lexical_alternative
  - marker: b
    text: 'Sát nghĩa hơn: “sống lại từ giữa những người chết”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸν λόγον
  choice: lời ấy
  rationale: Trong văn cảnh, λόγος chỉ lời Chúa Giê-su vừa phán ở câu 9. “Lời ấy” tự nhiên, cụ thể và giữ được mối liên hệ với phát ngôn trước đó.
- source_word: ἐκράτησαν πρὸς ἑαυτοὺς
  choice: giữ kín
  rationale: Cụm này cho biết họ giữ lời ấy trong phạm vi của mình, không nói ra cho người ngoài. “Giữ kín” diễn đạt tự nhiên ý kết hợp của động từ và cụm giới từ.
- source_word: συζητοῦντες
  choice: bàn luận với nhau
  rationale: Động từ diễn tả việc cùng trao đổi, tìm hiểu; cách dịch này không hàm ý tranh cãi gay gắt hơn mức bản văn cho phép.
- source_word: τί ἐστιν
  choice: nghĩa là gì
  rationale: Cách nói tự nhiên trong tiếng Việt khi các môn đồ đang cố hiểu nội dung của cụm từ vừa được nghe.
- source_word: τὸ ἐκ νεκρῶν ἀναστῆναι
  choice: “sống lại từ cõi chết”
  rationale: Diễn đạt rõ ràng, quen thuộc trong tiếng Việt và giữ nguyên nội dung phục sinh; chú thích bảo lưu sắc thái sát chữ của ἐκ νεκρῶν là ra khỏi giữa những người chết.
theological_decisions:
- issue: Ngôn ngữ phục sinh trong điều các môn đồ bàn luận
  choice: “sống lại từ cõi chết”
  alternative: “sống lại từ giữa những người chết”
  rationale: Bản dịch giữ nguyên sự khó hiểu của các môn đồ về lời Chúa Giê-su, không dùng sự hiểu biết thần học về sau để giải thích thay cho họ. Phương án chính tự nhiên trong tiếng Việt, còn chú thích ghi nhận cấu trúc sát nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dấu ngoặc kép làm rõ cụm từ mà các môn đồ đang cố tìm hiểu; câu không giải thích hộ sự bối rối của họ.
