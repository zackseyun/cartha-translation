  verdict: revise
  source_fidelity: 'Bản dịch nhìn chung bám sát câu Hy Lạp: καλόν là “tốt,” ἄναλον γένηται là “trở nên nhạt,” và mệnh lệnh giữ nguyên ẩn dụ “có muối.” Tuy nhiên, “làm cho nó mặn lại” diễn giải ἀρτύσετε theo hướng phục hồi độ mặn; “nêm nó” phản ánh trực tiếp hơn động từ “nêm” và vẫn giữ nghịch lý tu từ của nguyên văn.'
