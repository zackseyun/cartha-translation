  terminology: Giữ “muối,” “nhạt,” và “sống hòa thuận với nhau” là phù hợp. “Anh em” được dùng nhất quán để phản ánh ngôi số nhiều được hàm ý trong các động từ mệnh lệnh, không xác định thêm nội dung thần học cho ẩn dụ về muối.
