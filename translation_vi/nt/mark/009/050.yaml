  text: καλὸν τὸ ἅλας· ἐὰν δὲ τὸ ἅλας ἄναλον γένηται, ἐν τίνι αὐτὸ ἀρτύσετε; ἔχετε ἐν ἑαυτοῖς ⸀ἅλα, καὶ εἰρηνεύετε ἐν ἀλλήλοις.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/050.yaml
  text: Salt is good[a]; but if the salt becomes unsalty, with what will you season it? Have salt in yourselves[c][b], and be at peace with one another.
translation:
  language: vi
  text: Muối thì tốt; nhưng nếu muối trở nên nhạt, anh em sẽ lấy gì để nêm nó? Anh em hãy có muối trong anh em[a] và sống hòa thuận với nhau.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cụm từ “có muối trong anh em” giữ nguyên ẩn dụ của tiếng Hy Lạp. Có thể hiểu là duy trì sự thanh sạch, khôn ngoan, lòng trung tín với giao ước hoặc ảnh hưởng bảo tồn, nhưng bản văn không nói rõ một nghĩa duy nhất.
    reason: lexical_alternative
lexical_decisions:
- source_word: καλὸν
  choice: tốt
  rationale: Giữ lời đánh giá khái quát và tính cách ngôn của câu Hy Lạp, không thu hẹp nghĩa thành chỉ “hữu ích”.
- source_word: ἅλας / ἅλα
  choice: muối
  rationale: Dịch nhất quán danh từ và giữ nguyên ẩn dụ trong mệnh lệnh cuối câu.
- source_word: ἄναλον γένηται
  choice: trở nên nhạt
  rationale: Diễn đạt tự nhiên trạng thái mất vị mặn của muối; γένηται chỉ sự chuyển sang một trạng thái.
- source_word: ἐν τίνι αὐτὸ ἀρτύσετε
  choice: anh em sẽ lấy gì làm cho nó mặn lại?
  rationale: Trong ngữ cảnh này, ἀρτύω nói đến việc nêm hay làm cho có vị; cách dịch tiếng Việt giữ hình ảnh về muối và câu hỏi về phương tiện.
- source_word: ἔχετε ἐν ἑαυτοῖς ἅλα
  choice: hãy có muối trong chính mình
  rationale: Giữ sát mệnh lệnh và ẩn dụ chưa được giải thích của nguyên văn; “trong chính mình” phản ánh cụm đại từ phản thân.
- source_word: εἰρηνεύετε ἐν ἀλλήλοις
  choice: sống hòa thuận với nhau
  rationale: Diễn đạt tự nhiên một nếp sống liên tục trong quan hệ hỗ tương, đúng với mệnh lệnh hiện tại εἰρηνεύετε.
theological_decisions:
- issue: Ý nghĩa ẩn dụ của “muối” trong mệnh lệnh
  choice: 'Giữ nguyên ẩn dụ: “Hãy có muối trong chính mình”'
  alternative: Diễn giải là hãy có sự thanh sạch, khôn ngoan, trung tín với giao ước hoặc ảnh hưởng bảo tồn
  rationale: Bản văn không xác định rõ một ý nghĩa duy nhất; giữ ẩn dụ bảo toàn tính đa nghĩa và căng thẳng thần học của lời dạy.
- issue: Sắc thái của mệnh lệnh về hòa bình
  choice: “sống hòa thuận với nhau”
  alternative: “hãy hòa thuận với nhau” hoặc “hãy sống bình an với nhau”
  rationale: Cách chọn nhấn mạnh trạng thái và cách sống liên tục, không thêm một nội dung giáo lý ngoài nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “anh em” trong câu hỏi để làm rõ chủ thể số nhiều hàm ẩn trong động từ Hy Lạp; không lặp lại ở hai mệnh lệnh cuối vì tiếng Việt vẫn tự nhiên và rõ nghĩa.
