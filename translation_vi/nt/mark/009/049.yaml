- from: Vì mọi người sẽ được ướp bằng lửa[a][b].
  to: Vì mọi người sẽ được ướp muối bằng lửa[a][b].
  rationale: Sửa tối thiểu để biểu đạt rõ nghĩa từ vựng “muối” của ἁλίζω, đồng thời bảo toàn cấu trúc bị động tương lai và phép ẩn dụ chưa được giải nghĩa của câu Hy Lạp. Chú thích a giữ phương án từ vựng, còn chú thích b chuyển sang cách gọi tế lễ tự nhiên hơn mà không thay đổi nội dung dị bản.
