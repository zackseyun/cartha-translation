  text: For everyone will be salted with fire[a][b].
translation:
  language: vi
  text: Vì mọi người sẽ được ướp muối bằng lửa[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “mọi người sẽ được nêm muối bằng lửa.” Hình ảnh này có thể gợi đến sự phán xét, thanh luyện hoặc ngôn ngữ hiến tế; xem Lê-vi Ký 2:13.'
    reason: lexical_alternative
  - marker: b
    text: 'Một số thủ bản thêm: “và mọi lễ vật sẽ được ướp muối.”'
    reason: textual_variant
lexical_decisions:
- source_word: Πᾶς
  choice: mọi người
  rationale: Tính từ giống đực số ít ở chủ cách được dùng như danh từ; trong ngữ cảnh nói với và nói về con người, cách hiểu tự nhiên nhất là “mọi người”.
- source_word: γὰρ
  choice: Vì
  rationale: Giữ rõ chức năng giải thích, nối câu này với lời cảnh báo ngay trước đó.
- source_word: πυρὶ
  choice: bằng lửa
  rationale: Cách dịch này diễn đạt cách phương tiện nhưng vẫn không buộc hình ảnh phải chỉ mang nghĩa phán xét, thanh luyện hay hiến tế.
- source_word: ἁλισθήσεται
  choice: sẽ được ướp
  rationale: Động từ tương lai bị động ἁλίζω có nghĩa trực tiếp là ướp hoặc nêm bằng muối. “Được ướp” giữ được hình ảnh lạ và súc tích của nguyên văn mà không diễn giải nó đi.
theological_decisions:
- issue: Ý nghĩa của ẩn dụ “được ướp bằng lửa”
  choice: Giữ nguyên cách nói ẩn dụ, không xác định duy nhất đó là sự phán xét, thanh luyện, hiến dâng hay thử luyện trong đời môn đồ.
  alternative: Diễn giải thành “mọi người sẽ chịu lửa phán xét”, “được lửa thanh luyện” hoặc “được biệt riêng như một lễ vật có muối”.
  rationale: Câu Hy Lạp ngắn gọn và có tính gợi dẫn; ngữ cảnh cho phép nhiều lớp nghĩa liên hệ với nhau. Bản dịch vì thế giữ nguyên sức căng thần học thay vì chọn một cách giải thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Ướp bằng lửa” cố ý giữ hình ảnh gây sửng sốt của nguyên văn; “nêm” được nêu ở chú thích như một khả năng từ vựng tự nhiên khác.
