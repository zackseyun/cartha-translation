review_pass:
  verdict: revise
  source_fidelity: Bản nháp giữ đúng chủ ngữ bao quát của Πᾶς, liên từ giải thích γάρ, thì tương lai bị động, và hình ảnh nghịch thường của πυρὶ ἁλισθήσεται. Tuy nhiên, “ướp bằng lửa” trong tiếng Việt có thể hiểu là ướp/thấm gia vị bằng lửa và không biểu đạt rõ nét nghĩa “muối” vốn có trong ἁλίζω. “Ướp muối bằng lửa” truyền đạt đủ hơn phép nghịch hợp có chủ ý của nguyên văn mà không giải thích ẩn dụ.
  naturalness: “Vì mọi người sẽ được ướp muối bằng lửa” là tiếng Việt hiện đại, trang trọng và vẫn giữ độ gây ngạc nhiên của hình ảnh. Trong chú thích dị bản, “lễ vật” tự nhiên và chính xác hơn “sinh tế” đối với θυσία trong ngữ cảnh tế lễ.
  terminology: Dùng “ướp muối” để phản ánh trực tiếp ἁλίζω; giữ “lửa” không thêm diễn giải phán xét hay thanh luyện. “Lễ vật” là thuật ngữ phổ thông, rõ nghĩa cho θυσία. Tham chiếu “Lê-vi Ký 2:13” và các neo chú thích được giữ nguyên.
  issues:
  - severity: medium
    issue: “ướp bằng lửa” không nêu rõ nghĩa muối của ἁλίζω
    rationale: Động từ Hy Lạp có nghĩa là làm mặn/ướp muối. Tuy hình ảnh “bằng lửa” phải được giữ nguyên, cách nói hiện tại dễ làm mờ thành tố “muối” hơn bản gốc.
  - severity: low
    issue: “mọi sinh tế” trong chú thích dị bản kém tự nhiên
    rationale: “Mọi lễ vật” phù hợp hơn với cách dùng tiếng Việt hiện đại cho một vật được dâng trong tế lễ và tránh sắc thái thuật ngữ ít thông dụng.
