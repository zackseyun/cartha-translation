  text: Καὶ ⸂ἐλθόντες πρὸς τοὺς μαθητὰς εἶδον⸃ ὄχλον πολὺν περὶ αὐτοὺς καὶ γραμματεῖς συζητοῦντας ⸂πρὸς αὐτούς⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/014.yaml
  text: And when they came to the disciples[a], they saw a large crowd around them, and scribes arguing with them.
translation:
  language: vi
  text: Khi đến chỗ các môn đồ, họ thấy một đám đông lớn vây quanh các môn đồ, và các kinh sư đang tranh luận[a] với các môn đồ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “đang bàn luận với các môn đồ.” Động từ Hy Lạp có thể chỉ việc thảo luận hoặc tranh biện; trong bối cảnh này, có lẽ nó hàm ý tranh luận.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθόντες πρὸς τοὺς μαθητάς
  choice: Khi đến chỗ các môn đồ
  rationale: Phân từ bất định quá khứ ἐλθόντες diễn tả hành động xảy ra trước hoặc đồng thời dẫn vào động từ chính; mệnh đề thời gian “Khi đến” tự nhiên trong tiếng Việt. πρός với đối cách chỉ sự di chuyển đến chỗ một nhóm người.
- source_word: εἶδον
  choice: họ thấy
  rationale: Động từ bất định quá khứ của ὁράω được dùng theo lối kể chuyện đơn giản; “thấy” truyền đạt trực tiếp ý nghĩa.
- source_word: ὄχλον πολύν
  choice: một đám đông lớn
  rationale: ὄχλος chỉ đám đông, còn πολύς nói đến số lượng hoặc quy mô lớn; cách diễn đạt này rõ ràng và tự nhiên trong tiếng Việt hiện đại.
- source_word: περὶ αὐτούς
  choice: vây quanh các môn đồ
  rationale: περί với đối cách mang nghĩa không gian “ở quanh.” Lặp lại “các môn đồ” thay vì chỉ dùng “họ” giúp tránh nhầm lẫn với chủ thể số nhiều vừa xuất hiện trong câu.
- source_word: γραμματεῖς
  choice: các kinh sư
  rationale: γραμματεῖς là thuật ngữ chỉ những người thông thạo và giảng dạy Luật Do Thái; “kinh sư” là cách gọi ngắn gọn, quen thuộc trong văn phong Kinh Thánh tiếng Việt và giữ được bản sắc lịch sử của nhóm này.
- source_word: συζητοῦντας πρὸς αὐτούς
  choice: đang tranh luận[a] với họ
  rationale: Phân từ hiện tại cho thấy hành động đang diễn ra khi họ đến. συζητέω có thể chỉ thảo luận hoặc tranh biện; trong bối cảnh đối đầu này, “tranh luận” phù hợp hơn nhưng vẫn cần ghi nhận sắc thái rộng hơn trong chú thích. “Họ” ở đây quy chiếu về các môn đồ.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “các môn đồ” và “các kinh sư” để giữ thuật ngữ lịch sử quen thuộc; lặp lại “các môn đồ” một lần nhằm làm rõ đối tượng bị đám đông vây quanh.
