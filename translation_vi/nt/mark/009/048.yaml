  source_fidelity: 'Bản dịch giữ đúng cấu trúc và hình ảnh chính của nguyên văn: địa điểm được mô tả, “sâu/giòi” liên hệ với “họ,” sinh vật ấy không chết, và lửa không bị dập tắt. Tuy nhiên, “giòi bọ” cụ thể hóa σκώληξ theo hướng ấu trùng ăn xác hơn mức nguyên văn đòi hỏi; “sâu bọ” bao quát hơn và phù hợp hơn với tiếng vọng Ê-sai 66:24.'
  naturalness: “Nơi sâu bọ của họ không chết” là lối diễn đạt tự nhiên, trang trọng và quen thuộc trong văn cảnh Kinh Thánh tiếng Việt. “Lửa không bị dập tắt” rõ nghĩa, tự nhiên, và bảo toàn hình ảnh lửa không bị dập.
  terminology: Dùng “sâu bọ” thay cho “giòi bọ” để không thu hẹp nghĩa của σκώληξ. Giữ “Ê-sai” và cách diễn đạt không diễn giải trước bản chất của sự phán xét.
  issues:
