  yaml_path: translation/nt/mark/009/048.yaml
  text: where their worm does not die[b][a], and the fire is not quenched.
translation:
  language: vi
  text: nơi sâu bọ của họ không chết[a][b], và lửa không bị dập tắt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Câu này gợi lại Ê-sai 66:24.
    reason: cross_reference
  - marker: b
    text: 'Cũng có thể dịch: “nơi giòi bọ của họ không bao giờ hết, và lửa không tắt.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπου
  choice: nơi
  rationale: Đại từ trạng ngữ chỉ nơi chốn được chuyển tự nhiên và sát nghĩa bằng “nơi”.
- source_word: σκώληξ
  choice: giòi bọ
  rationale: Trong hình ảnh xác chết của Ê-sai 66:24, “giòi bọ” diễn đạt cụ thể và tự nhiên sinh vật ăn xác, đồng thời không xác định quá hẹp một loài.
- source_word: αὐτῶν
  choice: của họ
  rationale: Giữ quan hệ sở hữu/liên hệ trực tiếp của đại từ sở hữu số nhiều trong tiếng Hy Lạp mà không diễn giải thêm bản chất của hình phạt.
- source_word: οὐ τελευτᾷ
  choice: không chết
  rationale: τελευτάω có thể mang nghĩa “đi đến tận cùng” hoặc “chết”; với giòi bọ làm chủ ngữ, “không chết” là cách diễn đạt rõ, gọn và phù hợp với tiếng vọng từ Ê-sai.
- source_word: τὸ πῦρ
  choice: lửa
  rationale: Cách dịch trực tiếp, tự nhiên, giữ nguyên hình ảnh cụ thể.
- source_word: οὐ σβέννυται
  choice: không bị dập tắt
  rationale: Giữ thể bị động và trạng thái tiếp diễn của động từ Hy Lạp, thay vì biến thành một lời giải thích thần học.
theological_decisions:
- issue: Bản chất của hình ảnh phán xét
  choice: Giữ nguyên hình ảnh cụ thể về giòi bọ không chết và lửa không bị dập tắt.
  alternative: Diễn giải câu này theo hướng hình phạt có ý thức kéo dài, sự hủy diệt không thể đảo ngược, hoặc chỉ là ẩn dụ về ô nhục và ô uế.
  rationale: Bản văn gợi lại Ê-sai 66:24 nhưng tự nó không giải quyết toàn bộ tranh luận giáo lý về bản chất của hình phạt. Bản dịch vì thế bảo tồn sức căng và tính đa nghĩa của hình ảnh.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Giòi bọ” giữ sức mạnh cụ thể của hình ảnh trong bối cảnh Ê-sai; “không bị dập tắt” bảo toàn thể bị động của nguyên văn.
