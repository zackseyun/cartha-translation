    rationale: σκώληξ có thể chỉ sâu hoặc giòi trong ngữ cảnh này. Do câu gợi Ê-sai 66:24 và bản dịch chính cần giữ hình ảnh rộng, “sâu bọ” là lựa chọn an toàn hơn; “giòi bọ” có thể được nêu ở chú thích như một khả năng.
  - severity: low
    issue: Chú thích từ vựng dùng “không được dập tắt.”
    rationale: Trong tiếng Việt hiện đại, “không được” đôi khi gợi sắc thái cấm đoán. “Không bị dập tắt” tránh sự mơ hồ này và phản ánh trực tiếp hơn hình thức bị động của σβέννυται.
