source:
  edition: SBLGNT
  text: καὶ ἐπηρώτησεν τὸν πατέρα αὐτοῦ· Πόσος χρόνος ἐστὶν ὡς τοῦτο γέγονεν αὐτῷ; ὁ δὲ εἶπεν· ⸀Ἐκ παιδιόθεν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/021.yaml
  text: And he asked his father[a], “How long has this been happening to him?” And he said, “From childhood.”
translation:
  language: vi
  text: 'Ngài hỏi cha của đứa trẻ: “Chuyện này xảy ra với nó đã bao lâu rồi?” Ông đáp: “Từ thuở nhỏ.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπηρώτησεν
  choice: hỏi
  rationale: Động từ ở đây giới thiệu một câu hỏi trực tiếp, bình thường; “hỏi” tự nhiên và không thêm sắc thái tra vấn.
- source_word: τὸν πατέρα αὐτοῦ
  choice: cha của đứa trẻ
  rationale: Trong ngữ cảnh, αὐτοῦ chỉ đứa trẻ đang mắc chứng bệnh. Cách diễn đạt này làm rõ sở chỉ vốn dễ mơ hồ nếu dịch đơn thuần là “cha nó”.
- source_word: Πόσος χρόνος ἐστὶν ὡς
  choice: đã bao lâu rồi
  rationale: Thành ngữ Hy Lạp hỏi khoảng thời gian từ lúc sự việc bắt đầu cho đến hiện tại; cách dịch này tự nhiên trong tiếng Việt hiện đại.
- source_word: τοῦτο γέγονεν αὐτῷ
  choice: Chuyện này xảy ra với nó
  rationale: γέγονεν là dạng hoàn thành của γίνομαι và trong ngữ cảnh chỉ tình trạng đã khởi phát rồi tiếp diễn; kết hợp với “đã bao lâu rồi” truyền đạt được ý kéo dài mà không diễn giải quá mức.
- source_word: ὁ δὲ εἶπεν
  choice: Ông đáp
  rationale: δέ đánh dấu diễn tiến lời thoại; “đáp” gọn, tự nhiên và xác định người cha là người trả lời mà không nhấn mạnh sự tương phản.
- source_word: Ἐκ παιδιόθεν
  choice: Từ thuở nhỏ
  rationale: ἐκ cùng παιδιόθεν nêu điểm khởi đầu từ thời thơ ấu; “từ thuở nhỏ” vừa tự nhiên vừa giữ sắc thái nguồn khởi của cụm Hy Lạp.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Ngài” để nối tự nhiên với nhân vật Chúa Giê-su trong ngữ cảnh; dùng “đứa trẻ” để làm rõ sở chỉ của đại từ.
