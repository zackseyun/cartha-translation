  text: For whoever is not against us is for us[a].
translation:
  language: vi
  text: Vì ai không chống lại chúng ta thì đứng về phía chúng ta.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “vì chúng ta” hoặc “ủng hộ chúng ta.” Cụm từ Hy Lạp ὑπὲρ ἡμῶν có thể mang các nghĩa này.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς
  choice: ai
  rationale: Đại từ quan hệ được dùng theo nghĩa khái quát; “ai” tự nhiên trong tiếng Việt và giữ được phạm vi bất định.
- source_word: γὰρ
  choice: Vì
  rationale: γάρ nối câu này với lời trước như một lời giải thích; “Vì” diễn đạt rõ chức năng ấy.
- source_word: οὐκ ἔστιν
  choice: không ... là
  rationale: Giữ trực tiếp cấu trúc phủ định của động từ liên hệ, được diễn đạt tự nhiên trong toàn mệnh đề là “không chống lại”.
- source_word: καθ’ ἡμῶν
  choice: chống lại chúng ta
  rationale: κατά với sở hữu cách ở đây chỉ sự đối nghịch; “chống lại” rõ nghĩa và phù hợp văn cảnh.
- source_word: ὑπὲρ ἡμῶν
  choice: ủng hộ chúng ta
  rationale: ὑπέρ với sở hữu cách có thể chỉ việc đứng về phía hoặc hành động vì ai; “ủng hộ chúng ta” tạo thế đối xứng tự nhiên với “chống lại chúng ta” mà không mở rộng phạm vi thần học.
- source_word: ἐστιν
  choice: là
  rationale: Dịch trực tiếp động từ liên hệ, hoàn tất cấu trúc đối lập cân xứng.
theological_decisions:
- issue: Phạm vi của sự đứng về phía được diễn tả bằng “chống lại chúng ta” và “ủng hộ chúng ta”
  choice: Giữ nguyên ngôi thứ nhất số nhiều “chúng ta”, không giải rộng thành chống lại hay ủng hộ Đức Chúa Trời hoặc sứ mạng.
  alternative: “Ai không chống lại sứ mạng của chúng ta thì đứng về phía chúng ta” hoặc “Ai không chống lại Đức Chúa Trời thì ủng hộ Đức Chúa Trời.”
  rationale: Bản Hy Lạp nói rõ καθ’ ἡμῶν và ὑπὲρ ἡμῶν. Giữ cách nói quan hệ này bảo toàn độ căng và để văn cảnh xác định phạm vi.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “ủng hộ” để tạo cặp đối lập tự nhiên với “chống lại”; chú thích giữ các sắc thái khác của ὑπὲρ.
