  text: καὶ ⸂ἀπεκρίθη αὐτῷ εἷς ἐκ τοῦ ὄχλου⸃· Διδάσκαλε, ἤνεγκα τὸν υἱόν μου πρὸς σέ, ἔχοντα πνεῦμα ἄλαλον·
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/017.yaml
  text: And one from the crowd answered him[a], “Teacher, I brought my son to you, having a mute spirit.”
translation:
  language: vi
  text: 'Một người trong đám đông trả lời Ngài: “Thưa Thầy, tôi đã đem con trai tôi đến với Ngài; nó có một linh câm[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “một linh làm cho nó không nói được.”'
    reason: Cách diễn đạt này nêu rõ tác dụng được hàm ý trong ngữ cảnh của tính từ ἄλαλον (“câm”), trong khi bản văn chính giữ tính từ bổ nghĩa trực tiếp cho “linh”.
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: trả lời
  rationale: Giữ thành ngữ trần thuật quen thuộc của các sách Phúc Âm; trong ngữ cảnh, người này đáp lại câu hỏi trước đó của Chúa Giê-su.
- source_word: εἷς ἐκ τοῦ ὄχλου
  choice: một người trong đám đông
  rationale: Diễn đạt tự nhiên cấu trúc phân chia, đồng thời không thêm đặc điểm nào ngoài ý ‘một người’ trong đám đông.
- source_word: Διδάσκαλε
  choice: Thưa Thầy
  rationale: Cách xưng hô tự nhiên, trang trọng trong tiếng Việt, phản ánh chức năng giảng dạy của διδάσκαλος.
- source_word: ἤνεγκα
  choice: tôi đã đem
  rationale: Diễn đạt hành động đã xảy ra của thì aorist một cách tự nhiên trong tiếng Việt.
- source_word: τὸν υἱόν μου
  choice: con trai tôi
  rationale: Giữ rõ quan hệ cha-con và giới tính được nêu trực tiếp bởi υἱός.
- source_word: πρὸς σέ
  choice: đến với Ngài
  rationale: Phù hợp với πρός cộng đối cách sau động từ ‘đem’, đồng thời dùng đại từ kính trọng tự nhiên trong văn phong Kinh Thánh tiếng Việt.
- source_word: ἔχοντα πνεῦμα ἄλαλον
  choice: cháu bị một linh khiến cháu không nói được
  rationale: Phân từ ἔχοντα bổ nghĩa cho người con; cách diễn đạt này làm rõ tình trạng bị linh tác động mà không gán đặc tính ‘câm’ cho chính linh, vì ἄλαλος trong ngữ cảnh có thể chỉ hiệu quả linh gây ra.
theological_decisions:
- issue: Ý nghĩa của πνεῦμα trong bối cảnh trừ quỷ
  choice: một linh
  alternative: một tà linh / một quỷ
  rationale: Mạch văn cho thấy đây là một linh gây khổ sở, nhưng câu Hy Lạp chỉ nói πνεῦμα; không thêm ‘tà’ hay ‘quỷ’ để tránh giải thích vượt quá lời văn ngay tại câu này.
- issue: Phạm vi nghĩa của ἄλαλον
  choice: khiến cháu không nói được
  alternative: linh câm
  rationale: ἄλαλον về hình thức bổ nghĩa cho ‘linh’, nhưng có thể mô tả tác dụng của linh đối với cậu bé. Bản dịch chính truyền đạt ý tự nhiên trong tiếng Việt mà không biến tình trạng này thành một chẩn đoán y khoa.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” cho αὐτῷ/σέ và “Thưa Thầy” cho lời xưng hô; dùng “cháu” khi người cha nói về con mình để câu văn tự nhiên. Không thêm ‘tà’ hoặc ‘quỷ’ dù ngữ cảnh hàm ý đó.
