    rationale: Cụm này không phải cách nói tự nhiên, rõ ràng trong tiếng Việt hiện đại để diễn đạt οὐ βλέπεις εἰς πρόσωπον ἀνθρώπων; nó có thể bị hiểu là không nhìn hoặc tránh mặt người khác. Ngữ cảnh và thành ngữ Hy Lạp nói đến việc không xét người theo diện mạo, thân thế hay địa vị.
