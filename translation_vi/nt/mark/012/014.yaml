- from: 'Họ đến và nói với Đức Giê-su: “Thưa Thầy, chúng tôi biết Thầy là người chân thật và không vị nể bất cứ ai, vì Thầy không nhìn mặt người ta,[a] nhưng lấy sự thật mà dạy đường lối của Đức Chúa Trời. Có được phép nộp thuế thân[b] cho Sê-sa hay không? Chúng tôi nên nộp hay không nên nộp?”'
