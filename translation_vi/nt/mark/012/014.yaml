source:
  edition: SBLGNT
  text: ⸀καὶ ἐλθόντες λέγουσιν αὐτῷ· Διδάσκαλε, οἴδαμεν ὅτι ἀληθὴς εἶ καὶ οὐ μέλει σοι περὶ οὐδενός, οὐ γὰρ βλέπεις εἰς πρόσωπον ἀνθρώπων, ἀλλ’ ἐπ’ ἀληθείας τὴν ὁδὸν τοῦ θεοῦ διδάσκεις· ἔξεστιν ⸂δοῦναι κῆνσον Καίσαρι⸃ ἢ οὔ; δῶμεν ἢ μὴ δῶμεν;
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/014.yaml
  text: And they came and said to him[a], “Teacher, we know that you are truthful and do not care about anyone, for you do not look at the face of men, but truly teach the way of God. Is it lawful to pay the poll tax to Caesar or not? Should we pay it[b], or should we not pay it?”
translation:
  language: vi
  text: 'Họ đến và nói với Đức Giê-su: “Thưa Thầy, chúng tôi biết Thầy là người chân thật và không vị nể bất cứ ai, vì Thầy không xét người theo bề ngoài,[a] nhưng lấy sự thật mà dạy đường lối của Đức Chúa Trời. Có được phép nộp thuế thân[b] cho Sê-sa hay không? Chúng tôi nên nộp hay không nên nộp?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Theo nghĩa đen, “Thầy không nhìn vào khuôn mặt của người ta”; thành ngữ này có nghĩa là “không thiên vị ai” hoặc “không bị bề ngoài hay địa vị của người ta chi phối.”
    reason: lexical_alternative
  - marker: b
    text: Từ Hy Lạp κῆνσος chỉ sắc thuế kiểm kê dân số, tức thuế đầu người của La Mã.
    reason: cultural_note
lexical_decisions:
- source_word: Διδάσκαλε
  choice: Thưa Thầy
  rationale: Cách xưng hô tự nhiên, trang trọng trong tiếng Việt, giữ vai trò dạy dỗ của διδάσκαλος.
- source_word: ἀληθὴς
  choice: là người chân thật
  rationale: Diễn tả một người nói và hành động theo sự thật; tự nhiên hơn cách dịch trừu tượng chỉ là “thật”.
- source_word: οὐ μέλει σοι περὶ οὐδενός
  choice: không vị nể bất cứ ai
  rationale: Tránh nghĩa sai rằng Đức Giê-su không quan tâm đến người khác; truyền đạt đúng ý Ngài không bị con người hay địa vị của họ chi phối.
- source_word: οὐ ... βλέπεις εἰς πρόσωπον ἀνθρώπων
  choice: không nhìn mặt người ta
  rationale: Giữ hình ảnh cụ thể về “mặt” trong nguyên văn và đồng thời là lối nói tiếng Việt có thể gợi ý không xét theo thân thế hay địa vị.
- source_word: ἐπ’ ἀληθείας
  choice: lấy sự thật mà
  rationale: Bổ nghĩa cho hành động dạy, giữ sắc thái dạy một cách chân thật và phù hợp với sự thật.
- source_word: τὴν ὁδὸν τοῦ θεοῦ
  choice: đường lối của Đức Chúa Trời
  rationale: Giữ ẩn dụ “con đường” theo cách nói Kinh Thánh tự nhiên trong tiếng Việt.
- source_word: ἔξεστιν
  choice: Có được phép
  rationale: Thể hiện câu hỏi về điều được luật pháp hay nguyên tắc tôn giáo cho phép mà không áp đặt cụ thể đó là luật La Mã hay luật Môi-se.
- source_word: δοῦναι κῆνσον Καίσαρι
  choice: nộp thuế thân cho Sê-sa
  rationale: “Nộp” là động từ tự nhiên với thuế; “thuế thân” chỉ sắc thuế La Mã đánh trên từng người và giữ tính lịch sử cụ thể.
- source_word: Καίσαρι
  choice: Sê-sa
  rationale: Dùng dạng phiên âm quen thuộc trong tiếng Việt cho tước hiệu Caesar.
- source_word: δῶμεν ἢ μὴ δῶμεν
  choice: Chúng tôi nên nộp hay không nên nộp?
  rationale: Giữ sự lặp lại đầy dụng ý của động từ trong câu hỏi gài bẫy.
theological_decisions:
- issue: Thành ngữ về việc nhìn mặt và thiên vị
  choice: Giữ hình ảnh “không nhìn mặt người ta” trong chính văn, với chú thích giải nghĩa là không thiên vị hay bị địa vị bề ngoài chi phối.
  alternative: không thiên vị ai; không xét người theo bề ngoài
  rationale: Cách này bảo tồn hình ảnh của nguyên văn mà không biến câu thành một khẳng định sai rằng Đức Giê-su không quan tâm đến bất kỳ ai.
- issue: Phạm vi của ἔξεστιν
  choice: Có được phép
  alternative: Có hợp pháp; Luật có cho phép
  rationale: Nguyên văn không nói rõ tiêu chuẩn luật pháp nào đang được viện dẫn; bản dịch giữ nguyên độ mở giữa luật tôn giáo, luân lý và chính trị.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Giê-su,” “Đức Chúa Trời” và “Sê-sa” theo lối gọi quen thuộc; lời tâng bốc được diễn đạt tự nhiên nhưng vẫn giữ nhịp câu và sự căng thẳng của câu hỏi gài bẫy.
