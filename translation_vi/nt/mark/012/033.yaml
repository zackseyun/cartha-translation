language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ τὸ ἀγαπᾶν αὐτὸν ἐξ ὅλης ⸀τῆς καρδίας καὶ ἐξ ὅλης τῆς ⸀συνέσεως καὶ ἐξ ὅλης τῆς ἰσχύος καὶ τὸ ἀγαπᾶν τὸν πλησίον ὡς ἑαυτὸν ⸀περισσότερόν ἐστιν πάντων τῶν ὁλοκαυτωμάτων καὶ θυσιῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/033.yaml
  text: and to love him with all the heart and with all the understanding and with all the strength[a], and to love one’s neighbor as oneself, is more than all burnt offerings and sacrifices.
translation:
  language: vi
  text: và việc yêu Ngài với trọn tấm lòng, trọn sự hiểu biết và trọn sức lực, và yêu người lân cận như chính mình, thì có giá trị hơn tất cả các lễ thiêu toàn phần[a] và sinh tế.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “lễ thiêu”. Từ Hy Lạp ở đây chỉ cụ thể loại lễ vật được thiêu hoàn toàn trên bàn thờ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγαπᾶν
  choice: việc yêu
  rationale: Danh động từ có mạo từ được diễn đạt tự nhiên bằng “việc yêu”, giữ lực động từ và cấu trúc song song của hai lần ἀγαπᾶν.
- source_word: αὐτόν
  choice: Ngài
  rationale: Đại từ chỉ về Đức Chúa Trời trong văn cảnh trước; dùng đại từ thay vì đưa danh xưng vào câu, qua đó giữ sát cách diễn đạt của tiếng Hy Lạp.
- source_word: ἐξ ὅλης τῆς καρδίας
  choice: với trọn tấm lòng
  rationale: Diễn đạt sự tận hiến toàn vẹn từ nội tâm bằng tiếng Việt tự nhiên, trang trọng.
- source_word: συνέσεως
  choice: sự hiểu biết
  rationale: σύνεσις nói đến khả năng hiểu và nhận thức; “sự hiểu biết” chính xác hơn việc đồng nhất từ này đơn thuần với “tâm trí”.
- source_word: ἰσχύος
  choice: sức lực
  rationale: Diễn đạt toàn bộ năng lực hay sức mạnh của một người trong bối cảnh đạo đức này.
- source_word: πλησίον
  choice: người lân cận
  rationale: Danh từ số ít có nghĩa khái quát; “người lân cận” giữ được tính đại diện và phổ quát của lời dạy.
- source_word: ὡς ἑαυτόν
  choice: như chính mình
  rationale: Đại từ phản thân mang nghĩa khái quát, không chuyển câu sang lời trực tiếp ở ngôi thứ hai.
- source_word: περισσότερόν ἐστιν
  choice: thì quý hơn
  rationale: Truyền đạt rõ sự vượt trội về giá trị mà phép so sánh nêu ra, đồng thời tự nhiên trong tiếng Việt.
- source_word: πάντων τῶν ὁλοκαυτωμάτων καὶ θυσιῶν
  choice: tất cả các lễ thiêu toàn phần và sinh tế
  rationale: ὁλοκαύτωμα chỉ lễ vật bị thiêu hoàn toàn trên bàn thờ; “lễ thiêu toàn phần” giữ nét nghĩa chuyên biệt, còn “sinh tế” phân biệt loại tế lễ nói chung trong cặp từ này.
theological_decisions:
- issue: Mối quan hệ giữa các điều răn yêu thương và việc dâng tế lễ
  choice: Câu này khẳng định việc hết lòng yêu Đức Chúa Trời và yêu người lân cận có giá trị vượt hơn mọi lễ thiêu toàn phần và sinh tế.
  alternative: Hiểu câu này là tuyên bố bãi bỏ hoàn toàn hệ thống tế lễ.
  rationale: περισσότερόν ἐστιν nêu rõ sự vượt trội, nhưng bản văn không trực tiếp nói rằng toàn bộ hệ thống tế lễ bị bãi bỏ; bản dịch giữ nguyên sự căng thẳng thần học đó.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Cấu trúc “việc yêu… cùng yêu…” giữ hai động từ nguyên mẫu song song; “trọn” được lặp lại để làm nổi bật ý nghĩa toàn vẹn mà ὅλης diễn đạt.
