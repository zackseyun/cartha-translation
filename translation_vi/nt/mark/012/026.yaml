revisions:
- from: 'Còn về việc người chết được làm cho sống lại, các ông chưa đọc trong sách Môi-se, ở đoạn nói về bụi gai[a], Đức Chúa Trời đã phán với ông thế nào sao? Ngài phán: “Ta là Đức Chúa Trời của Áp-ra-ham, Đức Chúa Trời của Y-sác và Đức Chúa Trời của Gia-cốp.”'
  to: 'Còn về việc người chết được làm cho sống lại, các ông chưa đọc trong sách Môi-se, ở đoạn nói về bụi gai[a], Đức Chúa Trời đã phán với Môi-se thế nào sao? Ngài phán: “Ta là Đức Chúa Trời của Áp-ra-ham, Đức Chúa Trời của Y-sác và Đức Chúa Trời của Gia-cốp.”'
  rationale: Chỉ sửa “ông” thành “Môi-se” để giải quyết sự mơ hồ về người mà Đức Chúa Trời phán với. Giữ nguyên ý nghĩa, sắc thái bị động về sự sống lại, cấu trúc câu hỏi tu từ, tên riêng, và phép lặp nhấn mạnh của lời trích dẫn.
