id: MRK.12.26
reference: Mark 12:26
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: περὶ δὲ τῶν νεκρῶν ὅτι ἐγείρονται οὐκ ἀνέγνωτε ἐν τῇ βίβλῳ Μωϋσέως ἐπὶ τοῦ βάτου ⸀πῶς εἶπεν αὐτῷ ὁ θεὸς λέγων· Ἐγὼ ὁ θεὸς Ἀβραὰμ καὶ ⸂ὁ θεὸς Ἰσαὰκ καὶ ὁ⸃ θεὸς Ἰακώβ;
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/026.yaml
  text: And concerning the dead[a], that they are raised, have you not read in the book of Moses, in the passage about the bush, how God spoke to him, saying, ‘I am the God of Abraham and the God of Isaac and the God of Jacob’?”
translation:
  language: vi
  text: 'Còn về việc người chết được làm cho sống lại, các ông chưa đọc trong sách Môi-se, ở đoạn nói về bụi gai[a], Đức Chúa Trời đã phán với Môi-se thế nào sao? Ngài phán: “Ta là Đức Chúa Trời của Áp-ra-ham, Đức Chúa Trời của Y-sác và Đức Chúa Trời của Gia-cốp.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “tại bụi gai”; cụm từ Hy Lạp có thể dùng câu chuyện bụi gai để gọi tên phân đoạn Kinh Thánh này.'
    reason: lexical_alternative
lexical_decisions:
- source_word: περὶ δὲ τῶν νεκρῶν
  choice: Còn về việc người chết
  rationale: περί với sở hữu cách nêu chủ đề đang được bàn đến; δέ được chuyển bằng “Còn” để nối mạch và chuyển trọng tâm mà không nhấn mạnh sự tương phản quá mức.
- source_word: ὅτι ἐγείρονται
  choice: được làm cho sống lại
  rationale: Giữ sắc thái bị động của ἐγείρονται và diễn đạt tự nhiên rằng người chết nhận sự sống lại, thay vì tự mình trỗi dậy.
- source_word: οὐκ ἀνέγνωτε
  choice: các ông chưa đọc ... sao?
  rationale: Diễn đạt công thức câu hỏi tu từ của Chúa Giê-su bằng lối nói tự nhiên trong tiếng Việt hiện đại.
- source_word: ἐν τῇ βίβλῳ Μωϋσέως
  choice: trong sách Môi-se
  rationale: βίβλος có thể chỉ sách hoặc cuộn sách; “sách Môi-se” rõ nghĩa và tự nhiên trong ngữ cảnh viện dẫn Kinh Thánh.
- source_word: ἐπὶ τοῦ βάτου
  choice: ở đoạn nói về bụi gai
  rationale: Cụm từ xác định phân đoạn Kinh Thánh theo câu chuyện bụi gai, không nhất thiết chỉ địa điểm vật lý.
- source_word: πῶς εἶπεν αὐτῷ ὁ θεὸς λέγων
  choice: 'Đức Chúa Trời đã phán với ông thế nào sao? Ngài phán:'
  rationale: Giữ ý πῶς và lời dẫn trích dẫn λέγων, đồng thời tách thành hai câu để câu tiếng Việt sáng rõ, tự nhiên.
- source_word: Ἐγὼ ὁ θεὸς Ἀβραὰμ καὶ ὁ θεὸς Ἰσαὰκ καὶ ὁ θεὸς Ἰακώβ
  choice: Ta là Đức Chúa Trời của Áp-ra-ham, Đức Chúa Trời của Y-sác và Đức Chúa Trời của Gia-cốp
  rationale: Giữ động từ hiện tại “là” và sự lặp lại danh xưng “Đức Chúa Trời” như bản Hy Lạp để bảo toàn sức nhấn mạnh của lời trích dẫn.
theological_decisions:
- issue: Sắc thái bị động trong ngôn ngữ phục sinh ὅτι ἐγείρονται
  choice: được làm cho sống lại
  alternative: sống lại
  rationale: Cách chọn giữ dạng bị động, hàm ý sự sống lại được tác thành, nhưng không thêm lời xác định tác nhân ngoài điều bản văn nói.
- issue: Thì hiện tại và cấu trúc lặp trong lời Đức Chúa Trời tự xưng
  choice: Ta là Đức Chúa Trời của Áp-ra-ham, Đức Chúa Trời của Y-sác và Đức Chúa Trời của Gia-cốp
  alternative: Ta là Đức Chúa Trời của Áp-ra-ham, Y-sác và Gia-cốp
  rationale: Giữ “là” và ba lần lặp danh xưng vì chính cách diễn đạt của câu trích dẫn có vai trò trong lập luận của Chúa Giê-su; không diễn giải thêm kết luận thần học ngay trong câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “các ông” phù hợp với lời Chúa Giê-su nói trực tiếp với nhóm người đang tranh luận; dùng “phán” cho lời Đức Chúa Trời. Dấu chú thích [a] được đặt ngay sau “bụi gai”, là cụm từ mà chú thích giải thích.
