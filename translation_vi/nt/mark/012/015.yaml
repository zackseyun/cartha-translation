  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὁ δὲ εἰδὼς αὐτῶν τὴν ὑπόκρισιν εἶπεν αὐτοῖς· Τί με πειράζετε; φέρετέ μοι δηνάριον ἵνα ἴδω.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/015.yaml
  text: But knowing their hypocrisy[a], he said to them[b], “Why are you testing me? Bring me a denarius so that I may see it.”
translation:
  language: vi
  text: 'Nhưng Ngài biết sự giả hình của họ nên nói với họ: “Tại sao các ông thử tôi[b]? Hãy đem cho tôi một đồng đê-na-ri-út[a] để tôi xem.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Đê-na-ri-út là một đồng bạc La Mã, thường là tiền công của một ngày lao động.
    reason: cultural_note
  - marker: b
    text: 'Cũng có thể dịch: “cám dỗ tôi” hoặc “thử thách tôi.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰδὼς
  choice: biết
  rationale: Diễn đạt tự nhiên nhận thức rõ của Chúa Giê-su về động cơ của họ, không thêm ý vượt quá nguyên văn.
- source_word: ὑπόκρισιν
  choice: sự giả hình
  rationale: 'Giữ sắc thái đạo đức mạnh của từ Hy Lạp: vẻ chân thành bên ngoài che giấu ý định gài bẫy.'
- source_word: Τί
  choice: Tại sao
  rationale: Trong cấu trúc này, đại từ nghi vấn mang nghĩa trạng từ chỉ lý do; “Tại sao” là cách nói tự nhiên trong tiếng Việt.
- source_word: πειράζετε
  choice: thử
  rationale: Giữ nghĩa rộng của hành động thử hay dò xét với ý đối nghịch trong ngữ cảnh, đồng thời không thu hẹp ngay thành sự dụ dỗ phạm tội.
- source_word: φέρετέ
  choice: Hãy đem cho tôi
  rationale: Thể hiện rõ mệnh lệnh yêu cầu họ mang vật ấy đến cho Ngài.
- source_word: δηνάριον
  choice: một đồng đê-na-ri-út
  rationale: Giữ tên đồng tiền lịch sử thay vì khái quát hóa; chú thích giải thích giá trị văn hóa.
- source_word: ἵνα ἴδω
  choice: để tôi xem
  rationale: Diễn đạt tự nhiên mệnh đề mục đích; đối tượng được hiểu là đồng tiền vừa nhắc đến nên không cần lặp lại.
theological_decisions:
- issue: Sắc thái của πειράζετε trong lời quở trách của Chúa Giê-su
  choice: thử tôi
  alternative: cám dỗ tôi; thử thách tôi
  rationale: Ngữ cảnh cho thấy đây là hành động dò xét đầy ác ý nhằm gài bẫy Ngài. “Thử” giữ được phạm vi nghĩa của từ Hy Lạp, còn chú thích bảo lưu khả năng dịch “cám dỗ” mà không áp đặt sắc thái dụ dỗ phạm tội.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “Ngài” theo ngữ cảnh nói về Chúa Giê-su và “các người” để phản ánh lời đối chất trực tiếp. Các dấu chú thích được đặt cạnh đúng từ ngữ mà chú thích giải thích; vị trí dấu trong lớp tham khảo tiếng Anh không khớp với nội dung chú thích nên đã được hiệu chỉnh theo nội dung và nguyên văn.
