review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch phản ánh đúng các thành phần chính của nguyên văn: εἰδὼς là sự nhận biết của Chúa Giê-su, ὑπόκρισις là sự giả hình, πειράζετε là hành động thử/ngầm gài bẫy, và mệnh lệnh đem một đê-na-ri-út để Ngài xem. Dấu chú thích được neo đúng vào từ cần giải thích.'
  naturalness: Câu văn nhìn chung tự nhiên và trang trọng. Tuy nhiên, trong tiếng Việt hiện đại, “các người” khi đối thoại trực tiếp nghe khá gắt và kém thông dụng; “các ông” tự nhiên hơn trong bối cảnh những người nam đại diện đến chất vấn Chúa Giê-su, đồng thời vẫn giữ sắc thái đối chất.
  terminology: “Giả hình,” “đê-na-ri-út,” và “thử tôi” là những lựa chọn phù hợp. Chú thích về đê-na-ri-út nên nói rõ rằng đồng tiền này thường là mức tiền công cho một ngày lao động, thay vì diễn đạt như một tỷ giá tương đương.
  issues:
  - severity: low
    issue: Cách xưng hô “các người”
    rationale: Dù không sai và có thể biểu lộ lời quở trách, cách nói này ít tự nhiên hơn trong văn phong Việt ngữ hiện đại. “Các ông” phù hợp với ngữ cảnh trực tiếp và lịch sử của đoạn văn.
  - severity: low
    issue: Diễn đạt giá trị của đê-na-ri-út trong chú thích
    rationale: “Thường tương đương tiền công” có thể gợi ý một tỷ giá cố định. “Thường là tiền công của một ngày lao động” rõ hơn và sát ý chú thích nguồn.
  revised_text: 'Nhưng Ngài biết sự giả hình của họ nên nói với họ: “Tại sao các ông thử tôi[b]? Hãy đem cho tôi một đồng đê-na-ri-út[a] để tôi xem.”'
