  rationale: Chỉ điều chỉnh cách xưng hô để văn phong hiện đại tự nhiên hơn và làm rõ chú thích văn hóa. Nghĩa của bản văn, sắc thái đối chất của lời Chúa Giê-su, và tính mở của πειράζετε đều được giữ nguyên.
