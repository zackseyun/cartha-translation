  source_fidelity: 'Bản dịch truyền đạt đúng mạch câu Hy Lạp: họ đem đồng tiền đến; Đức Giê-su hỏi về hình và chữ khắc; họ trả lời là của Sê-sa. “Một đồng tiền” là cách bổ sung tân ngữ hàm ẩn hợp lý theo ngữ cảnh ngay trước đó, và chú thích nêu rõ tính hàm ẩn này. Cấu trúc “Hình này và dòng chữ là của ai?” diễn đạt tự nhiên câu hỏi sở hữu áp dụng cho cả hai yếu tố.'
