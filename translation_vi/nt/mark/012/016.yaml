base_translation:
  language: en
  yaml_path: translation/nt/mark/012/016.yaml
  text: And they brought one. And he says to them[a], “Whose image is this, and whose inscription?” And they said to him, “Caesar’s.”
translation:
  language: vi
  text: 'Họ bèn đem đến một đồng tiền[a]. Ngài hỏi họ: “Hình này và dòng chữ là của ai?” Họ đáp: “Của Sê-sa.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Họ đem nó đến.” Nguyên văn không nêu tân ngữ; theo ngữ cảnh trước, vật được đem đến là đồng đơ-ni-ê.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤνεγκαν
  choice: đem đến một đồng tiền
  rationale: Động từ có nghĩa là “đem/mang đến”; tân ngữ không được nêu trong câu Hy Lạp nhưng được hiểu từ ngữ cảnh trước là đồng đơ-ni-ê. Tiếng Việt thêm “một đồng tiền” để câu tự nhiên mà không lặp tên loại tiền.
- source_word: λέγει
  choice: hỏi
  rationale: Nội dung lời nói là một câu hỏi, nên “hỏi” diễn đạt tự nhiên hành động nói. Tiếng Việt không bắt buộc đánh dấu thì, vì vậy vẫn giữ được tính trực tiếp, sinh động của lối hiện tại lịch sử trong Mác.
- source_word: Τίνος
  choice: của ai
  rationale: Dạng sở hữu nghi vấn được chuyển thành cách hỏi tự nhiên trong tiếng Việt, áp dụng cho cả hình và dòng chữ.
- source_word: εἰκών
  choice: hình
  rationale: “Hình” là cách gọi rõ ràng, phổ thông đối với hình chân dung hoặc hình ảnh được đúc trên đồng tiền, đồng thời không diễn giải quá mức.
- source_word: ἐπιγραφή
  choice: dòng chữ
  rationale: Trong bối cảnh đồng tiền, từ này chỉ phần chữ được khắc hoặc đúc trên đó. “Dòng chữ” dễ hiểu và tự nhiên hơn thuật ngữ chuyên môn.
- source_word: Καίσαρος
  choice: của Sê-sa
  rationale: Dạng sở hữu trả lời trực tiếp câu hỏi “của ai”. “Sê-sa” giữ danh xưng/tên gọi quen thuộc trong tiếng Việt mà không thêm phần giải thích không có trong nguyên văn.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Bèn” nối tự nhiên với diễn biến trước; “Ngài” dùng để chỉ Đức Giê-su trong lời kể. Câu hỏi được cấu trúc gọn theo tiếng Việt nhưng vẫn giữ cả hai yếu tố “hình” và “dòng chữ” của nguyên văn.
