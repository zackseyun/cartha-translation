revisions:
- from: 'Ông vẫn còn một người nữa—người con trai yêu dấu.[a] Sau cùng, ông sai người con ấy đến với họ và nói: “Họ sẽ kính trọng con trai ta.”[b]'
  to: 'Ông vẫn còn một người con trai yêu dấu. Cuối cùng, ông sai người ấy đến với họ, nói rằng: “Họ sẽ kính trọng con trai ta.”[a]'
  rationale: Bản sửa làm câu mở đầu tự nhiên hơn và phản ánh trực tiếp cấu trúc “một … người con trai yêu dấu” của tiếng Hy Lạp. Các lựa chọn “Cuối cùng”, “nói rằng”, “kính trọng”, và “con trai ta” giữ nguyên ý nghĩa, giọng kể, cùng mức độ trang trọng của bản nháp. Chú thích về phạm vi nghĩa của ἐντρέπω được giữ lại và neo vào đúng từ liên quan.
