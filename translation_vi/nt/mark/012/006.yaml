base_translation:
  language: en
  yaml_path: translation/nt/mark/012/006.yaml
  text: He still had one[a], a beloved son. He sent him last to them, saying[c][b], ‘They will respect my son.’
translation:
  language: vi
  text: 'Ông vẫn còn một người con trai yêu dấu. Cuối cùng, ông sai người ấy đến với họ, nói rằng: “Họ sẽ kính trọng con trai ta.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Động từ Hy Lạp cũng có thể mang nghĩa “hổ thẹn trước” hoặc “tỏ lòng vị nể”; trong ngữ cảnh này, “kính trọng” phù hợp hơn.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔτι ἕνα εἶχεν
  choice: ông vẫn còn một người nữa
  rationale: Diễn đạt tự nhiên ý còn lại một người để sai đi sau các đầy tớ trước đó; “vẫn còn” giữ sắc thái của ἔτι, còn “một người nữa” làm rõ ἕνα trong mạch kể.
- source_word: υἱὸν ἀγαπητόν
  choice: người con trai yêu dấu
  rationale: “Yêu dấu” vừa trang trọng, dễ hiểu, vừa bảo toàn sức nặng của ἀγαπητός và âm vang về Người Con trong sách Mác mà không diễn giải thêm.
- source_word: ἀπέστειλεν αὐτὸν ἔσχατον πρὸς αὐτούς
  choice: Sau cùng, ông sai người con ấy đến với họ
  rationale: “Sau cùng” diễn đạt chức năng trạng từ của ἔσχατον và nhấn mạnh vị trí cao trào của người con trong chuỗi người được sai đến.
- source_word: λέγων ὅτι
  choice: và nói
  rationale: Dẫn vào lời nói trực tiếp một cách tự nhiên trong tiếng Việt.
- source_word: Ἐντραπήσονται
  choice: họ sẽ kính trọng
  rationale: Trong ngữ cảnh này, động từ chỉ việc tỏ lòng nể trọng hoặc vị nể trước một người; “kính trọng” là cách diễn đạt hiện đại, rõ nghĩa, đồng thời chú thích vẫn bảo lưu sắc thái liên quan đến hổ thẹn.
- source_word: τὸν υἱόν μου
  choice: con trai ta
  rationale: Giữ nguyên quan hệ sở hữu và cách xưng hô phù hợp với lời trực tiếp của chủ vườn nho trong văn phong dụ ngôn.
theological_decisions:
- issue: Âm vang Kitô học của cụm “người con trai yêu dấu”
  choice: Giữ nguyên “người con trai yêu dấu” trong chính văn mà không giải nghĩa thêm.
  alternative: “người con trai mà ông hết lòng yêu thương”
  rationale: Cụm từ tự nhiên gợi lại cách sách Mác trình bày Chúa Giê-su là Con yêu dấu, nhưng bản dịch không nên đưa phần diễn giải thần học vào chính văn.
- issue: Kỳ vọng của chủ vườn trong Ἐντραπήσονται
  choice: Dịch là “họ sẽ kính trọng”.
  alternative: “họ sẽ hổ thẹn trước” hoặc “họ sẽ vị nể”
  rationale: Ngữ cảnh ủng hộ ý những tá điền sẽ tỏ sự tôn trọng đối với người con, nhưng chú thích ghi nhận sắc thái hổ thẹn hoặc vị nể của động từ để không xóa bỏ độ rộng nghĩa.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dấu gạch ngang làm rõ quan hệ đồng vị giữa “một người nữa” và “người con trai yêu dấu”; lời thoại dùng “ta” để phù hợp với tư cách người chủ trong dụ ngôn.
