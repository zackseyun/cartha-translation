id: MRK.12.9
reference: Mark 12:9
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸀τί ποιήσει ὁ κύριος τοῦ ἀμπελῶνος; ἐλεύσεται καὶ ἀπολέσει τοὺς γεωργούς, καὶ δώσει τὸν ἀμπελῶνα ἄλλοις.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/009.yaml
  text: What will the owner of the vineyard do? He will come and destroy the tenant farmers[a], and give the vineyard to others.
translation:
  language: vi
  text: Chủ vườn nho sẽ làm gì? Ông sẽ đến, tiêu diệt những tá điền[a] và giao vườn nho cho những người khác.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “những người thuê canh tác” hoặc “những người trồng nho”; từ Hy Lạp chỉ người canh tác, và trong dụ ngôn này họ thuê vườn nho của chủ vườn.
    reason: lexical_alternative
lexical_decisions:
- source_word: τί ποιήσει
  choice: sẽ làm gì
  rationale: Diễn đạt trực tiếp đại từ nghi vấn τί cùng động từ tương lai ποιήσει, không thêm sắc thái nối kết vốn không có trong bản Hy Lạp.
- source_word: ὁ κύριος τοῦ ἀμπελῶνος
  choice: chủ vườn nho
  rationale: Trong thế giới của dụ ngôn, κύριος chỉ người sở hữu vườn nho. “Chủ vườn nho” tự nhiên, đúng ngữ cảnh và không áp đặt sắc thái tước hiệu thần học.
- source_word: ἀμπελῶνος / ἀμπελῶνα
  choice: vườn nho
  rationale: Cách dịch thông dụng, chính xác của ἀμπελών trong bối cảnh canh tác và dụ ngôn.
- source_word: ἐλεύσεται
  choice: Ông sẽ đến
  rationale: Giữ nguyên thì tương lai và hành động can thiệp trực tiếp của chủ vườn; đại từ “ông” là cách quy chiếu tự nhiên trong tiếng Việt.
- source_word: ἀπολέσει
  choice: tiêu diệt
  rationale: Thể hiện mức độ phán xét quyết liệt của ἀπόλλυμι mà không thu hẹp nghĩa nhất thiết thành hành động giết chết.
- source_word: τοὺς γεωργούς
  choice: những tá điền
  rationale: Trong dụ ngôn, γεωργοί là những người thuê và canh tác vườn của người khác, không chỉ là người làm nông nói chung. “Tá điền” giữ được quan hệ thuê canh.
- source_word: δώσει
  choice: giao
  rationale: Trong tiếng Việt, “giao vườn nho cho” diễn đạt tự nhiên hành động δίδωμι trong bối cảnh chuyển quyền quản lý, nhưng không xác định quá mức hình thức pháp lý.
- source_word: ἄλλοις
  choice: cho những người khác
  rationale: Giữ sự mở của ἄλλοις, không tự ý xác định họ là các tá điền khác dù ngữ cảnh có thể hàm ý như vậy.
theological_decisions:
- issue: Cách dịch κύριος khi đối tượng trực tiếp trong dụ ngôn không phải là một tước hiệu thần linh
  choice: chủ vườn nho
  alternative: chúa của vườn nho; ông chủ vườn nho
  rationale: Cụm từ chỉ người sở hữu vườn trong câu chuyện. Cách dịch “chủ vườn nho” cho phép ý nghĩa thần học rộng hơn của dụ ngôn xuất hiện từ ngữ cảnh, thay vì được đưa sẵn vào danh xưng.
- issue: Mức độ cụ thể của sự phán xét trong ἀπολέσει
  choice: tiêu diệt
  alternative: giết; làm cho diệt vong
  rationale: “Tiêu diệt” bảo tồn tính nghiêm khắc và độ rộng nghĩa của động từ, không buộc câu chỉ nói đến phương thức giết chết.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “chủ vườn nho” và đại từ “ông” để giữ mạch kể tự nhiên; “tá điền” ngắn gọn nhưng được giải thích trong chú thích vì có thể ít quen thuộc với một số độc giả.
