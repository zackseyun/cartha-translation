source:
  edition: SBLGNT
  text: ⸂ὁ δὲ⸃ Ἰησοῦς εἶπεν ⸀αὐτοῖς· ⸂Τὰ Καίσαρος ἀπόδοτε⸃ Καίσαρι καὶ τὰ τοῦ θεοῦ τῷ θεῷ. καὶ ⸀ἐξεθαύμαζον ἐπ’ αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/017.yaml
  text: But Jesus said to them[a], “Give back to Caesar the things that are Caesar’s, and to God the things that are God’s.” And they were utterly amazed at him.
translation:
  language: vi
  text: 'Nhưng Đức Giê-su nói với họ: “Hãy trả lại[a] cho Sê-sa những gì thuộc về Sê-sa, và cho Đức Chúa Trời những gì thuộc về Đức Chúa Trời.” Họ vô cùng kinh ngạc trước Đức Giê-su.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Hãy trao cho Sê-sa những gì thuộc về Sê-sa, và cho Đức Chúa Trời những gì thuộc về Đức Chúa Trời.” Động từ này có thể mang nghĩa “trả lại”, “hoàn trả” hoặc “trao điều phải trao”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπόδοτε
  choice: Hãy trả lại
  rationale: Động từ mệnh lệnh ἀποδίδωμι có thể mang nghĩa trả lại, hoàn lại hoặc trao điều phải trao. “Hãy trả lại” diễn đạt rõ ý trao cho người nhận điều thuộc về họ, nhưng không thu hẹp câu nói chỉ vào việc nộp thuế.
- source_word: Τὰ Καίσαρος ... Καίσαρι
  choice: cho Sê-sa những gì thuộc về Sê-sa
  rationale: Cụm mạo từ trung tính số nhiều đi với sở hữu cách chỉ những điều hoặc những gì thuộc về Sê-sa. Cách dịch này tự nhiên trong tiếng Việt và không thu hẹp phạm vi của câu.
- source_word: τὰ τοῦ θεοῦ ... τῷ θεῷ
  choice: cho Đức Chúa Trời những gì thuộc về Đức Chúa Trời
  rationale: Giữ nguyên cấu trúc song song có chủ ý với vế nói về Sê-sa và không giải thích thêm những gì thuộc về Đức Chúa Trời.
- source_word: ἐξεθαύμαζον
  choice: vô cùng kinh ngạc
  rationale: Động từ ἐκθαυμάζω có sắc thái nhấn mạnh mức độ kinh ngạc; thì chưa hoàn thành miêu tả phản ứng đang diễn ra của họ.
- source_word: ἐπ’ αὐτῷ
  choice: trước Đức Giê-su
  rationale: Với động từ chỉ sự kinh ngạc, ἐπί cộng tặng cách có thể nêu đối tượng hoặc căn nguyên của sự kinh ngạc. “Trước Đức Giê-su” là cách diễn đạt tiếng Việt tự nhiên, vẫn để ngỏ việc họ kinh ngạc về chính Người hay về lời đáp của Người.
- source_word: δὲ
  choice: Nhưng
  rationale: δέ đánh dấu sự chuyển ý nhẹ hoặc tương phản; “Nhưng” phù hợp với lời đáp của Đức Giê-su trong cuộc đối chất.
- source_word: εἶπεν αὐτοῖς
  choice: nói với họ
  rationale: Cách dịch trực tiếp, tự nhiên, không thêm sắc thái giải thích.
theological_decisions:
- issue: Mối quan hệ giữa bổn phận đối với chính quyền và bổn phận đối với Đức Chúa Trời
  choice: Dịch thẳng hai vế song song, không thêm một lý thuyết về quan hệ giữa tôn giáo và nhà nước.
  alternative: Hiểu câu này như sự tán thành mạnh mẽ quyền lực dân sự, hoặc như sự hạ thấp mang tính lật đổ đối với mọi đòi hỏi của Sê-sa.
  rationale: Câu nói xác nhận có những điều thuộc về Sê-sa và có những điều thuộc về Đức Chúa Trời, nhưng không trình bày đầy đủ một học thuyết chính trị. Bản dịch giữ nguyên sự căng thẳng và tính song song của nguyên văn.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “Sê-sa” làm danh hiệu quen thuộc trong bối cảnh La Mã. Lặp lại tên “Đức Giê-su” ở cuối câu để tránh đại từ tôn kính không có dấu hiệu tương ứng trong nguyên văn và để diễn đạt ἐπ’ αὐτῷ tự nhiên hơn.
