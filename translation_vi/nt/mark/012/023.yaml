review_pass:
  verdict: revise
  source_fidelity: 'Bản nháp truyền đạt đúng các thành tố chính của câu: sự sống lại, mệnh đề thời gian hướng tới tương lai, câu hỏi về người vợ, và lý do rằng bảy người đều có người phụ nữ ấy làm vợ. Tuy nhiên, “đã lấy ... làm vợ” thiên về biến cố kết hôn, trong khi ἔσχον ... γυναῖκα nói về tình trạng/quan hệ ‘có ... làm vợ’.'
  naturalness: “Bà ấy” có thể gợi tuổi tác hoặc lối xưng hô xã hội không được nguyên văn xác định. “Người phụ nữ ấy” trung tính, rõ quy chiếu và tự nhiên trong tiếng Việt hiện đại. Cụm “cả bảy người đều” có thể giản lược thành “bảy người đều” mà vẫn giữ ý bao quát.
  terminology: Giữ “sự sống lại” cho ἀνάστασις và “sống lại” cho ἀναστῶσιν là phù hợp với ngữ cảnh, cách dùng Kinh Thánh tiếng Việt hiện đại, và không thêm “từ cõi chết”. “Vợ” diễn đạt đúng γυνή trong cả hai chỗ.
  issues:
  - severity: medium
    issue: “đều đã lấy bà ấy làm vợ” dịch ἔσχον αὐτὴν γυναῖκα như một hành vi kết hôn.
    rationale: Thành ngữ Hy Lạp ở đây nêu quan hệ đã có—‘đã có người ấy làm vợ’—chứ không tập trung vào sự kiện ‘lấy’ hay kết hôn. Cách sửa bảo toàn sắc thái quan hệ của nguyên văn.
  - severity: low
    issue: “bà ấy” thêm sắc thái tuổi tác/xưng hô không có trong γυνή.
    rationale: Nguyên văn chỉ quy chiếu người phụ nữ đã nêu trong câu chuyện. “Người phụ nữ ấy” tránh hàm ý không cần thiết và vẫn giữ văn phong trang trọng, hiện đại.
  revised_text: Trong sự sống lại[a], khi họ sống lại, người phụ nữ ấy sẽ là vợ của ai trong số họ? Vì bảy người đều đã có người phụ nữ ấy làm vợ.
