source:
  edition: SBLGNT
  text: ἐν τῇ ἀναστάσει ⸂ὅταν ἀναστῶσιν⸃ τίνος αὐτῶν ἔσται γυνή; οἱ γὰρ ἑπτὰ ἔσχον αὐτὴν γυναῖκα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/023.yaml
  text: In the resurrection[a], when they rise, whose wife will she be? For the seven had her as wife.
translation:
  language: vi
  text: Trong sự sống lại[a], khi họ sống lại, người phụ nữ ấy sẽ là vợ của ai trong số họ? Vì bảy người đều đã có người phụ nữ ấy làm vợ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “Trong sự trỗi dậy, khi họ trỗi dậy.” Động từ Hy Lạp có nghĩa đen là “đứng dậy” hoặc “trỗi dậy”; ngữ cảnh cho thấy đây là sự sống lại.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνάστασις
  choice: sự sống lại
  rationale: Trong cuộc tranh luận với người Sa-đu-sê, danh từ này chỉ sự sống lại trong thời kỳ cuối cùng. “Sự sống lại” là cách diễn đạt tự nhiên, quen thuộc và không thêm cụm “từ cõi chết” vốn không có trong câu này.
- source_word: ὅταν ἀναστῶσιν
  choice: khi họ sống lại
  rationale: ὅταν với động từ ở thể giả định aorist tạo mệnh đề thời gian hướng về tương lai. Tiếng Việt cần dùng “sống lại” để diễn đạt tự nhiên ý phục sinh; chú thích cho biết nguyên văn sát hơn là “đứng dậy/trỗi dậy”.
- source_word: τίνος αὐτῶν
  choice: của ai trong số họ
  rationale: Cách này thể hiện cả đại từ nghi vấn ở sở hữu cách lẫn sắc thái phân chia của αὐτῶν, đồng thời tự nhiên trong tiếng Việt.
- source_word: ἔσται γυνή
  choice: bà ấy sẽ là vợ
  rationale: Cấu trúc vị ngữ hỏi bà sẽ có quan hệ làm vợ với người nào. Cách diễn đạt này giữ thời tương lai và tự nhiên trong tiếng Việt.
- source_word: γυνή
  choice: vợ
  rationale: Cả hai lần xuất hiện đều nằm trong ngữ cảnh hôn nhân, nên phải dịch là “vợ” chứ không phải nghĩa rộng hơn là “người phụ nữ”.
- source_word: οἱ γὰρ ἑπτὰ
  choice: vì cả bảy người
  rationale: γάρ nêu lý do cho câu hỏi. “Cả bảy người” truyền đạt rõ rằng mỗi người trong nhóm bảy đều có quan hệ hôn nhân với bà; “người” được thêm để tiếng Việt tự nhiên, trong khi ngữ cảnh trước xác định họ là bảy anh em.
- source_word: ἔσχον αὐτὴν γυναῖκα
  choice: đều đã lấy bà ấy làm vợ
  rationale: Thành ngữ ἔχω + tân ngữ + γυναῖκα nghĩa là có một người làm vợ. “Lấy ... làm vợ” là thành ngữ Việt tự nhiên; “đều” phân bố hành động cho cả bảy, còn “đã” phản ánh aorist.
theological_decisions:
- issue: Ngôn ngữ về sự sống lại trong cuộc tranh luận với người Sa-đu-sê
  choice: sự sống lại ... khi họ sống lại
  alternative: sự sống lại từ cõi chết ... khi họ trỗi dậy
  rationale: Bản dịch giữ lời khẳng định về sự sống lại trong tương lai nhưng không thêm “từ cõi chết,” là cụm không được nêu rõ trong câu. Việc lặp “sống lại” phản ánh sự lặp giữa danh từ ἀνάστασις và động từ ἀναστῶσιν.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “bà ấy” để chỉ người phụ nữ đã được nhắc đến, tránh sắc thái suồng sã; dùng “cả bảy người đều” để câu giải thích rõ và tự nhiên trong tiếng Việt.
