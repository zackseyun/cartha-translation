  to: Trong sự sống lại[a], khi họ sống lại, người phụ nữ ấy sẽ là vợ của ai trong số họ? Vì bảy người đều đã có người phụ nữ ấy làm vợ.
  rationale: Bản sửa duy trì sự lặp có chủ ý giữa ἀνάστασις và ἀναστῶσιν, giữ nguyên tính tương lai của câu hỏi, và diễn đạt ἔσχον ... γυναῖκα là quan hệ ‘có ... làm vợ’ thay vì một sự kiện kết hôn. Chú thích được điều chỉnh để phương án thay thế phản ánh nhất quán cả danh từ lẫn động từ Hy Lạp.
