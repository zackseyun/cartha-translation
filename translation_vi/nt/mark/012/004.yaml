  text: καὶ πάλιν ἀπέστειλεν πρὸς αὐτοὺς ἄλλον δοῦλον· ⸀κἀκεῖνον ⸀ἐκεφαλίωσαν καὶ ⸀ἠτίμασαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/004.yaml
  text: And again he sent another servant to them[c][b][a], and they struck him on the head and dishonored him.
translation:
  language: vi
  text: Rồi ông lại sai một đầy tớ khác[a] đến với họ; họ đánh vào đầu người ấy[b] và làm nhục người ấy[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “một nô lệ khác.” Từ Hy Lạp doulos có thể có nghĩa là “đầy tớ” hoặc “nô lệ,” tùy văn cảnh.
    reason: alternative_reading
  - marker: b
    text: Động từ hiếm ở đây chỉ hành vi bạo lực nhắm vào đầu; cũng có thể dịch là “làm người ấy bị thương ở đầu,” chứ không phải “chém đầu người ấy.”
    reason: lexical_alternative
  - marker: c
    text: Hay “đối xử nhục nhã với người ấy.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν
  choice: lại
  rationale: Diễn tả hành động được lặp lại trong chuỗi sự việc của dụ ngôn; “lại” tự nhiên và súc tích trong tiếng Việt.
- source_word: ἀπέστειλεν
  choice: ông sai
  rationale: Động từ aorist kể một sự việc đã xảy ra; trong quan hệ chủ–đầy tớ, “sai” tự nhiên hơn “gửi” và vẫn giữ ý cử người đi.
- source_word: πρὸς αὐτοὺς
  choice: đến với họ
  rationale: Sau động từ sai phái, πρὸς với đối cách chỉ hướng và người nhận; “đến với họ” là cách diễn đạt rõ ràng, tự nhiên.
- source_word: ἄλλον δοῦλον
  choice: một đầy tớ khác
  rationale: δοῦλος có thể chỉ đầy tớ hoặc nô lệ. Trong văn cảnh dụ ngôn, “đầy tớ” giữ rõ quan hệ lệ thuộc vào chủ mà vẫn tự nhiên đối với độc giả hiện đại; phương án “nô lệ” được ghi ở chú thích.
- source_word: κἀκεῖνον
  choice: người ấy
  rationale: Dạng rút gọn mang nghĩa “và cả người ấy”; cấu trúc tiếng Việt đã dùng liên từ “họ… và…”, nên “người ấy” giữ được đối tượng và mạch nối mà không nặng lời.
- source_word: ἐκεφαλίωσαν
  choice: đánh vào đầu người ấy
  rationale: Động từ hiếm này chỉ hành vi bạo lực nhắm vào đầu. Cách dịch tránh hiểu sai là chém đầu, đồng thời không quyết đoán quá mức giữa nghĩa đánh vào đầu và làm bị thương ở đầu.
- source_word: ἠτίμασαν
  choice: làm nhục người
  rationale: Động từ diễn tả việc đối xử khiến người khác chịu ô nhục hoặc bị khinh rẻ; “làm nhục” ngắn gọn, mạnh và tự nhiên trong tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “ông” cho chủ vườn theo chủ thể ngầm từ văn cảnh; dùng “người ấy” để tránh lặp đại từ gây tối nghĩa. Các dấu chú thích đặt ngay sau cụm từ tương ứng.
