  - severity: low
    issue: Cụm “làm nhục người” không tự nhiên và đại từ chỉ người chịu hành động chưa nhất quán.
    rationale: Đổi thành “làm nhục người ấy” giữ rõ đối tượng κἀκεῖνον và phù hợp với văn phong tiếng Việt hiện đại.
  - severity: low
    issue: Chú thích [c] dùng “với người,” hơi cụt và không nhất quán với văn bản chính.
    rationale: “Đối xử nhục nhã với người ấy” tự nhiên hơn và chỉ rõ đối tượng của cách hiểu thay thế.
