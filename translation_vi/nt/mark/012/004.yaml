  verdict: revise
  source_fidelity: Bản dịch chuyển tải đầy đủ trình tự lặp lại (πάλιν), việc sai một δοῦλος khác đến với nhóm người ấy, hành vi bạo lực nhắm vào đầu (ἐκεφαλίωσαν), và sự làm nhục (ἠτίμασαν). “Đánh vào đầu” là cách dịch thận trọng, phù hợp với tính hiếm và còn tranh luận của động từ Hy Lạp, không áp đặt nghĩa “chém đầu.”
  naturalness: Văn phong kể chuyện tự nhiên, rõ ràng. Tuy nhiên, “làm nhục người” thiếu tự nhiên và kém rõ đối tượng hơn “làm nhục người ấy.”
  terminology: “Đầy tớ” là lựa chọn có thể chấp nhận cho δοῦλος trong dụ ngôn này, với phương án “nô lệ” được lưu trong chú thích. “Làm nhục” truyền đạt tốt sắc thái làm mất danh dự/công khai hổ thẹn của ἠτίμασαν.
