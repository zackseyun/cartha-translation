source:
  edition: SBLGNT
  text: ⸀καὶ ἄλλον ἀπέστειλεν· κἀκεῖνον ἀπέκτειναν, καὶ πολλοὺς ἄλλους, ⸂οὓς μὲν δέροντες οὓς δὲ ἀποκτέννοντες⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/005.yaml
  text: And he sent another[a], and they killed that one; and many others—some they beat, and some they killed.
translation:
  language: vi
  text: Ông lại sai một đầy tớ khác đến; họ cũng giết người ấy. Ông còn sai nhiều người khác nữa—họ đánh người này, giết người kia.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄλλον
  choice: một đầy tớ khác
  rationale: Trong ngữ cảnh dụ ngôn, từ này chỉ một đầy tớ khác được chủ vườn sai đến. Thêm danh từ “đầy tớ” vốn được hiểu ngầm trong tiếng Hy Lạp giúp câu tiếng Việt rõ và tự nhiên.
- source_word: ἀπέστειλεν
  choice: ông lại sai ... đến
  rationale: “Sai ... đến” diễn đạt tự nhiên hành động chủ vườn phái đầy tớ đến; “lại” thể hiện diễn tiến tiếp nối trong chuỗi hành động.
- source_word: κἀκεῖνον
  choice: họ cũng giết người ấy
  rationale: “Cũng” bảo toàn sắc thái bổ sung của καί trong κἀκεῖνον, còn “người ấy” giữ lực chỉ định của ἐκεῖνον.
- source_word: ἀπέκτειναν
  choice: giết
  rationale: Diễn đạt trực tiếp mức độ bạo lực của động từ, không làm nhẹ nghĩa thành cách nói uyển chuyển.
- source_word: πολλοὺς ἄλλους
  choice: nhiều người khác nữa
  rationale: Cụm này chỉ thêm nhiều đầy tớ sau những người đã được kể; “nữa” thể hiện rõ ý bổ sung.
- source_word: οὓς μὲν ... οὓς δὲ
  choice: người này ... người kia
  rationale: Đây là lối phân phối tự nhiên trong tiếng Việt, cho biết các nhóm người khác nhau chịu những cách đối xử khác nhau.
- source_word: δέροντες
  choice: đánh
  rationale: “Đánh” giữ nghĩa rộng của δέρω mà không thu hẹp thành một hình thức trừng phạt chính thức như “đánh roi”.
- source_word: ἀποκτέννοντες
  choice: giết
  rationale: Động từ hữu hạn trong tiếng Việt diễn đạt tự nhiên phần tóm lược phân phối của phân từ Hy Lạp.
theological_decisions:
- issue: Cách diễn đạt mệnh đề tóm lược bằng phân từ
  choice: 'Dùng động từ hữu hạn theo kết cấu phân phối: “họ đánh người này, giết người kia.”'
  alternative: “đánh một số người và giết một số khác” hoặc “người thì bị đánh, người thì bị giết”
  rationale: Lựa chọn này giữ chủ thể hành động là những tá điền, bảo toàn sự phân phối giữa các nạn nhân và tạo câu tiếng Việt gọn, tự nhiên; đây là quyết định cú pháp, không nhằm giải quyết một vấn đề giáo lý.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Đại từ “ông” tiếp nối chủ vườn trong ngữ cảnh; “đầy tớ” được nêu rõ ở lần đầu để tránh đại từ thiếu tiền ngữ trong câu đứng riêng. Dấu gạch ngang giữ nhịp tóm lược mạnh của vế cuối.
