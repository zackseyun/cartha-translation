  source_fidelity: 'Bản dịch bảo toàn đúng trình tự và ý nghĩa của câu Hy Lạp: người chủ sai một đầy tớ khác, người ấy cũng bị giết; rồi sai nhiều người khác, trong số đó có người bị đánh và có người bị giết. Việc nêu rõ “đầy tớ” dựa trên tiền ngữ của dụ ngôn và không thêm ý nghĩa đáng kể. Cấu trúc “họ đánh người này, giết người kia” diễn đạt đúng tính phân phối của οὓς μὲν ... οὓς δὲ và giữ các tá điền làm chủ thể hành động.'
