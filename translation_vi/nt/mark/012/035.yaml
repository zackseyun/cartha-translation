id: MRK.12.35
reference: Mark 12:35
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Καὶ ἀποκριθεὶς ὁ Ἰησοῦς ἔλεγεν διδάσκων ἐν τῷ ἱερῷ· Πῶς λέγουσιν οἱ γραμματεῖς ὅτι ὁ χριστὸς υἱὸς ⸂Δαυίδ ἐστιν⸃;
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/035.yaml
  text: And Jesus answered and said[a], as he was teaching in the temple, “How do the scribes say that the Messiah is the son of David?”
translation:
  language: vi
  text: 'Khi đang giảng dạy trong đền thờ, Đức Giê-su lên tiếng: “Sao các kinh sư lại nói rằng Đấng Mê-si[a] là con của Đa-vít?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “Đấng Ki-tô.” Tước hiệu Hy Lạp Christos ở đây được dùng với nghĩa chỉ Đấng Mê-si.'
    reason: Giữ phương án dịch truyền thống của tước hiệu Χριστός và giải thích nghĩa trong ngữ cảnh.
lexical_decisions:
- source_word: ἀποκριθεὶς ... ἔλεγεν
  choice: lên tiếng
  rationale: ἀποκριθείς thường mang nghĩa đáp lời, nhưng ở đây không có câu hỏi trực tiếp ngay trước đó; “lên tiếng” diễn đạt tự nhiên việc Đức Giê-su phản ứng trước một quan niệm đang được bàn đến mà không tạo ra một câu hỏi ngầm.
- source_word: διδάσκων
  choice: khi đang giảng dạy
  rationale: Cụm này giữ sắc thái đồng thời và tiếp diễn của phân từ hiện tại, đồng thời tạo câu tiếng Việt tự nhiên.
- source_word: ἐν τῷ ἱερῷ
  choice: trong đền thờ
  rationale: ἱερόν chỉ toàn thể khu đền thờ chứ không riêng nơi thánh bên trong; “trong đền thờ” là cách diễn đạt chuẩn, dễ hiểu và không chi tiết hóa quá mức.
- source_word: Πῶς
  choice: Sao ... lại
  rationale: Trong câu hỏi tu từ này, “Sao ... lại” vừa tự nhiên trong tiếng Việt vừa giữ được sức chất vấn của Πῶς, mà không khẳng định quá mạnh rằng lời các kinh sư là bất khả dĩ.
- source_word: γραμματεῖς
  choice: các kinh sư
  rationale: “Kinh sư” là thuật ngữ lịch sử quen thuộc cho những người chuyên chép, nghiên cứu và giảng giải Kinh Thánh Do Thái; chính xác hơn cách diễn giải rộng “các thầy dạy luật”.
- source_word: ὁ χριστός
  choice: Đấng Mê-si
  rationale: Χριστός được dùng rõ ràng như một tước hiệu trong bối cảnh niềm mong đợi về Đấng được xức dầu; “Đấng Mê-si” giữ được bối cảnh Do Thái của cuộc tranh luận.
- source_word: υἱὸς Δαυίδ
  choice: con của Đa-vít
  rationale: Cách dịch này bám sát quan hệ được nêu trong tiếng Hy Lạp và không thêm từ “vua”, vốn không xuất hiện trong câu, đồng thời vẫn để ngỏ sắc thái chỉ dòng dõi hay tước hiệu.
theological_decisions:
- issue: Cách dịch tước hiệu Χριστός
  choice: Đấng Mê-si
  alternative: Đấng Ki-tô
  rationale: Trong câu này, Χριστός là tước hiệu thuộc bối cảnh mong đợi Đấng Mê-si, không phải tên riêng; phương án khác được giữ trong chú thích.
- issue: Quan hệ giữa Đấng Mê-si và Đa-vít
  choice: là con của Đa-vít
  alternative: thuộc dòng dõi Đa-vít
  rationale: Bản dịch giữ nguyên cách diễn đạt “con của Đa-vít” và sức căng thần học của câu hỏi, không giải thích trước rằng đây chỉ là quan hệ huyết thống hay một danh hiệu hoàng gia.
translation_notes:
  register: Văn phong hiện đại, trang trọng nhưng dễ hiểu. “Đức Giê-su” và “Đấng Mê-si” phù hợp lối gọi tôn kính thông dụng; câu hỏi “Sao ... lại” giữ giọng chất vấn tự nhiên mà không giải quyết trước lập luận sẽ được triển khai ở các câu tiếp theo.
