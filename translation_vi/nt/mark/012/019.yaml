  verdict: revise
  source_fidelity: 'Bản dịch phản ánh đúng cấu trúc luật được trích dẫn: người anh/em trai chết, để lại vợ và không có con; người anh/em còn sống phải lấy vợ ấy và gây dựng dòng dõi cho người đã chết. Tuy nhiên, cụm cuối “nối dõi cho anh em mình” có thể bị hiểu là nối dõi cho nhiều anh em, hoặc quy chiếu không đủ rõ đến người anh/em đã chết.'
