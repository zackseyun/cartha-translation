- from: '“Thưa Thầy, Môi-se đã viết cho chúng ta rằng: Nếu anh hay em trai của một người qua đời, để lại vợ mà không để lại con[a], thì người anh em của người đã chết phải lấy người vợ ấy và nối dõi cho anh em mình[b].”'
