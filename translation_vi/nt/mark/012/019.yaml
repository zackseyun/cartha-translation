source:
  edition: SBLGNT
  text: Διδάσκαλε, Μωϋσῆς ἔγραψεν ἡμῖν ὅτι ἐάν τινος ἀδελφὸς ἀποθάνῃ καὶ καταλίπῃ γυναῖκα καὶ ⸂μὴ ἀφῇ τέκνον⸃, ἵνα λάβῃ ὁ ἀδελφὸς αὐτοῦ τὴν ⸀γυναῖκα καὶ ἐξαναστήσῃ σπέρμα τῷ ἀδελφῷ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/019.yaml
  text: Teacher[a], Moses wrote for us that if someone's brother dies and leaves behind a wife and leaves no child[c][b], his brother should take the wife and raise up offspring for his brother.
translation:
  language: vi
  text: '“Thưa Thầy, Môi-se đã viết cho chúng ta rằng: Nếu anh hoặc em trai của một người qua đời, để lại vợ mà không để lại con[a], thì người anh em của người đã chết phải lấy người vợ ấy và gây dựng dòng dõi cho người anh em ấy[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Xem Phục Truyền Luật Lệ Ký 25:5 về luật Môi-se được nhắc đến ở đây.
    reason: cross_reference
  - marker: b
    text: 'Nguyên văn: “dựng dòng giống cho người anh em ấy,” một thành ngữ chỉ việc có con nối dõi theo nghĩa vụ hôn nhân với vợ của người anh em đã chết.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Διδάσκαλε
  choice: Thưa Thầy
  rationale: Cách xưng hô trực tiếp, tự nhiên và trang trọng với Chúa Giê-su; diễn đạt vai trò người dạy mà không thêm sắc thái quyền sở hữu.
- source_word: Μωϋσῆς ἔγραψεν ἡμῖν
  choice: Môi-se đã viết cho chúng ta
  rationale: Giữ tên riêng theo dạng quen dùng trong tiếng Việt và hiểu ἡμῖν là đối tượng được ban luật hay được hưởng ích lợi từ điều đã viết.
- source_word: ἐάν τινος ἀδελφὸς ἀποθάνῃ
  choice: Nếu anh hay em trai của một người qua đời
  rationale: Diễn đạt tự nhiên đại từ bất định τινος và giữ giới tính nam của ἀδελφός; “anh hay em trai” tránh sự mơ hồ do từ “anh em” có thể chỉ số nhiều trong tiếng Việt.
- source_word: καταλίπῃ γυναῖκα
  choice: để lại vợ
  rationale: Trong ngữ cảnh qua đời, καταλείπω chỉ việc người vợ còn sống sau người chồng; cách nói này gọn và tự nhiên trong tiếng Việt.
- source_word: μὴ ἀφῇ τέκνον
  choice: không để lại con
  rationale: Giữ dạng số ít của τέκνον; trong tiếng Việt, “con” không đánh dấu số và có thể mang nghĩa khái quát phù hợp.
- source_word: ἵνα λάβῃ ὁ ἀδελφὸς αὐτοῦ τὴν γυναῖκα
  choice: thì người anh em của người đã chết phải lấy người vợ ấy
  rationale: “Lấy” trong ngữ cảnh này tự nhiên mang nghĩa lấy làm vợ. Cụm “của người đã chết” làm rõ quy chiếu cần thiết trong tiếng Việt nhưng không thêm nhân vật mới.
- source_word: ἐξαναστήσῃ σπέρμα τῷ ἀδελφῷ αὐτοῦ
  choice: nối dõi cho anh em mình
  rationale: Đây là thành ngữ pháp lý về hôn nhân nối dõi. “Nối dõi” truyền đạt tự nhiên việc sinh con để duy trì dòng dõi của người anh em đã chết, thay vì dịch cứng σπέρμα là “hạt giống”.
theological_decisions:
- issue: Cách diễn đạt luật hôn nhân nối dõi
  choice: “phải lấy người vợ ấy và nối dõi cho anh em mình”
  alternative: “phải cưới góa phụ ấy và sinh con nối dõi cho người đã chết”
  rationale: Bản chọn giữ gần cấu trúc “lấy người vợ” và thành ngữ “gây dựng dòng giống,” đồng thời tránh đưa trực tiếp các từ “góa phụ” và “sinh con” vào chính văn dù chúng được ngữ cảnh hàm ý.
- issue: Các từ chỉ quan hệ thân tộc có giới tính
  choice: Giữ “anh hay em trai,” “vợ” và “người anh em”
  alternative: Dùng các cách nói trung tính như “anh chị em” hoặc “người phối ngẫu”
  rationale: Luật được trích dẫn nói rõ đến người nam, vợ của người ấy và anh/em trai; trung tính hóa sẽ làm mất thông tin có trong tiếng Hy Lạp.
- issue: Quy chiếu của người anh em ở mệnh đề cuối
  choice: Dịch “anh em mình,” để ngữ cảnh cho thấy đó là người đã chết
  alternative: Dịch tường minh “người anh em đã chết của mình”
  rationale: Tiếng Hy Lạp chỉ nói “cho anh em của mình”; bản dịch giữ độ hàm súc và không đưa phần giải nghĩa vào chính văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Dùng “Thưa Thầy” cho lời xưng hô kính trọng; dùng “qua đời” thay cho cách nói quá khẩu ngữ. Câu được sắp xếp lại vừa đủ để các quan hệ thân tộc rõ ràng trong tiếng Việt, nhưng vẫn giữ nội dung và sức căng pháp lý của nguyên văn.
