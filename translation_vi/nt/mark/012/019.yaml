  rationale: 'Chỉnh sửa chỉ nhằm làm rõ người nhận ích lợi của hành động ở mệnh đề cuối: đó là người anh/em đã chết. “Gây dựng dòng dõi” giữ được sắc thái thành ngữ của ἐξαναστήσῃ σπέρμα, còn chú thích cung cấp cách dịch sát hơn mà không thêm diễn giải vào chính văn.'
