  text: Καὶ ἔρχονται Σαδδουκαῖοι πρὸς αὐτόν, οἵτινες λέγουσιν ἀνάστασιν μὴ εἶναι, καὶ ⸀ἐπηρώτων αὐτὸν λέγοντες·
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/018.yaml
  text: And Sadducees came to him, who say there is no resurrection, and they began questioning him, saying,
translation:
  language: vi
  text: 'Những người Sa-đu-sê, là những người nói rằng không có sự sống lại, đến gặp Đức Giê-su và bắt đầu hỏi Người rằng:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Σαδδουκαῖοι
  choice: những người Sa-đu-sê
  rationale: Dùng tên gọi đã quen thuộc trong tiếng Việt, đồng thời thêm “những người” để diễn đạt tự nhiên danh từ số nhiều chỉ một nhóm người.
- source_word: ἀνάστασιν
  choice: sự sống lại
  rationale: Diễn đạt nghĩa phục sinh/sống lại từ cõi chết trong ngữ cảnh tranh luận, bằng thuật ngữ phổ thông và rõ ràng.
- source_word: ἐπηρώτων
  choice: bắt đầu hỏi
  rationale: Phản ánh dạng quá khứ chưa hoàn thành, gợi hành động hỏi đang được khởi sự hoặc tiếp diễn, phù hợp lớp tham khảo đã được kiểm định.
- source_word: πρὸς αὐτόν
  choice: đến gặp Đức Giê-su
  rationale: Đại từ chỉ Đức Giê-su theo văn cảnh; nêu tên giúp câu tiếng Việt rõ chủ thể quy chiếu mà không thay đổi nội dung.
theological_decisions:
- issue: Lập trường của người Sa-đu-sê về ἀνάστασις
  choice: nói rằng không có sự sống lại
  alternative: phủ nhận sự sống lại
  rationale: Giữ sát cấu trúc phát biểu của nguyên văn, không diễn giải thêm phạm vi hay hệ thống niềm tin của họ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ dấu hai chấm cuối câu vì lời chất vấn trực tiếp bắt đầu ở câu kế tiếp.
