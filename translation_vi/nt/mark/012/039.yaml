  register: Văn phong hiện đại, trang trọng và dễ hiểu. Bản dịch giữ cấu trúc mảnh câu của câu Hy Lạp vì đây là phần tiếp nối cú pháp từ câu trước; không tự ý thêm động từ như “ưa thích” vào riêng câu này.
