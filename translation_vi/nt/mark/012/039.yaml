  text: and the best seats in the synagogues and the places of honor at banquets[b][a],
translation:
  language: vi
  text: và những ghế danh dự trong các hội đường, cùng những chỗ danh dự tại các bữa tiệc.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay “những chỗ tốt nhất”; sát hơn với cách dùng trong bữa ăn thời cổ: “những chỗ nằm danh dự nhất.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: πρωτοκαθεδρίας
  choice: những ghế danh dự
  rationale: Danh từ này chỉ những chỗ ngồi có địa vị và thứ bậc cao nhất trong nơi hội họp. “Ghế danh dự” tự nhiên trong tiếng Việt hiện đại và diễn đạt rõ ý nghĩa xã hội của từ.
- source_word: συναγωγαῖς
  choice: các hội đường
  rationale: Trong ngữ cảnh này, từ này chỉ những nơi người Do Thái nhóm họp; “hội đường” là cách gọi chuẩn xác và quen thuộc trong tiếng Việt.
- source_word: πρωτοκλισίας
  choice: những chỗ danh dự
  rationale: Từ này chỉ những vị trí nằm hoặc ngồi được coi trọng nhất trong bữa ăn thời cổ. “Chỗ danh dự” truyền đạt rõ địa vị xã hội mà không buộc độc giả hiện đại phải hình dung cách nằm tựa quanh bàn.
- source_word: δείπνοις
  choice: các bữa tiệc
  rationale: Từ này có thể chỉ bữa tối hoặc bữa ăn trang trọng; trong ngữ cảnh nói về địa vị công khai, “bữa tiệc” diễn đạt tự nhiên và phù hợp.
- source_word: καὶ ... καὶ
  choice: và ... cùng
  rationale: Giữ cả hai liên từ để phản ánh cách nguyên văn nối tiếp những biểu hiện ham chuộng danh vọng, đồng thời dùng “cùng” ở vế sau cho câu tiếng Việt tự nhiên.
- source_word: ἐν ταῖς συναγωγαῖς ... ἐν τοῖς δείπνοις
  choice: trong các hội đường ... tại các bữa tiệc
  rationale: 'Giới từ ἐν được chuyển theo cách dùng tự nhiên trong tiếng Việt: “trong” đối với địa điểm và “tại” đối với một dịp xã hội.'
