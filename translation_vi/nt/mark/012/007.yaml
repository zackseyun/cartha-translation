  source_fidelity: 'Bản dịch giữ đúng trình tự và nội dung chính của câu Hy Lạp: sắc thái chuyển ý của δέ, nhóm γεωργοί, lời bàn nội bộ, người thừa kế, lời thúc giục giết người ấy, và kỳ vọng chiếm quyền thừa kế. Tuy nhiên, “giết nó” trong tiếng Việt hiện đại thường có sắc thái phi nhân hóa mạnh, không được biểu thị rõ bởi αὐτόν.'
