source:
  edition: SBLGNT
  text: ἐκεῖνοι δὲ οἱ γεωργοὶ ⸂πρὸς ἑαυτοὺς εἶπαν⸃ ὅτι Οὗτός ἐστιν ὁ κληρονόμος· δεῦτε ἀποκτείνωμεν αὐτόν, καὶ ἡμῶν ἔσται ἡ κληρονομία.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/007.yaml
  text: But those tenant farmers said to one another[a], ‘This is the heir. Come, let us kill him[b], and the inheritance will be ours.’
translation:
  language: vi
  text: 'Nhưng những người thuê vườn ấy nói với nhau[a]: “Đây là người thừa kế. Nào, chúng ta hãy giết người ấy, và gia tài sẽ thuộc về chúng ta[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hoặc “bảo nhau”.
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “và gia tài sẽ là của chúng ta”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκεῖνοι δὲ οἱ γεωργοὶ
  choice: Nhưng những người thuê vườn ấy
  rationale: δέ mang sắc thái chuyển ý tương phản nhẹ, còn ἐκεῖνοι được giữ bằng “ấy”. Trong ngữ cảnh dụ ngôn về vườn nho, γεωργοί chỉ những người thuê và canh tác vườn; “người thuê vườn” diễn đạt tự nhiên vai trò này mà không thêm diễn giải ẩn dụ.
- source_word: πρὸς ἑαυτοὺς εἶπαν
  choice: nói với nhau
  rationale: Cụm πρός với đại từ phản thân số nhiều diễn tả lời trao đổi trong nhóm. “Nói với nhau” giữ được tính tương hỗ và tự nhiên hơn “tự nhủ”.
- source_word: ὅτι
  choice: dấu hai chấm và lời nói trực tiếp
  rationale: ὅτι ở đây dẫn vào lời nói trực tiếp; dấu câu và ngoặc kép truyền đạt chức năng đó tự nhiên trong tiếng Việt.
- source_word: Οὗτός ἐστιν ὁ κληρονόμος
  choice: Đây là người thừa kế
  rationale: “Người thừa kế” là cách gọi pháp lý và gia đình thông dụng cho κληρονόμος; “đây” giữ tính chỉ định trực tiếp của Οὗτός.
- source_word: δεῦτε ἀποκτείνωμεν αὐτόν
  choice: Nào, chúng ta hãy giết nó
  rationale: δεῦτε là lời thúc giục, được diễn đạt bằng “Nào”; thể giả định ngôi thứ nhất số nhiều ἀποκτείνωμεν có chức năng khuyến nghị, nên dùng “chúng ta hãy giết”. “Nó” phản ánh đại từ chỉ người αὐτόν trong lời nói khinh miệt của các tá điền mà không thêm sắc thái pháp lý như “xử tử”.
- source_word: καὶ ἡμῶν ἔσται ἡ κληρονομία
  choice: và gia tài sẽ thuộc về chúng ta
  rationale: Cấu trúc sở hữu nhấn mạnh ἡμῶν được truyền đạt rõ bằng “thuộc về chúng ta”. “Gia tài” tự nhiên trong ngữ cảnh tài sản được thừa kế và không tự ý thêm “của nó”.
theological_decisions:
- issue: Cách dịch γεωργοί trong bối cảnh dụ ngôn
  choice: những người thuê vườn
  alternative: những người làm vườn; tá điền; những người trồng nho
  rationale: Nhân vật là những người nhận vườn từ chủ để canh tác, chứ không chỉ là người lao động nông nghiệp. Cách dịch này giữ quan hệ trách nhiệm với chủ vườn, vốn cần cho mạch dụ ngôn, nhưng không áp đặt cách giải nghĩa thần học.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Người thuê vườn” rõ nghĩa hơn từ Hán-Việt “tá điền”; “gia tài” phù hợp với κληρονομία trong lời nói trực tiếp. Các dấu chú thích [a], [b] đều được đặt trong chính văn.
