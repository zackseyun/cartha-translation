    rationale: αὐτόν chỉ là đại từ ngôi ba giống đực, không tự nó biểu thị sự khinh miệt. Trong tiếng Việt hiện đại, “nó” khi chỉ một người trưởng thành thường mang sắc thái miệt thị rõ; “người ấy” trung tính hơn.
  - severity: low
    issue: Chú thích a diễn đạt chưa tự nhiên và chưa phản ánh sát lựa chọn “said among themselves.”
    rationale: “Nói với nhau trong nhóm” thừa ý vì “với nhau” vốn đã chỉ phạm vi nhóm. “Bảo nhau” là một cách thay thế tự nhiên, giữ ý trao đổi nội bộ.
