revisions:
- from: 'Trong khi giảng dạy, Ngài phán: “Hãy coi chừng[a] các kinh sư thích mặc áo dài[b] đi lại và muốn được người ta chào hỏi nơi phố chợ,”'
  to: 'Trong khi giảng dạy, Ngài nói: “Hãy coi chừng[a] các kinh sư muốn đi lại trong áo choàng dài[b] và được chào hỏi ở các chợ,”'
  rationale: Sửa thuật ngữ y phục để tránh liên tưởng sai trong tiếng Việt hiện đại và làm rõ cấu trúc song song của lời cảnh báo. Các yếu tố còn lại—lời mệnh lệnh, thuật ngữ “kinh sư”, và mệnh đề xác định nhóm người có khuynh hướng phô trương—được giữ nguyên về nghĩa và sắc thái.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T09:21:53Z'
review_pass:
  verdict: revise
  source_fidelity: Bản dịch truyền đạt đúng lời cảnh báo, đối tượng là các kinh sư được mệnh đề quan hệ xác định, cùng hai biểu hiện tìm kiếm địa vị công khai. Tuy nhiên, “áo dài” dễ bị hiểu là trang phục Việt Nam đương đại hơn là στολαί, và cặp “thích … và muốn” làm yếu sự song song của một ý muốn chi phối cả hai hành động trong nguyên ngữ. “Trong khi giảng dạy, Ngài nói” giữ sát hơn bối cảnh ἐν τῇ διδαχῇ αὐτοῦ mà vẫn tự nhiên.
  naturalness: “Áo choàng dài” là cách gọi rõ ràng, tự nhiên và không gây liên tưởng sai về y phục. “Muốn đi lại trong … và được chào hỏi ở các chợ” mạch lạc, giữ được cấu trúc song song và sắc thái nơi công cộng của ἀγοραί.
  terminology: “Kinh sư” phù hợp với γραμματεῖς trong bối cảnh Phúc Âm. “Hãy coi chừng” phản ánh tốt βλέπετε ἀπό. Dùng “áo choàng dài” cho στολαῖ chính xác hơn “áo dài”; chú thích văn hóa được điều chỉnh theo thuật ngữ này.
  issues:
  - severity: medium
    issue: “Áo dài” có thể gây hiểu nhầm văn hóa.
    rationale: Trong tiếng Việt hiện đại, “áo dài” thường chỉ quốc phục/y phục Việt Nam, trong khi στολαί chỉ áo choàng ngoài dài, dễ thấy và biểu thị địa vị trong bối cảnh cổ đại.
  - severity: low
    issue: “thích … và muốn” không giữ rõ một cấu trúc ý muốn chung cho hai hành động.
    rationale: τῶν θελόντων chi phối cả “đi lại trong áo choàng dài” lẫn ý nhận lời chào. “Muốn … và được …” phản ánh trực tiếp hơn mà không thay đổi ý nghĩa.
  revised_text: 'Trong khi giảng dạy, Ngài nói: “Hãy coi chừng[a] các kinh sư muốn đi lại trong áo choàng dài[b] và được chào hỏi ở các chợ,”'
