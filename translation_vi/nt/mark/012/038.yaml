  text: Καὶ ⸂ἐν τῇ διδαχῇ αὐτοῦ ἔλεγεν⸃· Βλέπετε ἀπὸ τῶν γραμματέων τῶν θελόντων ἐν στολαῖς περιπατεῖν καὶ ἀσπασμοὺς ἐν ταῖς ἀγοραῖς
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/038.yaml
  text: And in his teaching he was saying[b][a], “Beware of the scribes who want to walk around in long robes and receive greetings in the marketplaces,”
translation:
  language: vi
  text: 'Trong khi giảng dạy, Ngài nói: “Hãy coi chừng[a] các kinh sư muốn đi lại trong áo choàng dài[b] và được chào hỏi ở các chợ,”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Hãy đề phòng các kinh sư” hoặc “Hãy cảnh giác với các kinh sư.”'
    reason: lexical_alternative
  - marker: b
    text: “Áo choàng dài” ở đây là loại áo ngoài dài, nổi bật, gắn với địa vị và sự tôn kính trong xã hội.
    reason: cultural_note
lexical_decisions:
- source_word: ἐν τῇ διδαχῇ αὐτοῦ
  choice: Trong khi giảng dạy
  rationale: Diễn đạt tự nhiên bối cảnh lời nói của Đức Giê-su, đồng thời giữ ý rằng lời cảnh báo được đưa ra trong hoạt động giảng dạy của Ngài.
- source_word: ἔλεγεν
  choice: Ngài phán
  rationale: Dùng lối kể trang trọng, tự nhiên trong văn bản Kinh Thánh tiếng Việt; ngữ cảnh đang thuật lại lời Ngài giảng dạy nên không cần diễn đạt nặng nề thể chưa hoàn thành của động từ.
- source_word: Βλέπετε ἀπὸ
  choice: Hãy coi chừng
  rationale: Thể hiện trực tiếp mệnh lệnh cảnh giác và ý đề phòng một nhóm người có đặc điểm được mô tả tiếp theo.
- source_word: γραμματέων
  choice: các kinh sư
  rationale: Đây là cách gọi ngắn gọn, quen thuộc trong bối cảnh Do Thái giáo, chỉ những người thông thạo và giảng giải Luật pháp.
- source_word: τῶν θελόντων
  choice: thích … và muốn
  rationale: Thể hiện khuynh hướng và ham muốn đặc trưng của những kinh sư được nói đến; cách tách hai động từ giúp câu tiếng Việt tự nhiên.
- source_word: ἐν στολαῖς περιπατεῖν
  choice: mặc áo dài đi lại
  rationale: στολαί là những áo ngoài dài, trang trọng; cách dịch giữ cả hành động đi lại công khai lẫn loại y phục biểu thị địa vị.
- source_word: ἀσπασμοὺς
  choice: được người ta chào hỏi
  rationale: Trong ngữ cảnh, họ muốn nhận những lời chào công khai mang tính kính trọng; thêm cấu trúc bị động làm rõ quan hệ ngữ pháp tự nhiên trong tiếng Việt.
- source_word: ἐν ταῖς ἀγοραῖς
  choice: nơi phố chợ
  rationale: ἀγοραί là những khu chợ đồng thời là nơi tụ họp công cộng; “phố chợ” truyền đạt cả sắc thái công khai lẫn bối cảnh buôn bán.
theological_decisions:
- issue: Phạm vi lời cảnh báo của Đức Giê-su đối với các kinh sư
  choice: Lời cảnh báo nhắm đến các kinh sư có đặc điểm ham phô trương địa vị được mệnh đề phía sau xác định.
  alternative: Hiểu đây là lời lên án toàn thể mọi kinh sư, không có ngoại lệ.
  rationale: Cụm phân từ τῶν θελόντων mô tả những kinh sư đang được cảnh báo. Bản dịch không thêm dấu phẩy tách phần mô tả, nhờ đó không biến câu thành lời kết án mặc nhiên đối với từng người thuộc cả nhóm.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Ngài phán” duy trì giọng kể tôn kính; “kinh sư” là thuật ngữ ngắn gọn, phổ biến; “phố chợ” gợi đúng không gian công cộng của ἀγορά. Các dấu chú thích [a], [b] được đặt ngay sau những cụm từ cần giải thích.
