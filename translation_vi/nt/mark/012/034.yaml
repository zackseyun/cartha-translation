source:
  edition: SBLGNT
  text: καὶ ὁ Ἰησοῦς ἰδὼν ⸀αὐτὸν ὅτι νουνεχῶς ἀπεκρίθη εἶπεν αὐτῷ· Οὐ μακρὰν εἶ ἀπὸ τῆς βασιλείας τοῦ θεοῦ. καὶ οὐδεὶς οὐκέτι ἐτόλμα αὐτὸν ἐπερωτῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/034.yaml
  text: And Jesus[a], seeing that he had answered wisely, said to him, “You are not far from the kingdom of God.” And no one any longer dared to question him.
translation:
  language: vi
  text: 'Đức Giê-su thấy ông trả lời sáng suốt thì nói với ông: “Ông không xa Nước Đức Chúa Trời.”[a] Không ai còn dám hỏi ngài nữa.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Ông ở gần Nước Đức Chúa Trời.” Tiếng Hy Lạp diễn tả sự gần gũi, chứ không nói rõ rằng ông đã bước vào Nước Đức Chúa Trời.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν
  choice: thấy
  rationale: Diễn đạt tự nhiên phân từ aorist trong cấu trúc quan sát dẫn đến lời nhận xét của Đức Giê-su, mà không làm nặng câu bằng lối dịch quá sát hình thức.
- source_word: νουνεχῶς
  choice: sáng suốt
  rationale: Từ này chỉ việc trả lời với sự hiểu biết và phán đoán đúng đắn; “sáng suốt” vừa tự nhiên vừa giữ sắc thái khen ngợi sự nhận thức của người đối thoại.
- source_word: ἀπεκρίθη
  choice: trả lời
  rationale: Tiếng Việt không cần dùng hình thức tương đương quá khứ hoàn thành; trật tự mệnh đề đã cho thấy câu trả lời xảy ra trước lời Đức Giê-su nói.
- source_word: Οὐ μακρὰν εἶ ἀπὸ
  choice: Ông không cách xa
  rationale: Giữ nguyên ẩn dụ về khoảng cách và không biến lời này thành lời khẳng định rằng người ấy đã bước vào vương quốc.
- source_word: βασιλείας τοῦ θεοῦ
  choice: vương quốc của Đức Chúa Trời
  rationale: Cách dịch quen thuộc, dễ hiểu, có thể bao hàm cả quyền trị vì lẫn phạm vi cai trị mà không thu hẹp nghĩa.
- source_word: οὐκέτι
  choice: còn ... nữa
  rationale: Cấu trúc tiếng Việt này thể hiện rõ ý từ thời điểm ấy trở đi hành động không tiếp diễn.
- source_word: ἐτόλμα
  choice: dám
  rationale: Truyền đạt trực tiếp ý thiếu can đảm hoặc không dám mạo hiểm tiếp tục đặt câu hỏi.
- source_word: ἐπερωτῆσαι
  choice: chất vấn
  rationale: Trong bối cảnh các câu hỏi có tính thử thách, “chất vấn” giữ được sắc thái mạnh hơn “hỏi” nhưng không nặng đến mức mang nghĩa thẩm vấn chính thức.
theological_decisions:
- issue: Vị thế của người kinh luật đối với sự cứu rỗi hoặc vương quốc
  choice: “Ông không cách xa vương quốc của Đức Chúa Trời”
  alternative: “Ông ở gần vương quốc của Đức Chúa Trời”
  rationale: Nguyên văn khẳng định sự gần gũi chứ không tuyên bố người ấy đã ở trong hay đã bước vào vương quốc. Cách dịch giữ nguyên sức căng thần học giữa lời khen về sự hiểu biết và việc chưa khẳng định sự thuộc về vương quốc.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Đức Giê-su”, “Đức Chúa Trời” và đại từ “ngài” nhất quán; “ông” tôn trọng người đối thoại mà không tạo sắc thái cổ.
