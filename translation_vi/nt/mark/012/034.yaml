    rationale: ἐπερωτῆσαι nghĩa cơ bản là hỏi/đặt câu hỏi. Bối cảnh cho phép thấy các câu hỏi có tính thử thách, nhưng bản dịch không cần mã hóa sắc thái đó thành một động từ mạnh hơn.
