id: MRK.12.21
reference: Mark 12:21
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ὁ δεύτερος ἔλαβεν αὐτήν, καὶ ἀπέθανεν ⸂μὴ καταλιπὼν⸃ σπέρμα, καὶ ὁ τρίτος ὡσαύτως·
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/021.yaml
  text: And the second took her[a], and died, leaving no offspring, and the third likewise.
translation:
  language: vi
  text: Người thứ hai lấy bà[a], rồi chết mà không để lại con cái; người thứ ba cũng vậy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay nói rõ hơn: “cưới bà làm vợ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δεύτερος
  choice: người thứ hai
  rationale: Tính từ thứ tự có mạo từ được dùng như danh từ. “Người thứ hai” tự nhiên trong tiếng Việt; không thêm “anh/em trai” vì từ đó chỉ được hàm ý qua ngữ cảnh.
- source_word: ἔλαβεν αὐτήν
  choice: lấy bà
  rationale: λαμβάνω có nghĩa cơ bản là “lấy/nhận”; trong ngữ cảnh tục nối dõi, cụm này chỉ việc lấy người góa phụ làm vợ. “Lấy bà” vừa giữ được cách diễn đạt của Hy Lạp vừa là lối nói hôn nhân tự nhiên trong tiếng Việt.
- source_word: ἀπέθανεν
  choice: chết
  rationale: Dịch trực tiếp động từ ἀποθνῄσκω, phù hợp với văn phong kể chuyện giản dị, không dùng cách nói giảm.
- source_word: μὴ καταλιπὼν
  choice: mà không để lại
  rationale: Phân từ bất định quá khứ với μή diễn tả hoàn cảnh hoặc kết quả đi kèm cái chết; cách dịch này tự nhiên và giữ rõ quan hệ với mệnh đề chính.
- source_word: σπέρμα
  choice: con cái
  rationale: Trong ngữ cảnh hôn nhân nối dõi, σπέρμα chỉ hậu duệ/con nối dõi chứ không phải “hạt giống” theo nghĩa đen. “Con cái” dễ hiểu và không thu hẹp thành đúng một người con.
- source_word: ὁ τρίτος ὡσαύτως
  choice: người thứ ba cũng vậy
  rationale: Giữ lối nói tỉnh lược của Hy Lạp; các hành động lặp lại được hiểu từ phần trước.
theological_decisions: []
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “bà” để chỉ người phụ nữ đã được nhắc đến; giữ cấu trúc tỉnh lược ở cuối câu và không bổ sung “người anh/em trai” vào bản văn.
