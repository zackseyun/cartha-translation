  terminology: “Con cái” diễn đạt đúng σπέρμα trong ngữ cảnh nối dõi, không mang nghĩa đen “hạt giống” và không thu hẹp thành một người con. Chú thích cho “lấy bà” nêu hợp lý cách diễn đạt tường minh hơn là “cưới bà làm vợ.”
