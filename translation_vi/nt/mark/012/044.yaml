source:
  edition: SBLGNT
  text: πάντες γὰρ ἐκ τοῦ περισσεύοντος αὐτοῖς ἔβαλον, αὕτη δὲ ἐκ τῆς ὑστερήσεως αὐτῆς πάντα ὅσα εἶχεν ἔβαλεν, ὅλον τὸν βίον αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/044.yaml
  text: For they all gave out of their abundance[a], but she, out of her poverty, put in everything she had—her whole livelihood.
translation:
  language: vi
  text: Vì tất cả những người kia đều lấy từ phần dư dật của mình mà bỏ vào; còn bà này thì lấy từ cảnh túng thiếu của mình mà bỏ vào tất cả những gì bà có—toàn bộ phương tiện sinh sống của bà.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “tất cả những gì bà có để sống.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντες
  choice: tất cả những người kia
  rationale: Chỉ chung những người dâng hiến giàu có vừa được nói đến, đồng thời giữ tính bao quát và làm rõ sự tương phản với góa phụ.
- source_word: γὰρ
  choice: Vì
  rationale: Giữ quan hệ giải thích với lời đánh giá ở câu trước.
- source_word: ἐκ τοῦ περισσεύοντος αὐτοῖς
  choice: lấy từ phần dư dật của mình
  rationale: Diễn đạt việc họ cho từ nguồn của cải vượt quá nhu cầu, vừa sát nghĩa vừa tự nhiên trong tiếng Việt.
- source_word: ἔβαλον / ἔβαλεν
  choice: bỏ vào
  rationale: Trong bối cảnh hòm dâng hiến, cụm này giữ hình ảnh cụ thể của hành động đặt tiền vào và phản ánh cùng một động từ Hy Lạp ở cả hai vế.
- source_word: αὕτη δὲ
  choice: còn bà này
  rationale: Giữ nét tương phản của δέ và đại từ chỉ định αὕτη, không thêm ý nhấn mạnh không có trong nguyên văn.
- source_word: ἐκ τῆς ὑστερήσεως αὐτῆς
  choice: dù túng thiếu
  rationale: ὑστέρησις diễn tả tình trạng thiếu thốn. Cách nói này tự nhiên trong tiếng Việt và làm rõ nghịch cảnh từ đó bà đã dâng, dù chuyển cấu trúc 'từ sự thiếu thốn' thành mệnh đề nhượng bộ.
- source_word: πάντα ὅσα εἶχεν
  choice: tất cả những gì mình có
  rationale: Giữ trọn tính toàn diện và nhấn mạnh của cụm Hy Lạp.
- source_word: ὅλον τὸν βίον αὐτῆς
  choice: toàn bộ phương tiện sinh sống của bà
  rationale: Trong ngữ cảnh tiền bạc, βίος chỉ những gì bảo đảm đời sống hay kế sinh nhai, chứ không nhất thiết là sự sống sinh học.
theological_decisions:
- issue: Ý nghĩa của βίος trong lời nói về lễ dâng của góa phụ
  choice: phương tiện sinh sống
  alternative: cả cuộc đời của bà
  rationale: Ngữ cảnh nói về tiền dâng và βίος có thể chỉ phương tiện duy trì cuộc sống. Cách dịch này giữ sức nặng của việc bà dâng hết những gì nuôi sống mình mà không khẳng định rằng bà đã hiến sự sống sinh học ngay lúc đó.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dấu gạch ngang giữ phần giải thích nhấn mạnh ở cuối câu; đại từ “bà” phù hợp với góa phụ trong văn cảnh.
