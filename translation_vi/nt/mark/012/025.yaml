id: MRK.12.25
reference: Mark 12:25
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὅταν γὰρ ἐκ νεκρῶν ἀναστῶσιν, οὔτε γαμοῦσιν οὔτε ⸀γαμίζονται, ἀλλ’ εἰσὶν ὡς ⸀ἄγγελοι ἐν τοῖς οὐρανοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/025.yaml
  text: For when they rise from the dead[a], they neither marry nor are given in marriage, but are like angels in heaven.
translation:
  language: vi
  text: Vì khi sống lại từ cõi chết, họ không cưới vợ cũng không được gả chồng, nhưng giống như các thiên sứ ở trên trời.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “trong các trời”; tiếng Hy Lạp dùng số nhiều.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν γὰρ
  choice: Vì khi
  rationale: “Vì” giữ chức năng giải thích của γάρ trong lập luận, còn “khi” diễn đạt ý thời gian của ὅταν.
- source_word: ἐκ νεκρῶν ἀναστῶσιν
  choice: sống lại từ cõi chết
  rationale: Cách diễn đạt tự nhiên trong tiếng Việt, đồng thời giữ thể chủ động của ἀναστῶσιν và ý đi ra khỏi tình trạng chết.
- source_word: οὔτε γαμοῦσιν οὔτε γαμίζονται
  choice: không cưới vợ cũng không được gả chồng
  rationale: Giữ cấu trúc tương liên “không… cũng không…” và phân biệt động từ chủ động γαμοῦσιν với dạng bị động γαμίζονται, thay vì gộp cả hai thành một cách nói chung về hôn nhân.
- source_word: ἀλλ’ εἰσὶν
  choice: nhưng
  rationale: Diễn đạt trực tiếp sự tương phản giữa đời sống phục sinh và nếp hôn nhân hiện tại; động từ “là” được thể hiện tự nhiên trong cụm vị ngữ “giống như”.
- source_word: ὡς ἄγγελοι
  choice: giống như các thiên sứ
  rationale: “Giống như” thể hiện sự so sánh của ὡς, không hàm ý người sống lại trở thành thiên sứ.
- source_word: ἐν τοῖς οὐρανοῖς
  choice: ở trên trời
  rationale: Đây là cách nói tự nhiên trong tiếng Việt cho địa điểm được chỉ bởi cụm Hy Lạp; số nhiều của οὐρανοῖς được ghi nhận trong chú thích.
theological_decisions:
- issue: Bản chất của sự so sánh với các thiên sứ
  choice: Người sống lại giống các thiên sứ về phương diện không kết hôn.
  alternative: Người sống lại trở thành thiên sứ.
  rationale: Tiểu từ so sánh ὡς chỉ sự tương đồng chứ không xác định đồng nhất về bản thể; “giống như” giữ đúng giới hạn của câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Cưới vợ… được gả chồng” giữ sự đối xứng cùng khác biệt chủ động–bị động của nguyên văn. Dấu chú thích được đặt sau “trời,” là vị trí tương ứng với nội dung chú thích.
