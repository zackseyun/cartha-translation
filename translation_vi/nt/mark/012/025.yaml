revisions:
- from: Vì khi sống lại từ cõi chết, họ không cưới vợ cũng không được gả chồng, nhưng giống như các thiên sứ ở trên trời.[a]
  to: Vì khi sống lại từ cõi chết, họ không cưới vợ cũng không được gả chồng, nhưng giống như các thiên sứ ở trên trời.[a]
  rationale: Giữ nguyên bản văn vì bản văn trung thành với tiếng Hy Lạp và tự nhiên trong tiếng Việt. Chỉ sửa chú thích để phản ánh chính xác số nhiều của οὐρανοῖς, không thêm ý “các tầng trời.”
  reviewer_model: gpt-5.6-terra
