review_pass:
  verdict: revise
  source_fidelity: Bản dịch truyền đạt đúng lực giải thích của γάρ (“Vì”), thời điểm phục sinh, thể chủ động của ἀναστῶσιν, cặp phủ định οὔτε…οὔτε, và sự so sánh (không đồng nhất) với các thiên sứ. “Cưới vợ… được gả chồng” giữ được, theo cách nói tiếng Việt thông dụng, sự phân biệt giữa γαμοῦσιν và thể bị động γαμίζονται. Tuy nhiên, chú thích hiện diễn giải số nhiều của οὐρανοῖς thành “các tầng trời,” một khái niệm không có trong câu Hy Lạp.
  naturalness: Câu văn hiện đại, rõ ràng và phù hợp văn phong Kinh Thánh tiếng Việt. “Sống lại từ cõi chết” và “ở trên trời” là các cách diễn đạt tự nhiên. Không cần sửa thân câu.
  terminology: “Thiên sứ” phù hợp với ἄγγελοι; “giống như” bảo toàn giá trị so sánh của ὡς. Chú thích cần dùng “các trời” thay vì “các tầng trời” để không thêm sắc thái vũ trụ học/không gian tầng lớp.
  issues:
  - severity: medium
    issue: Chú thích thêm từ “tầng” vào nghĩa số nhiều của οὐρανοῖς.
    rationale: Nguyên văn chỉ dùng danh từ số nhiều “các trời/các thiên giới” trong thành ngữ địa điểm; không nói đến các “tầng” trời. Cần sửa chú thích để chỉ ghi nhận số nhiều mà không diễn giải quá mức.
  revised_text: Vì khi sống lại từ cõi chết, họ không cưới vợ cũng không được gả chồng, nhưng giống như các thiên sứ ở trên trời.[a]
  revised_footnotes:
