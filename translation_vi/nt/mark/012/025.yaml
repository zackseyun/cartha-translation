    text: 'Hoặc: “trong các trời”; tiếng Hy Lạp dùng số nhiều.'
    reason: lexical_alternative
  revision_rationale: Giữ nguyên bản văn vì bản văn trung thành với tiếng Hy Lạp và tự nhiên trong tiếng Việt. Chỉ sửa chú thích để phản ánh chính xác số nhiều của οὐρανοῖς, không thêm ý “các tầng trời.”
