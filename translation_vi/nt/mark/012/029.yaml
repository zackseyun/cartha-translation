source:
  edition: SBLGNT
  text: ⸂ἀπεκρίθη ὁ Ἰησοῦς⸃ ὅτι Πρώτη ⸀ἐστίν· Ἄκουε, Ἰσραήλ, κύριος ὁ θεὸς ἡμῶν κύριος εἷς ἐστιν,
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/029.yaml
  text: 'Jesus answered[a], “The first is: Hear, O Israel, the Lord our God[b], the Lord is one.'
translation:
  language: vi
  text: 'Đức Giê-su đáp: “Điều răn đứng đầu là: Hỡi Ít-ra-ên, hãy nghe: Chúa, Đức Chúa Trời chúng ta, Chúa là một.[a][b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Chúa, Đức Chúa Trời chúng ta, là một Chúa,” hoặc: “Chúa là Đức Chúa Trời chúng ta, chỉ một mình Chúa mà thôi.” Tiếng Hy Lạp vọng lại Phục Truyền Luật Lệ Ký 6:4 và có thể nhấn mạnh Đức Chúa Trời là một, sự độc tôn của Ngài, hoặc cả hai.'
    reason: alternative_reading
  - marker: b
    text: Câu này trích lời tuyên xưng Shema (Phục Truyền Luật Lệ Ký 6:4). Tại đây, từ Hy Lạp dịch là “Chúa” phản ánh cách Bản Bảy Mươi dùng κύριος thay cho danh YHWH của Đức Chúa Trời.
    reason: cross_reference
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: đáp
  rationale: Cách dịch tự nhiên, gọn và giữ đúng sắc thái hồi đáp trong lời đối thoại.
- source_word: Πρώτη
  choice: Điều răn đứng đầu
  rationale: Tính từ giống cái được dùng theo lối danh từ, ngầm quy chiếu về “điều răn” trong câu hỏi trước; bổ sung danh từ giúp tiếng Việt rõ và tự nhiên.
- source_word: Ἄκουε
  choice: hãy nghe
  rationale: Giữ mệnh lệnh trực tiếp và âm hưởng mở đầu lời tuyên xưng Shema trong Phục Truyền Luật Lệ Ký 6:4.
- source_word: Ἰσραήλ
  choice: Hỡi Ít-ra-ên
  rationale: “Hỡi” thể hiện lời gọi trực tiếp với văn phong trang trọng nhưng vẫn dễ hiểu; tên riêng được phiên âm theo dạng tiếng Việt.
- source_word: κύριος ὁ θεὸς ἡμῶν
  choice: Chúa, Đức Chúa Trời chúng ta
  rationale: Bám sát trật tự và cấu trúc đồng vị của tiếng Hy Lạp, đồng thời dùng cách gọi trang trọng, quen thuộc trong tiếng Việt.
- source_word: κύριος εἷς ἐστιν
  choice: là Chúa duy nhất
  rationale: Diễn đạt tự nhiên bằng tiếng Việt và giữ được cả sắc thái về tính duy nhất lẫn khả năng nhấn mạnh sự độc tôn, trong khi các cách phân đoạn khác được nêu ở chú thích.
theological_decisions:
- issue: Cách dịch mệnh đề cuối của Shema mà không xóa bỏ sức căng giữa tính duy nhất và tính độc tôn của Đức Chúa Trời
  choice: Chúa, Đức Chúa Trời chúng ta, là Chúa duy nhất
  alternative: 'Chúa là Đức Chúa Trời chúng ta, chỉ một mình Chúa mà thôi; hoặc: Chúa, Đức Chúa Trời chúng ta, Chúa là một'
  rationale: Cú pháp Hy Lạp phản ánh Bản Bảy Mươi ở Phục Truyền Luật Lệ Ký 6:4 và cho phép nhiều cách phân đoạn. Bản chính chọn cách diễn đạt tiếng Việt rõ, trang trọng, nhưng chú thích giữ lại các khả năng nhấn mạnh sự hiệp nhất hoặc độc tôn.
- issue: κύριος trong lời trích Shema đại diện cho danh riêng YHWH
  choice: Chúa, kèm chú thích về danh YHWH
  alternative: ĐỨC GIÊ-HÔ-VA hoặc ĐỨC CHÚA
  rationale: Dịch κύριος nhất quán theo văn bản Hy Lạp là “Chúa”; chú thích cho biết nền tảng Cựu Ước để độc giả nhận ra đây là cách Bản Bảy Mươi thay cho danh giao ước YHWH, mà không đưa một dạng phiên âm Hebrew vào chính văn Tân Ước.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. “Hỡi … hãy nghe” giữ âm hưởng của lời tuyên xưng giao ước; “Điều răn đứng đầu” tự nhiên hơn một cấu trúc tỉnh lược trong tiếng Việt. Hai dấu chú thích [a][b] được đặt ngay sau mệnh đề Shema mà chúng giải thích.
