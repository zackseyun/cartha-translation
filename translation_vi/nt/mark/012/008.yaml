revisions:
- from: Họ bắt lấy người con ấy[a], giết đi, rồi quăng xác ra ngoài vườn nho.
  to: Họ bắt người ấy, giết người ấy, rồi quăng người ấy ra ngoài vườn nho.[a]
  rationale: Bản sửa giữ nguyên thứ tự của SBLGNT—bắt, giết, rồi quăng ra ngoài—và không hòa hợp hóa với truyền thống song song. Nó thay phần diễn giải “xác” bằng đại từ tương ứng với αὐτόν, đồng thời bỏ danh từ “người con” vốn không xuất hiện trong câu nguồn. Chú thích được chỉnh đồng bộ với bản dịch và vẫn nêu rõ vấn đề về thứ tự hành động.
  reviewer_model: gpt-5.6-terra
