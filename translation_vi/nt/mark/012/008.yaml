  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ λαβόντες ⸂ἀπέκτειναν αὐτόν, καὶ ἐξέβαλον αὐτὸν⸃ ἔξω τοῦ ἀμπελῶνος.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/008.yaml
  text: And they took him[a], killed him, and threw him out of the vineyard.
translation:
  language: vi
  text: Họ bắt người ấy, giết người ấy, rồi quăng người ấy ra ngoài vườn nho.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Một số độc giả có thể chờ đợi thứ tự “quăng người ấy ra khỏi vườn nho rồi giết người ấy” dựa theo các bản kể song song của dụ ngôn; nhưng bản Hy Lạp của Mác tại đây ghi “giết người ấy, rồi quăng người ấy ra ngoài vườn nho.”
    reason: cross_reference
lexical_decisions:
- source_word: λαβόντες
  choice: bắt lấy người con ấy
  rationale: Phân từ bất định quá khứ của λαμβάνω mở đầu chuỗi hành động. Trong ngữ cảnh các tá điền dùng bạo lực với người con, “bắt lấy” diễn đạt tự nhiên và đủ mạnh, nhưng không cường điệu thành một động từ chuyên biệt hơn như “tóm cổ”.
- source_word: ἀπέκτειναν
  choice: giết đi
  rationale: ἀποκτείνω có nghĩa trực tiếp là giết hoặc làm cho chết. “Giết đi” rõ ràng, hiện đại và giữ được sắc thái dứt khoát của câu chuyện.
- source_word: ἐξέβαλον αὐτόν
  choice: quăng xác
  rationale: ἐκβάλλω mang nghĩa ném/quăng ra ngoài. Sau khi nhân vật đã bị giết, đại từ αὐτόν trong tiếng Việt được diễn đạt tự nhiên là “xác”; đây là sự làm rõ theo ngữ cảnh, không thay đổi đối tượng được nói đến.
- source_word: ἔξω τοῦ ἀμπελῶνος
  choice: ra ngoài vườn nho
  rationale: ἔξω với sở hữu cách, đi sau động từ chỉ sự di chuyển, diễn tả việc đưa từ bên trong ra bên ngoài. “Ra ngoài vườn nho” là cách nói tự nhiên trong tiếng Việt.
- source_word: ἀμπελῶνος
  choice: vườn nho
  rationale: ἀμπελών là từ thông dụng chỉ vườn trồng nho và phù hợp với bối cảnh dụ ngôn.
theological_decisions:
- issue: Thứ tự việc giết và quăng ra khỏi vườn nho
  choice: 'Giữ nguyên trình tự của bản Hy Lạp: họ giết người con rồi quăng xác ra ngoài vườn nho.'
  alternative: Đảo thứ tự thành quăng người con ra khỏi vườn nho rồi mới giết, theo cách một số độc giả có thể mong đợi từ các bản kể song song.
  rationale: 'SBLGNT tại Mác 12:8 nêu rõ chuỗi hành động ἀπέκτειναν ... καὶ ἐξέβαλον: giết rồi quăng ra. Bản dịch không hòa hợp hóa câu này với truyền thống dụ ngôn song song, nhờ đó bảo toàn nét căng thẳng của chính văn Mác.'
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và dễ hiểu. “Người con ấy” giúp xác định đối tượng theo mạch văn; “quăng xác” diễn đạt tự nhiên việc αὐτόν vẫn chỉ người con sau khi đã bị giết. Dấu [a] được đặt ngay sau đối tượng để liên kết với chú thích về toàn bộ trình tự hành động.
