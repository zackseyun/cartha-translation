review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch chuyển đạt đúng các yếu tố của câu Hy Lạp: người đàn bà góa nghèo đến và bỏ vào hai lepta; mệnh đề giải thích xác định hai lepta tương đương một quadrans. Không cần thêm mức độ như “khốn cùng” cho πτωχή.'
  naturalness: Cấu trúc kể chuyện nhìn chung tự nhiên. Tuy nhiên, các dạng phiên âm có gạch nối “lép-ta” và đặc biệt “cô-đờ-ran-tê” không phải là cách gọi quen dùng hoặc minh bạch trong tiếng Việt hiện đại. Giữ dạng thuật ngữ lịch sử lepta/quadrans và giải thích ở chú thích rõ ràng hơn.
  terminology: Lepta và quadrans là tên tiền tệ cổ cụ thể. Dùng “quadrans” giữ được liên hệ với κοδράντης và thuật ngữ La Mã, tránh một phiên âm Việt hóa không ổn định. “Đồng tiền đồng nhỏ” chỉ nên để ở chú thích như một phương án từ vựng, không thay cho tên đơn vị trong thân bài.
  issues:
  - severity: low
    issue: Phiên âm “cô-đờ-ran-tê” thiếu tính quy ước và có thể che khuất thuật ngữ quadrans.
    rationale: κοδράντης là dạng Hy Lạp của tên đồng tiền La Mã quadrans. Giữ tên thuật ngữ quen dùng trong nghiên cứu, kèm chú thích, chính xác và dễ tra cứu hơn.
  - severity: low
    issue: 'Chú thích gọi lepta bằng số ít: “Lép-ta là một đồng tiền”.'
    rationale: Lepta là dạng số nhiều xuất hiện trong câu. Diễn đạt “lepta là những đồng tiền...” tránh lẫn giữa tên loại tiền và một đồng riêng lẻ.
  revised_text: Rồi một bà góa nghèo đến, bỏ vào hai đồng lepta[a], tức là một quadrans.[b]
