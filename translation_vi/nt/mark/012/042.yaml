  rationale: Chỉ chuẩn hóa cách trình bày tên hai đồng tiền cổ và làm chú thích chính xác hơn về số nhiều của lepta. Cấu trúc câu, quan hệ tương đương tiền tệ, và sắc thái kể chuyện của bản dự thảo được giữ nguyên.
