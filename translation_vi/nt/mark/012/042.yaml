  text: καὶ ἐλθοῦσα μία χήρα πτωχὴ ἔβαλεν λεπτὰ δύο, ὅ ἐστιν κοδράντης.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/042.yaml
  text: And a poor widow came and put in two lepta[c][b][a], which is a quadrans.
translation:
  language: vi
  text: Rồi một bà góa nghèo đến, bỏ vào hai đồng lepta[a], tức là một quadrans.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lepta là những đồng tiền có giá trị rất nhỏ; hai đồng lepta bằng một quadrans. Cũng có thể dịch: “hai đồng tiền đồng nhỏ.”'
    reason: cultural_note; lexical_alternative
  - marker: b
    text: Quadrans là tên một đồng tiền La Mã, được nêu trong nguyên văn Hy Lạp; các bản dịch tiếng Anh cũ thường dịch là “farthing.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθοῦσα
  choice: đến
  rationale: 'Phân từ bất định quá khứ của ἔρχομαι được diễn đạt tự nhiên trong tiếng Việt bằng động từ nối tiếp với hành động chính: “đến, bỏ vào”.'
- source_word: μία
  choice: một
  rationale: μία giới thiệu một nhân vật riêng lẻ trong câu chuyện; “một bà góa” tự nhiên trong tiếng Việt và không nhất thiết nhấn mạnh số lượng.
- source_word: χήρα πτωχὴ
  choice: một bà góa nghèo
  rationale: Giữ nghĩa thông thường của χήρα và πτωχός, đồng thời dùng trật tự từ tự nhiên trong tiếng Việt; “nghèo” không diễn giải quá mức thành “khốn cùng” ngay tại câu này.
- source_word: ἔβαλεν
  choice: bỏ vào
  rationale: Trong bối cảnh thùng dâng hiến, “bỏ vào” rõ nghĩa và tự nhiên hơn cách dịch sát hình thức như “ném vào”.
- source_word: λεπτὰ δύο
  choice: hai đồng lép-ta
  rationale: Giữ tên đồng tiền cụ thể trong nguyên văn Hy Lạp, được phiên âm dễ đọc; chú thích giải thích đây là những đồng tiền có giá trị rất nhỏ.
- source_word: ὅ ἐστιν
  choice: tức là
  rationale: Cụm này đưa ra lời giải thích tương đương về giá trị; “tức là” tự nhiên và gọn trong tiếng Việt.
- source_word: κοδράντης
  choice: một đồng cô-đờ-ran-tê
  rationale: Phiên âm tên đồng quadrans của La Mã thay vì thay bằng một đơn vị tiền hiện đại dễ gây sai lệch lịch sử.
