  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Giữ tên hai loại tiền cổ bằng lối phiên âm tiếng Việt, đồng thời dùng chú thích để tránh khiến độc giả tưởng đó là đơn vị tiền hiện đại.
