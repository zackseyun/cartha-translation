  text: ⸀αὐτὸς Δαυὶδ λέγει αὐτὸν κύριον, καὶ πόθεν ⸂αὐτοῦ ἐστιν υἱός⸃; καὶ ὁ πολὺς ὄχλος ἤκουεν αὐτοῦ ἡδέως.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/037.yaml
  text: David himself calls him Lord[b][a], so how is he his son? And the large crowd was listening to him gladly.
translation:
  language: vi
  text: Chính Đa-vít gọi Đấng ấy là “Chúa”; vậy làm sao[a] Đấng ấy lại là con[b] của ông? Đám đông đông đảo rất thích nghe Ngài.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát hơn: “từ đâu” hoặc “bởi đâu”.'
    reason: lexical_alternative
  - marker: b
    text: “Con” ở đây gợi lại danh hiệu Đấng Mê-si-a là “con Đa-vít”; từ này cũng có thể mang nghĩa rộng hơn là “hậu duệ”.
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτὸς Δαυὶδ
  choice: Chính Đa-vít
  rationale: '“Chính” giữ sắc thái nhấn mạnh của αὐτός: đích thân Đa-vít gọi Đấng ấy là Chúa.'
- source_word: λέγει αὐτὸν κύριον
  choice: gọi Đấng ấy là ‘Chúa’
  rationale: Trong kết cấu này, λέγει có chức năng gọi hoặc xưng ai bằng một danh hiệu. “Đấng ấy” giữ đối tượng ở ngôi thứ ba mà không thêm lời giải thích trực tiếp rằng đó là Đấng Mê-si-a.
- source_word: πόθεν
  choice: làm sao
  rationale: Nghĩa gốc là “từ đâu”, nhưng tại đây từ này nêu câu hỏi về cơ sở hoặc lô-gích của mối quan hệ; “làm sao” tự nhiên trong tiếng Việt và giữ sức mạnh của câu hỏi tu từ.
- source_word: αὐτοῦ ἐστιν υἱός
  choice: Đấng ấy lại là con của ông
  rationale: Giữ “con” thay vì giải nghĩa thành “hậu duệ” để bảo toàn sự liên hệ với danh hiệu Đấng Mê-si-a là “con Đa-vít” và sự căng thẳng trong lập luận.
- source_word: ὁ πολὺς ὄχλος
  choice: đám đông dân chúng
  rationale: Cụm từ chỉ một đám đông gồm nhiều người; cách diễn đạt này tự nhiên, trang trọng vừa phải và không diễn giải thành một tầng lớp xã hội.
- source_word: ἤκουεν αὐτοῦ ἡδέως
  choice: vui thích lắng nghe Ngài
  rationale: “Lắng nghe” phản ánh hành động đang tiếp diễn của thì chưa hoàn thành ἤκουεν, còn “vui thích” truyền đạt niềm hứng thú của ἡδέως.
theological_decisions:
- issue: Sức nặng Kitô học khi Đa-vít gọi Đấng Mê-si-a là “Chúa”
  choice: Giữ trực tiếp danh hiệu “Chúa” cùng câu hỏi tu từ, không thêm lời giải thích thần học.
  alternative: Diễn giải rằng Đấng Mê-si-a cao trọng hơn hoặc không chỉ đơn thuần là hậu duệ Đa-vít.
  rationale: Nguyên văn tạo ra một sự căng thẳng về căn tính của Đấng Mê-si-a nhưng không giải thích trọn vẹn tại đây; bản dịch cần giữ nguyên sức gợi đó.
- issue: Ý nghĩa của υἱός trong bối cảnh danh hiệu “con Đa-vít”
  choice: con
  alternative: hậu duệ
  rationale: “Hậu duệ” làm rõ quan hệ gia tộc theo nghĩa rộng, nhưng “con” giữ nguyên từ ngữ của nguồn và sự tương phản trong câu hỏi của Đức Giê-su.
translation_notes:
  register: Tiếng Việt hiện đại, dễ hiểu nhưng trang trọng. Dùng “Đấng ấy” để duy trì đối tượng ngôi thứ ba trong lập luận, “Chúa” như một danh hiệu, và “Ngài” cho Đức Giê-su ở mệnh đề cuối. Dấu ngoặc đơn quanh “Chúa” làm rõ đây là danh xưng được Đa-vít dùng.
