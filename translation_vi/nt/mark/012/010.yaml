id: MRK.12.10
reference: Mark 12:10
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οὐδὲ τὴν γραφὴν ταύτην ἀνέγνωτε· Λίθον ὃν ἀπεδοκίμασαν οἱ οἰκοδομοῦντες, οὗτος ἐγενήθη εἰς κεφαλὴν γωνίας·
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/010.yaml
  text: 'Have you not even read this Scripture: ‘The stone that the builders rejected[a], this has become the cornerstone’?”'
translation:
  language: vi
  text: '“Ngay cả đoạn Kinh Thánh này, các ông cũng chưa đọc sao:


    ‘Tảng đá mà thợ xây đã loại bỏ

    đã trở thành viên đá chính ở góc[a]’?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát: “đầu của góc.” Cụm từ này có thể chỉ viên đá góc chủ chốt ở nền hoặc viên đá hoàn tất phần góc phía trên.'
    reason: Bảo lưu nghĩa sát chữ và sự không chắc chắn về loại đá kiến trúc được nói đến.
lexical_decisions:
- source_word: οὐδὲ
  choice: Ngay cả ... cũng chưa
  rationale: Cấu trúc này chuyển tải sắc thái nhấn mạnh của οὐδέ trong câu hỏi mang tính quở trách, tự nhiên hơn trong tiếng Việt hiện đại so với cách phủ định đơn thuần.
- source_word: τὴν γραφὴν ταύτην
  choice: đoạn Kinh Thánh này
  rationale: Trong công thức trích dẫn của Tân Ước, γραφή chỉ Kinh Thánh; ở đây từ chỉ một lời trích cụ thể, nên “đoạn Kinh Thánh này” rõ nghĩa và tự nhiên.
- source_word: ἀνέγνωτε
  choice: đã ... đọc
  rationale: Động từ aorist trong câu hỏi tu từ được diễn đạt tự nhiên bằng “đã đọc”; kết hợp với “chưa ... sao” để nói về điều đáng lẽ họ phải từng đọc.
- source_word: Λίθον
  choice: Tảng đá
  rationale: Dù danh từ không có mạo từ trong tiếng Hy Lạp, ngữ cảnh trích Thi Thiên 118 nói đến một tảng đá xác định trong hình ảnh ẩn dụ.
- source_word: ἀπεδοκίμασαν
  choice: loại bỏ
  rationale: ἀποδοκιμάζω hàm ý xem xét rồi không chấp nhận. “Loại bỏ” phù hợp với hành động của thợ xây và giữ được sắc thái mạnh hơn “không chấp nhận”.
- source_word: οἱ οἰκοδομοῦντες
  choice: những người thợ xây
  rationale: Phân từ dùng như danh từ, chỉ những người đang xây dựng; “những người thợ xây” ngắn gọn và giữ nguyên hình ảnh.
- source_word: ἐγενήθη
  choice: đã trở thành
  rationale: Diễn đạt trực tiếp thể aorist và sự đảo ngược địa vị của tảng đá mà không áp đặt thêm tác nhân như cách dịch “được làm thành”.
- source_word: εἰς κεφαλὴν γωνίας
  choice: viên đá chính nơi góc nhà
  rationale: Cách dịch giữ cả ý “đứng đầu/chính” của κεφαλή và “góc” của γωνία, đồng thời tự nhiên hơn lối dịch sát từng chữ “đầu góc”. Chú thích bảo lưu sự không chắc chắn về vị trí kiến trúc chính xác.
theological_decisions:
- issue: Cách áp dụng hình ảnh Thi Thiên 118:22 vào Đấng Mê-si-a
  choice: Giữ nguyên ẩn dụ về tảng đá, thợ xây và viên đá chính trong bản văn.
  alternative: Nói rõ trong câu dịch rằng tảng đá tượng trưng cho Chúa Giê-su hoặc Đấng Mê-si-a.
  rationale: Ngữ cảnh áp dụng lời Thi Thiên cho Chúa Giê-su, nhưng câu trích dẫn tự nó vẫn dùng hình ảnh ẩn dụ. Bản dịch không nên đưa phần giải nghĩa thần học vào chính lời trích.
- issue: Vị trí kiến trúc của κεφαλὴ γωνίας
  choice: Dùng cách diễn đạt khái quát “viên đá chính nơi góc nhà” và ghi chú các khả năng.
  alternative: Chọn dứt khoát “đá móng góc” hoặc “đá đỉnh góc”.
  rationale: Cụm từ nêu địa vị đứng đầu của viên đá tại góc nhưng không xác định hoàn toàn đó là đá móng hay đá ở phần đỉnh. Không nên âm thầm giải quyết điều bản văn còn để ngỏ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “các ông” phù hợp với lời Chúa Giê-su trực tiếp chất vấn các nhà lãnh đạo trong ngữ cảnh. Dòng thơ được trình bày tách dòng để nhận diện lời trích Kinh Thánh.
