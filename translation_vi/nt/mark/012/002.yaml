- from: Đến đúng thời điểm, ông sai một nô lệ[a] đến gặp những người trồng nho[b] để nhận từ họ một phần hoa lợi của vườn nho.
  to: Đến kỳ hạn, ông sai một nô lệ[a] đến chỗ những người trồng nho[b], để nhận từ họ một phần hoa lợi của vườn nho.
  rationale: Chỉnh hai điểm diễn đạt nhỏ để bản văn tự nhiên hơn và bám sát hơn chức năng hướng-đến của πρὸς cùng sắc thái “thời điểm/kỳ hạn thích hợp” của καιρός. Không thay đổi ý nghĩa, thuật ngữ then chốt, hay các neo chú thích.
