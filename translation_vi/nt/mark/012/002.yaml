id: MRK.12.2
reference: Mark 12:2
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἀπέστειλεν πρὸς τοὺς γεωργοὺς τῷ καιρῷ δοῦλον, ἵνα παρὰ τῶν γεωργῶν λάβῃ ἀπὸ ⸂τῶν καρπῶν⸃ τοῦ ἀμπελῶνος·
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/002.yaml
  text: And at the proper time he sent a servant to the vine-growers[b][a], so that he might receive from the vine-growers some of the fruit of the vineyard.
translation:
  language: vi
  text: Đến kỳ hạn, ông sai một nô lệ[a] đến chỗ những người trồng nho[b], để nhận từ họ một phần hoa lợi của vườn nho.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “đầy tớ”. Từ Hy Lạp δοῦλος thường chỉ người ở địa vị nô lệ.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “những người canh tác” hoặc “những tá điền”. Từ Hy Lạp chỉ những người làm đất; bối cảnh vườn nho khiến “những người trồng nho” phù hợp hơn ở đây.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: sai ... đến
  rationale: Diễn đạt tự nhiên hành động cử một người đi làm nhiệm vụ, phù hợp với thể kể chuyện của động từ aorist.
- source_word: τῷ καιρῷ
  choice: đến đúng thời điểm
  rationale: Giữ ý về thời điểm thích hợp hoặc đã định mà không xác quyết cụ thể đó là mùa thu hoạch.
- source_word: γεωργοὺς / γεωργῶν
  choice: những người trồng nho
  rationale: γεωργός chỉ người canh tác đất; trong bối cảnh vườn nho, cách dịch này cụ thể, tự nhiên và không thêm ý pháp lý về việc thuê đất.
- source_word: δοῦλον
  choice: một nô lệ
  rationale: Phản ánh trực tiếp địa vị lệ thuộc được δοῦλος biểu thị trong bối cảnh xã hội cổ đại; cách dịch truyền thống “đầy tớ” được giữ ở chú thích.
- source_word: ἵνα ... λάβῃ
  choice: để nhận
  rationale: Diễn đạt rõ mệnh đề chỉ mục đích trong tiếng Việt hiện đại.
- source_word: παρὰ τῶν γεωργῶν
  choice: từ họ
  rationale: παρά với sở hữu cách chỉ nguồn; đại từ tránh lặp nặng nề mà vẫn có đối tượng quy chiếu rõ ràng.
- source_word: ἀπὸ τῶν καρπῶν τοῦ ἀμπελῶνος
  choice: một phần hoa lợi của vườn nho
  rationale: “Một phần” thể hiện sắc thái phân lượng của ἀπό với sở hữu cách; “hoa lợi” bao quát sản vật thu được từ vườn mà không thêm ý “phần thuộc về ông” vốn không được nói thẳng.
- source_word: ἀμπελῶνος
  choice: vườn nho
  rationale: Tương đương thông dụng, rõ nghĩa của ἀμπελών.
theological_decisions:
- issue: Địa vị của δοῦλος
  choice: nô lệ
  alternative: đầy tớ
  rationale: Bản chính giữ nghĩa xã hội mạnh hơn của từ Hy Lạp, trong khi chú thích bảo lưu cách gọi quen thuộc và ít trực diện hơn; không suy diễn thêm ý nghĩa thần học.
- issue: Tính chất phần hoa lợi được nhận
  choice: một phần hoa lợi
  alternative: phần hoa lợi thuộc về ông
  rationale: Không thêm quan niệm quyền sở hữu hay tỷ lệ phân chia vốn chỉ được hàm ý bởi tình huống dụ ngôn, chứ không được câu Hy Lạp phát biểu trực tiếp.
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. “Sai ... đến” giữ sắc thái người chủ cử người đại diện; “hoa lợi” cô đọng, tự nhiên trong ngữ cảnh canh tác. Các dấu chú thích [a], [b] đều được đặt ngay sau từ ngữ liên quan trong bản văn.
