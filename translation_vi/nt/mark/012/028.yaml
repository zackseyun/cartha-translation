source:
  edition: SBLGNT
  text: Καὶ προσελθὼν εἷς τῶν γραμματέων ἀκούσας αὐτῶν συζητούντων, ⸀ἰδὼν ὅτι καλῶς ⸂ἀπεκρίθη αὐτοῖς⸃, ἐπηρώτησεν αὐτόν· Ποία ἐστὶν ⸂ἐντολὴ πρώτη πάντων⸃;
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/028.yaml
  text: And one of the scribes came up and heard them debating, and seeing that he had answered them well, he asked him, “Which commandment is the first of all?”
translation:
  language: vi
  text: 'Có một kinh sư đến gần, nghe họ tranh luận với nhau. Thấy Đức Giê-su đã trả lời họ thỏa đáng, ông hỏi Người: “Trong tất cả các điều răn, điều nào đứng đầu?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “điều nào quan trọng nhất” hoặc “điều nào lớn nhất.”
    reason: lexical_alternative
lexical_decisions:
- source_word: γραμματέων
  choice: kinh sư
  rationale: Trong bối cảnh các sách Tin Mừng, từ này chỉ những chuyên gia Do Thái được công nhận về Kinh Thánh và luật pháp; “kinh sư” là cách gọi trực tiếp, quen thuộc và trang trọng trong tiếng Việt.
- source_word: προσελθὼν
  choice: đến gần
  rationale: Diễn đạt rõ động tác tiến đến chỗ Đức Giê-su, tự nhiên hơn lối dịch sát cứng.
- source_word: ἀκούσας αὐτῶν συζητούντων
  choice: nghe họ tranh luận với nhau
  rationale: συζητέω có thể chỉ bàn luận, tranh luận hoặc tranh biện; ngữ cảnh là một cuộc trao đổi công khai về vấn đề gây tranh luận, nhưng không nhất thiết hàm ý thù địch.
- source_word: ἰδὼν ὅτι καλῶς ἀπεκρίθη αὐτοῖς
  choice: Thấy Đức Giê-su đã trả lời họ thỏa đáng
  rationale: “Thỏa đáng” chuyển tải καλῶς trong ngữ cảnh đánh giá câu trả lời là đúng và hay, đồng thời tránh một cấu trúc tiếng Việt thiếu tự nhiên như “trả lời tốt”.
- source_word: ἐπηρώτησεν
  choice: hỏi
  rationale: Cách diễn đạt thông dụng và chính xác cho hành động nêu câu hỏi.
- source_word: Ποία
  choice: điều nào
  rationale: Câu hỏi yêu cầu xác định một điều răn trong số nhiều điều răn.
- source_word: ἐντολή
  choice: điều răn
  rationale: Đây là thuật ngữ tiếng Việt quen thuộc khi nói về mệnh lệnh của Đức Chúa Trời, đặc biệt trong bối cảnh luật Môi-se.
- source_word: πρώτη πάντων
  choice: đứng đầu trong tất cả
  rationale: Giữ hình ảnh “đầu tiên/đứng đầu” của πρώτη nhưng diễn đạt tự nhiên trong tiếng Việt và không quyết định dứt khoát rằng ý nghĩa chỉ là thứ tự hay tầm quan trọng.
theological_decisions:
- issue: Ý nghĩa của πρώτη trong câu hỏi về điều răn
  choice: điều nào đứng đầu
  alternative: điều nào quan trọng nhất; điều nào lớn nhất; điều nào là điều thứ nhất
  rationale: πρώτη có thể chỉ vị trí đầu tiên hoặc địa vị cao nhất. “Đứng đầu” bảo tồn sắc thái xếp hạng và sự căng thẳng ngữ nghĩa ấy, còn chú thích nêu rõ các cách hiểu tự nhiên khác.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Giê-su” và đại từ “Người” để chỉ Đức Giê-su; dùng “kinh sư” theo thuật ngữ Kinh Thánh tiếng Việt quen thuộc. Dấu chú thích [a] được đặt ngay sau câu hỏi mà nó giải thích.
