base_translation:
  language: en
  yaml_path: translation/nt/mark/012/022.yaml
  text: And the seven left no offspring. Last of all[a], the woman also died.
translation:
  language: vi
  text: Cả bảy người đều không để lại con cái[a]. Cuối cùng, người phụ nữ ấy cũng chết.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nghĩa đen: “không để lại hạt giống”; đây là thành ngữ chỉ việc không để lại con cháu hoặc hậu duệ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ ἑπτὰ
  choice: cả bảy người
  rationale: Cụm có mạo từ và số từ được dùng như danh từ, chỉ lại bảy anh em trong ngữ cảnh trước. “Cả bảy người” tự nhiên trong tiếng Việt và diễn đạt rõ tính toàn bộ.
- source_word: οὐκ ἀφῆκαν σπέρμα
  choice: đều không để lại con nối dõi
  rationale: Nghĩa đen là “không để lại hạt giống,” nhưng trong ngữ cảnh chỉ việc không có con cháu. “Con nối dõi” truyền đạt đúng ý về hậu duệ trong câu chuyện hôn nhân và vẫn là cách nói tự nhiên, trang trọng.
- source_word: ἔσχατον πάντων
  choice: Sau cùng
  rationale: Cụm trạng ngữ này đánh dấu thứ tự thời gian; “Sau cùng” gọn, tự nhiên và giữ đúng ý người phụ nữ chết sau tất cả bảy người.
- source_word: καὶ ἡ γυνὴ
  choice: người phụ nữ cũng
  rationale: καί có sắc thái bổ sung, đưa người phụ nữ vào chuỗi những người đã chết. “Cũng” thể hiện rõ sắc thái ấy; mạo từ chỉ người phụ nữ đã được nhắc đến.
- source_word: ἀπέθανεν
  choice: chết
  rationale: Động từ có nghĩa trực tiếp là “chết”; cách dịch này giữ sự thẳng thắn của nguyên văn, không dùng lối nói giảm.
