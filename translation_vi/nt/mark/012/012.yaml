  source_fidelity: 'Bản dịch truyền đạt đúng diễn tiến của nguyên văn: họ đang/tìm cách bắt Người, sợ đám đông, nhận ra dụ ngôn được nói nhắm vào họ, rồi để Người lại và đi. “Tìm cách” phản ánh thỏa đáng sắc thái nỗ lực của ἐζήτουν; “bắt” giữ nghĩa không chuyên biệt pháp lý của κρατῆσαι. “Nhằm vào họ” phù hợp với lực đối kháng theo ngữ cảnh của πρὸς αὐτούς mà không vượt quá nguyên văn.'
