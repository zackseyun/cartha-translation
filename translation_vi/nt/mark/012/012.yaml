id: MRK.12.12
reference: Mark 12:12
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Καὶ ἐζήτουν αὐτὸν κρατῆσαι, καὶ ἐφοβήθησαν τὸν ὄχλον, ἔγνωσαν γὰρ ὅτι πρὸς αὐτοὺς τὴν παραβολὴν εἶπεν. καὶ ἀφέντες αὐτὸν ἀπῆλθον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/012.yaml
  text: And they were seeking to seize him[a], but they feared the crowd, for they knew that he had spoken the parable against them. So they left him and went away.
translation:
  language: vi
  text: 'Họ tìm cách bắt Ngài, nhưng lại sợ đám đông, vì biết rằng Ngài đã kể dụ ngôn ấy nhằm vào họ.[a] Rồi họ bỏ Ngài mà đi.


    [a] Cũng có thể dịch: “nói về họ” hoặc “nói với họ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “nói về họ” hoặc “nói với họ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐζήτουν
  choice: tìm cách
  rationale: Thì vị hoàn diễn tả một nỗ lực đang tiếp diễn hoặc chưa thành; “tìm cách” tự nhiên trong tiếng Việt và giữ được sắc thái cố gắng.
- source_word: κρατῆσαι
  choice: bắt
  rationale: Trong ngữ cảnh này, từ này chỉ việc tóm bắt hoặc khống chế Ngài. “Bắt” gần nghĩa và không mặc nhiên thêm ý về một thủ tục pháp lý chính thức như “bắt giữ theo lệnh.”
- source_word: ἐφοβήθησαν τὸν ὄχλον
  choice: sợ đám đông
  rationale: Cách dịch trực tiếp, tự nhiên, giữ nguyên đối tượng khiến họ sợ.
- source_word: ἔγνωσαν
  choice: biết
  rationale: Giữ nghĩa trực tiếp của động từ; ngữ cảnh cho thấy đây là sự nhận biết rõ ràng.
- source_word: πρὸς αὐτοὺς
  choice: nhằm vào họ
  rationale: Trong bối cảnh đối đầu, cụm từ cho thấy dụ ngôn được hướng đến họ với hàm ý bất lợi. “Nhằm vào họ” diễn đạt tự nhiên mà vẫn bảo toàn sắc thái ấy; các cách hiểu ít đối kháng hơn được ghi ở chú thích.
- source_word: τὴν παραβολὴν
  choice: dụ ngôn ấy
  rationale: “Ấy” chỉ tự nhiên về dụ ngôn vừa được kể ở phần trước, tương ứng với mạo từ xác định trong tiếng Hy Lạp.
- source_word: εἶπεν
  choice: đã kể
  rationale: Với “dụ ngôn,” tiếng Việt thường dùng “kể”; “đã” thể hiện hành động xảy ra trước lúc họ nhận biết.
- source_word: ἀφέντες αὐτὸν
  choice: họ bỏ Ngài
  rationale: Phân từ ở đây diễn tả việc họ để Ngài lại và từ bỏ ý định tức thời; “bỏ Ngài” gọn và phù hợp với động từ chuyển động theo sau.
- source_word: ἀπῆλθον
  choice: mà đi
  rationale: Cách diễn đạt tiếng Việt tự nhiên, truyền đạt rõ việc họ rời khỏi nơi đó.
theological_decisions:
- issue: Sắc thái của πρὸς αὐτούς
  choice: nhằm vào họ
  alternative: nói về họ; nói với họ
  rationale: Bối cảnh thù nghịch ủng hộ sắc thái “nhằm vào/chống lại,” nhưng giới từ có thể chỉ sự quy chiếu hoặc đối tượng được nói đến; chú thích giữ lại sự mơ hồ thực sự của nguyên văn.
translation_notes:
  register: 'Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” để chỉ Đức Chúa Jêsus theo mạch văn, tránh lặp tên không có trong câu Hy Lạp. Cấu trúc câu giữ rõ diễn tiến: họ định bắt, bị đám đông ngăn trở vì sợ, rồi rời đi.'
