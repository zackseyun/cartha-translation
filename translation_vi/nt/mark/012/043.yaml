source:
  edition: SBLGNT
  text: καὶ προσκαλεσάμενος τοὺς μαθητὰς αὐτοῦ ⸀εἶπεν αὐτοῖς· Ἀμὴν λέγω ὑμῖν ὅτι ἡ χήρα αὕτη ἡ πτωχὴ πλεῖον πάντων ⸀ἔβαλεν τῶν βαλλόντων εἰς τὸ γαζοφυλάκιον·
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/043.yaml
  text: And calling his disciples to himself[a], he said to them, “Truly I say to you that this poor widow has put in more than all those who are putting into the treasury.”
translation:
  language: vi
  text: 'Ngài gọi các môn đồ của mình đến gần rồi nói với họ: “Thật, tôi nói với anh em, bà góa nghèo này đã bỏ vào hòm dâng tiền[a] nhiều hơn tất cả những người đang bỏ tiền vào đó.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “kho bạc” hoặc “khu vực nhận tiền dâng”. Từ Hy Lạp có thể chỉ vật chứa tiền hoặc khu vực kho bạc của đền thờ.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: gọi ... đến bên mình
  rationale: 'Diễn đạt tự nhiên sắc thái trung động của động từ: Đức Chúa Jêsus gọi các môn đồ lại gần mình trước khi nói.'
- source_word: μαθητὰς
  choice: các môn đồ
  rationale: Cách dịch quen thuộc, giữ được ý nghĩa về những người theo học và đi theo Đức Chúa Jêsus.
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: Thật, tôi nói với anh em
  rationale: Giữ công thức mở đầu long trọng và tính trực tiếp của nguyên văn mà vẫn rõ nghĩa trong tiếng Việt hiện đại.
- source_word: χήρα
  choice: bà góa
  rationale: Cách gọi tự nhiên và trực tiếp đối với một phụ nữ đã mất chồng.
- source_word: πτωχὴ
  choice: nghèo
  rationale: Truyền đạt nghĩa thông thường của từ mà không tăng mức độ thành 'khốn cùng' hay 'cùng quẫn'.
- source_word: πλεῖον πάντων
  choice: nhiều hơn tất cả
  rationale: Bám sát phép so sánh trong tiếng Hy Lạp và không đưa lời giải thích định tính hay định lượng vào chính văn.
- source_word: ἔβαλεν
  choice: đã bỏ vào
  rationale: Trong ngữ cảnh dâng tiền, động từ βάλλω chỉ hành động bỏ tiền vào hòm; 'đã' thể hiện hành động đã hoàn tất.
- source_word: τῶν βαλλόντων
  choice: những người đang bỏ tiền vào
  rationale: Dạng phân từ hiện tại diễn tả hành động đang diễn ra của những người dâng tiền khác.
- source_word: γαζοφυλάκιον
  choice: hòm tiền dâng
  rationale: Cách nói cụ thể, dễ hiểu trong tiếng Việt hiện đại; chú thích giữ lại phạm vi nghĩa có thể chỉ kho bạc hoặc khu vực nhận tiền của đền thờ.
theological_decisions:
- issue: Cách đánh giá lễ vật của bà góa
  choice: Giữ nguyên lời so sánh 'nhiều hơn tất cả' mà không giải thích ngay trong chính văn.
  alternative: Diễn giải rằng bà đã dâng nhiều hơn về giá trị tinh thần, hoặc rằng số tiền của bà lớn hơn về mặt số lượng.
  rationale: Câu tiếp theo giải thích sự tương phản giữa cảnh nghèo của bà và sự dư dật của những người khác. Chính văn nên giữ phép so sánh có chủ ý của Đức Chúa Jêsus và không âm thầm quyết định phép so sánh ấy là định tính hay định lượng.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại, dùng câu trực tiếp và dễ hiểu. 'Đến bên mình' giữ sắc thái Đức Chúa Jêsus gọi các môn đồ lại gần; 'rồi' giúp trình tự hành động tự nhiên trong tiếng Việt. Đại từ trong lời nói được giữ ở mức trung tính, không đưa thêm sắc thái giáo phái.
