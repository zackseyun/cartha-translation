  verdict: revise
  source_fidelity: 'Bản dịch truyền đạt đúng các thành tố chính: Đức Chúa Jêsus gọi các môn đồ lại gần, công thức long trọng Ἀμήν λέγω ὑμῖν, bà góa nghèo, phép so sánh không diễn giải của πλεῖον πάντων, và hành động dâng tiền đang diễn ra của những người khác. Tuy nhiên, cách gọi ''hòm tiền dâng'' chưa tự nhiên bằng ''hòm dâng tiền''; bản sửa cũng làm rõ các môn đồ là những người thuộc về Ngài, như αὐτοῦ.'
  naturalness: Câu hiện có nhìn chung rõ ràng, nhưng 'hòm tiền dâng' là một kết hợp từ chưa tự nhiên trong tiếng Việt hiện đại. 'Hòm dâng tiền' thông dụng và dễ hiểu hơn. 'gọi các môn đồ của mình đến gần' diễn đạt tự nhiên hơn 'gọi các môn đồ đến bên mình' mà vẫn giữ ý gọi họ lại với mình.
  terminology: Giữ 'môn đồ', 'bà góa', 'Thật, tôi nói với anh em' và 'hòm dâng tiền'. Không thêm diễn giải về bản chất định tính hay định lượng của chữ 'nhiều hơn'. Chú thích tiếp tục phản ánh phạm vi nghĩa của γαζοφυλάκιον là vật chứa tiền hoặc khu vực/kho bạc của đền thờ.
