    issue: “lầm lạc” cho πλανᾶσθε
    rationale: Trong tiếng Việt hiện đại, “lầm lạc” dễ hàm ý lệch lạc đạo lý/tín ngưỡng hoặc lạc đường, trong khi πλανᾶσθε ở đây đơn giản quở trách họ là sai lầm. “Sai lầm” trung tính hơn và bảo toàn sự mơ hồ về cơ chế sai lạc.
  - severity: low
    issue: Chú thích b lặp lại cách diễn đạt có sắc thái mạnh hơn
    rationale: Cần điều chỉnh chú thích để các phương án thay thế phản ánh “sai lầm”/“mắc sai lầm” thay vì đề cao “lầm lẫn quá đỗi”, vốn không cần thiết và kém tự nhiên.
