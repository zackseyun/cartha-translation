  text: οὐκ ἔστιν ⸀θεὸς νεκρῶν ⸀ἀλλὰ ζώντων· ⸀πολὺ πλανᾶσθε.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/027.yaml
  text: He is not God of the dead[a], but of the living[b]. You are greatly mistaken.
translation:
  language: vi
  text: Ngài không phải là Đức Chúa Trời của người chết, nhưng của người sống.[a] Các ông sai lầm quá nhiều.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát hơn: “Đức Chúa Trời không phải là Đức Chúa Trời của người chết, nhưng của người sống.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “Các ông rất sai lầm” hoặc “Các ông mắc sai lầm nghiêm trọng.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: θεὸς
  choice: Đức Chúa Trời
  rationale: Danh từ không có mạo từ trong cấu trúc này vẫn chỉ Đức Chúa Trời duy nhất đã được nhắc đến trong ngữ cảnh, chứ không mang nghĩa bất định là “một vị thần”.
- source_word: νεκρῶν
  choice: người chết
  rationale: Dạng sở hữu số nhiều được dùng như danh từ, chỉ những người đã chết; cách dịch này tự nhiên và giữ nguyên thế đối lập với “người sống”.
- source_word: ἀλλὰ ζώντων
  choice: nhưng của người sống
  rationale: Phân từ hiện tại số nhiều được dùng như danh từ để chỉ những người đang sống. Cụm từ ngắn gọn này bảo toàn sự tương phản trực tiếp với “người chết”.
- source_word: πολὺ
  choice: quá
  rationale: Từ này được dùng như trạng từ để nhấn mạnh mức độ của πλανᾶσθε. Đặt “quá” cuối câu là cách diễn đạt tự nhiên trong tiếng Việt và truyền đạt rõ sức nặng của lời quở trách.
- source_word: πλανᾶσθε
  choice: lầm lạc
  rationale: Hình thái trung động/thụ động diễn tả tình trạng sai lầm. “Lầm lạc” giữ được sắc thái đi chệch khỏi lẽ thật mà không quyết định rằng họ tự mình lạc đường hay bị người khác lừa dối.
- source_word: οὐκ ἔστιν
  choice: Ngài không phải là
  rationale: Tiếng Hy Lạp không nêu đại từ chủ ngữ, nhưng chủ thể được hiểu từ ngữ cảnh ngay trước đó là Đức Chúa Trời của Áp-ra-ham, Y-sác và Gia-cốp. Tiếng Việt dùng “Ngài” để câu rõ ràng và tự nhiên.
theological_decisions:
- issue: Hàm ý về sự sống trước mặt Đức Chúa Trời trong lập luận của Chúa Giê-su
  choice: Giữ nguyên sự tương phản giữa “người chết” và “người sống”, không diễn giải thêm thành một mệnh đề thần học về sự sống lại hay tình trạng trung gian.
  alternative: Diễn giải rõ rằng đối với Đức Chúa Trời, các tổ phụ vẫn đang sống hoặc rằng người chết chắc chắn sẽ sống lại.
  rationale: Câu này nằm trong lập luận về sự sống lại, nhưng bản dịch không nên đưa các kết luận giải nghĩa vào chính lời văn. Cách dịch trực tiếp bảo toàn sức mạnh và độ căng thần học của nguyên bản.
- issue: Chủ ngữ hàm ẩn của οὐκ ἔστιν
  choice: Dùng đại từ tôn kính “Ngài” để chỉ Đức Chúa Trời đã được nói đến trong ngữ cảnh.
  alternative: 'Lặp lại đầy đủ: “Đức Chúa Trời không phải là Đức Chúa Trời của người chết...”'
  rationale: Cả hai cách đều phù hợp về nghĩa; “Ngài” tự nhiên hơn trong tiếng Việt mà không thay đổi đối tượng quy chiếu.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. “Các ông” phù hợp với lời Chúa Giê-su trực tiếp quở trách nhóm người đối thoại; dấu chấm than truyền đạt sức mạnh của πολὺ πλανᾶσθε mà không thêm nội dung.
