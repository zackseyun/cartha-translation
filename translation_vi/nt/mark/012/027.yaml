review_pass:
  verdict: revise
  source_fidelity: Mệnh đề đầu truyền đạt đúng đối lập θεὸς νεκρῶν / ζώντων; “Ngài” quy chiếu Đức Chúa Trời từ ngữ cảnh trước và không thêm ý. Tuy nhiên, “lầm lạc” thường gợi ý đi lạc về đạo đức hay tôn giáo, mạnh và hẹp hơn πλανᾶσθε trong lời quở trách về sự sai lầm trong lập luận. “Sai lầm” giữ được nghĩa đang ở trong sự lầm lỗi mà không xác định nguyên nhân hay loại sai lạc.
  naturalness: “Ngài không phải là Đức Chúa Trời của người chết, nhưng của người sống” tự nhiên, trang trọng và rõ nghĩa trong tiếng Việt hiện đại. “Các ông sai lầm quá nhiều” là lời quở trách trực tiếp, tự nhiên hơn “Các ông lầm lạc quá”, đồng thời phản ánh tốt trạng từ πολὺ.
  terminology: “Đức Chúa Trời” là cách gọi nhất quán, phù hợp ngữ cảnh Đức Chúa Trời của các tổ phụ. “Người chết” và “người sống” giữ thế đối lập số nhiều mang tính danh từ của nguyên ngữ. Không cần diễn giải thêm về sự sống lại hoặc tình trạng của người chết.
  issues:
