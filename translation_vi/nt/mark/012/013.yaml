source:
  edition: SBLGNT
  text: Καὶ ἀποστέλλουσιν πρὸς αὐτόν τινας τῶν Φαρισαίων καὶ τῶν Ἡρῳδιανῶν ἵνα αὐτὸν ἀγρεύσωσιν λόγῳ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/013.yaml
  text: And they send to him some of the Pharisees and some of the Herodians[a], so that they might trap him by a word.
translation:
  language: vi
  text: Rồi họ sai một số người thuộc phái Pha-ri-si và một số người thuộc phe Hê-rốt đến gặp Đức Giê-su, nhằm gài bẫy Ngài qua lời nói.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “để dùng chính lời Ngài nói mà gài bẫy Ngài.” Động từ Hy Lạp gợi hình ảnh săn bắt; cụm cuối cho biết họ định khiến Ngài mắc bẫy qua lời nói.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποστέλλουσιν
  choice: họ sai ... đến
  rationale: Dịch hiện tại lịch sử bằng lối kể quá khứ tự nhiên trong tiếng Việt; động từ “sai ... đến” diễn đạt rõ việc cử người đi.
- source_word: τινας τῶν Φαρισαίων καὶ τῶν Ἡρῳδιανῶν
  choice: một số người thuộc phái Pha-ri-si và phe Hê-rốt
  rationale: Giữ ý bộ phận của τινας với cả hai nhóm, đồng thời dùng cách gọi tự nhiên, dễ hiểu trong tiếng Việt.
- source_word: Φαρισαίων
  choice: phái Pha-ri-si
  rationale: Phiên âm tên nhóm Do Thái theo cách dùng quen thuộc trong tiếng Việt.
- source_word: Ἡρῳδιανῶν
  choice: phe Hê-rốt
  rationale: Chỉ nhóm những người ủng hộ hoặc gắn với triều Hê-rốt mà không áp đặt một định danh thần học cụ thể hơn.
- source_word: ἵνα
  choice: nhằm
  rationale: Diễn đạt rõ mục đích của hành động, tự nhiên và gọn trong tiếng Việt.
- source_word: ἀγρεύσωσιν
  choice: gài bẫy
  rationale: Giữ sắc thái ẩn dụ săn bắt của động từ và ý đồ thù nghịch muốn khiến Đức Giê-su mắc bẫy.
- source_word: λόγῳ
  choice: qua lời nói
  rationale: 'Diễn đạt phương tiện của việc gài bẫy, đồng thời giữ phạm vi tương đối rộng của λόγος: lời nói hoặc điều được nói ra.'
theological_decisions:
- issue: Chủ ngữ số nhiều không được nêu lại trong câu Hy Lạp
  choice: họ
  alternative: các thượng tế, kinh sư và trưởng lão; giới lãnh đạo
  rationale: Không đưa danh tính từ văn cảnh trước vào câu khi nguyên văn chỉ dùng động từ số nhiều với chủ ngữ hàm ẩn.
- issue: Đối tượng của hành động được biểu thị bằng đại từ αὐτόν
  choice: Đức Giê-su / Ngài
  alternative: ông / người
  rationale: Nêu tên ở lần đầu giúp câu tiếng Việt đứng độc lập và sáng nghĩa; “Ngài” ở lần sau tránh lặp, giữ văn phong trang trọng mà không thêm một kết luận thần học ngoài văn cảnh.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “Rồi” để nối mạch kể; “phái Pha-ri-si” và “phe Hê-rốt” phân biệt tự nhiên hai nhóm. Dấu chú thích [a] đặt sau mệnh đề mà chú thích giải thích.
