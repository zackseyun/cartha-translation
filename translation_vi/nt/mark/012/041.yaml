  text: Καὶ ⸀καθίσας ⸀κατέναντι τοῦ γαζοφυλακίου ἐθεώρει πῶς ὁ ὄχλος βάλλει χαλκὸν εἰς τὸ γαζοφυλάκιον· καὶ πολλοὶ πλούσιοι ἔβαλλον πολλά·
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/041.yaml
  text: And sitting opposite the treasury[a], he was watching how the crowd was putting money into the treasury; and many rich people were putting in much.
translation:
  language: vi
  text: Đức Giê-su ngồi xuống đối diện kho tiền dâng[a], quan sát cách đám đông đang bỏ tiền vào kho tiền dâng; và nhiều người giàu bỏ vào đó rất nhiều tiền.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “thùng tiền dâng” hoặc “hòm tiền dâng”; từ Hy Lạp có thể chỉ kho tiền của đền thờ hoặc các vật chứa tiền dâng gắn với kho ấy.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθίσας
  choice: ngồi xuống
  rationale: Phân từ bất định quá khứ diễn tả hành động xảy ra trước hành động chính; “ngồi xuống” tự nhiên trong tiếng Việt và giữ được diễn tiến của cảnh.
- source_word: κατέναντι
  choice: đối diện
  rationale: Diễn tả vị trí ở ngay phía đối diện, ngắn gọn và tự nhiên.
- source_word: γαζοφυλάκιον
  choice: kho tiền dâng
  rationale: Từ này có thể chỉ kho tiền của đền thờ hoặc các thùng tiếp nhận tiền dâng liên hệ với kho ấy. “Kho tiền dâng” giữ được nghĩa rộng, còn chú thích nêu khả năng cụ thể hơn.
- source_word: ἐθεώρει
  choice: quan sát
  rationale: Thì chưa hoàn thành cho thấy việc quan sát đang tiếp diễn; trong câu tiếng Việt, “quan sát xem” diễn đạt tự nhiên nét kéo dài này.
- source_word: πῶς
  choice: như thế nào
  rationale: Giữ trọng tâm vào cách thức hoặc quá trình người ta dâng tiền, thay vì chỉ nói rằng họ dâng.
- source_word: ὄχλος
  choice: đám đông
  rationale: Cách gọi hiện đại, dễ hiểu, phù hợp với danh từ tập hợp trong văn thuật chuyện.
- source_word: βάλλει / ἔβαλλον
  choice: bỏ ... vào
  rationale: Trong ngữ cảnh nộp tiền vào nơi tiếp nhận, “bỏ vào” là cách nói tự nhiên hơn nghĩa đen “ném”, đồng thời áp dụng phù hợp cho cả hai dạng động từ.
- source_word: χαλκόν
  choice: tiền
  rationale: Nghĩa đen là đồng/đồng thiếc, nhưng trong ngữ cảnh này chỉ tiền kim loại hay tiền xu nói chung; “tiền” tự nhiên và không làm câu nặng nề.
- source_word: πολλοὶ πλούσιοι
  choice: nhiều người giàu
  rationale: Giữ đúng nghĩa số nhiều và không thêm giới tính khi ngữ cảnh không đòi hỏi.
- source_word: πολλά
  choice: rất nhiều
  rationale: Trong ngữ cảnh tiền bạc, dạng trung tính số nhiều mang nghĩa một lượng lớn; “rất nhiều” tự nhiên và rõ nghĩa.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Đức Giê-su” để xác định rõ chủ thể theo văn cảnh; giữ “như thế nào” nhằm bảo tồn sắc thái của πῶς. Đại từ “đó” ở lần nhắc thứ hai tránh lặp nặng mà vẫn chỉ rõ kho tiền dâng.
