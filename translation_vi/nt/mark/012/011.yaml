  source_fidelity: 'Bản dịch chuyển tải đúng mệnh đề παρὰ κυρίου ἐγένετο αὕτη theo sắc thái nguồn gốc: “Việc này đến từ Chúa.” Cách này không cụ thể hóa αὕτη thành “hòn đá,” phù hợp với đại từ chỉ định trong nguyên văn và quan hệ của nó với toàn bộ điều vừa được nói. “Kỳ diệu trước mắt chúng ta” phản ánh θαυμαστὴ ἐν ὀφθαλμοῖς ἡμῶν cách trung thành và dễ hiểu.'
  naturalness: Câu văn tự nhiên trong tiếng Việt hiện đại, giữ được giọng trang trọng của câu trích Thi Thiên. “Trước mắt chúng ta” là một cách chuyển đạt thành ngữ có thể chấp nhận được và vẫn bảo toàn hình ảnh của nguyên văn. Dấu ngoặc kép đóng phù hợp vì đây là phần kết của lời trích dẫn đã bắt đầu ở câu trước.
  terminology: “Chúa” là cách dịch nhất quán và thích hợp cho κύριος trong văn bản Hy Lạp Tân Ước, kể cả khi câu trích Thi Thiên quy chiếu về Đức Chúa Trời. Chú thích a nêu khả năng sắc thái tác nhân mà không áp đặt nó lên chính văn; chú thích b xác định đúng nguồn trích dẫn.
