id: MRK.12.11
reference: Mark 12:11
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: παρὰ κυρίου ἐγένετο αὕτη, καὶ ἔστιν θαυμαστὴ ἐν ὀφθαλμοῖς ἡμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/011.yaml
  text: This came from the Lord[b][a], and it is marvelous in our eyes.
translation:
  language: vi
  text: Việc này đến từ Chúa[a], và thật kỳ diệu trước mắt chúng ta.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “do Chúa làm nên.” Cụm từ Hy Lạp có thể nhấn mạnh nguồn gốc hoặc tác nhân.'
    reason: lexical_alternative
  - marker: b
    text: Câu này trích Thi Thiên 118:23.
    reason: cross_reference
lexical_decisions:
- source_word: παρὰ κυρίου
  choice: đến từ Chúa
  rationale: παρά với sở hữu cách chủ yếu chỉ nguồn gốc; “đến từ Chúa” diễn đạt tự nhiên rằng việc này bắt nguồn từ Ngài, đồng thời không loại trừ sắc thái tác nhân.
- source_word: κυρίου
  choice: Chúa
  rationale: Trong câu trích dẫn Thi Thiên 118:23, từ này chỉ Đức Chúa Trời. “Chúa” bám sát κύριος của bản Hy Lạp Tân Ước mà không thay trực tiếp bằng cách trình bày danh riêng của Đức Chúa Trời trong bản Hê-bơ-rơ.
- source_word: ἐγένετο αὕτη
  choice: Việc này đến
  rationale: Cách diễn đạt này giữ đại từ chỉ định αὕτη không bị cụ thể hóa quá mức thành “hòn đá này”, và chuyển tải tự nhiên ý phát sinh hoặc có nguồn gốc của ἐγένετο trong kết cấu với παρὰ κυρίου.
- source_word: θαυμαστὴ
  choice: kỳ diệu
  rationale: “Kỳ diệu” diễn đạt điều đáng kinh ngạc, đáng thán phục, đồng thời giữ giọng trang trọng của lời Thi Thiên.
- source_word: ἐν ὀφθαλμοῖς ἡμῶν
  choice: trước mắt chúng ta
  rationale: Thành ngữ này vừa giữ hình ảnh về đôi mắt trong nguyên văn, vừa tự nhiên hơn “trong mắt chúng ta” trong tiếng Việt hiện đại.
theological_decisions:
- issue: Cách dịch κύριος trong lời trích Thi Thiên nói về Đức Chúa Trời
  choice: Chúa
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA HẰNG HỮU
  rationale: Bản Hy Lạp của Mác dùng κύριος. Dịch “Chúa” giữ cách gọi của văn bản Tân Ước và không đưa cách thể hiện danh thánh từ bản Hê-bơ-rơ vào chính văn.
- issue: Sắc thái nguồn gốc hay tác nhân trong παρὰ κυρίου
  choice: đến từ Chúa
  alternative: do Chúa làm nên
  rationale: “Đến từ Chúa” ưu tiên sắc thái nguồn gốc thường có của παρά với sở hữu cách, nhưng chú thích giữ lại khả năng hiểu theo tác nhân, tránh giải quyết dứt khoát một nét nghĩa có thể chồng lấn.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. “Việc này” giữ tham chiếu khái quát đến điều vừa được nói về hòn đá; “trước mắt chúng ta” bảo tồn hình ảnh Kinh Thánh mà vẫn tự nhiên. Dấu ngoặc kép đóng cho thấy đây là phần cuối của lời trích dẫn bắt đầu ở câu trước.
