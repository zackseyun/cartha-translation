id: MRK.12.30
reference: Mark 12:30
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἀγαπήσεις κύριον τὸν θεόν σου ἐξ ὅλης ⸀τῆς καρδίας σου καὶ ἐξ ὅλης τῆς ψυχῆς σου καὶ ἐξ ὅλης τῆς διανοίας σου καὶ ἐξ ὅλης τῆς ἰσχύος ⸀σου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/030.yaml
  text: And you shall love the Lord your God with all your heart and with all your soul and with all your mind and with all your strength[a][b][c].
translation:
  language: vi
  text: Ngươi phải yêu Chúa là Đức Chúa Trời của ngươi bằng cả lòng, cả linh hồn, cả trí óc và cả sức lực của ngươi.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Linh hồn” (ψυχῆς) cũng có thể dịch là “mạng sống”.
    reason: lexical_alternative
  - marker: b
    text: “Trí óc” (διανοίας) cũng có thể dịch là “sự hiểu biết”.
    reason: lexical_alternative
  - marker: c
    text: “Sức lực” (ἰσχύος) cũng có thể dịch là “sức mạnh”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγαπήσεις
  choice: phải yêu
  rationale: Thì tương lai trong lời trích dẫn điều răn mang sức mạnh mệnh lệnh. “Phải yêu” diễn đạt rõ nghĩa vụ trong tiếng Việt hiện đại mà không làm yếu sắc thái điều răn.
- source_word: κύριον τὸν θεόν σου
  choice: Chúa là Đức Chúa Trời của ngươi
  rationale: Giữ cả κύριον và θεόν cùng công thức giao ước “Chúa… Đức Chúa Trời của ngươi”; “là” giúp cụm từ tự nhiên và rõ nghĩa trong tiếng Việt.
- source_word: ἐξ ὅλης
  choice: hết
  rationale: Trong thành ngữ đi với các phương diện của con người, ἐξ ὅλης diễn tả sự trọn vẹn. “Hết” ngắn gọn, tự nhiên và cho phép giữ phép lặp nhấn mạnh của nguyên văn.
- source_word: καρδίας
  choice: lòng
  rationale: “Lòng” là cách diễn đạt tự nhiên trong tiếng Việt về trung tâm nội tâm, tình cảm và ý chí, đồng thời phù hợp với thành ngữ “hết lòng”.
- source_word: ψυχῆς
  choice: linh hồn
  rationale: ψυχή có thể chỉ linh hồn, mạng sống hoặc bản thân. “Linh hồn” giữ sự phân biệt giữa các phương diện được liệt kê mà không thu hẹp câu vào sự sống thể chất.
- source_word: διανοίας
  choice: trí óc
  rationale: διάνοια chỉ khả năng suy nghĩ và hiểu biết. “Trí óc” rõ ràng, hiện đại và phân biệt với “lòng”.
- source_word: ἰσχύος
  choice: sức lực
  rationale: ἰσχύς chỉ sức mạnh hay năng lực. “Sức lực” là cách nói tự nhiên khi diễn tả việc dốc toàn bộ sức mình.
- source_word: καὶ ... καὶ ... καὶ ... καὶ
  choice: và
  rationale: Tiếng Việt không tự nhiên nếu lặp “và” ở mọi vế như tiếng Hy Lạp; sự lặp lại “hết” ở từng thành phần vẫn bảo toàn nhịp tích lũy và sự nhấn mạnh vào tính toàn vẹn.
theological_decisions:
- issue: Cách dịch κύριος trong lời trích điều răn
  choice: Chúa
  alternative: CHÚA; Chủ
  rationale: Nguyên văn Hy Lạp dùng κύριος. “Chúa” vừa phản ánh cách dùng Tân Ước vừa giữ âm vang giao ước, mà không đưa quy ước viết hoa đặc biệt của bản Hê-bơ-rơ vào bản Hy Lạp.
- issue: Các thuật ngữ nhân học trong điều răn bốn vế
  choice: lòng / linh hồn / trí óc / sức lực
  alternative: lòng / mạng sống / sự hiểu biết / sức mạnh
  rationale: Giữ bốn thuật ngữ riêng biệt thay vì gộp thành một diễn giải chung về toàn thể con người, qua đó bảo toàn cấu trúc và độ căng ý nghĩa của nguyên văn.
- issue: Lực mệnh lệnh của ἀγαπήσεις
  choice: phải yêu
  alternative: hãy yêu; sẽ yêu
  rationale: Hình thức tương lai nằm trong lời điều răn nên có lực mệnh lệnh. “Phải yêu” làm rõ lực ấy, trong khi “sẽ yêu” dễ bị hiểu đơn thuần là dự báo.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ số ít “ngươi” giữ hình thức trực tiếp của điều răn và sắc thái Kinh Thánh; cấu trúc lặp “hết” truyền đạt sự tận hiến trọn vẹn trong từng phương diện.
