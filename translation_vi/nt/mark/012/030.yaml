  source_fidelity: 'Bản nháp truyền đạt đúng lực mệnh lệnh của ἀγαπήσεις và giữ đủ bốn phương diện: καρδία, ψυχή, διάνοια, ἰσχύς. Tuy nhiên, “mình” ở vế cuối không tương ứng nhất quán với đại từ sở hữu ngôi hai số ít được lặp lại trong tiếng Hy Lạp (σου), và cách dùng “hết” có thể được thay bằng cấu trúc tự nhiên hơn, vẫn phản ánh ἐξ ὅλης trong từng vế.'
