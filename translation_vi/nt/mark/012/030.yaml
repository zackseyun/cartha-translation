  terminology: Giữ “Chúa là Đức Chúa Trời của ngươi” cho κύριον τὸν θεόν σου, cùng các thuật ngữ “lòng / linh hồn / trí óc / sức lực”. Các chú thích từ vựng phù hợp với những nghĩa thay thế hợp lệ và được neo đúng chỗ.
