    rationale: '“Chẳng phải vì điều này mà ... sao: vì ...” là cấu trúc có thể hiểu được, nhưng “Các ông chẳng phải đang sai lầm vì điều này sao: vì ...” trôi chảy hơn và vẫn phản ánh câu hỏi tu từ cùng quan hệ nguyên nhân trong nguyên văn.'
  - severity: low
    issue: “Lầm lạc” có sắc thái lệch hướng tư tưởng/đạo lý mạnh hơn mức cần thiết.
    rationale: Trong ngữ cảnh Đức Giê-su sửa sai cách hiểu của người Sa-đu-sê, “đang sai lầm” là cách nói hiện đại, trực tiếp và vẫn để ngỏ phạm vi nghĩa của πλανᾶσθε.
