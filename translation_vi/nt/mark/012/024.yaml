  to: 'Đức Giê-su nói với họ: “Các ông chẳng phải đang sai lầm vì điều này sao: vì các ông không biết Kinh Thánh, cũng không biết quyền năng của Đức Chúa Trời?”'
  rationale: Chỉnh nhẹ nhằm tăng tính tự nhiên của tiếng Việt và tránh sắc thái quá mạnh ở “lầm lạc.” Bản sửa vẫn giữ nguyên câu hỏi tu từ, lời quở trách, và hai đối tượng mà họ không biết; không giải thích thêm bản chất sai lầm hay áp đặt cách hiểu giáo phái.
