  text: ⸂ἔφη αὐτοῖς ὁ Ἰησοῦς⸃· Οὐ διὰ τοῦτο πλανᾶσθε μὴ εἰδότες τὰς γραφὰς μηδὲ τὴν δύναμιν τοῦ θεοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/024.yaml
  text: 'Jesus said to them[a], “Is this not why you are mistaken: because you know neither the Scriptures nor the power of God?”'
translation:
  language: vi
  text: 'Đức Giê-su nói với họ: “Các ông chẳng phải đang sai lầm vì điều này sao: vì các ông không biết Kinh Thánh, cũng không biết quyền năng của Đức Chúa Trời?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔφη αὐτοῖς ὁ Ἰησοῦς
  choice: Đức Giê-su nói với họ
  rationale: φημί ở đây giới thiệu lời nói trực tiếp; “nói với họ” tự nhiên và không thêm sắc thái “trả lời” vốn không được động từ này biểu đạt rõ.
- source_word: Οὐ διὰ τοῦτο
  choice: Chẳng phải vì điều này mà ... sao
  rationale: Giữ hình thức câu hỏi tu từ với οὐ, đồng thời thể hiện quan hệ nguyên nhân của διά với đối cách.
- source_word: πλανᾶσθε
  choice: các ông lầm lạc
  rationale: Động từ có thể chỉ việc sai lầm hoặc bị dẫn đi sai đường. “Lầm lạc” giữ được cả sắc thái nhận thức lẫn định hướng mà không khẳng định tác nhân lừa dối.
- source_word: μὴ εἰδότες
  choice: vì các ông không biết
  rationale: Phân từ phủ định nêu căn nguyên của sự lầm lạc; chuyển thành mệnh đề nguyên nhân giúp câu tiếng Việt rõ và tự nhiên.
- source_word: τὰς γραφὰς
  choice: Kinh Thánh
  rationale: Số nhiều γραφαί trong bối cảnh Do Thái chỉ các sách thánh được nhìn nhận; “Kinh Thánh” là cách gọi quen thuộc và chính xác trong tiếng Việt.
- source_word: μηδὲ τὴν δύναμιν τοῦ θεοῦ
  choice: cũng không biết quyền năng của Đức Chúa Trời
  rationale: μηδέ nối yếu tố phủ định thứ hai; lặp lại “không biết” để câu tiếng Việt minh bạch. δύναμις là “quyền năng”, còn τοῦ θεοῦ được giữ bằng cấu trúc “của Đức Chúa Trời”.
theological_decisions:
- issue: Sắc thái của πλανᾶσθε
  choice: lầm lạc
  alternative: nhầm lẫn; bị dẫn đi sai đường
  rationale: Ngữ cảnh nói đến sai lầm của nhóm Sa-đu-sê về sự sống lại, Kinh Thánh và quyền năng của Đức Chúa Trời. “Lầm lạc” giữ lời quở trách mạnh hơn “nhầm lẫn” nhưng không xác quyết rằng họ bị một tác nhân bên ngoài lừa dối.
- issue: Quan hệ giữa sự lầm lạc và việc không biết
  choice: 'diễn đạt μὴ εἰδότες như nguyên nhân: “vì các ông không biết”'
  alternative: “do không biết” hoặc giữ dạng phân từ gần nghĩa “không biết...”
  rationale: Phân từ có thể được hiểu là nêu căn nguyên hay hoàn cảnh đi kèm. Trong câu hỏi này, cách diễn đạt nguyên nhân phù hợp với διὰ τοῦτο và vẫn giữ mối liên hệ mà bản Hy Lạp trình bày.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “các ông” để phù hợp với lời Đức Giê-su trực tiếp nói với nhóm Sa-đu-sê; dùng “Đức Giê-su” và “Đức Chúa Trời” theo lối gọi kính trọng phổ biến. Cấu trúc câu hỏi tu từ được giữ nguyên.
