  to: 'Điều răn thứ hai là: “Ngươi phải yêu người lân cận của mình như chính mình.” Không có điều răn nào khác lớn hơn những điều này.[a]'
  rationale: Hiệu đính tối thiểu “người lân cận” thành “người lân cận của mình” để phản ánh σου (“của ngươi”). Các yếu tố khác, gồm dạng số nhiều “những điều này” và chú thích giải thích sở chỉ trong ngữ cảnh, được giữ nguyên để bảo toàn mức độ hàm ẩn của nguyên văn.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T08:59:33Z'
