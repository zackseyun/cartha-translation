  source_fidelity: 'Bản dịch chuyển đạt đúng cấu trúc: điều răn thứ hai, mệnh lệnh yêu thương, và mệnh đề phủ định so sánh với đại từ số nhiều quy chiếu theo ngữ cảnh đến hai điều răn. Tuy nhiên, sở hữu cách σου trong τὸν πλησίον σου nên được biểu thị rõ bằng “của mình”; bản nháp hiện tại có thể được hiểu là nói chung về người lân cận và làm yếu liên hệ trực tiếp với chủ thể “ngươi”.'
