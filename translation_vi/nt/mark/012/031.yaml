source:
  edition: SBLGNT
  text: ⸀δευτέρα αὕτη· Ἀγαπήσεις τὸν πλησίον σου ὡς σεαυτόν. μείζων τούτων ἄλλη ἐντολὴ οὐκ ἔστιν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/031.yaml
  text: 'The second is this: ‘You shall love your neighbor as yourself.’ There is no other commandment greater than these[a].'
translation:
  language: vi
  text: 'Điều răn thứ hai là: “Ngươi phải yêu người lân cận của mình như chính mình.” Không có điều răn nào khác lớn hơn những điều này.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Những điều này” theo ngữ cảnh chỉ chung hai điều răn.
    reason: Làm rõ sở chỉ của đại từ số nhiều mà không thay lời giải thích vào chính văn.
lexical_decisions:
- source_word: δευτέρα αὕτη
  choice: Điều răn thứ hai là
  rationale: Cụm Hy Lạp tỉnh lược danh từ nhưng theo ngữ cảnh rõ ràng nói đến điều răn thứ hai. Bổ sung “điều răn” giúp câu tiếng Việt tự nhiên mà không thêm ý mới.
- source_word: Ἀγαπήσεις
  choice: Ngươi phải yêu
  rationale: Thì tương lai trong lời trích Kinh Thánh mang chức năng mệnh lệnh. “Phải yêu” truyền đạt sức ràng buộc của mệnh lệnh, còn “ngươi” giữ ngôi thứ hai số ít của câu trích.
- source_word: τὸν πλησίον σου
  choice: người lân cận
  rationale: “Người lân cận” là cách diễn đạt quen thuộc, chính xác trong ngữ cảnh đạo đức và giữ liên hệ với Lê-vi Ký 19:18.
- source_word: ὡς σεαυτόν
  choice: như chính mình
  rationale: Cách dịch ngắn gọn này bám sát phép so sánh trong tiếng Hy Lạp và không thêm động từ giải thích.
- source_word: μείζων τούτων ἄλλη ἐντολὴ οὐκ ἔστιν
  choice: Không có điều răn nào khác lớn hơn những điều này
  rationale: Giữ nguyên ý so sánh của μείζων, ý phủ định và dạng số nhiều của τούτων; câu đồng thời tự nhiên trong tiếng Việt.
- source_word: ἐντολή
  choice: điều răn
  rationale: “Điều răn” phù hợp văn cảnh Kinh Thánh và sắc thái giao ước hơn “mệnh lệnh” hay “lệnh”.
theological_decisions:
- issue: Sở chỉ của τούτων (“những điều này”) ở mệnh đề cuối
  choice: Giữ đại từ số nhiều “những điều này”, theo ngữ cảnh chỉ chung hai điều răn
  alternative: Diễn giải rõ thành “hai điều răn này” hoặc hiểu là chỉ điều răn thứ hai vừa nêu
  rationale: Dạng số nhiều trong nguyên văn tự nhiên quy chiếu đến hai điều răn được bàn trong ngữ cảnh. Tuy nhiên, không đổi đại từ thành lời giải nghĩa rõ hơn giúp bản dịch giữ nguyên hình thức và mức độ hàm ẩn của tiếng Hy Lạp.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. “Ngươi” được dùng trong lời trích trực tiếp để giữ ngôi thứ hai số ít và sắc thái Kinh Thánh; cấu trúc câu tránh diễn giải giáo phái.
