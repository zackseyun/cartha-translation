  terminology: “Điều răn,” “yêu,” và “người lân cận” đều phù hợp ngữ cảnh trích dẫn Lê-vi Ký và register Kinh Thánh. “Những điều này” bảo toàn số nhiều của τούτων mà không diễn giải quá mức trong chính văn.
  issues:
