source:
  edition: SBLGNT
  text: οἱ κατεσθίοντες τὰς οἰκίας τῶν χηρῶν καὶ προφάσει μακρὰ προσευχόμενοι· οὗτοι λήμψονται περισσότερον κρίμα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/040.yaml
  text: who devour widows’ houses and for appearance’s sake pray at length—these will receive greater condemnation[a][b].
translation:
  language: vi
  text: Họ nuốt chửng nhà cửa của các góa phụ và, để làm bộ, cầu nguyện lâu. Những người ấy sẽ chịu sự kết án nặng hơn[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “sẽ chịu sự phán xét nặng hơn.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κατεσθίοντες
  choice: nuốt chửng
  rationale: Giữ hình ảnh mạnh và sắc thái tham tàn của động từ Hy Lạp, thay vì diễn giải phẳng thành “bóc lột”.
- source_word: τὰς οἰκίας
  choice: nhà cửa
  rationale: Giữ hình ảnh cụ thể của nguyên文, đồng thời “nhà cửa” trong tiếng Việt có thể tự nhiên gợi cả cơ nghiệp hay gia sản của các góa phụ.
- source_word: τῶν χηρῶν
  choice: của các góa phụ
  rationale: Phản ánh trực tiếp sở hữu cách số nhiều và xác định rõ nhóm người dễ bị tổn thương là nạn nhân.
- source_word: προφάσει
  choice: giả bộ
  rationale: Diễn đạt tự nhiên ý hành động làm ra vẻ, lấy việc cầu nguyện làm sự phô trương hoặc bình phong; không buộc câu theo một sắc thái duy nhất như “lấy cớ”.
- source_word: μακρὰ προσευχόμενοι
  choice: cầu nguyện dài dòng
  rationale: Chuyển tải việc cầu nguyện kéo dài với sắc thái phê phán tự nhiên trong tiếng Việt; không hàm ý rằng mọi lời cầu nguyện dài đều sai, vì προφάσει chi phối lời quở trách.
- source_word: λήμψονται
  choice: sẽ chịu
  rationale: Trong ngữ cảnh phán xét, tiếng Việt tự nhiên nói “chịu sự kết án” hơn là dịch máy móc “nhận sự kết án”.
- source_word: περισσότερον
  choice: nặng hơn
  rationale: Diễn đạt tự nhiên mức độ nghiêm trọng hơn của κρίμα, đồng thời giữ nguyên yếu tố so sánh mà không xác định đối tượng so sánh vốn không được nói rõ trong câu.
- source_word: κρίμα
  choice: sự kết án
  rationale: Trong lời cảnh báo này, danh từ mang sắc thái phán quyết bất lợi và trừng phạt; “sự kết án” thể hiện rõ ngữ cảnh hơn “sự phán xét”.
theological_decisions:
- issue: Sắc thái của κρίμα trong lời cảnh báo về sự đạo đức giả
  choice: sự kết án
  alternative: sự phán xét
  rationale: Ngữ cảnh nói đến một phán quyết bất lợi có mức độ “nặng hơn,” nên “sự kết án” phù hợp; chú thích vẫn bảo tồn nghĩa rộng hơn có thể có của từ Hy Lạp.
- issue: Đối tượng ngầm của phép so sánh περισσότερον
  choice: giữ “nặng hơn” mà không bổ sung đối tượng
  alternative: diễn giải là “bị kết án nặng hơn những người khác”
  rationale: Nguyên văn không nói rõ họ bị kết án nặng hơn ai hoặc theo chuẩn nào; không nên tự ý giải quyết sự bỏ lửng này.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và dễ hiểu. “Nuốt chửng nhà cửa” giữ phép ẩn dụ sống động; “giả bộ cầu nguyện dài dòng” truyền đạt tự nhiên sự phô trương giả hình. Dấu chú thích [a] được đặt ngay sau mệnh đề liên quan.
