revisions:
- from: Họ nuốt chửng nhà cửa của các góa phụ, lại giả bộ cầu nguyện dài dòng. Những người ấy sẽ chịu sự kết án nặng hơn.[a]
  to: Họ nuốt chửng nhà cửa của các góa phụ và, để làm bộ, cầu nguyện lâu. Những người ấy sẽ chịu sự kết án nặng hơn[a].
  rationale: Chỉnh sửa tối thiểu để phân biệt rõ việc cầu nguyện lâu nhằm làm bộ với ý niệm cầu nguyện giả tạo hoặc nói năng dài dòng. Giữ nguyên hình ảnh “nuốt chửng nhà cửa,” tính so sánh bỏ lửng của “nặng hơn,” và sắc thái phán quyết bất lợi của κρίμα.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T08:59:33Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch nhìn chung phản ánh đúng cấu trúc và ý nghĩa của nguyên văn: hình ảnh mạnh của κατεσθίοντες, đối tượng là nhà cửa/cơ nghiệp của các góa phụ, mức độ so sánh của περισσότερον, và sắc thái kết án của κρίμα đều được giữ lại. Tuy nhiên, “giả bộ cầu nguyện dài dòng” có thể gợi rằng việc cầu nguyện tự nó hoàn toàn giả tạo hoặc rằng lỗi nằm ở lối nói rườm rà. προφάσει nhấn vào động cơ làm bộ/lấy cớ, còn μακρὰ nhấn vào thời lượng cầu nguyện.'
  naturalness: “Nuốt chửng nhà cửa” và “chịu sự kết án nặng hơn” tự nhiên trong văn phong Kinh Thánh tiếng Việt hiện đại. Cụm “để làm bộ, ... cầu nguyện lâu” truyền đạt trực tiếp hơn quan hệ giữa προφάσει và μακρὰ, đồng thời tránh sắc thái không cần thiết của “dài dòng.” Dấu chú thích nên neo ngay sau “sự kết án nặng hơn,” là từ được chú thích.
  terminology: “Góa phụ,” “cầu nguyện,” và “sự kết án” phù hợp với văn phong trang nghiêm và với ngữ cảnh cảnh cáo. Chú thích “sự phán xét” bảo tồn lựa chọn từ vựng rộng hơn cho κρίμα mà không làm suy giảm bản văn chính.
  issues:
