source:
  edition: SBLGNT
  text: ⸀καὶ εἶπεν αὐτῷ ὁ γραμματεύς· Καλῶς, διδάσκαλε, ἐπ’ ἀληθείας εἶπες ὅτι εἷς ἐστιν καὶ οὐκ ἔστιν ἄλλος πλὴν αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/032.yaml
  text: And the scribe said to him[a], “Well said, Teacher. You have spoken truly that he is one, and there is no other besides him.”
translation:
  language: vi
  text: 'Một thầy thông giáo nói với Đức Giê-su: “Thưa Thầy, Thầy nói rất đúng; quả thật, Ngài là một, không có ai khác ngoài Ngài.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc nói rõ hơn theo ngữ cảnh: “Đức Chúa Trời là một.” Tiếng Hy Lạp chỉ nói “Ngài là một”; chủ thể được hiểu từ ngữ cảnh ngay trước đó.'
    reason: alternative_reading
lexical_decisions:
- source_word: γραμματεύς
  choice: viên kinh luật
  rationale: Chỉ một người thuộc giới chuyên chép, nghiên cứu và giảng giải Kinh Luật; cách gọi này ngắn gọn, có sắc thái chức danh và ít diễn giải hơn “thầy dạy luật”.
- source_word: Καλῶς
  choice: nói đúng
  rationale: Trong lời đáp tán đồng, từ này xác nhận lời vừa nói là đúng; cách diễn đạt tự nhiên trong tiếng Việt hiện đại.
- source_word: διδάσκαλε
  choice: Thầy
  rationale: Lối xưng hô tự nhiên dành cho một người dạy dỗ, tương ứng trực tiếp với danh từ Hy Lạp ở hô cách.
- source_word: ἐπ’ ἀληθείας
  choice: và thật
  rationale: Giữ riêng ý nhấn mạnh rằng lời Đức Giê-su nói là chân thật, thay vì để Καλῶς một mình gánh cả hai sắc thái.
- source_word: εἶπες
  choice: Thầy nói
  rationale: Thì quá khứ đơn của tiếng Hy Lạp chỉ lời vừa được nói; tiếng Việt không cần đánh dấu thì và cách này phù hợp hội thoại.
- source_word: ὅτι
  choice: rằng
  rationale: Dẫn nội dung của lời Đức Giê-su, không diễn tả nguyên nhân.
- source_word: εἷς ἐστιν
  choice: Ngài là một
  rationale: Giữ cấu trúc tỉnh lược của nguyên bản, trong đó chủ thể là Đức Chúa Trời được hiểu từ ngữ cảnh trước, thay vì thêm danh từ không hiện diện trong câu.
- source_word: οὐκ ἔστιν ἄλλος
  choice: không có ai khác
  rationale: Diễn đạt tự nhiên cấu trúc tồn tại phủ định; “ai” phù hợp với quy chiếu hữu ngôi trong αὐτοῦ theo sau.
- source_word: πλὴν αὐτοῦ
  choice: ngoài Ngài
  rationale: Thể hiện ý ngoại trừ/loại trừ của πλήν với sở hữu cách; “Ngài” thống nhất với chủ thể được hiểu là Đức Chúa Trời.
theological_decisions:
- issue: Chủ thể ngầm trong εἷς ἐστιν
  choice: Giữ cách nói “Ngài là một” trong chính văn.
  alternative: “Đức Chúa Trời là một” hoặc “chỉ có một Đức Chúa Trời”.
  rationale: Ngữ cảnh xác định rõ chủ thể là Đức Chúa Trời, nhưng câu Hy Lạp không lặp lại θεός. Bản dịch giữ sự tỉnh lược của nguồn và giải thích rõ hơn trong chú thích.
- issue: Ý nghĩa của “một”
  choice: Giữ vị ngữ “là một” mà không diễn giải thêm.
  alternative: “là Đức Chúa Trời duy nhất” hoặc “chỉ có một mình Ngài”.
  rationale: Cách dịch này bảo toàn hình thức và sức căng thần học của lời tuyên xưng, không quyết định thay độc giả rằng “một” chủ yếu nói về tính duy nhất, sự hiệp nhất hay cả hai.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Giê-su” để nhận diện nhân vật trong lời kể; trong lời thoại, dùng cặp xưng hô kính trọng “Thầy”. Đại từ “Ngài” viết hoa vì quy chiếu đến Đức Chúa Trời, đồng thời giúp câu tỉnh lược vẫn rõ nghĩa. Dấu chú thích [a] được đặt sau câu có cách đọc cần giải thích.
