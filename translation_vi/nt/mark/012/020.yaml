base_translation:
  language: en
  yaml_path: translation/nt/mark/012/020.yaml
  text: There were seven brothers; and the first took a wife[a], and when he died he left no offspring.
translation:
  language: vi
  text: Có bảy anh em trai; người thứ nhất lấy vợ, nhưng khi chết thì không để lại con cái[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn Hy Lạp là “hạt giống”, được dùng theo nghĩa thành ngữ để chỉ con cái hoặc hậu duệ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἑπτὰ ἀδελφοὶ ἦσαν
  choice: Có bảy anh em
  rationale: Diễn đạt tự nhiên cấu trúc tồn tại trong tiếng Việt; ngữ cảnh cho thấy đây là bảy anh em trai nên không cần thêm từ giải thích.
- source_word: ὁ πρῶτος
  choice: người thứ nhất
  rationale: Giữ đúng ý chỉ thứ tự trong nhóm; không dịch là “người anh cả” vì nguyên văn không nhất thiết nói về tuổi tác.
- source_word: ἔλαβεν γυναῖκα
  choice: lấy vợ
  rationale: Đây là thành ngữ chỉ việc kết hôn; “lấy vợ” tự nhiên, rõ nghĩa và gần với hình thức của nguyên văn.
- source_word: ἀποθνῄσκων
  choice: khi qua đời
  rationale: Chuyển phân từ hiện tại thành mệnh đề thời gian tự nhiên trong tiếng Việt, giữ mối liên hệ với việc không để lại dòng dõi.
- source_word: οὐκ ἀφῆκεν
  choice: không để lại
  rationale: Trong ngữ cảnh người đã chết, động từ mang nghĩa không để lại phía sau.
- source_word: σπέρμα
  choice: dòng dõi
  rationale: Từ này theo nghĩa đen là “hạt giống” nhưng trong bối cảnh gia đình và luật hôn nhân chỉ con cái hoặc hậu duệ; “dòng dõi” giữ được phạm vi rộng hơn từ “con”.
theological_decisions: []
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “qua đời” thay cho “chết” để câu văn tự nhiên, dignified mà không làm thay đổi nội dung; giữ dấu chấm phẩy để phản ánh ranh giới mệnh đề của nguyên văn.
