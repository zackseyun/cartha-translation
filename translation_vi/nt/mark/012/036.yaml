- from: 'Chính Đa-vít đã nói trong Đức Thánh Linh[a]: “Chúa phán với Chúa của tôi[b]: ‘Hãy ngồi bên phải Ta cho đến khi Ta đặt các kẻ thù của Con dưới chân Con.’”'
  to: 'Chính Đa-vít đã nói trong Đức Thánh Linh[a]: “Chúa phán với Chúa của tôi[b]: ‘Hãy ngồi bên phải Ta cho đến khi Ta đặt các kẻ thù của ngươi dưới chân ngươi.’”'
  rationale: 'Chỉ sửa đại từ «Con» thành «ngươi» ở cả hai chỗ để không thêm quan hệ mà nguyên ngữ không nêu, đồng thời chỉnh một chi tiết diễn đạt trong chú thích b. Các dấu chú thích vẫn được neo đúng: [a] tại «Đức Thánh Linh» và [b] tại «Chúa của tôi».'
