language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸀αὐτὸς Δαυὶδ εἶπεν ἐν ⸂τῷ πνεύματι τῷ⸃ ἁγίῳ· ⸀Εἶπεν ⸀κύριος τῷ κυρίῳ μου· ⸀Κάθου ἐκ δεξιῶν μου ἕως ἂν θῶ τοὺς ἐχθρούς σου ⸀ὑποκάτω τῶν ποδῶν σου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/036.yaml
  text: David himself said in the Holy Spirit[a], ‘The Lord said to my Lord[b], “Sit at my right hand until I put your enemies under your feet.”’
translation:
  language: vi
  text: 'Chính Đa-vít đã nói trong Đức Thánh Linh[a]: “Chúa phán với Chúa của tôi[b]: ‘Hãy ngồi bên phải Ta cho đến khi Ta đặt các kẻ thù của ngươi dưới chân ngươi.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “nhờ Đức Thánh Linh.”'
    reason: alternative_reading
  - marker: b
    text: Lời trích dẫn lấy từ Thi Thiên 110:1. Trong bản Hê-bơ-rơ, từ “Chúa” thứ nhất đại diện cho danh Đức Chúa Trời (YHWH, theo truyền thống được dịch là “ĐỨC CHÚA”), còn từ thứ hai chỉ chúa của Đa-vít.
    reason: cross_reference
lexical_decisions:
- source_word: αὐτὸς Δαυὶδ
  choice: Chính Đa-vít
  rationale: Đại từ nhấn mạnh αὐτός làm nổi bật rằng chính Đa-vít là người nói; “Chính Đa-vít” tự nhiên và giữ được sắc thái nhấn mạnh trong tiếng Việt.
- source_word: ἐν τῷ πνεύματι τῷ ἁγίῳ
  choice: trong Đức Thánh Linh
  rationale: Giữ cách diễn đạt trực tiếp của ἐν với tặng cách và không thu hẹp ý nghĩa thành một cơ chế linh hứng cụ thể; phương án “nhờ Đức Thánh Linh” được ghi ở chú thích.
- source_word: κύριος
  choice: Chúa
  rationale: “Chúa” là từ tương đương trang trọng và quen thuộc của κύριος trong văn cảnh Kinh Thánh. Bản văn Hy Lạp dùng cùng một từ cho cả hai lần.
- source_word: τῷ κυρίῳ μου
  choice: với Chúa của tôi
  rationale: Giữ sự lặp lại của κύριος và quan hệ sở hữu trong μου, cần thiết cho lập luận của Chúa Giê-su trong văn cảnh.
- source_word: Κάθου
  choice: Hãy ngồi
  rationale: Chuyển mệnh lệnh hiện tại bằng lối nói tự nhiên, trang trọng trong tiếng Việt và phù hợp với hình ảnh đăng quang.
- source_word: ἐκ δεξιῶν μου
  choice: bên phải Ta
  rationale: Đây là thành ngữ chỉ vị trí danh dự ở phía bên phải; “bên phải Ta” rõ nghĩa và tự nhiên hơn cách dịch từng chữ của giới từ ἐκ.
- source_word: ἕως ἂν θῶ
  choice: cho đến khi Ta đặt
  rationale: Diễn đạt đúng giới hạn thời gian hướng đến hành động tương lai mà cấu trúc ἕως ἂν với giả định cách nêu ra.
- source_word: ὑποκάτω τῶν ποδῶν σου
  choice: dưới chân Con
  rationale: Bám sát cách nói của Mác là “dưới chân,” không thêm hình ảnh “bệ chân” từ dạng đầy đủ hơn của câu Thi Thiên.
theological_decisions:
- issue: Công thức nói tiên tri của Đa-vít
  choice: Chính Đa-vít đã nói trong Đức Thánh Linh
  alternative: Chính Đa-vít đã nói nhờ Đức Thánh Linh
  rationale: Cách dịch chính giữ hình thức gần với tiếng Hy Lạp và khẳng định vai trò của Đức Thánh Linh mà không xác định hẹp hơn phương thức Ngài tác động.
- issue: Sức nặng Kitô học của trích dẫn Thi Thiên 110:1
  choice: Chúa phán với Chúa của tôi
  alternative: ĐỨC CHÚA phán với Chúa của tôi
  rationale: Bản văn Hy Lạp dùng κύριος ở cả hai vị trí, nên bản chính giữ “Chúa” cho cả hai. Việc từ thứ nhất đại diện cho danh YHWH trong nguyên bản Hê-bơ-rơ được nêu trong chú thích thay vì được đưa trực tiếp vào bản văn Hy Lạp.
- issue: Đại từ trong lời phán trực tiếp
  choice: Ta / Con
  alternative: tôi / ngài hoặc Ta / ngươi
  rationale: “Ta / Con” giúp phân biệt tự nhiên các ngôi trong lời phán trang trọng bằng tiếng Việt, nhưng không nhằm xác định bản thể hay quan hệ ngoài điều văn cảnh phát biểu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Thánh Linh” theo cách gọi phổ biến trong tiếng Việt; giữ “Chúa” ở cả hai lần κύριος để phản ánh bản Hy Lạp. Các dấu chú thích [a], [b] đều xuất hiện trong bản chính và nội dung chú thích được sắp đúng với điểm mà chúng giải thích.
