  text: ⸀καὶ λαβόντες αὐτὸν ἔδειραν καὶ ἀπέστειλαν κενόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/003.yaml
  text: And they took him[a], beat him, and sent him away empty-handed.
translation:
  language: vi
  text: Họ bắt người đầy tớ ấy, đánh đập rồi sai người ấy về tay không.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λαβόντες
  choice: bắt
  rationale: Phân từ bất định quá khứ diễn tả hành động xảy ra trước các động từ chính. Trong ngữ cảnh các tá điền hành hung đầy tớ, “bắt” tự nhiên và thể hiện đủ sức mạnh của hành động mà không hàm ý quá mức như “tóm lấy” hay “bắt giữ”.
- source_word: ἔδειραν
  choice: đánh đập
  rationale: Động từ δέρω chỉ việc đánh hoặc hành hung. “Đánh đập” là cách nói rõ ràng, tự nhiên trong tiếng Việt và không cụ thể hóa thành một hình thức trừng phạt chính thức như “đánh roi”.
- source_word: ἀπέστειλαν
  choice: đuổi về
  rationale: Động từ ἀποστέλλω cơ bản nghĩa là sai hoặc gửi đi; trong ngữ cảnh sau khi đầy tớ bị hành hung, “đuổi về” diễn đạt tự nhiên việc họ cho người ấy ra về, đồng thời đích đến ngầm hiểu là trở lại với chủ.
- source_word: κενόν
  choice: tay không
  rationale: Tính từ κενός, ở đối cách số ít giống đực, bổ nghĩa theo vị ngữ cho người đầy tớ và theo nghĩa đen là “trống không.” Ở đây nó cho biết người ấy trở về mà không nhận được gì; thành ngữ “tay không” truyền đạt chính xác và tự nhiên ý này.
- source_word: καὶ ... καὶ
  choice: ', ... rồi ...'
  rationale: Các liên từ καί nối những hành động theo trình tự kể chuyện. Tiếng Việt tự nhiên dùng dấu phẩy và “rồi” để thể hiện chuỗi hành động mà vẫn giữ nhịp văn ngắn gọn.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Câu giữ trình tự hành động của nguyên văn Hy Lạp, đồng thời dùng các cách diễn đạt tiếng Việt tự nhiên như “đánh đập,” “đuổi về” và “tay không.”
