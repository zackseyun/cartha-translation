  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Καὶ ἤρξατο αὐτοῖς ἐν παραβολαῖς ⸀λαλεῖν· Ἀμπελῶνα ⸂ἄνθρωπος ἐφύτευσεν⸃, καὶ περιέθηκεν φραγμὸν καὶ ὤρυξεν ὑπολήνιον καὶ ᾠκοδόμησεν πύργον, καὶ ἐξέδετο αὐτὸν γεωργοῖς, καὶ ἀπεδήμησεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/001.yaml
  text: 'And he began to speak to them in parables: “A man planted a vineyard[a], and put a fence around it, and dug a winepress pit, and built a tower, and leased it to tenant farmers[d][c][b], and went away.”'
translation:
  language: vi
  text: 'Ngài bắt đầu nói với họ bằng các dụ ngôn: “Có một người trồng một vườn nho, làm hàng rào bao quanh[a], đào một hố hứng nước nho ép[b] và xây một cái tháp[d]. Ông cho những người canh tác thuê vườn nho ấy[c], rồi đi xa.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “làm một hàng cây bao quanh.” Từ Hy Lạp φραγμός có thể chỉ hàng rào, hàng cây hoặc một vật ngăn bao quanh.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “đào một bể dưới bàn ép nho.” Từ Hy Lạp ὑπολήνιον chỉ hố hoặc bể phía dưới dùng để hứng nước nho chảy ra khi ép.
    reason: lexical_alternative
  - marker: c
    text: Cũng có thể dịch là “cho các tá điền thuê” hoặc “cho những người trồng nho thuê.”
    reason: lexical_alternative
  - marker: d
    text: Hình ảnh này gợi lại Ê-sai 5:1–2, nơi có một vườn nho được trồng, bao quanh, có hố ép nho và tháp.
    reason: cross_reference
lexical_decisions:
- source_word: ἤρξατο αὐτοῖς ἐν παραβολαῖς λαλεῖν
  choice: Ngài bắt đầu dùng các dụ ngôn mà nói với họ
  rationale: Diễn đạt tự nhiên cấu trúc khởi đầu ἤρξατο + động từ nguyên mẫu, đồng thời giữ hình thức số nhiều của παραβολαῖς. “Dùng các dụ ngôn mà nói” tự nhiên hơn lối dịch sát chữ “nói trong các dụ ngôn” trong tiếng Việt.
- source_word: Ἀμπελῶνα ἄνθρωπος ἐφύτευσεν
  choice: Có một người trồng một vườn nho
  rationale: Giữ nhân vật là một người nam trong câu chuyện và chuyển trật tự Hy Lạp sang trật tự kể chuyện tự nhiên của tiếng Việt.
- source_word: περιέθηκεν φραγμόν
  choice: làm hàng rào bao quanh
  rationale: φραγμός chỉ vật ngăn hoặc ranh giới bao quanh, có thể là hàng rào hay hàng cây; “hàng rào” rõ nghĩa và tự nhiên trong tiếng Việt hiện đại.
- source_word: ὤρυξεν ὑπολήνιον
  choice: đào một hố chứa nước nho ép
  rationale: ὑπολήνιον là hố hoặc bể phía dưới dùng để hứng nước nho từ bàn ép. Cách dịch này vừa thể hiện hành động đào vừa giúp độc giả hiểu công dụng của hố.
- source_word: ᾠκοδόμησεν πύργον
  choice: xây một cái tháp
  rationale: Dịch trực tiếp πύργος mà không xác định thêm đó là tháp canh, vì chức năng ấy tuy phù hợp bối cảnh nhưng không được nói rõ trong từ Hy Lạp.
- source_word: ἐξέδετο αὐτὸν γεωργοῖς
  choice: cho những người canh tác thuê vườn nho ấy
  rationale: ἐξέδετο nói đến việc cho thuê tài sản; γεωργοί là những người canh tác. Cụm từ này làm rõ quan hệ chủ sở hữu–người thuê mà không dùng từ “tá điền” có sắc thái cổ hoặc dễ gắn riêng với ruộng lúa.
- source_word: ἀπεδήμησεν
  choice: đi xa
  rationale: ἀποδημέω chỉ việc rời nơi cư trú và đi đến nơi khác, thường trong một thời gian. “Đi xa” ngắn gọn và tự nhiên, không thêm ý cụ thể về mục đích chuyến đi.
theological_decisions:
- issue: Chủ ngữ ẩn của ἤρξατο
  choice: Ngài
  alternative: Đức Chúa Jêsus
  rationale: Bản Hy Lạp chỉ dùng chủ ngữ hàm ẩn nối tiếp văn cảnh. “Ngài” duy trì mạch văn và không lặp tên Chúa Jêsus vốn không xuất hiện trong câu này.
- issue: Mức độ cụ thể của γεωργοῖς
  choice: những người canh tác
  alternative: tá điền; những người trồng nho
  rationale: Bản dịch giữ nghĩa nghề nghiệp rộng của γεωργοί, còn quan hệ thuê đất được thể hiện qua động từ “cho thuê”. Như vậy vẫn bảo toàn sự phân biệt giữa chủ vườn và người thuê mà không thu hẹp từ thành một chức danh xã hội quá chuyên biệt.
- issue: Âm vang Ê-sai 5:1–2
  choice: Giữ hình ảnh trong chính văn và ghi chú liên hệ
  alternative: Giải thích trực tiếp rằng vườn nho tượng trưng cho Y-sơ-ra-ên
  rationale: Các chi tiết vườn nho, hàng rào, hố ép nho và tháp rõ ràng gợi lại Ê-sai 5, nhưng Mác 12:1 không giải nghĩa biểu tượng ngay tại đây. Ghi chú liên hệ bảo tồn âm vang Kinh Thánh mà không áp đặt cách giải nghĩa vào chính văn.
translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng hiện đại, câu văn rõ ràng đối với độc giả phổ thông. Dùng “Ngài” theo mạch văn chỉ Chúa Jêsus; tránh từ ngữ quá cổ. Các hành động chuẩn bị vườn nho được sắp thành chuỗi nhịp nhàng, còn việc cho thuê và đi xa được tách nhẹ để làm rõ diễn tiến.
