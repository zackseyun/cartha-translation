- from: 'Ngài bắt đầu dùng các dụ ngôn mà nói với họ: “Có một người trồng một vườn nho, làm hàng rào bao quanh[a], đào một hố chứa nước nho ép[b] và xây một cái tháp[d]. Ông cho những người canh tác thuê vườn nho ấy[c], rồi đi xa.”'
  to: 'Ngài bắt đầu nói với họ bằng các dụ ngôn: “Có một người trồng một vườn nho, làm hàng rào bao quanh[a], đào một hố hứng nước nho ép[b] và xây một cái tháp[d]. Ông cho những người canh tác thuê vườn nho ấy[c], rồi đi xa.”'
  rationale: Sửa chú thích a để phương án từ vựng không thay đổi hành động của nguyên văn. Điều chỉnh câu mở đầu theo lối diễn đạt tiếng Việt hiện đại hơn mà vẫn giữ nghĩa “bắt đầu nói ... bằng/trong các dụ ngôn.” Làm gọn chú thích liên văn bản để nêu âm vang Ê-sai mà không thêm diễn giải. Các điểm còn lại giữ nguyên nghĩa và sự mơ hồ thích hợp của bản nguồn.
