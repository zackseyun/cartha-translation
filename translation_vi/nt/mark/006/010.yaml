  text: καὶ ἔλεγεν αὐτοῖς· Ὅπου ⸀ἐὰν εἰσέλθητε εἰς οἰκίαν, ἐκεῖ μένετε ἕως ἂν ἐξέλθητε ἐκεῖθεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/010.yaml
  text: And he was saying to them[a], “Wherever you enter a house, stay there until you leave that place.”
translation:
  language: vi
  text: 'Ngài bảo họ: “Hễ vào nhà nào, anh em hãy ở lại đó cho đến khi rời khỏi nơi ấy.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “cho đến khi anh em đi ra khỏi đó.” Nguyên văn không xác định rõ “đó” là căn nhà hay địa phương ấy.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: Ngài nói
  rationale: Thì vị hoàn có thể gợi lời nói đang tiếp diễn hoặc được lặp lại, nhưng trong văn kể tiếng Việt, “nói” tự nhiên hơn và không loại trừ sắc thái ấy.
- source_word: Ὅπου ἐὰν
  choice: Bất cứ nơi nào
  rationale: Diễn đạt tự nhiên ý quan hệ bất định “ở bất cứ nơi nào”.
- source_word: εἰσέλθητε εἰς οἰκίαν
  choice: anh em vào một nhà
  rationale: “Vào” truyền đạt rõ hướng chuyển động của εἰσέρχομαι với εἰς; “một nhà” giữ trọng tâm là nơi lưu trú cụ thể.
- source_word: ἐκεῖ μένετε
  choice: hãy ở lại đó
  rationale: Giữ đúng sắc thái mệnh lệnh của μένετε và dùng cách nói hiện đại, tự nhiên.
- source_word: ἕως ἂν ἐξέλθητε ἐκεῖθεν
  choice: cho đến khi rời khỏi nơi ấy
  rationale: Diễn đạt trôi chảy ý rời địa điểm đang thi hành sứ vụ, đồng thời chú thích cách hiểu sát chữ hơn để bảo toàn độ mở của nguyên văn.
theological_decisions:
- issue: Phạm vi chỉ nơi chốn của ἐκεῖθεν
  choice: Hiểu chủ yếu là rời khỏi địa phương ấy, nên dịch “rời khỏi nơi ấy”.
  alternative: Hiểu sát hơn là “đi ra khỏi đó”, có thể chỉ việc ra khỏi căn nhà.
  rationale: Trong mạch văn về chỗ lưu trú khi thi hành sứ vụ, lời dạy hợp lý nhất là ở nguyên một nhà cho tới lúc rời địa phương. Tuy nhiên, nguyên văn không nêu rõ “địa phương”, nên ghi chú giữ lại cách dịch sát chữ và sự mơ hồ.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “anh em” cho số nhiều môn đồ; dùng “Ngài” để chỉ Chúa Giê-su theo văn phong Kinh Thánh trang nghiêm. Dấu chú thích đặt ngay sau mệnh đề liên quan.
