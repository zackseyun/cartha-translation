- from: 'Ngài nói với họ: “Bất cứ nơi nào anh em vào một nhà, hãy ở lại đó cho đến khi rời khỏi nơi ấy.[a]”'
  to: 'Ngài bảo họ: “Hễ vào nhà nào, anh em hãy ở lại đó cho đến khi rời khỏi nơi ấy.[a]”'
  rationale: Điều chỉnh duy nhất là thay kết cấu “Bất cứ nơi nào anh em vào một nhà” bằng “Hễ vào nhà nào” để tiếng Việt tự nhiên hơn. Bản sửa vẫn giữ “rời khỏi nơi ấy” theo mạch văn, đồng thời chú thích tiếp tục bảo tồn sự mơ hồ của ἐκεῖθεν, không khẳng định quá mức rằng đó nhất thiết là địa phương.
