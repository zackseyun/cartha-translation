  text: And he got into the boat with them[a], and the wind stopped. And they were utterly astonished within themselves[b],
translation:
  language: vi
  text: Rồi Ngài lên thuyền với họ, và gió lặng. Họ vô cùng[a] kinh ngạc[b] trong lòng.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn Hy Lạp chồng nhiều từ tăng cường, sát nghĩa là “rất đỗi, vượt quá mức”.
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “sửng sốt” hoặc “choáng ngợp”; động từ Hy Lạp diễn tả một sự kinh ngạc hết sức mạnh mẽ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέβη ... εἰς τὸ πλοῖον
  choice: lên thuyền
  rationale: Động từ có nghĩa gốc là “đi lên”, nhưng khi đi với cụm “vào thuyền”, cách nói tự nhiên trong tiếng Việt là “lên thuyền”.
- source_word: πρὸς αὐτούς
  choice: với họ
  rationale: Diễn tả việc Ngài vào thuyền để ở cùng các môn đồ; “với họ” vừa tự nhiên vừa giữ được ý gần gũi của giới từ.
- source_word: ἐκόπασεν ὁ ἄνεμος
  choice: gió lặng
  rationale: κοπάζω chỉ gió ngừng hoặc dịu hẳn. “Gió lặng” là cách diễn đạt ngắn gọn, tự nhiên và phù hợp với văn cảnh.
- source_word: λίαν ἐκ περισσοῦ
  choice: vô cùng
  rationale: Hai yếu tố tăng cường được chồng lên nhau để nhấn mạnh mức độ rất cao. “Vô cùng” truyền đạt cường độ ấy mà không làm câu tiếng Việt nặng nề.
- source_word: ἐν ἑαυτοῖς
  choice: trong lòng
  rationale: Cụm phản thân diễn tả phản ứng xảy ra bên trong họ. “Trong lòng” là cách nói tự nhiên trong tiếng Việt và không hàm ý rằng họ đã nói ra.
- source_word: ἐξίσταντο
  choice: kinh ngạc
  rationale: Dạng trung động/nội động từ ở đây chỉ trạng thái sửng sốt, choáng ngợp. “Kinh ngạc” rõ nghĩa trong tiếng Việt; sắc thái mạnh hơn được ghi ở chú thích.
theological_decisions:
- issue: Mức độ phản ứng của các môn đồ trước hành động của Đức Giê-su
  choice: Họ vô cùng kinh ngạc trong lòng
  alternative: Họ sửng sốt đến mức như mất tự chủ
  rationale: Bản dịch giữ sức nhấn mạnh đặc biệt của nguyên văn nhưng không thêm lời giải thích thần học về nguyên nhân hay ý nghĩa phản ứng của họ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Lên thuyền”, “gió lặng” và “trong lòng” là những cách nói tự nhiên trong tiếng Việt; đại từ “Ngài” duy trì sự tôn kính mà không thêm danh xưng không có trong câu Hy Lạp.
