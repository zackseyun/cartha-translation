  text: Καὶ ὀψίας γενομένης ἦν τὸ πλοῖον ἐν μέσῳ τῆς θαλάσσης, καὶ αὐτὸς μόνος ἐπὶ τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/047.yaml
  text: And when evening had come[a], the boat was in the middle of the sea, and he was alone on the land.
translation:
  language: vi
  text: Khi chiều tối đến, thuyền đang ở giữa biển, còn chính Ngài ở một mình trên đất liền.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “trên bờ”. Tiếng Hy Lạp nói “trên đất liền”, tương phản vị trí của Ngài với chiếc thuyền ở ngoài biển.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀψίας γενομένης
  choice: Khi chiều tối đến
  rationale: Kết cấu sở hữu cách tuyệt đối diễn tả hoàn cảnh thời gian. Cách dịch này tự nhiên trong tiếng Việt hiện đại và giữ được ý thời điểm trời đã chuyển sang buổi tối.
- source_word: πλοῖον
  choice: thuyền
  rationale: Trong bối cảnh biển Ga-li-lê, “thuyền” là từ tự nhiên và phù hợp hơn “tàu”, vốn dễ gợi một phương tiện lớn hơn.
- source_word: ἐν μέσῳ τῆς θαλάσσης
  choice: ở giữa biển
  rationale: Giữ trực tiếp hình ảnh vị trí giữa biển, đồng thời diễn đạt gọn và tự nhiên trong tiếng Việt.
- source_word: θάλασσα
  choice: biển
  rationale: Dù biển Ga-li-lê về mặt địa lý là một hồ, nguyên văn dùng từ “biển”; bản dịch giữ cách gọi của nguồn Hy Lạp.
- source_word: αὐτὸς μόνος
  choice: chính Ngài ở một mình
  rationale: “Chính Ngài” thể hiện sắc thái nhấn mạnh của αὐτός, còn “ở một mình” chuyển tải μόνος một cách tự nhiên.
- source_word: ἐπὶ τῆς γῆς
  choice: trên đất liền
  rationale: Cách dịch này giữ sự tương phản rõ ràng với chiếc thuyền ở ngoài biển mà không thu hẹp nghĩa thành một vị trí cụ thể trên bờ.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Ngài” để chỉ Chúa Giê-su theo quy ước tôn kính phổ biến; cấu trúc “còn chính Ngài” làm nổi bật sự tương phản giữa thuyền ở biển và Ngài ở đất liền.
