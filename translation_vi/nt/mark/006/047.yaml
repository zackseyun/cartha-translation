  source_fidelity: 'Bản dịch chuyển tải đầy đủ các thành tố của nguyên văn: hoàn cảnh thời gian khi buổi chiều đến, chiếc thuyền ở giữa biển, và sự đối lập với việc Ngài ở một mình trên đất liền. “Chính Ngài” diễn đạt hợp lý sắc thái nhấn mạnh của αὐτός μόνος mà không thêm nội dung.'
