  terminology: “Thuyền,” “biển,” và “trên đất liền” nhất quán với nguyên văn và bối cảnh. Đại từ tôn kính “Ngài” phù hợp với thanh ghi Kinh Thánh tiếng Việt hiện đại. Chú thích giữ đúng lựa chọn từ vựng thay thế “trên bờ” và giải thích đúng tương phản trong tiếng Hy Lạp.
