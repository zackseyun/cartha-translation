language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ εἰσελθούσης τῆς θυγατρὸς ⸂αὐτῆς τῆς⸃ Ἡρῳδιάδος καὶ ὀρχησαμένης ⸂καὶ ἀρεσάσης⸃ τῷ Ἡρῴδῃ καὶ τοῖς συνανακειμένοις, ⸂εἶπεν ὁ βασιλεὺς⸃ τῷ κορασίῳ· Αἴτησόν με ὃ ἐὰν θέλῃς, καὶ δώσω σοι·
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/022.yaml
  text: And when Herodias's daughter came in and danced[a], and pleased Herod and those reclining at the table with him, the king said to the girl, “Ask me for whatever you want[b], and I will give it to you.”
translation:
  language: vi
  text: 'Khi con gái của Hêrôđia[a] bước vào, nhảy múa và làm hài lòng Hêrốt cùng những người dự tiệc với ông[b], nhà vua nói với cô gái: “Hãy xin ta bất cứ điều gì con muốn, ta sẽ cho con.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Một số thủ bản hoặc truyền thống được hiểu là “con gái của ông, là Hêrôđia” thay vì “con gái của Hêrôđia”. Bản văn Hy Lạp được theo ở đây đọc là “con gái của Hêrôđia”.
    reason: textual_variant
  - marker: b
    text: Nguyên văn nói đến những người cùng ngả mình bên bàn tiệc với ông, theo tư thế dùng tiệc thời ấy.
    reason: cultural_note
lexical_decisions:
- source_word: εἰσελθούσης
  choice: khi ... bước vào
  rationale: Phân từ bất định trong kết cấu sở hữu cách tuyệt đối được diễn đạt theo nghĩa thời gian; “khi ... bước vào” tự nhiên và giữ được chuyển động vào nơi diễn ra yến tiệc.
- source_word: τῆς θυγατρὸς αὐτῆς τῆς Ἡρῳδιάδος
  choice: con gái của bà Hêrôđia
  rationale: Kết cấu sở hữu cách trong bản văn được theo ở đây tự nhiên nhất là chỉ cô gái là con của Hêrôđia. Đại từ nhấn mạnh αὐτῆς không cần dịch cứng thành “chính bà” trong câu chính vì sẽ nặng nề; dị bản được ghi ở chú thích.
- source_word: ὀρχησαμένης
  choice: nhảy múa
  rationale: Diễn đạt trực tiếp hành động khiêu vũ bằng từ ngữ hiện đại, tự nhiên, không thêm sắc thái gợi cảm mà nguyên văn không nói rõ.
- source_word: ἀρεσάσης
  choice: làm ... hài lòng
  rationale: Giữ nghĩa thông thường của ἀρέσκω là làm cho ai hài lòng, không tăng cường thành “làm say mê” hay “khiến vô cùng thích thú”.
- source_word: τοῖς συνανακειμένοις
  choice: những người dự tiệc với ông
  rationale: Chỉ những người cùng ngả mình dùng tiệc với Hêrốt. Câu chính dùng cách nói Việt tự nhiên; tư thế ăn tiệc cổ được giải thích trong chú thích.
- source_word: εἶπεν ὁ βασιλεὺς
  choice: vua nói
  rationale: Dịch βασιλεύς đúng theo cách Máccô gọi Hêrốt là “vua”, không thay bằng tước hiệu lịch sử kỹ thuật “tiểu vương”.
- source_word: τῷ κορασίῳ
  choice: với cô gái
  rationale: κοράσιον chỉ một cô gái hoặc thiếu nữ; “cô gái” là cách gọi hiện đại, trung tính, không cổ kính hóa.
- source_word: Αἴτησόν με ὃ ἐὰν θέλῃς
  choice: Con muốn gì cứ xin ta
  rationale: Giữ lời cho phép xin bất cứ điều cô muốn, đồng thời dùng lối đối thoại tự nhiên giữa nhà vua và cô gái trong tiếng Việt.
- source_word: δώσω σοι
  choice: ta sẽ ban cho con
  rationale: “Ban” phù hợp lời của vua mà vẫn thể hiện rõ lời hứa sẽ cho; cặp xưng hô “ta—con” tự nhiên trong bối cảnh này.
theological_decisions:
- issue: Tước hiệu βασιλεύς dành cho Hêrốt Antipas
  choice: vua
  alternative: tiểu vương; nhà cai trị
  rationale: Bản dịch giữ nguyên cách gọi trong lời kể của Máccô thay vì sửa theo tước hiệu lịch sử “tetrarch”, nhờ đó tôn trọng ưu tiên của nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Hêrốt”, “Hêrôđia” theo dạng tên quen thuộc trong tiếng Việt; lời trực tiếp dùng cặp “ta—con” phù hợp bối cảnh vua nói với một cô gái. Các dấu chú thích được đặt ngay tại phần văn bản mà chú thích giải thích.
