revisions:
- from: 'Khi con gái của bà Hêrôđia[a] bước vào nhảy múa và làm Hêrốt cùng những người dự tiệc với ông[b] hài lòng, vua nói với cô gái: “Con muốn gì cứ xin ta, ta sẽ ban cho con.”'
  to: 'Khi con gái của Hêrôđia[a] bước vào, nhảy múa và làm hài lòng Hêrốt cùng những người dự tiệc với ông[b], nhà vua nói với cô gái: “Hãy xin ta bất cứ điều gì con muốn, ta sẽ cho con.”'
  rationale: Bản sửa chỉ làm rõ cấu trúc cú pháp, loại bỏ kính ngữ không có trong nguyên văn, và chỉnh chú thích dị bản cho chính xác, dễ hiểu. Không thay đổi ý nghĩa, tên riêng, tước hiệu theo bản văn, hay mức độ mơ hồ của vấn đề văn bản.
