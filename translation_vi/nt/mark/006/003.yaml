id: MRK.6.3
reference: Mark 6:3
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οὐχ οὗτός ἐστιν ὁ τέκτων, ὁ υἱὸς ⸀τῆς Μαρίας ⸂καὶ ἀδελφὸς⸃ Ἰακώβου καὶ ⸀Ἰωσῆτος καὶ Ἰούδα καὶ Σίμωνος; καὶ οὐκ εἰσὶν αἱ ἀδελφαὶ αὐτοῦ ὧδε πρὸς ἡμᾶς; καὶ ἐσκανδαλίζοντο ἐν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/003.yaml
  text: Is this not the carpenter[b][a], the son of Mary and brother of James and Joses and Judas and Simon? And are not his sisters here with us? And they took offense at him.
translation:
  language: vi
  text: “Chẳng phải đây là người thợ mộc, con trai của Ma-ri, anh em của Gia-cơ, Giô-sết, Giu-đa và Si-môn sao?[a] Các chị em của ông ấy chẳng phải đang ở đây với chúng ta sao?” Và họ lấy làm vấp phạm vì Người.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Các từ Hy Lạp được dịch là “anh em” và “chị em” thông thường có nghĩa là anh/em trai và chị/em gái; tuy nhiên, một số truyền thống Kitô giáo hiểu những người này theo nghĩa rộng hơn là họ hàng hoặc là anh chị em kế.
    reason: alternative_reading
  - marker: b
    text: Hay “họ bất bình về Người” hoặc “họ lấy làm chướng ngại vì Người”; sát nghĩa hơn là “họ vấp ngã vì Người.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τέκτων
  choice: người thợ mộc
  rationale: Từ này chỉ một người thợ thủ công và có thể mang nghĩa rộng hơn như thợ xây dựng, nhưng trong bối cảnh này cách hiểu truyền thống và có khả năng nhất là “thợ mộc”; đây cũng là cách nói rõ ràng, tự nhiên trong tiếng Việt.
- source_word: υἱὸς τῆς Μαρίας
  choice: con trai của Ma-ri
  rationale: Dịch trực tiếp cách gọi đáng chú ý trong tiếng Hy Lạp, giữ nguyên việc dân làng nhận diện Đức Giê-su qua mẹ Người mà không giải thích thêm sắc thái xã hội có thể có.
- source_word: ἀδελφὸς / ἀδελφαὶ
  choice: anh em / chị em
  rationale: Các từ Hy Lạp thông thường chỉ anh, em trai và chị, em gái. Tiếng Việt cần dùng dạng bao quát vì bản văn không cho biết tuổi tương đối; chú thích bảo lưu khả năng chỉ họ hàng hoặc anh chị em kế theo một số truyền thống.
- source_word: Ἰωσῆτος
  choice: Giô-sê
  rationale: Phiên âm dạng tên riêng Hy Lạp tại đây, không đồng nhất hóa thành dạng Giô-sép.
- source_word: ὧδε πρὸς ἡμᾶς
  choice: đang ở đây với chúng ta
  rationale: Diễn đạt tự nhiên sự hiện diện tại địa phương và sự gần gũi xã hội với những người đang nói.
- source_word: ἐσκανδαλίζοντο ἐν αὐτῷ
  choice: họ vấp phạm vì Người
  rationale: 'Giữ hình ảnh và sắc thái thần học của động từ Hy Lạp: Đức Giê-su trở thành nguyên cớ khiến họ vấp ngã hay khước từ; chú thích nêu cách diễn đạt tự nhiên hơn là “bất bình về Người”.'
theological_decisions:
- issue: Quan hệ của “anh em” và “chị em” với Đức Giê-su
  choice: Giữ các từ thân thuộc thông thường “anh em” và “chị em” trong chính văn, không xác định họ là anh chị em cùng mẹ, anh chị em kế hay họ hàng.
  alternative: Dịch là “họ hàng”, hoặc giải thích là các con khác của Ma-ri và Giô-sép, hoặc là con riêng của Giô-sép.
  rationale: ἀδελφός và ἀδελφή thông thường có nghĩa là anh/em trai và chị/em gái, nhưng lịch sử giải nghĩa Kitô giáo có nhiều cách hiểu. Bản dịch không nên dùng chính văn để giải quyết điều tiếng Hy Lạp chưa xác định.
- issue: Sắc thái xã hội của cụm “con trai của Ma-ri”
  choice: Dịch trực tiếp, không thêm lời giải thích vào chính văn.
  alternative: Diễn giải cụm từ như một cách gọi trung tính hoặc như lời miệt thị.
  rationale: Trong ngữ cảnh, cách gọi này có thể mang sắc thái coi thường, nhưng bản văn không nói rõ; vì vậy cần bảo tồn tính hàm ý thay vì quyết định thay người đọc.
- issue: Sắc thái của ἐσκανδαλίζοντο
  choice: “vấp phạm vì Người”
  alternative: “bất bình về Người” hoặc “khước từ Người”
  rationale: “Vấp phạm” bảo tồn ẩn dụ và sự căng thẳng thần học của từ Hy Lạp, còn chú thích giúp độc giả hiểu phản ứng chống đối trong ngữ cảnh.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Lời của dân làng dùng “ông ấy” phù hợp với góc nhìn của họ; câu kể dùng “Người” theo quy ước kính trọng dành cho Đức Giê-su. Cấu trúc câu hỏi phủ định được giữ để truyền tải thái độ hoài nghi và coi thường.
