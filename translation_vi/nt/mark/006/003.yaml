revisions:
- from: “Chẳng phải đây là người thợ mộc, con trai của Ma-ri, anh em của Gia-cơ, Giô-sê, Giu-đa và Si-môn sao?[a] Các chị em của ông ấy chẳng phải đang ở đây với chúng ta sao?” Và họ vấp phạm vì Người.[b]
  to: “Chẳng phải đây là người thợ mộc, con trai của Ma-ri, anh em của Gia-cơ, Giô-sết, Giu-đa và Si-môn sao?[a] Các chị em của ông ấy chẳng phải đang ở đây với chúng ta sao?” Và họ lấy làm vấp phạm vì Người.[b]
  rationale: Sửa dạng tên Giô-sết để phản ánh Ἰωσῆτος/Joses, thay cách diễn đạt phản ứng bằng “lấy làm vấp phạm” để tránh nghĩa sai trong tiếng Việt hiện đại mà vẫn bảo tồn hình ảnh của động từ Hy Lạp, và điều chỉnh chú thích gia thuộc để không giải quyết quá mức quan hệ đang được tranh luận.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T07:39:59Z'
review_pass:
  verdict: revise
  source_fidelity: Bản dịch giữ đúng cấu trúc các câu hỏi tu từ, cách nhận diện “con trai của Ma-ri”, các tên riêng, và phản ứng chống đối được diễn tả bởi ἐσκανδαλίζοντο. Tuy nhiên, Ἰωσῆτος là dạng tên riêng tương ứng với “Joses”, nên cần phân biệt rõ với Giô-sép; “Giô-sết” phản ánh dạng này tốt hơn “Giô-sê”. Cụm ἐσκανδαλίζοντο ἐν αὐτῷ trong ngữ cảnh không nói đến việc phạm lỗi, mà nói đến việc bị chướng ngại/lấy làm vấp phạm vì Đức Giê-su.
  naturalness: “Họ vấp phạm vì Người” có thể bị hiểu trong tiếng Việt hiện đại là họ phạm lỗi đối với Người. “Họ lấy làm vấp phạm vì Người” là cách nói tự nhiên, trang trọng, và phù hợp hơn với nghĩa phản ứng bị xúc phạm hoặc bị chướng ngại. Các câu hỏi và sự chuyển đổi hợp lý giữa “ông ấy” trong lời dân làng với “Người” ở lời trần thuật đều tự nhiên.
  terminology: “Người thợ mộc” là lựa chọn phù hợp cho τέκτων trong ngữ cảnh này, dù từ Hy Lạp có thể rộng hơn. “Anh em” và “chị em” bảo lưu cách dùng gia thuộc thông thường mà không áp đặt tuổi tương đối hoặc giải quyết tranh luận về quan hệ chính xác. Chú thích cần tránh nói quá mạnh là “anh chị em ruột”, vì tiếng Hy Lạp thường chỉ anh em ruột nhưng bản thân từ này không tự xác định mọi chi tiết quan hệ gia đình.
  issues:
  - severity: medium
    issue: Dạng tên Ἰωσῆτος được dịch là “Giô-sê”.
    rationale: SBLGNT có Ἰωσῆτος (Joses), một dạng khác với Ἰωσήφ (Joseph/Giô-sép). “Giô-sết” giúp bảo lưu dạng tên riêng trong bản văn nguồn.
  - severity: medium
    issue: “Họ vấp phạm vì Người” có nguy cơ hiểu sai trong tiếng Việt hiện đại.
    rationale: Trong cách dùng hiện nay, “vấp phạm” thường gợi việc ai đó gây hoặc phạm một lỗi. Ngữ cảnh của σκανδαλίζω ở đây là dân làng lấy làm chướng ngại, bị xúc phạm, hay khước từ vì Đức Giê-su. Thêm “lấy làm” làm rõ chủ thể phản ứng mà vẫn giữ ẩn dụ.
  - severity: low
    issue: Chú thích về “anh em/chị em” nói “thông thường chỉ anh chị em ruột”.
    rationale: Nên nói các từ này thông thường có nghĩa là anh/em trai và chị/em gái; không nên để chú thích xác định “ruột” như một kết luận mà chính văn Hy Lạp không nêu cụ thể.
  revised_text: “Chẳng phải đây là người thợ mộc, con trai của Ma-ri, anh em của Gia-cơ, Giô-sết, Giu-đa và Si-môn sao?[a] Các chị em của ông ấy chẳng phải đang ở đây với chúng ta sao?” Và họ lấy làm vấp phạm vì Người.[b]
  revised_footnotes:
