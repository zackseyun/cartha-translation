    rationale: “Lên núi” có thể hàm ý chuyển động, nhưng “đi lên núi” phản ánh đầy đủ và tự nhiên hơn ý “ngài đi khỏi/ra đi đến núi.”
  - severity: low
    issue: Câu chữ chú thích “chào từ giã họ” không tự nhiên.
    rationale: Nên dùng một cách diễn đạt thay thế độc lập, như “từ giã họ,” để nêu lựa chọn từ vựng mà không ghép hai từ đồng nghĩa.
