  text: καὶ ἀποταξάμενος αὐτοῖς ἀπῆλθεν εἰς τὸ ὄρος προσεύξασθαι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/046.yaml
  text: And after saying goodbye to them[a], he went away to the mountain to pray.
translation:
  language: vi
  text: Sau khi từ biệt họ[a], Ngài đi lên núi để cầu nguyện.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “sau khi từ giã họ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Sau khi
  rationale: Mối nối kể chuyện được diễn đạt tự nhiên cùng với phân từ chỉ hành động xảy ra trước; không cần dịch καὶ thành một từ riêng như “và”.
- source_word: ἀποταξάμενος αὐτοῖς
  choice: từ biệt họ
  rationale: Động từ trung gian ἀποτάσσομαι với đại từ cách tặng mang nghĩa rời chào hoặc từ biệt ai. “Từ biệt họ” tự nhiên, trang trọng vừa phải và không hàm ý chính thức giải tán họ.
- source_word: ἀπῆλθεν
  choice: Ngài lên
  rationale: Trong kết cấu với εἰς τὸ ὄρος, tiếng Việt tự nhiên dùng “lên núi”; ý rời khỏi nơi trước đó đã được thể hiện qua “sau khi từ biệt”. Đại từ tôn kính “Ngài” chỉ Chúa Giê-su theo văn phong Kinh Thánh Việt ngữ.
- source_word: εἰς τὸ ὄρος
  choice: lên núi
  rationale: ὄρος chỉ núi hoặc vùng đồi núi. Tiếng Việt thường không dùng mạo từ, nên “núi” bảo toàn chi tiết địa hình mà không buộc phải thêm “ngọn núi ấy” hay “một ngọn núi”.
- source_word: προσεύξασθαι
  choice: cầu nguyện
  rationale: Động từ nguyên mẫu chỉ mục đích của việc đi lên núi; “cầu nguyện” là cách dịch trực tiếp và thông dụng.
theological_decisions:
- issue: Cách hiểu τὸ ὄρος (“núi”)
  choice: Dịch đơn giản là “núi”, không gán ý nghĩa biểu tượng hoặc thần học.
  alternative: “ngọn núi ấy”, “một ngọn núi”, hoặc diễn giải đây là nơi mặc khải đặc biệt
  rationale: Mạo từ Hy Lạp không nhất thiết phải được biểu thị bằng từ hạn định trong tiếng Việt. Bản văn chỉ nêu địa điểm cụ thể trong trình thuật, không giải thích ý nghĩa biểu tượng.
translation_notes:
  register: Tiếng Việt hiện đại, rõ ràng và trang nghiêm vừa phải. Câu được sắp xếp tự nhiên theo quan hệ thời gian và mục đích của nguyên văn; tránh lối dịch nặng cấu trúc Hy Lạp.
