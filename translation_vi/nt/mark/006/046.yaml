  source_fidelity: Bản dịch truyền đạt đúng quan hệ thời gian của phân từ ἀποταξάμενος, đối tượng số nhiều αὐτοῖς, đích đến εἰς τὸ ὄρος và mục đích προσεύξασθαι. Tuy nhiên, thêm “đi” trong “đi lên núi” phản ánh rõ hơn động từ ἀπῆλθεν (“đi khỏi/đi đi”) mà vẫn tự nhiên trong tiếng Việt.
  naturalness: “Sau khi từ biệt họ, Ngài đi lên núi để cầu nguyện” là câu tiếng Việt hiện đại, trang trọng vừa phải và mạch lạc. Chú thích hiện có “chào từ giã họ” không tự nhiên do ghép hai cách diễn đạt gần đồng nghĩa.
  terminology: “Từ biệt,” “núi,” và “cầu nguyện” phù hợp với nghĩa từ vựng và văn phong Kinh Thánh Việt ngữ. “Ngài” là cách xưng hô kính trọng nhất quán, với chủ ngữ được hiểu từ văn mạch.
  issues:
