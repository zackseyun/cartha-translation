  register: Văn phong kể chuyện trang trọng nhưng hiện đại. Dấu hai chấm cho thấy mệnh đề về sinh nhật giải thích ngày thuận tiện ấy, đồng thời tránh cấu trúc lặp “khi... khi...” không tự nhiên trong tiếng Việt.
