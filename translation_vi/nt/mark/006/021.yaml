  source_fidelity: 'Bản nháp truyền đạt đúng cấu trúc chính: một thời điểm thuận lợi, bữa tiệc nhân sinh nhật của Hê-rốt, và ba nhóm khách. Tuy nhiên, “các quan lớn” dễ thu hẹp μεγιστᾶνες thành quan chức theo hệ thống hành chính kiểu Việt Nam, trong khi từ Hy Lạp chỉ giới quyền quý/có thế lực nói chung. “Những người đứng đầu” cũng có thể gợi một chức vụ chính thức hơn πρῶτοι.'
  naturalness: 'Câu nhìn chung tự nhiên, nhưng “Rồi một ngày thuận tiện đã đến: vào dịp sinh nhật mình” hơi gượng và dấu hai chấm làm quan hệ thời gian mang sắc thái giải thích mạnh hơn cần thiết. Dùng “khi” phản ánh rõ và tự nhiên quan hệ của mệnh đề ὅτε.'
