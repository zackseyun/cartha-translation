  text: Καὶ γενομένης ἡμέρας εὐκαίρου ὅτε Ἡρῴδης τοῖς γενεσίοις αὐτοῦ δεῖπνον ⸀ἐποίησεν τοῖς μεγιστᾶσιν αὐτοῦ καὶ τοῖς χιλιάρχοις καὶ τοῖς πρώτοις τῆς Γαλιλαίας,
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/021.yaml
  text: And when an opportune day came[a], Herod gave a banquet on his birthday for his nobles and military commanders and the leading men of Galilee[d][c][b],
translation:
  language: vi
  text: Rồi một ngày thuận lợi đã đến[a], khi Hê-rốt nhân dịp sinh nhật mình mở tiệc khoản đãi các bậc quyền quý của ông, các chỉ huy quân đội và các nhân vật hàng đầu của Ga-li-lê.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “một ngày thích hợp” hoặc “một ngày thuận tiện”. Từ Hy Lạp hàm ý một thời điểm thích hợp hoặc một cơ hội có lợi cho ý định đang được chờ đợi.
    reason: lexical_alternative
  - marker: b
    text: Nguyên văn có thể dịch sát hơn là “những người hàng đầu của Ga-li-lê”, tức các nhân vật có địa vị nổi bật trong miền ấy.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ γενομένης ἡμέρας εὐκαίρου
  choice: Rồi một ngày thuận tiện đã đến
  rationale: Giữ liên từ kể chuyện của Mác-cô và sắc thái εὔκαιρος là một thời điểm thích hợp, có lợi cho mưu tính đang chờ cơ hội.
- source_word: ὅτε
  choice: vào dịp
  rationale: Mệnh đề với ὅτε xác định sự kiện khiến ngày ấy trở thành cơ hội; cách diễn đạt này tránh lặp hai từ “khi” mà vẫn giữ quan hệ thời gian.
- source_word: τοῖς γενεσίοις αὐτοῦ
  choice: vào dịp sinh nhật mình
  rationale: γενέσια chỉ lễ hoặc dịp sinh nhật; “mình” quy chiếu tự nhiên về Hê-rốt trong tiếng Việt.
- source_word: δεῖπνον ἐποίησεν
  choice: mở tiệc chiêu đãi
  rationale: Đây là thành ngữ nghĩa đen là “làm một bữa ăn”; cách dịch đã chọn diễn đạt tự nhiên việc chủ tiệc tổ chức một yến tiệc trang trọng cho khách.
- source_word: τοῖς μεγιστᾶσιν αὐτοῦ
  choice: các quan lớn
  rationale: μεγιστᾶνες chỉ những nhân vật quyền thế, cấp cao thuộc giới cầm quyền của Hê-rốt; “các quan lớn” vừa dễ hiểu vừa giữ sắc thái địa vị.
- source_word: τοῖς χιλιάρχοις
  choice: các chỉ huy quân đội
  rationale: Truyền đạt chức năng của các sĩ quan quân sự cấp cao mà không áp đặt một quân hàm La Mã quá chuyên biệt.
- source_word: τοῖς πρώτοις τῆς Γαλιλαίας
  choice: những người đứng đầu miền Ga-li-lê
  rationale: πρῶτοι ở đây chỉ những nhân vật hàng đầu, có địa vị nổi bật trong vùng; cách dịch tự nhiên và không thu hẹp quá mức vào một chức vụ cụ thể.
- source_word: Ἡρῴδης
  choice: Hê-rốt
  rationale: Dùng dạng phiên âm tên riêng quen thuộc trong tiếng Việt.
theological_decisions: []
