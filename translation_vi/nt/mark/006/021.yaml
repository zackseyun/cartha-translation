- from: 'Rồi một ngày thuận tiện đã đến[a]: vào dịp sinh nhật mình, Hê-rốt mở tiệc chiêu đãi các quan lớn, các chỉ huy quân đội và những người đứng đầu miền Ga-li-lê.[b]'
  to: Rồi một ngày thuận lợi đã đến[a], khi Hê-rốt nhân dịp sinh nhật mình mở tiệc khoản đãi các bậc quyền quý của ông, các chỉ huy quân đội và các nhân vật hàng đầu của Ga-li-lê.[b]
