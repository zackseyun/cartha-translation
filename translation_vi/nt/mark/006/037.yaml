  text: ὁ δὲ ἀποκριθεὶς εἶπεν αὐτοῖς· Δότε αὐτοῖς ὑμεῖς φαγεῖν. καὶ λέγουσιν αὐτῷ· Ἀπελθόντες ἀγοράσωμεν δηναρίων διακοσίων ἄρτους καὶ ⸀δώσομεν αὐτοῖς φαγεῖν;
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/037.yaml
  text: But he answered and said to them[a], “You yourselves give them something to eat.” And they said to him[b], “Should we go and buy bread for two hundred denarii and give it to them to eat?”
translation:
  language: vi
  text: 'Nhưng Người trả lời họ: “Chính anh em hãy cho họ ăn.” Họ thưa với Người: “Chúng tôi phải đi mua bánh[a] hết hai trăm đơ-na-ri[b] rồi cho họ ăn sao?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “những ổ bánh.” Từ Hy Lạp ἄρτους có thể chỉ bánh nói chung hoặc các ổ bánh.
    reason: lexical_alternative
  - marker: b
    text: Một đơ-na-ri là mức tiền công thông thường cho một ngày lao động của người làm thuê hoặc binh sĩ.
    reason: cultural_note
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: đáp lời
  rationale: Diễn đạt tự nhiên trong tiếng Việt ý của cặp động từ trần thuật “đáp và nói”, mà không lặp từ một cách gượng gạo.
- source_word: Δότε
  choice: hãy cho
  rationale: Giữ trực tiếp sắc thái mệnh lệnh của δίδωμι.
- source_word: ὑμεῖς
  choice: chính anh em
  rationale: Đại từ được nêu rõ trong tiếng Hy Lạp mang tính nhấn mạnh; “chính anh em” thể hiện sự nhấn mạnh ấy tự nhiên.
- source_word: φαγεῖν
  choice: ăn
  rationale: Trong kết cấu “cho họ ăn”, tiếng Việt truyền đạt tự nhiên ý “cho họ thứ để ăn” mà không cần thêm một danh từ không có trong nguyên văn.
- source_word: Ἀπελθόντες ἀγοράσωμεν
  choice: phải đi mua
  rationale: Chuyển phân từ chỉ hành động đi cùng động từ ở thức giả định nghị luận thành câu hỏi tự nhiên trong tiếng Việt.
- source_word: δηναρίων διακοσίων
  choice: hết hai trăm đơ-na-ri
  rationale: Thể hiện sở hữu cách chỉ giá tiền; “hết” cho biết đây là số tiền phải bỏ ra để mua.
- source_word: ἄρτους
  choice: bánh
  rationale: ἄρτος có thể chỉ bánh mì như thức ăn nói chung hoặc những ổ bánh; “bánh” phù hợp ngữ cảnh và chú thích giữ lại khả năng “những ổ bánh”.
- source_word: δώσομεν αὐτοῖς φαγεῖν
  choice: rồi cho họ ăn
  rationale: Giữ động từ “cho” song song với mệnh lệnh trước đó và giữ hành động tiếp nối sau việc mua.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Người” để chỉ Đức Giê-su và “anh em” khi Người nói với các môn đồ; “chúng tôi” phản ánh lời đáp của nhóm môn đồ. Câu hỏi cuối giữ nguyên tính chất nghị luận và khả năng hàm ý kinh ngạc, không giải thích thêm.
