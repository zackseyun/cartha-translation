  terminology: “Ngài” nhất quán với văn thể Cơ Đốc trang trọng. “Mép áo” là lựa chọn rộng và thích hợp cho κράσπεδον; chú thích bảo lưu khả năng “viền” hoặc “tua áo”. Chú thích về ἐσῴζοντο bảo lưu nghĩa sát chữ mà không áp đặt nghĩa cứu rỗi vào một ngữ cảnh chữa bệnh.
