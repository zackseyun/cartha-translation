source:
  edition: SBLGNT
  text: καὶ ὅπου ἂν εἰσεπορεύετο εἰς κώμας ἢ ⸂εἰς πόλεις ἢ εἰς⸃ ἀγροὺς ἐν ταῖς ἀγοραῖς ⸀ἐτίθεσαν τοὺς ἀσθενοῦντας, καὶ παρεκάλουν αὐτὸν ἵνα κἂν τοῦ κρασπέδου τοῦ ἱματίου αὐτοῦ ἅψωνται· καὶ ὅσοι ἂν ⸀ἥψαντο αὐτοῦ ἐσῴζοντο.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/056.yaml
  text: And wherever he entered villages or cities or countryside[a], they were laying the sick in the marketplaces and begged him that they might even touch the fringe of his garment[c][b]; and as many as touched it were being healed.
translation:
  language: vi
  text: Bất cứ nơi nào Ngài vào—dù là làng mạc, thành phố hay vùng quê—người ta đều đặt những người đau yếu tại các chợ và nài xin Ngài cho họ dù chỉ được chạm vào mép áo của Ngài[a]. Tất cả những ai chạm vào Ngài đều được chữa lành[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hy Lạp có thể chỉ mép hoặc viền áo, và trong bối cảnh Do Thái cũng có thể gợi đến tua áo.
    reason: lexical_alternative
  - marker: b
    text: 'Theo sát tiếng Hy Lạp: “đều được cứu”; trong ngữ cảnh này, động từ ấy nói đến việc được chữa lành hoặc phục hồi sức khỏe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπου ἂν
  choice: Bất cứ nơi nào
  rationale: 'Diễn đạt tự nhiên ý nghĩa khái quát, bất định: mọi nơi Ngài đi vào.'
- source_word: εἰσεπορεύετο
  choice: Ngài vào
  rationale: Thì chưa hoàn thành mô tả hành động thường xuyên, lặp lại; kết cấu “bất cứ nơi nào” và “đều” truyền đạt rõ sắc thái ấy trong tiếng Việt.
- source_word: κώμας ἢ εἰς πόλεις ἢ εἰς ἀγρούς
  choice: dù là làng mạc, thành phố hay vùng quê
  rationale: ἀγρούς trong chuỗi địa điểm này chỉ các vùng nông thôn hoặc miền quê, không nhất thiết là những thửa ruộng riêng lẻ.
- source_word: ἐν ταῖς ἀγοραῖς
  choice: tại các quảng trường
  rationale: ἀγορά là khu công cộng dùng làm chợ hoặc quảng trường; “quảng trường” phù hợp bối cảnh người bệnh được đặt ở nơi công cộng.
- source_word: ἐτίθεσαν τοὺς ἀσθενοῦντας
  choice: người ta đều đặt những người đau yếu
  rationale: Chủ ngữ số nhiều không được nêu đích danh nên dịch là “người ta”; “đều” giúp thể hiện hành động lặp lại của thì chưa hoàn thành.
- source_word: παρεκάλουν αὐτόν
  choice: nài xin Ngài
  rationale: παρακαλέω ở đây diễn tả lời khẩn cầu tha thiết, mạnh hơn một lời đề nghị thông thường.
- source_word: ἵνα κἂν ... ἅψωνται
  choice: cho họ dù chỉ được chạm vào
  rationale: 'κἄν nêu một yêu cầu tối thiểu: chỉ cần được chạm đến cũng đủ.'
- source_word: τοῦ κρασπέδου τοῦ ἱματίου αὐτοῦ
  choice: mép áo của Ngài
  rationale: κράσπεδον có thể chỉ mép, viền hoặc tua áo. “Mép áo” giữ nghĩa rộng, tránh xác định quá mức trong chính văn.
- source_word: ἥψαντο αὐτοῦ
  choice: chạm vào Ngài
  rationale: Đại từ αὐτοῦ chỉ chính Chúa Giê-su; câu trước cho biết việc chạm này được thực hiện nơi mép áo của Ngài.
- source_word: ἐσῴζοντο
  choice: đều được chữa lành
  rationale: Trong ngữ cảnh những người đau yếu, σῴζω mang nghĩa được chữa lành hoặc làm cho khỏe lại; “đều” cũng truyền đạt tính khái quát của ὅσοι ἂν.
theological_decisions:
- issue: Nghĩa của ἐσῴζοντο (σῴζω)
  choice: đều được chữa lành
  alternative: đều được cứu / đều được làm cho lành mạnh
  rationale: σῴζω có phạm vi nghĩa rộng, gồm cứu và chữa lành. Ngữ cảnh trực tiếp nói đến người đau yếu nên chính văn dùng “được chữa lành”, đồng thời chú thích bảo lưu nghĩa sát chữ “được cứu”.
- issue: Đối tượng của ἥψαντο αὐτοῦ
  choice: chạm vào Ngài
  alternative: chạm vào mép áo ấy
  rationale: Ngữ pháp Hy Lạp dùng đại từ giống đực chỉ Chúa Giê-su, trong khi câu trước xác định phương thức là chạm mép áo. Dịch “Ngài” giữ đúng đối tượng ngữ pháp mà không phủ nhận bối cảnh.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” để chỉ Chúa Giê-su; dùng kết cấu “bất cứ… đều” nhằm thể hiện tính lặp lại và khái quát của câu Hy Lạp. Hai dấu chú thích [a], [b] đều xuất hiện trong chính văn.
