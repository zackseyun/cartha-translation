  source_fidelity: Bản dịch thể hiện tốt tính khái quát/lặp lại của ὅπου ἂν và các động từ thì chưa hoàn thành qua “Bất cứ nơi nào… đều”. “Nài xin”, “dù chỉ được chạm vào”, “mép áo”, “chạm vào Ngài”, và “đều được chữa lành” phản ánh đúng ngữ cảnh và các sắc thái chính của tiếng Hy Lạp. Tuy nhiên, ἀγοραί trước hết là các chợ/khu chợ (cũng có thể là quảng trường công cộng); “các quảng trường” đơn thuần làm mờ nét nghĩa chợ rõ hơn trong câu này.
