  text: καὶ ἦσαν οἱ φαγόντες ⸂τοὺς ἄρτους⸃ πεντακισχίλιοι ἄνδρες.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/044.yaml
  text: And those who ate the loaves were five thousand men[a][b].
translation:
  language: vi
  text: Có năm ngàn người đàn ông[b] đã ăn các ổ bánh[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “bánh.” Từ Hy Lạp có thể mang cả hai nghĩa, nhưng ở đây nói đến những ổ bánh cụ thể trong trình thuật cho ăn.
    reason: lexical_alternative
  - marker: b
    text: Tiếng Hy Lạp dùng từ “đàn ông,” cụ thể là nam giới trưởng thành, chứ không phải từ gọi chung mọi người.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦσαν
  choice: có
  rationale: Dùng cấu trúc hiện hữu “có” để diễn đạt tự nhiên trong tiếng Việt mệnh đề liên kết nêu tổng số, không thêm ý nghĩa “được đếm” vốn không được nói rõ trong tiếng Hy Lạp.
- source_word: οἱ φαγόντες
  choice: đã ăn
  rationale: Phân từ aorist có mạo từ xác định nhóm người qua hành động ăn đã hoàn tất; “đã ăn” diễn đạt rõ và tự nhiên mà không hàm ý quá khứ hoàn thành quá mức.
- source_word: τοὺς ἄρτους
  choice: các ổ bánh
  rationale: Danh từ số nhiều chỉ những ổ bánh cụ thể trong trình thuật cho ăn; “các ổ bánh” giữ được tính cụ thể và số nhiều, trong khi “bánh” cũng là một khả năng.
- source_word: πεντακισχίλιοι
  choice: năm ngàn
  rationale: Chuyển trực tiếp số từ cardinal sang cách nói thông dụng trong tiếng Việt.
- source_word: ἄνδρες
  choice: người đàn ông
  rationale: ἀνήρ ở đây chỉ nam giới trưởng thành chứ không phải từ gọi chung mọi người; cách dịch này giữ nguyên tính xác định về giới của bản Hy Lạp.
theological_decisions:
- issue: Từ chỉ giới tính trong số người được nêu
  choice: Dịch ἄνδρες là “người đàn ông” trong chính văn.
  alternative: người
  rationale: Bản Hy Lạp dùng từ chỉ riêng nam giới trưởng thành, không dùng từ chung cho con người. Vì vậy không trung hòa thành “người,” đồng thời cũng không suy diễn liệu phụ nữ và trẻ em có hiện diện hay được tính riêng hay không.
translation_notes:
  register: Văn phong hiện đại, rõ ràng và trang trọng vừa phải. Cấu trúc “Có năm ngàn…” tự nhiên hơn trong tiếng Việt so với việc mô phỏng cứng trật tự Hy Lạp; các dấu chú thích được đặt ngay sau cụm từ liên quan.
