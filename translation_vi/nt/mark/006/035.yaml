  text: Καὶ ἤδη ὥρας πολλῆς γενομένης προσελθόντες αὐτῷ οἱ μαθηταὶ αὐτοῦ ⸀ἔλεγον ὅτι Ἔρημός ἐστιν ὁ τόπος, καὶ ἤδη ὥρα πολλή·
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/035.yaml
  text: And when it was already very late[a], his disciples came to him and were saying, “This place is deserted[b], and it is already very late.”
translation:
  language: vi
  text: 'Khi trời đã muộn lắm[a], các môn đệ đến gần Đức Giê-su và nói với Người: “Nơi này hoang vắng, mà trời đã muộn lắm rồi.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “khi một giờ muộn đã đến”; cũng có thể hiểu là “khi đã muộn nhiều.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤδη
  choice: đã / đã… rồi
  rationale: Diễn tả thời gian đã tiến đến một thời điểm muộn; cách dùng “đã” và “đã… rồi” tự nhiên trong tiếng Việt và giữ được sắc thái của cả hai lần xuất hiện.
- source_word: ὥρας πολλῆς γενομένης
  choice: khi trời đã khá muộn
  rationale: Đây là kết cấu sở hữu cách tuyệt đối, theo ngữ cảnh chỉ thời điểm trong ngày đã muộn. “Trời đã khá muộn” truyền đạt thành ngữ này tự nhiên hơn cách dịch sát từng chữ.
- source_word: προσελθόντες αὐτῷ
  choice: đến gần Đức Giê-su
  rationale: Động từ προσέρχομαι chỉ việc đến hoặc tiến lại gần một người. Nêu “Đức Giê-su” thay cho đại từ giúp câu tiếng Việt rõ ràng mà không thêm nội dung.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: các môn đồ
  rationale: “Môn đồ” là cách gọi trang trọng, quen thuộc và dễ hiểu đối với μαθητής trong văn cảnh những người theo Đức Giê-su; quan hệ sở hữu đã rõ qua ngữ cảnh.
- source_word: ἔλεγον
  choice: thưa với Người
  rationale: Dạng chưa hoàn thành mô tả lời nói trong diễn tiến câu chuyện. Tiếng Việt không cần hình thức tiếp diễn cứng nhắc; “thưa” phù hợp với lời của môn đồ nói với thầy và giữ giọng văn trang trọng.
- source_word: Ἔρημός ἐστιν ὁ τόπος
  choice: Nơi này hoang vắng
  rationale: ἔρημος ở đây nói đến nơi ít người ở, biệt lập hoặc vắng vẻ, không nhất thiết mang nghĩa cảm xúc là tiêu điều. “Nơi này” diễn đạt tự nhiên mạo từ xác định trong ngữ cảnh trực chỉ.
- source_word: καὶ ἤδη ὥρα πολλή
  choice: mà trời đã muộn lắm rồi
  rationale: Câu trực tiếp nhắc lại và nhấn mạnh thời gian đã muộn. “Muộn lắm rồi” phản ánh ὥρα πολλή và tạo lời nói tự nhiên trong tiếng Việt; “mà” nối hai lý do theo mạch phát biểu.
theological_decisions: []
translation_notes:
  register: 'Văn phong hiện đại, trang trọng và dễ hiểu. Bản dịch ưu tiên tương đương tối ưu: giữ sự lặp lại có chủ ý về việc trời đã muộn, đồng thời chuyển thành ngữ Hy Lạp sang cách nói tự nhiên của tiếng Việt. Danh xưng “Người” được viết hoa theo quy ước văn phong Kinh Thánh tiếng Việt, không nhằm giải quyết thêm một vấn đề thần học trong câu.'
