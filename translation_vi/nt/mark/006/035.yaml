revisions:
- from: 'Khi trời đã khá muộn[a], các môn đồ đến gần Đức Giê-su và thưa với Người: “Nơi này hoang vắng, mà trời đã muộn lắm rồi.”'
  to: 'Khi trời đã muộn lắm[a], các môn đệ đến gần Đức Giê-su và nói với Người: “Nơi này hoang vắng, mà trời đã muộn lắm rồi.”'
  rationale: Bản sửa tăng cường mức độ “muộn” ở mệnh đề mở đầu để phản ánh ὥρας πολλῆς và giữ sự lặp lại của nguyên văn. “Các môn đệ ... nói” là cách diễn đạt hiện đại, trung tính, không thêm sắc thái kính ngữ. Chú thích được sửa để phản ánh thành ngữ Hy Lạp một cách chính xác và dễ hiểu.
