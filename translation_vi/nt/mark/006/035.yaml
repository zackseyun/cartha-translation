review_pass:
  verdict: revise
  source_fidelity: Bản dịch truyền đạt đúng mạch câu và ý nghĩa của ἔρημος là nơi hoang vắng. Tuy nhiên, “khá muộn” làm nhẹ sắc thái của ὥρας πολλῆς so với mệnh đề sau “muộn lắm rồi”; nguyên ngữ nhấn mạnh thời điểm đã rất muộn ở cả hai lần. “Thưa” là một lựa chọn diễn giải mức độ kính ngữ không được đánh dấu rõ trong ἔλεγον.
  naturalness: Câu văn nhìn chung tự nhiên. “Các môn đệ ... nói” là cách gọi và cách thuật lời hiện đại, trung tính hơn “các môn đồ ... thưa”, đồng thời vẫn phù hợp văn phong trang trọng.
  terminology: Dùng “Đức Giê-su” nhất quán với bản thảo. Thay “môn đồ” bằng “môn đệ” để phù hợp hơn với tiếng Việt hiện đại phổ thông. Đại từ “Người” được giữ theo quy ước văn phong của bản thảo, không thêm khẳng định thần học.
  issues:
  - severity: medium
    issue: “khá muộn” làm yếu mức độ của ὥρας πολλῆς.
    rationale: Cụm này, trong ngữ cảnh, chỉ một thời điểm đã muộn nhiều/rất muộn; bản dịch nên giữ tương quan nhấn mạnh với lần lặp lại trong lời các môn đệ.
  - severity: low
    issue: “thưa” thêm sắc thái kính ngữ cụ thể.
    rationale: ἔλεγον chỉ việc nói và dạng chưa hoàn thành; “nói” giữ cách thuật trung tính hơn mà không áp đặt sắc thái xã hội vượt quá nguyên văn.
  - severity: low
    issue: Nội dung chú thích hiện có “khi giờ đã trở nên nhiều” không phải là cách dịch sát rõ ràng của thành ngữ.
    rationale: Nên mô tả thành ngữ là “một giờ muộn đã đến” và nêu ý nghĩa theo ngữ cảnh, thay vì một bản dịch sát khó hiểu.
