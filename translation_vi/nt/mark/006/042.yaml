translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Câu ngắn, giữ nhịp kể đơn giản của nguyên văn; “no nê” diễn tả rõ sự ăn no mà không thêm hàm ý thần học.
