  naturalness: “Được no nê” có thể hiểu được nhưng hơi gượng trong tiếng Việt hiện đại; “được no” tự nhiên, gọn, và vẫn biểu đạt kết quả được ăn cho no của thể bị động ἐχορτάσθησαν.
