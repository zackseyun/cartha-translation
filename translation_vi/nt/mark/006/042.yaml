  text: And they all ate and were satisfied.
translation:
  language: vi
  text: Mọi người đều ăn và được no.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔφαγον
  choice: ăn
  rationale: Động từ aorist chủ động của ἐσθίω, mang nghĩa thông thường là ăn. “Ăn” là cách dịch trực tiếp, tự nhiên; không cần thêm tân ngữ, và không nên đưa ý no đủ vào đây vì động từ kế tiếp đã diễn đạt kết quả ấy.
- source_word: πάντες
  choice: tất cả đều
  rationale: Tính từ số nhiều dùng như danh từ, chỉ toàn thể đám đông trong ngữ cảnh. “Tất cả đều” giữ trọn phạm vi phổ quát và phù hợp với cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: ἐχορτάσθησαν
  choice: được no nê
  rationale: Dạng aorist bị động của χορτάζω, diễn tả việc được cho ăn đến no, được thỏa mãn về nhu cầu ăn uống. “Được no nê” vừa giữ sắc thái bị động vừa truyền đạt kết quả đầy đủ, tự nhiên trong tiếng Việt.
- source_word: καὶ ... καὶ
  choice: '... và ...'
  rationale: Hai liên từ καί phối hợp trực tiếp hai hành động theo lối kể chuyện nối tiếp của Mác. Tiếng Việt không cần mở câu bằng “Và” trong câu trích đứng riêng; liên từ giữa hai vị ngữ vẫn bảo toàn quan hệ phối hợp mà không diễn giải thêm.
