source:
  edition: SBLGNT
  text: οἱ δὲ ἰδόντες αὐτὸν ⸂ἐπὶ τῆς θαλάσσης περιπατοῦντα⸃ ἔδοξαν ⸂ὅτι φάντασμά ἐστιν⸃ καὶ ἀνέκραξαν,
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/049.yaml
  text: But when they saw him walking on the sea[a], they thought that it was a ghost, and they cried out,
translation:
  language: vi
  text: Nhưng khi thấy Ngài đi trên mặt biển, họ tưởng đó là một bóng ma[a] và kêu thét lên.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “một ảo ảnh” hoặc “một bóng hình ma quái.” Từ Hy Lạp φάντασμα chỉ một hình bóng hoặc sự hiện ra giống ma.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ
  choice: Nhưng ... họ
  rationale: δέ mang sắc thái chuyển ý hơi tương phản, dẫn sang phản ứng của các môn đồ; mạo từ được dùng như danh từ, chỉ nhóm người đã được nhắc đến.
- source_word: ἰδόντες
  choice: khi thấy
  rationale: Phân từ bất định quá khứ được diễn đạt theo nghĩa thời gian, tự nhiên trong tiếng Việt và giữ đúng trình tự sự việc.
- source_word: αὐτὸν
  choice: Ngài
  rationale: Đại từ đối cách chỉ Chúa Giê-su; “Ngài” là cách gọi tôn kính, trang trọng và thông dụng trong văn phong Kinh Thánh tiếng Việt.
- source_word: ἐπὶ τῆς θαλάσσης περιπατοῦντα
  choice: đi trên mặt biển
  rationale: ἐπί với sở hữu cách trong ngữ cảnh này chỉ việc đi trên bề mặt nước. “Mặt biển” vừa tự nhiên trong tiếng Việt vừa làm rõ nghĩa mà không thêm nội dung.
- source_word: ἔδοξαν
  choice: họ tưởng
  rationale: δοκέω ở đây diễn tả nhận định nhầm; “tưởng” tự nhiên và chính xác hơn “nghĩ” trong ngữ cảnh này.
- source_word: ὅτι φάντασμά ἐστιν
  choice: đó là một bóng ma
  rationale: φάντασμα chỉ một hình bóng hoặc sự hiện ra mang tính ma quái. “Bóng ma” là cách diễn đạt rõ ràng, phổ thông trong tiếng Việt.
- source_word: καὶ ἀνέκραξαν
  choice: nên kêu thét lên
  rationale: ἀνακράζω chỉ tiếng kêu lớn. Liên từ καί nối phản ứng này với sự ngộ nhận ngay trước đó; “nên” diễn đạt tự nhiên quan hệ theo mạch kể, còn “kêu thét lên” giữ được cường độ của động từ.
theological_decisions:
- issue: Bản chất hành động của Chúa Giê-su trên mặt nước
  choice: đi trên mặt biển
  alternative: đi bên biển
  rationale: Trong ngữ cảnh trình thuật này, ἐπὶ τῆς θαλάσσης nói đến việc đi trên bề mặt nước, không phải đi dọc bờ biển. Cách dịch giữ nghĩa trực tiếp của trình thuật mà không tô đậm thêm.
- issue: Bản chất của điều các môn đồ tưởng mình nhìn thấy
  choice: một bóng ma
  alternative: một ảo ảnh / một bóng hình
  rationale: φάντασμα có thể chỉ một sự hiện ra hoặc bóng hình ma quái. “Bóng ma” truyền đạt nhận thức sợ hãi của các môn đồ nhưng không khẳng định rằng bóng ma thực sự tồn tại, vì câu chỉ thuật lại điều họ tưởng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu giữ nhịp kể ngắn, mạnh; “Ngài” duy trì lối xưng hô tôn kính quen thuộc, còn “kêu thét lên” thể hiện tiếng kêu lớn hàm chứa trong động từ Hy Lạp.
