  text: καὶ ἤνεγκεν τὴν κεφαλὴν αὐτοῦ ἐπὶ πίνακι καὶ ἔδωκεν αὐτὴν τῷ κορασίῳ, καὶ τὸ κοράσιον ἔδωκεν αὐτὴν τῇ μητρὶ αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/028.yaml
  text: And he brought his head on a platter and gave it to the girl[a], and the girl gave it to her mother.
translation:
  language: vi
  text: Người ấy mang đầu ông trên một chiếc mâm[a] đến và trao cho cô gái; cô gái trao đầu ấy cho mẹ mình.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “khay” hoặc “đĩa lớn”. Từ Hy Lạp πίναξ chỉ một chiếc đĩa, mâm hoặc khay dùng để bày thức ăn.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤνεγκεν
  choice: mang
  rationale: Động từ aorist của φέρω diễn tả việc mang chiếc đầu đã bị chém vào nơi yến tiệc; “mang” tự nhiên và không thêm chi tiết về cách thức.
- source_word: τὴν κεφαλὴν αὐτοῦ
  choice: đầu ông
  rationale: Đại từ αὐτοῦ chỉ Giăng trong văn cảnh trước. “Đầu ông” là cách diễn đạt gọn, tự nhiên trong tiếng Việt và tránh lặp tên không có trong câu Hy Lạp.
- source_word: ἐπὶ πίνακι
  choice: đặt trên một chiếc mâm
  rationale: πίναξ chỉ vật dụng phẳng dùng để bày hoặc dọn thức ăn, có thể là mâm, khay hay đĩa lớn. “Chiếc mâm” phù hợp với bối cảnh yến tiệc; thêm “đặt” giúp cấu trúc tiếng Việt tự nhiên mà không thay đổi hành động chính.
- source_word: ἔδωκεν
  choice: trao / trao lại
  rationale: δίδωμι có nghĩa cơ bản là “cho, trao”. “Trao” phù hợp với vật cụ thể được chuyển tận tay; “trao lại” ở lần thứ hai làm rõ bước chuyển tiếp trong chuỗi hành động mà không thay đổi nội dung.
- source_word: τῷ κορασίῳ / τὸ κοράσιον
  choice: cô gái
  rationale: κοράσιον chỉ một bé gái hoặc cô gái trẻ. “Cô gái” là cách gọi hiện đại, tự nhiên, không cổ kính và không xác định tuổi cụ thể hơn nguyên văn.
- source_word: τῇ μητρὶ αὐτῆς
  choice: cho mẹ mình
  rationale: Đại từ αὐτῆς quy chiếu về cô gái. Trong tiếng Việt, “mẹ mình” thể hiện rõ quan hệ sở hữu theo chủ thể của mệnh đề và tránh sự mơ hồ có thể có ở “mẹ cô ấy”.
