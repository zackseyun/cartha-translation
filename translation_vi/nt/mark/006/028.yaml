  to: Người ấy mang đầu ông trên một chiếc mâm[a] đến và trao cho cô gái; cô gái trao đầu ấy cho mẹ mình.
  rationale: Bản sửa diễn đạt ἤνεγκεν bằng «mang ... đến», để cụm «trên một chiếc mâm» trực tiếp mô tả cách đầu được mang đến, không thêm hành động «đặt». Cả hai lần ἔδωκεν được dịch nhất quán là «trao», đồng thời «đầu ấy» làm rõ tân ngữ của lần trao thứ hai.
