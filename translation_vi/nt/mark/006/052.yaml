  yaml_path: translation/nt/mark/006/052.yaml
  text: for they did not understand about the loaves[b][a], but their hearts were hardened.
translation:
  language: vi
  text: Vì họ không hiểu về những ổ bánh[a], nhưng lòng họ đã chai cứng[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “họ không nắm được ý nghĩa của những ổ bánh.”'
    reason: lexical_alternative
  - marker: b
    text: 'Hoặc: “lòng họ đã trở nên chai lì” hoặc “lòng họ đã bị cứng lại.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: συνῆκαν
  choice: không hiểu được
  rationale: Động từ συνίημι chỉ việc hiểu hoặc nắm bắt; cách dịch này tự nhiên và giữ được sự thất bại về nhận thức thuộc linh trong ngữ cảnh.
- source_word: ἐπὶ τοῖς ἄρτοις
  choice: ý nghĩa của những ổ bánh
  rationale: Cụm ἐπί với tặng cách ở đây hướng đến điều các môn đồ lẽ ra phải nhận ra qua phép lạ về bánh, chứ không chỉ là kiến thức về các ổ bánh. Cách dịch làm rõ thành ngữ nhưng không giải thích cụ thể ý nghĩa ấy là gì.
- source_word: ἄρτοις
  choice: những ổ bánh
  rationale: Danh từ số nhiều ἄρτοις nói đến các ổ bánh cụ thể trong phép lạ hóa bánh ra nhiều; “những ổ bánh” chính xác hơn từ khái quát “bánh”.
- source_word: ἀλλ’ ἦν
  choice: mà ... đã trở nên
  rationale: ἀλλά nêu sự tương phản, còn ἦν kết hợp với phân từ hoàn thành diễn tả tình trạng đang tồn tại; tiếng Việt dùng “mà” và “đã trở nên” để chuyển tải mối tương phản cùng trạng thái kết quả.
- source_word: αὐτῶν ἡ καρδία
  choice: lòng họ
  rationale: καρδία là danh từ số ít mang nghĩa tập thể, chỉ con người bên trong, gồm sự hiểu biết và khuynh hướng. “Lòng họ” vừa tự nhiên trong tiếng Việt vừa giữ được số ít tập thể của nguyên văn.
- source_word: πεπωρωμένη
  choice: chai cứng
  rationale: πωρόω gợi hình ảnh làm cứng hoặc chai lì và theo nghĩa bóng chỉ sự vô cảm, trì độn thuộc linh. “Chai cứng” giữ được hình ảnh này mà không quy định nguyên nhân của tình trạng ấy.
theological_decisions:
- issue: Bản chất và nguyên nhân tình trạng πεπωρωμένη của các môn đồ
  choice: lòng họ đã trở nên chai cứng
  alternative: lòng họ đã bị làm cho cứng lại
  rationale: Nguyên văn mô tả tình trạng chai cứng nhưng không nêu rõ tác nhân. Cách dịch được chọn tránh mặc nhiên gán tình trạng này cho một tác nhân thần học cụ thể, đồng thời vẫn giữ sắc thái kết quả của thể hoàn thành.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Lòng họ” là cách nói tự nhiên trong tiếng Việt cho danh từ số ít mang nghĩa tập thể; “chai cứng” giữ ẩn dụ về sự mất nhạy bén thuộc linh. Các dấu chú thích [a], [b] đều xuất hiện ngay sau cụm từ liên quan.
