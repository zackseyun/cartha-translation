revisions:
- from: Vì họ không hiểu được ý nghĩa của những ổ bánh[a], mà lòng họ đã trở nên chai cứng[b].
  to: Vì họ không hiểu về những ổ bánh[a], nhưng lòng họ đã chai cứng[b].
  rationale: Chuyển phần giải thích về ý nghĩa của phép lạ từ bản văn chính sang chú thích để bảo toàn độ mở của ἐπὶ τοῖς ἄρτοις. Điều chỉnh liên từ để diễn đạt rõ và tự nhiên tương phản ἀλλά. Thay lựa chọn chú thích “cứng cỏi” bằng các cách diễn đạt giữ sắc thái chai lì, vô cảm của πεπωρωμένη, không nêu tác nhân của tình trạng này.
