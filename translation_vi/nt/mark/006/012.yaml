  text: And they went out and proclaimed that people should repent[a].
translation:
  language: vi
  text: Họ ra đi và rao giảng rằng người ta phải ăn năn[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc, sát cấu trúc hơn: “để/hầu cho họ ăn năn”; “họ” chỉ những người nghe lời rao giảng.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: và
  rationale: Liên từ nối câu này với trình thuật sai phái ngay trước đó; trong tiếng Việt có thể lược đi ở đầu câu để lời văn tự nhiên mà vẫn giữ mạch kể liên tục.
- source_word: ἐξελθόντες
  choice: họ ra đi
  rationale: Phân từ bất định quá khứ chỉ hành động của các môn đồ; chuyển thành động từ hữu hạn là cách kể tự nhiên trong tiếng Việt.
- source_word: ἐκήρυξαν
  choice: rao giảng
  rationale: Diễn tả việc công khai loan báo sứ điệp. “Rao giảng” giữ được sắc thái công bố và phù hợp với văn cảnh mà không thu hẹp thành lời dạy riêng tư.
- source_word: ἵνα
  choice: rằng ... phải
  rationale: Ở đây giới thiệu nội dung hoặc kết quả được mong đợi của lời rao giảng. Cấu trúc này tự nhiên trong tiếng Việt và không buộc phải phân định dứt khoát giữa nội dung với mục đích.
- source_word: μετανοῶσιν
  choice: ăn năn
  rationale: Động từ nói đến sự thay đổi tâm trí và hướng sống đáp lại Đức Chúa Trời. “Ăn năn” là cách diễn đạt ngắn gọn, quen thuộc và có đủ sức nặng trong văn cảnh Phúc Âm; “thay đổi suy nghĩ” quá hẹp.
theological_decisions:
- issue: Có nên nêu rõ chủ thể ngầm của μετανοῶσιν hay không
  choice: người ta phải ăn năn
  alternative: họ phải ăn năn
  rationale: Chủ thể số nhiều được hiểu là những người nghe lời rao giảng, không phải các môn đồ. “Người ta” làm rõ ý này trong câu chính; chú thích vẫn bảo tồn hình thức sát chữ và sự quy chiếu ngầm của nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Câu ngắn giữ nhịp kể của nguyên văn; thuật ngữ “ăn năn” được dùng theo nghĩa Kinh Thánh quen thuộc mà không thêm nét giáo phái.
