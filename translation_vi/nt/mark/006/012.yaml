  source_fidelity: 'Bản dịch chính truyền đạt đúng các môn đồ ra đi rao giảng, với lời kêu gọi người nghe ăn năn. “Rao giảng” phản ánh tốt ἐκήρυξαν, và “ăn năn” là cách dịch chuẩn, đầy đủ hơn những cách diễn đạt chỉ nói về thay đổi suy nghĩ. Tuy nhiên, chú thích gọi “rằng họ phải ăn năn” là “sát chữ hơn” chưa thật chính xác: ἵνα thường được diễn đạt sát hơn bằng “để/hầu cho,” còn μετανοῶσιν là lối giả định, không tự nó có từ tương đương trực tiếp với “phải.”'
