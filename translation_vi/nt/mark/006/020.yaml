revisions:
- from: Vì Hê-rốt sợ Giăng, biết ông là người công chính và thánh khiết, nên bảo vệ ông. Mỗi khi nghe ông giảng, vua rất bối rối[a], nhưng vẫn vui lòng lắng nghe.
  to: Vì Hê-rốt sợ Giăng; ông biết Giăng là một người công chính và thánh khiết, và ông bảo vệ Giăng. Khi nghe Giăng nói, Hê-rốt rất bối rối[a], nhưng vẫn vui lòng lắng nghe ông.
  rationale: Bản sửa loại bỏ các bổ sung không cần thiết (“mỗi khi”, “giảng”, “vua”), duy trì diễn tiến cú pháp của tiếng Hy Lạp, và giữ sự căng thẳng trong bản SBLGNT giữa việc Hê-rốt bối rối và vẫn vui thích nghe Giăng. “Giăng nói” chỉ làm tường minh cách hiểu tự nhiên của “nghe Giăng” mà không gán cho ông một thể loại diễn thuyết cụ thể. Chú thích được chỉnh để không thêm tước hiệu ngoài nguồn và để phản ánh chính xác dị bản ἐποίει.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T07:39:56Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch theo đúng bản SBLGNT ở điểm chính: Hê-rốt sợ Giăng, nhận biết ông là người công chính và thánh khiết, bảo vệ ông, bối rối nhiều khi nghe ông, nhưng vẫn thích nghe ông. Tuy nhiên, “Mỗi khi” diễn giải phân từ aorist như một hành động lặp lại; “giảng” thêm một hoạt động không được nói rõ; và “vua” thêm tước hiệu không có trong câu nguồn (và không nên áp vào Hê-rốt tại đây).'
  naturalness: Văn phong nhìn chung tự nhiên. Bản sửa dùng các chủ ngữ rõ ràng để tránh việc “ông” có thể chỉ Hê-rốt hoặc Giăng, đồng thời giữ nhịp văn kể chuyện hiện đại, trang trọng.
  terminology: “Công chính” và “thánh khiết” thích hợp cho δίκαιος và ἅγιος. Giữ tên “Hê-rốt” và “Giăng” theo cách dùng Việt ngữ quen thuộc. “Bảo vệ” truyền đạt tốt συνετήρει trong ngữ cảnh.
  issues:
  - severity: medium
    issue: “Mỗi khi nghe ông giảng” thêm sắc thái lặp lại và thêm nội dung “giảng”.
    rationale: ἀκούσας là phân từ aorist, tự nó chỉ hoàn cảnh “khi/sau khi nghe”; bản văn chỉ nói Hê-rốt nghe Giăng, không xác định đây là một lần lặp lại bằng “mỗi khi” và không gọi hoạt động ấy là “giảng”.
  - severity: medium
    issue: Từ “vua” được thêm vào bản dịch và chú thích.
    rationale: Câu Hy Lạp chỉ dùng đại từ chỉ Hê-rốt, không nêu tước hiệu. Việc thêm “vua” không cần thiết cho sự rõ nghĩa và có thể gây sai lệch lịch sử về địa vị của Hê-rốt trong bối cảnh này.
  - severity: low
    issue: Liên từ “nên” nối “biết” với “bảo vệ” làm quan hệ nhân quả trực tiếp hơn nguyên văn.
    rationale: Phân từ εἰδὼς giải thích thái độ của Hê-rốt, còn συνετήρει là một mệnh đề phối hợp. Dùng “và” giữ cấu trúc và độ mở của bản văn tốt hơn.
  revised_text: Vì Hê-rốt sợ Giăng; ông biết Giăng là một người công chính và thánh khiết, và ông bảo vệ Giăng. Khi nghe Giăng nói, Hê-rốt rất bối rối[a], nhưng vẫn vui lòng lắng nghe ông.
