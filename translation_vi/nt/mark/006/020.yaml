id: MRK.6.20
reference: Mark 6:20
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὁ γὰρ Ἡρῴδης ἐφοβεῖτο τὸν Ἰωάννην, εἰδὼς αὐτὸν ἄνδρα δίκαιον καὶ ἅγιον, καὶ συνετήρει αὐτόν, καὶ ἀκούσας αὐτοῦ πολλὰ ⸀ἠπόρει, καὶ ἡδέως αὐτοῦ ἤκουεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/020.yaml
  text: For Herod feared John[a], knowing that he was a righteous and holy man, and he kept him safe. And when he heard him, he was greatly perplexed, and yet he listened to him gladly.
translation:
  language: vi
  text: Vì Hê-rốt sợ Giăng; ông biết Giăng là một người công chính và thánh khiết, và ông bảo vệ Giăng. Khi nghe Giăng nói, Hê-rốt rất bối rối[a], nhưng vẫn vui lòng lắng nghe ông.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Một số thủ bản chép: “Hê-rốt làm nhiều việc” thay cho “Hê-rốt rất bối rối.”'
    reason: textual_variant
lexical_decisions:
- source_word: ἐφοβεῖτο
  choice: sợ
  rationale: Giữ nghĩa trực tiếp và sắc thái kéo dài của động từ ở thì chưa hoàn thành; ngữ cảnh cho thấy nỗi sợ này đi cùng sự kính nể phẩm chất của Giăng.
- source_word: εἰδὼς
  choice: biết
  rationale: Phân từ nêu cơ sở cho thái độ và hành động của Hê-rốt; cấu trúc “biết... nên” diễn đạt tự nhiên quan hệ nguyên nhân trong tiếng Việt.
- source_word: ἄνδρα δίκαιον καὶ ἅγιον
  choice: người công chính và thánh khiết
  rationale: “Công chính” diễn đạt sự ngay thẳng về đạo đức của δίκαιος; “thánh khiết” diễn đạt phẩm chất biệt riêng cho Đức Chúa Trời và trong sạch của ἅγιος mà không biến từ này thành danh hiệu.
- source_word: συνετήρει
  choice: bảo vệ
  rationale: Trong ngữ cảnh Hê-rốt giữ Giăng khỏi bị làm hại, nhất là trước ý định của Hê-rô-đia; “bảo vệ” rõ và tự nhiên hơn cách dịch mơ hồ “giữ ông”.
- source_word: ἀκούσας αὐτοῦ
  choice: mỗi khi nghe ông giảng
  rationale: Phân từ aorist có thể diễn tả hoàn cảnh lặp lại bên cạnh các động từ chưa hoàn thành; thêm “giảng” làm rõ rằng Hê-rốt nghe lời Giăng nói mà không đổi ý chính.
- source_word: πολλὰ ἠπόρει
  choice: rất bối rối
  rationale: Theo SBLGNT, ἠπόρει diễn tả sự lúng túng, không biết phải xử trí thế nào; πολλὰ tăng cường mức độ.
- source_word: ἡδέως αὐτοῦ ἤκουεν
  choice: vẫn vui lòng lắng nghe
  rationale: “Vui lòng lắng nghe” truyền đạt niềm thích thú hoặc sự sẵn lòng của ἡδέως; “vẫn” làm nổi bật sự tương phản thực có giữa bối rối và tiếp tục thích nghe.
theological_decisions:
- issue: Dị bản văn bản trong mệnh đề nói về phản ứng của Hê-rốt khi nghe Giăng
  choice: 'Theo SBLGNT: “vua rất bối rối” (ἠπόρει)'
  alternative: “vua làm nhiều việc” (ἐποίει)
  rationale: Bản văn phê bình đọc ἠπόρει, tạo nên sự căng thẳng có ý nghĩa giữa trạng thái bối rối của Hê-rốt và việc vua vẫn vui lòng nghe Giăng. Dị bản ἐποίει làm thay đổi đáng kể ý nghĩa nên được ghi ở chú thích.
translation_notes:
  register: 'Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “vua” ở mệnh đề sau để tránh chuỗi đại từ dễ gây nhập nhằng, đồng thời vẫn tự nhiên trong văn kể chuyện. Tên riêng theo dạng tiếng Việt quen dùng: Hê-rốt, Giăng.'
