review_pass:
  verdict: revise
  source_fidelity: Bản nháp truyền đạt đúng hành trình bằng thuyền tới một nơi hẻo lánh và ý tách riêng. Tuy nhiên, «Vậy» dễ tạo quan hệ hệ quả không được καί khẳng định; «Và» trung tính hơn. Chú thích b có phương án «một mình» không phù hợp rõ ràng với chủ ngữ số nhiều, và vị trí ký hiệu nên gắn trực tiếp với «đi riêng».
  naturalness: «Họ xuống thuyền đi riêng đến một nơi vắng vẻ» nhìn chung tự nhiên. Thêm dấu phẩy sau «thuyền» giúp tách rõ phương tiện với trạng ngữ «đi riêng» mà vẫn giữ nhịp văn kể ngắn gọn.
  terminology: «Thuyền» phù hợp với πλοῖον trong bối cảnh Tin Mừng; «nơi vắng vẻ» diễn đạt tốt ἔρημος τόπος, không ép nghĩa thành sa mạc. «Đi riêng» là cách hiện đại, tự nhiên cho κατ’ ἰδίαν.
  issues:
  - severity: low
    issue: «Vậy» diễn giải liên hệ của καί.
    rationale: καί ở đây là liên từ tiếp nối đơn thuần. «Và» giữ tính paratactic của nguyên văn tốt hơn và không gợi suy luận nhân-quả.
  - severity: medium
    issue: Chú thích b dùng «một mình» với chủ ngữ số nhiều.
    rationale: κατ’ ἰδίαν ở đây bổ nghĩa cho «họ»; «một mình» thường quy chiếu một cá nhân và có thể làm sai sắc thái số nhiều. Cần thay bằng phương án diễn đạt sự riêng tư/tách riêng.
  revised_text: Và họ xuống thuyền, đi riêng đến một nơi vắng vẻ[a][b].
