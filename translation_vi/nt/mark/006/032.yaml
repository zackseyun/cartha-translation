  text: And they went away in the boat to a desolate place by themselves[a][b].
translation:
  language: vi
  text: Và họ xuống thuyền, đi riêng đến một nơi vắng vẻ[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “một nơi hoang vắng” hoặc “một nơi không có người ở.”
    reason: lexical_alternative
  - marker: b
    text: Hay “cách riêng tư” hoặc “tách riêng khỏi những người khác.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Vậy
  rationale: Trong mạch kể chuyện, καί nối hành động này với ý định vừa nêu ở câu trước. “Vậy” diễn đạt tự nhiên sự tiếp nối ấy trong tiếng Việt mà không thêm quan hệ nhân quả mạnh.
- source_word: ἀπῆλθον
  choice: đi
  rationale: Động từ aorist của ἀπέρχομαι chỉ việc rời nơi đang ở để đi nơi khác. Trong kết cấu “xuống thuyền đi… đến”, “đi” là cách diễn đạt tự nhiên và đã hàm ý rời đi.
- source_word: ἐν τῷ πλοίῳ
  choice: xuống thuyền
  rationale: Cụm Hy Lạp theo nghĩa sát là “trong chiếc thuyền”, nhưng trong tiếng Việt, “xuống thuyền đi” diễn đạt phương tiện và hành động lên đường tự nhiên hơn; “thuyền” phù hợp bối cảnh hồ Ga-li-lê.
- source_word: εἰς ἔρημον τόπον
  choice: đến một nơi vắng vẻ
  rationale: ἔρημος τόπος là nơi không có hoặc ít người cư trú, biệt lập. “Nơi vắng vẻ” vừa tự nhiên trong tiếng Việt hiện đại vừa tránh khiến người đọc mặc nhiên hiểu là sa mạc.
- source_word: κατ’ ἰδίαν
  choice: đi riêng
  rationale: Thành ngữ này chỉ việc tách khỏi đám đông, ở riêng hoặc kín đáo. “Đi riêng” phù hợp chủ ngữ số nhiều và giữ được sắc thái tách biệt mà không nhất thiết nói rằng hoàn toàn không có ai khác.
