- from: Vậy, họ xuống thuyền đi riêng đến một nơi vắng vẻ[a][b].
  to: Và họ xuống thuyền, đi riêng đến một nơi vắng vẻ[a][b].
  rationale: Đổi «Vậy» thành «Và» để không thêm sắc thái hệ quả; chỉnh dấu câu để làm rõ cấu trúc; thay phương án số ít trong chú thích b bằng các cách diễn đạt phù hợp với chủ ngữ số nhiều. Ký hiệu chú thích được giữ sau cụm đích, trong đó b gắn với «đi riêng».
