  rationale: Bản sửa giữ sát lời thề và lời hứa mở của nguyên ngữ, nhưng thay “con–ta” bằng “cô–ta” để không đưa vào quan hệ gia đình hoặc tuổi tác mà câu Hy Lạp không xác định. Chú thích a được dời đến đúng cụm “bất cứ điều gì” và viết lại theo tiếng Việt hiện đại; chú thích b được giữ nguyên vì giải thích hợp lý tính cường điệu của công thức hoàng gia.
