base_translation:
  language: en
  yaml_path: translation/nt/mark/006/023.yaml
  text: And he swore to her[a], “Whatever you ask me, I will give you[b], up to half of my kingdom.”
translation:
  language: vi
  text: 'Ông thề với cô gái: “Cô xin ta bất cứ điều gì[a], ta sẽ ban cho cô, cho đến một nửa vương quốc của ta[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “Dù cô xin ta điều gì.”'
    reason: lexical_alternative
  - marker: b
    text: “Cho đến một nửa vương quốc của ta” là lối nói cường điệu theo thông lệ trong lời đề nghị của bậc vua chúa.
    reason: cultural_note
lexical_decisions:
- source_word: ὤμοσεν
  choice: thề
  rationale: Động từ ở thì aorist diễn tả việc lập lời thề; “thề” tự nhiên, ngắn gọn và giữ nguyên tính long trọng của lời cam kết.
- source_word: αὐτῇ
  choice: với cô gái
  rationale: Đại từ tặng cách giống cái chỉ cô gái trong văn cảnh. Dùng “cô gái” giúp quy chiếu rõ ràng trong tiếng Việt mà không thêm ý nghĩa ngoài văn cảnh.
- source_word: Ὅ τι ἐάν
  choice: Bất cứ điều gì
  rationale: Cấu trúc quan hệ bất định diễn tả phạm vi không giới hạn của lời đề nghị; cách dịch này tự nhiên và giữ được sắc thái mở.
- source_word: με αἰτήσῃς
  choice: con xin ta
  rationale: αἰτέω có nghĩa là xin hoặc yêu cầu. Cặp đại từ “con–ta” phù hợp với lời một người cai trị lớn tuổi nói với cô gái trong bối cảnh này, đồng thời không hàm ý quan hệ huyết thống.
- source_word: δώσω σοι
  choice: ta sẽ ban cho con
  rationale: Thì tương lai mang lực cam kết. “Ban cho” phù hợp với lời nói mang sắc thái vương giả, nhưng vẫn dễ hiểu trong tiếng Việt hiện đại.
- source_word: ἕως ἡμίσους
  choice: cho đến một nửa
  rationale: ἕως ở đây chỉ giới hạn về mức độ, không phải thời gian; cụm này truyền đạt đúng giới hạn định lượng của lời đề nghị.
- source_word: τῆς βασιλείας μου
  choice: vương quốc của ta
  rationale: βασιλεία có thể chỉ vương quyền, sự trị vì hoặc lãnh thổ; trong công thức đề nghị mang tính vương giả này, “vương quốc” là nghĩa cụ thể và tự nhiên nhất.
theological_decisions:
- issue: Nghĩa của βασιλεία trong lời Hê-rốt
  choice: vương quốc
  alternative: vương quyền; quyền cai trị
  rationale: Ngữ cảnh là một lời thề phô trương theo lối vương giả, nên nghĩa lãnh thổ “vương quốc” phù hợp hơn nghĩa trừu tượng. Cách dịch này không áp đặt nghĩa thần học kỹ thuật lên lời của Hê-rốt.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Ông” tiếp nối lời kể về Hê-rốt; “cô gái” làm rõ đối tượng của đại từ αὐτῇ. Trong lời trực tiếp, “con–ta” thể hiện chênh lệch tuổi tác và địa vị mà không nhất thiết biểu thị quan hệ gia đình.
