  source_fidelity: 'Bản dịch giữ đúng trình tự và các hành động của nguyên văn: các môn đồ của Giăng nghe tin, đến, đem thi thể ông đi, rồi đặt trong nơi mai táng. “Thi thể” chuyển tải chính xác πτῶμα là xác người chết; “một ngôi mộ” phù hợp với μνημεῖον trong ngữ cảnh an táng.'
  naturalness: Câu tiếng Việt hiện đại, rõ ràng và trang trọng. “Nghe tin” là cách diễn đạt tự nhiên cho phân từ ἀκούσαντες trong mạch truyện, không thêm một chi tiết thực chất nào. “Mang thi thể ông đi” diễn đạt tự nhiên hành động αἴρω trong bối cảnh này.
  terminology: “Môn đồ” thích hợp cho μαθηταί trong văn phong Kinh Thánh hiện đại. Đại từ “ông” được ngữ cảnh trực tiếp xác định là Giăng Báp-tít, đồng thời phản ánh cách dùng đại từ αὐτοῦ của nguyên văn. “Thi thể” và “ngôi mộ” giữ sắc thái trang trọng và nghĩa mai táng phù hợp.
