source:
  edition: SBLGNT
  text: καὶ ἀκούσαντες οἱ μαθηταὶ αὐτοῦ ἦλθον καὶ ἦραν τὸ πτῶμα αὐτοῦ καὶ ἔθηκαν αὐτὸ ἐν μνημείῳ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/029.yaml
  text: And when his disciples heard[a], they came and took up his body and laid it in a tomb.
translation:
  language: vi
  text: Khi các môn đồ của ông nghe tin, họ đến, mang thi thể ông đi và đặt trong một ngôi mộ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀκούσαντες
  choice: Khi ... nghe tin
  rationale: Phân từ bất định có ý nghĩa thời gian; “nghe tin” tự nhiên trong tiếng Việt và phù hợp với việc họ nhận được tin về cái chết của Giăng.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: các môn đồ của ông
  rationale: μαθηταί thường chỉ những môn đồ; “của ông” giữ nguyên đại từ và trong ngữ cảnh quy chiếu về Giăng Báp-tít.
- source_word: ἦλθον
  choice: họ đến
  rationale: Diễn đạt trực tiếp hành động đến nơi xảy ra sự việc.
- source_word: ἦραν
  choice: mang ... đi
  rationale: αἴρω ở đây bao hàm việc nhấc và đem thi thể đi; cách diễn đạt này tự nhiên hơn “nhấc lên” trong văn cảnh mai táng.
- source_word: πτῶμα
  choice: thi thể
  rationale: πτῶμα chỉ cụ thể một thân xác đã chết; “thi thể” chính xác, trang trọng và tự nhiên, nên không cần làm nhẹ thành “thân thể”.
- source_word: ἔθηκαν
  choice: đặt
  rationale: τίθημι trong ngữ cảnh mai táng mang nghĩa đặt thi thể vào nơi chôn cất; “đặt” rõ ràng và trang nghiêm.
- source_word: ἐν μνημείῳ
  choice: trong một ngôi mộ
  rationale: μνημεῖον ở đây là nơi mai táng; “ngôi mộ” là cách gọi phổ thông, tự nhiên trong tiếng Việt hiện đại.
theological_decisions:
- issue: Đối tượng được nói đến trong cụm “các môn đồ của ông”
  choice: Các môn đồ của Giăng Báp-tít
  alternative: Các môn đồ của Chúa Giê-su
  rationale: Tiền ngữ trong mạch văn trực tiếp là Giăng Báp-tít, người vừa bị hành quyết; câu này kể việc các môn đồ của Giăng nhận và mai táng thi thể ông.
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng và dễ hiểu. Dùng “môn đồ” để giữ sắc thái quan hệ thầy-trò của μαθητής; dùng “thi thể” để chuyển tải chính xác nghĩa tử thi của πτῶμα.
