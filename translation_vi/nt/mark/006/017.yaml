reference: Mark 6:17
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Αὐτὸς γὰρ ὁ Ἡρῴδης ἀποστείλας ἐκράτησεν τὸν Ἰωάννην καὶ ἔδησεν αὐτὸν ἐν φυλακῇ διὰ Ἡρῳδιάδα τὴν γυναῖκα Φιλίππου τοῦ ἀδελφοῦ αὐτοῦ, ὅτι αὐτὴν ἐγάμησεν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/017.yaml
  text: For Herod himself had sent and seized John[a], and bound him in prison because of Herodias, the wife of Philip his brother[b], because he had married her.
translation:
  language: vi
  text: Vì chính Hê-rốt đã sai người bắt Giăng[a], trói ông và giam vào ngục vì Hê-rô-đia, vợ của Phi-líp, anh em[b] của Hê-rốt, bởi Hê-rốt đã cưới bà.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sát nghĩa: “sau khi sai đi, đã bắt Giăng.” Cấu trúc Hy Lạp quy việc bắt giữ cho Hê-rốt là người ra lệnh, dù những người được sai đi thực hiện hành động.'
    reason: Làm rõ quan hệ giữa phân từ ἀποστείλας và động từ ἐκράτησεν, đồng thời ghi nhận cách dịch có bổ sung “người” để tiếng Việt tự nhiên.
  - marker: b
    text: Từ Hy Lạp có nghĩa là anh hoặc em trai, nhưng không cho biết Phi-líp lớn tuổi hay nhỏ tuổi hơn Hê-rốt.
    reason: Tiếng Việt thường buộc phải phân biệt “anh” với “em”; “anh em” bảo toàn sự không xác định của nguyên văn.
lexical_decisions:
- source_word: Αὐτὸς γὰρ ὁ Ἡρῴδης
  choice: Vì chính Hê-rốt
  rationale: “Vì” giữ chức năng giải thích của γάρ trong mạch kể; “chính” thể hiện sắc thái nhấn mạnh của Αὐτός mà không hàm ý Hê-rốt đích thân thực hiện việc bắt giữ.
- source_word: ἀποστείλας ἐκράτησεν
  choice: đã sai người bắt
  rationale: Phân từ ἀποστείλας đứng trước động từ chính cho biết Hê-rốt khởi xướng hành động bằng cách sai người đi; cách diễn đạt này tự nhiên trong tiếng Việt và tránh khiến độc giả hiểu rằng ông đích thân bắt Giăng.
- source_word: τὸν Ἰωάννην
  choice: Giăng
  rationale: Dùng dạng tên quen thuộc, dễ nhận biết trong truyền thống Kinh Thánh tiếng Việt hiện đại.
- source_word: ἔδησεν αὐτὸν ἐν φυλακῇ
  choice: trói ông và giam vào ngục
  rationale: Giữ nghĩa cụ thể của δέω là “trói” và nghĩa theo ngữ cảnh của φυλακή là nơi giam giữ; không tự ý thêm chi tiết như xiềng xích.
- source_word: διὰ Ἡρῳδιάδα
  choice: vì Hê-rô-đia
  rationale: διά với đối cách nêu nguyên nhân; “vì” là cách diễn đạt gọn và tự nhiên.
- source_word: τὴν γυναῖκα Φιλίππου
  choice: vợ của Phi-líp
  rationale: Trong quan hệ sở hữu này, γυνή mang nghĩa “vợ”, không chỉ là “người phụ nữ”.
- source_word: τοῦ ἀδελφοῦ αὐτοῦ
  choice: anh em của Hê-rốt
  rationale: ἀδελφός chỉ người anh hoặc em trai nhưng tiếng Hy Lạp không xác định tuổi; lặp tên Hê-rốt làm rõ sở hữu của αὐτοῦ và tránh đại từ mơ hồ.
- source_word: ὅτι αὐτὴν ἐγάμησεν
  choice: bởi Hê-rốt đã cưới bà
  rationale: ὅτι nêu nguyên nhân, còn γαμέω có nghĩa là cưới. Lặp chủ ngữ giúp tiếng Việt rõ ràng vì câu có nhiều nhân vật nam; “bà” là đại từ tôn trọng, tự nhiên đối với Hê-rô-đia.
theological_decisions:
- issue: Đánh giá đạo đức về cuộc hôn nhân của Hê-rốt với Hê-rô-đia
  choice: Chỉ thuật lại rằng Hê-rốt bắt giam Giăng vì Hê-rô-đia, người ông đã cưới.
  alternative: Chèn ngay trong câu lời đánh giá rằng cuộc hôn nhân ấy là trái luật hoặc bất chính.
  rationale: Câu này trình bày nguyên nhân lịch sử; lời phản đối về luật pháp xuất hiện trong ngữ cảnh kế tiếp. Không nên đưa phán đoán giải thích vào nơi nguyên văn chưa trực tiếp phát biểu.
- issue: Hê-rốt trực tiếp hay thông qua thuộc hạ bắt Giăng
  choice: “sai người bắt” diễn đạt trách nhiệm chủ động của Hê-rốt đồng thời cho thấy việc bắt được thực hiện qua người được sai đi.
  alternative: “sai đi rồi bắt Giăng”, có thể bị hiểu là Hê-rốt đích thân bắt ông.
  rationale: Cấu trúc ἀποστείλας ἐκράτησεν quy hành động cho Hê-rốt với tư cách người ra lệnh, nhưng không nói rõ danh tính các thuộc hạ; bản dịch giữ cả trách nhiệm của Hê-rốt lẫn phương thức gián tiếp.
translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng hiện đại. Dùng các tên Hê-rốt, Hê-rô-đia, Phi-líp và Giăng theo dạng quen thuộc trong Kinh Thánh tiếng Việt. Câu giữ hai mệnh đề nguyên nhân của nguyên văn; việc lặp “Hê-rốt” làm rõ chủ thể trong một câu có nhiều nhân vật.
