  source_fidelity: 'Bản dịch truyền đạt đúng cấu trúc và nội dung Hy Lạp: γάρ được nối giải thích bằng “Vì”, αὐτός được nhấn bằng “chính”, và “đã sai người bắt” diễn đạt hợp lý phân từ ἀποστείλας cùng động từ chính ἐκράτησεν mà không buộc hiểu Hê-rốt tự tay bắt Giăng. “Trói ông và giam vào ngục” giữ cả δέω lẫn φυλακή. Hai quan hệ nguyên nhân do διά và ὅτι đều được bảo toàn.'
  naturalness: Câu văn kể chuyện trang trọng, rõ ràng và tự nhiên trong tiếng Việt hiện đại. Việc lặp “Hê-rốt” ở mệnh đề cuối giúp tránh nhầm chủ ngữ giữa Hê-rốt và Phi-líp. “Anh em của Hê-rốt” hơi cô đọng nhưng đọc được tự nhiên trong văn cảnh Kinh Thánh, và chú thích đã làm rõ đây là một người anh hoặc em trai.
  terminology: Các tên Giăng, Hê-rốt, Hê-rô-đia và Phi-líp nhất quán với lối dùng Kinh Thánh tiếng Việt. “Vợ”, “cưới”, “ngục” và “trói” đều phù hợp với các từ nguồn và không thêm đánh giá đạo đức về cuộc hôn nhân. Chú thích a và b đặt đúng neo và hữu ích; đặc biệt chú thích b bảo toàn sự không xác định về thứ bậc anh/em trong ἀδελφός.
