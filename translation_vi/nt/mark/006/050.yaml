source:
  edition: SBLGNT
  text: πάντες γὰρ αὐτὸν εἶδον καὶ ἐταράχθησαν. ⸂ὁ δὲ εὐθὺς⸃ ἐλάλησεν μετ’ αὐτῶν, καὶ λέγει αὐτοῖς· Θαρσεῖτε, ἐγώ εἰμι, μὴ φοβεῖσθε.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/050.yaml
  text: For they all saw him and were troubled. But he immediately spoke with them and says to them, “Take courage; I am; do not be afraid.”
translation:
  language: vi
  text: 'Vì tất cả đều thấy Ngài và hoảng hốt. Nhưng Ngài lập tức nói với họ: “Hãy vững lòng! Chính là Ta đây. Đừng sợ!”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐταράχθησαν
  choice: hoảng hốt
  rationale: Diễn đạt tự nhiên trạng thái bị khuấy động, bối rối và sợ hãi trong ngữ cảnh các môn đồ tưởng mình thấy ma.
- source_word: Θαρσεῖτε
  choice: Hãy vững lòng!
  rationale: Mệnh lệnh mang nghĩa lấy lại can đảm; cách nói trang trọng, rõ ràng và tự nhiên trong tiếng Việt.
- source_word: ἐγώ εἰμι
  choice: Chính là Ta đây.
  rationale: Trong ngữ cảnh nhận diện người đang đi trên mặt nước, cụm này tự nhiên có nghĩa “Ta đây”; thêm “chính là” nhấn mạnh sự nhận diện mà không buộc câu nói thành một tuyên bố thần danh. Đại từ “Ta” phù hợp lời Đức Giê-su nói với các môn đồ.
theological_decisions:
- issue: Khả năng ἐγώ εἰμι gợi đến công thức tự mặc khải thần thượng
  choice: Chính là Ta đây.
  alternative: Ta là.
  rationale: Giữ nghĩa trực tiếp và tự nhiên của lời trấn an, đồng thời không phủ nhận khả năng độc giả nhận ra âm vang thần học từ bối cảnh Đức Giê-su đi trên biển. “Ta là” trong tiếng Việt đứng riêng quá bất tự nhiên và dễ áp đặt một cách đọc thần danh.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” trong lời kể và “Ta” trong lời Đức Giê-su; chuyển hiện tại lịch sử λέγει sang cách kể tự nhiên “nói”.
