  register: Văn phong tiếng Việt hiện đại, rõ ràng và trang trọng; giữ nhịp kể khẩn trương của câu Hy Lạp. Dùng “Đức Chúa Jêsus” để tránh đại từ thiếu tiền ngữ rõ ràng trong câu đứng riêng.
