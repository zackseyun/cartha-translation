base_translation:
  language: en
  yaml_path: translation/nt/mark/006/055.yaml
  text: They ran throughout that whole region and began carrying those who were sick on mats to wherever they heard he was[a].
translation:
  language: vi
  text: Họ chạy khắp cả vùng ấy, rồi bắt đầu khiêng những người đau ốm trên những tấm đệm[a] đến bất cứ nơi nào họ nghe Ngài đang ở.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “chiếu” hoặc “giường thấp”; từ Hy Lạp chỉ một loại chỗ nằm đơn sơ, có thể mang đi.
    reason: lexical_alternative
lexical_decisions:
- source_word: περιέδραμον
  choice: chạy khắp
  rationale: Diễn đạt cả sự khẩn trương của động từ và việc họ đi khắp một khu vực.
- source_word: ὅλην τὴν χώραν ἐκείνην
  choice: khắp vùng ấy
  rationale: χώρα chỉ miền hay khu vực chung quanh, không phải một quốc gia theo nghĩa hiện đại; “khắp” chuyển tải ý toàn thể.
- source_word: ἤρξαντο ... περιφέρειν
  choice: bắt đầu khiêng
  rationale: Giữ ý khởi đầu của ἤρξαντο và hành động mang người bệnh bằng vật dụng có thể khiêng đi.
- source_word: ἐπὶ τοῖς κραβάττοις
  choice: trên các tấm đệm
  rationale: κράβαττος chỉ loại chỗ nằm đơn sơ, có thể mang đi; “tấm đệm” tự nhiên và dễ hiểu trong tiếng Việt hiện đại.
- source_word: τοὺς κακῶς ἔχοντας
  choice: những người đau bệnh
  rationale: Thành ngữ Hy Lạp chỉ những người đang đau yếu; cách dịch này rõ nghĩa và có sắc thái trang trọng vừa phải.
- source_word: ὅπου ἤκουον ὅτι ἐστίν
  choice: đến bất cứ nơi nào họ nghe tin Đức Chúa Jêsus đang ở
  rationale: Ngữ cảnh khiến ὅπου mang ý đích đến; “nghe tin” diễn đạt lời tường thuật gián tiếp, còn việc nêu Đức Chúa Jêsus làm rõ chủ thể vốn được đại từ ngầm chỉ đến trong tiếng Hy Lạp.
