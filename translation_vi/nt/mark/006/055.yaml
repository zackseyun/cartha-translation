revisions:
- from: Họ chạy khắp vùng ấy và bắt đầu khiêng những người đau bệnh trên các tấm đệm đến bất cứ nơi nào họ nghe tin Đức Chúa Jêsus đang ở.[a]
  to: Họ chạy khắp cả vùng ấy, rồi bắt đầu khiêng những người đau ốm trên những tấm đệm[a] đến bất cứ nơi nào họ nghe Ngài đang ở.
  rationale: Bản sửa giữ nguyên ý khẩn trương của περιέδραμον, ý khởi sự của ἤρξαντο, và ý đích đến của ὅπου. Tước hiệu không có trong nguyên văn được thay bằng “Ngài”; ký hiệu chú thích được đặt ngay sau từ dịch κράβαττοι và nội dung chú thích được làm tự nhiên, sát ngữ cảnh lịch sử hơn.
