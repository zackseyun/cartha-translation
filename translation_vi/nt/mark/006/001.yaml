    issue: Thuật ngữ “các môn đồ” hơi mang màu sắc bản dịch cũ/nhóm truyền thống.
    rationale: “Các môn đệ” là lựa chọn hiện đại và liên truyền thống hơn cho μαθηταὶ, vẫn chỉ những người theo học và theo Đức Chúa Jêsus.
  - severity: low
    issue: Dấu chú thích hiện đặt sau “mình”, trong khi nội dung chú thích giải thích cả hai động từ “về” và “đi theo”.
    rationale: Chuyển ký hiệu chú thích đến cuối mệnh đề thứ hai sẽ neo chú thích rõ ràng hơn vào toàn bộ hiện tượng thì hiện tại lịch sử.
