  source_fidelity: 'Bản dịch truyền đạt đúng ba hành động trong câu: Ngài rời nơi trước, đến/về quê nhà của mình, và các môn đệ theo Ngài. Hai thì hiện tại lịch sử (ἔρχεται, ἀκολουθοῦσιν) được diễn đạt tự nhiên trong văn kể tiếng Việt không cần thêm từ chỉ thì.'
  naturalness: “Về quê nhà mình” là tự nhiên và phù hợp với πατρίδα trong ngữ cảnh. Tuy nhiên, “các môn đệ” là cách gọi hiện đại, trung tính và thông dụng hơn “các môn đồ” trong tiếng Việt chuẩn hiện nay.
  terminology: Đổi “môn đồ” thành “môn đệ” để nhất quán với thuật ngữ Phúc Âm hiện đại mà không làm mất sắc thái μαθηταί. Giữ “Ngài” theo văn phong tôn trọng của bản dịch và “quê nhà” vì không thu hẹp πατρίς thành chỉ một thị trấn hay mở rộng thành quốc gia.
  issues:
