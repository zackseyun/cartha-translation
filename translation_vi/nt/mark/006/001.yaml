id: MRK.6.1
reference: Mark 6:1
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Καὶ ἐξῆλθεν ἐκεῖθεν, καὶ ⸀ἔρχεται εἰς τὴν πατρίδα αὐτοῦ, καὶ ἀκολουθοῦσιν αὐτῷ οἱ μαθηταὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/001.yaml
  text: And he went out from there and came to his hometown[a], and his disciples followed him.
translation:
  language: vi
  text: Ngài rời khỏi đó và về quê nhà mình; các môn đệ đi theo Ngài[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tiếng Hy Lạp dùng thì hiện tại lịch sử ở các động từ “về” và “đi theo”, khiến lời kể thêm sống động.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθεν
  choice: rời khỏi
  rationale: Diễn tả việc ra đi khỏi địa điểm trước đó; “rời khỏi” tự nhiên trong tiếng Việt và vẫn giữ rõ ý chuyển đi.
- source_word: ἐκεῖθεν
  choice: đó
  rationale: Kết hợp với “rời khỏi” thành “rời khỏi đó”, diễn đạt trực tiếp điểm xuất phát.
- source_word: ἔρχεται
  choice: về
  rationale: Trong ngữ cảnh đi đến quê nhà của chính Ngài, “về” tự nhiên và chính xác hơn “đến”; tiếng Việt không bắt buộc đánh dấu thì nên vẫn có thể phản ánh lối hiện tại lịch sử của tiếng Hy Lạp.
- source_word: πατρίδα
  choice: quê nhà
  rationale: Ở đây chỉ nơi quê quán của Đức Chúa Jêsus, tức vùng/thị trấn nơi Ngài lớn lên, chứ không chủ yếu mang nghĩa quốc gia; “quê nhà” tự nhiên và không xác định phạm vi quá hẹp.
- source_word: ἀκολουθοῦσιν
  choice: đi theo
  rationale: Giữ được cả hành động cùng đi và sắc thái môn đồ theo thầy, rõ hơn từ chung chung như “đi cùng”.
- source_word: μαθηταὶ
  choice: các môn đồ
  rationale: “Môn đồ” là cách gọi chuẩn, dễ hiểu trong văn cảnh Phúc Âm, thể hiện quan hệ học trò và người đi theo.
theological_decisions:
- issue: Các động từ hiện tại lịch sử ἔρχεται và ἀκολουθοῦσιν
  choice: 'Dùng các động từ tiếng Việt không kèm dấu hiệu thì: “về” và “đi theo”.'
  alternative: Thêm yếu tố quá khứ như “đã về ... đã đi theo”, hoặc cố làm nổi bật hiện tại bằng “nay về ... đi theo”.
  rationale: Tiếng Việt không biến đổi động từ theo thì; cách diễn đạt không có “đã” vừa tự nhiên trong văn kể chuyện vừa không ép hiện tại lịch sử của tiếng Hy Lạp thành quá khứ hay hiện tại một cách không cần thiết.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Ngài” để nối với chủ thể Đức Chúa Jêsus trong văn cảnh. Dấu chấm phẩy thể hiện hai mệnh đề phối hợp mà không làm câu nặng nề.
