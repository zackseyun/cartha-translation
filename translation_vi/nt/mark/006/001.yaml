- from: Ngài rời khỏi đó và về quê nhà mình[a]; các môn đồ đi theo Ngài.
  to: Ngài rời khỏi đó và về quê nhà mình; các môn đệ đi theo Ngài[a].
  rationale: Chỉnh nhẹ thuật ngữ μαθηταὶ thành “các môn đệ” cho tiếng Việt hiện đại, đồng thời dời neo chú thích để nó bao quát đúng hai động từ hiện tại lịch sử. Không thay đổi ý nghĩa, phạm vi của πατρίς, hay lựa chọn kể chuyện không đánh dấu thì trong tiếng Việt.
