  text: Καὶ διαπεράσαντες ⸂ἐπὶ τὴν γῆν ἦλθον εἰς⸃ Γεννησαρὲτ καὶ προσωρμίσθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/053.yaml
  text: And after crossing over to the land[b][a], they came to Gennesaret and moored there.
translation:
  language: vi
  text: Sau khi vượt qua, họ đến đất Ghê-nê-xa-rết[a] và neo thuyền tại đó[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “đến bờ ở Ghê-nê-xa-rết”; từ Hy Lạp được dịch là “đất” cũng có thể chỉ đất liền hoặc bờ trong bối cảnh đi thuyền.'
    reason: lexical_alternative
  - marker: b
    text: 'Hay: “cho thuyền cập bờ” hoặc “cho thuyền ghé vào”; động từ Hy Lạp mang nghĩa hàng hải, chỉ việc đưa thuyền vào nơi neo hoặc chỗ ghé đậu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: Sau khi
  rationale: Liên từ καί tiếp nối mạch kể chuyện; trong tiếng Việt, kết hợp với phân từ chỉ hành động xảy ra trước để mở câu bằng “Sau khi” tạo diễn tiến tự nhiên mà không thêm ý nghĩa mới.
- source_word: διαπεράσαντες
  choice: vượt qua
  rationale: Phân từ bất định quá khứ diễn tả hành động hoàn tất trước các động từ chính. “Sau khi vượt qua” vừa tự nhiên vừa giữ đúng trình tự thời gian; đối tượng được vượt qua không được nêu trực tiếp trong câu nên không thêm “hồ” vào bản văn.
- source_word: ἐπὶ τὴν γῆν ... ἦλθον εἰς Γεννησαρὲτ
  choice: họ đến đất Ghê-nê-xa-rết
  rationale: γῆ có thể chỉ đất, đất liền hoặc bờ trong bối cảnh đi thuyền. “Đến đất Ghê-nê-xa-rết” giữ hình ảnh về vùng đất là đích đến, đồng thời diễn đạt tự nhiên hơn cấu trúc Hy Lạp nếu dịch sát từng từ.
- source_word: Γεννησαρὲτ
  choice: Ghê-nê-xa-rết
  rationale: Địa danh được phiên âm sang tiếng Việt theo cách đọc dễ nhận biết và nhất quán với văn phong Kinh Thánh tiếng Việt.
- source_word: προσωρμίσθησαν
  choice: cho thuyền cập bờ
  rationale: Động từ mang nghĩa hàng hải, chỉ việc đưa thuyền vào nơi neo hoặc sát bờ. “Cho thuyền cập bờ” truyền đạt rõ hành động này và giữ sắc thái chuyên biệt hơn từ khái quát “lên bờ”.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng nhưng dễ hiểu. Không thêm “hồ” vì câu Hy Lạp không nêu trực tiếp đối tượng của hành động vượt qua. Hai chú thích giữ lại phạm vi nghĩa của γῆ và sắc thái hàng hải của προσωρμίσθησαν.
