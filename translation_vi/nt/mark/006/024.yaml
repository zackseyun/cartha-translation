revisions:
- from: 'Cô đi ra và hỏi mẹ mình: “Con nên xin gì?” Bà đáp: “Đầu của Giăng, người làm phép báp-têm.”[a]'
  to: 'Cô đi ra, rồi nói với mẹ mình: “Con nên xin gì?” Bà nói: “Đầu của Giăng, người làm phép báp-têm.”[a]'
  rationale: Điều chỉnh tối thiểu để phản ánh rõ hơn quan hệ thời gian của phân từ Hy Lạp và gắn chú thích từ vựng đúng với danh xưng của Giăng. Không thay đổi nghĩa, mức độ trực tiếp của yêu cầu, hay sự mơ hồ tự nhiên của lời nói.
