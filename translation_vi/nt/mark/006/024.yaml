  text: ⸀καὶ ἐξελθοῦσα εἶπεν τῇ μητρὶ αὐτῆς· Τί ⸀αἰτήσωμαι; ἡ δὲ εἶπεν· Τὴν κεφαλὴν Ἰωάννου τοῦ ⸀βαπτίζοντος.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/024.yaml
  text: And after going out, she said to her mother, “What should I ask for?” And she said, “The head of John the Baptizer.”
translation:
  language: vi
  text: 'Cô đi ra, rồi nói với mẹ mình: “Con nên xin gì?” Bà nói: “Đầu của Giăng, người làm phép báp-têm.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay theo cách gọi truyền thống: “Giăng Báp-tít.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθοῦσα
  choice: đi ra
  rationale: Phân từ bất định quá khứ diễn tả hành động xảy ra trước lời hỏi; cách nối “đi ra và hỏi” tự nhiên trong tiếng Việt và vẫn giữ rõ trình tự hành động.
- source_word: Τί αἰτήσωμαι
  choice: Con nên xin gì?
  rationale: Thể giả định trung gian trong câu hỏi cân nhắc được diễn đạt tự nhiên bằng “nên xin gì”; đại từ “con” phù hợp khi người con nói với mẹ.
- source_word: μητρὶ αὐτῆς
  choice: mẹ mình
  rationale: Diễn đạt tự nhiên quan hệ sở hữu phản thân của chủ thể trong tiếng Việt.
- source_word: κεφαλήν
  choice: đầu
  rationale: Giữ nguyên vật được yêu cầu một cách trực tiếp, không dùng cách nói giảm nhẹ.
- source_word: τοῦ βαπτίζοντος
  choice: người làm phép báp-têm
  rationale: Dịch theo nghĩa của phân từ được danh từ hóa, xác định Giăng qua hoạt động đặc trưng của ông, đồng thời tránh khiến danh xưng bị hiểu như tên một hệ phái hiện đại.
theological_decisions:
- issue: Cách dịch biệt hiệu βαπτίζων của Giăng
  choice: người làm phép báp-têm
  alternative: Giăng Báp-tít
  rationale: Bản chính ưu tiên chuyển tải nghĩa của phân từ Hy Lạp thay vì chỉ giữ danh xưng truyền thống; cách gọi quen thuộc được ghi ở chú thích để hỗ trợ người đọc.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “cô” và “bà” để phân biệt rõ người con gái với người mẹ; lời thoại dùng cặp xưng hô mẹ–con tự nhiên trong tiếng Việt.
