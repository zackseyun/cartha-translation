  to: Ngài thấy họ đang khốn đốn khi chèo thuyền, vì gió ngược chiều họ. Vào khoảng phiên canh thứ tư trong đêm[a], Ngài đến với họ, đi trên mặt biển[b], và Ngài định đi qua họ[c].
  rationale: Sửa thuật ngữ thời gian để phản ánh đúng hệ thống phiên canh La Mã mà không tạo liên tưởng sai đến cách tính canh truyền thống Việt Nam. Sửa “vất vả chèo chống” thành “khốn đốn khi chèo thuyền” để nêu rõ hoạt động chèo thuyền và giữ được sắc thái khốn khó mạnh của nguyên ngữ. Cấu trúc mở của “Ngài định đi qua họ” và chú thích về khả năng gợi âm hưởng Cựu Ước được giữ nguyên.
