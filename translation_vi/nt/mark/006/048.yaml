  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ⸀ἰδὼν αὐτοὺς βασανιζομένους ἐν τῷ ἐλαύνειν, ἦν γὰρ ὁ ἄνεμος ἐναντίος ⸀αὐτοῖς, περὶ τετάρτην φυλακὴν τῆς νυκτὸς ἔρχεται πρὸς αὐτοὺς περιπατῶν ἐπὶ τῆς θαλάσσης· καὶ ἤθελεν παρελθεῖν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/048.yaml
  text: And seeing them straining at the oars[a], because the wind was against them, about the fourth watch of the night he comes to them, walking on the sea[d][c][b]; and he intended to pass by them.
translation:
  language: vi
  text: Ngài thấy họ đang khốn đốn khi chèo thuyền, vì gió ngược chiều họ. Vào khoảng phiên canh thứ tư trong đêm[a], Ngài đến với họ, đi trên mặt biển[b], và Ngài định đi qua họ[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Phiên canh thứ tư trong đêm” là khoảng thời gian từ 3 giờ đến 6 giờ sáng theo cách chia phiên canh của người La Mã.
    reason: cultural_note
  - marker: b
    text: 'Cũng có thể dịch: “đi trên mặt nước.” Tiếng Hy Lạp viết là “trên biển.”'
    reason: lexical_alternative
  - marker: c
    text: “Ngài định đi qua họ” có thể chỉ đơn giản là Ngài định đi ngang qua họ, nhưng cũng có thể gợi lại những cảnh trong Cựu Ước khi Đức Chúa Trời “đi qua” để bày tỏ chính mình (chẳng hạn Xuất Ai Cập 33:19, 22; 34:6; 1 Các Vua 19:11).
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδὼν
  choice: thấy
  rationale: Phân từ bất định của ὁράω diễn tả việc Ngài thấy hoàn cảnh của các môn đồ; tiếng Việt tự nhiên có thể dùng động từ nối tiếp mà không cần xác định quá chặt quan hệ thời gian.
- source_word: βασανιζομένους ἐν τῷ ἐλαύνειν
  choice: đang vất vả chèo chống
  rationale: βασανιζομένους cho thấy họ bị khốn khó, vật lộn dữ dội; ἐν τῷ ἐλαύνειν chỉ hoạt động chèo thuyền đang diễn ra. “Vất vả chèo chống” tự nhiên trong tiếng Việt và giữ được mức độ gian nan của cảnh tượng.
- source_word: ἐναντίος αὐτοῖς
  choice: gió ngược
  rationale: Trong ngữ cảnh đi thuyền, cách nói gọn và tự nhiên này diễn đạt việc gió thổi ngược chiều, chống lại họ.
- source_word: περὶ τετάρτην φυλακὴν τῆς νυκτός
  choice: vào khoảng canh tư của đêm
  rationale: Giữ cách phân chia thời gian cổ đại và dịch περὶ là “vào khoảng”; chú thích giải thích giờ tương ứng.
- source_word: ἔρχεται πρὸς αὐτούς
  choice: Ngài đến với họ
  rationale: Thì hiện tại lịch sử tạo sắc thái kể chuyện sống động trong tiếng Hy Lạp. Tiếng Việt không bắt buộc đánh dấu thì, nên “đến” vừa tự nhiên vừa không làm mất sắc thái ấy.
- source_word: περιπατῶν ἐπὶ τῆς θαλάσσης
  choice: đi trên mặt biển
  rationale: Dịch θάλασσα là “biển” thay vì diễn giải thành “nước”; thêm “mặt” để câu tiếng Việt tự nhiên mà vẫn giữ nghĩa đi trên biển.
- source_word: ἤθελεν παρελθεῖν αὐτούς
  choice: Ngài định đi qua họ
  rationale: “Định” diễn đạt ý hướng của ἤθελεν, còn “đi qua họ” giữ nguyên độ mở của παρελθεῖν, không quyết định đây chỉ là đi vượt qua hay là một sự bày tỏ mang âm hưởng Cựu Ước.
theological_decisions:
- issue: Ý nghĩa của câu “Ngài định đi qua họ”
  choice: Giữ cách diễn đạt sát nghĩa và không giải thích thêm trong chính văn.
  alternative: Ngài định đi ngang qua họ; hoặc câu này ám chỉ việc Đức Chúa Trời “đi qua” để bày tỏ chính mình.
  rationale: Bản Hy Lạp không nói rõ mục đích. Cách dịch giữ được cả nghĩa chuyển động thông thường lẫn khả năng gợi lại những cảnh Đức Chúa Trời “đi qua” trong Cựu Ước.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Ngài” được dùng cho Chúa Giê-xu theo ngữ cảnh; “chèo chống” diễn tả tự nhiên sự vật lộn với gió ngược. Câu dài Hy Lạp được tách thành hai câu tiếng Việt để sáng nghĩa mà vẫn giữ trình tự và sức căng của bản văn.
