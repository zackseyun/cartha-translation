    rationale: ἀνακειμένους nói đến những người đang dùng bữa theo tư thế ngả mình. Bản văn chính nên dùng cách diễn đạt tự nhiên, trung tính; chi tiết văn hóa để trong chú thích.
  - severity: low
    issue: Chú thích a mô tả tư thế ngả mình là “tư thế dự tiệc trang trọng thời đó.”
    rationale: Tính “trang trọng” không được từ nguyên ngữ xác nhận và có thể gây hiểu lầm về tập quán dùng bữa thời cổ.
