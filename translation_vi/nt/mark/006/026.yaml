  text: καὶ περίλυπος γενόμενος ὁ βασιλεὺς διὰ τοὺς ὅρκους καὶ τοὺς ⸀ἀνακειμένους οὐκ ἠθέλησεν ⸂ἀθετῆσαι αὐτήν⸃·
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/026.yaml
  text: And the king[a], becoming deeply grieved, because of his oaths and those reclining at the table[c][b], did not want to refuse her.
translation:
  language: vi
  text: Nhà vua vô cùng đau buồn, nhưng vì những lời thề của mình và vì những người đang dự tiệc cùng ông[a], ông không muốn từ chối cô[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn nói đến những người đang ngả mình tại bàn ăn, theo tập quán dùng bữa thời đó; cũng có thể dịch là “những thực khách.”
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “khước từ cô” hoặc “bội lời với cô.” Ý nói nhà vua không muốn gạt bỏ điều mình đã hứa với cô.
    reason: lexical_alternative
lexical_decisions:
- source_word: περίλυπος γενόμενος
  choice: vô cùng đau buồn
  rationale: Diễn đạt tự nhiên cường độ đau buồn rất lớn của περίλυπος; trạng thái phát sinh do γενόμενος được thể hiện qua mạch diễn tiến của câu mà không dùng lối nói nặng nề “trở nên”.
- source_word: ὁ βασιλεὺς
  choice: nhà vua
  rationale: Giữ nguyên cách gọi của tác giả Mác dành cho Hê-rốt, thay vì điều chỉnh theo tước hiệu lịch sử.
- source_word: διὰ τοὺς ὅρκους
  choice: vì những lời thề của mình
  rationale: διά với đối cách nêu nguyên nhân; “lời thề” chính xác hơn “lời hứa,” còn “của mình” làm rõ chủ thể vốn đã hiển nhiên trong ngữ cảnh.
- source_word: τοὺς ἀνακειμένους
  choice: những người cùng ngồi dự tiệc
  rationale: Diễn đạt tự nhiên những người hiện diện tại bữa ăn; “cùng” cho thấy họ đang dự tiệc với nhà vua, còn chi tiết tư thế nằm nghiêng được giữ trong chú thích.
- source_word: οὐκ ἠθέλησεν
  choice: không muốn
  rationale: Giữ rõ ý chí, không biến câu thành sự bất lực hay không thể hành động.
- source_word: ἀθετῆσαι αὐτήν
  choice: từ chối cô
  rationale: Trong ngữ cảnh, động từ chỉ việc bác bỏ yêu cầu của cô hoặc không thực hiện điều đã cam kết với cô; “từ chối cô” tự nhiên và vẫn giữ đối tượng là người.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “nhà vua” theo lối kể của Mác. Từ “nhưng” làm rõ quan hệ tương phản ngầm giữa nỗi đau buồn của nhà vua và quyết định không từ chối, trong khi nguyên nhân được giữ đầy đủ bằng hai cụm “vì” song song.
