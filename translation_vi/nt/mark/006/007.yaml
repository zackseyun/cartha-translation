source:
  edition: SBLGNT
  text: καὶ προσκαλεῖται τοὺς δώδεκα, καὶ ἤρξατο αὐτοὺς ἀποστέλλειν δύο δύο, καὶ ἐδίδου αὐτοῖς ἐξουσίαν τῶν πνευμάτων τῶν ἀκαθάρτων,
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/007.yaml
  text: And he called the Twelve and began to send them out two by two[c][b][a], and he was giving them authority over the unclean spirits.
translation:
  language: vi
  text: Ngài gọi Nhóm Mười Hai đến, rồi bắt đầu sai họ đi từng đôi một và ban cho họ thẩm quyền trên các thần ô uế.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “quyền năng trên các thần ô uế.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσκαλεῖται
  choice: gọi ... đến
  rationale: Động từ ở thể trung gian diễn tả việc gọi họ đến với mình. Tiếng Việt không cần tái hiện máy móc hiện tại lịch sử; cách dịch này tự nhiên trong mạch kể mà vẫn giữ nội dung hành động.
- source_word: τοὺς δώδεκα
  choice: Nhóm Mười Hai
  rationale: Đây là danh xưng chỉ nhóm mười hai môn đồ của Đức Chúa Jêsus; không thêm từ “sứ đồ” vì nguyên văn không có từ ấy tại đây.
- source_word: ἤρξατο ... ἀποστέλλειν
  choice: bắt đầu sai họ đi
  rationale: Giữ ý khởi đầu của ἤρξατο và sắc thái được phái đi làm nhiệm vụ của ἀποστέλλειν, nhưng không đưa danh từ “sứ đồ” vào câu.
- source_word: δύο δύο
  choice: từng đôi một
  rationale: Tái hiện lối lặp mang nghĩa phân phối trong nguyên văn bằng một thành ngữ Việt tự nhiên.
- source_word: ἐδίδου
  choice: ban cho
  rationale: Thì chưa hoàn thành cho thấy hành động diễn ra cùng tiến trình sai họ đi. Trong tiếng Việt, “ban cho” phù hợp với việc Đức Chúa Jêsus trao thẩm quyền mà không cần thêm dấu hiệu thể dài dòng.
- source_word: ἐξουσίαν
  choice: thẩm quyền
  rationale: Nhấn mạnh quyền được trao để hành động, thay vì chỉ sức mạnh thuần túy.
- source_word: τῶν πνευμάτων τῶν ἀκαθάρτων
  choice: các uế linh
  rationale: Giữ nguyên thuật ngữ của Mác về những linh ô uế, không thu hẹp cách diễn đạt thành “ma quỷ”.
theological_decisions:
- issue: Bản chất điều Đức Chúa Jêsus trao cho Nhóm Mười Hai qua ἐξουσίαν
  choice: thẩm quyền trên các uế linh
  alternative: quyền năng trên các uế linh
  rationale: “Thẩm quyền” giữ rõ ý quyền hành được Đức Chúa Jêsus trao để chế ngự các uế linh; chú thích ghi nhận rằng từ Hy Lạp cũng có thể được diễn đạt là “quyền năng” trong ngữ cảnh này.
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng và dễ hiểu. “Nhóm Mười Hai” được viết hoa như một danh xưng; “từng đôi một” vừa tự nhiên vừa giữ nhịp phân phối của nguyên văn.
