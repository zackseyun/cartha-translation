id: MRK.6.25
reference: Mark 6:25
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ εἰσελθοῦσα ⸀εὐθὺς μετὰ σπουδῆς πρὸς τὸν βασιλέα ᾐτήσατο λέγουσα· Θέλω ἵνα ⸂ἐξαυτῆς δῷς μοι⸃ ἐπὶ πίνακι τὴν κεφαλὴν Ἰωάννου τοῦ βαπτιστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/025.yaml
  text: And she immediately went in with haste to the king and asked[a], saying, “I want you to give me at once, on a platter, the head of John the Baptizer.”
translation:
  language: vi
  text: 'Cô liền vội vã vào gặp vua và xin: “Tôi muốn ngài trao ngay cho tôi đầu của Giô-an, người làm phép rửa[a], trên một chiếc mâm.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cách gọi truyền thống: “Giăng Báp-tít” hoặc “Gioan Tẩy Giả.”'
    reason: Nêu các hình thức danh hiệu quen thuộc tương ứng với βαπτιστής, trong khi bản chính dịch nghĩa mô tả của từ.
lexical_decisions:
- source_word: εἰσελθοῦσα
  choice: vào gặp
  rationale: Phân từ bất định quá khứ diễn tả cô đi vào nơi vua đang ở; “vào gặp vua” tự nhiên trong tiếng Việt và làm rõ đích đến đã có trong cụm πρὸς τὸν βασιλέα.
- source_word: εὐθὺς
  choice: lập tức
  rationale: Giữ sắc thái khẩn cấp thường gặp trong lối kể của Mác và phân biệt với ἐξαυτῆς ở lời yêu cầu.
- source_word: μετὰ σπουδῆς
  choice: vội vã
  rationale: Diễn tả tốc độ và sự khẩn trương mà không gán cho cô một thái độ tích cực như nhiệt tình hay háo hức.
- source_word: βασιλέα
  choice: vua
  rationale: Dịch đúng danh xưng βασιλεύς trong lời kể, dù về lịch sử Hê-rốt An-ti-pa có tước hiệu chính thức là chư hầu cai trị một phần lãnh thổ.
- source_word: ᾐτήσατο λέγουσα
  choice: 'xin:'
  rationale: Động từ αἰτέω nói đến việc đưa ra một yêu cầu; dấu hai chấm chuyển tự nhiên sang lời nói trực tiếp mà không tăng mức độ thành “đòi”.
- source_word: Θέλω ἵνα ... δῷς μοι
  choice: Tôi muốn ngài trao cho tôi
  rationale: Diễn đạt trực tiếp ý muốn và nội dung của mệnh đề ἵνα bằng cấu trúc tiếng Việt tự nhiên, đồng thời dùng “ngài” phù hợp khi thưa với vua.
- source_word: ἐξαυτῆς
  choice: ngay
  rationale: Giữ riêng yêu cầu phải hành động tức thời, không nhập với εὐθὺς vốn mô tả việc cô đi vào.
- source_word: ἐπὶ πίνακι
  choice: trên một chiếc mâm
  rationale: πίναξ trong bối cảnh yến tiệc là mâm hoặc đĩa lớn dùng để bưng dọn; “chiếc mâm” rõ nghĩa và tự nhiên.
- source_word: τὴν κεφαλὴν
  choice: đầu
  rationale: Giữ nguyên tính cụ thể và ghê rợn của yêu cầu, không nói giảm.
- source_word: Ἰωάννου
  choice: Giô-an
  rationale: Phiên âm tên riêng Hy Lạp theo cách dễ đọc trong tiếng Việt, tránh mặc nhiên chọn riêng hình thức tên gọi gắn với một truyền thống hệ phái.
- source_word: τοῦ βαπτιστοῦ
  choice: người làm phép rửa
  rationale: Dịch chức năng mô tả của βαπτιστής thay vì chỉ dùng một danh hiệu đã được truyền thống hóa; cách nói này dễ hiểu đối với độc giả phổ thông.
theological_decisions:
- issue: Cách dịch danh hiệu Ἰωάννου τοῦ βαπτιστοῦ
  choice: Giô-an, người làm phép rửa
  alternative: Giăng Báp-tít; Gioan Tẩy Giả
  rationale: βαπτιστής là danh xưng mang nghĩa mô tả người thực hiện phép rửa. Bản chính dịch ý nghĩa ấy và chú thích các cách gọi quen thuộc, tránh ưu tiên riêng thuật ngữ truyền thống của một cộng đồng.
translation_notes:
  register: 'Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Hai yếu tố chỉ sự gấp gáp được giữ riêng: “lập tức” cho hành động đi vào và “ngay” cho yêu cầu. Lời cô gái dùng “tôi—ngài” để phản ánh việc thưa với vua mà không làm câu quá cổ kính.'
