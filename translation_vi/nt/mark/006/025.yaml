  verdict: revise
  source_fidelity: 'Bản dịch giữ đúng các yếu tố chính của câu Hy Lạp: cô đi vào gặp vua, sự khẩn trương kép (εὐθύς; μετὰ σπουδῆς), lời thỉnh cầu, yêu cầu phải thực hiện ngay (ἐξαυτῆς), cái đầu của Giô-an, và chiếc mâm. Danh hiệu βασιλέα được dịch là “vua” phù hợp với văn bản, không cần điều chỉnh theo tước hiệu lịch sử của Hê-rốt. “Người làm phép rửa” diễn đạt được lực mô tả của τοῦ βαπτιστοῦ.'
  naturalness: Cụm “lập tức vội vã” đặt liền nhau hơi nặng và có cảm giác trùng lặp trong tiếng Việt hiện đại, dù cần bảo lưu hai nét khẩn trương của nguyên văn. Đổi “lập tức” thành “liền” làm câu kể tự nhiên hơn mà vẫn phân biệt với “ngay” trong lời yêu cầu.
  terminology: “Giô-an, người làm phép rửa” là một cách dịch nghĩa danh hiệu trung tính và dễ hiểu. Chú thích nêu các danh xưng truyền thống tương ứng là hữu ích; không có vấn đề giáo lý cần giải quyết.
