  text: ἡ δὲ Ἡρῳδιὰς ἐνεῖχεν αὐτῷ καὶ ἤθελεν αὐτὸν ἀποκτεῖναι, καὶ οὐκ ἠδύνατο·
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/019.yaml
  text: But Herodias held a grudge against him and wanted to kill him[a], but she could not.
translation:
  language: vi
  text: Nhưng Hê-rô-đia mang lòng oán giận ông và muốn giết ông,[a] nhưng bà không thể làm được.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “căm giận ông” hoặc “nuôi lòng oán hận ông.” Thành ngữ Hy Lạp diễn tả thái độ thù nghịch kéo dài.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Nhưng
  rationale: Trong ngữ cảnh, liên từ này đánh dấu sự tương phản hoặc chuyển biến so với câu trước; “Nhưng” diễn đạt rõ sắc thái đối lập.
- source_word: Ἡρῳδιὰς
  choice: Hê-rô-đia
  rationale: Phiên âm tên riêng theo lối viết quen thuộc, dễ đọc trong tiếng Việt.
- source_word: ἐνεῖχεν αὐτῷ
  choice: mang lòng oán giận ông
  rationale: Thành ngữ diễn tả thái độ thù nghịch, oán hận kéo dài; thì chưa hoàn thành nhấn mạnh trạng thái liên tục.
- source_word: ἤθελεν
  choice: muốn
  rationale: Cách dịch trực tiếp, tự nhiên, giữ ý định đang kéo dài trong ngữ cảnh.
- source_word: αὐτὸν ἀποκτεῖναι
  choice: giết ông
  rationale: Diễn đạt trực tiếp nghĩa của ἀποκτείνω mà không thêm sắc thái pháp lý hay đạo đức không được nêu rõ trong động từ.
- source_word: καὶ οὐκ ἠδύνατο
  choice: nhưng bà không thể làm được
  rationale: 'Dù καὶ thường có nghĩa là “và”, tại đây quan hệ ý nghĩa mang tính đối lập: bà muốn giết ông nhưng không có khả năng thực hiện; cách diễn đạt này cũng giữ sắc thái bất lực kéo dài của thì chưa hoàn thành.'
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “ông” cho người nam đang được nhắc đến và “bà” cho Hê-rô-đia để tránh lặp tên; giữ nguyên sự lặp lại của cấu trúc đối lập trong nguyên văn.
