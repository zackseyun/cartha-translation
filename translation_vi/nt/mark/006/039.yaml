  yaml_path: translation/nt/mark/006/039.yaml
  text: And he commanded them all to recline in groups on the green grass[a][b].
translation:
  language: vi
  text: Ngài truyền cho họ sắp xếp mọi người ngồi xuống[b] thành từng nhóm[a] trên cỏ xanh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “theo từng nhóm” hoặc “nhóm này đến nhóm khác.” Cụm từ Hy Lạp được lặp lại để nhấn mạnh việc chia thành các nhóm riêng.'
    reason: lexical_alternative
  - marker: b
    text: Nguyên văn dùng từ chỉ tư thế ngả mình hoặc nằm nghiêng để dùng bữa.
    reason: cultural_and_lexical_clarification
lexical_decisions:
- source_word: ἐπέταξεν
  choice: truyền
  rationale: Động từ này diễn tả một mệnh lệnh có thẩm quyền; “truyền” giữ được sắc thái mạnh mà vẫn tự nhiên trong văn kể tiếng Việt.
- source_word: αὐτοῖς
  choice: cho họ
  rationale: Đại từ chỉ những người được Chúa Giê-su ra lệnh, theo ngữ cảnh là các môn đồ; bản dịch giữ nguyên đại từ thay vì đưa danh từ giải thích vào câu.
- source_word: ἀνακλῖναι πάντας
  choice: sắp xếp mọi người ngồi xuống
  rationale: Cấu trúc phân biệt “họ” là người nhận lệnh với “mọi người” là toàn thể đám đông được bố trí dùng bữa. “Ngồi xuống” tự nhiên trong tiếng Việt hiện đại; sắc thái nằm/ngả mình dùng bữa được ghi ở chú thích.
- source_word: συμπόσια συμπόσια
  choice: thành từng nhóm
  rationale: Cách lặp từ trong tiếng Hy Lạp mang nghĩa phân phối, tức đám đông được chia thành các nhóm riêng biệt.
- source_word: ἐπὶ τῷ χλωρῷ χόρτῳ
  choice: trên cỏ xanh
  rationale: Cách dịch trực tiếp, gọn và tự nhiên của cụm từ chỉ lớp cỏ đang xanh tươi.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện trang trọng vừa phải, rõ ràng với độc giả hiện đại. Câu dịch tránh nhập “họ” (các môn đồ nhận lệnh) với “mọi người” (đám đông được sắp chỗ), đồng thời dùng “ngồi xuống” thay cho lối diễn đạt khó tự nhiên “ngả mình” trong chính văn.
