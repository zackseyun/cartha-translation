    issue: Vị trí mỏ neo chú thích b chưa rõ đối tượng được chú thích.
    rationale: Chú thích b giải thích ἀνακλῖναι, tức “ngồi xuống,” nhưng hiện được đặt sau dấu chấm, dễ bị hiểu là liên hệ với cả câu hoặc cụm “cỏ xanh.”
  - severity: low
    issue: Cách diễn đạt chú thích a có thể gây sắc thái tuần tự.
    rationale: “Hết nhóm này đến nhóm khác” có thể được hiểu là lần lượt theo thời gian. Sự lặp lại συμπόσια συμπόσια chủ yếu chỉ việc phân thành các nhóm riêng/rải theo từng nhóm.
