  source_fidelity: Cần sửa “anh mình” vì ἀδελφός chỉ “anh/em trai” và không xác định người anh. “Vẫn thường nói” truyền đạt tốt thì vị hoàn ἔλεγεν; “Vì” giữ lực giải thích của γάρ; “không được phép” diễn đạt phù hợp οὐκ ἔξεστίν σοι. “Lấy vợ” là cách nói tự nhiên trong ngữ cảnh hôn nhân, dù ἔχειν sát chữ là “có”.
  naturalness: Câu văn trang trọng, hiện đại và rõ nghĩa. “Ngài” phù hợp lối xưng hô kính trọng với một nhà cai trị trong văn cảnh Kinh Thánh. Việc dùng “anh/em” là cách gọn, phổ biến để không áp đặt thứ bậc mà tiếng Hy Lạp không nêu.
  terminology: Giữ nhất quán tên “Giăng”, “Hê-rốt” và thuật ngữ “vợ”. Không nên chuyển ἀδελφός thành riêng “anh”, vì đó là thông tin không có trong bản gốc.
