source:
  edition: SBLGNT
  text: ἔλεγεν γὰρ ὁ Ἰωάννης τῷ Ἡρῴδῃ ὅτι Οὐκ ἔξεστίν σοι ἔχειν τὴν γυναῖκα τοῦ ἀδελφοῦ σου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/018.yaml
  text: For John had been saying to Herod[a], “It is not lawful for you to have your brother’s wife.”
translation:
  language: vi
  text: 'Vì Giăng vẫn thường nói với Hê-rốt rằng: “Ngài không được phép lấy vợ của anh/em mình.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “Ngài không được phép có vợ của anh/em mình.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: vẫn thường nói
  rationale: Thì vị hoàn biểu thị hành động kéo dài hoặc lặp lại trong quá khứ; “vẫn thường nói” truyền đạt sắc thái ấy tự nhiên trong tiếng Việt.
- source_word: γὰρ
  choice: Vì
  rationale: Giữ chức năng giải thích nguyên nhân cho lời kể ngay trước đó.
- source_word: Ἡρῴδῃ
  choice: Hê-rốt
  rationale: Dùng dạng phiên âm tên riêng quen thuộc trong tiếng Việt.
- source_word: Οὐκ ἔξεστίν σοι
  choice: Ngài không được phép
  rationale: ἔξεστιν nói về điều được phép hoặc hợp luật. Cách dịch này giữ lực cấm đoán về luân lý-pháp luật mà không thêm rõ một nguồn luật không được nêu trực tiếp.
- source_word: ἔχειν
  choice: lấy
  rationale: Trong ngữ cảnh quan hệ hôn nhân, “lấy” diễn đạt tự nhiên việc có một người làm vợ; sát nghĩa hình thức hơn là “có” nhưng tránh cách nói tiếng Việt dễ gợi ý sở hữu.
- source_word: γυναῖκα τοῦ ἀδελφοῦ σου
  choice: vợ của anh mình
  rationale: γυνή ở đây rõ ràng mang nghĩa “vợ”; “anh” phù hợp quan hệ cụ thể trong bối cảnh, còn “mình” quy chiếu tự nhiên về Hê-rốt.
theological_decisions:
- issue: Tính chất lời quở trách của Giăng
  choice: 'Dịch là lời tuyên bố về điều không được phép: “Ngài không được phép”'
  alternative: “Ngài không có quyền” hoặc “Ngài không được luật pháp cho phép”
  rationale: Bản dịch giữ sắc thái pháp lý-luân lý của ἔξεστιν và liên hệ hàm ẩn với luật Torah, nhưng không bổ sung minh nhiên “luật pháp” khi câu Hy Lạp không nêu từ ấy.
- issue: Ý nghĩa của ἔχειν trong quan hệ hôn nhân
  choice: “lấy vợ của anh mình”
  alternative: “có vợ của anh mình”
  rationale: “Lấy” là cách nói tự nhiên về việc nhận một người làm vợ và phù hợp lời tố cáo về quan hệ hôn nhân; chú thích bảo tồn cách dịch sát chữ hơn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” khi Giăng nói trực tiếp với nhà cai trị; đặt dấu [a] ngay sau câu được chú thích.
