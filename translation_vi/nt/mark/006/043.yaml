  text: And they picked up twelve basketfuls of broken pieces[a], and some of the fish.
translation:
  language: vi
  text: Họ thu lại mười hai giỏ đầy những mẩu bánh, và cả cá[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “mười hai giỏ đầy các mẩu vụn.” Cụm Hy Lạp kết hợp các ý “mẩu bị bẻ ra,” “mười hai giỏ” và “phần/lượng làm đầy”; cụm cuối cũng thêm rằng có phần từ cá.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦραν
  choice: thu lại được
  rationale: Động từ αἴρω trong ngữ cảnh chỉ việc thu gom thức ăn còn lại sau bữa ăn; cách diễn đạt này tự nhiên trong tiếng Việt và vẫn giữ hành động cụ thể.
- source_word: κλάσματα
  choice: những mẩu bánh vụn
  rationale: κλάσματα là các mẩu bị bẻ ra; ngữ cảnh phép hóa bánh cho thấy đó là những mẩu bánh. Thêm “bánh” giúp câu rõ nghĩa trong tiếng Việt mà không làm thay đổi ý.
- source_word: δώδεκα κοφίνων πληρώματα
  choice: mười hai giỏ đầy
  rationale: Cụm Hy Lạp kết hợp “mười hai giỏ” với ý về phần đầy hoặc lượng chứa đầy. “Mười hai giỏ đầy” vừa tự nhiên vừa phản ánh khá sát cấu trúc nguồn.
- source_word: κόφινος
  choice: giỏ
  rationale: κόφινος chỉ một loại giỏ; “giỏ” là từ phổ thông, rõ ràng, không suy đoán thêm về kích thước.
- source_word: πληρώματα
  choice: đầy
  rationale: πληρώματα ở đây nói đến lượng làm đầy các giỏ hoặc phần chứa đầy; “giỏ đầy” truyền đạt gọn ý này.
- source_word: ἀπὸ τῶν ἰχθύων
  choice: cùng với phần cá còn lại
  rationale: 'ἀπό ở đây có sắc thái nguồn gốc hoặc bộ phận: đồ được thu gom cũng gồm phần từ cá. Cách dịch này tự nhiên hơn “từ những con cá” trong tiếng Việt và phù hợp ngữ cảnh thức ăn thừa.'
