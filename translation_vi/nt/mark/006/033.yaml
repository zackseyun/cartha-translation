    issue: “theo đường bộ” không đặc trưng bằng πεζῇ.
    rationale: πεζῇ nghĩa là đi/chạy bằng chân; “đường bộ” có thể bao gồm các hình thức di chuyển trên đất liền khác, nên làm yếu sự đối lập với thuyền.
  - severity: low
    issue: Chủ ngữ tiếp nối được đổi thành “người ta”.
    rationale: Dù có thể hiểu được, “người ta” làm mờ sự tiếp nối trực tiếp của πολλοί và tạo quy chiếu kém rõ cạnh hai lần “họ”.
