  text: καὶ εἶδον αὐτοὺς ὑπάγοντας καὶ ⸀ἐπέγνωσαν πολλοί, καὶ πεζῇ ἀπὸ πασῶν τῶν πόλεων συνέδραμον ἐκεῖ καὶ προῆλθον ⸀αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/033.yaml
  text: And many saw them going and recognized them[b][a], and on foot from all the towns they ran there together and got there ahead of them.
translation:
  language: vi
  text: Nhiều người thấy họ đang đi và nhận ra họ. Những người ấy từ khắp các thị trấn[b] chạy bộ[a] đến đó và đến trước họ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “theo đường bộ”; từ Hy Lạp nhấn mạnh sự tương phản với việc đi bằng thuyền.'
    reason: lexical_alternative
  - marker: b
    text: 'Hay: “các thành”; từ Hy Lạp có thể chỉ thị trấn hoặc thành phố tùy văn cảnh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶδον
  choice: thấy
  rationale: Diễn đạt trực tiếp hành động nhìn thấy trong trình tự tường thuật, không thêm sắc thái ngoài bản văn.
- source_word: ὑπάγοντας
  choice: đang đi
  rationale: Giữ ý hành động đang diễn ra; phương tiện là thuyền đã rõ từ văn cảnh trước nên không cần thêm vào câu này.
- source_word: ἐπέγνωσαν
  choice: nhận ra
  rationale: Trong văn cảnh, động từ chỉ việc nhận biết họ là ai, chứ không phải tiếp thu một kiến thức mới.
- source_word: πολλοί
  choice: nhiều người
  rationale: Tính từ được dùng như danh từ; tiếng Việt cần thêm “người” để câu rõ và tự nhiên.
- source_word: πεζῇ
  choice: theo đường bộ
  rationale: Cách dịch này nêu rõ sự tương phản với hành trình bằng thuyền, đồng thời tránh sắc thái hiện đại của “chạy bộ” như một hình thức tập thể dục.
- source_word: ἀπὸ πασῶν τῶν πόλεων
  choice: từ khắp các thị trấn
  rationale: πόλις có thể chỉ thành hoặc thị trấn; “thị trấn” phù hợp tự nhiên với bối cảnh Ga-li-lê, còn “khắp” chuyển tải πασῶν.
- source_word: συνέδραμον
  choice: chạy tụ lại
  rationale: Giữ cả ý chạy nhanh và ý nhiều người từ các hướng cùng hội tụ chứa trong động từ ghép.
- source_word: ἐκεῖ
  choice: nơi ấy
  rationale: Đại từ chỉ nơi chốn này được diễn đạt tự nhiên và trang trọng trong văn kể tiếng Việt.
- source_word: προῆλθον αὐτούς
  choice: đến trước họ
  rationale: Diễn đạt ý đoàn người tới nơi trước Chúa Giê-xu và các môn đồ, không bổ sung chi tiết ngoài nguyên văn.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện hiện đại, rõ ràng và trang nghiêm. Câu được tách làm hai để tránh chuỗi liên từ nặng nề trong tiếng Việt; “người ta” làm rõ chủ thể được tiếp nối từ “nhiều người” mà không thay đổi nội dung. Đại từ “họ” giữ mức độ quy chiếu của nguyên văn và văn cảnh.
