reference: Mark 6:14
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Καὶ ἤκουσεν ὁ βασιλεὺς Ἡρῴδης, φανερὸν γὰρ ἐγένετο τὸ ὄνομα αὐτοῦ, καὶ ⸀ἔλεγον ὅτι Ἰωάννης ὁ βαπτίζων ⸂ἐγήγερται ἐκ νεκρῶν⸃, καὶ διὰ τοῦτο ἐνεργοῦσιν αἱ δυνάμεις ἐν αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/014.yaml
  text: And King Herod heard of it[a], for his name had become well known, and people were saying, “John the Baptizer has been raised from the dead[c][b], and because of this these powers are at work in him.”
translation:
  language: vi
  text: 'Vua Hê-rốt nghe tin ấy, vì danh tiếng của Đức Giê-su đã trở nên được biết đến rộng rãi. Người ta nói: “Giăng, người làm phép báp-têm[a], đã được làm cho sống lại từ cõi chết[b]; vì thế, những quyền năng ấy[c] đang hoạt động trong ông.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch theo cách gọi truyền thống: “Giăng Báp-tít.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “đã sống lại từ cõi chết.” Động từ Hy Lạp ở thể bị động: “đã được làm cho sống lại.”'
    reason: alternative_reading
  - marker: c
    text: Cũng có thể hiểu là “những quyền năng làm phép lạ” hoặc “những việc quyền năng.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ βασιλεὺς Ἡρῴδης
  choice: Vua Hê-rốt
  rationale: Cách gọi tự nhiên trong tiếng Việt, truyền đạt trực tiếp tước hiệu βασιλεύς.
- source_word: ἤκουσεν
  choice: nghe biết chuyện ấy
  rationale: Động từ có nghĩa là “nghe”; tân ngữ được hiểu ngầm từ văn cảnh trước về hoạt động và danh tiếng của Đức Giê-su. “Chuyện ấy” giúp câu tiếng Việt tự nhiên mà không xác định quá mức nội dung.
- source_word: φανερὸν γὰρ ἐγένετο τὸ ὄνομα αὐτοῦ
  choice: vì tên tuổi của Ngài đã được nhiều người biết đến
  rationale: “Tên tuổi” diễn đạt tự nhiên ý niệm về tên và danh tiếng; “được nhiều người biết đến” chuyển tải φανερὸν ἐγένετο. Đại từ vẫn giữ cách quy chiếu của nguyên văn về nhân vật trong văn cảnh trước.
- source_word: ἔλεγον
  choice: Người ta nói
  rationale: Động từ số nhiều không nêu chủ thể mang nghĩa phiếm chỉ; “người ta” là cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: Ἰωάννης ὁ βαπτίζων
  choice: Giăng, người làm phép báp-têm
  rationale: Cụm phân từ có nghĩa đen là người thực hiện việc báp-têm. Cách dịch này giữ động tính của ὁ βαπτίζων thay vì chỉ dùng một danh hiệu truyền thống.
- source_word: ἐγήγερται ἐκ νεκρῶν
  choice: đã được làm cho sống lại từ cõi chết
  rationale: Giữ thể bị động của động từ hoàn thành ἐγείρω, đồng thời diễn đạt rõ sự sống lại bằng tiếng Việt tự nhiên.
- source_word: διὰ τοῦτο
  choice: vì thế
  rationale: Diễn đạt ngắn gọn quan hệ nguyên nhân-kết quả mà cụm từ Hy Lạp nêu ra.
- source_word: ἐνεργοῦσιν
  choice: đang hoạt động
  rationale: Thể hiện hoạt động đang tiếp diễn của các quyền năng, phù hợp với thì hiện tại trong nguyên văn.
- source_word: αἱ δυνάμεις
  choice: những quyền năng ấy
  rationale: Giữ danh từ số nhiều và tránh quyết định thay người đọc rằng từ này chỉ các năng lực siêu nhiên hay chính các phép lạ.
- source_word: ἐν αὐτῷ
  choice: trong ông
  rationale: Giữ nghĩa trực tiếp của giới từ ἐν; “qua ông” là một khả năng diễn giải nhưng kém sát hình thức nguyên văn hơn.
theological_decisions:
- issue: Thể của ἐγήγερται trong lời nói về sự sống lại
  choice: đã được làm cho sống lại từ cõi chết
  alternative: đã sống lại từ cõi chết
  rationale: Nguyên văn dùng thể bị động rõ ràng. Bản dịch giữ thể này để không chuyển thành sắc thái chủ động hay nội động mà văn bản không minh nhiên dùng.
- issue: Cách gọi Ἰωάννης ὁ βαπτίζων
  choice: Giăng, người làm phép báp-têm
  alternative: Giăng Báp-tít
  rationale: Cách chọn chính phản ánh trực tiếp phân từ “người làm báp-têm”; danh hiệu truyền thống được ghi ở chú thích để người đọc vẫn nhận ra cách gọi quen thuộc.
- issue: Ý nghĩa của αἱ δυνάμεις
  choice: những quyền năng ấy
  alternative: những phép lạ ấy
  rationale: δύναμις có thể chỉ quyền năng, năng lực kỳ diệu hoặc việc quyền năng/phép lạ. Giữ “quyền năng” bảo tồn độ mở nghĩa và hình ảnh các quyền năng đang hoạt động.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Bản dịch dùng “người ta” cho chủ thể phiếm chỉ, giữ thể bị động trong lời nói về sự sống lại, đồng thời dùng “quyền năng” để bảo tồn độ mở nghĩa của δύναμις. Các dấu chú thích [a], [b], [c] đều được đặt ngay sau cụm từ liên quan trong chính văn.
