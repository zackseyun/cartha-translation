revisions:
- from: 'Vua Hê-rốt nghe biết chuyện ấy, vì tên tuổi của Ngài đã được nhiều người biết đến. Người ta nói: “Giăng, người làm phép báp-têm[a], đã được làm cho sống lại từ cõi chết[b]; vì thế, những quyền năng ấy[c] đang hoạt động trong ông.”'
  to: 'Vua Hê-rốt nghe tin ấy, vì danh tiếng của Đức Giê-su đã trở nên được biết đến rộng rãi. Người ta nói: “Giăng, người làm phép báp-têm[a], đã được làm cho sống lại từ cõi chết[b]; vì thế, những quyền năng ấy[c] đang hoạt động trong ông.”'
  rationale: 'Sửa tối thiểu nhằm giải quyết sự mơ hồ trong quy chiếu của αὐτοῦ: mệnh đề này nói về danh tiếng của Đức Giê-su, không phải của Hê-rốt. Đồng thời thay “nghe biết chuyện ấy” bằng “nghe tin ấy” cho tự nhiên hơn, không thay đổi nghĩa. Giữ nguyên các lựa chọn quan trọng về thể bị động của ἐγήγερται, tính phiếm chỉ của ἔλεγον, và độ mở nghĩa của δυνάμεις.'
