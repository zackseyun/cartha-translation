  terminology: “Ê-li” là dạng tên quen dùng trong tiếng Việt. “Một nhà tiên tri” phản ánh đúng cách hiểu không xác định của προφήτης trong ngữ cảnh, còn chú thích ghi nhận minh bạch khả năng đọc như một tước hiệu cánh chung mà không áp đặt cách hiểu ấy.
