  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἄλλοι ⸀δὲ ἔλεγον ὅτι Ἠλίας ἐστίν· ἄλλοι δὲ ἔλεγον ὅτι ⸀προφήτης ὡς εἷς τῶν προφητῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/015.yaml
  text: But others were saying[a], “He is Elijah,” and others were saying, “He is a prophet, like one of the prophets.”
translation:
  language: vi
  text: 'Nhưng những người khác lại nói: “Người là Ê-li”; còn những người khác nói: “Người là một nhà tiên tri[a], giống như một trong các nhà tiên tri.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc, tuy ít có khả năng hơn: “Đấng Tiên Tri,” nếu hiểu đây là một nhân vật cánh chung cụ thể. Ở đây, tiếng Hy Lạp tự nhiên hơn khi được hiểu là “một nhà tiên tri,” vì câu tiếp tục: “giống như một trong các nhà tiên tri.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ἄλλοι δὲ
  choice: Nhưng những người khác lại
  rationale: Diễn đạt sự chuyển sang một nhóm ý kiến khác; δέ mang sắc thái đối chiếu nhẹ, còn “lại” giúp câu tiếng Việt tự nhiên.
- source_word: ἔλεγον
  choice: nói
  rationale: Thể chưa hoàn thành cho thấy lời nhận định đang được lưu truyền hoặc lặp lại. Trong ngữ cảnh liệt kê các ý kiến, “lại nói” và sự lặp cấu trúc chuyển tải sắc thái ấy tự nhiên hơn cách dịch nặng nề như “đang nói”.
- source_word: ὅτι Ἠλίας ἐστίν
  choice: “Người là Ê-li”
  rationale: Chuyển mệnh đề ὅτι thành lời nói trực tiếp cho tự nhiên; “Người” giữ cách quy chiếu trang trọng mà không thêm một danh hiệu thần học.
- source_word: προφήτης
  choice: một nhà tiên tri
  rationale: 'Danh từ vị ngữ không có mạo từ và phần so sánh ngay sau đó ủng hộ nghĩa không xác định: một người thuộc hàng ngũ các nhà tiên tri.'
- source_word: ὡς εἷς τῶν προφητῶν
  choice: giống như một trong các nhà tiên tri
  rationale: ὡς biểu thị sự so sánh; cách dịch này giữ nguyên ý rằng Người được ví với một nhân vật trong hàng ngũ các nhà tiên tri.
theological_decisions:
- issue: προφήτης là cách gọi chung “một nhà tiên tri” hay tước hiệu cánh chung “Đấng Tiên Tri”
  choice: một nhà tiên tri
  alternative: Đấng Tiên Tri
  rationale: Tiếng Hy Lạp không có mạo từ, và cụm ὡς εἷς τῶν προφητῶν (“giống như một trong các nhà tiên tri”) ngay sau đó nghiêng rõ hơn về cách nhận diện chung. Chú thích vẫn ghi nhận cách hiểu tước hiệu vì hình thức Hy Lạp có thể được tranh luận.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ hai nhóm “những người khác” như nguyên văn, đồng thời dùng “nhưng… còn…” để thể hiện sự chuyển tiếp và đối chiếu nhẹ. Dùng “nhà tiên tri” theo cách gọi phổ thông trong tiếng Việt hiện đại.
