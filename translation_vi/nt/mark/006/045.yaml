base_translation:
  language: en
  yaml_path: translation/nt/mark/006/045.yaml
  text: And immediately he compelled his disciples to get into the boat and go ahead to the other side[a], toward Bethsaida[b], until he himself dismissed the crowd.
translation:
  language: vi
  text: Ngay lập tức, Đức Giê-su buộc các môn đồ lên thuyền đi trước sang bờ bên kia, hướng về Bết-sai-đa, cho đến khi chính Ngài giải tán đám đông.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hy Lạp: “cho đến khi chính Ngài giải tán đám đông”; động từ “giải tán” ở thì hiện tại trong một mệnh đề chỉ thời gian.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθὺς
  choice: Ngay lập tức
  rationale: Giữ nhịp kể khẩn trương đặc trưng của sách Mác, đồng thời tự nhiên trong tiếng Việt hiện đại.
- source_word: ἠνάγκασεν
  choice: buộc
  rationale: Diễn đạt sức ép hoặc tính bắt buộc của ἀναγκάζω mà không hàm ý cưỡng bức thể chất.
- source_word: τοὺς μαθητὰς αὐτοῦ
  choice: các môn đồ
  rationale: Thuật ngữ quen thuộc, giữ rõ quan hệ thầy–trò trong bối cảnh sách Tin Mừng.
- source_word: ἐμβῆναι εἰς τὸ πλοῖον
  choice: lên thuyền
  rationale: Cách nói ngắn gọn, tự nhiên trong tiếng Việt cho hành động bước vào một chiếc thuyền.
- source_word: προάγειν
  choice: đi trước
  rationale: Giữ ý các môn đồ khởi hành trước Đức Giê-su.
- source_word: εἰς τὸ πέραν
  choice: sang bờ bên kia
  rationale: Diễn đạt tự nhiên thành ngữ chỉ việc qua phía đối diện của hồ.
- source_word: πρὸς Βηθσαϊδάν
  choice: hướng về Bết-sai-đa
  rationale: Giữ sắc thái phương hướng của πρός với đối cách, không khẳng định quá mức rằng địa danh này nhất thiết là điểm đến đã đạt tới.
- source_word: ἕως
  choice: trong khi
  rationale: Trong cấu trúc này, hành động của các môn đồ diễn ra trong khoảng thời gian Đức Giê-su giải tán đám đông; tiếng Việt tự nhiên dùng “trong khi”. Chú thích bảo lưu nghĩa sát chữ “cho đến khi”.
- source_word: αὐτὸς
  choice: chính Ngài
  rationale: 'Giữ sắc thái nhấn mạnh của đại từ αὐτός: Đức Giê-su đích thân ở lại xử lý đám đông.'
- source_word: ἀπολύει τὸν ὄχλον
  choice: giải tán đám đông
  rationale: Diễn đạt đúng việc cho đám đông ra về; thì hiện tại Hy Lạp trong mệnh đề thời gian được chuyển tự nhiên theo mạch kể tiếng Việt.
