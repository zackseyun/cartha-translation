  text: ἀπόλυσον αὐτούς, ἵνα ἀπελθόντες εἰς τοὺς κύκλῳ ἀγροὺς καὶ κώμας ἀγοράσωσιν ἑαυτοῖς ⸂τί φάγωσιν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/036.yaml
  text: Send them away[a], so that they may go into the surrounding countryside and villages and buy themselves something to eat.
translation:
  language: vi
  text: Hãy cho họ về[a], để họ đi đến các vùng quê và làng mạc chung quanh mua thức ăn cho mình.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay, sát nghĩa hơn: “Hãy giải tán họ, để sau khi đi đến các vùng quê và làng mạc chung quanh, họ mua cho mình thứ để ăn.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπόλυσον
  choice: Hãy cho họ về
  rationale: Động từ mệnh lệnh aorist ở đây có nghĩa cho đám đông rời đi. “Hãy cho họ về” tự nhiên trong tiếng Việt, đồng thời giữ rõ sắc thái mệnh lệnh; “giải tán họ” trang trọng và cứng hơn.
- source_word: ἵνα
  choice: để
  rationale: Diễn đạt mục đích của việc cho đám đông về một cách tự nhiên và chính xác.
- source_word: ἀπελθόντες
  choice: họ đi
  rationale: Phân từ aorist chỉ hành động xảy ra trước việc mua; trong tiếng Việt, đưa vào mệnh đề mục đích thành “để họ đi... mua...” vừa tự nhiên vừa giữ được trình tự.
- source_word: τοὺς κύκλῳ ἀγροὺς καὶ κώμας
  choice: các cánh đồng và làng mạc chung quanh
  rationale: ἀγροί có thể chỉ đồng ruộng, nông trại hoặc vùng nông thôn; “các cánh đồng” giữ hình ảnh cụ thể của nguyên văn, còn “làng mạc chung quanh” diễn đạt κύκλῳ và κώμας tự nhiên.
- source_word: ἀγοράσωσιν
  choice: mua
  rationale: Diễn đạt trực tiếp nghĩa mua bằng tiền, rõ ràng và hiện đại.
- source_word: ἑαυτοῖς
  choice: cho mình
  rationale: Giữ sắc thái phản thân và lợi ích của chính họ trong cách nói tiếng Việt tự nhiên.
- source_word: τί φάγωσιν
  choice: thức ăn
  rationale: Cụm từ theo nghĩa đen là “thứ gì để ăn”; “thức ăn” truyền đạt tự nhiên ý nghĩa bất định trong ngữ cảnh.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Câu chính ưu tiên cách diễn đạt tự nhiên; chú thích lưu lại cách dịch hình thức hơn của ἀπόλυσον, phân từ ἀπελθόντες và τί φάγωσιν.
