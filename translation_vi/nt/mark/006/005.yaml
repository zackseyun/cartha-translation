review_pass:
  verdict: revise
  source_fidelity: Bản nháp giữ đúng mệnh đề phủ định của ἐδύνατο và không làm nhẹ thành ý không muốn. Tuy nhiên, “phép lạ” là cách diễn giải hẹp hơn δύναμις; trong câu này từ ấy là “việc/hành động quyền năng” theo lối dùng của Mác. Cụm ngoại lệ cũng nên biểu thị rõ chủ ngữ và hai hành động quá khứ như nguyên văn.
  naturalness: “Ngài không thể làm bất cứ việc quyền năng nào tại đó” tự nhiên, trang trọng vừa phải, đồng thời sát với từ vựng nguồn. “Ngoại trừ Ngài đã đặt tay trên một số ít người bệnh và chữa lành họ” tránh để cụm động từ sau “ngoại trừ” bị lửng chủ ngữ.
  terminology: Dùng “việc quyền năng” cho δύναμις bảo toàn liên hệ với “quyền năng” và không đồng nhất hóa sẵn với mọi nghĩa của “phép lạ”. “Đặt tay trên” và “chữa lành” phù hợp với ἐπιθεὶς τὰς χεῖρας và ἐθεράπευσεν.
