  text: καὶ οὐκ ἐδύνατο ἐκεῖ ⸂ποιῆσαι οὐδεμίαν δύναμιν⸃, εἰ μὴ ὀλίγοις ἀρρώστοις ἐπιθεὶς τὰς χεῖρας ἐθεράπευσεν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/005.yaml
  text: And he was not able to do any mighty work there[a], except that he laid his hands on a few sick people and healed them.
translation:
  language: vi
  text: Ngài không thể làm bất cứ việc quyền năng nào tại đó,[a] ngoại trừ Ngài đã đặt tay trên một số ít người bệnh và chữa lành họ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hoặc “phép lạ nào” hay “hành động quyền năng nào”. Nguyên văn Hy Lạp nói “bất cứ quyền năng nào”; trong Mác, đây là cách diễn đạt chỉ những việc kỳ diệu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδύνατο
  choice: không thể
  rationale: Diễn đạt trực tiếp động từ δύναμαι ở thể phủ định, giữ nguyên ý về sự không thể mà câu Hy Lạp nêu ra.
- source_word: ποιῆσαι οὐδεμίαν δύναμιν
  choice: làm phép lạ nào
  rationale: Trong cách dùng của Mác, δύναμις có thể chỉ một hành động quyền năng hay phép lạ. Cách dịch này tự nhiên trong tiếng Việt hiện đại; chú thích giữ lại sắc thái nguyên văn là “quyền năng”.
- source_word: εἰ μὴ
  choice: ngoại trừ
  rationale: Nêu rõ ngoại lệ đối với mệnh đề phủ định đứng trước.
- source_word: ὀλίγοις ἀρρώστοις
  choice: một vài người bệnh
  rationale: Chuyển tải tự nhiên cả số lượng ít và tình trạng đau yếu.
- source_word: ἐπιθεὶς τὰς χεῖρας
  choice: đặt tay trên
  rationale: Giữ nguyên hành động cụ thể của phân từ Hy Lạp bằng lối nói rõ ràng, quen thuộc trong tiếng Việt.
- source_word: ἐθεράπευσεν
  choice: chữa lành
  rationale: Phản ánh nghĩa chữa trị và phục hồi của θεραπεύω trong ngữ cảnh này.
theological_decisions:
- issue: Có nên làm nhẹ οὐκ ἐδύνατο để tránh hàm ý giới hạn nơi Chúa Giê-su hay không
  choice: 'Giữ nghĩa trực tiếp: “Ngài không thể làm phép lạ nào tại đó”'
  alternative: “Ngài không muốn làm phép lạ nào tại đó” hoặc “Ngài đã không làm phép lạ nào tại đó”
  rationale: Bản Hy Lạp dùng δύναμαι với phủ định, thực sự phát biểu sự không thể. Bản dịch giữ nguyên căng thẳng thần học của câu, không đổi thành sự không muốn hay chỉ đơn thuần là không hành động.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “Ngài” cho đại từ chỉ Chúa Giê-su theo ngữ cảnh; cấu trúc câu bám sát nguyên văn mà vẫn tự nhiên.
