revisions:
- from: Nếu nơi nào không tiếp đón các con, cũng không nghe các con, thì khi rời khỏi đó, hãy giũ bụi dưới chân các con để làm chứng chống lại họ.[a][b]
  to: Hễ nơi nào không tiếp đón anh em và không nghe anh em, thì khi rời khỏi đó, hãy giũ bụi dưới chân anh em[b] để làm chứng cho họ[a].
  rationale: Sửa cụm làm chứng để phản ánh trực tiếp hơn εἰς μαρτύριον αὐτοῖς và bảo tồn mơ hồ ngữ nghĩa trong chính văn; chuyển cách hiểu “chống lại” sang chú thích. Đồng thời điều chỉnh cách xưng hô và cấu trúc mở đầu cho tự nhiên trong tiếng Việt hiện đại, không thay đổi ý nghĩa của câu.
  reviewer_model: gpt-5.6-terra
