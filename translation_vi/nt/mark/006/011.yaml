source:
  edition: SBLGNT
  text: καὶ ⸂ὃς ἂν τόπος μὴ δέξηται⸃ ὑμᾶς μηδὲ ἀκούσωσιν ὑμῶν, ἐκπορευόμενοι ἐκεῖθεν ἐκτινάξατε τὸν χοῦν τὸν ὑποκάτω τῶν ποδῶν ὑμῶν εἰς μαρτύριον ⸀αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/011.yaml
  text: And whatever place does not receive you or listen to you, as you leave there, shake off the dust that is under your feet as a testimony against them.
translation:
  language: vi
  text: Hễ nơi nào không tiếp đón anh em và không nghe anh em, thì khi rời khỏi đó, hãy giũ bụi dưới chân anh em[b] để làm chứng cho họ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể hiểu: “để làm chứng chống lại họ.” Cụm Hy Lạp theo nghĩa hình thức là “để làm chứng cho/đối với họ”; trong ngữ cảnh, hành động này có thể mang sắc thái cảnh báo hoặc bất lợi đối với những người khước từ sứ điệp.'
    reason: alternative_reading
  - marker: b
    text: Giũ bụi khỏi chân là một hành động tượng trưng cho sự đoạn tuyệt và lời cảnh báo khi người ta khước từ.
    reason: cultural_note
lexical_decisions:
- source_word: ὃς ἂν τόπος
  choice: nơi nào
  rationale: Cấu trúc bất định, khái quát; “nơi nào” tự nhiên trong tiếng Việt và vẫn thể hiện rõ danh từ τόπος.
- source_word: μὴ δέξηται ὑμᾶς
  choice: không tiếp đón các con
  rationale: δέχομαι trong bối cảnh sai phái nói đến việc đón nhận các sứ giả, gồm cả sắc thái tiếp đãi; “tiếp đón” tự nhiên và chính xác hơn cách dịch thuần ý niệm như “chấp nhận”.
- source_word: μηδὲ ἀκούσωσιν ὑμῶν
  choice: cũng không nghe các con
  rationale: ἀκούω với sở hữu cách có thể mang nghĩa nghe hoặc lắng nghe. “Nghe” giữ được độ rộng và không diễn giải mạnh thành “vâng theo”.
- source_word: ἐκπορευόμενοι ἐκεῖθεν
  choice: khi rời khỏi đó
  rationale: Phân từ mang ý nghĩa thời gian/hoàn cảnh; cách diễn đạt này tự nhiên và giữ đúng trình tự hành động.
- source_word: ἐκτινάξατε
  choice: hãy giũ
  rationale: Động từ chỉ hành động giũ cho rơi ra; “giũ” là từ ngắn gọn, tự nhiên đối với bụi bám dưới chân.
- source_word: τὸν χοῦν τὸν ὑποκάτω τῶν ποδῶν ὑμῶν
  choice: bụi dưới chân các con
  rationale: Diễn đạt gọn, tự nhiên mà vẫn phản ánh trực tiếp χοῦς và ὑποκάτω τῶν ποδῶν.
- source_word: εἰς μαρτύριον αὐτοῖς
  choice: để làm chứng chống lại họ
  rationale: μαρτύριον là lời/chứng cứ làm chứng; ngữ cảnh bị khước từ khiến hành động mang ý nghĩa bất lợi đối với họ. Vì αὐτοῖς theo hình thức là “cho/đối với họ,” cách dịch sát hơn được ghi ở chú thích.
theological_decisions:
- issue: Ý nghĩa của hành động giũ bụi
  choice: Một hành động tượng trưng làm chứng chống lại những người khước từ các sứ giả và sứ điệp.
  alternative: Một lời chứng cho họ/đối với họ, hoặc chủ yếu là dấu hiệu đoạn tuyệt.
  rationale: Ngữ cảnh cho thấy sắc thái cảnh báo và phán xét, nhưng εἰς μαρτύριον αὐτοῖς không tự nó diễn đạt minh nhiên giới từ “chống lại”; vì vậy bản dịch chính nêu lực ngữ cảnh, còn chú thích bảo tồn sự mơ hồ của nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “các con” để thể hiện lời Đức Giê-su nói với nhóm môn đồ trong quan hệ thầy–trò; giữ câu mệnh lệnh rõ ràng. Hai dấu chú thích đều xuất hiện trong chính văn.
