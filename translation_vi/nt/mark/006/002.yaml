source:
  edition: SBLGNT
  text: καὶ γενομένου σαββάτου ἤρξατο ⸂διδάσκειν ἐν τῇ συναγωγῇ⸃· καὶ ⸀οἱ πολλοὶ ἀκούοντες ἐξεπλήσσοντο λέγοντες· Πόθεν τούτῳ ταῦτα, καὶ τίς ἡ σοφία ἡ δοθεῖσα ⸀τούτῳ, καὶ ⸀αἱ δυνάμεις τοιαῦται διὰ τῶν χειρῶν αὐτοῦ ⸀γινόμεναι;
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/002.yaml
  text: And when the Sabbath came[a], he began to teach in the synagogue. And many who heard him were astonished, saying, “Where did this man get these things? And what is this wisdom given to him, and such mighty works happening through his hands?”
translation:
  language: vi
  text: 'Đến ngày Sa-bát, Đức Giê-su bắt đầu giảng dạy trong hội đường. Nhiều người nghe đều kinh ngạc và nói: “Người này lấy những điều ấy từ đâu? Sự khôn ngoan được ban cho người này là gì? Và sao lại có những việc quyền năng[a] như thế được thực hiện qua tay người này?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “những phép lạ như thế” hoặc “những việc đầy quyền năng như thế.” Từ Hy Lạp δυνάμεις ở số nhiều có thể chỉ các việc kỳ diệu hoặc những sự biểu lộ quyền năng.
    reason: lexical_alternative
lexical_decisions:
- source_word: γενομένου σαββάτου
  choice: Khi ngày sa-bát đến
  rationale: Giữ lực thời gian của kết cấu sở hữu cách tuyệt đối, đồng thời diễn đạt tự nhiên trong tiếng Việt.
- source_word: ἤρξατο διδάσκειν
  choice: bắt đầu giảng dạy
  rationale: Phản ánh trực tiếp kết cấu chỉ sự khởi đầu ἄρχομαι + động từ nguyên mẫu; “giảng dạy” phù hợp bối cảnh hội đường.
- source_word: συναγωγῇ
  choice: hội đường
  rationale: Trong bối cảnh Do Thái này, từ chỉ địa điểm và thiết chế tôn giáo; “hội đường” là cách gọi tiếng Việt rõ ràng, quen thuộc.
- source_word: οἱ πολλοὶ ἀκούοντες
  choice: Nhiều người nghe
  rationale: Diễn đạt tự nhiên phân từ ἀκούοντες và οἱ πολλοί; không buộc phải thêm tân ngữ vì tiếng Việt đã rõ theo ngữ cảnh.
- source_word: ἐξεπλήσσοντο
  choice: sửng sốt
  rationale: Truyền đạt phản ứng kinh ngạc mạnh và kéo dài được biểu thị bởi thì chưa hoàn thành.
- source_word: Πόθεν τούτῳ ταῦτα
  choice: Người này có những điều ấy từ đâu?
  rationale: Giữ câu hỏi về nguồn gốc và sắc thái tạo khoảng cách của τούτῳ mà không làm giọng điệu khinh miệt quá mức.
- source_word: τίς ἡ σοφία ἡ δοθεῖσα τούτῳ
  choice: Sự khôn ngoan được ban cho ông ấy là gì?
  rationale: Giữ thể bị động của δοθεῖσα và tính chất chất vấn của mệnh đề, không xác định thêm ai là Đấng ban.
- source_word: δυνάμεις τοιαῦται
  choice: những việc quyền năng như thế
  rationale: Giữ sắc thái về các hành động biểu lộ quyền năng, đồng thời tránh thu hẹp δυνάμεις ngay trong chính văn thành một thuật ngữ chỉ riêng phép lạ.
- source_word: διὰ τῶν χειρῶν αὐτοῦ γινόμεναι
  choice: được thực hiện qua tay ông ấy
  rationale: Bảo tồn hình ảnh công cụ “qua tay” và ý nghĩa các việc đang xảy ra hay được thực hiện.
theological_decisions:
- issue: Bản chất của δυνάμεις
  choice: những việc quyền năng
  alternative: các phép lạ
  rationale: Số nhiều δυνάμεις trong Mác thường chỉ những việc phi thường, nhưng cách dịch rộng hơn bảo tồn mối liên hệ từ vựng với quyền năng và tránh giải quyết quá mức sắc thái của từ.
- issue: Sắc thái của τούτῳ
  choice: “người này” ở câu hỏi đầu, rồi “ông ấy” ở câu sau
  alternative: “ông ấy” trong cả hai câu
  rationale: “Người này” thể hiện sắc thái tạo khoảng cách có thể có của đại từ chỉ định; chuyển sang “ông ấy” giúp câu tiếng Việt tự nhiên mà không gia tăng thái độ miệt thị.
- issue: Tác nhân ban sự khôn ngoan
  choice: giữ thể bị động “được ban cho”
  alternative: “Đức Chúa Trời ban cho”
  rationale: Bản Hy Lạp không nêu tác nhân, nên bản dịch không bổ sung một chủ thể thần học dù ngữ cảnh có thể hàm ý điều đó.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “ngày sa-bát” và “hội đường” theo cách gọi phổ biến; giữ chuỗi câu hỏi của đám đông và hình ảnh “qua tay ông ấy” từ nguyên bản.
