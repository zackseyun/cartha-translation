    rationale: Tiếng Việt thường nói “Đến ngày Sa-bát” khi diễn tả thời điểm một ngày trong tuần đến; cách này vẫn truyền đạt đầy đủ lực thời gian của γενομένου σαββάτου.
  - severity: low
    issue: Ký hiệu chú thích [a] hiện đặt ở cuối toàn bộ câu hỏi.
    rationale: Chú thích chỉ giải thích δυνάμεις, nên cần đặt ngay sau “những việc quyền năng” để neo chú thích chính xác.
  - severity: low
    issue: Đại từ chuyển từ “người này” sang “ông ấy” trong cùng chuỗi câu hỏi.
    rationale: Nguyên ngữ lặp τούτῳ; dùng nhất quán “người này” giữ sắc thái chỉ định/tạo khoảng cách có thể có và làm mạch lời nói nhất quán.
