  to: 'Đến ngày Sa-bát, Đức Giê-su bắt đầu giảng dạy trong hội đường. Nhiều người nghe đều kinh ngạc và nói: “Người này lấy những điều ấy từ đâu? Sự khôn ngoan được ban cho người này là gì? Và sao lại có những việc quyền năng[a] như thế được thực hiện qua tay người này?”'
  rationale: Chỉnh sửa chỉ nhằm tăng tính tự nhiên và nhất quán của tiếng Việt, đồng thời đặt lại neo chú thích cho đúng từ được giải thích. Bản sửa vẫn giữ thể bị động “được ban cho”, không nêu tác nhân ban sự khôn ngoan, và bảo tồn hình ảnh “qua tay người này” của διὰ τῶν χειρῶν αὐτοῦ.
  reviewer_model: gpt-5.6-terra
