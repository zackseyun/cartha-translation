translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dấu gạch ngang cuối câu được giữ vì câu chỉ thị còn tiếp sang câu kế tiếp. Các từ phủ định nối tiếp nhau tái hiện nhịp liệt kê dứt khoát của bản Hy Lạp.
