  text: καὶ παρήγγειλεν αὐτοῖς ἵνα μηδὲν αἴρωσιν εἰς ὁδὸν εἰ μὴ ῥάβδον μόνον, μὴ ⸂ἄρτον, μὴ πήραν⸃, μὴ εἰς τὴν ζώνην χαλκόν,
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/008.yaml
  text: And he instructed them to take nothing for the journey except a staff only—no bread[a], no bag[b], no copper in their belt—
translation:
  language: vi
  text: Ngài truyền cho họ không được mang gì đi đường, ngoại trừ một cây gậy mà thôi—không bánh, không túi đi đường[a], không tiền đồng[b] trong thắt lưng—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tức là túi người đi đường dùng để đựng lương thực hoặc vật dụng.
    reason: lexical_clarification
  - marker: b
    text: Nguyên văn là “đồng”; trong ngữ cảnh này chỉ tiền xu bằng đồng được mang trong thắt lưng.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρήγγειλεν
  choice: truyền cho
  rationale: Động từ diễn tả một chỉ thị có thẩm quyền; “truyền cho” giữ được sức nặng ấy mà vẫn tự nhiên trong ngữ cảnh căn dặn lên đường.
- source_word: μηδὲν αἴρωσιν
  choice: không được mang gì
  rationale: Trong ngữ cảnh chuẩn bị hành trình, αἴρω mang nghĩa đem hoặc mang theo; cách dịch này rõ ràng và tự nhiên trong tiếng Việt.
- source_word: εἰς ὁδὸν
  choice: đi đường
  rationale: Cụm này chỉ những thứ mang theo cho hành trình; “đi đường” ngắn gọn và thông dụng.
- source_word: εἰ μὴ ῥάβδον μόνον
  choice: ngoài duy nhất một cây gậy
  rationale: Giữ cả ý ngoại lệ của εἰ μή lẫn sự nhấn mạnh của μόνον, đồng thời xác định ῥάβδος là cây gậy dùng khi đi đường.
- source_word: ἄρτον
  choice: bánh
  rationale: Giữ danh từ cụ thể chỉ bánh làm lương thực, thay vì khái quát hóa thành “thức ăn”.
- source_word: πήραν
  choice: túi hành trang
  rationale: πήρα là loại túi người đi đường dùng để đựng lương thực hoặc vật dụng; “túi hành trang” rõ nghĩa hơn từ “túi” đứng riêng.
- source_word: ζώνην
  choice: thắt lưng
  rationale: Chỉ đai hoặc dải thắt quanh eo, nơi người ta có thể giữ tiền.
- source_word: χαλκόν
  choice: tiền đồng
  rationale: Danh từ nghĩa đen là đồng, nhưng trong ngữ cảnh vật được giữ ở thắt lưng, nó chỉ tiền xu bằng đồng; “tiền đồng” giữ được cả chất liệu và ý tiền tệ.
