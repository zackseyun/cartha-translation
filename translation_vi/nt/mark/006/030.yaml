revisions:
- from: Các sứ đồ tụ họp bên Đức Chúa Jêsus và thuật lại cho Ngài mọi điều họ đã làm và đã dạy.
  to: Các sứ đồ tụ họp lại với Giê-su và thuật lại cho Người mọi điều họ đã làm và đã dạy.
  rationale: Sửa cách diễn đạt về sự quy tụ để phản ánh tự nhiên và sát hơn quan hệ πρὸς; dùng tên “Giê-su” không kèm danh xưng không có trong câu; giữ nguyên “sứ đồ,” tính bao quát của “mọi điều,” và hai động từ song song “đã làm” / “đã dạy.”
