source:
  edition: SBLGNT
  text: Καὶ συνάγονται οἱ ἀπόστολοι πρὸς τὸν Ἰησοῦν, καὶ ἀπήγγειλαν αὐτῷ ⸀πάντα ὅσα ἐποίησαν καὶ ὅσα ἐδίδαξαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/030.yaml
  text: And the apostles gathered to Jesus[a], and they reported to him all that they had done and taught.
translation:
  language: vi
  text: Các sứ đồ tụ họp lại với Giê-su và thuật lại cho Người mọi điều họ đã làm và đã dạy.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνάγονται
  choice: tụ họp
  rationale: Thì hiện tại được dùng như hiện tại lịch sử trong lời kể; tiếng Việt có thể dùng động từ không đánh dấu thì. “Tụ họp” giữ ý cả nhóm cùng quy tụ.
- source_word: οἱ ἀπόστολοι
  choice: các sứ đồ
  rationale: Đây là danh xưng quen thuộc chỉ nhóm Mười Hai trong vai trò được sai phái, không chỉ là những người đưa tin nói chung.
- source_word: πρὸς τὸν Ἰησοῦν
  choice: bên Đức Chúa Jêsus
  rationale: πρός với đối cách diễn tả sự hướng đến và đến với một người; trong ngữ cảnh quy tụ, “bên” diễn đạt tự nhiên kết quả của chuyển động ấy mà không thêm ý thần học.
- source_word: ἀπήγγειλαν
  choice: thuật lại
  rationale: Động từ chỉ việc báo cáo lại những gì đã xảy ra; “thuật lại” tự nhiên và phù hợp với các môn đồ trở về sau chuyến đi.
- source_word: πάντα ὅσα
  choice: mọi điều
  rationale: Diễn đạt đầy đủ phạm vi bao quát của πάντα cùng mệnh đề quan hệ theo lối tiếng Việt tự nhiên.
- source_word: ἐποίησαν
  choice: đã làm
  rationale: Dấu “đã” làm rõ các hoạt động xảy ra trước lúc họ thuật lại.
- source_word: ἐδίδαξαν
  choice: đã dạy
  rationale: Giữ song song với “đã làm” và diễn tả hoạt động giảng dạy đã diễn ra trong chuyến đi.
theological_decisions:
- issue: Danh xưng ἀπόστολοι dành cho các môn đồ trở về
  choice: Dịch là “các sứ đồ” theo vai trò/danh xưng trong ngữ cảnh
  alternative: các phái viên; những người được sai đi
  rationale: “Sứ đồ” là thuật ngữ Kinh Thánh quen thuộc và giữ được cách Mác trình bày nhóm người đã được Đức Chúa Jêsus sai phái, thay vì làm nhạt danh xưng thành nghĩa chung.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Chúa Jêsus” và đại từ tôn kính “Ngài” theo quy ước Kinh Thánh tiếng Việt; cấu trúc gọn nhưng vẫn giữ hai hoạt động song song “đã làm” và “đã dạy” của nguyên văn.
