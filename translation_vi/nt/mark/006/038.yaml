reference: Mark 6:38
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὁ δὲ λέγει αὐτοῖς· Πόσους ⸂ἔχετε ἄρτους⸃; ⸀ὑπάγετε ἴδετε. καὶ γνόντες λέγουσιν· Πέντε, καὶ δύο ἰχθύας.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/038.yaml
  text: But he said to them, “How many loaves do you have? Go and see.” And when they found out, they said, “Five, and two fish.”
translation:
  language: vi
  text: 'Nhưng Ngài nói với họ: “Anh em có bao nhiêu ổ bánh? Hãy đi xem.” Sau khi biết được, họ thưa: “Năm ổ bánh và hai con cá.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄρτους
  choice: ổ bánh
  rationale: Chỉ các ổ bánh nhỏ làm lương thực, không phải những lát bánh; cách nói này tự nhiên và giữ được hình ảnh cụ thể của nguyên văn.
- source_word: ὑπάγετε ἴδετε
  choice: Hãy đi xem
  rationale: Giữ hai ý mệnh lệnh đi và xem bằng một câu tiếng Việt ngắn gọn, tự nhiên.
- source_word: γνόντες
  choice: Sau khi biết được
  rationale: Diễn đạt phân từ chỉ hành động xảy ra trước lời đáp, đồng thời không thêm cách thức họ thu thập thông tin.
- source_word: ἰχθύας
  choice: con cá
  rationale: Danh từ đếm thông dụng trong tiếng Việt, phù hợp với số lượng hai.
theological_decisions:
- issue: Thì hiện tại lịch sử trong λέγει và λέγουσιν
  choice: 'Dịch ở thì quá khứ: “nói” và “thưa”'
  alternative: 'Giữ hiện tại lịch sử: “nói” và “thưa” trong mạch hiện tại'
  rationale: Tiếng Việt không biến đổi động từ theo thì, nhưng cấu trúc kể chuyện và “sau khi” đặt lời nói trong diễn tiến quá khứ; cách diễn đạt tự nhiên này phù hợp ngữ cảnh mà không làm thay đổi nội dung.
- issue: Đại từ kính trọng dành cho Chúa Giê-su
  choice: “Ngài” và lời đáp “thưa”
  alternative: “ông ấy” và “nói”
  rationale: Dùng lối xưng hô trang trọng, phổ thông trong văn phong Kinh Thánh tiếng Việt, nhưng không thêm tước hiệu hay một khẳng định thần học ngoài câu nguồn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Anh em” thể hiện số nhiều trong αὐτοῖς và lời Chúa Giê-su nói với các môn đồ; “ổ bánh” tránh cách hiểu là năm lát bánh.
