  source_fidelity: Bản dịch phản ánh chính xác cấu trúc thời gian của sở hữu cách tuyệt đối ("Khi họ ra khỏi thuyền"), trạng từ εὐθύς ("lập tức"), và ý nghĩa của ἐπιγνόντες αὐτόν ("nhận ra Ngài"). Việc nêu "dân chúng" là một cách làm rõ chủ thể chủ cách số nhiều vốn không được nêu danh từ trong nguyên văn; mạch văn ngay sau đó (c. 55) hỗ trợ rõ ràng cách hiểu này. Chú thích cũng bảo lưu dữ kiện rằng nguyên văn không nêu chủ thể minh thị.
