  terminology: '"Ngài" là cách quy chiếu trang trọng, quen thuộc trong văn phong Kinh Thánh tiếng Việt hiện đại, không thêm nội dung giáo lý. "Dân chúng" phù hợp với những người địa phương được mạch văn xác định. Dấu chú thích đặt sau "dân chúng" đúng với nội dung chú thích.'
