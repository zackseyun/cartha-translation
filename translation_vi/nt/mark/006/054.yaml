  text: καὶ ἐξελθόντων αὐτῶν ἐκ τοῦ πλοίου ⸀εὐθὺς ἐπιγνόντες αὐτὸν
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/054.yaml
  text: And when they got out of the boat[a], immediately they recognized him.
translation:
  language: vi
  text: Khi họ ra khỏi thuyền, dân chúng[a] lập tức nhận ra Ngài.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn không nêu rõ danh từ làm chủ thể của “nhận ra”; theo mạch văn, đó là dân chúng trong vùng.
    reason: Giải thích chủ thể hàm ẩn trong tiếng Hy Lạp và việc làm rõ chủ thể trong bản dịch.
lexical_decisions:
- source_word: ἐξελθόντων αὐτῶν
  choice: khi họ ra khỏi
  rationale: Cấu trúc sở hữu cách tuyệt đối diễn tả thời gian; cách dịch này tự nhiên trong tiếng Việt và không buộc phải xác định rõ hơn những người ra khỏi thuyền.
- source_word: πλοίου
  choice: thuyền
  rationale: Trong bối cảnh Biển Ga-li-lê, πλοῖον chỉ một chiếc thuyền, không phải tàu lớn.
- source_word: εὐθὺς
  choice: lập tức
  rationale: Giữ được sắc thái tức thời và lối kể nhanh đặc trưng của Mác.
- source_word: ἐπιγνόντες
  choice: nhận ra
  rationale: Động từ ở đây nói đến việc nhận diện Đức Chúa Jêsus khi thấy Ngài.
- source_word: αὐτὸν
  choice: Ngài
  rationale: Đại từ chỉ Đức Chúa Jêsus theo mạch văn; “Ngài” là cách xưng hô trang trọng, tự nhiên trong văn phong Kinh Thánh tiếng Việt hiện đại.
- source_word: implicit subject of ἐπιγνόντες
  choice: dân chúng
  rationale: Chủ thể của phân từ số nhiều không được nêu bằng danh từ trong câu Hy Lạp; câu kế tiếp cho thấy đó là những người trong vùng. Nêu “dân chúng” giúp câu tiếng Việt rõ nghĩa, đồng thời chú thích ghi nhận tính hàm ẩn của nguyên văn.
theological_decisions:
- issue: Chủ thể nhận ra Đức Chúa Jêsus
  choice: dân chúng nhận ra Ngài
  alternative: họ nhận ra Ngài, để ngỏ chủ thể
  rationale: Đây là vấn đề cú pháp và mạch văn, không phải một xác quyết giáo lý. Phân từ ἐπιγνόντες ở chủ cách số nhiều không đồng quy chiếu một cách tự nhiên với αὐτῶν trong cấu trúc sở hữu cách tuyệt đối. Mác 6:55 cho thấy người dân địa phương là những người nhận ra Ngài rồi chạy khắp miền.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “lập tức” để giữ nhịp kể của Mác và “Ngài” để chỉ Đức Chúa Jêsus. Dấu chú thích được đặt ngay sau phần “dân chúng” mà chú thích giải thích.
