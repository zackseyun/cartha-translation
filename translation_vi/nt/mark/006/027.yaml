  text: καὶ ⸀εὐθὺς ἀποστείλας ὁ βασιλεὺς σπεκουλάτορα ἐπέταξεν ⸀ἐνέγκαι τὴν κεφαλὴν αὐτοῦ. ⸀καὶ ἀπελθὼν ἀπεκεφάλισεν αὐτὸν ἐν τῇ φυλακῇ
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/027.yaml
  text: And immediately the king sent an executioner and ordered him to bring his head[a]. And he went and beheaded him in the prison.
translation:
  language: vi
  text: Ngay lập tức, vua sai một lính cận vệ[a] và ra lệnh cho người ấy đem đầu Giăng đến. Người ấy đi rồi chém đầu Giăng trong ngục.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “lính hộ vệ” hoặc “vệ sĩ”. Tiếng Hy Lạp dùng từ spekoulatōr, mượn từ tiếng La-tinh, chỉ một thành viên thuộc đội cận vệ của nhà cai trị; tại đây người ấy làm nhiệm vụ hành quyết.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθὺς
  choice: ngay lập tức
  rationale: Diễn đạt rõ sắc thái hành động tức thời, đồng thời giữ nét kể chuyện đặc trưng của Mác bằng tiếng Việt hiện đại.
- source_word: βασιλεὺς
  choice: vua
  rationale: Giữ nguyên cách tác giả gọi Hê-rốt là βασιλεύς, không điều chỉnh theo tước hiệu lịch sử chính xác hơn là tiểu vương.
- source_word: σπεκουλάτορα
  choice: một lính cận vệ
  rationale: Từ vay mượn tiếng La-tinh chỉ một thành viên thuộc đội cận vệ của nhà cai trị; trong ngữ cảnh này người ấy thi hành việc xử tử. Bản dịch giữ chức danh cơ bản, còn chú thích giải thích chức năng trong câu chuyện.
- source_word: ἐπέταξεν ἐνέγκαι
  choice: truyền cho người ấy đem ... đến
  rationale: Thể hiện tự nhiên sức nặng của mệnh lệnh trong cấu trúc động từ kèm nguyên mẫu.
- source_word: τὴν κεφαλὴν αὐτοῦ
  choice: đầu Giăng
  rationale: Đại từ Hy Lạp quy chiếu về Giăng trong ngữ cảnh. Nêu tên giúp câu tiếng Việt tránh khả năng bị hiểu nhầm là đầu của người lính vừa được nhắc đến.
- source_word: ἀπεκεφάλισεν
  choice: chém đầu
  rationale: Tương đương rõ ràng, tự nhiên và trang nghiêm với động từ chỉ việc xử tử bằng cách chặt đầu.
- source_word: ἐν τῇ φυλακῇ
  choice: đi vào ngục
  rationale: Kết hợp địa điểm với động từ đi để tạo câu tiếng Việt tự nhiên; vẫn xác định nhà ngục là nơi người lính đến và chém đầu Giăng.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện hiện đại, rõ ràng và trang nghiêm. Cấu trúc hai câu giữ nhịp hành động nhanh của nguyên văn; tên Giăng được dùng thay đại từ ở hai chỗ để bảo đảm quy chiếu tự nhiên trong tiếng Việt.
