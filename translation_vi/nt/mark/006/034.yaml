  text: καὶ ἐξελθὼν ⸀εἶδεν πολὺν ὄχλον, καὶ ἐσπλαγχνίσθη ἐπ’ ⸀αὐτοὺς ὅτι ἦσαν ὡς πρόβατα μὴ ἔχοντα ποιμένα, καὶ ἤρξατο διδάσκειν αὐτοὺς πολλά.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/034.yaml
  text: And when he went ashore[a], he saw a large crowd, and he had compassion on them, because they were like sheep without a shepherd[b]. And he began to teach them many things.
translation:
  language: vi
  text: Khi lên bờ, Đức Giê-su thấy một đám đông lớn; Ngài động lòng thương xót họ, vì họ như chiên không có người chăn. Ngài bắt đầu dạy họ nhiều điều.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξελθὼν
  choice: khi lên bờ
  rationale: Theo ngữ cảnh Đức Chúa Jêsus vừa đi thuyền (Mác 6:32–33), phân từ này tự nhiên chỉ việc Ngài ra khỏi thuyền và lên bờ; cách dịch này rõ nghĩa mà không diễn giải quá mức.
- source_word: εἶδεν πολὺν ὄχλον
  choice: thấy một đoàn dân đông
  rationale: Diễn đạt trực tiếp động từ 'thấy' và quy mô lớn của đám đông bằng tiếng Việt tự nhiên.
- source_word: ἐσπλαγχνίσθη ἐπ’ αὐτοὺς
  choice: động lòng thương xót họ
  rationale: Động từ diễn tả lòng thương xót sâu xa; cụm từ này vừa trang trọng vừa quen thuộc, đồng thời giữ sắc thái nội tâm mạnh của nguyên ngữ.
- source_word: ὅτι ἦσαν ὡς πρόβατα μὴ ἔχοντα ποιμένα
  choice: vì họ như chiên không có người chăn
  rationale: Giữ nguyên quan hệ nguyên nhân và hình ảnh người chăn–bầy chiên, không diễn giải thành sự thiếu lãnh đạo thuộc linh.
- source_word: ἤρξατο διδάσκειν αὐτοὺς πολλά
  choice: Ngài bắt đầu dạy họ nhiều điều
  rationale: Giữ ý khởi đầu của cấu trúc ἤρξατο διδάσκειν và hiểu πολλά theo nghĩa nội dung gồm nhiều điều.
theological_decisions:
- issue: Hình ảnh bầy chiên thiếu người chăn
  choice: Giữ nguyên ẩn dụ 'như chiên không có người chăn'.
  alternative: Diễn giải là 'như dân chúng không có người lãnh đạo thuộc linh'.
  rationale: Nguyên văn gợi lại ngôn ngữ Kinh Thánh về dân thiếu sự lãnh đạo trung tín, nhưng bản văn chính nên bảo toàn hình ảnh và độ mở thần học thay vì giải nghĩa ngay trong câu.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng 'Đức Chúa Jêsus/Ngài' để xác định chủ thể theo ngữ cảnh. Không đặt chú thích [a] vì ghi chú tiếng Anh tương ứng không phù hợp với vị trí dấu chú thích sau 'went ashore' và nội dung của nó thực ra là một phương án dịch cho ἐσπλαγχνίσθη, vốn đã được dịch rõ trong câu.
