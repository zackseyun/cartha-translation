    text: Hình ảnh “chiên không có người chăn” gợi lại mô-típ Kinh Thánh về dân không có người chăn; xem Dân số 27:17; 1 Các Vua 22:17; Ê-xê-chi-ên 34:5.
    reason: cross_reference
