translation:
  language: vi
  text: nhưng hãy đi dép, và đừng mặc vào hai áo trong.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “đừng mặc hai áo trong.” Động từ Hy Lạp có thể nhấn vào hành động mặc vào hoặc được hiểu là tình trạng đang mặc; bản văn chính giữ sắc thái hành động rõ hơn.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: nhưng
  rationale: Diễn tả sự tương phản với những chỉ dẫn lên đường ở câu trước bằng một liên từ ngắn gọn, tự nhiên.
- source_word: ὑποδεδεμένους
  choice: hãy mang
  rationale: Phân từ hoàn thành mang chức năng mệnh lệnh, chỉ trạng thái chân đã được mang dép; “hãy mang” là cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: σανδάλια
  choice: dép
  rationale: Chỉ loại dép có quai thời cổ; “dép” là từ phổ thông, chính xác về chức năng và không cần diễn giải dài dòng.
- source_word: μὴ ἐνδύσησθε
  choice: đừng mặc vào
  rationale: Cấu trúc cấm đoán với động từ trung gian aorist nhấn vào hành động tự mặc áo; “mặc vào” giữ sắc thái hành động rõ hơn “mặc” đơn thuần.
- source_word: δύο
  choice: hai
  rationale: Giữ nguyên số từ của nguyên văn.
- source_word: χιτῶνας
  choice: áo trong
  rationale: χίτων là áo cơ bản mặc sát hoặc gần thân thể; “áo trong” dễ hiểu và chính xác hơn từ chung “áo”, đồng thời tránh sắc thái xa lạ của “áo chiton”.
