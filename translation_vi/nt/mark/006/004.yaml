review_pass:
  verdict: revise
  source_fidelity: Cần chỉnh cụm “không bị khinh thường.” ἄτιμος nghĩa là “không được tôn trọng/không có danh dự”; “khinh thường” mạnh hơn và chuyển trọng tâm sang thái độ khinh miệt. Cấu trúc châm ngôn phủ định với ngoại lệ được giữ tốt hơn bằng “Nhà tiên tri nào cũng được tôn trọng, ngoại trừ ...”. “trong nhà mình” giữ được độ mở của οἰκίᾳ (nhà/hộ gia đình) tốt hơn “trong gia đình mình”.
  naturalness: 'Bản sửa dùng tiếng Việt hiện đại, tự nhiên và vẫn giữ nhịp liệt kê ba phạm vi: quê hương, bà con, nhà. “Nhà tiên tri nào cũng được tôn trọng” là lối diễn đạt châm ngôn rõ ràng, tránh phủ định kép nặng nề.'
  terminology: “Đức Giê-su,” “nhà tiên tri,” “quê hương,” và “bà con” phù hợp văn phong Kinh Thánh tiếng Việt hiện đại. “Nhà mình” ở chú thích nêu rõ có thể hiểu là ngôi nhà hoặc hộ gia đình, không áp đặt một nghĩa duy nhất của οἰκία.
  issues:
  - severity: medium
    issue: “không bị khinh thường” dịch ἄτιμος quá mạnh và kém chính xác về trường nghĩa.
    rationale: ἄτιμος nói đến việc không được tôn trọng/không có danh dự, không nhất thiết hàm ý bị khinh miệt. Bản sửa bảo toàn đối lập danh dự–thiếu tôn trọng của nguyên văn.
  - severity: low
    issue: “gia đình mình” thu hẹp nghĩa của οἰκίᾳ.
    rationale: οἰκία có thể chỉ ngôi nhà hoặc hộ gia đình. “trong nhà mình” bảo toàn sự mơ hồ từ vựng, với chú thích giải thích các khả năng.
