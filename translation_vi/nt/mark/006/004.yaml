revisions:
- from: 'Đức Giê-su nói với họ: “Nhà tiên tri không bị khinh thường, ngoại trừ tại quê hương mình[a], giữa bà con mình[b] và trong gia đình mình[c].”'
  to: 'Đức Giê-su nói với họ: “Nhà tiên tri nào cũng được tôn trọng, ngoại trừ tại quê hương mình[a], giữa bà con mình[b] và trong nhà mình[c].”'
  rationale: Sửa cụm chỉ sự thiếu danh dự để phản ánh chính xác ἄτιμος mà không tăng sắc thái thành sự khinh miệt. Đồng thời đổi “gia đình mình” thành “nhà mình” để không giải quyết trước sự mơ hồ có chủ ý của οἰκία. Các giới từ và ba vòng quan hệ trong câu Hy Lạp vẫn được giữ nguyên về ý nghĩa.
