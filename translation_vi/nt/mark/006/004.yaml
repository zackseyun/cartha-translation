source:
  edition: SBLGNT
  text: ⸂καὶ ἔλεγεν⸃ αὐτοῖς ὁ Ἰησοῦς ὅτι Οὐκ ἔστιν προφήτης ἄτιμος εἰ μὴ ἐν τῇ πατρίδι αὐτοῦ καὶ ἐν τοῖς ⸂συγγενεῦσιν αὐτοῦ⸃ καὶ ἐν τῇ οἰκίᾳ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/004.yaml
  text: And Jesus was saying to them[c][b][a], “A prophet is not without honor except in his hometown and among his relatives and in his household.”
translation:
  language: vi
  text: 'Đức Giê-su nói với họ: “Nhà tiên tri nào cũng được tôn trọng, ngoại trừ tại quê hương mình[a], giữa bà con mình[b] và trong nhà mình[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “quê quán” hoặc “nơi xuất thân.” Từ Hy Lạp πατρίς chỉ nơi xuất thân của một người; tại đây, ngữ cảnh nói đến Na-xa-rét.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “họ hàng” hoặc “người thân.” Từ Hy Lạp chỉ những người thuộc cùng một nhóm thân tộc.
    reason: lexical_alternative
  - marker: c
    text: Cũng có thể dịch là “gia đình mình” hoặc “hộ gia đình mình.” Từ Hy Lạp có thể chỉ ngôi nhà vật chất hoặc những người trong hộ gia đình; “nhà mình” giữ được cả hai khả năng.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: nói
  rationale: Thì chưa hoàn thành mô tả lời Đức Giê-su đang nói trong diễn tiến câu chuyện. Tiếng Việt thường dùng động từ “nói” mà không đánh dấu riêng thể tiếp diễn; cách dịch này tự nhiên và không hàm ý rằng lời ấy chỉ được nói một lần.
- source_word: προφήτης
  choice: nhà tiên tri
  rationale: Thuật ngữ thông dụng, chính xác và dễ hiểu trong tiếng Việt hiện đại.
- source_word: ἄτιμος
  choice: bị khinh thường
  rationale: Diễn đạt trạng thái không được dành cho sự tôn trọng vốn có, đồng thời giữ sắc thái danh dự–sỉ nhục của câu nói. Cách phủ định “không bị khinh thường” bám sát cấu trúc Hy Lạp.
- source_word: εἰ μὴ
  choice: ngoại trừ
  rationale: Trong mệnh đề phủ định này, cụm từ nêu trường hợp ngoại lệ chứ không diễn tả điều kiện.
- source_word: πατρίδι
  choice: quê hương
  rationale: πατρίς chỉ nơi xuất thân của một người; trong bối cảnh Na-xa-rét, “quê hương” tự nhiên hơn “đất nước” và vẫn có thể chỉ địa phương quê quán.
- source_word: συγγενεῦσιν
  choice: bà con
  rationale: Chỉ những người cùng quan hệ họ hàng; “bà con” là cách nói hiện đại, tự nhiên và phân biệt được với phạm vi gia đình gần gũi hơn ở vế sau.
- source_word: οἰκίᾳ
  choice: gia đình
  rationale: οἰκία có thể chỉ ngôi nhà hoặc những người thuộc hộ gia đình. Trong chuỗi thu hẹp từ quê hương đến bà con rồi gia đình, nghĩa tập thể phù hợp hơn và tránh hiểu đơn thuần là một tòa nhà.
- source_word: καὶ ... καὶ ... καὶ
  choice: và ... giữa ... và trong
  rationale: Tiếng Việt không cần lặp “và” trước mọi thành phần như tiếng Hy Lạp; cấu trúc liệt kê vẫn giữ đầy đủ ba phạm vi và nhịp tăng tiến của câu.
theological_decisions:
- issue: Phạm vi câu châm ngôn của Đức Giê-su về danh dự dành cho nhà tiên tri
  choice: Dịch như một nhận định khái quát về nhà tiên tri đang được Đức Giê-su áp dụng trong bối cảnh của chính mình, không thêm lời giải thích về căn tính hay sự bị khước từ của ngài.
  alternative: Diễn giải rõ rằng Đức Giê-su tự nhận là Đấng Mê-si bị khước từ, hoặc biến câu này thành một nhận định chung về sự vô tín.
  rationale: Bản Hy Lạp chỉ ghi lời châm ngôn về việc nhà tiên tri bị khinh thường trong những môi trường quen thuộc. Bối cảnh áp dụng lời ấy cho Đức Giê-su, nhưng câu dịch không nên giải quyết thêm hàm ý thần học mà nguyên văn để mở.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Đức Giê-su” phù hợp lối gọi tôn kính quen thuộc; câu nói giữ dạng châm ngôn và cấu trúc phủ định của nguyên văn, trong khi các giới từ “tại,” “giữa,” và “trong” làm rõ ba vòng quan hệ ngày càng thu hẹp.
