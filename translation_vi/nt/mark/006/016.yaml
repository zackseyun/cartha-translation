  text: ἀκούσας δὲ ⸀ὁ Ἡρῴδης ⸀ἔλεγεν· Ὃν ἐγὼ ἀπεκεφάλισα Ἰωάννην, οὗτος ⸀ἠγέρθη.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/016.yaml
  text: But when Herod heard it[a], he said, “John, whom I beheaded[b], has been raised.”
translation:
  language: vi
  text: 'Nhưng khi Hê-rốt nghe chuyện ấy, ông nói[a]: “Giăng, người mà ta đã chém đầu—chính người ấy đã được làm cho sống lại[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “ông cứ nói,” phản ánh thì chưa hoàn thành của động từ Hy Lạp.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “đã sống lại.” Động từ Hy Lạp ở thể bị động, sát nghĩa là “đã được làm cho sống lại.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀκούσας
  choice: khi ... nghe chuyện ấy
  rationale: Phân từ bất định quá khứ được diễn đạt như một mệnh đề thời gian tự nhiên trong tiếng Việt. “Chuyện ấy” chỉ nội dung Hê-rốt vừa nghe từ ngữ cảnh.
- source_word: δὲ
  choice: Nhưng
  rationale: δέ đánh dấu bước chuyển nhẹ trong lời kể và phản ứng tương phản của Hê-rốt; “nhưng” phù hợp với mạch văn.
- source_word: ἔλεγεν
  choice: ông nói
  rationale: Thì chưa hoàn thành có thể hàm ý lời nói kéo dài hoặc lặp lại, nhưng “ông nói” tự nhiên trong văn kể tiếng Việt; sắc thái khả dĩ được giữ trong chú thích.
- source_word: Ὃν ἐγὼ ἀπεκεφάλισα Ἰωάννην
  choice: Giăng mà ta đã chém đầu
  rationale: Cách diễn đạt này giữ nguyên nghĩa cụ thể của ἀποκεφαλίζω và chuyển trật tự nhấn mạnh của tiếng Hy Lạp sang một cấu trúc tiếng Việt rõ ràng, tự nhiên.
- source_word: οὗτος
  choice: chính người ấy
  rationale: Đại từ chỉ định οὗτος có tính nhấn mạnh; “chính người ấy” giữ được lực nhấn mạnh rõ hơn nếu chỉ dùng “ông ấy” hay lược bỏ.
- source_word: ἠγέρθη
  choice: đã được làm cho sống lại
  rationale: Cách dịch này giữ thể bị động của động từ Hy Lạp và diễn tả việc trở lại từ cõi chết mà không chuyển thành một công thức chủ động.
theological_decisions:
- issue: Cách dịch ἠγέρθη trong ngôn ngữ về sự sống lại
  choice: đã được làm cho sống lại
  alternative: đã sống lại
  rationale: Bản Hy Lạp dùng thể bị động. Giữ thể bị động bảo tồn sự mơ hồ về tác nhân và không diễn giải quá mức kết luận đầy sợ hãi của Hê-rốt.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng các tên quen thuộc “Hê-rốt” và “Giăng”; đại từ “ông” trong lời kể và “ta” trong lời trực tiếp phù hợp địa vị vua chúa của Hê-rốt. Dấu gạch ngang giúp giữ cấu trúc nhấn mạnh của nguyên văn mà câu vẫn tự nhiên.
