  register: Bản dịch dùng tiếng Việt phổ thông, hiện đại và trang trọng vừa phải. Cấu trúc lặp “nhóm… nhóm…” giữ tính phân bổ và nhịp song song của câu Hy Lạp mà không tạo cảm giác dịch sát cứng nhắc.
