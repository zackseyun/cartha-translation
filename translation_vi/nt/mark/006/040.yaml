  text: And they reclined in groups of hundreds and of fifties[a].
translation:
  language: vi
  text: Họ ngồi xuống thành từng nhóm, nhóm một trăm người, nhóm năm mươi người.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “từng luống, từng luống”, gợi hình ảnh các nhóm được sắp xếp ngay ngắn như những luống trong vườn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέπεσαν
  choice: ngồi xuống
  rationale: Động từ ἀναπίπτω có thể chỉ việc ngả mình hoặc vào chỗ để dùng bữa. Trong tiếng Việt hiện đại, “ngồi xuống” tự nhiên và phù hợp với cảnh đám đông ở trên cỏ, dù sắc thái tư thế dùng bữa của nguyên ngữ nhẹ hơn.
- source_word: πρασιαὶ πρασιαὶ
  choice: thành từng nhóm
  rationale: Danh từ πρασιά theo nghĩa đen là luống hoặc khoảnh trồng cây; ở đây phép lặp diễn tả các nhóm được bố trí có trật tự. “Thành từng nhóm” truyền đạt rõ chức năng trong câu, còn hình ảnh nguyên ngữ được giữ trong chú thích.
- source_word: κατὰ ἑκατὸν
  choice: nhóm một trăm người
  rationale: κατά đi với số từ mang ý nghĩa phân bổ. Cách dịch này diễn đạt tự nhiên rằng có những nhóm gồm một trăm người.
- source_word: κατὰ πεντήκοντα
  choice: nhóm năm mươi người
  rationale: Cũng như vế trước, κατά biểu thị sự phân nhóm theo số lượng; cách diễn đạt song song giữ được nhịp gọn của nguyên văn.
theological_decisions: []
