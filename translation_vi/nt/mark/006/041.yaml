id: MRK.6.41
reference: Mark 6:41
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ λαβὼν τοὺς πέντε ἄρτους καὶ τοὺς δύο ἰχθύας ἀναβλέψας εἰς τὸν οὐρανὸν εὐλόγησεν καὶ κατέκλασεν τοὺς ἄρτους καὶ ἐδίδου τοῖς μαθηταῖς ⸀αὐτοῦ ἵνα ⸀παρατιθῶσιν αὐτοῖς, καὶ τοὺς δύο ἰχθύας ἐμέρισεν πᾶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/041.yaml
  text: And taking the five loaves and the two fish[a], looking up to heaven, he blessed and broke the loaves, and kept giving them to his disciples to set before them[b], and he divided the two fish among them all.
translation:
  language: vi
  text: Ngài cầm năm ổ bánh và hai con cá, ngước mắt lên trời, dâng lời chúc tụng[a], rồi bẻ bánh và tiếp tục trao cho các môn đồ để họ dọn ra trước mặt dân chúng; Ngài cũng chia hai con cá cho tất cả mọi người.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “tạ ơn.” Động từ Hy Lạp có nghĩa đen là “chúc tụng,” nhưng trong bối cảnh bữa ăn, nghĩa này có thể gần với việc dâng lời tạ ơn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λαβὼν
  choice: cầm
  rationale: Phân từ bất định mở đầu chuỗi hành động; “cầm” tự nhiên trong tiếng Việt và thể hiện việc Đức Giê-su nhận lấy bánh cùng cá.
- source_word: ἄρτους
  choice: ổ bánh
  rationale: Danh từ được đếm bằng số năm và trong bối cảnh này chỉ những ổ bánh riêng lẻ, không phải bánh nói chung.
- source_word: ἰχθύας
  choice: con cá
  rationale: Cách diễn đạt thông dụng, cụ thể cho hai con cá.
- source_word: ἀναβλέψας εἰς τὸν οὐρανὸν
  choice: ngước mắt lên trời
  rationale: Diễn đạt tự nhiên động tác nhìn lên và vẫn giữ sắc thái hướng về trời.
- source_word: εὐλόγησεν
  choice: dâng lời chúc tụng
  rationale: Giữ ý cốt lõi của εὐλογέω là chúc tụng/phúc chúc mà không thêm một tân ngữ trực tiếp vốn không có trong Hy Lạp; trong ngữ cảnh bữa ăn, hành động này cũng có thể được hiểu là tạ ơn.
- source_word: κατέκλασεν τοὺς ἄρτους
  choice: bẻ bánh
  rationale: Giữ hành động cụ thể và tân ngữ bánh; tiếng Việt không cần lặp lại “những ổ” ở đây.
- source_word: ἐδίδου
  choice: tiếp tục trao
  rationale: Thể chưa hoàn thành gợi hành động trao đi diễn tiến hoặc lặp lại trong lúc phân phát.
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: cho các môn đồ
  rationale: “Môn đồ” là cách gọi trang trọng, quen thuộc; đại từ sở hữu được lược theo lối Việt vì chủ thể và quan hệ đã rõ.
- source_word: ἵνα παρατιθῶσιν αὐτοῖς
  choice: để họ dọn ra trước mặt dân chúng
  rationale: Giữ nghĩa mục đích của ἵνα và hình ảnh cụ thể của παρατίθημι; nêu rõ “dân chúng” để tránh nhầm đại từ αὐτοῖς là các môn đồ.
- source_word: ἐμέρισεν πᾶσιν
  choice: chia ... cho tất cả mọi người
  rationale: Thể hiện trực tiếp việc phân chia cho toàn thể những người hiện diện.
theological_decisions:
- issue: Nghĩa của εὐλόγησεν trong bối cảnh dùng bữa
  choice: dâng lời chúc tụng
  alternative: tạ ơn; ban phước
  rationale: Động từ Hy Lạp là εὐλογέω, không phải εὐχαριστέω. “Dâng lời chúc tụng” giữ quan hệ từ vựng với ý chúc tụng và không mặc nhiên cho rằng bánh cá là tân ngữ trực tiếp; chú thích ghi nhận sắc thái tạ ơn trong ngữ cảnh bữa ăn.
- issue: Đối tượng của αὐτοῖς trong mệnh đề mục đích
  choice: dân chúng
  alternative: họ
  rationale: Theo mạch văn, các môn đồ nhận bánh để đặt trước dân chúng. Việc nêu rõ đối tượng tránh sự mơ hồ đại từ không tự nhiên trong tiếng Việt mà không thay đổi nội dung.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” theo mạch kể về Đức Giê-su; giữ nhịp chuỗi hành động của câu Hy Lạp, đồng thời tách các quan hệ đại từ cho rõ trong tiếng Việt.
