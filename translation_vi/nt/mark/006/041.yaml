  source_fidelity: 'Bản dịch theo sát chuỗi hành động trong tiếng Hy Lạp: cầm năm ổ bánh và hai con cá, ngước lên trời, εὐλόγησεν, bẻ bánh, liên tục trao cho các môn đồ nhằm đặt trước dân chúng, rồi chia cá cho mọi người. “Tiếp tục trao” phản ánh phù hợp sắc thái diễn tiến/lặp lại của ἐδίδου. Việc làm rõ αὐτοῖς là “dân chúng” phù hợp mạch văn và tránh mơ hồ đại từ.'
