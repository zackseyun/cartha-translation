source:
  edition: SBLGNT
  text: καὶ δαιμόνια πολλὰ ἐξέβαλλον, καὶ ἤλειφον ἐλαίῳ πολλοὺς ἀρρώστους καὶ ἐθεράπευον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/013.yaml
  text: And they were casting out many demons[a], and were anointing many sick people with oil and healing them.
translation:
  language: vi
  text: Họ đuổi nhiều quỷ ra, xức dầu[a] cho nhiều người bệnh và chữa lành họ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: dầu ô-liu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δαιμόνια πολλὰ
  choice: nhiều quỷ
  rationale: δαιμόνιον chỉ các tà linh hay quỷ; “quỷ” là cách diễn đạt trực tiếp, tự nhiên và không nhập cụm từ khác là “uế linh” vào câu này. πολλὰ mang nghĩa số lượng đơn giản là “nhiều”.
- source_word: ἐξέβαλλον
  choice: đuổi ... ra
  rationale: Động từ ở thì chưa hoàn thành mô tả hành động lặp lại hoặc diễn tiến trong phần tóm thuật. Tiếng Việt không bắt buộc đánh dấu thể bằng một phụ từ; “đuổi ... ra” tự nhiên và trong ngữ cảnh vẫn diễn đạt hoạt động được thực hiện nhiều lần.
- source_word: ἤλειφον ἐλαίῳ
  choice: xức dầu
  rationale: ἀλείφω có nghĩa xức, bôi hoặc thoa; ἔλαιον là dầu, thông thường là dầu ô-liu trong bối cảnh Địa Trung Hải cổ đại. “Xức dầu” vừa sát nghĩa vừa trang trọng, tự nhiên.
- source_word: πολλοὺς ἀρρώστους
  choice: nhiều người bệnh
  rationale: ἄρρωστος được dùng như danh từ để chỉ người đau ốm; “nhiều người bệnh” là cách diễn đạt hiện đại, rõ nghĩa.
- source_word: ἐθεράπευον
  choice: chữa lành họ
  rationale: θεραπεύω nghĩa là chữa trị hoặc chữa lành. “Chữa lành họ” liên kết rõ với những người bệnh vừa được nhắc đến và phù hợp văn phong Kinh Thánh hiện đại.
- source_word: καὶ
  choice: và
  rationale: Các liên từ καί nối những hành động trong một chuỗi tường thuật đơn giản; “và” bảo tồn cấu trúc phối hợp mà không thêm quan hệ nhân quả.
theological_decisions:
- issue: Vai trò của việc xức dầu đối với sự chữa lành
  choice: Tường thuật việc các môn đồ xức dầu và chữa lành, không xác định cơ chế thần học.
  alternative: Dầu tự nó tạo ra sự chữa lành; hoặc việc xức dầu hoàn toàn chỉ mang tính biểu tượng.
  rationale: Câu Hy Lạp đặt việc xức dầu và chữa lành cạnh nhau nhưng không nói dầu là nguyên nhân hữu hiệu, cũng không khẳng định dầu hoàn toàn không có vai trò. Bản dịch giữ nguyên sự dè dặt và căng thẳng thần học ấy.
translation_notes:
  register: Văn phong tiếng Việt tiêu chuẩn hiện đại, ngắn gọn, trang trọng và dễ hiểu. Không thêm phụ từ thể như “đang” vì đây là lời tóm thuật về các hành động lặp lại, và tiếng Việt tự nhiên có thể để ngữ cảnh truyền đạt sắc thái này. Không đặt chú thích vì ghi chú tiếng Anh gắn với “demons” nhưng nội dung lại nói về “olive oil”, rõ ràng là dấu chú thích bị lệch; bản dịch không tái tạo lỗi đó.
