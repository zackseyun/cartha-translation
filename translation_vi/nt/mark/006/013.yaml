  terminology: “Quỷ” là tương đương trực tiếp, thông dụng của δαιμόνια trong ngữ cảnh này; không nên thay bằng “uế linh,” vì từ ấy không xuất hiện trong nguyên văn. “Xức dầu” và “chữa lành” phù hợp với cách dùng Kinh Thánh tiếng Việt hiện đại. Cần gắn chú thích tùy chọn “dầu ô-liu” đúng vào từ “dầu”; ghi chú tiếng Anh trong hồ sơ bị neo nhầm vào “demons.”
