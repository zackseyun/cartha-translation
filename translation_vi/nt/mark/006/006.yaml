  to: Ngài kinh ngạc vì sự vô tín của họ.[a] Rồi Ngài đi khắp các làng chung quanh, vừa đi vừa giảng dạy.[b]
  rationale: Bản sửa làm rõ κύκλῳ như nét nghĩa về lộ trình/vùng đi lại mà không loại bỏ khả năng hiểu là các làng ở vùng chung quanh. Cụm “vừa đi vừa giảng dạy” phục hồi quan hệ đồng thời của διδάσκων. Không thêm diễn giải thần học nào về sự kinh ngạc của Ngài.
