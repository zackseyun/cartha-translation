  text: καὶ ⸀ἐθαύμαζεν διὰ τὴν ἀπιστίαν αὐτῶν. Καὶ περιῆγεν τὰς κώμας κύκλῳ διδάσκων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/006.yaml
  text: And he was amazed because of their unbelief[a]. And he went around among the villages[b], teaching.
translation:
  language: vi
  text: Ngài kinh ngạc vì sự vô tín của họ.[a] Rồi Ngài đi khắp các làng chung quanh, vừa đi vừa giảng dạy.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Ngài lấy làm lạ vì họ không tin.”'
    reason: lexical_alternative
  - marker: b
    text: 'Hoặc: “Ngài đi một vòng qua các làng”; cũng có thể hiểu là Ngài đi khắp các làng ở vùng chung quanh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐθαύμαζεν
  choice: kinh ngạc
  rationale: Động từ θαυμάζω diễn tả sự kinh ngạc; thì chưa hoàn thành đặt phản ứng này trong diễn tiến quá khứ. “Kinh ngạc” tự nhiên, rõ nghĩa và giữ nguyên sức nặng của lời kể.
- source_word: διὰ τὴν ἀπιστίαν αὐτῶν
  choice: vì sự vô tín của họ
  rationale: διά với đối cách chỉ nguyên nhân. ἀπιστία ở đây là không tin, chứ không chỉ là lòng tin yếu; “sự vô tín” giữ được sắc thái ấy trong văn phong Kinh Thánh hiện đại.
- source_word: περιῆγεν
  choice: đi khắp
  rationale: Thì chưa hoàn thành của περιάγω diễn tả việc liên tục đi từ nơi này sang nơi khác; “đi khắp” truyền đạt tự nhiên hoạt động lưu động này.
- source_word: τὰς κώμας
  choice: các làng
  rationale: κώμη chỉ làng hoặc khu dân cư nông thôn; “các làng” là cách dịch thông dụng và dễ hiểu.
- source_word: κύκλῳ
  choice: xung quanh
  rationale: Trạng từ κύκλῳ có thể chỉ vùng chung quanh hoặc chuyển động theo một vòng. “Các làng xung quanh” tự nhiên trong tiếng Việt, còn chú thích giữ lại khả năng hiểu là đi một vòng qua các làng.
- source_word: διδάσκων
  choice: và giảng dạy
  rationale: Phân từ hiện tại diễn tả hoạt động diễn ra đồng thời với việc đi lại. Dùng “và giảng dạy” tạo câu tiếng Việt tự nhiên mà vẫn cho thấy Ngài giảng dạy trong hành trình ấy.
theological_decisions:
- issue: Phản ứng của Chúa Giê-su trước sự vô tín có thể bị làm nhẹ đi nhằm tránh hàm ý về sự ngạc nhiên của Ngài
  choice: Ngài kinh ngạc vì sự vô tín của họ
  alternative: Ngài lấy làm lạ vì họ không tin
  rationale: Bản văn nói thẳng rằng Ngài kinh ngạc vì sự vô tín của họ. Bản dịch giữ nguyên sức căng thần học của lời kể, không thêm lời giải thích về bản tính hay tri thức của Chúa Giê-su.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “Ngài” theo ngữ cảnh chỉ Chúa Giê-su; “sự vô tín” giữ sắc thái mạnh của ἀπιστία, còn các chú thích trình bày những cách diễn đạt tự nhiên khác mà không giải quyết thay sự đa nghĩa của bản văn.
