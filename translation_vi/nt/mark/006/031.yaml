review_pass:
  verdict: revise
  source_fidelity: Bản dịch phản ánh đúng lời mời gọi đi riêng đến nơi vắng và nghỉ ít lâu. Tuy nhiên, đại từ “họ” ở mệnh đề cuối trong tiếng Việt dễ bị hiểu là “người đến kẻ đi”, trong khi chủ ngữ của εὐκαίρουν là các môn đồ được Chúa nói với ở đầu câu.
  naturalness: “Chính anh em hãy đi riêng đến” hơi gượng trong tiếng Việt hiện đại. “Anh em hãy đi riêng ra, đến...” tự nhiên hơn và vẫn giữ ý nhấn mạnh/tách riêng.
  terminology: “Nơi vắng vẻ,” “nghỉ ngơi một chút,” và cách xưng hô “Ngài/anh em” phù hợp văn phong trang trọng hiện đại. “Không có cả thời giờ để ăn” diễn đạt rõ ý οὐδὲ φαγεῖν εὐκαίρουν.
  issues:
  - severity: medium
    issue: Đại từ “họ” ở cuối câu mơ hồ về quy chiếu.
    rationale: Trong cấu trúc “Vì người đến kẻ đi quá đông, nên họ...”, “họ” có thể bị hiểu nhầm là những người đến và đi. Nguyên ngữ quy chiếu về nhóm môn đồ; cần nêu “anh em” để câu tiếng Việt rõ nghĩa.
  - severity: low
    issue: Cụm “Chính anh em hãy đi riêng đến” chưa thật tự nhiên.
    rationale: Trật tự này làm câu mệnh lệnh hơi nặng. Đảo thành “Anh em hãy đi riêng ra, đến...” tự nhiên hơn, đồng thời bảo toàn sắc thái đi tách riêng.
