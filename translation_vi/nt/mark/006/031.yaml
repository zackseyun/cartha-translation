- from: 'Ngài nói với họ: “Chính anh em hãy đi riêng đến một nơi vắng vẻ[a] và nghỉ ngơi một chút.” Vì người đến kẻ đi quá đông, nên họ thậm chí không có dịp để ăn[b].'
  to: 'Ngài nói với họ: “Anh em hãy đi riêng ra, đến một nơi vắng vẻ[a] và nghỉ ngơi một chút.” Vì người đến kẻ đi rất đông, đến nỗi anh em không có cả thời giờ để ăn[b].'
  rationale: Bản sửa làm rõ rằng các môn đồ, không phải dòng người đến và đi, là những người không có thời giờ ăn. Cũng điều chỉnh trật tự từ cho tự nhiên hơn trong tiếng Việt, không thay đổi ý nghĩa hay mức độ nhấn mạnh của nguyên ngữ. Chú thích b được chỉnh quy chiếu đại từ cho nhất quán với câu dịch.
