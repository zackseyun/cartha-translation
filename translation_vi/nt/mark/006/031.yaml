source:
  edition: SBLGNT
  text: καὶ ⸀λέγει αὐτοῖς· Δεῦτε ὑμεῖς αὐτοὶ κατ’ ἰδίαν εἰς ἔρημον τόπον καὶ ⸀ἀναπαύσασθε ὀλίγον. ἦσαν γὰρ οἱ ἐρχόμενοι καὶ οἱ ὑπάγοντες πολλοί, καὶ οὐδὲ φαγεῖν εὐκαίρουν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/031.yaml
  text: And he said to them[a], “Come away by yourselves to a desolate place and rest a little.” For many were coming and going[b], and they did not even have an opportunity to eat.
translation:
  language: vi
  text: 'Ngài nói với họ: “Anh em hãy đi riêng ra, đến một nơi vắng vẻ[a] và nghỉ ngơi một chút.” Vì người đến kẻ đi rất đông, đến nỗi anh em không có cả thời giờ để ăn[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “một nơi hoang vắng” hoặc “một nơi hẻo lánh.” Từ Hy Lạp chỉ một địa điểm biệt lập hoặc không có người ở, không nhất thiết là sa mạc theo nghĩa hiện đại.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “anh em thậm chí không có dịp để ăn.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: Ngài nói
  rationale: Dùng thì kể chuyện tự nhiên trong tiếng Việt cho hiện tại lịch sử của tiếng Hy Lạp; “Ngài” chỉ Chúa Giê-su một cách trang trọng theo ngữ cảnh.
- source_word: Δεῦτε
  choice: hãy đi
  rationale: Mệnh lệnh mang tính mời gọi họ rời đám đông; “hãy đi” tự nhiên khi kết hợp với đích đến ở sau.
- source_word: ὑμεῖς αὐτοὶ / κατ’ ἰδίαν
  choice: Chính anh em hãy đi riêng
  rationale: “Chính anh em” giữ sắc thái nhấn mạnh của đại từ, còn “đi riêng” diễn đạt việc tách khỏi đám đông mà không lặp ý nặng nề.
- source_word: ἔρημον τόπον
  choice: một nơi vắng vẻ
  rationale: Chỉ một địa điểm biệt lập hoặc không có người ở, không nhất thiết là sa mạc; cách nói này rõ ràng và tự nhiên trong tiếng Việt hiện đại.
- source_word: ἀναπαύσασθε ὀλίγον
  choice: nghỉ ngơi một chút
  rationale: Diễn đạt việc tạm ngừng công việc để hồi sức trong một khoảng thời gian ngắn.
- source_word: οἱ ἐρχόμενοι καὶ οἱ ὑπάγοντες πολλοί
  choice: người đến kẻ đi quá đông
  rationale: Thành ngữ tiếng Việt tự nhiên, thể hiện dòng người liên tục đến rồi đi và số lượng đông.
- source_word: οὐδὲ φαγεῖν εὐκαίρουν
  choice: họ thậm chí không có dịp để ăn
  rationale: “Có dịp” phản ánh khá sát ý có cơ hội hoặc thời giờ thuận tiện của εὐκαιρέω; “thậm chí” thể hiện οὐδέ.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Anh em” là cách xưng hô tự nhiên với nhóm môn đồ; câu văn giữ sự nhấn mạnh vào việc họ tách riêng khỏi đám đông. Đại từ “họ” ở mệnh đề cuối không xác định thêm đối tượng, nhằm giữ cách diễn đạt không nêu chủ thể minh nhiên của nguyên văn.
