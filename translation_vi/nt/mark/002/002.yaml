source:
  edition: SBLGNT
  text: ⸀καὶ συνήχθησαν πολλοὶ ὥστε μηκέτι χωρεῖν μηδὲ τὰ πρὸς τὴν θύραν, καὶ ἐλάλει αὐτοῖς τὸν λόγον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/002.yaml
  text: And many were gathered together[a], so that there was no longer room, not even at the door, and he was speaking the word to them.
translation:
  language: vi
  text: Nhiều người tụ họp lại, đến nỗi không còn chỗ nào, kể cả gần cửa; và Ngài đang nói lời[a] với họ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “sứ điệp.” Tiếng Hy Lạp là “lời.”
    reason: lexical_alternative
lexical_decisions:
- source_word: συνήχθησαν πολλοὶ
  choice: Nhiều người tụ họp lại
  rationale: Diễn đạt tự nhiên động từ thụ động aorist cùng ý nghĩa hội tụ của tiền tố συν-, đồng thời giữ πολλοί như một tính từ được dùng như danh từ.
- source_word: ὥστε μηκέτι χωρεῖν
  choice: đến nỗi không còn chỗ
  rationale: Giữ quan hệ kết quả của ὥστε và ý không còn sức chứa của χωρεῖν bằng cách nói tự nhiên trong tiếng Việt.
- source_word: μηδὲ τὰ πρὸς τὴν θύραν
  choice: ngay cả khu vực gần cửa cũng chật kín
  rationale: τὰ πρὸς τὴν θύραν chỉ khu vực hướng về hoặc gần cửa; thêm 'chật kín' làm rõ rằng khu vực ấy cũng không còn chỗ, vốn đã hàm ý trong cấu trúc Hy Lạp.
- source_word: ἐλάλει
  choice: đang giảng
  rationale: Thì chưa hoàn thành chỉ hành động đang tiếp diễn. Trong ngữ cảnh này, 'giảng' diễn đạt việc truyền đạt sứ điệp, dù 'đang nói' là cách sát hình thức hơn.
- source_word: αὐτοῖς
  choice: cho họ
  rationale: Giữ nguyên đại từ chỉ những người đang tụ họp, không xác định thêm ngoài văn bản.
- source_word: τὸν λόγον
  choice: lời
  rationale: '''Lời'' giữ gần danh từ λόγος và không thêm thành tố ''của Đức Chúa Trời'' vốn không có trong câu; ''sứ điệp'' là một khả năng dịch theo nghĩa.'
theological_decisions:
- issue: Ý nghĩa của τὸν λόγον trong lời giảng của Đức Chúa Jêsus
  choice: lời
  alternative: sứ điệp; lời Đức Chúa Trời
  rationale: Bản dịch giữ cách diễn đạt của nguyên văn và không bổ sung 'của Đức Chúa Trời'; chú thích nêu nghĩa khả dĩ là 'sứ điệp'.
- issue: Chủ ngữ ẩn của ἐλάλει
  choice: Đức Chúa Jêsus
  alternative: Ngài
  rationale: Chủ ngữ được xác định từ ngữ cảnh trước; nêu tên giúp câu tiếng Việt rõ ràng mà không thay đổi sở chỉ.
translation_notes:
  register: 'Tiếng Việt hiện đại, trang trọng và dễ hiểu. Cấu trúc câu giữ diễn tiến của nguyên văn: đám đông tụ họp, hệ quả là hết chỗ, rồi hành động đang tiếp diễn của Đức Chúa Jêsus.'
