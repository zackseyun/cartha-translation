id: MRK.2.16
reference: Mark 2:16
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ οἱ γραμματεῖς ⸂τῶν Φαρισαίων⸃ ⸀ἰδόντες ⸂ὅτι ἐσθίει⸃ μετὰ τῶν ⸂ἁμαρτωλῶν καὶ τελωνῶν⸃ ἔλεγον τοῖς μαθηταῖς αὐτοῦ· ⸀Ὅτι μετὰ τῶν ⸂τελωνῶν καὶ ἁμαρτωλῶν⸃ ⸀ἐσθίει;
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/016.yaml
  text: And the scribes of the Pharisees[a], seeing that he was eating with sinners and tax collectors, were saying to his disciples, “Why does he eat with tax collectors and sinners?”
translation:
  language: vi
  text: 'Các kinh sư thuộc nhóm Pha-ri-si[a], khi thấy Đức Chúa Jêsus đang ăn cùng những người tội lỗi và những người thu thuế, thì nói với các môn đồ Ngài: “Tại sao Ngài lại ăn cùng những người thu thuế và những người tội lỗi?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cụm Hy Lạp cũng có thể hiểu là “các kinh sư là người Pha-ri-si” hoặc “các kinh sư của người Pha-ri-si.”
    reason: Giữ sự mơ hồ thật có của sở hữu cách τῶν Φαρισαίων về quan hệ giữa các kinh sư và nhóm Pha-ri-si.
lexical_decisions:
- source_word: γραμματεῖς
  choice: các kinh sư
  rationale: Cách gọi quen thuộc trong ngữ cảnh Tin Lành, chỉ những người chuyên về Kinh Thánh và luật pháp mà không diễn giải quá mức chức năng của họ.
- source_word: τῶν Φαρισαίων
  choice: thuộc nhóm Pha-ri-si
  rationale: Diễn đạt tự nhiên quan hệ thuộc về hoặc liên kết trong sở hữu cách Hy Lạp, đồng thời không buộc câu phải có nghĩa tất cả họ đều là người Pha-ri-si.
- source_word: ἰδόντες
  choice: khi thấy
  rationale: Thể hiện tự nhiên ý nghĩa hoàn cảnh-thời gian của phân từ bất định trong mạch kể.
- source_word: ὅτι ἐσθίει
  choice: Đức Chúa Jêsus đang ăn
  rationale: Dùng 'đang ăn' để giữ nét tiếp diễn của thì vị hoàn thành; bổ sung danh xưng thay cho đại từ giúp câu tiếng Việt rõ chủ thể trong ngữ cảnh câu đứng riêng.
- source_word: μετά
  choice: cùng
  rationale: Diễn đạt trực tiếp sự đồng hành và việc cùng bàn ăn, không đưa phần hàm ý xã hội vào chính văn.
- source_word: ἁμαρτωλῶν
  choice: những người tội lỗi
  rationale: Giữ nguyên sức nặng của nhãn gọi mang tính xã hội-tôn giáo trong nguyên văn, không làm nhẹ thành một cách nói mơ hồ hơn.
- source_word: τελωνῶν
  choice: những người thu thuế
  rationale: Cách gọi thông dụng, chính xác và dễ hiểu đối với nhóm người bị khinh miệt trong bối cảnh các sách Tin Lành.
- source_word: ἔλεγον
  choice: thì nói
  rationale: Tiếng Việt không tự nhiên nếu cố biểu đạt hình thái tiếp diễn bằng 'đang nói' ở đây; 'thì nói' giữ trình tự kể chuyện mà không khẳng định quá mức rằng lời này được lặp đi lặp lại.
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: với các môn đồ Ngài
  rationale: '''Môn đồ'' giữ mối quan hệ chính thức giữa thầy và người học theo; ''Ngài'' phù hợp văn phong Kinh Thánh trang trọng hiện đại.'
- source_word: Ὅτι
  choice: Tại sao
  rationale: Trong câu hỏi mang ý phản đối này, ὅτι được chuyển thành câu hỏi nguyên nhân tự nhiên trong tiếng Việt.
- source_word: ἐσθίει
  choice: lại ăn
  rationale: Tiểu từ 'lại' truyền đạt tự nhiên sắc thái phản đối/ngạc nhiên của câu hỏi; động từ đơn 'ăn' vẫn giữ cách nói cơ bản của nguyên văn.
theological_decisions:
- issue: Ý nghĩa xã hội-tôn giáo của việc cùng bàn ăn
  choice: Giữ cách nói trực tiếp 'ăn cùng những người thu thuế và những người tội lỗi'.
  alternative: Diễn ý thành 'dùng bữa chung' hoặc 'giao hảo trong bữa ăn'.
  rationale: Nguyên văn dùng động từ thông thường 'ăn' với giới từ 'cùng'; cách dịch này để chính câu chuyện bộc lộ ý nghĩa về sự thông công và sự vượt qua ranh giới xã hội, thay vì giải thích ngay trong chính văn.
- issue: Quan hệ của các kinh sư với người Pha-ri-si
  choice: Dịch 'các kinh sư thuộc nhóm Pha-ri-si' và ghi chú khả năng hiểu khác.
  alternative: Dịch 'các kinh sư là người Pha-ri-si' hoặc 'các kinh sư của người Pha-ri-si'.
  rationale: Sở hữu cách τῶν Φαρισαίων có thể chỉ sự thuộc về hoặc liên kết; không nên âm thầm thu hẹp thành một quan hệ duy nhất.
translation_notes:
  register: Văn phong tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng 'kinh sư', 'Pha-ri-si', 'môn đồ' và 'người thu thuế' theo thuật ngữ Kinh Thánh quen thuộc. Chính văn giữ nhịp kể tự nhiên; chú thích chỉ giải thích điểm mơ hồ cú pháp thật sự, không thêm giáo lý hệ phái.
