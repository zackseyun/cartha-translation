  verdict: approve
  source_fidelity: 'Bản dịch chuyển đạt đúng các thành tố chính của câu Hy Lạp: các kinh sư có liên hệ với người Pha-ri-si, việc họ thấy Chúa Giê-su đang ăn cùng những người bị gọi là tội lỗi và người thu thuế, và câu chất vấn gửi đến các môn đồ của Ngài. “Khi thấy” phản ánh tự nhiên phân từ ἰδόντες; “đang ăn” phản ánh thích đáng sắc thái diễn tiến của ἐσθίει trong phần trần thuật; “Tại sao” diễn đạt đúng lực nghi vấn của ὅτι trong câu hỏi. Bản dịch không diễn giải quá mức hàm ý thông công bàn ăn.'
  naturalness: Câu tiếng Việt rõ ràng, trang trọng và vẫn tự nhiên trong văn phong Kinh Thánh hiện đại. “Kinh sư,” “Pha-ri-si,” “môn đồ,” và “người thu thuế” là các thuật ngữ quen dùng, dễ nhận biết. Cấu trúc “khi thấy …, thì nói với …” mạch lạc và không cần sửa.
  terminology: “Các kinh sư” là tương đương phù hợp cho γραμματεῖς; “thuộc nhóm Pha-ri-si” biểu đạt thận trọng quan hệ được nêu bởi τῶν Φαρισαίων, không áp đặt một cách hiểu hẹp. “Những người tội lỗi” giữ được tính chất nhãn gọi xã hội-tôn giáo của ἁμαρτωλῶν. Chú thích tại [a] được neo đúng chỗ và giải thích một khả năng cú pháp thực sự mà không đưa diễn giải giáo phái vào chính văn.
