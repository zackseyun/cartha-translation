- from: “Tại sao người này lại nói như vậy?[a] Ông ta đang nói phạm thượng! Ngoài một mình Đức Chúa Trời ra, ai có thể tha tội được?”[b]
  to: “Tại sao người này lại nói như vậy?[a] Người này đang phạm thượng! Ngoài một mình Đức Chúa Trời ra, ai có thể tha tội được?”[b]
  rationale: Đổi “Ông ta đang nói phạm thượng” thành “Người này đang phạm thượng” để dịch trực tiếp, tự nhiên động từ βλασφημεῖ và duy trì sắc thái xa cách của οὗτος. Sửa chú thích a để không gọi một cách diễn giải về mục đích là bản dịch sát chữ. Giữ nguyên tính độc quyền của εἰ μὴ εἷς ὁ θεός và không áp đặt diễn giải thần học vượt quá lời buộc tội trong trình thuật.
