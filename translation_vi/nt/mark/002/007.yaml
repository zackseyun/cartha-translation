  text: Τί οὗτος οὕτως λαλεῖ; ⸀βλασφημεῖ· τίς δύναται ἀφιέναι ἁμαρτίας εἰ μὴ εἷς ὁ θεός;
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/007.yaml
  text: Why does this man speak like this? He is blaspheming! Who can forgive sins except God alone?[a][b]
translation:
  language: vi
  text: “Tại sao người này lại nói như vậy?[a] Người này đang phạm thượng! Ngoài một mình Đức Chúa Trời ra, ai có thể tha tội được?”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát chữ: “Người này nói gì như vậy?” Đây là một thành ngữ Hy Lạp có nghĩa là: “Tại sao người này lại nói như vậy?”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “ngoài Đức Chúa Trời duy nhất.”'
    reason: alternative_reading
lexical_decisions:
- source_word: Τί ... λαλεῖ
  choice: Tại sao ... lại nói
  rationale: Trong thành ngữ này, Τί hỏi về lý do hoặc căn cứ của lời nói, nên “Tại sao” tự nhiên và đúng nghĩa hơn cách dịch từng chữ là “Điều gì”.
- source_word: οὗτος
  choice: người này
  rationale: Cách gọi này giữ được sắc thái xa cách của các kinh sư đối với Đức Giê-su mà không thêm mức độ khinh miệt quá rõ như “tên này”.
- source_word: οὕτως
  choice: như vậy
  rationale: Diễn đạt tự nhiên cách thức hoặc nội dung lời Đức Giê-su vừa nói.
- source_word: βλασφημεῖ
  choice: đang nói phạm thượng
  rationale: “Phạm thượng” giữ nguyên sức nặng tôn giáo của lời cáo buộc; “đang nói” phản ánh hành động hiện thời mà các kinh sư cho là phạm thượng.
- source_word: τίς δύναται
  choice: ai có thể
  rationale: Cách diễn đạt tự nhiên trong tiếng Việt cho câu hỏi về khả năng hoặc thẩm quyền.
- source_word: ἀφιέναι ἁμαρτίας
  choice: tha tội
  rationale: Trong ngữ cảnh này, ἀφίημι đi với ἁμαρτίας mang nghĩa đã xác lập là tha thứ tội lỗi.
- source_word: εἰ μὴ εἷς ὁ θεός
  choice: ngoài một mình Đức Chúa Trời ra
  rationale: Cách diễn đạt này truyền đạt tự nhiên ý loại trừ và tính duy nhất, đồng thời không biến câu thành một lời giải thích thần học dài hơn nguyên văn.
theological_decisions:
- issue: Mức độ khinh miệt trong οὗτος
  choice: người này
  alternative: tên này; người đó
  rationale: “Người này” giữ sắc thái xa cách và chống đối nhưng không tăng thêm lời miệt thị ngoài điều tiếng Hy Lạp đòi hỏi.
- issue: Sức nặng của βλασφημεῖ
  choice: đang nói phạm thượng
  alternative: đang xúc phạm Đức Chúa Trời; lời ấy là phạm thượng
  rationale: Bản dịch giữ nguyên lời phán xét thần học của các kinh sư nhưng không tự giải quyết căng thẳng Kitô học mà trình thuật đang triển khai.
- issue: Cách hiểu εἷς ὁ θεός
  choice: một mình Đức Chúa Trời
  alternative: Đức Chúa Trời duy nhất
  rationale: Cách chính văn nhấn mạnh rằng không ai khác ngoài Đức Chúa Trời có thể tha tội; chú thích bảo lưu khả năng diễn đạt cụm từ theo hướng “Đức Chúa Trời duy nhất”.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Người này” và “ông ta” thể hiện khoảng cách của người nói mà không thêm sự khinh miệt quá mức. Dấu hỏi và dấu chấm than giữ nhịp điệu chất vấn, cáo buộc của nguyên văn.
