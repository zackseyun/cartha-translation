  text: καὶ οἱ Φαρισαῖοι ἔλεγον αὐτῷ· Ἴδε τί ⸀ποιοῦσιν τοῖς σάββασιν ὃ οὐκ ἔξεστιν;
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/024.yaml
  text: And the Pharisees were saying to him[a], “Look, why are they doing what is not permitted on the Sabbath?”
translation:
  language: vi
  text: 'Những người Pha-ri-si nói với Đức Giê-su: “Kìa, tại sao họ làm điều không được phép trong ngày Sa-bát?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Kìa, trong ngày Sa-bát họ đang làm điều gì không được phép vậy?” Từ Hy Lạp τί có thể hiểu là “điều gì”, dù trong ngữ cảnh này nghĩa “tại sao” có khả năng phù hợp hơn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: (không dịch riêng)
  rationale: Liên từ nối tiếp diễn biến; trong tiếng Việt, lược bỏ ở đầu câu giúp lời kể tự nhiên mà không làm mất quan hệ mạch văn.
- source_word: οἱ Φαρισαῖοι
  choice: những người Pha-ri-si
  rationale: Cách phiên âm quen thuộc trong tiếng Việt; thêm “những người” để chỉ rõ nhóm người.
- source_word: ἔλεγον
  choice: nói
  rationale: Thì vị hoàn thành diễn tả lời nói đang diễn ra hoặc có thể lặp lại; tiếng Việt không bắt buộc đánh dấu thể này, và “nói” tự nhiên hơn “đang nói” trong ngữ cảnh kể chuyện.
- source_word: αὐτῷ
  choice: với Đức Giê-su
  rationale: Đại từ chỉ Đức Giê-su theo ngữ cảnh; nêu tên giúp câu tiếng Việt rõ nghĩa. “Đức” là kính ngữ tự nhiên, không thêm một khẳng định thần học ngoài văn bản.
- source_word: Ἴδε
  choice: Kìa
  rationale: Giữ chức năng thu hút sự chú ý và sắc thái chất vấn; tự nhiên, trang trọng vừa phải trong tiếng Việt hiện đại.
- source_word: τί
  choice: tại sao
  rationale: Trong cấu trúc và ngữ cảnh khiếu trách, τί nhiều khả năng mang nghĩa trạng từ “tại sao”; nghĩa hình thức “điều gì” được giữ trong chú thích.
- source_word: ποιοῦσιν
  choice: họ làm
  rationale: Diễn đạt trực tiếp động từ hiện tại trong lời nói; tiếng Việt không cần thêm dấu hiệu tiếp diễn.
- source_word: τοῖς σάββασιν
  choice: trong ngày Sa-bát
  rationale: Dạng số nhiều Hy Lạp được dùng theo lối thành ngữ để chỉ ngày Sa-bát; số ít là cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: ὃ οὐκ ἔξεστιν
  choice: điều không được phép
  rationale: Giữ sức nặng pháp lý-tôn giáo của ἔξεστιν mà không xác định đó là luật Kinh Thánh, truyền thống Pha-ri-si hay cách giải thích luật.
theological_decisions:
- issue: Bản chất lời phản đối của người Pha-ri-si
  choice: điều không được phép
  alternative: điều trái luật
  rationale: Nguyên văn chỉ khẳng định hành động ấy không được phép, không xác định nguồn thẩm quyền pháp lý; bản dịch giữ nguyên sự căng thẳng này và không phán quyết trước về luật hay truyền thống.
- issue: Cách hiểu τί trong câu chất vấn
  choice: tại sao
  alternative: điều gì
  rationale: Ngữ cảnh lời khiếu trách ủng hộ nghĩa “tại sao”, nhưng cấu trúc Hy Lạp cũng có thể được đọc với τί là “điều gì”; phương án kia được ghi ở chú thích để bảo tồn tính đa nghĩa.
translation_notes:
  register: Văn phong hiện đại, rõ ràng và trang trọng vừa phải. Dùng “Pha-ri-si” và “Sa-bát” theo cách phiên âm quen thuộc; tránh từ ngữ cổ và không quy lời cáo buộc cho một hệ luật cụ thể.
