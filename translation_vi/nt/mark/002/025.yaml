revisions:
- from: 'Ngài nói với họ: “Các ông chưa bao giờ đọc điều Đa-vít đã làm khi ông lâm cảnh thiếu thốn và đói, cả ông lẫn những người đi cùng ông sao?”'
  to: 'Ngài nói với họ: “Các ông chưa bao giờ đọc Đa-vít đã làm gì khi chính ông và những người đi cùng ông thiếu thốn và đói sao?”'
  rationale: Thay “lâm cảnh thiếu thốn” bằng “thiếu thốn” để giữ nghĩa rộng, không thêm sắc thái hoàn cảnh. Sắp xếp lại cụm “chính ông và những người đi cùng ông” để phản ánh sự nhấn mạnh của αὐτὸς καὶ οἱ μετ’ αὐτοῦ và tạo tiếng Việt tự nhiên hơn, không thay đổi ý nghĩa.
