  yaml_path: translation/nt/mark/002/025.yaml
  text: And he said to them, “Have you never read what David did when he was in need and was hungry, he and those with him?”
translation:
  language: vi
  text: 'Ngài nói với họ: “Các ông chưa bao giờ đọc Đa-vít đã làm gì khi chính ông và những người đi cùng ông thiếu thốn và đói sao?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χρείαν ἔσχεν
  choice: lâm cảnh thiếu thốn
  rationale: Diễn đạt tự nhiên ý ‘có nhu cầu/lâm cảnh túng thiếu’, đồng thời không thu hẹp nhu cầu ấy chỉ còn cơn đói.
- source_word: ἐπείνασεν
  choice: đói
  rationale: Chuyển tải trực tiếp động từ chỉ tình trạng đói; được đặt song song với ‘lâm cảnh thiếu thốn’ như trong nguyên văn.
- source_word: οἱ μετ’ αὐτοῦ
  choice: những người đi cùng ông
  rationale: Giữ nghĩa rộng và tự nhiên của cụm từ, không thêm định danh như ‘môn đồ’ hay ‘thuộc hạ’.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” cho Chúa Giê-su theo ngữ cảnh, “các ông” cho nhóm người đối thoại, và lặp “ông” trong vế cuối để bảo toàn nét nhấn mạnh ‘chính ông và những người cùng đi’ của nguyên văn.
