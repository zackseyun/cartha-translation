  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Καὶ ⸀εἰσελθὼν πάλιν εἰς Καφαρναοὺμ δι’ ⸀ἡμερῶν ἠκούσθη ὅτι ⸂ἐν οἴκῳ⸃ ἐστίν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/001.yaml
  text: And when he entered Capernaum again after some days[a], it was heard that he was at home.
translation:
  language: vi
  text: Sau vài ngày, Đức Giê-su lại vào Ca-phác-na-um. Người ta nghe tin Ngài đang ở nhà.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “ở trong nhà.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσελθὼν
  choice: vào
  rationale: Phân từ bất định được diễn đạt trong mệnh đề kể chuyện; câu trước đặt mốc thời gian “Sau vài ngày”, còn câu sau mang động từ chính, tạo lối văn tự nhiên mà vẫn giữ trình tự sự việc.
- source_word: πάλιν
  choice: lại
  rationale: Diễn đạt ngắn gọn ý trở lại hoặc lặp lại của trạng từ Hy Lạp.
- source_word: Καφαρναούμ
  choice: Ca-phác-na-um
  rationale: Dùng dạng phiên âm quen thuộc trong tiếng Việt cho địa danh Capernaum.
- source_word: δι’ ἡμερῶν
  choice: Sau vài ngày
  rationale: Thành ngữ chỉ một khoảng thời gian không xác định gồm một số ngày; “vài ngày” tự nhiên trong tiếng Việt mà không ấn định chính xác độ dài.
- source_word: ἠκούσθη
  choice: Người ta nghe tin
  rationale: Chuyển cấu trúc bị động vô nhân xưng sang cách nói tự nhiên trong tiếng Việt, đồng thời giữ sắc thái tin tức được lan truyền.
- source_word: ἐν οἴκῳ
  choice: ở nhà
  rationale: Cách nói tự nhiên và phù hợp ngữ cảnh, nhưng nguyên ngữ cũng có thể chỉ đơn thuần là “ở trong nhà”; phương án này được ghi ở chú thích.
- source_word: ἐστίν
  choice: đang ở
  rationale: Thì hiện tại trong lời thuật gián tiếp được giữ bằng “đang”, phù hợp với tin được truyền đi rằng Đức Giê-su hiện có mặt tại đó.
theological_decisions:
- issue: ἐν οἴκῳ có nghĩa là “ở nhà” theo nghĩa nơi cư ngụ hay chỉ là “ở trong nhà”.
  choice: ở nhà
  alternative: ở trong nhà
  rationale: Ngữ cảnh cho phép cách hiểu thành ngữ “ở nhà”, nhưng không đủ để xác quyết căn nhà thuộc về ai. Chú thích giữ lại nghĩa địa điểm sát chữ, tránh biến một khả năng ngữ cảnh thành kết luận chắc chắn.
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Tách thành hai câu để tiếng Việt tự nhiên; “Người ta nghe tin” tái hiện công thức bị động vô nhân xưng của nguyên ngữ. Đại từ “Ngài” được dùng với sắc thái kính trọng thông dụng, không thêm nội dung giáo phái.
