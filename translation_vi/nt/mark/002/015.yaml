review_pass:
  verdict: revise
  source_fidelity: Bản thảo truyền đạt đúng bối cảnh dùng bữa, các nhóm người hiện diện, và giữ được sự mơ hồ của αὐτοῦ (“ông”). Tuy nhiên, “Chúa” thêm một tước hiệu không có trong câu Hy Lạp, và mệnh đề cuối gộp/diễn giải hai mệnh đề riêng biệt ἦσαν γὰρ πολλοί καὶ ἠκολούθουν αὐτῷ.
  naturalness: “Rồi khi” có thể dùng trong văn kể chuyện, nhưng câu được chỉnh cho mạch lạc hơn. “Môn đệ” là cách dùng hiện đại, trung tính và tự nhiên hơn “môn đồ” trong bản dịch phổ thông.
  terminology: Dùng “Giê-su” thay vì “Chúa Giê-su” để không thêm tước hiệu vào chính văn; dùng “Người” làm đại từ quy chiếu kính trọng, thông dụng trong văn phong Kinh Thánh tiếng Việt. Giữ “người thu thuế,” “người tội lỗi,” và “môn đệ.”
  issues:
  - severity: medium
    issue: “Chúa Giê-su” thêm tước hiệu “Chúa” vào những chỗ nguyên văn chỉ có Ἰησοῦ.
    rationale: Câu này không gọi Giê-su là κύριος. Bản dịch nên không đưa một tước hiệu thần học vào chính văn khi nguồn chỉ nêu tên riêng.
  - severity: medium
    issue: “vì có nhiều người như thế vẫn đi theo ngài” không phản ánh rõ cấu trúc “vì có nhiều người, và họ đang theo Người.”
    rationale: 'Nguyên văn có hai mệnh đề phối hợp: số người đông và họ theo Giê-su. “như thế” là yếu tố giải thích thêm, còn “vẫn” có thể gợi một ý tương phản không được nêu trong câu.'
  - severity: low
    issue: “các môn đồ” kém trung tính/hiện đại hơn “các môn đệ.”
    rationale: “Môn đệ” là thuật ngữ hiện đại, phổ biến, và chuyển tải μαθηταί mà không đổi nghĩa.
  revised_text: Rồi, khi Giê-su đang dùng bữa trong nhà ông[a], nhiều người thu thuế và người tội lỗi cũng dùng bữa với Giê-su và các môn đệ của Người; vì có nhiều người, và họ đang theo Người.
