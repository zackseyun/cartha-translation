id: MRK.2.15
reference: Mark 2:15
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Καὶ ⸀γίνεται κατακεῖσθαι αὐτὸν ἐν τῇ οἰκίᾳ αὐτοῦ, καὶ πολλοὶ τελῶναι καὶ ἁμαρτωλοὶ συνανέκειντο τῷ Ἰησοῦ καὶ τοῖς μαθηταῖς αὐτοῦ, ἦσαν γὰρ πολλοὶ καὶ ⸀ἠκολούθουν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/015.yaml
  text: And it happened that he was reclining at table in his house[a], and many tax collectors and sinners were reclining with Jesus and his disciples, for there were many, and they were following him.
translation:
  language: vi
  text: Rồi, khi Giê-su đang dùng bữa trong nhà ông[a], nhiều người thu thuế và người tội lỗi cũng dùng bữa với Giê-su và các môn đệ của Người; vì có nhiều người, và họ đang theo Người.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể hiểu là “trong nhà Lê-vi”; một số người hiểu là “trong nhà Giê-su.” Tiếng Hy Lạp chỉ ghi “trong nhà ông.”
    reason: Giữ sự mơ hồ về người sở hữu căn nhà trong nguyên văn.
lexical_decisions:
- source_word: γίνεται
  choice: Rồi khi
  rationale: Động từ ở hiện tại lịch sử đánh dấu diễn tiến câu chuyện. Tiếng Việt tự nhiên không cần dịch máy móc là “xảy ra”; “Rồi khi” vừa chuyển cảnh vừa nối với mệnh đề chỉ hoàn cảnh theo sau.
- source_word: κατακεῖσθαι
  choice: đang dùng bữa
  rationale: Từ này chỉ tư thế nằm tựa theo phong tục khi ăn. Dịch “dùng bữa” truyền đạt rõ sự kiện trong tiếng Việt hiện đại; “nằm tựa tại bàn” tuy sát hình ảnh hơn nhưng dễ gây chú ý không cần thiết.
- source_word: ἐν τῇ οἰκίᾳ αὐτοῦ
  choice: trong nhà ông
  rationale: Giữ đại từ sở hữu không xác định rõ tiền ngữ như nguyên văn Hy Lạp. “Ông” là cách quy chiếu tự nhiên đến một người nam trong văn cảnh; chú thích nêu các khả năng.
- source_word: τελῶναι
  choice: người thu thuế
  rationale: Cách gọi rõ ràng, hiện đại dành cho những người làm công việc thu các khoản thuế hay lệ phí.
- source_word: ἁμαρτωλοὶ
  choice: người tội lỗi
  rationale: Giữ nhãn gọi trực tiếp của nguyên văn, vốn có thể mang sắc thái phân loại xã hội và tôn giáo trong văn cảnh.
- source_word: συνανέκειντο
  choice: cùng dùng bữa với
  rationale: Diễn đạt tự nhiên cả bối cảnh bữa ăn lẫn ý cùng tham dự; tránh cách dịch cứng “cùng nằm tựa với”.
- source_word: μαθηταῖς
  choice: các môn đồ
  rationale: Thuật ngữ Tân Ước quen thuộc, giữ được ý về những người theo học và gắn bó với một vị thầy.
- source_word: ἦσαν γὰρ πολλοὶ
  choice: vì có nhiều người như thế
  rationale: Giữ chức năng giải thích của γάρ. “Như thế” làm rõ rằng “nhiều” quy về nhóm người thu thuế và người tội lỗi, phù hợp mạch cú pháp mà không chỉ định vượt quá văn bản.
- source_word: ἠκολούθουν αὐτῷ
  choice: vẫn đi theo ngài
  rationale: Thì chưa hoàn thành mô tả hành động đang tiếp diễn hoặc thường xuyên trong bối cảnh quá khứ. “Vẫn đi theo” thể hiện tính kéo dài và có thể bao hàm cả việc theo Chúa Giê-su theo nghĩa rộng.
theological_decisions:
- issue: Tiền ngữ của αὐτοῦ trong cụm “nhà ông”
  choice: Không xác định chủ nhà trong chính văn
  alternative: Nhà của Lê-vi; hoặc nhà của Chúa Giê-su
  rationale: Đại từ Hy Lạp không tự nó giải quyết chủ nhà là ai. Văn cảnh trước thường khiến người đọc hiểu là Lê-vi, nhưng cách hiểu là Chúa Giê-su cũng tồn tại. Bản dịch giữ nguyên sự mơ hồ và ghi chú các khả năng.
- issue: Ý nghĩa của “đi theo”
  choice: Giữ cách nói “đi theo ngài”
  alternative: Diễn giải là “trở thành môn đồ của ngài” hoặc chỉ “đi cùng ngài”
  rationale: ἀκολουθέω có thể gợi cả sự đi theo về mặt di chuyển lẫn mối quan hệ môn đồ. Không thu hẹp nghĩa bằng một lời diễn giải thần học cụ thể.
translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng dễ hiểu đối với độc giả Việt Nam hiện đại. Dùng “Chúa Giê-su” và đại từ “ngài” theo lối kính trọng thông dụng; “dùng bữa” ưu tiên sự tự nhiên hơn việc tái hiện cứng nhắc tư thế nằm tựa khi ăn. Dấu chú thích [a] xuất hiện ngay sau cụm từ liên quan.
