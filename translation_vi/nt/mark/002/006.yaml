  verdict: revise
  source_fidelity: 'Cấu trúc và ý chính được giữ khá sát: δέ được nối bằng “Nhưng,” τινες mang nghĩa một bộ phận, ἐκεῖ là “ở đó,” và ἐν ταῖς καρδίαις αὐτῶν được bảo lưu tự nhiên là “trong lòng.” Tuy nhiên, “kinh luật gia” thu hẹp và hiện đại hóa γραμματεῖς theo hướng các chuyên gia luật; từ này trong bối cảnh Phúc Âm trước hết chỉ nhóm kinh sư/thầy thông giáo, gắn với việc sao chép và giảng giải Kinh Thánh. “Suy luận” có thể dùng được cho διαλογιζόμενοι, nhưng “thầm nghĩ” tự nhiên hơn trong tiếng Việt ở cấu trúc dẫn vào lời tự vấn nội tâm của câu sau.'
