  terminology: Đổi “kinh luật gia” thành “thầy thông giáo,” cách gọi quen thuộc và chính xác hơn cho γραμματεῖς trong các sách Phúc Âm. “Trong lòng” nên được giữ, vì đây là thành ngữ tiếng Việt tự nhiên và phản ánh cách dùng καρδία như nơi của tư tưởng nội tâm. Không cần chú thích vì cách diễn đạt này không gây mơ hồ đáng kể trong tiếng Việt.
