base_translation:
  language: en
  yaml_path: translation/nt/mark/002/006.yaml
  text: 'But some of the scribes were sitting there[a], reasoning in their hearts:'
translation:
  language: vi
  text: 'Nhưng có một số thầy thông giáo ngồi ở đó, thầm nghĩ trong lòng rằng:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἦσαν δέ
  choice: Nhưng ... đang
  rationale: δέ chuyển cảnh sang phản ứng đối lập của một nhóm khác; “Nhưng” diễn đạt tự nhiên sự tương phản nhẹ, còn “đang” phối hợp với phân từ để thể hiện tình trạng đang diễn ra.
- source_word: τινες τῶν γραμματέων
  choice: có mấy kinh luật gia
  rationale: τινες cùng sở hữu cách bộ phận cho biết chỉ một số người trong nhóm được nói đến. “Kinh luật gia” chỉ những người thông thạo, sao chép và giải thích Kinh Thánh cùng luật Do Thái, dễ hiểu hơn cách gọi cổ.
- source_word: ἐκεῖ
  choice: ở đó
  rationale: Diễn đạt trực tiếp trạng từ chỉ nơi chốn và giữ chức năng xác định bối cảnh.
- source_word: καθήμενοι
  choice: đang ngồi
  rationale: Giữ tư thế và sắc thái tiếp diễn của phân từ trong cảnh thuật.
- source_word: διαλογιζόμενοι
  choice: suy luận
  rationale: Động từ chỉ sự cân nhắc, lập luận trong nội tâm; “suy luận” giữ sắc thái lý luận rõ hơn “suy nghĩ” mà không hàm ý họ đã nói ra.
- source_word: ἐν ταῖς καρδίαις αὐτῶν
  choice: trong lòng
  rationale: Giữ hình ảnh Kinh Thánh về lòng như nơi diễn ra tư tưởng nội tâm; tiếng Việt hiện đại cũng dùng “trong lòng” tự nhiên theo nghĩa này.
theological_decisions:
- issue: Thành ngữ nhân học καρδίαις
  choice: trong lòng
  alternative: trong tâm trí; thầm nghĩ
  rationale: Bản dịch giữ thế giới khái niệm của nguyên văn, trong đó “lòng” là nơi suy nghĩ và cân nhắc, nhưng không áp đặt sự phân đôi hiện đại giữa cảm xúc và lý trí.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cấu trúc kết thúc bằng “rằng:” để dẫn trực tiếp nội dung suy luận ở câu kế tiếp. Không cần chú thích vì “suy luận trong lòng” là thành ngữ tự nhiên và đủ rõ trong tiếng Việt.
