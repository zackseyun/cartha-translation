source:
  edition: SBLGNT
  text: ⸀Οὐδεὶς ἐπίβλημα ῥάκους ἀγνάφου ἐπιράπτει ἐπὶ ⸂ἱμάτιον παλαιόν⸃· εἰ δὲ μή, αἴρει τὸ πλήρωμα ⸀ἀπ’ αὐτοῦ τὸ καινὸν τοῦ παλαιοῦ, καὶ χεῖρον σχίσμα γίνεται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/021.yaml
  text: No one sews a patch of unshrunk cloth onto an old garment[a]; otherwise[b], the patch pulls away from it—the new from the old—and a worse tear results.
translation:
  language: vi
  text: Không ai lấy một miếng vải chưa co để vá vào áo cũ[a]; nếu không, miếng vá mới sẽ kéo bật khỏi áo cũ, khiến chỗ rách càng lớn hơn.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “một miếng vải chưa được làm co.” Tiếng Hy Lạp chỉ vải chưa qua công đoạn xử lý để vải co lại; nếu dùng làm miếng vá, sau đó vải có thể co.'
    reason: lexical_alternative
  - marker: b
    text: 'Sát nghĩa: “phần lấp đầy lấy đi khỏi nó—cái mới khỏi cái cũ.” Cấu trúc Hy Lạp khó; ý trong ngữ cảnh là miếng vá mới kéo bật khỏi áo cũ, làm chỗ rách tệ hơn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπίβλημα
  choice: miếng vá
  rationale: Chỉ mảnh vải được đặt lên để vá; “miếng vá” là cách nói tự nhiên và chính xác trong ngữ cảnh sửa áo.
- source_word: ῥάκους ἀγνάφου
  choice: một miếng vải chưa co
  rationale: ἄγναφος mô tả vải chưa qua công đoạn xử lý làm vải co lại; cách dịch này truyền đạt rõ hậu quả thực tế khi dùng nó vá áo cũ.
- source_word: ἐπιράπτει
  choice: vá ... vào
  rationale: Động từ có nghĩa khâu hoặc may gắn lên; “vá ... vào” tự nhiên trong tiếng Việt và giữ hành động cụ thể.
- source_word: ἱμάτιον παλαιόν
  choice: áo cũ
  rationale: ἱμάτιον chỉ y phục, thường là áo khoác ngoài; “áo” đủ rộng, tự nhiên và không xác định quá mức kiểu y phục.
- source_word: εἰ δὲ μή
  choice: nếu làm thế
  rationale: Trong ngữ cảnh, cụm này giới thiệu hậu quả nếu người ta vẫn làm điều vừa bị phủ định; cách diễn đạt này rõ nghĩa trong tiếng Việt.
- source_word: αἴρει
  choice: kéo rách
  rationale: Nghĩa đen là lấy đi hoặc kéo khỏi; trong hình ảnh vá áo, miếng mới co lại và kéo phần áo cũ, làm vết rách nặng hơn.
- source_word: τὸ πλήρωμα
  choice: miếng vá
  rationale: Ở đây chỉ mảnh dùng để lấp chỗ rách, tức miếng vá; cách gọi này dễ hiểu hơn lối dịch sát “phần lấp đầy”.
- source_word: τὸ καινὸν τοῦ παλαιοῦ
  choice: miếng vá mới ... áo cũ
  rationale: Diễn đạt rõ sự đối lập và quan hệ giữa phần mới với vật cũ trong tiếng Hy Lạp, đồng thời làm sáng tỏ các đối tượng được nói đến.
- source_word: χεῖρον σχίσμα γίνεται
  choice: khiến chỗ rách càng tệ hơn
  rationale: σχίσμα là vết hoặc chỗ rách; câu tiếng Việt tự nhiên này thể hiện đúng hậu quả trở nên nghiêm trọng hơn.
