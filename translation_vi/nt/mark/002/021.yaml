  verdict: revise
  source_fidelity: 'Bản dịch truyền đạt đúng hình ảnh chính: vải chưa co dùng vá áo cũ sẽ làm chỗ rách tệ hơn. Tuy nhiên, “miếng vá mới sẽ kéo rách áo cũ” diễn giải αἴρει quá trực tiếp như thể miếng vá tự xé áo. Cấu trúc Hy Lạp khó nói miếng vá/phần vải mới bị kéo bật hoặc kéo ra khỏi áo cũ; nên diễn đạt hậu quả này sát hơn mà vẫn tự nhiên.'
  naturalness: Câu hiện tại nhìn chung tự nhiên. “kéo bật khỏi áo cũ” diễn tả rõ hơn cơ chế của hình ảnh và tránh cách nói hơi gượng “kéo rách áo cũ”. “Chỗ rách càng lớn hơn” cụ thể, tự nhiên hơn “càng tệ hơn” trong ngữ cảnh vải áo.
