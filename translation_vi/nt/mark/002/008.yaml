  terminology: '"Đức Giê-su," "tâm linh," và "lòng" phù hợp với văn phong Kinh Thánh tiếng Việt. Chú thích bảo lưu đúng sự mơ hồ của τῷ πνεύματι αὐτοῦ, không áp đặt cơ chế thần học cho sự nhận biết của Đức Giê-su.'
  issues:
