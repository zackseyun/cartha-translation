- from: 'Ngay lập tức, Đức Giê-su nhận biết trong tâm linh mình[a] rằng họ đang suy tính như vậy trong lòng, nên nói với họ: “Tại sao các ông lại suy tính những điều ấy trong lòng mình?”'
  to: 'Ngay lập tức, Đức Giê-su nhận biết trong tâm linh mình[a] rằng họ đang suy tính như vậy trong lòng, và nói với họ: “Tại sao các ông lại suy tính những điều ấy trong lòng mình?”'
