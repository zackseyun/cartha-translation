source:
  edition: SBLGNT
  text: καὶ ⸀εὐθὺς ἐπιγνοὺς ὁ Ἰησοῦς τῷ πνεύματι αὐτοῦ ὅτι ⸀οὕτως διαλογίζονται ἐν ἑαυτοῖς ⸀λέγει αὐτοῖς· Τί ταῦτα διαλογίζεσθε ἐν ταῖς καρδίαις ὑμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/008.yaml
  text: And immediately Jesus[a], perceiving in his spirit that they were reasoning this way within themselves, said to them, “Why are you reasoning about these things in your hearts?”
translation:
  language: vi
  text: 'Ngay lập tức, Đức Giê-su nhận biết trong tâm linh mình[a] rằng họ đang suy tính như vậy trong lòng, và nói với họ: “Tại sao các ông lại suy tính những điều ấy trong lòng mình?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “biết trong tâm linh mình” hoặc “nhận ra trong chính mình”. Tiếng Hy Lạp không nói rõ cách thức Đức Giê-su nhận biết.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθὺς
  choice: ngay lập tức
  rationale: Giữ sắc thái khẩn trương của từ nối tường thuật thường gặp trong sách Mác, đồng thời tự nhiên trong tiếng Việt hiện đại.
- source_word: ἐπιγνοὺς
  choice: nhận biết
  rationale: Diễn đạt sự nhận ra hoặc biết rõ, nhưng không xác định quá mức cách thức Đức Giê-su có được nhận thức ấy.
- source_word: τῷ πνεύματι αὐτοῦ
  choice: trong tâm linh mình
  rationale: Phản ánh trực tiếp nghĩa phạm vi có thể có của cách tặng cách Hy Lạp và để ngỏ việc cụm từ nói về nội tâm hay cách thức nhận biết thuộc linh.
- source_word: οὕτως
  choice: như vậy
  rationale: Cách diễn đạt tự nhiên, chỉ phương cách hoặc nội dung suy tính vừa được nhắc đến.
- source_word: διαλογίζονται / διαλογίζεσθε
  choice: đang suy tính / lại suy tính
  rationale: Giữ nghĩa suy xét, bàn luận trong nội tâm; tránh khiến người đọc hiểu rằng họ đang tranh luận thành tiếng.
- source_word: ἐν ἑαυτοῖς
  choice: trong lòng
  rationale: Theo ngữ cảnh, cụm này nói đến suy nghĩ bên trong mỗi người chứ không phải cuộc trao đổi giữa họ.
- source_word: Τί ταῦτα διαλογίζεσθε
  choice: Tại sao các ông lại suy tính những điều ấy
  rationale: τί mang lực hỏi nguyên do trong cấu trúc này; “tại sao” tự nhiên hơn trong tiếng Việt, còn “những điều ấy” thể hiện ταῦτα.
- source_word: ἐν ταῖς καρδίαις ὑμῶν
  choice: trong lòng mình
  rationale: “Lòng” là cách diễn đạt Kinh Thánh tự nhiên cho con người bên trong, bao gồm suy nghĩ và ý định, không thu hẹp thành riêng trí óc.
theological_decisions:
- issue: Bản chất sự nhận biết của Đức Giê-su trong cụm “nhận biết trong tâm linh mình”
  choice: Giữ cụm “trong tâm linh mình” và không xác định cơ chế nhận biết.
  alternative: Diễn giải rõ đây là sự toàn tri thần thượng, sự soi dẫn của Thánh Linh, hoặc chỉ là trực giác sắc bén của con người.
  rationale: Câu này khẳng định Đức Giê-su biết sự suy tính nội tâm của họ, nhưng τῷ πνεύματι αὐτοῦ tự nó không buộc bản dịch phải quyết định giữa các cách giải thích thần học ấy.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “Đức Giê-su” và đại từ “các ông” phù hợp lời nói trực tiếp với các kinh sư; giữ “lòng” để bảo tồn hình ảnh nhân học Kinh Thánh.
