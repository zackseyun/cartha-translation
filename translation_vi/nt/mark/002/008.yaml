    rationale: Nguyên văn có καὶ λέγει αὐτοῖς, nghĩa là "và nói với họ," không khẳng định rằng việc nói là hệ quả được nêu rõ của hành động nhận biết. Nên giữ liên kết thuật sự trung tính.
