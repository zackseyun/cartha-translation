  source_fidelity: 'Bản dịch phản ánh đầy đủ các yếu tố chính của câu Hy Lạp: εὐθὺς ("Ngay lập tức"), sự nhận biết của Đức Giê-su "trong tâm linh mình," nội dung suy tính thầm kín của họ, và câu hỏi tu từ về những điều họ suy tính trong lòng. Tuy nhiên, "nên nói" thêm quan hệ hệ quả không có trong καὶ λέγει; liên từ καὶ chỉ thuật lại hành động tiếp theo.'
