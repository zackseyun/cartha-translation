reference: Mark 2:26
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸀πῶς εἰσῆλθεν εἰς τὸν οἶκον τοῦ θεοῦ ἐπὶ Ἀβιαθὰρ ἀρχιερέως καὶ τοὺς ἄρτους τῆς προθέσεως ἔφαγεν, οὓς οὐκ ἔξεστιν φαγεῖν εἰ μὴ ⸂τοὺς ἱερεῖς⸃, καὶ ἔδωκεν καὶ τοῖς σὺν αὐτῷ οὖσιν;
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/026.yaml
  text: how he entered into the house of God in the time of Abiathar the high priest[a], and ate the bread of the Presence, which it is not lawful to eat except for the priests[b], and also gave some to those who were with him?
translation:
  language: vi
  text: thể nào ông đã vào nhà Đức Chúa Trời vào thời A-bi-a-tha làm thượng tế[a], ăn bánh đặt trước nhan Đức Chúa Trời[b]—thứ bánh không ai được phép ăn, ngoại trừ các thầy tế lễ—và còn cho những người đi cùng ông ăn nữa?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “trong thời kỳ A-bi-a-tha làm thượng tế.” Cụm từ này cũng có thể được hiểu rộng hơn là nói đến thời kỳ hoặc bối cảnh của trình thuật gắn với thượng tế A-bi-a-tha.'
    reason: alternative_reading
  - marker: b
    text: “Bánh đặt trước nhan Đức Chúa Trời” là bánh đã được biệt riêng làm thánh và đặt trước mặt Ngài trong nơi thánh; theo cách gọi truyền thống là “bánh trần thiết.”
    reason: cultural_note
lexical_decisions:
- source_word: πῶς
  choice: thể nào
  rationale: Dẫn vào lời thuật lại việc Đa-vít đã làm; cách diễn đạt này tự nhiên trong mạch câu hỏi bắt đầu ở câu trước.
- source_word: εἰσῆλθεν εἰς τὸν οἶκον τοῦ θεοῦ
  choice: đã vào nhà Đức Chúa Trời
  rationale: Diễn đạt trực tiếp động từ và cụm giới từ, đồng thời giữ nguyên hình ảnh “nhà Đức Chúa Trời” của bản Hy Lạp.
- source_word: ἐπὶ Ἀβιαθὰρ ἀρχιερέως
  choice: vào thời thượng tế A-bi-a-tha
  rationale: ἐπί với sở hữu cách có thể chỉ thời gian hoặc bối cảnh; bản dịch chính giữ cách nói rộng, không ép cụm từ thành một khẳng định niên đại quá chính xác.
- source_word: τοὺς ἄρτους τῆς προθέσεως
  choice: bánh đặt trước nhan Đức Chúa Trời
  rationale: Chuyển tải ý loại bánh thánh được đặt ra trước mặt Đức Chúa Trời, rõ nghĩa hơn thuật ngữ cổ “bánh trần thiết” đối với độc giả hiện đại.
- source_word: οὓς οὐκ ἔξεστιν φαγεῖν εἰ μὴ τοὺς ἱερεῖς
  choice: thứ bánh không ai được phép ăn, ngoại trừ các thầy tế lễ
  rationale: Thể hiện rõ ý được phép hay không được phép trong bối cảnh luật lệ thánh, đồng thời giữ nguyên ngoại lệ dành cho các thầy tế lễ.
- source_word: ἔδωκεν καὶ τοῖς σὺν αὐτῷ οὖσιν
  choice: và còn cho những người đi cùng ông ăn nữa
  rationale: Đối tượng được cho là bánh đã được hiểu từ ngữ cảnh; thêm “ăn” giúp câu tiếng Việt tự nhiên và làm rõ hành động mà không thay đổi nội dung.
theological_decisions:
- issue: Cụm từ chỉ thời gian liên quan đến A-bi-a-tha và sự căng thẳng với trình thuật Cựu Ước
  choice: vào thời thượng tế A-bi-a-tha
  alternative: trong thời kỳ A-bi-a-tha làm thượng tế; trong phần trình thuật liên quan đến thượng tế A-bi-a-tha
  rationale: Cụm Hy Lạp có thể mang nghĩa thời gian rộng hoặc chỉ bối cảnh trình thuật. Bản dịch không tự ý giải quyết sự căng thẳng với 1 Sa-mu-ên 21, nhưng ghi nhận phạm vi nghĩa trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Chúa Trời” nhất quán cho θεός; tránh thuật ngữ cổ trong chính văn nhưng bảo lưu tên gọi truyền thống trong chú thích. Dấu gạch ngang giúp người đọc nhận ra mệnh đề giải thích mà không làm đứt mạch câu hỏi.
