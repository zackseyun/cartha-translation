  text: Σοὶ λέγω, ⸀ἔγειρε ἆρον τὸν κράβαττόν σου καὶ ὕπαγε εἰς τὸν οἶκόν σου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/011.yaml
  text: I say to you[a], get up, pick up your mat[b], and go to your house.
translation:
  language: vi
  text: 'Tôi bảo anh: Hãy đứng dậy, nhấc tấm đệm[a] của anh lên và đi về nhà[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “chỗ nằm” hoặc “giường nằm”. Từ Hy Lạp κράβαττος chỉ một tấm lót hay chỗ nằm đơn sơ, có thể mang đi.
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn Hy Lạp: “đến nhà của anh”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Σοὶ λέγω
  choice: Tôi bảo anh
  rationale: Đại từ Σοί được đặt trước động từ để nhấn mạnh người được trực tiếp truyền lệnh. “Tôi bảo anh” là cách nói tự nhiên trong tiếng Việt hiện đại, giữ được sắc thái trực tiếp và có thẩm quyền mà không dùng đại từ cổ “ngươi”.
- source_word: ἔγειρε
  choice: hãy đứng dậy
  rationale: Mệnh lệnh aorist của ἐγείρω, trong ngữ cảnh người bại liệt, chỉ hành động đứng dậy ngay. “Đứng dậy” rõ nghĩa và tự nhiên hơn “trỗi dậy” trong văn phong hiện đại.
- source_word: ἆρον
  choice: nhấc ... lên
  rationale: Mệnh lệnh aorist của αἴρω, diễn tả việc nâng vật đang nằm dưới đất để mang theo. “Nhấc ... lên” truyền đạt cụ thể hành động này.
- source_word: κράβαττόν
  choice: tấm đệm
  rationale: κράβαττος chỉ một tấm lót hoặc chỗ nằm đơn sơ, có thể cuộn hay mang đi. “Tấm đệm” dễ hiểu trong tiếng Việt hiện đại và không gợi một chiếc giường có khung cồng kềnh.
- source_word: ὕπαγε
  choice: đi
  rationale: Mệnh lệnh này được chuyển bằng động từ thông dụng “đi”, phù hợp với chuỗi mệnh lệnh trực tiếp và không thêm sắc thái xua đuổi.
- source_word: εἰς τὸν οἶκόν σου
  choice: về nhà
  rationale: Cụm Hy Lạp có nghĩa sát là “đến nhà của anh”. Trong ngữ cảnh trở lại nơi cư trú của mình, tiếng Việt tự nhiên dùng “về nhà”; ý sở hữu của σου đã hàm chứa trong cách nói này.
theological_decisions:
- issue: Giọng điệu và thẩm quyền trong mệnh lệnh chữa lành của Chúa Giê-su
  choice: 'Giữ chuỗi mệnh lệnh trực tiếp: “Tôi bảo anh: Hãy đứng dậy, nhấc tấm đệm của anh lên và đi về nhà.”'
  alternative: 'Cách diễn đạt cổ hơn: “Ta phán với ngươi: Hãy trỗi dậy, vác giường ngươi mà về nhà.”'
  rationale: Bản dịch giữ nguyên tính trực tiếp và có thẩm quyền của lời truyền mà không thêm lời giải thích thần học. Đại từ và động từ hiện đại giúp độc giả phổ thông dễ hiểu, đồng thời tránh sắc thái miệt thị hoặc cổ kính không có trong nguyên văn.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, rõ ràng và trang trọng vừa phải. Bản dịch dùng “tôi ... anh” để tránh đại từ cổ “ta ... ngươi” và không suy đoán thêm về tuổi tác hay địa vị của người được chữa lành. Các mệnh lệnh ngắn giữ nhịp dứt khoát của nguyên văn.
