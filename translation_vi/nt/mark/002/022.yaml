  to: Không ai đổ rượu mới vào bầu da cũ[a]. Nếu không, rượu sẽ làm bục các bầu da, rượu cũng bị mất[b], và bầu da cũng hỏng. Nhưng rượu mới thì đổ vào bầu da mới.
  rationale: Thay “Nếu làm vậy” bằng “Nếu không” để phản ánh trực tiếp εἰ δὲ μή (“nếu không”). Thay “bị đổ mất” bằng “bị mất” để không xác định quá mức cách rượu bị mất. Câu cuối được hoàn chỉnh bằng động từ “đổ,” một sự bổ sung tối thiểu cần thiết trong tiếng Việt cho mệnh đề Hy Lạp lược động từ, không biến câu thành mệnh lệnh.
