id: MRK.2.22
reference: Mark 2:22
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ οὐδεὶς βάλλει οἶνον νέον εἰς ἀσκοὺς παλαιούς· εἰ δὲ μή, ⸂ῥήξει ὁ οἶνος⸃ τοὺς ἀσκούς, καὶ ὁ οἶνος ⸂ἀπόλλυται καὶ οἱ ἀσκοί⸃. ἀλλὰ οἶνον νέον εἰς ἀσκοὺς ⸀καινούς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/022.yaml
  text: And no one puts new wine into old wineskins[a]. Otherwise, the wine will burst the wineskins, and the wine is ruined, and the wineskins too[b]. But new wine is for fresh wineskins.
translation:
  language: vi
  text: Không ai đổ rượu mới vào bầu da cũ[a]. Nếu không, rượu sẽ làm bục các bầu da, rượu cũng bị mất[b], và bầu da cũng hỏng. Nhưng rượu mới thì đổ vào bầu da mới.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bầu da là vật chứa làm bằng da thú, thường dùng để đựng rượu.
    reason: cultural_clarification
  - marker: b
    text: 'Cũng có thể dịch: “rượu bị hỏng” hoặc “rượu bị mất.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: βάλλει
  choice: đổ
  rationale: Trong ngữ cảnh cho chất lỏng vào vật chứa, “đổ” là cách nói tự nhiên trong tiếng Việt; từ Hy Lạp có nghĩa rộng hơn nhưng hành động cụ thể ở đây liên quan đến rượu.
- source_word: οἶνον νέον
  choice: rượu mới
  rationale: Giữ trực tiếp hình ảnh rượu mới làm, còn tiếp tục lên men.
- source_word: ἀσκούς
  choice: bầu da
  rationale: Chỉ vật chứa làm bằng da thú dùng để đựng rượu; “bầu da” vừa gọn vừa giữ được hình ảnh văn hóa cổ.
- source_word: παλαιούς
  choice: cũ
  rationale: Phản ánh trực tiếp παλαιούς và giữ sự đối lập với καινούς ở cuối câu mà không diễn giải quá mức thành “mục nát” hay “mòn”.
- source_word: ῥήξει
  choice: sẽ làm bục
  rationale: Chủ ngữ trong tiếng Hy Lạp là rượu; cách diễn đạt này giữ quan hệ chủ động và mô tả tự nhiên sức ép khiến bầu da vỡ.
- source_word: ἀπόλλυται
  choice: bị đổ mất
  rationale: Trong hình ảnh bầu da bị bục, nghĩa thực tế là rượu bị thất thoát. Cách dịch này rõ nghĩa trong tiếng Việt, đồng thời ghi nhận khả năng dịch rộng hơn trong chú thích.
- source_word: καινούς
  choice: còn mới
  rationale: “Còn mới” gợi tình trạng mới, tốt và thích hợp của bầu da, phần nào thể hiện sắc thái phẩm chất của καινός khi đối lập với παλαιός.
- source_word: ἀλλὰ οἶνον νέον εἰς ἀσκοὺς καινούς
  choice: Nhưng rượu mới dành cho bầu da còn mới
  rationale: Mệnh đề Hy Lạp lược bỏ động từ. “Dành cho” giữ tính cách ngôn khái quát mà không thêm mệnh lệnh hay ý bắt buộc vốn không được nói rõ.
theological_decisions:
- issue: Tính chất của mệnh đề lược ở cuối câu
  choice: 'Diễn đạt như một nguyên tắc khái quát: “rượu mới dành cho bầu da còn mới.”'
  alternative: “Nhưng phải đổ rượu mới vào bầu da mới.”
  rationale: Bản Hy Lạp không có động từ trong mệnh đề cuối. Không thêm “phải” giúp bảo toàn sự cô đọng và tránh biến câu thành một mệnh lệnh rõ ràng hơn nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “bầu da” để giữ hình ảnh lịch sử; dùng “làm bục” thay vì từ quá kỹ thuật. Nhịp câu giữ tính chất ví von, cách ngôn của nguyên văn.
