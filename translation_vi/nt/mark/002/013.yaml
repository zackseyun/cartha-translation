base_translation:
  language: en
  yaml_path: translation/nt/mark/002/013.yaml
  text: And he went out again beside the sea[a], and the whole crowd was coming to him[c][b], and he was teaching them.
translation:
  language: vi
  text: Ngài lại đi ra bên hồ[a]. Cả đám đông đang đến với Ngài, và Ngài đang dạy họ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “bên biển.”'
    reason: lexical_alternative
  - marker: b
    text: Các động từ được dịch là “đang đến” và “đang dạy” đều ở thể chưa hoàn thành trong tiếng Hy Lạp, có thể gợi hành động đang tiếp diễn trong quá khứ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθεν
  choice: đi ra
  rationale: Diễn đạt tự nhiên động từ ἐξέρχομαι ở thì aorist, không thêm một địa điểm xuất phát vốn không được nói rõ trong tiếng Hy Lạp.
- source_word: πάλιν
  choice: lại
  rationale: Đánh dấu sự lặp lại một cách ngắn gọn và tự nhiên trong tiếng Việt hiện đại.
- source_word: παρὰ τὴν θάλασσαν
  choice: dọc theo bờ hồ
  rationale: παρά với đối cách ở đây chỉ hướng đi hoặc vị trí men theo mép nước. Trong bối cảnh Mác, θάλασσα nói đến hồ Ga-li-lê; “bờ hồ” tự nhiên và chính xác về địa lý hơn “bờ biển” trong tiếng Việt.
- source_word: πᾶς ὁ ὄχλος
  choice: cả đoàn dân đông
  rationale: Truyền đạt thành ngữ πᾶς ὁ với danh từ tập hợp bằng cách nói tự nhiên, đồng thời giữ sắc thái toàn thể.
- source_word: ἤρχετο
  choice: đang kéo đến
  rationale: Thể chưa hoàn thành gợi hành động đang tiếp diễn trong quá khứ; “kéo đến” hợp tự nhiên với chủ ngữ là một đoàn dân đông mà không nhất thiết hàm ý cưỡng ép.
- source_word: πρὸς αὐτόν
  choice: đến với Ngài
  rationale: Diễn đạt chuyển động hướng tới một người; “đến với” tự nhiên trong ngữ cảnh dân chúng tìm đến Chúa Giê-su.
- source_word: ἐδίδασκεν
  choice: giảng dạy
  rationale: Giữ ý hoạt động dạy dỗ đang diễn ra; kết cấu “và Ngài giảng dạy họ” tự nhiên trong tiếng Việt, trong khi ngữ cảnh cùng thể chưa hoàn thành vẫn biểu thị sự tiếp diễn.
- source_word: αὐτούς
  choice: họ
  rationale: Đại từ tân ngữ quy chiếu về đoàn dân đông.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” để chỉ Chúa Giê-su. Dịch θάλασσα theo địa hình ngữ cảnh là “hồ”, tránh cách gọi “biển” dễ gây hiểu lầm trong tiếng Việt; giữ chú thích cho phương án không nhấn mạnh chuyển động dọc bờ.
