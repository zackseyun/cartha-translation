id: MRK.2.20
reference: Mark 2:20
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐλεύσονται δὲ ἡμέραι ὅταν ἀπαρθῇ ἀπ’ αὐτῶν ὁ νυμφίος, καὶ τότε νηστεύσουσιν ἐν ⸂ἐκείνῃ τῇ ἡμέρᾳ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/020.yaml
  text: But days will come when the bridegroom is taken away from them[a], and then they will fast in that day.
translation:
  language: vi
  text: Nhưng sẽ có những ngày mà chàng rể bị đem đi khỏi họ; bấy giờ họ sẽ kiêng ăn vào ngày ấy.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hy Lạp dùng số ít: “vào ngày ấy,” không phải “trong những ngày ấy.”'
    reason: Giữ rõ sự khác biệt về số trong nguyên văn, vì phần đầu câu dùng số nhiều “những ngày” nhưng cụm cuối câu lại dùng số ít.
lexical_decisions:
- source_word: ἐλεύσονται δὲ ἡμέραι
  choice: Nhưng sẽ đến những ngày
  rationale: Giữ thành ngữ chỉ thời điểm sắp đến; “Nhưng” thể hiện sự tương phản với hoàn cảnh hiện tại ở câu trước.
- source_word: ὅταν
  choice: khi
  rationale: Trong ngữ cảnh hướng đến một biến cố tương lai, “khi” tự nhiên và thích hợp hơn cách diễn đạt có tính lặp lại như “bất cứ khi nào”.
- source_word: ἀπαρθῇ
  choice: bị đem đi
  rationale: Giữ thể bị động và sắc thái bị tách khỏi họ, nhưng không xác định tác nhân hay giải thích cụ thể cách thức biến cố xảy ra.
- source_word: ἀπ’ αὐτῶν
  choice: khỏi họ
  rationale: Diễn đạt rõ sự phân cách giữa chàng rể và những người đang ở với chàng.
- source_word: ὁ νυμφίος
  choice: chàng rể
  rationale: Thuật ngữ tiếng Việt hiện đại, rõ nghĩa và giữ nguyên hình ảnh ẩn dụ về lễ cưới.
- source_word: καὶ τότε
  choice: bấy giờ
  rationale: 'Nêu rõ trình tự: việc kiêng ăn xảy ra sau khi chàng rể bị đem đi.'
- source_word: νηστεύσουσιν
  choice: họ sẽ kiêng ăn
  rationale: “Kiêng ăn” diễn đạt thực hành nhịn ăn mang ý nghĩa tôn giáo bằng ngôn ngữ phổ thông, trang trọng.
- source_word: ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: vào ngày ấy
  rationale: Giữ số ít của cụm từ Hy Lạp và diễn đạt tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Việc đồng nhất Chúa Giê-su với chàng rể trong ẩn dụ
  choice: Giữ nguyên “chàng rể” mà không đổi thành đại từ ngôi thứ nhất hay thêm lời giải thích.
  alternative: “khi Ta bị đem đi khỏi họ”
  rationale: Ngữ cảnh cho thấy Chúa Giê-su nói về chính mình, nhưng nguyên văn vẫn dùng hình ảnh chàng rể. Giữ ẩn dụ bảo toàn sức nặng văn chương và thần học của câu.
- issue: Bản chất của việc chàng rể bị đem đi
  choice: Dùng thể bị động “bị đem đi” mà không nêu tác nhân hoặc nói rõ đây là sự chết.
  alternative: “bị đem đi để chịu chết”
  rationale: Câu này báo trước việc Chúa Giê-su bị loại khỏi các môn đồ, thường được hiểu là hướng đến sự chết của Ngài; tuy nhiên, chính câu này không nêu tác nhân hay cách thức, nên bản dịch giữ nguyên độ mở ấy.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Cấu trúc “sẽ đến những ngày khi...” hơi có dấu ấn ngôn ngữ Kinh Thánh nhưng vẫn rõ nghĩa; số ít bất ngờ ở “ngày ấy” được giữ lại và giải thích bằng chú thích.
