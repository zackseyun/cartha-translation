  text: ⸂καὶ ἰδὼν⸃ ὁ Ἰησοῦς τὴν πίστιν αὐτῶν λέγει τῷ παραλυτικῷ· Τέκνον, ⸂ἀφίενταί σου⸃ αἱ ⸀ἁμαρτίαι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/005.yaml
  text: And Jesus[a], seeing their faith, says to the paralyzed man, “Child, your sins are forgiven.”
translation:
  language: vi
  text: 'Đức Giê-su thấy đức tin của họ thì nói với người bại liệt: “Con ơi,[a] tội lỗi của con được tha.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “Con trai”; từ Hy Lạp τέκνον là cách xưng hô trìu mến, có nghĩa cơ bản là “con” hoặc “đứa trẻ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν
  choice: thấy ... thì nói
  rationale: Phân từ aorist được diễn đạt bằng cấu trúc thời gian tự nhiên trong tiếng Việt, nối việc Đức Giê-su nhận thấy đức tin của họ với lời ngài nói.
- source_word: πίστιν
  choice: đức tin
  rationale: Trong ngữ cảnh này, từ này chỉ lòng tin cậy được biểu lộ qua việc cả nhóm đưa người bại liệt đến với Đức Giê-su; “đức tin” là cách dịch chuẩn và tự nhiên.
- source_word: αὐτῶν
  choice: của họ
  rationale: Giữ nguyên đại từ số nhiều và không xác định riêng liệu người bại liệt có được tính trong nhóm ấy hay không.
- source_word: λέγει
  choice: nói
  rationale: Tiếng Việt thường dùng dạng động từ không đánh dấu thì trong lời kể; cách này tự nhiên mà không làm mất sắc thái sinh động của hiện tại lịch sử Hy Lạp.
- source_word: παραλυτικῷ
  choice: người bại liệt
  rationale: Diễn đạt danh từ hóa theo cách thông dụng, rõ ràng và tôn trọng con người trong tiếng Việt hiện đại.
- source_word: Τέκνον
  choice: Con ơi
  rationale: Thể hiện lời xưng hô trìu mến mang nghĩa “con/trẻ nhỏ”; tiếng Việt cần tiểu từ “ơi” để lời gọi trực tiếp được tự nhiên và ấm áp.
- source_word: ἀφίενταί σου αἱ ἁμαρτίαι
  choice: tội lỗi của con đã được tha
  rationale: Câu bị động giữ tác nhân không được nêu như nguyên văn. Trong tiếng Việt, “đã được tha” diễn đạt tự nhiên trạng thái tha thứ được tuyên bố là hiện thực, không giải thích thêm cơ chế hay tác nhân.
- source_word: ἁμαρτίαι
  choice: tội lỗi
  rationale: Cách gọi tự nhiên trong tiếng Việt; dù hình thức tiếng Việt không đánh dấu số nhiều rõ như Hy Lạp, cụm này có thể chỉ các tội nói chung.
theological_decisions:
- issue: Bản chất lời tuyên bố tha tội của Đức Giê-su
  choice: 'Dịch như một lời tuyên bố trực tiếp: “tội lỗi của con đã được tha”'
  alternative: “tội lỗi của con đang được tha” hoặc “tội lỗi của con được tha”
  rationale: Nguyên văn dùng hiện tại bị động, công bố sự tha thứ như một thực tại hiện có. Bản dịch giữ thể bị động và không thêm lời giải thích về tác nhân, cơ chế hay thời điểm chính xác.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Đức Giê-su” theo cách viết Công giáo phổ biến trong tiếng Việt nhưng câu dịch không thêm nét thần học hệ phái. Lời gọi “Con ơi” truyền đạt sự trìu mến của τέκνον; chú thích ghi nhận phương án ngắn hơn.
