- from: 'Đức Giê-su thấy đức tin của họ thì nói với người bại liệt: “Con ơi,[a] tội lỗi của con đã được tha.”'
  to: 'Đức Giê-su thấy đức tin của họ thì nói với người bại liệt: “Con ơi,[a] tội lỗi của con được tha.”'
  rationale: Bản sửa thay “đã được tha” bằng “được tha” để phản ánh hiện tại bị động ἀφίενται mà vẫn giữ tác nhân hàm ẩn. Chú thích được làm rõ để cung cấp một phương án dịch thực sự khác biệt, song không biến τέκνον thành thuật ngữ mặc định mang nghĩa giới tính nam.
