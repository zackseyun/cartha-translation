  source_fidelity: 'Bản dịch truyền đạt chính xác cấu trúc đối chiếu của nguyên văn: Sa-bát được lập nên vì lợi ích/mục đích liên hệ đến con người, chứ không phải ngược lại. “Con người” diễn đạt đúng ἄνθρωπος số ít mang nghĩa đại diện. “Được lập nên” là cách chuyển ngữ phù hợp của ἐγένετο trong ngữ cảnh thiết chế Sa-bát. Sắc thái chưa hoàn thành của ἔλεγεν không bắt buộc phải thể hiện bằng một hình thức riêng trong tiếng Việt.'
