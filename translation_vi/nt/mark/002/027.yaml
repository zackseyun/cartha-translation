  text: καὶ ἔλεγεν αὐτοῖς· Τὸ σάββατον διὰ τὸν ἄνθρωπον ἐγένετο ⸀καὶ οὐχ ὁ ἄνθρωπος διὰ τὸ σάββατον·
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/027.yaml
  text: And he was saying to them[a], “The Sabbath came into being for man, and not man for the Sabbath.”
translation:
  language: vi
  text: 'Ngài nói với họ: “Ngày Sa-bát được lập nên vì con người, chứ không phải con người vì ngày Sa-bát.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλεγεν
  choice: nói
  rationale: Thì chưa hoàn thành có thể gợi hành động đang tiếp diễn hoặc lặp lại, nhưng trong lời dẫn trực tiếp tiếng Việt, “nói” là cách kể tự nhiên và không loại trừ sắc thái ấy.
- source_word: τὸ σάββατον
  choice: ngày Sa-bát
  rationale: Danh từ có mạo từ chỉ ngày hoặc thiết chế Sa-bát; thêm “ngày” giúp độc giả tiếng Việt nhận ra ngay đối tượng được nói đến.
- source_word: διὰ τὸν ἄνθρωπον
  choice: vì con người
  rationale: διά với đối cách diễn tả mục đích hoặc lợi ích. “Con người” vừa giữ được dạng số ít mang tính đại diện, vừa tự nhiên bao gồm toàn thể loài người trong tiếng Việt.
- source_word: ἐγένετο
  choice: được lập nên
  rationale: Cách dịch này diễn đạt việc ngày Sa-bát được đưa vào hiện hữu như một thiết chế, đồng thời tự nhiên hơn “đi vào hiện hữu” trong tiếng Việt. Nó không xác định thêm thời điểm hay cơ chế thiết lập.
- source_word: καὶ οὐχ ὁ ἄνθρωπος διὰ τὸ σάββατον
  choice: chứ không phải con người vì ngày Sa-bát
  rationale: “Chứ không phải” thể hiện rõ cấu trúc đối lập và giữ nguyên lối nói tỉnh lược của nguyên văn.
theological_decisions:
- issue: Ý nghĩa đại diện của danh từ số ít ἄνθρωπος
  choice: Dịch là “con người” ở số ít, mang nghĩa đại diện cho loài người nói chung.
  alternative: “nhân loại” hoặc “loài người”
  rationale: “Con người” giữ được hình thức số ít và phép đối xứng tu từ của hai vế, đồng thời trong tiếng Việt không hàm ý chỉ nam giới.
- issue: Quan hệ mục đích giữa ngày Sa-bát và con người
  choice: Giữ nguyên mệnh đề rằng ngày Sa-bát được lập nên vì con người.
  alternative: Diễn giải thành “để phục vụ lợi ích của con người”
  rationale: Bản dịch trực tiếp bảo toàn sức nén và độ mở của διά, tránh giải thích quá mức bản chất lợi ích hay mục đích được nói đến.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu đối xứng được giữ nguyên để bảo toàn sức nhấn của lời phán; “Sa-bát” dùng cách phiên âm quen thuộc trong tiếng Việt.
