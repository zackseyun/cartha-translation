  terminology: “Sa-bát” là thuật ngữ quen thuộc và nhất quán. “Con người” không giới hạn giới tính, đồng thời vẫn giữ được số ít đại diện và thế đối xứng giữa hai vế. Không cần chú thích cho ἄνθρωπος vì cách dịch tiếng Việt đã biểu đạt tự nhiên nghĩa bao quát của từ này.
