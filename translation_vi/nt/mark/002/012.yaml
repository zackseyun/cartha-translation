  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἠγέρθη ⸂καὶ εὐθὺς⸃ ἄρας τὸν κράβαττον ἐξῆλθεν ⸀ἔμπροσθεν πάντων, ὥστε ἐξίστασθαι πάντας καὶ δοξάζειν τὸν θεὸν λέγοντας ὅτι ⸂Οὕτως οὐδέποτε⸃ εἴδομεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/012.yaml
  text: And he got up[a], and immediately picked up the mat and went out before them all, so that they were all amazed and glorified God, saying, “We have never seen anything like this.”
translation:
  language: vi
  text: 'Người ấy đứng dậy, lập tức nhấc tấm đệm lên và đi ra trước mặt mọi người. Vì thế, tất cả đều kinh ngạc và tôn vinh Đức Chúa Trời, nói rằng: “Chúng ta chưa bao giờ thấy điều gì như thế này.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sát nghĩa hơn: “Chúng ta chưa bao giờ thấy như vậy.” Cách nói Hy Lạp có nghĩa là đối với họ, việc vừa xảy ra là chưa từng có.'
    reason: Giải thích thành ngữ và cung cấp cách dịch sát chữ.
lexical_decisions:
- source_word: ἠγέρθη
  choice: đứng dậy
  rationale: Trong trình thuật chữa lành này, động từ chỉ việc người bại liệt đứng lên theo lời truyền của Đức Giê-su. Cách dịch này tự nhiên trong tiếng Việt và không đưa sắc thái phục sinh vào nơi văn cảnh không nhấn mạnh sắc thái ấy.
- source_word: εὐθύς
  choice: lập tức
  rationale: Giữ được tính khẩn trương đặc trưng trong lối kể của Mác, đồng thời rõ ràng và tự nhiên trong tiếng Việt hiện đại.
- source_word: ἄρας
  choice: nhấc ... lên
  rationale: Diễn tả hành động nâng tấm đệm lên để mang đi; cách nói này sát nghĩa mà không biến vật ấy thành một loại cáng cụ thể.
- source_word: κράβαττον
  choice: tấm đệm
  rationale: Chỉ một tấm lót đơn sơ dùng để nằm; “tấm đệm” dễ hiểu hơn “giường” và ít diễn giải hơn “cáng”.
- source_word: ἔμπροσθεν πάντων
  choice: trước mặt mọi người
  rationale: Giữ trọng tâm về tính công khai của sự việc và là cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: ὥστε ἐξίστασθαι πάντας
  choice: Vì thế, tất cả đều kinh ngạc
  rationale: Diễn đạt kết quả của hành động vừa xảy ra; “kinh ngạc” truyền đạt đúng sức mạnh của ἐξίστασθαι mà không cường điệu thành mất tự chủ.
- source_word: δοξάζειν τὸν θεόν
  choice: tôn vinh Đức Chúa Trời
  rationale: Giữ ý nghĩa hướng sự vinh hiển về Đức Chúa Trời và bảo tồn sắc thái Kinh Thánh của δοξάζω.
- source_word: Οὕτως οὐδέποτε εἴδομεν
  choice: Chúng ta chưa bao giờ thấy điều gì như thế này
  rationale: Chuyển đúng lực của thành ngữ Hy Lạp, tức họ chưa từng chứng kiến điều tương tự, bằng tiếng Việt tự nhiên.
theological_decisions:
- issue: Khả năng ἠγέρθη gợi liên tưởng đến sự phục sinh
  choice: Dịch là “đứng dậy” theo văn cảnh chữa lành trực tiếp
  alternative: “được làm cho trỗi dậy” hoặc “trỗi dậy”
  rationale: Dù ἐγείρω có thể được dùng về sự phục sinh ở những chỗ khác, tại đây người bại liệt đang thực hiện mệnh lệnh đứng lên của Đức Giê-su. Bản dịch không áp đặt thần học phục sinh lên câu này, nhưng cũng không phủ nhận phạm vi nghĩa rộng hơn của động từ.
translation_notes:
  register: Văn phong trang trọng vừa phải, rõ ràng và tự nhiên đối với độc giả Việt Nam hiện đại. Dùng “người ấy” để nối với nhân vật trong văn cảnh, “tấm đệm” cho vật nằm đơn sơ, và đặt chú thích tại câu nói mà chú thích thực sự giải thích.
