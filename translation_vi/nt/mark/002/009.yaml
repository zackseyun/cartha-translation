source:
  edition: SBLGNT
  text: τί ἐστιν εὐκοπώτερον, εἰπεῖν τῷ παραλυτικῷ· ⸀Ἀφίενταί σου αἱ ἁμαρτίαι, ἢ εἰπεῖν· ⸀Ἔγειρε καὶ ἆρον ⸂τὸν κράβαττόν σου⸃ καὶ περιπάτει;
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/009.yaml
  text: 'Which is easier: to say to the paralyzed man[a], ‘Your sins are forgiven,’ or to say, ‘Get up, pick up your mat, and walk’?”'
translation:
  language: vi
  text: 'Điều nào dễ hơn: nói với người bại liệt rằng: ‘Tội lỗi của anh được tha[a],’ hay nói: ‘Hãy đứng dậy, nhấc tấm đệm của anh lên và bước đi’?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Tội lỗi của anh đã được tha.” Động từ Hy Lạp có thể được hiểu là nhấn mạnh tình trạng đã được tha.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τί ἐστιν εὐκοπώτερον
  choice: Điều nào dễ hơn
  rationale: Diễn đạt tự nhiên câu hỏi so sánh trong tiếng Việt, giữ nguyên ý tương đối của εὐκοπώτερον.
- source_word: τῷ παραλυτικῷ
  choice: với người bại liệt
  rationale: Chỉ rõ người bị liệt bằng cách nói thông dụng, dễ hiểu và không dùng thuật ngữ y khoa quá chuyên biệt.
- source_word: Ἀφίενταί σου αἱ ἁμαρτίαι
  choice: Tội lỗi của anh được tha
  rationale: Giữ thể bị động và sắc thái tuyên bố về tình trạng được tha, không xác định thêm tác nhân hay thời điểm.
- source_word: Ἔγειρε
  choice: Hãy đứng dậy
  rationale: Mệnh lệnh tự nhiên trong tiếng Việt, phù hợp với việc người bại liệt được truyền phải trỗi dậy.
- source_word: ἆρον τὸν κράβαττόν σου
  choice: nhấc tấm đệm của anh lên
  rationale: κράβαττος là tấm đệm hoặc chỗ nằm đơn sơ có thể mang đi; cách dịch này tránh gợi một chiếc giường lớn.
- source_word: περιπάτει
  choice: bước đi
  rationale: Diễn đạt rõ hành động đi lại trong chuỗi mệnh lệnh và tự nhiên trong văn cảnh chữa lành.
theological_decisions:
- issue: Sắc thái của lời tuyên bố tha tội
  choice: Tội lỗi của anh được tha
  alternative: Tội lỗi của anh đã được tha
  rationale: Dạng hiện tại ἀφίενταί có thể nhấn mạnh tình trạng được tha. Bản chính giữ lời tuyên bố ở hiện tại mà không ấn định quá mức thời điểm hoàn tất; chú thích ghi nhận cách hiểu nhấn mạnh kết quả.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “anh” theo ngữ cảnh Chúa Giê-su nói với một người nam trưởng thành; “tấm đệm” diễn tả chỗ nằm đơn sơ, có thể nhấc và mang đi.
