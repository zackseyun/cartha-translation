  source_fidelity: Bản dịch phản ánh chính xác cấu trúc đối chiếu của τί ἐστιν εὐκοπώτερον giữa hai lời nói. “Người bại liệt,” “được tha,” “đứng dậy,” “nhấc tấm đệm ... lên,” và “bước đi” lần lượt truyền đạt trung thực τῷ παραλυτικῷ, ἀφίενταί, ἔγειρε, ἆρον τὸν κράβαττόν σου, và περιπάτει. Không thêm tác nhân tha tội hay diễn giải thần học ngoài văn bản.
  naturalness: Câu văn hiện đại, rõ ràng và có nhịp điệu phù hợp với lời đối thoại. “Điều nào dễ hơn” và chuỗi mệnh lệnh “Hãy đứng dậy, nhấc ... lên và bước đi” đều tự nhiên trong văn phong Kinh Thánh tiếng Việt đương đại. Cách gọi “anh” phù hợp với một người nam trong ngữ cảnh trực tiếp này.
  terminology: “Người bại liệt” là cách gọi thông dụng và dễ hiểu; “tấm đệm” diễn tả hợp lý κράβαττος như một chỗ nằm đơn sơ có thể nhấc mang. “Tội lỗi của anh được tha” giữ được tính tuyên bố bị động và không xác định quá mức thời điểm hoặc tác nhân. Chú thích nêu đúng khả năng nhấn mạnh trạng thái kết quả của động từ Hy Lạp.
