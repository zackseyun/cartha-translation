source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ⸂αὐτὸν ἐν τοῖς σάββασιν παραπορεύεσθαι⸃ διὰ τῶν σπορίμων, καὶ ⸂οἱ μαθηταὶ αὐτοῦ ἤρξαντο⸃ ὁδὸν ποιεῖν τίλλοντες τοὺς στάχυας.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/023.yaml
  text: And it happened that on the Sabbath he was passing through the grainfields[a], and his disciples began to make their way[c][b], plucking the heads of grain.
translation:
  language: vi
  text: Vào một ngày sa-bát, Đức Giê-su đang đi qua các ruộng ngũ cốc[a]. Các môn đồ Ngài bắt đầu đi qua ruộng, vừa bứt các bông ngũ cốc[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “qua những cánh đồng ngũ cốc đang mọc.”
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn: “bắt đầu làm đường/lối, vừa bứt các bông ngũ cốc.” Thành ngữ này ở đây chỉ việc họ tiến đi qua ruộng trong khi bứt các bông ngũ cốc.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: Có một ngày
  rationale: Chuyển công thức dẫn nhập tự sự sang tiếng Việt hiện đại, tự nhiên; kết hợp với cụm thời gian kế tiếp mà vẫn giữ chức năng mở đầu biến cố.
- source_word: ἐν τοῖς σάββασιν
  choice: ngày sa-bát
  rationale: Dạng số nhiều Hy Lạp thường được dùng theo nghĩa một ngày sa-bát trong văn cảnh này; tiếng Việt dùng số ít tự nhiên hơn.
- source_word: παραπορεύεσθαι
  choice: đi ngang qua
  rationale: Diễn đạt rõ chuyển động xuyên qua khu vực đồng lúa mà không thêm ý ngoài nguyên văn.
- source_word: διὰ τῶν σπορίμων
  choice: qua những cánh đồng lúa
  rationale: σπόριμος chỉ ruộng đã gieo trồng hay đồng ngũ cốc; 'cánh đồng lúa' là cách nói phổ thông trong tiếng Việt, với chú thích để tránh giới hạn vào lúa gạo.
- source_word: ἤρξαντο
  choice: vừa đi vừa
  rationale: Trong cấu trúc với ὁδὸν ποιεῖν và phân từ τίλλοντες, cách diễn đạt này truyền đạt tự nhiên rằng các môn đồ bắt đầu tiến đi bằng việc ngắt bông lúa, tránh lối dịch cứng 'bắt đầu làm đường'.
- source_word: ὁδὸν ποιεῖν
  choice: đi
  rationale: Thành ngữ theo nghĩa đen là 'làm đường/lối'; ở đây chỉ việc tiến bước qua đồng, nên 'đi' phù hợp ngữ cảnh và không gợi ý họ mở hay xây đường.
- source_word: τίλλοντες
  choice: ngắt
  rationale: τίλλω diễn tả việc bứt hoặc ngắt khỏi cây; 'ngắt' chính xác và tự nhiên đối với bông lúa.
- source_word: τοὺς στάχυας
  choice: những bông lúa
  rationale: στάχυς là bông hay gié của cây ngũ cốc; 'bông lúa' dễ hiểu trong tiếng Việt, kèm chú thích về phạm vi nghĩa.
- source_word: αὐτὸν
  choice: Đức Giê-su
  rationale: Đại từ Hy Lạp quy chiếu về Đức Giê-su trong ngữ cảnh trước; nhắc lại danh xưng giúp câu tiếng Việt đứng độc lập rõ nghĩa.
theological_decisions:
- issue: Cách gọi ngày sa-bát
  choice: ngày sa-bát
  alternative: các ngày sa-bát
  rationale: Số nhiều σάββασιν có thể mang chức năng thành ngữ chỉ một ngày sa-bát; lựa chọn số ít theo văn cảnh, không hàm ý lập trường giáo phái.
- issue: Ý nghĩa của ὁδὸν ποιεῖν trong cuộc tranh luận về ngày sa-bát
  choice: vừa đi vừa ngắt
  alternative: bắt đầu mở đường bằng cách ngắt
  rationale: Bản dịch không biến hành động thành việc xây hay mở đường, nhưng vẫn giữ mối liên hệ giữa sự di chuyển và việc ngắt bông lúa, là hành động dẫn tới lời chất vấn ở câu sau.
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “sa-bát” theo lối phiên âm quen thuộc; dùng “Ngài” cho đại từ quy chiếu về Đức Giê-su. “Cánh đồng lúa/bông lúa” được chọn vì tự nhiên trong tiếng Việt, nhưng chú thích làm rõ nguyên ngữ nói rộng hơn về ngũ cốc.
