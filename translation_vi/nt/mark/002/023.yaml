  source_fidelity: Bản nháp truyền đạt đúng bối cảnh ngày sa-bát, việc Đức Giê-su đi qua ruộng và các môn đồ bứt bông. Tuy nhiên, “Có một ngày sa-bát” thêm nghĩa ‘một ngày’ không có trong công thức tự sự ἐγένετο, và “vừa đi vừa” làm mất động từ ἤρξαντο (‘bắt đầu’). “Lúa” cũng thường chỉ lúa gạo trong tiếng Việt, trong khi σπόριμα/στάχυας không xác định một loại ngũ cốc riêng.
  naturalness: Câu sửa giữ văn phong kể chuyện hiện đại, rõ ràng và trang trọng vừa phải. “Bắt đầu đi qua ruộng, vừa bứt...” diễn đạt tự nhiên hành động đồng thời mà không gợi ý họ xây hay mở một con đường.
  terminology: Giữ “Đức Giê-su,” “môn đồ,” và “ngày sa-bát” phù hợp văn phong Kinh Thánh tiếng Việt. Dùng “ngũ cốc” để không thu hẹp các thuật ngữ Hy Lạp vào lúa gạo.
