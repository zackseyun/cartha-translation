  yaml_path: translation/nt/mark/002/003.yaml
  text: And they came[a], bringing to him a paralyzed man carried by four.
translation:
  language: vi
  text: Họ đến, đưa một người bại liệt đến với Chúa Giê-su; người ấy được bốn người khiêng.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn Hy Lạp chỉ nói “bởi bốn [người]”; danh từ “người” được hiểu ngầm.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Họ đến
  rationale: Trong tiếng Việt, không nhất thiết phải dịch liên từ mở đầu bằng “và”; mạch nối tiếp vẫn rõ, còn câu văn tự nhiên hơn.
- source_word: ἔρχονται
  choice: đến
  rationale: Đây là hiện tại lịch sử trong lời kể Hy Lạp; tiếng Việt kể chuyện tự nhiên bằng động từ không đánh dấu thì.
- source_word: φέροντες
  choice: đem tới
  rationale: Diễn tả hành động đi kèm với “đến” và hướng về Đức Chúa Jêsus, đồng thời tránh lặp “khiêng” vốn dùng cho αἰρόμενον.
- source_word: πρὸς αὐτὸν
  choice: tới cho Đức Chúa Jêsus
  rationale: Đại từ chỉ về Đức Chúa Jêsus trong ngữ cảnh; nêu rõ tên giúp câu tiếng Việt tự nhiên và tránh mơ hồ.
- source_word: παραλυτικὸν
  choice: một người bị bại liệt
  rationale: Tính từ được dùng như danh từ; cách diễn đạt này rõ nghĩa, hiện đại và đặt con người trước tình trạng bệnh.
- source_word: αἰρόμενον
  choice: khiêng
  rationale: Phân từ bị động nói rằng người ấy được những người khác nâng và mang đi; “do ... khiêng” diễn đạt gọn, tự nhiên.
- source_word: ὑπὸ τεσσάρων
  choice: do bốn người
  rationale: Hy Lạp chỉ nói sát chữ là “bởi bốn”; tiếng Việt cần danh từ được hiểu ngầm để câu tự nhiên. “Người” không xác định giới tính, tránh thêm chi tiết “đàn ông” không có trong nguyên văn.
