  rationale: Sửa chính tả tên riêng theo tiếng Việt hiện đại, thay cấu trúc chuyển động bằng cách nói tự nhiên hơn, và tách mệnh đề “được bốn người khiêng” để cho thấy rõ đây là thông tin bổ nghĩa về người bại liệt. Chú thích giữ lại tính lược của nguyên văn Hy Lạp mà vẫn cho phép câu tiếng Việt tự nhiên.
