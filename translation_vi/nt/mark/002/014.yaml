  text: καὶ παράγων εἶδεν Λευὶν τὸν τοῦ Ἁλφαίου καθήμενον ἐπὶ τὸ τελώνιον, καὶ λέγει αὐτῷ· Ἀκολούθει μοι. καὶ ἀναστὰς ἠκολούθησεν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/014.yaml
  text: And as he was passing by[a], he saw Levi the son of Alphaeus sitting at the tax booth, and he says to him, “Follow me.” And he rose and followed him.
translation:
  language: vi
  text: 'Khi đang đi ngang qua, Đức Giê-su thấy Lê-vi, con của An-phê, đang ngồi tại quầy thu thuế[a]. Ngài nói với ông: “Hãy theo ta.” Ông đứng dậy và đi theo Ngài.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “quầy thu thuế quan”. Từ Hy Lạp chỉ nơi thu thuế, thuế quan hoặc các lệ phí tương tự.
    reason: lexical_alternative
lexical_decisions:
- source_word: παράγων
  choice: khi đang đi ngang qua
  rationale: Phân từ hiện tại diễn tả hành động đang diễn ra đồng thời với việc Đức Giê-su nhìn thấy Lê-vi; cách dịch này tự nhiên và giữ được sắc thái tiếp diễn.
- source_word: εἶδεν
  choice: thấy
  rationale: Dịch trực tiếp động từ ὁράω, không thêm sắc thái diễn giải như “để ý thấy”.
- source_word: Λευὶν
  choice: Lê-vi
  rationale: Phiên âm tên riêng theo cách dùng quen thuộc trong tiếng Việt.
- source_word: τὸν τοῦ Ἁλφαίου
  choice: con ông An-phê
  rationale: Cấu trúc sở hữu chỉ quan hệ cha con; tiếng Việt cần nêu rõ “con”, còn “ông” giúp câu tự nhiên và tôn trọng nhân vật.
- source_word: καθήμενον
  choice: đang ngồi
  rationale: Giữ sắc thái hiện tại của phân từ, mô tả tư thế của Lê-vi lúc được nhìn thấy.
- source_word: ἐπὶ τὸ τελώνιον
  choice: tại trạm thu thuế
  rationale: τελώνιον chỉ nơi thu thuế hoặc thuế quan; “trạm thu thuế” cụ thể, tự nhiên và không giới hạn quá mức vào một loại lệ phí.
- source_word: λέγει
  choice: Ngài nói
  rationale: Tiếng Việt thường kể chuyện bằng thì không đánh dấu hình thái; “nói” giữ được sự sống động của hiện tại lịch sử mà không cần thêm dấu hiệu thời quá khứ.
- source_word: Ἀκολούθει μοι
  choice: Hãy theo ta
  rationale: Mệnh lệnh trực tiếp, giữ nguyên động từ “theo” và không thêm ý “hãy đến” vốn không có trong Hy Lạp.
- source_word: ἀναστὰς
  choice: đứng dậy
  rationale: Diễn tả tự nhiên hành động xảy ra trước việc đi theo.
- source_word: ἠκολούθησεν αὐτῷ
  choice: đi theo Ngài
  rationale: Giữ liên hệ từ vựng với mệnh lệnh của Đức Giê-su và diễn đạt tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Thì hiện tại lịch sử trong lời kể của Mác
  choice: Dùng “Ngài nói” mà không thêm dấu hiệu quá khứ, phù hợp với đặc điểm không biến đổi theo thì của động từ tiếng Việt.
  alternative: Dùng “Ngài đã nói” để quy toàn bộ lời kể về quá khứ.
  rationale: Bản Hy Lạp chuyển sang hiện tại lịch sử λέγει nhằm làm lời kể sinh động. Tiếng Việt có thể giữ hiệu quả này bằng động từ trần không có “đã”, đồng thời vẫn tự nhiên.
- issue: Sắc thái của mệnh lệnh Ἀκολούθει μοι
  choice: Dịch trực tiếp “Hãy theo ta”, không diễn giải thành một công thức thần học về tư cách môn đồ.
  alternative: “Hãy trở thành môn đồ của ta.”
  rationale: “Theo” bảo toàn cả nghĩa hành động cụ thể trong ngữ cảnh lẫn hàm ý rộng hơn, không thu hẹp hay mở rộng điều bản văn nói.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Đức Giê-su” theo lối gọi kính trọng quen thuộc; “Ngài/ta” giúp phân biệt rõ Đức Giê-su với Lê-vi và duy trì sắc thái trang nghiêm. Câu được chia tự nhiên nhưng vẫn giữ trình tự hành động của nguyên văn.
