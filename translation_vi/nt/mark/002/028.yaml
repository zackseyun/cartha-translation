  text: ὥστε κύριός ἐστιν ὁ υἱὸς τοῦ ἀνθρώπου καὶ τοῦ σαββάτου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/028.yaml
  text: So the Son of Man is Lord even of the Sabbath[a].
translation:
  language: vi
  text: Vì thế, Con Người là Chúa của cả ngày Sa-bát[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Vì thế, Con Người cũng là Chúa của ngày Sa-bát.” Liên từ Hy Lạp có thể mang nghĩa đơn giản là “cũng/và”, nhưng tại đây có lẽ mang nghĩa “ngay cả”, nhấn mạnh phạm vi quyền chủ tể của Con Người.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: Vì thế
  rationale: Diễn đạt kết luận rút ra từ lập luận ngay trước đó, tự nhiên trong tiếng Việt hiện đại mà vẫn giữ quan hệ suy luận.
- source_word: κύριος
  choice: Chúa
  rationale: Giữ nghĩa về quyền chủ tể và sức nặng Kitô học của lời tuyên bố; viết hoa vì chỉ về Con Người.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Con Người
  rationale: Giữ danh xưng quen thuộc của Đức Giê-su trong các sách Tin Mừng, đồng thời bảo toàn âm hưởng liên văn bản và sự căng thẳng thần học của cụm từ.
- source_word: καὶ
  choice: ngay cả
  rationale: Trong ngữ cảnh này, καί có thể mang sắc thái tăng tiến, nhấn mạnh rằng quyền chủ tể của Con Người bao gồm cả ngày Sa-bát; cách hiểu đơn giản là “cũng” vẫn được ghi ở chú thích.
- source_word: σαββάτου
  choice: ngày Sa-bát
  rationale: Cách gọi rõ ràng, tự nhiên trong tiếng Việt cho ngày nghỉ thánh đang là trọng tâm của cuộc tranh luận.
theological_decisions:
- issue: Sức nặng Kitô học của lời khẳng định về thẩm quyền đối với ngày Sa-bát
  choice: Dịch trực tiếp rằng Con Người là Chúa của ngày Sa-bát.
  alternative: Diễn đạt nhẹ hơn là “có thẩm quyền đối với ngày Sa-bát”.
  rationale: κύριος biểu thị quyền chủ tể, không chỉ một sự cho phép giới hạn; cách dịch này giữ nguyên sức mạnh của lời tuyên bố mà không thêm lời giải thích giáo lý.
- issue: Đối tượng quy chiếu của danh xưng “Con Người”
  choice: Giữ “Con Người” như một danh xưng của Đức Giê-su.
  alternative: Diễn ý là “con người” theo nghĩa chung hoặc “Đấng mang thân phận người”.
  rationale: Trong Mác, cụm từ này hoạt động như danh xưng Đức Giê-su dùng để nói về chính mình và có thể gợi Đa-ni-ên; cần giữ nguyên độ mở và sức căng đó.
translation_notes:
  register: Văn phong trang trọng, sáng rõ và hiện đại. “Con Người” và “Chúa” được viết hoa như các danh xưng; “ngay cả của ngày Sa-bát” ưu tiên độ sát với cấu trúc sở hữu của nguyên văn, dù hơi trang trọng hơn khẩu ngữ.
