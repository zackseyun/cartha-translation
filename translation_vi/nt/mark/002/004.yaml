revisions:
- from: Vì đám đông cản lối, họ không thể đưa người bại liệt đến với Đức Chúa Jêsus, nên họ dỡ mái nhà ngay chỗ Ngài đang ở. Sau khi đào thủng mái, họ hạ chiếc chõng có người bại liệt đang nằm xuống.[a]
  to: Vì đám đông cản lối, họ không thể đưa người bại liệt đến với Đức Chúa Jêsus; vì thế họ dỡ mái nhà phía trên chỗ Ngài đang ở. Sau khi đào thủng mái, họ hạ tấm đệm mà người bại liệt đang nằm trên đó xuống[a].
  rationale: Việc sửa chỉ thay từ “chõng” bằng cách gọi trung tính, phù hợp hơn với κράβαττος, và làm rõ vị trí của phần mái so với Đức Chúa Jêsus. Trình tự, quan hệ nhân quả, và tính sinh động của hành động trong nguyên văn đều được giữ nguyên.
  reviewer_model: gpt-5.6-terra
