review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch truyền đạt đúng chuỗi hành động và quan hệ nhân quả: vì đám đông nên họ không thể đưa người bại liệt đến với Đức Chúa Jêsus, rồi dỡ mái, đào thủng, và hạ vật nằm xuống. Tuy nhiên, “chiếc chõng” thường chỉ một phản/giường gỗ thấp có chân, không phải cách tương đương an toàn nhất cho κράβαττος, là vật nằm đơn sơ, có thể mang và hạ xuống.'
  naturalness: Câu văn nhìn chung tự nhiên, trang trọng vừa phải. “Tấm đệm mà người bại liệt đang nằm trên đó” làm rõ tự nhiên rằng mệnh đề quan hệ bổ nghĩa cho κράβαττον; “phía trên chỗ Ngài đang ở” diễn đạt quan hệ không gian vốn được ngữ cảnh mái nhà hàm ý.
  terminology: Giữ “người bại liệt” là cách gọi rõ ràng, phù hợp văn cảnh. Giữ cách gọi “Đức Chúa Jêsus” và đại từ tôn kính “Ngài” theo đăng ký của bản thảo. Đổi κράβαττον thành “tấm đệm” để tránh sắc thái văn hóa và hình dáng quá cụ thể của “chõng”.
  issues:
  - severity: medium
    issue: “Chiếc chõng” cho κράβαττον quá cụ thể và không phù hợp nhất.
    rationale: Chõng trong tiếng Việt thường là đồ gỗ thấp, có chân, trong khi κράβαττος chỉ vật nằm đơn sơ như tấm đệm, chiếu, hay giường xếp/pallet. “Tấm đệm” giữ được tính đơn sơ và có thể hạ xuống mà không áp đặt loại vật dụng.
  - severity: low
    issue: Vị trí của mái so với Đức Chúa Jêsus cần được diễn đạt rõ hơn.
    rationale: “Ngay chỗ Ngài đang ở” có thể nghe như Ngài ở trên mái. Thêm “phía trên” chỉ làm tường minh quan hệ không gian do ngữ cảnh mái nhà đòi hỏi, không thêm chi tiết lịch sử về cấu tạo mái.
  revised_text: Vì đám đông cản lối, họ không thể đưa người bại liệt đến với Đức Chúa Jêsus; vì thế họ dỡ mái nhà phía trên chỗ Ngài đang ở. Sau khi đào thủng mái, họ hạ tấm đệm mà người bại liệt đang nằm trên đó xuống[a].
