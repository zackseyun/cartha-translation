base_translation:
  language: en
  yaml_path: translation/nt/mark/002/004.yaml
  text: And not being able to bring him to him because of the crowd[a], they removed the roof where he was, and after digging through it[c][b], they lower the mat on which the paralyzed man was lying.
translation:
  language: vi
  text: Vì đám đông cản lối, họ không thể đưa người bại liệt đến với Đức Chúa Jêsus; vì thế họ dỡ mái nhà phía trên chỗ Ngài đang ở. Sau khi đào thủng mái, họ hạ tấm đệm mà người bại liệt đang nằm trên đó xuống[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “họ thả tấm đệm xuống.”'
    reason: Động từ Hy Lạp χαλάω có thể mang nghĩa “hạ xuống” hoặc “thả xuống” trong văn cảnh này.
lexical_decisions:
- source_word: μὴ δυνάμενοι προσενέγκαι αὐτῷ διὰ τὸν ὄχλον
  choice: Vì đám đông cản lối, họ không thể đưa người bại liệt đến với Đức Chúa Jêsus
  rationale: Cấu trúc phân từ nêu hoàn cảnh dẫn đến hành động tiếp theo. Tiếng Việt cần nêu rõ hai đối tượng của các đại từ để tránh câu lặp và mơ hồ không tự nhiên; danh tính của họ đã rõ trong văn cảnh.
- source_word: ἀπεστέγασαν τὴν στέγην ὅπου ἦν
  choice: họ dỡ mái nhà ngay chỗ Ngài đang ở
  rationale: Động từ hiếm ἀποστεγάζω chỉ việc tháo hoặc mở phần mái; “dỡ mái nhà” tự nhiên và không hàm ý phá bỏ toàn bộ mái. “Ngay chỗ” diễn đạt vị trí tương ứng theo chiều dọc mà ngữ cảnh mái nhà cho thấy.
- source_word: ἐξορύξαντες
  choice: sau khi đào thủng mái
  rationale: Động từ diễn tả việc đào xuyên hoặc khoét qua vật liệu mái; cách dịch này giữ hình ảnh cụ thể mà không xác định vật liệu.
- source_word: χαλῶσι
  choice: họ hạ ... xuống
  rationale: Hiện tại lịch sử trong tiếng Hy Lạp tạo tính sinh động, nhưng kể ở quá khứ theo mạch tiếng Việt tự nhiên hơn; “hạ ... xuống” chuyển tải đúng chuyển động.
- source_word: κράβαττον
  choice: chiếc chõng
  rationale: Từ này chỉ một vật nằm đơn sơ, có thể mang đi, không phải chiếc giường lớn; “chõng” phù hợp với việc khiêng và thả xuống, đồng thời tự nhiên trong tiếng Việt.
- source_word: ὁ παραλυτικὸς
  choice: người bại liệt
  rationale: Danh từ hóa của tính từ chỉ người bị liệt; “người bại liệt” là cách gọi rõ ràng, thông dụng và trang trọng vừa phải.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện hiện đại, rõ ràng và trang nghiêm. Dùng “Đức Chúa Jêsus” để xác định đối tượng của đại từ αὐτῷ theo văn cảnh; viết hoa “Ngài” theo lối xưng hô tôn kính phổ biến. Tránh lối dịch máy móc “đưa ông ấy đến với ông ấy” vốn khó hiểu trong tiếng Việt.
