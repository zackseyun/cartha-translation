revisions:
- from: 'Đức Giê-su nói với họ: “Chẳng lẽ những người dự tiệc cưới lại có thể kiêng ăn khi chàng rể còn ở với họ sao? Bao lâu họ còn có chàng rể ở với mình, họ không thể kiêng ăn.”'
  to: 'Giê-su nói với họ: “Chẳng lẽ những người dự tiệc cưới lại có thể kiêng ăn khi chàng rể còn ở với họ sao? Bao lâu họ còn có chàng rể ở với mình, họ không thể kiêng ăn.”'
  rationale: 'Chỉ bỏ tôn xưng “Đức”, vì đó là phần bổ sung không được biểu thị trong nguyên văn. Các lựa chọn còn lại giữ đúng cấu trúc và sắc thái của tiếng Hy Lạp: câu hỏi tu từ phủ định, thời gian “khi/b bao lâu”, và động từ “có” ở mệnh đề sau. Thêm chú thích từ vựng để bảo tồn khả năng tiếp cận thành ngữ οἱ υἱοὶ τοῦ νυμφῶνος mà không thay đổi nghĩa chính văn.'
