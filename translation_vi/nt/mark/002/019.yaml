  source_fidelity: Bản dịch truyền đạt đúng câu hỏi tu từ phủ định, ý thời gian, động từ “có” trong mệnh đề thứ hai, và hình ảnh chàng rể. Tuy nhiên, “Đức” trước tên Giê-su là tôn xưng không có trong nguyên văn, trong khi văn bản nguồn chỉ ghi tên ὁ Ἰησοῦς (“Giê-su”).
  naturalness: Văn phong tự nhiên, rõ nghĩa và phù hợp tiếng Việt hiện đại. “Chẳng lẽ ... sao?” thể hiện tốt sắc thái câu hỏi tu từ; “kiêng ăn” phù hợp ngữ cảnh. “Những người dự tiệc cưới” là cách chuyển nghĩa dễ hiểu của thành ngữ Hy Lạp.
  terminology: “Chàng rể” giữ được hình ảnh νυμφίος mà không diễn giải thần học. Nên dùng “Giê-su” thay vì “Đức Giê-su” để tránh thêm tôn xưng vào chính văn. Chú thích từ vựng cho “người dự tiệc cưới” giúp người đọc thấy thành ngữ nguồn mà không làm chính văn tối nghĩa.
