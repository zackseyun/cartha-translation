source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτοῖς ὁ Ἰησοῦς· Μὴ δύνανται οἱ υἱοὶ τοῦ νυμφῶνος ἐν ᾧ ὁ νυμφίος μετ’ αὐτῶν ἐστιν νηστεύειν; ὅσον χρόνον ⸂ἔχουσιν τὸν νυμφίον μετ’ αὐτῶν⸃ οὐ δύνανται νηστεύειν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/019.yaml
  text: And Jesus said to them[a], “The wedding guests cannot fast while the bridegroom is with them, can they? As long as they have the bridegroom with them, they cannot fast.”
translation:
  language: vi
  text: 'Giê-su nói với họ: “Chẳng lẽ những người dự tiệc cưới lại có thể kiêng ăn khi chàng rể còn ở với họ sao? Bao lâu họ còn có chàng rể ở với mình, họ không thể kiêng ăn.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μὴ δύνανται ... νηστεύειν;
  choice: Chẳng lẽ ... lại có thể kiêng ăn ... sao?
  rationale: Μή mở đầu câu hỏi tu từ và dự liệu câu trả lời phủ định. Cấu trúc “Chẳng lẽ... sao?” truyền đạt tự nhiên sắc thái ấy trong tiếng Việt.
- source_word: οἱ υἱοὶ τοῦ νυμφῶνος
  choice: những người dự tiệc cưới
  rationale: Đây là thành ngữ, theo nghĩa đen là “các con trai của phòng cưới/hôn phòng”, chỉ những người tham dự cuộc mừng cưới, đặc biệt là những người đồng hành với chàng rể. Cách dịch theo chức năng xã hội tránh một thành ngữ tối nghĩa trong tiếng Việt mà không thu hẹp quá mức thành “phù rể”.
- source_word: ἐν ᾧ ... ἐστιν
  choice: khi ... còn ở với họ
  rationale: Cấu trúc mang nghĩa thời gian trong văn cảnh. Từ “còn” làm rõ tình trạng đang tiếp diễn mà không thêm ý ngoài câu.
- source_word: ὁ νυμφίος / τὸν νυμφίον
  choice: chàng rể
  rationale: Giữ nguyên hình ảnh ẩn dụ về chàng rể bằng cách diễn đạt quen thuộc, trang trọng vừa phải trong tiếng Việt hiện đại.
- source_word: ὅσον χρόνον
  choice: Bao lâu
  rationale: Diễn đạt trực tiếp khoảng thời gian kéo dài và tương ứng tự nhiên với thành ngữ Hy Lạp.
- source_word: ἔχουσιν τὸν νυμφίον μετ’ αὐτῶν
  choice: họ còn có chàng rể ở với mình
  rationale: Giữ động từ ἔχουσιν, “có”, thay vì giản lược thành “chàng rể còn ở với họ”; “ở với mình” quy chiếu tự nhiên về chủ ngữ “họ” trong tiếng Việt.
- source_word: καὶ εἶπεν αὐτοῖς ὁ Ἰησοῦς
  choice: Đức Giê-su nói với họ
  rationale: Lối dẫn truyện rõ ràng, tự nhiên. Không nhất thiết dịch καί bằng “và” khi câu tiếng Việt đứng độc lập; quan hệ tiếp nối vẫn được bảo toàn theo văn cảnh.
theological_decisions:
- issue: Việc dùng hình ảnh chàng rể để chỉ Đức Giê-su
  choice: Giữ nguyên ẩn dụ “chàng rể” mà không giải thích danh tính hoặc ý nghĩa thần học ngay trong chính văn.
  alternative: Diễn giải rõ rằng Đức Giê-su tự ví mình với chàng rể mang ý nghĩa Mê-si-a.
  rationale: Nguyên văn để hàm ý này vận hành qua hình ảnh chứ không phát biểu thành một mệnh đề thần học. Bản dịch vì thế bảo tồn hình ảnh và để ngỏ việc giải thích.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “Đức Giê-su” theo văn phong Kinh Thánh phổ biến; “kiêng ăn” rõ nghĩa trong ngữ cảnh tôn giáo. Thành ngữ Hy Lạp được chuyển nghĩa trong chính văn nên không cần chú thích bắt buộc; không có dấu chú thích vì không kèm chú thích.
