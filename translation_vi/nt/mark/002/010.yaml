source:
  edition: SBLGNT
  text: ἵνα δὲ εἰδῆτε ὅτι ἐξουσίαν ἔχει ὁ υἱὸς τοῦ ἀνθρώπου ⸂ἐπὶ τῆς γῆς ἀφιέναι ἁμαρτίας⸃— λέγει τῷ παραλυτικῷ·
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/010.yaml
  text: But so that you may know that the Son of Man has authority on earth to forgive sins—he says to the paralyzed man[b][a],
translation:
  language: vi
  text: “Nhưng để các ông biết rằng Con Người[a] có thẩm quyền tha tội trên đất”—Ngài nói với người bại liệt[b]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cụm từ Hy Lạp dịch là “Con Người” cũng có thể mang nghĩa thành ngữ là “con người” hoặc “phàm nhân,” đồng thời có thể gợi đến Đa-ni-ên 7.
    reason: alternative_reading
  - marker: b
    text: 'Hoặc: “người bị liệt.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα δὲ εἰδῆτε
  choice: Nhưng để các ông biết rằng
  rationale: “Nhưng” thể hiện sắc thái chuyển ý nhẹ của δέ, còn “để… biết” giữ quan hệ mục đích của ἵνα với động từ εἰδῆτε. “Các ông” diễn đạt ngôi thứ hai số nhiều trong ngữ cảnh Chúa Giê-su đang đáp lại các kinh sư.
- source_word: ἐξουσίαν ἔχει
  choice: có thẩm quyền
  rationale: “Thẩm quyền” diễn đạt quyền chính đáng để hành động, phù hợp hơn từ chỉ khả năng đơn thuần trong ngữ cảnh tha tội.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Con Người
  rationale: Giữ danh xưng quen thuộc của Chúa Giê-su và không thu hẹp sự đa nghĩa giữa ý nghĩa liên quan đến nhân tính với âm hưởng của Đa-ni-ên 7.
- source_word: ἐπὶ τῆς γῆς
  choice: trên đất
  rationale: Cách nói tự nhiên, sát nghĩa, chỉ phạm vi trần thế nơi thẩm quyền ấy được thi hành.
- source_word: ἀφιέναι ἁμαρτίας
  choice: tha tội
  rationale: Đây là cách diễn đạt tiếng Việt rõ ràng và chuẩn xác cho nghĩa xóa bỏ hoặc miễn tội của ἀφίημι trong ngữ cảnh này.
- source_word: λέγει τῷ παραλυτικῷ
  choice: Ngài nói với người bại liệt
  rationale: “Nói” giữ sắc thái thông thường của λέγει và thì hiện tại lịch sử; “người bại liệt” là cách gọi tự nhiên, dễ hiểu cho danh từ hóa παραλυτικός.
theological_decisions:
- issue: Cách dịch danh xưng ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Con Người
  alternative: con người/phàm nhân
  rationale: “Con Người” bảo toàn danh xưng truyền thống và khả năng gợi đến Đa-ni-ên 7, trong khi chú thích ghi nhận nghĩa thành ngữ liên quan đến thân phận con người mà không quyết định thay độc giả.
- issue: Ý nghĩa của ἐξουσία đối với việc tha tội
  choice: thẩm quyền
  alternative: quyền năng; quyền
  rationale: Mạch văn nhấn mạnh đặc quyền chính đáng của Chúa Giê-su trong việc tha tội, chứ không chỉ khả năng thực hiện một hành động.
translation_notes:
  register: Bản dịch dùng tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dấu gạch ngang giữ nguyên cấu trúc câu bị lời người kể chuyện xen vào và còn tiếp nối ở câu sau; không tự ý hoàn tất lời phán trong phạm vi câu này. Các dấu chú thích [a] và [b] đều được đặt ngay sau từ ngữ liên quan trong chính văn.
