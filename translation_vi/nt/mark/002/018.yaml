revisions:
- from: 'Các môn đồ của Giăng và những người Pha-ri-si đang kiêng ăn. Họ đến và nói với Đức Chúa Jêsus[a]: “Tại sao các môn đồ của Giăng và các môn đồ của người Pha-ri-si kiêng ăn, còn môn đồ của thầy lại không kiêng ăn?”'
  to: 'Các môn đệ của Giăng và các Pha-ri-si đang kiêng ăn. Họ đến và nói với Ngài[a]: “Tại sao các môn đệ của Giăng và các môn đệ của các Pha-ri-si kiêng ăn, còn các môn đệ của thầy lại không kiêng ăn?”'
  rationale: Bản sửa loại bỏ tước hiệu không được nêu trong nguyên văn, chỉnh cách chỉ nhóm Pha-ri-si sang số nhiều, và dùng thuật ngữ hiện đại “môn đệ”. Vẫn giữ “Họ đến và nói” cùng chú thích để không xác định chủ thể của các động từ hiện tại lịch sử. “Thầy” trong lời hỏi trực tiếp giữ sắc thái quan hệ thầy–môn đệ tự nhiên của tiếng Việt mà không áp đặt một tuyên xưng thần học.
