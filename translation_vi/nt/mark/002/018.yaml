  terminology: Giữ “Giăng”, “Pha-ri-si”, và “kiêng ăn”. Đổi “môn đồ” thành “môn đệ” cho tiếng Việt hiện đại. Không dùng “Đức Chúa Jêsus” tại đây, vì đó là sự bổ sung tước hiệu; chú thích cũng cần được điều chỉnh tương ứng.
