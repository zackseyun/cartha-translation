  source_fidelity: 'Bản dịch phản ánh đúng cấu trúc chính: các môn đệ của Giăng và các Pha-ri-si đang kiêng ăn; câu hỏi đối chiếu tập quán kiêng ăn của các môn đệ Giăng và Pha-ri-si với các môn đệ của người được hỏi. Tuy nhiên, αὐτῷ chỉ là đại từ “với Ngài/người ấy”; việc thay bằng “Đức Chúa Jêsus” thêm một tước hiệu không có trong câu này.'
