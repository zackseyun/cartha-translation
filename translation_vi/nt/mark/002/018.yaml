  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Καὶ ἦσαν οἱ μαθηταὶ Ἰωάννου καὶ οἱ ⸀Φαρισαῖοι νηστεύοντες. καὶ ἔρχονται καὶ λέγουσιν αὐτῷ· Διὰ τί οἱ μαθηταὶ Ἰωάννου καὶ οἱ ⸀μαθηταὶ τῶν Φαρισαίων νηστεύουσιν, οἱ δὲ σοὶ μαθηταὶ οὐ νηστεύουσιν;
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/018.yaml
  text: John's disciples and the Pharisees were fasting. And they come and say to him[a], "Why do John's disciples and the disciples of the Pharisees fast, but your disciples do not fast?"
translation:
  language: vi
  text: 'Các môn đệ của Giăng và các Pha-ri-si đang kiêng ăn. Họ đến và nói với Ngài[a]: “Tại sao các môn đệ của Giăng và các môn đệ của các Pha-ri-si kiêng ăn, còn các môn đệ của thầy lại không kiêng ăn?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Có người đến nói với Ngài.” Tiếng Hy Lạp không nêu chủ thể của các động từ “đến” và “nói”.'
    reason: Giữ tính mơ hồ của chủ thể bị lược trong nguyên văn Hy Lạp.
lexical_decisions:
- source_word: ἦσαν ... νηστεύοντες
  choice: đang kiêng ăn
  rationale: Cấu trúc περιφραστική với động từ ‘là’ ở thì chưa hoàn thành và phân từ hiện tại diễn tả hành động đang diễn ra trong quá khứ; tiếng Việt dùng ‘đang’ để thể hiện tự nhiên sắc thái này.
- source_word: οἱ μαθηταὶ Ἰωάννου
  choice: các môn đồ của Giăng
  rationale: Cách diễn đạt tự nhiên, giữ rõ quan hệ liên thuộc của sở hữu cách.
- source_word: οἱ Φαρισαῖοι
  choice: những người Pha-ri-si
  rationale: Dùng tên gọi đã quen thuộc trong tiếng Việt và thêm ‘những người’ để chỉ rõ nhóm người.
- source_word: ἔρχονται καὶ λέγουσιν
  choice: Họ đến và nói
  rationale: Giữ thì hiện tại lịch sử của văn phong Mác qua cách kể tiếng Việt không đánh dấu thì; đại từ ‘họ’ không xác định cụ thể danh tính chủ thể.
- source_word: αὐτῷ
  choice: với Đức Chúa Jêsus
  rationale: Nêu rõ quy chiếu của đại từ để tiếng Việt tự nhiên; danh xưng này phù hợp văn phong Kinh Thánh tiếng Việt, nhưng không xác định thêm danh tính của chủ thể ngầm.
- source_word: Διὰ τί
  choice: Tại sao
  rationale: Cách hỏi nguyên nhân thông dụng, chính xác và tự nhiên trong tiếng Việt.
- source_word: οἱ μαθηταὶ τῶν Φαρισαίων
  choice: các môn đồ của người Pha-ri-si
  rationale: Giữ quan hệ sở hữu/liên thuộc và phản ánh sự chuyển từ toàn nhóm Pha-ri-si ở mệnh đề đầu sang các môn đồ thuộc nhóm ấy.
- source_word: νηστεύουσιν
  choice: kiêng ăn
  rationale: Hiện tại có thể chỉ tập quán; tiếng Việt không cần thêm ‘đang’, nhờ đó không giới hạn ý nghĩa vào đúng thời điểm nói.
- source_word: οἱ δὲ σοὶ μαθηταὶ
  choice: còn môn đồ của thầy
  rationale: ‘Còn’ thể hiện sự tương phản của δέ; ‘của thầy’ là cách xưng hô tự nhiên trong lời hỏi trực tiếp và không thêm tước hiệu thần học.
theological_decisions:
- issue: Danh tính của chủ thể trong ἔρχονται καὶ λέγουσιν
  choice: Dịch là ‘Họ đến và nói’ nhưng không xác định ‘họ’ là nhóm nào; kèm chú thích về chủ thể bị lược.
  alternative: ‘Có người đến nói với Ngài’ hoặc xác định họ là các môn đồ hay người Pha-ri-si.
  rationale: Bản Hy Lạp không nêu chủ thể của hai động từ. Việc xác định một nhóm cụ thể sẽ làm mất tính mơ hồ thật sự của nguyên văn.
- issue: Cách gọi Đức Chúa Jêsus trong lời trần thuật và lời nói trực tiếp
  choice: Trong lời trần thuật dùng ‘Đức Chúa Jêsus’; trong câu hỏi dùng ‘thầy’.
  alternative: Dùng ‘Ngài’ và ‘môn đồ của Ngài’, hoặc ‘Thầy’ viết hoa.
  rationale: Quy chiếu của αὐτῷ theo ngữ cảnh là Đức Chúa Jêsus; ‘thầy’ trong lời nói trực tiếp truyền đạt quan hệ thầy–trò mà không áp đặt thêm một lời tuyên xưng thần học từ phía người hỏi.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng ‘môn đồ’, ‘kiêng ăn’, ‘Giăng’, ‘Pha-ri-si’ và ‘Đức Chúa Jêsus’ theo lối thuật ngữ Kinh Thánh tiếng Việt quen thuộc; câu hỏi dùng ‘thầy’ tự nhiên trong ngữ cảnh đối thoại.
