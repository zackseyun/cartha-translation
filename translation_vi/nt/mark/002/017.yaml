reference: Mark 2:17
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἀκούσας ὁ Ἰησοῦς λέγει αὐτοῖς ⸀ὅτι Οὐ χρείαν ἔχουσιν οἱ ἰσχύοντες ἰατροῦ ἀλλ’ οἱ κακῶς ἔχοντες· οὐκ ἦλθον καλέσαι δικαίους ἀλλὰ ⸀ἁμαρτωλούς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/017.yaml
  text: And when Jesus heard it, he says to them, “Those who are strong have no need of a physician, but those who are sick. I did not come to call the righteous, but sinners.”
translation:
  language: vi
  text: 'Khi nghe vậy, Đức Giê-su nói với họ: “Người khỏe mạnh[a] không cần thầy thuốc, nhưng người đau yếu thì cần. Tôi không đến để kêu gọi người công chính[b], nhưng người tội lỗi.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn cũng có thể dịch sát hơn là “người mạnh” hoặc “người có sức”; trong ngữ cảnh thầy thuốc, ý chỉ người khỏe mạnh.
    reason: lexical_alternative
  - marker: b
    text: Trong ngữ cảnh, “người công chính” có thể được hiểu với sắc thái mỉa mai, tức những người được xem là công chính hoặc tự cho mình là công chính; nguyên văn chỉ nói “người công chính”.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀκούσας
  choice: Khi nghe vậy
  rationale: Phân từ bất định diễn tả hành động xảy ra trước động từ chính; cách dịch này tự nhiên trong tiếng Việt. “Vậy” bổ sung đối tượng hàm ẩn từ ngữ cảnh.
- source_word: λέγει
  choice: nói
  rationale: Hiện tại lịch sử của Mác được diễn đạt tự nhiên bằng “nói”; tiếng Việt không bắt buộc đánh dấu thì quá khứ nên vẫn giữ được sắc thái sống động.
- source_word: οἱ ἰσχύοντες
  choice: người khỏe mạnh
  rationale: Trong thế đối lập với người đau yếu và trong hình ảnh thầy thuốc, cụm này chỉ người có sức khỏe tốt; chú thích bảo lưu nghĩa sát chữ là mạnh khỏe/có sức.
- source_word: ἰατροῦ
  choice: thầy thuốc
  rationale: Cách gọi tự nhiên, trang trọng và phổ thông trong tiếng Việt, phù hợp giọng điệu của lời ví von.
- source_word: οἱ κακῶς ἔχοντες
  choice: người đau yếu
  rationale: Thành ngữ Hy Lạp chỉ những người ở trong tình trạng không tốt, thường mang nghĩa đau ốm; “đau yếu” tạo đối lập rõ với “khỏe mạnh”.
- source_word: καλέσαι
  choice: kêu gọi
  rationale: Giữ được nghĩa rộng của lời gọi hoặc triệu gọi mà không thu hẹp thành chỉ mời mọc.
- source_word: δικαίους
  choice: người công chính
  rationale: Giữ nguyên phạm trù đạo đức-tôn giáo của nguyên văn, không giải thích ngay trong câu rằng họ chỉ tự cho mình là công chính.
- source_word: ἁμαρτωλούς
  choice: người có tội
  rationale: Cách diễn đạt hiện đại, dễ hiểu cho tính từ được danh từ hóa, đồng thời bảo toàn ý nghĩa đạo đức-tôn giáo.
theological_decisions:
- issue: Có nên giải thích “người công chính” theo nghĩa mỉa mai hay không
  choice: Giữ nguyên “người công chính” trong chính văn
  alternative: “những người tự cho mình là công chính”
  rationale: Ngữ cảnh có thể gợi sắc thái mỉa mai, nhưng nguyên văn chỉ nói “người công chính”; chính văn vì thế không áp đặt một cách hiểu duy nhất, còn chú thích nêu khả năng ấy.
- issue: Đối tượng hàm ẩn của động từ “nghe”
  choice: Dùng “nghe vậy”
  alternative: “nghe” không có bổ ngữ
  rationale: Nguyên văn không nêu đối tượng, nhưng ngữ cảnh cho biết Đức Giê-su nghe lời bàn luận vừa được nói ra. “Vậy” là cách bổ sung tối thiểu, tự nhiên trong tiếng Việt.
- issue: Ý nghĩa của việc “kêu gọi”
  choice: Không thêm mục đích như “ăn năn” vào chính văn
  alternative: “kêu gọi người có tội ăn năn”
  rationale: SBLGNT tại câu này không có cụm “đến sự ăn năn”; không nên đưa một dị bản hoặc phần giải thích thần học vào chính văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Đức Giê-su”, “thầy thuốc”, “công chính” theo lối diễn đạt Kinh Thánh quen thuộc nhưng không cổ hóa; giữ cấu trúc đối lập và sự căng thẳng thần học của nguyên văn.
