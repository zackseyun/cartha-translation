  - severity: low
    issue: Trật tự phủ định trong “Tôi đến không phải để”
    rationale: Dù có thể hiểu đúng, “Tôi không đến để” phản ánh trực tiếp hơn οὐκ ἦλθον và tránh một sắc thái nhấn mục đích không cần thiết.
