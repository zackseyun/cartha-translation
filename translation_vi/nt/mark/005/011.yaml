  text: ἦν δὲ ἐκεῖ πρὸς τῷ ὄρει ἀγέλη χοίρων μεγάλη βοσκομένη·
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/011.yaml
  text: There was there near the mountain a large herd of pigs feeding[a][b].
translation:
  language: vi
  text: Ở đó, gần núi[a], có một đàn heo[b] rất đông đang kiếm ăn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “bên núi.” Cụm từ Hy Lạp πρὸς τῷ ὄρει chỉ vị trí gần hoặc bên núi.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “lợn.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν δὲ
  choice: có
  rationale: ἦν diễn tả sự hiện hữu; trong tiếng Việt, cấu trúc “có” tự nhiên và đầy đủ. Tiểu từ δέ là một liên từ nhẹ, không cần được thể hiện riêng bằng một từ nối trong câu này.
- source_word: ἐκεῖ
  choice: ở đó
  rationale: Trạng từ chỉ nơi chốn được chuyển dịch trực tiếp và tự nhiên.
- source_word: πρὸς τῷ ὄρει
  choice: gần sườn núi
  rationale: πρός với cách dữ ở đây chỉ vị trí gần hoặc bên núi. “Gần sườn núi” tự nhiên trong ngữ cảnh đàn vật đang kiếm ăn mà không xác định vị trí quá mức.
- source_word: ἀγέλη
  choice: đàn
  rationale: Từ thông dụng trong tiếng Việt để chỉ một nhóm lớn động vật cùng loài.
- source_word: χοίρων
  choice: heo
  rationale: χοῖρος chỉ heo/lợn. “Heo” là cách gọi hiện đại, phổ thông trong tiếng Việt; “lợn” là biến thể vùng miền hợp lệ.
- source_word: μεγάλη
  choice: rất đông
  rationale: Khi bổ nghĩa cho “đàn”, μεγάλη có thể nói đến quy mô hoặc số lượng. “Rất đông” diễn đạt tự nhiên quy mô lớn của đàn mà không làm thay đổi ý nghĩa.
- source_word: βοσκομένη
  choice: đang kiếm ăn
  rationale: Phân từ hiện tại mô tả đàn heo trong lúc ăn. “Kiếm ăn” rộng hơn “gặm cỏ” và tránh hàm ý thức ăn chỉ là cỏ.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “heo” trong chính văn, đồng thời ghi nhận “lợn” ở chú thích để phù hợp sự khác biệt vùng miền. Cả hai dấu chú thích [a], [b] đều được đặt ngay sau từ ngữ liên quan.
