  text: καὶ ⸀ἔρχονται εἰς τὸν οἶκον τοῦ ἀρχισυναγώγου, καὶ θεωρεῖ θόρυβον ⸀καὶ κλαίοντας καὶ ἀλαλάζοντας πολλά,
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/038.yaml
  text: And they come to the house of the synagogue leader[a], and he sees a commotion, and people weeping and wailing loudly.
translation:
  language: vi
  text: Họ đến nhà người đứng đầu hội đường, và Đức Giê-su thấy cảnh huyên náo, cùng những người khóc lóc và than gào inh ỏi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔρχονται
  choice: Họ đến
  rationale: Giữ thì hiện tại lịch sử của lời kể theo cách tự nhiên trong tiếng Việt; “đến” diễn tả chuyển động vào nơi xảy ra sự việc.
- source_word: οἶκον
  choice: nhà
  rationale: Tương đương trực tiếp và tự nhiên với οἶκος trong ngữ cảnh.
- source_word: ἀρχισυναγώγου
  choice: người quản lý hội đường
  rationale: Diễn đạt chức vụ của người đứng đầu hoặc phụ trách hội đường bằng tiếng Việt hiện đại, tránh sắc thái cai trị quá mạnh của “người cai quản”.
- source_word: θεωρεῖ
  choice: Đức Giê-su thấy
  rationale: Chủ ngữ số ít được xác định từ ngữ cảnh là Đức Giê-su; nêu tên giúp tiếng Việt rõ nghĩa mà không thêm diễn giải thần học.
- source_word: θόρυβον
  choice: cảnh huyên náo
  rationale: θόρυβος chỉ tiếng động ồn ào và sự náo động; “cảnh huyên náo” bao quát cả âm thanh lẫn tình trạng hỗn tạp.
- source_word: κλαίοντας
  choice: những người đang khóc lóc
  rationale: Phân từ mang nghĩa chỉ những người thực hiện hành động; “đang” thể hiện cảnh tượng đang diễn ra.
- source_word: ἀλαλάζοντας
  choice: than gào
  rationale: Diễn tả tiếng kêu than lớn trong cảnh tang chế, mạnh hơn “than khóc” nhưng vẫn tự nhiên.
- source_word: πολλά
  choice: thảm thiết
  rationale: Từ này bổ nghĩa theo lối trạng từ, nhấn mạnh mức độ than gào; “thảm thiết” truyền đạt cường độ và phù hợp bối cảnh tang chế.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Giữ nhịp kể sống động của hiện tại lịch sử; dùng “hội đường” là thuật ngữ quen thuộc trong văn cảnh Do Thái. Không thêm chú thích vì không có phương án từ vựng nào cần thiết để người đọc hiểu câu này.
