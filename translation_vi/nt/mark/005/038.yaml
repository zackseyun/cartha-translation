- from: Họ đến nhà người quản lý hội đường. Đức Giê-su thấy cảnh huyên náo, và những người đang khóc lóc, than gào thảm thiết.
  to: Họ đến nhà người đứng đầu hội đường, và Đức Giê-su thấy cảnh huyên náo, cùng những người khóc lóc và than gào inh ỏi.
  rationale: Bản sửa giữ thì hiện tại lịch sử và trình tự kể chuyện của tiếng Hy Lạp, làm rõ chức danh ἀρχισυνάγωγος, và chuyển πολλά theo sắc thái tiếng than gào lớn, ồn ào. Không cần chú thích vì không có biến thể văn bản hay sự mơ hồ từ vựng đáng kể cần bảo lưu trong câu này.
