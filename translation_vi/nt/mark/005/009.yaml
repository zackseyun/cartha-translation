  text: καὶ ἐπηρώτα αὐτόν· Τί ⸂ὄνομά σοι⸃; καὶ ⸂λέγει αὐτῷ⸃· ⸀Λεγιὼν ὄνομά μοι, ὅτι πολλοί ἐσμεν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/009.yaml
  text: And he was asking him, “What is your name?” And he says to him, “My name is Legion,[a] because we are many.”
translation:
  language: vi
  text: 'Ngài cứ hỏi nó: “Tên ngươi là gì?” Nó nói với Ngài: “Tên tôi là Lê-gi-ôn,[a] vì chúng tôi rất đông.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Lê-gi-ôn” là một thuật ngữ quân sự La-tinh được tiếp nhận vào tiếng Hy Lạp, chỉ một đơn vị lớn của quân đội La Mã; ở đây từ này được dùng làm tên mà quỷ tự xưng và hàm ý một số đông.
    reason: cultural_note
lexical_decisions:
- source_word: ἐπηρώτα
  choice: cứ hỏi
  rationale: Thì chưa hoàn thành diễn tả hành động đang tiếp diễn hoặc được lặp lại; “cứ hỏi” chuyển tải sắc thái ấy tự nhiên trong tiếng Việt.
- source_word: Τί ὄνομά σοι
  choice: Tên ngươi là gì?
  rationale: Cách diễn đạt tự nhiên, trực tiếp trong tiếng Việt cho thành ngữ Hy Lạp dùng ὄνομα với đại từ ở tặng cách.
- source_word: λέγει αὐτῷ
  choice: Nó thưa với Ngài
  rationale: Hiện tại lịch sử của Mác tạo nét kể chuyện sống động; tiếng Việt không bắt buộc đánh dấu thì, còn “thưa” phù hợp với lời đáp hướng đến Chúa Giê-su mà không thêm nội dung.
- source_word: Λεγιὼν
  choice: Lê-gi-ôn
  rationale: Giữ đây là tên gọi tự xưng bằng cách phiên âm thuật ngữ quân sự La-tinh đã đi vào tiếng Hy Lạp, thay vì dịch thành một danh từ chung.
- source_word: ὄνομά μοι
  choice: Tên tôi là
  rationale: Tương đương tự nhiên trong tiếng Việt của cấu trúc danh từ với đại từ tặng cách và giữ nguyên công thức tự xưng ở số ít.
- source_word: ὅτι πολλοί ἐσμεν
  choice: vì chúng tôi đông lắm
  rationale: ὅτι nêu lý do của tên gọi; giữ ngôi thứ nhất số nhiều và dùng “đông lắm” để diễn đạt tự nhiên πολλοί trong văn cảnh một số lượng lớn.
theological_decisions:
- issue: Sự chuyển đổi từ số ít sang số nhiều trong lời tự xưng
  choice: Giữ cả số ít “Tên tôi là Lê-gi-ôn” và số nhiều “chúng tôi đông lắm”.
  alternative: Làm phẳng sự căng thẳng thành “Tên chúng tôi là Lê-gi-ôn”.
  rationale: Bản Hy Lạp chủ ý đặt lời tự xưng số ít bên cạnh lời giải thích số nhiều. Bản dịch giữ nguyên sự căng thẳng này, không diễn giải thay cho người đọc.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngài/ngươi/nó/tôi” để làm rõ các bên trong cuộc đối thoại; “Lê-gi-ôn” được phiên âm quen thuộc và có chú thích văn hóa.
