  text: ⸂Καὶ οἱ⸃ βόσκοντες ⸀αὐτοὺς ἔφυγον καὶ ⸀ἀπήγγειλαν εἰς τὴν πόλιν καὶ εἰς τοὺς ἀγρούς· καὶ ⸀ἦλθον ἰδεῖν τί ἐστιν τὸ γεγονός.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/014.yaml
  text: And those who were tending them fled and reported it in the city and in the countryside[a], and they came to see what had happened.
translation:
  language: vi
  text: Những người chăn đàn heo bỏ chạy, báo tin trong thành và các vùng quê[a]; rồi người ta đến xem chuyện gì đã xảy ra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “ngoài đồng.” Từ Hy Lạp có thể được dịch sát như vậy, nhưng ở đây có lẽ chỉ các vùng nông thôn chung quanh thành.'
    reason: lexical_alternative
lexical_decisions:
- source_word: βόσκοντες αὐτούς
  choice: những người chăn đàn heo
  rationale: Phân từ βόσκοντες chỉ những người chăm nom đàn vật; đại từ αὐτούς quay lại đàn heo ở câu trước. Nêu rõ “đàn heo” giúp câu tiếng Việt tự nhiên và tránh cách nói gượng “chăn chúng” mà không thay đổi đối tượng.
- source_word: ἔφυγον
  choice: bỏ chạy
  rationale: Diễn tả hành động chạy khỏi nơi đó một cách đột ngột, phù hợp với lực kể chuyện của động từ aorist.
- source_word: ἀπήγγειλαν
  choice: báo tin
  rationale: Động từ có nghĩa thuật lại hoặc truyền báo một sự việc; “báo tin” ngắn gọn và tự nhiên trong ngữ cảnh.
- source_word: εἰς τὴν πόλιν
  choice: trong thành
  rationale: Dù εἰς thường chỉ hướng đi vào, ở đây kết hợp với hành động báo tin nên tiếng Việt tự nhiên diễn đạt nơi tin tức được truyền đi là “trong thành”.
- source_word: εἰς τοὺς ἀγρούς
  choice: khắp vùng quê
  rationale: ἀγροί có thể chỉ các cánh đồng, nhưng khi đối xứng với “thành” thì nhiều khả năng nói đến vùng nông thôn chung quanh. “Khắp” truyền đạt việc tin được báo ra trong khu vực ấy, phù hợp văn cảnh.
- source_word: ἦλθον
  choice: người ta đến
  rationale: Động từ có chủ ngữ số nhiều không được nêu rõ. “Người ta” giữ tính không xác định, đồng thời tránh khiến “họ” bị hiểu nhầm là chính những người chăn heo vừa bỏ chạy.
- source_word: ἰδεῖν
  choice: đến xem
  rationale: Động từ nguyên mẫu chỉ mục đích của việc đến; “đến xem” là cách diễn đạt tiếng Việt trực tiếp và tự nhiên.
- source_word: τί ἐστιν τὸ γεγονός
  choice: chuyện gì đã xảy ra
  rationale: Cấu trúc hỏi về sự việc đã diễn ra; thì hoàn thành của γεγονός được truyền đạt tự nhiên bằng “đã xảy ra”.
