  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Dấu chấm phẩy giữ mạch liên tục của câu Hy Lạp nhưng phân biệt rõ hành động của những người chăn heo với phản ứng tiếp theo của dân chúng.
