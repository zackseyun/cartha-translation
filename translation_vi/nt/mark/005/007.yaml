source:
  edition: SBLGNT
  text: καὶ κράξας φωνῇ μεγάλῃ ⸀λέγει· Τί ἐμοὶ καὶ σοί, Ἰησοῦ υἱὲ τοῦ θεοῦ τοῦ ὑψίστου; ὁρκίζω σε τὸν θεόν, μή με βασανίσῃς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/007.yaml
  text: And crying out with a loud voice[a], he says, “What have I to do with you, Jesus, Son of the Most High God? I adjure you by God[c][b], do not torment me.”
translation:
  language: vi
  text: 'Người ấy kêu lớn và nói: “Hỡi Đức Giê-su, Con của Đức Chúa Trời Tối Cao, tôi với Ngài có can hệ gì?[a] Tôi lấy Đức Chúa Trời mà buộc Ngài thề: xin đừng hành hạ tôi!”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn là một thành ngữ, có thể dịch: “Ngài có liên can gì đến tôi?” Thành ngữ này diễn tả sự xa cách, xung đột hoặc không muốn dính líu giữa hai bên.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “Tôi lấy Đức Chúa Trời mà khẩn nài Ngài.” Động từ Hy Lạp mang ý đặt người khác dưới một lời thề hoặc nghiêm trang buộc họ phải làm điều được yêu cầu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κράξας φωνῇ μεγάλῃ
  choice: kêu lớn tiếng
  rationale: Diễn đạt tự nhiên trong tiếng Việt, đồng thời giữ được sức mạnh và âm lượng của tiếng kêu trong nguyên văn.
- source_word: λέγει
  choice: và nói
  rationale: Tiếng Việt thường dùng thì quá khứ theo mạch văn mà không cần đánh dấu hình thái; cách dịch này không gượng ép giữ thì hiện tại lịch sử của lối kể chuyện Hy Lạp.
- source_word: Τί ἐμοὶ καὶ σοί
  choice: tôi với Ngài có can hệ gì?
  rationale: Giữ dạng câu hỏi ngắn, gay gắt của thành ngữ, diễn tả sự tách biệt, xung đột hoặc ý muốn không dính líu.
- source_word: υἱὲ τοῦ θεοῦ τοῦ ὑψίστου
  choice: Con Đức Chúa Trời Tối Cao
  rationale: Giữ nguyên cả tước hiệu làm Con và danh xưng thần thượng ὕψιστος bằng cách diễn đạt rõ ràng, quen thuộc trong tiếng Việt hiện đại.
- source_word: ὁρκίζω σε τὸν θεόν
  choice: Tôi lấy Đức Chúa Trời mà buộc Ngài thề
  rationale: Bảo toàn sắc thái trang trọng, liên quan đến lời thề của ὁρκίζω, thay vì làm nhẹ thành một lời van xin thông thường.
- source_word: μή με βασανίσῃς
  choice: xin đừng hành hạ tôi
  rationale: “Hành hạ” truyền đạt sự đau đớn nghiêm trọng của βασανίζω mà không xác định thêm hình thức gây đau đớn; “xin” phù hợp với lời cầu khẩn trong ngữ cảnh.
theological_decisions:
- issue: Lời nhận biết căn tính của Đức Giê-su
  choice: Con Đức Chúa Trời Tối Cao
  alternative: Con của Đấng Tối Cao là Đức Chúa Trời
  rationale: Cách dịch giữ nguyên lời xưng nhận Kitô học rõ ràng trong câu mà không mở rộng thành một công thức tín lý về sau.
- issue: Sức nặng của ὁρκίζω trong lời của thần ô uế
  choice: Tôi lấy Đức Chúa Trời mà buộc Ngài thề
  alternative: Tôi lấy Đức Chúa Trời mà khẩn nài Ngài
  rationale: Giữ lại nghịch lý và sự căng thẳng của việc thần ô uế viện đến Đức Chúa Trời để đặt Đức Giê-su dưới một lời thề trang trọng, thay vì âm thầm biến câu này thành lời cầu xin đơn thuần.
translation_notes:
  register: Văn phong hiện đại, trang trọng nhưng dễ hiểu. “Người ấy” tránh quyết định quá mức rằng chủ thể ngữ pháp là người đàn ông hay thần ô uế đang nói qua ông; “Ngài” đáp ứng nhu cầu xưng hô tự nhiên của tiếng Việt trong lời trực tiếp mà không làm thay đổi nội dung tước hiệu.
