revisions:
- from: 'Người ấy kêu lớn tiếng và nói: “Hỡi Đức Giê-su, Con Đức Chúa Trời Tối Cao, tôi với Ngài có can hệ gì?[a] Tôi lấy Đức Chúa Trời mà buộc Ngài thề: xin đừng hành hạ tôi!”[b]'
  to: 'Người ấy kêu lớn và nói: “Hỡi Đức Giê-su, Con của Đức Chúa Trời Tối Cao, tôi với Ngài có can hệ gì?[a] Tôi lấy Đức Chúa Trời mà buộc Ngài thề: xin đừng hành hạ tôi!”[b]'
  rationale: 'Chỉ sửa hai điểm ngôn ngữ an toàn: thay «kêu lớn tiếng» bằng cách diễn đạt hiện đại, tự nhiên hơn; và thêm «của» trong tước hiệu để làm rõ quan hệ cú pháp của nguyên văn. Các lựa chọn khác, kể cả sự mơ hồ có chủ ý của «Người ấy» và sức nặng của lời buộc thề, được giữ nguyên.'
  reviewer_model: gpt-5.6-terra
