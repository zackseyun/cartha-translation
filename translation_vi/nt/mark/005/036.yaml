    rationale: Phương án nghĩa của παρακούσας là Đức Giê-su phớt lờ/không để tâm đến điều vừa được nói, rồi vẫn nói với người đứng đầu hội đường. Câu chú thích hiện tại đặt trong dấu ngoặc kép một câu không phản ánh đầy đủ cấu trúc câu gốc và “không nghe theo” có thể gợi ý nghĩa tuân lệnh không phù hợp với “lời/bản tin” trong ngữ cảnh.
  - severity: low
