revisions:
- from: 'Nhưng Đức Giê-su nghe được lời người ta đang nói[a] thì nói với người đứng đầu hội đường: “Đừng sợ; chỉ cần tin.[b]”'
  to: 'Nhưng Đức Giê-su nghe được[a] lời người ta đang nói và nói với người đứng đầu hội đường: “Đừng sợ; chỉ cần tin.[b]”'
  rationale: Chỉnh sửa chỉ làm rõ điểm neo chú thích và diễn đạt chính xác, tự nhiên hơn phương án nghĩa thay thế của παρακούσας. Bản chính giữ lựa chọn “nghe được,” phù hợp nhất với cú pháp và diễn tiến câu chuyện, đồng thời chú thích bảo tồn cách hiểu “phớt lờ” vốn có cơ sở từ vựng. Câu mệnh lệnh vẫn không áp đặt một cách hiểu thần học cụ thể cho πιστεύω.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T07:39:49Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản chính chuyển tải đúng mạch câu: Đức Giê-su nghe lời/bản tin đang được nói và ngỏ lời với người đứng đầu hội đường. “Nghe được” là cách chọn phù hợp cho παρακούσας trong ngữ cảnh; chú thích cần diễn đạt nghĩa thay thế chính xác hơn là “không để ý đến/phớt lờ điều vừa được nói”, thay vì khiến người đọc hiểu rằng câu thay thế là một bản dịch trọn vẹn của cả mệnh đề.'
  naturalness: Câu tiếng Việt hiện đại, rõ và có sắc thái trang trọng vừa phải. “Lời người ta đang nói” là tự nhiên, dù thêm “người ta” để tiếng Việt trôi chảy; không làm đổi ý nghĩa. Có thể bỏ “thì” để câu gọn hơn mà vẫn giữ lối kể trực tiếp.
  terminology: “Đức Giê-su,” “hội đường,” và “người đứng đầu hội đường” phù hợp. “Đừng sợ; chỉ cần tin” truyền đạt tốt Μὴ φοβοῦ, μόνον πίστευε. Chú thích về πιστεύω nên giữ “tin cậy” và có thể nêu sắc thái tiếp diễn của mệnh lệnh hiện tại như một khả năng, không như điều bắt buộc.
  issues:
