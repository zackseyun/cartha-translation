source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς ⸀παρακούσας τὸν λόγον λαλούμενον λέγει τῷ ἀρχισυναγώγῳ· Μὴ φοβοῦ, μόνον πίστευε.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/036.yaml
  text: But Jesus[a], overhearing the word being spoken, says to the synagogue leader, “Do not be afraid[b]; only believe.”
translation:
  language: vi
  text: 'Nhưng Đức Giê-su nghe được[a] lời người ta đang nói và nói với người đứng đầu hội đường: “Đừng sợ; chỉ cần tin.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “phớt lờ/không để tâm đến điều vừa được nói.” Động từ Hy Lạp παρακούω có thể có nghĩa là nghe được, hoặc là không để ý đến/phớt lờ.'
    reason: alternative_reading
  - marker: b
    text: 'Cũng có thể dịch: “chỉ cần tin cậy” hoặc “chỉ hãy tiếp tục tin.” Động từ Hy Lạp là πιστεύω; dạng mệnh lệnh hiện tại có thể gợi sắc thái tiếp diễn, nhưng không nhất thiết buộc phải hiểu như vậy.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρακούσας
  choice: nghe được
  rationale: Động từ có thể mang nghĩa nghe được điều đang nói hoặc không nghe theo/phớt lờ. Trong mạch kể này, Đức Giê-su đáp lại ngay bản tin vừa được nói với Giai-ru, nên “nghe được” phù hợp nhất; nghĩa còn lại được giữ trong chú thích.
- source_word: τὸν λόγον λαλούμενον
  choice: lời người ta đang nói
  rationale: Cách dịch này giữ được ý của danh từ λόγος và phân từ bị động λαλούμενον, đồng thời tự nhiên, dễ hiểu trong tiếng Việt hiện đại.
- source_word: λέγει
  choice: nói
  rationale: Dùng thì hiện tại trong lời kể để phản ánh lối hiện tại lịch sử sinh động thường thấy trong Mác, thay vì chuyển hẳn thành “đã nói”.
- source_word: ἀρχισυναγώγῳ
  choice: người đứng đầu hội đường
  rationale: Diễn đạt rõ chức vụ lãnh đạo hoặc chủ tọa hội đường bằng tiếng Việt hiện đại, tránh từ ngữ cổ hoặc hàm ý về một chức vụ thuộc hệ phái ngày nay.
- source_word: Μὴ φοβοῦ
  choice: Đừng sợ
  rationale: Đây là cách diễn đạt trực tiếp, tự nhiên và giữ đúng sức mạnh của mệnh lệnh phủ định trong tiếng Hy Lạp.
- source_word: μόνον
  choice: chỉ cần
  rationale: 'Trong câu khuyên nhủ này, “chỉ cần” diễn đạt tự nhiên ý giới hạn của μόνον: phản ứng được đòi hỏi là tin, thay vì sợ hãi.'
- source_word: πίστευε
  choice: tin
  rationale: “Tin” là tương đương trực tiếp, tự nhiên của động từ πιστεύω trong ngữ cảnh này. Sắc thái “tiếp tục tin” có thể có ở mệnh lệnh hiện tại nhưng không nên bị áp đặt khi hình thái hiện tại tự nó không luôn xác định khía cạnh kéo dài.
theological_decisions:
- issue: Nghĩa của παρακούσας
  choice: Đức Giê-su nghe được lời đang được nói rồi nói với người đứng đầu hội đường.
  alternative: Đức Giê-su phớt lờ hoặc không để ý đến lời vừa được nói.
  rationale: Cả hai nghĩa đều có cơ sở từ vựng. Mạch văn trực tiếp nghiêng về nghĩa nghe được, nhưng nghĩa phớt lờ tạo một sắc thái kể chuyện khác và được bảo tồn trong chú thích.
- issue: Cách dịch πιστεύω trong mệnh lệnh của Đức Giê-su
  choice: tin
  alternative: tin cậy; tiếp tục tin
  rationale: “Tin” giữ sự tương ứng trực tiếp và không thu hẹp đối tượng hay bản chất của niềm tin. “Tin cậy” là một khả năng hợp ngữ cảnh, còn “tiếp tục tin” có thể diễn đạt sắc thái kéo dài của mệnh lệnh hiện tại, nên các khả năng này được nêu trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Đức Giê-su” theo cách gọi kính trọng phổ biến; “người đứng đầu hội đường” giải nghĩa chức danh rõ ràng. Cấu trúc hiện tại “thì nói” giữ phần nào sự sinh động của lối hiện tại lịch sử trong Mác.
