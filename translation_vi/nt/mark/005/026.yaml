  source_fidelity: 'Bản nháp truyền đạt đúng chuỗi các phân từ: bà chịu nhiều đau khổ liên quan đến nhiều thầy thuốc, tiêu hết những gì có, không nhận được lợi ích nào, và tình trạng trở nên tệ hơn. Tuy nhiên, “vì nhiều thầy thuốc” trong tiếng Việt dễ quy kết trực tiếp các thầy thuốc là nguyên nhân gây khổ, trong khi ὑπὸ πολλῶν ἰατρῶν có thể nêu tác nhân hoặc tình trạng bà phải chịu dưới sự chữa trị của họ. “Bệnh tình” cũng cụ thể hóa điều nguyên văn chỉ nói là bà đi vào tình trạng tệ hơn.'
