translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Câu giữ cấu trúc nối tiếp của các phân từ Hy Lạp, đồng thời dùng “bệnh tình” để diễn đạt tự nhiên kết quả suy yếu trong ngữ cảnh. Dấu phẩy cuối câu phản ánh đây là mệnh đề đang tiếp diễn sang câu kế.
