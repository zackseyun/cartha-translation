  text: and after suffering much under many physicians[a], and after spending all that she had and benefiting nothing, but rather becoming worse[b],
translation:
  language: vi
  text: Bà đã chịu khổ nhiều dưới sự chữa trị của nhiều thầy thuốc[a], đã tiêu hết mọi thứ mình có[b] mà không được ích lợi gì; trái lại, tình trạng lại càng tệ hơn,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “do nhiều thầy thuốc” hoặc “dưới tay nhiều thầy thuốc.” Tiếng Hy Lạp có thể nhấn mạnh các thầy thuốc là tác nhân, hoặc việc bà phải chịu những phương thức chữa trị của họ.'
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn: “tất cả những gì từ nơi bà,” nghĩa là mọi thứ bà có.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλὰ παθοῦσα
  choice: đã chịu khổ nhiều
  rationale: Giữ sắc thái trải nghiệm của πάσχω và diễn tả tự nhiên hoàn cảnh xảy ra trước trong chuỗi phân từ.
- source_word: ὑπὸ πολλῶν ἰατρῶν
  choice: vì nhiều thầy thuốc
  rationale: Ὑπό với sở hữu cách chỉ tác nhân hoặc nguồn gây ra; cách dịch này giữ được liên hệ giữa nỗi khổ của bà và việc chữa trị của nhiều thầy thuốc mà không diễn giải quá mức.
- source_word: δαπανήσασα
  choice: đã tiêu hết
  rationale: Động từ mang nghĩa chi tiêu; chữ “hết” được xác định bởi τὰ παρ’ αὐτῆς πάντα ngay sau đó.
- source_word: τὰ παρ’ αὐτῆς πάντα
  choice: mọi thứ mình có
  rationale: Cách diễn đạt tự nhiên trong tiếng Việt cho toàn bộ những gì thuộc quyền sở hữu hoặc sử dụng của bà.
- source_word: μηδὲν ὠφεληθεῖσα
  choice: mà chẳng được ích gì
  rationale: Giữ thể bị động và ý rằng các phương thức chữa trị không đem lại lợi ích nào.
- source_word: ἀλλὰ μᾶλλον
  choice: trái lại
  rationale: 'Thể hiện rõ sự tương phản tăng tiến: không những không khá hơn mà tình trạng còn đảo theo hướng xấu.'
- source_word: εἰς τὸ χεῖρον ἐλθοῦσα
  choice: bệnh tình càng tệ hơn
  rationale: Diễn đạt tự nhiên thành ngữ chỉ việc chuyển sang tình trạng xấu hơn; “bệnh tình” làm rõ đối tượng suy giảm từ ngữ cảnh.
