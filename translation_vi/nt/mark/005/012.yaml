  terminology: “Ngài” phù hợp register trang trọng khi quy chiếu về Chúa Giê-su. “Heo” là cách gọi hiện đại, phổ thông của χοίρους; “bầy heo” làm rõ số nhiều. Không cần chú thích từ vựng vì không có điểm mơ hồ đáng kể cần bảo lưu trong bản dịch này.
