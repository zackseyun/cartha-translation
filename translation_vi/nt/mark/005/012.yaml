source:
  edition: SBLGNT
  text: καὶ παρεκάλεσαν ⸀αὐτὸν λέγοντες· Πέμψον ἡμᾶς εἰς τοὺς χοίρους, ἵνα εἰς αὐτοὺς εἰσέλθωμεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/012.yaml
  text: And they begged him[a], saying, “Send us into the pigs, so that we may enter them.”
translation:
  language: vi
  text: 'Chúng nài xin Ngài: “Xin sai chúng tôi vào bầy heo, để chúng tôi nhập vào chúng.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρεκάλεσαν
  choice: nài xin
  rationale: Diễn tả lời khẩn cầu tha thiết của các tà linh đối với Chúa Giê-su, mạnh hơn cách nói trung tính “xin” nhưng vẫn tự nhiên trong tiếng Việt hiện đại.
- source_word: αὐτὸν
  choice: Ngài
  rationale: Đại từ chỉ Chúa Giê-su; “Ngài” phù hợp với văn phong Kinh Thánh trang trọng, dễ hiểu.
- source_word: λέγοντες
  choice: ':'
  rationale: Dấu hai chấm giới thiệu trực tiếp nội dung lời nài xin một cách tự nhiên trong tiếng Việt, thay cho việc dịch cứng là “nói rằng”.
- source_word: Πέμψον ἡμᾶς
  choice: Xin sai chúng tôi
  rationale: Giữ nghĩa trực tiếp của πέμπω là “sai”; từ “xin” thể hiện sắc thái cầu khẩn của câu mệnh lệnh trong lời nói.
- source_word: εἰς τοὺς χοίρους
  choice: vào bầy heo
  rationale: χοῖρος là “heo”; danh từ tập hợp “bầy” phù hợp với ngữ cảnh nhiều con heo và tự nhiên trong tiếng Việt.
- source_word: ἵνα
  choice: để
  rationale: Diễn đạt rõ quan hệ mục đích của mệnh đề Hy Lạp.
- source_word: εἰς αὐτοὺς εἰσέλθωμεν
  choice: chúng tôi nhập vào chúng
  rationale: “Nhập vào” truyền đạt việc các tà linh đi vào và chiếm ngự các con vật; “chúng” giữ đại từ số nhiều quy chiếu về bầy heo.
theological_decisions:
- issue: Bản chất lời thỉnh cầu của các tà linh đối với Chúa Giê-su
  choice: Các tà linh nài xin Chúa Giê-su sai chúng vào bầy heo, qua đó lời kể cho thấy chúng lệ thuộc vào thẩm quyền của Ngài.
  alternative: Hiểu đây chỉ là một lời đề nghị chuyển chỗ, không nhấn mạnh thẩm quyền của Chúa Giê-su.
  rationale: Động từ παρεκάλεσαν cùng mệnh lệnh Πέμψον cho thấy lời khẩn cầu hướng đến Đấng có quyền quyết định, nhưng bản dịch không thêm một tuyên bố giáo lý vượt quá câu văn.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “heo” theo cách nói phổ thông; giữ “sai” thay vì diễn giải thành “cho phép” để bám sát động từ Hy Lạp. Không cần chú thích vì câu không có biến thể hoặc nét mơ hồ đáng kể cần trình bày.
