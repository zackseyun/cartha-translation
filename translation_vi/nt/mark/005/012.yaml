  source_fidelity: 'Bản dịch phản ánh đúng cấu trúc và ý chính của bản Hy Lạp: các tà linh khẩn cầu Chúa Giê-su, xin được sai vào bầy heo để đi vào chúng. “Nài xin” truyền đạt phù hợp sắc thái khẩn thiết của παρεκάλεσαν; “sai” giữ sát Πέμψον; và “để” diễn tả đúng mệnh đề mục đích với ἵνα.'
