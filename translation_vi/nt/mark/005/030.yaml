- from: 'Ngay lập tức, Đức Giê-su nhận biết trong chính mình rằng quyền năng đã từ mình phát ra. Ngài quay lại giữa đám đông và hỏi: “Ai đã chạm vào áo quần tôi[a]?”'
  to: 'Ngay lập tức, Đức Giê-su nhận biết trong chính mình rằng quyền năng đã phát ra từ Ngài. Ngài quay lại giữa đám đông và hỏi: “Ai đã chạm vào áo quần của tôi[a]?”'
  rationale: Chỉnh nhẹ hai cách diễn đạt để tiếng Việt hiện đại rõ và tự nhiên hơn, không thay đổi nghĩa, trật tự sự kiện, hay mức độ xác định của bản văn nguồn. Chú thích được giữ nguyên vì có neo hợp lệ và nêu đúng phương án từ vựng.
  reviewer_model: gpt-5.6-terra
