language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ⸀εὐθὺς ὁ Ἰησοῦς ἐπιγνοὺς ἐν ἑαυτῷ τὴν ἐξ αὐτοῦ δύναμιν ἐξελθοῦσαν ἐπιστραφεὶς ἐν τῷ ὄχλῳ ἔλεγεν· Τίς μου ἥψατο τῶν ἱματίων;
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/030.yaml
  text: And immediately Jesus[a], perceiving in himself that power had gone out from him, turned around in the crowd and said, “Who touched my garments?”
translation:
  language: vi
  text: 'Ngay lập tức, Đức Giê-su nhận biết trong chính mình rằng quyền năng đã phát ra từ Ngài. Ngài quay lại giữa đám đông và hỏi: “Ai đã chạm vào áo quần của tôi[a]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “y phục của tôi.”'
    reason: Nêu cách dịch trang trọng hơn cho ἱματίων; từ Hy Lạp ở số nhiều và chỉ trang phục nói chung.
lexical_decisions:
- source_word: εὐθὺς
  choice: ngay lập tức
  rationale: Diễn đạt tự nhiên sắc thái thời gian khẩn trương thường thấy trong lối kể của Mác-cô.
- source_word: ἐπιγνοὺς ἐν ἑαυτῷ
  choice: nhận biết trong chính mình
  rationale: Giữ cả ý nhận biết rõ ràng của ἐπιγνοὺς và tính nội tại của ἐν ἑαυτῷ, không biến điều này thành sự quan sát từ bên ngoài.
- source_word: δύναμιν
  choice: quyền năng
  rationale: Chỉ năng lực hữu hiệu gắn với việc chữa lành, đồng thời không thêm từ 'chữa lành' vốn không có trong câu Hy Lạp.
- source_word: ἐξ αὐτοῦ … ἐξελθοῦσαν
  choice: đã từ mình phát ra
  rationale: Thể hiện hành động đã xảy ra trước khi Đức Giê-su nhận biết; 'phát ra' tự nhiên hơn trong tiếng Việt so với cách dịch máy móc 'đi ra'.
- source_word: ἐπιστραφεὶς ἐν τῷ ὄχλῳ
  choice: quay lại giữa đám đông
  rationale: Diễn tả hành động quay người của Đức Giê-su ngay tại nơi đám đông đang vây quanh.
- source_word: ἔλεγεν
  choice: hỏi
  rationale: Dù nghĩa cơ bản là 'nói', nội dung trực tiếp là một câu hỏi nên 'hỏi' tự nhiên trong tiếng Việt và không làm đổi chức năng lời thoại.
- source_word: ἥψατο
  choice: đã chạm vào
  rationale: Phù hợp với nghĩa của động từ trong ngữ cảnh người phụ nữ chạm vào áo Đức Giê-su.
- source_word: τῶν ἱματίων
  choice: áo quần tôi
  rationale: Giữ ý số nhiều và nghĩa khái quát về trang phục, đồng thời dùng cách nói hiện đại, dễ hiểu hơn 'y phục'.
theological_decisions:
- issue: Đức Giê-su nhận biết quyền năng phát ra từ mình
  choice: Giữ nguyên lời kể rằng Đức Giê-su nhận biết trong chính mình quyền năng đã từ Ngài phát ra.
  alternative: Diễn giải thành 'biết quyền năng chữa lành đã phát ra' hoặc chỉ mô tả một cảm giác chủ quan.
  rationale: Bản văn khẳng định quyền năng thực sự phát ra từ Đức Giê-su nhưng không giải thích cơ chế hay nói rõ trong câu này rằng đó là 'quyền năng chữa lành'; bản dịch không nên giảm nhẹ hoặc giải thích thêm.
- issue: Cách chuyển đại từ ἑαυτῷ và αὐτοῦ
  choice: Dùng 'mình' trong mệnh đề phụ, rồi dùng 'Ngài' làm chủ ngữ câu kế tiếp.
  alternative: Lặp lại 'Đức Giê-su' hoặc dùng 'bản thân Ngài/từ Ngài' ở mọi vị trí.
  rationale: Cách chọn này giữ quan hệ phản thân của tiếng Hy Lạp, tránh lặp nặng nề và vẫn duy trì văn phong tôn kính, rõ nghĩa.
translation_notes:
  register: Tiếng Việt hiện đại, trang nghiêm nhưng dễ hiểu. Dùng “Đức Giê-su” và “Ngài” theo văn phong tôn kính; chia câu dài của tiếng Hy Lạp thành hai câu để lời kể tự nhiên mà vẫn giữ trật tự sự kiện.
