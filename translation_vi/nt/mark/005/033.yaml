revisions:
- from: Nhưng người phụ nữ, sợ hãi và run rẩy, biết điều đã xảy ra cho mình, liền đến sấp mình trước mặt Ngài[a] và thưa với Ngài toàn bộ sự thật.
  to: Nhưng người phụ nữ, sợ hãi và run rẩy, biết điều đã xảy ra với mình, đến và ngã xuống trước mặt Ngài[a], rồi nói với Ngài toàn bộ sự thật.
  rationale: Bản sửa bỏ các sắc thái thêm vào (“liền,” “thưa”) và thay cách nói xác định hơn về tư thế (“sấp mình”) bằng cách dịch bao quát hơn, sát προσέπεσεν. Đồng thời, “xảy ra với mình” là cách diễn đạt tự nhiên cho αὐτῇ trong ngữ cảnh biến cố bà trải nghiệm.
