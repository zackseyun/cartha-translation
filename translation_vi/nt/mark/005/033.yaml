review_pass:
  verdict: revise
  source_fidelity: 'Bản nháp truyền đạt đúng mạch chính của câu: người phụ nữ run sợ, nhận biết điều đã xảy ra với mình, đến, ngã xuống trước Chúa Giê-su và thuật lại trọn sự thật. Tuy nhiên, “liền” thêm sắc thái tức thì không được biểu thị riêng bởi ἦλθεν, và “sấp mình” nghiêng về một tư thế cụ thể hơn điều προσέπεσεν αὐτῷ đòi hỏi.'
  naturalness: Câu văn nhìn chung hiện đại và rõ. “Ngã xuống trước mặt Ngài” là cách diễn đạt tự nhiên, trực tiếp và ít bị gượng hơn “đến sấp mình trước mặt Ngài.” “Nói với Ngài toàn bộ sự thật” giữ được sắc thái đầy đủ của cụm từ nguồn.
  terminology: “Ngài” phù hợp với văn phong Kinh Thánh tiếng Việt trang trọng. Không nên dùng “thưa” ở đây, vì εἶπεν chỉ nói/chia sẻ và không tự nó mã hóa mức độ lễ nghi trong lời nói. “Ngã xuống trước mặt” mô tả hành vi mà không quy định đó là thờ phượng hay một tư thế phủ phục hoàn toàn.
  issues:
  - severity: low
    issue: “liền” thêm sắc thái tức thì.
    rationale: ἦλθεν là aorist kể chuyện đơn giản, nghĩa là “đến”; bản văn không có trạng từ tương đương “ngay/lập tức.”
  - severity: medium
    issue: “sấp mình” quá cụ thể đối với προσέπεσεν αὐτῷ.
    rationale: Động từ chỉ việc ngã xuống trước một người, có thể hàm ý kính sợ hay khẩn cầu, nhưng không nhất thiết xác định tư thế nằm sấp. Cách dịch rộng hơn bảo tồn tính không xác định của nguồn.
  - severity: low
    issue: “thưa” thêm sắc thái lễ nghi vào εἶπεν.
    rationale: Động từ εἶπεν đơn giản là “nói”; sự tôn kính đã được phản ánh đủ qua đại từ “Ngài,” nên “nói” tránh tăng cường sắc thái ngoài nguyên văn.
  revised_text: Nhưng người phụ nữ, sợ hãi và run rẩy, biết điều đã xảy ra với mình, đến và ngã xuống trước mặt Ngài[a], rồi nói với Ngài toàn bộ sự thật.
