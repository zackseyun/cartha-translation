  text: ἡ δὲ γυνὴ φοβηθεῖσα καὶ τρέμουσα, εἰδυῖα ὃ γέγονεν ⸀αὐτῇ, ἦλθεν καὶ προσέπεσεν αὐτῷ καὶ εἶπεν αὐτῷ πᾶσαν τὴν ἀλήθειαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/033.yaml
  text: But the woman[a], fearing and trembling, knowing what had happened to her[b], came and fell down before him and told him the whole truth.
translation:
  language: vi
  text: Nhưng người phụ nữ, sợ hãi và run rẩy, biết điều đã xảy ra với mình, đến và ngã xuống trước mặt Ngài[a], rồi nói với Ngài toàn bộ sự thật.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “ngã trước mặt Ngài” hoặc “phủ phục trước mặt Ngài.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Nhưng
  rationale: Đánh dấu sự chuyển ý có sắc thái tương phản nhẹ giữa câu hỏi của Chúa Giê-su và phản ứng của người phụ nữ.
- source_word: ἡ γυνὴ
  choice: người phụ nữ
  rationale: Ngữ cảnh nói đến người phụ nữ đã được nhắc tới trước đó; tiếng Việt không cần thêm từ chỉ định để diễn đạt tính xác định.
- source_word: φοβηθεῖσα καὶ τρέμουσα
  choice: sợ hãi và run rẩy
  rationale: Giữ nguyên hai trạng thái được diễn tả song song, vừa tự nhiên trong tiếng Việt vừa bảo tồn sắc thái sống động của các phân từ Hy Lạp.
- source_word: εἰδυῖα
  choice: biết
  rationale: Giữ quan hệ tình huống của phân từ mà không biến hàm ý thành quan hệ nguyên nhân minh nhiên như cách dịch “vì biết”.
- source_word: ὃ γέγονεν αὐτῇ
  choice: điều đã xảy ra cho mình
  rationale: Diễn đạt tự nhiên biến cố chữa lành mà bà đã trải nghiệm; “mình” quy chiếu rõ về chủ thể người phụ nữ.
- source_word: ἦλθεν
  choice: liền đến
  rationale: “Đến” phản ánh động từ kể chuyện đơn giản; “liền” giúp chuỗi hành động trong tiếng Việt trôi chảy mà không thay đổi nội dung.
- source_word: προσέπεσεν αὐτῷ
  choice: sấp mình trước mặt Ngài
  rationale: Diễn tả hành động ngã hoặc phủ phục trước Chúa Giê-su với sắc thái kính sợ hay khẩn cầu, nhưng không xác quyết rằng đây nhất thiết là hành vi thờ phượng.
- source_word: εἶπεν αὐτῷ πᾶσαν τὴν ἀλήθειαν
  choice: thưa với Ngài toàn bộ sự thật
  rationale: “Thưa” phù hợp với thái độ kính trọng trong bối cảnh; “toàn bộ sự thật” giữ sự nhấn mạnh của πᾶσαν và hàm ý bà không che giấu điều gì.
theological_decisions:
- issue: Tư thế trước Chúa Giê-su trong προσέπεσεν αὐτῷ
  choice: sấp mình trước mặt Ngài
  alternative: ngã xuống trước mặt Ngài; phủ phục trước mặt Ngài
  rationale: Động từ có thể chỉ hành động ngã xuống hoặc phủ phục vì kính sợ, tuyệt vọng hay khẩn cầu. Bản dịch giữ hành động và sắc thái tôn kính nhưng không thêm kết luận thần học rằng người phụ nữ đang thờ phượng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “Ngài” thể hiện sự tôn kính trong lời kể mà không thêm một danh xưng không có trong nguyên văn. Cấu trúc “biết điều đã xảy ra cho mình” bảo tồn quan hệ phân từ tương đối mở, thay vì diễn giải rõ thành nguyên nhân.
