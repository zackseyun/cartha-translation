  to: Ngay lập tức, nguồn chảy máu của bà khô cạn[a], và bà nhận ra trong người mình rằng bà đã được chữa lành khỏi nỗi khổ ấy[b].
  rationale: Bản sửa tránh đồng nhất μάστιξ với một “căn bệnh” theo nghĩa hẹp, trong khi vẫn cho thấy đây là tình trạng làm bà đau khổ. Đồng thời, thay “nguồn xuất huyết” bằng “nguồn chảy máu” để tiếng Việt tự nhiên hơn và duy trì hình ảnh πηγή. Các dấu chú thích vẫn gắn đúng vào các cụm có lựa chọn từ vựng.
