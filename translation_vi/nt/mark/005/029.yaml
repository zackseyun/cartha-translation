  text: καὶ ⸀εὐθὺς ἐξηράνθη ἡ πηγὴ τοῦ αἵματος αὐτῆς, καὶ ἔγνω τῷ σώματι ὅτι ἴαται ἀπὸ τῆς μάστιγος.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/029.yaml
  text: And immediately the flow of her blood dried up[b][a], and she knew in her body that she had been healed of the affliction.
translation:
  language: vi
  text: Ngay lập tức, nguồn chảy máu của bà khô cạn[a], và bà nhận ra trong người mình rằng bà đã được chữa lành khỏi nỗi khổ ấy[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn dùng hình ảnh sinh động về một “nguồn”, “mạch” hoặc “suối” máu khô cạn.
    reason: lexical_alternative
  - marker: b
    text: Từ Hy Lạp có nghĩa đen là “đòn roi”, và cũng có thể chỉ “tai họa” hoặc một nỗi đau khổ hành hạ; ở đây từ này nói đến tình trạng gây khổ sở cho bà.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθὺς
  choice: ngay lập tức
  rationale: Giữ sắc thái tức thời và nhịp kể khẩn trương đặc trưng của Mác.
- source_word: ἐξηράνθη
  choice: khô cạn
  rationale: Giữ hình ảnh cụ thể của động từ Hy Lạp ‘bị làm cho khô cạn’, thay vì chỉ diễn giải là ‘ngừng lại’.
- source_word: πηγὴ τοῦ αἵματος αὐτῆς
  choice: nguồn xuất huyết của bà
  rationale: πηγή là ‘nguồn, mạch, suối’; cách dịch này vừa giữ hình ảnh nguồn phát ra máu, vừa diễn đạt tự nhiên hơn trong tiếng Việt hiện đại.
- source_word: ἔγνω τῷ σώματι
  choice: bà nhận biết trong thân thể mình
  rationale: Giữ cả ý nhận biết của ἔγνω lẫn sự cảm nhận trực tiếp nơi thân thể được biểu đạt bằng cách ngữ τῷ σώματι.
- source_word: ἴαται
  choice: đã được chữa lành
  rationale: Thể hoàn thành diễn tả việc chữa lành đã xảy ra và kết quả vẫn còn; ‘đã được chữa lành’ thể hiện phù hợp mối quan hệ thời gian sau động từ ‘nhận biết’.
- source_word: ἀπὸ τῆς μάστιγος
  choice: khỏi căn bệnh hành hạ ấy
  rationale: μάστιξ vốn là ‘roi, đòn roi’, rồi được dùng cho một tai họa hay nỗi đau hành hạ. Trong ngữ cảnh này, cụm từ chỉ chứng bệnh gây khổ sở của bà, không phải một trận đòn theo nghĩa đen.
theological_decisions:
- issue: Tính chất của sự chữa lành
  choice: Trình bày cả việc xuất huyết thực sự chấm dứt lẫn sự nhận biết nơi thân thể của người phụ nữ.
  alternative: Chỉ nhấn mạnh cảm giác chủ quan của bà hoặc bổ sung lời giải thích về cơ chế chữa lành.
  rationale: Bản Hy Lạp đặt cạnh nhau sự thay đổi thể chất khách quan và sự nhận biết mang tính thân thể, nhưng không giải thích thêm cơ chế trong câu này.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. ‘Xuất huyết’ diễn đạt chính xác tình trạng chảy máu; ‘nguồn… khô cạn’ giữ nguyên hình ảnh cụ thể của nguyên văn. Đại từ ‘bà’ phù hợp với một phụ nữ trưởng thành trong văn cảnh.
