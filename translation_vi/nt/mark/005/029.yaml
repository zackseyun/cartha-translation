  - severity: low
    issue: “nguồn xuất huyết” hơi gượng trong văn phong hiện đại.
    rationale: Cụm này có tính y khoa và khiến hình ảnh πηγή (“nguồn, mạch, suối”) kém rõ. “Nguồn chảy máu” vừa bảo toàn phép ẩn dụ vừa đọc tự nhiên hơn.
