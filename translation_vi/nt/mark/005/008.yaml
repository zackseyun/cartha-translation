  verdict: revise
  source_fidelity: 'Cần chỉnh hai điểm: ἔλεγεν là thì chưa hoàn thành, nên “đang nói” (hoặc “vẫn nói”) phản ánh nền hành động đang diễn ra tốt hơn “đã phán”; và τοῦ ἀνθρώπου là “người đàn ông ấy/người đó”, không phải “người này”. Bản dịch vẫn giữ đúng quan hệ hơi căng giữa lời dẫn “nói với người ấy” và mệnh lệnh trực tiếp gọi tà linh.'
