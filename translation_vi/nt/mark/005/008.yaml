  text: ἔλεγεν γὰρ αὐτῷ· Ἔξελθε τὸ πνεῦμα τὸ ἀκάθαρτον ἐκ τοῦ ἀνθρώπου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/008.yaml
  text: For he was saying to him[a], “Come out of the man, unclean spirit.”
translation:
  language: vi
  text: 'Vì Ngài đang nói với người ấy[a]: “Hỡi tà linh ô uế, hãy ra khỏi người đàn ông ấy!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “Vì Ngài vẫn nói với người ấy.” Thì của động từ Hy Lạp có thể diễn tả hành động đang tiếp diễn hoặc được lặp lại trong quá khứ.'
    reason: aspectual_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: đã phán
  rationale: Thì vị hoàn thành Hy Lạp diễn tả lời truyền đang diễn ra hoặc được lặp lại trong bối cảnh quá khứ. Tiếng Việt không bắt buộc đánh dấu thể này; “đã phán” tự nhiên trong lời kể, còn sắc thái tiếp diễn được ghi nhận ở chú thích.
- source_word: γὰρ
  choice: Vì
  rationale: Giữ chức năng giải thích của γάρ đối với câu trước.
- source_word: αὐτῷ
  choice: với người ấy
  rationale: Đại từ số ít giống đực quy chiếu trực tiếp đến người đàn ông trong khung tường thuật, dù mệnh lệnh nhắm vào tà linh đang ở trong ông.
- source_word: Ἔξελθε
  choice: hãy ra khỏi
  rationale: Truyền đạt mệnh lệnh trực tiếp và chuyển động từ bên trong ra ngoài; cách nói này tự nhiên trong tiếng Việt.
- source_word: τὸ πνεῦμα τὸ ἀκάθαρτον
  choice: Hỡi tà linh ô uế
  rationale: Cụm danh từ có mạo từ về hình thức nhưng làm lời xưng hô trực tiếp. “Hỡi” biểu thị hô cách rõ ràng; “ô uế” giữ nghĩa cụ thể của ἀκάθαρτος thay vì chỉ diễn giải là “ác”.
- source_word: τοῦ ἀνθρώπου
  choice: người này
  rationale: Chỉ người đàn ông cụ thể đang hiện diện trong câu chuyện. “Người này” tự nhiên trong mệnh lệnh trực tiếp mà không cần lặp giới tính vốn đã rõ theo ngữ cảnh.
theological_decisions:
- issue: Cách dịch πνεῦμα ἀκάθαρτον trong bối cảnh trừ quỷ
  choice: tà linh ô uế
  alternative: ác linh
  rationale: “Ô uế” phản ánh trực tiếp ἀκάθαρτον và giữ sắc thái ô uế nghi lễ lẫn luân lý; “ác linh” chỉ chuyển tải một phần và mang tính diễn giải hơn.
- issue: Đối tượng của αὐτῷ và của mệnh lệnh
  choice: Giữ “với người ấy” trong lời dẫn, nhưng trình bày “tà linh ô uế” như lời gọi trực tiếp
  alternative: Dịch αὐτῷ là “với nó”
  rationale: 'Cấu trúc Hy Lạp duy trì sự căng thẳng trong câu chuyện: Chúa Giê-su nói với người đàn ông, còn mệnh lệnh trực tiếp nhắm vào tà linh ở trong người ấy.'
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” theo ngữ cảnh để chỉ Chúa Giê-su; “phán” phù hợp với lời có thẩm quyền. Dấu chấm than thể hiện lực của mệnh lệnh mà không thêm nội dung thần học.
