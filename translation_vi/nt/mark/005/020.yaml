source:
  edition: SBLGNT
  text: καὶ ἀπῆλθεν καὶ ἤρξατο κηρύσσειν ἐν τῇ Δεκαπόλει ὅσα ἐποίησεν αὐτῷ ὁ Ἰησοῦς, καὶ πάντες ἐθαύμαζον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/020.yaml
  text: And he went away and began to proclaim in the Decapolis how much Jesus had done for him[a], and everyone was amazed.
translation:
  language: vi
  text: Ông ra đi và bắt đầu rao truyền trong vùng Đê-ca-pô-li tất cả những gì Đức Giê-su đã làm cho ông; mọi người đều kinh ngạc.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπῆλθεν
  choice: ra đi
  rationale: Diễn đạt tự nhiên hành động rời khỏi nơi ấy, không dùng từ quá trang trọng.
- source_word: ἤρξατο κηρύσσειν
  choice: bắt đầu rao truyền
  rationale: Giữ sắc thái khởi đầu của ἤρξατο và tính công khai, rộng hơn một bài giảng chính thức, của κηρύσσειν.
- source_word: ἐν τῇ Δεκαπόλει
  choice: trong miền Đê-ca-pô-li
  rationale: Dịch trực tiếp giới từ ἐν là “trong” và phiên âm tên địa lý Decapolis; không thêm ý “khắp” vốn không được nói rõ.
- source_word: ὅσα
  choice: biết bao điều
  rationale: Diễn đạt tự nhiên sắc thái về mức độ hoặc số lượng của ὅσα, đồng thời không thêm tính từ đánh giá như “những việc lớn lao”.
- source_word: ἐποίησεν αὐτῷ
  choice: đã làm cho mình
  rationale: Cách nói tiếng Việt tự nhiên cho hành động được thực hiện vì lợi ích của người đàn ông; “mình” quy chiếu về chủ thể đang rao truyền.
- source_word: πάντες
  choice: mọi người
  rationale: Chuyển tải tự nhiên nghĩa tập thể “tất cả” khi chỉ người.
- source_word: ἐθαύμαζον
  choice: đều kinh ngạc
  rationale: “Kinh ngạc” là cách diễn đạt hiện đại cho θαυμάζω; “đều” phối hợp với “mọi người”, còn thể chưa hoàn thành gợi phản ứng đang diễn ra nhưng không cần diễn giải thêm trong câu.
- source_word: ὁ Ἰησοῦς
  choice: Đức Giê-su
  rationale: Dùng dạng tên gọi tiếng Việt thông dụng và trang trọng dành cho Chúa Giê-su.
theological_decisions:
- issue: Phạm vi lời rao truyền của người đàn ông liên quan đến căn tính của Đức Giê-su
  choice: Thuật lại trực tiếp rằng ông rao truyền điều Đức Giê-su đã làm cho mình, không thêm kết luận thần học.
  alternative: Diễn giải rõ rằng các việc ấy chứng minh thẩm quyền thần linh của Đức Giê-su.
  rationale: Câu này cho thấy quyền năng phi thường của Đức Giê-su qua lời chứng và sự kinh ngạc của mọi người, nhưng không tự phát biểu một kết luận tín lý; bản dịch giữ nguyên sức căng của trình thuật.
translation_notes:
  register: Văn phong hiện đại, trang trọng nhưng dễ hiểu. “Rao truyền” phù hợp với lời chứng công khai mà không gợi riêng một bài giảng chính thức. Dấu chấm phẩy giúp câu tiếng Việt sáng rõ trong khi vẫn giữ hai mệnh đề liên kết.
