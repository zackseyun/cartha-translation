- from: Ông ra đi và bắt đầu rao truyền trong miền Đê-ca-pô-li rằng Đức Giê-su đã làm cho mình biết bao điều[a]; mọi người đều kinh ngạc.
  to: Ông ra đi và bắt đầu rao truyền trong vùng Đê-ca-pô-li tất cả những gì Đức Giê-su đã làm cho ông; mọi người đều kinh ngạc.
  rationale: Bản sửa dùng “tất cả những gì” làm cách dịch trực tiếp và bao quát hơn cho ὅσα, đồng thời giữ “biết bao điều” như một khả năng diễn đạt thay thế phù hợp với sắc thái về mức độ. Cấu trúc được làm gọn và đại từ được minh định, không thêm diễn giải thần học hay thay đổi phạm vi địa lý của nguyên văn.
  reviewer_model: gpt-5.6-terra
