  verdict: revise
  source_fidelity: 'Bản dịch bảo toàn đúng trật tự và các thành tố chính: hành động nắm tay, thì hiện tại lịch sử «nói», lời A-ram được phiên âm, lời giải nghĩa, và mệnh lệnh «hãy đứng dậy». Tuy nhiên, «Này» trong lời giải nghĩa thêm một yếu tố chỉ xuất không được diễn đạt rõ trong Τὸ κοράσιον; mạo từ ở đây có thể phục vụ cách gọi trực tiếp và không buộc phải dịch là «này».'
