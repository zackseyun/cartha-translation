  terminology: «Đứa trẻ» phản ánh παιδίον trước khi lời giải nghĩa xác định là bé gái; «bé gái» phản ánh κοράσιον tốt. «Ta-li-tha kum» giữ hình thức A-ram được bảo tồn trong bản Hy Lạp, còn «nghĩa là» diễn đạt tự nhiên chức năng giải thích/dịch của μεθερμηνευόμενον.
  issues:
