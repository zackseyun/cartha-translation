  text: καὶ κρατήσας τῆς χειρὸς τοῦ παιδίου λέγει αὐτῇ· Ταλιθα ⸀κουμ, ὅ ἐστιν μεθερμηνευόμενον· Τὸ κοράσιον, σοὶ λέγω, ⸀ἔγειρε.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/041.yaml
  text: And taking the child's hand[a], he says to her, “Talitha koum,” which is translated, “Little girl, I say to you, get up.”
translation:
  language: vi
  text: 'Ngài nắm lấy tay đứa trẻ và nói với em: “Ta-li-tha kum,” nghĩa là: “Bé gái, Ta bảo con, hãy đứng dậy.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κρατήσας τῆς χειρὸς τοῦ παιδίου
  choice: nắm lấy tay đứa trẻ
  rationale: Cụm κρατέω với sở hữu cách diễn tả hành động cầm hoặc nắm lấy tay. “Nắm lấy tay” tự nhiên, cụ thể và không mang sắc thái mạnh như “chộp lấy”; “đứa trẻ” giữ nghĩa của παιδίον trước khi câu sau xác định là bé gái.
- source_word: λέγει αὐτῇ
  choice: nói với em
  rationale: Giữ thì hiện tại lịch sử của Mác bằng “nói”; đại từ “em” phù hợp với một bé gái trong văn phong kể chuyện hiện đại.
- source_word: Ταλιθα κουμ
  choice: Ta-li-tha kum
  rationale: Giữ lại lời A-ram như bản Hy Lạp đã làm, rồi để chính lời giải nghĩa của Mác giải thích. “Kum” phản ánh cách viết κουμ trong SBLGNT.
- source_word: ὅ ἐστιν μεθερμηνευόμενον
  choice: nghĩa là
  rationale: Diễn đạt tự nhiên chức năng giải dịch của μεθερμηνευόμενον trong tiếng Việt, không làm câu nặng nề.
- source_word: Τὸ κοράσιον
  choice: Này bé gái
  rationale: κοράσιον chỉ một bé gái và có sắc thái nhỏ tuổi; “này” thể hiện lời gọi trực tiếp trong câu giải nghĩa.
- source_word: σοὶ λέγω
  choice: Ta bảo con
  rationale: Giữ nguyên đại từ nhấn mạnh σοὶ và động từ λέγω. Cặp xưng hô “Ta–con” trang trọng, dễ hiểu trong lời trực tiếp của Chúa Giê-su với một bé gái.
- source_word: ἔγειρε
  choice: hãy đứng dậy
  rationale: Mệnh lệnh ἐγείρω trong ngữ cảnh này yêu cầu em trỗi dậy/đứng lên. “Hãy đứng dậy” rõ nghĩa và tự nhiên hơn “hãy trỗi dậy” trong tiếng Việt phổ thông.
theological_decisions:
- issue: Giữ lời A-ram của Chúa Giê-su trong chính văn
  choice: Giữ dạng phiên âm “Ta-li-tha kum” và ngay sau đó giữ lời giải nghĩa của Mác.
  alternative: Chỉ dịch câu này là “Này bé gái, Ta bảo con, hãy đứng dậy”, hoặc dùng cách viết truyền thống chịu ảnh hưởng La-tinh.
  rationale: Bản nguồn Hy Lạp vừa lưu giữ lời A-ram vừa giải nghĩa; giữ cả hai bảo toàn kết cấu và sắc thái kể chuyện của nguyên bản mà vẫn giúp độc giả hiểu rõ.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Giữ hiện tại lịch sử “nói” để phản ánh lối kể sống động của Mác. Phiên âm “Ta-li-tha” theo cách đọc dễ tiếp cận với độc giả Việt; không thêm chú thích vì chính câu đã cung cấp nghĩa và không có dị bản cần thiết cho việc hiểu câu.
