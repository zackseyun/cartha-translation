  text: καὶ ἀπῆλθεν μετ’ αὐτοῦ. Καὶ ἠκολούθει αὐτῷ ὄχλος πολύς, καὶ συνέθλιβον αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/024.yaml
  text: And he went with him[a]. And a large crowd was following him and pressing around him.
translation:
  language: vi
  text: Đức Giê-su đi cùng ông. Một đám đông lớn đi theo Ngài và chen ép Ngài.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “chen chúc quanh Ngài” hoặc “ép sát Ngài.” Động từ Hy Lạp diễn tả đám đông dồn ép sát vào Đức Giê-su về mặt thể chất.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπῆλθεν
  choice: đi
  rationale: Động từ ở thì aorist thuật lại việc Đức Giê-su lên đường theo lời khẩn cầu của Giai-ru; “đi” tự nhiên và đúng ngữ cảnh hơn “rời đi”.
- source_word: μετ’ αὐτοῦ
  choice: cùng ông
  rationale: μετά với sở hữu cách chỉ sự đồng hành; “cùng ông” diễn đạt rõ Đức Giê-su đi với Giai-ru.
- source_word: ἠκολούθει
  choice: đi theo
  rationale: Thì chưa hoàn thành diễn tả hành động đang tiếp diễn; trong tiếng Việt, ngữ cảnh trần thuật cùng cấu trúc câu đã truyền đạt tiến trình này một cách tự nhiên.
- source_word: ὄχλος πολύς
  choice: một đám đông rất đông
  rationale: Giữ được ý chỉ quy mô lớn của πολύς bằng cách diễn đạt phổ thông, dễ hiểu.
- source_word: συνέθλιβον
  choice: chen lấn quanh
  rationale: Động từ diễn tả đám đông dồn ép sát vào Đức Giê-su; “chen lấn quanh” vừa tự nhiên vừa bảo toàn sắc thái va ép về thể chất mà không hàm ý gây thương tích.
- source_word: αὐτόν
  choice: Ngài
  rationale: Đại từ làm tân ngữ chỉ Đức Giê-su; “Ngài” giúp quy chiếu rõ ràng và phù hợp văn phong Kinh Thánh trang trọng.
theological_decisions: []
translation_notes:
  register: Bản dịch dùng tiếng Việt hiện đại, trang trọng và dễ hiểu. Tách hai mệnh đề thành hai câu theo nhịp kể của nguyên văn; dùng “Đức Giê-su” để làm rõ chủ thể và “ông” cho Giai-ru. Dấu chú thích [a] được đặt ngay sau cụm từ mà chú thích giải thích.
