  source_fidelity: 'Bản dịch phản ánh đầy đủ các thành phần của câu Hy Lạp: tính liên tục xuyên suốt ("Suốt đêm ngày"), bối cảnh "giữa các ngôi mộ và trên các núi", hai hành động đang tiếp diễn "cứ gào thét" và "lấy đá rạch mình". "Lấy đá" diễn đạt đúng dữ cách chỉ phương tiện của λίθοις. Không thêm diễn giải thần học hay lịch sử ngoài bản văn.'
  naturalness: Câu tiếng Việt hiện đại, rõ ràng và có nhịp kể tự nhiên. "Suốt đêm ngày" và "cứ gào thét" phối hợp tốt để diễn tả tính kéo dài/lặp lại. "Rạch mình" là cách nói dễ hiểu, phù hợp với mức độ mạnh của κατακόπτων mà không cường điệu.
  terminology: '"Các ngôi mộ" phù hợp với μνήμασιν; "các núi" giữ nghĩa trực tiếp của ὄρεσιν. "Gào thét" là lựa chọn có cường độ thích hợp cho κράζων trong ngữ cảnh này. Chú thích nêu một phương án từ vựng hợp lệ ("cứa mình") và giữ đúng neo [a].'
