source:
  edition: SBLGNT
  text: καὶ διὰ παντὸς νυκτὸς καὶ ἡμέρας ἐν τοῖς ⸂μνήμασιν καὶ ἐν τοῖς ὄρεσιν⸃ ἦν κράζων καὶ κατακόπτων ἑαυτὸν λίθοις.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/005.yaml
  text: And continually[a], night and day, among the tombs and on the mountains, he was crying out and cutting himself with stones.
translation:
  language: vi
  text: Suốt đêm ngày, giữa các ngôi mộ và trên các núi, anh ta cứ gào thét và lấy đá rạch mình.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Anh ta liên tục gào thét và lấy đá cứa mình.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ παντὸς νυκτὸς καὶ ἡμέρας
  choice: Suốt đêm ngày
  rationale: Cụm διά + sở hữu cách diễn tả sự tiếp diễn xuyên suốt thời gian; cách nói này tự nhiên trong tiếng Việt và giữ cả hai yếu tố đêm và ngày.
- source_word: μνήμασιν
  choice: các ngôi mộ
  rationale: μνῆμα chỉ nơi chôn cất hoặc phần mộ, có thể là mộ khoét trong đá; “ngôi mộ” cụ thể và phù hợp bối cảnh hơn “mồ mả”.
- source_word: ὄρεσιν
  choice: các núi
  rationale: ὄρος trực tiếp có nghĩa là núi; giữ cách dịch này thay vì thu hẹp thành “đồi”.
- source_word: ἦν κράζων
  choice: cứ gào thét
  rationale: Kết cấu vị hoàn thành chưa hoàn tất với phân từ hiện tại nhấn mạnh hành động kéo dài hoặc lặp đi lặp lại trong quá khứ; “cứ gào thét” truyền đạt rõ sắc thái ấy.
- source_word: κατακόπτων ἑαυτὸν
  choice: rạch mình
  rationale: κατακόπτω diễn tả việc đánh hoặc cắt mạnh, gây thương tích; “rạch mình” rõ nghĩa, tự nhiên và giữ tính nghiêm trọng mà không thêm ý “tự hủy hoại” quá rộng.
- source_word: λίθοις
  choice: lấy đá
  rationale: Dữ cách mang nghĩa phương tiện; “lấy đá” là cách diễn đạt tự nhiên trong tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Anh ta” duy trì sự quy chiếu rõ ràng tới người đàn ông trong mạch kể; “gào thét” và “rạch mình” truyền đạt cường độ của các động từ Hy Lạp mà không cường điệu.
