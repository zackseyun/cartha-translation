source:
  edition: SBLGNT
  text: καὶ εἰσελθὼν λέγει αὐτοῖς· Τί θορυβεῖσθε καὶ κλαίετε; τὸ παιδίον οὐκ ἀπέθανεν ἀλλὰ καθεύδει.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/039.yaml
  text: And after entering, he says to them, “Why are you making a commotion and weeping? The child has not died, but is sleeping.”
translation:
  language: vi
  text: 'Khi vào, Đức Chúa Jêsus nói với họ: “Sao mọi người lại ồn ào và khóc lóc? Đứa trẻ không chết, nhưng đang ngủ.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “Đứa trẻ đã không chết, nhưng đang ngủ.” Trong bối cảnh em sắp được khiến sống lại, lời Đức Chúa Jêsus có thể dùng “ngủ” như hình ảnh về sự chết.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσελθὼν
  choice: Sau khi vào nhà
  rationale: Phân từ bất định diễn tả hành động đi vào xảy ra trước động từ chính; “vào nhà” làm rõ đích đến theo ngữ cảnh gần mà không làm thay đổi ý câu.
- source_word: λέγει
  choice: nói
  rationale: Thì hiện tại lịch sử tạo nét kể chuyện sống động trong tiếng Hy Lạp; tiếng Việt tự nhiên không bắt buộc đánh dấu thì, nên “nói” vừa sát nghĩa vừa giữ được nhịp kể.
- source_word: Τί
  choice: Tại sao
  rationale: Trong câu hỏi này, Τί có chức năng hỏi nguyên nhân và hàm ý quở trách; “Tại sao” là cách diễn đạt tự nhiên.
- source_word: θορυβεῖσθε
  choice: các người náo động
  rationale: Động từ chỉ tình trạng hoặc hành vi gây ồn ào, hỗn độn. “Náo động” giữ được sắc thái âm thanh và cảnh tang lễ mà không diễn giải quá mức.
- source_word: κλαίετε
  choice: than khóc
  rationale: “Than khóc” phù hợp bối cảnh tang chế và có sắc thái trang nghiêm; không đặc định đây là nghi thức khóc thuê.
- source_word: παιδίον
  choice: đứa trẻ
  rationale: Danh từ Hy Lạp có nghĩa chung là một đứa trẻ. Dù ngữ cảnh cho biết đó là bé gái, bản dịch giữ cách gọi khái quát của chính câu này.
- source_word: οὐκ ἀπέθανεν
  choice: không chết đâu
  rationale: Giữ động từ chỉ sự chết thay vì chuyển thành trạng thái “không phải đã chết”; tiểu từ “đâu” tạo sự đối lập tự nhiên với mệnh đề sau trong lời nói tiếng Việt.
- source_word: καθεύδει
  choice: đang ngủ
  rationale: Giữ nguyên hình ảnh ngủ của nguyên văn và dạng hiện tại, không giải thích trước đó là ẩn dụ hay lời nói hướng tới việc sắp làm cho sống lại.
theological_decisions:
- issue: Lời Đức Chúa Jêsus là phủ nhận cái chết theo nghĩa đen hay dùng giấc ngủ như hình ảnh về cái chết
  choice: Giữ nguyên đối lập “không chết đâu, nhưng đang ngủ” trong chính văn.
  alternative: Diễn giải thành “không chết vĩnh viễn” hoặc “đối với Ngài, đứa trẻ chỉ như đang ngủ vì Ngài sắp khiến em sống lại.”
  rationale: Nguyên văn cố ý đặt hai vế đối lập một cách mạnh mẽ. Bản dịch không tự quyết định lời này là cách nói ẩn dụ, theo hiện tượng, hay báo trước việc làm cho sống lại.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và dễ hiểu. “Đức Chúa Jêsus” nhận diện chủ thể vốn được đại từ ngầm chỉ trong động từ Hy Lạp; “các người” phù hợp lời nói trực tiếp với một nhóm người. Dấu chú thích [a] được đặt ngay sau câu có nội dung cần chú giải.
