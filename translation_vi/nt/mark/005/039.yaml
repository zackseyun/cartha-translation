revisions:
- from: 'Sau khi vào nhà, Đức Chúa Jêsus nói với họ: “Tại sao các người náo động và than khóc? Đứa trẻ không chết đâu, nhưng đang ngủ.”[a]'
  to: 'Khi vào, Đức Chúa Jêsus nói với họ: “Sao mọi người lại ồn ào và khóc lóc? Đứa trẻ không chết, nhưng đang ngủ.”[a]'
  rationale: Bản sửa loại bỏ địa điểm không được nêu trong câu nguồn, dùng cách diễn đạt hiện đại hơn cho cảnh huyên náo và khóc, và giữ nguyên sự mơ hồ của lời Đức Chúa Jêsus. Chú thích nêu khả năng hình ảnh về sự chết mà không quyết định đây là cách hiểu duy nhất.
