- from: Ngài nghiêm khắc căn dặn họ rằng đừng để ai biết việc này,[a] rồi bảo họ cho cô bé ăn.[b]
  to: Ngài nghiêm khắc căn dặn họ rằng không được để ai biết việc này,[a] và bảo phải cho cô bé ăn.[b]
  rationale: Bản sửa giữ nguyên lời căn dặn mạnh mẽ và mục đích giữ kín, đồng thời chuyển mệnh đề cuối sang cấu trúc vô nhân xưng «bảo phải cho cô bé ăn» để phản ánh bị động của nguyên ngữ mà không thêm người thực hiện. Hai chú thích được chỉnh để mô tả chính xác và tự nhiên hơn các sắc thái Hy Lạp.
  reviewer_model: gpt-5.6-terra
