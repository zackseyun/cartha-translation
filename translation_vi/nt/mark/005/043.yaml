  yaml_path: translation/nt/mark/005/043.yaml
  text: And he strictly ordered them that no one should know this[c][b][a], and he said that she should be given something to eat.
translation:
  language: vi
  text: Ngài nghiêm khắc căn dặn họ rằng không được để ai biết việc này,[a] và bảo phải cho cô bé ăn.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Ngài hết sức nghiêm khắc căn dặn họ rằng không được để ai biết việc này.” Từ Hy Lạp có nghĩa sát là “nhiều/nhiều điều” và ở đây nhấn mạnh lời căn dặn.'
    reason: lexical_alternative
  - marker: b
    text: 'Theo nghĩa sát: “bảo phải cho cô ấy ăn.” Cũng có thể hiểu là bảo cho cô bé thứ gì để ăn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διεστείλατο αὐτοῖς πολλὰ
  choice: nghiêm khắc căn dặn họ
  rationale: Động từ διαστέλλομαι chỉ một lời chỉ thị hoặc cảnh báo mạnh; πολλὰ có chức năng nhấn mạnh mức độ. Cách dịch này tự nhiên trong tiếng Việt và giữ được sức nặng của thành ngữ Hy Lạp.
- source_word: ἵνα μηδεὶς γνοῖ τοῦτο
  choice: rằng đừng để ai biết việc này
  rationale: Mệnh đề ἵνα với động từ ở thức giả định diễn tả nội dung và mục đích của lời căn dặn. Cách nói này truyền đạt tự nhiên ý không để sự việc trở nên được biết đến.
- source_word: εἶπεν
  choice: bảo
  rationale: Trong ngữ cảnh mang tính chỉ thị, εἶπεν có thể được diễn đạt tự nhiên là “bảo” mà không tăng cường sắc thái quá mức.
- source_word: δοθῆναι αὐτῇ φαγεῖν
  choice: cho cô bé ăn
  rationale: Cụm Hy Lạp theo nghĩa sát là “cho cô bé để ăn.” Tiếng Việt tự nhiên diễn đạt là “cho cô bé ăn”; danh tính người được nói đến rõ từ ngữ cảnh.
theological_decisions:
- issue: Mệnh lệnh giữ kín và phạm vi của lời căn dặn
  choice: Chỉ diễn đạt lời căn dặn mạnh mẽ rằng không ai được biết việc này
  alternative: Giải thích đây là một phần của chủ đề bí mật về Đấng Mê-si hoặc giới hạn rõ mệnh lệnh vào gia đình và các nhân chứng trực tiếp
  rationale: Câu Hy Lạp không giải thích động cơ thần học hay xác định thêm phạm vi; bản dịch giữ nguyên sự căng thẳng và không đưa lời giải thích vào chính văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Ngài” để chỉ Chúa Giê-su theo văn mạch Kinh Thánh tiếng Việt; “cô bé” làm rõ đại từ giống cái αὐτῇ theo ngữ cảnh mà không thêm nội dung thần học.
