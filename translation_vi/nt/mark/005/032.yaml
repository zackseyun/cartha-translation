translation:
  language: vi
  text: Ngài cứ nhìn quanh để thấy người phụ nữ đã làm việc ấy.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: (không dịch riêng)
  rationale: Trong mạch kể tiếng Việt, việc mở câu trực tiếp bằng chủ ngữ giữ được sự tiếp nối tự nhiên mà không thêm sắc thái suy luận như “vì vậy” hay trình tự như “rồi”.
- source_word: περιεβλέπετο
  choice: cứ nhìn quanh
  rationale: Thể chưa hoàn thành diễn tả hành động đang tiếp diễn; “cứ nhìn quanh” tự nhiên và truyền đạt việc liên tục đưa mắt quan sát xung quanh.
- source_word: ἰδεῖν
  choice: để xem
  rationale: Diễn đạt mục đích của hành động nhìn quanh, sát nghĩa và tự nhiên trong tiếng Việt.
- source_word: τὴν ... ποιήσασαν
  choice: ai là người đã làm
  rationale: Cấu trúc này diễn đạt tự nhiên phân từ được dùng như danh từ. Tiếng Việt không đánh dấu giống ngữ pháp ở “người”, nên thông tin rằng đối tượng là nữ được giữ trong chú thích.
- source_word: τοῦτο
  choice: việc ấy
  rationale: Chỉ hành động vừa được nhắc đến trong ngữ cảnh; “việc ấy” trang trọng, rõ ràng và tự nhiên hơn cách dịch máy móc “điều này” ở đây.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và dễ hiểu. “Ngài” chỉ Chúa Giê-su theo ngữ cảnh; “cứ nhìn quanh” giữ sắc thái tiếp diễn của động từ Hy Lạp. Cấu trúc “ai là người” được dùng để câu tiếng Việt tự nhiên, còn giống cái của nguyên văn được bảo tồn bằng chú thích.
