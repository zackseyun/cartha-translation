  text: καὶ ⸀παρακαλεῖ αὐτὸν πολλὰ λέγων ὅτι Τὸ θυγάτριόν μου ἐσχάτως ἔχει, ἵνα ἐλθὼν ἐπιθῇς ⸂τὰς χεῖρας αὐτῇ⸃ ⸀ἵνα σωθῇ καὶ ⸀ζήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/023.yaml
  text: And he begged him earnestly[a], saying, “My little daughter is at the point of death. Come and lay your hands on her, so that she may be healed and live.”
translation:
  language: vi
  text: 'Ông khẩn thiết nài xin Ngài, rằng: “Con gái nhỏ của tôi đang hấp hối. Xin Ngài đến đặt tay trên cháu, để cháu được chữa lành[a] và sống.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hoặc “được cứu” hay “được giải thoát.” Động từ Hy Lạp có thể mang nghĩa cứu, giải thoát hoặc chữa lành; trong ngữ cảnh trực tiếp ở đây, nó nói đến sự chữa lành thể chất.
    reason: alternative_reading
lexical_decisions:
- source_word: παρακαλεῖ αὐτὸν πολλὰ
  choice: khẩn thiết nài xin Ngài
  rationale: παρακαλεῖ trong hoàn cảnh này diễn tả lời cầu xin cấp bách; πολλὰ làm tăng cường mức độ. Cách dịch này tự nhiên trong tiếng Việt và thể hiện sự tuyệt vọng của người cha mà không khẳng định ông đã cầu xin nhiều lần.
- source_word: θυγάτριόν μου
  choice: con gái nhỏ của tôi
  rationale: Dạng giảm nhẹ θυγάτριον có thể gợi tuổi nhỏ và tình cảm trìu mến. “Con gái nhỏ” giữ được cả hai sắc thái trong tiếng Việt hiện đại.
- source_word: ἐσχάτως ἔχει
  choice: đang hấp hối
  rationale: Thành ngữ Hy Lạp chỉ tình trạng đã đến mức cuối cùng, trong ngữ cảnh này là cận kề cái chết. “Đang hấp hối” diễn đạt rõ sự nguy cấp và tự nhiên hơn một lối dịch sát chữ.
- source_word: ἐλθὼν ἐπιθῇς τὰς χεῖρας αὐτῇ
  choice: Xin Ngài đến đặt tay trên cháu
  rationale: Phân từ ἐλθών mang lực của một hành động đi kèm lời cầu xin. “Đến đặt tay” giữ nguyên cử chỉ chữa lành; “cháu” là cách người cha tự nhiên dùng để nói về con mình với một người được kính trọng.
- source_word: σωθῇ
  choice: được cứu
  rationale: σῴζω có thể mang nghĩa cứu, giải thoát hoặc chữa lành. “Được cứu” giữ độ rộng từ vựng và mối liên hệ với ý niệm cứu thoát, còn chú thích nêu nghĩa chữa lành phù hợp với ngữ cảnh trước mắt.
- source_word: ζήσῃ
  choice: sống
  rationale: ζάω ở đây có nghĩa trực tiếp là sống; từ này bổ sung kết quả mong muốn của việc được cứu hoặc chữa lành.
theological_decisions:
- issue: Nghĩa của σωθῇ trong bối cảnh chữa bệnh
  choice: được cứu
  alternative: được chữa lành; được bình phục
  rationale: Ngữ cảnh trực tiếp nói về sự chữa lành thể chất, nhưng động từ Hy Lạp có phạm vi nghĩa rộng hơn. Giữ “được cứu” trong chính văn bảo tồn sự căng mở về từ vựng và thần học, còn chú thích giúp người đọc nhận ra nghĩa y tế rất phù hợp tại đây.
translation_notes:
  register: Văn phong hiện đại, trang trọng nhưng dễ hiểu. Dùng “Ngài” cho Đức Chúa Jêsus và “ông” cho người cha để thể hiện sự kính trọng trong lời thỉnh cầu; dùng “cháu” trong lời người cha nói về con gái mình, phù hợp với cách xưng hô tự nhiên của tiếng Việt.
