  verdict: revise
  source_fidelity: Bản dịch truyền đạt đúng tính cấp bách của lời khẩn cầu, tình trạng cận tử của con gái, cử chỉ đặt tay, và kết quả mong muốn là được chữa lành để sống. Tuy nhiên, trong ngữ cảnh chữa bệnh trực tiếp này, σωθῇ tự nhiên và chính xác hơn khi dịch là “được chữa lành”; “được cứu” trong tiếng Việt hiện đại dễ bị hiểu chủ yếu theo nghĩa cứu rỗi và làm mờ ngữ cảnh bệnh tật. Việc chú thích nghĩa rộng hơn vẫn có thể bảo lưu phạm vi của động từ Hy Lạp.
  naturalness: “Ông khẩn thiết nài xin Ngài” và lời nói trực tiếp nhìn chung tự nhiên, trang trọng. Thêm “rằng” phản ánh rõ hơn λέγων ὅτι mà không làm câu nặng. “Cháu” là lối xưng hô có thể dùng khi người cha nói với một người đáng kính, nên có thể giữ.
  terminology: Nên dùng “được chữa lành” trong chính văn cho σωθῇ, phù hợp ngữ cảnh và với bản tiếng Anh POB hiện hành. Chú thích cần nêu “được cứu” như một khả năng từ vựng, thay vì mô tả “được bình phục” như một lựa chọn tương đương trực tiếp.
  issues:
