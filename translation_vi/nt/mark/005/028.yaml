  text: ἔλεγεν γὰρ ὅτι ⸂Ἐὰν ἅψωμαι κἂν τῶν ἱματίων αὐτοῦ⸃ σωθήσομαι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/028.yaml
  text: For she was saying[a], "If I touch even his garments, I will be healed."
translation:
  language: vi
  text: 'Vì bà cứ nói: “Nếu tôi chạm dù chỉ vào áo quần của Ngài, tôi sẽ được chữa lành[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Động từ Hy Lạp cũng có thể được dịch là “được cứu” hoặc “được bình phục”; ở đây, ngữ cảnh hướng đến sự chữa lành thể chất.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: bà vẫn nói
  rationale: Thì chưa hoàn thành diễn tả lời nói đang tiếp diễn hoặc được lặp lại trong quá khứ. Cách dịch này giữ phương diện của động từ mà không tự ý xác định bà nói thành tiếng hay nói trong lòng.
- source_word: γὰρ
  choice: Vì
  rationale: Liên từ đưa ra lời giải thích cho hành động vừa được thuật lại ở câu trước.
- source_word: ὅτι
  choice: dấu hai chấm và lời trích dẫn trực tiếp
  rationale: ὅτι giới thiệu nội dung lời bà nói; lời dẫn trực tiếp là cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: ἐὰν ... κἂν
  choice: Dù chỉ ... cũng
  rationale: 'Diễn đạt điều kiện cùng sắc thái tối thiểu hóa của κἂν: bà tin rằng chỉ một sự tiếp xúc rất nhỏ cũng đủ.'
- source_word: ἅψωμαι
  choice: chạm vào
  rationale: Đây là nghĩa thông dụng và phù hợp ngữ cảnh của ἅπτω ở thể trung.
- source_word: τῶν ἱματίων αὐτοῦ
  choice: áo quần của Ngài
  rationale: ἱμάτια ở số nhiều, chỉ y phục nói chung. “Áo quần” vừa chính xác vừa tự nhiên trong tiếng Việt hiện đại, không thu hẹp nghĩa thành một loại áo cụ thể.
- source_word: σωθήσομαι
  choice: tôi sẽ được chữa lành
  rationale: Trong ngữ cảnh người phụ nữ mắc bệnh mong được phục hồi thể chất, “được chữa lành” truyền đạt nghĩa trực tiếp; nghĩa rộng hơn là “được cứu” được giữ trong chú thích.
theological_decisions:
- issue: Nghĩa của σωθήσομαι trong trình thuật chữa lành
  choice: tôi sẽ được chữa lành
  alternative: tôi sẽ được cứu; tôi sẽ được bình phục
  rationale: Ngữ cảnh trước mắt nói về sự chữa lành thân thể, nhưng động từ σῴζω cũng có nghĩa “cứu”. Bản chính dùng nghĩa phù hợp ngữ cảnh và chú thích giữ lại chiều rộng ngữ nghĩa cũng như khả năng liên hệ giữa chữa lành và cứu rỗi.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Cấu trúc “Dù chỉ… cũng…” chuyển tải tự nhiên sắc thái nhấn mạnh của κἂν; “Ngài” duy trì lối xưng hô tôn kính quen thuộc đối với Chúa Giê-su.
