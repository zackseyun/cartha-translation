  text: καὶ οὐκ ἀφῆκεν οὐδένα ⸂μετ’ αὐτοῦ⸃ συνακολουθῆσαι εἰ μὴ ⸀τὸν Πέτρον καὶ Ἰάκωβον καὶ Ἰωάννην τὸν ἀδελφὸν Ἰακώβου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/037.yaml
  text: And he allowed no one to accompany him except Peter and James and John, the brother of James.
translation:
  language: vi
  text: Ngài không cho ai đi cùng Ngài, ngoại trừ Phi-e-rơ, Gia-cơ và Giăng, người anh em của Gia-cơ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀφῆκεν
  choice: cho
  rationale: Trong cấu trúc với động từ nguyên mẫu, ἀφίημι mang nghĩa cho phép. “Không cho ai” là cách diễn đạt tự nhiên, rõ ràng trong tiếng Việt hiện đại.
- source_word: οὐδένα
  choice: không ai
  rationale: Truyền đạt sự loại trừ toàn bộ một cách trực tiếp và tự nhiên.
- source_word: μετ’ αὐτοῦ συνακολουθῆσαι
  choice: đi cùng mình
  rationale: Động từ kép συνακολουθέω cùng cụm μετ’ αὐτοῦ diễn tả việc theo cùng hoặc đồng hành với Chúa Giê-su. “Đi cùng mình” tránh lặp ý và hợp với ngữ cảnh di chuyển.
- source_word: εἰ μὴ
  choice: ngoại trừ
  rationale: Ở đây cụm từ nêu ngoại lệ chứ không diễn tả điều kiện.
- source_word: τὸν Πέτρον καὶ Ἰάκωβον καὶ Ἰωάννην
  choice: Phi-e-rơ, Gia-cơ và Giăng
  rationale: Dùng dạng tên riêng quen thuộc trong tiếng Việt; phép liệt kê bằng dấu phẩy và “và” tự nhiên hơn việc lặp liên từ Hy Lạp.
- source_word: τὸν ἀδελφὸν Ἰακώβου
  choice: là em của Gia-cơ
  rationale: Cụm đồng vị xác định Giăng. Trong mạch kể Mác, Gia-cơ thường được nêu trước Giăng, và tiếng Việt truyền thống nhận diện Giăng là em; tuy nhiên, danh từ Hy Lạp chỉ xác định quan hệ anh em, không tự thân mã hóa lớn hay nhỏ.
theological_decisions:
- issue: Tuổi tương đối trong ἀδελφός
  choice: em của Gia-cơ
  alternative: anh/em của Gia-cơ; người anh em của Gia-cơ
  rationale: Tiếng Việt thường đòi hỏi cụ thể hóa quan hệ anh em. “Em của Gia-cơ” là cách gọi tự nhiên và quen thuộc, nhưng nguyên văn Hy Lạp chỉ nói “anh/em”; vì vậy ghi nhận độ rộng nghĩa trong quyết định dịch.
translation_notes:
  register: Văn phong kể chuyện trang trọng vừa phải, hiện đại và dễ hiểu. Đại từ “Ngài” quy chiếu về Chúa Giê-su theo ngữ cảnh; “mình” làm đại từ phản thân tự nhiên sau chủ ngữ này.
