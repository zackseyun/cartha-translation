revisions:
- from: Bấy giờ, một trong các trưởng hội đường, tên là Giai-ru, đi đến. Khi thấy Đức Chúa Jêsus, ông sấp mình dưới chân Ngài.
  to: Một trong các trưởng hội đường, tên là Giai-ru, đến. Khi thấy Người, ông ngã xuống dưới chân Người.
  rationale: Loại bỏ yếu tố thời gian và danh xưng được thêm vào; giữ cấu trúc bộ phận “một trong các trưởng hội đường”, tên riêng, mệnh đề thời gian, và hành động ngã xuống dưới chân mà không diễn giải thành thờ phượng.
