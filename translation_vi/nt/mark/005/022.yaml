review_pass:
  verdict: revise
  source_fidelity: Bản nháp thêm “Bấy giờ”, không có trong câu Hy Lạp. “Đức Chúa Jêsus” cũng thay đại từ αὐτόν bằng một danh xưng có yếu tố “Chúa” không được nêu trong câu nguồn. Động tác πίπτει πρὸς τοὺς πόδας αὐτοῦ được dịch sát và trung tính hơn bằng “ngã xuống dưới chân Người” thay vì “sấp mình dưới chân Ngài”.
  naturalness: “Một trong các trưởng hội đường, tên là Giai-ru, đến” là câu tiếng Việt tự nhiên, rõ ràng và giữ được cách giới thiệu nhân vật. “Ngã xuống dưới chân Người” diễn đạt thông dụng và cụ thể cho hành động trong mạch kể.
  terminology: “Trưởng hội đường” phù hợp với ἀρχισυνάγωγος và giữ sắc thái chức trách Do Thái. Dùng “Giai-ru” theo dạng tên Việt hóa quen dùng. Tránh “Đức Chúa Jêsus”, vì vừa mang chính tả/đăng ký hệ phái vừa thêm danh xưng không hiện diện trong nguyên văn câu này.
  issues:
  - severity: medium
    issue: Thêm cụm “Bấy giờ”.
    rationale: καὶ chỉ liên kết tường thuật (“và”), không cung cấp trạng ngữ thời gian đặc thù tương đương “Bấy giờ”.
  - severity: medium
    issue: “Đức Chúa Jêsus” thêm danh xưng vào chỗ nguyên văn dùng đại từ αὐτόν.
    rationale: Câu Hy Lạp nói “thấy Người/ngài”; bản dịch không nên đưa thêm tước hiệu “Chúa” vào chính câu này. “Người” vẫn rõ quy chiếu theo ngữ cảnh.
  - severity: low
    issue: “Sấp mình dưới chân” diễn giải tư thế cụ thể hơn động từ πίπτει.
    rationale: πίπτει là “ngã xuống/fall”; “ngã xuống dưới chân” giữ hành động và độ mở về ý nghĩa kính trọng hay khẩn cầu.
  revised_text: Một trong các trưởng hội đường, tên là Giai-ru, đến. Khi thấy Người, ông ngã xuống dưới chân Người.
