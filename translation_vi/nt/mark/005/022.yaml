  text: ⸀καὶ ἔρχεται εἷς τῶν ἀρχισυναγώγων, ὀνόματι Ἰάϊρος, καὶ ἰδὼν αὐτὸν πίπτει πρὸς τοὺς πόδας αὐτοῦ
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/022.yaml
  text: And one of the synagogue rulers[a], named Jairus, came, and when he saw him[b], he fell at his feet.
translation:
  language: vi
  text: Một trong các trưởng hội đường, tên là Giai-ru, đến. Khi thấy Người, ông ngã xuống dưới chân Người.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔρχεται
  choice: đi đến
  rationale: Thì hiện tại lịch sử tạo nét sống động trong lời kể. Tiếng Việt không bắt buộc đánh dấu thì trên động từ, nên “đi đến” vừa tự nhiên vừa không cần chuyển rõ sang quá khứ.
- source_word: εἷς τῶν ἀρχισυναγώγων
  choice: một trong các trưởng hội đường
  rationale: Giữ cấu trúc bộ phận “một trong các” và dùng thuật ngữ ngắn gọn, quen thuộc cho người đảm nhiệm vai trò lãnh đạo, quản trị hội đường.
- source_word: ὀνόματι Ἰάϊρος
  choice: tên là Giai-ru
  rationale: Diễn đạt tự nhiên thành ngữ định danh bằng cách nêu tên của người vừa được giới thiệu.
- source_word: ἰδὼν αὐτόν
  choice: khi thấy Đức Chúa Jêsus
  rationale: Phân từ bất định quá khứ được diễn đạt bằng mệnh đề thời gian. Nêu rõ đối tượng của đại từ theo ngữ cảnh để câu tiếng Việt sáng nghĩa.
- source_word: πίπτει πρὸς τοὺς πόδας αὐτοῦ
  choice: ông sấp mình dưới chân Ngài
  rationale: Diễn tả hành động hạ mình xuống sát chân Đức Chúa Jêsus một cách tự nhiên, không biến hành động ấy thành một thuật ngữ chỉ sự thờ phượng.
theological_decisions:
- issue: Ý nghĩa tư thế của Giai-ru trước Đức Chúa Jêsus
  choice: ông sấp mình dưới chân Ngài
  alternative: ông thờ lạy Ngài
  rationale: Bản Hy Lạp mô tả hành động ngã hoặc sấp mình dưới chân, có thể biểu lộ lòng kính trọng, sự khẩn cầu hay tuyệt vọng, nhưng không dùng từ ngữ trực tiếp chỉ sự thờ phượng. Bản dịch vì thế giữ nguyên độ mở thần học của hành động.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Trưởng hội đường” giữ sắc thái chức vụ Do Thái trong bối cảnh lịch sử; “sấp mình dưới chân” vừa cụ thể vừa không diễn giải quá mức. Tên riêng dùng dạng Việt hóa quen thuộc “Giai-ru”.
