reference: Mark 5:13
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἐπέτρεψεν ⸀αὐτοῖς. καὶ ἐξελθόντα τὰ πνεύματα τὰ ἀκάθαρτα εἰσῆλθον εἰς τοὺς χοίρους, καὶ ὥρμησεν ἡ ἀγέλη κατὰ τοῦ κρημνοῦ εἰς τὴν θάλασσαν, ⸀ὡς δισχίλιοι, καὶ ἐπνίγοντο ἐν τῇ θαλάσσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/013.yaml
  text: And he permitted them[a]. Then the unclean spirits came out and entered the pigs, and the herd—about two thousand—rushed down the steep bank into the sea[b], and they drowned in the sea.
translation:
  language: vi
  text: Ngài cho phép chúng. Các linh ô uế đi ra rồi nhập vào đàn heo. Cả đàn, khoảng hai ngàn con, lao xuống triền dốc[a] vào biển[b] và chết đuối trong biển.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “bờ dốc” hoặc “vách đá”; từ Hy Lạp có thể chỉ một sườn dốc đứng hay một vách vực.
    reason: lexical_alternative
  - marker: b
    text: Nguyên văn là “biển”; ở đây chỉ Biển Ga-li-lê.
    reason: cultural_note
lexical_decisions:
- source_word: ἐπέτρεψεν αὐτοῖς
  choice: Ngài cho phép chúng
  rationale: Diễn đạt trực tiếp ý cho phép; đại từ “chúng” giữ nguyên đối tượng đã được xác định trong văn cảnh là các uế linh mà không lặp lại danh từ.
- source_word: τὰ πνεύματα τὰ ἀκάθαρτα
  choice: các uế linh
  rationale: Giữ ý “các linh ô uế” và tính hữu thể của πνεύματα, đồng thời dùng cách nói gọn, quen thuộc và trang trọng trong tiếng Việt.
- source_word: ἐξελθόντα
  choice: ra khỏi người ấy
  rationale: Động từ chỉ việc các uế linh đi ra; “khỏi người ấy” làm rõ điểm xuất phát đã hiển nhiên trong văn cảnh mà không thay đổi nội dung.
- source_word: εἰσῆλθον εἰς τοὺς χοίρους
  choice: nhập vào bầy heo
  rationale: “Nhập vào” diễn đạt tự nhiên việc các linh đi vào những con heo; “bầy heo” chuẩn bị mạch văn cho danh từ tập hợp ἡ ἀγέλη ngay sau đó.
- source_word: ὥρμησεν ἡ ἀγέλη
  choice: cả bầy ... lao
  rationale: “Lao” truyền đạt chuyển động đột ngột và dữ dội mà không thêm sắc thái hoảng loạn không được nói rõ; “cả bầy” phù hợp với chủ ngữ tập hợp.
- source_word: κατὰ τοῦ κρημνοῦ
  choice: theo triền dốc đứng
  rationale: κρημνός có thể chỉ sườn dốc, bờ dốc hoặc vực; “triền dốc đứng” truyền đạt địa hình nguy hiểm mà không khẳng định đó là vách thẳng đứng.
- source_word: ὡς δισχίλιοι
  choice: khoảng hai ngàn con
  rationale: “Khoảng” bảo toàn tính xấp xỉ của ὡς; loại từ “con” là tự nhiên trong tiếng Việt và cho thấy con số nói về đàn heo.
- source_word: εἰς τὴν θάλασσαν
  choice: xuống biển
  rationale: Giữ nghĩa trực tiếp của θάλασσα là “biển”; “xuống” kết hợp tự nhiên với chuyển động từ triền dốc vào nước.
- source_word: ἐπνίγοντο
  choice: chết đuối
  rationale: Truyền đạt tự nhiên kết cục đàn heo bị ngạt nước; thì chưa hoàn thành của tiếng Hy Lạp mô tả sự việc đang diễn ra trong cảnh thuật nhưng tiếng Việt không cần đánh dấu hình thái tương ứng.
theological_decisions:
- issue: Đối tượng của “chúng” trong câu “Ngài cho phép chúng”
  choice: Hiểu là các uế linh đã xin được nhập vào đàn heo
  alternative: Lặp rõ “các uế linh” ngay trong câu đầu
  rationale: Đại từ αὐτοῖς quy chiếu tự nhiên đến các linh trong văn cảnh liền trước; giữ đại từ bảo toàn lối kể súc tích của nguyên văn.
- issue: Cách gọi τὰ πνεύματα τὰ ἀκάθαρτα
  choice: Giữ ngôn ngữ hữu thể có ngôi qua cụm “các uế linh”
  alternative: các thế lực xấu xa
  rationale: Nguyên văn trình bày các πνεύματα như những tác nhân có hành động; không nên giản lược thành các lực lượng vô ngôi hoặc thêm suy đoán về bản chất của chúng.
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” theo văn cảnh để chỉ Đức Giê-su; dùng “heo” thay vì từ cổ hoặc quá trang trọng. Nhịp câu giữ chuỗi hành động nhanh của nguyên văn, còn hai chú thích bảo toàn độ rộng nghĩa địa hình và cách gọi vùng nước.
