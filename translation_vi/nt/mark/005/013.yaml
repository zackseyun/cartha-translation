revisions:
- from: Ngài cho phép chúng. Các uế linh ra khỏi người ấy rồi nhập vào bầy heo. Cả bầy, khoảng hai ngàn con, lao theo triền dốc đứng[a] xuống biển[b] và chết đuối trong biển.
  to: Ngài cho phép chúng. Các linh ô uế đi ra rồi nhập vào đàn heo. Cả đàn, khoảng hai ngàn con, lao xuống triền dốc[a] vào biển[b] và chết đuối trong biển.
  rationale: Sửa trật tự từ của thuật ngữ then chốt thành “các linh ô uế”, chỉnh cách diễn đạt hướng chuyển động thành “lao xuống triền dốc”, và viết lại chú thích địa hình để phản ánh đúng phạm vi nghĩa của danh từ Hy Lạp κρημνός. Các yếu tố khác, gồm đại từ “chúng”, con số xấp xỉ, “biển”, và “chết đuối”, được giữ vì phù hợp với bản Hy Lạp và văn phong tiếng Việt hiện đại.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T07:39:39Z'
review_pass:
  verdict: revise
  source_fidelity: Bản dịch truyền đạt đúng chuỗi hành động, số lượng xấp xỉ, địa hình dốc, và kết cục đàn heo chết đuối. Tuy nhiên, “uế linh” không phải trật tự từ tự nhiên trong tiếng Việt hiện đại cho τὰ πνεύματα τὰ ἀκάθαρτα; nên dùng “các linh ô uế”. “Theo triền dốc” cũng kém trực tiếp hơn hướng chuyển động κατὰ τοῦ κρημνοῦ.
  naturalness: Câu văn nhìn chung rõ và có nhịp kể tốt. “Các uế linh” hơi gượng và “lao theo triền dốc đứng” kém tự nhiên hơn “lao xuống triền dốc”.
  terminology: “Các linh ô uế” giữ sát thuật ngữ Hy Lạp và cách bổ nghĩa tự nhiên của tiếng Việt, đồng thời không diễn giải thành một thuật ngữ giáo phái như “quỷ”. “Ngài”, “heo”, “chết đuối”, và “Biển Ga-li-lê” phù hợp văn phong kể chuyện trang trọng, hiện đại.
  issues:
  - severity: medium
    issue: Cụm “các uế linh” thiếu tự nhiên trong tiếng Việt hiện đại.
    rationale: 'τὰ πνεύματα τὰ ἀκάθαρτα có nghĩa đen là “các linh/thần ô uế”; tiếng Việt tự nhiên đặt tính từ sau danh từ: “các linh ô uế”. Cách sửa giữ nguyên tính hữu thể và nét “ô uế” của nguyên văn.'
  - severity: low
    issue: “Lao theo triền dốc đứng” làm yếu hướng “xuống” của κατὰ.
    rationale: Trong ngữ cảnh đàn heo lao từ trên cao vào biển, “lao xuống triền dốc” tự nhiên hơn và phản ánh rõ chuyển động đi xuống, mà không khẳng định κρημνός là vách đá thẳng đứng.
  - severity: low
    issue: Chú thích a diễn đạt các phương án thay thế như cụm động từ, trong khi κρημνός là danh từ địa hình.
    rationale: Nên nêu các tương đương danh từ như “bờ dốc” hoặc “vách đá/vực dốc”, để chú thích gắn chính xác với từ được đánh dấu.
