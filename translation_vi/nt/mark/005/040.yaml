  source_fidelity: 'Bản nháp truyền đúng ý chính. Tuy nhiên, «Họ cười nhạo» chưa biểu đạt rõ sắc thái chưa hoàn thành của κατεγέλων; thêm «cứ» diễn tả hành động kéo dài/tái diễn cách tự nhiên. Cấu trúc «đưa ... vào nơi» cũng có thể làm mờ hai hành động riêng: Ngài đem những người được chọn theo và chính Ngài đi vào. Bản sửa làm rõ trình tự và chủ thể mà không thêm chi tiết.'
  naturalness: 'Bản sửa dùng tiếng Việt hiện đại, mạch lạc: «Sau khi ...» biểu thị rõ hành động đi trước của phân từ ἐκβαλών; «dẫn ... vào» tự nhiên trong ngữ cảnh Ngài đưa nhóm người chọn lọc cùng đi vào.'
