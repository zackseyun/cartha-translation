  - severity: low
    issue: Cấu trúc «đưa ... vào nơi» gộp và phần nào làm mờ παραλαμβάνει với εἰσπορεύεται.
    rationale: Nguyên văn nói Ngài đem cha mẹ và những người đi cùng theo, rồi đi vào. «Sau khi ... rồi Ngài dẫn ... vào» thể hiện rõ trật tự hành động và việc Ngài cùng vào.
