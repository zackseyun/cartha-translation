source:
  edition: SBLGNT
  text: καὶ κατεγέλων αὐτοῦ. ⸀αὐτὸς δὲ ἐκβαλὼν πάντας παραλαμβάνει τὸν πατέρα τοῦ παιδίου καὶ τὴν μητέρα καὶ τοὺς μετ’ αὐτοῦ, καὶ εἰσπορεύεται ὅπου ἦν τὸ ⸀παιδίον·
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/040.yaml
  text: And they were laughing at him[a]. But he, after putting them all outside, takes the child's father and mother and those with him[b], and goes in where the child was.
translation:
  language: vi
  text: Họ cứ cười nhạo Ngài[a]. Nhưng sau khi đưa tất cả ra ngoài, Ngài dẫn cha mẹ của đứa trẻ cùng những người đi cùng Ngài[b] vào nơi đứa trẻ đang ở.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Họ chế giễu Ngài.” Động từ Hy Lạp chỉ tiếng cười mang tính khinh miệt.'
    reason: lexical_alternative
  - marker: b
    text: Tức là các môn đồ đang đi cùng Ngài.
    reason: cross_reference
lexical_decisions:
- source_word: κατεγέλων
  choice: cười nhạo
  rationale: Động từ ở thì chưa hoàn thành diễn tả hành động đang diễn ra; trong tiếng Việt, “cười nhạo” tự nhiên và thể hiện tiếng cười mang tính khinh miệt.
- source_word: ἐκβαλὼν πάντας
  choice: cho tất cả ra ngoài
  rationale: Phân từ chỉ hành động xảy ra trước các động từ chính. Cách diễn đạt này giữ được ý đưa mọi người ra ngoài mà không gợi nhầm đến thuật ngữ trừ quỷ.
- source_word: παραλαμβάνει
  choice: đưa ... vào
  rationale: Động từ hiện tại lịch sử làm câu chuyện sống động; trong cấu trúc tiếng Việt, “đưa ... vào” kết hợp tự nhiên với động từ chuyển động εἰσπορεύεται và cho thấy Ngài dẫn một nhóm được chọn đi cùng.
- source_word: παιδίου / παιδίον
  choice: đứa trẻ
  rationale: Giữ cách gọi trung tính của nguyên văn, dù văn cảnh rộng hơn cho biết đây là con gái của Giai-ru.
- source_word: τοὺς μετ’ αὐτοῦ
  choice: những người đi cùng Ngài
  rationale: Giữ cách diễn đạt khái quát của tiếng Hy Lạp; chú thích xác định họ là các môn đồ đi theo Chúa Giê-su.
- source_word: ὅπου ἦν τὸ παιδίον
  choice: nơi đứa trẻ đang ở
  rationale: Nguyên văn chỉ nói về vị trí, không nói rõ đứa trẻ đang nằm; “đang ở” vừa tự nhiên vừa không thêm chi tiết.
theological_decisions:
- issue: Thì kể chuyện và sắc thái sống động
  choice: 'Dùng chuỗi động từ tiếng Việt tự nhiên trong mạch kể: “cho ... ra ngoài, rồi đưa ... vào”'
  alternative: Cố mô phỏng riêng từng động từ hiện tại lịch sử bằng hình thức hiện tại
  rationale: Tiếng Việt không đánh dấu thì như tiếng Hy Lạp. Cấu trúc nối tiếp này giữ trật tự và sự sống động của hành động mà không tạo lối kể gượng ép.
- issue: Danh tính “những người đi cùng Ngài”
  choice: Giữ cách gọi khái quát trong chính văn
  alternative: Dịch thẳng là “các môn đồ đi cùng Ngài”
  rationale: Nguyên văn không dùng danh từ “môn đồ” tại đây; chú thích có thể làm rõ từ văn cảnh mà không đưa phần giải thích vào chính văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” để quy chiếu Chúa Giê-su; giữ “đứa trẻ” theo danh từ trung tính của nguyên văn. Các dấu chú thích [a], [b] đều được đặt ngay sau thành phần liên quan.
