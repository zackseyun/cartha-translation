  text: Καὶ ἦλθον εἰς τὸ πέραν τῆς θαλάσσης εἰς τὴν χώραν τῶν ⸀Γερασηνῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/001.yaml
  text: And they came to the other side of the sea[a], to the region of the Gerasenes.
translation:
  language: vi
  text: Họ đến bờ bên kia của biển, vào miền của người Ghê-ra-sê[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Một số thủ bản chép “người Ga-đa-ra”; các thủ bản khác chép “người Ghê-ghê-sa.”
    reason: textual_variant
lexical_decisions:
- source_word: Καὶ
  choice: lược dịch trong mạch câu
  rationale: Liên từ καί nối tiếp trình thuật. Trong tiếng Việt, mở đầu bằng “Và” ở đây không tự nhiên; mạch kể liên tục vẫn được giữ mà không cần thể hiện riêng.
- source_word: ἦλθον
  choice: Họ sang
  rationale: Động từ số nhiều chỉ Đức Chúa Jêsus và những người đi cùng. Trong bối cảnh vừa vượt biển, “sang” diễn đạt tự nhiên cả sự di chuyển lẫn việc đến nơi.
- source_word: εἰς τὸ πέραν τῆς θαλάσσης
  choice: bờ bên kia của biển
  rationale: Giữ ý hướng đến phía đối diện và giữ danh từ “biển” theo θάλασσα, thay vì đổi thành “hồ” dù địa danh thực tế là Biển Ga-li-lê.
- source_word: εἰς τὴν χώραν
  choice: đến miền
  rationale: χώρα ở đây là một vùng hay địa hạt; “miền” ngắn gọn, tự nhiên và không gợi nghĩa quốc gia hiện đại.
- source_word: Γερασηνῶν
  choice: dân Ghê-ra-sê
  rationale: Danh từ chỉ cư dân được chuyển thành cấu trúc tiếng Việt tự nhiên, giữ âm địa danh Ghê-ra-sê và theo cách đọc của SBLGNT.
theological_decisions:
- issue: Dị bản địa danh trong trình thuật về người bị quỷ ám
  choice: dân Ghê-ra-sê
  alternative: dân Ga-đa-ra; dân Ghê-ghê-sa
  rationale: Bản văn SBLGNT đọc Γερασηνῶν. Các cách đọc chính khác được giữ trong chú thích vì dị bản này có ý nghĩa đối với việc nhận diện địa điểm, nhưng không nên bị âm thầm giải quyết trong bản văn chính.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu giữ nhịp kể gọn của Mác; dùng “biển” theo từ Hy Lạp và “miền dân Ghê-ra-sê” để tránh biến tên cư dân thành một tên vùng không có trong hình thái nguồn.
