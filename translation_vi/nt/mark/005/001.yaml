revisions:
- from: Họ sang bờ bên kia của biển, đến miền dân Ghê-ra-sê[a].
  to: Họ đến bờ bên kia của biển, vào miền của người Ghê-ra-sê[a].
  rationale: Sửa cấu trúc “miền dân...” thành “miền của người...” để diễn đạt chính xác và tự nhiên gentilic số nhiều Γερασηνῶν; đồng thời dùng “đến” cho ἦλθον. Bản chính vẫn theo cách đọc Gerasenes của SBLGNT, còn các dị bản Gadarenes và Gergesenes được bảo lưu trong chú thích.
