source:
  edition: SBLGNT
  text: καὶ ⸀ἐμβαίνοντος αὐτοῦ εἰς τὸ πλοῖον παρεκάλει αὐτὸν ὁ δαιμονισθεὶς ἵνα ⸂μετ’ αὐτοῦ ᾖ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/018.yaml
  text: And as he was getting into the boat[a], the man who had been demon-possessed kept begging him that he might be with him.
translation:
  language: vi
  text: Khi Đức Giê-su đang bước lên thuyền, người trước đó bị quỷ ám cứ nài xin được ở cùng Ngài.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐμβαίνοντος αὐτοῦ
  choice: Khi Đức Giê-su đang bước lên
  rationale: Kết cấu sở hữu cách tuyệt đối với phân từ hiện tại diễn tả hành động đang diễn ra đồng thời với lời nài xin; cách dịch này tự nhiên trong tiếng Việt và giữ được sắc thái tiến hành.
- source_word: πλοῖον
  choice: thuyền
  rationale: Trong bối cảnh Biển Ga-li-lê, “thuyền” là từ hiện đại, tự nhiên và không gợi một tàu thủy lớn.
- source_word: παρεκάλει
  choice: cứ nài xin
  rationale: Thì chưa hoàn thành cho thấy hành động kéo dài hoặc lặp lại; “cứ nài xin” truyền đạt cả tính liên tục lẫn sự khẩn thiết.
- source_word: ὁ δαιμονισθείς
  choice: người trước đó bị quỷ ám
  rationale: Phân từ được danh từ hóa chỉ người vừa được giải thoát. “Trước đó” làm rõ tình trạng này thuộc quá khứ trong mạch truyện, còn “bị quỷ ám” là cách nói rõ ràng, quen thuộc đối với độc giả Việt.
- source_word: ἵνα μετ’ αὐτοῦ ᾖ
  choice: được ở cùng Ngài
  rationale: Diễn đạt nội dung của lời cầu xin một cách tự nhiên, đồng thời giữ sắc thái tương quan của μετ’ αὐτοῦ thay vì thu hẹp thành việc chỉ cùng đi.
theological_decisions:
- issue: Cách diễn đạt δαιμονισθείς sao cho phản ánh sự chế ngự thật sự của quỷ mà không đồng nhất với phạm trù bệnh lý hiện đại
  choice: bị quỷ ám
  alternative: bị quỷ khống chế
  rationale: “Bị quỷ ám” là cách nói phổ thông và rõ nghĩa trong tiếng Việt, phù hợp với trình thuật Tin Mừng; cụm từ này không biến tình trạng ấy thành một ẩn dụ hay chẩn đoán lâm sàng.
- issue: Xác định chủ thể của αὐτοῦ trong mệnh đề mở đầu
  choice: Đức Giê-su
  alternative: Ngài
  rationale: Tiếng Hy Lạp dùng đại từ dựa vào ngữ cảnh; nêu rõ “Đức Giê-su” giúp câu tiếng Việt đứng độc lập, tránh chuỗi đại từ mơ hồ mà không thay đổi ý nghĩa.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Giê-su” cho tên Chúa và “Ngài” làm đại từ tôn kính; giữ nhịp kể tự nhiên, không thêm chú giải giáo phái.
