  source_fidelity: Bản dịch truyền đạt đúng cấu trúc thời gian của sở hữu cách tuyệt đối («Khi ... đang bước lên thuyền»), sắc thái tiếp diễn của παρεκάλει («cứ nài xin»), và nội dung lời xin «được ở cùng Ngài». «Người trước đó bị quỷ ám» xác định đúng phân từ danh từ hóa, chỉ người vừa được chữa lành trong mạch văn, mà không thêm chi tiết.
