revisions:
- from: Những người đã chứng kiến kể lại cho họ chuyện đã xảy ra thế nào với người bị quỷ ám,[a] và cả chuyện về đàn heo.
  to: Những người đã chứng kiến kể lại cho họ chuyện đã xảy ra với người bị quỷ ám như thế nào, và về bầy heo.[a]
  rationale: Bản chỉnh giữ nguyên nghĩa của διηγήσαντο, οἱ ἰδόντες, πῶς ἐγένετο, τῷ δαιμονιζομένῳ và περὶ τῶν χοίρων, nhưng giảm lặp từ trong tiếng Việt. “Bầy heo” diễn đạt số nhiều xác định trong ngữ cảnh và tự nhiên trong văn xuôi hiện đại. Chú thích được thu gọn để chỉ nêu một phương án thay thế gần nghĩa, không diễn giải quá mức.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T07:39:38Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản nháp truyền đạt đúng các thành tố chính: những người đã thấy sự việc thuật lại cho nhóm người nghe điều đã xảy ra với người bị quỷ ám và sự việc liên quan đến bầy heo. Tuy nhiên, cách lặp “chuyện ... và cả chuyện” làm câu kém gọn và có thể chỉnh nhẹ mà không thay đổi sắc thái πῶς (‘như thế nào’).'
  naturalness: “Những người đã chứng kiến” và “kể lại cho họ” là tiếng Việt hiện đại, tự nhiên. Câu được chỉnh để liên kết hai nội dung tường thuật gọn hơn, đồng thời giữ rõ “như thế nào” là cách thức/diễn biến điều đã xảy ra.
  terminology: “Người bị quỷ ám” là cách dịch thông dụng, rõ ràng và phù hợp với δαιμονιζομένῳ trong văn cảnh. Chú thích giữ phương án “người bị quỷ nhập”; bỏ “người bị quỷ chế ngự” vì cách này diễn giải mức độ chi phối cụ thể hơn điều từ vựng Hy Lạp đòi hỏi.
  issues:
  - severity: low
    issue: Cụm “và cả chuyện về đàn heo” lặp từ “chuyện” và thêm “cả” không cần thiết.
    rationale: Nguyên văn chỉ phối hợp hai đối tượng của lời thuật lại. Bỏ sự lặp và “cả” giúp câu Việt gọn, tự nhiên hơn mà vẫn giữ cấu trúc và ý nghĩa.
  - severity: low
    issue: Chú thích nêu “người bị quỷ chế ngự” như một phương án từ vựng.
    rationale: Phương án này có thể gợi một mô tả cụ thể về mức độ/cơ chế kiểm soát. “Người bị quỷ nhập” là phương án gần hơn và đủ để ghi nhận lựa chọn dịch thay thế.
  revised_text: Những người đã chứng kiến kể lại cho họ chuyện đã xảy ra với người bị quỷ ám như thế nào, và về bầy heo.[a]
