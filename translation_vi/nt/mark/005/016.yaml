  text: ⸂καὶ διηγήσαντο⸃ αὐτοῖς οἱ ἰδόντες πῶς ἐγένετο τῷ δαιμονιζομένῳ καὶ περὶ τῶν χοίρων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/016.yaml
  text: And those who had seen it told them how it had happened to the demon-possessed man[a], and about the pigs.
translation:
  language: vi
  text: Những người đã chứng kiến kể lại cho họ chuyện đã xảy ra với người bị quỷ ám như thế nào, và về bầy heo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “người bị quỷ nhập.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: διηγήσαντο
  choice: kể lại
  rationale: Động từ chỉ việc thuật lại điều đã xảy ra, có thể hàm ý trình bày khá đầy đủ; “kể lại” tự nhiên và phù hợp với văn kể chuyện.
- source_word: οἱ ἰδόντες
  choice: những người đã chứng kiến
  rationale: Phân từ có mạo từ chỉ những người đã tận mắt thấy sự việc. “Đã chứng kiến” diễn đạt rõ vai trò nhân chứng mà không thêm một danh xưng chuyên biệt.
- source_word: πῶς ἐγένετο
  choice: chuyện đã xảy ra thế nào
  rationale: Giữ sắc thái πῶς, tức cách thức hoặc diễn biến của sự việc, thay vì thu gọn thành chỉ “chuyện gì đã xảy ra”.
- source_word: τῷ δαιμονιζομένῳ
  choice: người bị quỷ ám
  rationale: Cách nói thông dụng, rõ nghĩa trong tiếng Việt hiện đại, diễn đạt người đang chịu sự chi phối của quỷ mà không dùng thuật ngữ quá chuyên môn.
- source_word: περὶ τῶν χοίρων
  choice: chuyện về đàn heo
  rationale: περί với sở hữu cách mang nghĩa “về/liên quan đến”; ngữ cảnh cho thấy đây là cả đàn heo, và “heo” là từ hiện đại, tự nhiên.
theological_decisions:
- issue: Cách dịch δαιμονιζομένῳ trong trình thuật về hoạt động của quỷ
  choice: người bị quỷ ám
  alternative: người bị quỷ nhập; người bị quỷ chế ngự
  rationale: Bản dịch giữ nguyên thực tại về sự hành hại của quỷ trong thế giới trình thuật của Mác, không giản lược thành hiện tượng tâm lý, đồng thời tránh xác định chi tiết cơ chế vượt quá điều từ Hy Lạp tự nó nói rõ.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “đàn heo” theo ngữ cảnh số nhiều; cấu trúc “và cả chuyện” giúp câu tiếng Việt tự nhiên mà vẫn giữ hai nội dung được các nhân chứng thuật lại.
