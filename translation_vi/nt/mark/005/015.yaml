revisions:
- from: Họ đến chỗ Đức Giê-su và thấy người từng bị quỷ ám đang ngồi đó, mặc quần áo và tỉnh trí—chính là người đã có đạo quân quỷ[a]—thì họ sợ hãi.
  to: Họ đến chỗ Đức Giê-su và thấy người từng bị quỷ ám đang ngồi đó, mặc quần áo và tỉnh trí—người đã có Lê-gi-ôn[a]. Họ sợ hãi.
  rationale: Bản sửa giữ cách diễn đạt rõ ràng về tình trạng được phục hồi, nhưng bảo toàn «Lê-gi-ôn» như danh xưng hồi chỉ trong nguyên ngữ và chuyển cách hiểu mô tả sang chú thích. Câu cuối được tách ra để không thêm quan hệ nhân quả vào hai liên từ καὶ.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T07:39:38Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch phản ánh đúng trình tự chính: họ đến với Chúa Giê-su, thấy người trước đây bị quỷ ám đang ngồi, có quần áo, tỉnh trí, rồi sợ hãi. Tuy nhiên, «đạo quân quỷ» chuyển danh xưng hồi chỉ τὸν λεγιῶνα thành một diễn giải mô tả và thêm rõ nét «quỷ» vào cụm danh xưng. Cụm «thì họ sợ hãi» cũng dễ tạo quan hệ hệ quả/thời điểm mạnh hơn liên từ kể chuyện καὶ.'
  naturalness: «Người đã có đạo quân quỷ» không tự nhiên trong tiếng Việt hiện đại. Giữ «Lê-gi-ôn» trong bản văn, có chú thích giải thích, vừa tự nhiên hơn cho một danh xưng vừa bảo toàn tính hồi chỉ của nguyên ngữ. Nên tách mệnh đề cuối để giữ nhịp kể rõ ràng.
  terminology: «Đức Giê-su», «quỷ ám», «mặc quần áo» và «tỉnh trí» phù hợp với văn phong Kinh Thánh tiếng Việt hiện đại. «Lê-gi-ôn» nên được giữ như danh xưng; chú thích có thể nêu khả năng hiểu theo nghĩa «đạo quân».
  issues:
  - severity: medium
    issue: «đạo quân quỷ» thay thế danh xưng τὸν λεγιῶνα.
    rationale: Trong ngữ cảnh, từ này hồi chỉ lời tự xưng trước đó và có thể được đọc như một danh xưng. Chuyển hẳn sang «đạo quân quỷ» làm mất sắc thái ấy và thêm yếu tố giải thích vào bản văn chính.
  - severity: low
    issue: «thì họ sợ hãi» có thể hàm ý quan hệ hệ quả hoặc thời điểm.
    rationale: Nguyên văn đơn giản nối hành động bằng καὶ. Một câu phối hợp hoặc câu độc lập giữ nhịp kể trung tính hơn.
  revised_text: Họ đến chỗ Đức Giê-su và thấy người từng bị quỷ ám đang ngồi đó, mặc quần áo và tỉnh trí—người đã có Lê-gi-ôn[a]. Họ sợ hãi.
