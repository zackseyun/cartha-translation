id: MRK.5.15
reference: Mark 5:15
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἔρχονται πρὸς τὸν Ἰησοῦν, καὶ θεωροῦσιν τὸν δαιμονιζόμενον ⸀καθήμενον ἱματισμένον καὶ σωφρονοῦντα, τὸν ἐσχηκότα τὸν ⸀λεγιῶνα, καὶ ἐφοβήθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/015.yaml
  text: And they came to Jesus and saw the demon-possessed man sitting there[b][a], clothed and in his right mind—the one who had the legion—and they were afraid.
translation:
  language: vi
  text: Họ đến chỗ Đức Giê-su và thấy người từng bị quỷ ám đang ngồi đó, mặc quần áo và tỉnh trí—người đã có Lê-gi-ôn[a]. Họ sợ hãi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “đạo quân.” «Lê-gi-ôn» là danh xưng các quỷ đã dùng trước đó.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἔρχονται
  choice: họ đến
  rationale: Thì hiện tại lịch sử được chuyển sang lối kể tự nhiên trong tiếng Việt; hình thức “đến” không cần đánh dấu thì nhưng theo mạch kể mang nghĩa quá khứ.
- source_word: θεωροῦσιν
  choice: thấy
  rationale: Diễn đạt tự nhiên hành động quan sát cảnh trước mắt, không nâng giọng thành “chiêm ngưỡng” hay làm sắc thái quá chuyên môn.
- source_word: δαιμονιζόμενον
  choice: người từng bị quỷ ám
  rationale: Phân từ được dùng như danh từ để chỉ người đã được biết trong văn cảnh. “Từng” cho thấy đây là tình trạng trước đó, phù hợp với trạng thái đã được phục hồi đang được mô tả.
- source_word: καθήμενον
  choice: đang ngồi đó
  rationale: Giữ hình ảnh trực quan của cảnh và diễn đạt tự nhiên trong tiếng Việt.
- source_word: ἱματισμένον
  choice: mặc quần áo
  rationale: Nêu rõ tình trạng đã có y phục, tương phản với tình trạng trước kia; tự nhiên hơn cách nói trang trọng “được mặc y phục”.
- source_word: σωφρονοῦντα
  choice: tỉnh trí
  rationale: Diễn tả sự sáng suốt và tự chủ đã được phục hồi mà không thu hẹp ý nghĩa thành một chẩn đoán y khoa.
- source_word: ἐσχηκότα
  choice: đã có
  rationale: Phân từ hoàn thành nhận diện người này bằng tình trạng trước đó có liên quan đến cảnh hiện tại. “Đã có” gọn, tự nhiên và cho thấy tình trạng ấy không còn tiếp diễn.
- source_word: λεγιῶνα
  choice: đạo quân quỷ
  rationale: “Đạo quân” truyền đạt hình ảnh legion là một lực lượng đông đảo; thêm “quỷ” làm rõ đối tượng mà người ấy từng có trong văn cảnh, tránh khiến độc giả hiểu là một đơn vị quân đội loài người.
- source_word: ἐφοβήθησαν
  choice: họ sợ hãi
  rationale: Diễn đạt trực tiếp phản ứng của đám đông, không cường điệu mức độ ngoài điều bản văn nói.
theological_decisions:
- issue: Cách mô tả tình trạng bị quỷ ám
  choice: người từng bị quỷ ám
  alternative: người bị quỷ ám
  rationale: Bản văn khẳng định thực tại của sự áp chế bởi quỷ; “từng” đồng thời phản ánh rằng người ấy nay đã được giải thoát, như trạng thái ngồi, mặc quần áo và tỉnh trí cho thấy.
- issue: λεγιών là danh xưng hay từ mô tả
  choice: đạo quân quỷ
  alternative: Lê-gi-ôn
  rationale: Trong văn cảnh, từ này vừa vọng lại lời tự xưng trước đó vừa gợi một số lượng rất đông. Bản chính chuyển nghĩa để người đọc phổ thông hiểu ngay, còn chú thích giữ khả năng coi đó là danh xưng riêng.
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Cấu trúc câu giữ chuỗi quan sát của nguyên văn, còn dấu gạch ngang làm rõ cụm nhận diện hồi chỉ. Mọi dấu chú thích trong phần chú thích đều xuất hiện trong bản văn chính.
