  text: καὶ παρεκάλει αὐτὸν πολλὰ ἵνα μὴ ⸀αὐτὰ ἀποστείλῃ ἔξω τῆς χώρας.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/010.yaml
  text: And he begged him repeatedly not to send them out of the region[a].
translation:
  language: vi
  text: Người ấy liên tục khẩn khoản xin Đức Giê-su đừng sai chúng ra khỏi vùng ấy.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Người ấy nhiều lần khẩn khoản xin Ngài đừng sai chúng ra ngoài địa hạt ấy.”'
    reason: Nêu cách diễn đạt sát hơn cho παρεκάλει πολλὰ, ἀποστείλῃ và χώρα.
lexical_decisions:
- source_word: παρεκάλει
  choice: khẩn khoản nài xin
  rationale: Trong bối cảnh trừ quỷ, động từ này diễn tả lời van xin tha thiết, không chỉ là một lời đề nghị thông thường.
- source_word: πολλὰ
  choice: nhiều lần
  rationale: Dùng theo chức năng trạng từ để nhấn mạnh hoặc cho thấy hành động lặp lại; “nhiều lần” tự nhiên và giữ được sắc thái lặp lại trong ngữ cảnh.
- source_word: ἵνα μὴ
  choice: đừng
  rationale: Diễn đạt tự nhiên nội dung phủ định của lời van xin trong tiếng Việt.
- source_word: αὐτὰ
  choice: chúng
  rationale: Đại từ trung tính số nhiều chỉ các tà linh/quỷ; “chúng” giữ rõ số nhiều và phù hợp với các tác nhân phi nhân trong ngữ cảnh.
- source_word: ἀποστείλῃ
  choice: đuổi ... ra
  rationale: Trong ngữ cảnh trừ quỷ, cách diễn đạt này truyền đạt tự nhiên ý sai đi hoặc buộc rời khỏi nơi ấy, dù nghĩa từ vựng trực tiếp là “sai/phái đi”.
- source_word: ἔξω τῆς χώρας
  choice: ra khỏi vùng ấy
  rationale: χώρα ở đây là vùng hoặc địa hạt địa phương, không nhất thiết là một quốc gia theo nghĩa hiện đại.
theological_decisions:
- issue: Sự chuyển đổi giữa chủ thể số ít và đại từ số nhiều trong lời của quỷ
  choice: Dịch chủ thể số ít là “anh ta” và đối tượng số nhiều là “chúng”.
  alternative: Diễn đạt toàn bộ theo nghĩa tập thể để làm phẳng sự thay đổi số.
  rationale: Bản Hy Lạp giữ sự căng thẳng giữa kẻ phát ngôn số ít và nhiều quỷ mà hắn đại diện; bản dịch không hòa giải sự chuyển đổi này.
- issue: Đối tượng được van xin của αὐτόν
  choice: Nêu rõ là “Đức Chúa Jêsus”.
  alternative: Dịch bằng đại từ “Ngài”.
  rationale: Tiếng Việt cần làm rõ hai đại từ giống đực số ít xuất hiện gần nhau; nêu tên người được van xin tránh nhập nhằng mà không thay đổi quan hệ tham chiếu trong mạch văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Khẩn khoản nài xin” thể hiện cường độ của lời cầu xin; “vùng ấy” tránh khiến χώρα bị hiểu là một quốc gia hiện đại. Dùng “Đức Chúa Jêsus” để tránh chuỗi đại từ mơ hồ.
