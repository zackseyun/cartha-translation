review_pass:
  verdict: revise
  source_fidelity: Cần sửa “đuổi” thành “sai ... ra,” vì ἀποστείλῃ nghĩa chính là “sai/gửi đi, sai ra,” không mặc nhiên hàm ý xua đuổi. Bản sửa giữ chủ thể số ít và đại từ chỉ các quỷ số nhiều, đồng thời diễn đạt πολλὰ bằng “liên tục.”
  naturalness: “Anh ta” hơi khẩu ngữ và không thật phù hợp với văn phong Kinh Thánh hiện đại trong ngữ cảnh này. “Người ấy” tự nhiên, trung tính và vẫn bảo toàn chủ thể số ít. “Đức Giê-su” là cách viết hiện đại, phổ biến trong tiếng Việt chuẩn.
  terminology: Dùng “Đức Giê-su” thay cho dạng phiên âm/kiểu tước hiệu mang dấu ấn truyền thống riêng “Đức Chúa Jêsus.” “Vùng ấy” truyền đạt χώρα là một khu vực/địa hạt địa phương, không gợi một quốc gia hiện đại.
  issues:
  - severity: medium
    issue: “đuổi chúng ra” dịch ἀποστείλῃ quá mạnh.
    rationale: Động từ ἀποστέλλω là “sai/gửi đi; sai ra,” trong khi “đuổi” thêm ý cưỡng bách không được nêu trực tiếp bởi từ này.
  - severity: low
    issue: “Anh ta” có sắc thái khẩu ngữ và kém phù hợp với register của bản dịch.
    rationale: “Người ấy” giữ tham chiếu số ít mà trang trọng, trung tính hơn.
  - severity: low
    issue: “Đức Chúa Jêsus” không nhất quán với chính tả hiện đại trung tính.
    rationale: “Đức Giê-su” là cách dùng hiện đại phổ biến; việc nêu danh xưng ở đây vẫn giúp tránh nhập nhằng đại từ.
  revised_text: Người ấy liên tục khẩn khoản xin Đức Giê-su đừng sai chúng ra khỏi vùng ấy.[a]
