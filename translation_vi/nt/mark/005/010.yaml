revisions:
- from: Anh ta khẩn khoản nài xin Đức Chúa Jêsus nhiều lần đừng đuổi chúng ra khỏi vùng ấy.[a]
  to: Người ấy liên tục khẩn khoản xin Đức Giê-su đừng sai chúng ra khỏi vùng ấy.[a]
  rationale: Bản sửa thay động từ thêm sắc thái “đuổi” bằng “sai,” phù hợp trực tiếp với ἀποστείλῃ; giữ cường độ/lặp lại của παρεκάλει πολλὰ qua “liên tục khẩn khoản xin”; và duy trì sự chuyển đổi có chủ ý từ người nói số ít sang các quỷ số nhiều (“chúng”).
