  text: ⸂καὶ ἰδὼν⸃ τὸν Ἰησοῦν ἀπὸ μακρόθεν ἔδραμεν καὶ προσεκύνησεν ⸀αὐτόν,
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/006.yaml
  text: And seeing Jesus from a distance[a], he ran and bowed down before him,
translation:
  language: vi
  text: Vừa thấy Giê-su từ xa, anh ta chạy đến và phủ phục trước Người.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “thờ phượng Người” hoặc “bày tỏ lòng tôn kính Người.” Động từ Hy Lạp có thể chỉ sự thờ phượng hoặc hành động phủ phục/bái lạy, tùy theo ngữ cảnh.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν
  choice: vừa thấy
  rationale: Phân từ bất định quá khứ của ὁράω diễn tả hành động xảy ra trước động từ chính trong mạch kể; “vừa thấy” tự nhiên trong tiếng Việt và giữ quan hệ thời gian mà không diễn giải quá mức.
- source_word: ἀπὸ μακρόθεν
  choice: từ đằng xa
  rationale: Diễn đạt khoảng cách không gian bằng cách nói thông dụng, tự nhiên trong tiếng Việt hiện đại.
- source_word: ἔδραμεν
  choice: chạy đến
  rationale: τρέχω có nghĩa trực tiếp là chạy; “đến” được dùng tự nhiên trong tiếng Việt để biểu thị hướng về phía Đức Chúa Jêsus đã nêu trong câu, không thêm sắc thái hấp tấp.
- source_word: προσεκύνησεν αὐτόν
  choice: sấp mình trước Ngài
  rationale: προσκυνέω có thể chỉ sự phủ phục, bày tỏ lòng tôn kính hoặc thờ lạy. Cách dịch này giữ hành động hữu hình và không buộc văn bản phải xác định ngay đây là sự thờ phượng theo nghĩa đầy đủ.
- source_word: καὶ
  choice: Vừa… và
  rationale: Liên từ mở đầu nối câu này với mạch kể; trong tiếng Việt, quan hệ trần thuật được thể hiện tự nhiên qua cấu trúc “Vừa thấy…, … và…”, thay vì dùng “Và” cứng nhắc ở đầu câu.
- source_word: τὸν Ἰησοῦν
  choice: Đức Chúa Jêsus
  rationale: Tên riêng được chuyển theo dạng xưng gọi trang trọng, quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
theological_decisions:
- issue: Có nên dịch προσεκύνησεν thành một hành động thờ phượng Đức Chúa Jêsus cách minh nhiên hay không
  choice: sấp mình trước Ngài
  alternative: thờ lạy Ngài; phủ phục tỏ lòng tôn kính Ngài
  rationale: Động từ Hy Lạp có thể mang nghĩa thờ phượng hoặc chỉ hành vi phủ phục/tôn kính tùy ngữ cảnh. Bản chính giữ hành động thấy được và để ngỏ sức nặng thần học; chú thích nêu rõ các khả năng từ vựng khác.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Sấp mình” diễn tả rõ tư thế phủ phục mà không quyết định thay người đọc sắc thái thờ phượng hay tôn kính của động từ Hy Lạp. Dấu chú thích [a] được đặt ngay sau cụm từ cần giải thích.
