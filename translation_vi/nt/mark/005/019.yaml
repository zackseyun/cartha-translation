id: MRK.5.19
reference: Mark 5:19
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸀καὶ οὐκ ἀφῆκεν αὐτόν, ἀλλὰ λέγει αὐτῷ· Ὕπαγε εἰς τὸν οἶκόν σου πρὸς τοὺς σούς, καὶ ⸀ἀπάγγειλον αὐτοῖς ὅσα ⸂ὁ κύριός σοι⸃ πεποίηκεν καὶ ἠλέησέν σε.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/019.yaml
  text: And he did not permit him[a], but said to him, “Go to your home, to your own people[c][b], and report to them how much the Lord has done for you and has shown mercy to you.”
translation:
  language: vi
  text: 'Nhưng Đức Giê-su không cho anh làm vậy, mà bảo: “Hãy về nhà, về với người thân của anh[a], và thuật lại cho họ mọi điều Chúa[b] đã làm cho anh, cùng việc Ngài đã thương xót anh ra sao.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Theo sát tiếng Hy Lạp: “những người thuộc về anh”; cụm này có thể chỉ gia đình và cả những người gần gũi với anh.'
    reason: lexical_alternative
  - marker: b
    text: Có người hiểu “Chúa” ở đây cụ thể là Đức Chúa Trời; cũng có thể Mác chủ ý giữ mối liên hệ giữa lòng thương xót của Đức Chúa Trời với thẩm quyền và hành động của chính Đức Giê-su.
    reason: alternative_reading
lexical_decisions:
- source_word: οὐκ ἀφῆκεν αὐτόν
  choice: không cho anh làm vậy
  rationale: Trong ngữ cảnh, ἀφίημι có nghĩa là cho phép. Tiếng Việt cần bổ sung “làm vậy” để diễn đạt tự nhiên điều người ấy vừa xin, nhưng không nói cụ thể hơn điều bản văn câu này để ngỏ.
- source_word: λέγει
  choice: bảo
  rationale: Thì hiện tại lịch sử của tiếng Hy Lạp được chuyển sang lối kể tự nhiên trong tiếng Việt; “bảo” phù hợp khi lời nói theo sau là một mệnh lệnh.
- source_word: Ὕπαγε εἰς τὸν οἶκόν σου
  choice: Hãy về nhà
  rationale: ὕπαγε là mệnh lệnh đi đến một nơi, còn οἶκος ở đây chỉ mái ấm hoặc phạm vi gia đình; “về nhà” tự nhiên hơn “đi vào nhà của anh”.
- source_word: πρὸς τοὺς σούς
  choice: về với người thân của anh
  rationale: Cụm Hy Lạp theo nghĩa sát là “đến với những người thuộc về anh”. “Người thân” giữ được phạm vi rộng hơn chỉ riêng gia đình ruột thịt, đồng thời tự nhiên trong tiếng Việt.
- source_word: ἀπάγγειλον
  choice: thuật lại
  rationale: Động từ này diễn tả việc báo lại hoặc kể lại một sự việc. “Thuật lại” truyền đạt rõ ý kể cho những người ở nhà nghe điều đã xảy ra.
- source_word: ὅσα ὁ κύριός σοι πεποίηκεν
  choice: mọi điều Chúa đã làm cho anh
  rationale: ὅσα chỉ toàn bộ hoặc mức độ những việc đã được thực hiện. “Mọi điều” tự nhiên và giữ rõ nội dung người ấy phải thuật lại; σοι được hiểu là “cho anh”, gắn với động từ.
- source_word: ἠλέησέν σε
  choice: Ngài đã thương xót anh ra sao
  rationale: ἐλεάω nói đến việc bày tỏ lòng thương xót. Cách diễn đạt này giữ từ ngữ thần học “thương xót” và nối tự nhiên với lời yêu cầu thuật lại.
theological_decisions:
- issue: Danh xưng κύριος trong lời Đức Giê-su nói về Đấng đã hành động và thương xót người được chữa lành
  choice: Chúa
  alternative: Đức Chúa Trời
  rationale: κύριος được dịch trực tiếp là “Chúa”. Ngữ cảnh có thể được hiểu là nói về Đức Chúa Trời, nhưng cũng tạo liên hệ có chủ ý giữa lòng thương xót của Chúa và chính hành động, thẩm quyền của Đức Giê-su. Bản dịch không thay bằng “Đức Chúa Trời”, nhờ đó giữ nguyên sự căng thẳng thần học của câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Đức Giê-su” để làm rõ chủ ngữ vốn được lược trong tiếng Hy Lạp nhưng đã rõ từ mạch văn; dùng “anh” phù hợp với người đàn ông trưởng thành được nói đến. Cấu trúc “về nhà, về với…” giữ hai thành phần chỉ đích đến mà vẫn tự nhiên trong tiếng Việt.
