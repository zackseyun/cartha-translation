  source_fidelity: Bản dịch truyền đạt đầy đủ đối lập “nhưng”, việc Đức Giê-su không cho phép người ấy làm điều vừa xin, hai đích đến “về nhà” và “đến với những người thuộc về anh”, cùng mệnh lệnh thuật lại các việc Chúa đã làm và lòng thương xót Ngài đã bày tỏ. “Mọi điều” diễn đạt phù hợp ὅσα; “đã thương xót anh ra sao” bảo toàn nội dung của ἠλέησέν σε.
  naturalness: Tiếng Việt hiện đại, rõ ràng và có sắc thái trang trọng vừa phải. Cấu trúc “Hãy về nhà, về với người thân của anh” tự nhiên, còn “thuật lại” thích hợp với yêu cầu kể lại một kinh nghiệm đã xảy ra.
  terminology: “Đức Giê-su,” “Chúa,” và “thương xót” nhất quán với thuật ngữ Kinh Thánh tiếng Việt. Việc giữ “Chúa” thay vì xác định là “Đức Chúa Trời” trong thân bài bảo toàn độ mở có chủ ý của κύριος trong ngữ cảnh này.
