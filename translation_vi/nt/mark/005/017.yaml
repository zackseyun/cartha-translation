  terminology: “Ngài” là lối quy chiếu tôn kính phù hợp trong văn cảnh nói về Chúa Giê-su. “Vùng đất của họ” diễn đạt thành ngữ ἀπὸ τῶν ὁρίων αὐτῶν theo nghĩa khu vực/lãnh thổ của họ; chú thích bảo lưu cách diễn đạt “địa phận” gần với sắc thái ranh giới/lãnh thổ hơn. Neo chú thích [a] đặt đúng tại cụm được chú giải.
