  yaml_path: translation/nt/mark/005/017.yaml
  text: And they began to beg him to leave their region[a].
translation:
  language: vi
  text: Họ bắt đầu nài xin ngài rời khỏi vùng đất của họ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “thúc giục ngài rời khỏi địa phận của họ.”'
    reason: 'Giữ lại các khả năng từ vựng của παρακαλεῖν và ὅρια: “thúc giục” nhấn mạnh sự khẩn khoản gây sức ép, còn “địa phận” sát sắc thái lãnh thổ có ranh giới hơn.'
lexical_decisions:
- source_word: καὶ
  choice: Họ
  rationale: Không dịch καί thành một liên từ riêng ở đầu câu để câu kể tiếng Việt tự nhiên; sự tiếp nối với mạch trước vẫn được thể hiện qua trình tự thuật chuyện.
- source_word: ἤρξαντο
  choice: bắt đầu
  rationale: Diễn đạt trực tiếp sắc thái khởi đầu của động từ khi đi với động từ nguyên mẫu.
- source_word: παρακαλεῖν
  choice: nài xin
  rationale: Trong bối cảnh này, từ chỉ một lời thỉnh cầu khẩn thiết; “nài xin” giữ được cường độ mà vẫn tự nhiên và trang trọng trong tiếng Việt hiện đại.
- source_word: αὐτὸν
  choice: ngài
  rationale: Đại từ chỉ Chúa Giê-su; “ngài” là cách quy chiếu tôn kính, tự nhiên trong văn bản Kinh Thánh tiếng Việt, không cần lặp lại tên riêng.
- source_word: ἀπελθεῖν
  choice: rời khỏi
  rationale: Diễn đạt nội dung lời nài xin bằng cách nói tiếng Việt tự nhiên, đồng thời phối hợp rõ với cụm chỉ nơi chốn theo sau.
- source_word: ἀπὸ τῶν ὁρίων αὐτῶν
  choice: khỏi vùng đất của họ
  rationale: ὅρια theo nghĩa đen là các ranh giới, nhưng trong cấu trúc này chỉ địa phận hay lãnh thổ nằm trong các ranh giới ấy; “vùng đất” rõ nghĩa và tự nhiên.
