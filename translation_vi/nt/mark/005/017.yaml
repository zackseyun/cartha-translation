  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Câu chính ưu tiên cách diễn đạt tự nhiên “nài xin” và “vùng đất”; chú thích bảo lưu phương án sát sắc thái lãnh thổ hơn.
