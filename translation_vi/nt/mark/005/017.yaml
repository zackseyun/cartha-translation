  source_fidelity: 'Bản dịch truyền đạt đầy đủ ý của καὶ ἤρξαντο παρακαλεῖν αὐτὸν ἀπελθεῖν ἀπὸ τῶν ὁρίων αὐτῶν: chủ thể số nhiều, sắc thái khởi sự của ἤρξαντο, lời khẩn nài của παρακαλεῖν, và việc rời khỏi khu vực thuộc về họ. Việc không dịch riêng καὶ ở đầu câu là tự nhiên trong mạch kể tiếng Việt và không làm mất ý đáng kể.'
