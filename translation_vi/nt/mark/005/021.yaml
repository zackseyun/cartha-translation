  text: Καὶ διαπεράσαντος τοῦ Ἰησοῦ ἐν τῷ πλοίῳ πάλιν εἰς τὸ πέραν συνήχθη ὄχλος πολὺς ἐπ’ αὐτόν, καὶ ἦν παρὰ τὴν θάλασσαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/021.yaml
  text: And after Jesus had crossed over again in the boat to the other side[a], a large crowd gathered around him, and he was beside the sea.
translation:
  language: vi
  text: Sau khi Đức Giê-su lại đi thuyền sang bờ bên kia, một đám đông lớn tụ tập quanh ngài, và ngài đang ở bên biển[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tức là Biển Ga-li-lê, một hồ nước mà các sách Phúc Âm thường gọi là “biển”.
    reason: cultural_note
lexical_decisions:
- source_word: διαπεράσαντος
  choice: Sau khi ... sang
  rationale: Phân từ bất định trong kết cấu sở hữu cách tuyệt đối diễn tả hành động xảy ra trước; cách dịch này giữ rõ trình tự thời gian và tự nhiên trong tiếng Việt.
- source_word: ἐν τῷ πλοίῳ
  choice: đi thuyền
  rationale: Diễn đạt tự nhiên phương thức vượt sang bờ bên kia, đồng thời vẫn nêu rõ chiếc thuyền như nguyên văn.
- source_word: πάλιν
  choice: lại
  rationale: Giữ ý hành động được lặp lại.
- source_word: εἰς τὸ πέραν
  choice: sang bờ bên kia
  rationale: Trong bối cảnh vượt hồ, cụm từ chỉ bờ đối diện; thêm “bờ” giúp tiếng Việt rõ và tự nhiên.
- source_word: συνήχθη
  choice: tụ tập
  rationale: Dù động từ có hình thức bị động, trong ngữ cảnh này nó tự nhiên chỉ việc đám đông quy tụ.
- source_word: ὄχλος πολὺς
  choice: một đám đông lớn
  rationale: Diễn đạt trực tiếp quy mô của đám đông bằng tiếng Việt hiện đại.
- source_word: ἐπ’ αὐτόν
  choice: quanh ngài
  rationale: Với συνάγω, giới từ diễn tả sự hội tụ về phía Đức Giê-su; “quanh ngài” thể hiện rõ sắc thái không gian.
- source_word: παρὰ τὴν θάλασσαν
  choice: ở bên bờ biển
  rationale: Cụm từ chỉ vị trí sát vùng nước; “bên bờ biển” tự nhiên hơn “bên biển” trong tiếng Việt và làm rõ địa điểm ven bờ.
- source_word: θάλασσαν
  choice: biển
  rationale: Giữ danh từ θάλασσα của nguyên văn thay vì đổi thành “hồ”; chú thích giải thích đây là Biển Ga-li-lê, vốn là một hồ.
