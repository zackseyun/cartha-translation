  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “Đức Giê-su” và đại từ “ngài”; chia câu để tránh cấu trúc dài nặng nề nhưng vẫn giữ quan hệ thời gian và không gian của nguyên văn.
