  to: Người ấy cư ngụ giữa các ngôi mộ[a], và không ai còn có thể trói người ấy, dù bằng một sợi xích.
  rationale: Chỉnh “sống giữa những mồ mả” thành “cư ngụ giữa các ngôi mộ” để phản ánh chính xác hơn κατοίκησιν và μνήματα, nhưng không ép nghĩa là người ấy luôn ở bên trong một ngôi mộ. Chỉnh cách diễn đạt về xích để tiếng Việt tự nhiên hơn, vẫn giữ nguyên ý nhấn mạnh, số ít và ý “không còn” của nguyên văn.
