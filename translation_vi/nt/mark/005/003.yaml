  text: ὃς τὴν κατοίκησιν εἶχεν ἐν τοῖς μνήμασιν, καὶ ⸂οὐδὲ ἁλύσει οὐκέτι⸃ οὐδεὶς ἐδύνατο αὐτὸν δῆσαι
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/003.yaml
  text: who had his dwelling among the tombs[a], and no one could bind him anymore, not even with a chain.
translation:
  language: vi
  text: Người ấy cư ngụ giữa các ngôi mộ[a], và không ai còn có thể trói người ấy, dù bằng một sợi xích.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay, sát hình thức hơn: “người ấy có nơi cư ngụ trong các ngôi mộ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατοίκησιν εἶχεν
  choice: sống
  rationale: Cụm Hy Lạp theo nghĩa đen là “có nơi cư ngụ”; trong tiếng Việt hiện đại, “sống” diễn đạt tự nhiên việc người ấy lấy khu mộ làm nơi ở mà không thêm ý về tính lâu dài.
- source_word: ἐν τοῖς μνήμασιν
  choice: giữa những mồ mả
  rationale: μνῆμα chỉ mộ hoặc nơi chôn cất. “Giữa những mồ mả” tự nhiên trong tiếng Việt và không nhất thiết hàm ý người ấy luôn ở bên trong một ngôi mộ cụ thể; cách sát hình thức hơn được ghi ở chú thích.
- source_word: οὐδὲ ἁλύσει
  choice: ngay cả bằng một sợi xích
  rationale: οὐδέ mang ý nhấn mạnh “ngay cả ... cũng không”, còn ἅλυσις ở số ít; “một sợi xích” giữ được cả sắc thái nhấn mạnh lẫn số ít của nguyên văn.
- source_word: οὐκέτι
  choice: còn
  rationale: Trong cấu trúc phủ định “không ai còn có thể”, từ “còn” diễn đạt tự nhiên ý “không còn nữa” của οὐκέτι và cho thấy trước kia việc trói người ấy từng có thể thực hiện hoặc đã được thử.
- source_word: ἐδύνατο
  choice: có thể
  rationale: Diễn đạt trực tiếp khả năng trong quá khứ theo văn cảnh; kết hợp với “không ai còn” tạo câu tiếng Việt tự nhiên.
- source_word: δῆσαι
  choice: trói
  rationale: δῆσαι chỉ hành động buộc hoặc trói về thể chất. “Trói” chính xác hơn từ khái quát “kiềm chế” và phù hợp với việc dùng xích.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng hiện đại. Đại từ “người ấy” nối mệnh đề quan hệ với câu trước; “mồ mả” dễ hiểu và phù hợp bối cảnh khu mộ, còn chú thích bảo lưu cách diễn đạt sát cấu trúc Hy Lạp hơn.
