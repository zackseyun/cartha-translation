    rationale: Từ này trong tiếng Việt thường gợi các ngôi mộ hoặc phần mộ nói chung, nhưng “các ngôi mộ” tái hiện trực tiếp và rõ hơn danh từ μνήματα (“tombs”).
  - severity: low
    issue: Vị trí của “ngay cả bằng một sợi xích” hơi không tự nhiên.
    rationale: “Dù bằng một sợi xích” đặt sau động từ phủ định diễn đạt rõ và tự nhiên hơn ý οὐδὲ ἁλύσει.
