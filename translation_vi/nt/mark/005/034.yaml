source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτῇ· ⸀Θυγάτηρ, ἡ πίστις σου σέσωκέν σε· ὕπαγε εἰς εἰρήνην, καὶ ἴσθι ὑγιὴς ἀπὸ τῆς μάστιγός σου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/034.yaml
  text: But he said to her[a], “Daughter, your faith has saved you. Go in peace[b], and be well from your affliction.”
translation:
  language: vi
  text: 'Nhưng Ngài phán với bà: “Con gái, đức tin của con đã cứu con[a]. Hãy đi bình an, và hãy được lành[b] khỏi căn bệnh hành hạ con.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đã làm cho con được khỏe mạnh” hoặc “đã chữa lành con.” Động từ Hy Lạp có thể chỉ sự cứu thoát, cứu rỗi hoặc chữa lành.'
    reason: alternative_reading
  - marker: b
    text: 'Nguyên văn cũng có thể hiểu là: “được khỏe mạnh” hoặc “được nguyên vẹn, lành mạnh.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Θυγάτηρ
  choice: Con gái
  rationale: Giữ cách xưng hô trực tiếp, trìu mến và mang sắc thái gia đình của nguyên văn, không thêm đại từ sở hữu.
- source_word: πίστις
  choice: đức tin
  rationale: Trong ngữ cảnh này, từ này chỉ lòng tin của người phụ nữ nơi Chúa Giê-su; “đức tin” vừa tự nhiên vừa duy trì tính nhất quán của thuật ngữ.
- source_word: σέσωκέν
  choice: đã cứu
  rationale: Động từ σῴζω có thể bao hàm cứu thoát, cứu rỗi hoặc chữa lành. Dùng “đã cứu” giữ nguyên bề rộng ý nghĩa và phân biệt với mệnh đề nói rõ về tình trạng lành bệnh ngay sau đó; “đã” phản ánh thể hoàn thành.
- source_word: ὕπαγε εἰς εἰρήνην
  choice: Hãy đi bình an
  rationale: Đây là cách diễn đạt tự nhiên trong tiếng Việt cho lời truyền đi trong sự bình an, đồng thời giữ sắc thái trang trọng của nguyên văn.
- source_word: ἴσθι ὑγιὴς
  choice: được lành
  rationale: Cụm từ diễn tả trạng thái khỏe mạnh, nguyên vẹn. “Được lành” phù hợp với ngữ cảnh bệnh tật mà không đồng nhất cụm này với σέσωκέν.
- source_word: ἀπὸ τῆς μάστιγός σου
  choice: khỏi căn bệnh hành hạ con
  rationale: μάστιξ vốn có nghĩa là roi hoặc sự quất đánh, nhưng ở đây dùng ẩn dụ cho chứng bệnh đau đớn. Cách dịch này truyền đạt cả bệnh trạng lẫn sức hành hạ của nó.
theological_decisions:
- issue: Ý nghĩa của πίστις
  choice: đức tin
  alternative: lòng tin
  rationale: “Đức tin” phù hợp với hành động tin cậy của người phụ nữ và giữ thuật ngữ thần học quen thuộc, nhưng không biến nó thành sự trung tín kéo dài.
- issue: Quan hệ giữa sự cứu và sự chữa lành trong σέσωκέν
  choice: đã cứu con
  alternative: đã chữa lành con / đã làm cho con được khỏe mạnh
  rationale: “Đã cứu” bảo tồn độ rộng nghĩa của σῴζω và sự căng thẳng giữa cứu rỗi, cứu thoát và chữa lành, thay vì âm thầm giới hạn lời tuyên bố chỉ vào sự hồi phục thể chất.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. “Ngài” duy trì cách quy chiếu tôn kính; lời gọi “Con gái” giữ nguyên sự dịu dàng của câu Hy Lạp. Các dấu chú thích được đặt ngay sau những cụm từ mà chú thích giải thích.
