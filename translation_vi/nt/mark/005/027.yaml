  text: having heard about Jesus[a], she came up behind him in the crowd and touched his garment.
translation:
  language: vi
  text: Sau khi nghe nói về Đức Giê-su, bà đến phía sau Đức Giê-su giữa đám đông, rồi chạm vào áo choàng của Ngài.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “áo” hoặc “y phục”. Từ Hy Lạp ἱμάτιον có nghĩa rộng là một thứ y phục, thường là áo ngoài.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσασα περὶ τοῦ Ἰησοῦ
  choice: Sau khi nghe nói về Đức Giê-su
  rationale: Phân từ bất định ἀκούσασα diễn tả hành động xảy ra trước hành động chính; “sau khi nghe nói” tự nhiên trong tiếng Việt và giữ được ý bà đã nghe những tin tức về Đức Giê-su.
- source_word: ἐλθοῦσα ἐν τῷ ὄχλῳ ὄπισθεν
  choice: bà đến từ phía sau, giữa đám đông
  rationale: Cách diễn đạt này giữ hướng tiếp cận từ phía sau và hoàn cảnh bà đang ở giữa đám đông, đồng thời tránh bổ sung quá mức điều bản văn chỉ hàm ý.
- source_word: ἥψατο
  choice: chạm vào
  rationale: Động từ ἅπτω ở đây có thể mang nghĩa chạm hoặc nắm lấy; “chạm vào” phù hợp nhất với diễn tiến câu chuyện mà không hàm ý bà giữ chặt.
- source_word: τοῦ ἱματίου αὐτοῦ
  choice: áo choàng của Ngài
  rationale: ἱμάτιον thường chỉ áo ngoài hay áo choàng. “Áo choàng” là cách gọi tự nhiên, dễ hiểu trong tiếng Việt và giữ số ít của nguyên văn.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Đức Giê-su” theo quy ước tên gọi Cơ Đốc giáo phổ biến trong tiếng Việt; “Ngài” biểu thị sự tôn kính nhưng không thêm một kết luận thần học vào câu.
