source:
  edition: SBLGNT
  text: Ἔτι αὐτοῦ λαλοῦντος ἔρχονται ἀπὸ τοῦ ἀρχισυναγώγου λέγοντες ὅτι Ἡ θυγάτηρ σου ἀπέθανεν· τί ἔτι σκύλλεις τὸν διδάσκαλον;
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/035.yaml
  text: While he was still speaking[a], people came from the synagogue leader's house, saying, “Your daughter has died[b]. Why do you still trouble the Teacher?”
translation:
  language: vi
  text: 'Khi Đức Giê-su vẫn đang nói, có những người từ nhà của trưởng hội đường[a] đến, nói: “Con gái ông đã chết rồi. Sao ông còn làm phiền Thầy[b] nữa?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “từ trưởng hội đường”; theo ngữ cảnh, nghĩa là từ nhà hoặc gia đình ông.'
    reason: contextual_expansion
  - marker: b
    text: Hay “quấy rầy Thầy”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔτι αὐτοῦ λαλοῦντος
  choice: Khi Đức Giê-su vẫn đang nói
  rationale: Cụm sở hữu cách tuyệt đối diễn tả một hành động đang tiếp diễn đồng thời với sự việc kế tiếp. Nêu tên Đức Giê-su theo ngữ cảnh giúp câu tiếng Việt tự nhiên và xác định rõ đại từ αὐτοῦ.
- source_word: ἔρχονται
  choice: có người ... đến
  rationale: Đây là hiện tại lịch sử trong lời kể; tiếng Việt dùng “đến” tự nhiên mà không cần đánh dấu thì. “Có người” không ấn định số lượng, dù động từ Hy Lạp ở số nhiều, và phù hợp cách kể chuyện hiện đại.
- source_word: ἀπὸ τοῦ ἀρχισυναγώγου
  choice: từ nhà viên trưởng hội đường
  rationale: Theo ngữ cảnh, những người này đến từ nhà hoặc gia đình của viên trưởng hội đường, vì chính ông đang ở với Đức Giê-su. Thêm “nhà” truyền đạt ý hàm ẩn tự nhiên của thành ngữ, còn chú thích giữ lại hình thức sát chữ của tiếng Hy Lạp.
- source_word: Ἡ θυγάτηρ σου ἀπέθανεν
  choice: Con gái ông đã chết rồi
  rationale: “Đã ... rồi” diễn đạt một biến cố đã hoàn tất và hậu quả hiện tại của nó, đồng thời giữ lời báo tin trực tiếp, trang trọng.
- source_word: τί ἔτι σκύλλεις
  choice: Sao ông còn làm phiền ... nữa?
  rationale: 'Cấu trúc “còn ... nữa” truyền đạt đầy đủ sắc thái ἔτι: theo người nói, không còn lý do để tiếp tục làm phiền.'
- source_word: τὸν διδάσκαλον
  choice: Thầy
  rationale: διδάσκαλος có nghĩa là người dạy. “Thầy” là cách gọi tự nhiên, trang trọng trong tiếng Việt; viết hoa để thể hiện đây là danh xưng chỉ Đức Giê-su trong ngữ cảnh, không đổi thành tên riêng.
theological_decisions:
- issue: Cách gọi Đức Giê-su bằng διδάσκαλος
  choice: Thầy
  alternative: Đức Giê-su; Chủ
  rationale: Bản Hy Lạp dùng danh xưng “người dạy” chứ không dùng tên riêng hay danh xưng về quyền chủ tể. Giữ “Thầy” bảo toàn góc nhìn của những người đưa tin và không đưa thêm một khẳng định thần học ngoài câu.
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng và dễ hiểu. Dùng “viên trưởng hội đường” để chỉ chức vụ quản nhiệm hội đường; dùng “ông” phù hợp với cách những người trong nhà nói với Giai-ru. Cấu trúc câu giữ nhịp khẩn cấp của lời báo tin.
