  text: καὶ ⸀εὐθὺς ἀνέστη τὸ κοράσιον καὶ περιεπάτει, ἦν γὰρ ἐτῶν δώδεκα. καὶ ἐξέστησαν ⸁εὐθὺς ἐκστάσει μεγάλῃ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/042.yaml
  text: And immediately the girl stood up and began walking[a], for she was twelve years old[b]. And immediately they were overcome with great amazement.
translation:
  language: vi
  text: Lập tức, cô bé đứng dậy[a] và đi lại, vì em mười hai tuổi. Họ lập tức hết sức kinh ngạc[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “đứng lên” hoặc “trỗi dậy”.
    reason: lexical_alternative
  - marker: b
    text: Nguyên văn dùng một động từ và một danh từ cùng gốc, có thể dịch sát là “họ kinh ngạc với một sự kinh ngạc lớn”, nhằm nhấn mạnh sự kinh ngạc tột độ.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθὺς
  choice: lập tức / ngay lúc ấy
  rationale: Giữ nhịp kể khẩn trương đặc trưng của Mác, đồng thời dùng hai cách diễn đạt tự nhiên trong tiếng Việt để tránh lặp cứng nhắc.
- source_word: ἀνέστη
  choice: đứng dậy
  rationale: Diễn tả tự nhiên việc cô bé đứng lên sau lời truyền của Chúa Giê-su, không ép động từ mang sắc thái thuật ngữ về sự phục sinh dù bối cảnh là được sống lại.
- source_word: τὸ κοράσιον
  choice: cô bé
  rationale: Chuyển tải κοράσιον là một bé gái; cách gọi này phù hợp với chi tiết em mười hai tuổi và tự nhiên trong tiếng Việt hiện đại.
- source_word: περιεπάτει
  choice: bước đi
  rationale: Thì chưa hoàn thành cho thấy hành động diễn tiến sau khi đứng dậy. 'Bước đi' rõ ràng, tự nhiên và thể hiện khả năng đi lại được trông thấy.
- source_word: ἦν γὰρ ἐτῶν δώδεκα
  choice: vì em đã mười hai tuổi
  rationale: Giữ γάρ với ý giải thích và dùng lối nói tuổi tác tự nhiên trong tiếng Việt.
- source_word: ἐξέστησαν ... ἐκστάσει μεγάλῃ
  choice: họ vô cùng kinh ngạc
  rationale: Diễn đạt thành ngữ đồng nguyên chỉ mức độ kinh ngạc mãnh liệt bằng tiếng Việt tự nhiên, không dùng kiểu lặp gượng 'kinh ngạc một sự kinh ngạc lớn'.
theological_decisions:
- issue: Sắc thái phục sinh có thể có trong ἀνέστη
  choice: đứng dậy
  alternative: trỗi dậy
  rationale: Bối cảnh cho thấy cô bé được phục hồi sự sống, nhưng bản thân động từ cũng có nghĩa thông thường là đứng dậy. Bản dịch không làm sắc thái phục sinh rõ hơn mức từ Hy Lạp đòi hỏi.
- issue: Cường độ của thành ngữ đồng nguyên ἐξέστησαν ... ἐκστάσει μεγάλῃ
  choice: vô cùng kinh ngạc
  alternative: kinh ngạc tột độ
  rationale: Giữ cường độ mạnh của nguyên văn mà không biến cấu trúc Hy Lạp thành một câu tiếng Việt thiếu tự nhiên.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “cô bé” rồi “em” để diễn đạt tự nhiên; giữ cả hai lần εὐθὺς nhưng biến đổi cách nói nhằm duy trì nhịp nhanh mà không tạo cảm giác lặp máy móc.
