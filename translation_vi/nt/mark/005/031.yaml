  text: καὶ ἔλεγον αὐτῷ οἱ μαθηταὶ αὐτοῦ· Βλέπεις τὸν ὄχλον συνθλίβοντά σε, καὶ λέγεις· Τίς μου ἥψατο;
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/031.yaml
  text: And his disciples were saying to him[a], “You see the crowd pressing in on you, and you say, ‘Who touched me?’”
translation:
  language: vi
  text: 'Các môn đồ nói với Ngài: “Thầy thấy đám đông đang chen lấn quanh Thầy mà còn hỏi: ‘Ai đã chạm vào Ta?’”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλεγον
  choice: nói
  rationale: Thì vị hoàn cho thấy lời đáp đang diễn ra trong mạch kể; tiếng Việt tự nhiên không cần đánh dấu riêng bằng ‘đang nói’ hay ‘cứ nói’ trong câu này.
- source_word: μαθηταὶ
  choice: các môn đồ
  rationale: ‘Môn đồ’ là cách gọi quen thuộc, trang trọng và giữ được quan hệ học trò đi theo Chúa Giê-su.
- source_word: Βλέπεις
  choice: Thầy thấy
  rationale: Giữ thể hiện tại trực tiếp và sắc thái các môn đồ viện đến điều hiển nhiên trước mắt.
- source_word: ὄχλον
  choice: đám đông
  rationale: Cách diễn đạt hiện đại, rõ ràng và phù hợp với bối cảnh kể chuyện.
- source_word: συνθλίβοντά
  choice: đang chen lấn quanh
  rationale: Diễn đạt sức ép thể chất của đám đông bao quanh Chúa Giê-su mà không cường điệu thành ‘nghiền nát’.
- source_word: λέγεις
  choice: mà còn hỏi
  rationale: Trong tiếng Việt, lời trực tiếp tiếp theo là một câu hỏi, nên ‘hỏi’ tự nhiên hơn ‘nói’; ‘mà còn’ chuyển tải sắc thái ngạc nhiên, khó hiểu của các môn đồ.
- source_word: Τίς μου ἥψατο
  choice: Ai đã chạm vào Ta?
  rationale: ‘Chạm vào’ phản ánh nghĩa thông thường của ἅπτομαι trong ngữ cảnh; ‘đã’ chỉ hành động cụ thể vừa xảy ra.
- source_word: μου
  choice: Ta
  rationale: Đại từ sở hữu cách đi với ἅπτομαι được chuyển tự nhiên thành đối tượng trực tiếp trong tiếng Việt; ‘Ta’ duy trì cách tự xưng trang trọng của Chúa Giê-su trong lời trích dẫn.
theological_decisions: []
translation_notes:
  register: Bản dịch dùng tiếng Việt hiện đại, trang trọng và dễ hiểu. Các môn đồ thưa với Chúa Giê-su bằng ‘Thầy’; trong lời Chúa Giê-su được họ trích lại, Ngài tự xưng ‘Ta’. Không thêm chú thích vì ‘chen lấn quanh’ đã truyền đạt đủ ý nghĩa vật lý của συνθλίβοντά.
