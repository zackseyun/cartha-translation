  text: And there was a woman who had been suffering from a flow of blood for twelve years,[a]
translation:
  language: vi
  text: Có một phụ nữ mắc chứng xuất huyết đã mười hai năm.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “bị chảy máu” hoặc “có dòng máu chảy.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Có
  rationale: Trong cấu trúc kể chuyện tiếp nối, καὶ giới thiệu một nhân vật mới. Tiếng Việt tự nhiên có thể dùng cấu trúc hiện hữu “Có một...” thay vì dịch máy móc là “Và”, trong khi vẫn giữ mạch nối của lời kể.
- source_word: γυνὴ
  choice: một người phụ nữ
  rationale: Danh từ không có mạo từ giới thiệu một nhân vật mới; “một người phụ nữ” là cách diễn đạt tự nhiên và rõ nghĩa trong tiếng Việt.
- source_word: οὖσα
  choice: bị ... đã
  rationale: Phân từ “đang ở trong tình trạng” kết hợp với cụm chỉ bệnh trạng và khoảng thời gian. “Bị ... đã mười hai năm” diễn đạt tự nhiên tình trạng kéo dài mà không làm câu nặng nề.
- source_word: ἐν ῥύσει αἵματος
  choice: bị rong huyết
  rationale: Cụm Hy Lạp chỉ tình trạng máu chảy hoặc xuất huyết kéo dài. “Rong huyết” là cách gọi thông dụng trong tiếng Việt cho tình trạng chảy máu tử cung kéo dài, phù hợp với ngữ cảnh về một phụ nữ, nhưng chú thích giữ các cách hiểu rộng hơn của nguyên ngữ.
- source_word: ῥύσει
  choice: rong
  rationale: ῥύσις có nghĩa là sự chảy hoặc tiết ra; trong cụm “rong huyết”, yếu tố này diễn đạt hiện tượng máu chảy kéo dài.
- source_word: αἵματος
  choice: huyết
  rationale: “Huyết” là yếu tố Hán-Việt nghĩa là máu, được dùng tự nhiên trong thuật ngữ quen thuộc “rong huyết”.
- source_word: δώδεκα ἔτη
  choice: đã mười hai năm
  rationale: Cụm đối cách biểu thị khoảng thời gian. “Đã mười hai năm” nêu rõ tình trạng kéo dài đến thời điểm câu chuyện.
