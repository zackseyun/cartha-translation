  register: Bản dịch dùng tiếng Việt hiện đại, tự nhiên và trang trọng vừa phải. “Rong huyết” ngắn gọn, dễ hiểu trong ngữ cảnh, còn chú thích bảo toàn phạm vi nghĩa rộng hơn của ῥύσις αἵματος.
