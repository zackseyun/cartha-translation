  source_fidelity: Bản nháp giữ đúng các thành tố chính, nhưng “tà linh” không biểu đạt rõ tính từ ἀκαθάρτῳ (“ô uế”), và “Vừa khi” chưa thể hiện minh nhiên trạng từ εὐθύς (“lập tức”). Trong ngữ cảnh, ἄνθρωπος chỉ người nam cụ thể, nên “một người đàn ông” chính xác hơn.
  naturalness: 'Câu sửa vẫn tự nhiên trong tiếng Việt hiện đại: “Ngài vừa ... thì lập tức ...” phân biệt rõ mốc thời gian của việc Ngài ra khỏi thuyền với tính tức thời của cuộc gặp. “Thần ô uế” là cách gọi rõ nghĩa và phù hợp văn phong Kinh Thánh.'
  terminology: Đổi “tà linh” thành “thần ô uế” để bảo toàn thuật ngữ πνεῦμα ἀκάθαρτον mà không diễn giải thành “bị ám” trong thân câu. Chú thích chỉ nêu “bị ... ám” như một phương án diễn giải.
