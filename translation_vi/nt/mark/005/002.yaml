  to: Ngài vừa bước ra khỏi thuyền thì lập tức một người đàn ông có một thần ô uế từ các mồ mả đến gặp Ngài.[a]
  rationale: 'Bản sửa bảo toàn trình tự ý chính của câu: Ngài ra khỏi thuyền; lập tức người đàn ông từ các mồ mả đến gặp Ngài; người ấy ở trong/có liên hệ với một thần ô uế. “Thần ô uế” giữ thuật ngữ gốc, còn cách hiểu “bị ... ám” được đặt trong chú thích để không áp đặt diễn giải vào thân văn.'
