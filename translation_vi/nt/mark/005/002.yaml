    rationale: “Vừa khi” chủ yếu dịch quan hệ thời gian của kết cấu phân từ sở hữu cách độc lập; cần có “lập tức” để thể hiện trạng từ nhấn mạnh nhịp kể của Mác.
  - severity: low
