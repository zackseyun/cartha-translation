  text: καὶ ⸂ἐξελθόντος αὐτοῦ⸃ ἐκ τοῦ πλοίου ⸂εὐθὺς ὑπήντησεν⸃ αὐτῷ ἐκ τῶν μνημείων ἄνθρωπος ἐν πνεύματι ἀκαθάρτῳ,
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/002.yaml
  text: And when he got out of the boat[a], immediately a man with an unclean spirit came out from the tombs to meet him,
translation:
  language: vi
  text: Ngài vừa bước ra khỏi thuyền thì lập tức một người đàn ông có một thần ô uế từ các mồ mả đến gặp Ngài.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “bị một thần ô uế ám.” Cách diễn đạt sát chữ Hy Lạp: “ở trong một thần ô uế.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθόντος αὐτοῦ ἐκ τοῦ πλοίου
  choice: Vừa khi Ngài bước ra khỏi thuyền
  rationale: Phân từ bất định trong kết cấu sở hữu cách độc lập được chuyển thành mệnh đề thời gian tự nhiên. “Vừa khi” kết hợp với ý của εὐθύς để diễn tả sự việc xảy ra ngay lập tức mà không làm câu tiếng Việt nặng nề.
- source_word: εὐθὺς
  choice: Vừa khi
  rationale: Sắc thái “ngay lập tức” được thể hiện bằng kết cấu “vừa khi...”, tạo nhịp kể sống động và tự nhiên trong tiếng Việt.
- source_word: ὑπήντησεν αὐτῷ
  choice: đi ra gặp Ngài
  rationale: ὑπαντάω có nghĩa là đi đến hoặc ra gặp. Cách dịch này kết nối tự nhiên với cụm chỉ xuất xứ ἐκ τῶν μνημείων.
- source_word: ἐκ τῶν μνημείων
  choice: từ các ngôi mộ
  rationale: μνημεῖον ở đây chỉ mộ hoặc nơi chôn cất; số nhiều được giữ lại. “Các ngôi mộ” rõ nghĩa và phù hợp bối cảnh.
- source_word: ἄνθρωπος
  choice: một người
  rationale: ἄνθρωπος chỉ một con người; trong câu này tiếng Việt tự nhiên có thể dùng “một người” mà không cần thêm giới tính vốn không phải trọng tâm của từ này.
- source_word: ἐν πνεύματι ἀκαθάρτῳ
  choice: có tà linh
  rationale: “Có tà linh” diễn đạt tự nhiên tình trạng hoặc sự gắn kết được nêu bởi ἐν, đồng thời tránh thêm ý diễn giải mạnh hơn như “bị quỷ ám”. Chú thích bảo lưu cách dịch sát cấu trúc Hy Lạp.
theological_decisions:
- issue: Cách diễn đạt tình trạng liên quan đến tà linh
  choice: có tà linh
  alternative: ở trong một uế linh; bị tà linh ám
  rationale: Bản Hy Lạp dùng ἐν πνεύματι ἀκαθάρτῳ, nghĩa sát là “trong/với một linh ô uế”. “Có tà linh” dễ hiểu trong tiếng Việt nhưng không xác quyết một mô hình quỷ ám được hệ thống hóa; chú thích nêu cách diễn đạt sát nguyên văn.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Ngài” để chỉ Chúa Giê-su trong mạch văn; “tà linh” là cách gọi tự nhiên, quen thuộc cho πνεῦμα ἀκάθαρτον. Câu giữ nhịp kể khẩn trương đặc trưng của Mác.
