  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: διὰ τὸ αὐτὸν πολλάκις πέδαις καὶ ἁλύσεσι δεδέσθαι καὶ διεσπάσθαι ὑπ’ αὐτοῦ τὰς ἁλύσεις καὶ τὰς πέδας συντετρῖφθαι, καὶ οὐδεὶς ⸂ἴσχυεν αὐτὸν⸃ δαμάσαι·
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/004.yaml
  text: because he had often been bound with shackles and chains[a], and the chains had been torn apart by him and the shackles smashed to pieces, and no one was strong enough to subdue him.
translation:
  language: vi
  text: vì người ấy đã nhiều lần bị trói bằng cùm chân và xiềng xích, xiềng xích đã bị người ấy bứt tung, cùm chân đã bị đập vỡ tan, và không ai đủ sức chế ngự người ấy.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “thuần hóa người ấy”. Động từ Hy Lạp có thể mang nghĩa “thuần hóa”, hoặc theo nghĩa rộng hơn là “chế ngự, đưa vào vòng kiểm soát”.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τὸ αὐτὸν
  choice: vì người đã
  rationale: διά với động từ nguyên mẫu có mạo từ nêu nguyên nhân cho lời khẳng định ở câu trước; cách dịch này giữ rõ quan hệ nhân quả và tự nhiên trong tiếng Việt.
- source_word: πολλάκις
  choice: nhiều lần
  rationale: Diễn đạt trực tiếp sự việc lặp đi lặp lại, tự nhiên hơn trong mạch kể tiếng Việt.
- source_word: πέδαις / τὰς πέδας
  choice: cùm chân
  rationale: πέδη chỉ dụng cụ khóa hoặc trói chân; thêm “chân” giúp phân biệt chính xác với ἅλυσις là xiềng xích nói chung.
- source_word: ἁλύσεσι / τὰς ἁλύσεις
  choice: xiềng xích
  rationale: Giữ một thuật ngữ riêng cho dây xích kim loại, qua đó bảo tồn sự phân biệt giữa hai loại dụng cụ giam giữ trong tiếng Hy Lạp.
- source_word: δεδέσθαι
  choice: bị cùm chân và xiềng xích
  rationale: Dạng hoàn thành nguyên mẫu diễn tả những lần người ấy bị trói giữ; cấu trúc bị động tiếng Việt truyền đạt rõ hành động do người khác thực hiện.
- source_word: διεσπάσθαι ὑπ’ αὐτοῦ
  choice: người bứt tung
  rationale: διασπάω diễn tả việc giật, xé đứt bằng sức mạnh; chuyển sang câu chủ động giúp câu tiếng Việt tự nhiên mà vẫn giữ rõ tác nhân là chính người ấy.
- source_word: συντετρῖφθαι
  choice: đập vỡ
  rationale: συντρίβω mang nghĩa làm vỡ hoặc nghiền nát; “đập vỡ” rõ nghĩa, mạnh và phù hợp với cùm chân.
- source_word: οὐδεὶς ἴσχυεν
  choice: không ai đủ sức
  rationale: Giữ sắc thái về sức mạnh hay năng lực của ἰσχύω, thay vì chỉ dịch chung là “không ai có thể”.
- source_word: δαμάσαι
  choice: chế ngự
  rationale: δαμάζω có thể là thuần hóa hoặc khuất phục, kiểm soát. “Chế ngự” phù hợp với con người trong bối cảnh này mà vẫn giữ ý đưa vào vòng kiểm soát.
theological_decisions:
- issue: Nguồn gốc sức mạnh và tình trạng của người ấy
  choice: Dịch theo lối mô tả việc nhiều lần trói giữ thất bại và không ai đủ sức chế ngự, không bổ sung nguyên nhân ngay trong câu này.
  alternative: Tăng cường cách nói để trực tiếp quy sức mạnh ấy cho thế lực quỷ hoặc dịch δαμάσαι là “thuần hóa”.
  rationale: Bản Hy Lạp ở câu này nhấn mạnh sức mạnh khác thường và sự bất lực của con người trong việc kiểm soát người ấy, còn nguyên nhân được cung cấp bởi văn cảnh rộng hơn. Bản dịch không đưa phần giải thích thần học từ văn cảnh vào chính câu này.
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “người” để chỉ nhân vật, tránh sắc thái khinh miệt. Giữ riêng “cùm chân” và “xiềng xích”, đồng thời dùng các động từ mạnh “bứt tung”, “đập vỡ” để phản ánh lực của nguyên văn.
