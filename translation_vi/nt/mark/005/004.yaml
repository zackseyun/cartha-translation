revisions:
- from: vì người đã nhiều lần bị cùm chân và xiềng xích, nhưng người bứt tung xiềng xích và đập vỡ cùm chân; không ai đủ sức chế ngự người.[a]
  to: vì người ấy đã nhiều lần bị trói bằng cùm chân và xiềng xích, xiềng xích đã bị người ấy bứt tung, cùm chân đã bị đập vỡ tan, và không ai đủ sức chế ngự người ấy.[a]
  rationale: Bản sửa giữ nguyên chuỗi liệt kê bằng “và” của tiếng Hy Lạp, làm rõ rằng cùm chân và xiềng xích là phương tiện dùng để trói, và diễn đạt rõ hai hành động phá hủy tương ứng. Không bổ sung lời giải thích về nguyên nhân sức mạnh hoặc tình trạng của người ấy.
  reviewer_model: gpt-5.6-terra
