source:
  edition: SBLGNT
  text: καὶ προσελθὼν ἤγειρεν αὐτὴν κρατήσας τῆς ⸀χειρός· καὶ ἀφῆκεν αὐτὴν ὁ ⸀πυρετός, καὶ διηκόνει αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/031.yaml
  text: And coming near[a], he raised her up, taking her by the hand; and the fever left her, and she served them.
translation:
  language: vi
  text: Ngài đến gần, nắm lấy tay bà và nâng bà dậy; cơn sốt rời khỏi bà, rồi bà phục vụ họ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “bà bắt đầu phục vụ họ.” Thì chưa hoàn thành trong tiếng Hy Lạp có thể chỉ đơn giản mô tả việc bà phục vụ, nhưng ngữ cảnh cũng cho phép hiểu rằng bà bắt đầu phục vụ họ ngay sau khi được chữa lành.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσελθὼν
  choice: đến gần
  rationale: Phân từ bất định của προσέρχομαι diễn tả việc Đức Giê-su tiến đến trước khi nâng bà dậy; “đến gần” tự nhiên và không thêm đối tượng vốn chỉ được hiểu theo ngữ cảnh.
- source_word: ἤγειρεν αὐτὴν
  choice: nâng bà dậy
  rationale: ἐγείρω ở đây chỉ việc làm cho bà đang nằm vì bệnh được dậy. “Nâng bà dậy” giữ được lực chủ động của động từ hơn “giúp bà ngồi dậy”, nhưng không biến câu chữa lành thành lời khẳng định về sự sống lại.
- source_word: κρατήσας τῆς χειρός
  choice: nắm lấy tay bà
  rationale: κρατέω diễn tả việc nắm hoặc giữ chắc; cấu trúc với χειρός nói đến việc nắm tay bà trong khi nâng bà dậy.
- source_word: ἀφῆκεν αὐτὴν ὁ πυρετός
  choice: cơn sốt rời khỏi bà
  rationale: Cách diễn đạt này giữ chủ ngữ “cơn sốt” và hình ảnh căn bệnh lìa khỏi người bệnh trong tiếng Hy Lạp, đồng thời vẫn rõ nghĩa trong tiếng Việt.
- source_word: διηκόνει αὐτοῖς
  choice: bà phục vụ họ
  rationale: διακονέω trong bối cảnh gia đình có nghĩa là phục vụ, chăm lo cho những người hiện diện; đại từ số nhiều αὐτοῖς được dịch là “họ”. Thì chưa hoàn thành không tự nó bắt buộc phải thêm ý “bắt đầu”.
theological_decisions:
- issue: Sắc thái có thể gợi đến sự sống lại của ἐγείρω
  choice: nâng bà dậy
  alternative: đỡ bà dậy
  rationale: “Nâng bà dậy” bảo lưu phần nào cách dùng động từ đặc trưng của Mác mà không tuyên bố rằng đây là một trường hợp sống lại; ngữ cảnh trực tiếp vẫn là chữa bệnh.
- issue: Sắc thái khởi đầu của διηκόνει
  choice: bà phục vụ họ
  alternative: bà bắt đầu phục vụ họ
  rationale: Thì chưa hoàn thành có thể trình bày hành động đang diễn ra, còn ngữ cảnh cũng cho phép hiểu hành động bắt đầu ngay sau khi bà được chữa lành. Bản chính không thêm sắc thái khởi đầu; chú thích bảo lưu khả năng ấy.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” cho Đức Giê-su và “bà” cho người phụ nữ theo cách xưng hô tự nhiên trong tiếng Việt. Dấu chấm phẩy giữ mối liên hệ chặt giữa hành động nâng bà dậy và việc cơn sốt rời khỏi bà; “rồi” thể hiện diễn tiến tiếp theo mà không nhất thiết hàm ý tức khắc.
