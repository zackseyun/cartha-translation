source:
  edition: SBLGNT
  text: καὶ ⸀εὐθὺς ἀναβαίνων ⸀ἐκ τοῦ ὕδατος εἶδεν σχιζομένους τοὺς οὐρανοὺς καὶ τὸ πνεῦμα ⸀ὡς περιστερὰν καταβαῖνον ⸀εἰς αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/010.yaml
  text: And immediately[a], as he was coming up out of the water[b], he saw the heavens being torn open and the Spirit descending like a dove upon him.
translation:
  language: vi
  text: Lập tức, khi Ngài từ dưới nước đi lên, Ngài thấy các tầng trời bị xé toạc[a] và Thần Khí như chim bồ câu giáng xuống trên Ngài[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “các tầng trời bị tách toạc.” Động từ Hy Lạp mạnh hơn cách nói đơn thuần là “mở ra.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “vào trong Ngài.” Từ Hy Lạp εἰς có thể mang nghĩa “vào trong,” nhưng ở đây “trên Ngài” phù hợp hơn với cách nói về Thần Khí giáng xuống.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθὺς
  choice: ngay khi
  rationale: Diễn đạt tính tức thời và nhịp kể khẩn trương đặc trưng của Mác, đồng thời kết hợp tự nhiên với phân từ chỉ hành động đang diễn ra.
- source_word: ἀναβαίνων ἐκ τοῦ ὕδατος
  choice: từ dưới nước đi lên
  rationale: Giữ quan hệ đồng thời với động từ chính và thể hiện rõ hướng chuyển động ra khỏi nước của ἐκ.
- source_word: εἶδεν
  choice: Ngài thấy
  rationale: Dịch trực tiếp động từ tri giác ở thì aorist; đại từ “Ngài” xác định Chúa Giê-xu trong văn phong Kinh Thánh trang trọng.
- source_word: σχιζομένους τοὺς οὐρανούς
  choice: các tầng trời bị xé toạc
  rationale: “Xé toạc” giữ sức mạnh và hình ảnh kịch tính của σχίζω, mạnh hơn cách nói đơn thuần là “mở ra”; “các tầng trời” phản ánh dạng số nhiều.
- source_word: τὸ πνεῦμα
  choice: Thần Khí
  rationale: Chữ viết hoa biểu thị Thần Khí của Đức Chúa Trời trong ngữ cảnh, nhưng không thêm tính từ “Thánh” vốn không có trong câu Hy Lạp.
- source_word: ὡς περιστερὰν
  choice: như chim bồ câu
  rationale: Giữ nguyên phép so sánh mà không quyết định đó là sự giống nhau về hình dạng, cách chuyển động hay phương diện nào khác.
- source_word: καταβαῖνον
  choice: ngự xuống
  rationale: Diễn đạt chuyển động đi xuống trong văn phong trang trọng, tự nhiên khi chủ thể là Thần Khí.
- source_word: εἰς αὐτόν
  choice: trên Ngài
  rationale: Phù hợp với thành ngữ chỉ Thần Khí ngự xuống trên một người, đồng thời ghi nhận nghĩa sát chữ “vào trong” ở chú thích.
theological_decisions:
- issue: Danh xưng τὸ πνεῦμα
  choice: Thần Khí
  alternative: Thánh Linh
  rationale: Ngữ cảnh cho thấy đây là Thần Khí của Đức Chúa Trời, nhưng nguyên văn chỉ viết “Thần Khí”; bản dịch tránh thêm từ “Thánh”.
- issue: Phương diện được so sánh với chim bồ câu
  choice: như chim bồ câu
  alternative: trong hình dạng chim bồ câu
  rationale: ὡς chỉ thiết lập sự so sánh, không nói rõ đó là hình dạng hay cách thức; bản dịch giữ sự không xác định này.
- issue: Hướng nghĩa của εἰς αὐτόν
  choice: trên Ngài
  alternative: vào trong Ngài
  rationale: “Trên Ngài” là cách diễn đạt tự nhiên trong ngữ cảnh Thần Khí ngự xuống, nhưng εἰς vẫn có thể mang nghĩa “vào trong,” nên phương án ấy được bảo lưu trong chú thích.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Câu giữ nhịp nhanh của lời kể, dùng “xé toạc” để bảo toàn hình ảnh mạnh của nguyên văn, và tránh giải thích quá mức phép so sánh với chim bồ câu.
