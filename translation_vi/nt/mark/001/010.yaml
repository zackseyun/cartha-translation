revisions:
- from: Ngay khi từ dưới nước đi lên, Ngài thấy các tầng trời bị xé toạc[a] và Thần Khí ngự xuống trên Ngài[b] như chim bồ câu.
  to: Lập tức, khi Ngài từ dưới nước đi lên, Ngài thấy các tầng trời bị xé toạc[a] và Thần Khí như chim bồ câu giáng xuống trên Ngài[b].
  rationale: Bản sửa thay “Ngay khi” bằng “Lập tức” để dịch rõ εὐθύς, giữ “khi Ngài từ dưới nước đi lên” cho quan hệ đồng thời của ἀναβαίνων, và sắp lại cụm “như chim bồ câu” để phép so sánh bổ nghĩa rõ cho sự giáng xuống của Thần Khí. Không xác định phép so sánh là về hình dạng hay cách thức, và chú thích vẫn bảo lưu khả năng nghĩa sát chữ của εἰς.
  reviewer_model: gpt-5.6-terra
