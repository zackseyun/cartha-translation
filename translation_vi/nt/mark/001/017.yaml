  source_fidelity: 'Bản dịch chuyển đạt trung thành các thành tố chính của nguyên văn: mệnh lệnh Δεῦτε ὀπίσω μου là “Hãy theo tôi”; cấu trúc ποιήσω ὑμᾶς γενέσθαι được giữ đầy đủ là “tôi sẽ khiến các anh trở thành”; và ἁλιεῖς ἀνθρώπων được bảo lưu như một ẩn dụ nghề cá hướng đến con người. Việc không dịch riêng liên từ καὶ đầu câu là tự nhiên trong tiếng Việt và không làm mất nghĩa.'
  naturalness: Câu văn rõ ràng, hiện đại, có nhịp điệu phù hợp với lời kêu gọi trực tiếp. “Các anh” phù hợp với hai người nam được ngữ cảnh liền trước xác định là Si-môn và An-rê. “Đánh lưới người” giữ được hình ảnh chủ ý lạ tai của nguyên văn, nhưng vẫn dễ hiểu trong văn cảnh.
