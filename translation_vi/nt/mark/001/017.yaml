source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτοῖς ὁ Ἰησοῦς· Δεῦτε ὀπίσω μου, καὶ ποιήσω ὑμᾶς γενέσθαι ἁλιεῖς ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/017.yaml
  text: And Jesus said to them, “Come after me, and I will make you become fishers of men.”
translation:
  language: vi
  text: 'Đức Giê-su nói với họ: “Hãy theo tôi, tôi sẽ khiến các anh trở thành những người đánh lưới người.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Δεῦτε ὀπίσω μου
  choice: Hãy theo tôi
  rationale: Cụm này theo sát ý ‘hãy đến phía sau tôi’, một cách nói về việc đi theo làm môn đồ; ‘hãy theo tôi’ tự nhiên và rõ nghĩa trong tiếng Việt hiện đại.
- source_word: ποιήσω ὑμᾶς γενέσθαι
  choice: tôi sẽ khiến các anh trở thành
  rationale: Giữ cả ý tác động của ποιήσω và tiến trình/kết quả ‘trở thành’ của γενέσθαι, thay vì rút gọn thành ‘tôi sẽ làm các anh thành’.
- source_word: ἁλιεῖς ἀνθρώπων
  choice: những người đánh lưới người
  rationale: Duy trì hình ảnh nghề đánh cá và đối tượng là con người. ‘Người’ trong tiếng Việt bao quát tự nhiên cho ἀνθρώπων mà không cần thu hẹp thành nam giới.
- source_word: ὑμᾶς
  choice: các anh
  rationale: Đại từ số nhiều hướng đến Si-môn và An-rê; ‘các anh’ phù hợp ngữ cảnh đối thoại và tự nhiên hơn ‘các ngươi’ trong tiếng Việt hiện đại.
theological_decisions:
- issue: Hình ảnh lời kêu gọi môn đồ
  choice: Giữ nguyên ẩn dụ ‘đánh lưới người’
  alternative: Diễn giải thành ‘đưa người ta đến với Đức Chúa Trời’ hoặc ‘thu phục người’
  rationale: Nguyên văn dùng một ẩn dụ mở, không giải thích phương thức hay mục đích thần học chi tiết; bản dịch không nên âm thầm giải nghĩa vượt quá câu.
- issue: Phạm vi của ἀνθρώπων
  choice: Dịch là ‘người’ theo nghĩa loài người/con người
  alternative: ‘đàn ông’ hoặc ‘nam giới’
  rationale: Trong ngữ cảnh này, số nhiều ἀνθρώπων chỉ con người nói chung; tiếng Việt ‘người’ vừa chính xác vừa không áp đặt giới tính.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng ‘Đức Giê-su’ làm danh xưng kính trọng; lời nói trực tiếp gọn, mạnh. Cụm ‘đánh lưới người’ hơi khác lời nói thông thường nhưng chủ ý giữ hình ảnh nổi bật của nguyên văn.
