  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ φωνὴ ἐγένετο ἐκ τῶν οὐρανῶν· Σὺ εἶ ὁ υἱός μου ὁ ἀγαπητός, ἐν ⸀σοὶ εὐδόκησα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/011.yaml
  text: 'And a voice came from the heavens: “You are my beloved Son[b][a]; in you I am well pleased.”'
translation:
  language: vi
  text: 'Và có tiếng từ các tầng trời[a] nói: “Con là Con yêu dấu của Ta; Ta hài lòng về Con[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch là “từ trời.” Tiếng Hy Lạp dùng dạng số nhiều: “từ các tầng trời.”'
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “Ta đã lấy làm vui thích nơi Con” hoặc “Ta hài lòng với Con.”
    reason: alternative_reading
lexical_decisions:
- source_word: φωνὴ ἐγένετο
  choice: có tiếng ... cất lên
  rationale: Cách diễn đạt này chuyển tải tự nhiên việc một tiếng nói xuất hiện và được nghe thấy, thay vì dịch cứng là “một tiếng đã xảy ra”.
- source_word: ἐκ τῶν οὐρανῶν
  choice: từ các tầng trời
  rationale: Giữ dạng số nhiều của οὐρανῶν bằng một cách nói trang trọng, dễ hiểu trong tiếng Việt; cách quen thuộc ở số ít được ghi trong chú thích.
- source_word: Σὺ εἶ
  choice: Con là
  rationale: Đại từ được nói trực tiếp và có sắc thái nhấn mạnh; “Con là” thể hiện điều đó tự nhiên trong lời xưng hô tiếng Việt.
- source_word: ὁ υἱός μου
  choice: Con ... của Ta
  rationale: Diễn đạt quan hệ cha-con trong lời phán trực tiếp. Viết hoa “Con” và “Ta” giúp người đọc nhận ra các chủ thể trong ngữ cảnh mà không thêm thuật ngữ thần học ngoài bản văn.
- source_word: ὁ ἀγαπητός
  choice: yêu dấu
  rationale: “Yêu dấu” vừa thể hiện tình yêu sâu đậm vừa giữ giọng trang trọng của lời tuyên bố.
- source_word: ἐν σοὶ
  choice: nơi Con
  rationale: “Nơi Con” phản ánh trực tiếp cấu trúc ἐν σοὶ hơn “về Con”, đồng thời vẫn tự nhiên trong văn phong trang trọng tiếng Việt.
- source_word: εὐδόκησα
  choice: Ta hài lòng
  rationale: Cụm này diễn đạt sự vui lòng và chấp thuận của Đấng phán với hiệu lực hiện tại. Chú thích bảo lưu sắc thái “lấy làm vui thích” và cách hiểu “hài lòng về Con”.
theological_decisions:
- issue: Cách chuyển lời tuyên bố về thân phận làm Con và tình yêu dành cho Đức Giê-su
  choice: Con là Con yêu dấu của Ta
  alternative: Con là Con Ta, Đấng yêu dấu
  rationale: Bản dịch giữ cả thân phận làm Con lẫn tình yêu của Đấng phán, nhưng không đưa thêm thuật ngữ tín lý không có trong câu.
- issue: Dạng số nhiều của οὐρανῶν
  choice: từ các tầng trời
  alternative: từ trời
  rationale: Giữ số nhiều của nguyên văn trong chính văn, đồng thời nêu cách nói số ít quen thuộc trong chú thích.
- issue: Sắc thái thời và ý nghĩa của εὐδόκησα
  choice: nơi Con, Ta hài lòng
  alternative: nơi Con, Ta đã lấy làm vui thích; Ta hài lòng về Con
  rationale: Cách dịch chính truyền đạt sự chấp thuận đang được tuyên bố mà không buộc thì aorist thành một hành động chỉ thuộc quá khứ; các khả năng về sắc thái vui thích và quan hệ “về/đối với” được bảo lưu trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và phù hợp với lời phán từ trời. Cấu trúc “Con là Con yêu dấu của Ta” cố ý giữ sự lặp từ tự nhiên trong quan hệ xưng hô, còn “nơi Con” bảo lưu hình ảnh và độ mở của giới từ Hy Lạp.
