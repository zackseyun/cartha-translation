id: MRK.1.45
reference: Mark 1:45
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὁ δὲ ἐξελθὼν ἤρξατο κηρύσσειν πολλὰ καὶ διαφημίζειν τὸν λόγον, ὥστε μηκέτι αὐτὸν δύνασθαι φανερῶς εἰς πόλιν εἰσελθεῖν, ἀλλὰ ἔξω ⸀ἐπ’ ἐρήμοις τόποις ἦν· καὶ ἤρχοντο πρὸς αὐτὸν ⸀πάντοθεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/045.yaml
  text: But after he went out, he began to proclaim widely and to spread the message, so that Jesus could no longer enter a town openly, but stayed outside in deserted places; and people were coming to him from everywhere.
translation:
  language: vi
  text: Nhưng sau khi đi khỏi đó, người ấy bắt đầu rao truyền khắp nơi và loan truyền tin ấy, đến nỗi Đức Giê-su không thể công khai vào thành nào nữa, mà ở lại bên ngoài, tại những nơi hoang vắng. Dân chúng từ khắp nơi kéo đến với Ngài.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κηρύσσειν πολλὰ
  choice: rao truyền khắp nơi
  rationale: Động từ κηρύσσειν là công bố hay rao truyền công khai; πολλὰ ở đây có sắc thái mạnh về mức độ/phạm vi, nên diễn đạt tự nhiên là “khắp nơi” mà không thêm một tân ngữ không có trong tiếng Hy Lạp.
- source_word: διαφημίζειν τὸν λόγον
  choice: loan rộng chuyện này
  rationale: διαφημίζω chỉ việc làm cho tin tức lan rộng; τὸν λόγον trong ngữ cảnh là chuyện/tin về việc Đức Giê-su đã làm, nên “chuyện này” tự nhiên hơn “lời” trong tiếng Việt.
- source_word: φανερῶς
  choice: công khai
  rationale: Giữ ý Đức Giê-su không còn có thể vào thành một cách lộ diện, công khai.
- source_word: πόλιν
  choice: thành nào
  rationale: Danh từ số ít không có mạo từ trong cấu trúc phủ định mang nghĩa phiếm chỉ; “thành nào” thể hiện đúng ý không thể vào bất cứ thành nào.
- source_word: ἐπ’ ἐρήμοις τόποις
  choice: tại những nơi hoang vắng
  rationale: ἐρήμοις mô tả nơi vắng người, hẻo lánh; không nhất thiết là sa mạc.
- source_word: ἤρχοντο ... πάντοθεν
  choice: Dân chúng từ khắp nơi kéo đến
  rationale: Chủ ngữ hàm ẩn số nhiều được diễn đạt bằng “dân chúng”; thì chưa hoàn thành cho thấy dòng người liên tục đến, được chuyển tự nhiên bằng “kéo đến”.
theological_decisions:
- issue: Chủ thể của αὐτὸν trong mệnh đề về việc không thể vào thành
  choice: Đức Giê-su
  alternative: Ngài/người ấy
  rationale: Dù đại từ Hy Lạp tự nó có thể gây nhập nhằng về mặt hình thức, mạch truyện xác định người không thể vào thành là Đức Giê-su; nêu tên giúp tiếng Việt rõ ràng mà không áp đặt một kết luận thần học riêng.
- issue: Nội dung được người được chữa lành loan truyền
  choice: chuyện này
  alternative: lời ấy/sứ điệp
  rationale: Bản văn không nói rõ ông lặp lại lời nào; “chuyện này” giữ phạm vi rộng, có thể bao gồm điều đã xảy ra, và tránh biến nó thành một sứ điệp giáo lý cụ thể.
- issue: Sắc thái của ἦν
  choice: phải ở bên ngoài
  alternative: ở bên ngoài
  rationale: “Phải” diễn đạt hệ quả thực tế của việc không thể công khai vào thành, chứ không hàm ý một mệnh lệnh thần học hay sự cưỡng ép tuyệt đối.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Đức Giê-su” và đại từ kính trọng “Ngài”; tránh thuật ngữ giáo phái. Câu được chia làm hai để dễ đọc nhưng vẫn giữ quan hệ nguyên nhân–kết quả và diễn tiến của nguyên văn.
