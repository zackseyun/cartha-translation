- from: 'Ngài nổi giận[a], đưa tay chạm vào người ấy và nói: “Ta sẵn lòng; hãy được sạch.”'
  to: 'Ngài nổi giận[a], giơ tay ra, chạm vào người ấy và nói: “Ta sẵn lòng; hãy được sạch.”'
  rationale: Chỉ sửa “đưa tay” thành “giơ tay ra” để phản ánh chính xác hơn ἐκτείνας τὴν χεῖρα. Giữ nguyên cách đọc gây khó “nổi giận” trong chính văn và dị bản trong chú thích, không giải thích hoặc điều hòa cảm xúc được nêu trong bản văn.
