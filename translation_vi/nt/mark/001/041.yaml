  text: ⸀καὶ ⸀ὀργισθεὶς ἐκτείνας τὴν χεῖρα ⸂αὐτοῦ ἥψατο⸃ καὶ λέγει αὐτῷ· Θέλω, καθαρίσθητι·
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/041.yaml
  text: And being angry[a], he stretched out his hand, touched him, and said to him, “I am willing; be cleansed.”
translation:
  language: vi
  text: 'Ngài nổi giận[a], giơ tay ra, chạm vào người ấy và nói: “Ta sẵn lòng; hãy được sạch.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Một số thủ bản chép “động lòng thương” thay cho “nổi giận”.
    reason: textual_variant
lexical_decisions:
- source_word: ὀργισθεὶς
  choice: nổi giận
  rationale: Phản ánh trực tiếp phân từ ὀργισθείς trong bản SBLGNT, với nghĩa thông thường là trở nên giận hoặc nổi giận; không thay bằng dị bản quen thuộc hơn.
- source_word: ἐκτείνας τὴν χεῖρα
  choice: đưa tay
  rationale: Cách diễn đạt tự nhiên trong tiếng Việt cho hành động giơ hoặc vươn tay ra, vẫn giữ hình ảnh cụ thể của nguyên văn.
- source_word: ἥψατο
  choice: chạm vào người ấy
  rationale: Trong ngữ cảnh chữa lành này, ἅπτομαι chỉ hành động chạm vào; đại từ được diễn đạt rõ để tránh mơ hồ.
- source_word: λέγει αὐτῷ
  choice: nói
  rationale: Thì hiện tại lịch sử trong tiếng Hy Lạp được chuyển thành cách kể quá khứ tự nhiên của tiếng Việt; đối tượng đã rõ từ cụm “người ấy” ngay trước đó.
- source_word: Θέλω
  choice: Ta sẵn lòng
  rationale: Diễn đạt sự sẵn lòng đáp ứng lời cầu xin, thay vì hiểu như một lời chỉ về tương lai.
- source_word: καθαρίσθητι
  choice: hãy được sạch
  rationale: Giữ dạng mệnh lệnh thụ động và phạm vi nghĩa vừa thể chất vừa nghi lễ của καθαρίζω; cách nói trang trọng nhưng dễ hiểu.
theological_decisions:
- issue: Dị bản văn bản mô tả cảm xúc của Chúa Giê-su
  choice: Dịch ὀργισθείς của bản SBLGNT là “nổi giận” trong chính văn
  alternative: động lòng thương
  rationale: Ưu tiên bản văn nguồn được cung cấp và giữ nguyên sự căng thẳng thần học; dị bản có ảnh hưởng đáng kể đến cách hiểu cảm xúc của Chúa Giê-su nên được nêu trong chú thích, không âm thầm dung hòa.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “Ngài/Ta” phù hợp văn phong Kinh Thánh phổ thông; cấu trúc câu gọn, giữ chuỗi hành động của nguyên văn và đánh dấu đầy đủ chú thích [a].
