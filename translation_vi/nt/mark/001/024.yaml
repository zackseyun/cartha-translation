  source_fidelity: 'Bản dịch truyền đạt đầy đủ các thành tố của câu Hy Lạp: lời nói dẫn nhập, thành ngữ đối đầu Τί ἡμῖν καὶ σοί, lời gọi đích danh ở hô cách, câu hỏi về mục đích đến để ἀπολέσαι, đại từ số nhiều ἡμᾶς, và lời nhận biết bằng danh hiệu ὁ ἅγιος τοῦ θεοῦ. “Ông can gì đến chúng tôi?” là cách chuyển thành ngữ tự nhiên, vẫn giữ lực đối đầu mà không diễn giải quá mức. “Tiêu diệt” phản ánh phù hợp ἀπολέσαι trong ngữ cảnh.'
