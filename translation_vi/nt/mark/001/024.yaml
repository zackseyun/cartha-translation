id: MRK.1.24
reference: Mark 1:24
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: λέγων· ⸀Τί ἡμῖν καὶ σοί, Ἰησοῦ Ναζαρηνέ; ἦλθες ἀπολέσαι ἡμᾶς; οἶδά σε τίς εἶ, ὁ ἅγιος τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/024.yaml
  text: saying[a], “What have you to do with us[b], Jesus the Nazarene? Have you come to destroy us? I know who you are—the Holy One of God.”
translation:
  language: vi
  text: 'nói: “Ông can gì đến chúng tôi[a], hỡi Giê-su người Na-xa-rét[b]? Ông đến để tiêu diệt chúng tôi sao? Tôi biết ông là ai—Đấng Thánh của Đức Chúa Trời.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Giữa chúng tôi với ông có chuyện gì?” Thành ngữ Hy Lạp này diễn tả sự tách biệt hoặc đối nghịch.'
    reason: lexical_alternative
  - marker: b
    text: 'Hay: “Giê-su quê Na-xa-rét.” Tiếng Hy Lạp sát nghĩa là “Giê-su người Na-xa-rét.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγων
  choice: nói
  rationale: Phân từ hiện tại được chuyển tự nhiên sang tiếng Việt bằng động từ “nói”, tiếp nối hành động ở câu trước mà không thêm sắc thái không có trong nguyên văn.
- source_word: Τί ἡμῖν καὶ σοί
  choice: Ông can gì đến chúng tôi
  rationale: Đây là thành ngữ chịu ảnh hưởng Sê-mít, theo nghĩa đen là “có gì cho chúng tôi và cho ông”, diễn tả sự tách biệt hoặc đối đầu. “Ông can gì đến chúng tôi” tự nhiên trong tiếng Việt và giữ được sắc thái chống đối.
- source_word: Ἰησοῦ Ναζαρηνέ
  choice: hỡi Giê-su người Na-xa-rét
  rationale: Dạng hô cách được thể hiện bằng “hỡi”; Ναζαρηνέ là danh xưng chỉ người Na-xa-rét, nên “người Na-xa-rét” bám sát hình thức Hy Lạp hơn cách diễn đạt địa lý “quê Na-xa-rét”.
- source_word: ἦλθες
  choice: Ông đến ... sao?
  rationale: Động từ aorist trong câu hỏi được diễn đạt tự nhiên bằng “đến ... sao?”, nói đến việc đã đến với hệ quả hiện tại mà không ép buộc một phân biệt thì không có tương ứng trực tiếp trong tiếng Việt.
- source_word: ἀπολέσαι
  choice: để tiêu diệt
  rationale: Động từ nguyên mẫu chỉ mục đích; ἀπόλλυμι trong bối cảnh này mang nghĩa hủy diệt, nên “tiêu diệt” vừa trực tiếp vừa phù hợp với lời của tà linh.
- source_word: ἡμᾶς
  choice: chúng tôi
  rationale: Giữ nguyên ngôi thứ nhất số nhiều của nguyên văn và không giải thích thêm số nhiều này ám chỉ những ai.
- source_word: οἶδά σε τίς εἶ
  choice: Tôi biết ông là ai
  rationale: Cách diễn đạt rõ ràng, tự nhiên, giữ nguyên lời tuyên bố nhận biết căn tính của Chúa Giê-su.
- source_word: ὁ ἅγιος τοῦ θεοῦ
  choice: Đấng Thánh của Đức Chúa Trời
  rationale: Mạo từ cùng danh từ tính từ cho thấy cụm này có chức năng như một danh hiệu. “Đấng Thánh” giữ sắc thái danh xưng, còn “của Đức Chúa Trời” bảo toàn quan hệ sở thuộc của cụm sở hữu cách mà không diễn giải thêm.
theological_decisions:
- issue: Danh hiệu Cơ Đốc học trong lời nhận biết của tà linh
  choice: Đấng Thánh của Đức Chúa Trời
  alternative: Đấng Thánh thuộc về Đức Chúa Trời
  rationale: Bản dịch giữ nguyên sức nặng của danh hiệu ὁ ἅγιος τοῦ θεοῦ nhưng không mở rộng lời này thành một tuyên xưng tín lý đầy đủ hơn điều nguyên văn nói.
- issue: Cách xưng hô của tà linh với Chúa Giê-su
  choice: ông
  alternative: Ngài
  rationale: Nguyên văn dùng đại từ ngôi thứ hai số ít mà không chứa kính ngữ. “Ông” phù hợp với giọng đối đầu trong ngữ cảnh và tránh đưa thái độ tôn kính vào lời của tà linh; danh hiệu ở cuối câu vẫn được bảo toàn đầy đủ.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Dấu hai chấm dẫn lời trực tiếp tự nhiên hơn “nói rằng” trong cấu trúc này. “Hỡi” thể hiện dạng hô cách của tên gọi; “ông” giữ sắc thái đối đầu và không thêm kính ngữ ngoài nguyên văn. Dấu gạch ngang trước danh hiệu làm nổi bật lời nhận diện mà không giải thích thần học thêm.
