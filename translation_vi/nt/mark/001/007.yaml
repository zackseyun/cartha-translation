  source_fidelity: 'Bản dịch giữ đúng cấu trúc và nội dung Hy Lạp: động từ chưa hoàn thành ἐκήρυσσεν được diễn đạt bằng “rao truyền”, lời dẫn λέγων được chuyển tự nhiên bằng “rằng”, và ἔρχεται được giữ sắc thái hiện tại qua “đang đến”. “Đấng mạnh hơn tôi ... sau tôi” phản ánh đúng so sánh ὁ ἰσχυρότερός μου và tính mở về không gian/thời gian của ὀπίσω μου. Mệnh đề tự hạ “Tôi không xứng đáng cúi xuống mà tháo quai dép của Ngài” truyền đạt chính xác ἱκανός, κύψας và λῦσαι τὸν ἱμάντα τῶν ὑποδημάτων αὐτοῦ.'
