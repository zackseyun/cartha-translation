source:
  edition: SBLGNT
  text: καὶ ἐκήρυσσεν λέγων· Ἔρχεται ὁ ἰσχυρότερός μου ὀπίσω μου, οὗ οὐκ εἰμὶ ἱκανὸς κύψας λῦσαι τὸν ἱμάντα τῶν ὑποδημάτων αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/007.yaml
  text: And he was proclaiming[a], saying, “The one stronger than I is coming after me[c][b], of whom I am not worthy to stoop down and untie the strap of his sandals.”
translation:
  language: vi
  text: 'Ông rao truyền rằng: “Đấng mạnh hơn tôi đang đến sau tôi. Tôi không xứng đáng[a] cúi xuống mà tháo quai dép của Ngài.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “không đủ tư cách” hoặc “không đủ khả năng”; trong ngữ cảnh này, cách nói nhấn mạnh sự bất xứng sâu xa của người nói trước Đấng đang đến.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκήρυσσεν
  choice: rao truyền
  rationale: Thì chưa hoàn thành gợi hành động đang diễn ra hoặc lặp lại; “rao truyền” giữ sắc thái công khai của lời công bố mà vẫn tự nhiên trong tiếng Việt.
- source_word: λέγων
  choice: rằng
  rationale: Dùng cách dẫn lời tự nhiên trong tiếng Việt, tránh lặp ý không cần thiết như “rao truyền và nói rằng”.
- source_word: Ἔρχεται
  choice: đang đến
  rationale: Diễn đạt tính hiện tại và cảm giác sự việc sắp xảy đến của động từ Hy Lạp.
- source_word: ὁ ἰσχυρότερός μου
  choice: Đấng mạnh hơn tôi
  rationale: Tính từ so sánh có mạo từ được dùng như danh từ. “Mạnh hơn” giữ nghĩa trực tiếp của ἰσχυρός; “Đấng” phù hợp với cách nói trang trọng về nhân vật sắp đến mà không xác định thêm giáo lý ngoài câu.
- source_word: ὀπίσω μου
  choice: sau tôi
  rationale: Giữ được cả sắc thái thứ tự thời gian lẫn vị trí theo sau vốn có thể hiện diện trong cụm Hy Lạp.
- source_word: ἱκανὸς
  choice: xứng đáng
  rationale: Trong lời tự hạ mình trước một người cao trọng hơn, “xứng đáng” truyền đạt ý phù hợp hơn là chỉ nói đến khả năng thực hiện hành động; các nghĩa “đủ tư cách/đủ khả năng” được ghi ở chú thích.
- source_word: κύψας
  choice: cúi xuống mà
  rationale: Diễn tả động tác cúi người đi kèm và dẫn vào việc tháo quai dép, theo trật tự tự nhiên trong tiếng Việt.
- source_word: λῦσαι τὸν ἱμάντα
  choice: tháo quai
  rationale: “Tháo” là động từ tự nhiên đối với dây hoặc quai buộc; “quai” chỉ phần dây da giữ dép.
- source_word: τῶν ὑποδημάτων αὐτοῦ
  choice: dép của Ngài
  rationale: “Dép” phù hợp với loại giày dép trong bối cảnh cổ đại; đại từ kính trọng giữ văn phong trang nghiêm.
theological_decisions:
- issue: Mức độ tự hạ mình trong lời của Giăng
  choice: Tôi không xứng đáng ... tháo quai dép
  alternative: Tôi không đủ tư cách/không đủ khả năng ... tháo quai dép
  rationale: Ngữ cảnh đối chiếu địa vị của Giăng với Đấng đang đến khiến “xứng đáng” phù hợp, nhưng chú thích vẫn bảo lưu phạm vi nghĩa về sự đầy đủ hoặc tư cách của ἱκανός.
- issue: Ý nghĩa của ὀπίσω μου
  choice: đang đến sau tôi
  alternative: đang đến đằng sau tôi
  rationale: “Sau tôi” tự nhiên và bảo lưu khả năng chỉ thứ tự xuất hiện lẫn hình ảnh theo sau, không buộc câu chỉ mang nghĩa không gian hay thời gian.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Câu dẫn được rút gọn tự nhiên bằng “rằng”; nhịp câu trực tiếp và giữ nguyên hình ảnh cúi xuống tháo quai dép.
