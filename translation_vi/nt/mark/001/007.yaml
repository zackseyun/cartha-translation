  terminology: “Rao truyền”, “Đấng mạnh hơn”, “xứng đáng”, “quai dép” phù hợp văn cảnh Kinh Thánh và vẫn dễ hiểu trong tiếng Việt hiện đại. Cách xưng “Ngài” phù hợp với sắc thái tôn kính rõ ràng trong lời tự hạ của người nói, không thêm một khẳng định giáo lý cụ thể. Chú thích cho “xứng đáng” bảo lưu hợp lý các khả năng nghĩa của ἱκανός.
