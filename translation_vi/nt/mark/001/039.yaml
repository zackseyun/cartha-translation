source:
  edition: SBLGNT
  text: καὶ ⸀ἦλθεν κηρύσσων ⸂εἰς τὰς συναγωγὰς⸃ αὐτῶν εἰς ὅλην τὴν Γαλιλαίαν καὶ τὰ δαιμόνια ἐκβάλλων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/039.yaml
  text: And he went throughout all Galilee[a], preaching in their synagogues and casting out demons.
translation:
  language: vi
  text: Ngài đi khắp miền Ga-li-lê[a], rao giảng trong các hội đường của họ và đuổi quỷ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Ngài đến, rao giảng trong các hội đường của họ khắp miền Ga-li-lê và đuổi quỷ.” Động từ Hy Lạp có thể được dịch là “đến,” nhưng trong văn cảnh, rất có thể từ này mô tả việc Ngài đi lưu động khắp vùng.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθεν
  choice: đi khắp
  rationale: Động từ có thể mang nghĩa “đến,” nhưng trong văn cảnh, cùng với cụm chỉ toàn miền Ga-li-lê và các phân từ, diễn tả việc Chúa Giê-su đi lưu động khắp vùng.
- source_word: κηρύσσων
  choice: rao giảng
  rationale: Diễn đạt hành động công khai loan báo sứ điệp, tự nhiên trong bối cảnh hội đường.
- source_word: εἰς τὰς συναγωγὰς αὐτῶν
  choice: trong các hội đường của họ
  rationale: Dù εἰς thường chỉ hướng đi vào, tại đây có thể chỉ nơi diễn ra hoạt động; “trong” là cách nói tự nhiên trong tiếng Việt. “Của họ” giữ lại αὐτῶν.
- source_word: εἰς ὅλην τὴν Γαλιλαίαν
  choice: khắp miền Ga-li-lê
  rationale: Chuyển tải phạm vi di chuyển bao trùm toàn vùng và phản ánh ý nghĩa của ὅλην mà không khiến câu tiếng Việt nặng nề.
- source_word: τὰ δαιμόνια
  choice: quỷ
  rationale: Danh từ chỉ các hữu thể tà linh; “quỷ” là từ tương đương trực tiếp, phổ thông và tự nhiên trong tiếng Việt.
- source_word: ἐκβάλλων
  choice: đuổi
  rationale: Trong ngữ cảnh trừ quỷ, ἐκβάλλω có nghĩa đuổi hoặc trục xuất; “đuổi quỷ” là cách diễn đạt rõ ràng, thông dụng.
theological_decisions:
- issue: Bản chất của δαιμόνια
  choice: Dịch là “quỷ,” theo nghĩa thông thường về các hữu thể tà linh có tính ngôi vị.
  alternative: các tà linh
  rationale: “Quỷ” là từ tương đương trực tiếp và không thêm một khẳng định giáo lý nào vượt quá cách bản văn trình bày quyền năng của Chúa Giê-su trên chúng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” để quy chiếu Chúa Giê-su; “hội đường” và “rao giảng” là các thuật ngữ Kinh Thánh quen thuộc nhưng vẫn tự nhiên trong tiếng Việt hiện đại.
