revisions:
- from: 'Đức Chúa Jêsus quở trách nó rằng: “Im đi[a], và ra khỏi người này!”'
  to: 'Giê-su quở trách nó, nói rằng: “Hãy im đi[a], và ra khỏi người ấy!”'
  rationale: 'Bản sửa ưu tiên nguyên văn Hy Lạp: giữ “quở trách” cho ἐπετίμησεν, dùng “nó” cho tà linh được trực tiếp nói với, và dùng “người ấy” cho αὐτοῦ là người bị tà linh chiếm ngự. Tước hiệu không có trong câu nguồn được bỏ, chính tả tên riêng được hiện đại hóa, và chú thích được chỉnh cho tự nhiên hơn mà vẫn nêu hình ảnh nghĩa đen của Φιμώθητι.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T07:38:50Z'
review_pass:
  verdict: revise
  source_fidelity: 'Cần sửa danh xưng “Đức Chúa Jêsus”: nguyên văn chỉ có tên ὁ Ἰησοῦς, không có tước hiệu “Chúa”. “Người này” cũng thêm sắc thái chỉ định không có trong αὐτοῦ; “người ấy” giữ quy chiếu ngữ cảnh mà không thêm sắc thái. Mệnh lệnh “Hãy im đi!” truyền đạt đúng lực ngôn hành của Φιμώθητι; chú thích cần diễn đạt nghĩa đen tự nhiên hơn.'
  naturalness: Bản sửa dùng chính tả hiện đại “Giê-su”, câu văn ngắn gọn và trang trọng. “Ra khỏi người ấy” rõ nghĩa, tự nhiên, và tránh lặp “nó” dễ gây mơ hồ.
  terminology: “Quở trách” phù hợp với ἐπετίμησεν. “Nó” có thể chỉ tà linh trong tiếng Việt và giúp phân biệt với người bị ám. Không nên thêm tước hiệu thần học không hiện diện trong câu Hy Lạp.
  issues:
  - severity: medium
    issue: “Đức Chúa Jêsus” thêm tước hiệu “Chúa” và dùng chính tả tên riêng truyền thống, không phải hiện đại.
    rationale: SBLGNT viết ὁ Ἰησοῦς, chỉ nêu tên Giê-su trong câu này. Bản dịch nên không thêm tước hiệu không có trong nguồn; “Giê-su” là dạng chính tả hiện đại chuẩn.
  - severity: low
    issue: “người này” thêm sắc thái chỉ định.
    rationale: ἐξ αὐτοῦ nghĩa là “ra khỏi người ấy/anh ấy”; “này” không được đánh dấu trong nguyên văn. “Người ấy” vẫn làm rõ người là đối tượng bị tà linh chiếm ngự.
  - severity: low
    issue: Chú thích “Hãy bị bịt mõm” không tự nhiên và không phản ánh tốt hình thức mệnh lệnh bị động trong tiếng Việt.
    rationale: “Bịt miệng” là cách diễn đạt tự nhiên hơn cho hình ảnh nghĩa đen của φιμόω trong ngữ cảnh ra lệnh im lặng.
  revised_text: 'Giê-su quở trách nó, nói rằng: “Hãy im đi[a], và ra khỏi người ấy!”'
  revised_footnotes:
  - marker: a
    text: 'Hay sát nghĩa hơn: “Hãy bị bịt miệng.”'
    reason: lexical_alternative
  revision_rationale: 'Bản sửa ưu tiên nguyên văn Hy Lạp: giữ “quở trách” cho ἐπετίμησεν, dùng “nó” cho tà linh được trực tiếp nói với, và dùng “người ấy” cho αὐτοῦ là người bị tà linh chiếm ngự. Tước hiệu không có trong câu nguồn được bỏ, chính tả tên riêng được hiện đại hóa, và chú thích được chỉnh cho tự nhiên hơn mà vẫn nêu hình ảnh nghĩa đen của Φιμώθητι.'
