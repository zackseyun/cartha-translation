source:
  edition: SBLGNT
  text: καὶ ἐπετίμησεν αὐτῷ ὁ Ἰησοῦς λέγων· Φιμώθητι καὶ ἔξελθε ἐξ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/025.yaml
  text: And Jesus rebuked him[a], saying, “Be silent, and come out of him!”
translation:
  language: vi
  text: 'Giê-su quở trách nó, nói rằng: “Hãy im đi[a], và ra khỏi người ấy!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay sát nghĩa hơn: “Hãy bị bịt miệng.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπετίμησεν
  choice: quở trách
  rationale: Động từ này diễn tả lời khiển trách nghiêm khắc, đầy thẩm quyền; “quở trách” tự nhiên trong văn phong Kinh Thánh tiếng Việt mà không làm yếu sắc thái.
- source_word: αὐτῷ
  choice: nó
  rationale: Đại từ chỉ tà linh ô uế đang nói qua người đàn ông. “Nó” phân biệt tà linh với người bị ám, đồng thời phù hợp cách quy chiếu tự nhiên trong tiếng Việt.
- source_word: λέγων
  choice: rằng
  rationale: Phân từ hiện tại giới thiệu nội dung lời quở trách; “rằng” nối trực tiếp và tự nhiên với lời nói theo sau.
- source_word: Φιμώθητι
  choice: Im đi
  rationale: Nghĩa đen liên quan đến việc bịt mõm, nhưng trong mệnh lệnh ở đây có nghĩa là bắt phải im tiếng. “Im đi” giữ được tính ngắn gọn và mạnh mẽ.
- source_word: ἔξελθε
  choice: ra
  rationale: Trong bối cảnh trục xuất tà linh, động từ chỉ chuyển động từ bên trong ra ngoài; “ra” là mệnh lệnh trực tiếp, tự nhiên.
- source_word: ἐξ αὐτοῦ
  choice: khỏi người này
  rationale: Giới từ ἐξ diễn tả chuyển động ra khỏi bên trong người đàn ông. “Khỏi người này” làm rõ rằng đại từ Hy Lạp ở đây chỉ người bị tà linh ám, tránh sự mơ hồ do hai đại từ cùng có thể dịch là “nó”.
theological_decisions:
- issue: Đối tượng bị Đức Chúa Jêsus quở trách
  choice: Đức Chúa Jêsus trực tiếp nói với tà linh ô uế, không phải với người đàn ông.
  alternative: Hiểu người đàn ông là đối tượng trực tiếp của lời quở trách.
  rationale: Mệnh lệnh “ra khỏi người này” cho thấy đối tượng được nói với là tà linh, còn “người này” là người bị nó chiếm ngự. Cách dịch duy trì sự phân biệt của trình thuật mà không thêm khẳng định giáo lý ngoài văn bản.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu mệnh lệnh ngắn, mạnh, phản ánh sắc thái đầy thẩm quyền của nguyên văn. Danh xưng “Đức Chúa Jêsus” được dùng theo phong cách tiếng Việt Tin Lành truyền thống; nếu quy chuẩn toàn bộ ấn bản chọn “Chúa Giê-su,” có thể đồng bộ hóa mà không đổi nghĩa.
