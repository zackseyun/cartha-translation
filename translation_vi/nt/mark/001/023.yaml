  - severity: medium
    issue: «Tà linh» thêm nghĩa vào πνεύμα ἀκάθαρτον.
    rationale: Nguyên văn xác định linh ấy là «ô uế»; «tà» đưa thêm nét nghĩa ác/tà không được nêu bằng từ riêng trong câu. «Linh ô uế» sát nguồn và nhất quán hơn.
