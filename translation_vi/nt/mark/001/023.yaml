  verdict: revise
  source_fidelity: Bản thảo giữ được trật tự và ý chính của câu, kể cả đại từ «của họ» và dấu phẩy nối sang câu 24. Tuy nhiên, «Ngay lúc ấy» thường chỉ thời điểm “lúc đó”, không diễn đạt đầy đủ lực kể chuyện tức khắc của εὐθύς. «Tà linh» thêm nét nghĩa “tà/ác” không có trong tính từ ἀκάθαρτος, vốn được dịch trực tiếp là «ô uế».
  naturalness: «Lập tức» tự nhiên, trang trọng và phản ánh nhịp kể đặc trưng của Mác. «Mang một linh ô uế» là cách diễn đạt tiếng Việt có thể hiểu được, tránh cách dịch quá sát chữ nhưng khó hiểu là «ở trong một linh ô uế», đồng thời không mở rộng thành «bị ám».
  terminology: Dùng «linh ô uế» bảo lưu thuật ngữ πνεῦμα ἀκάθαρτον mà không thêm đánh giá «tà». «Kêu lên» là cách dịch tự nhiên của ἀνέκραξεν. «Một người» có thể giữ trong tiếng Việt hiện đại; dù ἄνθρωπος có dạng giống đực, từ này không nhất thiết đòi hỏi thêm «đàn ông» trong bản dịch tiếng Việt ở đây.
