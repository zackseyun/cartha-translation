base_translation:
  language: en
  yaml_path: translation/nt/mark/001/023.yaml
  text: And immediately there was in their synagogue a man with an unclean spirit[a], and he cried out[b],
translation:
  language: vi
  text: Lập tức, trong hội đường của họ có một người mang một linh ô uế[a], và người ấy kêu lên,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sát nghĩa hơn: “ở trong một linh ô uế.” Một số bản dịch diễn giải là “bị một linh ô uế ám.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθὺς
  choice: ngay lúc ấy
  rationale: Diễn đạt tự nhiên nhịp kể nhanh đặc trưng của Mác; trong ngữ cảnh này, cụm từ cho biết sự việc xảy ra tức khắc.
- source_word: ἦν
  choice: có
  rationale: Động từ εἰμί được dùng theo nghĩa hiện hữu; cấu trúc tiếng Việt “có một người” vừa tự nhiên vừa sát ý.
- source_word: συναγωγῇ αὐτῶν
  choice: hội đường của họ
  rationale: “Hội đường” là cách gọi quen thuộc cho nơi hội họp và thờ phượng của người Do Thái; “của họ” bảo lưu đại từ αὐτῶν.
- source_word: ἄνθρωπος
  choice: một người
  rationale: Trong tiếng Việt, “một người” diễn đạt tự nhiên một cá nhân được đưa vào câu chuyện; ngữ cảnh tiếp theo có thể xác định thêm mà không cần gượng ép giới tính ngữ pháp Hy Lạp.
- source_word: ἐν πνεύματι ἀκαθάρτῳ
  choice: mang tà linh ô uế
  rationale: Giữ mối liên hệ giữa người ấy và linh ô uế nhưng không diễn giải mạnh thành “bị quỷ ám.” Động từ “mang” tự nhiên hơn lối dịch từng chữ “ở trong” trong tiếng Việt.
- source_word: ἀκαθάρτῳ
  choice: ô uế
  rationale: Bảo lưu sắc thái ô uế về phương diện nghi lễ và đạo đức; “tà linh” đồng thời cho thấy đây là một linh gây hại, còn “ô uế” phản ánh trực tiếp tính từ Hy Lạp.
- source_word: ἀνέκραξεν
  choice: người ấy kêu lớn
  rationale: Động từ chỉ một tiếng kêu lớn. Lặp “người ấy” giúp tránh khả năng người đọc hiểu chủ thể là tà linh, trong khi hình thái động từ Hy Lạp tự nó không nêu lại danh từ.
theological_decisions:
- issue: Cách diễn đạt tình trạng liên hệ với tà linh trong ἐν πνεύματι ἀκαθάρτῳ
  choice: mang tà linh ô uế
  alternative: ở trong một linh ô uế; bị tà linh ô uế ám
  rationale: Nguyên văn dùng giới từ ἐν, theo nghĩa đen là “trong,” nhưng đây là một cách nói khó chuyển thẳng sang tiếng Việt. “Mang” truyền đạt quan hệ được nêu mà không mở rộng thành khái niệm “bị ám,” vốn diễn giải cụ thể hơn lời Hy Lạp.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “hội đường,” “tà linh,” và “ô uế” để giữ sắc thái Kinh Thánh mà không trở nên cổ kính. Dấu phẩy cuối câu được giữ vì lời kêu tiếp diễn sang câu kế tiếp.
