  text: Καὶ πρωῒ ἔννυχα λίαν ἀναστὰς ἐξῆλθεν καὶ ἀπῆλθεν εἰς ἔρημον τόπον κἀκεῖ προσηύχετο.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/035.yaml
  text: And very early[a], while it was still dark, he got up, went out, and went away to a desolate place, and there he was praying.
translation:
  language: vi
  text: Sáng sớm tinh mơ, khi trời vẫn còn tối, Ngài thức dậy, đi ra rồi đi đến một nơi hoang vắng[a]; và tại đó Ngài đang cầu nguyện.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “một nơi vắng vẻ” hoặc “một nơi thanh vắng.” Từ Hy Lạp có thể chỉ một nơi không có người ở, hoang vắng hoặc có tính chất như vùng hoang dã.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πρωῒ ἔννυχα λίαν
  choice: Sáng sớm tinh mơ, khi trời vẫn còn tối
  rationale: Diễn đạt tự nhiên sự kết hợp của πρωῒ và λίαν về thời điểm rất sớm, đồng thời giữ ý của ἔννυχα rằng bóng tối vẫn còn.
- source_word: ἀναστὰς
  choice: Ngài thức dậy
  rationale: Phân từ bất định chỉ hành động xảy ra trước các động từ chính; cách dịch này tự nhiên và giữ đúng trình tự kể chuyện.
- source_word: ἐξῆλθεν καὶ ἀπῆλθεν
  choice: đi ra rồi đi đến
  rationale: 'Giữ riêng hai động tác: rời khỏi chỗ đang ở và tiếp tục đi tới một địa điểm khác, thay vì gộp chúng thành một động từ.'
- source_word: εἰς ἔρημον τόπον
  choice: đến một nơi hoang vắng
  rationale: ἔρημος mô tả nơi ít hoặc không có người, có thể mang sắc thái hoang vu hay vắng vẻ; “nơi hoang vắng” giữ được đặc tính của địa điểm mà không nhất thiết biến nó thành một vùng hoang mạc.
- source_word: κἀκεῖ
  choice: tại đó
  rationale: Chuyển tải gọn và tự nhiên từ ghép καὶ ἐκεῖ, đồng thời nối hành động cầu nguyện với địa điểm vừa nhắc đến.
- source_word: προσηύχετο
  choice: Ngài đang cầu nguyện
  rationale: Thì chưa hoàn thành diễn tả hành động đang tiếp diễn trong quá khứ; “đang cầu nguyện” phản ánh rõ sắc thái kéo dài này.
theological_decisions:
- issue: Trọng tâm tường thuật về việc Chúa Giê-xu cầu nguyện
  choice: Chỉ thuật lại việc Ngài đi đến nơi hoang vắng và cầu nguyện, không thêm lời giải thích thần học.
  alternative: Nhấn mạnh đây là khuôn mẫu cho môn đồ hoặc diễn giải ý nghĩa Kitô học của việc Ngài cầu nguyện.
  rationale: Câu Hy Lạp tường thuật trực tiếp hành động; bản dịch không nên đưa những kết luận thần học không được phát biểu vào chính câu văn.
translation_notes:
  register: Dùng tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. “Sáng sớm tinh mơ” diễn đạt tự nhiên mức độ rất sớm; “Ngài” duy trì cách xưng hô tôn kính phù hợp văn phong Kinh Thánh tiếng Việt. Dấu chấm phẩy giúp phân biệt hành trình đến nơi ấy với hành động cầu nguyện đang tiếp diễn tại đó.
