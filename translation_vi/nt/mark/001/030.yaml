base_translation:
  language: en
  yaml_path: translation/nt/mark/001/030.yaml
  text: Simon’s mother-in-law was lying sick with a fever[b][a], and immediately they told him about her.
translation:
  language: vi
  text: Mẹ vợ của Si-môn đang nằm sốt; lập tức họ nói với Đức Chúa Jêsus về bà.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn dùng thì hiện tại trong lời kể: “họ nói với Ngài về bà.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: πενθερὰ
  choice: mẹ vợ
  rationale: Danh từ chỉ mẹ của người phối ngẫu; trong ngữ cảnh nói về Si-môn, “mẹ vợ” là cách diễn đạt tự nhiên và chính xác.
- source_word: κατέκειτο
  choice: đang nằm
  rationale: Thì chưa hoàn thành diễn tả trạng thái kéo dài; “đang nằm” giữ được sắc thái tiếp diễn mà không diễn giải quá mức là liệt giường.
- source_word: πυρέσσουσα
  choice: sốt
  rationale: Phân từ diễn tả việc đang bị sốt; kết hợp “đang nằm sốt” ngắn gọn, tự nhiên trong tiếng Việt và thể hiện rõ tình trạng bệnh.
- source_word: εὐθὺς
  choice: lập tức
  rationale: Giữ nghĩa hành động xảy ra ngay và nhịp kể đặc trưng của Mác.
- source_word: λέγουσιν
  choice: người ta nói
  rationale: Giữ thì hiện tại lịch sử của nguyên văn để tạo nét kể sống động; chủ ngữ số nhiều không được xác định nên “người ta” phù hợp hơn việc bổ sung một nhóm cụ thể.
- source_word: αὐτῷ
  choice: với Đức Chúa Jêsus
  rationale: Đại từ nam số ít quy chiếu về Đức Chúa Jêsus trong ngữ cảnh trước đó; nêu rõ tên giúp câu tiếng Việt tự nhiên và tránh đại từ mơ hồ.
- source_word: περὶ αὐτῆς
  choice: về bà
  rationale: περί với sở hữu cách mang nghĩa “về”; “bà” là đại từ kính trọng tự nhiên dành cho mẹ vợ của Si-môn.
- source_word: δὲ
  choice: không dịch thành từ riêng
  rationale: δέ là liên từ nhẹ nối tiếp diễn biến; trong tiếng Việt, sự chuyển tiếp đã rõ qua trật tự câu nên không cần thêm “bấy giờ” hoặc một từ chỉ thời gian không có trong nguyên văn.
