  terminology: “Mẹ vợ của Si-môn,” “Đức Chúa Jêsus,” và “bà” nhất quán với văn phong Kinh Thánh Việt ngữ trang trọng vừa phải. Không có vấn đề thần học hoặc tên riêng cần điều chỉnh.
