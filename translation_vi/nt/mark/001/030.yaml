  verdict: revise
  source_fidelity: 'Bản dịch truyền đạt đúng các yếu tố chính: mẹ vợ của Si-môn, trạng thái đang nằm vì sốt, tính tức thời, và việc báo cho Chúa Jêsus. Tuy nhiên, “người ta” dễ gợi một chủ ngữ chung chung/vô nhân xưng, trong khi động từ số nhiều của tiếng Hy Lạp chỉ một nhóm người không được nêu rõ; “họ” giữ đúng sự không xác định ấy hơn. Thì hiện tại lịch sử của λέγουσιν được ghi nhận thích đáng trong chú thích.'
