source:
  edition: SBLGNT
  text: ἐγένετο Ἰωάννης ⸀ὁ βαπτίζων ἐν τῇ ⸀ἐρήμῳ κηρύσσων βάπτισμα μετανοίας εἰς ἄφεσιν ἁμαρτιῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/004.yaml
  text: John the Baptist appeared in the wilderness[a], proclaiming a baptism of repentance for the forgiveness of sins.
translation:
  language: vi
  text: Giăng Báp-tít[a] xuất hiện trong hoang mạc, rao giảng phép báp-têm về sự ăn năn để được tha tội.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “Giăng, người làm phép báp-têm, xuất hiện trong hoang mạc…”
    reason: Phân từ có mạo từ trong tiếng Hy Lạp có thể được diễn đạt rõ hơn như một danh xưng chỉ vai trò của Giăng.
lexical_decisions:
- source_word: ἐγένετο
  choice: xuất hiện
  rationale: Trong lối kể chuyện của Mác, động từ này đưa một nhân vật vào bối cảnh; “xuất hiện” diễn đạt tự nhiên hơn cách dịch sát chữ như “trở nên”.
- source_word: Ἰωάννης
  choice: Giăng
  rationale: Dùng dạng tên riêng đã quen thuộc và dễ nhận biết trong truyền thống Kinh Thánh tiếng Việt.
- source_word: ὁ βαπτίζων
  choice: Báp-tít[a]
  rationale: Dùng danh xưng quen thuộc trong câu chính; chú thích nêu cách diễn đạt rõ chức năng hơn là “người làm phép báp-têm”.
- source_word: ἐν τῇ ἐρήμῳ
  choice: trong hoang mạc
  rationale: “Hoang mạc” chỉ vùng hoang vắng, không nhất thiết là sa mạc đầy cát, đồng thời giữ sắc thái địa lý và Kinh Thánh của từ Hy Lạp.
- source_word: κηρύσσων
  choice: rao giảng
  rationale: Diễn đạt hành động công bố công khai với sắc thái của người truyền tin, đồng thời tự nhiên trong tiếng Việt.
- source_word: βάπτισμα
  choice: phép báp-têm
  rationale: Đây là thuật ngữ quen thuộc, chính xác và dễ nhận biết đối với nghi thức được nói đến.
- source_word: μετανοίας
  choice: của lòng ăn năn
  rationale: Giữ quan hệ sở thuộc/mô tả của nguyên văn và diễn đạt chiều kích luân lý, tâm linh của μετάνοια mà không thu hẹp thành việc chỉ đổi ý.
- source_word: εἰς ἄφεσιν ἁμαρτιῶν
  choice: để được tha tội
  rationale: Diễn đạt tự nhiên hướng đích hoặc kết quả của εἰς ἄφεσιν, giữ số nhiều theo nghĩa tập hợp trong tiếng Việt mà không áp đặt cơ chế thần học cụ thể.
theological_decisions:
- issue: Mối quan hệ giữa phép báp-têm, lòng ăn năn và sự tha tội
  choice: “phép báp-têm của lòng ăn năn để được tha tội”
  alternative: “phép báp-têm tượng trưng cho lòng ăn năn” hoặc “phép báp-têm đem lại sự tha tội qua lòng ăn năn”
  rationale: Cấu trúc Hy Lạp liên kết ba yếu tố nhưng không buộc bản dịch phải xác định phép báp-têm có tính phương tiện, biểu tượng hay tuyên nhận. Cách dịch giữ nguyên sức căng thần học của câu.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. “Giăng Báp-tít” giữ danh xưng quen thuộc; chú thích làm rõ ý nghĩa chức năng của danh xưng. Cấu trúc câu bám sát nguyên văn mà vẫn trôi chảy.
