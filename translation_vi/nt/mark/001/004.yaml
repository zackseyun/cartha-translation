  terminology: “Giăng Báp-tít,” “hoang mạc,” “rao giảng,” và “phép báp-têm” nhất quán với cách dùng Kinh Thánh tiếng Việt. Danh xưng “Báp-tít” được chú thích bằng cách diễn đạt chức năng “người làm phép báp-têm,” phù hợp với ὁ βαπτίζων.
