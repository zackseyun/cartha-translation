  text: καὶ ⸀εὐθὺς ἐκάλεσεν αὐτούς. καὶ ἀφέντες τὸν πατέρα αὐτῶν Ζεβεδαῖον ἐν τῷ πλοίῳ μετὰ τῶν μισθωτῶν ἀπῆλθον ὀπίσω αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/020.yaml
  text: And immediately he called them[a], and leaving their father Zebedee in the boat with the hired workers, they went after him.
translation:
  language: vi
  text: Ngay lập tức, Ngài gọi họ. Họ để cha mình là Xê-bê-đê lại trong thuyền cùng với những người làm thuê rồi đi theo Ngài.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “đi phía sau Ngài.” Cụm từ Hy Lạp có thể chỉ cả việc di chuyển phía sau một người lẫn việc bắt đầu theo người ấy làm môn đồ.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθὺς
  choice: ngay lập tức
  rationale: Giữ rõ sắc thái thời gian khẩn trương, một nét đặc trưng trong lối kể của Mác, đồng thời tự nhiên trong tiếng Việt hiện đại.
- source_word: ἐκάλεσεν
  choice: gọi
  rationale: Diễn đạt trực tiếp hành động gọi, không tăng sắc thái mệnh lệnh như “triệu gọi” hay làm nhẹ đi như “mời”.
- source_word: ἀφέντες
  choice: để ... lại
  rationale: Thể hiện hành động xảy ra trước hành động chính và phù hợp với bối cảnh họ rời thuyền; tránh sắc thái tiêu cực quá mạnh của “bỏ rơi”.
- source_word: πατέρα αὐτῶν Ζεβεδαῖον
  choice: cha mình là Xê-bê-đê
  rationale: Diễn đạt tự nhiên quan hệ sở hữu và giữ tên riêng theo cách phiên âm quen thuộc trong tiếng Việt.
- source_word: πλοίῳ
  choice: thuyền
  rationale: Phù hợp với bối cảnh đánh cá tại Ga-li-lê hơn “tàu”.
- source_word: μισθωτῶν
  choice: những người làm thuê
  rationale: Chỉ những người làm việc để nhận tiền công mà không áp đặt mô hình lao động hiện đại như “nhân viên”.
- source_word: ἀπῆλθον ὀπίσω αὐτοῦ
  choice: đi theo Ngài
  rationale: Trong tiếng Việt, “đi theo” có thể vừa chỉ chuyển động theo sau một người vừa gợi việc trở thành môn đồ, nhờ đó giữ được hai lớp nghĩa của cụm từ Hy Lạp.
theological_decisions:
- issue: Sắc thái môn đồ trong ὀπίσω αὐτοῦ
  choice: đi theo Ngài
  alternative: đi phía sau Ngài
  rationale: “Đi theo” giữ được cả hành động di chuyển trong câu chuyện lẫn hàm ý khởi đầu đời sống môn đồ, không buộc người đọc chỉ chọn một trong hai nghĩa.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” để chỉ Chúa Giê-su theo lối xưng hô tôn kính phổ biến; câu được chia làm hai để tự nhiên trong tiếng Việt mà vẫn giữ trình tự hành động của nguyên văn.
