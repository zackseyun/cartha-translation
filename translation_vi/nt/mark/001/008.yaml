  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸀ἐγὼ ἐβάπτισα ⸀ὑμᾶς ὕδατι, αὐτὸς δὲ βαπτίσει ὑμᾶς ⸀ἐν πνεύματι ἁγίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/008.yaml
  text: I baptized you with water[a], but he will baptize you with the Holy Spirit.
translation:
  language: vi
  text: Tôi đã làm phép báp-têm cho anh em bằng nước, nhưng chính người ấy sẽ làm phép báp-têm cho anh em bằng Đức Thánh Linh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “trong Đức Thánh Linh.” Giới từ Hy Lạp ở đây có thể được hiểu theo cả hai cách.'
    reason: Giữ lại sự đa nghĩa thật sự của ἐν giữa phương tiện (“bằng”) và phạm vi (“trong”).
lexical_decisions:
- source_word: ἐγὼ
  choice: Tôi
  rationale: Giữ đại từ được nêu rõ trong tiếng Hy Lạp để làm nổi bật sự tương phản với αὐτός ở vế sau.
- source_word: ἐβάπτισα
  choice: đã làm phép báp-têm
  rationale: Giữ nghĩa nghi lễ quen thuộc của βαπτίζω và thể quá khứ, không thu hẹp từ này thành một phương thức cụ thể như “dìm xuống”.
- source_word: ὑμᾶς
  choice: anh em
  rationale: Diễn đạt đại từ ngôi thứ hai số nhiều bằng cách xưng hô tự nhiên, trang trọng trong văn cảnh lời giảng công khai.
- source_word: ὕδατι
  choice: bằng nước
  rationale: Thể hiện cách dùng phương tiện của cách dữ liệu; “bằng nước” tự nhiên trong tiếng Việt và tạo thế song song với vế sau.
- source_word: αὐτὸς
  choice: chính Đấng ấy
  rationale: “Chính” giữ lực nhấn mạnh và tương phản; “Đấng ấy” chỉ nhân vật quyền năng hơn vừa được Giăng nhắc đến mà không thêm tên vào câu.
- source_word: δὲ
  choice: còn
  rationale: Đánh dấu sự tương phản rõ giữa việc Giăng làm và việc Đấng sắp đến sẽ làm, đồng thời tự nhiên hơn “nhưng” trong cấu trúc đối chiếu này.
- source_word: βαπτίσει
  choice: sẽ làm phép báp-têm
  rationale: Giữ thì tương lai và sự lặp lại từ ngữ với ἐβάπτισα.
- source_word: ἐν
  choice: bằng
  rationale: Trong kết cấu này, ἐν với cách dữ liệu có thể chỉ phương tiện hoặc phạm vi. “Bằng” tạo câu tiếng Việt tự nhiên và giữ sự song song với “bằng nước”; khả năng dịch “trong” được ghi ở chú thích.
- source_word: πνεύματι ἁγίῳ
  choice: Đức Thánh Linh
  rationale: Cụm từ trong văn cảnh này tự nhiên chỉ Thánh Linh của Đức Chúa Trời; cách gọi này trang trọng, quen thuộc và không diễn giải thêm bản chất hay cách thức của phép báp-têm.
theological_decisions:
- issue: πνεύματι ἁγίῳ chỉ Đức Thánh Linh hay một quyền năng thánh phi ngôi vị
  choice: Đức Thánh Linh
  alternative: một linh thánh; linh thánh
  rationale: Trong văn cảnh Mác, lời đối chiếu của Giăng tự nhiên hướng đến Thánh Linh của Đức Chúa Trời. Bản dịch không khai triển thêm những điều câu này không nói.
- issue: Cách hiểu giới từ ἐν trước πνεύματι ἁγίῳ
  choice: bằng Đức Thánh Linh
  alternative: trong Đức Thánh Linh
  rationale: “Bằng” diễn đạt phương tiện và giữ thế song song với nước; “trong” có thể diễn đạt phạm vi. Vì tiếng Hy Lạp cho phép cả hai sắc thái, phương án kia được giữ trong chú thích.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “làm phép báp-têm” để giữ nội dung nghi lễ cùng mối liên hệ liên văn bản, “chính Đấng ấy” để bảo toàn lực nhấn mạnh của αὐτός, và đặt dấu chú thích ngay sau cụm từ có phương án dịch khác.
