id: MRK.1.15
reference: Mark 1:15
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ λέγων ὅτι Πεπλήρωται ὁ καιρὸς καὶ ἤγγικεν ἡ βασιλεία τοῦ θεοῦ· μετανοεῖτε καὶ πιστεύετε ἐν τῷ εὐαγγελίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/015.yaml
  text: and saying[a], “The time has been fulfilled, and the kingdom of God has drawn near[b]. Repent and believe in the good news.”
translation:
  language: vi
  text: 'và phán: “Thời kỳ đã đạt đến sự trọn vẹn, và vương quốc của Đức Chúa Trời đã đến gần.[a] Hãy ăn năn và tin vào tin mừng.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “quyền cai trị của Đức Chúa Trời đã đến gần.”'
    reason: lexical_alternative
  - marker: b
    text: 'Hay: “tin vào Phúc Âm.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πεπλήρωται
  choice: đã mãn
  rationale: 'Diễn đạt thể hoàn thành: thời kỳ đã đạt đến chỗ trọn vẹn và kết quả ấy hiện vẫn có hiệu lực.'
- source_word: καιρὸς
  choice: thời kỳ
  rationale: Chỉ thời điểm hay giai đoạn quyết định theo chương trình của Đức Chúa Trời, chứ không đơn thuần là thời gian nói chung.
- source_word: ἤγγικεν
  choice: đã đến gần
  rationale: 'Giữ sắc thái thể hoàn thành: việc đến gần đã xảy ra và tình trạng gần kề vẫn hiện hữu.'
- source_word: βασιλεία τοῦ θεοῦ
  choice: vương quốc của Đức Chúa Trời
  rationale: Giữ độ rộng của βασιλεία, có thể bao hàm cả quyền trị vì lẫn lãnh vực chịu sự cai trị, thay vì thu hẹp vào một nghĩa.
- source_word: μετανοεῖτε
  choice: hãy ăn năn
  rationale: Cách diễn đạt ngắn gọn, quen thuộc và trang trọng cho lời kêu gọi thay đổi tâm trí, hướng đi và đời sống.
- source_word: πιστεύετε
  choice: hãy tin
  rationale: Tương ứng trực tiếp với mệnh lệnh Hy Lạp mà không diễn giải quá mức sắc thái tâm lý hay giáo lý.
- source_word: ἐν τῷ εὐαγγελίῳ
  choice: vào tin mừng
  rationale: Dịch nghĩa thông dụng của εὐαγγέλιον bằng tiếng Việt hiện đại; giới từ ἐν sau πιστεύω được diễn đạt tự nhiên là “tin vào”.
- source_word: λέγων
  choice: và phán
  rationale: Nối tiếp mạch thuật chuyện của câu trước; “phán” phù hợp với lời tuyên bố trang trọng của Chúa Giê-su.
theological_decisions:
- issue: Cách dịch βασιλεία τοῦ θεοῦ
  choice: vương quốc của Đức Chúa Trời
  alternative: quyền cai trị của Đức Chúa Trời
  rationale: Bản chính giữ cả chiều kích quyền trị vì lẫn lãnh vực của vương quyền; chú thích nêu nghĩa động mà không áp đặt nghĩa ấy là duy nhất.
- issue: Cách dịch εὐαγγέλιον
  choice: tin mừng
  alternative: Phúc Âm
  rationale: “Tin mừng” dễ hiểu và sát nghĩa gốc; thuật ngữ truyền thống “Phúc Âm” được giữ trong chú thích.
- issue: Lực của μετανοεῖτε καὶ πιστεύετε
  choice: Hãy ăn năn và tin
  alternative: Hãy tiếp tục ăn năn và tin
  rationale: Mệnh lệnh hiện tại có thể gợi hành động liên tục, nhưng dạng mệnh lệnh đơn trong tiếng Việt giữ được tính cấp bách mà không giải thích quá mức thể động từ.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “thời kỳ đã mãn” để giữ sắc thái hoàn tất; dùng “vương quốc” trong bản chính và nêu nghĩa “quyền cai trị” ở chú thích nhằm bảo toàn độ rộng thần học của βασιλεία.
