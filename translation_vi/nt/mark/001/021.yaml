  text: Καὶ εἰσπορεύονται εἰς Καφαρναούμ. καὶ ⸀εὐθὺς τοῖς σάββασιν ⸂ἐδίδασκεν εἰς τὴν συναγωγήν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/021.yaml
  text: And they went into Capernaum, and immediately on the Sabbath he began teaching in the synagogue.
translation:
  language: vi
  text: Rồi họ đi vào Ca-phác-na-um.[a] Ngay vào ngày Sa-bát,[b] Đức Chúa Giê-su giảng dạy trong hội đường.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “họ vào Ca-phác-na-um.” Mác thường dùng thì hiện tại lịch sử để làm lời kể thêm sống động.'
    reason: lexical_alternative
  - marker: b
    text: Nguyên văn Hy Lạp dùng hình thức số nhiều “trong các ngày Sa-bát”, một thành ngữ có thể mang nghĩa “vào ngày Sa-bát”.
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể dịch: “đang giảng dạy”, “bắt đầu giảng dạy” hoặc “đã giảng dạy”; thì vị hoàn Hy Lạp có thể nhấn mạnh hành động đang tiếp diễn hoặc, tùy ngữ cảnh, sự khởi đầu của hành động.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσπορεύονται
  choice: họ đi vào
  rationale: Thì hiện tại lịch sử tạo sắc thái kể chuyện sống động, nhưng tiếng Việt tự nhiên thường không đánh dấu thì; “đi vào” giữ được ý chuyển động vào một nơi mà không buộc phải diễn giải thành quá khứ.
- source_word: Καφαρναούμ
  choice: Ca-phác-na-um
  rationale: Dùng dạng phiên âm quen thuộc trong truyền thống Kinh Thánh tiếng Việt, dễ đọc đối với độc giả phổ thông.
- source_word: εὐθύς
  choice: ngay
  rationale: Diễn đạt rõ tính mau chóng của εὐθύς trong văn kể của Mác, đồng thời kết hợp tự nhiên với cụm thời gian theo sau.
- source_word: τοῖς σάββασιν
  choice: trong ngày Sa-bát
  rationale: Dù hình thức Hy Lạp là số nhiều, đây là lối nói chỉ thời gian thường được hiểu theo nghĩa số ít; “trong ngày Sa-bát” tự nhiên và phù hợp ngữ cảnh.
- source_word: ἐδίδασκεν
  choice: giảng dạy
  rationale: Thì vị hoàn Hy Lạp có thể gợi hành động đang diễn tiến hoặc được nhìn trong tiến trình; tiếng Việt không cần thêm “đã/đang/bắt đầu”, nhờ đó tránh quyết định quá mức một sắc thái còn mơ hồ.
- source_word: συναγωγήν
  choice: hội đường
  rationale: Trong bối cảnh Do Thái, từ này chỉ nơi cộng đồng nhóm họp để thờ phượng và học Kinh Thánh; “hội đường” là cách gọi thông dụng, chính xác.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Đức Chúa Giê-su” để làm rõ chủ thể vốn được ngầm hiểu trong động từ Hy Lạp; chia thành hai câu cho nhịp kể tiếng Việt tự nhiên. Không thêm dấu chỉ thì vào ἐδίδασκεν để giữ độ mở về thể của nguyên văn.
