  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἐθαμβήθησαν ⸀ἅπαντες, ὥστε συζητεῖν ⸂πρὸς ἑαυτοὺς⸃ λέγοντας· Τί ἐστιν τοῦτο; ⸂διδαχὴ καινή⸃· κατ’ ἐξουσίαν καὶ τοῖς πνεύμασι τοῖς ἀκαθάρτοις ἐπιτάσσει, καὶ ὑπακούουσιν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/027.yaml
  text: And they were all amazed[a], so that they discussed among themselves, saying, “What is this? A new teaching with authority! He even commands the unclean spirits, and they obey him.”
translation:
  language: vi
  text: 'Tất cả đều kinh ngạc, đến nỗi họ bàn luận với nhau rằng: “Đây là gì? Một lời dạy mới có thẩm quyền! Người truyền lệnh ngay cả cho các linh ô uế, và chúng vâng lời Người.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể chấm câu: “Đây là gì? Lời dạy mới có thẩm quyền này là gì? Người truyền lệnh ngay cả cho các linh ô uế, và chúng vâng lời Người.” Tiếng Hy Lạp cho phép hiểu cụm “lời dạy mới” gắn trực tiếp hơn với câu hỏi.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐθαμβήθησαν
  choice: đều kinh ngạc
  rationale: Diễn tả việc họ bị choáng ngợp bởi sự kinh ngạc, bằng cách nói tự nhiên mà không cường điệu quá mức.
- source_word: ἅπαντες
  choice: tất cả
  rationale: Giữ sắc thái nhấn mạnh rằng toàn thể những người chứng kiến đều có phản ứng ấy.
- source_word: ὥστε συζητεῖν πρὸς ἑαυτούς
  choice: đến nỗi họ bàn luận với nhau
  rationale: ὥστε với động từ nguyên mẫu chỉ kết quả; συζητεῖν ở đây phù hợp với việc trao đổi, bàn luận, không nhất thiết là tranh cãi.
- source_word: Τί ἐστιν τοῦτο;
  choice: Điều này là gì?
  rationale: Giữ câu hỏi trực tiếp và vẻ sửng sốt của nguyên văn.
- source_word: διδαχὴ καινή
  choice: Một lời dạy mới
  rationale: “Lời dạy” tự nhiên trong tiếng Việt hiện đại và ít mang tính thuật ngữ hệ thống hơn “giáo lý”.
- source_word: κατ’ ἐξουσίαν
  choice: đầy thẩm quyền
  rationale: Diễn đạt phẩm chất có thẩm quyền của lời dạy, đồng thời không tách rời chủ đề quyền năng thể hiện trong mệnh lệnh tiếp theo.
- source_word: τοῖς πνεύμασι τοῖς ἀκαθάρτοις
  choice: các uế linh
  rationale: “Uế linh” bảo lưu ý niệm ô uế của ἀκάθαρτος và là cách gọi ngắn gọn, trang trọng, dễ hiểu trong văn cảnh Kinh Thánh.
- source_word: ἐπιτάσσει
  choice: truyền lệnh
  rationale: Thể hiện một mệnh lệnh có thẩm quyền, phù hợp với trọng tâm ἐξουσία.
- source_word: ὑπακούουσιν αὐτῷ
  choice: chúng vâng lời Người
  rationale: Diễn đạt rõ sự đáp ứng bằng việc tuân phục mệnh lệnh; “Người” duy trì văn phong trang trọng khi nói về Chúa Giê-su.
theological_decisions:
- issue: Quan hệ cú pháp của κατ’ ἐξουσίαν với “lời dạy mới” và động từ “truyền lệnh”
  choice: Gắn trực tiếp với cụm cảm thán “Một lời dạy mới đầy thẩm quyền!”, trong khi câu kế tiếp tiếp tục chứng minh thẩm quyền ấy qua việc truyền lệnh cho các uế linh.
  alternative: Có thể hiểu toàn bộ là câu hỏi “Điều này là gì? Lời dạy mới đầy thẩm quyền này là gì?” hoặc gắn “với thẩm quyền” gần hơn với hành động truyền lệnh.
  rationale: Cú pháp và dấu câu của tiếng Hy Lạp cho phép hơn một cách phân đoạn. Bản dịch chính đọc tự nhiên trong tiếng Việt nhưng chú thích bảo lưu khả năng chấm câu khác, không giải quyết dứt khoát điều nguyên văn còn mở.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ đọc. Dùng “lời dạy” thay vì thuật ngữ nặng tính hệ thống; “uế linh” bảo lưu sắc thái Kinh Thánh của khái niệm ô uế. Dấu chú thích [a] được đặt sau toàn bộ lời trích dẫn vì liên quan đến cách phân đoạn cả câu nói.
