    issue: “các uế linh” không tự nhiên trong tiếng Việt hiện đại.
    rationale: Cụm này ít thông dụng và có thể gây khó hiểu. “Các linh ô uế” là trật tự từ tự nhiên hơn, vẫn dịch chính xác “the unclean spirits.”
  - severity: low
    issue: “đầy thẩm quyền” hơi cường điệu và kém trực tiếp hơn “có thẩm quyền.”
    rationale: κατ’ ἐξουσίαν diễn tả cách thức hay đặc tính hành động/giảng dạy có thẩm quyền; “có thẩm quyền” là cách nói tiếng Việt tự nhiên, không thêm mức độ.
  - severity: low
    issue: “Điều này là gì?” hơi không tự nhiên trong lời thoại.
    rationale: “Đây là gì?” giữ nguyên tính trực tiếp và vẻ kinh ngạc của Τί ἐστιν τοῦτο; trong tiếng Việt tự nhiên hơn.
