  text: And they found him and said to him[a], “Everyone is looking for you.”
translation:
  language: vi
  text: 'Họ tìm thấy Ngài và nói với Ngài: “Mọi người đều đang tìm Ngài[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Tất cả đều đang tìm Ngài.” Động từ Hy Lạp ζητοῦσίν cũng có thể mang nghĩa “đang tìm kiếm”; trong văn cảnh này, có lẽ nói đến việc người ta đang cố tìm gặp Chúa Giê-su.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὗρον
  choice: tìm thấy
  rationale: Động từ ở thì aorist thuật lại kết quả thành công của cuộc tìm kiếm; “tìm thấy” là cách diễn đạt trực tiếp, tự nhiên trong văn kể chuyện.
- source_word: λέγουσιν
  choice: nói
  rationale: Dù nguyên văn dùng hiện tại lịch sử, tiếng Việt tự nhiên có thể dùng “nói” mà không cần đánh dấu thời, vẫn giữ được nhịp kể nhanh của Mác.
- source_word: ὅτι
  choice: dấu hai chấm và lời dẫn trực tiếp
  rationale: ὅτι giới thiệu nội dung lời nói; cấu trúc dấu hai chấm kèm ngoặc kép là cách thể hiện tự nhiên trong tiếng Việt.
- source_word: Πάντες
  choice: Mọi người đều
  rationale: Diễn đạt nghĩa tập thể của “tất cả” trong nhóm người thuộc bối cảnh, không nhất thiết hàm ý toàn thể nhân loại.
- source_word: ζητοῦσίν σε
  choice: đang tìm Ngài
  rationale: Trong mạch truyện, ζητέω chủ yếu chỉ việc người ta cố tìm gặp vị trí của Chúa Giê-su; “đang tìm” tự nhiên hơn “đang tìm kiếm” và vẫn giữ được sắc thái chưa hoàn tất.
- source_word: καὶ
  choice: và
  rationale: Giữ chức năng liên kết đơn giản của καί và nhịp kể liên tục đặc trưng của sách Mác.
- source_word: αὐτὸν / αὐτῷ / σε
  choice: Ngài / Ngài / Ngài
  rationale: Các đại từ lần lượt được chuyển theo chức năng tân ngữ của “tìm thấy,” đối tượng tiếp nhận lời nói và tân ngữ của “tìm”; cách xưng hô “Ngài” trang trọng và rõ quy chiếu đến Chúa Giê-su.
theological_decisions: []
