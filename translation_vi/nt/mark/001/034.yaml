  text: καὶ ἐθεράπευσεν πολλοὺς κακῶς ἔχοντας ποικίλαις νόσοις, καὶ δαιμόνια πολλὰ ἐξέβαλεν, καὶ οὐκ ἤφιεν λαλεῖν τὰ δαιμόνια, ὅτι ᾔδεισαν ⸀αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/034.yaml
  text: And he healed many who were sick with various diseases[a], and he cast out many demons, and he would not allow the demons to speak, because they knew him.
translation:
  language: vi
  text: Ngài chữa lành nhiều người mắc nhiều loại bệnh khác nhau, đuổi nhiều quỷ, và không cho các quỷ nói, vì chúng biết Ngài.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể hiểu: “chúng biết Ngài là ai.” Tiếng Hy Lạp chỉ viết đơn giản: “chúng biết Ngài.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐθεράπευσεν
  choice: chữa lành
  rationale: Diễn đạt tự nhiên hành động chữa khỏi bệnh, đồng thời phù hợp với văn phong tường thuật Kinh Thánh.
- source_word: πολλοὺς κακῶς ἔχοντας
  choice: nhiều người mắc ... bệnh tật
  rationale: Thành ngữ κακῶς ἔχω chỉ tình trạng đau ốm; cách dịch này tự nhiên trong tiếng Việt và tránh lối dịch sát chữ khó hiểu.
- source_word: ποικίλαις νόσοις
  choice: đủ thứ bệnh tật
  rationale: ποικίλος nhấn mạnh sự đa dạng; “đủ thứ bệnh tật” là cách nói hiện đại, rõ nghĩa và tự nhiên.
- source_word: δαιμόνια πολλὰ ἐξέβαλεν
  choice: đuổi nhiều quỷ
  rationale: ἐκβάλλω trong ngữ cảnh trừ quỷ mang nghĩa xua đuổi ra; “đuổi” gọn và rõ trong tiếng Việt.
- source_word: οὐκ ἤφιεν
  choice: không cho
  rationale: Thì chưa hoàn thành gợi hành động ngăn cấm đang diễn ra trong cảnh này; “không cho” diễn đạt tự nhiên mà không làm câu nặng nề.
- source_word: λαλεῖν
  choice: nói
  rationale: λαλέω là động từ thông dụng chỉ việc nói; “nói” phù hợp với văn cảnh.
- source_word: ὅτι
  choice: vì
  rationale: ὅτι ở đây tự nhiên nhất là nêu lý do Chúa Giê-su không cho các quỷ nói.
- source_word: ᾔδεισαν αὐτόν
  choice: chúng biết Ngài
  rationale: Giữ đúng cấu trúc ngắn gọn của tiếng Hy Lạp, trong đó tân ngữ chỉ đơn giản là “Ngài”, không tự ý bổ sung nội dung nhận biết.
theological_decisions:
- issue: Có nên diễn giải sự nhận biết của các quỷ thành một lời xác nhận rõ ràng về căn tính của Chúa Giê-su hay không
  choice: chúng biết Ngài
  alternative: chúng biết Ngài là ai
  rationale: Bản Hy Lạp chỉ nói “chúng biết Ngài”. Giữ cách nói cô đọng này bảo toàn sự hàm ý và sức căng thần học của câu, thay vì đưa thông tin từ văn cảnh lân cận vào bản dịch.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Ngài” để chỉ Chúa Giê-su và “chúng” để chỉ các quỷ; câu văn giữ nhịp kể liên tục của nguyên bản.
