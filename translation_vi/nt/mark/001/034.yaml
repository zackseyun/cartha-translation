  - severity: low
    issue: Dấu neo chú thích hiện đặt ở cuối câu thay vì ngay sau cụm “chúng biết Ngài.”
    rationale: Chú thích chỉ giải thích ᾔδεισαν αὐτόν (“chúng biết Ngài”); đặt neo sát cụm này làm phạm vi chú thích rõ ràng hơn.
