revisions:
- from: Ngài chữa lành nhiều người mắc đủ thứ bệnh tật, đuổi nhiều quỷ, và không cho các quỷ nói, vì chúng biết Ngài.[a]
  to: Ngài chữa lành nhiều người mắc nhiều loại bệnh khác nhau, đuổi nhiều quỷ, và không cho các quỷ nói, vì chúng biết Ngài.[a]
  rationale: Điều chỉnh nhỏ về cách diễn đạt để làm rõ ý “các bệnh đa dạng” của ποικίλαις νόσοις và chuyển dấu neo chú thích đến ngay sau cụm được chú giải. Bản sửa vẫn giữ nhịp kể, sắc thái nhân quả của ὅτι, và sự mơ hồ có chủ ý trong “chúng biết Ngài.”
  reviewer_model: gpt-5.6-terra
