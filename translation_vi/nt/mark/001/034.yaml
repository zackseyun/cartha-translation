  source_fidelity: 'Bản dịch truyền đạt đúng các ý chính của câu: Chúa Giê-su chữa lành nhiều người đau ốm với các bệnh khác nhau, đuổi nhiều quỷ, và không cho quỷ nói vì chúng biết Ngài. Cách dịch giữ đúng sự cô đọng của ᾔδεισαν αὐτόν, không diễn giải thành một lời tuyên xưng về căn tính của Ngài.'
