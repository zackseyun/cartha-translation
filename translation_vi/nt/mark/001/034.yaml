  terminology: “Chữa lành,” “đuổi quỷ,” “không cho ... nói,” và đại từ “Ngài” đều phù hợp với ngữ cảnh và cách dùng Kinh Thánh tiếng Việt. Giữ “quỷ” cho δαιμόνια nhất quán trong câu. Chú thích từ vựng cần được neo ngay sau “Ngài,” là cụm mà chú thích giải thích.
  issues:
