  text: And Simon and those with him pursued him,[a]
translation:
  language: vi
  text: Si-môn và những người cùng ông đã đuổi theo Giê-su.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “ráo riết đi tìm ngài.” Động từ Hy Lạp có thể hàm ý việc đuổi theo một cách quyết liệt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατεδίωξεν
  choice: ráo riết tìm
  rationale: Động từ καταδιώκω mang sắc thái đuổi theo hoặc tìm kiếm một cách quyết liệt. Trong ngữ cảnh này, “ráo riết tìm” tự nhiên trong tiếng Việt, đồng thời giữ được cường độ mạnh hơn cách nói đơn thuần “tìm”.
- source_word: αὐτὸν
  choice: Đức Chúa Jêsus
  rationale: Đại từ chỉ về Đức Chúa Jêsus trong văn cảnh trước. Dùng lại danh xưng giúp tránh khả năng người đọc tiếng Việt hiểu nhầm “ông” là Si-môn khi trong cùng câu đã có đại từ chỉ Si-môn.
- source_word: Σίμων
  choice: Si-môn
  rationale: Phiên âm tên riêng theo lối viết Kinh Thánh tiếng Việt quen thuộc.
- source_word: οἱ μετ’ αὐτοῦ
  choice: những người đi cùng ông
  rationale: Diễn đạt tự nhiên ý sát chữ “những người ở cùng ông,” không xác định thêm họ là ai.
- source_word: καὶ
  choice: và
  rationale: Giữ cách nối câu đơn giản, có tính liên kết tuần tự đặc trưng trong lời kể của Mác.
