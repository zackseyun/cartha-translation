review_pass:
  verdict: revise
  source_fidelity: Bản nháp nhận đúng chủ ngữ là Si-môn và những người ở cùng ông, và hiểu đúng đối tượng là Giê-su. Tuy nhiên, κατεδίωξεν có lực chính là “đuổi theo/truy theo”; chọn “ráo riết tìm” làm bản văn chính làm yếu nét theo đuổi của động từ. Danh xưng “Đức Chúa Jêsus” cũng thêm tước hiệu không hiện diện trong câu Hy Lạp, dù quy chiếu về Giê-su là rõ ràng từ ngữ cảnh.
  naturalness: “Si-môn và những người cùng ông đã đuổi theo Giê-su” là tiếng Việt hiện đại, rõ quan hệ quy chiếu, và giữ được nhịp kể ngắn gọn của Mác. “Cùng ông” tự nhiên hơn “đi cùng ông” trong cấu trúc này.
  terminology: Dùng “Giê-su” theo chính tả Việt ngữ hiện đại và không thêm tước hiệu vào đại từ αὐτόν. “Đuổi theo” chuyển tải trung tính nhưng mạnh lực của καταδιώκω, không nhất thiết hàm ý thù địch.
  issues:
  - severity: medium
    issue: Động từ chính bị làm yếu trong bản văn.
    rationale: κατεδίωξεν nghĩa cơ bản là đuổi/truy theo; “ráo riết tìm” là một cách diễn giải khả dĩ nhưng phù hợp hơn ở chú thích thay vì thay thế nghĩa chính.
  - severity: low
    issue: Thêm tước hiệu “Đức Chúa” vào chỗ bản gốc chỉ dùng đại từ.
    rationale: Đại từ chắc chắn chỉ Giê-su, nhưng bản thân câu không có κύριος hay tước hiệu tương đương. Chỉ dùng tên riêng giữ sát nguồn hơn và tránh thêm sắc thái không cần thiết.
  - severity: low
    issue: Chính tả tên riêng không nhất quán với mục tiêu tiếng Việt tiêu chuẩn hiện đại.
    rationale: “Giê-su” là dạng hiện đại, trung tính và dễ đọc; không cần giữ lối “Jêsus” gắn với một truyền thống dịch thuật riêng.
