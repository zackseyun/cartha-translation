  to: Si-môn và những người cùng ông đã đuổi theo Giê-su.[a]
  rationale: Đổi bản văn chính sang “đuổi theo” để phản ánh trực tiếp lực của καταδιώκω, đồng thời giữ “ráo riết đi tìm” như một khả năng diễn đạt trong chú thích. Dùng tên “Giê-su” để giải quyết quy chiếu của đại từ mà không thêm tước hiệu ngoài bản gốc.
