  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. “Ráo riết tìm” giữ sắc thái mạnh của động từ Hy Lạp nhưng không gợi ý thái độ thù địch như “truy đuổi.”
