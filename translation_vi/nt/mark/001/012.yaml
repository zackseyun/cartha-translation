  source_fidelity: Bản dịch truyền đạt đúng chủ thể, đối tượng, tính khẩn trương của εὐθύς, và lực của ἐκβάλλει. Tuy nhiên, Καὶ bị bỏ hẳn; trong một câu rất ngắn thuộc mạch kể đặc trưng của Mác, nên giữ bằng “Và”. “Vùng hoang vắng” diễn đạt τὴν ἔρημον tự nhiên và bao quát hơn “nơi hoang vắng”.
  naturalness: “Và lập tức, Thánh Linh đẩy Người vào vùng hoang vắng” là tiếng Việt tiêu chuẩn, trang trọng và gọn. “Đẩy ... vào” giữ lực của động từ nguồn mà không diễn giải thêm.
  terminology: “Thánh Linh” và đại từ kính trọng “Người” nhất quán với văn phong Kinh Thánh tiếng Việt. “Vùng hoang vắng” không đồng nhất ἔρημος với sa mạc cát.
  issues:
