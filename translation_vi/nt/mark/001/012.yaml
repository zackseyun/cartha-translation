    rationale: Καὶ là liên từ nối mạch (“Và”), còn εὐθύς mới là “lập tức”. Tuy tiếng Việt đôi khi có thể lược liên từ, việc giữ lại ở đây phù hợp hơn với tính tương đương tối ưu và nhịp trần thuật của Mác.
  - severity: low
    issue: “Nơi hoang vắng” có thể thay bằng “vùng hoang vắng”.
    rationale: ἔρημος trong ngữ cảnh chỉ một khu vực hoang vắng, không chỉ một địa điểm đơn lẻ; “vùng” tự nhiên hơn trong tiếng Việt mà không thu hẹp nghĩa.
