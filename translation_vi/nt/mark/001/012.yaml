  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Καὶ εὐθὺς τὸ πνεῦμα αὐτὸν ἐκβάλλει εἰς τὴν ἔρημον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/012.yaml
  text: And immediately the Spirit drives him out into the wilderness[a].
translation:
  language: vi
  text: Và lập tức, Thánh Linh đẩy Người vào vùng hoang vắng.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “xua Người vào” hoặc “sai Người đi vào”. Động từ Hy Lạp ở đây có sắc thái mạnh; Mác thường dùng chính động từ này khi nói đến việc đuổi quỷ.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: Ngay lập tức
  rationale: Liên từ Καὶ nối tiếp diễn biến, nhưng trong tiếng Việt không nhất thiết phải dịch riêng là “và”; mạch nối được thể hiện tự nhiên qua trạng ngữ chỉ thời gian.
- source_word: εὐθὺς
  choice: ngay lập tức
  rationale: Giữ nhịp kể nhanh và cảm giác khẩn trương đặc trưng của Mác bằng một cách nói tự nhiên trong tiếng Việt hiện đại.
- source_word: τὸ πνεῦμα
  choice: Thánh Linh
  rationale: Trong ngữ cảnh, danh từ xác định này chỉ về Thánh Linh vừa được nhắc đến khi Đức Giê-su chịu phép báp-têm (Mác 1:10). “Thánh Linh” rõ nghĩa và phù hợp văn phong Kinh Thánh tiếng Việt.
- source_word: αὐτὸν
  choice: Người
  rationale: Đại từ làm tân ngữ, chỉ Đức Giê-su; viết hoa “Người” giúp tham chiếu rõ ràng mà không thêm danh xưng không có trong nguyên văn.
- source_word: ἐκβάλλει
  choice: đẩy
  rationale: Động từ có sắc thái mạnh hơn “dẫn” hay “đưa”, vì vậy “đẩy” bảo toàn sức nặng và sự căng thẳng của nguyên văn mà vẫn tự nhiên trong câu tiếng Việt.
- source_word: εἰς τὴν ἔρημον
  choice: vào nơi hoang vắng
  rationale: ἔρημος là vùng không người ở, hiu quạnh; “nơi hoang vắng” tránh giới hạn hình ảnh vào sa mạc cát và phù hợp địa hình trong ngữ cảnh.
theological_decisions:
- issue: Mức độ mạnh trong hành động của Thánh Linh đối với Đức Giê-su
  choice: Dịch ἐκβάλλει là “đẩy” để giữ sắc thái mạnh.
  alternative: “dẫn” hoặc “sai đi”
  rationale: 'Nguyên văn dùng một động từ mạnh, cũng thường được Mác dùng khi nói đến việc đuổi quỷ. Không làm nhẹ thành “dẫn” giúp bảo toàn sự căng thẳng thần học: việc Đức Giê-su vào nơi thử thách diễn ra theo tác động chủ động của Thánh Linh, nhưng bản dịch không giải thích vượt quá câu văn.'
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Câu ngắn giữ nhịp kể nhanh của Mác; dùng “nơi hoang vắng” thay vì “sa mạc” để không thu hẹp nghĩa của ἔρημος.
