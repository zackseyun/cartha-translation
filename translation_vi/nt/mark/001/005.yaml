  terminology: Giữ “báp-têm,” “xưng nhận tội lỗi,” và các tên Giu-đê, Giê-ru-sa-lem, Giô-đanh là nhất quán, dễ hiểu, và không áp đặt cách hiểu hệ phái. Cụm “được ông làm phép báp-têm” bảo toàn vai bị động và đại từ nguyên văn.
  issues:
