  source_fidelity: 'Bản dịch giữ được các thành tố chính: phạm vi tu từ của “cả/toàn thể,” cư dân Giê-ru-sa-lem, thể bị động của việc báp-têm do ông thực hiện, và việc xưng nhận tội. Tuy nhiên, “dưới sông Giô-đanh” không diễn đạt đúng ἐν τῷ ... ποταμῷ (“trong sông Giô-đanh”); trong tiếng Việt, cụm này thường gợi nghĩa ở phía dưới lòng sông hoặc bên dưới một con sông.'
