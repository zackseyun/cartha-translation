  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἐξεπορεύετο πρὸς αὐτὸν πᾶσα ἡ Ἰουδαία χώρα καὶ οἱ Ἱεροσολυμῖται ⸂πάντες, καὶ ἐβαπτίζοντο⸃ ⸂ὑπ’ αὐτοῦ ἐν τῷ Ἰορδάνῃ ποταμῷ⸃ ἐξομολογούμενοι τὰς ἁμαρτίας αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/005.yaml
  text: And all the Judean countryside and all the people of Jerusalem were going out to him, and they were being baptized by him in the Jordan River, confessing their sins.
translation:
  language: vi
  text: Cả miền Giu-đê và toàn thể dân cư Giê-ru-sa-lem đều kéo đến với ông, và được ông làm phép báp-têm trong sông Giô-đanh, xưng nhận tội lỗi mình.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξεπορεύετο
  choice: kéo đến
  rationale: Động từ ở thì chưa hoàn thành diễn tả dòng người liên tục đi ra đến với Giăng; “kéo đến” tự nhiên trong tiếng Việt và giữ được sắc thái đông đảo, tiếp diễn trong văn cảnh.
- source_word: πᾶσα ἡ Ἰουδαία χώρα
  choice: cả miền Giu-đê
  rationale: χώρα chỉ miền hay vùng; cách dịch này giữ πᾶσα và không giới hạn nghĩa vào riêng vùng nông thôn.
- source_word: οἱ Ἱεροσολυμῖται πάντες
  choice: toàn thể dân thành Giê-ru-sa-lem
  rationale: Diễn đạt tự nhiên danh từ chỉ cư dân Giê-ru-sa-lem cùng πάντες, đồng thời giữ tính khái quát tu từ của câu.
- source_word: ἐβαπτίζοντο
  choice: được ông làm phép báp-têm
  rationale: Giữ thể bị động và hành động diễn ra lặp lại, dùng thuật ngữ quen thuộc nhưng không diễn giải phương thức hay ý nghĩa thần học của nghi thức.
- source_word: ὑπ’ αὐτοῦ
  choice: được ông
  rationale: Giữ đại từ của nguyên văn thay vì thêm tên Giăng từ văn cảnh.
- source_word: ἐν τῷ Ἰορδάνῃ ποταμῷ
  choice: dưới sông Giô-đanh
  rationale: Trong tiếng Việt, “dưới sông” là cách nói tự nhiên cho một hành động diễn ra trong nước sông; đồng thời dịch rõ ποταμός là “sông” mà không quyết định phương thức báp-têm.
- source_word: ἐξομολογούμενοι
  choice: đồng thời xưng nhận
  rationale: Phân từ chỉ hành động đi kèm với việc chịu báp-têm; “đồng thời” làm rõ quan hệ cú pháp mà không áp đặt trình tự thời gian.
- source_word: τὰς ἁμαρτίας αὐτῶν
  choice: tội lỗi mình
  rationale: Đại từ phản thân “mình” là lối diễn đạt tiếng Việt tự nhiên khi chủ thể của việc xưng nhận cũng là người có tội lỗi ấy.
theological_decisions:
- issue: Phạm vi của “cả/toàn thể” đối với Giu-đê và Giê-ru-sa-lem
  choice: Giữ “cả” và “toàn thể” theo lối khái quát tập thể
  alternative: Dịch giảm nhẹ thành “nhiều người từ miền Giu-đê và Giê-ru-sa-lem”
  rationale: Nguyên văn có πᾶσα và πάντες, nên cần bảo toàn sức nhấn mạnh tu từ, nhưng không buộc người đọc hiểu đó là lời khẳng định toán học rằng không một cá nhân nào vắng mặt.
- issue: Bản chất và phương thức của hành động báp-têm
  choice: Dùng “làm phép báp-têm” mà không diễn giải phương thức
  alternative: Dịch là “dìm mình” hoặc “thanh tẩy”
  rationale: Câu thuật lại hành động nhưng không tự nó xác định đầy đủ phương thức hay ý nghĩa thần học; cách dịch trung tính tránh đưa lập trường hệ phái vào bản văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Tên riêng dùng dạng phiên âm quen thuộc Giu-đê, Giê-ru-sa-lem và Giô-đanh. Không cần chú thích vì bản dịch không chứa điểm dị bản hoặc yếu tố khó hiểu cần giải thích.
