id: MRK.1.2
reference: Mark 1:2
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸀Καθὼς γέγραπται ἐν ⸂τῷ Ἠσαΐᾳ τῷ προφήτῃ⸃· ⸀Ἰδοὺ ἀποστέλλω τὸν ἄγγελόν μου πρὸ προσώπου σου, ὃς κατασκευάσει τὴν ὁδόν ⸀σου·
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/002.yaml
  text: 'Just as it is written in Isaiah the prophet: ‘Behold[a], I send my messenger before your face[c][b], who will prepare your way.’'
translation:
  language: vi
  text: 'Đúng như đã chép trong sách tiên tri Ê-sai[a]: “Này, Ta sai sứ giả của Ta đi trước ngươi[b]; người sẽ chuẩn bị con đường của ngươi.”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Một số thủ bản chép “trong các sách tiên tri” thay vì “trong sách tiên tri Ê-sai.”
    reason: textual_variant
  - marker: b
    text: 'Sát chữ: “trước mặt ngươi”; cũng có thể dịch là “trước ngươi.”'
    reason: lexical_alternative
  - marker: c
    text: Lời trích dẫn kết hợp cách diễn đạt trong Ma-la-chi 3:1 và Ê-sai 40:3.
    reason: cross_reference
lexical_decisions:
- source_word: Καθὼς
  choice: Đúng như
  rationale: Giữ sắc thái đối chiếu của liên từ, đồng thời mở câu tự nhiên trong tiếng Việt hiện đại.
- source_word: γέγραπται
  choice: đã chép
  rationale: Diễn đạt công thức trích dẫn Kinh Thánh ở thể hoàn thành bị động; tiếng Việt có thể lược chủ thể mà vẫn giữ ý văn bản đã được ghi chép và hiện còn giá trị.
- source_word: ἐν τῷ Ἠσαΐᾳ τῷ προφήτῃ
  choice: trong sách tiên tri Ê-sai
  rationale: Nêu rõ đây là lời được chép trong sách mang tên vị tiên tri; từ “sách” được thêm theo hàm ý của công thức trích dẫn để câu tiếng Việt rõ và tự nhiên.
- source_word: Ἰδοὺ
  choice: Này
  rationale: Giữ chức năng kêu gọi chú ý và sắc thái trang trọng của lời tiên tri mà không quá cổ.
- source_word: ἀποστέλλω
  choice: Ta sai
  rationale: Phản ánh trực tiếp thì hiện tại giàu tính sống động của nguyên văn, không tự ý chuyển thành tương lai.
- source_word: ἄγγελόν
  choice: sứ giả
  rationale: Trong ngữ cảnh này, từ chỉ người được sai đi báo tin hoặc đi trước; “sứ giả” không khiến độc giả mặc nhiên hiểu là một thiên sứ.
- source_word: πρὸ προσώπου σου
  choice: đi trước ngươi
  rationale: Chuyển thành ngữ “trước mặt ngươi” sang cách nói tiếng Việt tự nhiên, đồng thời giữ ý về vị trí và vai trò đi trước. Nghĩa sát chữ được ghi ở chú thích.
- source_word: κατασκευάσει
  choice: sẽ chuẩn bị
  rationale: Giữ nghĩa làm cho sẵn sàng và giá trị tương lai của động từ.
- source_word: τὴν ὁδόν σου
  choice: con đường của ngươi
  rationale: Giữ hình ảnh “con đường” cũng như khả năng hiểu theo cả nghĩa cụ thể lẫn nghĩa ẩn dụ, thay vì giải thích thêm.
theological_decisions:
- issue: Công thức trích dẫn chỉ nêu tên Ê-sai dù lời trích dẫn kết hợp chất liệu gắn với Ma-la-chi và Ê-sai.
  choice: Giữ “trong sách tiên tri Ê-sai” trong chính văn.
  alternative: trong các sách tiên tri
  rationale: Bản SBLGNT đọc ἐν τῷ Ἠσαΐᾳ τῷ προφήτῃ. Bản dịch không hòa giải khó khăn về nguồn trích dẫn; dị bản và tính chất kết hợp của lời trích được trình bày trong chú thích.
- issue: Đại từ số ít trong lời Đức Chúa Trời phán với người được sai sứ giả đi trước không tự nó nêu rõ quan hệ giữa hai bên.
  choice: Dùng “Ta” và “ngươi”, không dùng “Cha” và “Con”.
  alternative: Ta và Con
  rationale: Cách dịch này giữ ngôi xưng hô và sắc thái trang trọng nhưng không đưa quan hệ thần học vốn không được biểu thị bằng chính các đại từ Hy Lạp vào câu.
translation_notes:
  register: Văn phong trang trọng, rõ ràng và dễ hiểu trong tiếng Việt hiện đại. “Ta/ngươi” giữ sắc thái của lời tiên tri và tránh diễn giải quan hệ giữa người nói với người được nói đến. Dấu chấm phẩy giúp mệnh đề quan hệ trong lời trích dẫn dễ theo dõi.
