revisions:
- from: Họ kinh ngạc về lời dạy của Ngài, vì Ngài dạy họ như một người có thẩm quyền[a], chứ không như các kinh sư.
  to: Họ kinh ngạc trước lời dạy của Ngài, vì Ngài dạy họ như một người có thẩm quyền[a], chứ không như các kinh sư.
  rationale: Chỉnh giới từ để câu tiếng Việt tự nhiên hơn và thay chú thích bằng các phương án vẫn giữ đúng nghĩa “thẩm quyền” của ἐξουσία. Không thêm diễn giải về nguồn gốc hoặc bản chất thần học của thẩm quyền này.
