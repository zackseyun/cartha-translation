source:
  edition: SBLGNT
  text: καὶ ἐξεπλήσσοντο ἐπὶ τῇ διδαχῇ αὐτοῦ, ἦν γὰρ διδάσκων αὐτοὺς ὡς ἐξουσίαν ἔχων καὶ οὐχ ὡς οἱ γραμματεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/022.yaml
  text: And they were astonished at his teaching[a], for he was teaching them as one having authority, and not as the scribes.
translation:
  language: vi
  text: Họ kinh ngạc trước lời dạy của Ngài, vì Ngài dạy họ như một người có thẩm quyền[a], chứ không như các kinh sư.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “như người có thẩm quyền”; nói tự nhiên hơn: “với thẩm quyền.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξεπλήσσοντο
  choice: kinh ngạc
  rationale: Diễn tả phản ứng sửng sốt mạnh; dạng chưa hoàn thành cho thấy phản ứng đang diễn ra, điều mà mạch kể tiếng Việt truyền đạt tự nhiên mà không cần thêm từ chỉ tiến trình.
- source_word: ἐπὶ τῇ διδαχῇ αὐτοῦ
  choice: về lời dạy của Ngài
  rationale: Giữ danh từ διδαχή, có thể bao hàm cả nội dung lẫn cách thức giảng dạy, thay vì thu hẹp nghĩa thành riêng 'giáo lý' hoặc 'cách giảng dạy'.
- source_word: ἦν γὰρ διδάσκων
  choice: vì Ngài dạy họ
  rationale: Kết cấu ἦν với phân từ chỉ hành động đang diễn ra. Trong văn kể tiếng Việt, dạng đơn này tự nhiên và vẫn thể hiện tiến trình nhờ ngữ cảnh.
- source_word: ὡς ἐξουσίαν ἔχων
  choice: như một người có thẩm quyền
  rationale: Phản ánh rõ phép so sánh do ὡς dẫn vào và nghĩa 'thẩm quyền, quyền hành chính đáng' của ἐξουσία, không diễn giải thêm nguồn gốc của thẩm quyền ấy.
- source_word: γραμματεῖς
  choice: các kinh sư
  rationale: Chỉ những người Do Thái chuyên nghiên cứu, sao chép và giảng giải Kinh Luật; 'kinh sư' ngắn gọn, trang trọng và chính xác hơn cách gọi cổ 'thầy thông giáo'.
theological_decisions:
- issue: Bản chất thẩm quyền của Chúa Giê-su trong sự tương phản với các kinh sư
  choice: Diễn đạt mô tả rằng Ngài dạy như một người có thẩm quyền.
  alternative: Diễn giải thành 'với thẩm quyền thần linh'.
  rationale: Câu này nêu sự tương phản trong việc giảng dạy nhưng không trực tiếp xác định nguồn gốc hay bản thể của thẩm quyền; bản dịch không thêm một kết luận thần học vượt quá câu nguồn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” cho Chúa Giê-su; giữ “kinh sư” là thuật ngữ lịch sử chính xác, tránh cách gọi cổ “thầy thông giáo” và cách diễn giải dài “các thầy dạy luật”.
