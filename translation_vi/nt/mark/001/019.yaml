revisions:
- from: Đi thêm một quãng ngắn, Ngài thấy Gia-cơ, con Xê-bê-đê, và Giăng, người anh em của Gia-cơ. Hai người cũng đang ở trong thuyền vá[a] lưới.
  to: Đi thêm một quãng ngắn, Ngài thấy Gia-cơ, con trai của Xê-bê-đê, và Giăng, người anh em của Gia-cơ, đang ở trong thuyền vá[a] lưới.
  rationale: Bỏ sắc thái phụ thêm do “cũng” tạo ra và gộp phần mô tả hoạt động của hai anh em vào điều Ngài thấy, sát với cú pháp và quan hệ nghĩa của nguyên văn. Dùng “con trai của Xê-bê-đê” để nêu rõ quan hệ cha con mà không thay đổi ý nghĩa. Chú thích và vị trí neo chú thích được giữ nguyên vì giải thích đúng lựa chọn “vá”.
  reviewer_model: gpt-5.6-terra
