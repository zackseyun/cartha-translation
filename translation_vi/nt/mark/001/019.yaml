base_translation:
  language: en
  yaml_path: translation/nt/mark/001/019.yaml
  text: And going on a little farther[a], he saw James the son of Zebedee and John his brother, and they were in the boat mending the nets,
translation:
  language: vi
  text: Đi thêm một quãng ngắn, Ngài thấy Gia-cơ, con trai của Xê-bê-đê, và Giăng, người anh em của Gia-cơ, đang ở trong thuyền vá[a] lưới.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “sửa chữa” hoặc “chuẩn bị” lưới; động từ Hy Lạp có thể chỉ việc sắp đặt một vật cho chỉnh tề hoặc phục hồi nó về tình trạng thích hợp.
    reason: lexical_alternative
lexical_decisions:
- source_word: προβὰς ὀλίγον
  choice: Đi thêm một quãng ngắn
  rationale: Phân từ bất định diễn tả hành động xảy ra trước động từ chính và việc tiếp tục đi một khoảng ngắn; cách dịch này tự nhiên trong tiếng Việt mà vẫn giữ trình tự của câu.
- source_word: εἶδεν
  choice: Ngài thấy
  rationale: Giữ nghĩa kể chuyện đơn giản của động từ ὁράω, không thêm sắc thái như “để ý” hay “nhận ra”.
- source_word: Ἰάκωβον τὸν τοῦ Ζεβεδαίου
  choice: Gia-cơ, con Xê-bê-đê
  rationale: Kết cấu mạo từ kèm sở hữu cách xác định Gia-cơ theo quan hệ cha con; cách diễn đạt này gọn và tự nhiên trong tiếng Việt.
- source_word: Ἰωάννην τὸν ἀδελφὸν αὐτοῦ
  choice: Giăng, người anh em của Gia-cơ
  rationale: Đại từ αὐτοῦ tự nhiên nhất quy chiếu về Gia-cơ. “Người anh em” giữ nguyên việc tiếng Hy Lạp không cho biết ai lớn hay nhỏ, thay vì buộc phải chọn “anh” hoặc “em”.
- source_word: καὶ αὐτοὺς ἐν τῷ πλοίῳ
  choice: Hai người cũng đang ở trong thuyền
  rationale: καὶ αὐτούς nhấn rằng họ cũng ở trong tình trạng được mô tả; chuyển sang một mệnh đề tiếng Việt giúp câu rõ ràng, còn “trong thuyền” giữ tính xác định của mạo từ.
- source_word: καταρτίζοντας
  choice: vá
  rationale: Trong ngữ cảnh đánh cá, “vá lưới” là cách nói tự nhiên nhất về việc phục hồi lưới cho dùng được, dù động từ Hy Lạp có phạm vi nghĩa rộng hơn như sửa chữa, chuẩn bị hoặc sắp đặt cho ngay ngắn.
- source_word: τὰ δίκτυα
  choice: lưới
  rationale: Chỉ lưới đánh cá; tiếng Việt tự nhiên dùng danh từ không cần từ chỉ số nhiều hay sở hữu, và ngữ cảnh đã xác định rõ.
