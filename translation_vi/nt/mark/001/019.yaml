translation_notes:
  register: Bản dịch dùng tiếng Việt hiện đại, trang trọng và dễ hiểu. Tên riêng theo dạng quen thuộc trong truyền thống Kinh Thánh tiếng Việt. “Người anh em” được dùng có chủ ý để không áp đặt quan hệ lớn–nhỏ vốn không được nêu trong nguyên văn. Dấu chú thích đặt ngay sau “vá”, là từ mà chú thích giải nghĩa.
