source:
  edition: SBLGNT
  text: καὶ λέγει αὐτοῖς· Ἄγωμεν ⸀ἀλλαχοῦ εἰς τὰς ἐχομένας κωμοπόλεις, ἵνα καὶ ἐκεῖ κηρύξω, εἰς τοῦτο γὰρ ⸀ἐξῆλθον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/038.yaml
  text: And he said to them[a], “Let us go elsewhere, to the neighboring towns, so that I may preach there also[b], for that is why I came out.”
translation:
  language: vi
  text: 'Ngài nói với họ: “Chúng ta hãy đi nơi khác, đến các thị trấn[b] lân cận, để tôi cũng rao giảng ở đó, vì chính vì việc này mà tôi đã ra đi[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “vì mục đích này mà tôi đã ra đi.” Cụm từ này có thể chỉ đơn giản việc Đức Giê-su rời nơi đang ở, hoặc rộng hơn là mục đích Ngài đi ra để rao giảng.'
    reason: alternative_reading
  - marker: b
    text: Từ Hy Lạp được dịch là “thị trấn” có thể chỉ những khu dân cư nhỏ, có quy mô ở khoảng giữa làng và thị trấn.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄγωμεν
  choice: Chúng ta hãy đi
  rationale: Thể giả định khuyến cáo ngôi thứ nhất số nhiều, diễn tả lời đề nghị cùng đi; cách dịch này tự nhiên và giữ nguyên sắc thái.
- source_word: ἀλλαχοῦ
  choice: nơi khác
  rationale: Trạng từ chỉ việc đi đến một nơi khác, được chuyển sang tiếng Việt ngắn gọn và tự nhiên.
- source_word: ἐχομένας
  choice: lân cận
  rationale: Phân từ được dùng theo nghĩa địa lý, chỉ những nơi kế tiếp hoặc gần đó.
- source_word: κωμοπόλεις
  choice: các thị trấn
  rationale: Từ này chỉ những khu dân cư nhỏ, nằm giữa làng và thị trấn; “thị trấn” dễ hiểu trong chính văn, còn độ rộng nghĩa được nêu ở chú thích.
- source_word: ἵνα καὶ ἐκεῖ κηρύξω
  choice: để tôi cũng rao giảng ở đó
  rationale: “để” giữ quan hệ mục đích của ἵνα; “rao giảng” truyền đạt κηρύσσω, và vị trí “cũng… ở đó” giữ sự nhấn mạnh của καὶ ἐκεῖ.
- source_word: εἰς τοῦτο
  choice: vì chính vì việc này
  rationale: Cụm từ nêu lý do hoặc mục đích; “chính” giữ sắc thái quy chiếu nhấn mạnh mà không xác định quá mức nội dung.
- source_word: ἐξῆλθον
  choice: tôi đã ra đi
  rationale: Động từ aorist của ἐξέρχομαι có nghĩa ra khỏi hoặc đi ra. “Đã ra đi” giữ được khả năng chỉ việc rời nơi hiện tại lẫn ý nghĩa rộng hơn về việc đi ra để rao giảng.
- source_word: λέγει αὐτοῖς
  choice: Ngài nói với họ
  rationale: Hiện tại lịch sử trong tiếng Hy Lạp được chuyển thành quá khứ kể chuyện tự nhiên trong tiếng Việt; “Ngài” phù hợp văn phong Kinh Thánh trang trọng mà không thêm danh xưng thần học.
theological_decisions:
- issue: Phạm vi ý nghĩa của ἐξῆλθον
  choice: Dịch là “tôi đã ra đi”, không nói rõ Đức Giê-su ra khỏi nhà/nơi hiện tại hay đi ra theo một sứ mạng rộng hơn.
  alternative: “tôi đã đi ra” hoặc “tôi đã đến thế gian vì việc này”
  rationale: Nguyên văn có thể mang nghĩa địa phương và cũng có thể gợi mục đích rao giảng rộng hơn. Bản dịch tránh biến hàm ý thành lời khẳng định thần học về nguồn gốc hay sứ mạng.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Cấu trúc câu giữ sát tiến trình của nguyên văn, đồng thời dùng cách diễn đạt tự nhiên. Các dấu chú thích [a], [b] được đặt sau câu vì cả hai liên quan đến những cụm từ trong câu; nội dung chú thích xác định rõ phạm vi.
