translation:
  language: vi
  text: Cả thành đã tụ họp trước cửa[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đến cửa.” Giới từ Hy Lạp có thể được dịch sát như vậy, nhưng trong ngữ cảnh, cụm từ chỉ đám đông tụ họp tại lối vào nhà.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν
  choice: đều tụ họp
  rationale: Động từ ở thì chưa hoàn thành kết hợp với phân từ hoàn thành bị động miêu tả cảnh đang hiện hữu. Tiếng Việt không cần dịch riêng hệ từ; cụm “đều tụ họp” diễn đạt tự nhiên trạng thái kết quả của việc tập hợp.
- source_word: ὅλη ἡ πόλις
  choice: cả thành
  rationale: Giữ nguyên cách nói nhấn mạnh, sinh động của Hy Lạp thay vì làm nhẹ thành “nhiều người trong thành”; “cả thành” tự nhiên và trang trọng trong tiếng Việt hiện đại.
- source_word: ἐπισυνηγμένη
  choice: tụ họp
  rationale: Diễn đạt trạng thái mọi người đã tập hợp lại. “Tụ họp” tự nhiên hơn cấu trúc bị động sát chữ “được tập hợp” và không thêm sắc thái chen chúc.
- source_word: πρὸς τὴν θύραν
  choice: trước cửa
  rationale: Trong ngữ cảnh chỉ vị trí của đám đông tại lối vào nhà, “trước cửa” là cách nói tự nhiên. Giới từ πρός với đối cách cũng có thể được hiểu sát hơn theo hướng “đến cửa”, nên giữ phương án ấy trong chú thích.
- source_word: θύραν
  choice: cửa
  rationale: Dịch trực tiếp danh từ θύρα; trong ngữ cảnh, đó là cửa hay lối vào của căn nhà.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, ngắn gọn và trang trọng. “Cả thành” bảo toàn lối nói khái quát mạnh của nguyên văn; “trước cửa” giúp người đọc hiểu tự nhiên rằng dân chúng tập trung tại lối vào căn nhà.
