source:
  edition: SBLGNT
  text: καὶ σπαράξαν αὐτὸν τὸ πνεῦμα τὸ ἀκάθαρτον καὶ ⸀φωνῆσαν φωνῇ μεγάλῃ ἐξῆλθεν ἐξ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/026.yaml
  text: And the unclean spirit[a], after convulsing him and crying out with a loud voice[b], came out of him.
translation:
  language: vi
  text: Thần ô uế làm người ấy co giật, kêu lớn tiếng[a] rồi ra khỏi người ấy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “kêu lên một tiếng lớn.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: σπαράξαν
  choice: làm người ấy co giật
  rationale: Động từ diễn tả việc khiến thân thể co giật mạnh. Cách dịch này tự nhiên trong tiếng Việt, phù hợp với ngữ cảnh trừ quỷ và không đưa thêm ý gây thương tích như cách dịch sát theo nghĩa “xé” có thể gợi ra.
- source_word: τὸ πνεῦμα τὸ ἀκάθαρτον
  choice: thần ô uế
  rationale: Đây là cách diễn đạt quen thuộc và trang trọng trong tiếng Việt Kinh Thánh, giữ được sắc thái ô uế của ἀκάθαρτος. Trong câu, thực thể này hành động như một tác nhân có ngôi vị.
- source_word: φωνῆσαν
  choice: kêu
  rationale: Phân từ này chỉ hành động phát tiếng đi kèm với lúc thần rời khỏi người ấy. “Kêu” giữ được nghĩa rộng, không tự ý quy định cảm xúc hay nội dung tiếng kêu.
- source_word: φωνῇ μεγάλῃ
  choice: lớn tiếng
  rationale: Cụm ở cách dữ liệu diễn tả thể cách. “Lớn tiếng” là cách nói tự nhiên, rõ ràng về âm lượng; chú thích giữ lại khả năng diễn đạt bằng danh từ “một tiếng kêu lớn”.
- source_word: ἐξῆλθεν ἐξ αὐτοῦ
  choice: ra khỏi người
  rationale: Cách dịch trực tiếp và tự nhiên, giữ hình ảnh không gian của việc thần rời khỏi người đàn ông mà không thêm giải thích thần học.
- source_word: καὶ ... καὶ
  choice: …, … rồi …
  rationale: Chuỗi liên kết đơn giản của tiếng Hy Lạp được thể hiện bằng nhịp liệt kê và “rồi”, tạo câu tiếng Việt tự nhiên đồng thời giữ trình tự các hành động.
theological_decisions:
- issue: Bản chất của thực thể được gọi là “thần ô uế”
  choice: Giữ cách gọi “thần ô uế” và để thực thể ấy làm chủ thể của các hành động co giật, kêu và ra khỏi người
  alternative: Diễn giải thành một sức mạnh tà ác vô ngôi vị
  rationale: Trong mạch kể của Mác, “thần ô uế” hành động như một tác nhân có ngôi vị. Bản dịch giữ nguyên cách trình bày ấy nhưng không thêm định nghĩa giáo lý vượt quá câu văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu ngắn giữ nhịp kể nhanh đặc trưng của Mác; không lặp chủ ngữ sau mỗi hành động vì tiếng Việt xác định rõ cả ba hành động đều do “thần ô uế” thực hiện.
