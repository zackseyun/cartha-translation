review_pass:
  verdict: revise
  source_fidelity: Cần sửa. Bản nháp chuyển tải tốt khung cảnh, hành động đồng thời, việc quăng lưới và mệnh đề giải thích. Tuy nhiên, «em của Si-môn» xác định thứ bậc mà ἀδελφός không nêu; đồng thời cần biểu thị rõ đây là quan hệ anh/em trai. «Thả lưới» có thể gợi việc thả/giăng lưới, trong khi ἀμφιβάλλω ở đây chỉ hành động quăng lưới.
  naturalness: Câu kể nhìn chung tự nhiên. «Đang đi dọc theo bờ Biển Ga-li-lê» là cách diễn đạt gọn, tự nhiên và giữ sắc thái hành động đang diễn ra. «Quăng lưới xuống biển» phù hợp hơn với ngữ cảnh đánh bắt bằng lưới quăng.
  terminology: Giữ «Chúa Giê-su», «Si-môn», «Anh-rê» và «Biển Ga-li-lê» theo cách dùng Việt ngữ quen thuộc. Dùng «ngư dân» là cách gọi hiện đại, trang trọng vừa phải cho ἁλιεῖς. Ghi chú cho «anh/em trai» bảo toàn tính không xác định về thứ bậc trong nguyên ngữ.
  issues:
  - severity: medium
    issue: «em của Si-môn» thêm thông tin về thứ bậc.
    rationale: τὸν ἀδελφὸν Σίμωνος xác định Anh-rê là anh/em trai của Si-môn, nhưng không cho biết Anh-rê lớn hay nhỏ tuổi hơn. Bản chính cần không khẳng định Anh-rê là em.
  - severity: low
    issue: «thả lưới» có thể không đủ cụ thể về loại hành động.
    rationale: ἀμφιβάλλω trong ngữ cảnh này là quăng/casting một tấm lưới, không phải giăng hay thả lưới theo nghĩa chung. «Quăng lưới» sát nghĩa hơn mà vẫn tự nhiên.
  revised_text: Đang đi dọc theo bờ Biển Ga-li-lê, Chúa Giê-su thấy Si-môn và Anh-rê, anh/em trai của Si-môn†, đang quăng lưới xuống biển, vì họ là ngư dân.
  revised_footnotes:
  - marker: †
    text: Nguyên văn chỉ cho biết Anh-rê là anh/em trai của Si-môn, không cho biết ai lớn tuổi hơn.
    reason: Bảo toàn tính không xác định của ἀδελφός về thứ bậc anh hay em, đồng thời làm rõ quan hệ là anh/em trai.
  revision_rationale: Bản sửa thay cách gọi xác định «em» bằng «anh/em trai» có chú thích, để không thêm dữ liệu ngoài nguyên văn; thay «thả lưới» bằng «quăng lưới» để phản ánh chính xác hơn động tác ἀμφιβάλλω. Các thành phần còn lại được giữ theo hướng tương đương tối ưu và văn phong kể chuyện Việt ngữ hiện đại.
