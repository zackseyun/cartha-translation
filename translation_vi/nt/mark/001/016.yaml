source:
  edition: SBLGNT
  text: ⸂Καὶ παράγων⸃ παρὰ τὴν θάλασσαν τῆς Γαλιλαίας εἶδεν Σίμωνα καὶ Ἀνδρέαν τὸν ⸀ἀδελφὸν Σίμωνος ⸀ἀμφιβάλλοντας ἐν τῇ θαλάσσῃ, ἦσαν γὰρ ἁλιεῖς·
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/016.yaml
  text: And as he was passing along beside the Sea of Galilee, he saw Simon and Andrew, Simon’s brother, casting a net into the sea, for they were fishermen.
translation:
  language: vi
  text: Đang đi dọc theo bờ Biển Ga-li-lê, Chúa Giê-su thấy Si-môn và Anh-rê, anh/em trai của Si-môn†, đang quăng lưới xuống biển, vì họ là ngư dân.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παράγων παρὰ τὴν θάλασσαν
  choice: đang đi dọc theo bờ biển
  rationale: Phân từ hiện tại diễn tả hành động đang diễn ra đồng thời với εἶδεν; παρά với đối cách chỉ chuyển động dọc theo hoặc bên cạnh. Cách dịch này tự nhiên trong tiếng Việt và giữ được khung cảnh ven bờ.
- source_word: τὴν θάλασσαν τῆς Γαλιλαίας
  choice: biển Ga-li-lê
  rationale: Giữ cách gọi địa lý theo θάλασσα của nguyên bản, dù về địa lý đây là một hồ; đây cũng là tên gọi quen thuộc trong tiếng Việt.
- source_word: εἶδεν
  choice: thấy
  rationale: Dịch trực tiếp động từ ὁράω ở thì bất định, không thêm sắc thái như 'để ý thấy'.
- source_word: Σίμωνα καὶ Ἀνδρέαν
  choice: Si-môn và Anh-rê
  rationale: Phiên âm các tên riêng theo hình thức quen dùng trong tiếng Việt.
- source_word: τὸν ἀδελφὸν Σίμωνος
  choice: em của Si-môn
  rationale: ἀδελφός tự nó có thể chỉ anh hoặc em trai; ngữ cảnh và cách gọi truyền thống thường hiểu Anh-rê là em của Si-môn, nhưng vì nguyên bản không xác định thứ bậc nên sự bổ sung này được ghi chú.
- source_word: ἀμφιβάλλοντας ἐν τῇ θαλάσσῃ
  choice: đang thả lưới xuống biển
  rationale: ἀμφιβάλλω trong ngữ cảnh đánh cá chỉ việc quăng hoặc thả lưới; 'xuống biển' diễn đạt tự nhiên hướng của hành động trong tiếng Việt.
- source_word: ἦσαν γὰρ ἁλιεῖς
  choice: vì họ là những người đánh cá
  rationale: γάρ đưa ra lời giải thích cho hành động thả lưới; 'vì' chuyển tải quan hệ giải thích rõ ràng và tự nhiên.
theological_decisions:
- issue: Chủ ngữ ngầm của παράγων và εἶδεν
  choice: Chúa Giê-su
  alternative: Ngài / Người
  rationale: Chủ ngữ được xác định từ ngữ cảnh trước đó nhưng không xuất hiện bằng danh từ trong câu Hy Lạp này. Dùng tên giúp câu đứng riêng rõ nghĩa theo đơn vị câu được yêu cầu, không tạo thêm lập trường thần học.
- issue: Thứ bậc giữa Anh-rê và Si-môn trong ἀδελφός
  choice: em của Si-môn
  alternative: anh/em của Si-môn; anh trai của Si-môn
  rationale: Nguyên bản chỉ nói 'người anh/em trai của Si-môn' và không xác định ai lớn tuổi hơn. Bản văn chính dùng cách gọi tiếng Việt quen thuộc, nhưng cần chú thích để bảo toàn sự không xác định của tiếng Hy Lạp.
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Cấu trúc 'Khi đang...' giữ quan hệ đồng thời của phân từ Hy Lạp. Tuy nhiên, để bảo toàn đầy đủ tính mơ hồ của ἀδελφός, nên ưu tiên sửa bản chính thành 'anh/em trai của Si-môn' hoặc thêm chú thích nếu hệ thống xuất bản cho phép; bản nộp hiện chưa có dấu chú thích vì không kèm chú thích trong trường footnotes.
