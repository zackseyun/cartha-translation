revisions:
- from: Khi đang đi dọc theo bờ biển Ga-li-lê, Chúa Giê-su thấy Si-môn và Anh-rê, em của Si-môn, đang thả lưới xuống biển, vì họ là những người đánh cá.
  to: Đang đi dọc theo bờ Biển Ga-li-lê, Chúa Giê-su thấy Si-môn và Anh-rê, anh/em trai của Si-môn†, đang quăng lưới xuống biển, vì họ là ngư dân.
  rationale: Bản sửa thay cách gọi xác định «em» bằng «anh/em trai» có chú thích, để không thêm dữ liệu ngoài nguyên văn; thay «thả lưới» bằng «quăng lưới» để phản ánh chính xác hơn động tác ἀμφιβάλλω. Các thành phần còn lại được giữ theo hướng tương đương tối ưu và văn phong kể chuyện Việt ngữ hiện đại.
