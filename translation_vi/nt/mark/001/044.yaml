language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ λέγει αὐτῷ· Ὅρα μηδενὶ μηδὲν εἴπῃς, ἀλλὰ ὕπαγε σεαυτὸν δεῖξον τῷ ἱερεῖ καὶ προσένεγκε περὶ τοῦ καθαρισμοῦ σου ἃ προσέταξεν Μωϋσῆς εἰς μαρτύριον αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/044.yaml
  text: And he says to him[a], “See that you say nothing to anyone; rather, go, show yourself to the priest, and offer for your cleansing what Moses commanded, as a testimony to them.”
translation:
  language: vi
  text: 'Ngài bảo anh: “Hãy coi chừng, đừng nói gì với bất cứ ai; nhưng hãy đi, trình diện thầy tế lễ, và dâng những gì Môi-se đã truyền về việc thanh tẩy của anh, để làm bằng chứng cho họ.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “để làm chứng cho họ.” Cụm từ này có thể chỉ bằng chứng được trình cho các thầy tế lễ hoặc những người khác; một số người hiểu mạnh hơn là “bằng chứng chống lại họ”.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ὅρα
  choice: Hãy coi chừng
  rationale: Mệnh lệnh mang sắc thái cảnh báo và nhấn mạnh lời cấm theo sau; cách dịch này tự nhiên trong tiếng Việt và giữ được lực của câu.
- source_word: μηδενὶ μηδὲν εἴπῃς
  choice: đừng nói gì với bất cứ ai
  rationale: 'Giữ cả hai yếu tố phủ định bao quát: không nói điều gì và không nói với bất cứ người nào.'
- source_word: ἀλλὰ
  choice: nhưng
  rationale: Đánh dấu sự tương phản giữa điều không được làm và điều phải làm; trong cấu trúc tiếng Việt ở đây, “nhưng” trực tiếp và tự nhiên.
- source_word: ὕπαγε
  choice: hãy đi
  rationale: Chuyển tải trực tiếp mệnh lệnh di chuyển.
- source_word: σεαυτὸν δεῖξον τῷ ἱερεῖ
  choice: trình diện thầy tế lễ
  rationale: Diễn đạt tự nhiên hành động tự đưa mình đến để vị tế lễ xem xét, đồng thời giữ bối cảnh kiểm chứng theo luật Môi-se.
- source_word: ἱερεῖ
  choice: thầy tế lễ
  rationale: Chỉ vị có thẩm quyền tế lễ thích hợp để kiểm tra tình trạng thanh sạch; đây là thuật ngữ Kinh Thánh rõ nghĩa trong tiếng Việt.
- source_word: προσένεγκε
  choice: dâng
  rationale: Bối cảnh nghi lễ và tế lễ khiến “dâng” chính xác hơn từ chung chung “mang đến”.
- source_word: περὶ τοῦ καθαρισμοῦ σου
  choice: cho việc thanh tẩy của anh
  rationale: Giữ sắc thái nghi lễ của καθαρισμός và quan hệ mục đích/liên quan của περί.
- source_word: ἃ προσέταξεν Μωϋσῆς
  choice: những gì Môi-se đã truyền
  rationale: Giữ ý số nhiều tập hợp của đại từ quan hệ Hy Lạp bằng lối diễn đạt tiếng Việt tự nhiên.
- source_word: εἰς μαρτύριον αὐτοῖς
  choice: để làm chứng cho họ
  rationale: Giữ mục đích/kết quả và nghĩa chứng cứ của μαρτύριον, không tự ý thêm sắc thái “chống lại” vốn không được nói rõ trong câu.
theological_decisions:
- issue: Đối tượng và sắc thái của εἰς μαρτύριον αὐτοῖς
  choice: để làm chứng cho họ
  alternative: để làm bằng chứng chống lại họ
  rationale: Nguyên văn chỉ nói “cho/với họ”, có thể chỉ bằng chứng được trình cho các thầy tế lễ hoặc những người liên quan, và cũng có thể được hiểu theo sắc thái đối chứng mạnh hơn. Bản dịch chính giữ nguyên độ rộng của câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” cho chủ thể là Đức Giê-su và “anh” cho người được chữa lành; dùng “thầy tế lễ” để phân biệt chức vụ tư tế Do Thái với cách gọi linh mục trong một số truyền thống. Dấu chú thích [a] được đặt ngay sau câu có cụm từ cần giải thích.
