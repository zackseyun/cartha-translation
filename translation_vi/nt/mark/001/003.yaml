  to: 'Có tiếng một người kêu lớn trong hoang địa:


    “Hãy dọn đường cho Chúa[b];


    hãy làm thẳng các lối đi của Ngài.”[a]'
  rationale: Chỉnh sửa chỉ nhằm làm rõ quan hệ “tiếng của một người kêu lớn,” khôi phục rõ hình ảnh đường sá của τρίβους bằng “lối đi,” và chuẩn hóa dạng từ Hy Lạp trong chú thích. Cách gắn “trong hoang địa” với người kêu vẫn được giữ ở chính văn; cách ngắt câu thay thế vẫn được bảo tồn trong chú thích.
