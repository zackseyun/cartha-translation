  text: φωνὴ βοῶντος ἐν τῇ ἐρήμῳ· Ἑτοιμάσατε τὴν ὁδὸν κυρίου, εὐθείας ποιεῖτε τὰς τρίβους αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/003.yaml
  text: 'A voice of one crying out in the wilderness: ‘Prepare the way of the Lord[b][a]; make his paths straight,’'
translation:
  language: vi
  text: 'Có tiếng một người kêu lớn trong hoang địa:


    “Hãy dọn đường cho Chúa[b];


    hãy làm thẳng các lối đi của Ngài.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc, theo một cách ngắt câu khác trong lời trích Ê-sai: “Có tiếng một người kêu lớn: ‘Trong hoang địa, hãy dọn đường cho Chúa…’”'
    reason: alternative_reading
  - marker: b
    text: “Chúa” dịch từ từ Hy Lạp κυρίου; lời trích gợi lại Ê-sai 40:3, nơi bản Hê-bơ-rơ nói đến ĐỨC CHÚA (YHWH).
    reason: cross_reference
lexical_decisions:
- source_word: φωνὴ
  choice: Có tiếng
  rationale: Cách mở đầu tự nhiên trong tiếng Việt cho danh từ không có mạo từ, đồng thời giữ hình ảnh về một tiếng nói vang lên.
- source_word: βοῶντος
  choice: người kêu lớn
  rationale: Phân từ sở hữu phụ thuộc vào φωνή; “kêu lớn” thể hiện sắc thái công bố mạnh mẽ, rõ hơn “kêu gọi”.
- source_word: ἐν τῇ ἐρήμῳ
  choice: trong hoang địa
  rationale: “Hoang địa” chỉ vùng vắng vẻ, hoang vu và phù hợp cả bối cảnh của Giăng trong Mác lẫn âm hưởng lời trích Ê-sai; không thu hẹp nghĩa thành sa mạc cát.
- source_word: Ἑτοιμάσατε
  choice: Hãy dọn
  rationale: Mệnh lệnh số nhiều kêu gọi hành động dứt khoát; với “đường”, “dọn” là cách nói tự nhiên và giữ hình ảnh chuẩn bị tuyến đường.
- source_word: τὴν ὁδὸν
  choice: đường
  rationale: Giữ được cả nghĩa con đường thực và hàm ý tiên tri về việc chuẩn bị cho Chúa đến.
- source_word: κυρίου
  choice: cho Chúa
  rationale: Dù hình thức Hy Lạp là sở hữu cách, “dọn đường cho Chúa” tự nhiên trong tiếng Việt và diễn đạt đúng con đường được chuẩn bị để Chúa ngự đến.
- source_word: εὐθείας
  choice: thẳng
  rationale: Trong ngữ cảnh đường sá, từ này nói đến sự thẳng, không phải sự ngay thẳng về đạo đức.
- source_word: ποιεῖτε
  choice: hãy làm
  rationale: Diễn đạt trực tiếp mệnh lệnh hiện tại; tiếng Việt không cần đánh dấu riêng sắc thái thể của động từ.
- source_word: τὰς τρίβους αὐτοῦ
  choice: các lối của Ngài
  rationale: Giữ danh từ số nhiều và đại từ chỉ về Chúa. “Các lối” tự nhiên, đồng thời phân biệt nhẹ với “đường” ở vế trước.
theological_decisions:
- issue: Cách dịch κύριος trong lời trích Ê-sai mà bản Hê-bơ-rơ dùng YHWH
  choice: Chúa
  alternative: ĐỨC CHÚA
  rationale: Bản văn Hy Lạp dùng κύριος, nên chính văn giữ danh xưng “Chúa”. Chú thích nêu rõ nền tảng Ê-sai, nơi tiếng Hê-bơ-rơ nói đến YHWH, mà không đưa cách trình bày danh giao ước của bản Hê-bơ-rơ vào chính văn Hy Lạp.
- issue: Vị trí gắn kết của cụm “trong hoang địa”
  choice: Gắn với “người kêu lớn”
  alternative: Gắn với mệnh lệnh “Trong hoang địa, hãy dọn đường cho Chúa”
  rationale: Cú pháp trong Mác tự nhiên nhất là “tiếng người kêu lớn trong hoang địa”. Tuy nhiên, truyền thống ngắt câu lời Ê-sai cũng cho phép cách hiểu khác, nên giữ phương án ấy trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “hoang địa” để giữ sắc thái Kinh Thánh mà vẫn là từ ngữ hiện hành; dùng “Ngài” làm đại từ tôn kính chỉ về Chúa. Dấu chú thích [b] đặt ngay sau “Chúa”; [a] đặt cuối câu trích để chỉ phương án ngắt câu cho toàn cấu trúc.
