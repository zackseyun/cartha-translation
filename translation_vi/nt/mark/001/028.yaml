  text: ⸂καὶ ἐξῆλθεν⸃ ἡ ἀκοὴ αὐτοῦ εὐθὺς ⸀πανταχοῦ εἰς ὅλην τὴν περίχωρον τῆς Γαλιλαίας.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/028.yaml
  text: And the news about him went out at once everywhere into the whole surrounding region of Galilee[a][b].
translation:
  language: vi
  text: Tin về Ngài lập tức lan ra khắp cả vùng chung quanh Ga-li-lê.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Tin truyền về Ngài” hoặc “danh tiếng của Ngài.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθεν
  choice: lan ra
  rationale: Trong ngữ cảnh tin tức được truyền đi, “lan ra” diễn đạt tự nhiên chuyển động hướng ra ngoài của ἐξῆλθεν, dù sát chữ có thể là “đi ra”.
- source_word: ἡ ἀκοὴ αὐτοῦ
  choice: tin tức về Ngài
  rationale: ἀκοή ở đây chỉ điều người ta nghe, tức tin tức hay lời đồn về Đức Giê-su; αὐτοῦ được hiểu là nội dung liên quan đến Ngài, không nhất thiết là sở hữu.
- source_word: εὐθὺς
  choice: lập tức
  rationale: Giữ sắc thái tức thời đặc trưng trong lối kể của Mác bằng cách diễn đạt trang trọng nhưng thông dụng.
- source_word: πανταχοῦ
  choice: khắp
  rationale: Diễn đạt phạm vi rộng “mọi nơi”; trong tiếng Việt, kết hợp “khắp cả vùng” tự nhiên hơn việc dùng đồng thời “mọi nơi” và “toàn vùng”.
- source_word: εἰς ὅλην τὴν περίχωρον τῆς Γαλιλαίας
  choice: khắp cả vùng chung quanh Ga-li-lê
  rationale: “Khắp cả” chuyển tải phạm vi toàn thể, còn “vùng chung quanh Ga-li-lê” bảo tồn khả năng περίχωρος chỉ địa hạt bao quanh hoặc lân cận Ga-li-lê; tiếng Việt tự nhiên không cần tái hiện máy móc giới từ εἰς.
theological_decisions:
- issue: Nghĩa của ἀκοὴ αὐτοῦ
  choice: tin tức về Ngài
  alternative: danh tiếng của Ngài; lời đồn về Ngài
  rationale: “Tin tức” tập trung vào điều đang được truyền đi sau sự kiện vừa xảy ra, không thêm sắc thái nổi tiếng hoặc danh vọng vốn không bắt buộc trong ἀκοή.
- issue: Phạm vi của περίχωρον τῆς Γαλιλαίας
  choice: vùng chung quanh Ga-li-lê
  alternative: miền lân cận thuộc Ga-li-lê; toàn miền Ga-li-lê và vùng phụ cận
  rationale: Cấu trúc Hy Lạp có thể được hiểu là vùng chung quanh hoặc địa hạt lân cận gắn với Ga-li-lê. Bản dịch giữ cách nói tương đối mở, không xác quyết một ranh giới địa lý cụ thể.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” để chỉ Đức Giê-su theo ngữ cảnh tôn kính; “lan ra khắp cả vùng” là cách nói Việt tự nhiên, tránh cấu trúc gượng theo từng chữ Hy Lạp.
