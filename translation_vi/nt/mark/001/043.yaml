translation:
  language: vi
  text: Sau khi nghiêm khắc cảnh cáo anh[a], Người lập tức đuổi anh đi[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “sau khi nghiêm nghị căn dặn anh” hoặc “sau khi quở trách anh”; động từ Hy Lạp cũng có thể diễn tả sự phẫn nộ dữ dội hoặc một lời quở trách nghiêm khắc.'
    reason: lexical_alternative
  - marker: b
    text: 'Hay: “xua anh ra”; động từ Hy Lạp mạnh hơn cách nói trung tính “cho anh về”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Rồi
  rationale: Liên từ tiếp nối mạch kể. “Rồi” tự nhiên trong tiếng Việt và vẫn giữ nhịp tường thuật của Mác.
- source_word: ἐμβριμησάμενος
  choice: nghiêm khắc cảnh cáo
  rationale: Động từ diễn tả cảm xúc mạnh bộc lộ qua lời răn bảo nghiêm nghị, thậm chí có thể hàm ý phẫn nộ hoặc quở trách. Cách dịch này giữ cả sắc thái mạnh lẫn chức năng cảnh cáo trong ngữ cảnh.
- source_word: αὐτῷ
  choice: anh
  rationale: Đại từ ở cách cho chỉ người vừa được chữa lành; tiếng Việt diễn đạt tự nhiên như tân ngữ của “cảnh cáo”.
- source_word: εὐθὺς
  choice: lập tức
  rationale: Giữ rõ tính tức thời và nhịp kể nhanh đặc trưng của Mác.
- source_word: ἐξέβαλεν
  choice: đuổi ... đi
  rationale: Động từ mạnh hơn một cách nói trung tính như “cho về” hay “bảo đi”. “Đuổi ... đi” bảo toàn sức nặng của nguyên ngữ, dù trong ngữ cảnh không nhất thiết hàm ý thù nghịch.
- source_word: αὐτόν
  choice: anh
  rationale: Đại từ đối cách chỉ cùng người vừa được chữa lành.
theological_decisions:
- issue: Thái độ của Chúa Giê-su đối với người vừa được chữa lành
  choice: Giữ sắc thái nghiêm khắc và mạnh mẽ trong cả lời cảnh cáo lẫn việc cho người ấy rời đi.
  alternative: Dịch nhẹ hơn thành “dặn kỹ rồi cho anh về”, hoặc hiểu là Người quở trách chính con người ấy.
  rationale: Hai động từ Hy Lạp đều có sức biểu cảm mạnh. Bản dịch không làm nhẹ nét căng thẳng ấy, nhưng cũng không thêm kết luận rằng Người có thái độ thù nghịch hay lên án người ấy.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “Người” để chỉ Chúa Giê-su theo văn phong Kinh Thánh tự nhiên; “anh” chỉ người được chữa lành. Câu giữ nguyên dấu phẩy cuối vì đây là phần dẫn trực tiếp sang mệnh lệnh ở câu kế tiếp.
