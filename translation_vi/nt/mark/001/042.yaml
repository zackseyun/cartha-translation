  text: καὶ ⸀εὐθὺς ἀπῆλθεν ἀπ’ αὐτοῦ ἡ λέπρα, καὶ ἐκαθαρίσθη.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/042.yaml
  text: And immediately the leprosy left him[a], and he was cleansed.
translation:
  language: vi
  text: Ngay lập tức, bệnh phong hủi rời khỏi ông, và ông được thanh sạch.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “được làm cho sạch.” Động từ này không chỉ nói đến sự khỏi bệnh về thể chất mà còn mang nghĩa được thanh sạch về nghi lễ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθὺς
  choice: ngay lập tức
  rationale: Diễn đạt rõ tính tức thời và giữ nhịp kể khẩn trương đặc trưng của sách Mác.
- source_word: ἀπῆλθεν ἀπ’ αὐτοῦ
  choice: rời khỏi ông
  rationale: Giữ hình ảnh căn bệnh lìa khỏi người ấy, đồng thời là cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: ἡ λέπρα
  choice: bệnh phong hủi
  rationale: Đây là cách gọi quen thuộc trong ngữ cảnh Kinh Thánh; thuật ngữ Hy Lạp có thể chỉ nhiều loại bệnh da nghiêm trọng hơn phạm vi bệnh Hansen hiện đại.
- source_word: ἐκαθαρίσθη
  choice: ông được thanh sạch
  rationale: 'Giữ thể bị động và cả hai sắc thái: khỏi tình trạng bệnh tật và được phục hồi khỏi tình trạng ô uế theo nghi lễ.'
theological_decisions:
- issue: Mối liên hệ giữa sự chữa lành thể chất và sự thanh sạch theo nghi lễ trong καθαρίζω
  choice: ông được thanh sạch
  alternative: ông được chữa lành; ông được làm cho sạch
  rationale: Bản dịch không thu hẹp ý nghĩa vào sự khỏi bệnh về thể chất, nhưng cũng không thêm một tuyên bố thần học vượt quá câu gốc.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Ngay lập tức” bảo toàn tính khẩn trương; “được thanh sạch” giữ sắc thái Kinh Thánh mà không quá cổ hoặc chuyên biệt.
