  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸂καὶ ἦν⸃ ὁ Ἰωάννης ἐνδεδυμένος τρίχας καμήλου καὶ ζώνην δερματίνην περὶ τὴν ὀσφὺν αὐτοῦ, καὶ ἔσθων ἀκρίδας καὶ μέλι ἄγριον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/006.yaml
  text: John was clothed with camel’s hair and a leather belt around his waist[a], and he was eating locusts and wild honey.
translation:
  language: vi
  text: Giăng mặc áo bằng lông lạc đà, thắt đai da quanh eo[a], và ăn châu chấu cùng mật ong rừng.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Trang phục của Giăng gợi lại lời mô tả về Ê-li trong 2 Các Vua 1:8, góp phần trình bày Giăng như vị tiên tri đi trước dọn đường.
    reason: cross_reference
lexical_decisions:
- source_word: ἐνδεδυμένος
  choice: mặc
  rationale: Phân từ hoàn thành diễn tả trạng thái Giăng đang ở trong y phục ấy; “mặc” là cách nói tự nhiên trong tiếng Việt và vẫn giữ được ý trạng thái trong câu miêu tả.
- source_word: τρίχας καμήλου
  choice: áo bằng lông lạc đà
  rationale: Cụm Hy Lạp nêu chất liệu là lông lạc đà, không phải da lạc đà. Tiếng Việt cần thêm “áo bằng” để câu rõ nghĩa và tự nhiên.
- source_word: ζώνην δερματίνην
  choice: đai da
  rationale: Diễn đạt trực tiếp một chiếc đai làm bằng da; “đai” phù hợp với loại vật dụng quấn quanh eo trong bối cảnh cổ đại.
- source_word: περὶ τὴν ὀσφὺν αὐτοῦ
  choice: thắt ... quanh eo
  rationale: ὀσφύς chỉ vùng eo/hông. Cách diễn đạt này rõ ràng, hiện đại và tránh từ cổ “lưng” hoặc “thắt lưng” có thể bị hiểu là chính chiếc đai.
- source_word: ἔσθων
  choice: ăn
  rationale: Phân từ hiện tại trong chân dung miêu tả cho biết thức ăn thường dùng của Giăng. Tiếng Việt dùng “ăn” tự nhiên hơn dạng kéo dài “đang ăn”, vốn dễ gợi một hành động tức thời.
- source_word: ἀκρίδας
  choice: châu chấu
  rationale: Nghĩa từ vựng thông thường là loài côn trùng châu chấu; ngữ cảnh không đòi hỏi cách hiểu khác.
- source_word: μέλι ἄγριον
  choice: mật ong rừng
  rationale: Chỉ mật ong có trong thiên nhiên hoang dã; “mật ong rừng” là cách nói tự nhiên và thông dụng trong tiếng Việt.
- source_word: καὶ ἦν
  choice: Giăng mặc
  rationale: καί nối tiếp mạch kể. Không thêm “bấy giờ” hay “nay” vì nguyên văn không có từ chỉ thời gian tương ứng; tiếng Việt có thể nối mạch tự nhiên mà không cần dịch máy móc liên từ đầu câu.
theological_decisions:
- issue: Trang phục và thức ăn của Giăng liên hệ với hình ảnh tiên tri
  choice: Chỉ dịch nội dung miêu tả trong chính câu, không gọi Giăng là Ê-li trong chính văn.
  alternative: Đưa sự liên hệ với Ê-li vào chính văn.
  rationale: Trang phục gợi lại hình ảnh Ê-li trong 2 Các Vua 1:8, nhưng Mác 1:6 không nói rõ sự đồng nhất ấy. Chú thích có thể nêu liên văn bản mà không biến suy luận thành lời của câu Kinh Thánh.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Áo bằng lông lạc đà” làm rõ chất liệu; “đai da quanh eo” và “mật ong rừng” là cách diễn đạt tự nhiên trong tiếng Việt phổ thông.
