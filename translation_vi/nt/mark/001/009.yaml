source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ἐν ἐκείναις ταῖς ἡμέραις ἦλθεν Ἰησοῦς ἀπὸ Ναζαρὲτ τῆς Γαλιλαίας καὶ ἐβαπτίσθη ⸂εἰς τὸν Ἰορδάνην ὑπὸ Ἰωάννου⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/009.yaml
  text: And it happened in those days that Jesus came from Nazareth of Galilee and was baptized in the Jordan by John[a].
translation:
  language: vi
  text: Trong những ngày ấy, Giê-su từ Na-xa-rét, miền Ga-li-lê, đến và được Giăng làm phép báp-têm trong sông Giô-đanh[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “vào trong sông Giô-đanh.” Giới từ Hy Lạp có thể được dịch sát hơn theo cách này.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ ἐγένετο
  choice: Trong những ngày ấy
  rationale: Thành ngữ chuyển tiếp kể chuyện được diễn đạt tự nhiên bằng cách mở đầu trực tiếp với trạng ngữ thời gian; dịch sát kiểu “và xảy ra rằng” sẽ gượng trong tiếng Việt hiện đại.
- source_word: ἐν ἐκείναις ταῖς ἡμέραις
  choice: trong những ngày ấy
  rationale: Giữ nguyên nét chỉ thời gian và sắc thái kể chuyện trang trọng vừa phải của nguyên văn.
- source_word: ἦλθεν
  choice: đến
  rationale: Diễn đạt đúng động từ chuyển động cơ bản mà không thêm sắc thái nhấn mạnh việc tới nơi.
- source_word: Ἰησοῦς
  choice: Đức Giê-su
  rationale: Dùng dạng tên quen thuộc trong tiếng Việt; “Đức” là kính ngữ tự nhiên, không thêm tước hiệu thần học như “Chúa” vào chỗ nguyên văn chỉ có tên riêng.
- source_word: ἀπὸ Ναζαρὲτ τῆς Γαλιλαίας
  choice: từ Na-xa-rét thuộc miền Ga-li-lê
  rationale: Diễn đạt rõ quan hệ địa lý của kết cấu sở hữu cách, tự nhiên hơn lối dịch sát “Na-xa-rét của Ga-li-lê”.
- source_word: ἐβαπτίσθη
  choice: được ông Giăng làm phép báp-têm
  rationale: Giữ thể bị động và tác nhân của hành động, đồng thời dùng thuật ngữ rộng rãi, không thu hẹp phương thức thành “dìm mình”.
- source_word: εἰς τὸν Ἰορδάνην
  choice: trong sông Giô-đanh
  rationale: Trong ngữ cảnh phép báp-têm, “trong sông” diễn đạt địa điểm tự nhiên bằng tiếng Việt; sắc thái chuyển động thường có của εἰς được bảo lưu ở chú thích.
- source_word: ὑπὸ Ἰωάννου
  choice: được ông Giăng làm
  rationale: Thể hiện rõ tác nhân đi với động từ bị động; “ông” giúp câu tiếng Việt tự nhiên và không gán cho Giăng một tước hiệu ngoài nguyên văn.
theological_decisions:
- issue: Cách dịch βαπτίζω trong bối cảnh có khác biệt giáo phái
  choice: làm phép báp-têm
  alternative: dìm xuống
  rationale: “Làm phép báp-têm” thuật lại sự kiện mà không quyết định thay nguyên văn về phương thức nghi lễ; “dìm xuống” sẽ đưa vào mức độ cụ thể dễ mang tính hệ phái.
- issue: Kính ngữ đi với tên Ἰησοῦς
  choice: Đức Giê-su
  alternative: Chúa Giê-su
  rationale: “Đức” duy trì văn phong kính trọng tự nhiên trong tiếng Việt mà không thêm danh xưng κύριος vốn không xuất hiện trong câu này.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Địa danh được phiên âm theo lối quen thuộc trong văn bản Kinh Thánh tiếng Việt. Câu tránh lối dịch máy móc “và xảy ra rằng”, đồng thời giữ nhịp chuyển cảnh của trình thuật.
