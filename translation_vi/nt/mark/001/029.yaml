id: MRK.1.29
reference: Mark 1:29
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Καὶ ⸀εὐθὺς ἐκ τῆς συναγωγῆς ⸂ἐξελθόντες ἦλθον⸃ εἰς τὴν οἰκίαν Σίμωνος καὶ Ἀνδρέου μετὰ Ἰακώβου καὶ Ἰωάννου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/029.yaml
  text: And immediately, after leaving the synagogue, they came into the house of Simon and Andrew, with James and John.
translation:
  language: vi
  text: Ngay sau khi ra khỏi hội đường, họ đi vào nhà của Si-môn và Anh-rê, cùng với Gia-cơ và Giăng.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐθὺς
  choice: ngay
  rationale: Giữ nhịp kể nhanh, đặc trưng của Mác, bằng một trạng từ tự nhiên trong tiếng Việt hiện đại.
- source_word: ἐκ τῆς συναγωγῆς
  choice: ra khỏi hội đường
  rationale: “Ra khỏi” thể hiện rõ hướng chuyển động từ bên trong ra ngoài; “hội đường” là cách gọi quen thuộc cho nơi nhóm họp Do Thái.
- source_word: ἐξελθόντες ἦλθον
  choice: sau khi ra khỏi ... họ đi vào
  rationale: 'Cấu trúc này giữ đúng trình tự của phân từ quá khứ và động từ chính: trước hết họ ra khỏi hội đường, rồi đi vào nhà.'
- source_word: ἦλθον
  choice: họ đi
  rationale: Động từ ἔρχομαι có thể được dịch là “đến” hoặc “đi” tùy điểm nhìn; trong mạch kể tiếng Việt, “đi vào” tự nhiên khi chủ thể rời hội đường để tới địa điểm khác.
- source_word: εἰς τὴν οἰκίαν
  choice: vào nhà
  rationale: “Vào” bảo toàn sắc thái chuyển động vào bên trong của εἰς; “nhà” là cách diễn đạt gọn và tự nhiên.
- source_word: Σίμωνος καὶ Ἀνδρέου
  choice: của Si-môn và Anh-rê
  rationale: Hai sở hữu cách xác định ngôi nhà gắn với cả Si-môn lẫn Anh-rê.
- source_word: μετὰ Ἰακώβου καὶ Ἰωάννου
  choice: cùng với Gia-cơ và Giăng
  rationale: Diễn đạt trực tiếp ý đồng hành của μετά với sở hữu cách.
- source_word: Σίμωνος / Ἀνδρέου / Ἰακώβου / Ἰωάννου
  choice: Si-môn / Anh-rê / Gia-cơ / Giăng
  rationale: Dùng các dạng tên riêng đã quen thuộc trong truyền thống Kinh Thánh tiếng Việt, đồng thời dễ nhận biết đối với độc giả phổ thông.
