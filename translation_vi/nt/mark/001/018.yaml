  yaml_path: translation/nt/mark/001/018.yaml
  text: And immediately they left the nets and followed him[a].
translation:
  language: vi
  text: Và lập tức họ bỏ lưới rồi đi theo Ngài.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: Và
  rationale: Giữ liên từ đơn giản, phản ánh nhịp kể liên tục đặc trưng của Mác mà không thêm sắc thái diễn giải.
- source_word: εὐθὺς
  choice: lập tức
  rationale: Diễn đạt rõ sự mau chóng và khẩn trương; tự nhiên trong tiếng Việt hiện đại.
- source_word: ἀφέντες
  choice: bỏ ... lại
  rationale: Phân từ bất định chỉ hành động xảy ra trước động từ chính. Cách diễn đạt này tự nhiên trong tiếng Việt và không mang sắc thái mạnh quá mức như “từ bỏ” hay “ruồng bỏ”.
- source_word: τὰ δίκτυα
  choice: lưới
  rationale: Danh từ số nhiều chỉ các tấm lưới đánh cá. Tiếng Việt dùng danh từ không biến đổi theo số; không thêm “của mình” vì nguyên văn không nói rõ.
- source_word: ἠκολούθησαν
  choice: đi theo
  rationale: Giữ được cả nghĩa di chuyển theo sau lẫn hàm ý môn đồ đang hình thành trong ngữ cảnh, nhưng không diễn giải thành “trở nên môn đồ”.
- source_word: αὐτῷ
  choice: Ngài
  rationale: Đại từ chỉ Chúa Giê-su trong ngữ cảnh gần. Dùng đại từ tôn kính quen thuộc trong văn phong Kinh Thánh tiếng Việt thay vì thay bằng tên riêng.
theological_decisions:
- issue: Hàm ý môn đồ trong ἠκολούθησαν
  choice: đi theo Ngài
  alternative: trở thành môn đồ của Ngài
  rationale: Động từ vừa mô tả hành động theo sau vừa để ý nghĩa môn đồ bộc lộ qua ngữ cảnh. Không mở rộng thành một lời giải thích thần học vượt quá câu chữ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Trật tự “bỏ lưới lại mà đi theo” thể hiện hành động bỏ lưới xảy ra trước rồi họ theo Chúa Giê-su; không cần chú thích vì “lập tức” chuyển tải trực tiếp εὐθὺς.
