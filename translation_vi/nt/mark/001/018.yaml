  source_fidelity: Bản dịch chuyển tải đúng liên từ καὶ, trạng từ εὐθύς, hành động trước của phân từ ἀφέντες, «lưới», và hành động «đi theo» với đại từ tôn kính chỉ Chúa Giê-su. Tuy nhiên, cụm «bỏ lưới lại» không tự nhiên trong tiếng Việt hiện đại; từ «lại» ở đây không cần thiết và có thể tạo một sắc thái không rõ trong khi nguyên văn chỉ nói họ để/bỏ các tấm lưới.
