source:
  edition: SBLGNT
  text: Καὶ ἔρχεται πρὸς αὐτὸν λεπρὸς παρακαλῶν αὐτὸν καὶ ⸀γονυπετῶν λέγων αὐτῷ ὅτι Ἐὰν θέλῃς δύνασαί με καθαρίσαι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/040.yaml
  text: And a man with leprosy comes to him[a], pleading with him and kneeling, and saying to him, “If you are willing[d][c][b], you are able to make me clean.”
translation:
  language: vi
  text: 'Có một người mắc bệnh phong đến gặp Đức Giê-su[a], khẩn cầu Ngài, quỳ xuống và thưa: “Nếu Ngài muốn, Ngài có thể làm cho tôi được sạch.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tiếng Hy Lạp dùng một từ có thể dịch sát là “một người bị phong”; thuật ngữ này có thể chỉ nhiều chứng bệnh ngoài da nghiêm trọng, không nhất thiết hoàn toàn trùng với bệnh Hansen theo y học hiện đại.
    reason: lexical_alternative
  - marker: b
    text: Hay “thanh tẩy tôi.” Động từ Hy Lạp có thể nói đến việc được sạch khỏi tình trạng ô uế cũng như sự phục hồi về thân thể.
    reason: lexical_alternative
lexical_decisions:
- source_word: λεπρὸς
  choice: một người mắc bệnh phong
  rationale: Dùng cách diễn đạt đặt con người trước tình trạng bệnh, tự nhiên trong tiếng Việt hiện đại; đồng thời không thu hẹp thuật ngữ cổ vào định nghĩa y khoa hiện đại một cách tuyệt đối.
- source_word: παρακαλῶν
  choice: khẩn cầu
  rationale: Diễn tả lời cầu xin tha thiết trong ngữ cảnh này mà không thêm mức độ tuyệt vọng không có trong bản văn.
- source_word: γονυπετῶν
  choice: quỳ xuống
  rationale: Truyền đạt trực tiếp tư thế được động từ Hy Lạp diễn tả, tự nhiên và rõ ràng trong tiếng Việt.
- source_word: Ἐὰν θέλῃς
  choice: Nếu Ngài muốn
  rationale: Giữ nguyên điều kiện liên quan đến ý muốn hoặc sự sẵn lòng của Đức Giê-su, thay vì biến thành nghi vấn về quyền năng.
- source_word: δύνασαί
  choice: Ngài có thể
  rationale: Diễn tả năng lực hay quyền năng bằng cách nói tự nhiên trong tiếng Việt.
- source_word: καθαρίσαι
  choice: làm cho tôi được sạch
  rationale: Giữ hình ảnh 'sạch' của καθαρίζω, bao hàm cả sự phục hồi thân thể và tình trạng thanh sạch, thay vì thu hẹp thành 'chữa lành'.
- source_word: ἔρχεται
  choice: đến gặp
  rationale: Tiếng Việt không bắt buộc đánh dấu thì; cách dịch này giữ nhịp kể sống động của hiện tại lịch sử trong Mác và làm rõ hướng đến Đức Giê-su.
theological_decisions:
- issue: Bản chất của việc được làm sạch trong bối cảnh bệnh phong
  choice: làm cho tôi được sạch
  alternative: chữa lành cho tôi
  rationale: Bản văn dùng động từ chỉ sự làm sạch chứ không dùng động từ chữa lành thông thường; lựa chọn này giữ được sự giao thoa giữa phục hồi thân thể và thanh sạch theo nghi lễ.
- issue: Ý nghĩa của điều kiện Ἐὰν θέλῃς
  choice: Nếu Ngài muốn
  alternative: Nếu Ngài sẵn lòng
  rationale: Cách dịch chính tự nhiên và giữ nguyên trọng tâm vào ý muốn của Đức Giê-su; phương án kia làm nổi bật sắc thái sẵn lòng nhưng có phần diễn giải hơn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Giê-su” và đại từ kính trọng “Ngài”; lời của người bệnh dùng “tôi” để tự nhiên, không gán thêm địa vị xã hội. Cấu trúc các phân từ được chuyển thành chuỗi hành động trôi chảy trong tiếng Việt.
