  verdict: revise
  source_fidelity: 'Bản dịch truyền đạt đúng các yếu tố chính của câu: người mắc bệnh phong đến với Đức Giê-su, khẩn cầu, quỳ, và nói lời điều kiện đặt trọng tâm nơi ý muốn của Ngài; “làm cho tôi được sạch” giữ đúng động từ καθαρίσαι và không thu hẹp thành chỉ chữa bệnh. Bản sửa chỉ làm rõ đối tượng của παρακαλῶν αὐτόν và làm câu tiếng Việt trôi chảy hơn.'
  naturalness: Câu dự thảo nhìn chung tự nhiên, trang trọng và phù hợp tiếng Việt hiện đại. Tuy nhiên, “khẩn cầu” không nêu rõ đối tượng dù nguyên ngữ nêu rõ là khẩn cầu Ngài; đặt “Ngài” ngay sau động từ giúp liên kết hành động rõ hơn. Bỏ “với Ngài” sau “thưa” cũng tự nhiên hơn khi đại từ kính trọng đã được dùng trong lời thưa.
  terminology: “Đức Giê-su,” “Ngài,” “người mắc bệnh phong,” và “làm cho tôi được sạch” phù hợp văn phong Kinh Thánh tiếng Việt hiện đại. Chú thích về phạm vi lịch sử của λεπρός hữu ích và không đồng nhất võ đoán với bệnh Hansen. “Thanh tẩy tôi” là phương án chú thích thích hợp để duy trì chiều kích thanh sạch/nghi lễ mà không áp đặt diễn giải.
