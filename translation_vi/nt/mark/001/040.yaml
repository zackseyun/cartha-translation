revisions:
- from: 'Có một người mắc bệnh phong đến gặp Đức Giê-su[a], khẩn cầu và quỳ xuống, thưa với Ngài: “Nếu Ngài muốn, Ngài có thể làm cho tôi được sạch.”[b]'
  to: 'Có một người mắc bệnh phong đến gặp Đức Giê-su[a], khẩn cầu Ngài, quỳ xuống và thưa: “Nếu Ngài muốn, Ngài có thể làm cho tôi được sạch.”[b]'
  rationale: Bản sửa hoàn chỉnh giữ nguyên nghĩa và trật tự hành động của nguyên ngữ, đồng thời nêu rõ rằng lời khẩn cầu hướng đến Đức Giê-su. Chú thích a được chỉnh nhẹ từ “một người phong” thành “một người bị phong” để câu tiếng Việt tự nhiên hơn, vẫn phản ánh cách dùng tính từ Hy Lạp như danh từ và vẫn bảo lưu bất định về chẩn đoán y học hiện đại.
  reviewer_model: gpt-5.6-terra
