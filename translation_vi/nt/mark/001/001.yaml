  - severity: low
    issue: “Khởi đầu tin mừng” thiếu từ nối sở hữu trong tiếng Việt.
    rationale: τοῦ εὐαγγελίου là quan hệ sở hữu/phụ thuộc với Ἀρχή; “Khởi đầu của tin mừng” rõ và tự nhiên hơn mà không biến lời mở đầu thành một câu hoàn chỉnh.
