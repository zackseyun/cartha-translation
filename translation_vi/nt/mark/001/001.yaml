  text: Ἀρχὴ τοῦ εὐαγγελίου Ἰησοῦ ⸀χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/001.yaml
  text: The beginning of the good news of Jesus the Messiah[a][b].
translation:
  language: vi
  text: Khởi đầu của tin mừng[a] của Giê-su, Đấng Mê-si-a[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “phúc âm.” Từ Hy Lạp εὐαγγέλιον có nghĩa là “tin mừng” và theo truyền thống thường được dịch là “phúc âm.”
    reason: lexical_alternative
  - marker: b
    text: Hay “Giê-su Ki-tô.” Từ Hy Lạp Χριστός có nghĩa là “Đấng Mê-si-a” khi được dùng như một tước hiệu.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀρχὴ
  choice: Khởi đầu
  rationale: Giữ dạng cụm danh từ ngắn gọn như nguyên văn, có thể được hiểu như lời mở đầu hoặc tiêu đề, mà không bổ sung động từ.
- source_word: εὐαγγελίου
  choice: tin mừng
  rationale: Chuyển tải trực tiếp nghĩa của từ Hy Lạp bằng cách diễn đạt tự nhiên, dễ hiểu trong tiếng Việt hiện đại; cách gọi truyền thống “phúc âm” được ghi ở chú thích.
- source_word: Ἰησοῦ
  choice: Giê-su
  rationale: Phiên âm tên riêng theo cách viết tiếng Việt thông dụng.
- source_word: χριστοῦ
  choice: Đấng Mê-si-a
  rationale: Dịch Χριστός như một tước hiệu, qua đó giữ rõ ý nghĩa chỉ vị vua được xức dầu, thay vì khiến từ này bị hiểu như họ của Giê-su.
theological_decisions:
- issue: Nên dịch Χριστός như một tước hiệu hay giữ dạng tên gọi truyền thống
  choice: Đấng Mê-si-a
  alternative: Giê-su Ki-tô
  rationale: Trong câu mở đầu này, Χριστός xác định vai trò của Giê-su là Đấng Mê-si-a. Bản dịch chính làm rõ tước hiệu ấy, còn cách gọi truyền thống được giữ trong chú thích.
- issue: Quan hệ của cụm sở hữu εὐαγγελίου Ἰησοῦ χριστοῦ
  choice: tin mừng về Giê-su, Đấng Mê-si-a
  alternative: tin mừng của Giê-su, Đấng Mê-si-a
  rationale: “Về” diễn đạt tự nhiên nhất việc Giê-su là nội dung của tin mừng trong ngữ cảnh mở đầu sách. Tuy nhiên, kết cấu sở hữu Hy Lạp tự nó có thể rộng hơn cách diễn đạt tiếng Việt này; không nên suy ra từ riêng câu này rằng Giê-su không đồng thời là nguồn hay người công bố tin mừng.
translation_notes:
  register: Văn phong ngắn gọn, trang trọng nhưng hiện đại. Không thêm đại từ tôn xưng như “Đức” hay “Chúa” vì nguyên văn không có; dùng “tin mừng” thay cho thuật ngữ dễ gắn với một truyền thống hệ phái cụ thể.
