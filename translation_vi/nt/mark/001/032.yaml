  rationale: 'Chỉnh sửa thuần về tính tự nhiên của tiếng Việt: thay “Chiều đến” bằng “Đến chiều” và “đưa đến với Ngài” bằng “đem đến cho Ngài”. Bản sửa bảo toàn đầy đủ cấu trúc thời gian, phạm vi “tất cả”, và hai nhóm người song song trong tiếng Hy Lạp. Chú thích vẫn nêu một lựa chọn từ vựng mà không áp đặt cơ chế hay mức độ cụ thể ngoài δαιμονιζομένους.'
