  text: Ὀψίας δὲ γενομένης, ὅτε ⸀ἔδυ ὁ ἥλιος, ἔφερον πρὸς αὐτὸν πάντας τοὺς κακῶς ἔχοντας καὶ τοὺς δαιμονιζομένους·
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/032.yaml
  text: When evening came[a], when the sun had set[d][c][b], they brought to him all who were sick and those who were demon-possessed.
translation:
  language: vi
  text: Đến chiều, khi mặt trời đã lặn, người ta đem đến cho Ngài tất cả những người đau ốm và những người bị quỷ ám.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “những người chịu tác động của quỷ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὀψίας δὲ γενομένης
  choice: Chiều đến
  rationale: Diễn đạt tự nhiên kết cấu sở hữu cách tuyệt đối chỉ sự chuyển tiếp thời gian, vẫn giữ rõ ý buổi chiều bắt đầu.
- source_word: ὅτε ἔδυ ὁ ἥλιος
  choice: khi mặt trời đã lặn
  rationale: “Khi” phản ánh trực tiếp ὅτε; “đã lặn” cho thấy việc mặt trời lặn đã xảy ra vào thời điểm người ta bắt đầu đưa người bệnh đến.
- source_word: ἔφερον
  choice: người ta đưa
  rationale: Chủ thể không xác định được diễn đạt tự nhiên bằng “người ta”. Trong tiếng Việt, động từ không biến đổi theo thì; ngữ cảnh kể chuyện cho phép hình dung hành động đang tiếp diễn mà không cần thêm từ có thể làm quá nghĩa như “liên tục” hoặc “lần lượt”.
- source_word: πρὸς αὐτὸν
  choice: đến với Ngài
  rationale: Diễn tả chuyển động hướng đến một người. “Ngài” giữ đại từ của nguyên văn, không tự ý lặp lại tên Chúa Giê-su.
- source_word: πάντας τοὺς κακῶς ἔχοντας
  choice: tất cả những người đau ốm
  rationale: Thành ngữ Hy Lạp chỉ những người ở trong tình trạng không khỏe; “đau ốm” rõ ràng, tự nhiên và giữ sức bao quát của πάντας.
- source_word: τοὺς δαιμονιζομένους
  choice: những người bị quỷ ám
  rationale: “Bị quỷ ám” là cách nói tiếng Việt thông dụng để chỉ người chịu tác động hoặc quyền lực của quỷ, không đồng nhất hiện tượng này với bệnh tật.
theological_decisions:
- issue: Cách dịch δαιμονιζομένους mà không phủ nhận hoạt động của quỷ hoặc xác định quá mức cơ chế của hoạt động ấy
  choice: những người bị quỷ ám
  alternative: những người chịu sự chi phối của quỷ
  rationale: Bản dịch giữ nguyên sự phân biệt trong câu giữa người đau ốm và người chịu tác động của quỷ. Chú thích nêu một cách diễn đạt rộng hơn vì động từ Hy Lạp không tự nó trình bày chi tiết mức độ hay cơ chế của sự chi phối.
- issue: Thể chưa hoàn thành của ἔφερον
  choice: người ta đưa
  alternative: người ta cứ đưa đến
  rationale: Tiếng Việt không bắt buộc đánh dấu thể bằng hình thái động từ. Cách dịch không thêm “cứ” tránh hàm ý nhấn mạnh không có trong câu, trong khi mạch kể vẫn có thể biểu thị hành động đang diễn ra.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cấu trúc “Chiều đến, khi mặt trời đã lặn” giữ hai mệnh đề thời gian của nguyên văn mà vẫn tự nhiên trong tiếng Việt; các nhóm người được diễn đạt song song.
