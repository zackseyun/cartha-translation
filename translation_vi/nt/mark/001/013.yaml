    rationale: πειραζόμενος ὑπὸ τοῦ Σατανᾶ có nghĩa trực tiếp là “bị Sa-tan cám dỗ/thử thách.” “Chịu” có thể hiểu được, nhưng “bị” vừa tự nhiên vừa sát cấu trúc nguồn hơn.
  - severity: low
    issue: Hành động phục vụ liên tục của thiên sứ chưa được biểu đạt rõ.
    rationale: διηκόνουν là thì chưa hoàn thành, mô tả hành động đang/tiếp diễn trong khung cảnh ấy. “Đang phục vụ” biểu đạt sắc thái này rõ hơn.
  revised_text: Ngài ở trong hoang địa bốn mươi ngày và bị Sa-tan cám dỗ. Ngài ở với các thú hoang, và các thiên sứ đang phục vụ Ngài.
