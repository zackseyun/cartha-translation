source:
  edition: SBLGNT
  text: καὶ ⸀ἦν ἐν τῇ ἐρήμῳ ⸂τεσσεράκοντα ἡμέρας⸃ πειραζόμενος ὑπὸ τοῦ Σατανᾶ, καὶ ἦν μετὰ τῶν θηρίων, καὶ οἱ ἄγγελοι διηκόνουν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/013.yaml
  text: And he was in the wilderness forty days[a], being tempted by Satan; and he was with the wild animals, and the angels were ministering to him.
translation:
  language: vi
  text: Ngài ở trong hoang địa bốn mươi ngày và bị Sa-tan cám dỗ. Ngài ở với các thú hoang, và các thiên sứ đang phục vụ Ngài.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐρήμῳ
  choice: hoang địa
  rationale: Diễn đạt một vùng hoang vắng, không nhất thiết là sa mạc đầy cát, đồng thời giữ âm hưởng Kinh Thánh của nơi thử thách.
- source_word: τεσσεράκοντα ἡμέρας
  choice: bốn mươi ngày
  rationale: Dịch trực tiếp cụm chỉ khoảng thời gian, không diễn giải thêm ý nghĩa biểu tượng.
- source_word: πειραζόμενος
  choice: chịu ... cám dỗ
  rationale: Động từ có thể mang nghĩa cám dỗ hoặc thử thách; vì Sa-tan là tác nhân, “cám dỗ” tự nhiên và phù hợp hơn trong ngữ cảnh, còn nghĩa kia được giữ trong chú thích.
- source_word: ὑπὸ τοῦ Σατανᾶ
  choice: Sa-tan
  rationale: Dùng tên gọi đã quen thuộc trong tiếng Việt cho nhân vật đối nghịch siêu nhiên.
- source_word: μετὰ τῶν θηρίων
  choice: ở cùng các thú hoang
  rationale: Giữ sát cấu trúc “ở cùng” và diễn đạt rõ các loài vật hoang dã trong khung cảnh ấy.
- source_word: ἄγγελοι
  choice: các thiên sứ
  rationale: Ngữ cảnh siêu nhiên cho thấy đây là các sứ giả trên trời, không phải sứ giả loài người.
- source_word: διηκόνουν αὐτῷ
  choice: phục vụ Ngài
  rationale: Diễn đạt hành động phục vụ đang diễn ra theo thì chưa hoàn thành, bằng ngôn ngữ tự nhiên và trang trọng vừa phải.
- source_word: καὶ ἦν ... καὶ ἦν ... καὶ
  choice: Ngài ở ... Ngài ở ... và ...
  rationale: Giữ phần lớn lối kể nối tiếp, đơn giản đặc trưng của Mác, nhưng chia câu để tiếng Việt rõ và tự nhiên.
theological_decisions:
- issue: Sắc thái của πειραζόμενος khi Sa-tan là tác nhân
  choice: chịu Sa-tan cám dỗ
  alternative: bị Sa-tan thử thách
  rationale: Từ Hy Lạp thực sự có thể chỉ cả cám dỗ lẫn thử thách. Tác nhân Sa-tan khiến “cám dỗ” có khả năng cao hơn, nhưng chú thích vẫn bảo lưu cách hiểu “thử thách” thay vì xóa bỏ sự nhập nhằng.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, rõ ràng và trang trọng vừa phải. Dùng “Ngài” để chỉ Chúa Giê-su theo văn phong Kinh Thánh Việt ngữ phổ thông; “hoang địa” giữ sắc thái địa lý và thần học mà không giới hạn thành sa mạc cát.
