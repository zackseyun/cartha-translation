  to: Ngài ở trong hoang địa bốn mươi ngày và bị Sa-tan cám dỗ. Ngài ở với các thú hoang, và các thiên sứ đang phục vụ Ngài.
  rationale: Sửa “chịu Sa-tan cám dỗ” thành “bị Sa-tan cám dỗ” để phản ánh rõ tác nhân được nêu bằng ὑπό trong tiếng Hy Lạp. Thêm “đang” với “phục vụ” để giữ sắc thái tiếp diễn của thì chưa hoàn thành. Các lựa chọn “hoang địa,” “thú hoang,” “thiên sứ,” cùng chú thích về “thử thách,” đều được giữ vì trung thành với nguồn và phù hợp tiếng Việt tiêu chuẩn hiện đại.
  reviewer_model: gpt-5.6-terra
