  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸂Καὶ μετὰ⸃ τὸ παραδοθῆναι τὸν Ἰωάννην ἦλθεν ὁ Ἰησοῦς εἰς τὴν Γαλιλαίαν κηρύσσων τὸ ⸀εὐαγγέλιον τοῦ θεοῦ
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/014.yaml
  text: And after John was handed over[a], Jesus came into Galilee[c][b], proclaiming the good news of God.
translation:
  language: vi
  text: Sau khi Giăng bị giao nộp[a], Giê-su đến miền Ga-li-lê và rao truyền tin mừng của Đức Chúa Trời[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hoặc “sau khi Giăng bị bắt”. Nguyên văn Hy Lạp sát hơn là “sau khi Giăng bị giao nộp”; cách nói này cũng vọng lại từ ngữ Mác dùng về cuộc thương khó ở phần sau.
    reason: lexical_alternative
  - marker: b
    text: Hoặc “phúc âm của Đức Chúa Trời”.
    reason: lexical_alternative
  - marker: c
    text: Cụm từ “của Đức Chúa Trời” có thể chỉ tin mừng đến từ Đức Chúa Trời, thuộc về Ngài hoặc có Ngài làm trọng tâm.
    reason: alternative_reading
lexical_decisions:
- source_word: μετὰ τὸ παραδοθῆναι
  choice: sau khi ... bị giao nộp
  rationale: Cấu trúc với μετά chỉ thời gian, nghĩa là “sau khi”. “Bị giao nộp” giữ được nghĩa rộng của παραδίδωμι và mối liên hệ bằng từ ngữ với những lần Mác dùng động từ này trong trình thuật thương khó; “bị bắt” tự nhiên hơn nhưng diễn giải cụ thể hơn nguyên văn.
- source_word: Ἰωάννην
  choice: Giăng
  rationale: Dùng dạng tên gọi Kinh Thánh quen thuộc và dễ nhận biết trong tiếng Việt hiện đại.
- source_word: ἦλθεν
  choice: đến
  rationale: Diễn đạt tự nhiên động từ ἔρχομαι ở thì aorist mà không thu hẹp nghĩa thành “tới nơi”.
- source_word: εἰς τὴν Γαλιλαίαν
  choice: đến miền Ga-li-lê
  rationale: “Đến” thể hiện hướng chuyển động của εἰς; thêm “miền” giúp câu tiếng Việt tự nhiên và cho thấy Ga-li-lê là một vùng địa lý.
- source_word: κηρύσσων
  choice: rao truyền
  rationale: Thể hiện hành động công bố công khai của κηρύσσω, đồng thời dễ hiểu hơn lối nói mang tính chuyên biệt “giảng đạo”.
- source_word: εὐαγγέλιον
  choice: tin mừng
  rationale: Truyền đạt trực tiếp nghĩa căn bản của εὐαγγέλιον cho độc giả hiện đại; chú thích giữ lại cách dịch truyền thống “phúc âm”.
- source_word: τοῦ θεοῦ
  choice: của Đức Chúa Trời
  rationale: 'Giữ nguyên độ rộng của sở hữu cách Hy Lạp: tin mừng có thể được hiểu là đến từ Đức Chúa Trời, thuộc về Ngài hoặc có Ngài làm trọng tâm, thay vì buộc câu theo một cách hiểu duy nhất.'
theological_decisions:
- issue: Cách dịch παραδοθῆναι trong mối liên hệ với từ ngữ về cuộc thương khó xuyên suốt sách Mác
  choice: bị giao nộp
  alternative: bị bắt
  rationale: Mác nhiều lần dùng παραδίδωμι cho việc một người bị trao vào tay thế lực thù địch, kể cả khi nói về Giê-su. “Bị giao nộp” bảo toàn tiếng vọng văn chương và thần học ấy mà không thêm chi tiết nguyên văn không nêu.
- issue: Ý nghĩa của sở hữu cách trong τὸ εὐαγγέλιον τοῦ θεοῦ
  choice: tin mừng của Đức Chúa Trời
  alternative: tin mừng đến từ Đức Chúa Trời; tin mừng nói về Đức Chúa Trời
  rationale: Sở hữu cách có thể mang nhiều sắc thái gần nhau. Cách dịch chính giữ sự rộng nghĩa thay vì quyết định thay cho nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Câu dùng “rao truyền” thay cho thuật ngữ hẹp hơn “giảng đạo”; “tin mừng” minh bạch hơn đối với độc giả phổ thông, còn “phúc âm” được bảo lưu trong chú thích. Không thêm danh hiệu cho Giê-su vì nguyên văn chỉ có tên riêng.
