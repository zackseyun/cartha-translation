review_pass:
  verdict: revise
  source_fidelity: Bản dịch truyền đạt đúng ý lặp lại của ὅταν với các động từ chưa hoàn thành, thuật ngữ «các linh ô uế», tiếng kêu tuyên xưng, và danh xưng «Con Đức Chúa Trời». Tuy nhiên, «sấp mình» thiên về tư thế phủ phục đã hoàn tất hơn động từ προσπίπτω, vốn trước hết nêu hành động ngã/đổ mình xuống trước một người; «ngã xuống trước Ngài» sát và vẫn không suy diễn là thờ phượng.
  naturalness: Câu văn nhìn chung tự nhiên, trang trọng và dễ hiểu. «Ngã xuống trước Ngài» là cách nói hiện đại, rõ nghĩa hơn trong ngữ cảnh này; không cần thêm «mặt» sau «trước».
  terminology: «Các linh ô uế» giữ được thuật ngữ Tin Mừng và sắc thái của ἀκάθαρτα, tốt hơn cách diễn giải «tà linh» hoặc «ác quỷ». «Con Đức Chúa Trời» bảo toàn tính danh xưng của ὁ υἱὸς τοῦ θεοῦ. Đại từ «Ngài» phù hợp văn phong tôn kính của bản dịch.
  issues:
  - severity: low
    issue: «sấp mình trước mặt Ngài» cụ thể hóa tư thế hơn nguyên ngữ.
    rationale: προσπίπτω có thể bao hàm phủ phục, nhưng nghĩa diễn tiến cơ bản ở đây là ngã/đổ mình xuống trước Ngài. Dùng «ngã xuống trước Ngài» giữ hành động thể lý và để ngỏ động cơ hay mức độ quy phục.
  - severity: low
    issue: Cách dịch thay thế trong chú thích «tự gieo mình xuống» hơi thiếu tự nhiên.
    rationale: «Lao mình xuống» hoặc «ngã xuống» tự nhiên hơn trong tiếng Việt hiện đại. Chú thích nên nêu khả năng ngã xuống/phủ phục mà không gán ý thờ phượng.
