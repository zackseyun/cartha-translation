revisions:
- from: 'Mỗi khi các linh ô uế thấy Ngài, chúng sấp mình trước mặt Ngài[a] và kêu lên: “Ngài là Con Đức Chúa Trời.”'
  to: 'Mỗi khi các linh ô uế thấy Ngài, chúng đều ngã xuống trước Ngài[a] và kêu lên: “Ngài là Con Đức Chúa Trời.”'
  rationale: Bản sửa thay «sấp mình trước mặt Ngài» bằng «ngã xuống trước Ngài» để phản ánh trực tiếp hơn προσέπιπτον mà không xác định hành động ấy là thờ phượng. «Đều» hỗ trợ sắc thái lặp lại của mệnh đề «mỗi khi». Chú thích được làm tự nhiên hơn và tiếp tục bảo lưu các khả năng ngữ nghĩa của động từ Hy Lạp.
