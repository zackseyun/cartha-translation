  text: καὶ τὰ πνεύματα τὰ ἀκάθαρτα, ὅταν αὐτὸν ⸂ἐθεώρουν, προσέπιπτον⸃ αὐτῷ καὶ ⸀ἔκραζον ⸀λέγοντα ὅτι Σὺ εἶ ὁ υἱὸς τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/011.yaml
  text: And whenever the unclean spirits saw him[a], they fell down before him and cried out, saying, “You are the Son of God.”
translation:
  language: vi
  text: 'Mỗi khi các linh ô uế thấy Ngài, chúng đều ngã xuống trước Ngài[a] và kêu lên: “Ngài là Con Đức Chúa Trời.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “phủ phục trước Ngài” hoặc “lao mình xuống trước Ngài.” Động từ Hy Lạp có thể chỉ việc ngã xuống hoặc phủ phục trước một người để bày tỏ sự quy phục hay khẩn cầu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πνεύματα τὰ ἀκάθαρτα
  choice: các linh ô uế
  rationale: Dịch trực tiếp cả danh từ πνεύματα và sắc thái ‘ô uế’ của ἀκάθαρτα, tránh cách diễn giải mạnh hơn là ‘ác quỷ’ hay ‘tà linh’.
- source_word: ὅταν
  choice: mỗi khi
  rationale: Đi cùng các động từ ở thì chưa hoàn thành, ὅταν diễn tả sự việc lặp lại; ‘mỗi khi’ truyền đạt rõ ý này.
- source_word: ἐθεώρουν
  choice: thấy
  rationale: Trong mạch kể chuyện, ‘thấy’ là cách diễn đạt tự nhiên và đủ nghĩa; tính lặp lại đã được thể hiện bằng ‘mỗi khi’.
- source_word: προσέπιπτον αὐτῷ
  choice: sấp mình trước mặt Ngài
  rationale: Giữ lại hành động thể lý là ngã hoặc phủ phục trước một người mà không tự ý xác định đó là sự thờ phượng.
- source_word: ἔκραζον λέγοντα
  choice: kêu lên
  rationale: ‘Kêu lên’ diễn đạt cường độ của κράζω; nội dung lời nói theo sau dấu hai chấm nên không cần dịch λέγοντα thành một cụm rườm rà.
- source_word: Σὺ εἶ
  choice: Ngài là
  rationale: Đại từ được nêu rõ trong tiếng Hy Lạp có sắc thái nhấn mạnh; tiếng Việt diễn đạt tự nhiên bằng ‘Ngài là’, trong đó ‘Ngài’ phù hợp với lối xưng hô dành cho Chúa Giê-su.
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: Con Đức Chúa Trời
  rationale: Giữ nguyên tính chất danh xưng và trọng lượng Kitô học của cụm từ Hy Lạp theo cách gọi quen thuộc, trang trọng trong tiếng Việt.
theological_decisions:
- issue: Hành động của các linh ô uế trước Chúa Giê-su có nên được dịch là thờ phượng hay không
  choice: Dịch là ‘sấp mình trước mặt Ngài’, không dùng ‘thờ lạy’.
  alternative: thờ lạy Ngài; quỳ xuống trước Ngài
  rationale: προσπίπτω có thể chỉ việc ngã hoặc phủ phục trước ai đó vì quy phục, khẩn cầu hay kính sợ. Câu này không nói rõ rằng các linh ô uế thờ phượng Chúa Giê-su, nên bản dịch giữ nguyên hành động và không giải quyết thay cho văn cảnh ý nghĩa thần học của hành động ấy.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. ‘Các linh ô uế’ bám sát nguyên ngữ hơn ‘tà linh’; ‘sấp mình trước mặt’ diễn tả rõ hành động mà không gán thêm ý thờ phượng.
