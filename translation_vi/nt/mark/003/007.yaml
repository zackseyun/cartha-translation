revisions:
- from: Đức Chúa Giê-su cùng các môn đồ lui về phía biển[a][b]. Một đoàn dân rất đông từ Ga-li-lê đi theo Ngài, và từ Giu-đê,
  to: Giê-su cùng các môn đồ lui ra biển[a][b]; một đám đông rất lớn từ Ga-li-lê đi theo Ngài, và từ Giu-đê,
  rationale: Bản sửa loại bỏ tước hiệu không có trong nguyên ngữ, dùng cách diễn đạt hiện đại hơn cho đám đông, và đưa cách dịch trực tiếp “ra biển” vào văn bản chính. Dấu chấm phẩy và dấu phẩy cuối giữ cho độc giả thấy danh sách địa danh còn tiếp sang Mác 3:8 mà không làm cụm “và từ Giu-đê,” thành một câu độc lập.
