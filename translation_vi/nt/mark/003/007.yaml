base_translation:
  language: en
  yaml_path: translation/nt/mark/003/007.yaml
  text: And Jesus withdrew with his disciples to the sea[a], and a great crowd from Galilee followed, and from Judea[b],
translation:
  language: vi
  text: Giê-su cùng các môn đồ lui ra biển[a][b]; một đám đông rất lớn từ Ga-li-lê đi theo Ngài, và từ Giu-đê,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “về phía biển.” Giới từ Hy Lạp có thể chỉ sự chuyển động hướng về phía biển.'
    reason: lexical_alternative
  - marker: b
    text: Tức là Biển Ga-li-lê. Bản Hy Lạp chỉ viết là “biển.”
    reason: cultural_note
lexical_decisions:
- source_word: ἀνεχώρησεν
  choice: lui về
  rationale: Diễn đạt hành động rời khỏi hoặc lùi khỏi nơi đang có sự chống đối, nhưng không khiến câu mang sắc thái quân sự quá mạnh như “rút lui”.
- source_word: μετὰ τῶν μαθητῶν αὐτοῦ
  choice: cùng các môn đồ
  rationale: “Môn đồ” là cách gọi quen thuộc, chính xác trong văn cảnh các sách Phúc Âm, bao hàm cả việc học hỏi lẫn đi theo.
- source_word: πρὸς τὴν θάλασσαν
  choice: về phía biển
  rationale: πρός với đối cách chỉ chuyển động hướng đến biển; cách dịch này giữ được khả năng nghĩa là đi về hướng biển mà không khẳng định quá mức rằng đã đến tận nơi.
- source_word: πολὺ πλῆθος
  choice: một đoàn dân rất đông
  rationale: Truyền đạt quy mô lớn của đám đông bằng lối nói tự nhiên trong tiếng Việt hiện đại.
- source_word: ἠκολούθησεν
  choice: đi theo Ngài
  rationale: Trong văn cảnh này, động từ chủ yếu mô tả đám đông đi theo Đức Chúa Giê-su; thêm đại từ làm rõ tân ngữ vốn được hiểu từ ngữ cảnh Hy Lạp.
- source_word: ἀπὸ τῆς Γαλιλαίας
  choice: từ Ga-li-lê
  rationale: Diễn đạt trực tiếp nơi xuất phát của đoàn dân.
- source_word: ἀπὸ τῆς Ἰουδαίας
  choice: và từ Giu-đê,
  rationale: Giữ cụm từ nối tiếp và dấu phẩy cuối câu vì danh sách còn tiếp tục sang câu sau.
theological_decisions: []
