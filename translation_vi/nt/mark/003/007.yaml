  register: Văn phong hiện đại, trang trọng và dễ hiểu. Hai dấu chú thích đều đặt ngay sau “biển” vì cả hai chú thích đều giải thích cụm từ này. Câu kết bằng dấu phẩy để phản ánh danh sách địa danh còn tiếp tục trong Mác 3:8.
