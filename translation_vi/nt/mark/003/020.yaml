- from: Đức Giê-su vào một căn nhà[a]. Đám đông lại tụ họp, đến nỗi Ngài và những người ở cùng thậm chí không thể dùng bữa[b].
  to: Đức Giê-su vào một căn nhà[a], và đám đông lại tụ họp, đến nỗi Ngài và những người ở cùng Ngài thậm chí không thể dùng bữa[b].
  rationale: 'Bản sửa chỉ điều chỉnh ngữ pháp và độ rõ của tiếng Việt: bổ sung bổ ngữ cho “ở cùng”, giữ quy chiếu số nhiều của αὐτούς theo văn mạch, và nối hai mệnh đề bằng “và”. Chú thích b được làm rõ về từ vựng mà không đổi ý nghĩa. Các lựa chọn còn lại giữ được tính bất định và sắc thái kể chuyện của nguyên văn.'
