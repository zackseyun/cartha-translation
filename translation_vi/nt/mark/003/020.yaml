  text: Καὶ ⸀ἔρχεται εἰς οἶκον· καὶ συνέρχεται πάλιν ⸀ὁ ὄχλος, ὥστε μὴ δύνασθαι αὐτοὺς ⸀μηδὲ ἄρτον φαγεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/020.yaml
  text: And he comes into a house[a], and the crowd gathers again[c][b], so that they are not even able to eat bread.
translation:
  language: vi
  text: Đức Giê-su vào một căn nhà[a], và đám đông lại tụ họp, đến nỗi Ngài và những người ở cùng Ngài thậm chí không thể dùng bữa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “về nhà”. Tiếng Hy Lạp nói theo nghĩa đen là “vào một căn nhà”, nhưng cụm từ này có thể được dùng theo nghĩa thành ngữ là trở về nhà.
    reason: lexical_alternative
  - marker: b
    text: Theo nghĩa đen là “ăn bánh mì”, tức là ăn một bữa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχεται
  choice: vào
  rationale: Động từ hiện tại kể chuyện của Mác được diễn đạt tự nhiên trong tiếng Việt mà không cần đánh dấu thời; “vào” phối hợp trực tiếp với εἰς οἶκον.
- source_word: εἰς οἶκον
  choice: vào một căn nhà
  rationale: Danh từ không có mạo từ hay từ sở hữu; cách dịch này không xác định đó là nhà của ai, đồng thời giữ phương án thành ngữ “về nhà” trong chú thích.
- source_word: συνέρχεται πάλιν ὁ ὄχλος
  choice: Đám đông lại tụ họp
  rationale: “Tụ họp” diễn đạt tự nhiên ý đám đông kéo đến và hội lại; “lại” giữ rõ ý lặp lại của πάλιν.
- source_word: ὥστε μὴ δύνασθαι αὐτοὺς
  choice: đến nỗi Ngài và những người ở cùng ... không thể
  rationale: ὥστε với động từ nguyên mẫu chỉ kết quả. Việc làm rõ đại từ số nhiều là Đức Giê-su và những người ở cùng Ngài tránh để độc giả tiếng Việt hiểu nhầm chủ thể là đám đông, nhưng không giới hạn họ bằng một danh xưng không có trong câu.
- source_word: μηδὲ ἄρτον φαγεῖν
  choice: thậm chí không thể dùng bữa
  rationale: ἄρτον φαγεῖν theo nghĩa đen là “ăn bánh”, nhưng trong ngữ cảnh là thành ngữ chỉ việc ăn một bữa; “dùng bữa” tự nhiên và trang trọng vừa phải, còn nghĩa đen được ghi trong chú thích.
theological_decisions:
- issue: Đối tượng của đại từ αὐτούς
  choice: Ngài và những người ở cùng
  alternative: họ
  rationale: Đại từ số nhiều chỉ Đức Giê-su cùng những người ở với Ngài trong cảnh này. Dịch đơn thuần là “họ” ngay sau “đám đông” dễ khiến độc giả gán sai đại từ cho đám đông; cách diễn đạt được chọn chỉ làm rõ quy chiếu theo văn cảnh mà không khẳng định chính xác thành phần của nhóm.
translation_notes:
  register: Tiếng Việt hiện đại, rõ ràng và trang trọng vừa phải. Cấu trúc ngắn giữ nhịp kể nhanh của Mác; không ép thì quá khứ lên động từ hiện tại kể chuyện của nguyên văn.
