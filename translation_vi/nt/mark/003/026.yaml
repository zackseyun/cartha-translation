  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ εἰ ὁ Σατανᾶς ἀνέστη ἐφ’ ἑαυτὸν καὶ ⸀ἐμερίσθη, οὐ δύναται ⸀στῆναι ἀλλὰ τέλος ἔχει.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/026.yaml
  text: And if Satan has risen up against himself and is divided[a], he cannot stand, but has come to an end.
translation:
  language: vi
  text: Và nếu Sa-tan nổi dậy chống lại chính mình và bị chia rẽ, thì hắn không thể đứng vững, mà đã đến hồi kết.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát: “nhưng có hồi kết.”'
    reason: Nêu cách diễn đạt sát chữ của ἀλλὰ τέλος ἔχει, đặc biệt là động từ “có,” đồng thời bảo lưu tính ngắn gọn của nguyên ngữ.
lexical_decisions:
- source_word: Σατανᾶς
  choice: Sa-tan
  rationale: Dùng hình thức phiên âm tên riêng quen thuộc trong tiếng Việt, không dịch tên này thành một danh xưng.
- source_word: ἀνέστη ἐφ’ ἑαυτὸν
  choice: nổi dậy chống lại chính mình
  rationale: Diễn đạt tự nhiên hành động đứng lên với ý đối nghịch; ἐπί cùng đại từ phản thân ở đây mang nghĩa chống lại chính mình.
- source_word: ἐμερίσθη
  choice: bị chia rẽ
  rationale: Giữ thể bị động của động từ Hy Lạp và ý về tình trạng phân hóa nội bộ.
- source_word: οὐ δύναται στῆναι
  choice: không thể đứng vững
  rationale: Giữ hình ảnh 'đứng' trong nguyên ngữ, đồng thời diễn đạt thành ngữ về việc không thể tiếp tục tồn tại hay bền vững.
- source_word: ἀλλὰ τέλος ἔχει
  choice: mà đã đến hồi kết
  rationale: Diễn đạt tự nhiên hậu quả kết thúc được nói đến trong mệnh đề Hy Lạp, nhưng không mở rộng câu này thành một tuyên bố riêng về thời điểm thất bại chung cuộc của Sa-tan.
theological_decisions:
- issue: Tính chất của lời nói về sự sụp đổ của Sa-tan
  choice: Trình bày việc Sa-tan đến hồi kết như hệ quả logic nếu hắn chống lại chính mình và bị chia rẽ.
  alternative: Diễn đạt tuyệt đối hơn là 'hắn đã hoàn toàn bị tiêu diệt' hoặc theo hướng tương lai là 'hắn sẽ bị tiêu diệt'.
  rationale: Trong văn cảnh, đây là lập luận cho thấy một vương quốc tự chia rẽ không thể tồn tại. Bản dịch không bổ sung một khẳng định chi tiết về sự thất bại cánh chung vượt quá điều câu này nói.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Hắn” duy trì cách quy chiếu đến một hữu thể có ngôi vị; “đứng vững” bảo toàn hình ảnh tu từ của nguyên văn.
