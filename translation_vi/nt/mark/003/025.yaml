  text: καὶ ἐὰν οἰκία ἐφ’ ἑαυτὴν μερισθῇ, οὐ ⸀δυνήσεται ⸂ἡ οἰκία ἐκείνη σταθῆναι⸃·
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/025.yaml
  text: And if a house is divided against itself[a], that house will not be able to stand.
translation:
  language: vi
  text: Và nếu một ngôi nhà bị chia rẽ chống lại chính mình, ngôi nhà ấy sẽ không thể đứng vững.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἰκία
  choice: nhà
  rationale: Giữ nghĩa cụ thể chính là “nhà”; động từ “đứng vững” tiếp tục hình ảnh kiến trúc, trong khi chú thích ghi nhận nghĩa khả dĩ là “gia đình” hoặc “hộ gia đình”.
- source_word: ἐφ’ ἑαυτὴν
  choice: chống lại chính mình
  rationale: Trong kết cấu này, giới từ ἐπί đi với đại từ phản thân diễn tả sự đối kháng nội bộ; cách dịch này giữ rõ ý một thực thể quay sang chống lại bản thân.
- source_word: μερισθῇ
  choice: bị chia rẽ
  rationale: Thể bị động và thức giả định trong mệnh đề điều kiện được phản ánh tự nhiên bằng “nếu… bị chia rẽ”, nhấn mạnh tình trạng phân裂 nội bộ.
- source_word: δυνήσεται
  choice: sẽ không thể
  rationale: Thì tương lai của δύναμαι nói đến khả năng trong kết quả của điều kiện; “sẽ không thể” vừa chính xác vừa tự nhiên trong tiếng Việt.
- source_word: σταθῆναι
  choice: đứng vững
  rationale: “Đứng vững” giữ hình ảnh của ἵστημι và đồng thời truyền đạt hàm ý tồn tại bền vững, tự nhiên hơn “đứng” đơn thuần trong tiếng Việt.
- source_word: ἡ οἰκία ἐκείνη
  choice: nhà ấy
  rationale: Đại từ chỉ định ἐκείνη được thể hiện bằng “ấy”, vừa gọn vừa giữ sắc thái quy chiếu nhấn mạnh.
- source_word: καὶ ἐὰν
  choice: Và nếu
  rationale: Giữ cả liên từ nối tiếp lập luận καί và ý điều kiện của ἐὰν.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Đứng vững” giữ được ẩn dụ về ngôi nhà đồng thời diễn đạt tự nhiên ý không thể tồn tại bền lâu.
