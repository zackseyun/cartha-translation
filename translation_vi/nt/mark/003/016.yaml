  text: καὶ ⸂ἐποίησεν τοὺς δώδεκα, καὶ⸃ ἐπέθηκεν ⸂ὄνομα τῷ Σίμωνι⸃ Πέτρον,
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/016.yaml
  text: And he appointed the twelve[a], and he gave Simon the name Peter,
translation:
  language: vi
  text: Ngài lập Nhóm Mười Hai và đặt tên Phê-rô cho Si-môn[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tên Phê-rô có nghĩa là “đá”.
    reason: Giải thích nghĩa của tên Hy Lạp Πέτρος, vốn được phiên âm trong chính văn.
lexical_decisions:
- source_word: ἐποίησεν
  choice: lập
  rationale: Động từ có nghĩa cơ bản là “làm, tạo nên”, nhưng trong ngữ cảnh này diễn tả việc Chúa Giê-su thiết lập nhóm Mười Hai. “Lập” chuyển tải sắc thái chính thức mà không thêm thuật ngữ giáo hội về sau.
- source_word: τοὺς δώδεκα
  choice: mười hai người
  rationale: Cụm từ chỉ nhóm mười hai môn đồ vừa được thiết lập. Thêm “người” để câu tiếng Việt tự nhiên, nhưng không viết hoa vì nguyên văn tự nó không quyết định cách viết hoa.
- source_word: ἐπέθηκεν ὄνομα
  choice: đặt tên cho ... là
  rationale: Thành ngữ Hy Lạp có nghĩa đen là “đặt một tên trên” ai đó. Cách nói “đặt tên cho ... là” vừa tự nhiên trong tiếng Việt vừa giữ rõ hành động ban tên.
- source_word: Σίμωνι
  choice: Si-môn
  rationale: Phiên âm tên riêng theo âm của nguyên ngữ và lối viết tiếng Việt dễ đọc.
- source_word: Πέτρον
  choice: Phê-rô
  rationale: Từ này đang được dùng như tên riêng được ban cho Si-môn, nên được phiên âm thay vì dịch thẳng là “Đá”; ý nghĩa của tên được giữ trong chú thích.
theological_decisions:
- issue: Sắc thái hành động của Chúa Giê-su đối với nhóm Mười Hai
  choice: lập mười hai người
  alternative: làm nên mười hai người; chỉ định mười hai người
  rationale: “Lập” diễn đạt việc Chúa Giê-su thiết lập họ thành một nhóm có vai trò riêng, đồng thời tránh hàm ý rằng Ngài tạo dựng họ hoặc gán vào câu một chức vụ giáo hội không được nói rõ.
- issue: Cách xử lý tên Πέτρος
  choice: Phê-rô
  alternative: Đá
  rationale: Vì Πέτρος giữ chức năng tên riêng trong câu, bản dịch phiên âm tên ấy; nghĩa từ vựng “đá” được nêu ở chú thích để không làm mất mối liên hệ ngữ nghĩa.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Ngài” để nối tự nhiên với chủ thể Chúa Giê-su trong ngữ cảnh trước; tên riêng được phiên âm theo dạng tiếng Việt gần nguyên ngữ. Dấu chú thích được đặt ngay sau “Phê-rô”, là từ mà chú thích giải nghĩa.
