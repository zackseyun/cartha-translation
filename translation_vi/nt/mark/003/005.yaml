source:
  edition: SBLGNT
  text: καὶ περιβλεψάμενος αὐτοὺς μετ’ ὀργῆς, συλλυπούμενος ἐπὶ τῇ πωρώσει τῆς καρδίας αὐτῶν, λέγει τῷ ἀνθρώπῳ· Ἔκτεινον τὴν ⸀χεῖρα· καὶ ἐξέτεινεν, καὶ ἀπεκατεστάθη ἡ χεὶρ ⸀αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/005.yaml
  text: And after looking around at them with anger[a], grieved at the hardness of their hearts, he says to the man, “Stretch out your hand.” And he stretched it out, and his hand was restored.
translation:
  language: vi
  text: 'Ngài giận dữ nhìn quanh mọi người, đau buồn vì lòng họ chai cứng, rồi nói với người đàn ông: “Hãy duỗi tay ra.” Ông duỗi tay ra, và tay ông được phục hồi.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: περιβλεψάμενος
  choice: nhìn quanh họ
  rationale: Diễn tả cái nhìn bao quát hướng đến cả nhóm. Phân từ aorist đứng trước động từ chính; tiếng Việt thể hiện trình tự tự nhiên bằng chuỗi động từ và từ “rồi” trước lời phán.
- source_word: μετ’ ὀργῆς
  choice: giận dữ
  rationale: Giữ nguyên sức nặng của ὀργή và diễn đạt tự nhiên trạng thái đi kèm cái nhìn, không làm nhẹ thành chỉ “bất bình”.
- source_word: συλλυπούμενος
  choice: đồng thời đau buồn
  rationale: Phân từ hiện tại diễn tả nỗi đau buồn đi cùng cơn giận. “Đồng thời” giúp bảo toàn sự đồng hiện và căng thẳng giữa hai cảm xúc.
- source_word: ἐπὶ τῇ πωρώσει τῆς καρδίας αὐτῶν
  choice: vì lòng họ chai cứng
  rationale: ἐπί với tặng cách nêu căn nguyên của nỗi buồn. “Chai cứng” giữ ẩn dụ về sự mất nhạy cảm; “lòng họ” vừa tự nhiên trong tiếng Việt vừa phản ánh danh từ καρδία số ít mang nghĩa tập thể với đại từ số nhiều.
- source_word: λέγει
  choice: phán
  rationale: Hiện tại lịch sử của Mác được chuyển thành mạch kể sống động qua “rồi phán”. “Phán” phù hợp với lời truyền lệnh trang trọng của Chúa Giê-su nhưng vẫn thông dụng trong văn phong Kinh Thánh tiếng Việt.
- source_word: τῷ ἀνθρώπῳ
  choice: với người đàn ông
  rationale: Chỉ đúng người nam cụ thể trong bối cảnh, không chuyển thành cách gọi phi giới tính làm mờ đối tượng.
- source_word: Ἔκτεινον τὴν χεῖρα
  choice: Hãy giơ tay ra
  rationale: Mệnh lệnh dứt khoát và tự nhiên trong tiếng Việt; “giơ tay ra” diễn tả động tác duỗi hoặc đưa bàn tay ra trong bối cảnh chữa lành.
- source_word: ἐξέτεινεν
  choice: Ông giơ tay ra
  rationale: Lặp lại lời truyền như nguyên văn Hy Lạp; dùng “ông” giúp phân biệt người đàn ông với Chúa Giê-su.
- source_word: ἀπεκατεστάθη
  choice: được phục hồi
  rationale: Động từ thụ động nói đến việc trở lại tình trạng đúng đắn trước đó. “Được phục hồi” chính xác hơn “được chữa lành” và không thu hẹp nghĩa vào thuật ngữ y khoa.
theological_decisions:
- issue: Cơn giận và nỗi buồn của Chúa Giê-su
  choice: Dịch thẳng cả hai cảm xúc là “giận dữ” và “đau buồn”, đồng thời cho thấy chúng cùng hiện diện.
  alternative: Làm nhẹ ὀργή thành “bất bình” hoặc diễn giải nỗi buồn thành “vô cùng đau lòng”.
  rationale: Nguyên văn đặt cơn giận và nỗi buồn cạnh nhau. Bản dịch giữ nguyên sự căng thẳng thần học và sức nghiêm trọng về đạo đức, không giảm nhẹ hay khuếch đại.
- issue: Số ít mang nghĩa tập thể trong τῆς καρδίας αὐτῶν
  choice: “lòng họ”
  alternative: “những tấm lòng chai cứng của họ” hoặc “lòng của họ”
  rationale: καρδίας ở số ít còn αὐτῶν ở số nhiều, có thể là cách nói tập thể. Tiếng Việt “lòng họ” bảo toàn được nét này một cách tự nhiên mà không buộc phải phân giải thành số nhiều.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và dễ hiểu. Dùng “Ngài” cho Chúa Giê-su, “ông” cho người được chữa lành, và “phán” trong lời truyền lệnh. Không cần chú thích vì cách nói “lòng họ” tự nhiên trong tiếng Việt đồng thời bảo toàn số ít tập thể của nguyên văn.
