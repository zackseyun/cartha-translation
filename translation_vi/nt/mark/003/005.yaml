revisions:
- from: 'Ngài giận dữ nhìn quanh họ, đồng thời đau buồn vì lòng họ chai cứng, rồi phán với người đàn ông: “Hãy giơ tay ra.” Ông giơ tay ra, và tay ông được phục hồi.'
  to: 'Ngài giận dữ nhìn quanh mọi người, đau buồn vì lòng họ chai cứng, rồi nói với người đàn ông: “Hãy duỗi tay ra.” Ông duỗi tay ra, và tay ông được phục hồi.'
  rationale: Bản sửa làm rõ hướng của cái nhìn προς nhóm người, dùng “duỗi tay ra” để phản ánh chính xác hơn ἐκτείνω/ἐξέτεινεν, và thay “phán” bằng “nói” cho văn phong Việt hiện đại. Vẫn giữ sự đồng hiện của cơn giận và nỗi buồn, số ít tập thể trong “lòng họ”, cũng như ý phục hồi của ἀπεκατεστάθη.
