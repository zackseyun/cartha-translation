    issue: “nhìn quanh họ” mơ hồ và không tự nhiên
    rationale: περιβλεψάμενος αὐτούς nói đến việc Ngài nhìn quanh nhóm người ấy. Trong tiếng Việt, “nhìn quanh họ” thường có thể được hiểu là nhìn không gian bao quanh họ. “Nhìn quanh mọi người” làm rõ đối tượng của cái nhìn mà không thêm nghĩa.
  - severity: low
    issue: “giơ tay ra” chưa phản ánh rõ động tác ἐκτείνω
    rationale: “Giơ tay” thường là nâng tay lên; ἐκτείνω trong câu này là duỗi hoặc đưa bàn tay ra. “Duỗi tay ra” vừa tự nhiên vừa bảo toàn sự lặp lại giữa mệnh lệnh và hành động.
  - severity: low
    issue: “phán” hơi cổ/đậm sắc thái tôn giáo hơn nguyên ngữ
    rationale: λέγει là “nói” ở thì hiện tại lịch sử. Dùng “nói” phù hợp hơn với tiếng Việt chuẩn hiện đại và không làm thay đổi thẩm quyền của lời mệnh lệnh.
