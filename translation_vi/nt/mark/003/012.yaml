  yaml_path: translation/nt/mark/003/012.yaml
  text: And he sternly warned them many times not to make him known[a].
translation:
  language: vi
  text: Ngài nhiều lần nghiêm khắc cảnh cáo chúng không được làm cho người ta biết Ngài[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “tiết lộ Ngài,” “đưa Ngài ra công khai,” hoặc sát chữ hơn, “làm cho Ngài trở nên hiển lộ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλὰ
  choice: nhiều lần
  rationale: Dạng trung tính số nhiều được dùng như trạng từ, nhấn mạnh hành động lặp lại hoặc mạnh mẽ; “nhiều lần” diễn đạt tự nhiên ý lặp lại, còn sắc thái mạnh đã được thể hiện qua “nghiêm khắc”.
- source_word: ἐπετίμα
  choice: nghiêm khắc cảnh cáo
  rationale: Động từ mang sắc thái quở trách hoặc truyền lệnh một cách mạnh mẽ. Trong ngữ cảnh Chúa Giê-su ngăn các tà linh công bố Ngài, “nghiêm khắc cảnh cáo” vừa tự nhiên vừa giữ được sức nặng của lời cấm.
- source_word: αὐτοῖς
  choice: chúng
  rationale: Đại từ số nhiều chỉ các tà linh trong ngữ cảnh ngay trước đó; “chúng” giúp người đọc nhận ra đối tượng không phải là con người.
- source_word: ἵνα μὴ
  choice: không được
  rationale: Diễn đạt tự nhiên nội dung mang tính cấm đoán của lời cảnh cáo, đồng thời có thể bao hàm sắc thái mục đích của cấu trúc Hy Lạp.
- source_word: αὐτὸν φανερὸν ποιήσωσιν
  choice: làm cho người ta biết Ngài
  rationale: Cụm từ có nghĩa làm cho một người được biết đến, bị lộ ra hoặc được công khai. Cách dịch này rõ ràng, tự nhiên và không bổ sung cụ thể điều gì về căn tính của Ngài ngoài điều bản văn nói.
theological_decisions:
- issue: Nội dung mệnh lệnh của Chúa Giê-su đối với các tà linh
  choice: Giữ lời cấm ở mức không được làm cho người ta biết Ngài.
  alternative: Nói rõ rằng chúng không được tiết lộ Ngài là Con Đức Chúa Trời, hoặc hiểu đây chỉ là một lệnh bắt im lặng nói chung.
  rationale: Ngữ cảnh trước đó liên quan đến lời tuyên bố về căn tính của Chúa Giê-su, nhưng chính câu này chỉ nói “làm cho Ngài được biết đến.” Bản dịch không đưa lời xưng nhận ở câu trước vào câu này và giữ nguyên độ mở của bản văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” theo lối xưng hô kính trọng phổ biến trong bản văn Kinh Thánh tiếng Việt; dùng “chúng” để chỉ các tà linh. Cấu trúc câu gọn, giữ cả ý lặp lại của πολλὰ và sắc thái mạnh của ἐπετίμα.
