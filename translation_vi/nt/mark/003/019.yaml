  text: καὶ Ἰούδαν ⸀Ἰσκαριώθ, ὃς καὶ παρέδωκεν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/019.yaml
  text: and Judas Iscariot[a], who also betrayed him.
translation:
  language: vi
  text: và Giu-đa Ích-ca-ri-ốt,[a] là người cũng đã phản bội Ngài.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “người cũng đã nộp Ngài” hoặc “người cũng đã trao nộp Ngài.” Động từ Hy Lạp có thể có nghĩa là “trao” hay “nộp”; ở đây dịch là “phản bội” vì hành động của Giu-đa đối với Chúa Giê-su mang ý nghĩa ấy trong ngữ cảnh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: và
  rationale: Liên từ nối tên cuối cùng với danh sách các sứ đồ ở phần trước.
- source_word: Ἰούδαν
  choice: Giu-đa
  rationale: Dùng dạng phiên âm quen thuộc trong tiếng Việt cho tên riêng này.
- source_word: Ἰσκαριώθ
  choice: Ích-ca-ri-ốt
  rationale: Phiên âm danh xưng riêng theo cách dùng quen thuộc; không dịch theo một giả thuyết từ nguyên chưa chắc chắn.
- source_word: ὃς
  choice: là người
  rationale: Mở đầu mệnh đề quan hệ nói thêm về Giu-đa; cách diễn đạt này tự nhiên và rõ nghĩa trong tiếng Việt.
- source_word: καὶ
  choice: cũng
  rationale: Giữ sắc thái bổ sung của καί trong mệnh đề quan hệ.
- source_word: παρέδωκεν
  choice: đã phản bội
  rationale: Động từ có nghĩa căn bản là trao/nộp một người; khi nói về hành động của Giu-đa đối với Chúa Giê-su, 'phản bội' truyền đạt tự nhiên ý nghĩa theo ngữ cảnh, còn nghĩa sát chữ được giữ trong chú thích.
- source_word: αὐτόν
  choice: Ngài
  rationale: Đại từ làm tân ngữ, chỉ về Chúa Giê-su; 'Ngài' là cách gọi tôn kính, tự nhiên trong văn phong Kinh Thánh tiếng Việt.
theological_decisions:
- issue: Cách dịch παραδίδωμι khi nói về hành động của Giu-đa đối với Chúa Giê-su
  choice: phản bội
  alternative: nộp Ngài / trao nộp Ngài
  rationale: Bản thân động từ có thể chỉ việc giao hoặc nộp một người mà không nhất thiết nêu rõ động cơ phản trắc. Tuy nhiên, trong ngữ cảnh Giu-đa đối với Chúa Giê-su, 'phản bội' diễn đạt đúng sức nặng của hành động; chú thích bảo lưu các cách dịch sát chữ.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Câu giữ quan hệ với danh sách ở phần trước và dùng thuật ngữ quen thuộc mà không làm mất phạm vi nghĩa của động từ Hy Lạp.
