  source_fidelity: Bản dịch giữ đúng cấu trúc nối tiếp của καί, tên riêng Ἰούδας Ἰσκαριώθ, mệnh đề quan hệ ὃς καί, thì quá khứ của παρέδωκεν, và tân ngữ αὐτόν. “Phản bội” là cách diễn đạt theo ngữ cảnh thích đáng; chú thích bảo lưu nghĩa sát hơn của παραδίδωμι là “nộp/trao nộp.”
  naturalness: “và Giu-đa Ích-ca-ri-ốt, là người cũng đã phản bội Ngài” phù hợp với câu đang tiếp nối danh sách ở câu trước, trang trọng và tự nhiên trong văn phong Kinh Thánh tiếng Việt hiện đại.
  terminology: “Giu-đa Ích-ca-ri-ốt” là dạng tên riêng quen dùng. “Ngài” là lối quy chiếu tôn kính thông dụng đối với Chúa Giê-su trong tiếng Việt Kinh Thánh; không làm thay đổi quan hệ ngữ pháp của αὐτόν. Chú thích được neo đúng sau danh xưng Ích-ca-ri-ốt và nêu rõ lựa chọn từ vựng.
