id: MRK.3.27
reference: Mark 3:27
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸂ἀλλ’ οὐδεὶς δύναται⸃ ⸂εἰς τὴν οἰκίαν τοῦ ἰσχυροῦ εἰσελθὼν τὰ σκεύη⸃ αὐτοῦ διαρπάσαι ἐὰν μὴ πρῶτον τὸν ἰσχυρὸν δήσῃ, καὶ τότε τὴν οἰκίαν αὐτοῦ ⸀διαρπάσει.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/027.yaml
  text: But no one can enter the house of the strong man and plunder his goods unless he first ties up the strong man[b][a]; then indeed he will plunder his house.
translation:
  language: vi
  text: Nhưng không ai có thể vào nhà người mạnh mà cướp lấy đồ đạc của người ấy, nếu trước hết không trói người mạnh ấy lại[a]; rồi lúc ấy mới cướp bóc cả nhà người ấy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Người mạnh” là hình ảnh trong ẩn dụ của Chúa Giê-su về việc chế ngự Sa-tan; bản dịch giữ nguyên hình ảnh thay vì nói thẳng cách giải thích trong câu chính. “Đồ đạc” cũng có thể dịch là “tài sản” hoặc, sát chữ hơn, “các vật dụng”.
    reason: cross_reference_and_lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: Nhưng
  rationale: Diễn tả sự tương phản với lời cáo buộc và phần bác bỏ ngay trước đó bằng một liên từ tự nhiên trong tiếng Việt.
- source_word: οὐδεὶς δύναται
  choice: không ai có thể
  rationale: Giữ nguyên ý nghĩa về sự bất khả nếu điều kiện cần chưa được đáp ứng.
- source_word: εἰς τὴν οἰκίαν τοῦ ἰσχυροῦ εἰσελθὼν
  choice: vào nhà của người mạnh
  rationale: Chuyển cấu trúc phân từ Hy Lạp sang cách diễn đạt tự nhiên trong tiếng Việt, đồng thời giữ hình ảnh cụ thể về ngôi nhà.
- source_word: τοῦ ἰσχυροῦ / τὸν ἰσχυρόν
  choice: người mạnh
  rationale: Tính từ được dùng như danh từ; cách dịch này giữ nguyên hình ảnh ẩn dụ và sự lặp lại của nguyên văn, không giải thích trực tiếp là Sa-tan.
- source_word: τὰ σκεύη αὐτοῦ
  choice: tài sản của người ấy
  rationale: Trong bối cảnh cướp một ngôi nhà, σκεύη chỉ các đồ vật, vật dụng hoặc của cải thuộc sở hữu; “tài sản” rõ nghĩa và tự nhiên hơn cách dịch sát là “đồ dùng/bình dụng”.
- source_word: διαρπάσαι / διαρπάσει
  choice: cướp lấy / cướp được
  rationale: Động từ diễn tả việc cưỡng đoạt hoặc cướp sạch; lựa chọn này giữ sắc thái mạnh và phù hợp với hình ảnh đột nhập.
- source_word: ἐὰν μὴ πρῶτον
  choice: nếu trước hết không
  rationale: 'Giữ rõ điều kiện cần và thứ tự thời gian: phải trói người mạnh trước khi cướp.'
- source_word: δήσῃ
  choice: trói ... lại
  rationale: Diễn đạt cụ thể, sinh động nghĩa của δέω là buộc hoặc trói, phù hợp với ẩn dụ.
- source_word: καὶ τότε
  choice: rồi lúc ấy mới
  rationale: Làm rõ hệ quả chỉ xảy ra sau khi điều kiện trước đó được hoàn thành mà không thêm nội dung diễn giải thần học.
- source_word: τὴν οἰκίαν αὐτοῦ διαρπάσει
  choice: cướp được nhà của người ấy
  rationale: Giữ sự lặp lại hình ảnh “nhà” và thì tương lai/hệ quả của nguyên văn; “nhà” có thể gợi toàn bộ phạm vi tài sản nhưng không bị giải thích quá mức.
theological_decisions:
- issue: Ý nghĩa ẩn dụ của “người mạnh” trong lập luận của Chúa Giê-su về Sa-tan
  choice: Giữ nguyên hình ảnh “người mạnh” trong câu chính.
  alternative: Giải thích trực tiếp “người mạnh” là Sa-tan hoặc dịch trừu tượng là “kẻ quyền thế”.
  rationale: Ngữ cảnh cho thấy ẩn dụ liên quan đến việc Chúa Giê-su chế ngự Sa-tan, nhưng câu Hy Lạp trình bày điều này dưới hình thức một hình ảnh. Bản dịch không nên thay hình ảnh bằng lời giải nghĩa.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “người ấy/người đó” để tránh đại từ mơ hồ; giữ cấu trúc ẩn dụ cụ thể và nhịp điều kiện–hệ quả của nguyên văn.
