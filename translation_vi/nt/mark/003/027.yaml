  to: Nhưng không ai có thể vào nhà người mạnh mà cướp lấy đồ đạc của người ấy, nếu trước hết không trói người mạnh ấy lại[a]; rồi lúc ấy mới cướp bóc cả nhà người ấy.
  rationale: Sửa cụm cuối để phản ánh δράση cướp phá của διαρπάσει và sự chuyển từ “đồ đạc” sang “cả nhà” trong nguyên văn. Đổi “tài sản” thành “đồ đạc” trong câu chính giúp giữ hình ảnh cụ thể của σκεύη; các lựa chọn từ vựng khác được bảo tồn trong chú thích. Cấu trúc điều kiện–hệ quả và ẩn dụ vẫn được giữ nguyên.
