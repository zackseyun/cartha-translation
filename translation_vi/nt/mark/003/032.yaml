base_translation:
  language: en
  yaml_path: translation/nt/mark/003/032.yaml
  text: And a crowd was sitting around him[a], and they said to him, “Look, your mother and your brothers are outside looking for you.”
translation:
  language: vi
  text: 'Một đám đông đang ngồi quanh Ngài, và họ nói với Ngài: “Kìa, mẹ và các anh em của Ngài đang ở ngoài tìm Ngài.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκάθητο
  choice: đang ngồi
  rationale: Thì vị hoàn diễn tả khung cảnh đang tiếp diễn; “đang ngồi” giữ được sắc thái kéo dài tự nhiên trong tiếng Việt.
- source_word: περὶ αὐτὸν ὄχλος
  choice: một đám đông đang ngồi quanh Ngài
  rationale: περί với đối cách chỉ vị trí bao quanh; cách diễn đạt này giữ rõ hình ảnh đám đông ngồi xung quanh Chúa Giê-su.
- source_word: λέγουσιν
  choice: người ta nói
  rationale: Động từ hiện tại được dùng như hiện tại lịch sử trong lời kể Hy Lạp; tiếng Việt tự nhiên có thể dùng “nói” mà không cần đánh dấu thì, còn chủ ngữ số nhiều không xác định được diễn đạt là “người ta”.
- source_word: Ἰδοὺ
  choice: Kìa
  rationale: Tiểu từ thu hút sự chú ý; “Kìa” ngắn gọn, tự nhiên và giữ được lực chỉ xuất của nguyên văn.
- source_word: μήτηρ
  choice: mẹ
  rationale: Từ thân tộc thông dụng, được chuyển dịch trực tiếp.
- source_word: ἀδελφοί
  choice: các anh em
  rationale: Giữ danh từ thân tộc giống đực số nhiều mà không xác định họ lớn hay nhỏ tuổi hơn Chúa Giê-su và không mở rộng theo một cách giải thích giáo phái.
- source_word: ἔξω
  choice: ở ngoài
  rationale: Diễn đạt trực tiếp vị trí bên ngoài nơi Chúa Giê-su đang ở.
- source_word: ζητοῦσίν σε
  choice: đang ở ngoài tìm Ngài
  rationale: ζητέω ở đây chỉ việc cố tìm gặp Chúa Giê-su; “tìm Ngài” rõ ràng và tự nhiên, còn “đang” làm nổi bật hành động đang diễn ra.
theological_decisions:
- issue: Quan hệ được chỉ bằng ἀδελφοί
  choice: Dịch là “các anh em” mà không giải thích thêm.
  alternative: “các anh em họ/họ hàng gần” hoặc “các anh chị em”
  rationale: Câu này dùng từ thân tộc thông thường nhưng không giải thích chính xác bản chất quan hệ gia đình. Bản dịch vì thế giữ cách gọi trực tiếp và không áp đặt kết luận thuộc một truyền thống thần học.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “Ngài” được dùng để nói với và nói về Chúa Giê-su; “Kìa” giữ sắc thái lời nói trực tiếp mà không cổ kính quá mức.
