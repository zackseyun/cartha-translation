  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὃς δ’ ἂν βλασφημήσῃ εἰς τὸ πνεῦμα τὸ ἅγιον, οὐκ ἔχει ἄφεσιν εἰς τὸν αἰῶνα, ἀλλὰ ἔνοχός ἐστιν αἰωνίου ⸀ἁμαρτήματος.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/029.yaml
  text: but whoever blasphemes against the Holy Spirit never has forgiveness[c][b][a], but is guilty of an eternal sin.
translation:
  language: vi
  text: nhưng ai phạm thượng chống lại Đức Thánh Linh thì đời đời không được tha thứ[a], mà mắc tội đời đời[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “không có sự tha thứ cho đến đời”; nghĩa là “không bao giờ được tha thứ” hoặc “đời đời không được tha thứ”.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “phải chịu trách nhiệm về một tội đời đời”.'
    reason: lexical_alternative
  - marker: c
    text: Một số thủ bản chép “sự phán xét đời đời” hoặc “sự kết án đời đời” thay cho “tội đời đời”.
    reason: textual_variant
lexical_decisions:
- source_word: ὃς δ’ ἂν
  choice: nhưng ai
  rationale: ὃς với ἄν tạo mệnh đề quan hệ bất định, diễn đạt tự nhiên là “ai”; δέ mang sắc thái tương phản nhẹ nên dịch là “nhưng”.
- source_word: βλασφημήσῃ
  choice: xúc phạm
  rationale: Trong ngữ cảnh tôn giáo, βλασφημέω chỉ hành vi nói phạm thượng hoặc lăng mạ. “Xúc phạm đến” là cách nói hiện đại, dễ hiểu mà vẫn giữ sức nặng của hành vi; “phạm thượng đến” kém tự nhiên trong tiếng Việt.
- source_word: εἰς τὸ πνεῦμα τὸ ἅγιον
  choice: đến Đức Thánh Linh
  rationale: εἰς đánh dấu đối tượng bị xúc phạm. “Đức Thánh Linh” là cách gọi trang trọng, phổ thông trong tiếng Việt.
- source_word: οὐκ ἔχει ἄφεσιν εἰς τὸν αἰῶνα
  choice: đời đời không được tha thứ
  rationale: Thành ngữ phủ định εἰς τὸν αἰῶνα có nghĩa “không bao giờ/đời đời không”; cách diễn đạt này tự nhiên trong tiếng Việt và giữ nội dung của ἄφεσις là sự tha thứ.
- source_word: ἀλλὰ ἔνοχός ἐστιν
  choice: mà mắc
  rationale: ἀλλά tạo tương phản mạnh sau mệnh đề phủ định; “mà” phù hợp cấu trúc “không..., mà...”. ἔνοχος với sở hữu cách có thể chỉ tình trạng có tội hoặc phải chịu trách nhiệm; “mắc” giữ câu ngắn gọn và tự nhiên.
- source_word: αἰωνίου ἁμαρτήματος
  choice: tội đời đời
  rationale: Bản SBLGNT đọc ἁμαρτήματος, “tội”, với αἰωνίου, “đời đời/vĩnh viễn”. “Tội đời đời” bám sát cấu trúc Hy Lạp và không tự ý giải nghĩa bản chất của tội ấy.
theological_decisions:
- issue: Bản chất của hành vi không được tha thứ
  choice: Giữ nguyên cách nói trực tiếp “xúc phạm đến Đức Thánh Linh”.
  alternative: Diễn giải là cố ý và dai dẳng khước từ lời chứng của Thánh Linh, hoặc quy công việc của Thánh Linh cho ma quỷ.
  rationale: Ngữ cảnh gần giúp người đọc hiểu lời này, nhưng chính câu này không nêu các điều kiện diễn giải ấy. Không đưa chúng vào chính văn giúp giữ nguyên sức căng thần học.
- issue: Dị bản ở cuối câu
  choice: Dịch theo SBLGNT là “tội đời đời”.
  alternative: “sự phán xét đời đời” hoặc “sự kết án đời đời”.
  rationale: Nguồn Hy Lạp được cung cấp đọc αἰωνίου ἁμαρτήματος. Dị bản quen thuộc được ghi ở chú thích thay vì thay thế chính văn.
- issue: Sắc thái của ἔνοχος
  choice: “mắc tội đời đời”.
  alternative: “phải chịu trách nhiệm về một tội đời đời”.
  rationale: Cách dịch chính tự nhiên và giữ ý có tội; chú thích bảo lưu sắc thái pháp lý “chịu trách nhiệm” có thể có của từ Hy Lạp.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Thánh Linh” theo lối gọi Cơ Đốc giáo phổ thông; giữ “tội đời đời” để phản ánh trực tiếp bản văn Hy Lạp, đồng thời dùng chú thích cho sắc thái từ vựng và dị bản.
