revisions:
- from: 'Khi những người thân cận với Đức Chúa Jêsus nghe tin[a], họ đi ra để giữ Ngài lại, vì họ cứ nói rằng: “Ngài đã mất trí rồi.”[b]'
  to: 'Khi những người thân cận với Đức Giê-su nghe tin[a], họ đi ra để khống chế Người, vì họ cứ nói rằng: “Người đã mất trí rồi.”[b]'
  rationale: Sửa cách gọi tên để không thêm tước hiệu không có trong nguyên văn và để phù hợp tiếng Việt chuẩn hiện đại. Sửa động từ chỉ mục đích từ “giữ ... lại” thành “khống chế” nhằm phản ánh sát hơn κρατῆσαι, trong khi vẫn không áp đặt cách hiểu pháp lý. Các điểm mơ hồ về căn tính của nhóm người và sắc thái lời cáo buộc được giữ trong bản chính cùng chú thích.
