  text: καὶ ἀκούσαντες οἱ παρ’ αὐτοῦ ἐξῆλθον κρατῆσαι αὐτόν, ἔλεγον γὰρ ὅτι ἐξέστη.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/021.yaml
  text: And when those close to him heard[a], they went out to seize him, for they were saying[b], “He is out of his mind.”
translation:
  language: vi
  text: 'Khi những người thân cận với Đức Giê-su nghe tin[a], họ đi ra để khống chế Người, vì họ cứ nói rằng: “Người đã mất trí rồi.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “gia đình Người” hoặc “người nhà của Người”; cụm từ Hy Lạp này có tính thành ngữ, có thể chỉ những người thuộc gia đình hoặc vòng thân cận của Đức Giê-su.
    reason: alternative_reading
  - marker: b
    text: Hay “Người không còn tỉnh trí” hoặc “Người không làm chủ được mình.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ παρ’ αὐτοῦ
  choice: những người thân cận với Đức Chúa Jêsus
  rationale: Cụm từ Hy Lạp mang tính thành ngữ và không xác định rõ là gia đình hay những người thuộc vòng thân cận của Ngài. Cách dịch này giữ được sự mơ hồ đích thực và vẫn tự nhiên trong tiếng Việt.
- source_word: ἀκούσαντες
  choice: khi ... nghe tin
  rationale: Phân từ bất định được diễn đạt theo quan hệ thời gian. “Nghe tin” tự nhiên trong ngữ cảnh vì điều được nghe không nêu trực tiếp trong câu.
- source_word: ἐξῆλθον
  choice: họ đi ra
  rationale: Chuyển tải trực tiếp chuyển động của động từ mà không suy đoán quá mức nơi xuất phát hay đích đến.
- source_word: κρατῆσαι
  choice: để giữ Ngài lại
  rationale: κρατέω có nghĩa là nắm giữ hoặc chế ngự. Trong ngữ cảnh, “giữ ... lại” truyền đạt hành động mạnh nhằm ngăn cản mà không hàm ý một vụ bắt giữ hợp pháp.
- source_word: ἔλεγον
  choice: họ cứ nói
  rationale: Thể chưa hoàn thành gợi lời nói đang tiếp diễn hoặc lặp lại; “cứ nói” diễn đạt sắc thái ấy tự nhiên trong tiếng Việt.
- source_word: ἐξέστη
  choice: Ngài đã mất trí rồi
  rationale: Ở đây động từ chỉ tình trạng bị cho là không còn tỉnh trí. Cách nói này rõ ràng, hiện đại và thể hiện đây là lời nhận định của những người kia.
theological_decisions:
- issue: Danh tính của οἱ παρ’ αὐτοῦ
  choice: Dịch khái quát là “những người thân cận với Đức Chúa Jêsus”.
  alternative: “gia đình Ngài”, “người nhà của Ngài” hoặc “những người thuộc về Ngài”
  rationale: Mạch văn tiếp theo khiến cách hiểu là gia đình có khả năng cao, nhưng chính cụm từ Hy Lạp không dùng một danh từ thân tộc rõ ràng. Bản chính vì thế giữ độ mở của nguyên văn, còn các cách hiểu cụ thể hơn được nêu trong chú thích.
- issue: Sắc thái của ἐξέστη
  choice: Dịch lời nhận định là “Ngài đã mất trí rồi”.
  alternative: “Ngài không còn tỉnh trí” hoặc “Ngài không làm chủ được mình”
  rationale: Cách dịch chính truyền đạt thẳng sức nặng của lời cáo buộc mà không biến nó thành lời xác nhận của người kể chuyện.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Chúa Jêsus” để làm rõ đại từ trong cụm mở đầu, rồi dùng “Ngài” nhất quán. Các dấu chú thích [a], [b] đều xuất hiện trong bản văn chính.
