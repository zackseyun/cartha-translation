revisions:
- from: Ngài bảo các môn đồ chuẩn bị sẵn cho mình một chiếc thuyền nhỏ vì đám đông, để họ khỏi chen ép Ngài.[a]
  to: Ngài bảo các môn đồ luôn để sẵn cho Ngài một chiếc thuyền nhỏ, vì đám đông, để đám đông không chen ép Ngài.[a]
  rationale: Bản sửa làm rõ rằng chiếc thuyền được dành cho Chúa Giê-xu và rằng đám đông, không phải các môn đồ, là bên có thể chen ép Ngài. “Luôn để sẵn” giữ sắc thái sẵn sàng/ở trong tình trạng sẵn có của προσκαρτερέω mà vẫn tự nhiên trong tiếng Việt hiện đại. Các yếu tố nghĩa còn lại và chú thích về phạm vi của θλίβω được giữ nguyên.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T07:39:07Z'
review_pass:
  verdict: revise
  source_fidelity: Bản nháp truyền đạt đúng mệnh lệnh, chiếc thuyền nhỏ, nguyên nhân là đám đông, và mục đích tránh bị ép sát. Tuy nhiên, “cho mình” có thể quy chiếu về các môn đồ, trong khi αὐτῷ quy chiếu về Chúa Giê-xu. Đại từ “họ” trong mệnh đề cuối cũng dễ được hiểu là các môn đồ thay vì đám đông, vốn là chủ thể ngầm của θλίβωσιν.
  naturalness: Câu nhìn chung tự nhiên, nhưng hai quy chiếu đại từ nêu trên làm giảm độ rõ ràng. “Luôn để sẵn ... cho Ngài” diễn đạt tự nhiên hơn sắc thái sẵn sàng thường trực của προσκαρτερῇ.
  terminology: “Ngài,” “các môn đồ,” và “một chiếc thuyền nhỏ” phù hợp văn phong Phúc Âm tiếng Việt hiện đại và phản ánh tốt các thuật ngữ nguồn. Chú thích từ vựng là phù hợp; nên neo trực tiếp sau động từ được chú thích.
  issues:
  - severity: medium
    issue: Quy chiếu của “cho mình” không rõ
    rationale: 'Trong “bảo các môn đồ chuẩn bị sẵn cho mình,” “mình” có thể được hiểu là các môn đồ. Nguyên bản αὐτῷ chỉ Chúa Giê-xu: chiếc thuyền phải sẵn sàng cho Ngài.'
  - severity: medium
    issue: Chủ thể của “họ” không rõ
    rationale: Mệnh đề ἵνα μὴ θλίβωσιν αὐτόν có chủ thể số nhiều ngầm là đám đông; “họ” sau “các môn đồ” dễ bị gán cho các môn đồ. Nêu rõ “đám đông” bảo toàn nghĩa và tránh mơ hồ.
  - severity: low
    issue: Vị trí neo chú thích rộng hơn từ cần giải thích
    rationale: Chú thích giải thích θλίβωσιν; đặt [a] ngay sau “chen ép Ngài” neo chú thích chính xác hơn.
