  text: καὶ εἶπεν τοῖς μαθηταῖς αὐτοῦ ἵνα πλοιάριον προσκαρτερῇ αὐτῷ διὰ τὸν ὄχλον ἵνα μὴ θλίβωσιν αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/009.yaml
  text: And he told his disciples that a small boat should stay ready for him because of the crowd[a], so that they might not crush him.
translation:
  language: vi
  text: Ngài bảo các môn đồ luôn để sẵn cho Ngài một chiếc thuyền nhỏ, vì đám đông, để đám đông không chen ép Ngài.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đè ép Ngài” hoặc “ép chặt lấy Ngài.” Động từ Hy Lạp có thể chỉ việc chen lấn, gây sức ép hoặc đè đến mức nguy hiểm.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν
  choice: bảo
  rationale: Trong cấu trúc truyền đạt một chỉ thị, “bảo các môn đồ...” tự nhiên trong tiếng Việt và phản ánh đúng động từ λέγω theo ngữ cảnh.
- source_word: μαθηταῖς
  choice: các môn đồ
  rationale: “Môn đồ” là cách gọi quen thuộc trong văn cảnh Phúc Âm, giữ được quan hệ thầy–trò và sự đi theo.
- source_word: πλοιάριον
  choice: một chiếc thuyền nhỏ
  rationale: Giữ sắc thái chỉ chiếc thuyền nhỏ của πλοιάριον, đồng thời diễn đạt tự nhiên trong tiếng Việt hiện đại.
- source_word: προσκαρτερῇ αὐτῷ
  choice: chuẩn bị sẵn cho mình
  rationale: Diễn đạt ý chiếc thuyền phải luôn sẵn sàng để Chúa Giê-xu sử dụng; “mình” quy chiếu tự nhiên về chủ thể của lời chỉ thị là Ngài.
- source_word: διὰ τὸν ὄχλον
  choice: vì đám đông
  rationale: διά với đối cách nêu nguyên nhân; cách dịch này ngắn gọn, rõ nghĩa.
- source_word: θλίβωσιν
  choice: chen ép
  rationale: Trong cảnh đám đông áp sát, “chen ép” bao quát sức ép thể chất mà không buộc nghĩa phải đến mức bị nghiền nát; chú thích giữ sắc thái mạnh hơn có thể có của động từ.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Ngài” để chỉ Chúa Giê-xu; câu giữ quan hệ nguyên nhân và mục đích của nguyên bản. Dấu chú thích [a] được đặt ngay sau mệnh đề liên quan.
