  text: καὶ ἐξελθόντες οἱ Φαρισαῖοι ⸀εὐθὺς μετὰ τῶν Ἡρῳδιανῶν συμβούλιον ⸀ἐδίδουν κατ’ αὐτοῦ ὅπως αὐτὸν ἀπολέσωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/006.yaml
  text: And the Pharisees went out and immediately began plotting with the Herodians against him[a], how they might destroy him.
translation:
  language: vi
  text: Những người Pha-ri-si đi ra và lập tức bắt đầu bàn mưu với phe Hê-rốt chống lại Ngài, tìm cách tiêu diệt Ngài.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay, nói rõ hơn theo ngữ cảnh: “giết Ngài” hoặc “đưa Ngài đến chỗ chết.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθόντες
  choice: đi ra
  rationale: Phân từ bất định được diễn đạt như hành động đi kèm trong lời kể; cách dịch này tự nhiên và giữ sự chuyển động ra khỏi bối cảnh trước đó.
- source_word: εὐθὺς
  choice: lập tức
  rationale: Giữ nhịp kể khẩn trương đặc trưng của sách Mác.
- source_word: μετὰ τῶν Ἡρῳδιανῶν
  choice: cùng phe Hê-rốt
  rationale: μετά với sở hữu cách chỉ sự liên kết. “Phe Hê-rốt” là cách gọi ngắn gọn, dễ hiểu về nhóm gắn với quyền lợi của triều Hê-rốt.
- source_word: συμβούλιον ἐδίδουν
  choice: bắt đầu ... bàn mưu
  rationale: Thành ngữ chỉ việc cùng nhau bàn bạc, lập kế hoạch; mục đích thù nghịch trong mệnh đề sau cho thấy đây là việc bàn mưu. “Bắt đầu” phản ánh sắc thái khởi đầu/tiếp diễn có thể có của thì vị hoàn.
- source_word: κατ’ αὐτοῦ
  choice: chống lại Ngài
  rationale: κατά với sở hữu cách ở đây mang nghĩa đối nghịch, phù hợp với ý định thù địch.
- source_word: ὅπως
  choice: tìm cách
  rationale: ὅπως với động từ giả định dẫn vào mục đích và phương cách được bàn tính; “tìm cách” diễn đạt tự nhiên sắc thái ấy trong tiếng Việt.
- source_word: ἀπολέσωσιν
  choice: tiêu diệt Ngài
  rationale: ἀπόλλυμι có thể mang nghĩa tiêu diệt, làm cho mất đi hoặc giết. “Tiêu diệt” giữ được độ rộng của từ Hy Lạp, trong khi ngữ cảnh vẫn cho thấy ý định sát hại.
theological_decisions:
- issue: Có nên nói thẳng trong chính văn rằng các lãnh đạo muốn giết Đức Giê-su hay không
  choice: Giữ cách diễn đạt rộng hơn là “tiêu diệt Ngài”.
  alternative: “giết Ngài” hoặc “đưa Ngài đến chỗ chết”
  rationale: Trong ngữ cảnh, ý định rõ ràng hướng đến việc sát hại Đức Giê-su, nhưng ἀπόλλυμι có phạm vi nghĩa rộng hơn động từ “giết”. Chính văn giữ độ rộng ấy, còn chú thích nêu cách hiểu cụ thể hơn theo ngữ cảnh.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” cho đại từ chỉ Đức Giê-su theo ngữ cảnh; “phe Hê-rốt” giúp độc giả phổ thông nhận ra đây là một nhóm có liên hệ với quyền lực Hê-rốt.
