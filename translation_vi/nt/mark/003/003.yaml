  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Giữ câu mệnh lệnh ngắn, trực tiếp; không thêm chủ thể “Chúa Giê-su” vì câu Hy Lạp dùng đại từ ngầm theo mạch văn.
