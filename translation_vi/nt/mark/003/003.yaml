  text: καὶ λέγει τῷ ἀνθρώπῳ τῷ ⸂τὴν χεῖρα ἔχοντι ξηράν⸃· ⸀Ἔγειρε εἰς τὸ μέσον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/003.yaml
  text: And he says to the man with the withered hand[a], “Rise and come to the middle.”
translation:
  language: vi
  text: 'Ngài nói với người có bàn tay bị teo: “Hãy đứng dậy, ra giữa.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: phán
  rationale: Thì hiện tại lịch sử làm câu chuyện của Mác-cô thêm sống động; tiếng Việt tự nhiên không đánh dấu rõ sự đối lập hiện tại–quá khứ trong lối kể này. “Phán” phù hợp với lời trực tiếp trang trọng của Chúa Giê-su.
- source_word: ἀνθρώπῳ
  choice: người
  rationale: “Người” là cách gọi tự nhiên trong tiếng Việt và không phủ nhận việc nhân vật là nam giới; ngữ cảnh không đòi hỏi phải thêm “đàn ông”.
- source_word: τὴν χεῖρα ἔχοντι ξηράν
  choice: có bàn tay teo lại
  rationale: Diễn đạt tự nhiên tình trạng của bàn tay mà vẫn bám sát hình ảnh ξηράν; tránh chẩn đoán y khoa vượt quá bản văn.
- source_word: Ἔγειρε
  choice: Hãy đứng dậy
  rationale: Mệnh lệnh ἐγείρω ở đây có thể là đứng dậy hoặc trỗi dậy; “đứng dậy” rõ ràng và tự nhiên trong bối cảnh một người được gọi ra trước mọi người.
- source_word: εἰς τὸ μέσον
  choice: ra giữa đây
  rationale: Cụm từ chỉ sự chuyển động vào vị trí ở giữa. “Ra giữa đây” tự nhiên trong tiếng Việt và giữ được ý không gian, thay vì chỉ diễn giải chung là “bước lên”.
