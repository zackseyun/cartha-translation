  - severity: low
    issue: “Phán” có sắc thái cổ và tôn kính cao hơn cần thiết
    rationale: λέγει nghĩa cơ bản là “nói”; “nói” tự nhiên hơn trong tiếng Việt hiện đại và vẫn phù hợp với lời trực tiếp của Chúa Giê-su.
