  source_fidelity: Bản nháp truyền đạt đúng người được nói đến, tình trạng bàn tay và mệnh lệnh đứng dậy để đi vào chỗ giữa. Tuy nhiên, “đây” thêm một chỉ dẫn trực chỉ không có trong εἰς τὸ μέσον; bản Hy Lạp chỉ nói đi vào/ra chỗ giữa.
  naturalness: “Ra giữa” là cách nói hiện đại, tự nhiên và gọn cho chuyển động vào vị trí ở giữa. “Ngài nói với” giữ sắc thái trang trọng vừa phải mà không quá cổ như “phán”.
  terminology: “Bàn tay bị teo” diễn đạt tự nhiên ξηράν trong ngữ cảnh này mà không áp đặt một chẩn đoán y khoa cụ thể. “Ngài” phù hợp văn phong Kinh Thánh tiếng Việt khi quy chiếu Chúa Giê-su theo mạch văn.
