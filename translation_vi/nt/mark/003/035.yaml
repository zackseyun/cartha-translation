source:
  edition: SBLGNT
  text: ὃς ⸀γὰρ ἂν ποιήσῃ τὸ θέλημα τοῦ θεοῦ, οὗτος ἀδελφός μου καὶ ⸀ἀδελφὴ καὶ μήτηρ ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/035.yaml
  text: For whoever does the will of God, this one is my brother and sister and mother.
translation:
  language: vi
  text: Vì ai làm theo ý muốn của Đức Chúa Trời, người ấy[a] là anh em trai, chị em gái và mẹ của tôi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “chính người ấy”. Tiếng Hy Lạp dùng một đại từ chỉ định có sức nhấn mạnh, sát nghĩa là “người này”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς ... ἂν ποιήσῃ
  choice: ai làm
  rationale: Đại từ quan hệ đi với ἄν và động từ ở thể giả định diễn tả một điều kiện khái quát, bất định. Cách nói “ai làm” tự nhiên trong tiếng Việt và bao hàm bất cứ người nào.
- source_word: γὰρ
  choice: Vì
  rationale: Liên từ này nêu lý do hoặc lời giải thích cho câu trước; “Vì” giữ rõ mối liên kết lập luận.
- source_word: ποιήσῃ
  choice: làm theo
  rationale: ποιέω có nghĩa là làm hoặc thực hiện. Trong cụm nói về ý muốn của Đức Chúa Trời, “làm theo” là cách diễn đạt tự nhiên, thể hiện việc thực hiện ý muốn ấy mà không thêm ý niệm ngoài nguyên văn.
- source_word: τὸ θέλημα τοῦ θεοῦ
  choice: ý muốn của Đức Chúa Trời
  rationale: Giữ cấu trúc sở hữu và nghĩa trực tiếp của cụm từ Hy Lạp bằng lối diễn đạt trang trọng, quen thuộc trong tiếng Việt.
- source_word: οὗτος
  choice: người ấy
  rationale: Đại từ chỉ định này quy chiếu nhấn mạnh về bất cứ ai vừa được nói đến. “Người ấy” tự nhiên hơn “người này” trong câu khái quát, đồng thời không biến chủ ngữ số ít thành số nhiều hay giới hạn vào nam giới.
- source_word: ἀδελφός μου καὶ ἀδελφὴ καὶ μήτηρ
  choice: anh em trai, chị em gái và mẹ của tôi
  rationale: Giữ riêng từng danh từ thân tộc nam, nữ và người mẹ, qua đó bảo toàn sức mạnh tu từ của việc Chúa Giê-su định nghĩa lại quan hệ gia đình. “Anh em trai” và “chị em gái” tránh buộc nghĩa vào tuổi tác, điều mà tiếng Hy Lạp không xác định.
- source_word: ἐστίν
  choice: là
  rationale: Dịch trực tiếp động từ liên kết số ít, phù hợp với chủ ngữ “người ấy”.
theological_decisions:
- issue: Chủ ngữ số ít có hình thức giống đực nhưng vị ngữ gồm các vai thân tộc nam và nữ
  choice: người ấy
  alternative: người đó; người ấy chính là; ông ấy
  rationale: “Người ấy” giữ số ít và lực chỉ định của οὗτος nhưng không khiến câu bị hiểu là chỉ nói về nam giới, nhất là khi chính câu nêu cả “anh em trai”, “chị em gái” và “mẹ”.
- issue: Tính chất của ngôn ngữ gia đình trong lời Chúa Giê-su
  choice: giữ nguyên các danh xưng thân tộc cụ thể
  alternative: người nhà của tôi; thành viên gia đình tôi
  rationale: Các danh từ cụ thể diễn tả quan hệ gia đình theo nghĩa ẩn dụ và là trọng tâm thần học, tu từ của câu. Khái quát hóa thành “người nhà” sẽ làm mất sự liệt kê có chủ ý.
- issue: Đại từ tự xưng của Chúa Giê-su
  choice: tôi
  alternative: Ta
  rationale: “Tôi” là đại từ tự xưng hiện đại, trung tính và dễ hiểu trong lời nói trực tiếp; nguyên văn chỉ có đại từ sở hữu ngôi thứ nhất và không mã hóa mức độ tôn xưng như sự đối lập giữa “tôi” và “Ta” trong tiếng Việt.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu giữ cấu trúc giải thích mở đầu bằng “Vì”, chủ ngữ khái quát số ít và ba danh xưng thân tộc riêng biệt. Đại từ “tôi” tránh đưa thêm sắc thái quyền uy vốn không được mã hóa trong đại từ Hy Lạp.
