id: MRK.3.24
reference: Mark 3:24
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἐὰν βασιλεία ἐφ’ ἑαυτὴν μερισθῇ, οὐ δύναται σταθῆναι ἡ βασιλεία ἐκείνη·
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/024.yaml
  text: And if a kingdom is divided against itself, that kingdom cannot stand.
translation:
  language: vi
  text: Nếu một vương quốc bị chia rẽ chống lại chính mình, vương quốc ấy không thể đứng vững.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: Nếu
  rationale: Trong tiếng Việt, không cần dịch riêng liên từ καὶ ở đầu câu; mở trực tiếp bằng “Nếu” giữ mạch lập luận tự nhiên và không làm thay đổi quan hệ nối tiếp với câu trước.
- source_word: ἐὰν
  choice: nếu
  rationale: Dẫn vào mệnh đề điều kiện với động từ ở thể giả định; “nếu” là cách diễn đạt tự nhiên và chính xác trong một nguyên tắc mang tính khái quát.
- source_word: βασιλεία
  choice: vương quốc
  rationale: Ở đây từ này chỉ một thực thể chính trị-xã hội trong hình ảnh so sánh, nên “vương quốc” phù hợp hơn nghĩa trừu tượng “quyền trị vì”.
- source_word: ἐφ’ ἑαυτὴν
  choice: chống lại chính mình
  rationale: Thành ngữ này diễn tả sự đối nghịch nội bộ; cách dịch giữ rõ đại từ phản thân và sắc thái xung đột.
- source_word: μερισθῇ
  choice: tự chia rẽ
  rationale: Động từ aorist bị động giả định nói đến tình trạng bị phân chia. Tiếng Việt dùng “tự chia rẽ” tự nhiên trong kết cấu với “chống lại chính mình”, nhấn mạnh sự phân rẽ từ bên trong mà không xác định thêm tác nhân bên ngoài.
- source_word: οὐ δύναται
  choice: không thể
  rationale: Diễn đạt ngắn gọn, hiện đại và đúng ý về sự bất khả năng.
- source_word: σταθῆναι
  choice: đứng vững
  rationale: Giữ hình ảnh “đứng” của nguyên ngữ đồng thời diễn đạt rõ nghĩa tiếp tục tồn tại, không sụp đổ trong tiếng Việt.
- source_word: ἡ βασιλεία ἐκείνη
  choice: vương quốc ấy
  rationale: Giữ sự lặp lại danh từ và đại từ chỉ định của tiếng Hy Lạp, qua đó bảo toàn sức nhấn tu từ.
theological_decisions:
- issue: Tính chất của lời nói
  choice: Dịch như một nguyên tắc khái quát nằm trong lập luận của Chúa Giê-su, không thêm nhận định thần học hay chính trị ngoài điều câu văn nói rõ.
  alternative: Diễn giải thành một châm ngôn có phạm vi áp dụng chính trị-xã hội rộng hơn hoặc nói rõ thêm về Sa-tan.
  rationale: Trong ngữ cảnh, câu này là một phép loại suy thuộc lời bác bỏ của Chúa Giê-su. Bản dịch giữ sức khái quát như châm ngôn nhưng không mở rộng phạm vi thần học của câu.
translation_notes:
  register: Văn phong tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. “Đứng vững” vừa tự nhiên vừa giữ ẩn dụ của nguyên ngữ; không cần chú thích.
