translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Đại từ “Ngài” nối chủ thể hàm ẩn của động từ với văn cảnh trước; “một hội đường” giữ tính không xác định của danh từ Hy Lạp. Dấu chú thích [a] được đặt ngay sau cụm từ mà chú thích giải thích.
