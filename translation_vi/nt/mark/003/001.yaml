base_translation:
  language: en
  yaml_path: translation/nt/mark/003/001.yaml
  text: And he entered a synagogue again[c][b][a], and a man was there with a withered hand.
translation:
  language: vi
  text: Ngài lại vào một hội đường, và ở đó có một người có bàn tay bị khô quắt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “có bàn tay bị teo.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσῆλθεν
  choice: vào
  rationale: Động từ ở thì aorist diễn tả hành động đi vào; “vào” tự nhiên và đầy đủ trong lối kể chuyện tiếng Việt.
- source_word: πάλιν
  choice: lại
  rationale: Diễn đạt trực tiếp hành động được lặp lại và đặt tự nhiên trước động từ trong tiếng Việt.
- source_word: εἰς συναγωγήν
  choice: vào một hội đường
  rationale: Giữ ý chuyển động của εἰς và không xác định quá mức danh từ không có mạo từ; “hội đường” là cách gọi quen thuộc cho nơi nhóm họp Do Thái.
- source_word: ἦν ἐκεῖ
  choice: ở đó có
  rationale: Cấu trúc hiện hữu tự nhiên trong tiếng Việt, đồng thời thể hiện rõ trạng từ chỉ nơi chốn ἐκεῖ.
- source_word: ἄνθρωπος
  choice: một người
  rationale: ἄνθρωπος chỉ một con người; ở câu này bản Hy Lạp không cần được xác định thêm là nam giới, nên “một người” vừa chính xác vừa tự nhiên.
- source_word: ἐξηραμμένην
  choice: bị teo
  rationale: Phân từ hoàn thành mô tả bàn tay ở trong tình trạng khô quắt hoặc teo lại. “Bị teo” truyền đạt rõ tình trạng suy giảm thể chất trong tiếng Việt hiện đại.
- source_word: ἔχων τὴν χεῖρα
  choice: bị teo một bàn tay
  rationale: Chuyển cấu trúc sát chữ “có bàn tay bị khô teo” thành cách nói tự nhiên trong tiếng Việt mà vẫn giữ tình trạng của bàn tay.
