- from: Ngài lại vào một hội đường, và ở đó có một người bị teo một bàn tay.[a]
  to: Ngài lại vào một hội đường, và ở đó có một người có bàn tay bị khô quắt.[a]
  rationale: Sửa riêng cụm mô tả bàn tay để câu tiếng Việt tự nhiên và phản ánh rõ hơn hình ảnh của nguyên ngữ. Giữ nguyên tính không xác định của “một hội đường,” ý “lại,” và cách giới thiệu “một người” không xác định giới tính. Chú thích được neo ngay sau cụm “bàn tay bị khô quắt” và cung cấp phương án từ vựng hợp lệ.
