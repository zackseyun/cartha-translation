source:
  edition: SBLGNT
  text: Καὶ ἀναβαίνει εἰς τὸ ὄρος καὶ προσκαλεῖται οὓς ἤθελεν αὐτός, καὶ ἀπῆλθον πρὸς αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/013.yaml
  text: And he went up on the mountain and called to himself those whom he wanted[b][a], and they came to him.
translation:
  language: vi
  text: Rồi Đức Chúa Giê-xu lên núi và gọi những người mà chính Ngài muốn đến với mình, và họ đến với Ngài.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναβαίνει
  choice: lên
  rationale: Thì hiện tại lịch sử được chuyển theo lối kể chuyện tiếng Việt tự nhiên; động từ “lên” giữ rõ hướng đi lên mà không tạo sắc thái quá trang trọng.
- source_word: εἰς τὸ ὄρος
  choice: lên núi
  rationale: Kết hợp tự nhiên với ἀναβαίνει trong tiếng Việt, diễn tả việc đi lên vùng núi mà không ép mạo từ Hy Lạp thành một sự xác định không cần thiết.
- source_word: προσκαλεῖται
  choice: gọi đến với mình
  rationale: Cách dịch này giữ sắc thái trung động về sự đích thân tham dự và quan tâm của Đức Chúa Giê-xu, đồng thời diễn tả việc Ngài gọi họ đến bên mình.
- source_word: οὓς ἤθελεν αὐτός
  choice: những người chính Ngài muốn
  rationale: “Chính Ngài” giữ lực nhấn mạnh của αὐτός; “muốn” là cách diễn đạt hiện đại, tự nhiên và không diễn giải quá mức.
- source_word: ἀπῆλθον πρὸς αὐτόν
  choice: họ liền đến với Ngài
  rationale: Trong ngữ cảnh chuyển động hướng về Đức Chúa Giê-xu, “đến với Ngài” là tiếng Việt tự nhiên; “liền” chuyển tải mạch nối tiếp của καί mà không thêm nội dung thần học.
theological_decisions:
- issue: Sự nhấn mạnh vào lựa chọn riêng của Đức Chúa Giê-xu khi gọi người
  choice: Giữ rõ bằng cụm “chính Ngài muốn”.
  alternative: “những người Ngài muốn”
  rationale: Đại từ αὐτός có tính nhấn mạnh, nhưng bản dịch không mở rộng câu này thành một khẳng định về bất kỳ hệ thống giáo lý tuyển chọn nào.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và dễ hiểu. Dùng “Đức Chúa Giê-xu” để làm rõ chủ thể theo ngữ cảnh và “Ngài” làm đại từ tôn kính; tránh từ Hán-Việt nặng như “triệu tập” hoặc “triệu gọi”.
