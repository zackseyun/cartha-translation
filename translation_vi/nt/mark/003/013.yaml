review_pass:
  verdict: revise
  source_fidelity: Bản dịch giữ đúng các hành động chính và lực nhấn của αὐτός qua “chính Ngài”. Tuy nhiên, “liền” thêm sắc thái tức khắc không được biểu thị bởi καί; nên bỏ để không mở rộng nghĩa nguồn.
  naturalness: “Gọi đến với mình những người...” không tự nhiên vì thiếu bổ ngữ trực tiếp ngay sau “gọi”. Trật tự “gọi những người mà chính Ngài muốn đến với mình” rõ ràng và tự nhiên hơn trong tiếng Việt hiện đại.
  terminology: “Đức Chúa Giê-xu” và “Ngài” phù hợp với văn phong trang nghiêm của bản thảo. “Muốn” chuyển tải θέλω tự nhiên, không áp đặt diễn giải thần học.
  issues:
  - severity: medium
    issue: Cụm “gọi đến với mình những người chính Ngài muốn” có trật tự từ gượng và dễ gây vấp khi đọc.
    rationale: προσκαλεῖται οὓς ἤθελεν αὐτός trực tiếp nói rằng Ngài gọi những người Ngài muốn đến với mình. Đặt “những người” ngay sau “gọi” phản ánh quan hệ cú pháp này tự nhiên hơn.
  - severity: low
    issue: Từ “liền” bổ sung ý về sự tức khắc.
    rationale: Câu Hy Lạp chỉ nối mệnh đề bằng καί; không có trạng từ tương ứng với “liền”. Bỏ từ này giúp giữ nguyên mức độ thông tin của nguồn.
  revised_text: Rồi Đức Chúa Giê-xu lên núi và gọi những người mà chính Ngài muốn đến với mình, và họ đến với Ngài.
