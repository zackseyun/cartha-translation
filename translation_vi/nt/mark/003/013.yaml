revisions:
- from: Rồi Đức Chúa Giê-xu lên núi và gọi đến với mình những người chính Ngài muốn; họ liền đến với Ngài.
  to: Rồi Đức Chúa Giê-xu lên núi và gọi những người mà chính Ngài muốn đến với mình, và họ đến với Ngài.
  rationale: Sửa trật tự từ để diễn đạt tự nhiên quan hệ “gọi ... đến với mình”, giữ lực nhấn mạnh của αὐτός bằng “chính Ngài”, và bỏ “liền” vì nguồn không nêu sự tức khắc. Không cần chú thích, vì không có biến thể hay mơ hồ đáng kể cần ghi chú trong bản dịch tiếng Việt.
  reviewer_model: gpt-5.6-terra
