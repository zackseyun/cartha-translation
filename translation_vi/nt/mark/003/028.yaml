revisions:
- from: 'Thật, tôi nói với các ông: mọi tội lỗi của con cái loài người[a] sẽ được tha, kể cả mọi lời phạm thượng họ nói ra;'
  to: 'Thật, tôi nói với các ông: mọi tội lỗi và bất cứ lời phạm thượng nào họ nói ra đều sẽ được tha thứ cho con cái loài người[a];'
  rationale: Sửa cấu trúc liệt kê để phản ánh τὰ ἁμαρτήματα καὶ αἱ βλασφημίαι, và dùng “bất cứ ... nào” cho mệnh đề ὅσα ἐὰν. Giữ “con cái loài người” trong chính văn cùng chú thích để bảo tồn sắc thái thành ngữ và làm rõ nghĩa khái quát. Dấu chấm phẩy được giữ vì phát ngôn tiếp diễn sang câu sau.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T07:39:22Z'
review_pass:
  verdict: revise
  source_fidelity: Bản nháp chuyển đạt đúng lời khẳng định bao quát về sự tha thứ, đối tượng nhận là toàn thể nhân loại, và các lời phạm thượng. Tuy nhiên, “kể cả” diễn giải quan hệ liên kết đơn thuần καί như một quan hệ bao gồm, còn “mọi lời ... họ nói ra” chưa biểu đạt rõ sắc thái bất định/không giới hạn của ὅσα ἐὰν. Bản sửa giữ nguyên phạm vi rộng của câu và không đưa ngoại lệ ở câu 29 vào.
  naturalness: 'Câu sửa dùng trật tự tiếng Việt rõ hơn: các đối tượng được tha thứ được nêu song song, rồi mới đến “đều sẽ được tha thứ cho...”. “Tha thứ cho” diễn đạt sáng rõ đối tượng ở dữ cách mà không cần nêu tác nhân của thể bị động.'
  terminology: “Tội lỗi,” “lời phạm thượng,” và “con cái loài người” đều phù hợp ngữ cảnh và giữ được sắc thái Kinh Thánh. Chú thích giải thích chính xác tính khái quát của cụm từ Hy Lạp; không cần thay đổi.
  issues:
  - severity: low
    issue: “kể cả” thêm sắc thái bao gồm không được nêu riêng bởi liên từ καί.
    rationale: Nguyên văn đặt “các tội lỗi” và “các lời phạm thượng” trong cùng phạm vi của πάντα bằng liên từ “và”. Cách liệt kê song song giữ cấu trúc và sức khẳng định của câu sát hơn.
  - severity: low
    issue: Mệnh đề “mọi lời phạm thượng họ nói ra” chưa thể hiện đầy đủ tính bất định của ὅσα ἐὰν βλασφημήσωσιν.
    rationale: “Bất cứ ... nào họ nói ra” diễn đạt tự nhiên hơn trong tiếng Việt phạm vi mở “dù là những lời nào/họ có thể nói ra bao nhiêu đi nữa” của mệnh đề Hy Lạp.
