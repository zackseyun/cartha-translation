source:
  edition: SBLGNT
  text: Ἀμὴν λέγω ὑμῖν ὅτι πάντα ἀφεθήσεται ⸂τοῖς υἱοῖς τῶν ἀνθρώπων, τὰ ἁμαρτήματα⸃ καὶ ⸂αἱ βλασφημίαι ὅσα ἐὰν⸃ βλασφημήσωσιν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/028.yaml
  text: Truly I tell you that all sins will be forgiven to the sons of men[a], and whatever blasphemies they may utter;
translation:
  language: vi
  text: 'Thật, tôi nói với các ông: mọi tội lỗi và bất cứ lời phạm thượng nào họ nói ra đều sẽ được tha thứ cho con cái loài người[a];'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “loài người” hoặc “mọi người.” Cụm từ Hy Lạp dịch sát là “các con trai của loài người,” một cách nói chỉ nhân loại nói chung.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀμὴν
  choice: Thật
  rationale: Trong công thức long trọng Ἀμὴν λέγω ὑμῖν của các sách Tin Mừng Nhất Lãm, “Thật” truyền đạt chức năng xác quyết tự nhiên hơn việc phiên âm “A-men”.
- source_word: λέγω ὑμῖν
  choice: tôi nói với các ông
  rationale: Giữ ngôi thứ nhất, lời trực tiếp và số nhiều của đại từ; “các ông” phù hợp với nhóm người nghe nam giới trong ngữ cảnh.
- source_word: πάντα ... τὰ ἁμαρτήματα
  choice: mọi tội lỗi
  rationale: πάντα có phạm vi bao quát và được cụ thể hóa bằng τὰ ἁμαρτήματα; cách diễn đạt này tự nhiên và đầy đủ trong tiếng Việt.
- source_word: ἀφεθήσεται
  choice: sẽ được tha
  rationale: Thể tương lai bị động của ἀφίημι trong ngữ cảnh tội lỗi mang nghĩa được tha thứ; “được tha” là cách nói tiếng Việt gọn và quen thuộc.
- source_word: τοῖς υἱοῖς τῶν ἀνθρώπων
  choice: của con cái loài người
  rationale: Dữ cách Hy Lạp chỉ những người nhận sự tha thứ. Tiếng Việt tự nhiên diễn đạt “tội lỗi của ai được tha”; “con cái loài người” giữ sắc thái thành ngữ Sê-mít và ý nghĩa chỉ nhân loại nói chung.
- source_word: αἱ βλασφημίαι
  choice: mọi lời phạm thượng
  rationale: “Lời phạm thượng” giữ lực tôn giáo của βλασφημίαι trong ngữ cảnh gần nói về Đức Thánh Linh, đồng thời tự nhiên hơn danh từ Hán-Việt trừu tượng đứng riêng.
- source_word: ὅσα ἐὰν βλασφημήσωσιν
  choice: kể cả mọi lời phạm thượng họ nói ra
  rationale: Diễn đạt phạm vi không giới hạn của ὅσα ἐάν với động từ giả định, đồng thời cho thấy các lời phạm thượng nằm trong phạm vi của lời tuyên bố về sự tha thứ.
theological_decisions:
- issue: Phạm vi của lời tuyên bố tha thứ so với lời cảnh báo kế tiếp về sự phạm thượng đến Đức Thánh Linh
  choice: Giữ nguyên lời tuyên bố bao quát về sự tha thứ trong câu này, không đưa ngoại lệ của câu kế tiếp vào.
  alternative: Ngầm giới hạn phạm vi tha thứ ngay trong câu này.
  rationale: Bản thân câu 28 tuyên bố rộng rãi, còn câu kế tiếp mới nêu ngoại lệ; bản dịch cần giữ nguyên trình tự và sức căng thần học ấy.
- issue: Ý nghĩa khái quát của τοῖς υἱοῖς τῶν ἀνθρώπων
  choice: Dùng “con cái loài người” trong chính văn và giải thích nghĩa bao quát trong chú thích.
  alternative: Dùng trực tiếp “mọi người” hoặc “loài người”.
  rationale: Cách chọn này giữ hình ảnh và sắc thái Sê-mít của nguyên văn, nhưng chú thích làm rõ rằng cụm từ chỉ con người nói chung, không riêng nam giới.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dấu hai chấm làm rõ phần tuyên bố sau công thức long trọng; dấu chấm phẩy cuối câu được giữ vì lời nói tiếp tục sang câu kế tiếp.
