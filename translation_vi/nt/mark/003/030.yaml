review_pass:
  verdict: revise
  source_fidelity: Cần sửa “tà linh” thành “thần ô uế”. Πνεῦμα ἀκάθαρτον nêu cụ thể một “spirit” được mô tả là “unclean”; “tà linh” chỉ ý ác/tà mà làm mất đặc tính ἀκάθαρτον và liên kết thuật ngữ trong Phúc Âm. “Vì họ cứ nói” chuyển đạt phù hợp quan hệ nhân quả của ὅτι và sắc thái vị hoàn/lặp lại của ἔλεγον. “Có” giữ đúng động từ ἔχει, không diễn giải ngay trong chính văn.
  naturalness: '“Vì họ cứ nói: ‘Ông ấy có một thần ô uế.’” là câu tiếng Việt hiện đại, rõ nghĩa và giữ được giọng thuật lại lời buộc tội. “Thần ô uế” trang trọng vừa phải và sát thuật ngữ Kinh Thánh hơn “tà linh”.'
  terminology: Dùng “thần ô uế” cho Πνεῦμα ἀκάθαρτον để bảo toàn cả danh từ “thần” và tính từ “ô uế”. Giữ “bị một thần ô uế ám” trong chú thích như cách diễn đạt thành ngữ, không thay thế lối nói trực tiếp “có” của nguyên văn.
  issues:
  - severity: medium
    issue: “tà linh” không chuyển đạt đặc tính “ô uế”.
    rationale: ἀκάθαρτον nghĩa là “ô uế/không thanh sạch”; “tà” khái quát ý xấu hoặc lệch lạc, nên không bảo toàn lựa chọn từ vựng và liên kết thuật ngữ của nguyên ngữ.
  revised_text: 'vì họ cứ nói[a]: “Ông ấy có một thần ô uế.”'
