  yaml_path: translation/nt/mark/003/030.yaml
  text: because they were saying[a], “He has an unclean spirit.”
translation:
  language: vi
  text: 'vì họ cứ nói[a]: “Ông ấy có một thần ô uế.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể diễn đạt theo thành ngữ: “Ông ấy bị một thần ô uế ám.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: vì
  rationale: Trong ngữ cảnh, liên từ nêu lý do cho lời tuyên bố ngay trước đó của Đức Giê-su; “vì” diễn đạt rõ quan hệ nguyên nhân.
- source_word: ἔλεγον
  choice: họ cứ nói rằng
  rationale: Thì vị hoàn biểu thị lời nói đang tiếp diễn hoặc được lặp lại; “cứ nói” giữ được sắc thái ấy tự nhiên trong tiếng Việt.
- source_word: Πνεῦμα ἀκάθαρτον
  choice: một tà linh
  rationale: “Tà linh” là cách gọi tự nhiên, dễ hiểu trong tiếng Việt hiện đại đối với một linh ô uế hoặc thuộc về điều ác, đồng thời phù hợp với cách dùng trong các sách Phúc Âm.
- source_word: ἔχει
  choice: có
  rationale: Động từ Hy Lạp có nghĩa trực tiếp là “có”. Giữ nguyên cách diễn đạt ngắn, mạnh của lời cáo buộc, thay vì đưa hàm ý “bị ám” vào chính văn.
theological_decisions:
- issue: Bản chất lời cáo buộc nhắm vào Đức Giê-su
  choice: 'Giữ lời cáo buộc trực tiếp: “Ông ấy có một tà linh.”'
  alternative: “Ông ấy bị một tà linh ám.”
  rationale: Bản văn tường thuật lời kết tội gay gắt của các đối thủ bằng động từ đơn giản “có”. Bản dịch chính không mở rộng thành một cách giải thích về trạng thái bị quỷ ám, nhưng ghi nhận cách hiểu thành ngữ ấy trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Họ cứ nói” thể hiện khía cạnh tiếp diễn/lặp lại của ἔλεγον. Dùng “ông ấy” trong lời tường thuật gián tiếp về cách những người chống đối nói đến Đức Giê-su, tránh tự thêm một danh xưng tôn kính không có trong câu Hy Lạp.
