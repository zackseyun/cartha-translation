base_translation:
  language: en
  yaml_path: translation/nt/mark/003/014.yaml
  text: And he appointed twelve[a], so that they might be with him and so that he might send them out to preach[b],
translation:
  language: vi
  text: Ngài lập mười hai người[a], để họ ở với Ngài và để Ngài sai họ đi rao giảng[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Một số thủ bản thêm: “và Ngài cũng gọi họ là các sứ đồ.”'
    reason: textual_variant
  - marker: b
    text: Cũng có thể dịch là “công bố.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐποίησεν
  choice: lập
  rationale: Động từ có nghĩa đen là “làm”, nhưng trong ngữ cảnh này chỉ việc thiết lập hay chỉ định một nhóm. “Lập” tự nhiên, cô đọng và không thêm một chức danh không có trong bản văn chính.
- source_word: δώδεκα
  choice: mười hai người
  rationale: Tiếng Hy Lạp chỉ ghi “mười hai” mà lược danh từ. Tiếng Việt cần thêm “người” để câu rõ và tự nhiên, nhưng không thêm “sứ đồ” vì bản văn SBLGNT tại đây không có chức danh ấy.
- source_word: ἵνα ὦσιν μετ’ αὐτοῦ
  choice: để họ ở với Ngài
  rationale: ἵνα với động từ ở thể giả định diễn tả mục đích. “Để” truyền đạt trực tiếp mục đích; tiếng Việt không cần một hình thức riêng tương ứng với sắc thái giả định.
- source_word: ἀποστέλλῃ
  choice: Ngài sai họ đi
  rationale: Cách dịch này giữ nghĩa sai phái của ἀποστέλλω và diễn đạt tự nhiên trong tiếng Việt, nhưng không biến động từ thành chức danh “sứ đồ”.
- source_word: κηρύσσειν
  choice: rao giảng
  rationale: κηρύσσω chỉ việc công bố công khai. “Rao giảng” phù hợp ngữ cảnh sứ vụ; “công bố” vẫn là một khả năng từ vựng chính đáng và được ghi ở chú thích.
theological_decisions:
- issue: Có đưa chức danh “sứ đồ” hàm ẩn vào chính văn hay không
  choice: Không thêm “sứ đồ” vào chính văn.
  alternative: “Ngài lập mười hai người, và gọi họ là sứ đồ...”
  rationale: Bản văn SBLGNT được cung cấp chỉ có “Ngài lập mười hai người”; cụm nói rằng Ngài gọi họ là sứ đồ thuộc một dị bản. Giữ cụm ấy trong chú thích bảo đảm minh bạch về chứng cứ bản văn mà không loại bỏ truyền thống dị bản.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Đại từ “Ngài” giữ lối quy chiếu tôn kính phổ biến dành cho Chúa Giê-su. Dấu phẩy cuối câu được giữ vì câu 14 tiếp tục sang câu 15 trong ngữ cảnh.
