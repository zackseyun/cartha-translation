revisions:
- from: Vì Ngài đã chữa lành nhiều người, nên tất cả những ai mắc bệnh tật[a] đều chen lấn, xô về phía Ngài để chạm vào Ngài.[b]
  to: Vì Ngài đã chữa lành nhiều người, nên tất cả những ai đang chịu đau đớn[a] đều xô đến áp vào Ngài[b] để chạm vào Ngài.
  rationale: Bản sửa bảo toàn cấu trúc và ý nghĩa của câu, nhưng dùng “xô đến áp vào Ngài” để phản ánh trực tiếp hơn ἐπιπίπτειν αὐτῷ. “Đang chịu đau đớn” giữ sự mơ hồ có chủ ý và phạm vi nghĩa rộng của μάστιγας tốt hơn “mắc bệnh tật”; các chú thích được chỉnh để hỗ trợ, không mở rộng sai lệch, các khả năng từ vựng của nguyên văn.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T07:39:14Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch truyền đạt đúng quan hệ giải thích–kết quả, việc chữa lành, mục đích chạm vào Ngài và tính bao quát của ὅσοι. Tuy nhiên, “chen lấn, xô về phía Ngài” làm giảm lực trực tiếp của ἐπιπίπτειν αὐτῷ: động từ mô tả họ xô/ập vào Ngài, không chỉ di chuyển về phía Ngài. “Mắc bệnh tật” cũng thu hẹp μάστιγας, một từ hình tượng chỉ những sự đau đớn/khổ sở nghiêm trọng trong ngữ cảnh chữa lành.'
  naturalness: Câu nhìn chung tự nhiên, trang trọng và phù hợp tiếng Việt hiện đại. “Đều xô đến áp vào Ngài” vừa tự nhiên trong cảnh đám đông vừa sát hình ảnh mạnh của nguyên văn hơn. “Đang chịu đau đớn” tránh cụm hơi nặng “mắc bệnh tật” và giữ phạm vi nghĩa rộng hơn.
  terminology: “Chữa lành” và “chạm vào Ngài” phù hợp. Giữ “Ngài” nhất quán với đăng ký văn phong của bản thảo. Chú thích về μάστιγας nên bỏ lựa chọn “tai họa”, vì trong ngữ cảnh này nó có thể gợi một nghĩa quá rộng và không phản ánh rõ cách dùng chỉ sự đau đớn/bệnh tật; chú thích về ἐπιπίπτειν nên neo trực tiếp tại hành động xô đến áp vào Ngài.
  issues:
  - severity: medium
    issue: Lực của ἐπιπίπτειν αὐτῷ bị giảm nhẹ trong câu chính.
    rationale: “Xô về phía Ngài” có thể chỉ chuyển động hướng đến Ngài, trong khi ἐπιπίπτειν mang ý xô/ập lên hoặc áp vào đối tượng. Cần diễn đạt sự dồn xô trực tiếp mà không buộc phải hiểu là ngã thật sự.
  - severity: medium
    issue: “Mắc bệnh tật” thu hẹp nghĩa của μάστιγας.
    rationale: Mάστιγας theo nghĩa đen là “đòn roi” và được dùng hình tượng cho các chứng đau đớn, khổ sở hoặc bệnh tật nặng; “đang chịu đau đớn” bảo toàn độ rộng này trong khi vẫn hợp văn mạch chữa lành.
  - severity: low
    issue: Chú thích a nêu “chịu những tai họa” như một lựa chọn tương đương.
    rationale: Cách nói này dễ chuyển sang nghĩa tai họa bên ngoài hơn là tình trạng đau đớn/bệnh tật mà những người ấy đang mang chịu trong văn cảnh.
