  text: πολλοὺς γὰρ ἐθεράπευσεν, ὥστε ἐπιπίπτειν αὐτῷ ἵνα αὐτοῦ ἅψωνται ὅσοι εἶχον μάστιγας.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/010.yaml
  text: For he had healed many, so that all who had afflictions were pressing in on him in order to touch him.
translation:
  language: vi
  text: Vì Ngài đã chữa lành nhiều người, nên tất cả những ai đang chịu đau đớn[a] đều xô đến áp vào Ngài[b] để chạm vào Ngài.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “có những chứng bệnh” hoặc “chịu những sự khổ sở”; từ Hy Lạp theo nghĩa đen là “những đòn roi” và được dùng theo nghĩa hình tượng về các chứng đau đớn hay bệnh tật nghiêm trọng.
    reason: lexical_alternative
  - marker: b
    text: Hay “ập lên Ngài” hoặc “ngã lên Ngài”; cụm từ Hy Lạp có sắc thái mạnh, diễn tả đám đông dồn xô trực tiếp về phía Ngài.
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὺς
  choice: nhiều người
  rationale: Tính từ số nhiều đối cách làm bổ ngữ cho động từ “chữa lành”; tiếng Việt cần thêm “người” để diễn đạt tự nhiên và rõ đối tượng.
- source_word: γὰρ
  choice: Vì
  rationale: Giữ chức năng giải thích nguyên nhân của tình cảnh được thuật lại trong văn mạch.
- source_word: ἐθεράπευσεν
  choice: đã chữa lành
  rationale: Thì aorist chỉ hoạt động chữa lành đã xảy ra và giải thích hành động hiện tại của đám đông; “đã” thể hiện quan hệ thời gian tự nhiên trong tiếng Việt.
- source_word: ὥστε
  choice: nên
  rationale: Diễn đạt kết quả do việc Ngài đã chữa lành nhiều người gây ra, ngắn gọn và tự nhiên.
- source_word: ἐπιπίπτειν αὐτῷ
  choice: chen lấn, xô về phía Ngài
  rationale: ἐπιπίπτω có sắc thái mạnh, theo nghĩa đen là “ngã/ập lên”; trong bối cảnh đám đông, cách dịch này truyền đạt cảnh mọi người dồn ép và tràn về phía Chúa Giê-su mà không tạo cảm tưởng họ thực sự ngã lên Ngài.
- source_word: ἵνα
  choice: để
  rationale: Biểu thị mục đích của việc họ xô về phía Ngài.
- source_word: αὐτοῦ ἅψωνται
  choice: chạm vào Ngài
  rationale: ἅπτομαι với sở hữu cách thường có nghĩa là chạm đến một người hay vật; đây là tiếp xúc thân thể trong bối cảnh chữa lành.
- source_word: ὅσοι
  choice: tất cả những ai
  rationale: Giữ sắc thái bao quát của đại từ quan hệ, chỉ toàn bộ những người đang chịu bệnh tật trong đám đông.
- source_word: εἶχον μάστιγας
  choice: mắc bệnh tật
  rationale: μάστιξ theo nghĩa đen là “roi/vết roi” nhưng ở đây được dùng ẩn dụ về những chứng đau đớn hay bệnh tật nghiêm trọng. “Mắc bệnh tật” rõ nghĩa trong bối cảnh chữa lành, còn chú thích bảo lưu hình ảnh mạnh và phạm vi nghĩa rộng hơn.
theological_decisions:
- issue: Bản chất của μάστιγας trong bối cảnh chữa lành
  choice: mắc bệnh tật
  alternative: chịu những tai họa; mang những chứng đau đớn; chịu những đòn roi
  rationale: Văn mạch cho thấy đây là các chứng khiến người ta tìm đến để được chữa lành, nhưng từ Hy Lạp có hình ảnh mạnh hơn một thuật ngữ y khoa thuần túy. Bản chính ưu tiên sự rõ ràng, còn chú thích giữ nghĩa đen và độ rộng của từ.
- issue: Mức độ mạnh của ἐπιπίπτειν αὐτῷ
  choice: chen lấn, xô về phía Ngài
  alternative: ập lên Ngài; ngã lên Ngài; dồn ép Ngài
  rationale: Cách dịch giữ chuyển động mạnh của đám đông nhưng không quyết định rằng họ đã thật sự ngã hoặc đè lên thân thể Ngài; chú thích bảo lưu cách hiểu sát chữ hơn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng đại từ “Ngài” phù hợp lối kể Kinh Thánh tiếng Việt; cấu trúc “Vì... nên...” làm rõ quan hệ giải thích-kết quả. Hai chú thích bảo lưu sức mạnh hình ảnh của ἐπιπίπτω và μάστιξ mà không làm câu chính khó hiểu.
