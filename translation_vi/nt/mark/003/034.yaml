source:
  edition: SBLGNT
  text: καὶ περιβλεψάμενος ⸂τοὺς περὶ αὐτὸν κύκλῳ⸃ καθημένους λέγει· Ἴδε ἡ μήτηρ μου καὶ οἱ ἀδελφοί μου·
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/034.yaml
  text: And looking around at those seated around him in a circle[a], he says, “Behold, my mother and my brothers!”
translation:
  language: vi
  text: 'Ngài nhìn quanh những người đang ngồi thành vòng tròn quanh Ngài rồi nói: “Kìa, mẹ ta và anh em ta![a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “anh chị em.” Tiếng Hy Lạp dùng từ “anh em,” nhưng nhóm người ngồi quanh Chúa Giê-su có thể cũng gồm cả phụ nữ.
    reason: lexical_alternative
lexical_decisions:
- source_word: περιβλεψάμενος
  choice: nhìn quanh
  rationale: Diễn đạt tự nhiên hành động Chúa Giê-su đưa mắt nhìn khắp những người hiện diện, đồng thời giữ sắc thái có chủ ý của phân từ aorist trung cách.
- source_word: τοὺς περὶ αὐτὸν κύκλῳ καθημένους
  choice: những người đang ngồi thành vòng tròn xung quanh mình
  rationale: 'Giữ đủ các yếu tố không gian: họ đang ngồi, ở xung quanh Ngài và tạo thành một vòng tròn.'
- source_word: λέγει
  choice: nói
  rationale: Tiếng Việt không bắt buộc đánh dấu thì như tiếng Hy Lạp; cấu trúc “rồi nói” kể chuỗi hành động tự nhiên mà không thêm sắc thái ngoài văn bản.
- source_word: Ἴδε
  choice: Kìa
  rationale: Là từ chỉ dẫn nhằm thu hút sự chú ý; “Kìa” trang trọng vừa phải, tự nhiên và phù hợp khi Chúa Giê-su chỉ vào những người trước mặt.
- source_word: μήτηρ
  choice: mẹ
  rationale: Nghĩa từ vựng thông thường, phù hợp trực tiếp với ngữ cảnh gia đình.
- source_word: ἀδελφοί
  choice: anh em
  rationale: “Anh em” giữ hình thức số nhiều giống đực của tiếng Hy Lạp nhưng trong tiếng Việt cũng có thể mang nghĩa tập thể rộng hơn tùy ngữ cảnh; chú thích nêu rõ khả năng bao gồm cả nữ giới.
theological_decisions:
- issue: Danh từ thân tộc giống đực ἀδελφοί trong nhóm môn đồ có thể gồm cả phụ nữ
  choice: anh em
  alternative: anh chị em
  rationale: Bản chính giữ hình thức nguồn là số nhiều giống đực và không xác quyết thành phần của nhóm; chú thích bảo tồn khả năng từ này được dùng đại diện cho một nhóm gồm cả nam lẫn nữ.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Ngài” trong lời kể, còn lời trực tiếp dùng “ta” theo sắc thái trang nghiêm. Dấu chú thích [a] được đặt ngay sau cụm từ liên quan.
