  source_fidelity: Bản dịch chuyển tải đầy đủ hành động nhìn quanh, nhóm người ngồi bao quanh theo vòng tròn, lời tường thuật tiếp diễn và lời chỉ trỏ «Ἴδε». «Anh em» giữ được hình thức giống đực số nhiều của ἀδελφοί; chú thích nêu đúng phương án bao hàm rộng hơn mà không áp đặt cách hiểu.
  naturalness: Câu hiện tại dễ hiểu, nhưng «nhìn quanh những người ... xung quanh mình» hơi nặng vì lặp ý «quanh/xung quanh» và «mình» có thể kém rõ trong văn phong tường thuật tôn kính. Đổi thành «nhìn quanh những người đang ngồi thành vòng tròn quanh Ngài» tự nhiên hơn, đồng thời vẫn giữ cả hai nét không gian của tiếng Hy Lạp.
  terminology: «Ngài» trong lời kể và «ta» trong lời trực tiếp là nhất quán với lối văn Kinh Thánh Việt ngữ trang trọng vừa phải. «Kìa» phù hợp với sắc thái chỉ dẫn của Ἴδε. «Mẹ» và «anh em» chính xác; chú thích «anh chị em» là một thay thế diễn giải hợp lệ.
