  text: and to have authority to cast out demons[a].
translation:
  language: vi
  text: và có thẩm quyền đuổi quỷ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đuổi quỷ ra.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: và
  rationale: Liên từ nối mệnh đề nguyên mẫu này với các nội dung sai phái ở trước.
- source_word: ἔχειν
  choice: có
  rationale: Diễn đạt trực tiếp và tự nhiên động từ nguyên mẫu ἔχειν trong chuỗi bổ ngữ chỉ mục đích.
- source_word: ἐξουσίαν
  choice: thẩm quyền
  rationale: Nhấn mạnh quyền được ban để hành động, chứ không chỉ sức mạnh; phù hợp với bối cảnh Chúa Giê-su lập và sai phái Nhóm Mười Hai.
- source_word: ἐκβάλλειν
  choice: đuổi
  rationale: Diễn đạt tự nhiên hành động buộc các quỷ phải ra khỏi người; chú thích giữ phương án mạnh và sát hình ảnh hơn là “trục xuất”.
- source_word: τὰ δαιμόνια
  choice: các quỷ
  rationale: Dịch đúng danh từ δαιμόνια, không thay bằng cụm “các tà linh” vốn tương ứng với cách diễn đạt Hy Lạp khác.
theological_decisions:
- issue: Bản chất của ἐξουσία trong sự sai phái các môn đồ
  choice: thẩm quyền
  alternative: quyền năng
  rationale: “Thẩm quyền” bảo toàn ý về quyền hành được Chúa Giê-su trao, đồng thời không phủ nhận năng lực siêu nhiên cần có cho việc đuổi quỷ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Đuổi quỷ” là cách nói tự nhiên, quen thuộc trong tiếng Việt; “thẩm quyền” phân biệt quyền được trao với sức mạnh thuần túy.
