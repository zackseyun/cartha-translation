reference: Mark 3:17
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ Ἰάκωβον τὸν τοῦ Ζεβεδαίου καὶ Ἰωάννην τὸν ἀδελφὸν τοῦ Ἰακώβου (καὶ ἐπέθηκεν αὐτοῖς ⸀ὀνόματα Βοανηργές, ὅ ἐστιν Υἱοὶ Βροντῆς),
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/017.yaml
  text: and James the son of Zebedee[a], and John the brother of James (he gave them the name Boanerges, which means Sons of Thunder),
translation:
  language: vi
  text: Gia-cơ, con của Xê-bê-đê, và Giăng, anh em của Gia-cơ (Ngài đặt cho hai người tên[a] là Bô-a-nẹt, nghĩa là “Những người con của sấm sét”),
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tiếng Hy Lạp dùng “các tên” ở số nhiều; số nhiều này có thể được dùng theo nghĩa tập hợp để chỉ một biệt danh chung đặt cho hai anh em.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰάκωβον
  choice: Gia-cơ
  rationale: Dùng dạng tên gọi quen thuộc trong truyền thống Kinh Thánh tiếng Việt cho Ἰάκωβος, đồng thời phân biệt với Gia-cốp trong cách dùng thông thường.
- source_word: τὸν τοῦ Ζεβεδαίου
  choice: con của Xê-bê-đê
  rationale: Cấu trúc mạo từ + sở hữu cách chỉ quan hệ cha con; cách diễn đạt này tự nhiên và chính xác trong tiếng Việt.
- source_word: Ἰωάννην
  choice: Giăng
  rationale: Dùng dạng tên gọi quen thuộc trong Kinh Thánh tiếng Việt cho Ἰωάννης.
- source_word: τὸν ἀδελφὸν τοῦ Ἰακώβου
  choice: em của Gia-cơ
  rationale: ἀδελφός chỉ anh em ruột; theo cách nhận diện truyền thống và thứ tự nêu tên, tiếng Việt tự nhiên dùng “em của Gia-cơ”, dù từ Hy Lạp tự nó không xác định anh hay em.
- source_word: ἐπέθηκεν αὐτοῖς ὀνόματα
  choice: Ngài đặt cho hai người tên
  rationale: ἐπιτίθημι đi với ὀνόματα và tân ngữ gián tiếp mang nghĩa đặt hoặc ban tên. “Đặt cho hai người tên” giữ được sắc thái thành ngữ và cho phép phản ánh số nhiều của ὀνόματα.
- source_word: Βοανηργές
  choice: Bô-a-nẹt
  rationale: Phiên âm biệt danh Semit thay vì chỉ dịch nghĩa, vì chính bản văn vừa giữ nguyên tên vừa giải thích tên ấy.
- source_word: ὅ ἐστιν
  choice: nghĩa là
  rationale: Công thức này đưa ra lời giải nghĩa của biệt danh; “nghĩa là” rõ ràng, tự nhiên trong tiếng Việt hiện đại.
- source_word: Υἱοὶ Βροντῆς
  choice: Các Con của Sấm Sét
  rationale: Dịch sát hình ảnh sinh động của biệt danh và viết hoa để biểu thị đây là lời giải thích một tên gọi chung.
theological_decisions:
- issue: Cách thể hiện biệt danh dành cho Gia-cơ và Giăng
  choice: Giữ dạng phiên âm “Bô-a-nẹt” rồi giải thích là “Các Con của Sấm Sét”
  alternative: Chỉ dịch nghĩa biệt danh, không giữ dạng phiên âm; hoặc viết thường “các con của sấm sét”
  rationale: Bản văn chủ ý bảo tồn cả dạng ngoại ngữ lẫn lời giải nghĩa. Giữ cả hai phản ánh đầy đủ chi tiết tường thuật mà không áp đặt một cách hiểu thần học riêng.
- issue: Xác định ἀδελφός là “anh” hay “em”
  choice: Dùng “em của Gia-cơ” trong chính văn
  alternative: Dùng “anh/em của Gia-cơ” hoặc “người anh em của Gia-cơ” để giữ nguyên sự không xác định của tiếng Hy Lạp
  rationale: “Em của Gia-cơ” là cách nhận diện tự nhiên và quen thuộc trong tiếng Việt, nhưng cần ghi nhận rằng danh từ Hy Lạp chỉ nói quan hệ anh em, không mã hóa thứ bậc tuổi tác.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu được giữ như một phần tiếp nối của danh sách ở các câu trước. Danh xưng và tên riêng theo dạng quen thuộc trong Kinh Thánh tiếng Việt; dấu ngoặc giữ nguyên cấu trúc giải thích của bản Hy Lạp.
