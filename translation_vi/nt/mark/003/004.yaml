    issue: Vị trí của “được phép” và cụm “điều nào được phép?”
    rationale: Ἔξεστιν đứng đầu câu hỏi và chi phối hai cặp infinitive. Đặt “được phép” trước các cặp lựa chọn tạo câu tiếng Việt tự nhiên hơn và bảo toàn trực tiếp phạm vi cú pháp của từ này.
  - severity: low
    issue: Từ “đi” trong “giết đi”
    rationale: ἀποκτεῖναι chỉ có nghĩa cơ bản là “giết”; “đi” không cần thiết và có thể thêm sắc thái diễn tiến/khẩu ngữ không biểu hiện trong nguyên văn.
