source:
  edition: SBLGNT
  text: καὶ λέγει αὐτοῖς· Ἔξεστιν τοῖς σάββασιν ⸀ἀγαθοποιῆσαι ἢ κακοποιῆσαι, ψυχὴν σῶσαι ἢ ἀποκτεῖναι; οἱ δὲ ἐσιώπων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/004.yaml
  text: And he said to them[a], “Is it lawful on the Sabbath to do good or to do harm[b], to save a life or to kill?” But they were silent.
translation:
  language: vi
  text: 'Ngài nói với họ: “Trong ngày Sa-bát, được phép làm điều lành hay làm điều dữ, cứu một mạng sống hay giết?” Nhưng họ vẫn im lặng.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἔξεστιν
  choice: được phép
  rationale: Trong cuộc tranh luận về việc giữ ngày Sa-bát, từ này hỏi điều luật lệ cho phép; “được phép” tự nhiên trong tiếng Việt và vẫn giữ sắc thái pháp lý–đạo đức.
- source_word: τοῖς σάββασιν
  choice: trong ngày Sa-bát
  rationale: Dạng số nhiều Hy Lạp là một thành ngữ thông dụng chỉ ngày Sa-bát; tiếng Việt tự nhiên dùng số ít, phù hợp với ngày cụ thể trong ngữ cảnh.
- source_word: ἀγαθοποιῆσαι
  choice: làm điều lành
  rationale: Diễn đạt trực tiếp hành động làm điều tốt, đồng thời tạo thế đối xứng tự nhiên với “làm điều dữ”.
- source_word: κακοποιῆσαι
  choice: làm điều dữ
  rationale: Giữ được phạm vi đạo đức rộng của động từ và sự đối lập với “làm điều lành”; vế tiếp theo làm rõ hậu quả cụ thể là cứu hay giết.
- source_word: ψυχὴν σῶσαι
  choice: cứu một mạng sống
  rationale: Trong thế đối lập với giết, ψυχή chỉ sự sống của một người chứ không riêng phần linh hồn; “cứu một mạng sống” là cách nói tự nhiên.
- source_word: ἀποκτεῖναι
  choice: giết đi
  rationale: Phản ánh nghĩa căn bản “giết” mà không thêm sắc thái pháp lý của “xử tử” hay hàm ý đặc thù của “sát nhân”.
- source_word: ἐσιώπων
  choice: vẫn im lặng
  rationale: '“Vẫn” thể hiện sắc thái kéo dài của thì chưa hoàn thành: họ tiếp tục không đáp lại câu hỏi.'
theological_decisions:
- issue: Thành ngữ số nhiều về ngày Sa-bát trong cuộc tranh luận luật lệ
  choice: Dùng số ít tự nhiên “trong ngày Sa-bát”
  alternative: Dịch sát hình thức là “trong các ngày Sa-bát”
  rationale: Số nhiều trong Hy Lạp là cách nói thành ngữ và ở đây quy chiếu đến ngày Sa-bát cụ thể trong trình thuật. Dùng số nhiều trong tiếng Việt dễ khiến người đọc hiểu sai là nhiều ngày Sa-bát.
- issue: Sắc thái của κακοποιῆσαι
  choice: “làm điều dữ”
  alternative: “gây hại”
  rationale: “Làm điều dữ” giữ nguyên sức căng đạo đức trong câu hỏi song song, còn vế “cứu một mạng sống hay giết đi” xác định hậu quả thực tế; không thu hẹp động từ chỉ còn tác hại thể chất.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ cấu trúc hai cặp đối lập của nguyên bản. Đại từ “Ngài” phù hợp lối kể Kinh Thánh phổ thông; không thêm danh xưng “Chúa” vốn không có trong câu Hy Lạp.
