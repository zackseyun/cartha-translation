  to: 'Ngài nói với họ: “Trong ngày Sa-bát, được phép làm điều lành hay làm điều dữ, cứu một mạng sống hay giết?” Nhưng họ vẫn im lặng.'
  rationale: Chỉnh sửa cú pháp câu hỏi để “được phép” chi phối rõ ràng cả hai cặp đối lập như trong nguyên văn; thay “hỏi” bằng “nói với” sát λέγει hơn, dù nội dung vẫn là câu hỏi; và bỏ trợ từ không cần thiết sau “giết”. Không cần chú thích vì số ít “ngày Sa-bát” là cách chuyển ngữ thành ngữ Hy Lạp tự nhiên, không làm mất nghĩa trong bối cảnh này.
