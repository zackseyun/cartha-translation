id: MRK.3.22
reference: Mark 3:22
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ οἱ γραμματεῖς οἱ ἀπὸ Ἱεροσολύμων καταβάντες ἔλεγον ὅτι Βεελζεβοὺλ ἔχει καὶ ὅτι ἐν τῷ ἄρχοντι τῶν δαιμονίων ἐκβάλλει τὰ δαιμόνια.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/022.yaml
  text: And the scribes who had come down from Jerusalem were saying[a], “He has Beelzebul,” and[c][b], “By the ruler of the demons he casts out the demons.”
translation:
  language: vi
  text: 'Các kinh sư đã từ Giê-ru-sa-lem xuống cứ nói[a]: “Ông ấy có Bê-ên-xê-bun[b],” và “Ông ấy nhờ kẻ cai trị các quỷ[c] mà đuổi quỷ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Động từ Hy Lạp có thể hàm ý họ “liên tục nói” hoặc “nói đi nói lại” như vậy.
    reason: aspectual_alternative
  - marker: b
    text: 'Nghĩa hàm ẩn có thể diễn đạt rõ hơn là: “Ông ấy bị Bê-ên-xê-bun ám.” Tiếng Hy Lạp là Βεελζεβούλ; dạng truyền thống cũng được phiên âm là “Bê-ên-xê-búp.”'
    reason: lexical_alternative
  - marker: c
    text: 'Hoặc: “thủ lĩnh của các quỷ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: γραμματεῖς
  choice: các kinh sư
  rationale: Trong bối cảnh sách Tin Mừng, từ này chỉ những người am hiểu và giảng giải Luật pháp Do Thái; “kinh sư” là cách gọi gọn, quen thuộc và không khiến người đọc hiểu họ chỉ là người sao chép văn bản.
- source_word: ἀπὸ Ἱεροσολύμων καταβάντες
  choice: từ Giê-ru-sa-lem xuống
  rationale: Giữ hướng chuyển động “xuống” trong nguyên văn, phù hợp với cách nói địa lý về việc rời Giê-ru-sa-lem, đồng thời diễn đạt tự nhiên trong tiếng Việt.
- source_word: ἔλεγον
  choice: cứ nói
  rationale: Thể chưa hoàn thành diễn tả lời cáo buộc đang tiếp diễn hoặc được lặp lại; “cứ nói” chuyển tải sắc thái ấy rõ hơn quá khứ đơn.
- source_word: Βεελζεβοὺλ
  choice: Bê-ên-xê-bun
  rationale: Phiên âm trực tiếp dạng Βεελζεβούλ của bản Hy Lạp; dạng truyền thống tương ứng với “Beelzebub” được ghi ở chú thích.
- source_word: ἔχει
  choice: có
  rationale: Giữ cách nói ngắn và cố ý gây căng thẳng của nguyên văn “có Bê-ên-xê-bun”; ý nghĩa rõ hơn là bị Bê-ên-xê-bun ám hoặc chi phối được nêu trong chú thích thay vì đưa thẳng vào chính văn.
- source_word: ἐν τῷ ἄρχοντι τῶν δαιμονίων
  choice: nhờ kẻ cai trị các quỷ
  rationale: Giới từ ἐν ở đây mang nghĩa phương tiện hoặc quyền lực mà người ta cáo buộc Đức Giê-su dựa vào. “Nhờ” diễn đạt chức năng ấy tự nhiên, còn “kẻ cai trị” giữ ý về thẩm quyền của ἄρχων.
- source_word: δαιμονίων / δαιμόνια
  choice: các quỷ / quỷ
  rationale: Dịch trực tiếp danh từ δαιμόνιον, không thay bằng cụm từ khác như “uế linh” vốn tương ứng với một cách diễn đạt Hy Lạp khác.
- source_word: ἐκβάλλει
  choice: đuổi
  rationale: “Đuổi quỷ” là cách nói tự nhiên, rõ nghĩa trong tiếng Việt và giữ lực nghĩa trục xuất của động từ.
theological_decisions:
- issue: Cách dịch lời cáo buộc Βεελζεβοὺλ ἔχει
  choice: Ông ấy có Bê-ên-xê-bun
  alternative: Ông ấy bị Bê-ên-xê-bun ám
  rationale: Chính văn giữ thành ngữ Hy Lạp thay vì tự động giải thích mức độ chiếm hữu hay chi phối; chú thích cung cấp nghĩa hàm ẩn rõ hơn.
- issue: Cách dịch ἄρχων trong cụm “kẻ cai trị các quỷ”
  choice: kẻ cai trị
  alternative: thủ lĩnh
  rationale: “Kẻ cai trị” diễn tả trực tiếp quyền thống trị mà không dùng một tước hiệu dễ gợi thêm hệ thống phẩm trật; “thủ lĩnh” là khả năng dịch tự nhiên được giữ trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Ông ấy” phản ánh giọng cáo buộc của các kinh sư mà không thêm sắc thái miệt thị quá mức; “cứ nói” giữ tính tiếp diễn/lặp lại của động từ Hy Lạp. Tên riêng được phiên âm theo âm tiết để người đọc tiếng Việt dễ đọc.
