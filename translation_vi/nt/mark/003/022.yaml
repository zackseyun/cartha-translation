  source_fidelity: 'Bản dịch chuyển tải đúng các thành tố chính: các kinh sư từ Giê-ru-sa-lem, sắc thái lặp/tiếp diễn của ἔλεγον, thành ngữ “có Bê-ên-xê-bun,” và lời cáo buộc trừ quỷ nhờ quyền lực của kẻ cai trị các quỷ. Chú thích b bảo tồn cách giải thích thành ngữ mà không áp đặt vào chính văn.'
