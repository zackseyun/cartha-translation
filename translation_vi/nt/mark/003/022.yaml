  terminology: “Kinh sư,” “Giê-ru-sa-lem,” “Bê-ên-xê-bun,” “quỷ,” và “đuổi quỷ” phù hợp với văn phong Kinh Thánh Việt ngữ hiện đại. “Kẻ cai trị các quỷ” phản ánh sát ἄρχων τῶν δαιμονίων; chú thích “thủ lĩnh” là một lựa chọn tự nhiên. Giữ “có Bê-ên-xê-bun” trong chính văn giúp bảo toàn thành ngữ Hy Lạp, với lời giải thích ở chú thích.
