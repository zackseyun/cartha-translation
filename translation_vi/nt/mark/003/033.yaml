translation:
  language: vi
  text: 'Ngài trả lời họ[a]: “Ai là mẹ và anh em của tôi?”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát cấu trúc Hy Lạp: “Và đáp lời họ, Ngài nói”. Động từ “nói” ở thì hiện tại lịch sử, một nét kể chuyện sinh động thường gặp trong sách Mác.'
    reason: lexical_alternative
  - marker: b
    text: 'Dịch sát hơn: “Ai là mẹ tôi, hay anh em tôi?” Bản Hy Lạp dùng động từ số ít và liên từ “hay”; câu chính diễn đạt tự nhiên hơn trong tiếng Việt.'
    reason: source_form
lexical_decisions:
- source_word: ἀποκριθεὶς αὐτοῖς λέγει
  choice: Ngài trả lời họ
  rationale: Cụm phân từ đi với động từ hiện tại lịch sử có nghĩa đen gần như “đáp lời họ, Ngài nói”. Tiếng Việt tự nhiên gộp hai yếu tố này thành “Ngài trả lời họ”, vẫn giữ đầy đủ hành động và đối tượng được nói với.
- source_word: Τίς
  choice: Ai
  rationale: Đại từ nghi vấn hỏi về căn tính; “ai” là cách tương đương trực tiếp và tự nhiên trong tiếng Việt.
- source_word: μήτηρ
  choice: mẹ
  rationale: “Mẹ” là từ thân thuộc, chuẩn mực và trang trọng vừa đủ trong tiếng Việt hiện đại.
- source_word: ἢ
  choice: và
  rationale: Bản Hy Lạp dùng ἢ, nghĩa đen là “hay”. Trong cấu trúc câu hỏi gồm hai nhóm thân thuộc, tiếng Việt dùng “và” tự nhiên hơn để hỏi chung về cả hai, không hàm ý phải chọn một trong hai; dạng sát chữ được ghi ở chú thích.
- source_word: ἀδελφοί
  choice: anh em
  rationale: ἀδελφοί là danh từ giống đực số nhiều. “Anh em” giữ được hình thức nam giới và là cách gọi tự nhiên trong tiếng Việt, không mở rộng rõ ràng thành “anh chị em”.
theological_decisions:
- issue: Phạm vi nghĩa của ἀδελφοί
  choice: anh em
  alternative: anh chị em; anh em ruột
  rationale: “Anh em” giữ cách diễn đạt giống đực của nguyên bản mà không thêm “chị em”, đồng thời không tự ý xác định quan hệ là anh em ruột hay một cách hiểu giáo phái cụ thể.
- issue: Đại từ chỉ Đức Chúa Jêsus
  choice: Ngài
  alternative: ông; Người
  rationale: “Ngài” là đại từ tiếng Việt hiện đại, tôn kính và dễ hiểu khi nói về Đức Chúa Jêsus; lựa chọn này không giải quyết thêm bất kỳ vấn đề thần học nào trong câu.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, rõ ràng và trang trọng vừa phải. Câu chính ưu tiên cách nói tự nhiên, còn chú thích bảo tồn cấu trúc phân từ, hiện tại lịch sử, động từ số ít và liên từ ἢ của nguyên bản.
