  terminology: “Anh em” giữ được cách gọi nam tính số nhiều của ἀδελφοί mà không áp đặt cách hiểu về quan hệ huyết thống hay một lập trường giáo phái. “Ngài” là cách quy chiếu tôn kính nhất quán và không tự nó thêm nội dung thần học.
