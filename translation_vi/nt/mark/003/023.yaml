  text: καὶ προσκαλεσάμενος αὐτοὺς ἐν παραβολαῖς ἔλεγεν αὐτοῖς· Πῶς δύναται Σατανᾶς Σατανᾶν ἐκβάλλειν;
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/023.yaml
  text: 'And after calling them to himself, he was speaking to them in parables: “How can Satan cast out Satan?”'
translation:
  language: vi
  text: 'Ngài gọi họ đến, rồi nói với họ bằng các dụ ngôn: “Làm sao Sa-tan có thể đuổi Sa-tan được?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: gọi họ đến rồi
  rationale: Phân từ bất định trung động cho biết Đức Giê-su gọi họ đến với mình trước khi nói; cách diễn đạt này tự nhiên trong tiếng Việt và giữ rõ trình tự hành động.
- source_word: ἐν παραβολαῖς
  choice: dùng các ẩn dụ
  rationale: παραβολή ở đây chỉ những lời so sánh hoặc hình ảnh minh họa. Dạng số nhiều được giữ bằng “các ẩn dụ”; “dùng” diễn đạt tự nhiên phương thức Ngài nói.
- source_word: ἔλεγεν
  choice: nói với họ
  rationale: Thì chưa hoàn thành mô tả hành động nói trong diễn tiến. Trong văn kể tiếng Việt, “nói” tự nhiên hơn một cấu trúc tiếp diễn nặng nề, còn ngữ cảnh vẫn thể hiện đây là phần mở đầu của lời giảng giải.
- source_word: Πῶς δύναται
  choice: Làm sao ... có thể
  rationale: Giữ nguyên câu hỏi tu từ về khả năng và sắc thái thách thức của nguyên văn.
- source_word: Σατανᾶς
  choice: Sa-tan
  rationale: Phiên âm tên gọi theo cách quen thuộc và dễ đọc trong tiếng Việt; cả chủ thể lẫn đối tượng đều được giữ là “Sa-tan”.
- source_word: ἐκβάλλειν
  choice: đuổi ... được
  rationale: ἐκβάλλω là động từ thường dùng trong ngữ cảnh trục xuất quỷ. “Đuổi” tự nhiên, rõ nghĩa trong tiếng Việt; “được” cuối câu củng cố sắc thái chất vấn về khả năng.
theological_decisions:
- issue: Sức nặng của câu hỏi về việc Sa-tan chống lại chính mình
  choice: “Làm sao Sa-tan có thể đuổi Sa-tan được?”
  alternative: “Sa-tan có thể đuổi Sa-tan bằng cách nào?”
  rationale: Bản dịch giữ đây là câu hỏi tu từ nêu sự bất khả hoặc phi lý trong lời cáo buộc, nhưng không thêm lời giải thích thần học vào chính câu Kinh Thánh.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Đại từ “Ngài” theo mạch văn chỉ Đức Giê-su; không thêm chủ thể vào lời trích dẫn. Không cần chú thích vì câu không có dị bản hay độ mơ hồ nào cần giải thích trong bản văn chính.
