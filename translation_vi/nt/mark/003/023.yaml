  verdict: revise
  source_fidelity: 'Bản nháp giữ đúng trình tự: Đức Giê-su gọi những người đối thoại đến rồi nói; đồng thời truyền đạt chính xác câu hỏi tu từ về việc Sa-tan tự trục xuất Sa-tan. Tuy nhiên, “ẩn dụ” thường chỉ một biện pháp tu từ/metaphor trong tiếng Việt, hẹp hơn phạm vi của παραβολαῖς trong Mác, vốn chỉ các lời ví dụ, so sánh, hoặc dụ ngôn.'
