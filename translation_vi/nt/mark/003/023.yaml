    issue: “các ẩn dụ” dịch παραβολαῖς quá hẹp.
    rationale: “Ẩn dụ” trong cách dùng tiếng Việt hiện đại chủ yếu là phép chuyển nghĩa văn chương, trong khi παραβολή ở đây nói đến các lời dụ ngôn/so sánh minh họa. “Các dụ ngôn” giữ số nhiều và phạm vi nghĩa phù hợp hơn.
