  terminology: Nên dùng “dụ ngôn” cho παραβολαῖς, là thuật ngữ Kinh Thánh quen thuộc nhưng vẫn dễ hiểu trong tiếng Việt hiện đại. “Sa-tan” và “đuổi ... được” phù hợp ngữ cảnh trục xuất và sắc thái câu hỏi tu từ.
  issues:
