review_pass:
  verdict: revise
  source_fidelity: Bản thảo chuyển tải đúng mẹ, các anh em, việc họ ở bên ngoài và gọi Ngài. Tuy nhiên, cụm “sai người vào” thêm ý “vào” không có trong tiếng Hy Lạp; bản văn chỉ nói họ sai/phái người đến chỗ Ngài, trong khi họ vẫn đứng bên ngoài.
  naturalness: “Bấy giờ” và “Ngài” phù hợp lối văn kể hiện đại, trang trọng. Câu ghép với dấu chấm phẩy giữ được quan hệ liên tục của bản văn và tự nhiên hơn việc tách thành hai câu độc lập.
  terminology: “Mẹ và các anh em của Ngài” giữ nguyên tính không diễn giải của μήτηρ và ἀδελφοί. “Sai người đến gọi Ngài” diễn đạt tự nhiên ἀπέστειλαν πρὸς αὐτὸν καλοῦντες αὐτόν mà không áp đặt chi tiết về số người hay quan hệ gia đình.
  issues:
