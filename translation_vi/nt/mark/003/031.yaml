  text: ⸂Καὶ ἔρχονται⸃ ⸂ἡ μήτηρ αὐτοῦ καὶ οἱ ἀδελφοὶ αὐτοῦ⸃ καὶ ἔξω ⸀στήκοντες ἀπέστειλαν πρὸς αὐτὸν ⸀καλοῦντες αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/031.yaml
  text: Then his mother and his brothers came[a], and standing outside they sent word to him[b], calling him.
translation:
  language: vi
  text: Bấy giờ, mẹ và các anh em của Ngài đến; họ đứng bên ngoài, sai người đến gọi Ngài.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ ἔρχονται
  choice: Bấy giờ... đến
  rationale: Καί nối tiếp diễn tiến câu chuyện; “Bấy giờ” tạo mạch kể tự nhiên. Hiện tại lịch sử ἔρχονται được chuyển bằng lối kể quá khứ tự nhiên trong tiếng Việt.
- source_word: ἡ μήτηρ αὐτοῦ
  choice: mẹ... của Ngài
  rationale: Chuyển trực tiếp quan hệ sở hữu, không diễn giải thêm.
- source_word: οἱ ἀδελφοὶ αὐτοῦ
  choice: các anh em của Ngài
  rationale: Giữ cách gọi ἀδελφοί ở dạng nam số nhiều và không quyết định thêm bản chất chính xác của quan hệ gia đình.
- source_word: ἔξω στήκοντες
  choice: Họ đứng bên ngoài
  rationale: Diễn đạt tự nhiên trạng thái đi kèm do phân từ hiện tại στήκοντες mô tả; ἔξω chỉ vị trí ở ngoài nơi Chúa Giê-xu đang ở.
- source_word: ἀπέστειλαν πρὸς αὐτὸν καλοῦντες αὐτόν
  choice: sai người vào gọi Ngài
  rationale: Trong ngữ cảnh, họ phái một người hoặc những người đến chỗ Ngài để gọi Ngài. Cách diễn đạt này tự nhiên trong tiếng Việt và giữ quan hệ mục đích của καλοῦντες mà không đồng nhất hành động ấy với việc gọi từ xa.
theological_decisions:
- issue: Quan hệ của “các anh em” với Chúa Giê-xu
  choice: Dịch là “các anh em của Ngài” mà không chú giải quan hệ cụ thể
  alternative: Diễn giải là em trai ruột, anh em họ hoặc họ hàng
  rationale: Câu Hy Lạp dùng ἀδελφοί nhưng không tự xác định chi tiết quan hệ huyết thống theo những cách giải thích thần học khác nhau; bản dịch không nên áp đặt một lập trường hệ phái.
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” để quy chiếu Chúa Giê-xu; tách thành hai câu nhằm tránh cấu trúc phân từ nặng nề trong tiếng Việt.
