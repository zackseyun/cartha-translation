    issue: “sai người vào gọi Ngài” thêm hướng chuyển động “vào”.
    rationale: Nguyên văn có ἀπέστειλαν πρὸς αὐτόν, nghĩa là sai/phái đến chỗ Ngài; không có yếu tố tương đương với “vào”. Dù bối cảnh ngụ ý Ngài ở trong nhà, bản dịch không nên xác định thêm hướng đi này.
  revised_text: Bấy giờ, mẹ và các anh em của Ngài đến; họ đứng bên ngoài, sai người đến gọi Ngài.
