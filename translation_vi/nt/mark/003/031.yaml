- from: Bấy giờ, mẹ và các anh em của Ngài đến. Họ đứng bên ngoài và sai người vào gọi Ngài.
  to: Bấy giờ, mẹ và các anh em của Ngài đến; họ đứng bên ngoài, sai người đến gọi Ngài.
  rationale: Chỉ bỏ yếu tố “vào” được thêm vào và dùng “đến” để phản ánh πρὸς αὐτόν. “Sai người” là cách tiếng Việt tự nhiên để biểu đạt động từ ἀπέστειλαν có túc từ được hiểu theo ngữ cảnh; không xác định số lượng hoặc danh tính người được sai đi.
