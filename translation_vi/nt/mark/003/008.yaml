  to: Và từ Giê-ru-sa-lem, từ I-đu-mê, từ bên kia sông Giô-đanh[a], và từ vùng quanh Ty-rơ và Si-đôn[b], một đám đông rất lớn, nghe những điều Ngài đang làm[c], đã đến với Ngài.
