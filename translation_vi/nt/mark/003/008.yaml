source:
  edition: SBLGNT
  text: καὶ ἀπὸ Ἱεροσολύμων καὶ ἀπὸ τῆς Ἰδουμαίας ⸀καὶ πέραν τοῦ Ἰορδάνου ⸁καὶ περὶ Τύρον καὶ Σιδῶνα, πλῆθος πολύ, ⸀ἀκούοντες ὅσα ⸀ἐποίει ἦλθον πρὸς αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/008.yaml
  text: and from Jerusalem[a], and from Idumea, and beyond the Jordan, and around Tyre and Sidon, a great crowd, hearing what he was doing[c][b], came to him.
translation:
  language: vi
  text: Và từ Giê-ru-sa-lem, từ I-đu-mê, từ bên kia sông Giô-đanh[a], và từ vùng quanh Ty-rơ và Si-đôn[b], một đám đông rất lớn, nghe những điều Ngài đang làm[c], đã đến với Ngài.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “từ vùng bên kia sông Giô-đanh.” Cụm từ Hy Lạp có thể chỉ miền nằm ở phía bên kia sông Giô-đanh.
    reason: lexical_alternative
  - marker: b
    text: Nguyên văn Hy Lạp là “quanh Ty-rơ và Si-đôn,” chỉ vùng lân cận chứ không nhất thiết chỉ riêng hai thành ấy.
    reason: lexical_alternative
  - marker: c
    text: Hay “tất cả những điều Ngài đang làm.” Đại từ quan hệ Hy Lạp có thể mang ý nghĩa bao quát.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπὸ Ἱεροσολύμων
  choice: từ Giê-ru-sa-lem
  rationale: ἀπό với sở hữu cách chỉ nơi xuất phát; địa danh được phiên âm theo lối quen thuộc trong tiếng Việt.
- source_word: ἀπὸ τῆς Ἰδουμαίας
  choice: từ I-đu-mê
  rationale: Giữ nghĩa địa lý của ἀπό và dùng dạng phiên âm rõ, gọn cho tên vùng.
- source_word: πέραν τοῦ Ἰορδάνου
  choice: từ bên kia sông Giô-đanh
  rationale: πέραν với sở hữu cách chỉ vùng ở phía bên kia một ranh giới; thêm “từ” theo mạch liệt kê địa điểm xuất phát và “sông” để tự nhiên, rõ nghĩa trong tiếng Việt.
- source_word: περὶ Τύρον καὶ Σιδῶνα
  choice: từ vùng quanh Ty-rơ và Si-đôn
  rationale: περί với đối cách mang nghĩa không gian, nói đến khu vực bao quanh hai thành chứ không nhất thiết chỉ chính các thành ấy.
- source_word: πλῆθος πολύ
  choice: một đoàn dân rất đông
  rationale: Diễn đạt tự nhiên một tập hợp người có số lượng lớn, đồng thời giữ mức nhấn mạnh của πολύ.
- source_word: ἀκούοντες
  choice: khi nghe
  rationale: Phân từ hiện tại được diễn đạt bằng mệnh đề phụ tự nhiên trong tiếng Việt; “khi” giữ quan hệ thời gian rộng mà không khẳng định quá mức quan hệ nguyên nhân.
- source_word: ὅσα ἐποίει
  choice: những điều Ngài đang làm
  rationale: ὅσα chỉ các việc Ngài làm và có thể hàm nghĩa toàn thể; thì chưa hoàn thành ἐποίει được thể hiện bằng “đang làm” để nêu hoạt động tiếp diễn.
- source_word: ἦλθον πρὸς αὐτόν
  choice: đã đến với Ngài
  rationale: Diễn đạt chuyển động hướng đến một người; “đến với” tự nhiên và giữ sắc thái của πρός.
- source_word: καὶ ... καὶ ... καὶ
  choice: cùng ... từ ... từ ... và từ
  rationale: Giữ hiệu ứng liệt kê dồn nối của các καί nhưng điều chỉnh vừa đủ để câu tiếng Việt hiện đại không nặng nề.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu mở đầu giữ tính nối tiếp với câu trước của nguyên văn bằng “cùng”; dấu chấm trước “Một đoàn dân rất đông” giúp tiếng Việt rõ cấu trúc mà không thay đổi quan hệ ý nghĩa. “Ngài” được dùng như đại từ tôn kính dành cho Chúa Giê-su, không thêm danh xưng thần học ngoài nguyên văn.
