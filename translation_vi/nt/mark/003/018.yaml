review_pass:
  verdict: revise
  source_fidelity: Bản dịch giữ đúng chuỗi tên và quan hệ phụ tử của Gia-cơ. Tuy nhiên, “Ca-na-na” không phải là một dạng tên/danh xưng tự nhiên hay đã được chuẩn hóa trong tiếng Việt, và cách gọi “biệt danh” thêm một sắc thái không có trong τὸν Καναναῖον. Trong ngữ cảnh danh sách các sứ đồ và đối chiếu Lu-ca 6:15, danh xưng này được hiểu hợp lý nhất là “người Nhiệt Thành.”
  naturalness: 'Cấu trúc liệt kê, kể cả “và” mở đầu do tiếp nối câu trước, là tự nhiên. Cần dùng các dạng tên Việt ngữ quen thuộc hơn: “Ba-thê-lê-my” và “A-phê”; đồng thời bỏ cách phiên âm “Ca-na-na” khó hiểu trong chính văn.'
  terminology: “Si-môn người Nhiệt Thành” truyền đạt danh xưng phân biệt của Σίμων ὁ Καναναῖος mà không gán cho ông sắc tộc hay quê quán Ca-na-an. Chú thích cần nói rõ đây là dạng Hy Lạp Cananaean và chỉ nêu cách hiểu “có lẽ,” để không xóa độ gián tiếp của từ ngữ trong Mác.
  issues:
  - severity: medium
    issue: “Ca-na-na” và “biệt danh” không truyền đạt tự nhiên danh xưng τὸν Καναναῖον.
    rationale: “Ca-na-na” không phải cách phiên âm tên riêng/danh xưng thông dụng trong tiếng Việt, còn “biệt danh” là thông tin diễn giải thêm. Dạng này trong Mác nhiều khả năng phản ánh danh xưng A-ram tương đương với “người Nhiệt Thành” ở Lu-ca 6:15.
  - severity: low
    issue: Một số tên riêng chưa theo dạng Việt ngữ Kinh Thánh quen dùng.
    rationale: “Ba-thê-lê-my” và “A-phê” tự nhiên và dễ nhận diện hơn “Ba-thê-lê-mi” và “An-phê” trong văn phong Kinh Thánh tiếng Việt hiện đại.
  revised_text: và Anh-rê, Phi-líp, Ba-thê-lê-my, Ma-thi-ơ, Thô-ma, Gia-cơ con A-phê, Tha-đê, và Si-môn người Nhiệt Thành[a].
