base_translation:
  language: en
  yaml_path: translation/nt/mark/003/018.yaml
  text: and Andrew[a], and Philip, and Bartholomew, and Matthew, and Thomas, and James the son of Alphaeus, and Thaddaeus, and Simon the Cananaean.
translation:
  language: vi
  text: và Anh-rê, Phi-líp, Ba-thê-lê-my, Ma-thi-ơ, Thô-ma, Gia-cơ con A-phê, Tha-đê, và Si-môn người Nhiệt Thành[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hy Lạp: Cananaean; có lẽ phản ánh một danh xưng A-ram nghĩa là “người nhiệt thành”, như cách gọi trong Lu-ca 6:15. Không nên hiểu là người Ca-na-an theo nghĩa quê quán hoặc sắc tộc.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: và
  rationale: Giữ cấu trúc liệt kê nối tiếp của tiếng Hy Lạp, đồng thời lược bớt một số lần lặp để câu tự nhiên trong tiếng Việt.
- source_word: Ἀνδρέαν
  choice: Anh-rê
  rationale: Dùng dạng phiên âm tên riêng quen thuộc trong tiếng Việt.
- source_word: Φίλιππον
  choice: Phi-líp
  rationale: Dùng dạng phiên âm tên riêng quen thuộc trong tiếng Việt.
- source_word: Βαρθολομαῖον
  choice: Ba-thê-lê-mi
  rationale: Dùng dạng phiên âm tên riêng quen thuộc trong tiếng Việt.
- source_word: Μαθθαῖον
  choice: Ma-thi-ơ
  rationale: Dùng dạng phiên âm tên riêng quen thuộc trong tiếng Việt.
- source_word: Θωμᾶν
  choice: Thô-ma
  rationale: Dùng dạng phiên âm tên riêng quen thuộc trong tiếng Việt.
- source_word: Ἰάκωβον τὸν τοῦ Ἁλφαίου
  choice: Gia-cơ con An-phê
  rationale: Cụm mạo từ kèm sở hữu cách xác định Gia-cơ qua quan hệ phụ tử; “con An-phê” rõ ràng và tự nhiên.
- source_word: Θαδδαῖον
  choice: Tha-đê
  rationale: Dùng dạng phiên âm tên riêng quen thuộc trong tiếng Việt.
- source_word: Σίμωνα τὸν Καναναῖον
  choice: Si-môn, biệt danh Ca-na-na[a]
  rationale: Phiên âm trực tiếp danh xưng khó xác định Καναναῖος thay vì biến nó thành một chỉ định sắc tộc dễ gây hiểu lầm; chú thích nêu nghĩa có khả năng nhất.
theological_decisions:
- issue: Ý nghĩa danh xưng Καναναῖος của Si-môn
  choice: Giữ danh xưng dưới dạng phiên âm “Ca-na-na” và giải thích trong chú thích rằng có lẽ nghĩa là “người nhiệt thành”.
  alternative: Si-môn người Nhiệt Thành; Si-môn người Ca-na-an
  rationale: Dạng Hy Lạp trong Mác phản ánh một từ gốc A-ram có lẽ tương ứng với ζηλωτής trong Lu-ca 6:15. Phiên âm trong chính văn bảo tồn nét riêng và độ gián tiếp của bản Mác; chú thích tránh cách hiểu sai rằng đây là quê quán hay sắc tộc.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Các tên riêng theo lối phiên âm Kinh Thánh tiếng Việt quen thuộc. Câu giữ tính chất nối tiếp của danh sách từ câu trước nhưng tránh lặp “và” trước mọi tên, vốn nặng nề trong tiếng Việt.
