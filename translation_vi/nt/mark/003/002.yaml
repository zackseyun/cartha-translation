  text: καὶ παρετήρουν αὐτὸν εἰ τοῖς σάββασιν θεραπεύσει αὐτόν, ἵνα ⸀κατηγορήσωσιν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/002.yaml
  text: And they were watching him closely to see whether he would heal him on the Sabbath[a], so that they might accuse him.
translation:
  language: vi
  text: Họ chăm chú theo dõi Người để xem liệu Người có chữa lành người ấy vào ngày sa-bát[a] hay không, nhằm tố cáo Người.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn Hy Lạp dùng dạng số nhiều “các ngày sa-bát”, nhưng dạng này có thể được dùng theo lối thành ngữ để chỉ ngày sa-bát.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρετήρουν
  choice: chăm chú theo dõi
  rationale: Thì chưa hoàn thành diễn tả hành động đang tiếp diễn; động từ trong ngữ cảnh mang sắc thái dò xét đầy ác ý. Cách dịch này tự nhiên và giữ được cả hai nét nghĩa.
- source_word: εἰ
  choice: xem ... hay không
  rationale: Sau động từ chỉ sự theo dõi, cấu trúc này diễn đạt tự nhiên câu hỏi gián tiếp mà không biến nó thành điều kiện.
- source_word: τοῖς σάββασιν
  choice: trong ngày sa-bát
  rationale: Dạng số nhiều trong tiếng Hy Lạp có thể được dùng theo lối thành ngữ để chỉ ngày sa-bát. Số ít là cách diễn đạt tự nhiên trong tiếng Việt; hình thái số nhiều được ghi ở chú thích.
- source_word: θεραπεύσει
  choice: có chữa lành
  rationale: Thì tương lai nằm trong câu hỏi gián tiếp sau một động từ quá khứ; tiếng Việt không cần đánh dấu lùi thì, còn từ 'có' kết hợp với 'hay không' thể hiện rõ điều họ chờ xem.
- source_word: ἵνα
  choice: để
  rationale: Diễn tả trực tiếp mục đích của việc theo dõi.
- source_word: κατηγορήσωσιν αὐτοῦ
  choice: có cớ tố cáo Người
  rationale: Động từ có nghĩa là tố cáo hoặc buộc tội. 'Có cớ' làm rõ mục đích tìm căn cứ để tố cáo vốn hàm chứa trong mạch văn, nhưng không nâng cấp cảnh này thành một vụ truy tố chính thức.
theological_decisions:
- issue: Ý đồ của những người theo dõi
  choice: Việc theo dõi mang tính thù địch, nhằm tìm cớ tố cáo Đức Giê-su.
  alternative: Dịch theo sắc thái pháp lý mạnh hơn là 'truy tố Người'.
  rationale: κατηγορέω có thể mang sắc thái pháp lý, nhưng câu này chỉ nói họ muốn tố cáo Người; bản dịch không đưa vào một thủ tục pháp lý mà nguyên văn không nêu.
- issue: Đối tượng được chữa lành
  choice: Dùng 'anh ấy' để chỉ người đàn ông được nhắc đến ngay trước đó.
  alternative: Lặp lại 'người ấy' hoặc để đại từ không phân biệt giới.
  rationale: Đại từ αὐτόν là giống đực và quy chiếu đến người có bàn tay bị teo trong câu trước; 'anh ấy' rõ ràng, tự nhiên mà không thêm thông tin ngoài ngữ cảnh.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng 'Đức Giê-su' và đại từ kính trọng 'Người'; giữ 'sa-bát' là thuật ngữ Kinh Thánh quen thuộc. Dấu chú thích [a] xuất hiện ngay sau cụm từ liên quan.
