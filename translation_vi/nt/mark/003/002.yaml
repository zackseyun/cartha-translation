revisions:
- from: Họ chăm chú theo dõi Đức Giê-su xem Người có chữa lành cho anh ấy trong ngày sa-bát[a] hay không, để có cớ tố cáo Người.
  to: Họ chăm chú theo dõi Người để xem liệu Người có chữa lành người ấy vào ngày sa-bát[a] hay không, nhằm tố cáo Người.
  rationale: Bản sửa loại bỏ ý bổ sung “có cớ,” dịch trực tiếp mục đích của ἵνα κατηγορήσωσιν αὐτοῦ là “nhằm tố cáo Người.” Đồng thời thay “anh ấy” bằng “người ấy” để văn phong nhất quán và đặt “vào ngày sa-bát” theo trật tự tự nhiên. Chú thích được giữ nguyên để bảo tồn thông tin về hình thức số nhiều của τοῖς σάββασιν.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T07:39:05Z'
review_pass:
  verdict: revise
  source_fidelity: Bản dịch phản ánh đúng hành động theo dõi liên tục, câu hỏi gián tiếp về việc chữa lành vào ngày sa-bát, và mục đích tố cáo. Tuy nhiên, cụm “để có cớ tố cáo” thêm ý tìm được căn cứ/cớ buộc tội, điều không được phát biểu trong κατηγορήσωσιν; nguyên văn chỉ nêu mục đích là tố cáo.
  naturalness: “Anh ấy” xen giữa lối xưng hô trang trọng “Đức Giê-su/Người” tạo độ lệch thanh điệu. “Người ấy” tự nhiên hơn trong văn phong Kinh Thánh hiện đại. “Vào ngày sa-bát” cũng thông dụng hơn “trong ngày sa-bát” ở ngữ cảnh này.
  terminology: “Đức Giê-su,” “Người,” “chữa lành,” “sa-bát,” và “tố cáo” đều phù hợp. Chú thích giải thích chính xác số nhiều Hy Lạp có công dụng thành ngữ.
  issues:
  - severity: medium
    issue: “để có cớ tố cáo Người” thêm ý ‘có cớ/có căn cứ’.
    rationale: ἵνα κατηγορήσωσιν αὐτοῦ có nghĩa “để họ tố cáo Người,” không nói rõ rằng họ đang tìm hay có được một căn cứ để tố cáo. Ý này có thể hợp mạch văn, nhưng không nên đưa vào bản dịch chính.
  - severity: low
    issue: Đại từ “anh ấy” không đồng nhất với thanh điệu trang trọng của câu.
    rationale: Dù αὐτόν quy chiếu người đàn ông ở câu trước, “người ấy” giữ văn phong nhất quán với “Đức Giê-su/Người” và vẫn phân biệt rõ hai đối tượng.
