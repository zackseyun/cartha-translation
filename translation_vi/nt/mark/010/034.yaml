revisions:
- from: Họ sẽ chế nhạo Người, nhổ vào Người, đánh đòn Người và giết Người; rồi sau ba ngày[a], Người sẽ sống lại.
  to: Họ sẽ chế nhạo Người, nhổ vào Người, đánh roi Người và giết Người; sau ba ngày, Người sẽ sống lại.
  rationale: Sửa “đánh đòn” thành “đánh roi” để chuyển tải cụ thể động từ μαστιγόω. Cũng chỉnh chú thích để phân biệt nghĩa trực tiếp “sau ba ngày” với cách diễn đạt “vào ngày thứ ba” ở những phân đoạn khác. Các yếu tố còn lại được giữ nguyên vì trung thành với nguồn, tự nhiên trong tiếng Việt hiện đại và không áp đặt diễn giải thần học.
