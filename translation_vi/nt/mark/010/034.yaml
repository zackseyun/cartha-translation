  text: καὶ ἐμπαίξουσιν αὐτῷ καὶ ⸂ἐμπτύσουσιν αὐτῷ καὶ μαστιγώσουσιν αὐτὸν⸃ καὶ ⸀ἀποκτενοῦσιν, καὶ ⸂μετὰ τρεῖς ἡμέρας⸃ ἀναστήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/034.yaml
  text: And they will mock him[a], and spit on him, and flog him, and kill him, and after three days he will rise.
translation:
  language: vi
  text: Họ sẽ chế nhạo Người, nhổ vào Người, đánh roi Người và giết Người; sau ba ngày, Người sẽ sống lại.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐμπαίξουσιν
  choice: sẽ chế nhạo
  rationale: “Chế nhạo” diễn đạt sự nhạo báng đầy khinh miệt, tự nhiên và trang trọng trong tiếng Việt hiện đại.
- source_word: ἐμπτύσουσιν αὐτῷ
  choice: nhổ vào Người
  rationale: Cụm này chỉ hành động nhổ trực tiếp vào Người để làm nhục; “nhổ vào” truyền đạt rõ hướng và tính xúc phạm của hành động.
- source_word: μαστιγώσουσιν
  choice: đánh đòn
  rationale: “Đánh đòn” là cách nói dễ hiểu, phù hợp với hình phạt thể xác trong ngữ cảnh, không dùng từ cổ như “đánh roi” theo nghĩa quá hẹp hay “quất” kém trang trọng.
- source_word: ἀποκτενοῦσιν
  choice: giết
  rationale: “Giết” chuyển tải nghĩa trực tiếp của động từ, không thêm sắc thái pháp lý của “xử tử” hay sự định tội đạo đức hàm chứa trong “sát hại”.
- source_word: μετὰ τρεῖς ἡμέρας
  choice: sau ba ngày
  rationale: μετά với đối cách có nghĩa thông thường là “sau”; cách dịch này giữ nguyên cách diễn đạt riêng của Mác thay vì đồng nhất với công thức “vào ngày thứ ba” ở những chỗ khác.
- source_word: ἀναστήσεται
  choice: sẽ sống lại
  rationale: Trong ngữ cảnh chết rồi phục sinh, “sống lại” là cách diễn đạt tự nhiên, rõ nghĩa nhất trong tiếng Việt. Hình thái Hy Lạp là tương lai trung động với nghĩa nội động, nên không dịch thành bị động “sẽ được làm cho sống lại”.
theological_decisions:
- issue: Cách diễn đạt sự phục sinh
  choice: Người sẽ sống lại
  alternative: Người sẽ được làm cho sống lại; Người sẽ trỗi dậy
  rationale: Bản dịch dùng cách nói nội động phù hợp với ἀναστήσεται và không chuyển câu sang thể bị động. “Sống lại” là thành ngữ tiếng Việt tự nhiên cho việc một người sống dậy sau khi chết; lựa chọn này không phủ nhận những đoạn khác nói Đức Chúa Trời làm cho Chúa Giê-su sống lại.
- issue: Thời điểm phục sinh
  choice: sau ba ngày
  alternative: vào ngày thứ ba
  rationale: Bản văn Mác dùng μετὰ τρεῖς ἡμέρας, theo hình thức là “sau ba ngày”. Bản chính giữ cách nói ấy, còn chú thích nêu cách diễn đạt song song để không âm thầm điều hòa các bản văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Người” làm đại từ kính trọng chỉ Chúa Giê-su mà không đưa thêm danh xưng vốn không có trong câu Hy Lạp; chuỗi động từ ngắn giữ nhịp dồn dập của nguyên văn.
