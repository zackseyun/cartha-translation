    text: 'Nguyên văn Hy Lạp: “sau ba ngày”. Một số phân đoạn khác diễn đạt thời điểm này là “vào ngày thứ ba”; hai cách nói có thể được hiểu phù hợp theo lối tính ngày bao gồm cả ngày đầu.'
    reason: Giữ cách nói trực tiếp của Mác, đồng thời lưu ý cách diễn đạt thời điểm khác trong các phân đoạn song song mà không coi đó là nghĩa trực tiếp khác của cụm Hy Lạp.
  revision_rationale: Sửa “đánh đòn” thành “đánh roi” để chuyển tải cụ thể động từ μαστιγόω. Cũng chỉnh chú thích để phân biệt nghĩa trực tiếp “sau ba ngày” với cách diễn đạt “vào ngày thứ ba” ở những phân đoạn khác. Các yếu tố còn lại được giữ nguyên vì trung thành với nguồn, tự nhiên trong tiếng Việt hiện đại và không áp đặt diễn giải thần học.
