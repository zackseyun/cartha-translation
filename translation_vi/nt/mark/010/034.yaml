review_pass:
  verdict: revise
  source_fidelity: Bản dịch theo đúng chuỗi động từ tương lai trong tiếng Hy Lạp và giữ được nghĩa nội động của ἀναστήσεται qua “sẽ sống lại”. “Sau ba ngày” dịch sát μετὰ τρεῖς ἡμέρας, không điều hòa thành “vào ngày thứ ba”. Tuy nhiên, μαστιγώσουσιν chỉ sự đánh bằng roi/tra tấn bằng roi, cụ thể hơn “đánh đòn”, nên cần nêu rõ phương tiện này.
  naturalness: Văn câu hiện đại, trang trọng và mạch lạc. “Người” là đại từ kính trọng tự nhiên trong ngữ cảnh. Thay “đánh đòn” bằng “đánh roi” vừa tự nhiên vừa chính xác hơn.
  terminology: “Chế nhạo”, “nhổ vào”, “giết”, và “sống lại” phù hợp với sắc thái và đăng ký của bản văn. “Đánh roi” là tương đương rõ ràng hơn cho μαστιγόω so với thuật ngữ khái quát “đánh đòn”. Chú thích cần nói rõ rằng “vào ngày thứ ba” là cách quy đổi/cách tính thời gian trong các bản văn song song, chứ không phải nghĩa trực tiếp của μετά với đối cách.
  issues:
  - severity: medium
    issue: “đánh đòn” chưa phản ánh đủ tính cụ thể của μαστιγώσουσιν.
    rationale: μμαστιγόω nói đến việc đánh/tra tấn bằng roi (flogging, scourging); “đánh đòn” có thể chỉ bất cứ hình thức trừng phạt thân thể nào. “Đánh roi” giữ được chi tiết của nguồn mà vẫn là tiếng Việt hiện đại.
  - severity: low
    issue: Chú thích có thể được diễn đạt chính xác hơn về quan hệ giữa “sau ba ngày” và “vào ngày thứ ba”.
    rationale: “Vào ngày thứ ba” không phải là nghĩa từ vựng trực tiếp của μετὰ τρεῖς ἡμέρας; đó là cách diễn đạt/quy đổi thời gian xuất hiện ở các phân đoạn song song, thường được giải thích theo lối tính ngày bao gồm.
  revised_text: Họ sẽ chế nhạo Người, nhổ vào Người, đánh roi Người và giết Người; sau ba ngày, Người sẽ sống lại.
  revised_footnotes:
