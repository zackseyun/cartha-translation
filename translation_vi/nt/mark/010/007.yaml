  text: ἕνεκεν τούτου καταλείψει ἄνθρωπος τὸν πατέρα αὐτοῦ καὶ τὴν μητέρα ⸂καὶ προσκολληθήσεται πρὸς τὴν γυναῖκα αὐτοῦ⸃,
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/007.yaml
  text: For this reason a man will leave his father and mother and be joined to his wife,[a]
translation:
  language: vi
  text: Vì lý do đó, người nam sẽ lìa cha mẹ mình và gắn bó với vợ mình.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “bám chặt lấy vợ mình.” Động từ Hy Lạp nhấn mạnh sự gắn bó mật thiết.'
    reason: lexical_alternative
  - marker: b
    text: 'Một số thủ bản không có: “và gắn bó với vợ mình.”'
    reason: textual_variant
lexical_decisions:
- source_word: ἕνεκεν τούτου
  choice: Vì lý do đó
  rationale: Giữ rõ quan hệ nguyên nhân và chức năng giải thích của cụm từ Hy Lạp, đồng thời tự nhiên trong tiếng Việt hiện đại.
- source_word: καταλείψει
  choice: sẽ lìa
  rationale: Diễn đạt hành động rời khỏi cha mẹ để thiết lập gia đình mới; “lìa” trang trọng, gọn và quen thuộc trong văn cảnh hôn nhân.
- source_word: ἄνθρωπος
  choice: người nam
  rationale: Dù từ này có thể mang nghĩa chung là con người, văn cảnh hôn nhân và cụm “vợ mình” xác định đây là bên nam trong cặp vợ chồng.
- source_word: τὸν πατέρα αὐτοῦ καὶ τὴν μητέρα
  choice: cha mẹ mình
  rationale: Gộp thành cách nói tự nhiên trong tiếng Việt mà vẫn truyền đạt đầy đủ cả cha lẫn mẹ và quan hệ sở hữu.
- source_word: προσκολληθήσεται
  choice: gắn bó với
  rationale: Thể hiện sự kết hợp và quyến luyến mật thiết trong hôn nhân; giữ được sắc thái gắn chặt của động từ mà vẫn tự nhiên.
- source_word: πρὸς τὴν γυναῖκα αὐτοῦ
  choice: với vợ mình
  rationale: Trong văn cảnh hôn nhân, γυνή rõ ràng có nghĩa là “vợ”; “mình” quy chiếu tự nhiên về người nam làm chủ ngữ.
theological_decisions:
- issue: Ngôn ngữ chỉ giới tính trong lời trích dẫn về hôn nhân
  choice: người nam … vợ mình
  alternative: một người … người phối ngẫu của mình
  rationale: Văn cảnh chỉ rõ cặp nam-nữ trong hôn nhân; giữ giới tính được xác định trong câu thay vì trung tính hóa.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. “Lìa cha mẹ” cô đọng, còn “gắn bó với” truyền đạt tự nhiên sắc thái kết hợp mật thiết trong hôn nhân.
