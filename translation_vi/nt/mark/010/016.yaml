  yaml_path: translation/nt/mark/010/016.yaml
  text: And he took them in his arms and blessed them[b][a], laying his hands on them.
translation:
  language: vi
  text: Rồi Ngài ôm các em vào lòng[a], đặt tay trên các em mà liên tục ban phước cho các em[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “ôm các em” hoặc “đón các em vào vòng tay.” Động từ Hy Lạp nói cụ thể đến việc ôm ai vào vòng tay.'
    reason: lexical_alternative
  - marker: b
    text: Động từ Hy Lạp ở thì chưa hoàn thành và có dạng tăng cường, gợi ý Ngài ban phước liên tục, lặp lại, hoặc một cách tha thiết.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐναγκαλισάμενος
  choice: ôm các em vào lòng
  rationale: Động từ chỉ việc đón hoặc ôm ai vào vòng tay; cách diễn đạt này tự nhiên trong tiếng Việt và giữ được nét trìu mến, cụ thể của hành động.
- source_word: κατευλόγει
  choice: cứ chúc phước cho các em
  rationale: Thì chưa hoàn thành diễn tả hành động đang tiếp diễn hoặc lặp lại; tiền tố tăng cường của động từ cũng có thể gợi sắc thái tha thiết. Từ “cứ” truyền đạt rõ khía cạnh tiếp diễn mà vẫn tự nhiên.
- source_word: τιθεὶς τὰς χεῖρας ἐπ’ αὐτά
  choice: đặt tay trên các em
  rationale: Cụm phân từ mô tả hành động đi kèm với việc chúc phước. “Đặt tay trên” vừa sát cấu trúc Hy Lạp vừa là cách nói quen thuộc, không thêm ý nghĩa nghi lễ ngoài bản văn.
- source_word: αὐτὰ ... αὐτά
  choice: các em
  rationale: Các đại từ giống trung số nhiều quy chiếu về những trẻ nhỏ trong ngữ cảnh. Tiếng Việt dùng “các em” tự nhiên và rõ đối tượng hơn đại từ “họ”.
- source_word: καὶ
  choice: Rồi
  rationale: Liên từ nối tiếp diễn tiến câu chuyện; “Rồi” tự nhiên trong văn kể tiếng Việt mà không hàm ý suy luận.
theological_decisions:
- issue: Bản chất hành động của Chúa Giê-su đối với các trẻ nhỏ
  choice: 'Giữ nguyên các hành động cụ thể: ôm vào lòng, đặt tay và chúc phước, không gán thuật ngữ bí tích hay nghi lễ.'
  alternative: Diễn đạt là “ban phép lành bằng nghi thức đặt tay.”
  rationale: Bản văn mô tả sự tiếp nhận trìu mến và việc chúc phước của Chúa Giê-su nhưng không xác định đây là một nghi thức thuộc hệ thống thần học về sau.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Ngài” theo lối quy chiếu kính trọng quen thuộc trong văn Kinh Thánh tiếng Việt; “các em” phù hợp với đối tượng là trẻ nhỏ. Cả hai dấu chú thích [a], [b] đều xuất hiện trong chính văn.
