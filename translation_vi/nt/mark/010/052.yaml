source:
  edition: SBLGNT
  text: ⸂καὶ ὁ⸃ Ἰησοῦς εἶπεν αὐτῷ· Ὕπαγε, ἡ πίστις σου σέσωκέν σε. καὶ ⸀εὐθὺς ἀνέβλεψεν, καὶ ἠκολούθει ⸀αὐτῷ ἐν τῇ ὁδῷ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/052.yaml
  text: And Jesus said to him[a], “Go[c][b]; your faith has saved you.” And immediately he regained his sight and followed him on the road.
translation:
  language: vi
  text: 'Đức Giê-su nói với anh: “Hãy đi; đức tin của anh đã cứu anh[a].” Lập tức, anh nhìn thấy lại và đi theo Ngài trên đường[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đã chữa lành anh” hoặc “đã làm cho anh được khỏe lại.” Động từ Hy Lạp có thể nói đến cả sự chữa lành lẫn sự cứu rỗi.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “dọc đường” hoặc “trên lối đi.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὕπαγε
  choice: Hãy đi
  rationale: Mệnh lệnh trực tiếp, tự nhiên trong tiếng Việt, không thêm ý sở hữu như “hãy đi đường của anh”.
- source_word: πίστις
  choice: đức tin
  rationale: Giữ thuật ngữ thần học quen thuộc, đồng thời trong ngữ cảnh này chỉ lòng tin cậy của người ấy nơi Đức Giê-su.
- source_word: σέσωκέν
  choice: đã cứu
  rationale: Động từ σῴζω có thể chỉ cứu rỗi, giải cứu hoặc chữa lành. “Đã cứu” giữ được phạm vi nghĩa rộng và sự căng thẳng giữa việc được chữa lành về thể chất với ý nghĩa cứu độ sâu hơn.
- source_word: εὐθύς
  choice: lập tức
  rationale: Diễn đạt tự nhiên nhịp kể nhanh đặc trưng của Mác.
- source_word: ἀνέβλεψεν
  choice: nhìn thấy lại
  rationale: Trong ngữ cảnh người mù được phục hồi thị lực, cách diễn đạt này rõ ràng, tự nhiên và gần với ý nghĩa của động từ.
- source_word: ἠκολούθει
  choice: đi theo
  rationale: Thì chưa hoàn thành gợi hành động tiếp diễn; tiếng Việt không bắt buộc đánh dấu thể này, và “đi theo” tự nhiên hơn trong câu mà vẫn cho phép hiểu là anh tiếp tục theo Ngài.
- source_word: ἐν τῇ ὁδῷ
  choice: trên đường
  rationale: Giữ hình ảnh cụ thể về con đường, đồng thời không loại bỏ âm hưởng “Con Đường” của việc làm môn đồ.
- source_word: καὶ ὁ Ἰησοῦς
  choice: Đức Giê-su nói
  rationale: Không dịch máy móc καί ở đầu câu vì tiếng Việt hiện đại không cần liên từ này để duy trì mạch kể; danh xưng “Đức Giê-su” trang trọng và phổ thông.
theological_decisions:
- issue: Ý nghĩa của σῴζω trong lời tuyên bố của Đức Giê-su
  choice: đã cứu anh
  alternative: đã chữa lành anh; đã làm cho anh được khỏe lại
  rationale: Ngữ cảnh ngay sau đó xác nhận sự phục hồi thị lực, nhưng động từ Hy Lạp rộng hơn việc chữa bệnh. Bản dịch giữ nguyên khả năng bao hàm cả sự chữa lành và cứu độ.
- issue: Sắc thái của ἐν τῇ ὁδῷ
  choice: trên đường
  alternative: trên Con Đường; dọc đường
  rationale: Không viết hoa hoặc giải thích thành một thuật ngữ môn đồ học vì nguyên văn vẫn có nghĩa địa lý cụ thể, dù có thể đồng thời gợi âm hưởng theo Đức Giê-su trên con đường môn đồ.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh” cho người được chữa lành và “Ngài” để quy chiếu Đức Giê-su. Các dấu chú thích [a], [b] đều xuất hiện trong chính văn.
