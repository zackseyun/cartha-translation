source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς εἶπεν αὐτοῖς· Οὐκ οἴδατε τί αἰτεῖσθε· δύνασθε πιεῖν τὸ ποτήριον ὃ ἐγὼ πίνω, ⸀ἢ τὸ βάπτισμα ὃ ἐγὼ βαπτίζομαι βαπτισθῆναι;
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/038.yaml
  text: But Jesus said to them[a], “You do not know what you are asking. Are you able to drink the cup that I drink[b], or to be baptized with the baptism with which I am baptized?”
translation:
  language: vi
  text: 'Nhưng Đức Giê-su nói với họ: “Các con không biết mình đang xin điều gì. Các con có thể uống chén mà Ta uống[a], hoặc chịu phép báp-têm mà Ta chịu[b] không?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Chén” là hình ảnh Kinh Thánh chỉ phần được định cho một người; ở đây đặc biệt hướng đến đau khổ sắp đến của Đức Giê-su.
    reason: cross_reference
  - marker: b
    text: 'Cũng có thể diễn ý: “trải qua phép báp-têm mà Ta trải qua.” Tiếng Hy Lạp lặp lại danh từ và động từ cùng gốc chỉ phép báp-têm để nhấn mạnh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ Ἰησοῦς εἶπεν αὐτοῖς
  choice: Nhưng Đức Giê-su nói với họ
  rationale: δέ đánh dấu bước chuyển có sắc thái tương phản, phù hợp với lời sửa dạy của Đức Giê-su; “nói với họ” chuyển sát và tự nhiên cấu trúc εἶπεν αὐτοῖς.
- source_word: Οὐκ οἴδατε τί αἰτεῖσθε
  choice: Các con không biết mình đang xin điều gì
  rationale: Giữ nghĩa cơ bản “biết” của οἶδα thay vì diễn giải thành “hiểu”; “mình đang xin điều gì” là cách nói tiếng Việt tự nhiên và truyền đạt đúng hành động xin của αἰτέω.
- source_word: δύνασθε
  choice: Các con có thể ... không?
  rationale: Diễn đạt câu hỏi về khả năng, năng lực bằng cấu trúc nghi vấn tự nhiên trong tiếng Việt.
- source_word: πιεῖν τὸ ποτήριον ὃ ἐγὼ πίνω
  choice: uống chén mà Ta uống
  rationale: Giữ nguyên hình ảnh ẩn dụ “chén”, không giải thích ngay trong chính văn là đau khổ hay thịnh nộ; cấu trúc gọn và tự nhiên trong tiếng Việt.
- source_word: ἢ
  choice: hoặc
  rationale: Phản ánh liên từ phân cách của bản SBLGNT, không hòa hợp câu với các truyền thống bản văn hoặc câu song song.
- source_word: τὸ βάπτισμα ὃ ἐγὼ βαπτίζομαι βαπτισθῆναι
  choice: chịu phép báp-têm mà Ta chịu
  rationale: Giữ danh từ “phép báp-têm” và tính chất ẩn dụ, đồng thời dùng “chịu” để câu tiếng Việt tự nhiên và gợi đúng một biến cố phải trải qua. Sự lặp lại cùng gốc từ trong tiếng Hy Lạp được nêu ở chú thích vì nếu sao chép đầy đủ bằng tiếng Việt, câu sẽ rất nặng và thiếu tự nhiên.
theological_decisions:
- issue: Hình ảnh ẩn dụ “chén” và “phép báp-têm”
  choice: Giữ cả hai hình ảnh trong chính văn, không giải nghĩa trực tiếp là đau khổ, cái chết hay cơn thịnh nộ của Đức Chúa Trời.
  alternative: Diễn giải thành “chịu nỗi đau khổ mà Ta chịu” hoặc cách tương tự.
  rationale: Hai hình ảnh hướng đến đau khổ sắp đến của Đức Giê-su, nhưng câu này không tự giới hạn hoặc giải thích trọn ý nghĩa thần học của chúng. Giữ nguyên hình ảnh bảo toàn sự căng thẳng và tính liên văn bản.
- issue: Sắc thái bị động của βαπτίζομαι và βαπτισθῆναι
  choice: Dùng “chịu phép báp-têm” để thể hiện một điều Đức Giê-su và các môn đồ phải trải qua.
  alternative: Dùng “làm phép báp-têm” hoặc chỉ dùng ngôn ngữ nghi lễ.
  rationale: Trong ngữ cảnh, đây là phép ẩn dụ về một biến cố áp đảo mà người nói phải trải qua, chứ không đơn thuần mô tả việc cử hành nghi thức. “Chịu” giữ sắc thái tiếp nhận mà không xác định quá mức tác nhân thần học.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Đức Giê-su” phù hợp lối gọi tôn kính phổ biến; cặp xưng hô “Ta—các con” thể hiện quan hệ giữa thầy và môn đồ trong ngữ cảnh. Hai ẩn dụ được giữ trong chính văn, còn thông tin giải thích đặt ở chú thích. Các dấu chú thích được đặt ngay sau hình ảnh tương ứng.
