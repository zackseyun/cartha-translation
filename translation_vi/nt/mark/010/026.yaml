  text: οἱ δὲ περισσῶς ἐξεπλήσσοντο λέγοντες πρὸς ⸀ἑαυτούς· Καὶ τίς δύναται σωθῆναι;
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/026.yaml
  text: And they were exceedingly astonished[a], saying to one another, “Then who can be saved?”
translation:
  language: vi
  text: 'Họ vô cùng kinh ngạc và nói với nhau: “Vậy thì ai có thể được cứu?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ δὲ
  choice: Họ lại
  rationale: Đại từ chỉ lại các môn đồ hoặc những người đang nghe trong ngữ cảnh; “lại” nối tiếp diễn tiến lời kể và dẫn vào phản ứng mạnh hơn mà không tạo nét tương phản quá mức.
- source_word: περισσῶς
  choice: càng
  rationale: 'Trong ngữ cảnh sau phản ứng kinh ngạc ở câu trước, từ này tự nhiên mang sắc thái gia tăng: họ càng kinh ngạc hơn.'
- source_word: ἐξεπλήσσοντο
  choice: kinh ngạc
  rationale: Diễn đạt trạng thái sửng sốt mạnh; kết hợp với “càng” truyền đạt cường độ và tính đang tiếp diễn của dạng chưa hoàn thành.
- source_word: λέγοντες
  choice: nói
  rationale: Phân từ diễn tả hành động đồng thời với sự kinh ngạc; tiếng Việt tự nhiên dùng động từ nối tiếp bằng dấu phẩy.
- source_word: πρὸς ἑαυτούς
  choice: với nhau
  rationale: Trong bối cảnh một nhóm trò chuyện, cụm này có nghĩa hỗ tương là nói với nhau; cách dịch này tự nhiên hơn “với chính mình”.
- source_word: Καὶ
  choice: Vậy thì
  rationale: Ở đây καί dẫn vào kết luận hoặc hệ quả họ rút ra từ lời Đức Chúa Jêsus, nên “Vậy thì” truyền đạt rõ sắc thái suy luận trong câu hỏi.
- source_word: τίς
  choice: ai
  rationale: Đại từ nghi vấn hỏi người nào có khả năng được cứu.
- source_word: δύναται
  choice: có thể
  rationale: Diễn đạt khả năng một cách tự nhiên và chính xác trong tiếng Việt hiện đại.
- source_word: σωθῆναι
  choice: được cứu
  rationale: Dạng nguyên mẫu bị động của σῴζω trong ngữ cảnh vào vương quốc Đức Chúa Trời mang ý nghĩa cứu rỗi rộng hơn sự giải cứu tạm thời; “được cứu” giữ nguyên trọng lượng thần học ấy.
theological_decisions:
- issue: Ý nghĩa của ngôn ngữ cứu rỗi trong ngữ cảnh
  choice: được cứu
  alternative: được giải cứu
  rationale: Mạch văn bàn về việc vào vương quốc Đức Chúa Trời, nên cần giữ ý nghĩa cứu rỗi và cánh chung, thay vì thu hẹp thành một sự thoát nạn thông thường.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Họ lại càng kinh ngạc” phản ánh cả diễn tiến câu chuyện lẫn mức độ gia tăng của phản ứng; “Vậy thì” giữ sắc thái suy luận của câu hỏi.
