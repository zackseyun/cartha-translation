revisions:
- from: 'Đức Giê-su nhìn quanh rồi nói với các môn đệ: “Những người có của cải vào vương quốc Đức Chúa Trời thật khó biết bao!”[a]'
  to: 'Đức Giê-su nhìn quanh rồi nói với các môn đệ: “Những người có của cải[a] sẽ khó biết bao để vào Vương quốc Đức Chúa Trời!”'
  rationale: Sửa vị trí mốc chú thích để nó neo đúng vào “của cải” (χρήματα), và thêm “sẽ” để phản ánh thì tương lai của εἰσελεύσονται. Cách diễn đạt vẫn giữ sắc thái cảm thán của Πῶς δυσκόλως, không tăng cường thành ý bất khả thi.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T07:40:57Z'
review_pass:
  verdict: revise
  source_fidelity: Bản dịch truyền đạt đúng trình tự “nhìn quanh rồi nói,” đối tượng là những người có của cải, và ý nhấn mạnh sự khó khăn chứ không phải bất khả thi. Tuy nhiên, εἰσελεύσονται là thì tương lai; bản sửa thêm “sẽ” để biểu thị rõ chiều hướng tương lai. Cụm “vào ... thật khó biết bao” được sắp xếp lại để quan hệ cú pháp rõ ràng hơn.
  naturalness: Câu dự thảo có thể hiểu được, nhưng “Những người có của cải vào vương quốc Đức Chúa Trời thật khó biết bao” hơi nặng và có thể gây khựng vì cụm chủ ngữ dài nối trực tiếp với “vào”. “Những người có của cải sẽ khó biết bao để vào...” tự nhiên, rõ nghĩa và vẫn giữ sắc thái cảm thán trang trọng.
  terminology: “Đức Giê-su,” “môn đệ,” “của cải,” và “Vương quốc Đức Chúa Trời” phù hợp với văn phong Kinh Thánh tiếng Việt hiện đại và phản ánh đúng các thuật ngữ nguồn. Chú thích về χρήματα phải được gắn ngay sau “của cải,” không phải sau toàn câu, vì đây là từ được chú thích.
  issues:
  - severity: medium
    issue: Mốc chú thích [a] đang đặt ở cuối câu thay vì ngay sau “của cải.”
    rationale: Nội dung chú thích giải thích χρήματα (“của cải”), không giải thích toàn mệnh đề hoặc động từ “nhìn quanh”; đặt mốc sát từ được chú thích giúp liên kết chú thích chính xác.
  - severity: low
    issue: Thì tương lai của εἰσελεύσονται chưa được biểu thị rõ.
    rationale: Tiếng Việt có thể không cần đánh dấu thì trong một số cấu trúc, nhưng thêm “sẽ” ở đây vừa tự nhiên vừa bảo toàn định hướng tương lai của động từ Hy Lạp.
  revised_text: 'Đức Giê-su nhìn quanh rồi nói với các môn đệ: “Những người có của cải[a] sẽ khó biết bao để vào Vương quốc Đức Chúa Trời!”'
