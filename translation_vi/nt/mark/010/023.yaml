  text: Καὶ περιβλεψάμενος ὁ Ἰησοῦς λέγει τοῖς μαθηταῖς αὐτοῦ· Πῶς δυσκόλως οἱ τὰ χρήματα ἔχοντες εἰς τὴν βασιλείαν τοῦ θεοῦ εἰσελεύσονται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/023.yaml
  text: And looking around[a], Jesus says to his disciples, “How difficult it is for those who have wealth to enter the kingdom of God!”
translation:
  language: vi
  text: 'Đức Giê-su nhìn quanh rồi nói với các môn đệ: “Những người có của cải[a] sẽ khó biết bao để vào Vương quốc Đức Chúa Trời!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “những người có tiền bạc,” “những người sở hữu tài sản.”
    reason: lexical_alternative
lexical_decisions:
- source_word: περιβλεψάμενος
  choice: nhìn quanh rồi
  rationale: Phân từ bất định trung cách diễn tả việc Đức Giê-su nhìn khắp những người chung quanh trước khi nói; “nhìn quanh rồi” vừa tự nhiên trong tiếng Việt vừa giữ trình tự hành động.
- source_word: λέγει
  choice: nói
  rationale: Thì hiện tại lịch sử tạo nét kể chuyện sống động trong Mác; tiếng Việt thường dùng “nói” mà không cần đánh dấu hình thái thì.
- source_word: Πῶς δυσκόλως
  choice: thật khó biết bao
  rationale: Cụm này mang sắc thái cảm thán và nhấn mạnh mức độ khó khăn; cách dịch không biến lời nói thành một khẳng định về sự bất khả thi.
- source_word: οἱ τὰ χρήματα ἔχοντες
  choice: những người có của cải
  rationale: Giữ cấu trúc chỉ những người sở hữu tài sản, thay vì quy thành một nhãn xã hội cố định như “người giàu”.
- source_word: χρήματα
  choice: của cải
  rationale: Từ này có thể chỉ tiền bạc hay tài sản rộng hơn; “của cải” giữ được phạm vi nghĩa ấy trong ngữ cảnh.
- source_word: βασιλείαν τοῦ θεοῦ
  choice: vương quốc Đức Chúa Trời
  rationale: Cách diễn đạt rõ ràng, quen thuộc và giữ hình ảnh βασιλεία là vương quốc, không thu hẹp thành một khái niệm trừu tượng.
- source_word: εἰσελεύσονται
  choice: vào
  rationale: Động từ ở thì tương lai có nghĩa “sẽ vào”; trong cấu trúc cảm thán tiếng Việt, “vào ... thật khó” diễn đạt tự nhiên sự việc được nói đến mà không cần thêm “sẽ” một cách gượng ép.
theological_decisions:
- issue: Lời của Đức Giê-su nói đến sự bất khả thi tuyệt đối hay mức độ khó khăn nghiêm trọng đối với người có của cải
  choice: 'Diễn đạt là khó khăn nghiêm trọng: “thật khó biết bao”'
  alternative: Diễn đạt theo hướng trên thực tế là không thể
  rationale: Bản Hy Lạp dùng δυσκόλως, nghĩa là “một cách khó khăn,” chứ không dùng từ chỉ sự bất khả thi. Bản dịch giữ nguyên sức căng thần học mà không kết luận quá điều câu này nói.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Trật tự “nhìn quanh rồi nói” tự nhiên và giữ quan hệ thời gian của phân từ; câu cảm thán bảo toàn sức nhấn của nguyên văn.
