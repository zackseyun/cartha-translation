  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Tránh thêm sắc thái khởi đầu vào động từ chưa hoàn thành và giữ sự mơ hồ thật sự về phạm vi bổ nghĩa của πάλιν.
