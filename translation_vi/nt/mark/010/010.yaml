  text: Καὶ ⸂εἰς τὴν οἰκίαν⸃ πάλιν οἱ μαθηταὶ ⸂περὶ τούτου⸃ ⸀ἐπηρώτων αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/010.yaml
  text: And in the house again[b][a], the disciples were asking him about this.
translation:
  language: vi
  text: Khi vào trong nhà, các môn đồ lại hỏi Ngài về việc ấy.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: Khi
  rationale: Liên từ nối tiếp cảnh trước; trong tiếng Việt, cấu trúc “Khi...,” kết hợp tự nhiên với cụm chỉ việc đi vào nhà mà không cần dịch máy móc là “Và”.
- source_word: εἰς τὴν οἰκίαν
  choice: vào trong nhà
  rationale: Giữ hướng chuyển động của εἰς và địa điểm xác định của τὴν οἰκίαν; không thêm ý “trở về” hay “ở nhà” vốn không được nói rõ.
- source_word: πάλιν
  choice: lại
  rationale: Vị trí của πάλιν có thể gắn với việc vào nhà hoặc việc hỏi. Đặt “lại” trước “vào trong nhà” bám sát trật tự Hy Lạp nhưng vẫn để chú thích bảo tồn cách hiểu khác.
- source_word: οἱ μαθηταὶ
  choice: các môn đồ
  rationale: Chỉ nhóm môn đồ đã được xác định trong ngữ cảnh; không thêm đại từ sở hữu.
- source_word: περὶ τούτου
  choice: về việc ấy
  rationale: Cách diễn đạt tự nhiên, trang trọng vừa phải; “việc ấy” quy chiếu đến vấn đề vừa được bàn luận.
- source_word: ἐπηρώτων
  choice: hỏi
  rationale: Thì chưa hoàn thành cho thấy hành động trong quá khứ đang diễn ra hoặc có tính lặp lại, nhưng tiếng Việt không cần bắt buộc thêm “đang” hay “bắt đầu”; “hỏi” tránh xác định quá mức sắc thái thể.
- source_word: αὐτόν
  choice: Ngài
  rationale: Đại từ chỉ Chúa Giê-su; “Ngài” là cách gọi tôn kính, thông dụng trong văn phong Kinh Thánh tiếng Việt.
