    rationale: Sau «còn dễ hơn», cụm «một người giàu có vào...» thiếu danh từ/động từ dẫn để đối ứng rõ với «một con lạc đà chui qua...». Thêm «việc» trước cả hai vế giúp câu tự nhiên và phản ánh hai động từ nguyên mẫu Hy Lạp được đặt trong thế so sánh.
  - severity: low
    issue: Cách diễn đạt chú thích a hơi khẩu ngữ.
    rationale: «Nghĩa sát» tự nhiên và phù hợp hơn «Nói sát hơn» trong chú thích dịch thuật.
