source:
  edition: SBLGNT
  text: εὐκοπώτερόν ἐστιν κάμηλον διὰ ⸂τῆς τρυμαλιᾶς τῆς⸃ ῥαφίδος ⸀διελθεῖν ἢ πλούσιον εἰς τὴν βασιλείαν τοῦ θεοῦ εἰσελθεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/025.yaml
  text: It is easier for a camel to go through the eye of a needle than for a rich man to enter the kingdom of God[a][b][c].
translation:
  language: vi
  text: Việc một con lạc đà[b] chui qua lỗ kim[a] còn dễ hơn việc một người giàu có[c] vào vương quốc của Đức Chúa Trời.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nghĩa sát: “qua lỗ của một cây kim khâu.”'
    reason: lexical_alternative
  - marker: b
    text: Có người đề xuất đọc là “dây thừng” thay cho “lạc đà”, nhưng bản văn Hy Lạp ở đây ghi “lạc đà”.
    reason: alternative_reading
  - marker: c
    text: Trong tiếng Hy Lạp, cụm này có hình thức giống đực số ít; lời nói được dùng theo nghĩa đại diện.
    reason: cultural_note
lexical_decisions:
- source_word: εὐκοπώτερόν
  choice: còn dễ hơn
  rationale: Diễn đạt tự nhiên dạng so sánh hơn trong tiếng Việt, đồng thời giữ nguyên sức mạnh của phép nói cường điệu.
- source_word: κάμηλον
  choice: một con lạc đà
  rationale: Bản văn Hy Lạp ghi rõ κάμηλος, nghĩa là “lạc đà”; không thay bằng giả thuyết “dây thừng”.
- source_word: διὰ τῆς τρυμαλιᾶς τῆς ῥαφίδος
  choice: qua lỗ kim
  rationale: Chỉ lỗ của kim khâu; “lỗ kim” là cách nói ngắn gọn, rõ ràng và tự nhiên trong tiếng Việt.
- source_word: διελθεῖν
  choice: chui qua
  rationale: “Chui qua” truyền đạt tự nhiên hành động đi xuyên qua một lỗ rất nhỏ và giữ được hình ảnh cụ thể của câu.
- source_word: πλούσιον
  choice: một người giàu có
  rationale: Tính từ được dùng như danh từ, ở số ít. Cách dịch này tự nhiên trong tiếng Việt; chú thích ghi nhận hình thức giống đực của tiếng Hy Lạp.
- source_word: εἰς τὴν βασιλείαν τοῦ θεοῦ
  choice: vào vương quốc của Đức Chúa Trời
  rationale: Giữ ý niệm βασιλεία là vương quốc/quyền trị vì của Đức Chúa Trời mà không diễn giải thêm theo một hệ phái.
- source_word: εἰσελθεῖν
  choice: vào
  rationale: Động từ tiếng Việt ngắn gọn và tự nhiên, tương ứng trực tiếp với nghĩa “đi vào/bước vào” của εἰσέρχομαι.
theological_decisions:
- issue: Cách hiểu hình ảnh lạc đà và lỗ kim
  choice: 'Giữ nguyên hình ảnh cường điệu theo nghĩa trực tiếp: một con lạc đà chui qua lỗ của kim khâu.'
  alternative: Hiểu “lỗ kim” là tên một cổng nhỏ ở Giê-ru-sa-lem, hoặc đổi “lạc đà” thành “dây thừng”.
  rationale: Bản văn Hy Lạp tạo nên một hình ảnh cực độ về điều không thể; không có cơ sở ngay trong câu để đưa truyền thuyết về một cổng nhỏ vào bản dịch hoặc làm nhẹ hình ảnh bằng từ “dây thừng”.
translation_notes:
  register: Văn phong hiện đại, trang trọng nhưng dễ hiểu. “Chui qua lỗ kim” giữ hình ảnh sống động và quen thuộc; “vương quốc của Đức Chúa Trời” diễn đạt rõ cụm từ thần học trung tâm mà không thêm cách giải thích giáo phái.
