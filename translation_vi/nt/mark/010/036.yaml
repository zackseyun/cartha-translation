  source_fidelity: 'Bản dịch chuyển đạt đầy đủ các yếu tố của câu Hy Lạp: chủ ngữ tiếp nối (“Ngài”), động từ nói, đối tượng số nhiều (“với họ”), câu hỏi về điều họ muốn, hành động “tôi làm,” và ý thụ hưởng “cho các anh.” Không thêm ý nghĩa đáng kể; “các anh” phù hợp với ngữ cảnh hai người nam trong đoạn văn.'
  naturalness: 'Câu văn hiện đại, trôi chảy và tự nhiên trong tiếng Việt: “Các anh muốn tôi làm gì cho các anh?” giữ được tính trực tiếp của lời thoại. Cách dùng “Ngài” ở lời trần thuật cùng “tôi—các anh” trong đối thoại nhất quán với văn phong trang trọng vừa phải.'
  terminology: “Ngài” là cách quy chiếu tôn kính thông dụng cho Chúa Giê-su trong tiếng Việt; “các anh” là cách xưng hô phù hợp ngữ cảnh mà không buộc phải thêm “cả hai.” Không có thuật ngữ thần học hoặc tên riêng cần hiệu chỉnh.
