  text: And he said to them, “What do you want me to do for you?”
translation:
  language: vi
  text: 'Ngài nói với họ: “Các anh muốn tôi làm gì cho các anh?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δὲ
  choice: Ngài
  rationale: Cụm này tiếp nối lời kể và chỉ lại Chúa Giê-su; tiếng Việt không cần dịch riêng δέ trong ngữ cảnh này, còn “Ngài” giữ lối xưng hô tôn kính, tự nhiên.
- source_word: εἶπεν
  choice: nói
  rationale: Đây là động từ nói thông thường; tuy câu nói mang hình thức câu hỏi, không cần đổi thành “hỏi”.
- source_word: αὐτοῖς
  choice: với họ
  rationale: Đại từ số nhiều được chuyển trực tiếp; không thêm “cả hai” vì nguyên văn không nói rõ như vậy.
- source_word: Τί
  choice: gì
  rationale: Đại từ nghi vấn được đặt ở vị trí tự nhiên trong câu hỏi tiếng Việt.
- source_word: θέλετε
  choice: Các anh muốn
  rationale: θέλω diễn tả ý muốn; “muốn” là cách nói hiện đại và trực tiếp. “Các anh” phù hợp với hai người nam đang được Chúa Giê-su nói trực tiếp.
- source_word: ποιήσω
  choice: tôi làm
  rationale: Thể giả định sau θέλετε diễn tả hành động được mong muốn; cấu trúc tiếng Việt tự nhiên là “muốn tôi làm gì”.
- source_word: ὑμῖν
  choice: cho các anh
  rationale: 'Dữ cách mang ý nghĩa thụ hưởng: hành động được thực hiện vì lợi ích của những người được nói đến.'
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, rõ ràng và trang trọng vừa phải. Dùng “Ngài” trong lời trần thuật để chỉ Chúa Giê-su, nhưng giữ “tôi—các anh” trong lời thoại nhằm thể hiện cuộc đối thoại trực tiếp, tự nhiên.
