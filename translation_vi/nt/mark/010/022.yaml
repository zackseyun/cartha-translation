  text: ὁ δὲ στυγνάσας ἐπὶ τῷ λόγῳ ἀπῆλθεν λυπούμενος, ἦν γὰρ ἔχων κτήματα πολλά.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/022.yaml
  text: But he[a], becoming gloomy at the word, went away grieving[c][b], for he had many possessions.
translation:
  language: vi
  text: Nhưng nghe lời ấy, nét mặt anh sa sầm[a]; anh buồn rầu bỏ đi, vì anh có nhiều của cải.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “anh trở nên ủ rũ” hoặc “anh chán nản”; từ Hy Lạp gợi nét mặt tối sầm có thể nhìn thấy.'
    reason: lexical_alternative
lexical_decisions:
- source_word: στυγνάσας
  choice: nét mặt anh sa sầm
  rationale: Động từ gợi một biểu hiện bên ngoài trở nên tối sầm, ủ rũ. Cách dịch này tự nhiên trong tiếng Việt và giữ được sắc thái có thể nhìn thấy, thay vì chỉ nói chung về tâm trạng.
- source_word: ἐπὶ τῷ λόγῳ
  choice: nghe lời ấy
  rationale: Cụm từ chỉ lời nói là nguyên cớ hoặc hoàn cảnh dẫn đến phản ứng của người này. Tiếng Việt diễn đạt tự nhiên bằng “nghe lời ấy”, dù cũng có thể dịch sát hơn là “trước lời ấy” hoặc rõ quan hệ nguyên nhân hơn là “vì lời ấy”.
- source_word: ἀπῆλθεν
  choice: bỏ đi
  rationale: Diễn đạt tự nhiên hành động rời khỏi nơi đó; trong ngữ cảnh này, “bỏ đi” truyền đạt sắc thái rời đi sau phản ứng buồn rầu mà không thêm phán xét đạo đức.
- source_word: λυπούμενος
  choice: buồn rầu
  rationale: Phân từ hiện tại mô tả nỗi buồn tiếp diễn khi anh rời đi. “Buồn rầu” trang trọng vừa phải và có sức nặng hơn “buồn”.
- source_word: κτήματα πολλά
  choice: nhiều của cải
  rationale: κτήματα chỉ tài sản, của cải hay bất động sản; πολλά nhấn mạnh số lượng hoặc mức độ nhiều. “Nhiều của cải” tự nhiên và đủ rộng trong tiếng Việt.
- source_word: ἦν γὰρ ἔχων
  choice: vì anh có
  rationale: Kết cấu diễn tả tình trạng sở hữu đang kéo dài; tiếng Việt tự nhiên rút gọn thành “anh có”.
theological_decisions:
- issue: Bản chất phản ứng cảm xúc của người đàn ông trước lời Đức Chúa Jêsus
  choice: Giữ cả biểu hiện sa sầm có thể thấy được và nỗi buồn tiếp diễn, không thêm lời phán xét đạo đức.
  alternative: Diễn giải rằng anh tức giận, nổi loạn hoặc chỉ hơi thất vọng.
  rationale: Câu Hy Lạp nói rõ vẻ mặt tối sầm và nỗi buồn, nhưng không trực tiếp gọi đó là tức giận hay định tính động cơ của anh.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và dễ hiểu. Đại từ “anh” nối tự nhiên với người đàn ông trong ngữ cảnh; câu giữ quan hệ nhân quả nhưng không giải thích quá mức phản ứng của anh.
