  yaml_path: translation/nt/mark/010/003.yaml
  text: But he answered them, “What did Moses command you?”
translation:
  language: vi
  text: 'Nhưng Đức Giê-su đáp: “Môi-se đã truyền cho các ông điều gì?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: Nhưng
  rationale: Liên từ chuyển ý nhẹ, tạo nét tương phản với câu hỏi thử Đức Giê-su ở câu trước; “Nhưng” tự nhiên trong mạch đối thoại.
- source_word: ἀποκριθεὶς εἶπεν
  choice: đáp
  rationale: Cụm Hy Lạp mang sắc thái Sê-mít này diễn đạt một hành động trả lời; tiếng Việt tự nhiên chỉ cần dùng “đáp”, không cần lặp “đáp lại và nói”.
- source_word: αὐτοῖς
  choice: '[hàm ý trong cách xưng hô] các ông'
  rationale: Đại từ chỉ những người Pha-ri-si được thể hiện tự nhiên bằng đối tượng được hỏi trực tiếp là “các ông”; không cần thêm “với họ” sau động từ “đáp”.
- source_word: Τί
  choice: điều gì
  rationale: Đại từ nghi vấn hỏi về nội dung mệnh lệnh; “điều gì” rõ và tự nhiên hơn “gì” đứng riêng trong cấu trúc này.
- source_word: ὑμῖν
  choice: cho các ông
  rationale: Dữ cách chỉ những người nhận mệnh lệnh. “Các ông” phù hợp với lời Đức Giê-su nói với một nhóm nam giới và giữ giọng trang trọng, trung tính.
- source_word: ἐνετείλατο
  choice: đã truyền
  rationale: Động từ chỉ việc ban một mệnh lệnh có thẩm quyền. “Truyền” giữ được sắc thái pháp quy trong bối cảnh luật Môi-se mà vẫn tự nhiên trong văn phong Kinh Thánh hiện đại.
- source_word: Μωϋσῆς
  choice: Môi-se
  rationale: Dùng dạng tên riêng đã quen thuộc trong tiếng Việt hiện đại.
theological_decisions:
- issue: Thẩm quyền của Môi-se trong lời đáp của Đức Giê-su
  choice: Giữ nguyên Môi-se là chủ thể trực tiếp của động từ “đã truyền”.
  alternative: “Luật Môi-se truyền cho các ông điều gì?” hoặc “Đức Chúa Trời đã truyền cho các ông điều gì qua Môi-se?”
  rationale: Bản Hy Lạp chỉ đích danh Môi-se và không thay bằng “luật” hay bổ sung Đức Chúa Trời là chủ thể tối hậu. Giữ nguyên cách diễn đạt này tránh đưa lời giải thích thần học vào bản văn.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “Đức Giê-su” và “Môi-se” theo dạng tên quen thuộc; “các ông” thể hiện số nhiều ὑμῖν và phù hợp với đối tượng đối thoại.
