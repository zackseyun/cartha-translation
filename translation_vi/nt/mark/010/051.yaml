  text: καὶ ἀποκριθεὶς ⸂αὐτῷ ὁ Ἰησοῦς εἶπεν⸃· Τί ⸂σοι θέλεις ποιήσω⸃; ὁ δὲ τυφλὸς εἶπεν αὐτῷ· Ραββουνι, ἵνα ἀναβλέψω.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/051.yaml
  text: And answering him[a], Jesus said, “What do you want me to do for you?” And the blind man said to him, “Rabboni, that I may see again.”
translation:
  language: vi
  text: 'Đức Giê-su trả lời và nói: “Anh muốn tôi làm gì cho anh?” Người mù thưa: “Ra-bu-ni[a], xin cho tôi được thấy lại.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ra-bu-ni là cách xưng hô bằng tiếng A-ram, nghĩa là “thầy của tôi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς ... εἶπεν
  choice: đáp
  rationale: Tiếng Hy Lạp dùng phân từ “đáp lời” đi với động từ “nói”; tiếng Việt tự nhiên gộp hai yếu tố này thành “đáp” mà vẫn giữ đầy đủ chức năng của câu.
- source_word: Τί σοι θέλεις ποιήσω
  choice: Anh muốn tôi làm gì cho anh?
  rationale: Cách dịch này thể hiện cả ý muốn của θέλεις và lợi ích cách σοι bằng “cho anh”, đồng thời dùng lối hỏi tự nhiên trong tiếng Việt hiện đại.
- source_word: ὁ τυφλὸς
  choice: Người mù
  rationale: Tính từ được dùng như danh từ trong tiếng Hy Lạp; “người mù” là cách diễn đạt tự nhiên, chỉ đúng cá nhân đang được nói đến.
- source_word: Ραββουνι
  choice: Ra-bu-ni
  rationale: Giữ lại cách xưng hô gốc A-ram mà bản Hy Lạp đã phiên âm, đồng thời dùng chú thích để giải nghĩa.
- source_word: ἵνα ἀναβλέψω
  choice: xin cho tôi được thấy lại
  rationale: Trong bối cảnh chữa lành, ἀναβλέπω mang nghĩa lấy lại thị lực. “Xin cho tôi được thấy lại” diễn đạt tự nhiên lời thỉnh cầu hàm chứa trong mệnh đề ἵνα đứng độc lập.
theological_decisions:
- issue: Cách dịch tước hiệu xưng hô Ραββουνι
  choice: Giữ “Ra-bu-ni” trong chính văn và giải thích bằng chú thích
  alternative: “thầy của tôi” hoặc “chủ của tôi”
  rationale: Bản Hy Lạp giữ nguyên cách xưng hô A-ram đã phiên âm thay vì thay bằng một tước hiệu Hy Lạp thông thường. Giữ dạng phiên âm bảo tồn sắc thái lịch sử và cách xưng hô đặc thù mà không buộc chọn duy nhất một nét nghĩa tiếng Việt.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Đại từ “anh/tôi” làm rõ quan hệ đối thoại theo yêu cầu tự nhiên của tiếng Việt mà không thêm địa vị thần học. “Thưa với Ngài” diễn đạt sự kính trọng trong lời đáp; “xin cho” chuyển mệnh đề ἵνα độc lập thành lời cầu xin tự nhiên.
