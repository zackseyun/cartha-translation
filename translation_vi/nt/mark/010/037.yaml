  text: οἱ δὲ εἶπαν αὐτῷ· Δὸς ἡμῖν ἵνα εἷς ⸂σου ἐκ δεξιῶν⸃ καὶ εἷς ἐξ ⸀ἀριστερῶν καθίσωμεν ἐν τῇ δόξῃ σου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/037.yaml
  text: They said to him, “Grant to us that one of us may sit at your right and one at your left in your glory.”
translation:
  language: vi
  text: 'Họ thưa với Ngài: “Xin cho chúng con, một người được ngồi bên phải và một người bên trái Ngài trong vinh quang của Ngài.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Δὸς ἡμῖν ἵνα
  choice: Xin cho chúng con
  rationale: Diễn đạt tự nhiên lời thỉnh cầu, đồng thời giữ nghĩa sát của cấu trúc ‘hãy ban/cho chúng con để’.
- source_word: εἷς ... καὶ εἷς
  choice: một người ... và một người
  rationale: Giữ phép song đối của nguyên văn và cho thấy mỗi người xin một vị trí.
- source_word: ἐκ δεξιῶν ... ἐξ ἀριστερῶν
  choice: bên phải ... bên trái Ngài
  rationale: Cách nói tiếng Việt tự nhiên về các vị trí danh dự ở hai bên; ‘Ngài’ cuối cụm áp dụng rõ cho cả hai vị trí.
- source_word: ἐν τῇ δόξῃ σου
  choice: trong vinh quang của Ngài
  rationale: Giữ giới từ và danh từ của nguyên văn, không diễn giải ‘vinh quang’ thành vương quốc hay ngai trị vì.
theological_decisions:
- issue: Bản chất của ‘vinh quang’ và thời điểm các chỗ ngồi
  choice: giữ nguyên ‘trong vinh quang của Ngài’
  alternative: ‘khi Ngài được vinh hiển’ hoặc ‘trong vương quốc vinh hiển của Ngài’
  rationale: Nguyên văn không xác định trực tiếp thời điểm hay đồng nhất vinh quang với vương quốc; bản dịch giữ độ mở thần học ấy.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng ‘thưa’ vì đây là lời trực tiếp kính cẩn với Chúa Giê-su; đại từ ‘Ngài/chúng con’ phù hợp ngữ cảnh tôn kính.
