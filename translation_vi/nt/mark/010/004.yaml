- from: 'Họ đáp: “Môi-se đã cho phép viết giấy ly hôn[a] rồi cho người vợ đi[b].”'
  to: 'Họ đáp: “Môi-se đã cho phép viết giấy ly hôn[a] và cho vợ ra đi[b].”'
  rationale: Bản sửa chỉ thay cách diễn đạt mơ hồ «cho người vợ đi» bằng «cho vợ ra đi» và điều chỉnh chú thích tương ứng. Bản dịch tiếp tục giữ «đã cho phép», không biến sự cho phép của Môi-se thành mệnh lệnh, và không thêm chi tiết vượt quá văn bản.
