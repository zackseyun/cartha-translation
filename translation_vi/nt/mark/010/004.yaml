  yaml_path: translation/nt/mark/010/004.yaml
  text: They said[b][a], “Moses permitted us to write a certificate of divorce and send her away.”
translation:
  language: vi
  text: 'Họ đáp: “Môi-se đã cho phép viết giấy ly hôn[a] và cho vợ ra đi[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “văn thư ly hôn”. Cụm từ Hy Lạp chỉ một văn bản ly hôn có giá trị pháp lý.
    reason: lexical_alternative
  - marker: b
    text: Hay “và ly hôn vợ”. Nguyên văn là “và cho ra đi”, được dùng ở đây trong ngữ cảnh ly hôn; tân ngữ “vợ” được hiểu từ ngữ cảnh.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ εἶπαν
  choice: Họ đáp
  rationale: Đại từ chỉ những người Pha-ri-si đã được nhắc đến; δέ nối tiếp lời đối thoại và có thể hàm ý tương phản nhẹ. “Họ đáp” tự nhiên trong tiếng Việt và phù hợp ngữ cảnh hỏi–đáp.
- source_word: Ἐπέτρεψεν
  choice: đã cho phép
  rationale: Động từ ἐπιτρέπω diễn đạt sự cho phép, không phải mệnh lệnh; cách dịch này giữ được điểm tương phản quan trọng trong văn cảnh.
- source_word: Μωϋσῆς
  choice: Môi-se
  rationale: Dạng tên riêng quen dùng và dễ nhận biết trong tiếng Việt.
- source_word: βιβλίον ἀποστασίου
  choice: giấy ly hôn
  rationale: Cụm từ chỉ văn bản pháp lý xác nhận việc ly hôn. “Giấy ly hôn” rõ nghĩa, tự nhiên và giữ sắc thái pháp lý.
- source_word: γράψαι
  choice: viết
  rationale: Dịch trực tiếp động từ γράφω, không thêm ý chuyên biệt như soạn thảo hay ký.
- source_word: καὶ ἀπολῦσαι
  choice: rồi cho người vợ đi
  rationale: Trong ngữ cảnh hôn nhân, ἀπολύω chỉ việc cho vợ ra đi, tức ly hôn. Cách dịch giữ hình ảnh nguyên ngữ; “người vợ” được bổ sung từ ngữ cảnh dù không có tân ngữ biểu hiện trong câu Hy Lạp.
theological_decisions:
- issue: Tính chất lời dạy của Môi-se về ly hôn
  choice: Môi-se cho phép, chứ không chủ động truyền lệnh phải ly hôn
  alternative: Môi-se truyền lệnh viết giấy ly hôn
  rationale: Ἐπέτρεψεν có nghĩa rõ ràng là “cho phép”. Giữ nguyên ý này bảo tồn sự phân biệt trong văn cảnh giữa một sự nhượng bộ và ý định sáng tạo ban đầu của Đức Chúa Trời.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Họ đáp” tạo nhịp đối thoại tự nhiên; “giấy ly hôn” là cách nói phổ thông nhưng vẫn giữ sắc thái pháp lý. Các chú thích bảo tồn lựa chọn dịch sát hơn và nghĩa chuyên biệt theo ngữ cảnh.
