review_pass:
  verdict: revise
  source_fidelity: Bản nháp nhìn chung phản ánh đúng hành trình lên Giê-ru-sa-lem, vị trí Giê-su đi trước đoàn người, hai phản ứng khác nhau (kinh ngạc/sợ hãi), và lời báo trước các biến cố sắp đến. Tuy nhiên, «mười hai sứ đồ» thêm danh xưng không có trong τοὺς δώδεκα; «Nhóm Mười Hai» sát nguồn hơn. Cách gọi «Đức Chúa Jêsus/Ngài» cũng thêm tước hiệu và dùng chính tả không phải lựa chọn hiện đại chuẩn; nguồn chỉ ghi «Giê-su».
  naturalness: Câu được chỉnh thành một câu mở đầu liên kết tự nhiên hơn, vẫn giữ diễn tiến đang đi lên Giê-ru-sa-lem. «Đem riêng Nhóm Mười Hai theo» là cách diễn đạt tự nhiên, đồng thời chú thích bảo lưu khả năng không nhấn mạnh việc tách riêng.
  terminology: Dùng «Giê-su» theo chính tả hiện đại và không thêm tước hiệu vào tên riêng trong nguồn. «Nhóm Mười Hai» giữ tính chất định danh của τοὺς δώδεκα mà không bổ sung chức vụ «sứ đồ».
  issues:
  - severity: medium
    issue: «mười hai sứ đồ» bổ sung danh xưng
    rationale: Nguyên văn chỉ có τοὺς δώδεκα, nghĩa là «Nhóm/Mười Hai». Dù ngữ cảnh rộng hơn nhận diện họ là các sứ đồ, câu này không nêu danh xưng đó.
  - severity: low
    issue: Cách gọi «Đức Chúa Jêsus/Ngài» thêm sắc thái không được nêu trong câu nguồn
    rationale: SBLGNT ghi ὁ Ἰησοῦς và đại từ quy chiếu. Dùng «Giê-su/Người» vừa trang trọng trong văn mạch Kinh Thánh vừa tránh thêm tước hiệu; «Giê-su» cũng là chính tả hiện đại chuẩn.
  - severity: low
    issue: Chú thích b hiện lặp lại gần như nguyên văn cách dịch chính và chưa nêu rõ lựa chọn thay thế
    rationale: Chú thích nên đối chiếu rõ cách hiểu «đem theo» với cách dịch chính nhấn ý đem riêng/tách riêng, vốn là lực ngữ cảnh của παραλαβών.
