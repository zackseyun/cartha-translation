revisions:
- from: Họ đang trên đường[a] đi lên Giê-ru-sa-lem. Đức Chúa Jêsus đi trước họ; họ kinh ngạc, còn những người theo sau thì sợ hãi. Ngài lại đem riêng mười hai sứ đồ theo mình[b] và bắt đầu nói cho họ biết những điều sắp xảy đến với Ngài.
  to: Họ đang trên đường[a], đi lên Giê-ru-sa-lem, và Giê-su đi trước họ. Họ kinh ngạc, còn những người theo sau thì sợ hãi. Người lại đem riêng Nhóm Mười Hai theo[b] và bắt đầu nói cho họ biết những điều sắp xảy đến với Người.
  rationale: Bản sửa giữ các phân từ và thì diễn tiến của câu nguồn, phân biệt ἐθαμβοῦντο với ἐφοβοῦντο, và giữ lực khởi đầu của ἤρξατο λέγειν. «Đem riêng ... theo» phản ánh hợp lý παραλαβών trong ngữ cảnh mà không buộc một cách giải thích duy nhất; chú thích nêu phương án ít nhấn ý tách riêng hơn. Không theo chú thích b trong audit tiếng Anh vì nội dung «going before them» thuộc προάγων ở phần đầu câu, không phải παραλαβών πάλιν τοὺς δώδεκα.
