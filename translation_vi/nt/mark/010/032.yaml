id: MRK.10.32
reference: Mark 10:32
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἦσαν δὲ ἐν τῇ ὁδῷ ἀναβαίνοντες εἰς Ἱεροσόλυμα, καὶ ἦν προάγων αὐτοὺς ὁ Ἰησοῦς, καὶ ἐθαμβοῦντο, ⸂οἱ δὲ⸃ ἀκολουθοῦντες ἐφοβοῦντο. καὶ παραλαβὼν πάλιν τοὺς δώδεκα ἤρξατο αὐτοῖς λέγειν τὰ μέλλοντα αὐτῷ συμβαίνειν
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/032.yaml
  text: They were on the road[a], going up to Jerusalem, and Jesus was going ahead of them; and they were astonished, while those who were following were afraid. And taking the Twelve aside again[b], he began to tell them the things that were about to happen to him.
translation:
  language: vi
  text: Họ đang trên đường[a], đi lên Giê-ru-sa-lem, và Giê-su đi trước họ. Họ kinh ngạc, còn những người theo sau thì sợ hãi. Người lại đem riêng Nhóm Mười Hai theo[b] và bắt đầu nói cho họ biết những điều sắp xảy đến với Người.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “trên đường đi”.
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “Người lại đem Nhóm Mười Hai theo mình.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τῇ ὁδῷ
  choice: trên đường
  rationale: Cách nói tự nhiên trong tiếng Việt, vừa giữ bối cảnh hành trình cụ thể vừa có thể mang sắc thái “trên đường đi”.
- source_word: ἀναβαίνοντες εἰς Ἱεροσόλυμα
  choice: đi lên Giê-ru-sa-lem
  rationale: Giữ hình ảnh đi lên do địa thế và ngôn ngữ hành hương, đồng thời tự nhiên trong văn phong Kinh Thánh tiếng Việt.
- source_word: προάγων αὐτούς
  choice: đi trước họ
  rationale: Diễn đạt trực tiếp vị trí của Đức Chúa Jêsus ở phía trước đoàn người mà không diễn giải thêm rằng Ngài đang dẫn dắt.
- source_word: ἐθαμβοῦντο
  choice: kinh ngạc
  rationale: Thể hiện trạng thái sửng sốt mạnh nhưng không đẩy nghĩa sang kinh hoàng; phân biệt với nỗi sợ ở mệnh đề kế tiếp.
- source_word: οἱ δὲ ἀκολουθοῦντες
  choice: những người theo sau
  rationale: Giữ kết cấu phân từ và không xác định quá mức họ là ai; trong ngữ cảnh cũng làm rõ họ đang đi phía sau.
- source_word: ἐφοβοῦντο
  choice: sợ hãi
  rationale: Chuyển tải thẳng trạng thái sợ hãi kéo dài trong diễn tiến câu chuyện.
- source_word: παραλαβὼν ... τοὺς δώδεκα
  choice: đem riêng mười hai sứ đồ theo mình
  rationale: Kết hợp ý tiếp nhận/đem theo của παραλαμβάνω với hàm ý tách riêng trong ngữ cảnh, nhưng chú thích bảo lưu cách dịch sát hơn.
- source_word: πάλιν
  choice: lại
  rationale: Tự nhiên trong tiếng Việt và giữ ý hành động được lặp lại.
- source_word: ἤρξατο ... λέγειν
  choice: bắt đầu nói cho họ biết
  rationale: Giữ lực khởi đầu của động từ và diễn đạt tự nhiên khi theo sau là nội dung được báo trước.
- source_word: τὰ μέλλοντα αὐτῷ συμβαίνειν
  choice: những điều sắp xảy đến với Ngài
  rationale: Giữ tính cận kề của các biến cố mà không thêm ý tiền định mạnh hơn cấu trúc Hy Lạp.
theological_decisions:
- issue: Sự phân biệt cảm xúc giữa các nhóm trong trình thuật
  choice: Dịch ἐθαμβοῦντο là “kinh ngạc” và ἐφοβοῦντο là “sợ hãi”.
  alternative: Gộp cả hai thành những biểu hiện chung của kinh ngạc hoặc sợ hãi.
  rationale: Hai động từ Hy Lạp khác nhau tạo nên sự phân biệt và căng thẳng trong trình thuật; bản dịch không đồng nhất hóa hai phản ứng.
- issue: Nhận diện “mười hai”
  choice: Dùng “mười hai sứ đồ”.
  alternative: Dịch sát hình thức là “Nhóm Mười Hai” hoặc “mười hai người”.
  rationale: Trong tiếng Việt phổ thông, “mười hai sứ đồ” nhận diện rõ nhóm đã được thiết lập trong ngữ cảnh Mác; không hàm ý có thêm người ngoài nhóm.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Chúa Jêsus/Ngài” theo lối xưng gọi tôn kính; ngắt câu để tránh một câu ghép quá dài trong tiếng Việt. Mọi chú thích đều có ký hiệu tương ứng trong chính văn.
