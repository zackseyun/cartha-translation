  to: Khi nghe điều ấy, mười người bắt đầu bất bình với Gia-cơ và Giăng.[a]
  rationale: Sửa “mười người kia” thành “mười người” để không đưa vào chính văn sự phân biệt chỉ được suy ra từ ngữ cảnh. Sửa “chuyện ấy” thành “điều ấy” để có giọng văn trung tính hơn. Giữ “bất bình với” và chú thích từ vựng để bảo tồn tính mơ hồ hợp lệ của περί.
