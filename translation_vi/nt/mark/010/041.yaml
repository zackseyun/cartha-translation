review_pass:
  verdict: revise
  source_fidelity: Bản dịch phản ánh đúng phân từ thời gian ἀκούσαντες, sắc thái khởi phát của ἤρξαντο, và sự bất bình/indignation của ἀγανακτεῖν. Tuy nhiên, “mười người kia” thêm yếu tố đối chiếu (“other/those”) không có trong οἱ δέκα; ngữ cảnh có thể gợi mười người còn lại, nhưng chính văn Hy Lạp chỉ nói “mười người.”
  naturalness: “Khi nghe điều ấy, mười người bắt đầu bất bình với Gia-cơ và Giăng” là tiếng Việt hiện đại, rõ ràng và có văn phong trang trọng vừa phải. “Điều ấy” trung tính và phù hợp văn phong tường thuật hơn “chuyện ấy.”
  terminology: “Gia-cơ” và “Giăng” là các dạng tên Kinh Thánh Việt ngữ quen thuộc. “Bất bình với” diễn đạt tự nhiên sự khó chịu có phán xét; chú thích cần giữ các khả năng “về” và “vì,” vì περί vẫn có thể nêu đối tượng hoặc nguyên cớ.
  issues:
  - severity: medium
    issue: “mười người kia” vượt quá cách diễn đạt của nguyên văn.
    rationale: οἱ δέκα nghĩa là “mười người/the ten.” Dù văn cảnh xác định họ là mười người khác với Gia-cơ và Giăng, từ “kia” thêm một nét chỉ xuất/đối chiếu không được nói rõ trong câu Hy Lạp.
  - severity: low
    issue: “chuyện ấy” hơi khẩu ngữ và cụ thể hóa hơn cần thiết.
    rationale: Tân ngữ của “nghe” được ngầm hiểu từ văn cảnh. “Điều ấy” giữ tính trung tính của đại từ được cung cấp trong bản dịch và hợp văn phong Kinh Thánh hiện đại.
  revised_text: Khi nghe điều ấy, mười người bắt đầu bất bình với Gia-cơ và Giăng.[a]
