  text: Καὶ ἀκούσαντες οἱ δέκα ἤρξαντο ἀγανακτεῖν περὶ Ἰακώβου καὶ Ἰωάννου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/041.yaml
  text: And when the ten heard it[a], they began to be indignant with James and John.
translation:
  language: vi
  text: Khi nghe điều ấy, mười người bắt đầu bất bình với Gia-cơ và Giăng.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “bất bình về Gia-cơ và Giăng” hoặc “bất bình vì Gia-cơ và Giăng.” Giới từ Hy Lạp có thể chỉ đối tượng hoặc nguyên cớ của sự bất bình.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: Khi
  rationale: Liên từ καί nối tiếp mạch kể; trong tiếng Việt, quan hệ với phân từ ἀκούσαντες được diễn đạt tự nhiên bằng mệnh đề thời gian “Khi…”, không cần thêm “và” ở đầu câu.
- source_word: ἀκούσαντες
  choice: Khi nghe chuyện ấy
  rationale: Phân từ aorist chỉ hành động xảy ra trước phản ứng chính. “Chuyện ấy” bổ sung đối tượng được ngầm hiểu từ văn cảnh và tự nhiên hơn “nghe điều đó” trong tiếng Việt.
- source_word: οἱ δέκα
  choice: mười người kia
  rationale: Nguyên văn là “mười người”; từ “kia” làm rõ đây là mười người ngoài Gia-cơ và Giăng mà không thêm danh xưng “môn đồ” vốn không có trong câu Hy Lạp.
- source_word: ἤρξαντο
  choice: bắt đầu
  rationale: Giữ nguyên sắc thái khởi phát của ἄρχομαι đi với động từ nguyên mẫu.
- source_word: ἀγανακτεῖν
  choice: bất bình
  rationale: “Bất bình” diễn đạt sự khó chịu mạnh, có sắc thái cho rằng điều kia không đúng hoặc không chính đáng, phù hợp với ἀγανακτέω hơn từ chung chung như “buồn” hay “khó chịu”.
- source_word: περὶ Ἰακώβου καὶ Ἰωάννου
  choice: với Gia-cơ và Giăng
  rationale: Trong ngữ cảnh cảm xúc, περί có thể chỉ đối tượng hoặc nguyên cớ của sự bất bình. “Bất bình với” là cách nói tự nhiên và giữ Gia-cơ cùng Giăng là đối tượng trực tiếp, còn cách hiểu theo nguyên cớ được ghi ở chú thích.
- source_word: Ἰακώβου
  choice: Gia-cơ
  rationale: Dùng dạng tên gọi Kinh Thánh quen thuộc trong tiếng Việt cho Ἰάκωβος.
- source_word: Ἰωάννου
  choice: Giăng
  rationale: Dùng dạng tên gọi Kinh Thánh quen thuộc trong tiếng Việt cho Ἰωάννης.
theological_decisions:
- issue: Đối tượng hay nguyên cớ của sự bất bình trong περί
  choice: “bất bình với Gia-cơ và Giăng” trong chính văn
  alternative: “bất bình về/chính vì Gia-cơ và Giăng”
  rationale: Cấu trúc Hy Lạp cho phép περί chỉ đối tượng hoặc nguyên cớ của cảm xúc. Chính văn chọn cách diễn đạt tự nhiên theo văn cảnh nhưng chú thích bảo tồn khả năng còn lại; không có chủ trương thần học riêng được áp đặt.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “bất bình” để giữ cường độ cảm xúc; dùng các tên quen thuộc “Gia-cơ” và “Giăng”. Dấu chú thích đặt ngay sau toàn câu vì chú thích giải thích cụm cuối câu.
