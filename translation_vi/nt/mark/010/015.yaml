  text: ἀμὴν λέγω ὑμῖν, ὃς ⸀ἂν μὴ δέξηται τὴν βασιλείαν τοῦ θεοῦ ὡς παιδίον, οὐ μὴ εἰσέλθῃ εἰς αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/015.yaml
  text: Truly I say to you[a], whoever does not receive the kingdom of God like a child will certainly not enter it.
translation:
  language: vi
  text: 'Quả thật, tôi nói với anh em: Ai không đón nhận vương quốc Đức Chúa Trời như trẻ nhỏ[a] thì nhất định sẽ không vào đó.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cụm từ này có thể nói đến sự khiêm nhường, tin cậy hoặc lệ thuộc như trẻ nhỏ, nhưng tiếng Hy Lạp không xác định sắc thái nào.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν
  choice: Quả thật
  rationale: Diễn đạt tự nhiên lời mở đầu trang trọng, đầy thẩm quyền; nguyên văn chỉ có một ἀμήν.
- source_word: λέγω ὑμῖν
  choice: tôi nói với anh em
  rationale: Chuyển sát cấu trúc động từ cùng đại từ số nhiều, đồng thời giữ giọng trực tiếp, trang trọng và dễ hiểu.
- source_word: ὃς ἂν
  choice: Ai
  rationale: Đại từ quan hệ đi với ἄν mang ý khái quát, không xác định; “Ai” truyền đạt tự nhiên nghĩa “bất cứ người nào” trong tiếng Việt.
- source_word: μὴ δέξηται
  choice: không đón nhận
  rationale: δέχομαι có thể là nhận, chấp nhận hoặc đón nhận. “Đón nhận” giữ được ý tiếp nhận thay vì tự mình đạt lấy.
- source_word: βασιλείαν τοῦ θεοῦ
  choice: vương quốc Đức Chúa Trời
  rationale: Cách diễn đạt quen thuộc, bảo lưu cả ý quyền trị vì lẫn lãnh vực cai trị mà không thu hẹp vào một phương diện.
- source_word: ὡς παιδίον
  choice: như một đứa trẻ
  rationale: Giữ nguyên phép so sánh của ὡς và nghĩa thông thường của παιδίον, không tự thêm một phẩm chất cụ thể của trẻ nhỏ.
- source_word: οὐ μὴ εἰσέλθῃ
  choice: nhất định sẽ không vào
  rationale: Cấu trúc οὐ μή với động từ ở thể giả định aorist là lời phủ định mạnh; “nhất định sẽ không” truyền đạt sự nhấn mạnh mà không dùng lối văn cổ.
- source_word: εἰς αὐτήν
  choice: vào đó
  rationale: Đại từ chỉ trở lại “vương quốc”; “vào đó” tự nhiên trong tiếng Việt và giữ rõ ý chuyển động vào trong.
theological_decisions:
- issue: Ý nghĩa của việc đón nhận vương quốc Đức Chúa Trời “như một đứa trẻ”
  choice: Giữ nguyên phép so sánh, không xác định phẩm chất nào của trẻ nhỏ được nhấn mạnh.
  alternative: Diễn giải là đón nhận với lòng khiêm nhường, tin cậy hoặc lệ thuộc như trẻ nhỏ.
  rationale: Tiếng Hy Lạp nêu phép so sánh nhưng không giải thích chính xác phương diện nào của trẻ nhỏ được nói đến. Bản dịch giữ sự rộng mở này để không áp đặt một truyền thống giải nghĩa cụ thể.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh em” cho đại từ số nhiều ὑμῖν trong lời nói trực tiếp; tránh lối diễn đạt cổ. Dấu chú thích [a] được đặt ngay sau cụm từ mà chú thích giải thích.
