  text: καὶ στὰς ὁ Ἰησοῦς εἶπεν· ⸂Φωνήσατε αὐτόν⸃. καὶ φωνοῦσι τὸν τυφλὸν λέγοντες αὐτῷ· Θάρσει, ⸀ἔγειρε, φωνεῖ σε.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/049.yaml
  text: And Jesus stopped and said[a], “Call him.” And they called the blind man, saying to him, “Take courage; get up[b], he is calling you.”
translation:
  language: vi
  text: 'Đức Giê-su dừng lại và nói: “Hãy gọi anh ấy đến.” Họ gọi người mù và nói với anh: “Hãy vững lòng! Đứng dậy đi, Người đang gọi anh.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: στὰς
  choice: dừng lại
  rationale: Phân từ của ἵστημι theo nghĩa đen là “đã đứng lại”, nhưng trong mạch kể diễn tả Đức Giê-su ngừng bước; “dừng lại” tự nhiên và chính xác trong tiếng Việt.
- source_word: Φωνήσατε αὐτόν
  choice: Hãy gọi anh ấy đến
  rationale: φωνέω ở đây mang nghĩa gọi một người đến. Thêm “đến” làm rõ ý triệu gọi trong tiếng Việt mà không làm thay đổi nội dung.
- source_word: φωνοῦσι
  choice: họ gọi
  rationale: Giữ sự lặp lại của động từ φωνέω, nối trực tiếp hành động của đám đông với mệnh lệnh của Đức Giê-su.
- source_word: τὸν τυφλὸν
  choice: người mù
  rationale: Tính từ τυφλός được dùng như danh từ; “người mù” là cách diễn đạt tự nhiên, tôn trọng và phù hợp ngữ cảnh.
- source_word: Θάρσει
  choice: Hãy vững lòng!
  rationale: Mệnh lệnh này khích lệ và trấn an. “Hãy vững lòng” truyền đạt sắc thái can đảm, an tâm bằng lối nói trang trọng nhưng dễ hiểu.
- source_word: ἔγειρε
  choice: Đứng dậy đi
  rationale: Mệnh lệnh ἔγειρε yêu cầu người ấy trỗi dậy; “đứng dậy đi” tự nhiên trong lời nói trực tiếp và phù hợp với hành động kế tiếp.
- source_word: φωνεῖ σε
  choice: Người đang gọi anh
  rationale: Thì hiện tại diễn tả lời gọi đang có hiệu lực ngay lúc ấy. Đại từ “Người” giúp quy chiếu kính trọng đến Đức Giê-su trong văn phong Việt mà không thêm một danh hiệu thần học.
theological_decisions: []
translation_notes:
  register: Bản dịch dùng tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Duy trì chuỗi lặp “gọi… gọi… đang gọi” của nguyên văn. Dùng “anh” theo giới tính và ngữ cảnh của nhân vật, đồng thời dùng “Người” để chỉ Đức Giê-su theo quy ước kính trọng phổ biến.
