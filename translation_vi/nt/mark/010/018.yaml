    rationale: Hy Lạp đặt “một” rồi xác định Đấng ấy là “Đức Chúa Trời.” Dùng gạch ngang trong tiếng Việt giúp giữ sự nhấn mạnh và tạo câu tự nhiên hơn, không thay đổi ý nghĩa.
