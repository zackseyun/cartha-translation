  text: ὁ δὲ Ἰησοῦς εἶπεν αὐτῷ· Τί με λέγεις ἀγαθόν; οὐδεὶς ἀγαθὸς εἰ μὴ εἷς ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/018.yaml
  text: But Jesus said to him[a], “Why do you call me good? No one is good except one—God.”
translation:
  language: vi
  text: 'Nhưng Đức Giê-su nói với anh: “Sao anh gọi tôi là tốt? Không ai là tốt, ngoại trừ một Đấng—Đức Chúa Trời.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: Nhưng
  rationale: Đánh dấu nhẹ sự chuyển ý trong lời đáp của Đức Giê-su; “Còn” cũng có thể dùng, nhưng “Nhưng” diễn đạt rõ nét tương phản với lời xưng hô trước đó.
- source_word: εἶπεν αὐτῷ
  choice: nói với anh
  rationale: Cách chuyển ngữ trực tiếp, tự nhiên của động từ λέγω kèm tân ngữ gián tiếp; “anh” theo ngữ cảnh chỉ người đàn ông vừa đến hỏi Đức Giê-su.
- source_word: Τί
  choice: Sao
  rationale: Trong cấu trúc này, τί mang chức năng hỏi lý do. “Sao” tự nhiên trong tiếng Việt và vẫn giữ được sắc thái chất vấn cô đọng.
- source_word: με λέγεις ἀγαθόν
  choice: anh gọi tôi là tốt
  rationale: Giữ trực tiếp cấu trúc tân ngữ cùng bổ ngữ vị ngữ và không thêm cách diễn giải về ý nghĩa thần học.
- source_word: ἀγαθόν / ἀγαθὸς
  choice: tốt
  rationale: Dùng cùng một từ ở cả hai lần để bảo toàn sự lặp từ và sức nặng tu từ của nguyên văn; không thêm nghĩa thuần đạo đức vốn không được nói rõ.
- source_word: οὐδεὶς
  choice: Không ai
  rationale: Cách diễn đạt phổ thông, tự nhiên, giữ nguyên ý phủ định toàn thể.
- source_word: εἰ μὴ εἷς
  choice: ngoại trừ một Đấng
  rationale: Thể hiện cấu trúc ngoại trừ và sự nhấn mạnh vào duy nhất một vị; “Đấng” phù hợp vì ngay sau đó vị ấy được xác định là Đức Chúa Trời.
- source_word: ὁ θεός
  choice: Đức Chúa Trời
  rationale: Danh xưng trang trọng, rõ nghĩa và thông dụng trong tiếng Việt hiện đại; mạo từ Hy Lạp không cần được chuyển riêng.
theological_decisions:
- issue: Hàm ý Cơ Đốc luận trong lời Đức Giê-su nói về sự tốt lành
  choice: Chuyển ngữ phát biểu một cách trực tiếp, không thêm từ ngữ khiến câu thành lời phủ nhận thần tính của Đức Giê-su hoặc lời công khai khẳng định thần tính ấy.
  alternative: Diễn đạt theo hướng Đức Giê-su phủ nhận mình là Đức Chúa Trời, hoặc theo hướng Ngài trực tiếp tuyên bố mình là Đức Chúa Trời.
  rationale: Nguyên văn đặt ra một lời chất vấn và chỉ xác nhận Đức Chúa Trời là Đấng tốt; bản dịch cần giữ nguyên sức căng thần học thay vì giải quyết nó bằng cách thêm lời diễn giải.
translation_notes:
  register: Văn phong hiện đại, trang trọng nhưng dễ hiểu. Đại từ “anh” phù hợp với người đàn ông trong ngữ cảnh. Không đặt chú thích vì tiếng Việt “Sao anh gọi tôi là tốt?” vừa tự nhiên vừa phản ánh chức năng của τί trong thành ngữ; phương án sát chữ kiểu “Anh gọi tôi là tốt để làm gì?” dễ tạo sắc thái mục đích không cần thiết.
