- from: 'Họ thưa với Ngài: “Chúng con làm được.”[a] Nhưng Đức Giê-su nói với họ: “Chén Ta uống, các con sẽ uống; và phép báp-têm Ta chịu, các con cũng sẽ chịu.”[b]'
