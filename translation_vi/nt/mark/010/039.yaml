id: MRK.10.39
reference: Mark 10:39
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οἱ δὲ εἶπαν αὐτῷ· Δυνάμεθα. ὁ δὲ Ἰησοῦς εἶπεν αὐτοῖς· ⸀Τὸ ποτήριον ὃ ἐγὼ πίνω πίεσθε καὶ τὸ βάπτισμα ὃ ἐγὼ βαπτίζομαι βαπτισθήσεσθε,
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/039.yaml
  text: And they said to him[a], “We are able.” But Jesus said to them, “The cup that I drink, you will drink; and the baptism with which I am baptized[b], you will be baptized,”
translation:
  language: vi
  text: 'Họ thưa với Ngài: “Chúng con làm được.”[a] Nhưng Đức Giê-su nói với họ: “Chén Ta uống, các con sẽ uống; và phép báp-têm mà Ta chịu, các con sẽ chịu phép báp-têm ấy.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Chúng con có thể.”'
    reason: lexical_alternative
  - marker: b
    text: “Chén” và “phép báp-têm” là những hình ảnh chỉ về đau khổ và số phận Đức Giê-su sắp trải qua, là điều các môn đồ Ngài cũng sẽ dự phần.
    reason: cross_reference
lexical_decisions:
- source_word: Δυνάμεθα
  choice: Chúng con làm được
  rationale: Đây là cách đáp tự nhiên trong tiếng Việt cho lời khẳng định về khả năng; vẫn giữ được sắc thái quả quyết của động từ δύναμαι. Dạng “Chúng con có thể” được ghi ở chú thích như một cách dịch sát cấu trúc hơn.
- source_word: ποτήριον
  choice: chén
  rationale: Giữ nguyên hình ảnh ẩn dụ trong nguyên văn về phần số hay trải nghiệm được định, thay vì diễn giải trực tiếp thành đau khổ hoặc cái chết.
- source_word: πίνω / πίεσθε
  choice: Ta uống / các con sẽ uống
  rationale: Giữ sự song hành giữa hiện tại và tương lai, đồng thời bảo toàn ẩn dụ uống chén.
- source_word: βάπτισμα
  choice: phép báp-têm
  rationale: Dùng thuật ngữ quen thuộc trong tiếng Việt và giữ nguyên hình ảnh ẩn dụ của nguyên văn; ngữ cảnh cho thấy đây không chủ yếu nói về nghi lễ dùng nước.
- source_word: βαπτίζομαι / βαπτισθήσεσθε
  choice: Ta chịu / các con cũng sẽ chịu
  rationale: Trong tiếng Việt, “chịu phép báp-têm” diễn đạt tự nhiên một trải nghiệm được nhận hoặc phải trải qua. Cách dịch này giữ danh từ “phép báp-têm” và sự song hành của hai mệnh đề mà không biến câu thành lời giải nghĩa.
- source_word: ὁ δὲ Ἰησοῦς εἶπεν αὐτοῖς
  choice: Nhưng Đức Giê-su nói với họ
  rationale: Dịch δέ là “Nhưng” để thể hiện sự tương phản nhẹ giữa lời quả quyết của họ và lời đáp của Đức Giê-su.
theological_decisions:
- issue: Ẩn dụ về chén và phép báp-têm
  choice: Giữ cả hai ẩn dụ trong chính văn, đồng thời giải thích ngắn gọn trong chú thích rằng chúng chỉ về đau khổ và phần số Đức Giê-su sắp trải qua.
  alternative: Thay trực tiếp các hình ảnh bằng “đau khổ”, “cái chết” hoặc “tuẫn đạo”.
  rationale: Nguyên văn cố ý dùng hai hình ảnh giàu liên tưởng Kinh Thánh. Giữ chúng tránh thu hẹp ý nghĩa và bảo toàn sức căng thần học của lời Đức Giê-su.
- issue: Mối liên hệ với nghi lễ báp-têm
  choice: Dịch βάπτισμα là “phép báp-têm”, nhưng để ngữ cảnh và chú thích cho thấy từ này được dùng theo nghĩa ẩn dụ.
  alternative: Dịch là “sự nhấn chìm”, “thử thách” hoặc “hoạn nạn” để loại bỏ cách hiểu nghi lễ.
  rationale: “Phép báp-têm” phản ánh trực tiếp từ ngữ Hy Lạp và giữ liên tưởng của hình ảnh; tuy nhiên, câu này không nên bị diễn giải trong chính văn thành một tuyên bố riêng về bí tích hay nghi lễ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Thưa” cùng cặp đại từ “Ngài/chúng con” thể hiện thái độ của các môn đồ đối với Đức Giê-su; trong lời Đức Giê-su, “Ta/các con” tạo giọng dạy bảo trang nghiêm. Giữ nhịp song hành của hai mệnh đề Hy Lạp.
