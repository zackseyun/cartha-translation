  source_fidelity: 'Bản nháp giữ đúng cấu trúc đối đáp, thì hiện tại/tương lai của “uống,” và hai hình ảnh “chén” तथा “báp-têm.” Tuy nhiên, vế thứ hai làm mờ sự lặp lại có chủ ý của động từ βαπτίζομαι / βαπτισθήσεσθε: nguyên văn nói Đức Giê-su đang/chịu báp-têm và các môn đồ sẽ chịu báp-têm. Nên nêu lại “phép báp-têm” ở vế các môn đồ để bảo toàn sự song hành và tránh để “chịu” đứng một mình.'
