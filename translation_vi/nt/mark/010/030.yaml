  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐὰν μὴ λάβῃ ἑκατονταπλασίονα νῦν ἐν τῷ καιρῷ τούτῳ οἰκίας καὶ ἀδελφοὺς καὶ ἀδελφὰς καὶ ⸀μητέρας καὶ τέκνα καὶ ἀγροὺς μετὰ διωγμῶν, καὶ ἐν τῷ αἰῶνι τῷ ἐρχομένῳ ζωὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/030.yaml
  text: who will not receive a hundredfold now in this time—houses and brothers and sisters and mothers and children and fields[a], with persecutions—and in the age to come[b], eternal life.
translation:
  language: vi
  text: 'mà không nhận được gấp trăm lần ngay trong thời này: nhà cửa, anh em trai, chị em gái, mẹ, con cái và ruộng đất—cùng với sự bắt bớ—và trong thời đại sắp đến[a], sự sống đời đời.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “trong thời đại đang đến.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: λάβῃ
  choice: nhận được
  rationale: Trong ngữ cảnh lời hứa về sự đền đáp, “nhận được” diễn đạt điều được ban cho, thay vì hành động tự mình chiếm lấy.
- source_word: ἑκατονταπλασίονα
  choice: gấp trăm lần
  rationale: Diễn đạt tự nhiên trong tiếng Việt hiện đại và giữ nguyên sức nặng định lượng của từ Hy Lạp.
- source_word: νῦν ἐν τῷ καιρῷ τούτῳ
  choice: ngay bây giờ, trong thời này
  rationale: Giữ cả ý hiện tại của νῦν lẫn sự tương phản giữa thời hiện tại và thời đại sắp đến.
- source_word: οἰκίας
  choice: nhà cửa
  rationale: Tương đương cụ thể, tự nhiên và giữ ý số nhiều.
- source_word: ἀδελφοὺς καὶ ἀδελφὰς
  choice: anh em trai, chị em gái
  rationale: Giữ sự phân biệt nam và nữ được nêu riêng trong nguyên bản; “anh em trai” tránh việc “anh em” bị hiểu theo nghĩa bao quát.
- source_word: μητέρας
  choice: mẹ
  rationale: Danh từ tiếng Việt thường không biến đổi theo số; trong chuỗi liệt kê này, “mẹ” có thể mang ý số nhiều theo ngữ cảnh mà không cần thêm “những” một cách gượng ép.
- source_word: τέκνα
  choice: con cái
  rationale: Bao quát cả con trai lẫn con gái, phù hợp với nghĩa rộng của τέκνα.
- source_word: ἀγρούς
  choice: ruộng đất
  rationale: Diễn đạt tự nhiên các thửa đất canh tác, cụ thể hơn “đất đai” và rộng hơn chỉ “ruộng”.
- source_word: μετὰ διωγμῶν
  choice: cùng với sự bắt bớ
  rationale: Giữ rõ nét căng thẳng rằng phước lành trong hiện tại đi kèm sự bách hại, không loại trừ đau khổ.
- source_word: ἐν τῷ αἰῶνι τῷ ἐρχομένῳ
  choice: trong thời đại sắp đến
  rationale: αἰών chỉ một thời đại; cách dịch này giữ sự tương phản cánh chung với “thời này” và tránh hiểu thành thế giới vật chất.
- source_word: ζωὴν αἰώνιον
  choice: sự sống đời đời
  rationale: Cách diễn đạt quen thuộc, chính xác cho thành ngữ cánh chung này, bao hàm cả phẩm chất lẫn tính trường tồn của sự sống.
theological_decisions:
- issue: Bản chất của sự đền đáp được hứa trong thời hiện tại
  choice: Giữ nguyên danh sách cụ thể về nhà cửa, các mối quan hệ gia đình và ruộng đất, đồng thời nêu rõ “cùng với sự bắt bớ”.
  alternative: Giải thích toàn bộ thành phước lành thuần túy thuộc linh, hoặc biến lời hứa thành sự thịnh vượng vật chất không kèm đau khổ.
  rationale: Nguyên bản đặt sự đền đáp dồi dào và sự bắt bớ cạnh nhau; bản dịch không nên giải quyết nét căng thẳng ấy theo một cực thần học.
- issue: Cách thể hiện các từ chỉ anh chị em theo giới tính
  choice: Dịch riêng ἀδελφοὺς và ἀδελφὰς là “anh em trai, chị em gái”.
  alternative: Gộp thành “anh chị em” hoặc dùng “anh em” theo nghĩa bao quát.
  rationale: Nguyên bản chủ ý nêu riêng hai nhóm, nên bản dịch giữ sự phân biệt đó.
- issue: Quan hệ cú pháp của “gấp trăm lần” với danh sách theo sau
  choice: Để “gấp trăm lần” đứng trước toàn bộ danh sách và dùng dấu hai chấm để cho thấy danh sách nêu những gì được nhận.
  alternative: Lặp lại “gấp trăm lần” với từng danh từ hoặc gắn riêng cụm này với “ruộng đất”.
  rationale: Cấu trúc Hy Lạp cho phép hiểu ἑκατονταπλασίονα chi phối toàn bộ chuỗi bổ ngữ; dấu câu làm rõ mà không thêm một cách diễn giải giáo lý.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại, phù hợp văn bản Kinh Thánh phổ thông. Dấu hai chấm giới thiệu danh sách; gạch ngang làm nổi bật cụm “cùng với sự bắt bớ” mà không làm suy yếu sự gắn kết cú pháp. Mạo từ và số nhiều được thể hiện theo cách tự nhiên của tiếng Việt, tránh lạm dụng “những/các”.
