source:
  edition: SBLGNT
  text: ⸂ὁ δὲ⸃ Ἰησοῦς εἶπεν αὐτοῖς· Πρὸς τὴν σκληροκαρδίαν ὑμῶν ἔγραψεν ὑμῖν τὴν ἐντολὴν ταύτην·
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/005.yaml
  text: But Jesus said to them[c][b][a], “Because of your hardness of heart he wrote this commandment for you.”
translation:
  language: vi
  text: 'Nhưng Giê-su nói với họ: “Vì lòng các ông chai cứng nên Môi-se đã viết điều răn này cho các ông.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: Nhưng
  rationale: Thể hiện sự tương phản nhẹ khi Đức Chúa Jêsus đáp lại việc họ viện dẫn Môi-se.
- source_word: Πρὸς
  choice: Vì ... nên
  rationale: Trong cấu trúc này, πρός với đối cách diễn tả nguyên do hoặc hoàn cảnh dẫn đến việc ban hành điều răn; cấu trúc “vì... nên” tự nhiên trong tiếng Việt.
- source_word: σκληροκαρδίαν
  choice: lòng ... chai cứng
  rationale: Giữ hình ảnh về tấm lòng trong từ ghép Hy Lạp, đồng thời diễn đạt tự nhiên sự ngoan cố, không chịu vâng phục.
- source_word: ἔγραψεν
  choice: ông ấy đã viết
  rationale: Chủ ngữ số ít được hàm ý trong tiếng Hy Lạp và quy chiếu về Môi-se ở câu trước; không đưa tên Môi-se vào chính văn.
- source_word: ἐντολὴν
  choice: điều răn
  rationale: Phù hợp sắc thái mệnh lệnh có thẩm quyền trong bối cảnh luật pháp Môi-se.
- source_word: ταύτην
  choice: này
  rationale: Chỉ đúng quy định cụ thể đang được bàn đến.
theological_decisions:
- issue: Có nêu rõ Môi-se là chủ thể của động từ “viết” hay không
  choice: Giữ cách quy chiếu bằng “ông ấy” và giải thích trong chú thích
  alternative: “Môi-se đã viết”
  rationale: Bản Hy Lạp không lặp lại tên Môi-se trong câu này. Cách chọn giữ mạch quy chiếu của nguyên văn mà vẫn giúp độc giả nhận diện chủ thể qua chú thích.
- issue: Cách chuyển tải σκληροκαρδία mà không làm giảm sức nặng của hình ảnh Kinh Thánh
  choice: “lòng ... chai cứng”
  alternative: “sự cứng lòng” hoặc “tính ngoan cố”
  rationale: Giữ hình ảnh đạo đức và nội tâm của nguyên ngữ, nhưng không diễn giải thêm theo một hệ phái hay lập trường thần học riêng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “các ông” để phù hợp lời Đức Chúa Jêsus nói trực tiếp với nhóm người nam trong ngữ cảnh; giữ “điều răn” cho sắc thái luật pháp. Chỉ dùng một chú thích cần thiết để làm rõ chủ thể hàm ý.
