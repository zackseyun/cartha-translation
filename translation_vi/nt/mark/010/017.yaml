  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Καὶ ἐκπορευομένου αὐτοῦ εἰς ὁδὸν προσδραμὼν εἷς καὶ γονυπετήσας αὐτὸν ἐπηρώτα αὐτόν· Διδάσκαλε ἀγαθέ, τί ποιήσω ἵνα ζωὴν αἰώνιον κληρονομήσω;
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/017.yaml
  text: And as he was going out onto the road[a], one man ran up and knelt before him and asked him, “Good Teacher, what must I do so that I may inherit eternal life?”
translation:
  language: vi
  text: 'Khi Đức Giê-su đang đi ra đường[a], một người chạy đến, quỳ xuống trước mặt Ngài và hỏi: “Thưa Thầy nhân lành, tôi phải làm gì để được thừa hưởng sự sống đời đời?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đang bắt đầu lên đường.” Cụm từ Hy Lạp có thể nói đến việc đi ra đường hoặc bắt đầu một hành trình.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκπορευομένου αὐτοῦ εἰς ὁδόν
  choice: Khi Đức Giê-su đang đi ra đường
  rationale: Kết cấu sở hữu cách tuyệt đối nêu hành động làm bối cảnh, diễn ra đồng thời với hành động chính. Cách dịch giữ hình ảnh chuyển động ra đường, đồng thời chú thích nghĩa khả dĩ là bắt đầu lên đường.
- source_word: προσδραμὼν
  choice: chạy đến
  rationale: Phân từ aorist diễn tả việc người ấy nhanh chóng tiến lại gần, giữ được tính sống động và khẩn trương của cảnh.
- source_word: εἷς
  choice: một người
  rationale: Tính từ số đếm được dùng như danh từ để giới thiệu một cá nhân. Tiếng Việt tự nhiên dùng “một người”; giới tính nam không cần được gượng ép biểu thị bằng “một người đàn ông” ngay trong câu này.
- source_word: γονυπετήσας αὐτόν
  choice: quỳ xuống trước mặt Ngài
  rationale: Động từ chỉ tư thế quỳ trước một người, biểu thị sự kính trọng hoặc khẩn cầu; “quỳ xuống” truyền đạt rõ hành động.
- source_word: ἐπηρώτα αὐτόν
  choice: hỏi
  rationale: Thì chưa hoàn thành có thể gợi hành động đang diễn ra, nhưng trong mạch kể tiếng Việt, “hỏi” tự nhiên và không làm mất nội dung.
- source_word: Διδάσκαλε ἀγαθέ
  choice: Thưa Thầy nhân lành
  rationale: “Thầy” tương ứng với διδάσκαλος, còn “nhân lành” giữ tính chất đạo đức của ἀγαθός và mối liên hệ quan trọng với câu trả lời tiếp theo.
- source_word: τί ποιήσω
  choice: tôi phải làm gì
  rationale: Câu hỏi mang tính cân nhắc về hành động cần thực hiện; “phải” diễn đạt tự nhiên lực nghĩa yêu cầu mà không thêm một kết luận thần học.
- source_word: ἵνα
  choice: để
  rationale: “Để” diễn đạt gọn và rõ quan hệ mục đích hoặc kết quả trong tiếng Việt.
- source_word: ζωὴν αἰώνιον
  choice: sự sống đời đời
  rationale: Đây là cách diễn đạt quen thuộc, rõ nghĩa và giữ được cả chiều kích kéo dài lẫn âm hưởng thần học của cụm từ Hy Lạp.
- source_word: κληρονομήσω
  choice: được thừa hưởng
  rationale: Giữ ý nhận phần gia nghiệp của κληρονομέω, thay vì làm phẳng nghĩa thành chỉ “nhận được”; “được” khiến câu tiếng Việt tự nhiên trong cấu trúc này.
theological_decisions:
- issue: Cách dịch lời người ấy xưng hô với Đức Giê-su
  choice: Thưa Thầy nhân lành
  alternative: Thưa Thầy tốt lành
  rationale: διδάσκαλε là “Thầy”, không phải một tước hiệu mạnh hơn như “Chúa”. “Nhân lành” giữ phẩm chất đạo đức của ἀγαθέ và ý nghĩa của từ này đối với lời đáp ở câu kế tiếp.
- issue: Cách biểu thị giới tính của εἷς
  choice: một người
  alternative: một người đàn ông
  rationale: Dạng Hy Lạp là giống đực số ít và ngữ cảnh nói về một người nam, nhưng tiếng Việt dùng “một người” tự nhiên để giới thiệu nhân vật mà không phủ nhận giới tính; việc thêm “đàn ông” sẽ làm câu nặng hơn và nhấn mạnh điều văn bản không đặt trọng tâm.
- issue: Quan hệ giữa hành động và việc thừa hưởng sự sống đời đời
  choice: tôi phải làm gì để được thừa hưởng
  alternative: tôi nên làm gì để thừa hưởng
  rationale: Cách dịch giữ nguyên câu hỏi và tiền giả định của người hỏi, không xác nhận cũng không bác bỏ thần học hàm chứa trong câu hỏi trước khi lời đáp của Đức Giê-su xuất hiện.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Đức Giê-su” để xác định chủ thể vốn được biểu thị bằng đại từ trong mạch văn; dùng “Ngài” làm đại từ kính trọng, không nâng διδάσκαλος thành một tước hiệu không có trong nguyên văn.
