source:
  edition: SBLGNT
  text: ⸀ἐμβλέψας αὐτοῖς ὁ Ἰησοῦς λέγει· Παρὰ ἀνθρώποις ἀδύνατον ἀλλ’ οὐ παρὰ θεῷ, πάντα γὰρ ⸀δυνατὰ παρὰ τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/027.yaml
  text: Jesus looked at them and said, “With men it is impossible, but not with God, because all things are possible with God.”
translation:
  language: vi
  text: 'Đức Giê-su nhìn họ và nói: “Đối với loài người thì điều ấy là không thể, nhưng đối với Đức Chúa Trời thì không; vì đối với Đức Chúa Trời, mọi sự đều có thể.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐμβλέψας αὐτοῖς
  choice: nhìn họ
  rationale: Diễn đạt tự nhiên hành động Đức Giê-su hướng ánh nhìn vào các môn đồ; ngữ cảnh đã đủ nên không cần thêm sắc thái giải nghĩa như “chăm chú”.
- source_word: Παρὰ ἀνθρώποις
  choice: Đối với loài người
  rationale: Giữ cấu trúc tương phản của παρά với phía Đức Chúa Trời, đồng thời dùng cách nói tiếng Việt trang trọng và bao quát con người.
- source_word: ἀδύνατον
  choice: điều ấy là không thể
  rationale: Tính từ trung tính không nêu danh từ được quy chiếu theo câu hỏi cứu rỗi ở văn cảnh trước; “điều ấy” chuyển tải tham chiếu ngầm mà không giải nghĩa quá mức.
- source_word: πάντα γὰρ δυνατὰ
  choice: vì ... mọi sự đều có thể
  rationale: γάρ nêu căn cứ cho mệnh đề trước, nên “vì” phù hợp; πάντα được giữ rộng là “mọi sự” thay vì thu hẹp vào một hành động riêng.
- source_word: παρὰ τῷ θεῷ
  choice: đối với Đức Chúa Trời
  rationale: Duy trì phép đối xứng với “đối với loài người” và sắc thái rằng điều bất khả với con người là khả thi nơi Đức Chúa Trời.
theological_decisions:
- issue: Phạm vi của “mọi sự”
  choice: Giữ nguyên cách nói rộng “mọi sự đều có thể”
  alternative: Diễn giải hẹp thành “Đức Chúa Trời có thể cứu họ”
  rationale: Bản Hy Lạp dùng πάντα mà không giới hạn trực tiếp; văn cảnh soi sáng ý nghĩa nhưng bản dịch không nên thay lời khái quát bằng một diễn giải thần học hẹp hơn.
- issue: Quan hệ logic của γάρ
  choice: Dịch là “vì”
  alternative: “bởi vì” hoặc bỏ liên từ
  rationale: Giữ rõ mệnh đề sau làm căn cứ cho lời khẳng định “nhưng đối với Đức Chúa Trời thì không”.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ sự lặp lại “đối với Đức Chúa Trời” của nguyên văn để bảo toàn nhịp điệu và thế đối lập, thay vì lược bỏ cho gọn.
