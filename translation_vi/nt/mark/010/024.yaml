revisions:
- from: 'Nhưng các môn đồ sửng sốt về những lời ấy của Ngài. Đức Giê-su lại nói với họ[a]: “Các con, thật khó biết bao để vào vương quốc của Đức Chúa Trời!”'
  to: 'Nhưng các môn đồ sửng sốt về lời Ngài. Đức Giê-su lại đáp lời và nói với họ: “Các con, vào vương quốc của Đức Chúa Trời thật khó biết bao[a]!”'
  rationale: Bản sửa giữ cách đọc ngắn của SBLGNT trong chính văn, phục hồi ý «đáp lời», và dùng trật tự câu tiếng Việt tự nhiên hơn mà vẫn duy trì tính cảm thán của πῶς δύσκολόν ἐστιν. Chú thích tiếp tục ghi nhận cách đọc dài, nhưng được viết lại rõ ràng và được neo ngay tại phát biểu mà dị bản tác động.
  reviewer_model: gpt-5.6-terra
