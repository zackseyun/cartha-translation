  text: οἱ δὲ μαθηταὶ ἐθαμβοῦντο ἐπὶ τοῖς λόγοις αὐτοῦ. ὁ δὲ Ἰησοῦς πάλιν ἀποκριθεὶς λέγει αὐτοῖς· Τέκνα, πῶς δύσκολόν ⸀ἐστιν εἰς τὴν βασιλείαν τοῦ θεοῦ εἰσελθεῖν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/024.yaml
  text: But the disciples were astonished at his words. Jesus answered again and said to them[a], “Children, how difficult it is to enter the kingdom of God!”
translation:
  language: vi
  text: 'Nhưng các môn đồ sửng sốt về lời Ngài. Đức Giê-su lại đáp lời và nói với họ: “Các con, vào vương quốc của Đức Chúa Trời thật khó biết bao[a]!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Một số thủ bản chép: “Các con, những người tin cậy nơi của cải vào vương quốc của Đức Chúa Trời thật khó biết bao!”'
    reason: textual_variant
lexical_decisions:
- source_word: ἐθαμβοῦντο
  choice: sửng sốt
  rationale: Thì chưa hoàn thành diễn tả phản ứng đang diễn ra; “sửng sốt” truyền đạt sức mạnh của động từ mà không cường điệu.
- source_word: ἐπὶ τοῖς λόγοις αὐτοῦ
  choice: về những lời ấy của Ngài
  rationale: ἐπί với cách dữ cách chỉ đối tượng hoặc căn cứ của sự sửng sốt; cách dịch này sát nghĩa và tự nhiên trong tiếng Việt.
- source_word: πάλιν
  choice: lại
  rationale: Giữ rõ ý lặp lại hoặc tiếp tục nói.
- source_word: ἀποκριθεὶς λέγει αὐτοῖς
  choice: nói với họ
  rationale: Đây là lối kể chuyện có sắc thái Sê-mít; trong tiếng Việt, dịch gọn là “nói với họ” tự nhiên hơn, còn quan hệ đáp lời được ngữ cảnh thể hiện.
- source_word: Τέκνα
  choice: Các con
  rationale: Cách xưng hô thân tình, trìu mến và tự nhiên trong tiếng Việt, không thêm ý “bé nhỏ” hay giới tính.
- source_word: πῶς δύσκολόν ἐστιν
  choice: thật khó biết bao
  rationale: Giữ sắc thái cảm thán và mức độ nhấn mạnh của πῶς.
- source_word: εἰς τὴν βασιλείαν τοῦ θεοῦ εἰσελθεῖν
  choice: để vào vương quốc của Đức Chúa Trời
  rationale: Diễn đạt trực tiếp nội dung điều khó, rõ ràng và tự nhiên trong tiếng Việt hiện đại.
theological_decisions:
- issue: Có đưa cụm dài “đối với những người tin cậy nơi của cải” vào chính văn hay không
  choice: 'Theo bản văn ngắn của SBLGNT: “thật khó biết bao để vào vương quốc của Đức Chúa Trời”'
  alternative: “Các con, thật khó biết bao cho những người tin cậy nơi của cải để vào vương quốc của Đức Chúa Trời”
  rationale: Bản văn nguồn được cung cấp có cách đọc ngắn. Cách đọc dài thu hẹp phạm vi phát biểu và vì thế tác động đến cách hiểu; nên ghi nhận trong chú thích thay vì đưa vào chính văn.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. “Đức Giê-su” và “Đức Chúa Trời” giữ sắc thái tôn kính; “Các con” truyền đạt lời xưng hô trìu mến. Dấu chú thích [a] đặt sau mệnh đề dẫn để báo rằng dị bản ảnh hưởng đến nội dung lời nói tiếp theo.
