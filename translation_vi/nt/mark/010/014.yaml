id: MRK.10.14
reference: Mark 10:14
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἰδὼν δὲ ὁ Ἰησοῦς ἠγανάκτησεν καὶ εἶπεν αὐτοῖς· Ἄφετε τὰ παιδία ἔρχεσθαι πρός με, μὴ κωλύετε αὐτά, τῶν γὰρ τοιούτων ἐστὶν ἡ βασιλεία τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/014.yaml
  text: But when Jesus saw it[a], he was indignant and said to them, “Let the children come to me; do not hinder them, for the kingdom of God belongs to such as these.”
translation:
  language: vi
  text: 'Nhưng khi thấy vậy, Chúa Giê-su phẫn nộ và nói với họ: “Hãy để các em đến với tôi; đừng ngăn cản các em, vì vương quốc Đức Chúa Trời thuộc về những người như các em này.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay sát nghĩa hơn: “vì vương quốc Đức Chúa Trời là của những người như thế.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν δὲ ὁ Ἰησοῦς
  choice: Nhưng khi thấy vậy, Đức Chúa Jêsus
  rationale: Phân từ bất định quá khứ nêu hoàn cảnh dẫn đến phản ứng của Đức Chúa Jêsus; “vậy” được bổ sung tự nhiên từ ngữ cảnh trước. δὲ mang sắc thái tương phản nhẹ với hành động quở trách của các môn đồ.
- source_word: ἠγανάκτησεν
  choice: bất bình
  rationale: Diễn đạt sự phẫn nộ chính đáng hoặc không hài lòng mạnh mẽ, nhưng không hàm ý mất tự chủ.
- source_word: εἶπεν αὐτοῖς
  choice: phán với họ
  rationale: Công thức dẫn lời được chuyển sang văn phong Kinh Thánh trang trọng, tự nhiên; “họ” chỉ các môn đồ trong ngữ cảnh.
- source_word: Ἄφετε τὰ παιδία ἔρχεσθαι πρός με
  choice: Hãy để trẻ em đến với Ta
  rationale: Ἄφετε ở đây có nghĩa cho phép; παιδία là trẻ em, không nhất thiết phải thêm sắc thái giảm nhẹ như “trẻ nhỏ”.
- source_word: μὴ κωλύετε αὐτά
  choice: đừng ngăn cản chúng
  rationale: Giữ trực tiếp mệnh lệnh phủ định và ý nghĩa cản trở việc các em đến gần Đức Chúa Jêsus.
- source_word: τῶν γὰρ τοιούτων ἐστὶν
  choice: vì ... thuộc về những người giống như chúng
  rationale: τοιοῦτος chỉ những người thuộc loại như các trẻ em này, mang lực đại diện; “thuộc về” diễn đạt tự nhiên cấu trúc sở hữu của tiếng Hy Lạp, trong khi chú thích giữ dạng sát chữ hơn.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: vương quốc Đức Chúa Trời
  rationale: Giữ thuật ngữ Kinh Thánh quen thuộc, đồng thời không thu hẹp nghĩa vào lãnh thổ hay chỉ diễn giải thành sự cai trị.
theological_decisions:
- issue: Ý nghĩa của τῶν ... τοιούτων trong câu nói về vương quốc Đức Chúa Trời
  choice: “những người giống như chúng” biểu thị những người thuộc loại như các trẻ em này
  alternative: “vương quốc Đức Chúa Trời là của những người như thế” hoặc cách sát chữ “của những người như thế là vương quốc Đức Chúa Trời”
  rationale: Cách dịch giữ lực đại diện của τοιούτων nhưng không xác định trẻ em giống nhau ở đặc điểm nào, cũng không thêm giáo lý về sự ngây thơ hay sự cứu rỗi tự động của trẻ em.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “Đức Chúa Jêsus”, “Ta” và “phán” theo văn phong Kinh Thánh phổ biến; câu chính ưu tiên sự tự nhiên, còn chú thích bảo tồn cấu trúc sát chữ và độ mở của nguyên văn.
