revisions:
- from: 'Nhưng khi thấy vậy, Đức Chúa Jêsus bất bình và phán với họ: “Hãy để trẻ em đến với Ta; đừng ngăn cản chúng, vì vương quốc Đức Chúa Trời thuộc về những người giống như chúng.[a]”'
  to: 'Nhưng khi thấy vậy, Chúa Giê-su phẫn nộ và nói với họ: “Hãy để các em đến với tôi; đừng ngăn cản các em, vì vương quốc Đức Chúa Trời thuộc về những người như các em này.[a]”'
  rationale: Bản sửa tăng độ chính xác của ἠγανάκτησεν bằng “phẫn nộ,” dùng chính tả và lối dẫn lời hiện đại, đồng thời thay “chúng” bằng “các em.” Cụm “những người như các em này” phản ánh τοιούτων theo nghĩa đại diện, nhưng không xác định các em là mẫu mực ở phương diện nào và không thêm khẳng định thần học ngoài văn bản. Chú thích giữ lựa chọn sát cấu trúc sở hữu của nguyên ngữ.
  reviewer_model: gpt-5.6-terra
