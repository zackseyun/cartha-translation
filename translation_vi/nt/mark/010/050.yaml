base_translation:
  language: en
  yaml_path: translation/nt/mark/010/050.yaml
  text: And throwing off his cloak[a], he sprang up and came to Jesus.
translation:
  language: vi
  text: Ông quăng áo choàng sang một bên,[a] bật dậy và đến với Giê-su.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc dịch: «ném áo ngoài của mình đi».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποβαλών
  choice: quăng ... sang một bên
  rationale: Phân từ bất định quá khứ của ἀποβάλλω diễn tả một hành động dứt khoát, nhanh gọn; cách dịch này giữ được sắc thái mạnh và sinh động hơn «cởi ra».
- source_word: ἱμάτιον
  choice: áo choàng
  rationale: ἱμάτιον thường chỉ áo khoác ngoài; «áo choàng» ngắn gọn, tự nhiên và phù hợp bối cảnh.
- source_word: ἀναπηδήσας
  choice: bật dậy
  rationale: Động từ diễn tả chuyển động đứng bật lên đầy nhanh nhẹn; «bật dậy» truyền đạt sự tức thì và háo hức bằng tiếng Việt hiện đại.
- source_word: ἦλθεν πρὸς τὸν Ἰησοῦν
  choice: đến với Đức Chúa Giê-su
  rationale: Cấu trúc ἔρχομαι với πρός chỉ sự chuyển động hướng đến và tới chỗ Chúa Giê-su; cách dịch này tự nhiên trong mạch kể.
- source_word: δὲ
  choice: liền
  rationale: δέ là liên từ nhẹ để tiếp diễn câu chuyện. Trong ngữ cảnh này, «liền» nối mạch tự nhiên và làm rõ diễn tiến tức thời mà không tạo sắc thái tương phản mạnh.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện hiện đại, rõ ràng và trang trọng vừa phải. Đại từ «anh» tiếp nối nhân vật Ba-ti-mê trong ngữ cảnh; «Đức Chúa Giê-su» giữ cách gọi tôn kính quen thuộc. Dấu phẩy đặt sau ký hiệu chú thích để ký hiệu gắn trực tiếp với cụm từ được chú giải.
