  text: καὶ ἔσονται οἱ δύο εἰς σάρκα μίαν· ὥστε οὐκέτι εἰσὶν δύο ἀλλὰ μία σάρξ·
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/008.yaml
  text: and the two will become one flesh. So they are no longer two[a], but one flesh.
translation:
  language: vi
  text: Và hai người sẽ trở nên một thịt.[a] Vì thế, họ không còn là hai nữa, nhưng là một thịt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Theo sát cấu trúc Hy Lạp: “và hai người sẽ là vào một thịt”; cách nói này diễn tả sự trở thành một thịt.'
    reason: Nêu rõ động từ “là” đi với εἰς (“vào”) trong nguyên văn, trong khi vẫn bảo toàn cách diễn đạt Việt tự nhiên ở bản văn chính.
lexical_decisions:
- source_word: ἔσονται ... εἰς
  choice: sẽ trở nên
  rationale: Động từ εἰμί đi với εἰς và bổ ngữ chỉ kết quả; “sẽ trở nên” diễn đạt tự nhiên sự chuyển đến tình trạng hiệp nhất, thay vì chỉ trạng thái tĩnh “sẽ là”.
- source_word: οἱ δύο
  choice: hai người
  rationale: Giữ rõ con số hai và dùng “người” để câu tiếng Việt tự nhiên trong ngữ cảnh hôn nhân.
- source_word: σάρκα μίαν / μία σάρξ
  choice: một thịt
  rationale: Giữ cách nói Kinh Thánh liên kết trực tiếp với Sáng Thế Ký, không thu hẹp thành “một thân thể”, “một người” hay chỉ sự kết hợp tình dục.
- source_word: ὥστε
  choice: Vì thế
  rationale: Diễn đạt quan hệ kết quả hoặc suy luận từ lời trích dẫn trước đó bằng lối văn trang trọng nhưng hiện đại.
- source_word: οὐκέτι
  choice: không còn ... nữa
  rationale: Diễn đạt đầy đủ ý chấm dứt tình trạng trước kia và phù hợp với cách nói tự nhiên trong tiếng Việt.
- source_word: ἀλλά
  choice: nhưng
  rationale: Giữ nguyên thế đối lập trọng yếu giữa “hai” và “một thịt”.
theological_decisions:
- issue: Ý nghĩa của “một thịt” trong lời Chúa Giê-xu trích từ Sáng Thế Ký
  choice: Giữ nguyên thành ngữ giao ước-hôn nhân “một thịt” mà không giải nghĩa thêm trong chính câu.
  alternative: “một thân thể”, “một người”, hoặc “kết hợp về tình dục”
  rationale: Nguyên văn không giới hạn cụm từ vào một khía cạnh duy nhất. Cách dịch “một thịt” bảo toàn chiều rộng thần học và nhân học cũng như mối liên hệ liên văn bản.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Một thịt” là cách nói Kinh Thánh có chủ ý; sự lặp lại của cụm này và thế đối lập “hai—một” được giữ nguyên.
