  verdict: revise
  source_fidelity: 'Bản văn chính truyền đạt đúng cấu trúc và lập luận của nguyên văn: καὶ được giữ bằng “Và”; οἱ δύο bằng “hai người”; ἔσονται ... εἰς σάρκα μίαν được diễn đạt thành ngữ tự nhiên “sẽ trở nên một thịt”; và ὥστε ... οὐκέτι ... ἀλλὰ giữ rõ kết luận “không còn là hai ... nhưng là một thịt.” Tuy nhiên, chú thích hiện có gọi “sẽ thành một thịt” là sát cấu trúc Hy Lạp hơn mà không phản ánh yếu tố εἰς (“vào/trở thành”) và thực tế không làm rõ khác biệt đáng kể với bản văn chính.'
  naturalness: “Sẽ trở nên một thịt” và “không còn là hai nữa, nhưng là một thịt” là tiếng Việt hiện đại, trang trọng, tự nhiên trong văn cảnh Kinh Thánh. Viết hoa “Và” phù hợp khi trình bày câu độc lập.
  terminology: “Một thịt” là cách giữ trung thành thuật ngữ σάρξ và tiếng vọng Sáng Thế Ký; không nên thay bằng “một thân thể” hoặc diễn giải thành một ý nghĩa hẹp. “Hai người” thích hợp trong ngữ cảnh hôn nhân và vẫn duy trì thế đối lập hai—một.
  issues:
