  source_fidelity: 'Bản nháp chuyển đạt đúng cấu trúc chính: việc ngồi bên phải hoặc bên trái Chúa Giê-su không phải là điều Ngài ban, và câu kết giữ được tính bị động hoàn thành của ἡτοίμασται. Tuy nhiên, “những người đã được chuẩn bị sẵn” khiến chính con người là đối tượng được chuẩn bị, trong khi nguyên văn ngụ ý các chỗ ngồi/vị trí đã được chuẩn bị cho họ.'
