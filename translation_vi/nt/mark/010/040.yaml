  terminology: “Ta” phù hợp với lối xưng hô trang trọng cho lời Chúa Giê-su trong bản dịch. “bên phải ... bên trái” chuyển tải cân xứng hai thành ngữ chỉ vị trí. Không nên thêm lời giải thích thần học về ý muốn của Cha.
