  text: τὸ δὲ καθίσαι ἐκ δεξιῶν μου ⸀ἢ ἐξ εὐωνύμων οὐκ ἔστιν ἐμὸν δοῦναι, ἀλλ’ οἷς ἡτοίμασται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/040.yaml
  text: But to sit at my right or at my left is not mine to give[a], but for those for whom it has been prepared.
translation:
  language: vi
  text: Nhưng việc ngồi bên phải hay bên trái Ta không thuộc quyền Ta ban cho,[a] nhưng dành cho những người mà chỗ ấy đã được chuẩn bị sẵn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “không phải là việc Ta có quyền ban cho.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ ... καθίσαι
  choice: việc ngồi
  rationale: Mạo từ đi với động từ nguyên mẫu khiến cụm này có chức năng như danh từ; “việc ngồi” tự nhiên trong tiếng Việt và vẫn giữ ý hành động.
- source_word: ἐκ δεξιῶν μου
  choice: bên phải Ta
  rationale: Diễn đạt trực tiếp vị trí ở phía bên phải của Chúa Giê-su mà không thêm từ “tay,” vốn không có trong nguyên văn.
- source_word: ἢ ἐξ εὐωνύμων
  choice: hay bên trái Ta
  rationale: Giữ cấu trúc cân xứng với “bên phải Ta” và chuyển đúng thành ngữ chỉ phía bên trái.
- source_word: οὐκ ἔστιν ἐμὸν δοῦναι
  choice: không thuộc quyền Ta ban cho
  rationale: Chuyển tải tự nhiên ý rằng việc ban các chỗ ấy không phải là điều thuộc về Chúa Giê-su để ban trong phát biểu này, nhưng không giải thích thêm nguyên nhân thần học.
- source_word: ἀλλ’ οἷς
  choice: mà dành cho những người
  rationale: Nguyên văn lược bỏ thành phần được hiểu từ mệnh đề trước; “dành cho” làm rõ quan hệ trong tiếng Việt mà vẫn giữ thế đối lập.
- source_word: ἡτοίμασται
  choice: đã được chuẩn bị sẵn
  rationale: Thể hoàn thành bị động nói đến sự chuẩn bị đã hoàn tất và kết quả còn hiệu lực; “đã được chuẩn bị sẵn” thể hiện sắc thái ấy.
theological_decisions:
- issue: Phát biểu của Chúa Giê-su phủ nhận tuyệt đối thẩm quyền của Ngài hay nêu một giới hạn trong ngữ cảnh này
  choice: không thuộc quyền Ta ban cho
  alternative: Ta chỉ ban theo ý muốn của Cha
  rationale: Nguyên văn nêu giới hạn nhưng không giải thích giới hạn ấy. Không thêm quy chiếu đến ý muốn của Cha, vì điều đó sẽ giải quyết một căng thẳng thần học mà câu này để ngỏ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ta” cho lời Chúa Giê-su. Dấu chú thích [a] được đặt ngay sau mệnh đề có phương án dịch khác.
