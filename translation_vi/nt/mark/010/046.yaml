source:
  edition: SBLGNT
  text: Καὶ ἔρχονται εἰς Ἰεριχώ. καὶ ἐκπορευομένου αὐτοῦ ἀπὸ Ἰεριχὼ καὶ τῶν μαθητῶν αὐτοῦ καὶ ὄχλου ἱκανοῦ ⸀ὁ υἱὸς Τιμαίου Βαρτιμαῖος ⸀τυφλὸς ⸂προσαίτης ἐκάθητο παρὰ τὴν ὁδόν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/046.yaml
  text: And they came to Jericho[a]. And as he was going out from Jericho, along with his disciples and a considerable crowd, Bartimaeus, the son of Timaeus, a blind beggar[c][b], was sitting beside the road.
translation:
  language: vi
  text: Họ đến Giê-ri-cô. Khi Đức Giê-su cùng các môn đồ và một đám đông khá lớn đang rời khỏi Giê-ri-cô, thì Ba-ti-mê, con của Ti-mê, một người mù ăn xin, đang ngồi bên đường.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔρχονται
  choice: Họ đến
  rationale: Thì hiện tại lịch sử của tiếng Hy Lạp không cần được đánh dấu bằng một từ chỉ thì trong tiếng Việt; “đến” kể sự việc tự nhiên và giữ trình tự câu chuyện.
- source_word: ἐκπορευομένου αὐτοῦ
  choice: Khi Đức Giê-su ... rời khỏi thành
  rationale: Cấu trúc sở hữu cách tuyệt đối diễn tả hành động đồng thời. “Khi ... rời khỏi” tự nhiên trong tiếng Việt và vẫn giữ ý chuyển động ra khỏi Giê-ri-cô.
- source_word: ὄχλου ἱκανοῦ
  choice: một đám đông khá lớn
  rationale: ἱκανός ở đây chỉ số lượng đáng kể; “khá lớn” rõ nghĩa, tự nhiên và không cường điệu.
- source_word: ὁ υἱὸς Τιμαίου Βαρτιμαῖος
  choice: Ba-ti-mê, con ông Ti-mê
  rationale: Giữ cả tên riêng Semit và lời giải thích của Mác, đồng thời đảo theo trật tự tự nhiên trong tiếng Việt.
- source_word: τυφλὸς προσαίτης
  choice: một người ăn xin bị mù
  rationale: Diễn đạt rõ cả tình trạng mù và việc người ấy sống bằng cách ăn xin; cách nói này tự nhiên, dễ hiểu và tránh biến khuyết tật thành toàn bộ căn tính của nhân vật.
- source_word: παρὰ τὴν ὁδόν
  choice: bên đường
  rationale: παρά với đối cách ở đây chỉ vị trí dọc bên đường; “bên đường” là cách diễn đạt ngắn gọn, chính xác trong tiếng Việt.
- source_word: Ἰεριχώ
  choice: Giê-ri-cô
  rationale: Dùng dạng phiên âm quen thuộc trong Kinh Thánh tiếng Việt.
theological_decisions:
- issue: Cách xác định Ba-ti-mê trong lời kể
  choice: Giữ cả tên “Ba-ti-mê” lẫn cụm giải thích “con ông Ti-mê” trong chính văn.
  alternative: Chỉ dịch nghĩa là “con ông Ti-mê”, hoặc chỉ giữ tên “Ba-ti-mê”.
  rationale: Bản Hy Lạp nêu cả tên lẫn lời giải thích; giữ cả hai bảo toàn chi tiết của lời kể mà không áp đặt cách giải thích thần học.
- issue: Chủ thể của đại từ αὐτοῦ
  choice: Nêu rõ là “Đức Giê-su”.
  alternative: Dịch sát đại từ là “ngài” hoặc “ông ấy”.
  rationale: Ngữ cảnh xác định chủ thể là Đức Giê-su; nêu tên giúp câu tiếng Việt rõ ràng, không thay đổi nội dung hay giải quyết một điểm thần học còn mơ hồ.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “Đức Giê-su” và “môn đồ” theo lối diễn đạt Kinh Thánh quen thuộc; câu được sắp xếp lại vừa phải để tránh cấu trúc nặng nề mà vẫn giữ đầy đủ các thành phần của bản Hy Lạp.
