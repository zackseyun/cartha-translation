base_translation:
  language: en
  yaml_path: translation/nt/mark/010/012.yaml
  text: and if she divorces her husband and marries another man[a], she commits adultery.
translation:
  language: vi
  text: Và nếu chính người vợ ly dị[a] chồng mình rồi lấy một người đàn ông khác, thì người ấy phạm tội ngoại tình.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay, sát nghĩa hơn: “để chồng mình đi.” Trong ngữ cảnh hôn nhân này, từ ấy có nghĩa là “ly dị.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Và
  rationale: Liên từ nối câu này với trường hợp song song ở câu trước.
- source_word: ἐὰν
  choice: nếu
  rationale: Diễn đạt tự nhiên mệnh đề điều kiện trong lời dạy mang tính luân lý.
- source_word: αὐτὴ
  choice: chính người vợ
  rationale: Giữ chủ thể giống cái và sắc thái nhấn nhẹ của đại từ Hy Lạp; trong tiếng Việt, “người vợ” cũng làm rõ quan hệ hôn nhân.
- source_word: ἀπολύσασα
  choice: ly dị
  rationale: Nghĩa căn bản là cho đi hoặc cho rời khỏi, nhưng trong ngữ cảnh hôn nhân, động từ chỉ việc chấm dứt hôn nhân; “ly dị” rõ ràng và tự nhiên trong tiếng Việt hiện đại.
- source_word: τὸν ἄνδρα αὐτῆς
  choice: chồng mình
  rationale: ἀνήρ có thể là “người đàn ông” hoặc “chồng”; ngữ cảnh hôn nhân đòi hỏi nghĩa “chồng”. Đại từ phản thân “mình” tự nhiên với chủ ngữ này.
- source_word: γαμήσῃ ἄλλον
  choice: lấy một người đàn ông khác
  rationale: ἄλλον ở giống đực; cách dịch này giữ rõ đối tượng là một người đàn ông khác thay vì trung tính hóa.
- source_word: μοιχᾶται
  choice: phạm tội ngoại tình
  rationale: Diễn đạt trực tiếp, tự nhiên hành vi được động từ Hy Lạp chỉ đến, không chuyển thành nhãn gọi người phụ nữ.
theological_decisions:
- issue: Có giữ cách diễn đạt cụ thể về giới tính hay không
  choice: Giữ chủ thể là người vợ và đối tượng kết hôn sau đó là một người đàn ông khác.
  alternative: Dịch trung tính là “nếu một người ly dị người phối ngẫu rồi kết hôn với người khác”.
  rationale: Bản Hy Lạp nêu cụ thể chủ thể giống cái và đối tượng giống đực, tạo thế song song có chủ ý với câu trước; không nên trung tính hóa chi tiết này.
- issue: Hiểu ἀπολύω theo nghĩa đen hay theo nghĩa pháp lý-hôn nhân
  choice: Dịch là “ly dị”.
  alternative: Dịch sát hình thức là “cho chồng mình đi” hoặc “đuổi chồng mình đi”.
  rationale: Trong lời bàn về việc chấm dứt hôn nhân, “ly dị” truyền đạt đúng chức năng ngữ cảnh mà không biến câu thành việc chỉ ly thân hay đuổi khỏi nhà.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Ly dị” là cách nói phổ thông, rõ nghĩa; “phạm tội ngoại tình” giữ sắc thái luân lý của câu. Dùng “chính người vợ” để phản ánh sắc thái nhấn của αὐτὴ mà không làm câu quá nặng.
