- from: Vậy, điều Đức Chúa Trời đã kết hợp thì con người[a] không được phân rẽ.
  to: Vậy, điều Đức Chúa Trời đã kết hợp thì không ai được phân rẽ.
  rationale: Đổi “con người[a]” thành “không ai” làm rõ ngay lực cấm hướng đến mọi người như tác nhân, đồng thời vẫn giữ phạm vi khái quát của ἄνθρωπος. Chú thích không còn cần thiết vì “không ai” vốn đã diễn đạt trực tiếp nghĩa “no human being”; việc bỏ chú thích cũng loại bỏ neo chú thích không còn có từ tương ứng trong câu.
