  text: ὃ οὖν ὁ θεὸς συνέζευξεν ἄνθρωπος μὴ χωριζέτω.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/009.yaml
  text: Therefore[a], what God has joined together, man must not separate.
translation:
  language: vi
  text: Vậy, điều Đức Chúa Trời đã kết hợp thì không ai được phân rẽ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὃ
  choice: điều
  rationale: Đại từ quan hệ trung tính số ít chỉ chung sự kết hợp hôn nhân vừa được nói đến; “điều” tự nhiên trong tiếng Việt và giữ được tính phi nhân xưng của cách diễn đạt Hy Lạp.
- source_word: οὖν
  choice: Vậy
  rationale: Đánh dấu kết luận rút ra từ lập luận ngay trước đó về ý định của Đức Chúa Trời đối với hôn nhân.
- source_word: ὁ θεὸς
  choice: Đức Chúa Trời
  rationale: Chủ ngữ xác định của động từ, được chuyển ngữ theo cách gọi trang trọng và quen thuộc trong tiếng Việt.
- source_word: συνέζευξεν
  choice: đã kết hợp
  rationale: Động từ aorist chỉ hành động Đức Chúa Trời nối hai người thành một; “kết hợp” tự nhiên trong ngữ cảnh hôn nhân mà không nhấn quá mức hình ảnh đeo chung ách.
- source_word: ἄνθρωπος
  choice: con người
  rationale: Danh từ số ít không có mạo từ được dùng theo nghĩa đại diện, chỉ bất cứ con người nào; “con người” giữ được số ít và phạm vi bao quát mà không khiến người đọc hiểu là chỉ nam giới.
- source_word: μὴ χωριζέτω
  choice: không được phân rẽ
  rationale: Mệnh lệnh hiện tại với μή diễn đạt sự cấm đoán; cách dịch này rõ ràng, tự nhiên và giữ sắc thái có thẩm quyền.
theological_decisions:
- issue: Phạm vi khái quát của ἄνθρωπος trong lời dạy về hôn nhân
  choice: Dịch là “con người,” với nghĩa bất cứ người nào
  alternative: “không ai” hoặc “loài người”
  rationale: Nguyên văn dùng danh từ số ít theo nghĩa khái quát. “Con người” vừa phản ánh hình thức số ít, vừa tránh giới hạn điều cấm vào riêng nam giới; chú thích nêu rõ phạm vi bao quát.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cấu trúc “điều... thì...” giúp câu tự nhiên trong tiếng Việt, còn “không được phân rẽ” truyền đạt trực tiếp lực của mệnh lệnh cấm.
