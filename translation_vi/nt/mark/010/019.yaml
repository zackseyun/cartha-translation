source:
  edition: SBLGNT
  text: τὰς ἐντολὰς οἶδας· Μὴ ⸂φονεύσῃς, Μὴ μοιχεύσῃς⸃, Μὴ κλέψῃς, Μὴ ψευδομαρτυρήσῃς, Μὴ ἀποστερήσῃς, Τίμα τὸν πατέρα σου καὶ τὴν μητέρα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/019.yaml
  text: 'You know the commandments: Do not murder[a], do not commit adultery, do not steal, do not bear false witness, do not defraud[b], honor your father and mother.'
translation:
  language: vi
  text: 'Anh biết các điều răn: ‘Không được giết người[a]; không được ngoại tình; không được trộm cắp; không được làm chứng gian; không được tước đoạt[b]; hãy hiếu kính cha mẹ mình.’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Không được giết.” Tuy nhiên, động từ Hy Lạp ở đây cụ thể hơn, chỉ việc giết người, nhất là giết người trái phép.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “không được lừa đảo,” “không được chiếm đoạt,” hoặc “không được giữ lại điều thuộc về người khác.” Từ này nói đến việc khiến người khác mất điều chính đáng thuộc về họ, thường do bóc lột hoặc gian lận.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰς ἐντολὰς
  choice: các điều răn
  rationale: Cách dịch quen thuộc, trang trọng và phù hợp với lời dẫn vào danh sách các điều răn trong Mười Điều Răn.
- source_word: οἶδας
  choice: Anh biết
  rationale: οἶδα có hình thức hoàn thành nhưng mang nghĩa hiện tại trong tiếng Hy Lạp Koinē. Đại từ xưng hô “anh” tự nhiên trong ngữ cảnh Đức Giê-su nói với một người đàn ông.
- source_word: Μὴ φονεύσῃς
  choice: Không được giết người
  rationale: φονεύω chỉ việc giết một con người, đặc biệt là giết người trái phép; “giết người” chính xác hơn từ rộng nghĩa “giết” và tự nhiên hơn “sát nhân” trong câu mệnh lệnh.
- source_word: Μὴ μοιχεύσῃς
  choice: không được ngoại tình
  rationale: Cách diễn đạt tiếng Việt hiện đại, rõ ràng cho μοιχεύω trong bối cảnh luân lý và hôn nhân.
- source_word: Μὴ κλέψῃς
  choice: không được trộm cắp
  rationale: Diễn đạt trực tiếp và quen thuộc cho κλέπτω trong văn phong điều răn.
- source_word: Μὴ ψευδομαρτυρήσῃς
  choice: không được làm chứng gian
  rationale: Giữ sắc thái pháp lý và chứng ngôn của ψευδομαρτυρέω, thay vì mở rộng thành lời cấm nói dối nói chung.
- source_word: Μὴ ἀποστερήσῃς
  choice: không được chiếm đoạt của người khác
  rationale: ἀποστερέω nói đến việc tước hoặc giữ lại điều thuộc quyền người khác, thường bằng sự bóc lột hay gian lận. “Chiếm đoạt của người khác” rõ nghĩa trong tiếng Việt và không thu hẹp hành vi chỉ còn lừa đảo.
- source_word: Τίμα
  choice: hãy hiếu kính
  rationale: Trong quan hệ với cha mẹ, “hiếu kính” chuyển tải tự nhiên nghĩa tôn kính và đối xử xứng đáng của τιμάω, mạnh hơn chỉ “tôn trọng”.
- source_word: τὸν πατέρα σου καὶ τὴν μητέρα
  choice: cha mẹ mình
  rationale: Cách nói tự nhiên trong tiếng Việt, vẫn bảo toàn đầy đủ cặp đối tượng là cha và mẹ; “mình” quy chiếu về người đang được Đức Giê-su nói với.
theological_decisions:
- issue: Cách diễn đạt những điều răn được trích dẫn hoặc gợi nhắc
  choice: Dùng lối nói điều răn quen thuộc trong tiếng Việt nhưng theo sát phạm vi nghĩa của các động từ Hy Lạp
  alternative: Dùng công thức cổ truyền Hán-Việt hơn hoặc diễn ý tự do theo ngôn ngữ luân lý hiện đại
  rationale: Danh sách cần dễ được nhận ra là các điều răn, đồng thời không nên làm rộng φονεύω thành mọi hành vi giết hoặc thu hẹp ἀποστερέω vào riêng một thủ đoạn gian lận.
- issue: Phạm vi của lệnh Μὴ φονεύσῃς
  choice: “Không được giết người”
  alternative: “Không được giết” hoặc “Không được sát nhân”
  rationale: Bản dịch giữ đối tượng là con người và không tự giải quyết mọi vấn đề đạo đức liên quan đến các loại hành vi gây chết người; chú thích nêu khả năng diễn đạt khác.
- issue: Phạm vi của Μὴ ἀποστερήσῃς
  choice: “Không được chiếm đoạt của người khác”
  alternative: “Không được lừa đảo,” “không được tước đoạt,” hoặc “không được giữ lại điều thuộc về người khác”
  rationale: Từ Hy Lạp bao gồm việc tước đoạt hay giữ lại điều chính đáng thuộc về người khác, thường qua bóc lột hoặc gian lận. Bản chính chọn cách nói tự nhiên có phạm vi đủ rộng, còn chú thích bảo tồn các sắc thái khả dĩ.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dấu chấm phẩy giúp người đọc nhận rõ từng điều răn. “Không được” tạo sắc thái cấm đoán rõ ràng; “hiếu kính” phù hợp tự nhiên với bổn phận đối với cha mẹ.
