source:
  edition: SBLGNT
  text: καὶ ἀκούσας ὅτι Ἰησοῦς ὁ ⸀Ναζαρηνός ἐστιν ἤρξατο κράζειν καὶ λέγειν· ⸀Υἱὲ Δαυὶδ Ἰησοῦ, ἐλέησόν με.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/047.yaml
  text: And when he heard that it was Jesus the Nazarene[a], he began to cry out and say, “Jesus, Son of David, have mercy on me!”
translation:
  language: vi
  text: 'Khi nghe nói đó là Giê-su, người Na-xa-rét[a], ông bắt đầu kêu lớn và nói: “Giê-su, Con Đa-vít, xin thương xót tôi!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch “Giê-su quê ở Na-xa-rét.” Tiếng Hy Lạp viết sát nghĩa là “Giê-su, người Na-xa-rét”, giữ một biệt hiệu thay vì dùng cách diễn đạt địa lý rõ hơn.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσας
  choice: Khi nghe
  rationale: Phân từ bất định quá khứ đứng trước động từ chính mang ý nghĩa thời gian; cách dịch này giữ trình tự hành động và tự nhiên trong tiếng Việt.
- source_word: Ναζαρηνός
  choice: người Na-xa-rét
  rationale: Đây là tính từ dùng như biệt hiệu chỉ người Na-xa-rét, không phải cấu trúc Hy Lạp nói rõ nơi xuất thân. Cách dịch này vừa tự nhiên vừa giữ sắc thái biệt hiệu.
- source_word: ἤρξατο κράζειν καὶ λέγειν
  choice: bắt đầu kêu lớn và nói
  rationale: Giữ rõ ý khởi đầu của ἤρξατο và cả hai động từ nguyên mẫu, phù hợp với lối kể của Mác.
- source_word: κράζειν
  choice: kêu lớn
  rationale: Diễn tả lời kêu gọi lớn tiếng, khẩn thiết mà không hàm ý tức giận.
- source_word: Υἱὲ Δαυὶδ
  choice: Con Đa-vít
  rationale: Giữ nguyên hình thức danh hiệu và âm hưởng vương quyền–Đấng Mê-si, thay vì làm phẳng thành một mô tả gia phả như “hậu duệ Đa-vít”.
- source_word: ἐλέησόν με
  choice: xin thương xót tôi
  rationale: Thể hiện mệnh lệnh cầu khẩn trang trọng và khẩn thiết; “xin” làm câu cầu khiến tự nhiên trong tiếng Việt mà không giảm sức nặng của lời van nài.
- source_word: Ἰησοῦ
  choice: Giê-su
  rationale: Phiên âm tên riêng theo cách dùng phổ biến trong tiếng Việt.
theological_decisions:
- issue: Sức nặng Mê-si của danh hiệu Υἱὲ Δαυίδ
  choice: Giữ “Con Đa-vít” như một danh hiệu trực tiếp dành cho Giê-su.
  alternative: Dịch khái quát hơn là “hậu duệ Đa-vít”.
  rationale: Trong mạch kể của Mác, lời xưng hô này có âm hưởng vương quyền và Mê-si; giữ hình thức nguyên văn bảo tồn chiều kích thần học mà không giải thích quá mức.
- issue: Cách hiểu Ναζαρηνός
  choice: Dịch là “người Na-xa-rét”, giữ sắc thái biệt hiệu.
  alternative: Dịch rõ theo địa lý là “quê ở Na-xa-rét”.
  rationale: Bản Hy Lạp dùng Ναζαρηνός như một tính từ hoặc biệt hiệu. Cách dịch chính giữ gần hình thức nguồn, còn cách hiểu địa lý được nêu trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Anh ta” giúp thể hiện chủ ngữ ngôi thứ ba vốn chỉ hàm ẩn trong động từ Hy Lạp; không thêm tước hiệu “Chúa” vào tên Giê-su vì câu nguồn không có từ tương ứng. Dấu phẩy làm rõ “người Na-xa-rét” là thành phần đồng vị mang sắc thái biệt hiệu.
