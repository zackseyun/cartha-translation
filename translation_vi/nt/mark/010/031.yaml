  text: πολλοὶ δὲ ἔσονται πρῶτοι ἔσχατοι καὶ ⸀οἱ ἔσχατοι πρῶτοι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/031.yaml
  text: But many who are first will be last[a], and the last first.
translation:
  language: vi
  text: Nhưng nhiều người đứng đầu sẽ thành cuối cùng, còn những người cuối cùng sẽ thành đầu tiên.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πολλοὶ
  choice: nhiều người
  rationale: Tính từ được dùng như danh từ, chỉ một nhóm rộng chứ không phải mọi cá nhân; tiếng Việt cần thêm “người” để câu tự nhiên và rõ nghĩa.
- source_word: δὲ
  choice: Nhưng
  rationale: δέ đánh dấu sự chuyển ý có sắc thái tương phản nhẹ; “Nhưng” phù hợp với nguyên tắc đảo ngược được nêu ra sau lời hứa ở câu trước.
- source_word: ἔσονται
  choice: sẽ thành
  rationale: Động từ tương lai của εἰμί diễn tả tình trạng sẽ có; trong cấu trúc đảo vị trí này, “sẽ thành” tự nhiên hơn “sẽ là” mà không thêm ý nhân quả.
- source_word: πρῶτοι
  choice: đứng đầu / đầu tiên
  rationale: πρῶτοι nói về vị trí hoặc thứ hạng. “Đứng đầu” làm rõ cách dùng vị ngữ ở vế đầu, còn “đầu tiên” giữ được phép đối xứng gọn ở vế sau.
- source_word: ἔσχατοι
  choice: cuối cùng
  rationale: “Cuối cùng” giữ nguyên sự đối lập trực tiếp về vị trí với πρῶτοι, không thu hẹp thành địa vị xã hội hay giá trị đạo đức.
- source_word: οἱ ἔσχατοι
  choice: những người cuối cùng
  rationale: Mạo từ khiến cụm từ mang chức năng danh từ; “những người cuối cùng” là cách diễn đạt rõ ràng, tự nhiên trong tiếng Việt.
- source_word: καὶ
  choice: còn
  rationale: καὶ nối hai nửa song song của câu. “Còn” diễn đạt tự nhiên sự tương phản cân xứng trong tiếng Việt, không làm thay đổi nội dung liên kết.
theological_decisions:
- issue: Bản chất của lời nói về sự đảo ngược
  choice: Giữ câu như một nguyên tắc khái quát về sự đảo ngược vị trí, không xác định cụ thể các nhóm người.
  alternative: Giải thích “đứng đầu” và “cuối cùng” riêng thành giàu và nghèo, môn đồ và người ngoài, hoặc thành quy luật tuyệt đối cho từng cá nhân.
  rationale: Bản văn nêu một nghịch lý rộng và dùng “nhiều người,” không định nghĩa hết các phạm trù cũng không nói “tất cả.” Bản dịch vì thế giữ nguyên độ mở và căng thẳng thần học của câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cấu trúc hai vế cân xứng giữ sắc thái châm ngôn; “nhiều người” bảo toàn phạm vi không tuyệt đối của πολλοὶ.
