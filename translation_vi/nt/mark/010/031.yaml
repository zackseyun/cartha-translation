  source_fidelity: 'Bản dịch bảo toàn đầy đủ cấu trúc và ý nghĩa của câu Hy Lạp: πολλοὶ được dịch là “nhiều người,” không bị tuyệt đối hóa; cặp đối nghịch πρῶτοι/ἔσχατοι được giữ là “đứng đầu/đầu tiên” và “cuối cùng”; thì tương lai của ἔσονται được thể hiện bằng “sẽ”; và hai vế song hành vẫn rõ ràng. “Sẽ thành” diễn đạt tự nhiên trong tiếng Việt ý đảo ngược vị thế hàm ẩn trong châm ngôn này, mà không xác định nguyên nhân hay phạm vi áp dụng.'
  naturalness: 'Câu văn hiện đại, trang trọng, sáng rõ và có nhịp cân xứng: “Nhưng nhiều người đứng đầu sẽ thành cuối cùng, còn những người cuối cùng sẽ thành đầu tiên.” Cách dùng “còn” ở vế hai là liên từ tự nhiên trong tiếng Việt cho hai vế đối xứng, dù καὶ theo nghĩa cơ bản là “và.”'
