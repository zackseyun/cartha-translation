  source_fidelity: 'Bản dịch truyền đạt đầy đủ trình tự và các thành phần chính của câu Hy Lạp: rời nơi trước đó, đứng dậy, đi đến khu vực Giu-đê và phía bên kia sông Giô-đanh, đám đông lại tìm đến, rồi Đức Giê-su lại dạy họ theo thói quen. “Đứng dậy” được hiểu đúng trong ngữ cảnh lên đường, không hàm ý phục sinh. Cách giữ “và vùng bên kia sông Giô-đanh” phản ánh liên từ καὶ và không ép buộc một cách phân tích cú pháp duy nhất.'
  naturalness: Tiếng Việt hiện đại, rõ ràng và có nhịp kể tự nhiên. “Dân chúng lại kéo đến với Ngài” là cách diễn đạt có thể chấp nhận cho các đám đông cùng quy tụ về phía Người. Việc lặp lại “lại” tái hiện thích đáng hai lần πάλιν mà không gây nặng câu.
  terminology: “Đức Giê-su,” “Giu-đê,” “sông Giô-đanh,” và đại từ “Ngài” nhất quán với văn phong Kinh Thánh tiếng Việt trang trọng vừa phải. “Miền” diễn đạt phù hợp τὰ ὅρια trong ngữ cảnh địa lý; “dạy dỗ” vẫn phù hợp với ἐδίδασκεν.
