id: MRK.10.1
reference: Mark 10:1
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Καὶ ἐκεῖθεν ἀναστὰς ἔρχεται εἰς τὰ ὅρια τῆς Ἰουδαίας ⸀καὶ πέραν τοῦ Ἰορδάνου, καὶ συμπορεύονται πάλιν ὄχλοι πρὸς αὐτόν, καὶ ὡς εἰώθει πάλιν ἐδίδασκεν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/001.yaml
  text: And from there[a], rising, he comes into the region of Judea and beyond the Jordan, and crowds gather to him again, and as was his custom[b], he again taught them.
translation:
  language: vi
  text: Từ đó, Đức Giê-su đứng dậy, đi đến miền Giu-đê và vùng bên kia sông Giô-đanh.[a] Dân chúng lại kéo đến với Ngài, và theo thói quen, Ngài lại dạy dỗ họ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể hiểu: “miền Giu-đê ở bên kia sông Giô-đanh.” Cấu trúc Hy Lạp có thể chỉ hai vùng—miền Giu-đê và vùng bên kia sông Giô-đanh—hoặc mô tả miền Giu-đê là ở bên kia sông.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκεῖθεν
  choice: từ đó
  rationale: Trạng từ chỉ nơi chốn, nối việc rời địa điểm trước đó với hành trình tiếp theo.
- source_word: ἀναστὰς
  choice: đứng dậy
  rationale: Diễn tả hành động xảy ra trước động từ chính; trong ngữ cảnh này là đứng lên để lên đường, không phải sống lại.
- source_word: ἔρχεται
  choice: đi đến
  rationale: Hiện tại lịch sử của Mác được chuyển thành lối kể quá khứ tự nhiên trong tiếng Việt; xét từ điểm xuất phát, 'đi đến' phù hợp hơn 'đến' đơn thuần.
- source_word: τὰ ὅρια τῆς Ἰουδαίας
  choice: miền Giu-đê
  rationale: ὅρια ở đây chỉ khu vực hay lãnh thổ, không nhất thiết là đường biên giới chính xác.
- source_word: καὶ πέραν τοῦ Ἰορδάνου
  choice: và vùng bên kia sông Giô-đanh
  rationale: Giữ καὶ như một liên từ và diễn đạt πέραν như một khu vực ở phía bên kia sông, đồng thời không xóa bỏ khả năng hiểu khác về quan hệ cú pháp.
- source_word: συμπορεύονται ... ὄχλοι πρὸς αὐτόν
  choice: dân chúng lại kéo đến với Ngài
  rationale: Cụm từ gợi nhiều người cùng tiến về phía Đức Giê-su; 'kéo đến' tự nhiên và giữ sắc thái đám đông hội tụ.
- source_word: πάλιν
  choice: lại
  rationale: Giữ cả hai lần lặp của πάλιν để phản ánh văn phong và ý hành động tái diễn trong Mác.
- source_word: ὡς εἰώθει
  choice: theo thói quen
  rationale: Diễn đạt tự nhiên hành động Đức Giê-su vẫn thường làm.
- source_word: ἐδίδασκεν αὐτούς
  choice: Ngài lại dạy dỗ họ
  rationale: Thì chưa hoàn thành kết hợp với ý thói quen cho thấy hoạt động giảng dạy lặp lại; 'dạy dỗ' là cách nói rõ và trang trọng vừa phải.
theological_decisions:
- issue: Hiện tại lịch sử ἔρχεται
  choice: Dùng lối kể tiếng Việt 'đi đến'
  alternative: 'Giữ hiện tại: ''đi đến'' trong một chuỗi động từ hiện tại, hoặc dịch sát hướng nhìn là ''đến'''
  rationale: Hiện tại lịch sử tạo tính sống động trong tiếng Hy Lạp, nhưng tiếng Việt kể chuyện tự nhiên không cần đánh dấu hình thái thì; lựa chọn này không làm thay đổi nội dung sự kiện.
- issue: Quan hệ cú pháp của καὶ πέραν τοῦ Ἰορδάνου
  choice: 'Hiểu là một địa điểm được thêm vào: ''miền Giu-đê và vùng bên kia sông Giô-đanh'''
  alternative: 'Hiểu thành một cụm: ''miền Giu-đê ở bên kia sông Giô-đanh'''
  rationale: Câu Hy Lạp cô đọng và có thể được phân tích theo hai cách. Bản chính giữ liên từ 'và', còn chú thích nêu cách hiểu còn lại thay vì âm thầm giải quyết sự nhập nhằng.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng 'Đức Giê-su' và đại từ kính trọng 'Ngài'; địa danh được phiên âm theo cách quen dùng. Giữ hai lần 'lại' nhằm phản ánh sự lặp từ của nguyên bản.
