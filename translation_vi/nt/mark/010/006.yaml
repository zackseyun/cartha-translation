  text: But from the beginning of creation[b][a], he made them male and female.
translation:
  language: vi
  text: Nhưng từ buổi đầu của sự sáng tạo, Ngài đã làm nên họ, nam và nữ.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Ngài đã sáng tạo nên họ, nam và nữ.” Động từ Hy Lạp có nghĩa cơ bản là “làm,” còn “sáng tạo” làm nổi bật bối cảnh Sáng Thế Ký.'
    reason: lexical_alternative
  - marker: b
    text: 'Theo sát trật tự từ Hy Lạp hơn: “Nam và nữ, Ngài đã làm nên họ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπὸ δὲ ἀρχῆς κτίσεως
  choice: Nhưng từ buổi đầu của công cuộc sáng tạo
  rationale: “Nhưng” thể hiện sức tương phản của δέ với sự nhượng bộ về ly dị ở phần trước; “từ buổi đầu” chỉ mốc khởi nguyên, còn “công cuộc sáng tạo” diễn đạt tự nhiên quan hệ sở hữu trong ἀρχῆς κτίσεως.
- source_word: ἄρσεν καὶ θῆλυ
  choice: có nam có nữ
  rationale: Cách nói tiếng Việt tự nhiên này giữ nguyên cặp phạm trù giới tính nam–nữ của lời trích Sáng Thế Ký, thay vì chuyển thành các vai trò quan hệ như “đàn ông và đàn bà”.
- source_word: ἐποίησεν
  choice: đã làm nên
  rationale: “Làm nên” phản ánh nghĩa thông thường của ποιέω sát hơn “sáng tạo,” đồng thời vẫn phù hợp với bối cảnh công trình tạo dựng.
- source_word: αὐτούς
  choice: họ
  rationale: Đại từ chỉ loài người được làm nên có nam có nữ; không thêm ý nhấn mạnh “cả hai” vốn không được nói rõ trong tiếng Hy Lạp.
theological_decisions:
- issue: Cách dịch các từ chỉ giới tính trong lời trích Sáng Thế Ký
  choice: có nam có nữ
  alternative: là đàn ông và đàn bà
  rationale: Giữ trọng tâm tạo dựng và sự phân biệt giới tính của ἄρσεν καὶ θῆλυ, không chuyển sang các thuật ngữ có thể nghiêng về tuổi tác hoặc vai trò xã hội.
- issue: Chủ thể thần linh được hàm ẩn trong động từ
  choice: Ngài đã làm nên họ
  alternative: Đức Chúa Trời đã làm nên họ
  rationale: Tiếng Hy Lạp không nêu danh từ làm chủ ngữ. “Ngài” giúp câu tiếng Việt rõ và trang trọng trong ngữ cảnh, nhưng không thêm danh xưng “Đức Chúa Trời” vào chính văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Buổi đầu” tự nhiên hơn lối nói nặng tính thuật ngữ; “Ngài” duy trì chủ thể hàm ẩn mà không nêu đích danh. Các dấu chú thích [a], [b] đều xuất hiện trong chính văn.
