source:
  edition: SBLGNT
  text: Καὶ προσέφερον αὐτῷ παιδία ἵνα ⸂αὐτῶν ἅψηται⸃· οἱ δὲ μαθηταὶ ⸂ἐπετίμησαν αὐτοῖς⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/013.yaml
  text: And they were bringing children to him so that he might touch them[a], but the disciples rebuked them.
translation:
  language: vi
  text: Người ta đang đem trẻ em đến với Chúa Giê-su để Ngài chạm vào các em[a], nhưng các môn đồ quở trách họ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “các trẻ nhỏ.” Từ Hy Lạp παιδία có thể chỉ trẻ em nói chung, kể cả trẻ nhỏ.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσέφερον
  choice: đem ... đến
  rationale: Thì chưa hoàn thành diễn tả hành động đang diễn ra hoặc lặp lại; trong tiếng Việt, ngữ cảnh và cách nói “người ta đem ... đến” truyền đạt tự nhiên mà không cần thêm một phụ từ chỉ diễn tiến.
- source_word: παιδία
  choice: trẻ em
  rationale: Danh từ này chỉ trẻ em theo nghĩa tương đối rộng, có thể gồm cả trẻ nhỏ; “trẻ em” tự nhiên và không thu hẹp độ tuổi quá mức.
- source_word: ἵνα αὐτῶν ἅψηται
  choice: để Ngài chạm vào các em
  rationale: ἵνα với thể giả định biểu thị mục đích, còn ἅπτομαι có nghĩa trực tiếp là “chạm vào”; không thêm ý “đặt tay” từ các đoạn song song.
- source_word: ἐπετίμησαν
  choice: quở trách
  rationale: Diễn đạt lời khiển trách mạnh, phù hợp với sắc thái của ἐπιτιμάω và giữ văn phong trang trọng, dễ hiểu.
- source_word: αὐτοῖς
  choice: họ
  rationale: Đại từ nhiều khả năng chỉ những người đang đem trẻ em đến. Giữ dạng đại từ để bảo toàn cách diễn đạt và mức độ hàm ẩn của nguyên văn.
- source_word: δὲ
  choice: nhưng
  rationale: Từ nối đánh dấu sự tương phản giữa việc người ta đem trẻ em đến và phản ứng của các môn đồ.
theological_decisions:
- issue: Đối tượng bị các môn đồ quở trách
  choice: Những người đem trẻ em đến
  alternative: Chính các trẻ em
  rationale: Chủ thể không nêu rõ của προσέφερον là tiền ngữ hợp lý nhất của αὐτοῖς, và mạch kể cũng hướng đến việc các môn đồ ngăn cản những người đem trẻ em đến. Bản dịch vẫn dùng đại từ “họ” để không diễn giải quá mức.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “Đức Chúa Jêsus” để nêu rõ đối tượng của đại từ αὐτῷ trong một câu đứng riêng; dùng “các em” cho trẻ em và “họ” cho những người đem các em đến nhằm giúp phân biệt hai nhóm mà vẫn giữ đại từ của nguyên văn.
