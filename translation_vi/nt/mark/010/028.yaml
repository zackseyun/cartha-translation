  source_fidelity: 'Bản dịch truyền đạt đúng các yếu tố chính: Phi-e-rơ bắt đầu nói, lời gọi chú ý, việc đã bỏ mọi sự, và việc theo người được nói đến. Tuy nhiên, “mà theo” có thể gợi quan hệ phương tiện/hệ quả hơn là phép nối đơn giản καὶ (“và”).'
