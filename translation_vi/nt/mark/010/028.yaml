  rationale: Chỉ thay “mà” bằng “và” để phản ánh rõ hơn phép nối καὶ giữa “đã bỏ” và “theo,” đồng thời giữ nguyên giọng kính trọng, tên riêng, lực thu hút chú ý của ἰδού, và lời khẳng định chưa được diễn giải của Phi-e-rơ.
