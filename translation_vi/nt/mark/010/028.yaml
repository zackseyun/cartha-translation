  text: Ἤρξατο ⸂λέγειν ὁ Πέτρος⸃ αὐτῷ· Ἰδοὺ ἡμεῖς ἀφήκαμεν πάντα καὶ ⸀ἠκολουθήκαμέν σοι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/028.yaml
  text: Peter began to say to him[a], “Look, we have left everything and followed you.”
translation:
  language: vi
  text: 'Phi-e-rơ bắt đầu thưa với Ngài: “Này, chúng con đã bỏ mọi sự và theo Ngài.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἤρξατο λέγειν
  choice: bắt đầu thưa
  rationale: Cấu trúc ἄρχομαι với động từ nguyên mẫu mang nghĩa “bắt đầu nói.” Trong lời môn đồ nói với Chúa Giê-su, “thưa” tự nhiên và thể hiện sự kính trọng mà không thêm nội dung.
- source_word: ὁ Πέτρος
  choice: Phi-e-rơ
  rationale: Dùng dạng phiên âm tên riêng quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
- source_word: αὐτῷ
  choice: với Ngài
  rationale: Giữ đại từ như bản Hy Lạp; “Ngài” phù hợp ngữ cảnh Phi-e-rơ nói với Chúa Giê-su.
- source_word: Ἰδοὺ
  choice: Này
  rationale: Đây là từ dẫn nhằm thu hút sự chú ý. “Này” ngắn gọn, tự nhiên và trang trọng trong tiếng Việt hiện đại.
- source_word: ἡμεῖς
  choice: chúng con
  rationale: Đại từ được nói rõ trong tiếng Hy Lạp nên giữ lại; “chúng con” phù hợp quan hệ của các môn đồ khi thưa với Chúa Giê-su và tự nhiên hơn “chúng tôi” trong ngữ cảnh này.
- source_word: ἀφήκαμεν πάντα
  choice: đã bỏ mọi sự
  rationale: Diễn đạt hành động đã xảy ra bằng “đã bỏ”; “mọi sự” giữ phạm vi bao quát của πάντα mà không cường điệu thành “từ bỏ hoàn toàn.”
- source_word: ἠκολουθήκαμέν σοι
  choice: mà theo Ngài
  rationale: Động từ hoàn thành nói đến việc đã đi theo với kết quả còn tiếp diễn. Trong tiếng Việt, “đã bỏ mọi sự mà theo Ngài” diễn đạt tự nhiên mối liên hệ giữa hai hành động và hàm ý tình trạng tiếp tục.
theological_decisions:
- issue: Lời khẳng định của Phi-e-rơ về sự hy sinh khi làm môn đồ
  choice: 'Dịch thẳng lời Phi-e-rơ: “chúng con đã bỏ mọi sự mà theo Ngài”'
  alternative: Thêm sắc thái như “hy sinh mọi thứ” hoặc diễn giải trước câu trả lời của Chúa Giê-su
  rationale: Câu này ghi lại lời tự nhận của Phi-e-rơ chứ chưa đưa ra sự đánh giá của người kể chuyện. Bản dịch không xác nhận, giảm nhẹ hay giải quyết trước hàm ý thần học của lời ấy.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Thưa” và “Ngài” tạo sắc thái kính trọng phù hợp mà không làm câu văn cổ kính; “Này” chuyển tải lực diễn ngôn của Ἰδοὺ.
