  terminology: “Phi-e-rơ,” “Ngài,” và “mọi sự” phù hợp với văn phong Kinh Thánh tiếng Việt trang trọng. “Chúng con” và “thưa” là lựa chọn kính trọng theo ngữ cảnh môn đồ thưa với Chúa Giê-su; chúng không cần phải thay đổi trong câu này.
