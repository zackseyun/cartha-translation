  terminology: Nên giữ “Con Đa-vít” để phản ánh chính xác tước hiệu Hy Lạp và không đưa diễn giải vương quyền vào văn bản. Chú thích có thể nêu hàm ý hoàng gia–Mê-si mà không thay thế tước hiệu bằng “Đấng Mê-si”.
