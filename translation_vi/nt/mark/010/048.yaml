  text: καὶ ἐπετίμων αὐτῷ πολλοὶ ἵνα σιωπήσῃ· ὁ δὲ πολλῷ μᾶλλον ἔκραζεν· Υἱὲ Δαυίδ, ἐλέησόν με.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/048.yaml
  text: And many were rebuking him so that he would be silent[a], but he was crying out all the more, “Son of David, have mercy on me!”
translation:
  language: vi
  text: 'Nhiều người quở trách anh, bảo anh im đi; nhưng anh lại càng kêu lên: “Con Đa-vít[a] ơi, xin thương xót tôi!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Con Đa-vít” là một tước hiệu mang hàm ý hoàng gia và Mê-si; có thể diễn ý là “Đấng Mê-si”, nhưng bản dịch giữ cách gọi của nguyên văn.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπετίμων
  choice: quở trách
  rationale: Diễn đạt đúng sắc thái mạnh của động từ ἐπιτιμάω; ngữ cảnh và thì chưa hoàn thành cho thấy nhiều người đang tìm cách ngăn anh tiếp tục kêu.
- source_word: πολλοὶ
  choice: nhiều người
  rationale: Tính từ được dùng như danh từ; cách dịch này trực tiếp và không tự ý đồng nhất họ với toàn bộ đám đông.
- source_word: ἵνα σιωπήσῃ
  choice: bảo anh im đi
  rationale: Diễn đạt tự nhiên mục đích của việc quở trách trong tiếng Việt mà không làm nhẹ mệnh lệnh muốn anh ngừng nói.
- source_word: πολλῷ μᾶλλον
  choice: lại càng
  rationale: Giữ ý so sánh tăng tiến của thành ngữ mà không thêm ý rằng âm lượng nhất thiết lớn hơn.
- source_word: ἔκραζεν
  choice: kêu lên
  rationale: Thể hiện tiếng kêu khẩn thiết của κράζω; kết hợp với “lại càng” truyền đạt hành động tiếp diễn của thì chưa hoàn thành.
- source_word: Υἱὲ Δαυίδ
  choice: Con vua Đa-vít ơi
  rationale: “Con vua Đa-vít” là cách gọi tự nhiên, dễ nhận biết trong tiếng Việt đối với tước hiệu thuộc dòng dõi hoàng gia Đa-vít; “ơi” thể hiện hô cách trực tiếp.
- source_word: ἐλέησόν με
  choice: xin thương xót tôi
  rationale: Lời khẩn cầu tự nhiên, trang trọng, giữ đầy đủ ý nghĩa của ἐλεέω và ngôi thứ nhất của με.
theological_decisions:
- issue: Ý nghĩa Mê-si của tước hiệu “Con vua Đa-vít”
  choice: Giữ nguyên tước hiệu “Con vua Đa-vít”, không thay bằng “Đấng Mê-si”.
  alternative: Đấng Mê-si ơi, xin thương xót tôi!
  rationale: Bản Hy Lạp trực tiếp dùng Υἱὲ Δαυίδ. Giữ tước hiệu vừa bảo toàn hình thức của nguyên bản vừa để độc giả nhận ra ý nghĩa hoàng gia và Mê-si mà không biến cách hiểu thành lời văn chính.
translation_notes:
  register: Văn phong hiện đại, rõ ràng và trang trọng vừa phải. Cấu trúc “quở trách anh, bảo anh im đi” tự nhiên hơn lối dịch sát chữ cứng nhắc; “lại càng kêu lên” giữ ý tăng tiến mà không thêm chi tiết về âm lượng.
