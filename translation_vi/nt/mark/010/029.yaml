id: MRK.10.29
reference: Mark 10:29
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸂ἔφη ὁ Ἰησοῦς⸃· Ἀμὴν λέγω ὑμῖν, οὐδείς ἐστιν ὃς ἀφῆκεν οἰκίαν ἢ ἀδελφοὺς ἢ ἀδελφὰς ἢ ⸂μητέρα ἢ πατέρα⸃ ἢ τέκνα ἢ ἀγροὺς ἕνεκεν ἐμοῦ καὶ ἕνεκεν τοῦ εὐαγγελίου,
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/029.yaml
  text: Jesus said, “Truly I say to you, there is no one who has left house or brothers or sisters or mother or father or children or fields for my sake and for the sake of the gospel,”
translation:
  language: vi
  text: 'Đức Giê-su nói: “Quả thật, tôi nói với anh em: không có ai đã rời bỏ nhà, anh em trai, chị em gái, mẹ, cha, con cái hoặc ruộng đất vì tôi và vì Tin Mừng,”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔφη
  choice: nói
  rationale: Động từ φημί ở đây chỉ đơn giản dẫn lời Đức Giê-su; “nói” tự nhiên và không thêm sắc thái như “tuyên bố” hay “đáp”.
- source_word: Ἀμὴν
  choice: Thật
  rationale: Khi đứng đầu một lời phán trong các sách Tin Mừng Nhất Lãm, ἀμήν là công thức xác quyết trang trọng. “Thật” vừa tự nhiên trong tiếng Việt vừa giữ được tính long trọng.
- source_word: λέγω ὑμῖν
  choice: tôi nói với anh em
  rationale: Cách dịch này giữ cấu trúc trực tiếp và sắc thái trang trọng của công thức Hy Lạp. “Anh em” là đại từ số nhiều tự nhiên khi Đức Giê-su nói với các môn đệ.
- source_word: οὐδείς ἐστιν ὃς
  choice: không một ai
  rationale: Diễn đạt tự nhiên lực phủ định phổ quát của cấu trúc hiện hữu trong tiếng Hy Lạp.
- source_word: ἀφῆκεν
  choice: đã rời bỏ
  rationale: “Đã rời bỏ” diễn đạt một hành động từ bỏ hoặc rời xa đã xảy ra vì việc theo Đức Giê-su, nhưng không mang sắc thái tuyệt tình mạnh như “ruồng bỏ” hay “bỏ rơi”.
- source_word: οἰκίαν
  choice: nhà cửa
  rationale: “Nhà cửa” là cách nói tự nhiên trong danh sách tài sản và quan hệ gia đình, chỉ nơi ở hoặc cơ nghiệp mà không chuyển nghĩa thành toàn bộ gia hộ.
- source_word: ἀδελφοὺς
  choice: anh em trai
  rationale: Nguyên ngữ dùng danh từ giống đực số nhiều và ngay sau đó nêu riêng chị em gái; cách dịch này giữ sự phân biệt ấy.
- source_word: ἀδελφὰς
  choice: chị em gái
  rationale: Dịch trực tiếp danh từ chỉ những người chị hoặc em gái, song song với “anh em trai”.
- source_word: μητέρα
  choice: mẹ
  rationale: Tương đương trực tiếp, tự nhiên trong tiếng Việt.
- source_word: πατέρα
  choice: cha
  rationale: Tương đương trực tiếp; “cha” phù hợp văn phong Kinh Thánh trang trọng mà vẫn dễ hiểu.
- source_word: τέκνα
  choice: con cái
  rationale: τέκνα chỉ chung con cháu trực hệ không phân biệt giới tính; “con cái” là cách diễn đạt tự nhiên và chính xác.
- source_word: ἀγρούς
  choice: ruộng đất
  rationale: ἀγρός chỉ ruộng đồng hoặc phần đất canh tác. “Ruộng đất” cụ thể, tự nhiên và không diễn giải rộng thành toàn bộ tài sản.
- source_word: ἕνεκεν ἐμοῦ καὶ ἕνεκεν τοῦ εὐαγγελίου
  choice: vì tôi và vì Tin Mừng
  rationale: Giữ nguyên hai lý do được lặp lại rõ ràng trong nguyên ngữ, không gộp chúng thành một ý.
theological_decisions:
- issue: Diễn đạt việc rời gia đình và tài sản mà không cường điệu thành chối bỏ mọi nghĩa vụ gia đình
  choice: đã rời bỏ nhà cửa, anh em trai, chị em gái, mẹ, cha, con cái hay ruộng đất
  alternative: đã ruồng bỏ… / đã bỏ rơi…
  rationale: ἀφῆκεν có thể chỉ việc rời đi hoặc từ bỏ trong cái giá của đời môn đệ. “Rời bỏ” giữ sức nặng ấy nhưng không tự ý khẳng định sự ruồng bỏ về đạo đức.
- issue: Quan hệ giữa việc làm này vì Đức Giê-su và vì Tin Mừng
  choice: vì tôi và vì Tin Mừng
  alternative: vì tôi, tức là vì Tin Mừng
  rationale: Nguyên văn đặt hai cụm song song bằng καί. Bản dịch không đồng nhất hoặc phân tách về thần học nhiều hơn điều câu văn thực sự nói.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ câu chưa khép về cú pháp vì câu Hy Lạp tiếp tục sang câu 30; dấu phẩy cuối phản ánh phần trích được cung cấp. Dùng “Đức Giê-su” theo lối gọi kính trọng phổ biến trong tiếng Việt, và “Tin Mừng” là thuật ngữ thông dụng, trang trọng.
