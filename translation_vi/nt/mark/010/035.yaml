  text: Καὶ προσπορεύονται αὐτῷ Ἰάκωβος καὶ Ἰωάννης ⸀οἱ υἱοὶ Ζεβεδαίου λέγοντες ⸀αὐτῷ· Διδάσκαλε, θέλομεν ἵνα ὃ ἐὰν αἰτήσωμέν ⸀σε ποιήσῃς ἡμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/035.yaml
  text: And James and John[a], the sons of Zebedee, came to him and said to him, “Teacher, we want you to do for us whatever we ask of you.”
translation:
  language: vi
  text: 'Gia-cơ và Giăng, hai con trai của Xê-bê-đê, đến gần Chúa Giê-su[a] và thưa: “Thưa Thầy, chúng con muốn Thầy làm cho chúng con bất cứ điều gì chúng con xin Thầy.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “tiến đến gần Ngài.” Động từ Hy Lạp diễn tả sự chuyển động về phía Chúa Giê-su.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσπορεύονται αὐτῷ
  choice: đến gần Đức Chúa Jêsus
  rationale: Động từ hiện tại lịch sử diễn tả chuyển động về phía Ngài; “đến gần” tự nhiên và giữ rõ sắc thái chuyển động. Danh xưng được nêu thay cho đại từ để câu tiếng Việt rõ chủ thể quy chiếu.
- source_word: οἱ υἱοὶ Ζεβεδαίου
  choice: hai con trai của Xê-bê-đê
  rationale: Giữ cấu trúc đồng vị nhận diện của tiếng Hy Lạp; thêm “hai” theo hai tên vừa nêu để tiếng Việt tự nhiên.
- source_word: λέγοντες αὐτῷ
  choice: và thưa
  rationale: Chuyển phân từ thành động từ hữu hạn cho lời kể tự nhiên; “thưa” phù hợp với cách hai môn đồ kính cẩn nói với Thầy.
- source_word: Διδάσκαλε
  choice: Thưa Thầy
  rationale: Διδάσκαλος chỉ người dạy; “Thầy” là cách xưng hô hiện đại, tự nhiên và chính xác trong ngữ cảnh môn đồ.
- source_word: θέλομεν
  choice: chúng con muốn
  rationale: Diễn đạt trực tiếp ý muốn như nguyên văn; đại từ “chúng con” phù hợp quan hệ môn đồ với Thầy mà không làm nhẹ yêu cầu.
- source_word: ὃ ἐὰν αἰτήσωμέν σε
  choice: bất cứ điều gì chúng con xin
  rationale: ὃ ἐάν mang ý bất định, được diễn đạt bằng “bất cứ điều gì”; “xin” tự nhiên trong một lời thỉnh cầu.
- source_word: ποιήσῃς ἡμῖν
  choice: Thầy làm cho chúng con
  rationale: Giữ nghĩa rộng của ποιέω là “làm”, không diễn giải hẹp thành “ban” hay “chấp thuận”.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Đức Chúa Jêsus” trong lời kể, còn trong lời thoại dùng cặp xưng hô “Thầy—chúng con” để thể hiện quan hệ thầy trò. Dấu hiện tại lịch sử của tiếng Hy Lạp được chuyển sang lối kể tự nhiên trong tiếng Việt.
