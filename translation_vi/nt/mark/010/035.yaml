  to: 'Gia-cơ và Giăng, hai con trai của Xê-bê-đê, đến gần Chúa Giê-su[a] và thưa: “Thưa Thầy, chúng con muốn Thầy làm cho chúng con bất cứ điều gì chúng con xin Thầy.”'
  rationale: Bản sửa làm rõ ότι lời xin được hướng đến Thầy, đồng thời giữ động từ “làm” cho ποιήσῃς thay vì thu hẹp nghĩa thành “ban” hoặc “chấp thuận.” Danh xưng và chính tả được chuẩn hóa theo cách dùng tiếng Việt hiện đại. Chú thích được chỉnh để phản ánh phương án dịch sát hơn cho προσπορεύονται.
  reviewer_model: gpt-5.6-terra
