  text: καὶ ὃς ⸀ἂν θέλῃ ⸂ἐν ὑμῖν εἶναι⸃ πρῶτος, ἔσται πάντων δοῦλος·
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/044.yaml
  text: And whoever wants to be first among you will be the servant of all[a].
translation:
  language: vi
  text: Và ai muốn đứng đầu trong anh em thì sẽ là nô lệ của mọi người.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đầy tớ của mọi người.” Từ Hy Lạp ở đây là doulos, mạnh hơn từ chỉ “người phục vụ” trong câu trước, nên bản dịch dùng “nô lệ” để giữ sự tương phản.'
    reason: Nêu phương án dịch nhẹ hơn nhưng giải thích vì sao chính văn giữ nghĩa mạnh của δοῦλος.
lexical_decisions:
- source_word: ὃς ἂν θέλῃ
  choice: ai muốn
  rationale: Đại từ quan hệ đi với ἄν và thể giả định diễn tả một điều kiện khái quát; “ai muốn” tự nhiên trong tiếng Việt và giữ nguyên ý chí, mong muốn.
- source_word: ἐν ὑμῖν
  choice: trong anh em
  rationale: Trong ngữ cảnh thứ bậc của cộng đồng môn đồ, cụm này chỉ vị trí giữa họ; “trong anh em” vừa tự nhiên vừa giữ sắc thái nội bộ nhóm.
- source_word: πρῶτος
  choice: đứng đầu
  rationale: Từ này nói đến vị trí hàng đầu về thứ bậc hoặc prominence; “đứng đầu” diễn đạt rõ ý xã hội hơn cách dịch đơn lẻ “đầu tiên”.
- source_word: ἔσται
  choice: sẽ làm
  rationale: Giữ hình thức tương lai của động từ εἰμί, đồng thời “làm nô lệ” là cách kết hợp tự nhiên trong tiếng Việt. Trong ngữ cảnh, lời này vẫn mang sức nặng chuẩn mực mà không cần đổi thành “phải”.
- source_word: πάντων
  choice: của mọi người
  rationale: Sở hữu cách số nhiều đi với δοῦλος diễn tả sự lệ thuộc/phục vụ đối với tất cả; “của mọi người” giữ phạm vi phổ quát.
- source_word: δοῦλος
  choice: nô lệ
  rationale: δοῦλος mạnh hơn διάκονος ở câu trước, chỉ địa vị bị lệ thuộc và thấp kém. “Nô lệ” bảo toàn sự gia tăng cường độ này, thay vì san bằng cả hai từ thành “người phục vụ” hoặc “đầy tớ”.
theological_decisions:
- issue: Cách dịch δοῦλος trong lời dạy về tư cách môn đồ
  choice: nô lệ
  alternative: đầy tớ; người phục vụ
  rationale: Ngữ cảnh đảo ngược tham vọng địa vị bằng sự tự hạ triệt để. Vì câu 43 dùng διάκονος còn câu 44 dùng từ mạnh hơn là δοῦλος, “nô lệ” giữ được sự tương phản và không làm nhẹ đi sức căng của lời dạy.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh em” để nói với tập thể môn đồ; “đứng đầu” diễn tả thứ bậc tự nhiên hơn “là đầu tiên”; “nô lệ” cố ý giữ sức nặng lịch sử-xã hội của nguyên ngữ.
