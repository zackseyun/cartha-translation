  source_fidelity: Cần chỉnh “sẽ làm nô lệ” thành “sẽ là nô lệ”. Động từ ἔσται là hình thức tương lai của “là”; cách sửa này trực tiếp hơn và tránh sắc thái “làm việc như một nô lệ” hoặc “trở thành nô lệ”. Các thành tố còn lại truyền đạt đúng điều kiện khái quát, địa vị hàng đầu trong nhóm, và phạm vi “mọi người”.
  naturalness: “Và ai muốn đứng đầu trong anh em thì sẽ là nô lệ của mọi người” là câu tiếng Việt hiện đại, rõ ràng và phù hợp văn phong trang trọng. “Trong anh em” phù hợp ngữ cảnh lời nói với tập thể môn đồ.
  terminology: Giữ “nô lệ” là phù hợp cho δοῦλος và bảo toàn sự tăng cường so với διάκονος ở câu trước. Chú thích nêu phương án nhẹ hơn cùng lý do lựa chọn chính văn, không áp đặt diễn giải giáo phái.
