id: MRK.10.45
reference: Mark 10:45
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ γὰρ ὁ υἱὸς τοῦ ἀνθρώπου οὐκ ἦλθεν διακονηθῆναι ἀλλὰ διακονῆσαι καὶ δοῦναι τὴν ψυχὴν αὐτοῦ λύτρον ἀντὶ πολλῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/045.yaml
  text: For even the Son of Man did not come to be served[a], but to serve, and to give his life as a ransom for many.
translation:
  language: vi
  text: Vì ngay cả Con Người cũng không đến để được phục vụ, nhưng để phục vụ và hiến mạng sống mình làm giá chuộc thay cho nhiều người.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ γὰρ
  choice: Vì ngay cả
  rationale: “Vì” giữ chức năng giải thích, làm nền cho lời dạy ngay trước đó; “ngay cả” giữ sắc thái nhấn mạnh của καί và tự nhiên trong tiếng Việt.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Con Người
  rationale: Đây là danh xưng quen thuộc Chúa Giê-su dùng để chỉ chính mình, đồng thời bảo toàn âm hưởng liên văn bản, đặc biệt với Đa-ni-ên 7.
- source_word: οὐκ ἦλθεν
  choice: không đến
  rationale: Chuyển ngữ trực tiếp động từ chỉ sự đến, với các động từ nguyên mẫu tiếp theo diễn tả mục đích.
- source_word: διακονηθῆναι
  choice: để được phục vụ
  rationale: Cách nói hiện đại, rõ nghĩa và cho phép giữ nguyên sự đối xứng với διακονῆσαι.
- source_word: ἀλλὰ διακονῆσαι
  choice: nhưng để phục vụ
  rationale: Lặp lại cùng một gốc từ “phục vụ” làm nổi bật sự đảo ngược có chủ ý giữa được người khác phục vụ và phục vụ người khác.
- source_word: δοῦναι
  choice: hiến
  rationale: Trong ngữ cảnh tự nguyện trao mạng sống đến mức chịu chết, “hiến” tự nhiên và trang trọng hơn “cho”, nhưng không thêm chủ thể nhận hay cách thức không có trong nguyên văn.
- source_word: τὴν ψυχὴν αὐτοῦ
  choice: mạng sống mình
  rationale: ψυχή ở đây chỉ sự sống được trao đi trong cái chết, không chỉ phần phi vật chất thường được gọi là “linh hồn”. Đại từ phản thân “mình” tự nhiên trong tiếng Việt.
- source_word: λύτρον
  choice: giá chuộc
  rationale: Diễn đạt một khoản giá được trao để giải thoát, giữ được nội dung cụ thể và sức nặng thần học của λύτρον.
- source_word: ἀντὶ πολλῶν
  choice: thay cho nhiều người
  rationale: ἀντί trong cấu trúc này mang sắc thái thay thế hoặc trao đổi; “thay cho” thể hiện lực từ vựng ấy rõ ràng và tự nhiên hơn chữ “cho” vốn có thể mơ hồ trong tiếng Việt.
theological_decisions:
- issue: Sắc thái của ἀντί trong lời nói về giá chuộc
  choice: Dịch “thay cho nhiều người” ngay trong chính văn.
  alternative: “cho nhiều người” hoặc “vì nhiều người”
  rationale: ἀντί thường biểu thị sự thay thế hoặc trao đổi. “Thay cho” bảo toàn sắc thái này mà không giải thích thêm cơ chế cứu chuộc hay áp đặt một hệ thống thần học riêng.
- issue: Phạm vi của πολλῶν
  choice: Giữ nguyên “nhiều người”.
  alternative: “mọi người”
  rationale: Nguyên văn dùng πολλῶν, không dùng từ chỉ “tất cả”. Bản dịch giữ nguyên cách diễn đạt và không tự giải quyết mối liên hệ thần học giữa “nhiều người” tại đây với các đoạn Kinh Thánh khác.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ nhịp đối lập “không đến để được phục vụ, nhưng để phục vụ”; dùng “Con Người” như danh xưng đã định hình trong tiếng Việt. Không cần chú thích vì sắc thái thay thế của ἀντί đã được thể hiện trực tiếp trong chính văn.
