id: MRK.10.2
reference: Mark 10:2
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸀Καὶ ⸀ἐπηρώτων αὐτὸν εἰ ἔξεστιν ἀνδρὶ γυναῖκα ἀπολῦσαι, πειράζοντες αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/002.yaml
  text: And they were asking him whether it is lawful for a man to divorce a wife[a], testing him.
translation:
  language: vi
  text: Họ cứ hỏi Ngài xem một người đàn ông có được phép ly dị vợ không[a], nhằm thử Ngài.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “một người chồng có được phép ly dị vợ mình không”.'
    reason: ἀνήρ có thể có nghĩa là “người đàn ông” hoặc “người chồng”, và tiếng Hy Lạp không có từ sở hữu đi kèm γυνή.
lexical_decisions:
- source_word: ἐπηρώτων
  choice: cứ hỏi
  rationale: Thì chưa hoàn thành diễn tả hành động đang tiếp diễn hoặc lặp lại; “cứ hỏi” truyền đạt sắc thái ấy tự nhiên trong tiếng Việt.
- source_word: ἔξεστιν
  choice: có được phép
  rationale: Trong cuộc tranh luận về ly dị, từ này nói đến điều được luật pháp hoặc tập tục cho phép, chứ không chỉ nói đến khả năng thực hiện.
- source_word: ἀνδρὶ
  choice: một người đàn ông
  rationale: ἀνήρ có thể chỉ “người đàn ông” hoặc “người chồng”. Cách dịch này giữ hình thức khái quát của câu Hy Lạp, còn bối cảnh hôn nhân được thể hiện qua “ly dị vợ”.
- source_word: γυναῖκα
  choice: vợ
  rationale: Trong ngữ cảnh của ἀπολῦσαι và vấn đề ly dị, γυνή chỉ người vợ, không phải một phụ nữ nói chung. Tiếng Việt không nhất thiết phải thêm từ sở hữu trong cấu trúc này.
- source_word: ἀπολῦσαι
  choice: ly dị
  rationale: Dù động từ này cũng có thể mang nghĩa “thả ra” hoặc “cho đi”, trong ngữ cảnh pháp lý về hôn nhân, nghĩa thành ngữ là chấm dứt quan hệ vợ chồng.
- source_word: πειράζοντες
  choice: nhằm thử
  rationale: Phân từ diễn tả mục đích thăm dò mang tính đối nghịch. “Thử” trực tiếp hơn “cám dỗ” và ít diễn giải quá mức hơn “gài bẫy”.
- source_word: Καὶ
  choice: Họ
  rationale: Liên từ Καὶ nối tiếp mạch kể; trong tiếng Việt, không dịch thành “và” ở đầu câu vẫn giữ được diễn tiến tự nhiên mà không thêm sắc thái thời gian.
theological_decisions:
- issue: Cách dịch ἀνδρὶ trong câu hỏi pháp lý về hôn nhân
  choice: một người đàn ông
  alternative: người chồng
  rationale: Giữ nghĩa khái quát và hình thức giống đực số ít của nguyên văn, đồng thời không phủ nhận nghĩa “người chồng”, vốn được ghi nhận trong chú thích.
- issue: Mức độ diễn giải ý định của πειράζοντες
  choice: nhằm thử Ngài
  alternative: để gài bẫy Ngài
  rationale: Nguyên văn cho thấy họ thử Đức Giê-su nhưng không nói rõ bằng chính từ này rằng đó là một cái bẫy; vì vậy bản dịch giữ sự căng thẳng mà không diễn giải thêm động cơ.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Ngài” để chỉ Đức Giê-su theo mạch văn. “Cứ hỏi” thể hiện thể chưa hoàn thành; “có được phép” giữ sắc thái pháp lý; chú thích bảo lưu khả năng hiểu cặp từ ἀνήρ–γυνή là “chồng–vợ”.
