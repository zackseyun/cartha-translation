revisions:
- from: 'Đức Giê-su gọi họ lại và nói: “Anh em biết rằng những người được xem là lãnh đạo các dân[a] thì thống trị dân mình, và những người quyền thế của họ thì lấy quyền mà áp chế họ.”'
  to: 'Đức Giê-su gọi họ đến gần mình và nói với họ: “Anh em biết rằng những người được xem là người cai trị các dân[a] thì thống trị họ, và những người quyền thế của họ thì dùng quyền mà áp chế họ.”'
  rationale: Bản sửa thay “lãnh đạo” bằng “người cai trị” để phản ánh ἄρχειν chính xác hơn; thay “dân mình” bằng “họ” để không thêm ý sở hữu và duy trì cấu trúc song song của nguyên ngữ. “Đến gần mình” và “với họ” làm rõ các yếu tố có mặt trong câu Hy Lạp. Chú thích giữ nguyên lựa chọn thay thế hợp lệ cho τῶν ἐθνῶν.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T07:41:01Z'
review_pass:
  verdict: revise
  source_fidelity: Bản nháp phản ánh tốt cấu trúc và sắc thái phê phán của hai động từ chỉ việc sử dụng quyền lực. Tuy nhiên, “lãnh đạo” rộng hơn ἄρχειν (“cai trị, cầm quyền”) và vì thế làm giảm nét cai trị trong nguyên ngữ. “Dân mình” cũng diễn giải đại từ αὐτῶν thành quan hệ sở hữu không được nêu trực tiếp; giữ “họ” sẽ sát hơn với hai mệnh đề song song.
  naturalness: Câu nhìn chung tự nhiên, trang trọng và dễ hiểu. “Đức Giê-su gọi họ đến gần mình và nói với họ” diễn đạt rõ hành động προσκαλεσάμενος và đối tượng gián tiếp của λέγει mà vẫn tự nhiên trong tiếng Việt hiện đại. “Dùng quyền mà áp chế” tự nhiên hơn “lấy quyền mà áp chế.”
  terminology: “Các dân” là một lựa chọn có thể bảo toàn độ rộng của τῶν ἐθνῶν; chú thích “Hay ‘dân ngoại’” bảo lưu cách hiểu theo ngữ cảnh. “Người cai trị” chính xác hơn “lãnh đạo” cho ἄρχειν. “Người quyền thế” phù hợp với οἱ μεγάλοι, không gán chức danh cụ thể.
  issues:
  - severity: medium
    issue: “lãnh đạo” dịch οἱ δοκοῦντες ἄρχειν
    rationale: “Lãnh đạo” có thể chỉ người hướng dẫn hay đứng đầu mà không nhất thiết là người nắm quyền cai trị. ἄρχειν trong ngữ cảnh này cần được phản ánh bằng “cai trị” hoặc tương đương.
  - severity: low
    issue: “thống trị dân mình” dịch αὐτῶν
    rationale: “Dân mình” thêm quan hệ sở hữu và làm câu kém song song với đại từ “họ” ở mệnh đề sau. Nguyên văn chỉ nói họ thống trị “họ”, tức các dân mà họ cai trị.
  - severity: low
    issue: Thiếu diễn đạt tường minh hướng “đến với mình” và đối tượng “với họ”
    rationale: Bản nháp vẫn hiểu được, nhưng προσκαλεσάμενος αὐτούς và λέγει αὐτοῖς đều được nêu rõ trong câu Hy Lạp; bổ sung nhẹ giúp bản dịch đầy đủ mà không gượng.
