language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸂καὶ προσκαλεσάμενος αὐτοὺς ὁ Ἰησοῦς⸃ λέγει αὐτοῖς· Οἴδατε ὅτι οἱ δοκοῦντες ἄρχειν τῶν ἐθνῶν κατακυριεύουσιν αὐτῶν καὶ οἱ μεγάλοι αὐτῶν κατεξουσιάζουσιν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/042.yaml
  text: And Jesus called them to himself and said to them[a], “You know that those who are considered rulers of the Gentiles lord it over them[b], and their great ones exercise authority over them.”
translation:
  language: vi
  text: 'Đức Giê-su gọi họ đến gần mình và nói với họ: “Anh em biết rằng những người được xem là người cai trị các dân[a] thì thống trị họ, và những người quyền thế của họ thì dùng quyền mà áp chế họ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “dân ngoại.”
    reason: lexical_alternative
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: gọi họ lại
  rationale: Diễn đạt tự nhiên hành động Đức Giê-su gọi các môn đệ đến với mình trước khi nói, đồng thời giữ sắc thái của thể trung gian.
- source_word: λέγει
  choice: nói
  rationale: Thì hiện tại lịch sử trong tiếng Hy Lạp được chuyển thành lối kể tự nhiên trong tiếng Việt; trong cấu trúc này, “gọi… và nói” không cần đánh dấu thì quá khứ.
- source_word: Οἴδατε
  choice: Anh em biết
  rationale: οἶδα có hình thức hoàn thành nhưng mang nghĩa hiện tại; “biết” là cách diễn đạt trực tiếp và tự nhiên.
- source_word: οἱ δοκοῦντες ἄρχειν
  choice: những người được xem là lãnh đạo
  rationale: Giữ sắc thái được nhìn nhận hoặc được coi là người cai trị, không biến câu thành lời phủ nhận rằng họ thực sự có quyền.
- source_word: τῶν ἐθνῶν
  choice: các dân
  rationale: ἔθνη có thể chỉ các dân tộc hoặc dân ngoại. “Các dân” giữ độ rộng từ vựng của nguyên文 và phù hợp với lời nói về cơ cấu cai trị; phương án “dân ngoại” được ghi chú.
- source_word: κατακυριεύουσιν
  choice: thống trị
  rationale: Truyền đạt việc dùng quyền từ trên xuống với sắc thái áp đảo, mạnh hơn từ trung tính “cai trị”.
- source_word: οἱ μεγάλοι αὐτῶν
  choice: những người quyền thế của họ
  rationale: μέγαλοι ở đây chỉ những người có địa vị và thế lực; cách dịch này tự nhiên hơn “những người lớn” và không gán một chức vụ cụ thể.
- source_word: κατεξουσιάζουσιν
  choice: lấy quyền mà áp chế
  rationale: Giữ cả ý thực thi quyền lực và sắc thái lấn át của động từ có tiền tố κατά, đồng thời tạo sự song song với “thống trị” mà không đồng nhất hai động từ.
theological_decisions:
- issue: Nghĩa của τῶν ἐθνῶν
  choice: các dân
  alternative: dân ngoại
  rationale: Nguyên ngữ cho phép cả nghĩa rộng “các dân” lẫn nghĩa theo bối cảnh Do Thái là “dân ngoại.” Bản chính giữ cách nói rộng, còn chú thích bảo tồn cách hiểu theo bối cảnh.
- issue: Sắc thái của δοκοῦντες
  choice: được xem là lãnh đạo
  alternative: có vẻ cai trị
  rationale: Cụm từ nhấn mạnh cách họ được nhìn nhận trong xã hội, không nhất thiết hàm ý quyền lực của họ chỉ là bề ngoài. Cách dịch duy trì sự mơ hồ giữa sự công nhận và vẻ bề ngoài mà không áp đặt giọng mỉa mai.
translation_notes:
  register: Văn phong hiện đại, trang trọng nhưng dễ hiểu. “Anh em” phù hợp với lời Đức Giê-su nói trực tiếp với nhóm môn đệ. Hai động từ quyền lực được phân biệt bằng “thống trị” và “lấy quyền mà áp chế,” giữ sắc thái phê phán và nhịp song song của câu Hy Lạp.
