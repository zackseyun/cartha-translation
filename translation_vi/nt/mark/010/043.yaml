  naturalness: “Giữa các con” và “người phục vụ các con” có thể hiểu được, nhưng “giữa anh em” và “người phục vụ anh em” tự nhiên hơn trong văn phong Kinh Thánh tiếng Việt hiện đại, đồng thời vẫn trang trọng và dễ hiểu. “Trở nên lớn” giữ được nghĩa địa vị của μέγας mà không biến thành ý nghĩa chỉ tuổi tác trong ngữ cảnh này.
