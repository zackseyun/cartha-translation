  text: οὐχ οὕτως δέ ⸀ἐστιν ἐν ὑμῖν· ἀλλ’ ὃς ⸀ἂν θέλῃ ⸂μέγας γενέσθαι⸃ ἐν ὑμῖν, ἔσται ὑμῶν διάκονος,
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/043.yaml
  text: But it is not so among you[a]. Instead, whoever wants to become great among you will be your servant[b],
translation:
  language: vi
  text: Nhưng giữa anh em thì không như vậy.[a] Trái lại, ai muốn trở nên lớn giữa anh em thì sẽ là người phục vụ anh em.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Nhưng giữa anh em không phải như thế.”'
    reason: lexical_alternative
  - marker: b
    text: 'Trong ngữ cảnh, động từ tương lai “sẽ là” cũng có thể mang nghĩa “phải là”: ai muốn trở nên lớn giữa anh em thì phải là người phục vụ anh em.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὐχ οὕτως δέ ἐστιν ἐν ὑμῖν
  choice: Nhưng giữa các con thì không như vậy
  rationale: Diễn đạt tự nhiên cấu trúc phủ định về cách thức; “nhưng” thể hiện sắc thái tương phản của δέ với lối cai trị vừa được nói đến.
- source_word: ἀλλ’
  choice: Trái lại
  rationale: Thể hiện sự đối lập mạnh và hướng sang chuẩn mực khác mà Chúa Giê-su đặt ra.
- source_word: ὃς ἂν θέλῃ
  choice: ai muốn
  rationale: Cấu trúc đại từ quan hệ đi với ἄν và thể giả định nêu điều kiện khái quát; “ai muốn” tự nhiên và giữ sắc thái ý muốn của θέλω.
- source_word: μέγας γενέσθαι
  choice: trở nên lớn
  rationale: “Trở nên” giữ sắc thái chuyển biến của γενέσθαι, còn “lớn” bảo toàn ngôn ngữ về địa vị của μέγας mà không thu hẹp thành nổi tiếng hay quan trọng.
- source_word: ἐν ὑμῖν
  choice: giữa các con
  rationale: Phù hợp với nghĩa cộng đồng, xã hội trong ngữ cảnh và được dùng nhất quán ở cả hai lần xuất hiện.
- source_word: ἔσται ὑμῶν διάκονος
  choice: sẽ là người phục vụ các con
  rationale: “Sẽ là” giữ hình thức tương lai của ἔσται; “người phục vụ” diễn đạt διάκονος theo nghĩa một người phục vụ người khác, tránh gợi chức vụ giáo hội hoặc đồng nhất với nô lệ.
theological_decisions:
- issue: Sắc thái của động từ tương lai ἔσται trong lời dạy của Chúa Giê-su
  choice: sẽ là người phục vụ các con
  alternative: phải là người phục vụ các con
  rationale: Thì tương lai ở đây có thể mang sức nặng chuẩn định hoặc mệnh lệnh, nhưng bản dịch chính giữ hình thức ngữ pháp Hy Lạp; chú thích bảo tồn cách hiểu “phải là” mà không âm thầm giải quyết sự căng thẳng.
- issue: Cách dịch διάκονος
  choice: người phục vụ
  alternative: đầy tớ; người thi hành chức vụ
  rationale: Trong ngữ cảnh, từ này nhấn mạnh việc khiêm nhường phục vụ trong cộng đồng, không nhất thiết chỉ chức vụ chính thức trong Hội Thánh và cũng không phải thuật ngữ chỉ nô lệ.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “các con” vì Chúa Giê-su đang trực tiếp dạy các môn đồ; cách xưng hô này tự nhiên trong văn cảnh Kinh Thánh tiếng Việt. “Người phục vụ” tránh sắc thái chức danh của “chấp sự” và sắc thái lệ thuộc mạnh hơn của “đầy tớ”.
