source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς ἐμβλέψας αὐτῷ ἠγάπησεν αὐτὸν καὶ εἶπεν αὐτῷ· Ἕν ⸀σε ὑστερεῖ· ὕπαγε ὅσα ἔχεις πώλησον καὶ δὸς ⸀τοῖς πτωχοῖς, καὶ ἕξεις θησαυρὸν ἐν οὐρανῷ, καὶ δεῦρο ἀκολούθει ⸀μοι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/021.yaml
  text: 'And Jesus[a], looking at him, loved him and said to him, “One thing you lack: go, sell whatever you have and give to the poor, and you will have treasure in heaven; and come, follow me.”'
translation:
  language: vi
  text: 'Đức Giê-su nhìn chăm chú vào người ấy, yêu mến người ấy và nói với người ấy: “Anh còn thiếu một điều: hãy đi, bán những gì anh có[a] và cho người nghèo, thì anh sẽ có kho báu trên trời; rồi hãy đến và theo tôi.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “tất cả những gì anh có.” Cụm từ Hy Lạp ὅσα ἔχεις có thể được diễn đạt là “những gì anh có” hoặc “tất cả những gì anh có”; trong ngữ cảnh, mệnh lệnh bao gồm toàn bộ tài sản của anh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμβλέψας
  choice: nhìn chăm chú
  rationale: Động từ diễn tả một cái nhìn trực tiếp, có chủ ý. “Nhìn chăm chú” chuyển tải sắc thái chú tâm mà vẫn tự nhiên trong tiếng Việt.
- source_word: ἠγάπησεν αὐτόν
  choice: đem lòng yêu mến anh
  rationale: Giữ nguyên lời khẳng định trực tiếp rằng Đức Giê-su yêu mến người ấy, không làm nhẹ thành sự tử tế bên ngoài và cũng không gán thêm một nghĩa thần học chuyên biệt.
- source_word: Ἕν σε ὑστερεῖ
  choice: Anh còn thiếu một điều
  rationale: Danh từ hóa số từ trung tính Ἕν thành “một điều”; cách nói này tự nhiên và giữ nguyên ý về điều hiện còn thiếu.
- source_word: ὕπαγε
  choice: hãy đi
  rationale: Mệnh lệnh chỉ sự ra đi được chuyển dịch trực tiếp, không thêm sắc thái xa cách.
- source_word: ὅσα ἔχεις
  choice: những gì anh có
  rationale: Cụm đại từ quan hệ có thể chỉ “những gì” hoặc “tất cả những gì” người ấy có. Lựa chọn này bám sát cấu trúc Hy Lạp, còn ngữ cảnh cho thấy phạm vi bao quát tài sản của anh.
- source_word: πώλησον
  choice: bán
  rationale: Chuyển dịch trực tiếp mệnh lệnh về việc bán tài sản.
- source_word: δὸς τοῖς πτωχοῖς
  choice: cho người nghèo
  rationale: Tính từ được dùng như danh từ chỉ những người nghèo; “người nghèo” là cách diễn đạt hiện đại, rõ ràng.
- source_word: θησαυρὸν ἐν οὐρανῷ
  choice: kho báu trên trời
  rationale: Cách dịch quen thuộc và chính xác, giữ hình ảnh phần quý báu được tích trữ nơi trời.
- source_word: δεῦρο
  choice: hãy đến
  rationale: Giữ lời mời gọi tiến đến với người đang nói; không cần thêm “đây” vì tiếng Việt đã hàm ý hướng về người nói.
- source_word: ἀκολούθει μοι
  choice: theo tôi
  rationale: Diễn đạt tự nhiên lời kêu gọi làm môn đồ. Dù mệnh lệnh hiện tại có thể gợi sự tiếp diễn, “theo tôi” đã chuyển tải thích đáng trong ngữ cảnh.
theological_decisions:
- issue: Ý nghĩa tình yêu của Đức Giê-su dành cho người ấy
  choice: Dịch thẳng là “đem lòng yêu mến anh”.
  alternative: Hiểu chỉ là thái độ tử tế bên ngoài, hoặc quy định đây là tình yêu tuyển chọn theo một hệ thống thần học.
  rationale: Bản văn nói rõ ἠγάπησεν αὐτόν. Bản dịch giữ tình yêu này là chân thật nhưng không áp đặt một phạm trù tín lý vượt quá câu văn.
- issue: Phạm vi mệnh lệnh liên quan đến tài sản
  choice: Dùng “bán những gì anh có”, đồng thời chú thích khả năng dịch “bán tất cả những gì anh có”.
  alternative: Nói rõ ngay trong chính văn là “bán tất cả những gì anh có”, hoặc làm nhẹ thành lời kêu gọi rộng rãi về lòng hào phóng.
  rationale: ὅσα ἔχεις có thể được diễn đạt theo cả hai cách; ngữ cảnh cho thấy phạm vi toàn bộ, nhưng chính văn giữ hình thức gần với tiếng Hy Lạp và chú thích bảo tồn phương án dịch khác.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Giê-su” theo lối gọi tôn kính phổ biến; đại từ “anh” phù hợp với việc Đức Giê-su nói trực tiếp với một người đàn ông trưởng thành. Dấu chú thích [a] được đặt ngay sau cụm từ mà chú thích giải thích.
