revisions:
- from: 'Đức Giê-su nhìn chăm chú người ấy, đem lòng yêu mến anh và nói: “Anh còn thiếu một điều: hãy đi bán những gì anh có[a] và cho người nghèo, thì anh sẽ có kho báu trên trời; rồi hãy đến theo tôi.”'
  to: 'Đức Giê-su nhìn chăm chú vào người ấy, yêu mến người ấy và nói với người ấy: “Anh còn thiếu một điều: hãy đi, bán những gì anh có[a] và cho người nghèo, thì anh sẽ có kho báu trên trời; rồi hãy đến và theo tôi.”'
  rationale: Sửa giới từ để câu tiếng Việt đúng và tự nhiên, dùng cách diễn đạt trực tiếp hơn cho ἠγάπησεν, và làm rõ hai mệnh lệnh cuối mà không thêm diễn giải. Chú thích được giữ lại, chỉ chỉnh văn phong để phản ánh chính xác tính thay thế về từ ngữ của ὅσα ἔχεις.
  reviewer_model: gpt-5.6-terra
