  verdict: approve
  source_fidelity: Bản dịch truyền đạt đúng cấu trúc khái quát của ὃς ἂν (“Ai… thì”), nghĩa hôn nhân của ἀπολύσῃ (“ly dị”), và hành vi μοιχᾶται (“phạm tội ngoại tình”). Cụm “đối với vợ ấy” bảo tồn được ἐπ’ αὐτήν và quy chiếu rõ về người vợ bị ly dị, không nhầm với người phụ nữ được cưới sau đó.
  naturalness: Câu văn hiện đại, trang trọng và dễ hiểu. “Ai ly dị vợ mình rồi cưới người khác thì…” là cấu trúc tiếng Việt tự nhiên trong ngữ cảnh này. Dù “phạm tội ngoại tình đối với vợ ấy” có sắc thái trang trọng, cách diễn đạt này phù hợp với văn bản Kinh Thánh và cần thiết để giữ lực quy chiếu của tiếng Hy Lạp.
  terminology: “Ngài phán,” “ly dị,” “vợ mình,” và “phạm tội ngoại tình” phù hợp với văn phong Kinh Thánh tiếng Việt hiện đại. Chú thích cho “người khác” giải thích đúng rằng ἄλλην là giống cái, hàm ý một phụ nữ khác.
