id: MRK.10.11
reference: Mark 10:11
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ λέγει αὐτοῖς· Ὃς ⸀ἂν ἀπολύσῃ τὴν γυναῖκα αὐτοῦ καὶ γαμήσῃ ἄλλην μοιχᾶται ἐπ’ αὐτήν,
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/011.yaml
  text: And he says to them[a], “Whoever divorces his wife and marries another commits adultery against her.”
translation:
  language: vi
  text: 'Ngài phán với họ: “Ai ly dị vợ mình rồi cưới người khác[a] thì phạm tội ngoại tình đối với vợ ấy.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay nói rõ hơn: “cưới một người phụ nữ khác.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: phán
  rationale: Động từ hiện tại lịch sử đặc trưng trong lối kể của Mác; tiếng Việt không bắt buộc đánh dấu thì, còn “phán” phù hợp với lời dạy có thẩm quyền của Chúa Giê-su mà vẫn tự nhiên.
- source_word: αὐτοῖς
  choice: với họ
  rationale: Diễn đạt tự nhiên bổ ngữ gián tiếp của động từ nói.
- source_word: Ὃς ἂν
  choice: Ai… thì
  rationale: Cấu trúc điều kiện khái quát, bất định được chuyển thành mẫu câu tiếng Việt tự nhiên “Ai… thì”, không thu hẹp quá mức thành “người đàn ông nào”.
- source_word: ἀπολύσῃ
  choice: ly dị
  rationale: Trong ngữ cảnh hôn nhân, động từ này chỉ việc chấm dứt hôn nhân, không đơn thuần là đuổi hoặc cho đi.
- source_word: τὴν γυναῖκα αὐτοῦ
  choice: vợ mình
  rationale: γυνή ở đây mang nghĩa “vợ” do có sở hữu từ và nằm trong ngữ cảnh ly dị; “mình” quy chiếu tự nhiên về chủ ngữ bất định “ai”.
- source_word: γαμήσῃ ἄλλην
  choice: cưới người khác
  rationale: ἄλλην ở giống cái, hàm ý một phụ nữ khác; bản dịch chính giữ cách nói tiếng Việt gọn và tự nhiên, còn chú thích làm rõ nghĩa hàm ẩn.
- source_word: μοιχᾶται
  choice: phạm tội ngoại tình
  rationale: Cách diễn đạt hiện đại, rõ nghĩa và thông dụng cho hành vi ngoại tình trong ngữ cảnh này.
- source_word: ἐπ’ αὐτήν
  choice: đối với vợ ấy
  rationale: Giữ lại hướng quy chiếu của giới từ ἐπί và nhấn mạnh rằng hành vi ấy là sự vi phạm đối với người vợ bị ly dị; “vợ ấy” làm rõ đại từ giống cái mà không thêm một nhân vật khác.
theological_decisions:
- issue: Có giữ sắc thái của ἐπ’ αὐτήν rằng hành vi ấy là điều sai phạm đối với người vợ hay không
  choice: “phạm tội ngoại tình đối với vợ ấy”
  alternative: “phạm tội ngoại tình” hoặc “phạm tội ngoại tình với người khác”
  rationale: Cụm giới từ có mặt trong tiếng Hy Lạp và không nên bị lược bỏ. Cách dịch này giữ trọng tâm rằng hành động của người chồng xâm phạm người vợ bị ly dị, đồng thời không đồng nhất αὐτήν với người phụ nữ thứ hai.
- issue: Cách chuyển cấu trúc giống đực số ít mang ý nghĩa khái quát
  choice: “Ai… thì”
  alternative: “Người đàn ông nào… thì”
  rationale: “Ai… thì” chuyển đúng tính bất định, khái quát của ὃς ἂν; ngữ cảnh người chồng vẫn được xác định rõ qua cụm “vợ mình”, nên không cần thêm sự giới hạn ngoài văn bản.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “ly dị” và “ngoại tình” là các từ phổ thông hiện nay; giữ “đối với vợ ấy” dù hơi trang trọng để bảo toàn lực nghĩa của ἐπ’ αὐτήν. Dấu chú thích [a] được đặt ngay sau cụm từ mà chú thích giải thích.
