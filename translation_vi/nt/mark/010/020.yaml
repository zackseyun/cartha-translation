revisions:
- from: 'Người ấy thưa với Đức Chúa Jêsus: “Thưa Thầy, con đã giữ tất cả những điều ấy từ thuở trẻ.”'
  to: 'Ông thưa với Người: “Thưa Thầy, tôi đã giữ tất cả những điều ấy từ thuở trẻ.”'
  rationale: Bản sửa giữ nguyên lời tự nhận ở mức không giảm nhẹ hay tăng cường, giữ “Thầy” cho Διδάσκαλε và “đã giữ” cho ἐφυλαξάμην. Đồng thời, bản sửa loại các chi tiết không có trong câu Hy Lạp (tên riêng và đại từ “con”) và cải thiện độ tự nhiên của lời dẫn.
