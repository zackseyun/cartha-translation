  yaml_path: translation/nt/mark/010/020.yaml
  text: And he said to him, “Teacher, I have kept all these things from my youth.”
translation:
  language: vi
  text: 'Ông thưa với Người: “Thưa Thầy, tôi đã giữ tất cả những điều ấy từ thuở trẻ.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δὲ ἔφη αὐτῷ
  choice: Người ấy thưa với Đức Chúa Jêsus
  rationale: δέ là liên từ chuyển ý nhẹ, không nhất thiết phải dịch riêng; ἔφη αὐτῷ là lời nói hướng đến Đức Chúa Jêsus. “Thưa với” diễn đạt tự nhiên sắc thái kính trọng trong lời đối thoại tiếng Việt, còn việc nêu rõ Đức Chúa Jêsus tránh đại từ mơ hồ.
- source_word: Διδάσκαλε
  choice: Thưa Thầy
  rationale: Danh từ ở hô cách chỉ người dạy. “Thưa Thầy” vừa chuyển tải lời xưng hô kính trọng vừa giữ nghĩa thông thường, không thêm sắc thái quyền uy rộng hơn như “Chủ”.
- source_word: ταῦτα πάντα
  choice: tất cả những điều ấy
  rationale: Cách dịch này chỉ về toàn bộ các điều răn vừa được nhắc đến và tự nhiên trong tiếng Việt.
- source_word: ἐφυλαξάμην
  choice: con đã giữ
  rationale: φυλάσσω trong ngữ cảnh điều răn mang nghĩa giữ hoặc tuân giữ. “Đã giữ” gần hình thức Hy Lạp và không diễn giải mạnh hơn thành “đã vâng giữ trọn vẹn”.
- source_word: ἐκ νεότητός μου
  choice: từ thuở trẻ
  rationale: ἐκ với sở hữu cách chỉ điểm khởi đầu trong thời gian. “Từ thuở trẻ” tự nhiên, trang trọng vừa phải và không thu hẹp nghĩa thành thời thơ ấu.
theological_decisions:
- issue: Mức độ tuyệt đối trong lời tự nhận đã giữ các điều răn
  choice: Giữ nguyên lời khẳng định “đã giữ tất cả” của người ấy
  alternative: Thêm từ ngữ như “cố gắng giữ” hoặc “giữ trọn vẹn”
  rationale: Bản Hy Lạp trình bày lời tự nhận trực tiếp nhưng không tự nó xác nhận hay phủ nhận tính đúng đắn của lời ấy. Bản dịch không làm nhẹ cũng không tăng cường lời khẳng định.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và dễ hiểu. Dùng “thưa” và đại từ tự xưng “con” để lời đáp tự nhiên trong tiếng Việt khi một người kính trọng gọi Đức Chúa Jêsus là “Thầy”.
