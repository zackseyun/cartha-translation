    issue: Thêm tên riêng “Đức Chúa Jêsus” vào lời dẫn
    rationale: Bản nguồn chỉ có đại từ αὐτῷ (“với người ấy”), không nêu tên. Dù đối tượng được xác định bởi ngữ cảnh, bản dịch tối ưu-tương-đương nên không đưa tên riêng vào chính câu này.
  - severity: low
    issue: Dùng “con” làm đại từ tự xưng
    rationale: Διδάσκαλε xác định người được gọi là thầy, nhưng không quy định đại từ tự xưng tiếng Việt là “con”. “Tôi” tránh thêm sắc thái quan hệ và vẫn lịch sự nhờ “Thưa Thầy.”}],
  - severity: low
    issue: Cụm “Người ấy thưa với Đức Chúa Jêsus” chưa gọn tự nhiên
    rationale: Trong văn kể hiện đại, “Ông thưa với Người” gọn hơn, không lặp tên riêng và vẫn biểu đạt lời nói hướng đến người đối thoại.
