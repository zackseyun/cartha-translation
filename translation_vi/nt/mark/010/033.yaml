id: MRK.10.33
reference: Mark 10:33
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὅτι Ἰδοὺ ἀναβαίνομεν εἰς Ἱεροσόλυμα, καὶ ὁ υἱὸς τοῦ ἀνθρώπου παραδοθήσεται τοῖς ἀρχιερεῦσιν καὶ ⸀τοῖς γραμματεῦσιν, καὶ κατακρινοῦσιν αὐτὸν θανάτῳ καὶ παραδώσουσιν αὐτὸν τοῖς ἔθνεσιν
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/033.yaml
  text: that[a], ‘Look, we are going up to Jerusalem, and the Son of Man will be handed over to the chief priests and the scribes[b], and they will condemn him to death and hand him over to the Gentiles.’
translation:
  language: vi
  text: 'rằng: “Này, chúng ta đang lên Giê-ru-sa-lem. Con Người sẽ bị nộp[a] cho các trưởng tế và các kinh sư; họ sẽ kết án tử hình Người rồi nộp Người cho dân ngoại[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “trao nộp”; cùng một động từ Hy Lạp được dùng cho cả hai lần “nộp” trong câu này.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “các dân”.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: rằng
  rationale: Từ này giới thiệu nội dung lời Đức Giê-su nói tiếp từ câu trước; “rằng” tự nhiên trong lời dẫn gián tiếp và không thêm sắc thái nguyên nhân.
- source_word: Ἰδοὺ
  choice: Này
  rationale: Giữ chức năng kêu gọi người nghe chú ý bằng một từ trang trọng nhưng vẫn thông dụng trong tiếng Việt hiện đại.
- source_word: ἀναβαίνομεν
  choice: chúng ta đang lên
  rationale: Thể hiện thì hiện tại và chuyển động hướng về Giê-ru-sa-lem; “lên” cũng phù hợp với địa thế và cách nói truyền thống về hành trình đến thành này.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Con Người
  rationale: Giữ nguyên danh xưng tự chỉ giàu ý nghĩa thần học và âm hưởng Đa-ni-ên, thay vì diễn giải thành một cách gọi chung về con người.
- source_word: παραδοθήσεται / παραδώσουσιν
  choice: sẽ bị nộp / sẽ nộp
  rationale: Dùng cùng một động từ tiếng Việt cho cả hai lần xuất hiện nhằm bảo toàn sự lặp lại và chuỗi chuyển giao quyền kiểm soát; tránh thu hẹp lần đầu thành “bị phản bội”.
- source_word: τοῖς ἀρχιερεῦσιν
  choice: cho các trưởng tế
  rationale: Chỉ nhóm lãnh đạo thuộc hàng tư tế, không phải nhiều thượng tế đương nhiệm theo nghĩa đen.
- source_word: τοῖς γραμματεῦσιν
  choice: các kinh sư
  rationale: Cách gọi hiện đại, gọn và dễ hiểu dành cho những người chuyên về Kinh Luật, không diễn giải quá rộng.
- source_word: κατακρινοῦσιν αὐτὸν θανάτῳ
  choice: họ sẽ kết án tử hình Người
  rationale: Diễn đạt tự nhiên trong tiếng Việt, đồng thời giữ sắc thái phán quyết tư pháp và hình phạt chết.
- source_word: τοῖς ἔθνεσιν
  choice: cho dân ngoại
  rationale: Trong trình tự cuộc thương khó, cụm từ chỉ những người không thuộc dân Do Thái, cụ thể là nhà cầm quyền ngoại bang; “dân ngoại” giữ được sự phân biệt lịch sử này.
theological_decisions:
- issue: Cách dịch ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Con Người
  alternative: Con của loài người; Đấng làm người
  rationale: “Con Người” bảo toàn cấu trúc Hy Lạp, danh xưng của Đức Giê-su và âm hưởng Đa-ni-ên mà không giải thích thay cho bản văn.
- issue: Phạm vi nghĩa của παραδίδωμι
  choice: nộp
  alternative: trao nộp; phản bội
  rationale: “Nộp” đủ rộng để diễn tả việc giao vào tay người khác và giữ được chuỗi hành động trong câu; “phản bội” sẽ xác định quá mức động cơ hoặc tác nhân không được nêu tại đây.
- issue: Cách hiểu τοῖς ἔθνεσιν
  choice: dân ngoại
  alternative: các dân
  rationale: Ngữ cảnh nói đến việc chuyển Đức Giê-su từ giới lãnh đạo Do Thái sang những người cai trị không phải Do Thái; cách dịch này giữ nét tương phản lịch sử mà không mở rộng thành một khẳng định thần học khác.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Dùng “Này” thay cho lối cổ “Kìa”; “các trưởng tế” và “các kinh sư” tránh những thuật ngữ giáo phái hoặc quá cổ. Dấu chấm sau mệnh đề mở đầu giúp câu dài rõ nhịp mà không làm thay đổi quan hệ ý nghĩa.
