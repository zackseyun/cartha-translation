  source_fidelity: Bản dịch truyền đạt đúng mạch giải thích của γάρ, mệnh lệnh τιμάω, nghĩa khái quát của κακολογῶν và lực pháp lý của θανάτῳ τελευτάτω. Tuy nhiên, “nguyền rủa” là một cách thu hẹp nghĩa hơi mạnh đối với κακολογέω; bản văn Hy Lạp có thể chỉ lời mắng nhiếc/xúc phạm, không nhất thiết là lời nguyền. Nên chọn cách dịch rộng hơn trong thân bài và nêu “nguyền rủa” ở chú thích.
