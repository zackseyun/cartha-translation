source:
  edition: SBLGNT
  text: Μωϋσῆς γὰρ εἶπεν· Τίμα τὸν πατέρα σου καὶ τὴν μητέρα σου, καί· Ὁ κακολογῶν πατέρα ἢ μητέρα θανάτῳ τελευτάτω·
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/010.yaml
  text: For Moses said[a], ‘Honor your father and your mother,’ and[b], ‘Whoever speaks evil of father or mother must surely die.’
translation:
  language: vi
  text: 'Vì Môi-se đã nói: “Hãy hiếu kính cha mẹ ngươi,” và: “Ai lăng mạ cha hoặc mẹ thì phải chịu chết.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “Ai nguyền rủa cha hoặc mẹ thì chắc chắn phải chết.” Động từ Hy Lạp cũng có thể chỉ việc nói xấu hoặc nói lời xúc phạm. Cụm “phải chịu chết” là công thức pháp lý, sát nghĩa là “phải chết bằng cái chết”; cũng có thể dịch là “phải bị xử tử.”'
    reason: lexical_alternative_and_alternative_reading
lexical_decisions:
- source_word: Μωϋσῆς
  choice: Môi-se
  rationale: Dùng dạng tên riêng quen thuộc trong tiếng Việt.
- source_word: γὰρ
  choice: Vì
  rationale: Giữ chức năng giải thích, đưa ra cơ sở cho lập luận của Chúa Giê-su trong ngữ cảnh.
- source_word: εἶπεν
  choice: đã nói
  rationale: Cách diễn đạt tự nhiên cho động từ dẫn lời trích.
- source_word: Τίμα
  choice: Hãy hiếu kính
  rationale: Trong điều răn về cha mẹ, “hiếu kính” truyền đạt cả sự tôn kính lẫn bổn phận thực tế, đồng thời là cách nói trang trọng và quen thuộc.
- source_word: τὸν πατέρα σου καὶ τὴν μητέρα σου
  choice: cha mẹ ngươi
  rationale: Tiếng Việt tự nhiên gộp hai danh từ thành “cha mẹ”; “ngươi” duy trì sắc thái trực tiếp, trang trọng của lời điều răn.
- source_word: Ὁ κακολογῶν
  choice: Ai nguyền rủa
  rationale: κακολογέω có thể chỉ nói xấu, lăng mạ hoặc nguyền rủa; trong văn cảnh luật pháp liên quan đến cha mẹ, “nguyền rủa” diễn đạt mạnh độ nghiêm trọng mà không thêm chi tiết ngoài động từ.
- source_word: πατέρα ἢ μητέρα
  choice: cha hoặc mẹ
  rationale: Giữ rõ liên từ lựa chọn ἢ và không thêm đại từ sở hữu vốn không có trong mệnh đề Hy Lạp.
- source_word: θανάτῳ τελευτάτω
  choice: thì chắc chắn phải chết
  rationale: Diễn đạt tự nhiên công thức pháp lý nhấn mạnh án tử; “phải chết” giữ hình thức của câu Hy Lạp mà không tự ý xác định tác nhân thi hành.
theological_decisions:
- issue: Cách dịch công thức hình phạt θανάτῳ τελευτάτω
  choice: thì chắc chắn phải chết
  alternative: thì phải bị xử tử
  rationale: Cách chọn giữ được tính bắt buộc và nhấn mạnh của công thức pháp lý, nhưng không quy định rõ cơ chế hay tác nhân như cách dịch bị động “bị xử tử”.
- issue: Phạm vi nghĩa của κακολογῶν
  choice: nguyền rủa
  alternative: nói lời xúc phạm / nói xấu
  rationale: “Nguyền rủa” phù hợp sức nặng của điều luật và là một nghĩa trực tiếp của động từ; chú thích bảo lưu phạm vi nghĩa rộng hơn của từ Hy Lạp.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Hiếu kính” phù hợp ngữ cảnh điều răn; “ngươi” được giữ trong lời trích để tạo sắc thái trang nghiêm. Dấu chú thích [a] đặt ngay sau toàn bộ câu trích thứ hai vì chú thích giải thích cả động từ κακολογέω lẫn công thức hình phạt.
