source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτῇ· Διὰ τοῦτον τὸν λόγον ὕπαγε, ἐξελήλυθεν ⸂ἐκ τῆς θυγατρός σου τὸ δαιμόνιον⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/029.yaml
  text: And he said to her[a], “Because of this word, go; the demon has gone out of your daughter.”
translation:
  language: vi
  text: 'Ngài nói với bà: “Vì lời bà vừa nói[a], bà hãy về đi; quỷ đã ra khỏi con gái bà rồi.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “Vì lời này.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ εἶπεν αὐτῇ
  choice: Ngài nói với bà
  rationale: Cách dịch này chuyển tải trực tiếp lời dẫn truyện. Đại từ “Ngài” phù hợp với văn phong Kinh Thánh trang trọng, tự nhiên khi chủ thể trong ngữ cảnh là Chúa Giê-su; không nhất thiết phải dịch καί bằng “và” khi mở đầu câu tiếng Việt.
- source_word: Διὰ τοῦτον τὸν λόγον
  choice: Vì lời này
  rationale: διά với đối cách diễn tả nguyên nhân, còn λόγος chỉ lời đáp vừa rồi của người phụ nữ. “Vì lời này” giữ được số ít, lực nguyên nhân và sự súc tích của nguyên văn; một cách diễn đạt tự nhiên hơn được ghi ở chú thích.
- source_word: ὕπαγε
  choice: bà hãy về đi
  rationale: Mệnh lệnh ὕπαγε ở đây cho phép người phụ nữ rời đi. Trong ngữ cảnh bà đang ở xa nhà và được báo về tình trạng con gái, “hãy về đi” tự nhiên hơn “hãy đi”, đồng thời giữ sắc thái mệnh lệnh cho phép.
- source_word: ἐξελήλυθεν
  choice: đã ra khỏi ... rồi
  rationale: Thể hoàn thành diễn tả hành động đã hoàn tất với kết quả còn hiệu lực. Cấu trúc “đã ... rồi” thể hiện rõ rằng quỷ đã ra và hiện không còn ở trong cô bé.
- source_word: ἐκ τῆς θυγατρός σου
  choice: khỏi con gái bà
  rationale: ἐκ diễn tả việc quỷ đi ra khỏi người con gái. “Ra khỏi con gái bà” giữ hình ảnh không gian của nguyên văn và tự nhiên trong ngữ cảnh trừ quỷ.
- source_word: τὸ δαιμόνιον
  choice: quỷ
  rationale: δαιμόνιον trực tiếp chỉ một thực thể ma quỷ. “Quỷ” là cách gọi rõ ràng, thông dụng trong tiếng Việt và không thay thế từ của nguyên văn bằng “tà linh” hay một cách giải thích mang tính ẩn dụ.
theological_decisions:
- issue: Cách diễn đạt việc trừ quỷ mà không làm nhẹ đi khẳng định siêu nhiên
  choice: quỷ đã ra khỏi con gái bà rồi
  alternative: tà linh đã rời khỏi con gái bà
  rationale: Nguyên văn gọi rõ thực thể ấy là δαιμόνιον và nói nó đã ra khỏi cô gái. Bản dịch giữ nguyên lời khẳng định về quỷ, không biến nó thành bệnh tật hay ảnh hưởng xấu mang tính ẩn dụ.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Cách xưng hô “Ngài—bà” tôn trọng nhân vật và phù hợp văn cảnh. Dấu “rồi” giúp truyền đạt kết quả còn hiệu lực của thể hoàn thành Hy Lạp.
