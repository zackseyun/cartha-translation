  text: Καὶ ἔλεγεν αὐτοῖς· Καλῶς ἀθετεῖτε τὴν ἐντολὴν τοῦ θεοῦ, ἵνα τὴν παράδοσιν ὑμῶν ⸀τηρήσητε·
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/009.yaml
  text: And he was saying to them[a], “You neatly set aside the commandment of God so that you may keep your tradition.”
translation:
  language: vi
  text: 'Ngài lại nói với họ: “Các ông thật khéo gạt bỏ điều răn của Đức Chúa Trời để giữ truyền thống của mình!”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch sát hơn: “Các ông làm thật tốt việc gạt bỏ điều răn của Đức Chúa Trời để giữ truyền thống của mình.” Từ Hy Lạp ở đây mang ý mỉa mai, chứ không phải khen ngợi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: lại nói
  rationale: Thì vị hoàn thành trong mạch kể có thể mang sắc thái tiếp diễn hoặc chuyển sang lời nói tiếp theo. “Lại nói” tự nhiên trong tiếng Việt và cho thấy Đức Giê-su tiếp tục phát biểu, không biến câu này thành hành động lặp đi lặp lại một cách không chắc chắn.
- source_word: Καλῶς
  choice: thật khéo
  rationale: Trạng từ được dùng với ý mỉa mai. “Thật khéo” truyền đạt lời quở trách châm biếm, tránh khiến người đọc hiểu đây là lời khen thật.
- source_word: ἀθετεῖτε
  choice: gạt bỏ
  rationale: Từ này có nghĩa bác bỏ, vô hiệu hóa hoặc đặt sang một bên. “Gạt bỏ” diễn tả rõ hành động cố ý không coi trọng điều răn, đồng thời tạo thế đối lập tự nhiên với “giữ”.
- source_word: ἐντολὴν τοῦ θεοῦ
  choice: điều răn của Đức Chúa Trời
  rationale: “Điều răn” giữ sắc thái tôn giáo và thẩm quyền của mệnh lệnh; “Đức Chúa Trời” là cách gọi trang trọng, quen thuộc trong văn phong Kinh Thánh tiếng Việt.
- source_word: ἵνα
  choice: để
  rationale: “Để” diễn đạt tự nhiên quan hệ mục đích của ἵνα trong tiếng Việt hiện đại.
- source_word: παράδοσιν ὑμῶν
  choice: truyền thống của mình
  rationale: παράδοσις chỉ điều được truyền lại; ở đây “truyền thống” là cách dịch gọn và chính xác. Đại từ phản thân “mình” quy chiếu tự nhiên về chủ thể “các ông” và giữ sự tương phản với điều răn của Đức Chúa Trời.
- source_word: τηρήσητε
  choice: giữ
  rationale: “Giữ” diễn đạt đúng nghĩa tuân giữ hoặc duy trì, đồng thời bảo toàn sự đối lập sắc nét giữa việc gạt bỏ điều răn và giữ truyền thống.
theological_decisions:
- issue: Giọng điệu trong lời Đức Giê-su
  choice: Lời quở trách mang tính mỉa mai
  alternative: 'Lời khen theo nghĩa đen: “Các ông làm tốt khi gạt bỏ...”'
  rationale: Trong văn cảnh, Đức Giê-su lên án việc đặt truyền thống của con người cao hơn điều răn của Đức Chúa Trời. “Thật khéo” giữ được ý mỉa mai của καλῶς mà không biến câu nói thành sự tán thành.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” theo mạch quy chiếu đến Đức Giê-su; “các ông” phù hợp với lời đối thoại trực tiếp và giọng quở trách. Dấu chấm than làm rõ sức nặng của lời mỉa mai mà không thêm nội dung giáo lý.
