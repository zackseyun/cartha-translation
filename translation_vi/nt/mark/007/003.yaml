id: MRK.7.3
reference: Mark 7:3
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οἱ γὰρ Φαρισαῖοι καὶ πάντες οἱ Ἰουδαῖοι ἐὰν μὴ πυγμῇ νίψωνται τὰς χεῖρας οὐκ ἐσθίουσιν, κρατοῦντες τὴν παράδοσιν τῶν πρεσβυτέρων,
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/003.yaml
  text: For the Pharisees and all the Jews do not eat unless they wash their hands with a fist[a], holding to the tradition of the elders.
translation:
  language: vi
  text: Vì người Pha-ri-si và tất cả người Do Thái không ăn nếu chưa rửa tay theo một cách thức nhất định[a], bởi họ giữ truyền thống của các trưởng lão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nghĩa của từ Hy Lạp ở đây không chắc chắn; có thể hiểu là “bằng nắm tay”, “đến cổ tay” hoặc “kỹ lưỡng”. Có lẽ từ này chỉ một cách rửa tay theo tập tục.
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: Vì
  rationale: Giữ chức năng giải thích của câu đối với lời kể ngay trước đó.
- source_word: Φαρισαῖοι
  choice: người Pha-ri-si
  rationale: Cách phiên âm quen thuộc trong tiếng Việt cho tên nhóm Do Thái này.
- source_word: πάντες οἱ Ἰουδαῖοι
  choice: mọi người Do Thái
  rationale: Giữ nguyên lối khái quát rộng của bản Hy Lạp, thay vì tự ý thu hẹp thành người Giu-đê hay nhiều người Do Thái.
- source_word: ἐὰν μὴ
  choice: nếu chưa
  rationale: 'Diễn đạt tự nhiên điều kiện phủ định gắn với việc ăn: họ không ăn trước khi đã rửa tay.'
- source_word: πυγμῇ
  choice: theo đúng nghi thức
  rationale: Từ này rất khó xác định, có thể chỉ cách thức hoặc phạm vi rửa tay theo tập tục. Cách dịch trong câu truyền đạt bối cảnh nghi lễ mà không chọn dứt khoát một cách giải thích cụ thể; các khả năng được ghi ở chú thích.
- source_word: νίψωνται τὰς χεῖρας
  choice: rửa tay
  rationale: Cách diễn đạt rõ ràng, tự nhiên cho việc rửa một phần thân thể, ở đây là hai bàn tay.
- source_word: οὐκ ἐσθίουσιν
  choice: không ăn
  rationale: Giữ thì hiện tại mang nghĩa thói quen; không cần thêm tân ngữ vốn không có trong nguyên văn.
- source_word: κρατοῦντες
  choice: bởi họ giữ
  rationale: Diễn tả sự tuân giữ bền chặt; dùng mệnh đề nguyên nhân tự nhiên trong tiếng Việt và phù hợp với quan hệ ngữ cảnh.
- source_word: παράδοσιν τῶν πρεσβυτέρων
  choice: truyền thống của các trưởng lão
  rationale: Giữ cấu trúc sở thuộc của nguyên văn, chỉ truyền thống được truyền lại và gắn với các bậc trưởng lão.
theological_decisions:
- issue: Phạm vi của πάντες οἱ Ἰουδαῖοι
  choice: Giữ cách nói rộng “mọi người Do Thái”.
  alternative: mọi người Giu-đê; nhiều người Do Thái
  rationale: Nguyên văn nói rõ “tất cả/mọi người Do Thái”. Đây là lối khái quát trong lời giải thích của Mác, không nhất thiết là một thống kê tuyệt đối về từng cá nhân.
- issue: Ý nghĩa của πυγμῇ
  choice: Dịch trong câu là “theo đúng nghi thức”, kèm chú thích nêu sự bất định.
  alternative: bằng nắm tay; đến cổ tay; kỹ lưỡng
  rationale: Từ Hy Lạp gây nhiều tranh luận và có lẽ mô tả cách thức hoặc mức độ rửa tay theo tập tục. Không nên biến một cách giải thích chưa chắc chắn thành nghĩa duy nhất.
- issue: Sắc thái của việc rửa tay
  choice: Trình bày đây là tập tục theo truyền thống trưởng lão, không gọi là điều răn trong câu.
  alternative: rửa tay theo luật pháp
  rationale: Câu Hy Lạp quy việc thực hành này cho “truyền thống của các trưởng lão”; gọi đó là luật pháp sẽ đưa thêm một xác định thần học không có trong câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Theo đúng nghi thức” làm rõ đây không đơn thuần là vệ sinh tay, còn chú thích bảo toàn sự mơ hồ thực sự của πυγμῇ. Dấu chú thích [a] được đặt ngay sau cụm từ liên quan.
