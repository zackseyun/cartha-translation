  to: Vì người Pha-ri-si và tất cả người Do Thái không ăn nếu chưa rửa tay theo một cách thức nhất định[a], bởi họ giữ truyền thống của các trưởng lão.
  rationale: Thay “theo đúng nghi thức” bằng “theo một cách thức nhất định” để biểu thị rằng nguyên văn nói đến một cách rửa tay đặc thù, nhưng không đưa một trong các cách giải thích còn tranh luận vào bản văn chính. Chú thích giữ các khả năng chính và neo đúng sau cụm được giải thích. Các phần còn lại trung thành với cú pháp và nội dung nguồn.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T07:40:10Z'
review_pass:
  verdict: revise
  source_fidelity: 'Cụm “theo đúng nghi thức” diễn giải πυγμῇ quá cụ thể: “đúng” và ý về một nghi thức đã được quy định không có trực tiếp trong từ Hy Lạp khó hiểu này. Bản sửa giữ một bổ ngữ chỉ cách thức nhưng không quyết định trước nghĩa đang tranh luận. “Bởi họ giữ” diễn đạt hợp lý phân từ κρατοῦντες như lý do của tập tục.'
  naturalness: “Tất cả người Do Thái” tự nhiên, rõ phạm vi hơn “mọi người Do Thái” trong câu khái quát. “Theo một cách thức nhất định” hơi thận trọng nhưng phù hợp vì từ nguồn không chắc nghĩa; chú thích giải thích sự bất định.
  terminology: “Pha-ri-si,” “Do Thái,” “truyền thống của các trưởng lão” là các thuật ngữ phù hợp và nhất quán. Không gọi tập tục này là luật pháp hay áp đặt một diễn giải nghi lễ cụ thể.
