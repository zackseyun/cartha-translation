  text: ⸂Ἐκεῖθεν δὲ⸃ ἀναστὰς ἀπῆλθεν εἰς τὰ ⸀ὅρια ⸀Τύρου. καὶ εἰσελθὼν εἰς οἰκίαν οὐδένα ἤθελεν γνῶναι, καὶ οὐκ ἠδυνήθη λαθεῖν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/024.yaml
  text: From there he got up and went away to the region of Tyre[a]. After entering a house, he wanted no one to know it[c][b], yet he could not remain hidden.
translation:
  language: vi
  text: Từ đó, Đức Giê-su đứng dậy, đi đến vùng Ty-rơ.[a] Vào một căn nhà, Ngài không muốn ai biết mình đang ở đó,[b] nhưng Ngài không thể ẩn mình được.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “lãnh thổ Ty-rơ”; từ Hy Lạp có thể chỉ khu vực hoặc vùng biên thuộc Ty-rơ, chứ không nhất thiết chỉ đường ranh giới.
    reason: lexical_alternative
  - marker: b
    text: 'Sát nghĩa: “Ngài không muốn ai biết.” Tiếng Hy Lạp không nêu đối tượng của động từ “biết”; điều được ngầm hiểu có thể là sự hiện diện hoặc nơi Ngài đang ở.'
    reason: lexical_alternative
  - marker: c
    text: Cũng có thể dịch là “Ngài không thể thoát khỏi sự chú ý.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐκεῖθεν δὲ
  choice: Từ đó
  rationale: Ἐκεῖθεν chỉ sự di chuyển khỏi địa điểm vừa nói đến; δέ là từ nối nhẹ và có thể được diễn đạt tự nhiên bằng cách chuyển thẳng sang câu mới.
- source_word: ἀναστὰς
  choice: đứng dậy
  rationale: Phân từ bất định quá khứ mở đầu hành động tiếp theo trong trình thuật; cách dịch này giữ được động tác cụ thể và tự nhiên trong tiếng Việt.
- source_word: ἀπῆλθεν
  choice: đi đến
  rationale: Động từ diễn tả việc rời nơi này để đi nơi khác; khi đi với cụm chỉ đích đến, “đi đến” là cách diễn đạt tự nhiên, dù sắc thái rời đi phần nào đã được ngữ cảnh đảm nhận.
- source_word: εἰς τὰ ὅρια Τύρου
  choice: đến vùng Ty-rơ
  rationale: ὅρια ở đây có thể chỉ vùng hay lãnh thổ liên hệ với Ty-rơ, không nhất thiết chỉ đường ranh giới.
- source_word: καὶ εἰσελθὼν εἰς οἰκίαν
  choice: Vào một căn nhà
  rationale: Phân từ mang ý nghĩa thời gian và trình tự; οἰκίαν không có mạo từ nên được hiểu là một căn nhà không xác định.
- source_word: οὐδένα ἤθελεν γνῶναι
  choice: Ngài không muốn ai biết mình đang ở đó
  rationale: Tân ngữ của “biết” được để ngầm trong tiếng Hy Lạp, có lẽ là sự hiện diện hay nơi ở của Đức Giê-su; tiếng Việt cần làm rõ vừa đủ để câu tự nhiên mà không xác định quá mức.
- source_word: καὶ οὐκ ἠδυνήθη λαθεῖν
  choice: nhưng Ngài không thể tránh khỏi bị người ta phát hiện
  rationale: λανθάνω có nghĩa là không bị để ý hoặc thoát khỏi sự chú ý; cách dịch này diễn đạt tự nhiên sự tương phản giữa ý muốn kín đáo và kết quả thực tế.
