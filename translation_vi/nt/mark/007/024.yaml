translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Đức Giê-su” để nêu rõ chủ thể theo mạch văn, rồi dùng đại từ kính trọng “Ngài”. Giữ các phương án nghĩa đáng kể trong chú thích và không thêm cách giải thích thần học.
