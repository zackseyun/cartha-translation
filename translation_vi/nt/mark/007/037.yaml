  to: 'Họ hết sức kinh ngạc và nói: “Ngài đã làm mọi sự đều tốt đẹp[a]. Ngài khiến cả người điếc nghe được lẫn người câm nói được[b].”'
  rationale: Chỉnh cách đặt trạng từ trong lời đánh giá để tiếng Việt tự nhiên hơn và giữ rõ quan hệ của καλῶς với πεποίηκεν. Dùng “cả ... lẫn ...” để biểu đạt hai vế song song của nguyên văn. Điều chỉnh chú thích chéo cho chính xác với cách diễn đạt của Ê-sai 35:5–6, không biến ám chỉ thành lời khẳng định diễn giải trong chính văn.
