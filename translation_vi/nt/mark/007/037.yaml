base_translation:
  language: en
  yaml_path: translation/nt/mark/007/037.yaml
  text: And they were utterly astonished[a], saying, “He has done everything well[b]. He makes even the deaf hear and the mute speak.”
translation:
  language: vi
  text: 'Họ hết sức kinh ngạc và nói: “Ngài đã làm mọi sự đều tốt đẹp[a]. Ngài khiến cả người điếc nghe được lẫn người câm nói được[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch sát hơn: “Ngài đã làm mọi sự cách tốt lành.” Cách nói này có thể gợi lại ngôn ngữ Kinh Thánh về những công việc của Đức Chúa Trời.'
    reason: lexical_alternative
  - marker: b
    text: Câu này gợi lại Ê-sai 35:5–6, nơi người điếc được nghe và lưỡi người không nói được reo ca trong sự phục hồi do Đức Chúa Trời thực hiện.
    reason: cross_reference
lexical_decisions:
- source_word: ὑπερπερισσῶς
  choice: hết sức
  rationale: Trạng từ tăng cường diễn tả mức độ phi thường; “hết sức” truyền đạt sắc thái mạnh một cách tự nhiên trong tiếng Việt hiện đại.
- source_word: ἐξεπλήσσοντο
  choice: kinh ngạc
  rationale: Động từ ở thì chưa hoàn thành diễn tả phản ứng kinh ngạc đang tiếp diễn; kết hợp với “hết sức” vừa rõ nghĩa vừa giữ được cường độ của nguyên văn.
- source_word: λέγοντες
  choice: và nói
  rationale: Phân từ giới thiệu nội dung lời phản ứng của đám đông; cấu trúc phối hợp này tự nhiên hơn trong tiếng Việt.
- source_word: Καλῶς
  choice: thật tốt đẹp
  rationale: Trạng từ đánh giá phẩm chất của mọi việc Chúa Giê-su đã làm. “Tốt đẹp” giữ được cả ý làm tốt và khả năng gợi âm hưởng ngôn ngữ Kinh Thánh mà không diễn giải quá mức.
- source_word: πάντα
  choice: mọi sự
  rationale: Giữ phạm vi bao quát của dạng trung tính số nhiều và có sắc thái trang trọng, tự nhiên phù hợp với văn bản Kinh Thánh.
- source_word: πεποίηκεν
  choice: đã làm
  rationale: Thì hoàn thành chỉ hành động đã hoàn tất nhưng vẫn có ý nghĩa hiện tại; “đã làm” là cách diễn đạt rõ và tự nhiên.
- source_word: κωφοὺς
  choice: người điếc
  rationale: Trong bối cảnh này từ chỉ những người không nghe được; cách dịch trực tiếp, thông dụng và tôn trọng con người.
- source_word: ποιεῖ ἀκούειν
  choice: khiến ... nghe được
  rationale: ποιέω đi với động từ nguyên mẫu diễn tả quan hệ gây khiến; “khiến ... nghe được” trung thành và tự nhiên.
- source_word: ἀλάλους
  choice: người câm
  rationale: Từ này chỉ người không thể nói trong bối cảnh chữa lành; “người câm” ngắn gọn và song song với “người điếc”.
- source_word: λαλεῖν
  choice: nói được
  rationale: Diễn đạt năng lực nói được phục hồi, phù hợp với ngữ cảnh phép chữa lành.
- source_word: καὶ
  choice: còn ... và
  rationale: “Còn” thể hiện ý bổ sung của καί đầu mệnh đề, còn “và” nối hai phép chữa lành, không buộc từ này mang sắc thái nhấn mạnh quá mức.
theological_decisions:
- issue: Khả năng ám chỉ Ê-sai 35:5–6 và âm hưởng về công trình tốt đẹp của Đức Chúa Trời
  choice: Giữ lời tuyên bố của đám đông sát với nguyên văn và nêu các âm hưởng Kinh Thánh trong chú thích.
  alternative: Làm rõ ngay trong chính văn rằng đây là sự ứng nghiệm lời tiên tri hoặc dùng cách diễn đạt nhấn mạnh hơn về công cuộc sáng tạo.
  rationale: Nguyên văn gợi những liên hệ thần học ấy nhưng không giải thích trực tiếp. Bản dịch vì thế bảo tồn âm hưởng và sự căng mở của câu thay vì xác quyết một cách diễn giải riêng.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Ngài” cho chủ thể là Chúa Giê-su; dùng cấu trúc “người điếc/người câm” thay vì danh hóa con người theo tình trạng. Hai dấu chú thích [a], [b] đều được đặt ngay tại nội dung liên quan trong chính văn.
