  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸂ἡ δὲ γυνὴ ἦν⸃ Ἑλληνίς, Συροφοινίκισσα τῷ γένει· καὶ ἠρώτα αὐτὸν ἵνα τὸ δαιμόνιον ἐκβάλῃ ἐκ τῆς θυγατρὸς αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/026.yaml
  text: The woman was a Greek[a], a Syrophoenician by birth[b], and she kept asking him to cast the demon out of her daughter.
translation:
  language: vi
  text: Người phụ nữ ấy là người Hy Lạp[a], gốc Sy-rô Phê-ni-xi[b]. Bà cứ xin Đức Giê-su đuổi quỷ ra khỏi con gái mình.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “người ngoại bang”. Nguyên văn là “người Hy Lạp”; trong bối cảnh này, cách gọi ấy có lẽ cũng cho biết bà không phải là người Do Thái.
    reason: lexical_alternative
  - marker: b
    text: Nguyên văn sát nghĩa là “người Sy-rô Phê-ni-xi về nguồn gốc”, tức thuộc dòng dõi Sy-rô Phê-ni-xi.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἑλληνίς
  choice: người Hy Lạp
  rationale: Giữ nghĩa trực tiếp của từ Hy Lạp, đồng thời chú thích hàm ý bà là người ngoại bang trong bối cảnh này.
- source_word: Συροφοινίκισσα τῷ γένει
  choice: gốc Sy-rô Phê-ni-xi
  rationale: Diễn đạt tự nhiên nguồn gốc dân tộc và địa lý của bà mà không dùng khái niệm chủng tộc theo nghĩa hiện đại.
- source_word: ἠρώτα
  choice: cứ xin
  rationale: Thể chưa hoàn thành cho thấy hành động đang tiếp diễn hoặc lặp lại; “cứ xin” vừa thể hiện phương diện ấy vừa giữ sắc thái khẩn khoản phù hợp ngữ cảnh.
- source_word: ἵνα ... ἐκβάλῃ
  choice: xin ... đuổi ... ra
  rationale: Diễn đạt nội dung lời thỉnh cầu và dùng cách nói tự nhiên trong ngữ cảnh trừ quỷ.
- source_word: τὸ δαιμόνιον
  choice: quỷ
  rationale: Dịch trực tiếp danh từ δαιμόνιον, không đổi thành “tà linh” hay làm nhẹ đi lời khẳng định siêu nhiên của câu.
- source_word: ἐκ τῆς θυγατρὸς αὐτῆς
  choice: ra khỏi con gái mình
  rationale: Giữ nét nghĩa cụ thể của giới từ ἐκ và diễn đạt rõ đối tượng bị quỷ ám.
- source_word: δὲ
  choice: không dịch thành một từ nối riêng
  rationale: Đây là tiểu từ chuyển tiếp nhẹ; trong tiếng Việt, mạch kể tự nhiên không cần thêm “bấy giờ” hoặc “nhưng”, vốn có thể tạo sắc thái không có trong nguyên văn.
theological_decisions:
- issue: Căn tính dân tộc của người phụ nữ
  choice: 'Giữ cả hai mô tả: “người Hy Lạp” và “gốc Sy-rô Phê-ni-xi”.'
  alternative: “người ngoại bang, thuộc dòng dõi Sy-rô Phê-ni-xi”
  rationale: Nguyên văn nêu hai lớp căn tính, có thể liên quan đến văn hóa/tôn giáo và nguồn gốc dân tộc-địa lý; không nên nhập hai lớp ấy làm một.
- issue: Bản chất sự khốn khổ của người con gái
  choice: “đuổi quỷ ra khỏi con gái mình”
  alternative: “đuổi tà linh khỏi con gái mình”
  rationale: Theo đúng δαιμόνιον và không diễn giải lại tuyên bố siêu nhiên của bản văn.
translation_notes:
  register: Tiếng Việt phổ thông hiện đại, trang trọng nhưng dễ hiểu. Dùng “Đức Giê-su” để xác định rõ đại từ αὐτόν theo văn cảnh. Tách thành hai câu nhằm tránh chuỗi vị ngữ nặng nề trong tiếng Việt, nhưng vẫn giữ đầy đủ quan hệ ý nghĩa của nguyên văn.
