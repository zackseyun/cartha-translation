revisions:
- from: 'Ngài phán với họ: “Vậy mà các con cũng thiếu hiểu biết sao? Các con không hiểu rằng bất cứ thứ gì từ bên ngoài đi vào con người đều không thể làm người ấy ô uế[a] sao?”'
  to: 'Ngài nói với họ: “Các anh cũng thiếu hiểu biết đến thế sao? Các anh không hiểu rằng bất cứ điều gì từ bên ngoài đi vào một người cũng không thể làm người đó ô uế[a] sao?”'
  rationale: Sửa “con người” thành “một người” để giữ nghĩa số ít khái quát của ἄνθρωπος và tránh mơ hồ trong tiếng Việt. Điều chỉnh cách xưng hô và trật tự câu cho tự nhiên, đồng thời bảo toàn sắc thái quở trách của Οὕτως καὶ ὑμεῖς và thuật ngữ thanh sạch nghi lễ của κοινόω.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T07:40:13Z'
review_pass:
  verdict: revise
  source_fidelity: Bản dịch chuyển đạt đúng cấu trúc chất vấn, ý nhấn mạnh rằng điều từ bên ngoài đi vào không thể làm ô uế, và giữ được sắc thái thanh sạch nghi lễ của κοινῶσαι. Tuy nhiên, “đi vào con người” trong tiếng Việt thường gợi nghĩa đi vào nhân loại/bản tính người hơn là đi vào một cá nhân, trong khi εἰς τὸν ἄνθρωπον ở đây là cách nói khái quát về một người.
  naturalness: Câu nhìn chung dễ hiểu, nhưng “bất cứ thứ gì ... đi vào con người” kết hợp với “người ấy” tạo chuyển đổi quy chiếu hơi gượng. “một người ... người đó” tự nhiên và rõ hơn. “Các anh” tránh việc thêm sắc thái thân tộc/cha-con vốn không được biểu thị trực tiếp trong tiếng Hy Lạp.
  terminology: “Ô uế” là thuật ngữ thích hợp cho κοινόω trong ngữ cảnh thanh sạch nghi lễ. Chú thích nên dùng “không tinh sạch” như một cách diễn đạt thay thế rõ sắc thái nghi lễ trong tiếng Việt hiện đại.
  issues:
  - severity: medium
    issue: “đi vào con người” không rõ quy chiếu cá nhân
    rationale: τὸν ἄνθρωπον là số ít khái quát, chỉ một người; trong tiếng Việt, “con người” thường chỉ nhân loại hoặc bản tính người. Dùng “một người” phản ánh chính xác hơn ý của câu.
  - severity: low
    issue: “các con” thêm sắc thái quan hệ không được nêu trong câu nguồn
    rationale: Ngôi thứ hai số nhiều chỉ những người nghe; “các anh” là cách xưng hô tự nhiên với các môn đồ trong ngữ cảnh này mà không thêm sắc thái cha-con.
  revised_text: 'Ngài nói với họ: “Các anh cũng thiếu hiểu biết đến thế sao? Các anh không hiểu rằng bất cứ điều gì từ bên ngoài đi vào một người cũng không thể làm người đó ô uế[a] sao?”'
