  text: καὶ λέγει αὐτοῖς· Οὕτως καὶ ὑμεῖς ἀσύνετοί ἐστε; οὐ νοεῖτε ὅτι πᾶν τὸ ἔξωθεν εἰσπορευόμενον εἰς τὸν ἄνθρωπον οὐ δύναται αὐτὸν κοινῶσαι,
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/018.yaml
  text: And he said to them[b][a], “So are you also without understanding? Do you not understand that everything that enters into the man from outside is not able to defile him,”
translation:
  language: vi
  text: 'Ngài nói với họ: “Các anh cũng thiếu hiểu biết đến thế sao? Các anh không hiểu rằng bất cứ điều gì từ bên ngoài đi vào một người cũng không thể làm người đó ô uế[a] sao?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “làm người đó không tinh sạch.” Trong ngữ cảnh này, động từ Hy Lạp mang sắc thái liên quan đến sự thanh sạch theo nghi lễ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: Ngài phán
  rationale: Đây là thì hiện tại lịch sử trong lời kể; tiếng Việt tự nhiên có thể dùng “phán” mà không cần biểu thị thì, đồng thời hợp với lời Đức Chúa Giê-su nói trực tiếp.
- source_word: Οὕτως καὶ ὑμεῖς
  choice: Vậy mà các con cũng
  rationale: Diễn đạt tự nhiên sắc thái ngạc nhiên và quở trách của οὕτως καί, đồng thời làm nổi bật việc chính các môn đồ cũng chưa hiểu.
- source_word: ἀσύνετοί
  choice: thiếu hiểu biết
  rationale: Chỉ sự thiếu nhận thức hoặc sáng suốt, tránh sắc thái miệt thị quá mạnh và giữ liên hệ với νοεῖτε ở câu kế tiếp.
- source_word: νοεῖτε
  choice: hiểu
  rationale: Từ thông dụng, rõ nghĩa, phù hợp với ý nhận thức trong ngữ cảnh.
- source_word: πᾶν τὸ ἔξωθεν εἰσπορευόμενον
  choice: bất cứ thứ gì từ bên ngoài đi vào
  rationale: Chuyển cấu trúc phân từ danh hóa thành mệnh đề quan hệ tự nhiên trong tiếng Việt, vẫn giữ trọn tính khái quát và nguồn gốc “từ bên ngoài”.
- source_word: εἰς τὸν ἄνθρωπον
  choice: vào con người
  rationale: “Con người” truyền đạt ἄνθρωπος theo nghĩa khái quát về một người, không buộc câu vào giới tính nam.
- source_word: κοινῶσαι
  choice: làm ... ô uế
  rationale: Giữ thuật ngữ thanh sạch/ô uế nổi bật trong ngữ cảnh tranh luận về sự thanh sạch, đồng thời vẫn dễ hiểu trong tiếng Việt hiện đại.
theological_decisions:
- issue: Sắc thái thanh sạch nghi lễ của κοινόω
  choice: làm người ấy ô uế
  alternative: làm người ấy không thanh sạch
  rationale: “Ô uế” là cách diễn đạt ngắn gọn, quen thuộc trong văn cảnh Kinh Thánh và không thu hẹp nghĩa vào sự hư hỏng đạo đức; chú thích nêu rõ sắc thái thanh sạch nghi lễ.
translation_notes:
  register: Văn phong hiện đại, trang trọng nhưng dễ hiểu. Dùng “Ngài” cho Đức Chúa Giê-su và “các con” cho lời Ngài nói với các môn đồ; giữ câu hỏi quở trách và thuật ngữ “ô uế” của văn cảnh thanh sạch.
