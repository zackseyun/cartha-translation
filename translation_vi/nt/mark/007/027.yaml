source:
  edition: SBLGNT
  text: ⸂καὶ ἔλεγεν⸃ αὐτῇ· Ἄφες πρῶτον χορτασθῆναι τὰ τέκνα, οὐ γὰρ ⸂καλόν ἐστιν⸃ λαβεῖν τὸν ἄρτον τῶν τέκνων καὶ ⸂τοῖς κυναρίοις βαλεῖν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/027.yaml
  text: And he was saying to her[a], “Let the children be fed first, for it is not good to take the children’s bread and throw it to the little dogs.”
translation:
  language: vi
  text: 'Ngài nói với bà ấy: “Hãy để con cái được ăn no trước, vì không phải là điều tốt khi lấy bánh của con cái mà ném cho chó nhỏ[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “chó nuôi trong nhà” hoặc đơn giản là “chó”. Tiếng Hy Lạp dùng một dạng giảm nhỏ, gợi đến chó nhỏ hoặc chó trong nhà hơn là nhấn mạnh chó hoang.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: nói
  rationale: Thì chưa hoàn thành có thể gợi hành động đang tiếp diễn, nhưng trong lời kể tiếng Việt, “nói” tự nhiên hơn mà không làm thay đổi nội dung câu nói.
- source_word: Ἄφες
  choice: Hãy để
  rationale: Diễn đạt tự nhiên sắc thái cho phép của mệnh lệnh ἀφίημι trong ngữ cảnh này.
- source_word: πρῶτον
  choice: trước
  rationale: Giữ nguyên thứ tự ưu tiên theo thời gian, đồng thời không biến sự ưu tiên ấy thành sự loại trừ vĩnh viễn.
- source_word: χορτασθῆναι
  choice: được ăn no
  rationale: Truyền đạt thể bị động và ý được cho ăn đến no, phù hợp hình ảnh bánh và bữa ăn.
- source_word: τὰ τέκνα
  choice: con cái
  rationale: Giữ hình ảnh gia đình và không xác định thêm tuổi tác hay giới tính.
- source_word: καλόν ἐστιν
  choice: không phải là điều tốt
  rationale: Phản ánh trực tiếp καλόν trong ý nghĩa điều tốt hoặc thích hợp, mà không thu hẹp thành một phán quyết pháp lý hay đạo đức riêng biệt.
- source_word: λαβεῖν
  choice: lấy
  rationale: Tương đương trực tiếp và tự nhiên của động từ trong ngữ cảnh.
- source_word: ἄρτον
  choice: bánh
  rationale: Giữ hình ảnh cụ thể của bánh trong bữa ăn thay vì khái quát hóa thành thức ăn.
- source_word: κυναρίοις
  choice: chó nhỏ
  rationale: Giữ dạng giảm nhẹ của danh từ Hy Lạp và hình ảnh những con chó nhỏ hoặc chó nuôi trong nhà, không thêm sắc thái dễ thương quá mức như “chó con”.
- source_word: βαλεῖν
  choice: ném cho
  rationale: Giữ động tác cụ thể, sinh động của βάλλω thay vì làm nhẹ thành “cho”.
theological_decisions:
- issue: Ý nghĩa ẩn dụ của “con cái” và “chó nhỏ”
  choice: Giữ nguyên ẩn dụ gia đình trong chính văn, không giải nghĩa các đối tượng được ám chỉ.
  alternative: Diễn giải “con cái” là người Do Thái/Israel và “chó nhỏ” là dân ngoại ngay trong bản dịch.
  rationale: Nguyên văn trình bày bằng ẩn dụ; giữ hình ảnh giúp tránh đưa lời giải thích thần học vào chính văn.
- issue: Sắc thái của πρῶτον
  choice: Dịch là “trước”.
  alternative: Lược bỏ sắc thái thứ tự để câu gọn hơn.
  rationale: “Trước” giữ sự căng thẳng quan trọng giữa ưu tiên dành cho con cái và khả năng những người khác được nhận phần sau đó.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Ngài” duy trì cách quy chiếu kính trọng đến Chúa Giê-su; cấu trúc câu giữ hình ảnh bữa ăn và sự đối lập của nguyên văn.
