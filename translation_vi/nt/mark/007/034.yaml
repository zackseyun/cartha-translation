  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἀναβλέψας εἰς τὸν οὐρανὸν ἐστέναξεν, καὶ λέγει αὐτῷ· Εφφαθα, ὅ ἐστιν Διανοίχθητι·
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/034.yaml
  text: And looking up to heaven[a], he sighed and said to him, “Ephphatha,” that is[b], “Be opened.”
translation:
  language: vi
  text: 'Ngài ngước mắt lên trời, thở dài[a] rồi nói với người ấy: “Ép-pha-tha,”[b] nghĩa là: “Hãy mở ra.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “rên lên”; động từ này có thể diễn tả một tiếng thở dài sâu hoặc tiếng rên.'
    reason: lexical_alternative
  - marker: b
    text: Tiếng A-ram “Ép-pha-tha” có nghĩa là “Hãy mở ra.”
    reason: cultural_note
lexical_decisions:
- source_word: ἀναβλέψας
  choice: ngước mắt lên
  rationale: Diễn đạt tự nhiên hành động nhìn lên xảy ra trước động từ chính, đồng thời giữ rõ hướng nhìn lên cao.
- source_word: εἰς τὸν οὐρανόν
  choice: lên trời
  rationale: Trong cử chỉ hướng thượng mang sắc thái cầu nguyện này, “trời” phù hợp hơn cách hiểu đơn thuần là bầu trời.
- source_word: ἐστέναξεν
  choice: thở dài
  rationale: Động từ có thể chỉ tiếng thở dài hoặc rên lên. “Thở dài” tự nhiên và không cường điệu sắc thái cảm xúc; khả năng dịch khác được giữ trong chú thích.
- source_word: λέγει αὐτῷ
  choice: rồi nói với người ấy
  rationale: Dịch hiện tại lịch sử bằng thì kể chuyện tự nhiên trong tiếng Việt; “người ấy” giữ đối tượng nam mà không lặp danh từ ngoài câu nguồn.
- source_word: Εφφαθα
  choice: Ép-pha-tha
  rationale: Giữ lời tiếng A-ram dưới dạng phiên âm phù hợp cách đọc tiếng Việt, như Mác đã bảo tồn âm gốc rồi giải nghĩa ngay sau đó.
- source_word: Διανοίχθητι
  choice: Hãy mở ra
  rationale: Giữ mệnh lệnh số ít và ý nghĩa được mở hoàn toàn; cách diễn đạt này tự nhiên trong tiếng Việt mà không bổ sung rõ bộ phận nào phải mở.
theological_decisions:
- issue: Đối tượng của αὐτῷ
  choice: với người ấy
  alternative: nói gián tiếp với tai hoặc khả năng nói của người đàn ông
  rationale: Đại từ ở cách dữ trong tiếng Hy Lạp tự nhiên nhất chỉ người đàn ông được Đức Giê-su nói với. Bản dịch không xác định thêm bộ phận cơ thể, nhờ đó giữ nguyên độ hàm súc của mệnh lệnh.
- issue: Đối tượng ngầm của Διανοίχθητι
  choice: Hãy mở ra
  alternative: Tai hãy mở ra / Hãy nghe được
  rationale: Dạng mệnh lệnh bị động số ít không nêu trực tiếp vật hay cơ quan được mở. Bản dịch giữ sự không xác định ấy thay vì giải thích thần học hoặc sinh lý học trong chính câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” để nối chủ thể đã có trong văn cảnh; phiên âm “Ép-pha-tha” giúp độc giả Việt đọc được lời tiếng A-ram, còn lời giải nghĩa của chính tác giả được giữ nguyên.
