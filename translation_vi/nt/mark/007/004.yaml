  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἀπ’ ⸀ἀγορᾶς ἐὰν μὴ ⸀βαπτίσωνται οὐκ ἐσθίουσιν, καὶ ἄλλα πολλά ἐστιν ἃ παρέλαβον κρατεῖν, βαπτισμοὺς ποτηρίων καὶ ξεστῶν καὶ χαλκίων ⸂καὶ κλινῶν⸃—
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/004.yaml
  text: 'And when they come from the marketplace[a], they do not eat unless they wash themselves[b], and there are many other things that they have received to keep: washings of cups and pitchers and copper vessels and dining couches—'
translation:
  language: vi
  text: 'Khi từ chợ về, họ không ăn nếu chưa tự tẩy rửa[a]. Có nhiều điều khác họ đã tiếp nhận để tuân giữ: những việc tẩy rửa chén, bình, đồ đựng bằng đồng và ghế dài dùng trong bữa ăn[b]—'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “tự dìm mình xuống nước.” Tiếng Hy Lạp dùng một dạng của động từ thường được dịch là “báp-têm,” nhưng tại đây động từ ấy chỉ việc tẩy rửa theo tập tục thanh sạch.'
    reason: lexical_alternative
  - marker: b
    text: Một số thủ bản không có cụm “và ghế dài dùng trong bữa ăn.”
    reason: textual_variant
lexical_decisions:
- source_word: ἀγορᾶς
  choice: chợ
  rationale: Trong ngữ cảnh này, ἀγορά chỉ khu chợ công cộng. Cụm “khi từ chợ về” diễn đạt tự nhiên ý trở về từ chợ được hàm chứa trong mạch văn.
- source_word: βαπτίσωνται
  choice: tẩy rửa
  rationale: Động từ ở đây chỉ hành động rửa để đáp ứng tập tục thanh sạch trước khi ăn, không phải phép báp-têm Cơ Đốc. “Tẩy rửa” giữ được sắc thái thanh sạch theo nghi thức mà không khẳng định riêng một cách thức rửa.
- source_word: παρέλαβον κρατεῖν
  choice: tiếp nhận ... để tuân giữ
  rationale: Cách dịch này giữ cả ý tiếp nhận truyền thống và tiếp tục vâng giữ, thay vì chuyển trọng tâm sang việc truyền lại cho người khác.
- source_word: βαπτισμοὺς
  choice: việc rửa
  rationale: Danh từ số nhiều nói đến những lần hoặc cách rửa các vật dụng theo tập tục thanh sạch. “Việc rửa” rõ ràng, tự nhiên và không đưa hàm ý bí tích vào câu.
- source_word: ξεστῶν
  choice: bình
  rationale: ξέστης là một loại đồ đựng như bình hoặc vò; “bình” là cách gọi rộng, dễ hiểu và không xác định quá mức hình dáng.
- source_word: χαλκίων
  choice: đồ đựng bằng đồng
  rationale: Từ này chỉ các vật dụng làm bằng đồng hoặc hợp kim đồng. “Đồ đựng bằng đồng” phù hợp với danh sách vật dụng được rửa và tránh xác định quá hẹp loại hợp kim.
- source_word: κλινῶν
  choice: ghế dài dùng trong bữa ăn
  rationale: κλίνη có thể là giường hoặc ghế dài để nằm tựa. Trong bối cảnh ăn uống, cụm này diễn đạt loại ghế dài người xưa dùng khi dùng bữa mà vẫn dễ hiểu với độc giả hiện đại.
- source_word: ἄλλα πολλά
  choice: nhiều điều khác
  rationale: Giữ nguyên tính khái quát của tiếng Hy Lạp, không thu hẹp thành “truyền thống” hay “nghi thức” dù ngữ cảnh có thể gợi đến các ý ấy.
theological_decisions:
- issue: Ý nghĩa của βαπτίσωνται và βαπτισμοὺς trong bối cảnh thanh sạch theo nghi thức
  choice: Dịch là “tẩy rửa” và “việc rửa”.
  alternative: “tự dìm mình” và “những lần dìm”; hoặc dùng thuật ngữ liên hệ trực tiếp với phép báp-têm
  rationale: Câu này bàn về tập tục thanh sạch của người Pha-ri-si chứ không trực tiếp nói đến phép báp-têm Cơ Đốc. Cách dịch đã chọn giữ bối cảnh nghi thức và không áp đặt một phương thức rửa duy nhất; khả năng hiểu là dìm mình được ghi ở chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Tẩy rửa” giữ sắc thái thanh sạch theo nghi thức; “ghế dài dùng trong bữa ăn” giải thích tự nhiên vật dụng văn hóa cổ mà không dùng từ chuyên môn khó hiểu.
