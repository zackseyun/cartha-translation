revisions:
- from: Khi từ chợ về, họ không ăn nếu chưa tẩy rửa[a]. Họ còn tiếp nhận nhiều điều khác để tuân giữ, như việc rửa chén, bình, đồ đựng bằng đồng và ghế dài dùng trong bữa ăn[b]—
  to: 'Khi từ chợ về, họ không ăn nếu chưa tự tẩy rửa[a]. Có nhiều điều khác họ đã tiếp nhận để tuân giữ: những việc tẩy rửa chén, bình, đồ đựng bằng đồng và ghế dài dùng trong bữa ăn[b]—'
  rationale: Sửa “còn tiếp nhận” thành “đã tiếp nhận” để phản ánh παρέλαβον, thêm “tự” để thể hiện sắc thái phản thân của βαπτίσωνται, và đổi “như việc rửa” thành dấu hai chấm cùng số nhiều “những việc tẩy rửa” để sát danh sách βαπτισμούς hơn. Chú thích a được viết lại cho tự nhiên và tránh hiểu “làm báp-têm” là cử hành nghi lễ.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T07:40:07Z'
review_pass:
  verdict: revise
  source_fidelity: Câu đầu truyền đạt đúng ý nghi thức thanh sạch của βαπτίσωνται. Tuy nhiên, “Họ còn tiếp nhận” dễ hiểu là họ đang tiếp tục tiếp nhận, trong khi παρέλαβον diễn tả những điều họ đã nhận lãnh; cần điều chỉnh thì/aspect. Bản sửa cũng làm rõ tính phản thân của βαπτίσωνται bằng “tự tẩy rửa.”
  naturalness: “Khi từ chợ về” và “ghế dài dùng trong bữa ăn” tự nhiên, phù hợp tiếng Việt hiện đại. Cấu trúc “Có nhiều điều khác họ đã tiếp nhận để tuân giữ” mạch lạc hơn và sát nguyên văn hơn. Chú thích hiện có cụm “làm báp-têm” không tự nhiên trong tiếng Việt.
  terminology: “Tẩy rửa” và “những việc tẩy rửa” thích hợp trong ngữ cảnh thanh sạch theo nghi thức, không gán nghĩa bí tích. “Đồ đựng bằng đồng” giữ được tính không xác định của χαλκίων; “ghế dài dùng trong bữa ăn” diễn đạt hợp lý κλινῶν trong ngữ cảnh này.
