  rationale: Chỉnh sửa duy nhất là thay “quỷ thì đã ra khỏi” bằng “quỷ đã ra đi” để tránh một cấu trúc thiếu bổ ngữ trong tiếng Việt, đồng thời duy trì tính không xác định của nguyên văn về nơi/vật mà quỷ đi ra khỏi. Chú thích được điều chỉnh để bảo tồn sắc thái không gian của động từ Hy Lạp.
