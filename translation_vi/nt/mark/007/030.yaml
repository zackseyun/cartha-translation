source:
  edition: SBLGNT
  text: καὶ ἀπελθοῦσα εἰς τὸν οἶκον αὐτῆς εὗρεν τὸ ⸂παιδίον βεβλημένον ἐπὶ τὴν κλίνην καὶ τὸ δαιμόνιον ἐξεληλυθός⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/030.yaml
  text: And when she went away to her house, she found the child lying on the bed[a], and the demon gone.
translation:
  language: vi
  text: Khi bà trở về nhà, bà thấy đứa trẻ nằm trên giường, và quỷ đã ra đi[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch sát hơn: “quỷ đã đi ra.”'
    reason: 'Cách diễn đạt này phản ánh rõ hơn động từ ἐξέρχομαι (“đi ra/ra khỏi”), trong khi bản chính diễn đạt tự nhiên kết quả hoàn tất: quỷ không còn ở đó.'
lexical_decisions:
- source_word: ἀπελθοῦσα
  choice: khi bà trở về
  rationale: Phân từ bất định diễn tả hành động xảy ra trước động từ chính; trong ngữ cảnh, bà rời chỗ Đức Giê-su để về nhà. “Khi bà trở về” tự nhiên trong tiếng Việt và giữ trình tự thời gian.
- source_word: εἰς τὸν οἶκον αὐτῆς
  choice: nhà
  rationale: Cụm từ chỉ đích đến là nơi ở của bà; kết hợp “trở về nhà” diễn đạt tự nhiên mà không làm thay đổi ý nghĩa.
- source_word: εὗρεν
  choice: bà thấy
  rationale: Trong văn thuật chuyện, εὑρίσκω có thể chỉ việc nhận thấy một tình trạng khi đến nơi; “thấy” tự nhiên hơn “tìm thấy” ở đây.
- source_word: παιδίον
  choice: đứa trẻ
  rationale: Giữ danh từ trung tính của câu này, thay vì cụ thể hóa thành “con gái”; ngữ cảnh trước đó đã xác định đứa trẻ là con gái của bà.
- source_word: βεβλημένον
  choice: nằm
  rationale: Phân từ hoàn thành bị động của βάλλω mô tả trạng thái kết quả của đứa trẻ trên giường. “Nằm” là cách diễn đạt tự nhiên, không hàm ý bạo lực mà nguyên văn không nhất thiết đòi hỏi.
- source_word: ἐπὶ τὴν κλίνην
  choice: trên giường
  rationale: Diễn đạt trực tiếp vị trí của đứa trẻ, phù hợp với giới từ ἐπί và văn phong tiếng Việt.
- source_word: δαιμόνιον
  choice: quỷ
  rationale: Phản ánh đúng δαιμόνιον trong câu này, không thay bằng “tà linh” dù ngữ cảnh trước có dùng cách gọi tương ứng với thần ô uế.
- source_word: ἐξεληλυθός
  choice: đã ra khỏi
  rationale: Phân từ hoàn thành của ἐξέρχομαι nhấn mạnh việc quỷ đã đi ra và kết quả vẫn còn. “Đã ra khỏi” giữ rõ ý chuyển động ra ngoài; tân ngữ được lược như trong nguyên văn.
theological_decisions:
- issue: Kết quả của việc trừ quỷ
  choice: quỷ thì đã ra khỏi
  alternative: quỷ đã đi rồi
  rationale: Cách dịch giữ thực tại quỷ đã ra khỏi đứa trẻ và trạng thái ấy đã hoàn tất, đồng thời không bổ sung tác nhân hay cách thức mà câu Hy Lạp không nêu.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “bà” theo nhân vật nữ đã được xác định trong ngữ cảnh; cấu trúc “còn… thì” phân biệt hai điều bà nhận thấy khi về đến nhà.
