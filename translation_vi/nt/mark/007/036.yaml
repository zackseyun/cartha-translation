  text: καὶ διεστείλατο αὐτοῖς ἵνα μηδενὶ ⸀λέγωσιν· ὅσον δὲ ⸂αὐτοῖς διεστέλλετο, αὐτοὶ⸃ μᾶλλον περισσότερον ἐκήρυσσον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/036.yaml
  text: And he ordered them to tell no one. But the more he ordered them[a], the more abundantly they proclaimed it.
translation:
  language: vi
  text: Ngài truyền cho họ không được nói với ai. Nhưng Ngài càng truyền bảo họ bao nhiêu[a], họ càng rao truyền điều ấy nhiều hơn bấy nhiêu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “Ngài càng căn dặn họ, họ càng rao truyền điều ấy hơn nữa.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: διεστείλατο
  choice: truyền
  rationale: Động từ ở đây diễn tả một mệnh lệnh dứt khoát. “Truyền” tự nhiên, trang trọng và giữ được sức nặng hơn “dặn”.
- source_word: αὐτοῖς
  choice: cho họ
  rationale: Đại từ số nhiều chỉ những người có mặt trong bối cảnh; cách diễn đạt này tự nhiên trong tiếng Việt.
- source_word: ἵνα μηδενὶ λέγωσιν
  choice: không được nói với ai
  rationale: Mệnh đề nêu nội dung của lệnh cấm. “Không được nói với ai” rõ ràng và giữ nguyên phạm vi tuyệt đối của μηδενί.
- source_word: ὅσον ... διεστέλλετο
  choice: Ngài càng truyền bảo họ
  rationale: 'ὅσον kết hợp với thì chưa hoàn thành tạo ý tương ứng và tiếp diễn: Ngài càng truyền bảo thì họ càng rao truyền.'
- source_word: μᾶλλον περισσότερον
  choice: lại càng ... rộng rãi hơn
  rationale: Hai trạng từ cùng tăng cường mức độ. “Lại càng... rộng rãi hơn” giữ sắc thái gia tăng mạnh mà vẫn tự nhiên trong tiếng Việt.
- source_word: ἐκήρυσσον
  choice: rao truyền
  rationale: κηρύσσω chỉ việc công bố công khai, rộng rãi. “Rao truyền” giữ sắc thái ấy mà không khiến hành động này nhất thiết mang nghĩa giảng đạo.
theological_decisions:
- issue: Mô-típ giữ kín căn tính Đấng Mê-si-a và sức nặng của mệnh lệnh
  choice: Dịch mệnh lệnh như một lệnh cấm thực sự, không giải thích lý do Ngài ban lệnh ấy.
  alternative: Dùng “nghiêm cấm” để nhấn mạnh hơn, hoặc thêm lời giải thích về động cơ giữ im lặng.
  rationale: Câu văn khẳng định Ngài ra lệnh không được nói với ai, trong khi họ lại rao truyền càng rộng hơn. Bản dịch giữ nguyên sự căng thẳng này mà không áp đặt một cách giải thích thần học.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” theo mạch kể về Chúa Giê-su; cấu trúc “càng... càng...” tái hiện quan hệ tương ứng trong nguyên ngữ.
