  to: 'Nhưng Ngài nói với họ: “Ê-sai đã nói tiên tri đúng về các người, là những kẻ đạo đức giả, như có chép rằng:


    ‘Dân này tôn kính Ta bằng môi miệng,


    nhưng lòng chúng cách xa Ta.’”'
  rationale: Chỉ điều chỉnh mức độ nhấn của «thật đúng» thành «đúng» và thêm dấu phẩy cho quan hệ đồng vị. Bản sửa giữ nguyên ý nghĩa, tính trực tiếp của lời quở trách, hình ảnh thi ca, và cách dùng số ít tập thể của nguyên văn.
