id: MRK.7.6
reference: Mark 7:6
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὁ ⸀δὲ εἶπεν ⸀αὐτοῖς· Καλῶς ἐπροφήτευσεν Ἠσαΐας περὶ ὑμῶν τῶν ὑποκριτῶν, ὡς γέγραπται ⸀ὅτι Οὗτος ὁ λαὸς τοῖς χείλεσίν με τιμᾷ, ἡ δὲ καρδία αὐτῶν πόρρω ἀπέχει ἀπ’ ἐμοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/006.yaml
  text: 'But he said to them[a], “Isaiah prophesied well about you hypocrites, as it is written: ‘This people honors me with their lips, but their heart is far from me.’”'
translation:
  language: vi
  text: 'Nhưng Ngài nói với họ: “Ê-sai đã nói tiên tri đúng về các người, là những kẻ đạo đức giả, như có chép rằng:


    ‘Dân này tôn kính Ta bằng môi miệng,


    nhưng lòng chúng cách xa Ta.’”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: Nhưng
  rationale: Đánh dấu sự chuyển ý có sắc thái tương phản khi Đức Giê-su đáp lại những người vừa chất vấn Ngài.
- source_word: εἶπεν αὐτοῖς
  choice: Ngài nói với họ
  rationale: Cách diễn đạt tự nhiên và sát cấu trúc trần thuật Hy Lạp; đại từ kính trọng giữ văn phong trang nghiêm.
- source_word: Καλῶς ἐπροφήτευσεν
  choice: đã nói tiên tri thật đúng
  rationale: Καλῶς đánh giá lời tiên tri là thích đáng và ứng nghiệm đúng vào người nghe; “thật đúng” tự nhiên hơn “tốt” trong tiếng Việt mà không giới hạn nghĩa vào độ chính xác kỹ thuật.
- source_word: περὶ ὑμῶν τῶν ὑποκριτῶν
  choice: về các người là những kẻ đạo đức giả
  rationale: Giữ quan hệ quy chiếu của περί và tính đồng vị của τῶν ὑποκριτῶν, qua đó bảo toàn lời quở trách trực tiếp.
- source_word: ὡς γέγραπται ὅτι
  choice: như có chép rằng
  rationale: Công thức dẫn Kinh Thánh quen thuộc, tự nhiên trong tiếng Việt và vẫn thể hiện rõ phần trích dẫn theo sau.
- source_word: Οὗτος ὁ λαὸς
  choice: Dân này
  rationale: Giữ danh từ tập thể số ít và sắc thái tiên tri của lời trích Ê-sai.
- source_word: τοῖς χείλεσίν με τιμᾷ
  choice: tôn kính Ta bằng môi miệng
  rationale: τιμάω là “tôn kính”; “bằng môi miệng” truyền đạt phương tiện biểu lộ bên ngoài và phù hợp văn phong thi ca Kinh Thánh.
- source_word: ἡ δὲ καρδία αὐτῶν
  choice: nhưng lòng chúng
  rationale: Giữ “lòng” ở số ít như nguyên văn, biểu thị nội tâm hay khuynh hướng chung của cả dân; “chúng” quy chiếu tự nhiên về tập thể bị quở trách.
- source_word: πόρρω ἀπέχει ἀπ’ ἐμοῦ
  choice: cách xa Ta
  rationale: Diễn đạt cô đọng cả hình ảnh khoảng cách lẫn hàm ý xa cách trong mối quan hệ, không giải thích thêm theo một hệ thần học.
theological_decisions:
- issue: Lời Ê-sai 29:13 được Đức Giê-su áp dụng trực tiếp cho những người đối thoại
  choice: Giữ lời quy kết trực tiếp “về các người là những kẻ đạo đức giả” và lời trích “Dân này”.
  alternative: Làm nhẹ thành một nhận xét khái quát về sự giả hình của con người.
  rationale: Nguyên văn trực tiếp nhận diện người nghe và áp dụng lời tiên tri cho họ; bản dịch không nên làm giảm sức nặng của lời quở trách.
- issue: Hình ảnh “môi miệng” đối lập với “lòng”
  choice: Giữ nguyên sự đối lập giữa sự tôn kính bề ngoài và nội tâm xa cách.
  alternative: Diễn giải thành sự thờ phượng không chân thành hoặc thiếu đức tin.
  rationale: Nguyên văn để chính hình ảnh tạo nên căng thẳng thần học; diễn giải cụ thể hơn sẽ thu hẹp nghĩa và đưa thêm kết luận không được nói rõ trong câu.
translation_notes:
  register: Tiếng Việt hiện đại, trang nghiêm và dễ hiểu. Dùng “Ngài/Ta” theo lối kính trọng trong lời kể và lời Đức Chúa Trời được trích dẫn. Nhịp xuống dòng phản ánh cấu trúc thi ca của lời trích tiên tri; không cần chú thích vì tiếng Việt có thể giữ tự nhiên cả “Dân” và “lòng” ở số ít.
