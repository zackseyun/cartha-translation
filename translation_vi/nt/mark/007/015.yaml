  terminology: “Làm ... ô uế” là lựa chọn phù hợp cho κοινόω trong ngữ cảnh thanh sạch, vì vẫn có thể gợi cả bình diện nghi lễ lẫn đạo đức. “Một người/người ấy” diễn đạt tự nhiên ἄνθρωπος theo nghĩa khái quát, số ít đại diện. Chú thích nên được neo ở lần xuất hiện đầu của thuật ngữ và nêu rõ nghĩa thay thế áp dụng cho động từ trong câu.
