reference: Mark 7:15
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οὐδέν ἐστιν ἔξωθεν τοῦ ἀνθρώπου εἰσπορευόμενον εἰς αὐτὸν ὃ δύναται ⸂κοινῶσαι αὐτόν⸃· ἀλλὰ τὰ ⸂ἐκ τοῦ ἀνθρώπου ἐκπορευόμενά⸃ ἐστιν τὰ κοινοῦντα τὸν ⸀ἄνθρωπον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/015.yaml
  text: There is nothing outside a man that by going into him is able to defile him; rather, the things that come out from the man are what defile the man.
translation:
  language: vi
  text: Không có gì từ bên ngoài đi vào một người mà có thể làm người ấy ô uế[a]; trái lại, những gì từ người ấy đi ra mới làm người ấy ô uế.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “làm người ấy không thanh sạch.” Động từ Hy Lạp có thể chỉ việc khiến một người trở nên không thanh sạch theo các quy định về sự thanh sạch; “ô uế” ở đây cũng giữ được sắc thái đạo đức rộng hơn trong văn cảnh.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδέν
  choice: không có gì
  rationale: Diễn đạt tự nhiên và chính xác đại từ bất định trung tính số ít dùng tuyệt đối.
- source_word: ἔξωθεν τοῦ ἀνθρώπου
  choice: từ bên ngoài một người
  rationale: Giữ rõ nguồn gốc bên ngoài và tạo thế đối lập với cụm “từ trong người ấy đi ra” ở vế sau.
- source_word: τοῦ ἀνθρώπου / τὸν ἄνθρωπον
  choice: một người / người ấy
  rationale: ἄνθρωπος ở đây chỉ con người theo nghĩa khái quát; tiếng Việt “một người/người ấy” vừa tự nhiên vừa giữ được số ít và phép đối xứng.
- source_word: εἰσπορευόμενον εἰς αὐτόν
  choice: đi vào trong người ấy
  rationale: Giữ hướng chuyển động của động tính từ mà không làm câu tiếng Việt nặng nề.
- source_word: δύναται
  choice: có thể
  rationale: Tương đương tự nhiên với ý chỉ khả năng của động từ Hy Lạp.
- source_word: κοινῶσαι / κοινοῦντα
  choice: làm … ô uế
  rationale: Trong ngữ cảnh tranh luận về thanh sạch, κοινόω có nghĩa làm cho không thanh sạch; “ô uế” giữ được cả sắc thái nghi lễ lẫn sức nặng đạo đức có trong văn cảnh.
- source_word: ἀλλὰ
  choice: trái lại
  rationale: Thể hiện rõ sự tương phản và đính chính mạnh giữa hai vế.
- source_word: τὰ ἐκ τοῦ ἀνθρώπου ἐκπορευόμενα
  choice: chính những gì từ trong người ấy đi ra
  rationale: Giữ cấu trúc số nhiều khái quát, nhấn mạnh chủ thể gây ô uế, và bảo tồn sự đối lập không gian với điều từ bên ngoài đi vào.
theological_decisions:
- issue: Ý nghĩa của κοινόω trong cuộc tranh luận về sự thanh sạch
  choice: làm … ô uế
  alternative: làm … không thanh sạch
  rationale: “Ô uế” là cách nói gọn, trang trọng, quen thuộc trong văn cảnh Kinh Thánh và không thu hẹp nghĩa chỉ còn ô uế nghi lễ; chú thích nêu phương án minh giải trực tiếp hơn.
- issue: Cách dịch ἄνθρωπος theo nghĩa khái quát
  choice: một người / người ấy
  alternative: con người
  rationale: Cách chọn này giữ dạng số ít đại diện của nguyên văn, đồng thời tự nhiên và không hàm ý chỉ riêng nam giới trong tiếng Việt.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “người ấy” để tránh lặp cứng nhưng vẫn duy trì chuỗi quy chiếu số ít; dùng “chính … mới” để tái hiện trọng tâm tương phản của câu Hy Lạp.
