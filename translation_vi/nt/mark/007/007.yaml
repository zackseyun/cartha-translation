  rationale: Bản sửa giữ nguyên nội dung và sắc thái phê phán của câu trích dẫn, đồng thời tránh biến phân từ «dạy» thành một mệnh đề nguyên nhân. «Vô ích» cập nhật cách diễn đạt của μάτην cho tiếng Việt chuẩn hiện đại. Chú thích được điều chỉnh để nêu phương án cấu trúc tương đương, trong đó các điều răn của loài người được trình bày như giáo lý.
