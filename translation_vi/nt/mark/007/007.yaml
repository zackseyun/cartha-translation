source:
  edition: SBLGNT
  text: μάτην δὲ σέβονταί με, διδάσκοντες διδασκαλίας ἐντάλματα ἀνθρώπων·
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/007.yaml
  text: But they worship me in vain[a], teaching as doctrines the commandments of men.
translation:
  language: vi
  text: 'Nhưng họ thờ phượng Ta vô ích,

    khi dạy những điều răn của loài người như giáo lý.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “khi lấy những điều răn của loài người làm giáo lý mà dạy.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: μάτην
  choice: luống công
  rationale: Diễn tả việc thờ phượng không đạt mục đích, trở nên vô ích; cách nói trang trọng nhưng vẫn quen thuộc trong tiếng Việt.
- source_word: δὲ
  choice: Nhưng
  rationale: 'Nêu sự tương phản với lời ngay trước đó: ngoài môi miệng tôn kính nhưng lòng lại cách xa.'
- source_word: σέβονταί με
  choice: họ thờ phượng Ta
  rationale: σέβομαι ở đây chỉ sự thờ phượng hướng về Đức Chúa Trời. Đại từ “Ta” phù hợp với lời Đức Chúa Trời phán trong câu trích dẫn.
- source_word: διδάσκοντες
  choice: vì họ dạy
  rationale: Phân từ hiện tại có thể diễn tả cách thức hoặc căn cứ khiến sự thờ phượng trở nên luống công; “vì họ dạy” truyền đạt quan hệ này tự nhiên trong tiếng Việt.
- source_word: διδασκαλίας
  choice: như giáo lý
  rationale: Danh từ này chỉ điều được giảng dạy có tính giáo huấn. “Như giáo lý” làm rõ rằng các điều răn do con người đặt ra được nâng lên địa vị giáo lý.
- source_word: ἐντάλματα
  choice: những điều răn
  rationale: Giữ sắc thái mệnh lệnh có thẩm quyền và âm hưởng tôn giáo của lời trích dẫn.
- source_word: ἀνθρώπων
  choice: của loài người
  rationale: Chỉ nguồn gốc từ con người nói chung, tương phản với nguồn gốc từ Đức Chúa Trời, không hàm ý riêng nam giới.
theological_decisions:
- issue: Mối quan hệ giữa “giáo lý” và “điều răn của loài người” trong cấu trúc Hy Lạp cô đọng
  choice: họ dạy những điều răn của loài người như giáo lý
  alternative: họ dạy làm giáo lý những điều răn của loài người
  rationale: 'Cách chọn giữ nguyên lời phê phán thần học: điều do con người truyền ra được giảng dạy với địa vị giáo lý. Nó làm rõ quan hệ cú pháp mà không khẳng định thêm rằng mọi truyền thống hay mọi mệnh lệnh của con người tự thân đều sai.'
- issue: Sắc thái của μάτην đối với việc thờ phượng
  choice: thờ phượng Ta luống công
  alternative: thờ phượng Ta vô ích
  rationale: “Luống công” vừa diễn tả sự không đạt mục đích vừa giữ giọng trang trọng của lời tiên tri, không chuyển nghĩa thành sự giả dối hay thiếu chân thành một cách quá cụ thể.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng và dễ hiểu. Dùng “loài người” để thể hiện nghĩa bao quát của ἀνθρώπων; giữ nhịp câu trích dẫn và tránh thuật ngữ mang dấu ấn hệ phái.
