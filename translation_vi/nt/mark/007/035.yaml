revisions:
- from: Tai người ấy liền mở ra[a], dây trói lưỡi được tháo, và người nói rõ ràng.[b]
  to: Tai người ấy được mở ra[a], dây trói lưỡi của người ấy được tháo[b], và người ấy nói năng rõ ràng[c].
  rationale: Bản sửa bổ sung sở hữu ngữ có trong nguyên văn, bỏ sắc thái thời gian không được nêu rõ, và dùng cách diễn đạt tự nhiên hơn mà vẫn bảo tồn ẩn dụ “dây trói” của δεσμός. Hệ chú thích tách riêng các lựa chọn nghĩa cho tai/thính giác, hình ảnh sự trói buộc của lưỡi, và ὀρθῶς.
