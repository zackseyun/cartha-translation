  text: ⸀καὶ ⸀ἠνοίγησαν αὐτοῦ αἱ ἀκοαί, καὶ ἐλύθη ὁ δεσμὸς τῆς γλώσσης αὐτοῦ, καὶ ἐλάλει ὀρθῶς·
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/035.yaml
  text: And his ears were opened[a], and the bond of his tongue was released[c][b], and he spoke plainly.
translation:
  language: vi
  text: Tai người ấy được mở ra[a], dây trói lưỡi của người ấy được tháo[b], và người ấy nói năng rõ ràng[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “thính giác của người ấy được mở ra.” Từ Hy Lạp có thể chỉ đôi tai hoặc khả năng nghe.'
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn: “dây trói của lưỡi người ấy được tháo”; tức là sự trở ngại đối với lời nói của người ấy được loại bỏ.'
    reason: lexical_alternative
  - marker: c
    text: “Rõ ràng” cũng có thể dịch là “đúng cách” hoặc “rành rọt.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠνοίγησαν
  choice: liền mở ra
  rationale: Động từ aorist thụ động số nhiều diễn tả việc khả năng nghe được khai mở tức thì; tiếng Việt dùng kết cấu tự nhiên này mà không cần ép thành dạng bị động cứng.
- source_word: αἱ ἀκοαί
  choice: tai người ấy
  rationale: Danh từ số nhiều có thể chỉ tai hoặc khả năng nghe. Trong trình thuật chữa lành, “tai” là cách nói cụ thể, tự nhiên; chú thích giữ lại nghĩa thay thế “thính giác”.
- source_word: ἐλύθη
  choice: được tháo
  rationale: Giữ sắc thái thụ động của λύω và phù hợp với hình ảnh δεσμός là vật trói buộc.
- source_word: ὁ δεσμὸς τῆς γλώσσης αὐτοῦ
  choice: dây trói lưỡi
  rationale: Bảo tồn hình ảnh cụ thể của nguyên văn về sự trói buộc cái lưỡi, thay vì diễn giải trực tiếp thành chứng trở ngại ngôn ngữ.
- source_word: ἐλάλει
  choice: người nói
  rationale: Chuyển imperfect bằng lối kể tự nhiên trong tiếng Việt; không thêm nét nghĩa “bắt đầu” vốn không được biểu thị rõ.
- source_word: ὀρθῶς
  choice: rõ ràng
  rationale: Trong bối cảnh chữa lành khả năng nói, từ này chỉ việc nói đúng cách, rõ và dễ hiểu; “rõ ràng” tránh gợi ý thuần túy về đúng ngữ pháp hay đúng đạo đức.
theological_decisions:
- issue: Nên dịch cụm mô tả việc chữa lành khả năng nói theo nghĩa đen hay diễn giải
  choice: Giữ hình ảnh “dây trói lưỡi được tháo” trong chính văn
  alternative: Trở ngại khiến người ấy không nói được đã biến mất; lưỡi người ấy được tự do
  rationale: Nguyên văn mô tả phép chữa lành bằng hình ảnh cụ thể chứ không dùng thuật ngữ lâm sàng. Giữ ẩn dụ tránh giải nghĩa quá mức và bảo tồn sức gợi của câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Người ấy” tránh cách gọi quá khẩu ngữ; “dây trói lưỡi” giữ hình ảnh nguyên văn nhưng vẫn sáng nghĩa trong ngữ cảnh.
