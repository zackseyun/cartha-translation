id: MRK.7.5
reference: Mark 7:5
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸀καὶ ἐπερωτῶσιν αὐτὸν οἱ Φαρισαῖοι καὶ οἱ γραμματεῖς· Διὰ τί ⸂οὐ περιπατοῦσιν οἱ μαθηταί σου⸃ κατὰ τὴν παράδοσιν τῶν πρεσβυτέρων, ἀλλὰ ⸀κοιναῖς χερσὶν ἐσθίουσιν τὸν ἄρτον;
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/005.yaml
  text: And the Pharisees and the scribes asked him[a], “Why do your disciples not walk according to the tradition of the elders, but eat bread with unclean hands?”
translation:
  language: vi
  text: 'Những người Pha-ri-si và các kinh sư hỏi ngài: “Tại sao các môn đồ của thầy không sống theo truyền thống của các trưởng lão, mà lại ăn bánh bằng tay ô uế[a]?”


    [a] Theo nghĩa đen là “những bàn tay thông thường”; trong ngữ cảnh này, chỉ những bàn tay bị xem là ô uế về mặt nghi lễ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Theo nghĩa đen là “những bàn tay thông thường”; trong ngữ cảnh này, chỉ những bàn tay bị xem là ô uế về mặt nghi lễ.
    reason: Bảo tồn nghĩa đen của κοινός, đồng thời giải thích sắc thái ô uế nghi lễ trong văn cảnh mà không đồng nhất với bẩn về thể chất.
lexical_decisions:
- source_word: ἐπερωτῶσιν
  choice: hỏi
  rationale: Thì hiện tại được dùng để kể chuyện; “hỏi” diễn đạt tự nhiên hành động nói mà không nhấn quá mức tính tiếp diễn hay lặp lại.
- source_word: οἱ Φαρισαῖοι
  choice: người Pha-ri-si
  rationale: Cách phiên âm quen thuộc, rõ nghĩa trong văn cảnh Phúc Âm.
- source_word: οἱ γραμματεῖς
  choice: các kinh sư
  rationale: Diễn đạt địa vị của những người thông thạo và giảng giải luật pháp; tự nhiên và rõ hơn cách dịch thuần chức năng sao chép là “thầy thông giáo.”
- source_word: περιπατοῦσιν
  choice: sống theo
  rationale: Động từ có nghĩa đen là “bước đi” nhưng ở đây là thành ngữ chỉ cách cư xử hay nếp sống. “Sống theo” giữ được ý tuân theo một chuẩn mực mà vẫn tự nhiên trong tiếng Việt.
- source_word: κατὰ τὴν παράδοσιν
  choice: theo truyền thống
  rationale: Phản ánh sát ý phù hợp và hành xử theo một truyền thống đã được thiết lập.
- source_word: τῶν πρεσβυτέρων
  choice: của các trưởng lão
  rationale: Giữ nguyên cấu trúc sở hữu và không tự ý xác định đây là các trưởng lão đương thời hay những bậc tiền nhân có thẩm quyền.
- source_word: κοιναῖς χερσὶν
  choice: dùng tay ô uế
  rationale: Trong văn cảnh này, κοινός không nói đến tay bẩn về vệ sinh mà đến tình trạng bị xem là ô uế về nghi lễ. Chú thích giữ lại nghĩa đen “thông thường.”
- source_word: τὸν ἄρτον
  choice: ăn bánh
  rationale: Giữ danh từ cụ thể “bánh” của nguyên văn, dù trong văn cảnh nó cũng có thể đại diện cho việc dùng bữa.
theological_decisions:
- issue: Tình trạng nghi lễ được hàm ý bởi κοινός
  choice: ô uế
  alternative: thông thường; không thanh sạch
  rationale: “Ô uế” truyền đạt được bình diện nghi lễ của cuộc tranh luận, không biến vấn đề thành vệ sinh thân thể hay sự xấu xa về đạo đức. Nghĩa đen được ghi trong chú thích để bảo tồn sắc thái của nguyên ngữ.
- issue: Thành ngữ περιπατεῖν chỉ cách sống
  choice: sống theo
  alternative: bước đi theo; làm theo
  rationale: “Sống theo” bảo tồn ý về cách hành xử nói chung mà không khiến độc giả hiểu đây là hành động đi bộ theo nghĩa đen.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “ngài” cho đại từ chỉ Đức Giê-su trong lời kể và “thầy” trong lời đối thoại, phù hợp cách người chất vấn trực tiếp xưng hô với một vị thầy. Câu hỏi giữ sự đối lập rõ giữa truyền thống của các trưởng lão và việc ăn bằng tay bị xem là ô uế.
