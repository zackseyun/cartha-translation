  yaml_path: translation/nt/mark/007/013.yaml
  text: thus nullifying the word of God by your tradition that you have handed down[c][b][a]. And you do many other similar things.
translation:
  language: vi
  text: Như vậy, các ông dùng truyền thống của mình mà các ông đã truyền lại[b] để làm cho lời Đức Chúa Trời mất hiệu lực[a]. Các ông còn làm nhiều điều tương tự như thế[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “vô hiệu hóa” hoặc “làm cho lời Đức Chúa Trời thành vô hiệu”.'
    reason: lexical_alternative
  - marker: b
    text: 'Hoặc: “truyền thống của các ông, điều các ông đã truyền lại”.'
    reason: lexical_alternative
  - marker: c
    text: 'Nguyên văn có sắc thái nhấn mạnh: “nhiều điều giống như những điều này”.'
    reason: previous_rendering
lexical_decisions:
- source_word: ἀκυροῦντες
  choice: làm cho… mất hiệu lực
  rationale: Diễn đạt đúng ý khiến một điều không còn hiệu lực hoặc giá trị ràng buộc, đồng thời tự nhiên trong tiếng Việt hiện đại; dạng phân từ tiếp nối lời cáo buộc của Đức Giê-su.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: lời Đức Chúa Trời
  rationale: Giữ cách dịch trực tiếp của λόγος và sự tương phản trang trọng giữa lời Đức Chúa Trời với truyền thống của người nghe.
- source_word: τῇ παραδόσει ὑμῶν
  choice: dùng truyền thống mình
  rationale: 'Dịch cách cho biết phương tiện: chính truyền thống của họ là phương tiện khiến lời Đức Chúa Trời mất hiệu lực. Đại từ phản thân “mình” tự nhiên khi chủ thể đã được nêu là “các ông”.'
- source_word: ᾗ παρεδώκατε
  choice: mình đã truyền lại
  rationale: Giữ mối liên hệ từ vựng và ý nghĩa giữa παράδοσις và παραδίδωμι bằng cặp “truyền thống—truyền lại”.
- source_word: παρόμοια τοιαῦτα πολλὰ
  choice: nhiều điều tương tự như thế
  rationale: Truyền đạt số lượng và sự tương đồng được nhấn mạnh trong tiếng Hy Lạp mà không tạo lối diễn đạt dư thừa, gượng gạo trong tiếng Việt.
- source_word: ποιεῖτε
  choice: còn làm
  rationale: Thì hiện tại chỉ hành động có tính thường xuyên; “còn” liên kết tự nhiên với lời cáo buộc vừa nêu và cho thấy đây không phải trường hợp duy nhất.
theological_decisions:
- issue: Bản chất của “truyền thống” trong lời cáo buộc của Đức Giê-su
  choice: Dịch trung tính là “truyền thống mình”, để văn cảnh cho thấy truyền thống cụ thể này đối nghịch với lời Đức Chúa Trời.
  alternative: “truyền thống của loài người” hoặc “truyền thống do con người đặt ra”
  rationale: Bản Hy Lạp ở câu này chỉ nói “truyền thống của các ông”, không có tính từ “thuộc về loài người”. Không thêm lời giải thích mang tính diễn giải vào chính văn.
- issue: Mức độ tác động của truyền thống đối với lời Đức Chúa Trời
  choice: “làm cho… mất hiệu lực”
  alternative: “hủy bỏ” hoặc “gạt bỏ”
  rationale: Cách dịch được chọn giữ trọng tâm của ἀκυρόω là khiến điều gì không còn hiệu lực, chứ không hàm ý rằng con người có thể tiêu diệt chính lời Đức Chúa Trời.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Các ông” phù hợp với lời Đức Giê-su trực tiếp trách những người Pha-ri-si và các kinh sư trong văn cảnh. Cặp “truyền thống—truyền lại” bảo tồn lối chơi chữ của nguyên ngữ. Trật tự câu được điều chỉnh nhẹ để quan hệ phương tiện và kết quả rõ ràng trong tiếng Việt.
