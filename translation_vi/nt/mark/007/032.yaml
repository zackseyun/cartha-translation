  text: καὶ φέρουσιν αὐτῷ κωφὸν ⸀καὶ ⸀μογιλάλον, καὶ παρακαλοῦσιν αὐτὸν ἵνα ἐπιθῇ αὐτῷ τὴν χεῖρα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/032.yaml
  text: And they brought to him a man who was deaf and had difficulty speaking[a], and they begged him to lay his hand on him.
translation:
  language: vi
  text: Người ta đem đến cho Đức Chúa Jêsus một người bị điếc và nói năng khó khăn[a], rồi khẩn cầu Ngài đặt tay trên người ấy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay, sát nghĩa hơn: “một người điếc và nói khó.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: φέρουσιν
  choice: đem đến
  rationale: Thì hiện tại lịch sử thường gặp trong lối kể chuyện của Mác; tiếng Việt tự nhiên có thể kể bằng động từ không đánh dấu thì, và ngữ cảnh cho thấy đây là một sự việc trong mạch truyện quá khứ.
- source_word: αὐτῷ
  choice: cho Đức Chúa Jêsus
  rationale: Đại từ chỉ Đức Chúa Jêsus trong ngữ cảnh. Nêu rõ danh xưng giúp câu tiếng Việt tự nhiên và tránh mơ hồ khi đứng riêng.
- source_word: κωφόν
  choice: một người điếc
  rationale: κωφός ở đây chỉ tình trạng điếc; từ tiếp theo mô tả riêng khó khăn về lời nói, nên không dịch là “câm”.
- source_word: μογιλάλον
  choice: nói khó
  rationale: Tính từ hiếm này chỉ việc nói khó hoặc lời nói bị trở ngại, không nhất thiết hoàn toàn không nói được. “Nói khó” ngắn gọn, tự nhiên và không diễn giải quá mức.
- source_word: παρακαλοῦσιν
  choice: khẩn cầu
  rationale: Trong bối cảnh chữa lành, động từ diễn tả lời cầu xin tha thiết, mạnh hơn “xin” đơn thuần.
- source_word: ἵνα ἐπιθῇ αὐτῷ τὴν χεῖρα
  choice: đặt tay trên người ấy
  rationale: Diễn đạt nội dung lời cầu xin và giữ số ít của χεῖρα. Cụm “đặt tay trên” là cách nói quen thuộc cho cử chỉ chữa lành mà không thêm ý nghĩa ngoài bản văn.
theological_decisions:
- issue: Tính chất khuyết tật của người đàn ông
  choice: Người ấy bị điếc và nói khó, không được mô tả là hoàn toàn câm.
  alternative: Điếc và câm.
  rationale: Hai từ κωφός và μογιλάλος phân biệt tình trạng điếc với trở ngại khi nói; dịch là “câm” sẽ nói quá nghĩa của μογιλάλος và làm mất sự phân biệt trong tiếng Hy Lạp.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Chúa Jêsus” và “Ngài” để xác định rõ đại từ trong câu đứng riêng; giữ cách diễn đạt ngắn gọn của lời kể Mác. Dấu chú thích [a] xuất hiện ngay sau cụm từ liên quan.
