revisions:
- from: Người ta đem đến cho Đức Chúa Jêsus một người điếc và nói khó[a], rồi khẩn cầu Ngài đặt tay trên người ấy.
  to: Người ta đem đến cho Đức Chúa Jêsus một người bị điếc và nói năng khó khăn[a], rồi khẩn cầu Ngài đặt tay trên người ấy.
  rationale: Sửa cách diễn đạt về trở ngại lời nói cho tự nhiên hơn trong tiếng Việt hiện đại và chỉnh chú thích để không tạo ấn tượng sai rằng có hai người. Bản sửa vẫn giữ sự phân biệt của tiếng Hy Lạp giữa điếc và khó nói, cũng như sắc thái của lời khẩn cầu và cử chỉ đặt tay.
