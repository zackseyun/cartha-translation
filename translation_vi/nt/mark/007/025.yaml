  source_fidelity: 'Bản dịch giữ đầy đủ các yếu tố chính: liên từ chuyển ý, phản ứng tức thời sau khi nghe tin về Đức Giê-su, người phụ nữ, con gái nhỏ, thần ô uế, hành động đến và sấp mình dưới chân Ngài. Tuy nhiên, nên thêm “một” trước “thần ô uế” để phản ánh rõ danh ngữ số ít bất định πνεῦμα ἀκάθαρτον và để bản văn khớp với chú thích.'
