reference: Mark 7:25
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸂ἀλλ’ εὐθὺς ἀκούσασα⸃ γυνὴ περὶ αὐτοῦ, ἧς εἶχεν τὸ θυγάτριον αὐτῆς πνεῦμα ἀκάθαρτον, ἐλθοῦσα προσέπεσεν πρὸς τοὺς πόδας αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/025.yaml
  text: But immediately a woman whose little daughter had an unclean spirit[a], having heard about him[c][b], came and fell at his feet.
translation:
  language: vi
  text: Nhưng vừa nghe tin về Đức Giê-su, một người phụ nữ có con gái nhỏ bị một thần ô uế ám[a] liền đến và sấp mình dưới chân Ngài.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “có một thần ô uế”; theo cách hiểu truyền thống, đó là quỷ.
    reason: Giải thích rằng “bị một thần ô uế ám” là cách diễn đạt tự nhiên cho cấu trúc Hy Lạp “có một thần ô uế”, đồng thời ghi nhận cách hiểu truyền thống mà không thay thế thuật ngữ nguồn.
lexical_decisions:
- source_word: ἀλλ’
  choice: Nhưng
  rationale: Giữ sắc thái chuyển tiếp hơi tương phản với việc Đức Giê-su muốn không ai biết Ngài đang ở đó trong câu trước.
- source_word: εὐθὺς ἀκούσασα ... περὶ αὐτοῦ
  choice: vừa nghe nói về Đức Giê-su ... liền
  rationale: Diễn đạt tự nhiên quan hệ tức thời giữa việc nghe tin và hành động đến gặp Ngài, đồng thời giữ nhịp khẩn trương đặc trưng của Mác. Nêu rõ Đức Giê-su thay cho đại từ để câu tiếng Việt sáng nghĩa.
- source_word: γυνὴ
  choice: một người phụ nữ
  rationale: Danh từ không có mạo từ giới thiệu một nhân vật mới.
- source_word: θυγάτριον
  choice: con gái nhỏ
  rationale: Giữ cả quan hệ mẹ con lẫn sắc thái giảm nhẹ hoặc âu yếm của dạng thu nhỏ θυγάτριον.
- source_word: ἧς εἶχεν τὸ θυγάτριον αὐτῆς πνεῦμα ἀκάθαρτον
  choice: có con gái nhỏ bị thần ô uế ám
  rationale: Cách nói tự nhiên trong tiếng Việt cho tình trạng đứa con có một thần ô uế, không làm suy yếu tính tác nhân của thần.
- source_word: πνεῦμα ἀκάθαρτον
  choice: thần ô uế
  rationale: Giữ thuật ngữ đặc trưng của Mác và các hàm ý ô uế, thay vì diễn giải ngay thành quỷ.
- source_word: ἐλθοῦσα
  choice: đến
  rationale: Chuyển phân từ thành động từ nối tiếp tự nhiên trong lối kể tiếng Việt.
- source_word: προσέπεσεν πρὸς τοὺς πόδας αὐτοῦ
  choice: sấp mình dưới chân Ngài
  rationale: Truyền đạt tư thế phủ phục khẩn cầu và khiêm nhường, đồng thời giữ hình ảnh cụ thể về chân.
theological_decisions:
- issue: Cách dịch πνεῦμα ἀκάθαρτον
  choice: thần ô uế
  alternative: uế linh; quỷ
  rationale: “Thần ô uế” bám sát cách gọi của Mác và bảo tồn hàm ý ô uế. “Quỷ” nêu rõ cách hiểu truyền thống về thực thể này nhưng mang tính diễn giải hơn.
- issue: Quan hệ cú pháp của εὐθὺς với ἀκούσασα
  choice: vừa nghe nói ... liền đến
  alternative: ngay lập tức nghe nói ... rồi đến
  rationale: Cách chọn giữ sự nối tiếp tức thời và khẩn trương mà không buộc trạng từ chỉ bổ nghĩa riêng cho hành động nghe; cấu trúc phân từ Hy Lạp cho phép tiếng Việt diễn đạt quan hệ nghe rồi phản ứng ngay.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cấu trúc “vừa ... liền ...” tạo nhịp kể tự nhiên, bảo tồn tính tức thời; “Ngài” dùng để quy chiếu Đức Giê-su trong mạch kể.
