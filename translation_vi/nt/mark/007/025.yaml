  to: Nhưng vừa nghe tin về Đức Giê-su, một người phụ nữ có con gái nhỏ bị một thần ô uế ám[a] liền đến và sấp mình dưới chân Ngài.
  rationale: 'Chỉ sửa tối thiểu: thêm “một” để biểu đạt danh ngữ bất định số ít trong nguyên văn, thay “nghe nói” bằng “nghe tin” cho rõ nghĩa nghe các tin tức về Đức Giê-su, và thêm “và” để nối hai hành động chính một cách tự nhiên. Không thay đổi ý nghĩa hay mức độ xác định của bản văn.'
