  text: Καὶ προσκαλεσάμενος ⸀πάλιν τὸν ὄχλον ἔλεγεν αὐτοῖς· ⸀Ἀκούσατέ μου πάντες καὶ ⸀σύνετε.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/014.yaml
  text: And calling the crowd to him again, he was saying to them, “Listen to me, all of you, and understand.”
translation:
  language: vi
  text: 'Ngài lại gọi đám đông đến và nói với họ: “Tất cả mọi người hãy lắng nghe tôi và hãy hiểu.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: gọi ... đến
  rationale: Diễn đạt tự nhiên phân từ chỉ hành động gọi đám đông đến gần trước khi nói.
- source_word: πάλιν
  choice: lại
  rationale: Giữ ý lặp lại của trạng từ Hy Lạp.
- source_word: ἔλεγεν
  choice: nói
  rationale: Thì vị hoàn có thể gợi hành động đang diễn tiến, nhưng trong lời kể tiếng Việt, “nói” tự nhiên và không làm mất nội dung; “cứ nói” sẽ thêm sắc thái lặp lại không chắc chắn.
- source_word: Ἀκούσατέ μου πάντες
  choice: Tất cả hãy nghe tôi
  rationale: Giữ mệnh lệnh hướng đến toàn thể đám đông, với trật tự tự nhiên trong tiếng Việt.
- source_word: σύνετε
  choice: hiểu cho rõ
  rationale: Truyền đạt lời kêu gọi không chỉ nghe mà còn lĩnh hội điều sắp được dạy.
