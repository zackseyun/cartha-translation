source:
  edition: SBLGNT
  text: μοιχεῖαι⸃, πλεονεξίαι, πονηρίαι, δόλος, ἀσέλγεια, ὀφθαλμὸς πονηρός, βλασφημία, ὑπερηφανία, ἀφροσύνη·
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/022.yaml
  text: adulteries[a], greed, wickedness, deceit, sensuality, an evil eye, slander, pride[b], foolishness.
translation:
  language: vi
  text: những hành vi ngoại tình, lòng tham, những điều gian ác, sự lừa dối, sự phóng đãng, cái nhìn ác ý[a], lời phỉ báng[b], sự kiêu ngạo và sự ngu dại.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn là “con mắt xấu,” một thành ngữ chỉ cái nhìn ganh tị, keo kiệt hoặc ác ý.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “lời phạm thượng.” Từ Hy Lạp có thể chỉ lời phỉ báng người khác hoặc lời xúc phạm Đức Chúa Trời.
    reason: alternative_reading
lexical_decisions:
- source_word: μοιχεῖαι
  choice: những hành vi ngoại tình
  rationale: Danh từ số nhiều chỉ các hành vi ngoại tình; cách diễn đạt này giữ được ý số nhiều mà vẫn tự nhiên trong tiếng Việt.
- source_word: πλεονεξίαι
  choice: lòng tham
  rationale: Từ này chỉ ham muốn chiếm hữu hoặc có thêm, thường mang tính vụ lợi; “lòng tham” rõ nghĩa và tự nhiên trong danh sách các thói xấu.
- source_word: πονηρίαι
  choice: những điều gian ác
  rationale: Dạng số nhiều nói đến nhiều biểu hiện của sự xấu xa về đạo đức; “những điều gian ác” vừa giữ ý số nhiều vừa tự nhiên hơn một danh từ trừu tượng ở số nhiều.
- source_word: δόλος
  choice: sự lừa dối
  rationale: Diễn đạt rõ hành vi cố ý đánh lừa; phù hợp với tiếng Việt hiện đại.
- source_word: ἀσέλγεια
  choice: lối sống phóng đãng
  rationale: Chỉ cách hành xử vô liêm sỉ, buông thả và không tự kiềm chế, thường có sắc thái tình dục; cách dịch này giữ được sức nặng đạo đức mà không cổ xưa.
- source_word: ὀφθαλμὸς πονηρός
  choice: con mắt xấu
  rationale: Giữ nguyên hình ảnh của thành ngữ Hy Lạp–Do Thái; chú thích giải thích nghĩa là cái nhìn ganh tị, keo kiệt hoặc ác ý.
- source_word: βλασφημία
  choice: lời phỉ báng
  rationale: Trong danh sách này, từ có thể chỉ lời xúc phạm, bôi nhọ người khác; tuy nhiên, nghĩa “lời phạm thượng” đối với Đức Chúa Trời vẫn được giữ trong chú thích.
- source_word: ὑπερηφανία
  choice: sự kiêu ngạo
  rationale: Chỉ thái độ tự tôn và ngạo mạn; “sự kiêu ngạo” chính xác, trang trọng và thông dụng.
- source_word: ἀφροσύνη
  choice: sự ngu dại
  rationale: Chỉ sự thiếu khôn ngoan về đạo đức và thực hành, chứ không đơn thuần nói đến trí năng thấp.
theological_decisions:
- issue: Phạm vi nghĩa của βλασφημία trong danh sách các thói xấu
  choice: lời phỉ báng
  alternative: lời phạm thượng
  rationale: Ngữ cảnh cho phép hiểu là lời nói gây tổn hại hoặc xúc phạm người khác, nhưng từ Hy Lạp cũng có thể chỉ lời xúc phạm Đức Chúa Trời; chú thích bảo tồn cả hai khả năng mà không quyết đoán quá mức.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu giữ dạng một danh sách tiếp nối từ câu trước; các danh từ trừu tượng được dùng tự nhiên trong tiếng Việt, còn số nhiều được thể hiện rõ ở những chỗ cần thiết. Dấu chú thích được đặt đúng sau “con mắt xấu” và “lời phỉ báng” để tương ứng với nội dung chú thích.
