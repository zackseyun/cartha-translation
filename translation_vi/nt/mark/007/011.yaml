source:
  edition: SBLGNT
  text: ὑμεῖς δὲ λέγετε· Ἐὰν εἴπῃ ἄνθρωπος τῷ πατρὶ ἢ τῇ μητρί· Κορβᾶν, ὅ ἐστιν Δῶρον, ὃ ἐὰν ἐξ ἐμοῦ ὠφεληθῇς,
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/011.yaml
  text: But you say[a], ‘If a man says to his father or his mother, “Corban” (that is, a gift)[b], whatever you might have benefited from me—’
translation:
  language: vi
  text: 'Nhưng các ông lại nói: ‘Nếu một người nói với cha hoặc mẹ mình: “Co-ban”[a] (nghĩa là “lễ vật”[b]), bất cứ điều gì cha hoặc mẹ có thể nhờ con mà được ích lợi—’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Co-ban” là thuật ngữ chỉ điều được dâng riêng cho Đức Chúa Trời như một lễ vật, nên không được dùng cho các nhu cầu thông thường của gia đình.
    reason: cultural_note
  - marker: b
    text: Cũng có thể dịch là “quà dâng”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς δὲ λέγετε
  choice: Nhưng các ông lại nói
  rationale: “Nhưng” thể hiện sự tương phản do δὲ đánh dấu; “lại” làm rõ sự đối lập với điều răn của Đức Chúa Trời trong ngữ cảnh trước. “Các ông” phù hợp với đại từ số nhiều ὑμεῖς và lời Đức Chúa Jêsus đang trực tiếp nói với nhóm người nghe.
- source_word: Ἐὰν εἴπῃ ἄνθρωπος
  choice: Nếu một người nói
  rationale: Cấu trúc ἐὰν với động từ giả định nêu một trường hợp có thể xảy ra; “nếu… nói” là cách diễn đạt tự nhiên trong tiếng Việt. “Một người” truyền đạt nghĩa đại diện của ἄνθρωπος mà không thêm giới tính không cần thiết trong tiếng Việt.
- source_word: τῷ πατρὶ ἢ τῇ μητρί
  choice: với cha hoặc mẹ mình
  rationale: Giới từ “với” chỉ người được nói trực tiếp; “cha hoặc mẹ mình” giữ đủ hai quan hệ gia đình và dùng đại từ phản thân tự nhiên trong tiếng Việt.
- source_word: Κορβᾶν
  choice: Co-ban
  rationale: Giữ lại từ vay mượn gốc Sê-mít như chính bản Hy Lạp đã làm, đồng thời phiên âm theo cách dễ đọc trong tiếng Việt; lời giải nghĩa ngay sau đó và chú thích cung cấp bối cảnh.
- source_word: ὅ ἐστιν Δῶρον
  choice: nghĩa là “lễ vật”
  rationale: Đây là lời giải thích của tác giả Mác. Δῶρον có thể là “quà tặng” hoặc “lễ vật”; trong ngữ cảnh dâng cho Đức Chúa Trời, “lễ vật” vừa tự nhiên vừa giữ sắc thái tôn giáo mà không diễn giải quá mức.
- source_word: ὃ ἐὰν ἐξ ἐμοῦ ὠφεληθῇς
  choice: bất cứ điều gì cha/mẹ có thể được hưởng từ con
  rationale: “Bất cứ điều gì” thể hiện tính bất định của ὃ ἐὰν. “Có thể được hưởng từ con” giữ ý được lợi hoặc được trợ giúp mà không giới hạn vào tiền bạc. “Cha/mẹ… con” duy trì lời nói trực tiếp với một trong hai bậc cha mẹ; dấu gạch ngang cho thấy câu còn được tiếp nối về mặt cú pháp ở câu 12.
theological_decisions:
- issue: Cách chuyển ngữ công thức Co-ban trong bối cảnh vật được biệt riêng dâng cho Đức Chúa Trời
  choice: 'Giữ “Co-ban” trong chính văn, rồi theo lời giải nghĩa của Mác: “nghĩa là ‘lễ vật’”.'
  alternative: Dịch thẳng là “lễ vật” hoặc “vật dâng cho Đức Chúa Trời”.
  rationale: Bản Hy Lạp chủ ý bảo lưu thuật ngữ Sê-mít rồi mới giải thích. Cách dịch này giữ tính lịch sử và tôn giáo của ví dụ mà không áp đặt một cách hiểu chi tiết về cơ chế lời khấn vượt quá điều câu Kinh Thánh nói.
- issue: Phạm vi của sự trợ giúp cha mẹ trong ὠφεληθῇς
  choice: Dùng “có thể được hưởng từ con”, không giới hạn loại lợi ích.
  alternative: Diễn giải cụ thể là “số tiền con đáng lẽ dùng để phụng dưỡng cha mẹ”.
  rationale: Động từ có thể chỉ sự giúp đỡ hay lợi ích nói chung. Không cụ thể hóa thành tiền bạc giúp bảo tồn độ rộng nghĩa của nguồn Hy Lạp và tránh giải quyết điều văn bản chưa nói rõ.
translation_notes:
  register: Văn phong hiện đại, trang trọng nhưng dễ hiểu. Cách xưng hô “các ông” phù hợp với lời tranh luận trực tiếp; trong lời người con nói với cha hoặc mẹ, “cha/mẹ” là cách viết gọn để giữ cả hai khả năng của nguyên văn. Dấu gạch ngang cuối câu được giữ vì ý và cấu trúc ngữ pháp tiếp tục sang Mác 7:12.
