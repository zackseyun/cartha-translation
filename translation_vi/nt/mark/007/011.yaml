  source_fidelity: Bản dịch giữ đúng thế đối lập của δέ, cấu trúc điều kiện, thuật ngữ vay mượn Κορβᾶν và tính dang dở của câu sang câu 12. Tuy nhiên, cách viết gộp “cha/mẹ” không phản ánh tự nhiên hai khả năng phân biệt bằng ἢ (“hoặc”), và cụm “cha/mẹ có thể được hưởng từ con” kém tự nhiên, dễ gợi hưởng thụ hơn là nhận sự giúp ích (ὠφεληθῇς).
  naturalness: “Các ông lại nói” phù hợp văn cảnh tranh luận và tiếng Việt hiện đại. Nên thay lối viết tắt “cha/mẹ” bằng “cha hoặc mẹ” trong chính văn, đồng thời dùng “nhờ con mà được ích lợi” để câu nói trực tiếp rõ và tự nhiên hơn mà không giới hạn ích lợi vào tiền bạc.
