- from: 'Nhưng các ông lại nói: ‘Nếu một người nói với cha hoặc mẹ mình: “Co-ban”[a] (nghĩa là “lễ vật”[b]), bất cứ điều gì cha/mẹ có thể được hưởng từ con—’'
  to: 'Nhưng các ông lại nói: ‘Nếu một người nói với cha hoặc mẹ mình: “Co-ban”[a] (nghĩa là “lễ vật”[b]), bất cứ điều gì cha hoặc mẹ có thể nhờ con mà được ích lợi—’'
  rationale: Bản sửa thay lối viết tắt bằng cách diễn đạt đầy đủ, hiện đại và trang trọng; đồng thời thay “được hưởng từ con” bằng “nhờ con mà được ích lợi” để phản ánh sát hơn nghĩa bị động của ὠφεληθῇς mà vẫn không xác định loại trợ giúp. Thuật ngữ Co-ban, lời giải thích của Mác, và dấu gạch ngang chỉ câu tiếp sang câu 12 đều được giữ lại.
