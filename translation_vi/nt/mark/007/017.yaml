- from: Khi Đức Giê-su vào một căn nhà, rời khỏi đám đông, các môn đồ hỏi Ngài về ẩn dụ ấy.[a]
  to: Khi Ngài vào một nhà, cách xa đám đông, các môn đệ của Ngài hỏi Ngài về dụ ngôn ấy.[a]
  rationale: Bản sửa giữ “một nhà” để phản ánh οἶκον không có mạo từ, diễn đạt ἀπὸ τοῦ ὄχλου như bối cảnh tách khỏi đám đông, và dùng “dụ ngôn” làm tương đương chính cho παραβολή. Chú thích bảo lưu những cách hiểu rộng hơn về mặt từ vựng, không áp đặt cách phân loại cụ thể cho lời nói trước đó.
