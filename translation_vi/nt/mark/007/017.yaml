source:
  edition: SBLGNT
  text: Καὶ ὅτε εἰσῆλθεν ⸀εἰς οἶκον ἀπὸ τοῦ ὄχλου, ἐπηρώτων αὐτὸν οἱ μαθηταὶ αὐτοῦ ⸂τὴν παραβολήν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/017.yaml
  text: And when he entered a house away from the crowd[a], his disciples asked him about the parable.
translation:
  language: vi
  text: Khi Ngài vào một nhà, cách xa đám đông, các môn đệ của Ngài hỏi Ngài về dụ ngôn ấy.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “lời nói ấy” hay “hình ảnh minh họa ấy”. Từ Hy Lạp là παραβολή (parabolē).'
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ ὅτε
  choice: Khi
  rationale: Dùng liên từ thời gian tự nhiên trong tiếng Việt; không nhất thiết dịch Καί thành một từ riêng, nhưng vẫn giữ mạch kể tiếp nối.
- source_word: εἰσῆλθεν εἰς οἶκον
  choice: Đức Giê-su vào một căn nhà
  rationale: οἶκον không có mạo từ, nên “một căn nhà” phản ánh hình thức Hy Lạp tốt hơn “căn nhà ấy”; thêm chủ ngữ tường minh theo văn phong tiếng Việt và ngữ cảnh.
- source_word: ἀπὸ τοῦ ὄχλου
  choice: rời khỏi đám đông
  rationale: Diễn đạt tự nhiên ý tách khỏi đám đông, đồng thời giữ quan hệ của cụm từ với hoàn cảnh Ngài vào nhà.
- source_word: ἐπηρώτων
  choice: hỏi
  rationale: Thì chưa hoàn thành có thể gợi hành động đang diễn ra hoặc lặp lại, nhưng động từ đơn “hỏi” phù hợp với lối kể tiếng Việt mà không loại trừ sắc thái ấy.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: các môn đồ
  rationale: “Các môn đồ” là cách gọi tự nhiên, trang trọng; quan hệ sở hữu đã rõ nhờ chủ thể Đức Giê-su trong câu.
- source_word: τὴν παραβολήν
  choice: ẩn dụ ấy
  rationale: παραβολή ở đây chỉ lời nói mang tính hình tượng ngay trước đó; “ẩn dụ” tự nhiên hơn “dụ ngôn” trong ngữ cảnh này, nhưng chú thích giữ các khả năng dịch khác.
theological_decisions:
- issue: Cách dịch παραβολή khi lời vừa nói có thể được hiểu rộng là một phát biểu mang tính hình tượng
  choice: ẩn dụ ấy
  alternative: dụ ngôn ấy; lời ấy; hình ảnh minh họa ấy
  rationale: Không áp đặt rằng đây nhất thiết là một truyện dụ ngôn hoàn chỉnh. “Ẩn dụ” giữ tính hình tượng của lời Đức Giê-su, còn chú thích công khai phạm vi nghĩa rộng hơn của từ Hy Lạp.
translation_notes:
  register: Tiếng Việt hiện đại, sáng rõ và trang trọng vừa phải. Dùng “Đức Giê-su” và đại từ “Ngài” theo lối văn Kinh Thánh phổ thông; giữ cấu trúc câu gọn, dễ đọc. Dấu chú thích [a] đặt ngay sau cụm từ liên quan.
