review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch truyền đạt đúng các thành tố chính: vào một nhà, tách khỏi đám đông, các môn đệ hỏi về παραβολή. Tuy nhiên, “rời khỏi đám đông” đặt giữa hai dấu phẩy dễ khiến nó bổ nghĩa cho “Đức Giê-su” như một hành động đồng thời/tiền đề hơn là mô tả việc vào nhà cách xa đám đông. “Ẩn dụ” không phải cách tương đương chính xác, tự nhiên nhất của παραβολή trong thuật ngữ Phúc Âm; “dụ ngôn” giữ phạm trù mà tác giả Mark dùng và không đòi hỏi đó là một truyện dụ ngôn hoàn chỉnh.'
  naturalness: Câu hiện có thể hiểu được, nhưng “vào một căn nhà, rời khỏi đám đông” hơi gượng và có quan hệ cú pháp mơ hồ. “Khi Ngài vào một nhà, cách xa đám đông” tự nhiên, gọn và gắn cụm ἀπὸ τοῦ ὄχλου với bối cảnh vào nhà. “Các môn đồ” vẫn dùng được, nhưng “các môn đệ của Ngài” là cách gọi hiện đại, phổ thông hơn trong văn cảnh Kinh Thánh và biểu đạt rõ αὐτοῦ.
  terminology: Nên dùng “dụ ngôn” cho παραβολή, theo cách dùng thuật ngữ Kinh Thánh đã ổn định và sát từ Hy Lạp. Không cần xác định đây là một câu chuyện dụ ngôn; chú thích có thể nêu “lời nói” và “hình ảnh minh họa” là các khả năng theo ngữ cảnh. Giữ “Đức Giê-su” và “Ngài” phù hợp với đăng ký bản dịch.
  issues:
  - severity: medium
    issue: “ẩn dụ ấy” dịch παραβολή quá hẹp và lệch thuật ngữ Phúc Âm
    rationale: παραβολή là nhãn thể loại/từ vựng mà Mark áp dụng cho lời dạy này. “Ẩn dụ” trong tiếng Việt thường chỉ một biện pháp tu từ cụ thể, trong khi “dụ ngôn” bảo toàn thuật ngữ và vẫn có thể được chú thích bằng các phương án ngữ cảnh.
  - severity: low
