    rationale: Cụm ἀπὸ τοῦ ὄχλου diễn tả sự tách biệt khỏi đám đông trong hoàn cảnh Ngài vào nhà. “cách xa đám đông” gắn mạch lạc hơn với bối cảnh, mà không thêm chi tiết.
