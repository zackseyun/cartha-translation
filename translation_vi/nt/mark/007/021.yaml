  source_fidelity: 'Bản dịch bám sát cấu trúc và ý nghĩa của nguyên văn: ἔσωθεν được chuyển là “từ bên trong”; ἐκ τῆς καρδίας τῶν ἀνθρώπων là “từ lòng người”; và động từ ἐκπορεύονται là “phát ra.” “Những ý nghĩ xấu xa” chuyển đạt đúng các διαλογισμοὶ οἱ κακοί. Danh sách được giữ ở dạng chưa hoàn tất, phù hợp với dấu phẩy cuối câu trong bản nguồn. “Những hành vi vô luân về tình dục” giữ được phạm vi rộng và sắc thái số nhiều của πορνεῖαι, không thu hẹp vào một hành vi cụ thể.'
