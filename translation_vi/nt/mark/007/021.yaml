id: MRK.7.21
reference: Mark 7:21
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἔσωθεν γὰρ ἐκ τῆς καρδίας τῶν ἀνθρώπων οἱ διαλογισμοὶ οἱ κακοὶ ἐκπορεύονται, ⸂πορνεῖαι, κλοπαί, φόνοι,
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/021.yaml
  text: 'For from within[a], out of the heart of men, evil thoughts come out: sexual immoralities, thefts, murders[b],'
translation:
  language: vi
  text: 'Vì từ bên trong, từ lòng người, phát ra những ý nghĩ xấu xa: những hành vi vô luân về tình dục[a], trộm cắp, giết người,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tiếng Hy Lạp dùng danh từ số nhiều, chỉ rộng đến các hành vi tình dục trái luân lý.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔσωθεν
  choice: từ bên trong
  rationale: Giữ rõ nguồn phát xuất từ nội tâm và sự tương phản với những gì ở bên ngoài trong văn cảnh.
- source_word: γὰρ
  choice: Vì
  rationale: Diễn đạt quan hệ giải thích, nối câu này với lời khẳng định ngay trước đó.
- source_word: καρδίας
  choice: lòng
  rationale: “Lòng” là cách nói tự nhiên trong tiếng Việt về trung tâm nội tâm, ý chí và đạo đức của con người, đồng thời giữ hình ảnh của nguyên ngữ.
- source_word: ἀνθρώπων
  choice: người
  rationale: Danh từ số nhiều giống đực trong tiếng Hy Lạp được dùng theo nghĩa khái quát, chỉ loài người nói chung; “người” truyền đạt đúng phạm vi ấy trong tiếng Việt.
- source_word: διαλογισμοὶ οἱ κακοὶ
  choice: những ý nghĩ xấu xa
  rationale: Diễn đạt những suy nghĩ, toan tính phát sinh bên trong và mang tính xấu về đạo đức, không thu hẹp nghĩa thành một loại mưu đồ cụ thể.
- source_word: ἐκπορεύονται
  choice: phát ra
  rationale: Giữ hình ảnh những điều xấu xuất phát và đi ra từ bên trong lòng người.
- source_word: πορνεῖαι
  choice: những hành vi vô luân về tình dục
  rationale: Phản ánh dạng số nhiều và nghĩa rộng về các hành vi tình dục trái luân lý, tránh thu hẹp thành riêng tội ngoại tình.
- source_word: κλοπαί
  choice: trộm cắp
  rationale: Cách diễn đạt tự nhiên trong tiếng Việt cho các hành vi lấy cắp được liệt kê như một thói xấu.
- source_word: φόνοι
  choice: giết người
  rationale: Truyền đạt hành vi tước đoạt mạng sống cách phi pháp, phù hợp sắc thái đạo đức của danh sách.
theological_decisions:
- issue: Phạm vi của ἀνθρώπων trong lời khẳng định về lòng người
  choice: Dịch là “người”, chỉ con người nói chung
  alternative: đàn ông; loài người
  rationale: Nguyên ngữ dùng dạng giống đực số nhiều theo nghĩa khái quát chứ không giới hạn ở nam giới. Tiếng Việt “lòng người” vừa tự nhiên vừa giữ tính phổ quát của lời dạy.
- issue: Phạm vi nghĩa của πορνεῖαι
  choice: những hành vi vô luân về tình dục
  alternative: gian dâm; tà dâm; sự vô luân về tình dục
  rationale: Cách dịch này giữ số nhiều và phạm vi rộng của từ Hy Lạp, không đồng nhất nó chỉ với ngoại tình hay một hành vi tình dục riêng biệt.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ cấu trúc giải thích mở đầu bằng “Vì”, hình ảnh “từ bên trong, từ lòng người” và dạng danh sách chưa kết thúc của câu trong phân đoạn gốc.
