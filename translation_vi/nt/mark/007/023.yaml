  terminology: “Làm ô uế” là thuật ngữ phù hợp và nhất quán với trường nghĩa nghi lễ–đạo đức của κοινόω trong ngữ cảnh này. “Con người” là lựa chọn tiếng Việt tự nhiên cho ἄνθρωπος theo nghĩa đại diện, không đòi hỏi chú thích về giống như tiếng Anh.
