  text: πάντα ταῦτα τὰ πονηρὰ ἔσωθεν ἐκπορεύεται καὶ κοινοῖ τὸν ἄνθρωπον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/023.yaml
  text: All these evil things come out from within and defile the man[a].
translation:
  language: vi
  text: Tất cả những điều xấu xa ấy đều từ bên trong mà ra và làm ô uế con người.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πάντα ταῦτα τὰ πονηρά
  choice: Tất cả những điều xấu xa ấy
  rationale: Cụm từ mang tính nhấn mạnh và bao quát, quy chiếu về các thói xấu vừa được liệt kê. “Những điều xấu xa” giữ được tính cụ thể số nhiều và tự nhiên trong tiếng Việt hiện đại.
- source_word: ἔσωθεν
  choice: từ bên trong
  rationale: Trạng từ chỉ nguồn gốc nội tại, đồng thời giữ sự tương phản của phân đoạn giữa điều ở bên ngoài và điều phát xuất từ lòng người.
- source_word: ἐκπορεύεται
  choice: mà ra
  rationale: Động từ số ít đi với chủ ngữ trung tính số nhiều theo cách dùng Hy Lạp thông thường. Kết hợp với “từ bên trong”, cách dịch này diễn đạt tự nhiên chuyển động phát xuất ra ngoài.
- source_word: κοινοῖ
  choice: làm ô uế
  rationale: Trong ngữ cảnh về thanh sạch của Mác, động từ mang nghĩa khiến một người trở nên ô uế, gồm cả chiều kích nghi lễ và đạo đức; “làm ô uế” chính xác và dễ hiểu hơn nghĩa đen “làm thành thông thường”.
- source_word: τὸν ἄνθρωπον
  choice: con người
  rationale: Danh từ số ít được dùng theo nghĩa đại diện, chỉ một con người nói chung. “Con người” tự nhiên trong tiếng Việt, vẫn giữ số ít và không giới hạn phát biểu vào nam giới.
theological_decisions:
- issue: Cách dịch ἄνθρωπον trong phát biểu khái quát về sự ô uế của con người
  choice: con người
  alternative: người ấy; một người
  rationale: Bản Hy Lạp dùng danh từ số ít giống đực theo ngữ pháp nhưng có lực quy chiếu chung đến con người. Tiếng Việt không cần đánh dấu giống ở đây; “con người” giữ nguyên tính khái quát và số ít mà không thêm một giới hạn giới tính không có trong ý nghĩa của câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Trật tự “đều từ bên trong mà ra” giữ điểm nhấn vào nguồn gốc nội tại; “làm ô uế” duy trì thuật ngữ nhất quán với ngữ cảnh thanh sạch trong Mác 7.
