  source_fidelity: 'Bản dịch phản ánh chính xác câu Hy Lạp: “Tất cả những điều xấu xa ấy” chuyển đạt đầy đủ πάντα ταῦτα τὰ πονηρά; “từ bên trong mà ra” giữ nguồn gốc nội tại của ἔσωθεν ἐκπορεύεται; và “làm ô uế con người” diễn đạt đúng κοινοῖ τὸν ἄνθρωπον trong ngữ cảnh thanh sạch/ô uế của Mác 7. Số ít mang tính khái quát của τὸν ἄνθρωπον được giữ tự nhiên bằng “con người.”'
