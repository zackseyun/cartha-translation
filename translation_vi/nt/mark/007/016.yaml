  text: If anyone has ears to hear, let him hear.
translation:
  language: vi
  text: Nếu ai có tai để nghe, hãy nghe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Câu này không có trong các thủ bản Hy Lạp cổ nhất (gồm Codex Sinaiticus và Codex Vaticanus thuộc thế kỷ IV) cũng như các bản dịch Coptic cổ, nhưng có trong phần lớn thủ bản theo truyền thống Byzantine, truyền thống La-tinh và đa số chứng liệu Syriac. Có thể đây là phần được người sao chép thêm vào về sau, lặp lại câu giống hệt ở Mác 4:9 và 4:23.
    reason: textual_critical
lexical_decisions:
- source_word: ὦτα
  choice: tai
  rationale: Giữ hình ảnh cụ thể của nguyên văn; “tai” được dùng theo nghĩa ẩn dụ về sự sẵn lòng tiếp nhận và hiểu.
- source_word: ἀκουέτω
  choice: hãy nghe
  rationale: Diễn đạt tự nhiên mệnh lệnh ngôi thứ ba số ít trong tiếng Hy Lạp, đồng thời giữ lời kêu gọi trực tiếp và hàm súc.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cấu trúc “có tai để nghe” được giữ lại vì vừa sát nguyên văn vừa là một thành ngữ Kinh Thánh rõ nghĩa trong tiếng Việt.
