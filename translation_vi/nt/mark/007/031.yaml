source:
  edition: SBLGNT
  text: Καὶ πάλιν ἐξελθὼν ἐκ τῶν ὁρίων Τύρου ⸂ἦλθεν διὰ Σιδῶνος εἰς⸃ τὴν θάλασσαν τῆς Γαλιλαίας ἀνὰ μέσον τῶν ὁρίων Δεκαπόλεως.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/031.yaml
  text: And again[a], after departing from the region of Tyre, he came through Sidon to the Sea of Galilee[b], through the midst of the region of the Decapolis.
translation:
  language: vi
  text: Ngài lại rời miền Ty-rơ, đi qua Si-đôn[a], rồi qua giữa vùng Thập Thành[b] để đến Biển Ga-li-lê.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “theo đường qua Si-đôn.” Cụm từ Hy Lạp có thể chỉ hành trình đi xuyên qua hoặc đi theo đường qua Si-đôn.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “ở giữa vùng Thập Thành.” Cụm từ Hy Lạp ἀνὰ μέσον có nghĩa sát hơn là “ở giữa/qua giữa”; lộ trình được mô tả ở đây khó xác định về mặt địa lý.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν
  choice: lại
  rationale: Đánh dấu một lần di chuyển tiếp theo trong mạch kể; “lại” ngắn gọn và tự nhiên trong tiếng Việt.
- source_word: ἐξελθὼν ἐκ τῶν ὁρίων Τύρου
  choice: rời miền Ty-rơ
  rationale: Phân từ bất định diễn tả hành động xảy ra trước động từ chính; ὅρια ở đây chỉ một vùng lãnh thổ, nên “miền” tự nhiên hơn cách dịch sát là “ranh giới”.
- source_word: ἦλθεν
  choice: đến
  rationale: Giữ ý của ἔρχομαι trong lời tường thuật và kết hợp tự nhiên với đích đến là Biển Ga-li-lê.
- source_word: διὰ Σιδῶνος
  choice: đi qua Si-đôn
  rationale: διά với sở hữu cách diễn tả hành trình đi qua hoặc theo đường qua một địa điểm; cách dịch này giữ được sắc thái địa lý mà không giải quyết quá mức lộ trình khó hiểu.
- source_word: εἰς τὴν θάλασσαν τῆς Γαλιλαίας
  choice: đến Biển Ga-li-lê
  rationale: “Biển Ga-li-lê” là địa danh quen dùng và phản ánh trực tiếp θάλασσα.
- source_word: ἀνὰ μέσον τῶν ὁρίων Δεκαπόλεως
  choice: qua giữa địa phận Thập Thành
  rationale: Giữ sắc thái không gian “qua/ở giữa” của cụm từ khác thường ἀνὰ μέσον; “địa phận” thể hiện ὅρια là lãnh thổ, còn “Thập Thành” là tên vùng quen thuộc trong tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng nhưng dễ hiểu. Dùng “Ngài” theo lối quy chiếu tôn kính phổ biến dành cho Chúa Giê-su; dùng các địa danh Việt hóa quen thuộc “Ty-rơ,” “Si-đôn,” “Ga-li-lê” và “Thập Thành.” Giữ nguyên nét khó xác định của lộ trình thay vì diễn giải lại cho thuận địa lý.
