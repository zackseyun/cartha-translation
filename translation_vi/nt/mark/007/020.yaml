  yaml_path: translation/nt/mark/007/020.yaml
  text: And he was saying, “What comes out from the man—that defiles the man.”
translation:
  language: vi
  text: 'Ngài còn nói: “Điều phát ra từ con người, chính điều đó làm cho con người trở nên ô uế.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “làm cho con người không thanh sạch.” Động từ Hy Lạp thuộc ngôn ngữ về sự thanh sạch, chỉ việc khiến một người trở nên ô uế hoặc không thanh sạch.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: Ngài nói tiếp
  rationale: Thì chưa hoàn thành diễn tả lời giảng đang tiếp diễn trong mạch kể; “nói tiếp” tự nhiên trong tiếng Việt và nối câu này với phần trước.
- source_word: δὲ
  choice: tiếp
  rationale: δέ là từ nối nhẹ trong diễn tiến câu chuyện; ý nối tiếp được thể hiện tự nhiên bằng “tiếp”, không tạo sắc thái tương phản quá mạnh.
- source_word: ὅτι
  choice: dấu hai chấm và ngoặc kép
  rationale: ὅτι dẫn vào nội dung lời nói trực tiếp; dấu câu là cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: Τὸ ἐκ τοῦ ἀνθρώπου ἐκπορευόμενον
  choice: Điều từ trong con người đi ra
  rationale: Cấu trúc phân từ có mạo từ được chuyển thành “điều...”, vừa rõ nghĩa vừa giữ hình ảnh cái phát xuất khỏi con người.
- source_word: ἀνθρώπου / ἄνθρωπον
  choice: con người / người ấy
  rationale: ἄνθρωπος ở đây mang nghĩa đại diện, chỉ con người nói chung chứ không nhấn mạnh giới tính. “Người ấy” ở vế sau duy trì số ít và sự quy chiếu mà không gây cảm giác chỉ nói về nam giới.
- source_word: ἐκεῖνο
  choice: chính điều đó
  rationale: 'Giữ sự nhấn mạnh của đại từ chỉ định: chính cái đi ra mới gây ô uế.'
- source_word: κοινοῖ
  choice: làm cho ... bị ô uế
  rationale: Trong ngữ cảnh thanh sạch, κοινόω có nghĩa khiến một người trở nên ô uế; cách diễn đạt này bảo toàn ngôn ngữ thanh sạch và dễ hiểu trong tiếng Việt hiện đại.
theological_decisions:
- issue: Ngôn ngữ thanh sạch của κοινόω trong lời dạy của Chúa Giê-su
  choice: làm cho người ấy bị ô uế
  alternative: làm cho người ấy không thanh sạch
  rationale: “Bị ô uế” truyền đạt ngắn gọn cả sắc thái thanh sạch theo bối cảnh Do Thái lẫn hệ quả đạo đức trong đoạn văn; chú thích giữ phương án diễn đạt phạm trù thanh sạch rõ hơn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” theo ngữ cảnh để chỉ Chúa Giê-su. Trật tự “Điều từ trong con người đi ra” chủ ý giữ hình ảnh và sự đối xứng của nguyên văn; “chính điều đó” bảo toàn điểm nhấn của ἐκεῖνο.
