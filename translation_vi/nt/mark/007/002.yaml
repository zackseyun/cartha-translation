  yaml_path: translation/nt/mark/007/002.yaml
  text: and they saw that some of his disciples were eating the bread with defiled hands—that is[a], unwashed hands—
translation:
  language: vi
  text: Và họ thấy một số môn đồ của Ngài đang ăn bánh bằng những bàn tay ô uế—tức là tay chưa rửa—[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cụm từ Hy Lạp theo nghĩa đen là “bằng những bàn tay chung/thông thường”; trong ngữ cảnh này, nó chỉ tình trạng không thanh sạch theo nghi lễ, chứ không chỉ là tay bẩn về thể chất. Có thể dịch: “bằng tay không thanh sạch” hoặc “bằng tay ô uế”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδόντες
  choice: họ thấy
  rationale: Phân từ bất định của ὁράω, với chủ thể được hiểu từ câu 1; dùng động từ hữu hạn là tự nhiên trong tiếng Việt và giữ nguyên ý quan sát.
- source_word: τινὰς τῶν μαθητῶν αὐτοῦ
  choice: một số môn đồ của Ngài
  rationale: τινάς đi với sở hữu cách bộ phận mang nghĩa tự nhiên là “một số trong các môn đồ của Ngài”; cách diễn đạt tiếng Việt này gọn và rõ.
- source_word: ὅτι
  choice: (thể hiện bằng cấu trúc trực tiếp “thấy ... ăn”)
  rationale: ὅτι giới thiệu nội dung điều họ thấy. Tiếng Việt tự nhiên không cần dịch thành “rằng” khi sau “thấy” là một kết cấu tân ngữ–động từ.
- source_word: κοιναῖς χερσίν
  choice: dùng tay ô uế
  rationale: Trong bối cảnh thanh sạch theo nghi lễ Do Thái, κοινός không chỉ về bụi bẩn thể chất mà về tình trạng không thanh sạch. “Tay ô uế” truyền đạt đúng nghĩa theo ngữ cảnh hơn “tay thông thường”, vốn khó hiểu và không tự nhiên trong tiếng Việt; chú thích bảo lưu nghĩa đen “thông thường/phàm”.
- source_word: τοῦτ’ ἔστιν ἀνίπτοις
  choice: nghĩa là chưa rửa
  rationale: Đây là lời giải thích ngay trong câu. Vì “tay” đã xuất hiện liền trước, “nghĩa là chưa rửa” rõ ràng, tự nhiên và không cần lặp danh từ.
- source_word: ἐσθίουσιν
  choice: ăn
  rationale: Hiện tại lịch sử mô tả hành động được quan sát; kết cấu “thấy ... mà ăn” diễn đạt tự nhiên trong tiếng Việt.
- source_word: τοὺς ἄρτους
  choice: bánh
  rationale: Số nhiều ἄρτους chỉ bánh làm thức ăn; “bánh” là danh từ khối tự nhiên trong tiếng Việt, không cần ép thành “những ổ bánh” khi số lượng từng ổ không phải trọng tâm.
theological_decisions:
- issue: Sắc thái thanh sạch nghi lễ của κοινός
  choice: Dịch “ô uế” trong chính văn và giải thích nghĩa đen cùng sắc thái nghi lễ ở chú thích.
  alternative: “thông thường”, “phàm”, hoặc “không thanh sạch”
  rationale: “Ô uế” giúp độc giả hiện đại nhận ra vấn đề là tình trạng thanh sạch theo nghi lễ chứ không đơn thuần là vệ sinh. Tuy nhiên, vì κοινός có nghĩa đen là “chung/thông thường/phàm”, chú thích bảo lưu độ căng từ vựng thay vì xóa bỏ nó.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Môn đồ” duy trì thuật ngữ Kinh Thánh quen thuộc; “Ngài” dùng để quy chiếu về Chúa Giê-su. Dấu gạch ngang giữ lời giải thích xen giữa của tác giả; dấu chú thích đặt ở cuối câu để không làm đứt quãng cụm giải thích.
