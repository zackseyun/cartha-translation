review_pass:
  verdict: revise
  source_fidelity: Bản dịch nhận đúng chủ thể ngầm từ câu 1, ý “một số môn đồ”, hành động đang diễn ra, bánh làm thức ăn, và nhất là sắc thái không thanh sạch theo nghi lễ của κοινός. Tuy nhiên, trật tự “dùng tay ô uế—nghĩa là chưa rửa—mà ăn bánh” làm lời chú giải chen giữa trước động từ chính, khiến quan hệ cú pháp và việc “chưa rửa” quy chiếu về tay kém rõ.
  naturalness: Cần đặt hành động “ăn bánh” trước, rồi bổ nghĩa bằng cụm “bằng những bàn tay ô uế”. “Tức là tay chưa rửa” là cách chú giải hiện đại, rõ ràng hơn “nghĩa là chưa rửa”, vì không để người đọc phải tự khôi phục danh từ “tay”.
  terminology: “Môn đồ”, “Ngài”, và “ô uế” phù hợp văn phong Kinh Thánh Việt ngữ. “Ô uế” trong chính văn là lựa chọn có thể bảo vệ trong ngữ cảnh thanh sạch nghi lễ, miễn chú thích nói rõ rằng đây không chỉ là bẩn về thể chất và bảo lưu nghĩa đen của κοινός.
  issues:
