- from: và họ thấy một số môn đồ của Ngài dùng tay ô uế—nghĩa là chưa rửa—mà ăn bánh.[a]
  to: Và họ thấy một số môn đồ của Ngài đang ăn bánh bằng những bàn tay ô uế—tức là tay chưa rửa—[a]
  rationale: Bản sửa giữ cách dịch theo ngữ cảnh nghi lễ của κοινός, đồng thời đưa mệnh đề “đang ăn bánh” về đúng vị trí tự nhiên trước cụm chỉ phương tiện. Lời chú giải của Mark được làm rõ là quy chiếu đến “tay”, và chú thích phân biệt nghĩa đen của từ Hy Lạp với cách dịch ngữ cảnh trong chính văn.
