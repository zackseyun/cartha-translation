  text: ἡ δὲ ἀπεκρίθη καὶ λέγει αὐτῷ· ⸀Κύριε, ⸀καὶ τὰ κυνάρια ὑποκάτω τῆς τραπέζης ⸀ἐσθίουσιν ἀπὸ τῶν ψιχίων τῶν παιδίων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/028.yaml
  text: But she answered and said to him[a], “Lord[b], even the little dogs under the table eat from the children's crumbs.”
translation:
  language: vi
  text: 'Nhưng bà đáp lời Người: “Thưa Chúa,[a] ngay cả những con chó nhỏ[b] ở dưới bàn cũng ăn những mẩu vụn của trẻ em.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Thưa ngài.” Từ Hy Lạp κύριε có thể là một cách xưng hô kính trọng, cũng có thể mang tước hiệu “Chúa.”'
    reason: alternative_reading
  - marker: b
    text: Từ Hy Lạp chỉ chó nhỏ hoặc chó nuôi trong nhà; “những con chó nhỏ” giữ sắc thái giảm nhẹ của từ này.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη καὶ λέγει αὐτῷ
  choice: bà đáp lời Người
  rationale: Diễn đạt tự nhiên chuỗi động từ “đáp và nói với Người”; thì hiện tại lịch sử λέγει được chuyển theo mạch kể quá khứ trong tiếng Việt mà không làm thay đổi nội dung.
- source_word: Κύριε
  choice: Thưa Chúa
  rationale: Giữ cách xưng hô “Chúa” đối với Đức Giê-su, đồng thời dùng “thưa” để câu nói trực tiếp tự nhiên và kính trọng; chú thích bảo lưu khả năng hiểu là cách gọi lịch sự “ngài”.
- source_word: καὶ
  choice: ngay cả ... cũng
  rationale: 'Thể hiện sắc thái bổ sung/nhấn mạnh trong lời đáp: chó nhỏ cũng được ăn, chứ không bác bỏ hình ảnh Đức Giê-su vừa nêu.'
- source_word: κυνάρια
  choice: những con chó nhỏ
  rationale: Giữ sắc thái dạng giảm nhẹ của từ Hy Lạp, có thể chỉ chó nhỏ hoặc chó nuôi trong nhà, mà không thu hẹp nghĩa thành “chó con”.
- source_word: ὑποκάτω τῆς τραπέζης
  choice: ở dưới bàn
  rationale: Cách diễn đạt không gian trực tiếp, rõ ràng và tự nhiên trong tiếng Việt.
- source_word: ἐσθίουσιν
  choice: ăn
  rationale: Thì hiện tại diễn tả điều thường xảy ra trong hình ảnh minh họa.
- source_word: ἀπὸ τῶν ψιχίων
  choice: ăn những mẩu vụn
  rationale: ψιχίων chỉ những mẩu rất nhỏ hoặc vụn; không thêm “bánh” hay “thức ăn” vì nguyên văn không nêu rõ.
- source_word: τῶν παιδίων
  choice: của con cái
  rationale: Giữ quan hệ sở hữu/liên hệ của sở hữu cách và sự nối kết từ vựng với hình ảnh “con cái” trong câu trước.
theological_decisions:
- issue: Cách dịch κύριε trong lời người phụ nữ nói với Đức Giê-su
  choice: Thưa Chúa
  alternative: Thưa ngài
  rationale: κύριε có thể vừa là tước hiệu “Chúa” vừa là cách xưng hô kính trọng. Bản chính giữ “Chúa” nhưng chú thích nêu rõ nghĩa thay thế để không xóa bỏ tính đa nghĩa của nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng nhưng dễ hiểu. “Thưa Chúa” giữ sắc thái kính trọng trong đối thoại; “ngay cả ... cũng” truyền đạt lực nhấn của καί. Tránh thêm “bánh” vào ψιχίων và tránh dịch κυνάρια là “chó con,” vốn dễ bị hiểu riêng là chó non.
