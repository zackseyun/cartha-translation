  text: ⸀ἀφέντες τὴν ἐντολὴν τοῦ θεοῦ κρατεῖτε τὴν παράδοσιν τῶν ⸀ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/008.yaml
  text: Leaving the commandment of God[a], you hold fast to the tradition of men.
translation:
  language: vi
  text: Các ông gạt bỏ điều răn của Đức Chúa Trời mà giữ chặt truyền thống của loài người.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀφέντες
  choice: gạt bỏ
  rationale: Phân từ bất định chủ động diễn tả việc đặt điều răn sang một bên. “Gạt bỏ” tự nhiên trong tiếng Việt và truyền đạt lời quở trách rõ hơn “rời bỏ”, nhưng không mạnh quá mức như “từ bỏ hoàn toàn”.
- source_word: τὴν ἐντολὴν
  choice: điều răn
  rationale: “Điều răn” giữ sắc thái tôn giáo và thẩm quyền thần thượng của ἐντολή trong cuộc tranh luận này.
- source_word: τοῦ θεοῦ
  choice: của Đức Chúa Trời
  rationale: Sở hữu cách chỉ nguồn gốc và thẩm quyền thần thượng của điều răn; “Đức Chúa Trời” là cách gọi trang trọng, quen thuộc trong tiếng Việt.
- source_word: κρατεῖτε
  choice: giữ chặt
  rationale: κρατέω ở đây chỉ sự bám giữ và kiên quyết tuân theo; “giữ chặt” bảo toàn lực nhấn mạnh ấy.
- source_word: τὴν παράδοσιν
  choice: truyền thống
  rationale: “Truyền thống” là cách tương đương tự nhiên, chỉ điều được con người truyền lại qua các thế hệ.
- source_word: τῶν ἀνθρώπων
  choice: của loài người
  rationale: ἀνθρώπων chỉ con người nói chung, không riêng nam giới. “Loài người” đồng thời làm nổi bật sự đối lập giữa nguồn gốc từ con người và nguồn gốc từ Đức Chúa Trời.
theological_decisions:
- issue: Sự đối lập giữa điều răn của Đức Chúa Trời và truyền thống của con người
  choice: 'Giữ nguyên đối lập trực tiếp: “điều răn của Đức Chúa Trời” và “truyền thống của loài người”.'
  alternative: Dùng “truyền thống của người ta” hoặc diễn giải câu như một lời bác bỏ mọi truyền thống.
  rationale: Câu này lên án việc gạt bỏ mệnh lệnh thần thượng để bám giữ truyền thống có nguồn gốc con người; nó không tự thân khẳng định rằng mọi truyền thống đều sai.
translation_notes:
  register: Văn phong hiện đại, trang trọng và trực tiếp. “Các ông” phù hợp với lời Đức Chúa Jêsus đang nói với nhóm người Pha-ri-si và các thầy thông giáo trong ngữ cảnh; câu giữ cấu trúc đối lập rõ ràng, dễ hiểu.
