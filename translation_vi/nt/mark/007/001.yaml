  text: Καὶ συνάγονται πρὸς αὐτὸν οἱ Φαρισαῖοι καί τινες τῶν γραμματέων ἐλθόντες ἀπὸ Ἱεροσολύμων
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/001.yaml
  text: And the Pharisees and some of the scribes[a], who had come from Jerusalem, gather around him.
translation:
  language: vi
  text: Và những người Pha-ri-si cùng một số kinh sư, đã từ Giê-ru-sa-lem đến, tụ họp quanh Đức Giê-su.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “tụ họp về phía Đức Giê-su.” Cụm từ Hy Lạp theo sát nghĩa là “tụ họp đến với Ngài”; “tụ họp quanh Đức Giê-su” tự nhiên hơn trong tiếng Việt ở văn mạch này.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: Và
  rationale: Giữ chức năng nối tiếp mạch kể chuyện thường thấy trong Mác.
- source_word: συνάγονται πρὸς αὐτὸν
  choice: tụ họp quanh Đức Giê-su
  rationale: Diễn đạt tự nhiên trong tiếng Việt ý nhóm người tụ lại hướng về và ở quanh Đức Giê-su; thì hiện tại kể chuyện được chuyển bằng động từ tiếng Việt không đánh dấu thì.
- source_word: οἱ Φαρισαῖοι
  choice: những người Pha-ri-si
  rationale: Dùng tên phiên âm quen thuộc cho nhóm Do Thái này, với từ chỉ người để câu tự nhiên và rõ nghĩa.
- source_word: τινες τῶν γραμματέων
  choice: một số kinh sư
  rationale: ‘Một số’ giữ ý bộ phận của τινες; ‘kinh sư’ là cách gọi ngắn gọn, phổ biến trong văn cảnh Tân Ước cho những người chuyên về Kinh Luật.
- source_word: ἐλθόντες ἀπὸ Ἱεροσολύμων
  choice: từ Giê-ru-sa-lem đến
  rationale: Giữ nguồn xuất phát và hành động đến trước khi tụ họp, đồng thời dùng trật tự tự nhiên của tiếng Việt.
- source_word: αὐτόν
  choice: Đức Giê-su
  rationale: Thay đại từ bằng tên riêng để câu tiếng Việt đứng độc lập rõ ràng; nhân vật quy chiếu trong văn cảnh là Đức Giê-su.
