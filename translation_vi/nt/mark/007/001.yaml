  terminology: “Pha-ri-si,” “kinh sư,” “Giê-ru-sa-lem,” và “Đức Giê-su” đều phù hợp với cách dùng Kinh Thánh tiếng Việt hiện đại. Không cần thay đổi thuật ngữ.
  issues:
  - severity: low
    issue: Cụm trạng ngữ “từ Giê-ru-sa-lem đến” có thể gây mơ hồ về quan hệ thời gian với “tụ họp”.
    rationale: Phân từ ἐλθόντες diễn tả việc đã đến trước hành động chính συνάγονται. Mệnh đề “đã từ ... đến” biểu đạt quan hệ này rõ và tự nhiên hơn.
  - severity: low
    issue: Chú thích thay thế chưa nêu sát cách nói theo nghĩa đen của πρός αὐτόν.
    rationale: “Tụ họp đến bên” không tự nhiên trong tiếng Việt. “Tụ họp về phía/ngay với Đức Giê-su” cho thấy hướng quy chiếu của cụm Hy Lạp mà vẫn ghi nhận bản dịch chính tự nhiên hơn.
