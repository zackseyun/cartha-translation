  terminology: “Cho phép” là lựa chọn đúng cho ἀφίετε trong ngữ cảnh này. Cách nói “làm bất cứ điều gì cho cha hoặc mẹ mình” giữ tính rộng của ποιῆσαι ... τῷ πατρὶ ἢ τῇ μητρί. Chú thích nêu khả năng trợ giúp thiết thực hoặc tài chính như một hàm ý ngữ cảnh, không áp đặt vào chính văn.
