translation:
  language: vi
  text: thì các ông không còn cho phép người ấy làm bất cứ điều gì cho cha hoặc mẹ mình.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “làm bất cứ điều gì để giúp đỡ cha hoặc mẹ mình.” Trong ngữ cảnh này, cách diễn đạt rộng của tiếng Hy Lạp có thể bao gồm sự trợ giúp thiết thực hoặc tài chính.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκέτι
  choice: không còn
  rationale: Diễn đạt tự nhiên ý chấm dứt một điều trước đó vẫn có thể xảy ra.
- source_word: ἀφίετε
  choice: cho phép
  rationale: Trong ngữ cảnh này, động từ mang nghĩa cho phép, chứ không phải tha thứ hay rời bỏ.
- source_word: αὐτὸν
  choice: người ấy
  rationale: Giữ đối tượng số ít giống đực trong tiếng Hy Lạp, đồng thời diễn đạt tự nhiên và rõ đối tượng được nói đến trong tiếng Việt.
- source_word: οὐδὲν ποιῆσαι
  choice: làm bất cứ điều gì
  rationale: Cấu trúc phủ định với động từ cho phép có nghĩa họ ngăn cản mọi hành động; cách diễn đạt này tự nhiên trong tiếng Việt.
- source_word: τῷ πατρὶ ἢ τῇ μητρί
  choice: cho cha hoặc mẹ mình
  rationale: Các danh từ ở tặng cách chỉ người hưởng lợi. Từ “mình” làm rõ đây là cha mẹ của người ấy mà không lặp đại từ nặng nề.
theological_decisions:
- issue: Có nên nói rõ hàm ý trợ giúp vật chất hoặc tài chính từ ngữ cảnh Cô-ban hay không
  choice: 'Giữ cách nói rộng: “làm bất cứ điều gì cho cha hoặc mẹ mình”'
  alternative: “làm bất cứ điều gì để giúp đỡ cha hoặc mẹ mình” hoặc “chu cấp cho cha hoặc mẹ mình”
  rationale: Nguyên văn của câu này có phạm vi rộng, còn ngữ cảnh cho thấy việc trợ giúp thực tế hay tài chính. Bản dịch giữ nguyên độ rộng của lời văn thay vì thu hẹp nghĩa ngay trong chính văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “các ông” vì câu này tiếp nối lời Đức Giê-su trực tiếp trách những người đối thoại trong ngữ cảnh; “thì” thể hiện quan hệ hệ quả với câu trước. Giữ cách nói tổng quát của nguyên văn và đưa hàm ý trợ giúp vào chú thích.
