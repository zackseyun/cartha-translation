  verdict: revise
  source_fidelity: 'Bản dịch giữ đúng trục đối lập của câu: vật được ăn không vào «lòng» mà vào «bụng», rồi ra nơi bài tiết. Tuy nhiên, chú thích hiện dùng «đào thải mọi thức ăn», chuyển καθαρίζων (làm sạch/thanh lọc) thành hành động bài xuất và vì thế không phản ánh sát cách đọc sinh lý được nêu trong nguồn. Cụm phân từ cuối có cú pháp tranh luận; chính văn nên tiếp tục không áp đặt «tuyên bố là thanh sạch».'
  naturalness: «Lòng người ấy», «bụng» và «nơi phóng uế» phù hợp văn phong Kinh Thánh Việt ngữ hiện đại. «Như vậy làm sạch mọi thức ăn» hơi gượng nhưng là cách thận trọng, trực tiếp, và không kém tự nhiên đến mức cần thay bằng một diễn giải mạnh hơn.
  terminology: «Lòng» bảo toàn καρδία theo nghĩa con người nội tâm; «bụng» phù hợp κοιλία; «nơi phóng uế» diễn đạt ἀφεδρών trang trọng mà không hiện đại hóa. Cần sửa thuật ngữ ở chú thích từ «đào thải» sang «thanh lọc» để tương ứng καθαρίζων và vẫn giữ cách hiểu sinh lý.
  issues:
  - severity: medium
    issue: Chú thích thay nghĩa «thanh lọc/làm sạch» bằng «đào thải».
