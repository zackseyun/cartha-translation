    reason: alternative_reading
lexical_decisions:
- source_word: καρδίαν
  choice: lòng
  rationale: “Lòng” tự nhiên trong tiếng Việt và giữ được sự đối lập theo quan niệm Kinh Thánh giữa con người bên trong với đường tiêu hóa; “tâm trí” sẽ thu hẹp nghĩa quá mức.
- source_word: κοιλίαν
  choice: bụng
  rationale: Trong ngữ cảnh tiêu hóa, “bụng” là cách nói phổ thông, tự nhiên và tương ứng với nghĩa sinh lý của từ Hy Lạp.
- source_word: ἀφεδρῶνα
  choice: nơi phóng uế
  rationale: Diễn đạt cụ thể nhưng trang trọng nơi chất thải được đưa ra; tránh “cống” vì dễ gợi một hệ thống thoát nước, và tránh “nhà vệ sinh” vì có thể quá hiện đại.
- source_word: καθαρίζων
  choice: như vậy làm sạch
  rationale: Bám sát hình thức phân từ và không đưa hẳn cách giải thích “tuyên bố là thanh sạch” vào chính văn; cách diễn đạt này vẫn cho phép hiểu là lời giải thích của người kể chuyện hoặc là tiến trình đào thải.
- source_word: βρώματα
  choice: mọi thức ăn
  rationale: “Mọi thức ăn” diễn đạt tự nhiên trong tiếng Việt, đồng thời phản ánh πάντα và phạm vi các loại thực phẩm được bàn đến.
- source_word: αὐτοῦ
  choice: người ấy
  rationale: Đại từ sở hữu Hy Lạp quy chiếu về người đang được nói đến. Tiếng Việt tự nhiên hơn khi diễn đạt “lòng người ấy” thay vì dùng cấu trúc sở hữu lặp lại.
- source_word: εἰσπορεύεται / ἐκπορεύεται
  choice: đi vào / thải ra
  rationale: Giữ sự tương phản về chuyển động; “thải ra” làm rõ nghĩa bài tiết của ἐκπορεύεται trong ngữ cảnh.
theological_decisions:
- issue: Cách hiểu καθαρίζων πάντα τὰ βρώματα
  choice: 'Giữ câu chính ở dạng tương đối trực tiếp: “như vậy làm sạch mọi thức ăn,” có thể được hiểu là lời giải thích của người kể chuyện.'
  alternative: 'Hiểu cụm từ theo nghĩa sinh lý: quá trình tiêu hóa và bài tiết làm sạch hoặc đào thải thức ăn.'
  rationale: Phân từ giống đực số ít thường được xem là lời bình của Mác về hệ quả lời dạy của Chúa Giê-su, nhưng cú pháp khó và cách hiểu sinh lý vẫn có thể có. Chính văn không thêm động từ diễn giải mạnh như “tuyên bố,” còn chú thích bảo tồn cách đọc khác có ý nghĩa thần học.
translation_notes:
  register: Văn phong hiện đại, rõ ràng và trang trọng vừa phải. Dùng “lòng” theo lối nói Kinh Thánh quen thuộc, “bụng” theo cách nói phổ thông, và “nơi phóng uế” để tránh từ quá thô hoặc quá hiện đại. Dấu ngoặc kép đóng theo ngữ cảnh lời nói trực tiếp của các câu trước; gạch ngang giới thiệu lời bình giải thích.
