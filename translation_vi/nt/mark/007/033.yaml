base_translation:
  language: en
  yaml_path: translation/nt/mark/007/033.yaml
  text: And taking him aside from the crowd privately[a], he put his fingers into his ears, and after spitting[b], he touched his tongue.
translation:
  language: vi
  text: Ngài đưa người ấy ra khỏi đám đông, đến một nơi riêng[a], đặt các ngón tay của mình vào tai người ấy; rồi, sau khi nhổ nước bọt[b], Ngài chạm vào lưỡi người ấy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “riêng tư” hoặc “ở riêng.”'
    reason: lexical_alternative
  - marker: b
    text: 'Tiếng Hy Lạp nói: “sau khi nhổ nước bọt, Ngài chạm vào lưỡi người ấy”; câu này không nói rõ Ngài đã bôi nước bọt lên lưỡi người đàn ông.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπολαβόμενος αὐτὸν ἀπὸ τοῦ ὄχλου
  choice: đưa anh ra riêng khỏi đám đông
  rationale: Diễn đạt tự nhiên hành động tách người đàn ông khỏi đám đông, không làm cho động từ mang sắc thái mạnh quá mức.
- source_word: κατ’ ἰδίαν
  choice: ra riêng
  rationale: Cụm từ chỉ việc ở riêng, tách khỏi những người khác; cách dịch này gắn tự nhiên với hành động đưa người đàn ông khỏi đám đông.
- source_word: ἔβαλεν τοὺς δακτύλους αὐτοῦ εἰς τὰ ὦτα αὐτοῦ
  choice: đặt các ngón tay vào tai anh
  rationale: Giữ nguyên hành động cụ thể; “đặt” phù hợp ngữ cảnh hơn nghĩa đen “ném” của βάλλω và không hàm ý dùng sức mạnh.
- source_word: πτύσας
  choice: sau khi nhổ nước bọt
  rationale: Phân từ bất định quá khứ cho thấy hành động xảy ra trước hoặc đi kèm hành động chính. Cách dịch nêu rõ trình tự nhưng không nói nước bọt được bôi vào lưỡi.
- source_word: ἥψατο τῆς γλώσσης αὐτοῦ
  choice: Ngài chạm vào lưỡi anh
  rationale: ἅπτομαι với sở hữu cách thường có nghĩa là “chạm vào”; đại từ trong ngữ cảnh chỉ lưỡi của người đàn ông.
theological_decisions:
- issue: Cách mô tả cử chỉ chữa lành của Chúa Jêsus
  choice: 'Trình bày thẳng các hành động: nhổ nước bọt rồi chạm vào lưỡi người đàn ông.'
  alternative: Nói rằng Ngài bôi hoặc đặt nước bọt lên lưỡi người đàn ông, hay giải thích ý nghĩa biểu tượng hoặc y thuật của hành động.
  rationale: Bản Hy Lạp chỉ nói Ngài nhổ nước bọt và chạm vào lưỡi người ấy, không xác định nước bọt được đưa đi đâu và không giải thích ý nghĩa của cử chỉ. Bản dịch vì thế giữ nguyên sự dè dặt của lời văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” cho Chúa Jêsus và “anh” cho người đàn ông. Dấu chấm phẩy giúp phân tách hai cụm hành động mà vẫn giữ chúng trong cùng một câu.
