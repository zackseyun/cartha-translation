  source_fidelity: 'Bản nháp truyền đạt đúng diễn tiến cơ bản: Chúa Giê-xu nói về lời tiên báo và Phi-e-rơ đưa Ngài ra riêng rồi bắt đầu quở trách. Tuy nhiên, “kéo Ngài sang một bên” gợi hành động lôi kéo, mạnh và có tính thể chất hơn προσλαβόμενος trong ngữ cảnh này; “đưa Ngài ra riêng” diễn đạt phù hợp hơn. Với παρρησίᾳ trong mạch văn, “rõ ràng” tự nhiên hơn “cách công khai”, vì trọng tâm là lời nói thẳng, không che giấu, chứ không nhất thiết là địa điểm hay sự công bố trước công chúng.'
