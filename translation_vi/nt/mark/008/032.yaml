  yaml_path: translation/nt/mark/008/032.yaml
  text: And he was speaking the word openly[a]. And Peter took him aside and began to rebuke him.
translation:
  language: vi
  text: Ngài nói điều ấy một cách rõ ràng[a]. Phi-e-rơ đưa Ngài ra riêng và bắt đầu quở trách Ngài.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “công khai,” “thẳng thắn” hoặc “mạnh dạn.” Từ Hy Lạp diễn tả lời nói cởi mở, không che giấu.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρρησίᾳ
  choice: cách công khai
  rationale: Danh từ ở cách dữ liệu được dùng như trạng từ, diễn tả lời nói thẳng thắn, không che giấu. “Cách công khai” phù hợp với mạch văn và vẫn để chú thích nêu các sắc thái “rõ ràng” và “mạnh dạn”.
- source_word: τὸν λόγον
  choice: điều ấy
  rationale: Cụm từ chỉ nội dung lời tiên báo ngay trước đó của Chúa Giê-xu. Trong tiếng Việt hiện đại, “điều ấy” tự nhiên và liên kết rõ với nội dung vừa được nói hơn cách dịch sát chữ “lời ấy”.
- source_word: ἐλάλει
  choice: nói
  rationale: Thì chưa hoàn thành mô tả hành động đang diễn ra; trong câu kể tiếng Việt, “nói” là tự nhiên, còn sắc thái tiến diễn được mạch văn chuyển tải mà không cần thêm từ dễ gây nặng câu.
- source_word: προσλαβόμενος
  choice: kéo Ngài sang một bên
  rationale: Phân từ diễn tả Phi-e-rơ đưa Chúa Giê-xu ra riêng trước khi nói với Ngài. “Kéo ... sang một bên” tự nhiên, làm rõ hàm ý theo ngữ cảnh mà không thêm động cơ.
- source_word: ἤρξατο ἐπιτιμᾶν
  choice: bắt đầu quở trách
  rationale: Giữ rõ cấu trúc khởi đầu hành động của ἤρξατο với động từ nguyên mẫu. “Quở trách” truyền đạt sự sửa trị gay gắt của ἐπιτιμάω trong văn phong Kinh Thánh trang trọng nhưng dễ hiểu.
theological_decisions:
- issue: Sắc thái của παρρησίᾳ trong lời tiên báo về cuộc thương khó
  choice: cách công khai
  alternative: rõ ràng; mạnh dạn
  rationale: Bản dịch nhấn mạnh rằng Chúa Giê-xu nói không che giấu, đồng thời chú thích bảo tồn các sắc thái thẳng thắn, rõ ràng và mạnh dạn của từ Hy Lạp. Không tuyệt đối hóa một sắc thái theo hướng giải thích thần học riêng.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” cho Chúa Giê-xu và phiên âm “Phi-e-rơ” nhất quán với văn phong Kinh Thánh phổ thông; tránh lối dịch quá sát chữ khiến câu thiếu tự nhiên.
