source:
  edition: SBLGNT
  text: καὶ ἐπιλαβόμενος τῆς χειρὸς τοῦ τυφλοῦ ⸀ἐξήνεγκεν αὐτὸν ἔξω τῆς κώμης, καὶ πτύσας εἰς τὰ ὄμματα αὐτοῦ, ἐπιθεὶς τὰς χεῖρας αὐτῷ, ἐπηρώτα αὐτόν· Εἴ τι ⸀βλέπεις;
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/023.yaml
  text: And taking the blind man by the hand[a], he led him out of the village; and after spitting on his eyes and laying his hands on him, he asked him, “Do you see anything?”
translation:
  language: vi
  text: 'Ngài nắm tay người mù, dẫn ông ra khỏi làng. Rồi Ngài nhổ nước bọt vào mắt ông, đặt hai tay trên ông và hỏi: “Ông có thấy gì không?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιλαβόμενος τῆς χειρὸς
  choice: nắm tay
  rationale: Diễn đạt tự nhiên hành động cầm lấy tay người mù để dẫn đi, đồng thời giữ được tính cụ thể của nguyên văn.
- source_word: τοῦ τυφλοῦ
  choice: người mù
  rationale: Tính từ được dùng như danh từ, chỉ người đàn ông mù trong ngữ cảnh; “người mù” là cách nói tự nhiên và trang trọng trong tiếng Việt.
- source_word: ἐξήνεγκεν αὐτὸν ἔξω τῆς κώμης
  choice: dẫn ông ra khỏi làng
  rationale: Động từ có nghĩa cơ bản là đưa ra ngoài; vì Chúa Giê-su đang nắm tay người ấy, “dẫn ... ra” phù hợp với cảnh huống. κώμη được dịch là “làng,” chỉ một khu dân cư nhỏ.
- source_word: πτύσας εἰς τὰ ὄμματα αὐτοῦ
  choice: nhổ nước bọt vào mắt ông
  rationale: Giữ nguyên chi tiết thể chất rõ nét của hành động chữa lành. Giới từ εἰς được thể hiện bằng “vào,” không làm nhẹ đi cách diễn đạt sống động của nguyên văn.
- source_word: ἐπιθεὶς τὰς χεῖρας αὐτῷ
  choice: đặt hai tay trên ông
  rationale: Thể hiện danh từ số nhiều “các bàn tay/hai tay” và hành động chạm trực tiếp, không thêm hàm ý nghi lễ ngoài văn cảnh.
- source_word: ἐπηρώτα αὐτόν
  choice: hỏi
  rationale: Thì chưa hoàn thành trong lời kể có thể được diễn đạt tự nhiên bằng động từ đơn “hỏi”; ngữ cảnh không đòi hỏi nhấn mạnh hành động kéo dài.
- source_word: Εἴ τι βλέπεις;
  choice: Ông có thấy gì không?
  rationale: Cấu trúc câu hỏi với τι được chuyển thành mẫu “có ... gì không,” vừa tự nhiên trong tiếng Việt vừa giữ tính bất định của câu hỏi.
theological_decisions:
- issue: Giữ nguyên tính cụ thể của các hành động chữa lành
  choice: Dịch rõ việc Ngài nhổ nước bọt vào mắt người mù và đặt hai tay trên ông.
  alternative: Diễn ý nhẹ hơn, lược bớt hoặc làm mờ các chi tiết thể chất.
  rationale: Bản văn trình bày một tiến trình chữa lành hữu hình và cụ thể; không nên làm dịu chi tiết gây bất ngờ cho độc giả hiện đại.
- issue: Hàm ý nghi lễ của hành động đặt tay
  choice: Dùng “đặt hai tay trên ông” như lời mô tả hành động chạm vào người bệnh.
  alternative: Dùng thuật ngữ khiến hành động này được hiểu như một nghi thức chính thức.
  rationale: Trong văn cảnh, đây là hành động chữa lành của Chúa Giê-su; bản văn không yêu cầu gán thêm ý nghĩa bí tích, phong chức hay nghi lễ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu được chia thành hai nhịp để lời kể tự nhiên trong tiếng Việt, trong khi vẫn giữ thứ tự các hành động của nguyên văn. Đại từ “Ngài” dành cho Chúa Giê-su và “ông” dành cho người mù giúp phân biệt chủ thể rõ ràng.
