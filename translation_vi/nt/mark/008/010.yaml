  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Giê-su” và “môn đồ” theo lối hành văn Kinh Thánh phổ thông; cấu trúc câu giữ nhịp kể nhanh của nguyên văn.
