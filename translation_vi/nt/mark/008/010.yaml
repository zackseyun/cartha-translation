source:
  edition: SBLGNT
  text: καὶ ⸀εὐθὺς ἐμβὰς εἰς τὸ πλοῖον μετὰ τῶν μαθητῶν αὐτοῦ ἦλθεν εἰς τὰ μέρη Δαλμανουθά.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/010.yaml
  text: And immediately[a], getting into the boat with his disciples, he went to the region of Dalmanutha.
translation:
  language: vi
  text: Ngay lập tức, Đức Giê-su lên thuyền cùng các môn đồ và đi đến vùng Đan-ma-nu-tha.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “khu vực Đan-ma-nu-tha.” Cụm từ Hy Lạp dùng dạng số nhiều, theo sát chữ là “các miền/phần của Đan-ma-nu-tha.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθὺς
  choice: ngay lập tức
  rationale: Giữ sắc thái khẩn trương đặc trưng trong lối kể của Mác và diễn đạt tự nhiên trong tiếng Việt hiện đại.
- source_word: ἐμβὰς
  choice: lên thuyền
  rationale: Phân từ bất định của ἐμβαίνω chỉ hành động xảy ra trước động từ chính; tiếng Việt diễn đạt tự nhiên bằng chuỗi động từ “lên… và đi”.
- source_word: πλοῖον
  choice: thuyền
  rationale: Phù hợp với phương tiện đi lại trong bối cảnh Biển Ga-li-lê; “tàu” dễ gợi một phương tiện lớn hơn.
- source_word: μετὰ τῶν μαθητῶν αὐτοῦ
  choice: cùng các môn đồ
  rationale: Diễn đạt rõ ý đồng hành của μετά với sở hữu từ αὐτοῦ được hiểu tự nhiên theo chủ ngữ Đức Giê-su.
- source_word: ἦλθεν
  choice: đi đến
  rationale: Trong mạch kể về sự di chuyển tới một địa điểm, “đi đến” tự nhiên hơn “đến” đơn thuần và vẫn giữ ý của ἔρχομαι.
- source_word: τὰ μέρη
  choice: vùng
  rationale: Danh từ số nhiều được dùng theo nghĩa địa lý chỉ một vùng hay khu vực; “vùng” vừa gọn vừa tự nhiên.
- source_word: Δαλμανουθά
  choice: Đan-ma-nu-tha
  rationale: Phiên âm địa danh Hy Lạp sang cách đọc rõ ràng, quen thuộc với văn phong Kinh Thánh tiếng Việt.
theological_decisions: []
