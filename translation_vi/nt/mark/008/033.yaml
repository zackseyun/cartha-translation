  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὁ δὲ ἐπιστραφεὶς καὶ ἰδὼν τοὺς μαθητὰς αὐτοῦ ἐπετίμησεν ⸀Πέτρῳ ⸂καὶ λέγει⸃· Ὕπαγε ὀπίσω μου, Σατανᾶ, ὅτι οὐ φρονεῖς τὰ τοῦ θεοῦ ἀλλὰ τὰ τῶν ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/033.yaml
  text: But turning around and seeing his disciples[a], he rebuked Peter and said, “Get behind me, Satan, because you are not setting your mind on the things of God, but on the things of men.”
translation:
  language: vi
  text: 'Nhưng Ngài quay lại, thấy các môn đồ của Ngài, quở trách Phi-e-rơ và nói: “Hãy lui ra đằng sau Ta, Sa-tan! Vì ngươi không để tâm đến những điều thuộc về Đức Chúa Trời, nhưng đến những điều thuộc về loài người[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn Hy Lạp có thể dịch sát là “những điều của loài người”, tức những điều hoặc mối quan tâm thuộc về con người nói chung.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιστραφεὶς
  choice: quay lại
  rationale: Diễn tả sự đổi hướng thân thể của Đức Giê-su trước khi Ngài nói với Phi-e-rơ; cách nói tự nhiên trong tiếng Việt.
- source_word: ἰδὼν
  choice: thấy
  rationale: 'Giữ trình tự hành động của hai phân từ: Ngài quay lại rồi nhìn thấy các môn đồ.'
- source_word: μαθητὰς
  choice: các môn đồ
  rationale: Thuật ngữ quen thuộc trong văn cảnh Phúc Âm, chỉ những người theo học Đức Giê-su.
- source_word: ἐπετίμησεν
  choice: quở trách
  rationale: Thể hiện lời khiển trách mạnh, phù hợp với cách dùng ἐπιτιμάω trong các sách Phúc Âm.
- source_word: καὶ λέγει
  choice: và nói
  rationale: Dịch hiện tại lịch sử bằng thì kể chuyện tự nhiên trong tiếng Việt.
- source_word: Ὕπαγε ὀπίσω μου
  choice: Hãy lui ra đằng sau Ta
  rationale: Giữ cả mệnh lệnh mạnh lẫn hình ảnh Phi-e-rơ phải trở về vị trí phía sau, thay vì đứng trước như một trở lực.
- source_word: Σατανᾶ
  choice: Sa-tan
  rationale: Phiên âm danh xưng ở dạng hô cách, không thu hẹp nghĩa thành một từ chung như “kẻ chống đối”.
- source_word: φρονεῖς
  choice: tâm trí ngươi không hướng về … mà hướng về
  rationale: Diễn đạt khuynh hướng, mối quan tâm và lập trường của tâm trí, chứ không chỉ một ý nghĩ thoáng qua.
- source_word: τὰ τοῦ θεοῦ
  choice: những điều thuộc về Đức Chúa Trời
  rationale: Giữ cách diễn đạt rộng và độ mở thần học của cấu trúc Hy Lạp, không tự ý cụ thể hóa thành ý muốn hay quyền lợi.
- source_word: τὰ τῶν ἀνθρώπων
  choice: những điều thuộc về loài người
  rationale: ἄνθρωποι chỉ nhân loại nói chung; “loài người” truyền đạt nghĩa bao quát và duy trì thế đối lập với những điều thuộc về Đức Chúa Trời.
theological_decisions:
- issue: Đối tượng của danh xưng “Sa-tan” trong lời quở trách
  choice: Giữ lời Đức Giê-su trực tiếp gọi Phi-e-rơ là “Sa-tan” trong câu quở trách.
  alternative: Hiểu rằng Đức Giê-su đang nói với Sa-tan ở phía sau Phi-e-rơ, hoặc dùng “sa-tan” chỉ với nghĩa chung là “kẻ chống đối”.
  rationale: Ngữ pháp nêu Phi-e-rơ là người bị quở trách rồi tiếp ngay bằng lời xưng hô trực tiếp. Bản dịch giữ nguyên sức nặng và sự căng thẳng của câu mà không khẳng định Phi-e-rơ chính là Sa-tan theo nghĩa bản thể.
- issue: Phạm vi nghĩa của ἀνθρώπων
  choice: loài người
  alternative: đàn ông; người ta; con người
  rationale: Trong câu này, từ Hy Lạp nói về con người nói chung, đối lập với Đức Chúa Trời, chứ không giới hạn ở nam giới.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “Ta/ngươi” giữ sắc thái uy quyền và lời quở trách trực diện; “Ngài” cung cấp chủ ngữ cần thiết trong tiếng Việt mà không thêm tên riêng vốn không có trong câu Hy Lạp.
