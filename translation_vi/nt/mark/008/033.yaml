revisions:
- from: 'Nhưng Ngài quay lại, thấy các môn đồ của mình, thì quở trách Phi-e-rơ và nói: “Hãy lui ra đằng sau Ta, Sa-tan! Vì tâm trí ngươi không hướng về những điều thuộc về Đức Chúa Trời, mà hướng về những điều thuộc về loài người[a].”'
  to: 'Nhưng Ngài quay lại, thấy các môn đồ của Ngài, quở trách Phi-e-rơ và nói: “Hãy lui ra đằng sau Ta, Sa-tan! Vì ngươi không để tâm đến những điều thuộc về Đức Chúa Trời, nhưng đến những điều thuộc về loài người[a].”'
  rationale: 'Bản sửa chỉ cải thiện độ tự nhiên và sự rõ ràng của tiếng Việt, đồng thời giữ nguyên các yếu tố then chốt của bản gốc: lời quở trách trực tiếp nhắm đến Phi-e-rơ, danh xưng “Sa-tan”, mệnh lệnh bảo ông lui về phía sau Đức Giê-su, và sự đối lập mở giữa những điều thuộc về Đức Chúa Trời với những điều thuộc về loài người.'
