  text: οἱ δὲ ⸂εἶπαν αὐτῷ λέγοντες⸃ ⸀ὅτι Ἰωάννην τὸν βαπτιστήν, καὶ ἄλλοι Ἠλίαν, ἄλλοι δὲ ⸂ὅτι εἷς⸃ τῶν προφητῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/028.yaml
  text: They told him[a], saying, “John the Baptist; and others, Elijah; but others, one of the prophets.”
translation:
  language: vi
  text: 'Họ thưa với Ngài: “Có người nói Ngài là Giăng Báp-tít; người khác nói Ngài là Ê-li; còn người khác nói Ngài là một trong các nhà tiên tri.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch sát tính tỉnh lược hơn: “Họ thưa với Ngài: ‘Giăng Báp-tít; người khác, Ê-li; còn người khác, một trong các nhà tiên tri.’” Trong tiếng Hy Lạp, các vế sau lược bỏ động từ nói và vị ngữ được ngầm hiểu là “Ngài là.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ
  choice: Họ
  rationale: Chủ thể được tiếp nối từ văn cảnh trước là các môn đồ; tiểu từ δέ có tính chuyển tiếp nhẹ nên không cần dịch riêng trong tiếng Việt.
- source_word: εἶπαν αὐτῷ λέγοντες
  choice: thưa với Ngài
  rationale: Cấu trúc động từ hữu hạn kèm phân từ cùng gốc λέγω là công thức dẫn lời; tiếng Việt tự nhiên có thể gộp thành “thưa với Ngài”. “Thưa” phù hợp với lời môn đồ nói cùng Chúa Giê-su mà không thêm ý “trả lời” vốn không hiện diện rõ trong cụm từ này.
- source_word: Ἰωάννην τὸν βαπτιστήν
  choice: Giăng Báp-tít
  rationale: Dùng tên gọi Kinh Thánh quen thuộc trong tiếng Việt; “Báp-tít” ở đây là danh hiệu lịch sử của Giăng, không phải tên một hệ phái.
- source_word: ἄλλοι ... ἄλλοι δὲ
  choice: người khác thì ... còn người khác nữa
  rationale: Giữ sự phân nhóm và nét tương phản của nguyên văn, đồng thời diễn đạt tự nhiên bằng tiếng Việt.
- source_word: Ἠλίαν
  choice: Ê-li
  rationale: Dùng dạng tên riêng quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
- source_word: ὅτι εἷς τῶν προφητῶν
  choice: nói một trong các nhà tiên tri
  rationale: Giữ cách nói tỉnh lược của tiếng Hy Lạp; động từ “nói” được bổ sung tối thiểu để chuỗi ý kiến được rõ ràng trong tiếng Việt, còn vị ngữ ngầm hiểu “Ngài là” không bị lặp lại.
- source_word: προφητῶν
  choice: các nhà tiên tri
  rationale: Cách dịch chuẩn và dễ hiểu của προφῆται trong bối cảnh các nhân vật tiên tri của Y-sơ-ra-ên.
theological_decisions:
- issue: Cách trình bày những nhận định phổ biến về căn tính Chúa Giê-su
  choice: Giữ chuỗi nhận định rút gọn, không thêm “Ngài là” vào từng vế.
  alternative: 'Họ thưa với Ngài: “Có người nói Ngài là Giăng Báp-tít; người khác nói Ngài là Ê-li; còn người khác nói Ngài là một trong các nhà tiên tri.”'
  rationale: Nguyên văn có lối tỉnh lược và tập trung vào nhiều ý kiến khác nhau của dân chúng. Bản dịch giữ độ cô đọng ấy nhưng thêm “nói” ở các vế sau để câu tiếng Việt rõ nghĩa.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “Ngài” thể hiện cách xưng hô kính trọng quen thuộc trong văn bản Kinh Thánh tiếng Việt. Dấu chú thích [a] được đặt ngay sau câu.
