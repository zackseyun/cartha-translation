  text: Σπλαγχνίζομαι ἐπὶ τὸν ὄχλον ὅτι ἤδη ἡμέραι τρεῖς προσμένουσίν μοι καὶ οὐκ ἔχουσιν τί φάγωσιν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/002.yaml
  text: I have compassion on the crowd, because they have already remained with me for three days and have nothing to eat.
translation:
  language: vi
  text: “Tôi thương xót đám đông, vì họ đã ở với tôi ba ngày rồi và không có gì để ăn.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Σπλαγχνίζομαι
  choice: Tôi thương xót
  rationale: Động từ diễn tả lòng thương cảm sâu sắc. “Thương xót” trang trọng, tự nhiên trong văn cảnh và giữ thì hiện tại.
- source_word: ἐπὶ τὸν ὄχλον
  choice: đám đông này
  rationale: ἐπί với đối cách chỉ đối tượng của lòng thương xót. Tiếng Việt không cần dịch riêng giới từ sau “thương xót”; thêm “này” giúp lời nói trực tiếp tự nhiên và xác định đám đông đang hiện diện.
- source_word: ὅτι
  choice: vì
  rationale: Liên từ nêu nguyên nhân khiến Chúa Giê-xu thương xót đám đông.
- source_word: ἤδη ἡμέραι τρεῖς
  choice: ba ngày rồi
  rationale: Cách nói tự nhiên trong tiếng Việt, truyền đạt cả khoảng thời gian ba ngày và sắc thái “đã/đến nay” của ἤδη.
- source_word: προσμένουσίν μοι
  choice: họ đã ở với tôi
  rationale: προσμένω với dữ cách diễn tả việc tiếp tục ở lại với một người. “Ở với tôi” rõ nghĩa và tự nhiên; “đã” phối hợp với “rồi” để thể hiện tình trạng kéo dài đến hiện tại.
- source_word: καὶ οὐκ ἔχουσιν τί φάγωσιν
  choice: mà không có gì ăn
  rationale: “Mà” diễn đạt tự nhiên hoàn cảnh đi kèm có tính đáng thương; “không có gì ăn” chuyển đúng thành ngữ ἔχω + τί + động từ giả định.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và dễ hiểu. Đại từ “tôi” phản ánh lời nói trực tiếp của Chúa Giê-xu mà không thêm danh xưng không có trong câu Hy Lạp. Không cần chú thích.
