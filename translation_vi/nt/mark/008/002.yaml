  to: “Tôi thương xót đám đông, vì họ đã ở với tôi ba ngày rồi và không có gì để ăn.”
  rationale: Bản sửa loại bỏ yếu tố chỉ thị không có trong nguyên văn và dùng liên từ “và” để giữ sát quan hệ nối của καὶ, không thay đổi ý nghĩa của câu. Cách diễn đạt về thời lượng vẫn tự nhiên và giữ được sắc thái ἤδη cùng tình trạng tiếp diễn của προσμένουσιν.
