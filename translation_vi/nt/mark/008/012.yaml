language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἀναστενάξας τῷ πνεύματι αὐτοῦ λέγει· Τί ἡ γενεὰ αὕτη ⸂ζητεῖ σημεῖον⸃; ἀμὴν λέγω ⸀ὑμῖν, εἰ δοθήσεται τῇ γενεᾷ ταύτῃ σημεῖον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/012.yaml
  text: And sighing deeply in his spirit[a], he says, “Why does this generation seek a sign? Truly I say to you, no sign will be given to this generation.”
translation:
  language: vi
  text: 'Ngài thở dài thật sâu trong lòng rồi nói: “Tại sao thế hệ này tìm kiếm một dấu lạ? Tôi nói thật với các ông: sẽ không có dấu lạ nào được ban cho thế hệ này.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát hơn: “nếu một dấu lạ sẽ được ban cho thế hệ này”—một cách nói theo lối thề trong tiếng Hy Lạp, có nghĩa là sẽ không có dấu lạ nào được ban.'
    reason: Giải thích cách nói theo lối thề và bảo tồn hình thức sát chữ của nguyên văn.
lexical_decisions:
- source_word: ἀναστενάξας
  choice: thở dài sâu xa
  rationale: Động từ có tiền tố tăng cường, diễn tả một tiếng thở dài sâu nặng; cách dịch này giữ được cường độ mà không cường điệu thành than khóc.
- source_word: τῷ πνεύματι αὐτοῦ
  choice: trong tâm linh mình
  rationale: Giữ hình ảnh nhân học của nguyên văn và sắc thái chỉ phạm vi, thay vì giản lược thành một phản ứng chỉ mang tính tâm lý như “trong lòng”.
- source_word: λέγει
  choice: nói
  rationale: Thì hiện tại lịch sử trong tiếng Hy Lạp làm lời kể sinh động; tiếng Việt tự nhiên không cần đánh dấu riêng sự chuyển thì này.
- source_word: Τί
  choice: Tại sao
  rationale: Trong cấu trúc này, τί mang nghĩa hỏi lý do; “Tại sao” vừa chính xác vừa tự nhiên.
- source_word: γενεὰ
  choice: thế hệ
  rationale: Giữ cả sắc thái tập thể lẫn thời đại của từ Hy Lạp, không thu hẹp thành “những người này”.
- source_word: ζητεῖ
  choice: tìm kiếm
  rationale: Là đối ứng trực tiếp, không tăng sắc thái đối đầu thành “đòi hỏi”, dù văn cảnh có tính chất thử thách.
- source_word: σημεῖον
  choice: dấu lạ
  rationale: “Dấu lạ” là cách nói tự nhiên trong ngữ cảnh Kinh Thánh, diễn đạt một dấu hiệu siêu nhiên có chức năng chứng thực mà không thêm lời giải thích vào chính văn.
- source_word: ἀμὴν λέγω ὑμῖν
  choice: Thật, tôi nói với các ông
  rationale: Giữ tính trang trọng và nhấn mạnh của công thức ἀμήν, đồng thời dùng lối diễn đạt rõ ràng trong tiếng Việt hiện đại.
- source_word: εἰ δοθήσεται τῇ γενεᾷ ταύτῃ σημεῖον
  choice: sẽ không có dấu lạ nào được ban cho thế hệ này
  rationale: Đây là mệnh đề thề kiểu Do Thái với εἰ, có chức năng phủ định mạnh. Dịch rõ ý phủ định giúp độc giả tiếng Việt hiểu đúng lực ngôn trung của câu.
theological_decisions:
- issue: Cách hiểu mệnh đề εἰ theo lối thề sau ἀμὴν λέγω ὑμῖν
  choice: 'Diễn đạt thành lời phủ định dứt khoát: “sẽ không có dấu lạ nào được ban cho thế hệ này”'
  alternative: 'Dịch sát hình thức: “nếu một dấu lạ sẽ được ban cho thế hệ này”'
  rationale: Cấu trúc Hy Lạp là một lời thề rút gọn mang nghĩa phủ định mạnh. Chính văn diễn đạt ý nghĩa, còn chú thích bảo tồn hình thức và sự căng thẳng của nguyên ngữ.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “Ngài” trong lời kể và “tôi/các ông” trong lời trực tiếp để giữ sự tự nhiên của hội thoại; tránh thuật ngữ giáo phái. Cụm “trong tâm linh mình” chủ ý giữ ngôn ngữ nhân học của nguyên văn.
