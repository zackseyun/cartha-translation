revisions:
- from: Những người Pha-ri-si đi ra và bắt đầu tranh luận với Đức Giê-su. Để thử Ngài, họ xin Ngài một dấu lạ từ trời[a].
  to: Người Pha-ri-si đi ra và bắt đầu tranh luận với Đức Giê-su, xin Ngài một dấu lạ từ trời để thử Ngài[a].
  rationale: Bản sửa giữ nguyên ý nghĩa và các lựa chọn thuật ngữ của bản nháp, nhưng phục hồi liên hệ rõ ràng giữa việc xin dấu lạ và động cơ thử Đức Giê-su. Câu được làm gọn theo cách dùng tiếng Việt hiện đại, đồng thời vẫn giữ tính mơ hồ hợp lý của “từ trời” trong bản văn chính và trong chú thích.
