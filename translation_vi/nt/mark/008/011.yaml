reference: Mark 8:11
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Καὶ ἐξῆλθον οἱ Φαρισαῖοι καὶ ἤρξαντο συζητεῖν αὐτῷ, ζητοῦντες παρ’ αὐτοῦ σημεῖον ἀπὸ τοῦ οὐρανοῦ, πειράζοντες αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/011.yaml
  text: And the Pharisees came out and began to argue with him[a], seeking from him a sign from heaven, testing him.
translation:
  language: vi
  text: Người Pha-ri-si đi ra và bắt đầu tranh luận với Đức Giê-su, xin Ngài một dấu lạ từ trời để thử Ngài[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “một dấu lạ từ bầu trời”; nhưng cụm này nhiều khả năng chỉ một dấu lạ có nguồn gốc từ trời, tức là từ Đức Chúa Trời.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθον
  choice: đi ra
  rationale: Động từ aorist của ἐξέρχομαι diễn tả việc họ bước ra và xuất hiện trong câu chuyện; tiếng Hy Lạp không xác định họ đi ra từ đâu.
- source_word: ἤρξαντο συζητεῖν
  choice: bắt đầu tranh luận
  rationale: Giữ sắc thái khởi đầu của ἤρξαντο và tính đối kháng của συζητεῖν trong bối cảnh họ thử Đức Giê-su.
- source_word: αὐτῷ
  choice: với Đức Giê-su
  rationale: Dative sau συζητεῖν mang nghĩa 'với'. Dùng tên Đức Giê-su giúp câu tiếng Việt rõ chủ thể theo mạch văn, dù nguyên văn dùng đại từ.
- source_word: ζητοῦντες παρ’ αὐτοῦ
  choice: họ xin Ngài
  rationale: ζητέω trong kết cấu ζητεῖν παρά τινος có thể diễn tả việc yêu cầu ai cung cấp điều gì; 'xin Ngài' tự nhiên hơn lối dịch sát 'tìm kiếm từ Ngài', nhưng không tăng sắc thái thành 'đòi hỏi'.
- source_word: σημεῖον
  choice: một dấu lạ
  rationale: '''Dấu lạ'' là cách diễn đạt quen thuộc và dễ hiểu trong tiếng Việt, giữ trọng tâm vào ý nghĩa chứng thực của sự việc chứ không chỉ vào quyền năng siêu nhiên.'
- source_word: ἀπὸ τοῦ οὐρανοῦ
  choice: từ trời
  rationale: Giữ cấu trúc nguồn gốc của ἀπό và sự hàm nghĩa thần học của οὐρανός, đồng thời để chú thích ghi nhận khả năng hiểu theo nghĩa bầu trời.
- source_word: πειράζοντες αὐτόν
  choice: Để thử Ngài
  rationale: Phân từ nêu mục đích hoặc động cơ của lời yêu cầu. 'Thử' giữ được tính thách thức đối kháng mà không mặc nhiên mang nghĩa dụ dỗ phạm tội.
theological_decisions:
- issue: Ý nghĩa của cụm 'từ trời' trong yêu cầu về dấu lạ
  choice: Giữ 'một dấu lạ từ trời', chủ yếu gợi nguồn gốc hoặc sự chuẩn nhận từ Đức Chúa Trời
  alternative: một dấu lạ từ bầu trời
  rationale: Bối cảnh Tin Mừng cho thấy yêu cầu về sự xác nhận có nguồn gốc thiên thượng, nhưng bản dịch chính vẫn giữ cách nói cô đọng của nguyên văn và chú thích bảo lưu nghĩa từ vựng khác.
- issue: Sắc thái của πειράζοντες
  choice: thử Ngài
  alternative: cám dỗ Ngài
  rationale: Ở đây hành động là đặt Đức Giê-su vào một cuộc thử thách mang tính thù nghịch, không nhất thiết là dụ Ngài phạm tội.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu được tái cấu trúc nhẹ để phân từ cuối câu nêu rõ động cơ của nhóm Pha-ri-si; 'Đức Giê-su' và 'Ngài' tạo tham chiếu tự nhiên trong tiếng Việt.
