  source_fidelity: 'Bản nháp chuyển tải đúng các yếu tố chính: người Pha-ri-si đi ra, bắt đầu tranh luận với Đức Giê-su, xin một dấu lạ từ trời, với động cơ thử Ngài. Tuy nhiên, việc tách “Để thử Ngài” thành câu riêng và đưa lên trước mệnh đề xin dấu lạ làm lỏng liên hệ trực tiếp của phân từ πειράζοντες với toàn bộ hành động đang diễn ra. Nên giữ các hành động trong một câu và đặt động cơ ở cuối, gần hành động xin dấu lạ.'
