id: MRK.8.6
reference: Mark 8:6
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ⸀παραγγέλλει τῷ ὄχλῳ ἀναπεσεῖν ἐπὶ τῆς γῆς· καὶ λαβὼν τοὺς ἑπτὰ ἄρτους εὐχαριστήσας ἔκλασεν καὶ ἐδίδου τοῖς μαθηταῖς αὐτοῦ ἵνα ⸀παρατιθῶσιν καὶ παρέθηκαν τῷ ὄχλῳ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/006.yaml
  text: And he instructed the crowd to recline on the ground[a]. Then, taking the seven loaves, after giving thanks he broke them and kept giving them to his disciples so that they might set them before the crowd[b], and they set them before the crowd.
translation:
  language: vi
  text: Ngài truyền cho đám đông ngồi xuống đất[a]. Rồi, cầm lấy bảy ổ bánh, Ngài dâng lời tạ ơn, bẻ các ổ bánh và liên tục trao cho các môn đồ để họ đặt bánh trước mặt đám đông[b]. Họ đặt bánh trước mặt đám đông.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “ngả mình xuống.” Động từ Hy Lạp cụ thể hơn, gợi tư thế ngả mình để dùng bữa.
    reason: lexical_alternative
  - marker: b
    text: Hay “dọn ra cho đám đông” hoặc “phục vụ đám đông.” Tiếng Hy Lạp theo nghĩa đen là “đặt trước mặt.”
    reason: lexical_alternative
lexical_decisions:
- source_word: παραγγέλλει
  choice: truyền
  rationale: Diễn đạt mệnh lệnh có thẩm quyền mà vẫn tự nhiên trong lối kể trang trọng; thì hiện tại lịch sử Hy Lạp được chuyển thành lối kể quá khứ theo ngữ cảnh tiếng Việt.
- source_word: ἀναπεσεῖν
  choice: ngồi xuống
  rationale: Động từ chỉ tư thế ngả mình trong bữa ăn; tiếng Việt hiện đại thường diễn đạt tự nhiên là “ngồi xuống”, còn sắc thái cụ thể được giữ trong chú thích.
- source_word: ἐπὶ τῆς γῆς
  choice: xuống đất
  rationale: Trong ngữ cảnh này, γῆ là mặt đất nơi đám đông ngồi xuống.
- source_word: λαβὼν τοὺς ἑπτὰ ἄρτους
  choice: cầm lấy bảy chiếc bánh
  rationale: ἄρτοι là những ổ hoặc chiếc bánh dùng làm thức ăn; “chiếc bánh” tự nhiên và dễ hiểu trong tiếng Việt.
- source_word: εὐχαριστήσας
  choice: dâng lời tạ ơn
  rationale: Giữ hành động tạ ơn trên thức ăn mà không thêm đối tượng không được nêu rõ trong câu Hy Lạp.
- source_word: ἔκλασεν
  choice: bẻ ra
  rationale: Đối tượng là những chiếc bánh đã nêu; “bẻ ra” là cách nói tự nhiên trong ngữ cảnh phân phát bánh.
- source_word: ἐδίδου
  choice: cứ trao
  rationale: Thể chưa hoàn thành diễn tả hành động tiếp diễn hoặc lặp lại khi bánh được phân phát.
- source_word: ἵνα παρατιθῶσιν
  choice: để họ đặt trước mặt đám đông
  rationale: Giữ hình ảnh cụ thể của παρατίθημι là đặt thức ăn ra trước người ăn, thay vì chỉ diễn giải là “phục vụ”.
- source_word: παρέθηκαν
  choice: họ đã đặt bánh trước mặt đám đông
  rationale: Giữ nhất quán với παρατιθῶσιν; thêm “bánh” để đại từ quy chiếu rõ và câu tiếng Việt tự nhiên.
- source_word: ὄχλος
  choice: đám đông
  rationale: Cách dịch thông dụng, tự nhiên của danh từ chỉ đoàn người đông trong văn cảnh này.
theological_decisions:
- issue: Trình tự thuật chuyện và âm hưởng Tiệc Thánh
  choice: Dịch εὐχαριστήσας là “dâng lời tạ ơn”, không dùng thuật ngữ bí tích.
  alternative: Diễn đạt bằng ngôn ngữ trực tiếp gợi đến nghi thức Tiệc Thánh.
  rationale: Câu văn mô tả hành động tạ ơn trong bữa ăn và có thể gợi âm hưởng thực hành Cơ Đốc về sau, nhưng bản văn không trực tiếp trình bày giáo lý bí tích tại đây.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Ngài” cho nhân vật Chúa Giê-su theo mạch văn kính trọng; cấu trúc câu giữ rõ chuỗi hành động và sắc thái tiếp diễn của ἐδίδου.
