id: MRK.8.34
reference: Mark 8:34
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Καὶ προσκαλεσάμενος τὸν ὄχλον σὺν τοῖς μαθηταῖς αὐτοῦ εἶπεν αὐτοῖς· ⸂Εἴ τις⸃ θέλει ὀπίσω μου ⸀ἐλθεῖν, ἀπαρνησάσθω ἑαυτὸν καὶ ἀράτω τὸν σταυρὸν αὐτοῦ καὶ ἀκολουθείτω μοι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/034.yaml
  text: And after calling the crowd together with his disciples[a], he said to them, “If anyone wants to come after me, let him deny himself, take up his cross[b], and follow me.”
translation:
  language: vi
  text: 'Rồi Đức Giê-su gọi đám đông cùng các môn đồ của mình đến và nói với họ: “Nếu ai muốn đi theo sau ta, người ấy phải từ bỏ chính mình, vác thập tự giá của mình[a] và theo ta.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Vác thập tự giá” giữ nguyên hình ảnh cụ thể của thập tự giá, chứ không chỉ có nghĩa là chịu một gánh nặng.
    reason: cultural_note
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: gọi ... đến
  rationale: Phân từ bất định quá khứ diễn tả hành động xảy ra trước động từ chính; cách dịch này tự nhiên trong tiếng Việt và giữ ý Đức Giê-su gọi mọi người lại với mình.
- source_word: τὸν ὄχλον σὺν τοῖς μαθηταῖς αὐτοῦ
  choice: đám đông cùng các môn đồ của mình
  rationale: Giữ rõ cả đám đông lẫn các môn đồ đều được gọi đến và nghe lời dạy; “môn đồ” phù hợp với văn phong Kinh Thánh trang trọng nhưng vẫn quen thuộc.
- source_word: Εἴ τις θέλει
  choice: Nếu ai muốn
  rationale: Giữ nguyên cấu trúc điều kiện và tính rộng mở của đại từ bất định τις.
- source_word: ὀπίσω μου ἐλθεῖν
  choice: đi theo sau ta
  rationale: Giữ hình ảnh đi phía sau một người dẫn đường, đồng thời tránh đồng nhất hoàn toàn cụm này với mệnh lệnh ἀκολουθείτω μοι ở cuối câu.
- source_word: ἀπαρνησάσθω ἑαυτόν
  choice: phải từ bỏ chính mình
  rationale: Diễn đạt tự nhiên sức mạnh của mệnh lệnh ngôi thứ ba, chỉ sự khước từ quyền tự chủ của bản thân chứ không thu hẹp thành việc kiêng một sở thích.
- source_word: ἀράτω τὸν σταυρὸν αὐτοῦ
  choice: vác thập tự giá của mình
  rationale: Giữ nguyên hình ảnh cụ thể của thập tự giá và sở hữu từ chỉ cái giá mang tính cá nhân; “vác” tự nhiên hơn cách dịch máy móc “nhấc lên” trong ngữ cảnh này.
- source_word: ἀκολουθείτω μοι
  choice: theo ta
  rationale: Mệnh lệnh hiện tại có thể hàm ý tiếp diễn; “theo ta” súc tích, tự nhiên và trong ngữ cảnh môn đồ đã bao hàm một lối sống liên tục.
theological_decisions:
- issue: Sức mạnh của các mệnh lệnh về việc làm môn đồ
  choice: 'Dịch bằng “người ấy phải” áp dụng chung cho ba hành động: từ bỏ chính mình, vác thập tự giá và theo Đức Giê-su.'
  alternative: Lặp lại “hãy” trước từng hành động.
  rationale: Câu Hy Lạp mở đầu bằng điều kiện tự nguyện nhưng tiếp theo là ba mệnh lệnh ngôi thứ ba. “Phải” vừa tự nhiên trong tiếng Việt vừa giữ tính đòi hỏi ràng buộc mà không thêm khuôn khổ giáo phái.
- issue: Ý nghĩa của σταυρός
  choice: Giữ nghĩa đen là “thập tự giá”.
  alternative: Diễn giải thành “gánh nặng”, “đau khổ” hoặc chỉ riêng “tử đạo”.
  rationale: Hình ảnh ẩn dụ bắt nguồn từ dụng cụ hành hình thực tế của La Mã. Diễn giải thành một loại gian khổ cụ thể sẽ thu hẹp sức nặng lịch sử và thần học của nguyên văn.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “Đức Giê-su” trong lời dẫn và giữ đại từ “ta” trong lời trực tiếp. Cấu trúc “đi theo sau ta ... theo ta” cố ý bảo toàn sự khác biệt giữa ὀπίσω μου ἐλθεῖν và ἀκολουθείτω μοι, dù hai cụm có quan hệ gần gũi.
