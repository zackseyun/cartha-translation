source:
  edition: SBLGNT
  text: εἶτα πάλιν ⸀ἐπέθηκεν τὰς χεῖρας ἐπὶ τοὺς ὀφθαλμοὺς αὐτοῦ, καὶ ⸂διέβλεψεν καὶ ἀπεκατέστη καὶ ἐνέβλεπεν⸃ τηλαυγῶς ⸀ἅπαντα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/025.yaml
  text: Then again he laid his hands on his eyes[a], and he saw clearly and was restored[b], and he was seeing everything distinctly.
translation:
  language: vi
  text: Rồi Đức Chúa Giê-su lại đặt hai tay lên mắt người ấy[a]. Người ấy nhìn thấy rõ, được phục hồi, và tiếp tục thấy mọi vật rõ ràng[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Một số thủ bản có cách diễn đạt được phản ánh trong các bản dịch như: “Người ấy chăm chú nhìn, được phục hồi và thấy mọi vật rõ ràng.”'
    reason: textual_variant
  - marker: b
    text: 'Cũng có thể dịch: “người ấy có thể thấy mọi vật rõ ràng”; mệnh đề cuối kết hợp một động từ ở thể chưa hoàn thành với một trạng từ chỉ sự nhìn thấy rõ hoặc phân biệt được.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶτα πάλιν
  choice: Rồi ... lại
  rationale: Diễn đạt cả trình tự của εἶτα và sự lặp lại của πάλιν một cách tự nhiên trong tiếng Việt.
- source_word: ἐπέθηκεν τὰς χεῖρας ἐπὶ τοὺς ὀφθαλμοὺς αὐτοῦ
  choice: Đức Chúa Giê-su đặt hai tay lên mắt người ấy
  rationale: Giữ hình ảnh cụ thể của động tác đặt tay và thể hiện rõ dạng số nhiều τὰς χεῖρας.
- source_word: διέβλεψεν
  choice: nhìn thấy rõ
  rationale: διαβλέπω ở đây chỉ việc có được thị lực rõ ràng; cách dịch này phù hợp tiến trình từ thấy lờ mờ sang thấy rõ và không du nhập cách đọc biến thể ‘chăm chú nhìn’.
- source_word: ἀπεκατέστη
  choice: được phục hồi
  rationale: Giữ nghĩa được đưa trở lại tình trạng bình thường mà không diễn giải quá mức là một hành động chữa lành riêng biệt.
- source_word: ἐνέβλεπεν
  choice: tiếp tục thấy
  rationale: Dùng ‘tiếp tục’ để phản ánh thể chưa hoàn thành của động từ, cho thấy tình trạng nhìn thấy đang kéo dài sau khi thị lực được phục hồi.
- source_word: τηλαυγῶς
  choice: rõ ràng
  rationale: Truyền đạt ý nhìn rõ, phân biệt được; sắc thái có thể liên quan đến tầm nhìn xa không được khẳng định quá mức.
- source_word: ἅπαντα
  choice: mọi vật
  rationale: Cách nói tự nhiên trong ngữ cảnh thị giác, đồng thời giữ ý bao quát của đại từ trung tính số nhiều.
theological_decisions:
- issue: Cách thuật lại phép chữa lành qua hai giai đoạn
  choice: 'Giữ chuỗi tiến triển: Chúa lại đặt tay, người ấy thấy rõ, được phục hồi và tiếp tục nhìn thấy rõ ràng.'
  alternative: Làm phẳng toàn bộ chuỗi thành một hành động chữa lành hoàn tất tức thời.
  rationale: Chuỗi động từ Hy Lạp, đặc biệt động từ chưa hoàn thành ἐνέβλεπεν, trình bày sự tiến triển và trạng thái kết quả kéo dài; bản dịch không nên xóa bỏ nét căng thẳng của trình thuật.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng ‘Đức Chúa Giê-su’ để xác định chủ thể vốn được hàm ẩn trong động từ Hy Lạp; ‘người ấy’ tránh lặp danh từ và giữ mạch kể. Cụm ‘tiếp tục thấy’ hơi tường minh nhưng tự nhiên hơn lối dịch sát chữ ‘đang thấy’, đồng thời bảo toàn sắc thái của thì chưa hoàn thành.
