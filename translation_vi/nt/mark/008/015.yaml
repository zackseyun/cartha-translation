language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ διεστέλλετο αὐτοῖς λέγων· Ὁρᾶτε, βλέπετε ἀπὸ τῆς ζύμης τῶν Φαρισαίων καὶ τῆς ζύμης Ἡρῴδου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/015.yaml
  text: And he kept instructing them[a], saying, “Watch out[b]; beware of the leaven of the Pharisees and the leaven of Herod.”
translation:
  language: vi
  text: 'Ngài cứ căn dặn họ: “Hãy coi chừng, hãy đề phòng men[a] của người Pha-ri-si và men của Hê-rốt.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Men” là chất làm bột nở; từ này được giữ để bảo toàn hình ảnh về một ảnh hưởng lan tỏa.
    reason: lexical_alternative
  - marker: b
    text: Hình ảnh “men” có thể chỉ một ảnh hưởng cần tránh liên hệ với người Pha-ri-si và với Hê-rốt. So sánh Ma-thi-ơ 16:6, 12 và Lu-ca 12:1, những chỗ cũng dùng hình ảnh “men”.
    reason: cross_reference
lexical_decisions:
- source_word: διεστέλλετο
  choice: cứ căn dặn
  rationale: Động từ ở thì chưa hoàn thành diễn tả lời căn dặn được nhấn mạnh như một hành động đang tiếp diễn hoặc lặp lại trong quá khứ. “Cứ căn dặn” giữ được sắc thái ấy mà không biến lời này thành một mệnh lệnh mang tính pháp lý.
- source_word: λέγων
  choice: dấu hai chấm trước lời nói trực tiếp
  rationale: Phân từ này giới thiệu nội dung lời căn dặn. Trong tiếng Việt, dấu hai chấm và lời trích dẫn trực tiếp diễn đạt tự nhiên chức năng của λέγων mà không cần thêm từ “rằng” hoặc “nói rằng”.
- source_word: Ὁρᾶτε
  choice: Hãy coi chừng
  rationale: Trong ngữ cảnh cảnh báo, động từ mệnh lệnh này kêu gọi sự cảnh giác chứ không chỉ nói đến hành động nhìn thấy.
- source_word: βλέπετε
  choice: hãy đề phòng
  rationale: Cách dịch này giữ hai mệnh lệnh gần nghĩa đứng liền nhau, qua đó bảo toàn sức nhấn mạnh trong nguyên văn mà vẫn tự nhiên trong tiếng Việt.
- source_word: ἀπὸ
  choice: được thể hiện qua cấu trúc “đề phòng men của”
  rationale: Sau động từ cảnh báo, tiếng Việt tự nhiên dùng “đề phòng” trực tiếp với đối tượng nguy hiểm; ý tránh xa ảnh hưởng ấy vẫn được giữ lại.
- source_word: ζύμης
  choice: men
  rationale: “Men” là từ hiện đại, dễ hiểu, vừa chỉ tác nhân làm bột dậy vừa bảo toàn hình ảnh ẩn dụ về một ảnh hưởng có sức lan tỏa. Không diễn giải ẩn dụ ngay trong chính văn.
- source_word: Φαρισαίων
  choice: người Pha-ri-si
  rationale: Dùng lối phiên âm quen thuộc trong tiếng Việt và thể hiện danh từ số nhiều chỉ nhóm người.
- source_word: Ἡρῴδου
  choice: Hê-rốt
  rationale: Giữ trực tiếp tên Hê-rốt như nguyên văn, không tự ý mở rộng thành gia đình, phe phái hay ảnh hưởng chính trị của ông.
theological_decisions:
- issue: Ý nghĩa ẩn dụ của “men”
  choice: Giữ nguyên ẩn dụ “men” trong chính văn.
  alternative: Diễn giải thành “sự dạy dỗ”, “thói đạo đức giả” hoặc “ảnh hưởng làm hư hoại”.
  rationale: Câu này không xác định tường minh phương diện chính xác của hình ảnh “men”. Các đoạn song song cho thấy một ảnh hưởng nguy hại, nhưng việc giữ ẩn dụ bảo toàn độ mở và sức căng diễn giải của bản văn.
- issue: Đối tượng được biểu thị bằng “men của Hê-rốt”
  choice: Giữ cách nói “men của Hê-rốt”.
  alternative: Diễn giải thành “ảnh hưởng của phe Hê-rốt” hoặc “đường lối của Hê-rốt”.
  rationale: Nguyên văn nêu chính Hê-rốt song song với người Pha-ri-si; không nên thu hẹp hoặc mở rộng đối tượng ngay trong chính văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Hai lời cảnh báo “Hãy coi chừng, hãy đề phòng” giữ phép lặp nhấn mạnh của tiếng Hy Lạp. Đại từ “Ngài” phù hợp lối kể kính trọng phổ biến trong văn bản Kinh Thánh tiếng Việt.
