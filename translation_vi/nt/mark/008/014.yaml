  register: Văn phong tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “các môn đồ” để xác định chủ thể theo mạch văn; giữ sự đối lập giữa “bánh” nói chung và “một ổ bánh” cụ thể.
