  text: Καὶ ἐπελάθοντο λαβεῖν ἄρτους, καὶ εἰ μὴ ἕνα ἄρτον οὐκ εἶχον μεθ’ ἑαυτῶν ἐν τῷ πλοίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/014.yaml
  text: And they had forgotten to take bread[a], and except for one loaf they had no bread with them in the boat.
translation:
  language: vi
  text: Các môn đồ đã quên mang bánh theo[a]; trên thuyền, ngoài một ổ bánh ra, họ không có bánh nào khác.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát hơn: “quên mang những ổ bánh theo.” Dạng số nhiều của từ Hy Lạp ἄρτους có thể chỉ từng ổ bánh, nhưng ở đây có lẽ nói đến bánh hoặc lương thực nói chung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπελάθοντο
  choice: đã quên
  rationale: Động từ aorist chỉ việc các môn đồ quên trước tình trạng đang được thuật lại; tiếng Việt diễn đạt tự nhiên bằng “đã quên”.
- source_word: λαβεῖν
  choice: mang theo
  rationale: Trong bối cảnh lên thuyền, λαμβάνω mang nghĩa đem thực phẩm đi cùng; “mang theo” tự nhiên và rõ hơn “lấy”.
- source_word: ἄρτους
  choice: bánh
  rationale: Dạng số nhiều có thể chỉ những ổ bánh riêng lẻ, nhưng trong mệnh đề này cũng có thể chỉ bánh hoặc lương thực nói chung; “bánh” giữ được cách hiểu tự nhiên ấy.
- source_word: εἰ μὴ ἕνα ἄρτον
  choice: ngoài một ổ bánh ra
  rationale: εἰ μή ở đây có nghĩa ngoại trừ, còn danh từ số ít với số từ ἕνα được diễn đạt đếm được là “một ổ bánh”.
- source_word: οὐκ εἶχον
  choice: họ không có bánh nào khác
  rationale: 'Bổ sung “bánh” theo ngữ cảnh và “nào khác” để diễn đạt rõ quan hệ ngoại trừ: họ chỉ có một ổ.'
- source_word: μεθ’ ἑαυτῶν
  choice: họ ... có
  rationale: Ý “ở cùng mình/mang theo mình” được diễn đạt tự nhiên trong toàn câu qua việc họ có bánh trên thuyền, tránh lặp nặng nề sau “mang ... theo”.
- source_word: ἐν τῷ πλοίῳ
  choice: trên thuyền
  rationale: Tiếng Việt thường nói “trên thuyền” để chỉ người hoặc vật ở trong phương tiện này; cách nói tự nhiên mà vẫn giữ nguyên bối cảnh.
theological_decisions: []
