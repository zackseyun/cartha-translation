  source_fidelity: 'Bản dịch truyền đạt đầy đủ chuỗi hành động của nguyên văn: Ngài rời họ (ἀφεὶς αὐτούς), lại bước/xuống thuyền (πάλιν ἐμβάς), rồi đi sang bờ bên kia (ἀπῆλθεν εἰς τὸ πέραν). Việc hiểu đối tượng ngầm của ἐμβάς là thuyền phù hợp trực tiếp với ngữ cảnh Mác. Cụm “sang bờ bên kia” giữ đúng hướng chuyển qua phía đối diện, không thu hẹp địa điểm hơn nguyên văn.'
  naturalness: “Rồi Ngài rời họ, lại xuống thuyền và đi sang bờ bên kia” là tiếng Việt hiện đại, mạch lạc và có văn phong trần thuật trang trọng vừa phải. “Xuống thuyền” là cách nói tự nhiên cho việc vào thuyền trong tiếng Việt.
  terminology: “Ngài” nhất quán với lối xưng hô trang trọng dành cho Chúa Giê-su trong ngữ cảnh Kinh Thánh. Không có thuật ngữ thần học chuyên biệt cần điều chỉnh. Chú thích xử lý thích đáng vị trí bổ nghĩa có thể khác nhau của πάλιν, không áp đặt một cách hiểu duy nhất.
