  yaml_path: translation/nt/mark/008/013.yaml
  text: And leaving them[a], he got back into the boat and went to the other side.
translation:
  language: vi
  text: Rồi Ngài rời họ, lại xuống thuyền và đi sang bờ bên kia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Rồi Ngài rời họ, xuống thuyền và lại đi sang bờ bên kia.” Từ Hy Lạp πάλιν có thể bổ nghĩa cho việc xuống thuyền hoặc việc đi sang bờ bên kia.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀφεὶς αὐτοὺς
  choice: rời họ
  rationale: Phân từ bất định quá khứ diễn tả việc rời những người Pha-ri-si trong ngữ cảnh trước; cách nói này tự nhiên và giữ liên hệ với động từ chính.
- source_word: πάλιν
  choice: lại
  rationale: πάλιν có thể mang nghĩa “lại” hoặc gợi ý trở lại một nơi/hành động trước đó. “Lại xuống thuyền” tự nhiên trong tiếng Việt và không loại bỏ sắc thái lặp lại.
- source_word: ἐμβὰς
  choice: xuống thuyền
  rationale: Động từ chỉ việc bước vào/lên phương tiện; đối tượng “thuyền” được ngữ cảnh cung cấp. Trong tiếng Việt, “xuống thuyền” là cách diễn đạt tự nhiên khi bước vào thuyền.
- source_word: ἀπῆλθεν
  choice: đi
  rationale: Diễn đạt ngắn gọn hành động rời đi; đích đến được nêu ngay sau đó.
- source_word: εἰς τὸ πέραν
  choice: sang bờ bên kia
  rationale: Cụm từ chỉ việc sang phía đối diện của hồ/biển; “sang bờ bên kia” rõ ràng và tự nhiên trong tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Ngài” để chỉ Chúa Giê-su theo ngữ cảnh; không thêm danh xưng vào câu. Giữ sự nhập nhằng về phạm vi bổ nghĩa của πάλιν trong chú thích.
