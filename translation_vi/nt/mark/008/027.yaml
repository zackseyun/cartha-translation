reference: Mark 8:27
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Καὶ ἐξῆλθεν ὁ Ἰησοῦς καὶ οἱ μαθηταὶ αὐτοῦ εἰς τὰς κώμας Καισαρείας τῆς Φιλίππου· καὶ ἐν τῇ ὁδῷ ἐπηρώτα τοὺς μαθητὰς αὐτοῦ λέγων αὐτοῖς· Τίνα με λέγουσιν οἱ ἄνθρωποι εἶναι;
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/027.yaml
  text: And Jesus went out[a], with his disciples, to the villages of Caesarea Philippi. And on the way he was asking his disciples, saying to them, “Who do people say that I am?”
translation:
  language: vi
  text: 'Đức Giê-su cùng các môn đồ của Ngài đi đến các làng thuộc vùng Sê-sa-rê Phi-líp. Dọc đường, Ngài hỏi các môn đồ của Ngài: “Người ta[a] nói Ta là ai?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hy Lạp ở đây chỉ người ta nói chung, không riêng nam giới.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθεν
  choice: đi đến
  rationale: Động từ diễn tả việc Đức Giê-su rời nơi trước đó và lên đường đến một địa điểm khác. Trong tiếng Việt, khi đích đến được nêu ngay sau đó, “đi đến” truyền đạt tự nhiên chuyển động này; dịch máy móc là “đi ra” sẽ gợi hỏi đi ra khỏi đâu.
- source_word: κώμας
  choice: các làng
  rationale: κώμη thường chỉ làng hoặc khu dân cư nhỏ, phân biệt với một thành phố lớn.
- source_word: Καισαρείας τῆς Φιλίππου
  choice: Sê-sa-rê Phi-líp
  rationale: Dùng dạng phiên âm quen thuộc trong truyền thống Kinh Thánh tiếng Việt cho địa danh Caesarea Philippi.
- source_word: ἐν τῇ ὁδῷ
  choice: Dọc đường
  rationale: Cách nói tự nhiên trong tiếng Việt, đồng thời giữ bối cảnh Đức Giê-su và các môn đồ đang trên hành trình.
- source_word: ἐπηρώτα
  choice: hỏi
  rationale: Thì chưa hoàn thành trong tiếng Hy Lạp đặt hành động hỏi trong tiến trình của chuyến đi. Tiếng Việt không bắt buộc đánh dấu thể này; “Dọc đường, Ngài hỏi” diễn đạt tự nhiên mà không thêm sắc thái “hỏi đi hỏi lại” vốn không chắc chắn.
- source_word: λέγων αὐτοῖς
  choice: 'hỏi các môn đồ:'
  rationale: Cấu trúc phân từ “nói với họ” được gộp tự nhiên vào động từ “hỏi” và dấu hai chấm; giữ nguyên từng chữ sẽ nặng nề, dư thừa trong tiếng Việt.
- source_word: Τίνα με λέγουσιν οἱ ἄνθρωποι εἶναι;
  choice: Người ta nói Ta là ai?
  rationale: Câu hỏi nhắm đến căn tính của Đức Giê-su. “Người ta” diễn đạt tự nhiên nghĩa khái quát của οἱ ἄνθρωποι, không giới hạn ở nam giới.
- source_word: οἱ μαθηταὶ αὐτοῦ / τοὺς μαθητὰς αὐτοῦ
  choice: các môn đồ của Ngài / các môn đồ
  rationale: Lần đầu giữ rõ sở hữu từ αὐτοῦ; lần sau ngữ cảnh đã xác định cùng một nhóm nên lược sở hữu để tránh lặp nặng nề trong tiếng Việt.
theological_decisions:
- issue: Nghĩa khái quát của οἱ ἄνθρωποι trong câu hỏi của Đức Giê-su
  choice: người ta
  alternative: những người; người đời
  rationale: Danh từ có hình thức giống đực nhưng ở đây chỉ con người nói chung. “Người ta” giữ phạm vi khái quát và không hàm ý rằng Đức Giê-su chỉ hỏi về ý kiến của nam giới.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Giê-su,” “Ngài,” “Ta” theo lối xưng hô Kinh Thánh tiếng Việt phổ biến; giữ địa danh bằng dạng phiên âm quen thuộc. Dấu chú thích [a] được đặt ngay sau từ mà chú thích giải thích.
