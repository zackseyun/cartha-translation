  text: καὶ ⸀γνοὺς λέγει αὐτοῖς· Τί διαλογίζεσθε ὅτι ἄρτους οὐκ ἔχετε; οὔπω νοεῖτε οὐδὲ συνίετε; ⸀πεπωρωμένην ἔχετε τὴν καρδίαν ὑμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/017.yaml
  text: And knowing[a], he says to them[c][b], “Why are you discussing that you have no bread? Do you not yet perceive or understand? Do you have your heart hardened?”
translation:
  language: vi
  text: 'Đức Giê-su biết vậy và nói với họ: “Sao các anh lại bàn với nhau về chuyện không có bánh? Các anh vẫn chưa nhận ra hay hiểu sao? Lòng các anh đã chai cứng rồi sao?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γνοὺς
  choice: biết điều đó
  rationale: Phân từ bất định của γινώσκω diễn tả việc Đức Giê-su biết cuộc bàn luận vừa nêu; “điều đó” làm rõ tân ngữ được ngầm hiểu từ văn cảnh.
- source_word: διαλογίζεσθε
  choice: bàn với nhau
  rationale: Diễn đạt tự nhiên sự trao đổi, suy luận giữa các môn đệ về việc thiếu bánh.
- source_word: ἄρτους
  choice: bánh
  rationale: Danh từ Hy Lạp ở số nhiều, nhưng “bánh” trong tiếng Việt có thể dùng tự nhiên theo nghĩa chung mà không cần đánh dấu số nhiều.
- source_word: νοεῖτε
  choice: nhận ra
  rationale: Giữ sắc thái tri nhận, giúp phân biệt với συνίετε ngay sau đó.
- source_word: συνίετε
  choice: hiểu
  rationale: Diễn đạt sự thấu hiểu và bảo tồn cặp động từ “nhận ra, hiểu” của nguyên văn.
- source_word: πεπωρωμένην
  choice: chai cứng
  rationale: Diễn tả trạng thái đã trở nên cứng và mất nhạy bén; phù hợp ẩn dụ về sự trì độn thuộc linh.
- source_word: καρδίαν
  choice: lòng
  rationale: Trong tiếng Việt, “lòng” tự nhiên và trang trọng để chỉ con người bên trong, gồm sự hiểu biết và khả năng đáp ứng, đồng thời giữ được ẩn dụ của nguyên văn.
theological_decisions:
- issue: Cách dịch câu hỏi cuối về tình trạng nội tâm của các môn đệ
  choice: Lòng các con vẫn còn chai cứng sao?
  alternative: Các con có lòng chai cứng sao?
  rationale: Cấu trúc Hy Lạp ἔχετε + tân ngữ + phân từ theo sát là “có lòng bị làm cho chai cứng”, nhưng cách ấy gượng trong tiếng Việt. Bản dịch được chọn truyền đạt tự nhiên trạng thái tiếp diễn của lòng mà không xác định tác nhân hay nguyên nhân làm chai cứng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Giê-su” và đại từ “các con” trong lời Người nói với các môn đệ; giữ chuỗi câu hỏi quở trách và phân biệt hai động từ νοεῖτε/συνίετε.
