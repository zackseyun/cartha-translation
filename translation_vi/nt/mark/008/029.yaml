source:
  edition: SBLGNT
  text: καὶ αὐτὸς ⸂ἐπηρώτα αὐτούς⸃· Ὑμεῖς δὲ τίνα με λέγετε εἶναι; ⸀ἀποκριθεὶς ὁ Πέτρος λέγει αὐτῷ· Σὺ εἶ ὁ χριστός.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/029.yaml
  text: And he was asking them[a], “But who do you say that I am?” Peter answered him, “You are the Messiah.”
translation:
  language: vi
  text: 'Ngài hỏi họ: “Còn anh em, anh em nói Thầy là ai?” Phi-e-rơ thưa với Ngài: “Thầy là Đấng Mê-si[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “Đấng Ki-tô.”'
    reason: Cách gọi truyền thống tương đương với tước hiệu Hy Lạp ὁ χριστός.
lexical_decisions:
- source_word: ἐπηρώτα
  choice: hỏi
  rationale: Thì vị hoàn cho thấy hành động đang diễn ra trong mạch kể, nhưng tiếng Việt không cần thêm từ chỉ tiếp diễn; “hỏi” tự nhiên và không làm mất diễn tiến của câu chuyện.
- source_word: Ὑμεῖς δὲ
  choice: Còn anh em, anh em
  rationale: “Còn” thể hiện sự tương phản với ý kiến của những người khác ở câu trước; việc lặp “anh em” giữ được sắc thái nhấn mạnh của đại từ số nhiều Ὑμεῖς.
- source_word: τίνα με λέγετε εἶναι
  choice: anh em nói Thầy là ai
  rationale: Diễn đạt tự nhiên cấu trúc đối cách kết hợp động từ nguyên mẫu trong tiếng Hy Lạp. “Thầy” là đại từ tự xưng phù hợp với quan hệ giữa Chúa Giê-su và các môn đồ trong tiếng Việt.
- source_word: ἀποκριθεὶς ... λέγει αὐτῷ
  choice: Phi-e-rơ thưa với Ngài
  rationale: Gộp phân từ “đáp lời” và động từ hiện tại lịch sử “nói” thành một động từ kể chuyện tự nhiên; “thưa” phù hợp với lời môn đồ nói với thầy mà không thêm nội dung.
- source_word: Σὺ εἶ
  choice: Thầy là
  rationale: Đại từ được nêu rõ trong nguyên văn mang sắc thái nhấn mạnh; tiếng Việt thể hiện tự nhiên bằng đại từ xưng hô “Thầy” ở đầu lời tuyên xưng.
- source_word: ὁ χριστός
  choice: Đấng Mê-si
  rationale: Χριστός ở đây là tước hiệu, tương ứng với “Đấng Mê-si” (Đấng được xức dầu), chứ không phải tên riêng. Cách dịch này giữ bối cảnh Do Thái và chức năng tước hiệu.
theological_decisions:
- issue: Cách chuyển dịch Χριστός như một tước hiệu
  choice: Đấng Mê-si
  alternative: Đấng Ki-tô
  rationale: Trong lời tuyên xưng này, Χριστός là tước hiệu chỉ Đấng được xức dầu. “Đấng Mê-si” làm rõ nền tảng Do Thái; cách gọi truyền thống “Đấng Ki-tô” được giữ trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cặp xưng hô “Thầy—anh em” phản ánh quan hệ thầy trò trong ngữ cảnh; “thưa” thể hiện cách nói tự nhiên của môn đồ với Thầy. Dấu chú thích được đặt ngay sau tước hiệu mà chú thích giải thích.
