  source_fidelity: Bản dịch truyền đạt đúng câu hỏi tương phản và có nhấn mạnh của Ὑμεῖς δέ (“Còn anh em, anh em”), nội dung của τίνα με λέγετε εἶναι, lời đáp của Phi-e-rơ, và tước hiệu có mạo từ ὁ χριστός. “Hỏi” là cách kể tự nhiên trong tiếng Việt và không đòi hỏi phải thêm một dấu hiệu tiếp diễn để diễn đạt vị hoàn Hy Lạp.
  naturalness: Văn phong hiện đại, trang trọng, và nhất quán trong cặp xưng hô “Thầy—anh em.” Cụm “Phi-e-rơ thưa với Ngài” có sắc thái kính trọng phù hợp ngữ cảnh và vẫn tự nhiên trong lối văn Kinh Thánh hiện đại.
  terminology: “Đấng Mê-si” chuyển dịch Χριστός như một tước hiệu, giữ được nền tảng Do Thái và không biến tước hiệu thành tên riêng. Chú thích “Đấng Ki-tô” cung cấp cách gọi truyền thống tương đương; mốc chú thích đặt chính xác sau thuật ngữ được giải thích.
