  text: And they were discussing with one another that they had no bread[a].
translation:
  language: vi
  text: Họ bàn luận với nhau rằng họ không có bánh[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay sát nghĩa hơn: “không có những ổ bánh.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: διελογίζοντο
  choice: bàn luận
  rationale: Động từ ở thì chưa hoàn thành diễn tả cuộc trao đổi đang diễn ra. “Bàn luận” tự nhiên trong tiếng Việt và giữ được sắc thái họ cùng suy xét vấn đề.
- source_word: πρὸς ἀλλήλους
  choice: với nhau
  rationale: Cụm từ diễn tả sự tương tác qua lại; “với nhau” ngắn gọn và tự nhiên.
- source_word: ὅτι
  choice: rằng
  rationale: Ở đây ὅτι dẫn nội dung họ đang bàn luận, không nhất thiết biểu thị nguyên nhân.
- source_word: ἄρτους
  choice: bánh
  rationale: Danh từ số nhiều chỉ các ổ bánh, nhưng “bánh” là cách diễn đạt tự nhiên trong tiếng Việt; dạng sát chữ “những ổ bánh” được giữ trong chú thích vì văn cảnh gần nói đến số bánh đếm được.
- source_word: οὐκ ἔχουσιν
  choice: mình không có
  rationale: Hiện tại trong lời gián tiếp được đặt trong khung thuật chuyện quá khứ. Tiếng Việt không bắt buộc lùi thì; “mình không có” tự nhiên, đồng thời đại từ “mình” quy chiếu về chính nhóm môn đồ.
theological_decisions: []
translation_notes:
