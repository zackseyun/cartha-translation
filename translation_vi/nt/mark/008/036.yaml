  text: τί γὰρ ⸀ὠφελεῖ ⸀ἄνθρωπον ⸂κερδῆσαι τὸν κόσμον ὅλον καὶ ζημιωθῆναι⸃ τὴν ψυχὴν αὐτοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/036.yaml
  text: For what does it profit a man to gain the whole world and forfeit his life?[a][b]
translation:
  language: vi
  text: Vì một người được ích gì nếu được cả thế gian mà lại mất chính mạng sống mình?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “linh hồn mình” hoặc “chính bản thân mình.” Từ Hy Lạp ψυχή có thể mang nghĩa “mạng sống,” “linh hồn” hoặc “bản thân,” tùy văn cảnh.
    reason: lexical_alternative
lexical_decisions:
- source_word: τί γὰρ
  choice: Vì ... gì
  rationale: “Gì” giữ dạng câu hỏi tu từ, còn “vì” nối câu này với lời dạy ngay trước đó và thể hiện sắc thái giải thích của γάρ.
- source_word: ὠφελεῖ
  choice: được ích
  rationale: Cách nói “được ích gì” tự nhiên trong tiếng Việt, diễn đạt ý được lợi hoặc hưởng lợi và phù hợp với sự đối lập được–mất trong câu.
- source_word: ἄνθρωπον
  choice: một người
  rationale: ἄνθρωπος ở đây chỉ một con người theo nghĩa đại diện, không nhất thiết riêng nam giới. “Một người” giữ số ít và nghĩa khái quát trong tiếng Việt hiện đại.
- source_word: κερδῆσαι
  choice: chiếm được
  rationale: Động từ nói đến việc đạt được hay thu được một thứ có giá trị. “Chiếm được” tự nhiên với đối tượng là “cả thế gian” và vẫn giữ sắc thái được–mất của câu.
- source_word: τὸν κόσμον ὅλον
  choice: cả thế gian
  rationale: “Cả thế gian” diễn đạt trọn phạm vi của κόσμος được ὅλον nhấn mạnh, đồng thời giữ giọng văn trang trọng, quen thuộc nhưng vẫn dễ hiểu.
- source_word: ζημιωθῆναι
  choice: mất
  rationale: Dạng bị động này có thể mang nghĩa chịu thiệt hại hoặc bị mất. “Mất” truyền đạt trực tiếp hậu quả trong thế đối lập với việc chiếm được cả thế gian.
- source_word: τὴν ψυχὴν αὐτοῦ
  choice: chính mạng sống mình
  rationale: Trong Mác 8:35–37, ψυχή trước hết gợi đến mạng sống mà một người tìm cách cứu hoặc sẵn lòng mất. “Chính ... mình” làm rõ đối tượng thuộc về người ấy mà không loại bỏ khả năng hiểu từ này là “linh hồn,” được ghi ở chú thích.
theological_decisions:
- issue: Nghĩa của ψυχή trong lời dạy về làm môn đồ
  choice: mạng sống
  alternative: linh hồn; bản thân mình
  rationale: Mạch văn gần nhất nói về việc cứu hay mất ψυχή vì Chúa Giê-su và Tin Mừng, nên “mạng sống” giữ được nghịch lý của lời kêu gọi làm môn đồ mà không áp đặt một quan niệm nhân học hẹp. Tuy nhiên, từ Hy Lạp cũng có thể chỉ “linh hồn” hoặc “bản thân,” vì vậy khả năng ấy được bảo lưu trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu hỏi tu từ cùng thế đối lập “chiếm được–mất” được giữ rõ. “Một người” diễn đạt tự nhiên ý nghĩa khái quát của danh từ số ít trong nguyên văn mà không cần chú thích riêng về giới tính.
