review_pass:
  verdict: revise
  source_fidelity: Câu dịch giữ đúng cấu trúc câu hỏi tu từ của τί γὰρ, ý ‘được ích/lợi gì’ của ὠφελεῖ, phạm vi toàn thể của τὸν κόσμον ὅλον, và thế tương phản giữa được và mất. ‘Mạng sống’ là lựa chọn phù hợp cho ψυχή trong mạch văn Mác 8:35–37, với các nghĩa khác được bảo lưu trong chú thích.
  naturalness: Cú pháp ‘Vì một người được ích gì nếu ...?’ tự nhiên, trang trọng và rõ ràng trong tiếng Việt hiện đại. Tuy nhiên, ‘chiếm được cả thế gian’ có thể gợi hành động chinh phục hoặc chiếm đoạt, mạnh và hẹp hơn κερδῆσαι; ‘được cả thế gian’ diễn đạt sát hơn ý đạt/gặt được và giữ tốt lối chơi chữ được–mất.
  terminology: ‘Thế gian’ thích hợp cho κόσμος trong văn cảnh này. ‘Mạng sống’ nhất quán với ngữ cảnh trước sau và không buộc ψυχή vào nghĩa ‘linh hồn’; chú thích nêu các khả năng từ vựng một cách trung lập.
  issues:
  - severity: medium
    issue: ‘chiếm được’ cho κερδῆσαι
    rationale: κερδῆσαι nghĩa là đạt được, thu được, hoặc có lợi/gain. ‘Chiếm được’ dễ thêm sắc thái chinh phục hay chiếm đoạt không có trong động từ Hy Lạp, đồng thời làm yếu sự đối ứng từ vựng với ‘được ích’ và ‘mất’.
  revised_text: Vì một người được ích gì nếu được cả thế gian mà lại mất chính mạng sống mình?[a]
