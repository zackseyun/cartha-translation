- from: Vì một người được ích gì nếu chiếm được cả thế gian mà lại mất chính mạng sống mình?[a]
  to: Vì một người được ích gì nếu được cả thế gian mà lại mất chính mạng sống mình?[a]
  rationale: Thay ‘chiếm được’ bằng ‘được’ để phản ánh κερδῆσαι mà không thêm ý chinh phục/chiếm đoạt, đồng thời duy trì đối lập được–mất của nguyên văn. Không cần thay đổi chú thích, vì chú thích đã bảo lưu thích đáng tính đa nghĩa của ψυχή.
