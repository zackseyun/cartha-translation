id: MRK.8.19
reference: Mark 8:19
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὅτε τοὺς πέντε ἄρτους ἔκλασα εἰς τοὺς πεντακισχιλίους, πόσους κοφίνους ⸂κλασμάτων πλήρεις⸃ ἤρατε; λέγουσιν αὐτῷ· Δώδεκα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/019.yaml
  text: When I broke the five loaves for the five thousand[a], how many baskets full of broken pieces did you pick up?” They said to him[c][b], “Twelve.”
translation:
  language: vi
  text: 'Khi Ta bẻ năm ổ bánh cho năm ngàn người[a], các con đã thu lại được bao nhiêu giỏ đầy những mẩu bánh? Họ thưa với Ngài: “Mười hai.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn dùng dạng giống đực, có thể dịch là “năm ngàn đàn ông”; tại đây cụm từ chỉ đoàn dân được cho ăn.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτε
  choice: Khi
  rationale: Mở đầu mệnh đề chỉ thời gian, nhắc lại phép lạ cho đoàn dân ăn; “Khi” tự nhiên và trực tiếp trong tiếng Việt.
- source_word: ἔκλασα
  choice: Ta bẻ
  rationale: Động từ κλάω chỉ hành động bẻ bánh. “Bẻ” cụ thể, phù hợp ngữ cảnh; đại từ “Ta” giữ sắc thái trang trọng trong lời Đức Chúa Giê-su.
- source_word: τοὺς πέντε ἄρτους
  choice: năm ổ bánh
  rationale: ἄρτος ở đây là bánh có thể đếm được; “ổ bánh” rõ nghĩa và tự nhiên hơn danh từ khái quát “bánh”.
- source_word: εἰς τοὺς πεντακισχιλίους
  choice: cho năm ngàn người
  rationale: εἰς diễn tả hướng đến nhóm người được cho ăn. “Người” không thêm ý rằng toàn bộ con số chỉ gồm nam giới, nhưng vẫn diễn đạt rõ đây là số người.
- source_word: κοφίνους
  choice: giỏ
  rationale: κόφινος là một loại giỏ đựng đồ; “giỏ” là từ phổ thông, rõ ràng, không cần áp đặt kích thước cụ thể vào chính văn.
- source_word: κλασμάτων
  choice: những mẩu bánh
  rationale: κλάσμα chỉ những phần bánh đã được bẻ ra và còn lại. “Mẩu bánh” tự nhiên, đồng thời giữ liên hệ với hành động bẻ bánh.
- source_word: πλήρεις
  choice: đầy
  rationale: Bổ nghĩa cho các giỏ, cho biết chúng đầy những mẩu bánh; trật tự “giỏ đầy những mẩu bánh” tự nhiên trong tiếng Việt.
- source_word: ἤρατε
  choice: đã thu lại được
  rationale: Trong ngữ cảnh thu gom phần bánh còn thừa, cách nói này truyền đạt hành động αἴρω tự nhiên hơn lối dịch sát chữ “nhấc lên”.
- source_word: λέγουσιν αὐτῷ
  choice: Họ thưa với Ngài
  rationale: Hiện tại lịch sử được chuyển thành cách kể quá khứ tự nhiên trong tiếng Việt. “Thưa” phù hợp lời đáp kính trọng với Đức Chúa Giê-su.
- source_word: Δώδεκα
  choice: Mười hai
  rationale: Giữ nguyên câu trả lời ngắn gọn; đối tượng được đếm đã rõ từ câu hỏi.
theological_decisions:
- issue: Phạm vi chỉ người của πεντακισχιλίους
  choice: năm ngàn người
  alternative: năm ngàn đàn ông
  rationale: Dạng giống đực có thể được hiểu là nam giới trong một số ngữ cảnh, nhưng tại đây cụm từ hoạt động như tên gọi quen thuộc của đoàn dân trong phép lạ. Chính văn không cần xác quyết thêm “đàn ông”; chú thích bảo tồn khả năng dịch sát hình thái.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ta/các con” cho lời Đức Chúa Giê-su và “Ngài” trong lời kể; giữ câu hỏi trực tiếp, câu đáp ngắn gọn. Dấu chú thích [a] được đặt ngay sau cụm từ liên quan.
