  to: 'Trong những ngày ấy, khi lại có một đám đông lớn và họ không có gì để ăn, Đức Giê-su gọi các môn đệ đến và nói với họ:'
  rationale: Sửa mệnh đề hoàn cảnh để phản ánh chính xác ὄντος mà không thêm ý “tụ họp”; thay lối lặp “đám đông rất đông” bằng cách nói hiện đại tự nhiên hơn. Đại từ “họ” theo sau “đám đông” quy chiếu rõ đến đám đông, phù hợp với số nhiều trong μὴ ἐχόντων. Bỏ chú thích không cần thiết về hiện tại lịch sử, vì tiếng Việt không mã hóa sự đối lập thì này ở động từ “nói”.
  reviewer_model: gpt-5.6-terra
