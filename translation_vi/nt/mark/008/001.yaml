  text: Ἐν ἐκείναις ταῖς ἡμέραις ⸂πάλιν πολλοῦ⸃ ὄχλου ὄντος καὶ μὴ ἐχόντων τί φάγωσιν, ⸀προσκαλεσάμενος τοὺς ⸀μαθητὰς λέγει αὐτοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/001.yaml
  text: In those days[a], when again a large crowd was present and they had nothing to eat, he called his disciples and says to them[b],
translation:
  language: vi
  text: 'Trong những ngày ấy, khi lại có một đám đông lớn và họ không có gì để ăn, Đức Giê-su gọi các môn đệ đến và nói với họ:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐν ἐκείναις ταῖς ἡμέραις
  choice: Trong những ngày ấy
  rationale: Cách diễn đạt thời gian tự nhiên, trang trọng, giữ nguyên bối cảnh kể chuyện mà không xác định quá mức khoảng thời gian.
- source_word: πάλιν πολλοῦ ὄχλου ὄντος
  choice: lại có một đám đông rất đông tụ họp
  rationale: Giữ ý tái diễn của πάλιν và chuyển cấu trúc sở hữu cách tuyệt đối thành mệnh đề hoàn cảnh tự nhiên trong tiếng Việt; πολλοῦ cho biết đám đông có quy mô lớn.
- source_word: καὶ μὴ ἐχόντων τί φάγωσιν
  choice: mà không có gì ăn
  rationale: Diễn đạt trực tiếp tình trạng thiếu thức ăn của đám đông; chủ thể được hiểu từ cấu trúc số nhiều của nguyên văn.
- source_word: προσκαλεσάμενος τοὺς μαθητάς
  choice: Đức Giê-su gọi các môn đệ đến
  rationale: Động từ trung cách mang nghĩa gọi hoặc triệu đến với mình. Tiếng Việt dùng “gọi ... đến” tự nhiên hơn và không cần thêm đại từ sở hữu vốn không có trong nguyên văn.
- source_word: λέγει αὐτοῖς
  choice: nói với họ
  rationale: Tiếng Việt không biến đổi hình thái động từ theo thì; cách dịch này giữ được diễn tiến sinh động mà không phải cưỡng ép phân biệt hiện tại lịch sử với quá khứ.
theological_decisions:
- issue: Chủ thể không được nêu lại trước προσκαλεσάμενος và λέγει
  choice: Nêu “Đức Giê-su” để câu tiếng Việt rõ nghĩa
  alternative: Dùng đại từ “Ngài” hoặc để chủ thể ngầm hiểu
  rationale: Ngữ cảnh xác định chủ thể là Đức Giê-su. Việc nêu danh xưng làm câu độc lập rõ ràng mà không thêm một nhận định thần học ngoài nguyên văn.
- issue: Hiện tại lịch sử trong λέγει
  choice: Dịch là “nói với họ”
  alternative: “bảo họ”
  rationale: Động từ tiếng Việt không đánh dấu thì như tiếng Hy Lạp, nên “nói” bảo toàn nghĩa cơ bản và tránh diễn giải thêm sắc thái mệnh lệnh.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Giê-su” theo lối viết Công giáo phổ biến nhưng nội dung không mang nét giáo phái; “đám đông rất đông” phản ánh trực tiếp quy mô lớn, dù có sự lặp âm có chủ ý để giữ nghĩa.
