  text: καὶ ἀπέστειλεν αὐτὸν ⸀εἰς οἶκον αὐτοῦ λέγων· Μηδὲ εἰς τὴν κώμην ⸀εἰσέλθῃς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/026.yaml
  text: And he sent him to his home[a], saying, “Do not even enter the village.”
translation:
  language: vi
  text: 'Rồi Đức Giê-su sai anh về nhà[a] và dặn: “Đừng vào làng.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Một số thủ bản thêm: “và đừng kể cho ai trong làng.”'
    reason: textual_variant
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: cho anh về
  rationale: Trong ngữ cảnh, động từ diễn tả việc Đức Giê-su cho người ấy rời đi và trở về; cách nói này tự nhiên trong tiếng Việt mà không gán cho anh một sứ mạng.
- source_word: εἰς οἶκον αὐτοῦ
  choice: về nhà
  rationale: Cụm từ chỉ đích đến là chính nhà của người ấy; “về nhà” là cách diễn đạt tự nhiên, hàm ý trở lại nơi mình ở.
- source_word: λέγων
  choice: và dặn
  rationale: Phân từ dẫn vào lời nói đi kèm hành động sai đi; “và dặn” truyền đạt tự nhiên mối liên hệ ấy và sắc thái chỉ thị trong lời tiếp theo.
- source_word: Μηδὲ
  choice: Đừng … nữa
  rationale: Trong ngữ cảnh người này đã được dẫn ra khỏi làng (c. 23), μηδέ nhấn mạnh rằng anh không được đi vào làng; “nữa” diễn đạt tự nhiên lực nhấn ấy trong tiếng Việt.
- source_word: κώμην
  choice: làng
  rationale: κώμη chỉ một khu dân cư nhỏ, nên “làng” là từ tương ứng trực tiếp và phù hợp ngữ cảnh.
- source_word: εἰσέλθῃς
  choice: vào
  rationale: Thể giả định aorist sau từ phủ định tạo thành lời cấm; “đừng vào” là cấu trúc mệnh lệnh phủ định tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Phạm vi lời Đức Giê-su cấm liên quan đến ngôi làng
  choice: Chỉ dịch lời cấm đi vào làng, không bổ sung lý do hay lời cấm kể cho người khác.
  alternative: Một số truyền thống thủ bản thêm lời cấm nói với bất cứ ai trong làng.
  rationale: Bản văn SBLGNT chỉ có lời cấm đi vào làng. Việc giữ phần bổ sung ngoài chính văn bảo toàn chứng cứ văn bản được chọn và tránh dung hòa các truyền thống.
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Đức Giê-su” để xác định chủ ngữ vốn được hàm ẩn trong động từ Hy Lạp, tránh đại từ có thể mơ hồ; dùng “anh” cho người đàn ông đã được chữa lành.
