  source_fidelity: Cần sửa “nữa”, vì từ này thêm sắc thái thời gian/lặp lại (“không vào lại/không vào thêm”) không có trong Μηδέ. Bản văn Hy Lạp chỉ cấm người ấy vào làng. “Sai anh về nhà” diễn đạt trực tiếp hơn ἀπέστειλεν trong khi vẫn tự nhiên trong văn kể chuyện.
  naturalness: Bản sửa giữ văn phong hiện đại, rõ ràng và trang trọng vừa phải. “Sai anh về nhà và dặn” là cấu trúc kể chuyện tự nhiên.
  terminology: “Đức Giê-su,” “nhà,” và “làng” phù hợp với cách dùng hiện đại và với οἶκος, κώμη. Không có thuật ngữ thần học cần điều chỉnh.
