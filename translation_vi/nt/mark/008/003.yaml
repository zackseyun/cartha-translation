  - severity: low
    issue: “Một số người trong họ” hơi gượng trong văn phong trang trọng vừa phải.
    rationale: “Một số người trong số họ” là cách nói chuẩn và tự nhiên hơn, vẫn phản ánh τινες αὐτῶν.
