source:
  edition: SBLGNT
  text: καὶ ἐὰν ἀπολύσω αὐτοὺς νήστεις εἰς οἶκον αὐτῶν, ἐκλυθήσονται ἐν τῇ ὁδῷ· ⸂καί τινες⸃ αὐτῶν ⸀ἀπὸ μακρόθεν ⸀ἥκασιν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/003.yaml
  text: And if I send them away hungry to their homes[a], they will collapse on the way, and some of them have come from far away.
translation:
  language: vi
  text: Nếu ta cho họ về nhà khi đang đói, họ sẽ kiệt sức dọc đường[a]; và một số người trong số họ đã từ xa đến.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “sẽ ngã quỵ dọc đường.” Động từ Hy Lạp có thể chỉ việc trở nên yếu hoặc kiệt sức đến mức ngã quỵ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπολύσω
  choice: để họ ... về nhà
  rationale: Trong bối cảnh giải tán đám đông, động từ này chỉ việc cho họ ra về, không mang nghĩa phóng thích khỏi cảnh giam cầm.
- source_word: νήστεις
  choice: bụng đói
  rationale: Từ này theo nghĩa đen có thể chỉ tình trạng nhịn ăn, nhưng ở đây mô tả việc họ chưa được ăn; “bụng đói” tự nhiên và không hàm ý một cuộc kiêng ăn tôn giáo có chủ ý.
- source_word: εἰς οἶκον αὐτῶν
  choice: về nhà
  rationale: 'Cách nói tiếng Việt này diễn đạt tự nhiên ý phân phối: mỗi người trở về nhà mình.'
- source_word: ἐκλυθήσονται
  choice: sẽ kiệt sức
  rationale: Động từ diễn tả việc suy yếu hoặc đuối sức vì thiếu ăn; “kiệt sức” giữ được mức độ nghiêm trọng mà không khẳng định chắc chắn rằng họ sẽ bất tỉnh.
- source_word: ἐν τῇ ὁδῷ
  choice: dọc đường
  rationale: Cách diễn đạt tự nhiên trong tiếng Việt cho tình trạng xảy ra khi đang trên đường trở về.
- source_word: καί τινες αὐτῶν
  choice: và một số người trong họ
  rationale: Giữ liên từ καί và xác định đây là một bộ phận trong đám đông.
- source_word: ἀπὸ μακρόθεν
  choice: từ xa
  rationale: Trong ngữ cảnh, cụm từ nói đến quãng đường xa mà họ đã đi tới.
- source_word: ἥκασιν
  choice: đã ... đến
  rationale: 'Diễn đạt kết quả hiện tại của thể hoàn thành: họ hiện có mặt sau khi đã đến từ nơi xa.'
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Đại từ “ta” phù hợp với lời trực tiếp của Chúa Giê-su trong văn mạch Kinh Thánh; câu giữ liên từ “và” của bản Hy Lạp thay vì giải thích nó thành quan hệ nguyên nhân.
