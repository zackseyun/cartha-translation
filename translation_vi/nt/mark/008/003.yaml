  source_fidelity: 'Bản dịch truyền đạt đúng các ý chính: cho đám đông ra về khi đói, nguy cơ kiệt sức trên đường, và một số người đã đến từ xa. Tuy nhiên, trật tự trong “để họ bụng đói mà về nhà” kém tự nhiên và có thể làm mờ quan hệ giữa hành động cho về và tình trạng đói.'
  naturalness: Nên dùng “cho họ về nhà khi đang đói” để diễn đạt tự nhiên, rõ ràng trong tiếng Việt hiện đại. “Một số người trong số họ” cũng trôi chảy hơn “một số người trong họ.”
  terminology: “Kiệt sức dọc đường” là cách dịch phù hợp, giữ được sắc thái suy kiệt của ἐκλυθήσονται mà không ép nghĩa thành bất tỉnh. “Ta” phù hợp với lời trực tiếp của Chúa Giê-su trong văn mạch. Không có vấn đề về thuật ngữ thần học hay tên riêng.
