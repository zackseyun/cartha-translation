  text: καὶ ἐπετίμησεν αὐτοῖς ἵνα μηδενὶ λέγωσιν περὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/030.yaml
  text: And he warned them to tell no one about him[a].
translation:
  language: vi
  text: Ngài nghiêm cấm họ không được nói với ai về Ngài.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Ngài quở trách họ” hoặc “Ngài nghiêm khắc ra lệnh cho họ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπετίμησεν
  choice: nghiêm cấm
  rationale: Động từ ἐπιτιμάω có thể mang nghĩa “quở trách”, nhưng trong ngữ cảnh này nó diễn tả một mệnh lệnh cấm mạnh mẽ. “Nghiêm cấm” tự nhiên trong tiếng Việt và giữ được sắc thái nghiêm khắc mà không hàm ý rằng các môn đồ vừa phạm lỗi.
- source_word: αὐτοῖς
  choice: họ
  rationale: Đại từ số nhiều chỉ các môn đồ trong văn cảnh ngay trước đó.
- source_word: ἵνα μηδενὶ λέγωσιν
  choice: không được nói với ai
  rationale: Sau động từ mang ý ra lệnh hoặc ngăn cấm, ἵνα với động từ giả định diễn tả nội dung mệnh lệnh. Cách dịch này rõ ràng, tự nhiên và giữ nguyên lệnh cấm tuyệt đối của μηδενί.
- source_word: περὶ αὐτοῦ
  choice: về Ngài
  rationale: περί với sở hữu cách có nghĩa là “về” hoặc “liên quan đến”. Đại từ “Ngài” quy chiếu về Chúa Giê-su và phù hợp với văn phong Kinh Thánh tiếng Việt trang trọng, dễ hiểu.
theological_decisions:
- issue: Mức độ mạnh của lệnh giữ kín căn tính Chúa Giê-su
  choice: Dịch là “nghiêm cấm” để thể hiện lệnh cấm mạnh mẽ, nhưng không giải thích lý do Ngài yêu cầu giữ kín.
  alternative: “cảnh cáo”, “quở trách” hoặc “nghiêm khắc truyền lệnh”
  rationale: Câu Hy Lạp cho thấy một lời cấm nghiêm khắc, nhưng không nêu lý do thần học. Bản dịch giữ sức nặng của mệnh lệnh mà không đưa học thuyết về sự kín nhiệm của Đấng Mê-si vào câu.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “Ngài” để chỉ Chúa Giê-su; cấu trúc “không được nói với ai” truyền đạt tự nhiên lệnh cấm mạnh mẽ.
