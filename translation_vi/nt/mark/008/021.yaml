  text: καὶ ἔλεγεν αὐτοῖς· ⸀Οὔπω συνίετε;
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/021.yaml
  text: And he was saying to them[a], “Do you not yet understand?”
translation:
  language: vi
  text: 'Ngài nói[a] với họ: “Anh em vẫn chưa hiểu sao?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “Ngài đang nói với họ.”'
    reason: Thì chưa hoàn thành của ἔλεγεν có thể nhấn mạnh hành động đang tiếp diễn hoặc lặp lại; tiếng Việt thường dùng “nói” trong lời kể.
lexical_decisions:
- source_word: καὶ
  choice: (không dịch riêng)
  rationale: Liên từ nối tiếp lời kể; trong tiếng Việt, việc chuyển thẳng sang mệnh đề mới tự nhiên hơn và không làm mất quan hệ với câu trước.
- source_word: ἔλεγεν
  choice: nói
  rationale: Động từ ở thì chưa hoàn thành diễn tả hành động đang tiếp diễn hoặc lặp lại. Trong lời kể tiếng Việt, “nói” là cách diễn đạt tự nhiên; sắc thái thể được ghi nhận ở chú thích.
- source_word: αὐτοῖς
  choice: với họ
  rationale: Giữ nguyên đại từ số nhiều của bản Hy Lạp, không đưa danh từ “các môn đồ” từ ngữ cảnh vào câu.
- source_word: Οὔπω
  choice: vẫn chưa
  rationale: Diễn đạt tự nhiên ý nghĩa “chưa cho đến lúc này / vẫn chưa” và giữ sắc thái quở trách trong câu hỏi.
- source_word: συνίετε
  choice: hiểu
  rationale: Diễn đạt rõ hoạt động nhận thức mà συνίημι chỉ đến; câu không thêm tân ngữ vì nguyên văn cũng để đối tượng được hiểu ngầm.
theological_decisions:
- issue: Có nên thêm tân ngữ như “điều này” sau động từ “hiểu” hay không
  choice: 'Không thêm tân ngữ: “Anh em vẫn chưa hiểu sao?”'
  alternative: “Anh em vẫn chưa hiểu điều này sao?”
  rationale: Nguyên văn không nêu tân ngữ. Giữ câu hỏi mở tránh thu hẹp lời quở trách của Chúa Giê-su vào một đối tượng cụ thể không được nói rõ trong câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Anh em” thể hiện ngôi thứ hai số nhiều trong lời Chúa Giê-su nói với các môn đồ; “vẫn chưa… sao?” giữ được cả ý kéo dài đến hiện tại lẫn sức nặng của câu hỏi quở trách.
