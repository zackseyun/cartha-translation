revisions:
- from: 'Ngài nói với họ[a]: “Anh em vẫn chưa hiểu sao?”'
  to: 'Ngài nói[a] với họ: “Anh em vẫn chưa hiểu sao?”'
  rationale: Chỉ điều chỉnh vị trí neo chú thích để nó gắn với “nói,” là từ tương ứng với ἔλεγεν, và thay phương án “cứ nói” bằng “đang nói” để phản ánh thể chưa hoàn thành mà không thêm hàm ý khăng khăng. Bản văn chính được giữ nguyên vì trung thành với nguyên ngữ và tự nhiên trong tiếng Việt hiện đại.
  reviewer_model: gpt-5.6-terra
