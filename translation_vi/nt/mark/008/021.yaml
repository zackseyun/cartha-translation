    rationale: Ký hiệu [a] đang đặt sau “họ,” nhưng chú thích giải thích thể chưa hoàn thành của ἔλεγεν, tương ứng với “nói.” Ký hiệu nên đặt ngay sau động từ này.
  - severity: low
    issue: Cụm “cứ nói” trong chú thích có thể thêm sắc thái.
    rationale: “Cứ” thường hàm ý tiếp tục dai dẳng hoặc lặp đi lặp lại; thể chưa hoàn thành Hy Lạp có thể biểu thị hành động đang diễn tiến hay thường diễn, nhưng không bắt buộc sắc thái ấy. “đang nói” là phương án an toàn hơn.
  revised_text: 'Ngài nói[a] với họ: “Anh em vẫn chưa hiểu sao?”'
