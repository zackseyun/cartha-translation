    issue: “các con” trong lời trực tiếp
    rationale: Nguyên văn chỉ dùng động từ ngôi thứ hai số nhiều, không nêu cách xưng hô có sắc thái con cái. “Anh em” là cách gọi hiện đại, trung tính hơn đối với các môn đồ.
  - severity: low
    issue: “khi có bảy chiếc bánh cho bốn ngàn người”
    rationale: Cách nói này có thể gợi tình trạng sở hữu/hiện có hơn là sự kiện phân phát bánh. Dùng “trong lần ... được chia cho ...” làm rõ quan hệ ngữ cảnh vốn được câu Hy Lạp diễn đạt tỉnh lược.
  revised_text: 'Còn trong lần bảy chiếc bánh được chia cho bốn ngàn người, anh em đã nhặt được bao nhiêu giỏ lớn[a] đầy những mẩu bánh vụn?” Họ đáp: “Bảy.”'
