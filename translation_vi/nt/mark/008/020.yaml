- from: 'Còn khi có bảy chiếc bánh cho bốn ngàn người, các con đã nhặt được bao nhiêu giỏ lớn[a] đầy những mẩu bánh vụn?” Họ thưa với Ngài: “Bảy.”'
  to: 'Còn trong lần bảy chiếc bánh được chia cho bốn ngàn người, anh em đã nhặt được bao nhiêu giỏ lớn[a] đầy những mẩu bánh vụn?” Họ đáp: “Bảy.”'
  rationale: Bản sửa giữ nguyên các chi tiết số lượng và hình ảnh thu gom các mẩu bánh, đồng thời thay cách xưng hô có thể thêm sắc thái không có trong nguyên văn và làm câu hồi tưởng về lần phân phát cho bốn ngàn người tự nhiên, rõ nghĩa hơn.
