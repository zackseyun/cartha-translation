base_translation:
  language: en
  yaml_path: translation/nt/mark/008/020.yaml
  text: And when the seven were for the four thousand[a], how many large baskets full of broken pieces did you pick up? They said to him, “Seven.”
translation:
  language: vi
  text: 'Còn trong lần bảy chiếc bánh được chia cho bốn ngàn người, anh em đã nhặt được bao nhiêu giỏ lớn[a] đầy những mẩu bánh vụn?” Họ đáp: “Bảy.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hy Lạp σπυρίς chỉ một loại giỏ lớn, khác với từ chỉ chiếc giỏ nhỏ hơn được dùng trong Mác 8:19.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε καὶ
  choice: Còn khi
  rationale: Vừa nối câu này với phép lạ được nhắc đến trước đó, vừa giữ ý thời gian; cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: τοὺς ἑπτὰ
  choice: có bảy chiếc bánh
  rationale: Nguyên văn chỉ ghi danh từ hóa số từ “bảy”, nhưng theo ngữ cảnh rõ ràng đó là bảy chiếc bánh ở Mác 8:5–6. Bổ sung “chiếc bánh” giúp câu tiếng Việt đầy đủ và dễ hiểu mà không thay đổi ý.
- source_word: εἰς τοὺς τετρακισχιλίους
  choice: cho bốn ngàn người
  rationale: Giữ quan hệ hướng đến/đáp ứng cho nhóm người được ăn, đồng thời nói rõ “người” vốn được ngụ ý trong nguyên văn.
- source_word: πόσων σπυρίδων
  choice: bao nhiêu giỏ lớn
  rationale: σπυρίς chỉ loại giỏ lớn và khác với κόφινος được dùng ở Mác 8:19; “giỏ lớn” vừa tự nhiên vừa bảo toàn sự phân biệt từ vựng.
- source_word: πληρώματα κλασμάτων
  choice: đầy những mẩu bánh vụn
  rationale: Diễn đạt các giỏ chứa đầy những phần bánh đã bị bẻ ra; “mẩu bánh vụn” cụ thể và dễ hiểu trong tiếng Việt hiện đại.
- source_word: ἤρατε
  choice: các con đã nhặt được
  rationale: Trong ngữ cảnh thu gom thức ăn còn thừa, αἴρω mang nghĩa nhặt hoặc gom lên. “Nhặt được” là cách nói tự nhiên.
- source_word: καὶ λέγουσιν αὐτῷ
  choice: Họ thưa với Ngài
  rationale: Chuyển hiện tại lịch sử Hy Lạp sang quá khứ kể chuyện tự nhiên trong tiếng Việt; “thưa” phù hợp với lời các môn đồ đáp lại Chúa Giê-su.
- source_word: Ἑπτά
  choice: Bảy
  rationale: Giữ nguyên câu trả lời ngắn gọn bằng số lượng.
theological_decisions: []
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “các con” cho lời Chúa Giê-su nói với các môn đồ và “Ngài” trong lời kể. Câu giữ lối hỏi gợi nhớ của nguyên văn, đồng thời bổ sung danh từ được ngữ cảnh hàm ý để tiếng Việt tự nhiên.
