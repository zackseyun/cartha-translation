  text: ὀφθαλμοὺς ἔχοντες οὐ βλέπετε καὶ ὦτα ἔχοντες οὐκ ἀκούετε; καὶ οὐ μνημονεύετε
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/018.yaml
  text: Having eyes[a], do you not see? And having ears, do you not hear? And do you not remember?
translation:
  language: vi
  text: Có mắt mà các con không thấy sao? Có tai mà các con không nghe sao? Các con không nhớ sao?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὀφθαλμοὺς ἔχοντες
  choice: Có mắt mà
  rationale: Giữ hình ảnh cụ thể và diễn đạt tự nhiên trong tiếng Việt; từ “mà” thể hiện sắc thái nhượng bộ/nghịch lý của cấu trúc phân từ trong câu hỏi quở trách.
- source_word: βλέπετε
  choice: không thấy sao?
  rationale: Dùng nghĩa thông thường “thấy”, đồng thời để ngữ cảnh gợi hàm ý nhận biết thuộc linh thay vì giải thích ngay trong bản văn.
- source_word: ὦτα ἔχοντες
  choice: Có tai mà
  rationale: Giữ cấu trúc song song với “Có mắt mà” và sắc thái nhượng bộ của nguyên văn.
- source_word: ἀκούετε
  choice: không nghe sao?
  rationale: Dùng nghĩa trực tiếp “nghe”; hàm ý không lĩnh hội hoặc không hiểu được giữ lại như một khả năng do ngữ cảnh quyết định.
- source_word: μνημονεύετε
  choice: không nhớ sao?
  rationale: “Nhớ” là cách diễn đạt rõ ràng, tự nhiên cho động từ chỉ việc nhớ lại hoặc ghi nhớ ở đây.
- source_word: καὶ
  choice: Có…; Các con…
  rationale: Không máy móc lặp “và”; quan hệ cộng dồn được thể hiện tự nhiên qua ba câu hỏi liên tiếp trong tiếng Việt.
- source_word: οὐ / οὐκ
  choice: không
  rationale: Giữ đầy đủ phép phủ định trong từng câu hỏi tu từ.
theological_decisions:
- issue: Nghĩa cảm giác hay nghĩa bóng của việc thấy và nghe
  choice: Giữ các động từ cụ thể “thấy” và “nghe” trong chính văn.
  alternative: Dịch tường minh là “nhận biết” và “hiểu”.
  rationale: Nguyên văn dùng các động từ cảm giác thông thường, trong khi ngữ cảnh có thể hàm ý sự trì độn thuộc linh. Cách dịch này bảo toàn cả hình ảnh tiên tri lẫn độ mở về nghĩa.
- issue: Chủ ngữ ngôi thứ hai số nhiều
  choice: Dùng “các con”.
  alternative: Dùng “anh em” hoặc lược đại từ.
  rationale: Trong ngữ cảnh Chúa Giê-su trực tiếp nói với các môn đồ, “các con” biểu đạt quan hệ thầy–trò gần gũi và vẫn cho thấy rõ số nhiều, không thêm một tước hiệu thần học vào nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Ba câu hỏi ngắn giữ nhịp quở trách dồn dập của nguyên văn; cấu trúc “Có… mà…” tự nhiên hơn lối dịch sát hình thức “có mắt, các con không thấy sao?” trong tiếng Việt.
