  source_fidelity: 'Bản dịch giữ đúng cấu trúc tu từ và các yếu tố chính của nguyên văn: “có mắt/có tai,” các phủ định “không thấy/không nghe,” và câu hỏi cuối “không nhớ sao?” Cách dùng “mà” diễn đạt tự nhiên sắc thái tương phản/nhượng bộ của các phân từ ἔχοντες trong ngữ cảnh quở trách, mà không ép nghĩa bóng “nhận biết/hiểu” vào chính văn.'
  naturalness: Câu văn hiện đại, rõ ràng và có nhịp dồn dập phù hợp với ba câu hỏi tu từ. “Có mắt mà các con không thấy sao? Có tai mà các con không nghe sao?” là cách nói tự nhiên trong văn phong Kinh Thánh Việt ngữ đương đại. Việc không lặp máy móc liên từ “và” vẫn bảo toàn mạch cộng dồn qua các câu hỏi liên tiếp.
  terminology: “Thấy,” “nghe,” và “nhớ” là các tương đương trực tiếp, tự nhiên cho βλέπετε, ἀκούετε, và μνημονεύετε. “Các con” phù hợp với lời Chúa Giê-su nói trực tiếp cùng nhóm môn đồ trong ngữ cảnh và biểu thị được ngôi thứ hai số nhiều; không thêm diễn giải thần học. Không cần chú thích vì bản văn tiếng Việt đã giữ được độ mở giữa nghĩa cảm giác và hàm ý nhận thức của ngữ cảnh.
