  text: Καὶ ⸀ἔρχονται εἰς Βηθσαϊδάν. καὶ φέρουσιν αὐτῷ τυφλὸν καὶ παρακαλοῦσιν αὐτὸν ἵνα αὐτοῦ ἅψηται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/022.yaml
  text: And they came to Bethsaida. And they brought a blind man to him and begged him to touch him.
translation:
  language: vi
  text: Rồi họ đến Bết-sai-đa. Họ đem một người mù đến với Đức Chúa Jêsus và khẩn khoản xin Ngài chạm vào anh ấy.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔρχονται
  choice: họ đến
  rationale: Thì hiện tại lịch sử của tiếng Hy Lạp được chuyển tự nhiên theo mạch kể chuyện tiếng Việt; động từ “đến” không cần đánh dấu thì.
- source_word: εἰς Βηθσαϊδάν
  choice: đến Bết-sai-đa
  rationale: εἰς chỉ hướng đến địa danh; “đến” là cách diễn đạt tự nhiên, còn địa danh được phiên âm theo lối quen thuộc trong tiếng Việt.
- source_word: φέρουσιν
  choice: Người ta đem
  rationale: Chủ ngữ số nhiều không được xác định rõ và không nhất thiết đồng nhất với “họ” ở câu trước; “người ta” giữ sự bất định ấy. “Đem” không nói quá cụ thể rằng người mù được khiêng hay tự đi có người dẫn.
- source_word: τυφλὸν
  choice: một người mù
  rationale: Tính từ được dùng như danh từ, giống đực số ít; “một người mù” vừa tự nhiên vừa chỉ đúng một người nam trong ngữ cảnh, với đại từ “anh” ở cuối câu làm rõ giới tính.
- source_word: παρακαλοῦσιν
  choice: khẩn khoản xin
  rationale: Cụm này diễn đạt lời cầu xin tha thiết, mạnh hơn “xin” đơn thuần nhưng tự nhiên và trang trọng hơn trong tiếng Việt hiện đại.
- source_word: ἵνα αὐτοῦ ἅψηται
  choice: xin Ngài chạm vào anh
  rationale: Mệnh đề ἵνα nêu nội dung lời cầu xin; tiếng Việt diễn đạt tự nhiên bằng “xin ... chạm vào”. Đại từ được làm rõ theo các đối tượng trong câu để tránh chuỗi “ông ấy/người ấy” mơ hồ.
- source_word: καὶ
  choice: Rồi / và
  rationale: Καί đầu câu thứ nhất được diễn đạt bằng “Rồi” để nối tiếp diễn tiến tự sự; καί trong câu sau được giữ bằng “và”, bảo toàn nhịp kể liên kết của Mác mà vẫn tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Danh tính của αὐτῷ và αὐτόν
  choice: “Đức Chúa Jêsus” và “Ngài”
  alternative: “Người” và “người ấy” hoặc lặp lại các đại từ không nêu danh
  rationale: Nguồn Hy Lạp dùng đại từ dựa trên ngữ cảnh trước đó; tiếng Việt cần nêu lại Đức Chúa Jêsus để câu đứng riêng không mơ hồ. Cách viết này chỉ làm rõ quy chiếu, không thêm một khẳng định thần học mới.
translation_notes:
  register: Văn phong kể chuyện hiện đại, rõ ràng và trang trọng vừa phải. Giữ hai hành động liên tiếp, nhưng tránh lặp “họ” vì chủ thể của ἔρχονται và φέρουσιν có thể không hoàn toàn đồng nhất. Không dùng thuật ngữ cổ hoặc quá văn chương.
