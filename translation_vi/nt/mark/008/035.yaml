reference: Mark 8:35
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὃς γὰρ ⸀ἐὰν θέλῃ τὴν ⸂ψυχὴν αὐτοῦ⸃ σῶσαι ἀπολέσει αὐτήν· ὃς δ’ ἂν ⸀ἀπολέσει τὴν ⸄ψυχὴν αὐτοῦ⸅ ἕνεκεν ἐμοῦ καὶ τοῦ εὐαγγελίου ⸀σώσει αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/035.yaml
  text: For whoever wants to save his life will lose it[b][a], but whoever loses his life for my sake and for the gospel will save it.
translation:
  language: vi
  text: Vì ai muốn cứu mạng sống mình thì sẽ mất mạng sống ấy; còn ai mất mạng sống mình vì tôi và vì Tin Mừng thì sẽ cứu mạng sống ấy.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch “linh hồn” xuyên suốt câu; từ Hy Lạp có thể chỉ mạng sống, sự sống hoặc linh hồn, tùy ngữ cảnh.
    reason: lexical_alternative
lexical_decisions:
- source_word: ψυχή
  choice: mạng sống
  rationale: Trong lời nghịch lý này, từ Hy Lạp chỉ sự sống hay chính con người đang sống, chứ không nhất thiết riêng phần phi vật chất. “Mạng sống” diễn đạt tự nhiên việc giữ hay mất sự sống và vẫn để ngỏ chiều sâu rộng hơn của từ nguồn.
- source_word: σῶσαι / σώσει
  choice: cứu / sẽ cứu được
  rationale: Giữ sự tương ứng của cùng một động từ ở hai vế và sự đối lập có chủ ý với “mất”. “Cứu được” ở vế cuối tự nhiên trong tiếng Việt mà không làm suy giảm sắc thái cứu độ.
- source_word: ἀπολέσει
  choice: sẽ mất / mất
  rationale: Khi đi với ψυχή, “mất” là cách diễn đạt trực tiếp và tự nhiên nhất, giữ nguyên nghịch lý; “hủy diệt” quá mạnh còn “đánh đổi” mang tính diễn giải.
- source_word: ἕνεκεν ἐμοῦ καὶ τοῦ εὐαγγελίου
  choice: vì tôi và vì Tin Mừng
  rationale: ἕνεκεν nêu nguyên nhân hoặc động cơ. Lặp “vì” giúp tiếng Việt rõ ràng rằng cả Chúa Giê-su lẫn Tin Mừng đều là lý do của việc mất mạng sống.
- source_word: εὐαγγέλιον
  choice: Tin Mừng
  rationale: Đây là thuật ngữ tiếng Việt quen thuộc, trang trọng và dễ hiểu, đồng thời giữ được vai trò chủ đề của εὐαγγέλιον trong sách Mác.
- source_word: ὃς ... ὃς
  choice: ai ... ai
  rationale: Cấu trúc mang nghĩa khái quát, không xác định; “ai” truyền đạt tự nhiên tính phổ quát của lời nói.
- source_word: θέλῃ
  choice: muốn
  rationale: Cách diễn đạt hiện đại, rõ ràng và sát ý chí hay chủ tâm được nêu trong động từ Hy Lạp.
- source_word: αὐτοῦ / αὐτήν
  choice: mình / nó
  rationale: “Mình” là đại từ phản thân tự nhiên trong mệnh đề khái quát tiếng Việt, không cần thêm giới tính không được ngữ cảnh nhấn mạnh; “nó” quy chiếu rõ về “mạng sống”.
theological_decisions:
- issue: Ý nghĩa nhân học của ψυχή trong lời nghịch lý của Chúa Giê-su
  choice: Dịch ψυχή là “mạng sống” trong chính văn
  alternative: Dịch là “linh hồn” hoặc “sự sống”
  rationale: Ngữ cảnh nói về môn đồ, từ bỏ mình và việc mất sự sống vì Chúa Giê-su cùng Tin Mừng. “Mạng sống” tránh thu hẹp từ này vào phần phi vật chất của con người, trong khi chú thích bảo tồn khả năng dịch truyền thống.
- issue: Phạm vi áp dụng của đại từ giống đực số ít
  choice: Dùng cấu trúc khái quát “ai ... mình” tự nhiên trong tiếng Việt
  alternative: Dùng “người nào ... mạng sống của người ấy” để phản ánh hình thức số ít rõ hơn
  rationale: Giống đực trong tiếng Hy Lạp có chức năng đại diện và lời này áp dụng phổ quát. Tiếng Việt không bắt buộc đánh dấu giống; “ai ... mình” giữ số ít và tính khái quát mà không thêm một đối lập giới tính không có trong ý nghĩa.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Giữ kết cấu nghịch lý cứu–mất–cứu của nguyên văn; dùng “Tin Mừng” theo cách gọi quen thuộc trong tiếng Việt.
