revisions:
- from: Vì ai muốn cứu mạng sống mình thì sẽ mất nó; còn ai mất mạng sống mình vì tôi và vì Tin Mừng thì sẽ cứu được nó.[a]
  to: Vì ai muốn cứu mạng sống mình thì sẽ mất mạng sống ấy; còn ai mất mạng sống mình vì tôi và vì Tin Mừng thì sẽ cứu mạng sống ấy.[a]
  rationale: Thay “sẽ cứu được” bằng “sẽ cứu” để phản ánh chính xác thì tương lai của cùng một động từ Hy Lạp ở cả hai vế. Thay đại từ “nó” bằng “mạng sống ấy” để làm rõ tính lặp lại có chủ ý của ψυχή. Điều chỉnh chú thích để mô tả đúng phạm vi của lựa chọn từ vựng trong toàn câu.
