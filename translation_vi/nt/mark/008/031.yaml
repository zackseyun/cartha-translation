id: MRK.8.31
reference: Mark 8:31
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Καὶ ἤρξατο διδάσκειν αὐτοὺς ὅτι δεῖ τὸν υἱὸν τοῦ ἀνθρώπου πολλὰ παθεῖν καὶ ἀποδοκιμασθῆναι ⸀ὑπὸ τῶν πρεσβυτέρων καὶ τῶν ἀρχιερέων καὶ τῶν γραμματέων καὶ ἀποκτανθῆναι καὶ μετὰ τρεῖς ἡμέρας ἀναστῆναι·
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/031.yaml
  text: And he began to teach them that the Son of Man must suffer many things[a], and be rejected by the elders and the chief priests and the scribes, and be killed, and after three days rise again.
translation:
  language: vi
  text: Rồi Ngài bắt đầu dạy họ rằng Con Người phải chịu nhiều đau khổ, bị các trưởng lão, các thượng tế và các kinh sư khước từ, bị giết, rồi sau ba ngày[a] sống lại.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn Hy Lạp là “sau ba ngày”; một số truyền thống dịch diễn đạt là “trong ba ngày” hoặc hòa hợp với các câu song song, dịch là “vào ngày thứ ba.”
    reason: Giữ nguyên cách diễn đạt thời gian của Mác, đồng thời giúp người đọc hiểu vì sao các bản dịch có thể khác nhau.
lexical_decisions:
- source_word: ἤρξατο διδάσκειν
  choice: bắt đầu dạy
  rationale: Diễn đạt tự nhiên ý khởi đầu của ἄρχομαι đi với động từ nguyên mẫu, đồng thời giữ rõ bước chuyển trong câu chuyện.
- source_word: δεῖ
  choice: phải
  rationale: Giữ sức nặng của sự cần thiết bao trùm cuộc thương khó, cái chết và sự sống lại, nhưng không giải thích thêm nguồn gốc hay cơ chế của sự cần thiết ấy.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: Con Người
  rationale: Cách dịch danh xưng đã quen thuộc, giữ được sự liên hệ với cách dùng trong sách Đa-ni-ên và các sách Phúc Âm mà không diễn giải danh xưng.
- source_word: πολλὰ παθεῖν
  choice: chịu nhiều đau khổ
  rationale: Truyền đạt tự nhiên trong tiếng Việt phạm vi rộng của πολλά đi với πάσχω; rõ nghĩa hơn cách dịch sát chữ nhưng thiếu tự nhiên là “chịu nhiều điều”.
- source_word: ἀποδοκιμασθῆναι
  choice: bị ... khước từ
  rationale: Thể hiện sự bác bỏ có tính chính thức của giới lãnh đạo sau khi xem xét, đồng thời vẫn là cách nói rõ ràng, trang trọng.
- source_word: ὑπὸ τῶν πρεσβυτέρων
  choice: bị các trưởng lão ... khước từ
  rationale: “Trưởng lão” chỉ nhóm lãnh đạo Do Thái được công nhận, chứ không đơn thuần là những người cao tuổi.
- source_word: τῶν ἀρχιερέων
  choice: các thượng tế
  rationale: Ở số nhiều, từ này chỉ giới tư tế cấp cao hoặc các tư tế lãnh đạo, không hàm ý có nhiều người cùng giữ chức thầy tế lễ thượng phẩm duy nhất.
- source_word: τῶν γραμματέων
  choice: các kinh sư
  rationale: “Kinh sư” vừa tự nhiên trong tiếng Việt hiện đại vừa phản ánh vai trò của họ là những chuyên gia về Kinh Thánh và luật Do Thái.
- source_word: ἀποκτανθῆναι
  choice: bị giết
  rationale: Cách dịch trực tiếp và tự nhiên của động từ nguyên mẫu bị động, không thêm sắc thái xét xử pháp lý vốn không được biểu thị rõ trong chính từ này.
- source_word: μετὰ τρεῖς ἡμέρας
  choice: sau ba ngày
  rationale: Giữ nghĩa thông thường của μετά với đối cách và bảo tồn chính cách diễn đạt của Mác thay vì hòa đồng với các câu song song dùng “vào ngày thứ ba”.
- source_word: ἀναστῆναι
  choice: sống lại
  rationale: Cách diễn đạt tự nhiên, dễ hiểu trong tiếng Việt cho động từ nguyên mẫu chủ động nội động từ chỉ việc trỗi dậy khỏi sự chết; không đổi sang thể bị động “được làm cho sống lại”.
theological_decisions:
- issue: Sự cần thiết được diễn tả bằng δεῖ trong lời báo trước về cuộc thương khó
  choice: phải
  alternative: cần phải
  rationale: “Phải” giữ nguyên sức nặng thần học của sự cần thiết nhưng không đưa vào bản văn một lời giải thích giáo lý về nguyên nhân hoặc cơ chế của sự cần thiết đó.
- issue: Cụm từ chỉ thời gian μετὰ τρεῖς ἡμέρας
  choice: sau ba ngày
  alternative: vào ngày thứ ba
  rationale: Bản Hy Lạp của Mác nói “sau ba ngày.” Dịch “vào ngày thứ ba” sẽ làm cho câu này giống cách nói ở các phân đoạn khác hơn là phản ánh trực tiếp cách diễn đạt của Mác.
- issue: Thể của ἀναστῆναι
  choice: sống lại
  alternative: được làm cho sống lại
  rationale: Động từ Hy Lạp ở đây có hình thức chủ động, dùng theo nghĩa nội động từ. Bản dịch giữ điều đó, không chuyển sang thể bị động và cũng không suy diễn thêm về tác nhân.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “Ngài” duy trì sự tôn kính thông dụng; các thuật ngữ lịch sử “trưởng lão,” “thượng tế” và “kinh sư” phân biệt ba nhóm lãnh đạo. Cấu trúc liệt kê giữ chuỗi đau khổ—bị khước từ—bị giết—sống lại của nguyên văn.
