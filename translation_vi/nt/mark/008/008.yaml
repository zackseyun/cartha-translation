  text: ⸂καὶ ἔφαγον⸃ καὶ ἐχορτάσθησαν, καὶ ἦραν περισσεύματα κλασμάτων ἑπτὰ σπυρίδας.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/008.yaml
  text: And they ate and were satisfied[a], and they picked up seven baskets of leftover pieces.
translation:
  language: vi
  text: Họ ăn và được no nê. Sau đó, họ thu gom được bảy giỏ mẩu còn thừa[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hy Lạp σπυρίδας chỉ những chiếc giỏ, có lẽ là loại giỏ lớn; trong câu chuyện cho năm ngàn người ăn, Mác dùng một từ khác (κόφινοι, 6:43).
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφαγον
  choice: ăn
  rationale: Động từ aorist kể lại hành động một cách giản dị; “ăn” truyền đạt đúng nghĩa mà không thêm sắc thái nhấn mạnh.
- source_word: ἐχορτάσθησαν
  choice: được no nê
  rationale: χορτάζω ở đây nói đến việc được ăn đến mức đầy đủ. “Được no nê” vừa tự nhiên trong tiếng Việt, vừa giữ dạng bị động và ý được cung cấp đầy đủ.
- source_word: ἦραν
  choice: thu gom
  rationale: Trong ngữ cảnh nhặt lại phần dư sau bữa ăn, “thu gom” diễn đạt tự nhiên hành động αἴρω mà không quá sát chữ theo nghĩa “nâng lên”.
- source_word: περισσεύματα κλασμάτων
  choice: các mẩu còn thừa
  rationale: Cụm từ chỉ những phần nhỏ còn dư lại. Cách dịch này giữ cả ý về các mẩu và phần dư, đồng thời không tự ý xác định đó chỉ là bánh.
- source_word: ἑπτὰ σπυρίδας
  choice: bảy giỏ
  rationale: σπυρίς là một loại giỏ, có lẽ là giỏ lớn hơn κόφινος được dùng trong Mác 6:43. Bản văn chính dùng từ phổ thông “giỏ”; chú thích bảo lưu nét phân biệt từ vựng.
theological_decisions:
- issue: Chủ thể ngầm của ἦραν
  choice: người ta thu gom
  alternative: họ thu gom
  rationale: Tiếng Hy Lạp chỉ có động từ ngôi thứ ba số nhiều với chủ thể ngầm. Dùng “người ta” tránh buộc người đọc hiểu những người ăn và những người thu gom nhất thiết là cùng một nhóm, đồng thời vẫn giữ cách kể vô định tự nhiên.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dấu chấm phẩy giữ hai vế liên tiếp của câu Hy Lạp; “được no nê” bảo lưu sắc thái bị động, còn chú thích được đặt ngay sau “bảy giỏ,” là từ mà chú thích giải thích.
