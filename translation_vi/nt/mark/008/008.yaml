review_pass:
  verdict: revise
  source_fidelity: 'Bản nháp truyền đạt đúng các ý chính: họ ăn, được no, và có bảy σπυρίδες mẩu còn dư. Tuy nhiên, cấu trúc “các mẩu còn thừa, được bảy giỏ” đặt cụm chỉ số lượng sau dấu phẩy khiến quan hệ ngữ pháp không rõ ràng: có thể bị hiểu là các mẩu tự chúng ‘được bảy giỏ’, thay vì số mẩu thu gom đầy bảy giỏ. Bản sửa diễn đạt rõ số lượng giỏ là kết quả của việc thu gom, không thêm chi tiết về loại thức ăn hay chủ thể cụ thể.'
  naturalness: “Họ ăn và được no nê” tự nhiên, trang trọng vừa phải. “Họ thu gom được bảy giỏ mẩu còn thừa” là cách nói hiện đại, rõ nghĩa và mạch lạc hơn câu nháp. Dùng cùng chủ ngữ “họ” cũng phản ánh tự nhiên chuỗi động từ ngôi thứ ba số nhiều trong bản văn; không cần chuyển sang chủ ngữ vô định “người ta”.
  terminology: “No nê” chuyển đạt phù hợp ἐχορτάσθησαν; “mẩu còn thừa” chuyển đạt περισσεύματα κλασμάτων mà không tự xác định là bánh. “Giỏ” là lựa chọn an toàn cho σπυρίδες; chú thích bảo lưu khả năng đây là loại giỏ lớn và sự khác biệt với κόφινοι ở 6:43.
  issues:
  - severity: medium
    issue: Cú pháp của “được bảy giỏ” mơ hồ
    rationale: Trong “rồi người ta thu gom các mẩu còn thừa, được bảy giỏ”, cụm sau dấu phẩy không gắn rõ với hành động thu gom. Cần đưa “được bảy giỏ” vào ngay trong vị ngữ để biểu thị rằng số mẩu thu gom có lượng là bảy giỏ.
  - severity: low
    issue: Chủ ngữ “người ta” không cần thiết
    rationale: Động từ số nhiều trong tiếng Hy Lạp tiếp nối chủ thể kể chuyện trước đó; “họ” vừa tự nhiên vừa không tạo sắc thái vô định không có trong câu nguồn.
  revised_text: Họ ăn và được no nê. Sau đó, họ thu gom được bảy giỏ mẩu còn thừa[a].
  revised_footnotes:
  - marker: a
    text: Từ Hy Lạp σπυρίδας chỉ những chiếc giỏ, có lẽ là loại giỏ lớn; trong câu chuyện cho năm ngàn người ăn, Mác dùng một từ khác (κόφινοι, 6:43).
    reason: lexical_alternative
