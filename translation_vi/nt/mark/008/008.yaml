revisions:
- from: Họ ăn và được no nê; rồi người ta thu gom các mẩu còn thừa, được bảy giỏ[a].
  to: Họ ăn và được no nê. Sau đó, họ thu gom được bảy giỏ mẩu còn thừa[a].
  rationale: Sửa cấu trúc câu để bảy giỏ được hiểu rõ là lượng mẩu còn thừa đã thu gom. Việc tách thành hai câu giữ nhịp kể hiện đại mà vẫn phản ánh chuỗi hành động nối tiếp bằng καί; “Sau đó” chỉ trình tự hiển nhiên của câu chuyện, không thêm nội dung thực chất. Chú thích được giữ nguyên và vẫn neo đúng tại “giỏ”.
