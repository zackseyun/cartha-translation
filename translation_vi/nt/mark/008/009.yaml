  source_fidelity: “Có khoảng bốn ngàn người” faithfully renders the existential ἦσαν, approximate ὡς, and τετρακισχίλιοι in idiomatic Vietnamese. “Rồi Ngài cho họ ra về” accurately conveys the narrative connective and ἀπέλυσεν αὐτούς in its crowd-dismissal sense. The implicit subject is appropriately retained as “Ngài” from the immediate context.
