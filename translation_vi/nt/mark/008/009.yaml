id: MRK.8.9
reference: Mark 8:9
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἦσαν ⸀δὲ ὡς τετρακισχίλιοι. καὶ ἀπέλυσεν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/009.yaml
  text: There were about four thousand[a], and he sent them away.
translation:
  language: vi
  text: Có khoảng bốn ngàn người. Rồi Ngài cho họ ra về.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “giải tán họ.”'
    reason: Nêu cách dịch sát cấu trúc hơn của ἀπέλυσεν αὐτούς; phương án này vẫn đúng nghĩa nhưng kém tự nhiên hơn “cho họ ra về” trong văn cảnh.
lexical_decisions:
- source_word: ἦσαν
  choice: Có
  rationale: Động từ εἰμί được dùng theo nghĩa hiện hữu; tiếng Việt tự nhiên dùng “có” để nêu số người trong đám đông.
- source_word: δὲ
  choice: không dịch thành một từ riêng
  rationale: δέ là liên từ chuyển ý nhẹ. Việc tách câu sau mạch văn đã thể hiện đủ sự chuyển tiếp, nên không cần thêm một từ có thể nhấn quá mức.
- source_word: ὡς
  choice: khoảng
  rationale: ὡς đi với số đếm biểu thị con số ước chừng; “khoảng” là cách diễn đạt tự nhiên và chính xác trong tiếng Việt hiện đại.
- source_word: τετρακισχίλιοι
  choice: bốn ngàn người
  rationale: Số từ chỉ quy mô đám đông; thêm danh từ loại “người” là cần thiết để câu tiếng Việt rõ và tự nhiên.
- source_word: καὶ
  choice: Rồi
  rationale: Trong trình thuật, καί nối hành động kế tiếp; “Rồi” thể hiện diễn tiến tự nhiên mà không nhấn mạnh quan hệ suy luận.
- source_word: ἀπέλυσεν
  choice: cho họ ra về
  rationale: Trong ngữ cảnh này, ἀπολύω có nghĩa cho đám đông rời đi. “Cho họ ra về” tự nhiên, rõ nghĩa và giữ sắc thái ôn hòa của hành động.
- source_word: αὐτούς
  choice: họ
  rationale: Đại từ này quy chiếu về những người trong đám đông; “họ” là cách tương ứng tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Chủ ngữ ẩn của ἀπέλυσεν
  choice: Ngài
  alternative: Đức Chúa Jêsus
  rationale: Bản Hy Lạp chỉ hàm chứa chủ ngữ ngôi thứ ba số ít trong động từ. “Ngài” duy trì sự liên kết với chủ thể đã rõ trong văn cảnh mà không lặp lại tên riêng vốn không có trong câu này.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “ngàn” theo lối nói phổ thông; câu được chia làm hai vế ngắn để giữ nhịp kể chuyện. Dấu chú thích đặt ngay sau cụm từ mà chú thích giải thích.
