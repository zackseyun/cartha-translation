id: MRK.8.38
reference: Mark 8:38
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὃς γὰρ ἐὰν ἐπαισχυνθῇ με καὶ τοὺς ἐμοὺς λόγους ἐν τῇ γενεᾷ ταύτῃ τῇ μοιχαλίδι καὶ ἁμαρτωλῷ, καὶ ὁ υἱὸς τοῦ ἀνθρώπου ἐπαισχυνθήσεται αὐτὸν ὅταν ἔλθῃ ἐν τῇ δόξῃ τοῦ πατρὸς αὐτοῦ μετὰ τῶν ἀγγέλων τῶν ἁγίων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/038.yaml
  text: For whoever is ashamed of me and of my words in this adulterous and sinful generation[a], the Son of Man will also be ashamed of him when he comes in the glory of his Father with the holy angels.
translation:
  language: vi
  text: Vì ai hổ thẹn về tôi và những lời của tôi trong thế hệ ngoại tình và tội lỗi này[a], thì Con Người cũng sẽ hổ thẹn về người ấy khi Người đến trong vinh quang của Cha của Người cùng với các thiên sứ thánh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “thế hệ bất trung và tội lỗi này.” “Ngoại tình” được giữ trong chính văn vì tiếng Hy Lạp dùng hình ảnh ngoại tình cụ thể theo lối nói tiên tri để chỉ sự bất trung với giao ước.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπαισχυνθῇ / ἐπαισχυνθήσεται
  choice: hổ thẹn về / cũng sẽ hổ thẹn về
  rationale: Diễn đạt trực tiếp sự xấu hổ trong mối liên hệ với một người và lời của người ấy, đồng thời giữ phép đối ứng giữa phản ứng hiện tại của con người và phản ứng tương lai của Con Người.
- source_word: λόγους
  choice: những lời
  rationale: Giữ dạng số nhiều của tiếng Hy Lạp và sắc thái cụ thể về lời Chúa Giê-su, thay vì khái quát hóa thành “sứ điệp”.
- source_word: γενεᾷ
  choice: thế hệ
  rationale: Là cách tương đương tự nhiên, phù hợp với cộng đồng con người đương thời được mô tả về phương diện đạo đức.
- source_word: μοιχαλίδι
  choice: ngoại tình
  rationale: Giữ hình ảnh cụ thể mang tính tiên tri về sự bất trung, thay vì giải nghĩa ngay trong chính văn.
- source_word: ἁμαρτωλῷ
  choice: tội lỗi
  rationale: Tương đương trực tiếp với tính từ Hy Lạp và kết hợp tự nhiên với “ngoại tình”.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Con Người
  rationale: Giữ danh hiệu có âm hưởng Đa-ni-ên và ý nghĩa Kitô học, không thay bằng “tôi” hay “Đấng Mê-si-a”.
- source_word: δόξῃ
  choice: vinh quang
  rationale: Cách dịch Kinh Thánh chuẩn xác, giữ sắc thái về danh dự, uy nghi và sự rạng ngời thần thượng.
- source_word: μετὰ τῶν ἀγγέλων τῶν ἁγίων
  choice: cùng với các thiên sứ thánh
  rationale: Phản ánh cấu trúc định ngữ của nguyên văn mà không thêm đại từ sở hữu “của Người”, vốn không có trong tiếng Hy Lạp.
- source_word: ὃς γὰρ ἐὰν
  choice: Vì ai
  rationale: Thể hiện điều kiện khái quát và giữ liên từ giải thích γάρ một cách tự nhiên trong tiếng Việt.
- source_word: ἐν τῇ γενεᾷ ταύτῃ
  choice: giữa thế hệ ... này
  rationale: “Giữa” diễn đạt tự nhiên bối cảnh xã hội và đạo đức trong đó sự hổ thẹn được bộc lộ.
- source_word: αὐτόν
  choice: người ấy
  rationale: Giữ số ít của cấu trúc khái quát và tránh đại từ mang giới tính không cần thiết trong tiếng Việt.
theological_decisions:
- issue: Ý nghĩa ẩn dụ của μοιχαλίδι
  choice: Giữ “ngoại tình” trong chính văn như một ẩn dụ tiên tri về sự bất trung thuộc linh và đạo đức.
  alternative: Dịch thành “bất trung” để nói rõ nghĩa ẩn dụ.
  rationale: Nguyên văn dùng từ cụ thể về ngoại tình, gợi lại ngôn ngữ tiên tri về sự bất trung giao ước; giữ hình ảnh này bảo toàn chiều sâu liên văn bản mà không diễn giải quá mức.
- issue: Sở chỉ của “Con Người”
  choice: Giữ danh hiệu “Con Người”.
  alternative: Thay bằng “tôi” hoặc “Đấng Mê-si-a”.
  rationale: Cụm từ Hy Lạp là một danh hiệu Kitô học riêng, mang ý nghĩa cánh chung; thay thế sẽ làm mất âm hưởng và sức căng thần học của nguyên văn.
- issue: Đại từ αὐτόν
  choice: Dịch là “người ấy”.
  alternative: Dịch là “kẻ ấy” hoặc lặp lại “người đó”.
  rationale: “Người ấy” phản ánh số ít và mối đối ứng cá nhân mà không thêm sắc thái khinh miệt hay giới tính vốn không bắt buộc trong tiếng Việt.
- issue: Quan hệ của “Cha mình”
  choice: Dịch τοῦ πατρὸς αὐτοῦ là “của Cha mình”.
  alternative: “của Cha Người”.
  rationale: “Cha mình” tự nhiên trong tiếng Việt và xác định Cha là Cha của Con Người, không thêm diễn giải thần học ngoài cấu trúc sở hữu của nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “hổ thẹn về” để giữ phép lặp đối ứng của nguyên văn; dùng “Người” khi chỉ Con Người nhằm tạo sự rõ ràng và trang trọng. Dấu chú thích [a] xuất hiện ngay sau cụm từ liên quan trong chính văn.
