  to: Vì ai hổ thẹn về tôi và những lời của tôi trong thế hệ ngoại tình và tội lỗi này[a], thì Con Người cũng sẽ hổ thẹn về người ấy khi Người đến trong vinh quang của Cha của Người cùng với các thiên sứ thánh.
