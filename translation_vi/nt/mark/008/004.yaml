id: MRK.8.4
reference: Mark 8:4
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἀπεκρίθησαν αὐτῷ οἱ μαθηταὶ αὐτοῦ ⸀ὅτι Πόθεν τούτους δυνήσεταί τις ὧδε χορτάσαι ἄρτων ἐπ’ ἐρημίας;
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/004.yaml
  text: And his disciples answered him[a], “From where will anyone be able to satisfy these people with bread here in a desolate place?”
translation:
  language: vi
  text: 'Các môn đồ thưa với Ngài[a]: “Ở nơi hoang vắng này, ai có thể kiếm đâu ra bánh để cho những người này ăn no?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Các môn đồ đáp lời Ngài.”'
    reason: “Thưa” diễn đạt tự nhiên quan hệ giao tiếp trong ngữ cảnh, còn “đáp lời” phản ánh trực tiếp hơn động từ ἀπεκρίθησαν mà không nêu rõ sắc thái tôn kính.
lexical_decisions:
- source_word: ἀπεκρίθησαν
  choice: thưa
  rationale: Động từ chỉ lời đáp; “thưa” tự nhiên trong tiếng Việt khi môn đồ nói với Chúa Giê-su và vẫn giữ sắc thái tôn kính, không thêm nội dung.
- source_word: ὅτι
  choice: dấu hai chấm và ngoặc kép
  rationale: Ở đây ὅτι dẫn lời nói trực tiếp; dấu câu tiếng Việt diễn đạt chức năng này tự nhiên hơn việc dịch thành một từ riêng.
- source_word: Πόθεν
  choice: kiếm đâu ra
  rationale: Giữ trọng tâm của Πόθεν là nguồn cung cấp (“từ đâu”), đồng thời tạo câu hỏi tự nhiên trong tiếng Việt khi đi với khả năng có bánh.
- source_word: τούτους
  choice: những người này
  rationale: Đại từ số nhiều chỉ đám đông; cách dịch này làm rõ đối tượng mà không giới hạn họ là nam giới.
- source_word: δυνήσεταί τις
  choice: ai có thể
  rationale: Diễn đạt khả năng của một người bất định trong câu hỏi. Tiếng Việt không cần đánh dấu thì tương lai ở đây vì hoàn cảnh và cấu trúc câu đã thể hiện ý hướng tới khả năng cung ứng.
- source_word: ὧδε
  choice: ở nơi ... này
  rationale: Diễn đạt vị trí “ở đây” một cách tự nhiên khi kết hợp với ἐπ’ ἐρημίας.
- source_word: χορτάσαι
  choice: cho ... ăn no
  rationale: Truyền đạt chính xác ý cho ăn đến mức no đủ, tự nhiên hơn “làm thỏa mãn” trong ngữ cảnh thực phẩm.
- source_word: ἄρτων
  choice: bánh
  rationale: Tương đương trực tiếp với ἄρτων trong ngữ cảnh, không diễn rộng thành “thức ăn” hay xác định quá mức là số ổ bánh.
- source_word: ἐπ’ ἐρημίας
  choice: nơi hoang vắng
  rationale: Chỉ một vùng không có dân cư hoặc nguồn cung ứng; “nơi hoang vắng” rõ ràng, trang trọng và không nhất thiết hàm ý sa mạc.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Trật tự “Ở nơi hoang vắng này” được đưa lên đầu lời nói để câu hỏi tự nhiên trong tiếng Việt; “kiếm đâu ra bánh” bảo toàn câu hỏi về nguồn cung ứng, còn “ăn no” giữ lực nghĩa của χορτάσαι.
