  text: And he asked them, “How many loaves do you have?” They said, “Seven.”
translation:
  language: vi
  text: 'Người hỏi họ: “Anh em có bao nhiêu ổ bánh?” Họ đáp: “Bảy.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: Ngài
  rationale: Liên từ καὶ nối tiếp mạch kể; trong tiếng Việt, không cần dịch thành “và” ở đầu câu để câu văn tự nhiên. Chủ ngữ hàm ẩn của ἠρώτα được diễn đạt bằng “Ngài” để chỉ Chúa Giê-su một cách trang trọng, theo ngữ cảnh.
- source_word: ἠρώτα
  choice: hỏi
  rationale: Thì chưa hoàn thành có thể gợi hành động đang diễn ra, nhưng trong lối kể tiếng Việt, “hỏi” diễn đạt tự nhiên và đầy đủ hành động tại đây.
- source_word: αὐτούς
  choice: họ
  rationale: Đại từ đối cách số nhiều, chỉ các môn đồ trong ngữ cảnh.
- source_word: Πόσους
  choice: bao nhiêu
  rationale: Cách hỏi số lượng tự nhiên trong tiếng Việt.
- source_word: ἔχετε
  choice: các con có
  rationale: Động từ ngôi thứ hai số nhiều. “Các con” làm rõ số nhiều và phù hợp lời Chúa Giê-su nói với các môn đồ, nhưng không thêm sắc thái giáo lý.
- source_word: ἄρτους
  choice: ổ bánh
  rationale: ἄρτος có thể là bánh hoặc ổ bánh; vì được đếm, “ổ bánh” thể hiện rõ các đơn vị riêng biệt.
- source_word: οἱ δὲ εἶπαν
  choice: Họ đáp
  rationale: Cấu trúc này chuyển sang lời của nhóm người trả lời. “Đáp” tự nhiên trong ngữ cảnh hỏi–đáp, dù εἶπαν theo nghĩa sát là “nói”.
- source_word: Ἑπτά
  choice: Bảy ổ
  rationale: Nguyên văn chỉ nói “Bảy”; thêm danh từ lược “ổ” trong tiếng Việt giúp câu đáp rõ và tự nhiên mà không thay đổi nội dung.
