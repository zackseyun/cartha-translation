    rationale: Cụm này có thể gợi nghĩa “lấy lại/nhận lại”, còn nguyên văn hỏi một người có thể đưa ra điều gì để đổi lấy mạng sống mình. “Đem gì đổi lấy” bảo toàn hướng hành động này mà vẫn tự nhiên.
