  text: For what can a man give in exchange for his life?[a]
translation:
  language: vi
  text: Vì một người có thể đem gì đổi lấy mạng sống mình?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “linh hồn” hoặc “bản thân”; từ Hy Lạp này, tùy ngữ cảnh, có thể chỉ “mạng sống”, “bản thân” hoặc “linh hồn”.
    reason: lexical_alternative
lexical_decisions:
- source_word: τί γὰρ
  choice: Vì ... gì
  rationale: τί mở đầu câu hỏi “gì”, còn γάρ nối câu này với lời giải thích ở câu trước; cấu trúc “Vì... gì” giữ được cả tính nghi vấn lẫn quan hệ giải thích trong tiếng Việt tự nhiên.
- source_word: δοῖ
  choice: có thể lấy ... đổi lại
  rationale: δοῖ là dạng giả định quá khứ của δίδωμι trong câu hỏi tu từ. Khi đi với ἀντάλλαγμα, cách diễn đạt “có thể lấy gì đổi lại” truyền đạt tự nhiên ý một người có thể đưa ra thứ gì làm vật trao đổi.
- source_word: ἄνθρωπος
  choice: một người
  rationale: Danh từ số ít mang nghĩa đại diện, chỉ con người nói chung. “Một người” vừa đúng phạm vi nghĩa vừa tự nhiên và không giới hạn câu nói vào nam giới.
- source_word: ἀντάλλαγμα
  choice: đổi lại
  rationale: Từ này chỉ vật hoặc giá được đưa ra để đổi lấy điều gì. Trong cấu trúc tiếng Việt, “lấy gì đổi lại” diễn đạt gọn và tự nhiên quan hệ trao đổi.
- source_word: τῆς ψυχῆς αὐτοῦ
  choice: mạng sống mình
  rationale: Trong ngữ cảnh Mác 8:35–37, ψυχή chỉ sự sống của một người, đồng thời có thể bao hàm chính bản thân hay linh hồn người ấy. “Mạng sống mình” phù hợp với mạch văn về mất và cứu sự sống; chú thích bảo lưu chiều nghĩa rộng hơn.
theological_decisions:
- issue: Cách dịch ψυχή trong lời dạy về mất và cứu sự sống
  choice: mạng sống
  alternative: linh hồn; chính bản thân
  rationale: Ngữ cảnh trực tiếp nhấn mạnh sự sống mà người ta mất hoặc cứu, nhưng ψυχή không nhất thiết chỉ sự sống sinh học. Bản văn chính dùng “mạng sống” để rõ ràng và liền mạch, còn chú thích giữ lại sự đa nghĩa và chiều sâu thần học.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Câu hỏi tu từ được diễn đạt tự nhiên; đại từ phản thân “mình” quy chiếu về “một người” và tránh lối văn nặng nề.
