  yaml_path: translation/nt/mark/008/007.yaml
  text: And they had a few small fish[a]; and after blessing them[b], he said to set these also before them.
translation:
  language: vi
  text: Họ có vài con cá nhỏ. Sau khi chúc phước cho số cá ấy, Ngài bảo họ cũng dọn số cá này ra cho mọi người.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰχθύδια
  choice: cá nhỏ
  rationale: Dạng giảm nhẹ chỉ những con cá nhỏ; cách dịch này tự nhiên và giữ được sắc thái của từ Hy Lạp.
- source_word: ὀλίγα
  choice: vài con
  rationale: Diễn đạt tự nhiên một số lượng ít với danh từ đếm được trong tiếng Việt.
- source_word: εὐλογήσας
  choice: sau khi chúc phước
  rationale: Giữ nghĩa gần của εὐλογέω và thể hiện hành động xảy ra trước lời truyền bảo.
- source_word: αὐτά
  choice: số cá ấy
  rationale: Đại từ số nhiều quy chiếu về những con cá nhỏ; cách nói này rõ nghĩa trong tiếng Việt.
- source_word: καὶ ταῦτα
  choice: cũng ... cá
  rationale: Giữ ý bổ sung của καί và sự nhấn mạnh quy chiếu của ταῦτα theo trật tự tự nhiên trong tiếng Việt.
- source_word: παρατιθέναι
  choice: dọn ... ra cho mọi người
  rationale: Trong ngữ cảnh bữa ăn, động từ có nghĩa đặt thức ăn trước mặt người khác, tức dọn ra; chủ thể ngầm hiểu là các môn đồ và người nhận là đám đông.
- source_word: εἶπεν
  choice: Ngài bảo họ
  rationale: Trong kết cấu với động từ nguyên mẫu mang ý truyền khiến, “bảo họ” diễn đạt tự nhiên lời chỉ thị và làm rõ chủ thể ngầm hiểu mà không thay đổi nội dung.
