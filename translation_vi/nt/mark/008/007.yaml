translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Ngài” để chỉ Đức Giê-su theo mạch văn; “dọn ... ra” phù hợp ngữ cảnh phân phát thức ăn và tự nhiên hơn lối dịch sát chữ “đặt trước mặt”.
