    rationale: Nguyên văn chỉ dùng đại từ nam số ít, không cho biết tuổi tác hay quan hệ thân mật. “Anh” có thể gợi một người đàn ông trẻ và có sắc thái hội thoại; “Người ấy” trung tính hơn trong lời thuật chuyện.
