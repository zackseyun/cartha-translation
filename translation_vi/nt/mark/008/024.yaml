base_translation:
  language: en
  yaml_path: translation/nt/mark/008/024.yaml
  text: And looking up, he said, “I see people, because I see them walking around like trees.”
translation:
  language: vi
  text: 'Người ấy nhìn lên rồi nói: “Tôi thấy người ta; tôi thấy họ đi lại, trông như cây.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναβλέψας
  choice: nhìn lên
  rationale: Giữ nghĩa trực tiếp của phân từ; trong ngữ cảnh chữa lành thị giác, từ này cũng có thể gợi ý việc nhìn thấy trở lại, nhưng câu dịch không cần giải nghĩa thêm.
- source_word: τοὺς ἀνθρώπους
  choice: người ta
  rationale: Cách nói tự nhiên trong tiếng Việt cho số nhiều chỉ con người nói chung trong cảnh trước mắt.
- source_word: ὅτι
  choice: ;
  rationale: Ở đây ὅτι mở đầu phần giải thích cho nhận định trước. Dấu chấm phẩy diễn đạt tự nhiên mối quan hệ giải thích mà không ép thành quan hệ nguyên nhân cứng nhắc.
- source_word: ὡς δένδρα
  choice: trông như cây
  rationale: Giữ nguyên phép so sánh cho thấy thị giác của người ấy vẫn chưa rõ.
- source_word: περιπατοῦντας
  choice: đi lại
  rationale: Diễn đạt tự nhiên hành động những người được nhìn thấy đang chuyển động.
theological_decisions:
- issue: Tình trạng thị giác sau lần chữa lành đầu tiên
  choice: Giữ lời mô tả rằng người ấy thấy người nhưng hình ảnh giống cây đang đi lại
  alternative: Diễn giải rõ rằng ông chỉ nhìn thấy lờ mờ
  rationale: Bản văn biểu đạt tình trạng thị giác qua hình ảnh cụ thể, không trực tiếp dùng từ 'lờ mờ'; bản dịch giữ sự căng thẳng của tiến trình chữa lành.
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Trật tự câu được điều chỉnh nhẹ để lời nói tự nhiên trong tiếng Việt, đồng thời giữ hai động từ thấy của nguyên văn.
