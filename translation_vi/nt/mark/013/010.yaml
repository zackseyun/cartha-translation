  yaml_path: translation/nt/mark/013/010.yaml
  text: And the good news must first be proclaimed to all the nations[a][b].
translation:
  language: vi
  text: Và Tin Mừng[a] trước hết phải được rao truyền cho muôn dân[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “Phúc Âm.” Từ Hy Lạp εὐαγγέλιον có nghĩa đen là “tin mừng.”
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “giữa muôn dân”; trong một số văn cảnh, từ ἔθνη cũng có thể có nghĩa là “dân ngoại.”
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ
  choice: Và
  rationale: Giữ chức năng nối tiếp mạch diễn từ của καὶ mà không thêm sắc thái đối lập.
- source_word: εἰς πάντα τὰ ἔθνη
  choice: cho muôn dân
  rationale: Cụm từ diễn đạt phạm vi hoặc hướng đến của việc rao truyền. “Muôn dân” tự nhiên trong tiếng Việt, giữ được tầm mức phổ quát và không thu hẹp ἔθνη thành riêng dân ngoại.
- source_word: πρῶτον
  choice: trước hết
  rationale: Diễn đạt thứ tự thời gian do πρῶτον chỉ ra, không xác định quá mức trình tự của những biến cố tiếp theo.
- source_word: δεῖ
  choice: phải
  rationale: Giữ nguyên ý nghĩa cần thiết, có thể hàm ý sự tất yếu theo chương trình của Đức Chúa Trời nhưng không nói rõ nguồn của sự tất yếu ấy.
- source_word: κηρυχθῆναι
  choice: được rao truyền
  rationale: Thể hiện thể bị động và ý công bố công khai của κηρύσσω bằng cách nói trang trọng nhưng quen thuộc trong tiếng Việt.
- source_word: τὸ εὐαγγέλιον
  choice: Tin Mừng
  rationale: “Tin Mừng” truyền đạt trực tiếp nghĩa của εὐαγγέλιον, đồng thời là cách gọi quen thuộc, tự nhiên và trang trọng trong tiếng Việt hiện đại.
theological_decisions:
- issue: Phạm vi của ἔθνη
  choice: muôn dân
  alternative: tất cả các dân tộc; mọi dân ngoại
  rationale: “Muôn dân” giữ nghĩa phổ quát của câu và tránh áp đặt sự đối lập Do Thái–dân ngoại vốn không được nói rõ tại đây; chú thích bảo lưu khả năng dịch là “dân ngoại” trong một số văn cảnh.
- issue: Sắc thái của δεῖ
  choice: phải
  alternative: cần phải
  rationale: “Phải” bảo toàn sức nặng của sự tất yếu nhưng không giải thích thêm rằng đó nhất thiết là sự tất yếu thần linh, điều câu này không nói tường minh.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Trật tự “trước hết phải” phản ánh khá sát πρῶτον δεῖ, còn “rao truyền” giữ sắc thái công bố công khai. Viết hoa “Tin Mừng” theo cách dùng danh xưng quen thuộc trong tiếng Việt.
