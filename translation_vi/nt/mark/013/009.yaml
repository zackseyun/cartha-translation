id: MRK.13.9
reference: Mark 13:9
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: βλέπετε δὲ ὑμεῖς ἑαυτούς· ⸀παραδώσουσιν ὑμᾶς εἰς συνέδρια καὶ εἰς συναγωγὰς δαρήσεσθε καὶ ἐπὶ ἡγεμόνων καὶ βασιλέων σταθήσεσθε ἕνεκεν ἐμοῦ εἰς μαρτύριον αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/009.yaml
  text: But watch yourselves. They will hand you over to councils[a], and you will be beaten in synagogues, and you will stand before governors and kings because of me, as a testimony to them.
translation:
  language: vi
  text: Nhưng chính anh em phải coi chừng. Người ta sẽ nộp anh em cho các hội đồng; anh em sẽ bị đánh đập trong các hội đường, và sẽ phải đứng trước các tổng đốc cùng các vua vì cớ tôi, để làm chứng cho họ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “để làm chứng chống lại họ.”'
    reason: Ngữ đoạn εἰς μαρτύριον αὐτοῖς có thể chỉ lời chứng hướng đến họ hoặc, tùy văn cảnh, lời chứng mang tính bất lợi cho họ.
lexical_decisions:
- source_word: βλέπετε δὲ ὑμεῖς ἑαυτούς
  choice: Nhưng chính anh em phải coi chừng
  rationale: Mệnh lệnh hiện tại kêu gọi sự cảnh giác liên tục; “chính anh em” giữ sắc thái nhấn mạnh của ὑμεῖς ἑαυτούς, còn “coi chừng” truyền đạt tự nhiên sức cảnh báo.
- source_word: παραδώσουσιν ὑμᾶς
  choice: Người ta sẽ nộp anh em
  rationale: Trong bối cảnh bách hại và pháp lý, động từ chỉ việc giao nộp cho nhà chức trách; chủ ngữ số nhiều không xác định được diễn đạt tự nhiên bằng “người ta”.
- source_word: εἰς συνέδρια
  choice: cho các hội đồng
  rationale: Danh từ số nhiều nói đến các hội đồng cai quản hoặc xét xử tại địa phương, không nhất thiết chỉ Tòa Công Luận ở Giê-ru-sa-lem.
- source_word: εἰς συναγωγὰς δαρήσεσθε
  choice: anh em sẽ bị đánh đập trong các hội đường
  rationale: Giữ cấu trúc bị động và địa điểm của việc trừng phạt; “đánh đập” đủ cụ thể mà không thu hẹp thành một hình thức roi vọt nhất định.
- source_word: ἐπὶ ἡγεμόνων καὶ βασιλέων σταθήσεσθε
  choice: sẽ phải đứng trước các tổng đốc cùng các vua
  rationale: “Đứng trước” giữ hình ảnh xuất hiện trước nhà cầm quyền; “sẽ phải” chuyển tải sắc thái bị buộc phải ra trình diện hàm chứa trong dạng bị động, còn “tổng đốc” phân biệt ἡγεμόνες với các vua.
- source_word: ἕνεκεν ἐμοῦ
  choice: vì cớ tôi
  rationale: Diễn đạt nguyên nhân của sự bách hại là mối liên hệ và lòng trung thành với Đức Giê-su, bằng lối nói trang trọng nhưng vẫn dễ hiểu.
- source_word: εἰς μαρτύριον αὐτοῖς
  choice: để làm chứng cho họ
  rationale: Diễn đạt mục đích hoặc kết quả của việc ra trước nhà cầm quyền. “Cho họ” giữ hướng của αὐτοῖς mà không tự ý áp đặt sắc thái kết án.
theological_decisions:
- issue: Ý nghĩa của εἰς μαρτύριον αὐτοῖς
  choice: Việc các môn đồ bị buộc ra trước nhà cầm quyền trở thành dịp làm chứng cho họ.
  alternative: Việc ấy trở thành lời chứng chống lại họ, mang sắc thái kết án.
  rationale: μαρτύριον có thể là lời chứng hướng đến người nghe, nhưng trong một số văn cảnh cũng có thể mang lực bất lợi cho họ. Bản chính dùng cách dịch rộng hơn và chú thích khả năng “chống lại họ” để không giải quyết thay sự căng thẳng của nguyên văn.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “anh em” theo lời Đức Giê-su nói với các môn đồ; tránh thuật ngữ giáo phái. Dấu [a] được đặt ngay sau ngữ đoạn mà chú thích giải thích.
