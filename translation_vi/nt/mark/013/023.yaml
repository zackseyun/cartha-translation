  yaml_path: translation/nt/mark/013/023.yaml
  text: But you[a], watch out[b]; I have told you all things beforehand.
translation:
  language: vi
  text: Còn anh em, hãy cảnh giác[a]; tôi đã báo trước[b] cho anh em mọi điều.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “hãy coi chừng”, “hãy đề phòng” hoặc “hãy lưu ý”.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “tôi đã nói trước cho anh em mọi điều”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς
  choice: chính anh em
  rationale: Đại từ số nhiều được nêu rõ và mang sắc thái nhấn mạnh, đối chiếu; “chính anh em” giữ được điểm nhấn ấy trong tiếng Việt.
- source_word: δὲ
  choice: Nhưng
  rationale: Thể hiện sự chuyển ý có tính tương phản trong mạch cảnh báo.
- source_word: βλέπετε
  choice: hãy cảnh giác
  rationale: Mệnh lệnh hiện tại số nhiều mang nghĩa cảnh báo phải luôn tỉnh táo, đề phòng; cách diễn đạt này tự nhiên và trang trọng trong tiếng Việt.
- source_word: προείρηκα
  choice: tôi đã báo trước
  rationale: Động từ chỉ việc nói trước; thì hoàn thành nhấn mạnh lời đã nói vẫn có giá trị hiện tại. “Đã báo trước” giữ cả nội dung báo tin và sắc thái cảnh báo, nhưng không loại trừ nghĩa trung tính “đã nói trước” nên được ghi chú.
- source_word: ὑμῖν
  choice: cho anh em
  rationale: Tân ngữ gián tiếp của động từ nói, được diễn đạt tự nhiên bằng “cho anh em”.
- source_word: πάντα
  choice: mọi điều
  rationale: Giữ nghĩa bao quát của dạng trung tính số nhiều, đồng thời tự nhiên hơn “mọi sự” trong ngữ cảnh này; phạm vi vẫn do văn cảnh xác định.
theological_decisions:
- issue: Phạm vi của πάντα và tác dụng của lời báo trước
  choice: Dịch “mọi điều” mà không thêm từ giới hạn phạm vi, để lời văn giữ tính bao quát và để văn cảnh xác định những điều được nói đến.
  alternative: Dịch “tất cả những điều này” hoặc giải thích rằng Chúa Giê-su chỉ nói đến các cảnh báo ngay trước đó.
  rationale: Nguyên văn không có đại từ chỉ định và không tự giải quyết liệu đây là mọi chi tiết hay mọi điều liên quan trong văn cảnh; bản dịch không nên thu hẹp hoặc tuyệt đối hóa hàm ý.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “anh em” cho đối tượng số nhiều trong lời Chúa Giê-su nói với các môn đồ; dấu chấm phẩy giữ liên hệ chặt giữa mệnh lệnh và lời giải thích.
