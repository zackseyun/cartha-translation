  to: Vì trong những ngày ấy sẽ có một cơn hoạn nạn chưa từng có từ buổi đầu của công trình sáng tạo mà Đức Chúa Trời đã dựng nên cho đến nay[a], và cũng sẽ không bao giờ có nữa.
