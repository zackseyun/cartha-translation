id: MRK.13.19
reference: Mark 13:19
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἔσονται γὰρ αἱ ἡμέραι ἐκεῖναι θλῖψις οἵα οὐ γέγονεν τοιαύτη ἀπ’ ἀρχῆς κτίσεως ⸀ἣν ἔκτισεν ὁ θεὸς ἕως τοῦ νῦν καὶ οὐ μὴ γένηται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/019.yaml
  text: For those days will be a tribulation such as has not been from the beginning of the creation that God created until now[a], and never will be.
translation:
  language: vi
  text: Vì trong những ngày ấy sẽ có một cơn hoạn nạn chưa từng có từ buổi đầu của công trình sáng tạo mà Đức Chúa Trời đã dựng nên cho đến nay[a], và cũng sẽ không bao giờ có nữa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “một cơn hoạn nạn mà từ buổi đầu của công trình sáng tạo Đức Chúa Trời đã dựng nên cho đến nay chưa từng có, và cũng sẽ không bao giờ có nữa.”'
    reason: Cách sắp xếp mệnh đề so sánh trong tiếng Hy Lạp có thể được thể hiện bằng một trật tự tiếng Việt khác mà ý nghĩa căn bản không đổi.
lexical_decisions:
- source_word: θλῖψις
  choice: cơn hoạn nạn
  rationale: Diễn đạt một thời kỳ đau khổ, áp bức nghiêm trọng trong văn mạch cánh chung; cách nói này trang trọng, quen thuộc nhưng vẫn dễ hiểu.
- source_word: ἔσονται ... αἱ ἡμέραι ἐκεῖναι θλῖψις
  choice: những ngày ấy sẽ là một cơn hoạn nạn
  rationale: Giữ cấu trúc vị ngữ cô đọng của tiếng Hy Lạp, theo đó chính những ngày ấy hợp thành một thời kỳ hoạn nạn, thay vì thêm ý rằng chúng chỉ ‘đem đến’ hoạn nạn.
- source_word: οἵα οὐ γέγονεν τοιαύτη
  choice: chưa từng có
  rationale: Chuyển tải tự nhiên sức nhấn mạnh so sánh về tính chưa từng xảy ra của cơn hoạn nạn, không lặp lại máy móc hai đại từ tương quan trong tiếng Hy Lạp.
- source_word: ἀπ’ ἀρχῆς κτίσεως
  choice: từ buổi đầu của công trình sáng tạo
  rationale: Giữ rõ danh từ ‘sáng tạo’ và phạm vi từ lúc khởi đầu, đồng thời dùng cách diễn đạt tiếng Việt tự nhiên hơn ‘sự sáng tạo’ trong mệnh đề này.
- source_word: ἣν ἔκτισεν ὁ θεὸς
  choice: mà Đức Chúa Trời đã dựng nên
  rationale: Giữ nguyên mệnh đề quan hệ và nêu rõ Đức Chúa Trời là Đấng Tạo Hóa, kể cả nét lặp có chủ ý giữa ‘sáng tạo’ và ‘dựng nên’.
- source_word: ἕως τοῦ νῦν
  choice: cho đến nay
  rationale: Cách diễn đạt thời gian trực tiếp, tự nhiên và chính xác.
- source_word: οὐ μὴ γένηται
  choice: cũng sẽ không bao giờ có nữa
  rationale: Phản ánh phủ định tương lai rất mạnh của οὐ μή; ‘nữa’ nối tự nhiên với ‘chưa từng có’ mà không làm suy yếu tính tuyệt đối của lời phủ định.
theological_decisions:
- issue: Phạm vi của ngôn ngữ sáng tạo
  choice: Giữ ‘công trình sáng tạo mà Đức Chúa Trời đã dựng nên’, chỉ toàn thể trật tự thọ tạo mà không thu hẹp phạm vi.
  alternative: ‘từ thuở khai thiên lập địa’ hoặc cách hiểu giới hạn vào một khởi điểm địa phương hay giao ước
  rationale: Bản Hy Lạp dùng cả κτίσις và κτίζω, với Đức Chúa Trời làm chủ thể. Bản dịch giữ phạm vi sáng tạo và không áp đặt một hệ thống cánh chung riêng.
- issue: Tính độc nhất của cơn hoạn nạn
  choice: Giữ cả chiều nhìn về quá khứ (‘chưa từng có’) lẫn tương lai (‘sẽ không bao giờ có nữa’).
  alternative: Hiểu câu chỉ như lối cường điệu thông thường về một tai họa địa phương
  rationale: Cấu trúc so sánh cùng phủ định οὐ μή rất mạnh đòi hỏi giữ nguyên sức khẳng định của câu, nhưng bản dịch không xác định thêm thời điểm hay mô hình ứng nghiệm.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. ‘Cơn hoạn nạn’ giữ sắc thái nghiêm trọng và âm hưởng khải huyền; cấu trúc hơi cô đọng ‘những ngày ấy sẽ là một cơn hoạn nạn’ được giữ để phản ánh sát nét diễn đạt của nguyên văn.
