id: MRK.13.8
reference: Mark 13:8
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐγερθήσεται γὰρ ἔθνος ἐπ’ ἔθνος καὶ βασιλεία ἐπὶ βασιλείαν, ⸀ἔσονται σεισμοὶ κατὰ τόπους, ⸁ἔσονται ⸀λιμοί· ⸀ἀρχὴ ὠδίνων ταῦτα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/008.yaml
  text: For nation will rise against nation[a], and kingdom against kingdom. There will be earthquakes in various places; there will be famines. These are the beginning of birth pains.
translation:
  language: vi
  text: Vì dân tộc này sẽ nổi dậy chống dân tộc kia, vương quốc này chống vương quốc kia. Sẽ có động đất ở nhiều nơi; sẽ có nạn đói. Những điều ấy là khởi đầu của những cơn đau chuyển dạ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “những cơn đau sinh nở.” Tiếng Hy Lạp dùng hình ảnh những cơn đau gắn với việc sinh con để nói ẩn dụ về các khổ nạn xảy ra trước điều sẽ đến.
    reason: Nêu cách dịch từ vựng khác và giải thích hình ảnh ẩn dụ của ὠδίνων.
lexical_decisions:
- source_word: ἐγερθήσεται
  choice: sẽ nổi dậy
  rationale: Động từ tương lai mang hình thức bị động nhưng trong cấu trúc này diễn tả việc một cộng đồng vùng lên đối đầu cộng đồng khác; “sẽ nổi dậy” tự nhiên trong tiếng Việt và giữ sắc thái xung đột.
- source_word: ἔθνος ... ἐπ’ ἔθνος
  choice: dân tộc này ... chống dân tộc kia
  rationale: ἔθνος có thể chỉ dân, dân tộc hoặc quốc gia. “Dân tộc” giữ được nghĩa về một cộng đồng người và phân biệt với βασιλεία trong vế song song.
- source_word: βασιλεία ... ἐπὶ βασιλείαν
  choice: vương quốc này chống vương quốc kia
  rationale: Ở đây βασιλεία chỉ một lãnh thổ hay thực thể chính trị do vua cai trị; “vương quốc” giữ hình ảnh chính trị và cấu trúc song song của nguyên văn.
- source_word: σεισμοὶ
  choice: động đất
  rationale: Đây là nghĩa trực tiếp và thông dụng của σεισμός trong ngữ cảnh này.
- source_word: κατὰ τόπους
  choice: ở nhiều nơi
  rationale: κατά với danh từ số nhiều mang ý phân bố tại nhiều địa điểm; cách diễn đạt này rõ ràng và tự nhiên trong tiếng Việt.
- source_word: λιμοί
  choice: nạn đói
  rationale: λιμός chỉ nạn đói trên diện rộng, không chỉ cảm giác đói hay thiếu thực phẩm thông thường.
- source_word: ἀρχὴ
  choice: khởi đầu
  rationale: “Khởi đầu” diễn tả rằng các biến cố này mới là giai đoạn mở đầu, chứ chưa phải toàn bộ những gì sẽ xảy ra.
- source_word: ὠδίνων
  choice: những cơn đau chuyển dạ
  rationale: ὠδίν chỉ những cơn đau gắn với việc sinh con. “Đau chuyển dạ” dễ hiểu, chính xác và giữ nguyên hình ảnh ẩn dụ.
- source_word: ταῦτα
  choice: Những điều ấy
  rationale: Đại từ số nhiều quy chiếu về toàn bộ các biến cố vừa nêu; cách dịch này tự nhiên và giữ phạm vi quy chiếu rộng.
theological_decisions:
- issue: Ẩn dụ khải huyền trong ἀρχὴ ὠδίνων
  choice: Giữ hình ảnh “khởi đầu của những cơn đau chuyển dạ,” diễn tả các khổ nạn mở đầu trước điều sẽ đến.
  alternative: Diễn giải thành “đây mới chỉ là những tai họa ban đầu” hoặc gắn cụ thể với một hệ thống thời kỳ tận thế.
  rationale: Nguyên văn dùng hình ảnh sinh nở nhưng không giải thích đầy đủ điều gì sẽ được sinh ra hay xác định một niên biểu tận thế. Bản dịch vì thế giữ nguyên sức căng của ẩn dụ mà không áp đặt một hệ thống thần học.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cấu trúc song song “dân tộc này… dân tộc kia; vương quốc này… vương quốc kia” phản ánh nhịp điệu nguyên văn. Dấu chú thích được đặt sau “đau chuyển dạ,” đúng với từ mà chú thích giải thích.
