id: MRK.13.34
reference: Mark 13:34
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὡς ἄνθρωπος ἀπόδημος ἀφεὶς τὴν οἰκίαν αὐτοῦ καὶ δοὺς τοῖς δούλοις αὐτοῦ τὴν ἐξουσίαν, ⸀ἑκάστῳ τὸ ἔργον αὐτοῦ, καὶ τῷ θυρωρῷ ἐνετείλατο ἵνα γρηγορῇ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/034.yaml
  text: It is like a man away on a journey[a], who left his house and gave authority to his servants, to each one his work, and commanded the doorkeeper to stay awake.
translation:
  language: vi
  text: Cũng như một người đi xa, rời nhà mình, trao quyền cho các đầy tớ[a], giao cho mỗi người công việc riêng, và truyền cho người gác cửa phải tỉnh thức.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hy Lạp: “các nô lệ”, tức những người thuộc địa vị lệ thuộc và ở dưới quyền của chủ trong gia hộ.'
    reason: Làm rõ địa vị xã hội hàm chứa trong từ δοῦλοι, vốn có thể bị cách gọi “đầy tớ” làm nhẹ đi.
lexical_decisions:
- source_word: ὡς
  choice: Cũng như
  rationale: Mở đầu hình ảnh so sánh gắn với lời khuyên trước đó; cách diễn đạt này tự nhiên trong tiếng Việt mà không làm mất tính cô đọng của tiếng Hy Lạp.
- source_word: ἄνθρωπος ἀπόδημος
  choice: một người đi xa
  rationale: ἄνθρωπος chỉ nhân vật là một người, còn ἀπόδημος diễn tả người vắng nhà hoặc đi đến nơi xa; “đi xa” truyền đạt gọn cả hành trình lẫn sự vắng mặt.
- source_word: ἀφεὶς τὴν οἰκίαν αὐτοῦ
  choice: rời nhà mình
  rationale: Giữ nghĩa trực tiếp của động tính từ ἀφίημι và οἰκία, đồng thời dùng cấu trúc nối tiếp tự nhiên trong tiếng Việt.
- source_word: δοὺς τοῖς δούλοις αὐτοῦ τὴν ἐξουσίαν
  choice: trao quyền cho các đầy tớ
  rationale: ἐξουσία là quyền được chủ giao để hành động và trông coi. δοῦλοι chỉ những người lệ thuộc dưới quyền chủ trong gia hộ; “đầy tớ” là cách gọi trang trọng, dễ hiểu trong văn cảnh Kinh Thánh, còn địa vị nô lệ được nêu ở chú thích.
- source_word: ἑκάστῳ τὸ ἔργον αὐτοῦ
  choice: giao cho mỗi người công việc riêng
  rationale: Cụm Hy Lạp có tính tỉnh lược sau ý “trao quyền”; thêm động từ “giao” làm rõ quan hệ cú pháp vốn được hàm ý, còn “công việc riêng” giữ ý mỗi người có phần việc của mình.
- source_word: τῷ θυρωρῷ
  choice: người gác cửa
  rationale: Chỉ người canh giữ lối vào; “người gác cửa” là cách nói hiện đại, rõ nghĩa trong bối cảnh một ngôi nhà.
- source_word: ἐνετείλατο ἵνα γρηγορῇ
  choice: truyền ... phải tỉnh thức
  rationale: ἐνετείλατο mang sắc thái mệnh lệnh có thẩm quyền. γρηγορέω vừa có nghĩa thức, không ngủ, vừa mang nghĩa cảnh giác; “tỉnh thức” bảo toàn cả hình ảnh lẫn lời kêu gọi xuyên suốt diễn từ.
theological_decisions:
- issue: Cách dịch δοῦλος trong hình ảnh gia hộ
  choice: đầy tớ
  alternative: nô lệ; tôi tớ
  rationale: Trong thế giới Hy-La, δοῦλος biểu thị người thuộc địa vị nô lệ và ở dưới quyền chủ. Bản chính dùng “đầy tớ” để tự nhiên, trang trọng và dễ tiếp nhận trong tiếng Việt hiện đại, nhưng chú thích nói rõ thực trạng xã hội để tránh làm nhẹ nghĩa của từ.
- issue: Sắc thái của γρηγορέω
  choice: tỉnh thức
  alternative: thức canh; cảnh giác
  rationale: “Tỉnh thức” giữ được nghĩa đen là không ngủ và nghĩa mở rộng là luôn cảnh giác, không buộc người đọc chỉ chọn một sắc thái.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Câu giữ nhịp liệt kê của nguyên bản; dùng “tỉnh thức” để bảo toàn hình ảnh chủ đạo của phân đoạn.
