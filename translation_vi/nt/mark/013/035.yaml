id: MRK.13.35
reference: Mark 13:35
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: γρηγορεῖτε οὖν, οὐκ οἴδατε γὰρ πότε ὁ κύριος τῆς οἰκίας ἔρχεται, ⸀ἢ ὀψὲ ἢ ⸀μεσονύκτιον ἢ ἀλεκτοροφωνίας ἢ πρωΐ,
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/035.yaml
  text: 'Therefore stay awake[a], for you do not know when the master of the house is coming: whether in the evening, or at midnight, or at cockcrow[b], or in the morning.'
translation:
  language: vi
  text: 'Vậy, hãy tỉnh thức[a], vì anh em không biết khi nào chủ nhà sẽ đến: vào chiều tối, lúc nửa đêm, khi gà gáy[b], hay lúc sáng sớm.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “hãy canh thức.” Mệnh lệnh này mang ý duy trì sự tỉnh táo và cảnh giác.
    reason: lexical_alternative
  - marker: b
    text: “Khi gà gáy” chỉ phiên canh đêm gắn với tiếng gà gáy.
    reason: cultural_note
lexical_decisions:
- source_word: γρηγορεῖτε
  choice: hãy tỉnh thức
  rationale: Mệnh lệnh kêu gọi duy trì sự tỉnh táo và cảnh giác. “Tỉnh thức” tự nhiên trong văn phong Kinh Thánh tiếng Việt và bao hàm cả nghĩa thức canh lẫn sẵn sàng.
- source_word: οὖν
  choice: Vậy
  rationale: Biểu thị kết luận hoặc hệ quả từ lời dạy ngay trước đó; “Vậy” gọn và tự nhiên trong tiếng Việt hiện đại.
- source_word: οὐκ οἴδατε
  choice: anh em không biết
  rationale: Chuyển trực tiếp động từ biết ở thể phủ định, không thêm ý chắc chắn vốn không có trong nguyên văn.
- source_word: πότε
  choice: khi nào
  rationale: Cách diễn đạt tự nhiên cho câu hỏi gián tiếp về thời điểm.
- source_word: ὁ κύριος τῆς οἰκίας
  choice: chủ nhà
  rationale: Trong hình ảnh gia đình này, cụm từ chỉ người có quyền trên ngôi nhà. “Chủ nhà” rõ nghĩa, tự nhiên và không biến κύριος thành một tước hiệu thần học trực tiếp.
- source_word: ἔρχεται
  choice: sẽ trở về
  rationale: Thì hiện tại Hy Lạp mang ý tương lai theo ngữ cảnh về sự trở lại của chủ nhà. “Trở về” làm rõ việc người chủ quay lại nhà, phù hợp bối cảnh của dụ ngôn, dù động từ tự thân có nghĩa rộng là “đến”.
- source_word: ὀψὲ
  choice: vào chiều tối
  rationale: Trong chuỗi các phiên canh đêm, từ này chỉ khoảng canh đầu vào buổi tối hơn là nghĩa mơ hồ “muộn”.
- source_word: μεσονύκτιον
  choice: lúc nửa đêm
  rationale: Cách chỉ thời điểm trực tiếp, tự nhiên trong tiếng Việt.
- source_word: ἀλεκτοροφωνίας
  choice: khi gà gáy
  rationale: Diễn đạt dễ hiểu khoảng canh đêm được đánh dấu bằng tiếng gà gáy, đồng thời giữ nguyên hình ảnh cụ thể của tiếng Hy Lạp.
- source_word: πρωΐ
  choice: lúc sáng sớm
  rationale: Chỉ phiên canh cuối của đêm chuyển sang buổi sáng; “sáng sớm” tự nhiên và không xác định quá hẹp là đúng khoảnh khắc bình minh.
theological_decisions:
- issue: Cách dịch κύριος trong hình ảnh chủ gia đình có thể gián tiếp ám chỉ Chúa Giê-su
  choice: chủ nhà
  alternative: Chúa của ngôi nhà; người chủ của ngôi nhà
  rationale: Ngữ cảnh trực tiếp là hình ảnh một người có quyền trên gia đình và ngôi nhà. “Chủ nhà” giữ nghĩa thông thường của hình ảnh mà không phủ nhận hàm ý rộng hơn về Chúa Giê-su, đồng thời tránh áp đặt tước hiệu thần học vào chính cụm từ này.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh em” cho ngôi thứ hai số nhiều theo ngữ cảnh môn đồ. Nhịp liệt kê được giữ rõ, với các cách chỉ thời gian tự nhiên trong tiếng Việt.
