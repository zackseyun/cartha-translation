  text: καὶ τότε ὄψονται τὸν υἱὸν τοῦ ἀνθρώπου ἐρχόμενον ἐν νεφέλαις μετὰ δυνάμεως πολλῆς καὶ δόξης·
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/026.yaml
  text: And then they will see the Son of Man coming in the clouds with great power and glory[a].
translation:
  language: vi
  text: Bấy giờ, người ta sẽ thấy Con Người đến trong những đám mây, với quyền năng lớn lao và vinh quang.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đến cùng với những đám mây.” Tiếng Hy Lạp viết “trong những đám mây”; cách dịch kia có thể làm nổi bật âm hưởng của Đa-ni-ên 7:13.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὄψονται
  choice: người ta sẽ thấy
  rationale: Động từ ở ngôi thứ ba số nhiều nhưng không nêu chủ thể cụ thể; “người ta” tự nhiên trong tiếng Việt và không xác định thêm những người nhìn thấy.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: Con Người
  rationale: Giữ danh hiệu quen thuộc trong Kinh Thánh và âm hưởng Đa-ni-ên 7, thay vì diễn giải thành một cách gọi chung về con người.
- source_word: ἐρχόμενον
  choice: ngự đến
  rationale: Diễn đạt tự nhiên, trang trọng trong ngữ cảnh khải huyền và chỉ sự đến của Con Người, nhưng không giải thích thêm bản chất của biến cố.
- source_word: ἐν νεφέλαις
  choice: giữa những đám mây
  rationale: Phản ánh nghĩa trực tiếp của ἐν và số nhiều νεφέλαις bằng tiếng Việt tự nhiên; chú thích giữ cách hiểu “cùng với những đám mây” vốn làm nổi bật liên hệ với Đa-ni-ên 7:13.
- source_word: μετὰ δυνάμεως πολλῆς
  choice: với đại quyền năng
  rationale: μετά với sở hữu cách diễn tả sự đi kèm; “đại quyền năng” truyền đạt mức độ lớn và phù hợp văn phong Kinh Thánh trang trọng.
- source_word: καὶ δόξης
  choice: và vinh quang
  rationale: “Vinh quang” là cách tương ứng chuẩn của δόξα trong ngữ cảnh nói về uy nghi được bày tỏ.
theological_decisions:
- issue: Danh hiệu khải huyền và hình ảnh mây trời
  choice: Giữ “Con Người” và hình ảnh ngự đến giữa những đám mây mà không diễn giải trong chính văn.
  alternative: Dịch danh hiệu theo nghĩa khái quát hơn hoặc nói rõ đây là sự ứng nghiệm Đa-ni-ên 7.
  rationale: Câu này gợi mạnh đến Đa-ni-ên 7:13, nhưng bản dịch nên bảo tồn sự liên văn bản và sức căng Kitô học, cánh chung thay vì giải thích thay cho nguyên văn.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “Bấy giờ” cho καὶ τότε để nối mạch tự nhiên; dùng “ngự đến” nhằm giữ sắc thái uy nghi của cảnh khải huyền.
