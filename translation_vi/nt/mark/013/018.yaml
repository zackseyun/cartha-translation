  text: προσεύχεσθε δὲ ἵνα μὴ ⸀γένηται χειμῶνος·
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/018.yaml
  text: But pray that it may not happen in winter[a].
translation:
  language: vi
  text: Nhưng hãy cầu nguyện để điều đó không xảy ra vào mùa đông[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc, nói rõ hơn theo văn cảnh: “để việc anh em chạy trốn không xảy ra vào mùa đông.” Câu Hy Lạp trong Mác tỉnh lược hơn câu song song ở Ma-thi-ơ 24:20.'
    reason: alternative_reading
lexical_decisions:
- source_word: προσεύχεσθε
  choice: hãy cầu nguyện
  rationale: Động từ mệnh lệnh hiện tại, ngôi thứ hai số nhiều. Tiếng Việt không bắt buộc đánh dấu số nhiều ở đây; “hãy cầu nguyện” là tự nhiên và không diễn giải quá mức sắc thái thể của thì hiện tại.
- source_word: δὲ
  choice: Nhưng
  rationale: δέ là liên từ chuyển tiếp nhẹ, có thể mang sắc thái đối chiếu. “Nhưng” phù hợp với mạch cảnh báo ngay trước đó.
- source_word: ἵνα μὴ
  choice: để ... không
  rationale: Giới thiệu nội dung hoặc mục đích của lời cầu nguyện kèm phủ định. Cấu trúc “cầu nguyện để ... không” tự nhiên trong tiếng Việt hiện đại.
- source_word: γένηται
  choice: điều đó ... xảy ra
  rationale: Dạng giả định aorist của γίνομαι được dùng tỉnh lược, chỉ biến cố hoặc hoàn cảnh vừa được nói đến. “Điều đó ... xảy ra” giữ tính khái quát và tỉnh lược của bản Hy Lạp.
- source_word: χειμῶνος
  choice: vào mùa đông
  rationale: Sở hữu cách chỉ thời gian hoặc mùa, có chức năng trạng ngữ. “Vào mùa đông” là cách diễn đạt ngắn gọn, tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Nội dung ngầm hiểu làm chủ thể của γένηται
  choice: 'Giữ cách diễn đạt tỉnh lược: “điều đó không xảy ra”'
  alternative: “việc anh em chạy trốn không xảy ra” hoặc “anh em không phải chạy trốn”
  rationale: Bản Hy Lạp của Mác không nói rõ “việc chạy trốn của anh em,” khác với Ma-thi-ơ 24:20. Bản dịch vì thế không bổ sung lời từ đoạn song song, nhưng chú thích làm rõ điều có thể được ngầm hiểu theo văn cảnh.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Điều đó” bảo toàn tính tỉnh lược của nguyên văn; dấu chú thích [a] được đặt ngay sau cụm liên quan.
