- from: 'Khi Đức Giê-su đang ra khỏi khuôn viên đền thờ[a], một môn đồ nói với Ngài: “Thưa Thầy, xin xem kìa—những khối đá thật kỳ vĩ, những công trình thật tráng lệ!”[b]'
  to: 'Khi Đức Giê-su đang ra khỏi khuôn viên đền thờ[a], một môn đồ của Ngài nói với Ngài: “Thưa Thầy, xem kìa—những tảng đá thật kỳ vĩ, những công trình thật kỳ vĩ!”[b]'
