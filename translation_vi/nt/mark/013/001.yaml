  text: Καὶ ἐκπορευομένου αὐτοῦ ἐκ τοῦ ἱεροῦ λέγει αὐτῷ εἷς τῶν μαθητῶν αὐτοῦ· Διδάσκαλε, ἴδε ποταποὶ λίθοι καὶ ποταπαὶ οἰκοδομαί.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/001.yaml
  text: And as he was going out of the temple[a], one of his disciples says to him, “Teacher[b], look—what wonderful stones and what wonderful buildings!”
translation:
  language: vi
  text: 'Khi Đức Giê-su đang ra khỏi khuôn viên đền thờ[a], một môn đồ của Ngài nói với Ngài: “Thưa Thầy, xem kìa—những tảng đá thật kỳ vĩ, những công trình thật kỳ vĩ!”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hy Lạp ἱερόν chỉ toàn bộ khuôn viên hay quần thể đền thờ, không chỉ riêng thánh điện bên trong.
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “những tảng đá thật lớn lao, những công trình thật lớn lao!” Tính từ Hy Lạp diễn tả sự kinh ngạc hoặc thán phục.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκπορευομένου αὐτοῦ
  choice: Khi Đức Giê-su đang ra khỏi
  rationale: Cấu trúc sở hữu cách tuyệt đối với phân từ hiện tại diễn tả hành động đang diễn ra đồng thời; cách dịch này tự nhiên trong tiếng Việt và giữ được sắc thái tiếp diễn.
- source_word: τοῦ ἱεροῦ
  choice: khuôn viên đền thờ
  rationale: ἱερόν chỉ toàn bộ khu đền thờ, không riêng nơi thánh bên trong; dịch rõ nghĩa ngay trong câu để tránh hiểu hẹp.
- source_word: λέγει
  choice: nói
  rationale: Hiện tại lịch sử đặc trưng của lối kể sinh động trong Mác; tiếng Việt không biến đổi hình thái động từ theo thì nên “nói” vừa tự nhiên vừa không làm mất sắc thái nguồn.
- source_word: εἷς τῶν μαθητῶν αὐτοῦ
  choice: một môn đồ
  rationale: Diễn đạt trực tiếp cấu trúc bộ phận; “môn đồ” là từ trang trọng, quen thuộc và dễ hiểu trong văn cảnh Kinh Thánh.
- source_word: Διδάσκαλε
  choice: Thưa Thầy
  rationale: Dạng hô cách chỉ người dạy; “Thưa Thầy” thể hiện tự nhiên cả chức danh lẫn sắc thái xưng hô kính trọng.
- source_word: ἴδε
  choice: xin xem kìa
  rationale: Mệnh lệnh thức dùng để hướng sự chú ý; “xin xem kìa” tự nhiên, kính trọng và giữ sắc thái chỉ trỏ đầy kinh ngạc.
- source_word: ποταποὶ λίθοι
  choice: những khối đá thật kỳ vĩ
  rationale: ποταπός trong câu cảm thán bày tỏ sự kinh ngạc hoặc thán phục trước tính chất; “kỳ vĩ” truyền đạt cả quy mô lẫn ấn tượng, còn “khối đá” tự nhiên hơn “những viên đá” đối với đá xây đền cỡ lớn.
- source_word: ποταπαὶ οἰκοδομαί
  choice: những công trình thật tráng lệ
  rationale: οἰκοδομαί ở số nhiều chỉ các công trình kiến trúc; “tráng lệ” diễn đạt sự thán phục do ποταπός gợi lên mà không thu hẹp chỉ vào kích thước.
