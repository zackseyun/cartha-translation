translation:
  language: vi
  text: kẻo người ấy đến bất ngờ và thấy anh em đang ngủ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μὴ
  choice: kẻo
  rationale: Diễn đạt tự nhiên sắc thái cảnh báo và hậu quả cần tránh trong tiếng Việt.
- source_word: ἐλθὼν ἐξαίφνης
  choice: bất ngờ đến
  rationale: Giữ quan hệ phân từ 'đến' với trạng từ 'bất ngờ', đồng thời dùng trật tự từ tự nhiên trong tiếng Việt.
- source_word: εὕρῃ ὑμᾶς καθεύδοντας
  choice: thấy anh em đang ngủ
  rationale: Phản ánh trực tiếp cấu trúc 'thấy các anh em đang ngủ'; 'anh em' là đại từ số nhiều phù hợp với lời Đức Giê-su nói với các môn đồ.
theological_decisions:
- issue: Chủ thể ngôi thứ ba số ít của ἐλθὼν và εὕρῃ không được nêu danh trong câu này
  choice: người
  alternative: ông ấy / chủ nhà
  rationale: Dùng 'người' để nối tự nhiên với hình ảnh người chủ nhà trong văn cảnh gần mà không chèn một danh xưng thần học không có trong chính câu Hy Lạp.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu; giữ câu ngắn cùng sắc thái cảnh báo của nguyên văn.
