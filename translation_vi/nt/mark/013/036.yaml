  source_fidelity: 'Bản nháp truyền đạt đúng ý chính của μὴ ἐλθὼν ἐξαίφνης εὕρῃ ὑμᾶς καθεύδοντας: lời cảnh báo về việc chủ thể ngôi ba đến bất ngờ và thấy người nghe đang ngủ. Tuy nhiên, “người” không có yếu tố chỉ định trong tiếng Việt có thể bị hiểu là một người bất kỳ, trong khi chủ ngữ Hy Lạp là nhân vật đã được xác định theo văn cảnh (“he”).'
  naturalness: Câu ngắn gọn và tự nhiên. Đặt “bất ngờ” trước “đến” có thể hiểu được, nhưng “đến bất ngờ” bám sát hơn với ἐλθὼν ἐξαίφνης và vẫn rất tự nhiên.
  terminology: “kẻo” phù hợp sắc thái cảnh báo; “anh em” là cách xưng hô số nhiều thích hợp trong lời nói với các môn đồ; “đang ngủ” diễn đạt tốt phân từ hiện tại καθεύδοντας. “người ấy” giữ chủ ngữ xác định mà không thêm danh xưng thần học.
  issues:
