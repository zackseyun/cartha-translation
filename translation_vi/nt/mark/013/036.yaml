    issue: Chủ ngữ “người” thiếu tính chỉ định.
    rationale: Trong tiếng Việt hiện đại, “người” đơn độc dễ mang nghĩa bất định/generic. “Người ấy” phản ánh tốt hơn chủ ngữ ngôi ba xác định nhưng không được nêu tên trong câu Hy Lạp.
  - severity: low
    issue: Vị trí của “bất ngờ” hơi kém sát cấu trúc nguồn.
    rationale: “đến bất ngờ” liên kết trực tiếp trạng từ ἐξαίφνης với hành động “đến,” đồng thời giữ cách diễn đạt tự nhiên.
