  to: 'Nhiều người sẽ nhân danh tôi mà đến, nói rằng: “Tôi là người ấy,”[a] và họ sẽ dẫn nhiều người đi lạc.'
  rationale: Thay “Chính là tôi” bằng “Tôi là người ấy” để phản ánh động từ εἰμι rõ hơn và phù hợp với lời cảnh báo về những người tự nhận thân phận/địa vị thuộc về Chúa Giê-su. “Người ấy” chỉ là vị ngữ hàm ẩn theo ngữ cảnh, không xác định một danh hiệu; chú thích bảo lưu sự không nêu vị ngữ của tiếng Hy Lạp.
