source:
  edition: SBLGNT
  text: ⸀πολλοὶ ἐλεύσονται ἐπὶ τῷ ὀνόματί μου λέγοντες ὅτι Ἐγώ εἰμι, καὶ πολλοὺς πλανήσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/006.yaml
  text: Many will come in my name[a], saying, ‘I am he,’ and they will lead many astray.
translation:
  language: vi
  text: 'Nhiều người sẽ nhân danh tôi mà đến, nói rằng: “Tôi là người ấy,”[a] và họ sẽ dẫn nhiều người đi lạc.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay dịch sát chữ hơn: “Tôi là.” Tiếng Hy Lạp không nêu rõ vị ngữ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὶ
  choice: Nhiều người
  rationale: Tính từ số nhiều được dùng như danh từ, chỉ một số đông người; cách dịch này rõ ràng và tự nhiên trong tiếng Việt.
- source_word: ἐλεύσονται
  choice: sẽ ... đến
  rationale: Chuyển tải trực tiếp thì tương lai của ἔρχομαι; trật tự được điều chỉnh cho tự nhiên trong tiếng Việt.
- source_word: ἐπὶ τῷ ὀνόματί μου
  choice: nhân danh tôi
  rationale: Diễn đạt việc đến với danh nghĩa, thẩm quyền được tuyên bố, hoặc sự liên hệ tự nhận với Chúa Giê-su; “nhân danh tôi” là thành ngữ tiếng Việt tự nhiên và sát nghĩa.
- source_word: λέγοντες
  choice: nói rằng
  rationale: Giữ nghĩa trực tiếp của phân từ, trình bày lời nói đi kèm hành động đến mà không thêm sắc thái diễn giải như “tuyên bố” hay “mạo nhận”.
- source_word: ὅτι Ἐγώ εἰμι
  choice: Chính là tôi
  rationale: Tiếng Hy Lạp không nêu rõ vị ngữ. “Chính là tôi” là lời tự nhận diện tự nhiên trong tiếng Việt và không tự ý bổ sung một danh hiệu cụ thể; cách dịch sát mặt chữ hơn được ghi ở chú thích.
- source_word: πολλοὺς
  choice: nhiều người
  rationale: Là tân ngữ chỉ nhiều người; dịch đầy đủ giúp câu tiếng Việt rõ ràng.
- source_word: πλανήσουσιν
  choice: sẽ dẫn ... đi lạc
  rationale: Giữ hình ảnh khiến người khác rời khỏi đường đúng, đồng thời diễn đạt tự nhiên ý đánh lừa hoặc làm lầm lạc trong lời cảnh báo này.
theological_decisions:
- issue: Cách dịch Ἐγώ εἰμι trong bối cảnh những kẻ mạo nhận
  choice: Chính là tôi
  alternative: Tôi là
  rationale: Cụm từ có thể là một lời tự nhận diện với vị ngữ được hiểu ngầm, nhưng bản Hy Lạp không nói rõ danh hiệu hay vai trò nào. “Chính là tôi” giúp câu tự nhiên mà không xác định quá mức nội dung của lời tự nhận; chú thích bảo lưu cấu trúc sát mặt chữ và sự mơ hồ của nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “nhân danh” vì đây là thành ngữ quen thuộc; dùng “dẫn ... đi lạc” để giữ hình ảnh của πλανάω thay vì chỉ dịch khái quát là “lừa dối”.
