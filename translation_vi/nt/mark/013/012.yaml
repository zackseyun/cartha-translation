reference: Mark 13:12
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸂καὶ παραδώσει⸃ ἀδελφὸς ἀδελφὸν εἰς θάνατον καὶ πατὴρ τέκνον, καὶ ἐπαναστήσονται τέκνα ἐπὶ γονεῖς καὶ θανατώσουσιν αὐτούς·
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/012.yaml
  text: And brother will hand over brother to death[a], and a father his child[b], and children will rise up against parents and put them to death.
translation:
  language: vi
  text: Anh em sẽ nộp nhau để bị giết, cha sẽ nộp con mình để bị giết; con cái sẽ nổi lên chống lại cha mẹ và giết họ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'Cũng có thể dịch: “làm họ chết”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παραδώσει
  choice: sẽ nộp
  rationale: Động từ παραδίδωμι có nghĩa cơ bản là giao hoặc nộp một người cho nhà chức trách hay cho quyền lực khác. Trong bối cảnh bắt bớ, “nộp” giữ được hình ảnh cụ thể mà không mặc nhiên thu hẹp nghĩa thành cảm xúc phản bội.
- source_word: ἀδελφὸς ἀδελφὸν
  choice: anh em sẽ nộp nhau
  rationale: Cách diễn đạt này giữ quan hệ anh em ruột và sự lặp lại đầy sức nặng của nguyên văn, đồng thời tự nhiên hơn trong tiếng Việt so với việc lặp nguyên cụm danh từ số ít. “Nhau” cho thấy chính những người trong quan hệ anh em nộp lẫn nhau.
- source_word: εἰς θάνατον
  choice: để bị giết
  rationale: Cụm giới từ chỉ kết cục hoặc mục đích dẫn đến cái chết. “Để bị giết” diễn đạt rõ hậu quả trong tiếng Việt hiện đại mà không thêm chủ thể hành quyết.
- source_word: πατὴρ τέκνον
  choice: cha sẽ nộp con mình
  rationale: πατήρ chỉ người cha, còn τέκνον là con nói chung, không riêng con trai hay con gái. Thêm “mình” làm rõ quan hệ sở hữu vốn được ngữ cảnh Hy Lạp hàm ý.
- source_word: τέκνα
  choice: con cái
  rationale: τέκνα là số nhiều của τέκνον và chỉ con cái trong quan hệ gia đình; đây là cách nói tự nhiên, bao quát trong tiếng Việt.
- source_word: ἐπαναστήσονται ἐπὶ
  choice: sẽ nổi lên chống lại
  rationale: Cụm này diễn tả hành động đứng lên với thái độ thù địch. “Nổi lên chống lại” giữ được hình ảnh và mức độ mạnh của nguyên văn.
- source_word: γονεῖς
  choice: cha mẹ
  rationale: Danh từ số nhiều γονεῖς có nghĩa là cha mẹ; cách dịch này trực tiếp và tự nhiên.
- source_word: θανατώσουσιν αὐτούς
  choice: giết họ
  rationale: θανατόω có thể là giết hoặc xử tử. “Giết họ” rõ ràng, gọn và không áp đặt sắc thái tư pháp khi câu không nêu rõ phương thức hay cơ quan hành quyết.
theological_decisions:
- issue: Các từ chỉ quan hệ gia đình có và không có giới tính ngữ pháp cụ thể
  choice: Giữ “cha” cho πατήρ, dùng “con/con cái” và “cha mẹ” cho các từ Hy Lạp có phạm vi rộng hơn; dịch ἀδελφός bằng “anh em” theo quan hệ nam giới trong nguyên văn.
  alternative: Trung tính hóa toàn bộ thành “người thân”, “cha hoặc mẹ”, hoặc “con cái” trong mọi mệnh đề.
  rationale: Nguyên văn dùng từ cụ thể chỉ cha và anh/em trai ở hai mệnh đề đầu, nhưng dùng τέκνον/τέκνα và γονεῖς với phạm vi rộng hơn. Bản dịch duy trì sự phân biệt ấy mà không thêm một giới tính nơi nguyên văn không có.
- issue: Sắc thái của việc người thân giao nộp nhau
  choice: Dịch hành động cụ thể là “nộp”, đồng thời ghi “phản bội” như một khả năng theo ngữ cảnh.
  alternative: Dịch thẳng là “phản bội”.
  rationale: “Phản bội” làm nổi bật ý nghĩa luân lý và quan hệ, nhưng “nộp” giữ nghĩa hành động cơ bản của παραδίδωμι và để người đọc tự cảm nhận đầy đủ sức nặng của sự phản bội gia đình.
translation_notes:
  register: 'Văn phong hiện đại, trang trọng và dễ hiểu. Câu giữ nhịp tăng tiến của nguyên văn: anh em, cha với con, rồi con cái chống cha mẹ. Dấu chấm phẩy giúp phân định hai nửa câu mà không làm mất tính liên tục. Các ký hiệu [a] và [b] đều được đặt ngay sau từ ngữ mà chú thích giải thích.'
