source:
  edition: SBLGNT
  text: καὶ οἱ ἀστέρες ⸂ἔσονται ἐκ τοῦ οὐρανοῦ πίπτοντες⸃, καὶ αἱ δυνάμεις αἱ ἐν τοῖς οὐρανοῖς σαλευθήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/025.yaml
  text: And the stars will be falling from heaven[b][a], and the powers in the heavens will be shaken.
translation:
  language: vi
  text: Các ngôi sao sẽ từ trời[a] rơi xuống, và các quyền lực trong các tầng trời[b] sẽ bị lay chuyển.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “từ bầu trời”. Từ Hy Lạp οὐρανός có thể chỉ “trời” theo nghĩa thiên giới hoặc “bầu trời”, tùy văn cảnh.
    reason: lexical_alternative
  - marker: b
    text: “Các quyền lực trong các tầng trời” có thể chỉ các quyền lực thiên giới, các lực vũ trụ, hoặc những cấu trúc của các tầng trời; tiếng Hy Lạp không nói cụ thể hơn.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀστέρες
  choice: các ngôi sao
  rationale: Nghĩa thiên văn thông thường phù hợp với bối cảnh khải huyền và vũ trụ của câu.
- source_word: ἔσονται ... πίπτοντες
  choice: sẽ ... rơi xuống
  rationale: Diễn đạt tự nhiên hành động trong tương lai bằng tiếng Việt. Cấu trúc vị lai kết hợp phân từ trong tiếng Hy Lạp làm hành động trở nên sống động và có thể gợi tiến trình đang diễn ra; dịch sát kiểu “sẽ đang rơi” không tự nhiên trong tiếng Việt.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: từ trời
  rationale: Giữ sắc thái cao trọng và tầm vóc vũ trụ của văn cảnh; “bầu trời” vẫn là một khả năng từ vựng nên được nêu trong chú thích.
- source_word: δυνάμεις
  choice: các quyền lực
  rationale: Giữ cách gọi khái quát, không quyết định đây là các hữu thể thiên giới, các lực vũ trụ hay cấu trúc của các tầng trời.
- source_word: αἱ ἐν τοῖς οὐρανοῖς
  choice: trên các tầng trời
  rationale: Phản ánh dạng số nhiều của τοῖς οὐρανοῖς và duy trì phạm vi vũ trụ; “các tầng trời” là cách diễn đạt trang trọng nhưng vẫn dễ hiểu trong tiếng Việt.
- source_word: σαλευθήσονται
  choice: sẽ bị lay chuyển
  rationale: Truyền đạt trực tiếp thể bị động tương lai và hình ảnh rung chuyển dữ dội, đồng thời tự nhiên hơn “sẽ bị rung lắc” trong văn phong Kinh Thánh.
theological_decisions:
- issue: Ý nghĩa của “các quyền lực trên các tầng trời”
  choice: Dịch khái quát là “các quyền lực trên các tầng trời”, không xác định bản chất của chúng.
  alternative: “các quyền năng thiên giới” (nghiêng về các hữu thể thiên giới) hoặc “các lực của tầng trời” (nghiêng về lực hay cấu trúc vũ trụ).
  rationale: Cụm từ Hy Lạp có phạm vi nghĩa rộng trong văn cảnh khải huyền. Bản dịch giữ nguyên sự mơ hồ thay vì áp đặt một cách giải thích thần học cụ thể.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Trật tự “từ trời ... rơi xuống” giữ điểm xuất phát nổi bật như nguyên văn. Dùng “các tầng trời” để thể hiện số nhiều trong tiếng Hy Lạp mà không giải thích thêm về cấu trúc vũ trụ.
