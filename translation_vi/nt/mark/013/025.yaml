review_pass:
  verdict: revise
  source_fidelity: 'Bản nháp truyền đạt đúng các yếu tố chính: các ngôi sao rơi xuống từ trời và các quyền lực bị lay chuyển. Tuy nhiên, “trên các tầng trời” dịch giới từ ἐν ("trong") chưa chính xác; đồng thời “các tầng trời” trong bản văn chính dễ gợi một mô hình các tầng vũ trụ hơn mức tiếng Hy Lạp xác định.'
  naturalness: “Các ngôi sao sẽ từ trời rơi xuống” là cách nói tự nhiên, trang trọng và vẫn giữ được phần nào sắc thái tiến trình của cấu trúc vị lai với phân từ. “Các quyền lực trong các tầng trời” hơi trang trọng nhưng phù hợp văn cảnh khải huyền và rõ nghĩa hơn về quan hệ không gian.
  terminology: “Các quyền lực” giữ đúng sự mơ hồ của δυνάμεις, không đồng nhất chúng với thiên sứ, thiên thể, hay lực vật lý. “Các tầng trời” được giữ để phản ánh số nhiều τοῖς οὐρανοῖς, nhưng giới từ phải là “trong”. Chú thích cần diễn đạt rằng đây là các khả năng quy chiếu, không khẳng định một cách giải thích.
  issues:
