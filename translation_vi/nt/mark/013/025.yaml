revisions:
- from: Các ngôi sao sẽ từ trời[a] rơi xuống, và các quyền lực trên các tầng trời[b] sẽ bị lay chuyển.
  to: Các ngôi sao sẽ từ trời[a] rơi xuống, và các quyền lực trong các tầng trời[b] sẽ bị lay chuyển.
  rationale: Chỉ sửa giới từ “trên” thành “trong” để phản ánh chính xác ἐν τοῖς οὐρανοῖς. Các lựa chọn còn lại được giữ vì vừa tự nhiên trong tiếng Việt hiện đại vừa bảo toàn tính khái quát và mơ hồ có chủ ý của nguyên văn.
  reviewer_model: gpt-5.6-terra
