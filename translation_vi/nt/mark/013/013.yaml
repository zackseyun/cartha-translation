source:
  edition: SBLGNT
  text: καὶ ἔσεσθε μισούμενοι ὑπὸ πάντων διὰ τὸ ὄνομά μου. ὁ δὲ ὑπομείνας εἰς τέλος οὗτος σωθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/013.yaml
  text: And you will be hated by all because of my name[d][c][b][a]. But the one who endures to the end will be saved.
translation:
  language: vi
  text: Anh em sẽ bị mọi người thù ghét vì danh tôi. Nhưng ai bền lòng đến cùng[a] thì người ấy sẽ được cứu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Bền lòng” cũng có thể dịch là “kiên trì” hoặc “đứng vững cho đến cùng.”
    reason: lexical_alternative
  - marker: b
    text: “Được cứu” cũng có thể dịch là “được giải cứu.” Từ Hy Lạp có thể chỉ sự giải thoát hoặc sự cứu rỗi; ngữ cảnh không khép lại toàn bộ sắc thái.
    reason: alternative_reading
lexical_decisions:
- source_word: μισούμενοι ὑπὸ πάντων
  choice: bị mọi người thù ghét
  rationale: Cụm phân từ kết hợp với ἔσεσθε diễn đạt ý tương lai; cách dịch này tự nhiên trong tiếng Việt và giữ nguyên tính bao quát mạnh của πάντων.
- source_word: διὰ τὸ ὄνομά μου
  choice: vì danh tôi
  rationale: διά với đối cách nêu nguyên nhân. “Vì danh tôi” vừa gọn, vừa giữ cách nói Kinh Thánh, trong đó “danh” đại diện cho chính con người, thẩm quyền và sự gắn bó với Chúa Giê-su.
- source_word: ὁ δὲ ὑπομείνας εἰς τέλος
  choice: Nhưng ai bền lòng đến cùng
  rationale: “Bền lòng” diễn đạt việc đứng vững và tiếp tục chịu đựng dưới áp lực; “đến cùng” giữ nguyên sự không xác định về điểm cuối là hết cơn thử thách, hết đời người hay thời kỳ cuối cùng.
- source_word: οὗτος
  choice: thì người ấy
  rationale: Kết cấu “ai… thì người ấy…” tự nhiên trong tiếng Việt và vẫn thể hiện chức năng nhấn mạnh, hồi chỉ của οὗτος.
- source_word: σωθήσεται
  choice: sẽ được cứu
  rationale: Cách dịch này giữ được cả sắc thái giải cứu lẫn ý nghĩa cứu rỗi rộng hơn của σῴζω, không thu hẹp câu vào một cách hiểu thần học riêng.
theological_decisions:
- issue: Ý nghĩa của σωθήσεται trong lời dạy về sự bền lòng
  choice: sẽ được cứu
  alternative: sẽ được giải cứu
  rationale: Ngữ cảnh liên kết việc bền lòng giữa sự bắt bớ với sự cứu rỗi chung cuộc, nhưng nguyên văn không buộc phải giới hạn vào sự giải thoát tạm thời hoặc một học thuyết hệ phái cụ thể.
- issue: Phạm vi của πάντων
  choice: mọi người
  alternative: tất cả
  rationale: Giữ nguyên lối diễn đạt bao quát của nguyên văn mà không tự ý thêm điều kiện hạn chế; ngữ cảnh quyết định cách hiểu tính phổ quát này.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “anh em” để diễn đạt ngôi thứ hai số nhiều trong lời Chúa Giê-su nói với các môn đồ; giữ “danh tôi” vì đây là thành ngữ Kinh Thánh quen thuộc và giàu ý nghĩa. Kết cấu “ai… thì người ấy…” bảo toàn sự nhấn mạnh của nguyên văn mà vẫn tự nhiên.
