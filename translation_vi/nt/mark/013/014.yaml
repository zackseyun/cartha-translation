id: MRK.13.14
reference: Mark 13:14
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ὅταν δὲ ἴδητε τὸ βδέλυγμα τῆς ἐρημώσεως ⸀ἑστηκότα ὅπου οὐ δεῖ, ὁ ἀναγινώσκων νοείτω, τότε οἱ ἐν τῇ Ἰουδαίᾳ φευγέτωσαν εἰς τὰ ὄρη,
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/014.yaml
  text: But when you see the abomination of desolation standing where it ought not to be (let the reader understand)[a], then let those in Judea flee to the mountains[b],
translation:
  language: vi
  text: Nhưng khi anh em thấy “điều ghê tởm của sự hoang tàn” đứng ở nơi không nên đứng (người đọc hãy hiểu)[a], thì những người ở Giu-đê hãy chạy trốn lên vùng núi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Trong tiếng Hy Lạp, từ được dịch là “đứng” có dạng giống đực, dù “điều ghê tởm” là giống trung; điều này có thể gợi đến một nhân vật đứng sau “điều ghê tởm”. Vì vậy, câu cũng có thể được hiểu là: “đứng ở nơi người ấy không nên đứng.”'
    reason: alternative_reading
  - marker: b
    text: Cụm từ “điều ghê tởm của sự hoang tàn” vọng lại ngôn ngữ trong sách Đa-ni-ên (xem Đa-ni-ên 9:27; 11:31; 12:11).
    reason: cross_reference
lexical_decisions:
- source_word: Ὅταν δὲ
  choice: Nhưng khi
  rationale: Ὅταν mở đầu một tình huống theo thời gian, còn δέ là từ nối nhẹ; “Nhưng khi” nối tiếp lời cảnh báo trước đó mà không tạo sự tương phản quá mạnh.
- source_word: ἴδητε
  choice: anh em thấy
  rationale: Động từ ở ngôi thứ hai số nhiều; “anh em” thể hiện rõ đối tượng số nhiều và phù hợp với lối diễn đạt trang trọng, tự nhiên trong lời Chúa Giê-su nói với các môn đồ.
- source_word: τὸ βδέλυγμα τῆς ἐρημώσεως
  choice: “điều ghê tởm của sự hoang tàn”
  rationale: Giữ cấu trúc gần nguyên ngữ và âm hưởng ám chỉ sách Đa-ni-ên, không xác định đó là một vật, hành động hay nhân vật, cũng không diễn giải quan hệ sở hữu cách thành quan hệ nguyên nhân.
- source_word: ἑστηκότα
  choice: đứng
  rationale: Phân từ hoàn thành của ἵστημι diễn tả trạng thái đang hiện hữu do một hành động trước đó; “đứng” giữ hình ảnh sống động và tránh diễn giải thành “được dựng lên”.
- source_word: ὅπου οὐ δεῖ
  choice: ở nơi không nên đứng
  rationale: Cách nói không dùng đại từ cho chủ thể, nhờ đó tự nhiên trong tiếng Việt và không buộc phải chọn “nó” hay “hắn/người ấy” trước chỗ mơ hồ của nguyên ngữ.
- source_word: ὁ ἀναγινώσκων νοείτω
  choice: người đọc hãy hiểu
  rationale: Giữ nguyên lời nhắc xen giữa câu; “hãy hiểu” truyền đạt trực tiếp sắc thái mệnh lệnh của νοείτω.
- source_word: τότε
  choice: thì
  rationale: Trong kết cấu “khi… thì…”, “thì” đánh dấu tự nhiên hệ quả phải thực hiện sau khi dấu hiệu xuất hiện.
- source_word: οἱ ἐν τῇ Ἰουδαίᾳ
  choice: những người ở Giu-đê
  rationale: Cách dịch ngắn gọn, tự nhiên và giữ nguyên địa danh cụ thể.
- source_word: φευγέτωσαν
  choice: hãy chạy trốn
  rationale: “Hãy” giữ lực mệnh lệnh khẩn cấp của động từ mệnh lệnh ngôi thứ ba số nhiều; “chạy trốn” diễn đạt đầy đủ ý φεύγω.
- source_word: εἰς τὰ ὄρη
  choice: lên vùng núi
  rationale: “Vùng núi” là cách nói tiếng Việt tự nhiên cho dạng số nhiều τὰ ὄρη, còn “lên” phù hợp với hướng di chuyển đến địa hình cao.
theological_decisions:
- issue: Cách hiểu cụm từ trong sách Đa-ni-ên βδέλυγμα τῆς ἐρημώσεως
  choice: 'Giữ cách nói gần nguyên ngữ: “điều ghê tởm của sự hoang tàn”, không xác định đối tượng lịch sử trong chính văn.'
  alternative: “điều ghê tởm gây nên sự hoang tàn” hoặc “sự phạm thánh gây hoang tàn”
  rationale: Đối tượng có thể được hiểu là một vật, hành động hoặc nhân vật phạm thánh. Bản dịch giữ sức gợi liên văn bản và sự chưa xác định của câu thay vì giải quyết vấn đề diễn giải.
- issue: Phân từ giống đực ἑστηκότα đi với danh từ giống trung βδέλυγμα
  choice: Dịch “đứng ở nơi không nên đứng”, không dùng đại từ mang giới tính trong chính văn, đồng thời ghi chú đặc điểm giống đực của tiếng Hy Lạp.
  alternative: “đứng ở nơi người ấy không nên đứng” hoặc “đứng ở nơi nó không nên đứng”
  rationale: Ngữ pháp Hy Lạp có độ căng đáng chú ý và có thể gợi đến một nhân vật đứng sau danh từ giống trung. Tiếng Việt cho phép giữ tự nhiên mà không phải chọn trước một cách hiểu; chú thích bảo tồn dữ kiện có ý nghĩa của nguyên ngữ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Anh em” làm rõ ngôi thứ hai số nhiều; “Giu-đê” và “Đa-ni-ên” theo dạng tên quen thuộc trong tiếng Việt. Dấu ngoặc giữ lời nhắc dành cho người đọc, còn dấu ngoặc kép đánh dấu cụm từ khải huyền mang tính liên văn bản.
