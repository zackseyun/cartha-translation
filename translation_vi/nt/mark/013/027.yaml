id: MRK.13.27
reference: Mark 13:27
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ τότε ἀποστελεῖ τοὺς ⸀ἀγγέλους καὶ ἐπισυνάξει τοὺς ⸀ἐκλεκτοὺς ἐκ τῶν τεσσάρων ἀνέμων ἀπ’ ἄκρου γῆς ἕως ἄκρου οὐρανοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/027.yaml
  text: And then he will send out the angels and gather the chosen ones from the four winds[c][b][a], from the end of the earth to the end of heaven.
translation:
  language: vi
  text: Bấy giờ, Ngài sẽ sai các thiên sứ đi và quy tụ những người được chọn[a] từ bốn hướng gió[b], từ tận cùng đất đến tận cùng trời[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch theo cách truyền thống là “những người được tuyển chọn”.
    reason: lexical_alternative
  - marker: b
    text: “Bốn hướng gió” là cách nói chỉ mọi phương hướng, tức là từ khắp nơi.
    reason: cultural_note
  - marker: c
    text: Cụm cuối cũng có thể được diễn ý là “từ nơi xa nhất trên đất đến nơi xa nhất trên trời” hoặc “từ đầu này của trời đến đầu kia”.
    reason: alternative_reading
lexical_decisions:
- source_word: τότε
  choice: bấy giờ
  rationale: Diễn tả mốc thời gian và trình tự trong lời giảng về thời kỳ cuối cùng; tự nhiên và trang trọng trong tiếng Việt.
- source_word: ἀποστελεῖ
  choice: sẽ sai ... đi
  rationale: Thể tương lai và ý nghĩa sai phái được thể hiện rõ; “đi” làm câu tiếng Việt tự nhiên mà không thêm một hành động riêng.
- source_word: ἀγγέλους
  choice: các thiên sứ
  rationale: Trong bối cảnh khải huyền này, từ ngữ chỉ các hữu thể thiên thượng chứ không phải sứ giả loài người.
- source_word: ἐπισυνάξει
  choice: quy tụ
  rationale: Diễn đạt hành động tập hợp về một nơi, đồng thời giữ sắc thái trang trọng và tránh cách nói dư “tụ họp lại”.
- source_word: ἐκλεκτούς
  choice: những người được chọn
  rationale: Tính từ được dùng như danh từ, chỉ những người được chọn; cách dịch này rõ nghĩa và không biến từ ngữ thành thuật ngữ riêng của một hệ thống thần học về sau.
- source_word: ἐκ τῶν τεσσάρων ἀνέμων
  choice: từ bốn hướng gió
  rationale: Giữ hình ảnh “gió” và con số bốn của nguyên ngữ, trong khi “hướng” giúp độc giả tiếng Việt nhận ra ý nghĩa không gian.
- source_word: ἀπ’ ἄκρου γῆς ἕως ἄκρου οὐρανοῦ
  choice: từ tận cùng đất đến tận cùng trời
  rationale: Giữ cấu trúc song song và hình ảnh chỉ toàn bộ phạm vi; “trời” ở đây mang nghĩa không gian nhưng không ép câu vào một cách giải thích giáo lý.
- source_word: καὶ τότε ... καὶ
  choice: Bấy giờ ... và
  rationale: “Và” nối hai hành động sai phái và quy tụ; không nhất thiết giữ liên từ đầu câu vì “Bấy giờ” đã tạo dòng tiếp nối tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Cách dịch ἐκλεκτούς trong bối cảnh thời kỳ cuối cùng
  choice: những người được chọn
  alternative: những người được tuyển chọn
  rationale: Giữ ý họ là những người được chọn nhưng không xác định thêm ai chọn, tiêu chuẩn lựa chọn hay một hệ thống tiền định mà câu Hy Lạp không trình bày.
- issue: Phạm vi của việc quy tụ
  choice: từ bốn hướng gió, từ tận cùng đất đến tận cùng trời
  alternative: từ khắp bốn phương, từ đầu này của trời đến đầu kia
  rationale: Bản dịch chính bảo tồn hai hình ảnh của nguyên ngữ—bốn luồng gió và hai điểm tận cùng đất/trời—thay vì hòa chúng thành một lối diễn giải quen thuộc nhưng kém sát cấu trúc nguồn.
- issue: Chủ thể ẩn trong động từ ἀποστελεῖ
  choice: Ngài
  alternative: Con Người
  rationale: Nguyên ngữ không lặp lại danh xưng “Con Người” mà dựa vào ngữ cảnh trước đó. Đại từ “Ngài” giữ sự liên kết ấy mà không chèn lại một danh xưng không có trong câu này.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Câu giữ hình ảnh khải huyền của nguyên ngữ, tránh từ cổ khó hiểu và không giải thích quá mức ngay trong chính văn. Các dấu chú thích [a], [b], [c] đều được đặt ngay sau cụm từ liên quan.
