  text: Εἰπὸν ἡμῖν πότε ταῦτα ἔσται, καὶ τί τὸ σημεῖον ὅταν μέλλῃ ⸂ταῦτα συντελεῖσθαι πάντα⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/004.yaml
  text: Tell us[a], when will these things be, and what will be the sign when all these things are about to be accomplished?
translation:
  language: vi
  text: '“Xin cho chúng tôi biết: Khi nào những điều này sẽ xảy ra, và dấu hiệu nào cho biết khi tất cả những điều này sắp được hoàn tất?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “khi tất cả những điều này được hoàn tất.” Động từ Hy Lạp μέλλω đi với động từ nguyên mẫu có thể nhấn mạnh ý sự việc sắp xảy ra.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰπὸν ἡμῖν
  choice: Xin Thầy cho chúng con biết
  rationale: Diễn đạt tự nhiên lời thỉnh cầu trực tiếp với Đức Chúa Jêsus; “xin” thể hiện sắc thái cầu khiến lịch sự, còn “cho chúng con biết” chuyển tải động từ λέγω cùng bổ ngữ gián tiếp ἡμῖν.
- source_word: πότε ταῦτα ἔσται
  choice: Khi nào những điều ấy sẽ xảy ra
  rationale: “Khi nào” tương ứng với πότε; trong ngữ cảnh biến cố được báo trước, “sẽ xảy ra” là tiếng Việt tự nhiên hơn cách dịch sát chữ “sẽ là” mà không thay đổi nội dung.
- source_word: τί τὸ σημεῖον
  choice: có dấu hiệu gì
  rationale: Cách hỏi tự nhiên trong tiếng Việt, giữ nghĩa của σημεῖον là dấu hiệu nhận biết một biến cố.
- source_word: ὅταν μέλλῃ
  choice: báo rằng ... sắp
  rationale: ὅταν mở đầu mệnh đề thời gian gắn với “dấu hiệu”; tiếng Việt dùng “báo rằng” làm rõ quan hệ tự nhiên giữa dấu hiệu và điều nó chỉ báo. “Sắp” giữ sắc thái sắp xảy đến của μέλλω.
- source_word: ταῦτα συντελεῖσθαι πάντα
  choice: tất cả những điều ấy ... được hoàn tất
  rationale: Giữ phạm vi của πάντα, đối tượng số nhiều ταῦτα và sắc thái bị động, đạt đến chỗ hoàn thành của συντελεῖσθαι.
theological_decisions:
- issue: Sắc thái cánh chung của μέλλῃ với động từ nguyên mẫu
  choice: Giữ sắc thái cận kề bằng “sắp được hoàn tất”
  alternative: “sẽ được hoàn tất”
  rationale: μέλλω với động từ nguyên mẫu mang ý nghĩa hướng tới hoặc sắp diễn ra. Bản dịch giữ sắc thái ấy nhưng không suy diễn một hệ thống niên đại cánh chung.
- issue: Ý nghĩa của συντελεῖσθαι
  choice: “được hoàn tất”
  alternative: “được ứng nghiệm” hoặc “đi đến tận cùng”
  rationale: “Được hoàn tất” giữ nét nghĩa hoàn thành và thể bị động mà không tự ý giới hạn động từ vào sự ứng nghiệm lời tiên tri hay sự kết thúc toàn bộ thế giới.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Thầy” và “chúng con” phù hợp với lời các môn đồ thưa cùng Đức Chúa Jêsus. Dấu hai chấm giúp phân định lời yêu cầu với hai câu hỏi đi sau.
