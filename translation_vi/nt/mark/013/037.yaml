  source_fidelity: 'Bản dịch giữ đúng cấu trúc trọng tâm của câu: điều nói với nhóm người nghe trực tiếp được nói cho mọi người, và mệnh lệnh số nhiều συνεχ diễn γρηγορεῖτε được diễn đạt thích hợp bằng “Hãy tỉnh thức.” Tuy nhiên, “cũng” không có từ tương ứng trực tiếp trong nguyên văn và không cần thiết để tiếng Việt rõ nghĩa.'
  naturalness: Câu văn trang trọng, hiện đại và dễ hiểu. “Anh em” phù hợp với ngữ cảnh Đức Giê-su nói với các môn đồ; “tất cả mọi người” diễn đạt tự nhiên phạm vi πᾶσιν. Bỏ “cũng” làm câu gọn hơn mà vẫn giữ phép lặp tu từ.
  terminology: “Tỉnh thức” là cách dùng Kinh Thánh tiếng Việt tự nhiên, vừa bảo lưu hình ảnh không ngủ vừa truyền đạt ý canh chừng/cảnh giác. Chú thích nêu các phương án thay thế hợp lệ; “canh thức” có tính văn chương hơn nhưng vẫn hiểu được.
  issues:
