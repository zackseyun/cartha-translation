  yaml_path: translation/nt/mark/013/037.yaml
  text: 'And what I say to you I say to all: stay awake[a].'
translation:
  language: vi
  text: 'Điều tôi nói với anh em, tôi nói với tất cả mọi người: Hãy tỉnh thức.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “Hãy canh thức” hoặc “Hãy cảnh giác.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃ
  choice: Điều
  rationale: Đại từ quan hệ trung tính số ít được dùng như danh từ; “Điều” diễn đạt tự nhiên ý khái quát, hồi chỉ của câu.
- source_word: δὲ
  choice: không dịch thành từ riêng
  rationale: δέ chỉ liên kết nhẹ với lời trước; trong tiếng Việt, mạch nối đã rõ và thêm “và” ở đầu câu sẽ kém tự nhiên.
- source_word: ὑμῖν
  choice: với anh em
  rationale: Đại từ ngôi hai số nhiều trước hết chỉ các môn đồ đang nghe; “anh em” giữ được số nhiều và sắc thái xưng hô trang trọng, gần gũi.
- source_word: λέγω ... λέγω
  choice: tôi nói ... tôi cũng nói
  rationale: Giữ phép lặp của nguyên văn; “cũng” làm rõ sự mở rộng từ những người đang nghe đến tất cả mọi người mà không thay đổi ý.
- source_word: πᾶσιν
  choice: với tất cả mọi người
  rationale: Diễn đạt rõ phạm vi bao quát của dạng số nhiều πᾶσιν trong tiếng Việt tự nhiên.
- source_word: γρηγορεῖτε
  choice: Hãy tỉnh thức
  rationale: Mệnh lệnh hiện tại số nhiều đòi hỏi sự cảnh giác liên tục; “tỉnh thức” giữ được hình ảnh thức tỉnh và ý nghĩa cảnh giác trong văn cảnh.
theological_decisions:
- issue: Phạm vi lời khuyên dạy của Đức Giê-su
  choice: Lời nói trực tiếp với các môn đồ được mở rộng rõ ràng đến tất cả mọi người.
  alternative: Có thể hiểu lời này chỉ áp dụng cho những người đang trực tiếp nghe trong trình thuật.
  rationale: Nguyên văn đối chiếu ὑμῖν (“với anh em”) với πᾶσιν (“với tất cả”), nên bản dịch giữ nguyên sức mở rộng phổ quát mà không thu hẹp đối tượng.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Câu giữ phép lặp tu từ của nguyên văn và dùng “tỉnh thức” theo nghĩa vừa thức vừa luôn cảnh giác.
