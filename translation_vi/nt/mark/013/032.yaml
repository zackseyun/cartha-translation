source:
  edition: SBLGNT
  text: Περὶ δὲ τῆς ἡμέρας ἐκείνης ἢ ⸀τῆς ὥρας οὐδεὶς οἶδεν, οὐδὲ οἱ ἄγγελοι ⸀ἐν οὐρανῷ οὐδὲ ὁ υἱός, εἰ μὴ ὁ πατήρ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/032.yaml
  text: But concerning that day or hour[a], no one knows—not even the angels in heaven, nor the Son, but only the Father.
translation:
  language: vi
  text: Nhưng về ngày ấy hay giờ ấy[a], không ai biết; ngay cả các thiên sứ ở trên trời cũng không biết, Con cũng không biết; chỉ có Cha biết.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Một số nhà giải nghĩa hiểu lời “Con cũng không biết” trong mối liên hệ với sứ mạng nhập thể hoặc nhân tính của Con; bản dịch giữ nguyên lời văn Hy Lạp mà không đưa cách giải thích ấy vào chính văn.
    reason: lexical_alternative
lexical_decisions:
- source_word: Περὶ δὲ
  choice: Nhưng về
  rationale: περί với sở hữu cách nêu chủ đề “về”, còn δέ đánh dấu sự chuyển ý hoặc tương phản nhẹ; “Nhưng về” giữ được cả hai sắc thái một cách tự nhiên.
- source_word: τῆς ἡμέρας ἐκείνης ἢ τῆς ὥρας
  choice: ngày hay giờ ấy
  rationale: Cụm này chỉ thời điểm đang được nói đến, gồm phạm vi rộng hơn là “ngày” và cụ thể hơn là “giờ”. Đặt “ấy” sau cả cặp là tự nhiên trong tiếng Việt và có thể quy chiếu cho cả hai danh từ.
- source_word: οὐδεὶς οἶδεν
  choice: không ai biết
  rationale: οὐδείς là đại từ phủ định, còn οἶδα tuy có hình thái hoàn thành nhưng thường mang nghĩa hiện tại “biết”; cách dịch này chính xác và thông dụng.
- source_word: οὐδὲ οἱ ἄγγελοι ἐν οὐρανῷ
  choice: ngay cả các thiên sứ trên trời cũng không
  rationale: οὐδέ tiếp tục và nhấn mạnh sự phủ định; cấu trúc “ngay cả... cũng không” diễn đạt rõ sức tăng tiến. ἐν οὐρανῷ được hiểu theo nghĩa vị trí, bổ nghĩa cho các thiên sứ.
- source_word: οὐδὲ ὁ υἱός
  choice: Con cũng không
  rationale: οὐδέ tiếp tục chuỗi phủ định. “Con” giữ nguyên tước hiệu mang tính Kitô học trong văn cảnh; “cũng không” diễn đạt trực tiếp mà không làm nhẹ phát biểu Hy Lạp.
- source_word: εἰ μὴ ὁ πατήρ
  choice: chỉ một mình Cha biết
  rationale: Sau mệnh đề phủ định, εἰ μή nêu ngoại lệ duy nhất. Cách diễn đạt này tự nhiên trong tiếng Việt và làm rõ tính độc nhất; động từ “biết” được lặp lại để câu hoàn chỉnh, dễ hiểu.
theological_decisions:
- issue: Phát biểu Kitô học rằng Con không biết ngày hay giờ
  choice: Giữ nguyên ý trực tiếp “Con cũng không”, không thêm lời giải thích vào chính văn.
  alternative: Thêm các giới hạn diễn giải như “xét theo nhân tính” hoặc “trong sứ mạng nhập thể”.
  rationale: Bản Hy Lạp ghi rõ οὐδὲ ὁ υἱός. Để tôn trọng chứng cứ nguyên ngữ và giữ nguyên sức căng thần học, bản dịch không tự ý dung hòa hoặc bổ sung một cách giải thích giáo lý vào chính văn.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “thiên sứ” cho ἄγγελοι; viết hoa “Con” và “Cha” vì đây là các tước hiệu trong văn cảnh. Cấu trúc phủ định tăng tiến được giữ rõ, đồng thời câu được điều chỉnh theo cú pháp tiếng Việt tự nhiên.
