  text: ὁ δὲ Ἰησοῦς ⸂ἤρξατο λέγειν αὐτοῖς⸃· Βλέπετε μή τις ὑμᾶς πλανήσῃ·
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/005.yaml
  text: Then Jesus began to say to them[a], “See to it that no one leads you astray.”
translation:
  language: vi
  text: 'Đức Giê-su bắt đầu nói với họ: “Hãy coi chừng, đừng để ai dẫn anh em đi lạc.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Hãy cảnh giác, kẻo có ai lừa dối anh em.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: không dịch riêng
  rationale: δέ là từ nối nhẹ trong mạch kể. Tiếng Việt không cần biểu thị bằng một từ riêng ở đây; lược đi giúp câu tự nhiên mà không làm mất ý tương phản đáng kể.
- source_word: ἤρξατο λέγειν
  choice: bắt đầu nói
  rationale: Giữ sát cấu trúc Hy Lạp và lối kể đặc trưng của Mác, đồng thời vẫn tự nhiên trong tiếng Việt; không thêm ý “trả lời” vốn không có trong câu này.
- source_word: αὐτοῖς
  choice: với họ
  rationale: Giữ đại từ như nguyên văn thay vì đưa danh từ “các môn đồ” từ ngữ cảnh vào chính văn.
- source_word: Βλέπετε
  choice: Hãy coi chừng
  rationale: Diễn đạt tự nhiên sức cảnh báo của mệnh lệnh hiện tại, hàm ý phải luôn cảnh giác.
- source_word: μή τις ὑμᾶς πλανήσῃ
  choice: đừng để ai dẫn anh em đi lạc
  rationale: Cấu trúc “đừng để” diễn đạt điều cần ngăn ngừa; “dẫn ... đi lạc” giữ cả ý lừa dối lẫn khiến rời khỏi đường đúng của πλανάω.
theological_decisions:
- issue: Bản chất lời cảnh báo trong πλανήσῃ
  choice: Cảnh báo về sự lừa dối khiến người ta đi lạc khỏi đường đúng
  alternative: Chỉ cảnh báo về sự lừa dối trên phương diện nhận thức
  rationale: πλανάω có thể bao hàm cả việc đánh lừa và khiến đi sai đường. Cách dịch giữ độ rộng của hình ảnh mà không thêm một cách giải thích giáo lý.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và dễ hiểu. Dùng “anh em” cho đại từ số nhiều ὑμᾶς, phù hợp lời Đức Giê-su nói với nhóm môn đồ; “coi chừng” là lời cảnh báo tự nhiên, không cổ kính.
