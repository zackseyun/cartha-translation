reference: Mark 13:22
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐγερθήσονται γὰρ ψευδόχριστοι καὶ ψευδοπροφῆται καὶ δώσουσιν σημεῖα καὶ τέρατα πρὸς τὸ ἀποπλανᾶν εἰ ⸀δυνατὸν τοὺς ἐκλεκτούς·
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/022.yaml
  text: For false messiahs and false prophets will arise and will give signs and wonders in order to lead astray[a], if possible[c][b], the elect.
translation:
  language: vi
  text: Vì những kẻ mạo nhận là Đấng Mê-si và các tiên tri giả sẽ nổi lên, sẽ làm các dấu lạ và kỳ công nhằm dẫn lạc những người được chọn, nếu có thể.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc có thể sắp xếp: “nhằm, nếu có thể, dẫn lạc những người được chọn.” Nguyên văn không nói rõ rốt cuộc những người được chọn có thể bị dẫn lạc hay không; câu này nêu mục tiêu của những kẻ lừa dối.'
    reason: preserve_ambiguity
lexical_decisions:
- source_word: ἐγερθήσονται
  choice: sẽ nổi lên
  rationale: Diễn đạt tự nhiên sự xuất hiện của những nhân vật ấy trong lời cảnh báo, không hàm ý quá mức rằng họ được một tác nhân nào đó dựng lên.
- source_word: ψευδόχριστοι
  choice: những kẻ mạo xưng là Đấng Mê-si
  rationale: Thể hiện rõ đây là những người tự nhận sai trái danh hiệu Mê-si; cách nói này tự nhiên và dễ hiểu hơn từ ghép sát chữ như “các Mê-si giả”.
- source_word: ψευδοπροφῆται
  choice: những kẻ mạo xưng là nhà tiên tri
  rationale: Truyền đạt nghĩa các tiên tri giả bằng ngôn ngữ hiện đại, đồng thời song hành với ψευδόχριστοι.
- source_word: δώσουσιν σημεῖα καὶ τέρατα
  choice: làm các dấu lạ và kỳ công
  rationale: Trong tiếng Việt, “làm” tự nhiên hơn “ban/cho” khi nói đến việc thực hiện dấu lạ; cặp từ vẫn giữ sắc thái của thành ngữ Hy Lạp.
- source_word: πρὸς τὸ ἀποπλανᾶν
  choice: nhằm dẫn lạc
  rationale: Giữ rõ ý chỉ mục đích của cấu trúc Hy Lạp và hình ảnh khiến người ta đi chệch khỏi chân lý.
- source_word: εἰ δυνατόν
  choice: nếu có thể
  rationale: Dịch trực tiếp điều kiện ngắn gọn của nguyên văn, không quyết định liệu việc dẫn lạc những người được chọn có thực sự khả thi hay không.
- source_word: τοὺς ἐκλεκτούς
  choice: cả những người được chọn
  rationale: “Những người được chọn” là cách nói rõ nghĩa và tự nhiên; “cả” biểu thị rằng ngay đối tượng đặc biệt này cũng nằm trong mục tiêu lừa dối, nhưng không giải quyết kết quả của âm mưu ấy.
theological_decisions:
- issue: Danh hiệu trong ψευδόχριστοι
  choice: những kẻ mạo xưng là Đấng Mê-si
  alternative: các christ giả; các đấng chịu xức dầu giả
  rationale: Trong ngữ cảnh này Χριστός mang nghĩa danh hiệu Mê-si. Bản dịch giữ bối cảnh kỳ vọng về Đấng Mê-si mà không biến danh hiệu thành tên riêng.
- issue: Khả năng những người được chọn bị dẫn lạc trong εἰ δυνατόν
  choice: nếu có thể
  alternative: nếu điều đó có thể xảy ra; nếu có thể được
  rationale: Nguyên văn nêu điều kiện nhưng không minh thị kết luận về khả năng ấy. Bản dịch giữ nguyên căng thẳng thần học thay vì khẳng định hoặc phủ định rằng những người được chọn có thể bị dẫn lạc.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ liên từ giải thích “Vì”, cấu trúc lời tiên báo, cùng sự mơ hồ có chủ ý của εἰ δυνατόν. Dấu chú thích [a] xuất hiện trong chính văn.
