  text: ἀμὴν λέγω ὑμῖν ὅτι οὐ μὴ παρέλθῃ ἡ γενεὰ αὕτη μέχρις οὗ ⸂ταῦτα πάντα⸃ γένηται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/030.yaml
  text: Truly I say to you that this generation will certainly not pass away until all these things happen[a][b].
translation:
  language: vi
  text: 'Quả thật, tôi nói với anh em: thế hệ này[a] nhất định sẽ không qua đi[b] cho đến khi tất cả những điều này xảy ra.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “dân này” hoặc “chủng tộc này”; từ Hy Lạp γενεά có thể mang nghĩa rộng hơn, dù “thế hệ” là cách dịch tự nhiên nhất tại đây.
    reason: lexical_alternative
  - marker: b
    text: Cụm từ “nhất định sẽ không qua đi” diễn đạt một lối phủ định đặc biệt mạnh trong tiếng Hy Lạp.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν
  choice: Quả thật
  rationale: Dùng để mở đầu một lời tuyên bố long trọng, có thẩm quyền; cách dịch này tự nhiên trong tiếng Việt hiện đại và giữ được sức nhấn của nguyên ngữ.
- source_word: λέγω ὑμῖν
  choice: tôi nói với anh em
  rationale: Giữ sát công thức trực tiếp trong tiếng Hy Lạp, đồng thời dùng lối xưng hô trang trọng, dễ hiểu trong bối cảnh Đức Giê-su nói với các môn đồ.
- source_word: οὐ μὴ παρέλθῃ
  choice: nhất định sẽ không qua đi
  rationale: οὐ μή đi với động từ ở thể giả định aorist tạo thành lời phủ định đặc biệt mạnh; “nhất định sẽ không” truyền đạt sức nhấn ấy rõ ràng.
- source_word: ἡ γενεὰ αὕτη
  choice: thế hệ này
  rationale: Đây là nghĩa tự nhiên nhất của γενεά trong mạch văn. Cách dịch này giữ nguyên sự căng thẳng giải nghĩa thay vì diễn giải theo một hệ thống cánh chung cụ thể.
- source_word: μέχρις οὗ
  choice: cho đến khi
  rationale: Diễn đạt tự nhiên giới hạn thời gian được nêu trong nguyên ngữ.
- source_word: ταῦτα πάντα
  choice: mọi điều ấy
  rationale: Diễn đạt đầy đủ đại từ chỉ định số nhiều cùng ý nghĩa bao quát của πάντα, quy chiếu về những sự việc đã được nói đến.
- source_word: γένηται
  choice: xảy ra
  rationale: Trong ngữ cảnh nói về các biến cố, γίνομαι chỉ việc các sự việc diễn ra; “xảy ra” là cách nói hiện đại, rõ nghĩa.
theological_decisions:
- issue: Ý nghĩa của “thế hệ này” (ἡ γενεὰ αὕτη) trong bài giảng về thời kỳ cuối cùng
  choice: Dịch trực tiếp là “thế hệ này”, không thêm lời diễn giải vào chính văn.
  alternative: “dân này” hoặc “chủng tộc này”; cũng có cách hiểu là thế hệ tương lai chứng kiến các dấu hiệu bắt đầu.
  rationale: “Thế hệ này” là nghĩa tự nhiên nhất của cụm từ Hy Lạp. Vì cách hiểu câu này còn gây nhiều tranh luận, bản dịch giữ nguyên cách diễn đạt và sự căng thẳng thần học của nguyên bản, không ấn định một hệ thống cánh chung.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. “Quả thật” giữ sắc thái long trọng của lời mở đầu; “anh em” phù hợp lời trực tiếp với nhóm môn đồ. Tránh thuật ngữ giáo phái và không giải quyết trước tranh luận về “thế hệ này”.
