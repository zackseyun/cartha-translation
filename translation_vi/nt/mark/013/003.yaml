  text: Καὶ καθημένου αὐτοῦ εἰς τὸ Ὄρος τῶν Ἐλαιῶν κατέναντι τοῦ ἱεροῦ ⸀ἐπηρώτα αὐτὸν κατ’ ἰδίαν Πέτρος καὶ Ἰάκωβος καὶ Ἰωάννης καὶ Ἀνδρέας·
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/003.yaml
  text: And as he was sitting on the Mount of Olives opposite the temple, Peter and James and John and Andrew were asking him privately,
translation:
  language: vi
  text: 'Khi Đức Giê-su đang ngồi trên núi Ô-liu, đối diện khuôn viên đền thờ[a], Phi-e-rơ, Gia-cơ, Giăng và Anh-rê hỏi riêng Ngài:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hy Lạp ἱερόν chỉ toàn bộ khuôn viên hay khu vực đền thờ, không chỉ riêng nội điện (ναός).
    reason: lexical_alternative
lexical_decisions:
- source_word: καθημένου αὐτοῦ
  choice: Khi Đức Giê-su đang ngồi
  rationale: Cấu trúc sở hữu cách tuyệt đối với phân từ hiện tại diễn tả hoàn cảnh và hành động đang diễn ra; thêm tên Đức Giê-su thay cho đại từ để câu tiếng Việt rõ và tự nhiên.
- source_word: εἰς τὸ Ὄρος τῶν Ἐλαιῶν
  choice: trên núi Ô-liu
  rationale: Với động từ chỉ tư thế, εἰς ở đây có giá trị định vị; “trên” diễn đạt địa điểm tự nhiên trong tiếng Việt.
- source_word: κατέναντι τοῦ ἱεροῦ
  choice: đối diện khuôn viên đền thờ
  rationale: κατέναντι chỉ vị trí đối diện; ἱερόν nói đến toàn bộ khu đền thờ, không riêng nội điện.
- source_word: ἐπηρώτα
  choice: hỏi
  rationale: Thì vị hoàn thành chưa hoàn tất (imperfect) nhìn hành động như đang diễn ra, nhưng trong tiếng Việt, “hỏi” sau mệnh đề “khi... đang ngồi” tự nhiên hơn “đang hỏi” mà vẫn phù hợp với tiến trình thuật sự.
- source_word: κατ’ ἰδίαν
  choice: hỏi riêng Ngài
  rationale: Diễn tả việc hỏi cách riêng tư, tách khỏi những người khác; trật tự này tự nhiên trong tiếng Việt.
- source_word: Πέτρος καὶ Ἰάκωβος καὶ Ἰωάννης καὶ Ἀνδρέας
  choice: Phi-e-rơ, Gia-cơ, Giăng và Anh-rê
  rationale: Dùng các dạng tên quen thuộc trong Kinh Thánh tiếng Việt; phép liệt kê bằng dấu phẩy tự nhiên hơn việc lặp liên từ Hy Lạp.
