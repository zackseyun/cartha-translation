source:
  edition: SBLGNT
  text: Ἀλλὰ ἐν ἐκείναις ταῖς ἡμέραις μετὰ τὴν θλῖψιν ἐκείνην ὁ ἥλιος σκοτισθήσεται, καὶ ἡ σελήνη οὐ δώσει τὸ φέγγος αὐτῆς,
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/024.yaml
  text: But in those days[a], after that tribulation, the sun will be darkened, and the moon will not give its light,
translation:
  language: vi
  text: Nhưng trong những ngày ấy, sau cơn hoạn nạn đó,[a] mặt trời sẽ trở nên tối, và mặt trăng sẽ không tỏa ánh sáng của mình.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “sau cảnh khốn khó đó” hoặc “sau cơn gian nan đó”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀλλὰ
  choice: Nhưng
  rationale: Diễn tả sự tương phản hoặc chuyển ý mạnh với phần trước, đồng thời tự nhiên và súc tích trong tiếng Việt.
- source_word: ἐν ἐκείναις ταῖς ἡμέραις
  choice: trong những ngày ấy
  rationale: Giữ sát cấu trúc chỉ thời gian và sắc thái cánh chung của nguyên văn.
- source_word: μετὰ τὴν θλῖψιν ἐκείνην
  choice: sau cơn hoạn nạn đó
  rationale: μετά với đối cách mang nghĩa thời gian là “sau”; “cơn hoạn nạn” giữ được sức nặng của θλῖψις trong văn cảnh khải huyền, còn “đó” bảo toàn tính xác định của đại từ chỉ định.
- source_word: ὁ ἥλιος σκοτισθήσεται
  choice: mặt trời sẽ tối đi
  rationale: Chuyển đạt rõ biến cố ở tương lai và nghe tự nhiên trong tiếng Việt; hình thức bị động của tiếng Hy Lạp không cần được mô phỏng máy móc bằng “sẽ bị làm cho tối”.
- source_word: ἡ σελήνη οὐ δώσει τὸ φέγγος αὐτῆς
  choice: mặt trăng sẽ không chiếu sáng nữa
  rationale: Diễn đạt tự nhiên ý mặt trăng không còn phát ra ánh sáng của mình; “nữa” thể hiện sự chấm dứt được hàm ý trong phủ định tương lai ở ngữ cảnh này.
theological_decisions:
- issue: Cách dịch θλῖψις trong diễn từ mang tính khải huyền
  choice: hoạn nạn
  alternative: khốn khó; áp bức
  rationale: “Hoạn nạn” giữ được mức độ nghiêm trọng và âm hưởng cánh chung của từ trong ngữ cảnh, nhưng không áp đặt một hệ thống thời kỳ tận thế cụ thể.
- issue: Tác nhân làm mặt trời tối đi trong thể bị động σκοτισθήσεται
  choice: 'không nêu tác nhân: “sẽ tối đi”'
  alternative: “sẽ bị làm cho tối”
  rationale: Nguyên văn không nói rõ tác nhân. Cách dịch tiếng Việt tự nhiên này bảo toàn sự không xác định ấy thay vì giải thích đó là hành động trực tiếp của một tác nhân cụ thể.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “ấy” trong thành ngữ thời gian mang âm hưởng Kinh Thánh, kết hợp với “đó” để chỉ cụ thể cơn hoạn nạn đã được nhắc đến. Dấu chú thích [a] được đặt ngay sau cụm từ mà chú thích giải nghĩa.
