base_translation:
  language: en
  yaml_path: translation/nt/mark/013/031.yaml
  text: Heaven and earth will pass away[a], but my words will certainly not pass away.
translation:
  language: vi
  text: Trời đất sẽ qua đi, nhưng những lời của tôi chắc chắn sẽ không qua đi[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “sẽ không bao giờ qua đi” hoặc “nhất định sẽ không qua đi.” Tiếng Hy Lạp dùng một cấu trúc phủ định nhấn mạnh.'
    reason: Nêu các cách diễn đạt tương đương cho cấu trúc phủ định nhấn mạnh οὐ μή.
lexical_decisions:
- source_word: ὁ οὐρανὸς καὶ ἡ γῆ
  choice: trời đất
  rationale: Cụm này chỉ toàn thể trật tự vũ trụ được tạo dựng. “Trời đất” là cách nói tự nhiên và quen thuộc trong tiếng Việt, phù hợp hơn “bầu trời và đất” trong ngữ cảnh cánh chung.
- source_word: παρελεύσονται
  choice: sẽ qua đi
  rationale: Động từ ở đây mang nghĩa qua đi hoặc chấm dứt. “Sẽ qua đi” giữ được hình ảnh của nguyên ngữ mà không xác định quá mức cách trời đất chấm dứt.
- source_word: δὲ
  choice: nhưng
  rationale: Liên từ biểu thị sự tương phản giữa tính hữu hạn của trời đất và tính bền vững của lời Chúa Giê-su.
- source_word: οἱ λόγοι μου
  choice: những lời của tôi
  rationale: Dạng số nhiều chỉ những lời phán dạy của Chúa Giê-su. Cách dịch này trực tiếp, rõ nghĩa và giữ số nhiều của nguyên ngữ.
- source_word: οὐ μὴ παρελεύσονται
  choice: chắc chắn sẽ không qua đi
  rationale: Cấu trúc οὐ μή đi với thì tương lai là lối phủ định nhấn mạnh. “Chắc chắn sẽ không” truyền đạt rõ sức nhấn mạnh ấy bằng tiếng Việt hiện đại.
theological_decisions:
- issue: Sức nhấn mạnh trong lời khẳng định rằng những lời của Chúa Giê-su không qua đi
  choice: chắc chắn sẽ không qua đi
  alternative: không bao giờ qua đi; nhất định không qua đi
  rationale: Bản dịch làm rõ sự phủ định nhấn mạnh trong tiếng Hy Lạp, đồng thời giữ nguyên sự tương phản thần học giữa trời đất sẽ qua đi và lời Chúa Giê-su không qua đi.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “tôi” phản ánh lời nói trực tiếp tự nhiên trong tiếng Việt hiện đại mà không đưa thêm sắc thái giáo phái; “trời đất” giữ thành ngữ vũ trụ quen thuộc.
