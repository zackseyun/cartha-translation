  source_fidelity: Bản dịch truyền đạt đúng lời than/cảnh báo của οὐαί, hai nhóm phụ nữ được nêu, và khung thời gian “trong những ngày ấy.” Việc không dịch riêng δέ là chấp nhận được trong tiếng Việt. Tuy nhiên, “những người đang cho con bú” không bảo toàn rõ nét tham chiếu giống cái số nhiều của θηλαζούσαις như bản gốc.
