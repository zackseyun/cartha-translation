  terminology: “Khốn thay” phù hợp với οὐαί, giữ sắc thái than xót đồng thời cảnh báo. “Đang mang thai” và “đang cho con bú” là các cách diễn đạt hiện đại, rõ nghĩa, không thêm diễn giải thần học.
