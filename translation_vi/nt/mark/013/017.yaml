  text: οὐαὶ δὲ ταῖς ἐν γαστρὶ ἐχούσαις καὶ ταῖς θηλαζούσαις ἐν ἐκείναις ταῖς ἡμέραις.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/017.yaml
  text: But woe to those who are pregnant and to those who are nursing infants in those days[a][b].
translation:
  language: vi
  text: Khốn thay cho những phụ nữ đang mang thai và những phụ nữ đang cho con bú trong những ngày ấy!
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐαί
  choice: Khốn thay
  rationale: Giữ được sắc thái cảm thán mang tính tiên tri, vừa than xót vừa cảnh báo trước cảnh khốn khó.
- source_word: δὲ
  choice: không dịch thành từ nối riêng
  rationale: Tiểu từ đánh dấu bước chuyển nhẹ trong mạch văn; trong tiếng Việt, mở đầu trực tiếp bằng lời cảm thán tự nhiên hơn và không làm mất quan hệ diễn ngôn.
- source_word: ταῖς ἐν γαστρὶ ἐχούσαις
  choice: những phụ nữ đang mang thai
  rationale: Diễn đạt tự nhiên thành ngữ Hy Lạp có nghĩa đen là ‘có trong bụng/dạ’; danh từ ‘phụ nữ’ làm rõ giống cái số nhiều vốn được biểu thị bằng hình thái Hy Lạp.
- source_word: θηλαζούσαις
  choice: những người đang cho con bú
  rationale: Diễn đạt rõ hành động nuôi con bằng sữa mẹ mà không dùng lối nói quá lâm sàng; ‘con’ bổ sung đối tượng được hàm ý trong động từ Hy Lạp.
- source_word: ἐν ἐκείναις ταῖς ἡμέραις
  choice: trong những ngày ấy
  rationale: Bám sát cụm thời gian và duy trì liên kết với những biến cố được nói đến trong văn cảnh.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dấu chấm than thể hiện lực cảm thán của οὐαί. Không thêm chú thích vì các cách nói sát chữ như ‘có thai trong dạ’ hoặc ‘cho trẻ thơ bú’ không đem lại khác biệt ý nghĩa đáng kể trong tiếng Việt.
