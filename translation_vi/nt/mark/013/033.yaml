  source_fidelity: Hai mệnh lệnh số nhiều βλέπετε và ἀγρυπνεῖτε được chuyển riêng biệt và đúng sắc thái cảnh giác/tỉnh thức. Mệnh đề lý do và ý nghĩa không biết thời điểm (καιρός) được giữ lại. Cách nói “thời điểm ấy đến khi nào” là cách diễn đạt tiếng Việt tự nhiên cho cấu trúc πότε ὁ καιρός ἐστιν, không bổ sung một ý thần học nào.
  naturalness: Bản sửa làm mệnh đề cuối tự nhiên và lưu loát hơn trong tiếng Việt hiện đại. “Hãy coi chừng, hãy tỉnh thức” phù hợp văn phong khuyên răn trang trọng mà vẫn dễ hiểu.
  terminology: “Tỉnh thức” là thuật ngữ phù hợp cho ἀγρυπνεῖτε trong văn cảnh này. “Thời điểm ấy” giữ tính xác định của ὁ καιρός mà không diễn giải quá mức là thời điểm đã được định trước. Trong chú thích, “thời kỳ ấy” rõ nghĩa và hiện đại hơn “kỳ ấy” khi nêu phương án “season.”
