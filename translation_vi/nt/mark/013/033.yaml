  text: βλέπετε ⸀ἀγρυπνεῖτε, οὐκ οἴδατε γὰρ πότε ὁ καιρός ἐστιν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/033.yaml
  text: Be on guard; stay awake[a], for you do not know when the time is.
translation:
  language: vi
  text: Hãy coi chừng, hãy tỉnh thức, vì anh em không biết thời điểm ấy[a] đến khi nào.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “thời điểm đã định” hoặc “thời kỳ ấy”. Từ Hy Lạp καιρός thường chỉ một thời điểm có tính quyết định hoặc đã được ấn định.
    reason: lexical_alternative
lexical_decisions:
- source_word: βλέπετε
  choice: Hãy coi chừng
  rationale: Mệnh lệnh số nhiều được dùng như lời cảnh báo phải thận trọng và cảnh giác, chứ không chỉ là nhìn bằng mắt; cách dịch này cũng phân biệt với ἀγρυπνεῖτε theo sau.
- source_word: ἀγρυπνεῖτε
  choice: hãy tỉnh thức
  rationale: Diễn tả việc thức và duy trì sự cảnh giác; “tỉnh thức” tự nhiên trong văn cảnh khuyên răn và giữ được hình ảnh thức canh.
- source_word: οὐκ οἴδατε
  choice: anh em không biết
  rationale: Chuyển trực tiếp động từ biết ở thể phủ định; đại từ số nhiều “anh em” phù hợp với đối tượng được Chúa Giê-su nói với.
- source_word: γὰρ
  choice: vì
  rationale: Giới thiệu lý do cho hai mệnh lệnh đứng trước.
- source_word: πότε
  choice: khi nào
  rationale: Cách diễn đạt tự nhiên nhất trong tiếng Việt cho trạng từ nghi vấn chỉ thời gian.
- source_word: ὁ καιρός
  choice: thời điểm ấy
  rationale: καιρός ở đây chỉ một thời điểm có tính quyết định trong văn cảnh; “ấy” phản ánh mạo từ xác định mà không buộc cách hiểu thành một thời điểm được ấn định rõ ràng.
- source_word: ἐστιν
  choice: là
  rationale: Động từ nối được thể hiện tự nhiên trong cấu trúc tiếng Việt “là khi nào”.
theological_decisions:
- issue: Sắc thái của καιρός trong văn cảnh cánh chung
  choice: thời điểm ấy
  alternative: thời điểm đã định; kỳ ấy
  rationale: Bản chính giữ ý về một thời điểm cụ thể và quyết định nhưng không khẳng định quá mức rằng từ này tự nó có nghĩa là đã được ấn định; chú thích bảo lưu các sắc thái khả dĩ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Hai mệnh lệnh được giữ riêng để bảo toàn sự phân biệt giữa lời cảnh báo phải coi chừng và lời kêu gọi duy trì tỉnh thức.
