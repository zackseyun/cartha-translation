review_pass:
  verdict: revise
  source_fidelity: Bản dịch truyền đạt đúng lời cấm khẩn cấp không quay lại để lấy ἱμάτιον, và chú thích phản ánh hợp lý nghĩa từ vựng thay thế của ἱμάτιον. Tuy nhiên, καὶ là liên từ nối tiếp (“và”), trong khi “Còn… thì…” dễ tạo sắc thái đối lập/đối chiếu không được đánh dấu rõ trong nguyên văn.
  naturalness: Câu văn tự nhiên, rõ ràng và phù hợp tiếng Việt hiện đại. “Và người ở ngoài đồng thì…” vẫn tự nhiên trong chuỗi các lời cảnh báo song song.
  terminology: “Áo choàng” là cách dịch thích hợp của ἱμάτιον trong ngữ cảnh này; “áo ngoài” là phương án thay thế chính xác. “Của mình” giữ được quy chiếu số ít khái quát mà không áp đặt giới tính trong tiếng Việt.
  issues:
