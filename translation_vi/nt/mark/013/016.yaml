  text: καὶ ὁ εἰς τὸν ⸀ἀγρὸν μὴ ἐπιστρεψάτω εἰς τὰ ὀπίσω ἆραι τὸ ἱμάτιον αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/016.yaml
  text: And the one in the field must not turn back to get his cloak[a].
translation:
  language: vi
  text: Và người ở ngoài đồng thì đừng quay lại lấy áo choàng của mình.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “áo ngoài.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ εἰς τὸν ἀγρόν
  choice: người đang ở ngoài đồng
  rationale: Cấu trúc có mạo từ được dùng như danh từ, chỉ một người được nhận diện bởi việc đang ở ngoài đồng. Cách dịch này tự nhiên trong tiếng Việt và giữ số ít mang tính đại diện.
- source_word: ἀγρός
  choice: ngoài đồng
  rationale: Trong ngữ cảnh cảnh báo phải chạy trốn, từ này chỉ đồng ruộng; cụm “ở ngoài đồng” là cách nói tự nhiên trong tiếng Việt.
- source_word: μὴ ἐπιστρεψάτω εἰς τὰ ὀπίσω
  choice: đừng quay lại
  rationale: Mệnh lệnh aorist với μή diễn đạt lời cấm khẩn cấp; “đừng quay lại” chuyển tải đầy đủ cả động từ và ý hướng về phía sau.
- source_word: ἆραι
  choice: lấy
  rationale: Động từ nguyên mẫu chỉ mục đích của việc quay lại. “Lấy” là cách diễn đạt trực tiếp, tự nhiên cho hành động trở về mang áo theo.
- source_word: ἱμάτιον
  choice: áo choàng
  rationale: Từ này thường chỉ áo mặc bên ngoài. “Áo choàng” cụ thể và dễ hiểu; nghĩa rộng hơn được ghi ở chú thích.
- source_word: αὐτοῦ
  choice: của mình
  rationale: Đại từ sở hữu quy chiếu về chính người đang ở ngoài đồng. Tiếng Việt tự nhiên dùng “của mình”, vẫn giữ quan hệ sở hữu và số ít mà không gán giới tính vốn không được đánh dấu theo cùng cách trong ngữ pháp tiếng Việt.
theological_decisions:
- issue: Tham chiếu giống đực mang nghĩa khái quát
  choice: Giữ hình thức số ít bằng “người… của mình”
  alternative: Số nhiều “những người… áo choàng của họ” hoặc nêu giới “người đàn ông… áo choàng của anh ấy”
  rationale: Bản Hy Lạp dùng cấu trúc giống đực số ít mang tính đại diện. Tiếng Việt không bắt buộc đánh dấu giống ở “người”; “của mình” giữ tham chiếu số ít và không thu hẹp lời cảnh báo chỉ cho nam giới.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Còn… thì…” nối tự nhiên câu này với lời cảnh báo song song ở câu trước; “đừng quay lại” giữ sắc thái mệnh lệnh khẩn cấp.
