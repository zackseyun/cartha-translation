    issue: Liên từ mở đầu “Còn”
    rationale: καὶ có nghĩa cơ bản là liên từ nối tiếp. “Còn” có thể dùng để chuyển sang một trường hợp khác, nhưng cũng có thể gợi đối lập; “Và” bám sát hơn với quan hệ liên kết của nguyên văn và với mạch câu song song.
  revised_text: Và người ở ngoài đồng thì đừng quay lại lấy áo choàng của mình.[a]
