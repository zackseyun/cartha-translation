- from: Cũng vậy, khi anh em thấy những điều ấy xảy ra, hãy biết rằng điều ấy đã đến gần, ngay trước cửa.[a]
  to: Cũng vậy, khi anh em thấy những điều ấy xảy ra, hãy biết rằng điều ấy đã gần kề, ngay trước cửa.[a]
  rationale: Chỉ điều chỉnh “đã đến gần” thành “đã gần kề” để phản ánh trực tiếp hơn ἐγγύς ἐστιν, đồng thời giữ nguyên tính mơ hồ về chủ thể và hình ảnh thành ngữ “ngay trước cửa.” Chú thích được điều chỉnh tương ứng.
