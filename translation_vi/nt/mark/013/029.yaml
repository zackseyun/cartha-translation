source:
  edition: SBLGNT
  text: οὕτως καὶ ὑμεῖς, ὅταν ⸂ἴδητε ταῦτα⸃ γινόμενα, γινώσκετε ὅτι ἐγγύς ἐστιν ἐπὶ θύραις.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/029.yaml
  text: So also you[a], when you see these things happening, know that it is near, at the doors.
translation:
  language: vi
  text: Cũng vậy, khi anh em thấy những điều ấy xảy ra, hãy biết rằng điều ấy đã gần kề, ngay trước cửa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể hiểu: “Ngài đã gần kề.” Tiếng Hy Lạp không nêu rõ chủ thể.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὕτως καὶ ὑμεῖς
  choice: Cũng vậy, ... anh em
  rationale: “Cũng vậy” nối lời này với hình ảnh cây vả ở câu trước; “anh em” diễn đạt đại từ số nhiều ὑμεῖς và hướng lời nói đến các môn đồ.
- source_word: ὅταν ἴδητε
  choice: khi anh em thấy
  rationale: ὅταν đi với động từ giả định chỉ một tình huống sẽ xảy ra trong tương lai; “khi” là cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: ταῦτα γινόμενα
  choice: những điều ấy xảy ra
  rationale: Giữ số nhiều của ταῦτα và diễn đạt γινόμενα bằng cách nói thông dụng, rõ nghĩa.
- source_word: γινώσκετε
  choice: hãy biết
  rationale: Thể mệnh lệnh được giữ rõ, kêu gọi người nghe rút ra kết luận từ những gì họ thấy.
- source_word: ὅτι ἐγγύς ἐστιν
  choice: rằng điều ấy đã đến gần
  rationale: Bản Hy Lạp không nêu chủ thể của ἐστιν. “Điều ấy” chỉ chung sự việc hoặc sự ứng nghiệm đang được nói đến mà không xác định quá mức; khả năng hiểu chủ thể là một nhân vật được ghi ở chú thích.
- source_word: ἐπὶ θύραις
  choice: ngay trước cửa
  rationale: Đây là thành ngữ chỉ sự cận kề. Tiếng Việt tự nhiên dùng “ngay trước cửa”; dịch máy móc số nhiều “các cửa” sẽ khó hiểu và kém tự nhiên.
theological_decisions:
- issue: Chủ thể không được nêu của ἐστιν (“đã đến gần”)
  choice: Dùng “điều ấy” trong chính văn để chỉ chung biến cố hoặc sự ứng nghiệm đang đến gần.
  alternative: “Ngài đã đến gần”
  rationale: Nguyên văn không nêu chủ thể. Chính văn không nên tự động đồng nhất chủ thể với Con Người, nhưng chú thích bảo lưu cách hiểu mang tính nhân xưng vốn có thể có trong ngữ cảnh.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Anh em” phù hợp với lời Chúa Giê-su nói cùng nhóm môn đồ; “ngay trước cửa” giữ hình ảnh sinh động và thành ngữ chỉ sự rất gần.
