review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch giữ đúng cấu trúc chính: lời so sánh với cây vả, các dấu hiệu xảy ra, mệnh lệnh rút kết luận, và hình ảnh cận kề ở cửa. Tuy nhiên, “điều ấy đã đến gần” dễ chuyển sắc thái của ἐγγύς ἐστιν (“đang/gần kề”) thành một hành động đã hoàn tất (“đã đến gần”). “đã gần kề” diễn đạt sát hơn tình trạng được nêu trong tiếng Hy Lạp, mà vẫn không xác định chủ thể bị lược.'
  naturalness: “Cũng vậy, khi anh em thấy...” và “ngay trước cửa” là tiếng Việt hiện đại, rõ ràng và phù hợp văn phong Kinh Thánh vừa phải. “Đã gần kề” tự nhiên hơn trong câu này và đi song song tốt với “ngay trước cửa.”
  terminology: “Anh em” phù hợp với số nhiều và ngữ cảnh Chúa Giê-su nói với các môn đồ. Không nên đưa một chủ thể thần học xác định vào chính văn. Chú thích có thể bảo lưu cách hiểu nhân xưng; “Ngài” là cách xưng hô tôn kính thông dụng trong văn phong Kinh Thánh tiếng Việt.
  issues:
  - severity: low
    issue: Sắc thái thời-thể của “đã đến gần”
    rationale: ἐγγύς ἐστιν nêu tình trạng “là gần/kề cận,” không dùng động từ “đến” ở thì hoàn thành. “Đã gần kề” tránh gợi một chuyển động đã hoàn tất và sát nguyên văn hơn.
  revised_text: Cũng vậy, khi anh em thấy những điều ấy xảy ra, hãy biết rằng điều ấy đã gần kề, ngay trước cửa.[a]
