source:
  edition: SBLGNT
  text: καὶ ὁ ⸀Ἰησοῦς εἶπεν αὐτῷ· Βλέπεις ταύτας τὰς μεγάλας οἰκοδομάς; οὐ μὴ ἀφεθῇ ⸀ὧδε λίθος ἐπὶ ⸀λίθον ὃς οὐ μὴ καταλυθῇ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/002.yaml
  text: And Jesus said to him[c][b][a], “Do you see these great buildings? Not one stone will be left here upon another that will not be torn down.”
translation:
  language: vi
  text: 'Đức Giê-su nói với ông: “Anh có thấy những công trình đồ sộ này không?[a] Ở đây sẽ không còn hòn đá nào nằm trên hòn đá nào[b] mà không bị phá đổ.[c]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “những công trình đền thờ đồ sộ này”. Ngữ cảnh nói đến quần thể đền thờ, nhưng tiếng Hy Lạp chỉ ghi “các công trình”.'
    reason: lexical_alternative
  - marker: b
    text: Cụm từ “không còn hòn đá nào nằm trên hòn đá nào” là hình ảnh diễn tả sự tàn phá hoàn toàn.
    reason: cultural_note
  - marker: c
    text: 'Cũng có thể dịch: “bị phá hủy”, “bị tháo dỡ” hoặc “bị quật đổ”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Βλέπεις
  choice: Anh có thấy ... không?
  rationale: Động từ hiện tại ở thể chỉ định được dùng như một câu hỏi trực tiếp. Cách diễn đạt này tự nhiên trong tiếng Việt và không biến câu hỏi thành mệnh lệnh “Hãy nhìn”.
- source_word: μεγάλας οἰκοδομάς
  choice: những công trình đồ sộ
  rationale: οἰκοδομάς chỉ các công trình xây dựng, còn μεγάλας có thể nói đến cả kích thước lẫn vẻ hùng vĩ. “Công trình đồ sộ” phù hợp với quần thể đền thờ mà không thêm từ “đền thờ” vốn không có trong câu Hy Lạp.
- source_word: οὐ μὴ ἀφεθῇ
  choice: sẽ không còn
  rationale: οὐ μή với động từ ở thể giả định diễn tả sự phủ định tương lai rất mạnh. Trong cấu trúc “không còn hòn đá nào”, tiếng Việt tự nhiên vẫn truyền đạt được tính tuyệt đối ấy.
- source_word: ὧδε
  choice: ở đây
  rationale: Giữ rõ trạng từ chỉ nơi chốn và tính trực tiếp của lời tiên báo.
- source_word: λίθος ἐπὶ λίθον
  choice: hòn đá nào nằm trên hòn đá nào
  rationale: Giữ hình ảnh từng hòn đá nằm trên một hòn khác, đồng thời kết hợp tự nhiên với cấu trúc phủ định toàn thể trong tiếng Việt.
- source_word: καταλυθῇ
  choice: bị phá đổ
  rationale: Trong ngữ cảnh một công trình, καταλύω nói đến việc tháo dỡ hoặc phá hủy. “Phá đổ” vừa cụ thể vừa tự nhiên, giữ được hình ảnh công trình bị triệt hạ.
- source_word: καὶ ὁ Ἰησοῦς εἶπεν αὐτῷ
  choice: Đức Giê-su nói với ông
  rationale: Dịch trực tiếp lời dẫn chuyện, không thêm sắc thái “trả lời” vốn không được εἶπεν tự nó xác định.
theological_decisions:
- issue: Phạm vi lời tiên báo về quần thể đền thờ
  choice: Dùng “những công trình” trong chính văn.
  alternative: “Những công trình đền thờ” hoặc “những tòa nhà của đền thờ”.
  rationale: Ngữ cảnh xác định đây là các công trình thuộc quần thể đền thờ, nhưng nguyên văn chỉ nói “các công trình”. Bản dịch không thêm danh từ mang tính giải thích vào chính văn.
- issue: Mức độ toàn diện của sự hủy phá
  choice: 'Giữ cấu trúc phủ định tuyệt đối: “không còn hòn đá nào ... mà không bị phá đổ”.'
  alternative: Diễn giải thành “tất cả sẽ bị phá hủy hoàn toàn”.
  rationale: Cách chọn giữ nguyên hình ảnh và sức nhấn mạnh của hai cấu trúc οὐ μή mà không biến lời tiên báo thành một lời giải nghĩa trừu tượng.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. “Đức Giê-su” phù hợp văn phong Kinh Thánh phổ thông; đại từ “anh” thể hiện lời nói trực tiếp với một môn đồ mà không dùng lối cổ “ngươi”. Câu thứ hai giữ sức nặng tiên tri và hình ảnh cụ thể của nguyên văn.
