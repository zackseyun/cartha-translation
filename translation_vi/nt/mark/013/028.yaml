  terminology: Giữ «dụ ngôn» cho παραβολή là nhất quán với thuật ngữ Phúc Âm. Chú thích nêu hợp lý các cách hiểu từ vựng «bài học» và «hình ảnh minh họa», nhưng cần đặt ký hiệu ngay sau «dụ ngôn».
