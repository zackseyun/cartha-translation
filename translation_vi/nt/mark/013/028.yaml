  text: Ἀπὸ δὲ τῆς συκῆς μάθετε τὴν παραβολήν· ὅταν ⸂ἤδη ὁ κλάδος αὐτῆς⸃ ἁπαλὸς γένηται καὶ ἐκφύῃ τὰ φύλλα, γινώσκετε ὅτι ἐγγὺς τὸ θέρος ἐστίν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/028.yaml
  text: 'Learn the parable from the fig tree: when its branch has already become tender and puts out leaves[a], you know that summer is near.'
translation:
  language: vi
  text: 'Hãy học dụ ngôn[a] từ cây vả: khi cành của nó đã trở nên non mềm và đâm lá, anh em biết rằng mùa hè đã gần.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “bài học” hoặc “hình ảnh minh họa” thay cho “dụ ngôn”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀπὸ δὲ τῆς συκῆς
  choice: Hãy học ... từ cây vả
  rationale: ἀπό với sở hữu cách chỉ nguồn để học hỏi; δέ là từ nối nhẹ, không cần thêm một trạng từ thời gian như “bây giờ” trong tiếng Việt.
- source_word: μάθετε
  choice: Hãy học
  rationale: Động từ mệnh lệnh aorist của μανθάνω kêu gọi người nghe tiếp nhận bài học; “hãy học” trực tiếp và tự nhiên.
- source_word: τὴν παραβολήν
  choice: dụ ngôn
  rationale: παραβολή chỉ một sự so sánh minh họa và cũng là thuật ngữ quen thuộc trong các sách Phúc Âm; “dụ ngôn” giữ được tính liên tục từ vựng.
- source_word: ὅταν
  choice: khi
  rationale: ὅταν với thức giả định diễn tả điều kiện thời gian có tính khái quát; “khi” phù hợp với nhận xét theo mùa.
- source_word: ἤδη ὁ κλάδος αὐτῆς ἁπαλὸς γένηται
  choice: khi cành nó đã trở nên mềm
  rationale: ἤδη được thể hiện bằng “đã”; ἁπαλός nói đến trạng thái mềm, non của cành khi nhựa sống trở lại. Cách diễn đạt giữ tiến trình đạt đến trạng thái ấy.
- source_word: ἐκφύῃ τὰ φύλλα
  choice: đâm lá
  rationale: ἐκφύω nghĩa là mọc hoặc đâm ra; “đâm lá” là cách nói tự nhiên trong tiếng Việt về cây cối nảy lá.
- source_word: γινώσκετε
  choice: anh em biết
  rationale: Đây là dạng hiện tại chỉ định trong ngữ cảnh, nêu điều người ta nhận biết từ dấu hiệu chứ không phải một mệnh lệnh thứ hai. “Anh em” làm rõ chủ thể số nhiều được hàm chứa trong động từ Hy Lạp.
- source_word: ἐγγὺς τὸ θέρος ἐστίν
  choice: mùa hè đã gần
  rationale: θέρος theo nghĩa thông thường là “mùa hè”; ἐγγύς chỉ sự gần kề về thời gian. “Đã gần” diễn đạt tự nhiên việc mùa ấy sắp đến.
theological_decisions:
- issue: Ý nghĩa của παραβολή trong ngữ cảnh này
  choice: Giữ “dụ ngôn” trong chính văn.
  alternative: bài học; hình ảnh minh họa
  rationale: Từ Hy Lạp có thể chỉ bài học bằng phép so sánh, nhưng “dụ ngôn” bảo tồn thuật ngữ quen thuộc trong lời dạy của Chúa Giê-su mà không áp đặt thêm chi tiết ngụ ý.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “cây vả”, “đâm lá” theo cách nói tự nhiên; “anh em” biểu thị ngôi thứ hai số nhiều. Dấu chú thích [a] được đặt ngay sau từ ngữ mà chú thích giải thích.
