id: MRK.13.11
reference: Mark 13:11
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸂καὶ ὅταν⸃ ⸀ἄγωσιν ὑμᾶς παραδιδόντες, μὴ προμεριμνᾶτε τί ⸀λαλήσητε, ἀλλ’ ὃ ἐὰν δοθῇ ὑμῖν ἐν ἐκείνῃ τῇ ὥρᾳ τοῦτο λαλεῖτε, οὐ γάρ ἐστε ὑμεῖς οἱ λαλοῦντες ἀλλὰ τὸ πνεῦμα τὸ ἅγιον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/011.yaml
  text: And when they lead you away and hand you over[a], do not worry beforehand about what you should say; but whatever is given to you in that hour, speak that. For it is not you who are speaking[b], but the Holy Spirit.
translation:
  language: vi
  text: Khi người ta dẫn anh em đi và trao nộp anh em, đừng lo trước mình sẽ nói gì. Nhưng vào giờ ấy, điều gì được ban cho anh em thì hãy nói điều đó, vì không phải chính anh em là người nói, mà là Đức Thánh Linh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ ὅταν
  choice: Khi
  rationale: Diễn tả một tình huống tương lai được dự liệu trong mạch văn; tiếng Việt không cần dịch riêng liên từ καί ở đầu câu.
- source_word: ἄγωσιν ὑμᾶς παραδιδόντες
  choice: người ta dẫn anh em đi và trao nộp anh em
  rationale: Dùng hai động từ phối hợp để diễn đạt tự nhiên động từ chính cùng phân từ đi kèm, đồng thời giữ sắc thái cưỡng chế của ἄγω và ý trao người vào tay người khác của παραδίδωμι.
- source_word: μὴ προμεριμνᾶτε
  choice: đừng lo trước
  rationale: Giữ cả ý lo lắng và yếu tố thời gian 'trước' trong tiền tố προ-, bằng cách nói ngắn gọn, tự nhiên.
- source_word: τί λαλήσητε
  choice: mình sẽ nói gì
  rationale: Trong lời trực tiếp nói với các môn đồ, 'mình' làm câu tiếng Việt tự nhiên; 'nói' chuyển tải λαλέω mà không tạo sắc thái quá trang trọng.
- source_word: ὃ ἐὰν δοθῇ ὑμῖν
  choice: điều gì được ban cho anh em
  rationale: Giữ cấu trúc bị động và không nói rõ chủ thể ban, như nguyên văn, nhờ đó không giải thích quá mức tác nhân thần linh.
- source_word: ἐν ἐκείνῃ τῇ ὥρᾳ
  choice: vào giờ ấy
  rationale: Giữ hình ảnh 'giờ ấy' của nguyên văn và sắc thái về một thời điểm quyết định.
- source_word: τοῦτο λαλεῖτε
  choice: hãy nói điều đó
  rationale: 'Giữ đại từ chỉ định nhấn mạnh: họ phải nói chính điều được ban cho mình.'
- source_word: οὐ γάρ ἐστε ὑμεῖς οἱ λαλοῦντες
  choice: vì không phải chính anh em là người nói
  rationale: Từ 'chính' thể hiện sự nhấn mạnh của đại từ ὑμεῖς và duy trì thế đối lập với vế sau.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: Đức Thánh Linh
  rationale: Cách gọi quen thuộc, trang trọng trong tiếng Việt hiện đại, diễn đạt danh xưng chỉ Thánh Linh trong nguyên văn.
theological_decisions:
- issue: Tác nhân của lời nói khi các môn đồ bị bắt bớ
  choice: Giữ đồng thời mệnh lệnh các môn đồ phải nói và lời khẳng định tác nhân tối hậu là Đức Thánh Linh.
  alternative: Diễn đạt theo mô hình đọc chính tả máy móc, trong đó các môn đồ hoàn toàn thụ động; hoặc giảm 'Đức Thánh Linh' thành một ảnh hưởng thần linh chung chung.
  rationale: Nguyên văn vừa truyền cho các môn đồ 'hãy nói', vừa đối lập 'không phải chính anh em... mà là Đức Thánh Linh'. Bản dịch không xóa bỏ một phía nào của sự căng thẳng này.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng 'anh em' cho đại từ số nhiều ὑμᾶς/ὑμῖν/ὑμεῖς; tránh thêm 'nhà chức trách' vì nguyên văn không nêu đích danh trong câu này. Tách câu tại ἀλλά để tiếng Việt sáng rõ mà vẫn giữ quan hệ tương phản.
