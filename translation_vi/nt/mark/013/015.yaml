  source_fidelity: 'Bản dịch chuyển tải đúng hai mệnh lệnh phủ định phối hợp trong tiếng Hy Lạp: người ở trên mái nhà không được đi xuống và cũng không được vào nhà với mục đích lấy bất cứ vật gì ra. “Bất cứ thứ gì” phản ánh tốt τι; “ra” diễn đạt phù hợp hướng ἐκ (“ra khỏi”) ngôi nhà. Việc không thể hiện giống đực số ít của αὐτοῦ là tự nhiên trong tiếng Việt và không làm đổi nghĩa khái quát của lời chỉ dẫn.'
