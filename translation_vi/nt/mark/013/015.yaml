source:
  edition: SBLGNT
  text: ⸀ὁ ἐπὶ τοῦ δώματος μὴ ⸀καταβάτω μηδὲ εἰσελθάτω ⸂τι ἆραι⸃ ἐκ τῆς οἰκίας αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/015.yaml
  text: Let the one on the housetop not go down[a], nor enter to take anything out of his house.
translation:
  language: vi
  text: Người đang ở trên mái nhà[a] thì đừng đi xuống, cũng đừng vào nhà lấy bất cứ thứ gì ra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên ngữ chỉ phần mái bằng của ngôi nhà, thường có thể dùng làm nơi sinh hoạt.
    reason: cultural_note
lexical_decisions:
- source_word: ὁ ἐπὶ τοῦ δώματος
  choice: Người đang ở trên mái nhà
  rationale: Cụm có mạo từ được dùng như danh từ để chỉ người ở vị trí ấy. Cách diễn đạt này tự nhiên trong tiếng Việt và giữ được bối cảnh của mái bằng có thể đi lại hoặc sinh hoạt.
- source_word: μὴ καταβάτω
  choice: thì đừng đi xuống
  rationale: Mệnh lệnh ngôi thứ ba mang ý cấm đoán được diễn đạt tự nhiên bằng “đừng”; “đi xuống” giữ nguyên hướng chuyển động từ mái nhà.
- source_word: μηδὲ εἰσελθάτω
  choice: cũng đừng vào nhà
  rationale: μηδέ nối thêm một điều cấm. Bổ sung “nhà” làm đích đến vốn được xác định ngay sau đó, giúp câu tiếng Việt rõ và tự nhiên mà không đổi nghĩa.
- source_word: τι ἆραι
  choice: lấy bất cứ thứ gì ra
  rationale: Đại từ bất định đi với động từ nguyên mẫu chỉ mục đích. “Bất cứ thứ gì” thể hiện phạm vi rộng của lệnh cấm, còn “ra” phù hợp với ἐκ ở cụm kế tiếp.
- source_word: ἐκ τῆς οἰκίας αὐτοῦ
  choice: vào nhà … ra
  rationale: Ngôi nhà của chính người đang được nói đến đã rõ trong tiếng Việt qua cấu trúc câu; không cần dùng đại từ sở hữu giống đực. Cách đặt “ra” sau tân ngữ diễn đạt tự nhiên ý chuyển vật từ trong nhà ra ngoài.
theological_decisions:
- issue: Dạng giống đực số ít đại diện trong lời chỉ dẫn có ý nghĩa khái quát
  choice: 'Không biểu thị giới tính trong tiếng Việt: “Người … vào nhà”'
  alternative: “Người ấy … vào nhà mình” hoặc “ông ấy … vào nhà mình”
  rationale: Tiếng Việt không buộc đánh dấu giống ở “người”, và quan hệ sở hữu được ngữ cảnh xác định rõ. Dùng “ông ấy” sẽ biến giống ngữ pháp đại diện của tiếng Hy Lạp thành giới tính được nhấn mạnh không cần thiết; dùng “nhà mình” có thể tự nhiên nhưng dễ tạo sắc thái phản thân nổi bật hơn nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng cấu trúc đề–thuyết “Người… thì…” để chuyển mệnh lệnh ngôi thứ ba sang tiếng Việt tự nhiên; giữ nhịp khẩn cấp bằng hai lần “đừng”.
