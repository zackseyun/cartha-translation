source:
  edition: SBLGNT
  text: ὅταν δὲ ⸀ἀκούσητε πολέμους καὶ ἀκοὰς πολέμων, μὴ θροεῖσθε· ⸀δεῖ γενέσθαι, ἀλλ’ οὔπω τὸ τέλος.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/007.yaml
  text: And when you hear of wars and reports of wars[a], do not be alarmed; these things must happen, but the end is not yet.
translation:
  language: vi
  text: Khi anh em nghe về chiến tranh và những tin tức về chiến tranh[a], đừng kinh hoảng; những điều ấy phải xảy ra, nhưng kết thúc vẫn chưa đến.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “những lời đồn về chiến tranh.” Từ Hy Lạp có thể chỉ tin tức, báo cáo hoặc lời đồn được nghe về chiến tranh.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν δὲ
  choice: Khi
  rationale: ὅταν diễn tả một tình huống theo thời gian trong tương lai (“khi/mỗi khi”), còn δέ là từ nối nhẹ. Tiếng Việt không cần dịch δέ thành một từ riêng ở đây để câu văn tự nhiên.
- source_word: ἀκούσητε
  choice: anh em nghe về
  rationale: Thể giả định aorist sau ὅταν được diễn đạt tự nhiên bằng hiện tại trong mệnh đề chỉ thời gian hướng tới tương lai. “Anh em” chỉ nhóm môn đồ được Chúa Giê-su trực tiếp nói với, còn “nghe về” phù hợp với các bổ ngữ theo sau.
- source_word: πολέμους
  choice: chiến tranh
  rationale: Cách dịch trực tiếp, thông dụng của πόλεμος; tiếng Việt thường dùng danh từ này không cần dấu hiệu số nhiều.
- source_word: ἀκοὰς πολέμων
  choice: những tin tức về chiến tranh
  rationale: ἀκοή có thể chỉ điều được nghe, tin tức, báo cáo hoặc lời đồn. “Tin tức” giữ nghĩa rộng hơn “lời đồn” và không mặc nhiên cho rằng thông tin chưa được kiểm chứng; sắc thái “lời đồn” được giữ trong chú thích.
- source_word: μὴ θροεῖσθε
  choice: đừng kinh hoảng
  rationale: θροέομαι diễn tả trạng thái bị khuấy động, hoảng hốt hoặc sợ hãi. “Đừng kinh hoảng” tự nhiên, mạnh vừa đủ và phù hợp với lời cảnh báo trong văn mạch.
- source_word: δεῖ γενέσθαι
  choice: những điều ấy phải xảy ra
  rationale: δεῖ diễn tả sự cần thiết, còn γενέσθαι ở đây là “xảy ra”. Chủ ngữ “những điều ấy” được nêu rõ từ văn cảnh mà không bổ sung nội dung mới.
- source_word: ἀλλ’ οὔπω τὸ τέλος
  choice: nhưng kết cuộc chưa đến
  rationale: τέλος chỉ điểm kết thúc hay kết cuộc. “Kết cuộc” giữ sắc thái cánh chung mà không thu hẹp thành một thuật ngữ giáo lý cụ thể; “chưa đến” diễn đạt tự nhiên ý οὔπω trong tiếng Việt.
theological_decisions:
- issue: Tính tất yếu mang sắc thái cánh chung trong δεῖ γενέσθαι
  choice: Dịch δεῖ là “phải” để giữ nguyên sức nặng của sự cần thiết mang tính thần học hoặc tiên tri.
  alternative: “cần phải xảy ra” hoặc “ắt sẽ xảy ra”
  rationale: Câu này khẳng định sự cần thiết nhưng không giải thích cơ chế hay hệ thống thời kỳ cuối cùng. “Phải xảy ra” bảo toàn sức mạnh của nguyên văn mà không áp đặt một mô hình cánh chung hoặc quan niệm tất định cụ thể.
- issue: Phạm vi nghĩa của τὸ τέλος
  choice: Dịch là “kết cuộc”.
  alternative: “tận thế” hoặc “điểm cuối”
  rationale: “Tận thế” có thể đưa vào một thuật ngữ giáo lý cụ thể hơn điều từ Hy Lạp tự nó xác định, còn “điểm cuối” thiếu tự nhiên trong văn mạch. “Kết cuộc” giữ được ý về sự cuối cùng và độ mở của nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “anh em” phù hợp với lời Chúa Giê-su nói cùng một nhóm môn đồ, đồng thời tránh lối xưng hô quá cổ. Câu văn giữ nhịp cảnh báo ngắn gọn của nguyên bản và không áp đặt một hệ thống giải thích thời kỳ cuối cùng.
