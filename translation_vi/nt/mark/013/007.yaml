    issue: “kết cuộc” có thể lệch về nghĩa ‘kết quả/outcome’
    rationale: τὸ τέλος trong cấu trúc οὔπω τὸ τέλος nói về “sự kết thúc/the end” chưa đến. Trong cách dùng tiếng Việt thông thường, “kết cuộc” dễ được hiểu là kết quả cuối cùng hoặc sự ngã ngũ, nên kém trực tiếp hơn đối với ý điểm kết thúc của nguyên văn.
