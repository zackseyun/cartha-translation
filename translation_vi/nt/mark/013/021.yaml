  verdict: revise
  source_fidelity: Bản dịch truyền đạt đúng cấu trúc điều kiện khái quát, đối lập không gian “ở đây/ở đó”, tước hiệu ὁ χριστός là “Đấng Mê-si”, và mệnh lệnh phủ định số nhiều. Việc không thêm tân ngữ cho “đừng tin” thích hợp, vì πιστεύετε để tân ngữ hàm ẩn.
