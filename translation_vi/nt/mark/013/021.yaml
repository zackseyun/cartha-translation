  terminology: “Đấng Mê-si” phản ánh χριστός như một tước hiệu trong bối cảnh các tuyên bố cứu thế, phù hợp hơn việc biến thành tên riêng. “Anh em” là cách xưng hô Kinh Thánh tự nhiên cho ngôi thứ hai số nhiều trong ngữ cảnh diễn từ này.
