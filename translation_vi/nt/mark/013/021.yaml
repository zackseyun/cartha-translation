  text: ⸀καὶ τότε ἐάν τις ὑμῖν εἴπῃ· ⸀Ἴδε ὧδε ὁ ⸀χριστός, ⸁Ἴδε ἐκεῖ, μὴ πιστεύετε·
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/021.yaml
  text: And then[a], if anyone says to you, ‘Look, here is the Messiah!’ or, ‘Look, there!’ do not believe it.
translation:
  language: vi
  text: 'Và khi ấy, nếu có ai nói với anh em: “Kìa, Đấng Mê-si ở đây!” hoặc: “Kìa, ở đó!” thì đừng tin.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ τότε
  choice: Rồi khi ấy
  rationale: Giữ cả sắc thái nối kết của καί và ý nghĩa thời gian của τότε, đồng thời diễn đạt tự nhiên trong tiếng Việt.
- source_word: ἐάν τις ὑμῖν εἴπῃ
  choice: nếu có ai nói với anh em
  rationale: Diễn đạt điều kiện khái quát; τις là một người không xác định, còn ὑμῖν chỉ số nhiều.
- source_word: Ἴδε
  choice: Kìa
  rationale: Một tiếng gọi hướng sự chú ý, ngắn gọn và phù hợp với lời chỉ trỏ trực tiếp.
- source_word: ὧδε
  choice: ở đây
  rationale: Giữ nghĩa chỉ nơi chốn gần của trạng từ ὧδε.
- source_word: ὁ χριστός
  choice: Đấng Mê-si
  rationale: Trong ngữ cảnh này, χριστός có mạo từ và được dùng như tước hiệu của đấng được xức dầu mà người ta tuyên bố đã xuất hiện, chứ không chủ yếu như tên riêng.
- source_word: ἐκεῖ
  choice: ở đó
  rationale: Giữ sự đối lập nơi chốn với ὧδε, theo cách nói tự nhiên trong tiếng Việt.
- source_word: μὴ πιστεύετε
  choice: đừng tin
  rationale: Tiếng Hy Lạp không nêu rõ tân ngữ, vì vậy bản dịch không thêm ‘người ấy’ hay ‘điều đó’, nhằm giữ độ mở của lời cảnh báo.
theological_decisions:
- issue: Cách dịch Χριστός
  choice: Đấng Mê-si
  alternative: Đấng Christ
  rationale: Ở đây từ này mang chức năng tước hiệu trong lời tuyên bố về một nhân vật cứu thế. ‘Đấng Mê-si’ giữ rõ nghĩa ‘đấng được xức dầu’ và sắc thái Do Thái của tước hiệu mà không đồng nhất hóa nó thành tên riêng.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng ‘anh em’ cho đại từ số nhiều ὑμῖν; giữ nhịp cảnh báo trực tiếp và không bổ sung tân ngữ cho ‘đừng tin’.
