reference: Mark 13:20
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ εἰ μὴ ⸂ἐκολόβωσεν κύριος⸃ τὰς ἡμέρας, οὐκ ἂν ἐσώθη πᾶσα σάρξ. ἀλλὰ διὰ τοὺς ἐκλεκτοὺς οὓς ἐξελέξατο ἐκολόβωσεν τὰς ἡμέρας.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/020.yaml
  text: And if the Lord had not cut short the days[a], no flesh would have been saved. But for the sake of the elect, whom he chose, he cut short the days.
translation:
  language: vi
  text: Nếu Chúa đã không rút ngắn những ngày ấy, thì không một người nào được cứu[a]. Nhưng vì những người được chọn, tức là những người Ngài đã chọn, Ngài đã rút ngắn những ngày ấy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “không một xác thịt nào”; nghĩa là “không một con người nào” hoặc “không ai.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκολόβωσεν
  choice: rút ngắn
  rationale: Động từ κολοβόω có nghĩa là làm ngắn đi hoặc cắt bớt. “Rút ngắn” tự nhiên trong tiếng Việt hiện đại và được dùng nhất quán ở cả hai lần xuất hiện.
- source_word: κύριος
  choice: Chúa
  rationale: κύριος chỉ một chủ thể xác định trong ngữ cảnh; “Chúa” là cách dịch trang trọng, tự nhiên và không cần thêm mạo từ như trong tiếng Anh.
- source_word: τὰς ἡμέρας
  choice: những ngày ấy
  rationale: Cụm từ chỉ những ngày hoạn nạn vừa được nói đến. Từ “ấy” làm rõ sự quy chiếu trong tiếng Việt mà không giải thích quá mức.
- source_word: οὐκ ἂν ἐσώθη
  choice: không một người nào được cứu
  rationale: Cấu trúc với ἄν diễn tả kết quả phản thực. “Được cứu” giữ nghĩa trực tiếp của σῴζω, trong khi ngữ cảnh cho thấy trước hết đây là sự bảo toàn mạng sống.
- source_word: πᾶσα σάρξ
  choice: không một người nào
  rationale: Dưới tác động của phủ định, πᾶσα σάρξ có nghĩa là không một con người nào. Cách dịch này truyền đạt thành ngữ tự nhiên trong tiếng Việt; nghĩa đen “không một xác thịt nào” được giữ trong chú thích.
- source_word: διὰ τοὺς ἐκλεκτούς
  choice: vì những người được chọn
  rationale: διά với đối cách ở đây nêu lý do hoặc điều được thực hiện vì lợi ích của một nhóm người. “Vì” gọn, tự nhiên và vẫn cho phép cả sắc thái nguyên nhân lẫn lợi ích.
- source_word: ἐκλεκτούς
  choice: những người được chọn
  rationale: Cách dịch này rõ nghĩa với độc giả phổ thông và không áp đặt một hệ thống thần học cụ thể về sự tuyển chọn.
- source_word: οὓς ἐξελέξατο
  choice: là những người Ngài đã chọn
  rationale: Cụm giải thích giữ lại sự lặp ý có chủ đích giữa ἐκλεκτούς và ἐξελέξατο, đồng thời diễn đạt rõ quan hệ trong tiếng Việt.
theological_decisions:
- issue: Ý nghĩa của “được cứu” trong ngữ cảnh
  choice: Giữ cách nói “được cứu”, với sự bảo toàn mạng sống con người trong hoạn nạn là nghĩa trực tiếp theo ngữ cảnh.
  alternative: Dịch thu hẹp thành “sống sót”, hoặc hiểu hoàn toàn là sự cứu rỗi thuộc linh.
  rationale: Ngữ cảnh nói về những ngày tai họa được rút ngắn để con người khỏi bị diệt vong. Tuy vậy, giữ “được cứu” phản ánh σῴζω và tránh loại bỏ sắc thái rộng hơn của từ.
- issue: Đối tượng của “những người được chọn”
  choice: Giữ nguyên danh xưng của bản văn mà không xác định một học thuyết hệ phái về sự tuyển chọn.
  alternative: Diễn giải rõ là sự tuyển chọn tập thể hoặc sự tiền định cá nhân.
  rationale: Câu này khẳng định Chúa đã chọn những người ấy, nhưng không tự nó giải quyết các tranh luận rộng hơn về bản chất của sự tuyển chọn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “Ngài” dùng cho Chúa theo lối tôn kính phổ biến. Bản dịch tránh dùng “xác thịt” trong chính văn vì tiếng Việt hiện đại dễ hiểu cụm này theo nghĩa thân thể hoặc bản tính xác thịt, trong khi thành ngữ Hy Lạp ở đây chỉ toàn thể loài người.
