    issue: “đặt trên một cây sậy”
    rationale: Cụm này không tự nhiên và có thể gợi hình ảnh miếng bọt biển chỉ đặt ở phía trên cây sậy. περιθεὶς καλάμῳ mô tả việc đặt/gắn miếng bọt biển vào cây sậy để đưa lên.
