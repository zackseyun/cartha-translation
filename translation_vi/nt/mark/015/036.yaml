  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: δραμὼν δέ ⸂τις καὶ⸃ γεμίσας σπόγγον ὄξους ⸀περιθεὶς καλάμῳ ἐπότιζεν αὐτόν, λέγων· Ἄφετε ἴδωμεν εἰ ἔρχεται Ἠλίας καθελεῖν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/036.yaml
  text: Then someone ran[a], filled a sponge with sour wine, put it on a reed, and gave him a drink, saying, “Leave him alone[b]. Let us see whether Elijah is coming to take him down.”
translation:
  language: vi
  text: 'Có một người chạy đến, lấy một miếng bọt biển thấm đầy rượu chua[a], gắn vào một cây sậy rồi đang cho Đức Giê-su uống, và nói: “Hãy để yên[b]. Hãy xem Ê-li có đến đem người ấy xuống không.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Rượu chua” là loại rượu rẻ tiền có vị chua, không nhất thiết là giấm theo nghĩa gia vị hiện đại.
    reason: cultural_note
  - marker: b
    text: 'Cũng có thể dịch: “Khoan đã.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: δραμὼν δέ τις καὶ
  choice: Bấy giờ, có người chạy đến
  rationale: Diễn đạt tự nhiên chuỗi hành động mở đầu; τις chỉ một người không được xác định, còn καί không cần dịch riêng trong tiếng Việt.
- source_word: γεμίσας σπόγγον ὄξους
  choice: lấy một miếng bọt biển thấm đầy rượu chua
  rationale: ὄξος là rượu đã chua hoặc thức uống rượu có vị chua, không nhất thiết là giấm dùng làm gia vị ngày nay. Cách nói “thấm đầy” phù hợp tự nhiên với miếng bọt biển.
- source_word: περιθεὶς καλάμῳ
  choice: đặt trên một cây sậy
  rationale: Giữ nghĩa cụ thể của κάλαμος là cây sậy và diễn tả việc gắn hoặc đặt miếng bọt biển lên đó để đưa lên cao.
- source_word: ἐπότιζεν αὐτόν
  choice: cho Đức Giê-su uống
  rationale: Cách diễn đạt tự nhiên trong tiếng Việt; ngữ cảnh cho biết đại từ αὐτόν chỉ Đức Giê-su. Thể chưa hoàn thành có thể hàm ý hành động đang diễn ra hoặc được thực hiện, nhưng tiếng Việt không cần đánh dấu bằng một cấu trúc nặng nề.
- source_word: Ἄφετε
  choice: Cứ để vậy
  rationale: Giữ sắc thái mệnh lệnh ngưng can thiệp hoặc để nguyên tình trạng lúc ấy, đồng thời tránh thêm tân ngữ không có trong bản Hy Lạp.
- source_word: ἴδωμεν εἰ ἔρχεται Ἠλίας
  choice: Hãy xem Ê-li có đến ... không
  rationale: Diễn đạt tự nhiên cấu trúc khuyến nghị cùng xem và mệnh đề nghi vấn gián tiếp; thì hiện tại ἔρχεται giữ được tính cấp thời qua “có đến ... không”.
- source_word: καθελεῖν αὐτόν
  choice: đem ông ấy xuống
  rationale: Trong bối cảnh đóng đinh, καθαιρέω nói đến việc đưa một người từ trên thập tự giá xuống.
theological_decisions:
- issue: Ý của người nói trong mệnh lệnh Ἄφετε
  choice: Cứ để vậy
  alternative: 'Khoan đã; hoặc: Hãy để ông ấy yên'
  rationale: Động từ có thể là lời bảo những người khác ngưng can thiệp hay, theo lối nói trong ngữ cảnh, là “khoan đã”. Bản dịch chính giữ cách nói tương đối mở, còn chú thích bảo tồn phương án thành ngữ.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Đức Giê-su” trong lời trần thuật để làm rõ đại từ, nhưng giữ “ông ấy” trong lời của người tại hiện trường. Các dấu chú thích [a], [b] đều xuất hiện ngay sau từ hoặc cụm từ liên quan.
