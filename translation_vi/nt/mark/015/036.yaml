revisions:
- from: 'Bấy giờ, có người chạy đến, lấy một miếng bọt biển thấm đầy rượu chua[a], đặt trên một cây sậy rồi cho Đức Giê-su uống và nói: “Cứ để vậy[b]. Hãy xem Ê-li có đến đem ông ấy xuống không.”'
  to: 'Có một người chạy đến, lấy một miếng bọt biển thấm đầy rượu chua[a], gắn vào một cây sậy rồi đang cho Đức Giê-su uống, và nói: “Hãy để yên[b]. Hãy xem Ê-li có đến đem người ấy xuống không.”'
  rationale: Sửa cách diễn đạt hành động gắn miếng bọt biển vào cây sậy và mệnh lệnh Ἄφετε để câu tiếng Việt tự nhiên hơn và sát nghĩa hơn, không quyết định dứt khoát giữa sắc thái “để yên” và cách nói thành ngữ “khoan đã.” Thay “cho ... uống” bằng “đang cho ... uống” để phản ánh thể chưa hoàn thành của ἐπότιζεν. Giữ nguyên ý nghĩa, các tên riêng, thuật ngữ “rượu chua,” và hai neo chú thích.
