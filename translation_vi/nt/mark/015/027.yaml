base_translation:
  language: en
  yaml_path: translation/nt/mark/015/027.yaml
  text: And with him they crucify two robbers[a], one at his right and one at his left.
translation:
  language: vi
  text: Họ đóng đinh hai tên cướp[a] cùng với Ngài, một tên bên phải Ngài và một tên bên trái Ngài.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “bọn cướp” hoặc “bọn cướp có vũ trang”; nếu từ này được hiểu theo sắc thái chính trị, có thể là “những kẻ nổi loạn”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σὺν αὐτῷ
  choice: cùng với Ngài
  rationale: σύν với đối cách dative diễn tả sự đi cùng; cách dịch này tự nhiên và giữ rõ việc hai người bị đóng đinh cùng với Chúa Giê-xu.
- source_word: σταυροῦσιν
  choice: Họ đóng đinh
  rationale: Động từ hiện tại chủ động ngôi ba số nhiều là lối hiện tại lịch sử thường gặp trong Mác. Tiếng Việt có thể dùng dạng không đánh dấu thời này để kể sự việc sinh động mà không cần thêm từ chỉ quá khứ.
- source_word: δύο λῃστάς
  choice: hai tên cướp
  rationale: λῃστής có thể chỉ kẻ cướp, thổ phỉ hoặc người nổi dậy có hành vi bạo lực. “Tên cướp” rõ nghĩa, phổ thông và không áp đặt sắc thái chính trị mà câu này không xác định.
- source_word: ἕνα ἐκ δεξιῶν
  choice: một tên bên phải
  rationale: Thành ngữ ἐκ δεξιῶν trong ngữ cảnh này chỉ vị trí ở phía bên phải.
- source_word: ἕνα ἐξ εὐωνύμων αὐτοῦ
  choice: một tên bên trái Ngài
  rationale: εὐώνυμος là cách nói chỉ phía trái, đối xứng với phía phải; αὐτοῦ xác định vị trí tương quan với Chúa Giê-xu và được diễn đạt bằng “Ngài”.
theological_decisions:
- issue: Cách dịch λῃσταί trong trình thuật đóng đinh
  choice: những tên cướp
  alternative: bọn cướp; những kẻ nổi loạn
  rationale: Từ Hy Lạp có thể chỉ những kẻ cướp có vũ trang hoặc, trong một số bối cảnh, những người nổi dậy. Câu này không đủ cơ sở để xác định hàm ý chính trị, nên bản văn chính dùng nghĩa rộng và ghi các khả năng khác trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Ngài” dùng để quy chiếu đến Chúa Giê-xu; “tên” phù hợp với những người bị coi là tội phạm trong ngữ cảnh nhưng không bổ sung bản chất tội trạng ngoài danh từ Hy Lạp. Trật tự câu được điều chỉnh cho tự nhiên trong tiếng Việt, đồng thời giữ hai vị trí đối xứng.
