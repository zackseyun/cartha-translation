  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὁ δὲ Πιλᾶτος βουλόμενος τῷ ὄχλῳ τὸ ἱκανὸν ποιῆσαι ἀπέλυσεν αὐτοῖς τὸν Βαραββᾶν, καὶ παρέδωκεν τὸν Ἰησοῦν φραγελλώσας ἵνα σταυρωθῇ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/015.yaml
  text: So Pilate[a], wanting to satisfy the crowd, released Barabbas to them; and after having Jesus flogged, he handed him over to be crucified.
translation:
  language: vi
  text: Vì muốn làm vừa lòng đám đông[a], Phi-lát thả Ba-ra-ba cho họ; rồi, sau khi cho đánh đòn Giê-su, ông giao nộp Giê-su để bị đóng đinh trên thập tự giá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “làm thỏa mãn đám đông.” Sát nghĩa: “làm điều đủ cho đám đông.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: βουλόμενος
  choice: muốn
  rationale: Diễn đạt tự nhiên ý muốn và chủ ý của Phi-lát mà không nhấn quá mức đến sự cân nhắc.
- source_word: τῷ ὄχλῳ τὸ ἱκανὸν ποιῆσαι
  choice: làm vừa lòng đám đông
  rationale: Thành ngữ chỉ việc đáp ứng đòi hỏi của đám đông. Cách dịch này tự nhiên trong tiếng Việt và vẫn giữ sắc thái Phi-lát chiều theo áp lực của họ.
- source_word: ἀπέλυσεν αὐτοῖς
  choice: thả Ba-ra-ba cho họ
  rationale: Trong bối cảnh xét xử, ἀπολύω là thả một tù nhân; đại từ ở cách dữ được giữ bằng “cho họ”.
- source_word: παρέδωκεν
  choice: giao Ngài
  rationale: Giữ ý trao Đức Chúa Jêsus vào quyền xử lý của người khác và duy trì sức nặng của động từ quan trọng trong trình thuật thương khó.
- source_word: φραγελλώσας
  choice: sau khi cho đánh đòn
  rationale: Phân từ bất định cho biết việc đánh đòn xảy ra trước hành động giao nộp; “cho đánh đòn” phản ánh việc Phi-lát ra lệnh thực hiện.
- source_word: ἵνα σταυρωθῇ
  choice: để bị đóng đinh vào thập tự giá
  rationale: Diễn đạt mục đích hoặc kết quả dự định của việc giao nộp, đồng thời giữ thể bị động của động từ Hy Lạp.
- source_word: Βαραββᾶν
  choice: Ba-ra-ba
  rationale: Phiên âm tên riêng theo cách quen thuộc trong Kinh Thánh tiếng Việt.
- source_word: Ἰησοῦν
  choice: Đức Chúa Jêsus
  rationale: Dùng dạng tên gọi trang trọng, quen thuộc với độc giả Kinh Thánh tiếng Việt.
theological_decisions:
- issue: Động cơ của Phi-lát trong τῷ ὄχλῳ τὸ ἱκανὸν ποιῆσαι
  choice: Phi-lát muốn làm vừa lòng đám đông bằng cách đáp ứng đòi hỏi của họ
  alternative: Phi-lát muốn làm điều đủ để thỏa mãn đám đông
  rationale: Bản dịch chính truyền đạt sự nhượng bộ trước áp lực chính trị mà không thêm lời phán xét động cơ; chú thích bảo tồn hình thức sát chữ và nét nghĩa “thỏa mãn” của thành ngữ.
- issue: Tác nhân thực hiện việc đánh đòn
  choice: Phi-lát cho người đánh đòn Đức Chúa Jêsus
  alternative: Phi-lát tự tay đánh đòn Đức Chúa Jêsus
  rationale: Trong bối cảnh hành pháp La Mã, phân từ gắn với Phi-lát nhưng hành động được thực hiện theo lệnh ông; “cho đánh đòn” tránh hàm ý không có căn cứ rằng ông trực tiếp thi hành.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “đám đông” cho ὄχλος, “đánh đòn” cho hình phạt φραγελλόω, và cấu trúc tuần tự rõ ràng để phản ánh phân từ chỉ hành động có trước. Đại từ “Ngài” giữ văn phong tôn kính quen thuộc.
