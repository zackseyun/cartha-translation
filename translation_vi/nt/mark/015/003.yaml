  source_fidelity: 'Bản dịch truyền đạt đúng các yếu tố chính của câu Hy Lạp: chủ ngữ số nhiều οἱ ἀρχιερεῖς là “Các thượng tế”; κατηγόρουν ở thì chưa hoàn thành được phản ánh tự nhiên bằng “cứ cáo buộc”; αὐτοῦ là người bị cáo buộc (“Ngài”); và πολλά là “về nhiều điều”. Việc không dịch riêng καὶ là chấp nhận được trong cú pháp tự nhiên của tiếng Việt.'
