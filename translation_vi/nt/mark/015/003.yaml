  text: καὶ κατηγόρουν αὐτοῦ οἱ ἀρχιερεῖς πολλά.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/003.yaml
  text: And the chief priests were accusing him of many things[a].
translation:
  language: vi
  text: Các thượng tế cứ cáo buộc Ngài về nhiều điều.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch sát hơn: “đưa ra nhiều lời cáo buộc chống lại Ngài.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: '[không dịch riêng]'
  rationale: Liên từ nối tiếp mạch kể; trong tiếng Việt, sự tiếp nối đã tự nhiên theo văn cảnh nên không cần thêm “và” ở đầu câu.
- source_word: κατηγόρουν
  choice: cứ cáo buộc
  rationale: Thì chưa hoàn thành diễn tả hành động đang tiếp diễn hoặc lặp đi lặp lại; “cứ cáo buộc” truyền đạt sắc thái kéo dài trong văn kể quá khứ.
- source_word: αὐτοῦ
  choice: Ngài
  rationale: Sở hữu cách đi với κατηγορέω chỉ người bị cáo buộc. “Ngài” là đại từ tôn kính, tự nhiên trong văn Kinh Thánh tiếng Việt khi nói về Chúa Giê-su.
- source_word: οἱ ἀρχιερεῖς
  choice: các thượng tế
  rationale: Chỉ giới lãnh đạo tư tế, không phải nhiều người đồng thời giữ chức thầy tế lễ thượng phẩm duy nhất; “các thượng tế” là cách gọi quen thuộc và chính xác.
- source_word: πολλά
  choice: về nhiều điều
  rationale: Dạng trung tính số nhiều chỉ nhiều vấn đề làm nội dung cáo buộc, không nhất thiết hàm ý các cáo trạng pháp lý đã được định thức.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Cứ” giữ sắc thái tiếp diễn của động từ Hy Lạp; “cáo buộc” phù hợp bối cảnh xét xử mà không diễn giải quá mức thành các cáo trạng chính thức.
