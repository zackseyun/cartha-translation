  text: ὁ δὲ Ἰησοῦς ἀφεὶς φωνὴν μεγάλην ἐξέπνευσεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/037.yaml
  text: But Jesus[a], uttering a loud cry[b], breathed his last.
translation:
  language: vi
  text: Nhưng Đức Giê-su kêu lớn một tiếng[a], rồi trút hơi thở cuối cùng[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “cất tiếng kêu lớn” hoặc “kêu lên lớn tiếng”.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “tắt thở” hoặc đơn giản là “chết”; theo nghĩa đen là “thở ra”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Nhưng
  rationale: Đây là một liên từ chuyển ý nhẹ. “Nhưng” giữ được bước ngoặt và nét tương phản trang nghiêm trong diễn tiến câu chuyện, dù cũng có thể dịch là “và” hoặc “bấy giờ” tùy cách nối mạch văn.
- source_word: ἀφεὶς
  choice: kêu
  rationale: Phân từ của ἀφίημι đi với φωνὴν μεγάλην mang nghĩa phát ra một âm thanh. Trong tiếng Việt, “kêu lớn một tiếng” diễn đạt tự nhiên hành động bật ra tiếng kêu.
- source_word: φωνὴν μεγάλην
  choice: lớn một tiếng
  rationale: φωνή có thể chỉ tiếng, giọng hoặc tiếng kêu; μεγάλην ở đây nói đến cường độ. Toàn cụm được đảo thành cách nói tự nhiên “kêu lớn một tiếng” trong tiếng Việt.
- source_word: ἐξέπνευσεν
  choice: trút hơi thở cuối cùng
  rationale: Động từ ἐκπνέω theo nghĩa đen liên quan đến thở ra và theo ngữ cảnh là chết. Cách dịch này vừa truyền đạt rõ cái chết vừa giữ hình ảnh hơi thở của nguyên văn, không thêm ý “trao linh hồn” từ cách diễn đạt của các sách Phúc Âm khác.
- source_word: ὁ δὲ Ἰησοῦς
  choice: Nhưng Đức Giê-su
  rationale: Mạo từ Hy Lạp trước tên riêng không cần dịch riêng. “Đức Giê-su” là cách gọi trang trọng, quen thuộc trong tiếng Việt; liên từ δὲ được thể hiện bằng “Nhưng”.
theological_decisions:
- issue: Diễn tả cái chết của Đức Giê-su mà không thêm sắc thái thần học ngoài nguyên văn
  choice: trút hơi thở cuối cùng
  alternative: chết; tắt thở; trao linh hồn
  rationale: Bản dịch đã chọn giữ hình ảnh thân thể và hơi thở hàm chứa trong ἐξέπνευσεν. “Trao linh hồn” dễ đưa vào câu này cách diễn đạt và sắc thái thần học từ những đoạn Phúc Âm khác nên không được dùng trong chính văn.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và dễ hiểu. Cấu trúc “kêu lớn một tiếng” tự nhiên trong tiếng Việt, còn “trút hơi thở cuối cùng” giữ được hình ảnh và sự cô đọng trang trọng của nguyên văn.
