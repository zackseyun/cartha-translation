id: MRK.15.41
reference: Mark 15:41
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸀αἳ ὅτε ἦν ἐν τῇ Γαλιλαίᾳ ἠκολούθουν αὐτῷ καὶ διηκόνουν αὐτῷ, καὶ ἄλλαι πολλαὶ αἱ συναναβᾶσαι αὐτῷ εἰς Ἱεροσόλυμα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/041.yaml
  text: These women[a], when he was in Galilee, used to follow him and minister to him[b]; and there were many other women who had gone up with him to Jerusalem.
translation:
  language: vi
  text: Những phụ nữ ấy, khi Ngài còn ở Ga-li-lê, thường đi theo và phục vụ Ngài[a]. Cũng có nhiều phụ nữ khác đã cùng Ngài đi lên Giê-ru-sa-lem[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “chăm lo cho Ngài” hoặc “giúp đỡ Ngài.” Động từ Hy Lạp có thể chỉ sự phục vụ hay hỗ trợ thiết thực.
    reason: lexical_alternative
  - marker: b
    text: Nguyên văn là “đi lên Giê-ru-sa-lem,” theo cách nói quen thuộc trong Kinh Thánh về hành trình đến thành này.
    reason: cultural_note
lexical_decisions:
- source_word: αἳ
  choice: Những phụ nữ ấy
  rationale: Đại từ quan hệ giống cái số nhiều quy chiếu về những phụ nữ được nêu ở câu trước. Cách diễn đạt này tạo thành câu tiếng Việt tự nhiên mà vẫn giữ rõ mối liên hệ hồi chỉ.
- source_word: ὅτε ἦν ἐν τῇ Γαλιλαίᾳ
  choice: khi Ngài còn ở Ga-li-lê
  rationale: Diễn đạt tự nhiên mệnh đề thời gian; từ “còn” gợi đúng giai đoạn Ngài ở Ga-li-lê mà không thêm nội dung ngoài nguyên văn.
- source_word: ἠκολούθουν
  choice: thường đi theo
  rationale: Thì chưa hoàn thành biểu thị hành động có tính kéo dài hoặc lặp lại trong quá khứ. “Thường đi theo” thể hiện rõ việc họ liên tục theo Ngài trong thời gian ở Ga-li-lê.
- source_word: διηκόνουν αὐτῷ
  choice: phục vụ Ngài
  rationale: Động từ διακονέω chỉ sự phục vụ, chăm lo hoặc hỗ trợ thực tế. “Phục vụ” có sắc thái rộng và trang trọng, không thu hẹp hành động vào một loại công việc cụ thể.
- source_word: ἄλλαι πολλαὶ
  choice: nhiều phụ nữ khác
  rationale: Giống cái số nhiều được diễn đạt minh nhiên bằng “phụ nữ” để câu tiếng Việt rõ nghĩa.
- source_word: αἱ συναναβᾶσαι αὐτῷ
  choice: đã cùng Ngài đi lên
  rationale: Phân từ aorist cho thấy hành động xảy ra trước khung cảnh đang được thuật lại; “cùng Ngài đi lên” vừa tự nhiên vừa giữ thành ngữ chỉ hành trình lên Giê-ru-sa-lem.
- source_word: εἰς Ἱεροσόλυμα
  choice: Giê-ru-sa-lem
  rationale: Diễn đạt đích đến của hành trình theo cách thông dụng trong tiếng Việt.
theological_decisions:
- issue: Tính chất sự phục vụ của các phụ nữ trong διηκόνουν
  choice: phục vụ Ngài
  alternative: chăm lo cho Ngài; giúp đỡ Ngài
  rationale: “Phục vụ” giữ được phạm vi rộng của động từ Hy Lạp, nhìn nhận vai trò hỗ trợ tích cực của các phụ nữ nhưng không biến từ này thành một chức vụ giáo hội về sau hoặc giới hạn nó vào việc nội trợ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” để quy chiếu Đức Giê-su theo ngữ cảnh, “thường” để thể hiện sắc thái tập quán của thì chưa hoàn thành, và giữ cách nói “đi lên Giê-ru-sa-lem” kèm chú thích văn hóa.
