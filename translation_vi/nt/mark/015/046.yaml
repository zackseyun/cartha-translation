  to: Sau khi mua một tấm vải lanh[a], ông hạ Ngài xuống, lấy tấm vải ấy quấn Ngài, rồi đặt Ngài vào một ngôi mộ đã được khoét trong đá. Sau đó, ông lăn một tảng đá chặn lối vào mộ[b].
