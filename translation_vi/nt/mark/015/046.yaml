  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἀγοράσας ⸀σινδόνα καθελὼν αὐτὸν ἐνείλησεν τῇ σινδόνι καὶ ⸀ἔθηκεν αὐτὸν ἐν ⸀μνημείῳ ὃ ἦν λελατομημένον ἐκ πέτρας, καὶ προσεκύλισεν λίθον ἐπὶ τὴν θύραν τοῦ μνημείου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/046.yaml
  text: And after buying a linen cloth[a], he took him down, wrapped him in the linen cloth, and laid him in a tomb that had been cut out of rock[c][b]. Then he rolled a stone against the entrance of the tomb.
translation:
  language: vi
  text: Sau khi mua một tấm vải lanh[a], ông hạ Ngài xuống, lấy tấm vải ấy quấn Ngài, rồi đặt Ngài vào một ngôi mộ đã được khoét trong đá. Sau đó, ông lăn một tảng đá chặn lối vào mộ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “tấm vải liệm” hoặc “tấm khăn lanh”.
    reason: lexical_alternative
  - marker: b
    text: Hay “lăn một tảng đá áp vào cửa mộ”; từ Hy Lạp có thể chỉ “cửa” hoặc “lối vào”.
    reason: lexical_alternative
lexical_decisions:
- source_word: σινδόνα / σινδόνι
  choice: một tấm vải gai / tấm vải ấy
  rationale: σινδών chỉ một tấm vải lanh có thể dùng để khâm liệm. “Tấm vải gai” là cách gọi tự nhiên, dễ hiểu trong tiếng Việt Kinh Thánh; “ấy” ở lần thứ hai làm rõ đó là chính tấm vải vừa mua mà không thêm ý nghĩa.
- source_word: καθελών
  choice: hạ Ngài xuống
  rationale: Trong ngữ cảnh, καθαιρέω nói đến việc đưa thân thể Chúa Giê-su xuống khỏi thập tự giá. “Hạ ... xuống” ngắn gọn và chính xác.
- source_word: ἐνείλησεν
  choice: quấn Ngài
  rationale: Động từ diễn tả việc quấn hoặc bọc quanh. “Quấn” tự nhiên trong ngữ cảnh mai táng và không thêm chi tiết ngoài nguyên văn.
- source_word: ἔθηκεν
  choice: đặt Ngài
  rationale: “Đặt” chuyển tải nghĩa phổ thông của τίθημι với sắc thái trang trọng vừa phải, thích hợp với việc an táng.
- source_word: μνημείῳ / μνημείου
  choice: một ngôi mộ / mộ
  rationale: μνημεῖον ở đây là nơi chôn cất có cấu trúc được khoét trong đá; “ngôi mộ” diễn đạt đúng hơn một huyệt mộ thông thường.
- source_word: λελατομημένον ἐκ πέτρας
  choice: đã được đục trong vách đá
  rationale: Phân từ hoàn thành bị động diễn tả trạng thái đã hoàn tất. “Đục trong vách đá” cho thấy ngôi mộ được khoét vào khối đá tự nhiên, phù hợp với πέτρα.
- source_word: προσεκύλισεν
  choice: lăn ... chặn
  rationale: Động từ chỉ việc lăn tới hoặc lăn áp vào. Kết hợp “lăn” với “chặn cửa mộ” diễn đạt tự nhiên hành động đóng kín lối vào.
- source_word: ἐπὶ τὴν θύραν τοῦ μνημείου
  choice: chặn cửa mộ
  rationale: θύρα có thể chỉ cửa hoặc lối vào. Trong tiếng Việt, “cửa mộ” tự nhiên và có thể chỉ chính phần mở của mộ, còn “chặn” thể hiện tác dụng của hòn đá được lăn áp vào đó.
- source_word: ἀγοράσας
  choice: sau khi mua
  rationale: Phân từ bất định chỉ hành động xảy ra trước các hành động chính; “sau khi mua” thể hiện rõ trình tự và tự nhiên trong tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và dễ hiểu. Dùng “Ngài” để quy chiếu Chúa Giê-su trong mạch tường thuật, và “ông” cho Giô-sép theo ngữ cảnh câu trước. Cấu trúc câu giữ rõ trình tự các hành động mà không mô phỏng cứng chuỗi liên từ Hy Lạp.
