  text: ἐγίνωσκεν γὰρ ὅτι διὰ φθόνον παραδεδώκεισαν αὐτὸν οἱ ἀρχιερεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/010.yaml
  text: For he knew that the chief priests had handed him over because of envy[a].
translation:
  language: vi
  text: Vì ông biết rằng các thượng tế đã nộp Đức Giê-su vì lòng đố kỵ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “do lòng ganh ghét.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγίνωσκεν
  choice: ông biết
  rationale: Thì chưa hoàn thành diễn tả nhận thức đang có hoặc đã ổn định của Phi-lát; tiếng Việt tự nhiên dùng “ông biết”.
- source_word: γὰρ
  choice: Vì
  rationale: Nêu lý do giải thích cho lời kể ngay trước đó và giữ rõ mối liên kết diễn ngôn.
- source_word: ὅτι
  choice: rằng
  rationale: Dẫn vào nội dung điều Phi-lát biết.
- source_word: διὰ φθόνον
  choice: vì lòng đố kỵ
  rationale: διά với đối cách chỉ nguyên nhân; φθόνος nói đến sự đố kỵ hoặc ganh ghét trước điều người khác có.
- source_word: παραδεδώκεισαν
  choice: đã nộp
  rationale: Thì quá khứ hoàn thành chỉ hành động xảy ra trước nhận thức được thuật lại; “nộp” phù hợp bối cảnh các lãnh đạo tôn giáo giao Đức Giê-su cho nhà cầm quyền, không thêm sắc thái “phản bội”.
- source_word: αὐτὸν
  choice: Đức Giê-su
  rationale: Đại từ chỉ Đức Giê-su; nêu lại danh xưng giúp câu tiếng Việt rõ chủ thể được giao nộp.
- source_word: οἱ ἀρχιερεῖς
  choice: các thượng tế
  rationale: Cách gọi quen thuộc trong tiếng Việt đối với giới lãnh đạo tư tế được chỉ bằng danh từ số nhiều này.
theological_decisions:
- issue: Động cơ của các thượng tế
  choice: Câu văn nói Phi-lát biết họ nộp Đức Giê-su vì lòng đố kỵ.
  alternative: Có thể diễn đạt φθόνος là “lòng ganh ghét”.
  rationale: Bản dịch trình bày nguyên trạng sự đánh giá về động cơ trong lời kể, không gia tăng hay giải thích thần học vượt quá từ ngữ Hy Lạp.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Các thượng tế” theo cách dùng Kinh Thánh tiếng Việt phổ biến; “đố kỵ” giữ sắc thái động cơ của φθόνος, còn phương án gần nghĩa được ghi ở chú thích.
