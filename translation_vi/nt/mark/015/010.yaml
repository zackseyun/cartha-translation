  source_fidelity: 'Bản dịch phản ánh chính xác câu Hy Lạp: «Vì» giữ chức năng giải thích của γάρ; «ông biết rằng» truyền đạt ἐγίνωσκεν ὅτι tự nhiên; «đã nộp» phản ánh hợp lý sắc thái quá khứ hoàn thành của παραδεδώκεισαν; và «vì lòng đố kỵ» diễn đạt đúng nguyên nhân διὰ φθόνον. Việc nêu lại «Đức Giê-su» thay cho đại từ αὐτόν là rõ ràng và không thêm nghĩa.'
