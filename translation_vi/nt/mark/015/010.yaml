  terminology: «Đức Giê-su», «các thượng tế», «nộp», và «lòng đố kỵ» nhất quán với ngữ cảnh xét xử. Chú thích cung cấp lựa chọn gần nghĩa «lòng ganh ghét» mà không làm thay đổi khẳng định của câu.
