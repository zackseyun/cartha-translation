  text: καὶ ⸀ἐνδιδύσκουσιν αὐτὸν πορφύραν καὶ περιτιθέασιν αὐτῷ πλέξαντες ἀκάνθινον στέφανον·
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/017.yaml
  text: And they dress him in purple[a], and after weaving a crown of thorns, they place it on him.
translation:
  language: vi
  text: Họ mặc cho Ngài áo màu tím[a], rồi kết một mão gai và đội lên đầu Ngài.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “khoác vải tím cho Ngài”; nguyên văn Hy Lạp không nói rõ là “áo” trong câu này, dù ngữ cảnh hàm ý một thứ y phục.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνδιδύσκουσιν
  choice: mặc ... cho
  rationale: Động từ chỉ việc khoác y phục lên một người; cách diễn đạt này tự nhiên trong tiếng Việt và giữ được ý tác động lên Chúa Giê-su.
- source_word: πορφύραν
  choice: áo màu tím
  rationale: Danh từ có thể chỉ vải tím hoặc y phục màu tím. Trong tiếng Việt, chỉ nói “màu tím” sau động từ “mặc” không đủ tự nhiên, nên thêm “áo” theo hàm ý rõ ràng của ngữ cảnh, đồng thời ghi chú rằng nguyên văn không nêu danh từ áo.
- source_word: περιτιθέασιν
  choice: đội lên đầu Ngài
  rationale: Động từ có nghĩa đặt quanh hoặc đặt lên. Với mão, “đội lên đầu” là cách nói tự nhiên và làm rõ hành động vốn được ngữ cảnh xác định.
- source_word: πλέξαντες
  choice: rồi kết
  rationale: Phân từ aorist diễn tả hành động kết mão xảy ra trước khi đội mão; “rồi” truyền đạt trình tự ấy gọn và tự nhiên.
- source_word: ἀκάνθινον
  choice: gai
  rationale: Tính từ chỉ vật làm bằng gai; cụm “mão gai” là tiếng Việt tự nhiên, hàm ý mão được kết từ gai.
- source_word: στέφανον
  choice: mão
  rationale: Trong cảnh nhạo báng vương quyền, “mão” truyền đạt vật đội đầu mang tính hoàng gia rõ hơn “vòng”, đồng thời giữ được sắc thái mỉa mai của trình thuật.
theological_decisions:
- issue: Hình ảnh nhạo báng vương quyền trong sự sỉ nhục Chúa Giê-su
  choice: Dùng “mão” cho στέφανος.
  alternative: vòng; vòng hoa
  rationale: Áo màu tím và mão gai tạo nên màn chế giễu vương quyền. “Mão” giữ được ý nghĩa hoàng gia trong ngữ cảnh mà không thêm lời giải thích thần học vào câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” để chỉ Chúa Giê-su. Cấu trúc câu giữ nhịp kể liên tiếp của nguyên văn nhưng diễn đạt trình tự của phân từ bằng “rồi” cho tự nhiên trong tiếng Việt.
