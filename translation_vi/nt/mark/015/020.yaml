  text: καὶ ὅτε ἐνέπαιξαν αὐτῷ, ἐξέδυσαν αὐτὸν τὴν πορφύραν καὶ ἐνέδυσαν αὐτὸν τὰ ἱμάτια ⸂τὰ ἴδια⸃. καὶ ἐξάγουσιν αὐτὸν ἵνα ⸀σταυρώσωσιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/020.yaml
  text: And when they had mocked him, they stripped the purple robe off him and put his own clothes on him. And they lead him out to crucify him.
translation:
  language: vi
  text: Khi đã chế nhạo Ngài xong, họ cởi áo choàng màu tím[a] khỏi Ngài rồi mặc lại quần áo của Ngài. Sau đó, họ dẫn Ngài ra ngoài để đóng đinh Ngài trên thập tự giá.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn Hy Lạp chỉ nói “màu tím,” với loại y phục được hiểu theo ngữ cảnh; cũng có thể dịch là “áo màu tím” hoặc “áo khoác màu tím.”
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “hầu cho họ đóng đinh Ngài trên thập tự giá.” Tiếng Hy Lạp dùng một mệnh đề chỉ mục đích.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνέπαιξαν
  choice: chế nhạo
  rationale: Diễn đạt trực tiếp hành động nhạo báng, giữ được sắc thái nghiêm trang của trình thuật.
- source_word: ἐξέδυσαν αὐτὸν τὴν πορφύραν
  choice: họ cởi áo choàng màu tím khỏi Ngài
  rationale: Động từ chỉ việc cởi y phục khỏi một người; πορφύραν nói gọn là “màu tím,” với loại y phục được hiểu theo ngữ cảnh. “Áo choàng” làm rõ điều hàm ẩn từ câu 17.
- source_word: ἐνέδυσαν αὐτὸν τὰ ἱμάτια τὰ ἴδια
  choice: mặc lại quần áo của Ngài cho Ngài
  rationale: Giữ hành động mặc y phục cho người khác và ý nghĩa quần áo riêng của Ngài; “lại” phù hợp diễn tiến họ trả lại y phục đã cởi trước đó.
- source_word: ἐξάγουσιν
  choice: họ dẫn Ngài ra ngoài
  rationale: Hiện tại lịch sử tạo tính sống động; tiếng Việt có thể dùng hình thức không đánh dấu thì mà vẫn tự nhiên trong mạch kể.
- source_word: ἵνα σταυρώσωσιν αὐτόν
  choice: để đóng đinh Ngài vào thập tự giá
  rationale: “Để” bảo toàn quan hệ mục đích của ἵνα; cách diễn đạt xác định rõ hình thức hành hình mà động từ Hy Lạp chỉ đến.
theological_decisions:
- issue: Cách gọi Đức Chúa Jêsus trong lời kể
  choice: Đức Chúa Jêsus / Ngài
  alternative: Jêsus / ông
  rationale: Dùng lối xưng hô tôn kính quen thuộc trong Kinh Thánh tiếng Việt nhưng không thêm nội dung thần học vào các hành động được kể.
- issue: Mục đích của việc dẫn ra ngoài
  choice: để đóng đinh Ngài vào thập tự giá
  alternative: hầu cho họ có thể đóng đinh Ngài vào thập tự giá
  rationale: Giữ đúng mệnh đề mục đích mà không khiến câu văn nặng nề hoặc gợi sự bất định không cần thiết.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “chế nhạo,” “quần áo,” “dẫn ... ra ngoài” theo tiếng Việt tự nhiên; giữ sắc thái tôn kính bằng “Ngài” và tránh thêm diễn giải ngoài văn bản.
