revisions:
- from: Sau khi chế nhạo Đức Chúa Jêsus, họ cởi áo choàng màu tím[a] khỏi Ngài rồi mặc lại quần áo của Ngài cho Ngài. Sau đó, họ dẫn Ngài ra ngoài để đóng đinh Ngài vào thập tự giá.[b]
  to: Khi đã chế nhạo Ngài xong, họ cởi áo choàng màu tím[a] khỏi Ngài rồi mặc lại quần áo của Ngài. Sau đó, họ dẫn Ngài ra ngoài để đóng đinh Ngài trên thập tự giá.[b]
  rationale: Bản sửa tránh thêm danh hiệu không có trong nguyên ngữ, làm câu tiếng Việt trôi chảy hơn, và thay giới từ trong cách diễn đạt việc đóng đinh bằng cách nói tự nhiên, chính xác. Vẫn giữ “áo choàng màu tím” như sự làm rõ hợp ngữ cảnh, được hỗ trợ bằng chú thích; giữ “quần áo của Ngài” để phản ánh τὰ ἱμάτια τὰ ἴδια; và bảo toàn quan hệ mục đích của ἵνα bằng “để.”
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T09:00:27Z'
review_pass:
  verdict: revise
  source_fidelity: Bản dịch phản ánh đúng trình tự hành động, ý nghĩa của πορφύραν, việc hoàn lại y phục riêng, và mệnh đề mục đích ἵνα. Tuy nhiên, “Đức Chúa Jêsus” thêm một tước hiệu không có trong câu Hy Lạp (vốn dùng đại từ), còn “đóng đinh ... vào thập tự giá” không phải cách nói tự nhiên nhất trong tiếng Việt hiện đại.
  naturalness: “Mặc lại quần áo của Ngài cho Ngài” lặp và gượng. “Mặc lại quần áo của Ngài” diễn đạt tự nhiên mà vẫn rõ chủ thể được mặc. “Đóng đinh Ngài trên thập tự giá” tự nhiên và chính xác hơn “vào thập tự giá.”
  terminology: Dùng “Ngài” duy trì văn phong tôn kính mà không bổ sung danh hiệu. “Thập tự giá” và “đóng đinh” là thuật ngữ Kinh Thánh quen thuộc; “trên thập tự giá” nêu rõ nghĩa của σταυρόω mà không diễn giải thêm.
  issues:
  - severity: medium
    issue: “Đức Chúa Jêsus” thêm tước hiệu vào chỗ nguyên ngữ chỉ có đại từ αὐτῷ/αὐτόν.
    rationale: Tước hiệu có thể quen thuộc trong một truyền thống dịch thuật, nhưng không được biểu đạt trong câu này. “Ngài” giữ tham chiếu theo ngữ cảnh và sắc thái trang trọng mà không thêm nội dung.
  - severity: medium
    issue: “Mặc lại quần áo của Ngài cho Ngài” gượng và lặp đại từ.
    rationale: Tiếng Việt tự nhiên có thể lược “cho Ngài”; động từ “mặc” cùng ngữ cảnh đã cho biết họ mặc y phục lại cho người vừa bị cởi áo.
  - severity: low
    issue: “Đóng đinh Ngài vào thập tự giá” kém tự nhiên.
    rationale: Cụm “đóng đinh ... trên thập tự giá” là cách diễn đạt tiếng Việt rõ ràng và thông dụng hơn, vẫn chuyển tải chính xác động từ σταυρόω.
