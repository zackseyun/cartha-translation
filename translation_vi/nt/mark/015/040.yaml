  text: Ἦσαν δὲ καὶ γυναῖκες ἀπὸ μακρόθεν θεωροῦσαι, ἐν ⸀αἷς καὶ ⸀Μαρία ἡ Μαγδαληνὴ καὶ Μαρία ⸀ἡ Ἰακώβου τοῦ μικροῦ καὶ ⸀Ἰωσῆτος μήτηρ καὶ Σαλώμη,
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/040.yaml
  text: There were also women watching from a distance[a], among whom were Mary Magdalene, Mary the mother of James the younger and of Joses, and Salome[c][b],
translation:
  language: vi
  text: Cũng có những phụ nữ đang quan sát từ xa[a], trong số đó có Ma-ri Ma-đơ-len, Ma-ri, mẹ của Gia-cơ, người được gọi là Nhỏ[b], và Giô-sê[c], cùng Sa-lô-mê.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “từ đằng xa.”
    reason: lexical_alternative
  - marker: b
    text: “Nhỏ” có thể chỉ người trẻ hơn, vóc dáng nhỏ hơn hoặc ít nổi bật hơn; nguyên văn không xác định rõ.
    reason: lexical_alternative
  - marker: c
    text: Tên Hy Lạp ở đây là Iōsēs, một dạng khác với Iōsēph (Giô-sép).
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἦσαν δὲ καὶ γυναῖκες
  choice: Cũng có những phụ nữ
  rationale: Diễn đạt tự nhiên cấu trúc ἦσαν với δέ và καί, giữ ý bổ sung của καί mà không gượng ép dịch δέ thành một liên từ riêng.
- source_word: ἀπὸ μακρόθεν θεωροῦσαι
  choice: đứng nhìn từ xa
  rationale: θεωροῦσαι chỉ việc chăm chú quan sát đang tiếp diễn; “đứng nhìn” tự nhiên trong cảnh thuật dù tư thế đứng không được nhấn mạnh riêng, còn “từ xa” giữ đúng ý không gian của ἀπὸ μακρόθεν.
- source_word: ἐν αἷς
  choice: trong số đó có
  rationale: Xác định những người được nêu tên thuộc nhóm phụ nữ vừa nói đến, bằng cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: Μαρία ἡ Μαγδαληνή
  choice: Ma-ri Ma-đơ-len
  rationale: Dùng dạng tên riêng quen thuộc trong truyền thống Kinh Thánh tiếng Việt, đồng thời phản ánh biệt danh chỉ người đến từ Ma-đơ-la.
- source_word: Μαρία ἡ Ἰακώβου τοῦ μικροῦ καὶ Ἰωσῆτος μήτηρ
  choice: Ma-ri mẹ của Gia-cơ Nhỏ và Giô-sê
  rationale: μήτηρ chi phối cả hai sở hữu cách, nên Ma-ri được xác định là mẹ của cả Gia-cơ và Giô-sê. “Nhỏ” giữ được tính đa nghĩa của μικρός hơn “trẻ hơn,” vốn có thể thu hẹp nghĩa vào tuổi tác.
- source_word: Ἰωσῆτος
  choice: Giô-sê
  rationale: Phiên âm dạng tên Ἰωσῆς, không đồng nhất hóa với dạng Ἰωσήφ; chú thích làm rõ sự phân biệt trong nguyên ngữ.
- source_word: Σαλώμη
  choice: Sa-lô-mê
  rationale: Phiên âm tên riêng theo lối quen thuộc và dễ đọc trong tiếng Việt.
theological_decisions:
- issue: Ý nghĩa của τοῦ μικροῦ trong danh xưng của Gia-cơ
  choice: Gia-cơ Nhỏ
  alternative: Gia-cơ trẻ hơn; Gia-cơ bé nhỏ
  rationale: μικρός có thể nói đến tuổi, vóc dáng hoặc địa vị tương đối. “Nhỏ” bảo tồn độ mở của nguyên văn, còn chú thích nêu các khả năng mà không quyết định thay tác giả.
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Các tên riêng được phiên âm theo lối quen thuộc trong Kinh Thánh tiếng Việt. Bản dịch ưu tiên giữ sự mơ hồ thật sự của μικρός thay vì mặc định đó là sự phân biệt về tuổi.
