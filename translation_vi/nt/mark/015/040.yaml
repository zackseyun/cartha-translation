  to: Cũng có những phụ nữ đang quan sát từ xa[a], trong số đó có Ma-ri Ma-đơ-len, Ma-ri, mẹ của Gia-cơ, người được gọi là Nhỏ[b], và Giô-sê[c], cùng Sa-lô-mê.
  rationale: Sửa “đứng nhìn” thành “đang quan sát” để phản ánh tính tiếp diễn của phân từ hiện tại χωρίς thêm tư thế không có trong nguyên văn. Điều chỉnh cách trình bày định ngữ của Gia-cơ để tiếng Việt tự nhiên hơn và giữ sự mơ hồ ngữ nghĩa của μικρός. Các chú thích giữ đúng vị trí neo và chức năng của bản tiếng Anh, đồng thời chú thích về Giô-sê duy trì sự phân biệt dạng tên trong tiếng Hy Lạp.
