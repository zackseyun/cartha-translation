  text: καὶ ἦν ἡ ἐπιγραφὴ τῆς αἰτίας αὐτοῦ ἐπιγεγραμμένη· Ὁ βασιλεὺς τῶν Ἰουδαίων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/026.yaml
  text: 'And the inscription of the charge against him was written: “The King of the Jews.”[a]'
translation:
  language: vi
  text: 'Dòng chữ ghi tội danh của Ngài được viết như sau: “Vua dân Do Thái.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Vua của người Giu-đê.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιγραφή
  choice: dòng chữ
  rationale: Chỉ nội dung được viết và đặt trên hoặc phía trên thập tự giá; “dòng chữ” tự nhiên trong tiếng Việt và không thêm chi tiết về hình thức của tấm biển.
- source_word: αἰτία
  choice: tội danh của Ngài
  rationale: Trong ngữ cảnh xét xử, từ này chỉ căn cứ buộc tội được công bố; “tội danh” diễn đạt súc tích sắc thái pháp lý.
- source_word: ἐπιγεγραμμένη
  choice: được viết
  rationale: Kết cấu chu chuyển với ἦν cho biết dòng chữ ở trong trạng thái đã được viết; cách dịch này rõ ràng, tự nhiên và gần hình thức nguyên văn.
- source_word: βασιλεὺς
  choice: Vua
  rationale: Đây là tước hiệu nằm trong nội dung cáo buộc được niêm yết; viết hoa để thể hiện tước hiệu trong lời trích dẫn.
- source_word: Ἰουδαίων
  choice: dân Do Thái
  rationale: Trong tước hiệu thuộc trình thuật thương khó, từ này chỉ cộng đồng dân tộc–tôn giáo; “dân Do Thái” là cách gọi quen thuộc, tự nhiên trong tiếng Việt. Nghĩa địa lý khả dĩ “người Giu-đê” được ghi ở chú thích.
theological_decisions:
- issue: Cách dịch Ἰουδαίων trong tước hiệu đóng đinh
  choice: dân Do Thái
  alternative: người Giu-đê
  rationale: Cụm Ὁ βασιλεὺς τῶν Ἰουδαίων là tước hiệu/cáo trạng quen thuộc trong các trình thuật thương khó và ở đây phù hợp nhất với tên gọi của một dân tộc. Tuy nhiên, vì Ἰουδαῖος trong một số ngữ cảnh có thể mang nghĩa địa lý là “người Giu-đê,” chú thích bảo tồn khả năng ấy mà không ép văn bản theo một nghĩa hẹp.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Ngài” được dùng làm đại từ quy chiếu đến Chúa Giê-xu; câu giữ cấu trúc tường thuật ngắn gọn và bảo tồn riêng nội dung của dòng cáo trạng.
