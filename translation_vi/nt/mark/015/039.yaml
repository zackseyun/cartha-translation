source:
  edition: SBLGNT
  text: ἰδὼν δὲ ὁ κεντυρίων ὁ παρεστηκὼς ἐξ ἐναντίας αὐτοῦ ὅτι ⸀οὕτως ἐξέπνευσεν εἶπεν· Ἀληθῶς ⸂οὗτος ὁ ἄνθρωπος⸃ υἱὸς ⸂θεοῦ ἦν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/039.yaml
  text: When the centurion[a], who was standing opposite him, saw that he breathed his last in this way, he said, “Truly this man was God's Son.”
translation:
  language: vi
  text: 'Khi viên đại đội trưởng[a] đứng đối diện với Chúa Giê-su thấy Người trút hơi thở cuối cùng như vậy, ông nói: “Quả thật, người này là Con Đức Chúa Trời.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch lời cuối câu là: “Quả thật, người này là một người con của Đức Chúa Trời.” Cụm từ Hy Lạp có thể được hiểu theo nghĩa phẩm chất hoặc bất định, nhưng trong mạch văn sách Mác, nhiều khả năng cụm từ này mang sức nặng của danh hiệu “Con Đức Chúa Trời.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδὼν δὲ
  choice: Khi ... thấy
  rationale: Phân từ bất định ἰδών được hiểu theo thời gian; δέ chỉ nối ý nhẹ nên không cần dịch thành một từ tương phản riêng trong tiếng Việt.
- source_word: κεντυρίων
  choice: viên đại đội trưởng
  rationale: Chỉ sĩ quan La Mã chỉ huy khoảng một trăm quân; cách gọi này vừa dễ hiểu vừa giữ sắc thái quân sự cổ.
- source_word: ὁ παρεστηκὼς ἐξ ἐναντίας αὐτοῦ
  choice: đang đứng đối diện với Đức Chúa Jêsus
  rationale: Giữ ý về vị trí đứng đối diện; dùng danh xưng để làm rõ sở chỉ của đại từ trong câu tiếng Việt.
- source_word: ὅτι οὕτως ἐξέπνευσεν
  choice: thấy Ngài trút hơi thở cuối cùng như vậy
  rationale: ἐκπνέω diễn tả việc tắt thở; “trút hơi thở cuối cùng” tự nhiên và vẫn giữ hình ảnh của nguyên văn, còn οὕτως được giữ bằng “như vậy”.
- source_word: Ἀληθῶς
  choice: Quả thật
  rationale: Truyền đạt giọng xác quyết trang trọng của trạng từ Hy Lạp.
- source_word: οὗτος ὁ ἄνθρωπος
  choice: người này
  rationale: Cách diễn đạt tự nhiên trong lời chỉ về Đức Chúa Jêsus, không thêm ý ngoài nguyên văn.
- source_word: υἱὸς θεοῦ
  choice: Con Đức Chúa Trời
  rationale: Trong mạch văn Mác, cụm từ có sức nặng như một danh hiệu; tiếng Việt không dùng mạo từ nên vẫn giữ được phần nào độ mở ngữ pháp của nguyên văn.
- source_word: ἦν
  choice: là
  rationale: Dù ἦν là thì quá khứ, tiếng Việt thường dùng “là” trong lời nhận định về căn tính; dịch “đã là” dễ tạo hàm ý căn tính ấy không còn đúng.
theological_decisions:
- issue: Sắc thái của υἱὸς θεοῦ trong lời viên đại đội trưởng
  choice: Con Đức Chúa Trời
  alternative: một người con của thần
  rationale: Cụm Hy Lạp không có mạo từ và có thể được hiểu theo nghĩa phẩm chất hoặc bất định, nhưng trong toàn bộ trình thuật Mác, “Con Đức Chúa Trời” có sức nặng danh hiệu. Chú thích bảo lưu cách hiểu bất định mà không áp đặt nó lên chính văn.
- issue: Thì của ἦν trong lời tuyên bố
  choice: là
  alternative: đã là
  rationale: Tiếng Việt không bắt buộc đánh dấu quá khứ ở vị từ danh tính. “Là” chuyển tải lời nhận định tự nhiên hơn và tránh gợi ý thần học ngoài văn bản rằng tư cách làm Con đã chấm dứt.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. “Đại đội trưởng” được ưu tiên hơn từ vay mượn “bách nhân đội trưởng”; “trút hơi thở cuối cùng” giữ hình ảnh nguyên ngữ. Danh xưng “Đức Chúa Jêsus” làm rõ đại từ αὐτοῦ trong cấu trúc tiếng Việt.
