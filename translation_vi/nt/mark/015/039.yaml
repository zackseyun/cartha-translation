revisions:
- from: 'Khi viên đại đội trưởng[a] đang đứng đối diện với Đức Chúa Jêsus thấy Ngài trút hơi thở cuối cùng như vậy, ông nói: “Quả thật, người này là Con Đức Chúa Trời.”'
  to: 'Khi viên đại đội trưởng[a] đứng đối diện với Chúa Giê-su thấy Người trút hơi thở cuối cùng như vậy, ông nói: “Quả thật, người này là Con Đức Chúa Trời.”'
  rationale: Sửa chú thích để bảo lưu đúng phương án thay thế được nêu trong audit trail mà không đổi “Đức Chúa Trời” thành một thần bất định. Chuẩn hóa tên riêng thành “Giê-su” theo tiếng Việt hiện đại và giản lược nhẹ cấu trúc câu, trong khi giữ nguyên ý nghĩa của bản dịch.
