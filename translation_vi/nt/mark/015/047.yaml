base_translation:
  language: en
  yaml_path: translation/nt/mark/015/047.yaml
  text: And Mary Magdalene and Mary the mother of Joses were watching where he was laid[a].
translation:
  language: vi
  text: Còn Ma-ri Ma-đơ-len và Ma-ri, mẹ của Giô-sết,[a] quan sát xem Ngài đã được đặt ở đâu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát hơn: “Ma-ri của Giô-sết.” Tiếng Hy Lạp xác định Ma-ri này qua mối quan hệ với Giô-sết nhưng không nói rõ loại quan hệ ngay tại đây.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Còn
  rationale: Một từ nối nhẹ, tiếp tục trình thuật đồng thời chuyển sự chú ý sang hai người phụ nữ; “Còn” tự nhiên trong tiếng Việt và không tạo tương phản quá mạnh.
- source_word: Μαρία ἡ Μαγδαληνή
  choice: Ma-ri Ma-đơ-len
  rationale: Cách phiên âm rõ ràng, quen thuộc trong tiếng Việt, giữ tên riêng và danh xưng dùng để phân biệt người phụ nữ này.
- source_word: Μαρία ἡ Ἰωσῆτος
  choice: Ma-ri, mẹ của Giô-sết
  rationale: Nguyên văn chỉ nói “Ma-ri của Giô-sết”, diễn tả một quan hệ nhưng không nêu danh từ chỉ quan hệ. Theo cách nhận diện nhân vật trong văn mạch Mác, “mẹ của” là cách hiểu tự nhiên nhất; chú thích giữ lại tính hàm ẩn của tiếng Hy Lạp.
- source_word: ἐθεώρουν
  choice: vẫn quan sát
  rationale: Thì chưa hoàn thành chỉ hành động đang tiếp diễn trong quá khứ. “Vẫn quan sát” truyền đạt sự chú ý liên tục và nối hành động này với cảnh mai táng vừa kể.
- source_word: ποῦ
  choice: ở đâu
  rationale: Giữ đúng nghĩa trạng từ chỉ nơi chốn và tạo câu gián tiếp tự nhiên trong tiếng Việt.
- source_word: τέθειται
  choice: Ngài đã được đặt
  rationale: Thể hoàn thành bị động của τίθημι diễn tả hành động đã xảy ra với kết quả còn đó. Tiếng Việt cần nêu rõ chủ thể được hiểu ngầm là Đức Giê-su; “đã được đặt” giữ thể bị động và ý hoàn tất.
theological_decisions:
- issue: Chủ thể được hiểu ngầm của động từ bị động
  choice: Dùng “Ngài” để chỉ Đức Giê-su
  alternative: Dùng “thi thể Ngài” hoặc bỏ chủ thể
  rationale: Tiếng Hy Lạp để đối tượng được đặt ở dạng hàm ẩn vì văn mạch đã rõ. Tiếng Việt cần một chủ thể để câu tự nhiên; “Ngài” chỉ chính Đức Giê-su mà không thu hẹp đối tượng thành một thi thể vô nhân xưng.
- issue: Quan hệ giữa Ma-ri và Giô-sết
  choice: Diễn đạt trong chính văn là “mẹ của Giô-sết”
  alternative: Dịch sát là “Ma-ri của Giô-sết”
  rationale: Sở hữu cách Hy Lạp không gọi đích danh quan hệ. Văn mạch Mác 15:40 hỗ trợ mạnh cách hiểu đây là mẹ của Giô-sết, nhưng chú thích vẫn bảo tồn sự hàm ẩn về mặt hình thức.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và dễ hiểu. Dùng các dạng phiên âm “Ma-ri”, “Ma-đơ-len”, “Giô-sết”; cấu trúc “vẫn quan sát xem… ở đâu” giữ sắc thái tiếp diễn mà không nặng nề.
