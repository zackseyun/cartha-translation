  text: καὶ ἐπηρώτησεν αὐτὸν ὁ Πιλᾶτος· Σὺ εἶ ὁ βασιλεὺς τῶν Ἰουδαίων; ὁ δὲ ἀποκριθεὶς ⸂αὐτῷ λέγει⸃· Σὺ λέγεις.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/002.yaml
  text: And Pilate asked him[a], “Are you the king of the Jews?” And he answered him[b], “You say so.”
translation:
  language: vi
  text: 'Phi-lát hỏi Đức Giê-su[a]: “Ông có phải là vua dân Do Thái không?” Ngài đáp lời ông[b]: “Chính ông nói vậy.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cụm từ “vua dân Do Thái” ở đây phản ánh lời cáo buộc chính trị thường được đưa ra trước Phi-lát. Từ Hy Lạp cũng có thể được hiểu là “những người Giu-đê.”
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “Ông nói,” hoặc rõ hơn: “Đó là điều ông nói.” Lời đáp của Đức Giê-su rất ngắn gọn và vẫn có phần để ngỏ.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπηρώτησεν
  choice: hỏi
  rationale: Động từ có nghĩa là hỏi hoặc chất vấn. “Hỏi” tự nhiên trong tiếng Việt và không làm sắc thái trở nên quá mạnh như một cuộc thẩm vấn chính thức.
- source_word: Σὺ εἶ
  choice: Ông có phải là… không?
  rationale: Cấu trúc câu hỏi tiếng Việt này truyền đạt câu hỏi trực tiếp và giữ được phần nào sự nhấn mạnh vào đại từ Σὺ.
- source_word: βασιλεὺς
  choice: Vua
  rationale: Giữ nghĩa hoàng gia và sức nặng chính trị của lời cáo buộc; viết hoa trong tước hiệu trực tiếp “Vua dân Do Thái”.
- source_word: Ἰουδαίων
  choice: dân Do Thái
  rationale: Trong bối cảnh xét xử trước Phi-lát, đây là cách gọi quen thuộc trong tước hiệu chính trị “Vua dân Do Thái”; “người Giu-đê” vẫn là một khả năng từ vựng.
- source_word: ἀποκριθεὶς αὐτῷ λέγει
  choice: Ngài đáp
  rationale: Diễn đạt tự nhiên bằng tiếng Việt hành động trả lời được tạo bởi phân từ và động từ lịch sử hiện tại, không giữ một cấu trúc gượng ép.
- source_word: Σὺ λέγεις
  choice: Chính ông nói vậy
  rationale: Giữ đại từ được nhấn mạnh và tính hàm súc, gián tiếp của câu Hy Lạp, không biến lời đáp thành một lời khẳng định hoàn toàn rõ ràng.
theological_decisions:
- issue: Sức nặng của lời đáp Σὺ λέγεις
  choice: 'Một lời đáp dè dặt, có chủ ý để ngỏ: “Chính ông nói vậy.”'
  alternative: “Đúng, như ông nói” hoặc sát chữ hơn là “Ông nói.”
  rationale: Bản Hy Lạp không có từ “phải” hay “đúng.” Cách dịch này quy lời diễn đạt cho Phi-lát mà không biến câu trả lời thành sự xác nhận tuyệt đối hoặc lời phủ nhận.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “Đức Giê-su/Ngài” để phân biệt rõ nhân vật; Phi-lát xưng hô với Đức Giê-su bằng “ông,” phù hợp bối cảnh xét hỏi. Các dấu chú thích [a], [b] đều xuất hiện trong chính văn.
