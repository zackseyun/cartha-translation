  text: Καὶ οἱ παραπορευόμενοι ἐβλασφήμουν αὐτὸν κινοῦντες τὰς κεφαλὰς αὐτῶν καὶ λέγοντες· Οὐὰ ὁ καταλύων τὸν ναὸν καὶ ⸂οἰκοδομῶν ἐν τρισὶν ἡμέραις⸃,
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/029.yaml
  text: And those passing by were reviling him[a], shaking their heads and saying[b], “Aha! You who would tear down the temple and build it in three days,”
translation:
  language: vi
  text: 'Những người đi ngang qua lăng mạ Đức Chúa Jêsus, lắc đầu và nói: “Ha! Kẻ phá đền thờ[a] rồi xây trong ba ngày[b],”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay cụ thể hơn: “thánh điện”.'
    reason: lexical_alternative
  - marker: b
    text: 'Hoặc: “xây lại trong ba ngày”. Động từ Hy Lạp chỉ có nghĩa là “xây”, dù ngữ cảnh có thể hàm ý xây lại.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παραπορευόμενοι
  choice: những người đi ngang qua
  rationale: Diễn đạt tự nhiên hành động những người đang đi qua nơi đóng đinh.
- source_word: ἐβλασφήμουν
  choice: lăng mạ
  rationale: Trong ngữ cảnh, động từ chỉ lời xúc phạm, phỉ báng nhắm vào Đức Chúa Jêsus; “lăng mạ” truyền đạt rõ nghĩa mà không thu hẹp thành thuật ngữ “phạm thượng”.
- source_word: κινοῦντες τὰς κεφαλὰς αὐτῶν
  choice: lắc đầu
  rationale: Thành ngữ diễn tả cử chỉ chế nhạo, và “lắc đầu” là cách nói tự nhiên trong tiếng Việt hiện đại.
- source_word: Οὐὰ
  choice: Ha!
  rationale: Thán từ ở đây mang giọng giễu cợt; “Ha!” tự nhiên và giữ được sắc thái chế nhạo.
- source_word: ὁ καταλύων
  choice: Kẻ định phá
  rationale: Cụm phân từ có chức năng như lời gọi trực tiếp. “Định phá” phản ánh lời cáo buộc được nhắc lại mà không khẳng định người nói thật sự có ý định ấy.
- source_word: ναὸν
  choice: đền thờ
  rationale: Đây là cách gọi phổ thông và dễ hiểu; chú thích giữ nghĩa cụ thể hơn là khu vực thánh điện.
- source_word: οἰκοδομῶν ἐν τρισὶν ἡμέραις
  choice: xây lại trong ba ngày
  rationale: “Xây lại” thuận tự nhiên trong tiếng Việt sau động từ “phá”, dù nguyên ngữ chỉ nói “xây”; chú thích bảo lưu cách dịch sát hơn.
theological_decisions:
- issue: Ý nghĩa của lời nói về đền thờ
  choice: Dịch lời chế nhạo như một lời cáo buộc hoặc ám chỉ được những người qua đường nhắc lại, không giải thích “đền thờ” là thân thể Đức Chúa Jêsus trong chính văn.
  alternative: Dịch theo hướng giải thích để cho thấy Đức Chúa Jêsus nói ẩn dụ về thân thể Ngài.
  rationale: Mác trình bày lời chế nhạo theo góc nhìn của những người đứng xem tại cuộc đóng đinh. Bản dịch cần giữ nguyên góc nhìn tường thuật và sự căng thẳng thần học của câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Chúa Jêsus” làm đại từ quy chiếu rõ ràng; lời chế nhạo được giữ ngắn, mạnh và còn dang dở theo cấu trúc của câu gốc.
