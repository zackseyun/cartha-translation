id: MRK.15.35
reference: Mark 15:35
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καί τινες τῶν παρεστηκότων ἀκούσαντες ἔλεγον· ⸀Ἴδε Ἠλίαν φωνεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/035.yaml
  text: And some of those standing there[a], when they heard it, were saying, “Look, he is calling Elijah.”
translation:
  language: vi
  text: 'Có mấy người đang đứng đó, khi nghe vậy, thì nói: “Kìa, ông ấy đang gọi Ê-li.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Kìa, ông ấy đang gọi Ê-li đến.”'
    reason: Động từ φωνεῖ với tân ngữ chỉ người có thể được hiểu là gọi tên người ấy hoặc gọi người ấy đến; nguyên ngữ không nói rõ hơn.
lexical_decisions:
- source_word: καί
  choice: Có
  rationale: Trong tiếng Việt, mở câu bằng cấu trúc hiện hữu “Có mấy người...” nối tiếp trình thuật tự nhiên hơn việc dịch máy móc bằng “Và”, trong khi không thêm sắc thái thời gian.
- source_word: τινες
  choice: mấy người
  rationale: Diễn đạt tự nhiên một nhóm người không xác định; tương đương với “một vài người” nhưng gọn và phù hợp lời kể.
- source_word: τῶν παρεστηκότων
  choice: đang đứng đó
  rationale: Phân từ dùng như danh từ chỉ những người có mặt tại chỗ; cách dịch này giữ hình ảnh không gian cụ thể của nguyên ngữ.
- source_word: ἀκούσαντες
  choice: khi nghe vậy
  rationale: Diễn tả hành động xảy ra trước lời nói. “Vậy” quy chiếu tự nhiên đến tiếng kêu ngay trước đó của Đức Giê-su mà không giải thích quá mức.
- source_word: ἔλεγον
  choice: thì nói
  rationale: Tiếng Việt không mã hóa thể chưa hoàn thành như tiếng Hy Lạp; “thì nói” kể phản ứng đang diễn ra mà không buộc phải hiểu là lặp đi lặp lại.
- source_word: Ἴδε
  choice: Kìa
  rationale: Thán từ thu hút sự chú ý, tự nhiên trong lời nói và giữ sắc thái chỉ cho người khác nhận thấy điều đang xảy ra.
- source_word: Ἠλίαν
  choice: Ê-li
  rationale: Dùng dạng tên riêng quen thuộc trong tiếng Việt cho tiên tri Elijah.
- source_word: φωνεῖ
  choice: đang gọi
  rationale: Giữ giá trị hiện tại của động từ và cách nói bề mặt của những người đứng đó, không tự ý thêm nghĩa “cầu cứu” hay “gọi đến giúp”.
theological_decisions:
- issue: Có nên nói rõ những người đứng đó đã hiểu lầm tiếng kêu của Đức Giê-su là lời cầu cứu Ê-li hay không
  choice: 'Giữ nguyên lời nhận định bề mặt: “ông ấy đang gọi Ê-li”'
  alternative: “ông ấy đang gọi Ê-li đến” hoặc “họ tưởng ông ấy đang cầu cứu Ê-li”
  rationale: Nguyên văn chỉ thuật lại lời họ nói, không trực tiếp giải thích sự hiểu lầm. Ngữ cảnh cho thấy điều đó, nên bản dịch không giải quyết thay sự căng thẳng của trình thuật.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Kìa” giữ sắc thái lời nói trực tiếp; “ông ấy” là cách những người tại hiện trường nhắc đến Đức Giê-su, không thêm danh xưng thần học vào lời của họ.
