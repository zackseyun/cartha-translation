- from: Bấy giờ, quân lính dẫn Đức Chúa Giê-su vào bên trong dinh, tức là dinh tổng đốc[a], rồi gọi toàn bộ đội quân[b] tập hợp lại.
  to: Bấy giờ, quân lính dẫn Đức Chúa Giê-su vào bên trong sân, tức là dinh tổng đốc[a], rồi gọi cả đoàn lính[b] tập hợp lại.
  rationale: Bản sửa dịch αὐλή là “sân” và giữ πραιτώριον là “dinh tổng đốc”, theo đúng cấu trúc giải thích của câu Hy Lạp. “Cả đoàn lính” tránh mở rộng σπεῖρα thành toàn bộ quân đội, trong khi chú thích cung cấp nghĩa kỹ thuật “cohort”. Các mốc chú thích được giữ gắn với các thuật ngữ tương ứng.
