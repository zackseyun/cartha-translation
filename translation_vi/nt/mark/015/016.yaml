base_translation:
  language: en
  yaml_path: translation/nt/mark/015/016.yaml
  text: Then the soldiers led him inside the courtyard[a], which is the praetorium[b], and they call together the whole cohort.
translation:
  language: vi
  text: Bấy giờ, quân lính dẫn Đức Chúa Giê-su vào bên trong sân, tức là dinh tổng đốc[a], rồi gọi cả đoàn lính[b] tập hợp lại.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “vào trong sân của dinh tổng đốc.” Từ Hy Lạp có thể chỉ sân trong hoặc khu sân thuộc một dinh thự.'
    reason: lexical_alternative
  - marker: b
    text: Nguyên văn là “toàn bộ σπεῖρα” (cohort), một đơn vị quân đội La Mã; tại đây chỉ đoàn lính được triệu tập dưới quyền La Mã.
    reason: cultural_note
lexical_decisions:
- source_word: Οἱ δὲ
  choice: Bấy giờ
  rationale: δέ đánh dấu bước chuyển tiếp trong diễn tiến câu chuyện, không biểu thị sự tương phản mạnh; “Bấy giờ” tự nhiên và trang trọng trong văn kể tiếng Việt.
- source_word: στρατιῶται
  choice: quân lính
  rationale: Diễn đạt trực tiếp những người lính; “quân lính” là cách gọi tự nhiên trong ngữ cảnh quân sự.
- source_word: ἀπήγαγον
  choice: dẫn
  rationale: ἀπάγω ở đây chỉ việc dẫn một người đến địa điểm được nêu tiếp theo; “dẫn” truyền đạt rõ chuyển động mà không thêm sắc thái cưỡng ép ngoài văn bản.
- source_word: ἔσω τῆς αὐλῆς
  choice: vào bên trong dinh
  rationale: ἔσω với sở hữu cách có nghĩa là vào/bên trong; αὐλή trong ngữ cảnh này có thể chỉ khu dinh hay sân thuộc dinh. “Dinh” phù hợp với vế giải thích πραιτώριον nhưng vẫn cần ghi nhận khả năng “sân trong” ở chú thích.
- source_word: ὅ ἐστιν πραιτώριον
  choice: tức là dinh tổng đốc
  rationale: πραιτώριον là thuật ngữ hành chính La Mã chỉ dinh hoặc tổng hành dinh của quan cai trị. Dịch nghĩa giúp độc giả phổ thông hiểu ngay, đồng thời giữ chức năng giải thích của ὅ ἐστιν.
- source_word: συγκαλοῦσιν
  choice: gọi … tập hợp lại
  rationale: Phản ánh ý nghĩa gọi nhiều người đến họp lại của động từ ghép συγκαλέω; thì hiện tại lịch sử của Hy Lạp được chuyển thành mạch kể quá khứ tự nhiên trong tiếng Việt.
- source_word: ὅλην τὴν σπεῖραν
  choice: toàn bộ đội quân
  rationale: σπεῖρα là một đơn vị quân đội La Mã, thường là cohort. “Đội quân” dễ hiểu trong tiếng Việt; chú thích giải thích ý nghĩa kỹ thuật và tránh khẳng định rằng đủ quân số chính thức đều hiện diện.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Chúa Giê-su” theo lối gọi tôn kính trong bản dịch tiếng Việt; giữ nhịp kể nhanh của Mác bằng hai hành động nối tiếp. Các thuật ngữ La Mã được dịch nghĩa trong câu và giải thích thêm ở chú thích.
