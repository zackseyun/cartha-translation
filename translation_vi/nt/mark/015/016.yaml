    rationale: αὐλή trước hết chỉ sân, sân trong, hoặc khu sân; πραιτώριον mới là lời giải thích về địa điểm hành chính. Dịch “dinh, tức là dinh tổng đốc” vừa lặp vừa làm mờ sự phân biệt trong tiếng Hy Lạp.
  - severity: medium
    issue: “toàn bộ đội quân” quá bao quát cho σπεῖρα.
    rationale: σπεῖρα là một đoàn/đơn vị lính, thường tương đương cohort, chứ không phải toàn thể một đội quân theo nghĩa rộng. “Cả đoàn lính” bảo toàn phạm vi tốt hơn; chú thích giữ thông tin kỹ thuật.
  - severity: low
    issue: Chú thích a nêu bản dịch “vào bên trong sân” nhưng thân câu lại dùng “vào bên trong dinh”.
    rationale: Sự lệch nhau này cho thấy lựa chọn trong câu chưa phản ánh nghĩa không gian cơ bản của αὐλή.
