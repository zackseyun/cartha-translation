review_pass:
  verdict: revise
  source_fidelity: Cần bỏ “mỗi”, vì Κατὰ ... ἑορτήν chỉ xác định thời điểm “vào/during dịp lễ”; tính thông lệ đã được thì chưa hoàn thành ἀπέλυεν và “thường” diễn đạt. “Xin thả” diễn đạt hợp lý lời xin liên quan đến việc phóng thích người tù, nhưng là cách làm rõ điều được hàm ý.
  naturalness: Câu sửa vẫn tự nhiên, rõ ràng và phù hợp văn phong tiếng Việt hiện đại. “Vào dịp lễ” tránh gợi ý rằng nguyên văn nhấn mạnh từng lễ hội một cách riêng biệt.
  terminology: “Phóng thích,” “tù nhân,” và “ông” (chỉ Phi-lát theo ngữ cảnh) phù hợp. Không có vấn đề thuật ngữ thần học.
  issues:
  - severity: medium
    issue: “mỗi” trong “Vào mỗi dịp lễ” thêm nét phân phối không được nêu trực tiếp.
    rationale: Cụm Κατὰ δὲ ἑορτήν có nghĩa thời gian “vào/dịp lễ”; sắc thái tập quán nằm chủ yếu ở ἀπέλυεν. Bỏ “mỗi” giữ sát nguyên văn hơn mà “thường phóng thích” vẫn truyền đạt thông lệ.
  - severity: low
    issue: Chú thích thay thế “mà họ yêu cầu” kém tự nhiên khi đứng độc lập trong tiếng Việt.
    rationale: Với một người làm tân ngữ, tiếng Việt thường cần nêu điều được yêu cầu hoặc dùng “xin [người ấy]”; “mà họ xin” là phương án sát nghĩa hơn, dù câu chính “mà họ xin thả” là cách diễn đạt sáng rõ nhất.
  revised_text: Vào dịp lễ, ông thường phóng thích cho họ một tù nhân mà họ xin thả.[a]
