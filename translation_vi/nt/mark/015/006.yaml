- from: Vào mỗi dịp lễ, ông thường phóng thích cho họ một tù nhân mà họ xin thả.[a]
  to: Vào dịp lễ, ông thường phóng thích cho họ một tù nhân mà họ xin thả.[a]
  rationale: Bản sửa loại bỏ “mỗi” để không thêm một sắc thái phân phối vào cụm chỉ thời gian của nguyên văn. Giữ “thường phóng thích” để phản ánh thì chưa hoàn thành có tính tập quán, và giữ cách diễn đạt “mà họ xin thả” vì tự nhiên, rõ nghĩa trong tiếng Việt. Chú thích được chỉnh để phương án thay thế cũng tự nhiên và sát với động từ Hy Lạp.
