  text: Κατὰ δὲ ἑορτὴν ἀπέλυεν αὐτοῖς ἕνα δέσμιον ⸂ὃν παρῃτοῦντο⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/006.yaml
  text: At the feast he would release for them one prisoner whom they asked for[a].
translation:
  language: vi
  text: Vào dịp lễ, ông thường phóng thích cho họ một tù nhân mà họ xin thả.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “mà họ xin.”'
    reason: παραιτέομαι ở đây có nghĩa là “xin” hoặc “yêu cầu”; câu chính làm rõ việc phóng thích vốn được hàm ý trong ngữ cảnh.
lexical_decisions:
- source_word: Κατὰ δὲ ἑορτὴν
  choice: Vào mỗi dịp lễ
  rationale: κατά với đối cách mang nghĩa thời gian. Trong câu nói về một thông lệ, “mỗi dịp lễ” diễn đạt tự nhiên tính định kỳ; δέ chỉ nối nhẹ nên không cần dịch thành một từ riêng.
- source_word: ἀπέλυεν
  choice: thường phóng thích
  rationale: Thì chưa hoàn thành ở đây chỉ hành động theo thông lệ trong quá khứ. “Thường phóng thích” thể hiện rõ sắc thái tập quán và giữ văn phong trang trọng, dễ hiểu.
- source_word: αὐτοῖς
  choice: cho họ
  rationale: Đối cách gián tiếp chỉ những người được hưởng lợi từ việc phóng thích; “cho họ” giữ sát đại từ của nguyên văn mà vẫn tự nhiên trong tiếng Việt.
- source_word: ἕνα δέσμιον
  choice: một tù nhân
  rationale: ἕνα nêu rõ số lượng một, còn δέσμιος trong bối cảnh xét xử thích hợp nhất với “tù nhân”.
- source_word: ὃν παρῃτοῦντο
  choice: mà họ xin thả
  rationale: παραιτέομαι ở đây có nghĩa là xin hoặc yêu cầu một người. Thêm “thả” làm rõ bổ ngữ hàm ẩn theo ngữ cảnh và tạo câu tiếng Việt tự nhiên, không thay đổi đối tượng của lời xin.
theological_decisions: []
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “ông” vì chủ thể là Phi-lát trong ngữ cảnh gần; giữ “cho họ” thay vì tự ý đổi đại từ thành “cho dân chúng”.
