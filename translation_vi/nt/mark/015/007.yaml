  terminology: “Ba-ra-ba,” “những kẻ nổi loạn,” “cuộc nổi loạn,” và “phạm tội giết người” đều phù hợp. Việc lặp “nổi loạn” phản ánh hợp lý liên hệ từ vựng giữa στασιασταί và στάσις.
