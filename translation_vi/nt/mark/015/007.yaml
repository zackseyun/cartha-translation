  text: ἦν δὲ ὁ λεγόμενος Βαραββᾶς μετὰ τῶν ⸀στασιαστῶν δεδεμένος οἵτινες ἐν τῇ στάσει φόνον πεποιήκεισαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/007.yaml
  text: The man called Barabbas was bound with the rebels who had committed murder in the rebellion[a].
translation:
  language: vi
  text: Người tên là Ba-ra-ba bị trói cùng với những kẻ nổi loạn, là những kẻ đã phạm tội giết người trong cuộc nổi loạn ấy.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch “những kẻ nổi dậy” và “cuộc nổi dậy ấy”. Tiếng Hy Lạp dùng hai từ cùng gốc để chỉ những người tham gia nổi dậy và chính cuộc nổi dậy.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν δὲ
  choice: bị
  rationale: δέ là từ nối nhẹ, không cần dịch thành một trạng từ thời gian; ἦν kết hợp với δεδεμένος tạo ý chỉ tình trạng đang bị xiềng.
- source_word: ὁ λεγόμενος Βαραββᾶς
  choice: Người tên là Ba-ra-ba
  rationale: Cách diễn đạt tự nhiên trong tiếng Việt, xác định người mang tên Ba-ra-ba mà không hàm ý miệt thị như cách hiểu 'cái gọi là'.
- source_word: μετὰ τῶν στασιαστῶν δεδεμένος
  choice: bị xiềng chung với những kẻ nổi loạn
  rationale: δεδεμένος chỉ tình trạng bị trói hoặc xiềng trong khi bị giam giữ; 'bị xiềng chung với' vừa sát nghĩa vừa tự nhiên. στασιασταί là những người tham gia một cuộc nổi dậy.
- source_word: οἵτινες
  choice: là những kẻ
  rationale: Làm rõ rằng mệnh đề sau mô tả những kẻ nổi loạn, không nhất thiết khẳng định riêng Ba-ra-ba là người trực tiếp gây án mạng.
- source_word: ἐν τῇ στάσει
  choice: trong cuộc nổi loạn ấy
  rationale: στάσις ở đây chỉ một cuộc nổi dậy hoặc phản loạn cụ thể; từ 'ấy' phản ánh mạo từ xác định và giúp câu tiếng Việt tự nhiên.
- source_word: φόνον πεποιήκεισαν
  choice: đã phạm tội giết người
  rationale: Diễn đạt hành vi giết người đã xảy ra trước thời điểm thuật chuyện, đồng thời giữ sắc thái phạm tội của φόνος trong bối cảnh.
