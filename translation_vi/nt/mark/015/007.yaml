translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Giữ sự lặp lại có chủ ý giữa “những kẻ nổi loạn” và “cuộc nổi loạn” để phản ánh hai từ cùng gốc trong tiếng Hy Lạp; dùng “bị xiềng” thay vì diễn giải rộng thành “bị giam”.
