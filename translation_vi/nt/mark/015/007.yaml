review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch phản ánh đúng các thành tố chính: Ba-ra-ba ở cùng các người tham gia cuộc nổi loạn, và mệnh đề quan hệ mô tả những người nổi loạn là những người đã phạm tội giết người trong cuộc nổi loạn. Tuy nhiên, “bị xiềng chung với” dễ gợi ý bị xích bằng xiềng và bị xiềng nối với nhau, vượt quá nghĩa cơ bản của δεδεμένος là “bị trói/bị buộc.”'
