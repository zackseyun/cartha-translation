  text: καὶ φέρουσιν αὐτὸν ἐπὶ ⸀τὸν ⸀Γολγοθᾶν τόπον, ὅ ἐστιν ⸀μεθερμηνευόμενον Κρανίου Τόπος.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/022.yaml
  text: And they bring him to the place Golgotha[a], which is translated, “Place of a Skull.”
translation:
  language: vi
  text: Họ đưa Đức Giê-su đến nơi Gô-gô-tha, nghĩa là “Nơi Sọ”[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “Nơi Cái Sọ.” Cụm Hy Lạp Κρανίου Τόπος không có mạo từ, nên cách hiểu xác định hoặc không xác định đều có thể.
    reason: lexical_alternative
lexical_decisions:
- source_word: φέρουσιν
  choice: đưa
  rationale: Động từ φέρω trong ngữ cảnh này chỉ việc đưa Đức Giê-su đến một địa điểm, không nhất thiết hàm ý khiêng hay vác; thì hiện tại lịch sử được diễn đạt tự nhiên bằng thì kể chuyện tiếng Việt.
- source_word: ἐπὶ τὸν Γολγοθᾶν τόπον
  choice: đến nơi gọi là Gô-gô-tha
  rationale: ἐπί với đối cách diễn tả hướng chuyển động đến nơi ấy. Tiếng Việt cần thêm “gọi là” để kết nối tự nhiên danh từ “nơi” với địa danh, dù ý “gọi là” chỉ được hàm chứa chứ không có động từ tương ứng trong tiếng Hy Lạp.
- source_word: Γολγοθᾶν
  choice: Gô-gô-tha
  rationale: Phiên âm địa danh theo cách quen thuộc và dễ đọc trong tiếng Việt.
- source_word: μεθερμηνευόμενον
  choice: nghĩa là
  rationale: Phân từ này chỉ việc dịch hoặc giải nghĩa một từ sang cách nói khác. “Nghĩa là” tự nhiên trong lời giải thích địa danh bằng tiếng Việt và vẫn giữ đúng chức năng của từ.
- source_word: Κρανίου Τόπος
  choice: Nơi Sọ Người
  rationale: Giữ cấu trúc địa danh với Κρανίου là sở hữu cách của “sọ”. Thêm “người” để tránh cách hiểu là sọ của động vật; không thêm mạo từ xác định vì tiếng Hy Lạp không có mạo từ.
