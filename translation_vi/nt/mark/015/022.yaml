translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Giê-su” theo lối gọi kính trọng thông dụng; giữ địa danh bằng phiên âm. Dấu chú thích [a] xuất hiện ngay sau “Gô-gô-tha” vì chú thích giải thích tên gọi và sắc thái của bản dịch đi kèm.
