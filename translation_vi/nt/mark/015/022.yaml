- from: Họ đưa Đức Giê-su đến nơi gọi là Gô-gô-tha[a], nghĩa là “Nơi Sọ Người.”
  to: Họ đưa Đức Giê-su đến nơi Gô-gô-tha, nghĩa là “Nơi Sọ”[a].
  rationale: Bản sửa loại bỏ yếu tố “người” không có trong nguyên văn, không thêm động từ “gọi là,” và đặt chú thích tại cụm từ mà chú thích giải thích. “Nơi Sọ” giữ tính ngắn gọn của tên địa danh và sự không xác định của tiếng Hy Lạp; chú thích bảo lưu phương án “Nơi Cái Sọ” mà không quyết định thay nguyên văn.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T09:24:57Z'
review_pass:
  verdict: revise
  source_fidelity: Bản nháp truyền đạt đúng hành động “đưa” và lời giải nghĩa địa danh. Tuy nhiên, “Nơi Sọ Người” thêm yếu tố “người” mà nguyên văn Κρανίου không nêu rõ; dù “sọ” thường gợi sọ người theo ngữ cảnh, bản dịch không nên đưa thành phần này vào tên địa danh. Cụm “gọi là” cũng không được phát biểu trong tiếng Hy Lạp, nên có thể bỏ mà tiếng Việt vẫn tự nhiên.
  naturalness: “Họ đưa Đức Giê-su đến nơi Gô-gô-tha” là cách nói hiện đại, rõ ràng và đủ tự nhiên trong văn xuôi Kinh Thánh. “Nơi Sọ” có tính chất tên gọi/giải nghĩa địa danh, ngắn gọn hơn và sát nguyên văn hơn “Nơi Sọ Người.”
  terminology: Giữ “Đức Giê-su” và phiên âm “Gô-gô-tha” nhất quán với lối dùng kính trọng, phổ biến trong tiếng Việt. “Nơi Sọ” phản ánh Κρανίου Τόπος mà không áp đặt tính xác định hoặc thêm “người.” Chú thích nên neo ở cụm được dịch có phương án thay thế, không phải ở tên phiên âm Gô-gô-tha.
  issues:
  - severity: medium
    issue: “Nơi Sọ Người” thêm từ “người.”
    rationale: Κρανίου là “của sọ”; nguyên văn không có từ tương đương “người.” Việc bổ sung này thu hẹp hoặc diễn giải thêm nội dung của tên địa danh.
  - severity: low
    issue: “gọi là” không có từ tương ứng trong nguyên văn.
    rationale: Tiếng Hy Lạp nói theo cấu trúc “đến nơi Golgotha,” rồi giải nghĩa tên. Bỏ “gọi là” bảo toàn cấu trúc nguồn mà vẫn tự nhiên trong tiếng Việt.
  - severity: low
    issue: Vị trí chú thích hiện tại không neo trực tiếp vào cụm “Nơi Sọ” có phương án dịch thay thế.
    rationale: Chú thích bàn về cách hiểu/dịch Κρανίου Τόπος, nên đặt sau bản dịch của cụm này để liên kết rõ ràng.
  revised_text: Họ đưa Đức Giê-su đến nơi Gô-gô-tha, nghĩa là “Nơi Sọ”[a].
  revised_footnotes:
