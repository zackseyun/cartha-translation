id: MRK.15.21
reference: Mark 15:21
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Καὶ ἀγγαρεύουσιν παράγοντά τινα Σίμωνα Κυρηναῖον ἐρχόμενον ἀπ’ ἀγροῦ, τὸν πατέρα Ἀλεξάνδρου καὶ Ῥούφου, ἵνα ἄρῃ τὸν σταυρὸν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/021.yaml
  text: And they compelled a certain passerby[a], Simon of Cyrene, who was coming from the country, the father of Alexander and Rufus[c][b], to carry his cross.
translation:
  language: vi
  text: Họ cưỡng bách[a] một người đi ngang qua, là Si-môn người Sy-ren, đang từ miền quê về, cha của A-léc-xan-đơ và Ru-phơ, phải vác thập tự giá của Ngài.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Động từ Hy Lạp ở đây chỉ việc cưỡng bách phục vụ hoặc trưng dụng lao dịch.
    reason: cultural_note
  - marker: b
    text: Nguyên văn chỉ nói “thập tự giá”; một số người hiểu cụ thể là thanh ngang của thập tự giá.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγγαρεύουσιν
  choice: bắt ... phải phục dịch
  rationale: Động từ chỉ việc cưỡng bách phục vụ hoặc trưng dụng lao dịch, không phải chỉ yêu cầu; cách diễn đạt này giữ rõ tính ép buộc.
- source_word: παράγοντά τινα
  choice: một người đang đi ngang qua
  rationale: Diễn đạt tự nhiên ý của phân từ παράγοντα và tính bất định của τινα, cho thấy người này tình cờ đi qua.
- source_word: Σίμωνα Κυρηναῖον
  choice: Si-môn người Sy-ren
  rationale: Phiên âm tên riêng và dùng địa danh để nhận diện nguồn gốc của Si-môn theo lối Việt ngữ tự nhiên.
- source_word: ἐρχόμενον ἀπ’ ἀγροῦ
  choice: từ miền quê đi vào
  rationale: ἀγρός có thể là đồng ruộng, nông trại hoặc miền quê; trong bối cảnh này, cách dịch giữ nghĩa rộng và hàm ý ông đang đi từ bên ngoài vào.
- source_word: τὸν πατέρα Ἀλεξάνδρου καὶ Ῥούφου
  choice: cha của A-léc-xan-đơ và Ru-phơ
  rationale: Giữ nguyên thành phần đồng vị dùng để nhận diện Si-môn mà không suy diễn vì sao hai người con được nhắc tên.
- source_word: ἵνα ἄρῃ
  choice: vác
  rationale: Sau động từ cưỡng bách, tiếng Việt diễn đạt mục đích tự nhiên bằng cấu trúc 'bắt ... vác'; 'vác' phù hợp với việc mang vật nặng trên vai.
- source_word: σταυρὸν
  choice: thập tự giá
  rationale: Đây là cách dịch truyền thống, dễ hiểu của σταυρός trong trình thuật thương khó; không thu hẹp thành 'thanh ngang' vì nguyên văn chỉ nói σταυρός.
- source_word: αὐτοῦ
  choice: của Đức Chúa Giê-su
  rationale: Đại từ chỉ về Đức Chúa Giê-su trong ngữ cảnh. Nêu rõ sở hữu chủ giúp câu tiếng Việt tránh khả năng bị hiểu nhầm là thập tự giá của Si-môn.
theological_decisions:
- issue: Tính chất của việc Si-môn bị huy động
  choice: Si-môn bị bắt phải phục dịch và vác thập tự giá
  alternative: Si-môn chỉ được nhờ hoặc tự nguyện giúp
  rationale: ἀγγαρεύω mang nghĩa cưỡng bách phục vụ hay trưng dụng lao dịch, vì vậy không nên làm nhẹ tính ép buộc.
- issue: Vật Si-môn phải vác cụ thể là gì
  choice: thập tự giá
  alternative: thanh ngang của thập tự giá
  rationale: Dù có cách tái dựng lịch sử cho rằng người chịu đóng đinh mang thanh ngang, nguyên văn dùng σταυρός và không xác định bộ phận cụ thể.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cấu trúc được chia thành hai câu để tránh chuỗi bổ nghĩa quá dài, đồng thời lặp lại chủ thể 'Họ bắt ông' nhằm làm rõ hành động cưỡng bách. Dùng 'từ miền quê đi vào' để giữ độ rộng nghĩa của ἀγρός.
