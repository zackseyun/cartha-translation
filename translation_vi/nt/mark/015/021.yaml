revisions:
- from: Họ bắt một người đang đi ngang qua phải phục dịch[a], đó là Si-môn người Sy-ren, từ miền quê đi vào, cha của A-léc-xan-đơ và Ru-phơ. Họ bắt ông vác thập tự giá của Đức Chúa Giê-su.[b]
  to: Họ cưỡng bách[a] một người đi ngang qua, là Si-môn người Sy-ren, đang từ miền quê về, cha của A-léc-xan-đơ và Ru-phơ, phải vác thập tự giá của Ngài.[b]
  rationale: 'Sửa cấu trúc để ἀγγαρεύουσιν và ἵνα ἄρῃ được chuyển tải như một hành động cưỡng bách duy nhất: họ buộc Si-môn phải vác thập tự giá. Giữ nguyên các thông tin nhận diện, tính bất định của τις qua “một người,” và mức độ không xác định của ἀγρός. Chú thích được giữ đủ và đặt đúng neo.'
  reviewer_model: gpt-5.6-terra
