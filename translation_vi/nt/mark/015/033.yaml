  text: ⸂Καὶ γενομένης⸃ ὥρας ἕκτης σκότος ἐγένετο ἐφ’ ὅλην τὴν γῆν ἕως ὥρας ἐνάτης.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/033.yaml
  text: And when the sixth hour had come[b][a], darkness came over the whole land until the ninth hour.
translation:
  language: vi
  text: Khi đến giờ thứ sáu[a], bóng tối bao trùm khắp miền đất[b] cho đến giờ thứ chín.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tức là từ khoảng mười hai giờ trưa đến khoảng ba giờ chiều.
    reason: cultural_note
  - marker: b
    text: Cũng có thể dịch là “cả trái đất”; từ Hy Lạp γῆ ở đây có thể mang cả hai nghĩa.
    reason: alternative_reading
lexical_decisions:
- source_word: γενομένης ὥρας ἕκτης
  choice: Khi giờ thứ sáu đến
  rationale: Diễn đạt tự nhiên kết cấu sở hữu cách tuyệt đối mang ý nghĩa thời gian, đồng thời giữ cách tính giờ của nguyên văn thay vì đưa cách quy đổi hiện đại vào chính văn.
- source_word: σκότος
  choice: bóng tối
  rationale: Tương đương trực tiếp, rõ ràng và tự nhiên với danh từ Hy Lạp chỉ sự tối tăm.
- source_word: ἐγένετο
  choice: bao phủ
  rationale: Trong kết hợp với ἐπί và phạm vi địa lý, “bóng tối bao phủ” là cách nói tiếng Việt tự nhiên, truyền đạt sự xuất hiện và lan trên toàn miền được nói đến.
- source_word: ἐφ’ ὅλην τὴν γῆν
  choice: khắp miền đất
  rationale: γῆ có thể chỉ đất, miền đất hoặc trái đất. “Miền đất” phù hợp ngữ cảnh kể chuyện mà không khẳng định quá mức phạm vi toàn cầu; nghĩa “cả trái đất” được giữ trong chú thích.
- source_word: ἕως ὥρας ἐνάτης
  choice: cho đến giờ thứ chín
  rationale: Giữ nhất quán cách chỉ giờ của nguyên văn; chú thích giải thích thời gian tương ứng theo cách tính hiện đại.
theological_decisions:
- issue: Phạm vi của γῆ trong biến cố bóng tối khi Chúa Giê-su chịu đóng đinh
  choice: miền đất
  alternative: cả trái đất
  rationale: Từ Hy Lạp có phạm vi nghĩa rộng và bản thân câu không buộc phải hiểu theo một trong hai nghĩa. Chính văn dùng “miền đất” để tránh áp đặt phạm vi toàn cầu, còn chú thích bảo tồn cách hiểu khả dĩ kia.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Giữ lối tính giờ cổ trong chính văn và giải thích bằng chú thích; giữ sự mơ hồ có thật của γῆ.
