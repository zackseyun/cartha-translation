  text: ὁ δὲ Πιλᾶτος ἀπεκρίθη αὐτοῖς λέγων· Θέλετε ἀπολύσω ὑμῖν τὸν βασιλέα τῶν Ἰουδαίων;
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/009.yaml
  text: But Pilate answered them[a], saying, “Do you want me to release to you the King of the Jews?”
translation:
  language: vi
  text: 'Nhưng Phi-lát đáp lại họ: “Các người có muốn ta thả Vua dân Do Thái[a] cho các người không?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “vua của người Giu-đê.” Từ Hy Lạp Ἰουδαίων có thể chỉ “người Do Thái” hoặc “người Giu-đê”; nhưng trong danh xưng cố định thuộc trình thuật thương khó này, “Vua dân Do Thái” là cách dịch truyền thống và phù hợp với ngữ cảnh.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Nhưng
  rationale: Đánh dấu sự chuyển ý có sắc thái tương phản nhẹ với lời yêu cầu của đám đông trong văn cảnh trước.
- source_word: ἀπεκρίθη αὐτοῖς λέγων
  choice: đáp lại họ
  rationale: Diễn đạt tự nhiên trong tiếng Việt ý đáp lời; không cần dịch riêng λέγων thành “nói rằng” vì như vậy sẽ nặng câu mà không thêm nội dung.
- source_word: Θέλετε
  choice: Các người có muốn
  rationale: Thể hiện trực tiếp ý muốn hay mong muốn trong câu hỏi; “các người” phù hợp với việc Phi-lát nói với đám đông và giữ khoảng cách trong ngữ cảnh.
- source_word: ἀπολύσω ὑμῖν
  choice: ta thả ... cho các người
  rationale: ἀπολύω trong bối cảnh xét xử có nghĩa là phóng thích một tù nhân; đại từ “ta” tự nhiên trong lời của một quan tổng đốc nói với đám đông.
- source_word: τὸν βασιλέα τῶν Ἰουδαίων
  choice: Vua dân Do Thái
  rationale: Giữ danh xưng chính trị mang sắc thái mỉa mai trong trình thuật thương khó; “dân Do Thái” là cách hiểu truyền thống và phù hợp ngữ cảnh của Ἰουδαίων trong danh xưng cố định này.
theological_decisions:
- issue: Cách dịch danh xưng τὸν βασιλέα τῶν Ἰουδαίων
  choice: Vua dân Do Thái
  alternative: vua dân Giu-đê
  rationale: Danh xưng này trong trình thuật thương khó vừa có tính chính trị vừa mang sắc thái mỉa mai, không phải lời xác quyết thần học do người dịch thêm vào. Cách dịch “dân Do Thái” quen thuộc và thích hợp hơn trong danh xưng này, đồng thời chú thích bảo lưu khả năng nghĩa theo vùng địa lý.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Lược bỏ cấu trúc dịch sát “đáp ... rằng” để câu thoại tự nhiên hơn; dùng “Phi-lát,” “ta,” và “các người” theo lối xưng hô phù hợp với khoảng cách quyền lực trong cảnh xét xử. Viết hoa “Vua” vì nằm trong danh xưng cụ thể, không nhằm tự ý giải quyết sắc thái thần học của câu.
