translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Đại từ “ông” được dùng vì đối tượng của lời cầu xin và chủ thể của “vẫn thường làm” được hiểu từ ngữ cảnh là Phi-lát, dù câu Hy Lạp không nêu lại tên ông. Bản dịch không bổ sung nội dung cụ thể của điều đám đông xin.
