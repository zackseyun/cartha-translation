  yaml_path: translation/nt/mark/015/008.yaml
  text: And the crowd came up and began to ask him to do as he used to do for them[a].
translation:
  language: vi
  text: Đám đông kéo đến và bắt đầu xin ông làm điều ông vẫn thường làm cho họ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc dịch sát cấu trúc hơn: “Đám đông, sau khi đi lên, bắt đầu xin ông, như ông vẫn thường làm cho họ.”'
    reason: Giữ khả năng dịch gần với phân từ ἀναβὰς (“sau khi đi lên”) và cấu trúc cô đọng của καθὼς ἐποίει αὐτοῖς; bản văn không nói rõ điều họ xin là gì.
lexical_decisions:
- source_word: ἀναβὰς
  choice: đi lên
  rationale: Phân từ bất định quá khứ của ἀναβαίνω diễn tả đám đông đi lên hoặc tiến lên; “đi lên” giữ được hướng chuyển động trong nguyên văn mà vẫn tự nhiên trong tiếng Việt.
- source_word: ὁ ὄχλος
  choice: đám đông
  rationale: Cách dịch thông dụng, tự nhiên của ὄχλος trong bối cảnh một nhóm dân chúng tụ tập.
- source_word: ἤρξατο αἰτεῖσθαι
  choice: bắt đầu xin
  rationale: ἤρξατο kết hợp với động từ nguyên mẫu mang nghĩa “bắt đầu”; αἰτεῖσθαι ở đây là xin hoặc yêu cầu. “Bắt đầu xin” phù hợp với lời thỉnh cầu hướng đến người có thẩm quyền.
- source_word: καθὼς
  choice: như
  rationale: καθώς diễn tả sự tương ứng với thông lệ trước đó. “Như” giữ cấu trúc và mức độ hàm ý của nguyên văn, không nói rõ điều đám đông xin là gì.
- source_word: ἐποίει
  choice: vẫn thường làm
  rationale: Thì chưa hoàn thành của ποιέω ở đây có sắc thái hành động theo thói quen trong quá khứ; “vẫn thường làm” thể hiện rõ sắc thái ấy.
- source_word: αὐτοῖς
  choice: cho họ
  rationale: Đại từ cách tặng được hiểu theo nghĩa thụ hưởng trong ngữ cảnh này, nên “cho họ” tự nhiên hơn “với họ” hoặc “đối với họ”.
