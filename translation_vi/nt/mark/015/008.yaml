- from: Đám đông đi lên và bắt đầu xin ông làm cho họ như ông vẫn thường làm[a].
  to: Đám đông kéo đến và bắt đầu xin ông làm điều ông vẫn thường làm cho họ[a].
  rationale: 'Sửa câu để diễn đạt rõ quan hệ giữa lời thỉnh cầu và thông lệ của Phi-lát: đám đông xin ông thực hiện điều ông thường làm cho họ. “Kéo đến” thay cho “đi lên” nhằm có tiếng Việt tự nhiên hơn trong bối cảnh, trong khi chú thích vẫn bảo tồn khả năng dịch sát hướng chuyển động của ἀναβὰς. Bản sửa không nêu cụ thể thông lệ hay ân huệ được xin.'
