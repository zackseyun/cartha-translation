translation:
  language: vi
  text: 'Nhưng họ lại kêu lên: “Đóng đinh người ấy vào thập tự giá!”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ
  choice: họ
  rationale: Mạo từ số nhiều được dùng như danh từ, chỉ nhóm người đã được nhắc đến trong ngữ cảnh; “họ” là cách diễn đạt tự nhiên và không thêm ý “dân chúng” hay “đám đông” vốn không có trực tiếp trong câu.
- source_word: δὲ
  choice: Nhưng
  rationale: δέ đánh dấu sự tương phản nhẹ với lời Phi-lát vừa nói; “Nhưng” diễn đạt rõ quan hệ đối nghịch mà không cường điệu.
- source_word: πάλιν
  choice: lại
  rationale: πάλιν diễn tả hành động lặp lại; “lại” ngắn gọn, tự nhiên và giữ đúng nhấn mạnh của lời kể.
- source_word: ἔκραξαν
  choice: kêu lên
  rationale: κράζω chỉ tiếng kêu lớn; “kêu lên” giữ được cường độ và sắc thái cảm xúc, đồng thời tự nhiên trong văn kể hiện đại.
- source_word: Σταύρωσον
  choice: Đóng đinh ... vào thập tự giá
  rationale: Động từ ở thể mệnh lệnh trực tiếp, ngôi thứ hai số ít, nói với Phi-lát. Cách dịch này giữ mệnh lệnh trực tiếp và diễn đạt rõ hình thức hành quyết bằng đóng đinh.
- source_word: αὐτόν
  choice: hắn
  rationale: Đại từ làm tân ngữ, chỉ Đức Giê-su. Trong lời hô thù nghịch của đám người, “hắn” truyền đạt tự nhiên sắc thái miệt thị của người nói; đây là sắc thái ngữ cảnh chứ không phải một nét nghĩa riêng của αὐτόν.
