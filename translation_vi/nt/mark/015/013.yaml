  source_fidelity: Bản dịch giữ đúng liên từ đối lập nhẹ (δέ), ý lặp lại (πάλιν), tiếng hô lớn (ἔκραξαν), và mệnh lệnh trực tiếp số ít “đóng đinh”. Tuy nhiên, “hắn” thêm sắc thái khinh miệt không được mã hóa bởi αὐτόν, vốn là đại từ tân ngữ trung tính về sắc thái.
  naturalness: “Nhưng họ lại kêu lên” tự nhiên và phù hợp văn kể hiện đại. “Đóng đinh người ấy vào thập tự giá!” là cách diễn đạt rõ ràng, trang trọng vừa phải, và giữ sức mạnh của lời hô.
  terminology: “Đóng đinh … vào thập tự giá” là thuật ngữ quen thuộc và chính xác cho σταυρόω trong ngữ cảnh này. Không cần chú thích.
