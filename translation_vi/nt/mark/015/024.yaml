source:
  edition: SBLGNT
  text: καὶ ⸂σταυροῦσιν αὐτὸν καὶ⸃ διαμερίζονται τὰ ἱμάτια αὐτοῦ, βάλλοντες κλῆρον ἐπ’ αὐτὰ τίς τί ἄρῃ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/024.yaml
  text: And they crucify him and divide his garments among themselves[a], casting lots for them to decide what each would take.
translation:
  language: vi
  text: Họ đóng đinh Ngài vào thập tự giá và chia nhau y phục của Ngài[a], bắt thăm để xem ai sẽ lấy món nào.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “bắt thăm về các y phục ấy, để xem ai lấy món nào.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: σταυροῦσιν
  choice: đóng đinh Ngài vào thập tự giá
  rationale: Diễn đạt rõ hành động hành hình bằng thập tự giá. Tiếng Việt tự nhiên thường dùng dạng quá khứ theo mạch kể mà không cần đánh dấu riêng; sắc thái hiện tại lịch sử của Hy Lạp khó giữ nguyên nếu không làm câu thiếu tự nhiên.
- source_word: διαμερίζονται
  choice: chia nhau
  rationale: Động từ chỉ việc phân chia thành các phần; “chia nhau” tự nhiên trong tiếng Việt và phù hợp khi các binh lính phân chia y phục.
- source_word: ἱμάτια
  choice: y phục
  rationale: Chỉ các món đồ mặc, giữ sắc thái trang trọng vừa phải và cho phép câu sau nói “món nào” để thể hiện từng phần riêng.
- source_word: βάλλοντες κλῆρον
  choice: bắt thăm
  rationale: Thành ngữ tiếng Việt thông dụng cho việc dùng thăm để quyết định sự phân chia, tương ứng với hành động gieo thăm trong nguyên văn.
- source_word: ἐπ’ αὐτὰ
  choice: để định
  rationale: Trong ngữ cảnh, cụm này gắn việc bắt thăm với số y phục được phân chia; tiếng Việt diễn đạt tự nhiên bằng mục đích quyết định phần nhận.
- source_word: τίς τί ἄρῃ
  choice: mỗi người lấy món nào
  rationale: 'Giữ lực phân phối kép của τίς τί: người nào nhận vật nào, nhưng diễn đạt gọn và tự nhiên trong tiếng Việt.'
theological_decisions:
- issue: Thì hiện tại lịch sử trong trình thuật thương khó
  choice: 'Dùng hình thức kể chuyện tiếng Việt tự nhiên: “Họ đóng đinh…”'
  alternative: “Họ đóng đinh Ngài vào thập tự giá” với một từ chỉ hiện tại như “nay” hoặc “đang”
  rationale: σταυροῦσιν là hiện tại lịch sử tạo tính sống động trong văn kể của Mác. Tiếng Việt không biến đổi động từ theo thì; thêm “đang” có thể biến hành động thành tiến hành và làm lệch sắc thái, còn câu không có dấu chỉ thời gian vừa tự nhiên vừa không loại trừ tính sống động của nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và dễ hiểu. Dùng “Ngài” làm đại từ tôn kính dành cho Chúa Giê-su; “thập tự giá” là cách gọi phổ thông, rõ nghĩa. Không thêm chú thích vì câu tiếng Việt có thể chuyển tải trực tiếp quan hệ giữa việc bắt thăm và phần y phục mỗi người nhận.
