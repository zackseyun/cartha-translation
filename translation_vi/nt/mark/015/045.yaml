    rationale: Nguyên ngữ nói Phi-lát ‘ban/trao thi thể cho Giô-sép’, không chỉ nói ông cho phép một hành động trao do người khác thực hiện.
  - severity: low
    issue: “báo lại” thêm sắc thái ‘lại’.
    rationale: γνοὺς ἀπὸ τοῦ κεντυρίωνος chỉ nói ông biết/nhận tin từ viên đại đội trưởng; không xác định rằng viên này kể lại lời của người khác.
  revised_text: Sau khi được viên đại đội trưởng cho biết, ông đã trao thi thể cho Giô-sép.
