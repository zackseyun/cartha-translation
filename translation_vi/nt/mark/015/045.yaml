  text: And after learning from the centurion[a], he granted the body to Joseph.
translation:
  language: vi
  text: Sau khi được viên đại đội trưởng cho biết, ông đã trao thi thể cho Giô-sép.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γνοὺς ἀπὸ τοῦ κεντυρίωνος
  choice: sau khi được viên đại đội trưởng báo lại
  rationale: Phân từ bất định γνοὺς diễn tả hành động xảy ra trước hành động chính, còn ἀπό với sở hữu cách chỉ nguồn tin. Cách diễn đạt này tự nhiên trong tiếng Việt và cho thấy Phi-lát nhận được sự xác nhận từ viên sĩ quan.
- source_word: τοῦ κεντυρίωνος
  choice: viên đại đội trưởng
  rationale: κεντυρίων chỉ sĩ quan La Mã chỉ huy khoảng một trăm quân. “Đại đội trưởng” là cách gọi quen thuộc, dễ hiểu trong văn cảnh Kinh Thánh tiếng Việt.
- source_word: ἐδωρήσατο
  choice: cho phép trao
  rationale: Động từ ở đây mang nghĩa ban hoặc chuẩn thuận theo thẩm quyền. Trong bối cảnh Phi-lát cho Giô-sép nhận thi thể, “cho phép trao” diễn đạt tự nhiên sắc thái phê chuẩn chính thức.
- source_word: τὸ πτῶμα
  choice: thi thể
  rationale: πτῶμα ở đây chỉ xác người chết. “Thi thể” vừa chính xác vừa trang trọng, tự nhiên hơn “xác chết” trong lời tường thuật.
- source_word: τῷ Ἰωσήφ
  choice: cho Giô-sép
  rationale: Sở cách tặng chỉ người nhận; “cho Giô-sép” truyền đạt trực tiếp quan hệ này.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “ông” cho chủ thể Phi-lát đã được xác định trong ngữ cảnh trước; không thêm tên vào câu vì bản Hy Lạp không lặp lại. Không cần chú thích cho πτῶμα vì “thi thể” đã biểu đạt rõ nghĩa xác người chết.
