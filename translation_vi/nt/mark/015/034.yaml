id: MRK.15.34
reference: Mark 15:34
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ τῇ ⸂ἐνάτῃ ὥρᾳ⸃ ἐβόησεν ὁ Ἰησοῦς φωνῇ ⸀μεγάλῃ· Ἐλωῒ ἐλωῒ ⸀λεμὰ σαβαχθάνι; ὅ ἐστιν μεθερμηνευόμενον Ὁ θεός μου ὁ θεός μου, εἰς τί ⸂ἐγκατέλιπές με⸃;
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/034.yaml
  text: And at the ninth hour Jesus cried out with a loud voice[a], “Eloi, Eloi, lema sabachthani?” which is translated, “My God, my God[c][b], for what reason have you forsaken me?”
translation:
  language: vi
  text: 'Vào giờ thứ chín, Đức Giê-su kêu lớn: “Ê-lô-i, Ê-lô-i, lê-ma sa-bác-tha-ni?”[a] Có nghĩa là: “Đức Chúa Trời của tôi, Đức Chúa Trời của tôi,[b] vì lý do gì Ngài đã lìa bỏ tôi?”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Một số thủ bản và nhiều truyền thống dịch thuật ghi cụm từ Sê-mít này là “la-ma sa-bác-tha-ni” thay vì “lê-ma sa-bác-tha-ni”.
    reason: textual_variant
  - marker: b
    text: Lời của Đức Giê-su gợi lại Thi Thiên 22:1.
    reason: cross_reference
  - marker: c
    text: 'Hay: “Tại sao Ngài đã lìa bỏ tôi?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ ἐνάτῃ ὥρᾳ
  choice: vào giờ thứ chín
  rationale: Giữ cách tính giờ của nguyên văn thay vì diễn giải thành khoảng ba giờ chiều.
- source_word: ἐβόησεν ... φωνῇ μεγάλῃ
  choice: kêu lớn tiếng
  rationale: Diễn đạt tự nhiên trong tiếng Việt, đồng thời giữ sức mạnh của động từ và cụm chỉ cách thức.
- source_word: Ἐλωῒ ἐλωῒ λεμὰ σαβαχθάνι
  choice: Ê-lô-i, Ê-lô-i, lê-ma sa-bác-tha-ni
  rationale: Phiên âm lời kêu bằng ngôn ngữ Sê-mít theo hình thức được Mác lưu giữ, rồi để bản dịch theo sau như trong nguyên văn.
- source_word: μεθερμηνευόμενον
  choice: câu ấy được dịch là
  rationale: Cho thấy phần tiếp theo là bản dịch lời Sê-mít vừa được phiên âm, không chỉ là lời giải thích khái quát.
- source_word: εἰς τί
  choice: vì lý do gì
  rationale: Giữ sắc thái hỏi về lý do của cụm Hy Lạp, dù cách nói này trang trọng và sát hình thức hơn cách nói thông dụng “tại sao”.
- source_word: ἐγκατέλιπές με
  choice: Ngài đã lìa bỏ con
  rationale: “Lìa bỏ” giữ được mức độ nghiêm trọng và âm hưởng Thi Thiên 22:1; “đã” phản ánh động tác ở thể aorist mà không áp đặt cách giải thích thần học.
theological_decisions:
- issue: Mối liên hệ giữa tiếng kêu của Đức Giê-su và Thi Thiên 22:1
  choice: Giữ nguyên tiếng kêu về sự bị lìa bỏ và chỉ ghi chú liên hệ với Thi Thiên 22:1.
  alternative: Làm nhẹ ý bị lìa bỏ hoặc thêm lời giải thích giáo lý ngay trong câu.
  rationale: Nguyên văn để tiếng kêu đứng trong toàn bộ sức nặng và sự căng thẳng thần học của nó; bản dịch không nên tự giải quyết điều câu Kinh Thánh không giải thích tại đây.
- issue: Cách trình bày lời Sê-mít của Đức Giê-su
  choice: Giữ lời phiên âm rồi cung cấp bản dịch ngay sau đó.
  alternative: Chỉ dịch nghĩa, hoặc đổi thành dạng “Ê-li, Ê-li” quen thuộc từ Ma-thi-ơ.
  rationale: Cách này đi theo cấu trúc của Mác và tránh hòa đồng hóa bản văn với sách Ma-thi-ơ.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và dễ hiểu. Danh xưng “Đức Chúa Trời” cùng đại từ “Ngài” phù hợp lời cầu khẩn trực tiếp; “con” diễn đạt tự nhiên đại từ ngôi thứ nhất trong quan hệ với Đức Chúa Trời. Các âm Sê-mít được phiên âm có dấu và gạch nối để độc giả tiếng Việt dễ đọc.
