base_translation:
  language: en
  yaml_path: translation/nt/mark/015/042.yaml
  text: And when evening had already come[a], since it was the Preparation Day—that is[c][b], the day before the Sabbath—
translation:
  language: vi
  text: Khi trời đã về chiều[a], vì hôm ấy là ngày Chuẩn Bị[b], tức là ngày trước ngày Sa-bát—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “khi trời đã sang chiều.”'
    reason: lexical_alternative
  - marker: b
    text: “Ngày Chuẩn Bị” là tên gọi ngày người ta chuẩn bị cho ngày Sa-bát; theo cách tính tuần lễ truyền thống, đó là thứ Sáu.
    reason: cultural_note
lexical_decisions:
- source_word: Καὶ
  choice: Khi
  rationale: Liên từ mở đầu gắn câu này với mạch kể trước đó; trong tiếng Việt, kết hợp ý nối tiếp vào mệnh đề thời gian bằng “Khi” tự nhiên hơn việc dịch máy móc thành “Và khi”.
- source_word: ἤδη ὀψίας γενομένης
  choice: trời đã về chiều
  rationale: Cụm sở hữu cách tuyệt đối nêu hoàn cảnh thời gian. “Trời đã về chiều” là cách nói tự nhiên, giữ được sắc thái thời điểm đã đến của ἤδη và γενομένης mà không xác định quá mức là đã tối hẳn.
- source_word: ἐπεὶ
  choice: vì
  rationale: Từ này đưa vào lời giải thích mang tính nguyên nhân; “vì” rõ ràng và tự nhiên trong mạch văn tiếng Việt.
- source_word: παρασκευή
  choice: ngày Chuẩn Bị
  rationale: Trong bối cảnh này, danh từ chỉ ngày dành cho việc chuẩn bị trước ngày Sa-bát, chứ không chỉ hành động chuẩn bị nói chung. Viết hoa tên gọi giúp biểu thị nghĩa lịch pháp đặc thù.
- source_word: ὅ ἐστιν
  choice: tức là
  rationale: Đây là công thức giải thích; “tức là” diễn đạt trực tiếp và tự nhiên trong tiếng Việt hiện đại.
- source_word: προσάββατον
  choice: ngày trước ngày Sa-bát
  rationale: Cách dịch này truyền đạt nghĩa trực tiếp của từ và giữ nguyên lời giải thích của Mác, không thay bằng “thứ Sáu,” vốn cụ thể hơn hình thức Hy Lạp.
theological_decisions: []
