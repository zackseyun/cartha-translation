  register: Bản dịch dùng tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dấu gạch ngang cuối câu được giữ vì câu văn và diễn biến tiếp tục sang câu kế tiếp. Cấu trúc “Và” đầu câu không được chuyển riêng, nhằm tránh câu tiếng Việt nặng nề, nhưng quan hệ tiếp nối vẫn được thể hiện qua mệnh đề thời gian mở đầu.
