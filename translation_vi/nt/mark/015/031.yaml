source:
  edition: SBLGNT
  text: ὁμοίως καὶ οἱ ἀρχιερεῖς ἐμπαίζοντες πρὸς ἀλλήλους μετὰ τῶν γραμματέων ἔλεγον· Ἄλλους ἔσωσεν, ἑαυτὸν οὐ δύναται σῶσαι·
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/031.yaml
  text: In the same way the chief priests[a], mocking among themselves with the scribes, were saying, “He saved others; he cannot save himself.”
translation:
  language: vi
  text: 'Cũng vậy, các thượng tế chế nhạo Người cùng với các kinh sư và nói với nhau[a]: “Người đã cứu người khác mà không thể cứu chính mình.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cụm từ Hy Lạp có thể nhấn mạnh rằng các thượng tế nói qua lại với nhau, trong khi các kinh sư cùng tham gia chế nhạo.
    reason: Giữ lại khả năng gắn kết cú pháp của πρὸς ἀλλήλους với hành động nói và vai trò tham gia của các kinh sư.
lexical_decisions:
- source_word: ὁμοίως
  choice: Cũng vậy
  rationale: Nối sự chế nhạo này với hành động tương tự của những người được nhắc đến ngay trước đó, đồng thời diễn đạt tự nhiên trong tiếng Việt.
- source_word: ἀρχιερεῖς
  choice: các thượng tế
  rationale: Chỉ các lãnh đạo hàng đầu trong giới tư tế, không hàm ý rằng đồng thời có nhiều người cùng giữ chức thượng tế duy nhất.
- source_word: ἐμπαίζοντες
  choice: chế nhạo
  rationale: Diễn đạt hành vi giễu cợt đầy khinh miệt của họ.
- source_word: πρὸς ἀλλήλους
  choice: nói với nhau
  rationale: Giữ ý tương tác qua lại giữa những người đang nói; đặt với động từ ἔλεγον tạo câu tiếng Việt tự nhiên.
- source_word: μετὰ τῶν γραμματέων
  choice: cùng với các kinh sư
  rationale: Cho thấy các kinh sư tham gia với các thượng tế; “kinh sư” là cách gọi rõ và quen thuộc cho nhóm chuyên gia Luật pháp này.
- source_word: ἔλεγον
  choice: nói
  rationale: Trong cấu trúc tiếng Việt, “nói với nhau” truyền đạt tự nhiên hành động đang diễn ra; không cần thêm dấu hiệu thể bắt buộc.
- source_word: Ἄλλους
  choice: người khác
  rationale: Chỉ những người ngoài chính ông ta mà lời chế giễu cho rằng ông ta đã cứu.
- source_word: ἔσωσεν ... σῶσαι
  choice: đã cứu ... cứu
  rationale: Lặp lại cùng một động từ như nguyên văn, giữ được sự mỉa mai và độ rộng nghĩa của σῴζω.
- source_word: ἑαυτὸν
  choice: chính mình
  rationale: Diễn đạt rõ đại từ phản thân và nhấn mạnh sự đối lập với “người khác”.
- source_word: οὐ δύναται
  choice: không thể
  rationale: Truyền đạt trực tiếp ý không có khả năng trong lời chế nhạo.
theological_decisions:
- issue: Duy trì sự lặp lại và chiều kích mỉa mai của σῴζω
  choice: đã cứu ... cứu
  alternative: đã giải cứu ... giải cứu
  rationale: “Cứu” vừa có thể chỉ giải thoát khỏi hoạn nạn vừa giữ được chiều sâu thần học tiềm ẩn, nhưng không thu hẹp lời nói vào một nghĩa giáo lý riêng.
- issue: Đại từ dùng trong lời của những người chế nhạo Chúa Giê-su
  choice: Ông ta
  alternative: Người / Ngài
  rationale: “Ông ta” phù hợp với giọng nói xa cách, khinh miệt của những người chế nhạo mà không dùng từ xúc phạm quá mức; nguyên văn chỉ dùng chủ ngữ ngôi ba hàm ẩn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Người” trong lời trần thuật tôn trọng nhân vật được nói đến; “Ông ta” trong lời trích dẫn phản ánh thái độ chế nhạo của người nói. Dấu chân chú [a] được đặt ngay sau cụm có khả năng hiểu khác nhau.
