  source_fidelity: 'Bản dịch giữ đúng ý chính: sự chế nhạo song song với nhóm trước đó, các thượng tế, các kinh sư, và phép lặp «đã cứu ... cứu». Tuy nhiên, trật tự hiện tại «các thượng tế cùng với các kinh sư chế nhạo Người và nói với nhau» khiến «cùng với các kinh sư» mặc nhiên chi phối cả «nói với nhau», trong khi cú pháp Hy Lạp có thể đặc biệt gắn πρὸς ἀλλήλους với lời nói của các thượng tế và chỉ nêu các kinh sư là những người cùng tham gia việc chế nhạo.'
  naturalness: Câu sửa vẫn là tiếng Việt hiện đại, rõ ràng và giữ được giọng kể trang trọng. Đưa «cùng với các kinh sư» vào cụm «chế nhạo» làm rõ quan hệ cú pháp mà không tạo một câu quá nặng.
  terminology: «Thượng tế», «kinh sư», và cặp «đã cứu ... cứu» phù hợp. «Ông ta» có thể phản ánh giọng khinh miệt của lời chế nhạo, nhưng đại từ này thêm một sắc thái miệt thị không được đánh dấu riêng bằng đại từ trong tiếng Hy Lạp; dùng «Người» trong lời trích dẫn giữ được sắc thái do động từ «chế nhạo» và nội dung câu nói tạo ra, không thêm mức độ khinh miệt.
  issues:
