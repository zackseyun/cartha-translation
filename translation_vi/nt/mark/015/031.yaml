    rationale: μετὰ τῶν γραμματέων đứng với phân từ ἐμπαίζοντες; còn πρὸς ἀλλήλους có thể làm rõ việc các thượng tế nói qua lại. Bản thảo khiến các kinh sư đồng thời là thành phần tất yếu của «nói với nhau», trái với chính khả năng mà chú thích nêu.
  - severity: low
