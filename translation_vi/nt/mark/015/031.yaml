    rationale: Nguyên văn bộc lộ sự chế nhạo bằng ἐμπαίζοντες và nội dung lời nói, nhưng chủ ngữ trong câu trích chỉ được hàm ẩn. «Người» không làm yếu giọng chế nhạo vốn đã rõ, đồng thời tránh thêm một lựa chọn đánh giá từ đại từ.
