  text: σῶσον σεαυτὸν ⸀καταβὰς ἀπὸ τοῦ σταυροῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/030.yaml
  text: Save yourself[a], coming down from the cross!
translation:
  language: vi
  text: Hãy tự cứu mình[a] và xuống khỏi thập tự giá đi!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Hãy tự cứu mình bằng cách xuống khỏi thập tự giá!” hoặc sát hình thức hơn: “Hãy tự cứu mình, sau khi xuống khỏi thập tự giá!”'
    reason: lexical_alternative
lexical_decisions:
- source_word: σῶσον
  choice: hãy cứu
  rationale: Động từ mệnh lệnh aorist, ngôi hai số ít, mang sắc thái thách thức và chế nhạo. “Cứu” vừa tự nhiên vừa giữ được liên hệ với ngôn ngữ cứu rỗi, không thu hẹp nghĩa thành giải cứu về thể chất.
- source_word: σεαυτόν
  choice: mình
  rationale: Đại từ phản thân làm tân ngữ trực tiếp; trong tiếng Việt, “tự cứu mình” diễn đạt rõ và tự nhiên sức nhấn chế nhạo hướng vào chính người bị nói đến.
- source_word: καταβάς
  choice: và xuống
  rationale: Phân từ chủ động aorist có thể biểu thị hành động đi kèm hoặc quan hệ phương tiện với mệnh lệnh chính. Cách phối hợp bằng “và” tự nhiên trong tiếng Việt, giữ sắc thái lời thách thức cô đọng mà không áp đặt quan hệ phương tiện vốn không được đánh dấu minh nhiên.
- source_word: ἀπὸ τοῦ σταυροῦ
  choice: khỏi thập tự giá
  rationale: Cụm giới từ chỉ chuyển động rời khỏi thập tự giá. “Khỏi” tự nhiên với động từ “xuống” và diễn đạt đúng điểm xuất phát.
theological_decisions:
- issue: Quan hệ giữa phân từ καταβάς và mệnh lệnh σῶσον
  choice: 'Diễn đạt như hai hành động gắn liền trong lời thách thức: “Hãy tự cứu mình và xuống khỏi thập tự giá đi!”'
  alternative: '“Hãy tự cứu mình bằng cách xuống khỏi thập tự giá!” hoặc sát hình thức hơn: “Hãy tự cứu mình, sau khi xuống khỏi thập tự giá!”'
  rationale: Tiếng Hy Lạp dùng một mệnh lệnh aorist với một phân từ aorist trong cấu trúc cô đọng; phân từ có thể được hiểu là hành động đi kèm hoặc có sắc thái phương tiện. Dùng “và” tạo câu tiếng Việt tự nhiên, bảo tồn độ mở cú pháp và không âm thầm quyết định rằng việc xuống là phương tiện duy nhất của việc tự cứu.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Tiểu từ “đi” làm rõ sắc thái mệnh lệnh thách thức trong ngữ cảnh chế nhạo. Dùng “thập tự giá” theo cách gọi quen thuộc trong tiếng Việt.
