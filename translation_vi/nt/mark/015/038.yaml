  text: καὶ τὸ καταπέτασμα τοῦ ναοῦ ἐσχίσθη εἰς δύο ἀπ’ ἄνωθεν ἕως κάτω.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/038.yaml
  text: And the curtain of the temple was torn in two[b][a], from top to bottom.
translation:
  language: vi
  text: Và bức màn[a] của đền thờ[b] bị xé làm đôi, từ trên xuống dưới.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “tấm màn che”.
    reason: lexical_alternative
  - marker: b
    text: Từ Hy Lạp có thể chỉ cụ thể hơn khu vực thánh bên trong đền thờ.
    reason: lexical_alternative
lexical_decisions:
- source_word: καταπέτασμα
  choice: bức màn
  rationale: Chỉ tấm màn treo trong đền thờ. “Bức màn” tự nhiên, rõ nghĩa trong tiếng Việt hiện đại và giữ nguyên hình ảnh cụ thể mà không thêm cách giải thích biểu tượng.
- source_word: ναοῦ
  choice: trong đền thờ
  rationale: ναός có thể chỉ cụ thể nơi thánh bên trong chứ không phải toàn bộ khuôn viên đền thờ. Cách dịch “trong đền thờ” tự nhiên trong tiếng Việt; chú thích giữ lại nghĩa hẹp có thể có.
- source_word: ἐσχίσθη
  choice: bị xé
  rationale: Động từ ở thể bị động, mô tả bức màn chịu tác động xé; “bị xé” là cách diễn đạt trực tiếp và tự nhiên.
- source_word: εἰς δύο
  choice: làm đôi
  rationale: Thành ngữ tiếng Việt tự nhiên, diễn đạt việc bị chia thành hai phần mà không nhất thiết hàm ý hai mảnh hoàn toàn rời nhau.
- source_word: ἀπ’ ἄνωθεν ἕως κάτω
  choice: từ trên xuống dưới
  rationale: Giữ rõ hướng và phạm vi của đường xé bằng cách diễn đạt thông dụng trong tiếng Việt.
- source_word: καὶ
  choice: Và
  rationale: Giữ liên từ trần thuật đơn giản nối sự kiện này với câu trước, không thêm sắc thái thời gian.
theological_decisions:
- issue: Ý nghĩa biểu tượng có thể có của việc bức màn đền thờ bị xé
  choice: Chỉ thuật lại sự kiện, không giải thích biểu tượng trong chính văn.
  alternative: Diễn giải rằng sự kiện biểu thị con đường đến với Đức Chúa Trời được mở ra, hoặc sự phán xét trên hệ thống đền thờ.
  rationale: Câu này không nói rõ ý nghĩa thần học của sự kiện; bản dịch vì thế giữ nguyên sự căng thẳng và không áp đặt một cách giải thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Bức màn” rõ ràng hơn cách nói cổ, còn “đền thờ” duy trì thuật ngữ quen thuộc; chú thích nêu sắc thái cụ thể hơn của ναός.
