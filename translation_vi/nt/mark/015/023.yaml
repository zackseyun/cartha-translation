  text: καὶ ἐδίδουν ⸀αὐτῷ ἐσμυρνισμένον οἶνον, ⸀ὃς δὲ οὐκ ἔλαβεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/023.yaml
  text: And they were giving him wine mixed with myrrh[b][a], but he did not take it.
translation:
  language: vi
  text: Họ đưa cho Ngài rượu pha một dược[a], nhưng Ngài không nhận.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Một dược là một loại nhựa cây có mùi thơm. Cũng có thể dịch: “Họ mời Ngài rượu pha một dược.”'
    reason: Làm rõ danh từ có thể xa lạ với độc giả hiện đại và ghi nhận cách diễn đạt thay thế cho ἐδίδουν trong ngữ cảnh.
lexical_decisions:
- source_word: ἐδίδουν
  choice: đưa cho
  rationale: Thì chưa hoàn thành có thể diễn tả hành động đang diễn ra hoặc được cố thực hiện. Trong tiếng Việt, “đưa cho” tự nhiên và vẫn gần với nghĩa cơ bản của δίδωμι; ý “mời/uống” không được đưa thêm vào chính văn.
- source_word: ἐσμυρνισμένον οἶνον
  choice: rượu pha một dược
  rationale: Cụm này chỉ rượu đã được pha hoặc chế với nhựa thơm myrrh. “Một dược” là tên gọi tiếng Việt tương đối trang trọng và chính xác của chất này, còn “pha” diễn đạt rõ cách rượu được chuẩn bị.
- source_word: ὃς δὲ
  choice: nhưng Ngài
  rationale: Đại từ quan hệ ὃς được dùng theo lối tiếp nối để trở lại chủ thể là Chúa Giê-su, còn δέ mang sắc thái tương phản nhẹ. “Nhưng Ngài” tự nhiên trong tiếng Việt và giữ sự đối lập.
- source_word: ἔλαβεν
  choice: không nhận
  rationale: λαμβάνω có thể nghĩa là “lấy” hoặc “nhận”. Trong ngữ cảnh có người đưa đồ uống cho Ngài, “không nhận” là cách nói tự nhiên, không suy diễn rằng Ngài đã uống hay giải thích động cơ từ chối.
theological_decisions:
- issue: Lý do Chúa Giê-su không nhận thức uống
  choice: Chỉ thuật lại rằng Ngài không nhận, không nêu lý do.
  alternative: Giải thích đó là thuốc giảm đau gây mê hoặc một thức uống theo thông lệ mà Ngài chủ ý từ chối.
  rationale: Bản Hy Lạp không nói mục đích của rượu pha một dược hay lý do Ngài không nhận; bản dịch vì thế không nên đưa một cách giải thích thần học hoặc lịch sử vào chính văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” để quy chiếu Chúa Giê-su theo ngữ cảnh. Không cố tái hiện đại từ quan hệ Hy Lạp theo nghĩa đen vì sẽ thiếu tự nhiên trong tiếng Việt; giữ lực tương phản bằng “nhưng”.
