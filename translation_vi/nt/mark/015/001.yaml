id: MRK.15.1
reference: Mark 15:1
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Καὶ ⸀εὐθὺς πρωῒ συμβούλιον ποιήσαντες οἱ ἀρχιερεῖς μετὰ τῶν πρεσβυτέρων καὶ γραμματέων καὶ ὅλον τὸ συνέδριον δήσαντες τὸν Ἰησοῦν ἀπήνεγκαν καὶ ⸀παρέδωκαν Πιλάτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/001.yaml
  text: And immediately[a], early in the morning, the chief priests held a consultation with the elders and scribes and the whole council; then they bound Jesus, led him away, and handed him over to Pilate.
translation:
  language: vi
  text: Ngay lập tức, vào sáng sớm, các thượng tế cùng các trưởng lão, kinh sư và toàn thể hội đồng[a] đã hội ý. Sau đó, họ trói Đức Giê-su, giải đi và giao nộp cho Phi-lát.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể gọi là “toàn thể Thượng Hội đồng Do Thái” (Sanhedrin). Từ Hy Lạp συνέδριον chỉ hội đồng lãnh đạo của người Do Thái.
    reason: Nêu tên gọi lịch sử quen thuộc và giải thích cơ cấu được nhắc đến.
lexical_decisions:
- source_word: εὐθὺς πρωῒ
  choice: Ngay từ sáng sớm
  rationale: Cách diễn đạt tự nhiên trong tiếng Việt, kết hợp ý hành động diễn ra tức thì với thời điểm sáng sớm mà không tạo thành chuỗi trạng từ gượng gạo.
- source_word: συμβούλιον ποιήσαντες
  choice: đã bàn bạc
  rationale: Diễn đạt thành ngữ Hy Lạp chỉ việc cùng nhau hội ý hoặc nghị bàn; ngắn gọn, tự nhiên và không biến danh từ này thành một hội đồng thứ hai.
- source_word: ἀρχιερεῖς
  choice: các thượng tế
  rationale: Thuật ngữ quen thuộc chỉ giới lãnh đạo tư tế, không hàm ý có nhiều người đồng thời giữ chức thầy tế lễ thượng phẩm.
- source_word: πρεσβυτέρων
  choice: các trưởng lão
  rationale: Trong bối cảnh quản trị, từ này chỉ những người lãnh đạo được công nhận, không đơn thuần là người cao tuổi.
- source_word: γραμματέων
  choice: các kinh sư
  rationale: Cách gọi hiện đại, trang trọng và dễ hiểu đối với những chuyên gia sao chép, giải thích luật Kinh Thánh.
- source_word: ὅλον τὸ συνέδριον
  choice: toàn thể Hội đồng
  rationale: Dịch nghĩa cơ cấu lãnh đạo Do Thái thay vì chỉ phiên âm; viết hoa để cho thấy đây là một cơ quan xác định. Tên gọi lịch sử cụ thể được nêu trong chú thích.
- source_word: δήσαντες
  choice: trói
  rationale: Truyền đạt trực tiếp hành động khống chế Đức Giê-su trước khi áp giải.
- source_word: ἀπήνεγκαν
  choice: giải đi
  rationale: Phù hợp với bối cảnh một người bị trói và bị đưa đi dưới sự canh giữ, tự nhiên hơn cách dịch mang nghĩa khiêng hoặc mang.
- source_word: παρέδωκαν
  choice: giao nộp
  rationale: Giữ được sắc thái chuyển giao một người đang bị giam giữ cho nhà cầm quyền, đồng thời phù hợp với mô-típ thuật chuyện cuộc thương khó.
- source_word: Πιλάτῳ
  choice: Phi-lát
  rationale: Dạng phiên âm tiếng Việt quen dùng của tên riêng Πιλᾶτος.
theological_decisions:
- issue: Nghĩa của συνέδριον
  choice: Dịch là “Hội đồng” trong chính văn.
  alternative: “Tòa Công Luận” hoặc “Sanhedrin”
  rationale: Đây là thuật ngữ lịch sử-thể chế hơn là vấn đề tín lý. Dịch nghĩa giúp độc giả phổ thông hiểu chức năng, còn chú thích giữ tên gọi lịch sử cụ thể.
- issue: Sắc thái của παρέδωκαν trong trình thuật thương khó
  choice: Dịch là “giao nộp”, nhấn mạnh việc chuyển giao Đức Giê-su cho Phi-lát.
  alternative: “trao” hoặc “giao”
  rationale: “Giao nộp” giữ được sắc thái tư pháp và giam giữ của ngữ cảnh nhưng không áp đặt thêm một cách giải thích thần học vượt quá nội dung câu.
translation_notes:
  register: 'Văn phong hiện đại, trang trọng và dễ hiểu. Câu Hy Lạp dài được tách thành hai câu tiếng Việt để làm rõ trình tự: bàn bạc, rồi trói, áp giải và giao nộp. Danh xưng “Đức Giê-su” giữ sắc thái kính trọng phổ biến trong văn bản Kinh Thánh tiếng Việt.'
