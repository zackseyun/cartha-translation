  text: ὁ δὲ Πιλᾶτος ἐθαύμασεν εἰ ἤδη τέθνηκεν, καὶ προσκαλεσάμενος τὸν κεντυρίωνα ἐπηρώτησεν αὐτὸν εἰ ⸀πάλαι ἀπέθανεν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/044.yaml
  text: But Pilate was amazed that he had already died[a], and summoning the centurion, he asked him whether he had died already.
translation:
  language: vi
  text: Nhưng Phi-lát lấy làm ngạc nhiên vì Đức Giê-su đã chết rồi. Ông cho gọi viên bách đội trưởng đến và hỏi viên ấy xem Đức Giê-su đã chết được một lúc chưa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Đức Giê-su đã chết được một thời gian chưa.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐθαύμασεν
  choice: ngạc nhiên
  rationale: Diễn tả sự sửng sốt của Phi-lát trước việc Đức Giê-su chết nhanh như vậy; cách nói tự nhiên, hiện đại và đúng sắc thái của động từ.
- source_word: εἰ ἤδη τέθνηκεν
  choice: khi nghe Đức Giê-su đã chết rồi
  rationale: εἰ có thể mở đầu một câu hỏi gián tiếp, còn thể hoàn thành τέθνηκεν nhấn mạnh tình trạng đã chết. Trong tiếng Việt, cách diễn đạt này tự nhiên sau “ngạc nhiên” và vẫn giữ ý rằng tin Đức Giê-su đã chết sớm khiến Phi-lát sửng sốt.
- source_word: προσκαλεσάμενος
  choice: cho gọi ... đến
  rationale: Phân từ chỉ hành động Phi-lát thực hiện trước khi hỏi; “cho gọi ... đến” tự nhiên trong văn kể chuyện và phù hợp với địa vị của ông.
- source_word: κεντυρίωνα
  choice: viên đội trưởng
  rationale: Danh xưng quen thuộc và có tính lịch sử dành cho sĩ quan La Mã chỉ huy một đơn vị thường được gọi là một đội quân.
- source_word: ἐπηρώτησεν αὐτόν
  choice: hỏi
  rationale: Chuyển tải trực tiếp, tự nhiên ý nghĩa hỏi hoặc tra hỏi mà không làm câu nặng nề.
- source_word: εἰ πάλαι ἀπέθανεν
  choice: xem Đức Giê-su đã chết được một lúc chưa
  rationale: πάλαι ở đây chỉ một khoảng thời gian đã trôi qua tính từ lúc chết, không nhất thiết là “từ lâu” theo nghĩa tuyệt đối. Cách dịch này diễn đạt rõ điều Phi-lát muốn xác minh.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Đức Giê-su” ở hai chỗ thay cho đại từ Hy Lạp để tránh mơ hồ trong tiếng Việt; không dùng đại từ mang dấu ấn hệ phái. “Viên đội trưởng” giữ nét lịch sử mà vẫn quen thuộc với độc giả phổ thông.
