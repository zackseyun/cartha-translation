  to: Nhưng Phi-lát lấy làm ngạc nhiên vì Đức Giê-su đã chết rồi. Ông cho gọi viên bách đội trưởng đến và hỏi viên ấy xem Đức Giê-su đã chết được một lúc chưa.[a]
  rationale: Bản sửa loại bỏ chi tiết “khi nghe” không được phát biểu trong nguyên văn, dùng “viên bách đội trưởng” cho đúng κεντυρίων, và điều chỉnh chú thích để giữ sắc thái thời lượng của πάλαι. Ý nghĩa và tính mơ hồ vừa phải của câu hỏi gián tiếp được bảo toàn.
