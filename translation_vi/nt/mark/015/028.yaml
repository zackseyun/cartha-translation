  text: Καὶ ἐπληρώθη ἡ γραφὴ ἡ λέγουσα, Καὶ μετὰ ἀνόμων ἐλογίσθη.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/028.yaml
  text: And[a] the scripture was fulfilled that says, "And he was numbered with the transgressors."
translation:
  language: vi
  text: 'Và[a] lời Kinh Thánh đã được ứng nghiệm, lời chép rằng: “Người đã bị kể vào hàng những kẻ phạm luật.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Câu này không có trong các thủ bản Hy Lạp cổ nhất, gồm Sinaiticus và Vaticanus thuộc thế kỷ IV, cũng như trong các bản dịch tiếng Copt cổ; nhưng có trong đa số thủ bản thuộc truyền thống Byzantine và trong truyền thống La-tinh. Có lẽ câu này được những người sao chép về sau thêm vào để hài hòa với Lu-ca 22:37, nơi trích dẫn Ê-sai 53:12.
    reason: textual_critical
lexical_decisions:
- source_word: πληρόω
  choice: được ứng nghiệm
  rationale: Trong ngữ cảnh lời Kinh Thánh mang tính tiên tri, cách dịch này diễn đạt tự nhiên thể bị động và việc lời đã chép trở thành hiện thực.
- source_word: ἄνομος
  choice: những kẻ phạm luật
  rationale: Từ này theo nghĩa đen chỉ những người không tuân luật hoặc vi phạm luật; cách dịch giữ sắc thái liên hệ đến luật mà vẫn dễ hiểu trong tiếng Việt hiện đại.
- source_word: λογίζομαι
  choice: bị kể vào hàng
  rationale: Cụm này thể hiện thể bị động và ý nghĩa một người được tính hoặc xếp chung vào một nhóm, đồng thời phù hợp với cấu trúc μετὰ ἀνόμων.
theological_decisions:
- issue: Đối tượng của động từ ἐλογίσθη không được nêu trực tiếp trong câu Hy Lạp
  choice: Người
  alternative: Ngài
  rationale: Dùng “Người” để bổ sung chủ ngữ ngầm cần thiết trong tiếng Việt và giữ văn phong trích dẫn tiên tri, nhưng không diễn giải thêm danh tính ngay trong lời trích.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Giữ liên từ “Và” ở đầu câu vì bản Hy Lạp Byzantine có Καὶ; đặt dấu chân chú thích ngay sau liên từ, tương ứng với vấn đề toàn câu.
