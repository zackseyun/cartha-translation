base_translation:
  language: en
  yaml_path: translation/nt/mark/015/011.yaml
  text: But the chief priests stirred up the crowd so that he would release Barabbas to them instead[a][b].
translation:
  language: vi
  text: Nhưng các thượng tế xúi giục đám đông để Phi-lát thả Ba-ra-ba cho họ thay vào đó.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “kích động đám đông.” Động từ Hy Lạp có thể chỉ việc khơi dậy hoặc thúc đẩy một nhóm người làm theo điều người ta mong muốn.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “đúng hơn.” Ý nói họ muốn Ba-ra-ba được thả, thay cho lựa chọn khác được hàm ý trong ngữ cảnh.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ
  choice: Nhưng
  rationale: δέ tạo sắc thái tương phản nhẹ với diễn biến trước; “Nhưng” tự nhiên và phù hợp ngữ cảnh.
- source_word: ἀρχιερεῖς
  choice: các thượng tế
  rationale: Cách gọi quen thuộc và chính xác đối với giới lãnh đạo tư tế tại Giê-ru-sa-lem.
- source_word: ἀνέσεισαν
  choice: xúi giục
  rationale: Động từ chỉ việc kích động một tập thể hướng tới hành động mong muốn; “xúi giục” rõ nghĩa trong tiếng Việt hiện đại.
- source_word: τὸν ὄχλον
  choice: đám đông
  rationale: Cách diễn đạt tự nhiên, phổ thông cho một đoàn người tụ tập.
- source_word: ἵνα
  choice: để
  rationale: Diễn đạt gọn và tự nhiên quan hệ mục đích hoặc kết quả được dự liệu.
- source_word: μᾶλλον
  choice: thay vì người kia
  rationale: Diễn đạt sự ưu tiên dành cho Ba-ra-ba so với lựa chọn còn lại trong ngữ cảnh; “người kia” giữ đối tượng so sánh ở dạng hàm ý, không tự ý nêu tên Chúa Giê-xu trong câu.
- source_word: τὸν Βαραββᾶν
  choice: Ba-ra-ba
  rationale: Phiên âm tên riêng theo cách quen dùng trong tiếng Việt.
- source_word: ἀπολύσῃ
  choice: thả
  rationale: Động từ ở thể giả định sau ἵνα diễn tả kết quả họ nhắm tới; “thả” tự nhiên trong ngữ cảnh phóng thích tù nhân.
- source_word: αὐτοῖς
  choice: cho họ
  rationale: Dữ cách chỉ những người được hưởng việc phóng thích; “cho họ” là cách nói tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Chủ ngữ hàm ẩn của ἀπολύσῃ
  choice: Nêu “Phi-lát” để câu tiếng Việt rõ chủ ngữ
  alternative: 'Giữ chủ ngữ ngầm: “để thả Ba-ra-ba cho họ”'
  rationale: Tiếng Hy Lạp không nêu chủ ngữ trong mệnh đề này, nhưng mạch văn xác định Phi-lát là người có quyền thả tù nhân. Việc nêu tên làm câu tiếng Việt tự nhiên mà không thay đổi nội dung.
- issue: Đối tượng so sánh hàm ẩn của μᾶλλον
  choice: “thay vì người kia”
  alternative: “thay vào đó” hoặc “đúng hơn”
  rationale: Bản dịch giữ sự so sánh với lựa chọn kia mà không thêm tên Chúa Giê-xu, vốn không xuất hiện trong chính câu Hy Lạp này.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “thượng tế,” “đám đông,” “xúi giục,” và “thả” theo lối kể chuyện tự nhiên; tên riêng được phiên âm có gạch nối.
