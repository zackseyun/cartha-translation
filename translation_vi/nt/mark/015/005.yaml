  yaml_path: translation/nt/mark/015/005.yaml
  text: But Jesus no longer answered anything[a], so that Pilate was amazed.
translation:
  language: vi
  text: Nhưng Đức Giê-su không trả lời gì thêm[a], khiến Phi-lát kinh ngạc.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Nhưng Đức Giê-su không đáp lại gì nữa, đến nỗi Phi-lát kinh ngạc.”'
    reason: Nêu cách diễn đạt khác cho ἀπεκρίθη và quan hệ kết quả của ὥστε, không thêm sắc thái bắt buộc.
lexical_decisions:
- source_word: δὲ
  choice: Nhưng
  rationale: Diễn tả sự tương phản nhẹ với diễn tiến ngay trước đó, khi Đức Giê-su bị tố cáo và bị chất vấn.
- source_word: οὐκέτι
  choice: không... thêm
  rationale: Cách nói tự nhiên trong tiếng Việt, giữ ý chấm dứt việc trả lời trước đó.
- source_word: οὐδὲν ἀπεκρίθη
  choice: không trả lời gì
  rationale: Giữ trọn ý Đức Giê-su hoàn toàn không đáp lại trong bối cảnh thẩm vấn.
- source_word: ὥστε
  choice: khiến
  rationale: 'Biểu đạt rõ quan hệ kết quả: sự im lặng của Đức Giê-su dẫn đến phản ứng của Phi-lát.'
- source_word: θαυμάζειν
  choice: ngạc nhiên
  rationale: Lối diễn đạt hiện đại, tự nhiên, thể hiện phản ứng kinh ngạc mà không cường điệu sắc thái.
- source_word: Πιλᾶτον
  choice: Phi-lát
  rationale: Phiên âm tên riêng theo cách quen dùng trong tiếng Việt.
theological_decisions: []
translation_notes:
