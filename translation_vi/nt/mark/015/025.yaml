  text: Ἦν δὲ ὥρα τρίτη καὶ ἐσταύρωσαν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/025.yaml
  text: It was the third hour[a], and they crucified him.
translation:
  language: vi
  text: Đó là giờ thứ ba[a], và họ đóng đinh Người vào thập tự giá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tức là khoảng chín giờ sáng, theo cách tính giờ thông thường của người Do Thái.
    reason: Giải thích cách tính giờ trong bối cảnh văn hóa cổ.
lexical_decisions:
- source_word: Ἦν
  choice: là
  rationale: Thể chưa hoàn thành của εἰμί được dùng trong cách nói chỉ thời gian; tiếng Việt diễn đạt tự nhiên bằng “là” trong mệnh đề “Lúc ấy là…”.
- source_word: δὲ
  choice: Lúc ấy
  rationale: δέ là liên từ nhẹ, đưa trình thuật tiến sang sự việc kế tiếp chứ không biểu thị tương phản mạnh. “Lúc ấy” truyền đạt sự chuyển tiếp tự nhiên mà không thêm ý “bây giờ” theo nghĩa từ vựng.
- source_word: ὥρα τρίτη
  choice: giờ thứ ba
  rationale: Giữ nguyên cách gọi giờ cổ xưa của bản nguồn và để phần quy đổi sang giờ hiện đại trong chú thích.
- source_word: ἐσταύρωσαν
  choice: họ đóng đinh … vào thập tự giá
  rationale: Diễn đạt rõ hành động đóng đinh trên thập tự giá, là cách nói tự nhiên và trang trọng trong tiếng Việt hiện đại.
- source_word: αὐτόν
  choice: Người
  rationale: Đại từ làm tân ngữ chỉ về Chúa Giê-su; “Người” là cách quy chiếu trang trọng, dễ hiểu trong văn mạch.
theological_decisions:
- issue: Cách dịch mốc thời gian và vấn đề niên biểu
  choice: Giữ “giờ thứ ba” trong chính văn.
  alternative: Dịch trực tiếp là “khoảng chín giờ sáng”.
  rationale: Câu Hy Lạp dùng cách tính giờ cổ mà không tự giải thích. Giữ nguyên cách nói này tránh đưa một phương án dung hòa niên biểu hoặc khuôn giải thích cụ thể vào chính văn; chú thích cung cấp quy đổi văn hóa thường gặp.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Cấu trúc câu bám sát nguồn Hy Lạp trong khi vẫn tự nhiên; dấu chú thích [a] được đặt ngay sau cụm từ cần giải thích.
