  verdict: revise
  source_fidelity: Bản dịch chuyển tải đúng lời thách thức chế nhạo, tước hiệu vương quyền–Mê-si, hành động xuống khỏi thập tự giá, và mục đích «thấy và tin». Tuy nhiên, «Cả những người» có thể tạo sắc thái nhấn mạnh hoặc bao quát không có trong καί; đồng thời thêm «đang» giúp phản ánh rõ thì chưa hoàn của ὠνείδιζον.
  naturalness: Văn phong nhìn chung tự nhiên, trang trọng và phù hợp tiếng Việt hiện đại. Bỏ «Cả» làm câu thuật gọn và tự nhiên hơn; «cũng đang nhục mạ» diễn tả rõ hành động tiếp diễn.
  terminology: «Đấng Mê-si», «Vua của Y-sơ-ra-ên» và «thập tự giá» phù hợp ngữ cảnh tước hiệu và cách dùng Kinh Thánh tiếng Việt. Chú thích thay thế «Đấng Christ» hữu ích và không áp đặt diễn giải giáo phái.
  issues:
