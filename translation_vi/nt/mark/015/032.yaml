  text: ὁ χριστὸς ὁ ⸀βασιλεὺς Ἰσραὴλ καταβάτω νῦν ἀπὸ τοῦ σταυροῦ, ἵνα ἴδωμεν καὶ ⸀πιστεύσωμεν. καὶ οἱ συνεσταυρωμένοι ⸀σὺν αὐτῷ ὠνείδιζον αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/032.yaml
  text: Let the Messiah[a], the King of Israel, come down now from the cross[b], so that we may see and believe.” And those who were crucified with him were also insulting him.
translation:
  language: vi
  text: “Đấng Mê-si[a], Vua của Y-sơ-ra-ên, hãy xuống khỏi thập tự giá ngay bây giờ, để chúng ta thấy và tin.” Những người bị đóng đinh cùng với ngài cũng đang nhục mạ ngài.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “Đấng Christ.” Tước hiệu Hy Lạp Χριστός được dịch là “Đấng Mê-si” ở đây để giữ ý nghĩa vị vua được xức dầu trong ngữ cảnh.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ χριστός
  choice: Đấng Mê-si
  rationale: Ở đây Χριστός là tước hiệu mang ý nghĩa vị vua được xức dầu trong lời chế nhạo; “Đấng Mê-si” giữ được sắc thái ấy rõ hơn cách phiên âm “Đấng Christ”.
- source_word: ὁ βασιλεὺς Ἰσραήλ
  choice: Vua của Y-sơ-ra-ên
  rationale: Cách diễn đạt tự nhiên, trang trọng, giữ nguyên tước hiệu và quan hệ sở thuộc của nguyên văn.
- source_word: καταβάτω νῦν ἀπὸ τοῦ σταυροῦ
  choice: hãy xuống khỏi thập tự giá ngay bây giờ
  rationale: Thể mệnh lệnh ngôi thứ ba được diễn đạt bằng lời thách thức trực tiếp; “ngay bây giờ” giữ tính cấp thời và giọng chế nhạo của νῦν.
- source_word: ἵνα ἴδωμεν καὶ πιστεύσωμεν
  choice: để chúng ta thấy và tin
  rationale: Giữ quan hệ mục đích của ἵνα cùng hai động từ song hành, không bổ sung đối tượng cho “tin” khi nguyên văn không nêu rõ.
- source_word: οἱ συνεσταυρωμένοι σὺν αὐτῷ
  choice: những người bị đóng đinh cùng với ngài
  rationale: Giữ ý bị động và việc họ cùng chịu đóng đinh với Chúa Giê-su, không thêm thông tin ngoài nguyên văn.
- source_word: ὠνείδιζον αὐτόν
  choice: cũng nhục mạ ngài
  rationale: “Nhục mạ” diễn đạt hành vi lăng nhục, sỉ vả; từ “cũng” phản ánh καί, còn ngữ cảnh tiếng Việt đủ biểu thị hành động đang tiếp diễn.
theological_decisions:
- issue: Cách dịch Χριστός trong ngữ cảnh chế nhạo về vương quyền
  choice: Đấng Mê-si
  alternative: Đấng Christ
  rationale: Từ này đang được dùng như một tước hiệu Do Thái chỉ vị vua được xức dầu, chứ không chủ yếu như một tên riêng; lựa chọn này bảo toàn nội dung vương quyền–mê-si trong lời chế nhạo.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “ngài” làm đại từ quy chiếu trong lời thuật; giữ cấu trúc lời chế nhạo ngắn, mạnh. Không đặt chú thích tại “thập tự giá” vì các lựa chọn “sỉ nhục/sỉ vả” thuộc về ὠνείδιζον, không phải σταυρός.
