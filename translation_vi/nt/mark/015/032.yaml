    rationale: καὶ ở đây nối thêm một nhóm người cũng chế nhạo; «Những người ... cũng» diễn đạt đủ ý hơn mà không hàm ý «cả/tất cả».
  - severity: low
    issue: Thì tiếp diễn của ὠνείδιζον chưa được thể hiện rõ.
    rationale: Động từ ὠνείδιζον ở thì chưa hoàn, chỉ hành động đang diễn ra/lặp lại trong quá khứ. «cũng đang nhục mạ» bảo toàn sắc thái này tự nhiên trong tiếng Việt.
