  text: καὶ ἔτυπτον αὐτοῦ τὴν κεφαλὴν καλάμῳ καὶ ἐνέπτυον αὐτῷ, καὶ τιθέντες τὰ γόνατα προσεκύνουν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/019.yaml
  text: And they were striking his head with a reed and spitting on him[a], and kneeling down they were bowing down to him.
translation:
  language: vi
  text: Họ liên tục dùng cây sậy đánh vào đầu Người và nhổ nước bọt vào Người; rồi quỳ gối mà lạy Người.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “thờ lạy Người.” Động từ Hy Lạp có thể có nghĩa là cúi lạy trước mặt, bày tỏ sự tôn kính, hoặc thờ lạy; ở đây, nó mô tả việc binh lính chế nhạo bằng cách giả vờ tôn kính một vị vua.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔτυπτον
  choice: cứ… đánh
  rationale: Thì chưa hoàn thành diễn tả hành động kéo dài hoặc lặp đi lặp lại; “cứ… đánh” truyền đạt tự nhiên sắc thái ấy trong tiếng Việt.
- source_word: αὐτοῦ τὴν κεφαλήν
  choice: đầu Người
  rationale: Đây là cách diễn đạt sở hữu; “đầu Người” tự nhiên và rõ nghĩa trong tiếng Việt.
- source_word: καλάμῳ
  choice: bằng cây sậy
  rationale: κάλαμος chỉ cây sậy hoặc vật giống cây sậy; cách dịch này giữ liên hệ với đạo cụ chế nhạo trong trình thuật.
- source_word: ἐνέπτυον αὐτῷ
  choice: khạc nhổ vào Người
  rationale: Thì chưa hoàn thành cho thấy hành động tiếp diễn hoặc lặp lại. “Khạc nhổ vào” diễn đạt sự sỉ nhục và tự nhiên hơn “nhổ vào” đơn thuần.
- source_word: τιθέντες τὰ γόνατα
  choice: quỳ xuống
  rationale: Cụm từ có nghĩa đen là “đặt đầu gối,” nhưng là thành ngữ chỉ động tác quỳ.
- source_word: προσεκύνουν
  choice: sụp lạy
  rationale: Động từ có thể chỉ phủ phục, tỏ lòng tôn kính hoặc thờ lạy. Trong ngữ cảnh binh lính chế nhạo, “sụp lạy” giữ động tác bề ngoài và tính mỉa mai mà không khẳng định lòng thờ phượng chân thành.
- source_word: αὐτῷ
  choice: Người
  rationale: Đối tượng của hành động sụp lạy là Chúa Giê-su; tiếng Việt diễn đạt tự nhiên là “sụp lạy Người.”
theological_decisions:
- issue: Cách dịch προσκυνέω trong bối cảnh chế nhạo
  choice: sụp lạy
  alternative: thờ lạy
  rationale: Binh lính đang bắt chước nghi thức tôn kính vua để chế nhạo, chứ không bày tỏ sự thờ phượng chân thành. “Sụp lạy” giữ được hành động và sự mỉa mai; nghĩa “thờ lạy” vẫn được ghi trong chú thích để bảo tồn phạm vi nghĩa và căng thẳng thần học.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và dễ hiểu. Dùng “Người” để chỉ Chúa Giê-su. Cấu trúc “cứ… đánh” thể hiện hành động lặp lại; dấu chấm phẩy giúp phân biệt chuỗi hành hạ với cử chỉ chế nhạo tiếp theo.
