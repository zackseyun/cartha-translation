- from: Họ cứ lấy cây sậy đánh vào đầu Người và khạc nhổ vào Người; rồi họ quỳ xuống, sụp lạy Người.[a]
  to: Họ liên tục dùng cây sậy đánh vào đầu Người và nhổ nước bọt vào Người; rồi quỳ gối mà lạy Người.[a]
  rationale: 'Điều chỉnh hai từ có nguy cơ thêm sắc thái không có trong nguyên ngữ: thay “khạc nhổ” bằng “nhổ nước bọt,” và thay “quỳ xuống, sụp lạy” bằng “quỳ gối mà lạy.” Bản sửa vẫn giữ hành động lặp lại, đạo cụ là cây sậy, và tính mỉa mai của cử chỉ tôn kính.'
