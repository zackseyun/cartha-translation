  source_fidelity: Bản dịch phản ánh đúng các hành động trong câu và giữ được sắc thái lặp lại của các thì chưa hoàn thành, nhưng “khạc nhổ” có thể gợi việc khạc đờm và mạnh hơn động từ ἐνέπτυον (“nhổ [nước bọt]”). “Sụp lạy” cũng dễ gợi phủ phục hoàn toàn, trong khi văn bản nêu rõ động tác quỳ gối rồi cúi/lạy để chế nhạo.
