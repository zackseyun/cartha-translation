- from: Giô-sép quê ở A-ri-ma-thê, một thành viên có uy tín[a] trong Hội đồng[b] và cũng chính là người đang trông đợi vương quốc Đức Chúa Trời, đã đến, mạnh dạn[c] vào gặp Phi-lát và xin thi thể Đức Giê-su.
  to: Giô-sép, người quê ở A-ri-ma-thê, là một thành viên có uy tín[a] của Hội đồng[b], cũng chính là người đang trông đợi vương quốc Đức Chúa Trời, đã đến rồi mạnh dạn[c] vào gặp Phi-lát và xin thi thể Đức Giê-su.
