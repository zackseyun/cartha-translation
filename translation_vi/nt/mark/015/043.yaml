id: MRK.15.43
reference: Mark 15:43
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸀ἐλθὼν Ἰωσὴφ ⸀ὁ ἀπὸ Ἁριμαθαίας εὐσχήμων βουλευτής, ὃς καὶ αὐτὸς ἦν προσδεχόμενος τὴν βασιλείαν τοῦ θεοῦ, τολμήσας εἰσῆλθεν πρὸς ⸀τὸν Πιλᾶτον καὶ ᾐτήσατο τὸ σῶμα τοῦ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/043.yaml
  text: Joseph of Arimathea[a], a respected council member who was himself also waiting for the kingdom of God[d][c][b], boldly went in to Pilate and asked for the body of Jesus.
translation:
  language: vi
  text: Giô-sép, người quê ở A-ri-ma-thê, là một thành viên có uy tín[a] của Hội đồng[b], cũng chính là người đang trông đợi vương quốc Đức Chúa Trời, đã đến rồi mạnh dạn[c] vào gặp Phi-lát và xin thi thể Đức Giê-su.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đáng kính” hoặc “có địa vị”.'
    reason: lexical_alternative
  - marker: b
    text: Trong bối cảnh, đây có lẽ là hội đồng lãnh đạo Do Thái, nhưng từ Hy Lạp chỉ nói “hội đồng”, không nêu tên cụ thể.
    reason: historical_clarification
  - marker: c
    text: 'Cũng có thể dịch: “lấy hết can đảm”; cấu trúc Hy Lạp nhấn mạnh lòng can đảm của Giô-sép khi vào gặp Phi-lát.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθὼν
  choice: đã đến
  rationale: Giữ lại ý của phân từ bất định chủ động đứng trước động từ chính; cách diễn đạt này cho biết Giô-sép đã đến rồi vào gặp Phi-lát.
- source_word: ὁ ἀπὸ Ἁριμαθαίας
  choice: quê ở A-ri-ma-thê
  rationale: Diễn đạt tự nhiên nguồn gốc của Giô-sép trong tiếng Việt, tương ứng với cấu trúc chỉ người đến từ A-ri-ma-thê.
- source_word: εὐσχήμων
  choice: có uy tín
  rationale: Truyền đạt địa vị đáng trọng và sự kính nể trong xã hội bằng cách nói hiện đại, dễ hiểu; từ này cũng có thể mang sắc thái đáng kính hoặc nổi bật.
- source_word: βουλευτής
  choice: thành viên trong Hội đồng
  rationale: Phản ánh nghĩa trực tiếp là người thuộc một hội đồng, không đưa tên gọi Sanhedrin vào câu chính khi từ Hy Lạp không nêu đích danh.
- source_word: ὃς καὶ αὐτὸς
  choice: và cũng chính là người
  rationale: Giữ sắc thái nhấn mạnh của καὶ αὐτός rằng bản thân Giô-sép cũng có niềm mong đợi ấy.
- source_word: ἦν προσδεχόμενος
  choice: đang trông đợi
  rationale: Cấu trúc ngoại vi diễn tả một thái độ mong chờ liên tục; “đang trông đợi” vừa tự nhiên vừa giữ ý kỳ vọng.
- source_word: τὴν βασιλείαν τοῦ θεοῦ
  choice: vương quốc Đức Chúa Trời
  rationale: Cách dịch trực tiếp, rõ ràng cho cụm từ trọng tâm trong sách Tin Mừng.
- source_word: τολμήσας
  choice: mạnh dạn
  rationale: Diễn đạt tự nhiên lòng can đảm cần có khi Giô-sép vào gặp Phi-lát, đồng thời gắn rõ với hành động kế tiếp.
- source_word: εἰσῆλθεν πρὸς τὸν Πιλᾶτον
  choice: vào gặp Phi-lát
  rationale: Giữ ý đi vào nơi Phi-lát hiện diện và đến trước mặt ông, bằng một cách nói tiếng Việt gọn và tự nhiên.
- source_word: ᾐτήσατο
  choice: xin
  rationale: “Xin” diễn đạt đúng hành động thỉnh cầu và phù hợp với quan hệ quyền lực trong bối cảnh.
- source_word: τὸ σῶμα τοῦ Ἰησοῦ
  choice: thi thể Đức Giê-su
  rationale: Trong bối cảnh Đức Giê-su đã chết, “thi thể” là cách nói tự nhiên và trang trọng hơn “thân thể”, không thêm nội dung ngoài văn cảnh.
theological_decisions:
- issue: Danh tính của Hội đồng được nói đến qua βουλευτής
  choice: Hội đồng
  alternative: Hội đồng Công luận (Sanhedrin)
  rationale: Trong bối cảnh, đây rất có thể là hội đồng lãnh đạo Do Thái, nhưng từ Hy Lạp chỉ nói “thành viên hội đồng” chứ không nêu đích danh Sanhedrin; bản dịch chính giữ mức độ xác định của nguyên văn.
- issue: Sắc thái của τολμήσας
  choice: mạnh dạn
  alternative: lấy hết can đảm; sau khi dám làm như vậy
  rationale: Nguyên văn nhấn mạnh sự can đảm của Giô-sép khi đến gặp Phi-lát. “Mạnh dạn” giữ lực nghĩa ấy mà không làm câu tiếng Việt nặng nề.
- issue: Cách gọi τὸ σῶμα sau cái chết của Đức Giê-su
  choice: thi thể Đức Giê-su
  alternative: thân thể Đức Giê-su
  rationale: “Thi thể” làm rõ nghĩa theo văn cảnh kể chuyện về cái chết và việc mai táng, nhưng không hàm ý thần học vượt quá câu văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Câu giữ chuỗi mô tả dài của nguyên văn nhưng sắp xếp theo cú pháp tiếng Việt tự nhiên; các tên riêng được phiên âm theo lối quen dùng. “Vương quốc” được dùng thay cho cách nói cổ hơn, còn “Đức Chúa Trời” duy trì sắc thái tôn kính.
