  text: καὶ ἤρξαντο ἀσπάζεσθαι αὐτόν· Χαῖρε, ⸀βασιλεῦ τῶν Ἰουδαίων·
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/018.yaml
  text: 'And they began to salute him: “Hail[b][a], King of the Jews!”'
translation:
  language: vi
  text: 'Rồi họ bắt đầu chào Người: “Kính chào, Vua dân Do Thái[a]!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “Vua của người Giu-đê”; từ Hy Lạp này có thể chỉ dân Do Thái nói chung hoặc người xứ Giu-đê.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Rồi
  rationale: Trong mạch kể liên tiếp của Mác, “Rồi” diễn đạt tự nhiên liên từ καί mà không thêm quan hệ nhân quả.
- source_word: ἤρξαντο ἀσπάζεσθαι αὐτόν
  choice: họ bắt đầu chào Người
  rationale: Giữ rõ ý khởi đầu của ἤρξαντο và nghĩa cơ bản “chào” của ἀσπάζεσθαι; sắc thái nghi thức chế giễu được bộc lộ qua lời tung hô trong ngữ cảnh.
- source_word: Χαῖρε
  choice: Kính chào
  rationale: Ở đây Χαῖρε là công thức chào, không phải mệnh lệnh theo nghĩa đen “hãy vui mừng.” “Kính chào” có sắc thái trang trọng phù hợp với màn giả vờ tung hô nhà vua.
- source_word: βασιλεῦ τῶν Ἰουδαίων
  choice: Vua dân Do Thái
  rationale: Dạng hô cách βασιλεῦ được thể hiện bằng lời gọi trực tiếp; “dân Do Thái” là cách gọi tự nhiên, quen thuộc trong ngữ cảnh danh hiệu thuộc trình thuật thương khó, dù Ἰουδαίων cũng có thể chỉ người Giu-đê.
theological_decisions:
- issue: Thể hiện lời tung hô mang tính chế giễu mà không giải thích thay cho bản văn
  choice: Dùng “Kính chào, Vua dân Do Thái!” như một lời chào trang trọng giả tạo
  alternative: “Chào mừng, Vua dân Do Thái!” hoặc thêm trực tiếp “chế giễu” vào câu
  rationale: Lời thoại và ngữ cảnh tự truyền đạt sự mỉa mai; không thêm từ “chế giễu” vốn không có trong câu Hy Lạp, đồng thời vẫn giữ sắc thái vương giả của lời chào.
- issue: Phạm vi nghĩa của Ἰουδαίων
  choice: dân Do Thái
  alternative: người Giu-đê
  rationale: Cả hai nghĩa đều có căn cứ từ vựng, nhưng trong danh hiệu ở trình thuật thương khó, “Vua dân Do Thái” là cách hiểu chuẩn và phù hợp với lời nhạo báng về vương quyền của Chúa Giê-su; chú thích bảo lưu khả năng địa lý-sắc tộc.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “Người” giữ lối xưng hô tôn kính phổ biến trong văn bản Kinh Thánh tiếng Việt. Dấu chấm than truyền đạt sắc thái tung hô trong lời nói; sự chế giễu được để cho ngữ cảnh thể hiện.
