    rationale: αὐτόν chỉ là đại từ ngôi ba, không tự biểu thị sự khinh miệt. Dù bối cảnh thù nghịch, dùng “hắn” diễn giải thêm sắc thái thái độ; “người ấy” giữ được quy chiếu mà không thêm nghĩa.
  - severity: low
    issue: Cụm “gào lớn hơn” và “đóng đinh ... vào thập tự giá”
    rationale: “Gào to hơn” tự nhiên hơn cho cường độ tiếng kêu. Với hành động σταυρόω, “đóng đinh người ấy trên thập tự giá” là cách diễn đạt tiếng Việt trôi chảy hơn, vẫn giữ mệnh lệnh trực tiếp.
