id: MRK.15.14
reference: Mark 15:14
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὁ δὲ Πιλᾶτος ἔλεγεν αὐτοῖς· Τί γὰρ ⸂ἐποίησεν κακόν⸃; οἱ δὲ ⸀περισσῶς ἔκραξαν· Σταύρωσον αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/014.yaml
  text: But Pilate was saying to them[a], “For what evil has he done?” But they cried out all the more, “Crucify him!”
translation:
  language: vi
  text: 'Nhưng Phi-lát cứ hỏi họ: “Thế người này đã làm điều ác gì?”[a] Nhưng họ càng gào to hơn: “Đóng đinh người ấy trên thập tự giá!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “Tại sao? Người này đã làm điều gì xấu?”'
    reason: Nêu một cách hiểu và diễn đạt khác của γάρ và κακόν trong thành ngữ hỏi về căn cứ của lời cáo buộc.
lexical_decisions:
- source_word: ἔλεγεν
  choice: cứ hỏi
  rationale: Thì chưa hoàn thành diễn tả lời nói đang tiếp diễn hoặc được lặp lại; “cứ hỏi” truyền đạt sắc thái ấy tự nhiên trong tiếng Việt mà không xác định số lần.
- source_word: Τί γὰρ ἐποίησεν κακόν
  choice: Thế người này đã làm điều ác gì?
  rationale: “Thế” thể hiện chức năng liên kết và phản biện của γάρ trong câu hỏi; cách diễn đạt này tự nhiên hơn việc dịch máy móc là “Vì”. Chủ ngữ “người này” làm câu tiếng Việt rõ nghĩa mà không thêm một nhận định thần học.
- source_word: κακόν
  choice: điều ác
  rationale: “Điều ác” giữ sức nặng đạo đức của κακόν rõ hơn “điều sai trái” hoặc “việc xấu”.
- source_word: περισσῶς
  choice: càng ... lớn hơn
  rationale: Cấu trúc so sánh diễn tả sự gia tăng cường độ trong phản ứng của đám đông.
- source_word: ἔκραξαν
  choice: gào
  rationale: “Gào” diễn tả tiếng kêu công khai, lớn và dữ dội của κράζω; mạnh hơn “kêu” nhưng vẫn tự nhiên trong ngữ cảnh.
- source_word: Σταύρωσον αὐτόν
  choice: Đóng đinh hắn vào thập tự giá!
  rationale: Giữ mệnh lệnh trực tiếp hướng đến Phi-lát. “Đóng đinh ... vào thập tự giá” diễn đạt rõ hành động của σταυρόω; “hắn” phù hợp với lời hô thù nghịch mà không biến mệnh lệnh thành thể sai khiến.
- source_word: δὲ
  choice: Nhưng
  rationale: “Nhưng” thể hiện sự tương phản ở cả lời chất vấn của Phi-lát lẫn phản ứng leo thang của đám đông.
- source_word: Πιλᾶτος
  choice: Phi-lát
  rationale: Phiên âm tên riêng theo cách viết quen thuộc và dễ đọc trong tiếng Việt.
theological_decisions:
- issue: Mức độ đạo đức của κακόν trong câu hỏi của Phi-lát
  choice: điều ác
  alternative: điều sai trái; việc xấu
  rationale: κακόν có sức nặng đạo đức rõ rệt trong bối cảnh cáo buộc và kết án. “Điều ác” không làm nhẹ câu hỏi của Phi-lát nhưng cũng không thêm một khẳng định thần học ngoài văn bản.
- issue: Cách gọi Chúa Giê-su trong tiếng hô của đám đông
  choice: hắn
  alternative: ông ấy; người ấy; nó
  rationale: Đại từ Hy Lạp tự nó không đánh dấu thái độ, nhưng ngữ cảnh là một tiếng hô thù nghịch. “Hắn” tái hiện giọng điệu ấy tự nhiên hơn “ông ấy”, đồng thời tránh sắc thái phi nhân hóa mạnh của “nó”.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Cứ hỏi” giữ sắc thái tiếp diễn của động từ; “gào lớn hơn” thể hiện phản ứng leo thang. Dấu [a] được đặt ngay sau câu hỏi mà chú thích giải thích.
