  to: 'Nhưng Phi-lát lại hỏi Đức Giê-su: “Ông không trả lời gì sao? Hãy xem họ đang đưa ra biết bao nhiêu lời buộc tội chống lại ông!”[a]'
  rationale: Sửa riêng mệnh đề cuối để dùng cú pháp tiếng Việt tự nhiên và phản ánh rõ sắc thái pháp lý của động từ κατηγορέω. Giữ “đang đưa ra” để diễn tả thì hiện tại trong lời Phi-lát; chú thích duy trì phương án gần cấu trúc Hy Lạp.
