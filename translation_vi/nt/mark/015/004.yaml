  text: ὁ δὲ Πιλᾶτος πάλιν ⸀ἐπηρώτα αὐτὸν λέγων· Οὐκ ἀποκρίνῃ οὐδέν; ἴδε πόσα σου ⸀κατηγοροῦσιν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/004.yaml
  text: But Pilate again questioned him, saying, “Do you give no answer? Look how many charges they are bringing against you.”
translation:
  language: vi
  text: 'Nhưng Phi-lát lại hỏi Đức Giê-su: “Ông không trả lời gì sao? Hãy xem họ đang đưa ra biết bao nhiêu lời buộc tội chống lại ông!”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc, sát nghĩa hơn: “Hãy xem họ tố cáo ông về biết bao nhiêu điều.”'
    reason: Bảo lưu cách diễn đạt gần mặt chữ của πόσα ... κατηγοροῦσιν (“bao nhiêu điều họ tố cáo ông về”), trong khi chính văn dùng cách nói pháp lý tự nhiên hơn trong tiếng Việt.
lexical_decisions:
- source_word: δὲ
  choice: Nhưng
  rationale: Đánh dấu bước phát triển của câu chuyện với sắc thái tương phản nhẹ trước sự im lặng của Đức Giê-su.
- source_word: Πιλᾶτος
  choice: Phi-lát
  rationale: Dùng dạng phiên âm quen thuộc trong tiếng Việt hiện đại.
- source_word: πάλιν ἐπηρώτα
  choice: lại hỏi
  rationale: πάλιν diễn tả hành động lặp lại; thì chưa hoàn thành của ἐπηρώτα có thể gợi việc hỏi tiếp hoặc hỏi nhiều lần. “Lại hỏi” tự nhiên và không cường điệu thành một cuộc thẩm vấn.
- source_word: αὐτόν
  choice: Đức Giê-su
  rationale: Làm rõ đại từ theo văn cảnh tiếng Việt; danh xưng kính trọng nhưng không thêm nội dung thần học ngoài ngữ cảnh.
- source_word: λέγων
  choice: '[thể hiện bằng dấu hai chấm]'
  rationale: Phân từ dẫn lời được chuyển tự nhiên sang tiếng Việt bằng dấu hai chấm, tránh cách nói nặng nề “hỏi... rằng”.
- source_word: Οὐκ ἀποκρίνῃ οὐδέν;
  choice: Ông không trả lời gì sao?
  rationale: Giữ sức ép của câu hỏi phủ định và sự im lặng của Đức Giê-su bằng cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: ἴδε
  choice: Hãy xem
  rationale: Mệnh lệnh kêu gọi người nghe chú ý; “Hãy xem” trang trọng vừa phải và tự nhiên.
- source_word: πόσα
  choice: biết bao nhiêu điều
  rationale: Giữ danh từ ngầm và sắc thái số lượng của πόσα, không thu hẹp ngay thành thuật ngữ pháp lý.
- source_word: σου κατηγοροῦσιν
  choice: họ đang tố cáo ông
  rationale: κατηγορέω trong bối cảnh xét xử nghĩa là tố cáo; “đang” thể hiện hành động đang diễn ra, còn “ông” là cách chuyển tự nhiên của sở hữu cách chỉ người bị tố cáo.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Đức Giê-su” trong lời trần thuật và “ông” trong lời Phi-lát để phản ánh bối cảnh đối thoại mà không áp đặt thái độ thần học. Dấu [a] trong chính văn tương ứng với chú thích.
