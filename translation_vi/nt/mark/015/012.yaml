  source_fidelity: 'Bản dịch chuyển tải đầy đủ mạch câu Hy Lạp: πάλιν là “lại”, ἀποκριθεὶς ἔλεγεν được diễn đạt tự nhiên bằng “đáp lời”, Τί οὖν là “Vậy ... gì”, và θέλετε ποιήσω là “các người muốn ta làm gì”. Mệnh đề ὃν λέγετε được giữ đúng là lời quy gán của đám đông, không biến danh xưng thành sự xác nhận của Phi-lát.'
  naturalness: Câu tiếng Việt hiện đại, rõ ràng và có sắc thái trang trọng vừa phải. Cặp xưng hô “ta / các người” phù hợp trong ngữ cảnh một quan tổng đốc nói với đám đông, không gây tối nghĩa.
  terminology: “Phi-lát” và “vua dân Do Thái” là các cách dùng quen thuộc, phù hợp với văn mạch Thương Khó. Việc viết thường “vua” đúng với chức năng danh xưng chính trị được nhắc lại trong lời Phi-lát. Chú thích đưa ra phương án “nói là” hợp lệ cho λέγετε và giữ được khoảng cách tu từ của nguyên văn.
