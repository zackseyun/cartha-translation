source:
  edition: SBLGNT
  text: ὁ δὲ Πιλᾶτος ⸂πάλιν ἀποκριθεὶς ἔλεγεν⸃ αὐτοῖς· Τί οὖν ⸀θέλετε ποιήσω ⸂ὃν λέγετε⸃ ⸀τὸν βασιλέα τῶν Ἰουδαίων;
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/012.yaml
  text: Pilate answered them again[a], “Then what do you want me to do with the one you call the king of the Jews?”
translation:
  language: vi
  text: 'Phi-lát lại đáp lời họ: “Vậy, các người muốn ta làm gì với người mà các người gọi là vua dân Do Thái[a]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “người mà các người nói là vua dân Do Thái.”'
    reason: λέγετε có thể được diễn đạt là “gọi là” hoặc “nói là”; cả hai đều giữ danh xưng này trong lời quy gán của đám đông.
lexical_decisions:
- source_word: πάλιν
  choice: lại
  rationale: Diễn tả việc Phi-lát tiếp tục lên tiếng trong cuộc đối đáp, đồng thời giữ mạch kể ngắn gọn và tự nhiên.
- source_word: ἀποκριθεὶς ἔλεγεν
  choice: đáp lời
  rationale: Cấu trúc phân từ kết hợp với động từ ở thì chưa hoàn thành là lối dẫn lời thường gặp; “đáp lời” thể hiện đúng tính chất hồi đáp mà không dịch cứng thành “đáp và nói”.
- source_word: Τί οὖν
  choice: Vậy ... gì
  rationale: “Vậy” thể hiện quan hệ suy luận của οὖν với yêu cầu vừa nêu của đám đông và phù hợp với lời nói tự nhiên trong tiếng Việt.
- source_word: θέλετε ποιήσω
  choice: các người muốn ta làm gì
  rationale: θέλω diễn tả ý muốn, còn động từ giả định ποιήσω làm bổ ngữ cho ý muốn; cấu trúc tiếng Việt này vừa rõ nghĩa vừa tự nhiên.
- source_word: ὃν λέγετε
  choice: người mà các người gọi là
  rationale: Giữ danh xưng trong lời quy gán của những người nghe, không biến nó thành lời xác nhận trực tiếp của Phi-lát. λέγω trong kết cấu này có thể được hiểu là “gọi là” hoặc “nói là”.
- source_word: τὸν βασιλέα τῶν Ἰουδαίων
  choice: vua dân Do Thái
  rationale: Đây là tước hiệu chính trị trong trình thuật thương khó. Cách diễn đạt này rõ ràng, quen thuộc và không tự ý biến lời nói của Phi-lát thành một lời tuyên xưng.
theological_decisions:
- issue: Lời của Phi-lát có xác nhận vương quyền của Đức Giê-su hay chỉ nhắc lại cách đám đông gọi Ngài?
  choice: “người mà các người gọi là vua dân Do Thái”
  alternative: “vua dân Do Thái” như lời xác nhận trực tiếp của Phi-lát
  rationale: Mệnh đề quan hệ ὃν λέγετε đặt danh xưng này trong lời nói của những người đối diện. Bản dịch giữ khoảng cách tu từ ấy, không thêm vào lời Phi-lát sự tuyên xưng hay phủ nhận.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Đại từ “ta” và “các người” phù hợp với lời của một quan tổng đốc nói với đám đông, đồng thời tránh sắc thái quá cổ.
