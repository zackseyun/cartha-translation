  text: And they said to them just as Jesus had said[a], and they let them go.
translation:
  language: vi
  text: Các môn đồ nói với họ đúng như Đức Chúa Giê-su đã nói, và họ để các môn đồ đi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “họ cho phép các môn đồ đi” hoặc “họ không ngăn cản các môn đồ nữa.” Động từ Hy Lạp có thể mang nghĩa cho phép, thả ra hoặc để đi; ở đây chỉ việc những người đứng đó không còn ngăn các môn đồ dắt con lừa đi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ
  choice: Các môn đồ
  rationale: Mạo từ được dùng như danh từ và theo ngữ cảnh chỉ các môn đồ. Nêu rõ đối tượng giúp câu tiếng Việt tự nhiên; không cần dịch riêng δέ vì mạch kể đã rõ.
- source_word: εἶπαν αὐτοῖς
  choice: nói với họ
  rationale: Đây là cách chuyển trực tiếp và tự nhiên của động từ nói cùng đại từ ở tặng cách.
- source_word: καθὼς εἶπεν ὁ Ἰησοῦς
  choice: đúng như Đức Chúa Giê-su đã dặn
  rationale: καθώς diễn tả sự tương ứng chính xác. Trong ngữ cảnh, lời của Đức Chúa Giê-su là chỉ dẫn các môn đồ phải nói gì, nên “đã dặn” truyền đạt tự nhiên lực ngữ dụng của εἶπεν mà vẫn giữ quan hệ thời gian trước đó.
- source_word: ἀφῆκαν αὐτούς
  choice: họ để các môn đồ đi
  rationale: ἀφίημι ở đây mang nghĩa cho phép hoặc không còn ngăn cản. Lặp lại “các môn đồ” thay cho đại từ giúp tránh nhầm hai nhóm người trong tiếng Việt.
theological_decisions: []
