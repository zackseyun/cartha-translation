revisions:
- from: Các môn đồ nói với họ đúng như Đức Chúa Giê-su đã dặn, và họ để các môn đồ đi.[a]
  to: Các môn đồ nói với họ đúng như Đức Chúa Giê-su đã nói, và họ để các môn đồ đi.[a]
  rationale: Thay «đã dặn» bằng «đã nói» để bám sát εἶπεν và không thêm sắc thái chỉ thị. Chỉnh chú thích cho hoàn chỉnh về ngữ pháp, đồng thời giữ lời giải thích ngữ cảnh về ἀφίημι.
  reviewer_model: gpt-5.6-terra
