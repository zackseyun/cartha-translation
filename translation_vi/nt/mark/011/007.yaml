base_translation:
  language: en
  yaml_path: translation/nt/mark/011/007.yaml
  text: And they brought the colt to Jesus, and they threw their cloaks on it, and he sat on it.
translation:
  language: vi
  text: Họ đem lừa con đến với Đức Chúa Giê-su, rồi trải áo choàng của mình lên nó, và Ngài ngồi lên nó.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πῶλον
  choice: lừa con
  rationale: Trong ngữ cảnh trình thuật, con vật được xác định là lừa con; cách dịch này tự nhiên và tránh sự mơ hồ của từ “con non” trong tiếng Việt.
- source_word: ἐπιβάλλουσιν
  choice: phủ ... lên
  rationale: Động từ chỉ hành động đặt hoặc quăng áo lên con vật; “phủ ... lên” diễn đạt tự nhiên việc dùng áo làm chỗ ngồi mà không nhấn quá mức vào động tác ném.
- source_word: ἱμάτια
  choice: áo choàng
  rationale: Chỉ những áo ngoài được trải trên lưng con vật, phù hợp với y phục thời đó và dễ hiểu trong tiếng Việt hiện đại.
- source_word: ἐκάθισεν ἐπ’ αὐτόν
  choice: Ngài ngồi lên đó
  rationale: Đại từ Hy Lạp quy chiếu đến lừa con; “lên đó” tránh lặp từ mà vẫn rõ nghĩa trong câu.
