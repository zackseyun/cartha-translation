source:
  edition: SBLGNT
  text: καὶ ἤκουσαν οἱ ⸂ἀρχιερεῖς καὶ οἱ γραμματεῖς⸃, καὶ ἐζήτουν πῶς αὐτὸν ἀπολέσωσιν· ἐφοβοῦντο γὰρ αὐτόν, ⸂πᾶς γὰρ⸃ ὁ ὄχλος ἐξεπλήσσετο ἐπὶ τῇ διδαχῇ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/018.yaml
  text: And the chief priests and the scribes heard it[a], and they were seeking how they might destroy him, for they feared him, because the whole crowd was astonished at his teaching.
translation:
  language: vi
  text: Các thượng tế và các kinh sư nghe chuyện ấy, rồi tìm cách để tiêu diệt Ngài,[a] vì họ sợ Ngài; bởi cả đám đông đều kinh ngạc về lời dạy của Ngài.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch là: “giết Ngài” hoặc “làm cho Ngài chết.” Động từ Hy Lạp có thể mang nghĩa rộng hơn là “tiêu diệt,” dù văn cảnh cho thấy họ có ý định giết Ngài.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤκουσαν
  choice: nghe chuyện ấy
  rationale: Động từ có thể mang nghĩa “nghe” hoặc “hay tin.” Đại từ bổ sung “chuyện ấy” quy chiếu tự nhiên về những việc và lời của Chúa Giê-su trong đền thờ mà không xác định quá mức nội dung.
- source_word: ἀρχιερεῖς
  choice: các thượng tế
  rationale: Cách gọi quen thuộc dành cho giới lãnh đạo tư tế tại Giê-ru-sa-lem, không khiến người đọc hiểu rằng cùng lúc có nhiều người giữ duy nhất chức vụ thầy tế lễ thượng phẩm.
- source_word: γραμματεῖς
  choice: các kinh sư
  rationale: Chỉ tầng lớp chuyên nghiên cứu, giải thích và giảng dạy Kinh Luật; “kinh sư” là cách gọi gọn, trang trọng và thông dụng trong văn cảnh Tin Mừng.
- source_word: ἐζήτουν
  choice: tìm cách
  rationale: Thì chưa hoàn thành diễn tả hành động đang tiếp diễn; trong tiếng Việt, “tìm cách” tự nhiên và kết hợp rõ với mệnh đề chỉ phương cách theo sau.
- source_word: πῶς
  choice: làm sao để
  rationale: Giữ sắc thái cân nhắc về phương cách hoặc phương tiện mà họ có thể dùng.
- source_word: ἀπολέσωσιν
  choice: tiêu diệt Ngài
  rationale: ἀπόλλυμι có phạm vi nghĩa rộng là hủy diệt, làm cho chết hoặc giết. “Tiêu diệt” giữ được độ rộng của từ Hy Lạp, còn văn cảnh cho thấy ý định gây chết người.
- source_word: ἐφοβοῦντο
  choice: họ sợ Ngài
  rationale: Diễn đạt trực tiếp trạng thái sợ hãi kéo dài; trong văn cảnh, nỗi sợ liên quan đến ảnh hưởng của Ngài và phản ứng của đám đông.
- source_word: πᾶς ὁ ὄχλος
  choice: cả đoàn dân
  rationale: Giữ tính tập thể và sắc thái nhấn mạnh của πᾶς; “đoàn dân” phù hợp với đám đông đang hiện diện trong đền thờ.
- source_word: ἐξεπλήσσετο
  choice: đều kinh ngạc
  rationale: Truyền đạt phản ứng kinh ngạc mạnh và kéo dài; “đều” phối hợp với “cả đoàn dân” để thể hiện phạm vi bao quát.
- source_word: ἐπὶ τῇ διδαχῇ αὐτοῦ
  choice: về lời dạy của Ngài
  rationale: ἐπί với tặng cách nêu căn cứ hoặc đối tượng gây kinh ngạc. “Về lời dạy” tự nhiên trong tiếng Việt và không diễn giải thêm nội dung.
theological_decisions:
- issue: Phạm vi ý định của giới lãnh đạo trong ἀπολέσωσιν
  choice: tiêu diệt Ngài
  alternative: giết Ngài; làm cho Ngài phải chết
  rationale: Văn cảnh cho thấy âm mưu gây chết người, nhưng bản thân động từ Hy Lạp có nghĩa rộng hơn “giết.” Bản chính giữ độ rộng ấy, còn chú thích nêu rõ các cách hiểu cụ thể hơn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” để quy chiếu Chúa Giê-su theo lối văn Kinh Thánh Việt ngữ thông dụng; giữ cấu trúc nhân quả lặp lại của nguyên văn bằng “vì… bởi…”. Dấu chú thích [a] được đặt ngay sau cụm từ liên quan.
