revisions:
- from: Các thượng tế và các kinh sư nghe chuyện ấy thì tìm cách làm sao để tiêu diệt Ngài,[a] vì họ sợ Ngài, bởi cả đoàn dân đều kinh ngạc về lời dạy của Ngài.
  to: Các thượng tế và các kinh sư nghe chuyện ấy, rồi tìm cách để tiêu diệt Ngài,[a] vì họ sợ Ngài; bởi cả đám đông đều kinh ngạc về lời dạy của Ngài.
  rationale: 'Sửa hai điểm về cách diễn đạt và quy chiếu: thay "tìm cách làm sao để" bằng "tìm cách để," và thay "cả đoàn dân" bằng "cả đám đông." Dấu chấm phẩy giúp tiếng Việt biểu đạt rõ chuỗi lý do của nguyên văn: họ sợ Ngài, bởi đám đông kinh ngạc về lời dạy của Ngài. Chú thích được diễn đạt lại cho tự nhiên hơn, nhưng vẫn duy trì sự phân biệt giữa nghĩa rộng của động từ trong bản chính và ý hướng gây chết người do văn cảnh gợi ra.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T08:59:24Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch phản ánh đúng các thành tố chính của câu Hy Lạp: nhóm "các thượng tế và các kinh sư," hành động đang diễn tiến là tìm phương cách, động từ ἀπολέσωσιν được giữ ở nghĩa rộng là "tiêu diệt," và quan hệ nhân quả liên quan đến sự sợ hãi của họ cùng phản ứng của đám đông. Tuy nhiên, "cả đoàn dân" không phải cách tương ứng tự nhiên hoặc chính xác nhất cho ὁ ὄχλος, vốn chỉ đám đông đang hiện diện, không phải dân chúng như một tập thể/dân tộc.'
  naturalness: Cụm "tìm cách làm sao để" bị chồng lấp phương tiện ("tìm cách" và "làm sao") trong tiếng Việt hiện đại. "Cả đoàn dân" cũng kém tự nhiên trong ngữ cảnh này. Có thể sửa thành "tìm cách để" và "cả đám đông" mà vẫn giữ sắc thái của nguyên văn.
  terminology: '"Các thượng tế," "các kinh sư," "Ngài," và "lời dạy" phù hợp với văn phong Kinh Thánh Việt ngữ trang trọng và với các thuật ngữ nguồn. "Tiêu diệt" có thể được giữ trong bản văn chính để không thu hẹp ἀπόλλυμι thành một cách diễn đạt cụ thể hơn; chú thích nêu lựa chọn "giết" là thích hợp.'
  issues:
  - severity: medium
    issue: '"cả đoàn dân" dịch ὁ ὄχλος'
    rationale: Ὄχλος chỉ đám đông/quần chúng tụ họp trong bối cảnh trước mắt. "Đoàn dân" dễ gợi một đoàn người có tổ chức hoặc toàn thể dân chúng; "cả đám đông" vừa tự nhiên vừa sát nghĩa hơn.
  - severity: low
    issue: Cụm "tìm cách làm sao để" thừa và gượng
    rationale: Cả "tìm cách" lẫn "làm sao để" đều biểu thị việc tìm phương cách cho πῶς. "Tìm cách để tiêu diệt Ngài" là cách nói hiện đại, tự nhiên hơn mà không mất ý nghĩa.
  revised_text: Các thượng tế và các kinh sư nghe chuyện ấy, rồi tìm cách để tiêu diệt Ngài,[a] vì họ sợ Ngài; bởi cả đám đông đều kinh ngạc về lời dạy của Ngài.
