  yaml_path: translation/nt/mark/011/001.yaml
  text: And when they were approaching Jerusalem[a], at Bethphage and Bethany, near the Mount of Olives[b], he sends two of his disciples
translation:
  language: vi
  text: Khi họ đang đến gần Giê-ru-sa-lem[a], ở vùng Bết-pha-giê và Bê-tha-ni, gần Núi Ô-liu[b], Đức Giê-su sai hai môn đồ của mình đi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Khi họ đến gần Giê-ru-sa-lem, đến Bết-pha-giê và Bê-tha-ni, về phía Núi Ô-liu.” Các giới từ Hy Lạp có thể được hiểu sát hơn theo hướng chuyển động; câu chính diễn đạt quan hệ địa lý bằng tiếng Việt tự nhiên.'
    reason: lexical_alternative
  - marker: b
    text: Mác thường dùng thì hiện tại lịch sử trong lời kể; vì vậy, “sai” ở đây cũng có thể được diễn đạt theo mạch quá khứ là “đã sai”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγγίζουσιν
  choice: đang đến gần
  rationale: Diễn đạt tự nhiên hành động đang diễn ra trong mạch kể quá khứ, đồng thời giữ nghĩa tiến gần của động từ.
- source_word: εἰς Ἱεροσόλυμα
  choice: Giê-ru-sa-lem
  rationale: Sau 'đến gần', tiếng Việt không cần lặp giới từ chỉ hướng; địa danh là đích mà họ đang tiến đến.
- source_word: εἰς Βηθφαγὴ καὶ Βηθανίαν
  choice: tới khu vực Bết-pha-giê và Bê-tha-ni
  rationale: Cách dịch này phản ánh giới từ chỉ hướng nhưng tránh hàm ý thiếu tự nhiên rằng cả đoàn cùng lúc đã tới hai địa điểm riêng biệt; cụm từ xác định vùng lân cận trên đường vào Giê-ru-sa-lem.
- source_word: πρὸς τὸ Ὄρος τῶν Ἐλαιῶν
  choice: gần Núi Ô-liu
  rationale: πρός ở đây có thể biểu thị quan hệ không gian; 'gần' diễn đạt vị trí mà không khẳng định quá mức rằng họ đang hướng về núi.
- source_word: ἀποστέλλει
  choice: sai ... đi
  rationale: Động từ hiện tại lịch sử tạo nét sống động trong lời kể; tiếng Việt có thể giữ sự chuyển sang hiện tại bằng 'sai ... đi'.
- source_word: δύο τῶν μαθητῶν αὐτοῦ
  choice: hai môn đồ của mình
  rationale: Giữ cấu trúc bộ phận—hai người thuộc nhóm môn đồ của Đức Giê-su—bằng lối nói tự nhiên trong tiếng Việt.
- source_word: Βηθφαγὴ
  choice: Bết-pha-giê
  rationale: Phiên âm địa danh Hy Lạp theo lối quen thuộc, dễ đọc trong tiếng Việt.
- source_word: Βηθανίαν
  choice: Bê-tha-ni
  rationale: Phiên âm địa danh theo lối quen thuộc trong tiếng Việt.
- source_word: Ὄρος τῶν Ἐλαιῶν
  choice: Núi Ô-liu
  rationale: Tên địa danh rõ ràng, tự nhiên, giữ nghĩa cấu tạo 'núi của những cây ô-liu'.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng 'Đức Giê-su' để làm rõ chủ thể vốn được đại từ Hy Lạp ngầm chỉ; giữ hiện tại lịch sử ở động từ chính. Mọi dấu chú thích đều xuất hiện trong câu chính.
