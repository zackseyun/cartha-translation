  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Καὶ ἔρχονται πάλιν εἰς Ἱεροσόλυμα. καὶ ἐν τῷ ἱερῷ περιπατοῦντος αὐτοῦ ἔρχονται πρὸς αὐτὸν οἱ ἀρχιερεῖς καὶ οἱ γραμματεῖς καὶ οἱ πρεσβύτεροι
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/027.yaml
  text: And they came again to Jerusalem. And as he was walking in the temple courts[a], the chief priests and the scribes and the elders came to him.
translation:
  language: vi
  text: Họ lại đến Giê-ru-sa-lem. Khi Ngài đang đi trong khuôn viên đền thờ[a], các thượng tế, các kinh sư và các trưởng lão đến gặp Ngài.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “trong đền thờ” hoặc “trong khu đền thờ”; từ Hy Lạp chỉ toàn bộ khu phức hợp đền thờ, không riêng nơi thánh bên trong.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχονται
  choice: đến
  rationale: Động từ hiện tại được dùng theo lối hiện tại lịch sử trong lời kể Hy Lạp. Tiếng Việt không cần đánh dấu thì bằng hình thái động từ; “đến” tự nhiên trong mạch tường thuật và không làm mất sắc thái kể chuyện.
- source_word: πάλιν
  choice: lại
  rationale: Diễn đạt ngắn gọn, tự nhiên ý nghĩa hành động được lặp lại.
- source_word: Ἱεροσόλυμα
  choice: Giê-ru-sa-lem
  rationale: Dạng phiên âm quen thuộc và dễ nhận biết trong tiếng Việt.
- source_word: ἐν τῷ ἱερῷ
  choice: trong khuôn viên đền thờ
  rationale: ἱερόν chỉ toàn bộ khu đền thờ, không riêng nơi thánh bên trong; “khuôn viên đền thờ” truyền đạt rõ phạm vi rộng hơn ấy.
- source_word: περιπατοῦντος αὐτοῦ
  choice: Khi Ngài đang đi
  rationale: Kết cấu sở hữu cách tuyệt đối cung cấp bối cảnh đồng thời và diễn tả hành động đang tiếp diễn; cách dịch này tự nhiên trong tiếng Việt.
- source_word: ἀρχιερεῖς
  choice: các thượng tế
  rationale: Ở số nhiều, từ này chỉ giới lãnh đạo tư tế, không phải nhiều đương kim đại tế lễ; “các thượng tế” là cách gọi ngắn gọn, quen thuộc.
- source_word: γραμματεῖς
  choice: các kinh sư
  rationale: Chỉ những người thông thạo và giải thích Kinh Luật; “kinh sư” trực tiếp hơn cách diễn giải “các thầy dạy luật” và phù hợp văn cảnh Phúc Âm.
- source_word: πρεσβύτεροι
  choice: các trưởng lão
  rationale: Trong văn cảnh thiết chế, từ này chỉ những lãnh đạo được công nhận, không chỉ những người cao tuổi.
- source_word: πρὸς αὐτόν
  choice: đến gặp Ngài
  rationale: πρός diễn tả chuyển động hướng về Đức Giê-su; thêm “gặp” tạo câu tiếng Việt tự nhiên mà không áp đặt mục đích cụ thể hơn văn bản.
theological_decisions:
- issue: Phạm vi không gian của ἱερόν
  choice: khuôn viên đền thờ
  alternative: đền thờ; khu đền thờ
  rationale: Cách dịch tránh khiến độc giả hiểu rằng Đức Giê-su đang đi trong chính điện hoặc nơi thánh bên trong, đồng thời giữ đúng bối cảnh công cộng của cuộc đối thoại. Đây là quyết định từ vựng-không gian, không phải sự khẳng định giáo lý.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Ngài” để quy chiếu Đức Giê-su theo văn cảnh mà không lặp tên không có trong câu Hy Lạp; giữ nhịp hai câu và chuỗi ba nhóm lãnh đạo như nguyên văn.
