base_translation:
  language: en
  yaml_path: translation/nt/mark/011/010.yaml
  text: Blessed is the coming kingdom of our father David! Hosanna in the highest![a]
translation:
  language: vi
  text: Phước lành cho vương quốc sắp đến của Đa-vít, tổ phụ chúng ta! Hô-sa-na ở chốn chí cao![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Hô-sa-na” có thể phản ánh lời cầu xin “Xin cứu!” hoặc “Xin cứu ngay!”, dù ở đây từ này được dùng như một tiếng tung hô trong nghi lễ.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εὐλογημένη
  choice: Phước cho
  rationale: Tính từ vị ngữ mở đầu lời tung hô. “Phước cho” tự nhiên trong tiếng Việt, giữ được sắc thái chúc tụng và âm hưởng của một lời tuyên phước.
- source_word: ἡ ἐρχομένη βασιλεία
  choice: vương quốc đang đến
  rationale: Cách dịch này giữ lực của phân từ hiện tại ἐρχομένη và không biến cụm từ thành một thuật ngữ cánh chung cố định.
- source_word: βασιλεία
  choice: vương quốc
  rationale: Trong ngữ cảnh Đa-vít và vương triều, “vương quốc” tự nhiên hơn “sự trị vì”, đồng thời vẫn diễn đạt được thực tại vương quyền đang được đón chào.
- source_word: τοῦ πατρὸς ἡμῶν Δαυίδ
  choice: của tổ phụ chúng ta là Đa-vít
  rationale: “Tổ phụ” truyền đạt nghĩa tổ tiên được tôn kính, tránh khiến “cha” bị hiểu là quan hệ phụ tử trực tiếp; cấu trúc có “là” rõ ràng và tự nhiên trong tiếng Việt hiện đại.
- source_word: Ὡσαννὰ
  choice: Hô-sa-na
  rationale: Trong Tân Ước, từ này đã trở thành lời tung hô phụng vụ; vì vậy phiên âm trong chính văn và giải thích lời cầu xin nguyên thủy ở chú thích.
- source_word: ἐν τοῖς ὑψίστοις
  choice: trên nơi chí cao
  rationale: Giữ hình ảnh về cõi cao nhất mà không diễn giải cụ thể thành “tầng trời cao nhất”; “chí cao” phù hợp với văn phong tung hô trang trọng.
theological_decisions:
- issue: Bản chất của lời tung hô vương quốc Đa-vít
  choice: Dịch trực tiếp là “vương quốc đang đến của tổ phụ chúng ta là Đa-vít”
  alternative: Phước cho vương quốc Đấng Mê-si đang đến của tổ phụ chúng ta là Đa-vít
  rationale: Ngữ cảnh gợi rõ niềm mong đợi về Đấng Mê-si, nhưng nguyên văn không có từ “Mê-si”. Bản dịch giữ nguyên sự ám chỉ và không đưa lời giải nghĩa thần học vào chính văn.
- issue: Chức năng của Ὡσαννὰ
  choice: Giữ như một lời tung hô phụng vụ “Hô-sa-na” và nêu nghĩa nguyên thủy trong chú thích
  alternative: Xin cứu chúng con ngay trên nơi chí cao
  rationale: Từ này bắt nguồn từ một lời cầu xin cứu giúp nhưng trong ngữ cảnh có chức năng tung hô; giữ phiên âm bảo toàn cả truyền thống phụng vụ lẫn độ căng nghĩa, còn chú thích trình bày khả năng từ nguyên.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “tổ phụ” cho sắc thái tổ tiên được tôn kính, “vương quốc đang đến” để giữ chuyển động của phân từ hiện tại, và phiên âm “Hô-sa-na” theo lối quen thuộc trong văn liệu Cơ Đốc tiếng Việt.
