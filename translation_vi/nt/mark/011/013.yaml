  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἰδὼν συκῆν ⸀ἀπὸ μακρόθεν ἔχουσαν φύλλα ἦλθεν εἰ ἄρα ⸂τι εὑρήσει⸃ ἐν αὐτῇ, καὶ ἐλθὼν ἐπ’ αὐτὴν οὐδὲν εὗρεν εἰ μὴ φύλλα, ⸂ὁ γὰρ καιρὸς οὐκ ἦν⸃ σύκων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/013.yaml
  text: And seeing from a distance a fig tree having leaves[a], he went to see whether perhaps he would find anything on it. But when he came to it, he found nothing except leaves, for it was not the season for figs.
translation:
  language: vi
  text: Từ xa, Ngài thấy một cây vả có lá, nên đến xem thử, may ra sẽ tìm được gì trên cây ấy. Nhưng khi đến gần cây, Ngài chẳng tìm thấy gì ngoài lá, vì lúc ấy không phải mùa vả.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “vì lúc ấy không phải thời có trái vả.”'
    reason: Nêu cách dịch khác của καιρός, có thể chỉ “mùa” hoặc “thời điểm thích hợp” trong ngữ cảnh này.
lexical_decisions:
- source_word: ἰδὼν
  choice: thấy
  rationale: Phân từ mang ý nghĩa hoàn cảnh-thời gian; tiếng Việt diễn đạt tự nhiên bằng “thấy” sau trạng ngữ “từ xa” mà không ấn định quá mức trình tự hành động.
- source_word: συκῆν
  choice: một cây sung
  rationale: Đây là từ tương đương thông dụng, chính xác trong tiếng Việt hiện đại.
- source_word: ἀπὸ μακρόθεν
  choice: từ xa
  rationale: Giữ nguyên ý nghĩa không gian bằng cách diễn đạt ngắn gọn, tự nhiên.
- source_word: ἔχουσαν φύλλα
  choice: có lá
  rationale: Phản ánh trực tiếp đặc điểm của cây và tránh diễn giải thêm rằng cây đang xanh tốt hoặc sum suê.
- source_word: ἦλθεν εἰ ἄρα τι εὑρήσει ἐν αὐτῇ
  choice: Ngài đến xem may ra có tìm được gì trên cây chăng
  rationale: “May ra” giữ sắc thái chưa chắc chắn của εἰ ἄρα; “trên cây” là cách nói tự nhiên trong tiếng Việt khi nói đến việc tìm trái.
- source_word: ἐλθὼν ἐπ’ αὐτὴν
  choice: khi đến gần cây
  rationale: Diễn đạt tự nhiên giá trị thời gian của phân từ và ý tiến đến tận cây.
- source_word: οὐδὲν εὗρεν εἰ μὴ φύλλα
  choice: chẳng tìm thấy gì ngoài lá
  rationale: Giữ cấu trúc loại trừ của εἰ μὴ một cách rõ ràng và tự nhiên.
- source_word: ὁ γὰρ καιρὸς οὐκ ἦν σύκων
  choice: vì lúc ấy không phải mùa sung
  rationale: καιρός trong ngữ cảnh chỉ thời điểm hoặc mùa thích hợp; “mùa sung” súc tích, dễ hiểu và không thêm lời giải thích về nông nghiệp.
theological_decisions:
- issue: Sức nặng giải thích của mệnh đề nói về mùa sung
  choice: 'Dịch trực tiếp: “vì lúc ấy không phải mùa sung.”'
  alternative: “vì chưa đến thời có trái sung” hoặc diễn giải thêm về chu kỳ ra trái của cây sung
  rationale: 'Lời kể tạo ra một căng thẳng rõ rệt: Ngài tìm trái trong khi người kể nói đó không phải mùa sung. Bản dịch giữ nguyên căng thẳng ấy, không giải quyết bằng cách thêm giả thuyết nông nghiệp hay thần học.'
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “Ngài” để nối chủ thể đã có trong văn cảnh; không thêm tên riêng vào câu Hy Lạp vốn chỉ hàm chủ ngữ trong động từ. Cấu trúc “may ra… chăng” bảo toàn sắc thái thăm dò và chưa chắc chắn.
