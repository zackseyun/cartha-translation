source:
  edition: SBLGNT
  text: ἀλλὰ εἴπωμεν· Ἐξ ἀνθρώπων;— ἐφοβοῦντο τὸν ⸀ὄχλον, ἅπαντες γὰρ εἶχον τὸν Ἰωάννην ⸂ὄντως ὅτι⸃ προφήτης ἦν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/032.yaml
  text: But if we say[a], ‘From men’?”—they were afraid of the crowd[b], for everyone held that John truly was a prophet.
translation:
  language: vi
  text: '“Nhưng nếu chúng ta nói: ‘Từ con người’?” — họ sợ đám đông, vì mọi người đều cho rằng Giăng thật sự là một nhà tiên tri.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'Cũng có thể dịch: “vì mọi người đều xem Giăng quả thật là một nhà tiên tri.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ εἴπωμεν
  choice: Nhưng nếu chúng ta nói... thì sao?
  rationale: Diễn đạt tự nhiên mạch suy tính lựa chọn trong tiếng Việt, đồng thời giữ liên từ tương phản và sắc thái giả định của động từ ở thể giả định.
- source_word: Ἐξ ἀνθρώπων
  choice: Bởi loài người
  rationale: Giữ hình ảnh về nguồn gốc trong giới từ ἐξ và sự đối lập ngầm với nguồn từ trời; cách nói này trang trọng, dễ hiểu và không giới hạn vào nam giới.
- source_word: ἐφοβοῦντο τὸν ὄχλον
  choice: họ sợ đám đông
  rationale: Chuyển tải trực tiếp nỗi sợ mang tính tình huống của họ; 'đám đông' phù hợp cách dùng ὄχλος trong bối cảnh thuật chuyện.
- source_word: ἅπαντες γὰρ
  choice: vì mọi người đều
  rationale: Thể hiện cả quan hệ giải thích của γὰρ và ý nghĩa bao quát, phân bố của ἅπαντες.
- source_word: εἶχον
  choice: cho rằng
  rationale: Trong cấu trúc này, ἔχω diễn tả việc giữ một nhận định; 'cho rằng' là tiếng Việt tự nhiên hơn cách dịch sát chữ 'có'.
- source_word: ὄντως ὅτι προφήτης ἦν
  choice: Giăng thật sự là một nhà tiên tri
  rationale: Giữ sức nhấn mạnh của ὄντως và đặt nhận định về địa vị tiên tri của Giăng trong phạm vi điều mọi người tin.
theological_decisions:
- issue: Nguồn gốc của phép báp-têm/thẩm quyền của Giăng trong cụm ἐξ ἀνθρώπων
  choice: Bởi loài người
  alternative: Do con người mà có; Có nguồn gốc từ con người
  rationale: Bản chính giữ cách diễn đạt tương đối sát về nguồn gốc và sự đối lập với trời, nhưng không giải thích quá mức đối tượng đang được nói đến.
- issue: Sức nặng của nhận định ὄντως ὅτι προφήτης ἦν
  choice: mọi người đều cho rằng Giăng thật sự là một nhà tiên tri
  alternative: mọi người đều xem Giăng quả thật là một nhà tiên tri
  rationale: Cách dịch giữ lời khẳng định trong quan điểm của đám đông, thay vì biến nó thành một lời xác quyết độc lập của người kể chuyện, đồng thời bảo toàn sắc thái nhấn mạnh của ὄντως.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “loài người” để diễn đạt ἀνθρώπων theo nghĩa nhân loại, tránh cách hiểu chỉ nam giới; giữ dấu gạch ngang để thể hiện sự đứt đoạn trong lời họ bàn tính.
