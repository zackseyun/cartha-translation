- from: 'Nhưng nếu chúng ta nói: ‘Bởi loài người’[a] thì sao?”—họ sợ đám đông, vì mọi người đều cho rằng Giăng thật sự là một nhà tiên tri.[b]'
  to: '“Nhưng nếu chúng ta nói: ‘Từ con người’?” — họ sợ đám đông, vì mọi người đều cho rằng Giăng thật sự là một nhà tiên tri.[b]'
  rationale: Đổi “Bởi loài người” thành “Từ con người” để diễn đạt tự nhiên và sát nghĩa nguồn gốc của ἐξ ἀνθρώπων. Chuẩn hóa dấu ngoặc kép và dấu hỏi cho lời bàn tính. Các thành phần còn lại giữ nguyên ý nghĩa, gồm sắc thái nhấn mạnh của ὄντως và việc nhận định về Giăng vẫn thuộc quan điểm của mọi người.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T08:59:03Z'
