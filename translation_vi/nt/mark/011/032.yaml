  naturalness: Cần chỉnh cụm nguồn gốc và chuẩn hóa dấu ngoặc kép/dấu hỏi để lời bàn tính được mạch lạc, tự nhiên trong tiếng Việt hiện đại.
  terminology: Giữ “Giăng” nhất quán với bản thảo; “nhà tiên tri” truyền đạt tự nhiên προφήτης. “Từ con người” bảo toàn đối lập ngầm giữa nguồn nhân loại và nguồn thần linh mà không diễn giải thành đối tượng cụ thể như phép báp-têm hay thẩm quyền.
