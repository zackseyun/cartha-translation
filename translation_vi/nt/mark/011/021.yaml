  terminology: “Phi-e-rơ,” “Ra-bi,” “Người,” “Thầy,” và “cây vả” phù hợp với cách dùng Kinh Thánh tiếng Việt và bối cảnh Do Thái. “Đã khô héo rồi” diễn đạt tự nhiên kết quả hiện còn của thì hoàn thành.
