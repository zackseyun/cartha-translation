base_translation:
  language: en
  yaml_path: translation/nt/mark/011/021.yaml
  text: And Peter[a], remembering, says to him, “Rabbi, look—the fig tree that you cursed has withered.”
translation:
  language: vi
  text: 'Nhớ lại, Phi-e-rơ nói với Người: “Ra-bi, xem kìa, cây vả mà Thầy đã nguyền rủa nay đã khô héo rồi[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đã khô đi.” Động từ Hy Lạp có thể chỉ việc khô đi hoặc héo úa; thì hoàn thành nhấn mạnh tình trạng hiện tại do việc ấy gây ra.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναμνησθεὶς
  choice: nhớ lại
  rationale: Diễn đạt tự nhiên phân từ bất định quá khứ mang nghĩa ‘nhớ lại/được gợi nhớ’, đồng thời giữ liên hệ với lời Phi-e-rơ nói ngay sau đó.
- source_word: λέγει
  choice: nói
  rationale: Thì hiện tại lịch sử đặc trưng trong lối kể của Mác có thể được giữ bằng ‘nói’; tiếng Việt không bắt buộc đánh dấu thì và ngữ cảnh tự xác định thời gian.
- source_word: αὐτῷ
  choice: với Người
  rationale: Giữ đại từ của bản Hy Lạp thay vì giải thích thành ‘với Đức Giê-su’; ‘Người’ là cách quy chiếu trang trọng, tự nhiên trong văn cảnh.
- source_word: Ῥαββί
  choice: Ra-bi
  rationale: Phiên âm danh xưng Do Thái thay vì chuyển nghĩa thành ‘Thầy’, qua đó bảo tồn bối cảnh văn hóa và hình thức xưng hô trực tiếp.
- source_word: ἴδε
  choice: xem kìa
  rationale: Mệnh lệnh chỉ xuất tự nhiên trong tiếng Việt, vừa kêu gọi chú ý vừa truyền tải sắc thái cảm thán.
- source_word: συκῆ
  choice: cây vả
  rationale: Danh từ trong văn cảnh chỉ cây chứ không chỉ trái; ‘cây vả’ là cách gọi rõ ràng và quen thuộc trong tiếng Việt Kinh Thánh.
- source_word: κατηράσω
  choice: Thầy đã nguyền rủa
  rationale: Giữ nghĩa trực tiếp của động từ ngôi hai số ít và làm rõ chủ thể qua cách xưng hô tự nhiên của tiếng Việt.
- source_word: ἐξήρανται
  choice: nay đã khô héo rồi
  rationale: ‘Khô héo’ phù hợp với cây; tổ hợp ‘nay đã... rồi’ thể hiện hành động hoàn tất cùng tình trạng hiện còn, tương ứng với thì hoàn thành Hy Lạp.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng nhưng dễ hiểu. Giữ danh xưng ‘Ra-bi’ để bảo tồn bối cảnh Do Thái; dùng ‘Thầy’ trong mệnh đề tiếp theo vì đó là đại từ xưng hô tự nhiên tương ứng với người được gọi là Ra-bi. Dấu cảm thán sau ‘xem kìa’ tái hiện sức sống của lời nói trực tiếp.
