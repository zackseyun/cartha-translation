  verdict: revise
  source_fidelity: 'Bản dịch phản ánh đúng các yếu tố chính của câu Hy Lạp: phân từ ἀναμνησθείς, hiện tại lịch sử λέγει, đại từ αὐτῷ, lời xưng hô Ῥαββί, mệnh lệnh ἴδε, “cây vả,” động từ “đã nguyền rủa,” và thì hoàn thành ἐξήρανται. Tuy nhiên, trật tự “Phi-e-rơ nhớ lại, nói” không tự nhiên trong tiếng Việt và làm mối nối của phân từ với động từ chính bị gượng.'
