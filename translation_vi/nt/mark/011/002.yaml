revisions:
- from: 'Ngài bảo họ: “Hãy đi vào ngôi làng ở phía đối diện các anh. Ngay khi vào làng, các anh sẽ thấy một con lừa con[a] đang bị buộc, chưa có người nào từng ngồi lên nó[b]. Hãy cởi dây và đem nó đến đây.”'
  to: 'Ngài bảo họ: “Hãy đi vào ngôi làng đối diện các anh. Vừa vào làng, các anh sẽ thấy một con vật còn non[a] được buộc, chưa ai từng ngồi lên nó[b]. Hãy tháo nó ra và đem nó về đây.”'
  rationale: Sửa chính văn để không xác định πῶλον là lừa khi câu Hy Lạp không nêu loài. Đồng thời làm gọn cách diễn đạt vị trí và trạng thái bị buộc. Các chi tiết khác, gồm sắc thái “chưa” của οὔπω và động từ “tháo ... đem ... về đây,” được giữ nguyên ý nghĩa.
