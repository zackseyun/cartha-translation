review_pass:
  verdict: revise
  source_fidelity: Bản nháp truyền đạt đúng mệnh lệnh, ngôi làng đối diện, tính tức thì khi vào làng, con vật bị buộc, việc chưa có người ngồi lên, và hai mệnh lệnh cuối. Tuy nhiên, πῶλον tự nó chỉ một con vật còn non/colt, không xác định riêng là lừa; việc dịch chính văn là “con lừa con” đi xa hơn văn bản Mark 11:2. Cần bảo lưu phạm vi nghĩa này trong chính văn và chú thích.
  naturalness: Bản sửa dùng tiếng Việt hiện đại, rõ ràng và trang trọng vừa phải. “Ngôi làng đối diện các anh” tự nhiên hơn “ở phía đối diện các anh”; “được buộc” diễn tả trạng thái kết quả của phân từ hoàn thành bị động mà không gợi hành động đang diễn ra.
  terminology: Giữ “Ngài” và “các anh” nhất quán với đăng ký của bản nháp. Dịch πῶλον là “một con vật còn non” để không áp đặt loài vật; chú thích nêu “lừa con” như một khả năng theo ngữ cảnh rộng hơn, không như nghĩa bắt buộc của câu này.
  issues:
  - severity: medium
    issue: “một con lừa con” xác định loài của πῶλον quá mức.
    rationale: πῶλον có nghĩa cơ bản là con vật non/colt và SBLGNT tại câu này không nêu loài. Các truyền thống song song hay diễn giải ngữ cảnh có thể hướng đến lừa con, nhưng không nên biến khả năng đó thành nghĩa duy nhất của chính văn.
  - severity: low
    issue: Cụm “ở phía đối diện các anh” hơi nặng trong tiếng Việt hiện đại.
    rationale: “Ngôi làng đối diện các anh” vẫn giữ chính xác τὴν κατέναντι ὑμῶν và tự nhiên, gọn hơn.
