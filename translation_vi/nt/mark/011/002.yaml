source:
  edition: SBLGNT
  text: καὶ λέγει αὐτοῖς· Ὑπάγετε εἰς τὴν κώμην τὴν κατέναντι ὑμῶν, καὶ ⸀εὐθὺς εἰσπορευόμενοι εἰς αὐτὴν εὑρήσετε πῶλον δεδεμένον ἐφ’ ὃν οὐδεὶς ⸀οὔπω ἀνθρώπων ⸀ἐκάθισεν· ⸂λύσατε αὐτὸν καὶ φέρετε⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/002.yaml
  text: And he says to them[a], “Go into the village opposite you, and as soon as you enter it, you will find a colt tied there, on which no one has yet sat[b]. Untie it and bring it.”
translation:
  language: vi
  text: 'Ngài bảo họ: “Hãy đi vào ngôi làng đối diện các anh. Vừa vào làng, các anh sẽ thấy một con vật còn non[a] được buộc, chưa ai từng ngồi lên nó[b]. Hãy tháo nó ra và đem nó về đây.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hy Lạp πῶλον chỉ một con vật còn non, một “colt”; trong ngữ cảnh rộng hơn, có thể hiểu là lừa con.
    reason: lexical_alternative
  - marker: b
    text: 'Sát nghĩa: “trên nó chưa một người nào từng ngồi.” Câu Hy Lạp nêu rõ rằng chưa có con người nào ngồi trên con vật ấy.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὑπάγετε
  choice: Hãy đi vào
  rationale: Mệnh lệnh chỉ sự di chuyển; cách diễn đạt này tự nhiên trong tiếng Việt và kết hợp rõ với đích đến là ngôi làng.
- source_word: κώμην
  choice: ngôi làng
  rationale: κώμη chỉ một làng hay khu dân cư nhỏ, không phải thành phố.
- source_word: τὴν κατέναντι ὑμῶν
  choice: ở phía đối diện các anh
  rationale: Giữ ý về vị trí của ngôi làng đối diện với nơi các môn đồ đang ở, đồng thời diễn đạt tự nhiên trong tiếng Việt.
- source_word: εὐθὺς εἰσπορευόμενοι εἰς αὐτὴν
  choice: Ngay khi vào làng
  rationale: Chuyển cấu trúc phân từ sang mệnh đề thời gian tự nhiên, vẫn giữ sắc thái tức thì của εὐθύς.
- source_word: πῶλον
  choice: một con lừa con
  rationale: πῶλος có thể chỉ con vật non; trong ngữ cảnh Chúa Giê-su sắp cưỡi nó và theo truyền thống tường thuật song song, đây là lừa con. Chú thích bảo lưu phạm vi nghĩa rộng hơn của từ Hy Lạp.
- source_word: δεδεμένον
  choice: đang bị buộc
  rationale: Diễn tả trạng thái con vật đã được buộc, phù hợp với phân từ hoàn thành bị động.
- source_word: οὐδεὶς οὔπω ἀνθρώπων ἐκάθισεν
  choice: chưa có người nào từng ngồi lên nó
  rationale: Giữ rõ đối tượng là con người và ý chưa xảy ra cho đến thời điểm ấy; “ngồi lên” gần với động từ ἐκάθισεν hơn là diễn giải thành “cưỡi”.
- source_word: λύσατε αὐτὸν καὶ φέρετε
  choice: Hãy cởi dây và đem nó đến đây
  rationale: “Cởi dây” phù hợp với con vật đang bị buộc; “đem ... đến đây” truyền đạt hướng về phía người nói vốn được hàm ý trong φέρετε.
theological_decisions:
- issue: Tình trạng con vật chưa có người ngồi lên
  choice: chưa có người nào từng ngồi lên nó
  alternative: chưa ai từng cưỡi nó
  rationale: Bản dịch chính giữ cách nói cụ thể của tiếng Hy Lạp mà không giải thích thêm ý nghĩa nghi lễ hoặc thần học có thể được suy ra từ việc con vật chưa từng được sử dụng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” để chỉ Đức Giê-su và “các anh” cho lời Ngài nói với các môn đồ, tránh áp đặt sắc thái quan hệ cha-con vốn không được đại từ Hy Lạp mã hóa. Cấu trúc câu được điều chỉnh cho tự nhiên trong tiếng Việt nhưng vẫn giữ trình tự và các chi tiết của nguyên văn.
