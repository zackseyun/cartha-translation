source:
  edition: SBLGNT
  text: καὶ ⸀ἔλεγον αὐτῷ· Ἐν ποίᾳ ἐξουσίᾳ ταῦτα ποιεῖς; ⸀ἢ τίς σοι ⸂ἔδωκεν τὴν ἐξουσίαν ταύτην⸃ ἵνα ταῦτα ποιῇς;
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/028.yaml
  text: And they were saying to him[b][a], “By what authority are you doing these things? Or who gave you this authority to do these things?”
translation:
  language: vi
  text: 'Họ nói với Ngài: “Ông làm những việc này với thẩm quyền nào?[a] Hay ai đã trao cho ông thẩm quyền ấy để ông làm những việc này?”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “Ông làm những việc này nhờ thẩm quyền nào?”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “hầu cho ông làm những việc này.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγον αὐτῷ
  choice: Họ nói với Ngài
  rationale: Dạng chưa hoàn thành diễn tả hành động nói đang diễn ra trong bối cảnh. Tiếng Việt không bắt buộc đánh dấu thể này; “họ nói với Ngài” tự nhiên hơn “họ đang nói” trong lời dẫn trực tiếp và không biến câu thành ý lặp đi lặp lại.
- source_word: Ἐν ποίᾳ ἐξουσίᾳ
  choice: Ông lấy thẩm quyền nào mà
  rationale: Cách nói này diễn đạt tự nhiên ý hỏi về cơ sở hoặc nguồn ủy quyền, đồng thời giữ trọng tâm ở “thẩm quyền” chứ không thu hẹp thành năng lực hay quyền lực cưỡng chế.
- source_word: ἐξουσίᾳ / ἐξουσίαν
  choice: thẩm quyền
  rationale: Trong bối cảnh các lãnh đạo chất vấn Chúa Giê-su tại đền thờ, từ này chỉ quyền hoặc tư cách chính đáng để hành động; “thẩm quyền” phù hợp hơn “quyền lực”.
- source_word: ταῦτα ποιεῖς / ταῦτα ποιῇς
  choice: làm những việc này / để ông làm những việc này
  rationale: Giữ số nhiều của ταῦτα, có thể bao quát các hành động và việc giảng dạy gần đây của Chúa Giê-su.
- source_word: ἢ
  choice: Hay
  rationale: Giới thiệu câu hỏi thứ hai như một cách chất vấn liên hệ chặt chẽ và thay thế cho câu hỏi thứ nhất.
- source_word: τίς σοι ἔδωκεν
  choice: ai đã trao cho ông
  rationale: “Đã trao” diễn đạt tự nhiên động từ aorist ἔδωκεν và phù hợp với việc trao thẩm quyền.
- source_word: ἵνα ταῦτα ποιῇς
  choice: để ông làm những việc này
  rationale: Giữ sắc thái mục đích hoặc sự cho phép của ἵνα với lối diễn đạt tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Nguồn thẩm quyền của Chúa Giê-su
  choice: Trình bày trung tính lời chất vấn về thẩm quyền, không nêu trước nguồn thẩm quyền ấy
  alternative: Diễn giải thành “thẩm quyền từ Đức Chúa Trời”
  rationale: Câu này ghi lại câu hỏi của những người đối chất chứ chưa đưa ra câu trả lời của người kể chuyện; bản dịch cần giữ nguyên sự căng thẳng thần học.
- issue: Cách xưng hô trong lời chất vấn
  choice: Người kể gọi Chúa Giê-su là “Ngài”, còn những người chất vấn gọi trực tiếp là “ông”
  alternative: Dùng “Ngài” cả trong lời chất vấn
  rationale: “Ông” là đại từ trực tiếp tự nhiên, tương đối trung tính trong tiếng Việt hiện đại và phản ánh thái độ chất vấn mà không thêm sự tôn kính không được biểu thị rõ trong nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “thẩm quyền” nhất quán cho ἐξουσία; giữ hai lần “những việc này” để phản ánh cấu trúc nhấn mạnh của nguyên văn.
