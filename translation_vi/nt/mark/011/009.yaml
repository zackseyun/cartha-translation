id: MRK.11.9
reference: Mark 11:9
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ οἱ προάγοντες καὶ οἱ ἀκολουθοῦντες ⸀ἔκραζον· Ὡσαννά· Εὐλογημένος ὁ ἐρχόμενος ἐν ὀνόματι κυρίου·
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/009.yaml
  text: And those going ahead and those following were crying out[b][a], “Hosanna! Blessed is the one who comes in the name of the Lord!”
translation:
  language: vi
  text: 'Cả những người đi trước lẫn những người theo sau đều hô vang: “Hô-sa-na![a] Chúc tụng Đấng đến nhân danh Chúa!”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Hô-sa-na” là lời tung hô phụng vụ có gốc Hê-bơ-rơ/A-ram, nghĩa ban đầu gần như “xin cứu” hoặc “xin cứu ngay”; tại đây, từ này cũng được dùng như tiếng reo ca ngợi.
    reason: lexical_alternative
  - marker: b
    text: Lời tung hô này vọng lại Thi Thiên 118:26.
    reason: cross_reference
lexical_decisions:
- source_word: οἱ προάγοντες
  choice: những người đi trước
  rationale: Cụm phân từ hiện tại có mạo từ chỉ nhóm người ở phía trước trong đoàn; cách dịch này tự nhiên và giữ được hình ảnh họ đang đi trước.
- source_word: οἱ ἀκολουθοῦντες
  choice: những người theo sau
  rationale: Cụm phân từ hiện tại có mạo từ, song song với οἱ προάγοντες, chỉ nhóm người đi phía sau.
- source_word: ἔκραζον
  choice: đều hô vang
  rationale: Thì chưa hoàn thành diễn tả tiếng hô đang tiếp diễn hoặc lặp lại; “hô vang” phù hợp với lời tung hô công khai của đám đông.
- source_word: Ὡσαννά
  choice: Hô-sa-na
  rationale: Giữ hình thức phiên âm của lời tung hô phụng vụ có gốc Hê-bơ-rơ/A-ram, đồng thời giải thích nghĩa gốc và chức năng trong chú thích.
- source_word: Εὐλογημένος
  choice: Chúc tụng
  rationale: Trong công thức tung hô trích dẫn Thi Thiên 118:26, “chúc tụng” truyền đạt tự nhiên ý nghĩa tôn vinh của phân từ bị động mà vẫn giữ sắc thái Kinh Thánh.
- source_word: ὁ ἐρχόμενος
  choice: Đấng ngự đến
  rationale: Phân từ hiện tại có mạo từ được dùng như danh từ. “Đấng ngự đến” trang trọng, tự nhiên trong ngữ cảnh tung hô, nhưng không thêm trực tiếp danh hiệu “Đấng Mê-si” hay “Vua” vốn không có trong câu Hy Lạp.
- source_word: ἐν ὀνόματι κυρίου
  choice: nhân danh Chúa
  rationale: Thành ngữ Kinh Thánh tự nhiên trong tiếng Việt, biểu thị việc đến với thẩm quyền hoặc tư cách đại diện của Chúa và bảo tồn liên hệ với Thi Thiên.
- source_word: κυρίου
  choice: Chúa
  rationale: Cách dịch thông dụng, trang trọng của κύριος trong công thức trích dẫn Kinh Thánh này.
theological_decisions:
- issue: Có nên nói rõ người được tung hô là Đấng Mê-si hay Vua hay không
  choice: 'Giữ nguyên lời dẫn mang âm hưởng Thi Thiên: “Chúc tụng Đấng ngự đến nhân danh Chúa,” không thêm “Đấng Mê-si” hoặc “Vua.”'
  alternative: “Chúc tụng Đấng Mê-si ngự đến nhân danh Chúa” hoặc “Chúc tụng Vua ngự đến nhân danh Chúa.”
  rationale: Trong bối cảnh, lời tung hô có ý nghĩa về Đấng Mê-si, nhưng bản văn Hy Lạp ở câu này không nêu danh hiệu ấy. Không thêm danh hiệu giúp bảo tồn sức nặng thần học và sự căng thẳng diễn giải của lời trích dẫn.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Cấu trúc “cả… lẫn…” thể hiện hai nhóm song song; “hô vang” giữ sắc thái tiếp diễn của động từ Hy Lạp. Các dấu chú thích [a], [b] đều xuất hiện trong chính văn.
