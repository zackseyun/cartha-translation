review_pass:
  verdict: revise
  source_fidelity: Cấu trúc hai nhóm đi trước/đi theo, tiếng hô công khai, lời tung hô Hô-sa-na và thành ngữ “nhân danh Chúa” đều phản ánh sát bản Hy Lạp. Tuy nhiên, “ngự đến” thêm sắc thái hoàng gia/thần linh không được biểu thị bởi phân từ ἐρχόμενος (“đến”).
  naturalness: Bản dịch trang trọng, rõ ràng và tự nhiên trong tiếng Việt hiện đại. “Cả… lẫn…” diễn đạt tốt hai nhóm song song; “hô vang” phù hợp với bối cảnh đoàn người công khai.
  terminology: “Hô-sa-na,” “Chúa,” và “nhân danh Chúa” thích hợp, đồng thời duy trì âm hưởng của Thi Thiên 118:26. Giữ “Đấng đến” bảo toàn lối văn Kinh Thánh mà không đưa vào sắc thái tước vị của “ngự.”
