revisions:
- from: 'Cả những người đi trước lẫn những người theo sau đều hô vang: “Hô-sa-na![a] Chúc tụng Đấng ngự đến nhân danh Chúa!”[b]'
  to: 'Cả những người đi trước lẫn những người theo sau đều hô vang: “Hô-sa-na![a] Chúc tụng Đấng đến nhân danh Chúa!”[b]'
  rationale: Chỉ thay “ngự đến” bằng “đến.” Sửa đổi này loại bỏ sắc thái hoàng gia/thần linh được tiếng Việt hàm ý trong “ngự,” nhưng vẫn giữ cách gọi trang trọng “Đấng,” công thức chúc tụng, và liên hệ minh thị với Thi Thiên 118:26. Không thêm danh hiệu Mê-si hay Vua.
