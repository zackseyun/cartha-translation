  text: ὁ δὲ ⸀Ἰησοῦς εἶπεν αὐτοῖς· Ἐπερωτήσω ⸀ὑμᾶς ἕνα λόγον, καὶ ἀποκρίθητέ μοι, καὶ ἐρῶ ὑμῖν ἐν ποίᾳ ἐξουσίᾳ ταῦτα ποιῶ·
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/029.yaml
  text: But Jesus said to them[a], “I will ask you one question. Answer me[b], and I will tell you by what authority I do these things.”
translation:
  language: vi
  text: 'Nhưng Giê-su nói với họ: “Tôi sẽ hỏi các ông một câu. Hãy trả lời tôi, rồi tôi sẽ nói cho các ông biết tôi làm những việc này bởi thẩm quyền nào.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: Nhưng
  rationale: Đánh dấu sự chuyển ý có sắc thái đối đáp với câu hỏi của các lãnh đạo ở câu trước; “Nhưng” tự nhiên và giữ được nét tương phản nhẹ.
- source_word: Ἰησοῦς
  choice: Đức Giê-su
  rationale: Dùng cách viết tên riêng phổ biến trong văn phong Kinh Thánh tiếng Việt hiện đại, với kính xưng tự nhiên.
- source_word: εἶπεν αὐτοῖς
  choice: nói với họ
  rationale: Cách diễn đạt trực tiếp, tự nhiên và sát cấu trúc động từ nói kèm đối tượng tiếp nhận.
- source_word: Ἐπερωτήσω ὑμᾶς
  choice: Tôi sẽ hỏi các ông
  rationale: Thì tương lai mở đầu câu hỏi đối đáp; “hỏi” là cách diễn đạt rõ ràng, hiện đại.
- source_word: ἕνα λόγον
  choice: một câu
  rationale: λόγος theo nghĩa đen là “lời”, nhưng trong ngữ cảnh chỉ điều được nêu ra để họ trả lời. “Một câu” tự nhiên trong tiếng Việt và không cần thêm từ “hỏi” sau động từ “hỏi”.
- source_word: ἀποκρίθητέ μοι
  choice: Hãy trả lời tôi
  rationale: Giữ rõ lực mệnh lệnh của động từ aorist imperative và diễn đạt tự nhiên.
- source_word: ἐρῶ ὑμῖν
  choice: tôi sẽ nói cho các ông biết
  rationale: Diễn đạt tự nhiên lời hứa sẽ cung cấp thông tin, đồng thời giữ đối tượng số nhiều.
- source_word: ἐν ποίᾳ ἐξουσίᾳ
  choice: bởi thẩm quyền nào
  rationale: Nêu căn cứ hoặc quyền hạn làm nền tảng cho hành động; “thẩm quyền” giữ được sắc thái chính thức của cuộc tranh luận.
- source_word: ταῦτα ποιῶ
  choice: tôi làm những việc này
  rationale: Giữ thì hiện tại và chỉ các hành động đang bị chất vấn trong ngữ cảnh.
theological_decisions:
- issue: Ý nghĩa của ἐξουσία trong ngữ cảnh
  choice: thẩm quyền
  alternative: quyền; quyền năng
  rationale: Trọng tâm cuộc tranh luận là căn cứ chính đáng và quyền hạn để Đức Giê-su hành động, không chỉ là khả năng hay sức mạnh; “thẩm quyền” giữ được sức nặng thể chế và thần học mà không giải thích quá mức.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “các ông” vì Đức Giê-su đang đáp lời nhóm lãnh đạo tôn giáo; tách câu sau mệnh đề mở đầu để lời mệnh lệnh rõ và tự nhiên. Không thêm chú thích vì các phương án dịch khác không cần thiết để hiểu câu và không có dấu chú thích trong bản dịch chính.
