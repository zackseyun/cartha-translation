  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ⸀διελογίζοντο πρὸς ἑαυτοὺς λέγοντες· ⸂Τί εἴπωμεν;⸃ ἐὰν εἴπωμεν· Ἐξ οὐρανοῦ, ἐρεῖ· Διὰ τί ⸀οὖν οὐκ ἐπιστεύσατε αὐτῷ;
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/031.yaml
  text: And they were reasoning among themselves[a], saying, “What should we say? If we say, ‘From heaven,’ he will say, ‘Why then did you not believe him?’”
translation:
  language: vi
  text: 'Họ bàn bạc với nhau: “Chúng ta nên trả lời thế nào? Nếu chúng ta nói: ‘Từ trời[a],’ Người sẽ nói: ‘Vậy tại sao các ông không tin người?’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Từ trời” là lối nói tránh đầy kính trọng của người Do Thái để chỉ điều đến từ Đức Chúa Trời hoặc có nguồn gốc thần linh.
    reason: cultural_note
lexical_decisions:
- source_word: διελογίζοντο
  choice: bàn
  rationale: Động từ ở thì chưa hoàn thành diễn tả sự cân nhắc đang diễn ra; trong ngữ cảnh có πρὸς ἑαυτούς, “bàn với nhau” vừa tự nhiên vừa giữ ý cùng nhau suy xét.
- source_word: πρὸς ἑαυτοὺς
  choice: với nhau
  rationale: Cụm từ chỉ sự trao đổi qua lại trong chính nhóm người ấy, không chỉ là suy nghĩ thầm của từng cá nhân.
- source_word: λέγοντες
  choice: rằng
  rationale: Dẫn trực tiếp nội dung họ đang bàn bạc một cách gọn và tự nhiên trong tiếng Việt.
- source_word: Τί εἴπωμεν;
  choice: Chúng ta nên trả lời thế nào?
  rationale: Thể giả định mang sắc thái cân nhắc về câu trả lời phải đưa ra; “nên trả lời thế nào” hợp ngữ cảnh đối đáp hơn cách dịch sát chữ “nên nói gì”.
- source_word: ἐὰν εἴπωμεν
  choice: Nếu nói
  rationale: Diễn đạt điều kiện giả định rõ ràng; chủ ngữ “chúng ta” được tỉnh lược tự nhiên sau câu trước.
- source_word: Ἐξ οὐρανοῦ
  choice: Từ trời
  rationale: Giữ nguyên hình ảnh và thành ngữ kính ngữ của nguyên văn, thay vì diễn giải trực tiếp thành “từ Đức Chúa Trời”.
- source_word: ἐρεῖ
  choice: ông ấy sẽ hỏi
  rationale: λέγω theo nghĩa cơ bản là “nói”, nhưng lời được dẫn theo sau là một câu hỏi; “sẽ hỏi” truyền đạt chức năng lời nói tự nhiên trong tiếng Việt mà không đổi nội dung.
- source_word: Διὰ τί οὖν
  choice: Vậy tại sao
  rationale: “Vậy” thể hiện kết luận suy ra từ câu trả lời giả định, tương ứng với οὖν.
- source_word: οὐκ ἐπιστεύσατε αὐτῷ
  choice: các ông không tin người
  rationale: πιστεύω với tặng cách ở đây là tin lời hoặc lời chứng của Giăng. “Tin người” tránh sắc thái “tin vào” vốn có thể gợi lòng tin cứu rỗi; đại từ “người” dùng kính trọng cho Giăng trong văn phong Kinh Thánh.
theological_decisions:
- issue: Ý nghĩa của “từ trời” đối với phép báp-têm hoặc thẩm quyền của Giăng
  choice: Giữ “Từ trời” trong chính văn
  alternative: Từ Đức Chúa Trời
  rationale: Cách dịch này bảo toàn thành ngữ Do Thái chỉ nguồn gốc hoặc thẩm quyền thần thượng, đồng thời không biến hàm ý thành lời giải thích trực tiếp trong chính văn.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. “Họ bàn với nhau” diễn đạt tự nhiên tiến trình cân nhắc chung; lời thoại dùng “chúng ta/các ông” để làm rõ các ngôi xưng hô. Dấu chân chú [a] được đặt ngay sau thành ngữ cần giải thích.
