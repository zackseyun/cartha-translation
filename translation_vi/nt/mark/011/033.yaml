- from: 'Họ đáp lời Đức Giê-su: “Chúng tôi không biết.” Đức Giê-su nói với họ: “Tôi cũng không nói cho các ông biết tôi làm những việc này bởi thẩm quyền nào.”'
  to: 'Họ trả lời Đức Giê-su: “Chúng tôi không biết.” Đức Giê-su nói với họ: “Tôi cũng không nói cho các ông biết tôi làm những việc này nhờ thẩm quyền nào[a].”'
  rationale: Chỉnh nhẹ để câu văn tự nhiên hơn mà vẫn giữ hiện tại trần thuật, thế đối xứng phủ định, và nghĩa căn cứ/ủy quyền của nguyên ngữ. Bổ sung neo chú thích cho phương án dịch từ vựng đã được ghi nhận trong audit trail tiếng Anh.
  reviewer_model: gpt-5.6-terra
