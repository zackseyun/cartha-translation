source:
  edition: SBLGNT
  text: καὶ ἀποκριθέντες ⸂τῷ Ἰησοῦ λέγουσιν⸃· Οὐκ οἴδαμεν. καὶ ὁ ⸀Ἰησοῦς λέγει αὐτοῖς· Οὐδὲ ἐγὼ λέγω ὑμῖν ἐν ποίᾳ ἐξουσίᾳ ταῦτα ποιῶ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/033.yaml
  text: And answering Jesus[a], they say, “We do not know.” And Jesus says to them, “Neither do I tell you by what authority I do these things.”
translation:
  language: vi
  text: 'Họ trả lời Đức Giê-su: “Chúng tôi không biết.” Đức Giê-su nói với họ: “Tôi cũng không nói cho các ông biết tôi làm những việc này nhờ thẩm quyền nào[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “với thẩm quyền nào.”'
    reason: Phương án dịch từ vựng cho cụm ἐν ποίᾳ ἐξουσίᾳ.
lexical_decisions:
- source_word: ἀποκριθέντες
  choice: đáp lời
  rationale: Diễn đạt tự nhiên phân từ dẫn vào lời đáp, đồng thời giữ liên kết với lời thoại tiếp theo.
- source_word: λέγουσιν / λέγει / λέγω
  choice: đáp lời / nói / nói cho... biết
  rationale: Dùng hiện tại trần thuật phù hợp mạch kể Hy Lạp; ở mệnh đề cuối, “nói cho các ông biết” là cách diễn đạt tiếng Việt tự nhiên trước câu hỏi gián tiếp.
- source_word: Οὐκ οἴδαμεν
  choice: Chúng tôi không biết
  rationale: Chuyển đạt trực tiếp thể phủ định với ý nghĩa hiện tại.
- source_word: Οὐδὲ ἐγὼ
  choice: Tôi cũng không
  rationale: Giữ sự đối xứng tu từ giữa việc họ không trả lời và việc Đức Giê-su cũng không cho biết.
- source_word: ἐν ποίᾳ ἐξουσίᾳ
  choice: bởi thẩm quyền nào
  rationale: Diễn tả căn cứ hoặc thẩm quyền mà nhờ đó hành động được thực hiện; tự nhiên trong tiếng Việt và không thu hẹp nghĩa.
- source_word: ταῦτα
  choice: những việc này
  rationale: Giữ số nhiều của đại từ chỉ định, quy chiếu đến các hành động gần đây của Đức Giê-su.
- source_word: ποιῶ
  choice: tôi làm
  rationale: Thì hiện tại đơn phù hợp ngữ cảnh và tự nhiên trong tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Đức Giê-su” theo lối gọi kính trọng phổ biến; “các ông” phù hợp lời nói với nhóm lãnh đạo tôn giáo mà không thêm sắc thái miệt thị.
