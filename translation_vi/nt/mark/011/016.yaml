  yaml_path: translation/nt/mark/011/016.yaml
  text: And he would not allow anyone to carry a vessel through the temple courts[a][b].
translation:
  language: vi
  text: Ngài không cho phép ai mang đồ vật đi qua khuôn viên đền thờ[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “khu vực đền thờ.” Từ Hy Lạp chỉ toàn bộ quần thể đền thờ, chứ không riêng nơi thánh bên trong.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “vật chứa” hoặc “dụng cụ.” Từ Hy Lạp có nghĩa rộng và không xác định đó là loại vật gì.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤφιεν
  choice: không cho
  rationale: Dạng chưa hoàn thành diễn tả việc Ngài liên tục ngăn cản hoặc nhất quyết không cho phép trong lúc ấy; “không cho” tự nhiên trong tiếng Việt và phù hợp với sắc thái kéo dài trong ngữ cảnh.
- source_word: ἵνα τις διενέγκῃ
  choice: cho ai mang ... đi qua
  rationale: Sau ἤφιεν, ἵνα với động từ giả định nêu điều không được phép xảy ra. Cấu trúc “không cho ai...” diễn đạt tự nhiên ý này trong tiếng Việt.
- source_word: διενέγκῃ
  choice: mang ... đi qua
  rationale: Trong ngữ cảnh này, διαφέρω chỉ việc mang hoặc chuyển một thứ từ nơi này sang nơi khác qua một khu vực; “mang ... đi qua” giữ rõ sắc thái chuyển xuyên qua.
- source_word: σκεῦος
  choice: vật dụng
  rationale: Từ này có nghĩa rộng, có thể chỉ đồ vật, dụng cụ hoặc vật chứa. “Vật dụng” là cách diễn đạt tự nhiên mà không xác định quá mức món đồ thuộc loại nào.
- source_word: διὰ τοῦ ἱεροῦ
  choice: đi qua khuôn viên đền thờ
  rationale: ἱερόν chỉ toàn bộ quần thể hay khu vực đền thờ, không riêng nơi thánh bên trong (ναός). “Khuôn viên đền thờ” truyền đạt phạm vi rộng ấy rõ ràng trong tiếng Việt.
theological_decisions:
- issue: Phạm vi nghĩa của ἱερόν khi nói về đền thờ Giê-ru-sa-lem
  choice: khuôn viên đền thờ
  alternative: đền thờ; khu vực đền thờ
  rationale: Cách dịch này cho thấy hành động diễn ra trong quần thể đền thờ rộng hơn, chứ không hàm ý rằng người ta đi xuyên qua chính nơi thánh bên trong. Đây là một phân biệt quan trọng về bối cảnh, không phải sự khẳng định giáo phái.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Ngài” nối chủ thể với văn mạch; “cũng” thể hiện καί. Câu giữ nguyên tính khái quát của σκεῦος và phân biệt ἱερόν với nơi thánh bên trong.
