  naturalness: Câu sửa vẫn hiện đại, trang trọng và tự nhiên. «Không cho phép ai mang đồ vật đi qua» là cấu trúc rõ ràng, phù hợp văn mạch kể chuyện.
  terminology: «Khuôn viên đền thờ» thích hợp cho ἱερόν, phân biệt với nơi thánh bên trong. «Đồ vật» tránh thu hẹp σκεῦος thành vật dụng; chú thích nêu các khả năng «vật chứa» và «dụng cụ».
