- from: Ngài cũng không cho ai mang vật dụng đi qua khuôn viên đền thờ[a][b].
  to: Ngài không cho phép ai mang đồ vật đi qua khuôn viên đền thờ[a][b].
  rationale: Đổi «vật dụng» thành «đồ vật» để giữ độ rộng của σκεῦος, và bỏ «cũng» để câu tiếng Việt không thêm sắc thái không cần thiết. Giữ «khuôn viên đền thờ» để phản ánh ἱερόν là toàn thể khu vực đền thờ, không phải riêng nơi thánh bên trong.
