  yaml_path: translation/nt/mark/011/030.yaml
  text: Was John's baptism from heaven or from men? Answer me[a][b].
translation:
  language: vi
  text: Phép báp-têm của Giăng là từ trời[a] hay từ loài người[b]? Hãy trả lời tôi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể hiểu là “từ Đức Chúa Trời”. Tiếng Hy Lạp chép “từ trời”, giữ lối nói Do Thái chỉ nguồn gốc hoặc thẩm quyền thuộc về Đức Chúa Trời.
    reason: lexical_alternative
  - marker: b
    text: “Từ loài người” nghĩa là chỉ có nguồn gốc hoặc thẩm quyền của con người.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ βάπτισμα τὸ Ἰωάννου
  choice: Phép báp-têm của Giăng
  rationale: Cách diễn đạt này tự nhiên trong tiếng Việt, giữ được kết cấu sở hữu và chỉ phép báp-têm gắn với Giăng.
- source_word: ἐξ οὐρανοῦ
  choice: đến từ trời
  rationale: Giữ nguyên hình ảnh 'từ trời' của tiếng Hy Lạp thay vì diễn giải thẳng thành 'từ Đức Chúa Trời', đồng thời diễn đạt tự nhiên ý về nguồn gốc hoặc thẩm quyền.
- source_word: ἐξ ἀνθρώπων
  choice: đến từ loài người
  rationale: '''Loài người'' mang nghĩa khái quát, không giới hạn ở nam giới, và tạo thế tương phản rõ với ''trời'' về nguồn gốc hoặc thẩm quyền.'
- source_word: ἀποκρίθητέ μοι
  choice: Hãy trả lời ta
  rationale: Mệnh lệnh trực tiếp trong tiếng Hy Lạp được giữ bằng 'hãy trả lời'; đại từ 'ta' phù hợp với lời chất vấn trang trọng, dứt khoát của Chúa Giê-xu.
- source_word: ἦν ἢ
  choice: đến từ ... hay từ ...?
  rationale: Tiếng Việt diễn đạt nguồn gốc tự nhiên hơn bằng 'đến từ'; cấu trúc nghi vấn lựa chọn vẫn giữ đầy đủ sự đối lập của nguyên văn.
theological_decisions:
- issue: Ý nghĩa của cụm từ 'từ trời' trong câu hỏi của Chúa Giê-xu
  choice: Giữ thành ngữ 'từ trời' trong chính văn, hàm ý nguồn gốc hoặc thẩm quyền thần thượng.
  alternative: từ Đức Chúa Trời
  rationale: Nguyên văn dùng 'trời', một lối nói Do Thái kính cẩn ám chỉ Đức Chúa Trời. Giữ nguyên thành ngữ bảo toàn hình ảnh và sức chất vấn mà không đưa phần diễn giải vào chính văn.
translation_notes:
  register: Văn phong hiện đại, rõ ràng và trang trọng. Giữ thuật ngữ quen dùng “phép báp-têm”, thành ngữ nguyên ngữ “từ trời”, và sắc thái mệnh lệnh trực tiếp của câu cuối.
