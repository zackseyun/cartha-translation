- from: Phép báp-têm của Giăng đến từ trời[a] hay từ loài người[b]? Hãy trả lời ta.
  to: Phép báp-têm của Giăng là từ trời[a] hay từ loài người[b]? Hãy trả lời tôi.
  rationale: Bản sửa giữ nguyên cách gọi “phép báp-têm”, tên Giăng, và thành ngữ “từ trời” trong chính văn. Việc thay “đến từ” bằng “là từ” phản ánh sát hơn câu hỏi dùng ἦν về nguồn gốc/thẩm quyền; “tôi” thay “ta” bảo đảm văn phong hiện đại. Chú thích được chỉnh để giải thích thành ngữ chính xác và tự nhiên hơn, không diễn giải thay cho chính văn.
  reviewer_model: gpt-5.6-terra
