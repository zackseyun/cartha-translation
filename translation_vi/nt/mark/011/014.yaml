  text: καὶ ⸀ἀποκριθεὶς εἶπεν αὐτῇ· Μηκέτι ⸂εἰς τὸν αἰῶνα ἐκ σοῦ⸃ μηδεὶς καρπὸν φάγοι. καὶ ἤκουον οἱ μαθηταὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/014.yaml
  text: And answering[a], he said to it[c][b], “May no one ever eat fruit from you again.” And his disciples were listening.
translation:
  language: vi
  text: 'Ngài đáp lời[a] và nói với cây ấy: “Nguyện từ nay không bao giờ còn ai ăn trái từ mày nữa!”[b] Các môn đồ của Ngài đều đang nghe.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sát hơn: “Đáp lời, Ngài nói với cây ấy.” “Đáp lời” là một lối kể chuyện quen thuộc trong tiếng Hy Lạp, ngay cả khi trước đó không ghi lại lời nói nào.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “Nguyện không ai ăn trái từ mày mãi mãi.” Tiếng Hy Lạp viết sát là “đến thời đại.”'
    reason: alternative_reading
  - marker: c
    text: 'Thì chưa hoàn thành trong tiếng Hy Lạp cũng có thể được diễn đạt: “Các môn đồ của Ngài nghe thấy lời ấy.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς
  choice: đáp lời
  rationale: Giữ nét nghĩa ‘đáp lại’ của động từ phân từ Hy Lạp, dù trước đó không có lời nói nào được ghi lại; đây là một lối kể chuyện quen thuộc chịu ảnh hưởng ngữ hệ Sê-mít.
- source_word: αὐτῇ
  choice: với cây ấy
  rationale: Đại từ giống cái quy chiếu đến cây vả; tiếng Việt tự nhiên hơn khi nêu rõ ‘cây ấy’ và không cần biểu thị giống ngữ pháp.
- source_word: Μηκέτι … εἰς τὸν αἰῶνα
  choice: từ nay không bao giờ … nữa
  rationale: Cụm diễn đạt sự chấm dứt vĩnh viễn bằng tiếng Việt tự nhiên, đồng thời giữ sức nhấn mạnh của μηκέτι kết hợp với thành ngữ εἰς τὸν αἰῶνα.
- source_word: ἐκ σοῦ
  choice: từ mày
  rationale: Giữ ngôi thứ hai trong lời nói trực tiếp với cây. ‘Mày’ là đại từ hiện đại, phù hợp khi nói với một vật vô tri và không làm lời văn trở nên cổ kính giả tạo.
- source_word: μηδεὶς καρπὸν φάγοι
  choice: Nguyện … không còn ai ăn trái
  rationale: ‘Nguyện’ thể hiện sắc thái mong muốn/nguyền phán của thức mong mỏi aorist φάγοι, thay vì biến câu thành một lời tiên đoán đơn thuần.
- source_word: ἤκουον
  choice: đang nghe
  rationale: Thì chưa hoàn thành mô tả hành động đang diễn ra; ‘đang nghe’ giữ phương diện kéo dài mà không buộc phải thêm một tân ngữ không có trong bản Hy Lạp.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: các môn đồ Ngài
  rationale: Cách diễn đạt sở hữu trang trọng, tự nhiên và quen thuộc trong văn phong Kinh Thánh tiếng Việt.
theological_decisions:
- issue: Tính chất lời Đức Giê-su phán với cây vả
  choice: 'Diễn đạt như một lời nguyện phán/nguyền rủa: ‘Nguyện … không còn ai ăn trái…’'
  alternative: 'Diễn đạt như một lời tiên đoán: ‘Sẽ không bao giờ còn ai ăn trái…’'
  rationale: φάγοι là thức mong mỏi, mang lực ý nguyện hoặc nguyền phán, chứ không phải thì tương lai chỉ đơn thuần báo trước sự việc.
- issue: Khoảng thời gian của lời phán
  choice: ‘từ nay không bao giờ … nữa’
  alternative: ‘cho đến đời đời’ hoặc sát chữ ‘đến thời đại’
  rationale: εἰς τὸν αἰῶνα là thành ngữ có nghĩa ‘mãi mãi/không bao giờ’; bản dịch chính giữ hiệu lực lâu dài mà không áp đặt một cách hiểu kỹ thuật về ‘thời đại’.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Cấu trúc hơi khác thường ‘đáp lời’ được giữ để phản ánh lối kể của nguyên bản và được giải thích bằng chú thích. Đại từ ‘mày’ duy trì lời trực tiếp với cây mà không dùng ‘ngươi’, vốn mang sắc thái cổ trong tiếng Việt hiện đại.
