  yaml_path: translation/nt/mark/011/019.yaml
  text: And whenever evening came, they would go out of the city.
translation:
  language: vi
  text: Mỗi khi chiều xuống, họ ra khỏi thành phố.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅταν
  choice: mỗi khi
  rationale: Kết hợp với động từ ở thì chưa hoàn thành, từ này diễn tả hành động có tính lặp lại hoặc theo thông lệ, không chỉ một lần duy nhất.
- source_word: ὀψὲ ἐγένετο
  choice: chiều xuống
  rationale: Đây là cách diễn đạt tự nhiên trong tiếng Việt cho ý 'trời trở về chiều/tối', vừa giữ sắc thái thời gian vừa tránh lối dịch cứng.
- source_word: ἐξεπορεύοντο
  choice: ra khỏi
  rationale: Thì chưa hoàn thành trong ngữ cảnh này nhiều khả năng diễn tả việc thường làm; sắc thái lặp lại đã được thể hiện qua 'mỗi khi'.
- source_word: ἔξω τῆς πόλεως
  choice: khỏi thành
  rationale: Cách dịch này thể hiện chuyển động từ bên trong ra bên ngoài, phù hợp với động từ ἐξεπορεύοντο.
- source_word: πόλεως
  choice: thành
  rationale: Nguyên văn chỉ nói 'thành' mà không nêu tên Giê-ru-sa-lem, nên bản dịch không thêm địa danh.
- source_word: ἐξεπορεύοντο (plural subject implicit)
  choice: Đức Chúa Jêsus và các môn đồ
  rationale: Động từ Hy Lạp chỉ cho biết chủ ngữ số nhiều là 'họ'. Ngữ cảnh gần xác định đó là Đức Chúa Jêsus và các môn đồ; nêu rõ chủ thể giúp câu tiếng Việt đứng độc lập, dễ hiểu.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng 'mỗi khi... ra khỏi' để chuyển tải tính thường lệ của ὅταν kết hợp với động từ thì chưa hoàn thành. Tên 'Đức Chúa Jêsus' theo phong cách Kinh Thánh Tin Lành Việt ngữ, nhưng việc làm rõ chủ thể từ ngữ cảnh có thể cân nhắc lại nếu ưu tiên bám sát hình thức đại từ hàm ẩn của nguyên văn.
