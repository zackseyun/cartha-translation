  text: Καὶ τῇ ἐπαύριον ἐξελθόντων αὐτῶν ἀπὸ Βηθανίας ἐπείνασεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/012.yaml
  text: And on the next day, when they had gone out from Bethany, he was hungry.
translation:
  language: vi
  text: Hôm sau, khi họ rời Bê-tha-ni, Ngài thấy đói.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: Hôm sau
  rationale: Καί nối tiếp mạch tường thuật; trong tiếng Việt, không cần dịch riêng là “và” trước trạng ngữ thời gian, nhờ đó câu tự nhiên mà vẫn giữ rõ trình tự câu chuyện.
- source_word: τῇ ἐπαύριον
  choice: Hôm sau
  rationale: Cụm từ được dùng với chức năng trạng ngữ thời gian, chỉ ngày kế tiếp. “Hôm sau” là cách diễn đạt hiện đại, gọn và tự nhiên.
- source_word: ἐξελθόντων αὐτῶν
  choice: khi họ rời
  rationale: Kết cấu sở hữu cách tuyệt đối với phân từ aorist diễn tả hành động đi ra xảy ra trước hoặc làm bối cảnh cho động từ chính. “Khi họ rời” thể hiện chủ thể số nhiều và phù hợp cách kể chuyện tự nhiên trong tiếng Việt.
- source_word: ἀπὸ Βηθανίας
  choice: Bê-tha-ni
  rationale: ἀπό diễn tả sự chuyển động ra khỏi một nơi; kết hợp với “rời”, địa danh không cần thêm “khỏi”. “Bê-tha-ni” là dạng phiên âm quen dùng trong tiếng Việt.
- source_word: ἐπείνασεν
  choice: Ngài thấy đói
  rationale: Động từ aorist πεινάω thuật lại việc cơn đói xuất hiện hoặc trạng thái đói. “Thấy đói” truyền đạt tự nhiên sắc thái khởi phát mà không cường điệu thành một biến đổi thần học.
theological_decisions:
- issue: Chủ ngữ hàm ẩn của ἐπείνασεν
  choice: Dùng “Ngài” để chỉ Chúa Giê-su mà không thêm tên riêng.
  alternative: Dùng “Chúa Giê-su” để làm rõ, hoặc dùng “ông ấy/người”.
  rationale: Bản Hy Lạp không nêu lại chủ ngữ, nhưng văn cảnh xác định đó là Chúa Giê-su. “Ngài” giữ được sự súc tích, rõ nghĩa và giọng văn tôn kính thông dụng, đồng thời không thêm tên không có trong câu nguồn. Câu văn khẳng định trực tiếp kinh nghiệm đói thật của Ngài mà không triển khai thêm một kết luận giáo lý.
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Cấu trúc được điều chỉnh theo tiếng Việt tự nhiên; không cần chú thích vì không có dị bản hay điểm mơ hồ thiết yếu phải nêu ở câu này.
