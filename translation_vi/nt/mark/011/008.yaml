revisions:
- from: Nhiều người trải áo choàng của mình trên đường; những người khác thì chặt cành lá ngoài đồng rồi rải ra.[a]
  to: Nhiều người trải áo choàng của mình trên đường; những người khác thì cắt cành lá từ các cánh đồng rồi rải trên đường.[a]
  rationale: Chỉnh nhẹ để diễn đạt rõ nguồn gốc “từ các cánh đồng” và nơi cây lá được rải, đồng thời giữ nguyên tính rộng của στιβάδας và không thêm chi tiết “cành cọ”.
