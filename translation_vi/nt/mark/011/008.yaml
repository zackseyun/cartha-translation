  yaml_path: translation/nt/mark/011/008.yaml
  text: And many spread their cloaks on the road, and others spread leafy branches cut from the fields.
translation:
  language: vi
  text: Nhiều người trải áo choàng của mình trên đường; những người khác thì cắt cành lá từ các cánh đồng rồi rải trên đường.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hoặc chỉ là “cành”. Từ Hy Lạp ở đây chỉ chung những bó hoặc lớp cây lá đã cắt, không nói cụ thể là cành cọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὶ
  choice: nhiều người
  rationale: Tính từ được dùng độc lập, chỉ một số đông; “nhiều người” tự nhiên và không thêm mức độ nhấn mạnh.
- source_word: ἱμάτια
  choice: áo choàng
  rationale: Trong bối cảnh này, từ này chỉ áo ngoài được trải trên đường; “áo choàng” cụ thể và dễ hiểu hơn “y phục”.
- source_word: ἔστρωσαν εἰς τὴν ὁδόν
  choice: trải ... trên đường
  rationale: Diễn đạt tự nhiên hành động phủ áo lên mặt đường, thay vì dịch máy móc giới từ εἰς là “vào”.
- source_word: ἄλλοι δὲ
  choice: những người khác thì
  rationale: Thể hiện sự chuyển nhẹ sang nhóm người khác mà không cường điệu δέ thành một sự đối lập mạnh.
- source_word: στιβάδας
  choice: cành lá
  rationale: στιβάς có nghĩa rộng là lớp hoặc bó cây lá đã cắt, có thể gồm cành, lá hay cây cỏ; “cành lá” tái hiện hình ảnh tự nhiên mà không đưa “cành cọ” từ sách Giăng vào.
- source_word: κόψαντες ἐκ τῶν ἀγρῶν
  choice: chặt ... ngoài đồng rồi
  rationale: Phân từ aorist diễn tả hành động chặt trước hành động rải; “rồi” làm rõ trình tự trong tiếng Việt, còn ἀγροί được diễn đạt tự nhiên là “ngoài đồng”.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện trang trọng, hiện đại và dễ hiểu. Dùng dấu chấm phẩy để phân biệt hai nhóm người, đồng thời giữ câu liền mạch. Đại từ sở hữu “của mình” phản ánh αὐτῶν mà không gây nặng câu.
