  source_fidelity: 'Bản dịch truyền đạt đúng các yếu tố chính của câu Hy Lạp: thời điểm sáng sớm, hành động đi ngang qua làm bối cảnh, việc nhìn thấy cây vả, và tình trạng cây đã khô héo từ rễ. “Đã khô héo” diễn đạt thích hợp phân từ hoàn thành, nhấn tình trạng là kết quả đã có.'
  naturalness: Câu văn hiện đại, rõ ràng và tự nhiên. Trật tự “Sáng sớm, khi đi ngang qua, họ thấy...” giữ được quan hệ bối cảnh của phân từ παραπορευόμενοι mà không gượng ép.
  terminology: “Cây vả” là thuật ngữ Kinh Thánh quen thuộc và phù hợp. Tuy nhiên, chú thích hiện có “tận gốc” thiên về nghĩa hoàn toàn/triệt để, không bảo toàn rõ hình ảnh “từ các rễ” (ἐκ ῥιζῶν). Chú thích nên nêu một lựa chọn từ vựng trực tiếp hơn.
