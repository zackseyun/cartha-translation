  yaml_path: translation/nt/mark/011/020.yaml
  text: And as they were passing by early in the morning[a], they saw the fig tree withered from the roots.
translation:
  language: vi
  text: Sáng sớm, khi đi ngang qua, họ thấy cây vả đã khô héo từ rễ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “đã khô từ rễ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: παραπορευόμενοι
  choice: khi đi ngang qua
  rationale: Phân từ hiện tại diễn tả hành động làm bối cảnh, xảy ra đồng thời với việc họ nhìn thấy; cách dịch này tự nhiên và giữ được quan hệ thời gian ấy.
- source_word: πρωῒ
  choice: sáng sớm
  rationale: Trạng từ chỉ thời điểm vào buổi sáng sớm; cách dịch ngắn gọn, tự nhiên và giữ sắc thái sớm.
- source_word: εἶδον
  choice: họ thấy
  rationale: Động từ tri giác ở thì aorist được dịch trực tiếp, không thêm sắc thái diễn giải như “để ý thấy”.
- source_word: συκῆν
  choice: cây vả
  rationale: Đây là tên gọi thông dụng trong tiếng Việt cho cây fig trong bối cảnh Kinh Thánh.
- source_word: ἐξηραμμένην
  choice: đã khô héo
  rationale: Phân từ hoàn thành bị động mô tả tình trạng hiện tại là kết quả của một diễn biến trước đó; “đã khô héo” diễn đạt tự nhiên trạng thái của cây.
- source_word: ἐκ ῥιζῶν
  choice: từ rễ
  rationale: Giữ hình ảnh sự khô héo bắt nguồn hoặc lan ra từ phần rễ mà không diễn giải quá mức; “tận gốc” là một cách diễn đạt tự nhiên khác nhưng nhấn mạnh mức độ nhiều hơn.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Cấu trúc “Sáng sớm, khi đi ngang qua” tái hiện tự nhiên hành động làm bối cảnh trước động từ chính. Dấu chú thích được đặt ngay sau cụm từ mà chú thích giải thích, thay vì theo vị trí không tương ứng trong lớp tham khảo tiếng Anh.
