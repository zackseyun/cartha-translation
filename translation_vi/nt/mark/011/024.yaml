  text: διὰ τοῦτο λέγω ὑμῖν, πάντα ὅσα ⸂προσεύχεσθε καὶ αἰτεῖσθε⸃, πιστεύετε ὅτι ⸀ἐλάβετε, καὶ ἔσται ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/024.yaml
  text: For this reason I tell you[a], whatever you pray and ask for, believe that you have received it[b], and it will be yours.
translation:
  language: vi
  text: 'Vì vậy, tôi nói với anh em: bất cứ điều gì anh em cầu xin khi cầu nguyện, hãy tin rằng anh em đã nhận được[a], thì những điều ấy sẽ thuộc về anh em.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Một số thủ bản có cách đọc mang nghĩa “đang nhận được” thay vì “đã nhận được”. Bản Hy Lạp dùng ở đây đọc “đã nhận được”, nhấn mạnh hành động như đã hoàn tất.
    reason: alternative_reading
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Vì vậy
  rationale: Diễn đạt tự nhiên quan hệ suy luận với lời dạy ngay trước đó, đồng thời giữ sức nối kết của cụm Hy Lạp.
- source_word: λέγω ὑμῖν
  choice: tôi nói với anh em
  rationale: Giữ công thức trực tiếp và có thẩm quyền; “anh em” phù hợp lời Chúa Giê-su nói với các môn đồ trong văn phong Kinh Thánh hiện đại.
- source_word: πάντα ὅσα
  choice: mọi điều
  rationale: Giữ phạm vi bao quát của tổ hợp Hy Lạp mà vẫn tự nhiên trong tiếng Việt.
- source_word: προσεύχεσθε καὶ αἰτεῖσθε
  choice: cầu nguyện và cầu xin
  rationale: 'Thể hiện riêng cả hai động từ: hành động cầu nguyện và việc dâng lời thỉnh cầu, không thu gọn một động từ vào động từ kia.'
- source_word: πιστεύετε
  choice: hãy tin
  rationale: Dạng mệnh lệnh được thể hiện rõ bằng “hãy”; “tin” dẫn tự nhiên vào mệnh đề nội dung theo sau.
- source_word: ὅτι ἐλάβετε
  choice: rằng mình đã nhận được
  rationale: “Rằng” giới thiệu nội dung phải tin; “đã nhận được” giữ nét hoàn tất nổi bật của động từ aorist ἐλάβετε.
- source_word: καὶ ἔσται ὑμῖν
  choice: thì anh em sẽ được như vậy
  rationale: Diễn đạt tự nhiên kết quả tương lai trong tiếng Việt. “Như vậy” quy chiếu về mọi điều đã cầu xin mà không ép danh từ số nhiều theo cấu trúc không tự nhiên của tiếng Việt.
theological_decisions:
- issue: Sức thời gian của lời cầu nguyện được đáp trong tương quan với đức tin
  choice: 'Giữ trình tự nghịch lý: “hãy tin rằng mình đã nhận được, thì anh em sẽ được như vậy.”'
  alternative: hãy tin rằng mình đang nhận được / sẽ nhận được
  rationale: Bản SBLGNT đọc ἐλάβετε, một dạng aorist, nên bản dịch giữ ý hành động đã hoàn tất thay vì làm phẳng thành hiện tại hoặc tương lai. Cách dịch này bảo tồn căng thẳng thần học của câu mà không áp đặt một hệ thống giáo lý cụ thể về cầu nguyện.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Giữ rõ hai động từ “cầu nguyện” và “cầu xin”, đồng thời bảo tồn nghịch lý thời gian của nguyên văn. Dùng “anh em” nhất quán cho lời trực tiếp với các môn đồ.
