revisions:
- from: 'Vì vậy, tôi nói với anh em: mọi điều anh em cầu nguyện và cầu xin, hãy tin rằng mình đã nhận được[a], thì anh em sẽ được như vậy.'
  to: 'Vì vậy, tôi nói với anh em: bất cứ điều gì anh em cầu xin khi cầu nguyện, hãy tin rằng anh em đã nhận được[a], thì những điều ấy sẽ thuộc về anh em.'
  rationale: Sửa mệnh đề cuối thành “những điều ấy sẽ thuộc về anh em” để diễn đạt minh bạch ἔσται ὑμῖν và giữ liên hệ với đối tượng cầu xin. Điều chỉnh cụm hai động từ thành “cầu xin khi cầu nguyện” cho tự nhiên trong tiếng Việt mà không làm mất ý của cả προσεύχεσθε và αἰτεῖσθε. Giữ nguyên nghịch lý thời gian “hãy tin rằng anh em đã nhận được ... thì ... sẽ thuộc về anh em.”
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T08:59:11Z'
review_pass:
  verdict: revise
  source_fidelity: Bản dịch giữ đúng quan hệ suy luận của διὰ τοῦτο, mệnh lệnh πιστεύετε, và sắc thái hoàn tất của ἐλάβετε qua “đã nhận được”. Tuy nhiên, “thì anh em sẽ được như vậy” không chuyển tải rõ mệnh đề ἔσται ὑμῖν (“sẽ là của anh em / sẽ thuộc về anh em”), và “như vậy” làm mờ đối tượng được cầu xin.
  naturalness: “Mọi điều anh em cầu nguyện và cầu xin” có thể hiểu được nhưng phối hợp hai động từ với một đối tượng chung nghe hơi gượng trong tiếng Việt hiện đại. “Bất cứ điều gì anh em cầu xin khi cầu nguyện” tự nhiên hơn, đồng thời vẫn chuyển tải việc thỉnh cầu trong bối cảnh cầu nguyện.
  terminology: “Anh em,” “cầu nguyện,” “cầu xin,” và “hãy tin” phù hợp văn phong Kinh Thánh tiếng Việt hiện đại. “Sẽ thuộc về anh em” diễn đạt tự nhiên và chính xác kết quả tương lai của ἔσται ὑμῖν, không thêm diễn giải thần học.
  issues:
  - severity: medium
    issue: Mệnh đề kết “thì anh em sẽ được như vậy” không rõ đối tượng và chưa phản ánh trực tiếp ἔσται ὑμῖν.
    rationale: Nguyên văn hứa rằng những điều được cầu xin “sẽ là/thuộc về anh em.” Cụm “được như vậy” dễ bị hiểu là nhận một kết quả mơ hồ thay vì những điều đã xin.
  - severity: low
    issue: Cụm “mọi điều anh em cầu nguyện và cầu xin” hơi gượng về kết hợp động từ trong tiếng Việt.
    rationale: Tiếng Việt thường nói “cầu xin khi cầu nguyện” hoặc “xin trong khi cầu nguyện”; cách này vẫn bảo toàn cả ý cầu nguyện và thỉnh cầu của προσεύχεσθε καὶ αἰτεῖσθε.
