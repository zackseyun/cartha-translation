id: MRK.11.15
reference: Mark 11:15
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Καὶ ἔρχονται εἰς Ἱεροσόλυμα. καὶ ⸀εἰσελθὼν εἰς τὸ ἱερὸν ἤρξατο ἐκβάλλειν τοὺς πωλοῦντας καὶ ⸀τοὺς ἀγοράζοντας ἐν τῷ ἱερῷ, καὶ τὰς τραπέζας τῶν κολλυβιστῶν καὶ τὰς καθέδρας τῶν πωλούντων τὰς περιστερὰς κατέστρεψεν
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/015.yaml
  text: And they came to Jerusalem. And entering the temple[a], he began to drive out those who were selling and those who were buying in the temple, and he overturned the tables of the money changers and the seats of those who were selling doves.
translation:
  language: vi
  text: Rồi họ đến Giê-ru-sa-lem. Khi vào khu đền thờ[a], Đức Giê-su bắt đầu đuổi những người đang bán và những người đang mua trong khu đền thờ; Người lật tung bàn của những người đổi tiền và ghế của những người bán bồ câu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên ngữ chỉ toàn bộ quần thể đền thờ, gồm các sân và những khu vực khác, chứ không riêng nơi thánh bên trong.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχονται
  choice: họ đến
  rationale: Thì hiện tại lịch sử được diễn đạt tự nhiên trong lời kể tiếng Việt bằng cấu trúc quá khứ theo ngữ cảnh; “đến” giữ đúng diễn tiến sự kiện.
- source_word: Ἱεροσόλυμα
  choice: Giê-ru-sa-lem
  rationale: Dạng phiên âm quen thuộc và rõ nghĩa trong tiếng Việt.
- source_word: εἰσελθὼν
  choice: khi vào
  rationale: Diễn đạt tự nhiên phân từ bất định, cho thấy việc vào khuôn viên đền thờ gắn liền và đi trước hành động chính mà không nhấn quá mức khoảng cách thời gian.
- source_word: τὸ ἱερὸν / ἐν τῷ ἱερῷ
  choice: khuôn viên đền thờ / tại đó
  rationale: ἱερόν chỉ toàn bộ khu đền thờ chứ không riêng nơi thánh bên trong. “Khuôn viên đền thờ” làm rõ phạm vi ngay trong chính văn; “tại đó” tránh lặp nặng nề mà vẫn giữ địa điểm.
- source_word: ἤρξατο ἐκβάλλειν
  choice: bắt đầu đuổi
  rationale: Giữ rõ ý khởi đầu của ἤρξατο và sắc thái mạnh của ἐκβάλλειν bằng cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: τοὺς πωλοῦντας καὶ τοὺς ἀγοράζοντας
  choice: những người mua bán
  rationale: Cách nói tiếng Việt gọn và tự nhiên, bao gồm cả người bán lẫn người mua; trật tự được điều chỉnh theo thành ngữ tiếng Việt mà không đổi phạm vi.
- source_word: κολλυβιστῶν
  choice: những người đổi tiền
  rationale: Cách gọi rõ ràng, thông dụng cho những người làm công việc đổi tiền trong khu đền thờ.
- source_word: καθέδρας
  choice: ghế
  rationale: Từ bao quát, tự nhiên, không xác định thêm hình dạng mà nguyên văn không nêu.
- source_word: περιστερὰς
  choice: bồ câu
  rationale: Từ tiếng Việt thông dụng, phù hợp bối cảnh các con vật được bán để dâng tế.
- source_word: κατέστρεψεν
  choice: lật đổ
  rationale: Truyền đạt hành động mạnh, áp dụng tự nhiên cho cả bàn và ghế trong ngữ cảnh.
theological_decisions:
- issue: Phạm vi của ἱερόν trong trình thuật
  choice: khuôn viên đền thờ
  alternative: đền thờ
  rationale: Nguyên ngữ chỉ khu phức hợp đền thờ rộng hơn, không riêng nơi thánh bên trong. Dịch rõ trong chính văn giúp tránh một cách hình dung sai về địa điểm mà không áp đặt kết luận thần học.
- issue: Chủ thể ngôi thứ ba số ít
  choice: Đức Giê-su / Người
  alternative: ông / Ngài
  rationale: Nêu lại Đức Giê-su giúp tiếng Việt rõ chủ thể sau mệnh đề “họ đến”; “Người” duy trì văn phong trang trọng nhưng không thêm tước hiệu thần học không có trong câu.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Câu được chia nhịp bằng dấu chấm phẩy để giữ chuỗi hành động của nguyên văn mà không trở nên nặng nề. Dùng “mua bán” theo lối nói tự nhiên của tiếng Việt, vẫn bao gồm cả hai nhóm được nêu trong tiếng Hy Lạp.
