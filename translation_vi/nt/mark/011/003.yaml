source:
  edition: SBLGNT
  text: καὶ ἐάν τις ὑμῖν εἴπῃ· Τί ποιεῖτε τοῦτο; εἴπατε ⸀ὅτι Ὁ κύριος αὐτοῦ χρείαν ἔχει· καὶ ⸀εὐθὺς αὐτὸν ἀποστέλλει ⸀πάλιν ὧδε.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/003.yaml
  text: And if anyone says to you[a], ‘Why are you doing this?’ say[b], ‘The Lord has need of it,’ and he will send it back here immediately.
translation:
  language: vi
  text: 'Nếu có ai nói với các anh: “Sao các anh lại làm việc này?” thì hãy nói: “Chúa cần nó và sẽ lập tức gửi nó trở lại đây.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Chủ cần nó và sẽ lập tức gửi nó trở lại đây.” Từ Hy Lạp κύριος có thể có nghĩa là “Chúa” hoặc “chủ”; trong ngữ cảnh này được dịch là “Chúa.” Động từ Hy Lạp được dùng ở thì hiện tại nhưng có thể diễn tả hành động tương lai.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐάν τις ὑμῖν εἴπῃ
  choice: Nếu có ai hỏi các con
  rationale: ἐάν với động từ giả định εἴπῃ nêu một điều kiện mở trong tương lai. Trong tiếng Việt, “nếu có ai hỏi” tự nhiên hơn “nói với,” vì lời tiếp theo là một câu hỏi.
- source_word: Τί ποιεῖτε τοῦτο;
  choice: Tại sao các anh làm như vậy?
  rationale: τί theo nghĩa đen có thể là “gì,” nhưng trong thành ngữ này câu hỏi thách thức hoặc đòi lý do cho hành động; “Tại sao…?” diễn đạt tự nhiên lực ngữ dụng ấy.
- source_word: εἴπατε
  choice: hãy nói
  rationale: Thể mệnh lệnh aorist số nhiều được chuyển bằng mệnh lệnh trực tiếp, rõ ràng trong tiếng Việt.
- source_word: Ὁ κύριος
  choice: Chúa
  rationale: κύριος ở đây có thể mang nghĩa “chúa/chủ,” nhưng trong ngữ cảnh Tin Mừng nhiều khả năng là tước hiệu chỉ Đức Giê-su; “Chúa” giữ được sắc thái đó mà không thêm diễn giải.
- source_word: αὐτοῦ χρείαν ἔχει
  choice: cần nó
  rationale: Cụm Hy Lạp theo nghĩa đen là “có nhu cầu về nó.” Tiếng Việt hiện đại dùng “cần nó” tự nhiên và rõ ràng; đại từ chỉ con vật được giữ trung tính.
- source_word: εὐθὺς
  choice: lập tức
  rationale: Diễn đạt tính khẩn trương đặc trưng của εὐθύς trong Mác.
- source_word: ἀποστέλλει
  choice: sẽ gửi
  rationale: Dù ở thì hiện tại hình thái học, động từ trong ngữ cảnh có thể là hiện tại mang nghĩa tương lai; “sẽ gửi” làm rõ quan hệ thời gian tự nhiên trong tiếng Việt.
- source_word: πάλιν ὧδε
  choice: trở lại đây
  rationale: πάλιν đi với động từ gửi mang nghĩa “trở lại,” còn ὧδε là “đây”; cách ghép này tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Nghĩa và đối tượng của κύριος
  choice: Dịch là “Chúa,” hiểu như tước hiệu chỉ Đức Giê-su.
  alternative: “chủ” hoặc “ông chủ,” theo nghĩa thông thường về người có quyền sở hữu hay cai quản.
  rationale: Ngữ cảnh lời chỉ dẫn của Đức Giê-su trong sách Mác ủng hộ cách hiểu như một tước hiệu, nhưng nghĩa từ vựng “chủ” vẫn thực sự có thể có nên được ghi ở chú thích.
- issue: Chủ ngữ của ἀποστέλλει
  choice: 'Hiểu chủ ngữ ngầm là “Chúa”: “Chúa… sẽ gửi nó trở lại đây.”'
  alternative: 'Hiểu là người chất vấn hoặc người đang giữ con lừa con: “người ấy sẽ lập tức gửi nó trở lại đây.”'
  rationale: Tiếng Hy Lạp không nêu chủ ngữ cho ἀποστέλλει, vì vậy có sự mơ hồ thật sự. Cú pháp gần nhất cho phép κύριος làm chủ ngữ, trong khi mạch kể cũng cho phép cách hiểu người giữ con vật sẽ thả/gửi nó đi. Bản chính chọn cách thứ nhất nhưng chú thích bảo lưu cách thứ hai.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “các con” cho lời Đức Giê-su nói với môn đồ, còn người ngoài gọi họ là “các anh.” Câu được cấu trúc để giữ tính trực tiếp của lời chỉ dẫn, đồng thời chú thích bảo lưu sự mơ hồ về κύριος và chủ ngữ ngầm của ἀποστέλλει.
