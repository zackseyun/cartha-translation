review_pass:
  verdict: revise
  source_fidelity: Bản nháp chuyển đạt đúng điều kiện, câu hỏi chất vấn, mệnh lệnh số nhiều, nhu cầu về con vật, tính tức khắc và ý trả nó về đây. Tuy nhiên, “hỏi các con” thay cho “nói với các anh” vừa thu hẹp động từ λέγῃ một cách không cần thiết, vừa thêm sắc thái quan hệ của “các con” không được nêu trong nguyên văn. Chú thích cũng trình bày chủ ngữ của ἀποστέλλει như một mơ hồ cần bảo lưu, dù cách đọc tự nhiên trong cấu trúc câu là chủ ngữ tiếp nối “Chúa/Chủ”; đối chiếu tiếng Anh chỉ lưu ý thì hiện tại mang giá trị tương lai.
  naturalness: Câu sửa dùng cách xưng hô nhất quán “các anh,” phù hợp văn phong hiện đại trong lời nói trực tiếp. “Sao các anh lại làm việc này?” tự nhiên mà vẫn phản ánh tính chất chất vấn của τί ποιεῖτε τοῦτο; “lập tức gửi nó trở lại đây” rõ ràng và gọn.
  terminology: 'Giữ “Chúa” cho ὁ κύριος, phù hợp ngữ cảnh Mác và quyết định thuật ngữ của dự án, đồng thời chú thích bảo lưu khả năng từ vựng “Chủ.” Chú thích được điều chỉnh để nêu điểm thật sự đáng lưu ý của ἀποστέλλει: hình thức hiện tại có thể được dịch theo nghĩa tương lai.'
  issues:
  - severity: medium
    issue: “hỏi các con” thay đổi cách diễn đạt và cách xưng hô của nguyên văn.
    rationale: εἴπῃ là “nói” chứ không riêng là “hỏi,” dù nội dung là câu hỏi. “Các con” thêm cách gọi mang sắc thái phụ tử/đệ tử không có trong câu Hy Lạp; “các anh” nhất quán với người được nói đến trong câu hỏi.
  - severity: medium
