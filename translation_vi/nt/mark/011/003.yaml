    rationale: 'Động từ số ít không có danh từ chủ ngữ được lặp lại, nhưng cách liên kết thông thường là với ὁ κύριος ngay trước đó: “Chúa/Chủ ... sẽ gửi.” Không cần đưa một sự chuyển chủ ngữ sang người giữ con vật vào chú thích; điều đó dễ làm người đọc hiểu sai cấu trúc câu.'
