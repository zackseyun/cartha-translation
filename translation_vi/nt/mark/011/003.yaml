  rationale: Bản sửa giữ nguyên ý nghĩa của câu và cách dịch “Chúa,” nhưng tránh thêm sắc thái xưng hô không có trong nguồn, phản ánh sát hơn động từ “nói,” và thay chú thích về chủ ngữ bằng ghi chú có cơ sở trực tiếp về nghĩa “Chủ” và thì hiện tại mang giá trị tương lai.
