    issue: Chú thích chưa nêu lý do thời gian cho “sẽ gửi.”
    rationale: ἀποστέλλει có hình thức hiện tại; bản dịch tương lai là tự nhiên trong ngữ cảnh, và đây là điểm được hồ sơ kiểm tra tiếng Anh ghi nhận.
