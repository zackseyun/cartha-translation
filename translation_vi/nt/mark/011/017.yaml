- from: 'Ngài vẫn giảng dạy và nói với họ: “Chẳng phải có lời chép rằng: ‘Nhà ta sẽ được gọi là nhà cầu nguyện cho mọi dân tộc’[a] sao? Nhưng các ngươi đã biến nhà ấy thành hang ổ của bọn cướp[b].”'
  to: 'Ngài giảng dạy và nói với họ: “Chẳng phải có lời chép rằng: ‘Nhà ta sẽ được gọi là nhà cầu nguyện cho mọi dân tộc’[a] sao? Nhưng các ngươi đã biến nhà ấy thành hang ổ của bọn cướp[b].”'
  rationale: Chỉ sửa “vẫn giảng dạy” thành “giảng dạy” để không thêm một hàm ý thời gian không được xác định bởi thì chưa hoàn thành Hy Lạp. Chú thích b được chỉnh nhẹ để gọi đúng đơn vị từ vựng được giải thích. Các lựa chọn còn lại giữ được nội dung, register, liên văn bản, và độ mơ hồ thích đáng của nguyên ngữ.
