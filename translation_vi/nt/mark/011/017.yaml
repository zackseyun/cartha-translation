    issue: “vẫn giảng dạy” thêm sắc thái không có trong nguyên ngữ.
    rationale: Thì chưa hoàn thành diễn tả hành động đang diễn ra, tiếp diễn, hoặc lặp lại trong khung cảnh thuật chuyện; nó không nhất thiết hàm ý Chúa Giê-su đã làm việc ấy từ trước và vẫn tiếp tục. “Vẫn” có thể tạo ra hàm ý đó.
  - severity: low
