    rationale: λῃστῶν là từ Hy Lạp đang được bàn đến; nên gọi là “Từ Hy Lạp này” để tránh cảm giác rằng toàn cụm “hang ổ của bọn cướp” tương ứng với chỉ một từ Hy Lạp.
