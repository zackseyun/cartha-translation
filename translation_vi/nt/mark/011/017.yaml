  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἐδίδασκεν ⸂καὶ ἔλεγεν⸃ ⸀αὐτοῖς· Οὐ γέγραπται ὅτι Ὁ οἶκός μου οἶκος προσευχῆς κληθήσεται πᾶσιν τοῖς ἔθνεσιν; ὑμεῖς δὲ ⸀πεποιήκατε αὐτὸν σπήλαιον λῃστῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/017.yaml
  text: And he was teaching and saying to them[a], “Is it not written[b], ‘My house will be called a house of prayer for all the nations’? But you have made it a den of robbers.”
translation:
  language: vi
  text: 'Ngài giảng dạy và nói với họ: “Chẳng phải có lời chép rằng: ‘Nhà ta sẽ được gọi là nhà cầu nguyện cho mọi dân tộc’[a] sao? Nhưng các ngươi đã biến nhà ấy thành hang ổ của bọn cướp[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “cho muôn dân.” Cụm từ này theo sát Ê-sai 56:7 và nhấn mạnh rằng nhà Đức Chúa Trời dành cho các dân tộc, không chỉ riêng Y-sơ-ra-ên.
    reason: lexical_alternative
  - marker: b
    text: “Hang ổ của bọn cướp” gợi lại Giê-rê-mi 7:11. Từ Hy Lạp này trong một số ngữ cảnh cũng có thể chỉ thảo khấu hoặc kẻ cướp có vũ trang.
    reason: cross_reference
lexical_decisions:
- source_word: ἐδίδασκεν καὶ ἔλεγεν
  choice: vẫn giảng dạy và nói
  rationale: Hai động từ ở thì chưa hoàn thành diễn tả hành động đang tiếp diễn trong cảnh tại đền thờ; “vẫn” chuyển tải tự nhiên sắc thái tiếp diễn mà không buộc phải hiểu là lặp đi lặp lại.
- source_word: Οὐ γέγραπται
  choice: Chẳng phải có lời chép rằng ... sao?
  rationale: Giữ hình thức câu hỏi phủ định và công thức viện dẫn Kinh Thánh, đồng thời dùng cách nói tự nhiên, trang trọng trong tiếng Việt hiện đại.
- source_word: Ὁ οἶκός μου
  choice: Nhà ta
  rationale: Dịch trực tiếp hình ảnh “nhà” trong lời trích Ê-sai 56:7, thay vì giải nghĩa thành “đền thờ”; “ta” phù hợp với lời Đức Chúa Trời trong câu trích.
- source_word: οἶκος προσευχῆς
  choice: nhà cầu nguyện
  rationale: Cách diễn đạt gọn, tự nhiên, giữ nguyên quan hệ định danh của cụm Hy Lạp.
- source_word: κληθήσεται
  choice: sẽ được gọi là
  rationale: Thể hiện đúng thì tương lai và thể bị động của động từ Hy Lạp.
- source_word: πᾶσιν τοῖς ἔθνεσιν
  choice: cho mọi dân tộc
  rationale: Giữ nghĩa phạm vi phổ quát và âm vang của Ê-sai 56:7; “dân tộc” chuyển tải ἔθνη rõ hơn cách dịch chỉ là “mọi người”.
- source_word: ὑμεῖς δὲ
  choice: Nhưng các ngươi
  rationale: Giữ liên từ tương phản và đại từ chủ ngữ được nêu rõ, mang tính nhấn mạnh. “Các ngươi” truyền đạt lời quở trách trực diện trong văn phong trang trọng.
- source_word: πεποιήκατε αὐτόν
  choice: đã biến nhà ấy thành
  rationale: Diễn đạt tự nhiên kết quả hiện tồn của thì hoàn thành. Lặp lại “nhà ấy” thay cho đại từ vô tri thiếu tự nhiên trong tiếng Việt.
- source_word: σπήλαιον λῃστῶν
  choice: hang ổ của bọn cướp
  rationale: “Hang ổ” phù hợp nghĩa nơi ẩn náu và giữ âm vang Giê-rê-mi 7:11; “bọn cướp” không áp đặt sắc thái chính trị như “quân nổi loạn”.
theological_decisions:
- issue: Phạm vi phổ quát trong lời trích tiên tri
  choice: cho mọi dân tộc
  alternative: cho muôn dân; được mọi dân tộc gọi là
  rationale: Cách chọn này giữ cách hiểu tự nhiên của lời trích Ê-sai rằng nhà Đức Chúa Trời dành cho mọi dân tộc, đồng thời chú thích khả năng diễn đạt khác mà không thu hẹp phạm vi ngoài Y-sơ-ra-ên.
- issue: Sắc thái của λῃστῶν trong lời cáo buộc
  choice: bọn cướp
  alternative: bọn thảo khấu; quân cướp có vũ trang
  rationale: Ngữ cảnh liên văn bản với Giê-rê-mi 7:11 ủng hộ nghĩa “cướp”; không đặc định hóa thành nghĩa nổi dậy hay chính trị vốn không bắt buộc trong câu này.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “Ngài” cho Chúa Giê-su trong lời kể, “ta” trong lời Đức Chúa Trời được trích dẫn, và “các ngươi” để giữ sắc thái quở trách trực diện. Các dấu chú thích được đặt ngay sau cụm từ mà chúng giải thích.
