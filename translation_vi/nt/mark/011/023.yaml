reference: Mark 11:23
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸀ἀμὴν λέγω ὑμῖν ὅτι ὃς ἂν εἴπῃ τῷ ὄρει τούτῳ· Ἄρθητι καὶ βλήθητι εἰς τὴν θάλασσαν, καὶ μὴ διακριθῇ ἐν τῇ καρδίᾳ αὐτοῦ ἀλλὰ ⸀πιστεύῃ ὅτι ⸂ὃ λαλεῖ γίνεται, ἔσται αὐτῷ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/023.yaml
  text: Truly I tell you[a], whoever says to this mountain, ‘Be lifted up and be thrown into the sea,’ and does not doubt in his heart but believes that what he says is happening[b], it will be so for him.
translation:
  language: vi
  text: 'Quả thật, tôi nói với các ông: bất cứ ai nói với ngọn núi này rằng, ‘Hãy được nhấc lên và bị ném xuống biển,’ mà trong lòng không nghi ngờ[a], nhưng tin rằng điều mình nói đang xảy ra[b], thì điều ấy sẽ xảy ra cho người ấy.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “không dao động” hoặc “không bị phân rẽ trong lòng.” Động từ Hy Lạp có thể chỉ sự nghi ngờ, dao động, hoặc phân rẽ nội tâm.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “điều mình nói xảy ra” hoặc “thành hiện thực.” Động từ Hy Lạp ở thì hiện tại (“đang xảy ra”/“xảy ra”) trước mệnh đề kết quả ở thì tương lai.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν λέγω ὑμῖν
  choice: Quả thật, tôi nói với các ông
  rationale: Giữ công thức khẳng định trang trọng mở đầu lời phán; “các ông” phù hợp với ngôi thứ hai số nhiều trong ngữ cảnh các môn đồ.
- source_word: ὃς ἂν εἴπῃ
  choice: bất cứ ai bảo
  rationale: Diễn đạt tự nhiên cấu trúc quan hệ bất định với ἄν và động từ giả định, mang nghĩa khái quát.
- source_word: τῷ ὄρει τούτῳ
  choice: ngọn núi này
  rationale: Giữ danh từ cụ thể và đại từ chỉ định, bảo toàn hình ảnh sống động của câu nói.
- source_word: Ἄρθητι καὶ βλήθητι
  choice: Hãy nhấc lên và quăng xuống
  rationale: Hai mệnh lệnh bị động được chuyển sang lối sai khiến tự nhiên trong tiếng Việt; “nhấc lên” giữ hình ảnh núi bị nâng khỏi chỗ, còn “quăng xuống” thể hiện lực của βάλλω cùng hướng vào biển.
- source_word: μὴ διακριθῇ ἐν τῇ καρδίᾳ αὐτοῦ
  choice: trong lòng không nghi ngờ
  rationale: “Nghi ngờ” rõ nghĩa trong ngữ cảnh, còn “trong lòng” giữ cách nói về nội tâm của nguyên văn.
- source_word: πιστεύῃ
  choice: tin
  rationale: Là cách tương ứng trực tiếp, tự nhiên của πιστεύω trong ngữ cảnh này.
- source_word: ὅτι ὃ λαλεῖ γίνεται
  choice: rằng điều mình nói đang xảy ra
  rationale: Giữ thì hiện tại của γίνεται thay vì đổi thành tương lai; “đang xảy ra” bảo tồn sắc thái tiến triển có thể có trong câu Hy Lạp.
- source_word: ἔσται αὐτῷ
  choice: thì điều ấy sẽ thành cho người đó
  rationale: Giữ mệnh đề kết quả ở tương lai và tính mở của cách diễn đạt Hy Lạp, không giải thích thêm cơ chế hay phạm vi của lời hứa.
theological_decisions:
- issue: Tính chất lời tuyên bố về đức tin
  choice: Dịch thẳng điều kiện tin mà không nghi ngờ và kết quả được hứa
  alternative: Giảm câu này thành phép phóng đại thuần túy, hoặc diễn giải thành lời hứa tuyệt đối không có giới hạn
  rationale: Nguyên văn giữ cả hình ảnh mạnh lẫn lời hứa có điều kiện; bản dịch không thêm các giới hạn thần học từ bên ngoài và cũng không khuếch đại thành một hệ thống giáo lý.
- issue: Sắc thái của διακριθῇ
  choice: không nghi ngờ
  alternative: không dao động; không bị phân rẽ trong chính mình
  rationale: “Nghi ngờ” tự nhiên và thích hợp nhất trong câu chính, nhưng chú thích giữ lại khả năng chỉ sự dao động hay phân rẽ nội tâm.
- issue: Thì hiện tại của γίνεται trước mệnh đề tương lai
  choice: đang xảy ra
  alternative: xảy ra; sẽ xảy ra; thành hiện thực
  rationale: Giữ sự căng thẳng về phương diện/thời gian trong nguyên văn, thay vì đồng hóa γίνεται với ἔσται ở mệnh đề sau.
- issue: Đại từ giống đực số ít αὐτοῦ / αὐτῷ
  choice: mình / người đó
  alternative: lòng người ấy / cho người ấy
  rationale: Tiếng Việt không đánh dấu giống ở các đại từ này; cách dịch vẫn giữ số ít và ý nghĩa đại diện phổ quát mà không nhập thêm giới tính không được tiếng Việt đòi hỏi.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Quả thật” cho ἀμήν; tránh lối cổ “ta phán cùng các ngươi.” Hình ảnh núi bị nhấc lên rồi quăng xuống biển được giữ cụ thể. Cả hai dấu chú thích [a], [b] đều xuất hiện trong câu chính.
