  verdict: revise
  source_fidelity: Bản nháp truyền đạt đúng cấu trúc điều kiện khái quát, sự không nghi ngờ trong lòng, niềm tin vào điều được nói, và mệnh đề kết quả tương lai. Tuy nhiên, “bảo ngọn núi này” thiếu giới từ/liên từ cần thiết trong tiếng Việt; “nhấc lên” cũng cần được đặt trong lời truyền trực tiếp rõ ràng hơn. Chú thích a hiện giải thích số nhiều của ὑμῖν nhưng không phản ánh chú thích từ vựng quan trọng về διακριθῇ và lại không được đặt tại từ cần chú thích.
  naturalness: 'Cần sửa một số chỗ để tiếng Việt hiện đại tự nhiên hơn: “nói với ngọn núi này rằng” rõ và trôi chảy; “ném xuống biển” tự nhiên hơn “quăng xuống biển” trong văn phong trang trọng; “điều ấy sẽ xảy ra cho người ấy” diễn đạt mệnh đề ἔσται αὐτῷ rõ hơn “sẽ thành cho người đó.”'
  terminology: “Quả thật,”, “tin”, “trong lòng”, “ngọn núi này”, và “biển” phù hợp. Giữ “đang xảy ra” là một cách an toàn để phản ánh thì hiện tại γίνεται mà không đồng hóa nó với tương lai ἔσται. Chú thích về “không nghi ngờ” cần nêu các khả năng “không dao động” và “không bị phân rẽ trong lòng.”
  issues:
  - severity: medium
    issue: Cấu trúc “bảo ngọn núi này” chưa tự nhiên và thiếu thành tố nối lời nói trực tiếp.
    rationale: τῷ ὄρει τούτῳ là đối tượng gián tiếp (“nói với ngọn núi này”). Tiếng Việt cần “nói với ... rằng” hoặc một cấu trúc tương đương.
  - severity: low
    issue: “Quăng xuống biển” kém trang trọng hơn “ném xuống biển.”
    rationale: Cả hai có thể dịch βάλλω, nhưng “ném” hợp văn phong hiện đại trang trọng hơn và vẫn giữ hình ảnh bị ném vào biển.
  - severity: medium
    issue: Chú thích a không ghi nhận sắc thái từ vựng của διακριθῇ và neo chú thích chưa đặt tại cụm từ liên quan.
    rationale: Nguồn và audit trail nêu rõ khả năng “dao động/phân rẽ nội tâm.” Chú thích về số nhiều của ὑμῖν không cần thiết và không thay thế được chú thích này.
  - severity: low
    issue: “Điều ấy sẽ thành cho người đó” hơi gượng trong tiếng Việt hiện đại.
    rationale: “Điều ấy sẽ xảy ra cho người ấy” bảo toàn tính mở của ἔσται αὐτῷ và dễ hiểu hơn.
