base_translation:
  language: en
  yaml_path: translation/nt/mark/011/004.yaml
  text: And they went away and found a colt tied at a door outside on the street[a], and they untied it.
translation:
  language: vi
  text: Họ đi và tìm thấy một con vật non bị buộc bên một cánh cửa phía ngoài, trên đường[a], rồi họ tháo dây cho nó.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “bên một cánh cửa, ở ngoài đường.” Cụm từ Hy Lạp có thể được hiểu với điểm nhấn không gian hơi khác nhau.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπῆλθον
  choice: đi
  rationale: Động từ chỉ việc họ rời chỗ Đức Giê-su vừa truyền dặn; trong mạch kể tiếng Việt, “đi” tự nhiên và đã hàm ý lên đường.
- source_word: εὗρον
  choice: thấy
  rationale: Trong ngữ cảnh họ đi tìm con vật đã được mô tả trước, “thấy” là cách diễn đạt tự nhiên; nghĩa phát hiện/tìm thấy vẫn được bảo toàn.
- source_word: πῶλον
  choice: lừa con
  rationale: πῶλος tự thân có thể chỉ con vật non; văn cảnh ngay trước xác định đây là lừa con. Cách dịch này rõ ràng, tự nhiên và không gây liên tưởng sai như một thuật ngữ có thể dùng cho ngựa non.
- source_word: δεδεμένον
  choice: bị buộc
  rationale: Phân từ hoàn thành bị động mô tả tình trạng con vật đang được buộc sẵn; “bị buộc” giữ được cả thể bị động lẫn trạng thái hiện hữu.
- source_word: πρὸς θύραν
  choice: bên một cánh cửa
  rationale: πρός với đối cách tại đây diễn tả vị trí gần cửa; “bên một cánh cửa” tự nhiên và không xác định đó là cánh cửa nào.
- source_word: ἔξω
  choice: ở ngoài
  rationale: Giữ riêng yếu tố không gian của ἔξω, cho biết con vật ở phía ngoài.
- source_word: ἐπὶ τοῦ ἀμφόδου
  choice: trên đường phố
  rationale: ἄμφοδον chỉ đường phố, ngõ hoặc lối đi; ἐπί với sở hữu cách định vị sự vật tại đó. “Trên đường phố” giữ cách nhấn không gian của bản văn, dù quan hệ chính xác với cửa có thể được hiểu hơi khác.
- source_word: λύουσιν αὐτόν
  choice: họ tháo dây cho nó
  rationale: Hiện tại lịch sử được chuyển thành quá khứ theo lối kể tự nhiên của tiếng Việt; “tháo dây” diễn tả cụ thể hành động cởi vật đang bị buộc.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Dấu phẩy giữ các yếu tố vị trí tách biệt nhằm phản ánh cấu trúc Hy Lạp và bảo tồn độ mơ hồ về quan hệ giữa cánh cửa, phía ngoài và đường phố.
