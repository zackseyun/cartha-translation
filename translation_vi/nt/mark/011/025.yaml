  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ὅταν ⸀στήκετε προσευχόμενοι, ἀφίετε εἴ τι ἔχετε κατά τινος, ἵνα καὶ ὁ πατὴρ ὑμῶν ὁ ἐν τοῖς οὐρανοῖς ἀφῇ ὑμῖν τὰ παραπτώματα ⸀ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/025.yaml
  text: And whenever you stand praying[a], forgive, if you have anything against anyone[b], so that your Father who is in the heavens may also forgive you your trespasses.
translation:
  language: vi
  text: Mỗi khi anh em đứng cầu nguyện, hãy tha thứ nếu anh em có điều gì bất bình với bất cứ ai, để Cha của anh em, Đấng ở trong các tầng trời,[a] cũng tha thứ cho anh em về những lỗi phạm[b] của anh em.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Đấng ở trên trời.” Tiếng Hy Lạp dùng dạng số nhiều, sát nghĩa là “ở trong các tầng trời.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “những sự vi phạm”, “những lỗi lầm” hoặc “những điều xúc phạm.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: στήκετε
  choice: đứng
  rationale: 'Giữ nguyên hình ảnh cụ thể về tư thế cầu nguyện; với ὅταν, động từ diễn tả việc thường xảy ra: “mỗi khi anh em đứng”.'
- source_word: προσευχόμενοι
  choice: cầu nguyện
  rationale: Phân từ diễn tả hành động diễn ra đồng thời với “đứng”; cách nói “đứng cầu nguyện” tự nhiên và vẫn giữ quan hệ cú pháp của nguyên văn.
- source_word: ἀφίετε
  choice: hãy tha thứ
  rationale: Trong quan hệ giữa người với người, ἀφίημι mang nghĩa tha hoặc bỏ qua lỗi phạm. Thể mệnh lệnh được thể hiện rõ bằng “hãy”.
- source_word: εἴ τι ἔχετε κατά τινος
  choice: nếu anh em có điều gì bất bình với bất cứ ai
  rationale: κατά với sở hữu cách chỉ điều chống nghịch hoặc mối bất bình đối với một người. Cách dịch này tự nhiên trong tiếng Việt và giữ phạm vi bất định rộng của τι và τινος.
- source_word: ὁ πατὴρ ὑμῶν ὁ ἐν τοῖς οὐρανοῖς
  choice: Cha của anh em, Đấng ở trên các tầng trời
  rationale: Giữ danh xưng “Cha” cùng mệnh đề mô tả, đồng thời phản ánh dạng số nhiều οὐρανοῖς mà không rút gọn thành một tính từ diễn giải.
- source_word: ἀφῇ
  choice: cũng tha thứ
  rationale: Thể giả định sau ἵνα nằm trong mệnh đề chỉ mục đích/kết quả; “để ... cũng tha thứ” thể hiện tự nhiên cấu trúc ấy và giữ καί.
- source_word: παραπτώματα
  choice: những sự vi phạm
  rationale: παράπτωμα chỉ bước sai, lỗi phạm hoặc sự vi phạm. “Sự vi phạm” giữ sắc thái đạo đức và phân biệt phần nào với từ tổng quát thường được dịch là “tội lỗi”.
theological_decisions:
- issue: Mối liên hệ có điều kiện giữa việc con người tha thứ và việc Đức Chúa Cha tha thứ
  choice: Giữ thẳng cấu trúc “hãy tha thứ ... để ... Cha ... cũng tha thứ”
  alternative: Làm nhẹ mối liên hệ bằng cách diễn giải việc tha thứ cho người khác chỉ là bằng chứng cho thấy mình đã được tha thứ
  rationale: ἵνα ... ἀφῇ trực tiếp nối mệnh lệnh tha thứ với sự tha thứ của Cha. Bản dịch giữ nguyên sức căng thần học ấy, không dùng một hệ thống giáo lý bên ngoài để giải thích thay cho câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “anh em” phù hợp lời Đức Giê-su nói với các môn đồ; “Đấng” làm rõ mệnh đề bổ nghĩa cho “Cha” mà không thêm danh xưng giáo phái. Các dấu chú thích được đặt ngay sau đúng cụm từ mà chúng giải thích.
