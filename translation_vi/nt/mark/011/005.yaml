revisions:
- from: 'Có mấy người đang đứng ở đó hỏi họ: “Các anh làm gì vậy, sao lại cởi dây cho con lừa con[a]?”'
  to: 'Có vài người trong số những người đứng ở đó nói với họ: “Các anh làm gì mà tháo dây con lừa con[a]?”'
  rationale: Bản sửa loại bỏ “sao lại”, vốn thêm ý hỏi nguyên nhân, và thay “hỏi” bằng “nói với họ” để phản ánh ἔλεγον. Cụm “Có vài người trong số những người đứng ở đó” làm rõ τινες τῶν ἐκεῖ ἑστηκότων. Chú thích giữ lại độ rộng từ vựng của πῶλος trong khi văn bản chính dùng cách gọi tự nhiên theo văn cảnh.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T08:59:03Z'
review_pass:
  verdict: revise
  source_fidelity: Bản dịch nhận diện đúng các thành phần chính. Tuy nhiên, “sao lại” chuyển câu hỏi Τί ποιεῖτε từ “các anh đang làm gì?” thành câu hỏi nguyên nhân “tại sao các anh làm vậy?”, một sắc thái không được nêu rõ trong tiếng Hy Lạp. Động từ ἔλεγον cũng nên được dịch là “nói” thay vì “hỏi” để sát cách diễn đạt nguồn hơn.
  naturalness: “Có vài người trong số những người đứng ở đó nói với họ” và lời thoại “Các anh làm gì mà tháo dây con lừa con?” là tiếng Việt hiện đại, tự nhiên, đồng thời giữ cấu trúc câu hỏi về hành động đang diễn ra.
  terminology: “Con lừa con” là cách diễn đạt rõ và phù hợp văn cảnh cho πῶλος, miễn chú thích tiếp tục cho biết bản thân từ Hy Lạp có nghĩa rộng hơn là con vật non. “Tháo dây” diễn đạt tự nhiên hành động λύοντες trong văn cảnh con vật bị buộc.
  issues:
  - severity: medium
    issue: “sao lại cởi dây” thêm câu hỏi về lý do.
    rationale: Τί ποιεῖτε là “các anh đang làm gì?”, còn λύοντες mô tả hành động kèm theo. “Sao lại” tương đương “tại sao lại”, thu hẹp/chuyển trọng tâm câu hỏi vượt quá nguyên văn.
  - severity: low
    issue: “hỏi họ” kém sát với ἔλεγον.
    rationale: Dù lời nói có hình thức nghi vấn, ἔλεγον là “đã/đang nói với họ”; dùng “nói với họ” giữ được động từ tường thuật và sắc thái chưa hoàn thành tốt hơn.
  revised_text: 'Có vài người trong số những người đứng ở đó nói với họ: “Các anh làm gì mà tháo dây con lừa con[a]?”'
