  text: καί τινες τῶν ἐκεῖ ἑστηκότων ἔλεγον αὐτοῖς· Τί ποιεῖτε λύοντες τὸν πῶλον;
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/005.yaml
  text: And some of those standing there were saying to them[a], “What are you doing, untying the colt?”
translation:
  language: vi
  text: 'Có vài người trong số những người đứng ở đó nói với họ: “Các anh làm gì mà tháo dây con lừa con[a]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hy Lạp có thể chỉ một con vật còn non; trong văn cảnh này, từ đó chỉ một con lừa.
    reason: lexical_alternative
lexical_decisions:
- source_word: τινες
  choice: mấy người
  rationale: Diễn đạt tự nhiên một nhóm người không xác định trong số những người có mặt.
- source_word: τῶν ἐκεῖ ἑστηκότων
  choice: đang đứng ở đó
  rationale: Giữ rõ địa điểm ἐκεῖ và hình ảnh những người đứng tại chỗ, không diễn giải thêm thành một nhóm có vai trò cụ thể.
- source_word: ἔλεγον
  choice: hỏi
  rationale: Trong ngữ cảnh lời nói trực tiếp ở dạng nghi vấn, “hỏi” tự nhiên trong tiếng Việt; thể chưa hoàn thành của tiếng Hy Lạp không nhất thiết hàm ý lặp lại nên không thêm “cứ hỏi”.
- source_word: αὐτοῖς
  choice: họ
  rationale: Đại từ chỉ những môn đồ đang bị chất vấn; trong tiếng Việt, động từ “hỏi” nhận trực tiếp đối tượng nên không cần dịch giới từ tương đương “với”.
- source_word: Τί ποιεῖτε
  choice: Các anh làm gì vậy
  rationale: Giữ đây là câu hỏi trực tiếp về hành động đang diễn ra; “vậy” tạo sắc thái chất vấn tự nhiên mà không chuyển câu hỏi thành “tại sao”.
- source_word: λύοντες
  choice: sao lại cởi dây cho
  rationale: Trong ngữ cảnh con vật bị buộc, “cởi dây cho” diễn đạt rõ hành động λύω. “Sao lại” nối tự nhiên phân từ với câu hỏi chính, nhưng vẫn thể hiện sắc thái chất vấn của toàn câu.
- source_word: τὸν πῶλον
  choice: con lừa con
  rationale: πῶλος tự thân có thể chỉ con vật non, nhưng văn cảnh gần trong Mác 11:2 và truyền thống tường thuật xác định đây là lừa. “Lừa con” rõ nghĩa và tự nhiên hơn một thuật ngữ chung dễ gây mơ hồ trong tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Cách xưng hô “các anh” phù hợp với lời những người tại chỗ nói với một nhóm nam giới, không thêm sắc thái kính trọng quá mức. Dấu [a] đặt ngay sau cụm từ được chú thích.
