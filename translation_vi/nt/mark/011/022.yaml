  text: καὶ ἀποκριθεὶς ὁ Ἰησοῦς λέγει αὐτοῖς· Ἔχετε πίστιν θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/022.yaml
  text: And Jesus answered them[a], “Have faith in God.”
translation:
  language: vi
  text: 'Đức Giê-su đáp lời họ[a]: “Hãy có đức tin nơi Đức Chúa Trời.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát hơn: “Hãy có đức tin của Đức Chúa Trời”; câu này cũng có thể được hiểu là “Hãy có sự thành tín của Đức Chúa Trời” hoặc “Hãy có đức tin đến từ Đức Chúa Trời.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποκριθεὶς
  choice: đáp lời
  rationale: Phân từ này thường dẫn vào một lời hồi đáp. “Đáp lời” tự nhiên trong văn kể tiếng Việt và vẫn thể hiện chức năng đối đáp của câu.
- source_word: λέγει
  choice: Đức Giê-su đáp lời họ
  rationale: Động từ hiện tại lịch sử được chuyển thành lối kể tự nhiên trong tiếng Việt; kết hợp với ἀποκριθεὶς thành một mệnh đề gọn, tránh lặp “đáp... nói”.
- source_word: Ἔχετε
  choice: Hãy có
  rationale: Mệnh lệnh hiện tại kêu gọi một thái độ tiếp diễn. “Hãy có” ngắn gọn, tự nhiên và không diễn giải quá mức sắc thái thể của động từ.
- source_word: πίστιν
  choice: đức tin
  rationale: “Đức tin” là cách diễn đạt phổ biến, trang trọng và dễ hiểu trong ngữ cảnh lời kêu gọi tin cậy; không tự ý chuyển thành “lòng trung tín” trong chính văn.
- source_word: θεοῦ
  choice: nơi Đức Chúa Trời
  rationale: 'Hiểu sở hữu cách theo nghĩa đối tượng: đức tin hướng về Đức Chúa Trời. “Nơi” diễn đạt tự nhiên trong tiếng Việt, còn tính mơ hồ của nguyên văn được giữ trong chú thích.'
theological_decisions:
- issue: Sở hữu cách mơ hồ trong πίστιν θεοῦ
  choice: “đức tin nơi Đức Chúa Trời” (sở hữu cách chỉ đối tượng)
  alternative: “đức tin của Đức Chúa Trời,” cũng có thể được hiểu là “sự thành tín của Đức Chúa Trời” hoặc “đức tin đến từ Đức Chúa Trời”
  rationale: Ngữ cảnh ngay sau cây vả khô héo và trước lời dạy về cầu nguyện, tin tưởng (11:23–24) ủng hộ lời khuyên đặt đức tin nơi Đức Chúa Trời. Tuy nhiên, cấu trúc Hy Lạp tự nó vẫn mơ hồ, nên các khả năng thực sự được nêu trong chú thích thay vì bị loại bỏ.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “Đức Giê-su” và “Đức Chúa Trời”; câu văn gọn, tự nhiên, đồng thời chú thích bảo tồn sự mơ hồ thần học và cú pháp của nguyên văn.
