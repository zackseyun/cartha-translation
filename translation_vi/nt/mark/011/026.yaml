    rationale: Trong «Cha của anh em ở trên trời», «ở trên trời» có thể được đọc thoáng qua như bổ nghĩa cho «anh em». Thêm dấu phẩy và «Đấng» phản ánh rõ ὁ πατὴρ ὑμῶν ὁ ἐν τοῖς οὐρανοῖς.
  - severity: low
    issue: Cách gọi người chép thủ bản và tên Giê-su trong chú thích chưa theo tiếng Việt hiện đại trung tính
    rationale: «Các ký lục» không thông dụng trong văn xuôi hiện đại; «người chép bản» rõ nghĩa hơn. «Đức Chúa Jêsus» là lối viết gắn với một truyền thống dịch thuật; «Chúa Giê-su» là dạng hiện đại, phổ biến và trung tính hơn trong chú thích.
