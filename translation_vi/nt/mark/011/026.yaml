  yaml_path: translation/nt/mark/011/026.yaml
  text: But[a] if you do not forgive, neither will your Father who is in heaven forgive your trespasses.
translation:
  language: vi
  text: Nhưng[a] nếu anh em không tha thứ, thì Cha anh em, Đấng ở trên trời, cũng sẽ không tha thứ cho những lỗi lầm của anh em.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Câu này không có trong các thủ bản Hy Lạp cổ nhất (gồm Codex Sinaiticus và Codex Vaticanus thuộc thế kỷ IV) cũng như trong các bản Coptic cổ, nhưng có trong truyền thống đa số Byzantine, truyền thống La-tinh và phần lớn các chứng liệu Syriac. Có lẽ những người chép bản về sau đã thêm câu này để hòa hợp với lời Chúa Giê-su trong Ma-thi-ơ 6:15.
    reason: textual_critical
lexical_decisions:
- source_word: ἀφίημι
  choice: tha thứ
  rationale: Trong ngữ cảnh lỗi phạm giữa con người với nhau và sự tha thứ của Đức Chúa Trời, “tha thứ” diễn đạt tự nhiên và chính xác ý xóa bỏ món nợ đạo đức do lỗi phạm gây ra.
- source_word: παράπτωμα
  choice: lỗi lầm
  rationale: Từ này chỉ một bước sai hoặc sự lệch khỏi điều đúng; “lỗi lầm” giữ được sắc thái ấy, đồng thời không đồng nhất hoàn toàn với từ Hy Lạp thông dụng hơn mang nghĩa “tội lỗi”.
- source_word: ὁ πατὴρ ὑμῶν ὁ ἐν τοῖς οὐρανοῖς
  choice: Cha của anh em ở trên trời
  rationale: Cách dịch này giữ rõ quan hệ sở hữu và vị trí được nêu trong mệnh đề Hy Lạp, đồng thời tự nhiên trong tiếng Việt hiện đại.
theological_decisions:
- issue: Mối liên hệ giữa việc con người tha thứ và việc Cha tha thứ
  choice: Giữ nguyên cấu trúc điều kiện và lời phủ định tương ứng của câu Hy Lạp
  alternative: Diễn giải theo một hệ thống thần học để xác định đây là bằng chứng, điều kiện hay hệ quả của sự cứu rỗi
  rationale: Nguyên văn nêu trực tiếp rằng nếu người nghe không tha thứ thì Cha cũng sẽ không tha lỗi lầm của họ; bản dịch không nên tự ý giải quyết sức căng thần học này.
translation_notes:
  register: Dùng tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Đại từ “anh em” phản ánh ngôi thứ hai số nhiều ὑμεῖς và phù hợp với lời dạy dành cho các môn đồ; “Cha” được viết hoa vì chỉ Đức Chúa Trời.
