id: MRK.11.11
reference: Mark 11:11
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Καὶ εἰσῆλθεν εἰς ⸀Ἱεροσόλυμα εἰς τὸ ἱερόν· καὶ περιβλεψάμενος πάντα ⸀ὀψὲ ἤδη οὔσης τῆς ὥρας ἐξῆλθεν εἰς Βηθανίαν μετὰ τῶν δώδεκα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/011.yaml
  text: And he entered Jerusalem[a], into the temple courts; and after looking around at everything, since it was already late[c][b], he went out to Bethany with the twelve.
translation:
  language: vi
  text: Ngài vào Giê-ru-sa-lem, vào khuôn viên đền thờ[a]. Sau khi nhìn quanh mọi thứ, vì giờ đã muộn[b], Ngài đi ra Bê-tha-ni cùng với mười hai môn đồ[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “khu vực đền thờ” hoặc đơn giản là “đền thờ”. Từ Hy Lạp chỉ toàn bộ khu phức hợp đền thờ, không riêng nơi thánh bên trong.
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “vì giờ đã muộn” hoặc “khi đã muộn trong ngày”.'
    reason: lexical_alternative
  - marker: c
    text: 'Nguyên văn: “mười hai người”, tức là mười hai môn đồ của Chúa Giê-su.'
    reason: clarification
lexical_decisions:
- source_word: εἰσῆλθεν
  choice: vào / đi vào
  rationale: Động từ chỉ hành động đi vào; cách diễn đạt này tự nhiên trong tiếng Việt và giữ được diễn tiến từ thành Giê-ru-sa-lem vào khu vực đền thờ.
- source_word: Ἱεροσόλυμα
  choice: Giê-ru-sa-lem
  rationale: Dạng tên riêng quen dùng trong tiếng Việt.
- source_word: τὸ ἱερόν
  choice: khuôn viên đền thờ
  rationale: ἱερόν chỉ toàn bộ khu phức hợp đền thờ, không riêng nơi thánh bên trong (ναός).
- source_word: περιβλεψάμενος
  choice: sau khi nhìn quanh
  rationale: Diễn đạt hành động quan sát chung quanh và giữ trình tự trước khi Ngài rời đi.
- source_word: πάντα
  choice: mọi thứ
  rationale: Giữ phạm vi bao quát của đại từ trung tính số nhiều mà không thêm đối tượng cụ thể.
- source_word: ὀψὲ ἤδη οὔσης τῆς ὥρας
  choice: vì trời đã muộn
  rationale: Cụm sở hữu cách tuyệt đối nêu hoàn cảnh thời gian, đồng thời có sắc thái giải thích lý do Ngài rời đi; cách nói này tự nhiên trong tiếng Việt.
- source_word: ἐξῆλθεν
  choice: đi ra
  rationale: Giữ sắc thái chuyển động ra khỏi Giê-ru-sa-lem hoặc khu vực đền thờ.
- source_word: Βηθανίαν
  choice: Bê-tha-ni
  rationale: Dạng phiên âm tên địa danh quen dùng trong tiếng Việt.
- source_word: μετὰ τῶν δώδεκα
  choice: cùng mười hai môn đồ
  rationale: Nguyên văn nói 'cùng mười hai người'; thêm 'môn đồ' để người đọc hiện đại nhận biết rõ đối tượng, đồng thời ghi chú bảo tồn dạng nguyên văn.
theological_decisions:
- issue: Phạm vi nghĩa của τὸ ἱερόν
  choice: khuôn viên đền thờ
  alternative: đền thờ
  rationale: Phân biệt khu phức hợp đền thờ với chính nơi thánh bên trong, phù hợp với ἱερόν thay vì ναός và bối cảnh công khai của câu chuyện.
- issue: Cách gọi μετὰ τῶν δώδεκα
  choice: cùng mười hai môn đồ
  alternative: cùng Nhóm Mười Hai / cùng mười hai người
  rationale: Cách dịch chính làm rõ đối tượng cho độc giả phổ thông nhưng không biến con số thành một danh hiệu viết hoa; chú thích ghi nhận cách nói sát chữ.
- issue: Quan hệ trong ὀψὲ ἤδη οὔσης τῆς ὥρας
  choice: vì trời đã muộn
  alternative: khi trời đã muộn
  rationale: Ngữ cảnh cho phép sắc thái vừa thời gian vừa nguyên nhân; 'vì' phản ánh hợp lý lý do ra đi nhưng chú thích bảo tồn khả năng dịch thuần thời gian.
translation_notes:
  register: Văn phong kể chuyện trang trọng, rõ ràng và hiện đại. Dùng “Ngài” để chỉ Chúa Giê-su theo lối diễn đạt Kinh Thánh tiếng Việt phổ thông; tránh thuật ngữ chuyên môn trong câu chính. Các dấu chú thích [a], [b], [c] đều có mặt ngay sau nội dung liên quan.
