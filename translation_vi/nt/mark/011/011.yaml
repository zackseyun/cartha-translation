  - severity: low
    issue: Lặp động từ “vào ... và đi vào”
    rationale: Một động từ εἰσῆλθεν đi với hai bổ ngữ chỉ nơi chốn. Cách đặt “vào Giê-ru-sa-lem, vào khuôn viên đền thờ” giữ được cấu trúc mà mạch lạc hơn.
  - severity: low
    issue: Vị trí chú thích [a]
    rationale: Chú thích giải thích τὸ ἱερόν nên được neo trực tiếp sau “khuôn viên đền thờ”, thay vì sau toàn câu.
