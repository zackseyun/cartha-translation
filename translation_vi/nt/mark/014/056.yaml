  yaml_path: translation/nt/mark/014/056.yaml
  text: For many were giving false testimony against him[a], and their testimonies were not consistent.
translation:
  language: vi
  text: Vì nhiều người làm chứng gian chống lại Ngài, và lời chứng của họ không khớp nhau.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “làm chứng dối chống lại Ngài, và các lời chứng không phù hợp với nhau.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὶ
  choice: nhiều người
  rationale: Tính từ được dùng như danh từ, chỉ nhiều người; không thêm “nhân chứng” vì từ ấy không xuất hiện riêng trong nguyên văn.
- source_word: γὰρ
  choice: Vì
  rationale: Giữ chức năng giải thích của liên từ trong mạch tường thuật.
- source_word: ἐψευδομαρτύρουν
  choice: làm chứng gian
  rationale: Cách nói tự nhiên, trang trọng trong tiếng Việt và giữ sắc thái pháp lý; ngữ cảnh cho thấy hành động đang diễn ra hoặc lặp lại.
- source_word: κατ’ αὐτοῦ
  choice: chống lại Ngài
  rationale: κατά với sở hữu cách ở đây chỉ lời chứng mang tính đối nghịch, nhằm buộc tội Chúa Giê-su.
- source_word: ἴσαι
  choice: khớp nhau
  rationale: Nghĩa đen là “ngang bằng”, nhưng khi nói về các lời chứng thì chỉ sự phù hợp hoặc đồng thuận giữa chúng.
- source_word: αἱ μαρτυρίαι
  choice: lời chứng của họ
  rationale: Mạo từ quy chiếu về những người vừa được nhắc đến; cách diễn đạt này tự nhiên trong tiếng Việt và giữ bối cảnh xét xử.
- source_word: οὐκ ἦσαν
  choice: không
  rationale: Kết hợp tự nhiên với “khớp nhau” để diễn đạt phủ định của động từ “là” trong nguyên văn.
theological_decisions: []
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu; giữ sắc thái pháp lý của cảnh xét xử. Đại từ “Ngài” dùng để chỉ Chúa Giê-su theo văn phong Kinh Thánh tiếng Việt phổ thông.
