source:
  edition: SBLGNT
  text: καὶ λέγει αὐτοῖς· Περίλυπός ἐστιν ἡ ψυχή μου ἕως θανάτου· μείνατε ὧδε καὶ γρηγορεῖτε.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/034.yaml
  text: And he says to them[a], “My soul is deeply grieved, even to death[c][b]. Remain here and keep watch.”
translation:
  language: vi
  text: 'Người nói với họ: “Tâm hồn tôi buồn rầu[a] đến chết[b]. Hãy ở lại đây và tỉnh thức[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “rất buồn rầu” hoặc “vô cùng sầu não.”'
    reason: lexical_alternative
  - marker: b
    text: 'Hoặc: “đến mức chết.” Cụm từ diễn tả mức độ cực điểm của nỗi buồn.'
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể dịch: “hãy thức” hoặc “hãy canh thức”; mệnh lệnh này có thể bao gồm cả việc không ngủ lẫn sự cảnh giác.'
    reason: alternative_reading
lexical_decisions:
- source_word: λέγει
  choice: Người nói
  rationale: Giữ thì hiện tại lịch sử của Mác để duy trì lối kể sống động, thay vì chuyển thành “đã nói”.
- source_word: Περίλυπός
  choice: đau buồn tột độ
  rationale: Diễn đạt nỗi sầu khổ cực kỳ sâu sắc bằng tiếng Việt hiện đại, tự nhiên và trang trọng.
- source_word: ψυχή
  choice: tâm hồn
  rationale: Chỉ đời sống nội tâm, cũng có thể gợi đến toàn thể con người đang chịu thống khổ; “tâm hồn” tự nhiên hơn “linh hồn” trong cách nói cảm xúc này mà không làm mất chiều sâu của từ Hy Lạp.
- source_word: ἕως θανάτου
  choice: đến chết
  rationale: Giữ lối nói ngắn gọn và sức nặng của nguyên văn, đồng thời không quyết định dứt khoát liệu đây là mức độ đau buồn hay sự đau buồn kéo dài cho tới cái chết.
- source_word: μείνατε
  choice: Hãy ở lại
  rationale: Mệnh lệnh yêu cầu các môn đồ tiếp tục ở tại chỗ.
- source_word: ὧδε
  choice: đây
  rationale: Cách dịch trực tiếp, tự nhiên của trạng từ chỉ nơi chốn.
- source_word: γρηγορεῖτε
  choice: tỉnh thức
  rationale: Bao hàm cả việc không ngủ và thái độ cảnh giác, phù hợp với sự đa nghĩa trong ngữ cảnh.
theological_decisions:
- issue: Cách dịch ψυχή trong lời của Chúa Giê-su
  choice: tâm hồn
  alternative: linh hồn; chính mình; sự sống
  rationale: “Tâm hồn” bảo toàn chiều sâu nội tâm và nỗi thống khổ thật sự của Chúa Giê-su trong nhân tính, nhưng không áp đặt một sơ đồ nhân học riêng lên câu này.
- issue: Ý nghĩa của ἕως θανάτου
  choice: đến chết
  alternative: đến mức gần chết; cho đến khi chết
  rationale: Nguyên văn có thể nhấn mạnh mức độ tột cùng của nỗi đau, trong khi hình thức diễn đạt cũng có thể gợi giới hạn tới cái chết. Bản dịch giữ sự căng thẳng ấy thay vì giải quyết trong chính văn.
- issue: Sức nghĩa của γρηγορεῖτε
  choice: tỉnh thức
  alternative: thức; canh thức; cảnh giác
  rationale: Mệnh lệnh có thể bao gồm cả sự tỉnh táo về thể chất lẫn cảnh giác về tinh thần; “tỉnh thức” duy trì cả hai sắc thái.
translation_notes:
  register: Văn phong hiện đại, trang trọng nhưng dễ hiểu. Dùng “Người” làm đại từ kể chuyện trung tính, không viết hoa đại từ vì lý do giáo phái. Cụm “đến chết” được giữ ngắn gọn để phản ánh độ cô đọng và tính mở của nguyên văn; các cách hiểu được nêu trong chú thích.
