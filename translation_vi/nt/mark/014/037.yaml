id: MRK.14.37
reference: Mark 14:37
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἔρχεται καὶ εὑρίσκει αὐτοὺς καθεύδοντας, καὶ λέγει τῷ Πέτρῳ· Σίμων, καθεύδεις; οὐκ ἴσχυσας μίαν ὥραν γρηγορῆσαι;
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/037.yaml
  text: And he comes and finds them sleeping[a], and he says to Peter, “Simon, are you sleeping? Were you not able to stay awake one hour?”
translation:
  language: vi
  text: 'Rồi Ngài đến, thấy họ đang ngủ, và nói với Phi-e-rơ: “Si-môn, đang ngủ sao? Không thể thức canh[a] một giờ sao?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Không thể tỉnh thức một giờ sao?”'
    reason: γρηγορέω có thể nhấn mạnh việc tỉnh thức/canh chừng, ngoài nghĩa cụ thể là không ngủ trong ngữ cảnh này.
lexical_decisions:
- source_word: ἔρχεται
  choice: Ngài đến
  rationale: Giữ thì hiện tại lịch sử của Mác để duy trì tính sống động của lời kể; “đến” tự nhiên trong tiếng Việt.
- source_word: εὑρίσκει
  choice: thấy
  rationale: Trong cấu trúc thấy một người đang ở trạng thái hay thực hiện hành động nào đó, “thấy họ đang ngủ” tự nhiên hơn “tìm thấy họ đang ngủ,” đồng thời diễn đạt đúng εὑρίσκω trong ngữ cảnh.
- source_word: καθεύδοντας
  choice: đang ngủ
  rationale: Diễn tả hành động đang tiếp diễn của phân từ hiện tại và làm rõ sự tương phản với việc thức canh.
- source_word: λέγει τῷ Πέτρῳ
  choice: nói với Phi-e-rơ
  rationale: Giữ thì hiện tại lịch sử; dùng dạng tên riêng quen thuộc trong tiếng Việt và kết cấu “nói với” tự nhiên.
- source_word: Σίμων
  choice: Si-môn
  rationale: Giữ đúng tên riêng mà Chúa Giê-su dùng để gọi Phi-e-rơ, không đồng nhất hai cách gọi.
- source_word: καθεύδεις
  choice: con đang ngủ sao?
  rationale: Câu hỏi trực tiếp ở thì hiện tại mang sắc thái trách nhẹ; “đang ngủ sao?” tự nhiên và sát ngữ cảnh.
- source_word: οὐκ ἴσχυσας
  choice: con không thể
  rationale: Trong ngữ cảnh, động từ nói đến khả năng thực hiện việc thức canh, không nhất thiết nhấn mạnh sức mạnh thể chất; “không thể” vừa tự nhiên vừa chính xác.
- source_word: μίαν ὥραν
  choice: một giờ
  rationale: Diễn đạt khoảng thời gian kéo dài theo lối nói tự nhiên của tiếng Việt.
- source_word: γρηγορῆσαι
  choice: thức canh
  rationale: “Thức canh” vừa giữ ý không ngủ trong ngữ cảnh trực tiếp, vừa bảo tồn sắc thái tỉnh thức/canh chừng của γρηγορέω.
theological_decisions:
- issue: Thì hiện tại lịch sử trong lối kể của Mác
  choice: 'Giữ các động từ kể chuyện ở hiện tại: “đến,” “thấy,” “nói.”'
  alternative: Chuyển sang quá khứ hoặc thêm “đã” để lời kể thông thường hơn trong tiếng Việt.
  rationale: Nguyên văn dùng liên tiếp các thì hiện tại lịch sử nhằm tạo tính trực tiếp, sống động. Tiếng Việt có thể giữ cách kể này mà không trở nên khó hiểu.
- issue: Nghĩa của γρηγορέω trong ngữ cảnh
  choice: “thức canh”
  alternative: “thức” hoặc “tỉnh thức”
  rationale: Ngữ cảnh đối lập trực tiếp với ngủ, nhưng động từ cũng hàm ý tỉnh táo canh chừng. “Thức canh” giữ được cả hai nét nghĩa mà không áp đặt một cách hiểu thần học riêng.
- issue: Cách xưng hô của Chúa Giê-su với Phi-e-rơ
  choice: “con”
  alternative: Lược bỏ đại từ hoặc dùng “anh/ngươi”
  rationale: “Con” là cách xưng hô tự nhiên, trang trọng trong truyền thống văn phong Kinh Thánh tiếng Việt khi Chúa Giê-su nói với môn đồ; không làm thay đổi nội dung mệnh đề.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ hiện tại lịch sử của nguyên văn. “Ngài” dùng cho Chúa Giê-su; tên riêng được viết theo dạng quen thuộc Phi-e-rơ và Si-môn. Dấu chú thích [a] được đặt ngay sau câu có từ ngữ liên quan.
