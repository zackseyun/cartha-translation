- from: 'Rồi Ngài đến, thấy họ đang ngủ, và nói với Phi-e-rơ: “Si-môn, con đang ngủ sao? Con không thể thức canh một giờ sao?”[a]'
  to: 'Rồi Ngài đến, thấy họ đang ngủ, và nói với Phi-e-rơ: “Si-môn, đang ngủ sao? Không thể thức canh[a] một giờ sao?”'
  rationale: Bản sửa lược “con” để không thêm quan hệ xưng hô mà nguyên văn không nói, đồng thời đặt lại neo chú thích sát “thức canh.” Các lựa chọn còn lại được giữ vì trung thành với văn bản Hy Lạp và tự nhiên trong tiếng Việt hiện đại.
