source:
  edition: SBLGNT
  text: καὶ ⸂προελθὼν μικρὸν ἔπιπτεν⸃ ἐπὶ τῆς γῆς, καὶ προσηύχετο ἵνα εἰ δυνατόν ἐστιν παρέλθῃ ἀπ’ αὐτοῦ ἡ ὥρα,
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/035.yaml
  text: And going a little farther[a], he fell to the ground and was praying that, if it were possible, the hour might pass from him.
translation:
  language: vi
  text: Ngài đi xa hơn một chút[a], rồi ngã xuống đất và cầu nguyện rằng, nếu có thể được, xin cho giờ ấy qua khỏi Ngài.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “đi lên phía trước một chút.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: προελθὼν μικρὸν
  choice: đi xa hơn một chút
  rationale: Diễn đạt tự nhiên việc Chúa Giê-su tiến thêm một quãng ngắn, vượt ra phía trước những người khác; chú thích giữ lại cách hiểu gần sát hơn là “đi lên phía trước một chút”.
- source_word: ἔπιπτεν ἐπὶ τῆς γῆς
  choice: sấp mình xuống đất
  rationale: Thì chưa hoàn thành có sắc thái miêu tả hoặc khởi phát trong trình thuật. “Sấp mình xuống đất” diễn đạt tự nhiên chuyển động hạ mình xuống mặt đất mà không nhất thiết hàm ý vô tình ngã.
- source_word: προσηύχετο
  choice: cầu nguyện
  rationale: Trong kết cấu “và cầu nguyện rằng”, tiếng Việt không cần hình thái riêng để biểu thị hành động đang tiếp diễn; ngữ cảnh vẫn cho thấy lời cầu nguyện đang diễn ra.
- source_word: ἵνα
  choice: rằng
  rationale: Ở đây ἵνα dẫn nội dung hay điều được cầu xin. “Rằng” tự nhiên trong tiếng Việt và không ép câu theo nghĩa mục đích quá mạnh.
- source_word: εἰ δυνατόν ἐστιν
  choice: nếu có thể được
  rationale: Giữ nguyên tính điều kiện và khả thể của câu Hy Lạp bằng một cách nói trang trọng, tự nhiên trong lời cầu nguyện.
- source_word: παρέλθῃ ἀπ’ αὐτοῦ ἡ ὥρα
  choice: giờ ấy xin qua khỏi Ngài
  rationale: Giữ hình ảnh “giờ” và động từ “qua khỏi” thay vì giải nghĩa thành thời gian chịu khổ; “xin” thể hiện đây là nội dung lời cầu nguyện, còn “ấy” quy chiếu đến giờ đã được hàm định trong văn cảnh.
theological_decisions:
- issue: Ý nghĩa của “giờ”
  choice: Giữ cách nói “giờ ấy” như hình ảnh chỉ thời điểm đã định đang đến với Chúa Giê-su, không giải nghĩa ngay trong câu.
  alternative: thời điểm chịu khổ; lúc chịu chết
  rationale: Cách diễn đạt của nguyên văn mang sức nặng thần học và vẫn để mở nội dung đầy đủ của “giờ”; diễn giải thành việc chịu khổ hay chịu chết sẽ thu hẹp sự căng thẳng của bản văn.
- issue: Sắc thái của lời xin
  choice: Dùng “xin qua khỏi Ngài” trong mệnh đề nội dung lời cầu nguyện.
  alternative: có thể qua khỏi Ngài; sẽ qua khỏi Ngài
  rationale: “Xin” làm rõ sắc thái khẩn cầu vốn do động từ “cầu nguyện” và mệnh đề ἵνα tạo nên, nhưng không biến điều kiện “nếu có thể được” thành một lời khẳng định chắc chắn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “Ngài” được dùng nhất quán để chỉ Chúa Giê-su. Câu giữ cấu trúc và sức nặng biểu tượng của nguyên văn nhưng tránh lối dịch quá cứng.
