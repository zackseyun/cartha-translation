base_translation:
  language: en
  yaml_path: translation/nt/mark/014/010.yaml
  text: And Judas Iscariot[a], one of the Twelve, went to the chief priests in order to hand him over to them.
translation:
  language: vi
  text: Rồi Giu-đa Ích-ca-ri-ốt, một trong Nhóm Mười Hai, đi gặp các thượng tế để nộp Ngài cho họ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “phản bội Ngài bằng cách nộp Ngài cho họ.” Động từ Hy Lạp có thể mang nghĩa “giao” hoặc “nộp”; trong trường hợp của Giu-đa, hành động giao nộp này là sự phản bội.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: Rồi
  rationale: Liên kết sự việc này với trình thuật ngay trước đó và diễn đạt tự nhiên sự tiếp nối trong tiếng Việt, không thêm sắc thái đối lập.
- source_word: Ἰούδας Ἰσκαριὼθ
  choice: Giu-đa Ích-ca-ri-ốt
  rationale: Phiên âm tên riêng theo cách dùng Kinh Thánh tiếng Việt quen thuộc và dễ nhận biết.
- source_word: ὁ εἷς τῶν δώδεκα
  choice: một trong Nhóm Mười Hai
  rationale: Cụm từ chỉ nhóm môn đồ đã được xác định, không chỉ đơn thuần là con số mười hai; thêm “Nhóm” giúp tiếng Việt rõ và tự nhiên.
- source_word: ἀπῆλθεν πρὸς τοὺς ἀρχιερεῖς
  choice: đi đến gặp các thượng tế
  rationale: Diễn đạt tự nhiên động từ chuyển động cùng giới từ chỉ hướng; “các thượng tế” chỉ giới lãnh đạo tư tế tại Giê-ru-sa-lem, không phải nhiều người đồng thời giữ chức thượng tế.
- source_word: ἵνα
  choice: để
  rationale: Thể hiện rõ mục đích trong câu tiếng Việt một cách gọn và tự nhiên.
- source_word: παραδοῖ
  choice: nộp
  rationale: “Nộp” giữ ý giao một người vào tay hoặc quyền kiểm soát của người khác, đồng thời chưa thu hẹp động từ thành riêng nghĩa “phản bội”.
- source_word: αὐτὸν ... αὐτοῖς
  choice: Ngài ... cho họ
  rationale: Giữ cả đối tượng là Chúa Giê-su và bên tiếp nhận là các thượng tế; “Ngài” là đại từ tôn kính tự nhiên trong văn phong Kinh Thánh tiếng Việt.
theological_decisions:
- issue: Cách dịch παραδοῖ trong bối cảnh Giu-đa phản bội
  choice: nộp Ngài cho họ
  alternative: phản bội Ngài và giao Ngài cho họ
  rationale: Động từ Hy Lạp có nghĩa rộng là giao hoặc nộp một người. Trong hành động của Giu-đa, việc ấy là phản bội, nhưng bản văn vẫn duy trì mô-típ “bị nộp” xuyên suốt trình thuật thương khó. Bản chính giữ nghĩa rộng; chú thích nêu sắc thái phản bội.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Câu văn theo nhịp kể chuyện tự nhiên; viết hoa “Nhóm Mười Hai” để biểu thị danh xưng của nhóm môn đồ đã được xác định.
