translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng và dễ hiểu. Dùng “Phi-e-rơ” và “thầy thượng tế” theo lối gọi quen thuộc trong bản dịch Kinh Thánh tiếng Việt. Dấu chú thích [a] được đặt sau “trong sân” theo dữ liệu tiếng Anh, dù nội dung chú thích thực tế giải thích từ “nữ tỳ”; nếu biên tập toàn dự án cho phép, nên chuyển dấu này đến ngay sau “nữ tỳ” để liên kết rõ hơn.
