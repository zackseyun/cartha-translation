  text: Καὶ ὄντος τοῦ Πέτρου ⸂κάτω ἐν τῇ αὐλῇ⸃ ἔρχεται μία τῶν παιδισκῶν τοῦ ἀρχιερέως,
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/066.yaml
  text: And while Peter was below in the courtyard[a], one of the high priest’s servant girls came,
translation:
  language: vi
  text: Trong khi Phi-e-rơ đang ở phía dưới, trong sân, thì một trong các người hầu gái[a] của thầy thượng tế đến.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “một trong các nữ nô lệ của thầy thượng tế.” Từ Hy Lạp παιδίσκη có thể chỉ một nữ gia nhân hoặc một nữ nô lệ; ở đây dịch là “người hầu gái” để diễn tả vai trò của cô trong gia hộ mà không xác định địa vị pháp lý của cô.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὄντος τοῦ Πέτρου
  choice: Phi-e-rơ đang ở
  rationale: Cấu trúc sở hữu cách tuyệt đối với phân từ hiện tại được chuyển thành mệnh đề chỉ thời gian, giữ nét diễn tiến của bối cảnh và phù hợp tiếng Việt tự nhiên.
- source_word: κάτω
  choice: ở phía dưới
  rationale: Giữ ý chỉ vị trí thấp hơn trong không gian, có thể tương phản với nơi diễn ra cuộc xét hỏi ở phía trên.
- source_word: ἐν τῇ αὐλῇ
  choice: trong sân
  rationale: Ở đây αὐλή chỉ khoảng sân thuộc dinh thầy thượng tế; “trong sân” ngắn gọn và tự nhiên trong tiếng Việt.
- source_word: ἔρχεται
  choice: đi đến
  rationale: Động từ hiện tại lịch sử được diễn đạt theo mạch kể tiếng Việt; “đi đến” giữ được chuyển động hướng về nơi Phi-e-rơ đang ở mà không thêm ý “tiến lại gần” vốn không được nói rõ.
- source_word: μία τῶν παιδισκῶν
  choice: một nữ tỳ
  rationale: παιδίσκη có thể chỉ nữ gia nhân hoặc nữ nô lệ, thường là người trẻ. “Nữ tỳ” diễn đạt địa vị phục dịch và vẫn để ngỏ mức độ lệ thuộc pháp lý; chú thích nêu phương án rõ nghĩa hơn.
- source_word: τοῦ ἀρχιερέως
  choice: của thầy thượng tế
  rationale: Sở hữu cách biểu thị sự thuộc về hoặc gắn với gia hộ của thầy thượng tế; cách dịch này trực tiếp và quen thuộc.
