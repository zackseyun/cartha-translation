base_translation:
  language: en
  yaml_path: translation/nt/mark/014/006.yaml
  text: But Jesus said[a], “Leave her alone[c][b]. Why are you troubling her? She has done a beautiful work for me.”
translation:
  language: vi
  text: 'Nhưng Đức Giê-su nói: “Hãy để cô ấy yên. Tại sao lại gây phiền hà cho cô ấy? Cô ấy đã làm một việc tốt đẹp cho tôi.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát: “trong tôi”; cũng có thể hiểu là “đối với tôi” hoặc, theo ngữ cảnh xức dầu, “trên tôi”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄφετε αὐτήν
  choice: Hãy để cô ấy yên
  rationale: Mệnh lệnh Ἄφετε yêu cầu chấm dứt ngay việc can thiệp; cách nói này tự nhiên trong tiếng Việt và giữ được sắc thái bảo vệ người phụ nữ.
- source_word: τί αὐτῇ κόπους παρέχετε;
  choice: Tại sao các ông lại gây phiền hà cho cô ấy?
  rationale: Cụm κόπους παρέχετε diễn tả việc gây khó khăn hoặc quấy rầy; “gây phiền hà” giữ được sắc thái trách cứ mà không quá khẩu ngữ.
- source_word: καλὸν ἔργον
  choice: một việc đẹp đẽ
  rationale: καλός có thể mang nghĩa tốt, đẹp hoặc cao quý. “Việc đẹp đẽ” giữ cả sự đánh giá tích cực lẫn nét đẹp thích hợp của hành động tận hiến này.
- source_word: ἠργάσατο
  choice: đã làm
  rationale: Đây là cách diễn đạt đơn giản, tự nhiên cho động từ trong kết cấu với ἔργον.
- source_word: ἐν ἐμοί
  choice: cho tôi
  rationale: Dù nghĩa sát là “trong tôi”, trong ngữ cảnh này cụm từ chỉ hành động hướng đến Đức Giê-su; “cho tôi” là cách diễn đạt thành ngữ tự nhiên, còn nghĩa sát được ghi chú.
- source_word: δὲ
  choice: Nhưng
  rationale: δὲ đánh dấu sự tương phản khi Đức Giê-su đáp lại lời chỉ trích người phụ nữ.
theological_decisions:
- issue: Sắc thái của καλὸν ἔργον đối với hành động của người phụ nữ
  choice: một việc đẹp đẽ
  alternative: một việc tốt; một nghĩa cử cao đẹp
  rationale: Cách dịch này bảo tồn lời khen và tính thích hợp của hành động mà không du nhập quan niệm thần học về công đức.
- issue: Lực nghĩa của ἐν ἐμοί
  choice: cho tôi
  alternative: trên tôi; đối với tôi; trong tôi
  rationale: “Cho tôi” diễn đạt tự nhiên việc hành động hướng đến chính Đức Giê-su nhưng không thu hẹp câu này chỉ còn khía cạnh không gian; chú thích bảo tồn hình thức sát chữ.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Đức Giê-su” theo lối gọi phổ biến trong tiếng Việt; “các ông” phản ánh lời trách trực tiếp với nhóm người đang chỉ trích, còn “cô ấy” là cách quy chiếu tự nhiên trong lời thoại.
