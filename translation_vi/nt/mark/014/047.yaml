source:
  edition: SBLGNT
  text: εἷς δέ ⸀τις τῶν παρεστηκότων σπασάμενος τὴν μάχαιραν ἔπαισεν τὸν δοῦλον τοῦ ἀρχιερέως καὶ ἀφεῖλεν αὐτοῦ τὸ ⸀ὠτάριον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/047.yaml
  text: But one of those standing nearby drew his sword and struck the high priest’s servant[a], and cut off his ear.
translation:
  language: vi
  text: Nhưng một người trong số những người đứng gần đó rút gươm, đánh người nô lệ[a] của thượng tế và chém đứt tai anh ta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “đầy tớ”. Từ Hy Lạp δοῦλος chỉ một người ở địa vị nô lệ.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἷς δέ τις
  choice: Nhưng một người
  rationale: Giữ δέ như một chuyển tiếp có sắc thái tương phản nhẹ, đồng thời diễn đạt cách giới thiệu bất định εἷς…τις mà không xác định danh tính người ấy.
- source_word: τῶν παρεστηκότων
  choice: trong số những người đứng gần đó
  rationale: Diễn đạt cả ý thuộc về nhóm người đang có mặt lẫn sắc thái không gian của παρίστημι trong cảnh bắt giữ.
- source_word: σπασάμενος τὴν μάχαιραν
  choice: rút gươm
  rationale: Trong ngữ cảnh vũ khí, σπάομαι có nghĩa là rút ra; tiếng Việt tự nhiên không cần chuyển mạo từ Hy Lạp thành một từ sở hữu.
- source_word: ἔπαισεν
  choice: đánh
  rationale: Từ hiện đại, trực tiếp, diễn tả cú tấn công bằng gươm mà không dùng lối văn cổ.
- source_word: τὸν δοῦλον
  choice: người nô lệ
  rationale: δοῦλος chỉ địa vị lệ thuộc trong gia hộ hay cơ cấu của thượng tế; “nô lệ” bảo toàn thực trạng xã hội rõ hơn “đầy tớ”.
- source_word: τοῦ ἀρχιερέως
  choice: của thượng tế
  rationale: “Thượng tế” là cách gọi hiện đại, gọn và chính xác cho vị đứng đầu hàng tư tế trong ngữ cảnh này.
- source_word: ἀφεῖλεν
  choice: chém đứt
  rationale: ἀφαιρέω có nghĩa cơ bản là lấy đi hoặc loại bỏ; trong ngữ cảnh một nhát gươm làm mất tai, “chém đứt” diễn đạt tự nhiên cả hành động lẫn kết quả.
- source_word: αὐτοῦ τὸ ὠτάριον
  choice: tai anh ta
  rationale: ὠτάριον là dạng giảm nhẹ nhưng ở đây đơn giản có nghĩa là “tai”; không thêm “bên phải” vì chi tiết ấy không có trong bản văn Mác.
theological_decisions:
- issue: Cách dịch δοῦλος trong bối cảnh địa vị xã hội
  choice: nô lệ
  alternative: đầy tớ
  rationale: Quan hệ lệ thuộc với thượng tế được nêu rõ; “nô lệ” giữ được địa vị pháp lý-xã hội của δοῦλος, còn chú thích cung cấp cách dịch nhẹ hơn thường gặp.
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang nghiêm và dễ hiểu. Câu giữ nguyên tính bất định về danh tính người rút gươm, không bổ sung tên người, tai phải hay các chi tiết từ những sách Phúc Âm song song.
