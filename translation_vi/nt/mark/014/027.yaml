id: MRK.14.27
reference: Mark 14:27
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Καὶ λέγει αὐτοῖς ὁ Ἰησοῦς ὅτι Πάντες ⸀σκανδαλισθήσεσθε, ὅτι γέγραπται· Πατάξω τὸν ποιμένα, καὶ ⸂τὰ πρόβατα διασκορπισθήσονται⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/027.yaml
  text: 'And Jesus says to them[a], “You will all fall away, because it is written: ‘I will strike the shepherd, and the sheep will be scattered.’”'
translation:
  language: vi
  text: 'Chúa Giê-xu nói với họ: “Tất cả anh em sẽ vấp ngã[a], vì có lời chép rằng:


    ‘Ta sẽ đánh người chăn chiên,


    và bầy chiên sẽ tan tác.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Tất cả anh em sẽ lìa bỏ” hoặc “Tất cả anh em sẽ bị khiến cho vấp ngã.”'
    reason: Giữ các khả năng từ vựng và sắc thái bị động của σκανδαλισθήσεσθε; trong ngữ cảnh, sự vấp ngã được thể hiện qua việc các môn đồ lìa bỏ Chúa Giê-xu và tan tác.
lexical_decisions:
- source_word: λέγει
  choice: nói
  rationale: Giữ thì hiện tại lịch sử của nguyên văn theo lối kể chuyện sống động của Mác, đồng thời dùng cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: σκανδαλισθήσεσθε
  choice: sẽ vấp ngã
  rationale: Giữ hình ảnh ẩn dụ và phạm vi nghĩa của động từ Hy Lạp, đồng thời phù hợp với việc các môn đồ thất bại và bỏ chạy trong ngữ cảnh. Dạng bị động và sắc thái ‘lìa bỏ’ được nêu trong chú thích thay vì bị giải quyết dứt khoát trong chính văn.
- source_word: γέγραπται
  choice: có lời chép rằng
  rationale: Công thức tiếng Việt tự nhiên để dẫn lời Kinh Thánh, phản ánh thể hoàn thành bị động và thẩm quyền liên tục của điều đã được chép.
- source_word: Πατάξω
  choice: Ta sẽ đánh
  rationale: Diễn đạt trực tiếp lực của động từ mà không dùng từ cổ; đại từ ‘Ta’ giữ ngôi thứ nhất của lời trích.
- source_word: ποιμένα
  choice: người chăn chiên
  rationale: Cách gọi tự nhiên, rõ nghĩa trong tiếng Việt, giữ hình ảnh người chăn của lời tiên tri.
- source_word: τὰ πρόβατα
  choice: bầy chiên
  rationale: Diễn đạt tự nhiên hình ảnh tập thể của các con chiên trong tiếng Việt và liên kết rõ với người chăn chiên.
- source_word: διασκορπισθήσονται
  choice: sẽ tan tác
  rationale: Giữ hình ảnh bầy chiên bị phân tán sau khi người chăn bị đánh; ‘tan tác’ tự nhiên và có sức gợi trong tiếng Việt.
theological_decisions:
- issue: Ý nghĩa của σκανδαλισθήσεσθε đối với phản ứng của các môn đồ
  choice: sẽ vấp ngã
  alternative: sẽ lìa bỏ; sẽ bị khiến cho vấp ngã
  rationale: ‘Vấp ngã’ giữ nguyên hình ảnh và sự căng thẳng của từ Hy Lạp, không mặc nhiên biến sự thất bại tạm thời của các môn đồ thành một khẳng định dứt khoát về sự bội đạo. Chú thích nêu cả sắc thái lìa bỏ trong ngữ cảnh và khả năng phản ánh dạng bị động.
- issue: Chủ thể ngôi thứ nhất trong lời ‘Ta sẽ đánh người chăn chiên’
  choice: Giữ nguyên ‘Ta’ mà không giải thích danh tính trong chính văn
  alternative: Nêu rõ Đức Chúa Trời là chủ thể
  rationale: Nguyên văn trích dẫn dùng ngôi thứ nhất nhưng không thêm danh xưng tại đây; bản dịch tránh đưa lời giải thích thần học vào chính văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng nhưng dễ hiểu. Dùng “Chúa Giê-xu” và “các con” cho lời Ngài nói với các môn đồ; giữ thì hiện tại lịch sử bằng “nói”. Lời trích được xuống dòng để làm rõ thể thơ và cấu trúc song hành.
