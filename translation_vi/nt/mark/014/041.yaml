  to: 'Ngài đến lần thứ ba và nói với họ: “Các anh vẫn còn ngủ và nghỉ sao?[a] Đủ rồi![b] Giờ đã đến. Kìa, Con Người đang bị trao vào tay những kẻ tội lỗi.”'
