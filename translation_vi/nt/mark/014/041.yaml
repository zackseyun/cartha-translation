  verdict: revise
  source_fidelity: 'Bản dịch phản ánh đúng các thành tố chính của câu Hy Lạp: thì hiện tại lịch sử ở ἔρχεται, sự mơ hồ có chủ ý của Καθεύδετε ... ἀναπαύεσθε qua câu hỏi chính và chú thích lựa chọn mỉa mai/cho phép, cách nói khó ἀπέχει, «Giờ đã đến», ἰδού, và thể bị động hiện tại của παραδίδοται. Tuy nhiên, «các con» thêm một quan hệ xưng hô cha–con không được nêu trong αὐτοῖς và không phải là cách xưng hô trực tiếp trong bản văn. «Các anh» trung tính và sát văn cảnh hơn.'
  naturalness: Câu văn ngắn gọn, hiện đại và giữ được nhịp khẩn trương. «Các anh vẫn còn ngủ và nghỉ sao?» tự nhiên hơn «Các con...», đồng thời tránh sắc thái gia trưởng/đạo ngữ không cần thiết. «Đang bị trao vào tay» hiểu được và giữ hình ảnh nguyên ngữ; trong ngữ cảnh này không cần đổi thành «phản bội».
  terminology: «Con Người», «Giờ», «những kẻ tội lỗi» và «bị trao vào tay» đều thích hợp. Giữ «Ngài» trong lời trần thuật là nhất quán với bản thảo, dù đại từ này không do tiếng Hy Lạp quy định. Chú thích a bảo toàn cách đọc thay thế của τὸ λοιπὸν; chú thích b trình bày thận trọng tính khó của ἀπέχει.
