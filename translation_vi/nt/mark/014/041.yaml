language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἔρχεται τὸ τρίτον καὶ λέγει αὐτοῖς· Καθεύδετε ⸀τὸ λοιπὸν καὶ ἀναπαύεσθε· ἀπέχει· ἦλθεν ἡ ὥρα, ἰδοὺ παραδίδοται ὁ υἱὸς τοῦ ἀνθρώπου εἰς τὰς χεῖρας τῶν ἁμαρτωλῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/041.yaml
  text: And he comes the third time and says to them[a], “Are you still sleeping and resting? It is enough; the hour has come. Look[c][b], the Son of Man is being handed over into the hands of sinners.”
translation:
  language: vi
  text: 'Ngài đến lần thứ ba và nói với họ: “Các anh vẫn còn ngủ và nghỉ sao?[a] Đủ rồi![b] Giờ đã đến. Kìa, Con Người đang bị trao vào tay những kẻ tội lỗi.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Cứ ngủ và nghỉ tiếp đi.” Câu Hy Lạp có thể được hiểu là lời cho phép mang tính mỉa mai hoặc là câu hỏi tu từ.'
    reason: alternative_reading
  - marker: b
    text: '“Đủ rồi!” dịch một cách nói Hy Lạp khó hiểu. Cũng có thể dịch: “Thế là đủ.” Một cách giải thích ít có khả năng hơn tại đây hiểu từ này theo nghĩa thương mại, như “đã nhận đủ tiền.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχεται τὸ τρίτον
  choice: Ngài đến lần thứ ba
  rationale: Giữ thì hiện tại lịch sử để tạo tính sống động; mạo từ trong τὸ τρίτον được diễn đạt tự nhiên là “lần thứ ba”.
- source_word: Καθεύδετε τὸ λοιπὸν καὶ ἀναπαύεσθε
  choice: Các con vẫn còn ngủ và nghỉ sao?
  rationale: Các hình thức Hy Lạp có thể được hiểu như lời cho phép mang tính mỉa mai hoặc câu hỏi tu từ. Trong ngữ cảnh, câu hỏi tu từ là tiếng Việt tự nhiên và phù hợp với lời quở trách; cách hiểu kia được giữ trong chú thích.
- source_word: ἀπέχει
  choice: Đủ rồi!
  rationale: Đây là một cách nói khó. “Đủ rồi!” diễn đạt gọn bước ngoặt quyết liệt trong cảnh này mà không đưa vào nghĩa thương mại mang tính suy đoán.
- source_word: ἦλθεν ἡ ὥρα
  choice: Giờ đã đến
  rationale: Giữ hình ảnh “giờ” chỉ thời điểm đã được ấn định, thay vì làm phẳng thành “đã đến lúc”.
- source_word: ἰδοὺ
  choice: Kìa
  rationale: Từ chỉ thị tự nhiên, trang trọng vừa phải trong tiếng Việt, hướng sự chú ý đến biến cố sắp xảy ra.
- source_word: παραδίδοται
  choice: đang bị trao
  rationale: Giữ nghĩa rộng “trao/nộp” và thể bị động hiện tại, không thu hẹp thành riêng hành vi “phản bội” của Giu-đa.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Con Người
  rationale: Cách dịch quen thuộc của danh xưng này, giữ được chức năng tước hiệu và liên hệ Kinh Thánh.
- source_word: εἰς τὰς χεῖρας τῶν ἁμαρτωλῶν
  choice: vào tay những kẻ tội lỗi
  rationale: Giữ thành ngữ cụ thể về việc bị đặt dưới quyền lực của người khác; danh từ hóa ἁμαρτωλῶν được diễn đạt tự nhiên.
theological_decisions:
- issue: Sắc thái của Καθεύδετε ... καὶ ἀναπαύεσθε
  choice: 'Câu hỏi tu từ: “Các con vẫn còn ngủ và nghỉ sao?”'
  alternative: 'Lời cho phép/mệnh lệnh mang tính mỉa mai: “Cứ ngủ và nghỉ tiếp đi.”'
  rationale: Văn bản Hy Lạp cổ không có dấu câu quyết định cách hiểu; cả hai đều khả hữu. Bản chính chọn câu hỏi vì tự nhiên trong tiếng Việt và hợp với lời quở trách, đồng thời giữ cách hiểu khác trong chú thích.
- issue: Ý nghĩa của ἀπέχει
  choice: “Đủ rồi!”
  alternative: “Thế là đủ”; hoặc nghĩa thương mại “đã nhận đủ tiền”
  rationale: Cách dịch đã chọn phù hợp nhất với bước ngoặt của trình thuật mà không áp đặt một nghĩa kỹ thuật không chắc chắn; tính khó của từ được nêu trong chú thích.
- issue: Cách dịch παραδίδοται
  choice: “đang bị trao”
  alternative: “đang bị phản bội” hoặc “đang bị nộp”
  rationale: “Bị trao” giữ phạm vi nghĩa rộng và sự mơ hồ về tác nhân, không giới hạn câu này vào riêng sự phản bội của Giu-đa.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Ngài” cho Chúa Giê-su trong lời kể và “các con” trong lời Ngài nói với các môn đồ. Duy trì câu ngắn, dồn dập để phản ánh bước ngoặt kịch tính của cảnh; giữ các danh xưng “Con Người” và hình ảnh “Giờ đã đến”.
