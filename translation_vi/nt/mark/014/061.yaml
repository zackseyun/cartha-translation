id: MRK.14.61
reference: Mark 14:61
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὁ δὲ ἐσιώπα καὶ ⸂οὐκ ἀπεκρίνατο οὐδέν⸃. πάλιν ὁ ἀρχιερεὺς ἐπηρώτα αὐτὸν καὶ λέγει αὐτῷ· Σὺ εἶ ὁ χριστὸς ὁ υἱὸς τοῦ εὐλογητοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/061.yaml
  text: But he kept silent and answered nothing[a]. Again the high priest questioned him and says to him, “Are you the Messiah[b], the Son of the Blessed One?”
translation:
  language: vi
  text: 'Nhưng Người vẫn im lặng, không trả lời gì. Vị thượng tế lại hỏi Người: “Ông có phải là Đấng Mê-si-a[a], Con của Đấng Đáng Chúc Tụng[b] không?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “Đấng Ki-tô.” Từ Hy Lạp Χριστός (Christos) là tước hiệu tương ứng với “Mê-si-a” trong bối cảnh này.
    reason: alternative_reading
  - marker: b
    text: “Đấng Đáng Chúc Tụng” là lối nói kính cẩn của người Do Thái để chỉ Đức Chúa Trời.
    reason: cultural_note
lexical_decisions:
- source_word: ἐσιώπα
  choice: vẫn im lặng
  rationale: Thì chưa hoàn thành diễn tả trạng thái im lặng đang tiếp diễn; “vẫn im lặng” tự nhiên trong tiếng Việt và giữ được sắc thái ấy.
- source_word: ἀπεκρίνατο οὐδέν
  choice: không trả lời gì
  rationale: Diễn đạt rõ sự phủ định hoàn toàn của οὐδέν bằng tiếng Việt hiện đại, tự nhiên.
- source_word: πάλιν
  choice: lại
  rationale: Đánh dấu việc vị thượng tế lặp lại hành động chất vấn.
- source_word: ἀρχιερεὺς
  choice: vị thượng tế
  rationale: Cách gọi chính xác, trang trọng và dễ hiểu đối với chức vụ tư tế cao nhất trong bối cảnh xét xử này.
- source_word: ἐπηρώτα
  choice: hỏi
  rationale: Trong tiếng Việt, kết hợp “lại hỏi” diễn đạt tự nhiên việc tiếp tục hoặc lặp lại câu hỏi; “thẩm vấn” sẽ làm sắc thái mạnh hơn mức cần thiết.
- source_word: λέγει
  choice: hỏi Người
  rationale: Hiện tại lịch sử của Mác được chuyển thành lối kể không đánh dấu thì trong tiếng Việt; gộp với động từ hỏi tránh câu dẫn rườm rà mà không làm mất nội dung.
- source_word: χριστός
  choice: Đấng Mê-si-a
  rationale: Ở đây từ này là tước hiệu trong bối cảnh kỳ vọng cứu thế của người Do Thái; “Đấng Mê-si-a” giữ rõ chức năng ấy hơn cách dùng “Đấng Ki-tô” vốn dễ được hiểu như tên riêng.
- source_word: ὁ υἱὸς τοῦ εὐλογητοῦ
  choice: Con của Đấng Đáng Chúc Tụng
  rationale: Giữ nguyên lối nói kính cẩn của người Do Thái để chỉ Đức Chúa Trời, thay vì giải nghĩa trực tiếp ngay trong chính văn.
theological_decisions:
- issue: Cách dịch Χριστός như một tước hiệu cứu thế trực tiếp
  choice: Đấng Mê-si-a
  alternative: Đấng Ki-tô
  rationale: Câu hỏi của vị thượng tế dùng từ này như tước hiệu gắn với niềm mong đợi cứu thế của người Do Thái; lựa chọn này giữ được bối cảnh mà không thêm một cách hiểu hệ phái.
- issue: Cách dịch τοῦ εὐλογητοῦ
  choice: Đấng Đáng Chúc Tụng
  alternative: Đức Chúa Trời
  rationale: Nguyên văn dùng một lối nói vòng đầy tôn kính để chỉ Đức Chúa Trời. Giữ lối diễn đạt gián tiếp bảo toàn sắc thái văn hóa và thần học của câu hỏi.
- issue: Cách xưng hô trong câu hỏi xét xử
  choice: Ông
  alternative: Ngài
  rationale: “Ông” phù hợp với lời chất vấn trực tiếp của vị thượng tế, không tự ý thêm sắc thái tôn kính mà nguyên văn không biểu thị.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Đại từ “Người” giữ giọng kể tôn kính dành cho Đức Giê-su; “Ông” trong lời vị thượng tế phản ánh tình huống chất vấn mà không thêm sự tôn kính không có trong nguyên văn. Các dấu chú thích [a], [b] được đặt đúng tại những cụm từ mà chú thích giải thích.
