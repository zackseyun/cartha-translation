  text: Then they laid hands on him and seized him[a][b].
translation:
  language: vi
  text: Rồi họ đặt tay lên Người và bắt giữ Người.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “Họ chộp lấy Người.” Cụm Hy Lạp “đặt tay lên” là một thành ngữ chỉ việc nắm lấy ai, thường để bắt giữ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ
  choice: Họ liền
  rationale: οἱ được dùng như danh từ, chỉ những người vừa được nhắc đến; δέ đánh dấu bước tiếp theo nhẹ trong diễn tiến câu chuyện. “Liền” diễn đạt tự nhiên sự chuyển tiếp tức thời mà không nhấn quá mức ý tương phản.
- source_word: ἐπέβαλαν τὰς χεῖρας αὐτῷ
  choice: tra tay
  rationale: Thành ngữ Hy Lạp chỉ việc đặt tay lên hoặc chộp lấy một người với ý định khống chế. “Tra tay” là cách nói tiếng Việt trang trọng, gọn và phù hợp ngữ cảnh bắt giữ.
- source_word: ἐκράτησαν αὐτόν
  choice: bắt Đức Giê-su
  rationale: κρατέω ở đây diễn tả việc nắm giữ, khống chế trong một cuộc bắt giữ. “Bắt” truyền đạt rõ hành động trong ngữ cảnh, còn chú thích bảo lưu sắc thái sát chữ là “tóm giữ”.
theological_decisions: []
translation_notes:
  register: Bản dịch dùng tiếng Việt hiện đại, trang trọng và dễ hiểu. Cụm “tra tay bắt” chuyển tải tự nhiên hai động từ liên tiếp của nguyên văn mà tránh lặp nặng nề; “Đức Giê-su” duy trì lối gọi tôn kính phổ biến trong văn phong Kinh Thánh tiếng Việt.
