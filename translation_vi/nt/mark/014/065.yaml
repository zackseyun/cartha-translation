revisions:
- from: 'Một số người bắt đầu nhổ vào Người, che mặt Người[a], đấm Người và nói: “Hãy nói tiên tri đi!” Còn các thuộc hạ thì tát đánh Người.[b]'
  to: 'Một số người bắt đầu nhổ vào Người, che mặt Người[a], đấm Người và nói: “Hãy nói tiên tri xem!” Những người phục dịch thì đánh Người bằng những cái tát.[b]'
  rationale: 'Bản sửa giữ nguyên trật tự và nội dung của nguyên văn: một số người bắt đầu nhổ, che mặt, đấm và chế nhạo; tiếp đó ὑπηρέται đánh Người. Sửa câu cuối để tiếng Việt hiện đại rõ ràng mà vẫn phản ánh thành ngữ Hy Lạp, đồng thời chỉnh chú thích b để không gán nghĩa «đón» cho ἔλαβον. Không thêm chi tiết rằng họ đòi Người nêu tên kẻ đánh, dù điều đó có thể được hàm ý bởi bối cảnh.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T09:24:41Z'
review_pass:
  verdict: revise
  source_fidelity: Bản dịch truyền đạt đúng chuỗi hành vi và giữ được sắc thái khởi đầu của ἤρξαντο. Tuy nhiên, «tát đánh» không phải cách diễn đạt tự nhiên và làm cho ῥαπίσμασιν bị mơ hồ về cấu trúc; câu cuối nên diễn đạt rõ hành động đánh bằng những cái tát/cú vả. Chú thích b cũng giải nghĩa ἔλαβον là «đón», không phù hợp với nghĩa đen «nhận/lấy» trong thành ngữ này.
  naturalness: «Một số người bắt đầu nhổ vào Người...» và «che mặt Người» tự nhiên, trang trọng. «Hãy nói tiên tri xem!» là lời nhạo báng ngắn gọn, tự nhiên hơn «... đi!» trong ngữ cảnh này. «Những người phục dịch» tự nhiên hơn «các thuộc hạ» và không gợi quan hệ gia thần hay quân sự quá cụ thể.
  terminology: Giữ «Người» nhất quán cho Chúa Giê-su. «Những người phục dịch» phản ánh ὑπηρέται theo bối cảnh tư pháp mà không xác định quá hẹp là lính canh. «Những cái tát» phản ánh hợp lý ῥαπίσματα, vốn thường là các cú đánh bằng tay; chú thích vẫn nêu phương án rộng hơn.
  issues:
  - severity: medium
    issue: Cụm «tát đánh Người» thiếu tự nhiên và không làm rõ quan hệ công cụ của ῥαπίσμασιν.
    rationale: 'ῥαπίσμασιν là dạng công cụ: họ đối xử/đánh Người bằng các cú đánh, thường là cái tát. Cần một cụm tiếng Việt hoàn chỉnh, rõ nghĩa.'
  - severity: medium
    issue: Chú thích b dùng «đón Người» để giải thích ἔλαβον.
    rationale: λαμβάνω nghĩa cơ bản là «nhận/lấy», không phải «đón». Trong thành ngữ này, cách dịch sát là «nhận/lấy Người bằng những cú đánh»; tiếng Việt tự nhiên có thể là «đánh Người bằng những cái tát».
  - severity: low
    issue: «Các thuộc hạ» có thể gợi cấp dưới/gia thần hơn là nhân viên, người phục dịch của cơ quan xét xử.
    rationale: ὑπηρέται trong bối cảnh này chỉ các nhân viên phục dịch/thừa hành; «những người phục dịch» giữ độ rộng của từ gốc và tự nhiên hơn.
