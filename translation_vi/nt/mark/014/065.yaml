source:
  edition: SBLGNT
  text: καὶ ἤρξαντό τινες ἐμπτύειν αὐτῷ καὶ περικαλύπτειν ⸂αὐτοῦ τὸ πρόσωπον⸃ καὶ κολαφίζειν αὐτὸν καὶ λέγειν αὐτῷ· Προφήτευσον, καὶ οἱ ὑπηρέται ῥαπίσμασιν αὐτὸν ⸀ἔλαβον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/065.yaml
  text: And some began to spit on him[a], and to cover his face, and to strike him with their fists, and to say to him[b], “Prophesy!” And the officers received him with blows.
translation:
  language: vi
  text: 'Một số người bắt đầu nhổ vào Người, che mặt Người[a], đấm Người và nói: “Hãy nói tiên tri xem!” Những người phục dịch thì đánh Người bằng những cái tát.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “bịt mắt Người.” Tiếng Hy Lạp nói sát nghĩa là “che mặt Người.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “các lính canh đánh Người” hoặc “họ lấy Người bằng những cú đánh.” Cách nói Hy Lạp theo sát từng chữ là “những người phục dịch nhận Người bằng những cú đánh.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤρξαντό τινες
  choice: một số người bắt đầu
  rationale: Diễn đạt tự nhiên sắc thái khởi đầu của ἄρχομαι với chủ thể số nhiều bất định τινες.
- source_word: ἐμπτύειν αὐτῷ
  choice: nhổ vào Người
  rationale: Chuyển ngữ trực tiếp hành động sỉ nhục được diễn tả bởi động từ ἐμπτύω đi với tặng cách.
- source_word: περικαλύπτειν αὐτοῦ τὸ πρόσωπον
  choice: che mặt Người
  rationale: Bám sát cách nói Hy Lạp là “che mặt”; ý cụ thể hơn là “bịt mắt” được giữ trong chú thích.
- source_word: κολαφίζειν αὐτόν
  choice: đấm Người
  rationale: κολαφίζω thường chỉ việc đánh bằng nắm tay; “đấm” vừa chính xác vừa tự nhiên trong tiếng Việt hiện đại.
- source_word: Προφήτευσον
  choice: Hãy nói tiên tri đi!
  rationale: Giữ nguyên mệnh lệnh ngắn mang tính chế nhạo, không thêm đối tượng hay lời giải thích mà bản Hy Lạp không nói rõ.
- source_word: οἱ ὑπηρέται
  choice: các thuộc hạ
  rationale: Trong bối cảnh xét xử, từ này chỉ những người phục vụ dưới quyền các nhà chức trách; “thuộc hạ” tránh hiểu họ là gia nhân, đồng thời không xác định quá hẹp là lính canh.
- source_word: ῥαπίσμασιν αὐτὸν ἔλαβον
  choice: tát đánh Người
  rationale: Chuyển thành cách nói tiếng Việt tự nhiên về hành động hành hung; ῥάπισμα chỉ những cú đánh, thường là bằng tay, còn cấu trúc với λαμβάνω mang tính thành ngữ.
theological_decisions:
- issue: Mệnh lệnh chế nhạo Προφήτευσον liên quan đến căn tính của Chúa Giê-su
  choice: Hãy nói tiên tri đi!
  alternative: Hãy chứng tỏ ông là nhà tiên tri đi!
  rationale: Bản văn chỉ ghi mệnh lệnh “hãy nói tiên tri”; không mở rộng lời chế nhạo thành một lời thách thức thần học cụ thể, nhờ đó giữ nguyên tính hàm ý và nghịch lý của trình thuật.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và dễ hiểu. Dùng “Người” làm đại từ chỉ Chúa Giê-su; các động từ “nhổ,” “che,” “đấm,” và “tát đánh” giữ nhịp dồn dập của chuỗi hành động trong nguyên văn. Hai dấu chú thích [a], [b] đều được đặt ngay tại cụm từ liên quan.
