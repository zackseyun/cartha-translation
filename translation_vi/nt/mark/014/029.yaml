  text: ὁ δὲ Πέτρος ἔφη αὐτῷ· ⸂Εἰ καὶ⸃ πάντες σκανδαλισθήσονται, ἀλλ’ οὐκ ἐγώ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/029.yaml
  text: But Peter said to him[a], “Even if all fall away, I will not.”
translation:
  language: vi
  text: 'Nhưng Phi-e-rơ nói với Ngài: “Dù tất cả đều sa ngã[a], còn tôi thì không.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “vấp ngã,” “bị làm cho vấp phạm” hoặc “bị xúc phạm.” Theo ngữ cảnh, từ này cũng có thể hàm ý lìa bỏ.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Nhưng
  rationale: Diễn tả sự tương phản giữa lời Phi-e-rơ và lời báo trước ngay trước đó của Đức Chúa Jêsus.
- source_word: ἔφη αὐτῷ
  choice: nói với Ngài
  rationale: Giữ động từ kể chuyện thông thường và đại từ chỉ Đức Chúa Jêsus; “Ngài” phù hợp với cách xưng hô trang trọng, tự nhiên trong tiếng Việt.
- source_word: Εἰ καὶ
  choice: Dù
  rationale: Diễn đạt gọn và tự nhiên sắc thái điều kiện–nhượng bộ của cụm Hy Lạp.
- source_word: πάντες
  choice: tất cả
  rationale: Giữ phạm vi bao quát của từ Hy Lạp, trong ngữ cảnh chỉ toàn thể các môn đồ.
- source_word: σκανδαλισθήσονται
  choice: sa ngã
  rationale: Chuyển tải sự thất bại nghiêm trọng trong lòng trung thành với Đức Chúa Jêsus, đồng thời vẫn giữ được hình ảnh vấp ngã và không khẳng định đây là sự bội đạo chung cuộc.
- source_word: ἀλλ’ οὐκ ἐγώ
  choice: còn con thì không
  rationale: Giữ sự nhấn mạnh tương phản vào chính Phi-e-rơ và bổ sung ý động từ đã được lược trong tiếng Hy Lạp; “con” là đại từ xưng hô tự nhiên của môn đồ khi nói với Đức Chúa Jêsus.
theological_decisions:
- issue: Ý nghĩa của σκανδαλισθήσονται trong bối cảnh các môn đồ thất bại
  choice: sa ngã
  alternative: vấp ngã; bị làm cho vấp ngã; lìa bỏ Thầy
  rationale: “Sa ngã” thể hiện mức độ nghiêm trọng của việc các môn đồ bỏ chạy và không giữ lòng trung thành, nhưng không tự ý kết luận về tình trạng thuộc linh cuối cùng của họ. Chú thích bảo tồn phạm vi nghĩa và thể bị động của động từ Hy Lạp.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Cấu trúc “còn con thì không” tái hiện sự tự đặt mình đối lập với mọi người khác; không thêm lời giải thích giáo phái vào câu chính.
