    rationale: Ngôi một ἐγώ chỉ nhấn mạnh “tôi/chính tôi”; “con” có thể tự nhiên trong một số truyền thống Kinh Thánh Việt ngữ, nhưng thêm một sắc thái quan hệ không có trong nguyên văn. “Tôi” là lựa chọn trung tính và sát nguồn hơn.
  - severity: low
    issue: Diễn đạt chú thích về nghĩa từ vựng
    rationale: Cụm “bị làm cho vấp phạm” tự nhiên và chính xác hơn “bị làm cho vấp ngã”; cần nêu rõ “lìa bỏ” là khả năng theo ngữ cảnh, không phải nghĩa duy nhất của động từ.
  revised_text: 'Nhưng Phi-e-rơ nói với Ngài: “Dù tất cả đều sa ngã[a], còn tôi thì không.”'
