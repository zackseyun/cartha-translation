id: MRK.14.21
reference: Mark 14:21
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸀ὅτι ὁ μὲν υἱὸς τοῦ ἀνθρώπου ὑπάγει καθὼς γέγραπται περὶ αὐτοῦ, οὐαὶ δὲ τῷ ἀνθρώπῳ ἐκείνῳ δι’ οὗ ὁ υἱὸς τοῦ ἀνθρώπου παραδίδοται· ⸀καλὸν αὐτῷ εἰ οὐκ ἐγεννήθη ὁ ἄνθρωπος ἐκεῖνος.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/021.yaml
  text: For the Son of Man goes just as it is written about him[a], but woe to that man through whom the Son of Man is betrayed. It would have been good for him if that man had not been born.
translation:
  language: vi
  text: Vì Con Người ra đi đúng như lời đã chép về Người; nhưng khốn thay cho người mà qua tay người ấy Con Người bị phản bội[a]! Thà người ấy không được sinh ra thì hơn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay sát chữ hơn: “bị trao nộp.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Vì
  rationale: Diễn đạt tự nhiên sắc thái giải thích hoặc nguyên nhân của liên từ trong ngữ cảnh.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Con Người
  rationale: Giữ nguyên danh xưng quen thuộc của Chúa Giê-su và âm hưởng có thể liên hệ đến Đa-ni-ên.
- source_word: ὑπάγει
  choice: ra đi
  rationale: Diễn đạt chuyển động hướng đến kết cục sắp tới mà không giải nghĩa quá mức là chỉ sự chết.
- source_word: καθὼς γέγραπται περὶ αὐτοῦ
  choice: đúng như lời đã chép về Người
  rationale: Giữ sắc thái so sánh của καθώς và ý nghĩa Kinh Thánh vẫn có hiệu lực của γέγραπται, đồng thời dùng lối nói tự nhiên, trang trọng.
- source_word: οὐαὶ
  choice: khốn thay
  rationale: Giữ sức nặng của lời than và lời tuyên cáo mang tính tiên tri.
- source_word: δι’ οὗ
  choice: người khiến
  rationale: Diễn đạt vai trò trung gian hoặc tác nhân của διά với sở hữu cách bằng tiếng Việt tự nhiên.
- source_word: παραδίδοται
  choice: bị phản bội
  rationale: Trong ngữ cảnh Giu-đa phản bội Chúa Giê-su, cách dịch này truyền đạt rõ tính chất bội phản; nghĩa sát chữ 'bị trao nộp' được giữ trong chú thích.
- source_word: καλὸν αὐτῷ εἰ οὐκ ἐγεννήθη
  choice: Thà người ấy đừng sinh ra thì hơn
  rationale: Lối nói tiếng Việt tự nhiên diễn đạt đánh giá phản thực của câu Hy Lạp mà không thêm từ nhấn mạnh như 'không bao giờ'.
theological_decisions:
- issue: Cách dịch παραδίδοται trong trình thuật thương khó
  choice: bị phản bội
  alternative: bị trao nộp
  rationale: Ngữ cảnh trực tiếp nhấn mạnh hành vi phản bội của Giu-đa, nhưng chú thích giữ nghĩa rộng và sát chữ hơn của động từ để không che khuất mô-típ 'trao nộp' trong các trình thuật thương khó.
- issue: Mối căng thẳng giữa điều đã được chép và trách nhiệm của kẻ phản bội
  choice: 'Giữ liền nhau hai mệnh đề: Con Người ra đi đúng như lời đã chép, nhưng kẻ phản bội vẫn bị tuyên bố là khốn thay'
  alternative: Giải thích theo hướng tiền định loại trừ trách nhiệm, hoặc theo hướng hành động con người không liên quan đến chương trình đã được chép
  rationale: Nguyên văn khẳng định đồng thời cả sự ứng nghiệm lời đã chép lẫn trách nhiệm nghiêm trọng của tác nhân; bản dịch không hóa giải căng thẳng thần học này.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Con Người” theo cách gọi đã quen thuộc trong tiếng Việt; “khốn thay” giữ âm hưởng tuyên cáo nghiêm trọng. Đại từ “Người” viết hoa nhằm chỉ Chúa Giê-su theo quy ước văn phong tiếng Việt, không thêm nội dung thần học vào nguyên văn.
