revisions:
- from: Vì Con Người ra đi đúng như lời đã chép về Người; nhưng khốn thay cho người khiến Con Người bị phản bội![a] Thà người ấy đừng sinh ra thì hơn.
  to: Vì Con Người ra đi đúng như lời đã chép về Người; nhưng khốn thay cho người mà qua tay người ấy Con Người bị phản bội[a]! Thà người ấy không được sinh ra thì hơn.
  rationale: Bản sửa thay «người khiến» bằng «người mà qua tay người ấy», qua đó phản ánh chức năng của δι’ οὗ mà không quy giản thành một quan hệ nhân quả. «Không được sinh ra» phản ánh rõ thể bị động của ἐγεννήθη. Các yếu tố còn lại được giữ nguyên vì trung thành với nguyên văn và phù hợp văn phong hiện đại trang trọng.
  reviewer_model: gpt-5.6-terra
