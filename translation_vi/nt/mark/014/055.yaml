revisions:
- from: Các thượng tế và toàn thể Hội đồng[a] đang tìm lời chứng chống lại Đức Giê-su để giết Ngài, nhưng họ không tìm được.
  to: Các thượng tế và toàn thể hội đồng[a] đang tìm lời chứng chống lại Đức Giê-su để đưa Ngài vào chỗ chết, nhưng vẫn không tìm thấy lời chứng nào.
  rationale: 'Chỉnh nhẹ để bảo toàn hai động từ ở thì chưa hoàn thành: họ đang tìm, nhưng vẫn không tìm thấy. “Đưa Ngài vào chỗ chết” diễn đạt mục đích của θανατῶσαι trong ngữ cảnh pháp lý mà không thêm khẳng định rằng một bản án đã được tuyên. Chú thích và ý nghĩa lịch sử của συνέδριον được giữ nguyên.'
  reviewer_model: gpt-5.6-terra
