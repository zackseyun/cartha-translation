source:
  edition: SBLGNT
  text: οἱ δὲ ἀρχιερεῖς καὶ ὅλον τὸ συνέδριον ἐζήτουν κατὰ τοῦ Ἰησοῦ μαρτυρίαν εἰς τὸ θανατῶσαι αὐτόν, καὶ οὐχ ηὕρισκον·
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/055.yaml
  text: The chief priests and the whole council were seeking testimony against Jesus in order to put him to death, and they were not finding any.
translation:
  language: vi
  text: Các thượng tế và toàn thể hội đồng[a] đang tìm lời chứng chống lại Đức Giê-su để đưa Ngài vào chỗ chết, nhưng vẫn không tìm thấy lời chứng nào.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch cụ thể hơn: “toàn thể Tòa Công luận” (Sanhedrin).'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ
  choice: Các
  rationale: δέ là liên từ nhẹ đánh dấu diễn tiến hoặc chuyển cảnh; tiếng Việt không cần dịch thành một từ nối riêng ở đây, tránh thêm sắc thái thời gian hoặc đối lập quá mức.
- source_word: ἀρχιερεῖς
  choice: các thượng tế
  rationale: Cách gọi quen thuộc và chính xác đối với giới lãnh đạo tư tế tại Giê-ru-sa-lem; dạng số nhiều được giữ rõ.
- source_word: ὅλον τὸ συνέδριον
  choice: toàn thể Hội đồng
  rationale: Diễn đạt cơ quan xét xử và cai trị được nói đến, đồng thời giữ ý nghĩa ὅλον là toàn thể; tên lịch sử Sanhedrin được bảo lưu trong chú thích.
- source_word: ἐζήτουν
  choice: đang tìm
  rationale: Thể chưa hoàn thành diễn tả hành động đang tiếp diễn; 'đang tìm' tự nhiên trong tiếng Việt và giữ nét kéo dài.
- source_word: κατὰ τοῦ Ἰησοῦ
  choice: chống lại Đức Giê-su
  rationale: κατά với sở hữu cách mang nghĩa bất lợi hoặc đối nghịch trong ngữ cảnh pháp lý.
- source_word: μαρτυρίαν
  choice: lời chứng
  rationale: Chỉ nội dung lời khai trong bối cảnh xét xử; 'lời chứng' chính xác hơn 'bằng chứng', vốn có thể mở rộng sang chứng cứ vật chất.
- source_word: εἰς τὸ θανατῶσαι αὐτόν
  choice: để giết Ngài
  rationale: Kết cấu εἰς + động từ nguyên mẫu có mạo từ chỉ mục đích. θανατόω nghĩa là làm cho chết hoặc giết; cách dịch ngắn gọn, rõ ý mà không thêm khái niệm hành quyết vốn không được nêu riêng.
- source_word: καὶ οὐχ ηὕρισκον
  choice: nhưng họ không tìm được
  rationale: Dù καί thường là 'và', quan hệ ý nghĩa ở đây có tính tương phản với nỗ lực tìm kiếm. 'Nhưng' là cách nối tự nhiên trong tiếng Việt; 'không tìm được' truyền đạt kết quả phủ định trong tiến trình mà không hàm ý họ thiếu khả năng.
theological_decisions:
- issue: Cách xác định συνέδριον
  choice: Dịch là 'toàn thể Hội đồng' trong chính văn.
  alternative: toàn thể Tòa Công Luận; toàn thể Sanhedrin
  rationale: Từ Hy Lạp chỉ hội đồng cầm quyền và xét xử; dịch nghĩa giúp độc giả hiện đại hiểu ngay mà không lệ thuộc thuật ngữ truyền thống. Chú thích giữ tên lịch sử quen thuộc.
- issue: Mục đích của việc tìm lời chứng
  choice: Dịch trực tiếp 'để giết Ngài'.
  alternative: để xử tử Ngài; để kết án tử hình Ngài
  rationale: Bản văn nói θανατῶσαι, tức làm cho chết hoặc giết, chứ không nêu riêng động tác kết án. Cách dịch không thêm một bước pháp lý ngoài điều nguồn văn xác quyết.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng 'Đức Giê-su' và đại từ 'Ngài' theo lối kính trọng phổ thông; giữ sắc thái pháp lý bằng 'lời chứng', nhưng tránh thuật ngữ quá chuyên biệt trong chính văn.
