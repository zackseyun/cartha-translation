source:
  edition: SBLGNT
  text: Καὶ τῇ πρώτῃ ἡμέρᾳ τῶν ἀζύμων, ὅτε τὸ πάσχα ἔθυον, λέγουσιν αὐτῷ οἱ μαθηταὶ αὐτοῦ· Ποῦ θέλεις ἀπελθόντες ἑτοιμάσωμεν ἵνα φάγῃς τὸ πάσχα;
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/012.yaml
  text: And on the first day of Unleavened Bread[a], when they were sacrificing the Passover lamb, his disciples said to him, “Where do you want us to go and prepare so that you may eat the Passover?”
translation:
  language: vi
  text: 'Vào ngày thứ nhất của lễ Bánh Không Men, khi người ta đang giết chiên con Lễ Vượt Qua để làm sinh tế[a], các môn đồ hỏi Đức Giê-su: “Thầy muốn chúng con đi đâu để chuẩn bị Lễ Vượt Qua cho Thầy ăn?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch sát hơn: “khi người ta đang hiến tế Lễ Vượt Qua.” Tiếng Hy Lạp viết “Lễ Vượt Qua”; trong ngữ cảnh này, từ ấy có lẽ chỉ chiên con Lễ Vượt Qua được giết làm sinh tế.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ πρώτῃ ἡμέρᾳ τῶν ἀζύμων
  choice: vào ngày thứ nhất của lễ Bánh Không Men
  rationale: Diễn đạt tự nhiên kết cấu sở hữu cách Hy Lạp; “Bánh Không Men” được dùng như tên của kỳ lễ. Từ “lễ” được thêm để người đọc tiếng Việt nhận ra đây là danh xưng lễ hội, không chỉ nói về loại bánh.
- source_word: ὅτε τὸ πάσχα ἔθυον
  choice: khi người ta đang giết chiên con Lễ Vượt Qua để làm sinh tế
  rationale: Thì vị hoàn ἔθυον gợi hành động đang diễn ra hoặc theo thông lệ. Khi đi với θύω, πάσχα chỉ con vật hiến tế, tức chiên con Lễ Vượt Qua; “để làm sinh tế” làm rõ ý nghĩa của động từ mà không biến việc giết chiên thành hành động thông thường.
- source_word: λέγουσιν
  choice: hỏi
  rationale: Đây là hiện tại lịch sử trong lời kể. Tiếng Việt tự nhiên dùng hình thức quá khứ không đánh dấu; vì lời trực tiếp là một câu hỏi, “hỏi” chính xác hơn “nói” trong ngữ cảnh.
- source_word: Ποῦ θέλεις
  choice: Thầy muốn ... ở đâu
  rationale: θέλω diễn tả ý muốn. Cách xưng hô “Thầy—chúng con” phù hợp quan hệ môn đồ với Đức Giê-su và tự nhiên trong tiếng Việt hiện đại.
- source_word: ἀπελθόντες ἑτοιμάσωμεν
  choice: chúng con đi dọn
  rationale: Phân từ ἀπελθόντες được kết hợp tự nhiên với động từ chính, vẫn giữ trình tự đi rồi chuẩn bị. “Dọn” trong ngữ cảnh bữa lễ bao gồm việc chuẩn bị địa điểm và bữa ăn.
- source_word: ἵνα φάγῃς τὸ πάσχα
  choice: để Thầy ăn Lễ Vượt Qua
  rationale: “Để” biểu thị rõ mục đích của ἵνα. Ở lần xuất hiện này, πάσχα chỉ bữa ăn Lễ Vượt Qua chứ không riêng con vật hiến tế; cách nói “ăn Lễ Vượt Qua” cũng giữ được lối diễn đạt cô đọng của nguyên văn.
theological_decisions:
- issue: Nghĩa của πάσχα trong hai lần xuất hiện
  choice: Lần đầu dịch là “chiên con Lễ Vượt Qua” trong ngữ cảnh dâng sinh tế; lần sau là “Lễ Vượt Qua” trong ngữ cảnh ăn lễ.
  alternative: Dịch cả hai lần đơn giản là “Lễ Vượt Qua”, hoặc cả hai lần là “chiên con Lễ Vượt Qua”.
  rationale: 'Động từ đi kèm xác định sắc thái: với θύω, từ này chỉ con vật bị giết làm sinh tế; với ἐσθίω, nó chỉ bữa ăn lễ. Cách dịch này dựa trên ngữ cảnh từ vựng và không nhằm giải quyết một lập trường hệ phái.'
- issue: Mốc thời gian “ngày thứ nhất của lễ Bánh Không Men” và việc giết chiên Vượt Qua
  choice: Giữ nguyên cả hai dữ kiện sát nhau như nguyên văn, không điều chỉnh để hài hòa niên đại.
  alternative: Diễn giải lại mốc ngày theo một hệ thống niên đại cụ thể.
  rationale: Nguyên văn đặt hai cách mô tả thời gian cạnh nhau. Bản dịch cần bảo toàn sức căng lịch sử và nghi lễ thay vì ngầm áp đặt một lời giải.
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Đức Giê-su” trong lời dẫn, còn trong lời thoại dùng cặp xưng hô tự nhiên “Thầy—chúng con”. “Sinh tế” bảo toàn sắc thái nghi lễ; “đi dọn Lễ Vượt Qua” tránh lối dịch phân từ cứng nhắc.
