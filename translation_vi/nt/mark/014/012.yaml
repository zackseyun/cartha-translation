- from: 'Vào ngày thứ nhất của lễ Bánh Không Men, khi người ta đang giết chiên con Lễ Vượt Qua để làm sinh tế[a], các môn đồ hỏi Đức Giê-su: “Thầy muốn chúng con đi dọn Lễ Vượt Qua ở đâu để Thầy ăn?”'
  to: 'Vào ngày thứ nhất của lễ Bánh Không Men, khi người ta đang giết chiên con Lễ Vượt Qua để làm sinh tế[a], các môn đồ hỏi Đức Giê-su: “Thầy muốn chúng con đi đâu để chuẩn bị Lễ Vượt Qua cho Thầy ăn?”'
  rationale: Chỉ thay “đi dọn Lễ Vượt Qua ở đâu” bằng “đi đâu để chuẩn bị Lễ Vượt Qua” để diễn đạt rõ, tự nhiên và sát hơn phân từ ἀπελθόντες cùng động từ ἑτοιμάσωμεν. Các lựa chọn khác được giữ lại vì phản ánh đúng sắc thái nghi lễ và sự phân biệt ngữ cảnh của πάσχα.
