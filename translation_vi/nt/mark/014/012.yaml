    issue: Cụm “đi dọn Lễ Vượt Qua ở đâu” không rõ nghĩa và có thể bị hiểu là thu dọn/bày dọn lễ.
    rationale: ἑτοιμάσωμεν nghĩa là “chúng ta chuẩn bị”; Ποῦ đứng đầu câu hỏi xác định địa điểm cần đi đến. “Đi đâu để chuẩn bị Lễ Vượt Qua” truyền đạt trực tiếp hơn cả hành động lẫn quan hệ cú pháp.
