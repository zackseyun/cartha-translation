  verdict: revise
  source_fidelity: 'Bản dịch phân biệt đúng hai sắc thái của πάσχα: con chiên dùng trong việc hiến tế ở mệnh đề đầu và bữa ăn Lễ Vượt Qua ở mệnh đề sau. “Khi người ta đang giết” phản ánh chấp nhận được vị hoàn ἔθυον theo nghĩa hoạt động/thông lệ, và “để Thầy ăn” giữ quan hệ mục đích của ἵνα. Tuy nhiên, “đi dọn Lễ Vượt Qua ở đâu” có thể gợi việc thu dọn hoặc bày biện lễ, chưa diễn đạt rõ và trực tiếp ἑτοιμάσωμεν là “chuẩn bị”.'
  naturalness: 'Câu mở đầu và cặp xưng hô “Thầy—chúng con” tự nhiên, phù hợp văn phong tường thuật trang trọng vừa phải. Nên chuyển vị trí “ở đâu” và dùng “chuẩn bị” để câu hỏi rõ nghĩa, tự nhiên hơn: “Thầy muốn chúng con đi đâu để chuẩn bị Lễ Vượt Qua cho Thầy ăn?”'
  terminology: “lễ Bánh Không Men,” “chiên con Lễ Vượt Qua,” và “sinh tế” giữ được bối cảnh nghi lễ. “Đức Giê-su” trong lời kể và “Thầy” trong lời thoại nhất quán. Chú thích nêu đúng khả năng dịch sát của τὸ πάσχα trong mệnh đề hiến tế và không áp đặt cách giải thích niên đại hay hệ phái.
  issues:
