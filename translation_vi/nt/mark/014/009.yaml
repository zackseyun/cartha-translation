source:
  edition: SBLGNT
  text: ἀμὴν ⸀δὲ λέγω ὑμῖν, ὅπου ⸀ἐὰν κηρυχθῇ τὸ ⸀εὐαγγέλιον εἰς ὅλον τὸν κόσμον, καὶ ὃ ἐποίησεν αὕτη λαληθήσεται εἰς μνημόσυνον αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/009.yaml
  text: Truly I tell you[a], wherever the good news is proclaimed in the whole world[b], what this woman has done will also be spoken of in memory of her.
translation:
  language: vi
  text: 'Quả thật, tôi nói với anh em: Bất cứ nơi nào trên khắp thế giới tin mừng[a] được rao truyền, việc người phụ nữ này đã làm cũng sẽ được kể lại để tưởng niệm người phụ nữ ấy[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “Phúc Âm.”'
    reason: lexical_alternative
  - marker: b
    text: 'Hay: “như một sự tưởng niệm về người phụ nữ ấy.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν
  choice: Quả thật
  rationale: Diễn đạt tự nhiên sức nặng trang trọng, xác quyết của lời mở đầu mà không giữ nguyên dạng vay mượn “A-men”.
- source_word: δὲ
  choice: không dịch thành từ riêng
  rationale: Đây là liên từ chuyển tiếp nhẹ; mạch văn tiếng Việt đã thể hiện đầy đủ chức năng nối tiếp mà không cần thêm “nhưng” hay “và”.
- source_word: λέγω ὑμῖν
  choice: tôi nói với anh em
  rationale: Giữ lời nói trực tiếp và đại từ số nhiều; “anh em” là cách xưng hô trang trọng, dễ hiểu và không tự giới hạn đối tượng vào riêng nam giới.
- source_word: ὅπου ἐὰν
  choice: bất cứ nơi nào
  rationale: 'Thể hiện đúng ý nghĩa phiếm chỉ và khái quát: ở mọi nơi điều kiện ấy được thực hiện.'
- source_word: κηρυχθῇ
  choice: được rao truyền
  rationale: Giữ thể bị động và sắc thái công bố rộng rãi của κηρύσσω, không thu hẹp vào hoạt động giảng thuyết trong một buổi lễ.
- source_word: τὸ εὐαγγέλιον
  choice: tin mừng
  rationale: Chuyển trực tiếp nghĩa cốt lõi là tin tốt lành bằng cách nói hiện đại, dễ hiểu; thuật ngữ Kitô giáo quen thuộc “Phúc Âm” được ghi ở chú thích.
- source_word: εἰς ὅλον τὸν κόσμον
  choice: trên khắp thế giới
  rationale: Diễn đạt tự nhiên phạm vi phổ quát của cụm từ Hy Lạp. Đưa cụm này lên đầu mệnh đề giúp câu tiếng Việt rõ và tránh chuỗi bổ ngữ nặng nề.
- source_word: καὶ
  choice: cũng
  rationale: 'Nêu rõ ý bổ sung: cùng với việc rao truyền tin mừng, hành động của người phụ nữ cũng sẽ được thuật lại.'
- source_word: ὃ ἐποίησεν αὕτη
  choice: việc người phụ nữ này đã làm
  rationale: Danh hóa mệnh đề một cách tự nhiên và làm rõ đối tượng nữ mà đại từ chỉ định αὕτη nói đến trong ngữ cảnh.
- source_word: λαληθήσεται
  choice: sẽ được kể lại
  rationale: Giữ thì tương lai và thể bị động, đồng thời diễn đạt tự nhiên việc hành động này sẽ trở thành nội dung được truyền kể.
- source_word: εἰς μνημόσυνον αὐτῆς
  choice: để tưởng nhớ đến bà
  rationale: Giữ ý nghĩa mục đích/kết quả của εἰς và nội dung tưởng niệm của μνημόσυνον; “bà” là đại từ tôn trọng, tự nhiên khi nhắc lại một người phụ nữ trưởng thành.
theological_decisions:
- issue: Cách dịch εὐαγγέλιον trong lời nói về sự công bố trên toàn thế giới
  choice: tin mừng
  alternative: Phúc Âm
  rationale: Bản chính ưu tiên nghĩa trực tiếp, dễ hiểu của từ Hy Lạp; chú thích giữ thuật ngữ Kitô giáo truyền thống mà không áp đặt thêm một nội hàm hệ phái.
- issue: Xác định rõ đại từ αὕτη
  choice: người phụ nữ này
  alternative: người này; bà ấy
  rationale: Dạng giống cái số ít cùng ngữ cảnh trực tiếp xác định đây là người phụ nữ; nói rõ danh từ giúp tiếng Việt sáng nghĩa mà không thêm diễn giải thần học.
- issue: Sắc thái của εἰς μνημόσυνον αὐτῆς
  choice: để tưởng nhớ đến bà
  alternative: làm kỷ niệm về bà
  rationale: Cách dịch chính tự nhiên trong tiếng Việt và giữ mục đích tưởng niệm; phương án chú thích bảo lưu sát hơn hình thức danh từ “vật/sự kỷ niệm” của μνημόσυνον.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Câu được sắp xếp lại nhẹ theo cú pháp tiếng Việt nhưng vẫn giữ toàn bộ quan hệ ý nghĩa của bản Hy Lạp. Các dấu chú thích [a], [b] được đặt ngay sau đúng từ ngữ mà chúng giải thích.
