  text: ἦσαν δέ τινες ἀγανακτοῦντες πρὸς ⸀ἑαυτούς· Εἰς τί ἡ ἀπώλεια αὕτη τοῦ μύρου γέγονεν;
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/004.yaml
  text: 'But some were indignant among themselves: “Why has this waste of the perfume happened?”[a][b]'
translation:
  language: vi
  text: 'Nhưng có một số người phẫn nộ trong nhóm: “Sao lại phí dầu thơm như thế này?[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cụm từ Hy Lạp có thể chỉ sự phẫn nộ “với nhau,” “giữa họ,” hoặc “trong lòng.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦσαν δέ
  choice: Nhưng có
  rationale: δέ tạo sự chuyển tiếp với sắc thái tương phản nhẹ giữa hành động của người phụ nữ và phản ứng của một số người; “nhưng” diễn đạt tự nhiên sắc thái ấy.
- source_word: τινες
  choice: mấy người
  rationale: Đại từ bất định số nhiều, không xác định cụ thể những người phản ứng.
- source_word: ἀγανακτοῦντες
  choice: tức giận
  rationale: Diễn tả sự bất bình mạnh; “tức giận” là cách nói hiện đại, dễ hiểu và giữ được cường độ cảm xúc.
- source_word: πρὸς ἑαυτούς
  choice: nói với nhau
  rationale: Trong ngữ cảnh lời phàn nàn được trích dẫn ngay sau đó, cụm từ có thể chỉ sự trao đổi trong nhóm; bản dịch giữ cách hiểu tự nhiên này nhưng ghi chú sự mơ hồ của nguyên ngữ.
- source_word: Εἰς τί
  choice: Tại sao
  rationale: Cách hỏi về mục đích hoặc kết quả, được chuyển sang câu hỏi tự nhiên trong tiếng Việt.
- source_word: ἡ ἀπώλεια αὕτη
  choice: lãng phí ... như thế này
  rationale: ἀπώλεια có thể chỉ sự mất mát, hủy hoại hoặc phí phạm; trong ngữ cảnh dầu thơm quý bị đổ ra, lời trách móc nhấn mạnh việc họ cho là phí phạm.
- source_word: τοῦ μύρου
  choice: dầu thơm
  rationale: μύρον chỉ dầu hoặc thuốc mỡ có hương thơm; “dầu thơm” vừa rõ nghĩa vừa phù hợp với vật được đổ ra trong ngữ cảnh.
- source_word: γέγονεν
  choice: lại ... như thế này
  rationale: Dạng hoàn thành của γίνομαι trình bày sự việc đã xảy ra với kết quả hiện tại; tiếng Việt tự nhiên thể hiện điều này qua toàn bộ câu hỏi hơn là bằng một động từ tương ứng riêng.
theological_decisions: []
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Cấu trúc câu trực tiếp, tự nhiên; giữ sắc thái phán xét của những người nói mà không xác nhận đánh giá của họ. Dùng một chú thích tại điểm mơ hồ thực sự của πρὸς ἑαυτούς; “dầu thơm” bao quát nghĩa của μύρον nên không cần thêm chú thích riêng.
