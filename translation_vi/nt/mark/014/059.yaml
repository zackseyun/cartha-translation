  text: And not even in this way was their testimony consistent[a].
translation:
  language: vi
  text: Ngay cả như thế, lời chứng của họ cũng không khớp nhau.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “cũng không phù hợp với nhau”; sát nghĩa hơn: “cũng không ngang bằng.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ οὐδὲ
  choice: Ngay cả ... vẫn không
  rationale: Diễn đạt tự nhiên trong tiếng Việt sức nhấn mạnh phủ định của οὐδὲ, đồng thời nối câu với lời tường thuật ngay trước đó; không cần dịch καὶ thành một từ nối riêng.
- source_word: οὕτως
  choice: như vậy
  rationale: Chỉ về cách làm chứng vừa được thuật lại ở câu trước và giữ sắc thái hồi chỉ của từ Hy Lạp.
- source_word: ἴση
  choice: nhất quán
  rationale: Nghĩa đen là “ngang bằng”, nhưng trong bối cảnh pháp lý nói về lời chứng của nhiều người, từ này diễn tả việc các lời chứng có phù hợp với nhau hay không.
- source_word: ἦν
  choice: vẫn
  rationale: Cấu trúc “vẫn không nhất quán” diễn đạt tự nhiên mệnh đề quá khứ trong mạch kể tiếng Việt và làm rõ rằng ngay trong trường hợp này kết quả cũng không thay đổi.
- source_word: ἡ μαρτυρία αὐτῶν
  choice: lời chứng của họ
  rationale: Giữ danh từ số ít mang nghĩa tập hợp của bản Hy Lạp và chuyển sở hữu cách αὐτῶν bằng cấu trúc tiếng Việt tự nhiên.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Bản dịch ưu tiên cách diễn đạt tự nhiên trong bối cảnh xét xử nhưng chú thích vẫn bảo tồn nghĩa đen và phương án diễn giải của ἴση.
