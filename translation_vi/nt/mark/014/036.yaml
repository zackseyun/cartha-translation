id: MRK.14.36
reference: Mark 14:36
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἔλεγεν· Αββα ὁ πατήρ, πάντα δυνατά σοι· παρένεγκε τὸ ποτήριον ⸂τοῦτο ἀπ’ ἐμοῦ⸃· ἀλλ’ οὐ τί ἐγὼ θέλω ἀλλὰ τί σύ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/036.yaml
  text: And he was saying[a], “Abba, Father, all things are possible for you. Take this cup away from me. Yet not what I will[c][b], but what you will.”
translation:
  language: vi
  text: Ngài nói:[a] “A-ba, Cha ơi,[b] với Cha, mọi sự đều có thể. Xin cất chén này khỏi con.[c] Nhưng không phải điều con muốn, mà là điều Cha muốn.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Ngài đang nói.” Dạng chưa hoàn thành trong tiếng Hy Lạp có thể gợi ý lời nói đang tiếp diễn hoặc được lặp lại.'
    reason: lexical_alternative
  - marker: b
    text: “A-ba” là từ A-ram dùng để gọi cha; nguyên văn giữ từ này bên cạnh từ Hy Lạp có nghĩa là “Cha.”
    reason: cultural_note
  - marker: c
    text: “Chén” là hình ảnh Kinh Thánh chỉ sự đau khổ được định cho Ngài; xem Mác 10:38.
    reason: cross_reference
lexical_decisions:
- source_word: ἔλεγεν
  choice: vẫn cầu nguyện rằng
  rationale: Thì chưa hoàn thành có thể diễn tả lời nói đang tiếp diễn hoặc lặp lại. Trong ngữ cảnh này, “cầu nguyện” diễn đạt tự nhiên hành động nói với Đức Chúa Trời, còn “vẫn” giữ nét tiếp diễn; chú thích bảo lưu cách dịch sát hơn là “Ngài nói”.
- source_word: Αββα ὁ πατήρ
  choice: A-ba, Cha ơi
  rationale: Giữ nguyên cách xưng hô A-ram “A-ba” và chuyển phần Hy Lạp giải thích thành lời gọi trực tiếp tự nhiên trong tiếng Việt. Không thêm đại từ sở hữu vốn không được nói rõ trong nguyên văn.
- source_word: πάντα δυνατά σοι
  choice: mọi sự đều có thể đối với Cha
  rationale: Giữ phạm vi bao quát của πάντα và cấu trúc hướng đến người có khả năng, đồng thời phù hợp với lối cầu nguyện trang trọng.
- source_word: παρένεγκε τὸ ποτήριον τοῦτο ἀπ’ ἐμοῦ
  choice: Xin cất chén này khỏi con
  rationale: “Cất ... khỏi” truyền đạt mệnh lệnh cầu xin đem chén đi, còn “chén” giữ nguyên hình ảnh ẩn dụ của nguyên văn.
- source_word: ἀλλ’ οὐ τί ἐγὼ θέλω ἀλλὰ τί σύ
  choice: Nhưng đừng theo điều con muốn, mà theo điều Cha muốn
  rationale: Nguyên văn lược động từ ở vế sau. Tiếng Việt cần bổ sung “theo” để câu tự nhiên mà vẫn giữ sự đối lập giữa ý muốn của Đức Chúa Jêsus và ý muốn của Cha, không giải thích thêm bản chất của hai ý muốn.
theological_decisions:
- issue: Cách Đức Chúa Jêsus xưng hô với Đức Chúa Trời bằng cả tiếng A-ram và tiếng Hy Lạp
  choice: A-ba, Cha ơi
  alternative: A-ba, Cha của con
  rationale: Bảo tồn cả từ A-ram lẫn lời giải thích bằng tiếng Hy Lạp, nhưng không thêm ý sở hữu “của con” vốn không hiện diện rõ trong câu.
- issue: Ý nghĩa ẩn dụ của “chén”
  choice: chén này
  alternative: sự đau khổ này
  rationale: Giữ nguyên ẩn dụ Kinh Thánh thay vì diễn giải nó thành sự đau khổ, qua đó bảo tồn liên hệ văn chương và sức căng thần học của hình ảnh.
- issue: Sự đối lập giữa điều Đức Chúa Jêsus muốn và điều Cha muốn
  choice: đừng theo điều con muốn, mà theo điều Cha muốn
  alternative: xin ý Cha được nên, không phải ý con
  rationale: Diễn đạt rõ sự đối lập trong nguyên văn nhưng không nhập thêm công thức từ các phân đoạn song song hoặc giải quyết bản chất thần học của ý muốn.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “Ngài” trong lời dẫn và cặp xưng hô “Cha–con” trong lời cầu nguyện. Giữ “A-ba” và ẩn dụ “chén”; các dấu chú thích [a], [b], [c] đều xuất hiện đúng trong chính văn.
