source:
  edition: SBLGNT
  text: Ἦν δὲ τὸ πάσχα καὶ τὰ ἄζυμα μετὰ δύο ἡμέρας. καὶ ἐζήτουν οἱ ἀρχιερεῖς καὶ οἱ γραμματεῖς πῶς αὐτὸν ἐν δόλῳ κρατήσαντες ἀποκτείνωσιν,
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/001.yaml
  text: The Passover and Unleavened Bread were two days away[a]. And the chief priests and the scribes were seeking how, by deceit, they might arrest him and kill him[c][b],
translation:
  language: vi
  text: Lễ Vượt Qua và lễ Bánh Không Men còn hai ngày nữa mới đến.[a] Các thượng tế và các kinh sư đang tìm cách dùng thủ đoạn để bắt Ngài[c] rồi giết Ngài.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát hơn: “sau hai ngày.” Cụm từ này cho biết Lễ Vượt Qua và lễ Bánh Không Men đã gần đến.'
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể dịch: “tóm bắt Ngài” hoặc “bắt giữ Ngài.”'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἦν δὲ
  choice: còn ... nữa mới đến; chuyển sang câu sau không dịch δέ thành một từ nối riêng
  rationale: Ἦν kết hợp với cụm thời gian diễn tả hai lễ đang đến gần; δέ chỉ đánh dấu bước chuyển nhẹ trong mạch kể, nên tiếng Việt có thể thể hiện tự nhiên bằng cách chuyển câu mà không cần thêm “bấy giờ” hay “nhưng”.
- source_word: τὸ πάσχα
  choice: Lễ Vượt Qua
  rationale: Cách gọi chuẩn, rõ ràng cho lễ Do Thái được nói đến trong ngữ cảnh.
- source_word: τὰ ἄζυμα
  choice: lễ Bánh Không Men
  rationale: Nghĩa đen là “những thứ/bánh không men”, nhưng trong ngữ cảnh đây là cách gọi lễ Bánh Không Men; thêm “lễ” giúp độc giả Việt hiểu đúng sở chỉ.
- source_word: μετὰ δύο ἡμέρας
  choice: còn hai ngày nữa mới đến
  rationale: Truyền đạt tự nhiên ý nghĩa thời gian sắp tới của thành ngữ “sau hai ngày”, đồng thời giữ chú thích cho cách dịch sát chữ.
- source_word: ἐζήτουν
  choice: đang tìm cách
  rationale: Thì chưa hoàn thành biểu thị nỗ lực đang tiếp diễn; “đang tìm cách” phù hợp với mệnh đề πῶς theo sau.
- source_word: οἱ ἀρχιερεῖς
  choice: các thượng tế
  rationale: Thuật ngữ quen dùng chỉ nhóm lãnh đạo thuộc hàng tư tế, không chỉ riêng một vị thượng tế.
- source_word: οἱ γραμματεῖς
  choice: các kinh sư
  rationale: Cách gọi ngắn gọn, hiện đại và dễ hiểu cho những chuyên gia sao chép, giải thích Kinh Luật.
- source_word: ἐν δόλῳ
  choice: dùng mưu mô
  rationale: Giữ sắc thái lừa dối, xảo quyệt của δόλος, không thu hẹp nghĩa thành chỉ hành động bí mật.
- source_word: κρατήσαντες
  choice: bắt
  rationale: Trong âm mưu của giới chức chống lại Đức Chúa Jêsus, động từ chỉ việc bắt giữ; chú thích giữ các khả năng sát chữ hơn như “tóm bắt” hoặc “bắt bằng thủ đoạn”.
- source_word: αὐτόν
  choice: Đức Chúa Jêsus ... Ngài
  rationale: Tiếng Việt thường cần nêu lại danh xưng để tránh đại từ thiếu sở chỉ khi bắt đầu một đơn vị trích dẫn; sở chỉ là Đức Chúa Jêsus từ ngữ cảnh trước.
- source_word: ἀποκτείνωσιν
  choice: giết Ngài
  rationale: Diễn đạt trực tiếp nghĩa “giết” mà không làm tăng sắc thái pháp lý thành “xử tử”.
theological_decisions:
- issue: Mối quan hệ giữa Lễ Vượt Qua và lễ Bánh Không Men
  choice: 'Giữ hai tên lễ riêng biệt: “Lễ Vượt Qua và lễ Bánh Không Men”'
  alternative: Gộp thành tên của một kỳ lễ duy nhất
  rationale: Bản Hy Lạp nêu rõ cả πάσχα lẫn ἄζυμα. Bản dịch giữ sự phân biệt ấy mà không phủ nhận mối liên hệ chặt chẽ giữa hai lễ.
- issue: Tính chất đạo đức trong kế hoạch của các lãnh đạo
  choice: Dịch ἐν δόλῳ là “dùng mưu mô”
  alternative: “lén lút” hoặc “bí mật”
  rationale: Cụm Hy Lạp nhấn mạnh thủ đoạn lừa dối, xảo quyệt, chứ không chỉ tính kín đáo của hành động.
- issue: Sở chỉ của đại từ αὐτόν
  choice: Nêu rõ “Đức Chúa Jêsus” trong câu chính
  alternative: Chỉ dùng “Ngài” hoặc “ông ấy”
  rationale: Sở chỉ đến từ văn cảnh trước và không gây tranh luận; việc nêu rõ tên giúp câu đứng riêng vẫn dễ hiểu mà không thêm nội dung thần học.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Dùng “thượng tế”, “kinh sư”, “Lễ Vượt Qua” và “lễ Bánh Không Men” là các thuật ngữ Kinh Thánh quen thuộc trong tiếng Việt. Tất cả dấu chú thích đều xuất hiện trong chính văn; thứ tự [a], [c] theo các ghi chú thực sự được dùng, không tạo chú thích [b] dư thừa.
