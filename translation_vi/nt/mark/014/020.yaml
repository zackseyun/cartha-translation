  text: And he said to them[a], “One of the twelve, the one dipping with me into the bowl.”
translation:
  language: vi
  text: 'Ngài nói với họ: “Một trong Nhóm Mười Hai—người đang chấm cùng ta vào bát.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “đĩa.” Từ Hy Lạp τρύβλιον có thể chỉ một cái bát hoặc đĩa dùng khi ăn.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: '[không dịch riêng]'
  rationale: δέ là từ nối nhẹ tiếp tục lời tường thuật; trong tiếng Việt, chuyển thẳng sang “Ngài nói” tự nhiên hơn mà vẫn giữ mạch văn.
- source_word: εἶπεν αὐτοῖς
  choice: Ngài nói với họ
  rationale: Cách dịch trực tiếp, tự nhiên của động từ λέγω và đại từ chỉ những người đang được nói với.
- source_word: Εἷς τῶν δώδεκα
  choice: một trong Nhóm Mười Hai
  rationale: Cụm từ xác định người phản bội thuộc nhóm mười hai môn đồ thân cận; “Nhóm Mười Hai” diễn đạt rõ chức năng gần như danh xưng của cụm từ.
- source_word: ὁ ἐμβαπτόμενος
  choice: người đang chấm
  rationale: Phân từ hiện tại có mạo từ mang nghĩa nhận diện và diễn tả hành động đang diễn ra; “người đang chấm” tự nhiên trong bối cảnh bữa ăn.
- source_word: μετ’ ἐμοῦ
  choice: chung với ta
  rationale: μετά với sở hữu cách biểu thị sự cùng tham gia; “chấm chung với ta” là cách nói tự nhiên và giữ ý đồng hành.
- source_word: εἰς τὸ τρύβλιον
  choice: vào bát
  rationale: “Vào” phản ánh hướng của εἰς; τρύβλιον chỉ vật đựng thức ăn trên bàn, có thể là bát hoặc đĩa.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Ngài” cho chủ thể là Chúa Giê-su và “ta” trong lời trực tiếp. Giữ cấu trúc câu trả lời rút gọn của nguyên văn, không tự thêm “kẻ phản Ta” hay “chính là”.
