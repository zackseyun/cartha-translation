  text: ἐγείρεσθε ἄγωμεν· ἰδοὺ ὁ παραδιδούς με ἤγγικεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/042.yaml
  text: Get up; let us go. Look[a], the one betraying me has come near.
translation:
  language: vi
  text: Hãy đứng dậy, chúng ta đi nào. Kìa, kẻ phản bội tôi[a] đã đến gần.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc, sát nghĩa hơn: “người đang giao nộp tôi”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγείρεσθε
  choice: Hãy đứng dậy
  rationale: Động từ mệnh lệnh số nhiều; trong ngữ cảnh, Đức Giê-su giục các môn đồ đứng lên để cùng đi, chứ không chỉ bảo họ thức giấc.
- source_word: ἄγωμεν
  choice: chúng ta đi nào
  rationale: Thể giả định ngôi thứ nhất số nhiều mang ý khích lệ; cách diễn đạt này tự nhiên trong tiếng Việt và giữ sắc thái cùng hành động.
- source_word: ἰδού
  choice: Kìa
  rationale: Thán từ hướng sự chú ý đến điều sắp xuất hiện; “Kìa” ngắn gọn, hiện đại và phù hợp với tình huống trước mắt.
- source_word: ὁ παραδιδούς με
  choice: kẻ phản bội tôi
  rationale: Phân từ có mạo từ chỉ người đang giao nộp Đức Giê-su. Trong bối cảnh Giu-đa dẫn người đến bắt Ngài, “phản bội” truyền đạt đúng sức nặng quan hệ và đạo đức; chú thích giữ nghĩa sát chữ “giao nộp”.
- source_word: ἤγγικεν
  choice: đã đến gần
  rationale: Thì hoàn thành diễn tả việc tiến đến đã xảy ra và hiện đang có hiệu lực; “đã đến gần” giữ cả hành động lẫn tính cấp thời.
theological_decisions:
- issue: Cách dịch παραδίδωμι trong trình thuật thương khó
  choice: phản bội
  alternative: giao nộp
  rationale: “Phản bội” thể hiện đúng ý nghĩa theo ngữ cảnh về hành động của Giu-đa mà không thêm một danh xưng thần học; “giao nộp” là nghĩa sát chữ và được bảo lưu trong chú thích để không che khuất độ rộng nghĩa của từ Hy Lạp.
translation_notes:
  register: Văn phong hiện đại, trang trọng và trực tiếp. “Chúng ta đi nào” tự nhiên hơn lối dịch cứng “hãy để chúng ta đi”, còn “Kìa” giữ được lực chỉ xuất của ἰδού.
