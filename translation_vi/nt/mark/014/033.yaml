  text: καὶ παραλαμβάνει τὸν Πέτρον καὶ ⸂Ἰάκωβον καὶ⸃ Ἰωάννην μετ’ ⸀αὐτοῦ, καὶ ἤρξατο ἐκθαμβεῖσθαι καὶ ἀδημονεῖν,
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/033.yaml
  text: And he takes Peter and James and John with him[a], and he began to be greatly distressed and troubled,
translation:
  language: vi
  text: Ngài đem theo Phi-e-rơ, Gia-cơ và Giăng, rồi bắt đầu bàng hoàng[a] và khắc khoải.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “kinh hãi”, “sững sờ” hoặc “vô cùng đau đớn”. Động từ thứ nhất có thể chỉ sự chấn động, kinh hoàng hoặc đau đớn dữ dội trong bối cảnh này.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παραλαμβάνει
  choice: đem theo
  rationale: Diễn đạt tự nhiên hành động Chúa Giê-su chọn ba môn đồ đi cùng mình; thì hiện tại lịch sử của tiếng Hy Lạp được chuyển sang lối kể quá khứ tự nhiên trong tiếng Việt.
- source_word: μετ’ αὐτοῦ
  choice: theo
  rationale: Kết hợp với “đem” thành “đem theo”, thể hiện rõ ba người cùng đi với Chúa Giê-su mà không lặp từ.
- source_word: ἤρξατο
  choice: bắt đầu
  rationale: Giữ nguyên ý khởi đầu của động từ Hy Lạp và diễn tiến rõ rệt trong câu chuyện.
- source_word: ἐκθαμβεῖσθαι
  choice: kinh hãi
  rationale: Trong bối cảnh Ghết-sê-ma-nê, động từ chỉ trạng thái xúc động dữ dội, có thể bao gồm kinh hoàng, sửng sốt hoặc đau đớn sâu sắc; “kinh hãi” giữ được cường độ mà không biến thành lời giải thích thần học.
- source_word: ἀδημονεῖν
  choice: khắc khoải
  rationale: Diễn tả nỗi bất an, đau đớn nội tâm sâu sắc và phân biệt được với sắc thái kinh hãi của động từ trước.
- source_word: καὶ ... καὶ
  choice: và ... rồi
  rationale: Giữ quan hệ liên kết và bước chuyển tiếp của lời kể, đồng thời dùng cú pháp tự nhiên trong tiếng Việt hiện đại.
theological_decisions:
- issue: Trạng thái cảm xúc của Chúa Giê-su tại Ghết-sê-ma-nê
  choice: Diễn đạt trực tiếp là “kinh hãi và khắc khoải”.
  alternative: “đau buồn sâu sắc và bối rối” hoặc “vô cùng kinh hãi và đau đớn”
  rationale: Bản dịch không làm nhẹ đi nhân tính và nỗi thống khổ thật của Chúa Giê-su, cũng không đưa vào câu bất kỳ cách giải thích giáo phái nào. Hai động từ riêng biệt được giữ bằng hai trạng thái cảm xúc có sắc thái khác nhau.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại, dễ hiểu. Dùng “Ngài” theo văn cảnh để chỉ Chúa Giê-su; các tên riêng theo dạng quen thuộc trong tiếng Việt. Dấu chú thích [a] được đặt sau mệnh đề có từ cần giải thích.
