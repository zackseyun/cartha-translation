base_translation:
  language: en
  yaml_path: translation/nt/mark/014/023.yaml
  text: And taking a cup[a], after giving thanks he gave it to them, and they all drank from it.
translation:
  language: vi
  text: Rồi Đức Giê-su cầm một chén[a], tạ ơn rồi trao cho họ; và tất cả đều uống từ chén ấy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “chén ấy.” Tiếng Hy Lạp dùng “chén” không có mạo từ, dù ngữ cảnh bữa ăn có thể hàm ý một chén cụ thể.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λαβὼν
  choice: cầm
  rationale: Phân từ bất định chỉ hành động xảy ra trước động từ chính; tiếng Việt tự nhiên diễn đạt chuỗi hành động bằng “cầm… dâng… trao” mà không cần dùng cấu trúc nặng nề như “sau khi đã cầm”.
- source_word: ποτήριον
  choice: một cái chén
  rationale: Danh từ Hy Lạp không có mạo từ; “một cái chén” phản ánh trực tiếp hình thức này, trong khi ngữ cảnh bữa ăn vẫn có thể khiến người đọc hiểu đây là một chén cụ thể.
- source_word: εὐχαριστήσας
  choice: dâng lời tạ ơn
  rationale: Diễn đạt rõ hành động cảm tạ xảy ra trước khi trao chén, đồng thời tránh áp đặt thuật ngữ phụng vụ hình thành về sau hoặc chuyển nghĩa thành “chúc phước cho chén”.
- source_word: ἔδωκεν αὐτοῖς
  choice: trao cho các môn đồ
  rationale: “Trao” tự nhiên trong ngữ cảnh đưa chén cho người khác. Đại từ số nhiều được diễn đạt là “các môn đồ” theo những người hiện diện trong văn cảnh, giúp câu tiếng Việt rõ nghĩa.
- source_word: ἔπιον
  choice: uống
  rationale: Cách tương đương thông dụng, tự nhiên của động từ bất định Hy Lạp, không cần tái hiện hình thái thì trong tiếng Việt.
- source_word: ἐξ αὐτοῦ
  choice: từ chén ấy
  rationale: Đại từ giống trung chỉ về ποτήριον; lặp lại “chén ấy” tự nhiên và rõ hơn “từ nó” trong tiếng Việt.
- source_word: πάντες
  choice: tất cả đều
  rationale: Giữ sự nhấn mạnh rằng mọi người trong nhóm đều uống, với trật tự từ tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Hàm ý Tiệc Thánh của εὐχαριστήσας
  choice: dâng lời tạ ơn
  alternative: chúc phước cho chén; cử hành lễ tạ ơn
  rationale: Động từ εὐχαριστέω có nghĩa trực tiếp là cảm tạ. Bản dịch giữ nguyên hành động được văn bản nói đến mà không đưa thuật ngữ nghi lễ hoặc cách hiểu giáo phái về sau vào câu.
- issue: Đối tượng của lời tạ ơn
  choice: Không thêm tân ngữ cho “dâng lời tạ ơn”
  alternative: tạ ơn Đức Chúa Trời; tạ ơn về chén
  rationale: Bản văn không nêu rõ tân ngữ hay nội dung của lời tạ ơn; không thêm vào để bảo toàn mức độ hàm ẩn của nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Đức Chúa Jêsus” và “các môn đồ” để xác định các đại từ theo văn cảnh; giữ nhịp kể tuần tự của nguyên văn. Dấu chân chú [a] xuất hiện ngay sau cụm từ liên quan.
