  verdict: revise
  source_fidelity: Bản nháp truyền đạt đúng chuỗi hành động và nhấn mạnh rằng tất cả đều uống. Tuy nhiên, “dâng lời tạ ơn” kém trực tiếp hơn εὐχαριστήσας và “các môn đồ” giải thích đại từ αὐτοῖς rõ hơn mức nguyên văn; có thể giữ cách quy chiếu theo ngữ cảnh bằng “họ”.
  naturalness: “Một chén” tự nhiên và trang trọng hơn “một cái chén” trong văn phong Kinh Thánh hiện đại. “Tạ ơn rồi” là cách diễn đạt gọn, tự nhiên, đồng thời biểu đạt hành động có trước của phân từ bất định.
  terminology: Dùng “Đức Giê-su” thay cho cách viết “Đức Chúa Jêsus” để phù hợp chính tả và cách dùng tiếng Việt hiện đại hơn, đồng thời không đưa tước hiệu “Chúa” vào câu khi văn bản Hy Lạp của câu này không nêu tước hiệu ấy. “Tạ ơn” giữ nghĩa trực tiếp của εὐχαριστέω, không áp đặt thuật ngữ nghi lễ.
  issues:
