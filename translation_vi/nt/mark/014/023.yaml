    rationale: Cách viết “Jêsus” và việc thêm tước hiệu “Chúa” không phù hợp tối ưu với tiếng Việt hiện đại và thêm một tước hiệu không xuất hiện trong nguyên văn của câu này. Tên riêng được xác định từ ngữ cảnh có thể giữ, nhưng nên dùng dạng hiện đại “Đức Giê-su”.
