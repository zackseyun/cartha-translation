    rationale: Cụm này có thể hiểu được, nhưng “tạ ơn rồi” tự nhiên hơn và bám sát εὐχαριστήσας hơn, không hàm ý một công thức hay nghi thức cụ thể.
  - severity: low
    issue: “một cái chén” và “các môn đồ”
    rationale: “Một chén” phù hợp văn phong hơn. “Các môn đồ” là diễn giải hợp lý theo văn cảnh nhưng nguyên văn chỉ dùng đại từ “họ”; “họ” bảo toàn độ minh thị của câu.
