  rationale: 'Bản sửa giữ nguyên trình tự: cầm chén, tạ ơn, trao cho họ, rồi mọi người đều uống từ chén đó. Các thay đổi nhằm dùng tiếng Việt hiện đại, giảm diễn giải không cần thiết, và tránh thêm tước hiệu hoặc sắc thái nghi lễ vượt quá câu Hy Lạp.'
