base_translation:
  language: en
  yaml_path: translation/nt/mark/014/011.yaml
  text: When they heard it[a], they rejoiced and promised to give him money[b]. And he began seeking how he might betray him at an opportune time.
translation:
  language: vi
  text: 'Khi nghe vậy, họ mừng rỡ và hứa sẽ cho Giu-đa tiền[a]. Rồi Giu-đa bắt đầu tìm cách giao nộp Đức Giê-su[b] khi có dịp thuận tiện.


    [a] Cũng có thể dịch là “bạc”. Từ Hy Lạp này có thể chỉ bạc theo nghĩa đen hoặc tiền nói chung.


    [b] Cũng có thể dịch là “phản bội Đức Giê-su”. Động từ Hy Lạp có nghĩa là “giao nộp” hoặc “trao vào tay”; trong bối cảnh Giu-đa, hành động này mang tính phản bội.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “bạc”. Từ Hy Lạp này có thể chỉ bạc theo nghĩa đen hoặc tiền nói chung.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “phản bội Đức Giê-su”. Động từ Hy Lạp có nghĩa là “giao nộp” hoặc “trao vào tay”; trong bối cảnh Giu-đa, hành động này mang tính phản bội.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ ἀκούσαντες
  choice: Khi nghe vậy, họ
  rationale: Phân từ có mạo từ cùng δέ chuyển sang phản ứng của các thượng tế. “Khi nghe vậy” diễn đạt tự nhiên quan hệ thời gian và bổ sung tân ngữ hàm ẩn từ ngữ cảnh.
- source_word: ἐχάρησαν
  choice: mừng rỡ
  rationale: Diễn đạt rõ phản ứng vui mừng mạnh của họ, đồng thời giữ sắc thái đáng chú ý về mặt đạo đức trong trình thuật.
- source_word: ἐπηγγείλαντο αὐτῷ ἀργύριον δοῦναι
  choice: hứa sẽ cho Giu-đa tiền
  rationale: ἐπαγγέλλομαι là hứa hoặc cam kết; ἀργύριον trong ngữ cảnh này tự nhiên nhất là “tiền”. Tên Giu-đa được nêu thay đại từ để câu tiếng Việt rõ nghĩa.
- source_word: ἀργύριον
  choice: tiền
  rationale: Từ này vốn có thể chỉ “bạc”, nhưng trong tiếng Hy Lạp Koinē thường được dùng với nghĩa tiền bạc. Bản văn không nêu số lượng hay loại đồng tiền.
- source_word: ἐζήτει
  choice: bắt đầu tìm cách
  rationale: Thì chưa hoàn thành biểu thị hành động đang tiếp diễn và trong mạch kể có thể mang sắc thái khởi đầu sau lời hứa của các thượng tế.
- source_word: πῶς
  choice: tìm cách
  rationale: Cách diễn đạt tự nhiên trong tiếng Việt cho ý tìm phương thức để thực hiện hành động.
- source_word: εὐκαίρως
  choice: khi có dịp thuận tiện
  rationale: Diễn đạt một thời cơ thích hợp hoặc thuận lợi mà không thêm các chi tiết không có trong câu.
- source_word: παραδοῖ
  choice: giao nộp Đức Giê-su
  rationale: “Giao nộp” giữ nghĩa cơ bản của παραδίδωμι và duy trì khả năng liên kết từ vựng trong trình thuật thương khó; ngữ cảnh Giu-đa khiến tính phản bội vẫn rõ. Tên Đức Giê-su được nêu để tránh đại từ mơ hồ trong tiếng Việt.
theological_decisions:
- issue: Cách dịch παραδίδωμι trong hành động của Giu-đa
  choice: giao nộp
  alternative: phản bội
  rationale: “Giao nộp” bảo toàn nghĩa hành động trực tiếp của động từ và sự căng thẳng từ vựng của trình thuật, trong khi chú thích nêu rõ sắc thái phản bội do ngữ cảnh. Cách này không biến một động từ có trường nghĩa rộng thành một kết luận diễn giải duy nhất.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “mừng rỡ”, “tiền”, “tìm cách” và “dịp thuận tiện” theo cách nói tự nhiên. Hai tên riêng được minh thị thay cho các đại từ Hy Lạp nhằm tránh nhầm lẫn về chủ thể và đối tượng trong một câu đứng riêng.
