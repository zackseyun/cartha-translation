  text: ὁ δὲ ἤρξατο ἀναθεματίζειν καὶ ὀμνύναι ὅτι Οὐκ οἶδα τὸν ἄνθρωπον τοῦτον ὃν λέγετε.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/071.yaml
  text: But he began to call down curses and to swear[a], “I do not know this man you are talking about.”
translation:
  language: vi
  text: 'Nhưng ông bắt đầu nguyền rủa[a] và thề: “Tôi không biết người này, người mà mọi người đang nói đến.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “kêu gọi lời nguyền”; có lẽ mang nghĩa “cầu lời nguyền xuống trên chính mình”. Tiếng Hy Lạp không nói rõ đối tượng của lời nguyền.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ
  choice: Nhưng ông
  rationale: δέ đánh dấu bước phát triển có sắc thái tương phản nhẹ khi lời chối bỏ leo thang; “Nhưng ông” tự nhiên trong mạch kể.
- source_word: ἤρξατο
  choice: bắt đầu
  rationale: Diễn đạt sát ý khởi đầu của hành động đi với hai động từ nguyên mẫu bổ nghĩa.
- source_word: ἀναθεματίζειν
  choice: viện đến những lời nguyền
  rationale: Động từ chỉ hành vi cầu viện hoặc gọi xuống lời nguyền, không chỉ là văng tục. Cách dịch này không xác định đối tượng của lời nguyền, vì bản Hy Lạp cũng không nói rõ.
- source_word: ὀμνύναι
  choice: thề
  rationale: Từ này chỉ việc thề hoặc lập lời thề; “thề” ngắn gọn, tự nhiên và giữ được tính trang trọng của lời cam đoan.
- source_word: ὅτι
  choice: 'rằng: “'
  rationale: ὅτι giới thiệu nội dung lời thề và chối bỏ. Dùng “rằng” kèm lời dẫn trực tiếp là tự nhiên trong tiếng Việt và làm rõ quan hệ cú pháp.
- source_word: Οὐκ οἶδα
  choice: Tôi không biết
  rationale: Giữ nghĩa thông thường và sự thẳng thừng của lời phủ nhận, không diễn giải thêm thành không quen biết hay không nhận ra.
- source_word: τὸν ἄνθρωπον τοῦτον
  choice: người ... đó
  rationale: Trong cấu trúc tiếng Việt, đặt “đó” sau mệnh đề quan hệ diễn đạt tự nhiên lực chỉ định của τοῦτον mà không thêm sắc thái khinh miệt.
- source_word: ὃν λέγετε
  choice: mà các ông đang nói đến
  rationale: Diễn đạt tự nhiên việc những người hiện diện đang nhắc đến người ấy. “Các ông” phù hợp với ngôi số nhiều nhưng không xác định giới tính của toàn nhóm một cách tuyệt đối.
theological_decisions:
- issue: Bản chất lời nguyền trong ἀναθεματίζειν
  choice: Diễn đạt việc viện đến những lời nguyền nhưng không nói Phê-rô nguyền rủa ai hay tự đặt mình dưới lời nguyền.
  alternative: “bắt đầu nguyền rủa” hoặc “bắt đầu cầu lời nguyền xuống trên chính mình”
  rationale: Trong bối cảnh lời thề, động từ có thể hàm ý tự nguyền nếu lời mình nói là sai; tuy nhiên, câu Hy Lạp không nêu đối tượng. Bản dịch chính giữ sự không xác định này, còn chú thích ghi nhận các cách hiểu khả dĩ.
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang nghiêm và dễ hiểu. “Viện đến những lời nguyền” hơi trang trọng nhưng cần thiết để phân biệt hành vi cầu viện lời nguyền với việc văng tục; chú thích bảo tồn phương án từ vựng và sự mơ hồ của nguyên văn.
