    issue: “viện đến những lời nguyền” không tự nhiên và có thể lệch sắc thái của ἀναθεματίζειν.
    rationale: Động từ này chỉ việc nguyền rủa hay kêu gọi lời nguyền, chứ không đơn thuần là ‘viện đến’ chúng. Cần một động từ trực tiếp hơn, đồng thời giữ chú thích về đối tượng không được nói rõ.
  - severity: low
    issue: “các ông” giới tính hóa ngôi số nhiều χωρίς cơ sở từ nguyên văn.
    rationale: λέγετε chỉ là ngôi thứ hai số nhiều; trong bối cảnh có nhiều người hiện diện, “mọi người” là lựa chọn trung tính và tự nhiên hơn.
