  source_fidelity: Bản nháp truyền đạt đúng trình tự leo thang của lời chối bỏ và giữ được sự không xác định về đối tượng của ἀναθεματίζειν. Tuy nhiên, “viện đến những lời nguyền” không phải là cách diễn đạt tiếng Việt tự nhiên cho hành vi gọi/cầu lời nguyền; nó có thể gợi ý việc nại đến lời nguyền như một lý lẽ. “Nguyền rủa” sát hơn về mặt từ vựng, với chú thích bảo lưu khả năng tự nguyền.
  naturalness: Câu sửa dùng cách kể hiện đại, rõ ràng. “Người này, người mà mọi người đang nói đến” diễn đạt lực chỉ định của τοῦτον mà vẫn tự nhiên. “Mọi người” tránh việc “các ông” vô cớ xác định nhóm người nói là toàn nam.
  terminology: “Nguyền rủa và thề” phân biệt hai động từ ἀναθεματίζειν và ὀμνύναι. Chú thích nêu phương án “cầu lời nguyền xuống trên chính mình” chỉ như khả năng, không áp đặt đối tượng mà tiếng Hy Lạp không nêu.
  issues:
