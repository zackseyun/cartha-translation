- from: 'Nhưng ông bắt đầu viện đến những lời nguyền[a] và thề rằng: “Tôi không biết người mà các ông đang nói đến đó.”'
  to: 'Nhưng ông bắt đầu nguyền rủa[a] và thề: “Tôi không biết người này, người mà mọi người đang nói đến.”'
  rationale: Thay “viện đến những lời nguyền” bằng “nguyền rủa” để diễn đạt trực tiếp và tự nhiên hơn hành vi được ἀναθεματίζειν nêu ra. Chú thích duy trì các khả năng dịch và tính mơ hồ về đối tượng. Đổi đại từ số nhiều thành “mọi người” để không thêm thông tin về giới tính; sắp lại cụm chỉ định để phản ánh τοῦτον rõ hơn.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T09:00:17Z'
