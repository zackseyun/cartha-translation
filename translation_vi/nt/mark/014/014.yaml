source:
  edition: SBLGNT
  text: καὶ ὅπου ⸀ἐὰν εἰσέλθῃ εἴπατε τῷ οἰκοδεσπότῃ ὅτι Ὁ διδάσκαλος λέγει· Ποῦ ἐστιν τὸ κατάλυμά ⸀μου ὅπου τὸ πάσχα μετὰ τῶν μαθητῶν μου φάγω;
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/014.yaml
  text: And wherever he enters[a], say to the master of the house, ‘The Teacher says, “Where is my guest room where I may eat the Passover with my disciples?”’
translation:
  language: vi
  text: 'Người ấy vào đâu, hãy nói với chủ nhà: ‘Thầy nói: “Phòng dành cho tôi ở đâu, nơi tôi có thể ăn lễ Vượt Qua với các môn đồ của tôi?”’'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅπου ἐὰν εἰσέλθῃ
  choice: Người ấy vào nhà nào
  rationale: ὅπου + ἐάν với động từ giả định diễn tả nơi chốn không xác định. Trong ngữ cảnh người mang vò nước dẫn họ đến một căn nhà, cách nói này tự nhiên hơn trong tiếng Việt mà vẫn giữ nghĩa ‘bất cứ nơi nào người ấy bước vào’.
- source_word: εἴπατε
  choice: các con hãy nói
  rationale: Mệnh lệnh cách số nhiều hướng đến hai môn đồ; ‘hãy nói’ giữ sát cách dẫn vào lời trực tiếp.
- source_word: οἰκοδεσπότῃ
  choice: chủ nhà ấy
  rationale: Chỉ người có quyền quản lý căn nhà hoặc gia hộ; ‘chủ nhà’ là cách diễn đạt hiện đại, tự nhiên và không hàm ý vượt quá từ Hy Lạp.
- source_word: Ὁ διδάσκαλος
  choice: Thầy
  rationale: Trong lời xưng gọi về Chúa Giê-su, ‘Thầy’ là danh xưng tự nhiên trong tiếng Việt, truyền đạt đúng nghĩa người dạy và được viết hoa để biểu thị cách dùng như danh hiệu trong ngữ cảnh.
- source_word: κατάλυμά μου
  choice: phòng dành cho tôi
  rationale: κατάλυμα ở đây là chỗ trọ hay phòng dành cho khách trong một tư gia, không phải quán trọ thương mại. ‘Dành cho tôi’ truyền đạt đại từ sở hữu μου tự nhiên hơn ‘phòng khách của tôi’ trong tiếng Việt.
- source_word: τὸ πάσχα
  choice: lễ Vượt Qua
  rationale: πάσχα có thể chỉ kỳ lễ hoặc bữa ăn lễ; với động từ ‘ăn’, tiếng Việt ‘ăn lễ Vượt Qua’ diễn đạt tự nhiên mà không cần thêm từ không có trong nguyên văn.
- source_word: μετὰ τῶν μαθητῶν μου
  choice: với các môn đồ của tôi
  rationale: ‘Môn đồ’ giữ ý nghĩa những người theo học và gắn bó với Chúa Giê-su; đại từ sở hữu được thể hiện rõ.
- source_word: φάγω
  choice: để tôi ăn
  rationale: Động từ giả định trong mệnh đề chỉ nơi chốn được tìm kiếm có sắc thái mục đích; ‘để tôi ăn’ là cách diễn đạt tiếng Việt tự nhiên, không biến thành một lời khẳng định đơn thuần về tương lai.
theological_decisions:
- issue: Cách dịch danh xưng διδάσκαλος của Chúa Giê-su
  choice: Thầy
  alternative: Vị Giáo Sư
  rationale: ‘Thầy’ đúng nghĩa từ vựng và phù hợp cách xưng gọi tự nhiên trong tiếng Việt, không đưa thêm sắc thái quyền uy hay tước hiệu Kitô học mà nguyên văn không nêu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ cấu trúc lời nói lồng nhau bằng dấu ngoặc kép; dùng ‘các con’ để thể hiện lời Chúa Giê-su trực tiếp căn dặn hai môn đồ. Không đặt chú thích vì phương án chính ‘phòng dành cho tôi’ đã diễn đạt tự nhiên phạm vi nghĩa của κατάλυμα trong chính ngữ cảnh này.
