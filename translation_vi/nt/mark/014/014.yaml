review_pass:
  verdict: revise
  source_fidelity: Bản nháp truyền đạt đúng mệnh lệnh nói với chủ nhà, danh xưng διδάσκαλος, lễ Vượt Qua và các môn đồ. Tuy nhiên, «vào nhà nào» thu hẹp ὅπου ἐὰν εἰσέλθῃ (“vào đâu/bất cứ nơi nào người ấy vào”) bằng cách thêm rõ “nhà”; dù bối cảnh hàm ý một ngôi nhà, bản dịch có thể giữ sát hơn mà vẫn tự nhiên. Mệnh đề ὅπου ... φάγω được làm rõ là nơi có thể ăn, phù hợp sắc thái được tìm kiếm/có thể thực hiện của φάγω.
  naturalness: “Phòng dành cho tôi ở đâu, để tôi ăn” có thể hiểu được, nhưng liên kết “để” dễ khiến phòng được trình bày như phương tiện hay mục đích, thay vì mệnh đề xác định căn phòng nơi bữa ăn sẽ diễn ra. “nơi tôi có thể ăn” tự nhiên và phản ánh cấu trúc quan hệ tốt hơn. Bỏ “các con” cũng tránh một cách xưng hô thêm vào không được nêu trong tiếng Hy Lạp, trong khi mệnh lệnh số nhiều vẫn rõ theo ngữ cảnh.
  terminology: “Thầy,” “chủ nhà,” “lễ Vượt Qua,” và “các môn đồ” phù hợp ngữ cảnh và văn phong Kinh Thánh tiếng Việt hiện đại. “Phòng dành cho tôi” giữ đại từ μου mà không hiểu κατάλυμα là quán trọ. Cần chú thích ngắn để bảo toàn các khả năng từ vựng “chỗ trọ/phòng” và tránh khẳng định quá mức về loại phòng.
  issues:
  - severity: low
    issue: “Người ấy vào nhà nào” thêm danh từ “nhà” không có trực tiếp trong ὅπου ἐὰν εἰσέλθῃ.
    rationale: Ngữ cảnh cho thấy người ấy sẽ vào một nhà, nhưng nguyên văn chỉ nói “bất cứ nơi nào người ấy vào.” “Người ấy vào đâu” vừa tự nhiên vừa giữ độ khái quát của nguồn.
  - severity: medium
    issue: “để tôi ăn” chưa phản ánh rõ mệnh đề quan hệ chỉ nơi chốn trong ὅπου ... φάγω.
    rationale: Cấu trúc Hy Lạp hỏi về căn phòng là nơi Chúa Giê-su có thể ăn lễ Vượt Qua với các môn đồ. “nơi tôi có thể ăn” làm rõ quan hệ này mà không biến động từ thành lời khẳng định tương lai.
  revised_text: 'Người ấy vào đâu, hãy nói với chủ nhà: ‘Thầy nói: “Phòng dành cho tôi ở đâu, nơi tôi có thể ăn lễ Vượt Qua với các môn đồ của tôi?”’'
