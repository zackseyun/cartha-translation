revisions:
- from: 'Người ấy vào nhà nào, các con hãy nói với chủ nhà ấy: ‘Thầy phán: “Phòng dành cho tôi ở đâu, để tôi ăn lễ Vượt Qua với các môn đồ của tôi?”’'
  to: 'Người ấy vào đâu, hãy nói với chủ nhà: ‘Thầy nói: “Phòng dành cho tôi ở đâu, nơi tôi có thể ăn lễ Vượt Qua với các môn đồ của tôi?”’'
  rationale: Bản sửa giữ nguyên ý nghĩa, cấu trúc lời nói lồng nhau và các thuật ngữ chính của bản nháp, đồng thời không thêm giới hạn “nhà” vào mệnh đề nơi chốn và diễn đạt tự nhiên, sát nghĩa hơn mệnh đề chỉ nơi ăn lễ Vượt Qua. Chú thích cung cấp các nghĩa từ vựng khả dĩ của κατάλυμα mà không áp đặt một cách hiểu vượt quá văn cảnh.
