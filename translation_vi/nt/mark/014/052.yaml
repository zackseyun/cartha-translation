  yaml_path: translation/nt/mark/014/052.yaml
  text: But he left the linen cloth behind and fled naked[a][b].
translation:
  language: vi
  text: Nhưng anh ta bỏ lại tấm vải lanh[a], rồi trần truồng[b] chạy thoát.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Tấm vải lanh” (σινδόνα) cũng có thể dịch là “tấm vải trải bằng lanh” hoặc “y phục bằng vải lanh”.
    reason: lexical_alternative
  - marker: b
    text: Trong một số ngữ cảnh, “trần truồng” (γυμνός) có thể chỉ tình trạng mặc không đầy đủ; nhưng ở đây, nghĩa trực tiếp là anh chạy thoát sau khi bỏ lại tấm vải ấy.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Nhưng
  rationale: Liên từ δέ tạo nét tương phản nhẹ với việc người ta vừa túm lấy anh; “Nhưng” diễn đạt tự nhiên bước ngoặt trong câu chuyện.
- source_word: καταλιπὼν
  choice: bỏ lại
  rationale: Phân từ bất định quá khứ của καταλείπω chỉ việc để vật ấy lại phía sau khi chạy thoát; “bỏ lại” vừa gọn vừa đúng diễn tiến.
- source_word: σινδόνα
  choice: tấm vải lanh
  rationale: σινδών chỉ một tấm vải bằng lanh, có thể được dùng như khăn choàng hoặc y phục. Cách dịch này giữ nguyên chất liệu mà không xác định quá mức hình dạng hay công dụng.
- source_word: γυμνὸς
  choice: trần truồng
  rationale: Trong ngữ cảnh anh bỏ lại chính tấm vải đang quấn trên người, γυμνός tự nhiên nhất là không mặc gì; “trần truồng” truyền đạt rõ nghĩa trực tiếp này.
- source_word: ἔφυγεν
  choice: chạy thoát
  rationale: φεύγω diễn tả việc vội vã chạy khỏi nguy hiểm. “Chạy thoát” vừa thể hiện chuyển động khẩn cấp vừa phù hợp kết quả của hành động.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện hiện đại, rõ ràng và trang trọng vừa phải. “Anh ta” nối tự nhiên với người thanh niên ở câu trước; trật tự câu giữ sự liên tiếp của hai hành động bỏ lại tấm vải rồi chạy thoát.
