  to: Phi-e-rơ đi theo ngài từ xa, vào tận sân trong dinh của thượng tế. Ông ngồi cùng những người phục dịch và sưởi mình bên ánh lửa.[a]
  rationale: Bản sửa thay cách gọi quá đặc thù “các thuộc hạ” bằng “những người phục dịch” để giữ độ mở của ὑπηρέται, chỉnh cụm chỉ sân của thượng tế cho tự nhiên, và làm chú thích về πρὸς τὸ φῶς rõ ràng hơn. Các lựa chọn “từ xa,” “vào tận,” “thượng tế,” và “bên ánh lửa” vẫn giữ nguyên ý nghĩa và sắc thái của câu nguồn.
