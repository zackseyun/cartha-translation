  source_fidelity: 'Bản dịch giữ đúng mạch chính: Phi-e-rơ theo từ xa, vào trong sân của thượng tế, ngồi với nhóm người ở đó và sưởi ấm. “Vào tận” truyền đạt hợp lý lực nhấn của ἕως ἔσω εἰς. Tuy nhiên, “các thuộc hạ” thêm sắc thái lệ thuộc cá nhân không được xác định rõ bởi ὑπηρέται, vốn có thể chỉ người phục dịch hay nhân viên thừa hành.'
