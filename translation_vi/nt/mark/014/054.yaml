  text: καὶ ὁ Πέτρος ἀπὸ μακρόθεν ἠκολούθησεν αὐτῷ ἕως ἔσω εἰς τὴν αὐλὴν τοῦ ἀρχιερέως καὶ ἦν συγκαθήμενος μετὰ τῶν ὑπηρετῶν καὶ θερμαινόμενος πρὸς τὸ φῶς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/054.yaml
  text: And Peter followed him from a distance[a], as far as inside the courtyard of the high priest. He was sitting with the officers and warming himself by the fire.
translation:
  language: vi
  text: Phi-e-rơ đi theo ngài từ xa, vào tận sân trong dinh của thượng tế. Ông ngồi cùng những người phục dịch và sưởi mình bên ánh lửa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “bên ánh sáng.” Cụm Hy Lạp có thể hiểu là “về phía/bên ánh sáng”; trong văn cảnh, có lẽ đó là ánh sáng từ đống lửa trong sân.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπὸ μακρόθεν
  choice: từ xa
  rationale: Cách nói tự nhiên trong tiếng Việt, giữ nguyên ý nghĩa không gian và sự dè dặt trong diễn tiến câu chuyện.
- source_word: ἠκολούθησεν αὐτῷ
  choice: đi theo ngài
  rationale: Thể aorist được diễn đạt tự nhiên bằng hành động kể chuyện; đại từ “ngài” chỉ Chúa Giê-su theo văn mạch mà không cần lặp tên.
- source_word: ἕως ἔσω εἰς
  choice: vào tận
  rationale: Diễn đạt gọn và tự nhiên ý nhấn mạnh rằng Phi-e-rơ đã đi vào bên trong khu vực sân, chứ không chỉ đến cổng.
- source_word: τὴν αὐλὴν τοῦ ἀρχιερέως
  choice: sân dinh thượng tế
  rationale: Trong bối cảnh này, αὐλή là sân kín thuộc tư dinh của thượng tế; “sân dinh” tránh hiểu là sân đền thờ.
- source_word: ἦν συγκαθήμενος
  choice: ngồi cùng
  rationale: Diễn tả trạng thái đang tiếp diễn trong bối cảnh; yếu tố σύν được giữ bằng “cùng”.
- source_word: μετὰ τῶν ὑπηρετῶν
  choice: các thuộc hạ
  rationale: ὑπηρέται chỉ những người phục vụ hoặc thi hành phận sự cho giới chức trong bối cảnh bắt giữ và xét hỏi; “thuộc hạ” rộng hơn “lính canh” và không khiến họ thành nô lệ gia đình.
- source_word: θερμαινόμενος
  choice: sưởi mình
  rationale: Cách diễn đạt ngắn gọn, trang trọng và tự nhiên cho hành động tự sưởi ấm.
- source_word: πρὸς τὸ φῶς
  choice: bên ánh lửa
  rationale: φῶς theo nghĩa đen là “ánh sáng”; trong bối cảnh sưởi ấm, đó là ánh sáng từ lửa. “Ánh lửa” giữ được từ ngữ nguồn đồng thời làm rõ cảnh tượng.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Câu được chia làm hai để cảnh kể rõ ràng; “vào tận” giữ lực của ἕως ἔσω εἰς. Dấu chú thích đặt sau “ánh lửa” vì chú thích giải thích πρὸς τὸ φῶς.
