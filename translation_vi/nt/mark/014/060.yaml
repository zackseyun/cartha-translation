source:
  edition: SBLGNT
  text: καὶ ἀναστὰς ὁ ἀρχιερεὺς εἰς μέσον ἐπηρώτησεν τὸν Ἰησοῦν λέγων· Οὐκ ἀποκρίνῃ οὐδέν; τί οὗτοί σου καταμαρτυροῦσιν;
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/060.yaml
  text: And the high priest stood up in the middle and questioned Jesus[a], saying[c][b], “Do you answer nothing? What are these men testifying against you?”
translation:
  language: vi
  text: 'Thượng tế đứng dậy, tiến ra giữa[a] và chất vấn Đức Giê-su: “Ông không đáp lại gì sao?[b] Những người này đang làm chứng chống lại ông về điều gì?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “đứng vào giữa.” Cụm từ Hy Lạp diễn tả thượng tế chiếm một vị trí ở giữa những người đang hiện diện.'
    reason: lexical_alternative
  - marker: b
    text: 'Dịch sát: “Ông không trả lời gì ư?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστὰς
  choice: đứng dậy
  rationale: Diễn tả hành động thể lý đứng lên, giữ đúng chuyển động của câu chuyện và tự nhiên trong tiếng Việt hiện đại.
- source_word: ὁ ἀρχιερεὺς
  choice: thượng tế
  rationale: Thuật ngữ quen thuộc chỉ vị thượng tế đang chủ trì cuộc xét xử, không phải các trưởng tế nói chung.
- source_word: εἰς μέσον
  choice: ở giữa mọi người
  rationale: Truyền đạt việc thượng tế chiếm vị trí trung tâm trước những người đang nhóm họp; cách diễn đạt này tự nhiên hơn lối dịch sát cứng nhắc.
- source_word: ἐπηρώτησεν
  choice: chất vấn
  rationale: Động từ có thể là hỏi hoặc tra hỏi; “chất vấn” phù hợp bối cảnh xét xử mà không đẩy sắc thái mạnh đến mức “thẩm vấn”.
- source_word: ἀποκρίνῃ οὐδέν
  choice: không đáp lại gì sao?
  rationale: Giữ nguyên dạng câu hỏi thách thức và ý phủ định nhấn mạnh của tiếng Hy Lạp, đồng thời tự nhiên trong tiếng Việt.
- source_word: οὗτοί
  choice: những người này
  rationale: Đại từ chỉ định số nhiều nói đến các nhân chứng hiện diện; tiếng Việt không bắt buộc đánh dấu giống ngữ pháp.
- source_word: καταμαρτυροῦσιν
  choice: đang làm chứng chống lại ông
  rationale: Giữ sắc thái pháp lý của việc đưa lời chứng bất lợi và thể hiện hành động đang diễn ra của thì hiện tại.
theological_decisions:
- issue: Đối tượng được chỉ bằng οὗτοί
  choice: những người này
  alternative: những người đàn ông này
  rationale: Dạng Hy Lạp là giống đực số nhiều và chỉ các nhân chứng cụ thể, nhưng tiếng Việt thường dùng “những người này” khi giới tính không phải trọng tâm; cách dịch này không biến đặc điểm ngữ pháp thành một sự nhấn mạnh không có trong ngữ cảnh.
- issue: Quan hệ của τί với lời chứng chống lại Đức Giê-su
  choice: Những người này đang làm chứng chống lại ông về điều gì?
  alternative: Những người này làm chứng điều gì chống lại ông?
  rationale: Cách chọn giữ τί như câu hỏi về nội dung lời chứng, không diễn giải lời chứng thành một cáo buộc đã được xác lập.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại. Dùng “Đức Giê-su” theo lối gọi kính trọng phổ biến; “ông” trong lời thượng tế phản ánh cách xưng hô trực tiếp, không tự thêm sắc thái tôn kính. “Chất vấn” và “làm chứng chống lại” duy trì bối cảnh pháp lý mà không diễn giải quá mức.
