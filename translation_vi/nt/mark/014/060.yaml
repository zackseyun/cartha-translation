  to: 'Thượng tế đứng dậy, tiến ra giữa[a] và chất vấn Đức Giê-su: “Ông không đáp lại gì sao?[b] Những người này đang làm chứng chống lại ông về điều gì?”'
  rationale: Chỉnh “ở giữa mọi người” thành “tiến ra giữa” để giữ sắc thái hướng chuyển động của εἰς μέσον mà không thêm rõ “hội đồng” hay “mọi người” vào bản văn chính. Các phần còn lại trung thành với câu Hy Lạp và dùng tiếng Việt hiện đại tự nhiên.
  reviewer_model: gpt-5.6-terra
