  rationale: 'Chỉ sửa lối diễn đạt “đáng phải chết” thành “đáng chết” để câu tiếng Việt tự nhiên hơn. Điều này vẫn giữ nguyên ý nghĩa tư pháp của câu Hy Lạp: mọi người đều phán quyết rằng người ấy thuộc diện đáng/chịu chết. Chú thích a được chỉnh nhẹ để cách dịch sát không thêm đại từ chỉ định “điều đó” không có trong nguyên văn.'
