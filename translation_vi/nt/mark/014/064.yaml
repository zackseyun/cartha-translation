  text: ἠκούσατε τῆς βλασφημίας· τί ὑμῖν φαίνεται; οἱ δὲ πάντες κατέκριναν αὐτὸν ⸂ἔνοχον εἶναι⸃ θανάτου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/064.yaml
  text: You have heard the blasphemy[b][a]. What does it seem to you? And they all condemned him as deserving death.
translation:
  language: vi
  text: “Các ông đã nghe lời phạm thượng rồi. Các ông nghĩ sao?”[a] Tất cả họ đều kết án người là đáng chết.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát hơn: “Theo các ông, thế nào?”; cũng có thể hiểu là: “Phán quyết của các ông là gì?”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “mắc tội đáng chết,” “phải chịu án tử hình,” hoặc “đáng tội chết.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠκούσατε
  choice: các ông đã nghe ... rồi
  rationale: Thì aorist chỉ điều họ vừa nghe; cấu trúc “đã ... rồi” diễn đạt tự nhiên tính vừa hoàn tất trong tiếng Việt.
- source_word: τῆς βλασφημίας
  choice: lời phạm thượng
  rationale: Giữ nguyên sức nặng pháp lý-tôn giáo của βλασφημία, đồng thời “lời” cho thấy đây là phát ngôn vừa được nghe.
- source_word: τί ὑμῖν φαίνεται
  choice: Các ông nghĩ sao?
  rationale: Đây là cách diễn đạt tự nhiên trong tiếng Việt cho câu hỏi xin ý kiến hay phán quyết; chú thích giữ cách dịch sát cấu trúc Hy Lạp hơn.
- source_word: οἱ δὲ πάντες
  choice: Tất cả họ đều
  rationale: Giữ sự nhấn mạnh vào tính nhất trí của πάντες.
- source_word: κατέκριναν
  choice: kết án
  rationale: Động từ mang nghĩa tư pháp là tuyên có tội hoặc kết án; “kết án” rõ ràng và phù hợp bối cảnh xét xử.
- source_word: ἔνοχον εἶναι θανάτου
  choice: là đáng phải chết
  rationale: Diễn đạt rõ việc bị xem là đáng hoặc phải chịu cái chết, nhưng không quyết định quá mức giữa các sắc thái “đáng chết,” “mắc tội đáng chết” và “phải chịu án tử hình.”
theological_decisions:
- issue: Lời buộc tội βλασφημία trong bối cảnh xét xử
  choice: lời phạm thượng
  alternative: lời lộng ngôn
  rationale: Câu văn thuật lại lời buộc tội của hội đồng chứ không khẳng định rằng lời buộc tội ấy là chính đáng. “Phạm thượng” giữ sức nặng tôn giáo và pháp lý mà không thêm phán xét của người kể.
- issue: Sắc thái tư pháp của ἔνοχον εἶναι θανάτου
  choice: đáng phải chết
  alternative: phải chịu án tử hình
  rationale: Bản dịch chính giữ được độ căng giữa sự đáng tội và tình trạng phải chịu hình phạt, thay vì thu hẹp cụm từ chỉ còn một công thức pháp lý cụ thể.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và dễ hiểu. “Các ông” phù hợp lời vị thượng tế nói với hội đồng; “người” tránh đưa thêm một tước hiệu hoặc sắc thái tôn kính không được biểu thị riêng trong đại từ Hy Lạp.
