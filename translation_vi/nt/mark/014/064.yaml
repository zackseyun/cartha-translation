  source_fidelity: 'Bản dịch phản ánh đúng trình tự và các thành tố chính của tiếng Hy Lạp: lời tuyên bố rằng họ vừa nghe lời phạm thượng, câu hỏi đòi ý kiến/phán quyết, sự nhất trí của mọi người, và phán quyết rằng người ấy đáng chết. Tuy nhiên, cụm “kết án người là đáng phải chết” chưa thật tự nhiên trong tiếng Việt hiện đại.'
