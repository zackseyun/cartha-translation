reference: Mark 14:62
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς εἶπεν· Ἐγώ εἰμι, καὶ ὄψεσθε τὸν υἱὸν τοῦ ἀνθρώπου ἐκ δεξιῶν καθήμενον τῆς δυνάμεως καὶ ἐρχόμενον μετὰ τῶν νεφελῶν τοῦ οὐρανοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/062.yaml
  text: And Jesus said[a], “I am[c][b], and you will see the Son of Man seated at the right hand of Power and coming with the clouds of heaven.”
translation:
  language: vi
  text: 'Đức Giê-su nói: “Ta là[a]. Các ông sẽ thấy Con Người ngồi bên hữu Đấng Quyền Năng[b] và đến với những đám mây trên trời[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể hiểu: “Ta chính là Đấng ấy.” Tiếng Hy Lạp chỉ viết: “Ta là.”'
    reason: alternative_reading
  - marker: b
    text: “Đấng Quyền Năng” là cách nói kính cẩn để chỉ Đức Chúa Trời; nguyên văn dùng danh từ “Quyền Năng.”
    reason: cultural_note
  - marker: c
    text: Lời này gợi lại Thi Thiên 110:1 và Đa-ni-ên 7:13.
    reason: cross_reference
lexical_decisions:
- source_word: Ἐγώ εἰμι
  choice: Ta là
  rationale: Cách dịch này giữ nguyên câu khẳng định ngắn, nhấn mạnh và không có vị ngữ tường minh trong tiếng Hy Lạp. Trong ngữ cảnh, đây là lời đáp trực tiếp cho câu hỏi của thượng tế, đồng thời không ép câu văn vào một cách giải thích thần học duy nhất.
- source_word: ὄψεσθε
  choice: các ông sẽ thấy
  rationale: Diễn đạt trực tiếp thì tương lai của ὁράω và phù hợp với việc Đức Giê-su nói với thượng tế cùng những người đang xét xử ngài.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: Con Người
  rationale: Giữ danh xưng quen thuộc Đức Giê-su dùng về mình và âm hưởng của Đa-ni-ên 7, thay vì diễn giải thành một cách gọi thuần túy về nhân tính.
- source_word: ἐκ δεξιῶν
  choice: bên hữu
  rationale: Thành ngữ trang trọng, quen thuộc trong văn phong Kinh Thánh tiếng Việt, chỉ vị trí danh dự và thẩm quyền cao nhất.
- source_word: τῆς δυνάμεως
  choice: Đấng Quyền Năng
  rationale: Trong ngữ cảnh này, danh từ trừu tượng “quyền năng” được dùng như cách nói kính cẩn để chỉ Đức Chúa Trời. Thêm “Đấng” giúp câu tiếng Việt tự nhiên và cho thấy đây là một danh xưng chỉ ngôi vị, trong khi chú thích vẫn giải thích hình thức nói tránh của nguyên văn.
- source_word: καθήμενον
  choice: ngồi
  rationale: Phản ánh trực tiếp phân từ Hy Lạp; trong cụm “ngồi bên hữu”, từ này cũng hàm ý địa vị được tôn cao và trị vì.
- source_word: ἐρχόμενον
  choice: đến
  rationale: Giữ nghĩa cơ bản và âm hưởng cánh chung của động từ, không thêm sắc thái không có trong nguyên văn.
- source_word: μετὰ τῶν νεφελῶν τοῦ οὐρανοῦ
  choice: cùng mây trời
  rationale: Cách diễn đạt cô đọng, trang trọng, gần với nguyên văn và bảo tồn âm hưởng khải huyền của Đa-ni-ên 7:13.
- source_word: καὶ ... καὶ
  choice: và ... và
  rationale: 'Giữ sự liên kết tích lũy giữa hai hình ảnh: Con Người ngồi bên hữu và Con Người đến cùng mây trời.'
theological_decisions:
- issue: Nên dịch Ἐγώ εἰμι như một lời khẳng định đơn giản hay mở rộng thành lời nhận mình là Đấng được hỏi
  choice: Dùng “Ta là” trong chính văn
  alternative: “Ta chính là Đấng ấy”
  rationale: Nguyên văn không có vị ngữ tường minh. “Ta là” vừa trả lời câu hỏi trước đó, vừa giữ sự cô đọng và khả năng có âm hưởng sâu hơn mà không áp đặt cách hiểu.
- issue: Mức độ tường minh khi dịch τῆς δυνάμεως
  choice: Dùng danh xưng “Đấng Quyền Năng” thay vì thay thẳng bằng “Đức Chúa Trời”
  alternative: “Đức Chúa Trời”; hoặc giữ sát hình thức “Quyền Năng”
  rationale: Nguyên văn dùng một cách nói kính cẩn, gián tiếp để chỉ Đức Chúa Trời. “Đấng Quyền Năng” bảo tồn tính chất danh xưng ấy và vẫn tự nhiên trong tiếng Việt; chú thích làm rõ cách nói của nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Ta” phù hợp với lời tự xưng trang nghiêm của Đức Giê-su trong bối cảnh xét xử; “các ông” truyền đạt ngôi thứ hai số nhiều mà không dùng lối xưng hô cổ. Các cụm “Con Người”, “bên hữu” và “mây trời” giữ âm hưởng Kinh Thánh và mối liên hệ với các bản văn Cựu Ước.
