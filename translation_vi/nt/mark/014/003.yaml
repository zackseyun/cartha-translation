revisions:
- from: Khi Ngài ở Bê-tha-ni, đang ngả mình dùng bữa tại nhà Si-môn, người phong hủi, một phụ nữ đến, mang theo một bình thạch cao tuyết hoa đựng dầu thơm cam tùng nguyên chất[a], rất đắt tiền. Cô đập vỡ bình rồi đổ dầu thơm lên đầu Ngài.
  to: Đang khi Ngài ở Bê-tha-ni, ngả mình dùng bữa tại nhà Si-môn người phong hủi, một phụ nữ đến, mang theo một bình bằng đá tuyết hoa đựng dầu thơm cam tùng nguyên chất[a], rất đắt tiền. Cô đập vỡ bình rồi đổ dầu thơm lên đầu Ngài.
  rationale: Bản sửa chỉ cải thiện độ tự nhiên và sự rõ ràng của tiếng Việt, đồng thời giữ nguyên mọi thông tin của nguyên văn và sự bất định đã được chú thích. Không thêm diễn giải về tình trạng bệnh của Si-môn hay về nghĩa quyết định của πιστικῆς.
