id: MRK.14.3
reference: Mark 14:3
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Καὶ ὄντος αὐτοῦ ἐν Βηθανίᾳ ἐν τῇ οἰκίᾳ Σίμωνος τοῦ λεπροῦ κατακειμένου αὐτοῦ ἦλθεν γυνὴ ἔχουσα ἀλάβαστρον μύρου νάρδου πιστικῆς πολυτελοῦς· ⸀συντρίψασα ⸀τὴν ἀλάβαστρον κατέχεεν ⸀αὐτοῦ τῆς κεφαλῆς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/003.yaml
  text: And while he was in Bethany[a], reclining at the house of Simon the leper, a woman came with an alabaster jar of very expensive pure nard perfume; she broke the jar and poured it on his head.
translation:
  language: vi
  text: Đang khi Ngài ở Bê-tha-ni, ngả mình dùng bữa tại nhà Si-môn người phong hủi, một phụ nữ đến, mang theo một bình bằng đá tuyết hoa đựng dầu thơm cam tùng nguyên chất[a], rất đắt tiền. Cô đập vỡ bình rồi đổ dầu thơm lên đầu Ngài.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “cam tùng chính hiệu”; nghĩa của tính từ Hy Lạp πιστικός còn đang được tranh luận.
    reason: Bảo lưu sự không chắc chắn về từ vựng và một cách hiểu chính đáng khác.
lexical_decisions:
- source_word: ὄντος αὐτοῦ ... κατακειμένου αὐτοῦ
  choice: Khi Ngài ở ... đang ngả mình dùng bữa
  rationale: Cấu trúc sở hữu cách tuyệt đối dựng bối cảnh đang diễn ra. “Ngả mình dùng bữa” diễn đạt tư thế ăn uống thời ấy tự nhiên hơn cách dịch đơn thuần là “ngồi ăn”, đồng thời không bỏ chi tiết κατακειμένου.
- source_word: Βηθανίᾳ
  choice: Bê-tha-ni
  rationale: Dùng dạng phiên âm địa danh quen thuộc trong tiếng Việt.
- source_word: οἰκίᾳ Σίμωνος τοῦ λεπροῦ
  choice: nhà Si-môn, người phong hủi
  rationale: Giữ nguyên cách văn bản gọi Si-môn, không tự ý thêm “trước kia” dù có thể suy đoán ông đã khỏi bệnh.
- source_word: γυνὴ
  choice: một phụ nữ
  rationale: Người phụ nữ không được xác định danh tính trong câu này; “một phụ nữ” là cách diễn đạt hiện đại, trung tính.
- source_word: ἀλάβαστρον
  choice: một bình thạch cao tuyết hoa
  rationale: Danh từ chỉ loại bình thường dùng để đựng hương liệu quý. Cách dịch này giữ chi tiết về loại bình mà không biến nó thành một loại đá quý.
- source_word: μύρου νάρδου
  choice: dầu thơm cam tùng
  rationale: μύρον là dầu hoặc hương liệu thơm; νάρδος chỉ cam tùng, nguồn hương liệu cụ thể. “Dầu thơm cam tùng” rõ nghĩa và tự nhiên trong tiếng Việt.
- source_word: πιστικῆς
  choice: nguyên chất[a]
  rationale: Từ này có nghĩa không chắc chắn; “nguyên chất” phù hợp với cách hiểu phổ biến là tinh ròng hoặc không pha tạp. Chú thích bảo lưu cách hiểu “chính hiệu” và nêu rõ sự tranh luận.
- source_word: πολυτελοῦς
  choice: rất đắt tiền
  rationale: Diễn đạt trực tiếp giá trị kinh tế rất cao của dầu thơm, điều liên quan đến phản ứng trong các câu kế tiếp.
- source_word: συντρίψασα τὴν ἀλάβαστρον
  choice: Cô đập vỡ bình
  rationale: Phân từ chỉ hành động xảy ra trước khi đổ dầu. “Đập vỡ” giữ sắc thái thực sự làm vỡ bình mà không cường điệu thành nghiền nát.
- source_word: κατέχεεν αὐτοῦ τῆς κεφαλῆς
  choice: đổ dầu thơm lên đầu Ngài
  rationale: Diễn đạt rõ vật được đổ và nơi dầu được đổ xuống; việc lặp “dầu thơm” tự nhiên và tránh đại từ mơ hồ trong tiếng Việt.
theological_decisions:
- issue: Có nên đổi cách gọi “Si-môn, người phong hủi” thành “Si-môn, người từng mắc bệnh phong hủi” hay không
  choice: Giữ “Si-môn, người phong hủi”
  alternative: Si-môn, người trước kia mắc bệnh phong hủi
  rationale: Nguyên văn chỉ dùng danh xưng “người phong hủi” và không nói ông đã khỏi bệnh. Thêm ý “trước kia” sẽ giải quyết một vấn đề lịch sử bằng suy luận không có trong câu.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. “Ngài” duy trì tham chiếu kính trọng đến Đức Chúa Jêsus từ văn cảnh mà không tự ý thêm danh xưng vào câu. Dấu chú thích [a] được đặt ngay sau cụm từ mà chú thích giải thích.
