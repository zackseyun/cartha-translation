  text: ἠδύνατο γὰρ τοῦτο ⸂τὸ μύρον⸃ πραθῆναι ἐπάνω ⸂δηναρίων τριακοσίων⸃ καὶ δοθῆναι τοῖς πτωχοῖς· καὶ ἐνεβριμῶντο αὐτῇ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/005.yaml
  text: For this perfume could have been sold for more than three hundred denarii and given to the poor.” And they scolded her[a][b].
translation:
  language: vi
  text: Vì dầu thơm này có thể bán được hơn ba trăm đê-na-ri và đem số tiền đó cho người nghèo.” Và họ gay gắt trách cô[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Dầu thơm” cũng có thể dịch là “thuốc mỡ thơm” hoặc “dầu có hương thơm.”
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “họ nghiêm khắc quở trách cô.” Động từ Hy Lạp diễn tả sự bất bình mạnh hoặc lời khiển trách gay gắt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μύρον
  choice: dầu thơm
  rationale: Chỉ dầu hoặc thuốc thơm có hương; “dầu thơm” tự nhiên trong tiếng Việt, phù hợp với vật chất được đổ ra trong ngữ cảnh và không thu hẹp nghĩa thành nước hoa hiện đại.
- source_word: πραθῆναι
  choice: bán được
  rationale: Động từ nguyên mẫu thụ động đi với ἠδύνατο diễn tả một khả năng đã không được thực hiện; cấu trúc “có thể bán được” tự nhiên trong tiếng Việt.
- source_word: ἐπάνω δηναρίων τριακοσίων
  choice: hơn ba trăm đê-na-ri
  rationale: ἐπάνω với sở hữu cách chỉ số tiền vượt quá mức nêu ra; giữ đơn vị tiền cổ thay vì quy đổi sang tiền hiện đại.
- source_word: δοθῆναι τοῖς πτωχοῖς
  choice: đem cho người nghèo
  rationale: Diễn đạt ngắn gọn, tự nhiên, và giữ ý trao số tiền thu được cho những người nghèo.
- source_word: ἐνεβριμῶντο αὐτῇ
  choice: họ nặng lời trách cô
  rationale: Động từ diễn tả sự bất bình mạnh được bộc lộ bằng lời quở trách; “nặng lời trách” giữ được cường độ và lực hướng trực tiếp vào người phụ nữ.
- source_word: γὰρ
  choice: Vì
  rationale: Nối câu này với lời phàn nàn trước đó bằng quan hệ giải thích hoặc nêu lý do.
- source_word: ἠδύνατο
  choice: có thể
  rationale: Trong ngữ cảnh, thì chưa hoàn thành diễn tả khả năng không thành hiện thực; tiếng Việt thể hiện tự nhiên bằng “có thể” kết hợp với mạch quá khứ.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “đê-na-ri” để bảo tồn đơn vị tiền tệ lịch sử; dùng “cô” cho đại từ giống cái số ít, tự nhiên hơn “nàng” trong tiếng Việt hiện đại.
