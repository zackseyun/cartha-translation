  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἀνακειμένων αὐτῶν καὶ ἐσθιόντων ⸂ὁ Ἰησοῦς εἶπεν⸃· Ἀμὴν λέγω ὑμῖν ὅτι εἷς ἐξ ὑμῶν παραδώσει με ὁ ἐσθίων μετ’ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/018.yaml
  text: And while they were reclining and eating[a], Jesus said, “Truly I tell you[c][b], one of you will betray me—one who is eating with me.”
translation:
  language: vi
  text: 'Khi họ đang ngả người dùng bữa[a], Đức Giê-su nói: “Quả thật, tôi nói với anh em[b]: một người trong anh em sẽ phản bội tôi[c]—người đang ăn với tôi.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ngả người là tư thế thường dùng khi dự một bữa ăn trang trọng vào thời ấy.
    reason: cultural_note
  - marker: b
    text: 'Hay dịch sát hơn: “A-men, tôi nói với anh em.”'
    reason: lexical_alternative
  - marker: c
    text: 'Hay: “sẽ giao nộp tôi.” Động từ Hy Lạp có thể có nghĩa là giao, nộp hoặc phản bội; tại đây, nó nói đến việc một người đồng hành với Đức Giê-su giao nộp ngài một cách bội tín.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνακειμένων
  choice: đang ngả mình dùng bữa
  rationale: Phân từ này chỉ tư thế ngả người khi dự một bữa ăn theo phong tục thời ấy. Cách dịch này giữ được bối cảnh lịch sử mà vẫn tương đối tự nhiên trong tiếng Việt; chú thích giải thích thêm phong tục.
- source_word: ἐσθιόντων / ἐσθίων
  choice: dùng bữa / đang ăn
  rationale: Động từ có nghĩa cơ bản là “ăn”. Ở vế đầu, “dùng bữa” phối hợp tự nhiên với tư thế ngả mình; ở vế cuối, “người đang ăn cùng tôi” phản ánh trực tiếp phân từ có mạo từ ὁ ἐσθίων.
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: Quả thật, tôi nói với anh em
  rationale: Đây là công thức long trọng mở đầu lời tuyên bố của Đức Giê-su. “Quả thật” truyền đạt lực xác quyết của Ἀμήν bằng tiếng Việt hiện đại; cách dịch sát chữ hơn được ghi ở chú thích.
- source_word: εἷς ἐξ ὑμῶν
  choice: một người trong anh em
  rationale: 'Cách diễn đạt tự nhiên, giữ rõ ý phân bộ: người phản bội là một thành viên trong chính nhóm đang hiện diện.'
- source_word: παραδώσει
  choice: sẽ phản bội tôi
  rationale: παραδίδωμι có nghĩa cơ bản là giao hoặc nộp một người, nhưng trong ngữ cảnh một người đồng bàn hành động chống lại Đức Giê-su, “phản bội” truyền đạt rõ tính bội tín. Nghĩa sát hơn được giữ trong chú thích.
- source_word: μετ’ ἐμοῦ
  choice: cùng tôi
  rationale: Diễn đạt tự nhiên và chính xác ý đồng hành trong việc ăn chung.
theological_decisions:
- issue: Cách dịch παραδώσει trong lời báo trước cuộc thương khó
  choice: sẽ phản bội tôi
  alternative: sẽ giao nộp tôi
  rationale: Động từ Hy Lạp tự nó không phải lúc nào cũng có nghĩa “phản bội”, nhưng ở đây chủ thể là một người thân cận đang cùng ăn với Đức Giê-su. Bản dịch chính nêu bật sự bội tín trong ngữ cảnh, còn chú thích bảo tồn nghĩa từ vựng rộng và sát chữ hơn.
translation_notes:
  register: Dùng tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. “Đức Giê-su” phù hợp văn phong Kinh Thánh tiếng Việt; cặp đại từ “tôi—anh em” tránh áp đặt sắc thái phẩm trật không được biểu thị rõ trong câu Hy Lạp. Dấu gạch ngang giữ quan hệ giải thích nhưng không loại bỏ khả năng hiểu cụm cuối như một nét nhận diện nhấn mạnh.
