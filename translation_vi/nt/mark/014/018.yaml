  source_fidelity: 'Bản dịch truyền đạt đúng các thành tố chính của câu Hy Lạp: bối cảnh đang dùng bữa theo tư thế ngả người, công thức khẳng định long trọng, một người trong nhóm sẽ phản bội Đức Giê-su, và người ấy đang ăn với ngài. “Phản bội” phù hợp ngữ cảnh của παραδώσει, với nghĩa sát hơn được bảo lưu trong chú thích.'
  naturalness: Cụm “đang ngả mình dùng bữa” có thể hiểu được nhưng không thật tự nhiên trong tiếng Việt hiện đại. “Đang ngả người dùng bữa” diễn tả tư thế dự tiệc cổ và trôi chảy hơn. “Ăn với tôi” cũng trực tiếp và tự nhiên hơn “ăn cùng tôi” trong mệnh đề nhận diện cuối câu.
  terminology: “Đức Giê-su,” “Quả thật,” “anh em,” và “phản bội” phù hợp văn phong Kinh Thánh tiếng Việt hiện đại. Chú thích về “giao nộp” minh bạch hóa phạm vi nghĩa của παραδίδωμι mà không áp đặt diễn giải giáo phái.
