  text: Καὶ ἔρχονται εἰς χωρίον οὗ τὸ ὄνομα Γεθσημανί, καὶ λέγει τοῖς μαθηταῖς αὐτοῦ· Καθίσατε ὧδε ἕως προσεύξωμαι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/032.yaml
  text: And they came to a place whose name was Gethsemane[a], and he says to his disciples, “Sit here until I pray.”
translation:
  language: vi
  text: 'Rồi họ đến một nơi tên là Ghết-sê-ma-nê.[a] Người nói với các môn đệ của mình: “Hãy ngồi đây cho đến khi tôi cầu nguyện xong.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Trong tiếng Hy Lạp, các động từ ở đây dùng dạng hiện tại kể chuyện, sát từng chữ là “họ đến… Người nói,” tạo cho lời kể sắc thái sống động.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχονται
  choice: họ đến
  rationale: Động từ hiện tại lịch sử của Hy Lạp được chuyển bằng cách diễn đạt không đánh dấu thì trong tiếng Việt; “họ đến” vừa tự nhiên trong văn kể chuyện vừa giữ được phần nào nét sống động của Mác.
- source_word: χωρίον
  choice: một nơi
  rationale: χωρίον có thể chỉ một địa điểm, mảnh đất hoặc khu đất; “một nơi” giữ độ khái quát của nguyên văn và tránh xác định quá mức.
- source_word: οὗ τὸ ὄνομα Γεθσημανί
  choice: tên là Ghết-sê-ma-nê
  rationale: Cách diễn đạt tự nhiên, sát nghĩa cấu trúc Hy Lạp; địa danh được phiên âm theo cách quen thuộc trong tiếng Việt.
- source_word: λέγει
  choice: Ngài nói
  rationale: Tiếng Việt không bắt buộc đánh dấu thì, nên “nói” có thể giữ sắc thái hiện tại lịch sử mà vẫn tự nhiên. “Ngài” xác định chủ thể từ văn cảnh và duy trì giọng văn trang trọng.
- source_word: μαθηταῖς
  choice: các môn đồ
  rationale: “Môn đồ” là từ tương đương quen thuộc và chính xác, bảo toàn quan hệ thầy–trò trong các sách Phúc Âm.
- source_word: Καθίσατε
  choice: Hãy ngồi
  rationale: Mệnh lệnh trực tiếp, ngắn gọn và tự nhiên, tương ứng với thể mệnh lệnh aorist.
- source_word: ὧδε
  choice: đây
  rationale: Tương đương trực tiếp và tự nhiên của trạng từ chỉ nơi chốn.
- source_word: ἕως προσεύξωμαι
  choice: cho đến khi tôi cầu nguyện xong
  rationale: ἕως cùng động từ aorist giả định chỉ giới hạn thời gian. Từ “xong” làm câu tiếng Việt tự nhiên và biểu đạt điểm kết thúc vốn hàm chứa trong kết cấu, dù nguyên văn không có một từ riêng nghĩa là “xong”.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng nhưng dễ hiểu. Câu tiếng Việt không thêm dấu hiệu quá khứ, nhờ đó tự nhiên giữ được sắc thái hiện tại lịch sử của nguyên văn. Đại từ “Ngài” dành cho Đức Giê-su theo lối trang trọng thông dụng, không nhằm đưa thêm một khẳng định thần học ngoài văn cảnh.
