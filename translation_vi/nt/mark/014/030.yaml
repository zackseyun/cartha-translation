source:
  edition: SBLGNT
  text: καὶ λέγει αὐτῷ ὁ Ἰησοῦς· Ἀμὴν λέγω σοι ὅτι σὺ σήμερον ⸂ταύτῃ τῇ νυκτὶ⸃ πρὶν ἢ δὶς ἀλέκτορα φωνῆσαι τρίς ⸂με ἀπαρνήσῃ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/030.yaml
  text: And Jesus says to him[a], “Truly I tell you, today, this very night, before a rooster crows twice, you will deny me three times.”
translation:
  language: vi
  text: 'Đức Giê-su nói với ông: “Thật, tôi bảo ông, hôm nay, chính đêm nay, trước khi gà gáy hai lần, ông sẽ chối tôi ba lần.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: nói
  rationale: Giữ thì hiện tại lịch sử của Mác để bảo tồn nét kể chuyện sống động của nguyên văn.
- source_word: Ἀμὴν λέγω σοι
  choice: Thật, tôi bảo ông
  rationale: Diễn đạt công thức khẳng định long trọng bằng tiếng Việt tự nhiên; “ông” phù hợp với lời trực tiếp nói với Phi-e-rơ.
- source_word: σήμερον ⸂ταύτῃ τῇ νυκτὶ⸃
  choice: hôm nay, chính đêm nay
  rationale: Giữ cả hai cụm thời gian và sắc thái nhấn mạnh của đại từ chỉ định, không gộp hoặc lược bỏ.
- source_word: πρὶν ἢ δὶς ἀλέκτορα φωνῆσαι
  choice: trước khi gà gáy hai lần
  rationale: Cách nói tự nhiên trong tiếng Việt, đồng thời giữ rõ chi tiết “hai lần” đặc trưng của câu.
- source_word: τρίς ⸂με ἀπαρνήσῃ⸃
  choice: ông sẽ chối tôi ba lần
  rationale: “Chối tôi” diễn đạt trực tiếp hành động phủ nhận mối liên hệ với Đức Giê-su; giữ đối ứng số lượng giữa hai lần gà gáy và ba lần chối.
theological_decisions:
- issue: Sự kết hợp σήμερον và ταύτῃ τῇ νυκτί
  choice: 'Giữ cả hai: “hôm nay, chính đêm nay”'
  alternative: Chỉ dịch “chính đêm nay”
  rationale: Nguyên văn có cả hai biểu thức, tạo sức nhấn mạnh về tính cận kề của lời báo trước.
- issue: Thì hiện tại lịch sử λέγει
  choice: “nói”
  alternative: “đã nói” hoặc “bảo” theo thì quá khứ kể chuyện
  rationale: Giữ đặc điểm văn phong kể chuyện của Mác mà vẫn tự nhiên trong tiếng Việt.
- issue: Nghĩa của ἀπαρνήσῃ
  choice: “chối tôi”
  alternative: “không nhận tôi” hoặc “từ bỏ tôi”
  rationale: “Chối tôi” đủ rộng để bảo tồn ý phủ nhận/không thừa nhận trong ngữ cảnh, không thu hẹp thành một cách giải thích thần học riêng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Giê-su” làm danh xưng tôn kính; cặp đại từ “tôi—ông” phản ánh lời nói trực tiếp với Phi-e-rơ mà không tạo sắc thái cổ.
