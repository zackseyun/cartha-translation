  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Làm chứng gian” giữ sắc thái pháp lý của động từ Hy Lạp; “Đức Giê-su” phù hợp văn phong Kinh Thánh tiếng Việt phổ thông.
