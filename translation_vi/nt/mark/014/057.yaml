  yaml_path: translation/nt/mark/014/057.yaml
  text: And some stood up and were giving false testimony against him[a], saying,
translation:
  language: vi
  text: 'Có một số người đứng dậy và làm chứng gian chống lại Đức Giê-su rằng:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καί
  choice: Có
  rationale: Trong tiếng Việt, không cần dịch riêng liên từ καί ở đầu câu; mở đầu bằng “Có” nối tiếp diễn tiến tự nhiên và tránh lối văn dịch cứng.
- source_word: τινες
  choice: mấy người
  rationale: Diễn đạt tự nhiên một nhóm người không xác định, giữ nguyên tính bất định của đại từ.
- source_word: ἀναστάντες
  choice: đứng dậy
  rationale: Phản ánh trực tiếp hành động đứng lên trong bối cảnh xét xử.
- source_word: ἐψευδομαρτύρουν
  choice: làm chứng gian
  rationale: Thuật ngữ pháp lý tự nhiên, rõ nghĩa trong tiếng Việt; thì chưa hoàn thành của Hy Lạp cho thấy hành động đang diễn ra trong cảnh thuật, nhưng tiếng Việt không nhất thiết phải thêm dấu hiệu thể vào đây.
- source_word: κατ’ αὐτοῦ
  choice: chống lại Đức Giê-su
  rationale: κατά với sở hữu cách mang nghĩa đối nghịch trong bối cảnh pháp lý; nêu lại tên giúp câu tiếng Việt rõ chủ thể hơn đại từ “Ngài” hoặc “ông ấy” khi đứng riêng.
- source_word: λέγοντες
  choice: 'rằng:'
  rationale: Dẫn trực tiếp vào nội dung lời khai ở câu kế tiếp; dấu hai chấm là cách trình bày tự nhiên trong tiếng Việt.
theological_decisions: []
