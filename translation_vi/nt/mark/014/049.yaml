  to: Ngày nào tôi cũng ở cùng các ông trong khuôn viên đền thờ[a] mà giảng dạy, nhưng các ông đã không bắt tôi[b]. Nhưng điều này xảy ra để Kinh Thánh được ứng nghiệm[c].
  rationale: Chỉ thay “ấy là” bằng “điều này xảy ra” để diễn đạt tự nhiên hơn mệnh đề ἀλλ’ ἵνα bị tỉnh lược. Bản sửa vẫn giữ quan hệ mục đích/kết quả, thể bị động của “được ứng nghiệm,” và không xác định thêm tác nhân của sự việc.
