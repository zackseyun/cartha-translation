id: MRK.14.49
reference: Mark 14:49
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καθ’ ἡμέραν ἤμην πρὸς ὑμᾶς ἐν τῷ ἱερῷ διδάσκων καὶ οὐκ ἐκρατήσατέ με· ἀλλ’ ἵνα πληρωθῶσιν αἱ γραφαί.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/049.yaml
  text: Day after day I was with you in the temple[a], teaching, and you did not seize me[c][b]. But let the Scriptures be fulfilled.
translation:
  language: vi
  text: Ngày nào tôi cũng ở cùng các ông trong khuôn viên đền thờ[a] mà giảng dạy, nhưng các ông đã không bắt tôi[b]. Nhưng điều này xảy ra để Kinh Thánh được ứng nghiệm[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Khuôn viên đền thờ” chỉ toàn bộ khu vực đền thờ, không riêng nơi thánh bên trong.
    reason: cultural_note
  - marker: b
    text: 'Cũng có thể dịch: “khống chế tôi” hoặc “bắt giữ tôi”.'
    reason: lexical_alternative
  - marker: c
    text: 'Nguyên văn lược ý: “Nhưng để Kinh Thánh được ứng nghiệm.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: καθ’ ἡμέραν
  choice: Ngày nào ... cũng
  rationale: Diễn đạt tự nhiên ý phân phối “mỗi ngày, ngày này qua ngày khác” trong tiếng Việt hiện đại.
- source_word: ἤμην πρὸς ὑμᾶς
  choice: tôi ... ở cùng các ông
  rationale: Giữ ý Chúa Giê-su hiện diện công khai với những người đang được ngài chất vấn; “các ông” phù hợp với đối tượng nam giới có thẩm quyền trong ngữ cảnh.
- source_word: ἐν τῷ ἱερῷ
  choice: trong khuôn viên đền thờ
  rationale: ἱερόν chỉ toàn bộ khu đền thờ, không riêng nơi thánh bên trong; cách dịch này làm rõ ngay trong chính văn.
- source_word: διδάσκων
  choice: mà giảng dạy
  rationale: Thể hiện phân từ hiện tại chỉ hoạt động diễn ra trong thời gian ngài ở tại đền thờ.
- source_word: οὐκ ἐκρατήσατέ με
  choice: các ông đã không bắt tôi
  rationale: Trong bối cảnh bắt giữ, κρατέω mang nghĩa bắt hoặc khống chế; “bắt” tự nhiên và không thu hẹp thành một thuật ngữ pháp lý kỹ thuật.
- source_word: ἀλλ’ ἵνα
  choice: Nhưng ấy là để
  rationale: Hy Lạp lược bỏ mệnh đề chính; “ấy là” bổ sung tối thiểu để câu tiếng Việt trọn nghĩa, đồng thời giữ quan hệ mục đích/kết quả của ἵνα.
- source_word: πληρωθῶσιν
  choice: được ứng nghiệm
  rationale: Giữ thể bị động và cách diễn đạt quen thuộc khi điều Kinh Thánh nói được thực hiện.
- source_word: αἱ γραφαί
  choice: Kinh Thánh
  rationale: Chỉ các sách thánh của Y-sơ-ra-ên; tiếng Việt thường dùng danh từ tập hợp số ít “Kinh Thánh” cho dạng số nhiều Hy Lạp.
theological_decisions:
- issue: Mệnh đề mục đích bị tỉnh lược và ý định thần thượng
  choice: Nhưng ấy là để Kinh Thánh được ứng nghiệm
  alternative: Nhưng hãy để Kinh Thánh được ứng nghiệm
  rationale: ἵνα với động từ giả định ở đây tự nhiên biểu thị mục đích hoặc kết quả, không phải mệnh lệnh “hãy để”. Bản dịch bổ sung tối thiểu “ấy là” cho chỗ tỉnh lược mà không xác định quá mức tác nhân hay cơ chế tiền định.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “các ông” vì lời nói hướng đến nhóm người đến bắt Chúa Giê-su; dùng “khuôn viên đền thờ” để phân biệt ἱερόν với nơi thánh bên trong. Mọi ký hiệu chú thích [a], [b], [c] đều có trong chính văn.
