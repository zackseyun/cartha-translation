  to: 'Khi họ đang ăn, Đức Giê-su lấy bánh, dâng lời chúc phước, bẻ ra, trao cho họ và nói: “Hãy nhận lấy; đây là thân thể Ta.”'
  rationale: Chỉ điều chỉnh cách diễn đạt εὐλογήσας cho tự nhiên và rõ nghĩa hơn trong tiếng Việt. Bản sửa vẫn giữ hệ từ trực tiếp trong “đây là thân thể Ta,” không thay bằng “tượng trưng cho” hoặc “có nghĩa là,” nên không áp đặt một cách giải thích về Tiệc Thánh.
