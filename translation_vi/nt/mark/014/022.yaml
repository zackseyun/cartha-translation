base_translation:
  language: en
  yaml_path: translation/nt/mark/014/022.yaml
  text: And as they were eating[a], he took bread, blessed it, broke it, and gave it to them, and said, “Take; this is my body.”
translation:
  language: vi
  text: 'Khi họ đang ăn, Đức Giê-su lấy bánh, dâng lời chúc phước, bẻ ra, trao cho họ và nói: “Hãy nhận lấy; đây là thân thể Ta.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐσθιόντων αὐτῶν
  choice: Khi họ đang ăn
  rationale: Cấu trúc sở hữu cách tuyệt đối với phân từ hiện tại diễn tả hành động đang tiếp diễn đồng thời; cách dịch này tự nhiên trong tiếng Việt và giữ được sắc thái ấy.
- source_word: λαβὼν ἄρτον
  choice: Đức Giê-su lấy bánh
  rationale: Chuyển phân từ bất định sang động từ hữu hạn phù hợp với lối kể tiếng Việt. ἄρτον không có mạo từ nên dịch đơn giản là “bánh”, không xác định quá mức là một ổ bánh.
- source_word: εὐλογήσας
  choice: chúc phước
  rationale: Trong bối cảnh bữa ăn, từ này chỉ việc đọc lời chúc phước trên bánh. Không thêm tân ngữ giúp giữ sự cô đọng và tránh khẳng định rằng chính bánh là đối tượng được ban phước.
- source_word: ἔκλασεν
  choice: bẻ ra
  rationale: Diễn tả việc bẻ bánh để trao cho các môn đồ; tân ngữ được hiểu rõ từ ngữ cảnh.
- source_word: ἔδωκεν αὐτοῖς
  choice: trao cho họ
  rationale: “Trao” tự nhiên trong cảnh đưa bánh tận tay và không diễn giải quá mức như “phân phát”.
- source_word: Λάβετε
  choice: Hãy nhận lấy
  rationale: Mệnh lệnh bất định kêu gọi các môn đồ tiếp nhận bánh. “Nhận lấy” tự nhiên và trang trọng hơn “lấy” trong tiếng Việt, đồng thời không thêm tân ngữ không có trong Hy Lạp.
- source_word: τοῦτό ἐστιν
  choice: đây là
  rationale: Giữ nguyên cấu trúc hệ từ trực tiếp, không thay bằng cách diễn giải “tượng trưng cho” hay “có nghĩa là”.
- source_word: τὸ σῶμά μου
  choice: thân thể Ta
  rationale: σῶμα có nghĩa trực tiếp là “thân thể”. Đại từ “Ta” phù hợp với lời trang trọng của Đức Giê-su mà vẫn dễ hiểu trong tiếng Việt hiện đại.
theological_decisions:
- issue: Cách hiểu lời tuyên bố của Đức Giê-su trong Bữa Tiệc Ly
  choice: đây là thân thể Ta
  alternative: đây tượng trưng cho thân thể Ta / điều này có nghĩa là thân thể Ta
  rationale: Bản Hy Lạp dùng hệ từ thông thường ἐστιν, nghĩa trực tiếp là “là”. Bản dịch giữ nguyên lời văn và sức căng thần học, không giải quyết trước những cách hiểu khác nhau về Tiệc Thánh.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “Đức Giê-su” để xác định chủ thể được hàm ẩn trong động từ Hy Lạp theo ngữ cảnh; dùng “Ta” trong lời trực tiếp. Không đưa cách hiểu biểu tượng vào chú thích vì đó không phải là dị bản hay nghĩa đen của cấu trúc Hy Lạp.
