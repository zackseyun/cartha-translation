  text: ὁ δὲ ἀρχιερεὺς διαρρήξας τοὺς χιτῶνας αὐτοῦ λέγει· Τί ἔτι χρείαν ἔχομεν μαρτύρων;
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/063.yaml
  text: Then the high priest tore his garments and said[b][a], “What further need do we have of witnesses?”
translation:
  language: vi
  text: 'Bấy giờ, thượng tế xé áo[a] mình và nói[b]: “Chúng ta còn cần nhân chứng làm gì nữa?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn Hy Lạp dùng dạng số nhiều, có thể dịch cụ thể hơn là “các áo dài” hoặc “các áo mặc trong.”
    reason: lexical_alternative
  - marker: b
    text: 'Tiếng Hy Lạp dùng thì hiện tại lịch sử: “nói.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀρχιερεὺς
  choice: thượng tế
  rationale: Cách gọi chuẩn và gọn trong tiếng Việt dành cho người giữ chức tư tế cao nhất đang chủ trì cuộc xét hỏi.
- source_word: διαρρήξας
  choice: xé
  rationale: Diễn đạt trực tiếp hành động làm rách áo, rõ ràng và tự nhiên trong tiếng Việt hiện đại.
- source_word: τοὺς χιτῶνας αὐτοῦ
  choice: áo mình
  rationale: χίτων chỉ áo mặc trên người, thường là áo dài hoặc áo trong. Tiếng Việt tự nhiên dùng “áo” theo nghĩa khái quát; chú thích lưu ý dạng số nhiều và nghĩa cụ thể hơn của từ Hy Lạp.
- source_word: λέγει
  choice: nói
  rationale: Hiện tại lịch sử trong tiếng Hy Lạp được diễn đạt bằng “nói” trong mạch kể tiếng Việt; bản thân động từ tiếng Việt không biến đổi hình thái theo thì.
- source_word: Τί ἔτι χρείαν ἔχομεν μαρτύρων
  choice: Chúng ta còn cần nhân chứng làm gì nữa?
  rationale: Câu hỏi tu từ tự nhiên trong tiếng Việt, giữ được ý ἔτι rằng không còn cần thêm lời chứng hay nhân chứng nào.
theological_decisions:
- issue: Ý nghĩa của hành động xé áo
  choice: Chỉ thuật lại hành động xé áo, không giải thích động cơ.
  alternative: Nói rõ đó là biểu hiện đau buồn, phẫn nộ hoặc phản ứng trước điều bị xem là phạm thượng.
  rationale: Câu này không trực tiếp giải thích ý nghĩa của cử chỉ; không thêm lời diễn giải giúp giữ nguyên sự dè dặt và sức căng của trình thuật.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Bấy giờ” nối tự nhiên với diễn tiến trước đó; câu hỏi cuối được diễn đạt theo lối nói tiếng Việt thông dụng mà vẫn giữ tính chất tu từ của nguyên văn.
