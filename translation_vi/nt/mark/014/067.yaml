source:
  edition: SBLGNT
  text: καὶ ἰδοῦσα τὸν Πέτρον θερμαινόμενον ἐμβλέψασα αὐτῷ λέγει· Καὶ σὺ μετὰ τοῦ Ναζαρηνοῦ ⸂ἦσθα τοῦ Ἰησοῦ⸃·
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/067.yaml
  text: And seeing Peter warming himself, she looked at him and says, “You also were with Jesus the Nazarene.”
translation:
  language: vi
  text: 'Thấy Phi-e-rơ đang sưởi ấm, cô nhìn thẳng vào ông và nói: “Ông cũng đã ở với Giê-su người Na-xa-rét.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐμβλέψασα αὐτῷ
  choice: nhìn thẳng vào ông
  rationale: Diễn đạt ánh nhìn chăm chú, trực diện, mạnh hơn động từ ‘nhìn’ thông thường.
- source_word: λέγει
  choice: nói
  rationale: Hiện tại lịch sử trong tiếng Hy Lạp được chuyển sang cách kể tự nhiên bằng tiếng Việt; không làm thay đổi thời điểm của lời nói trong mạch truyện.
- source_word: τοῦ Ναζαρηνοῦ ... τοῦ Ἰησοῦ
  choice: Giê-su người Na-xa-rét
  rationale: Giữ cả tên riêng và danh xưng chỉ xuất thân, đồng thời sắp xếp theo trật tự tự nhiên của tiếng Việt.
- source_word: Καὶ σὺ
  choice: Ông cũng
  rationale: Giữ sắc thái quy Peter vào cùng nhóm với những người đi theo Chúa Giê-su.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng tự nhiên. Dùng ‘cô’ cho nữ tớ trong ngữ cảnh liền trước và ‘ông’ để chỉ Phi-e-rơ; câu buộc tội được diễn đạt trực tiếp, dễ hiểu.
