  text: καὶ ἀποστέλλει δύο τῶν μαθητῶν αὐτοῦ καὶ λέγει αὐτοῖς· Ὑπάγετε εἰς τὴν πόλιν, καὶ ἀπαντήσει ὑμῖν ἄνθρωπος κεράμιον ὕδατος βαστάζων· ἀκολουθήσατε αὐτῷ,
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/013.yaml
  text: And he sends two of his disciples and says to them[a], “Go into the city, and a man carrying a jar of water will meet you. Follow him,”
translation:
  language: vi
  text: 'Ngài sai hai môn đồ của mình đi và nói với họ: “Hãy vào thành. Một người đàn ông mang một bình nước[a] sẽ gặp các anh; hãy đi theo người ấy.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “một vò bằng đất nung đựng nước.”'
    reason: κεράμιον có thể chỉ một vật chứa bằng đất nung; bản chính dùng cách nói tự nhiên hơn nhưng chú thích bảo lưu chi tiết từ vựng này.
lexical_decisions:
- source_word: ἀποστέλλει
  choice: sai ... đi
  rationale: Diễn đạt tự nhiên hành động sai phái; tiếng Việt không bắt buộc đánh dấu thì nên vẫn giữ được sắc thái hiện tại lịch sử trong mạch kể.
- source_word: δύο τῶν μαθητῶν αὐτοῦ
  choice: hai môn đồ của mình
  rationale: “Môn đồ” là cách gọi chính xác trong ngữ cảnh; “của mình” diễn đạt tự nhiên quan hệ quy chiếu về chủ ngữ.
- source_word: λέγει αὐτοῖς
  choice: nói với họ
  rationale: Bám sát động từ hiện tại trong lối kể của Mác mà không thêm sắc thái giải thích.
- source_word: Ὑπάγετε εἰς τὴν πόλιν
  choice: Hãy vào trong thành
  rationale: Mệnh lệnh “hãy vào” thể hiện rõ chuyển động vào bên trong thành như giới từ εἰς.
- source_word: ἀπαντήσει ὑμῖν
  choice: sẽ gặp các anh
  rationale: Giữ thì tương lai và quan hệ trực tiếp với đối tượng số nhiều; “các anh” phù hợp lời nói với hai nam môn đồ mà không mang sắc thái tôn ti quá mức.
- source_word: ἄνθρωπος
  choice: một người đàn ông
  rationale: Trong ngữ cảnh từ này chỉ một người nam cụ thể.
- source_word: κεράμιον ὕδατος
  choice: một vò nước
  rationale: “Vò nước” là cách nói tự nhiên, dễ hiểu về vật chứa nước; chi tiết vật liệu bằng đất nung được bảo lưu trong chú thích như một khả năng từ vựng.
- source_word: βαστάζων
  choice: mang
  rationale: Diễn đạt gọn và tự nhiên hành động đang mang vật chứa.
- source_word: ἀκολουθήσατε αὐτῷ
  choice: hãy đi theo người ấy
  rationale: Giữ nguyên lực mệnh lệnh và xác định rõ người đàn ông vừa được nhắc đến.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Đại từ “Ngài” dùng cho Chúa Giê-su theo tiền cảnh của câu, còn “các anh” phản ánh hai người nam được sai đi mà không thêm quan hệ thân tộc hay sắc thái giáo phái.
