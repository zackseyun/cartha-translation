  text: καὶ ἡ παιδίσκη ἰδοῦσα αὐτὸν ⸂ἤρξατο πάλιν⸃ λέγειν τοῖς ⸀παρεστῶσιν ὅτι Οὗτος ἐξ αὐτῶν ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/069.yaml
  text: And the servant girl[a], seeing him, began again to say to those standing nearby, “This man is one of them.”
translation:
  language: vi
  text: 'Cô đầy tớ thấy ông thì lại bắt đầu nói với những người đứng gần đó: “Người này là một trong họ.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παιδίσκη
  choice: cô đầy tớ
  rationale: Chỉ một nữ đầy tớ trẻ. “Cô đầy tớ” tự nhiên trong tiếng Việt hiện đại và không khẳng định quá mức về địa vị pháp lý như “nữ nô lệ”.
- source_word: ἰδοῦσα
  choice: thấy ông thì
  rationale: Diễn đạt phân từ bất định quá khứ như hoàn cảnh dẫn đến lời nói, với cấu trúc tiếng Việt tự nhiên.
- source_word: ἤρξατο πάλιν λέγειν
  choice: lại bắt đầu nói
  rationale: Giữ cả ý khởi đầu của ἤρξατο và ý lặp lại của πάλιν, đồng thời theo trật tự tự nhiên trong tiếng Việt.
- source_word: τοῖς παρεστῶσιν
  choice: với những người đứng gần đó
  rationale: Giữ sắc thái những người đang hiện diện hoặc đứng bên cạnh, phù hợp với bối cảnh sân dinh.
- source_word: Οὗτος
  choice: Người này
  rationale: Đại từ chỉ định trực tiếp trỏ đến Phi-e-rơ; cách diễn đạt này tự nhiên và không thêm sắc thái khinh miệt.
- source_word: ἐξ αὐτῶν
  choice: là một trong bọn họ
  rationale: Diễn đạt thành ngữ chỉ việc thuộc về nhóm đang được nhắc đến. “Bọn họ” phù hợp với lời tố giác nhưng không xác định thêm danh tính nhóm.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Giữ động thái lặp lại trong lời tố giác bằng “lại bắt đầu nói”; không thêm thông tin ngoài bản Hy Lạp.
