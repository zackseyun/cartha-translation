  text: καὶ ἐλθὼν ⸀εὐθὺς προσελθὼν αὐτῷ λέγει· ⸀Ῥαββί, καὶ κατεφίλησεν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/045.yaml
  text: And when he came[a], he immediately went up to him and said, “Rabbi!” and kissed him repeatedly.
translation:
  language: vi
  text: 'Khi vừa đến, người ấy lập tức tiến lại gần Đức Giê-su và nói: “Ra-bi!” rồi hôn Người thắm thiết.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “hôn Người nhiều lần” hoặc “hôn Người nồng nhiệt”; động từ Hy Lạp ở đây có sắc thái mạnh hơn từ thông thường có nghĩa là “hôn.”'
    reason: Nêu các khả năng từ vựng thực sự của καταφιλέω mà không quyết định quá mức giữa ý cường điệu và ý lặp lại.
lexical_decisions:
- source_word: ἐλθὼν
  choice: vừa đến nơi
  rationale: Phân từ bất định quá khứ có chức năng chỉ thời gian; cách dịch này diễn đạt tự nhiên sự việc vừa xảy ra và dẫn vào hành động kế tiếp.
- source_word: εὐθὺς
  choice: lập tức
  rationale: Giữ nhịp kể nhanh đặc trưng của Mác và diễn đạt rõ tính tức thời.
- source_word: προσελθὼν αὐτῷ
  choice: tiến lại gần Đức Giê-su
  rationale: Diễn tả chuyển động đến gần người đang được nói tới; nêu Đức Giê-su để câu tiếng Việt rõ nghĩa trong đơn vị câu độc lập.
- source_word: λέγει
  choice: nói
  rationale: Hiện tại lịch sử trong tiếng Hy Lạp được chuyển thành lối kể tự nhiên của tiếng Việt mà không làm thay đổi hành động lời nói.
- source_word: Ῥαββί
  choice: Ra-bi
  rationale: Phiên âm danh xưng Sê-mít được giữ lại nhằm bảo tồn bối cảnh lịch sử và sắc thái mỉa mai của lời chào.
- source_word: κατεφίλησεν
  choice: hôn Người thắm thiết
  rationale: Động từ ghép có sắc thái mạnh hơn động từ đơn chỉ hành động hôn; cách dịch này thể hiện nụ hôn nhấn mạnh mà không buộc phải hiểu chắc chắn là hôn nhiều lần.
theological_decisions:
- issue: Cách dịch danh xưng Ῥαββί của Giu-đa dành cho Đức Giê-su
  choice: Ra-bi
  alternative: Thầy
  rationale: Giữ danh xưng thực tế trong cảnh thuật, bảo tồn màu sắc lịch sử và sự căng thẳng mỉa mai, đồng thời không thêm diễn giải giáo lý.
- issue: Sắc thái của động từ καταφιλέω
  choice: hôn Người thắm thiết
  alternative: hôn Người nhiều lần
  rationale: Nguyên ngữ cho thấy hành động hôn được nhấn mạnh nhưng không xác định dứt khoát đó là cường độ, sự nồng nhiệt hay sự lặp lại; bản dịch chính và chú thích cùng giữ khoảng nghĩa này.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. “Người ấy” giữ chủ thể trung tính theo mạch văn; “Đức Giê-su” và đại từ “Người” giúp xác định rõ đối tượng mà không thêm nội dung giáo phái. Dấu chú thích được đặt ngay sau cụm từ liên quan.
