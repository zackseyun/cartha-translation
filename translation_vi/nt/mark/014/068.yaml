  text: ὁ δὲ ἠρνήσατο λέγων· ⸂Οὔτε οἶδα οὔτε ἐπίσταμαι σὺ τί⸃ λέγεις, καὶ ἐξῆλθεν ἔξω εἰς τὸ προαύλιον ⸂καὶ ἀλέκτωρ ἐφώνησεν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/068.yaml
  text: But he denied it[a], saying, “I neither know nor understand what you are saying.” And he went out into the forecourt, and a rooster crowed.
translation:
  language: vi
  text: 'Nhưng ông chối, nói: “Tôi không biết cũng không hiểu cô đang nói gì.” Rồi ông đi ra ngoài, đến sân trước, và một con gà trống gáy.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Một số thủ bản không có câu: “và một con gà trống gáy.”'
    reason: textual_variant
lexical_decisions:
- source_word: ἠρνήσατο
  choice: ông chối
  rationale: Động từ ở đây diễn tả việc Phi-e-rơ phủ nhận lời cáo buộc vừa nêu. Tiếng Việt có thể dùng “chối” không cần thêm tân ngữ, nhờ vậy tránh diễn giải quá mức thành “chối Chúa” khi chính mệnh đề Hy Lạp không nêu tân ngữ.
- source_word: Οὔτε οἶδα οὔτε ἐπίσταμαι
  choice: Tôi không biết cũng không hiểu
  rationale: Giữ hai động từ song song nhằm thể hiện sự phủ nhận được nhấn mạnh; “biết” và “hiểu” tự nhiên trong lời nói hiện đại.
- source_word: σὺ τί λέγεις
  choice: cô đang nói gì
  rationale: Dịch trực tiếp cấu trúc “điều cô nói”; đại từ “cô” phù hợp với người tớ gái được nhắc trong ngữ cảnh gần và giữ sắc thái đối thoại tự nhiên.
- source_word: ἐξῆλθεν ἔξω
  choice: đi ra ngoài
  rationale: Thể hiện tự nhiên ý chuyển động ra phía ngoài mà không lặp vụng về động từ và trạng từ của tiếng Hy Lạp.
- source_word: προαύλιον
  choice: tiền sảnh
  rationale: Chỉ khu vực ở phía trước sân trong hoặc gần lối vào, không phải chính sân trong. “Tiền sảnh” rõ và quen thuộc hơn các cách dịch quá chuyên biệt, dù hình dạng kiến trúc chính xác vẫn không hoàn toàn chắc chắn.
- source_word: ἀλέκτωρ ἐφώνησεν
  choice: một con gà trống gáy
  rationale: Cách diễn đạt tự nhiên trong tiếng Việt và phản ánh danh từ không có mạo từ trong tiếng Hy Lạp.
theological_decisions:
- issue: Có đưa mệnh đề καὶ ἀλέκτωρ ἐφώνησεν vào chính văn hay không
  choice: 'Giữ trong chính văn: “và một con gà trống gáy”'
  alternative: Lược bỏ mệnh đề vì một số thủ bản không có
  rationale: SBLGNT được cung cấp giữ mệnh đề nhưng đánh dấu có biến thể văn bản. Vì vậy bản dịch giữ mệnh đề trong chính văn và ghi chú sự khác biệt thủ bản, không che giấu mức độ bất định.
translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng hiện đại, dễ hiểu. Giữ phép lặp “không biết cũng không hiểu” của nguyên văn. Dùng “ông” cho Phi-e-rơ và “cô” cho người tớ gái theo ngữ cảnh, không thêm danh Chúa Giê-su vào lời chối.
