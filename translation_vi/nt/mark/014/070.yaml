source:
  edition: SBLGNT
  text: ὁ δὲ πάλιν ἠρνεῖτο. καὶ μετὰ μικρὸν πάλιν οἱ παρεστῶτες ἔλεγον τῷ Πέτρῳ· Ἀληθῶς ἐξ αὐτῶν εἶ, καὶ γὰρ Γαλιλαῖος εἶ ⸂καὶ ἡ λαλιά σου ὁμοιάζει⸃·
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/070.yaml
  text: But he again denied it[a]. And after a little while, those standing nearby again were saying to Peter, “Surely you are one of them, for you are also a Galilean[b], and your speech is similar.”
translation:
  language: vi
  text: 'Nhưng ông lại chối. Một lúc sau, những người đứng gần đó lại nói với Phi-e-rơ: “Quả thật, anh là một trong số họ, vì anh cũng là người Ga-li-lê, và cách nói của anh giống cách nói của họ.”[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “giọng nói của anh giống cách nói của họ” hoặc “lối nói của anh giống lối nói của họ.” Từ Hy Lạp λαλιά có thể chỉ cách nói, phương ngữ hoặc âm giọng.
    reason: lexical_alternative
  - marker: b
    text: Một số bản chép tay không có mệnh đề “và cách nói của anh giống cách nói của họ.”
    reason: textual_variant
lexical_decisions:
- source_word: ἠρνεῖτο
  choice: lại chối
  rationale: Động từ ở thì chưa hoàn thành có thể gợi hành động tiếp diễn hoặc lặp lại; kết hợp với πάλιν, “lại chối” diễn đạt tự nhiên việc Phi-e-rơ tiếp tục phủ nhận điều vừa bị cáo buộc mà không cần thêm một tân ngữ không có trong câu Hy Lạp.
- source_word: μετὰ μικρὸν
  choice: Một lúc sau
  rationale: Cụm từ chỉ một khoảng thời gian ngắn đã trôi qua; cách dịch này tự nhiên trong lời kể hiện đại.
- source_word: οἱ παρεστῶτες
  choice: những người đứng gần đó
  rationale: Giữ được sắc thái không gian của phân từ, chỉ những người đang đứng bên cạnh hoặc có mặt tại đó.
- source_word: ἔλεγον
  choice: lại nói
  rationale: Thì chưa hoàn thành cho phép hiểu là họ đang nói hoặc lặp lại lời quả quyết; tiếng Việt không cần đánh dấu hình thái này quá nặng, còn πάλιν được thể hiện bằng “lại”.
- source_word: Ἀληθῶς
  choice: Quả thật
  rationale: Diễn đạt lời khẳng định chắc chắn với văn phong tự nhiên, trang trọng vừa phải.
- source_word: ἐξ αὐτῶν εἶ
  choice: anh là một trong số họ
  rationale: Cách nói rõ ràng và tự nhiên để chỉ Phi-e-rơ thuộc nhóm những người gắn với Đức Chúa Jêsus.
- source_word: καὶ γὰρ
  choice: vì anh cũng
  rationale: “Vì” nêu lý do cho lời quả quyết, còn “cũng” giữ sắc thái bổ sung của καί.
- source_word: Γαλιλαῖος
  choice: người Ga-li-lê
  rationale: Danh từ chỉ một người đến từ vùng Ga-li-lê.
- source_word: ἡ λαλιά σου
  choice: cách nói của anh
  rationale: λαλιά có thể chỉ lối nói, phương ngữ hoặc giọng nói. “Cách nói” giữ phạm vi nghĩa rộng hơn “giọng” và không thu hẹp quá sớm vào âm giọng.
- source_word: ὁμοιάζει
  choice: cũng giống cách nói của họ
  rationale: Động từ có nghĩa là giống hoặc tương tự. Việc lặp “cách nói” làm câu tiếng Việt rõ và tự nhiên, đồng thời chỉ bổ sung đối tượng so sánh đã được ngữ cảnh hàm ý.
theological_decisions: []
translation_notes:
  register: Bản dịch dùng tiếng Việt hiện đại, dễ hiểu nhưng vẫn giữ sắc thái trang nghiêm của lời kể. Đại từ “ông” được dùng cho Phi-e-rơ trong lời trần thuật, còn những người đứng gần gọi ông là “anh” trong lời nói trực tiếp. Tên riêng được viết theo lối phiên âm quen thuộc “Phi-e-rơ”; địa danh/danh xưng vùng là “Ga-li-lê”.
