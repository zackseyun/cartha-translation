  text: And leaving him, they all fled.
translation:
  language: vi
  text: Và tất cả đều bỏ Người mà chạy trốn.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: Bấy giờ
  rationale: Trong mạch kể tiếng Việt, “Bấy giờ” nối hành động này với cảnh bắt giữ ngay trước đó một cách tự nhiên; từ này thể hiện sự tiếp nối trong trình thuật mà không nhấn mạnh quan hệ nguyên nhân.
- source_word: ἀφέντες
  choice: bỏ
  rationale: Phân từ quá khứ của ἀφίημι ở đây có nghĩa là bỏ lại. “Bỏ” ngắn gọn, tự nhiên và vẫn cho thấy những người đi theo đã rời khỏi Chúa Giê-su, nhưng không tăng sắc thái bằng từ mạnh hơn như “ruồng bỏ”.
- source_word: αὐτὸν
  choice: Người
  rationale: Đại từ chỉ Chúa Giê-su. “Người” là cách quy chiếu trang trọng, rõ nghĩa và tự nhiên trong văn phong Kinh Thánh tiếng Việt.
- source_word: ἔφυγον
  choice: chạy trốn
  rationale: Động từ φεύγω diễn tả việc chạy khỏi mối nguy. “Chạy trốn” là cách nói phổ thông, rõ ràng và giữ được sắc thái hoảng sợ rút lui.
- source_word: πάντες
  choice: tất cả đều
  rationale: 'Cụm này giữ trọng tâm của πάντες về tính toàn bộ: không ai trong nhóm đang được nói đến ở lại.'
theological_decisions:
- issue: Phạm vi việc các môn đồ bỏ Chúa Giê-su
  choice: tất cả đều bỏ Người mà chạy trốn
  alternative: họ đều bỏ Người mà chạy trốn
  rationale: Bản dịch giữ nguyên lời khẳng định trọn vẹn của câu về những người đang ở với Chúa Giê-su lúc ấy, không làm nhẹ đi cũng không mở rộng quá phạm vi văn cảnh.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cấu trúc “bỏ Người mà chạy trốn” diễn đạt tự nhiên quan hệ giữa hành động bỏ lại và chạy đi, đồng thời giữ sự cô đọng của nguyên văn.
