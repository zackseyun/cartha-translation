source:
  edition: SBLGNT
  text: ὅτι Ἡμεῖς ἠκούσαμεν αὐτοῦ λέγοντος ὅτι Ἐγὼ καταλύσω τὸν ναὸν τοῦτον τὸν χειροποίητον καὶ διὰ τριῶν ἡμερῶν ἄλλον ἀχειροποίητον οἰκοδομήσω·
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/058.yaml
  text: that[a], ‘We heard him saying, “I will destroy this temple made with hands[b], and in three days I will build another not made with hands.”’
translation:
  language: vi
  text: 'rằng: “Chính chúng tôi đã nghe người ấy nói: ‘Ta sẽ phá hủy đền thờ này do tay người làm nên[b], và trong vòng ba ngày[a], ta sẽ xây một đền thờ khác không do tay người làm nên.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “trong ba ngày”. Cụm từ Hy Lạp ở đây tự nhiên nhất chỉ khoảng thời gian mà trong đó hành động sẽ xảy ra.
    reason: lexical_alternative
  - marker: b
    text: Hai cách nói “do tay người làm nên” và “không do tay người làm nên” giữ nguyên sự tương phản giữa hai từ Hy Lạp χειροποίητον và ἀχειροποίητον.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: rằng
  rationale: Dẫn vào nội dung lời chứng buộc tội, không mang nghĩa nguyên nhân “bởi vì” trong ngữ cảnh này.
- source_word: Ἡμεῖς
  choice: Chính chúng tôi
  rationale: Đại từ được nêu rõ trong tiếng Hy Lạp để nhấn mạnh lời tự xác nhận của các nhân chứng; “chính” truyền đạt nét nhấn ấy tự nhiên trong tiếng Việt.
- source_word: ἠκούσαμεν αὐτοῦ λέγοντος
  choice: đã nghe ông ta nói
  rationale: Diễn đạt tự nhiên kết cấu “nghe người ấy nói”; “ông ta” phù hợp giọng lời chứng đối nghịch mà không thêm lời giải thích.
- source_word: καταλύσω
  choice: sẽ phá hủy
  rationale: Trong ngữ cảnh một công trình, động từ chỉ việc phá bỏ hoặc hủy đi; “phá hủy” rõ nghĩa và giữ được sức nặng của lời cáo buộc.
- source_word: τὸν ναὸν τοῦτον
  choice: đền thờ này
  rationale: “Đền thờ” là cách gọi tự nhiên, dễ nhận biết; “này” giữ nguyên lực chỉ định của τοῦτον.
- source_word: χειροποίητον
  choice: do tay người làm nên
  rationale: Giữ hình ảnh “tay” và tạo thế đối xứng trực tiếp với ἀχειροποίητον, đồng thời làm rõ đây là tay con người.
- source_word: διὰ τριῶν ἡμερῶν
  choice: trong vòng ba ngày
  rationale: διά với sở hữu cách trong biểu thức thời gian tự nhiên chỉ khoảng thời gian mà trong đó hành động xảy ra; cách dịch này giữ sắc thái về giới hạn thời gian.
- source_word: ἄλλον
  choice: một đền thờ khác
  rationale: Bổ sung lại danh từ theo cách tự nhiên trong tiếng Việt, cho thấy một đền thờ khác được xây thay cho đền thờ vừa nói đến.
- source_word: ἀχειροποίητον
  choice: không do tay người làm nên
  rationale: Giữ nguyên sự tương phản hình thức và ý nghĩa với χειροποίητον mà không diễn giải thành “do Đức Chúa Trời làm” hay một kết luận thần học khác.
- source_word: οἰκοδομήσω
  choice: sẽ xây
  rationale: Động từ có nghĩa là “xây”; không dịch là “xây lại” vì nguyên văn không buộc phải hiểu như vậy.
theological_decisions:
- issue: Làm rõ đây là lời chứng mang tính cáo buộc hay là lời kể được người thuật chuyện xác nhận
  choice: Giữ nguyên dưới dạng lời được các nhân chứng thuật lại, không thêm lời bình rằng họ xuyên tạc
  alternative: Diễn ý để nói rõ đây chỉ là lời cáo buộc hoặc là sự xuyên tạc lời Đức Chúa Jêsus
  rationale: Nguyên văn thuật lại điều các nhân chứng tuyên bố đã nghe. Cấu trúc trích dẫn đã cho thấy đây là lời chứng được thuật lại; bản dịch không nên đưa sự hòa giải với các phân đoạn khác vào chính câu.
- issue: Ý nghĩa thần học của sự tương phản giữa đền thờ “do tay người làm nên” và “không do tay người làm nên”
  choice: Giữ nguyên cặp diễn đạt đối xứng trong bản văn chính
  alternative: Diễn giải thành “do con người dựng nên” đối lập với “do Đức Chúa Trời dựng nên” hoặc xác định đền thờ thứ hai là một thực tại thần học cụ thể
  rationale: Cặp từ Hy Lạp có thể gợi ý nghĩa thần học, nhưng câu này không trực tiếp giải thích ý nghĩa ấy. Giữ cách nói nguyên văn bảo toàn sự căng thẳng và tính đa nghĩa.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Chính chúng tôi” giữ nét nhấn của đại từ Hy Lạp; “ông ta” phù hợp lời chứng đối nghịch trong ngữ cảnh xét xử. Cặp “do tay người làm nên / không do tay người làm nên” được giữ có chủ ý để bảo toàn cấu trúc và dư âm thần học của nguyên văn.
