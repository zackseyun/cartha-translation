    rationale: Đại từ αὐτοῦ chỉ “người ấy/ông ấy” một cách trung tính. Dù đây là lời chứng chống đối, nguyên văn không tự nó dùng đại từ miệt thị; “người ấy” bảo toàn giọng thuật lại mà không tăng mức độ thù địch.
  - severity: low
    issue: Cụm “đền thờ này, là đền thờ do tay người làm nên” bị lặp và hơi gượng.
    rationale: χειροποίητον bổ nghĩa trực tiếp cho “đền thờ này”; tiếng Việt tự nhiên hơn khi đặt cụm này trực tiếp sau danh từ, không cần lặp “đền thờ”.
