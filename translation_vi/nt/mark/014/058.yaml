  to: 'rằng: “Chính chúng tôi đã nghe người ấy nói: ‘Ta sẽ phá hủy đền thờ này do tay người làm nên[b], và trong vòng ba ngày[a], ta sẽ xây một đền thờ khác không do tay người làm nên.’”'
  rationale: Chỉ thay “ông ta” bằng “người ấy” để tránh thêm sắc thái miệt thị không có trong nguyên văn, và giản lược cấu trúc bổ nghĩa cho tự nhiên hơn trong tiếng Việt. Các lựa chọn từ ngữ then chốt, dấu neo chú thích và tính mơ hồ thần học đều được giữ nguyên.
