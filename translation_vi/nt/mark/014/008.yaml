review_pass:
  verdict: revise
  source_fidelity: Bản dịch truyền đạt đúng ý thành ngữ ὃ ἔσχεν ἐποίησεν là người phụ nữ đã làm theo khả năng mình, và diễn tả đúng việc xức dầu cho thân thể Chúa Giê-su trước việc mai táng. Tuy nhiên, “bà” có thể hàm ý tuổi tác không có trong γυνή; “người phụ nữ này” trung tính và bám văn cảnh hơn. Cụm “trước để chuẩn bị” cũng nên đặt lại để quan hệ hành động làm trước và mục đích mai táng rõ, tự nhiên hơn.
  naturalness: Câu sửa vẫn trang trọng, hiện đại và dễ đọc. “Từ trước, để chuẩn bị cho việc mai táng” tránh sự gượng của chuỗi “trước để chuẩn bị”. Chú thích được sửa cho đúng cấu trúc tiếng Việt, đồng thời cho thấy trật tự sát chữ của tiếng Hy Lạp mà không gán một cách giải nghĩa quá mức.
  terminology: “Xức dầu thơm,” “thân thể tôi,” và “mai táng” phù hợp ngữ cảnh chôn cất và không áp đặt nghĩa nghi lễ. “Người phụ nữ này” không thêm thông tin về tuổi hay địa vị của nhân vật.
  issues:
  - severity: low
    issue: “Bà” có thể gợi tuổi tác.
    rationale: γυνή chỉ người phụ nữ; bản văn không xác định bà ấy cao tuổi. “Người phụ nữ này” giữ quy chiếu từ văn cảnh mà không thêm sắc thái tuổi tác.
  - severity: low
    issue: Cụm “trước để chuẩn bị” hơi gượng và có thể làm mờ cấu trúc của προέλαβεν ... εἰς τὸν ἐνταφιασμόν.
    rationale: Động từ nhấn mạnh việc xức dầu được thực hiện trước; cụm εἰς nêu hướng đến/mục đích liên hệ việc mai táng. Đặt “từ trước, để chuẩn bị...” phản ánh hai mặt này rõ hơn.
  - severity: medium
    issue: Chú thích sát nghĩa hiện có không tự nhiên và không phản ánh trật tự/mệnh đề Hy Lạp một cách rõ ràng.
    rationale: “Bà có gì thì đã làm điều ấy” thiếu đối ứng tự nhiên giữa mệnh đề quan hệ trung tính và động từ. “Điều bà có, bà đã làm” là cách ghi sát cấu trúc hơn, dù được giữ trong chú thích vì tính cô đọng/khó hiểu của thành ngữ.
  revised_text: Người phụ nữ này đã làm điều mình có thể làm[a]; bà đã xức dầu thơm cho thân thể tôi từ trước, để chuẩn bị cho việc mai táng.
