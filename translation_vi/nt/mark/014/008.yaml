base_translation:
  language: en
  yaml_path: translation/nt/mark/014/008.yaml
  text: She did what she could[a]; she anointed my body beforehand for burial.
translation:
  language: vi
  text: Người phụ nữ này đã làm điều mình có thể làm[a]; bà đã xức dầu thơm cho thân thể tôi từ trước, để chuẩn bị cho việc mai táng.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay, sát nghĩa hơn: “Điều bà có, bà đã làm.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃ ἔσχεν ἐποίησεν
  choice: Bà đã làm điều mình có thể làm
  rationale: Diễn đạt tự nhiên thành ngữ Hy Lạp theo nghĩa bà đã làm điều nằm trong khả năng của mình, đồng thời giữ cách dịch sát hơn trong chú thích.
- source_word: προέλαβεν
  choice: trước
  rationale: Cho biết hành động xức dầu được thực hiện trước thời điểm mai táng; đặt trạng từ cùng cụm động từ để câu tiếng Việt tự nhiên.
- source_word: μυρίσαι
  choice: xức dầu thơm
  rationale: Động từ chỉ việc thoa dầu thơm hoặc hương liệu; “xức dầu thơm” vừa rõ nghĩa với độc giả hiện đại vừa phù hợp bối cảnh chuẩn bị mai táng.
- source_word: τὸ σῶμά μου
  choice: thân thể tôi
  rationale: Chuyển dịch trực tiếp, tự nhiên và trang trọng.
- source_word: εἰς τὸν ἐνταφιασμόν
  choice: để chuẩn bị cho việc mai táng
  rationale: Thể hiện mục đích của hành động trong bối cảnh phong tục chuẩn bị thi thể để chôn cất; cụm này rõ hơn lối dịch ngắn “cho việc mai táng” trong tiếng Việt.
theological_decisions:
- issue: Có nên nêu rõ chủ thể giống cái dù câu Hy Lạp chỉ hàm chứa chủ thể trong động từ
  choice: Dùng “bà” làm chủ thể
  alternative: Lược chủ thể hoặc dùng “người phụ nữ ấy”
  rationale: Văn cảnh ngay trước xác định đây là một phụ nữ. Tiếng Việt cần nêu chủ thể để câu tự nhiên; “bà” trang trọng, gọn và không thêm nội dung thần học.
- issue: Quan hệ giữa việc xức dầu và việc mai táng
  choice: Diễn đạt là hành động làm trước để chuẩn bị cho việc mai táng
  alternative: “Bà đã đoán trước mà xức dầu cho thân thể tôi để mai táng”
  rationale: προέλαβεν nhấn mạnh hành động được thực hiện trước, không nhất thiết khẳng định người phụ nữ có sự hiểu biết tiên tri hay chủ ý đoán trước cái chết; bản dịch tránh giải quyết quá mức hàm ý này.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “mai táng” thay cho từ quá khẩu ngữ; “xức dầu thơm” làm rõ loại hành động mà không biến nó thành một nghi thức giáo phái.
