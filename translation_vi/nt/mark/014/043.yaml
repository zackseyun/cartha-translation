source:
  edition: SBLGNT
  text: Καὶ ⸀εὐθὺς ἔτι αὐτοῦ λαλοῦντος παραγίνεται ⸀Ἰούδας ⸀εἷς τῶν δώδεκα καὶ μετ’ αὐτοῦ ⸀ὄχλος μετὰ μαχαιρῶν καὶ ξύλων παρὰ τῶν ἀρχιερέων καὶ τῶν γραμματέων καὶ τῶν πρεσβυτέρων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/043.yaml
  text: And immediately[a], while he was still speaking, Judas arrived, one of the Twelve, and with him a crowd with swords and clubs[d][c][b], from the chief priests and the scribes and the elders.
translation:
  language: vi
  text: Ngay lập tức, khi Đức Giê-su vẫn còn đang nói, Giu-đa, một trong Mười Hai, đến[a]. Đi cùng ông là một đám đông cầm kiếm và gậy[b], đến từ[c] các thượng tế, các kinh sư và các trưởng lão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Động từ Hy Lạp ở thì hiện tại lịch sử (“đến”), tạo sắc thái sống động cho lời kể. Tiếng Việt dùng “đến” mà không cần đánh dấu thì; cũng có thể dịch là “xuất hiện”.
    reason: lexical_alternative
  - marker: b
    text: Theo nghĩa đen, từ Hy Lạp là “những vật bằng gỗ”; trong ngữ cảnh này, nó chỉ gậy hoặc dùi cui dùng làm vũ khí.
    reason: lexical_alternative
  - marker: c
    text: Cũng có thể dịch là “do các thượng tế, các kinh sư và các trưởng lão phái đến”. Nguyên văn nói đám đông đến “từ” họ, có thể chỉ nguồn gốc hoặc thẩm quyền mà không nêu rõ cách thức sai phái.
    reason: alternative_reading
lexical_decisions:
- source_word: εὐθὺς
  choice: ngay lúc ấy
  rationale: Diễn đạt sự việc xảy ra tức khắc và nối tiếp trực tiếp trong lối kể dồn dập của Mác, đồng thời kết hợp tự nhiên với mệnh đề “khi Đức Giê-su vẫn còn đang nói”.
- source_word: ἔτι αὐτοῦ λαλοῦντος
  choice: khi Đức Giê-su vẫn còn đang nói
  rationale: Chuyển cấu trúc sở hữu cách tuyệt đối thành mệnh đề chỉ thời gian tự nhiên trong tiếng Việt; “vẫn còn” thể hiện ἔτι. Nêu rõ Đức Giê-su thay cho đại từ để tránh mơ hồ trong tiếng Việt.
- source_word: παραγίνεται
  choice: đến
  rationale: Giữ nghĩa một người đi đến và xuất hiện tại hiện trường. Động từ tiếng Việt không bắt buộc đánh dấu thì, nên “đến” vừa tự nhiên vừa không cần mô phỏng máy móc thì hiện tại lịch sử của tiếng Hy Lạp.
- source_word: εἷς τῶν δώδεκα
  choice: một trong Nhóm Mười Hai
  rationale: Giữ cách gọi cô đọng của nguyên văn; viết hoa để cho thấy đây là danh xưng của nhóm môn đệ thân cận, không tự ý thêm từ “môn đệ”.
- source_word: ὄχλος
  choice: một đám đông
  rationale: Đây là nghĩa trực tiếp của ὄχλος. Không dùng “đám đông hung hãn” hay “đám người” theo nghĩa miệt thị, vì tính thù địch đã được bối cảnh và vũ khí biểu lộ.
- source_word: μαχαιρῶν
  choice: gươm
  rationale: μάχαιρα có thể chỉ gươm hoặc đoản kiếm; “gươm” là cách gọi phổ thông, rõ nghĩa trong cảnh bắt giữ.
- source_word: ξύλων
  choice: gậy gộc
  rationale: Dạng số nhiều của ξύλον theo nghĩa đen là những vật bằng gỗ, nhưng trong ngữ cảnh này chỉ các loại gậy dùng làm vũ khí; “gậy gộc” truyền đạt công dụng ấy tự nhiên.
- source_word: παρὰ τῶν ἀρχιερέων καὶ τῶν γραμματέων καὶ τῶν πρεσβυτέρων
  choice: đến từ các thượng tế, các kinh sư và các trưởng lão
  rationale: Giữ ý nguồn gốc hoặc thẩm quyền hàm chứa trong παρά với sở hữu cách, nhưng không nói rõ hơn nguyên văn rằng đám đông đã được các lãnh đạo này “phái đi”.
- source_word: ἀρχιερέων
  choice: các thượng tế
  rationale: Chỉ giới lãnh đạo tư tế cấp cao, chứ không có nghĩa là đồng thời có nhiều vị thượng tế đương nhiệm.
- source_word: γραμματέων
  choice: các kinh sư
  rationale: “Kinh sư” là cách gọi tiếng Việt gọn và quen thuộc cho những người chuyên về Kinh Luật; tránh diễn giải rộng thành “các giáo sư luật pháp”.
- source_word: πρεσβυτέρων
  choice: các trưởng lão
  rationale: Giữ danh xưng xã hội và thể chế của những người lãnh đạo được công nhận trong cộng đồng Do Thái.
theological_decisions:
- issue: Thì hiện tại lịch sử trong παραγίνεται
  choice: Dùng động từ “đến” trong câu kể tiếng Việt, không thêm dấu hiệu thì rõ rệt
  alternative: Dùng “bỗng xuất hiện” để nhấn mạnh tính sống động
  rationale: Tiếng Việt không biến đổi hình thái động từ theo thì. “Đến” bảo toàn hành động mà không thêm sắc thái bất ngờ vốn không nằm riêng trong động từ; sự gấp gáp đã được εὐθὺς truyền đạt.
- issue: Sắc thái của παρά khi nói đến các nhà lãnh đạo
  choice: Dịch “đến từ” để giữ quan hệ về nguồn gốc hoặc thẩm quyền
  alternative: Dịch “do ... phái đến”
  rationale: Nguyên văn liên kết đám đông với các thượng tế, kinh sư và trưởng lão nhưng không nói tường minh cách họ sai phái. Bản dịch giữ nguyên độ mở này, không làm mạnh hơn chứng cứ nguồn.
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Dùng các thuật ngữ Kinh Thánh phổ thông “Đức Giê-su”, “Nhóm Mười Hai”, “thượng tế”, “kinh sư”, “trưởng lão”. Dấu chấm phẩy giúp phân biệt việc Giu-đa đến với phần mô tả đám đông đi cùng mà vẫn giữ nhịp gấp của câu Hy Lạp.
