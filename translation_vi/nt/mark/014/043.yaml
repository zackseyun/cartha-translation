  to: Ngay lập tức, khi Đức Giê-su vẫn còn đang nói, Giu-đa, một trong Mười Hai, đến[a]. Đi cùng ông là một đám đông cầm kiếm và gậy[b], đến từ[c] các thượng tế, các kinh sư và các trưởng lão.
  rationale: 'Sửa nhẹ để phản ánh sát hơn εὐθύς, tránh thêm danh từ vào danh xưng “Mười Hai”, và dùng từ ngữ trang trọng, tự nhiên hơn cho vũ khí bằng gỗ. Câu vẫn giữ độ mở của παρά với sở hữu cách: đám đông “đến từ” các giới lãnh đạo, không khẳng định mạnh hơn rằng họ đã trực tiếp phái đám đông đi.'
