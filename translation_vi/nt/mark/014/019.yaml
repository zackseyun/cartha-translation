base_translation:
  language: en
  yaml_path: translation/nt/mark/014/019.yaml
  text: They began to be grieved and to say to him[a], one by one, “Surely not I?”
translation:
  language: vi
  text: 'Họ bắt đầu buồn rầu và từng người một nói với Người: “Chắc không phải là tôi chứ?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay sát nghĩa hơn: “Không phải là tôi, phải không?” Câu hỏi Hy Lạp dùng μήτι, cho thấy người hỏi mong đợi câu trả lời phủ định.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤρξαντο
  choice: bắt đầu
  rationale: Động từ ở thì aorist đi với các động từ nguyên mẫu, đánh dấu sự khởi đầu của cả nỗi buồn lẫn lời họ nói.
- source_word: λυπεῖσθαι
  choice: buồn rầu
  rationale: Diễn tả việc trở nên đau buồn, phù hợp với sắc thái trang nghiêm của bối cảnh và tự nhiên trong tiếng Việt hiện đại.
- source_word: καὶ λέγειν αὐτῷ
  choice: và ... nói với Người
  rationale: Giữ nghĩa cơ bản của λέγω là “nói” thay vì chuyển thành “hỏi”; đại từ αὐτῷ được giữ dưới dạng đại từ chỉ Chúa Giê-su theo ngữ cảnh.
- source_word: εἷς κατὰ εἷς
  choice: lần lượt từng người
  rationale: 'Diễn đạt tự nhiên ý phân phối và tuần tự: mỗi người nói theo lượt.'
- source_word: Μήτι ἐγώ;
  choice: Chắc không phải là con chứ?
  rationale: μήτι cho thấy người hỏi mong đợi câu trả lời phủ định. Cách nói này vừa tự nhiên trong tiếng Việt, vừa giữ tính chất lược ý của nguyên văn; “con” phù hợp với lời môn đồ trực tiếp thưa với Chúa Giê-su.
theological_decisions:
- issue: Sắc thái câu hỏi của các môn đồ
  choice: 'Dịch thành câu hỏi mong đợi lời phủ định: “Chắc không phải là con chứ?”'
  alternative: “Có phải là con không?”
  rationale: Tiểu từ μήτι hướng đến câu trả lời “không”; cách dịch trung tính sẽ làm mất sắc thái kinh hoàng hoặc phản đối trong câu hỏi.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và dễ hiểu. Viết hoa “Người” để chỉ Chúa Giê-su và dùng “con” trong lời thưa trực tiếp, theo cách xưng hô tự nhiên của tiếng Việt; không thêm danh xưng không có trong nguyên văn.
