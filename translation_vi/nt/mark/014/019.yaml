- from: 'Họ bắt đầu buồn rầu và lần lượt từng người nói với Người: “Chắc không phải là con chứ?”[a]'
  to: 'Họ bắt đầu buồn rầu và từng người một nói với Người: “Chắc không phải là tôi chứ?”[a]'
  rationale: Bản sửa chỉ thay đại từ tự xưng “con” bằng “tôi” để phản ánh ἐγώ mà không thêm sắc thái quan hệ. Các lựa chọn “bắt đầu”, “buồn rầu”, “từng người một”, và câu hỏi phủ định đều phù hợp với cú pháp, nghĩa, và sắc thái của bản Hy Lạp.
