  to: 'Kẻ phản bội Đức Chúa Jêsus đã cho họ một ám hiệu[a], nói: “Người nào tôi hôn thì chính là người ấy.[b] Hãy bắt lấy và áp giải người ấy đi cho chắc.”[c]'
  rationale: Chỉ điều chỉnh cách diễn đạt của ἀσφαλῶς để nó bổ nghĩa trực tiếp cho hành động áp giải, tránh hàm ý thêm một hành động canh gác tách biệt. Nghĩa và các chú thích còn lại được giữ nguyên.
