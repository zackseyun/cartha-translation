translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Ám hiệu,” “bắt lấy,” và “áp giải” giữ được tính khẩn cấp của cảnh bắt giữ. Các dấu chú thích [a], [b], [c] đều xuất hiện trong chính văn và đặt gần nội dung tương ứng.
