  text: δεδώκει δὲ ὁ παραδιδοὺς αὐτὸν σύσσημον αὐτοῖς λέγων· Ὃν ἂν φιλήσω αὐτός ἐστιν· κρατήσατε αὐτὸν καὶ ⸀ἀπάγετε ἀσφαλῶς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/044.yaml
  text: The one betraying him had given them a signal[a], saying, “The one I kiss is he[c][b]. Seize him and lead him away securely.”
translation:
  language: vi
  text: 'Kẻ phản bội Đức Chúa Jêsus đã cho họ một ám hiệu[a], nói: “Người nào tôi hôn thì chính là người ấy.[b] Hãy bắt lấy và áp giải người ấy đi cho chắc.”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “dấu hiệu”; từ Hy Lạp chỉ một dấu hiệu nhận diện đã được thỏa thuận trước.
    reason: lexical_alternative
  - marker: b
    text: Hôn là cách chào hỏi thông thường thời ấy; tại đây Giu-đa dùng nụ hôn làm ám hiệu để nhận diện Đức Chúa Jêsus.
    reason: cultural_note
  - marker: c
    text: Cũng có thể dịch là “đưa người ấy đi an toàn.” Trong văn cảnh này, ý có lẽ là phải khống chế và canh giữ thật chắc.
    reason: alternative_reading
lexical_decisions:
- source_word: δεδώκει
  choice: đã cho
  rationale: Thì quá khứ hoàn thành trong mạch kể cho thấy ám hiệu đã được thỏa thuận từ trước; tiếng Việt tự nhiên biểu đạt bằng “đã cho”.
- source_word: ὁ παραδιδοὺς αὐτόν
  choice: kẻ phản bội Đức Chúa Jêsus
  rationale: Phân từ chỉ người đang phản nộp ngài; “phản bội” truyền đạt đúng sức nặng trong văn cảnh. Dùng danh xưng để tránh đại từ mơ hồ khi câu đứng riêng.
- source_word: σύσσημον
  choice: một ám hiệu
  rationale: Từ này chỉ dấu hiệu nhận diện đã được thỏa thuận trước; “ám hiệu” tự nhiên và chính xác hơn từ rộng nghĩa “dấu hiệu”.
- source_word: λέγων
  choice: nói
  rationale: Giữ quan hệ trực tiếp giữa việc trao ám hiệu và nội dung lời dặn bằng cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: Ὃν ἂν φιλήσω
  choice: Người nào tôi hôn
  rationale: Giữ sắc thái bất định của mệnh đề quan hệ có ἄν và không thêm danh từ không có trong nguyên văn.
- source_word: αὐτός ἐστιν
  choice: thì chính là người ấy
  rationale: “Chính” thể hiện lực nhấn mạnh nhận diện của αὐτός, còn “người ấy” tự nhiên trong tiếng Việt.
- source_word: κρατήσατε
  choice: Hãy bắt lấy
  rationale: Diễn đạt hành động dùng sức khống chế, không thu hẹp nghĩa vào thủ tục pháp lý như “bắt giữ” theo nghĩa hành chính.
- source_word: ἀπάγετε
  choice: áp giải người ấy đi
  rationale: Trong bối cảnh bắt giữ, “áp giải” diễn đạt tự nhiên việc dẫn người bị khống chế rời khỏi nơi đó.
- source_word: ἀσφαλῶς
  choice: canh giữ cho chắc
  rationale: Trong văn cảnh này, trạng từ có khả năng nhấn mạnh việc giữ chắc để không thoát hơn là bảo đảm an toàn cho Đức Chúa Jêsus.
