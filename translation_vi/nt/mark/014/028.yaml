  text: ἀλλὰ μετὰ τὸ ἐγερθῆναί με προάξω ὑμᾶς εἰς τὴν Γαλιλαίαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/028.yaml
  text: But after I am raised[a], I will go ahead of you into Galilee.
translation:
  language: vi
  text: Nhưng sau khi tôi được làm cho sống lại[a], tôi sẽ đi trước anh em đến Ga-li-lê.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “sau khi tôi đã được làm cho sống lại.” Tiếng Hy Lạp dùng thể bị động của động từ “làm cho sống lại”, một cách diễn đạt thường dùng về sự phục sinh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Nhưng
  rationale: Liên từ đối lập với lời tiên báo trước đó về việc các môn đồ tan tác; “Nhưng” ngắn gọn và tự nhiên trong tiếng Việt.
- source_word: μετὰ τὸ ἐγερθῆναί με
  choice: sau khi tôi được làm cho sống lại
  rationale: Cấu trúc μετά với động từ nguyên mẫu có mạo từ diễn tả thời gian kế tiếp. Cách dịch này giữ cả ý “sau khi” lẫn thể bị động của động từ Hy Lạp.
- source_word: ἐγερθῆναί
  choice: được làm cho sống lại
  rationale: Đây là động từ nguyên mẫu aorist thể bị động của ἐγείρω. “Được làm cho sống lại” diễn đạt rõ thể bị động và ý nghĩa phục sinh, thay vì chuyển thành chủ động “sống lại”.
- source_word: προάξω
  choice: tôi sẽ đi trước
  rationale: Động từ tương lai chỉ việc đi trước những người khác đến một nơi; “đi trước” tự nhiên và giữ sắc thái phương hướng.
- source_word: ὑμᾶς
  choice: anh em
  rationale: Đại từ ngôi thứ hai số nhiều. “Anh em” thể hiện số nhiều trong lối xưng hô trang trọng, dễ hiểu, mà không thêm một danh xưng không có trong nguyên văn.
- source_word: εἰς τὴν Γαλιλαίαν
  choice: đến Ga-li-lê
  rationale: εἰς chỉ hướng chuyển động tới một địa điểm. Trong tiếng Việt, “đến Ga-li-lê” tự nhiên hơn “vào Ga-li-lê” trong ngữ cảnh này mà vẫn giữ đúng đích đến.
theological_decisions:
- issue: Cách diễn đạt sự phục sinh trong ἐγερθῆναί με
  choice: sau khi tôi được làm cho sống lại
  alternative: sau khi tôi sống lại
  rationale: Giữ thể bị động của nguyên văn, qua đó không âm thầm chuyển thành cách diễn đạt chủ động. Đồng thời, cụm từ vẫn truyền đạt rõ lời tiên báo về sự phục sinh.
translation_notes:
  register: Bản dịch dùng tiếng Việt hiện đại, trang trọng và dễ hiểu. “Anh em” giữ được đối tượng số nhiều; “Ga-li-lê” theo cách phiên âm quen thuộc. Thể bị động trong lời tiên báo phục sinh được bảo tồn dù câu dài hơn cách nói chủ động.
