  rationale: Chỉnh sửa tối thiểu nhằm tăng tính tự nhiên của tiếng Việt hiện đại và tránh liên tưởng không chủ ý của “tâm thần”, đồng thời giữ nguyên cấu trúc, ý nghĩa, và tính mơ hồ có chủ ý của nguyên văn. Chú thích được rút gọn về mặt văn phong nhưng vẫn giữ đầy đủ các lựa chọn từ vựng chính.
