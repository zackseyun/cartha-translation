  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: γρηγορεῖτε καὶ προσεύχεσθε, ἵνα μὴ ⸀ἔλθητε εἰς πειρασμόν· τὸ μὲν πνεῦμα πρόθυμον ἡ δὲ σὰρξ ἀσθενής.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/038.yaml
  text: Stay awake and pray[a], so that you may not enter into temptation. The spirit indeed is willing, but the flesh is weak.
translation:
  language: vi
  text: Hãy tỉnh thức và cầu nguyện[a], để anh em không rơi vào cám dỗ. Tinh thần thì sẵn lòng, nhưng xác thịt lại yếu đuối.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Cám dỗ” cũng có thể dịch là “thử thách” hoặc “thử luyện.”
    reason: lexical_alternative
lexical_decisions:
- source_word: γρηγορεῖτε
  choice: Hãy tỉnh thức
  rationale: Mệnh lệnh số nhiều mang nghĩa thức và canh chừng. “Tỉnh thức” tự nhiên trong văn cảnh Ghết-sê-ma-nê, giữ được cả ý không ngủ lẫn cảnh giác.
- source_word: προσεύχεσθε
  choice: cầu nguyện
  rationale: Mệnh lệnh hiện tại số nhiều kêu gọi hành động cầu nguyện tiếp diễn; tiếng Việt diễn đạt tự nhiên bằng “cầu nguyện”.
- source_word: ἵνα μὴ ἔλθητε εἰς πειρασμόν
  choice: để anh em khỏi sa vào sự cám dỗ
  rationale: ἵνα μή với động từ giả định diễn tả mục đích phòng ngừa. “Khỏi sa vào” là cách nói tự nhiên, đồng thời truyền đạt việc không bước vào hay bị cuốn vào cám dỗ.
- source_word: τὸ μὲν πνεῦμα πρόθυμον
  choice: Tâm thần thì sẵn lòng
  rationale: πνεῦμα trong thế đối lập với σάρξ nhiều khả năng chỉ phương diện nội tâm của con người. “Tâm thần” tránh đồng nhất với Đức Thánh Linh, còn “thì” thể hiện cấu trúc đối chiếu μέν...δέ.
- source_word: ἡ δὲ σὰρξ ἀσθενής
  choice: nhưng xác thịt lại yếu đuối
  rationale: “Xác thịt” bảo toàn hình ảnh nhân học của σάρξ và sự căng thẳng với tâm thần, không diễn giải thành “bản tính tội lỗi”; “yếu đuối” diễn tả đúng sự bất lực, mỏng giòn của con người.
theological_decisions:
- issue: Đối tượng quy chiếu của πνεῦμα
  choice: tâm thần của con người, tức ý hướng nội tâm
  alternative: Đức Thánh Linh
  rationale: Văn cảnh các môn đồ buồn ngủ và thế đối lập trực tiếp với “xác thịt” nghiêng về nội tâm con người; không viết hoa để tránh quyết định rằng từ này chỉ Đức Thánh Linh.
- issue: Ý nghĩa của σάρξ
  choice: xác thịt
  alternative: thân thể; bản tính tội lỗi
  rationale: Ở đây trọng tâm là sự yếu đuối của con người chứ không nhất thiết là một phạm trù giáo lý về bản tính tội lỗi. Cách dịch sát giữ nguyên sức căng thần học của câu.
- issue: Sắc thái của πειρασμόν
  choice: sự cám dỗ
  alternative: sự thử thách; cơn thử luyện
  rationale: Trong lời cảnh báo này, “cám dỗ” phù hợp nhất, nhưng từ Hy Lạp cũng có thể chỉ thử thách hay thử luyện nên ghi nhận trong chú thích.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “anh em” để biểu thị ngôi thứ hai số nhiều trong lời Đức Giê-su nói với các môn đồ; giữ cặp “tâm thần/xác thịt” nhằm bảo toàn cấu trúc đối lập của nguyên văn.
