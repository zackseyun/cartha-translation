  yaml_path: translation/nt/mark/014/051.yaml
  text: And a certain young man was following him[a], wearing only a linen cloth over his naked body, and they seize him,
translation:
  language: vi
  text: Có một thanh niên đang đi theo Đức Giê-su, trên thân trần chỉ quấn một tấm vải lanh[a]. Họ chụp lấy anh,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “một tấm vải lanh.” Từ Hy Lạp σινδών có thể chỉ một tấm vải, tấm khăn hoặc tấm phủ bằng vải lanh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: νεανίσκος τις
  choice: một thanh niên
  rationale: νεανίσκος chỉ một người nam trẻ tuổi; τις mang tính bất định và trong tiếng Việt được diễn đạt tự nhiên bằng “một”, không cần thêm từ gây gượng như “nào đó”.
- source_word: συνηκολούθει
  choice: đang đi theo
  rationale: Thì chưa hoàn thành diễn tả hành động đang tiếp diễn trong quá khứ; “đang đi theo” giữ được sắc thái này.
- source_word: αὐτῷ
  choice: Đức Giê-su
  rationale: Đại từ chỉ Đức Giê-su theo ngữ cảnh; nêu rõ tên giúp câu tiếng Việt sáng nghĩa vì trong câu còn có một nhân vật nam khác.
- source_word: περιβεβλημένος
  choice: khoác
  rationale: Phân từ diễn tả việc quấn hoặc mặc vật gì quanh người; “khoác” tự nhiên và phù hợp với một tấm vải.
- source_word: σινδόνα
  choice: một tấm vải gai
  rationale: σινδών chỉ một tấm vải lanh hoặc loại vải mịn có thể dùng như khăn hay vật che thân; “tấm vải gai” là cách gọi quen thuộc trong văn phong Kinh Thánh tiếng Việt, còn hình dạng chính xác được giữ mở trong chú thích.
- source_word: ἐπὶ γυμνοῦ
  choice: trên người chỉ
  rationale: Cụm từ cho biết tấm vải được khoác trực tiếp trên thân thể trần, không có y phục khác; cách diễn đạt “trên người chỉ khoác” truyền đạt tự nhiên mà không thô.
- source_word: κρατοῦσιν
  choice: Họ túm lấy
  rationale: Thì hiện tại lịch sử tạo sắc thái sống động; tách thành mệnh đề mới và dùng “túm lấy” giữ được hành động mạnh, cụ thể mà không diễn giải thành việc bắt giữ theo pháp lý.
- source_word: αὐτόν
  choice: anh
  rationale: Đại từ làm tân ngữ chỉ người thanh niên; “anh” là cách quy chiếu tự nhiên, trung tính theo ngữ cảnh.
