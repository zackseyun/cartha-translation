revisions:
- from: Có một thanh niên đang đi theo Đức Giê-su, trên người chỉ khoác một tấm vải gai[a]. Họ túm lấy anh,
  to: Có một thanh niên đang đi theo Đức Giê-su, trên thân trần chỉ quấn một tấm vải lanh[a]. Họ chụp lấy anh,
  rationale: Sửa «vải gai» thành «vải lanh» để phản ánh đúng phạm vi nghĩa của σινδών. Cách diễn đạt «trên thân trần chỉ quấn» biểu đạt ἐπὶ γυμνοῦ mà không thêm chi tiết về loại hoặc hình dạng chính xác của tấm vải. Giữ dấu phẩy cuối câu vì mệnh đề tiếp tục ở câu 52, đồng thời giữ sắc thái hiện tại lịch sử của κρατοῦσιν bằng «Họ chụp lấy».
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T09:00:06Z'
review_pass:
  verdict: revise
  source_fidelity: Bản nháp truyền đạt đúng nhân vật, hành động tiếp diễn «đang đi theo», và hiện tại lịch sử trong «Họ ... lấy anh». Tuy nhiên, «vải gai» thường chỉ vải thô từ sợi gai/bố, không tương ứng an toàn với σινδών, vốn chỉ vải lanh hoặc tấm vải bằng lanh. Cụm «trên người chỉ khoác» diễn đạt ý thân trần nhưng có thể làm rõ trực tiếp hơn mà vẫn giữ giọng trang trọng.
  naturalness: «Trên thân trần chỉ quấn một tấm vải lanh» là cách nói hiện đại, tự nhiên, và diễn tả rõ tấm vải được dùng trực tiếp trên thân thể. «Chụp lấy» phù hợp với hành động bất ngờ, mạnh của κρατοῦσιν và trang trọng hơn «túm lấy».
  terminology: Nên dùng «vải lanh» cho σινδών. Không nên dùng «vải gai», vì trong tiếng Việt hiện đại từ này gợi một loại chất liệu khác. «Đức Giê-su» phù hợp với quy chiếu ngữ cảnh và register của bản dịch.
  issues:
  - severity: medium
    issue: «một tấm vải gai» dịch sai/không an toàn về chất liệu của σινδών.
    rationale: σινδών được dùng cho vải lanh, tấm vải, hay tấm phủ bằng lanh; «vải gai» tiếng Việt thường là vải sợi gai thô hoặc bố, không phải tương đương từ vựng thích đáng.
  - severity: low
    issue: Chú thích nêu «vải gai» như một lựa chọn thay thế.
    rationale: Điều này lặp lại và củng cố sự lệch nghĩa về chất liệu; chú thích nên giữ các khả năng «tấm vải lanh», «tấm khăn/tấm phủ bằng vải lanh» mà không xác định hình dạng quá mức.
