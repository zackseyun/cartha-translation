  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Giữ diễn tiến sống động của câu Hy Lạp, đồng thời tránh xác định quá mức hình dạng của σινδών. Dấu phẩy cuối câu được giữ vì câu tiếp tục sang câu 52.
