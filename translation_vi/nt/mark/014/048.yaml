source:
  edition: SBLGNT
  text: καὶ ἀποκριθεὶς ὁ Ἰησοῦς εἶπεν αὐτοῖς· Ὡς ἐπὶ λῃστὴν ἐξήλθατε μετὰ μαχαιρῶν καὶ ξύλων συλλαβεῖν με;
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/048.yaml
  text: And Jesus answered and said to them[a], “Have you come out as against a robber, with swords and clubs, to arrest me?”
translation:
  language: vi
  text: 'Đức Giê-su đáp lời họ: “Các ông kéo đến với gươm và gậy để bắt tôi như bắt một tên cướp[a] sao?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể hiểu là “kẻ cướp có vũ trang”, “kẻ ngoài vòng pháp luật” hoặc “kẻ nổi loạn”; từ Hy Lạp λῃστής có thể chỉ một tên cướp hung bạo hay một người nổi dậy, chứ không chỉ là kẻ trộm.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς ... εἶπεν
  choice: đáp lời
  rationale: Cụm dẫn nhập lời nói theo lối kể chuyện Hy Lạp được diễn đạt tự nhiên trong tiếng Việt bằng “đáp lời”, tránh lặp cứng “đáp và nói” mà vẫn giữ ý Chúa Giê-su lên tiếng đáp lại hành động của họ.
- source_word: Ὡς ἐπὶ λῃστὴν
  choice: như bắt một tên cướp
  rationale: Cách diễn đạt này giữ ý họ đối xử với Chúa Giê-su như với một tội phạm nguy hiểm mà người ta phải mang vũ khí đến bắt.
- source_word: λῃστὴν
  choice: tên cướp
  rationale: “Tên cướp” rõ ràng, tự nhiên và phù hợp với sắc thái chỉ một kẻ cướp nguy hiểm; nghĩa rộng hơn, gồm cả kẻ cướp có vũ trang hoặc kẻ nổi loạn, được ghi ở chú thích.
- source_word: ἐξήλθατε
  choice: kéo đến
  rationale: Trong ngữ cảnh một đoàn người có vũ trang đến bắt Chúa Giê-su, “kéo đến” truyền đạt tự nhiên sắc thái họ cùng nhau tiến ra nhằm đối phó và bắt giữ ngài.
- source_word: μετὰ μαχαιρῶν καὶ ξύλων
  choice: với gươm và gậy
  rationale: “Gươm” là cách gọi quen thuộc cho μάχαιρα trong văn cảnh này; “gậy” thể hiện đúng công dụng làm vũ khí của ξύλα hơn nghĩa đen chung chung là những khúc gỗ.
- source_word: συλλαβεῖν
  choice: để bắt tôi
  rationale: “Bắt” diễn đạt rõ mục đích bắt giữ trong văn cảnh và tự nhiên hơn “tóm lấy” hoặc “bắt giữ tôi” trong câu nói trực tiếp.
theological_decisions:
- issue: Sắc thái của λῃστής trong câu hỏi tu từ về Chúa Giê-su
  choice: Dùng “tên cướp” trong chính văn và giữ nghĩa rộng hơn trong chú thích.
  alternative: “kẻ cướp có vũ trang”, “kẻ ngoài vòng pháp luật” hoặc “kẻ nổi loạn”
  rationale: Câu này không gọi Chúa Giê-su là kẻ phạm tội nhưng vạch rõ rằng họ đang đối xử với ngài như với một tội phạm bạo lực hay người nổi loạn. Chính văn giữ cách nói dễ hiểu, còn chú thích bảo toàn trường nghĩa lịch sử mà không buộc câu vào một cách hiểu duy nhất.
translation_notes:
  register: Văn phong hiện đại, trang trọng nhưng gần gũi. Câu hỏi tu từ được giữ nguyên; “các ông” phù hợp với lời trực tiếp nói với một nhóm người mà không thêm sắc thái tôn kính không có trong nguyên văn.
