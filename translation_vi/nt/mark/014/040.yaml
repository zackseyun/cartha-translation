  text: καὶ ⸂πάλιν ἐλθὼν εὗρεν αὐτοὺς⸃ καθεύδοντας, ἦσαν γὰρ ⸂αὐτῶν οἱ ὀφθαλμοὶ⸃ ⸀καταβαρυνόμενοι, καὶ οὐκ ᾔδεισαν τί ⸂ἀποκριθῶσιν αὐτῷ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/040.yaml
  text: And coming again[a], he found them sleeping, for their eyes were weighed down, and they did not know what they should answer him.
translation:
  language: vi
  text: Ngài lại đến và thấy họ đang ngủ, vì mắt họ trĩu nặng[a], và họ không biết phải trả lời Ngài thế nào.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “mắt họ bị đè nặng.” Từ Hy Lạp gợi hình ảnh đôi mắt đang bị một sức nặng đè xuống vì buồn ngủ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν ἐλθὼν
  choice: Ngài lại đến
  rationale: Diễn đạt tự nhiên hành động lặp lại; phân từ bất định ἐλθὼν chỉ hành động xảy ra trước động từ chính εὗρεν.
- source_word: εὗρεν αὐτοὺς καθεύδοντας
  choice: thấy họ đang ngủ
  rationale: Giữ sắc thái tiếp diễn của phân từ καθεύδοντας và tạo câu tiếng Việt tự nhiên.
- source_word: ἦσαν γὰρ αὐτῶν οἱ ὀφθαλμοὶ καταβαρυνόμενοι
  choice: vì mắt họ trĩu nặng
  rationale: Giữ hình ảnh đôi mắt bị sức nặng đè xuống, đồng thời dùng cách nói tiếng Việt tự nhiên để giải thích vì sao họ ngủ.
- source_word: οὐκ ᾔδεισαν
  choice: họ không biết
  rationale: Chuyển tải trực tiếp ý nghĩa về sự không biết, không diễn giải thành thiếu hiểu biết.
- source_word: τί ἀποκριθῶσιν αὐτῷ
  choice: phải trả lời Ngài thế nào
  rationale: Diễn đạt tự nhiên câu hỏi gián tiếp với động từ ở thể giả định, đồng thời giữ rõ đối tượng được trả lời.
