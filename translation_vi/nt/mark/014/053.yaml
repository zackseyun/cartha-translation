  text: Καὶ ἀπήγαγον τὸν Ἰησοῦν πρὸς τὸν ἀρχιερέα, καὶ ⸀συνέρχονται πάντες οἱ ἀρχιερεῖς καὶ οἱ πρεσβύτεροι καὶ οἱ γραμματεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/053.yaml
  text: And they led Jesus away to the high priest[a], and all the chief priests and the elders and the scribes gathered together.
translation:
  language: vi
  text: Họ dẫn Đức Giê-su đến trước thượng tế; tất cả các trưởng tế, trưởng lão và kinh sư đều tụ họp lại[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn Hy Lạp dùng dạng hiện tại “tụ họp lại” (hiện tại lịch sử), tạo nét sống động trong lời kể về quá khứ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπήγαγον
  choice: dẫn ... đến
  rationale: Động từ ἀπάγω chỉ việc dẫn hoặc đưa một người đi; trong ngữ cảnh Đức Giê-su đang bị bắt giữ, “dẫn ... đến” tự nhiên trong tiếng Việt mà không thêm chi tiết về cách áp giải.
- source_word: ἀρχιερέα
  choice: thượng tế
  rationale: Danh từ số ít chỉ vị đứng đầu hàng tư tế trong bối cảnh này; “thượng tế” phân biệt rõ với nhóm “các trưởng tế” ở phần sau.
- source_word: συνέρχονται
  choice: tụ họp lại
  rationale: Động từ chỉ việc cùng đến và nhóm họp. Dùng thì quá khứ theo mạch kể tự nhiên của tiếng Việt, đồng thời chú thích dạng hiện tại lịch sử của nguyên văn.
- source_word: πάντες
  choice: tất cả ... đều
  rationale: Cấu trúc “tất cả ... đều” truyền đạt rõ sắc thái bao quát của πάντες trong tiếng Việt hiện đại.
- source_word: ἀρχιερεῖς
  choice: các trưởng tế
  rationale: Ở số nhiều, từ này chỉ giới lãnh đạo tư tế, khác với vị “thượng tế” số ít vừa được nhắc đến.
- source_word: πρεσβύτεροι
  choice: trưởng lão
  rationale: Trong bối cảnh thể chế, từ này chỉ các lãnh đạo được công nhận chứ không đơn thuần là những người cao tuổi.
- source_word: γραμματεῖς
  choice: kinh sư
  rationale: Trong bối cảnh Do Thái giáo thời Tân Ước, “kinh sư” là cách gọi gọn, quen thuộc và phản ánh vai trò chuyên trách Kinh Luật của γραμματεῖς.
theological_decisions:
- issue: Dạng hiện tại lịch sử συνέρχονται trong lời kể quá khứ
  choice: 'Dịch theo mạch kể tiếng Việt: “tụ họp lại”'
  alternative: 'Giữ sắc thái hiện tại sống động: “tụ họp lại” trong một cấu trúc hiện tại kể chuyện'
  rationale: Đây là vấn đề văn phong kể chuyện, không phải một quyết định giáo lý. Tiếng Việt không đánh dấu hình thái thì như tiếng Hy Lạp; bản dịch diễn đạt sự kiện tự nhiên và ghi chú hiện tại lịch sử để không làm mất đặc điểm nguyên văn.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng các thuật ngữ Tin Mừng quen thuộc “thượng tế”, “trưởng tế”, “trưởng lão”, “kinh sư”; tránh lối dịch cổ và không thêm suy diễn về cơ cấu hay thủ tục xét xử.
