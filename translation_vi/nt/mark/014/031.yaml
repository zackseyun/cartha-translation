- from: Nhưng ông càng khăng khăng nói:[a] “Dù tôi phải cùng chết với Thầy,[b] tôi nhất định sẽ không chối Thầy.”[c] Mọi người khác cũng đều nói như vậy.
  to: Nhưng ông càng khăng khăng nói:[a] “Nếu tôi phải cùng chết với Thầy,[b] tôi nhất định sẽ không chối Thầy.”[c] Tất cả họ cũng đều nói như vậy.
