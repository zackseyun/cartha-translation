reference: Mark 14:31
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὁ δὲ ⸂ἐκπερισσῶς ἐλάλει⸃· Ἐὰν ⸂δέῃ με⸃ συναποθανεῖν σοι, οὐ μή σε ⸀ἀπαρνήσομαι. ὡσαύτως δὲ καὶ πάντες ἔλεγον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/031.yaml
  text: But he kept insisting all the more[a], “If I must die together with you[c][b], I will certainly not deny you.” And they all were saying the same thing.
translation:
  language: vi
  text: Nhưng ông càng khăng khăng nói:[a] “Nếu tôi phải cùng chết với Thầy,[b] tôi nhất định sẽ không chối Thầy.”[c] Tất cả họ cũng đều nói như vậy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Nhưng ông nói hết sức quả quyết.”'
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn: “cùng chết với Thầy.”'
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể dịch: “tôi sẽ không bao giờ chối Thầy.” Tiếng Hy Lạp dùng một cấu trúc phủ định rất mạnh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκπερισσῶς ἐλάλει
  choice: càng khăng khăng nói
  rationale: Trạng từ ἐκπερισσῶς nhấn mạnh mức độ gia tăng, còn thể chưa hoàn thành của ἐλάλει gợi hành động đang tiếp diễn hoặc lặp lại. Cách dịch này diễn đạt tự nhiên sự quả quyết ngày càng mạnh của Phi-e-rơ.
- source_word: Ἐὰν δέῃ με
  choice: Dù tôi phải
  rationale: δέῃ diễn tả sự cần thiết. Trong lời thề quyết liệt này, “Dù tôi phải” tự nhiên hơn “Nếu tôi phải” trong tiếng Việt mà vẫn giữ ý giả định về điều bắt buộc có thể xảy ra.
- source_word: συναποθανεῖν σοι
  choice: cùng chết với Thầy
  rationale: Động từ ghép có σύν nêu rõ việc chết cùng với người khác; “cùng chết với Thầy” giữ được sắc thái ấy và phù hợp với cách xưng hô của môn đồ với Chúa Giê-su.
- source_word: οὐ μή
  choice: nhất định sẽ không
  rationale: Cấu trúc phủ định mạnh οὐ μή được thể hiện bằng “nhất định sẽ không,” vừa rõ sức nhấn mạnh vừa tự nhiên trong tiếng Việt hiện đại.
- source_word: ἀπαρνήσομαι
  choice: chối
  rationale: Trong ngữ cảnh Phi-e-rơ về sau phủ nhận mình biết Chúa Giê-su, “chối” là cách dịch quen thuộc, gọn và chính xác; không hàm ý từ bỏ đức tin theo nghĩa rộng hơn.
- source_word: ὡσαύτως δὲ καὶ πάντες ἔλεγον
  choice: Mọi người khác cũng đều nói như vậy
  rationale: ὡσαύτως chỉ cùng một nội dung phát biểu, πάντες bao gồm toàn thể các môn đồ còn lại theo ngữ cảnh, và thể chưa hoàn thành ἔλεγον được diễn đạt bằng cấu trúc tự nhiên mà không ép quá mức sắc thái tiếp diễn.
theological_decisions:
- issue: Mức độ mạnh trong lời quả quyết của Phi-e-rơ
  choice: “tôi nhất định sẽ không chối Thầy”
  alternative: “tôi sẽ không bao giờ chối Thầy”
  rationale: Cách chọn giữ sức mạnh của οὐ μή và sự tự tin quả quyết của Phi-e-rơ trước thất bại sau đó, nhưng không thêm lời giải thích thần học hay làm dịu sự căng thẳng trần thuật.
- issue: Cách xưng hô với Chúa Giê-su
  choice: “tôi… Thầy”
  alternative: “con… Thầy” hoặc “tôi… Ngài”
  rationale: “Tôi… Thầy” là lối xưng hô tự nhiên, trang trọng vừa phải giữa môn đồ và người thầy trong tiếng Việt hiện đại, không đưa thêm sắc thái giáo phái hay quan hệ gia đình không được biểu thị trong tiếng Hy Lạp.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “khăng khăng” để truyền đạt lời phản đối liên tục và mạnh dần; giữ “cùng chết” nhằm phản ánh rõ tiền tố σύν; dùng “nhất định sẽ không” để bảo toàn sức phủ định mạnh. Tất cả ký hiệu chú thích [a], [b], [c] đều xuất hiện trong chính văn.
