  source_fidelity: 'Bản dịch giữ đúng trình tự: việc hát xảy ra trước hành động chính. Tuy nhiên, câu hiện tại “họ đi ra núi Ô-liu” chưa diễn đạt rõ giới từ đích đến εἰς (“đến/tới”); có thể bị hiểu là họ đi ra khỏi Núi Ô-liu.'
