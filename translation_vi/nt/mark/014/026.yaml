  text: And after singing a hymn[a], they went out to the Mount of Olives.
translation:
  language: vi
  text: Sau khi hát thánh ca[a], họ đi ra đến Núi Ô-liu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch sát hình thức hơn: “hát xong.” Phân từ Hy Lạp cho biết việc hát diễn ra trước khi họ đi ra.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: Sau khi
  rationale: Liên từ Καὶ kết hợp với phân từ ὑμνήσαντες để nối hành động hát với hành động chính; trong tiếng Việt, cấu trúc “Sau khi... ” diễn đạt tự nhiên trình tự trước–sau mà không cần dịch Καὶ thành một từ riêng.
- source_word: ὑμνήσαντες
  choice: hát thánh ca
  rationale: Phân từ bất định quá khứ của ὑμνέω chỉ việc hát một bài ca ngợi; “hát thánh ca” vừa tự nhiên vừa giữ sắc thái thờ phượng. Quan hệ thời gian trước động từ chính được thể hiện bằng “Sau khi”.
- source_word: ἐξῆλθον
  choice: họ đi ra
  rationale: Dịch sát nghĩa kể chuyện thông thường của ἐξέρχομαι, tránh nâng văn phong thành “khởi hành” hay “ra đi”.
- source_word: εἰς
  choice: đến
  rationale: Với địa điểm làm đích đến, εἰς được diễn đạt tự nhiên bằng “đến” trong tiếng Việt.
- source_word: τὸ Ὄρος τῶν Ἐλαιῶν
  choice: núi Ô-liu
  rationale: Tên địa danh quen dùng trong tiếng Việt cho Mount of Olives; “núi” phản ánh ὄρος, còn “Ô-liu” thể hiện τῶν Ἐλαιῶν.
