  yaml_path: translation/nt/mark/014/015.yaml
  text: And he himself will show you a large upper room[a], furnished and ready; prepare for us there.
translation:
  language: vi
  text: Chính ông ấy sẽ chỉ cho các anh một phòng lớn trên lầu[a], đã được bày biện và sẵn sàng; hãy chuẩn bị cho chúng ta tại đó.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “một phòng lớn ở tầng trên, đã được sắp đặt và sẵn sàng.” Từ ἐστρωμένον có thể chỉ căn phòng đã được bày biện hoặc chuẩn bị, chứ không chỉ đơn thuần là có đồ đạc.'
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτὸς
  choice: chính người ấy
  rationale: Đại từ mang sắc thái nhấn mạnh; cách dịch này giữ được ý chính người chủ nhà sẽ trực tiếp chỉ nơi đó.
- source_word: δείξει
  choice: sẽ chỉ cho
  rationale: Thể tương lai của δείκνυμι diễn tả việc cho người khác thấy hoặc chỉ ra.
- source_word: ἀνάγαιον μέγα
  choice: một căn phòng lớn trên lầu
  rationale: Chỉ một phòng rộng ở tầng trên của ngôi nhà; cách diễn đạt này tự nhiên và rõ ràng trong tiếng Việt hiện đại.
- source_word: ἐστρωμένον ἕτοιμον
  choice: đã được sắp đặt sẵn
  rationale: Hai từ mô tả căn phòng đã được bố trí và ở trạng thái sẵn sàng; cách dịch tránh giới hạn nghĩa vào việc chỉ có đồ đạc.
- source_word: ἐκεῖ
  choice: tại đó
  rationale: Giữ đúng ý nghĩa chỉ địa điểm của trạng từ.
- source_word: ἑτοιμάσατε
  choice: hãy chuẩn bị
  rationale: Mệnh lệnh số nhiều yêu cầu các môn đồ thực hiện việc chuẩn bị.
- source_word: ἡμῖν
  choice: cho chúng ta
  rationale: Giữ nguyên đại từ ngôi thứ nhất số nhiều mà không diễn giải thêm thành phần của nhóm.
