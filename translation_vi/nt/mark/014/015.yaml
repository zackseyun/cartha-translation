review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch chuyển tải đúng cấu trúc chính: chủ ngữ được nhấn mạnh, lời hứa ở thì tương lai, căn phòng ở trên lầu, tình trạng đã được chuẩn bị, và mệnh lệnh số nhiều “chuẩn bị cho chúng ta”. Tuy nhiên, “các con” thêm sắc thái quan hệ phụ tử không được thể hiện trong đại từ số nhiều ὑμῖν; nên dùng cách xưng hô trung tính hơn. Cụm “đã được sắp đặt sẵn” cũng gộp hai nét ἐστρωμένον và ἕτοιμον hơi chặt, dù không sai nghĩa.'
  naturalness: Câu văn nhìn chung tự nhiên, nhưng “Chính người ấy” hơi xa cách trong lời thuật lại một người cụ thể; “Chính ông ấy” tự nhiên hơn theo ngữ cảnh người chủ nhà nam. “Các anh” là lối xưng hô hiện đại, phù hợp với nhóm môn đồ nam trong ngữ cảnh và không thêm sắc thái phụ tử.
  terminology: “Phòng lớn trên lầu” truyền đạt tốt ἀνάγαιον μέγα. “Đã được bày biện và sẵn sàng” giữ riêng nét căn phòng được bày dọn/thu xếp (ἐστρωμένον) và ở trạng thái sẵn sàng (ἕτοιμον), không quy nghĩa chỉ vào đồ đạc. “Chuẩn bị cho chúng ta” giữ nguyên ἑτοιμάσατε ἡμῖν.
  issues:
  - severity: medium
    issue: “các con” cho ὑμῖν
    rationale: Nguyên ngữ chỉ dùng đại từ số nhiều “các anh/các bạn”, không diễn tả quan hệ cha-con. Dù ngữ cảnh là Đức Chúa Jêsus nói với môn đồ, “các con” là một lựa chọn diễn giải về quan hệ và giọng nói; “các anh” trung tính hơn và vẫn phù hợp ngữ cảnh.
  - severity: low
    issue: “đã được sắp đặt sẵn” gộp hai mô tả
    rationale: ἐστρωμένον và ἕτοιμον là hai bổ ngữ phối hợp. Cách dịch hiện tại có thể hiểu đúng, nhưng “đã được bày biện và sẵn sàng” phản ánh rõ hơn hai nét mà vẫn tự nhiên.
