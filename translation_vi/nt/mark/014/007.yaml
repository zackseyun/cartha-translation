  verdict: approve
  source_fidelity: 'Bản dịch bảo toàn đầy đủ các thành tố chính của nguyên văn: γάρ được nối bằng “Vì”; πάντοτε được lặp lại qua “luôn” và “không phải lúc nào cũng”; ὅταν θέλητε diễn đạt đúng tính bất định bằng “bất cứ khi nào muốn”; δύνασθε là khả năng thực hiện; và εὖ ποιῆσαι được chuyển là hành động đem ích lợi cho người nghèo. Thế tương phản giữa sự hiện diện thường xuyên của người nghèo và sự hiện diện không thường xuyên của Chúa Giê-su được giữ nguyên, không chuyển sang thì tương lai hay thêm diễn giải.'
  naturalness: Câu văn tự nhiên, hiện đại và có nhịp điệu phù hợp với lời nói trực tiếp. “Anh em” nhất quán với bối cảnh lời Chúa Giê-su nói cùng các môn đồ; “tôi” giữ sắc thái ngôi thứ nhất trung tính, không áp đặt cách xưng hô thần học ngoài nguyên văn. “Làm điều tốt cho họ” rõ nghĩa và không thu hẹp hành động thiện ích thành bố thí.
  terminology: “Người nghèo” phản ánh đúng tính từ được danh từ hóa τοὺς πτωχούς. Chú thích giải thích chính xác thành ngữ εὖ ποιεῖν là hành động đem lại ích lợi, thay vì chỉ thái độ thiện chí. Không có vấn đề về thuật ngữ thần học hoặc tên riêng.
