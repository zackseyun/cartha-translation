id: MRK.14.7
reference: Mark 14:7
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: πάντοτε γὰρ τοὺς πτωχοὺς ἔχετε μεθ’ ἑαυτῶν, καὶ ὅταν θέλητε δύνασθε ⸀αὐτοῖς εὖ ποιῆσαι, ἐμὲ δὲ οὐ πάντοτε ἔχετε·
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/007.yaml
  text: For you always have the poor with you[a], and whenever you want, you are able to do good to them; but you do not always have me.
translation:
  language: vi
  text: Vì anh em luôn có người nghèo ở bên mình, và bất cứ khi nào muốn, anh em đều có thể làm điều tốt cho họ[a]; nhưng anh em không phải lúc nào cũng có tôi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cụm từ Hy Lạp có nghĩa là hành động đem lại điều ích lợi cho họ, chứ không chỉ có thiện ý đối với họ.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντοτε
  choice: luôn / không phải lúc nào cũng
  rationale: Giữ sự lặp lại và thế tương phản của trạng từ trong hai vế, đồng thời diễn đạt tự nhiên bằng tiếng Việt.
- source_word: γὰρ
  choice: Vì
  rationale: Biểu thị lời giải thích cho phát biểu ngay trước đó mà không diễn giải quá mức quan hệ lập luận.
- source_word: τοὺς πτωχούς
  choice: người nghèo
  rationale: Diễn đạt tính từ được danh từ hóa, chỉ những người nghèo nói chung; tự nhiên và không thu hẹp thành một dạng thiếu thốn cụ thể.
- source_word: ἔχετε μεθ’ ἑαυτῶν
  choice: có ... ở bên mình
  rationale: Giữ ý về sự hiện diện và khả năng tiếp cận thường xuyên; cụm từ tự nhiên trong tiếng Việt hiện đại.
- source_word: ὅταν θέλητε
  choice: bất cứ khi nào muốn
  rationale: Thể hiện đúng điều kiện thời gian không xác định của ὅταν với động từ giả định.
- source_word: δύνασθε
  choice: đều có thể
  rationale: Diễn đạt khả năng hành động; từ “đều” làm câu tiếng Việt trôi chảy mà không thêm giới hạn vào khả năng ấy.
- source_word: αὐτοῖς εὖ ποιῆσαι
  choice: làm điều tốt cho họ
  rationale: Giữ nghĩa của thành ngữ là hành động đem lại ích lợi cho họ, không thu hẹp chỉ còn bố thí hay cảm tình thiện chí.
- source_word: ἐμὲ δὲ
  choice: nhưng ... tôi
  rationale: Giữ rõ sự tương phản giữa sự hiện diện của người nghèo và sự hiện diện của Chúa Giê-su.
- source_word: οὐ πάντοτε ἔχετε
  choice: không phải lúc nào cũng có
  rationale: Bám sát thì hiện tại và phạm vi phủ định của nguyên văn, tránh chuyển thành thì tương lai mang tính diễn giải.
theological_decisions:
- issue: Có thể bị hiểu là Chúa Giê-su xem nhẹ việc chăm lo cho người nghèo
  choice: Giữ nguyên sự tương phản về tính thường xuyên của sự hiện diện, đồng thời câu giữa khẳng định cơ hội làm điều tốt cho người nghèo.
  alternative: Diễn đạt câu như thể sự tận hiến cho Chúa Giê-su loại trừ hoặc hạ thấp trách nhiệm đối với người nghèo.
  rationale: Nguyên văn nói rõ rằng họ có thể làm điều tốt cho người nghèo bất cứ khi nào muốn. Vì vậy, bản dịch không biến sự tương phản mang tính thời điểm và hoàn cảnh thành lời phủ nhận lòng thương xót.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “anh em” cho ngôi thứ hai số nhiều trong lời Chúa Giê-su nói với các môn đồ; dùng “tôi” để tránh tự ý nâng hoặc hạ sắc thái đại từ ngôi thứ nhất của nguyên văn.
