  rationale: Chỉnh nhẹ để nhất quán đăng ký xưng hô và để các chú thích phản ánh chính xác hơn các lựa chọn dịch thuật. Bản văn chính vẫn giữ nguyên sự mơ hồ có chủ ý của ὑπέρ, không thêm “mới” vào “giao ước,” và không biến hình ảnh “huyết” thành diễn giải khác.
