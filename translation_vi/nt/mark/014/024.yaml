source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτοῖς· Τοῦτό ἐστιν τὸ αἷμά μου ⸀τῆς διαθήκης τὸ ⸂ἐκχυννόμενον ὑπὲρ πολλῶν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/024.yaml
  text: And he said to them[a], “This is my blood of the covenant[c][b], which is poured out for many.”
translation:
  language: vi
  text: 'Ngài nói với họ: “Đây là huyết Ta, huyết của giao ước[a], được đổ ra[b] vì nhiều người[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Một số thủ bản và các phân đoạn song song chép: “huyết Ta, huyết của giao ước mới.” Bản Hy Lạp của Mác tại đây chỉ có: “huyết Ta, huyết của giao ước.”'
    reason: textual_variant
  - marker: b
    text: 'Cũng có thể dịch: “đang được đổ ra”; theo cách dịch truyền thống: “đổ huyết.”'
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể dịch: “vì lợi ích của nhiều người.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῦτό ἐστιν
  choice: Đây là
  rationale: Giữ nguyên cấu trúc liên kết trực tiếp của tiếng Hy Lạp, không diễn giải thành “điều này tượng trưng cho” hay “điều này có nghĩa là”.
- source_word: τὸ αἷμά μου
  choice: huyết của ta
  rationale: Giữ hình ảnh về huyết vốn được nêu rõ trong văn cảnh giao ước và hiến tế; “huyết” phù hợp với văn phong Kinh Thánh trang trọng hơn “máu” trong câu này.
- source_word: τῆς διαθήκης
  choice: huyết của giao ước
  rationale: διαθήκη trong văn cảnh này chỉ giao ước, gợi lại ngôn ngữ lập giao ước; bản SBLGNT không có từ “mới”.
- source_word: ἐκχυννόμενον
  choice: được đổ ra
  rationale: Diễn đạt tự nhiên phân từ hiện tại bị động bổ nghĩa cho “huyết”, đồng thời giữ hình ảnh hiến tế thay vì thay bằng một cách diễn giải rộng hơn như “hy sinh”.
- source_word: ὑπὲρ πολλῶν
  choice: vì nhiều người
  rationale: Cách nói tự nhiên trong tiếng Việt, giữ được ý lợi ích hoặc đại diện của ὑπέρ mà không xác định quá mức một học thuyết chuộc tội cụ thể; đồng thời giữ nguyên “nhiều người”, không đổi thành “mọi người”.
theological_decisions:
- issue: Nghĩa giao ước hay di chúc của διαθήκη
  choice: giao ước
  alternative: di chúc
  rationale: Ngôn ngữ về huyết trong Bữa Ăn Cuối Cùng vọng lại việc lập giao ước, đặc biệt Xuất Hành 24:8; “di chúc” không phù hợp với hình ảnh trực tiếp này.
- issue: Có thêm “mới” trước “giao ước” hay không
  choice: giao ước
  alternative: giao ước mới
  rationale: SBLGNT tại Mác 14:24 không có καινῆς (“mới”), nên bản dịch không hòa đồng câu này với các truyền thống song song. Dị bản được ghi ở chú thích.
- issue: Phạm vi hàm ý của ὑπὲρ πολλῶν
  choice: vì nhiều người
  alternative: vì mọi người; thay cho nhiều người
  rationale: Giữ nguyên “nhiều người” của câu Hy Lạp và không dùng bản dịch để giải quyết tranh luận thần học rộng hơn; “vì” cũng không thu hẹp cấu trúc này vào chỉ một cách giải thích về sự chuộc tội.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” và “ta” phù hợp lời Đức Chúa Jesus trong văn cảnh; dùng “huyết” để giữ sắc thái giao ước và hiến tế. Cấu trúc lặp “huyết của ta, huyết của giao ước” giúp tiếng Việt tự nhiên hơn mà vẫn phản ánh quan hệ sở hữu trong nguyên văn.
