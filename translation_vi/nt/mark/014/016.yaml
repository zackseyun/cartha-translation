source:
  edition: SBLGNT
  text: καὶ ἐξῆλθον οἱ ⸀μαθηταὶ καὶ ἦλθον εἰς τὴν πόλιν καὶ εὗρον καθὼς εἶπεν αὐτοῖς, καὶ ἡτοίμασαν τὸ πάσχα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/016.yaml
  text: And the disciples went out and came into the city[a], and found it just as he had told them, and they prepared the Passover.
translation:
  language: vi
  text: Các môn đồ ra đi, vào thành và thấy mọi sự đúng như Ngài đã nói với họ; rồi họ chuẩn bị lễ Vượt Qua.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể hiểu là “bữa ăn Vượt Qua.” Từ Hy Lạp có thể chỉ lễ Vượt Qua nói chung hoặc, trong văn cảnh này, bữa ăn đang được chuẩn bị.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθον
  choice: ra đi
  rationale: Diễn đạt việc các môn đồ rời nơi trước đó; tự nhiên trong tiếng Việt và không thêm chi tiết về điểm xuất phát.
- source_word: οἱ μαθηταὶ
  choice: các môn đồ
  rationale: Thuật ngữ quen thuộc trong văn cảnh Phúc Âm, chỉ những người theo học và đi theo Chúa Giê-su.
- source_word: ἦλθον εἰς τὴν πόλιν
  choice: vào thành
  rationale: Chuyển tải hướng đi vào bên trong thành; tiếng Việt không cần lặp một động từ chuyển động tương đương với ‘đến’ sau ‘ra đi’.
- source_word: εὗρον
  choice: thấy mọi sự
  rationale: Tân ngữ không được nêu rõ trong tiếng Hy Lạp; ‘mọi sự’ diễn đạt tự nhiên rằng hoàn cảnh họ gặp đúng như lời đã báo, mà không giới hạn vào một vật cụ thể.
- source_word: καθὼς εἶπεν αὐτοῖς
  choice: đúng như Ngài đã nói với họ
  rationale: καθώς nêu sự tương ứng chính xác, còn ‘đã nói’ thể hiện lời chỉ dẫn xảy ra trước sự việc này.
- source_word: ἡτοίμασαν
  choice: chuẩn bị
  rationale: Cách diễn đạt trực tiếp và tự nhiên cho hành động làm sẵn những điều cần thiết.
- source_word: τὸ πάσχα
  choice: lễ Vượt Qua
  rationale: Giữ phạm vi nghĩa của từ Hy Lạp, có thể chỉ kỳ lễ nói chung hoặc, theo văn cảnh, bữa ăn Vượt Qua.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dấu chấm phẩy giúp thể hiện bước chuyển từ việc tìm thấy hoàn cảnh đúng như lời báo sang việc chuẩn bị lễ. Đại từ “Ngài” có chủ thể là Chúa Giê-su theo văn cảnh gần.
