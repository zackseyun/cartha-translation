  yaml_path: translation/nt/mark/014/039.yaml
  text: And again he went away and prayed[b][a], saying the same words.
translation:
  language: vi
  text: Ngài lại đi ra và cầu nguyện, lặp lại cùng một lời ấy.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “nói lại cùng một điều ấy” hoặc “cầu nguyện bằng những lời như trước.” Tiếng Hy Lạp dùng danh từ số ít λόγος, nghĩa đen là “cùng một lời,” để chỉ nội dung lời cầu nguyện được lặp lại.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν
  choice: lại
  rationale: Diễn đạt tự nhiên hành động được lặp lại trong mạch kể.
- source_word: ἀπελθὼν
  choice: đi ra
  rationale: Phân từ bất định chỉ việc Ngài rời chỗ các môn đồ trước khi cầu nguyện; “đi ra” tự nhiên trong ngữ cảnh.
- source_word: προσηύξατο
  choice: cầu nguyện
  rationale: Cách dịch chuẩn, rõ ràng của προσεύχομαι; thể trung không cần biểu đạt riêng trong tiếng Việt.
- source_word: τὸν αὐτὸν λόγον
  choice: cùng một lời ấy
  rationale: Giữ hình thức số ít của λόγος nhưng để “lời” chỉ toàn bộ nội dung lời cầu nguyện, không nhất thiết là một từ đơn lẻ.
- source_word: εἰπών
  choice: lặp lại
  rationale: Trong cấu trúc này, phân từ “nói” cho biết Ngài cầu nguyện bằng cùng nội dung trước đó; “lặp lại” truyền đạt tự nhiên quan hệ ấy mà không tạo cách diễn đạt thừa như “cầu nguyện, nói”.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “Ngài” phù hợp với cách gọi Chúa Giê-su trong văn mạch. Câu tránh lối dịch máy móc “cầu nguyện, nói cùng một lời,” đồng thời chú thích bảo tồn sắc thái số ít và phạm vi nghĩa của λόγος.
