translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu nói trực tiếp giữ nét ngắn gọn, dè chừng của nguyên văn; “Đừng làm” phục hồi động từ bị tỉnh lược để tiếng Việt rõ nghĩa.
