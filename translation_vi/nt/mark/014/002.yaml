  source_fidelity: Bản nháp giữ đúng liên từ giải thích γάρ, sắc thái đang tiếp diễn của ἔλεγον, mệnh lệnh phủ định tỉnh lược, và mối lo ngại được μήποτε nêu ra. Tuy nhiên, “nổi loạn” thường chỉ hành vi nổi dậy hoặc phản loạn, mạnh và cụ thể hơn θόρυβος, vốn nói đến sự náo động/ồn ào, hỗn loạn công cộng. Cách sửa tránh thêm ý về một cuộc nổi dậy có tổ chức.
