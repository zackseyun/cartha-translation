base_translation:
  language: en
  yaml_path: translation/nt/mark/014/002.yaml
  text: For they were saying[a], “Not during the feast, lest there be an uproar from the people.”
translation:
  language: vi
  text: 'Vì họ đang nói: “Đừng làm vào dịp lễ, kẻo dân chúng náo động[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “kẻo xảy ra náo động giữa dân chúng.” Sở hữu cách Hy Lạp τοῦ λαοῦ có thể chỉ sự náo động phát sinh từ dân chúng hoặc xảy ra giữa họ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγον
  choice: họ đang nói
  rationale: Thì chưa hoàn thành diễn tả lời bàn đang tiếp diễn trong bối cảnh; cách dịch này tự nhiên và giữ được sắc thái ấy.
- source_word: γάρ
  choice: Vì
  rationale: Giữ chức năng giải thích cho câu trước của liên từ Hy Lạp.
- source_word: Μὴ
  choice: Đừng làm
  rationale: Nguyên văn là một lời phủ định tỉnh lược, hàm ý không thực hiện âm mưu đã nói ở câu trước; tiếng Việt cần bổ sung “làm” để câu tự nhiên mà không xác định quá mức hành động.
- source_word: ἐν τῇ ἑορτῇ
  choice: trong kỳ lễ
  rationale: ἐν mang nghĩa thời gian; “kỳ lễ” chỉ khoảng thời gian của lễ được nêu trong văn cảnh.
- source_word: μήποτε
  choice: kẻo
  rationale: Diễn đạt tự nhiên kết quả đáng lo mà họ muốn tránh.
- source_word: ἔσται θόρυβος
  choice: nổi loạn
  rationale: θόρυβος chỉ tình trạng náo động, hỗn loạn công khai; “nổi loạn” phù hợp văn cảnh nhưng không nhất thiết hàm ý một cuộc khởi nghĩa có tổ chức.
- source_word: τοῦ λαοῦ
  choice: dân chúng
  rationale: Danh từ chỉ dân chúng/đám đông; quan hệ sở hữu cách với θόρυβος vẫn có thể được hiểu là sự náo loạn phát sinh từ họ hoặc xảy ra giữa họ, nên có chú thích.
