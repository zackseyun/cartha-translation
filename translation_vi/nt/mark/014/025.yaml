source:
  edition: SBLGNT
  text: ἀμὴν λέγω ὑμῖν ὅτι οὐκέτι οὐ μὴ πίω ἐκ τοῦ γενήματος τῆς ἀμπέλου ἕως τῆς ἡμέρας ἐκείνης ὅταν αὐτὸ πίνω καινὸν ἐν τῇ βασιλείᾳ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/025.yaml
  text: Truly I tell you[c][b][a], I will certainly not drink again from the fruit of the vine until that day when I drink it new in the kingdom of God.
translation:
  language: vi
  text: 'Quả thật, tôi bảo anh em: tôi tuyệt đối sẽ không còn uống sản vật của cây nho nữa[a][b] cho đến ngày ấy, khi tôi uống thứ ấy một cách mới mẻ[c] trong vương quốc Đức Chúa Trời.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Tôi sẽ không bao giờ uống sản vật của cây nho nữa.” Tiếng Hy Lạp dùng một phép phủ định đặc biệt mạnh.'
    reason: lexical_alternative
  - marker: b
    text: Nguyên văn là “sản vật của cây nho”, tức thức uống từ cây nho được dùng trong bữa ăn.
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể dịch: “khi tôi lại uống thứ ấy.” Tính từ Hy Lạp có nghĩa là “mới” và có thể hàm ý sự mới mẻ trong thời kỳ cánh chung.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀμὴν
  choice: Quả thật
  rationale: Trong công thức trang trọng ἀμὴν λέγω ὑμῖν, “Quả thật” truyền đạt lời xác quyết rõ ràng và tự nhiên cho độc giả Việt hiện đại.
- source_word: λέγω ὑμῖν
  choice: tôi bảo anh em
  rationale: Giữ lời nói trực tiếp với các môn đồ và sắc thái long trọng, đồng thời tự nhiên hơn lối dịch sát chữ “tôi nói với anh em” trong ngữ cảnh này.
- source_word: οὐκέτι οὐ μὴ πίω
  choice: Tôi tuyệt đối sẽ không còn uống ... nữa
  rationale: “Không còn ... nữa” diễn đạt οὐκέτι, còn “tuyệt đối” chuyển tải phép phủ định tương lai đặc biệt mạnh οὐ μή với động từ ở thể giả định.
- source_word: ἐκ τοῦ γενήματος τῆς ἀμπέλου
  choice: sản vật của cây nho
  rationale: Giữ cách diễn đạt của tiếng Hy Lạp và không thu hẹp nghĩa thành “rượu”, dù trong ngữ cảnh cụm từ chỉ thức uống dùng trong bữa ăn.
- source_word: ἕως τῆς ἡμέρας ἐκείνης
  choice: cho đến ngày ấy
  rationale: Chuyển tải trực tiếp giới hạn thời gian và giữ lực chỉ định của ἐκείνης.
- source_word: ὅταν αὐτὸ πίνω
  choice: khi tôi uống thứ ấy
  rationale: “Khi” phù hợp với một biến cố tương lai được hướng tới; “thứ ấy” quy chiếu về sản vật của cây nho vừa được nhắc đến.
- source_word: καινὸν
  choice: cách mới mẻ
  rationale: Giữ ý niệm về sự mới mà không xác định dứt khoát đó là uống lại hay là sự mới về phẩm chất trong thời kỳ cánh chung.
- source_word: ἐν τῇ βασιλείᾳ τοῦ θεοῦ
  choice: trong vương quốc Đức Chúa Trời
  rationale: Giữ nguyên cách gọi thần học quen thuộc của Tân Ước, không diễn giải thêm bản chất hay thời điểm của vương quốc.
theological_decisions:
- issue: Ý nghĩa của καινὸν trong mệnh đề cuối
  choice: Dịch là “cách mới mẻ”, để ngỏ bản chất của sự mới.
  alternative: “lại uống thứ ấy” hoặc “uống thứ ấy như một thức uống mới”
  rationale: καινός có thể nhấn mạnh sự mới về tính chất, nhưng trong cấu trúc này cũng có thể được hiểu gần với “một lần nữa/theo cách mới”. Bản dịch chính không giải quyết thay cho nguyên văn sự căng thẳng mang tính cánh chung này.
- issue: Vật được chỉ bởi “sản vật của cây nho”
  choice: Giữ thành ngữ “sản vật của cây nho”.
  alternative: “rượu nho” hoặc “thức uống từ cây nho”
  rationale: Ngữ cảnh cho thấy đây là thứ trong chén được uống ở bữa ăn, nhưng nguyên văn không trực tiếp dùng từ “rượu”; vì vậy không nên cụ thể hóa quá mức.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu giữ công thức tuyên bố long trọng của Đức Chúa Jêsus, lực phủ định mạnh, thành ngữ về cây nho và sự mơ hồ có chủ ý của καινόν; tránh dùng “rượu” trong câu chính để không cụ thể hóa hơn nguyên văn.
