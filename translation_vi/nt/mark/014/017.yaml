  text: Καὶ ὀψίας γενομένης ἔρχεται μετὰ τῶν δώδεκα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/017.yaml
  text: And when evening came[a], he comes with the twelve.
translation:
  language: vi
  text: Và đến chiều tối, Ngài đến cùng Mười Hai.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc dịch: “cùng với mười hai người.” “Mười Hai” có thể là danh xưng chỉ nhóm mười hai người đi cùng Ngài.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: Khi
  rationale: Trong mạch kể này, liên từ nối Καί được diễn đạt tự nhiên qua mệnh đề thời gian mở đầu; không cần thêm “và” vốn dễ làm câu tiếng Việt nặng nề.
- source_word: ὀψίας γενομένης
  choice: chiều tối đến
  rationale: Cụm sở hữu cách tuyệt đối nêu hoàn cảnh thời gian. Cách dịch này tự nhiên và giữ hình ảnh thời điểm chiều tối bắt đầu.
- source_word: ἔρχεται
  choice: Ngài đến
  rationale: Động từ hiện tại tạo lối kể sống động đặc trưng của Mác. Tiếng Việt không bắt buộc đánh dấu thì, nên “đến” vừa tự nhiên vừa không làm mất hiệu ứng hiện tại lịch sử.
- source_word: μετὰ τῶν δώδεκα
  choice: cùng với mười hai người
  rationale: μετά với sở hữu cách chỉ sự đồng hành. Thêm “người” giúp câu rõ và tự nhiên trong tiếng Việt mà không diễn giải họ thành “môn đồ” hay “sứ đồ” ngay trong chính văn.
theological_decisions:
- issue: Đối tượng được gọi là “mười hai người”
  choice: Giữ cách gọi ngắn gọn “mười hai người”, chỉ nhóm thân cận gồm mười hai người của Đức Chúa Jêsus, trong đó ở thời điểm này có cả Giu-đa.
  alternative: Nhóm Mười Hai
  rationale: Nguyên văn dùng con số với mạo từ và có thể được hiểu như tên gọi đã được thừa nhận của nhóm. Chính văn giữ hình thức trực tiếp, còn chú thích nêu cách dịch mang tính danh xưng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Ngài” duy trì chủ thể đã có trong ngữ cảnh mà không thêm danh xưng không xuất hiện trong câu Hy Lạp; “cùng với” tránh khả năng hiểu “đến với” là đi tới gặp nhóm người ấy.
