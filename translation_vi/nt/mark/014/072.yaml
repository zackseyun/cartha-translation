source:
  edition: SBLGNT
  text: καὶ ⸀εὐθὺς ἐκ δευτέρου ἀλέκτωρ ἐφώνησεν· καὶ ἀνεμνήσθη ὁ Πέτρος τὸ ῥῆμα ⸀ὡς εἶπεν αὐτῷ ὁ Ἰησοῦς ὅτι Πρὶν ἀλέκτορα ⸂φωνῆσαι δὶς τρίς με ἀπαρνήσῃ⸃, καὶ ἐπιβαλὼν ἔκλαιεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/072.yaml
  text: And immediately a rooster crowed a second time. And Peter remembered the word[a], how Jesus had said to him, “Before a rooster crows twice, you will deny me three times.” And breaking down, he wept.
translation:
  language: vi
  text: 'Gà vừa gáy lần thứ hai thì Phi-e-rơ nhớ lại lời Giê-su đã nói với ông: “Trước khi gà gáy hai lần, con sẽ chối Ta ba lần.” Rồi ông suy sụp và khóc.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Phân từ Hy Lạp được dịch là “suy sụp” có nghĩa không chắc chắn. Cũng có thể hiểu: “khi nghĩ đến điều ấy, ông khóc”; các cách hiểu khác liên hệ cụm này với một cử chỉ bên ngoài.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθὺς
  choice: ngay lập tức
  rationale: Giữ sắc thái tức thời và nhịp kể khẩn trương đặc trưng của Mác.
- source_word: ἐκ δευτέρου
  choice: lần thứ hai
  rationale: Diễn đạt rõ số lần được nêu tường minh trong tiếng Hy Lạp; kết hợp với “lại” cho câu tiếng Việt tự nhiên.
- source_word: ἀλέκτωρ ἐφώνησεν
  choice: gà gáy
  rationale: Trong tiếng Việt, “gà gáy” là cách nói tự nhiên; ngữ cảnh xác định đây là gà trống nên không cần diễn đạt dài hơn.
- source_word: ἀνεμνήσθη
  choice: nhớ lại
  rationale: Diễn đạt tự nhiên việc Phi-e-rơ hồi tưởng lời đã được nói trước đó.
- source_word: τὸ ῥῆμα ὡς εἶπεν αὐτῷ ὁ Ἰησοῦς
  choice: lời Đức Chúa Jêsus đã nói với ông
  rationale: Gộp cấu trúc Hy Lạp thành câu tiếng Việt sáng rõ mà vẫn giữ “lời” và quan hệ người nói-người nghe.
- source_word: Πρὶν ἀλέκτορα φωνῆσαι δὶς
  choice: Trước khi gà gáy hai lần
  rationale: Giữ nguyên mệnh đề thời gian và số lần; “gà gáy” tự nhiên hơn việc buộc phải thêm mạo từ vốn không có trong tiếng Việt.
- source_word: τρίς με ἀπαρνήσῃ
  choice: con sẽ chối Ta ba lần
  rationale: “Chối” giữ lực quan hệ của ἀπαρνέομαι và là cách diễn đạt quen thuộc, trang trọng trong văn cảnh Kinh Thánh.
- source_word: ἐπιβαλὼν
  choice: suy sụp
  rationale: Phân từ này rất khó hiểu chắc chắn; “suy sụp” truyền đạt sự bùng vỡ cảm xúc trong văn cảnh nhưng không áp đặt một cử chỉ thể lý cụ thể.
- source_word: ἔκλαιεν
  choice: khóc
  rationale: Động từ ở thì chưa hoàn thành gợi hành động kéo dài; tiếng Việt có thể diễn đạt tự nhiên bằng “khóc” sau “rồi” mà không làm câu nặng nề.
theological_decisions:
- issue: Cách hiểu phân từ khó ἐπιβαλών
  choice: “suy sụp và khóc” trong chính văn
  alternative: “khi nghĩ đến điều ấy, ông khóc”; hoặc những cách hiểu liên quan đến một cử chỉ thể lý như che đầu
  rationale: Vấn đề chủ yếu thuộc từ vựng và cú pháp nhưng ảnh hưởng đến cách miêu tả phản ứng của Phi-e-rơ. Chính văn truyền đạt sức nặng cảm xúc mà không khẳng định một cử chỉ không chắc chắn; chú thích bảo tồn tính mơ hồ thực sự của nguyên bản.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Phi-e-rơ” và “Đức Chúa Jêsus”; trong lời trực tiếp dùng “con/Ta” để thể hiện quan hệ thầy-trò. Dấu chú thích [a] được đặt ngay sau mệnh đề chịu ảnh hưởng của cách hiểu ἐπιβαλών.
