  text: εἴ τις ἔχει ὦτα ἀκούειν ἀκουέτω.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/023.yaml
  text: If anyone has ears to hear[a], let him hear.
translation:
  language: vi
  text: Nếu ai có tai để nghe, hãy nghe.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἴ τις
  choice: Nếu ai
  rationale: Giữ cấu trúc điều kiện và tính khái quát của tiếng Hy Lạp, đồng thời tự nhiên trong tiếng Việt hiện đại.
- source_word: ἔχει
  choice: có
  rationale: Diễn đạt trực tiếp động từ chỉ sự sở hữu.
- source_word: ὦτα
  choice: tai
  rationale: Danh từ Hy Lạp ở số nhiều, nhưng tiếng Việt tự nhiên dùng danh từ không đánh dấu số trong thành ngữ này; ý nghĩa vẫn là cơ quan nghe.
- source_word: ἀκούειν
  choice: để nghe
  rationale: Diễn đạt mục đích hoặc khả năng, đồng thời giữ nguyên động từ để tạo sự lặp lại với mệnh lệnh theo sau.
- source_word: ἀκουέτω
  choice: hãy nghe
  rationale: Chuyển tải mệnh lệnh ngôi thứ ba số ít bằng kết cấu mệnh lệnh tự nhiên trong tiếng Việt; “nghe” giữ được sự lặp từ và hàm ý tiếp nhận lời nói.
theological_decisions:
- issue: Chủ thể số ít mang nghĩa khái quát trong mệnh lệnh
  choice: hãy nghe
  alternative: người ấy hãy nghe
  rationale: Tiếng Việt có thể dùng mệnh lệnh lược chủ ngữ sau mệnh đề “Nếu ai...” mà vẫn quy chiếu rõ đến từng cá nhân; cách này giữ nghĩa số ít khái quát mà không thêm dấu chỉ giới tính vốn không có trong τις.
translation_notes:
  register: Văn phong ngắn gọn, trang trọng và tự nhiên. Bản dịch giữ cấu trúc điều kiện cùng phép lặp “nghe... nghe” của nguyên văn; không cần chú thích vì tiếng Việt không gặp vấn đề đại từ mang giới như tiếng Anh.
