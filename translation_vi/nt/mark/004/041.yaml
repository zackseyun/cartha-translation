  text: καὶ ἐφοβήθησαν φόβον μέγαν, καὶ ἔλεγον πρὸς ἀλλήλους· Τίς ἄρα οὗτός ἐστιν ὅτι καὶ ὁ ἄνεμος καὶ ἡ θάλασσα ⸀ὑπακούει αὐτῷ;
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/041.yaml
  text: And they feared a great fear[a], and they said to one another, “Who then is this, that even the wind and the sea obey him?”
translation:
  language: vi
  text: 'Họ vô cùng sợ hãi[a] và nói với nhau: “Vậy người này là ai mà ngay cả gió và biển cũng vâng lời người?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sát chữ: “họ sợ một nỗi sợ lớn.” Tiếng Hy Lạp dùng lối diễn đạt tăng cường.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐφοβήθησαν φόβον μέγαν
  choice: vô cùng sợ hãi
  rationale: Động từ đi với tân ngữ đồng gốc tạo sắc thái nhấn mạnh. Cách dịch này giữ cường độ mạnh mà vẫn tự nhiên trong tiếng Việt hiện đại; chú thích nêu cấu trúc sát chữ.
- source_word: ἔλεγον
  choice: nói
  rationale: Thì chưa hoàn thành có thể gợi hành động đang diễn ra hoặc lặp lại, nhưng trong lối kể chuyện tiếng Việt, “nói” diễn đạt tự nhiên mà không loại trừ sắc thái ấy.
- source_word: πρὸς ἀλλήλους
  choice: với nhau
  rationale: 'Diễn đạt tự nhiên ý tương hỗ: họ nói người này với người kia.'
- source_word: Τίς ἄρα οὗτός ἐστιν
  choice: Vậy người này là ai
  rationale: “Vậy” giữ sắc thái suy luận pha kinh ngạc của ἄρα sau khi họ chứng kiến bão yên.
- source_word: ὅτι
  choice: mà
  rationale: Trong câu hỏi tiếng Việt, “mà” nối căn cứ gây kinh ngạc với câu hỏi về căn tính một cách tự nhiên.
- source_word: καὶ ὁ ἄνεμος καὶ ἡ θάλασσα
  choice: ngay cả gió và biển cũng
  rationale: Cấu trúc “ngay cả… cũng” thể hiện sức nhấn của καὶ thứ nhất, còn “và” liên kết hai chủ thể.
- source_word: ὑπακούει αὐτῷ
  choice: vâng lời người
  rationale: “Vâng lời” giữ nét nhân cách hóa và biểu đạt việc gió biển đáp ứng mệnh lệnh; “người” là đại từ tôn trọng, tự nhiên trong văn phong Kinh Thánh tiếng Việt.
theological_decisions:
- issue: Thẩm quyền của Chúa Giê-su trên tạo vật
  choice: Giữ nguyên câu hỏi kinh ngạc của các môn đồ cùng lời khẳng định rằng gió và biển vâng lời người.
  alternative: Mở rộng câu dịch để nói rõ căn tính thần linh của Chúa Giê-su.
  rationale: Bản văn gợi mạnh thẩm quyền phi thường của Chúa Giê-su nhưng tại đây vẫn trình bày điều ấy dưới hình thức câu hỏi của các môn đồ; bản dịch không nên giải quyết câu hỏi bằng phần diễn giải thêm.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. “Vô cùng sợ hãi” tự nhiên hơn lối dịch sát chữ, trong khi chú thích bảo tồn hình thức nhấn mạnh của nguyên ngữ.
