revisions:
- from: 'Sau khi thức dậy[a], Ngài quở trách gió và nói với biển[b]: “Im đi! Câm lại!” Gió liền ngừng, và mọi sự hoàn toàn yên lặng.'
  to: 'Sau khi thức dậy[a], Ngài quở trách gió và nói với biển[b]: “Im đi! Hãy bịt miệng lại!” Gió ngừng lại, và biển lặng yên hẳn.'
  rationale: 'Bản sửa giữ cấu trúc và các lựa chọn chính của bản nháp, nhưng thay cụm kết bằng cách nói tự nhiên hơn và sát γαλήνη μεγάλη: biển trở nên lặng yên ở mức độ lớn. Mệnh lệnh thứ hai được điều chỉnh để bảo lưu hình ảnh “bịt miệng/mõm” của πεφίμωσο mà không dùng công thức truyền thống có từ “bình an,” vốn không có trong nguyên văn. Các neo chú thích vẫn đặt đúng tại “thức dậy” và “biển.”'
