source:
  edition: SBLGNT
  text: καὶ διεγερθεὶς ἐπετίμησεν τῷ ἀνέμῳ καὶ εἶπεν τῇ θαλάσσῃ· Σιώπα, πεφίμωσο. καὶ ἐκόπασεν ὁ ἄνεμος, καὶ ἐγένετο γαλήνη μεγάλη.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/039.yaml
  text: And having awakened[a], he rebuked the wind and said to the sea, “Be silent! Be still!” And the wind ceased[b], and there was a great calm.
translation:
  language: vi
  text: 'Sau khi thức dậy[a], Ngài quở trách gió và nói với biển[b]: “Im đi! Hãy bịt miệng lại!” Gió ngừng lại, và biển lặng yên hẳn.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “sau khi được đánh thức.” Dạng Hy Lạp là phân từ thụ động, nhưng trong ngữ cảnh có thể được hiểu tự nhiên là Ngài thức dậy.'
    reason: lexical_alternative
  - marker: b
    text: Tức là Biển Ga-li-lê; nguyên văn Hy Lạp dùng từ “biển.”
    reason: cultural_note
lexical_decisions:
- source_word: διεγερθεὶς
  choice: sau khi thức dậy
  rationale: Phân từ bất định thụ động diễn tả hành động xảy ra trước; cách dịch này tự nhiên trong tiếng Việt và không xác định quá mức tác nhân đánh thức.
- source_word: ἐπετίμησεν
  choice: quở trách
  rationale: Giữ sắc thái mệnh lệnh nghiêm khắc và uy quyền vốn thường thấy ở ἐπιτιμάω trong sách Mác.
- source_word: τῷ ἀνέμῳ
  choice: gió
  rationale: Danh từ chỉ trực tiếp gió, không cần diễn giải thành bão.
- source_word: τῇ θαλάσσῃ
  choice: biển
  rationale: Theo nghĩa thông thường của θάλασσα và giữ nguyên cách gọi trong nguyên văn, thay vì địa lý hóa thành hồ.
- source_word: Σιώπα
  choice: Im đi!
  rationale: Mệnh lệnh trực tiếp, mạnh và tự nhiên, yêu cầu sự im lặng tức khắc.
- source_word: πεφίμωσο
  choice: Câm lại!
  rationale: Giữ hình ảnh mạnh của φιμόω, theo nghĩa đen là bịt mõm hoặc khóa miệng, nhưng diễn đạt tự nhiên hơn trong tiếng Việt khi nói trực tiếp.
- source_word: ἐκόπασεν
  choice: liền ngừng
  rationale: Diễn tả gió chấm dứt; từ “liền” thể hiện sự chuyển biến tức thì trong mạch kể.
- source_word: γαλήνη μεγάλη
  choice: mọi sự hoàn toàn yên lặng
  rationale: Truyền đạt mức độ rất lớn của sự lặng yên bằng tiếng Việt tự nhiên; “mọi sự” làm rõ đây là trạng thái yên lặng bao trùm sau khi gió ngừng.
theological_decisions:
- issue: Có nên dùng câu truyền thống tương đương với “Bình an! Hãy yên đi!” hay giữ hai mệnh lệnh sắc bén trong tiếng Hy Lạp
  choice: “Im đi! Câm lại!”
  alternative: “Hãy yên! Hãy lặng đi!”
  rationale: Nguyên văn không có danh từ “bình an” mà có hai động từ mệnh lệnh, trong đó động từ thứ hai mang hình ảnh khóa miệng hoặc bịt mõm. Bản dịch giữ uy lực và hình ảnh ấy mà không thêm ngôn ngữ thần học ngoài văn bản.
- issue: Nên dịch θάλασσα là “biển” hay “hồ”
  choice: biển
  alternative: hồ
  rationale: “Biển” bám sát từ ngữ của nguyên văn và giữ được sắc thái rộng hơn của trình thuật về quyền trên biển; chú thích cung cấp thông tin địa lý cần thiết.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Ngài” được dùng để chỉ Đức Chúa Giê-su một cách tôn kính nhưng không thêm tước hiệu không có trong câu. Hai mệnh lệnh ngắn giữ nhịp mạnh của nguyên văn.
