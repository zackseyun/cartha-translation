  rationale: Chỉnh tối thiểu để bỏ sắc thái thêm của “cũng” và giữ đại từ αὐτοῖς là “họ”, đồng thời bảo toàn hiện tại lịch sử “nói”, thời điểm buổi chiều, và lời đề nghị “Chúng ta hãy…”. Không cần chú thích vì phương án “qua bờ bên kia” không tạo khác biệt nghĩa đáng kể trong tiếng Việt.
