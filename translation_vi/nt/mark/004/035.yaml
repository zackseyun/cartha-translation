base_translation:
  language: en
  yaml_path: translation/nt/mark/004/035.yaml
  text: And he says to them on that day[a], when evening had come, “Let us go across to the other side.”
translation:
  language: vi
  text: 'Hôm ấy, khi chiều xuống, Đức Giê-su nói với họ: “Chúng ta hãy sang bờ bên kia.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: nói
  rationale: Dùng “nói” thay vì “đã nói” để giữ lối hiện tại lịch sử đặc trưng trong lời kể của Mác, đồng thời câu tiếng Việt vẫn tự nhiên.
- source_word: ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: cũng trong ngày ấy
  rationale: Diễn đạt tự nhiên mốc thời gian và cho thấy sự việc tiếp diễn trong chính ngày đã được nhắc đến.
- source_word: ὀψίας γενομένης
  choice: khi chiều xuống
  rationale: Chuyển cấu trúc sở hữu cách tuyệt đối chỉ thời gian thành cách nói tiếng Việt tự nhiên, giữ nghĩa lúc chiều tối đến.
- source_word: αὐτοῖς
  choice: với các môn đồ
  rationale: Đại từ số nhiều chỉ những người đang ở với Đức Giê-su trong ngữ cảnh; nêu rõ “các môn đồ” giúp tiếng Việt tự nhiên mà không thay đổi đối tượng quy chiếu.
- source_word: Διέλθωμεν
  choice: Chúng ta hãy sang
  rationale: Giữ lực khuyến nghị của động từ giả định ngôi thứ nhất số nhiều; “hãy sang” là rõ ràng và phù hợp với việc qua hồ.
- source_word: εἰς τὸ πέραν
  choice: bờ bên kia
  rationale: Trong bối cảnh đi qua hồ, cụm này chỉ phía bờ đối diện; “bờ bên kia” tự nhiên và chính xác hơn cách diễn đạt trừu tượng “phía bên kia”.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Giữ hiện tại lịch sử bằng “nói”; dùng “Đức Giê-su” theo lối gọi tôn kính phổ biến trong tiếng Việt. Không cần chú thích vì các phương án dịch khác không tạo khác biệt đáng kể về nghĩa.
