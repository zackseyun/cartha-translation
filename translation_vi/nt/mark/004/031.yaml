  verdict: approve
  source_fidelity: 'Bản dịch phản ánh đúng phép so sánh tỉnh lược của ὡς theo ngữ cảnh câu trước, κόκκῳ σινάπεως là “một hạt cải,” mệnh đề thời gian bị động “khi được gieo,” và quan trọng là giữ dạng so sánh hơn của μικρότερον: “nhỏ hơn mọi hạt giống.” Cụm lặp τῶν ἐπὶ τῆς γῆς cũng được giữ lại bằng “trên đất.”'
  naturalness: Câu tiếng Việt hiện đại, rõ ràng và có nhịp văn tự nhiên. “Gieo xuống đất” là cách kết hợp từ tự nhiên trong ngữ cảnh canh tác; “nó” làm rõ chủ ngữ mà không thêm diễn giải. Dấu gạch ngang cuối câu phù hợp vì câu tiếp diễn sang câu sau.
  terminology: “Hạt cải” là cách gọi thông dụng và chính xác cho hình ảnh κόκκος σινάπεως. Phương án chú thích “một hạt giống cải” nêu được khả năng từ vựng, dù bản văn chính vẫn là lựa chọn tự nhiên hơn. Không có thuật ngữ thần học nào cần điều chỉnh trong câu này.
