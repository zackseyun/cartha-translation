id: MRK.4.31
reference: Mark 4:31
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὡς ⸀κόκκῳ σινάπεως, ὃς ὅταν σπαρῇ ἐπὶ τῆς γῆς, ⸂μικρότερον ὂν⸃ πάντων τῶν ⸀σπερμάτων τῶν ἐπὶ τῆς γῆς—
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/031.yaml
  text: It is like a mustard seed[a], which, when it is sown on the ground[b], being smaller than all the seeds on the ground—
translation:
  language: vi
  text: Điều ấy giống như một hạt cải[a]; khi được gieo xuống đất, nó nhỏ hơn mọi hạt giống trên đất—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “một hạt giống cải.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς
  choice: Điều ấy giống như
  rationale: Cụm Hy Lạp mang tính tỉnh lược và nối với câu hỏi ở câu trước; thêm “Điều ấy” giúp câu tiếng Việt tự nhiên mà vẫn giữ phép so sánh.
- source_word: κόκκῳ σινάπεως
  choice: một hạt cải
  rationale: κόκκος có thể là “hạt” hoặc “hạt giống”; “hạt cải” là cách nói tự nhiên, thông dụng trong tiếng Việt và phù hợp với hình ảnh thực vật.
- source_word: ὃς ὅταν σπαρῇ
  choice: khi được gieo
  rationale: Diễn đạt tự nhiên ý thời gian khái quát của ὅταν với động từ bị động ở thể giả định, đồng thời giữ việc hạt là đối tượng được gieo.
- source_word: ἐπὶ τῆς γῆς
  choice: xuống đất / trên đất
  rationale: γῆ trong ngữ cảnh nông nghiệp chỉ đất; với động tác gieo, “xuống đất” tự nhiên hơn trong tiếng Việt, còn ở cụm định ngữ lặp lại, “trên đất” giữ gần cấu trúc nguồn.
- source_word: μικρότερον ὂν
  choice: nó nhỏ hơn
  rationale: Giữ đúng dạng so sánh hơn của μικρότερον thay vì chuyển thành dạng cao nhất; dùng mệnh đề hữu hạn để tiếng Việt sáng rõ.
- source_word: πάντων τῶν σπερμάτων τῶν ἐπὶ τῆς γῆς
  choice: mọi hạt giống trên đất
  rationale: Thể hiện cấu trúc so sánh với sở hữu cách và giữ cụm hạn định lặp lại “trên đất” trong bản Hy Lạp.
theological_decisions:
- issue: Dạng so sánh hơn hay so sánh nhất khi mô tả hạt cải
  choice: nhỏ hơn mọi hạt giống trên đất
  alternative: nhỏ nhất trong mọi hạt giống trên đất
  rationale: Bản Hy Lạp dùng dạng so sánh hơn μικρότερον, không dùng một dạng so sánh nhất tường minh. Bản dịch giữ hình thức của nguồn và không giải quyết thay tác giả sự căng thẳng giữa cách diễn đạt với kiến thức thực vật học.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Dấu gạch ngang cuối câu được giữ vì câu văn tiếp tục sang câu kế. Đại từ “nó” làm rõ chủ thể trong tiếng Việt mà không thêm nội dung giải nghĩa.
