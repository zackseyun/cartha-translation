  yaml_path: translation/nt/mark/004/002.yaml
  text: 'And he was teaching them many things in parables[a], and in his teaching he was saying to them:'
translation:
  language: vi
  text: 'Ngài đang dạy họ nhiều điều bằng các dụ ngôn[a], và trong lời dạy của Ngài, Ngài nói với họ:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Ngài dạy họ nhiều qua các dụ ngôn.” Từ Hy Lạp πολλά có thể được hiểu là “nhiều điều” hoặc, gọn hơn, là “nhiều.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδίδασκεν
  choice: dạy
  rationale: Thì chưa hoàn thành trình bày hoạt động đang diễn ra trong bối cảnh; cụm “dùng các dụ ngôn mà dạy” tự nhiên trong tiếng Việt, còn “trong khi giảng dạy” ở vế sau giúp duy trì sắc thái tiếp diễn.
- source_word: ἐν παραβολαῖς
  choice: dùng các dụ ngôn
  rationale: ἐν với cách ba ở đây chỉ phương thức hoặc phương tiện. “Dùng các dụ ngôn” là cách diễn đạt tự nhiên, rõ nghĩa trong tiếng Việt hiện đại.
- source_word: πολλά
  choice: nhiều điều
  rationale: Dạng trung tính số nhiều có thể hiểu là đối tượng hoặc phạm vi của việc dạy; “nhiều điều” vừa tự nhiên vừa thể hiện bề rộng nội dung giảng dạy.
- source_word: ἔλεγεν
  choice: nói
  rationale: Thì chưa hoàn thành dẫn vào lời giảng tiếp diễn ở câu kế tiếp. Kết cấu “Trong khi giảng dạy, Ngài nói” chuyển tải diễn tiến này tự nhiên hơn cách dịch máy móc “đang nói”.
- source_word: ἐν τῇ διδαχῇ αὐτοῦ
  choice: Trong khi giảng dạy
  rationale: Cụm này gắn lời sắp được trích dẫn với hoạt động giảng dạy của Chúa Giê-su; cách diễn đạt bằng mệnh đề trạng ngữ tự nhiên hơn trong tiếng Việt mà không làm mất quan hệ ấy.
- source_word: καὶ
  choice: Ngài
  rationale: Liên từ καί nối tiếp câu trước; tiếng Việt không cần giữ “Và” ở đầu câu để thể hiện mạch kể, nên dùng chủ ngữ “Ngài” nhằm tạo câu văn tự nhiên.
- source_word: αὐτοὺς / αὐτοῖς
  choice: họ / với họ
  rationale: Phân biệt đối tượng trực tiếp của “dạy” với đối tượng tiếp nhận của “nói”, phù hợp cú pháp Hy Lạp và cách dùng tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” để quy chiếu Chúa Giê-su theo lối văn Kinh Thánh tiếng Việt thông dụng; tránh lặp cứng hai động từ ở thể tiếp diễn, đồng thời vẫn giữ diễn tiến của hai thì chưa hoàn thành trong nguyên văn.
