  verdict: approve
  source_fidelity: 'Bản dịch bám sát câu Hy Lạp: phủ định về việc có rễ «trong chính mình», tính chất chỉ nhất thời, trình tự «rồi/khi», hoạn nạn hoặc bắt bớ xảy đến vì lời, và phản ứng tức khắc đều được truyền đạt. «Vấp ngã» bảo toàn hình ảnh và độ mở nghĩa của σκανδαλίζονται; chú thích nêu các khả năng mạnh hơn mà không ép một kết luận thần học.'
  naturalness: Văn tiếng Việt hiện đại, rõ nghĩa và có nhịp câu tự nhiên. «Họ không có rễ trong chính mình» là cách nói mang tính ẩn dụ phù hợp trực tiếp với ngữ cảnh hạt giống; «chỉ tồn tại nhất thời» làm rõ πρόσκαιροι khi chủ ngữ là con người.
  terminology: «Rễ», «lời», «hoạn nạn», «bắt bớ», và «lập tức» nhất quán với hình ảnh, từ vựng và sắc thái của bản nguồn. Chú thích giải thích hợp lý phạm vi nghĩa của σκανδαλίζονται, gồm vấp ngã, bị làm cho vấp ngã, và phản ứng chống đối/phật ý.
