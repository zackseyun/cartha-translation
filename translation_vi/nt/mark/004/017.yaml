  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ οὐκ ἔχουσιν ῥίζαν ἐν ἑαυτοῖς ἀλλὰ πρόσκαιροί εἰσιν, εἶτα γενομένης θλίψεως ἢ διωγμοῦ διὰ τὸν λόγον ⸀εὐθὺς σκανδαλίζονται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/017.yaml
  text: and they have no root in themselves[a], but are temporary; then, when affliction or persecution arises because of the word, they immediately fall away.
translation:
  language: vi
  text: Họ không có rễ trong chính mình, mà chỉ tồn tại nhất thời; rồi khi hoạn nạn hay sự bắt bớ xảy đến vì lời ấy, họ lập tức vấp ngã.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “lìa bỏ,” “bị làm cho vấp ngã,” hoặc “sinh lòng chống đối.” Động từ Hy Lạp có thể diễn tả việc vấp ngã, bị cản ngã, hoặc phản ứng chống lại điều gây khó chịu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ῥίζαν
  choice: rễ
  rationale: Giữ nguyên hình ảnh nông nghiệp về rễ trong ẩn dụ hạt giống và các loại đất; không thêm ý “sâu” hay “vững chắc” vốn không được nói rõ trong tiếng Hy Lạp.
- source_word: ἐν ἑαυτοῖς
  choice: trong chính mình
  rationale: Diễn đạt trực tiếp ý phản thân, tự nhiên trong tiếng Việt và không giải thích thêm rễ tượng trưng cho điều gì.
- source_word: πρόσκαιροί
  choice: chỉ tồn tại nhất thời
  rationale: Truyền đạt ý chỉ kéo dài trong một thời gian; cách diễn đạt này rõ ràng hơn tính từ đơn lẻ “tạm thời” khi nói về con người.
- source_word: εἶτα
  choice: rồi
  rationale: Đánh dấu diễn biến tiếp theo một cách tự nhiên, phù hợp mạch kể.
- source_word: γενομένης θλίψεως ἢ διωγμοῦ
  choice: khi hoạn nạn hay sự bắt bớ xảy đến
  rationale: Chuyển cấu trúc tuyệt đối sở hữu cách thành mệnh đề thời gian; “hoạn nạn” diễn tả sức ép và khốn khó, còn “sự bắt bớ” giữ nghĩa chuyên biệt của διωγμός.
- source_word: διὰ τὸν λόγον
  choice: vì lời ấy
  rationale: Giữ thuật ngữ “lời” được lặp lại trong ẩn dụ, đồng thời “ấy” cho thấy đây là lời đã được nhắc đến trong văn cảnh.
- source_word: εὐθὺς
  choice: lập tức
  rationale: Giữ sắc thái tức thời và nhịp điệu khẩn trương đặc trưng trong sách Mác.
- source_word: σκανδαλίζονται
  choice: vấp ngã
  rationale: Giữ hình ảnh bị cản vấp và tính đa nghĩa của động từ, trong khi văn cảnh vẫn cho thấy họ không đứng vững trước áp lực. Chú thích nêu cách hiểu mạnh hơn là “lìa bỏ”.
theological_decisions:
- issue: Cách dịch σκανδαλίζονται trong bối cảnh môn đồ không đứng vững
  choice: vấp ngã
  alternative: lìa bỏ
  rationale: “Vấp ngã” bảo toàn hình ảnh và sự mơ hồ thực sự của động từ Hy Lạp, không tự động quyết định vấn đề thần học về tình trạng cứu rỗi cuối cùng. “Lìa bỏ” phù hợp với kết quả nghiêm trọng trong văn cảnh nhưng diễn giải mạnh hơn, nên được nêu trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Bảo toàn hình ảnh “rễ,” thuật ngữ “lời,” sự đối lập của câu Hy Lạp và tính căng thẳng trong σκανδαλίζονται; không thêm kết luận giáo phái.
