  text: ⸂καὶ ὅτε ἀνέτειλεν ὁ ἥλιος⸃ ⸀ἐκαυματίσθη καὶ διὰ τὸ μὴ ἔχειν ῥίζαν ἐξηράνθη.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/006.yaml
  text: And when the sun rose[a], it was scorched, and because it had no root, it withered.
translation:
  language: vi
  text: Khi mặt trời mọc lên, nó bị nắng thiêu đốt; và vì không có rễ nên nó khô héo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “khô đi.” Động từ Hy Lạp có thể chỉ việc trở nên khô hoặc héo.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ὅτε ἀνέτειλεν ὁ ἥλιος
  choice: Khi mặt trời mọc lên
  rationale: Diễn đạt tự nhiên mệnh đề thời gian; không cần dịch καὶ thành một từ riêng trong tiếng Việt vì quan hệ nối tiếp đã rõ từ ngữ cảnh.
- source_word: ἐκαυματίσθη
  choice: bị nắng thiêu đốt
  rationale: Thể bị động nói đến tác hại do sức nóng của mặt trời; “bị nắng thiêu đốt” rõ nghĩa và hợp với hình ảnh cây non.
- source_word: διὰ τὸ μὴ ἔχειν ῥίζαν
  choice: vì không có rễ
  rationale: Giữ nguyên quan hệ nguyên nhân của διά với động từ nguyên mẫu có mạo từ và giữ danh từ “rễ” theo nghĩa khái quát.
- source_word: ἐξηράνθη
  choice: khô héo
  rationale: Bao quát sắc thái trở nên khô hoặc héo của động từ Hy Lạp, đồng thời tự nhiên trong ngữ cảnh thực vật.
theological_decisions: []
