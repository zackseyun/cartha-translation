  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Đại từ “nó” giữ số ít của chủ thể ngầm trong tiếng Hy Lạp; dấu chấm phẩy giúp làm rõ diễn tiến và nguyên nhân mà không thêm ý thần học.
