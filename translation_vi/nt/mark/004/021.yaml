  - severity: medium
    issue: “Có ai mang đèn đến” thêm một tác nhân không có trong câu Hy Lạp
    rationale: 'Nguyên văn dùng hình ảnh nhân hóa: ‘cái đèn có đến...?’ Bản dịch chính có thể làm dịu cách nhân hóa bằng bị động ‘đèn có phải được mang đến...’ mà không đưa chủ thể phiếm chỉ vào.'
  - severity: low
    issue: Chú thích gộp hai chức năng nhưng chỉ được neo tại “thùng đong”
    rationale: Ghi chú về lối nói ‘cái đèn có đến’ nên được neo tại “đèn”; ghi chú văn hóa về μόδιος nên được neo tại “thùng đong”.
