source:
  edition: SBLGNT
  text: Καὶ ἔλεγεν ⸀αὐτοῖς· Μήτι ⸂ἔρχεται ὁ λύχνος⸃ ἵνα ὑπὸ τὸν μόδιον τεθῇ ἢ ὑπὸ τὴν κλίνην, οὐχ ἵνα ἐπὶ τὴν λυχνίαν ⸀τεθῇ;
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/021.yaml
  text: And he was saying to them[a], “A lamp does not come to be put under a basket or under a bed[b], does it? Is it not to be put on the lampstand?”
translation:
  language: vi
  text: 'Người nói với họ: “Đèn có phải được mang đến để đặt dưới thùng đong[b] hoặc dưới giường không? Chẳng phải là để đặt trên chân đèn sao?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn dùng lối diễn đạt nhân hóa, theo sát chữ: “Cái đèn có đến để được đặt dưới thùng đong hay dưới giường không?”'
    reason: lexical_alternative
  - marker: b
    text: Từ Hy Lạp μόδιος chỉ một vật chứa dùng để đong đồ khô; theo truyền thống thường dịch là “giạ”.
    reason: cultural_note
lexical_decisions:
- source_word: ἔλεγεν
  choice: lại nói
  rationale: Thì chưa hoàn thành đặt lời này trong diễn tiến giảng dạy; “lại nói” là cách kể tự nhiên trong tiếng Việt và gợi việc Đức Giê-su tiếp tục nói.
- source_word: Μήτι
  choice: Có ai ... không?
  rationale: Cấu trúc câu hỏi này tự nhiên trong tiếng Việt và hàm ý câu trả lời phủ định như Μήτι.
- source_word: ἔρχεται ὁ λύχνος
  choice: có ai mang đèn đến
  rationale: Tiếng Hy Lạp nói sống động theo nghĩa đen là “cái đèn đến”. Bản dịch dùng chủ thể phiếm chỉ để câu tiếng Việt tự nhiên, nhưng giữ ý đèn được mang đến với một mục đích; cách nói sát chữ được ghi ở chú thích.
- source_word: λύχνος
  choice: đèn
  rationale: Chỉ chiếc đèn dầu cụ thể, không phải ánh sáng trừu tượng.
- source_word: μόδιον
  choice: cái thùng đong
  rationale: μόδιος là một đơn vị đo đồ khô và cũng chỉ vật chứa dùng để đong; “thùng đong” truyền đạt cả hình dạng vật chứa lẫn công dụng đo lường.
- source_word: κλίνην
  choice: giường
  rationale: “Giường” là từ hiện đại, phổ thông, phù hợp với hình ảnh trong nhà.
- source_word: λυχνίαν
  choice: chân đèn
  rationale: Chỉ giá hoặc chân chuyên dùng để đặt đèn, giữ nguyên hình ảnh cụ thể.
- source_word: ἵνα ... τεθῇ
  choice: để đặt
  rationale: Diễn đạt tự nhiên quan hệ mục đích của ἵνα với động từ bị động τεθῇ trong tiếng Việt.
theological_decisions:
- issue: Có nên giữ nguyên phép nhân hóa “cái đèn đến” hay chuyển thành cách nói tự nhiên về việc mang đèn đến
  choice: Dịch “Có ai mang đèn đến...” và ghi cách nói sát chữ trong chú thích
  alternative: “Cái đèn đến để được đặt...”
  rationale: Bản Hy Lạp dùng hình ảnh nhân hóa sinh động, nhưng cách nói sát chữ dễ gây vấp trong tiếng Việt. Cách dịch chính giữ lực của câu hỏi tu từ và ý về mục đích, còn chú thích bảo tồn nét diễn đạt nguyên văn.
- issue: Tính xác định của ὁ λύχνος trong câu mang tính châm ngôn
  choice: Dịch chung là “đèn”
  alternative: “cái đèn ấy”
  rationale: Mạo từ Hy Lạp ở đây có thể dùng cho một đối tượng mang nghĩa khái quát. Tiếng Việt không cần thêm từ chỉ định, vốn có thể khiến người đọc hiểu lầm rằng đây là một chiếc đèn đã được nhắc đến.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Cặp câu hỏi “Có ai... không? Chẳng phải... sao?” giữ kỳ vọng phủ định rồi khẳng định của hai câu hỏi tu từ trong nguyên văn.
