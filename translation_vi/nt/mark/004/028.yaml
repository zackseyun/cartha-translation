  text: ⸀αὐτομάτη ἡ γῆ καρποφορεῖ, πρῶτον χόρτον, ⸂εἶτα στάχυν, εἶτα⸃ ⸂πλήρης σῖτον⸃ ἐν τῷ στάχυϊ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/028.yaml
  text: 'The soil bears fruit by itself: first the stalk[a], then the head, then the full grain in the head.'
translation:
  language: vi
  text: 'Đất tự mình sinh ra hoa màu: trước hết là chồi non, rồi đến bông, sau đó là hạt đầy đặn trong bông.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: αὐτομάτη
  choice: tự
  rationale: Bổ nghĩa cho đất và diễn tả việc đất sinh sản mà không có tác động hữu hình của con người; “tự” tự nhiên, gọn và không mang sắc thái máy móc như “tự động”.
- source_word: ἡ γῆ
  choice: đất
  rationale: Trong bối cảnh canh tác, từ này chỉ đất trồng; “đất” là cách nói thông dụng và chính xác trong tiếng Việt.
- source_word: καρποφορεῖ
  choice: sinh hoa lợi
  rationale: Diễn đạt việc đất tạo ra sản vật/cây trái, giữ hình ảnh nông nghiệp và tránh khiến người đọc hiểu hẹp rằng cây đang cho một loại trái cây.
- source_word: πρῶτον χόρτον
  choice: trước hết là mầm non
  rationale: χόρτος ở đây là giai đoạn cây ngũ cốc mới nhú, còn xanh; “mầm non” dễ hiểu hơn “lá” và không gọi đó là “thân cây” quá sớm.
- source_word: εἶτα στάχυν
  choice: rồi đến bông lúa
  rationale: στάχυς chỉ bông của cây ngũ cốc. “Bông lúa” là hình ảnh nông nghiệp tự nhiên, quen thuộc trong tiếng Việt, dù σῖτος không nhất thiết xác định riêng loài lúa.
- source_word: εἶτα πλήρης σῖτον ἐν τῷ στάχυϊ
  choice: sau đó là hạt đầy đặn trong bông
  rationale: Giữ đủ trình tự, vị trí của hạt trong bông và ý nghĩa “đầy, hoàn chỉnh” của πλήρης mà không thêm sắc thái “chín” vốn không được nói rõ.
