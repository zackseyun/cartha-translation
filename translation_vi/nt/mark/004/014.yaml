  text: ὁ σπείρων τὸν λόγον σπείρει.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/014.yaml
  text: The sower sows the word[a].
translation:
  language: vi
  text: Người gieo giống gieo lời[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “sứ điệp”. Từ Hy Lạp λόγος có thể có nghĩa là “lời” hoặc “sứ điệp”, tùy theo văn cảnh.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ σπείρων
  choice: Người gieo giống
  rationale: Mạo từ đi với phân từ hiện tại được dùng như danh từ, chỉ người có hành động gieo. Cách dịch này tự nhiên trong tiếng Việt, giữ hình ảnh của dụ ngôn và không diễn giải rộng thành nghề nghiệp như “người nông dân”.
- source_word: τὸν λόγον
  choice: lời
  rationale: λόγος có thể mang nghĩa “lời” hoặc “sứ điệp”. Trong câu này, “lời” giữ được độ khái quát của nguyên văn và không tự ý bổ sung “của Đức Chúa Trời” hay “Tin Mừng”.
- source_word: σπείρει
  choice: gieo
  rationale: Thì hiện tại ở đây diễn tả hành động mang tính khái quát trong phần giải thích dụ ngôn. Dùng “gieo” đồng thời giữ sự lặp lại có chủ ý của cùng một gốc từ Hy Lạp.
theological_decisions:
- issue: Đối tượng quy chiếu của τὸν λόγον trong lời giải thích dụ ngôn
  choice: Dịch khái quát là “lời” mà không xác định thêm.
  alternative: “sứ điệp”, “lời Đức Chúa Trời”, hoặc “Tin Mừng”
  rationale: Nguyên văn chỉ có τὸν λόγον. Dù văn cảnh rộng hơn cho thấy đây là lời được công bố từ Đức Chúa Trời, việc bổ sung nội dung ấy ngay trong câu sẽ thu hẹp điều nguyên văn để mở.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. “Người gieo giống gieo lời” giữ cấu trúc ngắn gọn cùng phép lặp của nguyên văn; từ “giống” được thêm sau “gieo” ở chủ ngữ để thành ngữ danh hóa tự nhiên trong tiếng Việt, nhưng không lặp ở vị ngữ nhằm tránh nặng câu.
