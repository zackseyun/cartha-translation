  text: Καὶ ἔλεγεν· Οὕτως ἐστὶν ἡ βασιλεία τοῦ θεοῦ ⸀ὡς ἄνθρωπος βάλῃ τὸν σπόρον ἐπὶ τῆς γῆς
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/026.yaml
  text: 'And he was saying[c][b][a], “The kingdom of God is like this: as when a man casts the seed upon the ground,”'
translation:
  language: vi
  text: 'Ngài nói: “Nước Đức Chúa Trời cũng như khi một người gieo hạt giống xuống đất,[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc dịch: “Nước Đức Chúa Trời giống như khi một người gieo hạt giống trên đất.” Cấu trúc Hy Lạp cô đọng, và hình ảnh so sánh còn tiếp tục trong câu 27.'
    reason: alternative_reading
lexical_decisions:
- source_word: Καὶ ἔλεγεν
  choice: Ngài lại nói
  rationale: Καί cùng thể chưa hoàn thành ἔλεγεν trong lời dẫn truyện cho thấy Chúa Giê-su tiếp tục hoặc chuyển sang một lời dạy khác. “Ngài lại nói” tự nhiên trong tiếng Việt và giữ được sắc thái tiếp diễn của mạch kể.
- source_word: Οὕτως ἐστὶν
  choice: là thế này
  rationale: Cụm này giới thiệu cách thức so sánh. “Là thế này” vừa tự nhiên vừa chuẩn bị cho hình ảnh dụ ngôn theo sau mà không lặp vụng “giống như… như”.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: Vương quốc Đức Chúa Trời
  rationale: βασιλεία có thể chỉ cả quyền trị vì lẫn lãnh vực trị vì. “Vương quốc Đức Chúa Trời” là cách diễn đạt quen thuộc, rõ ràng, đồng thời không loại bỏ chiều nghĩa về sự cai trị của Ngài.
- source_word: ὡς ἄνθρωπος
  choice: một người
  rationale: ὡς mở đầu hình ảnh so sánh, nhưng trong cấu trúc tiếng Việt, dấu hai chấm sau “là thế này” đã thực hiện chức năng ấy. ἄνθρωπος ở đây là một nhân vật đại diện; “một người” giữ số ít mà không thêm chi tiết không có trong bản Hy Lạp.
- source_word: βάλῃ τὸν σπόρον
  choice: gieo hạt giống
  rationale: βάλλω theo nghĩa đen là ném hoặc rải, nhưng trong ngữ cảnh nông nghiệp, hành động được nói đến là gieo. “Gieo hạt giống” truyền đạt chính xác và tự nhiên hơn “ném hạt giống”, trong khi vẫn giữ hình ảnh cụ thể.
- source_word: ἐπὶ τῆς γῆς
  choice: xuống đất
  rationale: γῆ trong ngữ cảnh canh tác chỉ mặt đất hoặc đất trồng, không phải thế giới theo nghĩa vũ trụ. “Xuống đất” diễn tả tự nhiên hướng của hành động gieo trong tiếng Việt.
theological_decisions:
- issue: Cấu trúc so sánh rút gọn tiếp tục sang câu 27
  choice: Giữ câu ở trạng thái mở bằng dấu phẩy sau “xuống đất”
  alternative: 'Khép lại thành một câu hoàn chỉnh: “Vương quốc Đức Chúa Trời giống như một người gieo hạt giống xuống đất.”'
  rationale: Cấu trúc Οὕτως… ὡς được triển khai tiếp trong câu kế tiếp. Giữ dấu phẩy bảo toàn nhịp và sự phụ thuộc cú pháp của dụ ngôn, thay vì khiến câu 26 có vẻ là một phát biểu đã hoàn tất.
- issue: Ý nghĩa của βασιλεία τοῦ θεοῦ
  choice: Vương quốc Đức Chúa Trời
  alternative: Sự trị vì của Đức Chúa Trời
  rationale: Trong dụ ngôn, từ βασιλεία có thể gợi cả vương quyền đang hoạt động và thực tại thuộc quyền cai trị ấy. Cách dịch đã chọn giữ lối nói Kinh Thánh quen thuộc mà không chú giải thiên về riêng một chiều nghĩa.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Ngài” phù hợp với lời dẫn nói về Chúa Giê-su; “một người” tự nhiên hơn việc nhấn giới tính của nhân vật đại diện. Dấu hai chấm và dấu phẩy giữ được cấu trúc dụ ngôn đang mở sang câu kế tiếp.
