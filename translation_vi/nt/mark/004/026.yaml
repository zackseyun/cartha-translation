  source_fidelity: 'Bản nháp truyền đạt đúng hình ảnh nông nghiệp và giữ được cấu trúc so sánh còn tiếp sang câu 27. Tuy nhiên, “lại nói” thêm ý ‘một lần nữa’ không được Καὶ ἔλεγεν đòi hỏi; thể chưa hoàn thành chỉ cho thấy lời nói đang/tiếp diễn trong mạch thuật chuyện. Cặp “là thế này: một người” cũng làm mờ chức năng so sánh của ὡς.'
  naturalness: “Nước Đức Chúa Trời cũng như khi một người...” là cách nói Kinh Thánh hiện đại tự nhiên hơn và vẫn cố ý để câu mở sang câu sau. “Nước Đức Chúa Trời” cũng là thuật ngữ Việt ngữ quen thuộc và ít gợi một lãnh thổ chính trị hơn “Vương quốc Đức Chúa Trời.”
  terminology: Đổi “Vương quốc Đức Chúa Trời” thành “Nước Đức Chúa Trời” để phù hợp cách dùng Kinh Thánh Việt ngữ phổ biến, đồng thời vẫn giữ độ rộng nghĩa của βασιλεία. Giữ “một người” vì ἄνθρωπος là nhân vật đại diện, không cần áp đặt giới tính. Giữ “gieo hạt giống” như một diễn đạt nông nghiệp chính xác cho βάλλῃ trong ngữ cảnh này.
