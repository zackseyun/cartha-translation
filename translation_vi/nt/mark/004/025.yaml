id: MRK.4.25
reference: Mark 4:25
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὃς γὰρ ⸀ἔχει, δοθήσεται αὐτῷ· καὶ ὃς οὐκ ἔχει, καὶ ⸀ὃ ἔχει ἀρθήσεται ἀπ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/025.yaml
  text: For whoever has[a], more will be given to him; and whoever does not have, even what he has will be taken away from him.
translation:
  language: vi
  text: Vì ai có thì sẽ được ban thêm[a]; còn ai không có thì ngay cả điều mình có cũng sẽ bị lấy khỏi người ấy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn Hy Lạp chỉ nói “sẽ được ban cho người ấy”; từ “thêm” được bổ sung vì hàm ý gia tăng trong thế đối lập của câu nói.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς
  choice: ai
  rationale: Đại từ quan hệ bất định mang nghĩa khái quát; “ai” tự nhiên trong câu châm ngôn tiếng Việt và không giới hạn giới tính vốn không phải trọng tâm ngữ nghĩa.
- source_word: γὰρ
  choice: Vì
  rationale: Giữ chức năng giải thích, làm căn cứ cho lời phán ngay trước đó.
- source_word: ἔχει
  choice: có
  rationale: Tương đương trực tiếp, ngắn gọn và phù hợp với tính súc tích của câu châm ngôn.
- source_word: δοθήσεται αὐτῷ
  choice: sẽ được ban thêm
  rationale: Bản Hy Lạp không nêu tân ngữ; “thêm” diễn đạt ý gia tăng hàm ẩn trong thế đối lập và làm câu tiếng Việt tự nhiên, còn “được ban” giữ sắc thái bị động.
- source_word: καὶ
  choice: còn; cũng
  rationale: “Còn” thể hiện sự đối lập giữa hai vế; καὶ thứ hai có sắc thái tăng tiến, được diễn đạt tự nhiên bằng “ngay cả ... cũng”.
- source_word: οὐκ ἔχει
  choice: không có
  rationale: Cách diễn đạt hiện đại, trực tiếp cho sở hữu bị phủ định.
- source_word: ὃ ἔχει
  choice: điều mình có
  rationale: Giữ đối tượng không xác định của đại từ quan hệ trung tính, đồng thời tránh lặp đại từ nặng nề trong tiếng Việt.
- source_word: ἀρθήσεται ἀπ’ αὐτοῦ
  choice: sẽ bị lấy khỏi người ấy
  rationale: Giữ thể bị động và ý nghĩa tước bỏ, đồng thời thể hiện rõ ἀπό là sự lấy ra khỏi người đang có.
theological_decisions:
- issue: Bổ sung đối tượng hàm ẩn trong δοθήσεται
  choice: Dịch “sẽ được ban thêm” và đánh dấu chú thích.
  alternative: “sẽ được ban cho” mà không thêm đối tượng
  rationale: Nguyên văn không nêu điều được ban, nên chú thích bảo toàn dữ kiện hình thức; tuy nhiên, thế đối lập với việc mất cả điều đang có hàm ý sự gia tăng, và “ban thêm” là tiếng Việt tự nhiên mà không xác định điều được ban là gì.
- issue: Chủ thể khái quát ở số ít
  choice: Dùng “ai ... mình ... người ấy”.
  alternative: Dùng số nhiều “những ai ... họ” hoặc lặp “người nào ... người đó”
  rationale: “Ai” giữ lực khái quát của ὃς; “mình” hồi chỉ tự nhiên trong mệnh đề phụ, còn “người ấy” ở cuối giúp giữ quan hệ số ít mà không áp đặt giới tính sinh học lên cách dùng giống đực ngữ pháp.
- issue: Đối tượng của động từ “có”
  choice: Để mở bằng “có” và “điều mình có”.
  alternative: Giải nghĩa cụ thể là sự hiểu biết, đức tin, hoặc khả năng tiếp nhận
  rationale: Câu Hy Lạp không xác định rõ điều được sở hữu; bản dịch bảo tồn độ mở và sức căng diễn giải trong ngữ cảnh.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Giữ cấu trúc châm ngôn đối xứng; dùng “được ban” thay vì “được cho” để phản ánh sắc thái trang trọng của lời dạy mà không xác định tác nhân.
