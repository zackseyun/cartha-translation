  text: καὶ ⸀ἄλλα ἔπεσεν εἰς τὴν γῆν τὴν καλήν, καὶ ἐδίδου καρπὸν ἀναβαίνοντα καὶ ⸀αὐξανόμενα, καὶ ἔφερεν ⸂ἓν τριάκοντα καὶ ἓν ἑξήκοντα καὶ ἓν⸃ ἑκατόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/008.yaml
  text: And other seed fell into the good soil[a], and it was producing fruit, growing up and increasing, and bearing thirtyfold and sixtyfold and a hundredfold.
translation:
  language: vi
  text: Còn những hạt khác rơi vào đất tốt[a], rồi sinh hoa kết quả, vươn lên và phát triển, cho năng suất gấp ba mươi, gấp sáu mươi, gấp một trăm lần.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn chỉ dùng “những cái khác”; từ “hạt” được hiểu theo văn cảnh.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλα
  choice: những hạt khác
  rationale: Tính từ trung tính số nhiều được dùng như danh từ và chỉ về hạt giống trong ngữ cảnh; thêm “hạt” giúp câu tiếng Việt rõ và tự nhiên.
- source_word: γῆν τὴν καλήν
  choice: đất tốt
  rationale: Trong bối cảnh gieo trồng, γῆ chỉ lớp đất thích hợp để hạt sinh trưởng; “đất tốt” là cách nói tự nhiên và dễ hiểu.
- source_word: ἐδίδου καρπὸν
  choice: sinh hoa kết quả
  rationale: Động từ ở thì chưa hoàn thành diễn tả quá trình liên tục; thành ngữ này truyền đạt tự nhiên ý cây đang tạo ra kết quả.
- source_word: ἀναβαίνοντα
  choice: vươn lên
  rationale: Phân từ hiện tại mô tả cây mọc hướng lên; “vươn lên” giữ được sắc thái này và phân biệt với động tác gia tăng tiếp theo.
- source_word: αὐξανόμενα
  choice: gia tăng
  rationale: Phân từ hiện tại diễn tả sự tiếp tục lớn thêm hoặc tăng thêm; “gia tăng” bảo toàn sự phân biệt với ἀναβαίνοντα.
- source_word: ἔφερεν
  choice: cho năng suất
  rationale: Trong ngữ cảnh nông nghiệp và đi cùng các tỷ lệ thu hoạch, cách dịch này diễn đạt tự nhiên sản lượng mà cây đem lại, đồng thời phản ánh hành động kéo dài của thì chưa hoàn thành.
- source_word: ἓν τριάκοντα καὶ ἓν ἑξήκοντα καὶ ἓν ἑκατόν
  choice: gấp ba mươi, gấp sáu mươi, gấp một trăm lần
  rationale: Cụm từ chỉ các mức sản lượng theo tỷ lệ; cách diễn đạt bằng “gấp ... lần” rõ nghĩa trong tiếng Việt và giữ đủ ba cấp độ.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Chuỗi động tác “sinh hoa kết quả, vươn lên, gia tăng” giữ các nét nghĩa riêng của những từ Hy Lạp, còn “cho năng suất” làm rõ các tỷ lệ thu hoạch ở cuối câu.
