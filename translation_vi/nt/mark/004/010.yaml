  text: ⸂Καὶ ὅτε⸃ ἐγένετο κατὰ μόνας, ⸀ἠρώτων αὐτὸν οἱ περὶ αὐτὸν σὺν τοῖς δώδεκα ⸂τὰς παραβολάς⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/010.yaml
  text: And when he was alone[a], those around him with the Twelve were asking him about the parables.
translation:
  language: vi
  text: Khi Đức Giê-su ở riêng[a], những người ở quanh Ngài cùng với Nhóm Mười Hai hỏi Ngài về các dụ ngôn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “khi Ngài ở một mình.” Cách nói này chỉ bối cảnh riêng tư, tách khỏi đám đông; “những người ở quanh Ngài” là nhóm người theo Ngài, không nhất thiết chỉ Nhóm Mười Hai.'
    reason: Bảo toàn sắc thái của κατὰ μόνας và sự phân biệt cú pháp giữa οἱ περὶ αὐτὸν với τοῖς δώδεκα.
lexical_decisions:
- source_word: Καὶ ὅτε
  choice: Khi
  rationale: Trong tiếng Việt, quan hệ thời gian và mạch kể được diễn đạt tự nhiên bằng “Khi”; không cần dịch máy móc καί thành “Và” ở đầu câu.
- source_word: ἐγένετο κατὰ μόνας
  choice: Đức Chúa Jêsus ở riêng
  rationale: κατὰ μόνας là thành ngữ chỉ hoàn cảnh riêng tư, tách khỏi đám đông; “ở riêng” tự nhiên hơn “ở một mình” vì ngay sau đó các môn đồ đến hỏi Ngài.
- source_word: ἠρώτων
  choice: hỏi
  rationale: Thì chưa hoàn thành có thể gợi hành động đang diễn ra, nhưng tiếng Việt thường để ngữ cảnh thể hiện thể; “hỏi” là rõ ràng và không diễn giải quá mức thành “liên tục hỏi”.
- source_word: οἱ περὶ αὐτὸν
  choice: những người ở quanh Ngài
  rationale: Giữ hình ảnh và độ rộng của cụm Hy Lạp, chỉ nhóm môn đồ quanh Đức Chúa Jêsus mà không đồng nhất họ với Nhóm Mười Hai.
- source_word: σὺν τοῖς δώδεκα
  choice: cùng với Nhóm Mười Hai
  rationale: Thể hiện rõ sự đồng hành và sự phân biệt cú pháp giữa nhóm rộng hơn với Mười Hai sứ đồ.
- source_word: τὰς παραβολάς
  choice: các ẩn dụ
  rationale: Giữ số nhiều của bản văn SBLGNT; “ẩn dụ” là cách gọi ngắn gọn, quen thuộc trong văn phong Kinh Thánh tiếng Việt cho παραβολή.
theological_decisions:
- issue: Thành phần của nhóm đặt câu hỏi
  choice: Một nhóm môn đồ rộng hơn ở quanh Đức Chúa Jêsus, cùng với Nhóm Mười Hai, hỏi Ngài.
  alternative: Chỉ Nhóm Mười Hai hỏi Ngài; hoặc một nhóm riêng biệt đi cùng Nhóm Mười Hai hỏi Ngài.
  rationale: Cú pháp οἱ περὶ αὐτὸν σὺν τοῖς δώδεκα tự nhiên nhất khi chỉ những người ở quanh Ngài cùng với Nhóm Mười Hai; bản dịch không thu hẹp toàn bộ nhóm thành Mười Hai.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Chúa Jêsus/Ngài” theo lối xưng gọi Kinh Thánh trang nghiêm; “ở riêng” nhấn mạnh hoàn cảnh riêng tư mà không tạo mâu thuẫn với việc các môn đồ hiện diện.
