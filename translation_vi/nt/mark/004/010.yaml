  verdict: revise
  source_fidelity: 'Bản nháp phản ánh đúng trật tự chính của câu: bối cảnh riêng tư, một nhóm rộng hơn quanh Đức Giê-su cùng với Nhóm Mười Hai, và đối tượng là số nhiều “các dụ ngôn”. Tuy nhiên, “ẩn dụ” không phải là tương đương chuẩn cho παραβολαί trong ngữ cảnh này; “dụ ngôn” chính xác hơn. Cần thêm chú thích để làm rõ rằng “ở riêng” không buộc phải có nghĩa là hoàn toàn không có ai bên Ngài, đồng thời bảo toàn sự phân biệt giữa nhóm quanh Ngài và Nhóm Mười Hai.'
  naturalness: Câu sửa giữ văn phong Việt hiện đại, trang trọng và mạch lạc. “Khi Đức Giê-su ở riêng” là cách nói tự nhiên trong văn cảnh Kinh Thánh; dấu phẩy giúp nhận rõ cụm “cùng với Nhóm Mười Hai” đi với chủ ngữ. “Giê-su” là chính tả hiện hành, trung tính và phù hợp với tiếng Việt chuẩn hiện đại hơn “Jêsus”.
  terminology: Dùng “Đức Giê-su/Ngài” giữ sắc thái kính trọng mà không lệ thuộc một truyền thống phiên âm riêng. “Nhóm Mười Hai” là thuật ngữ thông dụng cho τοῖς δώδεκα. “Dụ ngôn” là thuật ngữ Kinh Thánh thích hợp cho παραβολή; “ẩn dụ” chỉ một biện pháp tu từ và có thể thu hẹp hoặc đổi thể loại của từ gốc.
