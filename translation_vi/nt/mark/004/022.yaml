revisions:
- from: Vì chẳng có gì bị che giấu mà không nhằm được tỏ lộ, cũng chẳng có gì trở nên kín khuất mà không nhằm được đưa ra ánh sáng.[a]
  to: Vì chẳng có gì bị che giấu, ngoại trừ là để được tỏ lộ; cũng chẳng có gì trở nên ẩn kín, ngoại trừ là để ra nơi công khai.[a]
  rationale: Bản sửa thay cấu trúc không tự nhiên bằng “ngoại trừ là để”, qua đó giữ được lực ngoại lệ và sắc thái mục đích của ἐὰν μὴ ἵνα mà không khẳng định quá mức về tác nhân. Vế cuối được chỉnh theo động từ chủ động “đến/ra” của ἔλθῃ, còn chú thích tiếp tục bảo tồn cách hiểu theo sắc thái kết quả.
  reviewer_model: gpt-5.6-terra
