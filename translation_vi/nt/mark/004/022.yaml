source:
  edition: SBLGNT
  text: οὐ γάρ ἐστιν ⸀κρυπτὸν ἐὰν μὴ ⸀ἵνα φανερωθῇ, οὐδὲ ἐγένετο ἀπόκρυφον ἀλλ’ ἵνα ⸂ἔλθῃ εἰς φανερόν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/022.yaml
  text: For nothing is hidden except to be revealed[b][a], nor has anything become concealed except to come to light.
translation:
  language: vi
  text: Vì chẳng có gì bị che giấu, ngoại trừ là để được tỏ lộ; cũng chẳng có gì trở nên ẩn kín, ngoại trừ là để ra nơi công khai.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Vì chẳng có gì bị che giấu mà rồi không được tỏ lộ, cũng chẳng có gì trở nên ẩn kín mà rồi không ra nơi công khai.” Hai mệnh đề Hy Lạp dùng ἵνα có thể mang sắc thái mục đích hoặc kết quả.'
    reason: alternative_reading
lexical_decisions:
- source_word: κρυπτόν
  choice: bị che giấu
  rationale: Diễn đạt trạng thái bị giấu đi, tự nhiên trong tiếng Việt và tạo thế đối lập rõ với “được tỏ lộ”.
- source_word: ἐὰν μὴ ἵνα
  choice: mà không nhằm
  rationale: Giữ cấu trúc ngoại lệ cùng sắc thái mục đích của ἵνα, đồng thời vẫn để ngỏ khả năng sắc thái kết quả được nêu trong chú thích.
- source_word: φανερωθῇ
  choice: được tỏ lộ
  rationale: Giữ thể bị động và ý nghĩa trở nên thấy được hoặc được biết đến; cách nói trang trọng nhưng dễ hiểu.
- source_word: ἀπόκρυφον
  choice: kín khuất
  rationale: Phân biệt nhẹ với κρυπτόν mà vẫn giữ phép song song, diễn tả điều nằm ngoài tầm thấy.
- source_word: ἐγένετο
  choice: trở nên
  rationale: Phản ánh ý chuyển sang một trạng thái trong γίνομαι, thay vì diễn giải thành một hành động có tác nhân rõ ràng.
- source_word: ἔλθῃ εἰς φανερόν
  choice: được đưa ra ánh sáng
  rationale: Là thành ngữ tiếng Việt tự nhiên, truyền đạt việc điều kín khuất trở nên công khai và phần nào giữ hình ảnh chuyển động của ἔλθῃ εἰς.
- source_word: γάρ
  choice: Vì
  rationale: Giữ chức năng giải thích và liên kết câu này với lời nói ngay trước đó.
theological_decisions:
- issue: Sắc thái mục đích hay kết quả trong hai mệnh đề ἵνα
  choice: Dùng “mà không nhằm” để ưu tiên sắc thái mục đích.
  alternative: 'Có thể hiểu theo sắc thái kết quả: “mà rồi không được tỏ lộ … mà rồi không được đưa ra ánh sáng.”'
  rationale: ἵνα thường biểu thị mục đích nhưng trong Hy Lạp Koinē cũng có thể nghiêng về kết quả. Bản chính giữ sắc thái mục đích mà không xác định tác nhân hay diễn giải thành một khẳng định riêng về sự tiền định; chú thích bảo tồn khả năng còn lại.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng vừa phải và dễ hiểu. Phép song song của câu Hy Lạp được giữ bằng hai vế “chẳng có gì…”, còn “che giấu / kín khuất” tránh lặp máy móc nhưng vẫn duy trì sự tương ứng.
